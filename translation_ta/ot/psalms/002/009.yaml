    reason: lexical_alternative
lexical_decisions:
- source_word: תְּרֹעֵם
  choice: அவர்களை நொறுக்குவீர்
  rationale: மசோரா உயிர்க்குறிப்பும், இணைவரியில் வரும் ‘சிதறடிப்பீர்’ என்பதும் அழிவுத் தீர்ப்பைக் குறிக்கும் ‘நொறுக்குவீர்’ என்ற பொருளை வலுப்படுத்துகின்றன. இருப்பினும், மெய்யெழுத்து மரபிலுள்ள சாத்தியமான வேறுபாடும் சில பழங்கால மொழிபெயர்ப்புகளும் ‘மேய்ப்பீர்/ஆள்வீர்’ என்ற வாசிப்பை ஆதரிப்பதால் அது அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: בְּשֵׁבֶט
  choice: செங்கோலால்
  rationale: שֵׁבֶט என்பது கோல், தடி அல்லது அரச செங்கோல் எனப் பொருள்படலாம். சங்கீதம் 2-ன் அரசச் சூழலில் ‘செங்கோல்’ அரச அதிகாரத்தை இயல்பாக வெளிப்படுத்துகிறது; தீர்ப்பின் கருவி என்ற படிமத்தையும் தக்கவைக்கிறது.
- source_word: בַּרְזֶל
  choice: இரும்பு
  rationale: செங்கோலின் வலிமையையும் தீர்ப்பின் கடுமையையும் காட்டும் நேரடியான பொருட்பெயர்.
- source_word: כִּכְלִי
  choice: பாண்டத்தைப்போல்
  rationale: כְּלִי என்பது பொதுவாக ஒரு பாத்திரம் அல்லது பொருளைக் குறிக்கும். குயவனுடன் சேர்ந்து வருவதால் ‘பாண்டம்’ என்பது தமிழில் இயல்பானதும் சூழலுக்குப் பொருத்தமானதும் ஆகும்.
- source_word: יוֹצֵר
  choice: குயவனின்
  rationale: இந்தச் சொற்றொடரில் יוֹצֵר பாண்டங்களை உருவாக்கும் குயவனைக் குறிக்கிறது.
- source_word: תְּנַפְּצֵם
  choice: அவர்களைச் சிதறடிப்பீர்
  rationale: வன்மையாக உடைத்துத் துண்டுகளாக்குவதை வினைச்சொல் குறிக்கிறது. ‘சிதறடிப்பீர்’ பாண்டத்தின் உவமையுடன் இயல்பாகப் பொருந்தி, செயலின் தீவிரத்தையும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: முதல் வினைச்சொல் அரச ஆட்சியையா அல்லது அழிவுத் தீர்ப்பையா சித்தரிக்கிறது?
  choice: 'அழிவுத் தீர்ப்பு: ‘அவர்களை நொறுக்குவீர்’'
  alternative: 'அரச ஆட்சி அல்லது மேய்த்தல்: ‘அவர்களை மேய்ப்பீர்’ / ‘அவர்களை ஆள்வீர்’'
  rationale: மசோரா உரையின் உயிர்க்குறிப்பும் ‘அவர்களைச் சிதறடிப்பீர்’ என்ற இணைவரியும் அழிவுத் தீர்ப்பை ஆதரிக்கின்றன. சில பழங்கால மொழிபெயர்ப்பு மரபுகளிலும் வெளிப்படுத்தின விசேஷத்தின் மேற்கோள்களிலும் காணப்படும் ‘மேய்ப்பீர்/ஆள்வீர்’ என்ற முக்கிய மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டு வாசிப்புக்கு ஏற்ற கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. ஒருமை இரண்டாம் நபருக்கான ‘-வீர்’ வடிவம் அரசரிடம் உரையாடும் சூழலின் கண்ணியத்தைத் தக்கவைக்கிறது. ‘நொறுக்குவீர் / சிதறடிப்பீர்’ என்ற இணைப்பு எபிரெயக் கவிதையின் தீவிரமான ஒத்திசைவைப் பாதுகாக்கிறது.
