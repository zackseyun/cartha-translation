  text: תְּ֭רֹעֵ/ם בְּ/שֵׁ֣בֶט בַּרְזֶ֑ל כִּ/כְלִ֖י יוֹצֵ֣ר תְּנַפְּצֵֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/009.yaml
  text: You will break them with an iron scepter[b][a]; like a potter’s vessel you will shatter them.
translation:
  language: ta
  text: இரும்புச் செங்கோலால்[b] அவர்களை நொறுக்குவீர்[a]; குயவனின் பாத்திரம்போல் அவர்களை உடைத்துத் துண்டாக்குவீர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில பண்டைய மொழிபெயர்ப்புகளில் காணப்படும் மாற்று உரைமரபின்படி, “இரும்புச் செங்கோலால் அவர்களை மேய்ப்பீர்” அல்லது “இரும்புச் செங்கோலால் அவர்களை ஆள்வீர்” என்றும் மொழிபெயர்க்கலாம். இந்த வாசிப்பு வெளிப்படுத்தல் நூலிலும் எதிரொலிக்கிறது.
    reason: alternative_reading
  - marker: b
