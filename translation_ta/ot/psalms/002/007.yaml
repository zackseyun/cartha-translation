source:
  edition: WLC
  text: אֲסַפְּרָ֗ה אֶֽ֫ל חֹ֥ק יְֽהוָ֗ה אָמַ֘ר אֵלַ֥/י בְּנִ֥/י אַ֑תָּה אֲ֝נִ֗י הַ/יּ֥וֹם יְלִדְתִּֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/007.yaml
  text: 'I will declare the decree of Yahweh: He said to me[a], “You are my Son[b]; today I have begotten you.”'
translation:
  language: ta
  text: 'யாவேயின் ஆணையை நான் அறிவிப்பேன்: அவர் என்னிடம், “நீ என் மகன்[a]; இன்று நான் உன்னைப் பிறப்பித்தேன்[b]” என்றார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் பெரிய எழுத்து–சிறிய எழுத்து வேறுபாடு இல்லை. இங்கு தாவீதிய அரசனுக்குரிய மகன்நிலை நேரடிச் சூழலில் உள்ளது; பின்னைய வேதாகமப் பயன்பாடு இந்த வசனத்துக்கு மேசிய முக்கியத்துவத்தையும் அளிக்கிறது.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “இன்று நான் உனக்குத் தந்தையானேன்.” எபிரெயம் இன்னும் நேரடியாகப் பிறப்பித்தல் மொழியைப் பயன்படுத்துகிறது; அது அரச முடிசூட்டல் அல்லது மகனாக ஏற்றுக்கொள்ளுதல் போன்ற உருவகங்களை நினைவூட்டக்கூடும் என்பதால், அந்த மொழி முதன்மை உரையில் காக்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲסַפְּרָה
  choice: நான் அறிவிப்பேன்
  rationale: இந்த வடிவம் ஓர் அரசருக்குரிய ஆணையை முறைப்படி பிரகடனம் செய்வதை அறிமுகப்படுத்துகிறது; ‘சொல்வேன்’ என்பதைவிட ‘அறிவிப்பேன்’ இச்சூழலின் கம்பீரத்துக்கு ஏற்றது.
- source_word: אֶל חֹק
  choice: ஆணையை
  rationale: אֶל இங்கு அறிவிக்கப்படும் பொருளை அறிமுகப்படுத்துகிறது; חֹק அரசரின் அதிகாரபூர்வ ஆணையைச் சுட்டுவதால், இயல்பான தமிழில் இவை ஒன்றிணைத்து மொழிபெயர்க்கப்பட்டுள்ளன.
- source_word: יְהוָה
  choice: யாவே
  rationale: தேவனுடைய தனிப்பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אָמַר אֵלַי
  choice: அவர் என்னிடம் … என்றார்
  rationale: முந்தைய சொற்றொடரில் உள்ள யாவேதான் வினையின் எழுவாய்; தமிழ் மேற்கோள் அமைப்புக்கு ஏற்ப ‘என்றார்’ இறுதியில் வைக்கப்பட்டுள்ளது.
- source_word: בְּנִי אַתָּה
  choice: நீ என் மகன்
  rationale: எபிரெயச் சொல்லமைப்பின் பொருளை நேராகவும் இயல்பான தமிழிலும் தருகிறது. தமிழில் பெரிய/சிறிய எழுத்து வேறுபாடு இல்லாததால், ஆங்கிலத்தில் உள்ள capitalization சார்ந்த விளக்கத்தை தமிழில் செயற்கையாகக் குறிக்கவில்லை.
- source_word: הַיּוֹם
  choice: இன்று
  rationale: காலத்துக்குரிய வலியுறுத்தலை இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: יְלִדְתִּיךָ
  choice: நான் உன்னைப் பிறப்பித்தேன்
  rationale: ילד என்பதன் பிறப்பு/தந்தைவழிப் பிறப்பித்தல் உருவகத்தைப் பாதுகாக்கிறது; முடிசூட்டல், உடன்படிக்கை சார்ந்த மகனாக்குதல், அல்லது மேசிய நிறைவேற்றம் ஆகியவற்றில் ஒன்றாக மட்டும் பொருளைச் சுருக்கவில்லை.
theological_decisions:
- issue: בְּנִי என்பதில் அரச மகன்நிலையும் மேசிய முக்கியத்துவமும்
  choice: நீ என் மகன்
  alternative: நீ எனக்கு மகனாக இருக்கிறாய்
  rationale: உடனடி சூழல் தாவீதிய அரசனைச் சார்ந்தது; பின்னைய வேதாகமப் பயன்பாடு இதை மேசியாவோடும் இணைக்கிறது. தமிழ் எழுத்துமுறையில் capitalization இல்லாததால், மொழிபெயர்ப்பு எந்த ஓர் விளக்கத்தையும் எழுத்துருவால் திணிக்காமல் மூலத்தின் சொல்லாட்சியைப் பாதுகாக்கிறது.
- issue: “இன்று நான் உன்னைப் பிறப்பித்தேன்” என்பதன் பொருள்
  choice: பிறப்பித்தல் மொழியை அப்படியே வைத்தல்
  alternative: இன்று நான் உனக்குத் தந்தையானேன்
  rationale: எபிரெயம் பிறப்பு/பிறப்பித்தல் உருவகத்தைப் பயன்படுத்துகிறது. இது அரச முடிசூட்டல், உடன்படிக்கை சார்ந்த மகனாக்குதல், அல்லது மேசிய நிறைவேற்றம் ஆகியவற்றில் எதைக் குறிக்கிறது என்பதை மொழிபெயர்ப்பு தனியாகத் தீர்மானிக்காமல் அதன் இறையியல் அழுத்தத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதத்தின் அரச மற்றும் அதிகாரபூர்வ தொனியைத் தக்கவைக்கும் கண்ணியமான நடை. ‘ஆணை’, ‘அறிவிப்பேன்’ என்பவை தெளிவும் கம்பீரமும் தருகின்றன; அரிதான பழந்தமிழ் அல்லது பிரிவுசார் இறையியல் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
