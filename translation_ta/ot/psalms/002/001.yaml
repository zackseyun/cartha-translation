translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய இணைநிலையை இரண்டு வினாக்களாக அமைத்தது தமிழில் தெளிவையும் சொல்லாட்சிச் சக்தியையும் தருகிறது. பன்மை உயிரற்ற ‘தேசங்கள்’ என்பதற்கு ‘கொந்தளிக்கின்றன’ என்றும் மனிதக் கூட்டான ‘மக்கள்’ என்பதற்கு மரியாதைப் பன்மை ‘திட்டமிடுகின்றனர்’ என்றும் இயல்பான பொருத்தம் வழங்கப்பட்டுள்ளது.
