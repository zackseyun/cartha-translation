  source_fidelity: மூல எபிரெயத்தின் வினாவுரையும் இணைநிலை அமைப்பும் நன்றாகப் பிரதிபலிக்கப்படுகின்றன. “தேசங்கள்” גוֹיִם-ஐ அரசியல் மக்கள்கூட்டங்களாகவும், “மக்கள்” לְאֻמִּים-ஐ இணையான வேறுபட்ட கூட்டுப்பெயராகவும் இயல்பாக வழங்குகின்றன. “கொந்தளிக்கின்றன” רָגְשׁוּ-வின் கலக்கமான, பகைமையான எழுச்சியைச் சரியாகக் காட்டுகிறது. “பயனற்றதைத் திட்டமிடுகின்றனர்” יֶהְגּוּ רִיק-ஐ சூழலுக்கேற்றவாறு மொழிபெயர்க்கிறது; அதன் பிற சாத்தியப் பொருள்கள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.
  naturalness: நவீனத் தரத் தமிழில் நடை தெளிவாகவும் கண்ணியமாகவும் உள்ளது. இரண்டு குறுவினாக்களாக அமைத்தல் தமிழில் இயல்பான வலியுறுத்தலைத் தருகிறது. “தேசங்கள்” என்பதற்கு நடுநிலைப் பன்மை வினையும் “மக்கள்” என்பதற்கு மனிதப் பன்மை வினையும் பயன்படுத்தப்பட்டிருப்பது நல்ல இலக்கணப் பொருத்தம்.
