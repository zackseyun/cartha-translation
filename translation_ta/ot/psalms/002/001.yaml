  text: לָ֭/מָּה רָגְשׁ֣וּ גוֹיִ֑ם וּ֝/לְאֻמִּ֗ים יֶהְגּוּ רִֽיק־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/001.yaml
  text: Why do the nations rage[a], and the peoples plot in vain?
translation:
  language: ta
  text: தேசங்கள் ஏன் கொந்தளிக்கின்றன? மக்கள் ஏன் பயனற்றதைத் திட்டமிடுகின்றனர்?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வெறுமையைச் சிந்திக்கின்றனர்,” “வெறுமையை முணுமுணுக்கின்றனர்,” அல்லது வழக்கமாக, “வீணாகச் சதித்திட்டம் தீட்டுகின்றனர்.” எபிரெய வினை முணுமுணுப்பதையும் ஆழ்ந்து சிந்திப்பதையும் திட்டமிடுவதையும் குறிக்கலாம்; பெயர்ச்சொல் வெறுமை, வீண் தன்மை அல்லது பயனற்ற ஒன்றைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: ஏன்
  rationale: காரணத்தை வினவும் சொல்லின் இயல்பான நவீனத் தமிழ் வடிவம்; வினாவின் சொல்லாட்சிச் செறிவையும் காக்கிறது.
- source_word: רָגְשׁוּ
  choice: கொந்தளிக்கின்றன
  rationale: கூட்டங்களின் அமைதியற்ற ஆரவாரம், கலகம், பகைமையான எழுச்சி ஆகிய அடிப்படை உணர்வுகளை வெளிப்படுத்துகிறது; ‘சதிசெய்கின்றன’ என்பதைவிட குறைவாக விளக்கவுரை சேர்க்கிறது.
- source_word: גוֹיִם
  choice: தேசங்கள்
  rationale: இங்கு அரசியல் மக்களினங்களைக் குறிக்கும் பொதுவான சொல்; பிற்கால சமயப் பிரிவுணர்வைத் தவிர்க்கிறது.
- source_word: לְאֻמִּים
  choice: மக்கள்
  rationale: ‘தேசங்கள்’ என்பதற்கு இணையாக இருந்தாலும் தனித்த கூட்டு மக்களைக் குறிக்கும் எபிரெய இணைநிலையைத் தமிழில் இயல்பாகக் காக்கிறது.
- source_word: יֶהְגּוּ
  choice: திட்டமிடுகின்றனர்
  rationale: சூழலில் பகைமையான எண்ணத்தை வகுப்பது பொருத்தமானது; ஆயினும் மூல வினை முணுமுணுத்தல், சிந்தித்தல் போன்ற பொருள்களையும் கொள்ளக்கூடியதால் அந்த விரிவு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: רִיק
  choice: பயனற்றதை
  rationale: ‘வெறுமை, வீண் தன்மை, பலனற்றது’ என்று பொருள்படும் பெயர்ச்சொல்லை வினையின் நேரடிச் செயப்படுபொருளாகக் காக்கிறது.
