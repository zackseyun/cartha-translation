source:
  edition: WLC
  text: עִבְד֣וּ אֶת יְהוָ֣ה בְּ/יִרְאָ֑ה וְ֝/גִ֗ילוּ בִּ/רְעָדָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/011.yaml
  text: Serve Yahweh with fear[b][a], and rejoice with trembling.
translation:
  language: ta
  text: யாவேவுக்குப் பயத்துடன்[a] சேவை செய்யுங்கள்; நடுக்கத்துடன் மகிழுங்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பயபக்தியுடன்’; எபிரெயச் சொல் கடவுளுக்கு முன் கொள்ளும் அச்சம் அல்லது ஆழ்ந்த வியப்பையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘களிகூருங்கள்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: עִבְדוּ
  choice: பணிசெய்யுங்கள்
  rationale: עבד என்பதன் பன்மை ஏவல் வடிவம். இங்கு யாவேவுக்கு விசுவாசத்துடனும் வழிபாட்டு உணர்வுடனும் செய்யும் சேவையை விரிவாகக் குறிக்கிறது; ‘வழிபடுங்கள்’ என்று மட்டும் மொழிபெயர்த்தால் அதன் பொருள் தேவையின்றிச் சுருங்கிவிடும்.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது ஒரு பட்டப்பெயரால் மாற்றப்படாமல், எபிரெயத் தேவநாமத்தின் தமிழாக்க ஒலிபெயர்ப்பாக வழங்கப்படுகிறது.
- source_word: בְּיִרְאָה
  choice: பயத்துடன்
  rationale: יִרְאָה என்பது பயம், அச்சம், பயபக்தி ஆகிய பொருள்களை ஏற்கக்கூடும். ‘பயத்துடன்’ என்பது மூலத்தின் வலிமையைப் பாதுகாக்கிறது; ‘பயபக்தியுடன்’ என்பது சாத்தியமான மாற்றுப் பொருள்.
- source_word: וְגִילוּ
  choice: மகிழுங்கள்
  rationale: גיל என்பது மகிழ்தல் அல்லது களிகூர்தலைக் குறிக்கிறது. ‘மகிழுங்கள்’ என்பது இயல்பான நவீனத் தமிழ் ஏவல் வடிவம்; மூலத்தின் உணர்வுவலிமையைத் தெளிவாகத் தருகிறது.
- source_word: בִּרְעָדָה
  choice: நடுக்கத்துடன்
  rationale: רְעָדָה என்பது பயம் அல்லது பிரமிப்பால் ஏற்படும் நடுக்கத்தைக் குறிக்கிறது. ‘நடுக்கத்துடன்’ என்பது மகிழ்ச்சியோடு இணைக்கப்பட்டுள்ள மூலத்தின் பதற்றமிக்க முரணைத் தக்கவைக்கிறது.
theological_decisions:
- issue: மகிழ்ச்சியையும் பயமுள்ள கீழ்ப்படிதலையும் இணைக்கும் இரு கட்டளைகள்
  choice: ‘பயத்துடன் பணிசெய்யுங்கள்; நடுக்கத்துடன் மகிழுங்கள்’ என்று இரண்டையும் அவற்றின் பதற்றத்தோடு தக்கவைத்தல்
  alternative: ‘பயபக்தியுடன் வழிபட்டு, நடுக்கத்துடன் களிகூருங்கள்’ என்று வழிபாட்டு மகிழ்ச்சியை முன்னிறுத்துதல்
  rationale: எபிரெய உரை பயத்தையும் மகிழ்ச்சியையும் விளக்கமின்றி அடுத்தடுத்து வைக்கிறது. அந்த இறையியல் பதற்றத்தைத் தீர்த்துவிடாமல் மொழிபெயர்ப்பு பாதுகாக்கிறது.
- issue: יְהוָה என்ற தேவநாமத்தை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் உள்ள தனிப்பட்ட தேவநாமத்தை ஒரு பட்டப்பெயரால் மாற்றாமல் தமிழில் ஒலிபெயர்த்துள்ளது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், பொதுவாசகர்களுக்குப் புரியக்கூடிய கண்ணியமான பன்மை ஏவல் நடை பயன்படுத்தப்பட்டுள்ளது. ‘பயத்துடன்’ மற்றும் ‘நடுக்கத்துடன்’ என்ற சொற்கள் கவிதை இணைப்பையும் மூலத்தின் இறையியல் பதற்றத்தையும் காக்கின்றன.
