  rationale: חָרוֹן-இல் உள்ள வெம்மை அல்லது எரிதல் உருவகத்தையும், முந்தைய ‘கோபம்’ என்பதைக் காட்டிலும் தீவிரமான உணர்வையும் காக்கிறது.
- source_word: יְבַהֲלֵמוֹ
  choice: அவர்களைத் திகிலடையச் செய்வார்
  rationale: בהל என்பதன் பியேல் வடிவம் திடீர் அச்சம், கலக்கம் அல்லது பீதியை உண்டாக்குவதைக் குறிக்கிறது; ‘திகிலடையச் செய்வார்’ தீர்ப்பின் வலிமையை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: இறைவனுடைய கோபத்தை மனித உணர்வுச் சொற்களால் விவரித்தல்
  choice: ‘கோபம்’ மற்றும் ‘கொழுந்துவிட்டு எரியும் சினம்’ என்ற வலுவான மொழியைத் தணிக்காமல் தக்கவைத்தல்
  alternative: ‘அதிருப்தி’ அல்லது பொதுவான ‘தீர்ப்பு’ என்று மென்மைப்படுத்துதல்
  rationale: மூலவசனம் கலகத்திற்கு எதிரான இறைவனுடைய தனிப்பட்ட எதிர்ப்பை வலுவான தீர்ப்பு மொழியில் வெளிப்படுத்துகிறது. அதை மென்மைப்படுத்துவது மூலத்தின் இறையியல் அழுத்தத்தைக் குறைக்கும்.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பாகவும், சங்கீதத்திற்கேற்ற கண்ணியமான நடையிலும் அமைக்கப்பட்டுள்ளது. மரியாதைப் பன்மை மூலம் இறைவனைக் குறிப்பிடுகிறது; எபிரெய இணைநிலையையும் கோபத்தின் தீவிரமாதலையும் காக்கிறது.
