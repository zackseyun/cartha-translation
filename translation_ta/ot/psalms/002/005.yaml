  choice: அப்போது
  rationale: அடுத்ததாக நிகழும் இறைவனுடைய பதிலைச் சுட்டும் கால வினையடை; சங்கீதத்தின் நிகழ்வுப்போக்கை இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: יְדַבֵּר
  choice: பேசுவார்
  rationale: דבר என்பதன் பியேல் முற்றுப்பெறா வடிவம்; சூழலில் அடுத்து நிகழவிருக்கும் பதிலைச் சுட்டுவதால் எதிர்கால வடிவம் பொருத்தமானது.
- source_word: אֵלֵימוֹ
  choice: அவர்களிடம்
  rationale: முந்தைய வசனங்களில் கூறப்பட்ட கலகக்கார அரசர்களையும் ஆட்சியாளர்களையும் குறிக்கும் மூன்றாம் நபர் பன்மை பின்னொட்டை நேர்த்தியாக வெளிப்படுத்துகிறது.
- source_word: בְאַפּוֹ
  choice: தமது கோபத்தில்
  rationale: אַף என்பதன் சொற்பொருள் ‘மூக்கு’ என்றாலும், இங்கு அது கோபத்தைக் குறிக்கும் எபிரெய மரபுத்தொடர்; தமிழில் அதன் பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: וּבַחֲרוֹנוֹ
