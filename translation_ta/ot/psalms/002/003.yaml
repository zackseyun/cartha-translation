lexical_decisions:
- source_word: נְנַתְּקָה
  choice: அறுத்தெறிவோம்
  rationale: முதல் நபர் பன்மை விருப்ப/தூண்டல் வடிவம்; கட்டுப்பாட்டைப் பலவந்தமாக அறுத்து அகற்றும் உறுதியை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מֹוסְרוֹתֵימוֹ
  choice: அவர்களுடைய கட்டுகள்
  rationale: கட்டுப்படுத்தும் பிணைப்புகள் அல்லது விலங்குகளைக் குறிக்கும் பன்மைச் சொல். ‘கட்டுகள்’ என்பது உருவகத்தைத் தக்கவைத்தபடி, அவை உலோகச் சங்கிலிகளே என்று தேவையின்றி குறுக்குவதில்லை.
- source_word: וְנַשְׁלִיכָה
  choice: வீசியெறிவோம்
  rationale: இரண்டாவது முதல் நபர் பன்மை விருப்ப/தூண்டல் வடிவம்; வலுவாகத் தள்ளி அகற்றுவதைக் காட்டுகிறது.
- source_word: מִמֶּנּוּ
  choice: நம்மிடமிருந்து
  rationale: முன்னிடைச்சொல்லும் முதல் நபர் பன்மை விகுதியும் பேச்சாளர்களிடமிருந்து அகற்றப்படுவதைத் தெளிவாகக் காட்டுகின்றன.
- source_word: עֲבֹתֵימוֹ
  choice: அவர்களுடைய கயிறுகள்
  rationale: தடித்த கயிறுகள், வடங்கள் அல்லது பிணைக்கும் கயிறுகளைக் குறிக்கும் சொல்; ‘கயிறுகள்’ நவீன வாசகருக்குத் தெளிவாகவும் இணை உருவகத்திற்கு ஏற்றதாகவும் உள்ளது.
theological_decisions:
- issue: இறை/அரச அதிகாரத்தின் கட்டுப்பாட்டைக் குறிக்கும் உருவகம்
  choice: ‘கட்டுகள்’, ‘கயிறுகள்’ என்ற கண்கூடான உருவக மொழியை அப்படியே தக்கவைத்தல்
  alternative: ‘அடிமைத்தளைகள்’, ‘ஒடுக்குமுறைப் பிணைப்புகள்’ போன்ற விளக்கமான சொற்களைப் பயன்படுத்துதல்
  rationale: சூழலில் பேசுகிறவர்கள் ஆண்டவருக்கும் அவர் அபிஷேகம் செய்தவருக்கும் எதிராகக் கிளர்ந்தெழுகிறார்கள்; ஆனால் இவ்வசனம் அவர்களுடைய பார்வையை உருவகமாக மட்டுமே தருகிறது. அந்தக் கட்டுப்பாடு நியாயமானதா ஒடுக்குமுறையானதா என்பதை மொழிபெயர்ப்பு தானாகத் தீர்மானிக்காமல் கவித்துவத் தீவிரத்தையும் இறையியல் பதற்றத்தையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; கவிதைக்கேற்ற கண்ணியமும் கிளர்ச்சியான பேச்சின் வலிமையும் காக்கப்பட்டுள்ளன. இரு எபிரெய விருப்ப/தூண்டல் வினைகளும் ‘-வோம்’ வடிவில் இணையாக வழங்கப்பட்டுள்ளன. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
