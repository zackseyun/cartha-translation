    reason: lexical_alternative
lexical_decisions:
- source_word: זֶרַע
  choice: சந்ததியினர்
  rationale: இங்கு ஒருமை வடிவிலுள்ள எபிரெயச் சொல், ஆபிரகாமின் வழிவந்தவர்களை ஒரு கூட்டமாகக் குறிக்கிறது. ‘சந்ததியினர்’ என்பது நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது; ‘விதை’ என்ற அடிப்படை உருவகத்தை அடிக்குறிப்பு பதிவு செய்கிறது.
- source_word: עַבְדּוֹ
  choice: அவருடைய ஊழியன்
  rationale: இச்சூழலில் ஆபிரகாம் கடவுளுக்குச் சேவை செய்பவர் என்ற மதிப்புக்குரிய அடையாளமே முன்னிலைப்படுகிறது; அடிமைத்தனத்தின் நுண்பொருள் இங்கு முதன்மையானதல்ல.
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: எபிரெய மூலத்தின் ஆண்பால் பன்மையை நேரடியாகப் பாதுகாக்கிறது. இத்தொடர் யாக்கோபின் விரிந்த வழிமரபையும் குறிக்கலாம் என்பதை அடிக்குறிப்பு தெரிவிக்கிறது.
- source_word: בְּחִירָיו
  choice: அவரால் தேர்ந்தெடுக்கப்பட்டவர்கள்
  rationale: பன்மை வடிவம் கடவுள் தேர்ந்தெடுத்த மக்களைக் குறிக்கிறது. செயப்பாட்டு அமைப்பு நவீனத் தமிழில் தெளிவாக இருப்பதோடு, பிற்காலக் கோட்பாட்டுச் சுமையுள்ள சொல்லாட்சியைத் தவிர்க்கிறது.
- source_word: זֶרַע אַבְרָהָם // בְּנֵי יַעֲקֹב
  choice: ஆபிரகாமின் சந்ததியினர் // யாக்கோபின் மகன்கள்
  rationale: இணையான இரு அழைப்புகளையும் ஒன்றாகக் கலந்து விடாமல், மூலத்தின் ஒத்திசை இணைநிலையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: ‘அவருடைய ஊழியன்’ மற்றும் ‘அவரால் தேர்ந்தெடுக்கப்பட்டவர்கள்’ என்பவற்றிலுள்ள சுட்டின் குறிப்பு
  choice: 'இரண்டும் கடவுளைக் குறிக்கின்றன: ஆபிரகாம் கடவுளுடைய ஊழியன்; யாக்கோபின் வழிவந்தவர்கள் கடவுளால் தேர்ந்தெடுக்கப்பட்டவர்கள்.'
  alternative: இலக்கண ரீதியில் மிக அருகிலுள்ள முற்பிதாவைச் சுட்டுவதாக இயந்திரத்தனமாக வாசிக்கலாம்; ஆனால் சூழலில் அது சாத்தியம் குறைந்தது.
  rationale: சங்கீதத்தின் உடன்படிக்கைச் சூழலும் வேதாகமத்தின் பரந்த சொல்லாட்சியும் ஆபிரகாமைக் கடவுளுடைய ஊழியனாகவும், இஸ்ரவேலைக் கடவுள் தேர்ந்தெடுத்த மக்களாகவும் காட்டுகின்றன. மொழிபெயர்ப்பு இதைத் தெளிவாக்குகிறது; கூடுதல் கோட்பாட்டைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், கவிதைக்குரிய கண்ணியத்துடன் நேரடி அழைப்புமுறை (‘-ரே’, ‘-களே’) பயன்படுத்தப்பட்டுள்ளது. முதல் வரிக்கும் இரண்டாம் வரிக்கும் இடையிலான எபிரெய இணைநிலை காக்கப்பட்டுள்ளது. ‘ஊழியன்’ மரியாதைக்குரிய சேவை உறவை இயல்பாக வெளிப்படுத்துகிறது.
