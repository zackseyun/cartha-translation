translation:
  language: ta
  text: 'அவருடைய ஊழியனாகிய ஆபிரகாமின் சந்ததியினரே[a],

    யாக்கோபின் மகன்களே[b], அவருடைய தேர்ந்தெடுக்கப்பட்டவர்களே[c],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஆபிரகாமின் வித்தே.’ எபிரெய மொழியில் ஒருமையாக உள்ள இச்சொல், ஆபிரகாமின் வழிவந்தவர்களை ஒரு கூட்டமாகக் குறிக்கலாம்.
