  - marker: b
    text: அல்லது, ‘யாக்கோபின் பிள்ளைகளே.’ எபிரெய மூலத்திலுள்ள ஆண்பால் பன்மை வடிவைப் பாதுகாக்க ‘மகன்களே’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: c
