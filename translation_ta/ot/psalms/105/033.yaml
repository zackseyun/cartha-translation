  text: וַ/יַּ֣ךְ גַּ֭פְנָ/ם וּ/תְאֵנָתָ֑/ם וַ֝/יְשַׁבֵּ֗ר עֵ֣ץ גְּבוּלָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/033.yaml
  text: He struck their vines and their fig trees[a], and shattered the trees of their territory.
translation:
  language: ta
  text: அவர் அவர்களுடைய திராட்சைக்கொடிகளையும் அத்திமரங்களையும் அடித்தார்; அவர்களுடைய பிரதேசத்தின் மரங்களை முறித்துப்போட்டார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּךְ
  choice: அழித்தார்
  rationale: נכה என்பது அடித்தல் அல்லது தாக்குதல் என்பதைக் குறிக்கும். இங்கு ஆலங்கட்டி மழையால் பயிர்கள் நாசமான சூழலில், தமிழில் இயல்பாகவும் விளைவைத் தெளிவாகவும் தெரிவிக்க ‘அழித்தார்’ பொருந்துகிறது.
- source_word: גַּפְנָם
  choice: அவர்களுடைய திராட்சைக்கொடிகளை
  rationale: גֶּפֶן திராட்சைக்கொடியைக் குறிக்கிறது; பின்னொட்டு உடைமையைக் குறிக்கிறது. எபிரெயக் கூட்டுப்பொருளைத் தமிழில் இயல்பான பன்மையால் வழங்குகிறது.
- source_word: וּתְאֵנָתָם
  choice: அத்திமரங்களையும்
  rationale: תְּאֵנָה என்பது அத்திமரம். எபிரெயத்தில் ஒருமை வடிவம் இருந்தாலும், இணையான வேளாண் சொற்றொடரில் கூட்டுப்பொருள் கொண்டதால் தமிழில் பன்மை இயல்பானது.
- source_word: וַיְשַׁבֵּר
  choice: முறித்துப்போட்டார்
  rationale: שׁבר என்பதன் பியேல் வடிவம் வலுவாக உடைத்தல் அல்லது முறித்தலைக் குறிக்கிறது. ‘முறித்துப்போட்டார்’ மரங்களுக்கு ஏற்ற இயல்பான தமிழில் அதன் தீவிரத்தைத் தக்கவைக்கிறது.
- source_word: עֵץ
  choice: மரங்களை
  rationale: עֵץ என்பது மரம் அல்லது மரப்பொருள் எனலாம்; இச்சூழலில் நிலத்தில் வளர்ந்த மரங்களே குறிக்கப்படுகின்றன. கூட்டுப்பொருளைத் தமிழில் பன்மையாக வழங்குவது இயல்பு.
- source_word: גְּבוּלָם
  choice: அவர்களுடைய எல்லைக்குள் இருந்த
  rationale: גְּבוּל எல்லை, எல்லைக்குட்பட்ட பகுதி, அல்லது பிரதேசம் எனப் பொருள்படும். இங்கு மரங்கள் இருந்த பரப்பைக் குறிக்கும் வகையில் ‘எல்லைக்குள் இருந்த’ என்பது தெளிவான இயல்பான தமிழ்.
theological_decisions:
- issue: வினைகளின் மறைமுக எழுவாய்
  choice: ‘அவர்’ என்பது சூழலில் கர்த்தராகிய தேவனைக் குறிக்கிறது
  alternative: எழுவாயைக் குறிப்பிடாமல் வினையை மட்டும் வழங்குதல்
  rationale: எபிரெய வினைகள் மூன்றாம் நபர் ஆண்பால் ஒருமையில் உள்ளன; முந்தைய வசனச் சூழல் கர்த்தரின் செயல்களைத் தொடர்கிறது. தமிழில் தெளிவுக்காக ‘அவர்’ சேர்க்கப்படுகிறது; பெயரை மீண்டும் வெளிப்படையாகச் சேர்த்து மூலத்தை விட அதிகமாகக் குறிப்பிடவில்லை.
translation_notes:
  register: நவீனத் தரமான, எளிதில் புரியும், மரியாதைமிக்க தமிழ். வேளாண் சொற்கள் துல்லியமாக வைக்கப்பட்டுள்ளன; கவிதைநடையின் இணை அமைப்பும் வலுவான அழிவுச் செயலும் பாதுகாக்கப்பட்டுள்ளன.
