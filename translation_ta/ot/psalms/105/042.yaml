    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய செய்கைக்கான காரணத்தையோ விளக்கத்தையோ அறிமுகப்படுத்துகிறது; தமிழில் சங்கீதத்தின் தொடர்போட்டத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: זָכַר
  choice: நினைவுகூர்ந்தார்
  rationale: இது வெறும் மன நினைவை மட்டும் அல்லாமல், முன்பு உரைத்ததற்கேற்ப செயல்படுவதையும் சூழலில் உணர்த்தலாம். ஆயினும் அந்த விரிவான பொருளை முதன்மை உரைக்குள் சேர்க்காமல் எபிரெயச் சொல்லாட்சியைப் பாதுகாக்கிறது.
- source_word: דְּבַר
  choice: வார்த்தை
  rationale: சூழலில் இது வாக்குறுதியைக் குறித்தாலும், எபிரெயச் சொல் அடிப்படையில் ‘வார்த்தை’ என்பதே. அதனால் மூலத்தின் சொல் வடிவம் பாதுகாக்கப்படுகிறது.
- source_word: קָדְשׁוֹ
  choice: தமது பரிசுத்த
  rationale: ‘பரிசுத்த’ என்பது קֹדֶשׁ என்பதன் இறையியல் நிறையைப் பாதுகாக்கும், தமிழில் நிலைபெற்ற இயல்பான தெரிவாகும்.
- source_word: אֶת אַבְרָהָם
  choice: ஆபிரகாமுக்கு உரைத்த
  rationale: ஆபிரகாமுக்கும் பரிசுத்த வார்த்தைக்கும் இடையிலான தொடர்பைத் தமிழில் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது. ‘உரைத்த’ என்பது எபிரெயில் வெளிப்படையாக இல்லாவிட்டாலும், சூழலில் மறைந்துள்ள உறவை அளவோடு விளக்குகிறது.
- source_word: עַבְדּוֹ
  choice: தமது ஊழியனாகிய
  rationale: ஆபிரகாம் தேவனுக்குரிய பணியாளராக இருப்பதைச் சூழல் முன்னிறுத்துவதால், அடிமைத்தனத்தை வலியுறுத்தும் சொல்லைவிட ‘ஊழியன்’ பொருத்தமானது.
