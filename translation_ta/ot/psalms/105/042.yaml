  rationale: இரண்டாவது אֶת காரணமாக இரண்டு நேரடிப் பொருட்களாகப் படிக்கும் சாத்தியம் இருந்தாலும், சூழலும் இயல்பான பொருளும் வார்த்தை ஆபிரகாமுக்கு உரைக்கப்பட்டது என்பதைக் காட்டுகின்றன. மாற்று அமைப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
