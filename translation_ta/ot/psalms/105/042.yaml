  text: For he remembered his holy word to Abraham his servant[a][b].
translation:
  language: ta
  text: ஏனெனில், அவர் தமது ஊழியனாகிய ஆபிரகாமுக்கு உரைத்த தமது பரிசுத்த வார்த்தையை நினைவுகூர்ந்தார்[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில் இரண்டாவது நேரடிப் பொருள் குறியீட்டினால், “அவர் தமது பரிசுத்த வார்த்தையையும் தமது ஊழியனாகிய ஆபிரகாமையும் நினைவுகூர்ந்தார்” என்றும் வாசிக்கலாம்.
    reason: syntactic_alternative
  - marker: b
