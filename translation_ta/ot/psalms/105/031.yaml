  yaml_path: translation/ot/psalms/105/031.yaml
  text: He spoke[a], and swarms of flies came[c][b], and gnats throughout all their territory.
translation:
  language: ta
  text: அவர் சொன்னார்; ஈக்களின் கூட்டங்கள்[a] வந்தன; அவர்களுடைய நாடு முழுவதும் சிறுபூச்சிகள்[b] வந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பூச்சிக்கூட்டங்கள்’; எபிரெயச் சொல் மரபாக ஈக்கூட்டங்களைக் குறிப்பதாகப் புரிந்துகொள்ளப்பட்டாலும், எந்தப் பூச்சி என்பது உறுதியாகத் தெரியவில்லை.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘பேன்கள்’ அல்லது ‘கொசுக்கள்’; எபிரெயச் சொல் எந்தப் பூச்சியைக் குறிக்கிறது என்பது உறுதியாகத் தெரியவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַר
  choice: அவர் சொன்னார்
  rationale: எபிரெய வினைச்சொல்லின் நேரடியான பொருள் ‘சொன்னார்’ என்பதே. ‘கட்டளையிட்டார்’ என்று மொழிபெயர்ப்பது மூலத்தில் இல்லாத கருத்தைச் சேர்க்கும்.
- source_word: וַיָּבֹא
  choice: வந்தன
  rationale: வாதை வந்து சேர்ந்ததை இயல்பான தமிழில் காட்டுகிறது. ஒருமை வடிவிலுள்ள எபிரெய வினைச்சொல் கூட்டுப்பெயருடன் வந்தாலும், தமிழில் ‘ஈக்கூட்டங்கள்’ என்பதற்கேற்ப பன்மை பயன்படுத்தப்பட்டுள்ளது.
- source_word: עָרֹב
  choice: ஈக்கூட்டங்கள்
  rationale: வாதைகளின் சூழலில் இது பூச்சிக்கூட்டங்களை, மரபாக ஈக்கூட்டங்களை, குறிக்கிறது. எந்தப் பூச்சி என்பது முற்றிலும் உறுதியில்லை என்பதால் அடிக்குறிப்பு தரப்பட்டுள்ளது.
- source_word: כִּנִּים
  choice: சிறுபூச்சிகள்
  rationale: துல்லியமாக அடையாளம் காண முடியாத மிகச் சிறிய தொல்லை தரும் பூச்சிகளை இது குறிக்கிறது. ‘பேன்’ அல்லது ‘கொசு’ என்று மிகக் குறிப்பாகத் தீர்மானிக்காமல் பொதுவான இயல்பான சொல் தேர்ந்தெடுக்கப்பட்டுள்ளது.
- source_word: בְּכָל
  choice: எல்லாப் பகுதியிலும்
  rationale: முழுப் பரப்பிலும் பரவியிருந்தது என்ற பகிர்வுப் பொருளைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: גְּבוּלָם
  choice: அவர்களுடைய ... பகுதி
  rationale: இங்கு எல்லைக்கோட்டை மட்டும் அல்லாமல் அவர்களுடைய ஆட்சிப்பரப்பு அல்லது நிலப்பகுதி முழுவதையும் குறிக்கிறது.
