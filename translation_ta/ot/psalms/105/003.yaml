lexical_decisions:
- source_word: הִתְהַלְלוּ
  choice: பெருமைகொள்ளுங்கள்
  rationale: הלל என்பதன் ஹித்பயேல் பன்மை ஏவல் வடிவம் இங்கு களிகூருதல் அல்லது ஒருவரைத் தமது பெருமையாகக் கொள்ளுதல் என்ற பொருளைத் தருகிறது. ‘பெருமைகொள்ளுங்கள்’ என்பது அதன் தற்சார்பு நுண்பொருளையும் בְּ (‘இல்’) என்பதுடன் வரும் அமைப்பையும் காக்கிறது.
- source_word: בְּשֵׁם קָדְשׁוֹ
  choice: அவருடைய பரிசுத்தப் பெயரில்
  rationale: בְּ என்பதற்கு ‘இல்’ என்ற பொருளை ‘பெயரில்’ இயல்பாக வெளிப்படுத்துகிறது. ‘பெயர்’ என்பது வெளிப்படுத்தப்பட்ட தன்மையையும் புகழையும் சுட்டக்கூடும்; எனினும் மூல உருவகம் மொழிபெயர்ப்பில் தெளிவாகத் தக்கவைக்கப்பட்டுள்ளது.
- source_word: יִשְׂמַח
  choice: மகிழட்டும்
  rationale: இது வடிவவியல்படி மூன்றாம் நபர் ஆண்பால் ஒருமை நிறைவுறா வினையாக இருந்தாலும், கவிதைச் சூழலில் விருப்பம் அல்லது அழைப்பு உணர்வுடையதாக உள்ளது. ஆகவே ‘மகிழட்டும்’ முந்தைய ஏவலுடன் இணைந்த இணைவாக்கிய அமைப்பைப் பாதுகாக்கிறது.
- source_word: לֵב
  choice: உள்ளம்
  rationale: எபிரெயத்தில் ஒருமையாக வரும் ‘இதயம்’ இங்கு கூட்டு ஒருமையாகவும் மனிதரின் அகநிலையைக் குறிக்கும் மரபுத்தொடராகவும் உள்ளது. நவீனத் தமிழில் ‘உள்ளம்’ இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מְבַקְשֵׁי יְהוָה
  choice: யாவேயைத் தேடுகிறவர்கள்
  rationale: பெயரெச்ச வடிவம் யாவேயைத் தொடர்ந்து நாடுவதைத் தங்கள் இயல்பாகக் கொண்ட மக்களைக் குறிக்கிறது. ‘தேடுகிறவர்கள்’ அதன் தொடர்ச்சியான, பண்புசார் உணர்வைக் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எழுத்துத் தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் இயல்பான ஒலிபெயர்ப்பாக ‘யாவே’ என்று வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: வசனம் தெய்வீகப் பெயரையே நேரடியாகப் பயன்படுத்துகிறது. எனவே அதைப் பட்டப்பெயரால் மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்ப்பது மூலத்தின் தனிப்பெயர் தன்மையைப் பாதுகாக்கிறது.
- issue: לֵב என்ற கூட்டு ஒருமை
  choice: தேடுகிறவர்களின் உள்ளம்
  alternative: தேடுகிறவர்களின் உள்ளங்கள்
  rationale: மூல எபிரெயம் ‘உள்ளம்’ என்பதை ஒருமையில் வைத்துள்ளது. தமிழிலும் கூட்டு ஒருமை புரியத்தக்கதாக இருப்பதால் அதைத் தக்கவைத்து, பலரின் அகநிலை ஒன்றாக மகிழ்வதைத் தீர்மானிக்காமல் மொழிபெயர்க்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், வழிபாட்டுக்குரிய கண்ணியத்தைப் பேணும் எளிய நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘பரிசுத்தப் பெயர்’ என்ற பரவலாக அறியப்பட்ட வேதாகமச் சொற்றொடர் தக்கவைக்கப்பட்டாலும், ‘நாமம்’ என்பதற்குப் பதில் இன்றைய வாசகர்களுக்கு நேரடியான ‘பெயர்’ பயன்படுத்தப்பட்டுள்ளது.
