  text: Boast in his holy name[a]; let the hearts of those who seek Yahweh rejoice.
translation:
  language: ta
  text: அவருடைய பரிசுத்தப் பெயரில் பெருமைகொள்ளுங்கள்[a]; யாவேயைத் தேடுகிறவர்களின் உள்ளம் மகிழட்டும்.
  philosophy: optimal-equivalence
  footnotes:
