    text: அல்லது, “அவருடைய பரிசுத்தப் பெயரில் களிகூருங்கள்.” எபிரெய வினைச்சொல் களிகூருவதையும் ஒருவரையோ ஒன்றையோ தமது பெருமையாகக் கொள்வதையும் குறிக்கலாம்.
