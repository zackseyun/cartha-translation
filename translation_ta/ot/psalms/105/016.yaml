  yaml_path: translation/ot/psalms/105/016.yaml
  text: He called for famine on the land[a]; he broke every staff of bread.
translation:
  language: ta
  text: அவர் நிலத்தின்மேல் பஞ்சத்தை வரவழைத்தார்; உணவுக்கான எல்லா ஆதாரங்களையும்[a] முறித்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, “உணவின் ஆதரவுக்கோல் முழுவதையும் முறித்தார்.” சொல்லுக்குச் சொல்: “உணவின் எல்லா கோலையும்”; இது உயிரைத் தாங்கும் உணவாதாரத்தைக் குறிக்கும் எபிரெய மரபுத்தொடர்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: வரவழைத்தார்
  rationale: קרא என்பதன் அடிப்படைப் பொருளான ‘அழைத்தல்’ என்பதையும், பஞ்சம் நாட்டின்மேல் ஏற்படும்படி செய்தார் என்ற சூழல்சார் பொருளையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: רָעָב
  choice: பஞ்சம்
  rationale: இங்கு தனிப்பட்ட பசியை அல்ல, நாடெங்கும் ஏற்பட்ட உணவுப் பற்றாக்குறையைக் குறிப்பதால் ‘பஞ்சம்’ துல்லியமானது.
- source_word: עַל הָאָרֶץ
  choice: நாட்டின்மேல்
  rationale: சங்கீதத்தின் வரலாற்றுச் சூழலில் הָאָרֶץ என்பது உலகம் முழுவதையும் விடக் குறிப்பிட்ட நாட்டைக் குறிக்கிறது; עַל என்பதன் வடிவமும் பாதுகாக்கப்படுகிறது.
- source_word: כָּל מַטֵּה לֶחֶם
  choice: உணவு என்னும் ஆதரவுக்கோல் அனைத்தையும்
  rationale: மூலத்தின் ‘உணவின் கோல்’ என்ற உருவகத்தை ‘ஆதரவுக்கோல்’ மூலம் தக்கவைத்து, அது உயிரைத் தாங்கும் உணவாதாரத்தைக் குறிக்கிறது என்பதை நவீன தமிழில் புரியவைக்கிறது.
- source_word: שָׁבָר
  choice: முறித்தார்
  rationale: வினையின் அடிப்படைப் பொருளான ‘முறித்தல்’ என்பதையும் ஆதரவுக்கோல் உருவகத்தையும் நேரடியாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: பஞ்சத்தில் இறைவனின் செயற்பாடு
  choice: இரு வினைகளுக்கும் முந்தைய சூழலில் வரும் இறைவனையே எழுவாயாகக் கொண்டு, ‘அவர் ... வரவழைத்தார்; ... முறித்தார்’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: பஞ்சத்தை வெறும் இயற்கையான அல்லது எழுவாயற்ற நிகழ்வாக விவரித்தல்.
  rationale: ஆண்பால் ஒருமை வினைகள் தொடர்ச்சியாக வருகின்றன; சுற்றியுள்ள சங்கீதப் பகுதியும் ஆண்டவரின் வரலாற்றுச் செயல்களை எடுத்துரைக்கிறது. ஆகவே மூலத்தில் வெளிப்படும் இறைச் செயற்பாட்டை விரிவாக்காமலும் மங்கச் செய்யாமலும் மொழிபெயர்ப்பு தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் மரியாதைமிக்க நடையிலும் அமைக்கப்பட்டுள்ளது. ‘ஆதரவுக்கோல்’ என்ற சொல் எபிரெய உருவகத்தைத் தக்கவைக்கிறது; அதன் பொருள் அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
