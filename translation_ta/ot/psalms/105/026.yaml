source:
  edition: WLC
  text: שָׁ֭לַח מֹשֶׁ֣ה עַבְדּ֑/וֹ אַ֝הֲרֹ֗ן אֲשֶׁ֣ר בָּֽחַר בּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/026.yaml
  text: He sent Moses his servant[a], Aaron whom he had chosen.
translation:
  language: ta
  text: அவர் தம் ஊழியரான மோசேயையும், தாம் தேர்ந்தெடுத்த ஆரோனையும்[a] அனுப்பினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தாம் முன்பே தேர்ந்தெடுத்திருந்த ஆரோனையும்.” எபிரேய வினைச்சொல்லை எளிய இறந்தகாலமாகவும் மொழிபெயர்க்கலாம்; ‘முன்பே தேர்ந்தெடுத்திருந்த’ என்பது ஆரோனைத் தேர்ந்தெடுத்தது அவரை அனுப்புவதற்கு முந்தியது என்பதை வெளிப்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלַח
  choice: அனுப்பினார்
  rationale: שלח என்பதன் Qal நிறைவினை, சூழலில் தொடரும் இறைச் செயலை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: מֹשֶׁה
  choice: மோசே
  rationale: தமிழ் வேதாகம மரபிலும் பொதுப் பயன்பாட்டிலும் நிலைபெற்ற பெயர்வடிவம்.
- source_word: עַבְדּוֹ
  choice: தம் ஊழியரான
  rationale: עֶבֶד + மூன்றாம் நபர் ஆண்பால் ஒருமை பின்னொட்டு என்பதற்கு ‘தம் ஊழியர்’ பொருந்துகிறது; மோசேயைக் குறிக்கும் இவ்விடத்தின் மதிப்புறு இறைபணி சார்ந்த பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אַהֲרֹן
  choice: ஆரோன்
  rationale: தமிழ் வேதாகம மரபில் நிலைபெற்ற பெயர்வடிவம்.
- source_word: אֲשֶׁר
  choice: தாம் ... -த்த
  rationale: ஆரோனைத் தொடர்புபடுத்தும் எபிரேய உறவுச்சொல் தமிழில் பெயரெச்சத் தொடராக இயல்பாக வழங்கப்பட்டுள்ளது.
- source_word: בָּחַר בּוֹ
  choice: தாம் தேர்ந்தெடுத்த
  rationale: בחר ב என்பது ஒருவரைத் தேர்ந்தெடுப்பதைக் குறிக்கிறது; ‘தேர்ந்தெடுத்த’ என்பது கால வரிசையை அளவுக்கு மீறி விளக்காமல் எபிரேய இறந்தகால வடிவைப் பாதுகாக்கிறது.
theological_decisions:
- issue: வினையின் மறைந்த எழுவாய்
  choice: ‘அவர்/தம்’ என்று இறைவனைக் குறிக்கும் பதிற்பெயர் பயன்படுத்தப்பட்டது.
  alternative: ‘ஆண்டவர் அனுப்பினார்’ என்று எழுவாயை வெளிப்படையாகச் சேர்த்தல்.
  rationale: எபிரேயத்தில் மூன்றாம் நபர் ஆண்பால் ஒருமை எழுவாய் வினையில் மறைந்துள்ளது; உடனடி சூழலிலிருந்து அது இறைவனைக் குறிக்கிறது. வசனத்தில் இல்லாத இறைப் பெயரைச் சேர்க்காமல் உரையின் தொடர் பாதுகாக்கப்படுகிறது.
- issue: ஆரோன் தேர்ந்தெடுக்கப்பட்டதன் காலத் தொடர்பு
  choice: ‘தாம் தேர்ந்தெடுத்த’ என்ற எளிய இறந்தகாலப் பெயரெச்சம்.
  alternative: ‘தாம் முன்பே தேர்ந்தெடுத்திருந்த’ என்று அனுப்புவதற்கு முந்திய செயலை வெளிப்படுத்தல்.
  rationale: எபிரேய நிறைவினை தேர்வு முடிந்த செயல் என்பதைச் சொன்னாலும், தமிழில் முன்நிகழ்வைத் தெளிவுபடுத்துவது ஓர் விளக்கத் தேர்வாகும். ஆகவே மூலத்தின் காலத் தெளிவின்மையை முதன்மை உரை பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான, கண்ணியமான தமிழ். ‘அவர்/தம்’ மரியாதை ஒருமை இறைவனைக் குறிக்கிறது. இணைவேற்றுமையான மோசே, ஆரோன் ஆகிய இருவரையும் ஒரே வினையுடன் இயல்பாக அமைத்துள்ளது; [a] குறிப்பு முதன்மை உரையில் குறிக்கப்பட்டுள்ளது.
