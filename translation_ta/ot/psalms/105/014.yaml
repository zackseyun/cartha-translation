  yaml_path: translation/ot/psalms/105/014.yaml
  text: He allowed no man to oppress them[a]; he rebuked kings on their account,
translation:
  language: ta
  text: அவர்களை ஒடுக்க எவரையும் அவர் அனுமதிக்கவில்லை; அவர்களுக்காக[a] அரசர்களைக் கண்டித்தார்.
  philosophy: optimal-equivalence
