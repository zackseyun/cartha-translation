    text: அல்லது, ‘அவர்களைக் குறித்து.’
    reason: עֲלֵיהֶם என்பது ‘அவர்களுக்காக/அவர்களது நிமித்தமாக’ என்றும் ‘அவர்களைக் குறித்து’ என்றும் இச்சூழலில் புரிந்துகொள்ளப்படலாம்.
lexical_decisions:
- source_word: הִנִּיחַ
  choice: அனுமதிக்கவில்லை
  rationale: நוח என்பதன் ஹிஃபில் வடிவம் இங்கு ஒரு செயல் நடைபெற இடமளித்தல் அல்லது அனுமதித்தல் என்ற பொருளில் வருகிறது; எதிர்மறையுடன் ‘அனுமதிக்கவில்லை’ என்பது இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: אָדָם
  choice: எவரையும்
  rationale: ஒருமை வடிவம் பொதுப்படையாக எந்த ஒரு நபரையும் குறிக்கிறது. நவீனத் தமிழில் ‘எவரையும்’ என்பது இந்தப் பொதுப்பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לְעָשְׁקָם
  choice: அவர்களை ஒடுக்க
  rationale: עשק அநியாயமாக ஒடுக்குதல், சுரண்டுதல் அல்லது தீங்கு செய்தல் ஆகிய பொருட்களைக் கொள்ளலாம்; இச்சூழலில் ‘ஒடுக்க’ அதன் விரிவான வலிமையைத் தக்கவைக்கிறது.
- source_word: וַיּוֹכַח
  choice: கண்டித்தார்
  rationale: יכח இங்கு அதிகாரத்தில் இருப்போரிடம் கடுமையாகக் குற்றத்தைச் சுட்டிக்காட்டிக் கண்டிப்பதைக் குறிக்கிறது; ‘கண்டித்தார்’ இயல்பான, வலிமையான தமிழ் சொல்.
- source_word: עֲלֵיהֶם
  choice: அவர்களுக்காக
  rationale: על + பின்னொட்டு இங்கு முற்பிதாக்களை முன்னிட்டு, அவர்களது நிமித்தமாக அரசர்களைக் கண்டித்தார் என்ற தொடர்பைக் காட்டுகிறது; ‘அவர்களுக்காக’ இயல்பான முதன்மை வாசகம், ஆனால் ‘அவர்களைக் குறித்து’ என்ற தொடர்புப் பொருளும் சாத்தியம்.
- source_word: מְלָכִים
  choice: அரசர்களை
  rationale: מְלָכִים என்பதன் நேரான பொருள் ‘அரசர்கள்’; அதைவிடப் பரந்த ‘ஆட்சியாளர்கள்’ தேவையில்லை.
