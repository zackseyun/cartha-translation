source:
  edition: WLC
  text: וַ/יּוֹצִ֣א עַמּ֣/וֹ בְ/שָׂשׂ֑וֹן בְּ֝/רִנָּ֗ה אֶת בְּחִירָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/043.yaml
  text: So he brought out his people with joy[b][a], his chosen ones with singing.
translation:
  language: ta
  text: 'அவர் தமது மக்களை மகிழ்ச்சியோடும்,

    தாம் தேர்ந்தெடுத்தவர்களை ஆரவாரத்தோடும்[a] வெளியே கொண்டுவந்தார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மகிழ்ச்சிப் பாடலோடும்.” எபிரெயச் சொல் மகிழ்ச்சியான உரத்த முழக்கத்தையும் பாடலையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִא
  choice: வெளியே கொண்டுவந்தார்
  rationale: יצא என்பதன் ஹிஃபில் வடிவம் ‘வெளியே செல்லச் செய்தார்’ என்ற காரணவினைப் பொருளைக் கொண்டது. ‘வெளியே கொண்டுவந்தார்’ என்பது இயல்பான தமிழில் யாத்திராகமச் சூழலையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: עַמּוֹ
  choice: தமது மக்களை
  rationale: עַם இங்கு கடவுளுக்குரிய உடன்படிக்கை மக்களைக் குறிக்கிறது. ‘தமது மக்கள்’ என்பது உரிமைத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְשָׂשׂוֹן
  choice: மகிழ்ச்சியோடும்
  rationale: שָׂשׂוֹן மகிழ்ச்சி, களிப்பு ஆகியவற்றைக் குறிக்கிறது. உடன் நிகழும் மனநிலையைத் தமிழில் ‘மகிழ்ச்சியோடும்’ இயல்பாகத் தெரிவிக்கிறது.
- source_word: בְּרִנָּה
  choice: ஆரவாரத்தோடும்
  rationale: רִנָּה மகிழ்ச்சியால் எழும் உரத்த முழக்கத்தையோ பாடலையோ குறிக்கலாம். ‘ஆரவாரம்’ ஒலியுடன் வெளிப்படும் கொண்டாட்டத்தைப் பாதுகாக்கிறது; ‘மகிழ்ச்சிப் பாடல்’ என்ற மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אֶת
  choice: '[தனி வார்த்தையாக மொழிபெயர்க்கப்படவில்லை]'
  rationale: இது நேரடிச் செயப்படுபொருளைக் குறிக்கும் இலக்கண அடையாளம்; தமிழில் சொல்வரிசையும் வேற்றுமை உருபும் அதன் பணியை நிறைவேற்றுகின்றன.
- source_word: בְּחִירָיו
  choice: தாம் தேர்ந்தெடுத்தவர்களை
  rationale: בחר என்பதிலிருந்து வந்த இச்சொல் கடவுள் தேர்ந்தெடுத்தவர்களைக் குறிக்கிறது. வினைத்தொடர் வடிவிலான இம்மொழிபெயர்ப்பு தெளிவாகவும் இயல்பாகவும் இருந்து, பிற்காலக் கோட்பாட்டுச் சொற்களைத் தேவையின்றி இறக்குமதி செய்வதைத் தவிர்க்கிறது.
theological_decisions:
- issue: בְּחִירָיו என்பதன் மொழிபெயர்ப்பு
  choice: தாம் தேர்ந்தெடுத்தவர்கள்
  alternative: தமது தெரிந்துகொள்ளப்பட்டவர்கள்
  rationale: இச்சூழலில் இச்சொல் ‘தமது மக்கள்’ என்பதற்கு இணையாக, கடவுள் தேர்ந்தெடுத்த யாத்திராகம மக்களைக் குறிக்கிறது. தேர்வின் செய்பவர் கடவுள் என்பதை ‘தாம் தேர்ந்தெடுத்தவர்கள்’ தெளிவாக வைத்திருக்கிறது; அதேவேளையில் குறிப்பிட்ட பிற்கால இறையியல் அமைப்பைத் திணிப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. எபிரெயக் கவிதையின் இணை அமைப்பைப் பாதுகாக்க இரண்டு வரிகளாக அமைக்கப்பட்டுள்ளது. கடவுளுக்குரிய மரியாதைப் பன்மை வினை வடிவமும் ‘தமது/தாம்’ என்ற தற்சுட்டுப் பெயர்ச்சொற்களும் பயன்படுத்தப்பட்டுள்ளன.
