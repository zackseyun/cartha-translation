id: PSA.105.1
reference: Psalms 105:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: הוֹד֣וּ לַ֭/יהוָה קִרְא֣וּ בִּ/שְׁמ֑/וֹ הוֹדִ֥יעוּ בָ֝/עַמִּ֗ים עֲלִילוֹתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/001.yaml
  text: Give thanks to Yahweh[a]; call on his name; make his deeds known among the peoples.
translation:
  language: ta
  text: யாவேக்கு நன்றி செலுத்துங்கள்; அவருடைய பெயரைக் கூறி அழையுங்கள்; மக்களினங்களிடையே அவருடைய செயல்களைத் தெரியப்படுத்துங்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הוֹדוּ
  choice: நன்றி செலுத்துங்கள்
  rationale: ידה என்பதன் ஹிஃபில் பன்மை ஏவல் வடிவம் சங்கீத நன்றியறிதல் சூழலில் ‘நன்றி செலுத்துதல்’ என்று இயல்பாகப் பொருள்படும்.
- source_word: לַיהוָה
  choice: யெகோவாவுக்கு
  rationale: ל முன்னொட்டு நன்றியின் பெறுநரைக் குறிக்கிறது; יהוה என்ற இறைப் பெயர் தமிழில் பரவலாக அறியப்படும் ‘யெகோவா’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: קִרְאוּ בִשְׁמוֹ
  choice: அவருடைய பெயரைச் சொல்லிக் கூப்பிடுங்கள்
  rationale: קרא + בְּשֵׁם என்பது ஒருவரின் பெயரைச் சொல்லி அவரை அழைப்பதை அல்லது வேண்டுதலோடு கூப்பிடுவதை குறிக்கலாம்; தமிழ் சொற்றொடர் இந்த வழிபாட்டு நுணுக்கத்தைக் காக்கிறது.
- source_word: הוֹדִיעוּ
  choice: தெரியப்படுத்துங்கள்
  rationale: ידע என்பதன் ஹிஃபில் ஏவல் வடிவத்திலுள்ள ‘அறியச் செய்யுங்கள்’ என்ற காரணவினைப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: בָעַמִּים
  choice: மக்களினங்களிடையே
  rationale: עמים என்பது பல்வேறு மக்கள் குழுக்களைக் குறிக்கிறது; ב முன்னொட்டின் ‘இடையே’ என்ற பரப்பையும் மொழிபெயர்ப்பு காக்கிறது.
- source_word: עֲלִילוֹתָיו
  choice: அவருடைய செயல்களை
  rationale: இந்தப் பெயர்ச்சொல் செயல்கள் அல்லது கிரியைகளைக் குறிக்கிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘வல்லமையான’ போன்ற வலியுறுத்தலைச் சேர்க்காமல் உள்ளது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூல உரையில் தனிப்பட்ட இறைப் பெயர் நேரடியாக உள்ளது. பொதுப்பட்டமான ‘கர்த்தர்’ என்பதற்குப் பதில் பெயரை ஒலிபெயர்ப்பது அதன் தனிப்பெயர் இயல்பைக் காக்கிறது; ‘யாவே’ என்பது சாத்தியமான மாற்று உச்சரிப்பு.
- issue: קִרְאוּ בִשְׁמוֹ என்பதன் வழிபாட்டு நுணுக்கம்
  choice: அவருடைய பெயரைச் சொல்லிக் கூப்பிடுங்கள்
  alternative: அவருடைய பெயரை அறிவியுங்கள்
  rationale: இந்தக் கட்டமைப்பு பொதுவாக இறைவனைப் பெயரால் அழைத்தல் அல்லது அவரை நோக்கிக் கூப்பிடுதல் என்ற பொருளைத் தருகிறது. ‘அறிவியுங்கள்’ என்பது சாத்தியமான அறிவிப்பு நுணுக்கத்தை முன்னிறுத்தினாலும், இங்கு தொடரின் நேரடியான வழிபாட்டு பொருள் தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பன்மை ஏவல் வடிவங்களின் கவித்துவ இணைப்பைத் தக்கவைத்து, சாதாரண வாசகருக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது.
