id: PSA.105.22
reference: Psalms 105:22
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: לֶ/אְסֹ֣ר שָׂרָ֣י/ו בְּ/נַפְשׁ֑/וֹ וּ/זְקֵנָ֥י/ו יְחַכֵּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/022.yaml
  text: to bind his princes at his pleasure[b][a], and to teach his elders wisdom.
translation:
  language: ta
  text: அவனுடைய பிரபுக்களைத் தன் விருப்பப்படி கட்டவும்[a], அவனுடைய மூப்பர்களுக்கு ஞானத்தைக் கற்பிக்கவும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்கு சொல், ‘தன் ஆத்துமாவால்/ஆத்துமாவுடன் அவனுடைய பிரபுக்களைக் கட்ட’; இங்குள்ள எபிரெய மரபுத்தொடர் ‘தன் விருப்பப்படி’ அல்லது ‘தன் சித்தப்படி’ என்று பொருள்படும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அவனுடைய மூப்பர்களை ஞானிகளாக்கவும்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶאְסֹר
  choice: கட்டவும்
  rationale: אָסַר என்பதன் நோக்கம் அல்லது விளைவைக் காட்டும் வினையெச்ச வடிவம். ‘கட்ட’ என்பது மூலத்தின் நேரடிப் பொருளைப் பாதுகாக்கிறது; சிறையிடுதல் அல்லது கட்டுப்படுத்துதல் என்பதும் சூழலில் சாத்தியம்.
- source_word: שָׂרָיו
  choice: அவனுடைய பிரபுக்களை
  rationale: שַׂר என்பது பிரபு, தலைவர் அல்லது உயர் அதிகாரியைக் குறிக்கலாம். அரசவைக் சூழலில் ‘பிரபுக்கள்’ அதன் உயர்நிலை அரசியல் நயத்தைப் பாதுகாக்கிறது.
- source_word: בְּנַפְשׁוֹ
  choice: தன் விருப்பப்படி
  rationale: சொல்லுக்கு சொல் ‘தன் ஆத்துமாவால்/ஆத்துமாவுடன்’ என்றாலும், נֶפֶשׁ இங்கு விருப்பம் அல்லது சித்தம் என்ற இயல்பான எபிரெய மரபுத்தொடர்ப் பொருளைக் கொண்டுள்ளது.
- source_word: וּזְקֵנָיו
  choice: அவனுடைய மூப்பர்களுக்கு
  rationale: זָקֵן என்பது வயதில் மூத்தவர்களையும் ஆட்சியில் மூத்த தலைவர்களையும் குறிக்கலாம். ‘மூப்பர்கள்’ இரு நுணுக்கங்களையும் தக்கவைக்கிறது.
- source_word: יְחַכֵּם
  choice: ஞானத்தைக் கற்பிக்கவும்
  rationale: חכם என்பதன் பியேல் வடிவம் ‘ஞானியாக்குதல்’ அல்லது ‘ஞானத்தைக் கற்பித்தல்’ என்று பொருள்படலாம். இங்கு கற்பித்தல் என்ற காரணவினை நயத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ்நடை பயன்படுத்தப்பட்டுள்ளது. முந்தைய வசனத்துடன் தொடரும் நோக்கவினை அமைப்பைப் பாதுகாக்க ‘கட்டவும் … கற்பிக்கவும்’ என அமைக்கப்பட்டது. ‘அவனுடைய’ என்பது அரசனைச் சுட்டும் சூழல்சார் தொடர்பையும், ‘தன்’ என்பது செயலின் கர்த்தாவான யோசேப்பின் விருப்பத்தையும் இயல்பாக வெளிப்படுத்துகிறது.
