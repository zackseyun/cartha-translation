  yaml_path: translation/ot/psalms/105/027.yaml
  text: They performed among them the words of his signs[c][b][a], and wonders in the land of Ham.
translation:
  language: ta
  text: அவர்கள் அவர்களிடையே அவருடைய அடையாளங்களின் காரியங்களையும்[a], காமின் நாட்டில்[b] அற்புதங்களையும் செய்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்சார்பாக, “அவருடைய அடையாளங்களின் வார்த்தைகள்”; அல்லது, “அவருடைய அடையாளங்களுக்குரிய காரியங்கள்/நிகழ்வுகள்.”
    reason: lexical_alternative
  - marker: b
    text: “காமின் நாடு” என்பது எகிப்தைக் குறிக்கும் கவிதைநயமிக்க பெயர்.
    reason: cultural_note
lexical_decisions:
- source_word: שָׂמוּ
  choice: நிகழ்த்தினார்கள்
  rationale: שׂוּם என்பதன் அடிப்படைப் பொருள் ‘வைத்தல்’ என்றாலும், அடையாளங்களும் அற்புதங்களும் செயலில் நிறைவேற்றப்பட்டதை இச்சூழலில் குறிக்கிறது. ‘நிகழ்த்தினார்கள்’ என்பது இயல்பான தமிழில் அந்தச் செயற்பொருளைத் தருகிறது.
- source_word: בָם
  choice: அவர்களிடையே
  rationale: பன்மைச் சுட்டுப்பெயர் எகிப்தியர்களைக் குறிக்கிறது; அடையாளங்கள் அவர்களின் நடுவில் நிகழ்ந்தன என்ற பொருளை ‘அவர்களிடையே’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: דִּבְרֵי אֹתוֹתָיו
  choice: அவருடைய அடையாளச் செயல்கள்
  rationale: דִּבְרֵי என்பது சொற்சார்பாக ‘வார்த்தைகள்’ என்றும், சூழலுக்கேற்ப ‘காரியங்கள்/நிகழ்வுகள்’ என்றும் பொருள்படும். தமிழில் ‘அடையாளங்களின் வார்த்தைகள்’ தெளிவற்றதாக இருப்பதால், அசாதாரணமான எபிரெயச் சொல்லமைப்பை அடிக்குறிப்பில் காட்டி, முதன்மை உரையில் செயலில் நிகழ்ந்த அடையாளங்கள் என்ற பொருளை இயல்பாகத் தருகிறது.
- source_word: וּמֹפְתִים
  choice: அற்புதங்கள்
  rationale: מוֹפֵת என்பது வியப்பூட்டும் அதிசயச் செயலைக் குறிக்கிறது; ‘அற்புதங்கள்’ என்பது நவீனத் தமிழில் தெளிவாகவும் மரியாதையான நடையிலும் உள்ளது.
- source_word: בְּאֶרֶץ חָם
  choice: காமின் நாட்டில்
  rationale: எகிப்துக்கான கவிதைநயமிக்க எபிரெயப் பெயரை ‘எகிப்து’ என்று மாற்றாமல் அப்படியே பாதுகாக்கிறது.
theological_decisions:
- issue: דִּבְרֵי אֹתוֹתָיו என்ற அசாதாரணச் சொற்றொடரின் பொருள்
  choice: முதன்மை உரையில் ‘அவருடைய அடையாளச் செயல்கள்’ என்று மொழிபெயர்த்து, சொற்சார்ந்த வடிவத்தை அடிக்குறிப்பில் தருதல்
  alternative: ‘அவருடைய அடையாளங்களின் வார்த்தைகள்’
  rationale: ‘வார்த்தைகள்’ என்ற சொற்சார்ந்த வடிவம் தெய்வீகக் கட்டளைக்கும் அடையாளங்களுக்கும் இடையிலான தொடர்பைச் சுட்டக்கூடும்; அதேவேளை דָּבָר என்பதற்கு ‘காரியம்/நிகழ்வு’ என்ற பொருளும் உண்டு. தமிழில் பொருளைத் தவறாக முடிவுசெய்யாமல், இயல்பான முதன்மை உரையுடனும் மூலத்தின் வடிவத்தை வெளிப்படுத்தும் அடிக்குறிப்புடனும் இரு அம்சங்களும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதத்துக்கேற்ற மரியாதையான ஆனால் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய இணைநிலையைத் தக்கவைத்து, தமிழில் தேவையான ‘செயல்கள்’ என்ற விளக்கச் சொல்லால் இயல்பாக்கப்பட்டுள்ளது.
