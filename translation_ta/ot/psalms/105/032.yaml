  source_fidelity: The draft accurately conveys hail replacing rain and the fiery phenomenon in Egypt, but ‘அனுப்பினார்’ (‘sent’) is an interpretive contextual substitution for the direct Hebrew verb נָתַן (‘gave’). Retaining ‘கொடுத்தார்’ better follows the source and the English audit trail without loss of intelligibility.
