id: PSA.105.32
reference: Psalms 105:32
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: נָתַ֣ן גִּשְׁמֵי/הֶ֣ם בָּרָ֑ד אֵ֖שׁ לֶהָב֣וֹת בְּ/אַרְצָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/032.yaml
  text: He gave them hail for rain[a], and flaming fire in their land.
translation:
  language: ta
  text: அவர் அவர்களுடைய மழைக்குப் பதிலாக ஆலங்கட்டியையும், அவர்களுடைய நாட்டில் சுடர்விடும் நெருப்பையும்[a] கொடுத்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மின்னலையும்” அல்லது “நெருப்பு மின்னல்களையும்.” எபிரெயச் சொற்றொடர் எழுத்துப்படி “தீப்பிழம்புகளின் நெருப்பு” அல்லது “சுடர்விடும் நெருப்பு” என்று பொருள்படும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתַן
  choice: அனுப்பினார்
  rationale: நָתַן என்பதன் அடிப்படைப் பொருள் ‘கொடுத்தார்’ என்றாலும், மழை, ஆலங்கட்டி, நெருப்பு ஆகியவற்றை இறைவன் வரச்செய்வதைக் குறிக்கும் இக்கவிதைச் சூழலில் ‘அனுப்பினார்’ என்பது இயல்பான நவீனத் தமிழாகவும் தெய்வீகச் செயலின் பொருளைத் தெளிவாகவும் தருகிறது.
- source_word: גִּשְׁמֵיהֶם
  choice: அவர்களுடைய மழைக்குப் பதிலாக
  rationale: இச்சொல் எழுத்துப்படி ‘அவர்களுடைய மழைகள்’ என்று பொருள்படும். அதனைத் தொடர்ந்து வரும் ‘ஆலங்கட்டி’ மழையின் இடத்தில் வந்ததைத் தமிழ் வாசகருக்குத் தெளிவுபடுத்த ‘மழைக்குப் பதிலாக’ என வழங்கப்பட்டுள்ளது.
- source_word: בָּרָד
  choice: ஆலங்கட்டி
  rationale: இது ஆலங்கட்டியைக் குறிக்கும் வழக்கமான எபிரெயச் சொல்; எகிப்தின் வாதையையும் நேரடியாக நினைவூட்டுகிறது.
- source_word: אֵשׁ לֶהָבוֹת
  choice: கொழுந்துவிட்டு எரியும் நெருப்பு
  rationale: எழுத்துப்படி ‘தீப்பிழம்புகளின் நெருப்பு’ அல்லது ‘பிழம்புவிடும் நெருப்பு’ என்ற செறிவுடைய சொல்லிணைவு. அதன் தீவிரத்தையும் உருவகத்தையும் இயல்பான தமிழில் காக்க இவ்வாறு மொழிபெயர்க்கப்பட்டுள்ளது; ‘மின்னல்’ என்று மட்டும் குறுக்கிப் பொருள்கொள்ளவில்லை.
- source_word: בְּאַרְצָם
  choice: அவர்களுடைய நாட்டில்
  rationale: בְּ இங்கு இடத்தைக் குறிக்கும் ‘இல்’ என்ற இயல்பான பொருளில் உள்ளது; சூழலில் இது எகிப்து நாட்டைக் குறிக்கிறது.
theological_decisions:
- issue: வாதைச் சூழலில் אֵשׁ לֶהָבוֹת என்பதன் இயல்பு
  choice: முதன்மை உரையில் ‘கொழுந்துவிட்டு எரியும் நெருப்பு’ எனப் பரந்த படிமம் காக்கப்பட்டது.
  alternative: மின்னல்; நெருப்புக் கற்றைகள்
  rationale: யாத்திராகம வாதையின் சூழல் மின்னலைச் சுட்டக்கூடும். ஆயினும் எபிரெய வாசகம் நேரடியாக ‘நெருப்பு’ மற்றும் ‘பிழம்புகள்’ என்ற சொற்களையே பயன்படுத்துவதால், முதன்மை உரை அந்தத் தெளிவின்மையைத் தீர்த்துவிடாமல் காக்கிறது; சூழல்சார் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, எளிதில் புரியும், கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. எபிரெயக் கவிதையின் சுருக்கத்தையும் இணை அமைப்பையும் இயன்றவரை காத்தபடி, தமிழில் இயல்பற்ற ‘மழையாக ஆலங்கட்டியைக் கொடுத்தார்’ என்ற கட்டமைப்பு தவிர்க்கப்பட்டுள்ளது.
