  text: פָּ֣תַח צ֭וּר וַ/יָּז֣וּבוּ מָ֑יִם הָ֝לְכ֗וּ בַּ/צִּיּ֥וֹת נָהָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/041.yaml
  text: He opened the rock[a], and water gushed out; they flowed through the dry places like a river.
translation:
  language: ta
  text: அவர் பாறையைத் திறந்தார்; தண்ணீர் பீறிட்டு வெளியேறியது; அது வறண்ட நிலங்களினூடே ஓர் ஆற்றைப் போல ஓடியது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, இன்னும் சொல்லடியாக: “அது வறண்ட நிலங்களில் ஓர் ஆறாக ஓடியது.” எபிரெயத்தில் “போல” என்ற ஒப்புமைச் சொல் வெளிப்படையாக இல்லை.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּתַח
  choice: திறந்தார்
  rationale: எபிரெய வினையின் நேரடிப் பொருள் ‘திறத்தல்’. பாறையைப் ‘பிளந்தார்’ என்பது சூழலுக்குப் பொருந்தினாலும், மூலத்தில் இல்லாத வலிமையான படிமத்தைச் சேர்க்காமல் ‘திறந்தார்’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: צוּר
  choice: பாறையை
  rationale: எபிரெயத்தில் சுட்டுச் சொல் இல்லாவிட்டாலும், இஸ்ரவேலரின் வனாந்தர அனுபவத்தில் அறியப்பட்ட பாறையைச் சூழல் குறிக்கிறது; தமிழில் வேற்றுமை உருபுடன் இயல்பாகத் தரப்பட்டது.
- source_word: וַיָּז֣וּבוּ מָיִם
  choice: தண்ணீர் பீறிட்டு வெளியேறியது
  rationale: வினை நீர் வெளியே பாய்ந்து வருவதைச் சுட்டுகிறது. ‘பீறிட்டு வெளியேறியது’ திடீரெனவும் மிகுதியாகவும் நீர் வந்த கவித்துவப் படிமத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது. எபிரெயத்தில் ‘நீர்’ இலக்கணப் பன்மையுடன் இருந்தாலும், தமிழில் ‘தண்ணீர்’ ஒருமைத் திரள்பெயராக இயல்பாக அமைகிறது.
- source_word: הָלְכוּ
  choice: ஓடியது
  rationale: சொல்லடிப் பொருள் ‘சென்றன’; இங்கு தண்ணீரே எழுவாய் என்பதால், நீரின் நகர்வைத் தமிழில் இயல்பாகக் கூற ‘ஓடியது’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: בַּצִּיּוֹת
  choice: வறண்ட நிலங்களினூடே
  rationale: இச்சொல் வறண்ட அல்லது நீரற்ற இடங்களைக் குறிக்கிறது. ‘நிலங்களினூடே’ என்பது நீர் அவற்றின் வழியாகச் சென்ற படிமத்தைத் தெளிவாக்குகிறது; ‘பாலைவனங்கள்’ என்று பொருளைத் தேவையின்றிக் குறுக்கவில்லை.
- source_word: נָהָר
  choice: ஓர் ஆற்றைப் போல
  rationale: எபிரெயத்தில் ஒப்புமை உருபு வெளிப்படையாக இல்லை. எனினும் இறுதி பெயர்ச்சொல் நீர் ஓடிய விதத்தை விளக்கும் இணைப்பாகப் புரிந்துகொள்ளப்படுவதால், இயல்பான தமிழில் ‘ஓர் ஆற்றைப் போல’ என்று தரப்பட்டது; நேரடியான மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: யாத்திரை மரபில் தேவன் வனாந்தரத்தில் தண்ணீர் வழங்கிய நிகழ்வைக் குறித்தல்
  choice: தேவன் பாறையிலிருந்து தண்ணீர் வரச் செய்த வரலாற்று-கவித்துவச் சித்தரிப்பாக மொழிபெயர்த்தல்
  alternative: தெய்வீகப் பராமரிப்பைக் குறிக்கும் பொதுவான உருவகமாக மட்டும் வாசித்தல்
  rationale: சங்கீதம் இஸ்ரவேலின் வரலாற்றை மீளுரைப்பதால், முதன்மைக் குறிப்பு வனாந்தர நிகழ்வே. அதன் விரிவான இறையியல் பொருளை உரைக்குள் வெளிப்படையாகச் சேர்க்காமல் விடப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் சங்கீதத்திற்கேற்ற கண்ணியமான கவித்துவ நடையிலும் அமைக்கப்பட்டது. ‘தண்ணீர்’ தமிழில் திரள்பெயராக ஒருமை வினையுடன் பயன்படுத்தப்பட்டது.
