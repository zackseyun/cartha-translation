translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான ஏவல் நடையைப் பயன்படுத்துகிறது. எபிரெயக் கவிதையின் மூன்று இணையான கட்டளைகளும் அரைப்புள்ளிகளால் காக்கப்பட்டுள்ளன; மூன்றாவது வினையின் பொருள் விரிவு அடிக்குறிப்பில் தெளிவுபடுத்தப்பட்டுள்ளது.
