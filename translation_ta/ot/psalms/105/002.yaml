base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/002.yaml
  text: Sing to him[a]; sing praises to him; speak of all his wondrous works.
translation:
  language: ta
  text: அவருக்குப் பாடுங்கள்; அவரைப் புகழ்ந்து பாடுங்கள்; அவருடைய அதிசயச் செயல்கள் அனைத்தையும் பற்றிப் பேசுங்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவருடைய அதிசயங்கள் அனைத்தையும் எடுத்துச் சொல்லுங்கள்’ அல்லது ‘அவருடைய அதிசயச் செயல்கள் அனைத்தையும் தியானியுங்கள்.’ எபிரெய வினைச்சொல் ஆழ்ந்து சிந்திப்பதையோ வாய்மொழியாக எடுத்துரைப்பதையோ குறிக்கலாம்; இங்கு புகழ்ச்சியின் சூழலில் வெளிப்படையாகப் பேசும் பொருள் முதன்மைப்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁירוּ לוֹ
  choice: அவரைப் பாடுங்கள்
  rationale: שׁיר என்பதன் பன்மை ஏவல் வடிவம் நேரடியாகப் ‘பாடுங்கள்’ எனப் பொருள்படும்; לֹו இங்கு பாடலின் நோக்குநரைக் குறிக்கிறது. இயல்பான தமிழில் ‘அவரைப் பாடுங்கள்’ என்பது அவரை மையமாகக் கொண்டு பாடுதல் என்ற பொருளைத் தருகிறது.
- source_word: זַמְּרוּ לוֹ
  choice: அவரைப் புகழ்ந்து பாடுங்கள்
  rationale: זמר என்பது புகழ்ச்சிச் சூழலில் இசையோடு அல்லது பாடலால் புகழ்வதைக் குறிக்கிறது. இசைக்கருவியை மூலவசனம் வெளிப்படையாகக் குறிப்பிடாததால் அதைச் சேர்க்காமல், ‘புகழ்ந்து பாடுங்கள்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: שִׂיחוּ
  choice: பேசுங்கள்
  rationale: שׂיח என்பது சிந்தித்தல், தியானித்தல், எடுத்துரைத்தல் அல்லது பேசுதல் ஆகிய நிழற்பொருள்களைக் கொள்ளலாம். பொதுப் புகழ்ச்சிக்கான தொடர்ச்சியான ஏவல்களின் சூழலில் வெளிப்படையாக எடுத்துரைக்கும் பொருள் முன்னுரிமை பெறுகிறது; இருப்பினும் அதன் உண்மையான பொருள் விரிவு அடிக்குறிப்பில் காக்கப்பட்டுள்ளது.
- source_word: בְּכָל נִפְלְאוֹתָיו
  choice: அவருடைய அதிசயச் செயல்கள் அனைத்தையும் பற்றி
  rationale: נִפְלָאוֹת என்பது வியப்பூட்டும் அற்புதச் செயல்களைக் குறிக்கிறது; כָל அதன் முழுமையைக் காட்டுகிறது. பேசுதல் என்ற வினையுடன் בְּ இயல்பான தமிழில் ‘பற்றி’ என வழங்கப்படுகிறது.
