  text: He struck down every firstborn in their land[a], the firstfruits of all their strength.
translation:
  language: ta
  text: அவர்களுடைய நாட்டில் இருந்த ஒவ்வொரு முதற்பேறானவரையும் அவர் அடித்தார்—அவர்களுடைய முழு வலிமையின் முதல் விளைவையும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுடைய எல்லா வீரியத்தின் முதல் வெளிப்பாட்டையும்.” இந்த எபிரெயச் சொற்றொடர் முதற்பேறானவர்களை ஒருவருடைய வலிமை அல்லது இனப்பெருக்க வீரியத்தின் முதல் வெளிப்பாடாகக் குறிப்பிடுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּךְ
  choice: அவர் வீழ்த்தினார்
  rationale: נכה என்பதன் ஹிஃபில் வடிவம் ‘அடித்தல்/வீழ்த்துதல்’ என்று பொருள்படும்; முதற்பேறானவர்கள் இறந்த சூழலில், ‘வீழ்த்தினார்’ என்பது செயலும் அதன் உயிர்க்கொல்லும் விளைவும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כָּל בְּכוֹר
  choice: முதற்பேறான ஒவ்வொருவரையும்
  rationale: כָּל என்பதன் பகிர்ந்தளிக்கும் வலிமையை ‘ஒவ்வொருவரையும்’ காக்கிறது; בְּכוֹר என்பதற்கு ‘முதற்பேறானவர்’ துல்லியமான, வழக்கமான இணைச்சொல்.
- source_word: בְּאַרְצָם
  choice: அவர்களுடைய நாட்டிலிருந்த
  rationale: אֶרֶץ இங்கு புவியியல் பொருளில் ‘நாடு’; இருப்பிட உறவை இயல்பான தமிழில் ‘நாட்டிலிருந்த’ என்று வழங்குகிறது.
- source_word: רֵאשִׁית
  choice: முதற்கனி
  rationale: רֵאשִׁית என்பது முதல் அல்லது தொடக்கப் பகுதியைக் குறிக்கிறது; அடுத்துள்ள ‘ஆற்றல்’ என்பதோடு உருவக இணைப்பைத் தக்கவைக்க ‘முதற்கனி’ பொருத்தமானது.
- source_word: לְכָל אוֹנָם
  choice: அவர்களுடைய ஆற்றல் அனைத்தின்
  rationale: לְ இங்கு உறவைக் குறிக்கிறது; אוֹן என்பதன் ‘வலிமை/வீரியம்/இனப்பெருக்க ஆற்றல்’ என்ற பொருள் வீச்சை ‘ஆற்றல்’ ஓரளவு திறந்தவாறே வைத்திருக்கிறது.
theological_decisions:
- issue: வினைச்சொல்லின் மறைமுக எழுவாய்
  choice: ‘அவர்’ என்பது முந்தைய சூழலிலிருந்து தொடரும் கடவுளைக் குறிக்கிறது
  alternative: தமிழில் எழுவாயை வெளிப்படையாகச் சொல்லாமல் விடுதல்
  rationale: எபிரெய வினை 3ஆம் நபர் ஆண்பால் ஒருமை எழுவாயைக் கொண்டது; சங்கீதத்தின் முந்தைய சூழலில் கடவுளே வாதைகளை நிகழ்த்துபவர். தமிழில் தெளிவுக்காக ‘அவர்’ சேர்க்கப்படுகிறது.
- issue: ‘அவர்களுடைய ஆற்றல் அனைத்தின் முதற்கனி’ என்ற உருவகத்தின் பொருள்
  choice: எபிரெய உருவகத்தையும் அதன் பலபொருள் தன்மையையும் முதன்மை உரையில் தக்கவைத்தல்
  alternative: ‘அவர்களுடைய வீரியத்தின் முதல் சந்ததி’ என்று விளக்கமாக மொழிபெயர்த்தல்
  rationale: இந்தச் சொற்றொடர் முதற்பேறானவர்களை அவர்களுடைய வலிமை அல்லது இனப்பெருக்க வீரியத்தின் முதல் வெளிப்பாடாகச் சித்தரிக்கிறது. முதன்மை உரையில் அதை ஒரே விளக்கத்திற்குள் அடைக்காமல், அடிக்குறிப்பில் தெளிவுபடுத்துவது உரையின் இறையியல் மற்றும் கவித்துவ அழுத்தத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான, கண்ணியமான தமிழ். ‘முதற்பேறான ஒவ்வொருவரையும்’ என்பது பொதுவாசகருக்குத் தெளிவானது; ‘ஆற்றல் அனைத்தின் முதற்கனி’ என்பது மூலத்தின் கவித்துவ உருவகத்தையும் உண்மையான பொருள் விரிவையும் பாதுகாக்கிறது. அடிக்குறிப்பு குறியீடு முதன்மை உரையில் இடம்பெற்றுள்ளது.
