lexical_decisions:
- source_word: וַיֹּאכַל
  choice: அது ... தின்றது
  rationale: எபிரெய வினை மூன்றாம் நபர் ஆண்பால் ஒருமையில் இருந்து, முந்தைய வசனத்தின் கூட்டுப் பொருளான வெட்டுக்கிளியைச் சுட்டுகிறது. தமிழில் ‘அது’ ஒருமை வடிவத்தையும் உயிரற்ற/கூட்டுத் தன்மையுள்ள குறிப்பையும் இயல்பாகக் காக்கிறது; ‘தின்றது’ நேரடியான உண்ணும் படிமத்தைத் தக்கவைக்கிறது.
- source_word: כָּל
  choice: எல்லா
  rationale: முழுமையைக் குறிக்கும் அளவுச்சொல்லை இயல்பான நவீன தமிழில் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: עֵשֶׂב
  choice: தாவரங்கள்
  rationale: இச்சொல் புல்லைக் குறிப்பாகவும் பசுமையான தாவர வளர்ச்சியைப் பொதுவாகவும் குறிக்கலாம். கொள்ளைநோய் சூழலில் பரந்த பொருளுடைய ‘தாவரங்கள்’ ஏற்றது.
- source_word: בְּאַרְצָם
  choice: அவர்களுடைய நாட்டிலிருந்த
  rationale: בְ என்பதன் இடப்பொருளையும் אֶרֶץ என்பதன் நாடு/நிலப்பரப்பு சார்ந்த பொருளையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: פְּרִי
  choice: விளைச்சல்
  rationale: פְּרִי என்பதன் அடிப்படைப் பொருள் ‘கனி’; வேளாண்மைச் சூழலில் அது நிலம் தரும் விளைபொருள் அல்லது விளைச்சலையும் குறிக்கிறது. தமிழில் ‘நிலத்தின் கனி’ என்பதைவிட ‘நிலத்தின் விளைச்சல்’ இங்கு இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: אַדְמָתָם
  choice: அவர்களுடைய நிலம்
  rationale: அரபிள் மண்/நிலத்தைக் குறிக்கும் சொல்லாக இருப்பதால் ‘நிலம்’ பொருத்தமானது; முதல் அடியின் ‘நாடு’ என்பதிலிருந்து உள்ள சொற்பொருள் வேறுபாட்டையும் இது காக்கிறது.
