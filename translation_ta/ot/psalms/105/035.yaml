  text: It ate all the vegetation in their land[b][a], and it ate the fruit of their ground.
translation:
  language: ta
  text: அது அவர்களுடைய நாட்டிலுள்ள எல்லாத் தாவரங்களையும்[a] தின்றது; அவர்களுடைய நிலத்தின் விளைச்சலையும்[b] தின்றது.
  philosophy: optimal-equivalence
