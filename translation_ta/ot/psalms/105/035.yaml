    text: ‘தாவரங்கள்’ என்பதற்கு ‘புல்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் குறிப்பாகப் புல்லையோ, பொதுவாகத் தாவர வளர்ச்சியையோ குறிக்கலாம்.
