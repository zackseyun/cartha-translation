source:
  edition: WLC
  text: שָׂמ֣/וֹ אָד֣וֹן לְ/בֵית֑/וֹ וּ֝/מֹשֵׁ֗ל בְּ/כָל קִנְיָנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/021.yaml
  text: He made him lord of his house[a], and ruler over all his possessions.
translation:
  language: ta
  text: 'அவனைத் தன் வீட்டின் தலைவனாகவும்,

    தன் உடைமைகள் அனைத்தின்மேலும் ஆட்சியாளனாகவும் நியமித்தான்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனைத் தன் வீட்டின் எஜமானனாகவும், தனக்குச் சொந்தமான அனைத்தின்மேலும் ஆட்சியாளனாகவும் வைத்தான்.”
    reason: 'சொல் சார்ந்த மாற்று மொழிபெயர்ப்பு: שָׂמוֹ என்பதற்கு ‘வைத்தான்’ என்றும், אָדוֹן என்பதற்கு ‘எஜமானன்’ என்றும், קִנְיָנוֹ என்பதற்கு ‘தனக்குச் சொந்தமான அனைத்தும்’ என்றும் மொழிபெயர்க்கலாம்.'
lexical_decisions:
- source_word: שָׂמוֹ
  choice: அவனை … நியமித்தான்
  rationale: שׂים என்பதன் Qal இறந்தகால வடிவம், 3ஆம் நபர் ஆண்பால் ஒருமை செயப்படுபொருள் பின்னொட்டுடன், ‘அவனை வைத்தான்/நியமித்தான்’ என்று பொருள்படும். தொடரும் அதிகாரப் பொறுப்புகளோடு ‘நியமித்தான்’ இயல்பாகவும் தெளிவாகவும் அமைகிறது.
- source_word: אָדוֹן
  choice: தலைவன்
  rationale: ஒரு வீட்டின் அல்லது குடும்ப நிர்வாகத்தின் மீது அதிகாரம் உடையவரைக் குறிக்கிறது. நவீனத் தமிழில் ‘தலைவன்’ கண்ணியமானதும் புரியத்தக்கதுமான சொல்லாக இருந்து, அடுத்துள்ள ஆட்சிச் சொல்லோடு இணைகிறது.
- source_word: לְבֵיתוֹ
  choice: தன் வீட்டுக்கு
  rationale: לְ இங்கு வீட்டைப் பொறுத்த அதிகாரப் பொறுப்புக்கு நியமிக்கப்படுவதைக் குறிக்கிறது. ‘தன்’ என்பது நியமித்த பார்வோனின் வீட்டைக் குறிக்கும் எபிரெய மூன்றாம் நபர் பின்னொட்டைப் பேணுகிறது.
- source_word: וּמֹשֵׁל
  choice: ஆளுகிறவனாகவும்
  rationale: משל என்பதன் பெயரெச்ச வடிவம் ஆட்சி அல்லது நிர்வாக அதிகாரம் செலுத்துபவரைக் குறிக்கிறது. ‘ஆளுகிறவன்’ மூலத்தின் செயற்பாட்டு நுணுக்கத்தைப் பேணுகிறது.
- source_word: בְּכָל
  choice: அனைத்தின்மேலும்
  rationale: משל உடன் வரும் בְ ஆளுகைக்குட்பட்ட துறையையோ பொருளையோ குறிக்கிறது; தமிழில் ‘மேல்’ அதிகார உறவை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: קִנְיָנוֹ
  choice: தன் உடைமைகள்
  rationale: קִנְיָן சம்பாதிக்கப்பட்ட சொத்து, உடைமை, அல்லது ஒருவருக்குச் சொந்தமான அனைத்தையும் குறிக்கலாம். ‘உடைமைகள்’ அதன் பரந்த பொருளைத் தக்கவைக்கிறது.
