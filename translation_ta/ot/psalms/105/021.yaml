translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதக் கவிதைக்கேற்ற கண்ணியத்துடனும் சாதாரண வாசகர்களுக்குப் புரியும் இயல்புடனும் மொழிபெயர்க்கப்பட்டது. இணையான இரு அதிகாரப் பொறுப்புகளையும் ‘…ஆகவும்’ என்ற அமைப்பு வெளிப்படுத்துகிறது; அடிக்குறிப்பு குறியீடு முதன்மை உரையில் இடம்பெற்றுள்ளது.
