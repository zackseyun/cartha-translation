  yaml_path: translation/ot/psalms/105/024.yaml
  text: And he made his people very fruitful[b][a], and made them mightier than their adversaries.
translation:
  language: ta
  text: அவர் தம் மக்களை மிகவும் பெருகச் செய்தார்[a]; அவர்களுடைய எதிரிகளைவிட அவர்களை வலிமைமிக்கவர்களாக்கினார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தம் மக்களை மிகவும் பலுகச் செய்தார்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய வினை பலுகுவதையோ எண்ணிக்கையில் பெருகுவதையோ வலியுறுத்தலாம்.
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்குச் சொல்: ‘அவனை அவனுடைய எதிரிகளைவிட வலிமையாக்கினார்.’ எபிரெயத்தில் ஒருமை பிரதிப்பெயர்கள், கூட்டு ஒருமையான ‘தம் மக்கள்’ என்பதைக் குறிக்கின்றன.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּפֶר
  choice: பெருகச் செய்தார்
  rationale: פרה என்பதன் causative வடிவம் பலுகுதல், கனிதருதல், எண்ணிக்கையில் பெருகுதல் ஆகிய தொடர்புடைய கருத்துகளைத் தருகிறது. இச்சூழலில் இஸ்ரவேல் மக்களின் எண்ணிக்கை பெருகியதை இயல்பான நவீனத் தமிழில் தெரிவிக்க ‘பெருகச் செய்தார்’ தேர்ந்தெடுக்கப்பட்டது; மூல உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: עַמּוֹ
  choice: தம் மக்களை
  rationale: עַם என்பது ஒரு கூட்டு இனத்தையோ மக்களையோ குறிக்கிறது. இறைவனையே எழுவாயாகக் கொண்ட மரியாதை ஒருமைக்குப் பொருந்தும் வகையில் ‘தம் மக்களை’ இயல்பாக உள்ளது.
- source_word: מְאֹד
  choice: மிகவும்
  rationale: இது அளவை வலியுறுத்தும் வினையடை; ‘மிகவும்’ தெளிவான, தற்போதைய பொதுத்தமிழ் இணை.
- source_word: וַיַּעֲצִמֵהוּ
  choice: அவர்களை வலிமைமிக்கவர்களாக்கினார்
  rationale: עצם என்பதன் causative வடிவம் ‘வலிமையாக்குதல்’ என்று பொருள்படும். எபிரெயத்தில் ஒருமை பின்னொட்டு கூட்டு ஒருமையான ‘மக்கள்’ என்பதைக் குறிக்கிறது; தமிழில் இயல்பாகப் பன்மையில் தரப்பட்டுள்ளது.
- source_word: מִצָּרָיו
  choice: அவர்களுடைய எதிரிகளைவிட
  rationale: צַר என்பது பகைவர், எதிரி, துன்புறுத்துபவர் ஆகிய பொருட்களைத் தரலாம். எகிப்தியர்களைத் தேவையின்றி பெயரிட்டு வரையறுக்காமல், மூலத்தின் பரந்த பொருளை ‘எதிரிகள்’ காக்கிறது; מִן ஒப்பீட்டுப் பொருளை ‘-விட’ தெளிவாக்குகிறது.
theological_decisions:
- issue: கூட்டு ஒருமையைக் குறிக்கும் எபிரெயப் பிரதிப்பெயர்களைத் தமிழில் எவ்வாறு தருவது
  choice: ‘மக்கள்’ என்பதைக் குறிப்பிட்டு ‘அவர்களை, அவர்களுடைய’ எனப் பன்மையில் மொழிபெயர்த்தல்
  alternative: ‘அவனை, அவனுடைய எதிரிகள்’ என மூல இலக்கண ஒருமையை அப்படியே வைத்தல்
  rationale: எபிரெயம் மக்களைக் கூட்டு ஒருமையாகக் கருதுகிறது. தமிழில் ஒருமை பிரதிப்பெயர் தனிநபரைக் குறிப்பதாகத் தவறாகப் புரியக்கூடும்; பன்மை வடிவம் இறையியல் பொருளை மாற்றாமல் குறிப்பைத் தெளிவாக்குகிறது.
translation_notes:
  register: நடை நவீன நிலையான தமிழிலும் மரியாதைமிக்க வேதாகமப் பாங்கிலும் அமைந்துள்ளது. ‘பெருகச் செய்தார்’ சாதாரண வாசகருக்குத் தெளிவாக இருக்கிறது; ‘பலுகுதல்’ என்ற மூல உருவக வாய்ப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது. அரைப்புள்ளி எபிரெய இணை வாக்கியங்களின் நெருங்கிய தொடர்பைப் பாதுகாக்கிறது.
