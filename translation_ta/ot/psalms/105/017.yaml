source:
  edition: WLC
  text: שָׁלַ֣ח לִ/פְנֵי/הֶ֣ם אִ֑ישׁ לְ֝/עֶ֗בֶד נִמְכַּ֥ר יוֹסֵֽף׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/017.yaml
  text: He sent a man before them[a]; Joseph was sold as a servant.
translation:
  language: ta
  text: அவர்களுக்கு முன்னதாக[a] ஒரு மனிதனை அவர் அனுப்பினார்; யோசேப்பு அடிமையாக விற்கப்பட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவர்களுக்கு முன்பாக.’
    reason: לִפְנֵיהֶם என்பது இடவியல் பொருளில் ‘அவர்களுக்கு முன்பாக’ என்றும், நிகழ்வின் வரிசையைக் குறிக்கும் வகையில் ‘அவர்களுக்கு முன்னதாக’ என்றும் புரிந்துகொள்ளப்படலாம்.
lexical_decisions:
- source_word: שָׁלַח
  choice: அனுப்பினார்
  rationale: שלח என்பதன் Qal perfect 3ms வடிவம். முந்தைய சூழலிலிருந்து கடவுளே மறைமுக எழுவாய்; நவீன தமிழில் மரியாதைப் பன்மை வினை இயல்பானது.
- source_word: לִפְנֵיהֶם
  choice: அவர்களுக்கு முன்னதாக
  rationale: இந்தச் சொற்றொடர் சொல்லுக்குச் சொல் ‘அவர்களுக்கு முன்பாக’ எனப் பொருள்படும்; இங்கு யோசேப்பு அவர்களுக்கு முன்னமே அனுப்பப்பட்டதை இயல்பாக வெளிப்படுத்த ‘முன்னதாக’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: אִישׁ
  choice: ஒரு மனிதனை
  rationale: אִישׁ என்பது ஒருமை ஆண்பால் பெயர்ச்சொல். ‘ஒருவரை’ என்பதைக் காட்டிலும் மூலத்தின் வெளிப்படையான சொல்லாக்கத்தை இது காக்கிறது.
- source_word: לְעֶבֶד
  choice: அடிமையாக
  rationale: לְ இங்கு விளைவு அல்லது நிலையைச் சுட்டுகிறது. விற்கப்பட்ட நிலை தெளிவாக இருப்பதால், மென்மைப்படுத்தும் ‘வேலைக்காரனாக’ என்பதற்குப் பதில் கட்டுண்ட அடிமை நிலையைக் காட்டும் ‘அடிமையாக’ துல்லியமானது.
- source_word: נִמְכַּר
  choice: விற்கப்பட்டார்
  rationale: מכר என்பதன் Niphal perfect 3ms வடிவத்தின் செயப்பாட்டு பொருளை நேரடியாகக் காட்டுகிறது; தமிழில் யோசேப்பைக் குறிக்க மரியாதை விகுதி பயன்படுத்தப்பட்டுள்ளது.
- source_word: יוֹסֵף
  choice: யோசேப்பு
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் பெயர் வடிவம்.
theological_decisions:
- issue: யோசேப்பு விற்கப்பட்ட சூழலில் עֶבֶד என்பதன் மொழிபெயர்ப்பு
  choice: அடிமை
  alternative: வேலைக்காரன் / பணியாளன்
  rationale: עֶבֶד பல சூழல்களில் பணியாளரையோ ஊழியரையோ குறிக்கலாம். ஆனால் இங்கு ‘விற்கப்பட்டார்’ என்ற வினை கட்டுண்ட அடிமை நிலையைத் தெளிவாக்குவதால் ‘அடிமை’ என்பது துல்லியமான தேர்வு.
translation_notes:
  register: நவீன, செம்மையான, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ். எபிரெய வாக்கியத்தின் முன்னிறுத்தலை ஓரளவு காக்கும் வகையில் ‘அவர்களுக்கு முன்னதாக’ முதலில் வைக்கப்பட்டுள்ளது; மறைமுக எழுவாயான கடவுளைக் குறிக்கும் ‘அவர்’ தமிழில் தெளிவுக்காக வெளிப்படுத்தப்பட்டுள்ளது.
