source:
  edition: WLC
  text: וַ/יַּֽעֲמִידֶ֣/הָ לְ/יַעֲקֹ֣ב לְ/חֹ֑ק לְ֝/יִשְׂרָאֵ֗ל בְּרִ֣ית עוֹלָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/010.yaml
  text: He confirmed it to Jacob as a statute[b][a], to Israel as an everlasting covenant.
translation:
  language: ta
  text: அதை யாக்கோபுக்கு ஒரு நியமமாகவும், இஸ்ரவேலுக்கு என்றென்றும் நிலைக்கும் உடன்படிக்கையாகவும்[b] அவர் உறுதிப்படுத்தினார்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நிலைநிறுத்தினார்.” எபிரெய வினைச்சொல் ஒன்றை உறுதியாக நிற்கச் செய்தல் அல்லது நிறுவுதல் என்ற பொருளையும் தரலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நித்திய உடன்படிக்கையாக” அல்லது “நிரந்தர உடன்படிக்கையாக.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמִידֶהָ
  choice: அதை அவர் உறுதிப்படுத்தினார்
  rationale: עמד என்பதன் ஹிஃபில் வடிவம் இங்கு ஒன்றை நிலைபெறச் செய்தல், நிறுவுதல் அல்லது உறுதிப்படுத்துதல் என்ற பொருளைத் தருகிறது. பெண்பால் ஒருமை பின்னொட்டு முந்தைய சூழலில் கூறப்பட்ட உடன்படிக்கை சார்ந்த வாக்குறுதி அல்லது ஆணையைச் சுட்டுவதால், அதைத் தனிப்படுத்தாமல் ‘அதை’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: לְיַעֲקֹב
  choice: யாக்கோபுக்கு
  rationale: לְ முன்னொட்டு மறைமுகப் பெறுநரை அல்லது பயனாளியைக் குறிக்கிறது; ‘யாக்கோபுக்கு’ என்பது நேரான இயல்பான தமிழ் வடிவம்.
- source_word: לְחֹק
  choice: ஒரு நியமமாக
  rationale: חֹק என்பது நிர்ணயிக்கப்பட்ட அல்லது விதிக்கப்பட்ட ஒன்றைக் குறிக்கிறது. ‘நியமம்’ அதன் சட்டபூர்வமான, நிலையான தன்மையை நவீன தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: לְיִשְׂרָאֵל
  choice: இஸ்ரவேலுக்கு
  rationale: இது ‘யாக்கோபுக்கு’ என்பதற்கு இணையான அமைப்பில் உள்ளது; எபிரெயக் கவிதையின் இணைப்பைத் தமிழிலும் காக்கிறது.
- source_word: בְּרִית עוֹלָם
  choice: என்றென்றும் நிலைக்கும் உடன்படிக்கையாக
  rationale: בְּרִית என்பதற்கு ‘உடன்படிக்கை’ வழக்கமானதும் பொருத்தமானதும் ஆகும். עוֹלָם இங்கு நீடித்த, முடிவில்லாத காலத்தைச் சுட்டுவதால் ‘என்றென்றும் நிலைக்கும்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: וַיַּעֲמִידֶהָ என்பதிலுள்ள பெண்பால் ஒருமைப் பின்னொட்டின் குறிப்பு
  choice: முந்தைய வசனங்களில் கூறப்பட்ட உடன்படிக்கை சார்ந்த வாக்குறுதி அல்லது ஆணையைப் பொதுவாகச் சுட்டும் ‘அதை’
  alternative: அந்த வாக்குறுதியை; அந்த ஆணையை
  rationale: உடனடியான சூழல் உடன்படிக்கை, கட்டளையிட்ட வார்த்தை, முற்பிதாக்களுக்குச் செய்த ஆணை ஆகியவற்றைப் பற்றிப் பேசுகிறது. இவற்றில் ஒன்றை மட்டும் தீர்மானிக்காமல் ‘அதை’ என்பது மூலத்தின் பின்னோக்குச் சுட்டுதலையும் அதன் இயல்பான தெளிவின்மையையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைநயமும் உடன்படிக்கை சார்ந்த சட்டப்பூர்வத் தொனியும் காக்கப்பட்டுள்ளன. ஒரே எபிரெய வினை இரு இணையான கூறுகளையும் ஆளுவதைக் காட்ட, வினைச்சொல் தமிழில் இறுதியில் வைக்கப்பட்டுள்ளது.
