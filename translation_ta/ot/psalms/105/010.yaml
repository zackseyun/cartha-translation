  source_fidelity: 'வசனத்தின் எபிரெய அமைப்பும் பொருளும் துல்லியமாகக் காக்கப்பட்டுள்ளன: பெண்பால் பின்னொட்டின் பொதுவான முன்னோக்குக் குறிப்பு ‘அதை’ எனத் திறந்தவாறே உள்ளது; לְיַעֲקֹב / לְיִשְׂרָאֵל இணை அமைப்பு ‘யாக்கோபுக்கு / இஸ்ரவேலுக்கு’ எனத் தெளிவாக வருகிறது; לְחֹק ‘ஒரு நியமமாகவும்,’ בְּרִית עוֹלָם ‘என்றென்றும் நிலைக்கும் உடன்படிக்கையாகவும்’ எனச் சரியாக மொழிபெயர்க்கப்பட்டுள்ளது. இறுதி வினைச்சொல் இரு இணைக் கூறுகளையும் ஆளும் எபிரெய அமைப்பை இயல்பாக வெளிப்படுத்துகிறது.'
