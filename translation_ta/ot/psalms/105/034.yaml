    text: ‘வெட்டுக்கிளிகள் வந்தன; தின்றழிக்கும் பூச்சிகளோ எண்ணிலடங்காதிருந்தன’ என்றும் மொழிபெயர்க்கலாம். יֶלֶק என்ற எபிரேயச் சொல் பயிரைத் தின்றழிக்கும் ஒரு பூச்சியைக் குறிக்கிறது; அது வெட்டுக்கிளியின் ஒரு குறிப்பிட்ட வளர்ச்சிநிலையையோ வகையையோ குறிக்கலாம். பழைய மொழிபெயர்ப்புகள் சிலவற்றில் இது ‘கம்பளிப்பூச்சி’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
