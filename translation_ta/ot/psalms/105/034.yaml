lexical_decisions:
- source_word: אָמַר
  choice: அவர் சொன்னார்
  rationale: எபிரேய வினைச்சொல்லின் அடிப்படைப் பொருளான ‘சொன்னார்’ என்பதைக் காக்கிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘கட்டளையிட்டார்’ என்ற வலுவான பொருளைச் சேர்ப்பதில்லை.
- source_word: וַיָּבֹא
  choice: வந்தன
  rationale: வாதை வந்து சேர்ந்ததை இயல்பான நவீன தமிழில் தெரிவிக்கிறது. கூட்டு ஒருமைப் பெயர்களால் குறிக்கப்படும் ஏராளமான பூச்சிகளைத் தமிழில் பன்மையாகக் கூறுவது இயல்பு.
- source_word: אַרְבֶּה
  choice: வெட்டுக்கிளிகள்
  rationale: ஒருமை வடிவில் இருந்தாலும் இங்கு கூட்டுப்பொருளில் வெட்டுக்கிளிக் கூட்டத்தைக் குறிக்கிறது.
- source_word: יֶלֶק
  choice: இளம் வெட்டுக்கிளிகள்
  rationale: பயிரைத் தின்றழிக்கும் ஒரு பூச்சியையும், பெரும்பாலும் வெட்டுக்கிளியின் ஒரு வளர்ச்சிநிலை அல்லது வகையையும் குறிக்கும் சொல்லாகப் புரிந்துகொள்ளப்படுகிறது. ‘கம்பளிப்பூச்சிகள்’ என்பது சூழலில் தவறான உயிரியல் எண்ணத்தை உண்டாக்கலாம்.
- source_word: וְאֵין מִסְפָּר
  choice: எண்ணிலடங்காத
  rationale: ‘எண்ணிக்கை இல்லை’ என்ற எபிரேய மரபுத்தொடரின் பொருளை இயல்பாகவும் கவித்துவச் செறிவுடனும் தருகிறது.
