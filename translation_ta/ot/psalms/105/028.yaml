source:
  edition: WLC
  text: שָׁ֣לַֽח חֹ֭שֶׁךְ וַ/יַּחְשִׁ֑ךְ וְ/לֹֽא מָ֝ר֗וּ אֶת דברו/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/028.yaml
  text: He sent darkness and made it dark[a], and they did not rebel against his words.
translation:
  language: ta
  text: அவர் இருளை அனுப்பி, இருள் சூழச் செய்தார்; அவர்கள் அவருடைய வார்த்தைகளுக்கு எதிராகக் கலகம் செய்யவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள் அவருடைய வார்த்தை/கட்டளைக்கு எதிராகக் கலகம் செய்யவில்லை.” எபிரெய உரை ஒருமைப் பொருளிலும் புரிந்துகொள்ள இடமளிக்கிறது. மேலும், “அவர்கள்” என்பது யாரைக் குறிக்கிறது என்று எபிரெய உரை வெளிப்படையாகச் சொல்லவில்லை; சிலர் அதை எகிப்தியர்கள் என்றும், வேறு சிலர் மோசேயும் ஆரோனும் என்றும் புரிந்துகொள்கிறார்கள்.
    reason: மாற்று வாசிப்பையும் மறைந்துள்ள பன்மை எழுவாயின் தெளிவின்மையையும் பதிவு செய்தல்.
lexical_decisions:
- source_word: שָׁלַח
  choice: அனுப்பி
  rationale: ‘அனுப்பு’ என்பது மூல வினையின் பொதுவான பொருளை இயல்பாகவும் நேரடியாகவும் தருகிறது.
- source_word: חֹשֶׁךְ
  choice: இருளை
  rationale: வாதையின் சூழலில் חֹשֶׁךְ என்பதற்கான தெளிவான, வழக்கமான தமிழ் இணைச்சொல் ‘இருள்’ ஆகும்.
- source_word: וַיַּחְשִׁךְ
  choice: இருள் சூழச் செய்தார்
  rationale: காரணவினைப் பொருளைத் தக்கவைத்து, தமிழில் இயல்பாக ஒலிக்கும்படி மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְלֹא
  choice: … இல்லை
  rationale: எபிரெய இணைப்பும் மறுப்பும் தமிழில் இயல்பான தொடர் வாக்கியமாகக் கொடுக்கப்பட்டுள்ளன; தேவையற்ற முரண்பாட்டு வலிமை சேர்க்கப்படவில்லை.
- source_word: מָרוּ
  choice: எதிர்த்துக் கலகம் செய்யவில்லை
  rationale: מרה என்பதிலுள்ள எதிர்ப்பு மற்றும் கீழ்ப்படியாமை சார்ந்த கலகப் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: אֶת־דבריו
  choice: அவருடைய வார்த்தைகளை
  rationale: மெய்யெழுத்து வடிவில் காணப்படும் பன்மைப் பொருளைத் தக்கவைக்கிறது; ஒருமை அல்லது ‘கட்டளை’ என்ற புரிதல் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: ‘அவர்கள்’ என்பதன் குறிப்பு
  choice: எழுவாய் யார் என்று குறிப்பிடாமல் ‘அவர்கள்’ என்ற பன்மையைத் தக்கவைத்தல்
  alternative: எகிப்தியர்கள் எனவோ, மோசேயும் ஆரோனும் எனவோ வெளிப்படையாகக் குறிப்பிடுதல்
  rationale: எபிரெய உரையில் பன்மை எழுவாய் மறைநிலையில் உள்ளது. அது எகிப்தியர்களையா அல்லது மோசேயையும் ஆரோனையும் குறிக்கிறதா என்பது விவாதத்திற்குரியது; ஆகவே மொழிபெயர்ப்பு அந்த உண்மையான தெளிவின்மையைத் தீர்மானிக்கவில்லை.
- issue: דבריו என்பதன் எண் மற்றும் பொருள்
  choice: பன்மையாக ‘அவருடைய வார்த்தைகளை’
  alternative: ஒருமையாக ‘அவருடைய வார்த்தையை’ அல்லது பொருள் விளக்கமாக ‘அவருடைய கட்டளையை’
  rationale: எபிரெய மெய்யெழுத்து வடிவம் பன்மையை ஆதரிக்கிறது; இருப்பினும் ஒருமைப் பொருளில் புரிந்துகொள்ளும் வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளக்கூடிய கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘எதிர்த்துக் கலகம் செய்யவில்லை’ என்பது மூலத்தின் எதிர்ப்புக் கருத்தைத் தக்கவைக்கிறது; எழுவாயின் அடையாளமும் ‘வார்த்தைகள்’ என்பதன் ஒருமை/பன்மை சிக்கலும் தீர்மானிக்கப்படாமல் விடப்பட்டுள்ளன.
