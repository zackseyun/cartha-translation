  rationale: זכר என்பதன் பன்மை ஏவல் வடிவம்; கடந்தவற்றை மனத்தில் கொண்டுவருவதோடு அவற்றை உணர்வுடன் நினைத்திருக்குமாறு அழைக்கிறது. ‘நினைவுகூருங்கள்’ என்பது இயல்பான, கண்ணியமான தமிழ் ஏவல்.
- source_word: נִפְלְאוֹתָיו
  choice: அவர் செய்த அதிசயங்கள்
  rationale: פלא வேரிலிருந்து வரும் இச்சொல் வியப்பூட்டும் அசாதாரண செயல்களைக் குறிக்கிறது. ‘அதிசயங்கள்’ சுருக்கமாகவும் இயல்பாகவும் அந்தப் பொருளைத் தருகிறது; அவை செயல்கள் என்பது தொடரும் אֲשֶׁר עָשָׂה மூலம் தெளிவாகிறது.
- source_word: אֲשֶׁר עָשָׂה
  choice: அவர் செய்த
  rationale: ‘அதிசயங்கள்’ என்பதைக் குறிக்கும் தொடர்புத் தொடர். எபிரெய கடந்தகாலச் செயலைத் தமிழில் இயல்பான பெயரெச்சத் தொடராக வழங்குகிறது.
- source_word: מֹפְתָיו
  choice: அவருடைய அடையாளங்கள்
  rationale: מופת என்பது தெய்வீகச் செயலைச் சுட்டிக்காட்டும் அடையாளம், அருஞ்செயல் அல்லது முன்னறிகுறி எனப் பொருள்படலாம். ‘அடையாளங்கள்’ என்பது பொருளை அற்புதங்களுக்கு மட்டும் கட்டுப்படுத்தாமல் அதன் பரந்த சுட்டும் தன்மையைப் பாதுகாக்கிறது.
- source_word: וּמִשְׁפְּטֵי פִיו
