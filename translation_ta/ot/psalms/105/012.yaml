    text: அல்லது, “அதில் அந்நியர்களாக.” எபிரேயச் சொல், தங்களுக்குச் சொந்தமல்லாத நாட்டில் அந்நியர்களாக அல்லது தற்காலிகக் குடியிருப்பாளர்களாக வசிப்பவர்களைக் குறிக்கிறது.
