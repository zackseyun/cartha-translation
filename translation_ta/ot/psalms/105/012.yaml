lexical_decisions:
- source_word: בִּהְיוֹתָם
  choice: இருந்தபோது
  rationale: בְּ + היה என்பதன் infinitive construct மற்றும் மூன்றாம் நபர் ஆண்பால் பன்மை பின்னொட்டு சேர்ந்து காலத்தைக் குறிக்கும் துணைவாக்கியத்தை உருவாக்குகின்றன; ‘இருந்தபோது’ என்பது இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: מְתֵי מִסְפָּר
  choice: எண்ணிக்கையில் சொற்பமானவர்களாக
  rationale: எளிதில் எண்ணிவிடக்கூடிய மிகக் குறைந்த எண்ணிக்கையினரைச் சுட்டும் எபிரேய மரபுத்தொடரை இச்சொற்றொடர் தெளிவாகவும் கண்ணியமாகவும் வழங்குகிறது.
- source_word: כִּמְעַט
  choice: மிகச் சிலராக
  rationale: முந்தைய ‘சொற்பமானவர்கள்’ என்ற கருத்தை இது வலுப்படுத்துகிறது; சூழலில் உள்ள வலியுறுத்தலைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: וְגָרִים
  choice: அந்நியக் குடியிருப்பாளர்களாக
  rationale: גור என்பது தமக்குச் சொந்தமல்லாத நாட்டில் அந்நியராக அல்லது தற்காலிகமாக வசிப்பவர்களைக் குறிக்கிறது; ‘அந்நியக் குடியிருப்பாளர்கள்’ அந்தச் சமூக மற்றும் வாழ்விட நுணுக்கத்தைத் தக்கவைக்கிறது.
- source_word: בָּהּ
  choice: அந்நாட்டில்
  rationale: பெண்பால் ஒருமைப் பின்னொட்டு முன்னுள்ள ‘நாட்டை’க் குறிக்கிறது. தொடர்ச்சியான சங்கீத வாசிப்பின்றியும் பொருள் தெளிவாக இருக்க, தமிழில் குறிக்கப்படும் பெயர் வெளிப்படுத்தப்பட்டுள்ளது.
