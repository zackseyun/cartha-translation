  text: He remembers his covenant forever[a], the word he commanded for a thousand generations.
translation:
  language: ta
  text: 'அவர் தமது உடன்படிக்கையை என்றென்றும் நினைவில் வைத்திருக்கிறார்;

    ஆயிரம் தலைமுறைகளுக்குக் கட்டளையிட்ட வார்த்தையையும் நினைவில் வைத்திருக்கிறார்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆயிரம் தலைமுறைகளுக்குக் கட்டளையிட்ட வாக்குறுதியையும்.”
    reason: דָּבָר என்பதற்கு இவ்வுடன்படிக்கைச் சூழலில் ‘வாக்குறுதி’ என்ற பொருளும் இருக்கலாம்.
