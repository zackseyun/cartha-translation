translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. எபிரெயக் கவிதையின் இரண்டு இணை உறுப்புகளையும் தெளிவுபடுத்த, இரண்டாம் உறுப்பில் விடுபட்டுள்ள ‘நினைவில் வைத்திருக்கிறார்’ என்ற வினை தமிழில் மீண்டும் வழங்கப்பட்டது. ‘கட்டளையிட்ட’ என்ற நேரடி சொல்லும் ‘வார்த்தை’ என்ற திட்டமிட்ட பரந்த சொல்லும் மூலத்தின் இறுக்கத்தையும் இறையியல் பதற்றத்தையும் பாதுகாக்கின்றன.
