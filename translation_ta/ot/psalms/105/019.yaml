  yaml_path: translation/ot/psalms/105/019.yaml
  text: Until the time his word came to pass[b][a], the word of Yahweh tested him.
translation:
  language: ta
  text: அவனுடைய சொல் நிறைவேறும் காலம் வரையில்[a], யாவேயின் வாக்கு அவனைச் சோதித்தது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவனுடைய சொல்” என்பது காலப்போக்கில் நிறைவேறிய யோசேப்பின் சொல் அல்லது முன்னறிவிப்பைக் குறிக்கலாம்; சிலர் இதை யோசேப்பைக் குறித்த கடவுளுடைய சொல் என்று புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
  - marker: b
    text: “சோதித்தது” என்பதற்கான எபிரெய வினை, உலோகத்தைப் புடமிட்டுத் தூய்மைப்படுத்தும் உருவகத்தைக் கொண்டது; எனவே “அவனைப் புடமிட்டது” அல்லது “அவனை மெய்ப்பித்தது” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד עֵת
  choice: காலம்வரை
  rationale: ஒரு குறிப்பிட்ட காலப்புள்ளிவரை நீடித்த நிலையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: בֹּא
  choice: நிறைவேறும்
  rationale: எழுத்துப்படியாக ‘வரும்’ என்றாலும், ‘சொல்’ என்பதுடன் இங்கு அது நிகழ்வாக நிறைவேறுவதைக் குறிக்கிறது; தமிழில் ‘சொல் நிறைவேறும்’ என்பது பொருளை இயல்பாகத் தருகிறது.
- source_word: דְבָרוֹ
  choice: அவனுடைய சொல்
  rationale: எபிரெயச் சொல்லின் வடிவையும் அதன் இணைக்கப்பட்ட மூன்றாம் நபர் உரிமைப் பின்னொட்டையும் காக்கிறது; சூழலில் இது யோசேப்பின் சொல்லைக் குறிக்கலாம், ஆனால் சுட்டுப்பொருள் முற்றிலும் வெளிப்படையாக இல்லை.
- source_word: אִמְרַת
  choice: வாக்கு
  rationale: பேசப்பட்ட உரை அல்லது அறிவிப்பைக் குறிக்கும் சொல்லாகவும், முந்தைய ‘சொல்’ என்பதிலிருந்து எபிரெய இணைச்சொல் வேறுபாட்டை ஓரளவு காட்டுவதாகவும் உள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் ஒலிபெயர்த்து வழங்குகிறது.
- source_word: צְרָפָתְהוּ
  choice: அவனைச் சோதித்தது
  rationale: உலோகத்தைப் புடமிட்டு தூய்மைப்படுத்துதல் என்ற மூல உருவகத்திலிருந்து, துன்பத்தின் வழியாக ஒருவரைச் சோதித்து மெய்ப்பிக்கும் பொருள் வருகிறது; முதன்மை உரையில் ‘சோதித்தது’ தெளிவான நவீனத் தமிழ்.
theological_decisions:
- issue: ‘அவனுடைய சொல்’ என்பதன் சுட்டுப்பொருள்
  choice: முதன்மை உரையில் சுட்டுப்பொருளைத் தீர்மானிக்காமல் ‘அவனுடைய சொல்’ என்று வைத்தல்; சூழலில் யோசேப்பின் சொல் அல்லது முன்னறிவிப்பு என்பதற்கு முன்னுரிமை
  alternative: யோசேப்பைக் குறித்த கடவுளுடைய சொல்
  rationale: உடனடிச் சூழல் யோசேப்பின் துன்பத்தையும் பின்னர் ஏற்பட்ட விடுதலையையும் விவரிக்கிறது; ஆகவே யோசேப்பின் சொல் நிறைவேறியது என்பது இயல்பான வாசிப்பு. எனினும் எபிரெய உரையின் உரிமைப் பின்னொட்டு வேறு புரிதலையும் அனுமதிப்பதால், மாற்றுப் புரிதல் அடிக்குறிப்பில் காக்கப்படுகிறது.
- issue: צרף என்ற வினையின் உருவகம்
  choice: முதன்மை உரையில் ‘சோதித்தது’
  alternative: ‘புடமிட்டது’ அல்லது ‘தூய்மைப்படுத்தியது’
  rationale: வினை உலோகத்தைப் புடமிடும் உருவகத்தைக் கொண்டிருந்தாலும், இங்கு மனிதனைத் துன்பத்தின் மூலம் சோதித்தல் அல்லது மெய்ப்பித்தல் என்ற கருத்து முன்னிலையில் உள்ளது; உருவகத்தின் நுணுக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான கவிதைநடையைப் பேணுகிறது. ‘சொல்’ மற்றும் ‘வாக்கு’ என்பவை எபிரெய மூலத்திலுள்ள இணைச்சொற்களின் வேறுபாட்டை வெளிப்படுத்துகின்றன; இறைபெயர் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
