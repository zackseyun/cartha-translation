  terminology: “அபிஷேகம்,” “தீர்க்கதரிசிகள்,” “தொடாதீர்கள்,” and “தீங்கு செய்யாதீர்கள்” are appropriate established biblical Tamil terms. The footnote should likewise retain the possessive sense rather than say “என்னால்.”
  issues:
