    issue: The phrase “என்னால் அபிஷேகம் செய்யப்பட்டவர்கள்” makes the possessive suffix in מְשִׁיחָי into an explicit agentive phrase.
    rationale: The Hebrew literally has “my anointed ones.” Since the source does not grammatically state “anointed by me,” Tamil should preserve the possessive expression where natural.
