  source_fidelity: The prohibitions and parallelism are accurately represented. However, “என்னால் அபிஷேகம் செய்யப்பட்டவர்கள்” changes the Hebrew first-person possessive (“my anointed ones”) into an explicit statement of agency (“anointed by me”). Though compatible with the psalm’s divine speech context, this is a small unnecessary narrowing of the Hebrew wording.
