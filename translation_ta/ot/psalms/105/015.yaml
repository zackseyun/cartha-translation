source:
  edition: WLC
  text: אַֽל תִּגְּע֥וּ בִ/מְשִׁיחָ֑/י וְ֝/לִ/נְבִיאַ/י אַל תָּרֵֽעוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/015.yaml
  text: Do not touch my anointed ones[a], and do my prophets no harm.
translation:
  language: ta
  text: “என் அபிஷேகம் பெற்றவர்களைத் தொடாதீர்கள்[a]; என் தீர்க்கதரிசிகளுக்குத் தீங்கு செய்யாதீர்கள்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “என் அபிஷேகம் பெற்றவர்கள்.” இதன் மூலச்சொல் “மேசியா” என்ற சொல்லுடன் தொடர்புடையது; ஆனால் இங்கு அது பன்மையில் வந்து, ஒரே மேசியாவைச் சிறப்பாகக் குறிக்காமல், கடவுளால் தனியே பிரித்து வைக்கப்பட்டவர்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּגְּעוּ
  choice: தொடாதீர்கள்
  rationale: נגע என்பதன் அடிப்படைப் பொருளான ‘தொடு’ என்பதைத் தக்கவைக்கிறது; இச்சூழலில் அது பகைமையுடன் கைவைப்பதையும் உள்ளடக்கும் மரபுத்தொடராக உள்ளது, ஆனால் அதை உடல் வன்முறையாக மட்டும் குறுக்கவில்லை.
- source_word: בִמְשִׁיחָי
  choice: என்னால் அபிஷேகம் செய்யப்பட்டவர்கள்
  rationale: מָשִׁיחַ என்பதன் பன்மை வடிவத்தையும் முதல் நபர் ஒருமை உடைமைப் பின்னொட்டையும் தெளிவாக வெளிப்படுத்துகிறது. தமிழில் ‘என் அபிஷேகம் செய்யப்பட்டவர்கள்’ என்பதைவிட ‘என்னால் அபிஷேகம் செய்யப்பட்டவர்கள்’ இயல்பாகவும், இங்கு கடவுளால் தனியே பிரித்துவைக்கப்பட்ட பலரைக் குறிப்பதாகவும் உள்ளது.
- source_word: לִנְבִיאַי
  choice: என் தீர்க்கதரிசிகள்
  rationale: נָבִיא என்பதன் பன்மையையும் ‘என்’ என்ற உடைமைப் பொருளையும் நேரடியாக வழங்குகிறது.
- source_word: תָּרֵעוּ
  choice: தீங்கு செய்யாதீர்கள்
  rationale: רעע என்பதன் ஹிஃபில் வடிவம் தீமை அல்லது சேதம் விளைவிப்பதைக் குறிக்கிறது; ‘தீங்கு செய்யாதீர்கள்’ நவீனத் தமிழில் இயல்பாகவும் இணைவரியின் தடையுத்தரவுக்கு ஏற்றதாகவும் உள்ளது.
- source_word: אַל
  choice: செய்யாதீர்கள்
  rationale: אַל உடன் வரும் வினை வடிவம் தடையுத்தரவைக் குறிக்கிறது; தமிழில் எதிர்மறை ஏவல் விகுதி மூலம் இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: மேசியாவுடன் தொடர்புடைய מָשִׁיחַ என்ற சொல்லை மேசியாவை நேரடியாகக் குறிக்காத பன்மைச் சூழலில் மொழிபெயர்த்தல்
  choice: என்னால் அபிஷேகம் செய்யப்பட்டவர்கள்
  alternative: என் மேசியாக்கள்
  rationale: எபிரெயச் சொல் பன்மையில் உள்ளது; இங்கு ஒரே தனிப்பட்ட மேசியாவை அல்ல, கடவுளால் அபிஷேகம் செய்யப்பட்டு தனியே பிரித்துவைக்கப்பட்டவர்களைக் குறிக்கிறது. ஆகவே பிற்கால கிறிஸ்துவியல் தனித்தன்மையை இவ்வசனத்தில் இறக்குமதி செய்யாமல் மூலத்தின் இலக்கணத்தையும் பொருளையும் காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘தொடாதீர்கள் / தீங்கு செய்யாதீர்கள்’ என்ற இணை அமைப்பு எபிரெயக் கவிதையின் சமாந்தரத்தைக் காக்கிறது. ‘அபிஷேகம்’ என்பது பரவலாக அறியப்பட்ட வேதாகமச் சொல்; பன்மைத் தன்மையைத் தெளிவாக்க செயப்பாட்டு விளக்கவடிவம் பயன்படுத்தப்பட்டுள்ளது.
