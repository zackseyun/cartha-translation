translation:
  language: ta
  text: அவர் ஆபிரகாமுடன் செய்த உடன்படிக்கையையும்[a], ஈசாக்குக்கு அளித்த அவரது சத்தியப்பிரமாணத்தையும்,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல் முறையில், “ஆபிரகாமுடன் வெட்டியது.” இது உடன்படிக்கை செய்வதைக் குறிக்கும் எபிரெய மரபுத்தொடர்; ‘உடன்படிக்கை’ என்பது முந்தைய வசனத்திலிருந்து புரிந்துகொள்ளப்படுகிறது.
