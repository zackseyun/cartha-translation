lexical_decisions:
- source_word: אֲשֶׁר
  choice: அவர் … செய்த
  rationale: முந்தைய வசனத்தில் வரும் ‘உடன்படிக்கை’யைத் தொடர்புபடுத்தும் உறவுப்பெயர். தமிழில் இயல்பான தொடரமைப்புக்காக தனி ‘எது’ இல்லாமல் பெயரெச்சத் தொடராக மொழிபெயர்க்கப்பட்டது.
- source_word: כָּרַת אֶת אַבְרָהָם
  choice: ஆபிரகாமுடன் செய்த உடன்படிக்கை
  rationale: כרת என்பது உடன்படிக்கைச் சூழலில் ‘உடன்படிக்கை செய்தல்’ என்ற மரபுத்தொடர். ‘உடன்படிக்கை’ முந்தைய வசனத்திலிருந்து புரிந்துகொள்ளப்பட்டாலும், இந்த வசனத்தைத் தமிழில் தெளிவாகவும் இயல்பாகவும் வாசிக்க இங்கே வெளிப்படையாகக் கொடுக்கப்பட்டுள்ளது; אֶת குறிக்கும் ஆபிரகாமுடனான உறவு ‘ஆபிரகாமுடன்’ என வழங்கப்பட்டது.
- source_word: אַבְרָהָם
  choice: ஆபிரகாம்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள பெயர் வடிவம்.
- source_word: וּשְׁבוּעָתוֹ
  choice: தமது ஆணையையும்
  rationale: שְׁבוּעָה என்பது சத்தியப்பிரமாணமாக உறுதிப்படுத்தப்பட்ட ஆணையைக் குறிக்கிறது. ‘ஆணை’ நவீனத் தமிழில் சுருக்கமாகவும் கண்ணியமாகவும் உள்ளது; மூன்றாம் ஆண்பால் ஒருமை உடைமை விகுதி, தேவனைச் சுட்டும் ‘தமது’ எனத் தரப்பட்டுள்ளது.
- source_word: לְיִשְׂחָק
  choice: ஈசாக்குக்கு அளித்த
  rationale: לְ என்பது ஆணை யாரை நோக்கி அல்லது யாருக்கு அளிக்கப்பட்டது என்பதைக் குறிக்கிறது. தமிழில் ‘ஈசாக்குக்கு அளித்த’ என்பது அந்தத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: முந்தைய வசனத்திலிருந்து தொடரும் மறைமுகமான ‘உடன்படிக்கை’
  choice: ‘அவர் ஆபிரகாமுடன் செய்த உடன்படிக்கையையும்’ என்று உடன்படிக்கையை வெளிப்படையாகக் கூறுதல்
  alternative: ‘அவர் ஆபிரகாமுடன் செய்ததையும்’ அல்லது சொல்லுக்குச் சொல் முறையில் ‘அவர் ஆபிரகாமுடன் வெட்டியதையும்’
  rationale: எபிரெயத்தில் ‘உடன்படிக்கை’ என்ற பெயர்ச்சொல் முந்தைய வசனத்திலிருந்து தொடர்கிறது. தமிழில் அதை விடுத்தால் பொருள் தெளிவிழக்கும்; ‘வெட்டினார்’ என்ற சொல்லுக்குச் சொல் வடிவம் எபிரெய மரபுத்தொடரைத் தவறாகப் புரியச் செய்யும். வெளிப்படையாகச் சேர்ப்பது புதிய இறையியல் கருத்தை இறக்குமதி செய்யாமல் மூலத்தின் தொடர்ச்சியைத் தெளிவாக்குகிறது.
- issue: שְׁבוּעָה என்பதன் மொழிபெயர்ப்பு
  choice: ஆணை
  alternative: சத்தியம்; சத்தியப்பிரமாணம்; உறுதிமொழி
  rationale: இங்கு தேவன் ஈசாக்குக்கு உறுதிப்படுத்திய solemn oath குறிக்கப்படுகிறது. ‘ஆணை’ கவிதைநடைக்கு ஏற்ற சுருக்கத்தையும் வலிமையையும் காக்கிறது; அதேவேளையில் ஒரு குறிப்பிட்ட சமய மரபின் விளக்கத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; சங்கீதத்தின் கண்ணியமான கவிதைநடை பேணப்பட்டுள்ளது. இந்த வசனம் முந்தைய வசனத்தின் வாக்கியத்தைத் தொடர்வதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது. ‘உடன்படிக்கை’ தெளிவுக்காக முந்தைய வசனத்திலிருந்து மீண்டும் வெளிப்படுத்தப்பட்டுள்ளது; அடிக்குறிப்பு குறியீடு அதனுடன் இணைக்கப்பட்டுள்ளது.
