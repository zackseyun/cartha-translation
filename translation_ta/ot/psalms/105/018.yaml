  text: They afflicted his feet with shackles[b][a]; his neck came into iron.
translation:
  language: ta
  text: அவனுடைய கால்களைக் கால் விலங்கால் துன்புறுத்தினார்கள்; அவனுடைய உயிர் இரும்புக்குள் வந்தது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனுடைய கழுத்து இரும்புக்குள் வந்தது,” அதாவது அவனுக்கு இரும்புக் கழுத்துப்பட்டை அல்லது சங்கிலி இடப்பட்டது. எபிரெயச் சொற்றொடர் பொருள் காண்பதற்குக் கடினமானது; “உயிர்” (நெஃபெஷ்) என்பது சில சூழல்களில் முழு மனிதனையோ, இங்கு கழுத்து அல்லது தொண்டைப் பகுதியையோ குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִנּוּ
  choice: துன்புறுத்தினார்கள்
  rationale: Piel வடிவிலுள்ள ענה இங்கு ‘துன்புறுத்து, ஒடுக்கு’ என்ற பொருளைத் தருகிறது. சிறைவாசத்தின் வேதனையைத் தெளிவாகக் காட்டுவதோடு, குறிப்பிடப்படாத பன்மை எழுவாயையும் இத்தேர்வு காக்கிறது.
- source_word: בַכֶּבֶל
  choice: கால் விலங்கால்
  rationale: כבל என்பது கைதி தப்பாதபடி காலில் இடப்படும் விலங்கு அல்லது கட்டைக் குறிக்கிறது. கருவிப் பொருளைக் காட்டும் ב முன்னொட்டுக்கு ‘-ஆல்’ இயல்பாகப் பொருந்துகிறது.
- source_word: רַגְלָיו
  choice: அவனுடைய கால்களை
  rationale: இந்தச் சூழலில் רגליו இயல்பாக அவனுடைய கால்களைக் குறிக்கிறது.
- source_word: בַּרְזֶל
  choice: இரும்புக்குள்
  rationale: בַּרְזֶל என்பதன் நேர்ப்பொருள் ‘இரும்பு.’ எபிரெயத்தில் கழுத்துப்பட்டை அல்லது சங்கிலி என்று வெளிப்படையாக இல்லை; ב முன்னொட்டின் இடப்பொருளையும் கடினமான கவித்துவப் படிமத்தையும் ‘இரும்புக்குள்’ காக்கிறது.
- source_word: בָּאָה
  choice: வந்தது
  rationale: பெண்பால் ஒருமை வினையான בָּאָה, பெண்பால் பெயர்ச்சொல்லான נַפְשׁוֹ உடன் இலக்கண ஒத்திசைவு பெறுகிறது. ஆகவே ‘இரும்பு உயிர்மேல் வந்தது’ என்று எழுவாயை மாற்றாமல், ‘உயிர் ... வந்தது’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: נַפְשׁוֹ
  choice: அவனுடைய உயிர்
  rationale: נפש என்பது உயிர், தன்மனிதன், அல்லது சூழலுக்கு ஏற்ப கழுத்து/தொண்டைப் பகுதி எனவும் குறிக்கலாம். ‘உயிர்’ அதன் விரிந்த பொருளையும் எபிரெயக் கவித்துவத்தையும் காக்கிறது; உடற்கூறு சார்ந்த மாற்றுப் புரிதல் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: נַפְשׁוֹ என்பதைக் ‘ஆத்துமா’ எனத் தனித்த இறையியல் கூறாக வாசிக்கும் வாய்ப்பு
  choice: உயிர்
  alternative: ஆத்துமா / கழுத்து / அவன்
  rationale: இங்கு சிறைவாசத்தின் உடல்சார்ந்த சூழலில் נפש என்ற சொல்லை ஒரு குறிப்பிட்ட மனிதவியல் கோட்பாட்டுக்குள் கட்டுப்படுத்தாமல், அதன் பரந்த எபிரெயப் பொருளை ‘உயிர்’ காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகருக்குப் புரியும் கண்ணியமான நடையைக் கடைப்பிடிக்கிறது. இரண்டாம் அடியின் எபிரெய இலக்கண அமைப்பையும் திட்டமிட்ட கவித்துவக் கடினத்தையும் இயன்றவரை காத்து, சாத்தியமான உடற்கூறு விளக்கத்தை அடிக்குறிப்பில் வழங்குகிறது.
