  source_fidelity: மூல எபிரெயத்தின் முதல் அடியில் உள்ள குறிப்பிடப்படாத பன்மை எழுவாய், கால்களை விலங்கால் துன்புறுத்துதல், இரண்டாம் அடியில் பெண்பால் வினையுடன் பொருந்தும் נַפְשׁוֹ (‘அவனுடைய உயிர்’) எழுவாய் ஆகியவை துல்லியமாகக் காக்கப்பட்டுள்ளன. ‘இரும்புக்குள் வந்தது’ என்பது தமிழில் திட்டமிட்ட கவித்துவக் கடினத்தைக் கொண்டிருந்தாலும், மூலத்தின் விவாதத்துக்குரிய படிமத்தை மிகையாக விளக்காமல் காக்கிறது.
