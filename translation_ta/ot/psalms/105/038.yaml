  text: שָׂמַ֣ח מִצְרַ֣יִם בְּ/צֵאתָ֑/ם כִּֽי נָפַ֖ל פַּחְדָּ֣/ם עֲלֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/038.yaml
  text: Egypt was glad when they departed[b][a], for dread of them had fallen upon them.
translation:
  language: ta
  text: அவர்கள் புறப்பட்டபோது எகிப்து மகிழ்ந்தது; ஏனெனில் அவர்களைப் பற்றிய அச்சம் எகிப்தியர்கள்மேல் விழுந்திருந்தது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׂמַח
  choice: மகிழ்ந்தது
  rationale: Qal நிறைவுவினை எகிப்தை ஒரு கூட்டுமொத்தமாகக் கொண்டு, அதன் நிறைவுற்ற மகிழ்ச்சியைத் தெரிவிக்கிறது; ‘மகிழ்ந்தது’ இயல்பான நவீனத் தமிழ்.
- source_word: מִצְרַיִם
  choice: எகிப்து
  rationale: மூலத்தில் நாட்டின் பெயரே கூட்டுப்பொருளில் எழுவாயாக வருகிறது; அதைப் பாதுகாக்க ‘எகிப்து’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: בְּצֵאתָם
  choice: அவர்கள் புறப்பட்டபோது
  rationale: בְּ + יצא என்பதன் infinitive construct மற்றும் மூன்றாம் நபர் ஆண்பால் பன்மை பின்னொட்டு, இஸ்ரவேலர் வெளியேறிய காலச்சூழலைக் குறிக்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: எகிப்து மகிழ்ந்ததற்கான காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: נָפַל
  choice: விழுந்திருந்தது
  rationale: மக்கள் புறப்படும் நேரத்துக்கு முன்பே ஏற்பட்டிருந்து தொடர்ந்த நிலையைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; ‘விழுதல்’ என்ற எபிரெய உருவகத்தையும் காக்கிறது.
- source_word: פַּחְדָּם
  choice: அவர்களைக் குறித்த திகில்
  rationale: פַּחַד வலுவான அச்சம் அல்லது திகிலைக் குறிக்கிறது; பின்னொட்டு இங்கு இஸ்ரவேலரால் உண்டான, அவர்களைக் குறித்த அச்சத்தைக் காட்டுகிறது.
- source_word: עֲלֵיהֶם
  choice: எகிப்தியர்கள்மேல்
  rationale: எபிரெயத்தில் உள்ள பன்மைப் பிரதிப்பெயர் எகிப்து மக்களைக் குறிக்கிறது. தமிழில் தொடர்ச்சியாக வரும் பிரதிப்பெயர்களின் குறிப்பு குழப்பமடையாமல் இருக்க, பொருள் வெளிப்படையாகத் தரப்பட்டுள்ளது.
