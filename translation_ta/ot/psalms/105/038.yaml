revisions:
- from: அவர்கள் புறப்பட்டபோது எகிப்து மகிழ்ந்தது; ஏனெனில் அவர்களைக் குறித்த திகில் எகிப்தியர்கள்மேல் விழுந்திருந்தது.
  to: அவர்கள் புறப்பட்டபோது எகிப்து மகிழ்ந்தது; ஏனெனில் அவர்களைப் பற்றிய அச்சம் எகிப்தியர்கள்மேல் விழுந்திருந்தது.
  rationale: Replaced “அவர்களைக் குறித்த திகில்” with the more natural and semantically balanced “அவர்களைப் பற்றிய அச்சம்.” The explicit reference to the Egyptians is retained to distinguish them from the departing Israelites and avoid pronoun ambiguity.
