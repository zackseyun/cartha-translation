translation_notes:
  register: நவீன தரத் தமிழில், சங்கீத மொழிக்கேற்ற கண்ணியமான ஆனால் பொதுவாசகருக்குப் புரியும் நடை. மூலத்தின் ‘எகிப்து’ என்ற கூட்டுமொத்த எழுவாயும் ‘திகில் ... மேல் விழுந்தது’ என்ற உருவகமும் பாதுகாக்கப்பட்டுள்ளன; இரு வேறு குழுக்களைக் குறிக்கும் பன்மைப் பிரதிப்பெயர்களால் ஏற்படும் குழப்பம் மட்டும் ‘எகிப்தியர்கள்மேல்’ என்று தெளிவாக்கப்பட்டுள்ளது.
