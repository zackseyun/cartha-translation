  text: Their land swarmed with frogs[a], even in the chambers of their kings.
translation:
  language: ta
  text: 'அவர்களுடைய நாடு தவளைகளால் கூட்டங்கூட்டமாக நிறைந்தது;

    அவர்களுடைய அரசர்களின் அறைகளில்கூட.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் “அவர்களுடைய அரசர்கள்” என்று பன்மையில் உள்ளது. யாத்திராகமத்தின் தவளை வாதை விவரிப்பில் அரசன் ஒருமையில் குறிப்பிடப்படுகிறான்; ஆனால் இச்சங்கீதத்தில் பன்மை பயன்படுத்தப்பட்டுள்ளது. இது கவிதைநடையிலான அல்லது கூட்டுப்பொருள் கொண்ட வெளிப்பாடாக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁרַץ
  choice: கூட்டங்கூட்டமாக நிறைந்தது
  rationale: இந்த வினை பெருமளவில் பெருகிப் பரவுவதைக் குறிக்கிறது. தவளைகளின் படையெடுப்பை இயல்பான நவீன தமிழில் தெளிவாகவும் உயிரோட்டமாகவும் தெரிவிக்கிறது.
- source_word: אַרְצָם
  choice: அவர்களுடைய நாடு
  rationale: மூன்றாம் நபர் ஆண்பால் பன்மை பின்னொட்டுடன் உள்ள சொல்லை நேரடியாகவும் இயல்பாகவும் மொழிபெயர்க்கிறது; சூழலில் இது எகிப்தைக் குறிக்கிறது.
- source_word: צְפַרְדְּעִים
  choice: தவளைகள்
  rationale: மூலச்சொல்லின் வழக்கமான, தெளிவான தமிழ் இணைச்சொல்.
- source_word: בְּחַדְרֵי
  choice: அறைகளுக்குள்ளும்
  rationale: בְּ என்ற முன்னொட்டு அடிப்படையில் இருப்பிடத்தைக் குறித்தாலும், שָׁרַץ வினையின் விளைவைக் கருத்தில் கொண்டு தவளைகள் அறைகளுக்குள் பரவியதை இயல்பான தமிழில் கூறுகிறது. ‘உள்ளும்’ என்பது அவை அங்கேயும் இருந்ததை வலியுறுத்துகிறது.
- source_word: מַלְכֵיהֶם
  choice: அவர்களுடைய அரசர்களின்
  rationale: எபிரெய வடிவம் மூன்றாம் நபர் ஆண்பால் பன்மை பின்னொட்டுடன் கூடிய பன்மைச் சொல். ஆகவே யாத்திராகமக் கதையின் ஒருமையுடன் ஒத்திசைக்காமல் பன்மை பாதுகாக்கப்படுகிறது.
