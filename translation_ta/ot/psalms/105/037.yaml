  yaml_path: translation/ot/psalms/105/037.yaml
  text: He brought them out with silver and gold[a], and among his tribes there was no one who stumbled.
translation:
  language: ta
  text: அவர் அவர்களை வெள்ளியோடும் பொன்னோடும் வெளியே கொண்டுவந்தார்; அவருடைய கோத்திரங்களில் தடுமாறியவர் ஒருவரும் இல்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவருடைய கோத்திரங்களில் பலவீனமானவர் ஒருவரும் இல்லை.” எபிரெய வினையெச்சம் தடுமாறுதல், தளர்தல் அல்லது பலவீனமாதல் ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִיאֵם
  choice: அவர் அவர்களை வெளியே கொண்டுவந்தார்
  rationale: יצא என்பதன் ஹிஃபில் வடிவம் ‘வெளியே போகச் செய்தார்’ என்ற பொருளைத் தருகிறது. ‘வெளியே கொண்டுவந்தார்’ என்பது யாத்திராகமச் சூழலில் இறைவனுடைய செயலைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: בְּכֶסֶף וְזָהָב
  choice: வெள்ளியோடும் பொன்னோடும்
  rationale: இங்குள்ள בְּ உடனிருப்பு அல்லது உடைமை சார்ந்த பொருளைத் தருகிறது. இஸ்ரவேலர் வெள்ளியும் பொன்னும் உடையவர்களாக வெளியே வந்ததை இது தெரிவிக்கிறது; அவர்கள் எவ்வளவு சுமந்தார்கள் என்பதை உரை கூறாததால் அதற்கு மேல் விளக்கம் சேர்க்கப்படவில்லை.
- source_word: וְאֵין
  choice: ஒருவனும் இல்லை
  rationale: இல்லாமையைச் சுட்டும் אֵין, பின்வரும் ஒருமை வினையெச்சத்துடன் தமிழில் இயல்பாக அமைய ‘ஒருவனும் இல்லை’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: בִּשְׁבָטָיו
  choice: அவனுடைய கோத்திரங்களில்
  rationale: எபிரெய உரையிலுள்ள மூன்றாம் நபர் ஆண்பால் ஒருமை உடைமை விகுதி அப்படியே பாதுகாக்கப்பட்டுள்ளது. இது இஸ்ரவேல் அல்லது யாக்கோபை ஒருமையான கூட்டு ஆளுமையாகக் குறிப்பிடுகிறது.
- source_word: כּוֹשֵׁל
  choice: தடுமாறியவன்
  rationale: כשל என்பது தடுமாறுதல், தளர்தல் அல்லது பலவீனமாதல் ஆகிய பொருட்களைத் தரக்கூடும். ‘தடுமாறியவன்’ மூலத்தின் உருவகச் செயற்பாட்டைத் தக்கவைக்கிறது; பயணிக்க இயலாத அளவுக்குப் பலவீனமானவர் யாரும் இல்லை என்ற உட்பொருளையும் அனுமதிக்கிறது.
theological_decisions:
- issue: ‘அவனுடைய கோத்திரங்கள்’ என்பதிலுள்ள ஒருமை உடைமைச் சுட்டின் குறிப்பு
  choice: எபிரெய மூலத்திலுள்ள ஒருமையைப் பாதுகாத்து, இஸ்ரவேல்/யாக்கோபை ஒருமையான கூட்டு ஆளுமையாகக் குறித்தல்
  alternative: ‘அவர்களுடைய கோத்திரங்களில்’ என்று மக்களை நேரடியாகப் பன்மையில் குறிப்பிடுதல்
  rationale: மூலத்தில் மூன்றாம் நபர் ஆண்பால் ஒருமை விகுதி உள்ளது. சங்கீதத்தின் கவிதை மொழியில் இஸ்ரவேல் ஒருமையான ஆளுமையாகக் கருதப்படலாம்; இதைப் பாதுகாப்பது தேவையற்ற இறையியல் விளக்கத்தைச் சேர்க்காமல் மூலத்துக்கு நெருக்கமாக உள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘கோத்திரங்கள்’ என்பது வேதாகமச் சூழலில் பரவலாக அறியப்படும் சொல்லாக இருப்பதால் தக்கவைக்கப்பட்டது; எபிரெய ஒருமை உடைமைச் சுட்டை வெளிப்படுத்த ‘அவனுடைய’ பயன்படுத்தப்பட்டது.
