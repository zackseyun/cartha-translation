- from: அவர் அவர்களை வெள்ளியோடும் பொன்னோடும் வெளியே கொண்டுவந்தார்; அவனுடைய கோத்திரங்களில் தடுமாறியவன் ஒருவனும் இல்லை.[a]
  to: அவர் அவர்களை வெள்ளியோடும் பொன்னோடும் வெளியே கொண்டுவந்தார்; அவருடைய கோத்திரங்களில் தடுமாறியவர் ஒருவரும் இல்லை.[a]
