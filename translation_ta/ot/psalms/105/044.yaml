source:
  edition: WLC
  text: וַ/יִּתֵּ֣ן לָ֭/הֶם אַרְצ֣וֹת גּוֹיִ֑ם וַ/עֲמַ֖ל לְאֻמִּ֣ים יִירָֽשׁוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/044.yaml
  text: He gave them the lands of the nations[a], and they inherited the labor of the peoples.
translation:
  language: ta
  text: அவர் அவர்களுக்கு நாடுகளின் நிலங்களைக் கொடுத்தார்; அவர்கள் மக்களின் உழைப்பைச் சுதந்தரித்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள் மக்களின் உழைப்பால் கிடைத்தவற்றை உரிமையாகப் பெற்றார்கள்.” எபிரெயச் சொல் உழைப்பையே அல்லது அந்த உழைப்பால் கிடைத்தவற்றையே குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: அவர் கொடுத்தார்
  rationale: נתן என்பதன் Qal wayyiqtol வடிவம் கொடுத்தலை நேரடியாகக் குறிக்கிறது. தமிழில் இயல்பான கடந்தகாலத் தொடராக மொழிபெயர்க்கப்பட்டது.
- source_word: לָהֶם
  choice: அவர்களுக்கு
  rationale: மூன்றாம் நபர் ஆண்பால் பன்மை பின்னொட்டு; இச்சூழலில் மறைமுகச் செயப்படுபொருளாக உள்ளது.
- source_word: אַרְצוֹת גּוֹיִם
  choice: நாடுகளின் நிலங்கள்
  rationale: אַרְצוֹת என்பதன் பன்மையைத் தக்கவைத்து, גּוֹיִם என்பதை இந்நிலப்பரப்பு சார்ந்த சூழலில் இயல்பாக ‘நாடுகள்’ என வழங்குகிறது.
- source_word: וַעֲמַל
  choice: உழைப்பின் பலன்
  rationale: עָמָל என்பது உழைப்பு அல்லது வருத்தமான பாடுபாட்டையும், ஆகுபெயராக அந்த உழைப்பால் கிடைத்தவற்றையும் குறிக்கலாம். ‘உரிமையாக்கிக்கொண்டார்கள்’ என்பதுடன் இயல்பாக அமைய இங்கு ‘உழைப்பின் பலன்’ பயன்படுத்தப்பட்டது; அடிப்படைச் சொல்லின் மாற்று வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: לְאֻמִּים
  choice: மக்களினங்களின்
  rationale: לְאֻמִּים பல்வேறு மக்கள் கூட்டங்களைக் குறிக்கிறது. முன்வரும் גּוֹיִם என்பதற்கான ‘நாடுகள்’ என்பதை மீண்டும் கூறாமல் வேறுபாட்டைப் பேணுகிறது.
- source_word: יִירָשׁוּ
  choice: அவர்கள் உரிமையாக்கிக்கொண்டார்கள்
  rationale: ירש என்பது சுதந்தரித்தல், உடைமையாக்குதல் அல்லது கைப்பற்றுதல் என்ற பொருள் வரம்பைக் கொண்டது. தேவன் கொடுத்ததன் விளைவாக அவர்கள் உடைமையாக்கியதை இயல்பான தமிழில் கூறுகிறது; சுதந்தரித்தல் என்ற உடன்படிக்கை நுண்ணர்த்தம் அடிக்குறிப்பில் சுட்டப்படுகிறது.
theological_decisions:
- issue: ירש என்பதிலுள்ள உடன்படிக்கை மற்றும் உடைமையாக்குதல் நுண்ணர்த்தம்
  choice: அவர்கள் உரிமையாக்கிக்கொண்டார்கள்
  alternative: அவர்கள் சுதந்தரித்துக்கொண்டார்கள்
  rationale: முதல் அரையடியில் தேவனே நிலங்களைக் கொடுத்தார் என்பதால், வெறும் இராணுவக் கைப்பற்றுதலை உரை வலியுறுத்தவில்லை. அதேவேளை ‘சுதந்தரித்தார்கள்’ என்பது தமிழில் குடும்ப மரபுரிமையாக மட்டும் புரியக்கூடும்; ஆகவே தெய்வீகக் கொடையின் பின்னணியில் உடைமையாக்குதலைக் காட்டும் சொற்றொடர் தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீனச் செந்தமிழுக்கு ஏற்ற, கண்ணியமான பொதுநடை பயன்படுத்தப்பட்டுள்ளது. கவிதை இணைநிலையைப் பேண ‘நாடுகள்’ மற்றும் ‘மக்களினங்கள்’ என வேறுபடுத்தப்பட்டுள்ளது; எபிரெயச் சொல்லின் உண்மையான பொருள் இருமை அடிக்குறிப்பில் தக்கவைக்கப்பட்டுள்ளது.
