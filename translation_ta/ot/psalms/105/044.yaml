revisions:
- from: அவர் அவர்களுக்கு நாடுகளின் நிலங்களைக் கொடுத்தார்; மக்களினங்களின் உழைப்பின் பலனை அவர்கள் உரிமையாக்கிக்கொண்டார்கள்.[a]
  to: அவர் அவர்களுக்கு நாடுகளின் நிலங்களைக் கொடுத்தார்; அவர்கள் மக்களின் உழைப்பைச் சுதந்தரித்தார்கள்.[a]
  rationale: The revision follows the Hebrew more closely by rendering עָמָל directly as “உழைப்பு” and יִירָשׁוּ as “சுதந்தரித்தார்கள்.” The footnote preserves the legitimate extended sense of עָמָל as the goods or produce gained through labor. The resulting Tamil is concise, modern-standard, and suitably elevated for the psalm’s register.
  reviewer_model: gpt-5.6-terra
