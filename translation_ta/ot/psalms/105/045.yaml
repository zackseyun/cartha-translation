source:
  edition: WLC
  text: בַּ/עֲב֤וּר יִשְׁמְר֣וּ חֻ֭קָּי/ו וְ/תוֹרֹתָ֥י/ו יִנְצֹ֗רוּ הַֽלְלוּ יָֽהּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/045.yaml
  text: so that they might keep his statutes and observe his laws[b][a]. Praise Yah!
translation:
  language: ta
  text: 'அவர்கள் அவருடைய நியமங்களைக் கடைப்பிடிக்கவும்,


    அவருடைய போதனைகளைக் காத்துக்கொள்ளவும் என்பதற்காக.


    யாவைப் புகழுங்கள்![a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “யாவைப் புகழுங்கள்!” இங்குள்ள “யா” என்பது இறைப்பெயரின் குறுகிய வடிவம்; முழுச் சொற்றொடர் பொதுவாக “அல்லேலூயா” என்றும் வழங்கப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: בַּעֲבוּר
  choice: …பதற்காகவே
  rationale: இச்சொல் நோக்கம் அல்லது விளைவை அறிமுகப்படுத்துகிறது. இங்கு சங்கீதத்தின் முந்தைய செயல்களுக்கு உரிய நோக்கத்தை இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: יִשְׁמְרוּ
  choice: கைக்கொண்டு
  rationale: கட்டளைகள் அல்லது நியமங்களை உண்மையுடன் கடைப்பிடித்தல் என்ற உடன்படிக்கைச் சூழலிலுள்ள பொருளைப் பாதுகாக்கிறது.
- source_word: חֻקָּיו
  choice: அவருடைய நியமங்களை
  rationale: חֹק என்பது விதிக்கப்பட்ட சட்டநியமங்களைக் குறிக்கிறது; ‘நியமங்கள்’ அதன் சட்ட மற்றும் உடன்படிக்கை நுணுக்கத்தை இயல்பான தமிழில் தருகிறது.
- source_word: וְתוֹרֹתָיו
  choice: அவருடைய போதனைகளை
  rationale: תּוֹרָה என்பதன் பன்மை சட்டங்கள் மட்டுமல்லாமல் அறிவுறுத்தல்கள் அல்லது போதனைகளையும் குறிக்கலாம். ‘போதனைகள்’ அந்த விரிவைத் தக்கவைக்கிறது.
- source_word: יִנְצֹרוּ
  choice: கவனமாகக் கடைப்பிடித்து
  rationale: נצר என்பதில் பாதுகாத்தல், விழிப்புடன் காத்தல் என்ற வலிமை உள்ளது. ‘கவனமாகக் கடைப்பிடித்து’ என்பது முதல் வினையைக் காரணமின்றி அப்படியே மீண்டும் கூறாமல் அந்த நுணுக்கத்தை வெளிப்படுத்துகிறது.
- source_word: הַלְלוּ יָהּ
  choice: யாவைப் புகழுங்கள்!
  rationale: கட்டளை வினையை மொழிபெயர்த்து, மூலத்தில் உள்ள இறைப்பெயரின் குறுகிய வடிவமான יָהּ என்பதை ‘யா’ எனத் தக்கவைக்கிறது.
theological_decisions:
- issue: இறுதி துதிக்கூற்றிலுள்ள இறைப்பெயரின் வடிவம்
  choice: யாவைப் புகழுங்கள்!
  alternative: கர்த்தரைப் புகழுங்கள்! / அல்லேலூயா!
  rationale: எபிரெய உரையில் முழு יהוה அல்ல, அதன் குறுகிய வடிவமான יָהּ உள்ளது. ‘யா’ என வழங்குவது அந்த வேறுபாட்டை மறைக்காமல் பாதுகாக்கிறது; ‘புகழுங்கள்’ என்பது הללו என்ற கட்டளையின் பொருளை வெளிப்படையாகத் தருகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய இணைவாக்கியத்தின் இரு வேறு வினைகளும் ‘கைக்கொண்டு’ மற்றும் ‘கவனமாகக் கடைப்பிடித்து’ என வேறுபடுத்தப்பட்டுள்ளன; תורה என்பதன் ‘அறிவுறுத்தல்/போதனை’ என்ற பரந்த பொருள் தேவையின்றி ‘சட்டம்’ எனக் குறுக்கப்படவில்லை.
