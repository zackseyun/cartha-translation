  text: לֵ/אמֹ֗ר לְ/ךָ֗ אֶתֵּ֥ן אֶת אֶֽרֶץ כְּנָ֑עַן חֶ֝֗בֶל נַחֲלַתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/011.yaml
  text: saying[a], “To you I will give the land of Canaan[b], the portion of your inheritance.”
translation:
  language: ta
  text: 'என்று கூறினார்: “உங்கள்[a] மரபுரிமைப் பங்கான[b] கானான் நாட்டை உனக்குக் கொடுப்பேன்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘உனக்கு’ என்பது ஒருமையிலும், ‘உங்கள்’ என்பது பன்மையிலும் உள்ளது; ஆபிரகாம் அவரது சந்ததியினரின் பிரதிநிதியாக இங்கு அழைக்கப்படுவதை இது சுட்டக்கூடும்.
    reason: alternative_reading
  - marker: b
    text: ‘பங்கு’ என்பதற்கான எபிரெயச் சொல் சொல்லர்த்தமாக ‘அளவிடும் கயிறு’ அல்லது ‘அளவுக்கோடு’ எனப் பொருள்படும்; நிலத்தை அளந்து ஒதுக்குவதன் அடிப்படையில் அது ஒதுக்கப்பட்ட நிலப்பங்கைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵאמֹר
  choice: என்று கூறினார்
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட உடன்படிக்கை வாக்கை நேரடி மேற்கோளாக அறிமுகப்படுத்துகிறது. தமிழில் இயல்பான இணைப்பைத் தருவதற்காக எபிரெய வினையெச்ச வடிவம் சூழலுக்கேற்ற இறந்தகால வினையாக மொழிபெயர்க்கப்பட்டது.
- source_word: לְךָ
  choice: உனக்கு
  rationale: இது இரண்டாம் நபர் ஆண்பால் ஒருமை வடிவம். ஆபிரகாமை நேரடியாக ஒருமையில் அழைக்கும் எபிரெய வடிவத்தைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: אֶתֵּן
  choice: கொடுப்பேன்
  rationale: முதலாம் நபர் ஒருமை முற்றுப்பெறாத வினை இச்சூழலில் எதிர்கால வாக்குறுதியைக் குறிக்கிறது.
- source_word: אֶרֶץ כְּנָעַן
  choice: கானான் நாடு
  rationale: கானான் எனப்படும் நிலப்பரப்பை இயல்பான நவீன தமிழில் குறிக்கிறது.
- source_word: חֶבֶל
  choice: பங்கு
  rationale: சொல்லின் அடிப்படைப் பொருள் அளவிடும் கயிறு அல்லது கோடு என்றாலும், நிலப் பங்கீட்டுச் சூழலில் அது ஒதுக்கப்பட்ட நிலப்பங்கைக் குறிக்கிறது.
- source_word: נַחֲלַתְכֶם
  choice: உங்கள் உரிமைச்சொத்து
  rationale: மரபாக அல்லது ஒதுக்கீடாகப் பெறப்படும் உடைமையைக் குறிக்கிறது. பன்மை உடைமை விகுதியை ‘உங்கள்’ என்று வெளிப்படையாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: வாக்குறுதியில் ஒருமை அழைப்பிலிருந்து பன்மை உடைமைக்கு மாறுதல்
  choice: ‘உனக்கு ... உங்கள்’ என்ற எண் மாற்றத்தை அப்படியே வைத்தல்
  alternative: ‘உனக்கு ... உன் உரிமைச்சொத்து’ என்று ஒருமைப்படுத்துதல் அல்லது ‘உன் சந்ததியினரின் உரிமைச்சொத்து’ என்று விளக்கி எழுதுதல்
  rationale: எபிரெயம் முதலில் ஆபிரகாமை ஒருமையில் அழைத்து, பின்னர் பன்மை உடைமை விகுதியைப் பயன்படுத்துகிறது. ஆபிரகாமும் அவரது சந்ததியினரும் இடையிலான தொடர்பை மொழிபெயர்ப்பிலேயே தீர்மானித்து விளக்காமல், மூலத்தின் இறையியல் அழுத்தத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. ‘உரிமைச்சொத்து’ என்பது சாதாரண வாசகருக்குப் புரியும்படி பரம்பரை அல்லது ஒதுக்கீட்டால் கிடைக்கும் உடைமையின் கருத்தைத் தருகிறது. ‘அதுவே’ என்பது எபிரெயத்தில் அடுத்தடுத்து நிற்கும் ‘கானான் நாடு’ மற்றும் ‘உங்கள் உரிமைச்சொத்தின் பங்கு’ ஆகியவற்றின் விளக்கவுரைத் தொடர்பை தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
