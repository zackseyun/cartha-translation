id: PSA.105.7
reference: Psalms 105:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: ה֭וּא יְהוָ֣ה אֱלֹהֵ֑י/נוּ בְּ/כָל הָ֝/אָ֗רֶץ מִשְׁפָּטָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/007.yaml
  text: He is Yahweh our God[b][a]; his judgments are in all the earth.
translation:
  language: ta
  text: அவரே யாவே[a], நம் கடவுள்; பூமியெங்கும் அவருடைய நீதித்தீர்ப்புகள்[b] உள்ளன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயம்: ‘YHWH’; ‘யெகோவா’ என்றும் வழங்கப்படுகிறது.'
    reason: alternative_reading
  - marker: b
    text: அல்லது, ‘நியமங்கள்’ அல்லது ‘நீதி’; எபிரெயச் சொல் நீதித்தீர்ப்புகள், ஆணைகள் அல்லது நீதி ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּא
  choice: அவரே
  rationale: தனித்து வரும் வலியுறுத்தப்பட்ட பதிலிப்பெயரை இயல்பான தமிழில் ‘அவரே’ என வழங்குகிறது; எபிரெயத்தில் நிகழ்கால இணைப்புவினை வெளிப்படையாக இல்லை.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கு எழுத்துப் பெயரை பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֱלֹהֵינוּ
  choice: நம் கடவுள்
  rationale: முதல் நபர் பன்மை உடைமைப் பின்னொட்டுடன் உள்ள வடிவின் நேரடியான, இயல்பான தமிழ்.
- source_word: בְּכָל הָאָרֶץ
  choice: பூமியெங்கும்
  rationale: בְּכָל என்பதன் பரவலான இடப்பொருளையும், இச்சூழலில் הָאָרֶץ என்பதன் உலகளாவிய நோக்கையும் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: מִשְׁפָּטָיו
  choice: அவருடைய நீதித்தீர்ப்புகள்
  rationale: நீதிமுறைத் தீர்ப்புகள், நியமங்கள், நீதி ஆகிய பொருள் வீச்சை உடைய சொல்லுக்கு இச்சூழலில் நேரடியான தெரிவு; மாற்றுப் பொருள்களை அடிக்குறிப்பு காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: யெகோவா; கர்த்தர்
  rationale: மூலத்தில் ஒரு பட்டம் அல்ல, தெய்வீகத் தனிப்பெயரே உள்ளது. ஆகவே பெயரை ஒலிபெயர்த்து, மாற்று மரபுவழி வடிவத்தை அடிக்குறிப்பில் தருகிறது.
- issue: מִשְׁפָּטָיו என்பதன் பொருள் வீச்சு
  choice: அவருடைய நீதித்தீர்ப்புகள்
  alternative: அவருடைய நியமங்கள்; அவருடைய நீதி
  rationale: சொல்லின் நீதித்துறை சார்ந்த அடிப்படை உணர்வைப் பேணுகிறது; அது தீர்ப்புகளையா, கட்டளைகளையா, நீதியின் செயல்பாட்டையா குறிக்கிறது என்பதை அளவுக்கு மீறி முடிவுசெய்யாமல் மாற்றுகளை அடிக்குறிப்பில் பதிவு செய்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டுக்குரிய கண்ணியத்தையும் பொதுவாசகர்களுக்கான தெளிவையும் இணைக்கும் நடை. எபிரெய வலியுறுத்தலை ‘அவரே’ என்றும் உலகளாவிய பரப்பை ‘பூமியெங்கும்’ என்றும் இயல்பாக வழங்கியுள்ளது.
