id: PSA.105.4
reference: Psalms 105:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: דִּרְשׁ֣וּ יְהוָ֣ה וְ/עֻזּ֑/וֹ בַּקְּשׁ֖וּ פָנָ֣י/ו תָּמִֽיד׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/004.yaml
  text: Seek Yahweh and his strength[a]; seek his face continually.
translation:
  language: ta
  text: 'யாவேயையும் அவருடைய வல்லமையையும் நாடுங்கள்;

    அவருடைய முகத்தை[a] எப்போதும் தேடுங்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவருடைய பிரசன்னத்தை எப்போதும் தேடுங்கள்.” எபிரெயத்தில் சொல்லர்த்தமாக, “அவருடைய முகத்தை எப்போதும் தேடுங்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּרְשׁוּ
  choice: நாடுங்கள்
  rationale: வழிபாட்டுச் சூழலில் தேவனை ஆர்வத்துடனும் நோக்கத்துடனும் தேடுவதைக் குறிக்கும் பன்மை கட்டளை. ‘நாடுங்கள்’ என்பது பக்திசார்ந்த தொடர்ந்த திருப்பத்தையும் விருப்பத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது பட்டப்பெயர் அல்ல, இஸ்ரவேலுக்கு வெளிப்படுத்தப்பட்ட தேவனுடைய தனிப்பெயர். எபிரெய நான்கெழுத்துப் பெயரின் பரவலாக ஏற்றுக்கொள்ளப்பட்ட ஒலிபெயர்ப்பைத் தமிழில் ‘யாவே’ என வழங்குகிறது.
- source_word: וְעֻזּוֹ
  choice: அவருடைய வல்லமையையும்
  rationale: עֹז என்பது பலம், வலிமை அல்லது வல்லமையைக் குறிக்கும். இச்சங்கீதத்தின் உயர்ந்த நடைக்கு ‘வல்லமை’ இயல்பாகவும் தெளிவாகவும் பொருந்துகிறது; உடைமை விகுதி ‘அவருடைய’ என்று காக்கப்பட்டுள்ளது.
- source_word: בַּקְּשׁוּ
  choice: தேடுங்கள்
  rationale: தேடுதல் அல்லது கண்டடைய முனைதல் என்ற செயற்பாட்டுச் சாயலைக் கொண்ட பன்மை கட்டளை. முந்தைய דִּרְשׁוּ என்பதற்கு ‘நாடுங்கள்’ என்றும் இதற்கு ‘தேடுங்கள்’ என்றும் வழங்குவது எபிரெயச் சொல் வேறுபாட்டை இயல்பான தமிழில் மெதுவாகக் காக்கிறது.
- source_word: פָנָיו
  choice: அவருடைய முகத்தை
  rationale: சொல்லர்த்தமாக ‘அவருடைய முகம்.’ இது அவரது பிரசன்னத்தைக் குறிக்கக்கூடிய எபிரெய மரபுத்தொடர் என்றாலும், ‘முகம்’ என்பது உறவுசார்ந்த கவித்துவ உருவகத்தையும் மூலத்தின் திட்டமிட்ட பதற்றத்தையும் காக்கிறது.
- source_word: תָּמִיד
  choice: எப்போதும்
  rationale: தொடர்ச்சியான அல்லது மாறாத ஒழுங்கைச் சுட்டுகிறது. ‘எப்போதும்’ என்பது செயலை அளவுக்கு மீறி விளக்காமல், நவீனத் தமிழில் சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
theological_decisions:
- issue: יְהוָה என்ற தேவப் பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூல உரையில் தேவனுடைய தனிப்பெயர் நேரடியாக வருகிறது. அதை ஒரு பட்டப்பெயரால் மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்ப்பது உடன்படிக்கைப் பெயரைப் பாதுகாக்கிறது.
- issue: פָנָיו என்பதை சொல்லர்த்தமாகவா மரபுத்தொடரின் பொருள்படியா மொழிபெயர்ப்பது
  choice: அவருடைய முகத்தை
  alternative: அவருடைய பிரசன்னத்தை
  rationale: இம்மரபுத்தொடர் தேவனுடைய பிரசன்னத்தைக் குறிக்கலாம். இருப்பினும், முதன்மை உரையில் ‘முகம்’ என வைத்திருப்பது எபிரெயத்தின் உறவுசார்ந்த, மானிட உருவக மொழியைச் சமப்படுத்தாமல் காக்கிறது; பொருள்வழி மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் வகையிலும் சங்கீதத்திற்குரிய கண்ணியமான கவித்துவ நடையிலும் வடிவமைக்கப்பட்டது. இணைநிலை கட்டளைகளைத் தெளிவாகக் காட்ட அரைப்புள்ளி பயன்படுத்தப்பட்டது; ‘நாடுங்கள் / தேடுங்கள்’ என்ற சொல் வேறுபாடு மூலத்தின் இரண்டு வினைகளையும் இயல்பாக பிரதிபலிக்கிறது.
