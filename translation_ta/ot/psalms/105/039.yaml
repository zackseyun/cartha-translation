  text: He spread out a cloud as a covering[a], and fire to give light by night.
translation:
  language: ta
  text: அவர் மேகத்தை ஒரு மூடுதலாக விரித்தார்[a]; இரவில் ஒளி தர நெருப்பையும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒரு மூடுதலுக்காக,” “ஒரு திரையாக,” அல்லது “ஒரு விதானமாக.” எபிரெயச் சொல் பாதுகாப்பளிக்கும் மூடுதலையோ திரையையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּרַשׂ
  choice: விரித்தார்
  rationale: இந்த வினைச்சொல் ஒன்றை விரித்தல் அல்லது பரப்புதல் என்பதைக் குறிக்கிறது. மேகத்தை மேலே விரிக்கும் உருவகத்தைத் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: עָנָן
  choice: மேகம்
  rationale: மூலச்சொல்லின் நேரான பொருள்; வனாந்தரப் பயணத்தில் வழிநடத்தலும் பாதுகாப்பும் அளித்த மேகத்தைச் சூழல் நினைவூட்டுகிறது.
- source_word: לְמָסָךְ
  choice: ஒரு மறைப்பாக
  rationale: מָסָךְ என்பது மறைப்பு, திரை, அல்லது விதானம் எனப் பொருள்படலாம். குறிப்பிட்ட கட்டட அமைப்பைத் திணிக்காமல், மேகத்தின் பாதுகாப்புச் செயல்பாட்டை ‘மறைப்பாக’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְאֵשׁ
  choice: நெருப்பையும்
  rationale: மேகம்–நெருப்பு என்ற இணையான படிமத்தையும் யாத்திராகம நிகழ்வின் மறைமுக நினைவூட்டலையும் அப்படியே வைத்திருக்கிறது.
- source_word: לְהָאִיר
  choice: ஒளி தர
  rationale: இந்த வினையெச்ச வடிவம் நோக்கத்தைக் காட்டுகிறது; ‘ஒளி தர’ என்பது தெளிவான, இயல்பான நவீனத் தமிழ்.
- source_word: לָיְלָה
  choice: இரவில்
  rationale: காலத்தைக் குறிக்கும் எபிரெயப் பயன்பாட்டைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: வினையின் மறைந்திருக்கும் எழுவாய்
  choice: அவர் = கடவுள்
  alternative: ஆண்டவர்
  rationale: எபிரெயத்தில் மூன்றாம் நபர் ஆண்பால் ஒருமை எழுவாய் வெளிப்படையாகச் சொல்லப்படாமல் முந்தைய சூழலிலிருந்து தொடர்கிறது; அது கடவுளைக் குறிக்கிறது. ‘அவர்’ என்பது அந்த உரைநடையைப் பாதுகாக்கிறது.
- issue: வனாந்தர இறைவெளிப்பாட்டுப் படிமம்
  choice: மேகம் மற்றும் நெருப்பு என்ற படிமங்களை விளக்க விரிவாக்கமின்றி அப்படியே வைத்தல்
  alternative: அவற்றை வனாந்தரத்தின் மேகத்தூண் மற்றும் நெருப்புத்தூண் என்று வெளிப்படையாக அடையாளப்படுத்துதல்
  rationale: வசனம் யாத்திராகம மரபை நினைவூட்டினாலும், மூல எபிரெயம் மேகத்தையும் நெருப்பையும் அவற்றின் செயல்களோடு மட்டுமே கூறுகிறது. எனவே விளக்கத்தை முதன்மை உரைக்குள் சேர்க்கவில்லை.
- issue: இரண்டாம் கூறிலுள்ள வினைச்சொல் விடுபாடு
  choice: ‘இரவில் ஒளி தர நெருப்பையும்’ என்று கவிதைநடை விடுபாட்டைப் பாதுகாத்தல்
  alternative: ‘நெருப்பையும் அளித்தார்/வைத்தார்’ என்று ஒரு வினைச்சொல்லை நிரப்புதல்
  rationale: மூலத்தில் இரண்டாம் கூறுக்கென தனி வினைச்சொல் இல்லை. தமிழில் புரியக்கூடிய கவிதைநடை இணைப்பைப் பயன்படுத்துவதால், மூலத்தில் இல்லாத செயலைத் தெளிவாக்கம் என்ற பெயரில் சேர்ப்பது தவிர்க்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் சுருக்கமான, கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘அவர்’ என்பது சூழலில் கடவுளைக் குறிக்கும் மறைந்த எழுவாயைப் பாதுகாக்கிறது. இரண்டாம் அரையடியில் மூல எபிரெயத்தின் வினைச்சொல் விடுபாடு இயன்றவரை காக்கப்பட்டுள்ளது.
