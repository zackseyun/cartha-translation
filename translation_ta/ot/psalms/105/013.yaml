translation:
  language: ta
  text: அவர்கள் ஒரு தேசத்திலிருந்து இன்னொரு தேசத்துக்கு[a], ஒரு ராஜ்யத்திலிருந்து வேறொரு மக்களிடம் அலைந்து திரிந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவர்கள் ஒரு தேசத்திலிருந்து இன்னொரு தேசத்துக்கு, ஒரு ராஜ்யத்திலிருந்து வேறொரு மக்களிடம் சுற்றித் திரிந்தார்கள்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְהַלְּכוּ
  choice: அலைந்து திரிந்தார்கள்
  rationale: הָלַךְ என்பதன் ஹித்பயேல் வடிவம் இங்கு ஒரே நேரான பயணத்தை அல்ல, இடம்விட்டு இடம் தொடர்ந்து சென்றதைக் குறிக்கிறது. சூழலில் முற்பிதாக்களின் அலைவாழ்க்கையை இயல்பான தமிழில் இது வெளிப்படுத்துகிறது.
- source_word: מִגּוֹי אֶל גּוֹי
  choice: ஒரு தேசத்திலிருந்து இன்னொரு தேசத்திற்கு
  rationale: גּוֹי என்பது தேசத்தையோ இன-அரசியல் மக்கள்குழுவையோ குறிக்கிறது. எபிரெய உரையின் மீளுருவாக்கத்தையும் ஓர் இடத்திலிருந்து மற்றொன்றுக்குச் செல்லும் பொருளையும் இந்தத் தேர்வு காக்கிறது.
- source_word: מִמַּמְלָכָה
  choice: ஒரு ராஜ்யத்திலிருந்து
  rationale: מַמְלָכָה அரசரின் ஆட்சிக்குட்பட்ட ராஜ்யத்தைக் குறிக்கிறது. எபிரெயத்தில் எண் வெளிப்படையாக இல்லாவிட்டாலும், இணை அமைப்பை இயல்பான தமிழில் தெரிவிக்க ‘ஒரு’ சேர்க்கப்பட்டுள்ளது.
- source_word: אֶל עַם אַחֵר
  choice: வேறொரு மக்களிடம்
  rationale: עַם ஒரு சமூக அல்லது இன மக்கள்குழுவைக் குறிக்கிறது; இதை ‘மக்கள்’ என்று மொழிபெயர்ப்பது ‘ராஜ்யம்’ என்பதிலிருந்து உள்ள சொல் வேறுபாட்டைக் காக்கிறது. אַחֵר என்பதற்கு ‘வேறொரு’ பயன்படுத்தப்பட்டுள்ளது.
