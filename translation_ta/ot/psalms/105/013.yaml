translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘அலைந்து திரிந்தார்கள்’ என்பது தொடர்ச்சியான, இடம்விட்டு இடம் சென்ற இயக்கத்தை முன்னிறுத்துகிறது; அடிக்குறிப்பிலுள்ள ‘சுற்றித் திரிந்தார்கள்’ எபிரெயச் சொல்லின் குறைவாக நோக்கமற்றதாகத் தோன்றும் மாற்றுப் பொருளை வழங்குகிறது. ‘ராஜ்யம்’ மற்றும் ‘மக்கள்’ என்ற சொற்கள் இணைவாக்கியத்தில் உள்ள எபிரெயச் சொல் வேறுபாட்டைப் பாதுகாக்கின்றன.
