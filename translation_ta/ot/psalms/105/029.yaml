  yaml_path: translation/ot/psalms/105/029.yaml
  text: He turned their waters to blood and caused their fish to die[a].
translation:
  language: ta
  text: அவர் அவர்களுடைய நீர்நிலைகளை இரத்தமாக மாற்றி, அவற்றிலிருந்த மீன்களைச் சாகச் செய்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָפַךְ
  choice: மாற்றி
  rationale: இந்த வினைச்சொல் திருப்புதல் அல்லது ஒரு நிலையிலிருந்து மற்றொரு நிலைக்கு மாற்றுதல் என்பதைக் குறிக்கிறது; கொள்ளைநோயின் சூழலில் இயல்பான தமிழாகவும் எபிரெய அர்த்தத்திற்கு நெருக்கமாகவும் ‘மாற்றி’ அமைகிறது.
- source_word: מֵימֵיהֶם
  choice: அவர்களுடைய நீர்நிலைகளை
  rationale: எபிரெய மொழியிலுள்ள பன்மை, எகிப்தியர்களுக்குரிய நீராதாரங்களைத் தொகுப்பாகக் குறிக்கிறது; தமிழில் ‘நீர்கள்’ என்பதைவிட ‘நீர்நிலைகள்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: לְדָם
  choice: இரத்தமாக
  rationale: לְ விளைவாக ஏற்பட்ட நிலையைக் குறிக்கிறது; தமிழில் ‘இரத்தமாக’ அந்த மாற்றத்தின் முடிவைத் துல்லியமாக வெளிப்படுத்துகிறது.
- source_word: וַיָּמֶת
  choice: சாகச் செய்தார்
  rationale: ஹிஃபில் வடிவத்தின் காரணவினைப் பொருளைத் தெளிவாகப் பாதுகாக்கிறது; வெறுமனே ‘செத்தன’ என்றால் அந்த நுட்பம் மறைந்துவிடும்.
- source_word: דְּגָתָם
  choice: அவற்றிலிருந்த மீன்களை
  rationale: பெயர்ச்சொல் மீன்களைத் தொகுப்பாகக் குறிக்கிறது. பின்னொட்டு இலக்கணப்படி ‘அவர்களுடைய’ எனினும், தமிழில் நீர்நிலைகளோடு உள்ள தொடர்பை ‘அவற்றிலிருந்த’ என்பது இயல்பாகத் தெரிவித்து, மீன்கள் மக்களுக்குச் சொந்தமானவை என்ற தவறான வலியுறுத்தலைத் தவிர்க்கிறது.
