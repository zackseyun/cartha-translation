translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. எபிரெய காரணவினை ‘சாகச் செய்தார்’ என்று வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது; சொற்சொல்லான ‘அவர்களுடைய நீர்கள்’ என்பதற்குப் பதிலாக இயல்பான ‘அவர்களுடைய நீர்நிலைகள்’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
