- issue: לְ infinitive-களின் நோக்கம் அல்லது விளைவு
  choice: ‘வெறுக்கும்படியும் ... செயல்படும்படியும்’ என்று இரண்டிற்கும் இடமளிக்கும் கட்டமைப்பு
  alternative: ‘அதனால் அவர்கள் வெறுத்து ... வஞ்சகமாகச் செயல்பட்டார்கள்’ என்று விளைவை மட்டும் வெளிப்படுத்துதல்
  rationale: எபிரெய வடிவம் நோக்கத்தையோ விளைவையோ குறிக்கக்கூடும். தமிழ் ‘-ும்படி’ கட்டமைப்பு மூலத்தின் நெருக்கத்தையும் ஓரளவு ambiguity-யையும் காக்கிறது.
