lexical_decisions:
- source_word: הָפַךְ
  choice: மாற்றினார்
  rationale: இந்த வினைச்சொல் ‘திருப்புதல், மாற்றுதல்’ என்று பொருள்படும். இங்கு மனப்போக்கில் ஏற்பட்ட மாற்றத்தையும் தேவனுடைய நேரடியான செயலையும் இயல்பான தமிழில் ‘மாற்றினார்’ தெளிவாகக் காட்டுகிறது.
- source_word: לִבָּם
  choice: அவர்களுடைய இருதயத்தை
  rationale: எபிரெயத்தில் பன்மை உடைமை விகுதியுடன் ஒருமை வடிவான ‘அவர்களுடைய இருதயம்’ வருகிறது. மக்களின் கூட்டு உள்ளார்ந்த மனப்போக்கைக் குறிக்கும் இந்த உருவகத்தை ‘இருதயம்’ எனப் பாதுகாக்கிறது.
- source_word: לִשְׂנֹא
  choice: வெறுக்கும்படி
  rationale: தொடர்புடைய நோக்கம் அல்லது விளைவு என்ற இரு நுணுக்கங்களுக்கும் இடமளிக்கும் வகையில் infinitive வடிவத்தை ‘வெறுக்கும்படி’ என வழங்குகிறது.
- source_word: עַמּוֹ
  choice: தம் மக்களை
  rationale: இது கர்த்தருக்குரிய உடன்படிக்கை மக்களாகிய இஸ்ரவேலைக் குறிக்கிறது. ஒரே எழுவாயைச் சுட்டும் இயல்பான தமிழ் பிரதிபெயராக ‘தம்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: לְהִתְנַכֵּל
  choice: வஞ்சகமாகச் செயல்படும்படி
  rationale: Hitpael வடிவம் பகைமையான சூழ்ச்சியோடு அல்லது வஞ்சகமாக நடந்துகொள்வதைக் குறிக்கிறது. இத்தேர்வு அடிப்படைப் பொருளைப் பாதுகாத்து நவீன தமிழில் தெளிவாக உள்ளது.
- source_word: בַּעֲבָדָיו
  choice: தம் ஊழியர்களுக்கு எதிராக
  rationale: இங்கு ב என்ற முன்னிடைச்சொல் பகைமையான நடவடிக்கையின் இலக்கைச் சுட்டுவதால் ‘எதிராக’ என்பது பொருத்தமானது. עבד என்பது இச்சூழலில் தேவனுடைய சேவைக்குரிய மக்களைக் குறிப்பதால் ‘ஊழியர்கள்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
