lexical_decisions:
- source_word: שָׁלַח
  choice: ஆள் அனுப்பி
  rationale: எபிரெய வினை அடிப்படையில் ‘அனுப்பினான்’ என்று பொருள்படும். தமிழில் செயல் தொடரை இயல்பாகவும், அரசன் நேரடியாகச் சென்றதாகப் புரிந்துகொள்ளப்படாமலும் இருக்க ‘ஆள் அனுப்பி’ என வழங்கப்பட்டுள்ளது; அனுப்பப்பட்டவர் மூலத்தில் வெளிப்படையாகக் குறிப்பிடப்படவில்லை.
- source_word: מֶלֶךְ
  choice: அரசன்
  rationale: எபிரெயக் கவிதையில் சுட்டிடைச்சொல் இல்லாவிட்டாலும், சூழலில் குறிப்பிடப்படுவது பார்வோன் என்பதால் குறிப்பிட்ட அரசனைக் குறிக்கும் தமிழ்ச் சொல் தேர்ந்தெடுக்கப்பட்டது.
- source_word: וַיַּתִּירֵהוּ
  choice: அவனை விடுவித்தான்
  rationale: இந்த வடிவம் கட்டுகளிலிருந்து அவிழ்த்தல் அல்லது விடுவித்தல் என்ற பொருளைத் தருகிறது. யோசேப்பின் சிறைச் சூழலில் ‘விடுவித்தான்’ தெளிவானதும் இயல்பானதும் ஆகும்.
- source_word: מֹשֵׁל עַמִּים
  choice: மக்களினங்களின் ஆட்சியாளர்
  rationale: מֹשֵׁל என்பது ‘ஆளுகிறவர்/ஆட்சியாளர்’ என்ற பட்டப்பெயர்; עַמִּים என்பது பன்மையில் ‘மக்கள் கூட்டங்கள்/மக்களினங்கள்.’ ‘மக்களினங்களின் ஆட்சியாளர்’ என்பது பன்மையையும் அரசனுடன் உள்ள கவிதை இணைநிலையையும் காக்கிறது.
- source_word: וַיְפַתְּחֵהוּ
  choice: அவனைச் சிறையிலிருந்து விடுதலை செய்தான்
  rationale: פתח என்பதன் அடிப்படைப் பொருள் ‘திறத்தல்.’ மனிதரை நேரடிப் பொருளாகக் கொண்ட இச்சூழலில், சிறை அல்லது அடைப்பைத் திறந்து விடுவித்தல் என்ற மரபுத்தொடர்ப் பொருள் உள்ளது. தமிழில் சொல்லுக்குச் சொல் ‘அவனைத் திறந்தான்’ இயல்பற்றதால் சூழற்பொருள் வெளிப்படுத்தப்பட்டுள்ளது.
