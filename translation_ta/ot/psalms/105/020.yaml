  register: நவீன பொதுத்தமிழில் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. இரு இணை வாக்கியங்களின் அமைப்பும் மூலத்தின் கவிதை இணைநிலையும் காக்கப்பட்டுள்ளன. ‘மக்களினங்கள்’ என்பது עַמִּים என்ற பன்மையை ‘நாடுகள்’ என மாற்றாமல் வெளிப்படுத்துகிறது.
