  text: The king sent and released him[b][a]; the ruler of peoples set him free.
translation:
  language: ta
  text: அரசன் அனுப்பி, அவனை விடுவித்தான்[a]; மக்களினங்களின் ஆட்சியாளர் அவனைச் சிறையிலிருந்து விடுதலை செய்தான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனுடைய கட்டுகளை அவிழ்த்தான்.”
    reason: lexical_alternative
  - marker: b
    text: எழுத்துப்படி, “அவனைத் திறந்தான்” அல்லது “அவனுக்காகத் திறந்தான்”; சிறை அடைப்பிலிருந்து அவன் விடுவிக்கப்பட்டான் என்பதே இங்குள்ள பொருள்.
