base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/023.yaml
  text: Then Israel came to Egypt[b][a], and Jacob lived as a foreigner in the land of Ham.
translation:
  language: ta
  text: அப்போது இஸ்ரவேல் எகிப்துக்கு வந்தான்; யாக்கோபு காமின் நாட்டில்[b] அந்நியனாகக் குடியிருந்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அந்நியனாகக் குடியிருந்தான்’ என்பதற்கு ‘தற்காலிகமாகத் தங்கியிருந்தான்’ என்றும் மொழிபெயர்க்கலாம்; எபிரெய வினைச்சொல், அந்த இடத்தைச் சேர்ந்தவர் அல்லாதவராக அங்கு வாழ்வதை வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘காமின் நாடு’ என்பது எகிப்தைக் குறிக்கும் கவித்துவப் பெயர்.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹא
  choice: அப்போது ... வந்தான்
  rationale: Qal wayyiqtol வடிவம் வரலாற்றுக் கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது. ‘அப்போது’ என்பது தொடர்ச்சியை இயல்பான தமிழில் தெரிவிக்கிறது; ‘வந்தான்’ בוא என்பதன் அடிப்படை இயக்கப் பொருளைக் காக்கிறது.
- source_word: יִשְׂרָאֵל
  choice: இஸ்ரவேல்
  rationale: மரபாக நிலைபெற்ற தமிழ் பெயர்வடிவம். இங்கு யாக்கோபையும், அவரில் பிரதிநிதித்துவம் பெறும் மக்களையும் சுட்டும் கவித்துவப் பெயராக உள்ளது.
- source_word: מִצְרָיִם
  choice: எகிப்துக்கு
  rationale: இடப்பெயரின் வழக்கமான தமிழ் வடிவம்; בוא உடன் வரும் இலக்கைத் தமிழில் இயல்பாக நான்காம் வேற்றுமையில் காட்டுகிறது.
- source_word: וְיַעֲקֹב
  choice: யாக்கோபு
  rationale: ‘இஸ்ரவேல் // யாக்கோபு’ என்ற எபிரெயக் கவிதையின் இணை அமைப்பைச் சுருக்காமல் இரு பெயர்களையும் காக்கிறது. தமிழ் வாக்கியப் பிரிப்பில் இணைப்பின் உறவை அரைப்புள்ளி இயல்பாகத் தெரிவிக்கிறது.
- source_word: גָּר
  choice: அந்நியனாகக் குடியிருந்தான்
  rationale: גור என்பது தன் சொந்த நிலமல்லாத இடத்தில் வெளிநாட்டவனாக அல்லது குடியேறியாக வாழ்வதை வலியுறுத்துகிறது. ‘குடியிருந்தான்’ மட்டும் தராத அயலார் நிலையை ‘அந்நியனாக’ தெளிவுபடுத்துகிறது.
- source_word: בְּאֶרֶץ
  choice: நாட்டில்
  rationale: אֶרֶץ இங்கு நாடு அல்லது நிலப்பகுதியைக் குறிக்கிறது; ‘காமின் நாட்டில்’ என்பது சுருக்கமான, இயல்பான தமிழ் சொல்லாக்கம்.
- source_word: חָם
  choice: காம்
  rationale: பெயரின் நிலைபெற்ற தமிழ் ஒலிபெயர்ப்பு. ‘காமின் நாடு’ என்ற கவித்துவப் பெயரை ‘எகிப்து’ என்று மாற்றாமல் மூலத்தின் உருவகத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: ‘இஸ்ரவேல் // யாக்கோபு’ என்ற கவித்துவ இணையை ஒரே குறிப்பாகச் சுருக்கலாமா?
  choice: முதன்மை உரையில் இரு பெயர்களையும் காத்தல்
  alternative: ‘அப்போது யாக்கோபு எகிப்துக்கு வந்து, காமின் நாட்டில் அந்நியனாகக் குடியிருந்தான்’ அல்லது ‘அப்போது இஸ்ரவேல் எகிப்துக்கு வந்து, காமின் நாட்டில் அந்நியனாகக் குடியிருந்தான்’
  rationale: எபிரெய உரை ஒரே முற்பிதாவை இஸ்ரவேல் என்றும் யாக்கோபு என்றும் இணையான அடிகளில் குறிப்பிடுகிறது. இரு பெயர்களையும் காப்பது கவித்துவ அமைப்பையும் முற்பிதா–மக்கள் பிரதிநிதித்துவத்தின் சாத்தியத்தையும் பாதுகாக்கிறது; அதற்கு மேலான கோட்பாட்டைத் திணிப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதத்திற்கேற்ற கண்ணியமான கவித்துவச் சுருக்கம் பேணப்பட்டுள்ளது. ‘அந்நியனாகக் குடியிருந்தான்’ என்பது பொதுவாசகருக்குப் புரியும் வகையில் גור என்பதன் குடியிருப்பு மற்றும் அயலார் நிலை ஆகிய இரண்டையும் வெளிப்படுத்துகிறது. அடிக்குறி குறிகள் அவை விளக்கும் சொற்றொடருக்குப் பின்னர் [a][b] என வைக்கப்பட்டுள்ளன.
