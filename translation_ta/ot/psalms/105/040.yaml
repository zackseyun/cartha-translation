  text: שָׁאַ֣ל וַ/יָּבֵ֣א שְׂלָ֑ו וְ/לֶ֥חֶם שָׁ֝מַ֗יִם יַשְׂבִּיעֵֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/040.yaml
  text: They asked[a], and he brought quail[b]; he satisfied them with the bread of heaven.
translation:
  language: ta
  text: அவர்கள் கேட்டார்கள்[a]; அவர் காடைகளைக் கொண்டுவந்தார்; வானத்தின் அப்பத்தால்[b] அவர்களை நிறைவாக்கினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் வினைச்சொல் ஒருமையில் உள்ளது; சொற்படியாக, ‘அவன் கேட்டான்.’ சூழலில் இது இஸ்ரவேல் மக்களை கூட்டாகக் குறிப்பதாகத் தெரிகிறது.
    reason: alternative_reading
  - marker: b
    text: அல்லது, ‘வானத்திலிருந்து வந்த அப்பம்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁאַל
  choice: அவர்கள் கேட்டார்கள்
  rationale: எபிரெயச் சொல்வடிவம் மூன்றாம் நபர் ஆண்பால் ஒருமையில், சொற்படியாக ‘அவன் கேட்டான்’ என்று உள்ளது. ஆனால் சங்கீதத்தின் சூழலில் இஸ்ரவேல் மக்கள் கூட்டாகக் கேட்பதே பொருள்; வசனத்தின் இறுதியிலுள்ள பன்மை விகுதியும் இதை ஆதரிக்கிறது. மூலத்தின் ஒருமை வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וַיָּבֵא
  choice: அவர் கொண்டுவந்தார்
  rationale: בוא என்பதன் ஹிஃபில் வடிவம் ‘வரச் செய்தார்’ அல்லது ‘கொண்டுவந்தார்’ எனப் பொருள்படும். கடவுளே மறைமுக எழுவாய்; இங்கு ‘கொண்டுவந்தார்’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: שְׂלָו
  choice: காடைகள்
  rationale: இச்சொல் வனாந்தரத்தில் கடவுள் உணவாக வழங்கிய காடைப் பறவைகளைக் குறிக்கிறது. கூட்டுப் பொருளைத் தமிழில் இயல்பாக வெளிப்படுத்தப் பன்மை பயன்படுத்தப்பட்டுள்ளது.
- source_word: לֶחֶם שָׁמַיִם
  choice: வானத்தின் அப்பம்
  rationale: சொற்றொடரின் நேரடிப் பொருள் ‘வானத்தின் அப்பம்.’ சங்கீதத்தின் கவித்துவத்தை இது காக்கிறது; ‘வானத்திலிருந்து வந்த அப்பம்’ என்பதும் சாத்தியமான பொருள் என்பதால் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: יַשְׂבִּיעֵם
  choice: அவர்களைத் திருப்தியாக்கினார்
  rationale: שׂבע என்பதன் ஹிஃபில் வடிவம் ‘திருப்தியாக்கு,’ ‘நிறைவாக்கு’ அல்லது ‘நிரப்பு’ எனப் பொருள்படும். உணவு வழங்கியதையும் அவர்கள் நிறைவடைந்ததையும் ‘திருப்தியாக்கினார்’ தெளிவாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: தொடக்க வினைச்சொல் שָׁאַל-ன் எழுவாய்
  choice: சூழலின் அடிப்படையில் இஸ்ரவேல் மக்களை கூட்டாகக் குறிக்கும் பன்மையாக ‘அவர்கள் கேட்டார்கள்’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: மூல வடிவத்தை முறையாகப் பின்பற்றி ‘அவன் கேட்டான்’ எனக் கொள்ளலாம்; இங்கு ‘அவன்’ என்பது இஸ்ரவேலைக் கூட்டாகவோ, மக்களின் பிரதிநிதி ஒருவரையோ குறிக்கக்கூடும்.
  rationale: இந்தப் பகுதி வனாந்தரத்தில் இஸ்ரவேலுக்காகக் கடவுள் செய்த செயல்களை விவரிக்கிறது. மேலும் ‘அவர்களைத் திருப்தியாக்கினார்’ என்பதிலுள்ள பன்மை, கூட்டுப் பொருளை ஆதரிக்கிறது. எனினும் எபிரெய மூலத்தில் உள்ள உண்மையான ஒருமை வடிவம் அடிக்குறிப்பில் வெளிப்படையாகக் குறிப்பிடப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் கண்ணியமான நடையும் சங்கீதத்திற்கேற்ற சுருக்கமான கவித்துவமும் பேணப்பட்டுள்ளன. ‘வானத்தின் அப்பம்’ என்ற மூலத்துக்கு நெருக்கமான உருவகம் தக்கவைக்கப்பட்டுள்ளது.
