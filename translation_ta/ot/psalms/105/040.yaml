revisions:
- from: அவர்கள் கேட்டார்கள்[a]; அவர் காடைகளைக் கொண்டுவந்தார்; வானத்தின் அப்பத்தால்[b] அவர்களைத் திருப்தியாக்கினார்.
  to: அவர்கள் கேட்டார்கள்[a]; அவர் காடைகளைக் கொண்டுவந்தார்; வானத்தின் அப்பத்தால்[b] அவர்களை நிறைவாக்கினார்.
  rationale: ஒரு இயல்பான நவீனத் தமிழ் வினையைப் பயன்படுத்தி, உணவால் நிறைவடையச் செய்தல் என்ற மூலத்தின் பொருள் தெளிவாக்கப்பட்டுள்ளது. அடிக்குறிப்பு b-யின் மாற்று வாசிப்பு அதன் அடிப்படை பெயர்ச்சொல் சொற்றொடருக்கேற்பச் சரிசெய்யப்பட்டுள்ளது. தொடக்க ஒருமை எபிரெய வினை வடிவம் குறித்த உரைசார் நிச்சயமின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
