source:
  edition: WLC
  text: אֶ֭רֶץ נָתְנָ֣ה יְבוּלָ֑/הּ יְ֝בָרְכֵ֗/נוּ אֱלֹהִ֥ים אֱלֹהֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/067/006.yaml
  text: The earth has yielded its produce[a]; God, our God[b], blesses us.
translation:
  language: ta
  text: பூமி[a] தன் விளைச்சலைத் தந்திருக்கிறது; கடவுள்—நம் கடவுள்—நம்மை ஆசீர்வதிக்கிறார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நிலம்.’ எபிரெயச் சொல் ‘பூமி’ அல்லது ‘நிலம்’ எனப் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘கடவுள்—நம் கடவுள்—நம்மை ஆசீர்வதிப்பாராக,’ அல்லது ‘கடவுள்—நம் கடவுள்—நம்மை ஆசீர்வதிப்பார்.’ இச்சூழலில் எபிரெய வினையை நிகழ்காலமாகவோ, வேண்டுதலாகவோ, எதிர்காலமாகவோ புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: אֶרֶץ
  choice: பூமி
  rationale: சங்கீதத்தின் அனைத்துலக நோக்கத்திற்குப் பொருந்துவதால் பரந்த பொருளுடைய ‘பூமி’ முதன்மை உரையில் பயன்படுத்தப்பட்டுள்ளது; ‘நிலம்’ என்பதும் எபிரெயச் சொல்லின் சாத்தியமான பொருள்.
- source_word: נָתְנָה
  choice: தந்திருக்கிறது
  rationale: ‘தந்தது’ என்ற அடிப்படைப் பொருளையும், ஏற்கெனவே கிடைத்துள்ள விளைச்சலின் தற்போதைய பலனையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יְבוּלָהּ
  choice: தன் விளைச்சலை
  rationale: வேளாண் உற்பத்தியைக் குறிக்கும் சொல்லுக்கு இயல்பான, தெளிவான நவீனத் தமிழ்; மூன்றாம் நபர் ஒருமை உடைமைப் பின்னொட்டும் ‘தன்’ என்பதால் பாதுகாக்கப்படுகிறது.
- source_word: יְבָרְכֵנוּ
  choice: நம்மை ஆசீர்வதிக்கிறார்
  rationale: சூழலில் நம்பிக்கையுடன் கூறப்படும் நிகழ்கால உறுதிப்பாடாக முதன்மை உரையில் தரப்பட்டுள்ளது; வேண்டுதல் அல்லது எதிர்காலப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: இஸ்ரவேலின் கடவுளைக் குறிக்கும் தெய்வீகப் பட்டத்திற்கான இயல்பான நவீனத் தமிழ்.
- source_word: אֱלֹהֵינוּ
  choice: நம் கடவுள்
  rationale: முதல் நபர் பன்மை உடைமைப் பொருளை நேரடியாகத் தருகிறது; ‘கடவுள்—நம் கடவுள்’ என்ற எபிரெய வலியுறுத்தலும் தக்கவைக்கப்படுகிறது.
theological_decisions:
- issue: יְבָרְכֵנוּ என்ற வினையின் காலம்/வினைநிலை
  choice: 'நிகழ்கால உறுதிப்பாடு: ‘நம்மை ஆசீர்வதிக்கிறார்’'
  alternative: 'வேண்டுதல்: ‘நம்மை ஆசீர்வதிப்பாராக’; எதிர்காலம்: ‘நம்மை ஆசீர்வதிப்பார்’'
  rationale: எபிரெய முற்றா வினை இச்சூழலில் நிகழ்காலம், வேண்டுதல், அல்லது எதிர்காலம் எனப் புரிந்துகொள்ளப்படலாம். முந்தைய வரியின் நிறைவேறிய விளைச்சல் ஆசீர்வாதத்தோடும் அடுத்த வசனத்தின் நம்பிக்கையான எதிர்பார்ப்போடும் ஒத்துப்போவதால் நிகழ்கால வாசகம் முதன்மை உரையில் உள்ளது; உண்மையான தெளிவின்மை அடிக்குறிப்பில் விடப்பட்டுள்ளது.
translation_notes:
  register: இயல்பான, தற்போதைய, கண்ணியமான பொதுத் தமிழ் பயன்படுத்தப்பட்டுள்ளது. எபிரெய மூலத்தின் ‘கடவுள்—நம் கடவுள்’ என்ற மறுபதிப்பு வலியுறுத்தலுக்காகப் பாதுகாக்கப்பட்டுள்ளது; நீண்ட கோடு இடைச்செருகல் போன்ற வலியுறுத்தலை தெளிவாக்குகிறது.
