translation:
  language: ta
  text: 'இசைத் தலைவருக்கு: நரம்பிசைக் கருவிகளுடன்[a]. ஒரு சங்கீதம். ஒரு பாடல்.'
  philosophy: optimal-equivalence
  footnotes:
