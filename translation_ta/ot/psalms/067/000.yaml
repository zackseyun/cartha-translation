lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: இசைத் தலைவருக்கு
  rationale: சங்கீதத் தலைப்புகளில் இசை நிகழ்த்துதலை அல்லது அதன் வழிநடத்தலைப் பொறுப்பேற்றவரைக் குறிக்கும் மரபான சொல்லாக இருப்பதால், தெளிவான நவீனத் தமிழில் இவ்வாறு மொழிபெயர்க்கப்பட்டது. לַ என்னும் முன்னொட்டின் பொருள் ‘-க்கு’ என்று தக்கவைக்கப்பட்டுள்ளது.
- source_word: בִּנְגִינֹת
  choice: நரம்பிசைக் கருவிகளுடன்
  rationale: இது நரம்பிசைக் கருவிகளையோ அவற்றால் இசைக்கப்படும் இசையையோ குறிக்கிறது. கருவிசார் பொருளைத் தெளிவாகவும் இயல்பாகவும் தர ‘நரம்பிசைக் கருவிகளுடன்’ என மொழிபெயர்க்கப்பட்டது; முன்னொட்டுக்கான ‘கருவிகளில்’ என்ற மாற்று வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: מִזְמוֹר
  choice: ஒரு சங்கீதம்
  rationale: இது சங்கீதத் தலைப்புகளில் காணப்படும் வகைப்பாட்டுச் சொல். தமிழில் நிலைபெற்றதும் வாசகர்களுக்குப் புரியக்கூடியதுமான ‘சங்கீதம்’ என்பது அதன் தனிப்பட்ட வகைக் குறிப்பைத் தக்கவைக்கிறது.
- source_word: שִׁיר
  choice: ஒரு பாடல்
  rationale: இது நேரடியான பாடல் வகைப்பாட்டுச் சொல். எபிரெய மூலத்திலுள்ள இரட்டை வகைக் குறிப்பை ஒன்றாகச் சுருக்காமல், מִזְמוֹר என்பதிலிருந்து தனியே மொழிபெயர்க்கப்பட்டுள்ளது.
