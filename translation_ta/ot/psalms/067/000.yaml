translation_notes:
  register: நவீனச் செந்தமிழ் நடையில், வழிபாட்டு இசைத் தலைப்பின் சுருக்கமான அமைப்பும் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘சங்கீதம்’ என்ற பரவலாக அறியப்பட்ட வேதாகம வகைப்பாட்டுச் சொல் பயன்படுத்தப்பட்டுள்ளது; அதேவேளை வழக்கொழிந்த இசைச்சொற்கள் தவிர்க்கப்பட்டுள்ளன.
