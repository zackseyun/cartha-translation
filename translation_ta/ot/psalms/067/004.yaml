revisions:
- from: நாடுகள் மகிழ்ந்து, ஆனந்தமாய்ப் பாடட்டும்[a]; ஏனெனில், நீர் மக்களினங்களை நேர்மையுடன் நியாயந்தீர்த்து, பூமியிலுள்ள நாடுகளை வழிநடத்துகிறீர்[b]. சேலா.
  to: நாடுகள் மகிழ்ந்து களிப்புடன் பாடட்டும்[a]; ஏனெனில், நீர் மக்களினங்களை நேர்மையுடன் நியாயந்தீர்க்கிறீர்; பூமியில் நாடுகளை வழிநடத்துகிறீர்[b]. சேலா.
