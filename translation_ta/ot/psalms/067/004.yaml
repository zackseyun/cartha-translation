base_translation:
  language: en
  yaml_path: translation/ot/psalms/067/004.yaml
  text: Let the nations be glad and sing for joy[a], for you judge the peoples with equity and guide the nations on the earth[b]. Selah
translation:
  language: ta
  text: நாடுகள் மகிழ்ந்து களிப்புடன் பாடட்டும்[a]; ஏனெனில், நீர் மக்களினங்களை நேர்மையுடன் நியாயந்தீர்க்கிறீர்; பூமியில் நாடுகளை வழிநடத்துகிறீர்[b]. சேலா.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நாடுகள் மகிழ்ந்து, ஆனந்தக் குரலெழுப்பட்டும்.’ இந்த வினைச்சொல் களிப்புடன் பாடுவதையோ உரத்த மகிழ்ச்சிக் குரல் எழுப்புவதையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: אֶרֶץ என்பதை உள்ளூர் பொருளில் எடுத்தால், ‘நாட்டில் நாடுகளை வழிநடத்துகிறீர்’ என்றும் மொழிபெயர்க்கலாம்; இச்சங்கீதத்தின் உலகளாவிய பரப்பினால் இங்கு ‘பூமியில்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: יִשְׂמְחוּ
  choice: மகிழ்ந்து ... பாடட்டும்
  rationale: שׂמח என்பதன் மகிழ்ச்சியைக் குறிக்கும் பொருளையும், இங்கு வேண்டுதல்/அழைப்பு நயத்திலுள்ள imperfect வடிவையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וִירַנְּנוּ
  choice: ஆனந்தமாய்ப் பாடட்டும்
  rationale: רנן என்பதிலுள்ள உரத்த, களிப்புமிக்க குரல் வெளிப்பாட்டை ‘ஆனந்தமாய்ப் பாடுதல்’ இயல்பாகத் தருகிறது; ‘ஆனந்தக் குரலெழுப்புதல்’ என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לְאֻמִּים
  choice: நாடுகள்
  rationale: சங்கீதத்தின் உலகளாவிய பரப்பிற்கும், இச்சொல்லின் அரசியல்/இனக்குழு சார்ந்த விரிவான பொருளுக்கும் ஏற்றது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: நாடுகளின் மகிழ்ச்சிக்கான காரணத்தைத் தெளிவாக அறிமுகப்படுத்துகிறது.
- source_word: תִשְׁפֹּט
  choice: நியாயந்தீர்த்து
  rationale: שׁפט என்பதன் அடிப்படை நீதித்தீர்ப்பு பொருளைப் பாதுகாக்கிறது; சூழலில் கடவுளின் தொடர்ச்சியான செயலைக் குறிக்கும் நிகழ்கால நயம் தரப்படுகிறது.
- source_word: עַמִּים
  choice: மக்களினங்கள்
  rationale: לְאֻמִּים என்பதற்குத் தரப்பட்ட ‘நாடுகள்’ என்பதிலிருந்து சொல்லியல் வேறுபாட்டைப் பேணுவதோடு பல்வேறு மக்கள் குழுக்களைக் குறிக்கிறது.
- source_word: מִישׁוֹר
  choice: நேர்மையுடன்
  rationale: நேர்மை, செம்மை, பாரபட்சமின்மை ஆகிய நீதிசார் நயங்களை இயல்பான தமிழில் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: בָּאָרֶץ
  choice: பூமியிலுள்ள
  rationale: சங்கீதத்தின் அனைத்து மக்களையும் தழுவும் பரப்பினால் אֶרֶץ இங்கு உலகளாவிய ‘பூமி’ என்று எடுத்துக்கொள்ளப்படுகிறது; உள்ளூர் ‘நாடு’ என்ற வாசிப்பும் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: תַּנְחֵם
  choice: வழிநடத்துகிறீர்
  rationale: נחה என்பதன் Hiphil வடிவிலுள்ள நடத்துதல்/வழிகாட்டுதல் பொருளை, வெறும் இடமாற்றத்தைக் காட்டாமல், இயல்பாகத் தருகிறது.
- source_word: סֶלָה
  choice: சேலா
  rationale: இதன் துல்லியமான செயல்பாடு உறுதியற்றதால் விளக்கப் பொருளைத் திணிக்காமல் ஒலிபெயர்த்து வைக்கப்படுகிறது.
theological_decisions:
- issue: אֶרֶץ என்பதன் பரப்பு
  choice: உலகளாவிய ‘பூமி’
  alternative: உள்ளூர் பொருளிலான ‘நாடு/தேசம்’
  rationale: சங்கீதம் 67 முழுவதும் எல்லா மக்களையும் நாடுகளையும் வலியுறுத்துவதால் உலகளாவிய வாசிப்பு சூழலுக்கு மிகவும் பொருந்துகிறது; எனினும் உள்ளூர் வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: Imperfect வினைகளின் கால/விருப்ப நயம்
  choice: தொடக்கத்தில் அழைப்பு அல்லது விருப்ப நயம்; பின்னர் கடவுளின் வழக்கமான செயலைக் குறிக்கும் நிகழ்கால நயம்
  alternative: முழுவதையும் எதிர்காலமாக, ‘மகிழ்வார்கள் ... நியாயந்தீர்ப்பீர் ... வழிநடத்துவீர்’ என வாசித்தல்
  rationale: எபிரெய வடிவங்கள் எதிர்காலத்தையோ தொடர்ச்சியான செயலையோ அனுமதிக்கின்றன. வழிபாட்டு சூழலில் தொடக்க வினைகள் அழைப்பாகவும், அடுத்தவை அந்த மகிழ்ச்சிக்கான கடவுளின் நீதியான ஆட்சிச் செயலாகவும் இயல்பாக அமைகின்றன; எதிர்கால சாத்தியத்தை முற்றாக மறுப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைநயமும் மரியாதை ஒருமை இறைமுகப்பும் பேணப்பட்டுள்ளன. ‘மக்களினங்கள்’ மற்றும் ‘நாடுகள்’ மூலம் עַמִּים / לְאֻמִּים வேறுபாடு இயன்றவரை காக்கப்பட்டுள்ளது; ‘சேலா’ விளக்கமின்றி ஒலிபெயர்க்கப்பட்டுள்ளது.
