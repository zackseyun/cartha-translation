source:
  edition: WLC
  text: יוֹד֖וּ/ךָ עַמִּ֥ים אֱלֹהִ֑ים י֝וֹד֗וּ/ךָ עַמִּ֥ים כֻּלָּֽ/ם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/067/005.yaml
  text: Let the peoples praise you[a], O God[b]; let all the peoples praise you.
translation:
  language: ta
  text: கடவுளே, மக்கள் உம்மைப் போற்றட்டும்[a][b]; எல்லா மக்களும் உம்மைப் போற்றட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுளே, மக்கள் உம்மைப் போற்றுவார்கள்; எல்லா மக்களும் உம்மைப் போற்றுவார்கள்.”
    reason: alternative_reading
  - marker: b
    text: “போற்றுதல்” என மொழிபெயர்க்கப்பட்டுள்ள எபிரெய வினைச்சொல் “நன்றி செலுத்துதல்” என்ற பொருளையும் தரக்கூடும்; இந்த வழிபாட்டுப் பல்லவியில் “போற்றுதல்” அதன் பொருளைச் சிறப்பாக வெளிப்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹדוּךָ
  choice: உம்மைப் போற்றட்டும்
  rationale: ידה என்பதன் ஹிஃபில் வடிவம் சங்கீதங்களில் கடவுளைப் பொதுவாகப் புகழ்வதையும் நன்றி செலுத்துவதையும் குறிக்கிறது. இங்குள்ள வழிபாட்டுப் பல்லவியில் ‘போற்று’ என்பது இரு நுணுக்கங்களுக்கும் இடமளிக்கும் இயல்பான தமிழ்ச் சொல்; சூழலின் வேண்டுதல் தொனியை ‘-ட்டும்’ வெளிப்படுத்துகிறது.
- source_word: עַמִּים
  choice: மக்கள் இனங்கள்
  rationale: பன்மை வடிவம் பல்வேறு மக்கள் குழுக்களைக் குறிக்கிறது. ‘மக்கள் இனங்கள்’ என்பது அந்தப் பன்மையையும் சங்கீதத்தின் உலகளாவிய நோக்கையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: אֱלֹהִים
  choice: கடவுளே
  rationale: இங்கு இச்சொல் நேரடி விளியாக வருகிறது. தமிழின் விளிவேற்றுமை வடிவமான ‘கடவுளே’ அதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כֻּלָּם
  choice: எல்லா
  rationale: எந்த மக்கள் இனமும் விலக்கப்படாமல் அவர்களுடைய முழுத் தொகையையும் இச்சொல் வலியுறுத்துகிறது; ‘எல்லா மக்கள் இனங்களும்’ என்பது தமிழில் இயல்பாகவும் முழுமையாகவும் உள்ளது.
theological_decisions:
- issue: மீண்டும் வரும் வினைச்சொல்லின் மனநிலையும் உரையாடல் செயல்பாடும்
  choice: வேண்டுதல் அல்லது விருப்பமாக ‘போற்றட்டும்’ என்று மொழிபெயர்த்தல்
  alternative: எதிர்காலக் கூற்றாக ‘போற்றுவார்கள்’ என்று மொழிபெயர்த்தல்
  rationale: எபிரெய வடிவத்தைச் சில சூழல்களில் நிகழ்வுக் கூற்றாகவும் எதிர்காலக் கூற்றாகவும் வாசிக்க முடியும். எனினும், இந்தச் சங்கீதத்தின் ஜெபமயமான பல்லவியில் விருப்பம் அல்லது வேண்டுதலைக் குறிக்கும் வாசிப்பே இயல்பானது. மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனச் செந்தமிழுக்கு ஏற்ற, எளிதில் புரியும் கண்ணியமான வழிபாட்டு நடை பயன்படுத்தப்பட்டுள்ளது. ‘உம்மை’ என்ற மரியாதை ஒருமை ஜெபத் தொனிக்கு ஏற்றது; ‘மக்கள் இனங்கள்’ எபிரெயப் பன்மையையும் உலகளாவிய பரப்பையும் காக்கிறது.
