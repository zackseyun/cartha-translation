revisions:
- from: கடவுளே, மக்கள் இனங்கள் உம்மைப் போற்றட்டும்[a][b]; எல்லா மக்கள் இனங்களும் உம்மைப் போற்றட்டும்.
  to: கடவுளே, மக்கள் உம்மைப் போற்றட்டும்[a][b]; எல்லா மக்களும் உம்மைப் போற்றட்டும்.
  rationale: The revision is limited to replacing the less idiomatic ‘மக்கள் இனங்கள்’ with ‘மக்கள்’ in both cola and in the alternative-reading footnote. This improves natural modern Tamil while preserving the Hebrew plural collective, the prayerful mood, repetition, universal scope, and both audit-trail alternatives.
