source:
  edition: WLC
  text: אֱלֹהִ֗ים יְחָנֵּ֥/נוּ וִֽ/יבָרְכֵ֑/נוּ יָ֤אֵ֥ר פָּנָ֖י/ו אִתָּ֣/נוּ סֶֽלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/067/001.yaml
  text: May God be gracious to us and bless us[a]; may his face shine upon us[c][b]. Selah
translation:
  language: ta
  text: கடவுள் நமக்கு அருள்புரிந்து, நம்மை ஆசீர்வதிப்பாராக; அவருடைய முகம் நம்மேல் ஒளிரட்டும்[a][c]. சேலா[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நம்மோடு.’ எபிரெயத்தில் சொற்பட ‘நம்மோடு’ என்று உள்ளது; முகம் ஒளிர்வது குறித்த இந்த மரபுத்தொடர் பொதுவாக ‘நம்மேல் ஒளிரட்டும்’ எனப் பொருள்பட மொழிபெயர்க்கப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘சேலா’ என்பது ஒருவேளை வழிபாட்டு அல்லது இசைக் குறியீடாக இருக்கலாம்; அதன் துல்லியமான பொருள் உறுதியில்லை.
    reason: cultural_note
  - marker: c
    text: இந்த வரி எண்ணாகமம் 6:24–26-இல் உள்ள ஆசாரிய ஆசீர்வாதத்தை, குறிப்பாக ‘ஆண்டவர் தமது முகத்தை உன்மேல் ஒளிரச் செய்வாராக’ என்ற 6:25-ஐ, நினைவூட்டுகிறது.
    reason: cross_reference
lexical_decisions:
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: வடிவத்தில் பன்மையாக இருந்தாலும், இங்கு ஒருமை வினைச்சொற்களுடன் வந்து இஸ்ரவேலின் ஒரே கடவுளைக் குறிக்கிறது. நவீன பொதுத்தமிழில் ‘கடவுள்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: יְחָנֵּנוּ
  choice: நமக்கு அருள்புரிந்து
  rationale: חנן என்ற வேர்ச்சொல் வேண்டுதல் சூழலில் அருளும் தயவும் காட்டுவதைச் சுட்டுகிறது. ‘அருள்புரிந்து’ என்பது அதை ‘இரக்கம்’ என்று மிகக் குறுகலாக வரையறுக்காமல், வழிபாட்டு நடையையும் காக்கிறது.
- source_word: וִיבָרְכֵנוּ
  choice: நம்மை ஆசீர்வதிப்பாராக
  rationale: ברך என்பதன் வழக்கமான பொருள் ‘ஆசீர்வதித்தல்.’ ‘-பாராக’ என்ற வடிவம் வேண்டுதல் அல்லது விருப்பத்தின் வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יָאֵר
  choice: ஒளிரட்டும்
  rationale: אור என்பதன் ஹிஃபில் வடிவம் சொற்பட ‘ஒளிரச் செய்யட்டும்’ எனலாம். முகம் பற்றிய இந்த உருவகத்தில் ‘ஒளிரட்டும்’ என்பது இயல்பாக இருந்து, எண்ணாகமம் 6:25-இன் ஆசீர்வாத மொழியையும் காக்கிறது.
- source_word: פָּנָיו
  choice: அவருடைய முகம்
  rationale: இது சொற்பட ‘அவருடைய முகம்.’ ‘பிரசன்னம்’ அல்லது ‘சந்நிதி’ என விளக்கிப் பெயர்க்காமல், மூலத்தின் தெளிவான உருவகமும் வேதாகம இடைஒலியும் பாதுகாக்கப்படுகின்றன.
- source_word: אִתָּנוּ
  choice: நம்மேல்
  rationale: எபிரெயச் சொல் சொற்பட ‘நம்மோடு’ என்றாலும், முகம் ஒளிரும் இந்த ஆசீர்வாத மரபுத்தொடரில் கடவுளுடைய அருள் மக்கள்மீது செலுத்தப்படுவதே கருத்து. இயல்பான தமிழுக்காக ‘நம்மேல்’ பயன்படுத்தப்பட்டு, சொற்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: סֶלָה
  choice: சேலா
  rationale: இதன் துல்லியமான பொருள் உறுதியில்லை; இது வழிபாட்டு அல்லது இசைக் குறியீடாக இருக்கலாம். ஊகமான விளக்கத்தை மூலவசனத்துக்குள் சேர்க்காமல் ஒலிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: வினைச்சொல் தொடரின் வேண்டுதல் வலிமை
  choice: ‘அருள்புரிந்து, நம்மை ஆசீர்வதிப்பாராக; ... ஒளிரட்டும்’ என்ற வேண்டுதல்/விருப்ப வடிவம்
  alternative: ‘கடவுள் நமக்கு அருள்புரிகிறார்; நம்மை ஆசீர்வதிக்கிறார்’ என்ற நிகழ்காலக் கூற்று
  rationale: சங்கீத ஆசீர்வாதச் சூழலில் இவ்வினை வடிவங்கள் இயல்பாக வேண்டுதல்களாகச் செயல்படுகின்றன. தமிழ் விருப்ப விகுதிகள் அந்த ஜஸ்ஸிவ் வலிமையைப் பாதுகாக்கின்றன.
- issue: ஆசாரிய ஆசீர்வாதத்துடனான இடைஒலி
  choice: ‘அவருடைய முகம் ... ஒளிரட்டும்’ என்ற உருவகத்தை அப்படியே வைத்தல்
  alternative: ‘அவர் நம்மை தயவுடன் நோக்கட்டும்’ போன்ற விளக்க மொழிபெயர்ப்பு
  rationale: இந்த வரி எண்ணாகமம் 6:24–26, குறிப்பாக 6:25-ஐ நினைவூட்டுகிறது. முகம் ஒளிரும் உருவகத்தை வைத்திருப்பது அந்த வேதாகமத் தொடர்பைப் பாதுகாக்கிறது; கூடுதல் கோட்பாட்டு விளக்கத்தைத் திணிப்பதில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் எளிதில் புரியும், ஆனால் வழிபாட்டுக்குரிய கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘அருள்புரிந்து’ மற்றும் ‘ஆசீர்வதிப்பாராக’ என்பவை இயல்பான வேண்டுதல் ஓசையைத் தருகின்றன. மூலத்தின் முகம்-ஒளிர்தல் உருவகம் விளக்கமாக மாற்றப்படாமல் பாதுகாக்கப்பட்டுள்ளது.
