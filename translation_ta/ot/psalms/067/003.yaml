id: PSA.67.3
reference: Psalms 67:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: יוֹד֖וּ/ךָ עַמִּ֥ים אֱלֹהִ֑ים י֝וֹד֗וּ/ךָ עַמִּ֥ים כֻּלָּֽ/ם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/067/003.yaml
  text: Let the peoples praise you[a], O God[b]; let all the peoples praise you.
translation:
  language: ta
  text: கடவுளே, பல்வேறு மக்களும் உம்மைப் புகழட்டும்[a]; எல்லா மக்களும் உம்மைப் புகழட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பல்வேறு மக்களும் உம்மைப் புகழ்வார்களாக” அல்லது “பல்வேறு மக்களும் உம்மைப் புகழ்வார்கள்.” எபிரெய வினை வடிவத்தை விருப்பம் அல்லது வேண்டுதலாகவும், இங்கு சற்றுக் குறைவான சாத்தியத்துடன் எதிர்காலக் கூற்றாகவும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: יוֹדוּךָ
  choice: உம்மைப் புகழட்டும்
  rationale: ידה என்பதன் ஹிஃபில் வடிவம் சங்கீதப் புகழ்ச்சி சூழலில் ‘புகழ்தல்’ அல்லது ‘நன்றி செலுத்துதல்’ என்று பொருள்படும். இங்கு திருப்புரை போன்ற வேண்டுதல் அமைந்திருப்பதால், விருப்பத்தையும் மன்றாட்டையும் வெளிப்படுத்தும் ‘புகழட்டும்’ இயல்பாகப் பொருந்துகிறது.
- source_word: עַמִּים
  choice: மக்கள் கூட்டங்கள்
  rationale: பன்மையில் உள்ள עַמִּים ஒரே மக்களை அல்ல, பல இன அல்லது சமூகக் குழுக்களைக் குறிக்கிறது. ‘மக்கள் கூட்டங்கள்’ என்பது அரசியல் சார்ந்த ‘நாடுகள்’ என்பதைக் காட்டிலும் எபிரெயச் சொல்லின் சமூகக் குழு சார்ந்த பொருளையும் பன்மையையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: אֱלֹהִים
  choice: கடவுளே
  rationale: இங்கு אֱלֹהִים நேரடி விளியாக வருகிறது. தமிழில் ‘கடவுளே’ என்பது அந்த விளிப்பொருளை இயல்பாகவும் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: כֻּלָּם
  choice: அனைத்தும்
  rationale: இந்தச் சொல் குறிப்பிடப்பட்ட மக்கள் கூட்டங்கள் யாவற்றையும் உள்ளடக்கும் முழுமையைச் சுருக்கமாகக் காட்டுகிறது; அதேவேளை கவிதை ஓட்டத்தையும் காக்கிறது.
theological_decisions:
- issue: புகழ்ச்சித் திருப்புரையில் இருமுறை வரும் வினையின் விருப்ப/வேண்டுதல் வலிமை
  choice: வேண்டுதலாகவும் விருப்பமாகவும் ‘புகழட்டும்’ என்று மொழிபெயர்த்தல்
  alternative: ‘புகழ்வார்கள்’ என்று எதிர்காலக் கூற்றாக மொழிபெயர்த்தல்
  rationale: எபிரெய வினை வடிவம் உருவியல் அடிப்படையில் imperfect ஆக இருந்தாலும், இச்சங்கீதத்தின் வழிபாட்டு மற்றும் திருப்புரைச் சூழலில் அது விருப்பம் அல்லது மன்றாட்டை வெளிப்படுத்துகிறது. ‘புகழட்டும்’ என்பது தீர்க்கமான எதிர்கால முன்னறிவிப்பாக மாற்றாமல் அந்தத் தொனியைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘உம்மைப்’ என்ற மரியாதை ஒருமை, கடவுளை நோக்கிய நேரடி விளியை இயல்பாகத் தாங்குகிறது. ‘மக்கள் கூட்டங்கள்’ என்ற சொற்றொடர் பல்வேறு இனங்களையும் சமூகங்களையும் குறிக்கும் மூலமொழிப் பன்மையைப் பாதுகாக்கிறது.
