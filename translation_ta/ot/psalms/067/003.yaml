revisions:
- from: கடவுளே, மக்கள் கூட்டங்கள் உம்மைப் புகழட்டும்[a]; மக்கள் கூட்டங்கள் அனைத்தும் உம்மைப் புகழட்டும்.
  to: கடவுளே, பல்வேறு மக்களும் உம்மைப் புகழட்டும்[a]; எல்லா மக்களும் உம்மைப் புகழட்டும்.
  rationale: The revision changes only the rendering of עַמִּים and its corresponding footnote wording. It removes the crowd/gathering implication of ‘மக்கள் கூட்டங்கள்,’ preserves the Hebrew plural through ‘பல்வேறு மக்களும்,’ and renders כֻּלָּם naturally as ‘எல்லா மக்களும்.’ The volitional refrain, direct divine address, and poetic repetition are retained.
  reviewer_model: gpt-5.6-terra
