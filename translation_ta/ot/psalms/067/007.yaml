  source_fidelity: 'மூல எபிரெய உரையின் இரு நிறைவுறா வினைகளும் எதிர்கால/நம்பிக்கையான அறிவிப்பாகத் துல்லியமாகக் கொடுக்கப்பட்டுள்ளன: «கடவுள் நம்மை ஆசீர்வதிப்பார்» மற்றும் «... பயப்படுவார்கள்». אֹתוֹ என்பதன் நேரடி பொருள் ‘அவரை’ என்றாலும், தமிழ் வழக்கில் ירא-வின் பொருளுக்கு இயல்பான ‘அவருக்குப் பயப்படுவார்கள்’ என்ற அமைப்பு பொருளைச் சரியாகத் தருகிறது. «பூமியின் எல்லா முனைகளிலும் உள்ளவர்கள்» என்பது ‘பூமியின் எல்லைகள் அனைத்தும்’ என்ற எபிரெயக் கவிதை வழக்கை மனிதர்களைக் குறிக்கும் பொருளில் தெளிவாக்கும் ஏற்கத்தக்க மொழிபெயர்ப்பு ஆகும்.'
  naturalness: நவீன பொதுத் தமிழில் வாசிப்பு இயல்பாகவும் கண்ணியமான கவிதைத் தொனியுடனும் உள்ளது. «ஆசீர்வதிப்பார்», «பயப்படுவார்கள்» ஆகியவை எளிதில் புரியக்கூடியவை. அடிக்குறிப்பும் இயல்பான தமிழில், பிரதான உரையில் உள்ள ‘பயப்படுவார்கள்’ என்பதன் பயபக்தி/வியப்பு நுணுக்கத்தை நன்றாக விளக்குகிறது.
