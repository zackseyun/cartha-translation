base_translation:
  language: en
  yaml_path: translation/ot/psalms/067/007.yaml
  text: God will bless us[a], and all the ends of the earth will fear him.
translation:
  language: ta
  text: கடவுள் நம்மை ஆசீர்வதிப்பார்; பூமியின் எல்லா முனைகளிலும் உள்ளவர்கள் அவருக்குப் பயப்படுவார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவருக்குப் பயபக்தி கொள்வார்கள்’ அல்லது ‘அவரைக் கண்டு வியந்து நிற்பார்கள்’ என்றும் மொழிபெயர்க்கலாம். இங்குள்ள எபிரெய வினைச்சொல், கடவுளை நோக்கிய அச்சத்தையும் வணக்கத்துடன் கூடிய பயபக்தியையும் உள்ளடக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְבָרְכֵנוּ
  choice: நம்மை ஆசீர்வதிப்பார்
  rationale: பיעேல் வடிவிலுள்ள ברך, முதலாம் நபர் பன்மை பின்னொட்டுடன், ‘நம்மை ஆசீர்வதிப்பார்’ என்று பொருள்படும். இங்குள்ள நிறைவுறாத வினைவடிவம் சங்கீதத்தின் முடிவில் வெளிப்படும் நம்பிக்கையைச் சுட்டும் எதிர்கால உறுதிப்பாடாக மொழிபெயர்க்கப்பட்டுள்ளது; ‘ஆசீர்வதிப்பாராக’ என்ற விருப்பப் பொருளும் சூழலில் சாத்தியம்.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: சொல் வடிவத்தில் பன்மைத் தோற்றம் இருந்தாலும், இங்கு ஒருமையான தனிப்பட்ட இறைச் சுட்டாக உள்ளது; நவீன பொதுத் தமிழில் ‘கடவுள்’ இயல்பான தேர்வு.
- source_word: וְיִירְאוּ
  choice: பயப்படுவார்கள்
  rationale: கடவுளை நோக்கிய ירא என்பது பயம், பயபக்தி, வியப்பு ஆகியவற்றை உள்ளடக்கக்கூடும். நேரடியான பொருளையும் அதன் இறையியல் அழுத்தத்தையும் காக்க ‘பயப்படுவார்கள்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: אֹתוֹ
  choice: அவருக்கு
  rationale: ஒருமையான தனிப்பட்ட இறைச் சுட்டைத் தமிழின் மரியாதை வழக்கில் ‘அவர்’ என்று குறிப்பிடுகிறது. ירא வினையுடன் இயல்பான தமிழுக்காக நான்காம் வேற்றுமை வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: כָּל אַפְסֵי אָרֶץ
  choice: பூமியின் எல்லா முனைகளிலும் உள்ளவர்கள்
  rationale: எபிரெய மொழிவழக்கு உலகின் மிகத் தொலைவான பகுதிகளைச் சுட்டுகிறது. ‘முனைகள்’ என்ற கவித்துவப் படிமத்தைத் தக்கவைத்தபடி, அந்த இடங்களில் வாழும் மக்களே வினையின் எழுவாய் என்பதைத் தமிழில் தெளிவாக்க ‘உள்ளவர்கள்’ சேர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: கடவுளை நோக்கிய ירא என்பதன் பொருள்
  choice: அவருக்குப் பயப்படுவார்கள்
  alternative: அவரை வணக்கத்துடன் மதிப்பார்கள் / அவரைக் கண்டு பயபக்தியடைவார்கள்
  rationale: எபிரெயச் சொல் வெறும் அச்சத்தை மட்டுமல்லாமல் பயபக்தி, வியப்பு, கீழ்ப்படிதல் ஆகிய உணர்வுகளையும் தாங்குகிறது. முதன்மை உரையில் ‘பயப்படுவார்கள்’ என்பது அந்தத் தீவிரத்தையும் பொருள் விரிவையும் குறுக்காமல் காக்கிறது; அடிக்குறிப்பு அதன் நுணுக்கத்தை விளக்குகிறது.
- issue: יְבָרְכֵנוּ வினைவடிவத்தின் காலம் அல்லது மனோபாவம்
  choice: நம்மை ஆசீர்வதிப்பார்
  alternative: நம்மை ஆசீர்வதிப்பாராக
  rationale: சங்கீதத்தின் நிறைவில் இது நம்பிக்கையுள்ள அறிவிப்பாக இயல்பாக வாசிக்கிறது. இருப்பினும், நிறைவுறாத வினைவடிவத்துக்கு விருப்ப அல்லது வேண்டுதல் நிழலும் சாத்தியம்; முதன்மை உரை அதைத் தீர்மானமாக மறுக்காது.
translation_notes:
  register: நவீன பொதுத் தமிழில் எளிமையான, கண்ணியமான, கவித்துவத் தொனி. ‘பூமியின் எல்லா முனைகளிலும்’ என்ற படிமம் மூல மொழிவழக்கைத் தக்கவைக்கிறது; ‘உள்ளவர்கள்’ என்பது தமிழில் மனித எழுவாயைத் தெளிவாக்குகிறது. அடிக்குறிப்பு குறி முதன்மை உரையில் இடம்பெற்றுள்ளது.
