id: PSA.67.2
reference: Psalms 67:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: לָ/דַ֣עַת בָּ/אָ֣רֶץ דַּרְכֶּ֑/ךָ בְּ/כָל גּ֝וֹיִ֗ם יְשׁוּעָתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/067/002.yaml
  text: that your way may be known on the earth[b][a], your salvation among all nations.
translation:
  language: ta
  text: பூமியில்[a] உமது வழியும், எல்லா நாடுகளிடையே உமது மீட்பும்[b] அறியப்படும்படி.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நாட்டில்.” இச்சொல்லை உள்ளூர் நிலப்பரப்பைக் குறிப்பதாகவும் கொள்ளலாம்; ஆனால் “எல்லா நாடுகளிடையே” என்ற இணைவரி “பூமியில்” என்ற பரந்த பொருளை ஆதரிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உமது காப்பு” அல்லது “உமது விடுதலை.” எபிரெயச் சொல் ஆபத்திலிருந்து விடுவிப்பதையும் பரந்த பொருளிலான மீட்பையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָדַעַת
  choice: அறியப்படும்படி
  rationale: לְ முன்னொட்டுடன் வரும் வினையெச்சம் இங்கு முந்தைய வசனத்தின் வேண்டுதலுக்கான நோக்கத்தைத் தெரிவிக்கிறது. “அறியப்படும்படி” என்பது அந்த நோக்கப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: בָּאָרֶץ
  choice: பூமியில்
  rationale: אֶרֶץ என்பதற்கு “நாடு” அல்லது “பூமி” என்று பொருள் வரலாம். “எல்லா நாடுகளிடையே” என்ற இணைவரி உலகளாவிய நோக்கைக் காட்டுவதால் “பூமியில்” தேர்ந்தெடுக்கப்பட்டது.
- source_word: דַּרְכֶּךָ
  choice: உமது வழி
  rationale: דֶּרֶךְ என்பதன் வழி/பாதை உருவகத்தைப் பாதுகாப்பதோடு, கடவுள் செயல்படும் முறையையும் குறிக்கக்கூடிய இயல்பான சொற்றொடர் இது.
- source_word: בְּכָל גּוֹיִם
  choice: எல்லா நாடுகளிடையே
  rationale: גּוֹיִם இங்கு உலகின் நாடுகளை ஒட்டுமொத்தமாகக் குறிக்கிறது. בְּ முன்னொட்டின் சூழலுக்கேற்ற வகையில் “நாடுகளிடையே” என மொழிபெயர்க்கப்பட்டது.
- source_word: יְשׁוּעָתֶךָ
  choice: உமது மீட்பு
  rationale: יְשׁוּעָה என்பது காப்பு, விடுவிப்பு, மீட்பு ஆகிய பரப்பைக் கொண்டது. “மீட்பு” கடவுளின் காக்கும் செயலைக் குறுகிய பொருளுக்குள் அடைக்காமல், நவீன தமிழில் தெளிவாகத் தருகிறது.
theological_decisions:
- issue: אֶרֶץ என்பதன் உள்ளூர் அல்லது உலகளாவிய பரப்பு
  choice: உலகளாவிய “பூமி”
  alternative: உள்ளூர் பொருளிலான “நாடு”
  rationale: “எல்லா நாடுகளிடையே” என்ற இணையான சொற்றொடர், இஸ்ரவேலின் நிலத்தை மட்டும் அல்லாமல் உலகளாவிய பரப்பைச் சுட்டுகிறது.
- issue: יְשׁוּעָה என்பதன் பரந்த இறையியல் பொருள்
  choice: மீட்பு
  alternative: காப்பு அல்லது விடுதலை
  rationale: இச்சொல் குறிப்பிட்ட ஆபத்திலிருந்து விடுவிப்பதையும் பரந்த அளவிலான இறை மீட்பையும் குறிக்கலாம். “மீட்பு” அந்தப் பொருள் பரப்பைப் பாதுகாக்கிறது; பிற்காலக் கோட்பாட்டு வரையறை ஒன்றுக்குள் அதைச் சுருக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் சங்கீதத்திற்குரிய செறிவும் காக்கப்பட்டுள்ளன. “உமது” என்ற மரியாதை வடிவமும், எபிரெயத்தின் இணைவரி அமைப்பைத் தெளிவாகக் காட்டும் சொல் வரிசையும் பயன்படுத்தப்பட்டுள்ளன.
