lexical_decisions:
- source_word: אַל יֹאמְרוּ
  choice: சொல்லாதிருக்கட்டும்
  rationale: אַל உடன் வரும் வினை வடிவம் எதிர்மறை வேண்டுதலை வெளிப்படுத்துகிறது. சங்கீதக்காரன் எதிரிகளைக் குறித்துத் தேவனிடம் வைக்கும் வேண்டுதலாக இதை இயல்பான தமிழில் தருகிறது.
- source_word: בְלִבָּם
  choice: தங்கள் உள்ளத்தில்
  rationale: எபிரெயத்தில் கூட்டாக ஒருமையில் வரும் ‘அவர்களுடைய இருதயத்தில்’ என்ற உள்மன எண்ணத்தைக் குறிக்கும் மொழிநடையை, நவீன தமிழில் இயல்பாகப் பிரதிபலிக்கிறது.
- source_word: הֶאָח
  choice: ஆகா!
  rationale: தீய மகிழ்ச்சியையும் வெற்றிக்களிப்பையும் வெளிப்படுத்தும் இடைச்சொல்லின் ஏளனத் தொனியைத் தக்கவைக்கிறது.
- source_word: נַפְשֵׁנוּ
  choice: நாம் விரும்பியது நடந்துவிட்டது
  rationale: נֶפֶשׁ என்பதன் அடிப்படைப் பொருள் ‘உயிர்/தன்’ என்றாலும், இங்குள்ள வெற்றிக்களிப்பு மொழிநடையில் அது உள்ளார்ந்த ஆசை அல்லது ஆசை நிறைவேறிய திருப்தியைக் குறிக்க வாய்ப்புள்ளது. தமிழில் வெறும் ‘எங்கள் ஆத்துமா’ என்பது பொருளை மறைக்கும் என்பதால், சூழல்சார் பொருள் தெளிவாக வழங்கப்பட்டது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.
- source_word: בִּלַּעֲנוּהוּ
  choice: அவனை விழுங்கிவிட்டோம்
  rationale: בלע என்பதன் ‘விழுங்கு/கபளீகரம் செய்’ என்ற உயிரோட்டமான உருவகத்தையும், எதிரிகள் முழுமையாக வென்றுவிட்டதாகப் பெருமை பேசுவதையும் தக்கவைக்கிறது.
