  text: Take hold of shield and buckler[a], and rise up for my help.
translation:
  language: ta
  text: 'கேடயத்தையும் பெருங்கேடயத்தையும்[a] கையில் எடுத்து,

    எனக்கு உதவ எழுந்தருளும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: வேறு வகையில், ‘பெரிய கேடயம்’; எபிரெயத்தில் கேடயத்தைக் குறிக்கும் இரு வேறு சொற்கள் பயன்படுத்தப்பட்டுள்ளன. அவை வெவ்வேறு வகையான தற்காப்புக் கருவிகளைக் குறிப்பதாகத் தெரிகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֲזֵק
  choice: கையில் எடுத்து
  rationale: இங்கு வினைச்சொல் ஆயுதங்களைப் போருக்காகப் பற்றிக்கொள்ளும் கட்டளையைக் குறிக்கிறது. ‘கையில் எடுத்து’ என்பது அந்தத் தெளிவான போர்ச் சித்திரத்தை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: מָגֵן
  choice: கேடயம்
  rationale: இது கேடயத்தைக் குறிக்கும் பொதுவான எபிரெயச் சொல்; ‘கேடயம்’ அதன் இயல்பான தமிழ் இணைச்சொல்.
- source_word: צִנָּה
  choice: பெருங்கேடயம்
  rationale: இது מָגֵן என்பதிலிருந்து வேறுபட்ட, உடலின் பெரும்பகுதியை மறைக்கும் பெரிய கேடயத்தைக் குறிக்கலாம். ‘பெருங்கேடயம்’ இரண்டு எபிரெயச் சொற்களுக்குள்ள வேறுபாட்டைக் காக்கிறது.
- source_word: וְקוּמָה
  choice: எழுந்தருளும்
  rationale: קום என்பதன் கட்டளை வடிவம் உடனடியாகச் செயல்படும்படி விடுக்கும் வேண்டுகோள். கடவுளிடம் பேசும் மன்றாட்டு நடைக்கு ஏற்ற மரியாதையையும் ‘எழுதல்’ என்ற மூலப் படிமத்தையும் இச்சொல் காக்கிறது.
- source_word: בְּעֶזְרָתִי
  choice: எனக்கு உதவ
  rationale: சங்கீதக்காரருக்கு ஆதரவாகச் செயல்படுவதைக் குறிக்கும் இத்தொடரை, பொருளை மாற்றாமல் இயல்பான தமிழில் ‘எனக்கு உதவ’ என்று வழங்கலாம்.
theological_decisions:
- issue: கடவுளைப் போர்வீரராகச் சித்தரிக்கும் உருவகம்
  choice: கடவுள் கேடயங்களை எடுத்துக்கொண்டு உதவ எழுவதாகிய போர்ச் சித்திரத்தை நேரடியாகத் தக்கவைத்தல்
  alternative: பொதுவாகப் பாதுகாப்பு வேண்டுவதாக உருவகத்தை மென்மைப்படுத்துதல்
  rationale: எபிரெய மூலவாக்கியம் வெளிப்படையான போர்ச் சொற்களைப் பயன்படுத்தி, கடவுளைப் பாதுகாத்துப் போரிடுபவராகச் சித்தரிக்கிறது. அந்த உருவகத்தைப் பொதுவான பாதுகாப்புக் கோரிக்கையாக மாற்றாமல் காப்பது மூலத்திற்கு உண்மையானது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் மன்றாட்டுக்குரிய கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘எழுந்தருளும்’ என்பது கடவுளிடம் உரைக்கும் மரியாதை நடையைத் தருகிறது; போர்ச் சித்திரம் சுருக்கப்படாமல் பாதுகாக்கப்பட்டுள்ளது.
