  text: יֵבֹ֣שׁוּ וְ/יִכָּלְמוּ֮ מְבַקְשֵׁ֪י נַ֫פְשִׁ֥/י יִסֹּ֣גוּ אָח֣וֹר וְ/יַחְפְּר֑וּ חֹ֝שְׁבֵ֗י רָעָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/004.yaml
  text: Let those who seek my life be put to shame and humiliated[b][a]; let those who devise my harm turn back and be disgraced.
translation:
  language: ta
  text: என் உயிரைப் பறிக்க முயலுகிறவர்கள் வெட்கமடைந்து அவமானப்படட்டும்[a]; எனக்குத் தீங்கு செய்யத் திட்டமிடுகிறவர்கள் பின்வாங்கி இழிவடையட்டும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “என் ஆத்துமாவைத் தேடுகிறவர்கள்”; இங்குள்ள எபிரேய மரபுத்தொடர் ஒருவரின் உயிரைப் பறிக்கத் தேடுவதைக் குறிக்கிறது.'
    reason: lexical_alternative
  - marker: b
    text: 'அல்லது: “எனக்கு எதிராகத் தீமை வகுக்கிறவர்கள்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: வெட்கமடையட்டும்
  rationale: בוש என்பதன் வெட்கம் அல்லது தோல்வியால் நேரும் அவமானம் என்ற பொருளையும், இச்சூழலிலுள்ள வேண்டுதல் தன்மையையும் இயல்பான தமிழில் தருகிறது.
- source_word: וְיִכָּלְמוּ
  choice: அவமானப்படட்டும்
  rationale: כלם நிஃபால் வடிவின் அவமானத்துக்குள்ளாகும் விளைவைத் தந்து, முந்தைய ‘வெட்கமடையட்டும்’ என்பதைக் காட்டிலும் வலுவான இணைச்சொல்லாக அமைகிறது.
- source_word: מְבַקְשֵׁי נַפְשִׁי
  choice: என் உயிரைப் பறிக்கத் தேடுகிறவர்கள்
  rationale: பகைமையான சூழலில் נפשׁ-ஐத் தேடுதல் என்பது ஒருவரின் உயிரைப் பறிக்க முயல்வதைக் குறிக்கும் எபிரேய மரபுத்தொடர்; தமிழில் நோக்கத்தைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: יִסֹּגוּ אָחוֹר
  choice: பின்னிட்டுத் திரும்பட்டும்
  rationale: סוג + אָחוֹר தோல்வியுற்றுப் பின்வாங்குதல் அல்லது பின்னோக்கித் திரும்புதல் என்பதைக் குறிக்கிறது; ‘பின்னிட்டுத் திரும்பட்டும்’ அந்த இயக்கத்தையும் வேண்டுதல் வலிமையையும் காக்கிறது.
- source_word: וְיַחְפְּרוּ
  choice: இழிவடையட்டும்
  rationale: இங்கு חפר தோண்டுதல் அல்ல, அவமானம் அல்லது இழிவு அடைதலைக் குறிக்கிறது; முந்தைய வெட்கச் சொற்களுடன் தொடர்பைக் காத்தபடி சிறிய சொற்பொருள் வேறுபாட்டை வழங்குகிறது.
- source_word: חֹשְׁבֵי רָעָתִי
  choice: எனக்குத் தீங்கு செய்யத் திட்டமிடுகிறவர்கள்
  rationale: חשב திட்டமிடுதல் அல்லது வகுத்தல் என்றும், இங்கு רָעָתִי சங்கீதக்காரனுக்கு எதிராக நோக்கப்பட்ட தீங்கு என்றும் பொருள்படுகின்றன.
theological_decisions:
- issue: சாபவேண்டுதல் சார்ந்த யுஸ்ஸிவ் வினை வலிமை
  choice: ‘-ட்டும்’ வடிவில் வேண்டுதல் அல்லது முறையீடாக மொழிபெயர்த்தல்
  alternative: ‘அவர்கள் வெட்கமடைவார்கள்...’ என்ற எதிர்கால அறிவிப்பாக மொழிபெயர்த்தல்
  rationale: எபிரேய இறந்தகாலமல்லா வினைவடிவங்கள் தனியே பார்க்கும்போது பலவாறு கொள்ளப்படலாம்; ஆனால் கடவுளை நோக்கிய இந்த மன்றாட்டு சூழலில் அவை தீர்ப்புக்கான வேண்டுதல்களாக இயல்பாகச் செயல்படுகின்றன. தமிழ் ‘-ட்டும்’ வடிவம் அந்தத் திறந்த வேண்டுதல் வலிமையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘வெட்கம்—அவமானம்—இழிவு’ என்ற எபிரேய இணைச்சொல் அமைப்பின் வேறுபாடுகள் முடிந்தவரை காக்கப்பட்டுள்ளன; வேண்டுதல் வலிமை ‘-ட்டும்’ வடிவால் வெளிப்படுத்தப்பட்டுள்ளது.
