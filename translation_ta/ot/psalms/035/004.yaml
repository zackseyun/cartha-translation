revisions:
- from: என் உயிரைப் பறிக்கத் தேடுகிறவர்கள் வெட்கமடைந்து அவமானப்படட்டும்[a]; எனக்குத் தீங்கு செய்யத் திட்டமிடுகிறவர்கள் பின்னிட்டுத் திரும்பி இழிவடையட்டும்[b].
  to: என் உயிரைப் பறிக்க முயலுகிறவர்கள் வெட்கமடைந்து அவமானப்படட்டும்[a]; எனக்குத் தீங்கு செய்யத் திட்டமிடுகிறவர்கள் பின்வாங்கி இழிவடையட்டும்[b].
