review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the hostile idiom ‘those seeking my life,’ the imprecatory force of the Hebrew imperfects, the paired shame terms, and the reversal implied by יִסֹּגוּ אָחוֹר. The proposed revision retains these features.
  naturalness: ‘பின்னிட்டுத் திரும்பி’ is not idiomatic modern standard Tamil in this context. ‘பின்வாங்கி’ naturally expresses the intended retreat/reversal. ‘என் உயிரைப் பறிக்க முயலுகிறவர்கள்’ is also more fluent than ‘என் உயிரைப் பறிக்கத் தேடுகிறவர்கள்,’ while accurately representing the Hebrew idiom.
  terminology: ‘உயிர்,’ ‘வெட்கம்,’ ‘அவமானம்,’ and ‘இழிவு’ are suitable, dignified modern Tamil choices. The footnotes correctly preserve the lexical alternative concerning ‘soul’ and the alternative sense of planning evil against the psalmist.
  issues:
  - severity: medium
    issue: ‘பின்னிட்டுத் திரும்பி’ is awkward/nonstandard phrasing.
    rationale: It obscures the natural sense of retreat or turning back expressed by סוג + אָחוֹר. ‘பின்வாங்கி’ gives clear, idiomatic modern Tamil while retaining the defeat/reversal sense.
  - severity: low
    issue: ‘என் உயிரைப் பறிக்கத் தேடுகிறவர்கள்’ is an unnatural verb combination.
    rationale: Tamil normally says that one ‘tries/seeks to take’ a life rather than ‘seeks in order to take’ it. ‘என் உயிரைப் பறிக்க முயலுகிறவர்கள்’ is clear and semantically faithful to the Hebrew hostile idiom.
  revised_text: என் உயிரைப் பறிக்க முயலுகிறவர்கள் வெட்கமடைந்து அவமானப்படட்டும்[a]; எனக்குத் தீங்கு செய்யத் திட்டமிடுகிறவர்கள் பின்வாங்கி இழிவடையட்டும்[b].
