source:
  edition: WLC
  text: וַ/אֲנִ֤י בַּ/חֲלוֹתָ֡/ם לְב֬וּשִׁ/י שָׂ֗ק עִנֵּ֣יתִי בַ/צּ֣וֹם נַפְשִׁ֑/י וּ֝/תְפִלָּתִ֗/י עַל חֵיקִ֥/י תָשֽׁוּב׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/013.yaml
  text: But as for me[a], when they were sick, my clothing was sackcloth; I humbled myself with fasting[c][b], and my prayer returned to my own bosom.
translation:
  language: ta
  text: ஆனால் நான்—அவர்கள் நோயுற்றிருந்தபோது, சாக்குத் துணியே என் உடையாக இருந்தது[b]; நோன்பிருந்து என்னைத் தாழ்த்தினேன்[c]. என் ஜெபம் என் மடியிலே திரும்பியது[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் ஜெபம் பதிலின்றி என்னிடமே திரும்பியது,” அல்லது “என் ஜெபத்தின் நன்மை எனக்கே திரும்பியது.” எபிரெயச் சொற்றொடர் பலவகையாகப் பொருள்படலாம்.
    reason: alternative_reading
  - marker: b
    text: “சாக்குத் துணி” என்பது கரடுமுரடான துணியால் செய்யப்பட்ட உடை; துக்கம், துயரம் அல்லது மனந்திரும்புதலை வெளிப்படுத்த அதை அணிந்தார்கள்.
    reason: cultural_note
  - marker: c
    text: 'சொல்லுக்குச் சொல்: “நோன்பினால் என் உயிரைத் துன்புறுத்தினேன்.” இது நோன்பின் மூலம் தன்னைத் தாழ்த்துவதைக் குறிக்கும் எபிரெய மரபுத்தொடர்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֲלוֹתָם
  choice: அவர்கள் நோயுற்றிருந்தபோது
  rationale: ב plus infinitive construct and the third-person masculine plural suffix give the temporal sense ‘when they were sick’; this is natural modern Tamil.
- source_word: לְבוּשִׁי שָׂק
  choice: துக்கவுடையே என் உடையாக இருந்தது
  rationale: The Hebrew verbless clause literally describes sackcloth as his clothing. ‘துக்கவுடை’ communicates the cultural function naturally, while the footnote identifies it as coarse sackcloth.
- source_word: עִנֵּיתִי בַצּוֹם נַפְשִׁי
  choice: நோன்பிருந்து என்னைத் தாழ்த்தினேன்
  rationale: Literally, ‘I afflicted/humbled my self with fasting.’ The Tamil rendering conveys self-humbling through fasting without the unnatural literal phrase ‘afflicted my soul.’
- source_word: וּתְפִלָּתִי
  choice: என் விண்ணப்பம்
  rationale: ‘விண்ணப்பம்’ naturally denotes an earnest intercessory prayer in this context.
- source_word: עַל חֵיקִי תָשׁוּב
  choice: என் மடியிடமே திரும்பியது
  rationale: This retains the Hebrew image of prayer returning to the speaker’s bosom/lap and does not resolve the idiom’s genuine ambiguity.
theological_decisions:
- issue: ‘My prayer returned to my bosom’ என்ற சொற்றொடரின் பொருள்
  choice: என் விண்ணப்பம் என் மடியிடமே திரும்பியது
  alternative: என் விண்ணப்பம் பதிலின்றி என்னிடமே திரும்பியது; அல்லது அதன் நன்மை எனக்கே திரும்பியது
  rationale: The Hebrew idiom permits more than one interpretation. Preserving the bodily image in the main text maintains the ambiguity rather than deciding whether the prayer was unanswered or benefited the psalmist.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் சங்கீதத்திற்கேற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘துக்கவுடை’ சாதாரண வாசகருக்குப் பொருளைத் தெரிவிக்கிறது; அதன் வரலாற்றுப் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது. இறுதி எபிரெய உருவகம் திட்டமிட்டு தக்கவைக்கப்பட்டுள்ளது.
