revisions:
- from: ஆனால் நான்—அவர்கள் நோயுற்றிருந்தபோது, துக்கவுடையே என் உடையாக இருந்தது[b]; நோன்பிருந்து என்னைத் தாழ்த்தினேன்[c]. என் விண்ணப்பம் என் மடியிடமே திரும்பியது[a].
  to: ஆனால் நான்—அவர்கள் நோயுற்றிருந்தபோது, சாக்குத் துணியே என் உடையாக இருந்தது[b]; நோன்பிருந்து என்னைத் தாழ்த்தினேன்[c]. என் ஜெபம் என் மடியிலே திரும்பியது[a].
  rationale: The revision restores the concrete reference to sackcloth in the main text, while retaining its cultural associations in the note. It renders תְּפִלָּה with the broader Tamil term “ஜெபம்” and preserves the unresolved Hebrew image in the final clause. All existing footnote anchors remain present and correctly matched.
