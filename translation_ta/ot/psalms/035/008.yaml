source:
  edition: WLC
  text: תְּבוֹאֵ֣/הוּ שׁוֹאָה֮ לֹֽא יֵ֫דָ֥ע וְ/רִשְׁתּ֣/וֹ אֲשֶׁר טָמַ֣ן תִּלְכְּד֑/וֹ בְּ֝/שׁוֹאָ֗ה יִפָּל בָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/008.yaml
  text: Let destruction come upon him unawares[a], and let the net that he hid catch him[c][b]; into that very destruction let him fall.
translation:
  language: ta
  text: அவன் அறியாத வேளையில் அழிவு அவன்மேல் வரட்டும்[a]; அவன் மறைத்து வைத்த வலை அவனையே பிடிக்கட்டும்; அந்த அழிவிலேயே அவன் விழட்டும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவன் எதிர்பாராதபோது அழிவு அவன்மேல் வரட்டும்.” எபிரேயத்தில் சொல்லுக்குச் சொல், “அழிவு அவன்மேல் வரட்டும்; அவன் அறியான்.”
    reason: lexical_alternative
  - marker: b
    text: “அதிலேயே” என்பது அவன் மறைத்த வலையைக் குறிக்கலாம். அப்படியானால் கடைசித் தொடர், “அவன் மறைத்த வலையிலேயே அவன் விழட்டும்” என்று பொருள்படும்.
    reason: alternative_reading
lexical_decisions:
- source_word: תְּבוֹאֵהוּ
  choice: அவன்மேல் வரட்டும்
  rationale: בוא என்பதன் அடிப்படைப் பொருளான ‘வருதல்’ என்பதையும், சாப வேண்டுதலுக்குரிய விருப்ப வினைத் தொனியையும் இயல்பான தமிழில் காக்கிறது.
- source_word: שׁוֹאָה
  choice: அழிவு
  rationale: திடீரென நேரும் பேரழிவு அல்லது நாசத்தைக் குறிக்கும் சொல்லுக்கு நவீனத் தமிழில் தெளிவான, இரு இடங்களிலும் பொருந்தும் தேர்வு.
- source_word: לֹא יֵדָע
  choice: அவன் அறியாத வேளையில்
  rationale: ‘அவன் அறியான்’ என்ற எபிரேய வினைத்தொடரை வெறும் ‘எதிர்பாராமல்’ எனச் சுருக்காமல், அவனுடைய அறியாமையை வெளிப்படையாகத் தக்கவைக்கிறது.
- source_word: וְרִשְׁתּוֹ אֲשֶׁר טָמַן
  choice: அவன் மறைத்து வைத்த வலை
  rationale: உடைமைப் பின்னொட்டையும், வலையை இரகசியமாக வைத்த செயற்பாட்டையும் இயல்பான தமிழில் ஒருங்கிணைக்கிறது.
- source_word: תִּלְכְּדוֹ
  choice: அவனையே பிடிக்கட்டும்
  rationale: வலையின் சூழலில் לכד என்பதற்கு ‘பிடி’ இயல்பானது; ‘-ஏ’ அவன் அமைத்த வலையில் அவனே சிக்குகிற பதிலீட்டு வலியுறுத்தலைத் தருகிறது.
- source_word: בְּשׁוֹאָה יִפָּל בָּהּ
  choice: அந்த அழிவிலேயே அவன் விழட்டும்
  rationale: முன்வைக்கப்பட்ட ‘அழிவில்’ என்ற தொடரையும் அதை மீண்டும் சுட்டும் பெண்பால் பின்னொட்டையும் வலியுறுத்தலாகப் புரிந்து, எபிரேயத்தின் மீள்சுட்டலை இயல்பான தமிழில் ‘-லேயே’ என்று தருகிறது; பின்னொட்டு வலையைக் குறிக்கலாம் என்ற மாற்று வாய்ப்பு அடிக்குறிப்பில் காக்கப்படுகிறது.
theological_decisions:
- issue: בָּהּ என்ற பெண்பால் பின்னொட்டின் குறிப்பு
  choice: முதன்மை உரையில் ‘அழிவு’ என்பதையே மீண்டும் சுட்டும் வலியுறுத்தலாக எடுத்தல்
  alternative: அவன் மறைத்த ‘வலை’யைக் குறித்ததாக எடுத்து, ‘அதிலேயே அவன் விழட்டும்’ என மொழிபெயர்த்தல்
  rationale: שׁוֹאָה மற்றும் רֶשֶׁת இரண்டும் எபிரேயத்தில் பெண்பால் என்பதால் இலக்கண ரீதியாக இரண்டும் சாத்தியம். உடனடியாக முன்வரும் בְּשׁוֹאָה-வை மீள்சுட்டுவதாகக் கொள்வது தொடரமைப்புக்கு ஏற்றது; உண்மையான தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; கவிதைக்குரிய கண்ணியத்துடன், பொதுவாசகருக்கு தெளிவான நடை. வேண்டுதல்/சாபத்தின் இணை அமைப்பை ‘வரட்டும்—பிடிக்கட்டும்—விழட்டும்’ எனப் பேணுகிறது. செயற்கையான சொற்சொல் மீளுருவாக்கத்தைத் தவிர்த்தாலும், மூலத்தின் குறிப்புத் தெளிவின்மையை அடிக்குறிப்பில் காக்கிறது.
