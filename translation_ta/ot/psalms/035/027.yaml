base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/027.yaml
  text: Let those who delight in my vindication shout for joy and be glad[a]; let them say continually, “May Yahweh be magnified[b], who delights in the peace of his servant.”
translation:
  language: ta
  text: எனக்கு நீதி கிடைப்பதில்[a] மகிழ்கிறவர்கள் ஆனந்த முழக்கமிட்டு அகமகிழட்டும்; “தம் ஊழியனின் நல்வாழ்வில்[b] மகிழ்ச்சி கொள்கிற யாவே மாட்சிமைப்படுவாராக!” என்று அவர்கள் எப்போதும் சொல்லட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் நீதியில்” அல்லது “என் நியாயத்தில்.” எபிரெயச் சொல் ஒழுக்கரீதியான அல்லது சட்டரீதியான நீதியைக் குறிக்கலாம்; இங்கு சங்கீதக்காரருக்கு நீதி கிடைப்பதையே பெரும்பாலும் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “நல்வாழ்வு” என்பதற்கான எபிரெயச் சொல் “சமாதானம்,” “முழுநலம்,” அல்லது “செழிப்பு” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָרֹנּוּ
  choice: ஆனந்த முழக்கமிட்டு
  rationale: רנן என்பது உரக்க வெளிப்படும் களிப்பொலியைக் குறிக்கிறது; இசைப்பாடலை மட்டும் குறிப்பதாகச் சுருக்காமல், பொதுவெளியில் வெளிப்படும் பேருவகையை இச்சொற்றொடர் தெரிவிக்கிறது.
- source_word: וְיִשְׂמְחוּ
  choice: அகமகிழட்டும்
  rationale: שמח என்பதன் ‘மகிழ்தல்’ என்ற பொருளை, முன்வரும் ஆனந்த முழக்கத்துடன் இயல்பான இணைநிலையாகத் தருகிறது.
- source_word: חֲפֵצֵי צִדְקִי
  choice: எனக்கு நீதி கிடைப்பதில் மகிழ்கிறவர்கள்
  rationale: இந்தச் சங்கீதத்தின் வழக்காடல் சூழலில் צִדְקִי என்பது சங்கீதக்காரர் நீதியானவர் எனத் தீர்ப்புப் பெறுவதையோ அவருக்கு நீதி கிடைப்பதையோ முதன்மையாகக் குறிக்கிறது. தமிழில் இயல்பாகவும் தெளிவாகவும் இருக்க இவ்வாறு தரப்பட்டுள்ளது.
- source_word: וְיֹאמְרוּ תָמִיד
  choice: அவர்கள் எப்போதும் சொல்லட்டும்
  rationale: தொடர்ச்சியான விருப்பவினைத் தொனியையும் תָמִיד என்பதன் இடையறாத தன்மையையும் காக்கிறது.
- source_word: יִגְדַּל יְהוָה
  choice: யாவே மாட்சிமைப்படுவாராக
  rationale: יִגְדַּל இங்கு வாழ்த்துரு அல்லது விருப்பவினைச் செயல்பாட்டில் உள்ளது; ‘மாட்சிமைப்படுவாராக’ என்பது அவருடைய மகத்துவம் போற்றப்பட வேண்டும் என்ற பொருளைத் தருகிறது. יהוה தனிப்பெயராக ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: הֶחָפֵץ
  choice: மகிழ்ச்சிகொள்ளும்
  rationale: חפץ என்பதன் விருப்பமும் இன்பமும் கலந்த உணர்வைத் தெரிவிக்கிறது; வசனத்தின் முற்பகுதியில் அதே வேர்ச்சொல் தரும் கருத்துத் தொடர்பையும் காக்கிறது.
- source_word: שְׁלוֹם
  choice: நல்வாழ்வு
  rationale: שָׁלוֹם இங்கு வெறும் மோதலின்மையைவிட ஊழியனின் முழுமையான நலம், பாதுகாப்பு, செழிப்பு ஆகியவற்றை உள்ளடக்கக்கூடும்; ‘நல்வாழ்வு’ அந்த விரிவை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: עַבְדּוֹ
  choice: தமது ஊழியன்
  rationale: கடவுளுடன் சங்கீதக்காரருக்குள்ள உறவைக் குறிக்கும் இச்சூழலில் עבד என்பதற்கு மரியாதையான, இயல்பான தமிழ் ‘ஊழியன்’ ஆகும்.
theological_decisions:
- issue: צִדְקִי என்பதன் பொருள்
  choice: எனக்கு நீதி கிடைப்பது
  alternative: என் நீதி / என் நீதித்தன்மை
  rationale: எதிரிகளும் குற்றஞ்சாட்டுவோரும் இடம்பெறும் சங்கீதச் சூழலில் சட்டரீதியான நியாயத்தீர்ப்பு அல்லது நிரபராதித்தன்மை நிறுவப்படுதல் முன்னிலையில் உள்ளது. இருப்பினும் மூலச்சொல் ஒழுக்கநீதி, நியாயம் ஆகிய பொருள்களையும் தாங்குவதால் மாற்றுப் பொருள்கள் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளன.
- issue: יהוה என்ற இறைப்பெயர்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: எபிரெய மூலத்தில் உள்ள தனிப்பட்ட இறைப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்த்து வழங்குகிறது.
- issue: שָׁלוֹם என்பதன் பரப்பு
  choice: நல்வாழ்வு
  alternative: சமாதானம் / செழிப்பு
  rationale: இச்சொல் அமைதி மட்டுமல்லாமல் முழுநலம், பாதுகாப்பு, செழிப்பு ஆகியவற்றையும் குறிக்கலாம். சூழலில் ஊழியனின் நலம் என்ற விரிவான பொருளை ‘நல்வாழ்வு’ சிறப்பாகக் காக்கிறது; பிற சாத்தியங்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் சங்கீதத்துக்குரிய கண்ணியமான வாழ்த்துருத் தொனியுடனும் மொழியாக்கப்பட்டுள்ளது. ‘ஆனந்த முழக்கம்,’ ‘மாட்சிமைப்படுவாராக’ போன்ற சொற்கள் கவித்துவ உயர்வைக் காக்கின்றன; அதேவேளையில் பழமையான கடின நடையைத் தவிர்க்கின்றன. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
