  text: You have seen[a], O Yahweh; do not be silent. O Lord, do not be far from me.
translation:
  language: ta
  text: யாவே, நீர் கண்டிருக்கிறீர்; மௌனமாயிருக்காதீர். ஆண்டவரே, என்னைவிட்டு தொலைவில் இருக்காதீர்.
