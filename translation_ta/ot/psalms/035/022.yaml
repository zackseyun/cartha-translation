lexical_decisions:
- source_word: רָאִיתָה
  choice: நீர் கண்டிருக்கிறீர்
  rationale: ראה என்பதன் Qal perfect இரண்டாம் நபர் ஆண்பால் ஒருமை வடிவம். நடந்த அநீதியை இறைவன் ஏற்கெனவே கண்டுள்ளார் என்பதன் அடிப்படையில் சங்கீதக்காரர் முறையிடுவதால், தமிழ் நிறைவுநிலையை இயல்பாக வெளிப்படுத்தும் «கண்டிருக்கிறீர்» தேர்ந்தெடுக்கப்பட்டது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது தேவனுடைய தனிப்பெயரான நான்கெழுத்துப் பெயர். அதை ஒரு பட்டப்பெயராக மாற்றாமல், தமிழில் Yahweh என்பதற்குரிய ஒலிபெயர்ப்பான «யாவே» என்று வழங்குகிறது.
- source_word: אַל תֶּחֱרַשׁ
  choice: மௌனமாக இருந்துவிடாதீர்
  rationale: חרשׁ இங்கு ‘மௌனமாக இரு’ என்று பொருள்படும். אַל உடன் இது மௌனமாகத் தொடர்ந்து இருக்க வேண்டாம் என்ற வேண்டுகோள்; «இருந்துவிடாதீர்» அந்தத் தொடர்நிலையையும் வேண்டுகோளின் தீவிரத்தையும் இயல்பாக உணர்த்துகிறது.
- source_word: אֲדֹנָי
  choice: ஆண்டவரே
  rationale: இங்கு אֲדֹנָי தேவனுக்கான «ஆண்டவர்» என்னும் பட்டப்பெயராகச் செயல்படுகிறது. அழைப்புவடிவம் «ஆண்டவரே» என்று வழங்கப்பட்டு, யாவே என்ற தனிப்பெயரிலிருந்து வேறுபடுத்தப்பட்டுள்ளது.
- source_word: אַל תִּרְחַק מִמֶּנִּי
  choice: என்னைவிட்டு தொலைவில் இருக்காதீர்
  rationale: רחק என்பது ‘தொலைவில் இரு’ என்றும் מִמֶּנִּי என்பது ‘என்னிடமிருந்து/என்னைவிட்டு’ என்றும் பொருள்படும். மூலத்தின் இடவியல் மற்றும் உறவியல் உருவகத்தைத் தமிழ் இயல்பில் இச்சொற்றொடர் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்னும் இறைத் தனிப்பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலவசனம் தனிப்பெயரான יהוה என்பதையும் பட்டப்பெயரான אֲדֹנָי என்பதையும் அடுத்தடுத்து வேறுபடுத்துகிறது. ஆகவே முதலாவதை «யாவே» என்றும் இரண்டாவதை «ஆண்டவர்» என்றும் வழங்குவது அந்த வேறுபாட்டைக் காக்கிறது.
- issue: இறைவனின் மௌனம் குறித்த வேண்டுகோளின் பொருள்
  choice: மௌனமாக இருந்துவிடாதீர்
  alternative: செயலற்றிருக்காதீர்
  rationale: சூழலில் மௌனம் செயல்படாமையையும் பதிலளிக்காமையையும் குறிப்பாக உணர்த்தலாம்; ஆயினும் மொழிபெயர்ப்பு அந்த விளக்கத்தை நேரடியாகப் பதிக்காமல், மூலத்தின் ‘மௌனம்’ என்ற உருவகத்தையும் அதன் இறையியல் பதற்றத்தையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேண்டுகோள் நடை பயன்படுத்தப்பட்டுள்ளது. இறைவனை நோக்கிய ஒருமை மரியாதை வடிவங்களான «நீர்», «கண்டிருக்கிறீர்», «இருக்காதீர்» பயன்படுத்தப்பட்டுள்ளன. மூலத்தின் இரண்டு குறும் வேண்டுகோள்களும் நிறுத்தக்குறிகளால் தெளிவாகப் பிரிக்கப்பட்டுள்ளன.
