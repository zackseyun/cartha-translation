  source_fidelity: 'மூலத்தின் வினை வடிவங்களும் அழைப்பு அமைப்பும் பெரும்பாலும் சரியாகக் காக்கப்பட்டுள்ளன: רָאִיתָה-க்கு «நீர் கண்டிருக்கிறீர்», יהוה-க்கு «யாவே», אֲדֹנָי-க்கு «ஆண்டவரே», மற்றும் «என்னைவிட்டு தொலைவில் இருக்காதீர்» ஆகியவை பொருத்தமானவை. ஆனால் אַל תֶּחֱרַשׁ என்பது நேரடியாக ‘மௌனமாக இராதீர்/மௌனமாயிருக்காதீர்’; «இருந்துவிடாதீர்» மூலத்தில் இல்லாத முடிவுறுத்தல் அல்லது கைவிடுதல் நிழலைச் சேர்க்கிறது.'
