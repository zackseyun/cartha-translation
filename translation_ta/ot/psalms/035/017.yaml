  yaml_path: translation/ot/psalms/035/017.yaml
  text: Lord, how long will you look on? Restore my life from their ravages, my only one from the young lions.
translation:
  language: ta
  text: ஆண்டவரே, எவ்வளவு காலம் பார்த்துக்கொண்டிருப்பீர்? அவர்களுடைய நாசங்களிலிருந்து என் உயிரை மீட்டருளும்; இளஞ்சிங்கங்களிடமிருந்து என் ஒரே உயிரை மீட்டருளும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “என் ஒரே உயிரை” என்பது “என் அருமையான உயிரை” என்றும் பொருள்படலாம்.
    reason: יְחִידָתִי என்பதில் ‘ஒரே ஒன்று,’ ‘ஒப்பற்றது,’ அதனால் ‘அருமையானது’ என்ற பொருள் நுட்பங்கள் உள்ளன. முதன்மை உரை ‘ஒரே’ என்ற நேரடி அழுத்தத்தை வைத்திருக்கிறது; மாற்று நுட்பம் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
lexical_decisions:
- source_word: אֲדֹנָי
  choice: ஆண்டவரே
  rationale: இது எபிரெய உரையில் உள்ள אֲדֹנָי (அதோனாய்) என்னும் அழைப்பை இயல்பான, மரியாதைக்குரிய தமிழில் தருகிறது.
- source_word: כַּמָּה תִרְאֶה
  choice: எவ்வளவு காலம் பார்த்துக்கொண்டிருப்பீர்?
  rationale: சொல்லளவில் ‘எவ்வளவு பார்த்துக்கொண்டிருப்பீர்?’ என்றிருந்தாலும், புலம்பலின் சூழலில் காலநீட்டிப்பைக் கேட்பதால் ‘எவ்வளவு காலம்’ என்பது இயல்பான தமிழாக்கம்; ‘பார்த்துக்கொண்டிருப்பீர்’ என்பது தலையிடாமல் நோக்கிக்கொண்டிருக்கும் பதற்றத்தைப் பாதுகாக்கிறது.
- source_word: הָשִׁיבָה נַפְשִׁי
  choice: என் உயிரை மீட்டருளும்
  rationale: נֶפֶשׁ இங்கு மனிதனின் முழு உயிரையும் வாழ்வையும் குறிக்கிறது; ‘ஆத்துமா’ என்று மட்டும் மொழிபெயர்ப்பது உடல்–ஆவி பிரிவை தேவையின்றி இறக்குமதி செய்யக்கூடும்.
- source_word: מִשֹּׁאֵיהֶם
  choice: அவர்களுடைய அழிவுச் செயல்களிலிருந்து
  rationale: இந்த வடிவம் பகைவரால் விளையும் அழிவுகள் அல்லது நாசச் செயல்களைச் சுட்டுகிறது. தமிழில் செயற்பாட்டு வன்முறையைத் தெளிவாகவும், மூலத்தின் பன்மை உணர்வை இயன்றவரை பாதுகாத்தும் தருகிறது.
- source_word: מִכְּפִירִים
  choice: இளஞ்சிங்கங்களிடமிருந்து
  rationale: כְּפִירִים என்பதன் நேரடியான உருவகத்தைத் தக்கவைக்கிறது; பகைவர்களைக் குறிக்கும் உருவகத்தை உரையிலேயே விளக்கி விடவில்லை.
- source_word: יְחִידָתִי
  choice: எனக்கிருக்கும் ஒரே உயிரை
  rationale: ‘என் ஒரே ஒன்று’ என்ற சொல்லளவிலான பொருள் இங்கு ஒருவருக்கு உள்ள ஒரே, மாற்றீடற்ற உயிரைக் குறிக்கிறது. இது ‘அருமையான உயிர்’ என்ற சாத்தியமான நுட்பத்தையும் முற்றாக நீக்காமல், மூலத்தின் ‘ஒரே’ என்ற அழுத்தத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: נֶפֶשׁ என்பதன் மனித இயல்பு சார்ந்த பொருள்
  choice: என் உயிரை
  alternative: என் ஆத்துமாவை
  rationale: சங்கீதக்காரர் மரண ஆபத்திலிருந்து தன் வாழ்வை மீட்க வேண்டுகிறார். ‘உயிர்’ என்பது இச்சூழலுக்கு ஏற்றது; பின்னாளைய இருபகுப்பு மனிதவியல் கருத்தை உரைக்குள் கொண்டு வருவதில்லை.
- issue: יְחִידָתִי என்பதன் குறிப்பு
  choice: எனக்கிருக்கும் ஒரே உயிரை
  alternative: என் அருமையான உயிரை
  rationale: ‘ஒரே/ஒப்பற்ற’ என்ற மூலச்சொல்லின் நேரடி அழுத்தத்தைப் பாதுகாத்து, அது உயிரையே மீண்டும் குறிக்கிறது என்பதை தமிழில் தெளிவாக்குகிறது. ‘அருமையான’ என்பது பொருள்விளக்கமாக சாத்தியமானது; ஆனால் அது மூலத்தில் உள்ள ‘ஒரே’ என்ற கூறை மறைக்கலாம்.
translation_notes:
  register: நவீன நிலையான தமிழில், ஜெபத்திற்குரிய மரியாதைமிக்க ஒருமை நடையில் வடிவமைக்கப்பட்டது. கவிதை இணைநிலையைப் பாதுகாக்க ‘மீட்டருளும்’ இருமுறை பயன்படுத்தப்பட்டது. உருவகமான ‘இளஞ்சிங்கங்கள்’ அப்படியே வைக்கப்பட்டது; மதப்பிரிவு சார்ந்த சொற்கள் தவிர்க்கப்பட்டன.
