  yaml_path: translation/ot/psalms/035/000.yaml
  text: Of David[a]. Contend, Yahweh, with those who contend with me[b]; fight against those who fight against me.
translation:
  language: ta
  text: 'தாவீதுக்குரியது.


    ஆண்டவரே,[a] என்னோடு வழக்காடுகிறவர்களோடு வழக்காடும்; என்னோடு போரிடுகிறவர்களோடு போரிடும்.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் இங்கு கடவுளின் தனிப்பெயரான ‘யாவே’ உள்ளது.
    reason: alternative_reading
  - marker: b
    text: ‘வழக்காடு’ என்பதற்கான எபிரெய வினைச்சொல் சட்டரீதியாக ‘எனக்காக வழக்காடு’ என்ற பொருளையும், பொதுவாக ‘எதிர்த்து வாதிடு’ என்ற பொருளையும் தரலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: தாவீதின் பாடல்
  rationale: சங்கீதத் தலைப்பில் உள்ள தொடர்பைக் குறிக்கும் לְ இயல்பாக ‘தாவீதுக்குரியது/தாவீதின்’ என அமைகிறது; தமிழில் தலைப்பாகத் தெளிவாக இருக்க ‘பாடல்’ சேர்க்கப்பட்டது.
- source_word: רִיבָה ... אֶת־יְרִיבַי
  choice: என்னோடு வழக்காடுகிறவர்களோடு வழக்காடும்
  rationale: ריב என்பதன் சட்டவழக்கு சார்ந்த பொருளையும் மூலத்தின் சொல் மறுபயன்பாட்டையும் காக்கிறது; இது பொதுவான ‘எதிர்த்து வாதிடு/போராடு’ என்ற பரந்த பொருளையும் உள்ளடக்கலாம்.
- source_word: לְחַם אֶת־לֹחֲמָי
  choice: என்னோடு போரிடுகிறவர்களோடு போரிடும்
  rationale: לחם வேரின் மறுபயன்பாட்டையும் இரண்டாம் இணைவரியின் நேரடியான போராட்டப் படிமத்தையும் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: ஆண்டவரே
  rationale: தெய்வீகப் பெயரைத் தமிழில் மரியாதையான, வாசகர்களுக்குப் பரிச்சயமான அழைப்புமுறையாக வழங்குகிறது; பெயரின் வடிவம் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
theological_decisions:
- issue: ריב என்பதன் சட்டவழக்கு அல்லது பொதுவான மோதல் பொருள்
  choice: முதன்மை உரையில் ‘வழக்காடு’
  alternative: ‘எதிர்த்து வாதிடு’ அல்லது ‘போராடு’
  rationale: அடுத்த இணைவரி நேரடியாகப் போரைக் கூறுவதால், முதல் வரியின் நீதிமன்றச் சாயலை வைத்திருப்பது எபிரெயக் கவிதையின் அர்த்தச் செறிவையும் படிநிலையையும் காக்கிறது.
- issue: தெய்வீகப் பெயர் יהוה
  choice: ‘ஆண்டவர்’
  alternative: ‘யாவே’
  rationale: தமிழ் வேதாகம நடையில் இயல்பான வடிவத்தைப் பயன்படுத்தியபோதும், மூலத்தில் தனிப்பெயர் இருப்பதை அடிக்குறிப்பு வெளிப்படையாகக் குறிப்பிடுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், வேண்டுதல் தொனியையும் எபிரெய இணைவரிகளின் சொல் மறுபயன்பாட்டையும் காக்கும் கண்ணியமான நடை. அடிக்குறிப்பு குறிகள் அனைத்தும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
