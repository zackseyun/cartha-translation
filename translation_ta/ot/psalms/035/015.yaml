source:
  edition: WLC
  text: וּ/בְ/צַלְעִ/י֮ שָׂמְח֪וּ וְֽ/נֶאֱ֫סָ֥פוּ נֶאֶסְפ֬וּ עָלַ֣/י נֵ֭כִים וְ/לֹ֣א יָדַ֑עְתִּי קָֽרְע֥וּ וְ/לֹא דָֽמּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/015.yaml
  text: But at my stumbling they rejoiced and gathered together[a]; they gathered against me—strangers whom I did not know[d][c][b]. They tore at me and did not stop.
translation:
  language: ta
  text: ஆனால் நான் தடுமாறியபோது அவர்கள் மகிழ்ந்து ஒன்றுகூடினார்கள்[a]; எனக்கு எதிராக அடிப்பவர்கள் ஒன்றுகூடினார்கள்; அது எனக்குத் தெரியவில்லை[b]. அவர்கள் என்னைக் கிழித்தார்கள்; ஓயவே இல்லை[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நான் நொண்டியபோது’ அல்லது ‘என் பலவீனத்தில்.’ எபிரெயச் சொல் உடல் ஊனத்தையோ, விரிவான பொருளில் தடுமாற்றம் அல்லது வீழ்ச்சியின் நேரத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘அடிப்பவர்கள்’ என்று மொழிபெயர்க்கப்பட்டுள்ள எபிரெயச் சொல் அரிதானதும் பொருள் உறுதியற்றதுமாகும்; அது ‘தாக்குபவர்கள்’ என்றோ, ‘துன்புற்றவர்கள்/ஊனமுற்றவர்கள்’ என்றோ பொருள்படலாம். கடைசிப் பகுதியை, ‘நான் அறியாத அடிப்பவர்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_and_syntactic_alternative
  - marker: c
    text: கடுஞ்சொற்களால் தாக்குவதுதான் இங்குள்ள உருவகம் என்றால், ‘அவர்கள் கிழித்தார்கள்; மௌனமாயிருக்கவில்லை’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְצַלְעִי
  choice: நான் தடுமாறியபோது
  rationale: צלע என்பதன் பெயர்ச்சொல் வடிவம் நொண்டுதல், தடுமாறுதல் அல்லது பலவீனமடைதல் ஆகிய நுணுக்கங்களைக் கொண்டிருக்கலாம். பகைவர்கள் சங்கீதக்காரனின் வீழ்ச்சியில் மகிழும் சூழலில், ‘நான் தடுமாறியபோது’ என்பது இயல்பான தமிழில் உடல் மற்றும் உருவகப் பொருள் இரண்டிற்கும் இடமளிக்கிறது.
- source_word: שָׂמְחוּ
  choice: மகிழ்ந்து
  rationale: שמח என்பதற்கான வழக்கமான பொருளைத் தருகிறது; இங்கு அது பகைவர்களின் தீய மகிழ்ச்சியைக் குறிக்கிறது.
- source_word: וְנֶאֱסָפוּ / נֶאֶסְפוּ
  choice: ஒன்றுகூடினார்கள்; ... ஒன்றுகூடினார்கள்
  rationale: எபிரெயத்தில் אסף வினைச்சொல் வலியுறுத்தும் விதமாக இருமுறை வருகிறது; தமிழிலும் அந்த மறுபடிச் சொல்லல் காக்கப்பட்டுள்ளது.
- source_word: עָלַי
  choice: எனக்கு எதிராக
  rationale: சொல்லுக்குச் சொல் ‘என்மேல்’ என்றாலும், பகைமையான சூழலில் ‘எனக்கு எதிராக’ என்பது பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: נֵכִים
  choice: அடிப்பவர்கள்
  rationale: இந்த அரிய சொல்லின் பொருள் உறுதியற்றது. தாக்குதல் அல்லது அடித்தலைக் குறிக்கும் வேரோடு இதை இணைக்கும் வாசிப்பு உடனடியான சூழலுக்கு ஏற்றதால் முதன்மை உரையில் எடுத்துக்கொள்ளப்பட்டது; மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: וְלֹא יָדַעְתִּי
  choice: அது எனக்குத் தெரியவில்லை
  rationale: அவர்கள் ஒன்றுகூடியதைச் சங்கீதக்காரன் அறியாமல் இருந்தான் என்ற வாசிப்பை இது இயல்பான தமிழில் தருகிறது. இதை முந்தைய பெயர்ச்சொல்லை விளக்கும் உறவுச் சொற்றொடராக வாசிக்கும் வாய்ப்பும் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: קָרְעוּ
  choice: அவர்கள் என்னைக் கிழித்தார்கள்
  rationale: קרע என்பதன் அடிப்படைப் பொருள் ‘கிழித்தல்’ அல்லது ‘பிய்த்தல்.’ எபிரெயத்தில் செயப்படுபொருள் வெளிப்படையாக இல்லாவிட்டாலும், சூழலில் தாக்குதலுக்குள்ளானவர் சங்கீதக்காரனே என்பதால் தமிழில் ‘என்னை’ சேர்க்கப்பட்டுள்ளது; இது உடல் தாக்குதலையா கடுஞ்சொல் தாக்குதலையா என்று தீர்மானிக்கவில்லை.
- source_word: וְלֹא דָמּוּ
  choice: ஓயவே இல்லை
  rationale: דמם என்பது ‘மௌனமாயிருத்தல்’ அல்லது ‘ஓய்தல்’ என்று பொருள்படலாம். இடைவிடாத தாக்குதலைக் காட்ட ‘ஓயவே இல்லை’ இயல்பானது; ‘மௌனமாயிருக்கவில்லை’ என்ற மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
