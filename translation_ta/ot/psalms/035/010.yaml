  text: כָּ֥ל עַצְמוֹתַ֨/י תֹּאמַרְנָה֮ יְהוָ֗ה מִ֥י כָ֫מ֥וֹ/ךָ מַצִּ֣יל עָ֭נִי מֵ/חָזָ֣ק מִמֶּ֑/נּוּ וְ/עָנִ֥י וְ֝/אֶבְי֗וֹן מִ/גֹּזְלֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/010.yaml
  text: All my bones will say, “O LORD, who is like you, delivering the poor from one stronger than he, and the poor and needy from the one who robs him?”
translation:
  language: ta
  text: 'என் எலும்புகள் அனைத்தும் சொல்லும்: “ஆண்டவரே, உம்மைப் போன்றவர் யார்? ஏழையை அவனைவிட வலியவனிடமிருந்தும், ஏழையையும் வறியவனையும் அவனைக் கொள்ளையிடுபவனிடமிருந்தும் விடுவிக்கிறவர் நீரே.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל עַצְמוֹתַי
  choice: என் எலும்புகள் அனைத்தும்
  rationale: உடலின் முழுமையையும் உள்ளத்தின் ஆழமான ஈடுபாட்டையும் வெளிப்படுத்தும் எபிரெய உருவகத்தை மாற்றாமல் இயல்பான தமிழில் வைத்துள்ளது.
- source_word: עָנִי
  choice: ஏழை
  rationale: இச்சூழலில் வலிமைமிக்கவனால் ஒடுக்கப்பட்டு உதவியற்ற நிலையில் உள்ளவரைக் குறிக்கிறது; பொதுவாசகருக்கு நேரடியாகப் புரியும் சொல்லாகும்.
- source_word: אֶבְיוֹן
  choice: வறியவன்
  rationale: עָנִי என்பதோடு இணைந்து தேவையிலும் ஆதரவற்ற நிலையிலும் இருப்பவரைக் குறிப்பதால், இணைச்சொல்லின் வேறுபாட்டை ஓரளவு காக்கிறது.
- source_word: גֹּזְלוֹ
  choice: அவனைக் கொள்ளையிடுபவன்
  rationale: வலுக்கட்டாயமாகப் பறிப்பவன் என்ற மூலச்சொல்லின் செயற்பொருளையும், மூலத்தில் உள்ள ஒருமைச் சுட்டுப்பெயரையும் காக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைபெயரின் மொழிபெயர்ப்பு
  choice: ஆண்டவர்
  alternative: யாவே
  rationale: தமிழ் வேதாகம வாசிப்பில் பரவலாக அறியப்படும் மரியாதைமிக்க பிரதிநிதிப்பைத் தேர்ந்தெடுக்கிறது; மூலத்தில் இது இஸ்ரவேலின் உடன்படிக்கைப் பெயர் என்பதை மொழிபெயர்ப்பு நடை மறுப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், சங்கீதத்துக்குரிய கவித்துவ மரியாதையுடன் அமைக்கப்பட்டது. ‘என் எலும்புகள் அனைத்தும் சொல்லும்’ என்ற எபிரெய உருவகம் அப்படியே காக்கப்பட்டுள்ளது; மீளுரையும் சுட்டுப்பெயர் அமைப்பும் இயன்றவரை மூலத்திற்கு நெருக்கமாக வைக்கப்பட்டுள்ளன.
