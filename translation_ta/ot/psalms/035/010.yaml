  source_fidelity: 'மூல எபிரெயத்தின் கூறுகள் துல்லியமாகக் காக்கப்பட்டுள்ளன: “என் எலும்புகள் அனைத்தும்” (כָּל־עַצְמוֹתַי), யெகோவாவை நோக்கிய வினா, வலிமையானவனிடமிருந்து ஏழையை விடுவித்தல், மேலும் ஏழை/வறியவனை அவனைக் கொள்ளையிடுபவனிடமிருந்து விடுவித்தல் ஆகியவை அனைத்தும் இடம்பெற்றுள்ளன. இருமுறை வரும் עָנִי-யின் மீளுரையும் காக்கப்பட்டுள்ளது. “அவனைவிட வலியவன்” என்ற அமைப்பு, வலிமையானவன் ஏழையைவிட வலிமையானவன் என்பதைக் சூழலுக்கேற்பத் தெரிவிக்கிறது.'
  naturalness: நவீனத் தரத் தமிழில் இயல்பாகவும் சங்கீதத்தின் மரியாதைமிக்க கவிதை நடைக்கேற்பவும் உள்ளது. “என் எலும்புகள் அனைத்தும் சொல்லும்” என்பது நேரடியான உடலியல் கூற்று அல்ல; முழு ஆளுமையின் ஆழ்ந்த புகழ்ச்சியைச் சுட்டும் மூல உருவகத்தைத் தக்கவைத்த நல்ல நடை.
