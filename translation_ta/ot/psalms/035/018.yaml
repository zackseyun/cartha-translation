lexical_decisions:
- source_word: א֭וֹדְךָ
  choice: உமக்கு நன்றி செலுத்துவேன்
  rationale: ידה என்பதன் ஹிஃபில் வடிவம் வழிபாட்டுச் சூழலில் நன்றி செலுத்துதல் அல்லது துதித்தல் என்று பொருள்படும். அடுத்த அரையடியில் הלל என்பதற்கு ‘புகழ்வேன்’ என்று மொழிபெயர்க்கப்படுவதால், இரு வினைச்சொற்களுக்கிடையிலான வேறுபாட்டைக் காக்க இங்கு ‘நன்றி செலுத்துவேன்’ எனத் தரப்பட்டுள்ளது.
- source_word: בְּקָהָל רָב
  choice: பெரும் சபையில்
  rationale: קָהָל என்பது ஒன்றுகூடிய சபையையோ மக்கள் கூட்டத்தையோ குறிக்கிறது; רָב இங்கு அதன் பெருமையையோ எண்ணிக்கையையோ சுட்டுகிறது. ‘பெரும் சபை’ என்பது பொதுமக்கள் முன்னிலையிலான துதியை இயல்பாகவும் சுருக்கமாகவும் வெளிப்படுத்துகிறது.
- source_word: בְּעַם עָצוּם
  choice: வலிமைமிக்க மக்களிடையே
  rationale: עַם என்பது ‘மக்கள்’; עָצוּם என்பது வலிமையையோ பெரும் எண்ணிக்கையையோ குறிக்கக்கூடும். முதன்மை உரையில் ‘வலிமைமிக்க’ என அதன் நேரடியான பொருள் தரப்பட்டு, எண்ணிக்கை சார்ந்த பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: אֲהַלְלֶךָּ
  choice: உம்மைப் புகழ்வேன்
  rationale: הלל என்பதன் பியேல் வடிவம் பொதுவாகப் புகழ்தல் அல்லது துதித்தல் என்று பொருள்படும். ‘புகழ்வேன்’ என்பது நேரடியான, இயல்பான தமிழாக்கமாகவும் முதல் அரையடியின் ‘நன்றி செலுத்துவேன்’ என்பதிலிருந்து வேறுபட்டதாகவும் உள்ளது.
