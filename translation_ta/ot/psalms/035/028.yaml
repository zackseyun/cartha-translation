  yaml_path: translation/ot/psalms/035/028.yaml
  text: And my tongue will meditate on your righteousness[d][c][b][a], and on your praise all day long.
translation:
  language: ta
  text: என் நாவும் உமது நீதியையும்[a], நாள் முழுவதும் உமது புகழையும் உரைத்துக்கொண்டிருக்கும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உமது நியாயத்தையும்.” இங்கு வரும் எபிரெயச் சொல் நீதித்தன்மையையும் நியாயம் வழங்குவதையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “தியானித்துக்கொண்டிருக்கும்.” எபிரெய வினை முணுமுணுத்தல், உரைத்தல் அல்லது தியானித்தல் ஆகியவற்றைக் குறிக்கலாம்; இங்கு “நாவு” எழுவாயாக இருப்பதால் வாய்மொழியாக உரைத்தல் பொருத்தமாகத் தெரிகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְשׁוֹנִי
  choice: என் நாவு
  rationale: ו இணைப்புச்சொல் முந்தைய வசனத்துடனான தொடர்பைக் காட்டுகிறது; தமிழில் வசனத் தொடரில் இயல்பாக அமையும் என்பதால் தனியாக மொழிபெயர்க்கப்படவில்லை. ‘என் நாவு’ என்பது பேச்சைக் குறிக்கும் எபிரெய உருவகத்தைப் பாதுகாக்கிறது.
- source_word: תֶּהְגֶּה
  choice: உரைத்துக்கொண்டிருக்கும்
  rationale: הגה என்பது முணுமுணுத்தல், தியானித்தல், உச்சரித்தல் ஆகிய பொருள்களைக் கொள்ளலாம். இங்கு ‘நாவு’ எழுவாயாக இருப்பதால் வாய்மொழியாக வெளிப்படுத்துதல் முதன்மையாகத் தெரிகிறது; தொடர்ச்சியான செயலைத் தமிழின் ‘-க்கொண்டிருக்கும்’ வடிவம் வெளிப்படுத்துகிறது.
- source_word: צִדְקֶךָ
  choice: உமது நீதி
  rationale: צדק என்பது நேர்மை, நீதித்தன்மை, நியாயம் ஆகிய பரப்பைக் கொண்டது. சங்கீதக்காரருக்கு கடவுள் வழங்கும் நியாயத்தீர்ப்பும் விடுவிப்பும் சூழலில் இருப்பதால் ‘நீதி’ அந்தப் பொருள் அகலத்தை இயல்பாகத் தக்கவைக்கிறது.
- source_word: כָּל הַיּוֹם
  choice: நாள் முழுவதும்
  rationale: நாள் முழுவதும் தொடர்வதைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொற்றொடர்.
- source_word: תְּהִלָּתֶךָ
  choice: உமது புகழ்
  rationale: תְּהִלָּה என்பது கடவுளுக்குச் செலுத்தப்படும் புகழையும் அவருக்குரிய புகழையும் குறிக்கலாம். ‘உமது புகழ்’ என்ற வடிவம் அந்த இரு நுண்பொருள்களையும் திறந்தவையாக வைத்திருக்கிறது.
theological_decisions:
- issue: 'צִדְקֶךָ என்பதன் பொருள்: கடவுளின் நீதித்தன்மையா அல்லது அவர் வழங்கும் நியாயமா'
  choice: உமது நீதி
  alternative: உமது நியாயம்
  rationale: ‘நீதி’ என்பது கடவுளின் நேர்மையான இயல்பையும் சங்கீதக்காரரை நியாயப்படுத்தும் அவரது நீதிச் செயலையும் உள்ளடக்கக் கூடியது; சூழலை ஒரே பொருளுக்குள் சுருக்காமல் பாதுகாக்கிறது.
- issue: תֶּהְגֶּה என்பது உள்ளார்ந்த தியானமா அல்லது வாய்மொழி உரைத்தலா
  choice: உரைத்துக்கொண்டிருக்கும்
  alternative: தியானித்துக்கொண்டிருக்கும்
  rationale: ‘நாவு’ எழுவாயாக இருப்பது கேட்கக்கூடிய வாய்மொழி வெளிப்பாட்டை வலியுறுத்துகிறது. எனினும் வினையின் தியானம் சார்ந்த நுண்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘உமது’ என்பது மரியாதையையும் சங்கீதத்தின் நேரடி இறைமுகப்பையும் காக்கிறது. எபிரெய இணைநிலையைத் தக்கவைக்க ‘நீதி’ மற்றும் ‘புகழ்’ இரண்டும் ஒரே வினையின் பொருட்களாக அமைக்கப்பட்டுள்ளன.
