    text: அல்லது, ‘பொய்ச் சாட்சிகள்’ அல்லது ‘தீய நோக்கமுள்ள சாட்சிகள்’; எபிரெயத்தில் நேர்ப்பொருள், ‘வன்முறையின் சாட்சிகள்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יְקוּמוּן
  choice: எழும்புகிறார்கள்
  rationale: קום என்ற வினைச்சொல் இங்கு பகைமையுடன் சாட்சிகள் முன்வந்து நிற்பதைச் சித்தரிக்கிறது. ‘எழும்புகிறார்கள்’ என்பது அந்த உயிரோட்டமான சட்டரீதியான எதிர்ப்புணர்வைப் பேணுகிறது.
- source_word: עֵדֵי חָמָס
  choice: கொடுமை செய்யும் சாட்சிகள்
  rationale: எபிரெயச் சொற்றொடரின் நேர்ப்பொருள் ‘வன்முறையின்/கொடுமையின் சாட்சிகள்.’ חָמָס என்பது வன்முறை, கொடுமை, அநீதி, தீங்கு ஆகிய பொருட்களைக் கொண்டது. தமிழில் ‘வன்முறையின் சாட்சிகள்’ என்பது வன்முறையைக் கண்ட சாட்சிகள் எனத் தவறாகப் புரியக்கூடும்; ஆகவே தீங்கு விளைவிக்கும் அவர்களுடைய சாட்சியத்தைக் குறிக்க ‘கொடுமை செய்யும் சாட்சிகள்’ எனத் தரப்பட்டுள்ளது, மாற்றுப் பொருள்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: אֲשֶׁר לֹא יָדַעְתִּי
  choice: எனக்குத் தெரியாதவற்றைக் குறித்து
  rationale: எபிரெயத்தில் வெளிப்படையான செயப்படுபொருள் இல்லை. இயல்பான தமிழுக்காக ‘வற்றை’ என்பது குறைந்த அளவில் சேர்க்கப்பட்டு, குற்றச்சாட்டுக்குரிய காரியங்களைத் தான் அறியவில்லை என்ற சங்கீதக்காரரின் கூற்று பேணப்படுகிறது.
- source_word: יִשְׁאָלוּנִי
  choice: அவர்கள் என்னிடம் கேள்வி கேட்கிறார்கள்
  rationale: שׁאל என்பதற்கு கேட்பது, விசாரிப்பது அல்லது கோருவது என்று பொருள் வரலாம். பகைமையான விசாரணைச் சூழலை உணர்த்தினாலும், மூல வினையின் வலிமையை மிகைப்படுத்தாமல் ‘கேள்வி கேட்கிறார்கள்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
