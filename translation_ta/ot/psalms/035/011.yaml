  text: Violent witnesses rise up[a]; they ask me about things I do not know.
translation:
  language: ta
  text: கொடுமை செய்யும் சாட்சிகள் எழும்புகிறார்கள்[a]; எனக்குத் தெரியாதவற்றைக் குறித்து அவர்கள் என்னிடம் கேள்வி கேட்கிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
