theological_decisions:
- issue: எதிரிகள்மீது வெட்கமும் அவமானமும் வர வேண்டும் என்ற வேண்டுதல்
  choice: மூலத்தில் உள்ள விருப்பவினை அல்லது மன்றாட்டு வலிமையை ‘-வார்களாக’ என்று நேரடியாகப் பாதுகாத்தல்
  alternative: இது நிகழும் என்ற சாதாரண எதிர்காலக் கூற்றாக மொழிபெயர்த்தல்
  rationale: எபிரெய வினை வடிவங்களும் சங்கீதத்தின் சூழலும் இது வெறும் முன்னறிவிப்பு அல்ல, நீதிக்கான தீவிர வேண்டுதல் என்பதை ஆதரிக்கின்றன; அதன் இறையியல் பதற்றத்தை மென்மைப்படுத்தவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்கு விளங்கும் கண்ணியமான வேண்டுதல் நடையைப் பயன்படுத்துகிறது. ‘ஆடையாக அணிதல்’ என்ற மூல உருவகமும், எதிரிகளுக்கான மன்றாட்டின் தீவிரமும் பாதுகாக்கப்பட்டுள்ளன.
