  yaml_path: translation/ot/psalms/035/026.yaml
  text: Let those who rejoice at my harm be put to shame and humiliated together[a]; let those who magnify themselves against me be clothed with shame and disgrace.
translation:
  language: ta
  text: எனக்கு நேரும் தீங்கைக் கண்டு மகிழ்கிறவர்கள் அனைவரும் ஒன்றாக வெட்கப்பட்டு அவமானம் அடைவார்களாக; எனக்கு எதிராகத் தங்களை உயர்த்துகிறவர்கள்[a] வெட்கத்தையும் மானக்கேட்டையும் ஆடையாக அணிவார்களாக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எனக்குமேல் தங்களைப் பெரியவர்களாக்குகிறவர்கள்”; அல்லது, “எனக்கு எதிராகப் பெருமை பேசுகிறவர்கள்.” எபிரெயச் சொற்றொடர் ஒருவருக்குமேல் தன்னைப் பெரியவனாக்கிக்கொள்வதைச் சொல்கிறது.
    reason: lexical_alternative
lexical_decisions:
