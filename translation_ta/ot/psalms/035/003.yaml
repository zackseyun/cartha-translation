id: PSA.35.3
reference: Psalms 35:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/הָ֘רֵ֤ק חֲנִ֣ית וּ֭/סְגֹר לִ/קְרַ֣את רֹדְפָ֑/י אֱמֹ֥ר לְ֝/נַפְשִׁ֗/י יְֽשֻׁעָתֵ֥/ךְ אָֽנִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/003.yaml
  text: Draw the spear and block the way against those who pursue me[a]; say to my soul[b], “I am your salvation.”
translation:
  language: ta
  text: ஈட்டியை உருவி, என்னைத் துரத்துகிறவர்களின் வழியை அடைத்திடும்[a]; என் ஆன்மாவிடம், “நானே உன் மீட்பு” என்று சொல்லும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, וּסְגֹר என்பதை ‘வழியை அடை’ என்ற வினைச்சொல்லாக அல்லாமல் ஓர் ஆயுதத்தின் பெயராக எடுத்தால், “ஈட்டியையும் போர்க்கோடரியையும் உருவி, என்னைத் துரத்துகிறவர்களை எதிர்கொள்ளும்.”
    reason: alternative_reading
  - marker: b
    text: “மீட்பு” என்பதற்குப் பதிலாக “இரட்சிப்பு” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் குறிப்பிட்ட ஓர் ஆபத்திலிருந்து காப்பாற்றப்படுவதையும், விரிந்த பொருளில் இரட்சிப்பையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָרֵק
  choice: உருவி
  rationale: ஹிஃபில் கட்டளை வடிவம் ஆயுதத்தை வெளியே எடுப்பதைக் குறிக்கிறது; ‘உருவி’ என்பது போர்ச் சூழலில் இயல்பான, சுருக்கமான தமிழ்.
- source_word: חֲנִית
  choice: ஈட்டியை
  rationale: חֲנִית என்பதற்கான வழக்கமான தமிழ்ச் சொல் ‘ஈட்டி’; செயப்படுபொருள் வேற்றுமையுடன் வழங்கப்பட்டது.
- source_word: וּסְגֹר
  choice: வழியை அடைத்திடும்
  rationale: அடிப்படையில் ‘மூடு/அடை’ என்று பொருள். துரத்துகிறவர்களை எதிர்கொள்ளும் சூழலில் மறைந்துள்ள செயப்படுபொருளான ‘வழி’ இயல்பான தமிழுக்காக வெளிப்படுத்தப்பட்டது; ஆயுதப் பெயராகப் புரிந்துகொள்ளும் மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- source_word: לִקְרַאת רֹדְפָי
  choice: என்னைத் துரத்துகிறவர்களின் வழியை
  rationale: לִקְרַאת என்பது எதிர்கொண்டு செல்வதையோ எதிராக நிற்பதையோ குறிக்கலாம்; தமிழில் வழியை அடைப்பது என்ற சொல்லமைப்பு பகைமைச் சூழலைத் தெளிவாகக் காட்டுகிறது. רֹדְפָי தொடரும் செயலைக் குறிக்கும் வகையில் ‘என்னைத் துரத்துகிறவர்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: אֱמֹר
  choice: சொல்லும்
  rationale: எளிய கட்டளையை நேரடியாகத் தருகிறது; சங்கீத வேண்டுதலுக்கேற்ற மரியாதைமிக்க கட்டளை வடிவம்.
- source_word: לְנַפְשִׁי
  choice: என் ஆன்மாவிடம்
  rationale: נֶפֶשׁ என்பது உயிர், தன்னிலை, ஆன்மா ஆகிய பொருள்களை உடையது. கவிதைமிக்க உள்ளார்ந்த உரையாடலைத் தட்டையாக்காமல் ‘ஆன்மா’ எனப் பாதுகாக்கப்பட்டது.
- source_word: יְשֻׁעָתֵךְ
  choice: உன் மீட்பு
  rationale: உடனடியான ஆபத்திலிருந்து விடுவிப்பதையும் விரிந்த இரட்சிப்பு கருத்தையும் குறிக்கக்கூடிய சொல். இச்சூழலில் இயல்பான ‘மீட்பு’ தேர்ந்தெடுக்கப்பட்டது; ‘இரட்சிப்பு’ மாற்றாக அடிக்குறிப்பில் தரப்பட்டது.
- source_word: אָנִי
  choice: நானே
  rationale: தனிப்பட்ட சுட்டுப்பெயரின் வலியுறுத்தலைத் தமிழின் ‘-ஏ’ விகுதி இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: மீட்புக்கான வேண்டுதலில் יְשׁוּעָה என்பதன் பொருள்
  choice: மீட்பு
  alternative: இரட்சிப்பு
  rationale: உடனடிச் சூழல் பகைவர்களிடமிருந்து காப்பாற்றப்படுவதைக் குறிக்கிறது; ஆகவே ‘மீட்பு’ இயல்பாக உள்ளது. அதே நேரம் எபிரெயச் சொல்லின் விரிந்த இறையியல் பரப்பை மறைக்காமல் ‘இரட்சிப்பு’ அடிக்குறிப்பில் வழங்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; கவிதைமிக்க, மரியாதைமிக்க நடை. ‘சொல்லும்’, ‘அடைத்திடும்’ ஆகிய வடிவங்கள் சங்கீத வேண்டுதலின் உயர்ந்த தொனியைத் தக்கவைக்கின்றன; அரிதான அல்லது சமயப் பிரிவுக்கே உரிய சொற்கள் தவிர்க்கப்பட்டுள்ளன.
