  text: For without cause they hid their net's pit for me[d][c][b][a]; without cause they dug it for my life.
translation:
  language: ta
  text: ஏனெனில், காரணமின்றி அவர்கள் எனக்கு எதிராகத் தங்கள் வலைக்கான குழியை மறைத்து வைத்தார்கள்[a]; காரணமின்றி என் உயிருக்கெதிராக அதைத் தோண்டினார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள் தங்கள் வலையுடன் ஒரு குழியை எனக்கு எதிராக மறைத்து வைத்தார்கள்”; “குழி,” “அவர்களுடைய வலை” என்ற எபிரெயச் சொற்கள் நெருக்கமாக இணைந்துள்ளன; அவற்றுக்கிடையேயான துல்லியமான உறவை ஒன்றுக்கு மேற்பட்ட விதங்களில் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: “என் உயிர்” என்பது எபிரெயத்தில் “என் நெஃபெஷ்”; இங்கு அது சங்கீதக்காரரையே அல்லது அவரது உயிரையே குறிக்கிறது; பிற்கால இறையியல் வழக்கிலுள்ள குறுகிய பொருளில் “ஆத்துமா” என்பதை அவசியமாகக் குறிக்கவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: சுற்றியுள்ள வேண்டுதலுக்கான காரணத்தை அறிமுகப்படுத்தும் எபிரெய இணைப்புச் சொல்லின் காரணப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: חִנָּם
  choice: காரணமின்றி
  rationale: நியாயமான காரணம் ஏதுமின்றி தீங்கு செய்வதைக் குறிக்கிறது; எபிரெயத்தில் இருமுறை வருவதால் தமிழிலும் இருமுறை வைக்கப்பட்டுள்ளது.
- source_word: טָמְנוּ
  choice: மறைத்து வைத்தார்கள்
  rationale: பொறியைப் பிறர் காணாதபடி மறைத்து வைக்கும் வேட்டைப் படிமத்தை இயல்பாகத் தெரிவிக்கிறது.
- source_word: לִי
  choice: என்னைப் பிடிக்க
  rationale: முதலாம் நபரைக் குறிவைக்கும் தீங்கான நோக்கத்தைத் தமிழில் தெளிவாகக் காட்டுகிறது; சொற்படி ‘எனக்காக’ என்பது தமிழில் நன்மைப் பொருளாகத் தவறாகப் புரியக்கூடும்.
- source_word: שַׁחַת רִשְׁתָּם
  choice: தங்கள் வலைக்கான குழி
  rationale: ‘குழி’ மற்றும் ‘அவர்களுடைய வலை’ ஆகிய இரு படிமங்களையும் காக்கிறது; அவற்றுக்கிடையேயான துல்லியமான உறவு எபிரெயத்தில் தெளிவற்றதால் அடிக்குறிப்பில் மாற்று வாசிப்புகள் தரப்பட்டுள்ளன.
- source_word: חָפְרוּ
  choice: குழி தோண்டினார்கள்
  rationale: வினையின் நேரடியான தோண்டும் பொருளையும் முதல் அரையடியின் பொறிக்குழிப் படிமத்தையும் காக்கிறது.
- source_word: לְנַפְשִׁי
  choice: என் உயிரைப் பறிக்க
  rationale: נֶפֶשׁ இங்கு உடலிலிருந்து பிரிந்த ‘ஆத்துமா’ என்ற குறுகிய பிற்காலப் பொருளைக் காட்டாமல், சங்கீதக்காரரின் உயிரையும் அவரையே குறிக்கிறது.
theological_decisions:
- issue: נֶפֶשׁ என்பதன் பொருள்
  choice: என் உயிர்
  alternative: என் ஆத்துமா
  rationale: இச்சூழலில் உயிருக்கு நேரும் ஆபத்தே கருத்து; மனிதனின் உடலற்ற ஓர் அங்கத்தைப் பற்றிய குறிப்பாக இதைத் தீர்மானிக்கக் கூடாது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. வேட்டைப் பொறியின் தெளிவான படிமம் காக்கப்பட்டு, எபிரெயச் சொற்றொடரின் உண்மையான கட்டமைப்புத் தெளிவின்மை அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
