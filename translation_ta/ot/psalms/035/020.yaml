translation_notes:
  register: நவீனத் தரத் தமிழில், சங்கீதத்திற்கேற்ற கண்ணியமான ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் நடை. எபிரெய மொழியின் ‘சமாதானத்தைப் பேசுதல்’ என்ற நேரடி உருவகம் பாதுகாக்கப்பட்டுள்ளது; அரிதான רִגְעֵי אֶרֶץ இயல்பான தமிழில் தரப்பட்டு மாற்று வாசிப்புகள் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளன.
