- from: ஏனெனில், அவர்கள் சமாதானத்தைப் பேசுவதில்லை; நாட்டில் அமைதியாக வாழ்கிறவர்களுக்கு எதிராக வஞ்சகமான சொற்களைத் திட்டமிடுகிறார்கள்.[a]
  to: ஏனெனில், அவர்கள் சமாதானத்தைப் பேசுவதில்லை; நாட்டில் அமைதியாக வாழ்கிறவர்களுக்கு எதிராக வஞ்சகமான சொற்களை வகுக்கிறார்கள்.[a]
