source:
  edition: WLC
  text: כִּ֤י לֹ֥א שָׁל֗וֹם יְדַ֫בֵּ֥רוּ וְ/עַ֥ל רִגְעֵי אֶ֑רֶץ דִּבְרֵ֥י מִ֝רְמוֹת יַחֲשֹׁבֽוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/020.yaml
  text: For they do not speak peace[a], but against the quiet ones of the land they devise deceitful words.
translation:
  language: ta
  text: ஏனெனில், அவர்கள் சமாதானத்தைப் பேசுவதில்லை; நாட்டில் அமைதியாக வாழ்கிறவர்களுக்கு எதிராக வஞ்சகமான சொற்களை வகுக்கிறார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நாட்டில் சமாதானமாக வாழ்கிறவர்களுக்கு” அல்லது “நாட்டில் இளைப்பாறுகிறவர்களுக்கு.” இங்கு வரும் எபிரெயச் சொற்றொடர் அமைதியாகவும் சமாதானமாகவும் வாழும் மக்களைக் குறிப்பதாகத் தெரிகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய வேண்டுகோள் அல்லது முறையீட்டிற்கான காரணத்தை அறிமுகப்படுத்துகிறது; தமிழ் உரையோட்டத்தில் காரணத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לֹא שָׁלוֹם יְדַבֵּרוּ
  choice: அவர்கள் சமாதானத்தைப் பேசுவதில்லை
  rationale: שָׁלוֹם என்பதை வினையடையாக மாற்றாமல் வினையின் நேரடிப் பொருளாக வைத்திருப்பதால், அவர்களுடைய பேச்சு சமாதானம் அல்லது ஒப்புரவை நோக்கியதல்ல என்ற எபிரெய அமைப்பு பாதுகாக்கப்படுகிறது.
- source_word: שָׁלוֹם
  choice: சமாதானம்
  rationale: அமைதி, நலநிலை, முழுமை ஆகிய விரிந்த பொருள் நிழல்களை உடைய சொல்லுக்கு இச்சூழலில் இயல்பான முதன்மைத் தேர்வு.
- source_word: וְעַל
  choice: ஆனால் ... எதிராக
  rationale: அவர்கள் சமாதானத்தைப் பேசாததற்கும் அவர்கள் உண்மையில் செய்வதற்கும் இடையிலான எதிர்மறை முரணைத் தெளிவுபடுத்துகிறது.
- source_word: רִגְעֵי אֶרֶץ
  choice: நாட்டில் அமைதியாக வாழ்கிறவர்கள்
  rationale: இலக்கண வடிவமும் சூழலும் நாட்டில் சச்சரவின்றி அமைதியாக வாழும் மக்களைச் சுட்டுவதாகத் தோன்றுகிறது; தெளிவற்ற பழமொழித் தொடர் இயல்பான தமிழில் பொருள் மிகைப்படுத்தாமல் வழங்கப்படுகிறது.
- source_word: דִּבְרֵי מִרְמוֹת
  choice: வஞ்சகமான சொற்கள்
  rationale: பொய்யும் தீய நோக்கமுள்ள ஏமாற்றுப் பேச்சும் அடங்கிய எபிரெயக் கட்டமைப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יַחֲשֹׁבוּן
  choice: திட்டமிடுகிறார்கள்
  rationale: வெறும் சிந்தனையைக் காட்டிலும் நோக்கத்துடன் வகுக்கும் சூழ்ச்சியை இச்சூழலில் குறிக்கிறது.
