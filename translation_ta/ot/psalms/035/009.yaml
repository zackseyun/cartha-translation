source:
  edition: WLC
  text: וְ֭/נַפְשִׁ/י תָּגִ֣יל בַּ/יהוָ֑ה תָּ֝שִׂישׂ בִּ/ישׁוּעָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/009.yaml
  text: Then my soul will rejoice in Yahweh[b][a]; it will exult in his salvation.
translation:
  language: ta
  text: அப்போது என் உள்ளம் யாவேவில் மகிழும்[a]; அவரது இரட்சிப்பில் களிகூரும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் உள்ளம் யாவேவில் மகிழும்.”
    reason: וְ என்பதை எளிய இணைப்பாக எடுத்துக்கொள்ளும் மாற்று வாசிப்பு.
  - marker: b
    text: அல்லது, “அவரது விடுதலையில் களிகூரும்.”
    reason: יְשׁוּעָה என்பதற்கான சூழல் சார்ந்த சொற்பொருள் மாற்று.
lexical_decisions:
- source_word: וְנַפְשִׁי
  choice: அப்போது என் ஆத்துமா
  rationale: נֶפֶשׁ இங்கு ஒருவரின் உள்ளார்ந்த முழு சுயத்தைக் குறிக்கிறது; கவிதைநடையில் இயல்பான ‘என் ஆத்துமா’ அதைத் தக்கவைக்கிறது. முந்தைய வசனத்தில் எதிர்பார்க்கப்படும் விடுதலையின் விளைவை וְ இணைப்பதால், ‘அப்போது’ என மொழிபெயர்க்கப்பட்டது.
- source_word: תָּגִיל
  choice: மகிழும்
  rationale: גיל என்பதன் மகிழ்ச்சி அடைதல் என்ற பொருளைத் தெளிவான நவீனத் தமிழில் தருகிறது; அடுத்த இணைவரியின் தீவிரமான மகிழ்ச்சிச் சொல்லிலிருந்து வேறுபாடும் காக்கப்படுகிறது.
- source_word: בַּיהוָה
  choice: யாவேவில்
  rationale: בְ இங்கு மகிழ்ச்சியின் பொருள் அல்லது தளத்தைக் குறிக்கிறது. יהוה என்பது பொதுப்பட்டப் பெயராக மாற்றப்படாமல், உடன்படிக்கையின் திருப்பெயராக ‘யாவே’ என்று ஒலிபெயர்க்கப்படுகிறது.
- source_word: תָּשִׂישׂ
  choice: களிகூரும்
  rationale: שׂושׂ/שׂישׂ மிகுந்த, பொங்கும் மகிழ்ச்சியைச் சுட்டுகிறது. ‘களிகூரும்’ என்பது முதல் வரியின் ‘மகிழும்’ என்பதை வெறுமனே மீளுரைக்காமல் கவிதைத் தீவிரத்தைப் பாதுகாக்கிறது.
- source_word: בִּישׁוּעָתוֹ
  choice: அவரது மீட்பில்
  rationale: יְשׁוּעָה இரட்சிப்பு அல்லது விடுதலை/மீட்பு எனப் பொருள்படும். பகைவர்களிடமிருந்து காப்பாற்றப்படுவது பற்றிய இந்தச் சங்கீதச் சூழலில் ‘மீட்பு’ தெளிவாக உள்ளது; בְ-இன் இணை அமைப்பும் ‘-இல்’ மூலம் தக்கவைக்கப்படுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் நான்கு எழுத்துத் திருப்பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டப்பெயராக மாற்றாமல், தமிழில் எளிதில் வாசிக்கக்கூடிய ‘யாவே’ என்று வழங்குவது மூலத்தின் தனிப்பெயர்த் தன்மையைப் பாதுகாக்கிறது.
- issue: יְשׁוּעָה என்பதின் பரப்பு
  choice: மீட்பு
  alternative: இரட்சிப்பு
  rationale: இவ்விடத்தில் பகைவர்களிடமிருந்து கிடைக்கும் செயற்பூர்வமான விடுதலையே உடனடிச் சூழல். இருப்பினும் எபிரேயச் சொல் பரந்த ‘இரட்சிப்பு’ பொருளையும் தாங்குவதால் அந்த மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சங்கீதத்திற்கேற்ற கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆத்துமா’ மூல உருவகத்தைத் தக்கவைக்கிறது; ‘மகிழும் / களிகூரும்’ என்ற இணைச் சொற்கள் எபிரேயக் கவிதையின் ஒத்திசைவையும் தீவிர உயர்வையும் காட்டுகின்றன.
