revisions:
- from: தாவீதின் பாடல். யாவே, என்னோடு வழக்காடுகிறவர்களோடு வழக்காடும்[a]; என்னோடு போரிடுகிறவர்களோடு போரிடும்.
  to: தாவீதுக்குரியது. யாவே, எனக்கு எதிராக வழக்காடுகிறவர்களோடு வழக்காடும்; எனக்கு எதிராகப் போரிடுகிறவர்களோடு போரிடும்.
  rationale: ‘தாவீதின் பாடல்’ என்பதற்குப் பதிலாக, லெ-தாவீது என்ற தலைப்பின் ஆசிரியத்துவம்/தொடர்பு பற்றிய திறந்த பொருளைத் தக்கவைக்கும் ‘தாவீதுக்குரியது’ பயன்படுத்தப்பட்டுள்ளது. இரு எதிரிக் குழுக்களும் சங்கீதக்காரருக்கு எதிராகச் செயல்படுவதைத் தெளிவாக்க ‘எனக்கு எதிராக’ சேர்க்கப்பட்டுள்ளது. அடிக்குறிப்பு ரிபின் சட்ட மற்றும் பொதுமோதல் நுணுக்கங்களைத் தக்கவைக்கிறது.
