source:
  edition: WLC
  text: לְ/דָוִ֨ד רִיבָ֣/ה יְ֭הוָה אֶת יְרִיבַ֑/י לְ֝חַ֗ם אֶת לֹֽחֲמָֽ/י׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/001.yaml
  text: Of David[a]. Contend, O Yahweh, with those who contend with me[b]; fight against those who fight against me.
translation:
  language: ta
  text: தாவீதுக்குரியது. யாவே, எனக்கு எதிராக வழக்காடுகிறவர்களோடு வழக்காடும்; எனக்கு எதிராகப் போரிடுகிறவர்களோடு போரிடும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְדָוִד
  choice: தாவீதின் பாடல்
  rationale: சங்கீதத் தலைப்புகளில் வரும் לְדָוִד என்பது தாவீதோடு தொடர்பையோ அவரது படைப்புரிமையையோ குறிக்கலாம். இயல்பான தமிழ் தலைப்பாக ‘தாவீதின் பாடல்’ அமைகிறது; தொடர்பின் துல்லிய வகையை அளவுக்கு மீறி நிர்ணயிக்கவில்லை.
- source_word: רִיבָה
  choice: வழக்காடும்
  rationale: ריב என்பதன் சட்டவழக்கு சார்ந்த பொருளையும் எதிர்த்து வாதிடுதல் என்ற வலிமையையும் ‘வழக்காடு’ தக்கவைக்கிறது. அதே வேர் அடுத்த சொல்லிலும் வருவதால் தமிழிலும் சொல் மீளுருவாக்கம் பேணப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது ஒரு பட்டமல்ல, இஸ்ரவேலின் தேவனுடைய தனிப்பெயரான நான்கு எழுத்துப் பெயர். தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பாக ‘யாவே’ பயன்படுத்தப்படுகிறது.
- source_word: אֶת יְרִיבַי
  choice: என்னோடு வழக்காடுகிறவர்களோடு
  rationale: முதல் நபர் ஒருமை பின்னொட்டையும் ריב வேரின் செயற்பாட்டு உறவையும் வெளிப்படையாகக் காட்டுகிறது; ‘என் எதிரிகள்’ என்பதைக் காட்டிலும் மூலத்தின் வினைச்சொல் ஒத்திசைவைப் பேணுகிறது.
- source_word: לְחַם
  choice: போரிடும்
  rationale: לחם வேரின் போர்/சண்டை சார்ந்த வலிமையை இயல்பான, dignified நவீன தமிழில் நேரடியாகத் தருகிறது.
- source_word: אֶת לֹחֲמָי
  choice: என்னோடு போரிடுகிறவர்களோடு
  rationale: சங்கீதக்காரருக்கு எதிராகப் போரிடுவோரை உறவுப்பெயர் தொடராக இயல்பாகக் காட்டி, கட்டளைக்கும் பங்கேற்புப் பெயருக்கும் இடையிலான எபிரெய இணைப்பைத் தமிழிலும் பேணுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பட்டமான ‘ஆண்டவர்’ அல்ல, தனிப்பெயரான יהוה நேரடியாக உள்ளது. ஆகவே பட்டத்தால் மாற்றாமல் இறைப்பெயரை ஒலிபெயர்ப்பது மூலத்தின் வடிவத்தையும் உடன்படிக்கைப் பெயரின் தன்மையையும் பேணுகிறது.
- issue: ריב என்பதின் சட்டவழக்கு மற்றும் பொதுவான மோதல் நுணுக்கம்
  choice: வழக்காடும்
  alternative: எனக்காக வாதாடும் / எதிர்த்து மோதும்
  rationale: இந்தச் சூழலில் ரיב சட்டரீதியான வழக்காடுதலையும் பரந்த எதிர்ப்பையும் சுமக்க முடியும். ‘வழக்காடும்’ சட்ட நுணுக்கத்தை முன்னிறுத்துகிறது; சேர்க்கப்படாத ‘என் வழக்கை’ என்ற நேரடி பொருளை முதன்மை உரையில் புகுத்தாமல் மாற்று நுணுக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், வேண்டுதலின் கண்ணியத்தையும் எபிரெய இணை அமைப்பையும் பேணும் நடை. தொடர்ச்சியான கட்டளைகளை இயல்பான தமிழ் வேண்டுகோள் வடிவில் ‘வழக்காடும்’, ‘போரிடும்’ என்று வழங்குகிறது. இறைப்பெயர் பட்டமாக மாற்றப்படாமல் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
