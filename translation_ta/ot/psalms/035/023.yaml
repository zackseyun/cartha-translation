  yaml_path: translation/ot/psalms/035/023.yaml
  text: Awake and rise up for my judgment[a], my God and my Lord[c][b], for my cause.
translation:
  language: ta
  text: என் இறைவனே, என் ஆண்டவரே, எனக்கான நீதித்தீர்ப்புக்காக[a], என் வழக்கிற்காக[b] விழித்தெழுந்து எழுந்தருளும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எனக்கு நீதி கிடைக்கும்படி”; எபிரெயச் சொல் தீர்ப்பு, நீதி அல்லது சட்டரீதியான நியாயநிறுவல் ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “என் வாதத்திற்காக”; எபிரெயச் சொல் சட்டத் தகராறு, வழக்கு அல்லது வாதத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעִירָה
  choice: விழித்தெழுந்து
  rationale: இறைவன் செயலற்றிருப்பதுபோல் தோன்றும் நிலையிலிருந்து தலையிட வேண்டும் என்ற உருவக வேண்டுதலை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְהָקִיצָה
  choice: எழுந்தருளும்
  rationale: முந்தைய விழிப்பு வினையுடன் சேர்ந்து வேண்டுதலின் தீவிரத்தை வலுப்படுத்துகிறது. தமிழில் இறைவனை மரியாதையுடன் நேரடியாக வேண்டுவதற்கு ‘எழுந்தருளும்’ இயல்பாக உள்ளது; இரு எபிரெய வினைகளும் ஒரே சொல்லாகச் சுருங்காமல் வேறுபடுத்தப்பட்டுள்ளன.
- source_word: לְמִשְׁפָּטִי
  choice: எனக்கான நீதித்தீர்ப்புக்காக
  rationale: מִשְׁפָּט என்பதிலுள்ள நீதி, தீர்ப்பு, சட்டரீதியான நியாயநிறுவல் ஆகிய பொருள் பரப்பை நீதிமன்றச் சூழலுக்கு ஏற்ற தமிழில் காட்டுகிறது; ‘என் நீதித்தீர்ப்பு’ என்ற தெளிவற்ற உடைமைத் தொடரைத் தவிர்க்கிறது.
- source_word: אֱלֹהַי
  choice: என் இறைவனே
  rationale: முதல் நபர் உடைமையையும் நேரடி விளியையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: וַאדֹנָי
  choice: என் ஆண்டவரே
  rationale: இறைவனுக்குரிய மரியாதைத் தலைப்பாகிய אֲדֹנָי என்பதை வழக்கமான தமிழில் மொழிபெயர்த்து, இதைத் தனிப்பட்ட பெயராகவோ குறிப்பிட்ட கிறிஸ்தியல் உரிமைகோரலாகவோ மாற்றாமல் காக்கிறது.
- source_word: לְרִיבִי
  choice: என் வழக்கிற்காக
  rationale: רִיב என்பதன் சட்டத் தகராறு, வாதம், வழக்கு என்ற பொருளை இயல்பாகக் காட்டுகிறது; நவீன சட்ட நுட்பச்சொல்லாக அளவுக்கு மீறிக் குறுக்கவில்லை.
theological_decisions:
- issue: אֱלֹהַי וַאדֹנָי என்ற இணைத் தலைப்புகளால் இறைவனை அழைத்தல்
  choice: என் இறைவனே, என் ஆண்டவரே
  alternative: என் கடவுளே, என் எஜமானரே
  rationale: இரண்டு மரியாதைத் தலைப்புகளையும் தனித்தனியாகப் பாதுகாத்து நேரடி மன்றாட்டாக வழங்குகிறது. ‘ஆண்டவர்’ இறைவனுக்குரிய தலைப்பாக இயல்பானது; சங்கீதத்துக்குள் தனிப்பட்ட கிறிஸ்தியல் விளக்கத்தை இறக்குமதி செய்யவில்லை.
- issue: மனிதன் இறைவனை ‘விழித்தெழ’ அழைக்கும் உருவகம்
  choice: விழித்தெழுந்து எழுந்தருளும்
  alternative: தலையிட்டு எனக்கு உதவும்
  rationale: இறைவன் உண்மையில் உறங்குகிறார் என்று கோட்பாட்டாக்காமலும், மூலத்தின் துணிச்சலான கவித்துவ உருவகத்தை விளக்கவுரையாகக் கரைத்துவிடாமலும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான மன்றாட்டு நடை பயன்படுத்தப்பட்டுள்ளது. தமிழில் இயல்பாக இருக்க விளிகள் முதலில் வைக்கப்பட்டாலும், இரண்டு நோக்கத் தொடர்களும் இரண்டு விழிப்பு வினைகளும் பாதுகாக்கப்பட்டுள்ளன.
