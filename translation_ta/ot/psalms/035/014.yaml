translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதத்தின் கண்ணியமான புலம்பல் தொனி காக்கப்பட்டது. முதல் பாதியின் எபிரெய இலக்கணத் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது; இரண்டாம் பாதியில் ‘தாய்க்காகத் துக்கம் அனுசரிப்பவன்’ என்ற ஒப்புமையும் ‘இருண்டு தலைகுனிதல்’ என்ற தனி நிலையும் கலக்கப்படாமல் வைக்கப்பட்டுள்ளன.
