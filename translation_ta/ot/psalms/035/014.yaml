revisions:
- from: அவன் என் நண்பனாகவும், எனக்கு ஒரு சகோதரனாகவும் இருந்ததுபோல் நான் நடந்துகொண்டேன்[a]; தாய்க்காகத் துக்கம் அனுசரிப்பவனைப்போல், துயரத்தால் இருண்டு[b] தலைகுனிந்தேன்.
  to: எனக்கு நண்பனாகவும் சகோதரனாகவும் இருந்தவனிடம் நடந்துகொள்வதுபோல் நான் நடந்துகொண்டேன்[a]; தாய்க்காகத் துக்கம் அனுசரிப்பவனைப்போல், இருண்ட தோற்றத்துடன் குனிந்தேன்[b].
  rationale: 'The revision retains the Hebrew poetic syntax: the mother-mourning phrase remains the simile, and the darkened/gloomy condition remains distinct from it. It removes the added specificity of ‘head’ and the added causal wording, while making the first relational comparison more natural in modern standard Tamil.'
