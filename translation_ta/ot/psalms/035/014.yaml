  yaml_path: translation/ot/psalms/035/014.yaml
  text: I walked about as though he were my friend[a], as though he were my brother; I bowed down in gloom[c][b], like one mourning for a mother.
translation:
  language: ta
  text: எனக்கு நண்பனாகவும் சகோதரனாகவும் இருந்தவனிடம் நடந்துகொள்வதுபோல் நான் நடந்துகொண்டேன்[a]; தாய்க்காகத் துக்கம் அனுசரிப்பவனைப்போல், இருண்ட தோற்றத்துடன் குனிந்தேன்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்கு இன்னும் நெருக்கமாக: “நண்பனைப்போல், எனக்குச் சகோதரனைப்போல் நான் நடந்துகொண்டேன்.” எபிரெயத் தொடர் நெருக்கமான தனிப்பட்ட உறவை வெளிப்படுத்துகிறது.'
    reason: lexical_alternative
  - marker: b
    text: “இருண்ட தோற்றத்துடன்” என்பதற்குப் பின்னுள்ள எபிரெயச் சொல் நேரடியாக “இருண்ட” என்பதாகும்; துக்கத்தில் ஒருவரின் முகமும் தோற்றமும் சோகமாகவும் மங்கலாகவும் இருப்பதை இது குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּ/רֵעַ כְּ/אָח לִ/י
  choice: அவன் என் நண்பனாகவும், எனக்கு ஒரு சகோதரனாகவும் இருந்ததுபோல்
  rationale: רֵעַ என்பது ‘நண்பன்/தோழன்’, אָח என்பது ‘சகோதரன்’; இரண்டுக்கும் முன் வரும் כְּ ஒப்புமையைக் குறிக்கிறது. எபிரெயத்தில் வெளிப்படையாக இல்லாத மூன்றாம் நபர் எழுவாய் சூழலிலிருந்து தமிழில் இயல்பாகச் சேர்க்கப்பட்டது; לִי-யின் ‘எனக்கு/என்னிடம்’ என்ற உறவுப்பொருள் இரண்டாம் தொடரில் காக்கப்பட்டுள்ளது.
- source_word: הִתְהַלָּכְתִּי
  choice: நான் நடந்துகொண்டேன்
  rationale: הלך என்பதன் Hitpael வடிவம் இங்கு வெறும் உடல் இயக்கத்தை மட்டுமல்லாமல் ஒருவரிடம் காட்டிய தொடர்ச்சியான நடத்தை அல்லது பாங்கையும் குறிக்கலாம். ‘நடந்துகொண்டேன்’ இரு நுணுக்கங்களுக்கும் ஏற்ற இயல்பான தமிழ்.
- source_word: כַּ/אֲבֶל אֵם
  choice: தாய்க்காகத் துக்கம் அனுசரிப்பவனைப்போல்
  rationale: אֲבֶל என்பது துக்கம் அனுசரிப்பவர் அல்லது துக்கநிலை; אֵם என்பது ‘தாய்’. இவற்றை ஒரே ஒப்புமைத் தொடராக மொழிபெயர்ப்பது எபிரெயச் சொற்றொடரின் அமைப்பைத் தக்கவைக்கிறது.
- source_word: קֹדֵר
  choice: துயரத்தால் இருண்டு
  rationale: קדר அடிப்படையில் ‘இருண்டிருத்தல்/மங்கியிருத்தல்’ என்று பொருள்பட்டு, துக்கச் சூழலில் முகமும் தோற்றமும் சோகத்தால் இருண்டிருப்பதைக் குறிக்கிறது. உணர்வுப் பொருளையும் மூல உருவகத்தையும் இணைத்துக் காக்க இந்தச் சொற்றொடர் தேர்ந்தெடுக்கப்பட்டது.
- source_word: שַׁחֽוֹתִי
  choice: தலைகுனிந்தேன்
  rationale: இந்த வினை தாழ்ந்து குனிதல் அல்லது வளைதலைக் குறிக்கிறது. துக்கத்தினால் உடல் தாழ்ந்த தோற்றத்தை நவீன தமிழில் இயல்பாக ‘தலைகுனிந்தேன்’ தெரிவிக்கிறது.
