source:
  edition: WLC
  text: בְּ֭/חַנְפֵי לַעֲגֵ֣י מָע֑וֹג חָרֹ֖ק עָלַ֣/י שִׁנֵּֽי/מוֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/016.yaml
  text: Among the godless mockers at a feast[a], they gnash their teeth at me.
translation:
  language: ta
  text: விருந்திலுள்ள இறையற்ற கேலிக்காரர்களிடையே[a], அவர்கள் என்னை நோக்கிப் பற்களை நறநறவென்று கடித்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அப்பத்திற்காக/ஒரு கவளத்திற்காகக் கேலி செய்கிற இறையற்றவர்களிடையே.” “விருந்தில்” என மொழிபெயர்க்கப்பட்டுள்ள எபிரெயச் சொல் அரிதானது; அதன் பொருள் உறுதியற்றது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּחַנְפֵי
  choice: இறையற்ற ... இடையே
  rationale: חנף என்பதிலிருந்து வரும் இச்சொல் ஒழுக்க மற்றும் இறைநெறிச் சீர்கேடுடையவர்களைக் குறிக்கிறது. இங்கு ‘இறையற்ற’ என்பது வெறும் பாசாங்குத்தனத்தை அல்லாமல் அந்த மத-ஒழுக்கச் சீர்கேட்டை வெளிப்படுத்துகிறது; בְּ முன்னொட்டு ‘இடையே’ என இணைவு/இடப்பொருளில் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: לַעֲגֵי
  choice: கேலிக்காரர்கள்
  rationale: לעג என்பது கேலி செய்து இகழ்கிறவர்களைக் குறிக்கிறது. ‘கேலிக்காரர்கள்’ என்பது பகைமையான பரிகாசத்தை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: מָעוֹג
  choice: விருந்தில் இருந்த
  rationale: இது அரிதான, பொருள் உறுதியில்லாத சொல். விருந்து அல்லது உணவு சார்ந்த கேலியைக் குறிக்கலாம்; அப்பம்/துண்டு என்ற புரிதலும் சாத்தியம். முதன்மை உரையில் விருந்துச் சூழல் இயல்பாகத் தரப்பட்டு, மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: חָרֹק
  choice: கடித்தார்கள்
  rationale: חרק என்பது பகைமையை வெளிப்படுத்தும் விதத்தில் பற்களை நறநறவென்று கடிப்பதைக் குறிக்கிறது. ‘பற்களைக் கடித்தார்கள்’ தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: עָלַי
  choice: என்னைப் பார்த்து
  rationale: பற்களைக் கடித்தல் என்ற பகைச் செயலோடு, עָלַי இலக்காகிய ‘எனக்கு எதிராக/என்னை நோக்கி’ என்ற பொருளைத் தருகிறது. தமிழில் ‘என்னைப் பார்த்து’ இயல்பான சொல்லாக்கம்.
- source_word: שִׁנֵּימוֹ
  choice: அவர்கள் ... பற்களை
  rationale: பன்மை பெயர்ச்சொல்லும் மூன்றாம் நபர் ஆண்பால் பன்மை உடைமைப் பின்னொட்டும் நேரடியாக ‘அவர்களுடைய பற்கள்’ என்ற பொருளைத் தருகின்றன; வாக்கியத்தில் இயல்பாக ‘பற்களைக்’ என அமைக்கப்பட்டுள்ளது.
