revisions:
- from: பொய்மையோடு எனக்குப் பகைவரானவர்கள் என்னைக் குறித்து மகிழ விடாதிரும்[a]; காரணமின்றி என்னை வெறுப்பவர்கள் கண் சிமிட்ட விடாதிரும்[b].
  to: வஞ்சகமாக என்னைப் பகைப்பவர்கள் என்மேல் மகிழாதபடி செய்யும்[a]; காரணமின்றி என்னை வெறுப்பவர்கள் கண் சிமிட்டாதபடி செய்யும்[b].
  rationale: The revision improves idiomatic Tamil and clarifies the prayer structure. ‘வஞ்சகமாக என்னைப் பகைப்பவர்கள்’ is a natural contextual rendering of the first compact Hebrew expression; footnote a explicitly preserves the viable alternative in which falsehood characterizes the enemies themselves. ‘என்மேல் மகிழாதபடி செய்யும்’ conveys hostile rejoicing over the psalmist. The eye-winking idiom and its cultural note are retained without overinterpreting it.
