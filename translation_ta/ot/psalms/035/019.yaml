  yaml_path: translation/ot/psalms/035/019.yaml
  text: Do not let my enemies falsely rejoice over me[b][a], nor let those who hate me without cause wink the eye.
translation:
  language: ta
  text: வஞ்சகமாக என்னைப் பகைப்பவர்கள் என்மேல் மகிழாதபடி செய்யும்[a]; காரணமின்றி என்னை வெறுப்பவர்கள் கண் சிமிட்டாதபடி செய்யும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொற்றொடர் செறிவானது. இது ‘பொய்மையுள்ள என் பகைவர்கள்’ என்றோ, ‘பொய்யான முறையில் என்னைப் பகைப்பவர்கள்’ என்றோ பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘கண் சிமிட்டுதல்’ என்பது இங்கு ஏளனம், மறைவான பகைமை, அல்லது தீய சூழ்ச்சியை வெளிப்படுத்தும் கண் சைகையைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: אַל
  choice: விடாதிரும்
  rationale: தொடர்ந்து வரும் imperfect வினைகளுடன் வேண்டுதல் சார்ந்த தடையை வெளிப்படுத்துகிறது. கடவுளை நோக்கிய விண்ணப்பமாக நவீன, கண்ணியமான தமிழில் இயல்பாக அமைகிறது.
- source_word: יִשְׂמְחוּ
  choice: மகிழ
  rationale: שמח என்பதன் அடிப்படைப் பொருளான ‘மகிழ்தல்’ என்பதைத் தக்கவைக்கிறது; சூழலில் இது பகைவர்களின் வெற்றிக்களிப்பைக் குறிக்கிறது.
- source_word: לִי
  choice: என்னைக் குறித்து
  rationale: சொல்லளவில் ‘எனக்கு/என்னைப் பொறுத்து’ என்றாலும், இங்கு சங்கீதக்காரனுக்கு எதிராக அல்லது அவன் வீழ்ச்சியைக் குறித்து மகிழ்வதைச் சுட்டுகிறது. ‘என்னைக் குறித்து’ மூலத்தின் பரந்த தொடர்பை அளவுக்கு மீறித் தீர்மானிக்காமல் காக்கிறது.
- source_word: אֹיְבַי שֶׁקֶר
  choice: பொய்மையோடு எனக்குப் பகைவரானவர்கள்
  rationale: ‘பொய்/பொய்மை’ என்பதையும் ‘என் பகைவர்கள்’ என்பதையும் இணைத்துக் காட்டுகிறது. எபிரெயச் சொற்றொடர் பகைவர்களின் பொய்த்தன்மையையோ, அவர்கள் பொய்யான விதத்தில் பகைப்பதையோ குறிக்கக்கூடியதால், அடிக்குறிப்பில் இரு சாத்தியங்களும் தரப்படுகின்றன.
- source_word: שֹׂנְאַי
  choice: என்னை வெறுப்பவர்கள்
  rationale: ‘என்னை வெறுத்துக்கொண்டிருப்பவர்கள்’ என்ற participial கருத்தை தெளிவான, இயல்பான தமிழில் தருகிறது.
- source_word: חִנָּם
  choice: காரணமின்றி
  rationale: ஆதாரமோ நியாயமான காரணமோ இல்லாத பகைமையைச் சூழலுக்கேற்றவாறு தெரிவிக்கிறது.
- source_word: יִקְרְצוּ עָיִן
  choice: கண் சிமிட்ட
  rationale: தீய நோக்கமுள்ள அல்லது இரகசியமான கண் சைகையைக் குறிக்கும் எபிரெய உருவகத்தைத் தக்கவைக்கிறது; அதன் பண்பாட்டுப் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
