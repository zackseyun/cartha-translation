  register: நவீன நிலையான தமிழில், வேண்டுதல் தொனியைத் தக்கவைக்கும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘பொய்மையோடு’ என்ற சொல் எபிரெயின் சுருக்கமான கட்டமைப்பை முற்றாகத் தீர்மானிக்காமல் வைக்கிறது; ‘கண் சிமிட்ட’ என்பது மூலத்தின் தெளிவான உடல் உருவகத்தைப் பாதுகாக்கிறது.
