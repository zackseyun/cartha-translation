source:
  edition: WLC
  text: וַ/יַּרְחִ֥יבוּ עָלַ֗/י פִּ֫י/הֶ֥ם אָ֭מְרוּ הֶאָ֣ח הֶאָ֑ח רָאֲתָ֥ה עֵינֵֽי/נוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/021.yaml
  text: They opened their mouths wide against me; they said[a], “Aha, aha! Our eyes have seen it!”
translation:
  language: ta
  text: அவர்கள் எனக்கு எதிராகத் தங்கள் வாய்களை அகலத் திறந்து, “ஆகா! ஆகா! எங்கள் கண்கள் கண்டுவிட்டன![a]” என்று சொன்னார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இன்னும் சொற்சொல்லாக, “எங்கள் கண் கண்டது.” எபிரெயத்தில் “எங்கள் கண்கள்” என்று மொழிபெயர்க்கப்படும் சொல்லுடன் ஒருமை வினைச்சொல் உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְחִיבוּ
  choice: அகலத் திறந்து
  rationale: ஹிஃபில் வடிவில் ‘அகலமாக்கினர்’ என்பது சொற்பொருள். ‘வாய்’ என்பதுடன் இது பகைமையுடன் வாயை அகலத் திறந்து பரிகசிப்பதைக் குறிக்கிறது; தமிழில் ‘அகலத் திறந்து’ அந்தக் காட்சிப்படிமத்தை இயல்பாகப் பாதுகாக்கிறது.
- source_word: עָלַי
  choice: எனக்கு எதிராக
  rationale: பகைமை நிறைந்த பேச்சுச் சூழலில் עַל இடத்தைக் குறிப்பதல்ல; எதிரான நிலைப்பாட்டைக் குறிக்கிறது.
- source_word: פִּיהֶם
  choice: தங்கள் வாயை
  rationale: எபிரெய மொழியில் ‘அவர்களுடைய வாய்’ ஒருமையில் இருந்தாலும், அது பலர் ஒரே பகைமையான செயலில் ஈடுபடுவதைத் தொகுப்பாகக் காட்டுகிறது. தமிழில் எழுவாயை மீண்டும் சொல்லாமல் ‘தங்கள் வாயை’ என்பது இயல்பாக உள்ளது.
- source_word: הֶאָח הֶאָח
  choice: ஆகா! ஆகா!
  rationale: இது தீய மகிழ்ச்சியையும் வெற்றிக்களிப்பையும் வெளிப்படுத்தும் இடைச்சொல். மறுபடியும் கூறப்படுவதையும் ஏளனத் தொனியையும் ‘ஆகா! ஆகா!’ பாதுகாக்கிறது.
- source_word: רָאֲתָה עֵינֵינוּ
  choice: எங்கள் கண்களே அதைக் கண்டுவிட்டன
  rationale: இயல்பான தமிழுக்காக ‘கண்கள்’ என்ற பன்மையும் அதற்கேற்ற வினைமுற்றும் பயன்படுத்தப்பட்டுள்ளன. ‘-ஏ’ அவர்கள் தாமே கண்டதாகப் பெருமிதத்துடன் வலியுறுத்துவதை வெளிப்படுத்துகிறது. எபிரெயத்தில் வெளிப்படையான செயப்படுபொருள் இல்லாவிட்டாலும், சூழலில் உட்கிடக்கும் பார்த்த நிகழ்வைக் குறிக்க ‘அதை’ சேர்க்கப்பட்டுள்ளது; ‘கண்டுவிட்டன’ அவர்களின் வெற்றிக்களிப்பான கூற்றை இயல்பாகத் தருகிறது.
