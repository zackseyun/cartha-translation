  text: They repay me evil for good[b][a], bereavement to my soul.
translation:
  language: ta
  text: 'நன்மைக்குப் பதிலாக எனக்குத் தீமை செய்கிறார்கள்;

    என் உயிரோ பேரிழப்பில் ஆழ்கிறது.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு விதமாக: “என் உயிருக்கு இழப்பு” அல்லது “நானோ பேரிழப்பில் ஆழ்கிறேன்.” “என் உயிர்” என்பதற்கான எபிரெயச் சொல் உயிர், தன், அல்லது முழு ஆள் என்றும் பொருள்படலாம்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְשַׁלְּמוּנִי
  choice: எனக்குத் ... செய்கிறார்கள்
  rationale: பியேல் வடிவம் கைம்மாறாகத் திருப்பிச் செய்வதைக் குறிக்கிறது. தமிழில் ‘நன்மைக்குப் பதிலாக எனக்குத் தீமை செய்கிறார்கள்’ என்பது பகைமையான கைம்மாறை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: רָעָה
  choice: தீமை
  rationale: இச்சொல் ஒழுக்கத் தீமையையும் தீங்கு விளைவிக்கும் செயலையும் குறிக்கக்கூடும்; ‘தீமை’ இரு நிழற்பொருள்களையும் சுருக்கமாகத் தக்கவைக்கிறது.
- source_word: תַּחַת
  choice: பதிலாக
  rationale: பரிமாற்றம் அல்லது ஒன்றுக்குப் பதில் மற்றொன்று என்ற உறவைத் தெளிவாகக் காட்டுகிறது.
- source_word: טוֹבָה
  choice: நன்மை
  rationale: ‘நல்லது, நன்மை, நலச்செயல்’ என்ற பரந்த பொருளைத் தக்கவைத்து, ‘தீமை’ என்பதுடனான கவித்துவ எதிர்மறை இணையைப் பாதுகாக்கிறது.
- source_word: שְׁכוֹל
  choice: பறிகொடுத்துத் தவிக்கிறது
  rationale: இச்சொல் பொதுவாக நெருங்கிய ஒருவரை, குறிப்பாகப் பிள்ளையை, இழந்த துயரைக் குறிக்கிறது. இங்கு யார் அல்லது எது இழக்கப்பட்டது என்பதை எபிரெயம் குறிப்பிடாததால், ‘பறிகொடுத்துத் தவிக்கிறது’ அந்தப் பேரிழப்புத் துயரை இயல்பான தமிழில் வெளிப்படுத்தி, இழப்பை மிகையாகக் குறிப்பாக்காமல் விடுகிறது.
- source_word: לְנַפְשִׁי
  choice: என் உள்ளம்
  rationale: נֶפֶשׁ என்பது உயிர், தன், உள்ளம்/ஆள் ஆகிய பொருள்களைக் கொள்ளலாம். இச்சூழலில் மனத்தின் ஆழ்ந்த இழப்புத் துயரை இயல்பான தமிழில் தெரிவிக்க ‘என் உள்ளம்’ தேர்ந்தெடுக்கப்பட்டது; பிற சாத்தியங்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
