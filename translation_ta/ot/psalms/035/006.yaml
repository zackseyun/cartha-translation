  text: יְֽהִי דַרְכָּ֗/ם חֹ֥שֶׁךְ וַ/חֲלַקְלַקּ֑וֹת וּ/מַלְאַ֥ךְ יְ֝הוָ֗ה רֹדְפָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/006.yaml
  text: May their way be dark and slippery[a], with the angel of Yahweh pursuing them.
translation:
  language: ta
  text: யாவேயின் தூதர் அவர்களைத் துரத்திக்கொண்டிருக்க, அவர்களுடைய வழி இருண்டதாகவும் வழுக்கலானதாகவும் இருக்கட்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுடைய வழி இருண்டதாகவும் வழுக்கலானதாகவும் இருக்கட்டும்; யாவேயின் தூதர் அவர்களைத் துரத்தட்டும்.” எபிரெய இணைப்புச் சொல் எளிய இணைப்பாகவும் உடனிகழும் சூழ்நிலையாகவும் புரிந்துகொள்ளப்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי
  choice: இருக்கட்டும்
  rationale: இது விருப்பம் அல்லது சாபவேண்டுதலை வெளிப்படுத்தும் கட்டளைநிலை வடிவம்; ‘இருக்கட்டும்’ அதன் வலிமையை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: דַרְכָּם
  choice: அவர்களுடைய வழி
  rationale: ‘வழி’ என்பது நேரடியான பாதையையும் உருவகமான வாழ்க்கைப் போக்கையும் குறிக்கக்கூடியதால் எபிரெயச் சொல்லின் இருபொருள் வாய்ப்பையும் காக்கிறது.
- source_word: חֹשֶׁךְ
  choice: இருண்டும்
  rationale: மூலத்தில் ‘இருள்’ என்ற பெயர்ச்சொல் இருந்தாலும், ‘வழி ... இருக்கட்டும்’ என்ற தமிழ் அமைப்பில் ‘இருண்டு’ இயல்பாக இருந்து அபாயம் மற்றும் தெளிவின்மை ஆகிய உருவகங்களைத் தக்கவைக்கிறது.
- source_word: וַחֲלַקְלַקּוֹת
  choice: வழுக்கலாகவும்
  rationale: பன்மை வடிவிலுள்ள இச்சொல் வழுக்கும் நிலை அல்லது வழுக்கலான இடங்களைக் குறிக்கிறது; இணையான தமிழ் வாக்கிய அமைப்பில் ‘வழுக்கலாகவும்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: וּמַלְאַךְ יְהוָה
  choice: யாவேயின் தூதர்
  rationale: מַלְאָךְ என்பதற்கு ‘தூதர்’ என்றும், יהוה என்ற தனிப்பெயருக்கு ஒலிபெயர்ப்பாக ‘யாவே’ என்றும் வழங்கப்பட்டுள்ளது; இணைப்புச் சொல்லின் தொடர்பு அடிக்குறிப்பில் சுட்டப்பட்டுள்ளது.
- source_word: רֹדְפָם
  choice: அவர்களைத் துரத்திக்கொண்டிருக்கட்டும்
  rationale: רדף என்பது தொடர்ந்து பின்தொடர்ந்து துரத்துவதைக் குறிக்கிறது. தொடர்நிலை வினையெச்சத்தின் செயற்பாட்டையும் சாபவேண்டுதலின் சூழலையும் தமிழ் வடிவம் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பட்டப்பெயர் அல்ல, நான்கு எழுத்துகளாலான இறைவனின் தனிப்பெயர் நேரடியாக உள்ளது; ஆகவே அதை ஒரு பட்டப்பெயரால் மாற்றாமல் தமிழில் ஒலிபெயர்த்துள்ளோம்.
- issue: רֹדְפָם என்ற தொடர்நிலை வடிவத்தின் வேண்டுதல் சார்பு
  choice: துரத்திக்கொண்டிருக்கட்டும்
  alternative: துரத்திக்கொண்டிருக்க
  rationale: வெளிப்படையான יְהִי முதல் கூறில் மட்டுமே இருந்தாலும், இரண்டாம் கூறும் சாபவேண்டுதலின் தொடர்ச்சியாகப் புரிந்துகொள்ளப்படலாம். தமிழ் முதன்மைப் பாடம் அந்த வலிமையை வெளிப்படுத்துகிறது; சூழ்நிலைப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, எளிதில் புரியும் ஆனால் சங்கீதத்தின் சாபவேண்டுதல் வலிமையைத் தக்கவைக்கும் நடை. ‘இருண்டும் வழுக்கலாகவும்’ என்ற இணை அமைப்பு இயல்பான தமிழுக்காகப் பயன்படுத்தப்பட்டுள்ளது; மூலத்தின் பெயர்ச்சொல் உருவங்கள் கருத்தளவில் பாதுகாக்கப்பட்டுள்ளன.
