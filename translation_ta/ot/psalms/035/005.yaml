source:
  edition: WLC
  text: יִֽהְי֗וּ כְּ/מֹ֥ץ לִ/פְנֵי ר֑וּחַ וּ/מַלְאַ֖ךְ יְהוָ֣ה דּוֹחֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/005.yaml
  text: May they be like chaff before the wind[a], with the angel of Yahweh driving them away.
translation:
  language: ta
  text: அவர்கள் காற்றின் முன் பதரைப்போல் ஆகட்டும்; யாவேயின் தூதர் அவர்களைத் துரத்தியடிக்கட்டும்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள் காற்றின் முன் பதரைப்போல் ஆகட்டும்; யாவேயின் தூதர் அவர்களைத் துரத்தியடித்துக்கொண்டிருக்கிறார்.” எபிரெய இணைப்புச்சொல்லை வெறுமனே “மற்றும்” என்றும், வினைவடிவத்தை “துரத்தியடித்துக்கொண்டு” அல்லது “தள்ளிக்கொண்டு” என்றும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִהְיוּ
  choice: ஆகட்டும்
  rationale: சூழலில் உள்ள வேண்டுதல்/சாப வேண்டுதல் சார்ந்த யுஸ்ஸிவ் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது; சாதாரண எதிர்காலமாக மாற்றவில்லை.
- source_word: כְּמֹץ
  choice: பறக்கும் பதரைப்போல்
  rationale: מֹץ என்பது தானியம் தூற்றும்போது காற்றில் பறக்கும் இலகுவான பதரைக் குறிக்கிறது. 'பறக்கும்' என்பது தமிழில் உருவகத்தைத் தெளிவாக்கும் சூழல்சார் நிரப்பல்.
- source_word: לִפְנֵי רוּחַ
  choice: காற்றின் முன்
  rationale: எபிரெய சொற்றொடரின் இடவியல் உருவகத்தை நெருக்கமாகப் பேணுகிறது.
- source_word: וּמַלְאַךְ יְהוָה
  choice: யாவேயின் தூதர்
  rationale: מַלְאָךְ என்பதன் அடிப்படைப் பொருள் 'தூதர்'; இச்சொற்றொடரில் விண்ணுலகத் தூதர் எனப் புரிந்துகொள்ளப்படும் வாய்ப்பைத் திறந்தே வைத்திருக்கிறது. וְ இங்கு இணைப்பாகப் புரிந்துகொள்ளப்பட்டது.
- source_word: דּוֹחֶה
  choice: துரத்தியடிக்கட்டும்
  rationale: דחה என்பதிலுள்ள பலவந்தமாகத் தள்ளுதல் அல்லது விரட்டுதல் என்ற இயக்கத்தை இயல்பான தமிழில் தருகிறது; சூழலால் உணரப்படும் பன்மைச் செயப்படுபொருள் வெளிப்படையாகச் சேர்க்கப்பட்டது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் நேரடியாக வரும் நான்கு எழுத்து உடன்படிக்கைப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் பெயராகவே ஒலிபெயர்க்கிறது.
- issue: מַלְאַךְ יְהוָה என்பவரின் அடையாளம்
  choice: யாவேயின் தூதர்
  alternative: யாவேயின் வானதூதர்
  rationale: '''தூதர்'' என்பது மூலச்சொல்லின் பரந்த பொருளைத் தக்கவைத்து, இந்த நபரின் இயல்பையோ அடையாளத்தையோ வசனம் கூறுவதற்கு மேல் வரையறுக்கவில்லை.'
- issue: இரண்டாம் அரையடியின் இலக்கண உறவு
  choice: தனி வேண்டுதலாக இணைத்தல்
  alternative: யாவேயின் தூதர் அவர்களைத் துரத்தியடிக்க, அவர்கள் காற்றின் முன் பறக்கும் பதரைப்போல் ஆகட்டும்
  rationale: וְ என்பதை இயல்பான 'மற்றும்' இணைப்பாகவும், דּוֹחֶה என்பதை தொடர்ச்சியான செயலைக் காட்டும் வடிவமாகவும் வாசிக்கலாம். தமிழில் இணையான வேண்டுதல் வினையால் அதன் வலிமை வெளிப்படுத்தப்படுகிறது; மாற்று தொடர்பு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், கவிதைநயமும் வேண்டுதல் சார்ந்த தீவிரமும் பேணப்பட்டுள்ளன. 'பதர்' என்ற பரவலாக அறியப்படும் வேளாண் சொல் பயன்படுத்தப்பட்டுள்ளது; 'துரத்தியடிக்கட்டும்' வலுவான இயக்கத்தை இயல்பாகக் காட்டுகிறது.
