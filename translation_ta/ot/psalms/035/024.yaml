  text: Vindicate me according to your righteousness[a], O Yahweh my God, and do not let them rejoice over me.
translation:
  language: ta
  text: யாவே, என் தேவனே, உமது நீதியின்படி[a] எனக்கு நியாயம் வழங்கும்; என்னை முன்னிட்டு அவர்கள் மகிழ்ச்சியடைய விடாதிருப்பீராக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உமது நியாயத்தின்படி.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁפְטֵנִי
  choice: எனக்கு நியாயம் வழங்கும்
  rationale: தனிப்பட்ட பொருளுடன் வரும் שׁפט, இந்த வேண்டுதல் சூழலில் வெறுமனே மதிப்பிடுவதைக் குறிக்காமல், சங்கீதக்காரருக்குச் சாதகமாக நீதித்தீர்ப்பு வழங்குமாறு கோருகிறது. ‘எனக்கு நியாயம் வழங்கும்’ என்பது அதன் நீதிமன்றச் சார்ந்த வேண்டுதல் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: כְצִדְקְךָ
  choice: உமது நீதியின்படி
  rationale: צדק இங்கு கடவுளின் நீதியான இயல்பையும் அவர் செயல்படும் நேர்மையான அளவுகோலையும் குறிக்கிறது. ‘நீதி’ இந்த விரிவான ஒழுக்க மற்றும் இறையியல் பொருளைப் பாதுகாக்கிறது; ‘நியாயம்’ சாத்தியமான மாற்றாக அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய வேதாகமத்தில் உள்ள இறைப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் பரவலாகப் புரிந்துகொள்ளக்கூடிய ஒலிபெயர்ப்பாக ‘யாவே’ பயன்படுத்தப்படுகிறது.
- source_word: אֱלֹהָי
  choice: என் தேவனே
  rationale: முதலாம் நபர் ஒருமை உடைமை விகுதியையும் நேரடி அழைப்பையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְאַל יִשְׂמְחוּ
  choice: அவர்கள் மகிழ விடாதேயும்
  rationale: אַל உடன் வரும் வினை எதிர்மறை வேண்டுதலைக் குறிக்கிறது. இந்தச் செயலை எதிரிகள் செய்ய கடவுள் அனுமதிக்க வேண்டாம் என்ற மனுவைத் தமிழில் தெளிவாகத் தருகிறது.
- source_word: לִי
  choice: எனக்கு எதிராக
  rationale: பகைமைச் சூழலில் שמח உடன் வரும் לִי, சங்கீதக்காரரின் துன்பம் அல்லது தோல்வியை முன்னிட்டு எதிரிகள் வெற்றிக்களிப்பதைக் குறிக்கிறது. ‘எனக்கு எதிராக’ என்பது பொருளை மிகைப்படுத்தாமல் அந்த எதிர்மறை உறவைத் தெரிவிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: யெகோவா
  rationale: மூலவசனம் நான்கெழுத்து இறைப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. அதை ‘ஆண்டவர்’ என்ற பட்டப்பெயரால் மாற்றாமல் தனிப்பட்ட இறைப்பெயராகப் பாதுகாக்க ‘யாவே’ தேர்ந்தெடுக்கப்பட்டது.
- issue: צִדְקְךָ என்பதற்கு ‘நீதி’ அல்லது ‘நியாயம்’
  choice: உமது நீதியின்படி
  alternative: உமது நியாயத்தின்படி
  rationale: இச்சொல் நீதித்தீர்ப்பைக் குறிக்கக்கூடியதாயினும், இங்கு கடவுளின் நீதியான இயல்பையும் செயலையும் விரிவாகச் சுட்டுகிறது. ஆகவே முதன்மை உரையில் ‘நீதி’ வைக்கப்பட்டு, செல்லத்தக்க நீதித்துறை சார்ந்த மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் புரியக்கூடிய, மரியாதையும் வேண்டுதல் தொனியும் கொண்ட நடையைப் பயன்படுத்துகிறது. ‘உமது’, ‘தேவனே’, ‘வழங்கும்’, ‘விடாதேயும்’ ஆகிய வடிவங்கள் கவிதைமிக்க வேதாகமக் கண்ணியத்தைத் தக்கவைத்தாலும் அளவுக்கு மீறிய பழமையாக்கத்தைத் தவிர்க்கின்றன.
