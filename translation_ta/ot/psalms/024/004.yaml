  yaml_path: translation/ot/psalms/024/004.yaml
  text: The one who has clean hands and a pure heart[c][b][a], who has not lifted up his soul to falsehood or sworn deceitfully.
translation:
  language: ta
  text: கைகளில் களங்கமில்லாதவனும் தூய உள்ளம் கொண்டவனும், என் உயிரைப்[a] பொய்மைக்கு உயர்த்தாதவனும், வஞ்சகமாகச் சத்தியம் செய்யாதவனுமே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய உரையில் ‘என் உயிரை’ என்று உள்ளது; வசனம் முழுவதும் மூன்றாம் நபரில் அமைந்திருப்பதற்கு ஏற்ப பல மொழிபெயர்ப்புகள் மாற்றுவாசகத்தைப் பின்பற்றி ‘தன் உயிரை’ என்று தருகின்றன.
    reason: textual_variant
lexical_decisions:
- source_word: נְקִי כַפַּיִם
  choice: கைகளில் களங்கமில்லாதவன்
  rationale: ‘கைகள் தூய்மையானவன்’ என்பதைக் காட்டிலும் இது நவீனத் தமிழில் இயல்பாக இருந்து, வெளிப்புற நடத்தையின் குற்றமின்மையைக் குறிக்கும் எபிரெய உருவகத்தையும் காக்கிறது.
- source_word: בַר לֵבָב
  choice: தூய உள்ளமுள்ளவன்
  rationale: உள்ளார்ந்த ஒழுக்கத் தூய்மையை வெளிப்படுத்தி, கைகளைக் குறிக்கும் முந்தைய வெளிப்புற உருவகத்துடன் உள்ள எதிரிணைப்பைக் காக்கிறது.
- source_word: נָשָׂא ... נַפְשִׁי
  choice: என் உயிரைப் ... உயர்த்தாதவன்
  rationale: WLC உரையிலுள்ள முதலாம் நபர் ஒருமை பின்னொட்டை (‘என் உயிரை’) அமைதியாக மாற்றாமல் காக்கிறது. ‘உயர்த்துதல்’ என்ற எபிரெய சொல்லுருவமும் பாதுகாக்கப்படுகிறது; சூழலுக்கு இயல்பான ‘தன் உயிரை’ என்பது அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לַשָּׁוְא
  choice: பொய்மையை நோக்கி
  rationale: שָׁוְא என்பதன் பொய், வெறுமை, பயனின்மை ஆகிய பொருள் வரம்பில், அடுத்துள்ள வஞ்சக ஆணையுடன் பொருந்தும் ‘பொய்மை’ தேர்ந்தெடுக்கப்பட்டது; ‘சிலை’ என்ற சாத்தியமான விளக்கம் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: נִשְׁבַּע לְמִרְמָה
  choice: வஞ்சகமாக ஆணையிடாதவன்
  rationale: ஏமாற்றும் விதத்தில் அல்லது நோக்கத்தில் சத்தியம் செய்வதை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: נַפְשִׁי என்பதிலுள்ள ‘என் உயிரை’ என்ற வாசகமா, சூழலுக்குப் பொருந்தும் ‘தன் உயிரை’ என்ற வாசகமா
  choice: முதன்மை உரையில் WLC-யின் ‘என் உயிரை’ தக்கவைக்கப்பட்டது.
  alternative: தன் உயிரைப் பொய்மையை நோக்கி உயர்த்தாதவன்
  rationale: வசனத்தின் மற்ற பகுதிகள் மூன்றாம் நபரில் இருப்பதால் ‘தன் உயிரை’ என்பது சூழலில் மென்மையாகப் பொருந்துகிறது; பல மொழிபெயர்ப்புகளும் அதைப் பின்பற்றுகின்றன. ஆயினும் கொடுக்கப்பட்ட WLC உரையில் முதலாம் நபர் பின்னொட்டு இருப்பதால், உரைச்சிக்கலைத் தீர்த்துவிடாமல் அதையே முதன்மை உரையில் வைத்துத் தெளிவான மாற்றுவாசகம் அடிக்குறிப்பில் தரப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. சங்கீதத்தின் கவிதை இணைப்பைக் காக்க ‘கைகளில் களங்கமில்லாதவன் / தூய உள்ளமுள்ளவன்’ என்றும், தொடர்ச்சியான பண்புகளை இணைக்க ‘-வனும்’ என்றும் பயன்படுத்தப்பட்டுள்ளது. இறுதியிலுள்ள ‘-மே’ முந்தைய வசனத்தின் கேள்விக்கான விடைத் தன்மையை உணர்த்துகிறது.
