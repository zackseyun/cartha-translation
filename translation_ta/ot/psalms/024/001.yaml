source:
  edition: WLC
  text: לְ/דָוִ֗ד מִ֫זְמ֥וֹר לַֽ֭/יהוָה הָ/אָ֣רֶץ וּ/מְלוֹאָ֑/הּ תֵּ֝בֵ֗ל וְ/יֹ֣שְׁבֵי בָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/024/001.yaml
  text: A psalm of David[a]. The earth and its fullness are Yahweh’s[b], the world and those who dwell in it.
translation:
  language: ta
  text: 'தாவீதின் சங்கீதம்.[a]


    பூமியும் அதில் நிறைந்திருப்பவை அனைத்தும் யாவேவுடையவை;

    உலகமும் அதில் குடியிருப்போரும் அவருடையவர்கள்.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தாவீதின்” என்பதற்கு, “தாவீதால் இயற்றப்பட்ட,” “தாவீதுக்குரிய,” அல்லது “தாவீதுக்காக” என்றும் பொருள் இருக்கலாம்.
    reason: lexical_ambiguity
  - marker: b
    text: முதல் இரண்டு அடிகளை இன்னும் நேரடியாக, “பூமியும் அதன் நிறைவும் யாவேவுடையவை; உலகமும் அதில் குடியிருப்போரும் அவருடையவர்கள்” என்று மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: தாவீதின்
  rationale: לְ என்ற முன்னிடைச்சொல் ஆசிரியத்துவம், தொடர்பு, அர்ப்பணிப்பு ஆகிய பல உறவுகளைக் குறிக்கக்கூடும். “தாவீதின்” என்பது சங்கீதத் தலைப்பில் இயல்பாக இருந்து, அவற்றில் ஒன்றை மட்டும் உறுதியாகத் தீர்மானிக்காமல் விடுகிறது.
- source_word: מִזְמוֹר
  choice: சங்கீதம்
  rationale: இசையுடன் பாடப்படும் புனிதப் பாடலைக் குறிக்கும் வழக்கமான தலைப்புச் சொல்; தமிழில் மரபாகவும் தெளிவாகவும் உள்ளது.
- source_word: לַיהוָה
  choice: யாவேவுடையவை
  rationale: எபிரெய உரையில் உள்ள יהוה என்ற இறைப்பெயரை “யாவே” என நேரடியாகக் கொடுத்து, வினையில்லா உடைமை வாக்கியத்தின் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הָאָרֶץ
  choice: பூமி
  rationale: תֵּבֵל என்ற இணைச்சொல்லும் வசனத்தின் உலகளாவிய பரப்பும் இங்கு “நாடு” என்பதைக் காட்டிலும் “பூமி” என்பதையே ஆதரிக்கின்றன.
- source_word: וּמְלוֹאָהּ
  choice: அதில் நிறைந்திருப்பவை அனைத்தும்
  rationale: מְלוֹא என்ற சொல் அதன் முழு உள்ளடக்கத்தைக் குறிக்கிறது. சொல்லுக்குச் சொல் அமைந்த “அதன் நிறைவு” என்பதைவிட இத்தேர்வு நவீனத் தமிழில் தெளிவாக உள்ளது; நேரடியான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: תֵּבֵל
  choice: உலகம்
  rationale: குடியிருப்புக்குரிய ஒழுங்குபடுத்தப்பட்ட உலகைக் குறிக்கிறது; அடுத்துள்ள “குடியிருப்போர்” என்ற தொடர் அதன் குடியிருப்பு நுணுக்கத்தை வெளிப்படுத்துகிறது.
- source_word: וְיֹשְׁבֵי בָהּ
  choice: அதில் குடியிருப்போர்
  rationale: எபிரெயப் பங்கேற்பு வடிவத்தின் தொடர்ச்சியான குடியிருத்தல் என்ற வினைத் தன்மையைச் சுருக்கமாகவும் இயல்பாகவும் காக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூல உரை நான்கெழுத்து இறைப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. “யாவே” என்பது அதை பொதுப்பட்டமாக மாற்றாமல் தனிப்பட்ட உடன்படிக்கைப் பெயராகப் பாதுகாக்கிறது.
- issue: இரண்டாம் அடியில் உடைமைக்குரியவரை வெளிப்படுத்துதல்
  choice: அவருடையவர்கள்
  alternative: யாவேவுடையவர்கள்
  rationale: எபிரெயக் கவிதையில் இரண்டாம் அடியின் உடைமை வினை முதல் அடியிலிருந்து புரிந்துகொள்ளப்படுகிறது. தமிழில் “அவருடையவர்கள்” என்று வெளிப்படுத்துவது அந்தத் தொடர்பைத் தெளிவாக்குகிறது; புதிய உரிமையாளரை அறிமுகப்படுத்துவதில்லை.
translation_notes:
  register: நவீன பொதுத் தமிழில், சங்கீதத்திற்கேற்ற கண்ணியமான கவிதை நடையைப் பயன்படுத்துகிறது. “யாவே” என்ற இறைப்பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது; அரிதான சொற்கள் தவிர்க்கப்பட்டுள்ளன. இரண்டு இணை அடிகளின் அமைப்பும் உடைமைப் பொருளும் காக்கப்பட்டுள்ளன.
