source:
  edition: WLC
  text: לְ/דָוִ֗ד מִ֫זְמ֥וֹר לַֽ֭/יהוָה הָ/אָ֣רֶץ וּ/מְלוֹאָ֑/הּ תֵּ֝בֵ֗ל וְ/יֹ֣שְׁבֵי בָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/024/000.yaml
  text: A psalm of David[a]. Yahweh's is the earth and its fullness[b], the world and those who dwell in it.
translation:
  language: ta
  text: 'தாவீதின் சங்கீதம்.[a]


    பூமியும் அதில் நிறைந்துள்ள அனைத்தும் யெகோவாவுக்குரியவை;

    உலகமும் அதில் குடியிருப்போரும் அவருக்குரியவர்கள்.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “தாவீதுக்குரிய சங்கீதம்.” எபிரெயச் சொற்றொடர் ஆசிரியர், தொடர்பு, அல்லது அர்ப்பணிப்பு ஆகியவற்றைக் குறிக்கக்கூடும்.'
    reason: source_ambiguity
  - marker: b
    text: எபிரெயக் கவிதையில் இரண்டாம் அடியில் வினைச்சொல் வெளிப்படையாக மீண்டும் வரவில்லை; முதல் அடியின் “யெகோவாவுக்குரியவை” என்ற கருத்து இங்கு தொடர்கிறது.
    reason: poetic_ellipsis
lexical_decisions:
- source_word: לְדָוִד
  choice: தாவீதின்
  rationale: எபிரெய முன்னொட்டு לְ இங்கு ஆசிரியத்துவம், தொடர்பு, அல்லது அர்ப்பணிப்பு ஆகிய நுட்பங்களைத் தாங்கலாம்; இயல்பான சங்கீதத் தலைப்பாக ‘தாவீதின்’ என்பது அந்தத் தொடர்பை மிகையாகத் தீர்மானிக்காமல் தருகிறது.
- source_word: מְלוֹאָהּ
  choice: அதில் நிறைந்துள்ள அனைத்தும்
  rationale: சொல்லின் நேரடிப் பொருள் ‘அதன் நிறைவு’; இச்சூழலில் பூமியில் உள்ள அனைத்தையும் குறிக்கும் இயல்பான நவீனத் தமிழ் வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- source_word: תֵּבֵל
  choice: உலகம்
  rationale: மக்கள் வாழும் நிலவுலகைக் குறிக்கும் வழக்கமான கவிதைச்சொல்லாக மொழிபெயர்க்கப்பட்டது.
- source_word: יֹשְׁבֵי בָהּ
  choice: அதில் குடியிருப்போர்
  rationale: ‘அதில் வசிப்பவர்கள்’ என்ற மூலப் பொருளைச் சுருக்கமாகவும் கவிதைநடையுடனும் தருகிறது.
- source_word: לַיהוָה
  choice: யெகோவாவுக்குரியவை / அவருக்குரியவர்கள்
  rationale: தெய்வீகப் பெயரான יהוה ஒலிபெயர்க்கப்பட்டு, உடைமை அல்லது உரிமையைக் குறிக்கும் לַ முன்னொட்டு ‘-க்குரிய’ என இயல்பாகத் தரப்பட்டது.
theological_decisions:
- issue: יהוה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: கர்த்தர்
  rationale: மூலத்தில் பொதுப்பட்டப் பெயர் அல்ல, தனிப்பட்ட உடன்படிக்கைப் பெயர் உள்ளது; அதை மறைக்காமல் தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்பட்ட ஒலிவடிவம் பயன்படுத்தப்பட்டது.
- issue: לְדָוִד என்பதன் தொடர்பு
  choice: தாவீதின்
  alternative: தாவீதுக்காக / தாவீதைக் குறித்த
  rationale: முன்னொட்டின் உண்மையான பல்பொருள் தன்மையை அடிக்குறிப்பில் காக்கும் வகையில், தலைப்பில் இயல்பான ஆனால் முழுமையாக ஆசிரியத்துவத்தை வலியுறுத்தாத வடிவம் பயன்படுத்தப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டது. எபிரெய இணைநிலைக் கவிதை அமைப்பு இரு அடிகளாகப் பாதுகாக்கப்பட்டுள்ளது; தமிழில் இயல்புக்காக இரண்டாம் அடியின் மறைந்துள்ள உடைமைக்கருத்து வெளிப்படுத்தப்பட்டுள்ளது.
