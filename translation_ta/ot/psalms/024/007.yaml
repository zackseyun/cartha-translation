  yaml_path: translation/ot/psalms/024/007.yaml
  text: Lift up your heads[a], O gates, and be lifted up, O ancient doors, that the King of glory may come in.
translation:
  language: ta
  text: 'வாசல்களே, உங்கள் தலைகளை உயர்த்துங்கள்!


    பழமையான கதவுகளே[a], உயர்த்தப்படுங்கள்!


    மகிமையின் அரசர் உள்ளே வரட்டும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நித்தியக் கதவுகளே.” எபிரெயச் சொற்றொடர் நெடுங்காலத் தொன்மையையோ என்றும் நிலைத்திருக்கும் தன்மையையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאוּ
  choice: உயர்த்துங்கள்
  rationale: נשׂא என்பதன் ஆண்பால் பன்மை ஏவல் வடிவம். உயிரூட்டிப் பேசப்படும் வாசல்களை நோக்கிய வலிமையான கட்டளையை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: שְׁעָרִים
  choice: வாசல்களே
  rationale: நகரம் அல்லது ஆலயத்தின் பெரிய நுழைவுவாசல்களைக் குறிக்கும் சொல்லுக்கு இயல்பான தமிழ் இணை; அழைப்புவேற்றுமை நேரடி உரையாடலை வெளிப்படுத்துகிறது.
- source_word: רָאשֵׁיכֶם
  choice: உங்கள் தலைகளை
  rationale: எபிரெயச் சொல்லின் நேரடியான உருவகத்தைப் பாதுகாக்கிறது. ‘மேற்பகுதிகளை’ என்று கட்டடவியல் விளக்கமாக மாற்றாமல், வாசல்களுக்கு உயிரூட்டும் கவித்துவப் படிமத்தைத் தக்கவைக்கிறது.
- source_word: וְהִנָּשְׂאוּ
  choice: உயர்த்தப்படுங்கள்
  rationale: נשׂא என்பதன் நிஃபால் ஏவல் வடிவத்திலுள்ள செயப்பாட்டு நுணுக்கத்தையும் முதல் அடியுடனான கவிதை எதிரொலியையும் தக்கவைக்கிறது.
- source_word: פִּתְחֵי עוֹלָם
  choice: பழமையான கதவுகளே
  rationale: פִּתְחֵי என்பது இணைவரியிலுள்ள ‘வாசல்கள்’ என்பதற்கு ஒத்த நுழைவுக் கதவுகளைக் குறிக்கிறது. עוֹלָם இங்கு தொன்மையான நீண்ட காலத்தைக் குறிக்கலாம்; நிலையான அல்லது நித்திய காலத்தையும் குறிக்கக்கூடிய மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְיָבֹא
  choice: உள்ளே வரட்டும்
  rationale: முன்னுள்ள ஏவல்களின் நோக்கம் அல்லது விளைவாக அரசர் நுழைவதைத் தமிழில் சுருக்கமாகவும் கவித்துவமாகவும் வெளிப்படுத்துகிறது; நிகழ்வை வெறும் உறுதியான எதிர்காலமாக மட்டும் கட்டுப்படுத்தவில்லை.
- source_word: מֶלֶךְ הַכָּבוֹד
  choice: மகிமையின் அரசர்
  rationale: எபிரெயக் கட்டமைப்பை பட்டப்பெயராகத் தக்கவைத்து, அதன் உயர்ந்த துதிப்பாங்கைப் பாதுகாக்கிறது.
theological_decisions:
- issue: வாசல்களுக்கும் கதவுகளுக்கும் உயிரூட்டும் கவித்துவத்தையும் அரச நுழைவுக் காட்சியையும் விளக்கத்தால் குறுக்காமல் பாதுகாப்பது
  choice: வாசல்களையும் கதவுகளையும் நேரடியாக அழைத்து, அவற்றின் ‘தலைகளை’ உயர்த்தும்படி கூறும் படிமம் தக்கவைக்கப்பட்டது.
  alternative: ‘வாசல்களைத் திறவுங்கள்’ என்று பொருள் விளக்கமாக மொழிபெயர்த்தல்.
  rationale: மூல எபிரெயம் வாசல்களையும் கதவுகளையும் நேரடியாக அழைத்து அவற்றின் ‘தலைகள்’ பற்றிப் பேசுகிறது. குறிப்பிட்ட வரலாற்று அல்லது மேசியா சார்ந்த விளக்கத்தை மொழிபெயர்ப்புக்குள் சேர்க்காமல், சங்கீதத்தின் கவித்துவ மற்றும் வழிபாட்டு வலிமையை இது பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் உயர்ந்த கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘உயர்த்தப்படுங்கள்’ என்ற செயப்பாட்டு வடிவம் அன்றாட உரையில் அரிதாக இருந்தாலும், மூலத்தின் நிஃபால் வடிவத்தையும் வரிகளின் இணைநயத்தையும் காக்க வேண்டி தேர்ந்தெடுக்கப்பட்டது. அடிக்குறிப்பு குறியீடு தொடர்புடைய ‘பழமையான கதவுகளே’ என்பதன் உடனேயே வைக்கப்பட்டுள்ளது.
