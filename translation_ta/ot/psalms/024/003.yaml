  text: Who may ascend the mountain of Yahweh? And who may stand in his holy place?[a]
translation:
  language: ta
  text: யாவேயின் மலையில் ஏறத் தகுதியானவர் யார்? அவருடைய பரிசுத்த இடத்தில் நிற்கத் தகுதியானவர் யார்?[a]
  philosophy: optimal-equivalence
