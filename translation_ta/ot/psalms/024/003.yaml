    text: “மலை” என்பதற்குப் பதிலாக “குன்று” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் הַר இரு பொருள்களையும் தரக்கூடும்; இச்சங்கீதத்தில் வழக்கமான மொழிபெயர்ப்பாக “மலை” வைக்கப்பட்டுள்ளது.
