lexical_decisions:
- source_word: מִי
  choice: யார்
  rationale: தகுதியுடைய நபர் யார் என்று கேட்கும் வினாப்பெயரை இயல்பாகவும் சுருக்கமாகவும் தருகிறது.
- source_word: יַעֲלֶה
  choice: ஏறத் தகுதியானவர்
  rationale: עלה என்பதன் அடிப்படைப் பொருள் ‘மேலே ஏறு’. இச்சடங்கு-ஞானப் பாடல் சூழலில் வெறும் எதிர்காலச் செயலைவிட அணுகுவதற்கான தகுதியே கேள்வியாக இருப்பதால் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: בְהַר
  choice: மலையில்
  rationale: הַר என்பது ‘மலை’ அல்லது ‘குன்று’ எனப் பொருள்படும்; சீயோனையும் உயர்ந்த இறைவாசஸ்தலத்தையும் குறிக்கும் இச்சூழலில் ‘மலை’ இயல்பான முதன்மைத் தேர்வு.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெயத் திருப்பெயரான יהוה-ஐ ஒரு பட்டத்தால் மாற்றாமல், தமிழில் அறியப்பட்ட ஒலிபெயர்ப்பாகத் தருகிறது.
- source_word: וּמִי
  choice: யார்
  rationale: இணைநிலை இரண்டாம் கேள்வை இயல்பான தமிழ்க் கவிதை நடையில் தொடர்கிறது; ‘மேலும்’ என வெளிப்படையாகச் சேர்க்காவிட்டாலும் இணைப்பு தெளிவாக உள்ளது.
- source_word: יָקוּם
  choice: நிற்கத் தகுதியானவர்
  rationale: קום இங்கு ‘நில்’ என்ற பொருளில், இறைமுன்னிலையில் இடம்பிடித்து நிற்பதைக் குறிக்கிறது; கேள்வியின் தகுதி சார்ந்த நுணுக்கமும் காக்கப்படுகிறது.
- source_word: בִּמְקוֹם
  choice: இடத்தில்
  rationale: מָקוֹם என்பதன் பொதுவான ‘இடம்’ என்ற பொருளைத் தக்கவைத்து, ‘திருத்தலம்’ போன்ற கூடுதல் குறிப்பை உரைக்குள் திணிக்கவில்லை.
- source_word: קָדְשׁוֹ
  choice: அவருடைய பரிசுத்த
  rationale: மூன்றாம் நபர் ஆண்பால் ஒருமை உடைமை விகுதியையும் ‘பரிசுத்தம்/பரிசுத்தமானது’ என்ற பொருளையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יהוה என்ற இறைத்திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட இறைத்திருப்பெயர் நேரடியாக இருப்பதால், அதை ஒரு பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: இரு imperfect வினைகளின் வினாவியல் வலிமை
  choice: ஏறத் தகுதியானவர் / நிற்கத் தகுதியானவர்
  alternative: ஏறுவார் / நிற்பார்; ஏற முடிந்தவர் / நிற்க முடிந்தவர்
  rationale: இவ்வசனம் வெறும் எதிர்காலச் செயல் அல்லது உடல் திறனை அல்ல, யாவேயின் முன்னிலையை அணுகி அங்கு நிற்பதற்கான தகுதியைக் கேட்கிறது. அதேவேளை, அந்தத் தகுதியை இவ்வசனமே வரையறுப்பதாகக் கூடுதல் கருத்து சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில் கண்ணியமான, பொதுவாசகருக்குப் புரியும் நடை. இணையான இரு வினாக்களின் அமைப்பு காக்கப்பட்டுள்ளது. ‘பரிசுத்த இடம்’ என்பது மூலத்தின் பொதுத்தன்மையைப் பேணுகிறது; ‘ஆலயம்’ அல்லது ‘திருத்தலம்’ என்று மிகையாகக் குறிப்பாக்கப்படவில்லை.
