  language: ta
  text: 'அவரைத் தேடுகிறோரின் தலைமுறை இதுவே;

    யாக்கோபே, உமது முகத்தை நாடுகிறோர் இவர்களே.[a]

    சேலா'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “யாக்கோபே” என்பது எபிரெய உரையின் நேரடி வாசிப்பு. சில பழங்கால மொழிபெயர்ப்புகள், “யாக்கோபின் கடவுளுடைய முகத்தை நாடுகிறவர்கள்” எனப் பொருள்படும் வாசிப்பைக் கொண்டுள்ளன.
    reason: மசோரா உரையின் கடினமான ‘யாக்கோபே’ வாசிப்பையும், உரைமரபில் காணப்படும் முக்கிய மாற்றையும் வாசகருக்குத் தெரிவிக்கிறது.
lexical_decisions:
- source_word: זֶה דּוֹר
  choice: தலைமுறை இதுவே
  rationale: ‘இது தலைமுறை’ என்ற எபிரெயச் சொல்லமைப்பை இயல்பான நவீனத் தமிழில் தருகிறது; முந்தைய வசனத்தில் விவரிக்கப்பட்ட பண்புகளைக் கொண்ட மக்களைக் குறிக்கிறது.
- source_word: דֹּרְשָׁיו
  choice: அவரைத் தேடுகிற
  rationale: மசோரா உரையின் மூன்றாம் நபர் ஒருமை பின்னொட்டைக் காத்து, அடுத்த அடியில் வரும் இரண்டாம் நபர் ‘உமது’ என்பதுடன் உள்ள நபர்மாற்றத்தைச் சீராக்காமல் வைத்திருக்கிறது.
- source_word: מְבַקְשֵׁי פָנֶיךָ
  choice: உமது முகத்தை நாடுகிறவர்கள்
  rationale: ‘முகத்தை நாடுதல்’ என்ற எபிரெய உருவகத்தைப் பாதுகாக்கிறது; இது ஒருவரின் முன்னிலையையும் அருளையும் நாடுவதை உணர்த்தலாம்.
- source_word: יַעֲקֹב
  choice: யாக்கோபே
  rationale: மசோரா உரையில் உள்ள ‘யாக்கோபு’ என்பதைக் கூப்பிடும் விளியாக நேரடியாகக் காட்டுகிறது; உரையில் இல்லாத ‘கடவுள்’ என்ற சொல்லைச் சேர்க்கவில்லை.
- source_word: סֶלָה
  choice: சேலா
  rationale: பொருள் உறுதியாகத் தெரியாத சங்கீதக் குறியீட்டை மொழிபெயர்க்காமல் ஒலிபெயர்க்கிறது.
theological_decisions:
- issue: ‘யாக்கோபு’ என்பதன் இலக்கணத் தொடர்பும் பழைய உரைமரபுகளின் வேறுபாடும்
  choice: ‘யாக்கோபே’ என்று மசோரா உரையை அதன் சிரமத்துடன் காத்தல்
  alternative: ‘யாக்கோபின் கடவுளுடைய முகத்தை’ அல்லது ‘யாக்கோபின் கடவுளே, உமது முகத்தை’
  rationale: கொடுக்கப்பட்ட WLC உரை ‘கடவுள்’ என்ற சொல்லைக் கொண்டிருக்கவில்லை. ஆகவே வாசிப்பை இறையியல் ரீதியாக எளிதாக்குவதற்காக அந்தச் சொல்லை முதன்மை உரையில் சேர்க்காமல், முக்கியமான மாற்று வாசிப்பை அடிக்குறிப்பில் தெரிவிக்கிறது.
