  source_fidelity: மூல எபிரேயத்தின் எதிர்கால வினைச்சொல், ‘ஆசீர்வாதம்’ என்ற ஒருமை, யாவேவிடமிருந்து/மீட்பின் கடவுளிடமிருந்து என்ற இரட்டை மூலக் குறிப்புகள், மற்றும் צְדָקָה-வின் திறந்த பொருள்வீச்சு அனைத்தும் துல்லியமாகப் பாதுகாக்கப்பட்டுள்ளன. ‘பெறுவான்’ என்பது יִשָּׂא என்பதற்கு இச்சூழலில் இயல்பானதும் பொருத்தமானதும் ஆகும்.
  naturalness: நடை நவீனத் தரத் தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது. இரண்டு இணை உறுப்புகளின் வரிப்பிரிப்பு சங்கீதக் கவிதைநடைக்கு ஏற்றது. ‘தன் மீட்பின் கடவுள்’ சற்றே செறிவான கட்டமைப்பாக இருந்தாலும், மூலத்தின் ‘his salvation’ என்ற உறவைக் காக்கிறது; பொருள் இயல்பாகப் புரிகிறது.
  terminology: ‘யாவே’, ‘ஆசீர்வாதம்’, ‘மீட்பு’, ‘நீதி’ ஆகிய சொற்கள் மூலத்திற்கும் இலக்கு மொழியின் சமய/கவிதை நடைக்கும் பொருத்தமானவை. அடிக்குறிப்பு ‘நீதி’ என்பதை அறநீதி ஒன்றாக மட்டுப்படுத்தாமல் சாதகத் தீர்ப்பு மற்றும் நியாயம் என்ற மாற்றுவாய்ப்புகளைச் சரியாகக் காக்கிறது.
