id: PSA.24.5
reference: Psalms 24:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: יִשָּׂ֣א בְ֭רָכָה מֵ/אֵ֣ת יְהוָ֑ה וּ֝/צְדָקָ֗ה מֵ/אֱלֹהֵ֥י יִשְׁעֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/024/005.yaml
  text: He will receive blessing from Yahweh[a], and righteousness from the God of his salvation.
translation:
  language: ta
  text: 'அவன் யாவேவிடமிருந்து ஆசீர்வாதத்தையும்,

    தன் மீட்பின் கடவுளிடமிருந்து நீதியையும்[a] பெறுவான்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நீதி” என்பதற்கு “நீதியானவர் என்ற சாதகத் தீர்ப்பு” அல்லது “நியாயம்” என்றும் பொருள் கொள்ளலாம். எபிரேயச் சொல் அறநீதியோடு நீதித்தீர்ப்பு மற்றும் மீட்பு சார்ந்த பொருள் நிழல்களையும் கொண்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשָּׂא
  choice: பெறுவான்
  rationale: נָשָׂא என்பதன் அடிப்படைப் பொருள் ‘தூக்குதல்/சுமத்தல்’ என்றாலும், ‘ஆசீர்வாதம்’ போன்ற கருத்துப்பொருளுடன் வரும்போது ‘பெறுதல்’ என்பது இயல்பான சூழற்பொருள்.
- source_word: בְרָכָה
  choice: ஆசீர்வாதம்
  rationale: எபிரேய ஒருமையைத் தக்கவைத்து, கடவுள் அருளும் நன்மையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: מֵאֵת יְהוָה
  choice: யாவேவிடமிருந்து
  rationale: מֵאֵת மூலத்தைக் குறிக்கிறது; יהוה என்பது பொதுப்பட்டப் பெயராக மாற்றப்படாமல் ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וּצְדָקָה
  choice: நீதியையும்
  rationale: צְדָקָה அறநீதி, நியாயம், சாதகமான நீதித்தீர்ப்பு ஆகிய பொருள் நிழல்களைக் கொண்டது. ‘நீதி’ அதன் பரந்த பொருளைத் தக்கவைக்கிறது; பிற சாத்தியங்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: מֵאֱלֹהֵי יִשְׁעוֹ
  choice: தன் மீட்பின் கடவுளிடமிருந்து
  rationale: ‘அவனுடைய மீட்பின் கடவுள்’ என்ற எபிரேய இணைப்பைத் தமிழில் சுருக்கமாகத் தக்கவைத்து, கடவுள் மீட்பின் மூலமும் மீட்புச் செயலைச் செய்பவருமாக இருப்பதற்கான பொருள் வாய்ப்பைத் திறந்துவைக்கிறது.
- source_word: יִשְׁעוֹ
  choice: தன் மீட்பு
  rationale: יֵשַׁע இங்கு விடுதலை அல்லது வெற்றியையும் குறிக்கக்கூடும்; ‘மீட்பு’ சங்கீதத்தின் இறையியல் நடைக்கு ஏற்றதாய் இருந்து அதன் பரந்த காப்பாற்றும் பொருளையும் கொண்டுள்ளது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் வரும் உடன்படிக்கைப் பெயரைப் பொதுப்பட்டப் பெயராக மாற்றாமல் ஒலிபெயர்ப்பது அதன் தனிப்பெயர்த் தன்மையைப் பாதுகாக்கிறது.
- issue: צְדָקָה என்பதன் சூழற்பொருள்
  choice: நீதி
  alternative: நீதியானவர் என்ற சாதகத் தீர்ப்பு; நியாயம்
  rationale: வழிபடத் தகுதியுள்ளவன் கடவுளிடமிருந்து பெறுவதை வசனம் கூறுகிறது. ‘நீதி’ என்பது அறநிலை, நீதித்தீர்ப்பின் மூலம் கிடைக்கும் நியாயநிறுவல், மீட்பளிக்கும் நியாயம் ஆகியவற்றில் ஒன்றை மட்டும் கட்டாயப்படுத்தாமல் எபிரேயச் சொல்லின் இறையியல் அழுத்தத்தைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. மூல எபிரேயத்தின் இரு இணை உறுப்புகளும் வரிப்பிரிப்பால் தெளிவாக்கப்பட்டுள்ளன; மரபுச் சொற்களான ‘ஆசீர்வாதம்’, ‘மீட்பு’, ‘நீதி’ சாதாரண வாசகர்களுக்குப் புரியும் அளவில் தக்கவைக்கப்பட்டுள்ளன.
