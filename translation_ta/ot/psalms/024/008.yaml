  text: מִ֥י זֶה֮ מֶ֤לֶךְ הַ/כָּ֫ב֥וֹד יְ֭הוָה עִזּ֣וּז וְ/גִבּ֑וֹר יְ֝הוָ֗ה גִּבּ֥וֹר מִלְחָמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/024/008.yaml
  text: Who is this King of glory? Yahweh[a], strong and mighty; Yahweh, mighty in battle.
translation:
  language: ta
  text: மாட்சிமையின் அரசர் இவர் யார்? வலிமைமிக்கவரும் வல்லவருமான யாவே; போரில் வல்லவரான யாவே[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “போரில் வல்லமையுள்ளவர்.”
    reason: גִּבּוֹר מִלְחָמָה என்ற சொற்றொடருக்கான நெருங்கிய சொற்பொருள் மாற்று.
lexical_decisions:
- source_word: מִי זֶה
  choice: இவர் யார்?
  rationale: எபிரெயக் கேள்வியின் நேரடியான, வழிபாட்டு அழைப்பு–பதில் தன்மையை இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: מֶלֶךְ הַכָּבוֹד
  choice: மாட்சிமையின் அரசர்
  rationale: பெயர்ச்சொல் இணைப்பைத் தக்கவைத்து, இதை வெறும் ‘மாட்சிமையான அரசர்’ என்ற பெயரடைக் குறிப்பாக மாற்றாமல் பட்டப்பெயரின் வலிமையைப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரை ஒரு பொதுப் பட்டத்தால் மாற்றாமல், எபிரெய நான்கெழுத்துத் திருப்பெயரின் தமிழாக்க ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: עִזּוּז
  choice: வலிமைமிக்கவர்
  rationale: உடையாத வலிமை அல்லது ஆற்றல் என்ற பொருளைத் தெளிவாகக் காட்டி, அடுத்து வரும் גִבּוֹר என்பதிலிருந்து சொல்வேறுபாட்டையும் காக்கிறது.
- source_word: וְגִבּוֹר
  choice: வல்லவர்
  rationale: வல்லமையுள்ளவர் அல்லது வீரர் என்ற பொருளைத் தருகிறது; இவ்விடத்தில் போரைக் குறிப்பாக முன்கூட்டியே சேர்க்காமல் இணைநிலையைப் பாதுகாக்கிறது.
- source_word: גִּבּוֹר מִלְחָמָה
  choice: போரில் வல்லவர்
  rationale: ‘வல்லவர்’ மற்றும் ‘போர்’ ஆகிய இரு கூறுகளையும் இயல்பான தமிழில் நேரடியாகத் தக்கவைக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூலவசனம் இறைவனின் தனிப்பட்ட திருப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. ஆகவே பொதுப் பட்டமான ‘ஆண்டவர்’ என்பதற்குப் பதிலாக அதன் வழக்கமான தமிழ் ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது; ‘யெகோவா’ என்பது வேறொரு மரபுவழி ஒலிவடிவம்.
translation_notes:
  register: நவீனத் தரத் தமிழில், வழிபாட்டு மறுமொழிக்கேற்ற சுருக்கமும் கண்ணியமும் பேணப்பட்டுள்ளது. ‘அரசர்’ என்பது இன்றைய வாசகர்களுக்குத் தெளிவான சொல்லாகவும், ‘மாட்சிமை’ என்பது כָּבוֹד என்பதன் பெருமை, கனம், மகிமை ஆகிய நிழற்பொருள்களை ஏந்தும் சொல்லாகவும் தேர்ந்தெடுக்கப்பட்டது.
