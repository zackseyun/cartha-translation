source:
  edition: WLC
  text: שְׂא֤וּ שְׁעָרִ֨ים רָֽאשֵׁי/כֶ֗ם וּ֭/שְׂאוּ פִּתְחֵ֣י עוֹלָ֑ם וְ֝/יָבֹא מֶ֣לֶךְ הַ/כָּבֽוֹד׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/024/009.yaml
  text: Lift up your heads[a], O gates, and be lifted up, O ancient doors, that the King of glory may come in.
translation:
  language: ta
  text: 'வாசல்களே, உங்கள் தலைகளை உயர்த்துங்கள்;

    தொன்மையான கதவுகளே[a], உயருங்கள்;

    மகிமையின் அரசர் உள்ளே வரட்டும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என்றும் நிலைக்கும் கதவுகளே.” எபிரேயச் சொற்றொடர் மிகப் பழமையான கதவுகளையோ நீடித்த காலம் நிலைக்கும் கதவுகளையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאוּ
  choice: உயர்த்துங்கள்
  rationale: வாசல்களிடம் கூறப்படும் பன்மை ஏவலை நேரடியாகக் காட்டுகிறது; மூலத்தின் உயிரோட்டமான உருவகத்தையும் காக்கிறது.
- source_word: שְׁעָרִים
  choice: வாசல்களே
  rationale: நகரம் அல்லது ஆலயத்தின் நுழைவாயில்களைக் குறிக்கும் இயல்பான தமிழ்ச் சொல்; விளிப்பை வெளிப்படுத்த ‘-களே’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: רָאשֵׁיכֶם
  choice: உங்கள் தலைகளை
  rationale: ‘உங்கள் தலைகள்’ என்ற மூல உருவகத்தை கட்டடவியல் விளக்கமாக மாற்றாமல் அப்படியே பாதுகாக்கிறது.
- source_word: וּשְׂאוּ
  choice: உயருங்கள்
  rationale: இரண்டாம் ஏவலின் கவிதை இணைநிலையைத் தக்கவைத்து, உயிரற்ற கதவுகள் நேரடியாக அழைக்கப்படும் உருவகத்திற்கு இயல்பான தமிழை வழங்குகிறது.
- source_word: פִּתְחֵי עוֹלָם
  choice: தொன்மையான கதவுகளே
  rationale: עוֹלָם இங்கு நெடுங்காலம், தொன்மை அல்லது என்றும் நிலைத்திருத்தல் ஆகிய பொருட்களைத் தரலாம். ‘தொன்மையான’ என்பது சூழலுக்கு இயல்பான முதன்மைத் தேர்வு; மற்ற சாத்தியம் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: וְיָבֹא
  choice: உள்ளே வரட்டும்
  rationale: முந்தைய ஏவல்களின் நோக்கம் அல்லது விளைவாக அரசர் நுழைவதைத் தமிழில் இயல்பாகவும், எபிரேய வினையின் விருப்ப/விளைவு நுணுக்கத்துடனும் காட்டுகிறது.
- source_word: מֶלֶךְ הַכָּבוֹד
  choice: மகிமையின் அரசர்
  rationale: இணைப்புத் தொடரை நேரடியாகப் பாதுகாத்து, சங்கீதத்தின் உயர்ந்த பட்டப்பெயரையும் அதன் மறுபயன்பாட்டையும் காக்கிறது.
theological_decisions:
- issue: வாசல்களுக்கு ‘தலைகள்’ இருப்பதாகக் கூறும் உருவகத்தையும் உயிரூட்டலையும் காப்பதா
  choice: ‘வாசல்களே, உங்கள் தலைகளை உயர்த்துங்கள்’ என்று உருவகத்தை முதன்மை உரையில் வைத்தல்
  alternative: ‘வாசல்களே, அகலத் திறவுங்கள்’ என்று கட்டடவியல் பொருளில் பொழிப்புரை செய்தல்
  rationale: எபிரேயம் ‘தலைகள்’ என்று வெளிப்படையாகக் கூறி வாசல்களை உயிருள்ளவையாக அழைக்கிறது. இதை வைத்திருப்பது மூலத்தின் கவிதை மற்றும் வழிபாட்டுச் செறிவைக் காக்கிறது.
- issue: פִּתְחֵי עוֹלָם என்பதில் עוֹלָם என்பதன் காலப் பொருள்
  choice: முதன்மை உரையில் ‘தொன்மையான கதவுகள்’
  alternative: ‘என்றும் நிலைக்கும் கதவுகள்’
  rationale: இச்சொல் தொன்மையையும் நீடித்த காலத்தையும் குறிக்கக்கூடும். கட்டடச் சூழலில் ‘தொன்மையான’ இயல்பாக உள்ளது; ஆயினும் நித்திய அல்லது நீடித்த காலப் பொருள் உண்மையான மாற்று என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் உயர்ந்த கவிதை நடையைப் பயன்படுத்துகிறது. ‘வாசல்களே’, ‘கதவுகளே’ என்ற நேரடி விளிப்புகளும் வரி அமைப்பும் எபிரேய இணைநிலையையும் வழிபாட்டுத் தொனியையும் காக்கின்றன.
