id: PSA.24.10
reference: Psalms 24:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: מִ֤י ה֣וּא זֶה֮ מֶ֤לֶךְ הַ/כָּ֫ב֥וֹד יְהוָ֥ה צְבָא֑וֹת ה֤וּא מֶ֖לֶךְ הַ/כָּב֣וֹד סֶֽלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/024/010.yaml
  text: Who is this King of glory? Yahweh of hosts—he is the King of glory[b][a]. Selah
translation:
  language: ta
  text: 'இந்த மகிமையின் அரசர் யார்?


    படைகளின் யாவே—


    அவரே மகிமையின் அரசர். சேலா[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சேலா’ என்பது இசை அல்லது வழிபாட்டு நிகழ்வைக் குறிக்கும் குறிப்பாக இருக்கலாம்; அதன் துல்லியமான பொருள் உறுதியாகத் தெரியவில்லை.
    reason: cultural_note
lexical_decisions:
- source_word: מִי הוּא זֶה
  choice: இவர் யார்?
  rationale: வினாப்பெயர், சுட்டுப்பெயர் ஆகியவற்றின் வலியுறுத்தலை இயல்பான நவீனத் தமிழில் வினாவாகப் பாதுகாக்கிறது.
- source_word: מֶלֶךְ הַכָּבוֹד
  choice: மகிமையின் அரசர்
  rationale: எபிரேய இணைப்புச் சொற்றொடரின் அமைப்பையும் כָּבוֹד என்பதன் ‘மகிமை/மாண்பு’ பொருளையும் காக்கிறது; தெய்வீகப் பட்டமாக dignified Tamil-ல் ‘அரசர்’ இயல்பாக உள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது பொதுப்பட்டமல்ல, இஸ்ரவேலின் கடவுளுடைய தனிப்பெயர்; தமிழில் பரவலாக அறியப்பட்ட ஒலிபெயர்ப்பான ‘யாவே’ பயன்படுத்தப்படுகிறது.
- source_word: צְבָאוֹת
  choice: படைகளின்
  rationale: இச்சொல் படைத்திரள்கள் அல்லது விண்ணுலகப் படைகள் என்ற பரந்த கருத்தைத் தாங்க முடியும்; குறிப்பிட்ட ஒன்றாகச் சுருக்காமல் மூலத்தின் பன்மைத் தன்மையைப் பாதுகாக்கிறது.
- source_word: הוּא
  choice: அவரே
  rationale: வெளிப்படையாக உள்ள வலியுறுத்தும் சுட்டுப்பெயரை தமிழில் ‘அவரே’ எனத் தெரிவிக்கிறது; மூலத்தில் இல்லாத ‘அவர் மட்டுமே’ என்ற கூடுதல் தனித்தன்மையைச் சேர்க்கவில்லை.
- source_word: סֶלָה
  choice: சேலா
  rationale: துல்லியமான பொருள் உறுதியாகத் தெரியாததால் விளக்கிப் பொருள் நிர்ணயிக்காமல் ஒலிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் பட்டத்திற்குப் பதிலாகத் தனிப்பெயர் இருப்பதால் அதை ஒலிபெயர்த்து அதன் தனிப்பெயர்த் தன்மையைப் பாதுகாக்கிறது.
- issue: יְהוָה צְבָאוֹת என்ற பட்டத்தின் பரப்பு
  choice: படைகளின் யாவே
  alternative: சேனைகளின் யாவே
  rationale: צְבָאוֹת என்பதைக் குறிப்பாக மனித இராணுவங்களுக்கு மட்டும் கட்டுப்படுத்தாமல், படைத்திரள்கள் என்ற பரந்த பொருளுடன் விடுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; கவிதைநயமும் வழிபாட்டுக்குரிய கண்ணியமும் காக்கப்பட்டுள்ளன. ‘இவர்’ மற்றும் ‘அவரே’ மரியாதையையும் எபிரேய வலியுறுத்தலையும் இயல்பாக வெளிப்படுத்துகின்றன. மூலத்தில் இல்லாத விளக்கத்தை வசனத்திற்குள் சேர்க்காமல், ‘சேலா’ பற்றிய உறுதியின்மை அடிக்குறிப்பில் தெரிவிக்கப்பட்டுள்ளது.
