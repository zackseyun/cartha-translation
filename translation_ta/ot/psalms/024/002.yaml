source:
  edition: WLC
  text: כִּי ה֭וּא עַל יַמִּ֣ים יְסָדָ֑/הּ וְ/עַל נְ֝הָר֗וֹת יְכוֹנְנֶֽ/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/024/002.yaml
  text: For he founded it upon the seas[a], and established it upon the rivers.
translation:
  language: ta
  text: ஏனெனில், அவரே அதை கடல்களின் மேல் அடித்தளமிட்டார்; ஆறுகளின் மேல் அதை நிலைநிறுத்தினார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்தின் உரிமைக் கூற்றுக்கான காரணத்தை அறிமுகப்படுத்துகிறது; தமிழில் இயல்பான காரண இணைப்பாக அமைகிறது.
- source_word: הוּא
  choice: அவரே
  rationale: தனியே வரும் எபிரெயச் சுட்டுப்பெயரின் வலியுறுத்தலை ‘-ஏ’ விகுதி இயல்பாக வெளிப்படுத்துகிறது; கடவுளைக் குறிக்கும் மரியாதைப் பன்மையும் தக்கவைக்கப்படுகிறது.
- source_word: עַל יַמִּים
  choice: கடல்களின்மேல்
  rationale: עַל என்பதன் ‘மேல்’ என்ற இடப்பொருளையும், יַמִּים என்பதன் பன்மையான ‘கடல்கள்’ என்பதையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: יְסָדָהּ
  choice: அதைக் ... அடித்தளமிட்டு
  rationale: יסד என்பதன் அடித்தளம் அமைத்தல் என்ற உருவகத்தைத் தெளிவாக வெளிப்படுத்துகிறது; பெண்பால் ஒருமை பின்னொட்டு முந்தைய வசனத்திலுள்ள பூமியைக் குறிக்கும் ‘அதை’ என மொழிபெயர்க்கப்படுகிறது.
- source_word: וְעַל נְהָרוֹת
  choice: ஆறுகளின்மேல்
  rationale: கவிதை இணைநிலையைப் பேணி, נְהָרוֹת என்பதன் வழக்கமான பொருளான ‘ஆறுகள்’ என்பதைத் தக்கவைக்கிறது.
- source_word: יְכוֹנְנֶהָ
  choice: அதை ... நிலைநிறுத்தினார்
  rationale: כון என்பதிலுள்ள உறுதியாக அமைத்தல் அல்லது நிலைப்படுத்துதல் என்ற பொருளை இயல்பான தமிழில் தருகிறது; יסד உடனான சொற்பொருள் வேறுபாடும் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: பூமி கடல்களின்மேலும் ஆறுகளின்மேலும் நிறுவப்பட்டதாகக் கூறும் படைப்பியல் உருவகம்
  choice: கவிதைசார் பண்டைய உலகக் காட்சியின் மொழியை நேரடியாகத் தக்கவைத்தல்
  alternative: அதை வெறும் உருவகமான உறுதிப்பாடு என விளக்குதல் அல்லது நவீன அறிவியல் மொழிக்கேற்ப மாற்றியுரைத்தல்
  rationale: மூலவசனம் படைப்பை ஆண்டவர் ஒழுங்குபடுத்தியதை நீர்நிலைகளின்மேல் பூமியை நிறுவும் உருவகத்தால் கூறுகிறது. மொழிபெயர்ப்பு அந்த உருவகத்தைத் தணிக்காமலும் அறிவியல் விளக்கமாக மாற்றாமலும் பாதுகாக்க வேண்டும்.
translation_notes:
  register: நவீனத் தரத் தமிழ்; பொதுவாசகர்களுக்குப் புரியும் இயல்பான, கண்ணியமான கவிதைநடை. ‘அவரே’ மூலத்தின் வலியுறுத்தலைக் காட்டுகிறது; ‘அடித்தளமிட்டு / நிலைநிறுத்தினார்’ என்ற இணை அமைப்பு எபிரெயக் கவிதையின் பொருள் வேறுபாட்டையும் இணைநிலையையும் தக்கவைக்கிறது.
