review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the causal כִּי, the emphatic independent pronoun, the plural ‘seas’ and ‘rivers,’ and the two distinct verbs for founding and making firm. The ancient cosmological imagery is retained without interpretive modernization.
  naturalness: The first verbal expression, ‘அடித்தளமிட்டு,’ is participial and makes the first Hebrew finite verb subordinate to the second. Two finite Tamil clauses more clearly preserve the Hebrew poetic parallelism and read more naturally in this register.
  terminology: ‘கடல்கள்,’ ‘ஆறுகள்,’ ‘அடித்தளமிட்டார்,’ and ‘நிலைநிறுத்தினார்’ are suitable modern-standard Tamil choices. The honorific ‘அவரே’ appropriately conveys both reverence and the source emphasis.
  issues:
