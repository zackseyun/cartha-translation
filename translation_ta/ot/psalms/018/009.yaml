- from: அவர் வானங்களை வளைத்து இறங்கி வந்தார்; காரிருள்[a] அவருடைய கால்களுக்குக் கீழே இருந்தது.
  to: அவர் வானங்களை வளைத்து இறங்கி வந்தார்; அடர்ந்த இருள்[a] அவருடைய கால்களுக்குக் கீழே இருந்தது.
  rationale: The revision changes only the rendering of עֲרָפֶל from “காரிருள்” to the clearer modern-standard expression “அடர்ந்த இருள்.” This maintains the source’s theophanic density and ambiguity, while the footnote retains the viable dark-cloud and poetic-darkness alternatives. No theological interpretation has been added or softened.
