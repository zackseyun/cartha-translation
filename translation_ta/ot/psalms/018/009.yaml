lexical_decisions:
- source_word: וַיֵּט
  choice: வளைத்து
  rationale: נטה என்பதன் சாய்த்தல் அல்லது வளைத்தல் என்ற இயக்கப் படிமத்தைத் தக்கவைக்கிறது; இறங்குவதற்காக வானங்களைத் தாழ்த்தும் கவித்துவக் காட்சியை இயல்பான தமிழில் தருகிறது.
- source_word: שָׁמַיִם
  choice: வானங்களை
  rationale: எபிரெயப் பன்மையைப் பேணி, கவித்துவமான பரந்த விண்ணுலகப் படிமத்தை வெளிப்படுத்துகிறது.
- source_word: וַיֵּרַד
  choice: இறங்கி வந்தார்
  rationale: ירד குறிக்கும் மேலிருந்து கீழ்நோக்கிய இயக்கத்தை இயல்பாகவும் தெய்வீகச் செயலைக் குறிக்கும் மரியாதை நடையிலும் தருகிறது.
- source_word: וַעֲרָפֶל
  choice: காரிருள்
  rationale: ערפל குறிக்கும் அடர்ந்த, ஆழ்ந்த இருளைச் செறிவாக வெளிப்படுத்துகிறது; அதை மேகம் என்று தேவையின்றி குறிப்பாக்கவில்லை.
- source_word: תַּחַת
  choice: கீழே
  rationale: நேரடியான இடவுறவை நவீன தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: רַגְלָיו
  choice: அவருடைய கால்கள்
  rationale: மூலத்தின் நேரடியான உடலுறுப்பு உருவகத்தையும் பன்மையையும் விளக்கவுரையின்றித் தக்கவைக்கிறது.
theological_decisions:
- issue: மனித உருவில் சித்தரிக்கப்படும் இறைத்தோற்றக் காட்சி
  choice: கடவுள் வானங்களை வளைத்து இறங்கி வருவதையும், அவருடைய கால்களுக்குக் கீழே இருள் இருப்பதையும் தெளிவான உருவகங்களாகவே தக்கவைத்தல்.
  alternative: இறைத் தலையீட்டைப் பற்றிய அருவமான விளக்கமாக உருவகத்தை மென்மைப்படுத்துதல்.
  rationale: இது கவித்துவமான இறைத்தோற்ற மொழி. அதன் மனித உருவச் சித்தரிப்பையும் மர்மத் தன்மையையும் மொழிபெயர்ப்பு விளக்கி அகற்றாமல் பாதுகாக்க வேண்டும்.
translation_notes:
  register: நவீன, கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. “காரிருள்” செறிவான இறைத்தோற்றச் சூழலைக் காக்கிறது; மரியாதைப் பன்மை வினைமுற்றும் உடைமை வடிவமும் தமிழில் கடவுளைக் குறிக்கும் இயல்பான உயர்நடையை வழங்குகின்றன.
