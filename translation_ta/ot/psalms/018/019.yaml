lexical_decisions:
- source_word: וַיּוֹצִיאֵנִי
  choice: அவர் என்னைக் கொண்டுவந்தார்
  rationale: יצא என்பதன் ஹிஃபில் வடிவம் ‘வெளியே கொண்டுவருதல்’ என்ற காரணவினைப் பொருளைத் தருகிறது. தமிழில் இயல்பாகவும் விடுதலைக் காட்சியைப் பாதுகாக்கவும் ‘கொண்டுவந்தார்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: לַמֶּרְחָב
  choice: விசாலமான இடத்திற்கு
  rationale: מֶרְחָב என்பது அகலம், திறந்த வெளி, இடவசதி ஆகியவற்றைக் குறிக்கிறது; நெருக்கடிக்கும் கட்டுப்பாட்டிற்கும் எதிரான விடுதலை மற்றும் பாதுகாப்பின் உருவகத்தை ‘விசாலமான இடம்’ காக்கிறது.
- source_word: יְחַלְּצֵנִי
  choice: அவர் என்னை மீட்டார்
  rationale: חלץ என்பதன் பியேல் வடிவம் ‘வெளியே இழுத்தெடுத்தல், விடுவித்தல், மீட்டல்’ என்று பொருள்படும். ‘மீட்டார்’ என்பது நவீன தமிழில் இயல்பானதும் முந்தைய அடியின் விடுதலைப் பொருளுக்கு இணையானதும் ஆகும்.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: மீட்புக்கான காரணத்தை அறிமுகப்படுத்தும் காரண இணைப்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: חָפֵץ
  choice: பிரியமாயிருந்தார்
  rationale: חפץ என்பது விருப்பம், மகிழ்ச்சி, சாதகமான மனப்பான்மை ஆகியவற்றை வெளிப்படுத்துகிறது. ‘பிரியமாயிருந்தார்’ என்பது தனிப்பட்ட அன்பார்ந்த விருப்பத்தை இயல்பாகக் கூறுகிறது; அதற்கு மேல் ஒரு கோட்பாட்டு விளக்கத்தைச் சேர்ப்பதில்லை.
- source_word: בִּי
  choice: என்மேல்
  rationale: חפץ உடன் வரும் ב ஒருவர்மீது விருப்பம் அல்லது பிரியம் வைத்திருப்பதைக் குறிக்கிறது. தமிழில் ‘என்மேல் பிரியமாயிருந்தார்’ என்பது இயல்பான சொற்றொடர்.
theological_decisions:
- issue: இறுதி அடியில் கூறப்படும் இறை விருப்பத்தின் தன்மை
  choice: ஏனெனில் அவர் என்மேல் பிரியமாயிருந்தார்
  alternative: ஏனெனில் அவர் என்னைக் குறித்து மகிழ்ச்சியடைந்தார்; ஏனெனில் அவர் என்மேல் விருப்பமாயிருந்தார்
  rationale: எபிரெய உரை மீட்புக்கான காரணமாக இறைவனின் சாதகமான விருப்பத்தைக் கூறுகிறது; ஆனால் அதைத் தகுதி, உடன்படிக்கைத் தேர்வு, அல்லது அருள் போன்ற குறிப்பிட்ட கோட்பாட்டு முறையாக விளக்கவில்லை. மொழிபெயர்ப்பு அந்தத் திறந்த நிலையையும் இறையியல் இழுபறியையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதத்திற்கேற்ற கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. எபிரெய இணைவாக்கிய அமைப்பும் நெருக்கடியிலிருந்து விசாலத்திற்குக் கொண்டுவரும் உருவகமும் பாதுகாக்கப்பட்டுள்ளன. ‘பிரியமாயிருந்தார்’ என்பது புரிந்துகொள்ள எளிதான, உயர்வான பயன்பாடு; எந்தச் சமயப்பிரிவின் தனிப்பட்ட கோட்பாட்டையும் இறக்குமதி செய்யவில்லை.
