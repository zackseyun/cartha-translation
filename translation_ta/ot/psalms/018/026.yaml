  text: With the pure you show yourself pure[a], and with the crooked you show yourself twisted.
translation:
  language: ta
  text: தூயவரோடு நீர் தூயவராக வெளிப்படுகிறீர்; வளைந்தவரோடு நீர் வளைந்தவராக வெளிப்படுகிறீர்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, “வளைந்தவரோடு நீர் சாதுரியமாகச் செயல்படுகிறீர்,” அல்லது “வளைந்தவரை நீர் விஞ்சுகிறீர்.” எபிரெயத்தில் பரஸ்பரச் சொல்விளையாட்டு உள்ளது: வளைந்தவரின் வளைந்த வழியை எதிர்கொண்டு முறியடிக்கும் விதத்தில் கடவுள் அவரோடு செயல்படுகிறார்; கடவுளே ஒழுக்கத்தில் வளைந்தவர் ஆகிறார் என்பது பொருளல்ல.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָבָר
  choice: தூயவர்
  rationale: இந்தச் சொல் ஒழுக்கத் தூய்மையைக் குறிக்கிறது. ‘தூயவர்’ என்பது இயல்பான தமிழாகவும், அடுத்து அதே வேரிலிருந்து வரும் வினையுடனான எபிரெயச் சொல்விளையாட்டை ஓரளவு காக்கவும் அமைந்துள்ளது.
- source_word: תִּתְבָּרָר
  choice: தூயவராக வெளிப்படுகிறீர்
  rationale: 'התפעל வடிவம் இங்கு உறவுசார்ந்த தற்சுட்டு/விளைவு நுணுக்கத்தைக் கொண்டுள்ளது: தூயவரிடம் கடவுள் தம்மைத் தூயவராக வெளிப்படுத்துகிறார். ‘வெளிப்படுகிறீர்’ என்பது வெறும் நிலைமைக் கூற்றைவிட அந்த நுணுக்கத்தைப் பாதுகாக்கிறது.'
- source_word: עִקֵּשׁ
  choice: கோணலானவர்
  rationale: இந்தப் பெயரடை ஒழுக்கத்தில் நேர்மையற்ற, வளைந்த தன்மையுள்ள ஒருவரைக் குறிக்கிறது. ‘கோணலானவர்’ என்பது உருவகத்தையும் ஒழுக்கப் பொருளையும் தமிழில் காக்கிறது.
- source_word: תִּתְפַּתָּל
  choice: சிக்கலானவராக வெளிப்படுகிறீர்
  rationale: פתל என்ற வேரின் התפעל வடிவம் முறுக்கலாக அல்லது தந்திரமாக நடந்துகொள்வதைக் குறிக்கலாம். ‘சிக்கலானவராக வெளிப்படுகிறீர்’ என்பது அதிர்ச்சியூட்டும் எதிரொலியை ஓரளவு தக்கவைத்து, கடவுள் ஒழுக்கத்தில் கோணலானவர் ஆகிறார் என்று நேரடியாகச் சொல்லாமல் உறவுசார்ந்த வெளிப்பாட்டை உணர்த்துகிறது.
theological_decisions:
- issue: கோணலானவருக்கு கடவுள் அளிக்கும் பதிலை மனிதப் பண்பில் வருணித்தல்
  choice: ‘சிக்கலானவராக வெளிப்படுகிறீர்’ என்ற வலுவான பரஸ்பரச் சொல்லாட்சியை முதன்மை உரையில் வைத்தல்
  alternative: ‘சாதுரியமாக நடந்துகொள்கிறீர்’ அல்லது ‘கோணலானவரை விஞ்சுகிறீர்’
  rationale: எபிரெயக் கவிதை மனிதரின் பண்புக்கு ஏற்றபடி கடவுள் எதிர்கொள்வதைத் துணிவான பரஸ்பரச் சொல்லாட்சியால் கூறுகிறது. அதை முழுவதும் மென்மையாக்கினால் ‘தூயவர்/தூயவராக’ மற்றும் ‘கோணலானவர்/சிக்கலானவராக’ என்ற இணை அமைப்பும் இறையியல் பதற்றமும் மறையும். தவறான புரிதலைத் தவிர்க்க அடிக்குறிப்பு மாற்றுப் பொருளையும் வரம்பையும் விளக்குகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சங்கீதக் கவிதைக்கு ஏற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. கடவுளை நோக்கிய மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது. ‘தூயவர்/தூயவராக’ என்ற மீளுருவாக்கம் மூலத்தின் சொல்விளையாட்டைக் காக்கிறது; இரண்டாம் அடியின் கடினமான உருவகம் அடிக்குறிப்புடன் பாதுகாக்கப்பட்டுள்ளது.
