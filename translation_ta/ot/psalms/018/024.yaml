  yaml_path: translation/ot/psalms/018/024.yaml
  text: Yahweh repaid me according to my righteousness[b][a], according to the cleanness of my hands before his eyes.
translation:
  language: ta
  text: யாவே என் நீதிக்கு ஏற்ப எனக்குப் பிரதிபலன் அளித்தார்[a]; அவர் பார்வையில் என் கைகளின் தூய்மைக்கு ஏற்ப எனக்குப் பிரதிபலன் அளித்தார்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘எனக்குத் திருப்பிக் கொடுத்தார்’ அல்லது ‘எனக்கு ஈடு செய்தார்.’ எபிரெய வினைச்சொல் ஒருவருடைய நடத்தைக்கு ஏற்பத் திருப்பிக் கொடுப்பதையோ பிரதிபலன் அளிப்பதையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘என் கைகளின் தூய்மை’ என்பது குற்றமற்ற அல்லது நேர்மையான நடத்தையைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּשֶׁב
  choice: பிரதிபலன் அளித்தார்
  rationale: שׁוב என்பதன் ஹிஃபில் வடிவம் இங்கு לִי உடன் வந்து, ஒருவருடைய நடத்தைக்கு ஏற்ப திருப்பிச் செய்தல் அல்லது ஈடு செய்தல் என்ற பொருளைத் தருகிறது. ‘பிரதிபலன் அளித்தார்’ என்பது நல்ல பலனை மட்டும் குறுக்காமல், நடத்தைக்கு ஏற்ற பதிலளிப்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: திருநாமத்தை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் பரவலாக அறியப்படும் ‘யெகோவா’ என்ற பெயர்வடிவத்தில் தருகிறது.
- source_word: לִי
  choice: எனக்கு
  rationale: எபிரெய முன்னிடைச்சொல்லின் பெறுநர் பொருளை நேரடியாகவும் இயல்பாகவும் காக்கிறது.
- source_word: כְצִדְקִי
  choice: என் நீதிக்குத் தக்கபடி
  rationale: כְּ குறிக்கும் ஒத்திசைவு அல்லது அளவையும், צֶדֶק குறிக்கும் தனிப்பட்ட நேர்மை/நீதியையும் பாதுகாக்கிறது; சங்கீதக்காரரின் கூற்றை மென்மைப்படுத்தவில்லை.
- source_word: כְּבֹר יָדַי
  choice: என் கைகளின் தூய்மைக்குத் தக்கபடி
  rationale: בֹּר என்பதன் தூய்மை/சுத்தம் என்ற பொருளையும், ‘கைகள்’ என்ற எபிரெய உருவகத்தையும் காக்கிறது.
- source_word: לְנֶגֶד עֵינָיו
  choice: அவருடைய கண்களுக்கு முன்பாக
  rationale: ‘அவருடைய கண்கள்’ என்ற மூலத்தின் மனிதஉருவகச் சொல்லாட்சியைத் தக்கவைத்து, தெய்வீக மதிப்பீட்டின் முன்னிலையில் என்பதைக் காட்டுகிறது.
theological_decisions:
- issue: சங்கீதக்காரர் தன் நீதியையும் கைகளின் தூய்மையையும் கூறுவதை மென்மைப்படுத்த வேண்டுமா
  choice: அவருடைய நடத்தைக்கு ஏற்ப யெகோவா பிரதிபலன் அளித்தார் என்ற நேரடியான கூற்றைத் தக்கவைத்தல்
  alternative: ‘உடன்படிக்கை விசுவாசம்’ அல்லது ‘குறிப்பிட்ட விவகாரத்தில் குற்றமின்மை’ என்று விளக்கிப் பொழிப்புரை செய்தல்
  rationale: மூலம் ‘என் நீதி’ என்றும் ‘என் கைகளின் தூய்மை’ என்றும் வெளிப்படையாகக் கூறுகிறது. அதன் இறையியல் இழுவையை மொழிபெயர்ப்பு தீர்த்துவிடாமல் அப்படியே பாதுகாக்க வேண்டும்.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘நீதி’ மற்றும் ‘கைகளின் தூய்மை’ ஆகிய மூல உருவகங்களும் இறையியல் இழுவையும் பாதுகாக்கப்பட்டுள்ளன. அடிக்குறி [a] பிரதிபலன் என்ற சொல்லுக்கும், [b] முழு கைத் தூய்மை மரபுத்தொடருக்கும் இணைக்கப்பட்டுள்ளது.
