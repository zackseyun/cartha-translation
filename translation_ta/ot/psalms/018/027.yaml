base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/027.yaml
  text: For you save an afflicted people[b][a], but haughty eyes you bring low.
translation:
  language: ta
  text: 'ஏனெனில், துன்புறும் மக்களை[a] நீர் காப்பாற்றுகிறீர்;

    ஆனால் மேட்டிமையான கண்களை[b] தாழ்த்துகிறீர்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஏழை மக்களை” அல்லது “தாழ்மையான மக்களை.” எபிரெயச் சொல் பொருளாதார வறுமை, துன்பம் அல்லது தாழ்நிலை ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், “உயர்ந்த கண்கள்.” இது பெருமை அல்லது அகந்தையைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கருத்துக்கான காரணத்தையோ விளக்கத்தையோ அறிமுகப்படுத்துகிறது; சங்கீதத்தின் ஓட்டத்தில் காரணத் தொடர்பை இயல்பாகக் காட்டுகிறது.
- source_word: אַתָּה
  choice: நீர்
  rationale: தேவனைக் குறிக்கும் இரண்டாம் நபர் ஒருமை; நவீன மரியாதைத் தமிழில் ‘நீர்’ கண்ணியமாகவும் இயல்பாகவும் உள்ளது.
- source_word: עַם עָנִי
  choice: துன்புறும் மக்களை
  rationale: עָנִי என்பது வறுமை, ஒடுக்கம் அல்லது தாழ்நிலை ஆகியவற்றைக் குறிக்கலாம். மீட்பின் சூழலில் ‘துன்புறும்’ என்பது பொருளாதார வறுமைக்கு மட்டும் வரையறுக்காமல் அனுபவிக்கும் இடரை வெளிப்படுத்துகிறது.
- source_word: תוֹשִׁיעַ
  choice: காப்பாற்றுகிறீர்
  rationale: ישׁע என்பதன் ஹிஃபில் வடிவம் காப்பாற்றுதல் அல்லது விடுவித்தல் எனப் பொருள்படும்; இங்கு ‘காப்பாற்றுகிறீர்’ பரந்த மீட்புப் பொருளை இயல்பாகத் தருகிறது.
- source_word: וְעֵינַיִם רָמוֹת
  choice: ஆனால் மேட்டிமையான கண்களை
  rationale: וְ என்பது வடிவில் ‘மற்றும்’ என்றாலும், இணைவரி எதிர்மறை முரணைக் காட்டுவதால் ‘ஆனால்’ பொருத்தம். ‘உயர்ந்த கண்கள்’ என்ற எபிரெய உருவகத்தின் அகந்தைப் பொருளை ‘மேட்டிமையான கண்கள்’ காக்கிறது.
- source_word: תַּשְׁפִּיל
  choice: தாழ்த்துகிறீர்
  rationale: שׁפל என்பதன் ஹிஃபில் வடிவம் தாழ்த்துதல் அல்லது கீழிறக்குதல்; உயர்வான கண்களுக்கு எதிரான தாழ்த்தும் செயலை நேரடியாகக் காட்டுகிறது.
theological_decisions:
- issue: עָנִי என்பதன் பொருள்
  choice: துன்புறும் மக்கள்
  alternative: ஏழை மக்கள்; தாழ்மையான மக்கள்
  rationale: தேவன் இடரில் இருப்பவர்களைக் காப்பாற்றுவதையும் மேட்டிமையுள்ளவர்களைத் தாழ்த்துவதையும் வசனம் எதிரெதிராக வைக்கிறது. ‘துன்புறும்’ என்பது பொருளாதார நிலைக்கு மட்டும் சுருக்காமலும், இதை வெறும் உள்ளார்ந்த நற்குணமாக மாற்றாமலும் மூலச்சொல்லின் பரப்பை காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், தேவனை நோக்கி மரியாதை ஒருமையான ‘நீர்’ வடிவம் பயன்படுத்தப்பட்டது. கவிதை இணைவரியின் எதிர்மறை அமைப்பும் ‘காப்பாற்றுதல்/தாழ்த்துதல்’ என்ற முரணும் காக்கப்பட்டுள்ளன.
