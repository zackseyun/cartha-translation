lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: சுற்றியுள்ள துதிக்கும் நம்பிக்கைக்கும் காரணத்தை அறிமுகப்படுத்தும் இணைப்பாக இங்கு வருகிறது.
- source_word: תָּאִיר
  choice: ஒளிரச் செய்கிறீர்
  rationale: אור என்பதன் ஹிஃபில் வடிவிலுள்ள காரணவினைப் பொருளைத் தெளிவாகக் காக்கிறது; விளக்கு என்ற உருவகத்துடனும் இயல்பாகப் பொருந்துகிறது.
- source_word: נֵרִי
  choice: என் விளக்கை
  rationale: நேர் பொருளான ‘விளக்கு’ என்பதை வைத்திருப்பதால் செய்யுளின் தெளிவான உருவகம் சுருக்கப்பட்டு ‘ஒளி’ என்ற கருத்தாக்கமாக மாற்றப்படவில்லை.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֱלֹהַי
  choice: என் கடவுள்
  rationale: முதலாம் நபர் உடைமைத் தொடர்பை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: יַגִּיהַּ
  choice: வெளிச்சமாக்குகிறார்
  rationale: ஒளிரச் செய்தல் அல்லது பிரகாசமாக்குதல் என்ற காரணவினைப் பொருளை இயல்பான நவீன தமிழில் தருகிறது; முதல் அரையடியின் சொல்லாட்சியை அப்படியே மீண்டும் கூறுவதையும் தவிர்க்கிறது.
- source_word: חָשְׁכִּי
  choice: என் இருளை
  rationale: முதலாம் நபர் பின்னொட்டையும் கவித்துவ உருவகத்தையும் அப்படியே காக்கிறது; அது துன்பம், ஆபத்து அல்லது மனச்சோர்வு ஆகியவற்றில் எதைக் குறிக்கிறது என்பதை உரை தீர்மானிக்கவில்லை.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் பட்டப்பெயர் அல்ல, நான்கெழுத்து இறைத் திருப்பெயரே உள்ளது. ஆகவே அதை ‘கர்த்தர்’ என்று மாற்றாமல் ஒலிபெயர்த்து, தனிப்பட்ட உடன்படிக்கைப் பெயரைப் பாதுகாக்கிறது.
- issue: இரண்டாம் நபரிலிருந்து மூன்றாம் நபருக்கு மாறும் இலக்கண அமைப்பு
  choice: ‘நீரே ... செய்கிறீர்; யாவே ... வெளிச்சமாக்குகிறார்’ என்று நபர் மாற்றத்தைப் பாதுகாத்தல்
  alternative: முழு வசனத்தையும் நேரடி விளியாக மாற்றி ‘யாவே, என் கடவுளே, நீர் ... வெளிச்சமாக்குகிறீர்’ என எழுதுதல்
  rationale: எபிரெய மூலத்தில் אַתָּה/תָּאִיר இரண்டாம் நபரிலும், יַגִּיהַּ மூன்றாம் நபரிலும் உள்ளன. அதை ஒரே நபராகச் சீராக்காமல், செய்யுளின் உண்மையான இலக்கணத் திருப்பத்தைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கவிதைக்குரிய கண்ணியத்துடன் மொழிபெயர்க்கப்பட்டுள்ளது. ‘நீரே’ என்ற மரியாதை ஒருமையும் ‘யாவே’ என்ற இறைத் திருப்பெயரும் பயன்படுத்தப்பட்டுள்ளன. மூலத்தின் இரண்டாம் நபர்–மூன்றாம் நபர் மாற்றம் விளக்கமாகச் சீராக்கப்படாமல் பாதுகாக்கப்பட்டுள்ளது.
