source:
  edition: WLC
  text: כִּ֣י כָל מִשְׁפָּטָ֣י/ו לְ/נֶגְדִּ֑/י וְ֝/חֻקֹּתָ֗י/ו לֹא אָסִ֥יר מֶֽנִּ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/022.yaml
  text: For all his judgments were before me[a], and I did not put away his statutes from me.
translation:
  language: ta
  text: ஏனெனில், அவருடைய நீதித்தீர்ப்புகள் அனைத்தும் என் கண்முன் இருந்தன; அவருடைய சட்டங்களை நான் என்னிடமிருந்து அகற்றவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் அவருடைய சட்டங்களிலிருந்து விலகவில்லை.” எபிரெய வினைச்சொல்லை, சட்டங்களைத் தன்னிடமிருந்து அகற்றுவது என்றோ அவற்றிலிருந்து விலகுவது என்றோ புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தை அறிமுகப்படுத்தும் எபிரெய இணைப்புச்சொல்லின் விளக்கச் செயல்பாட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: כָל מִשְׁפָּטָיו
  choice: அவருடைய நீதித்தீர்ப்புகள் அனைத்தும்
  rationale: כָל என்பதன் முழுமையான பொருளையும், מִשְׁפָּטִים என்பதில் உள்ள நீதியியல் மற்றும் உடன்படிக்கை சார்ந்த நுணுக்கத்தையும் காக்கிறது.
- source_word: לְנֶגְדִּי
  choice: என் கண்முன்
  rationale: ‘எனக்கு முன்னால்’ என்பதோடு, அவற்றைத் தொடர்ந்து கவனத்தில் வைத்திருப்பதைக் குறிக்கும் எபிரெய உருவகத்தையும் இயல்பான தமிழில் தருகிறது.
- source_word: וְחֻקֹּתָיו
  choice: அவருடைய சட்டங்களை
  rationale: חֻקּוֹת என்பது நிலைநிறுத்தப்பட்ட கட்டளைகள் அல்லது சட்டவிதிகளைக் குறிக்கிறது; ‘சட்டங்கள்’ சாதாரண வாசகருக்குத் தெளிவாகவும் சூழலுக்கு ஏற்ற கண்ணியத்துடனும் உள்ளது.
- source_word: לֹא אָסִיר מֶנִּי
  choice: என்னிடமிருந்து அகற்றவில்லை
  rationale: הפעיל வடிவத்தின் நேரடி செயப்படுபொருள் கொண்ட பொருளை முன்னிறுத்தி, ‘என்னிடமிருந்து’ என்ற எபிரெய முன்னிடைத் தொடரையும் வெளிப்படையாகக் காக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘என் கண்முன்’ என்பது கவனத்தில் வைத்திருத்தல் என்ற உருவகத்தைத் தக்கவைக்கிறது; வினைச்சொல்லின் உண்மையான இருபொருள் வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
