source:
  edition: WLC
  text: וַ/יַּרְעֵ֬ם בַּ/שָּׁמַ֨יִם יְֽהוָ֗ה וְ֭/עֶלְיוֹן יִתֵּ֣ן קֹל֑/וֹ בָּ֝רָ֗ד וְ/גַֽחֲלֵי אֵֽשׁ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/013.yaml
  text: Yahweh thundered in the heavens[b][a], and the Most High gave his voice—hailstones and coals of fire.
translation:
  language: ta
  text: 'வானங்களில் யாவே இடிமுழங்கினார்;

    உன்னதமானவர் தமது குரலை எழுப்பினார்[a]—

    ஆலங்கட்டிகளும் நெருப்புத் தணல்களும்[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் நேரடியாக, “தமது குரலைக் கொடுத்தார்”; அல்லது, “தமது குரலை ஒலிக்கச் செய்தார்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “ஆலங்கட்டியும் நெருப்புத் தணல்களும்.” இங்கு ஒருமைச் சொல் கூட்டுப்பொருளில் வரலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְעֵם
  choice: இடிமுழங்கினார்
  rationale: רעם என்பது இங்குள்ள புயல்-இறைத்தோற்றச் சூழலில் பொதுவான கர்ஜனையை அல்ல, இடிமுழக்கத்தைக் குறிக்கிறது; அடுத்துள்ள ‘தமது குரலை எழுப்பினார்’ என்பதுடனும் இது இணைகிறது.
- source_word: בַּשָּׁמַיִם
  choice: வானங்களில்
  rationale: שׁמים வடிவில் பன்மையாக இருப்பதையும் உயர்ந்த கவிதை நடையையும் ‘வானங்களில்’ காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது ஒரு பட்டப்பெயர் அல்ல, இறைவனின் தனிப்பெயரான நான்கெழுத்துப் பெயர்; அதனைத் தமிழில் இயல்பான ஒலிபெயர்ப்பாக ‘யாவே’ என்று வழங்குகிறது.
- source_word: וְעֶלְיוֹן
  choice: உன்னதமானவர்
  rationale: עֶלְיוֹן என்ற இறைப் பட்டத்தைத் துல்லியமாகவும் தமிழில் நிலைபெற்ற உயர்நடையிலும் வெளிப்படுத்துகிறது.
- source_word: יִתֵּן קֹלוֹ
  choice: தமது குரலை எழுப்பினார்
  rationale: எபிரெயச் சொற்றொடர் நேரடியாக ‘தமது குரலைக் கொடுத்தார்’ எனினும், அதன் பொருளையும் இடிமுழக்கச் சூழலையும் இயல்பான தமிழில் ‘குரலை எழுப்பினார்’ எனத் தருகிறது; நேரடிச் சொல்லமைப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: בָּרָד
  choice: ஆலங்கட்டிகள்
  rationale: ஒருமை வடிவம் கூட்டுப்பொருளில் வரக்கூடும்; இங்கு கண்முன் நிற்கும் புயல் உருவகத்திற்கேற்ப அதன் தனித்த துகள்களை ‘ஆலங்கட்டிகள்’ வெளிப்படுத்துகிறது.
- source_word: וְגַחֲלֵי אֵשׁ
  choice: நெருப்புத் தணல்கள்
  rationale: மின்னல் அல்லது வேறு நிகழ்வு என்று மேலதிகமாக விளக்காமல், எபிரெயக் கவிதையின் தெளிவான தீத்தணல் உருவகத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை வழங்குதல்
  choice: யாவே
  alternative: யெகோவா
  rationale: மூலவசனம் நான்கெழுத்து இறைப்பெயரை நேரடியாகப் பயன்படுத்துகிறது; பட்டப்பெயரால் மாற்றாமல் தனிப்பெயராக ஒலிபெயர்க்கப்பட்டுள்ளது.
- issue: ‘ஆலங்கட்டிகளும் நெருப்புத் தணல்களும்’ என்பதற்கும் முந்தைய கூற்றுக்கும் உள்ள தொடர்பு
  choice: வினைச்சொல் சேர்க்காமல், நீண்ட கோட்டுக்குப் பின் திடீர் கவிதைத் தொடராக வைத்தல்
  alternative: ‘அவர் அனுப்பினார்’ அல்லது ‘அங்கே இருந்தன’ போன்ற மறைமுக வினைச்சொல்லைச் சேர்த்தல்
  rationale: எபிரெயத்தில் இவ்விரு புயல் கூறுகளுக்கும் வெளிப்படையான வினைச்சொல் இல்லை. நீண்ட கோடு அந்தத் திடீர், நீள்வட்டமான கவிதை அமைப்பைக் காக்கிறது; மூலத்தில் இல்லாத செயலைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதில் புரியும், ஆனால் சங்கீதக் கவிதைக்கேற்ற கண்ணியமான உயர்நடை பயன்படுத்தப்பட்டுள்ளது. இறைவனைக் குறிக்கும் வினைகள் மரியாதைப் பன்மையில் அமைந்துள்ளன. மூலத்தின் இரு இணை அடிகளும் இறுதியிலுள்ள திடீர் வினையற்ற தொடரும் வரிப்பிரிப்பாலும் நீண்ட கோட்டாலும் பாதுகாக்கப்பட்டுள்ளன.
