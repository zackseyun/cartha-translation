  text: לְ/שֵׁ֣מַֽע אֹ֭זֶן יִשָּׁ֣מְעוּ לִ֑/י בְּנֵֽי נֵ֝כָ֗ר יְכַחֲשׁוּ לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/044.yaml
  text: At the hearing of the ear they obey me[c][b][a]; foreigners feign obedience to me.
translation:
  language: ta
  text: கேள்விப்பட்டவுடனே அவர்கள் எனக்குக் கீழ்ப்படிகிறார்கள்[a]; அந்நியர்கள்[b] பாசாங்காக எனக்குப் பணிகிறார்கள்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதை, “கேட்டவுடனே அவர்கள் எனக்குக் கீழ்ப்படிகிறார்கள்” என்றும் மொழிபெயர்க்கலாம். எபிரேயத்தில் சொல்லர்த்தமாக, “காதின் கேள்வியில்” என்று உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: எபிரேயத்தில் சொல்லர்த்தமாக, “அந்நியத்தின் மகன்கள்” அல்லது “அந்நிய நாட்டின் மக்கள்.”
    reason: lexical_alternative
  - marker: c
    text: இறுதி வரியை, “எனக்குப் பொய் சொல்கிறார்கள்,” “அஞ்சி எனக்கு அடங்குகிறார்கள்,” அல்லது “பாசாங்கான கீழ்ப்படிதலுடன் எனக்குப் பணிகிறார்கள்” என்றும் மொழிபெயர்க்கலாம். இது விருப்பமற்ற அல்லது உண்மையற்ற பணிவைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְשֵׁמַע אֹזֶן
  choice: காதால் கேட்டவுடனே
  rationale: எபிரேயச் சொற்றொடர் சொல்லர்த்தமாக ‘காது கேட்கும்போது’ எனும் உருவகத்தைக் கொண்டிருந்தாலும், கேட்ட உடனேயே ஏற்படும் பதிலை இயல்பான நவீனத் தமிழில் இவ்வாறு வெளிப்படுத்துகிறது.
- source_word: יִשָּׁמְעוּ לִי
  choice: அவர்கள் எனக்குக் கீழ்ப்படிகிறார்கள்
  rationale: שׁמע என்பதுடன் לி வரும்போது வெறுமனே கேட்பதைவிட ‘செவிகொடுத்து கீழ்ப்படிதல்’ என்ற பொருள் கொள்ளலாம்; அரச வெற்றிச் சூழலில் இதுவே பொருத்தமானது.
- source_word: בְּנֵי נֵכָר
  choice: அந்நியர்கள்
  rationale: சொல்லர்த்தமாக ‘அந்நியத்தின் மகன்கள்’ அல்லது ‘அந்நிய நாட்டின் மக்கள்’ என்ற எபிரேய மரபுத்தொடரைத் தமிழில் இயல்பாகவும் தெளிவாகவும் குறிக்கிறது.
- source_word: יְכַחֲשׁוּ לִי
  choice: எனக்கு வஞ்சகமாகப் பணிகிறார்கள்
  rationale: כחש என்பதன் பியல் வடிவம் பொய், வஞ்சனை, மறுத்தல் ஆகிய கருத்துகளைத் தரலாம்; வெற்றிகொள்ளப்பட்டோர் சூழலில் உள்ளார்ந்த உண்மையில்லாத அல்லது கட்டாயமான பணிவை இத்தேர்வு வெளிப்படுத்துகிறது.
theological_decisions:
- issue: அந்நியர்களின் கீழ்ப்படிதல் உண்மையானதா அல்லது போலியானதா
  choice: வஞ்சகமான பணிவு
  alternative: எனக்குப் பொய் சொல்கிறார்கள் / அஞ்சி அடங்குகிறார்கள்
  rationale: மூல வினைச்சொல்லின் வஞ்சனை சார்ந்த நுணுக்கத்தையும், முதல் அடியின் ‘கீழ்ப்படிதல்’ என்பதுடன் உள்ள பதற்றத்தையும் தக்கவைக்கிறது; அவர்களின் உள்ளார்ந்த நோக்கத்தை அதற்கு மேல் திட்டவட்டமாக நிர்ணயிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதத்திற்கேற்ற கண்ணியமான ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் நடை. எபிரேய உருவகம் பிரதான வரியில் அளவோடு இயல்பாக்கப்பட்டு, அதன் சொல்லர்த்த வடிவமும் மாற்று நுணுக்கங்களும் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
