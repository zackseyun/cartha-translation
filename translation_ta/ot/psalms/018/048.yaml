  text: the one who rescues me from my enemies[a]; indeed, you lift me up above those who rise against me[c][b]; you deliver me from the violent man.
translation:
  language: ta
  text: என் எதிரிகளிடமிருந்து என்னை விடுவிப்பவரே[a], மேலும், எனக்கு எதிராக எழுகிறவர்களைவிட என்னை உயர்த்துகிறீர்[b]; வன்முறை செய்கிற மனிதனிடமிருந்து என்னைக் காப்பாற்றுகிறீர்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் எதிரிகளிடமிருந்து என்னை விடுவிப்பவர்.” எபிரெயத்தில் தொடக்கச் சொல் பங்கேற்புவினை வடிவில் உள்ளது; அது கடவுளுக்குரிய பட்டப்பெயர்போல் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “எனக்கு எதிராக எழுகிறவர்களுக்குமேல் என்னை மேன்மைப்படுத்துகிறீர்.”
    reason: lexical_alternative
  - marker: c
    text: சொல்லர்த்தமாக, “வன்முறையின் மனிதனிடமிருந்து.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מְפַלְּטִי
  choice: என்னை விடுவிப்பவரே
  rationale: פלט என்ற வேரிலிருந்து வந்த பங்கேற்புவினை வடிவம் முதலாம் நபர் ஒருமை பின்னொட்டுடன், கடவுளை நேரடியாக அழைக்கும் பட்டப்பெயர்போல் செயல்படுகிறது. இத்தமிழாக்கம் அந்தத் தொடர்ச்சியான பண்பையும் நேரடி அழைப்பையும் இயல்பாகப் பாதுகாக்கிறது.
- source_word: מֵאֹיְבַי
  choice: என் எதிரிகளிடமிருந்து
  rationale: מִן முன்னிடைச்சொல்லும், முதலாம் நபர் ஒருமை உடைமைப் பின்னொட்டுடன் உள்ள אֹיֵב என்பதன் பன்மை வடிவமும் நேரடியாக வெளிப்படுத்தப்படுகின்றன.
- source_word: אַף
  choice: ஆம்
  rationale: அடுத்த கூற்றை வெறுமனே இணைக்காமல் வலியுறுத்தும் முன்னேற்றத்தைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: מִן קָמַי
  choice: எனக்கு எதிராக எழுகிறவர்களைவிட
  rationale: קום என்பதன் வடிவம் சங்கீதக்காரருக்கு எதிராக எழும் ஆட்களைக் குறிக்கிறது. רום உடன் வரும் מִן ஒப்பீட்டுப் பொருள் தருவதால், ‘விட’ என்பது அவர்களுக்குமேல் உயர்த்தப்படுவதைத் தெளிவாக்குகிறது.
- source_word: תְּרוֹמְמֵנִי
  choice: என்னை உயர்த்துகிறீர்
  rationale: רום என்பதன் causative பொருளையும் உயரம் பற்றிய கவிதைப் படிமத்தையும், தேவையற்ற விளக்கமின்றி இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: מֵאִישׁ חָמָס
  choice: வன்முறையாளனிடமிருந்து
  rationale: אִישׁ ஒருமை ஆண்பாலில் ஒரு மனிதனைக் குறிக்கிறது; חָמָס வன்முறை அல்லது கொடுமையைக் குறிக்கிறது. சுருக்கமான தமிழ் வடிவம் வன்முறை செய்கிற ஆண் ஒடுக்குபவனைச் சுட்டுகிறது.
- source_word: תַּצִּילֵנִי
  choice: என்னைக் காப்பாற்றுகிறீர்
  rationale: נצל ஆபத்திலிருந்து மீட்பதை அல்லது காப்பாற்றுவதை குறிக்கிறது. தொடக்கத்திலுள்ள פלט என்பதற்கு ‘விடுவி’ பயன்படுத்தப்பட்டதால், இரு எபிரெய வினைகளின் சொற்பொருள் வேறுபாடு ஓரளவு காக்கப்படுகிறது.
theological_decisions:
- issue: வசனத்தின் தொடக்கப் பங்கேற்புவினையின் குறிப்பு மற்றும் நேரடி அழைப்பு
  choice: கடவுளை நேரடியாக அழைக்கும் பட்டப்பெயராக, ‘என்னை விடுவிப்பவரே’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: முந்தைய வசனத்துடன் இணையும் தொடர்புச் சொல்லாக்கமாக அமைத்தல்.
  rationale: எபிரெயத்தில் கடவுளை விவரிக்கும் பெயர்ச்சொல் தன்மையுள்ள பங்கேற்புவினையிலிருந்து இரண்டாம் நபர் வினைகளுக்கு இயல்பான நகர்வு உள்ளது. நேரடி அழைப்பு இந்தக் கவிதை அமைப்பைப் பாதுகாக்கிறது.
- issue: אִישׁ என்பதன் பாலினமும் எண்ணும்
  choice: ஒருமை ஆண்பாலை உணர்த்தும் ‘வன்முறையாளன்’ பயன்படுத்தப்பட்டது.
  alternative: பாலினப் பொதுமையுள்ள ‘வன்முறை புரியும் நபர்’.
  rationale: மூலத்தின் ஒருமை ஆண்பால் வடிவத்தைத் தமிழில் இயன்றவரை பாதுகாக்கிறது; சூழலில் இது வன்முறை புரியும் ஓர் ஒடுக்குபவனைக் குறிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதத்திற்கேற்ற கண்ணியமான நேரடி அழைப்பு நடை பயன்படுத்தப்பட்டுள்ளது. ‘விடுவிப்பவரே,’ ‘உயர்த்துகிறீர்,’ ‘காப்பாற்றுகிறீர்’ என்ற சொற்கள் கவிதை இணைப்பையும் மூலத்திலுள்ள வினை வேறுபாடுகளையும் காக்கின்றன; பழமையான அல்லது சமயப் பிரிவுக்கே உரிய சொற்கள் தவிர்க்கப்பட்டுள்ளன.
