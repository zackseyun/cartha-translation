- from: என் எதிரிகளிடமிருந்து என்னை விடுவிப்பவரே[a], ஆம், எனக்கு எதிராக எழுகிறவர்களைவிட என்னை உயர்த்துகிறீர்[b]; வன்முறையாளனிடமிருந்து என்னைக் காப்பாற்றுகிறீர்[c].
