  text: From the brightness before him his clouds passed on—hail and coals of fire[a].
translation:
  language: ta
  text: அவருக்கு முன்புள்ள ஒளிவீச்சிலிருந்து அவருடைய மேகங்கள் கடந்துசென்றன—ஆலங்கட்டியும் நெருப்புத் தணல்களும்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவருடைய அடர்ந்த மேகங்கள் கடந்துசென்றன; ஆலங்கட்டியும் நெருப்புத் தணல்களும்.” எபிரெய வாசகம் செறிவான கவிதை நடையில் இருப்பதால், புயல் காட்சியைச் சற்றே வேறுபட்ட முறைகளில் வெளிப்படுத்த முடியும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנֹּגַהּ
  choice: ஒளிப்பிரகாசத்திலிருந்து
  rationale: נֹגַהּ என்பது பிரகாசம் அல்லது ஒளிவீச்சைக் குறிக்கிறது; முன்னொட்டு מִן மூலத்தைச் சுட்டுவதால் ‘-இலிருந்து’ என மொழிபெயர்க்கப்பட்டது.
- source_word: נֶגְדּוֹ
  choice: அவருக்கு முன்பிருந்த
  rationale: נֶגֶד + 3ஆம் ஆண்பால் ஒருமை பின்னொட்டு இடஞ்சார்ந்த ‘அவருக்கு முன்பு’ என்ற பொருளைத் தருகிறது; ‘பிரசன்னம்’ போன்ற விரிவாக்கம் தவிர்க்கப்பட்டது.
- source_word: עָבָיו
  choice: அவருடைய கார்மேகங்கள்
  rationale: עָב என்பது அடர்ந்த மேகத்திரளைக் குறிக்கிறது. நவீன தமிழில் ‘கார்மேகங்கள்’ என்பது அதன் அடர்த்தியையும் புயல் காட்சியையும் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: עָבְרוּ
  choice: கடந்துசென்றன
  rationale: Qal பன்மை வினை ‘கடந்து சென்றன/நகர்ந்து சென்றன’ எனப் பொருள்படும்; மேகங்களின் இயக்கத்தை இயல்பாகக் காட்டுகிறது.
- source_word: בָּרָד
  choice: ஆலங்கட்டி
  rationale: இது வானிலையைக் குறிக்கும் வழக்கமான சொல்லான ‘hail’; தமிழில் ‘ஆலங்கட்டி’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: וְגַחֲלֵי אֵשׁ
  choice: நெருப்புத் தணல்களும்
  rationale: கட்டமைப்பு நேரடியாக ‘நெருப்பின் தணல்கள்’ என்பதாகும்; ‘நெருப்புத் தணல்கள்’ கவித்துவப் படிமத்தைக் காத்து இயல்பான தமிழாக அமைகிறது.
theological_decisions:
- issue: புயலின் வழியாக வெளிப்படும் இறைத்தோற்றக் கவிப்படிமம்
  choice: இறைவனின் வெளிப்பாட்டைச் சித்தரிக்கும் புயல் படிமங்களை அவற்றின் செறிவோடு தக்கவைத்தல்
  alternative: இதைப் போர்வெற்றிக்கான வெறும் உருவகமாகச் சுருக்குதல் அல்லது ஒவ்வொரு கூறையும் சொல்லளவில் நிகழ்ந்த வானிலை அற்புதமாக விரித்துரைத்தல்
  rationale: எபிரெயக் கவிதை இறைவனின் தோற்றத்தைப் புயல் காட்சிகளால் சித்தரிக்கிறது; அவை சொல்லளவானவையா உருவகமானவையா என்ற பதற்றத்தை மொழிபெயர்ப்பு தீர்மானிக்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘கார்மேகங்கள்’, ‘நெருப்புத் தணல்கள்’ ஆகியவை மூலத்தின் புயல் காட்சியையும் செறிவையும் காக்கின்றன; வாக்கியத்தின் தொடர்பிலுள்ள உண்மையான தெளிவின்மை அடிக்குறிப்பில் பதிவு செய்யப்பட்டுள்ளது.
