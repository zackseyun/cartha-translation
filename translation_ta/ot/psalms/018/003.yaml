source:
  edition: WLC
  text: מְ֭הֻלָּל אֶקְרָ֣א יְהוָ֑ה וּ/מִן אֹ֝יְבַ֗/י אִוָּשֵֽׁעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/003.yaml
  text: I call on Yahweh[a], who is worthy to be praised[b], and I am saved from my enemies.
translation:
  language: ta
  text: புகழுக்குரிய யாவேவை[a] நான் நோக்கிக் கூப்பிடுகிறேன்; என் எதிரிகளிடமிருந்து நான் காப்பாற்றப்படுகிறேன்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘யாவே’ என்பது எபிரெய மொழியிலுள்ள YHWH என்ற இறைபெயரைக் குறிக்கிறது.
    reason: alternative_reading
  - marker: b
    text: அல்லது, ‘என் எதிரிகளிடமிருந்து நான் காப்பாற்றப்படுவேன்.’ எபிரெய வினைச்சொல்லை எதிர்காலப் பொருளிலும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְהֻלָּל
  choice: புகழுக்குரிய
  rationale: הלל என்பதன் செயலப்பாட்டு எச்சவடிவம் இங்கு யாவேவைப் பற்றிய மதிப்பீட்டுப் பொருளில் வருகிறது. வெறும் ‘புகழப்பட்ட’ என்பதைவிட ‘புகழுக்குரிய’ என்பது அந்தப் பொருளை இயல்பான தமிழில் தெளிவாகத் தருகிறது.
- source_word: אֶקְרָא
  choice: நான் நோக்கிக் கூப்பிடுகிறேன்
  rationale: இறைபெயருடன் வரும் קרא, உதவி வேண்டி இறைவனை அழைப்பதைக் குறிக்கிறது. ‘நோக்கிக் கூப்பிடுகிறேன்’ என்பது மன்றாட்டின் திசையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் பட்டப்பெயர் அல்ல, YHWH என்ற தனிப்பட்ட இறைபெயரே உள்ளது; ஆகவே அது ‘யாவே’ என ஒலிபெயர்க்கப்படுகிறது.
- source_word: וּמִן
  choice: ; … இடமிருந்து
  rationale: וּ இணைப்பு இரு கவிதை அடிகளையும் தொடர்புபடுத்துகிறது; מִן விடுவிக்கப்படும் மூலத்தைச் சுட்டுகிறது. தமிழில் அரைப்புள்ளி இயல்பான இணைப்பைத் தருகிறது; காரணவிளைவைத் தேவையின்றி வலியுறுத்துவதில்லை.
- source_word: אֹיְבַי
  choice: என் எதிரிகள்
  rationale: אֹיֵב என்பதுடன் முதலாம் நபர் ஒருமை உடைமைப் பின்னொட்டு சேர்ந்துள்ளதை நேரடியாகவும் தெளிவாகவும் மொழிபெயர்க்கிறது.
- source_word: אִוָּשֵׁעַ
  choice: நான் காப்பாற்றப்படுகிறேன்
  rationale: ישׁע என்பதன் நிபால் முற்றாப்பெயர் வடிவம் இங்கு பொதுவான அல்லது நம்பிக்கையுடனான விளைவைச் சுட்டக்கூடும். ‘காப்பாற்றப்படுகிறேன்’ என்பது செயலப்பாட்டையும் இரட்சிப்பு/விடுதலைப் பொருளையும் காக்கிறது; எதிர்காலப் பொருளும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைபெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூல உரை YHWH என்ற தனிப்பட்ட இறைபெயரை நேரடியாகப் பயன்படுத்துகிறது. பட்டப்பெயரால் மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்ப்பது மூலத்தின் வடிவத்தையும் தனிப்பெயர் இயல்பையும் காக்கிறது.
- issue: אִוָּשֵׁעַ என்பதன் கால/நிலைப் பொருள்
  choice: 'நிகழ்காலப் பொதுமை அல்லது விளைவு: ‘காப்பாற்றப்படுகிறேன்’'
  alternative: 'எதிர்காலம்: ‘காப்பாற்றப்படுவேன்’'
  rationale: எபிரெய முற்றாப்பெயர் வடிவம் கவிதைச் சூழலில் பொதுவான நம்பிக்கை அறிக்கையாகவோ எதிர்கால நிச்சயமாகவோ புரிந்துகொள்ளப்படலாம். முதன்மை உரை பொதுமையான அறிக்கையைத் தருகிறது; உண்மையான எதிர்கால மாற்றுவாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கவிதைக்குரிய கண்ணியத்துடனும் பொதுவாசகர்களுக்குப் புரியும் நடையிலும் அமைக்கப்பட்டுள்ளது. ‘புகழுக்குரிய’ என்ற முன்னிலை அமைப்பு எபிரெயச் சொல்லொழுங்கின் வலியுறுத்தலை ஓரளவு காக்கிறது; இறுதி வினையின் காலத் தெளிவின்மை அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
