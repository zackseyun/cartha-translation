  text: הָ֭/אֵל הַ/מְאַזְּרֵ֣/נִי חָ֑יִל וַ/יִּתֵּ֖ן תָּמִ֣ים דַּרְכִּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/032.yaml
  text: The God who girds me with strength and makes my way blameless[a][b].
translation:
  language: ta
  text: என்னை வல்லமையால் இடைக்கட்டுகிற தேவன் என் வழியைச் குற்றமற்றதாக்குகிறார்[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என்னை வல்லமையால் ஆயத்தப்படுத்துகிறவர்.” எபிரெய மொழியில் “இடைகட்டுதல்” என்ற உருவகம் உள்ளது; חָיִל என்பது வலிமை, வல்லமை அல்லது வீரத்திறன் எனப் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “என் வழியை முழுமையானதாக/நிறைவானதாக ஆக்குகிறார்.” תָּמִים என்பது முழுமை, நேர்மை அல்லது குற்றமின்மை ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵל
  choice: இறைவன்
  rationale: எபிரெயச் சொல்லில் சுட்டுப்பொருள் இருந்தாலும், தமிழில் ‘அந்த இறைவன்’ என்பது இங்கு இயல்பற்றதாக இருக்கும். ‘இறைவன்’ என்பது குறிப்பிட்ட தேவனைச் சுட்டும் விளக்கத் தொடரின் இயல்பையும் மேன்மையான நடையையும் காக்கிறது.
- source_word: הַמְאַזְּרֵנִי
  choice: என்னை ... இடைகட்டுகிற
  rationale: אזר என்பதன் அடிப்படை உருவகமான ‘இடையைச் சுற்றிக் கட்டுதல்’ என்பதைப் பாதுகாக்கிறது; செயலுக்காக ஆயத்தப்படுத்துதல் என்ற கருத்தும் இதில் உள்ளது.
- source_word: חָיִל
  choice: வல்லமையால்
  rationale: חיל என்பது வலிமை, வல்லமை, வீரத்திறன் ஆகிய பொருள்களைக் கொள்ளலாம். போர்ச் சூழலுக்கும் தெய்வீக ஆற்றலூட்டலுக்கும் ‘வல்லமை’ இயல்பாகப் பொருந்துகிறது.
- source_word: וַיִּתֵּן
  choice: '... ஆக்குகிறார்'
  rationale: נתן என்பதன் வழக்கமான பொருள் ‘கொடுத்தல்’ என்றாலும், இங்கு பெயரடையுடன் சேர்ந்து விளைவை உண்டாக்கும் பொருளில் வருகிறது; தமிழில் ‘ஆக்குகிறார்’ என்பது அந்தத் தொடரைத் தெளிவாக வழங்குகிறது.
- source_word: תָּמִים
  choice: குற்றமற்ற
  rationale: תמים என்பது முழுமை, நேர்மை, பழுதின்மை ஆகிய கருத்துகளைத் தாங்குகிறது. ‘குற்றமற்ற’ என்பது அறநெறிசார் அர்த்தத்தைப் பாதுகாத்து, தத்துவார்த்தமான முழுப் பரிபூரணத்தைத் தவிர்க்கிறது.
- source_word: דַּרְכִּי
  choice: என் வழி
  rationale: דרך என்பதன் வழி/வாழ்க்கைநெறி உருவகத்தை இயல்பான தமிழில் நேரடியாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: சங்கீதக்காரரின் வழியைப் பற்றிய תמים என்பதன் பொருள்
  choice: குற்றமற்ற
  alternative: முழுமையான / நிறைவான
  rationale: இது பாவமே இல்லாத முழுப் பரிபூரணத்தைத் திட்டவட்டமாகக் கூறுகிறது என்று விளக்காமல், தேவன் சங்கீதக்காரரின் வாழ்க்கை வழியை நேர்மையும் பழுதின்மையும் உடையதாக்குகிறார் என்ற பொருளைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதத்துக்கேற்ற கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘இடைகட்டுதல்’ என்ற மூல உருவகம் பிரதான உரையில் காக்கப்பட்டு, அதன் கருத்துப்பொருள் அடிக்குறிப்பில் தெளிவுபடுத்தப்பட்டுள்ளது. ‘குற்றமற்ற’ என்பது அறநெறிசார் பொருளை வழங்குகிறது; ‘முழுமையான/நிறைவான’ என்ற உண்மையான மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
