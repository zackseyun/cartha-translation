source:
  edition: WLC
  text: יִשְׁלַ֣ח מִ֭/מָּרוֹם יִקָּחֵ֑/נִי יַֽ֝מְשֵׁ֗/נִי מִ/מַּ֥יִם רַבִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/016.yaml
  text: He sent from on high[a]; he took me; he drew me out of many waters.
translation:
  language: ta
  text: உயரத்திலிருந்து அவர் அனுப்பினார்; அவர் என்னை எடுத்தார்; திரளான நீரிலிருந்து என்னை இழுத்தெடுத்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “பல நீரிலிருந்து.” இது ஒருவரை மூழ்கடிக்கும் கொடிய ஆபத்தைக் குறிக்கும் பொதுவான கவிதைப் படிமம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁלַח מִמָּרוֹם
  choice: உயரத்திலிருந்து அவர் தம் கையை நீட்டி
  rationale: יִשְׁלַח என்பதன் அடிப்படைப் பொருள் ‘அனுப்பினார்/நீட்டினார்.’ எதை அனுப்பினார் அல்லது நீட்டினார் என்பதை எபிரெய உரை வெளிப்படையாகக் கூறவில்லை. மீட்பை விவரிக்கும் இச்சூழலில் தமிழில் இயல்பாகவும் தெளிவாகவும் இருக்க ‘தம் கையை’ என்பது பொருளால் நிரப்பப்பட்டுள்ளது; ‘கீழே’ என்ற திசைச்சொல் மூலத்தில் இல்லாததால் சேர்க்கப்படவில்லை.
- source_word: מִמָּרוֹם
  choice: உயரத்திலிருந்து
  rationale: מָרוֹם என்பது உயரம் அல்லது உயர்ந்த இடத்தைக் குறிக்கிறது. ‘வானத்திலிருந்து’ என்று குறிப்பாக்காமல், மூலத்தின் உயர்நிலைப் படிமத்தை இது காக்கிறது.
- source_word: יִקָּחֵנִי
  choice: என்னைப் பிடித்தார்
  rationale: לקח என்பதன் பொதுப் பொருள் ‘எடுத்துக்கொள்.’ நீரிலிருந்து மீட்கும் சூழலில் ‘என்னைப் பிடித்தார்’ என்பது செயலின் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது; வன்முறையைக் குறிக்கும் ‘பற்றிப் பறித்தார்’ போன்ற வலுவான சொல்லாக்கம் தவிர்க்கப்பட்டுள்ளது.
- source_word: יַמְשֵׁנִי
  choice: என்னை வெளியே இழுத்தார்
  rationale: משׁה என்பதன் இவ்வடிவம் நீரிலிருந்து வெளியே இழுப்பதைக் குறிக்கிறது. ‘வெளியே இழுத்தார்’ என்பது படிமத்தையும் மீட்புச் செயலையும் தெளிவாகக் காக்கிறது.
- source_word: מִמַּיִם רַבִּים
  choice: பெருவெள்ளத்திலிருந்து
  rationale: சொல்லுக்கு சொல் ‘பல/திரளான நீரிலிருந்து.’ தமிழில் ‘பெருவெள்ளம்’ என்பது சூழ்ந்தழிக்கும் பெருநீரையும் அதனால் குறிக்கப்படும் கொடிய ஆபத்தையும் இயல்பாக வெளிப்படுத்துகிறது; நேரடி சொல்லாக்கம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
theological_decisions:
- issue: மீட்பு வரும் உயர்ந்த இடத்தை ‘வானம்’ என்று வெளிப்படையாகக் குறிப்பிடலாமா
  choice: ‘உயரத்திலிருந்து’ என்று வைத்து, ‘வானம்’ என்பதைச் சேர்க்கவில்லை.
  alternative: ‘வானத்திலிருந்து’
  rationale: எபிரெய உரை ‘உயரம்/உயர்ந்த இடம்’ என்றே கூறுகிறது. ஆகவே தெய்வீக உயர்நிலையை உணர இடமளித்தாலும், மூலத்தில் இல்லாத குறிப்பான அண்டவியல் சொல்லை மொழிபெயர்ப்பு சேர்க்கவில்லை.
- issue: יִשְׁלַח என்ற வினையின் சொல்லப்படாத பொருளைத் தமிழில் வெளிப்படுத்துவது
  choice: மீட்புச் சூழலின் அடிப்படையில் ‘தம் கையை நீட்டி’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘அவர் உயரத்திலிருந்து அனுப்பினார்’ அல்லது ‘அவர் உயரத்திலிருந்து நீட்டினார்’
  rationale: மூலத்தில் வினையின் பொருள் வெளிப்படையாக இல்லாததால் ஓரளவு ambiguity உள்ளது. ஆனால் தமிழில் பொருளில்லாத ‘அனுப்பினார்/நீட்டினார்’ முழுமையற்றதாக ஒலிக்கும். அடுத்துள்ள ‘என்னைப் பிடித்தார்’ என்பதுடன் இயல்பாக இணையும் குறைந்தபட்ச சூழல்சார் நிறைவு ‘தம் கையை’ ஆகும்; இது தனிப்பட்ட கோட்பாட்டைச் சேர்ப்பதல்ல.
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைக்குரிய கண்ணியத்தையும் சாதாரண வாசகருக்கான தெளிவையும் இணைக்கும் நடை. ‘பெருவெள்ளம்’ இயல்பான தமிழை வழங்குகிறது; அடிக்குறிப்பு எபிரெய மூலத்தின் பன்மை நீர்ப்படிமத்தைப் பாதுகாக்கிறது.
