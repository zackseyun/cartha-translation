  text: מְלַמֵּ֣ד יָ֭דַ/י לַ/מִּלְחָמָ֑ה וְֽ/נִחֲתָ֥ה קֶֽשֶׁת נְ֝חוּשָׁ֗ה זְרוֹעֹתָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/034.yaml
  text: He trains my hands for battle[a], and my arms can bend a bow of bronze.
translation:
  language: ta
  text: அவர் என் கைகளைப் போருக்குப் பயிற்றுவிக்கிறார்; என் புயங்களால் வெண்கல வில்லை வளைக்க முடிகிறது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இன்னும் சொற்சார்ந்த முறையில், “என் புயங்களால் வெண்கல வில் வளைக்கப்படுகிறது.” இந்த எபிரெயத் தொடர் கடினமானது; இதைச் செயப்பாட்டு வாக்கியமாகவும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: מְלַמֵּד
  choice: பயிற்றுவிக்கிறார்
  rationale: למד என்பதன் பங்கேற்புவினை வடிவம் ‘கற்பிக்கிறார்’ அல்லது ‘பயிற்றுவிக்கிறார்’ எனப் பொருள்படும். போர்ச் சூழலில் நடைமுறைத் தயாரிப்பைக் குறிக்க ‘பயிற்றுவிக்கிறார்’ என்பது இயல்பாகவும் மூலப்பொருளுக்கு உண்மையாகவும் உள்ளது.
- source_word: יָדַי
  choice: என் கைகளை
  rationale: ‘என் கைகள்’ என்ற பன்மை உடலுறுப்பு உருவகத்தைத் தெளிவாகத் தக்கவைக்கிறது; தமிழில் வினையின் நேர்செயப்படுபொருளாக வேற்றுமை உருபுடன் வழங்கப்பட்டுள்ளது.
- source_word: לַמִּלְחָמָה
  choice: போருக்கு
  rationale: מלחמה என்பது ‘போர்’ அல்லது ‘யுத்தம்’ என வரலாம். நவீன பொதுத் தமிழில் ‘போருக்கு’ இயல்பாகவும் இராணுவப் பொருளை முழுமையாகவும் தருகிறது.
- source_word: וְנִחֲתָה
  choice: வளைக்க முடிகிறது
  rationale: இந்த வினைவடிவமும் வாக்கிய அமைப்பும் கடினமானவை. சூழலில் கடவுள் அளித்த வலிமையால் வில்லை வளைக்கும் திறன் கிடைப்பதை இத்தேர்வு இயல்பான தமிழில் தெரிவிக்கிறது; மூலத்தின் சாத்தியமான செயப்பாட்டு வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: קֶשֶׁת
  choice: வில்லை
  rationale: ஆயுதத்தைக் குறிக்கும் வழக்கமான தமிழ்ச்சொல்; மூலத்தின் ஒருமை தக்கவைக்கப்பட்டுள்ளது.
- source_word: נְחוּשָׁה
  choice: வெண்கல
  rationale: இந்தச் சொல் செம்பு அல்லது வெண்கலத்தைக் குறிக்கலாம். வலிமையான ஆயுதத்தின் சூழலிலும் மரபான வேதாகம மொழிநடையிலும் ‘வெண்கலம்’ பொருத்தமானது.
- source_word: זְרוֹעֹתָי
  choice: என் புயங்களால்
  rationale: ‘என் புயங்கள்’ என்ற பன்மையைத் தக்கவைத்து, கைகளைவிட மேல்பகுதியான arms என்பதையும் வில் வளைக்கும் வலிமையின் உருவகத்தையும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: וְנִחֲתָה קֶשֶׁת נְחוּשָׁה זְרוֹעֹתָי என்ற கடினமான தொடரின் விளக்கம்
  choice: கடவுளால் அளிக்கப்பட்ட திறனை வெளிப்படுத்தும் வகையில், ‘என் புயங்களால் வெண்கல வில்லை வளைக்க முடிகிறது’
  alternative: ‘என் புயங்களால் வெண்கல வில் வளைக்கப்படுகிறது’ என்ற சொற்சார்ந்த செயப்பாட்டு வாசிப்பு
  rationale: எபிரெயத் தொடர் சுருக்கமானதும் இலக்கண ரீதியாகக் கடினமானதும் ஆகும். முதன்மை வாசிப்பு கவிதை இணைப்புக்கு ஏற்றபடி, போருக்குப் பயிற்றுவிக்கும் கடவுள் வலிமையையும் அளிக்கிறார் என்பதைத் தெரிவிக்கிறது. அதேவேளை, செயப்பாட்டு அமைப்பின் உண்மையான சாத்தியம் அடிக்குறிப்பில் விடப்பட்டுள்ளது; குறிப்பிட்ட அற்புத விளக்கத்தை உரையில் திணிக்கவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பாகவும் மதிப்புறு நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘பயிற்றுவிக்கிறார்’, ‘போர்’ ஆகியவை பொதுவாசகர்களுக்கு எளிதானவை; ‘புயங்கள்’ கவிதைநடையையும் ידים / זרועות என்ற உடலுறுப்பு வேறுபாட்டையும் காக்கிறது. கடினமான இரண்டாம் தொடருக்கான அடிக்குறிப்பு குறி அதற்குரிய இடத்திலேயே வைக்கப்பட்டுள்ளது.
