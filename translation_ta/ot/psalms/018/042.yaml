translation:
  language: ta
  text: காற்றால் அடித்துச் செல்லப்படும் தூசியைப்போல் அவர்களைப் பொடியாக்கினேன்[a][b]; தெருக்களில் உள்ள சேற்றைப்போல் அவர்களைக் கொட்டிவிட்டேன்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவர்களைத் தூசியைப்போல் அரைத்து நொறுக்கினேன்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய வினை அரைத்துப் பொடியாக்குதல் என்ற பொருளையும் தருகிறது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லர்த்தமாக, ‘காற்றின் முகத்தின்மேல்.’ இது காற்றால் அடித்துச் செல்லப்பட்டுச் சிதறும் தூசியைக் குறிக்கும் எபிரெய மொழிநடை.
    reason: lexical_alternative
  - marker: c
    text: ‘அவர்களைத் தெருக்களில் உள்ள சேற்றைப்போல் ஊற்றிவிட்டேன்’ அல்லது ‘காலியாக்கினேன்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶשְׁחָקֵם
  choice: அவர்களைப் பொடியாக்கினேன்
  rationale: שׁחק என்ற வினை இங்கு எதிரிகளைத் தூளாகும் அளவுக்கு அரைத்தல் அல்லது நொறுக்குதல் என்ற வலுவான படிமத்தைத் தருகிறது. ‘பொடியாக்கினேன்’ என்பது அந்த நுண்துகளாக்கும் பொருளை இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: כְּעָפָר
  choice: தூசியைப்போல்
  rationale: עָפָר என்பதன் வழக்கமான பொருள் தூசி அல்லது உதிரி மண். காற்றால் சிதறடிக்கப்படும் படிமத்திற்குத் ‘தூசி’ மிகத் தெளிவாகப் பொருந்துகிறது.
- source_word: עַל־פְּנֵי רוּחַ
  choice: காற்றால் அடித்துச் செல்லப்படும்
  rationale: சொல்லர்த்தமாக ‘காற்றின் முகத்தின்மேல்’ எனும் எபிரெய மொழிநடை, காற்றில் தூசி அடித்துச் செல்லப்பட்டுச் சிதறுவதைக் குறிக்கிறது. தமிழில் படிமம் உடனடியாகப் புரியும்படி அதன் உள்ளார்ந்த இயக்கம் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: כְּטִיט חוּצוֹת
  choice: தெருக்களின் சேற்றைப்போல்
  rationale: טִיט என்பது சேறு அல்லது சகதி; חוּצוֹת என்பது தெருக்கள் அல்லது வெளிப்புறப் பொது இடங்கள். ‘தெருக்களின் சேறு’ இழிவுபடுத்தி மிதிக்கப்படும் படிமத்தை இயல்பாகக் காக்கிறது.
- source_word: אֲרִיקֵם
  choice: அவர்களைக் கொட்டிவிட்டேன்
  rationale: ריק என்பதன் ஹிஃபில் வடிவம் ஊற்றுதல் அல்லது காலியாக்குதல் என்று பொருள்படும். சேற்றை வெளியே கொட்டும் படிமத்தோடு ‘கொட்டிவிட்டேன்’ இயல்பாக இணைகிறது; நிறைவுற்ற, தீர்மானமான செயலும் வெளிப்படுகிறது.
