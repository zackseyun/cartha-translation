  text: For by you I can run against a troop[b][a], and by my God I can leap over a wall.
translation:
  language: ta
  text: ஏனெனில், உம்மால் நான் ஒரு படையணியை எதிர்த்து ஓடுவேன்[a]; என் தேவனால் ஒரு மதிலைத் தாண்டிக் குதிப்பேன்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உம்மூலம் நான் ஒரு கொள்ளைக்குழுவை எதிர்த்து ஓடுவேன்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “என் தேவனால் ஒரு அரணைக் கடந்து குதிப்பேன்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: சுற்றியுள்ள துதிக்கும் சாட்சிக்கும் காரணம் அல்லது விளக்கம் அளிக்கும் இணைப்புச்சொல்லாக இங்கு வருகிறது.
- source_word: בְךָ
  choice: உம்மால்
  rationale: בְּ இங்கு வழிமுறை அல்லது ஆற்றலின் மூலத்தைக் குறிக்கிறது; தேவன் அளிக்கும் வல்லமையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: אָרֻץ
  choice: நான் ... எதிர்த்து ஓடுவேன்
  rationale: רוּץ என்பதன் அடிப்படைப் பொருளான ‘ஓடு’ என்பதைக் காத்து, போர்ச் சூழலில் எதிரியை நோக்கிச் செல்லும் பொருளையும் வெளிப்படுத்துகிறது. எபிரெய வினையின் வடிவத்துக்கு நெருக்கமாக இருக்க ‘என்னால் முடியும்’ என்று தனியாகச் சேர்க்கப்படவில்லை.
- source_word: גְּדוּד
  choice: ஒரு படையணி
  rationale: படைக்குழு அல்லது கொள்ளையிடும் போர்க்குழுவைக் குறிக்கக்கூடிய சொல்லுக்கு, அதன் அளவை ‘படை’ என்று மிகைப்படுத்தாமல் இயல்பான இராணுவப் பொருளை அளிக்கிறது.
- source_word: וּבֵאלֹהַי
  choice: என் தேவனால்
  rationale: முதல் அரையடியின் ‘உம்மால்’ என்பதுடனான இணைநிலையைப் பேணி, ‘என் தேவன்’ என்ற தனிப்பட்ட அறிக்கையையும் காக்கிறது.
- source_word: אֲדַלֶּג
  choice: தாண்டிக் குதிப்பேன்
  rationale: דלג என்பதன் ‘குதி, தாவு’ என்ற தெளிவான இயக்கப் படிமத்தையும் தடையைக் கடக்கும் பொருளையும் காக்கிறது.
- source_word: שׁוּר
  choice: ஒரு மதில்
  rationale: போர்ச் சூழலில் பாதுகாப்புச் சுவரைக் குறிக்கும் சொல்லுக்கு ‘மதில்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
theological_decisions:
- issue: வசனத்தின் போர்சார் படிமம்
  choice: தேவன் அளிக்கும் வல்லமையைப் பற்றிய தாவீதின் சாட்சியாகத் தெளிவான போர்சார் படிமத்தை அப்படியே வைத்தல்
  alternative: வாழ்க்கைத் தடைகளைப் பொதுவாக வெல்வதாக ஆன்மிகப்படுத்தி மொழிபெயர்த்தல்
  rationale: எபிரெய மூலத்தில் படையணியும் மதிலும் நேரடியாகக் குறிப்பிடப்படுகின்றன. ஆகவே வரலாற்று-கவிதை படிமம் பாதுகாக்கப்படுகிறது; அதன் விரிவான பயன்பாட்டை வாசகர் உணர இடமளிக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைக்குரிய கண்ணியத்துடன் மொழிபெயர்க்கப்பட்டது. தேவனை நேரடியாகக் குறிக்கும் இரண்டாம் நபருக்கு மரியாதை வடிவமான ‘உம்மால்’ பயன்படுத்தப்பட்டுள்ளது; இரு அரையடிகளின் இணைநிலையும் போர்சார் இயக்கப் படிமங்களும் காக்கப்பட்டுள்ளன.
