  text: The sons of foreigners fade away and come trembling out of their strongholds[a][b][c].
translation:
  language: ta
  text: அந்நியரின் மகன்கள்[a] வாடிப்போய், தங்கள் அரண்களிலிருந்து நடுநடுங்கி வெளியே வருகிறார்கள்[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்கு சொல், ‘அந்நியத்தின் மகன்கள்’ அல்லது ‘அந்நியரின் மகன்கள்.’ இதைச் சூழலுக்கு ஏற்ப பொதுவாக ‘அந்நியர்கள்’ என்றும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘நடுநடுங்கி வெளியே வருகிறார்கள்’ என மொழிபெயர்க்கப்பட்ட வினை அரிதானது; அதன் துல்லியமான பொருள் உறுதியில்லை. ‘அஞ்சி ஒதுங்கி வெளியே வருகிறார்கள்’ அல்லது ‘நொண்டி வெளியே வருகிறார்கள்’ என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
  - marker: c
    text: ‘அரண்கள்’ என்பதற்கு ‘கோட்டைகள்’ அல்லது பொதுவாக ‘அடைப்பிடங்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי נֵכָר
  choice: அந்நியர்கள்
  rationale: எபிரெயச் சொற்றொடர் சொல்லுக்கு சொல் ‘அந்நியத்தின்/அந்நியரின் மகன்கள்’ என்று இருந்தாலும், இது அந்நிய மக்களைக் குறிக்கும் கவிதை வழக்கு. நவீன தமிழில் தவறான குடும்பப் பொருள் தோன்றாமல் இயல்பாக இருக்க ‘அந்நியர்கள்’ என மொழிபெயர்க்கப்பட்டது; மூல உருவகம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: יִבֹּלוּ
  choice: வாடிப்போய்
  rationale: נבל என்ற வேர்ச்சொல்லின் அடிப்படைப் பொருள் ‘வாடுதல், பொலிவிழத்தல்.’ தோற்கடிக்கப்பட்ட பகைவரின் வலிமை குன்றுவதை ‘வாடிப்போய்’ இயல்பாகவும் கவித்துவமாகவும் வெளிப்படுத்துகிறது.
- source_word: וְיַחְרְגוּ
  choice: நடுநடுங்கி வெளியே வருகிறார்கள்
  rationale: חרג அரிதாக வரும், பொருள் உறுதியாகத் தீர்மானிக்க முடியாத வினை. இச்சூழலில் அச்சத்தோடும் கலக்கத்தோடும் வெளியே வருவதை இது சுட்டலாம். அந்தச் சாத்தியமான பொருளைத் தெளிவான தமிழில் வழங்கி, வேறு சாத்தியங்களை அடிக்குறிப்பில் காக்கிறது.
- source_word: מִמִּסְגְּרוֹתֵיהֶם
  choice: தங்கள் அரண்களிலிருந்து
  rationale: מסגרות என்பது அடைக்கப்பட்ட அல்லது பாதுகாக்கப்பட்ட இடங்களைக் குறிக்கலாம். போர்ச் சூழலில் எதிரிகள் வெளியே வரும் பாதுகாப்பிடங்கள் என்பதால் ‘அரண்கள்’ பொருத்தமானது; பரந்த பொருள் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
