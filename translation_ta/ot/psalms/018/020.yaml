base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/020.yaml
  text: Yahweh has dealt with me according to my righteousness[b][a]; according to the cleanness of my hands he has repaid me.
translation:
  language: ta
  text: யாவே என் நீதிக்கேற்ப எனக்குக் கைம்மாறு செய்தார்[a]; என் கைகளின் தூய்மைக்கேற்ப[b] எனக்குப் பலனளித்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவே என் நீதிக்கேற்ப எனக்குப் பலனளித்தார்.”
    reason: lexical_alternative
  - marker: b
    text: “என் கைகளின் தூய்மை” என்பது குற்றமற்ற அல்லது நேர்மையான நடத்தையைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: יִגְמְלֵנִי
  choice: எனக்குக் கைம்மாறு செய்தார்
  rationale: גמל என்பது ஒருவருடைய நடத்தைக்கு ஏற்றவாறு அவரிடம் நடந்துகொள்வதையோ அவருக்குப் பிரதிபலன் செய்வதையோ குறிக்கலாம். இச்சூழலில் அடுத்த அடியின் ‘பலனளித்தார்’ என்பதுடன் இணைந்து நேர்மறையான பிரதிபலனைச் சுட்டுகிறது; ‘கைம்மாறு செய்தார்’ அதன் பரந்த பொருளையும் கவிதை இணைநிலையையும் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெயத் தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் இயல்பான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: כְּצִדְקִי
  choice: என் நீதிக்கேற்ப
  rationale: צדק இங்கு சங்கீதக்காரரின் நேர்மையான நடத்தை அல்லது நீதியைக் குறிக்கிறது. ‘நீதி’ மூலத்தின் கூற்றை வலுவிழக்கச் செய்யாமல் காக்கிறது; כְּ என்பதன் அளவு அல்லது ஒத்திசைவு பொருளை ‘-க்கேற்ப’ வெளிப்படுத்துகிறது.
- source_word: כְּבֹר יָדַי
  choice: என் கைகளின் தூய்மைக்கேற்ப
  rationale: בֹּר என்பதன் தூய்மை/சுத்தம் என்ற பொருளையும் ‘கைகள்’ என்ற உடல்சார் கவிதைப் படிமத்தையும் நேரடியாகக் காக்கிறது. இந்தச் சொற்றொடர் குற்றமற்ற அல்லது நேர்மையான நடத்தைக்கான மரபுத்தொடராகும்.
- source_word: יָשִׁיב לִי
  choice: எனக்குப் பலனளித்தார்
  rationale: שׁוב என்பதன் Hiphil வடிவம் இங்கு ஒருவருக்குத் தக்கதைத் திருப்பிக் கொடுத்தல் அல்லது பிரதிபலன் செய்தல் என்ற பொருளைத் தருகிறது. இயல்பான தமிழில் ‘பலனளித்தார்’ அந்தப் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘என் நீதி’ என்பது பாவமற்ற முழுநிறைவையோ சுயமீட்பையோ குறிக்கும் எனத் தவறாகப் புரிந்துகொள்ளப்படும் வாய்ப்பு
  choice: மூலத்திலுள்ள முதலாம் நபர் உரிமைக் கூற்றை ‘என் நீதி’ என்று நேரடியாகத் தக்கவைத்தல்
  alternative: என் குற்றமின்மை / என் நியாயமான வழக்கு
  rationale: எபிரெய உரை צדק என்பதுடன் முதலாம் நபர் உரிமை விகுதியை வெளிப்படையாகப் பயன்படுத்துகிறது. இறையியல் பதற்றத்தைத் தணிப்பதற்காக அந்தக் கூற்றை மொழிபெயர்ப்பில் வலுவிழக்கச் செய்யக்கூடாது; சூழலில் இது குறிப்பிட்ட காரியத்தில் சங்கீதக்காரரின் நேர்மையையும் யாவே அளித்த நியாயத்தீர்ப்பையும் குறிக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. எபிரெயக் கவிதையின் இரு இணை அடிகளும், ‘என் நீதி’ என்ற இறையியல் பதற்றமும், ‘கைகளின் தூய்மை’ என்ற உடல்சார் படிமமும் பாதுகாக்கப்பட்டுள்ளன.
