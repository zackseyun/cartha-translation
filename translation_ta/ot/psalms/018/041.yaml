source:
  edition: WLC
  text: יְשַׁוְּע֥וּ וְ/אֵין מוֹשִׁ֑יעַ עַל יְ֝הוָ֗ה וְ/לֹ֣א עָנָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/041.yaml
  text: They cried for help, but there was no savior; to the LORD, but he did not answer them.
translation:
  language: ta
  text: அவர்கள் உதவிக்காகக் கூப்பிட்டார்கள்; ஆனால் மீட்பவர் யாரும் இல்லை. யெகோவாவை நோக்கிக் கூப்பிட்டார்கள்; ஆனால் அவர் அவர்களுக்குப் பதிலளிக்கவில்லை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְשַׁוְּעוּ
  choice: உதவிக்காகக் கூப்பிட்டார்கள்
  rationale: שׁוע என்பதன் பியல் வடிவம் ஆபத்தில் உதவி வேண்டிக் கூக்குரலிடுவதைச் சுட்டுகிறது; இயல்பான நவீனத் தமிழில் அதன் நோக்கத்தையும் தீவிரத்தையும் வெளிப்படுத்துகிறது.
- source_word: מוֹשִׁיעַ
  choice: மீட்பவர்
  rationale: ישׁע வேரிலிருந்து வந்த இச்செய்பெயர் காப்பாற்றுகிற அல்லது விடுவிக்கிற ஒருவரைக் குறிக்கிறது; சூழலில் தனிப்பட்ட இறையியல் பட்டமாக மட்டும் வாசிக்காமல் மூலச்சொல்லின் மீட்பு நுணுக்கத்தைப் பேணுகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: மூலத்தில் உள்ள தெய்வீகப் பெயரை பொதுப்பட்டமான ‘ஆண்டவர்’ என்பதால் மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட ஒலிபெயர்ப்பால் வழங்குகிறது.
- source_word: עָנָם
  choice: அவர்களுக்குப் பதிலளிக்கவில்லை
  rationale: ענה என்ற வினையின் நேரடியான பொருளான ‘பதிலளித்தல்’ என்பதையும், ־ם பின்னொட்டின் ‘அவர்களுக்கு’ என்ற பொருளையும் தெளிவாகப் பேணுகிறது.
theological_decisions:
- issue: தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: ஆண்டவர்
  rationale: எபிரெய மூலத்தில் יהוה என்ற தனிப்பெயர் இருப்பதால், அதைத் தனிப்பெயராகவே காட்டுவது மூலநெருக்கத்தைப் பேணுகிறது; இது எந்தக் குழுவின் தனிச்சிறப்பான கொள்கையையும் புகுத்துவதற்காக அல்ல.
- issue: מוֹשִׁיעַ என்பதன் வடிவம்
  choice: மீட்பவர்
  alternative: காப்பாற்ற யாரும்
  rationale: மூலத்தின் ஒருமைச் செய்பெயர் வடிவத்தைப் பேணுகிறது; அதேவேளை இது குறிப்பிட்ட மேசியா பட்டம் என்று உரையில் இல்லாத விளக்கத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. எபிரெயக் கவிதையின் இரு இணையான கூக்குரல்களையும் தமிழில் தெளிவுபடுத்த இரண்டாவது வாக்கியத்தில் ‘கூப்பிட்டார்கள்’ மீண்டும் வழங்கப்பட்டுள்ளது.
