source:
  edition: WLC
  text: יָ֤שֶׁת חֹ֨שֶׁךְ סִתְר֗/וֹ סְבִֽיבוֹתָ֥י/ו סֻכָּת֑/וֹ חֶשְׁכַת מַ֝֗יִם עָבֵ֥י שְׁחָקִֽים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/011.yaml
  text: He made darkness his hiding place[a], around him his shelter—dark waters[c][b], thick clouds of the skies.
translation:
  language: ta
  text: 'அவர் இருளைத் தமது மறைவிடமாக[a] வைத்தார்;

    அவரைச் சுற்றி அவரது பந்தல்[b]—

    நீரின் இருள்[c], வானத்தின் அடர்மேகங்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தமது இரகசிய இடமாக.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘தமது விதானமாக’ அல்லது ‘தமது குடிலாக.’
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘இருண்ட நீர்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשֶׁת
  choice: வைத்தார்
  rationale: שׁית என்ற வினையின் அடிப்படைப் பொருளான ‘வைத்தல்/அமைத்தல்’ என்பதையும், இருளை மறைவிடமாக ஏற்படுத்திய கவிதைச் செயலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: חֹשֶׁךְ
  choice: இருள்
  rationale: புயல்-இறைத்தோற்றத்தின் சூழல்சார் மறைப்பைத் தெளிவாகப் பாதுகாக்கும் நேரடியான இணைச்சொல்.
- source_word: סִתְרוֹ
  choice: தமது மறைவிடம்
  rationale: סתר குறிக்கும் மறைந்திருக்கும் இடம் என்ற இடவியல் பொருளைப் பாதுகாக்கிறது; வெறும் கருத்தியல் ‘இரகசியம்’ என்று மாற்றவில்லை.
- source_word: סְבִיבוֹתָיו
  choice: அவரைச் சுற்றிலும்
  rationale: மூலத்தின் இடவியல் காட்சியை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: סֻכָּתוֹ
  choice: அவரது பந்தல்
  rationale: סֻכָּה என்பதன் தற்காலிக மூடிடம் அல்லது நிழற்பந்தல் சார்ந்த உருவகத்தைப் பாதுகாக்கிறது; தேவையற்ற வழிபாட்டுக்கூடாரப் பொருளைச் சேர்க்கவில்லை.
- source_word: חֶשְׁכַת מַיִם
  choice: நீரின் இருள்
  rationale: எபிரெயக் கட்டமைப்பின் ‘நீரின் இருள்’ என்ற திட்டமிட்ட கவிதைச் செறிவையும் அதன் இயல்பான தெளிவின்மையையும் பாதுகாக்கிறது.
- source_word: עָבֵי שְׁחָקִים
  choice: வானத்தின் அடர்மேகங்கள்
  rationale: עָבֵי என்பதன் அடர்த்தியையும் שְׁחָקִים என்பதன் கவிதைநயமுள்ள வானக் குறிப்பையும் தெளிவாகத் தருகிறது.
theological_decisions:
- issue: இருள் மற்றும் பந்தல் ஆகியவை புயல்-இறைத்தோற்றத்தில் கடவுளை மறைக்கும் உருவகங்களாக வருகின்றன; அவற்றின் ஒழுக்கவியல் அல்லது வழிபாட்டியல் பொருள் உரையில் குறிப்பிடப்படவில்லை.
  choice: கடவுளைச் சூழ்ந்த கவிதைமிகு மறைப்பாக உருவகங்களை நேரடியாக மொழிபெயர்த்தல்.
  alternative: இருளை நியாயத்தீர்ப்பின் அடையாளமாகவோ, பந்தலை வழிபாட்டுக் கூடாரமாகவோ விளக்குதல்.
  rationale: எபிரெய உரை புயலின் நீர், இருள், அடர்மேகம் ஆகியவற்றை இணைக்கிறது. மொழிபெயர்ப்பு இவ்விறைத்தோற்றக் காட்சியையும் அதன் இறையியல் பதற்றத்தையும் பாதுகாத்து, உரையில் இல்லாத கோட்பாட்டு விளக்கத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதக் கவிதைக்கேற்ற கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டது. வரிப்பிரிப்பு எபிரெயக் கவிதையின் இணை அமைப்பையும், ‘நீரின் இருள் / வானத்தின் அடர்மேகங்கள்’ என்பவை பந்தலின் கூறுகளாக நிற்பதையும் தெளிவாக்குகிறது.
