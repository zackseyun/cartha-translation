source:
  edition: WLC
  text: הָ/אֵל֮ תָּמִ֪ים דַּ֫רְכּ֥/וֹ אִמְרַֽת יְהוָ֥ה צְרוּפָ֑ה מָגֵ֥ן ה֝֗וּא לְ/כֹ֤ל הַ/חֹסִ֬ים בּֽ/וֹ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/030.yaml
  text: As for God[a], his way is blameless; the word of Yahweh is refined[b]; he is a shield to all who take refuge in him.
translation:
  language: ta
  text: 'இறைவனைப் பொறுத்தவரை, அவருடைய வழி குறையற்றது;

    யாவேயின் சொல் புடமிடப்பட்டது[a];

    அவரிடம் அடைக்கலம் புகும் அனைவருக்கும்[b] அவர் கேடயம்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சோதித்து மெய்ப்பிக்கப்பட்டது’ அல்லது ‘தூய்மைப்படுத்தப்பட்டது’ என்றும் மொழிபெயர்க்கலாம். எபிரேயச் சொல் நெருப்பில் உலோகத்தைப் புடமிடும் காட்சியைத் தூண்டி, யாவேயின் சொல் நிரூபிக்கப்பட்ட தூய்மையுடையது என்பதை வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘அவரை நம்பும் அனைவருக்கும்’ என்றும் பொருள்படலாம். எபிரேய மொழியில் இன்னும் நேரடியாக ‘அவரிடம் அடைக்கலம் புகுகிறவர்கள்’ என்று உள்ளது; இறைவனைப் பாதுகாப்பான புகலிடமாகக் காட்டும் உருவகத்தை இது பேணுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵל
  choice: இறைவனைப் பொறுத்தவரை
  rationale: முன்னொட்டுக் குறிப்புச் சுட்டியுடனும் வாக்கியத்தின் தொடக்கத்திலும் வரும் אֵל இங்கு தலைப்பாக்க வலியுறுத்தலைக் கொண்டுள்ளது; தமிழ் இயல்பில் அதை வெளிப்படுத்துகிறது.
- source_word: תָּמִים
  choice: குறையற்றது
  rationale: முழுமையும் பழுதின்மையும் குறிக்கும் சொல்லை, இறைவனுடைய செயல்முறையைப் பற்றிய சூழலில் இயல்பாகவும் தெளிவாகவும் தருகிறது.
- source_word: דַּרְכּוֹ
  choice: அவருடைய வழி
  rationale: דֶּרֶךְ என்பதன் ‘வழி’ என்ற உருவகத்தையும், இங்கு இறைவன் செயல்படும் முறையைக் குறிக்கும் பொருளையும் பாதுகாக்கிறது.
- source_word: אִמְרַת יְהוָה
  choice: யாவேயின் சொல்
  rationale: אִמְרָה என்பது உரைக்கப்பட்ட சொல் அல்லது கூற்றைக் குறிக்கிறது; சுருக்கமான ‘சொல்’ இங்கு இயல்பானது. יְהוָה தனிப்பட்ட இறைப்பெயராக ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: צְרוּפָה
  choice: புடமிடப்பட்டது
  rationale: צרף வினை உலோகத்தை நெருப்பில் புடமிட்டுச் சுத்திகரிக்கும் உருவகத்தைக் கொண்டது; தமிழ் தேர்வு அந்த உருவகத்தையும் நிரூபிக்கப்பட்ட தூய்மையையும் காக்கிறது.
- source_word: מָגֵן
  choice: கேடயம்
  rationale: பாதுகாப்பவர் என்று பொதுமைப்படுத்தாமல், மூலத்தின் நேரடியான பாதுகாப்பு உருவகத்தைப் பேணுகிறது.
- source_word: הַחֹסִים בּוֹ
  choice: அவரிடம் அடைக்கலம் புகும்
  rationale: חסה என்பதன் தஞ்சம் அல்லது பாதுகாப்பு தேடுதல் என்ற காட்சிப்பூர்வமான பொருளைப் பேணுகிறது; நம்பிக்கை இதில் உட்பொருளாக இருந்தாலும் அதை மட்டும் கொண்டு உருவகத்தைச் சுருக்கவில்லை.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: எபிரேய உரையில் தனிப்பட்ட உடன்படிக்கைப் பெயரான நான்கெழுத்துப் பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டப்பெயரால் மாற்றாமல், நவீன தமிழில் ஏற்ற ஒலிபெயர்ப்பாக ‘யாவே’ பயன்படுத்தப்படுகிறது.
- issue: தெய்வீக ‘வழி’ என்பதன் பண்பு
  choice: குறையற்றது
  alternative: பூரணமானது
  rationale: תָּמִים குறைபாடின்மையையும் முழுமையையும் ஒன்றாகக் குறிக்கிறது. ‘குறையற்றது’ எந்தத் தனிப்பட்ட கோட்பாட்டு விளக்கத்தையும் சேர்க்காமல் இச்சூழலின் மதிப்பீட்டைத் தெளிவாகக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைநயமுள்ள ஆனால் பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரேய இணைவரி அமைப்பைத் தெளிவாக்க வரிப் பிரிப்பு வைக்கப்பட்டுள்ளது. ‘புடமிடப்பட்டது’, ‘கேடயம்’, ‘அடைக்கலம் புகும்’ ஆகிய சொற்கள் மூலத்தின் உலோகச் சுத்திகரிப்பு மற்றும் பாதுகாப்பு உருவகங்களைத் தக்கவைக்கின்றன.
