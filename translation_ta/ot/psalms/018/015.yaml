base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/015.yaml
  text: Then the channels of the waters were seen[a], and the foundations of the world were laid bare, at your rebuke, O Yahweh[c][b], at the blast of the breath of your nostrils.
translation:
  language: ta
  text: அப்போது நீர்வழிகள் காணப்பட்டன[a]; உலகத்தின் அடித்தளங்கள் வெளிப்பட்டன[b]—யாவே, உமது கடிந்துரைத்ததினால், உமது நாசிகளின் மூச்சுக் காற்றின் வீச்சினால்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நீரோடைகளின் படுகைகள்’ அல்லது ‘நீரோடைகள்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘பூமியின் அடித்தளங்கள்.’
    reason: lexical_alternative
  - marker: c
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், ‘உமது நாசிகளின் காற்றின் மூச்சினால்.’ இது யாவேயின் மூச்சின் வல்லமையைச் சித்தரிக்கும் தீவிரமான மனித உருவகமாகும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָאוּ אֲפִיקֵי מַיִם
  choice: நீரோடைகளின் படுகைகள் காணப்பட்டன
  rationale: אֲפִיקֵי מַיִם என்பது நீர் பாயும் தடங்கள், ஓடைகளின் படுகைகள் அல்லது நீர்வழிகளைக் குறிக்கலாம். ‘நீரோடைகளின் படுகைகள்’ என்பது இயல்பான தமிழில் நிலப்பரப்பு வெளிப்படும் காட்சியைத் தெளிவாக்குகிறது; Niphal வினையின் செயப்பாட்டு நுணுக்கத்தை ‘காணப்பட்டன’ காக்கிறது.
- source_word: וַיִּגָּלוּ מוֹסְדוֹת תֵּבֵל
  choice: உலகத்தின் அடித்தளங்கள் வெளிப்பட்டன
  rationale: גלה என்பதன் Niphal வடிவம் மறைந்திருந்தவை திறந்து காணப்படுவதைச் சுட்டுகிறது. תֵּבֵל இங்கு ஒழுங்கமைந்த உலகத்தைக் குறிக்கிறது; எனவே ‘உலகத்தின் அடித்தளங்கள்’ பொருத்தமானது.
- source_word: מִגַּעֲרָתְךָ
  choice: உமது கண்டிப்பினாலும்
  rationale: מִן இங்கு காரணத்தைக் குறிக்கிறது. גערה என்பது அதிகாரமிக்க கடிந்துரை அல்லது கண்டிப்பு; ‘கண்டிப்பு’ நவீன தமிழில் இயல்பாகவும் கண்ணியமாகவும் உள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான יהוה என்பதை ஒரு பொதுப் பட்டமாக மாற்றாமல், தமிழில் பரவலாகப் புரிந்துகொள்ளக்கூடிய ஒலிபெயர்ப்பாக ‘யாவே’ தரப்பட்டுள்ளது.
- source_word: מִנִּשְׁמַת רוּחַ אַפֶּךָ
  choice: உமது நாசிகளிலிருந்து வீசிய மூச்சுக் காற்றினாலும்
  rationale: נשמה, רוח ஆகியவை சேர்ந்து வலிமையான மூச்சு அல்லது காற்றுவீச்சை உருவகப்படுத்துகின்றன; אף இங்கு நேரடியாக ‘நாசிகள்’ எனப் பொருள்படுகிறது. மொழியின் மனித உருவகக் காட்சியைத் தக்கவைத்து, தமிழில் புரியுமாறு மொழிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பொதுப் பட்டம் அல்ல, இறைவனின் தனிப்பெயர் நேரடியாக உள்ளது. ஆகவே அதை பட்டமாக மாற்றாமல் ஒலிபெயர்த்து, உடன்படிக்கைப் பெயரின் தன்மையைத் தக்கவைத்துள்ளது.
- issue: மனித உறுப்புகளைக் கொண்டு இறைவனை வர்ணிக்கும் உருவகம்
  choice: உமது நாசிகளிலிருந்து வீசிய மூச்சுக் காற்று
  alternative: உமது கோபத்தின் வல்லமை
  rationale: மூலத்தின் தீவிரமான மனித உருவகத்தை அப்ஸ்ட்ராக்ட் கருத்தான ‘கோபம்’ என்று சுருக்காமல் பாதுகாக்கிறது; இதன் மூலம் கவிதைத் தெய்வத்தோற்றக் காட்சியும் மொழியின் பதற்றமும் நிலைக்கின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைக்குரிய கண்ணியத்தோடு வடிவமைக்கப்பட்டது. ‘காணப்பட்டன / வெளிப்பட்டன’ என்ற இணை அமைப்பு எபிரெயக் கவிதையின் இணைப்பாட்டைக் காக்கிறது. இறுதி காரணவாக்கியம் தமிழில் இயல்பாக அமைய ‘இவ்வாறு நேர்ந்தது’ சேர்க்கப்பட்டுள்ளது; புதிய நிகழ்வு எதுவும் இறக்குமதி செய்யப்படவில்லை.
