  text: מגדל יְשׁוּע֪וֹת מַ֫לְכּ֥/וֹ וְ/עֹ֤שֶׂה חֶ֨סֶד לִ/מְשִׁיח֗/וֹ לְ/דָוִ֥ד וּ/לְ/זַרְע֗/וֹ עַד עוֹלָֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/050.yaml
  text: He gives great victories to his king and shows steadfast love to his anointed[c][b][a], to David and to his offspring forever.
translation:
  language: ta
  text: அவர் தமது அரசனுக்குப் பெரும் வெற்றிகளை அளிக்கிறார்; தாம் அபிஷேகம் செய்தவருக்கு[a]—தாவீதுக்கும், அவனுடைய சந்ததிக்கும்[b]—என்றென்றும் உடன்படிக்கைப் பேரன்பு காட்டுகிறார்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தாம் அபிஷேகம் செய்தவர்’ என்பதை ‘தமது மேசியா’ என்றும் மொழிபெயர்க்கலாம். இங்கு இது உடனடியாகத் தாவீதையோ தாவீதிய அரசனையோ குறிக்கிறது; அதேவேளை, மேசியா சார்ந்த விரிந்த எதிரொலியையும் கொண்டுள்ளது.
    reason: alternative_reading
  - marker: b
    text: ‘சந்ததி’ என்பது எபிரெயில் ஒருமை வடிவிலுள்ள கூட்டுப்பெயர்; அது தாவீதின் வம்சம் முழுவதையும் குறிக்கலாம், மேலும் வேதநூலின் விரிந்த சூழலில் மேசியா சார்ந்த வாசிப்புக்கும் இடமளிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: வசனத்தின் தொடக்கத்திலுள்ள எபிரெய வடிவம் உரை மற்றும் தொடரியல் அடிப்படையில் கடினமானது. ‘அவர் தமது அரசனுக்கு மீட்புகளின் கோபுரமாக இருக்கிறார்’ என்றும் மொழிபெயர்க்கலாம். 2 சாமுவேல் 22:51-இல் உள்ள நெருங்கிய இணைவாசகம், ‘அவர் தமது அரசனின் மீட்புகளை/வெற்றிகளைப் பெரிதாக்குகிறார்’ என்று வாசிக்கிறது.
    reason: textual_variant
lexical_decisions:
- source_word: מגדל
  choice: பெரும் ... அளிக்கிறார்
  rationale: இவ்வசனத்தின் தொடக்கத்திலுள்ள எபிரெய வடிவம் உரை மற்றும் தொடரியல் அடிப்படையில் கடினமானது. 2 சாமுவேல் 22:51-இன் நெருங்கிய இணைவாசகத்தோடு பொருத்திப் பார்க்கும்போது, அரசனுக்கான மீட்புகளை அல்லது வெற்றிகளைப் பெரிதாக்குகிறார் என்ற வினைச்சொல் பொருள் இயல்பானது; தமிழில் இதை வாசிக்க எளிதாக ‘பெரும் வெற்றிகளை அளிக்கிறார்’ என வழங்குகிறது.
- source_word: יְשׁוּעוֹת
  choice: வெற்றிகள்
  rationale: இது ‘மீட்புகள்/விடுவிப்புகள்’ என்று பொருள்படக்கூடிய பன்மைச் சொல். அரசனையும் போர் வெற்றியையும் மையமாகக் கொண்ட சூழலில் ‘வெற்றிகள்’ இயல்பாக இருந்து, மீண்டும் மீண்டும் நிகழும் மீட்புச் செயல்களையும் உணர்த்துகிறது.
- source_word: מַלְכּוֹ
  choice: தமது அரசனுக்கு
  rationale: மூலத்தின் ‘அவருடைய அரசன்’ என்ற உடைமை உறவைப் பாதுகாக்கிறது; தமிழில் உயர்திணை ஒருமைக்கு ஏற்ற ‘தமது’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: וְעֹשֶׂה חֶסֶד
  choice: உடன்படிக்கைப் பேரன்பு காட்டுகிறார்
  rationale: חֶסֶד என்பது நிலைத்த அன்பு, விசுவாசம், உடன்படிக்கைப் பற்றுறுதி ஆகியவற்றை உள்ளடக்கும் செறிவான சொல். வெறும் ‘இரக்கம்’ அல்லது ‘தயவு’ என்பதைக் காட்டிலும் ‘உடன்படிக்கைப் பேரன்பு’ அதன் உடன்படிக்கை சார்ந்த கனத்தைத் தெளிவாகக் காக்கிறது.
- source_word: לִמְשִׁיחוֹ
  choice: தாம் அபிஷேகம் செய்தவருக்கு
  rationale: உடனடிச் சூழலில் தாவீது அல்லது தாவீதிய அரசனே குறிக்கப்படுவதால் செயப்படுபொருள் வடிவிலான இந்த மொழிபெயர்ப்பு துல்லியமானது. ‘மேசியா’ என்ற பட்டப்பெயருக்கான விரிந்த எதிரொலி அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: לְדָוִד
  choice: தாவீதுக்கு
  rationale: தனிப்பெயர் நவீன நிலையான தமிழ் வேதாகமப் பயன்பாட்டின்படி ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וּלְזַרְעוֹ
  choice: அவனுடைய சந்ததிக்கும்
  rationale: זֶרַע ஒருமை வடிவிலுள்ள கூட்டுப்பெயர். ‘சந்ததி’ என்பது ஒருவரையும் வம்சத் தொடரையும் குறிக்கக்கூடியதால், தாவீதின் வம்சம் மற்றும் மேசியாவை நோக்கிய விரிந்த வாசிப்பு ஆகிய இரண்டையும் முன்கூட்டியே முடிவுசெய்யாமல் வைக்கிறது.
- source_word: עַד עוֹלָם
  choice: என்றென்றும்
  rationale: நீடித்த, முடிவற்ற காலத்தைக் குறிக்கும் இயல்பானவும் கண்ணியமானவும் உள்ள தமிழ் நடை.
theological_decisions:
- issue: தாவீதிய அரச சங்கீதத்தில் מְשִׁיחוֹ என்பதன் மேசியா சார்ந்த எதிரொலி
  choice: முதன்மை உரையில் ‘தாம் அபிஷேகம் செய்தவர்’ என்று மொழிபெயர்த்து, ‘தமது மேசியா’ என்ற வாசிப்பை அடிக்குறிப்பில் தருதல்
  alternative: தமது மேசியாவுக்கு
  rationale: வசனத்தின் உடனடிக் குறிப்பு தாவீதைக் காட்டுகிறது. அதேவேளை, இந்தச் சொல் மேசியா சார்ந்த விரிந்த வேதநூல் எதிரொலியைக் கொண்டிருப்பதால் அதை மறைக்காமல் அடிக்குறிப்பில் பாதுகாக்கிறது.
- issue: זַרְעוֹ என்பதன் குறிப்பு எல்லை
  choice: ‘சந்ததி’ என்ற கூட்டொருமைப் பொருளை வைத்திருத்தல்
  alternative: வழித்தோன்றல்கள்; வித்து
  rationale: எபிரெயச் சொல் தாவீதின் வம்சம் முழுவதையும் குறிக்கலாம்; ஒருமை மேசியா சார்ந்த வாசிப்புக்கும் இடமளிக்கிறது. ‘சந்ததி’ இந்த இறையியல் இழுப்பைச் சுருக்காமல் காக்கிறது.
- issue: חֶסֶד என்பதன் உடன்படிக்கைச் சார்பு
  choice: உடன்படிக்கைப் பேரன்பு
  alternative: நிலையான அன்பு; மாறாத அன்பு; இரக்கம்
  rationale: இந்தச் சூழலில் தாவீதுக்கும் அவன் சந்ததிக்கும் என்றென்றும் காட்டப்படும் அன்பு, வெறும் உணர்ச்சி அல்லது தயவைவிட உடன்படிக்கை விசுவாசத்தை வலியுறுத்துகிறது.
translation_notes:
  register: நவீன நிலையான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ். அரசப் பின்னணியில் ‘வெற்றிகள்’ இயல்பாகத் தேர்ந்தெடுக்கப்பட்டது; חֶסֶד என்பதன் உடன்படிக்கை சார்ந்த செறிவைத் தெரிவிக்க ‘உடன்படிக்கைப் பேரன்பு’ பயன்படுத்தப்பட்டது. பிரதிப்பெயர்கள் தெய்வக் குறிப்பில் உயர்திணை மரியாதையுடனும், தாவீதைக் குறிக்கும் இடத்தில் இயல்பான ஒருமையுடனும் அமைக்கப்பட்டுள்ளன. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெறுகின்றன.
