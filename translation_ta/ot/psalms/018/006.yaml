source:
  edition: WLC
  text: בַּ/צַּר לִ֤/י אֶֽקְרָ֣א יְהוָה֮ וְ/אֶל אֱלֹהַ֪/י אֲשַׁ֫וֵּ֥עַ יִשְׁמַ֣ע מֵ/הֵיכָל֣/וֹ קוֹלִ֑/י וְ֝/שַׁוְעָתִ֗/י לְ/פָנָ֤י/ו תָּב֬וֹא בְ/אָזְנָֽי/ו־׀־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/006.yaml
  text: In my distress I call on Yahweh[a], and to my God I cry for help. He hears my voice from his temple[b], and my cry before him comes into his ears.
translation:
  language: ta
  text: 'என் நெருக்கடியில் நான் யாவேவை நோக்கிக் கூப்பிடுகிறேன்;

    என் கடவுளிடம் உதவிக்காகக் கூக்குரலிடுகிறேன்.

    அவர் தமது ஆலயத்திலிருந்து[a] என் குரலைக் கேட்கிறார்;

    என் கூக்குரல் அவர்முன் வந்து அவரது செவிகளை எட்டுகிறது.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தமது ஆலயத்திலிருந்து என் குரலைக் கேட்பார்; என் கூக்குரல் அவர்முன் வந்து அவரது செவிகளை எட்டும்” என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைவடிவங்கள் எதிர்காலப் பொருளையும் தரக்கூடும்.
    reason: alternative_reading
  - marker: b
    text: “ஆலயம்” என்பதற்கான எபிரெயச் சொல் “அரண்மனை” அல்லது “பரிசுத்த உறைவிடம்” என்றும் பொருள்படலாம்; அது ஓர் அரசரின் அல்லது கடவுளின் உறைவிடத்தைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּצַּר לִי
  choice: எனக்கு ஏற்பட்ட நெருக்கடியில்
  rationale: צַר என்பது நெருக்கடி, துன்பம் என்ற பொருளைக் கொண்டது; לִי அந்த நெருக்கடி சங்கீதக்காரருக்கு ஏற்பட்டது என்பதைத் தனிப்படுத்துகிறது.
- source_word: אֶקְרָא יְהוָה
  choice: நான் யாவேவை நோக்கிக் கூப்பிடுகிறேன்
  rationale: קרא இங்கு இறைநாமத்தை வெறுமனே உச்சரிப்பதை அல்ல, யாவேவை நோக்கி அழைப்பதைக் குறிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெயத் தனிப்பெயரான יהוה-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், நவீன தமிழில் இயல்பான ஒலிபெயர்ப்பாகத் தருகிறது.
- source_word: וְאֶל אֱלֹהַי אֲשַׁוֵּעַ
  choice: என் கடவுளிடம் உதவிக்காகக் கதறுகிறேன்
  rationale: שׁוע என்பது உதவி வேண்டி எழுப்பும் தீவிரக் கூக்குரலைக் குறிக்கிறது; אֶל என்பதன் திசைநோக்கும் பொருளும் காக்கப்பட்டுள்ளது.
- source_word: יִשְׁמַע
  choice: கேட்கிறார்
  rationale: எபிரெய இறந்தகாலமல்லாத வினைவடிவை கவிதையின் உயிரோட்டமுள்ள நிகழ்காலமாக எடுத்துள்ளது; எதிர்காலப் பொருளும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: מֵהֵיכָלוֹ
  choice: தமது ஆலயத்திலிருந்து
  rationale: הֵיכָל என்பது ஆலயம், அரண்மனை அல்லது பரிசுத்த உறைவிடம் எனப் பொருள்படலாம்; கடவுளைக் குறிக்கும் இச்சூழலில் ‘ஆலயம்’ தெளிவான முதன்மைத் தேர்வு.
- source_word: קוֹלִי
  choice: என் குரலை
  rationale: קוֹל என்பதன் இயல்பான பொருள் ‘குரல்’; ஜெபச் சூழலுக்கும் இது பொருந்துகிறது.
- source_word: וְשַׁוְעָתִי לְפָנָיו
  choice: அவர் திருமுன் எழும் என் கதறல்
  rationale: לְפָנָיו என்பதிலுள்ள ‘அவர் முன்னிலையில்’ என்ற உறவுசார் படிமத்தை ‘திருமுன்’ காக்கிறது; שַׁוְעָה உதவி வேண்டிய கதறலைக் குறிக்கிறது.
- source_word: תָּבוֹא בְאָזְנָיו
  choice: அவரது செவிகளை எட்டுகிறது
  rationale: சொல்லுக்குச் சொல் ‘அவரது செவிகளுக்குள் வருகிறது’; தமிழில் இயல்பாகவும் செவிப் படிமத்தைத் தக்கவைத்தும் ‘செவிகளை எட்டுகிறது’ என மொழிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: יהוה என்ற இறைநாமத்தின் மொழியாக்கம்
  choice: யாவே
  alternative: யெகோவா அல்லது ஆண்டவர்
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக இருப்பதால் அதை பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் தன்மையைப் பாதுகாக்கிறது.
- issue: יִשְׁמַע மற்றும் תָּבוֹא வினைவடிவங்களின் காலப் பொருள்
  choice: 'உயிரோட்டமுள்ள நிகழ்காலம்: ‘கேட்கிறார்’, ‘எட்டுகிறது’'
  alternative: 'எதிர்காலம்: ‘கேட்பார்’, ‘எட்டும்’'
  rationale: கவிதையில் இவ்வினைவடிவங்கள் நிகழ்கால அல்லது எதிர்கால வலிமையைக் கொள்ள முடியும். முதன்மை உரையில் உடனடியான நம்பிக்கையை வெளிப்படுத்தும் நிகழ்காலம் பயன்படுத்தப்பட்டு, உண்மையான காலத் தெளிவின்மை அடிக்குறிப்பில் காக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைக்குரிய கண்ணியத்துடன் இயல்பான ஓட்டம் பேணப்பட்டுள்ளது. ‘திருமுன்’ என்பது உயர்நிலையானாலும் பொதுவாகப் புரியக்கூடிய இறைமரியாதைச் சொல். இணைவரி அமைப்பும் உதவிக்கான தீவிரக் கூக்குரலும் தக்கவைக்கப்பட்டுள்ளன.
