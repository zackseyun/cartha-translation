base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/000.yaml
  text: For the choirmaster[a]. Of David, the servant of Yahweh[b], who spoke to Yahweh the words of this song on the day when Yahweh rescued him from the hand of all his enemies and from the hand of Saul.
translation:
  language: ta
  text: இசைத்தலைவருக்காக. யாவேவின் ஊழியனான தாவீதுக்கு உரியது. யாவே அவரை அவருடைய எல்லாப் பகைவர்களின் கையிலிருந்தும் சவுலின் கையிலிருந்தும் விடுவித்த நாளில், அவர் இந்தப் பாடலின் வார்த்தைகளை யாவேவிடம் உரைத்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கையிலிருந்து” என்பது ஒருவருடைய அதிகாரம் அல்லது கட்டுப்பாட்டிலிருந்து விடுவிக்கப்படுவதைக் குறிக்கும் எபிரேய மரபுத்தொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: பாடகர் தலைவருக்காக
  rationale: சங்கீதத் தலைப்புகளில் இசை அல்லது பாடலை வழிநடத்தும் பொறுப்பாளரைக் குறிக்கும் வழக்குச் சொற்றொடர்; தமிழில் இயல்பாகவும் சுருக்கமாகவும் இவ்வாறு தரப்பட்டுள்ளது.
- source_word: לְעֶבֶד יְהוָה
  choice: யாவேவின் ஊழியனாகிய
  rationale: עֶבֶד என்பது அடிமை அல்லது ஊழியன் எனப் பொருள்படலாம்; இங்கு தாவீதுக்குரிய மதிப்புக்குரிய பட்டமாக வருவதால் ‘ஊழியன்’ பொருத்தமானது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பட்டத்தால் மாற்றாமல், எபிரேய தனிப்பெயரான நான்கெழுத்துப் பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: לְדָוִד
  choice: தாவீதின் பாடல்
  rationale: சங்கீதத் தலைப்பிலுள்ள לְ உறவு, ஆசிரியத்துவம் அல்லது தொடர்பைக் குறிக்கக்கூடிய தெளிவின்மையைக் கொண்டது; இயல்பான தமிழ் தலைப்பில் ‘தாவீதின் பாடல்’ என வழங்கப்பட்டுள்ளது.
- source_word: אֲשֶׁר דִּבֶּר לַיהוָה אֶת דִּבְרֵי הַשִּׁירָה הַזֹּאת
  choice: அவர் இந்தப் பாடலின் வார்த்தைகளை யாவேவிடம் உரைத்தார்
  rationale: தாவீதைச் சுட்டும் தொடர்புவாக்கியத்தையும், பாடல் யாவேவை நோக்கி உரைக்கப்பட்டதையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: הִצִּיל
  choice: விடுவித்த
  rationale: ஆபத்து மற்றும் எதிரிகளின் அதிகாரத்திலிருந்து மீட்டலைக் குறிக்கும் נצל வினைக்கு இச்சூழலில் இயல்பான தமிழ் இணை.
- source_word: מִכַּף ... וּמִיַּד
  choice: கையிலிருந்தும் ... கையிலிருந்தும்
  rationale: அதிகாரம் அல்லது கட்டுப்பாட்டைக் குறிக்கும் எபிரேய உருவகத்தைப் பாதுகாத்து, இணை அமைப்பையும் நிலைநிறுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக இருப்பதால், ஒரு பட்டத்தைப் பதிலிடாமல் ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டது.
- issue: עֶבֶד என்பதன் பொருள்
  choice: ஊழியன்
  alternative: அடிமை
  rationale: சொல் இரு பொருள்களையும் தாங்கினாலும், இந்த அரச மற்றும் கௌரவத் தலைப்புச் சூழலில் தாவீதின் யாவேவுக்கான பணிவுறவையே முன்னிறுத்துவதால் ‘ஊழியன்’ தேர்ந்தெடுக்கப்பட்டது.
- issue: לְדָוִד என்பதன் உறவு
  choice: தாவீதின் பாடல்
  alternative: தாவீதுக்குரியது / தாவீதுக்காக
  rationale: எபிரேய முன்னொட்டு ஆசிரியத்துவம் அல்லது தொடர்பைச் சுட்டலாம்; தமிழ் தலைப்பில் இயல்பாக இருக்க ‘தாவீதின் பாடல்’ எனத் தரப்பட்டாலும், ஆசிரியத்துவத்தைப் பற்றிய எல்லா சாத்தியங்களையும் கோட்பாட்டாக முடிவுசெய்யவில்லை.
translation_notes:
  register: நவீன தரத்தமிழில், வழிபாட்டு மரியாதையையும் சங்கீதத் தலைப்பின் சுருக்கமான நடையையும் காக்கும் மொழிநடை. ‘பாடகர் தலைவர்’ பொதுவாசகர்களுக்குப் புரியும்படி இசை வழிநடத்துநரைக் குறிக்கிறது; ‘யாவே’ இறைத்தனிப்பெயராகத் தொடர்ந்து பயன்படுத்தப்படுகிறது.
