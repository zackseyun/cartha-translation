revisions:
- from: பாடகர் தலைவருக்காக. யாவேவின் ஊழியனாகிய தாவீதின் பாடல். யாவே அவரை அவருடைய பகைவர்கள் அனைவரின் கையிலிருந்தும் சவுலின் கையிலிருந்தும் விடுவித்த நாளில், அவர் இந்தப் பாடலின் வார்த்தைகளை யாவேவிடம் உரைத்தார்.[a]
