    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְכַּב
  choice: ஏறி
  rationale: רכב என்பதன் அடிப்படைப் பொருள் ஏறுதல் அல்லது சவாரி செய்தல். கேருபு வாகனம்போல் சித்தரிக்கப்படும் கவித்துவப் படிமத்தை இயல்பான தமிழில் ‘ஏறி’ தக்கவைக்கிறது.
- source_word: עַל
  choice: மேல்
  rationale: இங்கு இந்த முன்னிடைச்சொல் இருப்பிடம் அல்லது தாங்கும் ஆதாரத்தைக் குறிக்கிறது; தமிழில் ‘மேல்’ இயல்பான நேரடி இணை.
- source_word: כְּרוּב
  choice: கேருபு
  rationale: இது ஒருமையில் வரும் விண்ணுலக உயிரினம் அல்லது அரியணைத் தாங்கியைக் குறிக்கிறது. விளக்கிப் பொருளுரைக்காமல் எபிரெயப் படிமத்தை ஒலிபெயர்ப்பாகத் தக்கவைக்கிறது.
- source_word: וַיָּעֹף
  choice: பறந்தார்
  rationale: עוף என்பதன் நேரடிப் பொருள் ‘பறத்தல்’; இணையான இயக்கப் படிமத்தைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: וַיֵּדֶא
  choice: விரைந்து சென்றார்
  rationale: அரிதாக வரும் இவ்வினைச்சொல், இச்சூழலில் காற்றில் நிகழும் வேகமான இயக்கத்தைக் குறிப்பதாகப் பொதுவாகப் புரிந்துகொள்ளப்படுகிறது. ‘விரைந்து சென்றார்’ இயக்கத்தையும் வேகத்தையும் காட்டுகிறது; ஆனால் பாய்தல் அல்லது கீழ்நோக்கி விரைதல் போன்ற குறிப்பிட்ட திசையைத் திணிக்கவில்லை.
- source_word: כַּנְפֵי
  choice: சிறகுகள்மேல்
  rationale: כָּנָף என்பதன் பன்மை இணைப்புவடிவம் நேரடியாக ‘சிறகுகள்’ எனப் பொருள்படும். காற்றுக்குச் சிறகுகள் உள்ளதுபோன்ற கவித்துவ உருவகத்தைத் தக்கவைக்கிறது.
- source_word: רוּחַ
  choice: காற்று
  rationale: רוּחַ என்பதற்கு காற்று, மூச்சு, ஆவி ஆகிய பொருள்கள் இருக்கலாம். இங்குள்ள புயல் சார்ந்த இறைத்தோற்றச் சூழலில் ‘காற்று’ மிகவும் பொருத்தமானது.
theological_decisions:
- issue: கேருபின்மேல் இறைவன் ஏறிச் செல்லும் படிமத்தின் இயல்பு
  choice: இறைவன் ஒரு கேருபின்மேல் ஏறிப் பறக்கும் தெளிவான கவித்துவப் படிமத்தை அப்படியே தக்கவைத்தல்.
  alternative: கேருபை புயல் மேகம் அல்லது விண்ணுலகப் படையின் உருவகம் என்று உரைக்குள் விளக்குதல்.
  rationale: எபிரெய உரை ஒரு குறிப்பிட்ட இயற்கை அல்லது பிரபஞ்சவியல் விளக்கத்தை வழங்காமல் வலிமையான இறைத்தோற்றப் படிமத்தை முன்வைக்கிறது. அதை விளக்கிக் குறுக்காமல் தக்கவைப்பது கவிதையையும் அதன் திறந்த தன்மையையும் மதிக்கிறது.
- issue: இறுதி சொற்றொடரில் רוּחַ என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘காற்று’ என்று மொழிபெயர்த்தல்.
  alternative: ‘ஆவி’ அல்லது ‘மூச்சு’.
  rationale: சுற்றியுள்ள புயல் இறைத்தோற்றச் சூழலும் ‘சிறகுகள்’ என்ற படிமமும் ‘காற்று’ என்பதையே வலுவாக ஆதரிக்கின்றன; எனினும் மற்ற சொற்பொருள் வாய்ப்புகள் அடிக்குறிப்பில் தெரிவிக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகருக்குப் புரியும் அதேவேளையில் சங்கீதக் கவிதைக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘கேருபு’ என்ற வேதாகமச் சொல் விளக்கிப் பரப்பாமல் தக்கவைக்கப்பட்டுள்ளது. இரண்டு இணையான இயக்க வினைகளும் காற்றின் ‘சிறகுகள்’ என்ற உருவகமும் பாதுகாக்கப்பட்டுள்ளன.
