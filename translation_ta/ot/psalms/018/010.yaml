  text: And he rode on a cherub and flew[b][a]; he sped on the wings of the wind.
translation:
  language: ta
  text: அவர் ஒரு கேருபின்மேல் ஏறிப் பறந்தார்; காற்றின்[b] சிறகுகள்மேல் விரைந்து சென்றார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘விரைந்து சென்றார்’ என மொழிபெயர்க்கப்பட்டுள்ள அரிய எபிரெய வினைச்சொல்லை ‘பாய்ந்து சென்றார்’ அல்லது ‘விரைந்து கீழிறங்கினார்’ என்றும் பொருள்கொள்ளலாம்.
