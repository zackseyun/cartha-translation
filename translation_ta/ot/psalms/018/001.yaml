  text: וַ/יֹּאמַ֡ר אֶרְחָמְ/ךָ֖ יְהוָ֣ה חִזְקִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/001.yaml
  text: And he said[a], “I love you, O Yahweh, my strength.”
translation:
  language: ta
  text: 'அவர் கூறினார்: “யாவே, என் வலிமையே, நான் உம்மை நேசிக்கிறேன்[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய வினைச்சொல், ‘உம்மிடம் கனிவான பாசம் கொண்டிருக்கிறேன்’ அல்லது ‘உம்மை ஆழமாக நேசிக்கிறேன்’ என்றும் பொருள்படலாம்; பொதுவாக அது இரக்கத்தின் நுட்பத்தையும் கொண்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: அவர் கூறினார்
  rationale: வாவ்-தொடருடன் வரும் אמר என்ற வினைச்சொல்லை வெளிப்படையாக மொழிபெயர்ப்பது WLC மூலத்தில் உள்ள உரையறிமுகத்தைப் பாதுகாக்கிறது. தமிழில் இயல்பாக இருக்க, தனியாக ‘மேலும்’ அல்லது ‘அப்போது’ சேர்க்கப்படவில்லை.
- source_word: אֶרְחָמְךָ
  choice: நான் உம்மை நேசிக்கிறேன்
  rationale: רחם என்ற வேர்ச்சொல் இரக்கம், கனிவு, ஆழ்ந்த பாசம் ஆகிய நிழற்பொருள்களைக் கொண்டது. இறைவனை நேரடியாக விளிக்கும் இச்சூழலில் ‘இரங்குகிறேன்’ என்பது தவறான பொருளுணர்வை ஏற்படுத்தக்கூடும்; ‘நேசிக்கிறேன்’ என்பது பக்திப்பூர்வமான ஆழ்ந்த பாசத்தை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது. மூலத்தின் கனிவான பாச நுட்பம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான יהוה-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: חִזְקִי
  choice: என் வலிமையே
  rationale: முதலாம் நபர் ஒருமை உடைமை விகுதியுடன் உள்ள பெயர்ச்சொல் ‘என் வலிமை’ என்று பொருள்படும். யாவேயை நேரடியாக அழைக்கும் தொடரில் தமிழின் விளிவேற்றுமைக்கு ஏற்றவாறு ‘என் வலிமையே’ என வழங்கப்பட்டுள்ளது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் பொதுப் பட்டப்பெயர் அல்ல, நான்கெழுத்து இறைப்பெயரே உள்ளது. ஆகவே தனிப்பெயரின் தன்மையைப் பாதுகாக்க ‘யாவே’ என்ற ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டது.
- issue: இறைவனை நோக்கிப் பயன்படுத்தப்படும் רחם என்பதன் பொருள்
  choice: நான் உம்மை நேசிக்கிறேன்
  alternative: நான் உம்மீது இரக்கம் கொள்கிறேன் / நான் உம்மை ஆழமாகப் பற்றிக்கொண்டிருக்கிறேன்
  rationale: வினைச்சொல்லின் அடிப்படைப் பொருள் இரக்கம் அல்லது கனிவான பாசத்துடன் தொடர்புடையது. ஆனால் இறைவனை நோக்கிய இவ்வுரையில் இரக்கப்படுதல் என்ற பொருள் இயல்பற்றது; ஆழ்ந்த அன்பும் பாசமும் கொண்ட பக்திப்பூர்வமான பொருளே சூழலுக்குப் பொருந்துகிறது. இருப்பினும் மூலச்சொல்லின் நுட்பம் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் சங்கீதத்திற்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. இறைவனை நோக்கிய மரியாதையைத் தெரிவிக்க ‘உம்மை’ பயன்படுத்தப்பட்டுள்ளது; ‘என் வலிமையே’ என்பது நேரடி விளிப்பாக அமைக்கப்பட்டுள்ளது.
