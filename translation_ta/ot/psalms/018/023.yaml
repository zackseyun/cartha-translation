source:
  edition: WLC
  text: וָ/אֱהִ֣י תָמִ֣ים עִמּ֑/וֹ וָ֝/אֶשְׁתַּמֵּ֗ר מֵ/עֲוֺנִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/023.yaml
  text: I was blameless before him[c][b][a], and I kept myself from my iniquity.
translation:
  language: ta
  text: அவரோடு நான் குற்றமற்றவனாய் இருந்தேன்[a][b]; என் அக்கிரமத்திலிருந்து என்னைக் காத்துக்கொண்டேன்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “முழுமையானவனாய்” அல்லது “நேர்மையானவனாய்.” இங்கு “குற்றமற்றவன்” என்பது முற்றிலும் பாவமற்றவன் என்பதை அவசியம் குறிக்காமல், நேர்மையையும் பழியற்ற நடத்தையையும் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: சுற்றியுள்ள வசனங்களின்படி, “அவர்” என்பது ஆண்டவரைக் குறிக்கிறது.
    reason: cross_reference
  - marker: c
    text: அல்லது, “என் குற்றப்பழியிலிருந்து” அல்லது “என் பாவத்திலிருந்து.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֱהִי
  choice: நான் … இருந்தேன்
  rationale: היה என்பதன் Qal wayyiqtol முதலாம் நபர் ஒருமை வடிவம் இங்கு கடந்தகால நிலையைச் சுட்டுகிறது; செய்யுள் தொடர்ச்சியைக் காட்டும் ו தமிழில் தனியாக மொழிபெயர்க்கப்படாமல் இயல்பான வாக்கிய அமைப்பில் வெளிப்படுகிறது.
- source_word: תָמִים
  choice: குற்றமற்றவனாய்
  rationale: ஒழுக்கச் சூழலில் இந்தச் சொல் முழுமை, நேர்மை, பழியற்ற நிலை ஆகியவற்றைக் குறிக்கலாம். ‘குற்றமற்றவனாய்’ என்பது எபிரெயச் சொல்லின் வலுவான ஒழுக்கக் கூற்றைப் பேணுகிறது; இது முற்றிலும் பாவமற்ற தன்மையை அவசியம் குறிக்காது என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- source_word: עִמּוֹ
  choice: அவரோடு
  rationale: עם என்ற முன்னிடைச்சொல்லின் நேரடியான பொருளான ‘உடன்/ஓடு’ என்பதையும், மூன்றாம் நபர் ஆண்பால் ஒருமைப் பதிலிடுபெயரையும் பேணுகிறது. சூழலில் ‘அவர்’ என்பது ஆண்டவரைக் குறிக்கிறது; ஆயினும் மூலத்தின் பதிலிடுபெயர் மாற்றப்படவில்லை.
- source_word: וָאֶשְׁתַּמֵּר
  choice: என்னைக் காத்துக்கொண்டேன்
  rationale: 'שמר என்பதன் Hitpael வடிவத்திலுள்ள தன்னிலைப் பொருளை இது இயல்பாக வெளிப்படுத்துகிறது: கவனமாகத் தன்னைக் காத்துக்கொள்ளுதல்.'
- source_word: מֵעֲוֺנִי
  choice: என் அக்கிரமத்திலிருந்து
  rationale: עָוֹן என்பது அக்கிரமம், பாவம் அல்லது குற்றப்பழி என்ற பொருட்களைக் கொள்ளலாம். מן தரும் விலகல்/பிரிவு உணர்வையும், முதலாம் நபர் ஒருமை உடைமை விகுதியையும் இம்மொழிபெயர்ப்பு பேணுகிறது.
theological_decisions:
- issue: תָמִים என்பதன் ஒழுக்கவியல் பொருளும் மனிதனின் பாவமற்ற நிலையும்
  choice: ‘குற்றமற்றவன்’ என்பது இங்கு நேர்மையையும் பழியற்ற நடத்தையையும் குறிக்கிறது; முற்றிலும் பாவமற்றவன் என்ற கருத்தை அவசியம் தெரிவிக்கவில்லை.
  alternative: இதை முழுமையான பாவமின்மை பற்றிய கூற்றாக வாசித்தல்.
  rationale: சங்கீதத்தின் சூழல் நடத்தையையும் நீதியான தீர்ப்பையும் பற்றிய வலுவான கூற்றை முன்வைக்கிறது. மூலத்தின் வலிமையைத் தளர்த்தாமலும், அது வெளிப்படையாகக் கூறாத முழுமையான பாவமின்மையைச் சேர்க்காமலும் மொழிபெயர்க்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பானதும் கண்ணியமானதுமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘அவரோடு’ என்பது עִמּוֹ என்பதன் உறவுசார் நேரடிப் பொருளைப் பேணுகிறது; ‘அக்கிரமம்’ மூலச்சொல்லின் ஒழுக்கப் பாரத்தைக் காக்கிறது.
