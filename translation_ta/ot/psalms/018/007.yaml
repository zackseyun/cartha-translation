  text: Then the earth reeled and quaked[a], and the foundations of the mountains trembled and reeled, because he was angry.
translation:
  language: ta
  text: 'அப்போது பூமி நிலைகுலைந்து அதிர்ந்தது;

    மலைகளின் அடித்தளங்கள் நடுங்கி நிலைகுலைந்தன;

    ஏனெனில் அவர் கோபமடைந்தார்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் நேரடியாக, “அவருடைய கோபம் பற்றியெரிந்ததால்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּגְעַשׁ
  choice: நிலைகுலைந்தது
  rationale: געשׁ குறிக்கும் கடுமையான அசைவையும் குலைவையும் இயல்பான கவிதைத் தமிழில் வெளிப்படுத்துகிறது; அடுத்துள்ள ‘அதிர்ந்தது’ என்பதிலிருந்து பொருள் வேறுபாட்டையும் காக்கிறது.
- source_word: וַתִּרְעַשׁ
  choice: அதிர்ந்தது
  rationale: רעשׁ இங்கு நிலநடுக்கம் போன்ற அதிர்வைக் குறிக்கிறது; ‘பூமி அதிர்ந்தது’ என்பது நவீனத் தமிழில் இயல்பான இணைவு.
- source_word: הָאָרֶץ
  choice: பூமி
  rationale: இறைவெளிப்பாட்டால் படைப்புலகம் குலையும் இச்சூழலில் உள்ளூரான ‘நாடு’ என்பதைவிட ‘பூமி’ பொருத்தமானது.
- source_word: מוֹסְדֵי הָרִים
  choice: மலைகளின் அடித்தளங்கள்
  rationale: மலைகளைத் தாங்கும் அடிப்படை ஆதாரங்கள் என்ற கவிதைப் படிமத்தைத் தெளிவாகக் காக்கிறது.
- source_word: יִרְגָּזוּ
  choice: நடுங்கி
  rationale: רגז குறிக்கும் நடுக்கத்தையும் கலக்கத்தையும் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: וַיִּתְגָּעֲשׁוּ
  choice: நிலைகுலைந்தன
  rationale: தொடக்கத்தில் வந்த געשׁ வேர்ச்சொல்லை மீண்டும் எதிரொலிக்கச் செய்து எபிரேயக் கவிதையின் ஒத்திசைவைக் காக்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முன்னைய பிரபஞ்சக் குலைவுக்கான காரணத்தை அறிமுகப்படுத்தும் காரணப் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: חָרָה לוֹ
  choice: அவர் கோபமடைந்திருந்தார்
  rationale: எரிதலைக் கொண்டு கோபத்தைச் சித்தரிக்கும் எபிரேய மரபுத்தொடரின் கருத்தை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; சொல்லர்த்தமான படிமம் அடிக்குறிப்பில் காக்கப்படுகிறது.
theological_decisions:
- issue: இறைவனுடைய கோபத்தை மனித உணர்வின் மொழியில் சித்தரித்தல்
  choice: அவர் கோபமடைந்திருந்தார்
  alternative: அவருடைய கோபம் பற்றியெரிந்தது
  rationale: இறைவனுடைய கோபத்தின் உண்மையைத் தணிக்காமல், எபிரேய மரபுத்தொடரை வாசகர்களுக்கு இயல்பாக வழங்குகிறது. ‘எரிதல்’ என்ற மூலப் படிமம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதக் கவிதைக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. געשׁ என்ற வேரின் மீள்வருகையை ‘நிலைகுலை’ என்பதன் மூலம் இரு இடங்களிலும் எதிரொலிக்கச் செய்துள்ளோம்; அதேவேளை רעשׁ மற்றும் רגז ஆகியவற்றை முறையே ‘அதிர்’, ‘நடுங்கு’ என்று வேறுபடுத்தியுள்ளோம்.
