base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/008.yaml
  text: Smoke rose from his nostrils[a], and fire from his mouth consumed; coals blazed from him.
translation:
  language: ta
  text: அவருடைய மூக்குத்துளைகளிலிருந்து புகை எழுந்தது[a]; அவருடைய வாயிலிருந்து நெருப்பு சுட்டெரித்தது; அவரிடமிருந்து தீக்கங்குகள் கொழுந்துவிட்டு எரிந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவருடைய கோபத்திலிருந்து.’ எபிரெய மொழியில் אַף என்பது ‘மூக்கு/மூக்குத்துளை’ என்றும், மரபுத்தொடராக ‘கோபம்’ என்றும் பொருள்படும். இங்கு ‘அவருடைய வாயிலிருந்து’ என்ற இணையான சொற்றொடர் நேரடியான உடல் படிமத்தை ஆதரிக்கிறது.
    reason: lexical_alternative
