- source_word: עָשָׁן
  choice: புகை
  rationale: எபிரெயச் சொல்லின் நேரடியான, சூழலுக்கேற்ற இணைச்சொல்.
- source_word: בְּאַפּוֹ
  choice: அவருடைய மூக்குத்துளைகளிலிருந்து
  rationale: אַף என்பதற்கு ‘கோபம்’ என்ற மரபுத்தொடர் பொருளும் உண்டு; ஆனால் ‘வாயிலிருந்து’ என்ற இணையான உடல் உருவகத்தால் இங்கு மூக்கு அல்லது மூக்குத்துளைகள் என்ற நேரடிப் படிமம் முன்னுரிமை பெறுகிறது.
- source_word: מִפִּיו
  choice: அவருடைய வாயிலிருந்து புறப்பட்ட
  rationale: தெய்வத் தோற்றத்தின் மனித உடல் சார்ந்த கவிப்படிமத்தைத் தெளிவாகப் பாதுகாக்கிறது; இயல்பான தமிழுக்காக ‘புறப்பட்ட’ சேர்க்கப்பட்டுள்ளது.
- source_word: תֹּאכֵל
  choice: விழுங்கியது
  rationale: ‘உண்ணுதல்/விழுங்குதல்’ என்ற வினை உருவகத்தைப் பாதுகாத்து, நெருப்பின் அழிக்கும் செயலை வெளிப்படுத்துகிறது.
- source_word: גֶּחָלִים
  choice: தீக்கங்குகள்
  rationale: எரியும் நிலக்கரி அல்லது தணல்களைக் குறிக்கும் சொல்லுக்கு நவீன தமிழில் தெளிவான கவித்துவ இணை.
- source_word: בָּעֲרוּ
  choice: கொழுந்துவிட்டு எரிந்தன
  rationale: எரிதல் என்ற அடிப்படைப் பொருளை உயிரோட்டமான, இயல்பான தமிழ்க் கவிநடையில் வழங்குகிறது.
- source_word: מִמֶּנּוּ
  choice: அவரிடமிருந்து
  rationale: ‘அவரிடமிருந்து’ என்ற மூலத்தின் திசை/தோற்றப் பொருளை அதிக விளக்கமின்றிப் பாதுகாக்கிறது.
theological_decisions:
- issue: தெய்வத் தோற்றத்தில் கடவுளைப் பற்றிய மனித உடல் சார்ந்த மொழி
  choice: ‘மூக்குத்துளைகள்’, ‘வாய்’ என்ற உடல் உருவகங்களை அப்படியே தக்கவைத்தல்
  alternative: אַף என்பதை ‘கோபம்’ என்று மரபுத்தொடர் பொருளில் மொழிபெயர்த்தல்
  rationale: இது தெய்வத் தோற்றத்தைச் சித்தரிக்கும் கவிதை. ‘வாயிலிருந்து’ என்ற இணை அமைப்பு நேரடியான உடல் படிமத்தை ஆதரிக்கிறது; அதை ‘கோபம்’ என்று மட்டும் மாற்றுவது மூலத்தின் திட்டமிட்ட உருவகத்தையும் அதன் பொருள் இருமையையும் குறைக்கும்.
translation_notes:
  register: நவீன பொதுத்தமிழில், கவிதைக்குரிய கண்ணியத்துடனும் வலிமையான தெய்வத் தோற்றப் படிமத்துடனும் அமைக்கப்பட்டுள்ளது. மரியாதை ஒருமையான ‘அவர்’ பயன்படுத்தப்பட்டுள்ளது; மூலத்தின் மூன்று இணைச் சித்திரங்களும் அரைப்புள்ளிகளால் தெளிவாகப் பிரிக்கப்பட்டுள்ளன.
