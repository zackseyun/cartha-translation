lexical_decisions:
- source_word: עַל כֵּן
  choice: ஆகையால்
  rationale: முந்தைய சூழலிலிருந்து வரும் முடிவையோ விளைவையோ குறிக்கும் எபிரெயச் சொற்றொடரின் தர்க்கத் தொடர்பை இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: אוֹדְךָ
  choice: உமக்கு நன்றி செலுத்துவேன்
  rationale: சங்கீத நன்றியறிதல் சூழலில் ידה என்பதன் ஹிப்இல் வடிவம் நன்றி செலுத்துதல் அல்லது புகழ்தலைக் குறிக்கிறது; இங்கு நன்றியின் நுண்ணுணர்வையும் இரண்டாம் நபர் பின்னொட்டையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: בַגּוֹיִם
  choice: தேசங்களின் நடுவே
  rationale: גוים என்பது தேசங்கள் அல்லது மக்கள் இனங்களைப் பரந்த பொருளில் குறிக்கிறது. இந்தத் தேர்வு சர்வதேச பரப்பைத் தக்கவைக்கிறது; ‘புறவினத்தார் நடுவே’ என்பதும் சாத்தியம்.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பட்டத்தால் மாற்றாமல், எபிரெய மூலத்தில் உள்ள தேவனுடைய தனிப்பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: וּלְשִׁמְךָ
  choice: உமது பெயரை
  rationale: தமிழில் ‘பெயரைப் புகழ்ந்து பாடுதல்’ என்பது இயல்பான வினைத் தொடர்பாக இருப்பதால், எபிரெய לְ முன்னிடைச்சொல்லின் உறவை பொருளழியாமல் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֲזַמֵּרָה
  choice: புகழ்ந்து பாடுவேன்
  rationale: זמר என்பதன் பிஎல் வடிவம் இசையுடன் புகழ்ந்து பாடுவதைச் சுட்டுகிறது; முந்தைய நன்றிசெலுத்துதலுடன் உள்ள கவிதை இணைப்பையும் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைநாமத்தை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலவசனம் நான்கெழுத்து இறைநாமத்தை நேரடியாகப் பயன்படுத்துகிறது. ஒரு பட்டத்தைப் பதிலிடாமல் தனிப்பெயரை ஒலிபெயர்ப்பது மூலத்தின் தன்மையைப் பாதுகாக்கிறது.
- issue: גוים என்பதன் அடையாளப் பரப்பு
  choice: தேசங்கள்
  alternative: புறவினத்தார்
  rationale: சங்கீதத்தின் எபிரெயச் சூழலில் இச்சொல் பரந்த வகையில் தேசங்களைக் குறிக்கலாம். பின்னைய பயன்பாட்டின் அடிப்படையில் அதை மட்டும் ‘புறவினத்தார்’ என்று சுருக்காமல், மாற்றுப் பொருளை அடிக்குறிப்பில் வைத்திருக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், வழிபாட்டுக்குரிய கண்ணியத்துடன் ‘உமக்கு/உமது’ வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. எபிரெயக் கவிதையின் இணை அமைப்பை இரண்டு அடிகளாகவும், இறைநாமத்தை ‘யாவே’ என்றும் தக்கவைத்துள்ளது.
