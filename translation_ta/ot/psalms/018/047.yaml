  text: எனக்குப் பழிவாங்குதலை அளிக்கிற இறைவன், மக்களை எனக்குக் கீழ்ப்படுத்துகிறார்[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் “பழிவாங்குதல்கள்” என்ற பன்மை வடிவம் உள்ளது; அது பல பழிவாங்கும் செயல்களையோ தீவிரமான பழிவாங்குதலையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இங்குள்ள எபிரெய வினைச்சொல் பொதுவாக “கீழ்ப்படுத்துகிறார்” அல்லது “அடிபணியச் செய்கிறார்” என்று புரிந்துகொள்ளப்படுகிறது; “பேசுகிறார்” என்று அல்ல.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵל
  choice: இறைவன்
  rationale: திட்டவட்டமான சுட்டுடன் வரும் אֵל என்பதைக் கவிதைநடையில் இயல்பாகவும் மரியாதையாகவும் வெளிப்படுத்துகிறது; தமிழில் தனியாகச் சுட்டுச் சொல்லைச் சேர்ப்பது தேவையில்லை.
- source_word: הַנּוֹתֵן
  choice: செய்கிற
  rationale: பெயரெச்ச வினை வடிவம் இறைவனை அவரது வழக்கமான செயல் மூலம் வருணிக்கிறது; נְקָמוֹת உடன் சேர்ந்து தமிழில் ‘பழிவாங்கும் செயல்களைச் செய்கிற’ என்பது இயல்பாக அமைகிறது.
- source_word: נְקָמוֹת
  choice: பழிவாங்கும் செயல்கள்
  rationale: எபிரெயச் சொல்லின் பன்மை வடிவத்தைப் பாதுகாத்து, தெய்வீகத் தண்டனை/பதிலடி என்ற வலிமையை மெலிதாக்காமல் காட்டுகிறது.
- source_word: לִי
  choice: எனக்காக
  rationale: ל இங்கு சங்கீதக்காரரின் சார்பாக அல்லது நலனுக்காக நிகழும் செயலைக் குறிக்கிறது; ‘எனக்காக’ என்பது தமிழில் தெளிவான பயனாளிப் பொருளைத் தருகிறது.
- source_word: וַיַּדְבֵּר
  choice: கீழ்ப்படுத்துகிறார்
  rationale: இச்சூழலில் ‘பேசுகிறார்’ அல்ல, ‘அடக்குகிறார்/கீழ்ப்படுத்துகிறார்’ என்ற அரிய பொருளே அரச வெற்றியின் இணைப்புக்கு ஏற்றது.
- source_word: עַמִּים
  choice: மக்களை
  rationale: பன்மையான மக்கள் இனங்கள் அல்லது ஜனக்கூட்டங்களைக் குறிக்கும் עַמִּים என்பதற்கு ‘மக்கள்’ இயல்பான தமிழ் இணை.
- source_word: תַּחְתָּי
  choice: எனக்குக் கீழ்
  rationale: ஆட்சிக்குட்படுத்தலைக் காட்டும் இடவியல் உருவகத்தை நேரடியாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: தெய்வீகப் பழிவாங்குதல்
  choice: ‘பழிவாங்கும் செயல்கள்’ என்ற நேரடியான மொழியைத் தக்கவைத்தல்
  alternative: ‘நியாயம் பெற்றுத்தருதல்’ அல்லது ‘விடுவித்தல்’
  rationale: נְקָמוֹת என்பது பழிவாங்குதல்/பதிலடி செயல்களை நேரடியாகக் குறிக்கிறது. மென்மையான மாற்றுகள் மூலத்தின் வலிமையைக் குறைத்து விளக்கத்தை உரைக்குள் சேர்க்கும்.
- issue: וַיַּדְבֵּר என்பதன் சூழல்சார் பொருள்
  choice: மக்களைக் கீழ்ப்படுத்துதல்
  alternative: மக்களிடம் பேசுதல்
  rationale: அரச வெற்றியை வருணிக்கும் இச்சூழலும் இணையான வேதாகமப் பயன்பாடும் அடக்கி ஆளுதல் என்ற பொருளை ஆதரிக்கின்றன; ‘பேசுதல்’ சூழலுக்கு ஒவ்வாது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, மரியாதைமிக்க கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘பழிவாங்கும் செயல்கள்’ மூலத்தின் பன்மையையும் தீவிரத்தையும் தக்கவைக்கிறது; ‘கீழ்ப்படுத்துகிறார்’ அரச வெற்றியின் சூழலைத் தெளிவாக்குகிறது.
