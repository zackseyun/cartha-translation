    reason: lexical_alternative
lexical_decisions:
- source_word: תַּרְחִיב
  choice: அகலமாக்கினீர்
  rationale: רחב என்பதன் ஹிஃபில் வடிவம் ‘அகலமாக்கு’ என்ற காரணவினைப் பொருளைத் தருகிறது; சூழலில் தேவனை நோக்கிப் பேசுவதால் மரியாதை ஒருமை பயன்படுத்தப்பட்டது.
- source_word: צַעֲדִי
  choice: என் நடையை
  rationale: צעד என்பது ‘அடி/நடை/எடுத்துவைப்பு’ என்பதைக் குறிக்கும். ஒருமை வடிவத்தையும், தடையில்லாமல் முன்னேறும் உருவகத்தையும் தமிழில் இயல்பாகப் பாதுகாக்க ‘என் நடையை’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: תַחְתָּי
  choice: என் காலடிகளுக்குக் கீழே
  rationale: ‘எனக்குக் கீழே’ என்பது நேரடியான பொருள்; ஆனால் நிலையான காலூன்றலைக் காட்டும் உருவகத்தைத் தமிழில் தெளிவாக வைத்திருக்க ‘என் காலடிகளுக்குக் கீழே’ என வழங்கப்பட்டது.
- source_word: וְלֹא
  choice: … இல்லை
  rationale: எளிய இணைப்பும் மறுப்பும்; இரண்டாம் கூற்றை நேரடியாக இணைக்கிறது.
- source_word: מָעֲדוּ
  choice: இடறவில்லை
  rationale: מעד என்பது வழுக்குதல், தடுமாறுதல், நிலைதவறுதல் ஆகியவற்றைக் குறிக்கும். கணுக்கால்களோடு வரும் உடல்சார் உருவகத்திற்கு ‘இடறவில்லை’ இயல்பானது.
- source_word: קַרְסֻלָּי
  choice: என் கணுக்கால்கள்
  rationale: இந்தச் சொல் பொதுவான ‘கால்கள்’ என்பதைக் காட்டிலும் குறிப்பாக கணுக்கால்களைக் குறிக்கிறது; மூலத்தின் தெளிவான உடல்சார் படிமம் பாதுகாக்கப்பட்டது.
