  text: எனக்குக் கீழே என் அடிவைப்பை நீர் அகலமாக்கினீர்[a]; என் கணுக்கால்கள் தள்ளாடவில்லை[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எனக்குக் கீழே என் அடியை அகலமாக்கினீர்.” இந்த எபிரெய உருவகம், தடையின்றி நடப்பதற்குப் போதிய இடத்தையும் உறுதியான காலூன்றலையும் கடவுள் அளிப்பதைக் காட்டுகிறது.
    reason: lexical_alternative
  - marker: b
