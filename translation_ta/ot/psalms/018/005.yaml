lexical_decisions:
- source_word: חֶבְלֵי
  choice: கயிறுகள்
  rationale: சிக்கவைக்கும் அல்லது கட்டுப்படுத்தும் கவித்துவ உருவகத்தை மிகைப்படுத்தாமல் நேரடியாகப் பாதுகாக்கிறது.
- source_word: שְׁאוֹל
  choice: ஷியோல்
  rationale: எபிரெயச் சொல்லின் விரிவான பொருளை ‘கல்லறை’ அல்லது ஒரு குறிப்பிட்ட மறுமை உலகக் கருத்தாகச் சுருக்காமல், ‘மரணம்’ என்பதுடனான கவித்துவ இணைநிலையையும் வேறுபாட்டையும் காக்கிறது.
- source_word: סְבָבוּנִי
  choice: என்னைச் சூழ்ந்துகொண்டன
  rationale: முற்றிலும் சுற்றிக்கொள்ளும் அச்சுறுத்தலை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: קִדְּמוּנִי
  choice: என்னை எதிர்கொண்டன
  rationale: முன்வந்து சந்தித்தல் என்ற அடிப்படைப் பொருளையும், இச்சூழலில் உள்ள அச்சுறுத்தும் சந்திப்பையும் வெளிப்படுத்துகிறது.
- source_word: מוֹקְשֵׁי
  choice: கண்ணிகள்
  rationale: வேட்டையாடுவதற்காக மறைத்து வைக்கப்படும் பொறி என்ற உருவகத்தைப் பாதுகாக்கும் கவித்துவமான, புரிந்துகொள்ளத்தக்க சொல்.
- source_word: מָוֶת
  choice: மரணம்
  rationale: மூலத்தின் வழக்கமான பொருளையும், இங்கு மரணம் ஓர் அச்சுறுத்தும் சக்திபோல் சித்தரிக்கப்படுவதையும் காக்கிறது.
theological_decisions:
- issue: שְׁאוֹל என்பதன் மொழிபெயர்ப்பு
  choice: ஷியோல்
  alternative: கல்லறை; இறந்தோரின் உலகம்
  rationale: ஒரே தமிழ்ச் சொல்லால் அதன் பொருள் வரம்பைச் சுருக்குவதையும் பிற்காலக் கோட்பாட்டுப் பொருளைத் திணிப்பதையும் தவிர்க்க ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டது.
