  text: כִּֽי שָׁ֭מַרְתִּי דַּרְכֵ֣י יְהוָ֑ה וְ/לֹֽא רָ֝שַׁ֗עְתִּי מֵ/אֱלֹהָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/021.yaml
  text: For I have kept the ways of Yahweh[b][a], and have not wickedly departed from my God.
translation:
  language: ta
  text: ஏனெனில், நான் யாவேயின் வழிகளைக் கடைப்பிடித்தேன்; தீய முறையில் என் இறைவனை விட்டு விலகவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் இறைவனை விட்டு விலகி நான் தீமை செய்யவில்லை.” எபிரெய வினை இன்னும் நேரடியாக “தீமையாக நடந்துகொண்டேன்” என்றும் பொருள்படலாம்; அதைத் தொடர்ந்து வரும் சொற்றொடர் இறைவனிடமிருந்து விலகுதலை வெளிப்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தையோ விளக்கத்தையோ அறிமுகப்படுத்துகிறது.
- source_word: שָׁמַרְתִּי
  choice: கடைப்பிடித்தேன்
  rationale: ‘காத்தல், கடைப்பிடித்தல்’ என்ற பொருளுள்ள வினை இங்கு யாவேயின் வழிகளுக்குக் கீழ்ப்படிந்து வாழ்வதைக் குறிக்கிறது.
- source_word: דַּרְכֵי
  choice: வழிகளை
  rationale: நேரடியான பாதைகளை அல்ல, இறைவன் வகுத்த வாழ்க்கை நெறிகளைச் சுட்டும் இயல்பான உருவகத்தைப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்திலுள்ள இறைப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், நவீன தமிழில் அண்மித்த ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: רָשַׁעְתִּי מֵאֱלֹהָי
  choice: தீய முறையில் என் இறைவனைவிட்டு விலகவில்லை
  rationale: רשע என்பதன் ‘தீமையாக நடத்தல்’ என்ற வலிமையையும், מִן என்பதன் ‘விட்டு/இருந்து’ என்ற பிரிவு சார்ந்த பொருளையும் ஒருங்கிணைத்து இயல்பான தமிழில் தருகிறது; மாற்று சொற்றொடரமைப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: אֱלֹהָי
  choice: என் இறைவன்
  rationale: முதல் நபர் ஒருமை உடைமை விகுதியைத் தெளிவாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: சங்கீதக்காரரின் நீதியைக் குறித்த வலுவான கூற்று பாவமற்ற முழுநிறைவாகத் தோன்றாதவாறு மொழிபெயர்த்தல்
  choice: யாவேயின் வழிகளைக் கடைப்பிடித்து, தன் இறைவனைவிட்டு தீய முறையில் விலகாத உடன்படிக்கை உண்மையாகக் கூற்றைப் பாதுகாத்தல்
  alternative: ‘நான் தீயவனாக இருக்கவில்லை’ போன்ற முழுமையான பாவமின்மையை உணர்த்தக்கூடிய பொதுக் கூற்று
  rationale: எபிரெய உரை யாவேயின் வழிகளையும் இறைவனைவிட்டு விலகாததையும் குறிப்பாக இணைக்கிறது. ஆகவே கூற்றின் வலிமையைக் குறைக்காமலும் அதை முழுமையான பாவமின்மையாக விரிவாக்காமலும் உறவு சார்ந்த பதற்றம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில் எளிதில் புரியக்கூடிய, அதே நேரத்தில் சங்கீதத்திற்கேற்ற கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘கடைப்பிடித்தேன்’ என்பது சமய வழக்குச் சொல்லாக இருந்தாலும் பொதுவான தமிழிலும் இயல்பானது; ‘தீய முறையில் ... விலகவில்லை’ என்பது எபிரெய சொற்றொடரின் செறிவையும் பொருள் இருமையையும் காக்கிறது.
