  yaml_path: translation/ot/psalms/018/025.yaml
  text: With the faithful you show yourself faithful[a]; with the blameless man you show yourself blameless.
translation:
  language: ta
  text: உண்மையுள்ளவனோடு நீர் உண்மையுள்ளவராக உம்மை வெளிப்படுத்துகிறீர்[a]; குற்றமற்ற மனிதனோடு நீர் குற்றமற்றவராக உம்மை வெளிப்படுத்துகிறீர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பற்றுறுதியுள்ளவனோடு நீர் பற்றுறுதியுள்ளவராக உம்மை வெளிப்படுத்துகிறீர்.” எபிரெயத்தில் இவ்விரு சொற்களும் ஒரே חסד (ஹெசெத்) வேருடன் தொடர்புடையவை; உடன்படிக்கை உறவிலான பரஸ்பரப் பற்றுறுதியை இது வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָסִיד
  choice: உண்மையுள்ளவன்
  rationale: உடன்படிக்கை உறவில் பற்றுறுதியும் இறைப்பற்றும் கொண்ட ஒருவனை இச்சொல் குறிக்கிறது. “உண்மையுள்ளவன்” என்பது உறவுசார் நம்பகத்தன்மையை இயல்பான நவீனத் தமிழில் தெரிவிப்பதோடு, அடுத்த வினைச்சொல்லுடனான ஒரே வேர்ச் சொல்லின் எதிரொலியையும் ஓரளவு காக்கிறது.
- source_word: תִּתְחַסָּד
  choice: உண்மையுள்ளவராக உம்மை வெளிப்படுத்துகிறீர்
  rationale: חסד வேரின் ஹித்பயேல் வடிவம் இங்கு ஒருவர் எப்படிப்பட்டவராகத் தம்மைக் காட்டுகிறார் என்ற பிரதிபலிப்புப் பொருளைத் தருகிறது. இந்த மொழிபெயர்ப்பு இறைவன் தமது உடன்படிக்கை உண்மையைத் தொடர்பில் வெளிப்படுத்துவதைச் சுட்டி, חָסִיד என்பதுடனான சொல் இணைப்பையும் காக்கிறது.
- source_word: גְּבַר
  choice: மனிதன்
  rationale: இது ஆண்பால் ஒருமைச் சொல்லாக இருந்தாலும், இவ்விடத்தில் வலிமை என்னும் நுண்பொருள் முன்னிலைப்படுத்தப்படவில்லை. “மனிதன்” என்பது தமிழில் ஆண் மனிதனையும் பொதுவாகக் குறிக்கக்கூடிய இயல்பான தேர்வு.
- source_word: תָּמִים
  choice: குற்றமற்ற
  rationale: முழுமை, நேர்மை, பழியற்ற தன்மை ஆகிய பொருள்களை உடைய இச்சொல் ஒழுக்கச் சூழலில் “குற்றமற்ற” என்று இயல்பாக வழங்கப்படுகிறது.
- source_word: תִּתַּמָּם
  choice: குற்றமற்றவராக உம்மை வெளிப்படுத்துகிறீர்
  rationale: תמם வேரிலிருந்து வரும் வினை, முந்தைய תָּמִים சொல்லை எதிரொலிக்கிறது. ஒரே தமிழ்ச் சொல்லைப் பயன்படுத்துவது கவிதை இணைநிலையையும் பிரதிபலிப்புப் பொருளையும் காக்கிறது.
theological_decisions:
- issue: மனிதனின் குணத்திற்கு ஏற்ப இறைவன் தம்மை வெளிப்படுத்துவது
  choice: இறைவன் தொடர்புடையவரிடம் அதற்கேற்ற உண்மையையும் குற்றமற்ற தன்மையையும் உடையவராகத் தம்மை வெளிப்படுத்துகிறார் என்று மொழிபெயர்க்கப்பட்டது.
  alternative: “உண்மையுள்ளவனுக்கு நீர் உண்மையுள்ளவர்; குற்றமற்றவனுக்கு நீர் குற்றமற்றவர்” என்று நிலையான பண்புகளாக மட்டும் கூறலாம்.
  rationale: எபிரெய வினைகளின் பிரதிபலிப்பு வடிவத்தை “உம்மை வெளிப்படுத்துகிறீர்” என்பது காக்கிறது. இதனால் கவிதையின் பரஸ்பரத் தொடர்பும் நிலைத்திருக்கிறது; அதேவேளை மனிதர்களுக்கேற்ப இறைவனின் இயல்பே மாறுகிறது என்று மொழிபெயர்ப்பு தேவையின்றித் தீர்மானிப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், இறைவனை மரியாதைப் பன்மையில் சுட்டும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. இரு அரையடிகளிலும் ஒரே வாக்கிய அமைப்பைத் திரும்பக் கொடுத்து எபிரெய இணைநிலையும் சொல் எதிரொலியும் பாதுகாக்கப்பட்டுள்ளன.
