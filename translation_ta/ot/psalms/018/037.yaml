id: PSA.18.37
reference: Psalms 18:37
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: אֶרְדּ֣וֹף א֭וֹיְבַ/י וְ/אַשִּׂיגֵ֑/ם וְ/לֹֽא אָ֝שׁוּב עַד כַּלּוֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/037.yaml
  text: I pursued my enemies and overtook them[a], and I did not turn back until they were consumed.
translation:
  language: ta
  text: என் பகைவர்களைத் துரத்தி அவர்களை எட்டிப்பிடித்தேன்; அவர்கள் முற்றிலும் அழிந்துபோகும்வரை[a] நான் திரும்பவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொல்லுக்குச் சொல் நெருக்கமாக: “அவர்கள் முடிவுறும்வரை” அல்லது “அவர்களின் அழிவு நிறைவடையும்வரை.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרְדּוֹף
  choice: துரத்தி
  rationale: רדף என்பதன் Qal முற்றுப்பெறா வடிவம் கவிதைநடை வெற்றிவரலாற்றுச் சூழலில் கடந்த செயலைக் குறிக்கிறது. ‘துரத்தி’ என்பது போர்சார் பின்தொடர்தலை இயல்பாகத் தெரிவிக்கிறது.
- source_word: אֹיְבַי
  choice: என் பகைவர்களை
  rationale: אויב என்பதன் முதலாம் நபர் ஒருமை உடைமைப் பின்னொட்டுடன் கூடிய நேரடியான, இயல்பான தமிழ் மொழிபெயர்ப்பு.
- source_word: וְאַשִּׂיגֵם
  choice: அவர்களை எட்டிப்பிடித்தேன்
  rationale: נשׂג என்பதன் Hiphil வடிவம் துரத்திச் சென்று எட்டுதல் அல்லது பிடித்தல் என்ற பொருளைத் தருகிறது. ‘எட்டிப்பிடித்தேன்’ என்பது இரு நுணுக்கங்களையும் போர்சார் சூழலில் தெளிவாக இணைக்கிறது.
- source_word: וְלֹא אָשׁוּב
  choice: நான் திரும்பவில்லை
  rationale: שוב இங்கு துரத்தலைக் கைவிட்டுத் திரும்புவதைச் சுட்டுகிறது. எபிரெயக் கவிதையின் சுருக்கத்தையும் உறுதியையும் இந்த வடிவம் காக்கிறது.
- source_word: עַד
  choice: வரை
  rationale: செயல் நீடிக்கும் கால எல்லையைக் குறிக்கும் עַד என்பதற்கான இயல்பான தமிழ் இணை.
- source_word: כַּלּוֹתָם
  choice: அவர்கள் முற்றிலும் அழிந்துபோகும்
  rationale: כלה என்பதன் infinitive construct மற்றும் மூன்றாம் நபர் பன்மைப் பின்னொட்டு, அவர்களின் முடிவு அல்லது முழுமையான அழிவைச் சுட்டுகிறது. ‘அழிந்துபோகும்’ என்பது செய்பவரை வெளிப்படையாகச் சேர்க்காமல் முழுத் தோல்வியைத் தெரிவிக்கிறது; ‘முற்றிலும்’ முழுமை நுணுக்கத்தை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: இறுதிக் கூறிலுள்ள வன்முறையும் மறைமுகச் செய்பவரும்
  choice: முழுமையான அழிவைத் தெளிவாகக் கூறி, அதைச் செய்தவர் யார் என்பதை வெளிப்படையாகச் சேர்க்காமல் மொழிபெயர்த்தல்
  alternative: அவர்களை நான் முற்றிலும் அழிக்கும்வரை
  rationale: சங்கீதம் இறைவனால் வலுப்படுத்தப்பட்ட போர்வெற்றியைப் பாடுகிறது. ஆயினும் כַּלּוֹתָם என்ற வடிவம் இறுதிக் கூறில் செய்பவரை வெளிப்படையாகக் குறிப்பிடவில்லை. ஆகவே வன்முறையை மென்மைப்படுத்தாமலும், எபிரெயம் கூறாத செய்பவரைச் சேர்க்காமலும் மொழிபெயர்க்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘எட்டிப்பிடித்தேன்’ துரத்தலின் விளைவை இயல்பாகக் காட்டுகிறது; ‘அழிந்துபோகும்வரை’ செய்பவரைக் குறிப்பிடாத மூலமொழியின் இடைவெளியைப் பாதுகாக்கிறது.
