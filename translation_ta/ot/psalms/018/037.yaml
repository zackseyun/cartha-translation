  terminology: “பகைவர்கள்,” “துரத்தி,” and “திரும்பவில்லை” are appropriate and consistent choices. “முற்றிலும் அழிந்துபோகும்வரை” conveys the totality inherent in the completion/consumption expression without adding an explicit agent.
