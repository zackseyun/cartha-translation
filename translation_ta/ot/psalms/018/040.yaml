  text: You gave me the backs of my enemies[a]; I destroyed those who hated me.
translation:
  language: ta
  text: 'என் பகைவர்கள் எனக்கு முதுகு காட்டி ஓடும்படி செய்தீர்[a];

    என்னை வெறுத்தவர்களை நான் அழித்தொழித்தேன்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்கு சொல், “என் பகைவர்களின் பிடரியை எனக்குக் கொடுத்தீர்.” பகைவர்களைப் புறமுதுகிட்டு ஓடச் செய்வதையோ அவர்கள்மேல் வெற்றி அளிப்பதையோ குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹיְבַי
  choice: என் பகைவர்கள்
  rationale: אֹיֵב என்பதன் முதலாம் நபர் ஒருமை உடைமை வடிவை இயல்பான நவீனத் தமிழில் நேரடியாகத் தருகிறது.
- source_word: נָתַתָּה לִּי עֹרֶף
  choice: எனக்கு முதுகுகாட்டி ஓடும்படி செய்தீர்
  rationale: சொல்லுக்கு சொல் பொருள் ‘எனக்குப் பிடரியைக் கொடுத்தீர்.’ பகைவர்கள் திரும்பி ஓடுவதையும் தோற்கடிக்கப்படுவதையும் குறிக்கும் எபிரெய உருவகத்தைத் தமிழில் புரியக்கூடிய போர்க்கள மொழிநடையாக அளிக்கிறது; அடிக்குறிப்பு மூலப்படிமத்தைப் பாதுகாக்கிறது.
- source_word: וּמְשַׂנְאַי
  choice: என்னை வெறுத்தவர்களை
  rationale: שׂנא வினையின் செய்பவர் பெயரெச்ச வடிவையும் முதலாம் நபர் ஒருமை பின்னொட்டையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אַצְמִיתֵם
  choice: நான் அழித்தொழித்தேன்
  rationale: צמת என்பதன் ஹிஃபில் வடிவம் ‘அழியச் செய்தல், முற்றிலும் ஒழித்தல்’ என்ற வலுவான பொருளைக் கொண்டது. ‘அழித்தொழித்தேன்’ அதன் தீவிரத்தையும் நிறைவுத்தன்மையையும் காக்கிறது.
theological_decisions:
- issue: பகைவர்களின் தோல்வியில் தெய்வீகச் செயலும் மனிதச் செயலும்
  choice: முதல் அடியில் கடவுள் பகைவர்களை ஓடச் செய்கிறார்; இரண்டாம் அடியில் சங்கீதக்காரன் அவர்களை அழித்தொழிக்கிறான் என்ற எபிரெய உரையின் இணைப்பை அப்படியே வைத்தல்
  alternative: இரண்டு செயல்களையும் முழுவதும் கடவுளுக்கோ அல்லது முழுவதும் சங்கீதக்காரனுக்கோ உரியதாக விளக்குதல்
  rationale: எபிரெய வினைகளின் நபர் வேறுபாடு தெய்வீக வெற்றியளிப்பையும் மனிதப் போர்ச்செயலையும் பதற்றத்துடன் இணைக்கிறது; மொழிபெயர்ப்பு அதை கோட்பாட்டு விளக்கத்தால் ஒன்றாக்கக்கூடாது.
- issue: עֹרֶף என்ற உடல் உறுப்புப் படிமம்
  choice: முதன்மை உரையில் ‘முதுகுகாட்டி ஓடும்படி’ என்று அதன் சூழல்சார் பொருளைத் தருதல்; அடிக்குறிப்பில் ‘பிடரி’ என்ற நேர்ப்பொருளைக் குறிப்பிடுதல்
  alternative: ‘அவர்களின் பிடரியை எனக்குக் கொடுத்தீர்’ என்று சொல்லுக்கு சொல் மொழிபெயர்த்தல்
  rationale: நேரடி வடிவம் தமிழில் தெளிவற்றதாக இருப்பதால், ஓட்டத்தையும் தோல்வியையும் குறிக்கும் உருவகப் பொருள் முதன்மை உரையில் தரப்படுகிறது; மூலத்தின் உடல் உறுப்புப் படிமம் அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. கடவுளை நோக்கிய ஒருமை மரியாதை வினைமுற்றாக ‘செய்தீர்’ அமைந்துள்ளது; ‘அழித்தொழித்தேன்’ மூலவினையின் வலிமையைத் தக்கவைக்கிறது.
