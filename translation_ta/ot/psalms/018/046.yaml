  text: Yahweh lives[a], and blessed be my rock, and exalted be the God of my salvation.
translation:
  language: ta
  text: 'யாவே உயிரோடிருக்கிறார்!

    என் கன்மலை வாழ்த்தப்படுவாராக!

    எனக்கு மீட்பளிக்கும் கடவுள் உயர்த்தப்படுவாராக![a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எனக்கு மீட்பளிக்கும் கடவுள் உயர்ந்தவர்” அல்லது “எனக்கு மீட்பளிக்கும் கடவுள் உயர்த்தப்படட்டும்.”
    reason: וְיָרוּם என்பது இங்கு துதிசார் விருப்பவினையாகவோ, அறிவிப்பாகவோ புரிந்துகொள்ளப்படலாம்.
lexical_decisions:
- source_word: חַי יְהוָה
  choice: யாவே உயிரோடிருக்கிறார்
  rationale: חַי என்பது இங்கு இறைப்பெயருடன் வரும் பயனிலை அறிவிப்பு. தமிழில் இயல்பாகவும் அதன் உயிருள்ள நிஜத்தன்மையைத் தெளிவாகவும் தெரிவிக்க ‘உயிரோடிருக்கிறார்’ என மொழிபெயர்க்கப்பட்டது; தேவையில்லாத ஆணையிடும் பொருள் சேர்க்கப்படவில்லை.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய இறைப்பெயரான יהוה, ஒரு பட்டத்தால் மாற்றப்படாமல் தமிழில் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டது.
- source_word: וּבָרוּךְ
  choice: வாழ்த்தப்படுவாராக
  rationale: துதிச் சூழலில் உள்ள இந்தச் சொல் ஆசீர்வாதத் தன்மையுள்ள புகழ் முழக்கமாகச் செயல்படுகிறது. ‘வாழ்த்தப்படுவாராக’ என்பது அதன் உயர்ந்த கவித்துவத் தொனியையும் விருப்பவினை நயத்தையும் காக்கிறது.
- source_word: צוּרִי
  choice: என் கன்மலை
  rationale: צוּר என்பதன் பாறை உருவகம் நேரடியாகக் காக்கப்பட்டது. ‘அடைக்கலம்’ என்று விளக்கமாக மாற்றாமல், உறுதியான பாதுகாவலர் என்ற மூல உருவகம் நிலைநிறுத்தப்பட்டது.
- source_word: וְיָרוּם
  choice: உயர்த்தப்படுவாராக
  rationale: இது வடிவில் முற்றுப்பெறாத வினையாக இருந்தாலும், இணையான துதி மொழியின் சூழலில் விருப்பவினை போன்ற புகழ் முழக்கமாகப் புரிந்துகொள்ளப்பட்டுள்ளது. மூலத்தின் வேறு சாத்தியப் பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: אֱלוֹהֵי יִשְׁעִי
  choice: என் மீட்பின் கடவுள்
  rationale: மூலத்தின் இணைப்புச் சொற்றொடர் அமைப்பு காக்கப்பட்டு, கடவுளே மீட்பின் ஊற்று என்பதும் வெளிப்படுத்தப்படுகிறது; ‘என்னை மீட்பவர்’ என்று விரிவாக்கப்படவில்லை.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட இறைப்பெயர் நேரடியாக இருப்பதால், அதை ஒரு பட்டத்தால் மாற்றாமல் ‘Yahweh’ என்பதற்குரிய தமிழ் ஒலிபெயர்ப்பாக வழங்குவது மூல ஆதாரத்திற்கு நெருக்கமானது.
- issue: וְיָרוּם என்பதன் துதிசார் வினைவலு
  choice: 'விருப்பவினை போன்ற துதி முழக்கம்: ‘உயர்த்தப்படுவாராக’'
  alternative: 'அறிவிப்பு: ‘உயர்ந்தவர்/உயர்த்தப்பட்டவர்’; வெளிப்படையான வேண்டுகோள்: ‘உயர்த்தப்படட்டும்’'
  rationale: இணையாக வரும் ‘வாழ்த்தப்படுவாராக’ என்பதுடன் கவித்துவ ஒத்திசைவைப் பேணும் வகையில் விருப்பவினை வாசிப்பு முதன்மைப்படுத்தப்பட்டது. இருப்பினும் எபிரெய வினை வடிவத்தின் அறிவிப்புப் பொருள் சாத்தியம் அடிக்குறிப்பில் மறைக்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு விளங்கும் dignified கவித்துவ நடையுடன் மூன்று இணைத் துதி வரிகளாக அமைக்கப்பட்டது. ‘கன்மலை’ என்ற மூல உருவகமும், ‘என் மீட்பின் கடவுள்’ என்ற இணைப்புச் சொற்றொடரும் நேரடியாகப் பாதுகாக்கப்பட்டுள்ளன.
