  text: He makes my feet like the deer’s[b][a], and sets me on my heights.
translation:
  language: ta
  text: அவர் என் கால்களை மான்களின் கால்களைப்போல்[a] ஆக்கி, என் உயர்ந்த இடங்களின்மேல்[b] என்னை நிற்கச் செய்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல் குறிப்பாகப் பெண்மான்களைக் குறிக்கலாம்; அவற்றின் விரைவான, தடுமாறாத நடையை இந்த உருவகம் நினைவூட்டுகிறது.
