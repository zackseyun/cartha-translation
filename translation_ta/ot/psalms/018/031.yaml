  text: For who is God besides Yahweh? And who is a rock except our God?[a]
translation:
  language: ta
  text: ஏனெனில், யாவேவைத் தவிர கடவுள் யார்? மேலும், நம் கடவுளைத் தவிர கன்மலையாக இருப்பவர் யார்?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: முதல் வினாவில் “யாவேவை அன்றி” என்றும், இரண்டாம் வினாவில் “நம் கடவுளுக்கு அப்பால்” என்றும் மொழிபெயர்க்கலாம்; இரண்டு எபிரெயச் சொற்றொடர்களும் விலக்குத் தன்மையை வலியுறுத்துகின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய துதியின் காரணத்தை அல்லது அடிப்படையை அறிமுகப்படுத்தும் இணைப்புச் சொல்லின் வலிமையை இயல்பான தமிழில் காக்கிறது.
- source_word: מִי
  choice: யார்
  rationale: பதில் எதிர்பார்க்காத வினாவில் வரும் நேரடியான வினாப்பெயர்.
- source_word: אֱלוֹהַּ
  choice: கடவுள்
  rationale: யாவேவுக்கு அப்பால் வேறு கடவுள் இல்லை என்ற தனித்தன்மையைச் சுட்டும் ஒருமைச் சொல்லை இயல்பாக வழங்குகிறது.
- source_word: מִבַּלְעֲדֵי
  choice: தவிர
  rationale: வேறு யாரையும் சேர்க்காத விலக்குப் பொருளைச் சுருக்கமாகவும் தெளிவாகவும் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெயத் தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: וּמִי
  choice: யார்?
  rationale: இரண்டாம் இணையான வினாவைத் தொடர்கிறது; தமிழின் இயல்பான வாக்கிய ஓட்டத்தில் ‘மேலும்’ என்பதைக் கூறாமலேயே இணை அமைப்பு தெளிவாகிறது.
- source_word: צוּר
  choice: கன்மலை
  rationale: உறுதி, பாதுகாப்பு, நிலைத்தன்மை ஆகியவற்றைக் குறிக்கும் மூல உருவகத்தை ‘அடைக்கலம்’ என்று விளக்கி மாற்றாமல் காக்கிறது.
- source_word: זוּלָתִי
  choice: தவிர
  rationale: முதல் அடியின் விலக்குச் சொல்லுக்கு இணையாகத் தனித்தன்மையை வெளிப்படுத்துகிறது.
- source_word: אֱלֹהֵינוּ
  choice: நம் கடவுள்
  rationale: முதல் நபர் பன்மை உடைமைப் பின்னொட்டின் சமூக மற்றும் உடன்படிக்கைச் சார்பைச் சுருக்கமான இயல்பான தமிழில் காக்கிறது.
