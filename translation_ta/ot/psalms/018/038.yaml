  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: אֶ֭מְחָצֵ/ם וְ/לֹא יֻ֣כְלוּ ק֑וּם יִ֝פְּל֗וּ תַּ֣חַת רַגְלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/038.yaml
  text: I crush them[a], and they cannot rise[b]; they fall beneath my feet.
translation:
  language: ta
  text: நான் அவர்களை நொறுக்குவேன்[a]; அவர்களால் எழுந்திருக்க முடியாது[b]; அவர்கள் என் கால்களின்கீழ் விழுவார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவர்களை நசுக்குவேன்’ / ‘அவர்களை அடித்து வீழ்த்துவேன்’; எபிரெய வினை போரில் வன்மையாக நொறுக்குவதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அவர்களால் நிற்க முடியாது.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶמְחָצֵם
  choice: நான் அவர்களை நொறுக்குவேன்
  rationale: מחץ என்ற வினை போர்ச் சூழலில் வலிமையாக நசுக்குதல் அல்லது நொறுக்குதல் என்னும் பொருளைத் தருகிறது. ‘நொறுக்குவேன்’ என்பது அதன் வன்மையையும் கவிதைச் செறிவையும் இயல்பாகத் தக்கவைக்கிறது.
- source_word: וְלֹא יֻכְלוּ
  choice: அவர்களால் ... முடியாது
  rationale: יכל திறன் அல்லது இயல்தலைக் குறிக்கிறது; எதிர்மறையுடன் தமிழில் ‘அவர்களால் ... முடியாது’ என்பது இயல்பான அமைப்பு.
- source_word: קוּם
  choice: எழுந்திருக்க
  rationale: வீழ்த்தப்பட்டவர்கள் மீண்டும் எழ முடியாத படிமத்தை இது தெளிவாகத் தக்கவைக்கிறது; ‘நிற்க’ என்பதும் சாத்தியம்.
- source_word: יִפְּלוּ
  choice: அவர்கள் ... விழுவார்கள்
  rationale: נפל என்பதன் நேரடியான பொருள் ‘விழுதல்’. எபிரெய வினை வடிவங்களின் தொடருக்கு ஏற்ப இங்கு எதிர்கால வடிவம் தமிழில் ஒருமைப்பாட்டையும் இயல்பையும் தருகிறது.
- source_word: תַּחַת רַגְלָי
  choice: என் கால்களின்கீழ்
  rationale: முழுமையான தோல்வியைக் காட்டும் இடவியல் படிமத்தை நேரடியாகவும் கவித்துவமாகவும் தக்கவைக்கிறது.
theological_decisions:
- issue: அரச சங்கீதத்திலுள்ள வன்மையான போர்ப் படிமம்
  choice: முதலாம் நபர் போர்மொழியை மென்மையாக்காமல் தக்கவைத்தல்
  alternative: ‘தோற்கடிப்பேன்’ அல்லது ‘வெல்வேன்’ போன்ற குறைவான வன்மையுள்ள சொற்களைப் பயன்படுத்துதல்
  rationale: எபிரெய மூலம் நொறுக்குதல், எழ முடியாமை, கால்களின்கீழ் விழுதல் ஆகிய வலுவான போர்ப் படிமங்களை வெளிப்படையாகக் கொண்டுள்ளது; அவற்றை பொதுமைப்படுத்துவது மூலத்தின் வலிமையைக் குறைக்கும்.
translation_notes:
  register: நவீன செந்தமிழ் நடை; சாதாரண வாசகர்களுக்குப் புரியும் வகையில் இயல்பாகவும், சங்கீதத்தின் போர்க்கவிதைச் செறிவையும் கண்ணியத்தையும் தக்கவைத்தும் அமைக்கப்பட்டது.
