source:
  edition: WLC
  text: וַ/יִּשְׁלַ֣ח חִ֭צָּי/ו וַ/יְפִיצֵ֑/ם וּ/בְרָקִ֥ים רָ֝ב וַ/יְהֻמֵּֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/014.yaml
  text: He sent out his arrows and scattered them[a]; he multiplied lightning bolts and threw them into confusion.
translation:
  language: ta
  text: அவர் தமது அம்புகளை ஏவி, அவர்களைச் சிதறடித்தார்; ஏராளமான மின்னல்களால் அவர்களைக் கலங்கடித்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர் தமது அம்புகளை ஏவி, அவர்களைச் சிதறடித்தார்; பல மின்னல்களைப் பெருகச் செய்து, அவர்களைக் கலங்கடித்தார்.” எபிரெயத்தில் ‘ஏராளமான மின்னல்களால்’ என மொழிபெயர்க்கப்பட்டுள்ள சொற்றொடர், ‘மிகுதியான மின்னலுடன்’ என்றும், ‘மின்னல்களைப் பெருகச் செய்து’ என்றும் புரிந்துகொள்ளப்படலாம்.
    reason: וּבְרָקִים רָב என்ற எபிரெயச் சொற்றொடரின் இலக்கண மற்றும் பொருள் தெளிவின்மையைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: எய்து
  rationale: שׁלח என்பதன் அடிப்படைப் பொருள் ‘அனுப்புதல்.’ அம்புகளுடன் வருவதால், நவீனத் தமிழில் இயல்பாகவும் போர்வீரர் உருவகத்தைத் தெளிவாகவும் வெளிப்படுத்த ‘எய்து’ என மொழிபெயர்க்கப்பட்டது.
- source_word: חִצָּיו
  choice: தமது அம்புகளை
  rationale: חֵץ என்பது ‘அம்பு’; மூன்றாம் நபர் ஆண்பால் ஒருமை உடைமை விகுதி கடவுளைக் குறிப்பதால் மரியாதை ஒருமையில் ‘தமது’ பயன்படுத்தப்பட்டது.
- source_word: וַיְפִיצֵם
  choice: அவர்களைச் சிதறடித்தார்
  rationale: פוץ என்பது சிதறச் செய்தல் அல்லது விரட்டியடித்தல். பன்மை விகுதியின் குறிப்பு சுற்றியுள்ள சூழலில் உள்ள பகைவர்களாக இயல்பாகப் புரிகிறது.
- source_word: וּבְרָקִים רָב
  choice: ஏராளமான மின்னல்களை அனுப்பி
  rationale: בְּרָקִים என்பது பன்மையில் ‘மின்னல்கள்.’ רָב இங்கு மிகுதி அல்லது ஏராளத்தைக் குறிக்கிறது; தமிழில் முழுமையான, இயல்பான வாக்கியமாக அமைய ‘அனுப்பி’ சூழலிலிருந்து நிறைவு செய்யப்பட்டுள்ளது. எபிரெயச் சொற்றொடரின் இலக்கணப் பொருள் வேறுபாடு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: וַיְהֻמֵּם
  choice: அவர்களைக் கலங்கடித்தார்
  rationale: המם போர்ச் சூழலில் குழப்பம், பீதி, கலக்கம் ஆகியவற்றை உண்டாக்குவதைக் குறிக்கிறது. ‘கலங்கடித்தார்’ என்பது முழுத் தோல்வி என்ற கூடுதல் கருத்தைச் சேர்க்காமல் இந்த விளைவைச் சுருக்கமாகத் தருகிறது.
theological_decisions:
- issue: ‘சிதறடித்தார்,’ ‘கலங்கடித்தார்’ ஆகிய வினைகளிலுள்ள பன்மைச் செயப்படுபொருளின் குறிப்பு
  choice: சுற்றியுள்ள சங்கீதச் சூழலில் புரிந்துகொள்ளப்படும் பகைவர்கள்
  alternative: அம்புகள் அல்லது மின்னல்கள்
  rationale: தெய்வீகப் போர்வீரர் உருவகத்தில் அம்புகளும் மின்னல்களும் கருவிகள்; சிதறடிக்கப்பட்டு கலங்கடிக்கப்படுபவர்கள் பகைவர்கள் என்பதே פוץ மற்றும் המם ஆகிய வினைகளுக்கும் போர்ச் சூழலுக்கும் மிகவும் பொருந்துகிறது.
- issue: וּבְרָקִים רָב என்பதன் இலக்கண அமைப்பு
  choice: மின்னல்களின் மிகுதியைக் கூறும் சொற்றொடராகப் புரிந்து, தமிழில் ‘ஏராளமான மின்னல்களை அனுப்பி’ என வழங்குதல்
  alternative: ‘பல மின்னல்களால்’ என்ற கருவிப்பொருள் அமைப்பு அல்லது ‘மின்னல்களைப் பெருகச் செய்து’ என்ற வினைமுறை வாசிப்பு
  rationale: רָב மிகுதி அல்லது எண்ணிக்கையைச் சுட்டலாம்; கவிதை இணைநிலையையும் இயல்பான தமிழையும் காக்க முதன்மை உரையில் செயற்பாட்டு வடிவம் பயன்படுத்தப்பட்டாலும், உண்மையான இலக்கணத் தெளிவின்மை அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. கடவுளைக் குறிக்கும் வினைகளில் மரியாதை ஒருமை கையாளப்பட்டுள்ளது; போர்வீரர் உருவகமும் எபிரெய மூலத்தின் சுருக்கமான இணைநிலையும் காக்கப்பட்டுள்ளன.
