base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/002.yaml
  text: Yahweh is my crag and my fortress and my deliverer[a], my God, my rock, in whom I take refuge, my shield and the horn of my salvation[c][b], my stronghold.
translation:
  language: ta
  text: யாவே என் பாறைக்குன்றும்[a], என் கோட்டையும், என்னை விடுவிப்பவரும் ஆவார்; என் இறைவனும், நான் அடைக்கலம் புகும்[b] என் கற்பாறையும் அவரே; என் கேடயமும், என் மீட்பின் கொம்பும்[c], என் உயர்ந்த அரணும் அவரே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு ‘பாறைக்குன்று’ என்பதற்கான எபிரெயச் சொல் סֶלַע; பின்னர் ‘கற்பாறை’ என்பதற்கு வேறொரு சொல், צוּר, பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயில் சொற்சார்பாக, ‘அவரில் நான் அடைக்கலம் புகுகிறேன்.’
    reason: lexical_alternative
  - marker: c
    text: ‘கொம்பு’ என்பது வலிமையையும் வெற்றிகரமாக மீட்கும் ஆற்றலையும் குறிக்கும் உருவகம்.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், எபிரெய வடிவின் பரவலான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: סַלְעִי
  choice: என் பாறைக்குன்று
  rationale: செங்குத்தான பாறை அல்லது பாறைக்குன்று என்ற படிமத்தை வெளிப்படுத்துவதோடு, பின்னர் வரும் צוּרִי என்பதிலிருந்தும் வேறுபடுத்துகிறது.
- source_word: מְצוּדָתִי
  choice: என் கோட்டை
  rationale: பாதுகாப்பளிக்கும் அரணமைந்த இடத்தைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொல்.
- source_word: מְפַלְטִי
  choice: என்னை விடுவிப்பவர்
  rationale: தப்புவித்து மீட்பவர் என்ற காரணவினை சார்ந்த பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: אֵלִי
  choice: என் இறைவன்
  rationale: இங்கு אֵל வழக்கமான இறைக் குறிப்பாக முதல் நபர் உடைமை விகுதியுடன் வருகிறது.
- source_word: צוּרִי
  choice: என் கற்பாறை
  rationale: நிலைத்தன்மையையும் பாதுகாப்பையும் குறிக்கும் பாறைப் படிமத்தைப் பேணுகிறது; סֶלַע என்பதற்குப் பயன்படுத்திய சொல்லிலிருந்து வேறுபடுகிறது.
- source_word: אֶחֱסֶה בּוֹ
  choice: நான் அடைக்கலம் புகும்
  rationale: חסה என்பதன் அடைக்கலம் தேடுதல் என்ற பாதுகாப்புப் படிமத்தை இயல்பான தமிழில் பேணுகிறது.
- source_word: מָגִנִּי
  choice: என் கேடயம்
  rationale: போர்சார்ந்த பாதுகாப்புப் படிமத்திற்கான நேரடியான இணைச்சொல்.
- source_word: קֶרֶן יִשְׁעִי
  choice: என் மீட்பின் கொம்பு
  rationale: வலிமையையும் வெற்றிகரமான விடுதலையையும் குறிக்கும் மூல உருவகத்தை விளக்கவுரையாக மாற்றாமல் பேணுகிறது.
- source_word: מִשְׂגַּבִּי
  choice: என் உயர்ந்த அரண்
  rationale: எட்டுவதற்கு அரிய உயரமான பாதுகாப்பிடத்தைக் குறிக்கிறது; முன் வரும் ‘கோட்டை’ என்பதிலிருந்தும் ஓரளவு வேறுபாட்டைப் பேணுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூல உரை இறைவனின் தனிப்பட்ட திருப்பெயரை நேரடியாகப் பயன்படுத்துவதால், அதை பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: பலவகையான பாறை மற்றும் பாதுகாப்பு உருவகங்களைப் பேணுதல்
  choice: பாறைக்குன்று, கோட்டை, கற்பாறை, உயர்ந்த அரண் என வேறுபடுத்துதல்
  alternative: அனைத்தையும் ‘பாறை’ அல்லது ‘அரண்’ என்று ஒரே சொல்லால் வழங்குதல்
  rationale: எபிரெயக் கவிதை ஒன்றோடொன்று தொடர்புடைய, ஆனால் வேறுபட்ட பாதுகாப்புப் படிமங்களை அடுக்குகிறது; அந்தக் கவித்துவ வேறுபாட்டை உரை பேணுகிறது.
- issue: ‘மீட்பின் கொம்பு’ என்ற உருவகம்
  choice: கொம்பு என்ற உருவகத்தைப் பேணுதல்
  alternative: என்னை வலிமையுடன் மீட்பவர்
  rationale: உருவகத்தை நீக்காமல் மூலத்தின் கவித்துவத்தையும், வலிமை மற்றும் வெற்றிகரமான மீட்பு ஆகிய கருத்துகளையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மூலத்தின் தொடர்ச்சியான முதல் நபர் உடைமை அமைப்பும் பாதுகாப்பு உருவகங்களின் அடுக்கும் இயன்றவரை பேணப்பட்டுள்ளன.
