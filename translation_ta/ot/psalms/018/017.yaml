base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/017.yaml
  text: He delivered me from my strong enemy[a], and from those who hated me[b], for they were too mighty for me.
translation:
  language: ta
  text: என் வலிமையான பகைவனிடமிருந்து[a], என்னைப் பகைத்தவர்களிடமிருந்தும் அவர் என்னை விடுவித்தார்[b]; ஏனெனில் அவர்கள் என்னைவிட வலிமையானவர்களாயிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் “என் பகைவன்” என்பது ஒருமையில் உள்ளது; அடுத்த சொற்றொடரான “என்னைப் பகைத்தவர்கள்” பன்மையில் உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: கவிதைக்குரிய நிறைவுறா வினைவடிவத்தை நிகழ்காலத்தன்மையுடன் எடுத்தால், “அவர் என்னை விடுவிக்கிறார்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַצִּילֵנִי
  choice: அவர் என்னை விடுவித்தார்
  rationale: நצל என்பதன் ஹிஃபில் வடிவம் ‘விடுவி, மீட்டு காப்பாற்று’ என்று பொருள்படும். வடிவம் இறந்தகாலத்தையும் நிகழ்காலத்தையும் கவிதையில் சுட்டக்கூடியதாயினும், இப்பகுதியின் கடந்தகால மீட்புச் செயல்களின் ஓட்டத்துக்கு ‘விடுவித்தார்’ இயல்பாகப் பொருந்துகிறது.
- source_word: מֵאֹיְבִי עָז
  choice: வலிமைமிக்க என் பகைவனிடமிருந்து
  rationale: אֹיֵב ஒருமையில் முதலாம் நபர் உரிமை விகுதியுடன் உள்ளது; עָז என்பதன் நேரடியான பொருள் ‘வலிமைமிக்க’. ஒருமையைத் தமிழிலும் காக்கிறது.
- source_word: וּמִשֹּׂנְאַי
  choice: என்னைப் பகைத்தவர்களிடமிருந்து
  rationale: שׂנא வினையின் பன்மைப் பெயரெச்ச வடிவம் ‘என்னைப் பகைப்பவர்கள்’ எனும் தொடர்ந்த பகைமை அடையாளத்தைக் குறிக்கிறது; இயல்பான தமிழுக்காக உறவுத்தொடராக மொழிபெயர்க்கப்பட்டது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: விடுவிப்பு தேவைப்பட்டதற்கான காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: אָמְצוּ מִמֶּנִּי
  choice: அவர்கள் என்னைவிட வலிமைமிக்கவர்களாயிருந்தார்கள்
  rationale: אמץ ‘வலிமையாயிரு’ என்றும் מן ஒப்பீட்டைச் சுட்டியும் வருகின்றன; ஆகவே பகைவர்கள் சங்கீதக்காரனைவிட வலிமையானவர்கள் என்ற ஒப்பீடு வெளிப்படையாகக் காக்கப்படுகிறது.
theological_decisions:
- issue: எபிரெயக் கவிதையில் தொடக்க வினையின் கால/நோக்கு
  choice: 'கடந்தகால நிகழ்வு: ‘அவர் என்னை விடுவித்தார்’'
  alternative: 'நிகழ்காலத்தன்மை: ‘அவர் என்னை விடுவிக்கிறார்’'
  rationale: சுற்றியுள்ள பகுதி ஆண்டவரின் கடந்தகால மீட்புச் செயல்களை விவரிப்பதால் கடந்தகாலம் உரையின் ஓட்டத்துக்கு ஏற்றது; ஆயினும் எபிரெய நிறைவுறா வினைவடிவத்தின் நிகழ்காலக் கவிதைப் பயன்பாட்டை அடிக்குறிப்பு பதிவு செய்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயத்தின் ஒருமை–பன்மை வேறுபாடும் வலிமையின் ஒப்பீடும் தெளிவாகக் காக்கப்பட்டுள்ளன.
