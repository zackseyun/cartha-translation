lexical_decisions:
- source_word: וַתִּתֶּן
  choice: தந்தீர்
  rationale: נתן என்பதன் Qal wayyiqtol வடிவம்; கவிதைமிகு நன்றியறிவிப்பில் இறந்தகாலச் செயலை இயல்பாகக் காட்டுகிறது.
- source_word: מָגֵן
  choice: கேடயம்
  rationale: தற்காப்புக் கருவியான shield என்பதற்கான தெளிவான, பொதுவாகப் புரியும் நவீனத் தமிழ் சொல்.
- source_word: יִשְׁעֶךָ
  choice: உமது மீட்பின்
  rationale: מָגֵן יִשְׁעֶךָ என்ற இணைப்பை நெருக்கமாகப் பாதுகாக்கிறது; உடனடி விடுதலையையும் விரிந்த இரட்சிப்பு உணர்வையும் ‘மீட்பு’ தாங்குகிறது.
- source_word: וִימִינְךָ
  choice: உமது வலக்கரம்
  rationale: வலிமையையும் செயல்மிகு உதவியையும் குறிக்கும் மூலமொழிப் படிமத்தை அப்படியே காக்கிறது.
- source_word: תִסְעָדֵנִי
  choice: என்னைத் தாங்கியது
  rationale: סעד என்பதன் ஆதரித்தல், நிலைநிறுத்துதல் என்ற பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְעַנְוַתְךָ
  choice: உமது தாழ்மை
  rationale: தாழ்மை, சாந்தம், மென்மை ஆகிய பொருள் வாய்ப்புகளில், கடவுள் தாழ்ந்து உதவுகிறார் என்ற மூலத்தின் வியப்பூட்டும் இறையியல் அழுத்தத்தை ‘தாழ்மை’ பாதுகாக்கிறது.
- source_word: תַרְבֵּנִי
  choice: என்னைப் பெரியவனாக்கியது
  rationale: רבה என்பதன் Hiphil வடிவிலுள்ள ‘பெரியவனாக்குதல்/பெருகச் செய்தல்’ என்ற நேரடியான பொருளைச் சுருக்கமாக வழங்குகிறது.
theological_decisions:
- issue: கடவுளைக் குறிக்கும் וְעַנְוַתְךָ என்பதன் மொழிபெயர்ப்பு
  choice: உமது தாழ்மை
  alternative: உமது மென்மை
  rationale: எபிரெயச் சொல் தாழ்மை, சாந்தம் அல்லது மென்மை என்பவற்றைக் குறிக்கலாம். கடவுளுக்கு ‘தாழ்மை’ எனக் கூறும் மூலத்தின் இறையியல் பதற்றத்தை மென்மைப்படுத்தாமல் முதன்மை உரையில் காத்து, சாத்தியமான மாற்றுப் பொருளை அடிக்குறிப்பில் தருகிறது.
