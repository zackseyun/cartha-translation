  text: They confronted me in the day of my calamity[a], but Yahweh was my support.
translation:
  language: ta
  text: என் பேரழிவு நாளில் அவர்கள் என்னை எதிர்கொண்டார்கள்[a]; ஆனால் யாவே எனக்கு ஆதரவாக இருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் பேரழிவு நாளில் அவர்கள் என்மேல் வந்தார்கள்” அல்லது “என்னைச் சந்தித்தார்கள்.”
    reason: יְקַדְּמוּנִי என்பது எதிரே வருதல், சந்தித்தல் அல்லது பகைமையாக எதிர்கொள்ளுதல் ஆகிய பொருள்களை ஏற்கக்கூடியதால் மாற்று மொழிபெயர்ப்புகள் தரப்பட்டுள்ளன.
lexical_decisions:
- source_word: יְקַדְּמוּנִי
  choice: அவர்கள் என்னை எதிர்கொண்டார்கள்
  rationale: קדמ என்பதன் பியேல் வடிவம் இங்கு ‘எதிரே வந்து சந்தித்தார்கள்’ என்ற அடிப்படைப் பொருளைக் கொண்டது. பகைமைச் சூழலில் ‘எதிர்கொண்டார்கள்’ என்பது தாக்குதலை அளவுக்கு மீறிக் குறிப்பாக்காமல் எதிரான சந்திப்பை வெளிப்படுத்துகிறது.
- source_word: בְיוֹם אֵידִי
  choice: என் பேரழிவு நாளில்
  rationale: אֵיד என்பது அழிவு, கேடு, பேரிடர் போன்ற கடுமையான துன்பநிலையைக் குறிக்கிறது. ‘பேரழிவு’ அதன் தீவிரத்தையும் கவிதை நடையையும் காக்கிறது; בְיוֹם என்ற காலக் குறிப்பைத் தமிழில் இயல்பாக ‘நாளில்’ என வழங்குகிறது.
- source_word: וַיְהִי
  choice: ஆனால் ... இருந்தார்
  rationale: இலக்கணரீதியாக ‘அவர் இருந்தார்/ஆனார்’ என்று தொடரும் இவ்வடிவம், முதல் அடியிலுள்ள பகைமைக்கும் இரண்டாம் அடியிலுள்ள தெய்வீக ஆதரவுக்கும் இடையேயான முரணால் தமிழில் ‘ஆனால்’ என இயல்பாக இணைக்கப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எழுத்துகளாலான இறைப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பான ‘யாவே’ என்று வழங்குகிறது.
- source_word: לְמִשְׁעָן לִי
  choice: எனக்கு ஆதரவாக
  rationale: מִשְׁעָן என்பது ஒருவர் சாய்ந்து தாங்கிக்கொள்ளும் ஆதாரம் அல்லது துணையைக் குறிக்கிறது. ‘எனக்கு ஆதரவாக இருந்தார்’ என்பது உருவகத்தின் தாங்கும் உதவி என்ற கருத்தை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட இறைப்பெயரே உள்ளது. அதனை ‘கர்த்தர்’ என்ற பட்டத்தால் மாற்றாமல் ஒலிபெயர்ப்பது மூல வேறுபாட்டைக் காக்கிறது; ‘யாவே’ என்பது ஏற்ற நவீனத் தமிழ் வடிவம்.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளை சங்கீதத்திற்கேற்ற கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. முதல் அடியின் பகைமை மற்றும் இரண்டாம் அடியின் ஆதரவு ஆகியவற்றுக்கிடையேயான முரண் காக்கப்பட்டுள்ளது.
