  edition: WLC
  text: אֲפָפ֥וּ/נִי חֶבְלֵי מָ֑וֶת וְֽ/נַחֲלֵ֖י בְלִיַּ֣עַל יְבַֽעֲתֽוּ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/004.yaml
  text: The cords of death surrounded me[a], and the torrents of destruction terrified me.
translation:
  language: ta
  text: 'மரணத்தின் கயிறுகள் என்னைச் சூழ்ந்துகொண்டன;

    அழிவின்[a] வெள்ளப்பெருக்குகள் என்னைத் திகிலடையச் செய்தன.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல்லை “பயனின்மையின்” அல்லது “தீமையின்” என்றும் மொழிபெயர்க்கலாம்; அதைத் தனிப்பெயராகக் கொண்டால் “பெலியாலின்” என்றும் மொழிபெயர்க்கலாம். இங்கு “அழிவு” என்பதே சூழலுக்கு மிகவும் பொருத்தமானது.
    reason: alternative_reading
lexical_decisions:
- source_word: אֲפָפוּנִי
  choice: என்னைச் சூழ்ந்துகொண்டன
  rationale: אפף என்பது சுற்றிவளைத்தல் அல்லது சூழ்தல் என்று பொருள்படும். “சூழ்ந்துகொண்டன” என்பது அச்சுறுத்தும் கவித்துவப் படிமத்தை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: חֶבְלֵי
  choice: கயிறுகள்
  rationale: חבל என்பதன் அடிப்படைப் பொருள் கயிறு அல்லது வடம். மரணம் ஒருவரைக் கட்டிப்பிடிப்பதுபோன்ற மூலமொழியின் தெளிவான படிமத்தை இது காக்கிறது; “கண்ணிகள்” அல்லது “வேதனைகள்” என்பனவும் சில சூழல்களில் சாத்தியம்.
- source_word: מָוֶת
  choice: மரணம்
  rationale: மூலச்சொல்லின் நேரான, வழக்கமான பொருள்.
- source_word: נַחֲלֵי
  choice: வெள்ளப்பெருக்குகள்
  rationale: נחל என்பது ஓடை, வறண்ட ஆற்றுப்படுகை, அல்லது திடீரெனப் பாயும் வெள்ளம் எனப் பொருள்படலாம். இங்கு அச்சுறுத்தும் பேராற்றலை வெளிப்படுத்த “வெள்ளப்பெருக்குகள்” பொருத்தமானது.
- source_word: בְלִיַּעַל
  choice: அழிவு
  rationale: இந்தக் கவிதைச் சூழலில் בְלִיַּעַל என்பது தனிப்பட்ட பெயரைவிட நாசம், கேடு அல்லது பயனின்மை சார்ந்த பொதுப்பெயராக இருப்பதே அதிக வாய்ப்புள்ளது. “அழிவு” என்பது இங்கு வெள்ளப்பெருக்குகளின் நாசகரமான தன்மையை இயல்பாக வெளிப்படுத்துகிறது; சொலின் பிற சாத்தியங்கள் அடிக்குறிப்பில் காக்கப்படுகின்றன.
- source_word: יְבַעֲתוּנִי
  choice: என்னைத் திகிலடையச் செய்தன
  rationale: בעת என்பது திடீரான கடும் அச்சத்தையோ திகிலையோ உண்டாக்குவதைக் குறிக்கிறது. “திகிலடையச் செய்தன” அதன் வலிமையைத் தெளிவாகக் காக்கிறது.
theological_decisions:
- issue: בְלִיַּעַל என்பதை ‘பெலியால்’ என்ற தனிப்பெயராகக் கொள்வதா, அல்லது அழிவு/கேடு/பயனின்மையைக் குறிக்கும் பொதுப்பெயராகக் கொள்வதா
  choice: அழிவைக் குறிக்கும் பொதுப்பெயர்
  alternative: ‘பெலியால்’ என்ற தனிப்பெயர்; அல்லது ‘பயனின்மை/தீமை’
  rationale: சங்கீதத்தின் இச்சூழல் பிற்காலத்தில் உருவான தனிப்பட்ட தீய ஆளுமை பற்றிய கருத்தைத் தெளிவாகக் கோரவில்லை. ஆகவே நாசகரமான சக்தியைக் குறிக்கும் பொதுப்பெயராக மொழிபெயர்க்கப்படுகிறது; மூலத்தின் உண்மையான பொருள் வாய்ப்புகள் அடிக்குறிப்பில் தெரிவிக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதத்திற்கேற்ற கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. இணையான இரு அச்சுறுத்தும் படிமங்களான கயிறுகளும் வெள்ளப்பெருக்குகளும் காக்கப்பட்டுள்ளன; தேவையற்ற பிற்கால இறையியல் தனிப்படுத்தல் தவிர்க்கப்பட்டுள்ளது.
