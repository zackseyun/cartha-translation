  yaml_path: translation/ot/psalms/018/043.yaml
  text: You rescue me from the strivings of the people[a]; you set me as the head of nations[d][c][b]; a people whom I have not known serve me.
translation:
  language: ta
  text: மக்களின் சச்சரவுகளிலிருந்து என்னை விடுவிக்கிறீர்[a]; நாடுகளுக்குத் தலைவனாக என்னை வைக்கிறீர்[b]; நான் அறிந்திராத மக்கள் எனக்குப் பணி செய்கிறார்கள்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மக்களின் பூசல்களிலிருந்து’ அல்லது ‘மக்களின் தகராறுகளிலிருந்து’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் சச்சரவு, பூசல், தகராறு அல்லது வழக்கு ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது ‘நாடுகளின் தலைவராக’. எபிரெயில் ‘தலை’ என்பது தலைமைக்கான உருவகம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது ‘எனக்குப் பணி செய்வார்கள்’. எபிரெய முற்றாத வினை இச்சூழலில் எதிர்காலப் பொருளையும் தரக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּפַלְּטֵנִי
  choice: என்னை விடுவிக்கிறீர்
  rationale: פלט என்பதன் பியேல் வடிவம் செயற்படையான மீட்பு அல்லது விடுதலையைக் குறிக்கிறது. ‘விடுவிக்கிறீர்’ என்பது இயல்பான நவீனத் தமிழில் கடவுளின் தனிப்பட்ட காப்புச் செயலை வெளிப்படுத்துகிறது.
- source_word: מֵרִיבֵי עָם
  choice: மக்களின் பூசல்களிலிருந்து
  rationale: רִיב என்பது சச்சரவு, பூசல், தகராறு அல்லது வழக்கு ஆகிய பொருள்களைக் கொள்ளலாம். சங்கீதத்தின் மோதல் சூழலில் ‘பூசல்கள்’ பரந்த பொருளைத் தக்கவைக்கிறது; עָם என்பதன் கூட்டு ஒருமைப் பொருள் தமிழில் இயல்பாக ‘மக்கள்’ என வழங்கப்படுகிறது.
- source_word: תְּשִׂימֵנִי
  choice: என்னை வைக்கிறீர்
  rationale: שׂים என்பதன் அடிப்படைப் பொருள் ‘வை/நிறுத்து’. சூழல் நியமனத்தை உணர்த்தினாலும், ‘வைக்கிறீர்’ மூலத்தின் விரிவைத் தக்கவைக்கிறது.
- source_word: לְרֹאשׁ גּוֹיִם
  choice: நாடுகளுக்குத் தலைவனாக
  rationale: רֹאשׁ என்பதன் ‘தலை’ உருவகம் தலைமைப் பொருளைத் தருகிறது. தமிழில் ஒருவரைக் குறிக்க ‘தலைவனாக’ என்பது இயல்பாகவும் உருவகத்தின் தலைமைச் சாயலைக் காக்குமாறும் உள்ளது. גּוֹיִם அரசியல்-கூட்டுப் பொருளில் ‘நாடுகள்’ என மொழிபெயர்க்கப்படுகிறது.
- source_word: לֹא יָדַעְתִּי
  choice: நான் அறிந்திராத
  rationale: எபிரெய நிறைவு வடிவம் முன்பிருந்த அறிமுகமின்மையைத் தெரிவிக்கிறது. ‘அறிந்திராத’ என்பது தமிழில் பெயரை இயல்பாகத் தழுவி அந்த நிலையைத் தக்கவைக்கிறது.
- source_word: יַעַבְדוּנִי
  choice: எனக்குப் பணிசெய்கிறார்கள்
  rationale: עבד என்பது ‘பணிசெய்/சேவைசெய்’ என்று பொருள்படும். அரசச் சூழலில் கீழ்ப்படிதலின் நிழற்பொருள் இருந்தாலும், அதை முதன்மை உரையில் விளக்கமாகச் சேர்க்காமல் அடிப்படை வினைச்சொல் காக்கப்படுகிறது.
theological_decisions:
- issue: גּוֹיִם மற்றும் עַם என்பவற்றின் பரப்பு
  choice: அரசியல் மற்றும் கூட்டுச் சமூகப் பொருளில் ‘நாடுகள்’, ‘மக்கள்’ என்று வழங்குதல்
  alternative: גּוֹיִם என்பதை பிற்கால யூதர்/புறவினத்தார் வேறுபாட்டை முன்னிறுத்தும் சொல்லால் மொழிபெயர்த்தல்
  rationale: இது அரச சங்கீதச் சூழலில் அந்நிய அரசியல் மக்கள்குழுக்கள்மேல் சங்கீதக்காரன் பெறும் தலைமையைப் பேசுகிறது. மூலத்தில் வெளிப்படையாக இல்லாத பிற்கால இன-இறையியல் பிரிவை மொழிபெயர்ப்பில் புகுத்தாமல் இருப்பது பொருத்தமானது.
- issue: יַעַבְדוּנִי வினையின் காலநிலை
  choice: கவிதைச் சூழலில் நிகழ்/வழக்குச் செயலாக ‘பணிசெய்கிறார்கள்’
  alternative: எதிர்காலச் செயலாக ‘பணிசெய்வார்கள்’
  rationale: எபிரெய முற்றாத வினை தொடர்ந்து நிகழும், வழக்கமான அல்லது எதிர்காலச் செயலைக் குறிக்க முடியும். முதன்மை உரையில் இயல்பான நிகழ்காலம் தேர்ந்தெடுக்கப்பட்டு, எதிர்கால வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கவிதைக்கேற்ற சுருக்கமும் கண்ணியமும் பேணப்பட்டுள்ளன. கடவுளை நோக்கிய மரியாதை ஒருமைக்காக ‘நீர்’ சார்ந்த வினைமுற்றுகள் பயன்படுத்தப்பட்டுள்ளன. எபிரெயச் சொற்களின் அரசியல் மற்றும் காலநிலைத் தெளிவின்மை அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளது.
