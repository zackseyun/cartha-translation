  text: You equipped me with strength for battle[b][a]; you subdued those who rose against me beneath me.
translation:
  language: ta
  text: போருக்காக நீர் வலிமையால் என்னை ஆயத்தப்படுத்தினீர்[a]; எனக்கு எதிராக எழுந்தவர்களை என் கீழ் குனியச் செய்தீர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்கு நெருக்கமாக: “போருக்காக நீர் என்னை வலிமையால் இடைக்கச்சை கட்டினீர்.”'
    reason: மூல எபிரெயச் சொல்லிலுள்ள இடைக்கச்சை கட்டி ஆயத்தப்படுத்தும் உருவகத்தைப் பாதுகாக்கும் மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: וַתְּאַזְּרֵנִי
  choice: எனக்கு வலிமையை அளித்து ஆயத்தப்படுத்தினீர்
  rationale: אזר என்பதன் அடிப்படைப் படிமம் இடைக்கச்சைக் கட்டுவதாகும்; இங்கு போருக்கு வலிமையூட்டி ஆயத்தப்படுத்துதல் என்ற பொருளில் வருகிறது. இயல்பான நவீனத் தமிழில் பொருளைத் தெளிவாகத் தரும் வகையில் இவ்வாறு மொழிபெயர்க்கப்பட்டது; மூலப் படிமம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: חַיִל
  choice: வலிமை
  rationale: இச்சூழலில் இது படையைக் குறிக்காமல், போரிடுவதற்கான ஆற்றல் அல்லது வல்லமையைக் குறிக்கிறது.
- source_word: לַמִּלְחָמָה
  choice: போருக்காக
  rationale: מִלְחָמָה இங்கு உடனடியான போர்ச் சூழலைக் குறிக்கிறது; ‘போருக்காக’ என்பது சுருக்கமான, இயல்பான தமிழ்.
- source_word: תַּכְרִיעַ
  choice: மண்டியிடச் செய்தீர்
  rationale: כרע என்பதன் ஹிஃபீல் வடிவம் ஒருவரை வளைந்து குனியவோ விழவோ செய்வதைக் குறிக்கிறது. ‘மண்டியிடச் செய்தீர்’ தோல்வி மற்றும் கீழ்ப்படுத்துதல் ஆகிய இரு படிமங்களையும் தெளிவாகக் காட்டுகிறது.
- source_word: קָמַי
  choice: எனக்கு எதிராக எழுந்தவர்கள்
  rationale: קום என்ற வினையின் பங்கேற்பு வடிவத்திலுள்ள ‘எதிராக எழுதல்’ என்ற உயிருள்ள வாய்மொழிப் படிமம் பாதுகாக்கப்படுகிறது.
- source_word: תַּחְתָּי
  choice: எனக்குக் கீழே
  rationale: மூலத்தின் இடவியல் படிமத்தை நேரடியாக வைத்திருந்து, எதிரிகள் கீழ்ப்படுத்தப்பட்ட நிலையைச் சுட்டுகிறது.
