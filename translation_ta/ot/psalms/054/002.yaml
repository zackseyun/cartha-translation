source:
  edition: WLC
  text: אֱ֭לֹהִים בְּ/שִׁמְ/ךָ֣ הוֹשִׁיעֵ֑/נִי וּ/בִ/גְבוּרָתְ/ךָ֥ תְדִינֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/054/002.yaml
  text: God[a], save me by your name, and vindicate me by your might.
translation:
  language: ta
  text: கடவுளே, உமது பெயரால் என்னைக் காப்பாற்றும்; உமது வல்லமையால் எனக்கு நீதி வழங்கும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என்னை நியாயந்தீரும்” அல்லது “என் வழக்கை ஆதரியும்.” எபிரெய வினைச்சொல் நீதிமன்றத்தில் தீர்ப்பிடுவதைக் குறிக்கலாம்; இங்கு அது நீதி கிடைக்கச் செய்வது அல்லது குற்றமற்றவர் என நிலைநாட்டுவது என்ற பொருளைக் கொண்டிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: கடவுளே
  rationale: எபிரெய வடிவத்தில் தனி விளிவேற்றுமை இல்லாவிட்டாலும், வேண்டுதலின் சூழல் நேரடி அழைப்பைத் தெளிவாக்குகிறது; தமிழில் ‘கடவுளே’ இயல்பான நேரடி அழைப்பு.
- source_word: בְּשִׁמְךָ
  choice: உமது பெயரால்
  rationale: ב முன்னிடைச்சொல்லின் கருவிப்பொருளைத் தக்கவைக்கிறது. ‘பெயர்’ என்பது கடவுளின் வெளிப்படுத்தப்பட்ட தன்மை, புகழ், அடையாளம் ஆகியவற்றையும் உள்ளடக்கும் செறிவான மூலப்படிமத்தைப் பாதுகாக்கிறது.
- source_word: הוֹשִׁיעֵנִי
  choice: என்னைக் காப்பாற்றும்
  rationale: ישׁע என்பதன் ஹிப்இல் வடிவம் மீட்பு அல்லது பாதுகாப்புக்கான வேண்டுதலைக் குறிக்கிறது. நவீனத் தமிழில் ‘காப்பாற்றும்’ என்பது நேரடியும் பரந்த பொருளுடையதுமாக உள்ளது.
- source_word: וּבִגְבוּרָתְךָ
  choice: உமது வல்லமையால்
  rationale: גְּבוּרָה குறிக்கும் பலம் மற்றும் ஆற்றலை ‘வல்லமை’ கண்ணியமான கவிதைநடையில் வெளிப்படுத்துகிறது; முன்னிடைச்சொல்லின் கருவிப்பொருளும் ‘-ஆல்’ மூலம் தக்கவைக்கப்படுகிறது.
- source_word: תְדִינֵנִי
  choice: எனக்கு நீதி வழங்கும்
  rationale: דִּין நீதிமன்றத் தீர்ப்பிடுதலைக் குறிக்கலாம்; பகைவர்களுக்கு எதிரான இந்த வேண்டுதலில், வேண்டுபவருக்குச் சாதகமான நீதியை நிலைநாட்டும் பொருள் முன்னிலையில் உள்ளது. ‘எனக்கு நீதி வழங்கும்’ என்பது அதைப் பொதுவாசகருக்குத் தெளிவாகச் சொல்கிறது; மூலத்தின் மாற்றுப் பொருள்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
theological_decisions:
- issue: தெய்வீக நீதியுடன் தொடர்புடைய தְדִינֵנִי என்ற வேண்டுதலின் பொருள்
  choice: எனக்கு நீதி வழங்கும்
  alternative: என்னை நியாயந்தீரும்; என் வழக்கை நடத்தும்
  rationale: இது வெறும் நடுநிலையான விசாரணைக்கான வேண்டுதல் அல்ல; எதிரிகளுக்கு முன் கடவுள் நீதியான தீர்ப்பைச் செயல்படுத்த வேண்டும் என்ற மன்றாட்டு. சாதகமான தீர்ப்பை வெளிப்படுத்தியபோதும், பிற்காலக் கோட்பாட்டு கருத்துகளைச் சேர்க்காமல் நீதிமன்றப் பின்னணியைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீத வேண்டுதலுக்கேற்ற கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. நேரடி அழைப்பில் ‘கடவுளே’ என்றும், கடவுளை நோக்கிய உரையில் மரியாதைமிக்க ‘உமது’ என்றும் அமைக்கப்பட்டுள்ளது. ‘பெயரால் / வல்லமையால்’ என்ற இணை அமைப்பு எபிரெயச் சமநிலையைத் தக்கவைக்கிறது.
