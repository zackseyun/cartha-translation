  text: כִּ֣י מִ/כָּל צָ֭רָה הִצִּילָ֑/נִי וּ֝/בְ/אֹיְבַ֗/י רָאֲתָ֥ה עֵינִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/054/008.yaml
  text: For he has delivered me from every trouble[a], and my eye has looked on my enemies.
translation:
  language: ta
  text: ஏனெனில், எல்லாத் துன்பத்திலிருந்தும் அவர் என்னை விடுவித்தார்; என் கண் என் பகைவர்களைக் கண்டது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் கண் என் பகைவர்களைப் பார்த்தது.” இது அவர்களின் வீழ்ச்சியையோ, சங்கீதக்காரனுக்கு நியாயம் நிலைநாட்டப்பட்டதையோ உட்குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய புகழ்ச்சி அல்லது நேர்த்திக்கடன் அறிக்கைக்கான காரணத்தை அறிமுகப்படுத்தும் விளக்கத் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מִכָּל צָרָה
  choice: எல்லாத் துன்பத்திலிருந்தும்
  rationale: מִן உடன் כָּל தரும் முழுமை/ஒவ்வொன்றிலிருந்தும் என்ற பொருளையும், צָרָה என்பதன் துன்பம் அல்லது நெருக்கடி என்ற பரந்த பொருளையும் காக்கிறது.
- source_word: הִצִּילָנִי
  choice: அவர் என்னை விடுவித்தார்
  rationale: נצל என்பதன் ஹிபீல் வடிவம் மீட்பது அல்லது ஆபத்திலிருந்து விடுவிப்பது என்று பொருள்படும்; இறைவன் முன் சூழலில் தெளிவாக இருப்பதால் தமிழ் வாக்கியத்தில் மரியாதைப் பன்மை பயன்படுத்தப்படுகிறது.
- source_word: וּבְאֹיְבַי
  choice: என் பகைவர்களை
  rationale: ראה உடன் வரும் ב குறிக்கும் நோக்குப்பொருளை இயல்பான தமிழ் வேற்றுமையில் தருகிறது; பகைவர்களின் தோல்வியை உரையில் வெளிப்படையாகச் சேர்க்கவில்லை.
- source_word: רָאֲתָה עֵינִי
  choice: என் கண் ... கண்டது
  rationale: ‘என் கண்’ என்பதையே எழுவாயாகக் கொண்ட எபிரெய உருவகத்தைத் தக்கவைத்து, ראה என்பதன் நேரான ‘கண்டது’ என்ற பொருளை வழங்குகிறது.
theological_decisions:
- issue: சங்கீதக்காரன் தன் பகைவர்களைக் கண்டதன் உட்குறிப்பு
  choice: பகைவர்களைக் கண்டதாக மட்டும் மொழிபெயர்த்து, அவர்களின் தோல்வி அல்லது சங்கீதக்காரனின் வெற்றியை வெளிப்படையாகச் சேர்க்கவில்லை.
  alternative: என் பகைவர்களின் வீழ்ச்சியை என் கண் கண்டது / என் கண் வெற்றியுடன் என் பகைவர்களை நோக்கியது
  rationale: எபிரெய உரை பகைவர்களைப் பார்த்ததாக மட்டுமே நேரடியாகக் கூறுகிறது. சூழல் அவர்களின் வீழ்ச்சியையோ சங்கீதக்காரனின் நியாயநிறுவலையோ உணர்த்தக்கூடும்; ஆனால் அதைத் தெளிவுபடுத்துவது மூலத்தின் உண்மையான மறைபொருள் இடைவெளியை நீக்கும்.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘என் கண்’ என்ற எபிரெய உருவகம் பாதுகாக்கப்பட்டுள்ளது; ‘பார்த்தது/கண்டது’ என்ற வேறுபாடு அடிக்குறிப்பில் தரப்படுகிறது.
