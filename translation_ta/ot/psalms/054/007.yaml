  text: בִּ/נְדָבָ֥ה אֶזְבְּחָה לָּ֑/ךְ א֤וֹדֶה שִּׁמְ/ךָ֖ יְהוָ֣ה כִּי טֽוֹב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/054/007.yaml
  text: I will sacrifice a freewill offering to you[a]; I will give thanks to your name, O Yahweh[c][b], for it is good.
translation:
  language: ta
  text: தன்னார்வக் காணிக்கையை உமக்குப் பலியாகச் செலுத்துவேன்[a]; யாவே, உமது பெயருக்கு நன்றி செலுத்துவேன்[b], ஏனெனில் அது நல்லது[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “தன்னார்வக் காணிக்கையோடு”; இதை “மனமுவந்து” அல்லது “தன்னார்வமாகப் பலியிடுவேன்” என்றும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் YHWH என்ற இறைப்பெயர்; மரபாக “கர்த்தர்” என்றும், “யெகோவா” என்றும் வழங்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: c
    text: எபிரெயத்தில் எழுவாய் வெளிப்படையாக இல்லை. “உமது பெயர் நல்லது” என்பதே இங்கு முதன்மை உரையின் பொருள்; “அவர் நல்லவர்” என்று யாவேயை நேரடியாகக் குறிப்பதாகவும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: בִּנְדָבָה
  choice: தன்னார்வக் காணிக்கையாக
  rationale: נְדָבָה என்பது விருப்பத்துடன் செலுத்தப்படும் தன்னார்வக் காணிக்கையைக் குறிக்கிறது. זבח என்ற பலியிடுதல் வினையுடன் வரும் இச்சூழலில் காணிக்கைக்குரிய பலிச்சார்ந்த பொருளைப் பாதுகாக்கிறது; அதேவேளை வினையடைப் பொருளும் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אֶזְבְּחָה
  choice: பலியிடுவேன்
  rationale: זבח என்பதன் பொருள் பலியிடுதல்; முதலாம் நபர் ஒருமை விருப்ப/உறுதி வடிவின் இயல்பைத் தமிழில் சுருக்கமாகவும் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: לָּךְ
  choice: உமக்கு
  rationale: לְ இங்கு பலி செலுத்தப்படுபவரைக் குறிக்கிறது. கடவுளை நேரடியாக விளிக்கும் கண்ணியமான ஒருமை வடிவாக ‘உமக்கு’ இயல்பாக உள்ளது.
- source_word: אוֹדֶה
  choice: நன்றி செலுத்துவேன்
  rationale: Hiphil வடிவிலுள்ள ידה நன்றி செலுத்துதல் அல்லது புகழ்தல் எனப் பொருள்படும். ‘உமது பெயருக்கு’ என்பதுடன் நன்றியுணர்வைத் தெளிவாகப் பாதுகாக்க ‘நன்றி செலுத்துவேன்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: שִׁמְךָ
  choice: உமது பெயருக்கு
  rationale: எபிரெய உரையில் ‘உமது பெயர்’ என்பது வெளிப்படையாக உள்ளது; கடவுளின் வெளிப்படுத்தப்பட்ட பண்பையும் புகழையும் குறிக்கும் இந்த உடன்படிக்கைச் சொல்லாட்சியை ‘உமக்கு’ என்று சுருக்காமல் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எழுத்துகளாலான இறைப்பெயரை ஒரு பட்டமாக மாற்றாமல், நவீன தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பான ‘யாவே’ என்று தருகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: நன்றி செலுத்துவதற்கான காரணத்தை அறிமுகப்படுத்தும் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: טוֹב
  choice: அது நல்லது
  rationale: எபிரெயத்தில் வெளிப்படையான எழுவாய் இல்லை. அருகிலுள்ள ‘உமது பெயர்’ என்பதைக் குறிக்கும் வாய்ப்பை முதன்மை உரை பாதுகாக்கிறது; யாவே நல்லவர் என்ற மாற்றுப் புரிதல் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூல உரை இறைவனின் தனிப்பெயரை நேரடியாகக் கொண்டுள்ளது. அதை ஒரு பட்டமாக மாற்றாமல் தமிழில் ஒலிபெயர்ப்பது மூலத்தின் தன்மையைப் பாதுகாக்கிறது.
- issue: כִּי טוֹב என்பதில் ‘நல்லது’ என்பதன் குறிப்பு
  choice: ‘அது நல்லது’—‘உமது பெயர்’ என்பதைக் குறிப்பதாக
  alternative: ‘அவர் நல்லவர்’—யாவேயை நேரடியாகக் குறிப்பதாக
  rationale: எபிரெயப் பெயரடை வெளிப்படையான எழுவாய் இன்றி வருகிறது. அருகிலுள்ள இலக்கண முன்னோடி ‘உமது பெயர்’ என்பதால் அதனை முதன்மை உரையில் வைத்தாலும், யாவேயை நேரடியாகக் குறிக்கும் பழமையான மற்றும் சாத்தியமான வாசிப்பை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சங்கீத ஜெபத்திற்கேற்ற கண்ணியமான ஆனால் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. இறைவனை நேரடியாக விளிக்க ‘உமது/உமக்கு’ என்ற மரியாதை ஒருமை வடிவங்கள் வைக்கப்பட்டுள்ளன. ‘தன்னார்வக் காணிக்கை’ பலிச்சார்ந்த சொல்லாட்சியைப் பாதுகாக்கிறது; மூலத்தின் இலக்கணத் தெளிவின்மை அடிக்குறிப்பில் மறைக்காமல் தரப்பட்டுள்ளது.
