  text: הִנֵּ֣ה אֱ֭לֹהִים עֹזֵ֣ר לִ֑/י אֲ֝דֹנָ֗/י בְּֽ/סֹמְכֵ֥י נַפְשִֽׁ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/054/005.yaml
  text: Behold[a], God is my helper[b]; the Lord is among those who sustain my life.
translation:
  language: ta
  text: இதோ, கடவுள் எனக்குத் துணை செய்பவர்; ஆண்டவர் என் உயிரைத் தாங்குபவர்களிடையே இருக்கிறார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், ‘என் உயிரைத் தாங்குபவர்களிடையே ஆண்டவர் இருக்கிறார்’ என்ற தொடர் இலக்கண ரீதியாகக் கடினமானது. இதை, ‘ஆண்டவரே என் உயிரைத் தாங்குகிறவர்’ என்றும் புரிந்துகொள்ளலாம். இங்கு ‘உயிர்’ என மொழிபெயர்க்கப்பட்ட נֶפֶשׁ (நெஃபெஷ்) என்ற எபிரெயச் சொல், சூழலுக்கேற்ப ‘வாழ்வு,’ ‘தன்னையே,’ அல்லது ‘ஆத்துமா’ எனப் பொருள்படலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה
  choice: இதோ
  rationale: கவனத்தை ஈர்த்து, தொடர்ந்து வரும் கூற்றை வலியுறுத்தும் எபிரெயக் கவித்துவத் துகளை இயல்பான, மாண்புடைய தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: இங்கு ஒருமைப் பொருளில் வரும் பொதுவான இறைநாமம்.
- source_word: עֹזֵר לִי
  choice: எனக்கு உதவுகிறவர்
  rationale: עֹזֵר என்பது உதவும் ஒருவரைக் குறிக்கும் வினையெச்சப் பெயர்ப் பயன்பாடு; லִי பயனுறுபவராகப் பாடகரைக் குறிக்கிறது. ‘என் உதவியாளர்’ என்பது நவீன தமிழில் அலுவல் துணையாளர் என்ற குறுகிய எண்ணத்தைத் தரக்கூடும் என்பதால் இவ்வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- source_word: אֲדֹנָי
  choice: ஆண்டவர்
  rationale: மனித எஜமானை அல்ல, கடவுளுக்குரிய அதிகாரமிக்க பட்டப்பெயரை இங்கு குறிக்கிறது.
- source_word: בְּסֹמְכֵי
  choice: தாங்குகிறவர்களோடு இருக்கிறார்
  rationale: בְ உடன் வரும் பன்மை வினையெச்சக் கட்டமைப்பு இலக்கண ரீதியாகக் கடினமானது. கூட்டுறவு அல்லது உடனிருப்பை உணர்த்தும் வாசிப்பையும் பன்மையையும் இம்மொழிபெயர்ப்பு காக்கிறது.
- source_word: נַפְשִׁי
  choice: என் உயிரை
  rationale: இச்சூழலில் נֶפֶשׁ உடலிலிருந்து பிரிந்த ‘ஆன்மா’ என்பதை மட்டும் அல்லாமல் ஒருவரின் உயிர் அல்லது வாழ்வையே குறிக்கிறது; பகைவரிடமிருந்து காக்கப்படுதல் என்ற சூழலுக்கு ‘உயிர்’ பொருத்தமானது.
theological_decisions:
- issue: אֲדֹנָי என்ற இறைப்பட்டப்பெயரின் மொழிபெயர்ப்பு
  choice: ஆண்டவர்
  alternative: ஆண்டவா / எஜமான்
  rationale: இது விளிப்பெயராகவோ மனித எஜமானைக் குறிக்கும் சொல்லாகவோ இல்லாமல், கடவுளின் ஆட்சியையும் அதிகாரத்தையும் குறிக்கும் பட்டப்பெயராக வருகிறது.
- issue: נַפְשִׁי என்பதன் பொருள்
  choice: என் உயிரை
  alternative: என் ஆத்துமாவை / என்னை
  rationale: ஆபத்தின் நடுவே பாடகரின் வாழ்வு பாதுகாக்கப்படுவதே சூழல். ‘உயிர்’ என்பது பிற்கால உடல்–ஆத்துமா இருமையை உரையில் திணிக்காமல் எபிரெயச் சொல்லின் விரிவான பொருளைக் காக்கிறது.
- issue: אֲדֹנָי בְּסֹמְכֵי נַפְשִׁי என்ற கடினமான தொடரின் தொடர்பு
  choice: ஆண்டவர் என் உயிரைத் தாங்குகிறவர்களோடு இருக்கிறார்
  alternative: ஆண்டவரே என் உயிரைத் தாங்குகிறவர்
  rationale: மசோரா உரையிலுள்ள பன்மை வினையெச்சத்தையும் בְ முன்னிடைச்சொல்லையும் முதன்மை உரை வெளிப்படுத்துகிறது. அதேவேளை, ஆண்டவரையே நேரடியான தாங்குபவராகப் புரிந்துகொள்ளும் சாத்தியமான வாசிப்பை அடிக்குறிப்பில் தருவதன் மூலம் உண்மையான இலக்கணத் தெளிவின்மை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும், சங்கீதத்துக்குரிய மாண்பும் சுருக்கமும் குன்றாமலும் வடிவமைக்கப்பட்டது. ‘இதோ’ கவித்துவ வலியுறுத்தலைக் காக்கிறது; ‘எனக்கு உதவுகிறவர்’ என்பது ‘என் உதவியாளர்’ என்பதன் அலுவல் சார்ந்த நிழற்பொருளைத் தவிர்க்கிறது. கடினமான இரண்டாம் அரையடியின் தெளிவின்மை முதன்மை உரையிலும் அடிக்குறிப்பிலும் பாதுகாக்கப்பட்டுள்ளது.
