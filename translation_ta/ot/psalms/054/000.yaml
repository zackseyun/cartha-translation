base_translation:
  language: en
  yaml_path: translation/ot/psalms/054/000.yaml
  text: 'For the choirmaster: with stringed instruments. A Maskil[b] of David[a].'
translation:
  language: ta
  text: 'இசை இயக்குநருக்கு: தந்திக் கருவிகளுடன். தாவீதின்[a] மஸ்கீல்[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தாவீது எழுதியது” அல்லது “தாவீதுக்காக” என்றும் மொழிபெயர்க்கலாம்; எபிரெயத் தலைப்பிலுள்ள முன்னிடைச்சொல் ஆசிரியத்துவம், அர்ப்பணம் அல்லது தொடர்பைக் குறிக்கக்கூடும்.
    reason: alternative_reading
  - marker: b
    text: “மஸ்கீல்” என்பது சங்கீதத் தலைப்புகளில் வரும் ஓர் எபிரெயத் தொழில்நுட்பச் சொல். இது ஒருவகைப் படைப்பு அல்லது இசை நிகழ்த்தும் முறையைக் குறிக்கலாம்; அதன் துல்லியமான பொருள் உறுதியாகத் தெரியவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: இசைக்குழுத் தலைவருக்கு
  rationale: சங்கீதத் தலைப்புகளில் இசை நிகழ்த்துதலை மேற்பார்வையிடுபவரைக் குறிக்கிறது; இச்சொல் அதன் வழிபாட்டு மற்றும் இசைச் செயல்பாட்டை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: בִּנְגִינוֹת
  choice: நரம்பிசைக் கருவிகளுடன்
  rationale: இது நரம்புகளைக் கொண்ட இசைக்கருவிகளின் துணையைக் குறிக்கிறது; பொதுவான ‘இசைக்கருவிகள்’ என்பதைவிட மூலத்தின் குறிப்பான பொருளைப் பாதுகாக்கிறது.
- source_word: מַשְׂכִּיל
  choice: மஸ்கீல்
  rationale: சங்கீதத் தலைப்புகளில் வரும் இத்தொழில்நுட்பச் சொல்லின் துல்லியமான பொருள் உறுதியில்லை. ‘போதனைப் பாடல்’ அல்லது ‘தியானப் பாடல்’ என்று பொருள் நிர்ணயிக்காமல் ஒலிபெயர்ப்பு செய்யப்பட்டுள்ளது.
- source_word: לְדָוִד
  choice: தாவீதின்
  rationale: எபிரெய முன்னிடைச்சொல் படைப்புரிமை, அர்ப்பணம் அல்லது தொடர்பைக் குறிக்கக்கூடும். ‘தாவீது எழுதியது’ என்று ambiguity-ஐத் தீர்மானிக்காமல், இயல்பான தமிழில் தொடர்பைத் திறந்த நிலையில் வைக்கிறது.
theological_decisions:
- issue: தாவீதுடன் உள்ள தொடர்பைக் குறிக்கும் சங்கீதத் தலைப்பு
  choice: தாவீதின்
  alternative: தாவீது எழுதியது; தாவீதுக்காக
  rationale: மூலத்திலுள்ள לְ என்பது படைப்புரிமை, அர்ப்பணம் அல்லது தொடர்பு ஆகியவற்றில் ஒன்றைக் குறிக்கலாம்; எனவே மொழிபெயர்ப்பு தேவையின்றி ஒரே விளக்கத்தைத் தீர்மானிப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சுருக்கமான சங்கீதத் தலைப்பு நடையில் அமைக்கப்பட்டுள்ளது. ‘மஸ்கீல்’ ஒலிபெயர்க்கப்பட்டு அதன் நிச்சயமற்ற பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது; எல்லா அடிக்குறிப்பு குறியீடுகளும் அவை விளக்கும் சொற்களுடன் இணைக்கப்பட்டுள்ளன.
