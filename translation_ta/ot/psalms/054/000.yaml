  terminology: “மஸ்கீல்” appropriately preserves the uncertain Hebrew technical term. “தந்திக் கருவிகள்” is the established clear Tamil expression for stringed instruments. The Davidic footnote should speak of authorship rather than “படைப்புரிமை,” which can suggest modern legal copyright.
