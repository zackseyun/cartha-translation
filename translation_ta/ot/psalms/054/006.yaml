source:
  edition: WLC
  text: ישוב הָ֭/רַע לְ/שֹׁרְרָ֑/י בַּ֝/אֲמִתְּ/ךָ֗ הַצְמִיתֵֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/054/006.yaml
  text: May evil return upon my adversaries[a]; in your faithfulness[b], destroy them.
translation:
  language: ta
  text: 'தீமை என் எதிரிகள்மேல் திரும்பட்டும்[a]; உமது நம்பகத்தன்மையால்[b] அவர்களை அழித்துவிடும்.


    [a] அல்லது, “தீமை என் எதிரிகள்மேல் திரும்பும்.” முதல் வினைச்சொல்லை வேண்டுதலாக மட்டுமல்லாமல், நிகழப்போவதை அறிவிக்கும் கூற்றாகவும் வாசிக்கலாம்.


    [b] அல்லது, “உமது உண்மையால்.” எபிரெயச் சொல் உண்மை, நம்பகத்தன்மை, உண்மைத்தன்மை ஆகிய பொருள்களைக் கொண்டிருக்கலாம்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தீமை என் எதிரிகள்மேல் திரும்பும்.” முதல் வினைச்சொல்லை வேண்டுதலாக மட்டுமல்லாமல், நிகழப்போவதை அறிவிக்கும் கூற்றாகவும் வாசிக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “உமது உண்மையால்.” எபிரெயச் சொல் உண்மை, நம்பகத்தன்மை, உண்மைத்தன்மை ஆகிய பொருள்களைக் கொண்டிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ישוב
  choice: திரும்பட்டும்
  rationale: שוב என்பதன் Qal imperfect வடிவம் இச்சூழலில் எதிர்கால அறிவிப்பாகவோ வேண்டுதலைக் குறிக்கும் jussive ஆகவோ அமையலாம். அடுத்துவரும் கட்டளை வினையையும் சங்கீதத்தின் வேண்டுதல் சூழலையும் கருத்தில் கொண்டு, பிரதான உரையில் “திரும்பட்டும்” என மொழிபெயர்க்கப்பட்டு, அறிவிப்பு வாசிப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: הָרַע
  choice: தீமை
  rationale: רַע என்பது ஒழுக்கத் தீமையையும் தீங்கு அல்லது கேடையும் குறிக்கலாம். “தீமை” எபிரெய மூலத்தின் சுருக்கத்தையும் அதன் ஒழுக்க மற்றும் தண்டனை சார்ந்த இரட்டைப் பொருள் வாய்ப்பையும் காக்கிறது.
- source_word: לְשֹׁרְרָי
  choice: என் எதிரிகள்மேல்
  rationale: இது சங்கீதக்காரனைப் பகைத்தெதிர்க்கிறவர்களைக் குறிக்கிறது. “எதிரிகள்” என்பது போர் சார்ந்த பொருளைத் தேவையின்றி திணிக்காமல், நவீன தமிழில் இயல்பாக உள்ளது; לְ இங்கு தீமை அவர்கள்மேல் திரும்புவதைக் குறிக்கும் வகையில் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: בַּאֲמִתְּךָ
  choice: உமது உண்மைத்தன்மையின்படி
  rationale: אֱמֶת என்பது உண்மை, நம்பகத்தன்மை, உண்மைத்தன்மை ஆகியவற்றைக் குறிக்கலாம். கடவுளின் நம்பத்தகுந்த இயல்புக்கு ஏற்ப அவர் செயல்பட வேண்டும் என்ற வேண்டுதலை “உண்மைத்தன்மையின்படி” இயல்பாக வெளிப்படுத்துகிறது; “உண்மை” என்ற மாற்று அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: הַצְמִיתֵם
  choice: அவர்களை அழித்துவிடும்
  rationale: צמת என்பதன் Hiphil கட்டளை வடிவம், அவர்களை அழிக்க அல்லது முடிவுக்குக் கொண்டுவர வேண்டும் என்ற வலுவான வேண்டுதலைக் குறிக்கிறது. “அழித்துவிடும்” அதன் நேரடியான வலிமையைத் தணிக்காமல், கடவுளை மரியாதையுடன் ஒருமையில் அழைக்கும் தமிழ்நடையைப் பேணுகிறது.
theological_decisions:
- issue: சாப வேண்டுதலின் வலிமையும் முதல் வினையின் நிலையும்
  choice: தீமை எதிரிகள்மேல் திரும்ப வேண்டும் என்ற தெய்வீக நியாயத்தீர்ப்புக்கான வேண்டுதலாக முதன்மை உரையில் வழங்கப்பட்டது.
  alternative: “தீமை என் எதிரிகள்மேல் திரும்பும்” என்ற நிகழப்போவதை அறிவிக்கும் வாசிப்பு.
  rationale: இந்தச் சங்கீதம் கடவுளிடம் நேரடியாகச் செய்யும் வேண்டுதல்; இறுதி வினை தெளிவான கட்டளை வடிவில் உள்ளது. எனவே முதல் வினையை வேண்டுதலாக வாசிப்பது சூழலுக்கு ஏற்றது. இருப்பினும் imperfect வடிவத்தின் அறிவிப்பு வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டு, மூலத்தின் இறையியல் பதற்றம் தீர்த்துவைக்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் சங்கீத வேண்டுதலுக்குரிய கண்ணியத்துடனும் அமைக்கப்பட்டது. கடவுளை “உமது” என்றும் மரியாதை ஒருமைக் கட்டளையான “அழித்துவிடும்” என்றும் அழைக்கிறது. மூலத்தின் கடுமையான நியாயத்தீர்ப்பு வேண்டுதல் மென்மைப்படுத்தப்படவில்லை.
