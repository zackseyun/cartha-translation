  source_fidelity: ‘என் உயிரைப் பறிக்க முனைகிறார்கள்’ என்பது உயிரைக் கொல்லும் நோக்கத்தைத் தெரிவிக்கிறது; ஆயினும் בִּקְשׁוּ (‘தேடுகிறார்கள்/நாடுகிறார்கள்’) என்ற வினையின் தொடர்ச்சியான பகைச் செயலை நேரடியாக வெளிப்படுத்த ‘என் உயிரை நாடுகிறார்கள்’ சிறந்தது. עָרִיצִים என்பது வெறும் இரக்கமின்மையைவிடக் கொடூரமான/வன்முறையான ஒடுக்குவோரைக் குறிக்கிறது; ‘கொடூரர்கள்’ பொருத்தமானது. மற்ற வரிகள் மூலத்தின் காரணத் தொடர்பு, எதிர்த்து எழுதல், ‘முன் வைக்காத’ உருவகம், மற்றும் சேலா ஆகியவற்றை நன்றாகக் காக்கின்றன.
  naturalness: திருத்திய வாசகம் நவீனத் தரத் தமிழில் சுருக்கமாகவும் கவிதைநடைக்கேற்றதாகவும் உள்ளது. ‘என் உயிரை நாடுகிறார்கள்’ என்பது சூழலில் உயிருக்கு ஆபத்து விளைவிக்க விரும்புதலை இயல்பாகச் சொல்கிறது; அடிக்குறிப்பு அந்தச் சொல்லின் சொற்சார்ந்த வடிவத்தையும் சூழல்சார் பொருளையும் விளக்குகிறது.
  terminology: ‘அந்நியர்கள்’ זָרִים என்பதன் திறந்த பொருள் வரம்பைத் தக்கவைக்கிறது. ‘கொடூரர்கள்’ עָרִיצִים என்பதன் வன்முறை/ஒடுக்குமுறைச் சாயலைப் போதுமான அளவு காட்டுகிறது. ‘கடவுளைத் தங்கள் கண்முன் வைத்துக்கொள்ளவில்லை’ என்பது தேவனை முன்பாக வைக்காத உருவகத்தைத் தக்கவைக்கிறது; ‘சேலா’ ஒலிபெயர்ப்பாகவே வைக்கப்படுகிறது.
