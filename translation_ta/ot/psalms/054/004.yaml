  text: כִּ֤י זָרִ֨ים קָ֤מוּ עָלַ֗/י וְֽ֭/עָרִיצִים בִּקְשׁ֣וּ נַפְשִׁ֑/י לֹ֤א שָׂ֨מוּ אֱלֹהִ֖ים לְ/נֶגְדָּ֣/ם סֶֽלָה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/054/004.yaml
  text: For strangers have risen against me[a], and ruthless men seek my life; they do not set God before them[c][b]. Selah
translation:
  language: ta
  text: 'ஏனெனில், அந்நியர்கள்[a] எனக்கு எதிராக எழுந்திருக்கிறார்கள்;

    கொடூரர்கள்[b] என் உயிரை நாடுகிறார்கள்[c].

    அவர்கள் கடவுளைத் தங்கள் கண்முன் வைத்துக்கொள்ளவில்லை.

    சேலா.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வேற்றவர்கள்’ அல்லது ‘வெளிநாட்டவர்கள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் அயலான, தொடர்பற்ற, அல்லது வேறு நாட்டைச் சேர்ந்தவர்களைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: ‘வன்முறையாளர்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: எபிரெயில், ‘என் உயிரைத் தேடுகிறார்கள்.’ இச்சூழலில் ‘உயிர்’ என்பது சங்கீதக்காரரின் உயிரைக் குறிக்கிறது; அதாவது அவரைக் கொல்லும் நோக்கில் நாடுகிறார்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: சுற்றியுள்ள வேண்டுதலுக்கான காரணத்தை அறிமுகப்படுத்தும் எபிரெய இணைப்புச்சொல்லின் காரணப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: זָרִים
  choice: அந்நியர்கள்
  rationale: அயலார், தொடர்பற்றவர், வேற்றவர் என்ற பொருள் வரம்பைத் தக்கவைக்கிறது; இன அடிப்படையில் ‘வெளிநாட்டவர்’ என்று தேவையின்றிக் குறுக்கவில்லை.
- source_word: קָמוּ עָלַי
  choice: எனக்கு எதிராக எழுந்திருக்கிறார்கள்
  rationale: பகைமையுடன் எதிர்த்து எழுதல் என்ற எபிரெய மரபுத்தொடரின் உருவகத்தையும் செயற்பாட்டையும் காக்கிறது.
- source_word: עָרִיצִים
  choice: இரக்கமற்றவர்கள்
  rationale: கொடூரமும் ஒடுக்குமுறையும் கொண்டவர்களைச் சுட்டும் சொல்லின் நெறிசார் வலிமையைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: בִּקְשׁוּ נַפְשִׁי
  choice: என் உயிரைப் பறிக்க முனைகிறார்கள்
  rationale: உயிருக்கு ஆபத்து உள்ள சூழலில் נֶפֶשׁ என்பது தனியான ஆவிக்குரிய ‘ஆத்துமா’வை விட உயிரையே குறிக்கிறது; ‘முனைகிறார்கள்’ பகைவர்களின் கொலைநோக்கை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לֹא שָׂמוּ אֱלֹהִים לְנֶגְדָּם
  choice: அவர்கள் கடவுளைத் தங்கள் கண்முன் வைத்துக்கொள்ளவில்லை
  rationale: கடவுளைத் தங்களுக்கு முன் வைக்கவில்லை என்ற மூல உருவகத்தைப் பாதுகாத்து, அவரைக் கருத்தில் கொள்ளாத நெறிசார் நிலையை மிகையாக விளக்காமல் தெரிவிக்கிறது.
- source_word: סֶלָה
  choice: சேலா
  rationale: துல்லியமான பொருள் உறுதியில்லாத வழிபாட்டு அல்லது இசைக் குறியீடு என்பதால் மொழிபெயர்க்காமல் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: அச்சுறுத்தல் சூழலில் נֶפֶשׁ என்பதன் மனிதவியல் பொருள்
  choice: ‘உயிர்’ என்று மொழிபெயர்த்தல்
  alternative: ‘ஆத்துமா’
  rationale: இங்கு பகைவர்கள் சங்கீதக்காரரைக் கொல்ல முனைவதே கருத்து. ஆகவே உடல்–ஆத்துமா வேறுபாட்டை உரைக்குள் புகுத்தாமல், נֶפֶשׁ என்பதன் சூழல்சார் முழு உயிர்/தன் பொருளை ‘உயிர்’ வெளிப்படுத்துகிறது.
- issue: கடவுளை ‘தங்களுக்கு முன் வைக்காதது’ என்ற உருவகம்
  choice: ‘கடவுளைத் தங்கள் கண்முன் வைத்துக்கொள்ளவில்லை’ என்று உருவகத்தைப் பேணுதல்
  alternative: ‘அவர்கள் கடவுளைப் பொருட்படுத்தவில்லை’
  rationale: மாற்று வாசகம் உட்கருத்தைத் தெளிவாக்கினாலும், மூலத்தின் இடவியல் உருவகத்தையும் அதன் திறந்த நெறிசார் ஆழத்தையும் குறுக்கிவிடும்.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. இணை வாக்கியங்களின் சமநிலை பேணப்பட்டுள்ளது; ‘கண்முன் வைத்துக்கொள்ளவில்லை’ என்ற சொற்றொடர் மூல உருவகத்தை வாசகர்களுக்குப் புரியும் தமிழில் தக்கவைக்கிறது. ‘சேலா’ பாரம்பரிய ஒலிபெயர்ப்பாக வைக்கப்பட்டுள்ளது.
