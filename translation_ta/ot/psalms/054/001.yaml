  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: בְּ/ב֣וֹא הַ֭/זִּיפִים וַ/יֹּאמְר֣וּ לְ/שָׁא֑וּל הֲ/לֹ֥א דָ֝וִ֗ד מִסְתַּתֵּ֥ר עִמָּֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/054/001.yaml
  text: when the Ziphites came and said to Saul[a], “Is not David hiding among us?”
translation:
  language: ta
  text: சீப்பியர்கள் வந்து சவுலிடம், “தாவீது எங்களிடையே[a] ஒளிந்திருக்கிறான் அல்லவா?” என்று சொன்னபோது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எங்களுடன்.” எபிரெயச் சொல் நேரடியாக “எங்களுடன்” என்று பொருள்படும்; இங்கு தாவீது சீப்பியர்களின் பகுதி அல்லது அவர்கள் நடுவில் ஒளிந்திருப்பதை “எங்களிடையே” என்பது தெளிவாகக் காட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבוֹא
  choice: வந்து ... சொன்னபோது
  rationale: בְּ + infinitive construct காலத்தைக் குறிக்கும் துணைவாக்கியத்தை அறிமுகப்படுத்துகிறது. தமிழில் வாக்கியத்தின் முடிவில் ‘சொன்னபோது’ என்று அமைப்பது இயல்பாகவும் மூலத்தின் காலத் தொடர்பைத் தெளிவாகவும் தருகிறது.
- source_word: הַזִּיפִים
  choice: சீப்பியர்கள்
  rationale: சீப் என்னும் இடத்தைச் சேர்ந்த மக்களைக் குறிக்கும் இன/இடப்பெயர்ச் சொல்; ‘சீப்பியர்கள்’ சுருக்கமானதும் தமிழில் இயல்பானதும் ஆகும்.
- source_word: וַיֹּאמְרוּ
  choice: என்று சொன்னபோது
  rationale: אמר என்பதன் எளிய உரைத்தல் பொருளையும் நிகழ்வின் தொடர்ச்சியையும் காக்கிறது; காலத் துணைவாக்கியத்தோடு இயல்பான தமிழில் இணைக்கப்பட்டுள்ளது.
- source_word: לְשָׁאוּל
  choice: சவுலிடம்
  rationale: לְ மறைமுகச் செயப்படுபொருளைக் குறிக்கிறது; ஒருவரிடம் கூறுவதைத் தமிழில் ‘சவுலிடம்’ என்பது இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הֲלֹא
  choice: அல்லவா?
  rationale: உறுதிப்படுத்தும் பதிலை எதிர்பார்க்கும் வினாவை, கூற்றாக மாற்றாமல், தமிழின் இயல்பான எதிர்பார்ப்பு வினாவாகக் காக்கிறது.
- source_word: דָוִד
  choice: தாவீது
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற பெயர் வடிவம்.
- source_word: מִסְתַּתֵּר
  choice: ஒளிந்திருக்கிறான்
  rationale: Hitpael நிகழ்காலப் பங்கேற்பு வடிவம் தன்னையே மறைத்துக்கொண்டு தொடர்ச்சியாக ஒளிந்திருக்கும் நிலையைச் சுட்டுகிறது; ‘ஒளிந்திருக்கிறான்’ இதை இயல்பாகத் தெரிவிக்கிறது.
- source_word: עִמָּנוּ
  choice: எங்களிடையே
  rationale: சொல்லுக்கு நேரான பொருள் ‘எங்களுடன்’ என்றாலும், இச்சூழலில் சீப்பியர்களின் பகுதி அல்லது சமூகத்துக்குள் தாவீது ஒளிந்திருப்பதை ‘எங்களிடையே’ தெளிவாக வெளிப்படுத்துகிறது; நேரடி மாற்று அடிக்குறிப்பில் காக்கப்பட்டுள்ளது.
