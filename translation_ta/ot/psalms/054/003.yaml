source:
  edition: WLC
  text: אֱ֭לֹהִים שְׁמַ֣ע תְּפִלָּתִ֑/י הַ֝אֲזִ֗ינָ/ה לְ/אִמְרֵי פִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/054/003.yaml
  text: God[a], hear my prayer; give ear to the words of my mouth.
translation:
  language: ta
  text: கடவுளே, என் மன்றாட்டைக் கேளும்; என் வாயின் சொற்களுக்குச் செவிகொடும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱלֹהִים
  choice: கடவுளே
  rationale: இது மன்றாட்டில் கடவுளை நேரடியாக விளிக்கும் விளிவேற்றுமைப் பயன்பாடு; நவீனத் தமிழில் ‘கடவுளே’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: שְׁמַע
  choice: கேளும்
  rationale: Qal கட்டளை வடிவம்; வெறுமனே ஒலி கேட்பதல்ல, மன்றாட்டைக் கவனத்துடன் ஏற்றுக்கொள்ளுமாறு வேண்டுவதைக் குறிக்கிறது. ‘கேளும்’ மன்றாட்டு நடையின் கண்ணியத்தையும் இணை அமைப்பையும் காக்கிறது.
- source_word: תְּפִלָּתִי
  choice: என் மன்றாட்டை
  rationale: תְּפִלָּה என்பதன் அடிப்படைப் பொருள் ‘ஜெபம்/வேண்டுதல்’. இச்சங்கீதச் சூழலில் ‘மன்றாட்டு’ வேண்டுகோள் நிறைந்த ஜெபத்தை இயல்பான, சமயப் பிரிவுசார்பற்ற தமிழில் தெரிவிக்கிறது.
- source_word: הַאֲזִינָה
  choice: செவிகொடும்
  rationale: Hiphil கட்டளை வடிவம் கவனமாகச் செவிசாய்ப்பதைக் குறிக்கிறது. ‘செவிகொடும்’ மூலத்தின் செவி சார்ந்த உருவகத்தையும் கவிதை இணைநிலையையும் பாதுகாக்கிறது.
- source_word: לְאִמְרֵי
  choice: சொற்களுக்கு
  rationale: אֵמֶר என்பதன் கட்டமைப்புப் பன்மை இங்கு பேசப்பட்ட ‘சொற்கள்’ எனப் பொருள்படும்; לְ முன்னொட்டு தமிழில் நான்காம் வேற்றுமையான ‘-க்கு’ மூலம் இயல்பாக வெளிப்படுகிறது.
- source_word: פִי
  choice: என் வாயின்
  rationale: எபிரெயச் சொல்லின் நேரடியான பொருள் ‘என் வாய்’. ‘என் வாயின் சொற்கள்’ என்ற concrete கவிதைப் படிமத்தைப் பராபிரேஸ் செய்யாமல் காக்கிறது.
