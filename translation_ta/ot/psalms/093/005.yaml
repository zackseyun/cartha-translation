  text: עֵֽדֹתֶ֨י/ךָ נֶאֶמְנ֬וּ מְאֹ֗ד לְ/בֵיתְ/ךָ֥ נַאֲוָה קֹ֑דֶשׁ יְ֝הוָ֗ה לְ/אֹ֣רֶךְ יָמִֽים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/093/005.yaml
  text: Your testimonies are very trustworthy[a]; holiness befits your house, O Yahweh[b], for length of days.
translation:
  language: ta
  text: உமது சாட்சியுரைகள் மிகவும் நம்பத்தக்கவை; யாவே, உமது இல்லத்திற்குப் பரிசுத்தம் என்றென்றும்[a] ஏற்றது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “நாட்களின் நீளத்திற்கு.” இது நீடித்த காலத்தை, “என்றென்றும்” என்பதையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵדֹתֶיךָ
  choice: உமது சாட்சிகள்
  rationale: இச்சொல் இறைவனுடைய உடன்படிக்கை சார்ந்த சாட்சியுரைகள் அல்லது பிரமாணங்களைக் குறிக்கலாம். சட்டக் கட்டளைகள் என்ற பொருளுக்கு மட்டும் சுருக்காமல், எபிரெயச் சொல்லின் அடிப்படை உருவகத்தைப் பேணுகிறது.
- source_word: נֶאֶמְנוּ מְאֹד
  choice: முற்றிலும் நம்பத்தக்கவை
  rationale: Niphal வடிவம் உறுதி மற்றும் நம்பகத்தன்மையைக் குறிக்கிறது; מְאֹד தரும் வலியுறுத்தலை இயல்பான நவீன தமிழில் ‘முற்றிலும்’ வெளிப்படுத்துகிறது.
- source_word: לְבֵיתְךָ
  choice: உமது இல்லத்திற்கு
  rationale: בַּיִת என்பதன் நேரடிப் பொருளான ‘இல்லம்’ பேணப்படுகிறது; சூழலில் அது இறைவனுடைய ஆலயம் அல்லது பரிசுத்த இடத்தைக் குறிக்கிறது.
- source_word: נַאֲוָה קֹדֶשׁ
  choice: பரிசுத்தம் … ஏற்றது
  rationale: நַאֲוָה பொருத்தமாக அல்லது தகுந்ததாக இருப்பதைக் குறிக்கிறது; קֹדֶשׁ இங்கு பண்பாகிய ‘பரிசுத்தம்’ என இயல்பாக வழங்கப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: לְאֹרֶךְ יָמִים
  choice: என்றென்றும்
  rationale: சொல்லுக்குச் சொல் ‘நாட்களின் நீளத்திற்கு’ என்றாலும், இச்சூழலில் நீடித்த அல்லது முடிவில்லாத காலத்தைக் குறிக்கும் எபிரெய மரபுத்தொடரை இயல்பான தமிழில் வெளிப்படுத்துகிறது; நேரடி வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட தெய்வீகப் பெயர் இருப்பதால், அதை பட்டமாக மாற்றாமல் ஒலிபெயர்க்கிறது; குறிப்பிட்ட சமய மரபின் வடிவத்தைத் திணிக்கவில்லை.
- issue: לְאֹרֶךְ יָמִים என்பதன் காலப் பொருள்
  choice: என்றென்றும்
  alternative: நாட்களின் நீளமெல்லாம் / நீண்ட நாட்களுக்கு
  rationale: இது நீடித்த காலத்தைக் குறிக்கும் மரபுத்தொடர். தமிழ் வாசிப்பில் இயல்பாக அதன் பொருளைத் தருகிறது; மூலத்தின் நேரடி உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: יְהוָה மற்றும் לְאֹרֶךְ יָמִים ஆகியவற்றின் தொடரியல் தொடர்பு
  choice: ‘யாவே’ என்பதை அழைப்பாகவும், ‘என்றென்றும்’ என்பதை உமது இல்லத்திற்குப் பரிசுத்தம் ஏற்றது என்ற கூற்றோடும் இணைத்தல்
  alternative: ‘யாவே, என்றென்றும்’ என்று இறுதியில் ஒன்றாக வாசித்தல்
  rationale: மசோரா உச்சரிப்புக் குறிகளும் இயல்பான தொடரியலும் காலச் சொற்றொடரை இல்லத்தின் பரிசுத்தத்துடன் இணைக்க ஆதரவளிக்கின்றன; அதேவேளை தெய்வீகப் பெயர் அழைப்பாகப் பேணப்படுகிறது.
translation_notes:
  register: நவீன, மரியாதைமிக்க, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘உமது’ சங்கீதத்தின் நேரடி இறைமுகப் பேச்சுக்கேற்ற கண்ணியத்தைத் தருகிறது. அரிதான சொல்லுக்குச் சொல் காலவழக்கை முதன்மை உரையில் தவிர்த்து, அதன் உருவகத்தை அடிக்குறிப்பில் வெளிப்படையாகப் பேணியுள்ளோம்.
