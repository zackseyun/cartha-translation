    reason: alternative_reading
lexical_decisions:
- source_word: מִ/קֹּלוֹת
  choice: முழக்கங்களைவிடவும்
  rationale: מִן என்பதன் ஒப்பீட்டுப் பொருளை ‘-விடவும்’ என்பதும், நீரைக் குறிக்கும் קוֹל என்பதன் செவிப்புலப் படிமத்தை ‘முழக்கங்கள்’ என்பதும் இயல்பான தமிழில் வெளிப்படுத்துகின்றன.
- source_word: מַיִם רַבִּים
  choice: திரளான நீர்
  rationale: பெரும் அளவிலும் வலிமையிலும் காணப்படும் நீரைச் சுட்டும் எபிரெயச் சொற்றொடரின் கவித்துவப் பொதுமையை இது காக்கிறது.
- source_word: אַדִּירִים
  choice: வலிமைமிக்க
  rationale: கடலின் பேரலைகளுடைய வலிமையையும் கம்பீரத்தையும் குறிக்கும் பெயரடையாக இயல்பாக அமைகிறது; எபிரெய இணைப்பில் உள்ள சிறு தெளிவின்மையை மிகையாக விளக்கவில்லை.
- source_word: מִשְׁבְּרֵי יָם
  choice: கடலின் பேரலைகள்
  rationale: மோதியுடையும் வலிமையான கடல் அலைகளை நவீன வாசகருக்குத் தெளிவாகவும் கவித்துவமாகவும் குறிக்கிறது.
- source_word: אַדִּיר
  choice: மாட்சிமைமிக்கவர்
  rationale: வல்லமை, கம்பீரம், அரச மேன்மை ஆகிய பொருள் நிழல்களை ஒருங்கே வெளிப்படுத்தி, சங்கீதத்தின் அரசாட்சிச் சூழலுக்கு ஏற்றதாக உள்ளது.
- source_word: בַּ/מָּרוֹם
  choice: உயரத்தில்
  rationale: உயர்ந்த இடம் அல்லது மேன்மையான நிலை என்ற கவித்துவப் பொருளைத் தக்கவைக்கிறது; ‘பரலோகத்தில்’ என்று தேவையின்றி குறிப்பாக்கவில்லை.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் வரும் இறைப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பாக வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரை இறைவனின் தனிப்பெயரை நேரடியாகப் பயன்படுத்துவதால், அதை ஒலிபெயர்த்து வழங்குவது மூலத்தின் தன்மையைப் பாதுகாக்கிறது; மரபுவழிப் பட்டப்பெயர் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- issue: தொடக்கத்தில் மீண்டும் வரும் מִן சொற்களின் ஒப்பீட்டுப் பொருள்
  choice: நீரின் முழக்கங்களையும் கடலின் பேரலைகளையும் விட யாவே மாட்சிமைமிக்கவர்
  alternative: வலிமை என்ற சொல்லை முன்னுள்ள நீர் அல்லது அலைகளோடு வேறுவிதமாக இணைத்துப் படிக்கலாம்
  rationale: மீண்டும் வரும் מִן ஒப்பீட்டுக் கட்டமைப்பை இயல்பாக உருவாக்குகிறது. இதனால் குழப்பமூட்டும் இயற்கை வலிமைகளுக்கு மேலான யாவேயின் மேன்மை கூறப்படுகிறது; உரைக்கு அப்பாற்பட்ட புராண விளக்கம் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘முழக்கம்’, ‘பேரலை’, ‘மாட்சிமைமிக்கவர்’ ஆகிய சொற்கள் ஒலி, கடலின் ஆற்றல், இறைமேன்மை என்ற மூலப் படிமங்களின் ஏற்றத்தைப் பேணுகின்றன.
