base_translation:
  language: en
  yaml_path: translation/ot/psalms/093/004.yaml
  text: More majestic than the sound of many waters[a], than the mighty breakers of the sea[b], is Yahweh on high.
translation:
  language: ta
  text: திரளான நீரின் முழக்கங்களைவிடவும்[a], கடலின் வலிமைமிக்க பேரலைகளைவிடவும், உயரத்தில் யாவே[b] மாட்சிமைமிக்கவர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘முழக்கங்கள்’ என்பதற்கு ‘ஓசைகள்’ என்றும் மொழிபெயர்க்கலாம். இந்த வரியை, ‘திரளான நீரின் ஓசைகளைவிடவும், கடலின் வலிமைமிக்க பேரலைகளைவிடவும், உயரத்தில் யாவே வல்லமைமிக்கவர்’ என்றும் மொழிபெயர்க்கலாம்.
