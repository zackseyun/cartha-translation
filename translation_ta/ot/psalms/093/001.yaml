  text: Yahweh reigns[a]; he is clothed with majesty; Yahweh is clothed with strength; he has girded himself. Indeed, the world is established[e][d][c][b]; it will not be moved.
translation:
  language: ta
  text: யாவே அரசாளுகிறார்[a]; அவர் மாட்சியை அணிந்திருக்கிறார்[b]. யாவே வலிமையை அணிந்திருக்கிறார்; அதைத் தமக்கு இடைக்கச்சையாகக் கட்டிக்கொண்டார்[c]. உண்மையாகவே, உலகம் நிலைநிறுத்தப்பட்டுள்ளது; அது நிலைகுலையாது[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவே அரசரானார்.” எபிரெய வினை அரசாட்சியின் தொடக்கத்தைச் சுட்டக்கூடும்; இங்கு அது அவருடைய தற்போதைய அரசாட்சியை அறிவிப்பதாகத் தெரிகிறது.
    reason: alternative_reading
  - marker: b
    text: “மாட்சி” என்பதற்கு “பேரொளி” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: சொல்லர்த்தமாக, “தம்மைத் தாமே கட்டிக்கொண்டார்.” வலிமையை இடைக்கச்சை அல்லது போரணிபோல அணிந்து ஆயத்தமாவதே உருவகம்.
    reason: cultural_note
  - marker: d
    text: “உலகம் உறுதியாக நிறுவப்பட்டுள்ளது; அது தடுமாறாது” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இஸ்ரவேலுக்கு வெளிப்படுத்தப்பட்ட இறைப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் இயல்பாக ஒலிபெயர்க்கிறது.
- source_word: מָלָךְ
  choice: அரசாளுகிறார்
  rationale: இங்கு வினை, யாவேயின் தற்போதைய அரசாட்சியை அறிவிப்பதாகப் பொருந்துகிறது; தொடக்க நிகழ்வை மட்டும் குறிக்கும் வகையில் அதைச் சுருக்கவில்லை.
- source_word: גֵּאוּת
  choice: மாட்சி
  rationale: இறைவனைப் பற்றிய சூழலில் உயர்வும் அரச மகத்துவமும் குறிக்கப்படுவதால், எதிர்மறையான ‘செருக்கு’ என்பதற்குப் பதிலாக ‘மாட்சி’ பொருத்தமானது.
- source_word: לָבֵשׁ
  choice: அணிந்திருக்கிறார்
  rationale: மாட்சி மற்றும் வலிமையை ஆடையாக அணியும் எபிரெய உருவகத்தையும், மீண்டும் வரும் வினையின் கவிதை வலியுறுத்தலையும் காக்கிறது.
- source_word: עֹז
  choice: வலிமை
  rationale: அரசருக்குரிய ஆற்றலைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: הִתְאַזָּר
  choice: தம் இடையில் கட்டிக்கொண்டிருக்கிறார்
  rationale: தன்னைத் தானே போருக்கோ செயலுக்கோ ஆயத்தப்படுத்தும் விதமாக இடைக்கச்சை கட்டும் உருவகத்தைச் சுருக்காமல் காக்கிறது.
- source_word: אַף
  choice: ஆம்
  rationale: முந்தைய அறிவிப்பை உறுதிப்படுத்தி, உலகின் நிலைத்தன்மைக்குக் கொண்டு செல்லும் வலியுறுத்தலை இயல்பான தமிழில் தருகிறது.
- source_word: תִּכּוֹן
  choice: நிலைநிறுத்தப்பட்டுள்ளது
  rationale: உறுதியாக நிறுவப்பட்டிருக்கும் நிலையைக் குறிக்கும் நிபால் வடிவின் பொருளைத் தெரிவிக்கிறது.
- source_word: תֵּבֵל
  choice: உலகம்
  rationale: ஒழுங்குபடுத்தப்பட்ட, குடியிருப்புடைய உலகைக் குறிக்கும் சொல்லுக்கான சுருக்கமான இயல்பான தமிழ் இணை.
- source_word: בַּל תִּמּוֹט
  choice: அது அசைக்கப்படாது
  rationale: தடுமாறாமலும் நிலைகுலையாமலும் இருக்கும் உறுதியை இயல்பான சங்கீத நடையில் தெரிவிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பட்டம் அல்ல, நான்கெழுத்து இறைப் பெயரே உள்ளது; எனவே அதை மறைக்காமல் தமிழில் ஒலிபெயர்க்கிறது.
- issue: מָלָךְ வினையின் காலம்/நோக்கு
  choice: தற்போதைய அறிவிப்பாக ‘அரசாளுகிறார்’
  alternative: ‘அரசரானார்’ அல்லது ‘அரசராகியிருக்கிறார்’
  rationale: வடிவம் அரசாட்சியின் தொடக்கத்தையும் அனுமதிக்கலாம்; ஆனால் இச்சங்கீதச் சூழலில் யாவேயின் நிகழ்கால அரசாட்சியை அறிவிப்பது முதன்மையாகத் தோன்றுகிறது. மாற்று சாத்தியம் அடிக்குறிப்பில் காக்கப்படுகிறது.
- issue: உலகம் அசைக்கப்படாது என்ற கூற்றின் தன்மை
  choice: கவிதையின் படைப்பொழுங்கு மற்றும் நிலைத்தன்மை குறித்த அறிவிப்பாக அப்படியே வைத்தல்
  alternative: பூமி எந்த வகையிலும் நகராது என்ற அறிவியல் கூற்றாக விளக்குதல்
  rationale: எபிரெயக் கவிதையின் இறையாட்சிசார் உருவகத்தை நவீன அறிவியல் விவாதமாக மாற்றாமல் அதன் சொந்த வலியுறுத்தலைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், சங்கீதத்திற்கேற்ற கண்ணியமான கவிதை நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. ‘அணிந்திருக்கிறார்’ என்ற மறுபடிப்பு மூலத்தின் இணை அமைப்பைக் காக்கிறது; ‘தம்’ என்பது இறைவனை மரியாதையுடன் சுட்டுகிறது. இறைப் பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
