  rationale: The revision clarifies that strength is what Yahweh takes up in the girding image, uses a natural emphatic connector for אַף, and renders the final Hebrew verb with an intransitive Tamil expression matching “will not totter.” Footnote c now accurately distinguishes literal wording from cultural explanation.
