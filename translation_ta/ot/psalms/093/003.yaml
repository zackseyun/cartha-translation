source:
  edition: WLC
  text: נָשְׂא֤וּ נְהָר֨וֹת יְֽהוָ֗ה נָשְׂא֣וּ נְהָר֣וֹת קוֹלָ֑/ם יִשְׂא֖וּ נְהָר֣וֹת דָּכְיָֽ/ם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/093/003.yaml
  text: The rivers have lifted up[a], O Yahweh; the rivers have lifted up their voice[b]; the rivers lift up their pounding waves.
translation:
  language: ta
  text: 'யாவே, ஆறுகள் எழுந்தன[a];

    ஆறுகள் தங்கள் குரலை உயர்த்தின;

    ஆறுகள் தங்கள் இடித்துமோதும் அலைகளை உயர்த்துகின்றன[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஆறுகள்’ என்பதற்குப் பதிலாக ‘வெள்ளங்கள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் பொதுவாக ‘ஆறுகள்’ என்று பொருள்பட்டாலும், இங்கு கொந்தளிக்கும் நீரைக் குறிப்பதாக இருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘இடித்துமோதும் அலைகள்’ என்பதற்குப் பதிலாக ‘உடைந்து பாயும் அலைகள்’ அல்லது ‘முழக்கம்’ என்றும் மொழிபெயர்க்கலாம். இங்கு வரும் அரிய எபிரெயச் சொல் நீரின் மோதும் அல்லது முழங்கும் வலிமையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשְׂאוּ / יִשְׂאוּ
  choice: எழும்பின / எழுப்புகின்றன
  rationale: נשׂא என்பதன் அடிப்படைப் பொருளான ‘உயர்த்துதல்/எழுப்புதல்’ என்பதையும், முதல் இரண்டு நிறைவுற்ற வினைகளிலிருந்து இறுதி நிறைவுறா வினைக்குச் செல்லும் கவிதை உச்சத்தையும் இயல்பான தமிழில் காக்கிறது. முதல் கூற்றில் செயப்படுபொருள் வெளிப்படையாக இல்லாததால் ‘எழும்பின’ என வழங்கப்பட்டுள்ளது.
- source_word: נְהָרוֹת
  choice: ஆறுகள்
  rationale: இந்தப் பெயர்ச்சொல்லின் வழக்கமான, நேரடியான பொருள் ‘ஆறுகள்’. சூழலில் கொந்தளிக்கும் நீரைக் குறித்தாலும், ‘வெள்ளங்கள்’ என மாற்றாமல் மூலத்தின் சொற்பொருள் காக்கப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது பட்டப்பெயர் அல்ல, தேவனுடைய தனிப்பெயரைக் குறிக்கும் நான்கு எபிரெய எழுத்துகளாலான பெயர். நேரடி அழைப்பாக இருப்பதால் தமிழில் ‘யாவே’ என்று வழங்கப்பட்டுள்ளது.
- source_word: קוֹלָם
  choice: தங்கள் குரல்
  rationale: קוֹל என்பது ‘குரல்/ஒலி’ எனப் பொருள்படும். ‘குரல்’ என்பது ஆறுகளை மனிதப் பண்புடன் சித்தரிக்கும் கவிதைப் படிமத்தைப் பேணுகிறது.
- source_word: דָּכְיָם
  choice: தங்கள் மோதும் அலைகள்
  rationale: அரிதாக வரும் இச்சொல் நீரின் மோதுதல், முழக்கம் அல்லது உடைந்து பாயும் அலைகளைக் குறிக்கலாம். ‘மோதும் அலைகள்’ என்பது அதன் வலிமையான நீர்ப்படிமத்தை நவீன தமிழில் தெளிவாக்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட இறைப்பெயரே நேரடியாக உள்ளது. அதை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் அறியத்தக்க ஒலிபெயர்ப்பாக ‘யாவே’ என வழங்குவது மூல வேறுபாட்டைக் காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் வாசிக்க எளிதாகவும், சங்கீதக் கவிதைக்குரிய கண்ணியமும் மூன்று முறை வரும் ‘ஆறுகள்’ என்ற மறுமொழியின் ஓசையும் நிலைக்கவும் வடிவமைக்கப்பட்டது. இறுதி வரியில் நிகழ்காலம் பயன்படுத்தப்பட்டு எபிரெயக் கவிதையின் உச்சநிலை இயக்கம் காக்கப்பட்டுள்ளது.
