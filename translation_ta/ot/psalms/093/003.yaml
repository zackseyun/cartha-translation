review_pass:
  verdict: revise
  source_fidelity: The threefold repetition of “rivers” and the direct address to Yahweh are retained. However, the first occurrence of נָשְׂאוּ is rendered by the somewhat literary and less idiomatic “எழும்பின”; “எழுந்தன” is clearer modern Tamil while retaining the objectless, poetic sense of the Hebrew. The final line appropriately reflects the climactic imperfect with a present form and conveys the rare דָּכְיָם as forceful waves.
  naturalness: “எழுந்தன” is more natural in modern standard Tamil than “எழும்பின.” The parallel lineation and repeated “ஆறுகள்” provide a dignified psalmic cadence. “தங்கள் மோதும் அலைகள்” is understandable, though “தங்கள் இடித்துமோதும் அலைகள்” more clearly expresses the pounding/crashing force.
  terminology: “யாவே” is an appropriate Tamil transliteration of the divine name in direct address. “ஆறுகள்” correctly represents the ordinary lexical sense of נְהָרוֹת. The notes preserve legitimate alternatives without presenting a disputed interpretation as certain.
  issues:
  - severity: low
    issue: The first verb “எழும்பின” is not the most natural modern-standard Tamil form.
    rationale: The Hebrew has an objectless use of “lift up,” and Tamil “எழுந்தன” conveys the poetic rising of the rivers more idiomatically without supplying an object.
  - severity: low
    issue: The final phrase can state the crashing force of דָּכְיָם more explicitly.
    rationale: “இடித்துமோதும் அலைகள்” retains the draft’s explanatory rendering as waves while better conveying the rare noun’s pounding/crashing sense.
