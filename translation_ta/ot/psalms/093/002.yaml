source:
  edition: WLC
  text: נָכ֣וֹן כִּסְאֲ/ךָ֣ מֵ/אָ֑ז מֵֽ/עוֹלָ֣ם אָֽתָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/093/002.yaml
  text: Your throne is established from of old[a]; you are from everlasting.
translation:
  language: ta
  text: உமது அரியணை தொன்றுதொட்டு நிலைபெற்றிருக்கிறது[a]; நீர் நித்தியத்திலிருந்தே இருக்கிறீர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உமது அரியணை பண்டைக் காலத்திலிருந்தே உறுதியாக உள்ளது; நீர் நித்தியத்திலிருந்தே இருக்கிறீர்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: נָכוֹן
  choice: நிலைபெற்றிருக்கிறது
  rationale: இந்த வடிவம் உறுதியாக நிறுவப்பட்டு நிலைத்திருக்கும் நிலையைக் குறிக்கிறது. தமிழ் நிறைவுநிலை வினை அந்த நிலைத்த தன்மையையும் அதற்கு முந்திய நிறுவுதலையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כִּסְאֲךָ
  choice: உமது அரியணை
  rationale: כִּסֵּא என்பதன் வழக்கமான பொருள் ‘அரியணை’; இரண்டாம் நபர் ஒருமை உரிமை விகுதி ‘உமது’ என நேரடியாகக் கொடுக்கப்பட்டுள்ளது.
- source_word: מֵאָז
  choice: தொன்றுதொட்டு
  rationale: இச்சூழலில் இது ஒரு அண்மைக் காலப் புள்ளியைக் காட்டாமல் மிகப் பழமையான காலத்திலிருந்து என்பதைக் குறிக்கிறது. ‘தொன்றுதொட்டு’ கவிதைநயத்தையும் காலத் தொலைவையும் இயல்பான தமிழில் காக்கிறது.
- source_word: מֵעוֹלָם
  choice: நித்தியத்திலிருந்தே
  rationale: தேவனைப் பற்றிய இச்சூழலில் עוֹלָם எல்லையற்ற முற்பட்ட காலத்தையோ நித்தியத்தையோ குறிக்கிறது. ‘நித்தியத்திலிருந்தே’ என்பது ‘இருந்து’ என்ற எபிரெய கால நோக்கையும் காக்கிறது.
- source_word: אָתָּה
  choice: நீர் … இருக்கிறீர்
  rationale: தனித்து நிற்கும் இரண்டாம் நபர் ஒருமைப் பெயர்ச்சொல் முன்வரும் காலச் சொற்றொடருடன் பயனிலையாக அமைகிறது; இயல்பான மரியாதைத் தமிழில் இணைப்புவினை வெளிப்படையாகத் தரப்பட்டுள்ளது.
theological_decisions:
- issue: தேவனுடைய இருப்பைக் குறிக்கும் கால மொழி
  choice: நீர் நித்தியத்திலிருந்தே இருக்கிறீர்
  alternative: நீர் என்றென்றும் இருக்கிறீர்
  rationale: தேர்ந்த வாசகம் தேவனுடைய எல்லையற்ற முற்பட்ட இருப்பை உறுதிப்படுத்துவதோடு, மூலத்தில் உள்ள ‘இருந்து’ என்ற கால நோக்கையும் காக்கிறது. பின்னாளைய மெய்யியல் சொற்பயன்பாட்டை வசனத்திற்குள் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைக்குரிய கண்ணியத்துடன் மொழிபெயர்க்கப்பட்டுள்ளது. ‘தொன்றுதொட்டு’ உயர்ந்தாலும் பொதுவாகப் புரியும் சொல்; ‘அரியணை’ அரசாட்சிசார் உருவகத்தைத் தெளிவாகக் காக்கிறது. தேவனை நோக்கும் ஒருமை மரியாதை வடிவங்களான ‘உமது’, ‘நீர்’, ‘இருக்கிறீர்’ தொடர்ந்து பயன்படுத்தப்பட்டுள்ளன.
