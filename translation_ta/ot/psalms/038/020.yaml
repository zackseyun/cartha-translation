    text: 'இன்னும் சொற்சார்ந்து: “நான் நன்மையை நாடுவதற்குக் கைம்மாறாக அவர்கள் என்னை எதிர்க்கிறார்கள்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמְשַׁלְּמֵי
  choice: செய்கிறவர்கள்
  rationale: שלם என்ற வினையின் பங்கேற்பு வடிவம், பதிலுக்கு ஒன்றைத் திருப்பிச் செய்பவர்களைக் குறிக்கிறது. தொடர்ந்து வரும் ‘பதிலாக’ என்பதுடன் சேர்ந்து, தமிழில் ‘செய்கிறவர்கள்’ என்பது இயல்பாகவும் பரிமாற்றப் பொருளைத் தெளிவாகவும் தருகிறது.
- source_word: רָעָה
  choice: தீமை
  rationale: ‘நன்மைக்குப் பதிலாகத் தீமை’ என்ற எதிர்மறை இணைப்பில், சொல்லின் அறநெறி வலிமையை ‘தீமை’ காக்கிறது.
- source_word: תַּחַת
  choice: பதிலாக / …வதால்
  rationale: முதல் இடத்தில் இது பரிமாற்றத்தைச் சுட்டுவதால் ‘பதிலாக’ என மொழிபெயர்க்கப்பட்டுள்ளது. இரண்டாவது இடத்தில் அதே கருத்துறவு இயல்பான தமிழில் காரணவாக்கியமாக ‘…வதால்’ எனத் தரப்பட்டுள்ளது; அதன் சொற்சார்ந்த அமைப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: טוֹבָה
  choice: நன்மை
  rationale: செய்யப்பட்ட அல்லது பெற்ற நலனைப் பொதுவாகக் குறிக்கும் இச்சொல், ‘தீமை’ என்பதுடனான சுருக்கமான முரண்பாட்டைத் தக்கவைக்கிறது.
- source_word: יִשְׂטְנוּנִי
  choice: என்னை எதிர்க்கிறார்கள்
  rationale: שטן என்ற வினையின் ‘எதிர்த்தல், பகைவராகச் செயல்படுதல்’ என்ற பொருளை இது தருகிறது; சட்டரீதியான ‘குற்றஞ்சாட்டுதல்’ அல்லது உணர்ச்சியை வலுப்படுத்தும் ‘வெறுத்தல்’ ஆகியவற்றைத் தேவையின்றி சேர்க்கவில்லை.
- source_word: רְדֹפִי
  choice: நான் … நாடிப் பின்தொடர்வதால்
  rationale: רדף என்பதன் அடிப்படைப் பொருளான தீவிரமாகப் பின்தொடர்தலைக் காக்க ‘நாடிப் பின்தொடர்’ பயன்படுத்தப்பட்டுள்ளது; பெயரெச்சத் தொடர் தமிழில் இயல்பான காரணவாக்கியமாக அமைக்கப்பட்டுள்ளது.
- source_word: טוֹב
  choice: நன்மையை
  rationale: பெயர்ச்சொல் போன்று செயல்படும் இவ்வடைமொழி, தமிழில் ‘நன்மை’ என இயல்பாகவும் தெளிவாகவும் தரப்படுகிறது.
theological_decisions:
- issue: இரண்டாவது תַּחַת தொடரின் கருத்துறவு
  choice: நான் நன்மையை நாடிப் பின்தொடர்வதால்
  alternative: நான் நன்மையை நாடிப் பின்தொடர்வதற்குப் பதிலாக / நான் நன்மையைப் பின்தொடர்வதற்குக் கைம்மாறாக
  rationale: இரண்டாவது תַּחַת எதிரிகளின் செயல் சங்கீதக்காரர் நன்மையைப் பின்தொடர்வதற்கான எதிர்வினை என்பதைக் காட்டுகிறது. முதன்மை உரையில் காரணத் தொடர்பு இயல்பான தமிழில் தரப்பட்டுள்ளது; எபிரெயச் சொல்லமைப்பின் பரிமாற்ற நிழற்பொருள் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘நாடிப் பின்தொடர்’ என்பது רדף சொல்லின் தீவிரத்தையும் இலக்குநோக்கிய செயற்பாட்டையும் காக்கிறது; அடிக்குறிப்பு எபிரெய மூலத்தின் பரிமாற்ற அமைப்பை வெளிப்படுத்துகிறது.
