translation:
  language: ta
  text: நன்மைக்குப் பதிலாகத் தீமை செய்கிறவர்கள், நான் நன்மையை நாடுவதால் என்னை எதிர்க்கிறார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
