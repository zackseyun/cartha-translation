- from: ஏனெனில் நான், “இல்லையெனில் அவர்கள் என்னைக் குறித்து மகிழ்வார்கள்; என் கால் தடுமாறும்போது எனக்கு எதிராகப் பெருமை பேசுவார்கள்” என்று சொன்னேன்.
  to: ஏனெனில், “அவர்கள் என்னைக் கண்டு மகிழ்ந்துவிடக் கூடாது; என் கால் தடுமாறும்போது அவர்கள் எனக்கு எதிராகப் பெருமை பேசுவார்கள்” என்று நான் சொன்னேன்.
