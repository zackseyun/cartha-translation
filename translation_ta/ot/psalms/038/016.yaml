  text: ஏனெனில், “அவர்கள் என்னைக் கண்டு மகிழ்ந்துவிடக் கூடாது; என் கால் தடுமாறும்போது அவர்கள் எனக்கு எதிராகப் பெருமை பேசுவார்கள்” என்று நான் சொன்னேன்.
