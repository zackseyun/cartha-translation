lexical_decisions:
- source_word: פֶּן
  choice: இல்லையெனில்
  rationale: சூழலில் அஞ்சப்படும் விளைவைக் குறிக்கிறது; நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: יִשְׂמְחוּ לִי
  choice: அவர்கள் என்னைக் குறித்து மகிழ்வார்கள்
  rationale: பாடகருக்கு நேரும் தீங்கைப் பார்த்து எதிரிகள் மகிழ்வதைக் குறிக்கும் எபிரெயச் சொல்லமைப்பைப் பாதுகாக்கிறது.
- source_word: בְּמוֹט רַגְלִי
  choice: என் கால் தடுமாறும்போது
  rationale: מוֹט என்பதன் நிலைகுலைதல் அல்லது சறுக்குதல் என்ற உருவகத்தை இயல்பான தமிழில் தருகிறது.
- source_word: עָלַי הִגְדִּילוּ
  choice: எனக்கு எதிராகப் பெருமை பேசுவார்கள்
  rationale: சொல்லின் அடிப்படை ‘தங்களைப் பெரியவர்களாக்குதல்’ என்ற கருத்தை, இச்சூழலில் எதிரிக்கு எதிராக இறுமாப்புடன் பெருமை பேசுதல் என இயல்பாக வெளிப்படுத்துகிறது.
