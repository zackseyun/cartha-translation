translation:
  language: ta
  text: நான் வளைந்துபோயிருக்கிறேன்; மிகவும் தாழ்ந்துபோயிருக்கிறேன்; நாள் முழுவதும் துக்கத்துடன்[a] நடமாடுகிறேன்.
  philosophy: optimal-equivalence
