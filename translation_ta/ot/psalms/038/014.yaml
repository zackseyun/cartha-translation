lexical_decisions:
- source_word: וָאֱהִי
  choice: நான் ... ஆனேன்
  rationale: היה என்பதன் Qal wayyiqtol முதலாம் நபர் ஒருமை வடிவம். ஒப்பீட்டுச் சூழலில் ஏற்பட்ட நிலையை இயல்பாகக் காட்ட “ஆனேன்” என்று மொழிபெயர்க்கப்பட்டது; தொடக்க வாவ் தமிழின் வாக்கிய ஓட்டத்தில் தனியாகச் சேர்க்கப்படவில்லை.
- source_word: כְּאִישׁ
  choice: ஒரு மனிதனைப்போல்
  rationale: אִישׁ என்பது ஆண்பால் ஒருமைச் சொல்; ஒப்பீட்டையும் ஒருமையையும் தெளிவாக வைத்திருக்க “ஒரு மனிதனைப்போல்” என வழங்கப்பட்டது.
- source_word: אֲשֶׁר לֹא שֹׁמֵעַ
  choice: கேட்காத
  rationale: שׁמע என்பதற்கு “கேள்” அல்லது “செவிகொடு” என்ற இரு நுணுக்கங்களும் இருக்கலாம். இயலாமையை உரையில் சேர்க்காமல், நேரடியானதும் இங்குள்ள மௌனத்துடன் பொருந்துவதுமான “கேட்காத” தேர்ந்தெடுக்கப்பட்டது.
- source_word: וְאֵין בְּפִיו
  choice: அவனுடைய வாயில் ... எதுவும் இல்லை
  rationale: எபிரெய existential אֵין மற்றும் “அவனுடைய வாயில்” என்ற உடல் சார்ந்த பேச்சு உருவகத்தைத் தக்கவைக்கிறது. தமிழில் பன்மைச் சொல்லுடன் இயல்பாக அமைய “எதுவும் இல்லை” பயன்படுத்தப்பட்டது.
- source_word: תּוֹכָחוֹת
  choice: மறுப்புரைகள்
  rationale: இந்தப் பன்மைச் சொல் கண்டனங்கள், வாதங்கள், திருத்தும் சொற்கள் அல்லது எதிர்த்துப் பேசும் பதில்களைக் குறிக்கலாம். குற்றஞ்சாட்டுவோருக்கு மௌனமாக இருப்பது என்ற சூழலில் “மறுப்புரைகள்” பொருத்தமானது; பிற சாத்தியங்களை அடிக்குறிப்பு பாதுகாக்கிறது.
