  text: For my loins are filled with burning[b][a], and there is no soundness in my flesh.
translation:
  language: ta
  text: ஏனெனில் என் இடுப்புப் பகுதி[a] எரிச்சலால் நிறைந்திருக்கிறது[b]; என் உடலில் நலமான இடமே இல்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இடுப்புப் பகுதி” என்பதற்கான எபிரெயச் சொல் பக்கவாட்டு, இடுப்பு, அல்லது கீழ்முதுகுப் பகுதியையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “எரிச்சல்” என மொழிபெயர்க்கப்பட்ட எபிரெயச் சொல் அரிதானதும் பொருள் தெளிவற்றதுமாகும்; இதை “கடும் சூடு,” “வீக்கம்,” அல்லது “எரியும் வேதனை” என்றும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: சுற்றியுள்ள புலம்பலுக்கான காரணத்தை அறிமுகப்படுத்தும் விளக்க இணைப்பாக இயல்பாக அமைகிறது.
- source_word: כְסָלַי
  choice: என் இடுப்புப் பகுதி
  rationale: כֶּסֶל குறிக்கும் இடுப்பு, பக்கவாட்டு, கீழ்முதுகு ஆகியவற்றை உள்ளடக்கும் உடற்பகுதியை, பாலுறுப்புகளாக மிகக் குறுக்கிப் பொருள்கொள்ளாமல் இயல்பாகக் காட்டுகிறது.
- source_word: מָלְאוּ
  choice: நிறைந்திருக்கிறது
  rationale: מלא என்பதன் நிறைந்த நிலை அல்லது அதன் விளைவாகத் தொடரும் நிலையைக் காக்கிறது; தமிழில் ஒருமை உடற்பகுதியோடு இயல்பாக ஒத்திசைகிறது.
- source_word: נִקְלֶה
  choice: எரிச்சல்
  rationale: இச்சொல் அரிதும் பொருள் தெளிவற்றதுமாகும். உடல் வேதனையின் சூழலில் சூடு, எரிச்சல் அல்லது வீக்கத்தைச் சுட்டும் பொருள் வாய்ப்புள்ளது; மூலத்தில் இல்லாத ‘புண்கள்’ என்பதைச் சேர்க்காமல் தெளிவின்மையை அடிக்குறிப்பில் காக்கிறது.
- source_word: וְאֵין
  choice: இல்லை
  rationale: இருப்பின்மையைக் குறிக்கும் எபிரெய அமைப்பை இயல்பான தமிழில் தருகிறது.
- source_word: מְתֹם
  choice: நலமான இடம்
  rationale: உடல் சூழலில் முழுமை, சேதமின்மை அல்லது ஆரோக்கியநிலையைக் குறிக்கிறது. ‘நலமான இடமே இல்லை’ என்பது உடலின் எந்தப் பகுதியும் பாதிப்பின்றி இல்லை என்ற கருத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בִּבְשָׂרִי
  choice: என் உடலில்
  rationale: בשר இங்கு இறையியல் உருவகமாக அல்லாமல் உடல் வேதனையைச் சுட்டுகிறது. தமிழில் ‘உடல்’ என்பது இச்சூழலின் நேரடியான, இயல்பான சொல்லாகும்.
theological_decisions:
- issue: உடல் வேதனையை விவரிக்கும் சங்கீதத்தில் בשרי என்பதன் பொருள்
  choice: நேரடியான உடல்
  alternative: என் மாம்சத்தில்
  rationale: இடுப்புப் பகுதியின் வேதனையும் உடல் நலமின்மையும் இணையாக வருவதால், இங்கு உருவக அல்லது தனிப்பட்ட இறையியல் பொருளைச் சேர்க்காமல் சரீர உடலைக் குறிக்கும் வாசிப்பே சூழலுக்கு ஏற்றது.
- issue: נִקְלֶה என்ற தெளிவற்ற சொல்லின் தன்மை
  choice: உடல் சார்ந்த ‘எரிச்சல்’ என்ற வாசிப்பு; மாற்றுகளை அடிக்குறிப்பில் பாதுகாத்தல்
  alternative: அவமதிப்பு அல்லது இழிவு
  rationale: முழு வசனமும் உடல் பாதிப்பை விவரிப்பதால் உடல் சார்ந்த வாசிப்பு அதிகம் பொருந்துகிறது; எனினும் சொல்லின் அரிதான தன்மையால் மிகத் துல்லியமான நோயறிதலை உரையில் புகுத்தவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. எபிரெய வசனத்தின் இரு உடல் சார்ந்த கூறுகளும் பாதுகாக்கப்பட்டுள்ளன; தெளிவற்ற נִקְלֶה என்பதற்கு மூலத்தில் இல்லாத ‘புண்கள்’ சேர்க்கப்படவில்லை. ஒரே அடிக்குறிப்பில் தொடர்புடைய இரு சொற்பொருள் மாற்றுகளும் சுருக்கமாகத் தரப்பட்டுள்ளன.
