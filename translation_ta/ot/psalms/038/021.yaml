  yaml_path: translation/ot/psalms/038/021.yaml
  text: Do not forsake me[a], O Yahweh my God; do not be far from me.
translation:
  language: ta
  text: யாவே, என் கடவுளே, என்னைக் கைவிடாதேயும்; என்னிடமிருந்து தொலைவில் இருக்காதேயும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל
  choice: …ஆதேயும்
  rationale: வேண்டுதல் சூழலில் வரும் எபிரேய மறுப்புத் துகள்; தமிழில் மரியாதையும் மன்றாட்டின் நேரடித்தன்மையும் காக்க எதிர்மறை வேண்டுகோள் வடிவம் பயன்படுத்தப்பட்டது.
- source_word: תַּעַזְבֵנִי
  choice: என்னைக் கைவிடாதேயும்
  rationale: עזב என்பதன் ‘விட்டுவிடுதல், கைவிடுதல்’ என்ற பொருளையும் புலம்பல் சங்கீதத்தின் உணர்வுச் செறிவையும் ‘கைவிடு’ இயல்பாகத் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எழுத்துத் தெய்வீகப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் அறியப்பட்ட ஒலிபெயர்ப்பான ‘யாவே’ என்று வழங்குகிறது.
- source_word: אֱלֹהַי
  choice: என் கடவுளே
  rationale: முதலாம் நபர் ஒருமை உடைமைப் பின்னொட்டுடன் உள்ள சொல்லை நேரடியாகவும் இயல்பான விளிவேற்றுமையிலும் தருகிறது.
- source_word: תִּרְחַק
  choice: விலகியிராதேயும்
  rationale: רחק என்பதன் ‘தொலைவில் இருத்தல்’ என்ற நிலையை, தமிழில் ஒருவரிடமிருந்து தூரமாய் இருப்பதைக் குறிக்கும் இயல்பான ‘விலகியிரு’ வடிவில் தருகிறது; திட்டமிட்டுப் புறக்கணித்தல் என்ற கூடுதல் கருத்தைச் சேர்க்கவில்லை.
- source_word: מִמֶּנִּי
  choice: என்னைவிட்டு
  rationale: ‘என்னிடமிருந்து’ என்ற உறவை ‘விலகியிரு’ என்பதுடன் இயல்பாக இணைக்கும் தமிழ் வடிவம்.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட தெய்வீகப் பெயரே உள்ளது. அதை பொதுவான பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்ப்பது மூலச் சான்றைத் தெளிவாகப் பாதுகாக்கிறது; ‘யாவே’ நவீனத் தமிழில் புரிந்துகொள்ளக்கூடிய வடிவம்.
translation_notes:
  register: நவீனத் தரத் தமிழில், சங்கீத மன்றாட்டிற்கு ஏற்ற கண்ணியமான நடை. ‘கைவிடாதேயும்’ மற்றும் ‘விலகியிராதேயும்’ என்ற இணையான வேண்டுகோள் வடிவங்கள் எபிரேயக் கவிதையின் இரட்டைக் கட்டமைப்பைக் காக்கின்றன.
