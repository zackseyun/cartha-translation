lexical_decisions:
- source_word: מִזְמוֹר
  choice: சங்கீதம்
  rationale: இது இசையுடன் தொடர்புடைய வழிபாட்டுப் பாடலைக் குறிக்கும் வழக்கமான தலைப்புச் சொல். தமிழில் ‘சங்கீதம்’ என்பது சங்கீத நூலின் தலைப்புகளில் நிலைபெற்ற, பொருத்தமான வகைப்பெயர்.
- source_word: לְדָוִד
  choice: தாவீதின்
  rationale: לְ என்ற முன்னொட்டு ஆசிரியத்துவம், தொடர்பு, உரிமை அல்லது அர்ப்பணிப்பு ஆகியவற்றைக் குறிக்கக்கூடும். ‘தாவீதின்’ என்பது ‘தாவீது இயற்றியது’ அல்லது ‘தாவீதுக்காக’ என்று ஒரே பொருளை மட்டும் நிர்ணயிக்காமல் அந்தச் சுருக்கமான தெளிவின்மையை ஓரளவு காக்கிறது.
- source_word: לְהַזְכִּיר
  choice: நினைவுகூருவதற்காக
  rationale: זכר என்பதன் ஹிஃபில் வினையெச்ச வடிவம் இங்கே சங்கீதத்தின் நோக்கத்தைக் குறிக்கும் தலைப்புச் சொற்றொடராக உள்ளது. ‘நினைவுகூருவதற்காக’ என்பது யார் நினைவுகூருகிறார் அல்லது இது எந்தச் சடங்கு முறையைக் குறிக்கிறது என்பதைத் தேவையின்றி நிர்ணயிக்காமல் இயல்பான தமிழில் பரந்த பொருளைக் காக்கிறது.
