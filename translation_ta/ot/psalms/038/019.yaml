  yaml_path: translation/ot/psalms/038/019.yaml
  text: And my enemies are alive and strong[a], and those who hate me falsely are many.
translation:
  language: ta
  text: என் பகைவர்கள் உயிருடன் இருக்கிறார்கள், வலிமை பெற்றிருக்கிறார்கள்; பொய்யாக[a] என்னை வெறுப்பவர்கள் பலர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “காரணமின்றி என்னை வெறுப்பவர்கள் பலர்.” எபிரெயச் சொல் சொல்லர்த்தமாக “பொய்/பொய்மை” என்று பொருள்படும்; அது அவர்களுடைய வெறுப்பு பொய்யானது என்பதையோ, அதற்குத் தகுந்த காரணம் இல்லை என்பதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹיְבַי
  choice: என் பகைவர்கள்
  rationale: தனிப்பட்ட எதிரிகளைக் குறிக்கும் எபிரெயப் பெயர்ச்சொல்லின் நேரடியான, இயல்பான தமிழ் வடிவம்.
- source_word: חַיִּים
  choice: உயிருடன் இருக்கிறார்கள்
  rationale: பகைவர்கள் உயிரோடிருப்பதைத் தெளிவாகக் கூறுகிறது; சங்கீதக்காரரின் தளர்ந்த நிலையோடு உள்ள மறைமுக முரண்பாட்டையும் தக்கவைக்கிறது.
- source_word: עָצֵמוּ
  choice: வலிமை பெற்றிருக்கிறார்கள்
  rationale: வலிமை அடைதல் அல்லது வலுப்பெறுதல் என்ற வினைநிலையைத் தக்கவைத்து, அதன் தற்போதைய விளைவையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: רַבּוּ
  choice: பலர்
  rationale: அவர்கள் எண்ணிக்கையில் மிகுந்திருப்பதே இங்கு முதன்மையான கருத்து; சுருக்கமான நவீன தமிழில் இது இயல்பாக உள்ளது.
- source_word: שֹׂנְאַי
  choice: என்னை வெறுப்பவர்கள்
  rationale: பெயர்ச்சொல் போன்று செயல்படும் எபிரெயப் பங்கேற்பு வடிவத்தின் வினைத் தன்மையைத் தக்கவைக்கிறது.
- source_word: שָׁקֶר
  choice: பொய்யாக
  rationale: ‘பொய்/பொய்மை’ என்ற அடிப்படைப் பொருளைத் தக்கவைத்து, அவர்களுடைய வெறுப்பின் பொய்மையையோ ஆதாரமின்மையையோ தேவையின்றித் தீர்மானிக்காமல் விடுகிறது.
