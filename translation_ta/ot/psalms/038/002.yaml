  yaml_path: translation/ot/psalms/038/002.yaml
  text: For your arrows have sunk into me[b][a], and your hand has come down on me.
translation:
  language: ta
  text: ஏனெனில், உமது அம்புகள் எனக்குள் பதிந்துள்ளன[a]; உமது கை[b] என்மேல் இறங்கியுள்ளது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘எனக்குள் இறங்கியுள்ளன’ என்றும் மொழிபெயர்க்கலாம்; சூழலின்படி ‘என்னைத் துளைத்துள்ளன’ அல்லது ‘என்னைத் தாக்கியுள்ளன’ என்றும் பொருள் கொள்ளலாம். எபிரெய வினைச்சொல் அடிப்படையில் ‘கீழே செல்லுதல்’ அல்லது ‘இறங்குதல்’ என்று பொருள்படும்; இங்கு அம்புகள் சங்கீதக்காரருக்குள் சென்று பதிந்திருப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்கு சொல், ‘உமது கை.’ இது கடவுளின் செயற்படும் வல்லமையைக் குறிக்கும் எபிரெய உருவகம்; இங்கு துன்பத்தின் சூழலில் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய புலம்பலுக்கான காரணத்தை அறிமுகப்படுத்தும் எபிரெய காரண இடைச்சொல்லின் வலிமையை இயல்பான தமிழில் காக்கிறது.
- source_word: חִצֶּיךָ
  choice: உமது அம்புகள்
  rationale: இரண்டாம் நபர் ஒருமை உரிமை விகுதியுடன் உள்ள பன்மைப் பெயர்ச்சொல்லை நேரடியாக மொழிபெயர்த்து, தெய்வீகத் துன்புறுத்தலின் போரியல் உருவகத்தைக் காக்கிறது.
- source_word: נִחֲתוּ בִי
  choice: எனக்குள் ஆழப் பதிந்துள்ளன
  rationale: נחת என்பதன் அடிப்படை இறங்குதல் சார்ந்த பொருளையும், அம்புகள் ஒருவருக்குள் சென்று தங்கியிருக்கும் சூழல்சார் படிமத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘துளைத்தன’ என்று விளக்கமாக மட்டும் சுருக்கவில்லை.
- source_word: וַתִּנְחַת עָלַי
  choice: என்மேல் இறங்கியுள்ளது
  rationale: அதே נחת வேரின் கீழ்நோக்கிய இயக்கத்தையும் அழுத்தத்தையும் இங்கு நேரடியாகக் காக்கிறது; நிகழ்ந்த செயல் இப்போதும் விளைவுடையதாக இருப்பதை நிறைவுநிலை வடிவம் உணர்த்துகிறது.
- source_word: יָדֶךָ
  choice: உமது கை
  rationale: கடவுளின் செயற்படும் வல்லமையைக் குறிக்கும் மனித உருவக மொழியை ‘வல்லமை’ அல்லது ‘தீர்ப்பு’ என்று விளக்கிப் பதிலிடாமல் அப்படியே காக்கிறது.
theological_decisions:
- issue: கடவுளின் செயலுக்கான மனித உருவக மொழி
  choice: ‘உமது கை’ என்பதை நேரடியாகத் தக்கவைத்தல்
  alternative: ‘உமது வல்லமை’ அல்லது ‘உமது தீர்ப்பு’
  rationale: மூல எபிரெயம் தெளிவான உடல்சார் உருவகத்தைப் பயன்படுத்துகிறது. அதன் பொருளை ஒரு குறிப்பிட்ட இறையியல் விளக்கமாக மாற்றாமல், மூலத்தின் உருவகத்தையும் பதற்றத்தையும் மொழிபெயர்ப்பு காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் சங்கீதத்திற்கேற்ற கண்ணியமான கவிதைநடையிலும் அமைக்கப்பட்டுள்ளது. கடவுளை நோக்கிய உரையில் மரியாதை ஒருமையான ‘உமது’ பயன்படுத்தப்பட்டுள்ளது. இரு அரையடிகளிலும் கீழ்நோக்கிய தாக்கத்தின் படிமம் காக்கப்பட்டுள்ளது; முதல் அரையடியில் இயல்பான தமிழ் அம்புப் படிமத்திற்காக ‘ஆழப் பதிந்துள்ளன’ தேர்ந்தெடுக்கப்பட்டு, சொற்படியான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
