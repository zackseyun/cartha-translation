    reason: חַבּוּרֹתַי என்பது புண்கள் மட்டுமன்றி அடிபட்டதால் ஏற்பட்ட காயங்கள் அல்லது தழும்புகளையும் குறிக்கலாம்.
lexical_decisions:
- source_word: הִבְאִישׁוּ
  choice: நாற்றமெடுத்து
  rationale: இந்த வினை அருவருப்பான நாற்றம் உண்டாவதைக் குறிக்கிறது. ‘நாற்றமெடுத்து’ என்பது உடல் புண்களின் நிலையை இயல்பாகவும் தெளிவாகவும் எடுத்துரைக்கிறது.
- source_word: נָמַקּוּ
  choice: அழுகிப்போயின
  rationale: இச்சொல் அழுகுதல், சிதைதல், மெலிந்து போதல் ஆகிய பொருள்களைக் கொண்டது. புண்களைப் பற்றிய இச்சூழலில் ‘அழுகிப்போயின’ அதன் உடல் சிதைவைக் தெளிவாகக் காட்டுகிறது.
- source_word: חַבּוּרֹתַי
  choice: என் புண்கள்
  rationale: இப்பெயர்ச்சொல் அடிகாயம், வீக்கம், தழும்பு அல்லது காயத்தைக் குறிக்கலாம். நாற்றமும் அழுகலும் கூறப்படும் சூழலில் ‘புண்கள்’ என்பது நவீனத் தமிழில் இயல்பானதும் பொருத்தமானதும் ஆகும்.
- source_word: מִפְּנֵי
  choice: என் மூடத்தனத்தினால்
  rationale: இங்கு முன்னிடைச்சொல் காரணத்தைக் குறிக்கிறது. ‘-னால்’ என்ற வேற்றுமை உருபு அந்தக் காரணத் தொடர்பைச் சுருக்கமாகவும் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: אִוַּלְתִּי
  choice: என் மூடத்தனம்
  rationale: இச்சொல் சாதாரண அறிவின்மையை மட்டும் அல்லாமல் ஒழுக்கச் சார்புள்ள மதிகேட்டையும் குறிக்கக்கூடும். ‘மூடத்தனம்’ அந்தப் பொருள் பரப்பைத் தேவையின்றி குறுக்காமல் இயல்பாகக் காக்கிறது.
theological_decisions:
- issue: துன்பத்துக்கும் சொந்த மூடத்தனத்துக்கும் இடையிலான காரணத் தொடர்பு
  choice: என் மூடத்தனத்தினால்
  alternative: என் மதிகேட்டின் காரணமாக
  rationale: எபிரெய உரை சங்கீதக்காரரின் உடல் நிலையை அவருடைய சொந்த மூடத்தனத்துடன் நேரடியாக இணைக்கிறது. இந்த மொழிபெயர்ப்பு அந்தத் தொடர்பைக் காக்கிறது; ஆனால் எல்லாத் துன்பங்களுக்கும் இதே காரணம் என்று விரிவுபடுத்துவதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் சங்கீதத்தின் தீவிரமான உடல் உருவகத்தை மங்கச் செய்யாமலும் மொழிபெயர்க்கப்பட்டது. காரணத்தை வலியுறுத்தும் ‘என் மூடத்தனத்தினால்’ இயல்பான தமிழ் சொல்வரிசைக்காக முன்வைக்கப்பட்டுள்ளது.
