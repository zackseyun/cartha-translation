lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டப்பெயராக மாற்றாமல், எபிரெய உச்சரிப்புக்கு நெருக்கமான தமிழெழுத்துப் பெயர்ப்பாக வழங்குகிறது.
- source_word: אַל
  choice: —ஆதீர்
  rationale: வேண்டுதலில் வரும் எபிரெயத் தடைவினையை, தமிழில் மரியாதையுடனான எதிர்மறை ஏவல் விகுதியாக இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּקֶצְפְּךָ
  choice: உமது கோபத்தில்
  rationale: ב என்ற முன்னிடைச்சொல்லையும் קֶצֶף குறிக்கும் கோபம் அல்லது சினத்தையும் நேரடியாகவும் இயல்பாகவும் பாதுகாக்கிறது.
- source_word: תוֹכִיחֵנִי
  choice: என்னைக் கண்டிக்காதீர்
  rationale: יכח என்பதன் இச்சூழலிலான கடிந்துகொள்ளுதல், குற்றத்தைச் சுட்டிக்காட்டுதல் ஆகிய பொருள்களைத் தெளிவாகக் கொடுக்கிறது.
- source_word: וּבַחֲמָתְךָ
  choice: உமது கடுஞ்சினத்தில்
  rationale: חֵמָה குறிக்கும் தீவிரமான சினத்தை ‘கடுஞ்சினம்’ வெளிப்படுத்துகிறது; தொடக்கத் தடையின் ஆட்சி இரண்டாம் வினைக்கும் தொடர்வதால் தமிழில் தனியே ‘அல்லது’ சேர்க்கத் தேவையில்லை.
- source_word: תְיַסְּרֵנִי
  choice: என்னைத் தண்டித்துத் திருத்தாதீர்
  rationale: יסר என்பதில் உள்ள தண்டனை வழியான பயிற்சி அல்லது திருத்தம் என்ற இரு கூறுகளையும் இயல்பான தமிழில் இணைத்துக் காட்டுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பட்டப்பெயர் அல்ல, இறைவனின் தனிப்பெயரே உள்ளது. ஆகவே அந்த வேறுபாட்டைப் பாதுகாக்க ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டது.
- issue: தண்டித்துத் திருத்த வேண்டாமென்ற வேண்டுதலின் நோக்கம்
  choice: கோபத்திலும் கடுஞ்சினத்திலும் அவ்வாறு செய்ய வேண்டாம் என்ற மூலமொழியின் அமைப்பை அப்படியே வைத்தல்
  alternative: எந்தவிதக் கண்டிப்போ திருத்தமோ வேண்டாம் என்று பொதுமைப்படுத்துதல்
  rationale: இரு செயல்களும் ‘உமது கோபத்தில்’, ‘உமது கடுஞ்சினத்தில்’ என்ற சொற்றொடர்களால் வரையறுக்கப்படுகின்றன. வேண்டுதல் எல்லாத் தெய்வீகத் திருத்தத்தையும் நிராகரிக்கிறது என்று உரை கூறாததால் அந்த இறையியல் இழுவை தீர்மானித்து விடப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், இறைவனை நேரடியாக அழைக்கும் மன்றாட்டு நடையும் மரியாதைப் பன்மை வினைமுற்றுகளும் பயன்படுத்தப்பட்டுள்ளன. எபிரெயக் கவிதையின் இணை அமைப்பு—‘கோபம்/கடுஞ்சினம்’ மற்றும் ‘கண்டித்தல்/தண்டித்துத் திருத்துதல்’—பாதுகாக்கப்பட்டுள்ளது.
