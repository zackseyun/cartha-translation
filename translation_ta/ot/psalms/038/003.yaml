source:
  edition: WLC
  text: אֵין מְתֹ֣ם בִּ֭/בְשָׂרִ/י מִ/פְּנֵ֣י זַעְמֶ֑/ךָ אֵין שָׁל֥וֹם בַּ֝/עֲצָמַ֗/י מִ/פְּנֵ֥י חַטָּאתִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/003.yaml
  text: There is no soundness in my flesh because of your indignation[b][a]; there is no peace in my bones because of my sin.
translation:
  language: ta
  text: 'உமது கடும் சினத்தினால்[a]

    என் உடலில் நலமே இல்லை;

    என் பாவத்தினால்

    என் எலும்புகளில் அமைதியே இல்லை[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உமது சீற்றத்தினால்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘நலமே இல்லை.’
    reason: lexical_alternative
lexical_decisions:
- source_word: מְתֹם
  choice: நலம்
  rationale: இந்தப் பெயர்ச்சொல் முழுமையான, குறைவற்ற உடல்நிலையைக் குறிக்கிறது. உடல் வேதனையைப் பற்றிய இச்சூழலில், ‘நலம்’ என்பது பொருளை இயல்பான நவீன தமிழில் தருகிறது; ‘முழுமை’ இங்கு சற்றுச் செயற்கையாக ஒலிக்கும்.
- source_word: בִּבְשָׂרִי
  choice: என் உடலில்
  rationale: בשר என்பதன் நேர்ப்பொருள் ‘சதை’ அல்லது ‘மாம்சம்.’ ஆனால் இங்கு முழு உடல் நிலையைக் குறிக்கும் கவிதை வழக்காக இருப்பதால், சாதாரண வாசகருக்கு இயல்பாகவும் தெளிவாகவும் ‘என் உடலில்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: מִפְּנֵי
  choice: -னால்
  rationale: இரு இடங்களிலும் இந்த முன்னிடைச்சொல் காரணத்தைக் குறிக்கிறது. தமிழில் காரணத்தைச் சுருக்கமாகவும் இயல்பாகவும் காட்ட ‘-னால்’ பயன்படுத்தப்பட்டது.
- source_word: זַעְמֶךָ
  choice: உமது கடும் சினம்
  rationale: זעם வலிமையான கோபம் அல்லது சீற்றத்தைக் குறிக்கிறது. ‘கடும் சினம்’ அதன் தீவிரத்தைத் தக்கவைக்கிறது; சாதாரண ‘கோபம்’ என்பதைவிட வலிமையானது, அதேவேளையில் தேவையற்ற கோட்பாட்டுச் சொல்லாக்கத்தைச் சேர்ப்பதில்லை.
- source_word: שָׁלוֹם
  choice: அமைதி
  rationale: שָׁלוֹם அமைதி, நலம், முழுநிலை ஆகிய பொருள்களைக் கொண்டது. ‘எலும்புகளில்’ என்ற உடல் சார்ந்த உருவகத்துடன் இருந்தாலும், ‘அமைதி’ அதன் முதன்மையான கவித்துவச் சொல்லைத் தக்கவைக்கிறது; சூழலுக்கு ஏற்ற ‘நலம்’ என்பது அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: בַּעֲצָמַי
  choice: என் எலும்புகளில்
  rationale: எபிரெயச் சொல் நேரடியாக எலும்புகளைக் குறிக்கிறது. ஆழமான உடல் மற்றும் உள்ளார்ந்த வேதனையை வெளிப்படுத்தும் கவித்துவ உருவகத்தைத் தமிழிலும் தெளிவாகத் தக்கவைக்கிறது.
- source_word: חַטָּאתִי
  choice: என் பாவம்
  rationale: இங்கு சங்கீதக்காரரின் துன்பத்திற்குக் காரணமாகக் கூறப்படும் அவரது சொந்தப் பாவத்தைக் குறிக்கிறது. ‘என் பாவம்’ என்பது நேரடியான, இயல்பான மொழிபெயர்ப்பு.
theological_decisions:
- issue: இறைவனின் சினம், சங்கீதக்காரரின் பாவம், அவரது உடல் வேதனை ஆகியவற்றின் தொடர்பு
  choice: சங்கீதக்காரரின் உடல் துயரம் இறைவனின் கடும் சினத்தினாலும் தனது பாவத்தினாலும் ஏற்பட்டதாக வசனம் கூறும் இரு காரணத் தொடர்புகளும் நேரடியாகத் தக்கவைக்கப்பட்டுள்ளன.
  alternative: இதை எல்லா துன்பங்களையும் பற்றிய பொதுக் கோட்பாடாக அல்லாமல், இறைவனிடமிருந்து பிரிந்திருப்பதாக உணரும் ஒருவரின் கவித்துவ விளக்கமாக வாசிக்கலாம்.
  rationale: எபிரெய உரை காரணத்தை எவ்வாறு செயல்படுத்துகிறது என்பதை மேலும் விளக்கவில்லை. ஆகவே இறைவனின் சினத்தையோ தனிப்பட்ட பாவத்தையோ மென்மைப்படுத்தாமலும், எல்லா வேதனைகளுக்கும் பொருந்தும் கோட்பாடாக விரிவுபடுத்தாமலும் உரையின் இறையியல் அழுத்தம் பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய இணைநிலைக் கட்டமைப்பை வெளிப்படுத்த வரிகள் பிரிக்கப்பட்டுள்ளன. ‘உமது’ என்பது இறைவனை நோக்கிய மரியாதை ஒருமையை இயல்பாகக் காட்டுகிறது; ‘மாம்சம்’ என்ற சமயநிறம் பெற்ற சொல்லுக்குப் பதிலாக இச்சூழலில் ‘உடல்’ பயன்படுத்தப்பட்டது.
