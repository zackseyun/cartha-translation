    issue: ‘என் தலைக்குமேல் பெருகிவிட்டன’ does not translate עָבְרוּ.
    rationale: The Hebrew verb means ‘have passed over,’ evoking something going above the speaker’s head. ‘பெருகிவிட்டன’ introduces increase/multiplication, which is not stated in the source and weakens the concrete spatial metaphor.
