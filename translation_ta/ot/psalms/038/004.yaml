source:
  edition: WLC
  text: כִּ֣י עֲ֭וֺנֹתַ/י עָבְר֣וּ רֹאשִׁ֑/י כְּ/מַשָּׂ֥א כָ֝בֵ֗ד יִכְבְּד֥וּ מִמֶּֽ/נִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/004.yaml
  text: For my iniquities have gone over my head; like a heavy burden[a], they are too heavy for me.
translation:
  language: ta
  text: ஏனெனில், என் அக்கிரமங்கள் என் தலைக்குமேல் கடந்துபோயின; கனமான சுமையைப்போல்[a] அவை என்னால் தாங்க முடியாதபடி பாரமாயின.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘என் குற்றப்பழி’; இங்கு ‘அக்கிரமங்கள்’ என மொழிபெயர்க்கப்பட்டுள்ள எபிரெயச் சொல், அக்கிரமத்தையும் அதனால் ஏற்படும் குற்றப்பழியையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: புலம்பலுக்கான காரணத்தை அறிமுகப்படுத்தும் எபிரெய இணைப்புச் சொல்லின் விளக்க வலிமையை இயல்பான தமிழில் காக்கிறது.
- source_word: עֲוֺנֹתַי
  choice: என் அக்கிரமங்கள்
  rationale: עָוֹן குற்றச்செயல், குற்றநிலை, அதன் விளைவு ஆகியவற்றைக் குறிக்கலாம். மனந்திரும்புதல் சார்ந்த சூழலில் ஒழுக்கக் குற்றங்களின் கனத்தை முதன்மைப்படுத்தும் சொல் இது; ‘குற்றப்பழி’ என்ற சாத்தியம் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: עָבְרוּ רֹאשִׁי
  choice: என் தலைக்குமேல் பெருகிவிட்டன
  rationale: தலைக்கு மேலாக உயர்ந்து மூழ்கடிக்கும் வெள்ளநீரின் தெளிவான உருவகத்தைப் பாதுகாக்கிறது; வெறும் ‘என்னை மேற்கொண்டன’ என்று கருத்தை மட்டும் கூறாமல் மூலத்தின் படிமத்தைக் காக்கிறது.
- source_word: כְּמַשָּׂא כָבֵד
  choice: கனமான சுமையைப்போல்
  rationale: மַשָּׂא என்பதன் சுமை/பாரம் என்ற உடல் சார்ந்த உருவகத்தையும் כָבֵד என்பதன் கனத்தன்மையையும் இயல்பான தமிழில் தொடர்கிறது.
- source_word: יִכְבְּדוּ מִמֶּנִּי
  choice: அவை என்னால் தாங்க முடியாத அளவுக்குப் பாரமாயின
  rationale: מִן வெளிப்படுத்தும் ஒப்பீட்டு அல்லது இயலாமை நுணுக்கத்தையும் כבד வேரின் பார உருவகத்தையும் வாசிக்க எளிதான தமிழில் காக்கிறது.
theological_decisions:
- issue: மனந்திரும்புதல் சூழலில் עָוֹן என்பதன் பொருள் வீச்சு
  choice: முதன்மையாக சங்கீதக்காரரின் ஒழுக்கக் குற்றங்களைக் குறிக்கும் வகையில் ‘அக்கிரமங்கள்’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: குற்றத்தால் உண்டாகும் பொறுப்பு அல்லது பழியை வலியுறுத்தும் ‘குற்றப்பழி’.
  rationale: வசனம் பேச்சாளருடைய குற்றங்களை மூழ்கடிக்கும் நீராகவும் தாங்க முடியாத சுமையாகவும் சித்தரிக்கிறது. עָוֹן பாவத்தையும் அதன் குற்றப்பழியையும் குறிக்கக்கூடியதால், முதன்மை உரை குற்றச்செயலை முன்னிறுத்துகிறது; விரிந்த பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; கவிதைக்குரிய கண்ணியத்துடன் சாதாரண வாசகர்களுக்கும் புரியும் நடை. தலைக்குமேல் பெருகும் நீர் மற்றும் கனமான சுமை என்ற இரு எபிரெய உருவகங்களும் காக்கப்பட்டுள்ளன.
