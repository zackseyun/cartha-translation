  yaml_path: translation/ot/psalms/038/010.yaml
  text: My heart throbs[a]; my strength has left me[b], and the light of my eyes—even they are not with me.
translation:
  language: ta
  text: என் இதயம் படபடக்கிறது[a]; என் வலிமை என்னைவிட்டு நீங்கிவிட்டது; என் கண்களின் ஒளிகூட என்னிடம் இல்லை[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் இதயம் சுழன்று தடுமாறுகிறது.” எபிரேயச் சொல் சுழலுதல் அல்லது கடுமையாகக் கலங்குதல் என்ற உணர்வையும் கொண்டிருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “கண்களின் ஒளி” என்பது பார்வைத்திறனையோ, கண்களில் தெரியும் பொலிவு அல்லது உயிர்ப்பையோ குறிக்கலாம். எபிரேயத்தில் இதைத் தொடர்ந்து “அவைகளும்கூட” என்ற பன்மை வலியுறுத்தல் வருகிறது; அது கண்களைச் சுட்டியிருக்கலாம்.
    reason: lexical_and_grammatical_ambiguity
lexical_decisions:
- source_word: לִבִּי
  choice: என் இதயம்
  rationale: לֵב இங்கு உடல் வேதனையின் நடுவில் உள்ளார்ந்த உயிராற்றலையும் உடலுறுப்பான இதயத்தையும் ஒருங்கே உணர்த்துகிறது; ‘என் இதயம்’ இயல்பாகவும் நேரடியாகவும் உள்ளது.
- source_word: סְחַרְחַר
  choice: படபடக்கிறது
  rationale: இந்தச் சொல் சுழலுதல் அல்லது கடுமையாகக் கலங்குதல் என்ற அடிப்படையான உணர்வைக் கொண்டது. வலிமை நீங்குதல், கண்களின் ஒளி இல்லாமற்போதல் ஆகிய உடல் அறிகுறிகளின் சூழலில், இதயத்தின் கலங்கிய துடிப்பை ‘படபடக்கிறது’ இயல்பாக வெளிப்படுத்துகிறது; மற்ற சாத்தியம் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- source_word: עֲזָבַנִי
  choice: என்னைவிட்டு நீங்கிவிட்டது
  rationale: עזב என்பதன் ‘விட்டுச் செல்லுதல்’ என்ற பொருளை, வலிமை செயலிழப்பதைச் சுட்டும் இயல்பான தமிழில் தருகிறது; ‘கைவிட்டது’ என்பதில் தோன்றக்கூடிய உறவுசார் அல்லது உடன்படிக்கைச் சாயலைத் தவிர்க்கிறது.
- source_word: כֹחִי
  choice: என் வலிமை
  rationale: כֹּחַ இங்கு உடல் வலிமை அல்லது உயிராற்றலைக் குறிக்கிறது; ‘வலிமை’ தெளிவான நவீனத் தமிழ் இணை.
- source_word: וְאוֹר עֵינַי
  choice: என் கண்களின் ஒளி
  rationale: எபிரேயக் கவித்துவப் படிமத்தைத் தக்கவைக்கிறது. இது பார்வைத்திறனையோ கண்களில் வெளிப்படும் பொலிவு மற்றும் உயிர்ப்பையோ குறிக்கக்கூடியது; அந்த இருபொருள் தன்மை அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
- source_word: גַּם הֵם
  choice: ஒளிகூட
  rationale: எபிரேயத்தில் உள்ள வலியுறுத்தலை இயல்பான தமிழில் ‘கூட’ என்பதால் வெளிப்படுத்துகிறது. பன்மைச் சுட்டுப்பெயரைச் சொல்லுக்குச் சொல் மொழிபெயர்த்தால் தமிழில் ‘ஒளி’ என்ற ஒருமைத் தலைச்சொல்லுடன் இயல்பற்ற பொருத்தம் ஏற்படும்.
- source_word: אֵין אִתִּי
  choice: என்னிடம் இல்லை
  rationale: ‘என்னுடன் இல்லை’ என்ற மூல அமைப்பின் பொருளை இயல்பான தமிழில் தருகிறது; பார்வையோ கண்களின் உயிர்ப்போ இழந்த நிலையை மிகுதியாக விளக்காமல் திறந்தவாறே வைக்கிறது.
