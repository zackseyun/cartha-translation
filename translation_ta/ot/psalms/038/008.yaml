  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נְפוּגוֹתִי
  choice: வலுவிழந்து
  rationale: פוג என்பதன் ‘வலுவிழத்தல், தளர்தல், மரத்துப்போதல்’ என்ற பொருள் வரம்பை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; ‘உணர்விழந்தேன்’ என்று மிகையாகக் குறுக்கவில்லை.
- source_word: וְנִדְכֵּיתִי עַד־מְאֹד
  choice: மிகவும் நொறுக்கப்பட்டேன்
  rationale: דכא என்பதிலுள்ள கடுமையாக நசுக்கப்பட்ட நிலையையும் עַד־מְאֹד தரும் தீவிரத்தையும் காக்கிறது.
- source_word: שָׁאַגְתִּי
  choice: நான் கர்ஜித்தேன்
  rationale: இந்த வினை சாதாரணமாகப் புலியின் அல்லது சிங்கத்தின் கர்ஜனையையும், மனிதனின் உரத்த வேதனைக் கூக்குரலையும் குறிக்கிறது; மூலத்தின் வலிமையான உருவகத்தைத் தணித்து ‘முனகினேன்’ என மாற்றாமல் காக்கிறது.
- source_word: מִנַּהֲמַת לִבִּי
  choice: என் இதயத்தின் குமுறலால்
  rationale: נַהֲמָה குறிக்கும் ஆழ்ந்த முனகல் அல்லது குமுறலை இயல்பாகத் தருகிறது; לֵב என்பதற்கு ‘இதயம்’ என்று நேரடியாக மொழிபெயர்க்கிறது.
