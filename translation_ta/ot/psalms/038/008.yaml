translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதக் கவிதையின் தீவிரத்தையும் உடல்-உள் வேதனையின் இணைப்பையும் காக்கும் கண்ணியமான நடை. ‘கர்ஜித்தேன்’ என்பது வழக்கமான உரையாடல் சொல்லல்ல என்றாலும், இங்கு மூல எபிரெய உருவகத்தின் ஆற்றலைத் தக்கவைக்கத் திட்டமிட்டு பயன்படுத்தப்பட்டுள்ளது.
