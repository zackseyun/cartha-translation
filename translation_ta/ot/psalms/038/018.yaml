  naturalness: The verse is fluent, dignified modern standard Tamil and appropriately concise for a psalm. The repeated first-person pronoun is natural and gives the two balanced clauses clear emphasis.
  terminology: ‘அக்கிரமம்’ and ‘பாவம்’ are established, comprehensible biblical Tamil terms and preserve the moral distinction and weight of עָוֹן and חַטָּאת. The alternatives in the footnotes preserve the more literal sense of the first verb and the possible ‘about my sin’ sense of the second clause.
