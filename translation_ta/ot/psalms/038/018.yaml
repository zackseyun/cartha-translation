  text: כִּֽי עֲוֺנִ֥/י אַגִּ֑יד אֶ֝דְאַ֗ג מֵֽ/חַטָּאתִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/018.yaml
  text: For I confess my iniquity[b][a]; I am anxious because of my sin.
translation:
  language: ta
  text: ஏனெனில், என் அக்கிரமத்தை நான் ஒப்புக்கொள்கிறேன்[a]; என் பாவத்தினால் நான் கலங்குகிறேன்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘என் அக்கிரமத்தை நான் தெரிவிக்கிறேன்.’ எபிரெய வினை சொல்லடியாக ‘அறிவிக்கிறேன்’ அல்லது ‘தெரிவிக்கிறேன்’ என்று பொருள்படும்; மனந்திரும்புதல் சூழலை ‘ஒப்புக்கொள்கிறேன்’ பிரதிபலிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘என் பாவத்தைக் குறித்து நான் கவலைப்படுகிறேன்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தையோ விளக்கத்தையோ அறிமுகப்படுத்தும் இணைப்புச் சொல்லின் வலிமையை இயல்பான தமிழில் காக்கிறது.
- source_word: עֲוֺנִי
  choice: என் அக்கிரமத்தை
  rationale: עָוֹן என்பது தவறான செயல், அதனால் உண்டாகும் குற்றநிலை ஆகிய இரு நிழற்பொருள்களையும் கொண்டிருக்கலாம்; ‘அக்கிரமம்’ அதன் அறநெறிசார் கனத்தைத் தக்கவைக்கிறது.
- source_word: אַגִּיד
  choice: நான் ஒப்புக்கொள்கிறேன்
  rationale: נגד என்பதன் ஹிஃபில் வடிவம் அடிப்படையில் ‘அறிவித்தல்/தெரிவித்தல்’ என்று பொருள்படும். தனிப்பட்ட பாவத்தைப் பற்றிய மனந்திரும்புதல் சூழலில் ‘ஒப்புக்கொள்கிறேன்’ இயல்பான பொருளைத் தருகிறது; சொல்லடிப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: אֶדְאַג
  choice: நான் கலங்குகிறேன்
  rationale: דאג கவலை, மனக்கலக்கம், அச்சமுள்ள அக்கறை ஆகியவற்றைக் குறிக்கிறது; ‘கலங்குகிறேன்’ இங்கு உள்ளார்ந்த துயரத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מֵחַטָּאתִי
  choice: என் பாவத்தினால்
  rationale: מִן இங்கு காரணத்தைக் குறிக்கிறது; பாவமே மனக்கலக்கத்திற்கான காரணம் என்பதை ‘-ஆல்’ வேற்றுமை தெளிவாகக் காட்டுகிறது.
- source_word: חַטָּאתִי
  choice: என் பாவம்
  rationale: חַטָּאת என்பதற்கான நேரடியான, பொதுவாகப் புரிந்துகொள்ளப்படும் தமிழ் இணை ‘பாவம்’ ஆகும்.
theological_decisions:
- issue: மனந்திரும்புதல் சங்கீதத்தில் அக்கிரமத்தை அறிவிப்பதற்கும் உள்ளார்ந்த கலக்கத்திற்கும் உள்ள தொடர்பு
  choice: சங்கீதக்காரர் தமது அக்கிரமத்தை ஒப்புக்கொண்டு, தமது பாவத்தினால் கலங்குவதாக மொழிபெயர்க்கப்பட்டுள்ளது.
  alternative: אַגִּיד என்பதை ‘தெரிவிக்கிறேன்’ என்று மட்டும் மொழிபெயர்த்து, அறிக்கையிடுதல் அல்லது ஒப்புக்கொள்ளுதல் என்ற மனந்திரும்புதல் நிழற்பொருளைத் தணிக்கலாம்.
  rationale: எபிரெய வினை நேரடியாக ‘அறிவிக்கிறேன்’ என்று பொருள்பட்டாலும், தனிப்பட்ட அக்கிரமமும் பாவத்தால் உண்டாகும் கலக்கமும் இடம்பெறும் சூழல் ‘ஒப்புக்கொள்கிறேன்’ என்பதை ஆதரிக்கிறது. இதற்கு அப்பாற்பட்ட மனந்திரும்புதல் கோட்பாடு எதுவும் உரைக்குள் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியக்கூடியதாயும் சங்கீதத்திற்கேற்ற கண்ணியமான நடையிலும் அமைக்கப்பட்டுள்ளது. ‘அக்கிரமம்’, ‘பாவம்’ ஆகிய வழக்கமான வேதாகமச் சொற்கள் அறநெறிசார் கனத்தைத் தக்கவைக்கின்றன; ‘ஒப்புக்கொள்கிறேன்’, ‘கலங்குகிறேன்’ ஆகியவை இயல்பான தற்போதைய தமிழை வழங்குகின்றன.
