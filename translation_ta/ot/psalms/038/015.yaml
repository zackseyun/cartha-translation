  text: כִּֽי לְ/ךָ֣ יְהוָ֣ה הוֹחָ֑לְתִּי אַתָּ֥ה תַ֝עֲנֶ֗ה אֲדֹנָ֥/י אֱלֹהָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/015.yaml
  text: For I wait for you[a], O Yahweh; you will answer[c][b], O Lord my God.
translation:
  language: ta
  text: ஏனெனில், யாவே[a], உம்மை நம்பிக்கையுடன் எதிர்நோக்கிக் காத்திருக்கிறேன்[b]; ஆண்டவரே, என் தேவனே, நீரே பதிலளிப்பீர்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘யாவே’ என்பது எபிரெயத்தில் வரும் தேவனுடைய தனிப்பெயரான יהוה (YHWH) என்பதன் ஒலிபெயர்ப்பு; மரபில் இது ‘கர்த்தர்’ என்றும் வழங்கப்படுகிறது.
    reason: alternative_reading
  - marker: b
    text: எபிரெய வினை ‘காத்திரு’, ‘நம்பு’, அல்லது ‘நம்பிக்கையுடன் காத்திரு’ என்று பொருள்படலாம்.
    reason: lexical_alternative
  - marker: c
    text: ‘மறுமொழி கூறுவீர்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயத்தில் யாருக்குப் பதிலளிப்பார் என்பது வெளிப்படையாகக் குறிப்பிடப்படவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: சுற்றியுள்ள கூற்றுக்கான காரணத்தை அறிமுகப்படுத்துகிறது; காரணத் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לְךָ
  choice: உம்மை ... எதிர்நோக்கி
  rationale: יחל என்பதுடன் வரும் לְ, காத்திருத்தலும் நம்பிக்கையுடன் ஒருவரை எதிர்நோக்குதலும் ஆகிய திசையைச் சுட்டுகிறது. ‘உமக்காக’ என்பது தமிழில் ‘உமது சார்பாக’ என்ற தவறான பொருளைத் தரக்கூடும் என்பதால் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது ஒரு பட்டமல்ல, தேவனுடைய தனிப்பெயரான நான்கு எழுத்துப் பெயர்; எனவே தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: הוֹחָלְתִּי
  choice: நம்பிக்கையுடன் ... காத்திருக்கிறேன்
  rationale: יחל வினை நம்பிக்கையோடு காத்திருத்தல் அல்லது நம்புதல் ஆகிய இரண்டையும் உள்ளடக்குகிறது. எபிரெய நிறைவுவடிவம் இங்கு நிலையான மனநிலையைக் காட்டுவதால் தமிழில் நிகழ்காலமாக இயல்பாக வழங்கப்பட்டது.
- source_word: אַתָּה
  choice: நீரே
  rationale: தனித்து வரும் இரண்டாம் நபர் சுட்டுப்பெயரின் வலியுறுத்தலை ‘-ஏ’ விகுதி வெளிப்படுத்துகிறது.
- source_word: תַעֲנֶה
  choice: பதிலளிப்பீர்
  rationale: ענה என்பதன் நேரடிப் பொருள் ‘பதிலளி’ அல்லது ‘மறுமொழி கூறு’. எபிரெயத்தில் செயப்படுபொருள் வெளிப்படையாக இல்லாததால் ‘எனக்கு’ என்று சேர்க்கப்படவில்லை.
- source_word: אֲדֹנָי
  choice: ஆண்டவரே
  rationale: நேரடி அழைப்பில் வரும் தெய்வீகப் பட்டத்தை மரியாதையும் இயல்பும் கொண்ட தமிழில் வழங்குகிறது.
- source_word: אֱלֹהָי
  choice: என் இறைவனே
  rationale: முதல் நபர் ஒருமை உடைமைப் பின்னொட்டை வெளிப்படையாகப் பாதுகாத்து, நேரடி அழைப்பையும் தமிழில் காட்டுகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பொதுப் பட்டமல்ல, தனிப்பெயரான יהוה நேரடியாக உள்ளது. ஆகவே அதை ஒரு பட்டத்தால் மாற்றாமல் ஒலிபெயர்த்தோம்.
- issue: காத்திருத்தலா அல்லது நம்புதலா
  choice: நம்பிக்கையுடன் எதிர்நோக்கிக் காத்திருக்கிறேன்
  alternative: உம்மில் நம்பிக்கை வைத்திருக்கிறேன்
  rationale: יחל என்பதில் உள்ள காத்திருத்தல் மற்றும் நம்பிக்கை ஆகிய இரு நுணுக்கங்களையும் ஒன்றை நீக்காமல் பாதுகாக்கிறது.
- issue: பதில் யாருக்கு அளிக்கப்படுகிறது என்பது
  choice: செயப்படுபொருளைச் சேர்க்காமல் ‘பதிலளிப்பீர்’
  alternative: எனக்குப் பதிலளிப்பீர்
  rationale: சூழலால் ‘எனக்கு’ என்பது புரிந்தாலும், எபிரெய மூலத்தில் அது வெளிப்படையாக இல்லை; அந்தத் திறந்த அமைப்பு பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதத்திற்கேற்ற கண்ணியமான நேரடி அழைப்பு நடை பயன்படுத்தப்பட்டது. தேவனை நோக்கிய ஒருமை மரியாதை வடிவங்களான ‘உம்மை’, ‘நீரே’, ‘பதிலளிப்பீர்’ என்பவை தொடர்ச்சியாகக் கையாளப்பட்டுள்ளன.
