  revised_text: ஏனெனில், யாவே[a], உம்மை நம்பிக்கையுடன் எதிர்நோக்கிக் காத்திருக்கிறேன்[b]; ஆண்டவரே, என் தேவனே, நீரே பதிலளிப்பீர்[c].
