  yaml_path: translation/ot/psalms/038/012.yaml
  text: Those who seek my life set traps[a], and those who seek my harm speak destruction[d][c][b]; all day long they mutter deceit.
translation:
  language: ta
  text: என் உயிரைப் பறிக்க முயலுகிறவர்கள் கண்ணிகளை வைக்கிறார்கள்[a]; எனக்குத் தீங்கு நாடுகிறவர்கள் அழிவை விளைவிக்கும் வார்த்தைகளைப் பேசுகிறார்கள்[b]; நாள் முழுவதும் வஞ்சகத்தை முணுமுணுக்கிறார்கள்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்பொருளில், “என் ஆத்துமாவைத் தேடுகிறவர்கள்.” இங்கு பகைமைச் சூழலில், “என் உயிரைப் பறிக்க முயலுகிறவர்கள்” என்பது பொருள்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அழிவை உரைக்கிறார்கள்” அல்லது “கேடானவற்றைப் பேசுகிறார்கள்.”
    reason: lexical_alternative
  - marker: c
    text: எபிரெய வினை “முணுமுணு,” “மனத்தில் அசைபோடு,” அல்லது “தியானி” என்றும் பொருள்படலாம்; இங்கு வஞ்சகமான பேச்சைத் தொடர்ந்து முணுமுணுப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְנַקְשׁוּ
  choice: கண்ணிகளை வைக்கிறார்கள்
  rationale: נקשׁ என்ற வினையின் பொறி அல்லது கண்ணி வைத்து அகப்படுத்தும் உருவகத்தை இயல்பான நவீன தமிழில் தக்கவைக்கிறது.
- source_word: מְבַקְשֵׁי נַפְשִׁי
  choice: என் உயிரைப் பறிக்கத் தேடுகிறவர்கள்
  rationale: பகைமையான சூழலில் נפשׁ-ஐத் ‘தேடுதல்’ என்பது ஒருவரின் உயிரைக் கொல்ல நாடுவதைக் குறிக்கும்; தமிழில் நோக்கத்தைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וְדֹרְשֵׁי רָעָתִי
  choice: எனக்குத் தீங்கு செய்யத் தேடுகிறவர்கள்
  rationale: דרשׁי רעה என்பதில் ஒருவருக்குத் தீங்கையோ அழிவையோ நாடும் தனிப்பட்ட பகைமை உள்ளது; அதை மிகைப்படுத்தாமல் வெளிப்படுத்துகிறது.
- source_word: דִּבְּרוּ הַוּוֹת
  choice: அழிவைப் பற்றிப் பேசுகிறார்கள்
  rationale: הַוּוֹת குறிக்கும் அழிவு, கேடு, பேரிடர் ஆகிய பொருள் வரம்பைத் தக்கவைத்து, ‘அழிவைச் பேசுதல்’ என்ற செயற்கையான தமிழைத் தவிர்க்கிறது.
- source_word: וּמִרְמוֹת
  choice: வஞ்சகத்தையே
  rationale: מִרְמוֹת என்பதன் ஏமாற்றும் அல்லது துரோகமான பேச்சு சார்ந்த பொருளைத் தமிழில் இயல்பான கூட்டுப்பெயராக வழங்குகிறது.
- source_word: כָּל הַיּוֹם
  choice: நாள் முழுவதும்
  rationale: தொடர்ச்சியான செயலைக் குறிக்கும் எபிரெய காலச் சொற்றொடரின் இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: יֶהְגּוּ
  choice: முணுமுணுக்கிறார்கள்
  rationale: הגה என்பதன் முணுமுணுத்தல், மனத்தில் அசைபோடுதல், தியானித்தல் ஆகிய பொருள் சாத்தியங்களில், வஞ்சகமான பகைச் சூழலுக்கு ஏற்ற தொடர்ச்சியான தாழ்ந்த குரல் பேச்சை இது காட்டுகிறது; ‘சதித்திட்டம் தீட்டுதல்’ என்று மிகையாக விளக்கவில்லை.
