base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/013.yaml
  text: But I[a], like a deaf man, do not hear; and like a mute man[b], I do not open my mouth.
translation:
  language: ta
  text: ஆனால் நானோ, காது கேளாதவரைப்போல் கேட்பதில்லை; பேச இயலாத ஒருவரைப்போல்[a]—அவர் தம் வாயைத் திறப்பதில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் முதல் பகுதியில் ‘நான் கேட்பதில்லை’ என்று முதலாம் நபரில் கூறியபின், இரண்டாம் பகுதியில் ‘அவர் தம் வாயைத் திறப்பதில்லை’ என்று மூன்றாம் நபருக்கு மாறுகிறது. இது பேச இயலாத ஒருவரைப் பற்றிய ஒப்புமையைத் தொடர்வதாக இருக்கலாம். பொருளைச் சீராக்கி, ‘நான் என் வாயைத் திறப்பதில்லை’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: ஆனால் நானோ
  rationale: முந்தைய சூழலில் பகைவர்கள் பேசுவதற்கும் சங்கீதக்காரரின் எதிர்வினையின்மைக்கும் இடையிலான மாறுபாட்டை וְ மற்றும் வலியுறுத்தப்பட்ட אֲנִי காட்டுகின்றன; ‘ஆனால் நானோ’ இதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: כְחֵרֵשׁ
  choice: காது கேளாதவரைப்போல்
  rationale: כְּ ஒப்புமையைக் குறிக்கிறது; חֵרֵשׁ காது கேளாத ஒருவரைக் குறிக்கிறது. இத்தேர்வு ஒப்புமையைத் தெளிவாகவும், இன்றைய தமிழில் மரியாதையுடனும் தருகிறது.
- source_word: לֹא אֶשְׁמָע
  choice: கேட்பதில்லை
  rationale: שׁמע என்பதன் அடிப்படை உணர்வான ‘கேள்’ என்பதைக் காக்கிறது; குற்றச்சாட்டுகளுக்குப் பதிலளிக்காத நிலையையும் சூழல் வழியாக உணர இடமளிக்கிறது.
- source_word: וּכְאִלֵּם
  choice: பேச இயலாதவரைப்போல்
  rationale: אִלֵּם பேச இயலாத ஒருவரைக் குறிக்கிறது; முதல் ஒப்புமைக்கு இணையான உடல் சார்ந்த உருவகத்தையும் மரியாதையான நவீன நடையையும் காக்கிறது.
- source_word: לֹא יִפְתַּח פִּיו
  choice: அவர் தம் வாயைத் திறப்பதில்லை
  rationale: எபிரெயத்தில் வினையும் உடைமைப் பின்னொட்டும் மூன்றாம் நபரில் உள்ளன. ‘வாயைத் திறத்தல்’ என்ற மூல மொழியின் சொல்லோவியத்தையும் அந்த நபர் மாற்றத்தையும் இத்தேர்வு பாதுகாக்கிறது.
