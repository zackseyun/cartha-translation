translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘செவிடன்’, ‘ஊமையன்’ போன்ற பெயரிடல்களைத் தவிர்த்து, மூலத்தின் உடல் சார்ந்த ஒப்புமைகளை ‘காது கேளாதவர்’, ‘பேச இயலாதவர்’ என வழங்குகிறது. எபிரெயத்தின் எதிர்பாராத முதலாம் நபர்–மூன்றாம் நபர் மாற்றம் அழிக்கப்படாமல், நீள்கோட்டால் வாசகருக்குச் சுட்டப்படுகிறது.
