translation_notes:
  register: நவீன பொதுத்தமிழில், கவிதைக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘என்னை நேசிப்பவர்கள்’ என்பது காதல் உறவுக்கு மட்டும் சுருங்காதவாறு தேர்ந்தெடுக்கப்பட்டது. முதல் அரையடியின் இடவியல் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது; ‘உறவினர்களோ’ என்பதிலுள்ள ‘ஓ’ இரு அரையடிகளுக்கிடையிலான மாறுபாட்டை இயல்பாக வலுப்படுத்துகிறது.
