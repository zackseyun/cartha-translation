id: PSA.38.11
reference: Psalms 38:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: אֹֽהֲבַ֨/י וְ/רֵעַ֗/י מִ/נֶּ֣גֶד נִגְעִ֣/י יַעֲמֹ֑דוּ וּ֝/קְרוֹבַ֗/י מֵ/רָחֹ֥ק עָמָֽדוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/011.yaml
  text: My loved ones and my friends stand apart from my affliction[c][b][a], and my close kin stand far away.
translation:
  language: ta
  text: என்னை நேசிப்பவர்களும் என் நண்பர்களும் என் துன்பத்திலிருந்து விலகி நிற்கிறார்கள்[a][b]; என் நெருங்கிய உறவினர்களோ தொலைவில் நிற்கிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “என் துன்பம்” என்பதற்கு “என் வாதை,” “என்னைத் தாக்கிய நோய்,” அல்லது “என் காயம்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் தாக்குதல், நோய்வாதை, அல்லது காயத்தைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: “என் துன்பத்திலிருந்து விலகி நிற்கிறார்கள்” என்பதற்கு “என் துன்பத்துக்கு எதிரே நிற்கிறார்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: source_ambiguity
lexical_decisions:
- source_word: אֹהֲבַי
  choice: என்னை நேசிப்பவர்கள்
  rationale: אהב என்ற வினையின் பங்கேற்பு வடிவம், முதலாம் நபர் ஒருமை பின்னொட்டுடன், சங்கீதக்காரரை நேசிப்பவர்களைக் குறிக்கிறது. காதல் உறவை மட்டும் உணர்த்தாமல் பொருளை நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: וְרֵעַי
  choice: என் நண்பர்கள்
  rationale: רֵעַ என்பதன் நண்பர், தோழர், உடனிருப்பவர் ஆகிய பொருள்களில், இணை அமைப்புக்கும் சூழலுக்கும் ‘நண்பர்கள்’ மிக இயல்பாகப் பொருந்துகிறது.
- source_word: מִנֶּגֶד
  choice: விலகி
  rationale: இந்த இடச்சொல் ‘எதிரே’, ‘முன்னால்’, அல்லது சூழலின்படி ‘தள்ளி/விலகி’ நிற்பதை உணர்த்தலாம். அடுத்த அரையடியில் வரும் தொலைவைச் சுட்டும் சொல்லுடன் இணைந்து, துன்புற்றவரிடமிருந்து அவர்கள் ஒதுங்கி நிற்கும் காட்சியை ‘விலகி’ இயல்பாக வெளிப்படுத்துகிறது; ‘எதிரே’ என்ற சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: נִגְעִי
  choice: என் துன்பம்
  rationale: נֶגַע என்பது தாக்குதல், காயம், நோய்வாதை அல்லது பொதுவான கடும் துன்பம் ஆகியவற்றைக் குறிக்கக்கூடும். சங்கீதத்தின் உடல் வேதனைச் சூழலை உள்ளடக்கியும் தேவையற்ற மருத்துவத் துல்லியத்தைத் தவிர்த்தும் ‘துன்பம்’ பரந்த பொருளை வழங்குகிறது.
- source_word: יַעֲמֹדוּ / עָמָדוּ
  choice: நிற்கிறார்கள்
  rationale: இரு அரையடிகளும் ஒரே தொடர்ந்த காட்சியை விவரிக்கின்றன. எபிரெயத்தில் வினை வடிவங்கள் வேறுபட்டிருந்தாலும், நவீன தமிழில் நிகழ்காலம் அந்த இணை அமைப்பையும் நீடிக்கும் நிலையையும் தெளிவாகக் காட்டுகிறது.
- source_word: וּקְרוֹבַי
  choice: என் நெருங்கிய உறவினர்கள்
  rationale: קָרוֹב என்பது அருகிலுள்ளவர் அல்லது நெருங்கிய உறவினர் எனப் பொருள்படலாம். இங்கு நண்பர்களுடன் இணையான சமூக உறவுக் குழுவாக வருவதால், சாத்தியமான குடும்ப நெருக்கத்தை ‘நெருங்கிய உறவினர்கள்’ வெளிப்படுத்துகிறது.
- source_word: מֵרָחֹק
  choice: தொலைவில்
  rationale: இடைவெளியை நேரடியாகவும் இயல்பான நவீன தமிழிலும் வெளிப்படுத்துகிறது.
