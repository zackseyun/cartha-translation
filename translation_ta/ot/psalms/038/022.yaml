source:
  edition: WLC
  text: ח֥וּשָׁ/ה לְ/עֶזְרָתִ֑/י אֲ֝דֹנָ֗/י תְּשׁוּעָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/022.yaml
  text: Hurry to help me[a], Lord[b], my salvation.
translation:
  language: ta
  text: எனக்கு உதவ விரைந்து வாரும், ஆண்டவரே, என் மீட்பே![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘என் இரட்சிப்பே!’
    reason: lexical_alternative
lexical_decisions:
- source_word: חוּשָׁה
  choice: விரைந்து வாரும்
  rationale: ‘விரைதல்’ என்ற கட்டளைப் பொருளையும் வேண்டுதலின் அவசரத்தையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது. ‘வாரும்’ என்பது உதவிக்காக அணுகிவர வேண்டும் என்ற தமிழின் இயல்பான வேண்டுதல் நடை.
- source_word: לְעֶזְרָתִי
  choice: எனக்கு உதவ
  rationale: எழுத்துப்படி ‘என் உதவிக்காக/என் உதவிக்கு’ என இருந்தாலும், ‘எனக்கு உதவ’ என்பது அதே பொருளை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: אֲדֹנָי
  choice: ஆண்டவரே
  rationale: இது கடவுளை நேரடியாக அழைக்கும் வழக்கமான தெய்வீகப் பட்டம். தமிழில் விளிப்புப் பொருளை ‘-ஏ’ தெளிவாகக் காட்டுகிறது; ‘என் ஆண்டவரே’ என்று மூலத்தில் முன்னிலைப்படுத்தப்படாத உடைமைப் பொருளைச் சேர்க்கவில்லை.
- source_word: תְּשׁוּעָתִי
  choice: என் மீட்பே
  rationale: மூலத்தின் ‘என் மீட்பு/இரட்சிப்பு’ என்ற பெயர்ச்சொல் அமைப்பைத் தக்கவைத்து, கடவுளை மீட்பாக நேரடியாக அழைக்கும் கவித்துவமான சொல்லாட்சியையும் பாதுகாக்கிறது.
theological_decisions:
- issue: אֲדֹנָי என்ற தெய்வீகப் பட்டத்தின் மொழிபெயர்ப்பு
  choice: ஆண்டவரே
  alternative: என் ஆண்டவரே
  rationale: இச்சொல் இங்கு கடவுளுக்குரிய நிலையான பட்டமாகச் செயல்படுகிறது. ஆகவே வரலாற்று உடைமை வடிவத்தை வெளிப்படையாகச் சேர்க்காமல் ‘ஆண்டவரே’ என வழங்கப்படுகிறது.
- issue: תְּשׁוּעָתִי என்பதைக் கருத்துப்பெயராகவே வைத்தல்
  choice: என் மீட்பே
  alternative: என்னை மீட்பவரே
  rationale: மூலத்தில் ‘மீட்பவர்’ என்ற செய்பவர் பெயர் அல்ல, ‘என் மீட்பு’ என்ற கருத்துப்பெயரே உள்ளது. அந்த வலுவான கவித்துவ மற்றும் இறையியல் அடையாளப்படுத்தலை மொழிபெயர்ப்பு தக்கவைக்கிறது.
translation_notes:
  register: நவீன, கண்ணியமான ஜெப மொழிநடை. ‘விரைந்து வாரும்’ என்பது வேண்டுதலின் அவசரத்தையும் கடவுளை மரியாதையுடன் ஒருமையில் அழைக்கும் தமிழ்நடையையும் இணைக்கிறது. இறுதி ‘என் மீட்பே’ மூலத்தின் சுருக்கமான கவித்துவ வலிமையைப் பாதுகாக்கிறது.
