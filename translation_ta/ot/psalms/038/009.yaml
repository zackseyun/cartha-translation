source:
  edition: WLC
  text: אֲֽדֹנָ/י נֶגְדְּ/ךָ֥ כָל תַּאֲוָתִ֑/י וְ֝/אַנְחָתִ֗/י מִמְּ/ךָ֥ לֹא נִסְתָּֽרָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/009.yaml
  text: Lord[a], all my desire is before you[b], and my groaning is not hidden from you.
translation:
  language: ta
  text: ஆண்டவரே, என் ஏக்கமெல்லாம்[a] உமக்கு முன்பாக இருக்கிறது; என் பெருமூச்சும்[b] உமக்கு மறைவாக இல்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் விருப்பமெல்லாம்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “என் முனகலும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי
  choice: ஆண்டவரே
  rationale: இது יהוה என்ற இறைப்பெயர் அல்ல, கடவுளை நேரடியாக அழைக்கும் ஆண்டவர்த் தலைப்பு. ‘ஆண்டவரே’ என்பது இயல்பான, மரியாதைமிக்க விளிவடிவம்.
- source_word: נֶגְדְּךָ
  choice: உமக்கு முன்பாக
  rationale: சங்கீதக்காரனின் ஏக்கம் கடவுளின் முன்னிலையிலும் பார்வையிலும் வெளிப்படையாக இருப்பதை இச்சொற்றொடர் தெரிவிக்கிறது.
- source_word: כָל
  choice: எல்லாம்
  rationale: சங்கீதக்காரனின் ஏக்கத்தில் எதுவும் கடவுளின் பார்வைக்கு வெளியே இல்லை என்ற முழுமையைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: תַּאֲוָתִי
  choice: என் ஏக்கம்
  rationale: இப்புலம்பல் சூழலில் இச்சொல் தீவிரமான உள்ளார்ந்த விருப்பம் அல்லது ஏக்கத்தைக் குறிக்கிறது; ‘ஏக்கம்’ இயல்பாகவும் சூழலுக்கு ஏற்றதாகவும் உள்ளது.
- source_word: וְאַנְחָתִי
  choice: என் பெருமூச்சும்
  rationale: துன்பத்திலிருந்து எழும் ஆழ்ந்த மூச்சு, முனகல் ஆகிய பொருள் நிழல்களை உடைய இச்சொல்லுக்கு ‘பெருமூச்சு’ இயல்பான தமிழாக்கம்; இணைப்பை ‘-உம்’ பாதுகாக்கிறது.
- source_word: מִמְּךָ
  choice: உமக்கு
  rationale: ‘மறைவாக இல்லை’ என்பதோடு சேர்ந்து, அது யாரிடமிருந்து மறைக்கப்படவில்லை என்பதைக் குறிக்கிறது. தமிழில் ‘உமக்கு மறைவாக இல்லை’ என்பது இயல்பான கட்டமைப்பு.
- source_word: לֹא נִסְתָּרָה
  choice: மறைவாக இல்லை
  rationale: எதுவும் கடவுளிடமிருந்து மறைந்த நிலையில் இல்லை என்ற எபிரெயச் செயலற்ற நிலைப்பொருளை இயல்பான நிகழ்காலத் தமிழில் தருகிறது.
theological_decisions:
- issue: יהוה என்பதற்குப் பதிலாக אֲדֹנָי கொண்டு கடவுளை அழைத்தல்
  choice: ஆண்டவரே
  alternative: கர்த்தாவே
  rationale: மூலத்தில் உடன்படிக்கைப் பெயரான יהוה இல்லை; ஆண்டவர்த் தலைப்பான אֲדֹנָי உள்ளது. ஆகவே இறைப்பெயருக்குரிய தனிப்பட்ட மரபை இங்கு புகுத்தாமல், தலைப்பை நேரடியாக மொழிபெயர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் மரியாதைமிக்க புலம்பல் நடையைப் பயன்படுத்துகிறது. கடவுளை நோக்கிய உரையில் ‘உமக்கு’ என்ற உயர்வுப் பன்மை வைக்கப்பட்டுள்ளது; தேவையற்ற பழமையான சொற்கள் தவிர்க்கப்பட்டுள்ளன.
