  source_fidelity: ‘ஏனெனில்’ accurately represents כִּי. ‘நான் விழும் நிலையில் இருக்கிறேன்’ naturally conveys אָנִי לְצֶלַע נָכוֹן, in line with the English audit trail’s ‘ready to fall,’ without over-specifying the nature of the affliction. ‘என் வேதனை எப்போதும் என் முன்னே இருக்கிறது’ faithfully retains both מַכְאוֹבִי (‘my pain/affliction’) and נֶגְדִּי תָמִיד (‘continually before me’).
  naturalness: The Tamil is clear, idiomatic, and suitably restrained for a psalm. The two-line parallel structure reads naturally in modern standard Tamil.
