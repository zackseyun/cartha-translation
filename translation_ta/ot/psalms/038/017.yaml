  yaml_path: translation/ot/psalms/038/017.yaml
  text: For I am ready to fall, and my pain is always before me.
translation:
  language: ta
  text: 'ஏனெனில், நான் விழும் நிலையில் இருக்கிறேன்;

    என் வேதனை எப்போதும் என் முன்னே இருக்கிறது.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְצֶלַע נָכוֹן
  choice: விழும் நிலையில் இருக்கிறேன்
  rationale: צֶלַע இங்கு தடுமாற்றம் அல்லது வீழ்ச்சியைச் சுட்டுகிறது; נָכוֹן உடன் சேர்ந்து உடனடி வீழ்ச்சிக்குத் தயாராக அல்லது அதற்கு நெருக்கமாக இருப்பதைத் தெரிவிக்கிறது. இயல்பான தமிழில் ‘விழும் நிலையில்’ என்பது இந்தக் கருத்தைத் தெளிவாகக் காக்கிறது.
- source_word: מַכְאוֹבִי
  choice: என் வேதனை
  rationale: מַכְאוֹב உடல் வலி அல்லது மனவேதனை ஆகிய இரண்டையும் குறிக்கக்கூடும். ‘வேதனை’ அந்தப் பரப்பைச் சுருக்காமல் காக்கிறது.
- source_word: נֶגְדִּי תָמִיד
  choice: எப்போதும் என் முன்னே இருக்கிறது
  rationale: நேரடியான ‘என் முன்னே’ என்ற உருவகத்தைப் பேணி, வேதனை இடைவிடாமல் கவனத்தில் இருப்பதைக் காட்டுகிறது.
theological_decisions: []
