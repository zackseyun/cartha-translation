  register: நவீனத் தரத் தமிழில் எளிமையான, கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வசனத்தின் காரணவியல் தொடக்கமும் இரண்டு இணையான கூறுகளும் பேணப்பட்டுள்ளன.
