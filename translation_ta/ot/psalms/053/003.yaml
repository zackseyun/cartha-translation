  yaml_path: translation/ot/psalms/053/003.yaml
  text: All of them have turned aside; together they have become corrupt; there is none who does good[a], not even one.
translation:
  language: ta
  text: அவர்கள் அனைவரும் வழிவிலகினர்; ஒருசேரச் சீர்கெட்டுப்போனார்கள்[a]. நன்மை செய்பவர் எவரும் இல்லை; ஒருவர்கூட இல்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஒருசேர அருவருப்பானவர்களாகிவிட்டார்கள்.’ இங்குள்ள எபிரெய வினைச்சொல் அறநிலையில் அருவருப்பாக அல்லது மாசுபட்டதாக ஆகிவிடுவதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻּלּוֹ
  choice: அவர்கள் அனைவரும்
  rationale: முழுக் குழுவையும் குறிக்கும் எபிரெயக் கூற்றின் கூட்டுப்பொருளை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: סָג
  choice: வழிவிலகினர்
  rationale: சரியான வழியிலிருந்து விலகுதல் என்ற உருவக மற்றும் அறச்சார்ந்த பொருளைப் பேணுகிறது; ‘பின்வாங்கினர்’ என்பதைக் காட்டிலும் சூழலுக்கு இயல்பானது.
- source_word: יַחְדָּו
  choice: ஒருசேர
  rationale: குழுவினர் அனைவரும் பொதுவாக அடைந்த நிலையைச் சுருக்கமாகவும் கவிதைநடைக்கு ஏற்றவாறும் தெரிவிக்கிறது.
- source_word: נֶאֱלָחוּ
  choice: சீர்கெட்டுப்போனார்கள்
  rationale: நிஃபால் வடிவிலுள்ள ‘அறநிலையில் மாசடைதல் அல்லது கெட்டுப்போதல்’ என்ற பொருளை இயல்பான தமிழில் தருகிறது; உடல்சார்ந்த அசுத்தம் என்று மட்டும் புரிந்துகொள்ளப்படுவதைத் தவிர்க்கிறது.
- source_word: אֵין עֹשֵׂה טוֹב
  choice: நன்மை செய்பவர் எவரும் இல்லை
  rationale: இருப்பின்மையை மறுக்கும் אֵין என்பதையும், வழக்கமாகச் செய்பவரைக் குறிக்கும் பங்கேற்பு வடிவத்தையும் தெளிவான தமிழ் உறவுத்தொடராக வழங்குகிறது.
- source_word: גַּם אֶחָד
  choice: ஒருவர்கூட இல்லை
  rationale: முந்தைய மறுப்பை வலுப்படுத்தும் ‘ஒருவரும் விதிவிலக்கல்ல’ என்ற அழுத்தத்தை இயல்பாகப் பேணுகிறது.
theological_decisions:
- issue: சங்கீதத்தின் அறக் குற்றச்சாட்டின் பரப்பு
  choice: ‘அவர்கள் அனைவரும்’, ‘எவரும் இல்லை’, ‘ஒருவர்கூட இல்லை’ என்ற முழுமையான மொழியை அப்படியே பேணுதல்
  alternative: உடனடியாகப் பேசப்படும் தீமை செய்பவர்களுக்கு மட்டும் குற்றச்சாட்டைக் குறுக்குதல்
  rationale: எபிரெய உரை முழுமையைக் குறிக்கும் சொற்களைத் தெளிவாகப் பயன்படுத்துகிறது. அவற்றைத் தணிக்காமலும், அதேவேளை இவ்வசனத்திற்கு அப்பாற்பட்ட ஒரு விரிவான கோட்பாட்டு அமைப்பைச் சேர்க்காமலும் மொழிபெயர்ப்பு பதற்றத்தைப் பேணுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், வாசிக்க எளிதான அதேவேளை சங்கீதக் கவிதைக்கு ஏற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. இணைவரிகளின் முழுமையான மறுப்பும் இறுதி வலியுறுத்தலும் பேணப்பட்டுள்ளன.
