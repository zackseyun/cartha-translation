  text: God looks down from heaven on the children of man to see whether there is anyone who has understanding[a], who seeks God.
translation:
  language: ta
  text: 'தேவன் வானத்திலிருந்து மனிதர்களை நோக்கிப் பார்க்கிறார்;

    புரிந்துணர்வுள்ளவனாகவும் தேவனைத் தேடுகிறவனாகவும் எவனாவது இருக்கிறானா என்று காண.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱלֹהִים
  choice: தேவன்
  rationale: இச்சூழலில் பன்மை வடிவம் இஸ்ரவேலின் ஒரே தேவனைக் குறிக்கிறது; ஆகவே ஒருமைச் சொல் பொருத்தமானது.
- source_word: מִשָּׁמַיִם
  choice: வானத்திலிருந்து
  rationale: எபிரெயப் பன்மை வடிவத்தைத் தமிழில் இயல்பான ஒருமைச் சொல்லால் வழங்குகிறது.
- source_word: הִשְׁקִיף עַל
  choice: நோக்கிப் பார்க்கிறார்
  rationale: மேலிருந்து கீழே கூர்ந்து பார்ப்பது என்ற படிமத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது; சங்கீதக் கூற்றின் உயிரோட்டத்துக்காக நிகழ்காலம் பயன்படுத்தப்படுகிறது.
- source_word: בְּנֵי אָדָם
  choice: மனிதர்களை
  rationale: சொல்லுக்கு சொல் வடிவம் ‘ஆதாமின் பிள்ளைகள்/மனிதனின் பிள்ளைகள்’ என்றாலும், இங்கு அது மனிதர்களை ஒட்டுமொத்தமாகக் குறிக்கும் எபிரெய மரபுத்தொடர்; ‘மனிதர்கள்’ என்பது நவீன தமிழில் அதன் பொருளை இயல்பாகவும் பாலினத் துல்லியத்துடனும் தருகிறது.
- source_word: לִרְאוֹת
  choice: என்று பார்க்கிறார்
  rationale: இறைவன் நோக்கிப் பார்ப்பதன் நோக்கத்தைத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: הֲיֵשׁ
  choice: எவனாவது இருக்கிறானா
  rationale: குறிப்பிட்ட பண்புடைய ஒருவர் இருக்கிறாரா என்று கேட்கும் எபிரெய இருப்பியல் வினாவைப் பாதுகாக்கிறது.
- source_word: מַשְׂכִּיל
  choice: புரிந்துணர்வுள்ளவன்
  rationale: இது வெறும் அறிவுத்திறனை அல்லாமல் விவேகமும் நெறிசார் புரிதலும் உடையவரைக் குறிக்கக்கூடும்; அந்த விரிவைத் திறந்தவாறே வைக்கிறது.
- source_word: דֹּרֵשׁ אֶת אֱלֹהִים
  choice: தேவனைத் தேடுகிறவன்
  rationale: தேவனை நாடும் தொடர்ச்சியான மனநிலையைத் தமிழில் நேரடியாக வழங்குகிறது.
theological_decisions:
- issue: בְּנֵי אָדָם என்ற மரபுத்தொடரின் மொழிபெயர்ப்பு
  choice: மனிதர்களை
  alternative: மனிதனின் பிள்ளைகளை
  rationale: எபிரெயச் சொற்றொடர் மனிதகுலத்தை ஒட்டுமொத்தமாகக் குறிக்கிறது. சொல்லுருவை அப்படியே எடுத்தால் தமிழில் வம்ச உறவைத் தவறாக உணர்த்தலாம்; எனவே அதன் கூட்டுப்பொருள் முதன்மை உரையில் தரப்படுகிறது.
- issue: מַשְׂכִּיל என்பதன் அறிவு-நெறிசார் நுணுக்கம்
  choice: புரிந்துணர்வுள்ளவன்
  alternative: ஞானமுள்ளவன் / விவேகமாக நடப்பவன்
  rationale: மூலச் சொல் புரிதலையும் விவேகமான நடத்தையையும் சுட்டக்கூடும். ஒரு பொருளை மட்டும் உறுதிப்படுத்தாமல் ‘புரிந்துணர்வு’ எனும் விரிவான சொல்லைத் தேர்ந்தெடுக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழ்; சங்கீதத்துக்குரிய கண்ணியமான கவிதைநடை பேணப்பட்டுள்ளது. மூலத்தின் இணையான இரண்டு பங்கேற்பு வடிவங்களும் ‘புரிந்துணர்வுள்ளவன் / தேவனைத் தேடுகிறவன்’ என்று அமைக்கப்பட்டுள்ளன.
