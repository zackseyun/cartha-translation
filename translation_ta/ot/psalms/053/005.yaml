  to: அங்கே அவர்கள் மிகுந்த அச்சமடைந்தார்கள்[a]—அச்சப்படுவதற்கு எதுவும் இல்லாதபோது! ஏனெனில், உனக்கு எதிராக முகாமிட்டவனின்[b] எலும்புகளை கடவுள் சிதறடித்தார். நீ அவர்களை அவமானப்படுத்தினாய்[c]; ஏனெனில், கடவுள் அவர்களை நிராகரித்தார்.
  rationale: 'திருத்தம் இரண்டு பொருள்-துல்லிய மேம்பாடுகளையும் ஒரு நடைத்தெளிவு மேம்பாட்டையும் செய்கிறது: (1) מאס என்பதற்கு ‘நிராகரித்தார்’ என வழங்குகிறது; (2) மூலத்தில் வெளிப்படையாக இல்லாத ‘இருந்தும்’ என்ற concessive உறவை நீக்குகிறது; (3) அச்சத்தின் வலியுறுத்தலையும் குறிப்பு a-வின் விளக்கத்தையும் இயல்பான தமிழில் வழங்குகிறது. கவிதைநடையின் திடீர் நபர் மாற்றம், ஒருமை ‘முகாமிட்டவன்,’ மற்றும் இரண்டாம் நபர் ‘உனக்கு’ ஆகியவை மாற்றப்படவில்லை.'
