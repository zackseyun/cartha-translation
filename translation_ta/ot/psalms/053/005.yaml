    text: சொல்லுக்குச் சொல் எனில், “அவர்கள் அச்சத்தை அஞ்சினார்கள்.” எபிரேயத்தில் ஒரே வேரிலிருந்து வந்த வினைச்சொல்லும் பெயர்ச்சொல்லும் அச்சத்தின் தீவிரத்தை வலியுறுத்துகின்றன.
