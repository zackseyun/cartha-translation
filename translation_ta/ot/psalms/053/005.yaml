    issue: மְאָסָם என்பதற்கு ‘புறக்கணித்தார்’
    rationale: מאס பொதுவாக ‘நிராகரி, தள்ளிவிடு, ஏற்க மறுத்து ஒதுக்கு’ என்பதைக் குறிக்கிறது. ‘புறக்கணித்தார்’ என்பது கவனிக்காமல் விட்டார் என்ற மெலிந்த பொருளையும் தரக்கூடும்; ஆகவே ‘நிராகரித்தார்’ மூலத்திற்கு நெருக்கமானது.
  - severity: low
