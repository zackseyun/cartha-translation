    rationale: ‘அவர்கள் ஒரு திகிலைத் திகிலடைந்தார்கள்’ தமிழில் இயல்பற்றது. எபிரேய cognate verb–noun வலியுறுத்தலை விளக்கி, படிக்கத்தக்க தோராயமான நேரடி வடிவம் தரப்பட வேண்டும்.
  revised_text: அங்கே அவர்கள் மிகுந்த அச்சமடைந்தார்கள்[a]—அச்சப்படுவதற்கு எதுவும் இல்லாதபோது! ஏனெனில், உனக்கு எதிராக முகாமிட்டவனின்[b] எலும்புகளை கடவுள் சிதறடித்தார். நீ அவர்களை அவமானப்படுத்தினாய்[c]; ஏனெனில், கடவுள் அவர்களை நிராகரித்தார்.
