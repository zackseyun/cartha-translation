- source_word: מְאָסָם
  choice: அவர்களைப் புறக்கணித்தார்
  rationale: מאס என்பதன் ‘நிராகரி, வேண்டாமெனத் தள்ளு’ என்ற பொருளை இயல்பான தமிழில் தருகிறது; வெறும் கவனிக்காமையை அல்ல, ஏற்றுக்கொள்ளாமல் ஒதுக்கும் உணர்வைச் சூழல் வழங்குகிறது.
theological_decisions:
- issue: வசனத்திற்குள் நபர் மற்றும் அழைக்கப்படுபவர் மாறுதல்
  choice: முதலில் கடவுளைப் பற்றி மூன்றாம் நபரில் கூறி, பின்னர் ‘நீ ... வெட்கத்திற்குள்ளாக்கினாய்’ என்று அவரை நேரடியாக அழைக்கும் மசோரா உரையின் மாற்றத்தைப் பாதுகாத்தல்.
  alternative: எல்லாவற்றையும் மூன்றாம் நபராக ஒழுங்குபடுத்தி, ‘கடவுள் அவர்களை வெட்கத்திற்குள்ளாக்கினார்’ என்று மொழிபெயர்த்தல்; அல்லது ‘நீ’ என்பது சீயோன்/எருசலேமைக் குறிக்கிறது எனக் கொள்ளுதல்.
  rationale: எபிரேயக் கவிதையில் உள்ள திடீர் நபர் மாற்றத்தைச் சீராக்காமல் காப்பது உண்மையான உரைநிலைத் தெளிவின்மையையும் கவித்துவ அழுத்தத்தையும் பாதுகாக்கிறது. அடுத்ததாக ‘கடவுள் அவர்களைப் புறக்கணித்தார்’ வருவதால், நடுவில் கடவுளை நேரடியாக அழைப்பது பொருத்தமான வாசிப்பு.
- issue: חֹנָךְ எனும் பகைவர் வருணனையின் பொருள்
  choice: ‘உனக்கு எதிராக முகாமிட்டவன்’ என்ற பகைமைப் பொருள்.
  alternative: ‘உன்னைச் சுற்றி முகாமிட்டவன்’ அல்லது ‘உன்னை முற்றுகையிட்டவன்’.
  rationale: எலும்புகள் சிதறடிக்கப்படுவதும் அவர்கள் வெட்கத்திற்குள்ளாக்கப்படுவதும் பகைமையான முகாமைச் சுட்டுகின்றன. ‘முற்றுகையிட்டவன்’ என்பது சாத்தியமானாலும், மூலத்தின் ‘முகாமிடு’ என்ற சொல்லைத் தமிழில் வைத்திருப்பது குறைவாக விளக்கமளிக்கும் தேர்வு.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘பெருந்திகில்’, ‘சிதறடித்தார்’, ‘வெட்கத்திற்குள்ளாக்கினாய்’ ஆகியவை மூலத்தின் தீவிரத்தைக் காக்கின்றன; செயற்கையான சொல்லுக்குச் சொல் நடையைத் தவிர்க்கின்றன. பெண்பால் ஒருமை இரண்டாம் நபர் பின்னொட்டின் பாலினத்தைத் தமிழ் இயல்பாக வெளிப்படுத்தாததால் ‘உனக்கு’ என மட்டும் வழங்கப்பட்டுள்ளது.
