  source_fidelity: 'மொத்தத்தில் எபிரேய மூலத்தின் அமைப்பும் பொருளும் நன்றாகக் காக்கப்பட்டுள்ளன: ‘அங்கே,’ அச்சத்தின் வலியுறுத்தல், பகைமை நோக்கில் முகாமிட்ட ஒருவன், எலும்புகளைச் சிதறடித்தல், கடவுளைப் பற்றிய மூன்றாம் நபரிலிருந்து நேரடி இரண்டாம் நபருக்கான மாற்றம் ஆகியவை துல்லியமாக உள்ளன. ஆனால் מְאָסָם என்பதற்கு ‘புறக்கணித்தார்’ என்பது பலவீனமானது; இச்சூழலில் ‘நிராகரித்தார்’ என்பது மூலத்தின் திட்டவட்டமான தள்ளுபடி/மறுப்புப் பொருளைச் சிறப்பாகத் தருகிறது. மேலும் ‘திகிலடையக் காரணமே இல்லாதிருந்தும்’ என்பது மூலத்தில் வெளிப்படையாக இல்லாத concessive (‘இருந்தும்’) உறவைச் சேர்க்கிறது.'
  naturalness: ‘பெருந்திகிலடைந்தார்கள்’ புரியத்தக்கது; ஆயினும் நவீன நிலையான தமிழில் ‘மிகுந்த அச்சமடைந்தார்கள்’ இயல்பாகவும், פָּחֲדוּ פַחַד என்ற அச்சம்-வலியுறுத்தலுக்குப் பொருத்தமாகவும் உள்ளது. ‘அச்சப்படுவதற்கு எதுவும் இல்லாதபோது’ என்பது ‘அச்சம் இல்லாத இடத்தில்/நிலையில்’ என்ற எபிரேயக் கருத்தை இயல்பாக வழங்குகிறது; தேவையற்ற ‘இருந்தும்’ என்ற விளக்க இணைப்பைத் தவிர்க்கிறது.
  terminology: ‘கடவுள்,’ ‘சிதறடித்தார்,’ ‘உனக்கு எதிராக முகாமிட்டவன்,’ மற்றும் ‘அவமானப்படுத்தினாய்’ ஆகியவை தெளிவான, கண்ணியமான நவீன தமிழாக உள்ளன. מאס-க்கு ‘நிராகரித்தார்’ தேர்ந்தெடுக்கப்பட்டுள்ளது; இது ‘புறக்கணித்தார்’ என்பதில் தோன்றக்கூடிய வெறும் அலட்சியப் பொருளைத் தவிர்க்கிறது.
  issues:
