  text: שָׁ֤ם פָּֽחֲדוּ פַחַד֮ לֹא הָ֪יָה֫ פָ֥חַד כִּֽי אֱלֹהִ֗ים פִּ֭זַּר עַצְמ֣וֹת חֹנָ֑/ךְ הֱ֝בִשֹׁ֗תָה כִּֽי אֱלֹהִ֥ים מְאָסָֽ/ם׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/053/005.yaml
  text: There they were in great fear[a], where there was no fear; for God scattered the bones of the one encamping against you. You put them to shame[c][b], for God rejected them.
translation:
  language: ta
  text: அங்கே அவர்கள் மிகுந்த அச்சமடைந்தார்கள்[a]—அச்சப்படுவதற்கு எதுவும் இல்லாதபோது! ஏனெனில், உனக்கு எதிராக முகாமிட்டவனின்[b] எலும்புகளை கடவுள் சிதறடித்தார். நீ அவர்களை அவமானப்படுத்தினாய்[c]; ஏனெனில், கடவுள் அவர்களை நிராகரித்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல் எனில், “அவர்கள் அச்சத்தை அஞ்சினார்கள்.” எபிரேயத்தில் ஒரே வேரிலிருந்து வந்த வினைச்சொல்லும் பெயர்ச்சொல்லும் அச்சத்தின் தீவிரத்தை வலியுறுத்துகின்றன.
    reason: lexical_alternative
  - marker: b
    text: “உன்னைச் சுற்றி முகாமிட்டவன்” அல்லது “உன்னை முற்றுகையிட்டவன்” என்றும் மொழிபெயர்க்கலாம். இங்குள்ள சூழலில் ‘முகாமிடு’ என்ற எபிரேய வினையெச்சம் பகைமைப் பொருள் கொண்டது.
    reason: lexical_alternative
  - marker: c
    text: இவ்வசனம் முதலில் கடவுளைப் பற்றி மூன்றாம் நபரில் பேசிவிட்டு, பின்னர் “நீ ... அவமானப்படுத்தினாய்” என்று அவரை நேரடியாக அழைக்கிறது. இந்தக் கவித்துவ நபர் மாற்றம் மொழிபெயர்ப்பில் பாதுகாக்கப்பட்டுள்ளது.
    reason: alternative_reading
