theological_decisions:
- issue: தலைப்பின் இயல்பும் தாவீதுடனான தொடர்பும்
  choice: எபிரெய உரையின் ஓர் அங்கமாகத் தலைப்பை மொழிபெயர்த்து, לְדָוִד என்பதைக் ‘தாவீதின்’ என வழங்குதல்
  alternative: ‘தாவீது இயற்றியது’ என்று ஆசிரியத்துவத்தை வெளிப்படையாகக் குறிப்பிடுதல், அல்லது தலைப்பை மொழிபெயர்க்கப்படாத பதிப்பாசிரியர் குறிப்பாகக் கருதுதல்
  rationale: எபிரெய உரையில் தலைப்பு சங்கீதத்தின் உரைப்பகுதியாகவே உள்ளது. ‘தாவீதின்’ என்பது ஆசிரியத்துவத்தை மறுக்காமல், எபிரெய முன்னொட்டு அனுமதிக்கும் தொடர்பு, அர்ப்பணம், தொகுப்புச் சார்பு போன்ற பிற சாத்தியங்களையும் முற்றிலும் மூடிவிடாது.
translation_notes:
  register: நவீன நிலையான தமிழில், சுருக்கமான சங்கீதத் தலைப்பு நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. உறுதியற்ற இசைக் கலைச்சொற்கள் ஒலிபெயர்க்கப்பட்டு அடிக்குறிப்புகளில் விளக்கப்பட்டுள்ளன; மூலத்தின் சொல் வரிசையும் தாவீதுடனான தொடர்பின் தெளிவின்மையும் இயன்றவரை பாதுகாக்கப்பட்டுள்ளன.
