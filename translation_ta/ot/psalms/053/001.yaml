source:
  edition: WLC
  text: אָ֘מַ֤ר נָבָ֣ל בְּ֭/לִבּ/וֹ אֵ֣ין אֱלֹהִ֑ים הִֽ֝שְׁחִ֗יתוּ וְ/הִֽתְעִ֥יבוּ עָ֝֗וֶל אֵ֣ין עֹֽשֵׂה טֽוֹב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/053/001.yaml
  text: The fool says in his heart[a], “There is no God.” They are corrupt; they commit abominable injustice; there is no one who does good.
translation:
  language: ta
  text: மூடன் தன் உள்ளத்தில், “கடவுள் இல்லை” என்று சொல்கிறான். அவர்கள் சீர்கெட்டுப்போனார்கள்; அருவருப்பான அநியாயத்தைச் செய்தார்கள்[a]; நன்மை செய்பவன் ஒருவனும் இல்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள் அருவருப்பான தவற்றைச் செய்தார்கள்”; அல்லது, “அவர்கள் தங்கள் செயல்களை அருவருப்பானவையாக்கினார்கள்.” எபிரெயத்தில் அருவருப்பைக் குறிக்கும் ஒரு வினைச்சொல்லுடன் ‘தவறு/அநியாயம்’ என்று பொருள்படும் பெயர்ச்சொல் இணைந்துள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָבָל
  choice: மூடன்
  rationale: இச்சொல் வெறும் அறிவுத்திறன் குறைந்தவரை அல்ல, ஒழுக்கமும் இறை உணர்வும் கெட்டவரைக் குறிக்கிறது. ‘மூடன்’ என்பது தமிழில் இயல்பானதும் வேதாகமச் சூழலில் இந்த ஒழுக்கப் பொருளை ஏற்கக்கூடியதுமான சொல்.
- source_word: בְּלִבּוֹ
  choice: தன் உள்ளத்தில்
  rationale: எபிரெய மொழிப்படிமம் ஒருவரின் அகச் சிந்தனையையும் மனநிலையையும் குறிக்கிறது. ‘தனக்குள்’ என்று பொருளைத் தட்டையாக்காமல், மூலத்தின் உள்ளம் என்ற படிமத்தை இது காக்கிறது.
- source_word: אֵין אֱלֹהִים
  choice: கடவுள் இல்லை
  rationale: இது கடவுளின் இருப்பை நேரடியாக மறுக்கும் கூற்று. இஸ்ரவேலின் இறையியல் சூழலில் ஒரே உண்மைக் கடவுளையே குறிக்கும் வகையில் தமிழில் இயல்பாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: הִשְׁחִיתוּ
  choice: அவர்கள் சீர்கெட்டுப்போனார்கள்
  rationale: மூன்றாம் நபர் பன்மை வினை, ஒருமையில் வரும் பிரதிநிதி ‘மூடன்’ என்பதிலிருந்து அத்தகைய மக்களின் கூட்டத்துக்கு மாறுகிறது. இத்தேர்வு விளைவாக ஏற்பட்ட ஒழுக்கச் சீர்கேட்டையும் வெளிப்படுத்துகிறது.
- source_word: וְהִתְעִיבוּ עָוֶל
  choice: அருவருப்பான அநியாயத்தைச் செய்கிறார்கள்
  rationale: அருவருப்பைச் சுட்டும் வினையும் ‘தவறு/அநியாயம்’ எனும் பெயர்ச்சொல்லும் சேர்ந்துள்ள கடினமான எபிரெய தொடரை இயல்பான தமிழில் தருகிறது; மூலத்தில் உள்ள பொருள் வாய்ப்புகளை அடிக்குறிப்பு வெளிப்படுத்துகிறது.
- source_word: אֵין עֹשֵׂה טוֹב
  choice: நன்மை செய்பவன் ஒருவனும் இல்லை
  rationale: நன்மை செய்கிறவர் யாரும் இல்லை என்ற பங்கேற்பு வினை அமைப்பின் பொதுமையான மறுப்பைத் தெளிவாகவும் மூலத்துக்கு நெருக்கமாகவும் தருகிறது.
theological_decisions:
- issue: ஒருமை ‘மூடன்’ என்பதிலிருந்து பன்மை வினைகளுக்கு மாறுதல்
  choice: முதல் கூற்றில் ஒருமையையும், அடுத்த கூற்றில் ‘அவர்கள்’ என்ற பன்மையையும் காத்தல்
  alternative: முழுவதையும் ஒருமையாக்குதல் அல்லது தொடக்கத்திலிருந்தே ‘மூடர்கள்’ என்று பொதுமைப்படுத்துதல்
  rationale: எபிரெய உரை பிரதிநிதியான ஒரே ‘மூடன்’ என்பதிலிருந்து அத்தகைய மக்களின் கூட்டத்துக்குத் திட்டமிட்டு மாறுகிறது. அந்தச் சொல்லாட்சிசார் விரிவை ஒத்திசைத்து மறைக்காமல் மொழிபெயர்ப்பு காக்கிறது.
- issue: பிரதிநிதி ஒருமையில் பாலின வெளிப்பாடு
  choice: ‘தன் உள்ளத்தில்’ என்ற இயல்பான தற்சுட்டுப் பெயரைப் பயன்படுத்துதல்
  alternative: ‘அவர்களுடைய உள்ளத்தில்’ என்று பன்மையாக்குதல்
  rationale: தமிழின் ‘தன்’ மூலத்திலுள்ள ஒருமைத் தொடர்பைத் துல்லியமாகக் காக்கிறது; தேவையற்ற ஆண்பால் மீளுருவாக்கமின்றி இலக்கண ரீதியாக இயல்பாக உள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘உள்ளம்’ என்ற மூலப் படிமமும் ஒருமையிலிருந்து பன்மைக்கு வரும் சொல்லாட்சிசார் மாறுதலும் காக்கப்பட்டுள்ளன. அடிக்குறிப்பு குறியீடு அது விளக்கும் எபிரெய தொடருக்குப் பின்னர் வைக்கப்பட்டுள்ளது.
