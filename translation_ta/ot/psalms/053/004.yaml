  text: Do not the workers of wickedness know—those who eat up my people as they eat bread? They do not call on God[a][b][c].
translation:
  language: ta
  text: என் மக்களை அப்பம் உண்பதுபோல் விழுங்குகிற அக்கிரமம் செய்பவர்கள் அறியவில்லையா? அவர்கள் கடவுளை நோக்கிக் கூப்பிடுவதில்லை.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொற்படி: “என் மக்களை உண்கிறவர்கள்; அவர்கள் அப்பம் உண்கிறார்கள்.” கடவுளுடைய மக்களை அன்றாட உணவை உண்பதுபோல எளிதாக விழுங்குகிறார்கள் என்பதே கருத்து.'
    reason: lexical_alternative
  - marker: b
    text: “என் மக்கள்” என்று கடவுள் பேசுவதாகவும், சங்கீதக்காரர் பேசுவதாகவும் புரிந்துகொள்ளலாம்; இங்கு பேசுபவர் யார் என்பதை எபிரெயம் வெளிப்படையாகக் குறிப்பிடவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: הֲלֹא יָדְעוּ
  choice: அறியமாட்டார்களா
  rationale: எதிர்பார்க்கப்படும் பதில் ‘ஆம்’ என்பதாக இருக்கும் எபிரெய மறுப்புக் கேள்வியின் வலிமையை இயல்பான தமிழில் தக்கவைக்கிறது; சூழலில் இது பொதுவான நடத்தை குறித்த கேள்வி.
- source_word: פֹּעֲלֵי אָוֶן
  choice: அக்கிரமம் செய்கிறவர்கள்
  rationale: ‘தீமை/அக்கிரமத்தைச் செய்கிறவர்கள்’ என்ற இணைப்பின் ஒழுக்க வலிமையைத் தக்கவைத்து, இன்றைய வாசகர்களுக்கு இயல்பாக உள்ளது.
- source_word: אֹכְלֵי עַמִּי
  choice: என் மக்களை ... விழுங்குகிறவர்கள்
  rationale: אכל என்பதன் உண்ணும் உருவகத்தை ‘விழுங்கு’ தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்தி, கொள்ளையடிக்கும் ஒடுக்குமுறையை உணர்த்துகிறது.
- source_word: אָכְלוּ לֶחֶם
  choice: அப்பம் சாப்பிடுவதுபோல்
  rationale: எபிரெயத்தில் அடுத்தடுத்து நிற்கும் ‘என் மக்களை உண்கிறவர்கள்; அப்பம் உண்டார்கள்’ என்ற சொற்களின் உவமைப் பொருளைத் தமிழில் தெளிவாக்குகிறது; அதன் சொற்படி அமைப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אֱלֹהִים לֹא קָרָאוּ
  choice: அவர்கள் கடவுளை நோக்கிக் கூப்பிடுவதில்லை
  rationale: קרא என்பதன் இச்சூழல் பொருளான கடவுளை அழைத்தல்/வேண்டுதல் என்பதைக் காட்டுகிறது; நிகழ்காலம் அவர்களின் வழக்கமான குணத்தை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘என் மக்கள்’ என்பதில் பேசுபவர் யார்
  choice: ‘என் மக்கள்’ என்பதையே வைத்துப் பேசுபவரைத் தீர்மானிக்காமல் விடுதல்
  alternative: இது நேரடியாகக் கடவுள் பேசுவது என்று குறிப்பிடுதல்; அல்லது சங்கீதக்காரர் நீதிமான்களின் சார்பில் பேசுவதாகத் தெளிவுபடுத்துதல்
  rationale: எபிரெயத்தில் முதலாம் நபர் ஒருமை பின்னொட்டு உள்ளது; ஆனால் இவ்வரிக்குள் பேசுபவர் வெளிப்படையாக அடையாளப்படுத்தப்படவில்லை. எனவே மூலத்தின் உண்மையான தெளிவின்மை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழ்; பொதுவாசகருக்குப் புரியும் இயல்பான, கண்ணியமான நடை. ‘அக்கிரமம்’, ‘விழுங்கு’, ‘கடவுளை நோக்கிக் கூப்பிடு’ ஆகியவை மூல உருவகத்தையும் சமயச் சூழலையும் காக்கின்றன. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
