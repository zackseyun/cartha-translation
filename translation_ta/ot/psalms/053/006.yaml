base_translation:
  language: en
  yaml_path: translation/ot/psalms/053/006.yaml
  text: Oh[a], that the salvation of Israel would come out of Zion! When God restores the fortunes of his people, let Jacob rejoice; let Israel be glad.
translation:
  language: ta
  text: இஸ்ரவேலின் மீட்பு சீயோனிலிருந்து வந்தால் எவ்வளவு நன்றாயிருக்கும்! கடவுள் தம் மக்களின் நல்வாழ்வை மீட்டுத் தரும்போது[a], யாக்கோபு களிகூரட்டும்; இஸ்ரவேல் மகிழட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுள் தம் மக்களைச் சிறையிருப்பிலிருந்து திரும்பக் கொண்டுவரும்போது” அல்லது “கடவுள் சிறைப்பட்ட தம் மக்களை மீட்டெடுக்கும்போது.” இந்த எபிரேய மரபுத்தொடர் பொதுவாகத் துன்பநிலையிலிருந்து மீட்டெடுப்பதைக் குறிக்கலாம்; சிறையிருப்பிலிருந்து திரும்புவதும் இதில் அடங்கும்.
    reason: alternative_reading
lexical_decisions:
- source_word: מִי יִתֵּן
  choice: வந்தால் எவ்வளவு நன்றாயிருக்கும்!
  rationale: இது நேரடியான கேள்வி அல்ல; தீவிரமான ஏக்கத்தையும் விருப்பத்தையும் வெளிப்படுத்தும் எபிரேய மரபுத்தொடர். நவீன தமிழில் இயல்பாக அந்த விருப்பநிலையைத் தெரிவிக்கிறது.
- source_word: מִצִּיּוֹן
  choice: சீயோனிலிருந்து
  rationale: מִן என்னும் முன்னிடைச்சொல் தோற்றுவாய் அல்லது புறப்படும் இடத்தைக் குறிக்கிறது; ‘சீயோனிலிருந்து’ தமிழில் இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: יְשֻׁעוֹת
  choice: மீட்பு
  rationale: வடிவத்தில் பன்மையாக இருந்தாலும், இங்கு தீவிர அல்லது கருத்துப் பன்மையாக இருந்து இஸ்ரவேலுக்கான விடுதலையை ஒருமைக் கருத்தாகக் குறிக்கிறது.
- source_word: בְּשׁוּב אֱלֹהִים שְׁבוּת עַמּוֹ
  choice: கடவுள் தம் மக்களின் நல்வாழ்வை மீட்டுத் தரும்போது
  rationale: בְּשׁוּב காலச் சூழலைக் குறிக்கிறது. שׁוּב שְׁבוּת என்ற மரபுத்தொடர் சிறையிருப்பிலிருந்து திரும்புதலை உள்ளடக்கக்கூடும்; ஆனால் பொதுவாகத் துன்பநிலையை மாற்றி மீண்டும் நல்வாழ்வளிப்பதையும் குறிக்கிறது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: மூலத்தில் יהוה அல்ல, אֱלֹהִים உள்ளது; ஆகவே ‘கடவுள்’ என மொழிபெயர்க்கப்படுகிறது.
- source_word: יָגֵל יַעֲקֹב
  choice: யாக்கோபு களிகூரட்டும்
  rationale: தொடக்க ஏக்கத்தின் வேண்டுதல் தொனியைத் தொடர்ந்து, yiqtol வடிவம் விருப்பம் அல்லது வேண்டுதலாக மொழிபெயர்க்கப்படுகிறது.
- source_word: יִשְׂמַח יִשְׂרָאֵל
  choice: இஸ்ரவேல் மகிழட்டும்
  rationale: இணைவரிசையின் பொருளொற்றுமையையும் சொல்வேறுபாட்டையும் காக்க, יָגֵל என்பதிலிருந்து வேறுபட்ட இயல்பான தமிழ் வினை பயன்படுத்தப்படுகிறது.
theological_decisions:
- issue: שׁוּב שְׁבוּת என்ற மீட்பு மரபுத்தொடரின் பொருள்
  choice: தம் மக்களின் நல்வாழ்வை மீட்டுத் தரும்போது
  alternative: தம் மக்களைச் சிறையிருப்பிலிருந்து திரும்பக் கொண்டுவரும்போது / சிறைப்பட்ட தம் மக்களை மீட்டெடுக்கும்போது
  rationale: இந்த எபிரேய மரபுத்தொடர் சிறையிருப்பிலிருந்து வரலாற்று ரீதியான திரும்புதலைக் குறிக்கக்கூடும்; அதேவேளையில் துன்பநிலையைப் பொதுவாக மாற்றியமைத்து மீட்டெடுப்பதையும் குறிக்கிறது. பிரதான உரை பரந்த பொருளைக் கொடுக்கிறது; குறுகிய, நேரடியான மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘களிகூரட்டும் / மகிழட்டும்’ என்ற சொல் வேறுபாடு எபிரேய இணைவரிசையின் நுணுக்கத்தைப் பாதுகாக்கிறது; ‘தம்’ என்பது கடவுளைச் சுட்டும் இயல்பான மரியாதைத் தற்சுட்டுப்பெயர்.
