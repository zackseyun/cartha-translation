  text: His mouth is full of cursing and deceit and oppression[b][a]; under his tongue are trouble and wickedness.
translation:
  language: ta
  text: 'அவனுடைய வாய் சாபத்தாலும்[a] வஞ்சகத்தாலும் ஒடுக்குதலாலும் நிறைந்திருக்கிறது;

    அவனுடைய நாவின்கீழ் தீங்கும் அக்கிரமமும்[b] உள்ளன.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சாபம்’ என்பதற்குப் பதிலாக ‘சபித்தல்’ என்றும் மொழிபெயர்க்கலாம். எபிரேயப் பெயர்ச்சொல் சில சூழல்களில் ‘ஆணை’ என்றும் பொருள்படும்; ஆனால் இங்குள்ள பகைமை நிறைந்த பேச்சுச் சூழல் ‘சாபம்’ என்ற பொருளை ஆதரிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘தீங்கும் அக்கிரமமும்’ என்பதற்குப் பதிலாக ‘துன்பமும் தீமையும்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָלָה
  choice: சாபம்
  rationale: பகைமையும் தீங்கிழைக்கும் பேச்சும் இடம்பெறும் இச்சூழலில், நடுநிலையான ‘ஆணை’ என்பதைவிடச் சபித்தலைக் குறிக்கும் ‘சாபம்’ பொருத்தமானது.
- source_word: פִּיהוּ
  choice: அவனுடைய வாய்
  rationale: பேச்சு வாயிலிருந்து வருவதாகக் காட்டும் எபிரேய உருவகத்தை நேரடியாகப் பாதுகாக்கிறது.
- source_word: מָלֵא
  choice: நிறைந்திருக்கிறது
  rationale: மிகுதியாக இருப்பதைக் குறிக்கும் நிலையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: מִרְמוֹת
  choice: வஞ்சகம்
  rationale: ஏமாற்றத்தையும் துரோகமான நடத்தையையும் குறிக்கும் சொல்லுக்கு இயல்பான, சுருக்கமான இணைச்சொல்.
- source_word: תֹךְ
  choice: ஒடுக்குதல்
  rationale: பிறருக்குத் தீங்கிழைக்கும் சுரண்டலையும் அடக்குமுறையையும் இச்சூழலில் தெளிவாக எடுத்துரைக்கிறது.
- source_word: תַּחַת לְשׁוֹנוֹ
  choice: அவனுடைய நாவின்கீழ்
  rationale: மறைந்திருக்கும் தீய பேச்சையோ நோக்கத்தையோ சித்தரிக்கும் மூலமொழியின் வலுவான உருவகத்தைப் பாதுகாக்கிறது.
- source_word: עָמָל
  choice: தீங்கு
  rationale: இங்கு சாதாரண உழைப்பைக் குறிக்காமல், பொல்லாதவன் விளைவிக்கும் கேட்டையும் துன்பத்தையும் குறிக்கிறது.
- source_word: אָוֶן
  choice: அக்கிரமம்
  rationale: தீமை, குற்றம், ஒழுக்கக்கேடு ஆகியவற்றை உணர்த்தும் மூலச்சொல்லின் அறநெறிசார் கனத்தைப் பாதுகாக்கிறது.
