  text: Why[a], Yahweh, do you stand far away? Why do you hide yourself in times of trouble?
translation:
  language: ta
  text: 'யாவே, ஏன் தொலைவில் நிற்கிறீர்?


    நெருக்கடியான காலங்களில் ஏன் தம்மை மறைத்துக்கொள்கிறீர்?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நெருக்கடியான காலங்களில் ஏன் தம்மை ஒளித்துக்கொள்கிறீர்?”
    reason: תַּעְלִים என்பதற்கு ‘மறைத்துக்கொள்கிறீர்’ மற்றும் ‘ஒளித்துக்கொள்கிறீர்’ இரண்டும் சூழலுக்கு ஏற்ற நெருங்கிய சொல்லாக்கங்கள்; இரண்டும் இறைவன் தம்மை அணுக முடியாதபடி மறைத்துக்கொள்வதாகப் புலம்புபவர் உணர்வதைத் தருகின்றன.
lexical_decisions:
- source_word: לָמָה
  choice: ஏன்
  rationale: எபிரேயப் புலம்பலின் நேரடியான கேள்வியையும் உணர்ச்சி வேகத்தையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், எபிரேய நான்கெழுத்துப் பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பாகத் தருகிறது.
- source_word: תַּעֲמֹד
  choice: நிற்கிறீர்
  rationale: עמד என்பதன் அடிப்படைப் பொருளான ‘நில்’ என்பதையும், இறைவன் தொலைவில் இருப்பதாகப் புலம்புபவர் உணரும் இடவியல் உருவகத்தையும் காக்கிறது.
- source_word: בְּרָחוֹק
  choice: தொலைவில்
  rationale: உணரப்படும் இறைத் தொலைவைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: תַּעְלִים
  choice: உம்மை மறைத்துக்கொள்கிறீர்
  rationale: இங்கு மறைந்திருத்தல் அல்லது தம்மை மறைத்துக்கொள்ளுதல் என்ற வினையின் கருத்தை இயல்பான தமிழில் தருகிறது.
- source_word: לְעִתּוֹת
  choice: காலங்களில்
  rationale: עת என்பதன் பன்மை வடிவத்தையும் அதன் காலப் பொருளையும் காக்கிறது.
- source_word: בַּצָּרָה
  choice: நெருக்கடியான
  rationale: צָרָה குறிக்கும் இடுக்கண், துன்பம், நெருக்கடி ஆகிய பரந்த பொருள்களில் சூழலுக்கு ஏற்ற, நவீன வாசகருக்குத் தெளிவான சொல்லைத் தேர்ந்தெடுக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் ஒரு பட்டம் அல்ல, இறைத் திருப்பெயரே உள்ளது; ஆகவே அதை ஒலிபெயர்த்து, பெயர்–பட்டம் வேறுபாட்டைக் காக்கிறது.
- issue: இரண்டாம் அடியில் கேள்விச்சொல்லை மீண்டும் வெளிப்படையாக வழங்குதல்
  choice: ‘ஏன்’ என்பதை மீண்டும் வழங்குதல்
  alternative: ‘நெருக்கடியான காலங்களில் உம்மை மறைத்துக்கொள்கிறீர்’ என்று வாக்கியமாக விடுதல்
  rationale: இரண்டாம் அடியில் לָמָה மீண்டும் எழுதப்படவில்லை என்றாலும், எபிரேய இணைநிலைக் கவிதை அமைப்பு அதை முதல் கேள்வியின் தொடர்ச்சியாக உணர்த்துகிறது; தமிழில் ‘ஏன்’ என்பதை மீண்டும் வழங்குவது புலம்பலின் விசையைக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான, மரியாதைமிக்க தமிழ். கவிதை இணைநிலையை இரு அடிகளாக வைத்துள்ளது. இறைவனை நோக்கிய மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது; மொழி எளிமையாக இருந்தாலும் புலம்பலின் நேரடித்தன்மையும் இடவியல் உருவகமும் காக்கப்பட்டுள்ளன.
