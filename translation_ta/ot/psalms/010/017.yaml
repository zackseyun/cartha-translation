    text: அல்லது, “ஆயத்தப்படுத்துவீர்” அல்லது “நிலைநிறுத்துவீர்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּאֲוַת
  choice: ஏக்கம்
  rationale: இந்தப் பெயர்ச்சொல் விருப்பம் அல்லது ஆழ்ந்த ஏக்கத்தைக் குறிக்கிறது. சங்கீதத்தின் மன்றாட்டு சூழலில் ‘ஏக்கம்’ இயல்பாகவும் உணர்வின் ஆழத்தை மிகைப்படுத்தாமலும் அமைகிறது.
- source_word: עֲנָוִים
  choice: தாழ்மையானவர்கள்
  rationale: இச்சொல் தாழ்மையானவர்கள், சாந்தமானவர்கள், அல்லது ஒடுக்கப்பட்டவர்கள் எனப் பொருள்படலாம். சுற்றுப்பின்னணியில் ஒடுக்கப்பட்ட ஏழைகள் நோக்கப்பட்டாலும், மூலச்சொல்லின் தாழ்மை சார்ந்த பொருள் குறுகிவிடாதபடி ‘தாழ்மையானவர்கள்’ என மொழிபெயர்க்கப்படுகிறது.
- source_word: שָׁמַעְתָּ
  choice: நீர் கேட்டிருக்கிறீர்
  rationale: இறைவனை முன்னிலைப்படுத்திப் பேசும் நிறைவுற்ற வினை. முடிந்த செயல் இப்போதும் பொருத்தமுடையது என்பதை ‘கேட்டிருக்கிறீர்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், எபிரெய தனிப்பெயரின் தமிழில் வழக்கமான ஒலிபெயர்ப்பாக ‘யாவே’ பயன்படுத்தப்படுகிறது.
- source_word: תָּכִין
  choice: உறுதிப்படுத்துவீர்
  rationale: כון என்பதன் ஹிஃபில் வடிவம் ஆயத்தப்படுத்துதல், நிலைநிறுத்துதல், உறுதியாக்குதல் ஆகிய பொருள்களைத் தரலாம். ‘இதயம்’ என்பதோடு ‘உறுதிப்படுத்துவீர்’ என்பது உறுதியாக்கும் கருத்தை இயல்பாகத் தருகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: לִבָּם
  choice: அவர்களுடைய இதயம்
  rationale: எபிரெய வேதாகமத்தில் மையமான மனித அகநிலைக் குறியீடாகிய ‘இதயம்’ விளக்கிப் பொருள்மாற்றப்படாமல் தக்கவைக்கப்படுகிறது.
- source_word: תַּקְשִׁיב
  choice: கவனித்துக் கேட்கும்
  rationale: קשׁב என்பதன் ஹிஃபில் வடிவம் செவிசாய்த்து உன்னிப்பாகக் கேட்பதைக் குறிக்கிறது. ‘கவனித்துக் கேட்கும்’ அந்தக் கருத்தை தெளிவாக வெளிப்படுத்துகிறது.
- source_word: אָזְנֶךָ
  choice: உமது செவி
  rationale: மூலத்தின் உருவகமான உடற்கூறு மொழியைத் தட்டையாக்காமல், ‘உமது செவி’ என்ற கவித்துவ உருவகம் தக்கவைக்கப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: வசனம் יהוה என்ற தனிப்பெயரை நேரடியாகப் பயன்படுத்துவதால், அதை ஒரு பட்டத்தால் மாற்றாமல் ‘யாவே’ என ஒலிபெயர்ப்பது மூலத்தின் தனிப்பெயர்த் தன்மையைப் பாதுகாக்கிறது.
- issue: עֲנָוִים என்பதன் சூழல்சார் பொருள்
  choice: தாழ்மையானவர்கள்
  alternative: ஒடுக்கப்பட்டவர்கள் / சாந்தமானவர்கள்
  rationale: சங்கீதத்தின் சூழல் ஒடுக்கப்பட்டவர்களைப் பற்றியது; எனினும் இச்சொல் தாழ்மை அல்லது சாந்தம் என்ற பொருளையும் தாங்குகிறது. ‘தாழ்மையானவர்கள்’ அந்தப் பொருள் இழுபறியைத் தீர்த்துவிடாமல் பாதுகாக்கிறது.
- issue: תָּכִין என்பதன் பொருள்
  choice: உறுதிப்படுத்துவீர்
  alternative: ஆயத்தப்படுத்துவீர் / நிலைநிறுத்துவீர்
  rationale: வினைச்சொல் பல பொருட்களை அனுமதிக்கிறது. ‘இதயம்’ என்பதோடு உறுதியாக்கும் பொருள் சூழலுக்கு ஏற்றது; ஆனால் ஆயத்தப்படுத்தும் பொருளும் உண்மையான மாற்றாக அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளை சங்கீதத்துக்குரிய கண்ணியமான கவித்துவ நடையில் அமைக்கப்பட்டது. இறைவனுக்கான மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது; ‘உமது செவி’ என்ற எபிரெயக் கவித்துவ உருவகம் தக்கவைக்கப்பட்டுள்ளது.
