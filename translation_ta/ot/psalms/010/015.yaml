  text: Break the arm of the wicked and evil man[a]; seek out his wickedness until you find none.
translation:
  language: ta
  text: பொல்லாத, தீயவனின் புயத்தை முறித்துப்போடும்; அவனுடைய தீமையைத் தேடிப்பாரும்; ஒன்றும் காணப்படாதவரை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பொல்லாதவனின் புயத்தை முறித்துப்போடும்; தீமை செய்கிறவனின் தீமையைத் தேடிப்பாரும்; ஒன்றும் காணப்படாதவரை.” இரண்டாவது விளக்கத்தை ‘தீமை செய்கிறவன்’ என்றும், இறுதித் தொடரை ‘ஒன்றும் காணப்படாதபடி’ என்றும் எபிரெயத்தில் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁבֹר
  choice: முறித்துப்போடும்
  rationale: இது தேவனை நோக்கிய நேரடியான வேண்டுகோள். வினையின் வலிமையைக் காத்து, தமிழில் இயல்பான வேண்டுகோள் வடிவில் தரப்பட்டுள்ளது.
- source_word: זְרוֹעַ
  choice: புயம்
  rationale: எபிரெயச் சொல் நேரடியாக ‘புயம்/கை’ என்பதைக் குறிக்கிறது; இங்கு அது பொல்லாதவனின் வல்லமையையும் தீங்கு செய்யும் ஆற்றலையும் உருவகப்படுத்துகிறது. உருவகம் மொழிபெயர்ப்பில் காக்கப்பட்டுள்ளது.
- source_word: רָשָׁע
  choice: பொல்லாதவன்
  rationale: தீய நடத்தையுடைய ஒருவனைப் பெயர்ச்சொல் தன்மையில் குறிக்கும் ஒருமைச் சொல்.
- source_word: וָרָע
  choice: தீயவன்
  rationale: רָשָׁע என்பதற்கு இணையாக நிற்கும் இரண்டாவது விளக்கமாக எடுத்துக்கொள்ளப்பட்டுள்ளது; இதை ‘தீமை செய்கிறவன்’ என்றும் புரிந்துகொள்ளலாம்.
- source_word: תִּדְרוֹשׁ
  choice: தேடும்
  rationale: דרשׁ என்பதன் ‘தேடு, விசாரி’ என்ற அடிப்படைப் பொருளை நேரடியாகக் காக்கிறது; சூழலில் நீதித்தீர்ப்புக்காகத் தீமையை முழுமையாக விசாரிக்கும் கருத்தும் உள்ளது.
- source_word: רִשְׁעוֹ
  choice: அவனுடைய தீமை
  rationale: மூலச்சொல்லின் ‘பொல்லாப்பு/தீமை/குற்றம்’ என்ற பொருள் வரம்பில், நவீன வாசகருக்கு இயல்பான சொல்லாக ‘தீமை’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
- source_word: בַל תִּמְצָא
  choice: ஒன்றும் காணப்படாதவரை
  rationale: தேவனுடைய தேடுதலுக்குப் பின் தீமை எதுவும் எஞ்சாத விரும்பிய முடிவை வெளிப்படுத்துகிறது; ‘காணப்படாதபடி’ என்ற விளைவுப் பொருளும் எபிரெயில் சாத்தியம்.
theological_decisions:
- issue: பொல்லாதவனின் ‘புயம்’ என்ற உருவகத்தை எவ்வாறு மொழிபெயர்ப்பது
  choice: ‘புயம்’ என்ற உடல் உறுப்பின் உருவகத்தை முதன்மை உரையில் காத்தல்
  alternative: ‘வல்லமை’ அல்லது ‘பலத்தை’ என்று கருத்தை மட்டும் வெளிப்படுத்தல்
  rationale: வேண்டுதல் ஒடுக்குகிறவனின் தீங்கு செய்யும் ஆற்றலை ஒழிக்கும்படி தேவனிடம் கோருகிறது. ஆனால் எபிரெயக் கவிதையின் தெளிவான உடல் உருவகத்தை மாற்றாமல் காப்பது வாசகருக்கு அந்தப் பொருளை உணர இடமளிக்கிறது.
- issue: בַל תִּמְצָא என்ற இறுதித் தொடரின் தொடர்பு
  choice: தேடுதல் ஒன்றும் காணப்படாதவரை தொடர்வதாக மொழிபெயர்த்தல்
  alternative: ‘ஒன்றும் காணப்படாதபடி’ அல்லது ‘தேடினாலும் காணமாட்டீர்’
  rationale: இது தீமை முழுமையாகக் கணக்கிடப்பட்டு ஒழிக்கப்பட வேண்டும் என்ற வேண்டுதலின் முடிவைக் குறிக்கலாம். கால எல்லை மற்றும் விளைவு ஆகிய இரு நுணுக்கங்களையும் முற்றிலும் தீர்மானிக்காமல், முதன்மை உரையும் அடிக்குறிப்பும் சேர்ந்து வெளிப்படுத்துகின்றன.
translation_notes:
  register: நவீன பொதுத் தமிழில், சங்கீத வேண்டுதலுக்கேற்ற கண்ணியமான நேரடி நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘புயம்’ என்பது கவிதை உருவகத்தைத் தக்கவைக்கும் இலக்கியத் தன்மையுள்ள, ஆனால் புரிந்துகொள்ளக்கூடிய சொல். ‘தேடும்’ என்ற மரியாதை வேண்டுகோள் வடிவம் தேவனை நோக்கிய உரைக்கு ஏற்றது.
