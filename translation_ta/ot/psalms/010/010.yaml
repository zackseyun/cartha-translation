  source_fidelity: மூல எபிரெயத்தின் கடினமான, சுருக்கமான தொடரமைப்பை மொழிபெயர்ப்பு நேர்மையாகக் கையாள்கிறது. וְדָכָה மற்றும் יָשֹׁחַ ஆகியவற்றின் தாழ்ந்து பதுங்கும்/குனியும் வேட்டையாடும் தோற்றம் “அவன் பதுங்கிக் குனிகிறான்” என்பதில் இயல்பாக வெளிப்படுகிறது. חלכאים-ஐ “ஆதரவற்றவர்கள்” எனவும், விவாதத்திற்குரிய בַּעֲצוּמָיו-ஐ சூழலுக்கேற்ற “அவனுடைய வலிமையால்” எனவும் வழங்குவது பாதுகாப்பானது. வினை ஒருமை வடிவத்தின் மாற்றுவாசிப்பு அடிக்குறிப்பில் காக்கப்பட்டுள்ளது.
  naturalness: நவீனத் தரமான தமிழில் நடை சுருக்கமாகவும் கண்ணியமாகவும் உள்ளது. “பதுங்கிக் குனிகிறான்” என்பது இரண்டு எபிரெய வினைகளையும் தனித்தனியாகத் துல்லியமாகப் பிரதிபலிக்காவிட்டாலும், இச்சூழலில் ஒரே தாழ்ந்த, இரையை நோக்கும் செயலை இயல்பாகச் சித்தரிக்கிறது. “ஆதரவற்றவர்கள் வீழ்கிறார்கள்” தெளிவானதும் வாசிப்புக்கு இயல்பானதும் ஆகும்.
  terminology: “வலிமை,” “ஆதரவற்றவர்கள்,” மற்றும் “வீழ்கிறார்கள்” ஆகியவை பொதுவாசகர்களுக்குப் புரியும் நவீனத் தமிழ்ச் சொற்கள். எபிரெயத்தின் உரை/பொருள் நிச்சயமின்மையை அடிக்குறிப்பு தக்கவைத்துள்ளது; எந்தக் குறிப்பிட்ட இறையியல் விளக்கத்தையும் திணிக்கவில்லை.
