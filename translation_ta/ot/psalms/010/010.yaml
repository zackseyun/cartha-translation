lexical_decisions:
- source_word: ו/דכה
  choice: அவன் பதுங்கி
  rationale: மெய்யெழுத்து வடிவம் கடினமானது. சுற்றியுள்ள வேட்டையாடும் உருவகத்திலும் அடுத்த வினையுடனும் இணைத்து, தீயவன் இரையைப் பிடிக்கத் தாழ்ந்து பதுங்கும் நிலையாக மொழிபெயர்க்கப்பட்டது.
- source_word: יָשֹׁחַ
  choice: குனிகிறான்
  rationale: தாழ்ந்து குனிதல் அல்லது கீழே சாய்தல் என்பதே வினையின் இயல்பான பொருள்; உடல் நிலையைச் சித்தரிக்கும் உருவகம் இவ்வாறு காக்கப்படுகிறது.
- source_word: וְ/נָפַל ... חלכאים
  choice: ஆதரவற்றவர்கள் வீழ்கிறார்கள்
  rationale: வினை இலக்கண வடிவில் மூன்றாம் நபர் ஆண்பால் ஒருமையாக இருந்தாலும், வசனத்தின் சுருக்கமான, கடினமான தொடரமைப்பில் חלכאים என்பதையே பொருள் சார்ந்த எழுவாயாகக் கொள்வது உடனடிச் சூழலுக்கு நன்கு பொருந்துகிறது. தமிழில் இயல்பாகப் பன்மை வினை பயன்படுத்தப்பட்டது.
- source_word: בַּ/עֲצוּמָיו
  choice: அவனுடைய வலிமையால்
  rationale: சொல்லுருவம் நேரடியாக ‘அவனுடைய வலிமையானவர்கள்’ எனப் புரியக்கூடியதாயினும், இங்கு தீயவனுடைய ஆற்றலைக் குறிக்கும் கருத்துப் பன்மையாக எடுத்துக்கொள்வது தெளிவாகவும் சூழலுக்கு ஏற்றதாகவும் உள்ளது.
- source_word: חלכאים
  choice: ஆதரவற்றவர்கள்
  rationale: பலவீனமான, துன்புற்ற, தங்களைத் தாங்களே காத்துக்கொள்ள இயலாத மக்களைச் சுட்டுகிறது; ‘ஆதரவற்றவர்கள்’ என்பது சமூகப் பாதிப்பையும் எளிய நவீன தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
