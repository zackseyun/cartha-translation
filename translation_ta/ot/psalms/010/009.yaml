translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. மூல எபிரெயத்தில் வரும் வினைச்சொல் மற்றும் ‘ஏழை’ என்ற பெயர்ச்சொல்லின் மறுமொழி பாதுகாக்கப்பட்டுள்ளது; இறுதி தொடரின் கருவி/உடன்நிகழ்வு சார்ந்த இலக்கணத் தெளிவின்மை அடிக்குறிப்பில் தரப்பட்டுள்ளது.
