base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/009.yaml
  text: He lies in wait in hiding[a], like a lion in his lair; he lies in wait to seize the poor[c][b]; he seizes the poor when he drags him into his net.
translation:
  language: ta
  text: 'அவன் மறைவில்[a] பதுங்கிக் காத்திருக்கிறான்;

    தன் பதுங்கிடத்தில் இருக்கும் சிங்கம்போல,

    ஏழையைப் பறித்துக்கொள்ளப் பதுங்கிக் காத்திருக்கிறான்;

    தன் வலையில் அவனை இழுத்து, ஏழையைப் பறித்துக்கொள்கிறான்.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இரகசியமாக.’
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘அவனைத் தன் வலைக்குள் இழுப்பதன் மூலம்’ அல்லது ‘தன் வலையால்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶאֱרֹב
  choice: பதுங்கிக் காத்திருக்கிறான்
  rationale: ארב என்பது தாக்குவதற்காக மறைந்து காத்திருப்பதைக் குறிக்கிறது. வினைச்சொல் எபிரெயத்தில் இருமுறை வருவதால், கவிதை வலிமைக்காகத் தமிழிலும் அதே சொற்றொடர் இருமுறை வைக்கப்பட்டுள்ளது.
- source_word: בַּמִּסְתָּר
  choice: மறைவில்
  rationale: מִסְתָּר மறைவான இடத்தையோ இரகசிய நிலையையோ குறிக்கலாம். ‘மறைவில்’ என்பது இரையைக் குறிவைத்த ஒளிவை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: כְּאַרְיֵה
  choice: சிங்கத்தைப் போல
  rationale: வேட்டையாடும் ஆபத்தான விலங்கு என்ற மூல உருவகத்தை நேரடியாகப் பாதுகாக்கிறது.
- source_word: בְסֻכֹּה
  choice: தன் பதுங்கிடத்தில்
  rationale: סֻכָּה குடில், மறைவிடம், அல்லது புதரடர்ந்த ஒளிவிடம் ஆகியவற்றைக் குறிக்கலாம். சிங்க உருவகத்தின் சூழலில் ‘பதுங்கிடம்’ வேட்டைக்காக ஒளிந்திருக்கும் இடத்தை இயல்பாக உணர்த்துகிறது.
- source_word: לַחֲטוֹף / יַחְטֹף
  choice: பிடிக்க / பிடிக்கிறான்
  rationale: חטף திடீரெனவும் வலுக்கட்டாயமாகவும் கைப்பற்றுவதைக் குறிக்கிறது. ஒரே எபிரெய வேர் மீண்டும் வருவதால் தமிழிலும் ‘பிடி’ என்ற ஒரே வேரைத் தொடர்வது கவிதை மறுமொழியைப் பாதுகாக்கிறது.
- source_word: עָנִי
  choice: ஏழை
  rationale: עָנִי ஏழை, ஒடுக்கப்பட்டவர், அல்லது துன்புறுபவர் எனப் பொருள்படலாம். சங்கீதம் 10-இன் சமூக ஒடுக்குமுறைச் சூழலில் ‘ஏழை’ நேரடியான தேர்வு; அதேவேளை அவரது பாதுகாப்பற்ற நிலையையும் உணர்த்துகிறது.
- source_word: בְּמָשְׁכוֹ בְרִשְׁתּוֹ
  choice: தன் வலையில் அவனை இழுத்து
  rationale: בְּ முன்னொட்டு வழிமுறையையோ உடன்நிகழும் செயலையோ குறிக்கலாம். தமிழ் வாக்கியம் வலையில் இழுக்கும் செயலைத் தெளிவாகக் காட்டுகிறது; மூலத்தின் இலக்கணத் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
