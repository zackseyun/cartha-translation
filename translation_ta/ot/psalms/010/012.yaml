lexical_decisions:
- source_word: קוּמָה
  choice: எழுந்தருளும்
  rationale: தேவனை நோக்கிய அவசரமான கட்டளையைக் கண்ணியமான, இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான நான்கெழுத்துத் திருப்பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אֵל
  choice: இறைவனே
  rationale: יְהוָה என்பதற்கு இணையான நேரடி விளிப்பாக உள்ள אֵל என்பதைத் தமிழில் இயல்பான விளிவடிவில் தருகிறது.
- source_word: נְשָׂא יָדֶךָ
  choice: உமது கையை உயர்த்தும்
  rationale: செயல்படத் தயாராவதைக் குறிக்கும் கை பற்றிய உறுதியான கவித்துவப் படிமத்தை விளக்கிப் பொருளாக்காமல் தக்கவைக்கிறது.
- source_word: אַל תִּשְׁכַּח
  choice: மறந்துவிடாதேயும்
  rationale: எதிர்மறை வேண்டுகோளின் நேரடியான பொருளையும் தேவனை நோக்கிய மரியாதையான தொனியையும் காக்கிறது.
- source_word: עניים
  choice: துன்புறுவோரை
  rationale: சூழலில் பொல்லாதவர்களால் பாதிக்கப்படும் எளிய, தாழ்த்தப்பட்ட, பாதுகாப்பற்ற மக்களைக் குறிக்கும் சொல்லின் பரந்த பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற திருப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் ஒரு பொதுப் பட்டம் அல்ல, தேவனுடைய தனிப்பெயர் நேரடியாக உள்ளது; ஆகவே அதனைப் பட்டத்தால் மாற்றாமல் ஒலிபெயர்க்கப்படுகிறது.
- issue: தேவனுடைய ‘கை’ என்ற படிமம்
  choice: உமது கையை உயர்த்தும்
  alternative: செயல்பட எழுந்தருளும்
  rationale: நியாயந்தீர்க்கவோ விடுவிக்கவோ தேவன் செயல்பட வேண்டும் என்ற உட்பொருள் இருந்தாலும், மூலத்தின் மனிதவுருவக் கவித்துவப் படிமம் விளக்கமாக மாற்றப்படாமல் தக்கவைக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீத வேண்டுதலுக்கேற்ற கண்ணியமான விளி மற்றும் மரியாதை வினைமுற்றுகள் பயன்படுத்தப்பட்டுள்ளன. கவித்துவ இணைநிலையும் மூலத்தின் கைப் படிமமும் தக்கவைக்கப்பட்டுள்ளன.
