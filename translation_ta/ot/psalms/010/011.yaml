  text: אָמַ֣ר בְּ֭/לִבּ/וֹ שָׁ֣כַֽח אֵ֑ל הִסְתִּ֥יר פָּ֝נָ֗י/ו בַּל רָאָ֥ה לָ/נֶֽצַח־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/011.yaml
  text: He says in his heart[a], “God has forgotten; he has hidden his face; he will never see.”
translation:
  language: ta
  text: அவன் தன் உள்ளத்தில்[a], “கடவுள் மறந்துவிட்டார்; அவர் தமது முகத்தை மறைத்துக்கொண்டார்; அவர் ஒருபோதும் காணமாட்டார்” என்று சொல்கிறான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவன் தன் உள்ளத்தில், ‘கடவுள் மறக்கிறார்; அவர் தமது முகத்தை மறைத்துக்கொள்கிறார்; அவர் என்றென்றும் காணமாட்டார்’ என்று சொன்னான்.” எபிரெயக் கவிதையிலுள்ள நிறைவுவினைகளை நிகழ்காலமாகவோ, இறந்தகாலம் அல்லது நிகழ்கால நிறைவாகவோ மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַר
  choice: சொல்கிறான்
  rationale: எபிரெயக் கவிதையில் நிறைவுவினை நிகழ்கால அல்லது பொதுவழக்குச் செயலாக அமையலாம். இங்கு பொல்லாதவனின் தொடரும் உள்பேச்சை நிகழ்காலம் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּלִבּוֹ
  choice: தன் உள்ளத்தில்
  rationale: இது வெளிப்படையாகச் சொல்வதை அல்ல, தனக்குள் நினைப்பதைக் குறிக்கும் எபிரெய மரபுத்தொடர். தமிழிலும் உருவகத்தை இயல்பாகத் தக்கவைக்கிறது.
- source_word: שָׁכַח
  choice: மறந்துவிட்டார்
  rationale: அடிப்படைப் பொருளான ‘மறத்தல்’ தக்கவைக்கப்படுகிறது. கடவுள் ஏற்கெனவே மறந்துவிட்டதாகப் பொல்லாதவன் கருதுவதை நிறைவுற்ற செயல்வடிவம் காட்டுகிறது.
- source_word: אֵל
  choice: கடவுள்
  rationale: இங்கு உண்மையான கடவுளைக் குறிக்கும் பொதுவான ஒருமைப் பெயராக இருப்பதால் நவீனத் தமிழில் ‘கடவுள்’ இயல்பானது.
- source_word: הִסְתִּיר פָּנָיו
  choice: அவர் தமது முகத்தை மறைத்துக்கொண்டார்
  rationale: கவனத்தை அல்லது அருளை விலக்கிக்கொள்வதைக் குறிக்கும் எபிரெய உருவகம் விளக்கமாக மாற்றப்படாமல் தக்கவைக்கப்படுகிறது.
- source_word: בַּל ... לָנֶצַח
  choice: ஒருபோதும் ... மாட்டார்
  rationale: நீடித்த மறுப்பைக் குறிக்கும் இரு கூறுகளும் தமிழில் இயல்பான ‘ஒருபோதும் ... மாட்டார்’ என்ற அமைப்பில் வெளிப்படுகின்றன.
- source_word: רָאָה
  choice: காணமாட்டார்
  rationale: ‘காணுதல்’ என்ற அடிப்படைப் பொருள் தக்கவைக்கப்படுகிறது; கவனித்து நியாயந்தீர்ப்பார் என்ற சூழல் சார்ந்த உட்பொருள் வெளிப்படையாகச் சேர்க்கப்படவில்லை.
theological_decisions:
- issue: கடவுள் தமது முகத்தை மறைப்பதாகக் கூறும் மனித உருவக மொழி
  choice: ‘அவர் தமது முகத்தை மறைத்துக்கொண்டார்’ என்ற உருவகத்தைத் தக்கவைத்தல்
  alternative: ‘அவர் கவனத்தை விலக்கிக்கொண்டார்’
  rationale: மூலத்தின் தெளிவான உருவகப் படிமத்தையும் அதன் இறையியல் நெருக்கடியையும் தக்கவைக்கிறது; விளக்கவுரையால் பொருளைச் சுருக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் ஆனால் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘முகத்தை மறைத்தல்’ என்ற வேதாகம உருவகம் அப்படியே பேணப்பட்டுள்ளது; ‘காணுதல்’ என்பதன் நியாயத்தீர்ப்பு சார்ந்த உட்பொருள் விளக்கமாகச் சேர்க்கப்படவில்லை.
