- source_word: תַּאֲוַת נַפְשׁוֹ
  choice: தன் உள்ளத்தின் ஆசை
  rationale: נֶפֶשׁ இங்கு முழு நபரின் உள்ளார்ந்த விருப்பத்தைச் சுட்டுகிறது; இயந்திரமாக ‘ஆத்துமாவின் ஆசை’ என்று மொழிபெயர்ப்பதைவிட ‘உள்ளத்தின் ஆசை’ இயல்பாகவும் பொருள் தெளிவாகவும் உள்ளது.
- source_word: בֹצֵעַ
  choice: பேராசைக்காரன்
  rationale: ஆதாயத்தை, குறிப்பாக முறைகேடான ஆதாயத்தை, பேராசையுடன் நாடுபவனைச் சுட்டும் சொல்லின் மையப் பொருளைப் பிடிக்கிறது.
- source_word: בֵּרֵךְ
  choice: தன்னையே வாழ்த்திக்கொண்டு
  rationale: ‘வாழ்த்தினான்/ஆசீர்வதித்தான்’ என்பது அடிப்படைப் பொருள்; இச்சூழலில் பேராசைக்காரன் தன்னையும் தன் வெற்றியையும் பாராட்டுவதாகப் பொருள் கொள்ளப்படுகிறது. ‘தன்னையே’ என்பது சூழலிலிருந்து தெளிவாக்கப்பட்டது; எபிரெயத்தில் நேரடி பிரதிபெயர் இல்லை.
- source_word: נִאֵץ
  choice: அவமதிக்கிறான்
  rationale: இகழ்தல், தூற்றுதல், மரியாதையின்றி நடத்துதல் ஆகிய வலுவான எதிர்மறைப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: ஆண்டவர்
  rationale: தேவனுடைய தனிப்பெயரான יהוה-ஐ தமிழில் வழக்கமான மரியாதைமிக்க வேதாகம நடையில் குறிக்கிறது.
theological_decisions:
- issue: בֵּרֵךְ என்பதன் பொருளும் அதன் மறைமுகச் செயப்படுபொருளும்
  choice: பேராசைக்காரன் ‘தன்னையே வாழ்த்திக்கொள்கிறான்’
  alternative: பேராசைக்காரன் ‘ஆண்டவரைச் சபிக்கிறான்/துறக்கிறான்’
  rationale: בֵּרֵךְ என்பதன் சாதாரண பொருள் ‘வாழ்த்து/ஆசீர்வதி’. சில வேதாகமச் சூழல்களில் அது ‘சபி’ என்ற நயவஞ்சகப் பயன்பாட்டைக் கொள்ளலாம்; ஆனால் இங்கு அடுத்துள்ள נִאֵץ தெளிவாக ‘அவமதி’ என்று கூறுவதால், தன்னைப் பாராட்டுதல் என்ற வாசிப்பு தொடரின் சமநிலையைச் சிறப்பாகப் பாதுகாக்கிறது. இருந்தபோதும் எபிரெயத்தில் ‘தன்னையே’ வெளிப்படையாக இல்லை என்பதால் அந்தத் தெளிவாக்கம் குறிப்பில் தெரிவிக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் சங்கீதத்திற்குரிய கண்ணியமான கண்டனத் தொனியுடனும் அமைக்கப்பட்டது. இரண்டு இணைச் செயல்களை அரைப்புள்ளி பிரிக்கிறது; மிகப் பழமையான அல்லது பிரிவுசார் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
