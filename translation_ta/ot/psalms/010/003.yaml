translation:
  language: ta
  text: ஏனெனில், தீயவன் தன் உள்ளத்தின் ஆசையைப் பற்றிப் பெருமை பேசுகிறான்; பேராசைக்காரன் ஆண்டவரைச் சபித்தும் அவமதித்தும் பேசுகிறான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘வாழ்த்தினான்’ என்று பொருள்படும் சொல் உள்ளது. ஆனால் சில இடங்களில் அது ‘சபித்தான்’ என்பதற்கான நயவஞ்சகப் பயன்பாடாக வருகிறது; இங்கும் அவ்வாறே புரிந்துகொள்ளப்படுகிறது. சொற்களை மிக நேரடியாகப் பின்பற்றினால், “பேராசைக்காரன் வாழ்த்துகிறான்; ஆண்டவரை அவமதிக்கிறான்” எனலாம்; ஆயினும் ‘வாழ்த்துகிறான்’ என்பதன் செயப்படுபொருள் வெளிப்படையாகக் கூறப்படவில்லை.
    reason: בֵּרֵךְ என்பதன் நேரடிப் பொருளையும், இச்சூழலில் அதற்குரிய நயவஞ்சக ‘சபி’ வாசிப்பையும், செயப்படுபொருளைப் பற்றிய இலக்கணத் தெளிவின்மையையும் பாதுகாக்கிறது.
lexical_decisions:
- source_word: רָשָׁע
  choice: தீயவன்
