id: PSA.10.6
reference: Psalms 10:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: אָמַ֣ר בְּ֭/לִבּ/וֹ בַּל אֶמּ֑וֹט לְ/דֹ֥ר וָ֝/דֹ֗ר אֲשֶׁ֣ר לֹֽא בְ/רָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/006.yaml
  text: He says in his heart[a], “I will not be shaken[b]; through generation after generation I will not be in trouble.”
translation:
  language: ta
  text: அவன் தன் உள்ளத்தில், “நான் அசைக்கப்பட மாட்டேன்[a]; தலைமுறை தலைமுறையாகத் துன்பத்திற்கு ஆளாக மாட்டேன்[b]” என்று சொல்லிக்கொள்கிறான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் நிலைகுலைய மாட்டேன்.” எபிரெய வினைச்சொல் அசைக்கப்படுதல், தடுமாறுதல் அல்லது நிலைகுலைதல் ஆகிய பொருள்களைக் கொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: இறுதிக் கூறு எபிரெயத்தில் விடுபட்ட கூறுகளைக் கொண்டுள்ளது. இதை, “தலைமுறை தலைமுறையாகத் துன்பத்தில் இல்லாதவன்” என்றோ, “நான் ஒருபோதும் பேரழிவைச் சந்திக்க மாட்டேன்” என்றோ மொழிபெயர்க்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: אָמַר
  choice: சொல்லிக்கொள்கிறான்
  rationale: கவிதைச் சூழலில் இந்த நிறைவுவினை நிகழ்காலத்தன்மையுடன் பொல்லாதவனின் தற்பெருமையான உள்ளப் பேச்சை அறிமுகப்படுத்துகிறது; தமிழில் ‘சொல்லிக்கொள்கிறான்’ என்பது அந்தத் தனக்குள் பேசும் தன்மையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּלִבּוֹ
  choice: தன் உள்ளத்தில்
  rationale: உள்ளார்ந்த சிந்தனை அல்லது தனக்குள் பேசுதல் என்ற எபிரெய உருவகத்தைத் தெளிவாகவும் இயல்பாகவும் தக்கவைக்கிறது.
- source_word: בַּל
  choice: மாட்டேன்
  rationale: கவிதைநடையிலான மறுப்பை எதிர்கால முதல் நபர் வினையுடன் இயல்பான தமிழில் தெரிவிக்கிறது; ‘ஒருபோதும்’ போன்ற வலியுறுத்தலைத் தேவையின்றிச் சேர்க்கவில்லை.
- source_word: אֶמּוֹט
  choice: நான் அசைக்கப்பட மாட்டேன்
  rationale: מוט என்பதன் நிஃபால் வடிவம் அசைக்கப்படுதல், நிலைகுலைதல் என்ற பொருள்களைக் கொண்டது; தேர்ந்தெடுத்த சொற்றொடர் பாதுகாப்பைப் பற்றிய உருவகத்தையும் நவீனத் தமிழின் தெளிவையும் காக்கிறது.
- source_word: לְדֹר וָדֹר
  choice: தலைமுறை தலைமுறையாக
  rationale: தொடர்ந்து வரும் தலைமுறைகளெங்கும் நீடிப்பதைக் குறிக்கும் எபிரெயச் சொற்றொடருக்கான இயல்பான, மரியாதைமிக்க தமிழ் இணை.
- source_word: אֲשֶׁר לֹא בְרָע
  choice: துன்பத்திற்கு ஆளாக மாட்டேன்
  rationale: இறுதிக் கூறு எபிரெயத்தில் விடுபட்ட கூறுகளைக் கொண்டுள்ளது. בְרָע என்பதன் ‘தீங்கு/துன்பத்தில்’ என்ற கருத்தை, பேச்சாளனின் முதல் நபர் தற்பெருமையாகத் தமிழில் தெளிவுபடுத்துகிறது.
theological_decisions:
- issue: விடுபட்ட கூறுகளைக் கொண்ட இறுதி வாக்கியமும் பேச்சாளரின் நோக்குநிலையும்
  choice: ‘துன்பத்திற்கு ஆளாக மாட்டேன்’ என்று பொல்லாதவனின் முதல் நபர் உள்ளப் பேச்சைத் தொடரச் செய்தல்
  alternative: ‘துன்பத்தில் இல்லாதவன்’ என்ற உறவுப்பெயர் விளக்கமாகவோ, ‘நான் ஒருபோதும் பேரழிவைச் சந்திக்க மாட்டேன்’ என்ற வலுவான பொருளிலோ வாசித்தல்
  rationale: சங்கீதத்தின் சூழல் பொல்லாதவனுடைய பாதுகாப்பு குறித்த தற்பெருமையை எடுத்துரைக்கிறது. முதல் நபரைத் தொடர்வது தமிழில் மிகவும் ஒத்திசைவாக உள்ளது; எனினும் எபிரெயத்தின் உண்மையான இலக்கணச் சுருக்கமும் மாற்று வாசிப்புகளும் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பானதாயும், சங்கீதக் கவிதைக்கு ஏற்ற கண்ணியமான நடையுடனும் அமைக்கப்பட்டது. ‘தன் உள்ளத்தில்’ என்ற எபிரெய உருவகம் தக்கவைக்கப்பட்டு, இறுதிக் கூறின் தெளிவின்மை அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
