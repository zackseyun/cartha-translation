  yaml_path: translation/ot/psalms/010/008.yaml
  text: He sits in ambush in the villages[a]; in the hiding places he murders the innocent[b]; his eyes watch for the helpless.
translation:
  language: ta
  text: 'அவன் குடியிருப்புகளில்[a] பதுங்கியிருந்து காத்திருக்கிறான்;

    மறைவிடங்களில் குற்றமற்றவனைக் கொலை செய்கிறான்;

    உதவியற்றவனை அவன் கண்கள் மறைவாக நோக்குகின்றன[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “குடியிருப்புகள்” என்பதை “சிற்றூர்கள்” என்றும் மொழிபெயர்க்கலாம்; இச்சூழலில் வாய்ப்பு குறைந்த பொருளாக “முற்றங்கள்” அல்லது “அடைப்பிடங்கள்” என்பதும் உண்டு.
    reason: lexical_alternative
  - marker: b
    text: இறுதிக் கூறு கடினமான எபிரெய மொழிநடை. வினைச்சொல் இன்னும் சொற்சொல்லாக மறைத்தல் அல்லது பதுங்குதல் என்பதோடு தொடர்புடையது; ஆனால் “அவன் கண்கள்” என்பதுடன் வருவதால், பாதிக்கப்படக்கூடிய ஒருவரை மறைவாகக் கண்காணித்தல் என்பதே இங்கு பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשֵׁב בְּמַאְרַב
  choice: பதுங்கிக் காத்திருக்கிறான்
  rationale: יֵשֵׁב என்பதன் அடிப்படைப் பொருள் ‘உட்காருகிறான்/தங்குகிறான்’; בְּמַאְרַב உடன் சேர்ந்த இச்சூழலில், இரைக்காக மறைந்து காத்திருக்கும் நிலையான வேட்டைப் பாங்கை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: חֲצֵרִים
  choice: குடியிருப்புகளில்
  rationale: இச்சொல் முற்றங்கள் அல்லது அடைப்பிடங்களையும் குறிக்கக்கூடும்; இங்கு மக்கள் வாழும் சிற்றூர்கள் அல்லது குடியிருப்புகள் என்பதே சூழலுக்கு ஏற்ற பொருள். בְּ என்ற முன்னொட்டின் ‘இல்’ பொருளைத் தக்கவைக்கிறது.
- source_word: בַּמִּסְתָּרִים
  choice: மறைவிடங்களில்
  rationale: மறைக்கப்பட்ட அல்லது இரகசியமான இடங்கள் என்ற பன்மை உருவகத்தை நேரடியாகவும் இயல்பாகவும் காக்கிறது.
- source_word: יַהֲרֹג
  choice: கொலை செய்கிறான்
  rationale: வினைச்சொல் பொதுவாக ‘கொல்லுகிறான்’ என்று பொருள்படும்; குற்றமற்றவர் மீதான மறைவான வன்முறை என்பதால் ‘கொலை செய்கிறான்’ சூழலின் சட்டவிரோதத் தன்மையை மிகைப்படுத்தாமல் தெரிவிக்கிறது.
- source_word: נָקִי
  choice: குற்றமற்றவன்
  rationale: குற்றம் அல்லது பழியிலிருந்து விடுபட்டவர் என்ற எபிரெயப் பொருளைத் தெளிவாகக் கொடுக்கிறது.
- source_word: לְחֵלְכָה
  choice: உதவியற்றவன்
  rationale: இது அரிதானதும் பொருள் நிர்ணயிக்கக் கடினமானதும் ஆன சொல்; இச்சங்கீதத்தில் வலுவற்ற, துன்பத்திற்குள்ளான இரையைக் குறிப்பதாகப் புரிந்துகொள்ளப்படுகிறது.
- source_word: עֵינָיו ... יִצְפֹּנוּ
  choice: அவன் கண்கள் பதுங்கிக் கவனிக்கின்றன
  rationale: ‘அவன் கண்கள்’ என்ற உயிர்ப்பான படிமத்தைப் பேணுகிறது. צפן தொடர்புடைய வினை மறைத்தல் அல்லது பதுங்குதல் என்ற கருத்தைக் கொண்டிருந்தாலும், கண்கள் என்பதோடு இங்கு இரையை மறைவாக நோட்டமிடும் பொருள் இயல்பாகிறது; ‘பதுங்கிக்’ என்பது மூலத்தின் மறைவு நுணுக்கத்தையும் காக்கிறது.
theological_decisions:
- issue: குற்றமற்றவனின் நிலை
  choice: குற்றமற்றவன்
  alternative: நீதிமான் / பாவமற்றவன்
  rationale: נָקִי இங்கு தாக்குதலுக்குரிய குற்றம் செய்யாதவரைக் குறிக்கிறது; முழுமையான பாவமின்மை அல்லது நீதிமானாக்குதல் என்ற சமயவியல் கருத்தை உரைக்குள் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரமான, பொதுமக்களுக்கு விளங்கும் கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. கவிதை நடையின் மூன்று இணையான கூறுகளும் அரைப்புள்ளிகளால் காக்கப்பட்டுள்ளன. ‘பதுங்கிக் காத்திருக்கிறான்’ மற்றும் ‘பதுங்கிக் கவனிக்கின்றன’ ஆகியவை மறைவு, வேட்டையாடும் நோக்கம், கண்களின் உருவகம் ஆகியவற்றை இயல்பான தமிழில் பேணுகின்றன.
