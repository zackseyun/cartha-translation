language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: יְהוָ֣ה מֶ֭לֶךְ עוֹלָ֣ם וָ/עֶ֑ד אָבְד֥וּ ג֝וֹיִ֗ם מֵֽ/אַרְצֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/016.yaml
  text: Yahweh is King forever and ever[a]; nations have perished from his land.
translation:
  language: ta
  text: யாவே என்றென்றும் அரசர்; அவரது நாட்டிலிருந்து[a] தேசங்கள் அழிந்துபோயின.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவரது பூமியிலிருந்து.” எபிரெயப் பெயர்ச்சொல் சூழலுக்கேற்ப “நாடு” அல்லது “பூமி” என்று பொருள்படும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பட்டமான ‘ஆண்டவர்’ என்பதைக் கொண்டு மாற்றாமல், எபிரெய தனிப்பெயரான நான்கெழுத்து இறைப்பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: מֶלֶךְ
  choice: அரசர்
  rationale: எபிரெய மொழியிலுள்ள பயனிலைப் பெயர்ச்சொல்லின் தன்மையைப் பேணி, நவீனத் தமிழில் இயல்பாகவும் மரியாதையாகவும் அமைகிறது.
- source_word: עוֹלָם וָעֶד
  choice: என்றென்றும்
  rationale: நீடித்த காலத்தை வலியுறுத்தும் இணைச் சொல்லின் பொருளை இயல்பான தமிழில் செறிவாகத் தருகிறது.
- source_word: אָבְדוּ
  choice: அழிந்துபோயின
  rationale: நிறைவுற்ற நிகழ்வாகக் கூறும் எபிரெய வினைவடிவின் பொருளைத் தக்கவைக்கிறது; வெளிப்படையாக இல்லாத செயப்பாட்டு நுணுக்கத்தைச் சேர்ப்பதில்லை.
- source_word: גּוֹיִם
  choice: தேசங்கள்
  rationale: இங்கு சமயவியல் வகைப்பாடாகிய ‘புறவினத்தார்’ என்பதற்குப் பதிலாக, பிற தேசங்கள் அல்லது நாடுகளைக் குறிக்கும் பொதுவான பொருளைத் தருகிறது.
- source_word: מֵאַרְצוֹ
  choice: அவரது நாட்டிலிருந்து
  rationale: אֶרֶץ என்பதன் உடனடியான, நிலப்பரப்பு சார்ந்த பொருளைச் சூழலுக்கு ஏற்றவாறு தருகிறது; ‘பூமி’ என்ற விரிந்த பொருள் அடிக்குறிப்பில் பேணப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: யெகோவா
  rationale: மூலத்தில் வரும் தனிப்பட்ட இறைப்பெயரை ஒரு பட்டத்தால் மாற்றாமல் ஒலிபெயர்த்து, உடன்படிக்கைப் பெயரின் தன்மையைப் பேணுகிறது.
- issue: אַרְצוֹ என்பதன் பொருள் எல்லை
  choice: அவரது நாடு
  alternative: அவரது பூமி
  rationale: சங்கீதத்தின் உடனடிச் சூழலில் குறிப்பிட்ட நிலப்பரப்பு என்ற பொருள் பொருத்தமாக உள்ளது; இருப்பினும் உலகளாவிய பொருளும் எபிரெயச் சொல்லில் சாத்தியமாதலால் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் சுருக்கமான, கண்ணியமான சங்கீத நடையைப் பயன்படுத்துகிறது. ‘அரசர்’ என்ற பயனிலைப் பெயர்ச்சொல் மூலத்தின் அமைப்பைப் பேணுகிறது; அடிக்குறி அது விளக்கும் ‘நாடு’ என்பதற்குப் பின்னால் வைக்கப்பட்டுள்ளது.
