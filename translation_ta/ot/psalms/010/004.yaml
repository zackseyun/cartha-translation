reference: Psalms 10:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: רָשָׁ֗ע כְּ/גֹ֣בַהּ אַ֭פּ/וֹ בַּל יִדְרֹ֑שׁ אֵ֥ין אֱ֝לֹהִ֗ים כָּל מְזִמּוֹתָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/004.yaml
  text: In the pride of his face[a], the wicked man does not seek; all his thoughts are[b], “There is no God.”
translation:
  language: ta
  text: 'தன் முகத்தில் வெளிப்படும் செருக்கில்[a], பொல்லாதவன் தேடுவதில்லை; அவனுடைய எண்ணங்களெல்லாம்: “கடவுள் இல்லை” என்பதே.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்பட, “அவனுடைய மூக்கின்/முகத்தின் உயர்வின்படி.” இது செருக்கான மேட்டிமையையோ அகந்தையான தோற்றத்தையோ குறிக்கும் மரபுத்தொடர்.
    reason: cultural_note
  - marker: b
    text: அல்லது, “அவனுடைய எந்த எண்ணத்திலும் கடவுளுக்கு இடமில்லை.” எபிரெயத்தை, அவனுடைய எண்ணத்தின் நேரடி கூற்றாக மட்டுமல்லாமல், அவனுடைய சிந்தனை முழுவதிலும் கடவுளுக்கு இடமில்லை என்று விவரிப்பதாகவும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: רָשָׁע
  choice: பொல்லாதவன்
  rationale: பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்டுள்ள ஒருமை ஆண்பால் பெயரடை. எபிரெய உரையிலுள்ள தனிநபர் சித்திரத்தையும் அதன் பொதுப் பிரதிநிதித்துவத் தன்மையையும் காக்கிறது.
- source_word: כְּגֹבַהּ אַפּוֹ
  choice: தன் முகத்தில் தெரியும் செருக்கினால்
  rationale: גֹבַהּ என்பது உயர்வு அல்லது மேட்டிமையையும், אַף என்பது சொற்பட மூக்கு/முகத்தையும் குறிக்கிறது. இங்கு கோபத்தைவிட முகத்தில் வெளிப்படும் அகந்தையான தோற்றமே இயல்பான பொருள்; தமிழில் புரியும்படி உருவகத்தின் உடல் சார்ந்த கூறும் காக்கப்பட்டுள்ளது.
- source_word: בַּל יִדְרֹשׁ
  choice: தேடுவதில்லை
  rationale: கவிதை நடையின் மறுப்புச் சொல்லுடன் வரும் வினை, எதிர்கால நிகழ்வைவிட வழக்கமான மனப்பாங்கைச் சுட்டுகிறது. எபிரெயத்தில் நேரடி செயப்படுபொருள் இல்லாததால் தமிழிலும் அதைச் சேர்க்கவில்லை.
- source_word: אֵין אֱלֹהִים
  choice: “கடவுள் இல்லை”
  rationale: இருப்பை மறுக்கும் கூற்றை நேரடியாக வழங்குகிறது; பொல்லாதவனின் சிந்தனையின் உள்ளடக்கமாக மேற்கோளிடப்பட்டுள்ளது.
- source_word: כָּל מְזִמּוֹתָיו
  choice: அவனுடைய எண்ணங்களெல்லாம்
  rationale: מְזִמּוֹת என்பது திட்டங்கள், சூழ்ச்சிகள் அல்லது எண்ணங்களைக் குறிக்கலாம். இங்கு அவனுடைய முழுச் சிந்தனைப் போக்கைச் சுட்டுவதால் ‘எண்ணங்கள்’ பொருத்தமானது; ‘சூழ்ச்சிகள்’ என்பது தேவையற்ற அளவில் தீய திட்டமிடலை வலியுறுத்தும்.
theological_decisions:
- issue: இறுதிக் கூற்றின் தொடரியல் தொடர்பு
  choice: ‘கடவுள் இல்லை’ என்பதைப் பொல்லாதவனுடைய எண்ணங்களின் உள்ளடக்கமாகக் கொடுத்தல்
  alternative: ‘அவனுடைய எண்ணங்கள் எதிலும் கடவுள் இல்லை’ என்று புரிந்துகொள்ளுதல்
  rationale: எபிரெயச் சொல் வரிசை, ‘கடவுள் இல்லை’ என்பதை அவனுடைய எண்ணத்தின் உள்ளடக்கமாக வாசிக்க இடமளிக்கிறது; அதேவேளை கடவுள் அவன் சிந்தனைகளில் முற்றிலும் இடம்பெறுவதில்லை என்ற வாசிப்பும் இலக்கண ரீதியாகச் சாத்தியம். முதன்மை வாசிப்பு கூர்மையான மறுப்பைத் தக்கவைக்கிறது; மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைக்குரிய கண்ணியத்தையும் பொதுவாசகருக்கான தெளிவையும் இணைக்கும் நடை. ‘முகத்தில் தெரியும் செருக்கு’ என்பது எபிரெய உருவகத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘தேடுவதில்லை’ என்பதில் மூலத்தில் இல்லாத செயப்படுபொருள் சேர்க்கப்படவில்லை.
