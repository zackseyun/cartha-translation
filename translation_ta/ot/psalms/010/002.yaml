source:
  edition: WLC
  text: בְּ/גַאֲוַ֣ת רָ֭שָׁע יִדְלַ֣ק עָנִ֑י יִתָּפְשׂ֓וּ בִּ/מְזִמּ֖וֹת ז֣וּ חָשָֽׁבוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/002.yaml
  text: In the pride of the wicked[a], the poor man is hotly pursued[b]; let them be caught in the schemes they have devised.
translation:
  language: ta
  text: தீயவனின் அகந்தையால் ஏழை தீவிரமாகத் துரத்தப்படுகிறான்[a]; அவர்கள் தீட்டிய சூழ்ச்சிகளிலேயே அவர்கள் சிக்கிக்கொள்ளட்டும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தீயவன் அகந்தையுடன் ஏழையைத் துரத்துகிறான்.” எபிரெய வாக்கியம் சுருக்கமாக இருப்பதால், தீயவனை எழுவாயாகவும் ஏழையைச் செயப்படுபொருளாகவும் வெளிப்படையாக அமைத்தும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவர்கள் தீட்டிய சூழ்ச்சிகளில் அவர்கள் சிக்கிக்கொள்கிறார்கள்.” எபிரெய வினைவடிவத்தை வேண்டுதலாக அல்லாமல் ஒரு கூற்றாகவும் வாசிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּגַאֲוַת
  choice: அகந்தையால்
  rationale: בְּ என்ற முன்னொட்டின் காரண/கருவிப் பொருளையும், גַּאֲוָה என்பதன் செருக்கான பெருமையையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: רָשָׁע
  choice: தீயவன்
  rationale: ஒருமை வடிவில் பொதுவகையாகக் குறிப்பிடப்படும் ஒழுக்கக்கேடுள்ள நபரைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: יִדְלַק
  choice: தீவிரமாகத் துரத்தப்படுகிறான்
  rationale: דלק என்பதன் நெருக்கமாகப் பின்தொடர்தல் அல்லது அனல்போல் விரட்டுதல் என்ற பகைமையான பொருளை வெளிப்படுத்துகிறது; சுருக்கமான எபிரெய வாக்கியத்தில் ஏழை செயப்படுபொருளாக இருப்பதாக முதன்மை உரை எடுத்துக்கொள்கிறது.
- source_word: עָנִי
  choice: ஏழை
  rationale: வறுமையுற்ற அல்லது ஒடுக்கப்பட்ட நபரைக் குறிக்கும் சொல்லின் பிரதிநிதித்துவ ஒருமையைப் பேணும், சாதாரண வாசகருக்குப் புரியும் தேர்வு.
- source_word: יִתָּפְשׂוּ
  choice: அவர்கள் சிக்கிக்கொள்ளட்டும்
  rationale: நிஃபால் நிறைவுறா வடிவை வேண்டுதல் அல்லது சாபவாக்கியத் தன்மையுள்ள விருப்பாக எடுத்துக்கொண்டு, தீயவர்கள் தங்கள் திட்டங்களிலேயே அகப்பட வேண்டும் என்ற கருத்தை வெளிப்படுத்துகிறது.
- source_word: בִּמְזִמּוֹת
  choice: சூழ்ச்சிகளில்
  rationale: מְזִמּוֹת என்பதன் தீய நோக்குள்ள திட்டங்கள் என்ற பொருளையும், בְּ என்பதன் அவற்றுக்குள் அகப்படுதல் என்ற படிமத்தையும் காக்கிறது.
- source_word: זוּ חָשָׁבוּ
  choice: அவர்கள் தீட்டிய
  rationale: זוּ என்ற தொடர்புச் சொல்லையும் חשב என்பதன் திட்டமிட்டு வகுத்தல் என்ற பொருளையும் இயல்பான தமிழ் பெயரெச்சத் தொடராக வழங்குகிறது.
theological_decisions:
- issue: முதல் அடியின் சுருக்கமான தொடரமைப்பில் துரத்துபவர் மற்றும் துரத்தப்படுபவர் யார்
  choice: தீயவனின் அகந்தையால் ஏழை துரத்தப்படுகிறான்
  alternative: தீயவன் அகந்தையுடன் ஏழையைத் துரத்துகிறான்
  rationale: இரண்டு வாசிப்புகளும் தீயவன் தாக்குபவன், ஏழை பாதிக்கப்படுபவன் என்ற அடிப்படை உறவைத் தருகின்றன. முதன்மை உரை எபிரெயத்தின் சுருக்கத்தையும் ஏழையின் நிலைமையையும் முன்னிறுத்தும் செயப்பாட்டு வடிவைத் தேர்ந்தெடுக்கிறது; தொடரமைப்பு வேறுபாடு அடிக்குறிப்பில் காக்கப்படுகிறது.
- issue: இரண்டாம் அடியின் வினைமுற்று வேண்டுதலா அல்லது கூற்றா
  choice: அவர்கள் சிக்கிக்கொள்ளட்டும்
  alternative: அவர்கள் சிக்கிக்கொள்கிறார்கள் / சிக்கிக்கொண்டார்கள்
  rationale: יִתָּפְשׂוּ என்பதை வேண்டுதல் சார்ந்த யுசிவ் பொருளில் வாசிப்பது சங்கீதத்தின் மன்றாட்டு ஓட்டத்திற்கும், தீயவர்கள் தங்கள் சூழ்ச்சியிலேயே அகப்பட வேண்டும் என்ற நீதித் திருப்பத்திற்கும் பொருந்துகிறது. இலக்கணரீதியாகச் சாத்தியமான விவரிப்புக் கூற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்கு எளிதாகவும் சங்கீதத்திற்குரிய கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. “அகந்தை,” “தீவிரமாகத் துரத்தப்படுகிறான்,” “சூழ்ச்சி” ஆகிய சொற்கள் மூலத்தின் பகைமை, ஒடுக்குதல், திட்டமிட்ட தீமை ஆகிய நுணுக்கங்களைத் தக்கவைக்கின்றன. உண்மையான தொடரமைப்பு மற்றும் வினைநிலை ஐயங்கள் அடிக்குறிப்புகளில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளன.
