base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/014.yaml
  text: You have seen[a], for you look upon trouble and grief, to take it into your hand. The helpless commits himself to you[c][b]; you have been the helper of the fatherless.
translation:
  language: ta
  text: நீர் கண்டிருக்கிறீர்; ஏனெனில், துன்பத்தையும் வேதனையையும் நீர் கவனித்து, அதை உமது கையில் எடுத்துக்கொள்கிறீர்.[a] ஆதரவற்றவன் தன்னை உம்மிடம் ஒப்படைக்கிறான்;[b] தந்தையற்றவனுக்கு நீர் துணையாய் இருந்திருக்கிறீர்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “அதை உமது கையில் வைக்க.” இந்த எபிரெய மரபுத்தொடர், அந்த விவகாரத்தில் நடவடிக்கை எடுக்க இறைவன் அதைத் தம் பொறுப்பில் ஏற்றுக்கொள்வதையும் குறிக்கலாம்.'
    reason: lexical_alternative
  - marker: b
    text: 'அல்லது: “ஆதரவற்றவன் அதை உம்மிடம் விட்டுவிடுகிறான்.” இங்கு அவன் தன்னையே ஒப்படைக்கிறானா அல்லது தன் வழக்கை இறைவனிடம் விடுகிறானா என்பது எபிரெயத்தில் வெளிப்படையாகத் தீர்மானிக்கப்படவில்லை.'
    reason: alternative_reading
  - marker: c
    text: 'அல்லது: “அநாதைக்கு.” எபிரெயச் சொல் குறிப்பாகத் தந்தையற்றவரைக் குறிக்கிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאִתָה
  choice: நீர் கண்டிருக்கிறீர்
  rationale: இது தேவனை நோக்கிக் கூறப்படும் Qal perfect இரண்டாம் ஆண்பால் ஒருமை வடிவம். இறைவன் ஏற்கெனவே கண்டிருப்பதை அடிப்படையாகக் கொண்ட வேண்டுதலைத் தமிழின் நிறைவுநிலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עָמָל
  choice: துன்பம்
  rationale: இச்சங்கீதப் புலம்பலில் இது வெறும் உழைப்பைக் குறிக்காமல், ஒடுக்குதலால் விளையும் துயரத்தையும் தீங்கையும் குறிக்கிறது.
- source_word: כַעַס
  choice: வேதனை
  rationale: עָמָל என்பதுடன் இணைந்து, காணப்படும் மனவேதனையையும் துயரத்தையும் குறிக்கிறது; 'கோபம்' என மொழிபெயர்த்தால் அது இறைவனுடைய உணர்ச்சி என்று தவறாகப் புரிய வாய்ப்புள்ளது.
- source_word: תַּבִּיט
  choice: நீர் கவனித்து
  rationale: Hiphil வடிவம் வெறுமனே பார்ப்பதைக் காட்டிலும் கூர்ந்து நோக்குதல் அல்லது கவனத்தில் கொள்ளுதல் என்ற பொருளைத் தருகிறது.
- source_word: לָתֵת בְּיָדֶךָ
  choice: அதை உமது கையில் எடுத்துக்கொள்கிறீர்
  rationale: சொல்லுக்குச் சொல் 'உமது கையில் கொடுக்க' என்றாலும், இச்சூழலில் இறைவன் அந்த விவகாரத்தைத் தாமே கையாள எடுத்துக்கொள்வது என்ற எபிரெய மரபுத்தொடரின் செயல்சார்ந்த பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: עָלֶיךָ יַעֲזֹב
  choice: தன்னை உம்மிடம் ஒப்படைக்கிறான்
  rationale: עזב உடன் עַל வரும் இக்கட்டமைப்பு கைவிடப்படுதலை அல்ல, தன்னையோ தன் வழக்கையோ இறைவனை நம்பி ஒப்படைப்பதைக் குறிக்கிறது.
- source_word: חֵלֶכָה
  choice: ஆதரவற்றவன்
  rationale: பலவீனமான, அவலுற்ற அல்லது பாதுகாப்பற்ற நபரைக் குறிக்கும் அரிதான பெயர்ச்சொல்; அடுத்துள்ள தந்தையற்றவனைப் பற்றிய குறிப்புடன் 'ஆதரவற்றவன்' இயல்பாகப் பொருந்துகிறது.
- source_word: יָתוֹם
  choice: தந்தையற்றவன்
  rationale: தந்தையின் பாதுகாப்பை இழந்த சமூகப் பிரிவை எபிரெயச் சொல் நேரடியாகக் குறிக்கிறது; 'அநாதை' என்பது சாத்தியமான மாற்று.
- source_word: עוֹזֵר
  choice: துணை
  rationale: இறைவனைத் தனிப்பட்ட முறையில் உதவுகிறவராகக் காட்டும் செயப்பெயரெச்சம்; 'துணை' சுருக்கமாகவும் இயல்பாகவும் இதை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: இறைவன் துன்பத்தை வெறுமனே காண்கிறாரா, அல்லது நடவடிக்கைக்காக அதைத் தம் கையில் எடுத்துக்கொள்கிறாரா?
  choice: இறைவன் துன்பத்தைக் கவனித்து, அந்த விவகாரத்தைத் தம் கையில் எடுத்துக்கொள்கிறார்.
  alternative: துன்பத்தையும் வேதனையையும் உமது கையில் வைப்பதற்காக நீர் பார்க்கிறீர்.
  rationale: לָתֵת בְּיָדֶךָ என்பது செயல்படுவதற்காக ஒரு விவகாரத்தைத் தம் பொறுப்பில் ஏற்றுக்கொள்வதை இயல்பாகச் சுட்டுகிறது; ஆனால் நடவடிக்கையின் வடிவத்தை மொழிபெயர்ப்பு மேலதிகமாக நிர்ணயிக்கவில்லை.
- issue: ஆதரவற்றவனின் செயல் தன்னையே ஒப்படைப்பதா, தன் வழக்கை விட்டுவிடுவதா?
  choice: ஆதரவற்றவன் தன்னை இறைவனிடம் ஒப்படைக்கிறான்.
  alternative: ஆதரவற்றவன் தன் வழக்கை இறைவனிடம் விட்டுவிடுகிறான்.
  rationale: எபிரெய வாக்கியத்தில் வெளிப்படையான செயப்படுபொருள் இல்லாததால் இரண்டும் சாத்தியம். முதன்மை உரை நபரின் சார்ந்திருத்தலைத் தெரிவிக்கிறது; அடிக்குறிப்பு மாற்றுப் புரிதலைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், இறைவனை நோக்கும் மரியாதைப் பன்மையைப் பயன்படுத்தியுள்ளோம். சங்கீதத்துக்குரிய கண்ணியமான தொனியைப் பேணியபடியே அரிதான அல்லது பழமையான சொற்களைத் தவிர்த்து, பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் சொற்கள் தேர்ந்தெடுக்கப்பட்டுள்ளன.
