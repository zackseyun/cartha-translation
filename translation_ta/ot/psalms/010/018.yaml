source:
  edition: WLC
  text: לִ/שְׁפֹּ֥ט יָת֗וֹם וָ֫/דָ֥ךְ בַּל יוֹסִ֥יף ע֑וֹד לַ/עֲרֹ֥ץ אֱ֝נ֗וֹשׁ מִן הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/018.yaml
  text: to give justice to the fatherless and the oppressed[c][b][a], so that man from the earth may terrify no more.
translation:
  language: ta
  text: தந்தையற்றவருக்கும்[a] ஒடுக்கப்பட்டவருக்கும்[b] நீதி வழங்கவும், மண்ணிலிருந்து வந்த மனிதன்[c] இனி அச்சுறுத்தாதபடி.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது ‘அனாதைக்கும்’.
    reason: lexical_alternative
  - marker: b
    text: அல்லது ‘நசுக்கப்பட்டவருக்கும்’ அல்லது ‘துன்புறுத்தப்பட்டவருக்கும்’.
    reason: lexical_alternative
  - marker: c
    text: எபிரெயத்தில் ‘மண்ணிலிருந்து வந்த மனிதன்’; அதாவது, சாகக்கூடிய வெறும் மனிதன்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁפֹּט
  choice: நீதி வழங்கவும்
  rationale: שׁפט என்பதன் நீதித்துறை சார்ந்த பொருளையும், முந்தைய சூழலில் கடவுள் செவிகொடுப்பதன் நோக்கம் அல்லது விளைவையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יָתוֹם
  choice: தந்தையற்றவர்
  rationale: தந்தையின் பாதுகாப்பை இழந்த சமூக ரீதியாகப் பாதிக்கப்படக்கூடிய நபரைச் சுட்டும் எபிரெயச் சொல்லின் குறிப்பான பொருளைத் தக்கவைக்கிறது.
- source_word: דַּךְ
  choice: ஒடுக்கப்பட்டவர்
  rationale: நசுக்கப்பட்ட அல்லது தாழ்த்தப்பட்ட நிலையில் இருப்பவர் என்ற சொல்லின் சமூக மற்றும் அனுபவ வலிமையை நவீன தமிழில் தெளிவாகக் கொடுக்கிறது.
- source_word: בַּל ... יוֹסִיף עוֹד
  choice: இனி ... அச்சுறுத்தாதபடிக்கும்
  rationale: மறுக்கப்பட்ட நோக்கம் அல்லது விளைவையும், செயல் இனிமேலும் தொடரக்கூடாது என்ற יוֹסִיף עוֹד-இன் கருத்தையும் இயல்பாக இணைக்கிறது.
- source_word: לַעֲרֹץ
  choice: அச்சுறுத்த
  rationale: பயமுறுத்துதல் அல்லது திகிலை ஏற்படுத்துதல் என்ற ערץ வினையின் வலிமையைத் தக்கவைக்கிறது; இதை ‘ஒடுக்குதல்’ என மாற்றி דַּךְ என்பதுடன் உள்ள வேறுபாட்டை மங்கச் செய்யவில்லை.
- source_word: אֱנוֹשׁ מִן הָאָרֶץ
  choice: மண்ணிலிருந்து வந்த மனிதன்
  rationale: אֱנוֹשׁ என்பதிலுள்ள நிலையற்ற மனிதன் என்ற நுணுக்கத்தையும், מִן הָאָרֶץ என்பதன் ‘மண்/பூமியிலிருந்து’ என்ற உருவகத்தையும் தமிழில் பாதுகாக்கிறது.
theological_decisions:
- issue: אֱנוֹשׁ என்பதிலுள்ள ஒருமை ஆண்பால் பொதுப்பயன்பாடு
  choice: மண்ணிலிருந்து வந்த மனிதன்
  alternative: மண்ணிலிருந்து வந்த மனிதர்கள்
  rationale: எபிரெயத்தின் ஒருமை வடிவத்தையும், கடவுளுக்கு எதிராக வெறும் மண்ணுக்குரிய மனிதனின் பலவீனத்தை எடுத்துக்காட்டும் சொல்லாட்சியையும் காக்கிறது; அதேவேளை ‘மனிதன்’ இங்கு பொதுப்பொருளில் உள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. வசனம் முந்தைய வாக்கியத்தைத் தொடரும் நோக்கக் கட்டமைப்பாக இருப்பதால் ‘வழங்கவும் ... அச்சுறுத்தாதபடிக்கும்’ என இணைப்பு வடிவம் பயன்படுத்தப்பட்டுள்ளது.
