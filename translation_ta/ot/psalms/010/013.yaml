  text: Why does the wicked man despise God? He says in his heart, “You will not call to account.”
translation:
  language: ta
  text: தீயவன் ஏன் கடவுளை இகழ்கிறான்? “நீர் கணக்குக் கேட்கமாட்டீர்” என்று தன் உள்ளத்தில் சொல்லிக்கொள்கிறான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָשָׁע
  choice: தீயவன்
  rationale: ஒழுக்கரீதியில் குற்றமுள்ள நபரைக் குறிக்கும் எபிரெயச் சொல்லை இயல்பான நவீனத் தமிழில் தனிநபர் பெயர்ச்சொல்லாகக் கொடுக்கிறது.
- source_word: נִאֵץ
  choice: அவமதிக்கிறான்
  rationale: கடவுளை இகழ்ந்து நிராகரிக்கும் மனப்பான்மையைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: תִּדְרֹשׁ
  choice: கணக்குக் கேட்கமாட்டீர்
  rationale: דרש என்பதன் ‘விசாரித்தல்/தேடுதல்/பொறுப்புக்குட்படுத்துதல்’ என்ற இச்சூழலுக்குரிய நீதித்துறை சார்ந்த பொருளைச் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: אָמַר בְּלִבּוֹ
  choice: தன் உள்ளத்தில் சொல்லிக்கொள்கிறான்
  rationale: உள்ளார்ந்த எண்ணம் அல்லது தன்னிடமே கூறிக்கொள்ளுதல் என்ற எபிரெய வழக்கை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: לֹא תִדְרֹשׁ என்பதன் நோக்கம்
  choice: “நீர் கணக்குக் கேட்கமாட்டீர்”
  alternative: “நீர் விசாரிக்கமாட்டீர்” / “நீர் தேடமாட்டீர்”
  rationale: சங்கீதம் 10-ன் சூழலில் தீயவன் தெய்வீக நீதிவிசாரணையையும் பொறுப்பேற்பையும் மறுக்கிறான். ‘கணக்குக் கேட்பது’ அந்தக் கருத்தைத் தெளிவாக்குகிறது; கடவுள் அறியார் என்று தேவையின்றி பொருள் குறுக்கப்படவில்லை.
- issue: இரண்டாம் நபர் வினையின் பேச்சாளர் குறிப்பு
  choice: கடவுளை நோக்கிய “நீர்”
  alternative: “அவர் கணக்குக் கேட்கமாட்டார்”
  rationale: மசோரெட்டிக் உரையில் இரண்டாம் நபர் ஆண்பால் ஒருமை உள்ளது; ஆகவே தீயவனின் உள்ளுரையில் கடவுளை நேரடியாக நோக்கும் வடிவம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; எளிமையானதாயினும் சங்கீதத்திற்கேற்ற கண்ணியமான நடை. மூலத்தின் கேள்வி வடிவமும் உள்ளார்ந்த கூற்றும் பாதுகாக்கப்பட்டுள்ளன.
