source:
  edition: WLC
  text: יָ֘חִ֤ילוּ דרכ/ו בְּ/כָל עֵ֗ת מָר֣וֹם מִ֭שְׁפָּטֶי/ךָ מִ/נֶּגְדּ֑/וֹ כָּל צ֝וֹרְרָ֗י/ו יָפִ֥יחַ בָּ/הֶֽם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/005.yaml
  text: His ways prosper at all times[a]; your judgments are on high, out of his sight; as for all his adversaries[b], he snorts at them.
translation:
  language: ta
  text: அவனுடைய வழிகள் எல்லாக் காலங்களிலும் செழிக்கின்றன[a]; உமது நியாயத்தீர்ப்புகள் உயரத்தில் உள்ளன; அவன் பார்வைக்கு எட்டாதவை. அவனுடைய எதிரிகள் அனைவர்மேலும் அவன் மூச்சைச் சீறவிடுகிறான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனுடைய வழிகள் எல்லாக் காலங்களிலும் உறுதியாக நிலைத்திருக்கின்றன.” இங்குள்ள எபிரேய வினைச்சொல்லின் பொருள் கடினமானது; அது நெளிதல் அல்லது பிரசவ வேதனைப்படுதல் தொடர்பான பொருளிலும் புரிந்துகொள்ளப்பட்டுள்ளது. ஆனால் இச்சூழல் தொடர்ச்சியான வெற்றி அல்லது பாதுகாப்பைக் குறிப்பதாகத் தெரிகிறது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், “அவர்கள்மேல் மூச்சை ஊதுகிறான்.” இது இகழ்ச்சியை வெளிப்படுத்தும் உயிரோட்டமான படிமம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָחִילוּ
  choice: செழிக்கின்றன
  rationale: இந்த வினைச்சொல்லின் பொருள் இவ்விடத்தில் கடினமானது. சங்கீதத்தின் சூழலில் பொல்லாதவனின் செயல்கள் தொடர்ந்து வெற்றிபெறுவது அல்லது நிலைத்திருப்பது பற்றிய புலம்பலே முன்னிலையில் இருப்பதால், ‘செழிக்கின்றன’ என்பது இயல்பாகப் பொருந்துகிறது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.
- source_word: דרכ/ו (דַּרְכּוֹ)
  choice: அவனுடைய வழிகள்
  rationale: ஒருவனின் வாழ்க்கைமுறை, நடத்தை, செயல்போக்கு ஆகியவற்றைக் குறிக்கும் எபிரேய உருவகத்தைத் தமிழிலும் இயல்பாகத் தக்கவைக்கிறது.
- source_word: בְּכָל עֵת
  choice: எக்காலத்திலும்
  rationale: தொடர்ச்சியான நிலையைச் சுருக்கமாகவும் கவிதைநயத்துடனும் தெரிவிக்கிறது.
- source_word: מָרוֹם
  choice: உயரத்தில்
  rationale: தேவனுடைய நியாயத்தீர்ப்புகள் பொல்லாதவனுக்கு எட்டாத தொலைவில் இருப்பதுபோல் தோன்றும் இடவியல் உருவகத்தை விளக்கித் தீர்க்காமல் தக்கவைக்கிறது.
- source_word: מִשְׁפָּטֶיךָ
  choice: உமது நியாயத்தீர்ப்புகள்
  rationale: தேவனுடைய நீதித் தீர்ப்புகளையோ நீதிச் செயல்பாடுகளையோ குறிக்கக்கூடிய மூலச்சொல்லின் நீதித்துறை சார்ந்த பொருளைத் தக்கவைக்கிறது.
- source_word: מִנֶּגְדּוֹ
  choice: அவன் பார்வைக்கு எட்டாதவையாக
  rationale: முந்தைய ‘உயரத்தில்’ என்பதுடன் சேர்ந்து, அவற்றை அவன் காணாமலும் கருத்தில் கொள்ளாமலும் இருப்பதைக் காட்டுகிறது; இங்கு இடவியல் தொலைவு முதன்மையாகப் பாதுகாக்கப்படுகிறது.
- source_word: כָּל צֹרְרָיו
  choice: அவனுடைய எதிரிகள் அனைவரையும்
  rationale: அவனை எதிர்ப்பவர்கள் அல்லது பகைவர்கள் என்ற பரந்த பொருளை இயல்பான தமிழில் வழங்குகிறது.
- source_word: יָפִיחַ בָּהֶם
  choice: அவர்களைப் பார்த்து அவன் ஏளனமாகச் சீறுகிறான்
  rationale: எதிரிகளை இகழ்ந்து மூச்சை வெளிவிடும் தெளிவான உடல்சார் படிமத்தை, வெறும் ‘கேலி செய்கிறான்’ என்று பொருள்விரிவாக்காமல், வாசிக்கத்தக்க தமிழில் தக்கவைக்கிறது.
theological_decisions:
- issue: יָחִילוּ என்ற தொடக்க வினைச்சொல் பொல்லாதவனின் நிலையை எவ்வாறு விவரிக்கிறது?
  choice: பொல்லாதவனின் வழிகள் எக்காலத்திலும் செழிக்கின்றன.
  alternative: அவனுடைய வழிகள் எக்காலத்திலும் உறுதியாக அல்லது நிலையாக இருக்கின்றன; அல்லது அந்த வினைச்சொல்லுக்கு ‘நெளிதல்/வேதனைப்படுதல்’ தொடர்பான அரிய பொருள் இருக்கலாம்.
  rationale: இந்தச் சங்கீதப் பகுதி பொல்லாதவனின் வெளிப்படையான வெற்றியையும் அகந்தையையும் குறித்து முறையிடுகிறது. தேவனுடைய தீர்ப்புகள் அவனுக்கு எட்டாதவையாகத் தோன்றுவதும், எதிரிகளை அவன் இகழ்வதும் ‘செழிக்கின்றன’ என்ற வாசிப்பைச் சூழலோடு நன்றாக இணைக்கின்றன; எனினும் சொல்லின் உண்மையான சிக்கல் அடிக்குறிப்பில் தெரிவிக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘வழிகள்,’ ‘உயரத்தில்’ போன்ற மூல உருவகங்கள் தக்கவைக்கப்பட்டுள்ளன; கடினமான தொடக்க வினைச்சொல்லும் இறுதியிலுள்ள மூச்சுவிடும் படிமமும் அடிக்குறிப்புகள் மூலம் தெளிவுபடுத்தப்பட்டுள்ளன.
