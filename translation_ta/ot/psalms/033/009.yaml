lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கருத்துக்கான காரணத்தை அறிமுகப்படுத்தும் இணைப்புச் சொல்; எபிரெய மொழியின் காரணப் பொருளை இயல்பான தமிழில் காக்கிறது.
- source_word: הוּא
  choice: அவர்
  rationale: தேவனைக் குறிக்கும் தனிப்பட்ட சுட்டுப்பெயர். எபிரெயத்தில் வலியுறுத்தல் இருந்தாலும், இணை அமைப்பில் இருமுறை வரும் ‘அவர்’ என்பதே அதைத் தமிழில் இயல்பாக உணர்த்துகிறது.
- source_word: אָמַר
  choice: சொன்னார்
  rationale: தெய்வீக உரைத்தலின் நேரடியான பொருளைத் தருகிறது; மிகை விளக்கமின்றி அடுத்த விளைவுக் கூறுடன் இயல்பாக இணைகிறது.
- source_word: וַיְהִי
  choice: அது உண்டாயிற்று
  rationale: அவர் சொன்னவுடன் அது இருப்புக்கு வந்தது என்ற உடனடி விளைவைச் சுருக்கமாகத் தெரிவிக்கிறது. ‘அது இருந்தது’ என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: צִוָּה
  choice: கட்டளையிட்டார்
  rationale: ஒரு கட்டளையைப் பிறப்பித்தார் என்ற வினையின் நேரடியான, இயல்பான தமிழ் வடிவம்.
- source_word: וַיַּעֲמֹד
  choice: அது நிலைநின்றது
  rationale: ‘நின்றது’ என்ற மூல உருவகத்தையும், உறுதியாக நிறுவப்பட்டதைக் குறிக்கும் சூழல்சார் பொருளையும் ஒருங்கே தக்கவைக்கிறது.
theological_decisions:
- issue: தெய்வீக வார்த்தையைத் தொடர்ந்து உருவாகும் விளைவு
  choice: ‘அது உண்டாயிற்று’ / ‘அது நிலைநின்றது’
  alternative: ‘அது இருந்தது’ / ‘அது நின்றது’ அல்லது ‘அது நிறுவப்பட்டது’
  rationale: தேவனுடைய சொல் உடனடியாகவும் அவரது கட்டளை நிலைத்த விதமாகவும் விளைவுறுவதை கவித்துவ இணை அமைப்பில் காட்டுகிறது; படைப்பைப் பற்றிய கூடுதல் கோட்பாட்டு விளக்கத்தை வசனத்துக்குள் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய இணை அமைப்பும் சுருக்கமும் இயன்றவரை காக்கப்பட்டுள்ளன; உண்மையான சொற்பொருள் மாற்றுகள் அடிக்குறிப்புகளில் தரப்பட்டுள்ளன.
