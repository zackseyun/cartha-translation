  text: שִֽׁירוּ ל֭/וֹ שִׁ֣יר חָדָ֑שׁ הֵיטִ֥יבוּ נַ֝גֵּ֗ן בִּ/תְרוּעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/003.yaml
  text: Sing to him a new song[a]; play skillfully with a joyful shout.
translation:
  language: ta
  text: அவருக்குப் புதிய பாடலைப் பாடுங்கள்; மகிழ்ச்சியான ஆரவாரத்துடன்[a] திறமையாக இசையுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உரத்த களிப்புமுழக்கத்துடன்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் உரத்த களிப்புமுழக்கத்தையோ, மக்கள் எழுப்பும் பேரொலியையோ, சில சூழல்களில் எக்காளம் போன்ற முழக்கத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁירוּ
  choice: பாடுங்கள்
  rationale: שׁיר என்பதன் பன்மை ஏவல் வடிவம்; நேரடியான, இயல்பான தமிழ் கட்டளை வடிவம்.
- source_word: לוֹ
  choice: அவருக்கு
  rationale: לְ முன்னொட்டும் மூன்றாம் நபர் ஆண்பால் ஒருமை பின்னொட்டும் சேர்ந்து, பாடல் கடவுளை நோக்கிப் பாடப்படுவதைச் சுட்டுகின்றன.
- source_word: שִׁיר חָדָשׁ
  choice: புதிய பாடல்
  rationale: சொற்களின் நேரடிப் பொருளையும் சங்கீதங்களில் வரும் வழிபாட்டுச் சொல்லாட்சியையும் காக்கிறது.
- source_word: הֵיטִיבוּ נַגֵּן
  choice: திறமையாக இசையுங்கள்
  rationale: הֵיטִיבוּ இங்கு இசைத்தலை நன்றாக அல்லது நேர்த்தியாகச் செய்யுமாறு வலியுறுத்துகிறது; נַגֵּן பொதுவாகக் கருவியிசையை அல்லது இசை நிகழ்த்துதலைக் குறிக்கிறது. தமிழ் மொழியில் இவ்விரண்டின் சூழல்சார் பொருளை இயல்பாகத் தருகிறது.
- source_word: בִּתְרוּעָה
  choice: மகிழ்ச்சி ஆரவாரத்துடன்
  rationale: תְּרוּעָה என்பது உரத்த ஆரவாரம், களிப்புமுழக்கம் அல்லது எக்காளம் போன்ற பேரொலியைக் குறிக்கக்கூடும்; துதியின் சூழலில் மகிழ்ச்சியான ஆரவாரம் பொருத்தமானது, ஆனால் சொலின் விரிவான பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
theological_decisions:
- issue: לוֹ என்பதில் வரும் மூன்றாம் நபர் ஆண்பால் ஒருமையின் சுட்டுப்பொருள்
  choice: “அவருக்கு” என்பது உடனடிச் சூழலில் ஆண்டவராகிய கடவுளைக் குறிக்கிறது.
  alternative: பெயரை வெளிப்படையாகச் சேர்த்து “ஆண்டவருக்குப்” என்று மொழிபெயர்த்தல்.
  rationale: எபிரெய மூலத்தில் பெயர்ச்சொல் அல்ல, பதிலிப்பெயரே உள்ளது. ஆகவே சூழலில் குறிக்கப்படுபவர் கடவுள் என்றாலும், மூலத்தின் வெளிப்பாட்டு வடிவத்தைப் பாதுகாக்க “அவருக்கு” என்று தரப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரமான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான ஏவல் நடை பயன்படுத்தப்பட்டுள்ளது. “திறமையாக இசையுங்கள்” என்பது சொற்சொல்லான “நன்றாக இசையுங்கள்” என்பதைவிட இசை நிகழ்த்துதலின் நேர்த்தியை இயல்பாக வெளிப்படுத்துகிறது; תְּרוּעָה என்பதன் மெய்யான பொருள் விரிவு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
