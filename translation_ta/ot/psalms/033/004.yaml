source:
  edition: WLC
  text: כִּֽי יָשָׁ֥ר דְּבַר יְהוָ֑ה וְ/כָל מַ֝עֲשֵׂ֗/הוּ בֶּ/אֱמוּנָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/004.yaml
  text: For the word of Yahweh is upright[b][a], and all his work is done in faithfulness.
translation:
  language: ta
  text: ஏனெனில், யாவேயின் வார்த்தை செம்மையானது[a]; அவர் செய்யும் அனைத்தும் உண்மையோடு அமைந்துள்ளன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சரியானது.”
    reason: יָשָׁר என்பதற்கு இச்சூழலில் ‘செம்மையானது’ என்றும் ‘சரியானது’ என்றும் மொழிபெயர்க்கலாம்.
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய புகழ்ச்சிக்கான காரணத்தை அறிமுகப்படுத்தும் எபிரேயச் சொல்லின் காரணப் பொருளைத் தெளிவாகக் காக்கிறது.
- source_word: יָשָׁר
  choice: செம்மையானது
  rationale: ‘நேரானது,’ ‘சரியானது,’ ‘நீதியானது’ ஆகிய பொருள் நிழல்களை உள்ளடக்கி, யாவேயின் வார்த்தையின் ஒழுக்கச் செம்மையையும் நம்பகத்தன்மையையும் இயல்பான கவிதை நடையில் தெரிவிக்கிறது.
- source_word: דְּבַר יְהוָה
  choice: யாவேயின் வார்த்தை
  rationale: דָּבָר என்பதன் உரை அல்லது அறிவிப்பு சார்ந்த பொருளை ‘வார்த்தை’ இயல்பாகத் தருகிறது; יהוה என்ற தனிப்பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்படுகிறது.
- source_word: וְכָל מַעֲשֵׂהוּ
  choice: அவர் செய்வதெல்லாம்
  rationale: எபிரேய ஒருமை வடிவின் கூட்டுப்பொருளையும் כָּל என்பதன் முழுமையையும், தமிழில் செயற்கையாக ஒலிக்கும் ‘அவருடைய செயல் அனைத்தும்’ என்பதற்குப் பதிலாக இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בֶּאֱמוּנָה
  choice: உண்மைத்தன்மையுடன்
  rationale: אֱמוּנָה இங்கு குறிக்கும் நிலைத்த நம்பகத்தன்மை மற்றும் விசுவாசத்தன்மையை வெளிப்படுத்துகிறது; வெறும் தகவல் உண்மை என்ற பொருளுக்கு மட்டுப்படுத்தவில்லை.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பொதுப் பட்டப்பெயர் அல்ல, உடன்படிக்கைத் தனிப்பெயரான יהוה நேரடியாக உள்ளது; அதனைத் தனிப்பெயராகவே காக்கிறது.
- issue: מַעֲשֵׂהוּ என்பதன் எண்ணும் பரப்பும்
  choice: அவர் செய்வதெல்லாம்
  alternative: அவருடைய செயல் அனைத்தும்
  rationale: மூல வடிவம் ஒருமையாக இருந்தாலும் כָּל உடன் அது இறைவனுடைய முழுச் செயல்பாட்டையும் கூட்டாகக் குறிக்கிறது. தேர்ந்த வடிவம் அந்தப் பரப்பைக் காத்து இயல்பான தமிழை வழங்குகிறது.
- issue: வினையில்லா இரண்டாம் அரையடியின் வெளிப்பாடு
  choice: உண்மைத்தன்மையுடன் செய்யப்படுகிறது
  alternative: உண்மைத்தன்மையில் உள்ளது
  rationale: எபிரேயத்தில் வெளிப்படையான வினை இல்லை. தமிழில் பொருளை இயல்பாக்க ‘செய்யப்படுகிறது’ சேர்க்கப்பட்டுள்ளது; இது செயல் அனைத்தும் உண்மைத்தன்மையால் வகைப்படுத்தப்படுகிறது என்ற மூலக் கருத்தைத் தீர்மானமாக மாற்றுவதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதக் கவிதைக்கு ஏற்ற கண்ணியமான ஆனால் பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘செம்மையானது’ கவித்துவத் தன்மையையும் மூலத்தின் ஒழுக்கப் பொருளையும் காக்கிறது; ‘அவர் செய்வதெல்லாம்’ தமிழில் இயல்பான முழுமைப் பயன்பாடு.
