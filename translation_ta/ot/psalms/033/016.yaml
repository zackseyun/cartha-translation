  rationale: எபிரெய வாசகம் மனித இராணுவ வளங்களின் போதாமையை வலியுறுத்துகிறது; ஆனால் இவ்வசனத்திற்குள் இல்லாத விளக்கத்தையோ தனிப்பட்ட கோட்பாட்டு முடிவையோ சேர்க்காமல் அதன் கவித்துவத் தீவிரத்தையும் பதற்றத்தையும் தக்கவைக்க வேண்டும்.
