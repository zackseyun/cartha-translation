  language: ta
  text: மாபெரும் படையால் அரசன் காப்பாற்றப்படுவதில்லை[a]; மிகுந்த வலிமையால் போர்வீரன் விடுவிக்கப்படுவதில்லை[b].
  philosophy: optimal-equivalence
