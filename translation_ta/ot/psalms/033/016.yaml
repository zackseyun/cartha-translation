  register: நவீனத் தரத் தமிழில், கவித்துவ இணைநிலையைத் தெளிவாகக் காக்கும் dignified பொதுநடை பயன்படுத்தப்பட்டது. ‘அரசன்—போர்வீரன்’, ‘படை—வலிமை’, ‘காப்பாற்றப்படுதல்—தப்புவிக்கப்படுதல்’ என்ற இணைப்புகள் எபிரெயச் செய்யுளின் அமைப்பை பிரதிபலிக்கின்றன.
