lexical_decisions:
- source_word: אֵין הַמֶּלֶךְ נוֹשָׁע
  choice: அரசன் காப்பாற்றப்படுவதில்லை
  rationale: אֵין உடன் வரும் நிஃபால் வினையெச்சம் மறுப்பைத் தெரிவிக்கிறது. தமிழில் இயல்பான நிகழ்காலப் பொதுக்கூற்றாகவும், ישׁע என்பதன் பரந்த ‘காப்பாற்றுதல்/மீட்பது’ பொருளைத் தக்கவைக்கவும் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: בְּרָב חָיִל
  choice: மாபெரும் படையால்
  rationale: בְּ இங்கு கருவி அல்லது வழிமுறையைக் குறிக்கிறது. חָיִל என்பது வலிமை, படை, இராணுவ வளங்கள் ஆகியவற்றைக் குறிக்கலாம்; அரசனையும் போர்வீரனையும் பற்றிய இராணுவச் சூழலில் ‘படை’ இயல்பான முதன்மைத் தேர்வு.
- source_word: גִּבּוֹר
  choice: போர்வீரன்
  rationale: வலிமையும் போர்த் திறமையும் உடைய மனிதனைக் குறிக்கும் சொல். இச்சூழலில் ‘போர்வீரன்’ நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: לֹא יִנָּצֵל
  choice: தப்புவிக்கப்படுவதில்லை
  rationale: נצל என்பதன் நிஃபால் வடிவம் விடுவிக்கப்படுதல், மீட்கப்படுதல், ஆபத்திலிருந்து தப்புவிக்கப்படுதல் என்பதைக் குறிக்கிறது. முதல் அரையடியின் ‘காப்பாற்றப்படுவதில்லை’ என்பதுடன் பொருள் இணைப்பைத் தக்கவைத்தபடி எபிரெய இணைநிலையின் சொல்வேறுபாட்டையும் காட்டுகிறது.
- source_word: בְּרָב כֹּחַ
  choice: மிகுந்த வலிமையால்
  rationale: כֹּחַ உடல் வலிமை அல்லது ஆற்றலைக் குறிக்கிறது; בְּ கருவிப்பொருளில் வருவதால் ‘வலிமையால்’ என மொழிபெயர்க்கப்பட்டது.
theological_decisions:
- issue: இராணுவ வல்லமைக்கும் விடுதலைக்கும் உள்ள உறவு
  choice: பெரும் படையோ தனிப்பட்ட வலிமையோ தானாகவே காப்பை உறுதிசெய்யாது என்ற மறுப்பை நேரடியாக வைத்தல்
