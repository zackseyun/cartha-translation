lexical_decisions:
- source_word: לְהַצִּיל
  choice: விடுவிக்கவும்
  rationale: נצל என்பதன் ஹிஃபில் வடிவம் ஆபத்திலிருந்து தப்புவித்தல் அல்லது மீட்டல் என்ற பொருள் தருகிறது. “மரணத்திலிருந்து விடுவிக்கவும்” என்பது எபிரெயக் கவிதையின் சுருக்கத்தையும் பிரிவைக் குறிக்கும் מִן முன்னொட்டின் பொருளையும் இயல்பாகத் தக்கவைக்கிறது.
- source_word: מִמָּוֶת
  choice: மரணத்திலிருந்து
  rationale: מִן உடன் வரும் מָוֶת, மரணத்திலிருந்து விலக்கிக் காப்பதை நேரடியாகக் குறிக்கிறது; “சாவதிலிருந்து” என்பதைவிட “மரணத்திலிருந்து” மூலத்தின் செறிவான சொல்லாட்சியைப் பேணுகிறது.
- source_word: נַפְשָׁם
  choice: அவர்களுடைய உயிரை
  rationale: נֶפֶשׁ என்பது உயிர், ஆள், சுயம் அல்லது ஆன்மா ஆகிய பொருள் நிழல்களைக் கொண்டது. இச்சூழலில் உடல் உயிரைக் காப்பதே முன்னிலையில் இருப்பதால் “உயிரை” இயல்பான தமிழாக உள்ளது; மூலத்தின் கூட்டுப் பொருளுடைய ஒருமை வடிவமும் இதனால் தக்கவைக்கப்படுகிறது. பிற சாத்தியமான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וּלְחַיּוֹתָם
  choice: அவர்களை உயிரோடு காக்கவும்
  rationale: חיה என்பதன் இவ்வடிவம் உயிருடன் வைத்தல் அல்லது உயிரைப் பேணுதல் என்று பொருள்படுகிறது. “உயிரோடு காக்கவும்” என்பது தொடர்ச்சியான பாதுகாப்பைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: בָּרָעָב
  choice: பஞ்சத்தில்
  rationale: רָעָב இச்சூழலில் தனிப்பட்ட பசியைவிடப் பஞ்சநிலையைக் குறிக்கிறது. “பஞ்சத்தில்” என்பது בְּ முன்னொட்டின் சூழ்நிலைப் பொருளைச் சுருக்கமாகப் பேணுகிறது.
