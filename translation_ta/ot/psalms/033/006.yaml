  yaml_path: translation/ot/psalms/033/006.yaml
  text: By the word of Yahweh the heavens were made[a], and by the breath of his mouth all their host.
translation:
  language: ta
  text: 'யாவேயின் வார்த்தையினால் வானங்கள் உண்டாக்கப்பட்டன;

    அவருடைய வாயின் மூச்சினால்[a] வான்படையனைத்தும் உண்டாயின.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவருடைய வாயின் ஆவியினால்.” רוּחַ என்ற எபிரெயச் சொல் “மூச்சு,” “காற்று,” அல்லது “ஆவி” என்று பொருள்படலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: בִּדְבַר
  choice: வார்த்தையினால்
  rationale: בְּ இங்கு கருவிப்பொருளைக் குறிக்கிறது. ‘வார்த்தையினால்’ என்பது வானங்கள் யாவேயின் சொல்லை வழிமுறையாகக் கொண்டு உண்டாக்கப்பட்டன என்ற பொருளை இயல்பாகத் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், நவீனத் தமிழில் அதன் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: שָׁמַיִם
  choice: வானங்கள்
  rationale: எபிரெயச் சொல்லின் பன்மை வடிவத்தையும், படைப்புச் சூழலில் அதன் விரிந்த வானுலகப் பொருளையும் காக்கிறது.
- source_word: נַעֲשׂוּ
  choice: உண்டாக்கப்பட்டன
  rationale: עשה என்பதன் பொதுவான ‘செய்/உண்டாக்கு’ பொருளைத் தருகிறது; மூலத்தில் இல்லாத ברא என்பதற்குரிய குறிப்பான ‘படை’ என்ற வலிமையைத் தேவையின்றிச் சேர்ப்பதில்லை.
- source_word: וּבְרוּחַ
  choice: அவருடைய வாயின் மூச்சினால்
  rationale: רוּחַ என்பதற்கு ‘மூச்சு’, ‘காற்று’, ‘ஆவி’ ஆகிய பொருள்கள் இருக்கலாம். ‘வாய்’ என்பதுடனான உடனடித் தொடர்பிலும் ‘வார்த்தை’ என்பதற்கான கவிதை இணைப்பிலும் ‘மூச்சு’ முதன்மைப் பொருளாக இயல்பாகிறது.
- source_word: פִּיו
  choice: அவருடைய வாய்
  rationale: ‘வார்த்தை’ என்பதோடு அமைந்துள்ள கவிதை இணைப்பையும் மனித உருவக மொழியையும் நேரடியாகக் காக்கிறது.
- source_word: כָּל־צְבָאָם
  choice: அவற்றின் படைகள் அனைத்தும்
  rationale: כָּל முழுமையைக் குறிக்கிறது; צָבָא வானங்களோடு தொடர்புபடும்போது அவற்றின் திரளான வானப்படையைக் குறிக்கிறது. பன்மையான ‘வானங்கள்’ என்பதுடன் பின்னொட்டின் தொடர்பையும் ‘அவற்றின்’ தெளிவாக்குகிறது.
theological_decisions:
- issue: படைப்புச் சூழலில் רוּחַ என்பதன் பொருளும், ஆவியானவரைக் குறித்திருக்கக்கூடிய இறையியல் எதிரொலியும்
  choice: மூச்சு
  alternative: ஆவி
  rationale: ‘யாவேயின் வார்த்தை’ என்பதற்கு இணையாக ‘அவருடைய வாயின் மூச்சு’ வருவதால், இங்கு ‘மூச்சு’ என்பது உடனடிச் சூழலுக்கு மிகவும் பொருத்தமானது. எனினும், רוּחַ என்பதற்கு ‘ஆவி’ என்றும் பொருள் இருப்பதால் அந்த இறையியல் சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது; மூல எபிரெயம் உறுதியாகச் சொல்லாத அளவுக்கு தனிப்பட்ட தெய்வீக நபரைக் குறிப்பதாக முதன்மை உரை தீர்மானிப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதை இணைப்பையும் கண்ணியமான வேதாகம நடையையும் காக்கும் மொழிபெயர்ப்பு. இரண்டாம் அரையடியில் எபிரெயத்தில் விடுபட்டுள்ள வினை தமிழில் இயல்புக்கும் தெளிவுக்கும் ஏற்றவாறு ‘உண்டாயின’ என்று நிரப்பப்பட்டுள்ளது; அது முதலாம் அரையடியின் வினையைத் தொடர்கிறது.
