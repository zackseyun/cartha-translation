  text: מִ֭/שָּׁמַיִם הִבִּ֣יט יְהוָ֑ה רָ֝אָ֗ה אֶֽת כָּל בְּנֵ֥י הָ/אָדָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/013.yaml
  text: From heaven Yahweh looks[a]; he sees all the sons of man.
translation:
  language: ta
  text: வானத்திலிருந்து யாவே நோக்குகிறார்; மானிடர் அனைவரையும்[a] அவர் காண்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்படியாக, “மனிதனின் மகன்கள் அனைவரையும்”; இது மனிதர்கள் அனைவரையும் கூட்டாகக் குறிக்கும் கவிதைச் சொற்றொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשָּׁמַיִם
  choice: வானத்திலிருந்து
  rationale: מִן மூலத்தையோ நோக்கும் இடத்தையோ குறிக்கிறது; שָׁמַיִם என்பதற்கு தமிழில் இயல்பாகவும் கவிதைநயத்துடனும் ‘வானம்’ என்று ஒருமையில் வழங்கப்பட்டது.
- source_word: הִבִּיט
  choice: நோக்குகிறார்
  rationale: נבט என்பதன் ஹிப்இல் வடிவம் கவனத்தைச் செலுத்திப் பார்ப்பதைக் குறிக்கிறது. சங்கீதத்தின் பொதுவான, தொடரும் உண்மையை வெளிப்படுத்த நிகழ்காலம் பயன்படுத்தப்பட்டது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது இறைத்திருநாமமாகிய நான்கெழுத்துப் பெயர்; பட்டப்பெயரால் மாற்றாமல், தமிழில் பரவலாகப் புரிந்துகொள்ளப்படும் ஒலிபெயர்ப்பான ‘யாவே’ என வழங்கப்பட்டது.
- source_word: רָאָה
  choice: அவர் காண்கிறார்
  rationale: ראה என்பதன் அடிப்படைப் பொருள் ‘காணுதல்.’ இணை அமைப்பிலும் பொதுநிலை உண்மையிலும் பொருந்துமாறு நிகழ்காலத்தில் வழங்கப்பட்டது.
- source_word: כָּל
  choice: அனைவரையும்
  rationale: பின்வரும் பன்மைக் கூட்டுப்பெயருடன் כָּל முழு மனிதக்குலத்தையும் கூட்டாகக் குறிக்கிறது.
- source_word: בְּנֵי הָאָדָם
  choice: மானிடர் அனைவரையும்
  rationale: எபிரெயச் சொற்றொடர் எழுத்துப்படி ‘மனிதனின் மகன்கள்’ என்றாலும், கவிதை வழக்கில் மனிதர்கள் அனைவரையும் கூட்டாகக் குறிக்கிறது. தமிழில் இயல்பாகவும் உயர்ந்த கவிதை நடையுடனும் ‘மானிடர்’ என வழங்கி, மூல வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூல உரை பட்டப்பெயரை அல்ல, தனிப்பட்ட இறைப்பெயரையே பயன்படுத்துகிறது. ஆகவே அந்த வேறுபாட்டைப் பாதுகாக்க ‘யாவே’ என ஒலிபெயர்க்கப்பட்டது.
- issue: בְּנֵי הָאָדָם என்பதன் கூட்டுப்பொருள்
  choice: மானிடர் அனைவரையும்
  alternative: மனிதனின் மகன்கள் அனைவரையும்
  rationale: இந்த எபிரெயக் கவிதை மரபுச் சொற்றொடர் ஆண்களை மட்டும் அல்லாமல் மனிதர்களை ஒட்டுமொத்தமாகக் குறிக்கிறது. தமிழில் தவறான பாலின வரையறை ஏற்படாதபடி கூட்டுப்பொருள் முதன்மை உரையில் தரப்பட்டு, சொற்படியான வடிவம் அடிக்குறிப்பில் குறிப்பிடப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதத்துக்குரிய சுருக்கமான கவிதைநயமும் இணை வாக்கிய அமைப்பும் பேணப்பட்டுள்ளன. ‘நோக்குகிறார் / காண்கிறார்’ என்ற நிகழ்கால வடிவங்கள் எபிரெய நிறைவுவினைகள் இங்கு தெரிவிக்கும் தொடர்ந்த பொதுநிலை உண்மையை வெளிப்படுத்துகின்றன.
