  text: מִֽ/מְּכוֹן שִׁבְתּ֥/וֹ הִשְׁגִּ֑יחַ אֶ֖ל כָּל יֹשְׁבֵ֣י הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/014.yaml
  text: From the place of his dwelling he looks out on all the inhabitants of the earth[a][b].
translation:
  language: ta
  text: அவர் தங்கியிருக்கும் இடத்திலிருந்து, பூமியில் குடியிருக்கும் அனைவரையும் உற்றுநோக்குகிறார்[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கவனமாக நோக்குகிறார்” அல்லது “கண்காணிக்கிறார்” என்றும் மொழிபெயர்க்கலாம். எபிரெய வினை கவனத்துடன் பார்ப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ஒரு குறிப்பிட்ட பிரதேசத்தைக் குறிப்பதாக எடுத்துக்கொண்டால், “நாட்டில்” என்றும் மொழிபெயர்க்கலாம்; இங்கு சூழல் உலகளாவியதாக இருப்பதால் “பூமியில்” என்பது தேர்ந்தெடுக்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמְּכוֹן
  choice: இடத்திலிருந்து
  rationale: מָכוֹן என்பது நிலைபெற்ற இடத்தைக் குறிக்கிறது; שִׁבְתּוֹ என்பதுடன் சேரும்போது ‘அவர் தங்கியிருக்கும் இடத்திலிருந்து’ என்பது இயல்பாகவும் மூலத்தின் இடப்பொருளைத் தெளிவாகவும் தருகிறது.
- source_word: שִׁבְתּוֹ
  choice: அவர் தங்கியிருக்கும்
  rationale: ישׁב வேரிலிருந்து வந்த இவ்வடிவம் ‘அவர் தங்குதல்/வசிப்பிடம்’ என்ற பொருளுடையது; தமிழில் பெயரெச்சத் தொடராக வழங்குவது இயல்பானது.
- source_word: הִשְׁגִּיחַ
  choice: உற்றுநோக்குகிறார்
  rationale: שׁגח என்பதன் Hiphil வடிவம் கவனமாகப் பார்த்தல், நோக்குதல் என்ற நுண்பொருளைக் கொண்டது; ‘உற்றுநோக்குகிறார்’ அந்தக் கவனமான பார்வையை வெளிப்படுத்துகிறது.
- source_word: אֶל
  choice: -ஐ
  rationale: நோக்குதலின் இலக்கைக் குறிக்கும் אֶל, தமிழ் வினைத்தொடரில் நேரடி வேற்றுமை உருபான ‘-ஐ’ மூலம் இயல்பாக வெளிப்படுகிறது.
- source_word: כָּל
  choice: அனைவரையும்
  rationale: பின்வரும் பன்மை மனிதக் குழுவை முழுமையாக உள்ளடக்கும் כָּל என்பதற்கு ‘அனைவரையும்’ நேர்த்தியான தமிழ் இணை.
- source_word: יֹשְׁבֵי
  choice: குடியிருக்கும்
  rationale: ישׁב என்பதன் பன்மை வினையெச்ச வடிவம் ‘குடியிருப்பவர்கள்’ என்பதைக் குறிக்கிறது; ‘பூமியில் குடியிருக்கும் அனைவரும்’ என்பது இயல்பான நவீன தமிழ்.
- source_word: הָאָרֶץ
  choice: பூமியில்
  rationale: சங்கீதத்தின் உலகளாவிய சூழலில் הָאָרֶץ ஒரு குறிப்பிட்ட நாட்டைவிடப் பூமியைக் குறிக்கிறது; இடப்பொருள் தமிழில் ‘பூமியில்’ என வழங்கப்படுகிறது.
theological_decisions:
- issue: இறைவனின் பார்வையின் எல்லை
  choice: பூமியில் குடியிருக்கும் அனைவரையும் உள்ளடக்கும் உலகளாவிய பொருள்
  alternative: ஒரு குறிப்பிட்ட நாட்டில் குடியிருப்பவர்கள்
  rationale: כָּל יֹשְׁבֵי הָאָרֶץ என்ற சொற்றொடரும் சுற்றியுள்ள சூழலும் மனிதர் அனைவரையும் உள்ளடக்கும் பரப்பைக் காட்டுகின்றன; இது தனிப்பட்ட கோட்பாட்டைச் சேர்க்காமல் சூழலின் பொருளைப் பின்பற்றுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் dignified நடையில் அமைக்கப்பட்டுள்ளது. ‘உற்றுநோக்குகிறார்’ என்பது கவனமான பார்வையைத் தக்கவைக்கிறது; ‘தங்கியிருக்கும் இடம்’ என்பது மூலத்தின் நிலையான வாசஸ்தலக் கருத்தை மிகைப்படுத்தாமல் இயல்பாக வெளிப்படுத்துகிறது.
