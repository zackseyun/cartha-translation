  text: יִֽירְא֣וּ מֵ֭/יְהוָה כָּל הָ/אָ֑רֶץ מִמֶּ֥/נּוּ יָ֝ג֗וּרוּ כָּל יֹשְׁבֵ֥י תֵבֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/008.yaml
  text: Let all the earth fear Yahweh[a]; let all the inhabitants of the world stand in awe of him.
translation:
  language: ta
  text: பூமியெங்கும் யாவேக்கு அஞ்சட்டும்; உலகில் வாழும் அனைவரும் அவருக்கு அஞ்சி நடுங்கட்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவருக்குப் பெரிதும் அச்சப்படட்டும்” அல்லது “அவர்முன் நடுங்கட்டும்.” இங்குள்ள எபிரேய வினை பயபக்தி கலந்த ஆழ்ந்த அச்சத்தையோ நடுக்கத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִירְאוּ
  choice: அஞ்சட்டும்
  rationale: யרא என்பதன் Qal imperfect இங்கு வேண்டுகோள்/அறைகூவல் வலிமையைக் கொண்டுள்ளது. ‘அஞ்சட்டும்’ என்பது பயபக்தி கலந்த அச்சத்தைத் தளர்த்தாமல், தமிழில் இயல்பாக அந்த வலிமையை வெளிப்படுத்துகிறது.
- source_word: מֵיְהוָה
  choice: யாவேக்கு
  rationale: ירא உடன் வரும் מן இங்கு அச்சத்தின் பொருளைக் குறிக்கும் எபிரேய மரபுத்தொடர். தமிழில் ‘யாவேக்கு அஞ்சட்டும்’ என்று இயல்பாக வழங்கப்பட்டுள்ளது; தேவப்பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: כָּל הָאָרֶץ
  choice: பூமி முழுவதும்
  rationale: இணைவரியின் ‘உலகில் குடியிருப்போர் அனைவரும்’ என்பதுடன் சேர்ந்து இது உள்ளூர் நிலப்பகுதியை அல்ல, உலகளாவிய பரப்பைக் குறிக்கிறது.
- source_word: מִמֶּנּוּ
  choice: அவரைக் கண்டு
  rationale: גור உடன் מן + சுட்டுப்பெயர், அச்சத்தை உண்டாக்கும் நபரைச் சுட்டுகிறது. ‘அவரைக் கண்டு’ என்பது தமிழில் அந்த உறவை இயல்பாகக் காட்டுகிறது; இதை வெறும் இடவியல் பொருளாக மாற்றுவதில்லை.
- source_word: יָגוּרוּ
  choice: அஞ்சி நடுங்கட்டும்
  rationale: גור இங்கு ஆழ்ந்த அச்சம், திகில், நடுக்கம் ஆகிய பொருள் நிழல்களைக் கொண்டுள்ளது. முதல் வரியின் ‘அஞ்சட்டும்’ என்பதுடன் கவிதை இணைநிலையைப் பேணிக்கொண்டே, இரண்டாம் வினையின் தீவிரத்தை ‘அஞ்சி நடுங்கட்டும்’ வெளிப்படுத்துகிறது.
- source_word: כָּל יֹשְׁבֵי תֵבֵל
  choice: உலகில் குடியிருப்போர் அனைவரும்
  rationale: יֹשְׁבֵי என்பது குடியிருப்போரையும், תֵבֵל என்பது மக்கள் வாழும் உலகையும் குறிக்கிறது. தேர்ந்தெடுத்த தமிழ் நடை இயல்பாகவும் உலகளாவிய நோக்கத்தைத் தெளிவாகவும் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற தேவப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல எபிரேய உரையில் நான்கெழுத்துத் தேவப்பெயர் நேரடியாக உள்ளது. அதை பொதுப்பட்டமாக மாற்றாமல், உடன்படிக்கையின் தனிப்பெயராக ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பேணுகிறது.
- issue: ‘அஞ்சுதல்’ என்பதிலுள்ள பயமும் பயபக்தியும்
  choice: அஞ்சட்டும் / அஞ்சி நடுங்கட்டும்
  alternative: பயபக்தி கொள்ளட்டும்
  rationale: மூல வினைகள் வெறும் மரியாதையைவிட வலுவான அச்சத்தையும் நடுக்கத்தையும் அனுமதிக்கின்றன. அதேவேளை, கவிதைச் சூழல் பயபக்தியையும் உள்ளடக்குகிறது; ஆகவே அந்த இறுக்கத்தை ஒரே பொருளாகச் சுருக்காமல் வைக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டு மரியாதையுடன் இருந்தாலும் சாதாரண வாசகர்களுக்குப் புரியும் நடையில் வழங்கப்பட்டுள்ளது. இரு இணைவரிகளின் உலகளாவிய பரப்பும், ‘அஞ்சுதல்’ முதல் ‘அஞ்சி நடுங்குதல்’ வரை உள்ள கவிதைத் தீவிரமும் பேணப்பட்டுள்ளன.
