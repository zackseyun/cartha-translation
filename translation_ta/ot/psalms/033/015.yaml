translation:
  language: ta
  text: அவர்களுடைய எல்லாரின் இதயங்களையும் ஒரேவகையாக உருவாக்குகிறவர்[a], அவர்களுடைய செயல்கள் அனைத்தையும் புரிந்துகொள்கிறவர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவர்களுடைய இதயங்களை ஒன்றாக உருவாக்குகிறவர்.’ எபிரெயச் சொல் יַחַד என்பதற்கு ‘ஒன்றாக’ என்றும் பொருள் கொள்ளலாம்; இங்கு எல்லாரின் இதயங்களையும் அவர் ஒரேவகையாக உருவாக்குகிறார் என்ற பொருளிலும் கொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיֹּצֵר
  choice: உருவாக்குகிறவர்
  rationale: யצר என்பதன் Qal நிகழ்காலப் பங்கேற்புவினை பெயர்ச்சொல் போலச் செயல்பட்டு, கடவுளை உருவாக்குகிறவர் எனப் பண்பியல்பாகக் குறிப்பிடுகிறது.
- source_word: יַחַד
  choice: அனைவருடைய
  rationale: இங்கு யַחַד என்பது எல்லா மனிதர்களின் இதயங்களையும் பொதுவாகத் தழுவும் உருவாக்குதலைக் குறிக்கிறது. தமிழில் ‘அனைவருடைய இதயங்களையும்’ என்பது இதை இயல்பாக வெளிப்படுத்துகிறது; ‘ஒன்றாக’ என்பது ஒரே நேரத்தில் அல்லது கூட்டாக உருவாக்குதல் என்ற தேவையற்ற எண்ணத்தைத் தரலாம்.
- source_word: לִבָּם
  choice: அவர்களுடைய இதயங்களையும்
  rationale: எபிரெயில் ஒருமை பெயர்ச்சொல்லுடன் மூன்றாம் நபர் ஆண்பால் பன்மை பின்னொட்டு இருந்தாலும், பல மனிதர்களைக் குறிக்கும் பகிர்வுப் பொருளைத் தமிழில் பன்மையாகக் கூறுவது இயல்பானது.
- source_word: הַמֵּבִין
  choice: புரிந்துகொள்கிறவர்
  rationale: בין என்பதன் Hiphil பங்கேற்புவினை புரிந்துகொள்ளுதல் அல்லது பகுத்தறிதலைக் குறிக்கிறது; ‘புரிந்துகொள்கிறவர்’ தெளிவான நவீனத் தமிழாகவும் இணை அமைப்புக்கு ஏற்றதாகவும் உள்ளது.
- source_word: אֶל
  choice: —
  rationale: בין உடன் வரும் אֶל புரிதல் செலுத்தப்படும் பொருளைக் குறிக்கிறது; தமிழில் தனிச் சொல்லாக மொழிபெயர்க்காமல் நேரடி செயப்படுபொருள் அமைப்பில் இயல்பாக உள்ளடக்கப்படுகிறது.
- source_word: כָּל מַעֲשֵׂיהֶם
  choice: அவர்களுடைய செயல்கள் அனைத்தையும்
  rationale: מַעֲשִׂים செயல்கள் அல்லது கிரியைகளைக் குறிக்கிறது. ‘செயல்கள்’ என்பது நவீனத் தமிழில் இயல்பாகவும் மனித நடத்தை முழுவதையும் உள்ளடக்குவதாகவும் உள்ளது.
theological_decisions:
- issue: வசனத்தின் பொருள் கொள்ளப்படும் மனிதர்களின் வரம்பு
  choice: கடவுள் எல்லா மனிதர்களுடைய இதயங்களையும் உருவாக்கி, அவர்களுடைய செயல்கள் அனைத்தையும் புரிந்துகொள்கிறவர் என வசனம் கூறுகிறது.
  alternative: உடனடிச் சூழலிலுள்ள அரசர்கள் அல்லது தேசங்களின் இதயங்களை மட்டும் இது குறிக்கிறது என்று குறுகலாக வாசிக்கலாம்.
  rationale: 13–15ஆம் வசனங்களின் சூழல் ‘மனிதர்கள் எல்லாரையும்’, ‘பூமியில் குடியிருப்போர் அனைவரையும்’ தழுவுகிறது. ஆகவே மொழிபெயர்ப்பு பொருளை அதற்கு அப்பால் குறுக்கவில்லை.
translation_notes:
  register: நவீன நிலையான, கண்ணியமான தமிழ். எபிரெயக் கவிதையின் இரு பங்கேற்புவினைத் தொடர்களையும் ‘உருவாக்குகிறவர் ... புரிந்துகொள்கிறவர்’ என்ற இணை அமைப்பில் காக்கிறது; மெய்யியல் விளக்கத்தை உரையில் கூடுதலாகச் சேர்க்கவில்லை.
