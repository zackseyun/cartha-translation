  yaml_path: translation/ot/psalms/033/022.yaml
  text: Let your steadfast love be upon us, O LORD, even as we hope in you.
translation:
  language: ta
  text: யெகோவாவே, நாங்கள் உம்மை எதிர்நோக்கியிருப்பதற்கேற்ப, உமது மாறாத அன்பு எங்கள்மேல் இருப்பதாக.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֶסֶד
  choice: மாறாத அன்பு
  rationale: உடன்படிக்கைச் சூழலில் நிலைத்த, பற்றுறுதியுள்ள அன்பைக் குறிக்கும் சொல்லின் செறிவை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: மூலத்தில் உள்ள தேவனுடைய தனிப்பெயரை பொதுப்பட்டமாக மாற்றாமல் தமிழ் வாசகர்களுக்கு அறிமுகமான வடிவில் தருகிறது.
- source_word: יִחַלְנוּ לָךְ
  choice: நாங்கள் உம்மை எதிர்நோக்கியிருக்கிறோம்
  rationale: יִחל என்பதன் நம்பிக்கையுடன் காத்திருத்தல் அல்லது எதிர்பார்த்திருத்தல் என்ற பொருளையும், לָךְ என்பதன் நேரடியான நோக்கையும் தக்கவைக்கிறது.
theological_decisions:
- issue: כַּאֲשֶׁר என்ற ஒப்பீட்டு இணைப்பின் பொருள்
  choice: எதிர்நோக்கியிருப்பதற்கேற்ப
  alternative: எதிர்நோக்கியிருக்கிறபடியே
  rationale: அன்பின் அளவை மனித நம்பிக்கை சம்பாதிக்கிறது என்று மிகைப்படுத்தாமல், மூலத்தின் ‘எவ்வாறு/எந்த அளவுக்கு’ என்ற ஒப்பீட்டு உறவைத் திறந்த நிலையில் வைத்திருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; வேண்டுதல் தொனியை ‘இருப்பதாக’ என்றும், தேவனை நோக்கிய மரியாதை ஒருமையை ‘உம்மை/உமது’ என்றும் வழங்குகிறது. கவிதைத் தன்மையும் மூல வாக்கிய வரிசையும் இயன்றவரை பேணப்பட்டுள்ளன.
