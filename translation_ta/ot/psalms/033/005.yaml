id: PSA.33.5
reference: Psalms 33:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: אֹ֭הֵב צְדָקָ֣ה וּ/מִשְׁפָּ֑ט חֶ֥סֶד יְ֝הוָ֗ה מָלְאָ֥ה הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/005.yaml
  text: He loves righteousness and justice[a]; the earth is full of the steadfast love of Yahweh.
translation:
  language: ta
  text: 'அவர் நீதியையும் நியாயத்தையும் நேசிக்கிறார்;

    யாவேயின் மாறாத அன்பால்[a] பூமி நிறைந்திருக்கிறது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உண்மையுள்ள அன்பு.” எபிரெயச் சொல் חֶסֶד, யாவேயின் மாறாத, பற்றுறுதியுள்ள அன்பை வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹהֵב
  choice: நேசிக்கிறார்
  rationale: ஆண்பால் ஒருமை Qal வினையெச்சம் இங்கு யாவேயின் நிலையான இயல்பை விவரிக்கிறது; தமிழில் நிகழ்கால வினை வடிவம் இயல்பாகவும் வழக்கமான செயற்பண்பையும் வெளிப்படுத்துகிறது.
- source_word: צְדָקָה
  choice: நீதி
  rationale: מִשְׁפָּט என்பதுடன் இணைந்திருப்பதால், இது நேர்மை மற்றும் சரியான ஒழுக்கநிலையைக் குறிக்கிறது; அடுத்த சொல்லின் நீதித்தீர்ப்பு சார்ந்த பொருளை மீண்டும் கூறாமல் வேறுபாட்டைக் காக்கிறது.
- source_word: מִשְׁפָּט
  choice: நியாயம்
  rationale: இங்கு நியாயமான தீர்ப்பையும் ஒழுங்கையும் குறிக்கும் பரந்த ஒழுக்கப் பொருள் உள்ளது; ‘நீதி மற்றும் நியாயம்’ என்ற இணை தமிழில் தெளிவாக வேறுபாட்டைக் காக்கிறது.
- source_word: חֶסֶד
  choice: மாறாத அன்பு
  rationale: இந்த எபிரெயச் சொல் அன்பு, இரக்கம், விசுவாசமான பற்றுறுதி ஆகியவற்றை ஒருங்கே சுமக்கிறது. ‘மாறாத அன்பு’ அதன் நீடித்த நிலைத்தன்மையை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பட்டத்தைப் பதிலிடாமல், எபிரெய வேதத்தில் உள்ள தனிப்பட்ட இறைப்பெயரான יהוה-ஐ தமிழில் ஒலிபெயர்க்கிறது.
- source_word: מָלְאָה
  choice: நிறைந்திருக்கிறது
  rationale: பெண்பால் ஒருமை perfect வடிவம் இங்கு நிகழ்கால நிலை/விளைவு பொருளைக் கொண்டுள்ளது; ‘நிறைந்திருக்கிறது’ அதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הָאָרֶץ
  choice: பூமி
  rationale: சங்கீதத்தின் பரந்த படைப்புலகச் சூழலில் இது குறிப்பிட்ட ஒரு நாட்டைவிட உலகம் முழுவதையும் குறிக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல வசனம் יהוה என்ற தனிப்பட்ட இறைப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. ‘யாவே’ என்பது பட்டப்பெயரைப் பதிலிடாமல் அந்தப் பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- issue: חֶסֶד என்பதிலுள்ள உடன்படிக்கைப் பற்றுறுதி
  choice: மாறாத அன்பு
  alternative: உண்மையுள்ள அன்பு
  rationale: மூலச்சொல்லில் அன்பும் நிலையான பற்றுறுதியும் ஒன்றிணைந்துள்ளன. முதன்மை உரை அதன் நீடித்த தன்மையை வலியுறுத்துகிறது; உண்மைத்தன்மையை வலியுறுத்தும் மாற்று அடிக்குறிப்பில் கொடுக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. எபிரெய இணைப்பின் சமநிலையைத் தக்கவைக்க முதல் அடியில் ‘நீதியையும் நியாயத்தையும்’ பயன்படுத்தி, இரண்டாம் அடியில் உலகளாவிய நிறைவை இயல்பான சொற்றொடரில் வெளிப்படுத்தப்பட்டுள்ளது.
