  text: אַשְׁרֵ֣י הַ֭/גּוֹי אֲשֶׁר יְהוָ֣ה אֱלֹהָ֑י/ו הָ/עָ֓ם בָּחַ֖ר לְ/נַחֲלָ֣ה לֽ/וֹ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/012.yaml
  text: Blessed is the nation whose God is Yahweh[b][a], the people he has chosen for his inheritance.
translation:
  language: ta
  text: 'யாவே தங்கள் கடவுளாகக் கொண்ட நாடு பேறுபெற்றது[a];

    அவர் தமக்கு உரிமைச்சொத்தாகத் தேர்ந்தெடுத்த மக்கள்[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பேறுபெற்றது’ என்பதற்கு ‘மகிழ்ச்சிக்குரியது’ அல்லது ‘நற்பேறு பெற்றது’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் வெறும் உணர்ச்சியை மட்டுமல்ல, நன்மையான நிலையில் இருப்பதையும் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: இரண்டாம் வரி குறிப்பாக யாவே தமக்கெனத் தேர்ந்தெடுத்த இஸ்ரவேல் மக்களைச் சுட்டலாம். இருப்பினும் எபிரெய மூலத்தில் ‘மக்கள்’ என்ற கவிதைச் சொல்லே உள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: பேறுபெற்றது / பேறுபெற்றவர்கள்
  rationale: எபிரெய வாழ்த்துரையின் பொருள் வெறும் மனமகிழ்ச்சியல்ல; கடவுளால் நன்மையான நிலையில் வைக்கப்பட்டிருப்பதைக் குறிக்கிறது. ‘பேறுபெற்ற’ என்பது சங்கீதத்திற்குரிய கண்ணியமான தொனியையும் இப்பொருளையும் இயல்பாகத் தருகிறது.
- source_word: הַגּוֹי
  choice: நாடு
  rationale: גּוֹי இங்கு இன, சமூக, தேசிய ஒருமைப்பாடு கொண்ட கூட்டத்தைக் குறிக்கிறது; இணைவரியில் வரும் ‘மக்கள்’ என்பதோடு கவிதை இணைப்பையும் ‘நாடு’ காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது ஒரு பட்டப்பெயர் அல்ல, எபிரெய வேதாகமத்தில் வரும் கடவுளின் தனிப்பெயர். ஆகவே ‘ஆண்டவர்’ என்று மாற்றாமல் தமிழில் வழக்கமான ஒலிபெயர்ப்பான ‘யாவே’ பயன்படுத்தப்படுகிறது.
- source_word: אֱלֹהָיו
  choice: தங்கள் கடவுள்
  rationale: எபிரெயில் சொற்படியாக ‘அதன் கடவுள்’ என்ற ஒருமை வடிவம் உள்ளது. தமிழில் ஒரு நாட்டை அதன் மக்களாகக் கருதும் இயல்பான பயன்பாட்டின்படி ‘தங்கள் கடவுள்’ என வழங்கப்பட்டுள்ளது.
- source_word: הָעָם
  choice: மக்கள்
  rationale: עָם உடன்படிக்கை மற்றும் சமூக அடையாளம் கொண்ட மக்களைக் குறிக்கலாம். ‘மக்கள்’ என்பது அதன் பரந்த பொருளையும் முதல் வரியுடனான கவிதை இணைப்பையும் காக்கிறது.
- source_word: בָּחַר
  choice: தேர்ந்தெடுத்த
  rationale: எபிரெய நிறைவுற்ற வினை கடவுள் செய்த தேர்வைக் கூறுகிறது; தமிழ் இறந்தகாலப் பெயரெச்சம் அதன் முடிவுற்ற செயலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לְנַחֲלָה לוֹ
  choice: தமக்கு உரிமைச்சொத்தாக
  rationale: נַחֲלָה என்பது பங்காகக் கிடைக்கும் சொத்து, பரம்பரை உரிமை அல்லது தனிப்பட்ட உடைமை என்ற கருத்துகளைக் கொண்டது. இங்கு மக்களை கடவுள் தமக்குரியவர்களாகத் தேர்ந்தெடுத்த உடன்படிக்கைப் பொருளை ‘உரிமைச்சொத்து’ தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர் / யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயரே நேரடியாக உள்ளது. அதை ஒரு பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைக் காக்கிறது.
- issue: ‘நாடு’ மற்றும் ‘மக்கள்’ யாரைக் குறிக்கின்றன?
  choice: மூலத்தின் கவிதை இணைப்பை வைத்து, முதன்மை உரையில் இஸ்ரவேல் என்று வெளிப்படையாகச் சேர்க்கவில்லை
  alternative: ‘இஸ்ரவேல் நாடு’ அல்லது ‘இஸ்ரவேல் மக்கள்’ என்று வெளிப்படுத்துதல்
  rationale: சூழல் குறிப்பாக இஸ்ரவேலை நோக்கியிருக்கலாம்; எனினும் எபிரெய உரை ‘நாடு’, ‘மக்கள்’ என்ற சொற்களையே பயன்படுத்துகிறது. எனவே பொதுவான கூற்றுக்கும் வரலாற்று உடன்படிக்கை மக்களுக்கும் இடையிலுள்ள கவிதைத் திணறல் பாதுகாக்கப்படுகிறது.
- issue: ஒரே אַשְׁרֵי இரு இணைவரிகளுக்கும் உரியதா?
  choice: தமிழின் தெளிவுக்காக இரண்டாம் வரியில் வாழ்த்துரையை மறைமுகமாக மீண்டும் வெளிப்படுத்துதல்
  alternative: ‘பேறுபெற்றது’ என்பதை முதல் வரியில் மட்டும் வைத்து இரண்டாம் வரியை நேரடி இணைப்பாக விடுதல்
  rationale: எபிரெயில் இரண்டாம் பெயர்த்தொடர் முதலாமதற்கான இணைவிளக்கமாக நிற்கிறது. தமிழில் எண்ணிக்கை மாறுவதால் வாக்கியம் சிக்கலாகாமல் இருக்க ‘பேறுபெற்றவர்கள்’ மீள்கூறப்பட்டுள்ளது; ‘மக்களும்’ என்பது இரு தனிக் குழுக்களைக் கட்டாயமாகக் குறிக்காமல் கவிதை இணைப்பைத் தொடர்கிறது.
translation_notes:
  register: நவீன செந்தமிழுக்கு அண்மையான, பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளக்கூடிய கண்ணியமான சங்கீத நடையைக் கடைப்பிடிக்கிறது. ‘யாவே’ தனிப்பெயராகவும், ‘உரிமைச்சொத்து’ נַחֲלָה என்பதன் உடைமை மற்றும் உடன்படிக்கைச் சாரத்தைக் காட்டவும் பயன்படுத்தப்பட்டுள்ளன.
