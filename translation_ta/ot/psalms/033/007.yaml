  yaml_path: translation/ot/psalms/033/007.yaml
  text: He gathers the waters of the sea like a heap[b][a]; he puts the depths in storehouses.
translation:
  language: ta
  text: 'அவர் கடலின் நீரை குவியல்போல்[a] திரட்டுகிறார்;

    ஆழங்களை[b] களஞ்சியங்களில் வைக்கிறார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “மேட்டைப்போல்”; வேறு இடங்களில் காணப்படும் இதுபோன்ற நீர்ப் படிமங்களின் அடிப்படையில், சிலர் “சுவரைப்போல்” என்றும் புரிந்துகொள்கிறார்கள்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது “ஆழ்கடல் நீர்களை.” எபிரெயப் பன்மைச் சொல் பெருங்கடலின் ஆழங்களையோ ஆதிகால ஆழ்நீர்களையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּנֵס
  choice: திரட்டுகிறார்
  rationale: כנס என்பதன் Qal வினையெச்ச வடிவம் ஒன்றுசேர்த்தல் அல்லது திரட்டுதல் என்ற பொருளைக் கொண்டது. நிகழ்கால விளக்கத் தன்மையையும் கவிதையின் உயிரோட்டத்தையும் “திரட்டுகிறார்” இயல்பாகக் காக்கிறது.
- source_word: כַּנֵּד
  choice: ஒரு குவியலைப்போல்
  rationale: נֵד என்பது குவியல் அல்லது குவிக்கப்பட்ட திரள் என்பதே அதன் நேரடியான பொருள்; இங்கு கடல்நீரைக் குறிக்கும் தெளிவான கவிதைப் படிமமாக அது தக்கவைக்கப்படுகிறது.
- source_word: מֵי הַיָּם
  choice: கடலின் நீரை
  rationale: “கடலின் நீர்” என்ற எபிரெயக் கட்டமைப்பை இயல்பான நவீன தமிழில் வழங்குகிறது; கூட்டு ஒருமைத் தன்மையால் “நீரை” என வினைப்பொருளாக அமைக்கப்பட்டுள்ளது.
- source_word: נֹתֵן
  choice: வைக்கிறார்
  rationale: נתן இங்கு வைத்தல் அல்லது இடுதல் என்ற பரந்த பொருளில் வருகிறது. இணை வரியின் எளிமையையும் படிமத்தையும் “வைக்கிறார்” காக்கிறது.
- source_word: בְּאֹצָרוֹת
  choice: களஞ்சியங்களில்
  rationale: אֹצָר என்பது சேமிப்பிடம், களஞ்சியம் அல்லது கருவூலம். நீரைச் சேமித்து வைக்கும் கவிதைப் படிமத்திற்கு “களஞ்சியங்கள்” தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: תְּהוֹמוֹת
  choice: ஆழங்களை
  rationale: תְּהוֹם என்பதன் பன்மை வடிவம் பெருங்கடலின் ஆழங்களையோ ஆதிகால ஆழ்நீர்களையோ குறிக்கலாம். “ஆழங்கள்” பன்மையையும் மூலத்தின் பொருள் விரிவையும் தேவையின்றி விளக்காமல் காக்கிறது.
theological_decisions:
- issue: கடல்மீது கடவுளுக்குள்ள ஆளுகையைச் சித்தரிக்கும் அண்டவியல் கவிதைப் படிமம்
  choice: “குவியல்”, “களஞ்சியங்கள்” ஆகிய மூலப் படிமங்களை நேரடியாகத் தக்கவைத்தல்
  alternative: “அவர் கடலைக் கட்டுப்படுத்துகிறார்” என்று கருத்தை மட்டும் சுருக்கிக் கூறுதல்
  rationale: வசனம் நீரைத் திரட்டி ஆழங்களைச் சேமிக்கும் தெளிவான கவிதைப் படிமங்கள் வழியாகக் கடவுளின் ஆளுகையை வெளிப்படுத்துகிறது. அவற்றை அறிவியல் விளக்கமாகவோ அரூபமான கருத்தாகவோ மாற்றாமல் இருப்பது மூலத்தின் கவிதைத் தீவிரத்தையும் இறையியல் பதற்றத்தையும் காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும், சங்கீதக் கவிதைக்கேற்ற கண்ணியத்துடனும் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தில் உள்ள இரு Qal வினையெச்சங்களின் தொடர்ச்சியான விளக்கத் தன்மை தமிழில் நிகழ்கால வினைகளால் வெளிப்படுத்தப்பட்டுள்ளது. வாசிப்புத் தெளிவுக்காக அடிக்குறிப்பு [a] “குவியலைப்போல்” என்பதற்குப் பின்னும் [b] “ஆழங்களை” என்பதற்குப் பின்னும் வைக்கப்பட்டுள்ளன.
