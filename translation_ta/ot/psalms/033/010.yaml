id: PSA.33.10
reference: Psalms 33:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: יְֽהוָ֗ה הֵפִ֥יר עֲצַת גּוֹיִ֑ם הֵ֝נִ֗יא מַחְשְׁב֥וֹת עַמִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/010.yaml
  text: Yahweh frustrates the counsel of the nations[a]; he thwarts the plans of the peoples.
translation:
  language: ta
  text: 'யாவே[a] நாடுகளின் ஆலோசனையை முறியடிக்கிறார்;

    மக்களினங்களின் திட்டங்களைத் தடுத்து நிறுத்துகிறார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில் YHWH என்ற இறைப்பெயர்; இதை ‘யெகோவா’ என்றும் ஒலிபெயர்ப்பர்.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரேய இறைப்பெயரான יהוה-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், அதன் பரவலான ஒலிபெயர்ப்பாகத் தமிழில் வழங்குகிறது.
- source_word: הֵפִיר
  choice: முறியடிக்கிறார்
  rationale: ஒரு ஆலோசனை அல்லது திட்டம் நிறைவேறாதபடி அதைச் செயலிழக்கச் செய்யும் ஹிஃபில் வினையின் வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: עֲצַת
  choice: ஆலோசனையை
  rationale: இந்தச் சொல் ஆலோசனை, திட்டம், நோக்கம் ஆகிய பொருள்களை ஏற்கலாம்; அடுத்த அடியின் ‘திட்டங்கள்’ என்பதிலிருந்து கவிதைநயமான வேறுபாட்டைப் பேண ‘ஆலோசனை’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: גּוֹיִם
  choice: நாடுகளின்
  rationale: இங்கு இஸ்ரவேலரல்லாதவர்களை மட்டும் குறிக்கும் சமயச் சொல்லாக அல்லாமல், பொதுவாக நாடுகளைக் குறிக்கிறது.
- source_word: הֵנִיא
  choice: தடுத்து நிறுத்துகிறார்
  rationale: நோக்கப்பட்ட செயல் நிறைவேறாதபடி தடுத்தல் அல்லது விலக்குதல் என்ற வினையின் பொருளைத் தெளிவாக வழங்குகிறது; முதல் அடியின் வினையோடும் இணைநிலையைப் பேணுகிறது.
- source_word: מַחְשְׁבוֹת
  choice: திட்டங்களை
  rationale: ‘எண்ணங்கள்’ என்றும் பொருள்படக்கூடிய இச்சொல், עֲצַת என்பதுடன் அமைந்த இணைநிலையில் செயல்படுத்த எண்ணிய திட்டங்களைக் குறிப்பது இயல்பானது.
- source_word: עַמִּים
  choice: மக்களினங்களின்
  rationale: גּוֹיִם என்பதற்கான ‘நாடுகள்’ என்பதிலிருந்து எபிரேய இணைநிலையின் சொல்வேறுபாட்டைப் பேணுவதோடு, பல்வேறு மக்கள் கூட்டங்களைக் குறிக்கும் பன்மை உணர்வையும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: இறைப்பெயரான יהוה-ஐ மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல வசனம் நான்கெழுத்து இறைப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. அதை ஒரு பட்டப்பெயராக மாற்றாமல் தனிப்பட்ட இறைப்பெயராகப் பேண ‘யாவே’ என ஒலிபெயர்க்கப்பட்டது; மாற்று மரபுவழி வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதத்தின் இரு இணை அடிகளையும் சொல்வேறுபாட்டையும் பேணும் கண்ணியமான, எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது.
