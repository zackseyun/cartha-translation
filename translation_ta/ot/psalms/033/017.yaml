translation:
  language: ta
  text: விடுதலைக்குக் குதிரை பொய்யான நம்பிக்கை[a][b]; அதன் பெரும் வலிமையாலும் அது காப்பாற்றாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லர்த்தமாக, “விடுதலைக்கு குதிரை ஒரு பொய்.” எபிரெயச் சொற்றொடர் சுருக்கமானது; விடுதலைக்கான வழியாகக் குதிரையை நம்புவது பொய்யானது அல்லது ஏமாற்றத்தில் முடிவது என்பதே பொருள்.
    reason: lexical_alternative
  - marker: b
    text: “விடுதலை” என்பதற்கு “மீட்பு” அல்லது சூழலுக்கேற்ப “வெற்றி” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁקֶר
  choice: ஏமாற்றமே
  rationale: இந்தச் சொல் பொய், வஞ்சகம், நம்பிக்கை பொய்த்துப்போதல் ஆகிய பொருள்களைத் தருகிறது. விடுதலைக்கான சாதனமாகக் குதிரையை நம்புவது இறுதியில் ஏமாற்றமளிக்கும் என்பதை இயல்பான தமிழில் இது வெளிப்படுத்துகிறது.
- source_word: הַסּוּס
  choice: குதிரை
  rationale: எபிரெயத்தில் திட்டச் சுட்டு இருந்தாலும், இங்கு ஒரு வகையைப் பொதுவாகக் குறிக்கும் நீதிமொழி போன்ற கூற்று உள்ளது; தமிழில் சுட்டில்லாத ஒருமை இயல்பானது.
- source_word: לִתְשׁוּעָה
  choice: விடுதலை தரும்
  rationale: תְשׁוּעָה என்பதற்கு மீட்பு, விடுதலை, வெற்றி ஆகிய பொருள்கள் உண்டு. போர்ச் சூழலிலுள்ள குதிரையைப் பற்றிய இக்கூற்றில் ‘விடுதலை’ தெளிவாகவும் தேவையற்ற கூடுதல் இறையியல் பொருளைச் சேர்க்காமலும் உள்ளது.
- source_word: וּבְרֹב חֵילוֹ
  choice: அதன் மிகுந்த வலிமையாலும்
  rationale: רֹב என்பது மிகுதி அல்லது பெருமளவைக் குறிக்கிறது; חַיִל இங்கு குதிரையின் பலம் அல்லது வலிமையைக் குறிக்கிறது. ‘-ஆலும்’ என்ற வடிவம் அத்தனை வலிமை இருந்தபோதும் அது காப்பாற்ற முடியாது என்ற எதிர்மறை அழுத்தத்தை இயல்பாகத் தருகிறது.
- source_word: לֹא יְמַלֵּט
  choice: அது தப்புவிக்காது
  rationale: מלט என்ற வினையின் பியேல் வடிவம் பிறரை ஆபத்திலிருந்து விடுவித்தல் அல்லது தப்புவித்தல் என்று பொருள்படும். எபிரெயத்தின் நேரடியான எதிர்மறைக் கூற்றைப் பாதுகாக்க ‘தப்புவிக்காது’ என மொழிபெயர்க்கப்பட்டது.
