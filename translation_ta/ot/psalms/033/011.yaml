  text: עֲצַ֣ת יְ֭הוָה לְ/עוֹלָ֣ם תַּעֲמֹ֑ד מַחְשְׁב֥וֹת לִ֝בּ֗/וֹ לְ/דֹ֣ר וָ/דֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/011.yaml
  text: The counsel of Yahweh stands forever[a], the plans of his heart from generation to generation.
translation:
  language: ta
  text: 'யாவேயின் ஆலோசனை[a] என்றென்றும் நிலைத்திருக்கும்;

    அவரது இதயத்தின் திட்டங்கள் தலைமுறை தலைமுறையாக நிலைத்திருக்கும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஆலோசனை’ என்பதற்கு ‘நோக்கம்’ என்றும், ‘திட்டங்கள்’ என்பதற்கு ‘எண்ணங்கள்’ அல்லது ‘நோக்கங்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲצַת
  choice: ஆலோசனை
  rationale: இச்சொல் ஆலோசனை, திட்டம், நோக்கம் ஆகிய பொருள்களைத் தரக்கூடும். இணைவரியில் வரும் מַחְשְׁבוֹת என்பதோடு உள்ள வேறுபாட்டைக் காக்கவும், சிந்தித்து வகுக்கும் தீர்மானம் என்ற நுட்பத்தை வெளிப்படுத்தவும் ‘ஆலோசனை’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான יהוה-ஐ ஒரு பட்டப்பெயராக மாற்றாமல், அதன் வழக்கமான தமிழ் ஒலிபெயர்ப்பாக ‘யாவே’ என்று வழங்குகிறது.
- source_word: לְעוֹלָם
  choice: என்றென்றும்
  rationale: காலமெல்லாம் நீடிக்கும் நிலைத்தன்மையை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: תַּעֲמֹד
  choice: நிலைத்திருக்கும்
  rationale: இங்கு வினைச்சொல் பொதுவாகவும் தொடர்ச்சியாகவும் உண்மையான நிலைப்பாட்டைக் குறிக்கிறது; ‘நிலைத்திருக்கும்’ என்பது அந்த நீடித்த தன்மையைத் தெளிவாகத் தருகிறது.
- source_word: מַחְשְׁבוֹת
  choice: திட்டங்கள்
  rationale: இச்சொல் எண்ணங்கள், திட்டங்கள் அல்லது நோக்கங்கள் என்று பொருள்படலாம். தெய்வீக உள்ளத்தின் நோக்கமுள்ள தீர்மானங்களைச் சூழலுக்கு ஏற்றவாறு ‘திட்டங்கள்’ வெளிப்படுத்துகிறது.
- source_word: לִבּוֹ
  choice: அவருடைய உள்ளம்
  rationale: எபிரெய மொழியில் ‘இதயம்’ சிந்தனை மற்றும் சித்தத்தின் மையத்தையும் குறிக்கும். தமிழில் வெறும் உணர்ச்சியைக் குறிக்கும் தவறான புரிதலைத் தவிர்த்து, அந்த அகநிலைப் பொருளை ‘உள்ளம்’ இயல்பாகத் தருகிறது.
- source_word: לְדֹר וָדֹר
  choice: தலைமுறை தலைமுறையாக
  rationale: தொடர்ந்து வரும் ஒவ்வொரு தலைமுறையிலும் நீடிப்பதை இந்த வழக்குச் சொற்றொடர் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் ஒரு பொதுப் பட்டப்பெயர் அல்ல, இஸ்ரவேலின் தேவனுடைய தனிப்பெயரே உள்ளது. ஆகவே அதை பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்த்து, ‘யாவே’ என்று வழங்கப்பட்டுள்ளது.
- issue: தெய்வீக ‘உள்ளம்’ என்பதன் பொருள்
  choice: அவருடைய உள்ளம்
  alternative: அவருடைய மனம்
  rationale: לֵב சிந்தனை, சித்தம், உள்ளார்ந்த நோக்கம் ஆகியவற்றை உள்ளடக்குகிறது. ‘உள்ளம்’ மூல உருவகத்தை ஓரளவு காத்து, வெறும் அறிவுசார் ‘மனம்’ என்ற குறுகிய விளக்கத்தைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. இரண்டாம் வரியில் எபிரெயத்தில் விடுபட்டிருக்கும் வினை, தமிழ் தெளிவுக்காக ‘நிலைத்திருக்கும்’ என்று மீண்டும் வழங்கப்பட்டுள்ளது.
