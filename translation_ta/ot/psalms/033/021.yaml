source:
  edition: WLC
  text: כִּי ב֭/וֹ יִשְׂמַ֣ח לִבֵּ֑/נוּ כִּ֤י בְ/שֵׁ֖ם קָדְשׁ֣/וֹ בָטָֽחְנוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/021.yaml
  text: For our heart rejoices in him[b][a], because we have trusted in his holy name.
translation:
  language: ta
  text: ஏனெனில், அவரில் நம் இதயம்[b] மகிழ்கிறது[a]; அவருடைய பரிசுத்தப் பெயரில் நாம் நம்பிக்கை வைத்திருப்பதாலே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவரில் நம் இதயம் மகிழும்.” எபிரெய முற்றுப்பெறா வினையை நிகழ்கால வழக்கமாக அல்லாமல் எதிர்காலமாகவும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் “நம் இதயம்” ஒருமையாக உள்ளது; இது மக்களின் உள்ளார்ந்த வாழ்வைக் கூட்டாகக் குறிக்கும் வெளிப்பாடாகும்.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றிற்கான காரணத்தை அறிமுகப்படுத்தும் காரண இணைப்பாக உள்ளது; தமிழில் இயல்பாகவும் தெளிவாகவும் அமைகிறது.
- source_word: בּוֹ
  choice: அவரில்
  rationale: ஆண்பால் ஒருமைச் சுட்டுப்பெயர் சூழலில் கர்த்தரைக் குறிக்கிறது; மூலத்தில் இல்லாத இறைப் பெயரைச் சேர்க்காமல் தனிப்பட்ட குறிப்பைப் பாதுகாக்கிறது.
- source_word: יִשְׂמַח
  choice: மகிழ்கிறது
  rationale: எபிரெய முற்றுப்பெறா வினை நிகழ்கால வழக்கமான நிலை அல்லது உறுதியான எதிர்காலத்தைக் குறிக்கலாம். சங்கீதத்தின் தற்போதைய நம்பிக்கை அறிக்கைக்கு ஏற்றபடி நிகழ்காலம் முதன்மை உரையில் வைக்கப்பட்டுள்ளது; எதிர்கால வாய்ப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: לִבֵּנוּ
  choice: நம் இதயம்
  rationale: எபிரெயத்தில் ஒருமை வடிவம் பன்மைக் குழுவின் ஒன்றுபட்ட உள்ளார்ந்த வாழ்வைக் குறிக்கிறது; அதைத் தமிழிலும் ஒருமையாகப் பாதுகாக்கிறது.
- source_word: כִּי
  choice: அவருடைய... நாம்
  rationale: இரண்டாவது כִּי மகிழ்ச்சிக்கான காரணத்தை அளிக்கிறது. தமிழில் அரைப்புள்ளிக்குப் பிந்தைய காரணக் கூற்று இயல்பாக விளங்குவதால் தனியாக ‘ஏனெனில்’ என்பதை மீண்டும் இடாமல் காரணத் தொடர்பு பாதுகாக்கப்பட்டுள்ளது.
- source_word: בְשֵׁם קָדְשׁוֹ
  choice: அவருடைய பரிசுத்தப் பெயரில்
  rationale: בְּ முன்னிடைச்சொல் நம்பிக்கையின் சார்பிடத்தைக் குறிக்கிறது; ‘பரிசுத்தப் பெயர்’ என்பது இறைத்தன்மை மற்றும் உடன்படிக்கைச் சூழலைத் துல்லியமாகத் தருகிறது.
- source_word: בָטָחְנוּ
  choice: நாம் நம்பிக்கை வைத்திருக்கிறோம்
  rationale: எபிரெய நிறைவுவினையின் முடிவுற்றும் தொடரும் பொருத்தத்தைத் தமிழின் நிகழ்நிறைவு சார்ந்த இயல்பான சொல்லாக்கம் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: בּוֹ மற்றும் קָדְשׁוֹ என்பவற்றிலுள்ள ஆண்பால் ஒருமைச் சுட்டுகளின் குறிப்பு
  choice: சூழலில் அவை கர்த்தரைக் குறிக்கும் வகையில் ‘அவரில்’, ‘அவருடைய’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘தேவனில்’ அல்லது ‘கர்த்தரில்’ என்று இறைப் பெயரை வெளிப்படையாகச் சேர்த்தல்.
  rationale: அருகிலுள்ள வசனங்கள் கர்த்தரைப் பற்றிப் பேசினாலும், இவ்வசனம் இறைப் பெயரை நேரடியாகக் குறிப்பிடவில்லை. எனவே மூலத்தின் வெளிப்பாட்டு அளவைப் பாதுகாத்து சுட்டுப்பெயர்கள் மட்டும் பயன்படுத்தப்பட்டன.
- issue: יִשְׂמַח என்பதன் கால/அம்சத் தெளிவின்மை
  choice: தற்போதைய அல்லது வழக்கமான மகிழ்ச்சியாக ‘மகிழ்கிறது’ என்று முதன்மை உரையில் தரப்பட்டது.
  alternative: உறுதியான எதிர்காலமாக ‘மகிழும்’ என்று மொழிபெயர்த்தல்.
  rationale: இரு வாசிப்புகளும் எபிரெய முற்றுப்பெறா வினைக்கு சாத்தியம். சங்கீதத்தின் நம்பிக்கை அறிக்கை நிகழ்காலத்தை ஆதரிக்கிறது; உண்மையான மாற்று அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் கவித்துவச் செறிவும் கொண்ட நடை. ‘நம் இதயம்’ என்ற ஒருமைக் கூட்டுப்படிமம் மூல எபிரெயத்தைப் பாதுகாக்கிறது; தமிழில் அது இயல்பாகப் புரிவதால் தனி அடிக்குறிப்பு தேவையில்லை. அடிக்குறிப்பு குறியீடு தொடர்புடைய வினைக்குப் பின் வைக்கப்பட்டது.
