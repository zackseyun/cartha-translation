  text: נַ֭פְשֵׁ/נוּ חִכְּתָ֣ה לַֽ/יהוָ֑ה עֶזְרֵ֖/נוּ וּ/מָגִנֵּ֣/נוּ הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/020.yaml
  text: Our soul waits for Yahweh[a]; he is our help and our shield.
translation:
  language: ta
  text: 'நமது உள்ளம்[a] யாவேக்காக எதிர்பார்த்துக் காத்திருக்கிறது;

    அவரே நமது உதவியும் நமது கேடயமும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘நமது நெஃபெஷ்’; இங்கு ‘உள்ளம்’ என்பது உடலற்ற ஒரு பகுதியை மட்டும் அல்லாமல், சமூகத்தின் முழுச் சுயத்தையும் உள்ளார்ந்த வாழ்வையும் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַפְשֵׁנוּ
  choice: நமது உள்ளம்
  rationale: נֶפֶשׁ என்பது இங்கு வெறும் உடலற்ற ‘ஆத்துமா’வை அல்ல, சமூகமாகிய ‘நமது’ முழு உள்மனதையும் சுயத்தையும் குறிக்கிறது. ஒருமை வடிவத்தையும் கூட்டு உணர்வையும் ‘நமது உள்ளம்’ இயல்பாகத் தக்கவைக்கிறது.
- source_word: חִכְּתָה
  choice: எதிர்பார்த்துக் காத்திருக்கிறது
  rationale: חכה என்பது நம்பிக்கையான எதிர்பார்ப்புடன் காத்திருப்பதைக் குறிக்கிறது. எபிரெய நிறைவு வடிவத்தைச் சூழலுக்கேற்ற நிகழ்காலக் கவிதை மொழியாக மொழிபெயர்த்துள்ளது.
- source_word: לַיהוָה
  choice: யாவேக்காக
  rationale: ל முன்னொட்டு காத்திருத்தல் நோக்கிச் செலுத்தப்படும் நபரை இங்கு குறிக்கிறது; יהוה என்ற உடன்படிக்கைப் பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்படுகிறது.
- source_word: עֶזְרֵנוּ
  choice: நமது உதவி
  rationale: עֵזֶר என்பதன் பெயர்ச்சொல் வடிவமான ‘உதவி’யைத் தக்கவைத்து, அதை ‘உதவியாளர்’ என்று மாற்றாமல் பெயர்ப் பயனிலை அமைப்பைப் பாதுகாக்கிறது.
- source_word: וּמָגִנֵּנוּ
  choice: நமது கேடயம்
  rationale: מָגֵן என்பதன் நேரடியான கேடய உருவகம் தமிழிலும் தெளிவாக இருப்பதால், பொதுவான ‘பாதுகாவலர்’ என்று விளக்காமல் தக்கவைக்கப்பட்டுள்ளது.
- source_word: הוּא
  choice: அவரே
  rationale: தனித்த பிரதிப்பெயரின் வலியுறுத்தலை மரியாதை ஒருமையோடும் ‘அவரே’ என்பதாலும் வெளிப்படுத்துகிறது; மூலத்தில் இல்லாத ‘அவர் மட்டுமே’ என்ற பொருள் சேர்க்கப்படவில்லை.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல வசனம் நான்கெழுத்து இறைப் பெயரை நேரடியாகப் பயன்படுத்துகிறது. அதை ஒரு பட்டப்பெயராக மாற்றாமல், உடன்படிக்கைப் பெயராக ‘யாவே’ என்று ஒலிபெயர்ப்பது மூலத்தின் தனிப்பெயர் இயல்பைப் பாதுகாக்கிறது.
- issue: நமது உள்ளம் என்ற கூட்டு ஒருமை
  choice: ஒருமை வடிவில் ‘நமது உள்ளம்’
  alternative: ‘நாங்கள்’
  rationale: எபிரெயச் சொல்லின் இலக்கண ஒருமையையும், வழிபடும் சமூகத்தின் ஒன்றுபட்ட உள்சுயம் என்ற கவித்துவப் படிமத்தையும் தக்கவைக்கிறது; அதை சாதாரண பன்மை எழுவாயாகச் சமப்படுத்தவில்லை.
translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, எளிதில் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘எதிர்பார்த்துக் காத்திருக்கிறது’ என்பது வினையின் எதிர்பார்ப்பு நுணுக்கத்தை வெளிப்படுத்துகிறது; ‘உதவி’, ‘கேடயம்’ ஆகிய மூல உருவகங்கள் அப்படியே பாதுகாக்கப்பட்டுள்ளன.
