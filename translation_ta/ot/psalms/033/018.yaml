  text: Behold[a], the eye of Yahweh is on those who fear him, on those who wait for his steadfast love,
translation:
  language: ta
  text: இதோ, யாவேயின் கண் அவருக்கு அஞ்சுகிறவர்கள்மேல், அவருடைய மாறாத அன்புக்காகக் காத்திருப்பவர்கள்மேல்[a] இருக்கிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவருடைய மாறாத அன்பில் நம்பிக்கை வைத்திருப்பவர்கள்.” எபிரெய வினை ‘காத்திருத்தல்,’ ‘நம்பிக்கையோடு எதிர்பார்த்திருத்தல்’ ஆகிய இரு கருத்துகளையும் தரக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: இதோ
  rationale: கவனத்தை ஈர்த்து வலியுறுத்தும் எபிரெயக் குறிப்பிடைச்சொல்லின் கவிதைத் தாக்கத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: עֵין
  choice: கண்
  rationale: இறைவனின் கவனமுள்ள கண்காணிப்பைக் குறிக்கும் மூலத்தின் மனித உருவகத்தை விளக்கிச் சொல்லாமல் அப்படியே காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது பட்டப்பெயர் அல்ல, இஸ்ரவேலின் இறைவனுடைய தனிப்பெயரைக் குறிக்கும் நான்கு எழுத்துப் பெயர்; எனவே தமிழில் பொதுவாகப் புரிந்துகொள்ளத்தக்க ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டது.
- source_word: אֶל
  choice: மேல் இருக்கிறது
  rationale: ‘நோக்கி/மேல்’ என்ற அடிப்படை உறவை, ‘கண்’ என்பதுடன் வரும் கவனமுள்ள பார்வை என்ற எபிரெய மரபுத்தொடருக்கு ஏற்ற தமிழில் வழங்குகிறது.
- source_word: יְרֵאָיו
  choice: அவருக்கு அஞ்சுகிறவர்கள்
  rationale: வெறும் பயத்தை மட்டுமல்லாமல் இறைவனைப் பயபக்தியுடன் மதித்து வாழும் நிலையைச் சுமக்கும் வேதாகமச் சொல்லாட்சியைத் தக்கவைக்கிறது.
- source_word: לַמְיַחֲלִים
  choice: காத்திருப்பவர்கள்
  rationale: יחל வினையின் நீடித்த, எதிர்பார்ப்புள்ள காத்திருத்தல் என்ற பொருளை முதன்மைப்படுத்துகிறது; ‘நம்பிக்கை வைத்திருத்தல்’ என்ற நெருங்கிய மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לְחַסְדּוֹ
  choice: அவருடைய மாறாத அன்புக்காக
  rationale: חֶסֶד என்பதிலுள்ள நிலைத்த அன்பு, உண்மைத்தன்மை, உறவுப்பற்று ஆகிய பரப்பை ‘மாறாத அன்பு’ இயல்பாக எடுத்துரைக்கிறது; முன்னுள்ள வினையுடன் இணையும் לְ ‘அன்புக்காகக் காத்திருத்தல்’ என வழங்கப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் பட்டப்பெயர் அல்லாமல் தனிப்பெயரே உள்ளது. அதைத் தலைப்பால் மாற்றாமல் தமிழில் ஒலிபெயர்ப்பது மூல வேறுபாட்டைக் காக்கிறது.
- issue: חֶסֶד என்பதன் பொருள்
  choice: மாறாத அன்பு
  alternative: இரக்கம் / உண்மையுள்ள அன்பு
  rationale: இரக்கம் என்ற ஒரே அம்சமாகக் குறுக்காமல், நிலைத்த அன்பும் உறவுசார் உண்மைத்தன்மையும் சேர்ந்த சொல்லின் அகலத்தைப் பாதுகாக்கிறது.
- issue: יחל வினையிலுள்ள காத்திருத்தல்–நம்பிக்கை பதற்றம்
  choice: காத்திருப்பவர்கள்
  alternative: நம்பிக்கை வைத்திருப்பவர்கள்
  rationale: மூல வினை இரு கருத்துகளையும் தாங்கக்கூடும். முதன்மை உரை காலம் நீளும் எதிர்பார்ப்பை முன்னிறுத்துகிறது; மற்ற வாசிப்பு அடிக்குறிப்பில் வைக்கப்பட்டதால் உண்மையான இருபொருள்தன்மை மறைக்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், கவிதைக்குரிய கண்ணியத்துடன் மொழிபெயர்க்கப்பட்டது. ‘இதோ’ மற்றும் ‘கண் ... மேல் இருக்கிறது’ ஆகியவை மூலத்தின் கவன ஈர்ப்பையும் மனித உருவகத்தையும் காக்கின்றன; கடினமான பழந்தமிழ் நடை தவிர்க்கப்பட்டுள்ளது.
