  yaml_path: translation/ot/psalms/033/002.yaml
  text: Give thanks to Yahweh with the lyre[a]; make music to him with a ten-stringed harp.
translation:
  language: ta
  text: 'யாழை மீட்டி யாவேக்கு நன்றி செலுத்துங்கள்;

    பத்து நரம்புகள் கொண்ட வீணையால்[a] அவரை நோக்கி இசையுங்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் நெவேல் எனப்படும் பத்து நரம்புகள் கொண்ட இசைக்கருவி. அந்தப் பண்டைய கருவி துல்லியமாக எப்படிப்பட்டது என்பது உறுதியாகத் தெரியவில்லை; அது யாழ், வீணை அல்லது லூட் எனப் பலவாறு மொழிபெயர்க்கப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹדוּ
  choice: நன்றி செலுத்துங்கள்
  rationale: ידה என்பதன் ஹிஃபில் பன்மை ஏவல் வடிவம் வழிபாட்டுச் சூழலில் நன்றி செலுத்துதல் அல்லது புகழ்தல் என்று பொருள்படும்; இங்கு அதன் குறிப்பான நன்றியுணர்வு சார்ந்த பொருளைத் தக்கவைக்கிறது.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: மூலத்தில் வரும் உடன்படிக்கைப் பெயரான יהוה என்பதை பொதுப்பட்டமான ‘ஆண்டவர்’ என்று மாற்றாமல், தமிழில் இயல்பாக ஒலிபெயர்க்கிறது.
- source_word: בְּכִנּוֹר
  choice: யாழை மீட்டி
  rationale: כִּנּוֹר என்பது பண்டைய நரம்பிசைக் கருவி, பொதுவாக lyre என அடையாளப்படுத்தப்படுகிறது. ‘யாழ்’ அதற்கான இயல்பான தமிழ் இணை; בְּ குறிக்கும் கருவிப் பயன்பாட்டை ‘மீட்டி’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: בְּנֵבֶל עָשׂוֹר
  choice: பத்து நரம்புகள் கொண்ட வீணையால்
  rationale: עָשׂוֹר பத்து நரம்புகளைக் குறிக்கிறது; נֵבֶל என்ற பண்டைய கருவியின் துல்லிய வடிவம் உறுதியற்றதால், வேறொரு நரம்பிசைக் கருவியைக் குறிக்கும் இயல்பான தமிழ் சொல்லாக ‘வீணை’ பயன்படுத்தப்பட்டு, உறுதியின்மை அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: זַמְּרוּ לוֹ
  choice: அவருக்கு இசை எழுப்புங்கள்
  rationale: זמר என்பதன் பியேல் வடிவம் இசையால் புகழ்வதையோ இசை நிகழ்த்துவதையோ குறிக்கலாம். கருவிகள் குறிப்பிடப்படும் உடனடிச் சூழலில், பாடலை மட்டும் கட்டாயப்படுத்தாமல் ‘இசை எழுப்புங்கள்’ என்ற மொழிபெயர்ப்பு அந்தப் பொருள் பரப்பைத் தக்கவைக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: வசனம் יהוה என்ற தனிப்பட்ட இறைப் பெயரையே பயன்படுத்துகிறது. ‘யாவே’ என்பது அந்தப் பெயரைப் பொதுப்பட்டமாக மாற்றாமல், அதன் ஏற்றுக்கொள்ளப்பட்ட ஒலிப்பைத் தமிழில் பிரதிபலிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வழிபாட்டு நடையில் அமைக்கப்பட்டுள்ளது. ‘யாழ்’ மற்றும் ‘வீணை’ என்பவை இரண்டு வேறுபட்ட எபிரெய நரம்பிசைக் கருவிகளை வேறுபடுத்துகின்றன; கருவிகளின் துல்லியமான தொல்லியல் அடையாளம் குறித்து அளவுக்கு மீறிய உறுதி காட்டப்படவில்லை.
