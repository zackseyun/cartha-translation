source:
  edition: WLC
  text: רַנְּנ֣וּ צַ֭דִּיקִים בַּֽ/יהוָ֑ה לַ֝/יְשָׁרִ֗ים נָאוָ֥ה תְהִלָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/001.yaml
  text: Shout for joy in Yahweh[a], you righteous[b]; praise is fitting for the upright.
translation:
  language: ta
  text: நீதிமான்களே, யாவேயில் மகிழ்ச்சியுடன் ஆர்ப்பரியுங்கள்[a]; துதி செலுத்துவது நேர்மையானவர்களுக்கு ஏற்றது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘யாவேயில் மகிழ்ந்து பாடுங்கள்’ அல்லது ‘யாவேயில் களிகூருங்கள்.’
    reason: ரַנְּנוּ என்பது மகிழ்ச்சியுடன் பாடுதல், ஆரவாரித்தல், அல்லது களிகூருதல் ஆகிய நெருங்கிய பொருள்களைக் குறிக்கலாம்.
  - marker: b
    text: அல்லது, ‘நேர்மையானவர்களுக்கு துதி அழகானது’ அல்லது ‘நேர்மையானவர்களுக்கு துதி தகுந்தது.’
    reason: נָאוָה என்பது ஏற்றது, பொருத்தமானது, அழகானது ஆகிய தொடர்புடைய பொருள் நிழல்களைக் கொண்டுள்ளது.
lexical_decisions:
- source_word: רַנְּנוּ
  choice: மகிழ்ந்து பாடுங்கள்
  rationale: இந்தப் பன்மை ஏவல் வினைச்சொல், மகிழ்ச்சியை உரக்கக் குரலெழுப்பி வெளிப்படுத்துவதைக் குறிக்கிறது. தமிழில் வழிபாட்டுச் சூழலுக்கு இயல்பாகவும் அதன் களிப்பான, கேட்கக்கூடிய தன்மையைப் பேணியும் ‘மகிழ்ந்து பாடுங்கள்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: צַדִּיקִים
  choice: நீதிமான்களே
  rationale: ஏவல் வினைக்கு முன் இது நேரடி அழைப்பாக வருகிறது. அழைப்புமுறையைத் தெளிவாகக் காட்ட ‘நீதிமான்களே’ என வழங்கப்பட்டுள்ளது.
- source_word: בַּיהוָה
  choice: யாவேயில்
  rationale: בְּ இங்கு மகிழ்ச்சியின் அடிப்படை அல்லது எல்லையைக் குறிக்கிறது; ஆகவே ‘யாவேயில்’ என்பது எபிரெயச் சொல்லமைப்பையும் பொருளையும் பேணுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது இஸ்ரவேலின் தேவனுடைய தனிப்பெயரான நான்கு எழுத்துப் பெயர். ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பான ‘யாவே’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: לַיְשָׁרִים
  choice: நேர்மையானவர்களுக்கு
  rationale: לְ இங்கு பொருத்தம் அல்லது தகுதியைச் சுட்டுகிறது. ‘நேர்மையானவர்களுக்கு’ என்பது அடுத்துள்ள ‘தகுந்தது’ என்பதோடு இயல்பாக இணைகிறது.
- source_word: נָאוָה
  choice: தகுந்தது
  rationale: இந்தச் சொல் ஏற்றது, பொருத்தமானது, அழகானது ஆகிய பொருள் நிழல்களைக் கொண்டது. இச்சூழலில் ‘தகுந்தது’ அதன் முதன்மையான பொருத்தப்பாட்டை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: תְהִלָּה
  choice: துதி
  rationale: இது துதித்தல் அல்லது துதிப் பாடலைக் குறிக்கலாம். வடிவத்தைத் தேவையின்றி வரையறுக்காமல் ‘துதி’ என வழங்கப்பட்டுள்ளது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலவசனத்தில் பொதுப் பட்டம் அல்ல, தேவனுடைய தனிப்பெயரான יהוה நேரடியாக உள்ளது. அந்த வேறுபாட்டைப் பேண ‘யாவே’ என்ற ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் அதே நேரத்தில் சங்கீதத்திற்குரிய கண்ணியத்தைப் பேணும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘நீதிமான்களே’ என்ற அழைப்புமுறையும், இரு இணையான அரைவாக்கியங்களும் எபிரெயக் கவிதை அமைப்பைத் தெளிவாக வைத்திருக்கின்றன.
