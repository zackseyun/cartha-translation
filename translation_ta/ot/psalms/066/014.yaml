id: PSA.66.14
reference: Psalms 66:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: אֲשֶׁר פָּצ֥וּ שְׂפָתָ֑/י וְ/דִבֶּר פִּ֝֗/י בַּ/צַּר לִֽ/י־־־׃
base_translation:
