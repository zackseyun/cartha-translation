  yaml_path: translation/ot/psalms/066/014.yaml
  text: which my lips uttered and my mouth spoke when I was in distress[a].
translation:
  language: ta
  text: 'என் உதடுகள் உரைத்தவையும்,

    எனக்கு நெருக்கடி ஏற்பட்டபோது என் வாய் பேசியவையும்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲשֶׁר
  choice: உரைத்தவையும் ... பேசியவையும்
  rationale: முந்தைய வசனத்திலுள்ள நேர்த்திக்கடன்களைக் குறிக்கும் தொடர்பைத் தமிழில் இயல்பாக வெளிப்படுத்த, பெயரெச்ச விகுதியாகப் பொருத்தப்பட்டது.
- source_word: פָּצוּ
  choice: உரைத்த
  rationale: அடிப்படையில் ‘திறந்தன’ என்று பொருள்படும் இச்சொல், உதடுகளைத் திறந்து சொல்வதைக் குறிக்கும் எபிரெய மொழிவழக்கு; தமிழில் உரையாடலின் செயலை இயல்பாகக் காட்ட ‘உரைத்த’ என மொழிபெயர்க்கப்பட்டது.
- source_word: שְׂפָתַי
  choice: என் உதடுகள்
  rationale: எபிரெயக் கவிதையின் உடலுறுப்பு உருவகத்தையும் ‘உதடுகள் / வாய்’ என்ற இணைநிலையையும் காக்க நேரடியாக மொழிபெயர்க்கப்பட்டது.
- source_word: וְדִבֶּר
  choice: பேசிய
  rationale: דבר என்பதன் பொதுவான பொருளான ‘பேசுதல்’ காக்கப்பட்டு, முதல் அடியுடன் உள்ள இணைநிலை வெளிப்படுத்தப்பட்டது.
- source_word: פִּי
  choice: என் வாய்
  rationale: ‘என் உதடுகள் / என் வாய்’ என்ற பொருளொத்த கவிதை இணைநிலையைத் தக்கவைக்க நேரடியாக மொழிபெயர்க்கப்பட்டது.
- source_word: בַּצַּר לִי
  choice: எனக்கு நெருக்கடி ஏற்பட்டபோது
  rationale: பேசுபவரைச் சூழ்ந்த துன்பமான காலநிலையை இயல்பான நவீனத் தமிழில் காலப்பொருளுடன் வெளிப்படுத்துகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைக்குரிய கண்ணியத்துடன் இரண்டு இணை அடிகளாக அமைக்கப்பட்டது. இவ்வசனம் முந்தைய வசனத்தின் ‘நேர்த்திக்கடன்கள்’ என்பதோடு இலக்கண ரீதியாகத் தொடர்வதால், தனிவசனத்திலும் அந்தத் தொடர்பை உணர்த்த ‘-வையும்’ வடிவம் பயன்படுத்தப்பட்டது. எபிரெய மொழிவழக்கான ‘உதடுகள் திறந்தன’ என்பதைச் சொற்படியாக அல்லாமல் ‘உதடுகள் உரைத்தன’ என இயல்பாக்கியதால் தனி அடிக்குறிப்பு தேவையில்லை.
