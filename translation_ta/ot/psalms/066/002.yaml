  text: זַמְּר֥וּ כְבֽוֹד שְׁמ֑/וֹ שִׂ֥ימוּ כָ֝ב֗וֹד תְּהִלָּתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/002.yaml
  text: Sing the glory of his name[a]; make his praise glorious.
translation:
  language: ta
  text: 'அவருடைய பெயரின் மகிமையைப் பாடுங்கள்;

    அவருடைய துதியை மகிமைப்படுத்துங்கள்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் இன்னும் சொற்படியாக, ‘அவருடைய துதிக்கு மகிமையை வையுங்கள்’ என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: זַמְּרוּ
  choice: பாடுங்கள்
  rationale: זמר என்பதன் பன்மை ஏவல் வடிவம் இசையோடு பாட அழைக்கிறது. சூழலில் துதியின் பொருள் அடுத்த சொற்றொடர்களால் தெளிவாக இருப்பதால், இயல்பானவும் சுருக்கமானவும் உள்ள ‘பாடுங்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: כְבוֹד שְׁמוֹ
  choice: அவருடைய பெயரின் மகிமை
  rationale: எபிரெயக் கட்டமைப்பிலுள்ள ‘பெயரின் மகிமை’ என்ற உறவை நேரடியாகப் பேணி, அதை வெறும் ‘மகிமையுள்ள பெயர்’ என்ற பண்புப்பெயர்த் தொடராக மாற்றாமல் உள்ளது.
- source_word: שִׂימוּ כָבוֹד
  choice: மகிமைப்படுத்துங்கள்
  rationale: שׂים என்பதன் அடிப்படைப் பொருள் ‘வை/அமை’ என்பதாக இருந்தாலும், כבוד உடனான இச்சொல்லாட்சி துதியை மகிமைமிக்கதாகச் செய்யும் அழைப்பைத் தெரிவிக்கிறது. தமிழில் ‘மகிமைப்படுத்துங்கள்’ இயல்பாகவும், முதல் அடியிலுள்ள ‘மகிமை’ என்ற மீளுரைப்பையும் பேணுவதாகவும் உள்ளது.
- source_word: תְּהִלָּתוֹ
  choice: அவருடைய துதி
  rationale: மூன்றாம் ஆண்பால் ஒருமை பின்னொட்டுடன் உள்ள பெயர்ச்சொல்லை நேரடியாகத் தருகிறது. இது அவருக்குச் செலுத்தப்படும் துதி அல்லது அவருக்குரிய புகழ் என்ற பொருள் நிழல்களை தேவையின்றி குறுக்காமல் பேணுகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசிப்புக்கும் வழிபாட்டுச் சூழலுக்கும் ஏற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. இணையான இரு அடிகளிலும் ‘மகிமை’ என்ற எபிரெய மீளுரை பேணப்பட்டுள்ளது.
