  text: כָּל הָ/אָ֤רֶץ יִשְׁתַּחֲו֣וּ לְ֭/ךָ וִֽ/יזַמְּרוּ לָ֑/ךְ יְזַמְּר֖וּ שִׁמְ/ךָ֣ סֶֽלָה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/004.yaml
  text: All the earth will bow down to you and sing praise to you[a]; they will sing praise to your name[b]. Selah
translation:
  language: ta
  text: பூமி அனைத்தும் உமக்கு முன்பாகப் பணியும்; உம்மைப் புகழ்ந்து பாடும்; உமது பெயரைப் புகழ்ந்து பாடும். சேலா[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சேலா’ என்பது இசை அல்லது வழிபாட்டு முறையைக் குறிக்கும் ஒரு குறிப்பாக இருக்கலாம்; அதன் துல்லியமான பொருள் உறுதியாகத் தெரியவில்லை.
    reason: cultural_note
lexical_decisions:
- source_word: כָּל הָאָרֶץ
  choice: பூமியனைத்தும்
  rationale: כָּל உடன் הָאָרֶץ இங்கு சங்கீதத்தின் உலகளாவிய நோக்கிற்கு ஏற்ப முழுப் பூமியையும் குறிக்கிறது; உள்ளூர் ‘நாடு’ என்ற பொருள் இங்கு குறுகலாகிவிடும்.
- source_word: יִשְׁתַּחֲווּ
  choice: உம்முன் பணிந்து
  rationale: வினைச்சொல் கடவுளுக்கு முன் உடலைத் தாழ்த்திப் பணிவதைக் குறிக்கிறது. ‘பணிந்து’ என்பது உடல் சார்ந்த மூலப்படிமத்தைத் தக்கவைத்து, அதன் வழிபாட்டு உட்பொருளையும் இயல்பாக உணர்த்துகிறது.
- source_word: לְךָ
  choice: உம்முன் / உம்மை
  rationale: எபிரெய முன்னிடைச்சொல் இரு வினைகளிலும் கடவுளை நோக்கிய செயலைக் குறிக்கிறது. தமிழில் ‘பணிதல்’ என்பதுடன் ‘உம்முன்’ என்றும், ‘புகழ்ந்து பாடுதல்’ என்பதுடன் இயல்பான ‘உம்மை’ என்றும் வழங்கப்பட்டது.
- source_word: וִיזַמְּרוּ / יְזַמְּרוּ
  choice: புகழ்ந்து பாடும் / புகழ்ந்து பாடும்
  rationale: זמר இச்சூழலில் இசையோடு புகழ்வதைக் குறிக்கிறது. மூலத்தில் இருமுறை வரும் சொல்லைத் தமிழிலும் மீண்டும் வழங்கி அதன் கவிதைத் திருப்பத்தைப் பாதுகாத்தோம்.
- source_word: שִׁמְךָ
  choice: உமது பெயரை
  rationale: ‘பெயர்’ என்பது வெளிப்பட்ட குணம், புகழ் ஆகிய உட்பொருள்களை ஏந்தும் முக்கியமான வேதாகமச் சொற்படிமம்; ஆகவே விளக்கவுரையாக மாற்றப்படவில்லை.
- source_word: סֶלָה
  choice: சேலா
  rationale: இதன் துல்லியமான பொருள் உறுதியற்றதால் ஊகமான மொழிபெயர்ப்புக்கு பதிலாக ஒலிபெயர்ப்பு தக்கவைக்கப்பட்டது.
theological_decisions:
- issue: יִשְׁתַּחֲווּ என்பதை வெளிப்படையாக ‘வழிபடும்’ என்று மொழிபெயர்ப்பதா, உடலைத் தாழ்த்தும் செயலைக் காட்டுவதா
  choice: உம்முன் பணிந்து
  alternative: உம்மை வழிபட்டு
  rationale: எபிரெயச் சொல் வழிபாட்டுச் செயலாகிய சாஷ்டாங்கப் பணிவை உள்ளடக்கினாலும், concrete ஆன உடல் செயலைக் காட்டும் மொழியாக உள்ளது. ‘பணிந்து’ என்பது அந்த மூலப்படிமத்தைப் பாதுகாத்து, வழிபாட்டு அர்த்தத்தை மறுக்காமல் விடுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதத்திற்கேற்ற கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. கடவுளை நோக்கிய ஒருமை மரியாதை வடிவங்களான ‘உம்/உமது’ தக்கவைக்கப்பட்டுள்ளன. எபிரெய வாக்கியத்தின் இரண்டு இணை உறுப்புகளும், ‘புகழ்ந்து பாடும்’ என்ற மறுபடியும் வருதலும் பாதுகாக்கப்பட்டுள்ளன.
