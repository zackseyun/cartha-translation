  text: I cried out to him with my mouth[a], and praise was under my tongue.
translation:
  language: ta
  text: 'என் வாயால் அவரை நோக்கிக் கூப்பிட்டேன்;

    என் நாவின் கீழ் புகழ்ச்சி இருந்தது.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘புகழ்ச்சி’ என்பதற்கான எபிரெயப் பெயர்ச்சொல்லை ‘மேன்மைப்படுத்துதல்’ என்றும் மொழிபெயர்க்கலாம்; இங்கு அது வாயால் சொல்லப்படும் புகழைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלָיו
  choice: அவரை நோக்கி
  rationale: மூன்றாம் நபர் ஆண்பால் ஒருமை பின்னொட்டுடன் உள்ள முன்னிடைச்சொல் ‘அவரை நோக்கி’ என்று பொருள்படும். சூழலில் இது கடவுளைக் குறித்தாலும், எபிரெய உரையில் உள்ள பதிலிடுபெயர் பாதுகாக்கப்படுகிறது.
- source_word: פִּי
  choice: என் வாயால்
  rationale: פֶּה என்பதன் நேர்ப்பொருள் ‘வாய்’. எபிரெயக் கவிதையின் உடலுறுப்பு சார்ந்த தெளிவான படிமத்தை இது காக்கிறது.
- source_word: קָרָאתִי
  choice: கூப்பிட்டேன்
  rationale: ஜெபச் சூழலில் קרא என்பது உரக்க அழைப்பதையோ உதவி வேண்டிக் கூப்பிடுவதையோ குறிக்கலாம். ‘கூப்பிட்டேன்’ இயல்பாகவும் மிகைப்படுத்தாமலும் இதை வெளிப்படுத்துகிறது.
- source_word: וְרוֹמַם
  choice: புகழ்ச்சி
  rationale: இவ்வடிவம் ‘உயர்த்துதல்/மேன்மைப்படுத்துதல்’ என்ற பெயர்ச்சொல்லாகப் புரிந்துகொள்ளப்படுகிறது; இச்சூழலில் வாயால் வெளிப்படும் புகழ்ச்சியே இயல்பான தமிழ் பொருத்தம்.
- source_word: תַּחַת
  choice: கீழ்
  rationale: இதன் அடிப்படைப் பொருள் ‘கீழ்’. நாவில் வெளிப்படத் தயாராக இருக்கும் சொல்லைக் குறிக்கும் எபிரெயப் படிமம் மொழிபெயர்ப்பில் தக்கவைக்கப்படுகிறது.
- source_word: לְשׁוֹנִי
  choice: என் நாவின்கீழ்
  rationale: לָשׁוֹן என்பதன் நேர்ப்பொருள் ‘நாவு’. ‘பேச்சு’ என்று அருவமாக்காமல் மூலத்தின் கவித்துவமான உடற்படிமம் பாதுகாக்கப்படுகிறது.
