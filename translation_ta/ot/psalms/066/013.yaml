lexical_decisions:
- source_word: אָבוֹא
  choice: வருவேன்
  rationale: בוא என்பதன் Qal முற்றுப்பெறா வினை, தன்மை ஒருமை; இங்கு பேச்சாளரின் வருங்கால நோக்கத்தைச் சுட்டுகிறது. ‘வருவேன்’ என்பது நேரடியான பொருள்; ‘நுழைவேன்’ என்பதும் சூழலில் சாத்தியம்.
- source_word: בֵיתְךָ
  choice: உமது இல்லத்திற்கு
  rationale: எபிரெயத்தில் நேரடியாக ‘உமது வீடு/இல்லம்’ என்று உள்ளது. கடவுளின் ஆலயம் அல்லது பரிசுத்த இடம் குறிக்கப்படலாம்; எனினும் மூலத்தின் உருவகத்தைத் தக்கவைக்க ‘இல்லம்’ பயன்படுத்தப்பட்டது.
- source_word: בְעוֹלוֹת
  choice: தகனபலிகளுடன்
  rationale: עוֹלָה என்பது முழுவதும் எரித்துச் செலுத்தப்படும் பலிக்கான வழக்கமான பலியியல் சொல். בְ முன்னொட்டு இங்கு உடனிகழ்ச்சியைக் குறிப்பதால் ‘-உடன்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: אֲשַׁלֵּם
  choice: நிறைவேற்றுவேன்
  rationale: שלם என்பதன் Piel வடிவம் நேர்த்திக்கடன்களுடன் வரும்போது அவற்றைச் செலுத்துதல் அல்லது நிறைவேற்றுதல் என்று பொருள்படும். நவீன தமிழில் ‘நிறைவேற்றுவேன்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: לְךָ
  choice: உமக்கு
  rationale: לְ இங்கு நேர்த்திக்கடன் நிறைவேற்றப்படுகிற பெறுநரைச் சுட்டுகிறது.
- source_word: נְדָרָי
  choice: நான் செய்த நேர்த்திக்கடன்களை
  rationale: சொல்லுக்கு நேரடியாக ‘என் நேர்த்திக்கடன்கள்’ என்று பொருள். தமிழில் நேர்த்திக்கடன் என்பது ஒருவர் செய்த வாக்குறுதியை உள்ளடக்குவதால், ‘நான் செய்த’ என்பது பொருளை இயல்பாகத் தெளிவாக்குகிறது.
theological_decisions:
- issue: ‘உமது இல்லம்’ என்பதை முதன்மை உரையிலேயே ஆலயம் அல்லது பரிசுத்த இடம் என்று விளக்கமாக மொழிபெயர்க்க வேண்டுமா?
  choice: ‘உமது இல்லம்’ என்ற மூல உருவகத்தைத் தக்கவைத்தல்
  alternative: ‘உமது ஆலயத்திற்கு’ அல்லது ‘உமது பரிசுத்த இடத்திற்கு’
  rationale: எபிரெய மூலத்தில் ‘இல்லம்’ என்றே உள்ளது; தகனபலிகள் பற்றிய சூழல் கடவுளின் வழிபாட்டு இடத்தைக் குறிப்பதாக உணர்த்தினாலும், அதை ‘ஆலயம்’ என்று குறுக்குவது அவசியமில்லை. மூலத்தின் தெளிவின்மையும் உருவகமும் பாதுகாக்கப்பட்டுள்ளன.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான இறைமொழி நடையாக ‘உமது/உமக்கு’ பயன்படுத்தப்பட்டுள்ளது. ‘தகனபலி’ மற்றும் ‘நேர்த்திக்கடன்’ ஆகியவை வேதாகமப் பலியியல் மற்றும் வாக்குறுதி சார்ந்த பொருளைத் துல்லியமாகக் கூறும் பரவலாக அறியப்பட்ட சொற்கள். வாசிப்பைச் சிதைக்காமல் தேவையான மாற்றுப் பொருள்களையும் ஆலயச் சூழலையும் ஒரே அடிக்குறிப்பில் குறிப்பிட்டுள்ளது.
