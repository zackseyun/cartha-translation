  text: I will come into your house with burnt offerings[a]; I will fulfill my vows to you[c][b],
translation:
  language: ta
  text: நான் தகனபலிகளுடன் உமது இல்லத்திற்கு வருவேன்; உமக்கு என் நேர்த்திக்கடன்களை நிறைவேற்றுவேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உமது இல்லம்’ என்பது கடவுளின் பரிசுத்த இடம் அல்லது ஆலயத்தைக் குறிக்கலாம். ‘நேர்த்திக்கடன்களை நிறைவேற்றுவேன்’ என்பதை ‘நேர்த்திக்கடன்களைச் செலுத்துவேன்’ என்றும் மொழிபெயர்க்கலாம்.
