  text: הֲבֵאתָ֥/נוּ בַ/מְּצוּדָ֑ה שַׂ֖מְתָּ מוּעָקָ֣ה בְ/מָתְנֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/011.yaml
  text: You brought us into the net[b][a]; you laid affliction on our loins.
translation:
  language: ta
  text: நீர் எங்களை வலைக்குள் கொண்டுவந்தீர்[a]; எங்கள் இடுப்பின்மேல் துன்பப் பாரத்தை வைத்தீர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அரணுக்குள்,’ ‘கோட்டைக்குள்,’ அல்லது ‘பொறிக்குள்’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் பிடிபடுதல் அல்லது அடைப்பு தொடர்பான இடத்தையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲבֵאתָנוּ
  choice: நீர் எங்களை ... சிக்கவைத்தீர்
  rationale: בוא என்பதன் ஹிஃபில் வடிவம் ‘உட்புகச் செய்தீர்/கொண்டுவந்தீர்’ என்று பொருள்படும். வலை என்ற அடுத்த சொல்லுடன் ‘சிக்கவைத்தீர்’ என்பது இயல்பாக இருந்து, தேவனுடைய நேரடி செயற்பாட்டையும் தக்கவைக்கிறது.
- source_word: בַמְּצוּדָה
  choice: வலையில்
  rationale: מְצוּדָה என்பது பிடிக்கும் வலை, பொறி, அல்லது அரண்/காவலிடம் ஆகியவற்றைக் குறிக்கக்கூடும். சோதனை மற்றும் கட்டுப்பாட்டை விவரிக்கும் சூழலில் ‘வலை’ பொருத்தமானது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: שַׂמְתָּ
  choice: வைத்தீர்
  rationale: שׂים என்பதன் அடிப்படைப் பொருளான ‘வை/அமை’ என்பதைக் கருத்தில் கொண்டு, சுமையை உடல்மேல் வைப்பதற்கு இயல்பான தமிழ்ச் சொல் தேர்ந்தெடுக்கப்பட்டது.
- source_word: מוּעָקָה
  choice: நெருக்கடியான சுமை
  rationale: இச்சொல் அழுத்தம், நெருக்கம், துன்புறுத்தும் பாரம் ஆகிய அர்த்தநிழல்களைக் கொண்டது. ‘நெருக்கடியான சுமை’ என்பது அழுத்தத்தையும் சுமை உருவகத்தையும் ஒருங்கே வெளிப்படுத்துகிறது.
- source_word: בְמָתְנֵינוּ
  choice: எங்கள் இடுப்பின்மேல்
  rationale: מָתְנַיִם என்பது இடுப்பு/அரையைக் குறிக்கிறது. ‘இடுப்பு’ நவீனத் தமிழில் தெளிவாகவும் உடல் சார்ந்த உருவகத்தைப் பாதுகாப்பதாகவும் உள்ளது.
theological_decisions:
- issue: துன்பத்தில் தேவனுடைய நேரடி செயற்பாடு
  choice: தேவனே மக்களை வலையில் சிக்கவைத்து அவர்கள்மேல் நெருக்கடியான சுமையை வைத்ததாக நேரடியாக மொழிபெயர்த்தல்
  alternative: ‘நாங்கள் வலையில் சிக்கினோம்’ அல்லது ‘எங்கள்மேல் துன்பம் வந்தது’ என்று தேவனுடைய செயற்பாட்டைத் தணித்துக் கூறுதல்
  rationale: எபிரெய மூலத்தில் இரண்டாம் நபர் ஒருமை வினைகள் தேவனை நேரடியாகச் செய்பவராகக் காட்டுகின்றன. அந்த இறையியல் பதற்றத்தை மொழிபெயர்ப்பு மென்மைப்படுத்தாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், தேவனை நோக்கிய மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது. மொழிநடை கண்ணியமாகவும் பொதுவாசகர்களுக்குத் தெளிவாகவும் உள்ளது; ‘இடுப்பு’ உடல் உருவகத்தை இயல்பாகப் பாதுகாக்கிறது.
