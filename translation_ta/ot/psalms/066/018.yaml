  text: If I had cherished iniquity in my heart[a], the Lord would not have listened.
translation:
  language: ta
  text: என் உள்ளத்தில் தீமையை நான் பேணி வைத்திருந்தால்[a], ஆண்டவர் எனக்குச் செவிகொடுத்திருக்க மாட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் உள்ளத்தில் தீமையை நான் கருதியிருந்தால், ஆண்டவர் கேட்டிருக்க மாட்டார்.”
    reason: רָאִיתִי என்பதன் அடிப்படை ‘பார்’ என்ற பொருளையும், இம்மரபுத்தொடரில் அதற்குள்ள ‘கருது’ என்ற மாற்றையும், שׁמע என்பதற்கான ‘கேள்’ என்ற நேரடியான மாற்றையும் பதிவு செய்கிறது.
lexical_decisions:
- source_word: אָוֶן
  choice: தீமை
  rationale: இச்சூழலில் இச்சொல் ஒழுக்கரீதியான தவற்றையும் பொல்லாப்பையும் குறிக்கிறது. ‘தீமை’ என்பது நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் இதை வெளிப்படுத்துகிறது.
- source_word: אִם
  choice: இருந்தால்
  rationale: எபிரெய வாக்கியத்தின் நிபந்தனை அமைப்பைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: רָאִיתִי
  choice: பேணி வைத்திருந்தால்
  rationale: இதன் அடிப்படைப் பொருள் ‘பார்த்தேன்’ என்றாலும், ‘உள்ளத்தில் தீமையைப் பார்த்தல்’ என்ற எபிரெய மரபுத்தொடர் அதை உள்ளார்ந்து ஏற்று இடமளிப்பதைக் குறிக்கிறது. ‘பேணி வைத்திருந்தால்’ அந்த நோக்கமுள்ள உள்ளார்ந்த பற்றை வெளிப்படுத்துகிறது.
- source_word: בְלִבִּי
  choice: என் உள்ளத்தில்
  rationale: לֵב குறிக்கும் சிந்தனை, விருப்பம், மனவுறுதி ஆகியவற்றை ‘உள்ளம்’ இயல்பாகத் தருகிறது; எபிரெய மரபுத்தொடரின் உட்புற மனிதன் என்ற படிமத்தையும் காக்கிறது.
- source_word: לֹא יִשְׁמַע
  choice: எனக்குச் செவிகொடுத்திருக்க மாட்டார்
  rationale: שׁמע என்பது வெறுமனே ஒலி கேட்பதைக் காட்டிலும் கவனித்துக் கேட்பதைக் குறிக்கலாம். ‘செவிகொடு’ என்பது ஜெபச் சூழலில் சாதகமாகக் கேட்பதைத் தெரிவிக்கிறது; ‘பதிலளிப்பார்’ என்று மூலத்தில் இல்லாத கருத்தைச் சேர்ப்பதில்லை.
- source_word: אֲדֹנָי
  choice: ஆண்டவர்
  rationale: இது கடவுளுக்குரிய மரியாதைத் திருப்பெயர். ‘ஆண்டவர்’ என்பது நவீனத் தமிழில் நிலைபெற்ற, இயல்பான மொழிபெயர்ப்பு.
theological_decisions:
- issue: ‘உள்ளத்தில் தீமையைப் பார்த்தல்’ என்ற மரபுத்தொடரைச் சொற்படியாகவா அல்லது பொருள்வழியாகவா மொழிபெயர்ப்பது
  choice: தீமையை உள்ளத்தில் ‘பேணி வைத்திருத்தல்’ எனப் பொருள்வழியாக மொழிபெயர்த்தல்
  alternative: என் உள்ளத்தில் தீமையை நான் பார்த்திருந்தால் / பொருட்படுத்தியிருந்தால்
  rationale: இந்த வசனம் ஒருவர் தன்னுள் தீமை இருப்பதை வெறுமனே உணர்வதைப் பற்றியதல்ல; அதற்கு மனத்தில் இடமளித்து ஆதரிப்பதைப் பற்றியது. அதே நேரத்தில் மூலவினையின் ‘பார்/கருது’ என்ற பரப்பை அடிக்குறிப்பு பாதுகாக்கிறது.
- issue: שׁמע என்பதை ‘கேள்,’ ‘செவிகொடு,’ அல்லது ‘பதிலளி’ என மொழிபெயர்ப்பது
  choice: செவிகொடு
  alternative: கேள் / பதிலளி
  rationale: ‘செவிகொடு’ என்பது கவனித்து ஏற்றுக்கொண்டு கேட்பதை வெளிப்படுத்துகிறது. ‘பதிலளி’ என்பது எபிரெயச் சொல் நேரடியாகக் கூறாத விளைவைச் சேர்க்கக்கூடும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பேணி வைத்திருந்தால்’ என்பது எபிரெய மரபுத்தொடரை இயல்பாக விளக்குகிறது; [a] என்ற அடிக்குறிப்பு அதன் சொற்பொருளுக்கு நெருக்கமான மாற்றைத் தக்கவைக்கிறது.
