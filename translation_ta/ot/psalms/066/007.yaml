theological_decisions:
- issue: இறைவனுடைய பார்வையை மனித உறுப்பின் உருவகத்தில் கூறுதல்
  choice: அவரது கண்கள் தேசங்களைக் கண்காணிக்கின்றன
  alternative: அவர் தேசங்களைக் கண்காணிக்கிறார்
  rationale: எபிரெய உரை ‘அவரது கண்கள்’ என்று வெளிப்படையாகக் கூறுகிறது. அதனைத் தக்கவைப்பது கவித்துவ உருவகத்தைப் பாதுகாக்கிறது; கடவுளுக்கு மனித வரம்புகள் உள்ளன என்று இதனால் அவசியம் பொருளாகாது.
- issue: கலகக்காரர்களைப் பற்றிய தடையின் பொருள்
  choice: தங்களை உயர்த்திக்கொள்ளாதிருக்கட்டும்
  alternative: எழும்பாதிருக்கட்டும்
  rationale: יָרִימוּ לָמוֹ என்ற சொற்றொடரில் தம்மைத் தாமே உயர்த்தும் நுணுக்கம் உள்ளது. இருந்தாலும் உடலளவில் ‘எழும்புதல்’ அல்லது எதிர்த்து ‘கிளர்ந்தெழுதல்’ என்ற பொருளும் சாத்தியமுள்ளதால் அது அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
