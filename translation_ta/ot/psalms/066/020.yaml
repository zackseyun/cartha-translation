source:
  edition: WLC
  text: בָּר֥וּךְ אֱלֹהִ֑ים אֲשֶׁ֥ר לֹֽא הֵסִ֘יר תְּפִלָּתִ֥/י וְ֝/חַסְדּ֗/וֹ מֵ/אִתִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/020.yaml
  text: Blessed be God[b][a], who has not turned away my prayer or his steadfast love from me.
translation:
  language: ta
  text: என் வேண்டுதலையும் தமது மாறாத அன்பையும்[a] என்னிடமிருந்து அகற்றாத கடவுள் போற்றப்படுவாராக![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மாறாத அன்பு” என்பதற்கு “உறுதியான அன்பு,” “விசுவாசமிக்க அன்பு,” அல்லது “உடன்படிக்கைக்குரிய உண்மைத்தன்மை” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் חֶסֶד அன்போடு இணைந்த நிலையான பற்றுறுதியையும் உண்மைத்தன்மையையும் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் “அகற்றுதல்” என்ற ஒரே வினை “என் வேண்டுதல்” மற்றும் “தமது மாறாத அன்பு” ஆகிய இரண்டையும் ஆள்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: போற்றப்படுவாராக
  rationale: இது புகழ்ச்சியையும் வாழ்த்துரையையும் வெளிப்படுத்தும் செயல்பாட்டு வடிவம். நவீனத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் ஒலிக்கிறது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: இங்கு இஸ்ரவேலின் கடவுளை நேரடியாகப் புகழ்வதால், பொதுவாகப் புரியும் மதிப்புநிறைந்த தமிழ்ச் சொல் பயன்படுத்தப்பட்டது.
- source_word: הֵסִיר
  choice: புறக்கணிக்காமலும் … விலக்காமலும்
  rationale: எபிரெய வினைச்சொல் ‘அகற்றுதல்/விலக்குதல்’ என்று பொருள்படும். ‘வேண்டுதல்’ என்பதுடன் தமிழில் இயல்பாக இருக்க ‘புறக்கணித்தல்’ என்றும், அன்புடன் ‘விலக்குதல்’ என்றும் சூழலுக்கேற்ப இருவிதமாக வெளிப்படுத்தப்பட்டது.
- source_word: תְּפִלָּתִי
  choice: என் வேண்டுதலை
  rationale: கடவுளிடம் செலுத்தப்படும் விண்ணப்பத்தைக் குறிக்கும்; ‘வேண்டுதல்’ என்பது தெளிவான, இயல்பான நவீனத் தமிழ்.
- source_word: וְחַסְדּוֹ
  choice: தமது மாறாத அன்பை
  rationale: חֶסֶד என்பதில் அன்பு, நிலைத்த விசுவாசம், உறவுப்பற்றுறுதி ஆகியவை அடங்குகின்றன. ‘மாறாத அன்பு’ அதன் அன்பையும் தொடர்ச்சியையும் சுருக்கமாகத் தருகிறது.
- source_word: מֵאִתִּי
  choice: என்னிடமிருந்து
  rationale: பேசுகிறவரிடமிருந்து பிரித்தல் அல்லது விலக்குதல் என்ற பொருளை நேரடியாகக் காட்டுகிறது.
theological_decisions:
- issue: חֶסֶד என்பதன் மொழிபெயர்ப்பு
  choice: மாறாத அன்பு
  alternative: உடன்படிக்கைப் பற்றுறுதி / பற்றுமாறாத அன்பு / இரக்கம்
  rationale: இச்சொல் வெறும் உணர்ச்சியை மட்டுமல்லாமல் நிலையான உறவுப்பற்றையும் உண்மைத்தன்மையையும் உள்ளடக்குகிறது. ‘மாறாத அன்பு’ இவ்விரு அம்சங்களையும் வாசகர்களுக்கு இயல்பாக எடுத்துரைக்கிறது; பிற நியாயமான பொருட்கள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதப் புகழ்ச்சிக்கேற்ற கண்ணியமான ஆனால் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. கடவுளைக் குறிக்கும் மரியாதைப் பன்மை வடிவங்களாக ‘தமது’, ‘இருந்த’ என்பதுடன் இறுதி வாழ்த்துரையில் ‘போற்றப்படுவாராக’ பயன்படுத்தப்பட்டுள்ளது.
