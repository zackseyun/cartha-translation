revisions:
- from: என் வேண்டுதலைப் புறக்கணிக்காமலும், தமது மாறாத அன்பை என்னிடமிருந்து விலக்காமலும் இருந்த கடவுள் போற்றப்படுவாராக![a][b]
  to: என் வேண்டுதலையும் தமது மாறாத அன்பையும்[a] என்னிடமிருந்து அகற்றாத கடவுள் போற்றப்படுவாராக![b]
  rationale: The revision restores the shared sense of the Hebrew verb הֵסִיר for both coordinated objects and avoids introducing the narrower interpretive idea of disregarding prayer. It retains the benedictory force of בָּרוּךְ with ‘போற்றப்படுவாராக’ and preserves חֶסֶד as ‘மாறாத அன்பு,’ with viable lexical alternatives documented in the footnote.
