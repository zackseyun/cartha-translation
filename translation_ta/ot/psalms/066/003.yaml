source:
  edition: WLC
  text: אִמְר֣וּ לֵ֭/אלֹהִים מַה נּוֹרָ֣א מַעֲשֶׂ֑י/ךָ בְּ/רֹ֥ב עֻ֝זְּ/ךָ֗ יְֽכַחֲשׁ֖וּ לְ/ךָ֣ אֹיְבֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/003.yaml
  text: Say to God[a], “How awesome are your works! Because of the greatness of your strength, your enemies cringe before you.”
translation:
  language: ta
  text: 'தேவனிடம் சொல்லுங்கள்: “உமது செயல்கள் எவ்வளவு அச்சமும் வியப்பும் ஊட்டுகின்றன! உமது வல்லமையின் மிகுதியினால், உமது பகைவர்கள் உமக்கு அடிபணிவதுபோல் நடிப்பார்கள்[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உமக்குப் போலியாக அடிபணிவார்கள்”; அல்லது, “விருப்பமின்றி உமக்கு இணங்குவார்கள்.” எபிரெய வினைச்சொல் வஞ்சகமான அல்லது கட்டாயப்படுத்தப்பட்ட அடிபணிதலைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִמְרוּ
  choice: சொல்லுங்கள்
  rationale: אמר என்பதன் ஆண்பால் பன்மை Qal கட்டளை வடிவம்; ஆராதிக்கும் சமூகத்தினர் தேவனை நோக்கிச் சொல்லுமாறு அழைக்கிறது.
- source_word: לֵאלֹהִים
  choice: தேவனிடம்
  rationale: ל முன்னொட்டு சொல்லப்படுகிறவரைக் குறிக்கிறது; நவீனத் தமிழில் இயல்பான முகவரிச் சொற்றொடர்.
- source_word: מַה נּוֹרָא
  choice: எவ்வளவு அச்சமும் வியப்பும் ஊட்டுகின்றன
  rationale: מַה வியப்பை வெளிப்படுத்துகிறது; נוֹרָא பயத்தையும் பயபக்தியுள்ள வியப்பையும் ஒருங்கே கொண்டதால் இரு நுணுக்கங்களையும் தமிழில் காக்கிறது.
- source_word: מַעֲשֶׂיךָ
  choice: உமது செயல்கள்
  rationale: מַעֲשֶׂה என்பது செயல் அல்லது கிரியை; பொதுவான நவீனத் தமிழில் ‘செயல்கள்’ தெளிவானது.
- source_word: בְּרֹב עֻזֶּךָ
  choice: உமது வல்லமையின் பெருக்கினால்
  rationale: בְּ காரணம் அல்லது அடிப்படையைக் காட்டுகிறது; רֹב மிகுதியையும் עֹז வலிமை அல்லது வல்லமையையும் குறிக்கின்றன.
- source_word: יְכַחֲשׁוּ לְךָ
  choice: உமக்கு அடிபணிவதுபோல் நடிப்பார்கள்
  rationale: כחש என்பதன் Piel வடிவம் ל உடன் வரும்போது பொய்யான அல்லது கட்டாயத்தால் வெளிப்படும் கீழ்ப்படிதலைக் குறிக்கலாம். தேர்ந்த சொற்றொடர் வஞ்சகமான வெளிப்புற அடக்கத்தைக் காக்கிறது.
- source_word: אֹיְבֶיךָ
  choice: உமது பகைவர்கள்
  rationale: אויב என்பதன் பன்மை வடிவத்துடன் இரண்டாம் நபர் ஆண்பால் ஒருமை உரிமை விகுதி உள்ளது.
theological_decisions:
- issue: தேவனுக்கு பகைவர்கள் காட்டும் பதிலின் இயல்பு
  choice: மனமார்ந்த வழிபாடு அல்லாமல், வல்லமையால் நெருக்கப்பட்டு வெளிப்புறமாகக் காட்டப்படும் பொய்யான அடிபணிதல்
  alternative: நேர்மையின்மையை வலியுறுத்தாமல் பொதுவாக ‘உமக்கு அடிபணிவார்கள்’ என்று மொழிபெயர்த்தல்
  rationale: כחש என்பதன் Piel பயன்பாடு மறுப்பு, வஞ்சகம் அல்லது போலியான கீழ்ப்படிதல் ஆகிய நிழற்பொருள்களை ஏந்தக்கூடும். அதை முற்றிலும் நீக்காமல், சொல் தரும் பதற்றத்தைக் காக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் சங்கீதத்துக்குரிய கண்ணியத்துடனும் அமைக்கப்பட்டது. தேவனை நோக்கும் மரியாதைப் பன்மை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன; נוֹרָא என்பதிலுள்ள அச்சமும் வியப்பும் இரண்டும் பாதுகாக்கப்பட்டுள்ளன.
