  to: 'தேவனிடம் சொல்லுங்கள்: “உமது செயல்கள் எவ்வளவு அச்சமும் வியப்பும் ஊட்டுகின்றன! உமது வல்லமையின் மிகுதியினால், உமது பகைவர்கள் உமக்கு அடிபணிவதுபோல் நடிப்பார்கள்[a].”'
