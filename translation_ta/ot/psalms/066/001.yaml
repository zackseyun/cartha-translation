  text: לַ֭/מְנַצֵּחַ שִׁ֣יר מִזְמ֑וֹר הָרִ֥יעוּ לֵ֝/אלֹהִים כָּל הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/001.yaml
  text: For the choir director[a]. A song, a psalm. Shout to God[b], all the earth.
translation:
  language: ta
  text: இசைத் தலைவருக்காக[a]. ஒரு பாடல்; ஒரு சங்கீதம். பூமியெங்கும் உள்ளவர்களே, கடவுளை நோக்கி ஆர்ப்பரியுங்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இசை இயக்குநருக்கு”; “பாடகர் குழுத் தலைவருக்கு.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “கடவுளை நோக்கி மகிழ்ச்சியுடன் முழக்கமிடுங்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: இசைத் தலைவருக்காக
  rationale: இசை நிகழ்த்துதலை மேற்பார்வையிடும் நபரைக் குறிக்கும் மேலெழுத்துச் சொல்லின் வழிபாட்டு-இசைச் செயல்பாட்டை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது; எபிரெய முன்னிடைச்சொல்லின் பொருள் காரணமாக வேறு வடிவங்களும் சாத்தியம்.
- source_word: שִׁיר
  choice: ஒரு பாடல்
  rationale: இலக்கிய வகையைக் குறிக்கும் சொல்லின் நேரான, இயல்பான தமிழாக்கம்.
- source_word: מִזְמוֹר
  choice: ஒரு சங்கீதம்
  rationale: தொழில்நுட்பமான சங்கீத வகைப்பெயருக்கான நிலைபெற்ற தமிழ்ச் சொல்; שִׁיר என்பதுடன் இணைந்துள்ள இரு வகைப்பெயர்களையும் தனித்தனியாகப் பாதுகாக்கிறது.
- source_word: הָרִיעוּ
  choice: ஆர்ப்பரியுங்கள்
  rationale: உரத்த முழக்கம் எழுப்புதல் என்ற வினையின் வலிமையைப் பாதுகாக்கிறது; சூழலில் மகிழ்ச்சியான அல்லது வெற்றிகரமான முழக்கமாகப் புரிந்துகொள்ளலாம், ஆனால் அந்த நுணுக்கத்தை முதன்மை உரையில் கட்டாயப்படுத்தவில்லை.
- source_word: לֵאלֹהִים
  choice: கடவுளை நோக்கி
  rationale: முழக்கத்தின் முகவரியாகக் கடவுள் இருப்பதைத் தமிழில் இயல்பாகக் குறிக்கிறது.
- source_word: כָּל הָאָרֶץ
  choice: பூமியெங்கும் உள்ளவர்களே
  rationale: சங்கீதத்தின் உலகளாவிய அழைப்பை இயல்பான தமிழ் விளிவடிவில் தெரிவிக்கிறது; சொல்லுக்கு சொல் வடிவமான ‘பூமியனைத்தும்’ என்பதைக் காட்டிலும் வாசகருக்குத் தெளிவு.
theological_decisions:
- issue: כָּל הָאָרֶץ என்ற சொற்றொடரின் அழைப்பு யாரை உள்ளடக்குகிறது
  choice: பூமியெங்கும் உள்ள அனைவருக்குமான உலகளாவிய அழைப்பு
  alternative: நாடு முழுவதற்கோ பூமியுலகிற்கோ விடுக்கப்படும் அழைப்பு
  rationale: இந்தச் சங்கீதத்தின் துதிச் சூழல் பரந்த, உலகளாவிய அழைப்பை ஆதரிக்கிறது; இருப்பினும் எபிரெய אֶרֶץ என்பதற்கு ‘நாடு’ என்ற பொருளும் வரலாம்.
translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டுக்குரிய கண்ணியத்துடனும் பொதுவாசகர்களுக்குப் புரியும் இயல்புடனும் வடிவமைக்கப்பட்டது. மேலெழுத்தின் இரு இலக்கிய வகைப்பெயர்களும் காக்கப்பட்டுள்ளன; பிரதான கட்டளை எபிரெய வினையின் உரத்த முழக்கத்தை முன்னிறுத்துகிறது.
