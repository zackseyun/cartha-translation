  yaml_path: translation/ot/psalms/066/006.yaml
  text: He turned the sea into dry land[a]; they passed through the river on foot[b]; there we rejoiced in him.
translation:
  language: ta
  text: அவர் கடலை வறண்ட நிலமாக மாற்றினார்; அவர்கள் ஆற்றை கால்நடையாகக் கடந்தார்கள்.[b] அங்கே நாம் அவரில் மகிழ்ந்தோம்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அங்கே நாம் அவரில் மகிழ்வோமாக.” எபிரெய வினைவடிவத்தை கடந்தகாலக் கூற்றாக மட்டுமல்லாமல் ஓர் ஊக்கவுரையாகவும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
  - marker: b
    text: இவ்வசனம் வெளியேற்றப் பயணத்தின்போது கடலைக் கடந்ததையும், வாக்குத்தத்த நாட்டிற்குள் நுழையும்போது யோர்தான் ஆற்றைக் கடந்ததையும் நினைவூட்டுவதாக இருக்கலாம்.
    reason: cross_reference
lexical_decisions:
- source_word: הָפַךְ
  choice: மாற்றினார்
  rationale: இந்த வினைச்சொல் திருப்புதல் அல்லது ஒரு நிலையை வேறொரு நிலையாக மாற்றுதல் என்பதைக் குறிக்கிறது. கடல் வறண்ட நிலமானதை இயல்பான தமிழில் தெளிவாகச் சொல்கிறது.
- source_word: יָם
  choice: கடல்
  rationale: எபிரெயச் சொல்லின் பொதுவான பொருளைத் தக்கவைக்கிறது; குறிப்பிட்ட கடலின் பெயரை மூலவசனம் சொல்லாததால் அதை மொழிபெயர்ப்பில் சேர்க்கவில்லை.
- source_word: לְיַבָּשָׁה
  choice: வறண்ட நிலமாக
  rationale: வறண்ட தரை அல்லது நிலம் என்ற பொருளைக் கொடுத்து, לְ முன்னிடைச்சொல் காட்டும் நிலைமாற்றத்தையும் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בַּנָּהָר
  choice: ஆற்றை
  rationale: முன்னிடைச்சொல் சொற்படியாக ‘ஆற்றில்/ஆற்றினூடே’ என இருந்தாலும், יַעַבְרוּ என்பதோடு சேர்ந்து ஆற்றைக் கடத்தலைக் குறிக்கிறது; தமிழில் ‘ஆற்றைக் கடந்தார்கள்’ என்பது இயல்பான நடை.
- source_word: יַעַבְרוּ
  choice: கடந்தார்கள்
  rationale: கடந்து செல்லுதல் என்ற இயக்கத்தைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: בְרָגֶל
  choice: கால்நடையாக
  rationale: நடந்து, படகு போன்ற சாதனமின்றிக் கடந்ததைக் குறிக்கும் எபிரெயச் சொற்றொடருக்கான இயல்பான நவீனத் தமிழ் இணை.
- source_word: שָׁם
  choice: அங்கே
  rationale: அந்த இடத்தையோ அங்கு நிகழ்ந்த மீட்புச் செயலையோ சுட்டும் திறந்த தன்மையைப் பாதுகாக்கிறது.
- source_word: נִשְׂמְחָה
  choice: நாம் மகிழ்ந்தோம்
  rationale: வடிவம் ‘நாம் மகிழ்வோமாக’ என்ற ஊக்கவுரையாகவும் புரிந்துகொள்ளப்படலாம். சூழலின் கடந்தகால மீட்புச் செயல்களோடு வழிபாட்டுச் சமூகத்தை இணைக்கும் பின்னோக்குக் கூற்றை முதன்மை உரை ஏற்கிறது; மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בּוֹ
  choice: அவரில்
  rationale: ஆண்பால் ஒருமை பின்னொட்டு சூழலில் கடவுளைக் குறிப்பதாகப் புரிந்துகொள்ளப்படுகிறது. ‘அவரில்’ என்பது அதன் உறவுசார் பொருளைப் பாதுகாக்கிறது; நிகழ்வு அல்லது இடத்தைக் குறிக்கும் சாத்தியம் குறைவானது.
theological_decisions:
- issue: கடல் மற்றும் ஆறு கடத்தல்களின் வரலாற்றுச் சுட்டு
  choice: கடல் வறண்ட நிலமானதையும் ஆற்றைக் கால்நடையாகக் கடந்ததையும் தனித்தனியாகச் சொல்லி, வெளியேற்றப் பயணத்தின் கடல் கடத்தலையும் யோர்தான் கடத்தலையும் நினைவூட்டும் வகையில் மொழிபெயர்க்கப்பட்டது.
  alternative: இவற்றை ஒரு பொதுவான அற்புதக் கடத்தல் பற்றிய கவித்துவ விளக்கமாக மட்டும் வாசிக்கலாம்.
  rationale: மூலவசனம் நிகழ்வுகளின் பெயர்களை நேரடியாகக் குறிப்பிடாததால் அவை முதன்மை உரையில் சேர்க்கப்படவில்லை; சாத்தியமான வரலாற்றுச் சுட்டு அடிக்குறிப்பில் விளக்கப்படுகிறது.
- issue: נִשְׂמְחָה என்பதன் கால/ஊக்கவுரைத் தெளிவின்மை
  choice: ‘நாம் மகிழ்ந்தோம்’ என்ற பின்னோக்குக் கூற்று முதன்மை உரையில் வைக்கப்பட்டது.
  alternative: ‘அங்கே நாம் அவரில் மகிழ்வோமாக’ என்ற ஊக்கவுரை.
  rationale: சங்கீதம் கடவுளின் கடந்தகால வல்ல செயல்களை நினைவுகூரும் சூழலில் பின்னோக்குக் கூற்று இயல்பாகப் பொருந்துகிறது. இருப்பினும் எபிரெய வடிவத்தின் ஊக்கவுரைச் சாத்தியம் உண்மையானதால் அது அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: בּוֹ என்ற பின்னொட்டின் சுட்டுப்பொருள்
  choice: கடவுளைக் குறிக்கும் ‘அவரில்’ என்று எடுத்துக்கொள்ளப்பட்டது.
  alternative: அந்த இடம் அல்லது நிகழ்வைக் குறிக்கும் பொருளில் புரிந்துகொள்ளலாம்.
  rationale: சுற்றியுள்ள புகழ்ச்சிச் சூழலும் கடவுளே செயலாற்றுபவர் என்பதும் தனிப்பட்ட ஆண்பால் சுட்டை அவரோடு இணைப்பதை ஆதரிக்கின்றன; மாற்றுச் சாத்தியத்தை முற்றிலும் மறுப்பதில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் புரியக்கூடிய, ஆனால் சங்கீதத்திற்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டது. ‘கால்நடையாக’ இயல்பான சமகாலச் சொல்; ‘அவரில் மகிழ்ந்தோம்’ மூலத்தின் உறவுசார் அமைப்பைத் தக்கவைக்கிறது. எபிரெயக் கவிதையின் சுருக்கமான இணை வாக்கிய அமைப்பு அரைப்புள்ளிகளால் பாதுகாக்கப்பட்டது.
