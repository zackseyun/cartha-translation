translation:
  language: ta
  text: 'வாருங்கள், கடவுளின் செயல்களைப் பாருங்கள்;

    மனுமக்கள்மேல் அவர் செய்கிற செயல் அச்சமூட்டும் வியப்புக்குரியது.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மனிதகுலம்மேல்.” எபிரேயத்தில், “மனிதனின் மக்கள்மேல்.”
    reason: בְּנֵי אָדָם என்பதன் பொதுமனிதப் பொருளையும், அதன் நேரடியான எபிரேயச் சொல்லுருவத்தையும் காட்டுகிறது.
lexical_decisions:
- source_word: לְכוּ
  choice: வாருங்கள்
  rationale: הלך என்பதன் பன்மை ஏவல் வடிவம் இங்கு அழைப்பாகப் பயன்படுகிறது; தமிழில் “வாருங்கள்” என்பது இயல்பான அழைப்புமுறை.
- source_word: וּרְאוּ
  choice: பாருங்கள்
  rationale: ראה என்பதன் பன்மை ஏவல் வடிவம்; கடவுளின் செயல்களைக் கவனிக்கும்படி விடுக்கும் அழைப்பை நேரடியாகத் தருகிறது.
- source_word: מִפְעֲלוֹת
  choice: செயல்கள்
  rationale: கடவுள் செய்தவற்றைக் குறிக்கும் பன்மைப் பெயர்; நவீன தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: இங்கு இஸ்ரவேலின் கடவுளே ஒருமையில் குறிப்பிடப்படுகிறார்.
- source_word: נוֹרָא
  choice: அச்சமும் வியப்பும் ஊட்டுபவை
  rationale: ירא வேரிலிருந்து வரும் இச்சொல் வெறும் பயங்கரத்தை மட்டுமல்ல, பயபக்தியுடனான வியப்பையும் குறிக்கிறது; இரு நுணுக்கங்களையும் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עֲלִילָה
  choice: அவர் செய்பவை
  rationale: ஒருமை வடிவம் என்றாலும் கடவுளின் செயற்பாட்டைத் தொகுப்பாகக் குறிக்க முடியும்; தமிழில் இயல்பாக அமைய பன்மைத் தொகுப்பாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: עַל
  choice: மனுமக்களிடம்
  rationale: கடவுளின் செயல் மனிதகுலத்தை நோக்கியது அல்லது அதனுடன் தொடர்புடையது என்பதைத் தெரிவிக்கிறது; நன்மை அல்லது எதிர்ப்பு என்ற ஒரே பொருளாக இதைச் சுருக்கவில்லை.
- source_word: בְּנֵי אָדָם
  choice: மனுமக்கள்
  rationale: எபிரேய மொழியின் “மனிதனின்/ஆதாமின் மகன்கள்” என்ற உருவகத்தை ஓரளவு காத்துக்கொண்டு, மனிதகுலம் முழுவதையும் குறிக்கும் இயல்பான தமிழ்ச் சொல்லாக உள்ளது.
theological_decisions:
- issue: בְּנֵי אָדָם என்ற பொதுமனிதச் சொல்லாக்கம்
  choice: மனுமக்கள்
  alternative: மனிதர்கள் / மனிதகுலம்
  rationale: எபிரேயச் சொற்றொடரின் குடும்பவழி உருவகத்தை முற்றிலும் நீக்காமல், அது எல்லா மனிதர்களையும் குறிக்கும் பொதுப்பொருளையும் தமிழில் புரியத்தக்க வகையில் காக்கிறது.
- issue: נוֹרָא என்பதிலுள்ள பயமும் பயபக்தியான வியப்பும்
  choice: அச்சமும் வியப்பும் ஊட்டுபவை
  alternative: பயங்கரமானவை / பிரமிப்பூட்டுபவை
  rationale: ஒரு பக்கமாக வெறும் அச்சத்தையோ மறுபக்கமாக வெறும் பாராட்டையோ மட்டும் தேர்ந்தெடுக்காமல், மூலச்சொல்லின் இரட்டை நுணுக்கத்தைக் காக்கிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழ்; பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான கவிதைநடை. முதல் வரியின் அழைப்புத் தொனியும், இரண்டாம் வரியின் அச்சம் கலந்த வியப்பும் காக்கப்பட்டுள்ளன.
