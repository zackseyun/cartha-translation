source:
  edition: WLC
  text: הִרְכַּ֥בְתָּ אֱנ֗וֹשׁ לְ/רֹ֫אשֵׁ֥/נוּ בָּֽאנוּ בָ/אֵ֥שׁ וּ/בַ/מַּ֑יִם וַ֝/תּוֹצִיאֵ֗/נוּ לָֽ/רְוָיָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/012.yaml
  text: You made a man ride over our heads; we went through fire and through water, yet you brought us out into abundance.
translation:
  language: ta
  text: மனிதன் எங்கள் தலைகளின்மேல் ஏறிச் செல்லும்படி செய்தீர்[a]; நாங்கள் நெருப்பையும் நீரையும் கடந்து வந்தோம்; ஆனாலும் எங்களைச் செழுமைக்குக் கொண்டுவந்தீர்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மனிதன்” என்பது ஒருமையில் உள்ளது; இது ஓர் ஒடுக்குபவனையோ மனித அதிகாரத்தையோ பொதுவாகக் குறிக்கலாம்.
    reason: אֱנוֹשׁ என்ற ஒருமைச் சொல்லின் உண்மையான பொருள் விரிவை வெளிப்படுத்துகிறது.
  - marker: b
    text: “செழுமை” என்பதற்கு “நிறைவு” அல்லது “வளமான நிலை” என்றும் பொருள் கொள்ளலாம்.
    reason: לָרְוָיָה என்ற அரிதான சொல்லின் செறிவு, நிறைவு, வளமை ஆகிய பொருள் நிழல்களைப் பதிவு செய்கிறது.
lexical_decisions:
- source_word: אֱנוֹשׁ
  choice: மனிதன்
  rationale: எபிரெயச் சொல் ஒருமையில் இருந்து, பலவீனமும் மரணத்திற்குட்பட்ட தன்மையும் கொண்ட மனிதனைக் குறிக்கலாம். உரையில் உள்ள ஒருமையைத் தக்கவைத்து இயல்பான தமிழில் தரப்பட்டுள்ளது.
- source_word: הִרְכַּבְתָּ ... לְרֹאשֵׁנוּ
  choice: எங்கள் தலைகளின்மேல் ஏறிச் செல்லும்படி செய்தீர்
  rationale: ஆளுகை அல்லது ஒடுக்குதலைக் காட்டும் வலுவான மூல உருவகத்தை விளக்கமாக மாற்றாமல் தக்கவைக்கிறது.
- source_word: בָאֵשׁ וּבַמַּיִם
  choice: நெருப்பையும் நீரையும் கடந்து வந்தோம்
  rationale: கடுமையான சோதனைகளைக் குறிக்கும் இணை உருவகங்களை இயல்பான தமிழில் அப்படியே பாதுகாக்கிறது.
- source_word: לָרְוָיָה
  choice: செழுமைக்கு
  rationale: நிறைவு, மிகுதி, வளமை என்ற பொருள் பரப்பைச் சுருக்கமாகக் கொண்டுவருகிறது; மூலத்தில் வெளிப்படையாக இல்லாத 'இடம்' என்பதை முதன்மை உரையில் சேர்க்கவில்லை.
theological_decisions:
- issue: துன்பத்தின் மீது தேவனுடைய செயற்பாடு
  choice: செய்தீர்
  alternative: அனுமதித்தீர்
  rationale: ஹிப்இல் வினைவடிவம் நேரடியாக 'செய்யவைத்தீர்' என்று கூறுகிறது. தெய்வீக காரணத்தன்மையை வெறும் அனுமதியாக மாற்றாமல், சங்கீதத்தின் இறையியல் அழுத்தத்தைத் தக்கவைக்கிறது.
- issue: אֱנוֹשׁ என்பதன் ஒருமை
  choice: மனிதன்
  alternative: மனிதர்கள்
  rationale: மூலத்தின் இலக்கண ஒருமையைப் பாதுகாக்கிறது; அது ஓர் ஒடுக்குபவனையோ மனித அதிகாரத்தையோ பொதுவாகக் குறிக்கலாம் என்பதைக் குறிப்பில் திறந்தவையாக விடுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதைமிக்க இறைமுகப்பான “செய்தீர்/கொண்டுவந்தீர்” வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. ஒடுக்குதல், நெருப்பு, நீர் ஆகிய கவித்துவ உருவகங்கள் விளக்கவுரையாக மாற்றப்படாமல் தக்கவைக்கப்பட்டுள்ளன.
