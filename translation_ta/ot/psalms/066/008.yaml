  text: Bless our God[a], O peoples[b], and make the sound of his praise heard.
translation:
  language: ta
  text: 'மக்களினங்களே, நம் கடவுளை வாழ்த்துங்கள்;

    அவருடைய புகழொலி கேட்கும்படி செய்யுங்கள்[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவருக்குச் செலுத்தும் புகழின் குரலைக் கேட்கச் செய்யுங்கள்.”
    reason: תְּהִלָּתוֹ என்பதை கடவுளுக்குச் செலுத்தப்படும் புகழாகப் புரிந்துகொள்ளும் சாத்தியத்தையும், קוֹל என்பதைக் ‘குரல்’ என மொழிபெயர்க்கும் மாற்றையும் காக்கிறது.
lexical_decisions:
- source_word: בָּרְכוּ
  choice: வாழ்த்துங்கள்
  rationale: ברך என்பதன் பன்மை ஏவல் வடிவத்தை நேரடியாகக் காக்கிறது. கடவுளை நோக்கி வரும் சூழலில் ‘புகழுங்கள்’ என்பதும் பொருந்தினாலும், ‘வாழ்த்துங்கள்’ மூல வினையின் தனித்துவத்தைத் தக்கவைக்கிறது.
- source_word: עַמִּים
  choice: மக்களினங்களே
  rationale: பல மக்கள் குழுக்களை நேரடியாக அழைக்கும் பன்மை விளிப்பைத் தெளிவாகக் காட்டுகிறது; ‘நாடுகளே’ என்று அரசியல் அலகுகளாக மட்டும் சுருக்கவில்லை.
- source_word: אֱלֹהֵינוּ
  choice: நம் கடவுளை
  rationale: முதல் நபர் பன்மை உடைமைப் பின்னொட்டை இயல்பான நவீனத் தமிழில் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: וְהַשְׁמִיעוּ
  choice: கேட்கும்படி செய்யுங்கள்
  rationale: שמע என்பதன் ஹிஃபில் ஏவல் வடிவத்திலுள்ள ‘கேட்கச் செய்தல்’ என்ற காரணவினைப் பொருளை, வெறும் ‘அறிவியுங்கள்’ என்று மாற்றாமல் காக்கிறது.
- source_word: קוֹל תְּהִלָּתוֹ
  choice: அவருடைய புகழொலி
  rationale: קוֹל என்பதன் ஒலி/குரல் கருத்தையும் תְּהִלָּתוֹ என்பதிலுள்ள மூன்றாம் நபர் ஒருமை பின்னொட்டையும் சுருக்கமான, இயல்பான தமிழில் காக்கிறது. அது அவரைப் பற்றிய அல்லது அவருக்குச் செலுத்தப்படும் புகழ் என்ற பொருள் வேறுபாட்டை பிரதான உரையில் தீர்மானிக்கவில்லை.
theological_decisions:
- issue: תְּהִלָּתוֹ என்பதிலுள்ள பின்னொட்டின் உறவு
  choice: அவருடைய புகழொலி
  alternative: அவருக்குச் செலுத்தும் புகழின் குரல்
  rationale: எபிரெயப் பின்னொட்டு ‘அவருடைய புகழ்’ என்று நேரடியாக மொழிபெயர்க்கப்படலாம்; சூழலில் அது கடவுளுக்குச் செலுத்தப்படும் புகழையும் குறிக்கலாம். பிரதான உரை அந்த உறவைத் திட்டவட்டமாக வரையறுக்காமல், மாற்று வாசிப்பை அடிக்குறிப்பில் தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified அழைப்பு நடை பயன்படுத்தப்பட்டுள்ளது. ‘மக்களினங்களே’ என்பது பன்மை விளிப்பைத் தெளிவாக்குகிறது; இரண்டாம் அடியில் காரணவினைத் தன்மை காக்கப்பட்டுள்ளது.
