lexical_decisions:
- source_word: הַשָּׂם
  choice: நிலைநிறுத்தி
  rationale: שׂוּם என்பதன் அடிப்படைப் பொருள் ‘வை/நிறுத்து’ என்பதாகும். இங்கு பெயரெச்ச வடிவில் கடவுளின் செயலைக் குறிக்கிறது; உயிரைக் காத்து வாழ்வோரிடையே நிலைத்திருக்கச் செய்வது என்ற சூழற்பொருளை ‘நிலைநிறுத்தி’ இயல்பாகவும் மூல உருவகத்தைத் தக்கவைத்தும் தருகிறது.
- source_word: נַפְשֵׁנוּ
  choice: நம் உயிரை
  rationale: נֶפֶשׁ என்பது உயிர், தன், நபர் ஆகிய பரந்த பொருள் வரம்பைக் கொண்டது. இச்சூழலில் உயிர்வாழ்தலே மையமாக இருப்பதால் ‘நம் உயிரை’ என்பது இயல்பானதும் மூலச் சொல்லின் நெகிழ்வை ஓரளவு காக்கிறதுமான தேர்வு.
- source_word: בַּחַיִּים
  choice: வாழ்வோரிடையே
  rationale: எழுத்துப்படி ‘உயிர்களில்/வாழ்வில்’ என்றாலும், இத்தொடர் உயிருள்ளவர்களின் வட்டத்தில் இருப்பதைக் குறிக்கிறது. ‘வாழ்வோரிடையே’ என்ற மொழிபெயர்ப்பு எபிரெயச் சொற்றொடரின் வெளிப்பாட்டைத் தெளிவாகக் காக்கிறது.
- source_word: וְלֹא נָתַן
  choice: விடாதவர்
  rationale: נָתַן என்பதுடன் தொடர்ந்து வரும் வினையெச்சம் இங்கு ‘நிகழ அனுமதி கொடு’ என்ற மரபுத்தொடர் பொருளைக் கொண்டது. தமிழில் ‘விடாதவர்’ இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לַמּוֹט
