  text: Surely God has heard[a]; he has listened to the voice of my prayer.
translation:
  language: ta
  text: உண்மையாகவே, கடவுள் கேட்டிருக்கிறார்; என் வேண்டுதலின் குரலுக்குச் செவிசாய்த்திருக்கிறார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָכֵן
  choice: உண்மையாகவே
  rationale: உறுதியையும் வலியுறுத்தலையும் காட்டும் எபிரெயச் சொல்லின் ஆற்றலை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: שָׁמַע
  choice: கேட்டிருக்கிறார்
  rationale: முடிவுற்றும் தற்போதைய பொருத்தமுள்ளதுமான செயலை எபிரெய நிறைவுவினை காட்டுவதால், தமிழ் நிகழ்கால நிறைவு வடிவம் பயன்படுத்தப்பட்டது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: இங்கு ஒருமை வினையுடன் வந்து ஒரே கடவுளைக் குறிக்கிறது; நவீன நிலையான தமிழில் இயல்பான பொதுச் சொல் இதுவாகும்.
- source_word: הִקְשִׁיב
  choice: செவிசாய்த்திருக்கிறார்
  rationale: கவனத்துடன் கேட்டல் என்ற causative/attentive நுண்பொருளை இயல்பாகவும் dignified ஆகவும் தருகிறது.
- source_word: בְּקוֹל
  choice: குரலுக்கு
  rationale: קוֹל என்பதன் concrete lexical sense ஆன ‘குரல்/ஒலி’ என்பதைக் காத்து, הִקְשִׁיב உடன் வரும் בְּ-ஐ தமிழின் ‘-க்கு’ வேற்றுமையால் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: תְּפִלָּתִי
  choice: என் வேண்டுதல்
  rationale: சங்கீதக்காரரின் தனிப்பட்ட prayer-ஐ தெளிவாகக் குறிக்கிறது; ‘வேண்டுதல்’ இச்சூழலில் இயல்பான, மரியாதையான தமிழ்.
