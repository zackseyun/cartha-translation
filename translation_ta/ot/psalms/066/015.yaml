translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் சங்கீதத்திற்கேற்ற கண்ணியமான நடையிலும் அமைக்கப்பட்டது. கடவுளை நோக்கிய உரையில் மரியாதை ஒருமை ‘உமக்கு’ பயன்படுத்தப்பட்டது. பலிவகைகளின் வேறுபாடுகளும் விலங்குகளின் பாலினக் குறிப்புகளும் தேவையான இடங்களில் காக்கப்பட்டுள்ளன.
