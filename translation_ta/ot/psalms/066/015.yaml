source:
  edition: WLC
  text: עֹ֘ל֤וֹת מֵחִ֣ים אַעֲלֶה לָּ֭/ךְ עִם קְטֹ֣רֶת אֵילִ֑ים אֶ֥עֱשֶֽׂה בָקָ֖ר עִם עַתּוּדִ֣ים סֶֽלָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/015.yaml
  text: I will offer to you burnt offerings of fattened animals[a], with the smoke of rams; I will prepare cattle and goats[d][c][b]. Selah
translation:
  language: ta
  text: செம்மறியாட்டுக் கடாக்களின் புகையோடு கொழுத்த விலங்குகளின் தகனபலிகளை உமக்குச் செலுத்துவேன்; மாடுகளையும் வெள்ளாட்டுக் கடாக்களையும் பலியிடுவேன். செலா[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “செலா” என்பதன் துல்லியமான பொருள் தெரியவில்லை; இது இசை அல்லது வழிபாட்டுக்குரிய குறியீடாக இருக்கலாம் என்பதால் மொழிபெயர்க்கப்படாமல் விடப்பட்டுள்ளது.
    reason: cultural_note
lexical_decisions:
- source_word: עֹלוֹת
  choice: தகனபலிகள்
  rationale: பலிபீடத்தில் முழுவதுமாக எரிக்கப்படும் பலிவகையைக் குறிக்கும் வழக்கமான, தெளிவான தமிழ் இறையியல் சொல்.
- source_word: מֵחִים
  choice: கொழுத்த விலங்குகள்
  rationale: பலிக்காக நன்கு உணவளிக்கப்பட்ட, கொழுமையான விலங்குகளைக் குறிக்கும்; எளிதில் புரியும் இயல்பான மொழிபெயர்ப்பு.
- source_word: אַעֲלֶה לָךְ
  choice: உமக்குச் செலுத்துவேன்
  rationale: பலிசார்ந்த சூழலில் עלה என்பதன் causative வடிவம் ‘பலியாகச் செலுத்துதல்’ என்னும் பொருள் தருகிறது; கடவுளை நேரடியாக முன்னிலைப்படுத்தும் לָךְ என்பதும் காக்கப்படுகிறது.
- source_word: עִם קְטֹרֶת אֵילִים
  choice: செம்மறியாட்டுக் கடாக்களின் புகையோடு
  rationale: கடாக்கள் எரிக்கப்படும் பலிச் சூழலில் קְטֹרֶת என்பது எழும் புகையைக் குறிக்கலாம். אֵילִים என்பதன் ஆண்பால் தன்மையை ‘கடாக்கள்’ தெளிவாகக் காட்டுகிறது.
- source_word: אֶעֱשֶׂה
  choice: பலியிடுவேன்
  rationale: עשה இங்கு பலியைச் செய்வது அல்லது படைப்பது என்ற வழக்குப்பொருளில் வருகிறது; தமிழில் ‘பலியிடுவேன்’ என்பது சூழலை இயல்பாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: בָקָר
  choice: மாடுகள்
  rationale: காளைகளை மட்டும் குறிப்பதாகச் சுருக்காமல், மாட்டினத்தைக் கூட்டாகக் குறிக்கும் எபிரெயச் சொல்லின் பரப்பைத் தக்கவைக்கிறது.
- source_word: עַתּוּדִים
  choice: வெள்ளாட்டுக் கடாக்கள்
  rationale: பொதுவாக வெள்ளாடுகள் என்று மட்டும் சொல்லாமல், மூலத்தில் உள்ள ஆண் வெள்ளாடுகள் என்ற குறிப்பை நேரடியாகக் காக்கிறது.
- source_word: סֶלָה
  choice: செலா
  rationale: இதன் துல்லியமான பொருள் உறுதியாகத் தெரியாததால் ஊகமாக மொழிபெயர்க்காமல் ஒலிபெயர்க்கப்படுகிறது.
