  text: Come and hear[a], all you who fear God, and I will tell what he has done for my soul.
translation:
  language: ta
  text: 'தேவனுக்குப் பயப்படுகிற அனைவரே,


    வாருங்கள், கேளுங்கள்;


    அவர் என் உயிருக்கு[a] செய்ததை


    நான் எடுத்துரைப்பேன்.'
  philosophy: optimal-equivalence
