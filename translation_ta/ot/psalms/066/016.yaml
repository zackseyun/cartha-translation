  - marker: a
    text: அல்லது, “என் வாழ்வுக்கு செய்ததை” அல்லது “எனக்குச் செய்ததை.” எபிரெயச் சொல் נֶפֶשׁ (நெஃபெஷ்) சூழலுக்கேற்ப ‘உயிர்,’ ‘வாழ்வு,’ ‘தன்னிலை,’ அல்லது ‘ஆத்துமா’ எனப் பொருள்படலாம்.
