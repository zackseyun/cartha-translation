lexical_decisions:
- source_word: לְכוּ
  choice: வாருங்கள்
  rationale: வினைச்சொல்லின் அடிப்படைப் பொருள் ‘செல்லுங்கள்’ என்றாலும், இங்கு கேட்பதற்கான அழைப்பாக இருப்பதால் தமிழில் இயல்பாக ‘வாருங்கள்’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: שִׁמְעוּ
  choice: கேளுங்கள்
  rationale: கவனத்துடன் செவிகொடுக்கும்படி கூறும் பன்மை ஏவலை நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: וַאֲסַפְּרָה
  choice: நான் எடுத்துச் சொல்கிறேன்
  rationale: ספר என்பதன் ‘விவரித்துச் சொல், எடுத்துரை’ என்ற பொருளையும், பேசுபவர் இப்போது அவ்வாறு செய்ய முனைவதையும் இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: כָּל יִרְאֵי אֱלֹהִים
  choice: தேவனுக்குப் பயப்படுகிற அனைவரே
  rationale: தேவனிடம் அச்சமும் பயபக்தியும் கொண்டவர்களை நேரடியாக அழைக்கும் எபிரெய அமைப்பைப் பாதுகாக்கிறது; ‘பயம்’ என்பதை வெறும் மரியாதையாக மென்மைப்படுத்தவில்லை.
- source_word: אֱלֹהִים
  choice: தேவன்
  rationale: இங்கு வருவது יהוה என்ற தனிப்பெயர் அல்ல, אֱלֹהִים என்ற பொதுவான இறைப்பட்டம்; அதனால் ‘தேவன்’ பயன்படுத்தப்பட்டது.
- source_word: אֲשֶׁר עָשָׂה
  choice: அவர் ... செய்ததை
  rationale: நிறைவேறிய இறைச்செயலைச் சாட்சியாக எடுத்துரைக்கும் தொடர்புச் சொற்றொடரைத் தமிழில் இயல்பாக வழங்குகிறது.
- source_word: לְנַפְשִׁי
  choice: என் உயிருக்கு
  rationale: נֶפֶשׁ என்பது சூழலின்படி உயிர், தன்னிலை, உள்ளம் ஆகிய பொருட்களைக் கொள்ளும். ‘உயிர்’ இங்கு முழு நபரையும் அவரது வாழ்வையும் குறிக்கக்கூடிய இயல்பான தமிழ்ச் சொல்; ‘ஆத்துமா’ என்று மட்டும் மொழிபெயர்த்து எபிரெயச் சொல்லை உடலிலிருந்து பிரிந்த ஓர் உள்ளார்ந்த கூறாகக் குறுக்கவில்லை. பிற சாத்தியங்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
theological_decisions:
- issue: ‘தேவனுக்குப் பயப்படுகிற’ என்பதன் பொருள்
  choice: தேவனிடத்திலான பயபக்தி நிறைந்த பயம்
  alternative: வெறும் திகில்; பொதுவான மரியாதை மட்டும்
  rationale: மூலச்சொல் வழிபாட்டுக்குரிய அச்சம், பக்தி, கீழ்ப்படிதல் ஆகியவற்றை உள்ளடக்கலாம். ‘பயப்படுகிற’ என்பது அதன் வேதாகமத் தீவிரத்தையும் திறந்த தன்மையையும் காக்கிறது.
- issue: נֶפֶשׁ என்பதன் பொருள்
  choice: உயிர்
  alternative: ஆத்துமா; நான்/எனது தன்னிலை; உள்ளம்
  rationale: இந்தச் சூழலில் தேவன் சங்கீதக்காரரின் உயிருக்கும் வாழ்வுக்கும் செய்த நன்மையைச் சுட்டலாம். ‘உயிர்’ முழு நபரையும் குறிக்கும் எபிரெயப் பயன்பாட்டிற்கு ஏற்றது; பிற சாத்தியங்களை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் சங்கீதத்திற்கேற்ற கண்ணியத்துடனும் அமைக்கப்பட்டது. அழைப்பு, ஏவல், தனிப்பட்ட சாட்சி ஆகிய மூன்று இயக்கங்களையும் குறும் கவிதை வரிகளாகப் பாதுகாக்கிறது.
