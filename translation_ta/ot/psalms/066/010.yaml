  yaml_path: translation/ot/psalms/066/010.yaml
  text: For you have tested us[a], O God[b]; you have refined us as silver is refined.
translation:
  language: ta
  text: ஏனெனில், கடவுளே, நீர் எங்களைச் சோதித்தீர்[a]; வெள்ளியைப் புடமிடுவதுபோல் எங்களைப் புடமிட்டீர்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘எங்கள் உண்மைத்தன்மையை நிரூபித்தீர்’; எபிரெய வினைச்சொல், உண்மையான தன்மையை வெளிப்படுத்தும் நோக்குடன் சோதிப்பதை வலியுறுத்தக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: 'இது உலோகவியல் உருவகம்: கடவுள் எங்களைச் சோதித்தது, நெருப்பில் வெள்ளியைப் புடமிட்டு சுத்திகரிப்பதற்கு ஒப்பிடப்படுகிறது.'
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: சுற்றியுள்ள புகழ்ச்சிக்கான காரணத்தை அறிமுகப்படுத்தும் விளக்கத் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְחַנְתָּנוּ
  choice: நீர் எங்களைச் சோதித்தீர்
  rationale: בחן என்பது ஒருவரின் அல்லது ஒன்றின் தரத்தையும் உண்மைத்தன்மையையும் வெளிப்படுத்தும் நோக்குடன் சோதித்தல் அல்லது ஆராய்தல் என்பதைக் குறிக்கலாம். ‘சோதித்தீர்’ தெளிவாகவும் அடுத்து வரும் உலோகச் சுத்திகரிப்பு உருவகத்துக்கு ஏற்றதாகவும் உள்ளது.
- source_word: אֱלֹהִים
  choice: கடவுளே
  rationale: இரண்டாம் நபர் வினை வடிவங்களும் உரைச் சூழலும் இது நேரடி அழைப்பு என்பதைத் தெளிவாக்குகின்றன; ‘கடவுளே’ நவீனத் தமிழில் இயல்பான விளிவேற்றுமை வடிவம்.
- source_word: צְרַפְתָּנוּ
  choice: எங்களைப் புடமிட்டீர்
  rationale: צרף உலோகத்தை நெருப்பின் மூலம் சுத்திகரிப்பதைக் குறிக்கிறது. ‘புடமிட்டீர்’ உலோகவியல் உருவகத்தைத் தமிழில் சுருக்கமாகவும் தெளிவாகவும் காக்கிறது.
- source_word: כִּצְרָף
  choice: புடமிடுவதுபோல்
  rationale: כְּ ஒப்புமையைக் குறிக்கிறது; பின்னுள்ள ‘வெள்ளி’யுடன் இணைத்து சுத்திகரிப்புச் செயல்முறையை இயல்பான தமிழ் ஒப்புமையாக வழங்குகிறது.
- source_word: כָּסֶף
  choice: வெள்ளி
  rationale: சுத்திகரிப்பு ஒப்புமையில் குறிப்பிடப்படும் விலையுயர்ந்த உலோகத்தின் நேரடியான பொருள்.
theological_decisions:
- issue: சோதித்தல் மற்றும் புடமிடுதல் இடையிலான உறவு
  choice: இரண்டு இணையான வினைச்சொற்களையும் தனித்தனியாக வைத்திருந்து, இரண்டாவது சொல்லின் உலோகவியல் உருவகத்தைப் பாதுகாத்தல்
  alternative: இரண்டையும் பொதுவாக ‘தூய்மைப்படுத்தினீர்’ என்று பொருளாக்குதல்
  rationale: எபிரெய உரை சோதித்தலையும் வெள்ளியைப் புடமிடுதலையும் இணைத்தாலும் அவற்றை ஒரே கருத்தாகச் சுருக்கவில்லை. தனித்தனியாக மொழிபெயர்ப்பது சோதனை, நிரூபணம், சுத்திகரிப்பு ஆகியவற்றுக்கிடையிலான கவித்துவ மற்றும் இறையியல் அழுத்தத்தைத் திறந்தவாறே வைக்கிறது.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க தமிழ் பயன்படுத்தப்பட்டுள்ளது. கடவுளை நேரடியாக அழைக்கும் இடத்தில் ‘கடவுளே’ என்றும், அதற்கேற்ற மரியாதைப் பன்மை வினை வடிவங்களான ‘சோதித்தீர்’, ‘புடமிட்டீர்’ என்றும் வழங்கப்பட்டுள்ளது. அரிதான தொழில்நுட்பச் சொல்லைத் தவிர்க்காமல், தமிழில் நிலைபெற்ற ‘புடமிடுதல்’ மூலம் மூலத்தின் உலோகச் சுத்திகரிப்பு உருவகம் காக்கப்பட்டுள்ளது.
