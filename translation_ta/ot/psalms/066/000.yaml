lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: பாடகர் தலைவருக்கு
  rationale: இசை வழிநடத்தும் தலைவரைக் குறிக்கும் மேல்தலைப்புச் சொல்லின் இயல்பான தமிழ் வடிவம்; சொல்லின் துல்லியமான பணி உறுதியாக இல்லாததால் மாற்று மொழிபெயர்ப்புகள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: שִׁיר מִזְמוֹר
  choice: ஒரு பாடல்; ஒரு சங்கீதம்
  rationale: இரு இணை வகைப்பாட்டுச் சொற்களையும் தனித்தனியாகப் பாதுகாக்கிறது.
- source_word: הָרִיעוּ
  choice: ஆர்ப்பரியுங்கள்
  rationale: உரத்த வெற்றிக்குரல் அல்லது மகிழ்ச்சிக் குரல் எழுப்புவதைச் சுட்டும் கட்டளை; மூலத்தில் 'மகிழ்ச்சியுடன்' என்ற தனிச்சொல் இல்லாததால் அதை முதன்மை உரையில் சேர்க்கவில்லை.
- source_word: כָּל־הָאָרֶץ
  choice: பூமியெங்கும் உள்ளவர்களே
  rationale: பூமியே நேரடியாக அழைக்கப்படுவது தமிழில் இயல்பாகப் புரிய, அதில் வாழும் அனைவரையும் குறிக்கும் அழைப்பாக வழங்கப்பட்டுள்ளது; உலகளாவிய அழைப்பைத் தக்கவைக்கிறது.
theological_decisions:
- issue: אֱלֹהִים என்பதன் மொழிபெயர்ப்பு
  choice: கடவுள்
  alternative: தேவன்
  rationale: மூலத்தின் பொதுவான இறைபெயரை நவீன தரத் தமிழில் இயல்பாக வழங்குகிறது; குறிப்பிட்ட சமயப் பிரிவின் சொல்வழக்கை முன்னிறுத்தவில்லை.
- issue: ஆர்ப்பரிப்பின் உணர்ச்சித் தன்மை
  choice: ஆர்ப்பரியுங்கள்
  alternative: மகிழ்ச்சியுடன் ஆர்ப்பரியுங்கள்
  rationale: சூழல் மகிழ்ச்சியான புகழ்ச்சியை உணர்த்தினாலும், வினைச்சொல்லில் அந்த வினையடை வெளிப்படையாக இல்லை; ஆகவே மூலத்தின் திறந்த தன்மை பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீன, மரியாதைமிக்க, பொதுமக்களுக்கு எளிதில் புரியும் தரத் தமிழ். மேல்தலைப்பின் சுருக்கமான அமைப்பும், பிரதான வாக்கியத்தின் உற்சாகமான கட்டளைத் தொனியும் பாதுகாக்கப்பட்டுள்ளன.
