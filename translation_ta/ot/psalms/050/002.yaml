source:
  edition: WLC
  text: מִ/צִּיּ֥וֹן מִכְלַל יֹ֗פִי אֱלֹהִ֥ים הוֹפִֽיעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/002.yaml
  text: From Zion[a], the perfection of beauty, God shines forth.
translation:
  language: ta
  text: அழகின் நிறைவாகிய சீயோனிலிருந்து[a] கடவுள் ஒளிவீசித் தோன்றுகிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அழகின் நிறைவாகிய சீயோனிலிருந்து கடவுள் ஒளிவீசித் தோன்றினார்”; அல்லது, “சீயோனிலிருந்து கடவுள் நிறைவான அழகுடன் ஒளிவீசித் தோன்றுகிறார்.”
    reason: எபிரெய நிறைவுற்ற வினையை நிகழ்காலக் கவித்துவக் காட்சியாகவோ இறந்தகாலமாகவோ மொழிபெயர்க்கலாம்; மேலும் ‘அழகின் நிறைவு’ சீயோனை விளக்குகிறதா, கடவுள் தோன்றும் விதத்தை விளக்குகிறதா என்பதில் தொடரியல் இருபொருள் உள்ளது.
lexical_decisions:
- source_word: מִ/צִּיּוֹן
  choice: சீயோனிலிருந்து
  rationale: מִן மூலத்தையோ புறப்படும் இடத்தையோ குறிக்கிறது; இயல்பான நவீனத் தமிழில் ‘சீயோனிலிருந்து’ இதைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: מִכְלַל יֹפִי
  choice: அழகின் நிறைவான
  rationale: מִכְלַל என்பது முழுமை அல்லது நிறைவான வெளிப்பாட்டையும், יֹפִי அழகையும் குறிக்கிறது. இங்கு இச்சொற்றொடர் சீயோனை விளக்கும் இணைப்பெயர் தொடராகப் புரிந்துகொள்ளப்படுகிறது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: இதனுடன் ஒருமை வினைச்சொல் வருவதால், இங்கு ஒருமைப் பொருளில் ‘கடவுள்’ என்று மொழிபெயர்க்கப்படுகிறது.
- source_word: הוֹפִיעַ
  choice: ஒளிவீசித் தோன்றுகிறார்
  rationale: இந்த வினை ஒளிர்ந்து வெளிப்படுதல் அல்லது மகிமையுடன் தோன்றுதல் ஆகிய இரு நுணுக்கங்களையும் கொண்டுள்ளது; ‘ஒளிவீசித் தோன்றுகிறார்’ அவற்றை இயல்பான தமிழில் இணைத்துப் பாதுகாக்கிறது.
theological_decisions:
- issue: ‘அழகின் நிறைவு’ என்பது சீயோனையா கடவுளையா விவரிக்கிறது?
  choice: 'அதை சீயோனை விளக்கும் தொடராகக் கொள்வது: ‘அழகின் நிறைவான சீயோன்’.'
  alternative: ‘சீயோனிலிருந்து கடவுள் நிறைவான அழகுடன் ஒளிவீசித் தோன்றுகிறார்’ என்று, கடவுள் தோன்றும் விதத்தை விவரிப்பதாகக் கொள்ளலாம்.
  rationale: எபிரெயச் சொல்வரிசையில் ‘சீயோன்’ என்பதற்குப் பின் வரும் מִכְלַל יֹפִי, சீயோனை இணைப்பெயராக விவரிப்பதே இயல்பான வாசிப்பு; எனினும் வேறு தொடரியல் தொடர்பு சாத்தியமுள்ளதால் அது அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதத்திற்கேற்ற கண்ணியமான கவித்துவ நடையுடன் அமைக்கப்பட்டது. ‘ஒளிவீசித் தோன்றுகிறார்’ என்பது மூல வினையின் ஒளிர்தல் மற்றும் வெளிப்படுதல் ஆகிய இரு கூறுகளையும் காக்கிறது.
