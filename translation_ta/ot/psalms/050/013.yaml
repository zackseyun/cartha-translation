  terminology: “காளைகள்,” “இறைச்சி,” “வெள்ளாட்டுக் கடாக்கள்,” and “இரத்தம்” are accurate, understandable terms. “வெள்ளாட்டுக் கடாக்கள்” properly preserves the male-goat specification, so no lexical footnote is required.
