source:
  edition: WLC
  text: הַֽ֭/אוֹכַל בְּשַׂ֣ר אַבִּירִ֑ים וְ/דַ֖ם עַתּוּדִ֣ים אֶשְׁתֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/013.yaml
  text: Do I eat the flesh of bulls[a], or drink the blood of goats?
translation:
  language: ta
  text: நான் காளைகளின் இறைச்சியை உண்பேனா, அல்லது வெள்ளாட்டுக் கடாக்களின் இரத்தத்தைக் குடிப்பேனா?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַאוֹכַל
  choice: நான் ... உண்பேனா?
  rationale: கேள்வித் துகளுடன் அமைந்த முதலாம் நபர் வினைமுற்று, எதிர்பார்க்கப்படும் மறுப்புப் பதிலைக் கொண்ட சொல்லாட்சிக் கேள்வியாக இயல்பாகத் தரப்பட்டுள்ளது.
- source_word: בְּשַׂר
  choice: இறைச்சியை
  rationale: பலியிடப்படும் விலங்கின் உடல் உணவாகக் கருதப்படும் தெளிவான படிமத்தை நவீன தமிழில் இயல்பாகக் காட்டுகிறது; ‘மாம்சம்’ என்பதைக் காட்டிலும் பொதுவாசகருக்கு நேரடியானது.
- source_word: אַבִּירִים
  choice: காளைகளின்
  rationale: சொல்லுக்கு ‘வலிமைமிக்கவை’ என்ற அடிப்படை நிழற்பொருள் இருந்தாலும், பலி மற்றும் வெள்ளாட்டுக் கடாக்களின் இரத்தம் பற்றிய இணைச் சூழலில் வலிமையான ஆண் மாடுகளைக் குறிக்கிறது.
- source_word: וְדַם
  choice: '... இரத்தத்தைக்'
  rationale: எபிரெய இணைப்புச் சொல் இரு இணையான சொல்லாட்சிக் கேள்விகளைத் தொடர்கிறது. தமிழில் இரண்டாவது கேள்வியைத் தனியாக அமைப்பது இயல்பாகவும் மூலத்தின் இணைப்பொருளை மாற்றாமலும் உள்ளது.
- source_word: עַתּוּדִים
  choice: வெள்ளாட்டுக் கடாக்களின்
  rationale: இச்சொல் பொதுவாக ஆண் வெள்ளாடுகளைக் குறிக்கிறது. ‘வெள்ளாட்டுக் கடா’ என்பது செம்மறியாட்டுக் கடாவுடன் குழப்பமின்றி பாலினத்தையும் விலங்கு வகையையும் தெளிவாக்குகிறது.
- source_word: אֶשְׁתֶּה
  choice: குடிப்பேனா?
  rationale: முதல் வினையுடன் இணையான முதலாம் நபர் சொல்லாட்சிக் கேள்வியாகத் தமிழில் இயல்பாக மொழிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: கடவுள் பலியின் இறைச்சியையும் இரத்தத்தையும் உட்கொள்வது போன்ற மனித உருவக மொழி
  choice: உண்பதும் இரத்தத்தைக் குடிப்பதும் பற்றிய உறுதியான படிமத்தைச் சொல்லாட்சிக் கேள்விகளாக அப்படியே பேணுதல்
  alternative: ‘உங்கள் பலிகள் எனக்குத் தேவையா?’ என்று கருத்தை மட்டும் சுருக்கிக் கூறுதல்
  rationale: மூலவசனம் கடவுள் பலியுணவைச் சார்ந்திருப்பதாகக் கருதுவதைத் தெளிவான பலிசார் படிமத்தால் மறுக்கிறது. அதை அருவமான விளக்கமாக மாற்றாமல் அதன் இறையியல் வலிமையும் பதற்றமும் பேணப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் வகையிலும் சங்கீதத்திற்கேற்ற கண்ணியமான நடையிலும் இரண்டு இணையான சொல்லாட்சிக் கேள்விகளாக வடிவமைக்கப்பட்டது. மூலத்தின் தெளிவான விலங்கு மற்றும் இரத்தப் படிமங்கள் மென்மைப்படுத்தப்படவில்லை.
