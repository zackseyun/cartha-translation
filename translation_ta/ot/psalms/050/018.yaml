  text: If you saw a thief[a], you were pleased with him[b], and your portion was with adulterers.
translation:
  language: ta
  text: நீ ஒரு திருடனைக் கண்டபோது, அவனை அங்கீகரித்தாய்[a]; விபசாரம் செய்கிறவர்களோடு உன் பங்கு இருந்தது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவனிடம் மகிழ்ச்சி கொண்டாய்,’ ‘அவனை விரும்பினாய்,’ அல்லது ‘அவனுக்கு ஒப்புதல் அளித்தாய்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல் விருப்பம், ஆதரவு, அல்லது ஏற்றுக்கொள்ளுதலைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் சொல்லர்த்தமாக, ‘விபசாரம் செய்கிறவர்களோடு உன் பங்கு இருந்தது.’ அவர்களோடு தன்னை இணைத்துக்கொண்டு, அவர்களுடைய கூட்டுறவில் பங்குகொண்டதை இந்த மரபுத்தொடர் உணர்த்துகிறது.
    reason: idiom_explanation
lexical_decisions:
- source_word: אִם רָאִיתָ
  choice: நீ ... கண்டபோது
  rationale: אִם நிபந்தனையையும் ஒரு நிகழ்வை முன்வைப்பதையும் குறிக்கலாம். இங்கு கடந்தகாலக் குற்றச்சாட்டின் இயல்பான தமிழுக்காக ‘கண்டபோது’ என மொழிபெயர்க்கப்பட்டுள்ளது; ‘கண்டால்’ என்பதும் சாத்தியம்.
- source_word: גַנָּב
  choice: ஒரு திருடனை
  rationale: גנב என்பது பிறருடையதைத் திருடுகிற ஒருவரை நேரடியாகக் குறிக்கிறது.
- source_word: וַתִּרֶץ עִמּוֹ
  choice: அவனை ஏற்றுக்கொண்டாய்
  rationale: רצה இங்கு ஒருவர்மேல் விருப்பம், ஆதரவு அல்லது அங்கீகாரம் காட்டுவதை உணர்த்துகிறது. ‘ஏற்றுக்கொண்டாய்’ என்பது திருடனுடைய செயலை அங்கீகரித்து அவனோடு இணங்கிய குற்றச்சாட்டை இயல்பான தமிழில் தருகிறது.
- source_word: מְנָאֲפִים
  choice: விபசாரம் செய்கிறவர்கள்
  rationale: செயற்பெயரெச்சம் பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்டு, விபசாரத்தில் ஈடுபடுகிறவர்களைக் குறிக்கிறது. இச்சொற்றொடர் நவீன தமிழில் தெளிவாக உள்ளது.
- source_word: חֶלְקֶךָ
  choice: உன் பங்கு
  rationale: חלק என்பதன் அடிப்படைப் பொருள் ‘பங்கு’ அல்லது ‘பங்காகக் கிடைப்பது.’ எபிரெய உருவகத்தைத் தக்கவைத்தபடி, அவர்களோடு இணைந்திருப்பதையும் பகிர்ந்துகொள்வதையும் இது உணர்த்துகிறது.
