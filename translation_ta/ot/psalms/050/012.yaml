source:
  edition: WLC
  text: אִם אֶ֭רְעַב לֹא אֹ֣מַר לָ֑/ךְ כִּי לִ֥/י תֵ֝בֵ֗ל וּ/מְלֹאָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/012.yaml
  text: If I were hungry[a], I would not tell you, for the world and its fullness are mine.
translation:
  language: ta
  text: நான் பசித்திருந்தால், உன்னிடம் சொல்லியிருக்கமாட்டேன்; ஏனெனில் உலகமும் அதிலுள்ள அனைத்தும்[a] எனக்குச் சொந்தம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, «உலகமும் அதன் நிறைவும்.»
    reason: மְלֹאָהּ என்பதன் சுருக்கமான, அதிகச் சொற்சார்ந்த மாற்றுப் பொருளை வழங்குகிறது; குறியீடு உலகை நிரப்பும் பொருள்களைக் குறிக்கும் சொற்றொடருக்குப் பின் சரியாக அமைக்கப்பட்டுள்ளது.
lexical_decisions:
- source_word: אִם אֶרְעַב
  choice: நான் பசியடைந்தாலும்
  rationale: אִם உடன் வரும் முற்றுப்பெறா வினை இங்கு கற்பனையான நிபந்தனையைத் தெரிவிக்கிறது. தமிழில் ‘-ஆலும்’ அமைப்பு அந்த நிபந்தனை இயல்பாகவும் சுருக்கமாகவும் வெளிப்படுத்துகிறது; கடவுள் உண்மையில் பசியடைகிறார் என்ற கூற்றாக இதை மாற்றுவதில்லை.
- source_word: לֹא אֹמַר לָךְ
  choice: உன்னிடம் சொல்லமாட்டேன்
  rationale: אמר என்பதன் அடிப்படைப் பொருள் ‘சொல்’; לָךְ உடன் தமிழில் ‘உன்னிடம் சொல்லமாட்டேன்’ என்பது இயல்பான இணை. நிபந்தனைக்குரிய விளைவைத் தமிழ் எதிர்மறை எதிர்கால வடிவம் தெளிவாகக் காட்டுகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தை அறிமுகப்படுத்துவதால் காரண இணைப்பான ‘ஏனெனில்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: תֵבֵל
  choice: உலகம்
  rationale: תֵבֵל குடியிருக்கும் அல்லது ஒழுங்குபடுத்தப்பட்ட உலகைக் குறிக்கலாம். ‘உலகம்’ என்பது பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: וּמְלֹאָהּ
  choice: அதில் நிறைந்துள்ள அனைத்தும்
  rationale: מְלֹאָהּ என்பதன் சொற்பொருள் ‘அதன் நிறைவு’; இங்கு உலகை நிரப்புகிற அல்லது அதில் உள்ள அனைத்தையும் குறிக்கிறது. ‘அதில் நிறைந்துள்ள அனைத்தும்’ கவிதைத் தன்மையையும் தெளிவையும் இணைக்கிறது.
- source_word: לִי
  choice: எனக்குச் சொந்தம்
  rationale: לִי உடைமையைக் குறிக்கிறது. ‘எனக்குச் சொந்தம்’ என்பது உலகமும் அதிலுள்ள அனைத்தும் கடவுளுடையவை என்பதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: பலிச் சூழலில் கடவுளின் தேவையின்மை
  choice: கடவுள் பசியடைவதாக உறுதிப்படுத்தாமல், அப்படியொரு கற்பனையான நிலை இருந்தாலும் மனிதரின் உணவை அவர் சார்ந்திருக்கமாட்டார் என்ற நிபந்தனைக் கூற்றாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘நான் பசியடைந்தால், உன்னிடம் சொல்லமாட்டேன்’ என்ற அதிகச் சொற்சார்ந்த நிபந்தனை வடிவம்.
  rationale: சுற்றியுள்ள வசனங்கள் பலிகள் கடவுளுக்கு உணவளிக்கின்றன என்ற எண்ணத்தை மறுக்கின்றன. இருப்பினும், ‘தெய்வீக சுயபோதகம்’ போன்ற தத்துவச் சொற்களை வசனத்துக்குள் சேர்க்காமல் மூலத்தின் கற்பனை நிபந்தனையும் காரணமும் பாதுகாக்கப்பட்டன.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிதில் புரியும், கண்ணியமான கவிதைநடை. மூலத்தின் சுருக்கமான இரண்டு கூறுகளும் காரண இணைப்பும் பாதுகாக்கப்பட்டுள்ளன. வழங்கப்பட்ட ஆங்கில அடிக்குறிப்பு வசனத்தின் இறுதிப் பகுதிக்குரிய சொற்பொருள் மாற்றைத் தருகிறது; ஆனால் அதன் குறியீடு ‘hungry’ என்பதற்குப் பின் அமைந்துள்ளது. தவறான இணைப்பைத் தவிர்க்கவும், தமிழாக்கமே மாற்றுப் பொருளை வெளிப்படையாக வழங்குவதாலும் அடிக்குறிப்பு சேர்க்கப்படவில்லை.
