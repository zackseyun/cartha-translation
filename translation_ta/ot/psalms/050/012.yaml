revisions:
- from: நான் பசியடைந்தாலும், உன்னிடம் சொல்லமாட்டேன்; ஏனெனில் உலகமும் அதில் நிறைந்துள்ள அனைத்தும் எனக்குச் சொந்தம்.
  to: நான் பசித்திருந்தால், உன்னிடம் சொல்லியிருக்கமாட்டேன்; ஏனெனில் உலகமும் அதிலுள்ள அனைத்தும்[a] எனக்குச் சொந்தம்.
  rationale: நிபந்தனைக் கற்பனைத் தன்மையைத் துல்லியமாகக் காட்ட «-ஆலும்» வடிவம் «பசித்திருந்தால் ... சொல்லியிருக்கமாட்டேன்» என மாற்றப்பட்டுள்ளது. உலகின் “நிறைவு” என்பதற்கான சூழல்சார் பொருள் முதன்மை உரையில் இயல்பாகத் தரப்பட்டு, சொற்சார்ந்த மாற்று அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
