source:
  edition: WLC
  text: מִזְמ֗וֹר לְ/אָ֫סָ֥ף אֵ֤ל אֱֽלֹהִ֡ים יְֽהוָ֗ה דִּבֶּ֥ר וַ/יִּקְרָא אָ֑רֶץ מִ/מִּזְרַח שֶׁ֝֗מֶשׁ עַד מְבֹאֽ/וֹ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/001.yaml
  text: A psalm of Asaph. The Mighty One[a], God, Yahweh, has spoken and called the earth from the rising of the sun to its setting.
translation:
  language: ta
  text: 'ஆசாப்பின் சங்கீதம்.


    வல்லமையுள்ளவர்[a], கடவுள், யாவே பேசினார்;


    சூரியன் உதிப்பதிலிருந்து சூரியன் மறைவதுவரை


    பூமியை அழைத்தார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுள், கடவுள், ஆண்டவர்”; தொடக்கத்திலுள்ள தெய்வீகப் பெயர்களை “தேவர்களின் கடவுளாகிய ஆண்டவர்” என்றும் சிலர் புரிந்துகொள்கிறார்கள்.
    reason: மூலத்திலுள்ள אֵל אֱלֹהִים יְהוָה என்ற தொடரின் இலக்கண உறவும் சொற்பொருளும் ஒன்றுக்கு மேற்பட்ட மொழிபெயர்ப்புகளை அனுமதிக்கின்றன.
lexical_decisions:
- source_word: מִזְמוֹר
  choice: சங்கீதம்
  rationale: சங்கீதத் தலைப்புகளில் வரும் இச்சொல்லுக்கான வழக்கமான, வகையைத் தெளிவாகக் குறிக்கும் தமிழ் சொல்.
- source_word: לְאָסָף
  choice: ஆசாப்பின்
  rationale: לְ என்பது ஆசிரியத் தொடர்பு, உரிமை அல்லது தொகுப்புச் சார்பு ஆகியவற்றைக் குறிக்கலாம்; ‘ஆசாப்பின்’ என்பது அந்தத் தொடர்பைச் சுருக்கமாகக் கூறுகிறது, அதன் துல்லிய இயல்பை நிர்ணயிப்பதில்லை.
- source_word: אֵל
  choice: வல்லவர்
  rationale: அடுத்து வரும் אֱלֹהִים என்பதிலிருந்து இதை வேறுபடுத்தி, אֵל என்பதன் வல்லமை சார்ந்த பொருளையும் மூன்று தெய்வீகப் பெயர்களின் சொல்லாட்சிச் செறிவையும் காக்கிறது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: யாவே என்ற தனிப்பெயருடனும் ஒருமை வினைகளுடனும் வருவதால் இங்கு இஸ்ரவேலின் கடவுளையே ஒருமையில் குறிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெயத் தெய்வீகத் தனிப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: דִּבֶּר
  choice: பேசினார்
  rationale: நிறைவுற்ற செயலை எளிய இறந்தகாலத்தில் இயல்பாகவும் மதிப்புடனும் தெரிவிக்கிறது.
- source_word: וַיִּקְרָא
  choice: அழைத்தார்
  rationale: பேசியதைத் தொடர்ந்து பூமியை அழைக்கும் செயலை நேரடியாகக் காட்டுகிறது; நீதித்தீர்ப்புக் கூட்டத்திற்கான அழைப்பு என்ற சாத்தியமான நிழற்பொருளை மிகைப்படுத்தவில்லை.
- source_word: אָרֶץ
  choice: பூமி
  rationale: சூரிய உதயம் முதல் மறைவு வரையுள்ள உலகளாவிய எல்லை காரணமாக ‘நாடு’ என்பதைக் காட்டிலும் ‘பூமி’ பொருத்தமானது.
- source_word: מִמִּזְרַח שֶׁמֶשׁ
  choice: சூரியன் உதிப்பதிலிருந்து
  rationale: ‘கிழக்கிலிருந்து’ என்று சுருக்காமல் மூலத்தின் சூரிய உதயப் படிமத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: עַד מְבֹאוֹ
  choice: அது மறைவதுவரை
  rationale: ஆண்பால் ஒருமை பின்னொட்டு சூரியனைக் குறிப்பதைத் தெளிவாக்கி, உதயம்–மறைவு என்ற முழு பரப்பைக் குறிக்கும் இணையை இயல்பாக வழங்குகிறது.
theological_decisions:
- issue: אֵל אֱלֹהִים יְהוָה என்ற மூவகைத் தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: வல்லவர், கடவுள், யாவே
  alternative: ‘கடவுள், கடவுள், ஆண்டவர்’ அல்லது ‘தேவர்களின் கடவுளாகிய ஆண்டவர்’
  rationale: எபிரெயத்தில் மூன்று தெய்வீக அடையாளங்கள் வரிசையாக வருகின்றன. אֵל என்பதை ‘வல்லவர்’ எனத் தனியே மொழிபெயர்ப்பது அதன் சொற்பொருள் வலிமையையும் சொல்லாட்சிச் செறிவையும் காக்கிறது. אֵל אֱלֹהִים என்பதை உடைமைத் தொடராகக் கொண்டு ‘தேவர்களின் கடவுள்’ எனப் புரிந்துகொள்ள வாய்ப்பிருந்தாலும், இங்கு பெயர்களை அடுக்கிக் கூறுவதே இயல்பான வாசிப்பு.
translation_notes:
  register: நவீன செந்தமிழ் நடையில், பொதுவாசகர்களுக்குப் புரியும் மதிப்புமிக்க கவிதை மொழி பயன்படுத்தப்பட்டுள்ளது. ‘யாவே’ தனிப்பெயராக வைக்கப்பட்டுள்ளது; ‘சூரியன் உதிப்பதிலிருந்து அது மறைவதுவரை’ என்பது மூலப் படிமத்தையும் உலகளாவிய பரப்பையும் காக்கிறது.
