base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/023.yaml
  text: Whoever offers a sacrifice of thanksgiving honors me[c][b][a], and to the one who orders his way I will show the salvation of God.
translation:
  language: ta
  text: நன்றிப் பலியைச் செலுத்துகிறவன்[a] எனக்கு மகிமை அளிக்கிறான்; தன் வழியை ஒழுங்குபடுத்துகிறவனுக்கு[b] தேவனுடைய மீட்பைக்[c] காண்பிப்பேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நன்றிக் காணிக்கை.” எபிரெயச் சொல் பலியாக வெளிப்படுத்தப்படும் நன்றியுணர்வைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “தன் நடத்தையை ஒழுங்குபடுத்துகிறவனுக்கு” அல்லது “வழியை ஆயத்தப்படுத்துகிறவனுக்கு.” எபிரெயச் சொற்றொடர் சுருக்கமானது; ஒருவன் தன் வாழ்வைச் சரியாக ஒழுங்குபடுத்துவதைக் குறிக்கலாம்.
    reason: alternative_reading
  - marker: c
    text: அல்லது, “தேவனுடைய விடுதலையை” அல்லது “தேவனுடைய வெற்றியை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹבֵחַ תּוֹדָה
  choice: நன்றிப் பலியைச் செலுத்துகிறவன்
  rationale: זֹבֵחַ என்பது பெயர்ச்சொல் தன்மையில் வரும் வினையெச்சம்; תּוֹדָה இங்கு வெறும் வாய்மொழி நன்றியல்ல, பலியாக வெளிப்படும் நன்றியைக் குறிக்கிறது. ஆகவே பலிசார் பொருளையும் நன்றியுணர்வையும் இச்சொற்றொடர் காக்கிறது.
- source_word: יְכַבְּדָנְנִי
  choice: என்னைக் கனப்படுத்துகிறான்
  rationale: כבד என்பதன் பியேல் வடிவம் ‘கனப்படுத்துதல்/மதிப்பளித்தல்’ என்ற பொருளில் வருகிறது. ‘கனப்படுத்துகிறான்’ என்பது சங்கீத வழக்குக்கு ஏற்ற, தெளிவான தமிழ் வடிவம்.
- source_word: וְשָׂם דֶּרֶךְ
  choice: தன் வழியைச் சீராக அமைத்துக்கொள்கிறவனுக்கு
  rationale: எபிரெயச் சொற்றொடர் சுருக்கமானதும் ஓரளவு பலவாறு புரிந்துகொள்ளத்தக்கதுமாக உள்ளது. ‘வழி’ என்ற உருவகத்தைப் பேணியபடி, ஒருவன் தன் நடத்தையை ஒழுங்குபடுத்தும் முதன்மைப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: אַרְאֶנּוּ
  choice: காண்பிப்பேன்
  rationale: ראה என்பதன் ஹிஃபீல் வடிவம் ‘காணச் செய்தல், காண்பித்தல்’ என்று பொருள்படும்; மூன்றாம் நபர் ஒருமை பின்னொட்டு, வழியைச் சீரமைப்பவனையே சுட்டுகிறது.
- source_word: בְּיֵשַׁע אֱלֹהִים
  choice: தேவனுடைய மீட்பை
  rationale: יֵשַׁע என்பது மீட்பு, விடுதலை அல்லது வெற்றி எனப் பொருள்படலாம். இச்சங்கீதச் சூழலில் ‘மீட்பு’ இயல்பாகவும் அகன்ற பொருளுடனும் உள்ளது; אֱלֹהִים என்பதும் வெளிப்படையாகப் பேணப்பட்டுள்ளது.
theological_decisions:
- issue: וְשָׂם דֶּרֶךְ என்ற இரண்டாம் அரையடியின் பொருள்
  choice: தன் வாழ்வின் வழியைச் சீராக அமைத்துக்கொள்ளும் ஒருவருக்கான வாக்குறுதியாக மொழிபெயர்த்தல்
  alternative: ‘வழியை ஆயத்தப்படுத்துகிறவனுக்கு’ அல்லது ‘ஒரு வழியை அமைக்கிறவனுக்கு’
  rationale: எபிரெய மெய்யெழுத்துத் தொடர் ஒன்றுக்கு மேற்பட்ட இலக்கணப் புரிதல்களை அனுமதித்தாலும், தன் நடத்தையைச் சரியாக ஒழுங்குபடுத்துதல் என்பதே சூழலுக்கு ஏற்ற முதன்மைப் பொருள். இருப்பினும் மாற்றுப் புரிதல் அடிக்குறிப்பில் வெளிப்படையாக வைக்கப்பட்டுள்ளது.
- issue: בְּיֵשַׁע אֱלֹהִים என்பதில் தேவன் தம்மைப் பற்றி மூன்றாம் நபரில் கூறுதல்
  choice: ‘தேவனுடைய மீட்பு’ என்ற மூல வடிவத்தைப் பேணுதல்
  alternative: ‘என் மீட்பு’
  rationale: பேசுகிறவர் தேவன் என்றாலும், எபிரெயம் வெளிப்படையாக ‘தேவனுடைய மீட்பு’ என்கிறது. அதை ‘என் மீட்பு’ என மாற்றாமல் மூலத்தின் இறையியல் மற்றும் இலக்கியத் தன்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘வழி’ என்ற மூல உருவகம் பேணப்பட்டு, அதன் நடைமுறைப் பொருள் இயல்பான தமிழில் தெளிவாக்கப்பட்டுள்ளது; மூலத்தில் உள்ள மாற்றுப் பொருள் வாய்ப்புகள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
