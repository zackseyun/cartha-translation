source:
  edition: WLC
  text: לֹ֣א עַל זְ֭בָחֶי/ךָ אוֹכִיחֶ֑/ךָ וְ/עוֹלֹתֶ֖י/ךָ לְ/נֶגְדִּ֣/י תָמִֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/008.yaml
  text: I do not rebuke you for your sacrifices[a]; your burnt offerings are continually before me.
translation:
  language: ta
  text: உன் பலிகளுக்காக நான் உன்னைக் கண்டிக்கவில்லை[a]; உன் தகனபலிகள் எப்போதும் என் முன்னிலையில் இருக்கின்றன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் பலிகளைக் குறித்து நான் உன்னைக் கடிந்துகொள்ளவில்லை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא
  choice: இல்லை / -வில்லை
  rationale: எபிரெய எதிர்மறையை இயல்பான தமிழ் வினைமுற்றான ‘கண்டிக்கவில்லை’ என்பதில் வெளிப்படுத்துகிறது.
- source_word: עַל
  choice: -க்காக
  rationale: יכח என்ற வினையுடன், கண்டிப்புக்குரிய காரணம் அல்லது பொருளைக் குறிக்கிறது; ‘பலிகளுக்காக’ என்பது இயல்பான சுருக்கமான தமிழ்.
- source_word: זְבָחֶיךָ
  choice: உன் பலிகள்
  rationale: זֶבַח என்பது பொதுவாகப் பலியைக், பெரும்பாலும் மிருகப் பலியைக் குறிக்கும்; தேவையற்ற குறிப்பாக்கமின்றி பரந்த வழிபாட்டுப் பொருளைப் பேணுகிறது.
- source_word: אוֹכִיחֶךָ
  choice: நான் உன்னைக் கண்டிக்கவில்லை
  rationale: Hiphil வடிவிலுள்ள יכח இங்கே குற்றஞ்சாட்டுதல் என்ற குறுகிய நீதிமன்றப் பொருளைவிடக் கண்டித்தல் அல்லது கடிந்துகொள்ளுதலைக் குறிக்கிறது.
- source_word: וְעוֹלֹתֶיךָ
  choice: உன் தகனபலிகள்
  rationale: עוֹלָה முழுவதும் எரிக்கப்படும் பலிக்கான தொழில்நுட்பச் சொல்; ‘தகனபலி’ அதன் வழக்கமான, துல்லியமான தமிழ் இணை.
- source_word: לְנֶגְדִּי
  choice: என் முன்னிலையில்
  rationale: தேவனுடைய பார்வையிலும் சந்நிதியிலும் இருப்பதைச் சுட்டுகிறது; ‘என் முன்னிலையில்’ என்பது இயல்பாகவும் கண்ணியமாகவும் உள்ளது.
- source_word: תָמִיד
  choice: எப்போதும்
  rationale: தொடர்ச்சியான அல்லது வழக்கமான இருப்பைக் குறிக்கிறது; இச்சூழலில் ‘எப்போதும்’ தெளிவான நவீன தமிழை வழங்குகிறது.
theological_decisions:
- issue: இஸ்ரவேலின் பலிமுறையுடன் இவ்வசனத்துக்குள்ள தொடர்பு
  choice: பலிகள் இல்லாததால் தேவன் கண்டிக்கவில்லை என்பதே வசனத்தின் கருத்து; பலிகள் இயல்பிலேயே செல்லாதவை என்று அது கூறவில்லை.
  alternative: இவ்வசனம் பலியிடுதலை முற்றிலும் நிராகரிக்கிறது.
  rationale: இரண்டாம் அரையடி தகனபலிகள் எப்போதும் தேவனுடைய முன்னிலையில் இருப்பதாகக் கூறுகிறது. ஆகவே சிக்கல் சடங்கு இல்லாமை அல்ல; சுற்றியுள்ள வசனங்களில் விரிவாகக் கூறப்படும் ஆழமான வழிபாட்டு மனநிலையே சிக்கல்.
translation_notes:
  register: நவீன நிலையான, கண்ணியமான தமிழ். ‘தகனபலிகள்’ என்ற வேதாகம வழிபாட்டுச் சொல்லைத் துல்லியத்திற்காக வைத்துக்கொண்டு, மற்ற வாக்கிய அமைப்பு சாதாரண வாசகர்களுக்கு நேரடியாகப் புரியுமாறு அமைக்கப்பட்டுள்ளது.
