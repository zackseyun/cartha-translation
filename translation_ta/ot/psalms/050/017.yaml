translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் நேரடி குற்றச்சாட்டும் ‘பின்னால் எறிதல்’ என்ற வலுவான உருவகமும் காக்கப்பட்டுள்ளன.
