source:
  edition: WLC
  text: וְ֭/אַתָּה שָׂנֵ֣אתָ מוּסָ֑ר וַ/תַּשְׁלֵ֖ךְ דְּבָרַ֣/י אַחֲרֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/017.yaml
  text: For you hate discipline[b][a], and you cast my words behind you.
translation:
  language: ta
  text: நீயோ[a] திருத்தும் அறிவுரையை[b] வெறுக்கிறாய்; என் வார்த்தைகளை உன் பின்னால் எறிந்துவிடுகிறாய்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஏனெனில் நீ.’ எபிரெய இணைப்புச் சொல் இங்கு வேறுபாட்டையோ, முந்தைய கூற்றுக்கான விளக்கத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘திருத்தும் அறிவுரை’ என்பதற்கான எபிரெயச் சொல் ‘ஒழுக்கப் பயிற்சி,’ ‘திருத்துதல்,’ அல்லது ‘கண்டிப்பு’ என்றும் மொழிபெயர்க்கப்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: நீயோ
  rationale: இணைப்புச் சொல்லோடு வெளிப்படையாக வரும் இரண்டாம் நபர் சுட்டுப்பெயர் இங்கு முந்தைய வசனத்துடன் ஒரு வேறுபாட்டை வலியுறுத்துகிறது. ‘நீயோ’ என்பது அந்த வலியுறுத்தலையும் இயல்பான தமிழ் நடையையும் காக்கிறது; விளக்கத் தொடர்பாகவும் இதைப் புரிந்துகொள்ள முடியும் என்பதால் அடிக்குறிப்பு தரப்பட்டுள்ளது.
- source_word: שָׂנֵאתָ
  choice: வெறுக்கிறாய்
  rationale: இது Qal perfect, இரண்டாம் நபர் ஆண்பால் ஒருமை. சங்கீதத்தின் குற்றச்சாட்டில் தொடர்ச்சியான மனப்பான்மையைச் சுட்டுவதால் தமிழில் நிகழ்காலம் இயல்பாக உள்ளது.
- source_word: מוּסָר
  choice: திருத்தும் அறிவுரை
  rationale: இந்த எபிரெயச் சொல் வெறும் போதனையை மட்டுமல்ல, ஒருவரைத் திருத்தி ஒழுங்குபடுத்தும் அறிவுரையையும் குறிக்கிறது. ‘திருத்தும் அறிவுரை’ அதன் போதனை மற்றும் திருத்தம் ஆகிய இரு கூறுகளையும் தெளிவாகக் கொண்டுவருகிறது.
- source_word: וַתַּשְׁלֵךְ
  choice: எறிந்துவிடுகிறாய்
  rationale: ‘எறிதல்’ என்ற தெளிவான உருவகத்தைப் பாதுகாக்கிறது. ‘விடு’ துணைவினை திட்டமிட்ட புறக்கணிப்பின் உணர்வை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: דְּבָרַי
  choice: என் வார்த்தைகளை
  rationale: முதலாம் நபர் ஒருமை உடைமை விகுதியுடன் வரும் பன்மைச் சொல்லின் நேரடியான பொருளை விளக்க விரிவாக்கமின்றி காக்கிறது.
- source_word: אַחֲרֶיךָ
  choice: உன் பின்னால்
  rationale: ‘உனக்குப் பின்னால்’ என்ற மூல உருவகத்தை நேரடியாகப் பாதுகாத்து, தேவனுடைய வார்த்தைகளைப் பார்வைக்கு அப்பால் தள்ளிப் புறக்கணிப்பதை உணர்த்துகிறது.
