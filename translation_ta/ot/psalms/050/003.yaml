source:
  edition: WLC
  text: יָ֤בֹ֥א אֱלֹהֵ֗י/נוּ וְֽ/אַל יֶ֫חֱרַ֥שׁ אֵשׁ לְ/פָנָ֥י/ו תֹּאכֵ֑ל וּ֝/סְבִיבָ֗י/ו נִשְׂעֲרָ֥ה מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/003.yaml
  text: Our God comes and does not keep silent[a]; a fire devours before him[b], and around him it storms violently.
translation:
  language: ta
  text: நம் கடவுள் வருகிறார்; அவர் மௌனமாயிருக்கமாட்டார்[a]. அவருக்கு முன்பாக நெருப்பு விழுங்குகிறது; அவரைச் சுற்றி மிகக் கடுமையான புயல் கொந்தளிக்கிறது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நம் கடவுள் வருவார்; அவர் மௌனமாயிருக்கமாட்டார்.” இக்கவிதைச் சூழலில் எபிரேய imperfect வினை வடிவங்கள் எதிர்காலப் பொருளையும் கொள்ளலாம். אַל என்பதன் அடிப்படையில், “அவர் மௌனமாயிருக்க வேண்டாம்” என்றும் இலக்கணப்படி மொழிபெயர்க்கலாம்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “அவரைச் சுற்றி புயல் பெரிதும் கொந்தளிக்கிறது,” அல்லது “அவரைச் சுற்றி மிகுந்த புயல்தன்மை நிலவுகிறது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יָבֹא
  choice: வருகிறார்
  rationale: בוא என்பதன் Qal imperfect வடிவம் கவிதைச் சூழலில் நிகழ்கால அல்லது எதிர்கால வலிமையைக் கொள்ளலாம். ‘வருகிறார்’ என்பது கடவுளின் வெளிப்பாட்டை வாசகர்முன் நிகழ்வதுபோல் உயிரோட்டத்துடன் காட்டுகிறது; எதிர்கால வாசிப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: אֱלֹהֵינוּ
  choice: நம் கடவுள்
  rationale: முதல் நபர் பன்மை உடைமைப் பின்னொட்டுடன் உள்ள சொல்லை இயல்பான நவீன தமிழில் நேரடியாகத் தருகிறது.
- source_word: וְאַל יֶחֱרַשׁ
  choice: அவர் மவுனமாக இருப்பதில்லை
  rationale: חרשׁ இங்கு பேசாமல் அமைதியாக இருப்பதைக் குறிக்கிறது. אַל உடன் வரும் வடிவம் வேண்டுதல் அல்லது தடைநிலையாகப் புரிந்துகொள்ளப்படக்கூடியதாயினும், இக்கவிதைத் தொடரில் கடவுளின் வருகையுடன் சேர்ந்த உறுதியான கூற்றாக இயல்பாக வாசிக்கப்படுகிறது; அதன் மாற்றுச் சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: אֵשׁ
  choice: நெருப்பு
  rationale: தற்போதைய பொதுத்தமிழில் தெளிவாகவும் இயல்பாகவும் இருந்து, இறைத்தோற்றத்தின் தீவிரமான காட்சியையும் தக்கவைக்கிறது.
- source_word: לְפָנָיו
  choice: அவருக்கு முன்பாக
  rationale: இடத்தைக் குறிக்கும் எபிரேய சொற்றொடரின் உருவகத்தை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: תֹאכֵל
  choice: விழுங்குகிறது
  rationale: நெருப்பை எழுவாயாகக் கொண்ட אכל என்பது எரித்து அழித்தல் அல்லது முற்றிலும் உட்கொள்ளுதல் என்ற வலிமையைக் கொண்டது. ‘விழுங்குகிறது’ அதன் கவிதைத் தீவிரத்தைத் தக்கவைக்கிறது.
- source_word: וּסְבִיבָיו
  choice: அவரைச் சுற்றிலும்
  rationale: சுற்றியுள்ள முழுப் பரப்பையும் குறிக்கும் இடவியல் காட்சியைச் சுருக்கமாகவும் தெளிவாகவும் தருகிறது.
- source_word: נִשְׂעֲרָה
  choice: புயல் வீசுகிறது
  rationale: இந்த வினை புயல்போல் கொந்தளித்தல் அல்லது சுழன்றடித்தல் என்ற பொருளைக் கொண்டுள்ளது. தமிழில் வெளிப்படையான எழுவாய் தேவைப்படுவதால் ‘புயல்’ சேர்க்கப்பட்டு, இயல்பான வினைத் தொடராக வழங்கப்பட்டுள்ளது.
- source_word: מְאֹד
  choice: மிகக் கடுமையாக
  rationale: புயலின் அளவையும் வன்மையையும் தீவிரப்படுத்தும் எபிரேய வினையடையின் பொருளை இயல்பான தமிழில் எடுத்துரைக்கிறது.
theological_decisions:
- issue: நியாயத்தீர்ப்பில் கடவுள் வெளிப்படும் இறைத்தோற்றக் காட்சி
  choice: கடவுள் வருதல், மவுனமாக இராதிருத்தல், நெருப்பு, புயல் ஆகியவற்றை உரையில் உள்ளபடியே நேரடியாகப் பாதுகாத்தல்
  alternative: இதை இறுதி நியாயத்தீர்ப்பையோ குறிப்பிட்ட கிறிஸ்தவ விளக்கத்தையோ வெளிப்படையாக முன்னறிவிப்பதாக விரிவாக்குதல்
  rationale: எபிரேய உரை கடவுளின் வல்லமையான வருகையைச் சித்தரிக்கிறது; ஆனால் பின்னாளைய கிறிஸ்துவியல் அல்லது சமயப்பிரிவு சார்ந்த அடையாளத்தை இவ்வசனத்திலேயே குறிப்பிடவில்லை. ஆகவே மொழிபெயர்ப்பு காட்சியின் இறையியல் வலிமையைப் பாதுகாத்து, உரையில் இல்லாத விளக்கத்தைச் சேர்க்கவில்லை.
- issue: וְאַל יֶחֱרַשׁ என்பதிலுள்ள கூற்று மற்றும் வேண்டுதல் சார்ந்த இலக்கணப் பதற்றம்
  choice: முதன்மை உரையில் ‘அவர் மவுனமாக இருப்பதில்லை’ என்ற உறுதியான கூற்று
  alternative: ‘அவர் மவுனமாக இருக்காதிருப்பாராக’ என்ற வேண்டுதல் அல்லது ‘அவர் மவுனமாக இருக்கமாட்டார்’ என்ற எதிர்கால வாசிப்பு
  rationale: சங்கீதத்தின் இறைத்தோற்றச் சூழல் இதை கடவுளின் வருகையைக் குறித்த உறுதியான கவிதைக் கூற்றாக வாசிக்க ஆதரிக்கிறது. இருப்பினும் אַל மற்றும் imperfect வடிவங்களின் சாத்தியங்களை அடிக்குறிப்பில் வெளிப்படையாக வைத்திருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையில் ‘கடவுள்,’ ‘நெருப்பு,’ ‘புயல்’ போன்ற வழக்கிலுள்ள மரியாதையான சொற்கள் பயன்படுத்தப்பட்டுள்ளன. கவிதைத் தீவிரத்திற்காக ‘விழுங்குகிறது’ தக்கவைக்கப்பட்டுள்ளது. வாக்கியம் நிகழ்காலக் காட்சியாக உயிரோட்டத்துடன் அமைக்கப்பட்டாலும், எபிரேயத்தின் எதிர்கால மற்றும் வேண்டுதல் சாத்தியங்கள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.
