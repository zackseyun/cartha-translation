  revised_text: இவற்றை நீ செய்தாய்; நானோ மௌனமாக இருந்தேன். நான் உன்னைப் போலவே இருக்கிறேன் என்று நீ நினைத்தாய்.[a] நான் உன்னைக் கண்டிப்பேன்; உன் கண்முன் ஒழுங்காக முன்வைப்பேன்.[b]
