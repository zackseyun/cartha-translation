- from: இவற்றை நீ செய்தாய்; நானோ மௌனமாக இருந்தேன். நான் உன்னைப் போலவே இருப்பவன் என்று நீ நினைத்தாய்.[a] ஆனால் நான் உன்னைக் கண்டித்து, உன் கண்முன் வரிசையாக எடுத்துவைப்பேன்.[b]
  to: இவற்றை நீ செய்தாய்; நானோ மௌனமாக இருந்தேன். நான் உன்னைப் போலவே இருக்கிறேன் என்று நீ நினைத்தாய்.[a] நான் உன்னைக் கண்டிப்பேன்; உன் கண்முன் ஒழுங்காக முன்வைப்பேன்.[b]
  rationale: திருத்தம் மொழிபெயர்ப்பின் பொருளை மாற்றவில்லை. தவறான அனுமானத்தை வெளிப்படுத்தும் தமிழ்த் தொடரை இயல்பாக்கி, மூலத்தில் வெளிப்படையாக இல்லாத எதிர்மறை இணைப்பை நீக்கி, இறுதி வினைத்தொடரை நவீன நிலையான தமிழில் தெளிவாக்குகிறது. எதை ஒழுங்காக முன்வைப்பார் என்ற குறிப்பிடப்படாத பொருள் முதன்மை உரையிலும் அடிக்குறிப்பிலும் திறந்த நிலையில் பாதுகாக்கப்படுகிறது.
