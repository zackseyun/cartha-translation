  source_fidelity: 'முதன்மை உரை எபிரெய வாக்கியத்தின் வரிசையையும் முக்கியப் பொருளையும் நன்றாகப் பின்பற்றுகிறது: முந்தைய செயல்கள், இறைவனின் மௌனம், தவறான அனுமானம், வரவிருக்கும் கண்டிப்பு, கண்முன்னான ஒழுங்கான முன்வைப்பு ஆகியவை காக்கப்பட்டுள்ளன. ஆனால் “நான் உன்னைப் போலவே இருப்பவன்” என்பது இவ்விடத்து இயல்பற்ற பெயரெச்சத் தொடராக உள்ளது; הֱיוֹת אֶהְיֶה כָמוֹךָ என்பதன் தவறான அனுமானத்தைத் தமிழில் நேரடியான வினைத் தொடரால் கூறுவது சிறந்தது.'
  naturalness: “நானோ மௌனமாக இருந்தேன்,” “உன்னைக் கண்டிப்பேன்,” “உன் கண்முன்” ஆகியவை நவீன நிலையான தமிழில் இயல்பாகவும் பொருத்தமான கண்ணியமான நடையிலும் உள்ளன. “வரிசையாக எடுத்துவைப்பேன்” புரியத்தக்கது; எனினும் “ஒழுங்காக முன்வைப்பேன்” இச்சூழலில் தெளிவாகவும் இயல்பாகவும் உள்ளது. எபிரெயத்தில் உள்ள எளிய இணைப்பைத் தேவையற்ற எதிர்மறைத் தொடர்பாக்கும் “ஆனால்” நீக்கப்படுகிறது.
  terminology: “மௌனமாக இருந்தேன்” חרשׁ-இன் நேரடிப் பொருளைத் தக்கவைக்கிறது; “கண்டிப்பேன்” יכח-இன் அறநெறி/நீதித்துறைத் தொனிக்கு ஏற்றது. ערך-க்கான “ஒழுங்காக முன்வைப்பேன்” அதன் ‘வரிசைப்படுத்தி/அடுக்கி வைப்பது’ என்ற பொருளையும், குறிப்பிடப்படாத பொருளை நிரப்பாமல் விடும் மூலத்தின் திறந்த தன்மையையும் காக்கிறது. அடிக்குறிப்பு அடையாளங்கள் சரியான சொற்றொடர்களில் உள்ளன.
