  text: אֵ֤לֶּה עָשִׂ֨יתָ וְֽ/הֶחֱרַ֗שְׁתִּי דִּמִּ֗יתָ הֱֽיוֹת אֶֽהְיֶ֥ה כָמ֑וֹ/ךָ אוֹכִיחֲ/ךָ֖ וְ/אֶֽעֶרְכָ֣ה לְ/עֵינֶֽי/ךָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/021.yaml
  text: You did these things[a], and I kept silent; you thought that I was altogether like you[b]. I will rebuke you and set the case before your eyes.
translation:
  language: ta
  text: இவற்றை நீ செய்தாய்; நானோ மௌனமாக இருந்தேன். நான் உன்னைப் போலவே இருக்கிறேன் என்று நீ நினைத்தாய்.[a] நான் உன்னைக் கண்டிப்பேன்; உன் கண்முன் ஒழுங்காக முன்வைப்பேன்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் உன்னைப் போல இருப்பேன் என்று நீ நினைத்தாய்.” எபிரெயக் கட்டமைப்பை நிகழ்நிலை அல்லது எதிர்கால நோக்குடன் தமிழில் வெளிப்படுத்தலாம்.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, “உன் கண்முன் ஒழுங்காக முன்வைப்பேன்.” எபிரெய வினை ‘வரிசைப்படுத்து, ஒழுங்காக வை’ என்று பொருள்படும்; எதை முன்வைப்பார் என்பது மூலத்தில் வெளிப்படையாகக் கூறப்படவில்லை. சூழலில் அது குற்றச்சாட்டுகளையோ செயல்களையோ குறிக்கலாம்.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: אֵלֶּה עָשִׂיתָ
  choice: இவற்றை நீ செய்தாய்
  rationale: பன்மைச் சுட்டுப்பெயர் முந்தைய வசனங்களில் கூறப்பட்ட குற்றச்செயல்களைத் திரும்பச் சுட்டுகிறது; வினையின் நிறைநிலை கடந்த செயலைக் குறிக்கிறது.
- source_word: וְהֶחֱרַשְׁתִּי
  choice: நானோ மௌனமாக இருந்தேன்
  rationale: இறைவன் உடனடியாகப் பதிலளிக்காமல் இருந்ததை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது. ‘நானோ’ என்பது குற்றவாளியின் செயலுக்கும் இறைவனின் மௌனத்துக்கும் இடையிலான முரணை வெளிப்படுத்துகிறது.
- source_word: דִּמִּיתָ
  choice: நீ நினைத்தாய்
  rationale: இங்கு דמה என்பது தவறான மனக்கணிப்பு அல்லது அனுமானத்தைக் குறிக்கிறது; ‘நினைத்தாய்’ தெளிவான, இயல்பான தமிழ்.
- source_word: הֱיוֹת אֶהְיֶה כָמוֹךָ
  choice: நான் உன்னைப் போலவே இருப்பவன் என்று
  rationale: எபிரெயக் கட்டமைப்பு இறைவனின் இயல்பு குறித்த குற்றவாளியின் தவறான எண்ணத்தை வலியுறுத்துகிறது. ‘போலவே’ ஒப்புமையின் வலிமையைத் தக்கவைக்கிறது; காலநிலை சார்ந்த மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אוֹכִיחֲךָ
  choice: நான் உன்னைக் கண்டித்து
  rationale: יכח என்பதன் இச்சூழலிலான அறநெறி மற்றும் நீதித்துறை சார்ந்த எதிர்கொள்ளுதலை ‘கண்டித்து’ இயல்பாக வெளிப்படுத்துகிறது; ‘குற்றவாளி என்று தீர்ப்பேன்’ என்பது அளவுக்கு மீறிய விளக்கமாகிவிடும்.
- source_word: וְאֶעֶרְכָה
  choice: வரிசையாக எடுத்துவைப்பேன்
  rationale: ערך என்பதன் அடிப்படைப் பொருளான ‘ஒழுங்குபடுத்து/வரிசைப்படுத்து’ என்பதைத் தக்கவைக்கிறது. எதை எடுத்துவைப்பார் என்பது எபிரெயத்தில் வெளிப்படையாகக் கூறப்படாததால் தமிழிலும் பொருள் நிரப்பப்படவில்லை.
- source_word: לְעֵינֶיךָ
  choice: உன் கண்முன்
  rationale: ஒருவருக்கு வெளிப்படையாகவும் மறுக்க முடியாத வகையிலும் முன்வைப்பதைக் குறிக்கும் எபிரெய மரபுத்தொடருக்கான இயல்பான தமிழ் இணை.
theological_decisions:
- issue: இறைவனின் மௌனமும் அதைத் தொடர்ந்து வரும் கண்டிப்பும்
  choice: மௌனம் ஒப்புதல் என்று கூறாமல், அதற்குப் பின் கண்டிப்பு வருவதை உரை நேரடியாகக் காட்டுகிறது.
  alternative: ‘மௌனமாக இருந்தேன்’ என்பதை ‘பொறுமையாக இருந்தேன்’ என விளக்கலாம்.
  rationale: ‘பொறுமை’ என்பது சூழலில் சாத்தியமான கருத்தாக இருந்தாலும், மூலச்சொல் நேரடியாக ‘மௌனமாக இருத்தல்’ என்பதையே கூறுகிறது; ஆகவே அந்த இறையியல் விளக்கம் உரைக்குள் சேர்க்கப்படவில்லை.
- issue: இறைவன் மனிதனைப் போன்றவர் என்ற தவறான அனுமானம்
  choice: ‘நான் உன்னைப் போலவே இருப்பவன்’ என்று மொழிபெயர்த்து, ஒழுக்கரீதியான ஒப்புமை குறித்த தவறான எண்ணத்தைத் திறந்த நிலையில் வைத்திருக்கிறது.
  alternative: ‘நான் முற்றிலும் உன்னைப் போன்றவன்’ என்று மொழிபெயர்க்கலாம்.
  rationale: எபிரெயத்தில் ‘முற்றிலும்’ என்பதற்கான தனிச்சொல் இல்லை. வலியுறுத்தலை ‘போலவே’ தெரிவிக்கிறது; ஆனால் மூலத்தைவிடக் கடுமையான முழுமைச் சொல்லைச் சேர்ப்பதில்லை.
- issue: இறைவன் முன்வைப்பதன் நீதித்துறை நயம்
  choice: ‘வரிசையாக எடுத்துவைப்பேன்’ என்று மூல உருவகத்தைத் தக்கவைக்கிறது.
  alternative: ‘உனக்கு எதிரான வழக்கை உன் கண்முன் வைப்பேன்’ என்று நீதித்துறைப் பொருளை வெளிப்படையாக்கலாம்.
  rationale: சூழலில் குற்றச்சாட்டு அல்லது வழக்குத் தொனி இருந்தாலும், எபிரெய வினையின் பொருள் வெளிப்படையாகக் குறிப்பிடப்படவில்லை. எனவே குறிப்பிட்ட ‘வழக்கு’ என்பதை முதன்மை உரையில் சேர்க்காமல் உண்மையான இடைவெளி பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘மௌனம்’, ‘கண்டித்து’, ‘கண்முன்’ போன்ற சொற்கள் சங்கீதத்தின் நீதித்தீர்ப்புத் தொனியைத் தக்கவைக்கின்றன; அதேவேளை மிகப் பழமையான அல்லது சமயப்பிரிவு சார்ந்த சொற்கள் தவிர்க்கப்பட்டுள்ளன.
