base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/000.yaml
  text: A psalm of Asaph. God[a], God, Yahweh, has spoken and called the earth from the rising of the sun to its setting.
translation:
  language: ta
  text: ஆசாபின் ஒரு சங்கீதம். வல்லமையுள்ளவர், கடவுள், யெகோவா பேசினார்; சூரியன் உதிக்கும் திசை முதல் அது மறையும் திசைவரை பூமியை அழைத்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִזְמוֹר לְאָסָף
  choice: ஆசாபின் சங்கீதம்
  rationale: לְ குறிக்கும் ஆசிரியத்துவம் அல்லது தொடர்பை இயல்பான தமிழில் உரிமைத் தொடரால் வழங்குகிறது; மூலத்தின் சுருக்கத்தையும் காக்கிறது.
- source_word: אֵל אֱלֹהִים יְהוָה
  choice: கடவுள், கடவுளாகிய யெகோவா
  rationale: மூன்று தெய்வீகப் பெயர்களின் அசாதாரண அமைப்பை முற்றிலும் ஒரே விளக்கமாகச் சீராக்காமல், தமிழில் வாசிக்கத்தக்க வகையில் வழங்குகிறது; மாற்றுப் புரிதல்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: דִּבֶּר וַיִּקְרָא אָרֶץ
  choice: பேசியிருக்கிறார்; ... பூமியை அழைத்திருக்கிறார்
  rationale: இரு வினைகளையும் தனித்தனியாகக் காத்து, அழைப்பின் பெறுபொருளாக பூமியைத் தெளிவாகக் காட்டுகிறது.
- source_word: מִמִּזְרַח שֶׁמֶשׁ עַד מְבֹאוֹ
  choice: சூரியன் உதிக்கும் இடமுதல் அது மறையும் இடம்வரை
  rationale: சூரியோதயம் முதல் அஸ்தமனம் வரை என்ற உலகளாவிய பரப்பை நவீன இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: אֵל אֱלֹהִים יְהוָה என்ற தெய்வீகப் பெயர்த் தொடரின் தொடரியல்
  choice: கடவுள், கடவுளாகிய யெகோவா
  alternative: கடவுள், கடவுள், யெகோவா; அல்லது தேவர்களின் கடவுளாகிய யெகோவா
  rationale: எபிரெயத் தொடர் பலவாறு பகுக்கப்படலாம். முதன்மை உரை பெயர்களின் வலியுறுத்தலைக் காத்தபடியே தமிழில் ஓரளவு இயல்பாக்குகிறது; சாத்தியமான வேறு பகுப்புகளை அடிக்குறிப்பு மறைக்காமல் பதிவு செய்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, பொதுவாசகருக்கு எளிதில் புரியும் நடை. ‘யெகோவா’ என்பது יהוה என்ற தனிப்பெயரின் ஒலிபெயர்ப்பு. மூலத்தின் அசாதாரண தெய்வீகப் பெயர்த் தொடரிலுள்ள தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
