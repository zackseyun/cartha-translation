lexical_decisions:
- source_word: שִׁמְעָה
  choice: கேள்
  rationale: שׁמע என்பதன் ஒருமை ஏவல் வடிவம்; கவனமாகக் கேட்கும்படி விடுக்கும் உடன்படிக்கை மற்றும் நீதித்துறை சார்ந்த அழைப்பின் தொனியை ‘கேள்’ காக்கிறது.
- source_word: עַמִּי
  choice: என் மக்களே
  rationale: முதலாம் நபர் ஒருமை உரிமை விகுதியுடன் வரும் உடன்படிக்கை உறவைக் குறிக்கும் அழைப்பை இயல்பான தமிழ் விளிவடிவில் தருகிறது.
- source_word: וַאֲדַבֵּרָה
  choice: நான் பேசுவேன்
  rationale: ஏவலுக்குப் பின்வரும் முதலாம் நபர் cohortative வடிவத்தின் உறுதியான நோக்கத்தையும் தொடர்ச்சியையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: יִשְׂרָאֵל
  choice: இஸ்ரவேலே
  rationale: பெயரை ஒலிபெயர்த்து, நேரடி அழைப்பை விளிவிகுதி மூலம் வெளிப்படுத்துகிறது.
- source_word: וְאָעִידָה בָּךְ
  choice: உனக்கு எதிராகச் சாட்சியளிப்பேன்
  rationale: עוד என்பதன் Hiphil வடிவத்திலுள்ள சட்டரீதியான சாட்சி கூறும் பொருளையும், בְּ உடன் வரும் எதிர்நிலைப் பொருளையும் காக்கிறது; ‘எச்சரிப்பேன்’ என்பது நீதிமன்றத் தொனியை இழக்கும்.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: வடிவில் பன்மையாக இருந்தாலும் இங்கு பேசுபவரைக் குறிக்கும் ஒருமைப் பொருளில் உள்ளது.
- source_word: אֱלֹהֶיךָ
  choice: உன் கடவுள்
  rationale: இரண்டாம் நபர் ஆண்பால் ஒருமை உரிமை விகுதியையும் உடன்படிக்கை உறவின் தனிப்பட்ட உரிமைக் கூற்றையும் காக்கிறது.
- source_word: אָנֹכִי
  choice: நானே
  rationale: தனி இடப்பெயர் தரும் வலியுறுத்தலைத் தமிழில் ‘-ஏ’ விகுதி இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: אֱלֹהִים אֱלֹהֶיךָ אָנֹכִי என்ற இறைத் தன்னடையாளக் கூற்றை மொழிபெயர்த்தல்
  choice: நானே கடவுள், உன் கடவுள்
  alternative: கடவுள், உன் கடவுள், நானே
  rationale: எபிரெயத்தில் வினையில்லாமல் வலியுறுத்தப்படும் அடையாளக் கூற்றைத் தெளிவான நவீன தமிழில் தருகிறது. ‘நானே’ என்பது வலியுறுத்தலைக் காக்கிறது; ‘உன் கடவுள்’ என்பது உடன்படிக்கை உறவை எந்தக் கூடுதல் கோட்பாட்டு விளக்கமும் இன்றி வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘என் மக்களே’ என்பதற்குப் பின் வரும் எபிரெய ஒருமை ஏவலையும், ‘இஸ்ரவேலே… உனக்கு’ என்ற கூட்டுத்தொகுதி ஒருமையையும் காக்க ‘கேள்’ மற்றும் ‘உனக்கு’ பயன்படுத்தப்பட்டன. வாக்கியப் பிரிப்பு எபிரெய இணைநிலைகளைத் தெளிவாக வாசிக்க உதவுகிறது.
