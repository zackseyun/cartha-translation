  source_fidelity: வַיַּגִּידוּ என்பதன் பொதுவான அறிவிப்பு/பிரகடனப் பொருளை ‘அறிவிக்கின்றன’ துல்லியமாகக் காட்டுகிறது. שָׁמַיִם என்பதன் கவிதைமிக்க பன்மை ‘வானங்கள்’ எனக் காக்கப்பட்டுள்ளது. צִדְקוֹ-வுக்கு ‘அவருடைய நீதி’ பொருத்தமானது; நீதித்தீர்ப்பு உடன்சூழலிலுள்ள ‘justice’ என்ற சாத்தியமும் அடிக்குறிப்பில் வழங்கப்பட்டுள்ளது. כִּי-யின் காரணத் தொடர்பு, אֱלֹהִים-இன் ஒருமைச் சுட்டல், שֹׁפֵט הוּא-வின் பெயர்நிலை மற்றும் வலியுறுத்தல் ஆகியவை ‘ஏனெனில் கடவுளே நீதிபதி’ என்பதில் நன்றாகப் பிரதிபலிக்கின்றன. ‘சேலா’ மொழிபெயர்க்கப்படாமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
