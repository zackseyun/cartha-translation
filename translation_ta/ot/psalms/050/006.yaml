lexical_decisions:
- source_word: וַיַּגִּידוּ
  choice: அறிவிக்கின்றன
  rationale: நגד என்பதன் ஹிஃபில் வடிவம் ஒன்றைப் பொதுவாகத் தெரிவிக்கும் அல்லது பிரகடனப்படுத்தும் பொருளைத் தருகிறது. கவிதை நடையிலும் நவீனத் தமிழிலும் இயல்பாக இருப்பதால் ‘அறிவிக்கின்றன’ என மொழிபெயர்க்கப்பட்டது.
- source_word: שָׁמַיִם
  choice: வானங்கள்
  rationale: எபிரெயப் பன்மை வடிவத்தையும் சங்கீதத்தின் கவிதை உயர்வையும் காக்க ‘வானங்கள்’ என வழங்கப்பட்டது.
- source_word: צִדְקוֹ
  choice: அவருடைய நீதி
  rationale: צדק என்பது நேர்மை, நீதி, நியாயம் ஆகிய ஒன்றோடொன்று தொடர்புடைய பொருள்களைக் கொண்டது. கடவுளின் ஒழுக்க நேர்மையையும் நியாயத் தீர்ப்பையும் உள்ளடக்கக்கூடிய ‘நீதி’ முதன்மை மொழிபெயர்ப்பாகத் தேர்ந்தெடுக்கப்பட்டது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தை அறிமுகப்படுத்தும் சொல்லாக இங்கு செயல்படுவதால் causal force தெளிவாகக் காக்கப்பட்டது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: வினையெச்சமும் சுட்டுப்பெயரும் ஒருமைப் பொருளைத் தெளிவுபடுத்துகின்றன; நவீன பொதுத் தமிழில் இயல்பான ஒருமைச் சொல் பயன்படுத்தப்பட்டது.
- source_word: שֹׁפֵט
  choice: நீதிபதி
  rationale: இங்குள்ள பங்கேற்புவினை பெயர்ப் பயனிலையில் வந்து நீதித்தீர்ப்பு வழங்குபவரைக் குறிக்கிறது; ‘நீதிபதி’ அதன் பெயர்ச்சொல் வலிமையை நேரடியாகக் காக்கிறது.
- source_word: הוּא
  choice: கடவுளே
  rationale: தனித்து வரும் எபிரெயச் சுட்டுப்பெயரின் வலியுறுத்தல் தமிழின் ஏகார வலியுறுத்தலால் இயல்பாக வெளிப்படுத்தப்பட்டது.
- source_word: סֶלָה
  choice: சேலா
  rationale: இச்சொல்லின் துல்லியமான வழிபாட்டு அல்லது இசைப் பணி உறுதியல்ல; ஆகவே பொருளை ஊகிக்காமல் ஒலிபெயர்க்கப்பட்டது.
theological_decisions:
- issue: தெய்வீகத் தீர்ப்புடன் தொடர்புடைய צדק என்பதன் மொழிபெயர்ப்பு
  choice: அவருடைய நீதி
  alternative: அவருடைய நியாயம்
  rationale: ‘நீதி’ என்பது கடவுளின் ஒழுக்க நேர்மையையும் அவர் வழங்கும் நியாயத் தீர்ப்பையும் உள்ளடக்குகிறது. இருப்பினும் நீதித்தீர்ப்பு என்ற உடனடிச் சூழலால் ‘நியாயம்’ என்பதும் சாத்தியமான வாசிப்பாக அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத் தமிழில் இயல்பாகவும், சங்கீதக் கவிதைக்கு ஏற்ற கண்ணியமான சுருக்கத்துடனும் அமைக்கப்பட்டது. எபிரெய மூலத்தின் வானங்கள் என்ற பன்மை, கடவுளை வலியுறுத்தும் הוּא, மற்றும் விளக்கமின்றி விடப்பட்ட சேலா ஆகியவை காக்கப்பட்டுள்ளன.
