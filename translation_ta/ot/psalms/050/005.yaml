  text: אִסְפוּ לִ֥/י חֲסִידָ֑/י כֹּרְתֵ֖י בְרִיתִ֣/י עֲלֵי זָֽבַח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/005.yaml
  text: Gather to me my faithful ones[a], those who make my covenant by sacrifice.
translation:
  language: ta
  text: “பலியை முன்னிட்டு என் உடன்படிக்கையை ஏற்படுத்தியவர்களான என் உண்மையுள்ளவர்களை[a] என்னிடம் ஒன்றுகூட்டுங்கள்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில் சொற்படி: “பலியின்மேல் (அல்லது பலியின்மீது) என் உடன்படிக்கையை வெட்டுகிறவர்கள்.” ‘உடன்படிக்கையை வெட்டுதல்’ என்பது உடன்படிக்கை ஏற்படுத்துவதைக் குறிக்கும் எபிரெய மரபுத்தொடர்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִסְפוּ
  choice: ஒன்றுகூட்டுங்கள்
  rationale: Qal கட்டளைப் பன்மையின் வலிமையைப் பேணுகிறது; மனிதர்களை ஓரிடத்தில் திரட்டும் அழைப்பை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: לִי
  choice: என்னிடம்
  rationale: לְ + முதலாம் நபர் ஒருமை பின்னொட்டு இங்கு தேவனுடைய முன்னிலைக்குக் கூட்டிவருதலைக் குறிக்கிறது; ‘எனக்காக’ என்பதைக் காட்டிலும் ‘என்னிடம்’ சூழலுக்கு ஏற்றது.
- source_word: חֲסִידָי
  choice: என் உண்மையுள்ளவர்கள்
  rationale: חסיד என்பதில் உடன்படிக்கை சார்ந்த பற்றுறுதியும் பக்தியும் அடங்கும். ‘பரிசுத்தவான்கள்’ பின்னாளைய தொழில்நுட்பப் பொருளைத் தூண்டக்கூடும்; ‘உண்மையுள்ளவர்கள்’ உறவுசார் விசுவாசத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כֹּרְתֵי
  choice: ஏற்படுத்துகிற
  rationale: כרת + ברית என்பதன் சொற்படி பொருள் ‘உடன்படிக்கையை வெட்டுதல்’; தமிழில் ‘உடன்படிக்கையை ஏற்படுத்துதல்’ தெளிவான இயல்பான இணைச்சொல். சொற்படியான உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: בְרִיתִי
  choice: என் உடன்படிக்கையை
  rationale: ברית என்ற சொல்லின் உறவுசார், கடப்பாடுசார் பொருளை ‘உடன்படிக்கை’ துல்லியமாகத் தக்கவைக்கிறது.
- source_word: עֲלֵי זָבַח
  choice: பலியின்மேல்
  rationale: עֲלֵי என்பதன் ‘மேல்/மீது’ என்ற வடிவத்தைப் பேணி, பலியோடு தொடர்புடைய உடன்படிக்கைச் சடங்கின் உருவகத்தையும் மூலத்தின் பொருள் நெகிழ்வையும் மறைக்காமல் வைக்கிறது.
theological_decisions:
- issue: உடன்படிக்கைச் சூழலில் חֲסִידָי என்பதன் பொருள்
  choice: என் உண்மையுள்ளவர்கள்
  alternative: என் பரிசுத்தவான்கள் / என் பக்தர்கள்
  rationale: இச்சொல் தேவனிடம் உடன்படிக்கைப் பற்றுறுதி கொண்டவர்களைக் குறிக்கிறது. தேர்ந்த மொழிபெயர்ப்பு பின்னாளைய திருச்சபைத் தொழில்நுட்பப் பொருளை இறக்குமதி செய்யாமல் அந்த உறவுசார் உண்மையைப் பேணுகிறது.
- issue: ‘உடன்படிக்கையை வெட்டுதல்’ என்ற எபிரெய மரபுத்தொடர்
  choice: முதன்மை உரையில் ‘உடன்படிக்கையை ஏற்படுத்துகிற’; அடிக்குறிப்பில் சொற்படி வடிவம்
  alternative: உடன்படிக்கையை வெட்டுகிற
  rationale: தமிழில் புரியும் இயல்பான முதன்மை உரையை வழங்குகிறது; அதே நேரத்தில் மூலமொழியின் பலிசார் உருவகத்தை அடிக்குறிப்பு மூலம் வெளிப்படையாகப் பாதுகாக்கிறது.
- issue: עֲלֵי זָבַח என்பதில் பலிக்கும் உடன்படிக்கைக்கும் உள்ள தொடர்பு
  choice: பலியின்மேல்
  alternative: பலியால் / பலியோடு
  rationale: ‘பலியால்’ என்பது கருவிப்பொருளைத் தெளிவாகத் தீர்மானித்துவிடும். ‘பலியின்மேல்’ என்பது எபிரெய முன்னிடைச்சொல்லின் வெளிப்பாட்டையும் சடங்குசார் தொடர்பிலுள்ள உண்மையான பொருள் நெகிழ்வையும் பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; வழிபாட்டு உரைக்கேற்ற கண்ணியத்துடன், பொதுவாசகர்களுக்குப் புரியும் சொற்கள் பயன்படுத்தப்பட்டுள்ளன. கட்டளையின் பன்மைத் தன்மையும் உடன்படிக்கை–பலி தொடர்பின் மூலமொழி நெகிழ்வும் பாதுகாக்கப்பட்டுள்ளன.
