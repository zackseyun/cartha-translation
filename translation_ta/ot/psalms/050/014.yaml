lexical_decisions:
- source_word: זְבַח
  choice: பலியைச் செலுத்து
  rationale: זבח என்பது பலியிடும்படி கட்டளையிடும் வினை. தமிழில் வழிபாட்டுச் சூழலைத் தெளிவாகவும் இயல்பாகவும் காட்ட ‘பலியைச் செலுத்து’ என மொழிபெயர்க்கப்பட்டது.
- source_word: לֵאלֹהִים
  choice: கடவுளுக்கு
  rationale: לְ முன்னிடைச்சொல் இங்கு பலியைப் பெறுபவரைக் குறிக்கிறது; ஆகவே இயல்பான தமிழில் ‘கடவுளுக்கு’ என வழங்கப்பட்டது.
- source_word: תּוֹדָה
  choice: நன்றிப் பலி
  rationale: תּוֹדָה என்பது ‘நன்றி செலுத்துதல்’ என்பதையும் பலிச் சூழலில் ‘நன்றிப் பலி’ என்பதையும் குறிக்கலாம். ‘நன்றிப் பலி’ என்பது நன்றியுணர்வையும் பலி சார்ந்த பொருளையும் ஒருங்கே காக்கிறது; மாற்றுப் புரிதல் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: וְשַׁלֵּם
  choice: நிறைவேற்று
  rationale: שלם இங்கு செய்த நேர்த்திக்கடன்களைச் செலுத்துதல் அல்லது நிறைவேற்றுதல் என்று பொருள்படும். ‘நிறைவேற்று’ என்பது தமிழில் நேர்த்திக்கடனுடன் இயல்பாக இணைந்து அதன் கடமைத் தன்மையைத் தெரிவிக்கிறது.
- source_word: לְעֶלְיוֹן
  choice: உன்னதமானவருக்கு
  rationale: עֶלְיוֹן என்பது கடவுளுக்குரிய ‘மிக உயர்ந்தவர்’ என்ற பட்டம். பெயராக ஒலிபெயர்க்காமல், பொருளைத் தெளிவாகத் தெரிவிக்கும் ‘உன்னதமானவர்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: נְדָרֶיךָ
  choice: உன் நேர்த்திக்கடன்களை
  rationale: இது இரண்டாம் நபர் ஆண்பால் ஒருமை உடைமை விகுதியுடன் வரும் பன்மைச் சொல். ‘உன் நேர்த்திக்கடன்களை’ என்பது தனிப்பட்ட முறையில் ஏற்றுக்கொண்ட நேர்த்திகளையும் அவற்றை நிறைவேற்ற வேண்டிய கடமையையும் இயல்பான தமிழில் காட்டுகிறது.
theological_decisions:
- issue: זבח மற்றும் תודה இணையும் பலிசார் சொற்றொடர்
  choice: ‘நன்றிப் பலி’ என்று மொழிபெயர்த்தல்
  alternative: ‘நன்றியையே பலியாக’ அல்லது குறிப்பிட்ட சடங்குசார் ‘நன்றிப் படையல்’ என்று புரிந்துகொள்ளுதல்
  rationale: எபிரெயச் சொற்றொடர் நன்றியைப் பலியாகச் செலுத்துவதையோ நன்றிக்கான ஒரு பலியையோ குறிக்கக்கூடும். முதன்மை மொழிபெயர்ப்பு பலிச் சூழலையும் நன்றியுணர்வையும் காக்கிறது; மூலத்திலுள்ள பொருள் நெகிழ்வை அடிக்குறிப்பு வெளிப்படுத்துகிறது.
- issue: עֶלְיוֹן என்ற இறைப் பட்டம்
  choice: ‘உன்னதமானவர்’ என்று பொருள்பெயர்த்தல்
  alternative: ‘எலியோன்’ என்று ஒலிபெயர்த்தல்
  rationale: இது கடவுளின் உயர்ந்த நிலையைக் குறிக்கும் பட்டம் என்பதால், சாதாரண வாசகருக்குப் பொருள் உடனடியாக விளங்குமாறு தமிழில் மொழிபெயர்க்கப்பட்டது.
translation_notes:
  register: நவீனத் தரமான தமிழில், வழிபாட்டுக்குரிய கண்ணியமான நடையுடன் ஒருமை முன்னிலை கட்டளை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. ‘நன்றிப் பலி’ மற்றும் ‘நேர்த்திக்கடன்’ ஆகியவை பொதுவாசகருக்குப் புரியக்கூடியவையாகவும் மூலத்தின் பலி மற்றும் உறுதிமொழி சார்ந்த பின்னணியைப் பாதுகாப்பவையாகவும் தேர்ந்தெடுக்கப்பட்டுள்ளன.
