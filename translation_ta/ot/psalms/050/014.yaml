  text: Offer to God a sacrifice of thanksgiving[a], and fulfill your vows to the Most High.
translation:
  language: ta
  text: கடவுளுக்கு நன்றிப் பலியைச் செலுத்து[a]; உன்னதமானவருக்கு உன் நேர்த்திக்கடன்களை நிறைவேற்று.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நன்றியையே பலியாகக் கடவுளுக்குச் செலுத்து.” எபிரெயச் சொல்லான תּוֹדָה, இந்தப் பலிச் சூழலில் ‘நன்றி செலுத்துதல்’ அல்லது ‘நன்றிப் பலி’ ஆகிய இரண்டில் ஒன்றைக் குறிக்கலாம்.
