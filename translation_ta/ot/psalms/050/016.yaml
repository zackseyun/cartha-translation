source:
  edition: WLC
  text: וְ/לָ֤/רָשָׁ֨ע אָ֘מַ֤ר אֱלֹהִ֗ים מַה לְּ֭/ךָ לְ/סַפֵּ֣ר חֻקָּ֑/י וַ/תִּשָּׂ֖א בְרִיתִ֣/י עֲלֵי פִֽי/ךָ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/016.yaml
  text: But to the wicked God says[b][a], “What right do you have to recount my statutes and to take my covenant on your lips?”
translation:
  language: ta
  text: 'ஆனால், பொல்லாதவனிடம் கடவுள் கூறுகிறார்: “என் சட்டங்களை எடுத்துரைக்கவும்[a], என் உடன்படிக்கையை உன் வாயில் சொல்லவும்[b] உனக்கு என்ன உரிமை இருக்கிறது?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொல்லுக்கு நெருக்கமாக: “என் சட்டங்களை எடுத்துரைப்பதற்கு உனக்கு என்ன சம்பந்தம்?”'
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்கு சொல்: “என் உடன்படிக்கையை உன் வாயின்மேல் ஏந்தவும்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָרָשָׁע
  choice: ஆனால் பொல்லாதவனை நோக்கி
  rationale: וְ இங்கு முந்தைய உரையுடன் முரண்பாட்டை அறிமுகப்படுத்துவதால் ‘ஆனால்’ எனவும், רָשָׁע வெறும் சட்டரீதியான குற்றவாளி என்பதைக் காட்டிலும் ஒழுக்கரீதியில் பொல்லாதவனைக் குறிப்பதால் ‘பொல்லாதவன்’ எனவும் மொழிபெயர்க்கப்பட்டது.
- source_word: אָמַר אֱלֹהִים
  choice: கடவுள் கூறுகிறார்
  rationale: אָמַר இறந்தகால வடிவில் இருந்தாலும், கவிதையில் நேரடிப் பேச்சை உயிரோட்டத்துடன் அறிமுகப்படுத்துகிறது; நவீனத் தமிழில் நிகழ்காலம் இந்தச் செயல்பாட்டை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מַה לְּךָ
  choice: உனக்கு என்ன உரிமை இருக்கிறது?
  rationale: இந்த எபிரெய மரபுத்தொடர் தகவல் கேட்பதல்ல; தகுதி அல்லது உரிமையைச் சவால் செய்கிறது. ‘என்ன உரிமை’ என்பது கண்டனத்தின் வலிமையைத் தெளிவாகத் தருகிறது.
- source_word: לְסַפֵּר
  choice: எடுத்துரைக்க
  rationale: சொல்லுதல், அறிவித்தல், வரிசையாக விவரித்தல் ஆகிய பொருள் நிழல்களைத் தரும் סָפַר என்பதற்கு, தேவனுடைய சட்டங்களை வாயால் அறிவிப்பதைக் குறிக்கும் இயல்பான, கண்ணியமான தமிழ்ச் சொல் தேர்ந்தெடுக்கப்பட்டது.
- source_word: חֻקָּי
  choice: என் சட்டங்களை
  rationale: חֹק என்பது நிர்ணயிக்கப்பட்ட கட்டளைகள் அல்லது சட்டவிதிகளைக் குறிக்கிறது; ‘சட்டங்கள்’ என்பது சாதாரண வாசகருக்குத் தெளிவாகவும் சட்ட-உடன்படிக்கைச் சாயலைக் காக்கும் வகையிலும் உள்ளது.
- source_word: וַתִּשָּׂא
  choice: எடுத்துக்கொள்ள
  rationale: נָשָׂא என்பதன் அடிப்படைப் பொருள் ‘தூக்குதல்/சுமத்தல்’; ‘வாயின்மேல்’ என்பதுடன் சேரும்போது பேச்சில் ஒன்றை எடுத்துக்கொள்வதைக் குறிக்கிறது. தமிழில் ‘உதடுகளில் எடுத்துக்கொள்ள’ என்பது மூல உருவகத்தையும் இணையான வாக்கிய அமைப்பையும் காக்கிறது.
- source_word: בְרִיתִי
  choice: என் உடன்படிக்கையை
  rationale: בְּרִית வேதாகமத்தில் மையமான உடன்படிக்கைச் சொல்; அதன் சட்ட, உறவு, இறையியல் நிறையை ‘உடன்படிக்கை’ தக்கவைக்கிறது.
- source_word: עֲלֵי פִיךָ
  choice: உன் உதடுகளில்
  rationale: சொல்லுக்கு சொல் ‘உன் வாயின்மேல்’ என்றாலும், பேசுவதைக் குறிக்கும் உருவகத்தை நவீனத் தமிழில் ‘உன் உதடுகளில்’ இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: பொல்லாதவனுக்கு விடுக்கப்படும் கண்டனத்தின் தன்மை
  choice: தேவனுடைய சட்டங்களையும் உடன்படிக்கையையும் கூறுவதற்கான பொல்லாதவனின் ஒழுக்கத் தகுதியையும் உரிமையையும் வசனம் சவால் செய்கிறது.
  alternative: பொல்லாதவர் தேவனுடைய உடன்படிக்கையை எந்தச் சூழலிலும் வாயால் குறிப்பிடக்கூடாது என்ற முழுமையான தடை.
  rationale: מַה לְּךָ என்பது ஒருவரின் உரிமை அல்லது தொடர்பைச் சவால் செய்யும் மரபுத்தொடர். சூழலில் கண்டனம், வெறுமனே பேசுவதற்கு எதிரானதல்ல; வாழ்வுக்கும் உடன்படிக்கைச் சொற்களுக்கும் இடையிலான முரண்பாட்டுக்கும் பாசாங்கிற்கும் எதிரானது.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதத்திற்கேற்ற கண்ணியமான நேரடிப் பேச்சு நடை பயன்படுத்தப்பட்டது. ‘உரிமை’ கண்டனத்தின் உட்பொருளைத் தெளிவாக்குகிறது; ‘உதடுகளில் எடுத்துக்கொள்ள’ மூலத்தின் வாய்மொழி உருவகத்தையும் கவித்துவ இணைப்பையும் காக்கிறது. எல்லா அடிக்குறிப்பு குறியீடுகளும் தொடர்புடைய சொற்றொடர்களுக்குப் பின் முதன்மை உரையில் இடப்பட்டுள்ளன.
