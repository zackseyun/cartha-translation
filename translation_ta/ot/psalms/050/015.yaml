source:
  edition: WLC
  text: וּ֭/קְרָאֵ/נִי בְּ/י֣וֹם צָרָ֑ה אֲ֝חַלֶּצְ/ךָ֗ וּֽ/תְכַבְּדֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/015.yaml
  text: And call on me in the day of distress; I will deliver you[a], and you will honor me.
translation:
  language: ta
  text: நெருக்கடியான நாளில் என்னை நோக்கிக் கூப்பிடு; நான் உன்னை விடுவிப்பேன்; நீ எனக்கு மகிமை அளிப்பாய்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நீ எனக்கு மதிப்பு அளிப்பாய்.’ எபிரெய வினைச்சொல் ‘மதிப்பு அளித்தல்’ அல்லது ‘மகிமைப்படுத்துதல்’ என்று பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּקְרָאֵנִי
  choice: என்னை நோக்கிக் கூப்பிடு
  rationale: இங்கு קרא என்பது வெறுமனே அழைப்பதையோ பேசுவதையோ அல்ல, உதவிக்காக இறைவனை நோக்கிக் கூப்பிடுவதைக் குறிக்கிறது. இந்தத் தமிழ் சொற்றொடர் அந்த வேண்டுதல் சார்ந்த பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּיוֹם צָרָה
  choice: நெருக்கடியான நாளில்
  rationale: צָרָה என்பது துன்பம், இடுக்கண், நெருக்கடி ஆகிய பொருள்களைக் கொண்டது. ‘நெருக்கடியான நாளில்’ என்பது எபிரெய காலக் கூறின் கவித்துவ வடிவையும் அதன் தீவிரத்தையும் தெளிவான நவீன தமிழில் காக்கிறது.
- source_word: אֲחַלֶּצְךָ
  choice: நான் உன்னை விடுவிப்பேன்
  rationale: חלץ என்பதன் பியேல் வடிவம் ஆபத்திலிருந்து விடுவித்தல் அல்லது மீட்டல் என்பதைக் குறிக்கிறது. ‘விடுவிப்பேன்’ என்பது தேவையற்ற கூடுதல் இறையியல் பொருளைச் சேர்க்காமல் தெய்வீக மீட்புச் செயலைத் தெளிவாகக் கூறுகிறது.
- source_word: וּתְכַבְּדֵנִי
  choice: நீ என்னை மகிமைப்படுத்துவாய்
  rationale: כבד என்பதன் பியேல் வடிவம் கனம் கொடுத்தல், மதித்தல், மகிமைப்படுத்துதல் ஆகிய பொருள்களைத் தருகிறது. இறைவனைப் பற்றிய இச்சூழலில் ‘மகிமைப்படுத்துவாய்’ என்பது இயல்பான, கண்ணியமான தமிழ்; ‘கனப்படுத்துவாய்’ என்ற மாற்றும் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: தெய்வீக விடுதலைக்குப் பின் மனிதரின் பதில்
  choice: நீ என்னை மகிமைப்படுத்துவாய்
  alternative: நீ என்னைக் கனப்படுத்துவாய்
  rationale: விடுவிக்கப்பட்டவர் இறைவனுக்குரிய கனத்தையும் மகிமையையும் செலுத்துவதே எபிரெய உரையின் கருத்து. தமிழ் வழக்கில் ‘மகிமைப்படுத்து’ இயல்பாக இருப்பதால் முதன்மை உரையில் பயன்படுத்தப்பட்டது; כבד என்பதிலுள்ள ‘கனம் கொடு/மதிப்பு கொடு’ என்ற நுணுக்கம் மாற்று மொழிபெயர்ப்பாகக் குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான கவித்துவ நடையைப் பயன்படுத்துகிறது. கட்டளை, வாக்குறுதி, மனிதப் பதில் ஆகிய மூன்று கூறுகளும் எபிரெய உரையின் வரிசையிலேயே வைக்கப்பட்டுள்ளன.
