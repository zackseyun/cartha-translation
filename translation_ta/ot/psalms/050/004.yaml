  yaml_path: translation/ot/psalms/050/004.yaml
  text: 'He calls to the heavens above and to the earth[a], that he may judge his people:'
translation:
  language: ta
  text: 'தம் மக்களை நியாயந்தீர்ப்பதற்காக,


    அவர் மேலுள்ள வானங்களையும் பூமியையும் அழைக்கிறார்[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மேலுள்ள வானங்களையும் பூமியையும் வரவழைக்கிறார்.” நீதித்துறைச் சூழலில் இங்கு வரும் வினை ‘வரவழைத்தல்’ என்ற பொருளையும் தரலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִקְרָא
  choice: அழைக்கிறார்
  rationale: קרא என்பதன் Qal வடிவம் ‘அழைத்தல்’ அல்லது ‘வரவழைத்தல்’ எனப் பொருள்படலாம். நீதித்துறைச் சூழலில் அழைப்பாணை போன்ற நுண்பொருள் இருந்தாலும், ‘அழைக்கிறார்’ என்பது அதனை அளவுக்கு மீறித் தெளிவுபடுத்தாமல் இயல்பாகப் பாதுகாக்கிறது.
- source_word: הַשָּׁמַיִם מֵעָל
  choice: மேலுள்ள வானங்களை
  rationale: שׁמים என்ற பன்மை வடிவத்தின் கவித்துவமான, அண்டம்சார்ந்த பரப்பை ‘வானங்கள்’ காக்கிறது; מֵעָל இங்கு ‘மேலுள்ள’ என வினையடை சார்ந்த பொருளில் வருகிறது.
- source_word: וְאֶל הָאָרֶץ
  choice: பூமியையும்
  rationale: ‘வானங்கள்’ என்பதற்கு இணையான அண்டம்சார்ந்த எதிரிணையாக இருப்பதால், הָאָרֶץ என்பதற்கு ‘நிலம்’ என்பதைவிட ‘பூமி’ பொருத்தமானது.
- source_word: לָדִין
  choice: நீதி வழங்குவதற்காக
  rationale: ל உடனான דין வினையெச்சம் நோக்கத்தைக் குறிக்கிறது. דין என்பது நீதிபதியாகத் தீர்ப்பிடுதல் அல்லது நியாயம் வழங்குதல் என்ற நீதித்துறைப் பொருளைக் கொண்டது; ‘நீதி வழங்குதல்’ தமிழ் நடையில் இயல்பாகவும் சூழலுக்கு ஏற்றவாறும் உள்ளது.
- source_word: עַמּוֹ
  choice: தம் மக்களுக்கு
  rationale: עם இங்கு உடன்படிக்கை உறவை உணர்த்தும் ‘மக்கள்’; மூன்றாம் நபர் ஒருமை உடைமையை மரியாதையான ‘தம்’ இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: மறைமுக எழுவாயின் அடையாளம்
  choice: சூழலில் கடவுளைக் குறிக்கும் ‘அவர்’ என வைத்தல்
  alternative: வசனத்திலேயே ‘கடவுள்’ என்று வெளிப்படையாகச் சேர்த்தல்
  rationale: எபிரெய வினை மூன்றாம் ஆண்பால் ஒருமையில் இருந்தாலும், இவ்வசனத்தில் எழுவாய் பெயர்ச்சொல் வெளிப்படையாக இல்லை. ஆகவே முந்தைய சூழலைத் தொடர்ந்து ‘அவர்’ என வைத்தது மூலத்தின் உரையோட்டத்தைப் பாதுகாக்கிறது.
- issue: வானங்களும் பூமியும் வகிக்கும் பங்கு
  choice: அவர் அவற்றை அழைக்கிறார் என்று மொழிபெயர்த்து, அவை சாட்சிகளா அல்லது நீதிமன்றக் கூட்டத்தில் வரவழைக்கப்படுபவையா என்பதைத் திறந்துவைத்தல்
  alternative: ‘சாட்சிகளாக அழைக்கிறார்’ என்று பங்கை வெளிப்படையாகச் சேர்த்தல்
  rationale: நீதித்துறைச் சூழல் சாட்சி என்ற கருத்தைத் தூண்டினாலும், இவ்வசனம் அந்தப் பங்கை நேரடியாகக் குறிப்பிடவில்லை.
translation_notes:
  register: நவீன செந்தமிழில், கவித்துவமான கண்ணியத்துடன் வடிவமைக்கப்பட்டது. எபிரெயச் சொல் வரிசையை அப்படியே பின்பற்றாமல், நோக்கத்தைக் குறிக்கும் தொடரை முன்னிறுத்தி இயல்பான தமிழ் வாக்கியமாக்கப்பட்டுள்ளது; ‘வானங்கள்’ என்ற பன்மை அண்டம்சார்ந்த கவித்துவப் பரப்பைத் தக்கவைக்கிறது.
