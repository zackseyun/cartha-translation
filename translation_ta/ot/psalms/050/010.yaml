source:
  edition: WLC
  text: כִּי לִ֥/י כָל חַיְת/וֹ יָ֑עַר בְּ֝הֵמ֗וֹת בְּ/הַרְרֵי אָֽלֶף־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/010.yaml
  text: For every wild animal of the forest is mine[b][a], the cattle on a thousand hills.
translation:
  language: ta
  text: ஏனெனில், காட்டிலுள்ள ஒவ்வொரு விலங்கும் எனக்குச் சொந்தம்; ஆயிரம் மலைகளிலுள்ள[b] கால்நடைகளும்[a] எனக்குச் சொந்தம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல் பெரிய விலங்குகள் அல்லது மிருகங்கள் என்று பரந்த பொருளிலும் வரலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “ஆயிரம் குன்றுகளிலுள்ள.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்தில் கூறப்பட்டதற்கான காரணத்தை அறிமுகப்படுத்துகிறது; சங்கீதத்தின் வாதத் தொடரை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לִי
  choice: எனக்குச் சொந்தம்
  rationale: எபிரெய முன்னிடைச்சொல் இங்கு உடைமையைக் குறிக்கிறது. தமிழில் சொந்தத்தைக் குறிக்கும் பயனிலை இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: כָל חַיְתוֹ יָעַר
  choice: காட்டிலுள்ள ஒவ்வொரு விலங்கும்
  rationale: ஒருமைத் தொகுப்புப் பெயருடன் வரும் כָל என்பதன் பகிர்ந்தளிக்கும் பொருளையும், காட்டைச் சேர்ந்த விலங்குகள் என்ற இணைப்பையும் தெளிவாகத் தருகிறது.
- source_word: בְּהֵמוֹת
  choice: கால்நடைகள்
  rationale: காட்டு விலங்குகளுடன் இணையாக நிற்கும் பெரிய நிலவாழ் விலங்குகளை, குறிப்பாக வளர்ப்பு மந்தைகளை, சூழலில் இயல்பாகக் குறிக்கிறது; சொல்லின் பரந்த பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: בְּהַרְרֵי
  choice: மலைகளிலுள்ள
  rationale: בְּ இடத்தையும் הַרְרֵי மலைகள் அல்லது குன்றுகளையும் குறிக்கின்றன. 'மலைகள்' நேரடியான, கவித்துவமான தமிழ் வடிவம்.
- source_word: אָלֶף
  choice: ஆயிரம்
  rationale: மூலத்தின் எண்ணை மாற்றாமல் வைத்திருக்கிறது; அது மிகுதியைக் குறிக்கும் கவித்துவப் பயன்பாடாக இருக்கக்கூடிய நிலையையும் வாசகர் உணர இடமளிக்கிறது.
theological_decisions:
- issue: தேவனுடைய உடைமையின் பரப்பு
  choice: காட்டு விலங்குகளும் ஆயிரம் மலைகளிலுள்ள கால்நடைகளும் தேவனுக்குச் சொந்தம் என்ற மூலப் படிமம் அப்படியே வைக்கப்பட்டுள்ளது.
  alternative: இதை 'எல்லா விலங்குகளும் எங்கும் தேவனுக்குச் சொந்தம்' என்று முழுமையாக விளக்கிப் பரிமாற்றுவது, அல்லது சரியாக ஆயிரம் மலைகளை மட்டும் குறிக்கும் கணக்காக வாசிப்பது.
  rationale: எபிரெயக் கவிதை காட்டு விலங்குகளையும் மலைகளிலுள்ள கால்நடைகளையும் இணைத்து விரிவான தெய்வீக உடைமையைச் சித்தரிக்கிறது. 'ஆயிரம்' என்பதன் கவித்துவ வலிமையைப் பாதுகாத்து, அதன் எண்ணியல் அல்லது மரபுத்தொடர் சார்ந்த பொருளை மொழிபெயர்ப்பு தீர்மானிக்கவில்லை.
- issue: இரண்டாம் அடியின் இலக்கண உறவு
  choice: தமிழில் புரிதலுக்காக 'உம்' மற்றும் மீண்டும் வரும் 'எனக்குச் சொந்தம்' மூலம் இணையான இரு அடிகளாக வழங்கப்பட்டுள்ளது.
  alternative: இரண்டாம் சொற்றொடரை முதல் சொற்றொடரின் மறுபெயரிடலாகத் தோன்றுமாறு காற்புள்ளியால் மட்டும் இணைப்பது.
  rationale: எபிரெயத்தில் வினையில்லாத இணை அமைப்பு உள்ளது. தமிழில் பயனிலையை மீண்டும் கூறுவது புதிய கருத்தைச் சேர்க்காமல், இரு இணை கவிதை அடிகளுக்கும் ஒரே உடைமைப் பொருள் பொருந்துவதைத் தெளிவாக்குகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. 'எனக்குச் சொந்தம்' என்பது உடைமையை எளிதாகவும் நேரடியாகவும் தெரிவிக்கிறது. மூலத்தின் கவித்துவ இணை அமைப்பு அரைப்புள்ளியால் காட்டப்பட்டுள்ளது; தமிழில் தெளிவுக்காக இரண்டாம் அடியில் பயனிலை மீண்டும் கூறப்பட்டுள்ளது.
