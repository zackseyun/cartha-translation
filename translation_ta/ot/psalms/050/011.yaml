  text: יָ֭דַעְתִּי כָּל ע֣וֹף הָרִ֑ים וְ/זִ֥יז שָׂ֝דַ֗י עִמָּדִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/011.yaml
  text: I know every bird of the mountains[b][a], and the creatures of the field are with me.
translation:
  language: ta
  text: 'மலைகளிலுள்ள ஒவ்வொரு பறவையையும் நான் அறிவேன்;

    வயல்வெளியின் உயிரினங்கள்[a] என்னோடு இருக்கின்றன.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வயல்வெளியில் அசைகிறவை’ அல்லது ‘வயல்வெளியின் காட்டு விலங்குகள்’ என்றும் மொழிபெயர்க்கலாம்; זִיז என்ற எபிரேயச் சொல்லின் பொருள் உறுதியாகத் தெரியவில்லை.
    reason: lexical_alternative
  - marker: b
    text: ‘எனக்குச் சொந்தமானவை’ என்றும் மொழிபெயர்க்கலாம்; எபிரேய உரை இன்னும் நேரடியாக, ‘என்னோடு இருக்கின்றன’ என்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: יָדַעְתִּי
  choice: நான் அறிவேன்
  rationale: ידע என்பதன் Qal முற்றுவினை இங்கு நிலையான, முழுமையான அறிவைக் குறிக்கிறது; ஆகவே நவீனத் தமிழில் நிகழ்காலம் இயல்பாக உள்ளது.
- source_word: כָּל עוֹף הָרִים
  choice: மலைகளிலுள்ள ஒவ்வொரு பறவையையும்
  rationale: ஒருமைத் தொகுப்புப்பெயருடன் வரும் כָּל என்பதன் பகிர்வுப் பொருளை ‘ஒவ்வொரு’ தெளிவாக வெளிப்படுத்துகிறது; עוֹף இச்சூழலில் இயல்பாக ‘பறவை’ என மொழிபெயர்க்கப்படுகிறது.
- source_word: וְזִיז שָׂדַי
  choice: வயல்வெளியின் உயிரினங்கள்
  rationale: זִיז அரிதானதும் பொருள் உறுதியாகத் தெரியாததுமான சொல். ‘உயிரினங்கள்’ என்பது குறிப்பிட்ட இனத்தைத் தீர்மானிக்காமல், வயல்வெளியில் அசையும் அல்லது வாழும் படைப்புகளைக் குறிக்கும் பரந்த பொருளைப் பாதுகாக்கிறது.
- source_word: עִמָּדִי
  choice: என்னோடு இருக்கின்றன
  rationale: எபிரெயச் சொற்றொடரின் நேரடிப் பொருள் ‘என்னுடன்/என்னோடு’ என்பதாகும். சூழலில் உடைமை உணர்த்தப்படலாம்; எனினும் அதை முதன்மை உரையில் வெளிப்படையாகச் சேர்க்காமல் மூலத்தின் சொல்லாட்சியைப் பாதுகாக்கிறது.
theological_decisions:
- issue: עִמָּדִי என்பதில் இறைவனுடைய உடைமை குறித்த மறைபொருள்
  choice: என்னோடு இருக்கின்றன
  alternative: எனக்குச் சொந்தமானவை
  rationale: இறைவனுக்கும் படைப்புகளுக்கும் உள்ள அரசுரிமை சார்ந்த உறவைச் சூழல் உணர்த்தினாலும், எபிரெய உரை ‘என்னுடையவை’ என்று நேரடியாகச் சொல்லவில்லை. ஆகவே உண்மையான பொருள் நெருக்கடியை அடிக்குறிப்புடன் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைத் தன்மையையும் கண்ணியமான நடையையும் காக்கும் எளிய சொற்றொடர். ஒருமைத் தொகுப்புப்பெயரான זִיז தமிழில் இயல்பான பன்மையாக வழங்கப்பட்டுள்ளது; இரு அடிகளின் இணை அமைப்பு பாதுகாக்கப்பட்டுள்ளது.
