  text: I will not take a bull from your house[a], or goats from your pens.
translation:
  language: ta
  text: 'உன் வீட்டிலிருந்து ஒரு காளையையோ,

    உன் தொழுவங்களிலிருந்து வெள்ளாடுகளையோ[a] நான் எடுத்துக்கொள்ள மாட்டேன்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல் குறிப்பாக ஆண் வெள்ளாடுகளை, அதாவது வெள்ளாட்டுக் கடாக்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא אֶקַּח
  choice: நான் எடுத்துக்கொள்ளமாட்டேன்
  rationale: לֹא உடன் வரும் לקח வினையின் முதலாம் நபர் ஒருமை நிறைவுறா வடிவம், இங்கு கடவுள் தாம் செய்யப்போவதில்லை என்று அறிவிப்பதை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: מִבֵּיתְךָ
  choice: உன் வீட்டிலிருந்து
  rationale: בַּיִת இங்கு குடும்பத்தினரைக் காட்டிலும் வழிபடுபவரின் வீடு அல்லது உடைமைப் பகுதியைக் குறிக்கும் இடவியல் படிமமாக உள்ளது.
- source_word: פָר
  choice: ஒரு காளை
  rationale: פָר பலிக்குரிய ஆண் மாட்டைக் குறிக்கிறது; ‘காளை’ நேரடியும் இயல்புமான தமிழ்ச் சொல்.
- source_word: מִמִּכְלְאֹתֶיךָ
  choice: உன் தொழுவங்களிலிருந்து
  rationale: מִכְלָאָה கால்நடைகள் வைக்கப்படும் அடைக்கப்பட்ட இடத்தைக் குறிக்கிறது; ‘தொழுவங்கள்’ கால்நடைச் சூழலுக்கேற்ற தெளிவான தமிழாக்கம்.
- source_word: עַתּוּדִים
  choice: வெள்ளாடுகள்
  rationale: சொல் குறிப்பாக ஆண் வெள்ளாடுகளைக் குறித்தாலும், முதன்மை உரையில் இயல்பான ‘வெள்ளாடுகள்’ பயன்படுத்தப்பட்டு பாலினத் துல்லியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
