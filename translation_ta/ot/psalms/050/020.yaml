  text: You sit and speak against your brother[a]; you slander your own mother's son.
translation:
  language: ta
  text: நீ உட்கார்ந்து உன் சகோதரனுக்கு எதிராகப் பேசுகிறாய்; உன் தாயின் மகனுக்கு எதிராகப் பழி சுமத்துகிறாய்.[a]
  philosophy: optimal-equivalence
