  - marker: a
    text: எபிரேய மரபுத்தொடரைச் சொற்பட மொழிபெயர்த்தால், “பழி கொடுக்கிறாய்.” இது ஒருவருக்கு எதிராகப் பழி, குற்றச்சாட்டு, இகழ்ச்சி அல்லது அவதூறான பேச்சைச் சுமத்துவதைக் குறிக்கிறது.
