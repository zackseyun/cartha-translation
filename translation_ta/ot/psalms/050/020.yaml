lexical_decisions:
- source_word: תֵּשֵׁב
  choice: நீ உட்கார்ந்து
  rationale: ישׁב என்பதன் நேரடியான ‘உட்கார்’ என்ற உருவகத்தைத் தக்கவைத்து, தொடர்ந்து செய்யப்படும் திட்டமிட்ட பேச்சின் குற்றச்சாட்டுத் தொனியையும் வெளிப்படுத்துகிறது.
- source_word: בְּאָחִיךָ תְדַבֵּר
  choice: உன் சகோதரனுக்கு எதிராகப் பேசுகிறாய்
  rationale: דבר உடன் வரும் ב இச்சூழலில் பகைமையான ‘எதிராக’ என்ற பொருளைக் கொள்கிறது; அடுத்த அடியின் பழிசுமத்தும் பேச்சுடன் இது இணையாக உள்ளது.
- source_word: בְּבֶן אִמְּךָ
  choice: உன் தாயின் மகன்மேல்
  rationale: ‘உன் தாயின் மகன்’ என்ற எபிரெய குடும்ப உறவுச் சொல்லை முறையாகத் தக்கவைத்து, மிக நெருங்கிய உடன்பிறப்புக்கு எதிரான குற்றத்தின் தீவிரத்தை வெளிப்படுத்துகிறது.
- source_word: תִּתֶּן דֹּפִי
  choice: பழி சுமத்துகிறாய்
  rationale: நேரடியாக ‘பழி கொடுக்கிறாய்’ என்பதற்குப் பதிலாக, ஒருவர்மேல் நிந்தை, குற்றச்சாட்டு அல்லது அவதூறு வைப்பதைக் குறிக்கும் எபிரெய மரபுத்தொடரை இயல்பான தமிழில் வழங்குகிறது.
