source:
  edition: WLC
  text: בִּֽינוּ נָ֣א זֹ֭את שֹׁכְחֵ֣י אֱל֑וֹהַּ פֶּן אֶ֝טְרֹ֗ף וְ/אֵ֣ין מַצִּֽיל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/022.yaml
  text: Understand this[a], please, you who forget God, lest I tear you apart, and there be no one to rescue.
translation:
  language: ta
  text: கடவுளை மறப்பவர்களே, தயவுசெய்து இதைப் புரிந்துகொள்ளுங்கள்; இல்லையெனில் நான் உங்களைக் கிழித்துப்போடுவேன்[a]; காப்பாற்றுபவர் எவரும் இருக்கமாட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல் இன்னும் நெருக்கமாக: “நான் கிழிப்பேன்; காப்பாற்றுபவர் எவரும் இல்லை.” எதைக் கிழிப்பார் என்பது எபிரெயத்தில் வெளிப்படையாகக் கூறப்படாமல் சூழலிலிருந்து புரிகிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּֽינוּ
  choice: புரிந்துகொள்ளுங்கள்
  rationale: בין என்பதன் பன்மை ஏவல்வினை; பகுத்துணர்ந்து கவனிக்கும்படி அழைக்கிறது. நவீனத் தமிழில் நேரடியாகவும் இயல்பாகவும் அதன் வலிமையைத் தருகிறது.
- source_word: נָא
  choice: தயவுசெய்து
  rationale: காலத்தைக் குறிக்கும் வெறும் ‘இப்போது’ என்பதற்குப் பதிலாக, வேண்டுகோளோடு கூடிய அவசரமான வலியுறுத்தலைக் காட்டும் துகள்.
- source_word: זֹאת
  choice: இதைப்
  rationale: முன்னுள்ள தெய்வீக எச்சரிப்பைச் சுட்டும் சுட்டுப்பெயர். ‘இந்த எச்சரிப்பை’ என்று விரிவுபடுத்தாமல் மூலத்தின் சுருக்கத்தைக் காக்கிறது.
- source_word: שֹׁכְחֵי אֱל֑וֹהַּ
  choice: கடவுளை மறப்பவர்களே
  rationale: இது அழைப்புமுறையில் பயன்படுத்தப்பட்ட வினையெச்சத் தொடர். தொடர்ந்து கடவுளைப் புறக்கணிப்பவர்களை இயல்பான தமிழில் நேரடியாக அழைக்கிறது.
- source_word: פֶּן
  choice: இல்லையெனில்
  rationale: எதிர்மறையான விளைவைப் பற்றிய எச்சரிப்பை அறிமுகப்படுத்துகிறது; நவீனத் தமிழில் தெளிவான, கடுமையான எச்சரிக்கைத் தொனியை அளிக்கிறது.
- source_word: אֶ֝טְרֹ֗ף
  choice: நான் உங்களைக் கிழித்துப்போடுவேன்
  rationale: טרף இரையைப் பிய்த்துக் கிழிக்கும் வலுவான உருவகத்தைக் கொண்டது. எபிரெயத்தில் செயப்படுபொருள் மறைமுகமாக இருந்தாலும், சூழலின்படி ‘உங்களை’ எனத் தமிழில் வெளிப்படுத்துவது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: וְ/אֵ֣ין מַצִּֽיל
  choice: காப்பாற்றுபவர் எவரும் இருக்கமாட்டார்
  rationale: எதிர்மறை இருப்புநிலையும் נצל என்பதன் ஹிஃபில் வினையெச்சமும் மீட்பவர் ஒருவரும் இல்லாததைக் குறிக்கின்றன. ‘காப்பாற்றுபவர்’ அபாயச் சூழலைத் தெளிவாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: אֶטְרֹף என்பதில் உள்ள தெய்வீக நியாயத்தீர்ப்பின் கொடிய விலங்கு உருவகம்
  choice: ‘நான் உங்களைக் கிழித்துப்போடுவேன்’ என்று உருவகத்தை நேரடியாகத் தக்கவைத்தல்
  alternative: ‘நான் உங்களை அழித்துவிடுவேன்’ அல்லது ‘பிடித்துக்கொள்வேன்’ என்று மென்மையாக்குதல்
  rationale: எபிரெயச் சொல் இரையைப் பிய்த்துக் கிழிக்கும் தெளிவான, கடுமையான உருவகத்தைப் பயன்படுத்துகிறது. அதை மென்மையாக்குவது எச்சரிப்பின் தீவிரத்தைக் குறைக்கும்; ஆகவே மூலத்தின் இறையியல் பதற்றம் தீர்க்கப்படாமல் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான எச்சரிக்கைத் தொனி பயன்படுத்தப்பட்டுள்ளது. ‘கிழித்துப்போடுவேன்’ என்பது மூலத்தின் தீவிர உருவகத்தை இயல்பான தமிழில் காக்கிறது; ‘கடவுளை மறப்பவர்களே’ என்ற அழைப்புமுறை நேரடியான தெய்வீக உரையைப் பாதுகாக்கிறது.
