lexical_decisions:
- source_word: פִּיךָ
  choice: உன் வாய்
  rationale: பேச்சைக் குறிக்கும் உருவகப் பயன்பாடு என்றாலும், எபிரெயச் சொல்லின் உடலுறுப்பு உருவகத்தையும் ‘உன் நாவு’ என்பதுடனான கவிதை இணைப்பையும் காக்கிறது.
- source_word: שָׁלַחְתָּ
  choice: கட்டவிழ்த்து விடுகிறாய்
  rationale: அடிப்படையில் ‘அனுப்பு/நீட்டு’ என்று பொருள்படும் வினை, இங்கு வாயைத் தீமைக்காகத் தடையின்றிப் பயன்படுத்துவதைக் குறிக்கிறது; தமிழில் இத்தேர்வு அந்தச் செறிவான உருவகத்தை இயல்பாகத் தருகிறது.
- source_word: בְרָעָה
  choice: தீமை பேச
  rationale: בְ முன்னிடைச்சொல் திசை அல்லது செயல்படும் தளத்தைக் குறிக்கலாம். பேச்சுச் சூழலைத் தமிழில் தெளிவாக்க ‘தீமை பேச’ என வழங்கப்பட்டுள்ளது; ‘தீமைக்காக’ என்பது நெருக்கமான மாற்று.
- source_word: וּלְשׁוֹנְךָ
  choice: உன் நாவை
