- source_word: תַּצְמִיד
  choice: இணைக்கிறாய்
  rationale: צמד என்பதன் ஹிஃபில் வடிவம் ஒன்றை மற்றொன்றோடு சேர்த்தல் அல்லது ஒட்டச்செய்தல் என்னும் கருத்தைக் கொண்டது. ‘இணைக்கிறாய்’ செயற்பாட்டையும் மூலத்தின் உருவகத்தையும் காக்கிறது.
- source_word: מִרְמָה
  choice: வஞ்சகம்
  rationale: ஏமாற்றும் அல்லது பொய்மையான பேச்சைக் குறிக்கும் பரந்த, இயல்பான தமிழ்ச் சொல்.
