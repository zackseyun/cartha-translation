  yaml_path: translation/ot/psalms/028/002.yaml
  text: Hear the voice of my pleas for mercy when I cry to you[c][b][a], when I lift up my hands toward your holy inner sanctuary.
translation:
  language: ta
  text: நான் உம்மை நோக்கிக் கூக்குரலிடும்போது, உமது பரிசுத்த உள் திருத்தலத்தை[a] நோக்கி என் கைகளை உயர்த்தும்போது, என் இரக்க மன்றாட்டுகளின்[b] குரலைக்[c] கேளும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உமது பரிசுத்தத் திருத்தலத்தை.’ எபிரெயச் சொல் இன்னும் குறிப்பாக ஆலயத்தின் உள் அறையை அல்லது மிக உட்புறமான பரிசுத்த இடத்தைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘இரக்க மன்றாட்டுகள்’ என்பதை ‘இரக்கம் வேண்டிய விண்ணப்பங்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: ‘குரல்’ என்பதற்கு ‘ஒலி’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע
  choice: கேளும்
  rationale: שׁמע என்பது நேரடியான வேண்டுதலாக வரும் ஆண்பால் ஒருமை கட்டளை வடிவம். ‘கேளும்’ என்பது ஜெபச் சூழலுக்கேற்ற, இயல்பான மரியாதைமிக்க வேண்டுகோள்.
- source_word: קוֹל
  choice: குரல்
  rationale: קוֹל என்பதற்கு ‘குரல்’ அல்லது ‘ஒலி’ என்று பொருள். தனிப்பட்ட மன்றாட்டுடன் ‘குரல்’ என்பது தமிழில் இயல்பாகவும் மூலத்தின் உருவகத்தைப் பாதுகாப்பதாகவும் உள்ளது.
- source_word: תַּחֲנוּנַי
  choice: என் இரக்க மன்றாட்டு
  rationale: இந்தச் சொல் அருள் அல்லது இரக்கம் நாடும் உருக்கமான வேண்டுதலைக் குறிக்கிறது. ‘இரக்க மன்றாட்டு’ அதன் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: בְּשַׁוְּעִי אֵלֶיךָ
  choice: நான் உம்மை நோக்கிக் கூக்குரலிடும்போது
  rationale: ב + வினையெச்சப் பெயர் இங்கு காலப் பொருளில் ‘...போது’ என வருகிறது. שׁוע-இன் தீவிரத்தை ‘கூக்குரலிடு’ காக்கிறது; אֵלֶיךָ-வின் திசைப் பொருளை ‘உம்மை நோக்கி’ வெளிப்படுத்துகிறது.
- source_word: בְּנָשְׂאִי יָדַי
  choice: என் கைகளை உயர்த்தும்போது
  rationale: ஜெபத்தில் கைகளை உயர்த்தும் நேரடியான உடல் செயலை இயல்பான தமிழில் அப்படியே தருகிறது.
- source_word: אֶל דְּבִיר קָדְשֶׁךָ
  choice: உமது பரிசுத்த உள் திருத்தலத்தை நோக்கி
  rationale: דְּבִיר என்பது பொதுவாக ஆலயத்தின் உள் அறையை, குறிப்பாக மகா பரிசுத்த இடத்தைச் சுட்டுகிறது. ‘உள் திருத்தலம்’ இடவியல் குறிப்பைத் தெளிவாகவும் சமயப் பிரிவுசார் விளக்கமின்றியும் தருகிறது.
theological_decisions:
- issue: דְּבִיר קָדְשֶׁךָ என்பதன் வழிபாட்டிடக் குறிப்பு
  choice: உமது பரிசுத்த உள் திருத்தலம்
  alternative: உமது பரிசுத்தத் திருத்தலம்
  rationale: எபிரெயச் சொல் ஆலயத்தைப் பொதுவாக மட்டும் அல்லாமல் அதன் புனித உள் அறையைக் குறிப்பாகச் சுட்டுகிறது. ஆகவே ‘உள் திருத்தலம்’ என்பது சங்கீதத்தின் ஆலயப் படிமத்தைப் பாதுகாக்கிறது; அதேவேளை பின்னாளைய கோட்பாட்டுக் கருத்துகளைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், ஜெபத்திற்குரிய மரியாதையும் சங்கீதத்தின் அவசரமான வேண்டுதலும் காக்கப்பட்டுள்ளன. ‘உம்மை/உமது’ மற்றும் ‘கேளும்’ ஆகியவை மிகப் பழமையான நடைக்குச் செல்லாமல் உயர்ந்த பக்திநடையை வழங்குகின்றன.
