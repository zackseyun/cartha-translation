source:
  edition: WLC
  text: יְהוָ֤ה עֻזִּ֥/י וּ/מָגִנִּ/י֮ בּ֤/וֹ בָטַ֥ח לִבִּ֗/י וְֽ/נֶ֫עֱזָ֥רְתִּי וַ/יַּעֲלֹ֥ז לִבִּ֑/י וּֽ/מִ/שִּׁירִ֥/י אֲהוֹדֶֽ/נּוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/007.yaml
  text: Yahweh is my strength and my shield[a]; in him my heart trusts, and I am helped. Therefore my heart rejoices[c][b], and with my song I will praise him.
translation:
  language: ta
  text: 'யாவே என் வலிமையும் என் கேடயமும் ஆவார்;

    அவரில் என் உள்ளம் நம்பிக்கை வைத்தது[a], நான் உதவி பெற்றேன்.

    ஆகவே என் உள்ளம் களிகூர்ந்தது[b];

    என் பாடலால் அவருக்கு நன்றி செலுத்துவேன்[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்மேல் என் உள்ளம் நம்பிக்கை வைத்தது.”
    reason: בּוֹ உடன் வரும் בטח என்பதில் “அவரில்” அல்லது “அவர்மேல்” என்ற இரு இயல்பான தமிழ்ச் சாத்தியங்களும் உள்ளன.
  - marker: b
    text: அல்லது, “என் உள்ளம் மகிழ்ந்து துள்ளியது.”
    reason: עלז சாதாரண மகிழ்ச்சியைவிட மிகுந்த, பொங்கும் மகிழ்ச்சியையும் குறிக்கலாம்.
  - marker: c
    text: அல்லது, “என் பாடலால் அவரைத் துதிப்பேன்.”
    reason: ידה என்பதற்கு ‘நன்றி செலுத்து’ என்றும் ‘துதி’ என்றும் பொருள் கொள்ளலாம்.
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இஸ்ரவேலின் தேவனுடைய தனிப்பட்ட பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், எபிரெய நான்கெழுத்துப் பெயரின் பரவலான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: עֻזִּי
  choice: என் வலிமை
  rationale: עֹז என்பதன் நேரடியான பொருளான ‘வலிமை’ என்பதைத் தக்கவைத்து, அடுத்துள்ள ‘என் கேடயம்’ என்பதுடன் கவிதை இணையைப் பேணுகிறது.
- source_word: מָגִנִּי
  choice: என் கேடயம்
  rationale: மָגֵן குறிக்கும் பாதுகாப்புக் கருவியின் உருவகத்தை ‘பாதுகாவலர்’ என்று பொதுமைப்படுத்தாமல் அப்படியே தக்கவைக்கிறது.
- source_word: בּוֹ בָטַח לִבִּי
  choice: அவர்மேல் என் உள்ளம் நம்பிக்கை வைத்தது
  rationale: ב உடன் வரும் בטח சார்ந்திருக்கும் நம்பிக்கையைக் குறிக்கிறது; qatal வடிவின் நிறைவு/கடந்தகாலச் சாயலை முதன்மை உரை வெளிப்படுத்துகிறது.
- source_word: וְנֶעֱזָרְתִּי
  choice: நான் உதவி பெற்றேன்
  rationale: עזר என்பதன் Niphal வடிவிலுள்ள உதவி பெறுதல் என்ற செயப்பாட்டு கருத்தை இயல்பான தமிழில் தருகிறது.
- source_word: וַיַּעֲלֹז לִבִּי
  choice: என் உள்ளம் களிகூர்ந்தது
  rationale: עלז குறிக்கும் மிகுந்த மகிழ்ச்சியை ‘களிகூர்ந்தது’ இயல்பாக வெளிப்படுத்துகிறது; தொடர்ச்சியான எபிரெய வினை வடிவின் கடந்தகாலச் சாயலும் தக்கவைக்கப்படுகிறது.
- source_word: וּמִשִּׁירִי
  choice: என் பாடலால்
  rationale: מִן இங்கு வழிமுறை அல்லது சாதனத்தைக் குறிப்பதாகப் புரிந்து, பாடல் மூலமாகச் செய்யப்படும் செயலைச் சுருக்கமாகத் தெரிவிக்கிறது.
- source_word: אֲהוֹדֶנּוּ
  choice: அவருக்கு நன்றி செலுத்துவேன்
  rationale: Hiphil ידה என்பதன் நன்றி செலுத்துதல் என்ற பொருளை முதன்மைப்படுத்துகிறது; பாடல் சூழலில் ‘துதிப்பேன்’ என்பதும் சாத்தியமானதால் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல உரை ஒரு பொதுப் பட்டப்பெயரை அல்ல, நான்கெழுத்து கொண்ட தனிப்பட்ட இறைப் பெயரையே பயன்படுத்துகிறது. ஆகவே பெயரைத் தக்கவைக்கும் ஒலிபெயர்ப்பு தேர்ந்தெடுக்கப்பட்டது.
- issue: אֲהוֹדֶנּוּ என்பதில் நன்றியா துதியா
  choice: அவருக்கு நன்றி செலுத்துவேன்
  alternative: அவரைத் துதிப்பேன்
  rationale: ידה இரு கருத்துகளையும் தாங்கக்கூடும். சூழல் பாடலைக் குறிப்பதால் ‘துதி’ சாத்தியமானது; ஆனால் நன்றி செலுத்துதல் என்ற தனித்த நுணுக்கத்தை முதன்மை உரையில் பேணி, மாற்றை அடிக்குறிப்பில் தருகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘உள்ளம்’, ‘கேடயம்’, ‘களிகூர்ந்தது’ ஆகியவை சங்கீத நடையின் உருவகத்தையும் உயர்வையும் காக்கின்றன; வினைகளின் காலத்தை ஒரே மாதிரியாக்குவதற்காக எபிரெய வடிவங்களின் வேறுபாடு அழிக்கப்படவில்லை.
