source:
  edition: WLC
  text: יְהוָ֥ה עֹֽז לָ֑/מוֹ וּ/מָ֘ע֤וֹז יְשׁוּע֖וֹת מְשִׁיח֣/וֹ הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/008.yaml
  text: Yahweh is strength for them[b][a], and he is a stronghold of salvation for his anointed one.
translation:
  language: ta
  text: யாவே அவர்களுக்கு வலிமை; அவர் அபிஷேகம் செய்தவரின்[b] மீட்புக்கான அரண்[a] அவரே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மீட்பின் அரண்’ அல்லது ‘மீட்கும் செயல்களின் கோட்டை’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயத்தில் இங்குள்ள சொல் பன்மையில், சொல்லுக்குச் சொல் ‘மீட்புகள்’ என்று உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: ‘அவர் அபிஷேகம் செய்தவர்’ என்பதை ‘அவருடைய மேசியா’ என்றும் மொழிபெயர்க்கலாம். சூழலில் இது முதலில் யாவே அபிஷேகம் செய்த அரசரைக் குறிக்கக்கூடும்; அதே நேரத்தில் விரிவான மேசியாவுக்குரிய பொருளுக்கும் இடமளிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பெயரை ஒரு பட்டமாக மாற்றாமல், எபிரெய தனிப்பெயரின் பரவலாக அறியப்பட்ட தமிழ் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: עֹז
  choice: வலிமை
  rationale: இங்கு யாவே அவர்களுக்கான வலிமை என்று பயனிலைப் பொருளில் வருகிறது; அடுத்து வரும் ‘அரண்’ என்ற தனித்த உருவகத்தோடு இதைக் கலக்காமல் காக்கிறது.
- source_word: לָמוֹ
  choice: அவர்களுக்கு
  rationale: எபிரெய வடிவிலுள்ள மூன்றாம் நபர் பன்மையைச் சூழலின் அடிப்படையில் ஒருமையாக்காமலும் ‘அவருடைய மக்கள்’ என்று விரிவாக்காமலும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: מָעוֹז
  choice: அரண்
  rationale: பாதுகாப்பளிக்கும் உறுதியான இடம் அல்லது ஆதாரம் என்ற கோட்டை உருவகத்தை இயல்பான, சுருக்கமான தமிழில் தருகிறது.
- source_word: יְשׁוּעוֹת
  choice: மீட்பு
  rationale: எபிரெயத்தில் பன்மை இருந்தாலும், ‘மீட்புகள்’ என்பது இன்றைய தமிழில் செயற்கையாக ஒலிப்பதால் இயல்பான கூட்டுப்பொருள் கொண்ட ஒருமை பயன்படுத்தப்படுகிறது; மூலத்தின் பன்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: מְשִׁיחוֹ
  choice: அவர் அபிஷேகம் செய்தவர்
  rationale: சொல் முதன்மையாக யாவே அபிஷேகம் செய்த அரசரைக் குறிக்கக்கூடிய விளக்கச் சொற்றொடராக மொழிபெயர்க்கப்படுகிறது; ‘மேசியா’ என்ற நிலைபெற்ற பட்டத்தை முதன்மை உரைக்குள் முன்கூட்டியே கொண்டுவரவில்லை.
- source_word: הוּא
  choice: அவரே
  rationale: தனித்த எபிரெய சுட்டுப்பெயரின் வலியுறுத்தலைத் தமிழின் ‘அவரே’ இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: מְשִׁיחוֹ என்பது ‘அவர் அபிஷேகம் செய்தவர்’ என்ற விளக்கச் சொற்றொடரா, ‘அவருடைய மேசியா’ என்ற பட்டமா?
  choice: அவர் அபிஷேகம் செய்தவர்
  alternative: அவருடைய மேசியா
  rationale: சங்கீதத்தின் உடனடிச் சூழலில் இது யாவே அபிஷேகம் செய்த அரசரை முதலில் குறிக்கலாம். அதேவேளையில் அதன் விரிவான மேசியாவுக்குரிய ஒலிப்பை அடிக்குறிப்பு திறந்தவாறு வைத்திருக்கிறது.
translation_notes:
  register: நவீன செந்தமிழ் நடை; சுருக்கமான எபிரெய இணைப்பமைப்பைத் தக்கவைத்தபடியே தமிழில் வாசிக்க இயலுமாறு அமைக்கப்பட்டுள்ளது. ‘யாவே,’ ‘வலிமை,’ ‘அரண்,’ ‘அபிஷேகம்’ ஆகியவை கண்ணியமானதும் பொதுவாகப் புரிந்துகொள்ளக்கூடியதுமான சொற்களாகத் தேர்ந்தெடுக்கப்பட்டுள்ளன.
