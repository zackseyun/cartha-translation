revisions:
- from: அவர்களுடைய செயலுக்கு ஏற்றபடி அவர்களுக்குக் கொடும்; அவர்களுடைய செய்கைகளின் தீமைக்கு ஏற்றபடியும் கொடும். அவர்களுடைய கைகளின் செயலுக்கு ஏற்றபடி அவர்களுக்குக் கொடும்; அவர்களுக்குரிய கைம்மாறை அவர்களுக்குத் திருப்பிக் கொடும்.
  to: அவர்களின் செயலுக்கு ஏற்ப அவர்களுக்குக் கொடு; அவர்களின் தீய செயல்களுக்கு ஏற்பவும் கொடு. அவர்களின் கைகள் செய்ததற்கு ஏற்ப அவர்களுக்குக் கொடு; அவர்களுக்குரிய கைம்மாறை அவர்களுக்கே திருப்பிக் கொடு.
  rationale: 'The revision updates the imperative to modern standard Tamil and smooths overly literal genitive constructions. It retains the petitionary form, the threefold requital structure, the distinction between general conduct and evil deeds, and the final sense of recompense returning to those responsible. No Tamil footnote is needed: the English audit note supplies a stylistic lexical alternative rather than a textual ambiguity requiring preservation in the Tamil text.'
  reviewer_model: gpt-5.6-terra
