base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/004.yaml
  text: Give to them according to their work[a], and according to the evil of their deeds; according to the work of their hands give to them; repay them their due.
translation:
  language: ta
  text: அவர்களின் செயலுக்கு ஏற்ப அவர்களுக்குக் கொடு; அவர்களின் தீய செயல்களுக்கு ஏற்பவும் கொடு. அவர்களின் கைகள் செய்ததற்கு ஏற்ப அவர்களுக்குக் கொடு; அவர்களுக்குரிய கைம்மாறை அவர்களுக்கே திருப்பிக் கொடு.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תֶּן
  choice: கொடும்
  rationale: கடவுளை நோக்கிய வேண்டுதலில் வரும் கட்டளை வடிவத்தின் நேரடியான வலிமையை, மரியாதைப் பன்மையுடன் இயல்பான தமிழில் காக்கிறது.
- source_word: כְּפָעֳלָם
  choice: அவர்களுடைய செயலுக்கு ஏற்றபடி
  rationale: פעל என்பதன் செயல்/செய்த காரியம் என்ற பொருளையும், செய்ததற்கு அளவான பதில் என்ற கட்டமைப்பையும் காக்கிறது.
- source_word: וּכְרֹעַ מַעַלְלֵיהֶם
  choice: அவர்களுடைய செய்கைகளின் தீமைக்கு ஏற்றபடியும்
  rationale: רֹעַ என்பதன் ஒழுக்கத் தீமையையும் מעללים என்பதன் செயல்கள் என்ற பொருளையும் மிகைப்படுத்தாமல் வெளிப்படுத்துகிறது.
- source_word: כְּמַעֲשֵׂה יְדֵיהֶם
  choice: அவர்களுடைய கைகளின் செயலுக்கு ஏற்றபடி
  rationale: அவர்கள் தாமே செய்தவற்றைச் சுட்டும் எபிரெய உருவகத்தையும் இணை அமைப்பையும் காக்கிறது.
- source_word: הָשֵׁב
  choice: திருப்பிக் கொடும்
  rationale: Hiphil வடிவத்தின் ‘அவர்கள்மேல் மீண்டும் வரச்செய்’ என்ற அடிப்படை உணர்வையும், இச்சூழலில் உள்ள பதிலளிப்பு/கைம்மாறு பொருளையும் தமிழில் தெளிவாகத் தருகிறது.
- source_word: גְּמוּלָם
  choice: அவர்களுக்குரிய கைம்மாறு
  rationale: גְּמוּלָם குறிக்கும் உரிய பதில் அல்லது பிரதிபலனை முறையான, ஆனால் புரிந்துகொள்ளத்தக்க தமிழில் தருகிறது; நல்ல பலன் என்ற ஒருபக்கப் பொருளைத் தவிர்க்கிறது.
theological_decisions:
- issue: சாபவேண்டுதல் சார்ந்த மொழியும் தெய்வீகப் பதிலளிப்பும்
  choice: அவர்கள் செய்த தீய செயல்களுக்கு ஏற்ற கைம்மாறை கடவுள் கொடுக்க வேண்டும் என்ற வேண்டுதலாக மொழிபெயர்க்கப்பட்டது.
  alternative: இதை வெறும் விளக்கக் கூற்றாகவோ, தண்டனையின் வலிமையை மென்மைப்படுத்திய வேண்டுதலாகவோ மொழிபெயர்த்தல்.
  rationale: மூலத்தில் תֶּן இருமுறையும் הָשֵׁב ஒருமுறையும் கட்டளை வடிவில் வருகின்றன. ஆகவே இது நடுநிலையான விளக்கம் அல்ல; அளவான தெய்வீக நீதிக்கான நேரடி வேண்டுதல். மொழிபெயர்ப்பு இதை மிகைப்படுத்தாமலும் மென்மைப்படுத்தாமலும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதத்திற்கேற்ற கண்ணியமான வேண்டுதல் நடை பயன்படுத்தப்பட்டுள்ளது. ‘செயல்/செய்கைகள்’ என்ற இணைச்சொற்கள் மூலத்தின் פעל, מעללים, מעשה ஆகிய சொல் மாறுபாடுகளை ஓரளவு பிரதிபலிக்கின்றன. ‘கைகளின் செயல்’ என்ற எபிரெய உருவகம் பாதுகாக்கப்பட்டுள்ளது.
