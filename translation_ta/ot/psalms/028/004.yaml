review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the three imperatival petitions, the measure-for-measure repetition, the moral force of רֹעַ ('evil'), the agency emphasis in 'the work of their hands,' and the final judicial requital. The proposed wording preserves these features without adding punitive intensity.
  naturalness: ‘கொடும்’ is a literary/older imperative and is not the most natural form for modern standard Tamil. ‘அவர்களுடைய செய்கைகளின் தீமை’ and especially ‘அவர்களுடைய கைகளின் செயலுக்கு’ are understandable but stiff. The revision uses direct, idiomatic modern Tamil while retaining the Hebrew parallelism and imagery.
  terminology: ‘கைம்மாறு’ is an appropriate, dignified rendering of גְּמוּלָם in this context, since it conveys due recompense without implying that the outcome is beneficial. ‘தீய செயல்கள்’ naturally conveys the evil character of their deeds.
  issues:
  - severity: medium
    issue: The repeated imperative ‘கொடும்’ is not natural modern standard Tamil.
    rationale: Although it can occur in elevated older biblical usage, ‘கொடு’ is the normal direct singular imperative in a prayer addressed to God and better meets the stated target variant.
  - severity: low
    issue: Several noun phrases are overly literal and awkward.
    rationale: ‘செய்கைகளின் தீமை’ and ‘கைகளின் செயலுக்கு’ mirror Hebrew structures but read less naturally in Tamil. ‘தீய செயல்கள்’ and ‘கைகள் செய்ததற்கு’ communicate the same sense idiomatically.
  revised_text: அவர்களின் செயலுக்கு ஏற்ப அவர்களுக்குக் கொடு; அவர்களின் தீய செயல்களுக்கு ஏற்பவும் கொடு. அவர்களின் கைகள் செய்ததற்கு ஏற்ப அவர்களுக்குக் கொடு; அவர்களுக்குரிய கைம்மாறை அவர்களுக்கே திருப்பிக் கொடு.
  revised_footnotes: []
  revision_rationale: 'The revision updates the imperative to modern standard Tamil and smooths overly literal genitive constructions. It retains the petitionary form, the threefold requital structure, the distinction between general conduct and evil deeds, and the final sense of recompense returning to those responsible. No Tamil footnote is needed: the English audit note supplies a stylistic lexical alternative rather than a textual ambiguity requiring preservation in the Tamil text.'
