theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழியாக்கம்
  choice: யெகோவா
  alternative: யாவே
  rationale: மூலத்தில் உள்ள தனிப்பட்ட தெய்வீகப் பெயரை ‘கர்த்தர்’ போன்ற பட்டப்பெயரால் மாற்றாமல் பெயராகவே தருகிறது. நவீன தமிழ்க் கிறிஸ்தவ வாசகர்களிடையே அடையாளம் காணத்தக்க ‘யெகோவா’ வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- issue: தீயோரின் குறை அறிவின்மையா அல்லது கவனியாமையா
  choice: உணர்ந்துகொள்வதில்லை
  alternative: பொருட்படுத்துவதில்லை
  rationale: בין என்பதன் முதன்மை உணர்வான புரிதல்/பகுத்துணர்தலை முதன்மை உரையில் காக்கிறது; சூழலில் சாத்தியமான நோக்கமுள்ள அலட்சியத்தை அடிக்குறிப்பில் பதிவு செய்கிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘இடித்துப்போடுவார்—கட்டியெழுப்பமாட்டார்’ என்ற கட்டட உருவக எதிரிணை பாதுகாக்கப்பட்டுள்ளது; எபிரெய ஒருமை/பன்மை இணையும் இயன்றவரை காக்கப்பட்டுள்ளது.
