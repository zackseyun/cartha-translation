base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/000.yaml
  text: Of David[a]. To you, Yahweh, I call; my rock, do not be deaf to me, lest if you are silent to me[c][b], I become like those going down to the pit.
translation:
  language: ta
  text: 'தாவீதுக்கு உரியது.[a]


    யாவே, உம்மையே நோக்கி நான் கூப்பிடுகிறேன்;

    என் கன்மலையே, எனக்குச் செவிடாயிராதேயும்.[b]


    நீர் எனக்கு மௌனமாக இருந்தால்,

    குழியில் இறங்குகிறவர்களைப்போல் நானும் ஆகிவிடுவேன்.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தாவீதுக்கு உரியது’ என்பது ‘தாவீதினால் இயற்றப்பட்டது,’ ‘தாவீதைப் பற்றியது,’ அல்லது ‘தாவீதுக்காக அர்ப்பணிக்கப்பட்டது’ என்ற பொருள்களையும் தரக்கூடும்.
    reason: source_ambiguity
  - marker: b
    text: அல்லது, ‘என்னிடம் மௌனமாக இராதேயும்.’ முதல் வினை கேளாமையையும் மௌனத்தையும் குறிக்கக்கூடும்; அடுத்த வரியில் மௌனத்தைக் குறிக்கும் வேறொரு வினை வருகிறது.
    reason: lexical_alternative
  - marker: c
    text: ‘குழி’ என்பது கல்லறையையோ இறந்தோரின் உலகையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: தாவீதுக்கு உரியது
  rationale: לְ என்ற முன்னிடைச்சொல் ஆசிரியத்துவம், தொடர்பு, அர்ப்பணிப்பு போன்ற உறவுகளைக் குறிக்கக்கூடும். ‘தாவீதுக்கு உரியது’ என்பது தலைப்பின் சுருக்கத்தையும் அதன் இயல்பான தெளிவின்மையையும் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான יהוה என்பதை பொதுப்பட்டமான ‘ஆண்டவர்’ என்று மாற்றாமல், ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: צוּרִי
  choice: என் கன்மலையே
  rationale: צוּר என்பதன் உறுதி, பாதுகாப்பு ஆகிய உருவகங்களைத் தமிழில் இயல்பாகக் காக்கும் நேரடி அழைப்புமுறை.
- source_word: אַל־תֶּחֱרַשׁ מִמֶּנִּי
  choice: எனக்குச் செவிகொடாமல் இராதேயும்
  rationale: חרש என்பது செவிடாயிருத்தல் அல்லது மௌனமாயிருத்தல் என்ற பொருள் வளையத்தைக் கொண்டது. அடுத்துள்ள חשה என்ற ‘மௌனமாயிரு’ வினையிலிருந்து ஓரளவு வேறுபாட்டைக் காக்க, முதலில் கேளாமையை முன்னிறுத்துகிறது.
- source_word: בוֹר
  choice: குழி
  rationale: நேரடி உருவகத்தைப் பாதுகாக்கிறது; சூழலில் இது கல்லறையையோ இறந்தோரின் உலகையோ சுட்டக்கூடும் என்பதைக் குறிப்பில் தெரிவிக்கிறது.
theological_decisions:
- issue: தெய்வீகப் பெயர் יהוה
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் உள்ள தனிப்பெயரைப் பொதுப்பட்டமாக மாற்றாமல் வெளிப்படையாகக் காக்கிறது; எந்தச் சமயப் பிரிவின் தனிப்பட்ட விளக்கத்தையும் சேர்ப்பதில்லை.
- issue: கடவுளின் மௌனமும் சங்கீதக்காரனின் மரணநிலையும் இடையிலான தொடர்பு
  choice: ‘நீர் எனக்கு மௌனமாக இருந்தால்’ என நிபந்தனை/அச்சுறுத்தும் விளைவு சார்ந்த தொடர்பு
  alternative: ‘நீர் மௌனமாக இருந்து, நானும் ... ஆகாதபடி’
  rationale: פֶּן தொடங்கும் அஞ்சப்படும் முடிவை இயல்பான தமிழில் காட்டுகிறது; கடவுளின் மௌனமே அந்த நிலைக்குக் காரணம் என்று தேவையற்ற அளவில் தத்துவ ரீதியாகத் தீர்மானிப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், கவிதைக்குரிய கண்ணியத்துடன் ஆனால் சாதாரண வாசகருக்கும் தெளிவாக அமைக்கப்பட்டுள்ளது. இறைவனை நோக்கிய மரியாதைப் பன்மை (‘உம்மை,’ ‘நீர்’) பயன்படுத்தப்பட்டுள்ளது. வரி அமைப்பு எபிரெய வேண்டுதலின் முன்னேற்றத்தைக் காக்கிறது.
