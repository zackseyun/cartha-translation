  - marker: a
    text: அல்லது, “அவர்களுக்கு உணவளியும்”; எபிரெய வினை மந்தைக்கு உணவளிப்பதையும் உட்படுத்தும் மேய்ப்பரின் விரிவான பேணுதலைக் குறிக்கலாம்.
