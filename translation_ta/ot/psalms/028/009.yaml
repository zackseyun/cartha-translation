lexical_decisions:
- source_word: הוֹשִׁיעָה
  choice: மீட்டு
  rationale: ישׁע வினையின் கட்டளை வடிவம் கடவுளை நோக்கிய வேண்டுதலாக உள்ளது. ‘மீட்டு’ என்பது ஆபத்திலிருந்து விடுவித்துக் காப்பதையும் இரட்சிப்பையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עַמֶּךָ
  choice: உமது மக்களை
  rationale: עם என்பதுடன் இரண்டாம் நபர் ஆண்பால் ஒருமை உருபு இணைந்து, கடவுளுக்குரிய மக்களைக் குறிக்கிறது. ‘உமது மக்கள்’ தெளிவான, மரியாதையான தமிழ் நடை.
- source_word: בָרֵךְ
  choice: ஆசீர்வதியும்
  rationale: ברך வினையின் கட்டளை வடிவம் ஜெப வேண்டுதலாக வருகிறது. ‘ஆசீர்வதியும்’ அதன் வழிபாட்டு நயத்தையும் நேரடிப் பொருளையும் காக்கிறது.
- source_word: נַחֲלָתֶךָ
  choice: உமது உரிமைச் சொத்தானவர்களை
  rationale: נחלה என்பது சுதந்தரம், பங்காகக் கிடைத்த உடைமை, உரிமைச் சொத்து ஆகிய கருத்துகளைக் கொண்டது. இங்கு மக்களையே குறிப்பதால், தமிழில் உயிரற்ற உடைமையாகத் தவறாகப் புரியாதவாறு ‘உரிமைச் சொத்தானவர்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: רְעֵם
  choice: அவர்களை மேய்த்து
  rationale: רעה என்பது மந்தையைப் பேணுதல், உணவளித்தல் உள்ளிட்ட மேய்ப்பரின் முழுப் பணியையும் குறிக்கலாம். ‘மேய்த்து’ ஆயர் உருவகத்தைச் சுருக்காமல் இயல்பாகத் தக்கவைக்கிறது.
- source_word: נַשְּׂאֵם
  choice: அவர்களைச் சுமந்தருளும்
  rationale: נשא என்பதற்கு உயர்த்துதல், தாங்குதல், சுமத்தல் ஆகிய பொருள்கள் உண்டு. மேய்ப்புச் சூழலில் ‘சுமந்தருளும்’ பாதுகாப்போடு தாங்கிச் செல்லும் நயத்தை வழங்குகிறது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: עַד הָעוֹלָם
  choice: என்றென்றும்
  rationale: நீடித்த, முடிவில்லாத காலத்தைக் குறிக்கும் எபிரெயச் சொற்றொடருக்கு ‘என்றென்றும்’ இயல்பான, கண்ணியமான இணை.
theological_decisions:
- issue: רְעֵם என்பதிலுள்ள மேய்ப்பர் உருவகம்
  choice: அவர்களை மேய்த்து
  alternative: அவர்களுக்கு உணவளித்து
  rationale: எபிரெய வினை உணவளித்தலை உள்ளடக்கினாலும், மேய்ப்பரின் விரிவான பேணுதலையும் வழிநடத்துதலையும் குறிக்கிறது. ‘மேய்த்து’ என்பது உருவகத்தின் பரப்பைத் தக்கவைத்து, பிற்காலக் கோட்பாடுகளைப் புகுத்துவதில்லை.
- issue: נַחֲלָתֶךָ என்பதிலுள்ள உடன்படிக்கை சார்ந்த உரிமை
  choice: உமது உரிமைச் சொத்தானவர்களை
  alternative: உமது சுதந்தரத்தை / உமது உடைமையை
  rationale: மக்கள் கடவுளுக்குரிய பங்காக அல்லது உரிமைச் சொத்தாக இருப்பதை மூல உருவகம் தெரிவிக்கிறது. தமிழில் மக்களைக் குறிக்கும் பொருள் தெளிவாக இருக்க உயிருள்ள பன்மை வடிவம் பயன்படுத்தப்பட்டது.
- issue: נַשְּׂאֵם என்பதின் பொருள் பரப்பு
  choice: அவர்களைச் சுமந்தருளும்
  alternative: அவர்களை உயர்த்தியருளும் / அவர்களைத் தாங்கியருளும்
  rationale: மூல வினை உயர்த்துதல், தாங்குதல், சுமத்தல் எனப் பலவாறு பொருள்படலாம். மேய்ப்பர் உருவகத்துடன் ‘சுமந்தருளும்’ நன்றாக இயைந்தாலும், உண்மையான சொற்பொருள் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனச் செந்தமிழை அடிப்படையாகக் கொண்ட, பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான ஜெப நடை. கடவுளை நோக்கிய மரியாதைப் பன்மை வினைமுற்றுகள் பயன்படுத்தப்பட்டுள்ளன. மூல எபிரெயத்தின் இணை வேண்டுதல்களும் மேய்ப்பர் உருவகமும் பாதுகாக்கப்பட்டுள்ளன.
