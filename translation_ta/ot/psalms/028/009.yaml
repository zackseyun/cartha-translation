  text: Save your people and bless your inheritance[b][a]; shepherd them and carry them forever.
translation:
  language: ta
  text: உமது மக்களை மீட்டருளும்; உமது சுதந்தரத்தை ஆசீர்வதியும்; அவர்களை மேய்த்தருளும்[a]; என்றென்றும் அவர்களைச் சுமந்தருளும்[b].
  philosophy: optimal-equivalence
