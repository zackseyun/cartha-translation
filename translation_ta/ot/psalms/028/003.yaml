  yaml_path: translation/ot/psalms/028/003.yaml
  text: Do not drag me away with the wicked[a], with those who work evil[b], who speak peace with their neighbors while evil is in their hearts.
translation:
  language: ta
  text: தீயவர்களோடும் தீமை செய்கிறவர்களோடும் என்னை இழுத்துச் செல்லாதீர்[a]. அவர்கள் தங்கள் அயலாரிடம்[b] சமாதானமாகப் பேசுகிறார்கள்; ஆனால் அவர்களின் உள்ளங்களில் தீமை இருக்கிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தீயவர்களோடு என்னைக் கொண்டுபோகாதீர்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘தங்கள் நண்பர்களிடம்’ அல்லது ‘தங்கள் தோழர்களிடம்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּמְשְׁכֵנִי
  choice: என்னை இழுத்துச் செல்லாதீர்
  rationale: מָשַׁך என்பதன் இச்சூழலுக்குரிய வலிமையையும், தீயவர்களின் கூட்டத்தோடு அல்லது அவர்களின் முடிவோடு சங்கமிக்கச் செய்ய வேண்டாம் என்ற வேண்டுதலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: רְשָׁעִים
  choice: தீயவர்கள்
  rationale: சட்டரீதியாகக் குற்றவாளிகள் என்பதைக் காட்டிலும் ஒழுக்கரீதியாகத் தீமை செய்பவர்களைக் குறிக்கும் சங்கீதப் பயன்பாட்டுக்கு ஏற்ற, தெளிவான நவீனத் தமிழ் சொல்.
- source_word: פֹּעֲלֵי אָוֶן
  choice: தீமை செய்கிறவர்கள்
  rationale: தவறை வழக்கமாகச் செயல்படுத்துகிறவர்கள் என்ற செயற்பாட்டு வலிமையைப் பாதுகாத்து, பொதுவாசகருக்கு எளிதாகப் புரியும் வகையில் தருகிறது.
- source_word: דֹּבְרֵי שָׁלוֹם
  choice: சமாதானமாகப் பேசுகிறார்கள்
  rationale: வெளிப்படையான அமைதிப் பேச்சுக்கும் உள்ளார்ந்த தீமைக்கும் இடையிலான எதிர்மறையை இயல்பான தமிழில் எடுத்துக்காட்டுகிறது.
- source_word: רֵעֵיהֶם
  choice: தங்கள் அயலாரிடம்
  rationale: רֵעַ என்பதற்கு அயலார், தோழர், நண்பர் ஆகிய பொருள்கள் உண்டு; இங்கு உண்மையான நட்பை முன்கூட்டியே கருதாமல் சமூக உறவைக் குறிக்க ‘அயலார்’ பொருத்தமாக உள்ளது.
- source_word: רָעָה בִּלְבָבָם
  choice: அவர்கள் உள்ளங்களில் தீமை இருக்கிறது
  rationale: ‘இதயம்’ குறிக்கும் உள்ளார்ந்த எண்ணம் மற்றும் நோக்கத்தை நவீனத் தமிழில் ‘உள்ளம்’ என இயல்பாக வெளிப்படுத்தி, தீய உள்நோக்கை மிகைப்படுத்தாமல் பாதுகாக்கிறது.
theological_decisions:
- issue: தீயவர்களோடு இழுத்துச் செல்லப்படுவது எதைக் குறிக்கிறது
  choice: அவர்களுடைய கூட்டத்திலோ முடிவிலோ தானும் சேர்த்துக்கொள்ளப்படாதிருக்க வேண்டுதல்
  alternative: தீயவர்களைப் பின்பற்றி நடக்காமல் இருப்பதற்கான வேண்டுதல் மட்டும்
  rationale: ‘என்னை இழுத்துச் செல்லாதீர்’ என்பதும் ‘தீயவர்களோடும்’ என்பதும் அவர்களுடன் சேர்த்து அழைத்துச் செல்லப்படுவதையே இயல்பாகக் குறிக்கின்றன; அது நியாயத்தீர்ப்பில் அவர்களுடைய முடிவைப் பகிர்வதைக் குறிக்கக்கூடும். ஆனால் எபிரெய உரை அதன் துல்லியமான முறையைச் சொல்லாததால் தமிழிலும் அதை வெளிப்படையாகச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், வழிபாட்டு மரியாதையைப் பேணும் ‘-தீர்’ வடிவம் பயன்படுத்தப்பட்டுள்ளது. அரிதான சமயச் சொற்களைத் தவிர்த்து, எபிரெய உரையின் வெளிப்புற சமாதானப் பேச்சுக்கும் உள்ளார்ந்த தீமைக்கும் இடையிலான அழுத்தம் தெளிவாக வைக்கப்பட்டுள்ளது.
