source:
  edition: WLC
  text: בָּר֥וּךְ יְהוָ֑ה כִּי שָׁ֝מַע ק֣וֹל תַּחֲנוּנָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/006.yaml
  text: Blessed be Yahweh[b][a], for he has heard the voice of my pleas for mercy.
translation:
  language: ta
  text: யாவே போற்றப்படுவாராக! ஏனெனில் அவர் என் இரக்க மன்றாட்டுகளின் குரலைக் கேட்டார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேரடியாக, ‘என் இரக்க மன்றாட்டுகளின் குரல்’; அல்லது, ‘என் இரக்க மன்றாட்டுகளின் சத்தம்’.
    reason: קוֹל תַּחֲנוּנָי என்ற எபிரெயத் தொடரின் நேரடியான அமைப்பையும், קוֹל என்பதற்குள்ள ‘குரல்/சத்தம்’ என்ற சொற்பொருள் மாற்றையும் காட்டுகிறது.
lexical_decisions:
- source_word: בָּרוּךְ
  choice: போற்றப்படுவாராக
  rationale: இது வாழ்த்துரையாகவும் துதிப்பிரகடனமாகவும் பயன்படும் செயல்பாட்டு இடைச்சொல் வடிவம். தமிழில் ‘போற்றப்படுவாராக’ என்பது அதன் துதிசார் வலிமையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான יהוה-ஐ ஒரு பட்டத்தால் மாற்றாமல், அதன் பரவலாக ஏற்கப்பட்ட ‘Yahweh’ ஒலிப்புக்கு ஏற்றவாறு தமிழில் எழுத்துப்பெயர்க்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: யாவே போற்றப்படுவதற்கான காரணத்தை அறிமுகப்படுத்தும் காரண இணைப்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: שָׁמַע
  choice: கேட்டார்
  rationale: முடிவுற்ற செயலைக் குறிக்கும் எபிரெய வினைச்சொல்லைச் சூழலுக்கு இயல்பான தமிழ் இறந்தகாலத்தில் வழங்குகிறது; வேண்டுதலை ஏற்றுக்கொண்டார் என்ற கூடுதல் பொருளைச் சேர்க்கவில்லை.
- source_word: קוֹל
  choice: குரலை
  rationale: இந்தச் சூழலில் ‘குரல்’ என்பது தனிப்பட்ட மன்றாட்டின் ஒலியை இயல்பாகக் குறிக்கிறது; ‘சத்தம்’ என்பதும் சாத்தியமான நேரடிப் பொருள்.
- source_word: תַּחֲנוּנָי
  choice: இரக்கம் வேண்டி நான் மன்றாடிய
  rationale: இச்சொல் அருள் அல்லது இரக்கம் கோரும் தீவிர வேண்டுதல்களைக் குறிக்கிறது. பெயர்ச்சொல் அமைப்பை இயல்பான தமிழ் வினைச்சொல் தொடராக மாற்றி, அதன் இரக்கம்கோரும் நுணுக்கத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை வழங்குதல்
  choice: யாவே
  alternative: யெகோவா
  rationale: மூலத்தில் இறைவனின் தனிப்பெயரே நேரடியாக உள்ளது. ‘யாவே’ என்பது ‘Yahweh’ என்ற ஒலிப்பைத் தமிழில் பிரதிபலிக்கிறது; அதை ‘ஆண்டவர்’ போன்ற பட்டமாக மாற்றுவதில்லை.
- issue: שָׁמַע என்பதன் பொருள்
  choice: கேட்டார்
  alternative: செவிகொடுத்தார்
  rationale: ‘செவிகொடுத்தார்’ என்பது வேண்டுதலுக்கு சாதகமாகப் பதிலளித்தார் என்ற கருத்தை வலுப்படுத்தக்கூடும். மூலத்தின் அடிப்படைப் பொருளையும் அதன் திறந்த நுணுக்கத்தையும் காக்க ‘கேட்டார்’ தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன பொதுத்தமிழில், துதிப்பாடலுக்கேற்ற கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘இரக்கம் வேண்டி நான் மன்றாடிய குரல்’ என்பது மூலத்தின் பெயர்ச்சொல் தொடரைத் தமிழில் இயல்பாக மாற்றுகிறது; அடிக்குறிப்பு அதன் நேரடி வடிவத்தையும் சொற்பொருள் மாற்றையும் பாதுகாக்கிறது.
