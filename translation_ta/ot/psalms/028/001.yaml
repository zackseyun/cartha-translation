  yaml_path: translation/ot/psalms/028/001.yaml
  text: Of David[a]. To you, O Yahweh, I call; my rock, do not be deaf to me[c][b], lest you be silent to me and I become like those who go down to the pit.
translation:
  language: ta
  text: 'தாவீதுக்குரியது.[a]


    யாவே, உம்மையே நோக்கிக் கூப்பிடுகிறேன்;


    என் கன்மலையே, எனக்குச் செவிடாயிராதீர்.[b]


    நீர் எனக்கு மௌனமாயிருந்தால்,


    நான் குழியில் இறங்குகிறவர்களைப்போல் ஆகிவிடுவேன்.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தாவீதின்,’ ‘தாவீதுக்காக,’ அல்லது ‘தாவீதினால்’ என்றும் பொருள்படலாம்.
    reason: மூலத் தலைப்பிலுள்ள לְדָוִד ஆசிரியத்துவம் அல்லது அர்ப்பணிப்பைத் தெளிவாக ஒரே விதத்தில் நிர்ணயிக்கவில்லை.
  - marker: b
    text: அல்லது, ‘என்னிடம் மௌனமாயிராதீர்.’
    reason: חרשׁ என்ற வினைச்சொல் கேளாமையையும் மௌனமாயிருப்பதையும் குறிக்கக்கூடும்.
  - marker: c
    text: ‘குழி’ என்பது கல்லறையையோ இறந்தோரின் உலகையோ குறிக்கலாம்.
    reason: בוֹר என்ற உருவகம் இச்சூழலில் மரணம் சார்ந்த விரிவான பொருள் கொண்டிருக்கிறது.
lexical_decisions:
- source_word: לְדָוִד
  choice: தாவீதின் பாடல்
  rationale: சங்கீதத் தலைப்பிலுள்ள לְ உரிமை, ஆசிரியத்துவம், அர்ப்பணிப்பு ஆகியவற்றில் ஒன்றைக் குறிக்கக்கூடும். இயல்பான தமிழ் தலைப்பாக ‘தாவீதின் பாடல்’ அமைந்தாலும், அதன் மூலமொழி ambiguity அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: אֵלֶיךָ
  choice: உம்மையே நோக்கி
  rationale: வேண்டுதல் யாவேயை நேரடியாக நோக்கியிருப்பதை இயல்பான தமிழில் வெளிப்படுத்துகிறது; ஏகாரம் எபிரெயச் சொற்றொடரின் முன்னிறுத்தலை உணர்த்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது பட்டமல்ல, தனிப்பட்ட இறைப்பெயரான நான்கெழுத்துப் பெயர்; அதனைத் தமிழில் ஒலிபெயர்த்து வழங்குகிறது.
- source_word: אֶקְרָא
  choice: கூப்பிடுகிறேன்
  rationale: இச்சூழலில் קרא என்பது ஜெபத்தில் அழைப்பதைக் குறிக்கிறது. ‘கூப்பிடுகிறேன்’ என்பது தீவிரத்தை மிகைப்படுத்தாமல் இயல்பாக உள்ளது.
- source_word: צוּרִי
  choice: என் கன்மலையே
  rationale: பாதுகாப்பும் உறுதியும் குறித்த மூல உருவகத்தை ‘அடைக்கலம்’ என விளக்கிப் பதிலிடாமல் பாதுகாக்கிறது.
- source_word: אַל תֶּחֱרַשׁ מִמֶּנִּי
  choice: எனக்குச் செவிகேளாதிராதீர்
  rationale: חרשׁ என்பதற்கு ‘செவிடாயிரு’ அல்லது ‘மௌனமாயிரு’ என்ற பொருள் வரலாம். அடுத்த வினைச்சொல்லின் மௌனக் கருத்திலிருந்து வேறுபாட்டைப் பாதுகாக்க, இங்கு கேளாமையை மையப்படுத்துகிறது.
- source_word: פֶּן תֶּחֱשֶׁה מִמֶּנִּי
  choice: நீர் எனக்கு மௌனமாயிருந்தால்
  rationale: פן அறிமுகப்படுத்தும் அஞ்சப்படும் நிலையை இயல்பான தமிழ் நிபந்தனை வடிவில் தருகிறது; இது ‘இல்லையெனில்’ என்ற தொடர்ச்சியையும் உள்ளடக்குகிறது.
- source_word: וְנִמְשַׁלְתִּי
  choice: நான் ... போல் ஆகிவிடுவேன்
  rationale: நிபால் வடிவின் ‘ஒப்பாகுதல்/ஒப்பிடப்படுதல்’ என்ற பொருளை, அஞ்சப்படும் விளைவைக் காட்டும் இயல்பான தமிழில் வழங்குகிறது.
- source_word: עִם יֹרְדֵי בוֹר
  choice: குழியில் இறங்குகிறவர்களைப்போல்
  rationale: בוֹר என்ற தெளிவான ‘குழி’ உருவகத்தைப் பாதுகாக்கிறது; அது கல்லறை அல்லது இறந்தோரின் உலகைச் சுட்டக்கூடிய பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பொதுப் பட்டம் அல்ல, உடன்படிக்கையின் தனிப்பட்ட இறைப்பெயர் நேரடியாக உள்ளது. எனவே பட்டத்தால் மாற்றாமல் ஒலிபெயர்க்கப்படுகிறது.
- issue: ‘குழி’ என்பதன் இறப்பியல் குறிப்பு
  choice: குழி என்ற உருவகத்தை அப்படியே வைத்தல்
  alternative: கல்லறை / இறந்தோரின் உலகம்
  rationale: மூலச்சொல் அடக்கம் அல்லது இறந்தோரின் நிலையைக் குறிப்பிட்டாலும், இவ்வசனத்தில் அதனை ஒரே கருத்தாகத் தீர்மானிக்காமல் உருவகத்தின் பரப்பைத் திறந்தே வைக்கிறது.
- issue: கடவுளின் கேளாமை மற்றும் மௌனம்
  choice: முதல் வினையை ‘செவிகேளாதிராதீர்’ என்றும் இரண்டாவதை ‘மௌனமாயிருந்தால்’ என்றும் வேறுபடுத்தல்
  alternative: இரண்டையும் ‘மௌனமாயிருத்தல்’ என மொழிபெயர்த்தல்
  rationale: அருகருகே வரும் חרשׁ மற்றும் חשה ஆகிய வினைகளின் சாத்தியமான சொல்விளையாட்டையும், கேட்காமை–பதிலளிக்காமை என்ற பதற்றத்தையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க தமிழில் கவிதை வரிகளாக அமைக்கப்பட்டுள்ளது. இறைவனை நோக்கி ‘உம்/நீர்’ மரியாதை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. ‘கன்மலை,’ ‘மௌனம்,’ ‘குழி’ ஆகிய மூல உருவகங்கள் விளக்கச் சொற்களால் மாற்றப்படாமல் பாதுகாக்கப்பட்டுள்ளன.
