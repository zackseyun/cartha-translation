  to: 'தாவீதுக்குரியது.[a]


    யாவே, உம்மையே நோக்கிக் கூப்பிடுகிறேன்;


    என் கன்மலையே, எனக்குச் செவிடாயிராதீர்.[b]


    நீர் எனக்கு மௌனமாயிருந்தால்,


    நான் குழியில் இறங்குகிறவர்களைப்போல் ஆகிவிடுவேன்.[c]'
  rationale: The revision corrects the negated Tamil verb so that it means ‘do not be deaf,’ rather than producing a double negative. It also removes the added genre label ‘பாடல்’ from the superscription while retaining its ambiguity in the footnote. The conditional rendering of פֶּן remains a natural Tamil expression of the feared consequence, and the contrast between divine deafness and silence is retained.
