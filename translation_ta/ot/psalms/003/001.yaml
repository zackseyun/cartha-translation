source:
  edition: WLC
  text: יְ֭הוָה מָֽה רַבּ֣וּ צָרָ֑/י רַ֝בִּ֗ים קָמִ֥ים עָלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/003/001.yaml
  text: O Yahweh[a], how many are my adversaries! Many are rising up against me.
translation:
  language: ta
  text: யாவே[a], என் எதிரிகள் எவ்வளவாய்ப் பெருகியிருக்கிறார்கள்! பலர் எனக்கு எதிராக எழும்புகிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில்: “யாவே”; இது தேவனுடைய தனிப்பெயர்.'
    reason: divine_name
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இஸ்ரவேலின் தேவனுடைய தனிப்பெயரைக் குறிக்கும் எபிரெய நான்கெழுத்துப் பெயரை, ஒரு பட்டமாக மாற்றாமல் தமிழில் ஒலிபெயர்த்துள்ளது.
- source_word: מָה רַבּוּ
  choice: எவ்வளவாய்ப் பெருகியிருக்கிறார்கள்
  rationale: מָה இங்கு வினாவாக அல்ல, வியப்பையும் புலம்பலையும் வெளிப்படுத்தும் சொல்லாக உள்ளது; רבה என்பதன் நிறைவுற்ற வினைவடிவம் எதிரிகளின் எண்ணிக்கை பெருகியுள்ளதைச் சுட்டுகிறது.
- source_word: צָרָי
  choice: என் எதிரிகள்
  rationale: பேசுகிறவருக்கு விரோதமாகச் செயல்படுவோரைக் குறிக்கும் இயல்பான, பரந்த பொருளுள்ள தமிழ் சொல்.
- source_word: רַבִּים
  choice: பலர்
  rationale: இரண்டாம் கூற்றின் தொடக்கத்தில் வலியுறுத்தப்பட்டுள்ள பன்மையைச் சுருக்கமாகவும் இயல்பாகவும் காக்கிறது.
- source_word: קָמִים עָלָי
  choice: எனக்கு எதிராக எழும்புகிறார்கள்
  rationale: קום என்பதன் பங்கேற்பு வடிவம் தொடரும் செயலைக் காட்டுகிறது; עַל உடன் சேர்ந்தபோது விரோதமாக எழுவதை உணர்த்துகிறது. குறிப்பிட்ட தாக்குதல் முறையை உரையில் சேர்க்கவில்லை.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரையில் பொதுப்பட்டம் அல்ல, தேவனுடைய தனிப்பெயரே உள்ளது. ஆகவே அந்தப் பெயரை மறைக்காமல் ஒலிபெயர்த்து, அதன் தனிப்பெயர் தன்மையை அடிக்குறிப்பில் தெளிவுபடுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சங்கீதப் புலம்பலுக்கேற்ற கண்ணியமான நேரடி நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. முதல் கூற்றின் வியப்பும், இரண்டாம் கூற்றில் ‘பலர்’ என்பதற்குள்ள வலியுறுத்தலும் காக்கப்பட்டுள்ளன.
