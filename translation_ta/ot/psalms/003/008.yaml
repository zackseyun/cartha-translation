  yaml_path: translation/ot/psalms/003/008.yaml
  text: Salvation belongs to Yahweh[a]; your blessing be on your people[b]. Selah
translation:
  language: ta
  text: மீட்பு யாவேவுக்கே உரியது; உமது ஆசீர்வாதம் உமது மக்கள் மேல் இருப்பதாக[a]. சேலா[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உமது ஆசீர்வாதம் உமது மக்கள் மேல் இருக்கிறது.” எபிரேயத் தொடர் வினைச்சொல் இல்லாதது; எனவே இதை ஓர் அறிவிப்பாகவோ வேண்டுதலாகவோ வாசிக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: ‘சேலா’ என்பது வழிபாட்டு அல்லது இசைக் குறியீடாக இருக்கலாம்; அதன் துல்லியமான பொருள் உறுதியாகத் தெரியவில்லை.
    reason: cultural_note
lexical_decisions:
- source_word: לַיהוָה
  choice: யாவேவுக்கே உரியது
  rationale: לְ இங்கு உடைமை அல்லது தொடர்பைக் குறிக்கிறது. ஆகவே மீட்பு யாவேவுக்கே உரியது என்ற பொருளை இயல்பான தமிழில் தருகிறது; יהוה என்பது தனிப்பட்ட இறைப்பெயராக ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: הַיְשׁוּעָה
  choice: மீட்பு
  rationale: இந்தப் பெயர்ச்சொல் ஆபத்திலிருந்து விடுவித்தல், காப்பாற்றுதல், வெற்றி ஆகிய கருத்துகளை உள்ளடக்குகிறது. ‘மீட்பு’ உடனடியான விடுதலையையும் விரிவான இறையியல் பொருளையும் சுருக்கமாகத் தக்கவைக்கிறது.
- source_word: עַל
  choice: மேல்
  rationale: ஆசீர்வாதம் மக்கள்மேல் தங்கியிருப்பதைக் குறிக்கும் இயல்பான தமிழ் இடச்சொல்.
- source_word: עַמְּךָ
  choice: உமது மக்கள்
  rationale: தேவனுக்கும் அவருக்குரிய சமூகத்திற்கும் உள்ள உறவைத் தெளிவாகத் தக்கவைக்கிறது. இறைவனை நோக்கிய மரியாதையான ஒருமை முன்னிலைப் பெயராக ‘உமது’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: בִרְכָתֶךָ
  choice: உமது ஆசீர்வாதம்
  rationale: בְּרָכָה என்பதன் நேரடியான பொருள் ‘ஆசீர்வாதம்’; ‘தயவு’ என்பதைக் காட்டிலும் இதன் பொருள் பரந்தது.
- source_word: סֶלָה
  choice: சேலா
  rationale: இதன் துல்லியமான பொருள் உறுதியற்றது; வழிபாட்டு அல்லது இசைக் குறியீடாக இருக்கலாம். எனவே ஊகித்து மொழிபெயர்க்காமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: எபிரெய உரையில் நான்கெழுத்து இறைப்பெயர் நேரடியாக வருகிறது. அதனை பொதுப்பட்டமாக மாற்றாமல் உடன்படிக்கையின் தனிப்பட்ட பெயராக ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைத் தக்கவைக்கிறது.
- issue: இரண்டாம் வினையற்ற தொடரின் இலக்கணப் பொருள்
  choice: உமது ஆசீர்வாதம் உமது மக்கள்மேல் இருப்பதாக
  alternative: உமது ஆசீர்வாதம் உமது மக்கள்மேல் இருக்கிறது
  rationale: எபிரெயத் தொடர் வினைச்சொல் இல்லாததால் வேண்டுதலாகவும் அறிக்கையாகவும் புரிந்துகொள்ள முடியும். சங்கீதத்தின் சூழலில் முதன்மை உரை வேண்டுதல் நயத்தை இயல்பான தமிழில் தருகிறது; அறிவிப்பு வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், வழிபாட்டு மரியாதையுடன் எளிதில் புரியும் கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘உமது’ மரியாதையான இறைமுகப்பையும், ‘இருப்பதாக’ வேண்டுதல் நயத்தையும் தருகின்றன; மூலத்தின் மாற்று அறிவிப்பு வாசிப்பு அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
