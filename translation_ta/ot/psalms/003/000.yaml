id: PSA.3.0
reference: Psalms 3:0
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: מִזְמ֥וֹר לְ/דָוִ֑ד בְּ֝/בָרְח֗/וֹ מִ/פְּנֵ֤י אַבְשָׁל֬וֹם בְּנֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/003/000.yaml
  text: A psalm of David[a], when he fled from Absalom his son.
translation:
  language: ta
  text: தாவீதின் சங்கீதம்[a]. அவர் தம் மகன் அப்சலோமிடமிருந்து தப்பியோடியபோது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தாவீது இயற்றிய சங்கீதம்’ அல்லது ‘தாவீதுக்கான சங்கீதம்’ என்றும் பொருள்கொள்ளலாம்; எபிரெய மேல்தலைப்பு ஆசிரியத்துவம், அர்ப்பணம் அல்லது தொடர்பைக் குறிக்கக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: מִזְמוֹר
  choice: சங்கீதம்
  rationale: இது இசை சார்ந்த கவிதைப் படைப்பைக் குறிக்கும் தலைப்பு வகைச்சொல். தமிழில் வேதாகமச் சூழலில் நிலைபெற்றுள்ள ‘சங்கீதம்’ என்பது பொதுவான ‘பாடல்’ என்பதைவிடத் துல்லியமானது.
- source_word: לְדָוִד
  choice: தாவீதின்
  rationale: לְ என்ற முன்னொட்டு ஆசிரியத்துவம், அர்ப்பணம் அல்லது தொடர்பைக் குறிக்கலாம். ‘தாவீதின்’ என்பது இவற்றுள் ஒன்றை மட்டும் தீர்மானிக்காமல் எபிரெய மொழியின் தெளிவின்மையை ஓரளவு தக்கவைக்கிறது.
- source_word: בְּבָרְחוֹ
  choice: அவர் தப்பியோடியபோது
  rationale: בְּ முன்னொட்டுடன் வினையெச்சப் பெயர்ச்சொல் மற்றும் மூன்றாம் ஆண்பால் ஒருமை பின்னொட்டு சேர்ந்த அமைப்பு இங்கு காலப்பொருளைத் தருகிறது; தமிழில் இது இயல்பாக ‘அவர் தப்பியோடியபோது’ என வழங்கப்படுகிறது.
- source_word: מִפְּנֵי
  choice: இடமிருந்து
  rationale: சொல்லளவில் ‘முகத்திலிருந்து/முன்னிலையிலிருந்து’ என்றாலும், ஒருவரிடமிருந்து தப்பியோடும் இச்சூழலில் ‘இடமிருந்து’ என்பது இயல்பான தமிழில் பொருளைத் துல்லியமாகத் தருகிறது.
- source_word: אַבְשָׁלוֹם
  choice: அப்சலோம்
  rationale: தனிப்பெயர் தமிழில் வழக்கமான ஒலிபெயர்ப்பு மரபின்படி வழங்கப்படுகிறது.
- source_word: בְּנוֹ
  choice: தன் மகன்
  rationale: மூன்றாம் ஆண்பால் ஒருமை உடைமைப் பின்னொட்டுடைய பெயர்ச்சொல். தமிழில் எழுவாயான தாவீதையே சுட்டும் இயல்பான தற்பொருட் பெயரடையாக ‘தன்’ பயன்படுத்தப்படுகிறது.
theological_decisions:
- issue: தாவீதுடன் தொடர்புடைய மேல்தலைப்பின் பொருள்
  choice: ‘தாவீதின்’ என்று மொழிபெயர்த்து தொடர்பின் வகையைத் தீர்மானிக்காமல் விடுதல்
  alternative: ‘தாவீது இயற்றியது’ அல்லது ‘தாவீதுக்காக’
  rationale: சங்கீத மேல்தலைப்புகளில் לְ ஆசிரியத்துவம், அர்ப்பணம், தொகுப்பு சார்பு அல்லது பொதுத் தொடர்பைக் குறிக்கக்கூடும். எபிரெய உரை இவற்றுள் ஒன்றை கட்டாயப்படுத்தாததால், மொழிபெயர்ப்பு அதைவிட வலுவான வரலாற்றுக் கூற்றைச் செய்யவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட நடை. ‘சங்கீதம்’ என்ற நிலைபெற்ற வேதாகம வகைச்சொல் பயன்படுத்தப்பட்டுள்ளது. வரலாற்றுப் பின்னணியை இயல்பாகச் சொல்ல இறுதியில் ‘பாடியது’ சேர்க்கப்பட்டுள்ளது; இது தலைப்பின் சங்கீத இயல்பை வெளிப்படுத்துகிறது, ஆசிரியத்துவக் கேள்வியைத் தீர்மானிப்பதில்லை.
