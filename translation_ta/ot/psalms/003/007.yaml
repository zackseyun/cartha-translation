source:
  edition: WLC
  text: ק֘וּמָ֤/ה יְהוָ֨ה הוֹשִׁ֘יעֵ֤/נִי אֱלֹהַ֗/י כִּֽי הִכִּ֣יתָ אֶת כָּל אֹיְבַ֣/י לֶ֑חִי שִׁנֵּ֖י רְשָׁעִ֣ים שִׁבַּֽרְתָּ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/003/007.yaml
  text: Rise up[a], O Yahweh; save me, my God. For you have struck all my enemies on the cheek; you have broken the teeth of the wicked.
translation:
  language: ta
  text: யாவே, எழுந்தருளும்; என் கடவுளே, என்னைக் காப்பாற்றும். ஏனெனில், என் பகைவர்கள் அனைவரையும் நீர் கன்னத்தில் அடித்திருக்கிறீர்[a]; பொல்லாதவர்களின் பற்களை உடைத்திருக்கிறீர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நீர் என் பகைவர்கள் அனைவரையும் தாடையில் அடித்திருக்கிறீர்; பொல்லாதவர்களின் பற்களை உடைத்திருக்கிறீர்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய நிறைவுவினைகள் முடிவுற்ற செயலையோ, உறுதியாக எதிர்பார்க்கப்படும் செயலையோ, வழக்கமான செயலையோ குறிக்கலாம்; எனவே, ‘அடிக்கிறீர் … உடைக்கிறீர்’ என்றும் மொழிபெயர்க்கலாம். לֶחִי என்பது ‘கன்னம்’ அல்லது ‘தாடை’ எனப் பொருள்படும்.
    reason: לֶחִי என்பதன் ‘கன்னம்/தாடை’ பொருள் தெளிவின்மையையும், இரு எபிரெய நிறைவுவினைகளின் முடிவுற்ற, உறுதியான, அல்லது குணநிலையான செயல்பொருள் சாத்தியங்களையும் பாதுகாக்கிறது.
lexical_decisions:
- source_word: קוּמָה
  choice: எழுந்தருளும்
  rationale: קום என்பதன் கட்டளை வடிவம். கடவுளிடம் நேரடியாக விடுக்கப்படும் வேண்டுகோளுக்கேற்ற மரியாதையையும், அவர் தலையிட வேண்டும் என்ற உயிரோட்டமான அழைப்பையும் இயல்பான தமிழில் தருகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: இது ஒரு பட்டப்பெயராக மாற்றப்படாமல், எபிரெயத் தெய்வீகப் பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பாக வழங்கப்படுகிறது.
- source_word: הוֹשִׁיעֵנִי
  choice: என்னைக் காப்பாற்றும்
  rationale: ישׁע என்பதன் ஹிஃபில் கட்டளை வடிவமும் முதலாம் நபர் ஒருமை பின்னொட்டும். உடனடி ஆபத்திலிருந்து மீட்பது என்ற பரந்த அடிப்படைப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: אֱלֹהַי
  choice: என் கடவுளே
  rationale: தனிப்பட்ட உரிமை மற்றும் நேரடி அழைப்பைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: வேண்டுகோளுக்கான காரணத்தை அறிமுகப்படுத்தும் விளக்க/காரணத் தொடர்பை வெளிப்படுத்துகிறது.
- source_word: הִכִּיתָ
  choice: அடித்திருக்கிறீர்
  rationale: எபிரெய நிறைவுவினையின் முடிவுற்ற செயல் வலிமையைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; கவிதைச் சூழலில் உறுதியான அல்லது குணநிலையான செயல் என்ற சாத்தியம் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: אֶת כָּל אֹיְבַי
  choice: என் பகைவர்கள் அனைவரையும்
  rationale: நேரடிப் பொருள் தொடரைத் தெளிவாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: לֶחִי
  choice: கன்னத்தில்
  rationale: לחי என்பது கன்னம் அல்லது தாடையைக் குறிக்கலாம். அடித்தல் என்பதுடன் ‘கன்னத்தில்’ இயல்பாக அமைந்து அவமானப்படுத்துதல் மற்றும் தோற்கடித்தல் ஆகிய படிமங்களைப் பாதுகாக்கிறது; ‘தாடை’ என்ற சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: שִׁנֵּי רְשָׁעִים
  choice: பொல்லாதவர்களின் பற்களை
  rationale: உடல் சார்ந்த மூலப் படிமத்தை மழுங்கடிக்காமல், பெயர்ச்சொல்லாகப் பயன்படும் பன்மை உரிச்சொல்லை இயல்பான கூட்டுப்பொருளில் வழங்குகிறது.
- source_word: שִׁבַּרְתָּ
  choice: உடைத்திருக்கிறீர்
  rationale: நிறைவுவினையின் முடிவுற்ற செயல் வலிமையையும், பற்களை முறித்து வலிமையிழக்கச் செய்யும் தெளிவான படிமத்தையும் பாதுகாக்கிறது.
theological_decisions:
- issue: הִכִּיתָ மற்றும் שִׁבַּרְתָּ என்ற எபிரெய நிறைவுவினைகளின் கால/நிலைப் பொருள்
  choice: முடிவுற்ற செயலைக் குறிக்கும் ‘அடித்திருக்கிறீர் ... உடைத்திருக்கிறீர்’
  alternative: குணநிலை அல்லது உறுதியான செயலைக் குறிக்கும் ‘அடிக்கிறீர் ... உடைக்கிறீர்’
  rationale: வடிவியல் ரீதியாக இவை நிறைவுவினைகள் என்பதால் முதன்மை உரையில் முடிவுற்ற செயல் முன்னிலைப்படுத்தப்படுகிறது. இருப்பினும் கவிதை வேண்டுதலில் கடந்த செயல், உறுதியாக எதிர்பார்க்கப்படும் செயல், அல்லது கடவுளின் வழக்கமான செயல் ஆகிய நுணுக்கங்கள் சாத்தியமானவை; அவை அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- issue: பகைவர்களை நோக்கிய வன்மையான உடல் படிமம்
  choice: கன்னத்தில் அடித்தல், பற்களை உடைத்தல் என்ற நேரடி படிமத்தைத் தக்கவைத்தல்
  alternative: ‘பொல்லாதவர்களைத் தோற்கடித்தீர்’ போன்ற கருத்துச் சுருக்கம்
  rationale: மூல எபிரெயம் அவமானப்படுத்துதல் மற்றும் தீங்கு செய்யும் ஆற்றலை முறித்தல் ஆகியவற்றைக் காட்டும் தெளிவான உடல் படிமத்தைப் பயன்படுத்துகிறது. அதை மென்மைப்படுத்துவது கவிதையின் வலிமையைக் குறைக்கும்.
translation_notes:
  register: நவீன நிலையான, மரியாதைமிக்க தமிழ் பயன்படுத்தப்பட்டுள்ளது. இறைவனை நோக்கிய வேண்டுதலில் ‘எழுந்தருளும்’, ‘காப்பாற்றும்’ என்ற இலக்கியத்தன்மையுள்ள ஆனால் புரிந்துகொள்ள எளிய வடிவங்கள் தேர்ந்தெடுக்கப்பட்டுள்ளன. மூலத்தின் இணைநிலை அமைப்பும் வலிமையான உடல் படிமமும் தக்கவைக்கப்பட்டுள்ளன.
