reference: Psalms 3:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: רַבִּים֮ אֹמְרִ֪ים לְ/נַ֫פְשִׁ֥/י אֵ֤ין יְֽשׁוּעָ֓תָ/ה לּ֬/וֹ בֵֽ/אלֹהִ֬ים סֶֽלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/003/002.yaml
  text: Many are saying of me[c][b][a], “There is no salvation for him in God.” Selah
translation:
  language: ta
  text: பலர் என்னைக் குறித்து[a], “தேவனிடத்தில் அவனுக்கு மீட்பு இல்லை[b]” என்று சொல்லிக்கொண்டிருக்கிறார்கள். சேலா.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில் சொல்லுக்குச் சொல், ‘என் ஆத்துமாவிடம்’; இங்கு அந்த மரபுத்தொடர் ‘என்னைக் குறித்து’ அல்லது ‘என்னைப் பற்றி’ என்று பொருள்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது ‘விடுதலை இல்லை.’
    reason: lexical_alternative
  - marker: c
    text: ‘சேலா’ என்பது இசை அல்லது வழிபாட்டில் பயன்படுத்தப்பட்ட சொல்லாக இருக்கலாம்; அதன் துல்லியமான பொருள் உறுதியாகத் தெரியவில்லை.
    reason: cultural_note
lexical_decisions:
- source_word: רַבִּים
  choice: பலர்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் இந்தப் பன்மை உரிச்சொல் எண்ணிக்கையில் அதிகமான மனிதர்களைக் குறிக்கிறது; ‘பலர்’ என்பது சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: אֹמְרִים
  choice: சொல்லிக்கொண்டிருக்கிறார்கள்
  rationale: எபிரெயப் பங்கேற்புவினை தொடர்ந்து அல்லது திரும்பத் திரும்ப நடைபெறும் செயலை உணர்த்துவதால், நிகழ்கால நீடித்த தன்மையை இந்த வடிவம் வெளிப்படுத்துகிறது.
- source_word: לְנַפְשִׁי
  choice: என்னைக் குறித்து
  rationale: சொல்லுக்குச் சொல் ‘என் ஆத்துமாவிடம்’ என்றாலும், נֶפֶשׁ இங்கு முழு மனிதரையோ தன்னையோ குறிக்கும் மரபுத்தொடராக உள்ளது. ‘என்னைக் குறித்து’ என்பது சூழலில் இயல்பாகவும் தெளிவாகவும் இருக்கிறது.
- source_word: אֵין
  choice: இல்லை
  rationale: இது இருப்பை மறுக்கும் வழக்கமான எபிரெய வடிவம்; தமிழில் ‘இல்லை’ அதற்கு நேரான, இயல்பான இணை.
- source_word: יְשׁוּעָתָה
  choice: மீட்பு
  rationale: இந்தச் சொல் ஆபத்திலிருந்து காப்பாற்றுதல் அல்லது விடுவித்தலைக் குறிக்கிறது. ‘மீட்பு’ உடனடியான காப்பையும் பரந்த இறையியல் ஒலிப்பையும் தக்கவைக்கிறது.
- source_word: לּוֹ
  choice: அவனுக்கு
  rationale: எதிரிகள் சங்கீதக்காரரை மேற்கோளுக்குள் மூன்றாம் நபராகச் சுட்டுகின்றனர்; ‘அவனுக்கு’ இதைத் தெளிவாகக் காட்டுகிறது.
- source_word: בֵאלֹהִים
  choice: தேவனிடத்தில்
  rationale: בְּ என்பதன் ‘இல்/இடத்தில்/உடன்’ என்ற பரப்பைத் தமிழில் இயல்பாக வெளிப்படுத்தி, ‘தேவனிடமிருந்து’ என்று காரணம் அல்லது மூலத்தை மிகத் தெளிவாக நிர்ணயிப்பதைத் தவிர்க்கிறது.
- source_word: סֶלָה
  choice: சேலா
  rationale: இந்தச் சொல்லின் துல்லியமான பொருள் உறுதியற்றது; ஊகமான விளக்கத்தை உரைக்குள் புகுத்தாமல் ஒலிபெயர்ப்பு செய்யப்பட்டுள்ளது.
theological_decisions:
- issue: יְשׁוּעָה என்பதை உடனடியான விடுவிப்பாக மட்டுமா அல்லது பரந்த இறையியல் ஒலிப்புடன் மொழிபெயர்ப்பதா
  choice: மீட்பு
  alternative: விடுதலை / காப்பு
  rationale: சூழலில் இது ஆபத்திலிருந்து கிடைக்கும் உதவியையும் காப்பையும் குறிக்கிறது; அதேவேளை சங்கீதங்களில் காணப்படும் பரந்த இறையியல் வலிமையையும் ‘மீட்பு’ தக்கவைக்கிறது, ஆனால் அதை மறுமை இரட்சிப்பாக மட்டும் சுருக்குவதில்லை.
- issue: לְנַפְשִׁי என்பதிலுள்ள נֶפֶשׁ-ஐ தனியான ஆன்மீகக் கூறாகப் புரிந்துகொள்வதா அல்லது முழு நபரைக் குறிக்கும் மரபுத்தொடராக மொழிபெயர்ப்பதா
  choice: என்னைக் குறித்து
  alternative: என் ஆத்துமாவிடம்
  rationale: இங்கு נֶפֶשׁ சங்கீதக்காரரின் முழு நபரைக் குறிக்கிறது. சொல்லுக்குச் சொல் மொழிபெயர்த்தால் மூலத்தில் அவசியமில்லாத உடல்–ஆத்துமா பிரிவை வாசகர் எண்ணக்கூடும்.
- issue: בֵאלֹהִים என்பதன் முன்னிடைச்சொல் உறவைத் தீர்மானித்தல்
  choice: தேவனிடத்தில்
  alternative: தேவனிடமிருந்து
  rationale: ‘தேவனிடத்தில்’ என்பது எபிரெய בְּ-யின் ‘இல்/உடன்’ சார்ந்த உறவைத் தக்கவைக்கிறது. ‘தேவனிடமிருந்து’ என்பது மீட்பின் மூலத்தை வெளிப்படையாகக் குறிப்பிடும் சாத்தியமான விளக்கம் என்றாலும், மூலத்தின் இலக்கணத்தை விட அதிகமாகத் தீர்மானிக்கிறது.
translation_notes:
  register: நவீன செந்தமிழ் சார்ந்த, பொதுவாசகர்களுக்கு எளிதில் புரியும் மரியாதையான நடை பயன்படுத்தப்பட்டுள்ளது. ‘சொல்லிக்கொண்டிருக்கிறார்கள்’ தொடர்ச்சியான குற்றச்சாட்டை வெளிப்படுத்துகிறது. ‘தேவனிடத்தில்’ மூலத்தின் முன்னிடைச்சொல் உறவிலுள்ள நுண்ணிய தெளிவின்மையை இயல்பான தமிழில் பாதுகாக்கிறது; ‘சேலா’ விளக்கமின்றி உரைக்குள் மொழிபெயர்க்கப்படாமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
