lexical_decisions:
- source_word: לֹא אִירָא
  choice: நான் அஞ்சமாட்டேன்
  rationale: எதிர்மறைத் துகளுடன் வரும் முதல் நபர் ஒருமை imperfect வினை, இச்சூழலில் நம்பிக்கையுடன் கூடிய உறுதியை வெளிப்படுத்துகிறது; தமிழில் ‘அஞ்சமாட்டேன்’ என்பது அதனை இயல்பாகத் தருகிறது.
- source_word: מֵרִבְבוֹת עָם
  choice: பல்லாயிரக்கணக்கான மக்களுக்கு
  rationale: רְבָבוֹת மிகப் பெரும் எண்ணிக்கையைக் குறிக்கிறது; அதை ஒரு துல்லியமான நிலையான எண்ணாகக் கட்டுப்படுத்தாமல் ‘பல்லாயிரக்கணக்கான’ என்று வழங்குவது கவிதையின் பெருந்திரள் படிமத்தைப் பாதுகாக்கிறது. ירא வினையோடு வரும் מִן தமிழில் அஞ்சுதலின் பொருளைக் குறிக்கும் ‘-க்கு’ வேற்றுமையால் இயல்பாகத் தரப்படுகிறது.
- source_word: אֲשֶׁר
  choice: —உம் / தொடர்பு வினையெச்ச அமைப்பு
  rationale: மக்களை விவரிக்கும் தொடர்புச் சொல்லை, இயல்பான தமிழில் ‘அணிவகுத்து நிற்கும் ... மக்கள்’ என்ற பெயரெச்சத் தொடரால் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: סָבִיב
  choice: என்னைச் சுற்றிலும்
  rationale: எல்லாப் பக்கங்களிலுமிருந்து சூழ்ந்திருக்கும் இடவியல் படிமத்தை இயல்பாகவும் தெளிவாகவும் தருகிறது.
- source_word: שָׁתוּ עָלָי
  choice: அணிவகுத்து நிற்கும்
  rationale: שָׁתוּ என்பது ‘வைத்தனர்/நிறுத்தினர்’ என்ற அடிப்படைப் பொருளைக் கொண்டிருந்தாலும், இங்குள்ள பகைமை மற்றும் சூழ்ந்திருக்கும் பின்னணியில் தங்களை நிலைநிறுத்தியிருப்பதை ‘அணிவகுத்து நிற்கும்’ எனத் தருவது இயல்பானது. עָלָי-இன் ‘எனக்கு எதிராக’ என்ற சாத்தியமான வலிமை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
