translation:
  language: ta
  text: 'நான் படுத்துத் தூங்கினேன்;

    விழித்தெழுந்தேன்;

    ஏனெனில் யாவே என்னைத் தாங்குகிறார்.[a]'
  philosophy: optimal-equivalence
  footnotes:
