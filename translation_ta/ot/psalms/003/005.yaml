    text: அல்லது, “என்னை ஆதரிக்கிறார்” அல்லது “என்னை நிலைநிறுத்துகிறார்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁכַבְתִּי
  choice: நான் படுத்து
  rationale: שׁכב என்பதன் அடிப்படைப் பொருள் ‘படுத்துக்கொள்/படு’. தூக்கத்துடன் இயல்பாக இணையும் வகையில் ‘படுத்து’ என மொழிபெயர்க்கப்பட்டது.
- source_word: וָאִישָׁנָה
  choice: தூங்கினேன்
  rationale: ישׁן என்பது ‘தூங்கு’ என்று பொருள்படும். எபிரெயச் செய்யுளின் சுருக்கமான செயல்தொடரைத் தமிழில் இயல்பாகப் பேணுகிறது.
- source_word: הֱקִיצוֹתִי
  choice: விழித்தெழுந்தேன்
  rationale: קיץ என்பது இங்கு தன்வினையாக ‘விழித்தெழு’ என்று பொருள்படும். ‘விழித்தெழுந்தேன்’ என்பது தூக்கத்திலிருந்து விழித்ததைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: பேசுகிறவர் பாதுகாப்பாக விழித்தெழுந்ததற்கான காரணத்தை அறிமுகப்படுத்தும் காரணப்பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் வரும் இறைப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் அதன் பரவலான ஒலிபெயர்ப்பான ‘யாவே’ என்று வழங்குகிறது.
- source_word: יִסְמְכֵנִי
  choice: என்னைத் தாங்குகிறார்
  rationale: סמך என்பது ‘தாங்கு, ஆதரி, நிலைநிறுத்து’ என்னும் பொருள் கொண்டது. எபிரெய இறந்தகால வினைகளுக்குப் பின் வரும் நிறைவுறா வினை, யாவேயின் தொடர்ந்த ஆதரவைச் சுட்டுவதால் நிகழ்கால வடிவம் பயன்படுத்தப்பட்டது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூல உரை ஒரு பட்டத்தையல்ல, நான்கெழுத்து இறைப் பெயரையே பயன்படுத்துகிறது. எனவே பெயரின் தன்மையைப் பேணும் ஒலிபெயர்ப்பு தேர்ந்தெடுக்கப்பட்டது.
- issue: יִסְמְכֵנִי என்பதன் காலமும் தெய்வீகச் செயலும்
  choice: என்னைத் தாங்குகிறார்
  alternative: என்னைத் தாங்கினார்; என்னை நிலைநிறுத்துகிறார்
  rationale: எபிரெய நிறைவுறா வடிவம் சூழலில் தொடர்ந்து நடைபெறும் அல்லது வழக்கமான ஆதரவைச் சுட்டலாம். குறிப்பிட்ட ஒரு கடந்தகாலச் செயல் என்று மட்டும் கட்டுப்படுத்தாமல் அந்தத் திறந்த தன்மை பேணப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிமையானதாயினும் சங்கீதத்திற்கேற்ற கண்ணியமான செய்யுள் நடையில் அமைக்கப்பட்டது. மூலத்தின் மூன்று சுருக்கமான அசைவுகள் தனித்தனி வரிகளாகப் பேணப்பட்டுள்ளன.
