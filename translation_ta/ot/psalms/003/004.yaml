  yaml_path: translation/ot/psalms/003/004.yaml
  text: With my voice I cry to Yahweh[a], and he answers me from his holy mountain[b]. Selah
translation:
  language: ta
  text: என் குரலால் யாவேவிடம் கூப்பிடுகிறேன்; அவர் தமது பரிசுத்த மலையிலிருந்து எனக்குப் பதிலளிக்கிறார்[a]. சேலா.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர் தமது பரிசுத்த மலையிலிருந்து எனக்குப் பதிலளித்தார்.” சூழலின்படி எபிரெய வினைச்சொல்லை இறந்தகாலத்திலும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ק֭וֹלִי
  choice: என் குரலால்
  rationale: ‘என் குரல்’ என்ற பெயர்ச்சொல் வடிவத்தையும், அதிலுள்ள கருவிப்பொருளையும் காத்து, எபிரெய உரையின் முன்னிலைப்படுத்தலை இயன்றவரை பிரதிபலிக்கிறது.
- source_word: אֶל
  choice: நோக்கி
  rationale: வேண்டுதலில் யாவேவை நோக்கிய திசையையும் அணுகுமுறையையும் இயல்பான தமிழில் குறிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது ஒரு பட்டப்பெயரால் மாற்றப்படாமல், எபிரெய தேவநாமத்தின் ஒலிபெயர்ப்பாக வழங்கப்படுகிறது.
- source_word: אֶקְרָא
  choice: கூப்பிடுகிறேன்
  rationale: துன்பத்தின் சூழலில் உதவிக்காக உரக்க அழைக்கும் பொருளை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; ‘அழைக்கிறேன்’ என்பதைக் காட்டிலும் இச்சூழலில் தெளிவானது.
- source_word: וַיַּעֲנֵנִי
  choice: அவர் எனக்குப் பதிலளிக்கிறார்
  rationale: கவிதைச் சூழலின் உயிரோட்டத்தையும் தேவன் பதிலளிப்பார் என்ற சங்கீதக்காரரின் நம்பிக்கையையும் நிகழ்காலம் வெளிப்படுத்துகிறது. இறந்தகால மொழிபெயர்ப்பும் இலக்கணப்படி சாத்தியமாதலால் அது அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: מֵהַר קָדְשׁוֹ
  choice: தமது பரிசுத்த மலையிலிருந்து
  rationale: הַר என்பதன் அடிப்படைப் பொருளான ‘மலை’ என்பதைக் காக்கிறது. மரியாதை ஒருமைக்கு ஏற்ற ‘தமது’ என்பது யாவேவைக் குறிப்பதைத் தெளிவாக்குகிறது.
- source_word: סֶלָה
  choice: சேலா
  rationale: இச்சொல்லின் துல்லியமான பொருளும் இசைச்செயல்பாடும் உறுதியற்றவை; ஆகவே விளக்கமாக மாற்றாமல் ஒலிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற தேவநாமத்தை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல உரையிலுள்ள தனிப்பட்ட தேவநாமத்தை ஒரு பட்டப்பெயரால் மாற்றாமல் காக்கிறது; ‘யாவே’ என்பது அதன் ஏற்றுக்கொள்ளப்பட்ட ஒலிபெயர்ப்பாகும்.
- issue: וַיַּעֲנֵנִי என்பதன் காலம்/வினைநோக்கு
  choice: 'நிகழ்காலம்: ‘பதிலளிக்கிறார்’'
  alternative: 'இறந்தகாலம்: ‘பதிலளித்தார்’'
  rationale: எபிரெயக் கவிதையில் இவ்வடிவம் சூழலுக்கேற்ப உயிரோட்டமுள்ள அல்லது பொதுவான செயலைக் குறிக்கலாம்; அதேவேளை வடிவரீதியான இறந்தகால வாசிப்பும் உண்மையான சாத்தியம். அந்தத் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: ‘பரிசுத்த மலை’ குறிக்கும் இடம்
  choice: இடத்தைப் பெயரிட்டு விளக்காமல் ‘தமது பரிசுத்த மலை’ என வைத்தல்
  alternative: ‘சீயோன் மலை’ என்று வெளிப்படையாகக் குறிப்பிடுதல்
  rationale: இது சீயோனைக் குறிப்பதாக இருக்க வாய்ப்புள்ளபோதும், வசனம் அந்தப் பெயரை நேரடியாகச் சொல்லவில்லை; எனவே மூலத்தின் குறிப்பளவையே காக்கிறது.
translation_notes:
  register: நவீன செந்தமிழ் நடை; வழிபாட்டு கண்ணியத்தைத் தக்கவைத்தபடியே சாதாரண வாசகருக்குப் புரியும் சொற்கள் தேர்ந்தெடுக்கப்பட்டுள்ளன. எபிரெயக் கவிதையின் முன்னிலைப்படுத்தலைக் காக்க ‘என் குரலால்’ தொடக்கத்தில் வைக்கப்பட்டுள்ளது. ‘சேலா’ விளக்கமின்றி ஒலிபெயர்க்கப்பட்டுள்ளது.
