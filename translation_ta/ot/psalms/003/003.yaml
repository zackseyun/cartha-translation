base_translation:
  language: en
  yaml_path: translation/ot/psalms/003/003.yaml
  text: But you[a], O Yahweh, are a shield around me, my glory[b], and the one who lifts up my head.
translation:
  language: ta
  text: ஆனால், யாவே, நீரே என்னைச் சுற்றியிருக்கும் கேடயம்[a]; நீரே என் மகிமை, என் தலையை உயர்த்துகிறவர்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘எனக்கான கேடயம்’ அல்லது ‘என் சார்பாக இருக்கும் கேடயம்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய முன்னிடைச்சொல் ஒருவருக்கு ஆதரவாகப் பாதுகாப்பதைக் குறிக்கலாம்; இங்கு பாதுகாப்பாகச் சூழ்ந்திருப்பது என்ற பொருள் மிகப் பொருத்தமாகத் தெரிகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘என் தலையை உயர்த்துகிறவர்’ என்பது மானம் அல்லது துணிவை மீட்டுத் தருவதையும், ஒருவரின் நியாயத்தை நிலைநாட்டுவதையும் குறிக்கக்கூடிய எபிரெய மரபுத்தொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: ஆனால் ... நீரோ
  rationale: இணைப்புச்சொல்லுடன் வரும் தனிப்பட்ட முன்னிலைப்பெயர், முந்தைய துயரநிலைக்கு வலுவான எதிர்மறை மாறுபாட்டை உருவாக்குகிறது. ‘ஆனால் ... நீரோ’ என்பது அந்த வலியுறுத்தலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெயத் திருமொழியில் உள்ள இறைத் தனிப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் ஒலிபெயர்த்துள்ளது.
- source_word: מָגֵן
  choice: கேடயம்
  rationale: இச்சொல் தாக்குதலிலிருந்து காக்கும் கேடயத்தைக் குறிக்கிறது; மூலத்தின் உருவகத்தை நேரடியாகத் தக்கவைக்கிறது.
- source_word: בַּעֲדִי
  choice: என்னைச் சுற்றியிருக்கும்
  rationale: இந்த முன்னிடைச்சொல் ‘எனக்காக’ அல்லது ‘என் சார்பாக’ என்றும் பொருள்படலாம். கேடய உருவகத்துடன் இங்கு பாதுகாப்பாகச் சூழ்ந்திருப்பது என்ற பொருள் பொருத்தமாக உள்ளது; இருப்பினும் மாற்றுப் பொருள் அடிக்குறிப்பில் தக்கவைக்கப்படுகிறது.
- source_word: כְּבוֹדִי
  choice: என் மகிமை
  rationale: כבוד என்பதன் ‘மகிமை, கனம், மானம்’ என்ற பொருள் பரப்பைச் சுருக்காமல், கவிதையின் செறிவான உரையைப் பாதுகாக்கிறது.
- source_word: וּ/מֵרִים
  choice: உயர்த்துகிறவர்
  rationale: எபிரெயப் பங்கேற்புவினை தொடர்ந்த அல்லது இயல்பான செயலைக் காட்டுகிறது; ‘உயர்த்துகிறவர்’ அதை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: רֹאשִׁי
  choice: என் தலையை
  rationale: மூலத்தின் நேரடியான உடல் உருவகத்தைப் பாதுகாக்கிறது; அதன் மரபுத்தொடர் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் தனிப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல உரை இறைவனின் தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. அதை ஒரு பொதுப் பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் தன்மையைப் பாதுகாக்கிறது.
- issue: ‘என் தலையை உயர்த்துகிறவர்’ என்ற மரபுத்தொடர்
  choice: முதன்மை உரையில் நேரடியான உருவகத்தைத் தக்கவைத்தல்
  alternative: என் மானத்தை மீட்டுத் தருகிறவர்; எனக்குத் துணிவளிக்கிறவர்; என்னை வெற்றிபெறச் செய்கிறவர்
  rationale: இந்த எபிரெய உருவகம் மானம், துணிவு, மீட்பு அல்லது குற்றமற்றவரென நிலைநாட்டப்படுதல் ஆகிய பல நுட்பங்களை உள்ளடக்கலாம். அவற்றில் ஒன்றை மட்டும் முதன்மை உரையில் தேர்ந்தெடுத்து மற்றவற்றை நீக்காமல், விளக்கத்தை அடிக்குறிப்பில் தருவது கவிதை மற்றும் பொருள் செறிவைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதில் புரியக்கூடிய, ஆனால் சங்கீதக் கவிதைக்குரிய கண்ணியமும் செறிவும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. இறைவனைச் சுட்டும் இடங்களில் மரியாதைப் பன்மையான ‘நீர்’ பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் கேடயம் மற்றும் தலை உயர்த்துதல் ஆகிய உருவகங்கள் விளக்கவுரையாக மாற்றப்படாமல் தக்கவைக்கப்பட்டுள்ளன.
