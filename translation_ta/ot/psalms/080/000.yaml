  text: 'For the choir director: according to “Lilies.” A testimony[b][a]. A psalm of Asaph.'
translation:
  language: ta
  text: 'இசைத் தலைவருக்கு: “அல்லிகள்” என்ற மெட்டின்படி. ஒரு சாட்சி.[a] ஆசாபின் சங்கீதம்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “இசைத் தலைவருக்கு: ‘அல்லிகள்’ என்ற மெட்டில். சாட்சி. ஆசாபுக்குரிய சங்கீதம்.” இந்த எபிரெயத் தலைப்பு இசை அல்லது வழிபாடு தொடர்பான குறிப்புகளைப் பாதுகாத்திருக்கலாம்; அவற்றின் துல்லியமான பொருள் உறுதியாகத் தெரியவில்லை.'
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: இசைத் தலைவருக்கு
  rationale: இசை நிகழ்த்துதலை மேற்பார்வையிடுபவரைக் குறிக்கும் சங்கீதத் தலைப்புச் சூத்திரம்; நவீன தமிழில் இயல்பாகவும் வழிபாட்டுச் சூழலைக் காக்கும் வகையிலும் மொழிபெயர்க்கப்பட்டது.
- source_word: אֶל
  choice: என்ற மெட்டின்படி
  rationale: சங்கீதத் தலைப்புகளில் இசை மெட்டு அல்லது பாடும் முறையை அறிமுகப்படுத்தும் முன்னிடைச்சொல்; சூழலுக்கேற்ற பொருள் வெளிப்படுமாறு மொழிபெயர்க்கப்பட்டது.
- source_word: שֹׁשַׁנִּים
  choice: “அல்லிகள்”
  rationale: இது பெரும்பாலும் ஒரு மெட்டு அல்லது இசைக் குறியீட்டின் பெயர்; நேரடியான மலர்க் குறிப்பாகப் புரிந்துகொள்ளப்படாதபடி மேற்கோள் குறிகளுக்குள் தரப்பட்டது.
- source_word: עֵדוּת
  choice: ஒரு சாட்சி
  rationale: ‘சாட்சி’ அல்லது வழிபாட்டு/இசைக் குறிப்பு என்ற சாத்தியத்தைத் தீர்மானிக்காமல், எபிரெயச் சொல்லின் அடிப்படைப் பொருளையும் அதன் தெளிவின்மையையும் காக்கிறது.
- source_word: לְאָסָף
  choice: ஆசாபின்
  rationale: ஆசிரியத்துவம், தொடர்பு, அல்லது தொகுப்பைச் சேர்ந்திருத்தல் ஆகியவற்றில் ஒன்றை மிகையாகத் தீர்மானிக்காமல் தமிழில் இயல்பான உடைமை வடிவம் பயன்படுத்தப்பட்டது.
- source_word: מִזְמוֹר
  choice: சங்கீதம்
  rationale: இசையுடன் பாடப்படும் புனிதப் பாடலைக் குறிக்கும் வழக்கமான, பரவலாகப் புரிந்துகொள்ளப்படும் தமிழ்ச் சொல்.
