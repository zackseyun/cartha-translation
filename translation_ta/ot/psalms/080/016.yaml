source:
  edition: WLC
  text: שְׂרֻפָ֣ה בָ/אֵ֣שׁ כְּסוּחָ֑ה מִ/גַּעֲרַ֖ת פָּנֶ֣י/ךָ יֹאבֵֽדוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/016.yaml
  text: Burned with fire, cut down—at the rebuke of your face they perish.
translation:
  language: ta
  text: தீயால் எரிக்கப்பட்டு, வெட்டி வீழ்த்தப்பட்டது—உமது முகத்தின் கடிந்துகொள்ளுதலால் அவர்கள் அழிந்துபோகிறார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׂרֻפָה בָאֵשׁ
  choice: தீயால் எரிக்கப்பட்டு
  rationale: பெண்பால் ஒருமை செயல்பாட்டு எச்சப் பொருளைத் தக்கவைத்து, முந்தைய வசனங்களில் வரும் திராட்சைக்கொடியைக் குறிக்கும் இயல்பான தமிழாக்கம்.
- source_word: כְּסוּחָה
  choice: வெட்டி வீழ்த்தப்பட்டது
  rationale: வெட்டப்பட்ட அல்லது அறுத்துத் தள்ளப்பட்ட நிலையைத் தெளிவாகக் காட்டுகிறது; திராட்சைக்கொடி உருவகத்திற்குப் பொருந்துகிறது.
- source_word: מִגַּעֲרַת פָּנֶיךָ
  choice: உமது முகத்தின் கண்டிப்பால்
  rationale: גְּעָרָה என்பதன் கடிந்துகொள்ளுதல்/கண்டித்தல் பொருளையும், פָּנֶיךָ என்ற நேரடியான ‘உமது முகம்’ உருவகத்தையும் பாதுகாக்கிறது.
- source_word: יֹאבֵדוּ
  choice: அவர்கள் அழிந்துபோகிறார்கள்
  rationale: மூன்றாம் நபர் ஆண்பால் பன்மையைத் தக்கவைத்து, அழிவு/ஒழிந்துபோதல் என்ற சொல்லின் வலிமையை வழங்குகிறது.
theological_decisions:
- issue: ஒருமைத் திராட்சைக்கொடியிலிருந்து பன்மை வினைக்கான மாறுதல்
  choice: ‘அவர்கள்’ என்ற பன்மையை வெளிப்படையாகத் தக்கவைத்தல்
  alternative: முழு வரியையும் ஒருமையில் ‘அது அழிந்துபோகிறது’ என அமைத்தல்
  rationale: எபிரெய மூலத்தில் שְׂרֻפָה, כְּסוּחָה பெண்பால் ஒருமையாக இருந்தாலும் יֹאבֵדוּ பன்மையாக உள்ளது. இந்த இலக்கண மற்றும் உருவகத் திடீர் மாறுதலைத் தீர்த்து விடாமல் பாதுகாக்கிறது.
- issue: ‘உமது முகம்’ என்ற தெய்வீக உருவகம்
  choice: நேரடியாக ‘உமது முகத்தின் கண்டிப்பால்’
  alternative: ‘உமது கண்டிப்பால்’ என உருவகத்தைச் சுருக்குதல்
  rationale: மூலத்தின் வெளிப்பாட்டையும், தேவனுடைய எதிர்நோக்கும் பிரசன்னம் தீர்ப்பாக அமையும் இறையியல் பதற்றத்தையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, வாசிக்க எளிய நடை. மூலத்தின் துண்டு வாக்கிய அமைப்பையும் நீண்ட கோடு வழியாக வரும் தீர்ப்பின் வலிமையையும் பேணுகிறது; தேவையற்ற விளக்கச் சொற்கள் சேர்க்கப்படவில்லை.
