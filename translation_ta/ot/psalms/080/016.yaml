revisions:
- from: தீயால் எரிக்கப்பட்டு, வெட்டி வீழ்த்தப்பட்டது—உமது முகத்தின் கண்டிப்பால் அவர்கள் அழிந்துபோகிறார்கள்.
  to: தீயால் எரிக்கப்பட்டு, வெட்டி வீழ்த்தப்பட்டது—உமது முகத்தின் கடிந்துகொள்ளுதலால் அவர்கள் அழிந்துபோகிறார்கள்.
  rationale: A minimal idiomatic revision replaces only the awkward noun phrase 'முகத்தின் கண்டிப்பால்' with 'முகத்தின் கடிந்துகொள்ளுதலால்.' The singular participial vine imagery and the subsequent plural verb are both retained, preserving the Hebrew's grammatical tension and referential ambiguity.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T10:28:23Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the two feminine-singular passive participles ('burned with/in fire' and 'cut down') and preserves the source's shift to the masculine-plural verb, without artificially resolving its referent. 'அழிந்துபோகிறார்கள்' suitably conveys יֹאבֵדוּ. The phrase 'உமது முகத்தின் கண்டிப்பால்' is formally possible but is not idiomatic Tamil for the Hebrew construct expression 'at/from the rebuke of your face.'
  naturalness: The line is generally clear and appropriately dignified. Recasting the final causal phrase as 'உமது முகத்தின் கடிந்துகொள்ளுதலால்' makes the relationship of God's face/presence and rebuke more intelligible in Tamil while retaining the source image.
  terminology: '''தீயால் எரிக்கப்பட்டு'' and ''வெட்டி வீழ்த்தப்பட்டது'' are suitable for the vine imagery. ''கடிந்துகொள்ளுதல்'' is an accurate, suitably elevated equivalent for גְּעָרָה; ''முகம்'' is retained rather than reduced to an interpretive paraphrase such as ''presence.'''
  issues:
  - severity: low
    issue: The expression 'உமது முகத்தின் கண்டிப்பால்' is semantically understandable but stylistically awkward in modern standard Tamil.
    rationale: Tamil normally expresses this kind of personified/source genitive more naturally with a verbal-noun expression. The revision maintains the literal 'face' image and does not specify whether the plural who perish are the vine, Israel, or hostile people.
  revised_text: தீயால் எரிக்கப்பட்டு, வெட்டி வீழ்த்தப்பட்டது—உமது முகத்தின் கடிந்துகொள்ளுதலால் அவர்கள் அழிந்துபோகிறார்கள்.
  revised_footnotes: []
  revision_rationale: A minimal idiomatic revision replaces only the awkward noun phrase 'முகத்தின் கண்டிப்பால்' with 'முகத்தின் கடிந்துகொள்ளுதலால்.' The singular participial vine imagery and the subsequent plural verb are both retained, preserving the Hebrew's grammatical tension and referential ambiguity.
