    issue: The imperative וּרְאֵה (‘and see’) is not distinctly represented.
    rationale: ‘வானத்திலிருந்து கீழே நோக்கிப் பாரும்’ conveys the preceding command to look down, but the Hebrew deliberately continues with a second imperative, ‘and see.’ It should be retained, preferably in connection with the vine, for source fidelity.
