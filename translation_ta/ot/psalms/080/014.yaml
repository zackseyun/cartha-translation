lexical_decisions:
- source_word: אֱלֹהִים צְבָאוֹת
  choice: படைகளின் கடவுளே
  rationale: இந்த எபிரெயத் தெய்வீகப் பட்டம் கடவுளைப் பரலோகப் படைகளின் தலைவராகச் சித்தரிக்கிறது. ‘படைகள்’ என்பது இராணுவ மற்றும் விண்ணுலகப் பரப்பைத் தக்கவைக்கிறது; மூலத்தில் நேரடியாக இல்லாத ‘சர்வவல்லவர்’ என்ற பொருளைச் சேர்க்கவில்லை.
- source_word: שׁוּב נָא
  choice: தயவுசெய்து திரும்பி வாரும்
  rationale: שׁוּב என்பது ‘திரும்பு’ அல்லது ‘திரும்பி வா’ என்றும், נָא வேண்டுதலின் பணிவையும் உணர்த்துகிறது. புலம்பல் சூழலில் கடவுள் மீண்டும் தம் மக்களிடம் இரக்கத்துடன் திரும்ப வேண்டும் என்ற மன்றாட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הַבֵּט מִשָּׁמַיִם וּרְאֵה
  choice: வானத்திலிருந்து கீழே நோக்கிப் பாரும்
  rationale: הבט மற்றும் ראה ஆகிய இரு பார்வை வினைகளின் தொடர்ச்சி, பரலோகத்திலிருந்து கவனமாகக் கீழ்நோக்கிப் பார்க்கும் ஒருங்கிணைந்த செயற்பாடாக இயல்பான தமிழில் தரப்பட்டுள்ளது. ‘கீழே’ என்பது பரலோகப் பார்வைநிலையை வெளிப்படையாக்குகிறது.
- source_word: וּפְקֹד
  choice: கவனித்தருளும்
  rationale: פקד என்பதற்கு வந்து பார்த்தல், கவனித்தல், பராமரித்தல், ஆய்வு செய்தல் போன்ற பொருள்கள் உண்டு. இங்கு திராட்சைக்கொடியின் நலனுக்காகக் கடவுள் தலையிட வேண்டும் என்ற வேண்டுதலை ‘கவனித்தருளும்’ இயல்பாகக் காட்டுகிறது; வினையின் பரந்த பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: גֶּפֶן זֹאת
  choice: இந்தத் திராட்சைக்கொடி
  rationale: גפן ஒருமையில் ‘திராட்சைக்கொடி’ என்பதைக் குறிக்கிறது; ‘திராட்சைத்தோட்டம்’ அல்ல. சங்கீதத்தில் இஸ்ரவேலைக் குறிக்கும் கொடி உருவகத்தைத் துல்லியமாகத் தொடர்கிறது.
theological_decisions:
- issue: தெய்வீகப் பட்டத்தின் மொழிபெயர்ப்பு
  choice: படைகளின் கடவுளே
  alternative: சர்வவல்லமையுள்ள கடவுளே
  rationale: மூலப் பட்டம் கடவுள் பரலோகப் படைகள்மேல் ஆட்சி செய்பவர் என்ற உருவகத்தை முன்னிறுத்துகிறது. ‘சர்வவல்லவர்’ என்பது சாத்தியமான விளக்கமாயினும், இங்குள்ள சொற்களின் நேரடிப் படை உருவகத்தை மறைத்துவிடும்.
- issue: פקד வினையின் சாதகமான பொருள்
  choice: கவனித்தருளும்
  alternative: வந்து பாரும்
  rationale: சூழல் தண்டனைக்கான ஆய்வை அல்ல, கொடியாகச் சித்தரிக்கப்படும் மக்களின் நலனுக்காகக் கடவுள் அக்கறையுடன் தலையிடுவதை வேண்டுகிறது. எனினும் வினையின் ‘வந்து பார்த்தல்/விசாரித்தல்’ என்ற நெகிழ்வான பொருள் அடிக்குறிப்பில் குறிப்பிடப்பட்டுள்ளது.
translation_notes:
  register: நவீன தரமான தமிழில், மன்றாட்டுக்கேற்ற கண்ணியமான ‘வாரும்/பாரும்/கவனித்தருளும்’ வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. கவிதைத் தொடரின் சுருக்கமும் திராட்சைக்கொடி உருவகமும் காக்கப்பட்டுள்ளன.
