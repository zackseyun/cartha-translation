  yaml_path: translation/ot/psalms/080/014.yaml
  text: God of hosts[a], please return; look down from heaven and see, and visit this vine.
translation:
  language: ta
  text: படைகளின் கடவுளே, தயவுசெய்து திரும்பி வாரும்; வானத்திலிருந்து கீழே நோக்கிப் பாரும்; இந்தத் திராட்சைக்கொடியைக் கண்டு கவனித்தருளும்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இந்தத் திராட்சைக்கொடியை வந்து பாரும்.’ இங்குள்ள எபிரெய வினை ‘வந்து பார்,’ ‘கவனி,’ ‘பராமரி,’ அல்லது ‘ஆய்வு செய்’ என்று பொருள்படலாம்; இச்சூழலில் அதன் நலனுக்காகத் தலையிடுவதைக் குறிக்கிறது.
