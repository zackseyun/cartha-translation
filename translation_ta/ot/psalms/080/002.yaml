  text: Before Ephraim and Benjamin and Manasseh[b][a], stir up your might and come to save us.
translation:
  language: ta
  text: எப்பிராயீம், பென்யமீன், மனாசே ஆகியோருக்கு முன்பாக உமது வல்லமையை[b] எழுப்பி, எங்களை மீட்க வாரும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “எங்கள் மீட்புக்காகச் செல்லும்” என்றும் மொழிபெயர்க்கலாம்; எபிரெய வினைச்சொல் சொற்படியாக “செல்/நட” என்று பொருள்பட்டாலும், இச்சூழலில் அது தமது மக்களுக்காகச் செயல்படுமாறு தேவனை வேண்டுவதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “உமது வலிமையை” அல்லது “உமது ஆற்றலை” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי
  choice: முன்பாக
  rationale: தேவன் இந்தக் கோத்திரங்களுக்கு முன்பாகச் செல்வது அல்லது தோன்றுவது என்ற இடம்சார் பொருளை இயல்பாகவும் சுருக்கமாகவும் தக்கவைக்கிறது.
- source_word: אֶפְרַיִם וּבִנְיָמִן וּמְנַשֶּׁה
  choice: எப்பிராயீம், பென்யமீன், மனாசே ஆகியோர்
  rationale: கோத்திரப் பெயர்கள் நவீனத் தமிழில் வழக்கமான வேதாகம ஒலிபெயர்ப்புகளாக வழங்கப்பட்டுள்ளன; மீளும் இணைப்புச்சொற்கள் இயல்பான தமிழ் பட்டியலாக மென்மையாக்கப்பட்டுள்ளன.
- source_word: עוֹרְרָה
  choice: எழுப்பி
  rationale: வல்லமை செயல்படும்படி தூண்டுதல் அல்லது விழித்தெழச் செய்தல் என்ற உருவகத்தையும் வேண்டுகோளின் அவசரத்தையும் காக்கிறது.
- source_word: אֶת גְּבוּרָתֶךָ
  choice: உமது வல்லமையை
  rationale: גְּבוּרָה என்பதன் வலிமை, ஆற்றல், பராக்கிரமம் ஆகிய பொருள் வரம்பை மரியாதையான, இயல்பான தமிழில் எடுத்துரைக்கிறது.
- source_word: וּלְכָה
  choice: வாரும்
  rationale: הלך என்பது சொற்படியாக ‘செல்/நட’ என்றாலும், இங்கு மக்களுக்காகத் தலையிடுமாறு தேவனை நோக்கி வேண்டுவதால் ‘வாரும்’ என்பது சூழலுக்கேற்ற இயல்பான உரை.
- source_word: לִישֻׁעָתָה לָּנוּ
  choice: எங்களை மீட்க
  rationale: ‘எங்களுக்கான மீட்புக்காக’ என்ற நோக்கப் பொருளை நவீனத் தமிழில் இயல்பான வினை வடிவில் தருகிறது; ஆபத்திலிருந்து விடுவித்தல் என்ற ישׁוּעָה-வின் பொருளையும் காக்கிறது.
theological_decisions:
- issue: ஜெபத்தில் கோரப்படும் இறைச் செயல்
  choice: “உமது வல்லமையை எழுப்பி, எங்களை மீட்க வாரும்” என்ற நேரடியான வேண்டுகோள்
  alternative: “உமது வலிமையை எழுப்பி, எங்கள் மீட்புக்காகச் செல்லும்”
  rationale: இது தேவன் தமது வல்லமையை வெளிப்படுத்தி மக்களுக்காகச் செயல்பட வேண்டும் என்ற விண்ணப்பம். மொழிபெயர்ப்பு வேண்டுகோளின் அவசரத்தைத் தக்கவைக்கிறது; அதற்கு மேலான கோட்பாட்டுச் சிறப்புரையைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீத ஜெபத்திற்கேற்ற கண்ணியமான நடையும் ‘உமது’, ‘வாரும்’ என்ற மரியாதை வடிவங்களும் பயன்படுத்தப்பட்டுள்ளன. கோத்திரப் பெயர்கள் தமிழ் வேதாகமப் பயன்பாட்டில் பரிச்சயமான வடிவங்களில் தரப்பட்டுள்ளன.
