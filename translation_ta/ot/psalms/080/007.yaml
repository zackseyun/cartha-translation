    issue: The main text adds 'எங்கள்மேல்' after 'உமது முகத்தை.'
    rationale: The Hebrew reads literally 'cause your face to shine' and contains no prepositional phrase 'upon us.' The added phrase makes the implied beneficiary explicit but exceeds optimal-equivalence and conflicts with the footnote's claim of literal wording.
