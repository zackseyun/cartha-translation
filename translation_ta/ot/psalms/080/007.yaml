- source_word: צְבָאוֹת
  choice: படைகளின்
  rationale: இச்சொல் மனிதப் படைகளை மட்டும் அல்லாமல் வானுலகப் படைகளையும் பிற அதிகார அணிகளையும் குறிக்கக்கூடிய அகன்ற பொருளுடையது. “படைகளின்” என்ற மொழிபெயர்ப்பு அந்தப் படிமத்தைத் தக்கவைக்கிறது; அதன் பரப்பு அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: הֲשִׁיבֵנוּ
  choice: எங்களை மீண்டும் நிலைநிறுத்தியருளும்
  rationale: שׁוב என்பதன் causative வடிவம் ‘திரும்பச் செய்/மீண்டும் கொண்டுவா/மீள நிலைநிறுத்து’ என்ற பொருள் தருகிறது. சங்கீதப் பல்லவியின் சூழலில் இந்தத் தேர்வு புவியியல், ஆன்மிக அல்லது உடன்படிக்கை சார்ந்த திரும்புதலாக ஒன்றை மட்டும் நிர்ணயிக்காமல் மீட்சி மற்றும் புதுப்பித்தலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וְהָאֵר
  choice: ஒளிரச் செய்தருளும்
  rationale: אור என்பதன் hiphil வடிவிலுள்ள காரணவினைப் பொருளை ‘ஒளிரச் செய்’ நேர்மையாகக் காக்கிறது; “அருளும்” மரியாதையான வேண்டுதலின் தமிழ் நடையை வழங்குகிறது.
- source_word: פָּנֶיךָ
  choice: உமது முகத்தை எங்கள்மேல்
  rationale: “உமது முகம்” என்ற எபிரேயப் படிமம் தேவனுடைய சாதகமான பிரசன்னத்தையும் தயவையும் குறிக்கிறது. மூலத்தின் தெளிவான படிமத்தைப் பிரதான உரையில் காத்து, தமிழில் அதன் திசையை இயல்பாக்க “எங்கள்மேல்” சேர்க்கப்பட்டுள்ளது.
- source_word: וְנִוָּשֵׁעָה
  choice: அப்போது நாங்கள் காப்பாற்றப்படுவோம்
  rationale: ישׁע என்பதன் nifal வடிவம் மீட்கப்படுதல் அல்லது காப்பாற்றப்படுதல் என்ற அகன்ற பொருளைத் தருகிறது. “காப்பாற்றப்படுவோம்” வரலாற்று விடுதலையையோ ஆன்மிக இரட்சிப்பையையோ மட்டும் குறுக்காமல் இயல்பான நவீனத் தமிழில் இரண்டிற்கும் இடமளிக்கிறது; “அப்போது” முந்தைய வேண்டுதலின் விளைவை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: אֱלֹהִים צְבָאוֹת என்ற இறைப்பட்டத்தின் பொருள் பரப்பு
  choice: படைகளின் தேவனே
  alternative: வான்படைகளின் தேவனே; சேனைகளின் தேவனே
  rationale: இந்தப் பட்டம் எல்லா வல்லமைகளின்மேலும் தேவனுக்குள்ள ஆட்சியை உணர்த்துகிறது. “வான்படைகள்” என்பது பொருளை வானுலகத்துக்கு மட்டும் குறுக்கக்கூடும்; “சேனைகள்” நவீன வாசகருக்கு பழமையானதாகத் தோன்றலாம். “படைகளின்” மூலப் படிமத்தையும் பொருள் அகலத்தையும் காக்கிறது.
- issue: וְנִוָּשֵׁעָה என்பதில் காப்பாற்றுதலின் பரப்பு
  choice: நாங்கள் காப்பாற்றப்படுவோம்
  alternative: நாங்கள் இரட்சிக்கப்படுவோம்; நாங்கள் விடுவிக்கப்படுவோம்
  rationale: எபிரேய வினை பொதுவாக அபாயத்திலிருந்து மீட்பதையும் விரிவான இரட்சிப்பையும் குறிக்கலாம். வசனம் எந்த ஒரு பரப்பையும் மட்டும் கட்டாயப்படுத்தாததால், “காப்பாற்றப்படுவோம்” அந்தத் தத்துவார்த்த இழுவிசையையும் பொருள் அகலத்தையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் மரியாதையான வேண்டுதல் நடை பயன்படுத்தப்பட்டுள்ளது. “சேனைகள்” போன்ற ஓரளவு பழமையான சொல்லுக்கு பதில் “படைகள்” பயன்படுத்தப்பட்டாலும், அதன் அகன்ற எபிரேயப் பொருள் அடிக்குறிப்பில் காக்கப்பட்டுள்ளது. இறைமுகம் ஒளிரும் மூலப் படிமம் விளக்கமாக மாற்றப்படாமல் பிரதான உரையிலேயே வைக்கப்பட்டுள்ளது.
