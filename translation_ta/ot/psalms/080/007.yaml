    text: “படைகள்” என்பது மனிதப் படைகளை மட்டும் அல்ல; வானுலகப் படைகளையும் பிற வல்லமைகளையும் உள்ளடக்கக்கூடிய எபிரேயச் சொல்லாகும்.
    reason: lexical_alternative
  - marker: b
    text: “எங்களைத் திரும்பச் செய்தருளும்” அல்லது “எங்களை மீண்டும் கொண்டுவாரும்” என்றும் மொழிபெயர்க்கலாம். எபிரேய வினை திரும்புதலையும் மீண்டும் நிலைநிறுத்துதலையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: சொல்லுக்குச் சொல், “உமது முகத்தை ஒளிரச் செய்தருளும்.” இது தேவனுடைய தயவான பிரசன்னத்தைக் குறிக்கும் எபிரேய மொழிமரபு.
    reason: lexical_alternative
  - marker: d
    text: “நாங்கள் விடுவிக்கப்படுவோம்” அல்லது “இரட்சிக்கப்படுவோம்” என்றும் மொழிபெயர்க்கலாம். எபிரேயச் சொல் பொதுவாக மீட்பையும் காப்பாற்றுதலையும் குறிக்கிறது.
    reason: alternative_reading
