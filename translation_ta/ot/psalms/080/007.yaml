  naturalness: The prayerful register is natural modern standard Tamil. 'மீண்டும் நிலைநிறுத்தியருளும்' is an acceptable idiomatic rendering of the refrain's restoration request, and 'ஒளிரச் செய்தருளும்' clearly expresses the causative force.
  terminology: '''படைகளின் தேவனே'' adequately retains the broad, non-exclusive force of the traditional divine title. ''காப்பாற்றப்படுவோம்'' appropriately retains the broad rescue/salvation range without imposing a narrower doctrinal sense.'
