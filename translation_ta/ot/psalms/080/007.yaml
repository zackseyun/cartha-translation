  text: God of hosts[a], restore us; make your face shine[c][b], and we will be saved.
translation:
  language: ta
  text: படைகளின் தேவனே[a], எங்களை மீண்டும் நிலைநிறுத்தியருளும்[b]; உமது முகத்தை ஒளிரச் செய்தருளும்[c]; நாங்கள் காப்பாற்றப்படுவோம்[d].
  philosophy: optimal-equivalence
  footnotes:
