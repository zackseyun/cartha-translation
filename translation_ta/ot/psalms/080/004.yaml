base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/004.yaml
  text: O Yahweh God of hosts[a], how long will you smoke against the prayer of your people?
translation:
  language: ta
  text: யாவே, படைகளின் கடவுளே, உமது மக்களின் மன்றாட்டுக்கு எதிராக இன்னும் எவ்வளவு காலம் புகைந்தெழுவீர்கள்?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேய வினைச்சொல் நேரடியாக ‘புகைதல்’ அல்லது ‘புகைந்தெழுதல்’ என்ற காட்சியைத் தருகிறது; இங்கு அது கடவுளுடைய கோபத்தைக் குறிக்கும் உருவகம். இதை, ‘உமது மக்களின் மன்றாட்டுக்கு எதிராக இன்னும் எவ்வளவு காலம் கோபமாயிருப்பீர்கள்?’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இஸ்ரவேலின் கடவுளுடைய தனிப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், எபிரெயப் பெயரின் பரவலாக ஏற்கப்பட்ட ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֱלֹהִים צְבָאוֹת
  choice: படைகளின் கடவுள்
  rationale: צְבָאוֹת என்பதன் படை சார்ந்த பன்மைப் பொருளைப் பாதுகாக்கிறது; அவை பூமிக்குரிய படைகளா, வானத்துப் படைகளா என்பதைத் தேவையின்றி வரையறுக்கவில்லை.
- source_word: עַד מָתַי
  choice: இன்னும் எவ்வளவு காலம்
  rationale: புலம்பலின் அவசரமான கேள்வியை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: עָשַׁנְתָּ
  choice: கோபத்தில் புகைவீர்கள்
  rationale: வினைச்சொல்லின் நேரடியான ‘புகைதல்’ உருவகத்தையும் அது குறிக்கும் தெய்வீகக் கோபத்தையும் ஒருங்கே வைத்திருக்கிறது.
- source_word: בִּתְפִלַּת
  choice: மன்றாட்டுக்கு எதிராக
  rationale: בְּ முன்னிடைச்சொல்லை இச்சூழலில் எதிர்நிலையைக் குறிக்கும் பொருளில் எடுத்துக்கொண்டு, சமூகத்தின் வேண்டுதலுக்கு எதிராகக் கோபம் எழுவதை வெளிப்படுத்துகிறது.
- source_word: עַמֶּךָ
  choice: உமது மக்கள்
  rationale: உடன்படிக்கைச் சமூகத்தைச் சுட்டும் இயல்பான, மரியாதைமிக்க தமிழாக்கம்.
theological_decisions:
- issue: יְהוָה אֱלֹהִים צְבָאוֹת என்ற தெய்வீக அழைப்பை மொழிபெயர்த்தல்
  choice: படைகளின் கடவுளாகிய யாவே
  alternative: சேனைகளின் ஆண்டவராகிய கர்த்தாவே
  rationale: தெய்வீகத் தனிப்பெயரைத் தலைப்பால் மாற்றாமல் பாதுகாக்கிறது; அதேவேளையில் ‘படைகள்’ என்பதில் உள்ள பூமிக்குரிய அல்லது வானத்துக்குரிய படைகள் என்ற தெளிவின்மையையும் விட்டுவைக்கிறது.
- issue: עָשַׁנְתָּ என்பதிலுள்ள புகைதல் உருவகத்தைப் பாதுகாத்தல்
  choice: கோபத்தில் புகைவீர்கள்
  alternative: கோபமாயிருப்பீர்கள்
  rationale: வெறும் ‘கோபம்’ என்று உருவகத்தைத் தட்டையாக்காமல், கடவுளின் கோபத்தைப் புகையாகச் சித்தரிக்கும் கவிதை வலிமையையும் புலம்பலின் இறையியல் பதற்றத்தையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதப் புலம்பலுக்கேற்ற கண்ணியமான நேரடி அழைப்பு பயன்படுத்தப்பட்டுள்ளது. கடவுளை நோக்கிய உரையில் ‘உமது’, ‘புகைவீர்கள்’ என்ற மரியாதை வடிவங்கள் உள்ளன. ‘மன்றாட்டு’ என்பது தனிப்பட்ட அல்லது சமூகப் பிரார்த்தனையின் தீவிர வேண்டுதலை இயல்பாகத் தருகிறது.
