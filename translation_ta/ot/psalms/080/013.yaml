  text: A boar from the forest tears it down[b][a], and the wild animals of the field feed on it.
translation:
  language: ta
  text: காட்டிலிருந்து வரும் காட்டுப்பன்றி அதைக் கடித்துச் சிதைக்கிறது[a]; வயல்வெளியில் நடமாடும் விலங்குகள் அதை மேய்கின்றன[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அதை நாசமாக்குகிறது.’ அரிதான இவ்வினை, தின்று சேதப்படுத்துவதைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘வயல்வெளியின் காட்டு விலங்குகள் அதைத் தின்கின்றன.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יְכַרְסְמֶנָּה
  choice: அதைக் கடித்துச் சிதைக்கிறது
  rationale: அரிதாக வரும் כרסם என்ற வினை, விலங்கு தின்று அல்லது கடித்து ஒரு செடியைச் சேதப்படுத்துவதைச் சுட்டுகிறது. ‘கடித்துச் சிதைக்கிறது’ என்பது உண்ணுதலையும் அழிவையும் இயல்பான தமிழில் இணைத்துக் காட்டுகிறது.
- source_word: חֲזִיר מִיָּעַר
  choice: காட்டிலிருந்து வரும் காட்டுப்பன்றி
  rationale: חֲזִיר என்பது பன்றி அல்லது காட்டுப்பன்றியைக் குறிக்கும்; מִיָּעַר அதன் தோற்றிடமாகக் காட்டைக் குறிப்பிடுகிறது. தமிழில் வனவிலங்கு உருவகத்தைத் தெளிவாக வைத்திருக்க இவ்வாறு மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: זִיז שָׂדַי
  choice: வயல்வெளியில் நடமாடும் விலங்குகள்
  rationale: அரிதான זִיז என்பது நடமாடும் உயிரினங்களை, இச்சூழலில் விலங்குகளை, குறிக்கிறது; שָׂדַי திறந்த வயல்வெளியைக் குறிக்கிறது. மூலச்சொல்லின் ‘நடமாடுதல்’ நுணுக்கத்தைப் பாதுகாக்கும் வகையில் இத்தொடர் அமைந்துள்ளது.
- source_word: יִרְעֶנָּה
  choice: அதை மேய்கின்றன
  rationale: רעה என்பதன் அடிப்படைப் பொருள் மேய்தல் அல்லது உணவுகொள்ளுதல். பெண்பால் ஒருமை பின்னொட்டு முன்னுள்ள திராட்சைக்கொடியைக் குறிக்கிறது; ஆகவே ‘அதை மேய்கின்றன’ என்பது உருவகத்தையும் இலக்கணத் தொடர்பையும் காக்கிறது.
