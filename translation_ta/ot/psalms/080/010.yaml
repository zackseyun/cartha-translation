source:
  edition: WLC
  text: כָּסּ֣וּ הָרִ֣ים צִלָּ֑/הּ וַ֝/עֲנָפֶ֗י/הָ אַֽרְזֵי אֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/010.yaml
  text: The mountains were covered by its shade[a], and its branches were like the cedars of God.
translation:
  language: ta
  text: 'மலைகள் அதன் நிழலால் மூடப்பட்டன;

    கடவுளின் கேதுரு மரங்கள் அதன் கிளைகளால் மூடப்பட்டன.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மகத்தான கேதுரு மரங்கள்.” “கடவுளின் கேதுரு மரங்கள்” என்ற எபிரெயச் சொற்றொடர் அவற்றின் பெருமையையோ மகத்துவத்தையோ வலியுறுத்தும் மரபுத்தொடராக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּסּוּ
  choice: மூடியது
  rationale: כסה என்பதன் Qal perfect வடிவம். எபிரெயச் சொல்வரிசையில் ‘மலைகள்’ இலக்கண எழுவாயாக இருந்தாலும், இயல்பான நவீனத் தமிழில் ‘அதன் நிழல் மலைகளை மூடியது’ என்று செயப்பாட்டு வடிவில் கூறுவது பொருளைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: הָרִים
  choice: மலைகளை
  rationale: ‘மலைகள்’ என்ற நேரடியான பொருள்; தமிழ் வாக்கிய அமைப்புக்கேற்ப இரண்டாம் வேற்றுமையில் வழங்கப்பட்டுள்ளது.
- source_word: צִלָּהּ
  choice: அதன் நிழல்
  rationale: צל என்பது ‘நிழல்’ அல்லது ‘நிழற்குடை’ என்ற பொருளைத் தரலாம். திராட்சைக்கொடியின் பரந்த படர்ச்சியை இயல்பாகக் காட்ட ‘நிழல்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: וַעֲנָפֶיהָ
  choice: அதன் கிளைகள்
  rationale: ענף என்பது கிளைகள் அல்லது பெருங்கிளைகள். சாதாரண வாசகர்களுக்குப் புரியும் இயல்பான தாவரவியல் சொல்லாக ‘கிளைகள்’ பயன்படுத்தப்பட்டது.
- source_word: אַרְזֵי אֵל
  choice: கடவுளின் கேதுரு மரங்கள்
  rationale: எபிரெயில் உள்ள ‘கடவுளின் கேதுரு மரங்கள்’ என்ற இணைப்பை முதன்மை உரையில் வெளிப்படையாகப் பாதுகாக்கிறது. இது மகத்துவத்தைக் குறிக்கும் மரபுத்தொடராகவும் இருக்கலாம்; அந்த வாய்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: אַרְזֵי אֵל என்பதில் אֵל-ஐ மொழிபெயர்த்தல்
  choice: முதன்மை உரையில் ‘கடவுளின் கேதுரு மரங்கள்’ என்ற நேரடி சொல்லாட்சியை வைத்தல்
  alternative: ‘மகத்தான கேதுரு மரங்கள்’
  rationale: தெய்வப்பெயரை உடைய எபிரெயக் கட்டமைப்பு மிகுதியையோ மகத்துவத்தையோ குறிக்கும் மரபுத்தொடராக இருக்கலாம். ஆயினும் அதை முதன்மை உரையிலேயே ஒரே பொருளாகத் தீர்மானிக்காமல், மூலத்தின் உருவகத்தையும் உண்மையான இருபொருள் வாய்ப்பையும் பாதுகாத்து, மாற்றுப் பொருளை அடிக்குறிப்பில் குறிப்பிடுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘கேதுரு மரங்கள்’ என்பது வேதாகமச் சூழலில் அறியப்பட்ட மரப்பெயரைத் துல்லியமாக வைத்திருக்கிறது. எபிரெயக் கவிதையின் இணைவரி அமைப்பு அரைப்புள்ளி மற்றும் வரிப்பிரிப்பால் பிரதிபலிக்கப்பட்டுள்ளது.
