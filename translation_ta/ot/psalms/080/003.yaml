  yaml_path: translation/ot/psalms/080/003.yaml
  text: God[a], restore us, and make your face shine[c][b], that we may be saved.
translation:
  language: ta
  text: தேவனே, எங்களைத் திரும்பச் செய்தருளும்[a]; உமது முகம் ஒளிரச் செய்தருளும்[b]; அப்பொழுது நாங்கள் மீட்கப்படுவோமாக[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “எங்களை மீண்டும் கொண்டுவாரும்” அல்லது “எங்களை மீண்டும் திருப்பும்” என்றும் மொழிபெயர்க்கலாம். எபிரெய வினை ஒருவரைத் திரும்பும்படி செய்வதைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எழுத்துப்படி, “உமது முகம் ஒளிரச் செய்தருளும்.” இது தேவனுடைய தயவையும் பிரசன்னத்தையும் குறிக்கும் உருவகம்; எண்ணாகமம் 6:25-இல் உள்ள ஆசீர்வாத மொழியுடன் ஒப்பிடுக.
    reason: cross_reference
  - marker: c
    text: “அப்பொழுது நாங்கள் மீட்கப்படுவோம்” என்றும் புரிந்துகொள்ளலாம். எபிரெய வடிவம் விரும்பப்படும் விளைவைக் குறிக்கும் வேண்டுதலாகவோ, அந்த விளைவைக் குறித்த நம்பிக்கையான கூற்றாகவோ கேட்கக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלֹהִים
  choice: தேவனே
  rationale: இங்கு இஸ்ரவேலின் தேவனை நேரடியாக அழைக்கும் விளிப்பாக உள்ளது. எபிரெயத்தில் தனி விளிப்பிடைச்சொல் இல்லாவிட்டாலும், தமிழில் “தேவனே” என்பது இயல்பாகவும் தெளிவாகவும் நேரடி அழைப்பை வெளிப்படுத்துகிறது.
- source_word: הֲשִׁיבֵנוּ
  choice: எங்களைத் திரும்பச் செய்தருளும்
  rationale: שוב என்பதன் ஹிப்ஃபீல் வடிவம் ‘திரும்பும்படி செய்’ என்ற காரணவினைப் பொருளைக் கொண்டது. இத்தேர்வு உறவு புதுப்பிக்கப்படுதல், முந்தைய நிலைக்குக் கொண்டுவரப்படுதல் ஆகிய சாத்தியங்களைத் திறந்தவையாக வைத்திருக்கிறது.
- source_word: וְהָאֵר
  choice: ஒளிரும்படி செய்தருளும்
  rationale: אור என்பதன் ஹிப்ஃபீல் கட்டளை வடிவத்திலுள்ள காரணவினைப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: פָּנֶיךָ
  choice: உமது முகம்
  rationale: ‘முகம்’ என்ற மூல உருவகத்தைத் தக்கவைக்கிறது. அது தேவனுடைய பிரசன்னத்தையும் தயவையும் உணர்த்தக்கூடும்; ஆனால் அவற்றுள் ஒன்றை மட்டும் உரையில் விளக்கமாகத் திணிக்கவில்லை.
- source_word: וְנִוָּשֵׁעָה
  choice: அப்பொழுது நாங்கள் மீட்கப்படுவோமாக
  rationale: ישׁע என்பதன் நிஃபால் முதலாம் நபர் பன்மை விருப்பநிலை வடிவத்தை, முந்தைய விண்ணப்பங்களின் விரும்பப்படும் விளைவாகத் தமிழில் வெளிப்படுத்துகிறது. ‘மீட்கப்படுதல்’ என்பது ஆபத்திலிருந்து விடுவித்தல் மற்றும் விரிந்த இறையியல் பொருள் ஆகிய இரண்டுக்கும் இடமளிக்கிறது.
theological_decisions:
- issue: முந்தைய கட்டளைகளோடு இறுதி விருப்பநிலை வினையின் தொடர்பு
  choice: “அப்பொழுது நாங்கள் மீட்கப்படுவோமாக” என்று வேண்டுதலின் விரும்பப்படும் விளைவாக மொழிபெயர்க்கப்பட்டது.
  alternative: “அப்பொழுது நாங்கள் மீட்கப்படுவோம்” என்று உறுதியான விளைவு அல்லது கூற்றாகவும் புரிந்துகொள்ளலாம்.
  rationale: எபிரெய வடிவம் வேண்டுதலுக்குரிய விருப்பநிலையையும், நிகழும் விளைவைக் குறித்த நம்பிக்கையையும் தாங்கக்கூடும். முதன்மை உரை வேண்டுதல் தொனியை முன்னிறுத்துகிறது; அடிக்குறிப்பு மற்ற வாசிப்பைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் சங்கீத வேண்டுதலுக்குரிய கண்ணியமும் காக்கப்பட்டுள்ளன. “செய்தருளும்” என்பது கட்டளையை முரட்டுத்தனமாக ஒலிக்கவிடாமல் வேண்டுதல் தொனியை வழங்குகிறது. “முகம் ஒளிருதல்” என்ற எபிரெய உருவகம் விளக்கவுரையாக மாற்றப்படாமல் தக்கவைக்கப்பட்டுள்ளது.
