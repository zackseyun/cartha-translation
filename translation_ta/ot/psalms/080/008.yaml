source:
  edition: WLC
  text: גֶּ֭פֶן מִ/מִּצְרַ֣יִם תַּסִּ֑יעַ תְּגָרֵ֥שׁ גּ֝וֹיִ֗ם וַ/תִּטָּעֶֽ/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/008.yaml
  text: You brought a vine out of Egypt[b][a]; you drove out nations and planted it.
translation:
  language: ta
  text: 'எகிப்திலிருந்து ஒரு திராட்சைக்கொடியை[a][b] இடம்பெயர்த்தீர்;

    தேசங்களைத் துரத்தி, அதை நட்டீர்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘எகிப்திலிருந்து ஒரு திராட்சைக்கொடியைப் புறப்படச் செய்தீர்’ அல்லது ‘எகிப்திலிருந்து ஒரு திராட்சைக்கொடியைப் பிடுங்கி எடுத்தீர்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய வினை புறப்படச் செய்தல், அகற்றுதல், அல்லது வேறிடத்துக்கு மாற்றுதல் ஆகிய பொருள்களைக் கொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: இங்கு ‘திராட்சைக்கொடி’ என்பது இஸ்ரவேலைக் குறிக்கும் உருவகம்.
    reason: cross_reference
lexical_decisions:
- source_word: גֶּפֶן
  choice: ஒரு திராட்சைக்கொடி
  rationale: இச்சொல் திராட்சைக்கொடியைக் குறிக்கிறது; இங்கு அது இஸ்ரவேலை உருவகப்படுத்துகிறது. உருவகத்தை விளக்கமாக மாற்றாமல் இயல்பான தமிழில் தக்கவைக்கப்பட்டது.
- source_word: מִמִּצְרַיִם
  choice: எகிப்திலிருந்து
  rationale: מִן முன்னொட்டு புறப்படும் இடம் அல்லது மூலத்தைக் குறிக்கிறது; தமிழில் ‘எகிப்திலிருந்து’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: תַּסִּיעַ
  choice: பெயர்த்துக்கொண்டு வந்தீர்
  rationale: נסע என்பதன் ஹிஃபில் வடிவம் புறப்படச் செய்தல், அகற்றுதல் அல்லது இடம்பெயர்த்தல் என்ற பொருள்களை ஏற்கலாம். கொடியை ஓரிடத்திலிருந்து மற்றோரிடத்துக்கு மாற்றி நடும் உருவகத்தையும் வெளியேற்றப் பயணத்தையும் இத்தேர்வு இணைத்துப் பாதுகாக்கிறது.
- source_word: תְּגָרֵשׁ
  choice: துரத்திவிட்டு
  rationale: גרש என்பதன் பியேல் வடிவம் விரட்டுதல் அல்லது வெளியேற்றுதல் என்று பொருள்படும். அடுத்த செயல் தொடர்வதை ‘-விட்டு’ வடிவம் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: גּוֹיִם
  choice: தேசங்களை
  rationale: நிலத்திலிருந்து அகற்றப்பட்ட மக்கள் குழுக்களைக் குறிக்கும் இச்சூழலில் ‘தேசங்கள்’ பொருத்தமானது; ‘புறஜாதிகள்’ என மொழிபெயர்ப்பது தேவையற்ற பிற்கால இறையியல் நுண்ணிறத்தைச் சேர்க்கக்கூடும்.
- source_word: וַתִּטָּעֶהָ
  choice: அதை நட்டீர்
  rationale: வினை ‘நீர் அதை நட்டீர்’ என்று பொருள்படும்; பெண்பால் பின்னொட்டு இலக்கணப் பெண்பாலான ‘கொடி’யைக் குறிக்கிறது. தமிழில் உயிரற்ற கொடியை இயல்பாகச் சுட்ட ‘அதை’ பயன்படுத்தப்பட்டது.
theological_decisions:
- issue: திராட்சைக்கொடியின் உருவக அடையாளம்
  choice: முதன்மை உரையில் ‘திராட்சைக்கொடி’ என்ற உருவகத்தை அப்படியே வைத்தல்
  alternative: ‘இஸ்ரவேலை எகிப்திலிருந்து கொண்டுவந்தீர்’ என்று உருவகத்தின் பொருளை நேரடியாகக் கூறுதல்
  rationale: எபிரெய உரை இஸ்ரவேலை நேரடியாகப் பெயரிடாமல் திராட்சைக்கொடியாக உருவகப்படுத்துகிறது. அதை முதன்மை உரையிலேயே விளக்குவது மொழிபெயர்ப்பைக் கடந்து விளக்கவுரையாகிவிடும்; அடையாளம் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- issue: תַּסִּיעַ என்பதிலுள்ள இயக்கம் மற்றும் அகற்றுதல் சார்ந்த பொருள் நுணுக்கம்
  choice: ‘பெயர்த்துக்கொண்டு வந்தீர்’
  alternative: ‘பயணப்படச் செய்தீர்’ அல்லது ‘பிடுங்கி எடுத்தீர்’
  rationale: மூல வினை புறப்படச் செய்தல், அகற்றுதல், இடமாற்றுதல் ஆகிய நுணுக்கங்களை ஏற்கிறது. கொடி உருவகத்தின் இடமாற்றத்தையும் எகிப்திலிருந்து வெளியே கொண்டுவரப்பட்டதையும் ஒருங்கே உணர்த்தும் வாசகமாகத் தேர்ந்தெடுக்கப்பட்டது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன பொதுத்தமிழில் புரியக்கூடிய, சங்கீதத்துக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டது. கடவுளை நோக்கிய ஒருமை மரியாதை வினைமுற்றுகளான ‘வந்தீர்’, ‘நட்டீர்’ பயன்படுத்தப்பட்டன. எபிரெய இணைநடை இரண்டு வரிகளாகப் பாதுகாக்கப்பட்டது; உருவகம் முதன்மை உரையில் விளக்கமின்றித் தக்கவைக்கப்பட்டு, உண்மையான சொற்பொருள் பல்வேறுபாடு அடிக்குறிப்பில் வழங்கப்பட்டது.
