  text: פִּנִּ֥יתָ לְ/פָנֶ֑י/הָ וַ/תַּשְׁרֵ֥שׁ שָׁ֝רָשֶׁ֗י/הָ וַ/תְּמַלֵּא אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/009.yaml
  text: You cleared the ground before it[c][b][a], and it took root and filled the land.
translation:
  language: ta
  text: அதற்கு இடமளிக்க நீர் நிலத்தை ஆயத்தப்படுத்தினீர்[a]; அது வேரூன்றி[b] நாட்டை நிரப்பியது[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அதன் முன்னே இடத்தைத் திறந்தீர்.’ எபிரெய வினைச்சொல், திராட்சைக்கொடிக்கு இடமளிக்கத் தடைகளை அகற்றுதல் அல்லது நிலத்தை ஆயத்தப்படுத்துதல் என்ற பொருளைக் கொண்டிருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், ‘அது தன் வேர்களைப் பதித்தது’ என்ற வலியுறுத்தும் அமைப்பு உள்ளது; அது உறுதியாக நிலைபெற்றதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘பூமியை.’ இங்கு எபிரெயச் சொல் குறிப்பிட்ட நாட்டையோ, பரந்த பொருளில் பூமியையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּנִּיתָ לְפָנֶיהָ
  choice: அதற்கு முன்பாக இடத்தை ஆயத்தப்படுத்தினீர்
  rationale: פנה என்பதன் பியேல் வடிவமும் לְפָנֶיהָ என்பதும் சேர்ந்து, திராட்சைக்கொடிக்கு முன்பாக இருந்த இடையூறுகளை அகற்றி இடத்தை ஏற்படுத்துதல் அல்லது ஆயத்தப்படுத்துதல் என்ற பொருளைத் தருகின்றன. இயல்பான தமிழில் வேளாண்மை உருவகத்தைப் பாதுகாக்க இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: וַתַּשְׁרֵשׁ שָׁרָשֶׁיהָ
  choice: அது வேரூன்றி
  rationale: எபிரெய மொழியில் சொல்லுக்குச் சொல் ‘அது தன் வேர்களை வேரூன்றச் செய்தது’ என்ற வலியுறுத்தும் அமைப்பு உள்ளது. தமிழில் ‘வேரூன்றி’ என்பது உறுதியாக நிலைபெற்ற வளர்ச்சியை இயல்பாக வெளிப்படுத்துகிறது; மூலத்தில் இல்லாத ‘ஆழமாக’ என்ற தீவிரப்படுத்தல் சேர்க்கப்படவில்லை.
- source_word: וַתְּמַלֵּא
  choice: நிரப்பியது
  rationale: מלא என்பதன் அடிப்படைப் பொருளான ‘நிரப்புதல்’ பாதுகாக்கப்படுகிறது. ‘மூடியது’ என்பது தேவையற்ற விளக்க விரிவாக்கமாக இருக்கும்.
- source_word: אָרֶץ
  choice: தேசத்தை
  rationale: אֶרֶץ என்பது ‘தேசம்/நாடு’ அல்லது ‘பூமி’ என்று பொருள்படலாம். சங்கீதத்தின் இஸ்ரவேல் என்னும் திராட்சைக்கொடி உருவகத்தில் உள்ளூர் நிலப்பரப்பே முதன்மையான சாத்தியம்; இருப்பினும் பரந்த பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: திராட்சைக்கொடி உருவகத்தின் குறிப்பு மற்றும் பரப்பு
  choice: வசனத்தில் திராட்சைக்கொடியை இஸ்ரவேல் என்று வெளிப்படையாக மாற்றாமல், வேளாண்மை உருவகத்தையே பாதுகாத்தல்
  alternative: ‘இஸ்ரவேல் வேரூன்றி தேசத்தை நிரப்பியது’ என்று உருவகத்தை விளக்கி மொழிபெயர்த்தல்
  rationale: சுற்றியுள்ள சங்கீதப் பகுதி திராட்சைக்கொடியை இஸ்ரவேலோடு அடையாளப்படுத்தினாலும், இவ்வசனம் உருவக மொழியிலேயே பேசுகிறது. மூலத்தின் கவித்துவத்தையும் விளக்கப்படாத இறையியல் நெருக்கத்தையும் காக்க உருவகம் பிரதான உரையில் அப்படியே வைக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘நீர்’ என்ற மரியாதை ஒருமை இறைவனை நோக்கிய உரையைப் பாதுகாக்கிறது; உருவகம் விளக்கவுரையாக விரிக்கப்படவில்லை.
