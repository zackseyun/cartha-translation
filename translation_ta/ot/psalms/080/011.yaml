  text: It sent out its branches as far as the sea[b][a], and its shoots to the River.
translation:
  language: ta
  text: அது தன் கிளைகளைக் கடல்வரை[a] நீட்டியது; தன் இளந்தளிர்களை நதியை நோக்கி[b] நீட்டியது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்குள்ள ‘கிளைகள்’ என்பதற்கான எபிரெயச் சொல் அரிதானது; ‘பெருங்கிளைகள்’ என்றும், பொதுவாகக் கொடியின் பரந்த வளர்ச்சி என்றும் பொருள்படலாம். இங்குக் ‘கடல்’ என்பது பெரும்பாலும் மத்தியதரைக் கடலைக் குறிக்கும்.
    reason: lexical_alternative_and_geographic_reference
  - marker: b
    text: ‘நதி’ என்பது பெரும்பாலும் யூபிராத்து நதியைக் குறிக்கும்; ‘கடலிலிருந்து நதிவரை’ என்பது இஸ்ரவேலின் நாட்டுக்குரிய இலட்சிய எல்லைகளை எதிரொலிக்கிறது.
    reason: cross_reference
lexical_decisions:
- source_word: תְּשַׁלַּח
  choice: நீட்டியது
  rationale: שלח என்பதன் பியேல் வடிவம் இங்கு திராட்சைக்கொடி தன் வளர்ச்சியை வெளியே பரப்புவதைக் குறிக்கிறது. தமிழில் ‘நீட்டியது’ என்பது சென்றடைந்த பரப்பையும் தாவர உருவகத்தையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: קְצִירֶהָ
  choice: தன் கிளைகளை
  rationale: இந்த அரிதான பயன்பாடு திராட்சைக்கொடி வெளியே விடும் பரந்த வளர்ச்சிப் பகுதிகளைக் குறிக்கிறது. இணைவரியில் வரும் ‘இளந்தளிர்கள்’ என்பதோடு பொருந்தும் தெளிவான பொதுச்சொல் ‘கிளைகள்’.
- source_word: עַד יָם
  choice: கடல்வரை
  rationale: עַד எல்லை அல்லது எட்டும் தொலைவைக் குறிக்கிறது; ஆகவே ‘கடல்வரை’ அதன் பரவலின் எல்லையைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: וְאֶל נָהָר
  choice: நதிவரை
  rationale: אֶל இங்கு இணையான கவிதை அமைப்பில் சென்றடையும் எல்லையைக் குறிக்கிறது. குறிப்பிட்ட நதி யூபிராத்து எனப் புரிந்துகொள்ளப்பட வாய்ப்புள்ளதால் விளக்கத்தை அடிக்குறிப்பில் வைத்திருக்கிறது.
- source_word: יוֹנְקוֹתֶיהָ
  choice: தன் இளந்தளிர்களை
  rationale: ינק வேருடன் தொடர்புடைய இச்சொல் புதிதாக முளைத்து வளரும் கொடிகளையோ தளிர்களையோ குறிக்கிறது. ‘இளந்தளிர்கள்’ அதன் புதுவளர்ச்சி நுணுக்கத்தைத் தெளிவாகப் பாதுகாக்கிறது.
