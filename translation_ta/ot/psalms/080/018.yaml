id: PSA.80.18
reference: Psalms 80:18
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/לֹא נָס֥וֹג מִמֶּ֑/ךָּ תְּ֝חַיֵּ֗/נוּ וּ/בְ/שִׁמְ/ךָ֥ נִקְרָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/018.yaml
  text: Then we will not turn back from you; revive us[a], and we will call on your name.
translation:
  language: ta
  text: அப்பொழுது நாங்கள் உம்மைவிட்டுப் பின்வாங்க மாட்டோம்; எங்களுக்கு உயிரளிப்பீராக[a]; உமது பெயரைச் சொல்லி உம்மை அழைப்போம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “எங்களை உயிர்ப்பிப்பீராக” அல்லது “எங்களை உயிரோடு காப்பீராக” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא
  choice: அப்பொழுது ... மாட்டோம்
  rationale: முந்தைய வேண்டுதலின் விளைவாக வரும் உறுதியைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; மறுப்புப் பொருளையும் காக்கிறது.
- source_word: נָסוֹג מִמֶּךָּ
  choice: உம்மைவிட்டுப் பின்வாங்க
  rationale: סוג என்பதன் பின்வாங்குதல் அல்லது திரும்பிச் செல்லுதல் என்ற அடிப்படைப் பொருளையும், מן என்பதன் பிரிவுப் பொருளையும் தெளிவாகக் காக்கிறது; ‘விசுவாசத்திலிருந்து வழுவுதல்’ போன்ற குறுகிய இறையியல் விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: תְּחַיֵּנוּ
  choice: எங்களுக்கு உயிரளிப்பீராக
  rationale: חיה என்பதன் காரணவினைப் பரப்பான உயிரளித்தல், உயிர்ப்பித்தல், உயிரோடு காத்தல் ஆகிய சாத்தியங்களை இயன்றவரை திறந்துவைக்கிறது.
- source_word: וּבְשִׁמְךָ נִקְרָא
  choice: உமது பெயரைச் சொல்லி உம்மை அழைப்போம்
  rationale: קרא בשם என்ற எபிரெய வழக்கின் இறைவனை அவரது பெயரைச் சொல்லி அழைத்தல் அல்லது வேண்டுதல் என்ற பொருளை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: உயிரளிக்கும் வேண்டுதலின் பொருள்
  choice: கடவுள் மக்களுக்கு உயிரளிக்க அல்லது அவர்களுடைய உயிரைப் புதுப்பிக்க வேண்டுதல்
  alternative: அவர்களை உயிர்ப்பிக்க வேண்டுதல் மட்டும்; அல்லது உயிரோடு காக்க வேண்டுதல் மட்டும்
  rationale: תְּחַיֵּנוּ என்பது உயிர்ப்பித்தல், உயிரளித்தல், உயிரோடு காத்தல் ஆகிய பொருட்களைத் தாங்கக்கூடும். ஒரு பொருளுக்கு மட்டும் சுருக்காமல் ‘உயிரளிப்பீராக’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
- issue: ‘பெயரை அழைத்தல்’ என்பதன் நோக்கம்
  choice: கடவுளின் பெயரைச் சொல்லி அவரை அழைத்தல் அல்லது வேண்டுதல்
  alternative: பெயரை வெறுமனே அறிவித்தல்; அல்லது வழிபாட்டை மட்டும் குறிப்பதாக மொழிபெயர்த்தல்
  rationale: קרא בשם என்ற சொற்றொடர் வேண்டுதல், அழைப்பு, அறிக்கை ஆகிய நிழற்பொருட்களைக் கொண்டிருக்கலாம்; சூழலில் வேண்டுதல் மேலோங்கினாலும் மொழிபெயர்ப்பு தேவையற்ற கோட்பாட்டுச் சுருக்கத்தைத் தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சங்கீத வேண்டுதலுக்கேற்ற கண்ணியமான பன்மை மற்றும் இறைமரியாதை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. ‘உம்மை’, ‘உமது’, ‘உயிரளிப்பீராக’ ஆகியவை உயர்ந்தாலும் பொதுவாசகர்களுக்குப் புரியக்கூடிய நடையில் உள்ளன.
