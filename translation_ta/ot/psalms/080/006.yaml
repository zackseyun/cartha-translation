  choice: அவர்களை
  alternative: தங்களுக்குள் / எங்களை
  rationale: மசோரா உரையில் இருப்பது ‘அவர்களுக்கு/அவர்களை’ என்ற மூன்றாம் நபர் பன்மை வடிவம். அது யாரைக் குறிக்கிறது என்பது சூழலில் முழுமையாகத் தெளிவாகாததால் முதன்மை வாசிப்பை உரையில் வைத்து, பிற புரிதல்களை அடிக்குறிப்பில் குறிப்பிடுவது உரையின் உண்மையான தெளிவின்மையைப் பாதுகாக்கிறது.
