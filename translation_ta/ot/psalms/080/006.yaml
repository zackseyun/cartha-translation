translation:
  language: ta
  text: எங்கள் அண்டை நாட்டாருக்கு எங்களைச் சச்சரவுக்குரிய பொருளாக ஆக்குகிறீர்; எங்கள் பகைவர்கள் அவர்களை ஏளனம் செய்கின்றனர்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவர்களை” என்பதற்கான எபிரெயக் கவிதைநடைச் சுட்டுப்பெயர் யாரைக் குறிக்கிறது என்பது முற்றிலும் தெளிவாக இல்லை. இது அண்டை நாட்டாரைக் குறிக்கலாம்; சிலர் இதை “தங்களுக்குள் கேலி செய்கிறார்கள்” என்ற பொருளிலும் புரிந்துகொள்கிறார்கள்.
    reason: לָמוֹ என்ற மூன்றாம் நபர் பன்மைச் சுட்டுப்பெயரின் தெளிவற்ற குறிப்பைத் தக்கவைத்துக்கொண்டு, மாற்றுப் புரிதல் விளக்கமுறை என்பதைத் தெளிவுபடுத்துகிறது.
lexical_decisions:
- source_word: מָדוֹן
  choice: சச்சரவு
  rationale: இந்தச் சொல் வாக்குவாதம், மோதல் அல்லது பூசலைக் குறிக்கிறது; இங்கு அண்டை நாட்டாரிடையே ஏற்பட்ட பகைமையான முரண்பாட்டை இயல்பாகத் தெரிவிக்கிறது.
- source_word: לִשְׁכֵנֵינוּ
  choice: எங்கள் அண்டை நாட்டாரிடையே
  rationale: சங்கீதத்தின் தேசியச் சூழலில் ‘அண்டை நாட்டார்’ என்பது பொருத்தமானது; ‘இடையே’ என்பது எபிரெய மொழியின் உறவைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יִלְעֲגוּ
  choice: ஏளனம் செய்கிறார்கள்
  rationale: לָעַג என்பது கேலி செய்து இகழ்வதைக் குறிக்கிறது; ‘ஏளனம் செய்’ நவீனத் தமிழில் தெளிவான, கண்ணியமான தெரிவு.
- source_word: לָמוֹ
  choice: அவர்களை
  rationale: இது கவிதைநடையிலான மூன்றாம் நபர் பன்மை வடிவம்; அருகிலுள்ள ‘அண்டை நாட்டார்’ என்பதையே சுட்டுவதாக முதன்மை உரையில் வைத்திருக்கிறது, ஆனால் அதன் குறிப்பு தெளிவற்றது.
theological_decisions:
