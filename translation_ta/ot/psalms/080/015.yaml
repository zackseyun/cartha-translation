  text: וְ֭/כַנָּה אֲשֶׁר נָטְעָ֣ה יְמִינֶ֑/ךָ וְ/עַל בֵּ֝֗ן אִמַּ֥צְתָּה לָּֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/015.yaml
  text: and the stock that your right hand planted[b][a], and the son whom you made strong for yourself—
translation:
  language: ta
  text: உமது வலக்கை நட்ட கொடித்தண்டையும்[a], உமக்கென்று நீர் வலிமைப்படுத்திய மகனையும்[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கொடித்தண்டு” என்பதற்கு “தளிர்,” “கிளை,” அல்லது “அடித்தண்டு” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் அரிதானது; இங்கே அது சங்கீதத்தின் திராட்சைக்கொடி உருவகத்தில் வருகிறது.
    reason: lexical_alternative
  - marker: b
    text: “மகன்” என்பதற்குப் பதிலாக உருவகமாக “கிளை” எனவும் சிலர் புரிந்துகொள்கிறார்கள். எபிரெய உரை “மகன்” என்றே கூறுகிறது; இச்சொல் இங்கே இஸ்ரவேலைக் கூட்டாகக் குறிக்கக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: כַנָּה
  choice: கொடித்தண்டு
  rationale: இது அரிதாக வரும் தாவரவியல் சொல். சங்கீதத்தின் திராட்சைக்கொடி உருவகத்துக்குள், கிளை அல்லது தளிர் என்று மிகத் துல்லியமாக முடிவுசெய்யாமல், கொடியின் முதன்மைத் தண்டு அல்லது அடித்தண்டு என்ற பரந்த பொருளைத் தருகிறது.
- source_word: נָטְעָה
  choice: நட்ட
  rationale: נטע என்பதன் இயல்பான பொருள் ‘நடு’ என்பதே; சுற்றியுள்ள திராட்சைத்தோட்ட உருவகத்தையும் இது காக்கிறது.
- source_word: יְמִינֶךָ
  choice: உமது வலக்கை
  rationale: தேவனுடைய வல்ல செயலுக்கான உடலுறுப்பு உருவகத்தைச் சுருக்கி ‘வல்லமை’ என்று மாற்றாமல் நேரடியாகப் பாதுகாக்கிறது.
- source_word: וְעַל
  choice: …யையும்
  rationale: முந்தைய தொடருடன் இணையான இரண்டாவது பொருளைத் தமிழில் இயல்பாக ஒருங்கிணைக்கிறது. எபிரெய முன்னிடைச்சொல்லின் தொடர்பு, ‘கொடித்தண்டையும் … மகனையும்’ என்ற இணை அமைப்பில் வெளிப்படுகிறது.
- source_word: בֵּן
  choice: மகன்
  rationale: சொல்லின் நேரடியான பொருள் ‘மகன்.’ கொடி உருவகத்தின் காரணமாக இதை ‘கிளை’ என்று தீர்மானித்துவிடாமல், ஆளுருவகத்தையும் இஸ்ரவேலைக் குறிக்கக்கூடிய கூட்டுப் பொருளையும் திறந்தவாறே வைக்கிறது.
- source_word: אִמַּצְתָּה
  choice: வலிமைப்படுத்திய
  rationale: פיעל வினைவடிவத்தின் காரணவினைப் பொருளான ‘வலிமையாக்குதல்/உறுதிப்படுத்துதல்’ என்பதைக் தெளிவாகக் காட்டுகிறது.
- source_word: לָּךְ
  choice: உமக்கென்று
  rationale: தேவன் தமது நோக்கத்திற்காக அந்த மகனை வலிமைப்படுத்தினார் என்ற உறவு அல்லது பயன் நுணுக்கத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: கொடி உருவகத்தில் ‘மகன்’ என்பவரின் அடையாளம்
  choice: மூலத்தின் ‘மகன்’ என்ற சொல்லை அப்படியே வைத்து, பிரதான உரையில் அவரை ஒரு குறிப்பிட்ட மேசியானிய நபராக அடையாளப்படுத்தவில்லை.
  alternative: ‘கிளை’ என்ற தாவரவியல் உருவகம்; இஸ்ரவேலைக் குறிக்கும் கூட்டுச் சுட்டு; முன்னடையாள அல்லது மேசியானிய வாசிப்பு.
  rationale: உடனடிச் சூழல் கொடி/இஸ்ரவேல் உருவகமாக இருந்தாலும், எபிரெய உரை நேரடியாக ‘மகன்’ என்றே கூறுகிறது. எனவே உருவகத்தைத் தீர்த்துவிடாமலும் பிற்கால இறையியல் வாசிப்பை மொழிபெயர்ப்புக்குள் புகுத்தாமலும் அதன் பதற்றத்தையும் பன்முகத்தன்மையையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் மரியாதையும் கவிதைநயமும் காக்கப்பட்டுள்ளன. முந்தைய வசனத்தின் வேண்டுதலைத் தொடரும் முற்றுப்பெறாத இணை அமைப்பை உணர்த்த இறுதியில் நீண்ட கோடு வைக்கப்பட்டுள்ளது. இரு அடிக்குறிப்பு குறிகளும் தொடர்புடைய சொற்களுக்குப் பின்னரே பிரதான உரையில் இடப்பட்டுள்ளன.
