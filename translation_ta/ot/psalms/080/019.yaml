id: PSA.80.19
reference: Psalms 80:19
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: יְה֘וָ֤ה אֱלֹהִ֣ים צְבָא֣וֹת הֲשִׁיבֵ֑/נוּ הָאֵ֥ר פָּ֝נֶ֗י/ךָ וְ/נִוָּשֵֽׁעָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/019.yaml
  text: O Yahweh God of hosts[a], restore us; make your face shine[b], that we may be saved.
translation:
  language: ta
  text: 'படைகளின் கடவுளாகிய யாவே,

    எங்களை மீண்டும் நிலைநிறுத்தும்[a];

    உமது முகத்தை ஒளிரச் செய்யும்;

    அதனால் நாங்கள் மீட்கப்படுவோமாக[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எங்களைத் திருப்பும்” அல்லது “எங்களைத் திரும்பக் கொண்டுவாரும்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அப்போது நாங்கள் மீட்கப்படுவோம்.”
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: தேவனுடைய உடன்படிக்கைப் பெயரைப் பட்டப்பெயராக மாற்றாமல், எபிரெயப் பெயரின் பரவலாக அறியப்பட்ட தமிழ் ஒலிபெயர்ப்பில் தருகிறது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: இங்கு யாவே என்பதற்கு இணையாக வரும் பொதுவான இறைப்பட்டத்தை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: צְבָאוֹת
  choice: படைகளின்
  rationale: விண்ணுலகப் படைகள் உட்படப் பல படைத்திரள்களைக் குறிக்கக்கூடிய எபிரெயச் சொல்லின் விரிவைத் தக்கவைக்கிறது; 'சேனைகள்' என்பதைவிட இன்றைய வாசகருக்கு நேரடியாகப் புரியும்.
- source_word: הֲשִׁיבֵנוּ
  choice: எங்களை மீண்டும் நிலைநிறுத்தும்
  rationale: שוב என்ற வினையின் காரணவினை ஏவல் வடிவம் திருப்புதல், திரும்பக் கொண்டுவருதல், மீண்டும் நிலைபெறச் செய்தல் ஆகிய நுணுக்கங்களைக் கொண்டது. சங்கீதத்தின் சூழலில் மக்களை மீண்டும் நல்ல நிலையில் நிலைநிறுத்தும் வேண்டுதலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הָאֵר
  choice: ஒளிரச் செய்யும்
  rationale: אור என்பதன் காரணவினை ஏவல் வடிவத்தைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: פָּנֶיךָ
  choice: உமது முகத்தை
  rationale: தேவனுடைய அருளான பிரசன்னத்தைக் குறிக்கும் உருவகத்தை விளக்கவுரையாக மாற்றாமல், மூலத்தின் நேரடியான 'முகம்' என்ற படிமத்தைப் பாதுகாக்கிறது.
- source_word: וְנִוָּשֵׁעָה
  choice: அதனால் நாங்கள் மீட்கப்படுவோமாக
  rationale: முதல் நபர் பன்மை விருப்ப/வேண்டுதல் வடிவத்தையும், முந்திய வேண்டுதல்களின் விளைவு அல்லது நோக்கத் தொடர்பையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה אֱלֹהִים צְבָאוֹת என்ற இறைப்பெயர் வரிசை
  choice: படைகளின் கடவுளாகிய யாவே
  alternative: சேனைகளின் தேவனாகிய யாவே
  rationale: யாவே என்ற உடன்படிக்கைப் பெயரை நேரடியாக வைத்துக் கொண்டு, அடுத்த இரு சொற்களையும் இயல்பான தமிழ் அடைமொழித் தொடராக வழங்குகிறது. 'படைகள்' என்பது விண்ணுலகப் படைத்திரள்களை மட்டும் என்று குறுக்காமல் மூலத்தின் பரப்பைத் தக்கவைக்கிறது.
- issue: இறுதி வினையின் வேண்டுதல் மற்றும் நோக்கம்/விளைவு சார்ந்த வலிமை
  choice: அதனால் நாங்கள் மீட்கப்படுவோமாக
  alternative: அப்போது நாங்கள் மீட்கப்படுவோம்
  rationale: எபிரெய வடிவத்திலுள்ள வேண்டுதல் உணர்வைத் தக்கவைத்து, மீட்பு தேவனுடைய அருள்முகம் ஒளிர்வதன் விளைவு என்பதையும் காட்டுகிறது; அதை வெறும் உறுதியான எதிர்காலக் கூற்றாக மட்டும் மாற்றவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் வகையிலும் சங்கீத வேண்டுதலுக்கேற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. இறைவனை நோக்கும் மரியாதைப் பயன்பாடாக ‘உமது’ மற்றும் ‘செய்யும்’ போன்ற வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன; மூலத்தின் கவித்துவ வரியமைப்பு காக்கப்பட்டுள்ளது.
