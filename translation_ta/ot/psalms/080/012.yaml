lexical_decisions:
- source_word: לָמָּה
  choice: ஏன்
  rationale: புலம்பலாக எழுப்பப்படும் நேரடியான காரணக் கேள்வியை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: פָּרַצְתָּ
  choice: தகர்த்துப்போட்டீர்
  rationale: பாதுகாப்பு அரணை உடைத்தல் அல்லது அதில் பிளவு ஏற்படுத்துதல் என்ற பொருளை, திராட்சைத்தோட்ட உருவகத்திற்கு ஏற்ற இயல்பான தமிழில் தருகிறது; கடவுளை நோக்கிய ஒருமை மரியாதை வடிவமும் காக்கப்படுகிறது.
- source_word: גְדֵרֶיהָ
  choice: அதன் சுற்றுச் சுவர்களை
  rationale: திராட்சைத்தோட்டத்தைச் சுற்றிப் பாதுகாக்கும் சுவர், வேலி அல்லது முள்வேலி என்ற பொருள் வட்டத்தைச் சுட்டுகிறது; நகர மதில் என்று தவறாகப் புரிந்துகொள்ளப்படாதபடி ‘சுற்றுச்’ சேர்க்கப்பட்டுள்ளது.
- source_word: וְאָרוּהָ
  choice: அதன் பழங்களைப் பறித்துக்கொள்கிறார்களே
  rationale: אָרָה என்பதன் விளைச்சலைப் பறித்தல் அல்லது சேகரித்தல் என்ற நுண்பொருளைக் காக்கிறது. எபிரெயத்தில் பெண்பால் பின்னொட்டு கொடியைக் குறித்தாலும், தமிழில் செயப்படுபொருள் தெளிவாக இருக்க ‘பழங்களை’ வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது.
- source_word: כָּל עֹבְרֵי דָרֶךְ
  choice: வழியே போகிற அனைவரும்
  rationale: ‘வழியைக் கடந்து செல்கிற அனைவரும்’ என்ற கூட்டு அர்த்தத்தை சாதாரண வாசகர்களுக்குப் புரியும் இயல்பான கவிதைத் தமிழில் தருகிறது.
theological_decisions:
- issue: பெண்பால் பின்னொட்டுகளின் குறிப்பு
  choice: முந்தைய வசனங்களில் வரும் கொடி/திராட்சைத்தோட்ட உருவகத்தையே ‘அதன்’ என்று தொடர்ந்து குறிப்பிடுதல்
  alternative: உருவகத்தை விட்டு நேரடியாக இஸ்ரவேல் என்று மொழிபெயர்த்தல்
  rationale: உடனடி சூழலில் இஸ்ரவேல் எகிப்திலிருந்து கொண்டுவரப்பட்ட கொடியாகச் சித்தரிக்கப்படுகிறது. அந்த உருவகத்தை நேரடி உரைநடையாக மாற்றாமல் காப்பது மூலத்தின் கவித்துவத்தையும் இறையியல் அழுத்தத்தையும் நிலைநிறுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சங்கீதத்திற்கேற்ற கண்ணியமான புலம்பல் தொனி. கடவுளை நோக்கிய ஒருமை மரியாதை வடிவமான ‘போட்டீர்’ பயன்படுத்தப்பட்டுள்ளது. இரண்டாம் வாக்கியத்தின் ‘-கிறார்களே’ வடிவம், முதல் கேள்வியோடு தொடரும் வேதனையையும் குற்றமுறையீட்டையும் இயல்பாக வெளிப்படுத்துகிறது.
