lexical_decisions:
- source_word: הֶאֱכַלְתָּם
  choice: அவர்களுக்குக் ... உணவாகக் கொடுத்தீர்
  rationale: אכל என்பதன் ஹிஃபில் வடிவம் ‘உண்ணச் செய்தல்/உணவளித்தல்’ எனும் காரணப்பொருளைக் கொண்டது. தமிழில் இயல்பாகவும் மரியாதை ஒருமையிலான தேவனை நோக்கிய உரையாகவும் இதை வழங்குகிறது.
- source_word: לֶחֶם דִּמְעָה
  choice: கண்ணீரையே உணவாக
  rationale: לֶחֶם என்பதன் அடிப்படைப் பொருள் ‘அப்பம்’; ஆனால் ‘கண்ணீரின் அப்பம்’ என்பது தமிழில் செயற்கையாக ஒலிக்கும். ‘கண்ணீரையே உணவாக’ என்பது கண்ணீரே அவர்களின் உணவு என்ற எபிரெய உருவகத்தின் வலிமையை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: וַתַּשְׁקֵמוֹ
  choice: குடிக்கக் கொடுத்தீர்
  rationale: שקה என்பதன் ஹிஃபில் வடிவம் ‘குடிக்கக் கொடுத்தல்/குடிக்கச் செய்தல்’ என்று பொருள்படும். ‘குடிக்கக் கொடுத்தீர்’ என்பது முதல் அடியின் ‘உணவாகக் கொடுத்தீர்’ என்பதோடு இணையான அமைப்பை உருவாக்குகிறது.
- source_word: בִּדְמָעוֹת
  choice: கண்ணீரை
  rationale: குடிக்கக் கொடுக்கும் பொருள் கண்ணீர் என்பதைக் குறிக்கிறது; தமிழில் நேரடி செயப்படுபொருளாக வழங்குவது இயல்பானது.
- source_word: שָׁלִישׁ
  choice: நிறைந்த அளவில்
  rationale: இச்சொல் இங்கு தெளிவற்ற ஓர் அளவை அல்லது மிகுதியைக் குறிக்கலாம். துல்லியமற்ற அளவியல் பொருளை உறுதிப்படுத்தாமல், கண்ணீரின் மிகுதியை ‘நிறைந்த அளவில்’ வெளிப்படுத்துகிறது; நேரடியான மாற்றுகள் அடிக்குறிப்பில் தரப்படுகின்றன.
