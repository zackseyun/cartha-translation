  text: תְּֽהִי יָ֭דְ/ךָ עַל אִ֣ישׁ יְמִינֶ֑/ךָ עַל בֶּן אָ֝דָ֗ם אִמַּ֥צְתָּ לָּֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/017.yaml
  text: Let your hand be upon the man of your right hand[b][a], upon the son of man whom you have made strong for yourself.
translation:
  language: ta
  text: உமது வலதுகையின் மனிதன்மேல்[a], உமக்காக நீர் வலிமைப்படுத்திய மானிட மகன்மேல்[b] உமது கை இருப்பதாக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உமது வலதுபக்கத்தில் இருக்கும் மனிதன்மேல்.” இந்த எபிரெய மரபுத்தொடர் தேவனால் சிறப்பாக ஆதரிக்கப்படுகிற, அருள்பெற்ற, அல்லது அவருடைய வலதுபக்கத்தில் நிறுத்தப்பட்ட ஒருவரைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “மானிட மகன்” என்பது வெறுமனே “மனிதன்” என்று பொருள்படலாம்; வேதாகமச் சூழலில் இதற்கு அரச அல்லது மேசிய ஒலிப்பும் இருக்கக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: תְּהִי
  choice: இருப்பதாக
  rationale: היה என்பதன் வேண்டுதல் வடிவம் ஒரு ஜெப விண்ணப்பத்தை வெளிப்படுத்துகிறது; தமிழில் “இருப்பதாக” அந்த வலிமையை இயல்பாகத் தருகிறது.
- source_word: יָדְךָ
  choice: உமது கை
  rationale: ஆதரவு, ஆற்றல், செயற்பாடு ஆகியவற்றைக் குறிக்கக்கூடிய மூலத்தின் உருவகத்தை விளக்கிக் கரைக்காமல் அப்படியே காக்கிறது.
- source_word: עַל
  choice: மேல்
  rationale: இங்கு கை ஒருவர்மேல் இருப்பதைக் கூறும் எபிரெயக் கவிதை உருவகத்துக்கு இயல்பான தமிழ் இணை.
- source_word: אִישׁ יְמִינֶךָ
  choice: உமது வலதுகைக்குரிய மனிதன்
  rationale: “வலதுகையின் மனிதன்” என்ற தமிழுக்கு இயல்பற்ற சொல்லமைப்பைத் தவிர்த்தும், தேவனுடைய வலதுகையோடு சிறப்பாக இணைக்கப்பட்டவர் என்ற மூல மொழியின் பல்பொருள் தன்மையைக் காக்கிறது.
- source_word: בֶּן אָדָם
  choice: மானிட மகன்
  rationale: ஒரு மனிதனைக் குறிக்கும் எபிரெயச் சொற்றொடரின் பொருளையும் அதன் ஒருமை ஆண்பால் வடிவத்தையும், சாத்தியமான அரச அல்லது மேசிய ஒலிப்பையும் வெளிப்படையாகத் தீர்மானிக்காமல் காக்கிறது.
- source_word: אִמַּצְתָּ
  choice: நீர் வலிமைப்படுத்திய
  rationale: אמץ என்பதன் பியேல் வடிவத்திலுள்ள பலப்படுத்துதல் அல்லது வலிமையாக்குதல் என்ற காரணவினைப் பொருளைச் சுருக்கமாகத் தருகிறது.
- source_word: לָּךְ
  choice: உமக்காக
  rationale: உறவு அல்லது நோக்கத்தைக் குறிக்கும் முன்னிடைச்சொல் பின்னொட்டின் பொருளை இயல்பான தமிழில் தருகிறது; அவர் தேவனுக்கென வலிமைப்படுத்தப்பட்டவர் என்பதைக் காட்டுகிறது.
theological_decisions:
- issue: “வலதுகைக்குரிய மனிதன்” மற்றும் “மானிட மகன்” என்பவற்றை வெளிப்படையான மேசியப் பட்டங்களாக மொழிபெயர்க்க வேண்டுமா?
  choice: வெளிப்படையான மேசிய விளக்கமோ சிறப்புப் பட்டமோ சேர்க்காமல் கவிதைமிக்க மனிதக் குறிப்புகளாக வைத்தல்
  alternative: மேசியாவைக் குறிக்கும் தெளிவான பட்டமாக மொழிபெயர்த்தல்; அல்லது இஸ்ரவேலைக் குறிக்கும் கூட்டுருவகமாக விளக்குதல்
  rationale: இவ்வசனம் அரச, கூட்டுநிலை, அல்லது மேசிய தொடர்புடைய வாசிப்புகளுக்கு இடமளிக்கலாம்; ஆனால் எபிரெய மூலமே அவற்றில் ஒன்றை கட்டாயப்படுத்தவில்லை. எனவே அந்த இறையியல் இழுபறியும் உண்மையான தெளிவின்மையும் காக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், ஜெபத்திற்கேற்ற கண்ணியமான “உமது/நீர்” நடையும் கவிதைச் சமநிலையும் பயன்படுத்தப்பட்டுள்ளன. முதல் அடியில் உள்ள “உமது கை” இரண்டாம் அடியிலும் பொருந்துவதைத் தெளிவாக்க “அது” சேர்க்கப்பட்டுள்ளது; புதிய கருத்து சேர்க்கப்படவில்லை.
