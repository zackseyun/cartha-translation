source:
  edition: WLC
  text: רֹ֘עֵ֤ה יִשְׂרָאֵ֨ל הַאֲזִ֗ינָ/ה נֹהֵ֣ג כַּ/צֹּ֣אן יוֹסֵ֑ף יֹשֵׁ֖ב הַ/כְּרוּבִ֣ים הוֹפִֽיעָ/ה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/001.yaml
  text: Shepherd of Israel[a], give ear, you who lead Joseph like a flock; you who are enthroned above the cherubim[c][b], shine forth.
translation:
  language: ta
  text: 'இஸ்ரவேலின் மேய்ப்பரே, செவிசாய்த்தருளும்;

    யோசேப்பை[a] ஒரு மந்தையைப்போல் நடத்துகிறவரே,

    கேருபீன்கள்மேல் வீற்றிருப்பவரே,[b]

    ஒளிவீசித் தோன்றியருளும்!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “யோசேப்பு” என்பது இங்கு யோசேப்பின் வம்சத்தாரை, குறிப்பாக வடக்குக் கோத்திரங்களை, அல்லது இஸ்ரவேல் மக்களை ஒட்டுமொத்தமாகக் குறிக்கக்கூடும்; எபிரெய உரை தனிப்பெயரையே பயன்படுத்துகிறது.
    reason: cultural_note
  - marker: b
    text: அல்லது, “கேருபீன்களின் நடுவில் வீற்றிருப்பவரே.” எபிரெயத்தில் சொற்சொல்லாக “கேருபீன்களுடன் தொடர்பாக வீற்றிருப்பவர்/அமர்ந்திருப்பவர்” என்று உள்ளது; துல்லியமான இடவுறவு வெளிப்படையாகக் குறிப்பிடப்படவில்லை. இது கடவுளின் அரசப் பிரசன்னத்தைக் குறிக்கும் வழக்கமான சொற்றொடர்.
    reason: alternative_reading
lexical_decisions:
- source_word: רֹעֵה
  choice: மேய்ப்பர்
  rationale: இது רעה என்பதன் Qal நிகழ்கால வினையெச்ச வடிவம்; இங்கு கடவுளை நேரடியாக அழைக்கும் பட்டப்பெயராக வருகிறது. “மேய்ப்பர்” மூலத்தின் மேய்ச்சல் உருவகத்தை இயல்பாகத் தக்கவைக்கிறது.
- source_word: הַאֲזִינָה
  choice: செவிசாய்த்தருளும்
  rationale: אזן என்பதன் கட்டளை வடிவம் கவனமாகக் கேட்குமாறு வேண்டுகிறது. “செவிசாய்த்தருளும்” என்பது கவிதைக்குரிய கண்ணியமான வேண்டுகோளாகவும், சாதாரண “கேளும்” என்பதைவிட கவனித்துக் கேட்கும் நுணுக்கத்தைத் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: נֹהֵג
  choice: நடத்துகிறவர்
  rationale: נהג என்பதன் வினையெச்சம் மந்தையை வழிநடத்தும் செயலைக் குறிக்கிறது. “நடத்துகிறவர்” மேய்ப்பனின் செயற்பாட்டை இயல்பான தமிழில் தெரிவிக்கிறது; “ஓட்டுகிறவர்” தேவையற்ற கடுமையை உணர்த்தக்கூடும்.
- source_word: כַצֹּאן
  choice: ஒரு மந்தையைப்போல்
  rationale: צאן என்பது செம்மறியாடுகள்/வெள்ளாடுகளைத் தொகுதியாகக் குறிக்கும் கூட்டுப்பெயர். “ஒரு மந்தையைப்போல்” அதன் கூட்டுப் பொருளையும் மேய்ப்புருவகத்தையும் காக்கிறது.
- source_word: יוֹסֵף
  choice: யோசேப்பு
  rationale: மூலத்தில் உள்ள தனிப்பெயர் அப்படியே தக்கவைக்கப்படுகிறது; அதை விளக்கவுரையாக “இஸ்ரவேல்” என்று மாற்றவில்லை.
- source_word: יֹשֵׁב הַכְּרוּבִים
  choice: கேருபீன்களின்மேல் அரியணையில் அமர்ந்திருப்பவர்
  rationale: ישב இங்கு வெறுமனே உட்கார்ந்திருப்பதை அல்ல, கேருபீன்களுடன் தொடர்புடைய கடவுளின் அரச பிரசன்னத்தையும் அரியணை உருவகத்தையும் குறிக்கிறது. இடவுறவு மூலத்தில் முழுமையாகத் தெளிவுபடுத்தப்படாததால் மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: הוֹפִיעָה
  choice: ஒளிவீசித் தோன்றியருளும்
  rationale: இந்த Hiphil கட்டளை வடிவம் தெய்வத் தோற்றச் சூழலில் ஒளிமிகுந்து வெளிப்படுதல் அல்லது பிரகாசித்துத் தோன்றுதல் எனப் பொருள்படும். இத்தமிழாக்கம் தோற்றத்தையும் ஒளிமாட்சியையும் இணைத்துக் காக்கிறது.
theological_decisions:
- issue: கேருபீன்களுடன் தொடர்புடைய கடவுளின் அரியணைப் பிரசன்னம்
  choice: கேருபீன்களின்மேல் அரியணையில் அமர்ந்திருப்பவர்
  alternative: கேருபீன்களின் நடுவில் அரியணையில் அமர்ந்திருப்பவர்
  rationale: இந்தச் சொற்றொடர் உடன்படிக்கைப் பெட்டி/ஆலயப் பின்னணியிலான அரச உருவகத்தை எழுப்புகிறது. “அரியணையில்” என்பது ישב என்பதன் அரசியல்-தெய்வவியல் வலிமையை வெளிப்படுத்துகிறது; “மேல்” முதன்மை உரையில் வைக்கப்பட்டாலும், “நடுவில்” என்ற மரபான இடவியல் புரிதல் சாத்தியமானதால் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: ‘யோசேப்பு’ என்ற பெயரின் சமூகப் பிரதிநிதித்துவம்
  choice: தனிப்பெயரான ‘யோசேப்பு’ என்பதை உரையில் தக்கவைத்தல்
  alternative: இஸ்ரவேல் மக்கள் அல்லது வடக்குக் கோத்திரங்கள் என்று உரையிலேயே விளக்குதல்
  rationale: பெயர் இங்கு யோசேப்பின் வம்சத்தாரையோ, குறிப்பாக வடக்குக் கோத்திரங்களையோ, விரிவாக இஸ்ரவேலையோ குறிக்கக்கூடும். மூலத்தின் பெயரையும் அதன் பரப்பளவு குறித்த தெளிவின்மையையும் மாற்றாமல் வைத்து, சாத்தியமான குறிப்பு அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத்தமிழில், சங்கீதக் கவிதைக்கு ஏற்ற கண்ணியமான நேரடி அழைப்பு நடை பயன்படுத்தப்பட்டுள்ளது. “அருளும்” வடிவங்கள் தமிழில் இறைவனை நோக்கிய வேண்டுகோளுக்கு இயல்பான மரியாதையை அளிக்கின்றன; மூலத்தில் இல்லாத கோட்பாட்டுச் சிறப்புரைகள் சேர்க்கப்படவில்லை. மசோரா உரையின் இரண்டு வேண்டுகோள்களும் அரைப்புள்ளி மற்றும் வரியமைப்பால் தெளிவுபடுத்தப்பட்டுள்ளன.
