  language: ta
  text: ஆண்டவரே, உறுதியான அன்பு உமக்கே உரியது[a]; ஏனெனில் ஒவ்வொருவருக்கும் அவரவர் செயலுக்கு ஏற்ப நீர் கைம்மாறு அளிப்பீர்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில் இது வினைச்சொல் இல்லாத வாக்கியம்; ‘உமக்கு’ என்பது முன்னிலைப்படுத்தப்பட்டு, உறுதியான அன்பு ஆண்டவருக்கே உரியது என்பதை வலியுறுத்துகிறது. வேறுவகையில்: ‘ஆண்டவரே, உறுதியான அன்பு உம்முடையது.’'
    reason: lexical_alternative
  - marker: b
    text: ‘கைம்மாறு அளிப்பீர்’ என்பது ஒருவருக்குரியதை அவரது செயலுக்கு ஏற்ப அளிப்பதைக் குறிக்கிறது; அது வெகுமதியை மட்டும் அல்ல, சாதகமான அல்லது பாதகமான விளைவையும் உள்ளடக்கலாம்.
    reason: lexical_scope
lexical_decisions:
- source_word: וּלְךָ
  choice: உமக்கே உரியது
  rationale: முன்னிலைப்படுத்தப்பட்ட ‘உமக்கு’ என்ற எபிரெயச் சொற்றொடர் உடைமையையும் வலியுறுத்தலையும் குறிக்கிறது. வினையில்லா மூலவாக்கியத்தின் பொருளை இயல்பான தமிழில் ‘உமக்கே உரியது’ எனத் தருகிறது.
- source_word: אֲדֹנָי
  choice: ஆண்டவரே
  rationale: தெய்வீகப் பட்டமான ‘அதோனாய்’ நேரடி அழைப்பாக வருகிறது; நவீன மரியாதையான தமிழில் ‘ஆண்டவரே’ இயல்பானது.
- source_word: חָסֶד
  choice: உறுதியான அன்பு
  rationale: חסד என்பதில் நிலைத்த அன்பு, விசுவாசமான பரிவு, இரக்கம் ஆகிய கருத்துகள் உள்ளன. ‘உறுதியான அன்பு’ அதன் அன்பையும் நிலைத்த விசுவாசத்தையும் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்திய கூற்றுக்கான காரணம் அல்லது ஆதாரத்தை இங்கு அறிமுகப்படுத்துவதால் ‘ஏனெனில்’ பொருத்தமானது.
- source_word: תְשַׁלֵּם
  choice: கைம்மாறு அளிப்பீர்
  rationale: שלם என்பதன் பியேல் வடிவம் ஒருவருக்குரியதை—நன்மையாகவோ தீமையாகவோ—திருப்பி அளிப்பதைக் குறிக்கிறது. ‘கைம்மாறு அளிப்பீர்’ நேர்மறைப் பலனுக்கு மட்டும் பொருளைக் கட்டுப்படுத்தாது.
- source_word: לְאִישׁ
  choice: ஒவ்வொருவருக்கும்
  rationale: இலக்கணத்தில் ஆண்பால் ஒருமையாகிய אִישׁ இங்கு பொதுப்பிரதிநிதித்துவ மற்றும் பகிர்மானப் பொருளில் வருகிறது. தமிழில் ‘ஒவ்வொருவருக்கும்’ அந்தப் பொதுப்பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כְּמַעֲשֵׂהוּ
  choice: அவரவர் செயலுக்கு ஏற்ப
  rationale: ஒருவருடைய செயலும் அதற்கேற்ற கைம்மாறும் இடையிலான ஒப்புமையைத் தெரிவிக்கிறது. ‘அவரவர்’ பகிர்மானத் தொடர்பைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: தெய்வீக உறுதியான அன்புக்கும் செயலுக்கேற்ற கைம்மாறுக்கும் உள்ள தொடர்பு
  choice: கடவுளின் உறுதியான அன்பையும் ஒவ்வொருவருக்கும் செயலுக்கேற்ற கைம்மாறு அளிப்பதையும் எந்த ஒன்றையும் மென்மைப்படுத்தாமல் இணைத்தே மொழிபெயர்த்தல்
  alternative: חסד என்பதை ‘இரக்கம்’ என்று மட்டும் குறுக்குதல், அல்லது תשלם என்பதை நேர்மறையான ‘வெகுமதி அளித்தல்’ என்று மட்டும் மொழிபெயர்த்தல்
  rationale: மூலவசனம் நிலைத்த அன்பையும் நீதியான கைம்மாறையும் ஒன்றாக வைத்திருக்கிறது. ‘கைம்மாறு’ என்பது நன்மை அல்லது தீமை ஆகிய இரு திசைகளையும் திறந்தவாறே வைத்து, மூலத்தின் இறையியல் பதற்றத்தைப் பாதுகாக்கிறது.
