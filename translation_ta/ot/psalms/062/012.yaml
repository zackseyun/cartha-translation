  register: நவீனத் தரத் தமிழில், சங்கீதத்துக்கேற்ற கண்ணியமான நேரடி அழைப்பு நடை பயன்படுத்தப்பட்டுள்ளது. ‘உமக்கே’, ‘நீர்’, ‘அளிப்பீர்’ ஆகிய மரியாதை வடிவங்கள் தொடர்ச்சியாக உள்ளன; ‘அவரவர்’ பொதுப்பிரதிநிதித்துவப் பொருளை இயல்பாகத் தருகிறது.
