  text: אַל תִּבְטְח֣וּ בְ/עֹשֶׁק֮ וּ/בְ/גָזֵ֪ל אַל תֶּ֫הְבָּ֥לוּ חַ֤יִל כִּֽי יָנ֑וּב אַל תָּשִׁ֥יתוּ לֵֽב־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/062/010.yaml
  text: Do not trust in oppression[a], and do not put vain hope in robbery; if wealth increases, do not set your heart on it.
translation:
  language: ta
  text: 'ஒடுக்குமுறையில் நம்பிக்கை வைக்காதீர்கள்;

    கொள்ளையில் வீண் நம்பிக்கை வைக்காதீர்கள்[a].

    செல்வம் பெருகினால்,

    அதன்மேல் உங்கள் மனதைப் பதிக்காதீர்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கொள்ளையில் வீணாக நடந்துகொள்ளாதீர்கள்,” அல்லது “கொள்ளையைப் பற்றிப் பெருமை பேசாதீர்கள்.” எபிரேய வினைச்சொல்லின் பொருளைத் தீர்மானிப்பது கடினம்; அது வெறுமையாக நடந்துகொள்வதையோ, வெறுமையான ஒன்றில் நம்பிக்கை வைப்பதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּבְטְחוּ
  choice: நம்பாதீர்கள்
  rationale: בטח என்பதன் முதன்மைப் பொருள் நம்புதல் அல்லது நம்பிக்கை வைத்தல்; எளிமையான நவீனத் தமிழில் இது இயல்பாக உள்ளது.
- source_word: בְעֹשֶׁק
  choice: ஒடுக்குமுறையை
  rationale: עֹשֶׁק என்பது சுரண்டல், வற்புறுத்தல், அநியாய ஆதாயம் ஆகியவற்றை உள்ளடக்கக்கூடியது; ‘ஒடுக்குமுறை’ அதன் பரந்த அறநெறிப் பொருளைக் காக்கிறது.
- source_word: בְגָזֵל
  choice: கொள்ளையில்
  rationale: גָזֵל என்பது வலுக்கட்டாயமாகப் பறித்தல் அல்லது கொள்ளையைக் குறிக்கிறது; ‘கொள்ளை’ நேரடியானதும் இணை அமைப்புக்கு ஏற்றதுமாகும்.
- source_word: תֶּהְבָּלוּ
  choice: வீண் நம்பிக்கை வைக்காதீர்கள்
  rationale: הבל வேரிலிருந்து வரும் இவ்வினைச்சொல் இங்கு கடினமானது; வெறுமையாக அல்லது வீணாக நடந்துகொள்வது, வெறுமையான ஒன்றில் நம்பிக்கை வைப்பது ஆகிய நுண்பொருள்கள் சாத்தியம். இணை வரியின் சூழலில் இத்தேர்வு இயல்பாக உள்ளது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் காக்கப்படுகின்றன.
- source_word: חַיִל
  choice: செல்வம்
  rationale: חַיִל என்பதற்கு வலிமை, வளங்கள், செல்வம் ஆகிய பொருள்கள் உண்டு; ‘பெருகுதல்’ என்ற தொடருடன் இங்கு பொருட்செல்வமே சூழலுக்கு மிகவும் பொருந்துகிறது.
- source_word: כִּי יָנוּב
  choice: பெருகினாலும்
  rationale: נוב என்பதன் அடிப்படைப் பொருள் துளிர்த்தல் அல்லது வளர்தல். செல்வத்தைப் பற்றிய இச்சூழலில் ‘பெருகுதல்’ இயல்பானது; כִּי-யின் சூழல்சார் நிபந்தனைத் தன்மையை ‘-இனாலும்’ வெளிப்படுத்துகிறது.
- source_word: תָּשִׁיתוּ לֵב
  choice: அதன்மேல் உங்கள் மனதைப் பதிக்காதீர்கள்
  rationale: שׁית לב என்பது ஒருவரின் உள்ளார்ந்த கவனம், விருப்பம் அல்லது சார்பை ஒன்றின்மேல் நிலைநிறுத்துவதைக் குறிக்கும். ‘மனதைப் பதித்தல்’ தமிழில் அந்த உள்ளார்ந்த பற்றை இயல்பாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: நடுவரியில் உள்ள எச்சரிக்கையின் பொருள்
  choice: கொள்ளையில் வீண் நம்பிக்கை வைக்க வேண்டாம் என்ற எச்சரிக்கையாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘கொள்ளையினால் வீணராகாதீர்கள்’ அல்லது ‘கொள்ளையைப் பற்றிப் பெருமை பேசாதீர்கள்’ என்றும் எபிரெய வினைச்சொல்லைப் புரிந்துகொள்ளலாம்.
  rationale: முதல் வரியின் ‘நம்பாதீர்கள்’ என்பதுடன் இணையாக வாசிக்கும்போது வெறுமையான நம்பிக்கை என்ற பொருள் பொருந்துகிறது. ஆயினும் கடினமான எபிரெய வினைச்சொல்லின் பிற சாத்தியங்களை அடிக்குறிப்பு வெளிப்படையாகக் காக்கிறது; எந்தக் குறிப்பிட்ட கோட்பாட்டு விளக்கமும் திணிக்கப்படவில்லை.
- issue: பெருகும் செல்வத்திற்கான எச்சரிக்கை
  choice: அநியாயமாகப் பெற்ற செல்வத்தை மட்டும் அல்லாமல், பொதுவாகப் பெருகும் செல்வத்தின்மேல் உள்ளத்தைப் பதிக்க வேண்டாம் என மொழிபெயர்க்கப்பட்டது.
  alternative: முந்தைய இரு வரிகளால், ‘செல்வம்’ என்பது அநியாயமாகச் சேர்த்த செல்வத்தை மட்டும் குறிப்பதாக வாசிக்கலாம்.
  rationale: חַיִל தனியாகப் பொதுவான செல்வத்தைக் குறிக்க முடியும்; மூன்றாம் வரி முந்தைய எச்சரிக்கையை விரிவுபடுத்துகிறதா அல்லது அதே அநியாயச் செல்வத்தைக் தொடர்கிறதா என்ற பதற்றத்தை மொழிபெயர்ப்பு கட்டாயமாகத் தீர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மூன்று வரி அமைப்பு காக்கப்பட்டுள்ளது. ‘இதயம்’ என்ற சொல்லைச் சொற்சொல்லாகப் பயன்படுத்தாமல், தமிழில் உள்ளார்ந்த விருப்பத்தையும் சார்பையும் இயல்பாகக் குறிக்கும் ‘மனதைப் பதிக்காதீர்கள்’ தேர்ந்தெடுக்கப்பட்டது.
