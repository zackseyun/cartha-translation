base_translation:
  language: en
  yaml_path: translation/ot/psalms/062/009.yaml
  text: Surely the sons of man are a breath; the sons of men are a lie[a]. In the balances they go up; together they are lighter than a breath.
translation:
  language: ta
  text: 'நிச்சயமாக, மனிதரின் புதல்வர்கள் வெறும் மூச்சே;

    ஆடவரின் புதல்வர்கள் பொய்யே.[a]

    தராசுகளில் வைக்கப்படும்போது அவர்கள் மேலெழுகின்றனர்;

    அவர்கள் அனைவரும் சேர்ந்து ஒரு மூச்சைவிட இலேசானவர்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: விளக்கப் பொருளில், ‘தாழ்நிலையினர்’ என்றும் ‘உயர்நிலையினர்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயத்தில் சொற்சொல்லாக ‘மனிதரின் புதல்வர்கள்’ என்றும் ‘ஆடவரின் புதல்வர்கள்’ என்றும் உள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: אַךְ
  choice: நிச்சயமாக
  rationale: சங்கீதச் சூழலில் வரும் வலியுறுத்தலையும் உறுதியான கூற்றையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: הֶבֶל
  choice: வெறும் மூச்சு
  rationale: நிலையற்ற, சாரமற்ற ஒன்றைக் குறிக்கும் உருவகத்தைத் தெளிவாகக் காக்கிறது; ‘வீண்’ போன்ற கருத்தாக்கச் சொல்லைவிட எபிரெயப் படிமத்திற்கு நெருக்கமானது.
- source_word: בְּנֵי אָדָם
  choice: மனிதரின் புதல்வர்கள்
  rationale: ‘மனிதனின் மகன்கள்’ என்ற எபிரெய வடிவத்தை முடிந்தவரை காத்து, அடுத்த இணைச் சொல்லிலிருந்து அதன் சொல் வேறுபாட்டையும் காட்டுகிறது.
- source_word: כָּזָב
  choice: பொய்
  rationale: பொய்மை அல்லது நம்பத்தகாத தன்மையைச் சுருக்கமாகவும் வலிமையாகவும் தெரிவித்து, ‘மூச்சு’ என்பதுடன் உள்ள கவிதை இணைப்பைக் காக்கிறது.
- source_word: בְּנֵי אִישׁ
  choice: ஆடவரின் புதல்வர்கள்
  rationale: בְּנֵי אָדָם என்பதிலிருந்து வேறுபட்ட אִישׁ என்ற சொல்லைத் தமிழிலும் வேறுபடுத்திக் காட்டுகிறது; சமூகத் தர வேறுபாட்டை முதன்மை உரைக்குள் முன்கூட்டியே புகுத்தவில்லை.
- source_word: בְּמֹאזְנַיִם
  choice: தராசுத் தட்டில்
  rationale: எடைபார்க்கும் தராசின் காட்சியை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לַעֲלוֹת
  choice: மேலெழுகிறார்கள்
  rationale: எடையற்றதால் தராசுத் தட்டு மேலே எழும் உருவகத்தை விளக்கமாக்காமல் நேரடியாகக் காக்கிறது.
- source_word: מֵהֶבֶל
  choice: ஒரு மூச்சைவிட இலேசானவர்கள்
  rationale: ஒப்பீட்டுப் பொருளையும் தராசு உருவகத்தையும் தமிழில் தெளிவாக இணைக்கிறது.
- source_word: יָחַד
  choice: எல்லாரும் சேர்ந்தாலும்
  rationale: அனைவரையும் ஒருங்கே எடுத்தாலும் அதே தீர்ப்பே பொருந்தும் என்ற கூட்டுமொத்தப் பொருளை இயல்பாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: בְּנֵי אָדָם / בְּנֵי אִישׁ என்ற இணைச் சொற்றொடர்களை எவ்வாறு மொழிபெயர்ப்பது
  choice: ‘மனிதரின் புதல்வர்கள் / ஆடவரின் புதல்வர்கள்’ என்று சொல் வேறுபாட்டையும் இணை அமைப்பையும் முதன்மை உரையில் காத்தல்
  alternative: ‘தாழ்நிலையினர் / உயர்நிலையினர்’ என்று சமூகப் படிநிலைகளாக விளக்குதல்
  rationale: தாழ்ந்தோர், உயர்ந்தோர் என்ற சமூக வேறுபாடு சாத்தியமான விளக்கம் என்றாலும், எபிரெய உரை நேரடியாக இரண்டு வேறுபட்ட மனிதர்-குறிக்கும் சொற்களைக் கொண்ட இணை அமைப்பையே தருகிறது. ஆகவே தெளிவின்மையைத் தீர்த்துவிடாமல் முதன்மை உரையில் வடிவம் காக்கப்பட்டு, சமூகத் தர விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைத் தன்மையும் கண்ணியமான நடையும் காக்கப்பட்டுள்ளன. ‘புதல்வர்கள்’ என்பது வழக்குச் சொல்லான ‘மகன்கள்’ விட சற்றுக் கவிதை நயமுடையதாக இருந்தாலும், இரண்டு எபிரெய இணைச் சொற்றொடர்களின் வடிவத்தையும் பாலினச் சுட்டையும் தெளிவாகத் தக்கவைக்கிறது.
