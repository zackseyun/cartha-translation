lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: பாடற்குழுத் தலைவருக்கு
  rationale: சங்கீதத் தலைப்புகளில் இசை நிகழ்த்துதலை மேற்பார்வையிடுபவரைக் குறிக்கும் வழக்கமான சொல்லாக இருப்பதால், நவீன தமிழில் தெளிவாக இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: עַל
  choice: இன்படி
  rationale: இங்கு இசைமுறை, மெட்டு அல்லது நிகழ்த்தல் குறிப்பு ஆகியவற்றில் ஒன்றைக் குறிக்கலாம்; அவற்றில் ஒன்றை மட்டும் உறுதிப்படுத்தாமல் மூலத்தின் தெளிவின்மையைப் பேணுகிறது.
- source_word: יְדוּתוּן
  choice: எதுத்தூன்
  rationale: இது ஒரு பெயர் என்பதால் ஒலிபெயர்க்கப்பட்டது; எதுத்தூன் என்ற இசைக்கலைஞரையோ அவரோடு தொடர்புடைய இசைமுறை அல்லது மெட்டையோ குறிக்கக்கூடும்.
- source_word: מִזְמוֹר
  choice: சங்கீதம்
  rationale: சங்கீதத் தலைப்புகளில் காணப்படும் இந்த இலக்கிய-இசை வகைப்பாட்டுக்கான இயல்பான, நிலைபெற்ற தமிழ் சொல்.
- source_word: לְדָוִד
  choice: தாவீதின்
  rationale: எபிரெய முன்னிடைச்சொல் ஆசிரியத்துவம், அர்ப்பணிப்பு அல்லது தொடர்பு ஆகியவற்றைக் குறிக்கக்கூடும்; ‘தாவீதின்’ என்பது அவற்றில் ஒன்றை மட்டும் கட்டாயப்படுத்தாமல் பரந்த தொடர்பைப் பேணுகிறது.
theological_decisions:
- issue: தலைப்பிலுள்ள לְדָוִד என்பதன் பொருள்
