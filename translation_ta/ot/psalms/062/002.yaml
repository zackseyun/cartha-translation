lexical_decisions:
- source_word: אַךְ הוּא
  choice: அவர் ஒருவரே
  rationale: אַךְ இங்கு தனித்தன்மையை வலியுறுத்துவதால், கடவுள் மட்டுமே பாதுகாப்பின் ஆதாரம் என்பதை இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: צוּרִי
  choice: என் கற்பாறை
  rationale: உறுதியையும் பாதுகாப்பையும் குறிக்கும் மூல உருவகத்தைத் தக்கவைக்கிறது.
- source_word: וִישׁוּעָתִי
  choice: என் மீட்பு
  rationale: இச்சூழலில் ஆபத்திலிருந்து விடுவித்தல், பாதுகாத்தல் ஆகிய பரந்த பொருளை இயல்பான நவீன தமிழில் தருகிறது; ‘இரட்சிப்பு’ என்பதும் சாத்தியமான மாற்று.
- source_word: מִשְׂגַּבִּי
  choice: என் அரண்
  rationale: பாதுகாப்பான உயர்ந்த கோட்டை அல்லது புகலிடத்தின் உருவகத்தைச் சுருக்கமாகவும் கண்ணியமாகவும் தெரிவிக்கிறது.
- source_word: לֹא אֶמּוֹט
  choice: நிலைகுலையமாட்டேன்
  rationale: அசைக்கப்படுதல், தடுமாறுதல் என்ற உருவகப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: רַבָּה
  choice: பெரிதும்
  rationale: அசைவின் அளவைக் குறிக்கும் வினையடைப் பயன்பாட்டைத் தக்கவைத்து, முழுமையான மறுப்பாக மாற்றாமல் மூலத்தின் நுணுக்கத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: இறுதி கூற்றில் வெளிப்படும் பாதுகாப்பின் அளவு
  choice: நான் பெரிதும் நிலைகுலையமாட்டேன்
  alternative: நான் நிலைகுலையமாட்டேன்
  rationale: எபிரெய உரையில் רַבָּה என்ற அளவைக் குறிக்கும் சொல் இருப்பதால், அதைத் தக்கவைத்தல் இவ்வசனத்தை சங்கீதத்திலுள்ள வலிமையான முழுமைக் கூற்றுகளோடு ஒத்திசைத்து விடாமல் அதன் உண்மையான நுணுக்கத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் சங்கீதத்திற்கேற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘கற்பாறை’ மற்றும் ‘அரண்’ என்ற மூல உருவகங்கள் தக்கவைக்கப்பட்டுள்ளன; இறுதி வாக்கியத்தில் உள்ள அளவுநுணுக்கமும் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
