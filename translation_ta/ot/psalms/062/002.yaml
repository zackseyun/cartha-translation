    text: அல்லது, “நான் நிலைகுலையமாட்டேன்.” எபிரெய மூலத்தில் “பெரிதும்” அல்லது “மிகவும்” என்று பொருள்படும் அளவுச் சொல் உள்ளது; ஆகவே இங்குள்ள கூற்று முழுமையான மறுப்பைவிடச் சற்றே மிதமானது.
