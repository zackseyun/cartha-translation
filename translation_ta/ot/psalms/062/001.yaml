  text: אַ֣ךְ אֶל אֱ֭לֹהִים דּֽוּמִיָּ֣ה נַפְשִׁ֑/י מִ֝מֶּ֗/נּוּ יְשׁוּעָתִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/062/001.yaml
  text: Only for God is my soul silent[b][a]; from him comes my salvation.
translation:
  language: ta
  text: என் ஆத்துமா தேவனை மட்டுமே நோக்கி, மௌனமாய்க் காத்திருக்கிறது[a]; அவரிடமிருந்து என் மீட்பு வருகிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தேவனுக்காக மட்டுமே என் ஆத்துமா மௌனமாக இருக்கிறது,” அல்லது “தேவனில் மட்டுமே என் ஆத்துமா அமைதியடைகிறது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: மட்டுமே
  rationale: இங்கு இந்தச் சொல் தேவனை நோக்கிய தனிப்பட்ட, முழுமையான சார்பை வலியுறுத்தும் கட்டுப்படுத்தும் பொருளைக் கொண்டுள்ளது.
- source_word: אֶל
  choice: தேவனுக்காக
  rationale: இந்த முன்னிடைச்சொல் தேவனை நோக்கிய உள்ளார்ந்த நிலைப்பாட்டைக் குறிக்கிறது; மௌனமான காத்திருப்புடன் இயல்பாக இணைவதற்காக ‘தேவனுக்காக’ என மொழிபெயர்க்கப்பட்டது.
- source_word: אֱלֹהִים
  choice: தேவன்
  rationale: சங்கீதத்தின் இச்சூழலில் இஸ்ரவேலின் தேவனையே ஒருமையில் குறிக்கிறது.
- source_word: דּוּמִיָּה
  choice: மௌனமாகக் காத்திருக்கிறது
  rationale: இந்தப் பெயர்ச்சொல் மௌனம், அமைதி, அசைவின்மை ஆகிய பொருள்களை உடையது. தமிழில் வெறும் ‘மௌனமாக இருக்கிறது’ என்பது இயல்பற்றதாகவும் தவறாகப் புரியக்கூடியதாகவும் இருப்பதால், மௌனத்தின் படிமத்தைப் பேணிக்கொண்டே சூழலில் உள்ள காத்திருப்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: נַפְשִׁי
  choice: என் ஆத்துமா
  rationale: இது உயிர், தன்முழுமை, உள்ளார்ந்த நபர் ஆகியவற்றைக் குறிக்கலாம்; கவிதைநடையையும் உள்ளார்ந்த நம்பிக்கையையும் பேண ‘என் ஆத்துமா’ பயன்படுத்தப்பட்டது.
- source_word: מִמֶּנּוּ
  choice: அவரிடமிருந்தே
  rationale: மீட்பின் மூலமாக தேவனைச் சுட்டுகிறது. ‘-ஏ’ வலியுறுத்தல் தொடக்கத்திலுள்ள தனிப்பட்ட சார்பை தமிழில் இயல்பாகத் தொடர்கிறது.
- source_word: יְשׁוּעָתִי
  choice: என் மீட்பு
  rationale: இச்சொல் இரட்சிப்பு அல்லது ஆபத்திலிருந்து விடுதலை என்பதைக் குறிக்கிறது; சங்கீதத்தின் உடனடி சூழலில் இயல்பான, தெளிவான சொல்லாக ‘மீட்பு’ தேர்ந்தெடுக்கப்பட்டது.
theological_decisions:
- issue: דּוּמִיָּה נַפְשִׁי என்ற சொற்றொடரின் பொருள்
  choice: தேவனுக்காக ஆத்துமா மௌனமாகக் காத்திருப்பதாகக் கூறுதல்
  alternative: ஆத்துமா தேவனில் அமைதியாக இருக்கிறது; அல்லது தேவனை நோக்கி மௌனமாக இருக்கிறது
  rationale: எபிரெயப் பெயர்ச்சொல் மௌனம், அமைதி, நம்பிக்கையுடன் காத்திருத்தல் ஆகிய நுணுக்கங்களைத் தாங்குகிறது. முதன்மை உரை மௌனத்தின் படிமத்தையும் மறைமுகமான காத்திருப்பையும் இணைக்கிறது; அடிக்குறிப்பு மற்ற சாத்தியங்களைப் பேணுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சங்கீதத்திற்கேற்ற கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆத்துமா’ என்ற பரவலாக அறியப்பட்ட வேதாகமச் சொல் தக்கவைக்கப்பட்டுள்ளது; மூலத்தின் மௌனம்/காத்திருப்பு/அமைதி என்ற பொருள் விரிவை அடிக்குறிப்பு பாதுகாக்கிறது.
