theological_decisions:
- issue: ‘அவனுடைய உயர்ந்த நிலையிலிருந்து’ என்பதிலுள்ள ஒருமை ஆண்பால் சுட்டும் நபரும், தள்ளப்படுபவரும் யார் என்பது
  choice: பகைவர்கள் சங்கீதக்காரன் அல்லது நீதிமானான தனிநபரை அவரது உயர்ந்த அல்லது பாதுகாப்பான நிலையிலிருந்து வீழ்த்த முயல்வதாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘ஒருவனை’ என்று பொதுவாகக் கூறலாம்; அல்லது ‘நிலை’ என்பதற்குப் பதிலாக ‘கண்ணியம்/மேன்மை’ என்பதை முன்னிறுத்தலாம்.
  rationale: எபிரெயப் பின்னொட்டு ஒருமை ஆண்பாலில் உள்ளது. குறிப்பிட்ட வேறு இறையியல் அடையாளத்தைச் சேர்க்காமல், தனிநபர் இலக்காக இருப்பதை ‘அவனை/அவனுடைய’ என்பவை பாதுகாக்கின்றன.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘சதித்திட்டம் தீட்டுகிறார்கள்’ பகைமையான ஆலோசனையை வெளிப்படுத்துகிறது; ‘வாழ்த்துகிறார்கள்/சபிக்கிறார்கள்’ என்ற நேரெதிர் அமைப்பு மூலத்தின் கூர்மையான முரண்பாட்டைப் பாதுகாக்கிறது. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
