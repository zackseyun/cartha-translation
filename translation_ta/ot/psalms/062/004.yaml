  yaml_path: translation/ot/psalms/062/004.yaml
  text: They only plan to cast him down from his high position[a]; they delight in falsehood. With their mouth they bless, but inwardly they curse[b]. Selah
translation:
  language: ta
  text: அவனை அவனுடைய உயர்ந்த நிலையிலிருந்து தள்ளிவிடவே அவர்கள் திட்டமிடுகிறார்கள்[a]; பொய்யில் மகிழ்ச்சி அடைகிறார்கள். வாயால் வாழ்த்துகிறார்கள்; ஆனால் உள்ளத்தில் சபிக்கிறார்கள்[b]. சேலா.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவனுடைய கண்ணியத்திலிருந்து,’ ‘அவனுடைய மேன்மையிலிருந்து,’ அல்லது ‘அவனுடைய உயர்விலிருந்து.’
    reason: lexical_alternative
  - marker: b
    text: 'எபிரெயத்தில் சொல்லுக்கு சொல், ‘அவன் வாயால் அவர்கள் வாழ்த்துகிறார்கள்’; ஆனால் இங்கு கூட்டுப் பொருள் இருக்கலாம்: வெளிப்படையாக அவர்கள் வாழ்த்துகிறார்கள், உள்ளத்திலோ சபிக்கிறார்கள்.'
    reason: lexical_alternative
