  text: For God alone[a], be silent, my soul[c][b], for my hope is from him.
translation:
  language: ta
  text: என் உள்ளமே, தேவனை மட்டுமே நோக்கி[a] அமைதியாயிரு[b]; ஏனெனில் என் நம்பிக்கை அவரிடமிருந்து வருகிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, வினைச்சொல்லை அறிவுறுத்தலாக அல்லாமல் ஒரு கூற்றாக எடுத்தால், “தேவனை மட்டுமே நோக்கி என் உள்ளம் அமைதியாகக் காத்திருக்கிறது.”
    reason: alternative_reading
  - marker: b
    text: எபிரெய வினைச்சொல் அமைதியாக இருத்தல், சலனமின்றி இருத்தல், அல்லது அமைதியாகக் காத்திருத்தல் ஆகிய பொருள்களைத் தரக்கூடும். ஆகவே, “அமைதியாகக் காத்திரு” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: மட்டுமே
  rationale: இச்சூழலில் இந்தச் சொல் தேவனை மட்டுமே சார்ந்திருப்பதை வலியுறுத்துகிறது; தமிழில் இயல்பாக அந்தத் தனிப்படுத்தும் பொருளைத் தருகிறது.
- source_word: לֵאלֹהִים
  choice: தேவனுக்காக
  rationale: לְ முன்னிடைச்சொல்லின் தேவனை நோக்கிய அமைதியான காத்திருப்பு அல்லது நிலைநிற்றல் என்ற திசையைத் தக்கவைக்கிறது.
- source_word: דּוֹמִּי
  choice: அமைதியாயிரு
  rationale: דמם வேர்ச்சொல்லின் நேரடிப் பொருளான அமைதியாக அல்லது சலனமின்றி இருத்தலைக் காட்டுகிறது; இங்கு பெண்பால் ஒருமை வடிவம் ‘என் உள்ளமே’ என்பதற்கு விடுக்கப்படும் அறிவுறுத்தலாகப் புரிந்துகொள்ளப்படுகிறது.
- source_word: נַפְשִׁי
  choice: என் உள்ளமே
  rationale: சங்கீதக்காரர் தமக்குத் தாமே பேசும் எபிரெய மொழிநடையை, சாதாரண நவீனத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் வெளிப்படுத்துகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய அறிவுறுத்தலுக்கான காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: מִמֶּנּוּ
  choice: அவரிடமிருந்தே
  rationale: தேவனைச் சுட்டும் ஆண்பால் ஒருமைப் பிரதிப்பெயரையும் ‘இருந்து’ என்ற மூலத்தையும் தெளிவாகக் காட்டுகிறது; ‘-ஏ’ இயல்பான தமிழ் வலியுறுத்தலாக அமைந்தாலும், தனிப்படுத்தும் கருத்தை தனியே விரிவுபடுத்தாது.
- source_word: תִּקְוָתִי
  choice: என் நம்பிக்கை
  rationale: எதிர்பார்ப்போடு கூடிய நம்பிக்கையை நவீனத் தமிழில் தெளிவாக எடுத்துரைக்கிறது.
theological_decisions:
- issue: דּוֹמִּי என்பதை நிகழ்நிலை கூற்றாகவா அல்லது தன்னுள்ளத்திற்கான அறிவுறுத்தலாகவா மொழிபெயர்ப்பது
  choice: 'அறிவுறுத்தல்: ‘அமைதியாயிரு, என் உள்ளமே’'
  alternative: 'கூற்று: ‘தேவனுக்காக மட்டுமே என் உள்ளம் அமைதியாகக் காத்திருக்கிறது’'
  rationale: உயிர்க்குறியிடப்பட்ட எபிரெய வடிவம் பெண்பால் ஒருமை கட்டளை வடிவமாக இயல்பாக வாசிக்கப்படுவதால் தன்னுள்ளத்திற்கான அறிவுறுத்தல் முதன்மை உரையில் வைக்கப்படுகிறது. எனினும், மெய்யெழுத்து உரையின் சாத்தியமான கூற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதத்திற்கேற்ற கண்ணியமான தன்னுரை நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘என் உள்ளமே’ என்பது பொதுவாசகருக்கு இயல்பானது; ‘என் ஆத்துமாவே’ என்ற மரபுவழி மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது. எபிரெய உரையிலுள்ள அறிவுறுத்தல்/கூற்று என்ற உண்மையான இருபொருள் சாத்தியம் மறைக்கப்படவில்லை.
