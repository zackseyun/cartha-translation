- source_word: וּכְבוֹדִי
  choice: என் மாட்சி
  rationale: כָּבוֹד என்பதன் மகிமை, மதிப்பு, கண்ணியம் ஆகிய பொருள் வாய்ப்புகளை ‘மாட்சி’ தக்கவைக்கிறது; ‘கண்ணியம்’ என்ற வாசிப்பும் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: צוּר
  choice: பாறை
  rationale: நிலைத்தன்மை மற்றும் பாதுகாப்பைக் குறிக்கும் மூல உருவகத்தை நவீன வாசகருக்கு நேரடியாகப் புரியும் வகையில் வெளிப்படுத்துகிறது.
- source_word: עֻזִּי
  choice: என் வலிமை
  rationale: עֹז என்பதன் அடிப்படைப் பொருளான வலிமையை நேரடியாக வழங்குகிறது; ‘கோட்டை’ போன்ற கூடுதல் உருவகத்தைச் சேர்க்கவில்லை.
- source_word: מַחְסִי
  choice: என் அடைக்கலம்
  rationale: பாதுகாப்புக்காகத் தஞ்சம் புகும் இடம் என்ற பொருளை இயல்பான தமிழில் தெளிவாகத் தருகிறது.
- source_word: בֵּאלֹהִים
  choice: கடவுளிடமே உள்ளன
  rationale: בְּ குறிக்கும் இருப்பிடம் அல்லது ஆதாரத்தை ‘கடவுளிடமே’ வெளிப்படுத்துகிறது; எபிரெயக் கவிதையில் விடப்பட்டுள்ள இணைப்பு வினை தமிழின் இயல்புக்காகச் சேர்க்கப்பட்டுள்ளது.
theological_decisions:
