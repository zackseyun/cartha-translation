  choice: சங்கீதக்காரனின் மீட்பும் மாட்சியும் கடவுளைச் சார்ந்திருக்கின்றன என்று மொழிபெயர்த்தல்
  alternative: ‘கடவுள்மேல் என் மீட்பும் என் மாட்சியும் உள்ளன’ என்று சொல்லுக்கு மிக நெருக்கமாக மொழிபெயர்த்தல்
  rationale: எபிரெயச் சொற்றொடர் வினைச்சொல் இல்லாத கவிதை நடை. ‘சார்ந்திருக்கின்றன’ என்பது கடவுளே அவற்றின் ஆதாரம் என்ற உருவகத்தைத் தமிழில் இயல்பாகக் காக்கிறது; அதேவேளை சாத்தியமான நேரடி வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: כָּבוֹדִי என்பதன் பொருள் வரம்பு
  choice: ‘என் மாட்சி’
  alternative: ‘என் கண்ணியம்’ அல்லது ‘என் மதிப்பு’
  rationale: இந்தச் சொல் மகிமையையும் சங்கீதக்காரனின் கண்ணியம் அல்லது நியாயநிறுவலையும் குறிக்கக்கூடும். முதன்மை உரை அந்தக் கவித்துவ அகலத்தை வைத்திருக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமுள்ள தமிழ் பயன்படுத்தப்பட்டுள்ளது. எபிரெயக் கவிதையின் இணை அமைப்பும் ‘பாறை’ என்ற பாதுகாப்பு உருவகமும் காக்கப்பட்டுள்ளன. ‘சார்ந்திருக்கின்றன’ இயல்பான தமிழ் நடைக்காகத் தேர்ந்தெடுக்கப்பட்டாலும், சொல்லுக்கு நெருக்கமான அமைப்பு அடிக்குறிப்பில் வழங்கப்பட்டுள்ளது.
