- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: இஸ்ரவேலின் கடவுளைக் குறிக்கும் אֱלֹהִים என்பதற்கான தெளிவான, பொதுவான நவீனத் தமிழ் சொல்.
