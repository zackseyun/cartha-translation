source:
  edition: WLC
  text: עַד אָ֤נָה תְּהֽוֹתְת֣וּ עַל אִישׁ֮ תְּרָצְּח֪וּ כֻ֫לְּ/כֶ֥ם כְּ/קִ֥יר נָט֑וּי גָּ֝דֵ֗ר הַ/דְּחוּיָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/062/003.yaml
  text: How long will you assail a man? Will you all break him down[a], like a leaning wall[c][b], a tottering fence?
translation:
  language: ta
  text: எவ்வளவு காலம் நீங்கள் ஒரு மனிதனைத் தாக்குவீர்கள்? நீங்கள் அனைவரும் அவனை இடித்துத் தள்ளுவீர்களா[a]—சாய்ந்த சுவரைப் போலவும், தள்ளாடும் வேலியைப் போலவும்?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீங்கள் அனைவரும் அவனைக் கொலை செய்வீர்களா?” רצח என்ற வினை பொதுவாகக் கொலை செய்வதைக் குறிக்கிறது; இங்குள்ள சுவர், வேலி உருவகங்களால் “இடித்துத் தள்ளுதல்” என்ற உருவகப் பொருளும் சாத்தியம்.
    reason: lexical_alternative
  - marker: b
    text: இந்த ஒப்புமைகள் தாக்கப்படும் மனிதன் நிலையிழந்து விழும் நிலையில் இருப்பதைக் குறிக்கலாம். வேறு விதமாக, தாக்குகிறவர்கள் புடைத்துச் சாயும் சுவரைப் போல அவன்மேல் கூட்டமாக மோதுவதாகவும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: תְּהֽוֹתְת֣וּ
  choice: தாக்குவீர்கள்
  rationale: அரிதான இந்த எபிரெய வினை வன்முறையுடன் ஒருவர்மேல் பாய்ந்து தாக்கும் கருத்தைத் தருகிறது. நவீனத் தமிழில் இயல்பாகவும் மிகையாக விளக்காமலும் இதை வெளிப்படுத்துகிறது.
- source_word: עַל אִישׁ
  choice: ஒரு மனிதனை
  rationale: אִישׁ என்பது இங்கு ஒருமை ஆண்பால் வடிவில் ஒரு குறிப்பிட்ட தனிநபரைச் சுட்டுகிறது; தமிழில் செயப்படுபொருள் அமைப்பு இயல்பாக இருக்க உருபுடன் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: תְּרָצְּחוּ
  choice: அவனை இடித்துத் தள்ளுவீர்களா
  rationale: רצח பொதுவாகக் கொலை செய்வதைக் குறித்தாலும், பின்வரும் சுவர் மற்றும் வேலி உருவகங்கள் இங்கு ஒருவனை முற்றிலும் வீழ்த்தும் உருவகப் பொருளை ஆதரிக்கின்றன. அடிப்படை வன்முறைப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: כֻלְּכֶם
  choice: நீங்கள் அனைவரும்
  rationale: இரண்டாம் நபர் பன்மையை வலியுறுத்தும் எபிரெயச் சொல்லின் கூட்டுத் தாக்கத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: כְּקִיר נָטוּי
  choice: சாய்ந்த சுவரைப் போல
  rationale: நிலையிழந்து விழும் நிலையில் உள்ள சுவரின் நேரடியான கவித்துவப் படிமத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: גָּדֵר הַדְּחוּיָה
  choice: தள்ளப்பட்ட வேலியைப் போல
  rationale: דחה என்பதன் தள்ளப்பட்ட அல்லது விலக்கப்பட்ட நிலை என்ற பொருளை, வெறும் ‘தள்ளாடும்’ என்று விளைவைக் கூறுவதற்குப் பதிலாக, மூலத்திற்கு நெருக்கமாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: சுவர் மற்றும் வேலி உருவகங்கள் யாரைக் குறிக்கின்றன?
  choice: தாக்கப்படும் மனிதனை முதன்மையாகக் குறிப்பதாக முதன்மை உரை அமைக்கப்பட்டுள்ளது.
  alternative: தாக்குகிறவர்கள் புடைத்துச் சாயும் சுவர் போல அவன்மேல் கூட்டமாக மோதுவதாகவும் தொடரை புரிந்துகொள்ளலாம்.
  rationale: சூழலில் தாக்கப்படும் தனிநபரின் பலவீனமான, வீழ்ச்சிக்கருகிலுள்ள நிலை இயல்பான வாசிப்பாக இருந்தாலும், எபிரெயத் தொடரின் இலக்கண அமைப்பு ஒப்புமையின் குறிக்கோளை முற்றிலும் தீர்மானிப்பதில்லை; ஆகவே மாற்று வாசிப்பு அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதத்திற்கேற்ற கண்ணியமான ஆனால் சாதாரண வாசகருக்கும் தெளிவான நடை பயன்படுத்தப்பட்டுள்ளது. இரண்டு வினாக்களைக் கொண்ட எபிரெய அமைப்பும், வன்முறை மற்றும் கட்டிடம் இடிதல் ஆகிய இரட்டைப் படிமங்களும் காக்கப்பட்டுள்ளன.
