  text: He alone is my rock and my salvation[a], my stronghold; I will not be shaken.
translation:
  language: ta
  text: அவர் ஒருவரே என் கன்மலையும் என் மீட்பும், என் பாதுகாப்பான கோட்டையும்; நான் அசைக்கப்பட மாட்டேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் நிலைகுலைய மாட்டேன்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ הוּא
  choice: அவர் ஒருவரே
  rationale: אַךְ இங்குச் சூழலில் தனித்தன்மையையும் வலியுறுத்தலையும் குறிக்கிறது; הוּא கடவுளைக் குறிக்கிறது. இயல்பான நவீன தமிழில் இவ்விரண்டின் கூட்டு வலிமையை இது வெளிப்படுத்துகிறது.
- source_word: צוּרִי
  choice: என் கன்மலை
  rationale: צוּר நிலைத்தன்மையும் பாதுகாப்பும் தரும் பாறை என்ற உருவகமாகக் கடவுளைக் குறிக்கிறது. ‘கன்மலை’ அந்தக் கவித்துவ உருவகத்தைத் தமிழில் காக்கிறது.
- source_word: וִישׁוּעָתִי
  choice: என் மீட்பு
  rationale: יְשׁוּעָה விடுவிப்பு, காப்பு, மீட்பு ஆகிய பரந்த பொருளைக் கொண்டது. ‘மீட்பு’ உடனடி ஆபத்திலிருந்து தப்புவித்தலை மட்டும் அல்லாமல் அதன் விரிந்த இறையியல் பொருளையும் தக்கவைக்கிறது.
- source_word: מִשְׂגַּבִּי
  choice: என் பாதுகாப்பான கோட்டை
  rationale: מִשְׂגָּב உயர்ந்த, எளிதில் அணுக முடியாத பாதுகாப்பிடத்தைக் குறிக்கிறது. ‘பாதுகாப்பான கோட்டை’ அதன் தற்காப்பு மற்றும் உறுதிப்பாடு ஆகிய இரு கூறுகளையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: לֹא אֶמּוֹט
  choice: நான் அசைக்கப்பட மாட்டேன்
  rationale: מוֹט என்பதன் நிஃபால் வடிவம் அசைக்கப்படுதல், நிலைகுலைதல் என்ற பொருளைக் கொண்டது. இந்த மொழிபெயர்ப்பு நிலைத்தன்மையின் உருவகத்தையும் உறுதியான நம்பிக்கையையும் இயல்பான தமிழில் காக்கிறது.
theological_decisions:
- issue: இறுதிக் கூற்றில் வெளிப்படும் நம்பிக்கையின் அளவு
  choice: நான் அசைக்கப்பட மாட்டேன்
  alternative: நான் நிலைகுலைய மாட்டேன்
  rationale: எபிரெய வாசகம் கடவுளையே பாதுகாப்பின் ஆதாரமாகக் கொண்ட உறுதியான நம்பிக்கையை வெளிப்படுத்துகிறது. தேர்ந்த மொழிபெயர்ப்பு முழுமையான பாதிப்பின்மையைச் சேர்க்காமல், அசைக்க முடியாத நிலைத்தன்மை என்ற உருவகத்தைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; கவித்துவ கண்ணியத்துடன் பொதுவாசகர்களுக்குப் புரியும் நடை. ‘கன்மலை’, ‘மீட்பு’, ‘பாதுகாப்பான கோட்டை’ ஆகியவை மூலத்தின் தொடர் பாதுகாப்பு உருவகங்களைத் தக்கவைக்கின்றன.
