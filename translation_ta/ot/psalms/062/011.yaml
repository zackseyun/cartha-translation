  text: 'One thing God has spoken[a]; two things I have heard: that strength belongs to God.'
translation:
  language: ta
  text: 'தேவன் ஒன்றைச் சொல்லியிருக்கிறார்[a]; நான் இரண்டு காரியங்களைக் கேட்டிருக்கிறேன்: வல்லமை தேவனுக்கு உரியது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தேவன் ஒருமுறை சொல்லியிருக்கிறார்; நான் இதை இருமுறை கேட்டிருக்கிறேன்.” எபிரெயச் சொற்றொடரை ‘ஒருமுறை/இருமுறை’ என்ற வினையடைப் பொருளிலோ, ‘ஒன்று/இரண்டு’ என்ற எண்ணிக்கைச் சொல்முறை வடிவிலோ புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: אַחַת
  choice: ஒன்றை
  rationale: பெண்பால் ஒருமை எண்ணாகிய இது அடிப்படையில் ‘ஒன்று’ என்று பொருள்படும். அடுத்து வரும் ‘இரண்டு’ என்பதுடன் இணைந்து, எண்ணிக்கை சார்ந்த ஞானமொழி அமைப்பை வெளிப்படுத்துகிறது.
- source_word: דִּבֶּר
  choice: சொல்லியிருக்கிறார்
  rationale: நிறைவுற்ற செயலைத் தொடர்ந்து பொருந்தும் உரையாகக் காட்டும் எபிரெய நிறைவு வடிவத்தை இயல்பான நவீனத் தமிழில் நிகழ்கால நிறைவாக வழங்குகிறது.
- source_word: אֱלֹהִים
  choice: தேவன்
  rationale: வடிவத்தில் பன்மையாக இருந்தாலும் இங்கு ஒருமை வினையுடன் இஸ்ரவேலின் தேவனைக் குறிக்கிறது.
- source_word: שְׁתַּיִם
  choice: இரண்டு காரியங்களை
  rationale: ‘ஒன்று… இரண்டு…’ என்ற எண்ணிக்கைச் சொற்றொடரின் இரண்டாம் உறுப்பாக எடுத்துக்கொள்ளப்பட்டுள்ளது; தமிழில் பொருள் தெளிவதற்காக ‘காரியங்கள்’ சேர்க்கப்பட்டது.
- source_word: זוּ
  choice: காரியங்கள்
  rationale: தொடர்ந்து வரும் கருத்தைச் சுட்டும் வடிவம்; தனியாகச் சொற்சொல்லாக மொழிபெயர்க்காமல் ‘இரண்டு காரியங்கள்’ என்ற இயல்பான தமிழ் அமைப்பில் உட்படுத்தப்பட்டுள்ளது.
- source_word: שָׁמָעְתִּי
  choice: கேட்டிருக்கிறேன்
  rationale: தான் கேட்டு உணர்ந்தது இப்போதும் பொருந்துகிறது என்பதை வெளிப்படுத்த, தமிழின் நிகழ்கால நிறைவு வடிவம் பயன்படுத்தப்பட்டது.
- source_word: כִּי
  choice: என்பதை உணர்த்தும் முக்காற்புள்ளி
  rationale: இங்கு அடுத்து வருவது கேட்டவற்றின் உள்ளடக்கம். தமிழில் ‘என்று/என்பதை’ சேர்ப்பதைவிட முக்காற்புள்ளி இயல்பாக அந்த உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது.
- source_word: עֹז
  choice: வல்லமை
  rationale: பலத்தையும் ஆற்றலையும் குறிக்கும் பெயர்ச்சொல். ‘வல்லமை’ என்பது தேவனுடைய ஆற்றலைக் குறிக்கும் தெளிவான, கண்ணியமான நவீனத் தமிழ் சொல்.
- source_word: לֵאלֹהִים
  choice: தேவனுக்கே உரியது
  rationale: לְ இங்கு உடைமை அல்லது உரிமையைச் சுட்டுகிறது. ‘-க்கே’ என்பது தேவனுக்குரிய தனித்துவத்தை இயல்பாக வலியுறுத்துகிறது; ‘உரியது’ உடைமைப் பொருளைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: ‘ஒன்று… இரண்டு’ என்ற எண்ணிக்கைச் சொற்றொடர்
  choice: ‘தேவன் ஒன்றைச் சொல்லியிருக்கிறார்; நான் இரண்டு காரியங்களைக் கேட்டிருக்கிறேன்’ என்ற ஞானமொழி அமைப்பு
  alternative: ‘தேவன் ஒருமுறை சொல்லியிருக்கிறார்; நான் இதை இருமுறை கேட்டிருக்கிறேன்’
  rationale: எபிரெய மொழியில் எண்களை காரியங்களின் எண்ணிக்கையாகவோ நிகழ்வுகளின் தடவைகளாகவோ வாசிக்க இயலும். முதன்மை உரை எண்ணிக்கை சார்ந்த ஞானமொழி அமைப்பை ஏற்கிறது; உண்மையான மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், சங்கீதத்தின் கண்ணியமான கவித்துவத் தொனியைப் பேணும் வகையில் மொழிபெயர்க்கப்பட்டது. ‘ஒன்று… இரண்டு’ என்ற மூலமொழி அமைப்பும் அதன் மாற்று வாசிப்பும் பாதுகாக்கப்பட்டுள்ளன.
