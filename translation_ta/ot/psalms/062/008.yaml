  yaml_path: translation/ot/psalms/062/008.yaml
  text: Trust in him at all times[a], O people; pour out your hearts before him. God is a refuge for us[d][c][b]. Selah
translation:
  language: ta
  text: மக்களே, எல்லா நேரங்களிலும் அவரை நம்புங்கள்[a]; உங்கள் இதயங்களை அவருக்கு முன்பாக ஊற்றிவிடுங்கள்[b]. கடவுள் நமக்கு அடைக்கலம். சேலா[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்கு சொல், ‘ஒவ்வொரு நேரத்திலும்’; ‘எப்போதும்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘இதயங்களை ஊற்றிவிடுங்கள்’ என்பது உள்ளார்ந்த எண்ணங்களையும் விருப்பங்களையும் கடவுளிடம் ஒளிக்காமல் வெளிப்படுத்துவதைக் குறிக்கும் எபிரெய உருவகம்.
    reason: lexical_alternative
  - marker: c
    text: ‘சேலா’ என்பது வழிபாடு அல்லது இசை தொடர்பான சொல்லாக இருக்கலாம்; அதன் துல்லியமான பொருள் உறுதியாகத் தெரியவில்லை.
    reason: cultural_note
lexical_decisions:
- source_word: בִּטְחוּ בּוֹ
  choice: அவரை நம்புங்கள்
  rationale: בטח என்பதன் பன்மை ஏவல் வடிவம் கடவுள்மீது நம்பிக்கை வைக்குமாறு அழைக்கிறது; தமிழில் ‘அவரை நம்புங்கள்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: בְכָל־עֵת
  choice: எல்லா நேரங்களிலும்
  rationale: சொல்லுக்கு சொல் ‘ஒவ்வொரு நேரத்திலும்’; இடைவிடாத, எல்லாச் சூழல்களிலும் தொடரும் நம்பிக்கையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: עָם
  choice: மக்களே
  rationale: இது சமூகத்தை நேரடியாக அழைக்கும் விளிவேற்றுமைச் சொல்; ‘மக்களே’ அந்த அழைப்பின் தன்மையைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: שִׁפְכוּ לְפָנָיו לְבַבְכֶם
  choice: உங்கள் இதயங்களை அவருக்கு முன்பாக ஊற்றிவிடுங்கள்
  rationale: ‘ஊற்று’ என்ற மூல உருவகத்தையும், לְבַבְכֶם என்பதிலுள்ள இரண்டாம் நபர் பன்மையையும் பாதுகாக்கிறது; உள்ளத்தின் எண்ணங்களையும் விருப்பங்களையும் ஒளிக்காமல் வெளிப்படுத்தும் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: אֱלֹהִים מַחֲסֶה לָנוּ
  choice: கடவுள் நமக்கு அடைக்கலம்
  rationale: மூலத்தின் சுருக்கமான பெயர்ச்சொல் வாக்கியத்தையும், பாதுகாப்பிடம் என்ற מַחֲסֶה சொல்லின் பொருளையும் நேரடியாகத் தருகிறது.
- source_word: סֶלָה
  choice: சேலா
  rationale: இச்சொல்லின் துல்லியமான பொருள் உறுதியற்றதால் விளக்கமாக மொழிபெயர்க்காமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: עָם என்பதன் சமூக நோக்கிய நேரடி அழைப்பு
  choice: ‘மக்களே’ என்று வழிபாட்டு சமூகத்திடம் நேரடியாக உரையாடுதல்
  alternative: விளிவேற்றுமைத் தன்மையின்றி ‘மக்கள்’ அல்லது அரசியல் பொருளுடைய ‘தேசம்’
  rationale: ஏவல் வினைகளின் தொடரில் עָם இயல்பாக நேரடி அழைப்பாகச் செயல்படுகிறது; இதனால் குறுகிய இன அல்லது அரசியல் அடையாளம் சேர்க்கப்படாமல் சமூகப் பரிமாணம் பாதுகாக்கப்படுகிறது.
- issue: סֶלָה என்பதன் பொருள்
  choice: ‘சேலா’ என்று மொழிபெயர்க்காமல் ஒலிபெயர்த்தல்
  alternative: ‘இசை இடைவேளை’ அல்லது ‘நிறுத்தம்’ என்று பொருள் நிர்ணயித்தல்
  rationale: சொல்லின் துல்லியமான வழிபாட்டு அல்லது இசைச் செயல்பாடு உறுதியற்றது; ஒலிபெயர்ப்பு அந்த உண்மையான தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘மக்களே’ நேரடி சமூக அழைப்பை வெளிப்படுத்துகிறது; ‘உங்கள் இதயங்களை’ என்பது மூலத்திலுள்ள பன்மையைத் தெளிவாகக் காக்கிறது. ‘சேலா’ பொருள் ஊகிக்கப்படாமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
