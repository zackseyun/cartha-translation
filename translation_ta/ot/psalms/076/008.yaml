source:
  edition: WLC
  text: מִ֭/שָּׁמַיִם הִשְׁמַ֣עְתָּ דִּ֑ין אֶ֖רֶץ יָֽרְאָ֣ה וְ/שָׁקָֽטָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/076/008.yaml
  text: From heaven you made judgment heard[c][b][a]; the earth feared and was quiet.
translation:
  language: ta
  text: வானத்திலிருந்து தீர்ப்பைக் கேட்கச் செய்தீர்[a]; பூமி[b] அஞ்சி அமைதியாயிற்று[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வானங்களிலிருந்து தீர்ப்பைக் கேட்கும்படி செய்தீர்.”
    reason: lexical_alternative
  - marker: b
    text: “பூமி” என்பதை “நாடு” என்றும் மொழிபெயர்க்கலாம்; ஆனால் வானம்–பூமி எதிரிணை இங்கு பரந்த பொருளை ஆதரிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “அசைவற்று இருந்தது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשָּׁמַיִם
  choice: வானத்திலிருந்து
  rationale: מִן மூலத்தைக் குறிக்கிறது; שָׁמַיִם இங்கு தமிழில் இயல்பாக ஒருமைக் கூட்டுப்பொருளில் ‘வானம்’ என்று வழங்கப்படுகிறது.
- source_word: הִשְׁמַעְתָּ
  choice: கேட்கச் செய்தீர்
  rationale: שׁמע என்பதன் ஹிஃபில் வடிவிலுள்ள காரணவினைப் பொருளைத் தக்கவைத்து, வெறுமனே ‘அறிவித்தீர்’ என்று விளக்கமாக்குவதைத் தவிர்க்கிறது.
- source_word: דִּין
  choice: தீர்ப்பு
  rationale: இச்சூழலில் கடவுளின் நீதித்துறை சார்ந்த முடிவு அல்லது நியாயத்தீர்ப்புச் செயலைக் குறிக்கிறது; ‘தீர்ப்பு’ சுருக்கமான கவிதை நடையையும் நிகழ்வு சார்ந்த பொருளையும் காக்கிறது.
- source_word: אֶרֶץ
  choice: பூமி
  rationale: ‘வானத்திலிருந்து’ என்பதுடனான உலகளாவிய எதிரிணை காரணமாக, உள்ளூர் ‘நாடு’ என்பதைவிட ‘பூமி’ இங்கு பொருத்தமானது.
- source_word: יָרְאָה
  choice: அஞ்சி
  rationale: ירא என்பதிலுள்ள பயம் அல்லது ஆழ்ந்த அச்சம் என்ற வலிமையை, அளவுக்கு மீறிய விளக்கமின்றி இயல்பான தமிழில் தருகிறது.
- source_word: וְשָׁקָטָה
  choice: அமைதியாயிற்று
  rationale: שׁקט குறிக்கும் அமைதி, அடக்கம் அல்லது இயக்கமின்மை ஆகியவற்றில், தீர்ப்பைக் கேட்ட பின் ஏற்பட்ட அமைதியை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: வானம்–אֶרֶץ என்ற கவிதை எதிரிணையில் אֶרֶץ என்பதன் பரப்பு
  choice: உலகமெங்கும் குறிக்கும் ‘பூமி’
  alternative: ‘நாடு’—இஸ்ரவேல் நாடு அல்லது வரையறுக்கப்பட்ட நிலப்பரப்பு
  rationale: வானத்திற்கும் பூமிக்கும் இடையிலான கவிதை எதிரிணை உலகளாவிய காட்சியமைப்பை வலியுறுத்துகிறது; உரை கோராத தேசிய வரம்பைச் சேர்க்காமல் இது அந்தத் திறந்த பரப்பைக் காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், சங்கீதத்துக்குரிய சுருக்கமும் கண்ணியமும் காக்கப்பட்டுள்ளன. கடவுளை நோக்கிய மரியாதைப் பன்மை வினைமுற்றான ‘செய்தீர்’ பயன்படுத்தப்பட்டுள்ளது; எபிரெயக் கவிதையின் வானம்–பூமி அமைப்பும் இரு குறுவாக்கியங்களின் தீவிரமும் தக்கவைக்கப்பட்டுள்ளன.
