  text: For the wrath of man will praise you[b][a]; with the remnant of wrath you will gird yourself.
translation:
  language: ta
  text: 'ஏனெனில், மனிதரின்[a] சினம் உம்மைப் புகழும்;

    எஞ்சிய சினத்தை நீர் இடுப்பில் கட்டிக்கொள்வீர்.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மனிதர்’ என்பது இங்கு ஓர் ஆணை மட்டும் அல்ல, மனிதகுலத்தைப் பொதுவாகக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: 'வேறு மொழிபெயர்ப்பு: ‘எஞ்சிய சினத்தை நீர் அடக்குவீர்.’ இறுதி அடியின் எபிரேய வாசகம் கடினமானது; பிரதான உரை மசோரெட்டிய உரையை நெருக்கமாகப் பின்பற்றி அதன் உருவகத்தைப் பாதுகாக்கிறது.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய அழைப்புக்கான காரணத்தையோ விளக்கத்தையோ அறிமுகப்படுத்தும் இணைப்புச் சொல்லாக இருப்பதால், அதன் காரணப் பொருளைப் பாதுகாக்கிறது.
- source_word: חֲמַת אָדָם
  choice: மனிதரின் சினம்
  rationale: חֵמָה என்பது கடும் கோபம் அல்லது சீற்றத்தைக் குறிக்கிறது; אָדָם இங்கு தனிப்பட்ட ஓர் ஆணை அல்ல, மனிதகுலத்தைப் பொதுவாகக் குறிக்கிறது. உயர்ந்த கவிதை நடைக்கு இயல்பாக இருப்பதால் ‘சினம்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: תּוֹדֶךָּ
  choice: உம்மைப் புகழும்
  rationale: ידה என்பதன் ஹிபீல் வடிவம் ‘நன்றி செலுத்துதல்’ அல்லது ‘புகழ்தல்’ என்று பொருள்படும். மனிதரின் சினம்கூட இறுதியில் கடவுளின் புகழுக்கு வழிவகுக்கும் என்ற கவிதைப் பொருளுக்கு ‘புகழும்’ பொருத்தமானது.
- source_word: שְׁאֵרִית
  choice: எஞ்சிய
  rationale: மீதமிருப்பதை அல்லது எஞ்சியிருப்பதைச் சுட்டுகிறது; தமிழில் பெயரெச்ச வடிவம் இயல்பாகவும் சுருக்கமாகவும் உள்ளது.
- source_word: חֵמֹת
  choice: சினத்தை
  rationale: எபிரெயத்தில் பன்மை வடிவமாக இருந்தாலும், இங்கு கூட்டு அல்லது தீவிரப் பொருள் கொண்டதாகக் கருதி தமிழில் இயல்பான ஒருமைத் தொகைப் பெயராக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: תַּחְגֹּר
  choice: நீர் அரையில் கட்டிக்கொள்வீர்
  rationale: חגר என்பதன் அடிப்படைப் பொருள் ஒன்றை இடுப்பைச் சுற்றிக் கட்டிக்கொள்வது. கட்டுப்படுத்துதல், அணிதல், அல்லது ஆயுதமாகப் பூணுதல் என உருவகத்தைத் தீர்மானித்து விடாமல், மூலத்தின் உருவகத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: שְׁאֵרִית חֵמֹת תַּחְגֹּר என்ற இறுதி அடியின் பொருள்
  choice: கடவுளே வினையின் எழுவாய்; எஞ்சிய சினத்தை அவர் உருவகமாக அரையில் கட்டிக்கொள்கிறார்.
  alternative: ‘எஞ்சிய சினத்தை நீர் அடக்குவீர்’ அல்லது ‘எஞ்சிய சினம் உம்மை விழாக்கோலமாகச் சூழும்.’
  rationale: மசோரா உயிர்க்குறிகளின்படியான இரண்டாம் நபர் ஆண்பால் ஒருமை வினை வடிவம், கடவுளை எழுவாயாகக் கொண்டு ‘நீர் கட்டிக்கொள்வீர்’ என்று இயல்பாக வாசிக்கப்படுகிறது. அடி கடினமானது என்பதால், அதன் உருவகத்தை விளக்கவுரையாகத் தீர்த்து விடாமல் பிரதான உரையில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. கடவுளுக்கான மரியாதைப் பன்மை (‘உம்மை’, ‘நீர்’) கையாளப்பட்டுள்ளது. மூலத்தின் இணைவரி அமைப்பும் இறுதி அடியின் திட்டமிட்ட தெளிவின்மையும் பாதுகாக்கப்பட்டுள்ளன.
