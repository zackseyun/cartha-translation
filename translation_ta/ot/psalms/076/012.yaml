source:
  edition: WLC
  text: יִ֭בְצֹר ר֣וּחַ נְגִידִ֑ים נ֝וֹרָ֗א לְ/מַלְכֵי אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/076/012.yaml
  text: He cuts off the spirit of princes[b][a]; he is feared by the kings of the earth.
translation:
  language: ta
  text: 'அவர் அதிபதிகளின் ஆவியை முறித்துப்போடுகிறார்[a];

    பூமியின் அரசர்கள் அவருக்கு அஞ்சுகிறார்கள்[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர் ஆட்சியாளர்களின் ஆவியை அடக்குகிறார்.” “ஆவி” என்பது “மூச்சு,” “துணிவு,” அல்லது “மனப்பாங்கு” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “பூமியின் அரசர்களுக்கு அவர் அச்சத்திற்குரியவர்.”
    reason: alternative_reading
lexical_decisions:
- source_word: יִבְצֹר
  choice: முறித்துப்போடுகிறார்
  rationale: Qal வினைச்சொல் இங்கு ஆட்சியாளர்களின் ஆற்றலையும் செருக்கையும் கடவுள் தீர்மானமாக அடக்குவதைச் சுட்டுகிறது. ‘முறித்துப்போடுகிறார்’ என்பது வெறுமனே கட்டுப்படுத்துதல் என்பதைக் காட்டிலும் வலிமையான செயலை வெளிப்படுத்துகிறது; அதேவேளை உயிரைப் பறிப்பதாக மட்டும் பொருளைக் குறுக்கவில்லை.
- source_word: רוּחַ
  choice: ஆவி
  rationale: இந்த எபிரெயச் சொல் ஆவி, மூச்சு, துணிவு, மனப்பாங்கு ஆகிய பொருள்களை ஏற்கக்கூடும். ‘ஆவி’ அதன் பொருள் அகலத்தையும் கவிதைநடையையும் காக்கிறது.
- source_word: נְגִידִים
  choice: அதிபதிகள்
  rationale: தலைவர்கள் அல்லது ஆட்சியாளர்கள் என்னும் பொருளுடைய சொல். ‘அதிபதிகள்’ என்பது அடுத்த அடியிலுள்ள ‘அரசர்கள்’ என்பதோடு பொருந்தும் உயர்ந்த கவிதைநடையைத் தருகிறது.
- source_word: נוֹרָא
  choice: அஞ்சுகிறார்கள்
  rationale: கடவுள் அச்சத்திற்குரியவர் என்ற உறவுப்பொருளை, தமிழில் இயல்பாக ‘அரசர்கள் அவருக்கு அஞ்சுகிறார்கள்’ என்று வினை வடிவில் வெளிப்படுத்துகிறது.
- source_word: לְמַלְכֵי אָרֶץ
  choice: பூமியின் அரசர்கள் அவருக்கு
  rationale: לְ முன்னிடைச்சொல் இங்கு அரசர்களுக்கும் அச்சத்திற்குரிய கடவுளுக்கும் உள்ள உறவைக் குறிக்கிறது. தமிழ் வாக்கிய அமைப்பில் இதை இயல்பாகச் செயப்படுபொருள் சார்ந்த வினைத் தொடராக வழங்குகிறது.
theological_decisions:
- issue: ஆட்சியாளர்கள்மீது கடவுள் செய்யும் செயலின் தன்மை
  choice: பூமிக்குரிய அதிபதிகளின் உள்ளார்ந்த ஆற்றல், துணிவு அல்லது செருக்கை அவர் தீர்மானமாக முறியடிக்கிறார்.
  alternative: அவர் அவர்களுடைய மூச்சை அல்லது உயிரைப் பறிக்கிறார்; அல்லது அவர்களுடைய கோபத்தையோ துணிவையோ கட்டுப்படுத்துகிறார்.
  rationale: רוּחַ மற்றும் יִבְצֹר ஆகிய இரு சொற்களும் பல நுண்பொருள்களை அனுமதிக்கின்றன. சங்கீதத்தின் சூழல் அரசர்கள்மீது கடவுளுக்குள்ள மேலாதிக்கத்தை வலியுறுத்துவதால், முதன்மை உரை அவர்களைத் தாழ்த்தும் வலிமையான செயலைக் காட்டுகிறது; மரணம் அல்லது குறிப்பிட்ட உணர்ச்சி என்று அளவுக்கு மீறி வரையறுக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதில் புரியக்கூடிய, அதேவேளை சங்கீதக் கவிதைக்கு ஏற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. முதல் அடியில் எபிரெயச் சொல்லின் பல்பொருள் தன்மை முதன்மை உரையிலும் அடிக்குறிப்பிலும் பாதுகாக்கப்பட்டுள்ளது; இரண்டாம் அடி தமிழில் இயல்பாக அமைய வினை வாக்கியமாக்கப்பட்டுள்ளது.
