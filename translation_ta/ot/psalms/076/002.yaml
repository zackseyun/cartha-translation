  text: וַ/יְהִ֣י בְ/שָׁלֵ֣ם סֻכּ֑/וֹ וּ/מְע֖וֹנָת֣/וֹ בְ/צִיּֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/076/002.yaml
  text: His shelter was in Salem[b][a], and his dwelling place in Zion.
translation:
  language: ta
  text: 'சாலேமில் அவருடைய கூடாரம்[b] இருந்தது;

    சீயோனில் அவருடைய உறைவிடம் இருந்தது.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சாலேம் பாரம்பரியமாக எருசலேமுடன் அடையாளப்படுத்தப்படுகிறது; இந்த வசனம் சாலேமையும் சீயோனையும் கடவுளின் உறைவிடத்தைக் குறிக்கும் இணையான பெயர்களாக அமைக்கிறது.
    reason: cross_reference
  - marker: b
    text: ‘கூடாரம்’ என்பதற்கு ‘குடில்,’ ‘மறைவிடம்’ அல்லது ‘பந்தல்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: இருந்தது
  rationale: இங்கு היה என்பதன் வடிவம் கடவுளின் உறைவிடங்கள் எங்கே இருந்தன என்பதை எளிய இணைப்புவினையாகக் கூறுகிறது; தமிழில் ‘இருந்தது’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: בְשָׁלֵם
  choice: சாலேமில்
  rationale: எபிரெய உரை ‘எருசலேம்’ என்று விரித்துரைக்காமல் சாலேம் என்னும் இடப்பெயரையே பயன்படுத்துவதால், அந்தப் பெயர் நேரடியாகப் பாதுகாக்கப்படுகிறது.
- source_word: סֻכּוֹ
  choice: அவருடைய கூடாரம்
  rationale: סֻכָּה என்பது தற்காலிகக் குடில், மறைவிடம் அல்லது கூடாரத்தைக் குறிக்கலாம். ‘கூடாரம்’ கவித்துவமான சூழலிலும் இயல்பாக உள்ளது; சொல்லின் பிற சாத்தியங்களை அடிக்குறிப்பு பாதுகாக்கிறது.
- source_word: וּמְעוֹנָתוֹ
  choice: அவருடைய உறைவிடம்
  rationale: מְעוֹנָה என்பது வசிப்பிடம் அல்லது உறைவிடத்தைக் குறிக்கிறது. ‘உறைவிடம்’ நவீனத் தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது.
- source_word: בְצִיּוֹן
  choice: சீயோனில்
  rationale: צִיּוֹן என்ற இடப்பெயர் தமிழில் வழக்கமான ‘சீயோன்’ வடிவில் ஒலிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: ‘சாலேம்’ மற்றும் ‘சீயோன்’ ஆகியவற்றின் உறவு
  choice: இரண்டு இடப்பெயர்களையும் முதன்மை உரையில் தனித்தனியாகப் பாதுகாத்தல்
  alternative: ‘சாலேம்’ என்பதை ‘எருசலேம்’ என்று வெளிப்படையாக மொழிபெயர்த்தல்
  rationale: எபிரெயக் கவிதை சாலேமையும் சீயோனையும் இணையான பெயர்களாக அமைக்கிறது. அவற்றை ஒன்றாகச் சுருக்காமல் இருப்பது மூலத்தின் கவித்துவ மற்றும் இறையியல் நெருக்கத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிமையான, கண்ணியமான கவிதைநடை. எபிரெய இணைநிலையை இரண்டு அரையடிகளால் வெளிப்படுத்தி, இயல்பான தமிழுக்காக ‘இருந்தது’ இருமுறை கூறப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
