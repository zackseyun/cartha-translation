source:
  edition: WLC
  text: נָ֭אוֹר אַתָּ֥ה אַדִּ֗יר מֵֽ/הַרְרֵי טָֽרֶף־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/076/004.yaml
  text: You are radiant[a], more majestic than the mountains of prey.
translation:
  language: ta
  text: நீர் ஒளிமிக்கவர்; இரையின் மலைகளைவிட மாட்சிமை மிக்கவர்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கொள்ளைப்பொருளின் மலைகளைவிட மாட்சிமை மிக்கவர்.” எபிரெயச் சொல் “இரை” என்றும், அதன் நீட்சியாக “கொள்ளைப்பொருள்” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָאוֹר
  choice: ஒளிவீசுகிறீர்
  rationale: ஒளிரும் பிரகாசத்தையும் பொலிவையும் குறிக்கும் சொல்லை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; வெளிச்சத்தைப் பெறுபவர் என்ற தவறான குறிப்பைத் தவிர்க்கிறது.
- source_word: אַתָּה
  choice: நீர்
  rationale: எபிரெய உரையில் வலியுறுத்தப்பட்ட இரண்டாம் நபர் ஒருமையை, இறைவனை நோக்கிய மரியாதையான தமிழ்நடையில் தருகிறது.
- source_word: אַדִּיר
  choice: மாட்சிமை மிக்கவர்
  rationale: இச்சொல்லிலுள்ள மேன்மை, மகத்துவம், வல்லமை ஆகிய பரப்பில், கவிதைச் சூழலுக்கு ‘மாட்சிமை’ மிகவும் பொருந்துகிறது. பின்வரும் מִן ஒப்பீட்டுப் பொருளைக் கொடுப்பதால் ‘மலைகளைவிட’ என்பதோடு இணைக்கப்பட்டுள்ளது.
- source_word: מֵהַרְרֵי
  choice: மலைகளைவிட
  rationale: מִן என்பதை இங்கு ஒப்பீட்டைக் குறிக்கும் ‘-விட’ என்று எடுத்துக்கொள்கிறது; ‘மலைகள்’ என்பதையும் טָרֶף உடனான இணைப்பையும் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: טָרֶף
  choice: இரைகொள்ளும்
  rationale: முதன்மையான ‘இரை’ என்ற உருவகத்தைப் பாதுகாக்கிறது. ‘இரையின் மலைகள்’ என்பதைவிட ‘இரைகொள்ளும் மலைகள்’ நவீனத் தமிழில் புரியத்தக்க கவித்துவப் படிமமாக உள்ளது; ‘கொள்ளைப்பொருள்’ என்ற நீட்சிப் பொருள் அடிக்குறிப்பில் வைக்கப்படுகிறது.
theological_decisions:
- issue: מֵהַרְרֵי טָרֶף என்ற சொற்றொடரின் பொருள்
  choice: கடவுள் ‘இரைகொள்ளும் மலைகளைவிட’ மாட்சிமை மிக்கவர் என்ற ஒப்பீடு
  alternative: ‘இரைகொள்ளும் மலைகளிலிருந்து நீர் ஒளிவீசுகிறீர்’ என்ற இடம்/பிரிவு சார்ந்த வாசிப்பு; அல்லது ‘கொள்ளைப்பொருளின் மலைகளைவிட’ என்ற வாசிப்பு
  rationale: אַדִּיר என்பதோடு வரும் מִן ஒப்பீட்டுப் பொருளை வலுவாக ஆதரிக்கிறது. எனினும் טָרֶף என்பதன் ‘இரை/கொள்ளைப்பொருள்’ பல்பொருள்தன்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது; குறிப்பிட்ட வரலாற்று அல்லது கோட்பாட்டு அடையாளம் திணிக்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதக் கவிதைக்கு ஏற்ற மரியாதையும் கண்ணியமும் கொண்ட நடை. ‘நீர்/ஒளிவீசுகிறீர்’ என்ற வடிவங்கள் இறைவனை நேரடியாக அழைக்கும் கவித்துவத் தன்மையைப் பேணுகின்றன. அடிக்குறிப்பு குறியீடு பிரதான உரையில் இடம்பெற்றுள்ளது.
