  source_fidelity: ஒப்பீட்டுப் பொருள் (‘-விட’) சரியாகப் பிரதிபலிக்கப்பட்டுள்ளது; ஆயினும் ‘இரைகொள்ளும் மலைகள்’ என்பது טָרֶף-இன் ‘இரை’ என்ற பெயர்ச்சொல்லை மலைகள் செயற்படுத்தும் செயலாக மாற்றுகிறது. மூலத்தின் திட்டமிட்ட கவித்துவத் தெளிவின்மையைப் பேண ‘இரையின் மலைகள்’ என அமைத்தல் பாதுகாப்பானது.
  naturalness: ‘நீர் ஒளிமிக்கவர்’ என்பது நவீன நிலையான தமிழில் மரியாதையான, சங்கீதக் கவிதைக்கு ஏற்ற இயல்பான பெயரடைப் பயனிலை. இரண்டாம் பயனிலையிலும் அதே மரியாதை வடிவம் தொடர்கிறது.
