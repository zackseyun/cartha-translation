source:
  edition: WLC
  text: נִֽדֲר֣וּ וְ/שַׁלְּמוּ֮ לַ/יהוָ֪ה אֱֽלֹהֵ֫י/כֶ֥ם כָּל סְבִיבָ֑י/ו יוֹבִ֥ילוּ שַׁ֝֗י לַ/מּוֹרָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/076/011.yaml
  text: Make vows to Yahweh your God and fulfill them[b][a]; let all around him bring tribute to the Fearsome One.
translation:
  language: ta
  text: உங்கள் கடவுளாகிய யாவேக்கு நேர்ச்சைகள் செய்து, அவற்றை நிறைவேற்றுங்கள்; அவரைச் சூழ்ந்திருக்கும் அனைவரும் அஞ்சத்தக்கவருக்கு[b] திறை[a] கொண்டுவரட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘காணிக்கை’ அல்லது ‘பரிசு.’ எபிரெயச் சொல் שַׁי, மதிப்புக்குரிய மேலான ஒருவருக்குக் கொடுக்கப்படும் பரிசைக் குறிக்கலாம்; ‘திறை’ என்பது இங்குள்ள பயபக்தி சார்ந்த, ஒருவேளை அரசியல் சார்ந்த நுண்பொருளையும் வெளிப்படுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘அஞ்சப்பட வேண்டியவருக்கு’ அல்லது ‘பயபக்திக்குரியவருக்கு’ என்றும் மொழிபெயர்க்கலாம். இந்த எபிரெயப் பட்டம், கடவுளே அச்சத்துக்கும் பயபக்திக்கும் உரியவர் என்பதை வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִדֲרוּ
  choice: நேர்த்திக்கடன்களைச் செய்து
  rationale: נדר என்பதன் பன்மை ஏவல்வினை. தமிழில் கடவுளிடம் செய்யப்படும் உறுதிமொழியை இயல்பாகவும் தெளிவாகவும் குறிக்க ‘நேர்த்திக்கடன் செய்தல்’ பயன்படுத்தப்பட்டது.
- source_word: וְשַׁלְּמוּ
  choice: அவற்றை நிறைவேற்றுங்கள்
  rationale: இங்கு שלם என்பது முன்பு கூறப்பட்ட நேர்த்திக்கடன்களைச் செலுத்துதல் அல்லது நிறைவேற்றுதல். தமிழில் உட்கிடையான செயப்படுபொருளை வெளிப்படையாக்கி ‘அவற்றை நிறைவேற்றுங்கள்’ என வழங்குவது தெளிவாக உள்ளது.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: எபிரெய மூலத்தில் உள்ள יהוה என்ற உடன்படிக்கைப் பெயர் பொதுப்பட்டமாக மாற்றப்படாமல் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டது.
- source_word: אֱלֹהֵיכֶם
  choice: உங்கள் கடவுளாகிய
  rationale: இரண்டாம் நபர் பன்மை உடைமைப் பின்னொட்டுடன் வரும் ‘உங்கள் கடவுள்’ என்பது யாவே யார் என்பதை இணைப்பெயராக விளக்குகிறது.
- source_word: כָּל סְבִיבָיו
  choice: அவரைச் சூழ்ந்திருக்கும் அனைவரும்
  rationale: வினை பன்மையில் இருப்பதால் இடங்களை அல்ல, அவரைச் சுற்றியுள்ள மக்கள் அல்லது மக்களினங்களைக் குறிக்கிறது; மூலத்தின் விரிவான பொருள் பாதுகாக்கப்பட்டது.
- source_word: יוֹבִילוּ
  choice: கொண்டுவரட்டும்
  rationale: יבל என்பதன் ஹிஃபில் வடிவம் இச்சூழலில் பரிசையோ திறையையோ கொண்டுவருவதைக் குறிக்கிறது.
- source_word: שַׁי
  choice: திறை
  rationale: மதிப்புக்குரிய மேலான ஒருவரிடம் கொண்டுவரப்படும் பரிசை இச்சொல் குறிக்கலாம். சங்கீதத்தின் அரசியல் மற்றும் பயபக்தி நிழல்களை ‘திறை’ நன்கு வெளிப்படுத்துகிறது; ‘காணிக்கை’ அல்லது ‘பரிசு’ என்பதும் சாத்தியம்.
- source_word: לַמּוֹרָא
  choice: அஞ்சத்தக்கவருக்கு
  rationale: מורא என்பது அச்சம், திகில், பயபக்தி ஆகிய பொருள்களைத் தாங்குகிறது. இங்கு கடவுளுக்கான பட்டமாகச் செயல்படுவதால், அவரே அஞ்சப்பட வேண்டியவர் என்ற வலிமையை ‘அஞ்சத்தக்கவர்’ காக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூலத்தில் இறைவனின் தனிப்பெயர் நேரடியாக உள்ளது. பொதுப்பட்டமாக மாற்றாமல் அந்த உடன்படிக்கைப் பெயரைத் தமிழில் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைக் காக்கிறது.
- issue: לַמּוֹרָא என்பதை இறைப்பட்டமாக வழங்குதல்
  choice: அஞ்சத்தக்கவர்
  alternative: பயபக்திக்குரியவர்; அச்சமூட்டுகிறவர்
  rationale: சுற்றியுள்ள வசனங்களில் கடவுளின் அரசர்களையும் நாடுகளையும் நடுங்கச் செய்யும் மாட்சிமை வலியுறுத்தப்படுகிறது. ‘அஞ்சத்தக்கவர்’ என்பது வெறும் வியப்பாக மென்மைப்படுத்தாமல் அச்சமும் பயபக்தியும் சேர்ந்த பதற்றத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘நேர்த்திக்கடன்’, ‘திறை’, ‘அஞ்சத்தக்கவர்’ ஆகிய சொற்கள் சங்கீதத்தின் வழிபாட்டு, அரசர்சார், அச்சமூட்டும் தொனிகளைச் சுருக்கமாகக் காக்கின்றன.
