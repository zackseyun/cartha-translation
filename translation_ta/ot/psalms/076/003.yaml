- from: அங்கே அவர் வில்லின் தீப்பொறி போன்ற அம்புகளையும்[a], கேடயத்தையும் வாளையும் போரையும் முறித்துப்போட்டார்[b]. சேலா.
  to: அங்கே அவர் வில்லின் சுடரம்புகளையும்[a], கேடயத்தையும் வாளையும் போரையும் சிதறடித்தார்[b]. சேலா.
  rationale: The revision replaces the added simile with ‘சுடரம்புகள்,’ which is concise, intelligible in modern literary Tamil, and preserves the Hebrew’s fire/flash-and-arrow imagery. It also refines the note to preserve lexical ambiguity. The remaining wording accurately and naturally represents the Hebrew poetic list and its implied subject.
