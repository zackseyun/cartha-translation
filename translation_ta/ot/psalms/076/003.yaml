theological_decisions:
- issue: மூன்றாம் ஆண்பால் ஒருமை வினையின் மறைமுக எழுவாய்
  choice: ‘அவர்’ என்பது சுற்றியுள்ள சங்கீதச் சூழலில் வரும் தேவனைக் குறிக்கிறது
  alternative: பெயர் குறிப்பிடப்படாத ஓர் ஆண்பால் எழுவாய்
  rationale: இவ்வசனத்தில் எழுவாய் வெளிப்படையாக இல்லை; ஆனால் உடனடியான சூழல் தேவனையே செய்பவராக அடையாளப்படுத்துகிறது. இது சூழல் சார்ந்த இலக்கணத் தீர்மானம்; தனிப்பட்ட கோட்பாட்டுச் சேர்க்கை அல்ல.
- issue: முறிக்கப்பட்டவற்றின் பட்டியலில் ‘போர்’ என்பதன் பொருள்
  choice: ஆயுதங்களோடு போரையும் அவர் முடிவுக்குக் கொண்டுவருவதைப் பட்டியல் கவித்துவமாகச் சொல்கிறது
  alternative: ‘போர்’ என்பது போர்க்கருவிகளின் தொகுப்பை அல்லது போரிடுதலை மட்டுமே குறிக்கலாம்
  rationale: எபிரெயச் சொல் பலவகைப் பொருளைக் கொண்டதால், போரே முறிக்கப்படுகிறது என்ற கவித்துவத் தீவிரத்தைத் தக்கவைத்து அதன் பரப்பை அடிக்குறிப்பில் திறந்தவாறு விடுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கவித்துவமும் கண்ணியமும் கொண்ட எளிய நடை. ‘தீப்பொறி போன்ற’ என்பது எபிரெய உருவகத்தைப் புரியத்தக்கவாறு காக்கிறது; ‘முறித்துப்போட்டார்’ வினையின் தீவிரத்தை வெளிப்படுத்துகிறது. மூலத்தில் ஒவ்வொரு பெயர்ச்சொல்லுக்கும் முன் வரும் இணைப்பை, தமிழில் இயல்பான ‘-ஐயும்’ பட்டியலாக வழங்கியுள்ளோம்.
