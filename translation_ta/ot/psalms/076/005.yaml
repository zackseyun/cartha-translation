source:
  edition: WLC
  text: אֶשְׁתּוֹלְל֨וּ אַבִּ֣ירֵי לֵ֭ב נָמ֣וּ שְׁנָתָ֑/ם וְ/לֹא מָצְא֖וּ כָל אַנְשֵׁי חַ֣יִל יְדֵי/הֶֽם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/076/005.yaml
  text: The stouthearted were plundered; they slept their sleep[a], and none of the men of valor could find their hands.
translation:
  language: ta
  text: 'உள்ளத்தில் வலிமைமிக்கவர்கள் கொள்ளையிடப்பட்டார்கள்;

    அவர்கள் தங்கள் உறக்கத்தை உறங்கினார்கள்;

    வீரர்கள் எவரும் தங்கள் கைகளைக் கண்டடையவில்லை.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, வீரர்கள் எவராலும் தங்கள் கைகளைப் பயன்படுத்த முடியவில்லை; அவர்கள் முற்றிலும் செயலற்றவர்களாக்கப்பட்டார்கள் என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶשְׁתּוֹלְלוּ
  choice: கொள்ளையிடப்பட்டார்கள்
  rationale: שלל என்ற வேரின் இவ்வடிவம், வலிமைமிக்கவர்களே கொள்ளைப் பொருள் பறிக்கப்பட்டவர்களானார்கள் என்ற செயப்பாட்டு/தற்சுட்டுப் பொருளைத் தருகிறது. போர்ச் சூழலுக்கும் அடுத்த அடியில் வரும் செயலற்ற நிலைக்கும் இது பொருந்துகிறது.
- source_word: אַבִּירֵי לֵב
  choice: உள்ளத்தில் வலிமைமிக்கவர்கள்
  rationale: எபிரெயச் சொற்றொடரின் நேரடியான பொருள் ‘இதயத்தில் வலிமைமிக்கவர்கள்.’ இங்கு ‘உள்ளம்’ என்பது மனவுறுதியையும் துணிவையும் குறிக்கிறது; தமிழில் இயல்பாக இருக்கும்படியும் மூல உருவகத்தைப் பேணும்படியும் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: נָמוּ שְׁנָתָם
  choice: அவர்கள் தங்கள் உறக்கத்தை உறங்கினார்கள்
  rationale: மூலத்தில் ஒரே சொல்வேரை மீண்டும் பயன்படுத்தும் கவித்துவமான சொற்றொடர் உள்ளது. தோல்வியால் ஏற்பட்ட உறக்கமா அல்லது மரண உறக்கமா என்பதை வெளிப்படையாகத் தீர்மானிக்காமல், அந்தத் திட்டமிட்ட இருபொருள் வாய்ப்பும் கவித்துவத் தாக்கமும் பாதுகாக்கப்படுகின்றன.
- source_word: אַנְשֵׁי חַיִל
  choice: வீரர்கள்
  rationale: இது போராற்றலும் வலிமையும் உடைய ஆட்களைக் குறிக்கும் வழக்கமான எபிரெயச் சொற்றொடர். ‘வீரர்கள்’ என்பது அதன் இராணுவச் சாயலை இயல்பான நவீன தமிழில் சுருக்கமாகத் தருகிறது.
- source_word: וְלֹא מָצְאוּ ... יְדֵיהֶם
  choice: எவரும் தங்கள் கைகளைக் கண்டடையவில்லை
  rationale: ‘தங்கள் கைகளைக் காணவில்லை’ என்ற மூல உருவகம், அவர்களால் செயல்படவோ எதிர்த்துப் போராடவோ முடியவில்லை என்பதைக் குறிக்கிறது. முதன்மை உரையில் உருவகம் பேணப்பட்டு, அதன் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
theological_decisions:
- issue: ‘உறக்கம்’ என்பது சாதாரண உறக்கமா அல்லது மரணமா
  choice: ‘தங்கள் உறக்கத்தை உறங்கினார்கள்’ என்று மூலத்தின் தெளிவின்மையைப் பேணுதல்
  alternative: ‘மரண உறக்கம் அடைந்தார்கள்’ என்று வெளிப்படையாக மொழிபெயர்த்தல்
  rationale: சூழல் மரணத்தை வலுவாகச் சுட்டினாலும், எபிரெய உரை ‘மரணம்’ என்று நேரடியாகக் கூறவில்லை. எனவே கவித்துவமான இறையியல் பதற்றத்தைத் தீர்த்துவிடாமல் வைத்திருக்கிறது.
translation_notes:
  register: நவீன நிலையான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. எபிரெயக் கவிதையின் இணைநிலையும் ‘உறக்கத்தை உறங்குதல்,’ ‘கைகளைக் கண்டடையாமை’ ஆகிய உருவகங்களும் இயன்றவரை பேணப்பட்டுள்ளன; கடைசி உருவகத்தின் இடியப் பொருள் அடிக்குறிப்பில் தெளிவுபடுத்தப்பட்டுள்ளது.
