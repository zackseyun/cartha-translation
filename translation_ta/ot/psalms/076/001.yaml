  rationale: ‘பெயர்’ என்பதைப் புகழ் அல்லது மரியாதை என்று மட்டும் சுருக்காமல், கடவுளின் வெளிப்படுத்தப்பட்ட அடையாளம் மற்றும் நற்பெயர் ஆகிய வேதாகமச் செறிவைத் தக்கவைக்கிறது.
- issue: נוֹדָע என்பதன் நிலைசார் அல்லது நிகழ்வுசார் நுணுக்கம்
  choice: முதன்மை உரையில் ‘அறியப்பட்டவர்’
  alternative: ‘தம்மை அறியச் செய்துள்ளார்’
  rationale: நிஃபால் வடிவம் நிலைசார் ‘அறியப்பட்டவர்’ என்ற பொருளையும், சூழலில் நிகழ்வுசார் நுணுக்கத்தையும் அனுமதிக்கலாம். முதன்மை உரை மிகக் குறைந்த விளக்கச் சேர்க்கையுள்ள பொருளைத் தருகிறது; மாற்று வாய்ப்பு அடிக்குறிப்பில் காக்கப்படுகிறது.
