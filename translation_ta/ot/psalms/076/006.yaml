  text: At your rebuke[a], O God of Jacob[b], both chariot and horse were cast into a deep sleep.
translation:
  language: ta
  text: யாக்கோபின் இறைவனே, உமது கண்டிப்பினால்[a] தேரும் குதிரையும்[b] ஆழ்ந்த உறக்கத்தில் ஆழ்த்தப்பட்டன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உமது கண்டிப்பிலிருந்து’ அல்லது ‘உமது கண்டிப்பின் காரணமாக.’
    reason: lexical_alternative
  - marker: b
    text: எபிரெய மொழியில் ‘தேரும் குதிரையும்’ என்று உள்ளது. இது படை வலிமையைக் குறிக்கும் கவிதை வழக்கு; இந்தப் படிமத்தில் அவற்றைச் செலுத்தியவர்களும் அடங்குவர் என்று சிலர் புரிந்துகொள்கிறார்கள்.
    reason: cultural_note
lexical_decisions:
- source_word: מִגַּעֲרָתְךָ
  choice: உமது கண்டிப்பினால்
  rationale: מִן முன்னொட்டு இங்கு மூலத்தையோ காரணத்தையோ குறிக்கலாம். ‘உமது கண்டிப்பினால்’ என்பது இறைவனின் கடிந்துரைக்கும் வார்த்தையால் ஏற்பட்ட உடனடி விளைவை இயல்பான தமிழில் தெரிவிக்கிறது; மற்ற சாத்தியங்களை அடிக்குறிப்பு காக்கிறது.
- source_word: אֱלֹהֵי יַעֲקֹב
  choice: யாக்கோபின் இறைவனே
  rationale: இது இறைவனுக்கான பட்டப்பெயராகவும் இச்சூழலில் நேரடி விளியாகவும் உள்ளது. ‘இறைவனே’ என்ற விளிவடிவம் அந்தக் கவிதைநடையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: נִרְדָּם
  choice: ஆழ்ந்த உறக்கத்தில் ஆழ்த்தப்பட்டன
  rationale: רדם என்பதன் நிஃபால் வடிவம் சாதாரணமாகத் தூங்குவதைவிட ஆழ்ந்த உறக்கம் அல்லது உணர்வற்ற மயக்கத்தில் ஆழ்த்தப்படுதலைக் குறிக்கிறது. தமிழாக்கம் அதன் செயலப்பாட்டு வடிவத்தையும் திடீர் செயலிழப்பையும் காக்கிறது.
- source_word: וְרֶכֶב וָסוּס
  choice: தேரும் குதிரையும்
  rationale: எபிரெய உரை போர்த்தேரையும் குதிரையையும் நேரடியாகப் பெயரிடுகிறது. ‘-உம்...-உம்’ இணைப்பு இரண்டையும் உள்ளடக்கும் கவிதை இணையை இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘வீரனும் குதிரையும்’ என்பது தேவையற்ற விளக்கவுரை.
theological_decisions:
- issue: இங்கு விவரிக்கப்படும் தோல்வியின் இயல்பு
  choice: இறைவனின் கண்டிப்பு பகைவரின் படை வலிமையைச் செயலற்றதாக்குவதை ஆழ்ந்த உறக்கப் படிமத்தால் வசனம் சித்தரிக்கிறது.
  alternative: இது விலங்குகள் சொற்பொருளில் தூங்கியதைக் குறிக்கிறது; அல்லது நேரடியாக மரணத்தையும் முழு அழிவையும் குறிக்கிறது.
  rationale: נִרְדָּם ஆழ்ந்த உறக்கம் அல்லது மயக்கத்தின் கவித்துவப் படிமத்தைப் பயன்படுத்துகிறது. சூழலில் அது பகைவரின் போர்வலிமை முற்றிலும் செயலிழந்ததைக் காட்டுகிறது; ஆனால் அதை வெறும் இயல்பான தூக்கமாகவோ வெளிப்படையான மரணக் கூற்றாகவோ மாற்றுவது மூலத்தின் பதற்றத்தைத் தீர்த்துவிடும்.
translation_notes:
  register: நவீன பொதுத்தமிழில், ஆனால் சங்கீதத்துக்கேற்ற கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘கண்டிப்பு’ என்பது மிகப் பேச்சுவழக்கான சொல்லையும் மிகப் பழமையான சொல்லையும் தவிர்த்து גְּעָרָה-வின் கடிந்துரைக்கும் வலிமையைத் தருகிறது. ‘ஆழ்த்தப்பட்டன’ என்ற செயலப்பாட்டு வடிவம் எபிரெய நிஃபால் வடிவத்தைப் பிரதிபலிக்கிறது.
