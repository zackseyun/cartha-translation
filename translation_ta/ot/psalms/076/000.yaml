source:
  edition: WLC
  text: לַ/מְנַצֵּ֥חַ בִּ/נְגִינֹ֑ת מִזְמ֖וֹר לְ/אָסָ֣ף שִֽׁיר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/076/000.yaml
  text: For the choirmaster[a]; with stringed instruments. A psalm of Asaph[b], a song.
translation:
  language: ta
  text: இசைத் தலைவருக்கு; தந்திக் கருவிகளுடன். ஆசாபின்[a] சங்கீதம்; ஒரு பாடல்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஆசாபின்” என்பது ஆசாபின் படைப்பு, ஆசாபிய இசைக் குழுவுடனான தொடர்பு, அல்லது ஆசாபுக்கான அர்ப்பணிப்பு ஆகியவற்றில் எதையும் குறிக்கக்கூடும்; ஆசாபே தனிப்பட்ட முறையில் எழுதியதாக மட்டும் இதைக் கொள்ள வேண்டியதில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: இசைத் தலைவருக்கு
  rationale: சங்கீதங்களின் தலைப்புகளில் இச்சொல் இசை நிகழ்த்துதலை மேற்பார்வையிடும் நபரைக் குறிக்கிறது. பொதுவான ‘தலைவருக்கு’ என்பதைவிட ‘இசைத் தலைவருக்கு’ என்பது இங்குள்ள இசைச் சூழலைத் தெளிவாகக் காட்டுகிறது.
- source_word: בִּנְגִינֹת
  choice: தந்திக் கருவிகளுடன்
  rationale: இச்சொல் தந்திகளை மீட்டோ இசைத்தோ வாசிக்கும் கருவிகளைக் குறிக்கிறது. எந்தக் குறிப்பிட்ட கருவியையும் தேவையின்றி சேர்க்காமல் மூலத்தின் இசைக்கருவிப் பொருளைப் பாதுகாக்கிறது.
- source_word: מִזְמוֹר
  choice: சங்கீதம்
  rationale: இது சங்கீதத் தலைப்புகளில் வரும் வழக்கமான இலக்கிய வகைப்பெயர். தொடர்ந்து வரும் ‘பாடல்’ என்பதிலிருந்து இதை வேறுபடுத்தியும் காட்டுகிறது.
- source_word: לְאָסָף
  choice: ஆசாபின்
  rationale: சங்கீதத் தலைப்புகளில் לְ என்ற முன்னொட்டு படைப்புரிமை, தொடர்பு, அர்ப்பணிப்பு ஆகியவற்றில் ஒன்றையோ பலவற்றையோ குறிக்கலாம். சுருக்கமான மரபுவழி வடிவமான ‘ஆசாபின்’ பயன்படுத்தப்பட்டு, அதன் பொருள் வரம்பு அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: שִׁיר
  choice: ஒரு பாடல்
  rationale: ‘சங்கீதம்’ என்பதுடன் இணைந்து வரும் இரண்டாவது வகைப்பெயரைத் தனித்துப் பாதுகாக்கிறது.
theological_decisions:
- issue: לְאָסָף என்பதன் உறவுப்பொருள்
  choice: ஆசாபின்
  alternative: ஆசாபுக்காக / ஆசாபுக்குரிய
  rationale: இது ஆசாபே இயற்றினார் என்று மட்டும் கட்டுப்படுத்தப்படவில்லை; அவரோடு தொடர்புடைய குழு, மரபு அல்லது அவருக்கான அர்ப்பணிப்பு என்பதையும் எபிரெய வடிவம் அனுமதிக்கிறது. அந்தத் திறந்த பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சங்கீதத் தலைப்புக்குரிய சுருக்கமும் கண்ணியமும் பேணப்பட்டுள்ளன. இரண்டு தனித்த இசை அறிவுறுத்தல்களைப் பிரிக்க அரைப்புள்ளியும், ‘சங்கீதம்’ மற்றும் ‘பாடல்’ என்ற இரு வகைப்பெயர்களைப் பிரிக்க மற்றொரு அரைப்புள்ளியும் பயன்படுத்தப்பட்டுள்ளன.
