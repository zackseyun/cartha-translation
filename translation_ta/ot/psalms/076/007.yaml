lexical_decisions:
- source_word: אַתָּה ... אַתָּה
  choice: நீர்—நீரே
  rationale: இருமுறை வரும் தனிப்பெயர்ச்சொல்லின் வலியுறுத்தலைத் தமிழில் இயல்பாகக் காட்டுகிறது; மூலத்தில் வெளிப்படையாக இல்லாத தனித்துவப் பொருளைச் சேர்க்காமல், ‘ஏ’ விகுதி வலியுறுத்தலைத் தருகிறது.
- source_word: נוֹרָא
  choice: அஞ்சத்தக்கவர்
  rationale: இந்தப் பெயரடை அச்சத்தையும் பயபக்தியையும் தூண்டுகிற தன்மையைக் குறிக்கிறது. ‘அஞ்சத்தக்கவர்’ என்பது கடவுளிடம் ஏற்பட வேண்டிய எதிர்வினையையும் அதன் பயனிலைத் தன்மையையும் காக்கிறது.
- source_word: וּמִי
  choice: யார்?
  rationale: இணைப்புச் சொல்லின் தொடர்ச்சி தமிழில் அரைப்புள்ளியால் இயல்பாக வெளிப்படுவதால் தனியே ‘மற்றும்’ சேர்க்கப்படவில்லை; வினா விடையற்ற சொல்லாட்சியாக, ஒருவரும் நிற்க இயலாது என்பதை உணர்த்துகிறது.
- source_word: יַעֲמֹד לְפָנֶיךָ
  choice: உமக்கு முன்பாக நிற்க வல்லவர்
  rationale: இச்சூழலில் நிற்பதற்கான திறன் அல்லது சாத்தியத்தைக் கேட்கும் எபிரெய வினை வடிவத்தை ‘வல்லவர்’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: מֵאָז
  choice: தொடங்கியதுமுதல்
  rationale: ஒரு காலப்புள்ளியிலிருந்து தொடர்வதைக் குறிக்கும் מֵאָז என்பதன் காலப் பொருளை இயல்பான தமிழில் தருகிறது; ‘எப்போது’ என்று மட்டும் மொழிபெயர்த்து அதன் தொடர்ச்சிப் பொருளைத் தட்டையாக்கவில்லை.
- source_word: אַפֶּךָ
  choice: உமது கோபம்
  rationale: אַף என்பதன் சொற்பொருள் ‘மூக்கு’ என்றாலும், இங்கு அது வழக்கமான ஆகுபெயராகக் கோபத்தைக் குறிக்கிறது. ‘கோபம்’ நவீனத் தமிழில் தெளிவானதும் தேவையற்ற தீவிரத்தைச் சேர்க்காததும் ஆகும்.
theological_decisions:
- issue: கடவுளைக் குறித்த அச்சத்தின் இயல்பு
  choice: அஞ்சத்தக்கவர்
  alternative: அச்சமூட்டுகிறவர்; பேரச்சத்திற்குரியவர்
  rationale: இச்சொல் வெறும் திகிலையோ மெலிந்த வியப்பையோ மட்டும் குறிக்காமல், கடவுளுடைய மகத்துவத்தின் முன் எழும் அச்சத்தையும் பயபக்தியையும் திறந்த நிலையில் வைத்திருக்கிறது.
- issue: கடவுளுடைய கோபத்தின் காலத் தொடர்பு
  choice: உமது கோபம் தொடங்கியதுமுதல்
  alternative: உமது கோபம் ஏற்பட்டதிலிருந்து; உமது கோபம் எழும்போது
  rationale: מֵאָז தரும் ‘அந்தக் காலத்திலிருந்து’ என்ற காலத் தொடர்ச்சியை முதன்மை வாசகம் காக்கிறது; கோபத்தின் இயல்பையோ காரணத்தையோ விளக்கமாகச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதக் கவிதைக்கேற்ற கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. கடவுளைச் சுட்டும் மரியாதைப் பன்மை (‘நீர்’, ‘உமது’) பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் வலியுறுத்தலைக் காக்க ‘நீர்—நீரே’ என்றும், சொல்லாட்சியின் கேள்வி வலிமையைத் தக்கவைக்க இறுதியில் ‘யார்?’ என்றும் அமைக்கப்பட்டுள்ளது.
