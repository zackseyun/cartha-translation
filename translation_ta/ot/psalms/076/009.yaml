  text: when God rises for judgment[a], to save all the humble of the earth[b]. Selah
translation:
  language: ta
  text: 'நியாயத்தீர்ப்புக்காகக் கடவுள் எழும்பும்போது,


    பூமியிலுள்ள தாழ்மையானவர்களையெல்லாம் காப்பாற்றுவதற்காக.


    சேலா'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּ/קוּם
  choice: எழும்பும்போது
  rationale: בְּ உடன் வரும் קוּם வினையெச்ச வடிவம் இங்கு காலத்தைக் குறிக்கிறது. எபிரெய உரையில் காலம் வெளிப்படையாக வரையறுக்கப்படாததால், தமிழில் இயல்பான பொதுநிகழ்கால வடிவம் பயன்படுத்தப்பட்டது.
- source_word: לַ/מִּשְׁפָּט
  choice: நியாயத்தீர்ப்புக்காக
  rationale: מִשְׁפָּט என்பது ‘தீர்ப்பு’ அல்லது ‘நீதி’ எனப் பொருள்படலாம். இங்கு கடவுள் நீதிபதியாகச் செயல்பட எழுவதைக் காட்டுவதால், சட்டநீதிசார் பொருளைத் தக்கவைக்கும் ‘நியாயத்தீர்ப்பு’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: வடிவத்தில் பன்மையாக இருந்தாலும் இங்கு இஸ்ரவேலின் ஒரே கடவுளைக் குறிக்கும் வழக்கமான ஒருமைப் பெயராக உள்ளது.
- source_word: לְ/הוֹשִׁיעַ
  choice: காப்பாற்றுவதற்காக
  rationale: ישׁע என்பதன் ஹிஃபில் வடிவம் ‘காப்பாற்றுதல்’ அல்லது ‘விடுவித்தல்’ எனப் பொருள்படும். ஆபத்திலிருந்து மீட்கும் பரந்த பொருளை இயல்பான தமிழில் ‘காப்பாற்றுதல்’ தெரிவிக்கிறது.
- source_word: כָּל
  choice: அனைவரையும்
  rationale: தொடர்ந்து வரும் மக்கள் குழுவை முழுமையாகவும் கூட்டாகவும் குறிக்கும் כָּל என்பதற்கு ‘அனைவரையும்’ இயல்பான தமிழ் வடிவமாகும்.
- source_word: עַנְוֵי
  choice: தாழ்மையான
  rationale: עָנָו என்பது தாழ்மை, சாந்தம், தாழ்நிலை அல்லது துன்புறுத்தப்பட்ட நிலை ஆகியவற்றைக் குறிக்கக்கூடும். ‘தாழ்மையான’ என்பது அறநிலை மற்றும் சமூகத் தாழ்நிலை ஆகிய இரு நிழற்பொருள்களுக்கும் இடமளிக்கிறது; பிற சாத்தியங்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: אֶרֶץ
  choice: பூமி
  rationale: אֶרֶץ என்பது ‘பூமி’ அல்லது ‘நாடு’ எனப் பொருள்படலாம். ‘அனைவரையும்’ என்ற பரந்த கூற்றோடு ‘பூமி’ இயல்பாகப் பொருந்துகிறது; ‘நாடு’ என்ற சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: סֶלָה
  choice: சேலா
  rationale: இதன் துல்லியமான பொருள் உறுதியற்றது; இசை அல்லது வழிபாட்டுக் குறியீடாக இருக்கலாம். ஆகவே பொருளை ஊகிக்காமல் ஒலிபெயர்க்கப்பட்டது.
theological_decisions:
- issue: עַנְוֵי என்பதன் பொருள் நுட்பம்
  choice: தாழ்மையானவர்கள்
  alternative: சாந்தமானவர்கள் அல்லது துன்புறுத்தப்பட்டவர்கள்
  rationale: கடவுளின் நீதிசார் தலையீடு தாழ்நிலையில் உள்ள ஒரு மக்கள் குழுவைக் காப்பாற்றுகிறது. ‘தாழ்மையானவர்கள்’ என்பது அவர்களின் உள்ளார்ந்த மனநிலையையும் சமூக நிலைமையையும் முற்றிலும் பிரிக்காமல் வைக்கிறது; எபிரெயச் சொல்லின் பிற சாத்தியங்களை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரமான, வாசிக்க எளிய, அதேவேளை சங்கீதக் கவிதைக்குரிய கண்ணியமான தமிழ் பயன்படுத்தப்பட்டது. மூலத்தின் சார்பு வாக்கிய அமைப்பும் வரி இடைநிறுத்தமும் பாதுகாக்கப்பட்டுள்ளன; ‘சேலா’ விளக்கமின்றி ஒலிபெயர்க்கப்பட்டுள்ளது.
