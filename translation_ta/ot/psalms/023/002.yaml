  yaml_path: translation/ot/psalms/023/002.yaml
  text: In grassy pastures he makes me lie down[a]; beside restful waters he leads me.
translation:
  language: ta
  text: பசும்புல் மேய்ச்சல் நிலங்களில் அவர் என்னைப் படுத்துக்கொள்ளச் செய்கிறார்; இளைப்பாறச் செய்யும் நீரருகே[a] என்னை வழிநடத்துகிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அமைதியான நீரருகே” அல்லது “சலனமற்ற நீரருகே” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொற்றொடர் ஓய்வு அல்லது இளைப்பாறுதலுடன் தொடர்புடைய நீரை வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּנְאוֹת דֶּשֶׁא
  choice: பசும்புல் மேய்ச்சல் நிலங்களில்
  rationale: נְאוֹת என்பது மந்தைகள் தங்கி மேய்வதற்கேற்ற இடங்களையோ மேய்ச்சல் நிலங்களையோ குறிக்கிறது; דֶּשֶׁא பசுமையான புதிய புல்லைக் குறிக்கிறது. இரண்டையும் இணைத்து மேய்ப்பன் உருவகத்தை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: יַרְבִּיצֵנִי
  choice: என்னைப் படுத்துக்கொள்ளச் செய்கிறார்
  rationale: רבץ என்பதன் ஹிஃபில் வடிவிலுள்ள காரணவினைப் பொருளைத் தக்கவைக்கிறது; ‘இளைப்பாற வைக்கிறார்’ என்று கருத்தை மட்டும் சுருக்காமல், படுத்திருக்கும் மந்தையின் காட்சியையும் பாதுகாக்கிறது.
- source_word: עַל מֵי מְנֻחוֹת
  choice: இளைப்பாறச் செய்யும் நீரருகே
  rationale: עַל இச்சூழலில் அருகாமையைக் குறிக்கிறது. מֵי என்ற பன்மை வடிவம் தமிழில் இயல்பாக ஒருமைத் தொகுப்புப்பெயரான ‘நீர்’ என வழங்கப்படுகிறது. מְנֻחוֹת ஓய்வு அல்லது இளைப்பாறுதலுடன் தொடர்புடைய நீரைக் குறிக்கிறது; அதனால் நீரின் அசைவின்மையை மட்டும் முன்னிறுத்தாமல் இளைப்பாறுதலின் கருத்தை வெளிப்படுத்துகிறது.
- source_word: יְנַהֲלֵנִי
  choice: என்னை வழிநடத்துகிறார்
  rationale: נהל என்பதன் பியேல் வடிவம் அக்கறையுடன் நடத்திச் செல்வதைச் சுட்டுகிறது. ‘வழிநடத்துகிறார்’ என்பது மேய்ப்பன் உருவகத்தையும் வினையின் வழிகாட்டும் நுணுக்கத்தையும் இயல்பாகத் தருகிறது.
theological_decisions:
- issue: מְנֻחוֹת என்பதைக் பாரம்பரியமான ‘சலனமற்ற நீர்’ எனவா, இளைப்பாறுதலை வலியுறுத்துமாறா மொழிபெயர்ப்பது
  choice: இளைப்பாறச் செய்யும் நீர்
  alternative: அமைதியான நீர் / சலனமற்ற நீர்
  rationale: எபிரெயச் சொல் நீரில் அசைவு இல்லாமையை நேரடியாகக் குறிப்பிடுவதைக் காட்டிலும் ஓய்வு, அமைதி, இளைப்பாறுதல் ஆகியவற்றுடனான தொடர்பை வலியுறுத்துகிறது. இருப்பினும் ‘அமைதியான’ அல்லது ‘சலனமற்ற’ என்பதும் சூழலுக்கேற்ற சாத்தியமான வாசிப்புகள் என்பதால் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘பசும்புல் மேய்ச்சல் நிலங்கள்’ மற்றும் ‘படுத்துக்கொள்ளச் செய்கிறார்’ என்பவை மேய்ப்பன்–மந்தை உருவகத்தைத் தெளிவாக வைத்திருக்கின்றன; அளவுக்கு மீறிய பாரம்பரியச் சொற்களும் சமயப் பிரிவுக்குரிய விளக்கங்களும் தவிர்க்கப்பட்டுள்ளன.
