base_translation:
  language: en
  yaml_path: translation/ot/psalms/023/004.yaml
  text: Even though I walk through the valley of deep darkness[a], I will fear no evil, for you are with me; your rod and your staff—they comfort me.
translation:
  language: ta
  text: நான் காரிருள் பள்ளத்தாக்கின் வழியே நடந்தாலும்[a], எந்தத் தீங்குக்கும் அஞ்சமாட்டேன்; ஏனெனில் நீர் என்னோடு இருக்கிறீர். உமது கோலும் உமது ஊன்றுகோலும்—அவையே எனக்கு ஆறுதல் அளிக்கின்றன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மரண நிழலின் பள்ளத்தாக்கு வழியே.” எபிரெயச் சொல் மிக ஆழமான இருளைக் குறிக்கலாம்; அதில் மரணத்தை நினைவூட்டும் பொருளும் இருக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם כִּי
  choice: நடந்தாலும்
  rationale: சலுகைப் பொருளைக் காட்டும் எபிரெயச் சொற்றொடரைத் தமிழில் இயல்பாக வினையுடன் இணைத்து வழங்குகிறது.
- source_word: אֵלֵךְ
  choice: நான் ... நடந்தாலும்
  rationale: மேய்ப்பன் வழிநடத்தும் உருவகத்தையும், நிகழ்காலம்/எதிர்காலம் சார்ந்த பொதுவான இயக்க உணர்வையும் காக்கிறது.
- source_word: בְּגֵיא
  choice: பள்ளத்தாக்கின் வழியே
  rationale: இயக்கத்தைக் குறிக்கும் வினையுடன் ‘வழியே’ இயல்பாக அமைகிறது; גֵיא என்பதற்கு மிகக் குறிப்பான ‘கணவாய்’ என்பதற்குப் பதிலாக பொதுவான ‘பள்ளத்தாக்கு’ பொருத்தமானது.
- source_word: צַלְמָוֶת
  choice: காரிருள்
  rationale: மரணத்தை மட்டும் நேரடிப் பொருளாகக் கட்டுப்படுத்தாமல், மிக ஆழமான இருளையும் அதிலுள்ள மரண நிழலையும் உணர்த்துகிறது; பாரம்பரிய மாற்று அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: לֹא אִירָא רָע
  choice: எந்தத் தீங்குக்கும் அஞ்சமாட்டேன்
  rationale: רָע என்பதன் தீமை, கேடு, ஆபத்து ஆகிய பரந்த பொருள் எல்லையை ‘தீங்கு’ இயல்பாகத் தக்கவைக்கிறது; மறுப்பின் முழுமையை ‘எந்த...க்கும்’ வெளிப்படுத்துகிறது.
- source_word: כִּי אַתָּה עִמָּדִי
  choice: ஏனெனில், நீர் என்னோடு இருக்கிறீர்
  rationale: அஞ்சாமைக்கான காரணத்தைத் தெளிவாகக் கூறுகிறது; இறைவனை நோக்கிய கண்ணியமான ஒருமை விளிப்பை ‘நீர்’ காக்கிறது.
- source_word: שִׁבְטְךָ
  choice: உமது கோல்
  rationale: மேய்ப்பன் உருவகத்தில் பாதுகாப்புக்கும் கட்டுப்பாட்டுக்கும் பயன்படும் கருவியைக் குறிக்கிறது.
- source_word: וּמִשְׁעַנְתֶּךָ
  choice: உமது தடி
  rationale: சாய்ந்து கொள்ளவும் வழிநடத்தவும் பயன்படும் மேய்ப்பனின் staff என்பதைக் ‘தடி’ இயல்பாகக் குறிக்கிறது; இணைச் சொல்லான ‘கோல்’ உடனான வேறுபாடும் தக்கவைக்கப்படுகிறது.
- source_word: הֵמָּה
  choice: அவையே
  rationale: எபிரெய மொழியின் வலியுறுத்தும் தனிப்பெயரைத் தமிழில் ‘அவையே’ என்றும் நீள்கோட்டுடனும் வெளிப்படுத்துகிறது.
- source_word: יְנַחֲמֻנִי
  choice: எனக்கு ஆறுதல் அளிக்கின்றன
  rationale: ஆறுதலையும் மனத்துணிவூட்டுதலையும் உள்ளடக்கும் வினையின் முதன்மைப் பொருளை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: צַלְמָוֶת என்ற புகழ்பெற்ற பாரம்பரியச் சொற்றொடரின் பொருள்
  choice: காரிருள்
  alternative: மரண நிழல்
  rationale: மூலமொழிச் சொல் மிக ஆழமான இருளைக் குறிக்கக்கூடும்; மரணத்தை மட்டுமே கட்டாயமான நேரடிப் பொருளாக்காமல் அதன் மரணத் தொடர்புள்ள கவித்துவ எதிரொலியை அடிக்குறிப்பில் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. இறைவனை நோக்கி மரியாதை ஒருமையான ‘நீர்/உமது’ வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன; மூலத்தின் வலியுறுத்தல் நீள்கோடும் ‘அவையே’ என்பதாலும் காக்கப்பட்டுள்ளது.
