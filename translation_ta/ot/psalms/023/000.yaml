  text: A psalm of David[a]. Yahweh is my shepherd[c][b]; I will lack nothing.
translation:
  language: ta
  text: 'தாவீதின் சங்கீதம்.[a]


    யாவே[b] என் மேய்ப்பர்; எனக்குக் குறைவிருக்காது.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தாவீதால் இயற்றப்பட்ட சங்கீதம்” அல்லது “தாவீதுக்கான சங்கீதம்” என்றும் மொழிபெயர்க்கலாம்; எபிரெய மேலுரையிலுள்ள לְדָוִד என்பது ஆசிரியத்துவம், அர்ப்பணம், அல்லது தாவீதுடனான தொடர்பைக் குறிக்கக்கூடும்.
    reason: alternative_reading
  - marker: b
    text: எபிரெயத்தில் YHWH (יהוה) என்ற இறைபெயர்; பல மொழிபெயர்ப்புகளில் மரபாக “கர்த்தர்” என்று வழங்கப்படுகிறது.
    reason: lexical_alternative
  - marker: c
    text: வேறுவிதமாக, “நான் எதிலும் குறைவுபடமாட்டேன்.” இங்கு தேவையானவை இல்லாமல் போவதே கருத்து.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר
  choice: சங்கீதம்
  rationale: இசைக்குரிய புனிதப் பாடலைக் குறிக்கும் எபிரெயச் சொல்லுக்கு, தமிழில் நிலைபெற்றும் இயல்பாகவும் உள்ள சொல்.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எழுத்துகளாலான இறைபெயரைப் பொதுப்பட்டமான ‘கர்த்தர்’ என மாற்றாமல், பெயராக ஒலிபெயர்க்கிறது.
- source_word: רֹעִי
  choice: என் மேய்ப்பர்
  rationale: மேய்ப்பவரின் வழிநடத்தல், பாதுகாப்பு, பராமரிப்பு ஆகிய உருவகப் பொருள்களைத் தக்கவைக்கிறது; இறைவனைக் குறிப்பிடுவதால் மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது.
- source_word: לֹא אֶחְסָר
  choice: எனக்குக் குறைவிருக்காது
  rationale: முதல் நபர் எதிர்கால/முழுமையற்ற வினையின் உறுதியையும், தேவையானது இல்லாமற்போகாது என்ற பரந்த பொருளையும் இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: לְדָוִד என்ற மேலுரையின் தொடர்பு
  choice: தாவீதின் சங்கீதம்
  alternative: தாவீதால் இயற்றப்பட்ட சங்கீதம் / தாவீதுக்கான சங்கீதம்
  rationale: எபிரெய לְ உருபு ஆசிரியத்துவம், அர்ப்பணம், அல்லது தொடர்பைக் குறிக்கக்கூடும்; முதன்மை உரையில் சுருக்கமான மரபுவழி வடிவத்தை வைத்து, தெளிவின்மையை அடிக்குறிப்பில் காக்கிறது.
- issue: יְהוָה என்பதன் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பொதுப்பட்டம் அல்ல, தனிப்பட்ட இறைபெயர் இருப்பதை வெளிப்படையாகத் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட கவிதைநடை. மேலுரையும் வசனமும் தனித்தனியாக அமைக்கப்பட்டுள்ளன; இறைபெயரும் மேய்ப்பர் உருவகமும் நேரடியாகப் பாதுகாக்கப்பட்டுள்ளன.
