  text: You set a table before me in the presence of my enemies[a]; you anoint my head with oil[b]; my cup overflows.
translation:
  language: ta
  text: என் பகைவர்கள் கண்முன்னே என் முன்னே மேசையை ஆயத்தப்படுத்துகிறீர்; என் தலையில் எண்ணெய் பூசுகிறீர்[a]; என் கோப்பை நிறைந்து வழிகிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லடியாக, “என் தலையை எண்ணெயால் கொழுமையாக்குகிறீர்.” இங்குள்ள வினைச்சொல் செழுமையாக்குதல் அல்லது தாராளமாகப் புத்துணர்வூட்டுதல் என்ற நுணுக்கத்தைக் கொண்டது; எண்ணெயால் தலையைப் பூசுதல் விருந்தோம்பல் மற்றும் மரியாதையின் காட்சியாகும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּעֲרֹךְ
  choice: ஆயத்தப்படுத்துகிறீர்
  rationale: ערך என்பது ஒழுங்குபடுத்துதல் அல்லது தயார் செய்தல் என்று பொருள்படும். விருந்தோம்பல் சூழலில் மேசையை உணவுக்காக ஆயத்தப்படுத்துதல் என்ற இயல்பான தமிழ்ப் பொருளை இது தருகிறது.
- source_word: לְפָנַי
  choice: எனக்காக
  rationale: சொல்லடியாக ‘என் முன்னே’ எனினும், மேசையை ஒருவருக்காக ஆயத்தப்படுத்தும் தமிழ்ச் சொல்லாட்சியில் பயனாளரைக் குறிக்கும் ‘எனக்காக’ இயல்பாக உள்ளது; அடுத்துள்ள נֶגֶד தான் பகைவர்களின் முன்னிலையைத் தெளிவாகக் காட்டுகிறது.
- source_word: שֻׁלְחָן
  choice: விருந்துமேசையை
  rationale: ‘மேசை’ என்பதே நேரடிப் பொருள். சங்கீதத்தின் விருந்தோம்பல் படிமத்தை உடனடியாகப் புரியச்செய்ய ‘விருந்துமேசை’ என வழங்கப்படுகிறது.
- source_word: נֶגֶד צֹרְרָי
  choice: என் பகைவர்கள் கண்முன்னே
  rationale: נֶגֶד என்பது எதிரில் அல்லது முன்னிலையில் என்பதையும், צֹרְרָי பகைமை காட்டுவோரையும் குறிக்கிறது. அவர்கள் பார்த்துக்கொண்டிருக்கும் நெருக்கமான காட்சியை இச்சொல்லாட்சி தக்கவைக்கிறது.
- source_word: דִּשַּׁנְתָּ
  choice: செழுமைப்படுத்துகிறீர்
  rationale: דשׁן என்பதன் அடிப்படை நுணுக்கம் கொழுமை, செழுமை, வளமாக்குதல் என்பதாகும். எண்ணெயோடு சேர்ந்து தாராளமான உபசரிப்பையும் புத்துணர்வையும் குறிக்கிறது; ‘அபிஷேகம் செய்கிறீர்’ என்பது மூலவினையின் நுணுக்கத்தை மறைத்து தேவையற்ற சமயச் சிறப்புப் பொருளை வரவழைக்கக்கூடும்.
- source_word: בַשֶּׁמֶן רֹאשִׁי
  choice: என் தலையை எண்ணெயால்
  rationale: உடற்பகுதியையும் பயன்படுத்தப்பட்ட பொருளையும் நேரடியாகத் தக்கவைக்கும் மொழிபெயர்ப்பு.
- source_word: כּוֹסִי רְוָיָה
  choice: என் கோப்பை நிரம்பி வழிகிறது
  rationale: רְוָיָה என்பது நிறைவு, செறிவு, அபரிமிதம் ஆகிய நுணுக்கங்களைக் கொண்ட பெயர்ச்சொல். தமிழில் ‘நிரம்பி வழிகிறது’ என்பது கோப்பையின் அபரிமித நிறைவை இயல்பாகவும் காட்சிப்பூர்வமாகவும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: தலையில் எண்ணெய் ஊற்றும் விருந்தோம்பல் படிமம்
  choice: ‘என் தலையை எண்ணெயால் செழுமைப்படுத்துகிறீர்’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘என் தலையில் எண்ணெய் பூசுகிறீர்’ அல்லது ‘என் தலையை எண்ணெயால் அபிஷேகம் செய்கிறீர்’
  rationale: இந்தச் சூழல் விருந்து, மரியாதை, தாராளமான உபசரிப்பு ஆகியவற்றைக் காட்டுகிறது. ‘செழுமைப்படுத்துகிறீர்’ என்பது דִּשַּׁנְתָּ என்பதன் வளமாக்கும் நுணுக்கத்தைப் பாதுகாக்கிறது; அரச அல்லது சடங்குசார் அபிஷேகத்தை வசனத்தில் இறக்குமதி செய்யவில்லை. தெளிவுக்காக அடிக்குறிப்பில் சொல்லடிப் பொருள் தரப்படுகிறது.
- issue: எபிரெய வினைகளின் காலம்/நிலை
  choice: 'நிகழ்காலத் தமிழ் பயன்படுத்தப்பட்டது: ‘ஆயத்தப்படுத்துகிறீர்... செழுமைப்படுத்துகிறீர்... வழிகிறது.’'
  alternative: 'இறந்தகாலம் அல்லது நிறைவுநிலை: ‘ஆயத்தப்படுத்தினீர்... செழுமைப்படுத்தினீர்...’'
  rationale: எபிரெயக் கவிதையில் இவ்வடிவங்கள் கர்த்தரின் பராமரிப்பை உயிரோட்டமுள்ள தற்போதைய காட்சியாகக் கூற முடியும். நிகழ்காலம் இதைத் தெளிவாகக் காட்டினாலும், எபிரெய அம்சத்தை இறுக்கமாகத் தீர்மானிப்பதில்லை.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க தமிழ் பயன்படுத்தப்பட்டுள்ளது. தெய்வத்தை நோக்கும் இரண்டாம் நபர் வினைகளில் ‘-கிறீர்’ மரியாதை வடிவம் கையாளப்பட்டுள்ளது. ‘விருந்துமேசை’ விருந்தோம்பல் படிமத்தைத் தெளிவாக்குகிறது; ‘கண்முன்னே’ பகைவர்கள் முன்னிலையில் நிகழ்வதன் காட்சித்தன்மையைப் பாதுகாக்கிறது. ‘அபிஷேகம்’ தவிர்க்கப்பட்டு, மூல வினையின் செழுமை நுணுக்கம் முதன்மைப்படுத்தப்பட்டுள்ளது.
