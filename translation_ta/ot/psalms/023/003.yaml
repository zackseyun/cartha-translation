  text: He restores my soul[c][b][a]; he leads me in paths of righteousness for the sake of his name.
translation:
  language: ta
  text: அவர் என் உயிரைப் புதுப்பிக்கிறார்[a]; தமது பெயரின் நிமித்தம் என்னை நீதியின் பாதைகளில்[b] நடத்துகிறார்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘என் உயிரை மீட்டளிக்கிறார்,’ ‘என்னைப் புத்துணர்வடையச் செய்கிறார்,’ அல்லது ‘என்னைத் திரும்பக் கொண்டுவருகிறார்’ என்றும் மொழிபெயர்க்கலாம். ‘உயிர்’ என்பதற்கான எபிரெயச் சொல் முழு ஆளையோ வாழ்வையோ குறிக்கலாம்; உடலற்ற ஓர் அம்சத்தை மட்டும் அல்ல.
    reason: lexical_alternative
