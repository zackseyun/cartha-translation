    reason: lexical_alternative
  - marker: c
    text: ‘தமது பெயரின் நிமித்தம்’ என்பது தம்முடைய குணத்திற்கும் நற்பெயருக்கும் மாட்சிக்கும் ஏற்றவாறு என்பதைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: נַפְשִׁי
  choice: என் உயிரை
  rationale: נֶפֶשׁ இங்கு மனிதரின் உடலற்ற ஓர் அம்சத்தை மட்டும் அல்லாமல் உயிரையும் முழு ஆளையும் குறிக்கலாம். நவீனத் தமிழில் ‘என் உயிரை’ என்பது அந்த விரிந்த பொருளை இயல்பாகத் தருகிறது.
- source_word: יְשׁוֹבֵב
  choice: புதுப்பிக்கிறார்
  rationale: שוב என்ற வேரின் இவ்வடிவம் திரும்பச் செய்தல், மீட்டல், உயிர்ப்பித்தல் அல்லது புத்துணர்வூட்டுதல் ஆகிய பொருள்களைத் தரலாம். ‘புதுப்பிக்கிறார்’ என்பது மேய்ப்பரின் பராமரிப்பால் ஏற்படும் மீட்பையும் புத்துணர்வையும் தமிழில் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: יַנְחֵנִי
  choice: என்னை நடத்துகிறார்
  rationale: נחה என்பதன் Hiphil வடிவம் வழிநடத்துதல் அல்லது நடத்திச் செல்லுதல் என்று பொருள்படும். ‘நடத்துகிறார்’ என்பது மேய்ப்பர் உருவகத்துடன் இயல்பாகப் பொருந்துகிறது.
- source_word: בְמַעְגְּלֵי
  choice: பாதைகளில்
  rationale: מַעְגָּל என்பது பாதை, தடம் அல்லது செல்லும் வழியைக் குறிக்கிறது. ‘பாதைகள்’ கவிதை உருவகத்தையும் வழிநடத்துதலையும் தெளிவாகக் காக்கிறது.
- source_word: צֶדֶק
  choice: நீதியின்
  rationale: צֶדֶק என்பது நீதி, நேர்மை, சரியானது ஆகிய பொருள்களைக் கொண்டது. ‘நீதியின் பாதைகள்’ அதன் ஒழுக்க மற்றும் உடன்படிக்கை சார்ந்த ஆழத்தைக் காக்கிறது; ‘சரியான பாதைகள்’ என்பதும் சாத்தியம்.
- source_word: לְמַעַן
  choice: நிமித்தம்
  rationale: לְמַעַן நோக்கம் அல்லது காரணத்தை வெளிப்படுத்துகிறது. ‘நிமித்தம்’ என்பது ‘அவருடைய பெயருக்காக’ என்ற கருத்தைச் செம்மையான, புரிந்துகொள்ளத்தக்க தமிழில் தருகிறது.
- source_word: שְׁמוֹ
  choice: தமது பெயரின்
  rationale: שֵׁם நேரடியாக ‘பெயர்’ என்றாலும், குணம், புகழ், நற்பெயர் ஆகியவற்றையும் உள்ளடக்கலாம். வேதாகமத் தெய்வவியல் ஒலியைப் பாதுகாக்க ‘பெயர்’ தக்கவைக்கப்படுகிறது.
theological_decisions:
- issue: ‘என் உயிரைப் புதுப்பிக்கிறார்’ என்பதன் பொருள்
  choice: மேய்ப்பரின் பராமரிப்பின்கீழ் சங்கீதக்காரரின் உயிர் அல்லது முழு ஆள் மீட்கப்பட்டுப் புத்துணர்வு பெறுதல்.
  alternative: ‘என்னைப் புத்துணர்வடையச் செய்கிறார்,’ ‘என் உயிரை மீட்டளிக்கிறார்,’ அல்லது ‘என்னைத் திரும்பக் கொண்டுவருகிறார்.’
  rationale: נֶפֶשׁ என்பதை உடலிலிருந்து பிரிந்த ‘ஆத்துமா’ என்ற குறுகிய பொருளுக்கு மட்டுப்படுத்தாமல், எபிரெயச் சொல்லின் முழு ஆள்/உயிர் என்ற பரப்பை மொழிபெயர்ப்பு காக்கிறது. שוב என்பதிலுள்ள மீட்டல் அல்லது திரும்பக் கொண்டுவருதல் என்ற சாத்தியமும் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: ‘நீதியின் பாதைகள்’ என்பதன் பொருள்
  choice: கடவுளின் வழிநடத்துதலின்கீழ் நீதியும் நேர்மையும் கொண்ட வழிகள்.
  alternative: ‘சரியான பாதைகள்’ அல்லது ‘நியாயத்தின் பாதைகள்.’
  rationale: צֶדֶק ஒழுக்க நீதியையும் சரியான வழியையும் குறிக்க முடியும். ‘நீதி’ அதன் ஒழுக்க மற்றும் உடன்படிக்கைத் தன்மையைப் பாதுகாக்கிறது; வெறும் பாதுகாப்பான பாதை என்ற ஒரே பொருளுக்குள் சொற்றொடரைச் சுருக்கவில்லை.
- issue: ‘தமது பெயரின் நிமித்தம்’ என்பதன் பொருள்
  choice: தம்முடைய குணம், நற்பெயர், மாட்சி ஆகியவற்றிற்கு ஏற்றவாறு அவர் வழிநடத்துகிறார்.
  alternative: ‘தமது நற்பெயருக்காக’ அல்லது ‘தமது பெயருக்காக.’
  rationale: வேதாகமப் பயன்பாட்டில் ‘பெயர்’ என்பது வெறும் அழைப்புப்பெயரைத் தாண்டி அந்த நபரின் வெளிப்பட்ட குணத்தையும் புகழையும் குறிக்கலாம். மூலத்தின் ‘பெயர்’ தக்கவைக்கப்பட்டு அதன் உட்பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கவிதைச் செம்மையும் சாதாரண வாசகருக்கான தெளிவும் சமநிலைப்படுத்தப்பட்டுள்ளன. மரியாதையைக் காட்ட ‘அவர்/தமது’ பயன்படுத்தப்பட்டுள்ளது. ‘ஆத்துமா’ என்பதற்குப் பதிலாக ‘உயிர்’ தேர்ந்தெடுக்கப்பட்டதால் נֶפֶשׁ என்ற சொல்லின் முழு ஆள்/வாழ்வு சார்ந்த பொருள் தெளிவாகிறது. எல்லா அடிக்குறிப்பு குறியீடுகளும் தொடர்புடைய சொற்றொடர்களுக்குப் பின் முதன்மை உரையில் இடம்பெற்றுள்ளன.
