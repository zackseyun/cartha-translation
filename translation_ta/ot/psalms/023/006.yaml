  text: אַ֤ךְ ט֤וֹב וָ/חֶ֣סֶד יִ֭רְדְּפוּ/נִי כָּל יְמֵ֣י חַיָּ֑/י וְ/שַׁבְתִּ֥י בְּ/בֵית יְ֝הוָ֗ה לְ/אֹ֣רֶךְ יָמִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/023/006.yaml
  text: Surely goodness and steadfast love will pursue me all the days of my life[c][b][a], and I will dwell in the house of Yahweh for length of days.
translation:
  language: ta
  text: நிச்சயமாக, நன்மையும் மாறாத அன்பும் என் வாழ்நாளெல்லாம் என்னைத் துரத்திவரும்[a]; நான் யாவேயின் இல்லத்தில் குடியிருப்பேன்[b], நெடுங்காலம்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என்னைப் பின்தொடரும்.” எபிரேய வினைச்சொல் இன்னும் உயிரோட்டமாக “துரத்தும்” என்று பொருள்பட்டு, கடவுளின் நன்மையும் மாறாத அன்பும் சங்கீதக்காரரை முனைப்புடன் தொடர்ந்து வருவதாகச் சித்தரிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நான் யாவேயின் இல்லத்திற்குத் திரும்புவேன்.” மசோரெட்டிய உயிர்க்குறிகள் “குடியிருப்பேன்” என்பதை ஆதரிக்கின்றன; “திரும்புவேன்” என்பது நீண்டகாலமாக நிலவும் மாற்று வாசிப்பு.
    reason: alternative_reading
  - marker: c
    text: அல்லது, “என்றென்றும்.” எபிரேயம் சொல்லுக்குச் சொல் “நாட்களின் நீளத்திற்கு” என்று கூறுகிறது; இது நீடித்த காலத்தைக் குறிக்கும் மரபுத்தொடர்.
    reason: alternative_reading
lexical_decisions:
- source_word: אַךְ
  choice: நிச்சயமாகவே
  rationale: இங்கு இந்த இடைச்சொல் கட்டுப்படுத்தும் ‘மட்டுமே’ என்ற பொருளைவிட, சங்கீதத்தின் இறுதியில் உறுதியான நம்பிக்கையை வலியுறுத்துகிறது.
- source_word: טוֹב
  choice: நன்மை
  rationale: חֶסֶד என்பதுடன் இணையாக வந்து, பொதுவான ‘நல்லது’ என்பதைக் காட்டிலும் கடவுளின் நன்மைசெய்யும் பராமரிப்பைக் குறிக்கிறது.
- source_word: חֶסֶד
  choice: மாறாத அன்பு
  rationale: நிலைத்த, உண்மையுள்ள, உறவுப்பற்று கொண்ட அன்பை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது; ‘இரக்கம்’ என்பது பொருளை மிகக் குறுக்கிவிடும்.
- source_word: יִרְדְּפוּנִי
  choice: என்னைத் துரத்திவரும்
  rationale: எபிரெய வினைச்சொல்லின் வலுவான ‘துரத்து/பின்தொடர்ந்து செல்’ என்ற படிமத்தைப் பாதுகாக்கிறது; பகைமை வழக்கமாகத் துரத்தும் இடத்தில் நன்மையும் அன்பும் சங்கீதக்காரரைத் துரத்திவருகின்றன என்ற கவித்துவத் தலைகீழாக்கத்தையும் வெளிப்படுத்துகிறது.
- source_word: כָּל יְמֵי חַיָּי
  choice: என் வாழ்நாளெல்லாம்
  rationale: காலத்தின் முழுமையையும் தனிப்பட்ட வாழ்க்கைச் சூழலையும் இயல்பான தமிழில் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: וְשַׁבְתִּי
  choice: நான் குடியிருப்பேன்
  rationale: மசோரா உயிர்க்குறிப்பின்படி ישׁב என்ற வேரிலிருந்து வரும் ‘குடியிரு’ என்பதே நேரடியான வாசிப்பு; ‘திரும்புவேன்’ என்பது பழமையான மாற்று வாசிப்பாக அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בְּבֵית יְהוָה
  choice: யாவேயின் இல்லத்தில்
  rationale: ‘இல்லம்’ மூலத்தின் தெளிவான இடப்படிமத்தைப் பாதுகாக்கிறது; יהוה என்பது பட்டப்பெயரால் மாற்றப்படாமல் ‘யாவே’ எனத் தமிழில் ஒலிபெயர்க்கப்படுகிறது.
- source_word: לְאֹרֶךְ יָמִים
  choice: நெடுநாள்களுக்கு
  rationale: நாட்களின் நீடித்த காலம் என்ற எபிரெயச் சொல்லாட்சியை இயல்பான தமிழில் வழங்கி, அதை வெளிப்படையாக முடிவற்ற காலம் என்று தீர்மானிக்காமல் அதன் திறந்த கவித்துவப் பொருளைப் பாதுகாக்கிறது.
theological_decisions:
- issue: לְאֹרֶךְ יָמִים குறிக்கும் கால அளவு
  choice: நெடுநாள்களுக்கு
  alternative: என்றென்றும்
  rationale: இந்தச் சொற்றொடர் வாழ்நாள் முழுவதுமான அல்லது நீடித்த உறவைக் குறிக்கலாம்; மரபாக ‘என்றென்றும்’ என்றும் மொழிபெயர்க்கப்பட்டுள்ளது. முடிவற்ற காலத்தை வெளிப்படையாக உறுதிசெய்து பொருள் அழுத்தத்தைத் தீர்த்துவிடாமல், முதன்மை உரை திறந்த காலப் பொருளைக் காக்கிறது.
- issue: וְשַׁבְתִּי என்பதன் பொருள்
  choice: நான் குடியிருப்பேன்
  alternative: நான் திரும்புவேன்
  rationale: மசோரா உரையின் உயிர்க்குறிப்பு ‘குடியிருப்பேன்’ என்பதை இயல்பாக ஆதரிக்கிறது. ஆயினும், ‘திரும்புவேன்’ என்பது நீண்டகால மொழிபெயர்ப்பு மரபுள்ள மாற்று வாசிப்பு என்பதால் அது அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் சங்கீதத்திற்கேற்ற கண்ணியமும் கவித்துவமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘துரத்திவரும்’ என்ற வலுவான படிமமும், ‘நெடுநாள்களுக்கு’ என்ற திறந்த காலக் குறிப்பும் மூலத்தின் அர்த்த அழுத்தத்தைப் பாதுகாக்கின்றன. தெய்வீகப் பெயர் יהוה ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
