  yaml_path: translation/ot/psalms/023/001.yaml
  text: A psalm of David[a]. Yahweh is my shepherd[c][b]; I will not lack.
translation:
  language: ta
  text: 'தாவீதின் சங்கீதம்[a].


    யாவே[b] என் மேய்ப்பர்;


    எனக்கு ஒன்றும் குறைவுபடாது[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தாவீது இயற்றிய சங்கீதம்’ என்றும், ‘தாவீதுக்கான சங்கீதம்’ என்றும், ‘தாவீதுடன் தொடர்புடைய சங்கீதம்’ என்றும் பொருள்படலாம். எபிரேயத் தலைப்பிலுள்ள לְדָוִד ஆசிரியத்துவம், அர்ப்பணிப்பு அல்லது தொடர்பைக் குறிக்கக்கூடும்.
    reason: alternative_reading
  - marker: b
    text: எபிரேயத்தில் YHWH; தமிழில் மரபாக ‘ஆண்டவர்’ என்றும் வழங்கப்படுகிறது.
    reason: lexical_alternative
  - marker: c
    text: ‘எனக்கு ஒன்றும் குறைவில்லை’ என்றும் மொழிபெயர்க்கலாம். இங்கு கருத்து, தேவையானது இல்லாமல் போகாது என்பதாகும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר
  choice: சங்கீதம்
  rationale: இது பாடல் வகையைக் குறிக்கும் தலைப்புச் சொல். சங்கீத நூலின் சூழலில் ‘சங்கீதம்’ என்பது வழக்கமான, தெளிவான தமிழ் இணைச்சொல்.
- source_word: לְדָוִד
  choice: தாவீதின்
  rationale: לְ முன்னிடைச்சொல் ஆசிரியத்துவம், உரிமை, அர்ப்பணிப்பு அல்லது தொடர்பைக் குறிக்கக்கூடும். ‘தாவீதின்’ என்பது தமிழில் இயல்பாக இருப்பதோடு, மூலத்தின் பரந்த பொருளை அடிக்குறிப்பின் உதவியுடன் தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது தேவனுடைய தனிப்பெயரான நான்கு எழுத்துப் பெயர் YHWH-ஐ, ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: רֹעִי
  choice: என் மேய்ப்பர்
  rationale: רעה என்ற வேரிலிருந்து வந்த இச்சொல் மந்தையை மேய்த்துப் பராமரிப்பவரைக் குறிக்கிறது. ‘என் மேய்ப்பர்’ தனிப்பட்ட உறவையும் உருவகத்தையும் இயல்பாகப் பாதுகாக்கிறது.
- source_word: לֹא אֶחְסָר
  choice: எனக்கு ஒன்றும் குறைவுபடாது
  rationale: חסר என்பது குறைவுபடுதல் அல்லது தேவையானது இல்லாமை என்பதைக் குறிக்கிறது. தமிழில் இயல்பாகவும் எதிர்கால நம்பிக்கையின் தொனியுடனும் இதன் பொருளை இவ்வாக்கியம் தெரிவிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூல உரையில் பட்டம் அல்ல, YHWH என்ற தனிப்பெயரே உள்ளது. ‘யாவே’ அதை நேரடியாக ஒலிபெயர்த்து, பெயருக்கும் பட்டத்திற்கும் உள்ள வேறுபாட்டைக் காக்கிறது.
- issue: לְדָוִד என்ற சங்கீதத் தலைப்பின் பொருள்
  choice: தாவீதின்
  alternative: தாவீது இயற்றியது; தாவீதுக்காக; தாவீதுடன் தொடர்புடையது
  rationale: எபிரெய முன்னிடைச்சொல் ஆசிரியத்துவம் மட்டுமின்றி அர்ப்பணிப்பு, உரிமை அல்லது தொடர்பையும் குறிக்கக்கூடும். முதன்மை உரை மரபான சுருக்கமான வடிவைப் பயன்படுத்துகிறது; அடிக்குறிப்பு அதன் உண்மையான தெளிவின்மையை வெளிப்படுத்துகிறது.
- issue: לֹא אֶחְסָר என்பதன் காலம் மற்றும் உறுதிப்பாட்டுத் தொனி
  choice: எனக்கு ஒன்றும் குறைவுபடாது
  alternative: எனக்கு ஒன்றும் குறைவில்லை
  rationale: எபிரெய வினை இச்சூழலில் தற்போதைய நிலை அல்லது எதிர்கால உறுதி ஆகிய இரண்டின் நிழலையும் தாங்கக்கூடும். தமிழ் எதிர்கால வடிவம் மேய்ப்பர்மீது வைக்கும் நம்பிக்கையின் உறுதிப்பாட்டை இயல்பாக வெளிப்படுத்துகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
