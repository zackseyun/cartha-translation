id: PSA.78.33
reference: Psalms 78:33
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יְכַל בַּ/הֶ֥בֶל יְמֵי/הֶ֑ם וּ֝/שְׁנוֹתָ֗/ם בַּ/בֶּהָלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/033.yaml
  text: So he consumed their days in futility[a], and their years in terror.
translation:
  language: ta
  text: அவர் அவர்களுடைய நாட்களைப் பயனின்றி[a] முடிவுக்குக் கொண்டுவந்தார்; அவர்களுடைய ஆண்டுகளைத் திகிலில் முடிவுக்குக் கொண்டுவந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பயனின்றி’ என்பதற்கான எபிரெயச் சொல் ‘மூச்சு,’ ‘வெறுமை,’ அல்லது ‘வீண்மை’ என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַל
  choice: முடிவுக்குக் கொண்டுவந்தார் / முடித்தார்
  rationale: כלה என்ற வினை இங்கு ‘முடித்தல், முடிவுக்குக் கொண்டுவருதல், தீர்த்துவிடுதல்’ என்ற பொருளைக் கொண்டது. சூழலில் கடவுளே மறைமுக எழுவாய்; தமிழில் இயல்பான கவிதைநடைக்காக இணையான இரண்டாம் கூறில் ‘முடித்தார்’ எனச் சுருக்கப்பட்டுள்ளது.
- source_word: בַּהֶבֶל
  choice: பயனற்றவையாக
  rationale: הֶבֶל என்பதன் அடிப்படைப் படிமம் மூச்சு அல்லது ஆவி போல நிலையற்ற வெறுமை; உருவகமாகப் பயனின்மை, வீண் தன்மை ஆகியவற்றைக் குறிக்கிறது. இங்கு அவர்களின் நாட்கள் பயனற்றுப் போன தன்மையை நவீன தமிழில் தெளிவாகச் சொல்கிறது; அடிப்படைப் படிமத்தின் பரப்பை அடிக்குறிப்பு காக்கிறது.
- source_word: יְמֵיהֶם
  choice: அவர்களுடைய நாட்களை
  rationale: வாழ்க்கைக் காலத்தைக் குறிக்கும் எபிரெயக் கவிதைப் படிமத்தையும் பன்மையையும் நேரடியாகக் காக்கிறது.
- source_word: וּשְׁנוֹתָם
  choice: அவர்களுடைய ஆண்டுகளை
  rationale: ‘நாட்கள் / ஆண்டுகள்’ என்ற எபிரெய இணை அமைப்பையும் காலப் படிமத்தையும் காக்கிறது.
- source_word: בַּבֶּהָלָה
  choice: திகிலில்
  rationale: בֶּהָלָה திடீர் அச்சம், பீதி, கலக்கம் அல்லது திகில் ஆகியவற்றைக் குறிக்கலாம். நியாயத்தீர்ப்புச் சூழலில் ‘திகிலில்’ என்பது உணர்வுத் தீவிரத்தையும் இயல்பான தமிழையும் வழங்குகிறது.
theological_decisions:
- issue: வினையின் மறைமுக எழுவாய்
  choice: கடவுளைக் குறிக்கும் ‘அவர்’ வெளிப்படையாக வைக்கப்பட்டது
  alternative: ‘அவர்களுடைய நாட்கள் முடிவுக்கு வந்தன’ என்ற எழுவாயற்ற அல்லது செயப்பாட்டு வடிவம்
  rationale: சுற்றியுள்ள சூழல் இந்தச் செயலைக் கடவுளின் நியாயத்தீர்ப்பாகக் காட்டுகிறது. எபிரெய வினையின் ஆண்பால் ஒருமை எழுவாயையும் தெய்வீகச் செயலாண்மையையும் ‘அவர்’ காக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயத்தின் ‘நாட்கள் / ஆண்டுகள்’ இணை அமைப்பு காக்கப்பட்டுள்ளது; தமிழில் தேவையற்ற கடினத்தன்மையைத் தவிர்க்க ஒரே வினை இரண்டாம் கூறில் சுருக்கமாகத் திரும்ப வழங்கப்பட்டுள்ளது.
