revisions:
- from: ஆகவே அவர் அவர்களுடைய நாட்களைப் பயனற்றவையாக[a] முடிவுக்குக் கொண்டுவந்தார்; அவர்களுடைய ஆண்டுகளைத் திகிலில் முடித்தார்.
  to: அவர் அவர்களுடைய நாட்களைப் பயனின்றி[a] முடிவுக்குக் கொண்டுவந்தார்; அவர்களுடைய ஆண்டுகளைத் திகிலில் முடிவுக்குக் கொண்டுவந்தார்.
  rationale: The revision retains the explicit divine subject, the “days / years” parallelism, and the senses of futility and terror. It improves idiomatic Tamil and represents the Hebrew’s single governing verb consistently across both poetic lines.
