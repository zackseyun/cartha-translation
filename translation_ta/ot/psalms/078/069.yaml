  terminology: 'Key terms are handled well: “பரிசுத்த இடம்” avoids unnecessarily narrowing the sanctuary to a temple building; “உயரங்கள்” preserves the deliberately non-specific elevated imagery; and “என்றென்றும் நிறுவிய” conveys enduring establishment without doctrinal expansion.'
