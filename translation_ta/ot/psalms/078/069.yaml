  source_fidelity: 'The Tamil accurately represents the Hebrew sequence and comparisons: God built his sanctuary like exalted heights and like the earth that he established permanently. It retains the poetic openness of רָמִים and correctly relates the feminine suffix in יְסָדָהּ to பூமி.'
