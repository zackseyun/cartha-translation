source:
  edition: WLC
  text: וַ/יִּ֣בֶן כְּמוֹ רָ֭מִים מִקְדָּשׁ֑/וֹ כְּ֝/אֶ֗רֶץ יְסָדָ֥/הּ לְ/עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/069.yaml
  text: And he built his sanctuary like the heights[b][a], like the earth that he established forever.
translation:
  language: ta
  text: அவர் தமது பரிசுத்த இடத்தை உயரங்களைப் போல[a], தாம் என்றென்றும் நிறுவிய[b] பூமியைப் போலக் கட்டினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உயர்ந்த வானங்களைப் போல” அல்லது “உன்னத உயரங்களைப் போல” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொற்றொடர் கவித்துவமானது; அது உயர்ந்த வானங்களையோ மலை உயரங்களையோ நினைவூட்டலாம்.
    reason: lexical_alternative
  - marker: b
    text: “தாம் என்றென்றும் அடித்தளமிட்ட” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: கட்டினார்
  rationale: בנה என்பதன் நேரடியான பொருளையும், முந்தைய நிகழ்வைத் தொடர்ந்து வரும் கதை ஓட்டத்தையும் இயல்பான தமிழில் தருகிறது.
- source_word: כְּמוֹ
  choice: போல
  rationale: ஒப்புமையைக் குறிக்கும் எபிரெயச் சொல்லுக்கு இயல்பான நவீனத் தமிழ் இணை.
- source_word: רָמִים
  choice: உயரங்களை
  rationale: உயர்ந்த வானங்கள் அல்லது மலை உயரங்கள் என்ற இருவகைக் கவித்துவப் படிமங்களுக்கும் இடமளித்து, ஒன்றை மட்டும் தீர்மானிக்காமல் மூலத்தின் சுருக்கமான தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: מִקְדָּשׁוֹ
  choice: தமது பரிசுத்த இடத்தை
  rationale: מקדש என்பதன் ‘பரிசுத்த இடம்/சரணாலயம்’ என்ற பரந்த பொருளைக் காக்கிறது; குறிப்பாகக் கோவில் கட்டடம் என்று தேவையின்றிக் குறுக்கவில்லை. ‘தமது’ என்பது தேவனைச் சுட்டும் மரியாதைத் தன்னிலை உடைமையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כְּאֶרֶץ
  choice: பூமியைப் போல
  rationale: இங்கு நிலைத்தன்மைக்கான பிரபஞ்ச அளவிலான ஒப்புமை இருப்பதால் ‘நாடு’ என்பதைவிட ‘பூமி’ பொருத்தமானது.
- source_word: יְסָדָהּ
  choice: தாம் நிறுவிய
  rationale: יסד என்பதன் நிறுவுதல் அல்லது அடித்தளமிடுதல் என்ற பொருளை இயல்பான தமிழில் தருகிறது; பெண்பால் ஒருமை விகுதி பூமியைப் பின்னோக்கிச் சுட்டுவதைத் தமிழ் வாக்கிய அமைப்பு தெளிவாக்குகிறது.
- source_word: לְעוֹלָם
  choice: என்றென்றும்
  rationale: நீடித்த நிலைத்தன்மையைக் குறிக்கும் கவித்துவ வலிமையை நவீனத் தமிழில் இயல்பாகக் காக்கிறது.
theological_decisions:
- issue: பரிசுத்த இடத்துடன் ஒப்பிடப்படும் ‘உயரங்கள்’ என்பதன் குறிப்பு மற்றும் படிமம்
  choice: தேவனுடைய பரிசுத்த இடம் உயரங்களுடனும், என்றென்றும் நிறுவப்பட்ட பூமியுடனும் ஒப்பிடப்படுகிறது.
  alternative: அது குறிப்பாக உயர்ந்த வானங்களுடனோ அல்லது மலை உயரங்களுடனோ ஒப்பிடப்படுகிறது.
  rationale: רָמִים என்பது கவித்துவமானதும் சுருக்கமானதும் ஆகும். ‘உயரங்கள்’ என்ற மொழிபெயர்ப்பு மேன்மையையும் நிலைத்தன்மையையும் உணர்த்துகிறது; அதேவேளையில், வானம் அல்லது மலை என்ற ஒரே விளக்கத்தை மூலத்தைவிடத் திட்டவட்டமாகத் திணிப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கவித்துவ நடை பயன்படுத்தப்பட்டுள்ளது. ‘உயரங்கள்’ என்ற சற்றே திறந்த படிமம் மூல எபிரெயின் உண்மையான தெளிவின்மையைப் பாதுகாக்கிறது; அடிக்குறிப்புகள் முக்கிய மாற்று வாசிப்புகளை விளக்குகின்றன.
