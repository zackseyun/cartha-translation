  text: He gave his people over to the sword[b][a], and was enraged with his inheritance.
translation:
  language: ta
  text: அவர் தமது மக்களை வாளுக்கு ஒப்புக்கொடுத்தார்[a]; தமது சுதந்தரத்தின் மீது கடுங்கோபம் கொண்டார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தமது மக்களை வாளின் கையில் ஒப்படைத்தார்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “தமது உரிமைச்சொத்தின் மீது சீற்றமடைந்தார்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּסְגֵּר
  choice: ஒப்புக்கொடுத்தார்
  rationale: סגר என்பதன் ஹிஃபில் வடிவம் இங்கு அடைத்துவைத்தல் என்பதல்ல; மற்றொரு சக்தியின் கையில் ஒப்படைத்தல் என்று பொருள்படுகிறது. ‘வாளுக்கு ஒப்புக்கொடுத்தார்’ என்பது அதன் காரணவினைப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לַחֶרֶב
  choice: வாளுக்கு
  rationale: חֶרֶב என்பதன் நேர்ப்பொருள் ‘வாள்’; இங்கு அது போரில் நேரும் வன்முறை மரணத்தைக் குறிக்கிறது. எபிரெய உருவகத்தைத் தமிழிலும் தக்கவைக்கப்பட்டுள்ளது.
- source_word: עַמּוֹ
  choice: தமது மக்களை
  rationale: עַם உடன் வரும் மூன்றாம் நபர் ஒருமை ஆண்பால் பின்னொட்டு ‘அவருடைய மக்கள்’ என்று பொருள் தருகிறது. மரியாதைமிக்க தமிழ்நடையில் ‘தமது’ இயல்பாக உள்ளது.
- source_word: וּבְנַחֲלָתוֹ
  choice: தமது உரிமைச்சொத்தின் மீது
  rationale: נַחֲלָה என்பது ‘சுதந்தரம்/உரிமைச்சொத்து’ எனப் பொருள்பட்டு, இங்கு இஸ்ரவேலை இறைவனுக்குரிய உடைமையாகக் குறிக்கும் உடன்படிக்கைச் சொல்லாக வருகிறது. கோபத்தின் இலக்கைச் சுட்ட ב இங்கு ‘மீது’ என இயல்பாக மொழிபெயர்க்கப்படுகிறது.
- source_word: הִתְעַבָּר
  choice: கடுங்கோபங்கொண்டார்
  rationale: עבר என்பதன் ஹித்பயேல் வடிவம் இச்சொற்றொடரில் தீவிரமாகக் கோபங்கொள்ளுதல் அல்லது சினமடைதல் என்று பொருள்படுகிறது. ‘கடுங்கோபங்கொண்டார்’ அதன் வலிமையை மிகைப்படுத்தாமல் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: இஸ்ரவேலைக் குறிக்கும் உடன்படிக்கைச் சொற்கள்
  choice: தமது மக்கள் … தமது உரிமைச்சொத்து
  alternative: தமது ஜனங்கள் … தமது சுதந்தரம்
  rationale: இறைவனுடைய நியாயத்தீர்ப்பு அவருக்கே உரிய மக்கள் மீது விழுகிறது என்ற இறையியல் அழுத்தத்தை இந்த இரண்டு தனித்துவமான சொற்களும் காக்கின்றன. ‘உரிமைச்சொத்து’ என்பது நவீன வாசகருக்கு நபர்களைக் குறித்துச் சற்றுக் கடினமாகத் தோன்றினாலும், נַחֲלָה-வின் உடைமை மற்றும் உடன்படிக்கை சார்ந்த பொருளைத் தெளிவாகத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘வாள்’ என்ற எபிரெய உருவகமும், ‘மக்கள்/உரிமைச்சொத்து’ என்ற இணையான உடன்படிக்கை அடையாளங்களும் பாதுகாக்கப்பட்டுள்ளன; இறைவனைக் குறிக்கும் மரியாதைப் பன்மை வினைமுற்றுகள் பயன்படுத்தப்பட்டுள்ளன.
