  text: אִם הֲרָגָ֥/ם וּ/דְרָשׁ֑וּ/הוּ וְ֝/שָׁ֗בוּ וְ/שִֽׁחֲרוּ אֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/034.yaml
  text: When he killed them[a], they sought him[b]; they returned and sought God earnestly.
translation:
  language: ta
  text: அவர் அவர்களைக் கொன்றபோது, அவர்கள் அவரைத் தேடினார்கள்; அவர்கள் திரும்பி[a], கடவுளை ஆர்வத்துடன் தேடினார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மனந்திரும்பி’ என்றும் பொருள் கொள்ளலாம்; வினைச்சொல்லின் நேரடிப் பொருள் ‘திரும்பி’ என்பதாகும்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்கு சொல், ‘அதிகாலையில் தேடினார்கள்’; இது ஆர்வமாக அல்லது தீவிரமாகத் தேடுவதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: கொன்றபோது
  rationale: இங்கு אִם ஒரு கற்பனையான நிபந்தனையை அல்ல, நிகழ்ந்த சூழலைக் குறிக்கிறது; ஆகவே ‘போது’ என்பது இயல்பான காலப்பொருளைத் தருகிறது.
- source_word: הֲרָגָם
  choice: அவர் அவர்களைக் கொன்றார்
  rationale: הרג என்பதன் நேரடியான பொருள் ‘கொல்லுதல்.’ எழுவாய் எபிரெயத்தில் மறைமுகமாக இருந்து, சூழலில் கடவுளைக் குறிக்கிறது.
- source_word: וּדְרָשׁוּהוּ
  choice: அவர்கள் அவரைத் தேடினார்கள்
  rationale: דרש, ஒருவரை நேரடிப் பொருளாகக் கொள்ளும்போது, அவரை நாடுதல் அல்லது தேடுதல் என்று பொருள்படும்; வினையோடு இணைந்துள்ள ‘அவரை’ என்ற சுட்டுப்பெயரும் பாதுகாக்கப்பட்டுள்ளது.
- source_word: וְשָׁבוּ
  choice: அவர்கள் திரும்பி
  rationale: שוב என்பதன் அடிப்படைப் பொருள் ‘திரும்புதல்.’ மனந்திரும்புதலைச் சூழல் உணர்த்தக்கூடும் என்றாலும், அதை முதன்மை உரையில் வெளிப்படையாகச் சேர்க்காமல் மூலத்தின் பொருள் விரிவை நிலைநிறுத்துகிறது.
- source_word: וְשִׁחֲרוּ
  choice: ஆர்வத்துடன் தேடினார்கள்
  rationale: שחר என்பதன் பியேல் வடிவம் சொல்லுக்கு சொல் ‘அதிகாலையில் தேடுதல்’ என்று இருக்கலாம்; இங்கு அது தீவிரமாக அல்லது ஆர்வத்துடன் நாடுதல் என்ற மரபுத்தொடர் பொருளைக் கொண்டுள்ளது.
- source_word: אֵל
  choice: கடவுள்
  rationale: אֵל இங்கு பொதுவான இறைப்பெயராக வருகிறது; ‘கடவுள்’ என்பது நவீனத் தமிழில் தெளிவான, இயல்பான இணை.
theological_decisions:
- issue: וְשָׁבוּ என்பதில் மனந்திரும்புதல் என்ற பொருளை வெளிப்படையாகக் கூற வேண்டுமா
  choice: அவர்கள் திரும்பி
  alternative: அவர்கள் மனந்திரும்பி
  rationale: שוב என்பது சூழலில் மனந்திரும்புதலை உணர்த்தக்கூடும்; ஆனால் அதன் அடிப்படைப் பொருள் ‘திரும்புதல்.’ ‘மனந்திரும்பி’ என்று மொழிபெயர்ப்பது மூலத்தில் வெளிப்படையாகச் சொல்லப்படாத இறையியல் முடிவை உறுதிப்படுத்திவிடும் என்பதால், பொருள் பதற்றம் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. ஒரே வசனத்திற்குள் வரும் ‘அவரை’ மற்றும் ‘கடவுளை’ என்ற மூலத்தின் சொல் மாறுபாடு பாதுகாக்கப்பட்டுள்ளது; இறையியல் விளக்கம் தேவையின்றி விரிவாக்கப்படவில்லை.
