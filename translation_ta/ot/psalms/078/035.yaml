  yaml_path: translation/ot/psalms/078/035.yaml
  text: Then they remembered that God was their rock[a], and God Most High was their redeemer.
translation:
  language: ta
  text: அப்போது அவர்கள், கடவுள் தங்கள் கற்பாறை என்றும், உன்னதமான கடவுள் தங்கள் மீட்பர் என்றும் நினைவுகூர்ந்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּזְכְּרוּ
  choice: அப்போது அவர்கள் ... நினைவுகூர்ந்தார்கள்
  rationale: வழக்கமான இறந்தகாலத் தொடரில் நிகழ்வின் அடுத்த கட்டத்தை וַ־ சுட்டுகிறது; ‘அப்போது’ அதன் தொடர்ச்சியையும், זכר நினைவுக்கு மீண்டும் கொண்டுவருதலையும் இயல்பான தமிழில் தருகிறது.
- source_word: כִּי
  choice: என்றும் ... என்றும்
  rationale: இங்கு כִּי காரணத்தைக் காட்டாமல் அவர்கள் நினைவுகூர்ந்த செய்தியை அறிமுகப்படுத்துகிறது; தமிழில் இணையான இரண்டு பயனிலைகளையும் ‘என்றும்’ கொண்டு அமைப்பது இயல்பானது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: வடிவத்தில் பன்மையாக இருந்தாலும், இங்கு இஸ்ரவேலின் ஒரே கடவுளைக் குறிக்கும் ஒருமைப் பொருளில் உள்ளது.
- source_word: צוּרָם
  choice: தங்கள் கற்பாறை
  rationale: צוּר தரும் உறுதி, பாதுகாப்பு ஆகிய உருவகத்தை ‘கற்பாறை’ நேரடியாகப் பாதுகாக்கிறது; எழுவாய் ‘அவர்கள்’ என்பதால் உடைமைக்கான இயல்பான தற்சுட்டுப் பெயராக ‘தங்கள்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: וְאֵל עֶלְיוֹן
  choice: உன்னதமான இறைவன்
  rationale: אֵל என்பது இங்கு தெய்வீகப் பட்டப்பெயர்; עֶלְיוֹן ‘உன்னதமான’ எனப் பொருள்படுகிறது. ‘இறைவன்’ என்ற மொழிபெயர்ப்பு பெயர்ப்போலியைத் தவிர்த்து, முந்தைய ‘கடவுள்’ என்பதோடு உள்ள கவிதை இணைப்பைப் பேணுகிறது.
- source_word: גֹּאֲלָם
  choice: தங்கள் மீட்பர்
  rationale: גאל என்பதன் பெயர்ச்சொல் தன்மையையும் மீட்டு விடுவிப்பவர் என்ற பொருளையும் ‘மீட்பர்’ சுருக்கமாகப் பேணுகிறது; இச்சூழலில் வெளிப்படையாக இல்லாத குறிப்பிட்ட உறவினர்-மீட்பர் சட்டநுணுக்கம் சேர்க்கப்படவில்லை.
theological_decisions:
- issue: אֱלֹהִים ... וְאֵל עֶלְיוֹן என்ற இணையான தெய்வீகப் பட்டப்பெயர்களை மொழிபெயர்த்தல்
  choice: ‘கடவுள் ... உன்னதமான இறைவன்’ என்று ஒரே கடவுளைக் குறிக்கும் இணையான சொற்றொடர்களாக வழங்குதல்
  alternative: ‘கடவுள் ... மிக உன்னதரான கடவுள்’ அல்லது ‘கடவுள் ... எல் எலியோன்’
  rationale: இரு கவிதை அடிகளும் ஒரே கடவுளை வெவ்வேறு தெய்வீகப் பட்டங்களால் குறிப்பிடுகின்றன. பட்டங்களை மொழிபெயர்ப்பது இரண்டு வெவ்வேறு தெய்வங்கள் என்ற தவறான எண்ணத்தைத் தவிர்க்கிறது; அதேவேளை எபிரெயத்தில் உள்ள சொல் வேறுபாட்டை ‘கடவுள்/இறைவன்’ என ஓரளவு பிரதிபலிக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் சங்கீதத்திற்கேற்ற கண்ணியத்துடனும் அமைக்கப்பட்டுள்ளது. ‘கற்பாறை’ என்ற மூல உருவகமும், ‘மீட்பர்’ என்ற பெயர்ச்சொல் வடிவமும் காக்கப்பட்டுள்ளன; தேவையற்ற சமயப்பிரிவு சார்ந்த சொற்கள் தவிர்க்கப்பட்டுள்ளன.
