  text: He gave their produce to the devouring locust[b][a], and their labor to the swarming locust.
translation:
  language: ta
  text: அவர்களுடைய விளைச்சலைப் பயிரழிக்கும் வெட்டுக்கிளிக்கும்[a], அவர்களுடைய உழைப்பின் பலனைக் கூட்டமாக வரும் வெட்டுக்கிளிக்கும் கொடுத்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பயிரைத் தின்னும் பூச்சிக்கும்.’ חָסִיל என்பது பயிரைத் தின்றழிக்கும் பூச்சியைப் பொதுவாகக் குறிக்கலாம்; வாதை பற்றிய பகுதிகளில் இது பெரும்பாலும் ஒரு வகை வெட்டுக்கிளியாகப் புரிந்துகொள்ளப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: கொடுத்தார்
  rationale: נתן என்பதன் நேரடியான பொருளைத் தக்கவைக்கிறது; இச்சூழலில் தீர்ப்பாக ஒப்படைத்தார் என்ற நிழற்பொருள் இருந்தாலும், எபிரெயச் சொல்லாட்சியை இயல்பாகப் பாதுகாக்கிறது.
- source_word: לֶחָסִיל
  choice: அழிக்கும் வெட்டுக்கிளிக்கு
  rationale: חָסִיל என்பது பயிரைத் தின்றழிக்கும் பூச்சியைக் குறிக்கிறது; வாதைச் சூழல்களில் பொதுவாக ஒரு வகை வெட்டுக்கிளியாகப் புரிந்துகொள்ளப்படுகிறது. துல்லியமான உயிரியல் இனத்தை அளவுக்கு மீறி நிர்ணயிக்காமல் அதன் அழிவுத் தன்மையை இத்தேர்வு தெரிவிக்கிறது.
- source_word: יְבוּלָם
  choice: அவர்களுடைய விளைச்சலை
  rationale: יְבוּל என்பது நிலத்தின் விளைபொருள் அல்லது மகசூலைக் குறிக்கிறது. ‘விளைச்சல்’ நவீன தமிழில் இயல்பாகவும் வேளாண் பொருளைத் தெளிவாகவும் தருகிறது.
- source_word: וִיגִיעָם
  choice: அவர்களுடைய உழைப்பின் பலனை
  rationale: יְגִיעַ உழைப்பு, பாடுபாடு, அல்லது உழைப்பால் கிடைத்த பலன் ஆகியவற்றைக் குறிக்கலாம். ‘விளைச்சல்’ என்பதற்கு இணையாக இங்கு உழைப்பால் கிடைத்ததைச் சுட்டுவது சூழலுக்கு இயல்பானது; சொல்லின் அடிப்படை ‘உழைப்பு’ உணர்வையும் தக்கவைக்கிறது.
- source_word: לָאַרְבֶּה
  choice: திரள் வெட்டுக்கிளிக்கு
  rationale: אַרְבֶּה என்பது வெட்டுக்கிளிக்கான பொதுவான சொல். இணைவரியில் வரும் இரு பூச்சிச் சொற்களையும் வேறுபடுத்தவும், வெட்டுக்கிளிகளின் கூட்டமாகப் படையெடுக்கும் தன்மையை வெளிப்படுத்தவும் ‘திரள் வெட்டுக்கிளி’ பயன்படுத்தப்படுகிறது.
