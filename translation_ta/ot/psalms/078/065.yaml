base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/065.yaml
  text: Then the Lord awoke as from sleep[a], like a warrior shouting because of wine.
translation:
  language: ta
  text: அப்போது ஆண்டவர் தூங்குபவரைப்போல் விழித்தெழுந்தார்; திராட்சரசத்தால் முழக்கமிடும் ஒரு வீரனைப்போல் இருந்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “திராட்சரசத்தால் களிகூரும் ஒரு வீரனைப்போல்”; அல்லது, “திராட்சரசத்தால் முழக்கமிடும் ஒரு வலிமைமிக்க மனிதனைப்போல்.”
    reason: מִתְרוֹנֵן என்பது முழக்கமிடுதல் அல்லது களிகூருதல் எனப் பொருள்படலாம்; גִּבּוֹר என்பது வீரன் அல்லது வலிமைமிக்க மனிதன் என மொழிபெயர்க்கப்படலாம்.
lexical_decisions:
- source_word: וַיִּקַץ
  choice: விழித்தெழுபவரைப் போல எழுந்தார்
  rationale: יקץ என்பதன் அடிப்படைப் பொருள் தூக்கத்திலிருந்து விழித்தெழுதல். தமிழில் தொடரின் உவமைத் தன்மையையும் செயற்பாட்டின் திடீர்மையையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כְּיָשֵׁן
  choice: தூக்கத்திலிருந்து விழித்தெழுபவரைப் போல
  rationale: כ ஒப்புமையைக் குறிக்கிறது; יָשֵׁן இங்கு தூங்குகிறவர் அல்லது தூங்கியவர் என்ற கவித்துவப் படிமத்தைத் தருகிறது. ஆண்டவர் உண்மையில் தூங்கினார் என்று உரை தீர்மானிப்பதாகத் தோன்றாமல் உவமையைப் பாதுகாக்கிறது.
- source_word: אֲדֹנָי
  choice: ஆண்டவர்
  rationale: இது יהוה அல்ல, אֲדֹנָי என்னும் தெய்வீகப் பட்டம். நவீனத் தமிழில் மரியாதையும் இயல்பும் கொண்ட வழக்கமான மொழிபெயர்ப்பு ‘ஆண்டவர்’.
- source_word: כְּגִבּוֹר
  choice: ஒரு மாவீரனைப் போல
  rationale: גִּבּוֹר வலிமைமிக்க வீரன் அல்லது போர்வீரனைக் குறிக்கிறது. ‘மாவீரன்’ வலிமையையும் போர்சார் படிமத்தையும் சுருக்கமாகத் தக்கவைக்கிறது.
- source_word: מִתְרוֹנֵן
  choice: ஆர்ப்பரிக்கும்
  rationale: இந்தப் பங்கேற்பு வடிவம் உரத்த முழக்கம், களிப்புக் கூச்சல், அல்லது வெற்றிச் சத்தம் ஆகியவற்றைக் குறிக்கலாம். ‘ஆர்ப்பரிக்கும்’ அந்த உரத்த வெளிப்பாட்டைக் காக்கிறது; அதன் துல்லிய நிழற்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: מִיָּיִן
  choice: திராட்சரசத்தால்
  rationale: מן இங்கு திராட்சரசத்தினால் ஏற்பட்ட நிலை அல்லது தூண்டுதலைக் குறிக்கலாம். ‘திராட்சரசத்தால்’ காரணத் தொடர்பை இயல்பான தமிழில் தருகிறது; மூலத்தின் சற்றே திறந்த தொடர்பும் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
theological_decisions:
- issue: ஆண்டவர் தூக்கத்திலிருந்து விழிப்பது போலவும் திராட்சரசத்தால் ஆர்ப்பரிக்கும் மாவீரனைப் போலவும் சித்தரிக்கப்படுதல்
  choice: மானுடத் தன்மையூட்டிய இரு உவமைகளையும் மென்மைப்படுத்தாமல் தக்கவைத்தல்
  alternative: ஆண்டவரின் செயலற்ற தோற்றத்திற்குப் பின் அவர் தலையிட்டார் என்று விளக்கவுரையாக மாற்றுதல், அல்லது திராட்சரசத்தை உருவகமாக மட்டும் எடுத்துரைத்தல்
  rationale: சங்கீதம் ஆண்டவரின் தீர்மானமான தலையீட்டைத் துணிவான கவித்துவப் படிமங்களால் கூறுகிறது. அவற்றை விளக்கி நீக்காமல், உள்ள இறையியல் பதற்றத்தையும் இலக்கிய வலிமையையும் மொழிபெயர்ப்பு பாதுகாக்க வேண்டும்.
translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும், அதேவேளையில் கவித்துவமும் கண்ணியமும் கொண்ட நடை. ‘திராட்சரசம்’ என்பது יין என்பதற்கான தெளிவான வழக்குச் சொல். மூலத்தின் இணை உவமைகளையும் வீரமிக்க ஒலிநயத்தையும் காக்கும் வகையில் வாக்கியம் அமைக்கப்பட்டது.
