- from: அப்போது ஆண்டவர் தூக்கத்திலிருந்து விழித்தெழுபவரைப் போல எழுந்தார்; திராட்சரசத்தால் ஆர்ப்பரிக்கும் ஒரு மாவீரனைப் போல எழுந்தார்.[a]
  to: அப்போது ஆண்டவர் தூங்குபவரைப்போல் விழித்தெழுந்தார்; திராட்சரசத்தால் முழக்கமிடும் ஒரு வீரனைப்போல் இருந்தார்.[a]
