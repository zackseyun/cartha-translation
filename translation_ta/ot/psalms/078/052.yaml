  text: Then he led out his people like sheep, and guided them like a flock in the wilderness.
translation:
  language: ta
  text: பின்பு அவர் தமது மக்களை ஆடுகளைப்போல் புறப்படச் செய்து, வனாந்தரத்தில் ஒரு மந்தையைப்போல் அவர்களை வழிநடத்தினார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּסַּע
  choice: புறப்படச் செய்து
  rationale: נסע என்பதன் ஹிஃபில் வடிவம் பயணம் செய்யச் செய்தல் அல்லது புறப்படச் செய்தல் என்ற காரணவினைப் பொருளைக் கொண்டது. எகிப்திலிருந்து மக்களை நகரச் செய்த சூழலை இச்சொல் இயல்பாகவும் துல்லியமாகவும் வெளிப்படுத்துகிறது.
- source_word: כַּצֹּאן
  choice: ஆடுகளைப்போல்
  rationale: צאן என்பது சிறிய கால்நடைகளை, குறிப்பாக ஆடுகளையும் வெள்ளாடுகளையும் குறிக்கலாம். இங்குள்ள மேய்ப்பர் உருவகத்தில் இயல்பான தமிழுக்காக ‘ஆடுகள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: עַמּוֹ
  choice: தமது மக்களை
  rationale: עם என்பது இங்கு கடவுளுக்குரிய மக்களாகிய இஸ்ரவேலைக் குறிக்கிறது. எழுவாய் உயர்திணை ஒருமையாக இருப்பதால், நவீன மரியாதைத் தமிழில் ‘தமது மக்கள்’ இயல்பாக அமைகிறது.
- source_word: וַיְנַהֲגֵם
  choice: அவர்களை வழிநடத்தினார்
  rationale: נהג என்பதற்கு நடத்துதல், ஓட்டுதல், வழிகாட்டுதல் ஆகிய பொருட்கள் உண்டு. மந்தை உருவகத்துடன் பொருந்தும் கவனமான தலைமையை ‘வழிநடத்தினார்’ தெளிவாகக் காட்டுகிறது.
- source_word: כָּעֵדֶר
  choice: ஒரு மந்தையைப்போல்
  rationale: עדר என்பது மந்தை அல்லது கால்நடைக் கூட்டத்தைக் குறிக்கிறது. முந்தைய ஆட்டு உருவகத்தைத் தொடர்ந்து ‘மந்தை’ என்பது தமிழில் ஒத்திசைவான தேர்வு.
- source_word: בַּמִּדְבָּר
  choice: வனாந்தரத்தில்
  rationale: מִדְבָּר என்பது மணற்பாலை மட்டும் அல்லாமல் குடியிருப்பற்ற வறண்ட நிலப்பகுதியையும் குறிக்கும். யாத்திராகமச் சூழலையும் வழக்கமான வேதாகமப் பயன்பாட்டையும் ‘வனாந்தரம்’ காக்கிறது.
theological_decisions:
- issue: யாத்திராகமச் சூழலில் கடவுளை மேய்ப்பராகச் சித்தரிக்கும் உருவகம்
  choice: மக்களை ஆடுகளைப்போல் புறப்படச் செய்து, மந்தையைப்போல் வழிநடத்தியதாக உருவகத்தை நேரடியாகத் தக்கவைத்தல்
  alternative: பாதுகாத்தார் அல்லது பராமரித்தார் என்று உருவகத்தை விளக்கிப் பொருளுரைத்தல்
  rationale: எபிரெய உரை மேய்ப்பர் உருவகத்தை மட்டும் முன்வைக்கிறது; அதன் பிற்கால இறையியல் விளக்கங்களை இங்கு சேர்க்கவில்லை. ஆகவே உருவகமும் கடவுளுக்கும் அவரது மக்களுக்கும் உள்ள உறவும் விரிவாக்கமின்றித் தக்கவைக்கப்படுகின்றன.
translation_notes:
  register: இயற்கையான, கண்ணியமான நவீனத் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘புறப்படச் செய்து’ காரணவினையைப் பாதுகாக்கிறது; ‘வழிநடத்தினார்’ மேய்ப்பர் உருவகத்தையும் எபிரெய இணைவரிகளின் சொல்வேறுபாட்டையும் இயல்பாக வெளிப்படுத்துகிறது. அடிக்குறிப்புகள் தேவையில்லை.
