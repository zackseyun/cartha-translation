base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/020.yaml
  text: Look[a], he struck the rock, and waters gushed out, and streams overflowed. Can he also give bread, or provide meat for his people?
translation:
  language: ta
  text: இதோ, அவர் கற்பாறையை அடித்தார்; தண்ணீர் பீறிட்டுப் பாய்ந்தது, நீரோடைகள் பெருக்கெடுத்து ஓடின. அவரால் அப்பமும் கொடுக்க முடியுமா? தம் மக்களுக்கு இறைச்சியையும் ஆயத்தப்படுத்த முடியுமா?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இறைச்சி” என்பதற்கான எபிரெயச் சொல் நேரடியாக “சதை” என்று பொருள்படும்; இங்கு அது உண்ணத்தக்க மாமிசத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: இதோ
  rationale: கண்முன் தெரிந்த ஒரு நிகழ்வை வலியுறுத்திக் காட்டும் எபிரெயச் சொல்லின் சுட்டும் தன்மையை இயல்பான, கண்ணியமான தமிழில் தருகிறது.
- source_word: הִכָּה
  choice: அடித்தார்
  rationale: கற்பாறையை வலிமையாகத் தாக்கிய இறந்தகாலச் செயலை நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: צוּר
  choice: கற்பாறையை
  rationale: வனாந்தரத்தில் நிகழ்ந்த குறிப்பிட்ட கற்பாறைச் சம்பவத்தைச் சுட்டுவதால் இந்தத் தேர்வு பொருத்தமானது.
- source_word: וַיָּזֻבוּ מַיִם
  choice: தண்ணீர் பீறிட்டுப் பாய்ந்தது
  rationale: தண்ணீர் மிகுதியாக வெளிப்பட்டு ஓடிய உயிரோட்டமான காட்சியைத் தமிழில் தெளிவாகத் தருகிறது.
- source_word: וּנְחָלִים יִשְׁטֹפוּ
  choice: நீரோடைகள் பெருக்கெடுத்து ஓடின
  rationale: נְחָלִים என்பதன் ஓடைகள்/வெள்ளோடைகள் என்ற பொருளையும், שׁטף என்பதன் பெருக்கான பாய்ச்சலையும் மிகைப்படுத்தாமல் காக்கிறது.
- source_word: הֲגַם
  choice: அவரால் ... முடியுமா?
  rationale: தண்ணீர் கொடுத்ததற்கு அப்பால் உணவும் கொடுக்க அவரால் இயலுமா என்ற மக்களின் ஐயமும் சவாலும் நிறைந்த வினாவை வெளிப்படுத்துகிறது.
- source_word: לֶחֶם
  choice: அப்பம்
  rationale: பொதுவான ‘உணவு’ என்று விரிவாக்காமல், மூலத்தின் குறிப்பான உணவுப்பெயரைப் பாதுகாக்கிறது.
- source_word: יוּכַל תֵּת
  choice: கொடுக்க முடியுமா
  rationale: יכולת என்ற இயலுமைப் பொருளையும் נתן என்ற கொடுத்தல் பொருளையும் தமிழில் வெளிப்படையாகக் காக்கிறது.
- source_word: אִם
  choice: இரண்டாவது இணை வினாவாக அமைத்தல்
  rationale: இங்கு אִם இரண்டாம் வினாப்பகுதியை அறிமுகப்படுத்துகிறது; தமிழில் தனித்த இணை வினாவாக அமைப்பது சந்தேகத்தின் தொடர்ச்சியை இயல்பாகத் தருகிறது.
- source_word: יָכִין
  choice: ஆயத்தப்படுத்த
  rationale: Hiphil வடிவின் ‘தயாராக்குதல்/ஏற்பாடு செய்தல்’ என்ற அடிப்படை நுணுக்கத்தைப் பாதுகாக்கிறது; வெறும் ‘கொடுத்தல்’ என ஒற்றைப்படுத்தவில்லை.
- source_word: שְׁאֵר
  choice: இறைச்சி
  rationale: சொல்லின் நேரடிப் பொருள் ‘சதை’; இச்சூழலில் உண்ணத்தக்க மாமிசத்தைக் குறிக்கும் இயல்பான தமிழ்ச் சொல் ‘இறைச்சி’.
- source_word: לְעַמּוֹ
  choice: தம் மக்களுக்கு
  rationale: தேவனுக்குரிய மக்கள் என்ற உறவையும், மூன்றாம் நபர் மரியாதை ஒருமையையும் இயல்பான தமிழில் காட்டுகிறது.
theological_decisions:
- issue: இஸ்ரவேலரின் சந்தேகம் வெளிப்படும் வினாவின் வலிமை
  choice: கடவுளின் திறனைச் சந்தேகிக்கும் இரண்டு தொடர்புடைய வினாக்களாக மொழிபெயர்த்தல்
  alternative: உணவு வழங்குவாரா என்ற தட்டையான எதிர்கால வினாவாக மொழிபெயர்த்தல்
  rationale: வினாப்பெயர்ச்சொல்லும் சுற்றியுள்ள சங்கீதச் சூழலும், தண்ணீர் வழங்கிய பின்னரும் உணவை வழங்கும் அவருடைய ஆற்றலை மக்கள் சந்தேகித்ததைக் காட்டுகின்றன. வினா வடிவம் அந்த இறையியல் பதற்றத்தைத் தீர்க்காமல் காக்கிறது.
- issue: אִם மூலம் இணைக்கப்பட்ட இறுதி உறுப்புகளின் உறவு
  choice: ‘அப்பமும்... இறைச்சியையும்...’ என ஒரே சந்தேகத்தின் இணையான இரு வினாப்பகுதிகளாகக் காட்டுதல்
  alternative: ‘அப்பமா அல்லது இறைச்சியா’ என்ற ஒன்றை ஒன்று விலக்கும் தேர்வாகக் காட்டுதல்
  rationale: சூழலில் மக்கள் இருவகை உணவையும் வழங்கும் திறனைச் சவால் செய்கின்றனர்; ஒன்றை மட்டும் தேர்ந்தெடுக்கும் மாற்றாக வாசிப்பது பொருத்தமில்லை. இருப்பினும் மூலத்தின் இரு வினைச்சொற்கள்—‘கொடு’, ‘ஆயத்தப்படுத்து’—தனித்தனியாகப் பாதுகாக்கப்பட்டுள்ளன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைக் கொண்டது. ‘இதோ’ என்ற வேதாகமச் சுட்டுச்சொல் இயல்பாகத் தக்கவைக்கப்பட்டது; நீரின் பெருக்கை உயிரோட்டமாகச் சொன்னாலும் மூலத்தை மீறி மிகைப்படுத்தவில்லை. இறுதியில் உள்ள இரட்டை வினா மக்களின் சந்தேகத் தொனியைத் தெளிவாகக் காக்கிறது.
