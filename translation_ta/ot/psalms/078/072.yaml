  text: So he shepherded them with integrity of heart[b][a], and guided them with the skill of his hands.
translation:
  language: ta
  text: அவர் தம் இதயத்தின் நேர்மையோடு[a] அவர்களை மேய்த்தார்; தம் கைகளின் திறமையால்[b] அவர்களை வழிநடத்தினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தம் இதயத்தின் நேர்மைக்கு ஏற்ப.’
    reason: lexical_alternative
  - marker: b
    text: சொல்லர்த்தமாக, ‘தம் கைகளின் விவேகங்களால்’; அதாவது, தமது தலைமைப் பொறுப்பில் திறமையான பகுத்தறிவுடன்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְעֵם
  choice: அவர்களை மேய்த்து
  rationale: רעה என்பதன் மேய்ப்பர் உருவகத்தை நேரடியாகத் தக்கவைக்கிறது. சூழலில் தாவீதின் அரசாட்சி மேய்ப்புப் பணியாகச் சித்தரிக்கப்படுவதால், பொதுவான ‘பராமரித்தார்’ அல்லது ‘நடத்தினார்’ என்பதைக் காட்டிலும் இது பொருத்தமானது.
- source_word: כְּתֹם לְבָבוֹ
  choice: தம் இதயத்தின் நேர்மையோடு
  rationale: תֹם குறிக்கும் முழுமை, குற்றமின்மை, நேர்மை ஆகிய நுண்பொருள்களில் இச்சூழலுக்குரிய ஒழுக்க ஒருமைப்பாட்டை ‘நேர்மை’ இயல்பாக வெளிப்படுத்துகிறது; לֵבָב என்பதன் ‘இதயம்’ உருவகமும் காக்கப்படுகிறது.
- source_word: וּבִתְבוּנוֹת כַּפָּיו
  choice: தம் கைகளின் திறமையால்
  rationale: תְּבוּנָה என்பது புரிதல், விவேகம், நடைமுறை நுண்ணறிவு ஆகியவற்றைக் குறிக்கும். ‘கைகள்’ என்பதுடன் வரும்போது செயலாற்றும் திறமை முன்னிலைப்படுவதால், உடல் உருவகத்தைத் தக்கவைத்தபடி இவ்வாறு மொழிபெயர்க்கப்படுகிறது.
- source_word: יַנְחֵם
  choice: அவர்களை வழிநடத்தினார்
  rationale: נחה என்பதன் ஹிபில் வடிவம் வழிகாட்டுதல் அல்லது நடத்துதலைக் குறிக்கிறது. முந்தைய மேய்ப்பர் உருவகத்துடன் இணைந்து ஞானமான தலைமையை வெளிப்படுத்த ‘வழிநடத்தினார்’ பொருத்தமானது.
theological_decisions:
- issue: தாவீதைக் குறிக்கும் அரச மேய்ப்பர் உருவகம்
  choice: முதன்மை உரையில் ‘மேய்த்து’ என்ற வெளிப்படையான மேய்ப்பர் மொழியைத் தக்கவைத்தல்
  alternative: ‘பராமரித்து’ அல்லது ‘நடத்தி’ போன்ற பொதுவான சொல்லைப் பயன்படுத்துதல்
  rationale: இந்த வசனம் தாவீதை ஆண்டவரால் தேர்ந்தெடுக்கப்பட்ட மேய்ப்பர்-அரசனாகச் சித்தரிக்கும் சங்கீதப் பகுதியை நிறைவு செய்கிறது. பிற்கால மேசியானிய கருத்துகளை வசனத்துக்குள் சேர்க்காமல், அரசாட்சியை மேய்ப்புப் பொறுப்பாகக் காட்டும் மூல உருவகத்தை இது பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் மரியாதையுடனும் அமைக்கப்பட்டுள்ளது. ‘இதயம்’, ‘மேய்த்து’, ‘கைகள்’ ஆகிய மூல உருவகங்கள் பாதுகாக்கப்பட்டுள்ளன; ‘அவர்/தம்’ வடிவங்கள் தாவீதைக் குறிக்க இயல்பான மரியாதை நடையில் பயன்படுத்தப்பட்டுள்ளன.
