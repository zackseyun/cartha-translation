lexical_decisions:
- source_word: וַיְגָרֶשׁ מִפְּנֵיהֶם גּוֹיִם
  choice: அவர்கள் முன்னிலையிலிருந்து பிற இனத்தாரை அவர் துரத்திவிட்டு
  rationale: גרש என்பதன் வலுவான அகற்றும் பொருளை ‘துரத்திவிட்டு’ இயல்பாகத் தருகிறது. מִפְּנֵיהֶם என்பதன் ‘அவர்கள் முன்னிலையிலிருந்து’ என்ற இடஞ்சார்ந்த உறவும் காக்கப்படுகிறது; גּוֹיִם இச்சூழலில் கானானில் வாழ்ந்த பிற இன மக்களைக் குறிக்கிறது.
- source_word: וַיַּפִּילֵם בְּחֶבֶל נַחֲלָה
  choice: அவர்களுடைய நிலத்தை அளவுநூலால் சுதந்தரப் பங்காகப் பகிர்ந்தளித்தார்
  rationale: נפל இங்கு பங்கு ஒதுக்கீட்டைக் குறிக்கும் வழக்குச் சொல்; חבל நிலத்தை அளந்து பிரிக்கும் நூலின் உருவகத்தைத் தருகிறது; נחלה தலைமுறை உரிமையாகக் கிடைக்கும் நிலப்பங்கைக் குறிக்கிறது. எபிரெயச் சுட்டுப்பெயர் நேரடியாக ‘அவர்களை/அவற்றை’ என இருந்தாலும், சூழலில் பிற இனத்தாரின் நிலப்பரப்பே பகிர்ந்தளிக்கப்பட்ட பொருளாக இருப்பதால் ‘அவர்களுடைய நிலத்தை’ எனத் தெளிவுபடுத்தப்பட்டுள்ளது; இதற்கான நேரடி வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וַיַּשְׁכֵּן
  choice: குடியேற்றினார்
  rationale: שכן என்பதன் ஹிஃபில் வடிவம் ‘குடியிருக்கச் செய்தார்’ என்ற காரணவினைப் பொருளுடையது. ‘குடியேற்றினார்’ நவீனத் தமிழில் இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: בְּאָהֳלֵיהֶם
  choice: அந்த இனத்தாரின் கூடாரங்களில்
  rationale: אֹהֶל என்பதன் நேரடிப் பொருளான ‘கூடாரம்’ காக்கப்படுகிறது. பன்மை ஆண்பால் சுட்டுப்பெயரின் இயல்பான முன்னிலைச் சொல் துரத்தப்பட்ட பிற இனத்தார் என்பதால் தமிழில் அது வெளிப்படையாகச் சொல்லப்பட்டுள்ளது.
- source_word: שִׁבְטֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கோத்திரங்கள்
  rationale: இஸ்ரவேல் மக்களின் பழங்குடிப் பிரிவுகளைக் குறிக்கும் மரபான, புரிந்துகொள்ளத்தக்க வேதாகமத் தமிழ் சொல் ‘கோத்திரங்கள்’ ஆகும்.
theological_decisions:
- issue: வெற்றிகொள்ளுதலிலும் குடியேற்றத்திலும் செயல்படுபவர்
  choice: இனத்தாரைத் துரத்தி, நிலத்தைப் பகிர்ந்து, இஸ்ரவேல் கோத்திரங்களைக் குடியேற்றுபவர் கடவுளே என்ற தொடர்ச்சியான ஒரே எழுவாய் காக்கப்பட்டது.
  alternative: இஸ்ரவேலரே நிலத்தை வென்று பகிர்ந்துகொண்டதாகச் செயப்படுவோரை மாற்றிக் கூறுதல்.
  rationale: சங்கீதத்தின் சூழலும் இவ்வசனத்தின் தொடர்ச்சியான மூன்றாம் நபர் ஒருமை வினைகளும் கடவுளின் செயலை எடுத்துரைக்கின்றன. அதற்கு அப்பாற்பட்ட இறையியல் விளக்கம் சேர்க்கப்படவில்லை.
- issue: וַיַּפִּילֵם என்ற சொல்லிலுள்ள சுட்டுப்பெயரின் தொடர்பு
  choice: துரத்தப்பட்ட இனத்தாரின் நிலப்பரப்பைச் சுதந்தரப் பங்காகப் பகிர்ந்தளித்தார் எனச் சூழலுக்கேற்ற பொருள் முதன்மை உரையில் தரப்பட்டது; எபிரெயின் நேரடி அமைப்பு அடிக்குறிப்பில் வைக்கப்பட்டது.
  alternative: ‘அவர்களைச் சுதந்தரப் பங்காக அளவுநூலால் விழச் செய்தார்’ என்று சொற்சொல்லாக மொழிபெயர்த்தல்.
  rationale: நிலப் பங்கீட்டுச் சூழலில் נפל ஒரு பங்கு ஒதுக்கப்படுவதைக் குறிக்கும். ஆயினும் எபிரெயில் ‘நிலம்’ வெளிப்படையாக இல்லை என்பதால் அந்தத் தகவல் மறைக்கப்படாமல் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் சங்கீதத்துக்குரிய கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘அளவுநூல்,’ ‘சுதந்தரப் பங்கு,’ ‘கோத்திரங்கள்’ ஆகியவை நிலப்பங்கீடு மற்றும் இஸ்ரவேலின் பழங்குடி அமைப்பைத் துல்லியமாகக் காட்டுகின்றன. அரைப்புள்ளி இரண்டு இணைச் செயல்தொடர்களைப் பிரிக்கிறது.
