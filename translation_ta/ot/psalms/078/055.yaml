revisions:
- from: அவர்கள் முன்னிலையிலிருந்து பிற இனத்தாரை அவர் துரத்திவிட்டு, அவர்களுடைய நிலத்தை அளவுநூலால் சுதந்தரப் பங்காகப் பகிர்ந்தளித்தார்[a]; அந்த இனத்தாரின் கூடாரங்களில் இஸ்ரவேலின் கோத்திரங்களைக் குடியேற்றினார்[b].
  to: அவர்களுக்கு முன்பாக இருந்த பிற இனத்தவரை அவர் துரத்தி, அவர்களுக்கு அளவுநூலால் ஒரு சுதந்தரப் பங்கை ஒதுக்கினார்[a]; அந்த இனத்தாரின் கூடாரங்களில் இஸ்ரவேலின் கோத்திரங்களைக் குடியேற்றினார்[b].
  rationale: The revision removes an avoidable added possessive (‘their land’) and represents the Hebrew land-allotment idiom with Israel as the recipient of an inherited portion. It also corrects the explanatory footnote, while preserving the contextual reference of ‘their tents’ to the expelled nations and maintaining the verse's historical description without further interpretation.
