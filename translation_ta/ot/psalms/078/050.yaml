  source_fidelity: 'கருத்து முழுவதும் எபிரெய மூலத்துக்கு உண்மையாக உள்ளது: இறைக் கோபத்திற்கான பாதை, மரணத்திலிருந்து உயிரைக் காப்பாற்றாமை, கொள்ளைநோய்க்கு ஒப்புக்கொடுத்தல் ஆகிய இணைவரிகள் தக்கவைக்கப்பட்டுள்ளன. ஆனால் לֹא חָשַׂךְ என்ற முடிவுற்ற மறுப்புவினையைத் தமிழிலும் நேரடியான முடிவுற்ற வினையாகத் தருவது சிறந்தது.'
  naturalness: ‘மரணத்திலிருந்து காக்காமல் ... ஒப்புக்கொடுத்தார்’ புரியக்கூடியதே; ஆயினும் அது மூலத்தின் தனித்த மறுப்புக் கூற்றை ஒரு வினையெச்சத் தொடராக மாற்றுகிறது. ‘மரணத்திலிருந்து காப்பாற்றவில்லை’ என்பது நவீன தரத் தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது. ‘பாதையைச் சமப்படுத்தினார்’ என்பது யְפַלֵּס-இன் குறிப்பான உருவகத்தை ‘செப்பனிட்டார்’ என்பதைக் காட்டிலும் நேரடியாகக் காட்டுகிறது.
