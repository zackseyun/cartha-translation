source:
  edition: WLC
  text: יְפַלֵּ֥ס נָתִ֗יב לְ/אַ֫פּ֥/וֹ לֹא חָשַׂ֣ךְ מִ/מָּ֣וֶת נַפְשָׁ֑/ם וְ֝/חַיָּתָ֗/ם לַ/דֶּ֥בֶר הִסְגִּֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/050.yaml
  text: He leveled a path for his anger[a]; he did not spare their soul from death[c][b], but gave over their life to the plague.
translation:
  language: ta
  text: அவர் தமது கோபத்துக்கு ஒரு பாதையைச் சமப்படுத்தினார்[a]; அவர்களுடைய உயிரை[b] மரணத்திலிருந்து காப்பாற்றவில்லை; அவர்களுடைய வாழ்வைக் கொள்ளைநோயிடம் ஒப்புக்கொடுத்தார்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தமது சினத்துக்கு ஒரு வழியை ஏற்படுத்தினார்.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “அவர்களுடைய ஆத்துமா”; இங்கே அது அவர்களுடைய உயிரைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “கொடிய தொற்றுநோயிடம்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְפַלֵּס
  choice: செப்பனிட்டார்
  rationale: பியேல் வினைச்சொல் ஒரு பாதையைச் சமப்படுத்துதல் அல்லது செல்லத் தக்கதாக ஆயத்தப்படுத்துதல் என்ற உருவகத்தைத் தருகிறது. ‘செப்பனிட்டார்’ அந்தக் காட்சியையும் இயல்பான தமிழையும் காக்கிறது.
- source_word: נָתִיב
  choice: ஒரு பாதை
  rationale: இந்தச் சொல் வழி அல்லது தடத்தைக் குறிக்கிறது; கோபம் செல்ல வழி அமைக்கும் கவிதை உருவகத்திற்கு ‘பாதை’ பொருத்தமானது.
- source_word: לְאַפּוֹ
  choice: தமது கோபத்துக்கு
  rationale: אַף என்பதன் சொற்பொருள் ‘மூக்கு’ என்றாலும், இங்கு அது வழக்காகக் ‘கோபம்’ என்பதைக் குறிக்கிறது. மூன்றாம் நபர் மரியாதைத் தொடர்ச்சிக்காக ‘தமது’ பயன்படுத்தப்பட்டது.
- source_word: לֹא חָשַׂךְ מִמָּוֶת
  choice: மரணத்திலிருந்து காக்காமல்
  rationale: இந்த அமைப்பு மரணத்திலிருந்து விலக்கி வைக்கவில்லை அல்லது தப்பவிடவில்லை என்ற பொருளுடையது. தமிழ் வாக்கியத்தில் ‘காக்காமல்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: נַפְשָׁם
  choice: அவர்களுடைய உயிரை
  rationale: נֶפֶשׁ இங்கு உடலற்ற ஆத்துமாவைத் தனிப்படக் குறிக்காமல், மரணத்துக்குட்படும் உயிரைக் குறிக்கிறது. ‘உயிர்’ அந்தச் சூழற்பொருளைத் தருகிறது.
- source_word: וְחַיָּתָם
  choice: அவர்களுடைய வாழ்வை
  rationale: இச்சொல் அவர்களுடைய உயிருள்ள நிலை அல்லது வாழ்வைக் குறிக்கிறது. முந்தைய ‘உயிர்’ என்பதுடன் உள்ள இணை அமைப்பைத் தக்கவைத்தபடியே தமிழில் தேவையற்ற ஒரேசொல் மீளுரைப்பைத் தவிர்க்க ‘வாழ்வு’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: לַדֶּבֶר
  choice: கொள்ளைநோயிடம்
  rationale: דֶּבֶר என்பது தீர்ப்புச் சூழல்களில் கொடிய தொற்றுநோய் அல்லது கொள்ளைநோயைக் குறிக்கிறது. ‘கொள்ளைநோய்’ dignified biblical Tamil while still understandable in modern standard Tamil.
- source_word: הִסְגִּיר
  choice: ஒப்புக்கொடுத்தார்
  rationale: ஹிஃபில் வடிவம் ஒருவரை அல்லது ஒன்றை வேறொன்றின் அதிகாரத்திற்குக் கொடுத்துவிடுதல் என்ற பொருளைத் தருகிறது. ‘ஒப்புக்கொடுத்தார்’ செயற்பாட்டையும் தீர்ப்பின் வலிமையையும் காக்கிறது.
theological_decisions:
- issue: இறைக் கோபம் பாதையில் செல்வதுபோன்ற உருவகம்
  choice: ‘தமது கோபத்துக்கு ஒரு பாதையைச் செப்பனிட்டார்’ என்று உருவகத்தை அப்படியே தக்கவைத்தல்
  alternative: ‘தமது கோபத்தைத் தடையின்றி வெளிப்படுத்தினார்’ என்று கருத்தை மட்டும் கூறுதல்
  rationale: எபிரெயக் கவிதையின் உயிருள்ள மனிதவடிவ உருவகத்தை மென்மைப்படுத்தாமலும், அதற்கு மேலான கோட்பாட்டுக் கருத்தைச் சேர்க்காமலும் மொழிபெயர்க்கிறது.
- issue: נֶפֶשׁ என்பதன் பொருள்
  choice: ‘உயிர்’
  alternative: ‘ஆத்துமா’
  rationale: மரணம் மற்றும் கொள்ளைநோய் பற்றிய இச்சூழலில் இச்சொல் மனிதரின் மரணத்துக்குட்படும் உயிரையே குறிக்கிறது; ‘ஆத்துமா’ என்பது மூலத்தில் கட்டாயப்படுத்தப்படாத பிற்கால மெய்யியல் வேறுபாட்டை உண்டாக்கக்கூடும்.
- issue: நியாயத்தீர்ப்பில் இறைவனின் செயற்பாடு
  choice: ‘கொள்ளைநோயிடம் ஒப்புக்கொடுத்தார்’ என்ற நேரடி செயற்பாட்டைத் தக்கவைத்தல்
  alternative: ‘கொள்ளைநோய் அவர்களைத் தாக்க அனுமதித்தார்’
  rationale: הִסְגִּיר இறைவனின் செயற்பாட்டைத் தெளிவாகக் கூறுகிறது. ‘அனுமதித்தார்’ என்று மாற்றுவது மூலத்தில் இல்லாத இறையியல் மென்மைப்படுத்தலைச் சேர்க்கும்.
translation_notes:
  register: நவீன தரத் தமிழில் எளிதில் புரியக்கூடிய, ஆனால் சங்கீதக் கவிதைக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘செப்பனிட்டார்’ பாதையைச் சமப்படுத்தி ஆயத்தப்படுத்தும் மூல உருவகத்தைத் தக்கவைக்கிறது. ‘உயிர்/வாழ்வு’ என்ற இணைச் சொற்கள் எபிரெய இணை அமைப்பை இயல்பான தமிழில் பிரதிபலிக்கின்றன.
