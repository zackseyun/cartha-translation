  text: שָׁמַ֣ע אֱ֭לֹהִים וַֽ/יִּתְעַבָּ֑ר וַ/יִּמְאַ֥ס מְ֝אֹ֗ד בְּ/יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/059.yaml
  text: God heard and was furious[b][a], and he utterly rejected Israel.
translation:
  language: ta
  text: கடவுள் கேட்டுக் கடும் சினமடைந்தார்[a]; இஸ்ரவேலை முற்றிலும் நிராகரித்தார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கோபத்தால் கொதித்தார்.’ எபிரெய வினைச்சொல் கடுங்கோபமடைதல் அல்லது சினம் தூண்டப்படுதல் என்ற பொருளை வெளிப்படுத்தலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘ஒதுக்கித் தள்ளினார்’ அல்லது ‘வெறுத்தார்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַע
  choice: கேட்டுக்
  rationale: எபிரெய வினைச்சொல்லின் இயல்பான பொருள் ‘கேட்டார்.’ இங்கு முன்பு விவரிக்கப்பட்ட இஸ்ரவேலின் நடத்தையைக் கடவுள் கேட்டறிந்ததைத் தொடர்ந்து அவரது எதிர்வினை வருகிறது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: வடிவில் பன்மையாக இருந்தாலும், இங்கு ஒருமை வினைப் பொருளுடன் இஸ்ரவேலின் கடவுளைக் குறிக்கிறது. நவீன பொதுத் தமிழில் ‘கடவுள்’ இயல்பான மொழிபெயர்ப்பு.
- source_word: וַיִּתְעַבָּר
  choice: கடும் சினமடைந்தார்
  rationale: Hitpael வடிவிலுள்ள עבר இங்கு கடுமையாகக் கோபமடைதல் அல்லது சினம் தூண்டப்படுதல் என்ற வலுவான உணர்வைத் தருகிறது. ‘கடும் சினமடைந்தார்’ அந்த வலிமையை இயல்பான, கண்ணியமான தமிழில் காக்கிறது.
- source_word: וַיִּמְאַס
  choice: நிராகரித்தார்
  rationale: מאס என்பது நிராகரித்தல், ஒதுக்கித் தள்ளுதல் அல்லது வெறுத்தல் என்று பொருள்படலாம். இச்சூழலில் ‘நிராகரித்தார்’ செயற்பூர்வமான புறக்கணிப்பையும் உடன்படிக்கைத் தீர்ப்பின் தீவிரத்தையும் தெளிவாகத் தெரிவிக்கிறது.
- source_word: מְאֹד
  choice: முற்றிலும்
  rationale: இந்த வினையடை நிராகரிப்பைத் தீவிரப்படுத்துகிறது. ‘முற்றிலும் நிராகரித்தார்’ என்பது ‘மிகவும் நிராகரித்தார்’ என்பதைவிட இயல்பான தமிழாகவும் எபிரெயச் சொல்லின் வலிமையைத் தக்கவைப்பதாகவும் உள்ளது.
- source_word: בְּיִשְׂרָאֵל
  choice: இஸ்ரவேலை
  rationale: בְּ இங்கு מאס வினையின் இலக்கைக் குறிக்கிறது. தமிழில் அதை நேரடி செயப்படுபொருளாக ‘இஸ்ரவேலை’ என்று மொழிபெயர்ப்பது தெளிவும் இயல்பும் உடையது.
theological_decisions:
- issue: கடவுளின் கோபத்தையும் நிராகரிப்பையும் மனித உணர்வுச் சொற்களால் விவரித்தல்
  choice: ‘கடும் சினமடைந்தார்’ என்றும் ‘முற்றிலும் நிராகரித்தார்’ என்றும் உள்ள வலுவான தனிப்பட்ட மொழியைத் தக்கவைத்தல்
  alternative: ‘மனவருத்தமடைந்தார்’ அல்லது ‘தயவை விலக்கினார்’ என்று மென்மைப்படுத்துதல்
  rationale: எபிரெய மூலவாக்கியம் உடன்படிக்கைத் தீர்ப்பைக் குறிக்கும் வலுவான மொழியைப் பயன்படுத்துகிறது. அதன் இறையியல் அழுத்தத்தையும் பதற்றத்தையும் மென்மைப்படுத்தாமல் மொழிபெயர்ப்பது அவசியம்.
translation_notes:
  register: நவீன பொதுத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘சினமடைந்தார்’ மற்றும் ‘நிராகரித்தார்’ ஆகிய சொற்கள் மூலத்தின் வலிமையை மென்மைப்படுத்தாமல் வாசிக்க எளிய முறையில் தருகின்றன; தொடர்புடைய அடிக்குறிப்பு குறிகள் உரையில் அந்தந்த சொல்லுக்குப் பின்னர் இடப்பட்டுள்ளன.
