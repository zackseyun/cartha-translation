lexical_decisions:
- source_word: וַיְדַבְּרוּ
  choice: பேசினார்கள்
  rationale: דבר என்ற வினைச்சொல்லின் வழக்கமான கதைநடைப் பொருளை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: בֵּאלֹהִים
  choice: கடவுளுக்கு எதிராக
  rationale: דבר உடன் வரும் ב இச்சூழலில் எதிர்ப்பான பொருளைக் கொள்ளலாம்; சங்கீதத்தின் கலகமும் குறைகூறலும் நிறைந்த பின்னணி இதை ஆதரிக்கிறது.
- source_word: אָמְרוּ
  choice: என்று கேட்டார்கள்
  rationale: எபிரெயத்தில் இது பொதுவாக ‘அவர்கள் சொன்னார்கள்’ என்றாலும், தொடர்ந்து வருவது நேரடிக் கேள்வி என்பதால் தமிழில் ‘என்று கேட்டார்கள்’ என்பது இயல்பாகவும் அதன் பேச்சுச் செயலைத் துல்லியமாகவும் வெளிப்படுத்துகிறது.
- source_word: הֲיוּכַל
  choice: முடியுமா
  rationale: வினாத்துகளுடன் கூடிய יכל திறனைச் சவாலிடும் கேள்வியை வெளிப்படுத்துகிறது; ‘முடியுமா’ அதனைச் சுருக்கமாகத் தருகிறது.
- source_word: אֵל
  choice: கடவுள்
  rationale: இங்கு אֵל என்பது אֱלֹהִים என்பதற்கு இணையான தெய்வப் பெயராக வருகிறது; ‘வல்லவர்’ என்பது மூலத்தில் உள்ளதைவிட வல்லமையை அதிகமாக விளக்கிவிடும்.
- source_word: לַעֲרֹךְ
  choice: ஆயத்தப்படுத்த
  rationale: ערך + שֻׁלְחָן என்பது பந்தியை ஒழுங்குபடுத்தி ஆயத்தம் செய்வதைக் குறிக்கிறது; உணவு வழங்கும் உட்பொருளையும் காட்சியுருவையும் காக்கிறது.
- source_word: שֻׁלְחָן
  choice: ஒரு பந்தி
  rationale: இங்கு மேசை என்ற பொருள் உணவு பரிமாறுவதற்காக ஆயத்தமான பந்தியை உருவகப்படுத்துகிறது; ‘பந்தி’ நவீனத் தமிழில் அந்தக் காட்சியையும் உணவு வழங்கும் பொருளையும் இயல்பாகத் தருகிறது.
- source_word: בַּמִּדְבָּר
  choice: வனாந்தரத்தில்
  rationale: מִדְבָּר என்பது இஸ்ரவேலரின் பயணத்தோடு தொடர்புடைய குடியிருப்பற்ற வறண்ட நிலப்பகுதியைக் குறிக்கிறது; ‘வனாந்தரம்’ அதை வெறும் மணற்பாலைவனமாகக் குறுக்காமல் காக்கிறது.
theological_decisions:
- issue: கடவுளைப் பற்றிய இஸ்ரவேலரின் பேச்சின் தொனி
  choice: ‘கடவுளுக்கு எதிராக’ என்று மொழிபெயர்த்தல்
  alternative: ‘கடவுளைப் பற்றிப்’ என்று மொழிபெயர்த்தல்
  rationale: இச்சங்கீதப் பகுதி இஸ்ரவேலரின் நம்பிக்கையின்மையையும் எதிர்ப்பையும் விவரிக்கிறது. எனவே எதிர்ப்பான பொருள் சூழலுக்கு ஏற்றது; ஆயினும் எபிரெய முன்னிடைச்சொல் நடுநிலையாகவும் புரிந்துகொள்ளப்படலாம் என்பதால் அது அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. ‘பந்தி’ என்பது மூலத்தின் ‘மேசை’ என்ற உறுதியான காட்சியையும் உணவு வழங்கும் உட்பொருளையும் இணைக்கிறது; ‘வனாந்தரம்’ வரலாற்று-வேதாகமச் சூழலைக் காக்கிறது.
