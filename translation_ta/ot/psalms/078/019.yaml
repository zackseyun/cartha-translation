  text: அவர்கள் கடவுளுக்கு எதிராகப் பேசினார்கள்; “வனாந்தரத்தில் கடவுள் ஒரு மேசையை அமைக்க முடியுமா?” என்று சொன்னார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள் கடவுளைப் பற்றிப் பேசினார்கள்.” எபிரெயச் சொற்றொடரை நடுநிலையாகவும் மொழிபெயர்க்கலாம்; ஆனால் இங்கு சூழல் எதிர்ப்பான பொருளை ஆதரிக்கிறது.
