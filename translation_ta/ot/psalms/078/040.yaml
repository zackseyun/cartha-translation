  text: How often they rebelled against him in the wilderness and grieved him in the wasteland![a][b]
translation:
  language: ta
  text: வனாந்தரத்தில் அவர்கள் அவருக்கு எதிராக எத்தனை முறை கலகம் செய்தார்கள்[a]! பாழ்நிலத்தில் அவரைத் துயரப்படுத்தினார்கள்[b]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வனாந்தரத்தில் அவர்கள் அவருக்கு எதிராக எத்தனை தடவைகள் கலகம் செய்தார்கள்!’ தொடக்கச் சொற்றொடர் மீண்டும் மீண்டும் நிகழ்ந்த கலகத்தை வலியுறுத்தலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘பாழ்நிலத்தில் அவரை வேதனைப்படுத்தினார்கள்’ அல்லது ‘அவருக்கு மனவருத்தம் உண்டாக்கினார்கள்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּמָּה
  choice: எத்தனை முறை
  rationale: இங்கு எண்ணிக்கையைக் கேட்பதைவிட, மீண்டும் மீண்டும் நிகழ்ந்த கலகத்தை வியப்பும் வேதனையும் கலந்த தொனியில் சுட்டுகிறது.
- source_word: יַמְרוּהוּ
  choice: அவர்கள் அவருக்கு எதிராகக் கலகம் செய்தார்கள்
  rationale: מרה என்பதன் மையக் கருத்தான எதிர்ப்பையும் கீழ்ப்படியாமையையும் தெளிவாக வெளிப்படுத்துகிறது; வெறுமனே ‘கோபமூட்டினார்கள்’ என்று பொருளை விரிவுபடுத்தவில்லை.
- source_word: בַמִּדְבָּר
  choice: வனாந்தரத்தில்
  rationale: இஸ்ரவேலரின் அலைந்து திரிந்த வறண்ட, குடியிருப்பற்ற நிலப்பகுதியைக் குறிக்கும் வேதாகமப் புவியியல் நயத்தைப் பேணுகிறது.
- source_word: יַעֲצִיבוּהוּ
  choice: அவரை எவ்வளவாய்த் துயரப்படுத்தினார்கள்
  rationale: עצב என்ற வினையின் வேதனை, துயரம், மனவருத்தம் ஆகிய உறவுசார் உணர்வை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בִּישִׁימוֹן
  choice: பாழ்நிலத்தில்
  rationale: வெறுமையும் பாழ்மையும் நிறைந்த நிலத்தைக் குறிக்கிறது; முந்தைய מִדְבָּר என்பதிலிருந்து வேறுபாட்டைப் பேணியபடியே கவிதை இணைநிலையைத் தக்கவைக்கிறது.
theological_decisions:
- issue: יַעֲצִיבוּהוּ என்பதில் கடவுளுக்குக் கூறப்படும் உணர்வுசார் மொழி
  choice: ‘அவரை ... துயரப்படுத்தினார்கள்’ என்ற தனிப்பட்ட, உணர்வுசார் சொல்லாட்சியை முதன்மை உரையில் தக்கவைத்தல்
  alternative: ‘அவருக்கு எரிச்சலூட்டினார்கள்’ அல்லது ‘அவரை வேதனைப்படுத்தினார்கள்’
  rationale: இஸ்ரவேலரின் செயல்கள் கடவுளுக்கு ஏற்படுத்திய உண்மையான உறவுசார் மனவருத்தத்தை எபிரெய உரை மனித உணர்வு மொழியில் கூறுகிறது. அந்த இறையியல் பதற்றத்தை உயிரற்ற ‘அவரைத் தூண்டினார்கள்’ போன்ற சொல்லால் சமப்படுத்தாமல் அப்படியே பேணுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘வனாந்தரம்’ மற்றும் ‘பாழ்நிலம்’ மூலம் இணையான இரு எபிரெய நிலச்சொற்களின் நுட்ப வேறுபாடு பேணப்பட்டுள்ளது. இரு இணை அடிகளிலும் வியப்பு-புலம்பல் தொனியைத் தெளிவாக்க வியப்புக்குறிகள் பயன்படுத்தப்பட்டுள்ளன.
