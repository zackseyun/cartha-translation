- issue: יָקֻמוּ என்பதன் பொருள்
  choice: ‘அவர்கள் எழுந்து’ என்று உயிரோட்டத்தைத் தக்கவைத்தல்
  alternative: ‘அவர்கள் வளர்ந்து’ அல்லது வெறுமனே ‘அவர்கள்’
  rationale: மூலத்தின் ‘எழுதல்’ என்ற உருவகச் செயற்பாட்டைத் தீர்த்துவிடாமல், புதிய தலைமுறை செயல்பட்டு எடுத்துரைப்பதை வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘பிற்காலத் தலைமுறை’ என்பது இறுதிக்காலப் பொருளைத் தேவையின்றி ஏற்றாமல் மூலத்தின் காலத் தொடர்பைக் காக்கிறது. தமிழில் வசனம் தனித்து வாசிக்கத் தெளிவாக இருக்க, சூழலில் முன் கூறப்பட்ட ஏற்பாட்டைச் சுட்டும் ‘இவ்வாறு செய்தார்’ இறுதியில் வழங்கப்பட்டுள்ளது.
