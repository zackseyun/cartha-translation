revisions:
- from: அவர்கள் அவருடைய செயல்களையும், அவர் தங்களுக்குக் காட்டிய அதிசயச் செயல்களையும் மறந்துவிட்டார்கள்.
  to: அவர்கள் அவருடைய செயல்களையும், அவர் அவர்களுக்குக் காட்டிய அதிசயங்களையும் மறந்தார்கள்.
  rationale: The revision retains the verse’s meaning and divine referent while using more idiomatic modern Tamil and preserving the Hebrew distinction between God’s deeds and his wonders. No footnotes are required for this concise verse.
