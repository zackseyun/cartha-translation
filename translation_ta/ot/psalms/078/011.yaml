translation:
  language: ta
  text: அவர்கள் அவருடைய செயல்களையும், அவர் அவர்களுக்குக் காட்டிய அதிசயங்களையும் மறந்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁכְּחוּ
  choice: மறந்துவிட்டார்கள்
  rationale: שׁכח என்பதன் Qal wayyiqtol 3mp வடிவம் கடந்தகாலத் தொடர் நிகழ்வைக் குறிக்கிறது. ‘மறந்துவிட்டார்கள்’ என்பது அதன் நேரடியான இயல்பான தமிழ் பொருள்; ‘புறக்கணித்தார்கள்’ என்பது தேவைக்கு மீறிய விளக்கம்.
- source_word: עֲלִילוֹתָיו
  choice: அவருடைய செயல்கள்
  rationale: עֲלִילוֹת என்பது பொதுவாகச் செய்யப்பட்ட செயல்களைக் குறிக்கிறது. ‘செயல்கள்’ என்பது இறைவனுடைய வரலாற்றுச் செயல்களை இயல்பாகவும் பரந்த பொருளிலும் தெரிவிக்கிறது.
- source_word: וְנִפְלְאוֹתָיו
  choice: அதிசயச் செயல்கள்
  rationale: פלא வேரிலிருந்து வந்த இச்சொல் வியப்பூட்டும் அசாதாரணச் செயல்களைக் குறிக்கிறது. ‘அதிசயச் செயல்கள்’ என்பது ‘அற்புதங்கள்’ என்று பொருளை ஒரு குறிப்பிட்ட வகைக்குள் சுருக்காமல் செயற்பொருளையும் வியப்பையும் காக்கிறது.
- source_word: אֲשֶׁר
  choice: …காட்டிய
  rationale: தொடர்புச் சொல்லைத் தமிழில் இயல்பான பெயரெச்சத் தொடராக அமைத்து, ‘அதிசயச் செயல்களை’ விளக்கும் உறவைத் தெளிவாகப் பேணுகிறது.
- source_word: הֶרְאָם
  choice: அவர் தங்களுக்குக் காட்டிய
  rationale: ראה என்பதன் Hiphil perfect 3ms + 3mp suffix வடிவம் சொல்லுக்கு நெருக்கமாக ‘அவர்களைக் காணச் செய்தார்’ எனப் பொருள்படும்; தமிழில் ‘அவர் தங்களுக்குக் காட்டிய’ என்பது இயல்பான இணை. ‘தங்களுக்கு’ என்பது வாக்கிய எழுவாயான ‘அவர்கள்’ என்பதையே திரும்பச் சுட்டுகிறது.
theological_decisions:
- issue: உடைமைப் பின்னொட்டுகளின் குறிப்பு
  choice: ‘அவருடைய செயல்கள் … அதிசயச் செயல்கள்’ என்பதில் ‘அவர்’ இறைவனைக் குறிக்கிறது.
  alternative: பெயரை வெளிப்படையாகச் சேர்த்து ‘இறைவனுடைய’ என்று மொழிபெயர்த்தல்.
  rationale: சங்கீதத்தின் சூழலில் இஸ்ரவேல் ஆண்டவருடைய செயல்களை மறந்தது கூறப்படுகிறது. ஆயினும் மூலத்தின் பிரதிப்பெயர் வடிவத்தைக் காத்து, சூழல் அளிப்பதைவிடக் கூடுதலாகப் பெயரைச் சேர்க்காமல் ‘அவருடைய’ என மொழிபெயர்க்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. எபிரெயச் சொல்லின் செயற்பொருளைக் காக்க ‘அதிசயச் செயல்கள்’ பயன்படுத்தப்பட்டுள்ளது; தேவையற்ற சமயப் பிரிவு சார்ந்த சொற்கள் தவிர்க்கப்பட்டுள்ளன.
