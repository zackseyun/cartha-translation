source:
  edition: WLC
  text: וְ/אַ֤ף אֱלֹהִ֨ים עָ֘לָ֤ה בָ/הֶ֗ם וַֽ֭/יַּהֲרֹג בְּ/מִשְׁמַנֵּי/הֶ֑ם וּ/בַחוּרֵ֖י יִשְׂרָאֵ֣ל הִכְרִֽיעַ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/031.yaml
  text: Then the anger of God rose against them[a], and he killed the stoutest among them; he struck down the young men of Israel.
translation:
  language: ta
  text: 'அப்போது கடவுளின் கோபம் அவர்களுக்கு எதிராக எழுந்தது;

    அவர்களுள் திடகாத்திரமானவர்களை[a] அவர் கொன்றார்;

    இஸ்ரவேலின் இளைஞர்களை வீழ்த்தினார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில், “அவர்களுடைய கொழுத்தவர்கள்”; இங்கு அவர்களுள் திடகாத்திரமான அல்லது வலிமைமிக்கவர்களைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַף
  choice: அப்போது கடவுளின் கோபம்
  rationale: אַף என்பதன் அடிப்படைப் பொருள் ‘மூக்கு’; இங்கு அது ‘கோபம்’ என்ற மரபுத்தொடர்ப் பொருளில் வருகிறது. וְ narrative progression-ஐ ‘அப்போது’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עָלָה בָהֶם
  choice: அவர்களுக்கு எதிராக எழுந்தது
  rationale: עָלָה உடன் בְ பகைமையாக ஒருவருக்கு எதிராக எழுவதைக் குறிக்கலாம். ‘எழுந்தது’ என்ற மூல உருவகமும் தக்கவைக்கப்படுகிறது.
- source_word: וַיַּהֲרֹג
  choice: அவர் கொன்றார்
  rationale: הרג என்பதன் நேரடியான பொருளை நவீனத் தமிழில் தெளிவாக வழங்குகிறது.
- source_word: בְּמִשְׁמַנֵּיהֶם
  choice: அவர்களிலிருந்த வலிமைமிக்கவர்களை
  rationale: שׁמן சார்ந்த இச்சொல் சொற்படியாக ‘கொழுத்தவர்கள்’ என்று பொருள்பட்டாலும், இச்சூழலில் மக்களிலுள்ள திடகாத்திரமான அல்லது வலிமைமிக்க உறுப்பினர்களைக் குறிப்பதாகத் தெரிகிறது. சொற்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וּבַחוּרֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் வாலிபர்களை
  rationale: בָּחוּר பொதுவாக இளமைப் பருவத்தின் முழு வலிமையிலுள்ள இளம் ஆணைக் குறிக்கிறது; ‘வாலிபர்கள்’ என்பது இயல்பான, கவிதைநடைக்கு ஏற்ற தமிழ்.
- source_word: הִכְרִיעַ
  choice: வீழ்த்தினார்
  rationale: כרע என்பதன் Hiphil வடிவம் ஒருவரை மண்டியிடச் செய்தல் அல்லது கீழே விழச் செய்தல் என்ற கருத்தைக் கொண்டது; இங்கு நீதித்தீர்ப்பில் வீழ்த்துவதைக் குறிக்கிறது.
theological_decisions:
- issue: கடவுளின் கோபத்தை மனித உணர்வின் உருவகத்தில் கூறுதல்
  choice: கடவுளின் கோபம் அவர்களுக்கு எதிராக எழுந்தது
  alternative: கடவுள் அவர்கள்மேல் கோபமடைந்தார்
  rationale: மூல எபிரெய உரை ‘கோபம் எழுந்தது’ என்ற உருவகத்தைப் பயன்படுத்துகிறது. அதை விளக்கவுரையாகத் தட்டையாக்காமல், தமிழில் புரியுமாறு உருவகத்தையே தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதக் கவிதைக்கு ஏற்ற கண்ணியமான நடையும் மூன்று இணை வரிகளின் அமைப்பும் பயன்படுத்தப்பட்டுள்ளன. கடவுளைக் குறிக்கும் வினைகள் மரியாதைப் பன்மையில் தரப்பட்டுள்ளன; மூலத்தின் கடுமையான நீதித்தீர்ப்பு மொழி மென்மையாக்கப்படவில்லை.
