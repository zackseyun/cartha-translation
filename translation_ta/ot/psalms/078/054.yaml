  yaml_path: translation/ot/psalms/078/054.yaml
  text: So he brought them to his holy border[d][c][b][a], this mountain that his right hand acquired.
translation:
  language: ta
  text: அவர் அவர்களைத் தமது புனித நிலப்பகுதிக்கு[a] கொண்டுவந்தார்; அது அவரது வலக்கை கையகப்படுத்திய இந்த மலை[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தமது புனித எல்லைக்கு” அல்லது “தமது பரிசுத்தத்தின் எல்லைக்கு.” எபிரெயச் சொல் எல்லை, வரம்பு, அல்லது நிலப்பகுதி ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “இந்தக் குன்று.” இச்சொற்றொடர் கடவுள் இஸ்ரவேலுக்குக் கொடுத்த மலைப்பகுதியைக் குறிக்கலாம்; பரந்த சூழலில் சீயோனையும் நினைவூட்டலாம்.
    reason: alternative_reading
  - marker: c
    text: அல்லது, “அவரது வலக்கை பெற்றுக்கொண்ட,” “உடைமையாக்கிய,” அல்லது “விலைக்கு வாங்கிய.” இங்கு அந்த வினைச்சொல் கடவுளுடைய வல்லமை உறுதியாகச் சொந்தமாக்கியதை விவரிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבִיאֵם
  choice: இவ்வாறு அவர் அவர்களைக் கொண்டுவந்தார்
  rationale: בוא என்பதன் ஹிஃபில் வடிவம் ‘கொண்டுவருதல்’ என்று பொருள்படும். தொடக்க வாவ், முந்தைய இறைச்செயல்களின் தொடர்ச்சியை இங்கு ‘இவ்வாறு’ என்று இயல்பாகக் காட்டுகிறது.
- source_word: גְּבוּל קָדְשׁוֹ
  choice: தமது புனித எல்லை
  rationale: גְּבוּל என்பது எல்லை, வரம்பு, அல்லது நிலப்பகுதி எனப் பொருள்படலாம். ‘புனித எல்லை’ என்பது எபிரெய வடிவத்தையும் உடைமைத் தொடர்பையும் சுருக்கமாகப் பேணுகிறது; பரந்த நிலப்பகுதி என்ற சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: הַר זֶה
  choice: இந்த மலை
  rationale: சுட்டிக்காட்டும் הַר זֶה என்பதன் நேரடிப் பொருளைப் பேணுகிறது; சீயோன் அல்லது கானானின் மலைநாடு என்று முதன்மை உரையில் குறிப்பிட்டு விளக்கவில்லை.
- source_word: קָנְתָה יְמִינוֹ
  choice: அவரது வலக்கை கைப்பற்றிய
  rationale: קנה இங்கு பெறுதல், உடைமையாக்குதல், அல்லது கைப்பற்றுதல் என்ற பொருள் வரம்பைக் கொண்டது. ‘கைப்பற்றிய’ என்பது வணிகக் கொள்முதல் அல்லது படைத்தல் என்ற கருத்தைத் திணிக்காமல், வலக்கையால் உறுதிசெய்யப்பட்ட உடைமையை இயல்பான தமிழில் தெரிவிக்கிறது; ‘வலக்கை’ எழுவாயாகவே வைக்கப்பட்டுள்ளது.
theological_decisions:
- issue: ‘இந்த மலை’ என்பதன் குறிப்பு
  choice: முதன்மை உரையில் ‘இந்த மலை’ என்ற தெளிவுபடுத்தப்படாத சொற்றொடரைப் பேணுதல்
  alternative: சீயோன்; கானானின் மலைநாடு; இஸ்ரவேலுக்குக் கொடுக்கப்பட்ட மலைப்பகுதி
  rationale: இந்த வசனம் மலையை வெளிப்படையாக அடையாளப்படுத்தவில்லை. சங்கீதத்தின் பரந்த சூழல் வாக்குத்தத்த நாட்டையும் சீயோனையும் நினைவூட்டக்கூடும்; ஆகவே அந்த இறையியல் மற்றும் புவியியல் திறந்தநிலையை மொழிபெயர்ப்பு தீர்த்துவிடவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. இரண்டாம் அரையடி முதலாமதின் இடப்பொருளை விளக்கும் இணைப்பாக இருப்பதை நீண்ட கோடுகள் காட்டுகின்றன. இறைவனை நோக்கிய மரியாதைப் பன்மை தவிர்க்கப்பட்டு, மூலத்தின் ஒருமை மூன்றாம் நபர் வடிவம் இயல்பான தமிழில் பேணப்பட்டுள்ளது.
