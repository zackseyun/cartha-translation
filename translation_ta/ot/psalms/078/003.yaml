  text: 'நாம் கேள்விப்பட்டு அறிந்ததும்,

    நம் முன்னோர்கள் நமக்குச் சொன்னதுமானவை—'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲשֶׁר
  choice: வற்றை
  rationale: முந்தைய வசனத்தில் கூறப்பட்டவற்றைத் தொடர்புபடுத்தும் உறவுப்பெயரின் பொருளைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: שָׁמַעְנוּ וַנֵּדָעֵם
  choice: நாம் கேள்விப்பட்டு அறிந்தவற்றை
  rationale: שמע என்பதைக் ‘கேள்விப்பட்டு’ என்றும் ידע என்பதைக் ‘அறிந்த’ என்றும் வேறுபடுத்தி, இரு வினைகளையும் பாதுகாக்கிறது; ם பின்னொட்டு பன்மைப் பொருளைக் குறிக்கிறது.
- source_word: אֲבוֹתֵינוּ
  choice: நம் தந்தையர்
  rationale: முன்னோர்களைக் குறிக்கக்கூடிய தந்தையர் என்ற மூல உருவகத்தையும் தலைமுறைத் தொடர்பையும் காக்கிறது.
- source_word: סִפְּרוּ לָנוּ
  choice: நமக்குச் சொல்லியவற்றை
  rationale: வாய்மொழியாக எடுத்துரைத்தல் என்ற சூழலுக்கேற்ற இயல்பான தமிழ்; לָנוּ என்பதன் ‘நமக்கு’ பொருளையும் வெளிப்படுத்துகிறது.
