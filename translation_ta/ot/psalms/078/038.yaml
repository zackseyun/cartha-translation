- from: ஆனால் அவரோ இரக்கமுள்ளவர்; அக்கிரமத்திற்குப் பரிகாரம் செய்து[a], அழிக்காமல் இருந்தார். தமது கோபத்தைப் பலமுறை விலக்கிக்கொண்டார்; தமது சீற்றம் முழுவதையும் எழுப்பவில்லை.
  to: ஆனால் அவரோ இரக்கமுள்ளவர்; அக்கிரமத்திற்குப் பரிகாரம் செய்து[a], அழிக்காமல் இருந்தார். தமது கோபத்தைப் பலமுறை திருப்பிக்கொண்டார்; தமது முழுச் சீற்றத்தையும் கிளறிவிடவில்லை.
