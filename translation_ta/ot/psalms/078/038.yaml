  text: וְ/ה֤וּא רַח֨וּם יְכַפֵּ֥ר עָוֺן֮ וְֽ/לֹא יַ֫שְׁחִ֥ית וְ֭/הִרְבָּה לְ/הָשִׁ֣יב אַפּ֑/וֹ וְ/לֹֽא יָ֝עִיר כָּל חֲמָתֽ/וֹ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/038.yaml
  text: But he[a], being compassionate, made atonement for iniquity and did not destroy; he often turned back his anger and did not stir up all his wrath.
translation:
  language: ta
  text: ஆனால் அவரோ இரக்கமுள்ளவர்; அக்கிரமத்திற்குப் பரிகாரம் செய்து[a], அழிக்காமல் இருந்தார். தமது கோபத்தைப் பலமுறை திருப்பிக்கொண்டார்; தமது முழுச் சீற்றத்தையும் கிளறிவிடவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அக்கிரமத்தை மன்னித்து.’ எபிரெய வினைச்சொல் பொதுவாகப் பரிகாரம் செய்வதைக் குறிக்கும் சொல் என்பதால், அதன் தெய்வவியல் நிறையை முதன்மை உரை பாதுகாக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַחוּם
  choice: இரக்கமுள்ளவர்
  rationale: இச்சொல் இரக்கத்தை நிலையான பண்பாகக் குறிப்பிடுகிறது. ‘இரக்கமுள்ளவர்’ என்பது நவீனத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் உள்ளது.
- source_word: יְכַפֵּר
  choice: பரிகாரம் செய்து
  rationale: כפר என்ற வினையின் பீயேல் வடிவம் பொதுவாகப் பரிகாரம் செய்வதைக் குறிக்கிறது. இங்கு சாதாரணமாக ‘மன்னித்து’ என்று மட்டும் மொழிபெயர்க்காமல், எபிரெயச் சொல்லின் பரிகாரத் தெய்வவியல் நிறை பாதுகாக்கப்படுகிறது.
- source_word: עָוֺן
  choice: அக்கிரமம்
  rationale: இச்சொல் அக்கிரமம், குற்றம் அல்லது பாவக்குற்றநிலை ஆகிய பொருள்களைத் தரலாம். இச்சூழலில் ‘அக்கிரமம்’ அதன் அறநெறிசார் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יַשְׁחִית
  choice: அழிக்காமல் இருந்தார்
  rationale: שׁחת என்பதன் ஹிஃபீல் வடிவம் இங்கு அழிவை விளைவிக்கும் நியாயத்தீர்ப்பைக் குறிக்கிறது; ‘அழிக்காமல் இருந்தார்’ என்பது தெளிவான தமிழ்.
- source_word: וְהִרְבָּה
  choice: பலமுறை
  rationale: הִרְבָּה + வினையெச்ச அமைப்பு ஒரு செயலை மீண்டும் மீண்டும் செய்வதைக் குறிக்கிறது. ‘பலமுறை’ அதன் வினையடைப் பொருளை இயல்பாகத் தருகிறது.
- source_word: לְהָשִׁיב אַפּוֹ
  choice: தமது கோபத்தை விலக்கிக்கொண்டார்
  rationale: சொல்லளவில் ‘தமது கோபத்தைத் திருப்புதல்’ என்று பொருள். தமிழில் இயல்பாக இருக்கவும், கோபத்தைப் பின்னுக்கு மாற்றும் உருவகத்தைத் தக்கவைக்கவும் ‘விலக்கிக்கொண்டார்’ என வழங்கப்பட்டுள்ளது.
- source_word: יָעִיר
  choice: எழுப்பவில்லை
  rationale: עור என்பதன் ஹிஃபீல் வடிவம் எழுப்புதல் அல்லது கிளர்த்துதல் என்று பொருள்படும். சீற்றத்தோடு சேர்ந்து ‘எழுப்பவில்லை’ என்பது மூல உருவகத்தைப் பாதுகாக்கிறது.
- source_word: כָּל חֲמָתוֹ
  choice: தமது சீற்றம் முழுவதையும்
  rationale: חֵמָה கடுமையான கோபம் அல்லது சீற்றத்தைக் குறிக்கிறது; כָּל என்பதையும் வெளிப்படையாகப் பாதுகாக்க ‘சீற்றம் முழுவதையும்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: வழிபாட்டுச் சடங்கு நேரடியாகப் பேசப்படாத வரலாற்றுச் சங்கீதத்தில் כפר என்பதன் மொழிபெயர்ப்பு
  choice: அக்கிரமத்திற்குப் பரிகாரம் செய்து
  alternative: அக்கிரமத்தை மன்னித்து
  rationale: இச்சூழலில் ‘மன்னித்து’ என்பது பொருளுக்கு ஏற்றதாக இருக்கக்கூடும்; எனினும் כפר என்பது பரிகாரத்தைக் குறிக்கும் வழக்கமான எபிரெயச் சொல். குறிப்பிட்ட பரிகார முறையை வசனத்துக்குள் சேர்க்காமல் அதன் தெய்வவியல் நிறையைப் பாதுகாக்க முதன்மை உரையில் ‘பரிகாரம் செய்து’ வைக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளக்கூடிய கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. இறைவனைச் சுட்டும் இடங்களில் மரியாதைப் பன்மை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன; மூலத்தின் இரக்கத்துக்கும் நீதிச் சீற்றத்துக்கும் இடையிலான இழுவிசை தீர்த்துவைக்கப்படாமல் தக்கவைக்கப்பட்டுள்ளது.
