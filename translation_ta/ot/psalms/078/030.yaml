  yaml_path: translation/ot/psalms/078/030.yaml
  text: They had not yet turned away from their craving[a]; their food was still in their mouths.
translation:
  language: ta
  text: அவர்கள் தங்கள் வேட்கையிலிருந்து விலகவில்லை[a]; அவர்களுடைய உணவு இன்னும் அவர்களின் வாய்களில் இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள் தங்கள் வேட்கையிலிருந்து அந்நியராகவில்லை.” எபிரெய வினைச்சொல்லை இவ்வாறு இன்னும் சொற்சார்பாக மொழிபெயர்க்கலாம்; ஆனால் சூழலில் அவர்கள் தங்கள் வேட்கையை இன்னும் கைவிடவோ அதிலிருந்து விலகவோ இல்லை என்பதே பெரும்பாலும் கருதப்படும் பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: זָרוּ
  choice: விலகவில்லை
  rationale: זוּר் என்ற வினை இங்கு מִן முன்னிடைச்சொல்லுடன் ‘விலகுதல்’ அல்லது ‘ஒதுங்குதல்’ என்ற பொருளைத் தருகிறது. சூழலில், அவர்கள் தங்கள் மிகுதியான உணவு வேட்கையை இன்னும் கைவிடவில்லை என்பதே இயல்பான பொருள்.
- source_word: מִתַּאֲוָתָם
  choice: தங்கள் வேட்கையிலிருந்து
  rationale: תַּאֲוָה என்பது ஆசை, வேட்கை, பேராவல் ஆகியவற்றைக் குறிக்கலாம். இச்சங்கீதத்தின் உணவுக்கான பேராசைச் சூழலில் ‘வேட்கை’ மிகையான விருப்பத்தைத் தெளிவாகக் காட்டுகிறது; தேவையற்ற பாலியல் நிழற்பொருளையும் தவிர்க்கிறது.
- source_word: עוֹד
  choice: இன்னும்
  rationale: செயல் அல்லது நிலை தொடர்ந்து கொண்டிருந்ததை עוֹד குறிக்கிறது. முதல் அடியில் ‘இன்னும் விலகவில்லை’ என்றும் இரண்டாம் அடியில் உணவு வாய்களில் ‘இன்னும்’ இருந்தது என்றும் காலநிலையின் தொடர்ச்சியை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אָכְלָם
  choice: அவர்களுடைய உணவு
  rationale: אֹכֶל என்பதன் நேரடியான பொருள் ‘உணவு’; கவிதைச் சூழலிலும் இது தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: בְּפִיהֶם
  choice: அவர்களின் வாய்களில்
  rationale: எபிரெயத்தில் பன்மை உருபு இருப்பதால், ஒவ்வொருவரின் வாயையும் குறிக்கும் வகையில் தமிழிலும் ‘வாய்களில்’ எனப் பன்மையில் தரப்பட்டுள்ளது.
