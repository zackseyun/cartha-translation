base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/058.yaml
  text: They provoked him to anger with their high places[c][b][a], and with their carved images they made him jealous.
translation:
  language: ta
  text: 'தங்கள் உயர்ந்த வழிபாட்டுத் தலங்களால்[a] அவர்கள் அவருக்குக் கோபமூட்டினார்கள்;

    தங்கள் செதுக்கப்பட்ட உருவங்களால்[b] அவரைப் பொறாமைப்படச் செய்தார்கள்.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உயர்ந்த வழிபாட்டுத் தலங்கள்’ என்பது உள்ளூர் வழிபாட்டுத் தலங்களைக் குறிக்கிறது; இவை பல சமயங்களில் முறைகேடான வழிபாட்டுடனும் சிலைவழிபாட்டுடனும் தொடர்புடையவையாக இருந்தன.
    reason: cultural_note
  - marker: b
    text: அல்லது, ‘செதுக்கப்பட்ட சிலைகளால்’ அல்லது ‘விக்கிரகங்களால்.’
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘அவருக்குப் பொறாமை உண்டாக்கினார்கள்.’ இங்கு ‘பொறாமை’ என்பது வேறு தெய்வங்களுக்குச் செலுத்தப்பட்ட வழிபாட்டுக்கு எதிரான தேவனுடைய தனிப்பட்ட உரிமையையும் தீவிர பற்றையும் கொண்ட பதிலைக் குறிக்கிறது.
    reason: lexical_and_theological_note
lexical_decisions:
- source_word: וַיַּכְעִיסוּהוּ
  choice: அவர்கள் அவருக்குக் கோபமூட்டினார்கள்
  rationale: 'כעס என்பதன் ஹிஃபில் வடிவிலுள்ள காரணவினைப் பொருளைத் தெளிவாகக் காட்டுகிறது: அவர்கள் வெறுமனே அவரை வருத்தவில்லை, அவருடைய கோபத்தைத் தூண்டினார்கள்.'
- source_word: בְּבָמוֹתָם
  choice: தங்கள் மேடான வழிபாட்டிடங்களால்
  rationale: במות என்பது வழிபாட்டுக்காகப் பயன்படுத்தப்பட்ட உயரமான அல்லது மேடான உள்ளூர் தலங்களைக் குறிக்கிறது. வெறும் ‘மேடுகள்’ என்பதைவிட இச்சொற்றொடர் வழிபாட்டுச் சூழலை நவீன வாசகருக்குத் தெளிவாக்குகிறது; בְּ கருவிப்பொருளில் ‘-ஆல்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וּבִפְסִילֵיהֶם
  choice: தங்கள் செதுக்கப்பட்ட உருவங்களால்
  rationale: פסילים என்பது செதுக்கி உருவாக்கப்பட்ட வழிபாட்டு உருவங்களைக் குறிக்கிறது. ‘சிலைகள்’ அல்லது பொதுவான ‘விக்கிரகங்கள்’ என்பதைக் காட்டிலும் மூலச்சொல்லின் உருவாக்கப்பட்ட, செதுக்கப்பட்ட தன்மையை இது காக்கிறது.
- source_word: יַקְנִיאוּהוּ
  choice: அவருக்குப் பொறாமையைத் தூண்டினார்கள்
  rationale: קנא என்பதன் ஹிஃபில் வடிவம் ‘பொறாமை/வைராக்கியத்தைத் தூண்டுதல்’ என்று பொருள்படும். முதல் அடியின் ‘கோபம்’ என்பதிலிருந்து இதை வேறுபடுத்தி, தேவனுடைய தனிப்பட்ட வழிபாட்டுரிமை மீறப்பட்டதற்கான உறவுசார் பதற்றத்தை இம்மொழிபெயர்ப்பு காக்கிறது.
theological_decisions:
- issue: தேவனைப் பற்றிய பொறாமை மொழி
  choice: அவருக்குப் பொறாமையைத் தூண்டினார்கள்
  alternative: அவருக்கு வைராக்கியத்தைத் தூண்டினார்கள்; அவரை எரிச்சலடையச் செய்தார்கள்
  rationale: எபிரெய קנא தேவனைப் பற்றிய இடங்களில், வேறு தெய்வ வழிபாட்டுக்கு எதிரான உடன்படிக்கைசார் பொறாமையையும் தீவிர பற்றையும் குறிக்கலாம். அதை வெறும் கோபமாக மென்மைப்படுத்தாமல், மூலத்தின் இறையியல் பதற்றம் தக்கவைக்கப்பட்டுள்ளது; தவறான மனிதப் பொறாமை என்ற புரிதலைத் தவிர்க்க அடிக்குறிப்பு விளக்குகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் வகையிலும் சங்கீதத்துக்கேற்ற கண்ணியமான நடையிலும் அமைக்கப்பட்டுள்ளது. இணையான இரு அடிகளும் ‘தங்கள்…-ஆல்’ என்ற கட்டமைப்பால் ஒன்றோடொன்று பொருந்துகின்றன; அதேவேளை כעס மற்றும் קנא ஆகிய இரு வினைகளின் வேறுபாடு முறையே ‘கோபம்’ மற்றும் ‘பொறாமை’ என்று பாதுகாக்கப்பட்டுள்ளது.
