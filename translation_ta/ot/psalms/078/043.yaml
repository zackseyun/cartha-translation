  text: אֲשֶׁר שָׂ֣ם בְּ֭/מִצְרַיִם אֹֽתוֹתָ֑י/ו וּ֝/מוֹפְתָ֗י/ו בִּ/שְׂדֵה צֹֽעַן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/043.yaml
  text: when he set his signs in Egypt[a], and his wonders in the fields of Zoan.
translation:
  language: ta
  text: அவர் எகிப்தில் தமது அடையாளங்களையும் சோவானின் வயல்வெளிகளில்[a] தமது அதிசயங்களையும் காட்டியபோது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சோவான் என்பது எகிப்திலிருந்த ஒரு நகரம்; இது பொதுவாகத் தானிஸ் நகரத்துடன் அடையாளம் காணப்படுகிறது.
    reason: cultural_note
lexical_decisions:
- source_word: אֲשֶׁר
  choice: நிகழ்த்தியபோதும்
  rationale: முந்தைய வசனத்தில் வரும் ‘நினைவுகூரவில்லை’ என்பதுடன் இணைந்து, தேவன் செய்த செயல்களின் காலச்சூழலை இயல்பான தமிழில் வெளிப்படுத்துகிறது. இங்குள்ள ‘-உம்’ அமைப்பு இணையான இரு தொடர்களையும் ஒருங்கிணைக்கிறது.
- source_word: שָׂם
  choice: நிகழ்த்தினார்
  rationale: அடையாளங்களையும் அதிசயங்களையும் ஒரு இடத்தில் ‘வைத்தார்’ என்ற சொற்சொல் வடிவத்தைவிட, அவற்றை அங்கே வெளிப்படச் செய்தார் என்ற பொருளை இயல்பாகத் தருகிறது; ‘செய்தார்’ என்பதைவிட அடையாளச் செயல்களின் வெளிப்பாட்டைத் தெளிவாக்குகிறது.
- source_word: בְּמִצְרַיִם
  choice: எகிப்தில்
  rationale: בְ இங்கு இடத்தைக் குறிக்கிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘எகிப்துக்கு எதிராக’ என்ற எதிர்நிலைப் பொருளைச் சேர்க்கவில்லை.
- source_word: אֹתוֹתָיו
  choice: தமது அடையாளங்களை
  rationale: אוֹת என்பதன் ‘அடையாளம்’ என்ற பொருளைக் காத்து, அடுத்து வரும் מוֹפֵת என்பதிலிருந்து சொற்பொருள் வேறுபாட்டை நிலைநிறுத்துகிறது. எழுவாய் மரியாதை ஒருமையாக இருப்பதால் ‘தமது’ இயல்பாக அமைகிறது.
- source_word: וּמוֹפְתָיו
  choice: தமது அதிசயங்களை
  rationale: מוֹפֵת குறிக்கும் வியப்பூட்டும் தெய்வீகச் செயலை நவீனத் தமிழில் தெளிவாகத் தருகிறது; முந்தைய ‘அடையாளங்கள்’ என்பதுடன் உள்ள வேறுபாட்டையும் காக்கிறது.
- source_word: בִּשְׂדֵה
  choice: வயல்வெளிகளில்
  rationale: வடிவத்தில் ஒருமைச் சார்புநிலையாக இருந்தாலும், இடப்பெயருடன் வரும் இச்சொல் அந்த நகரைச் சூழ்ந்த வெளிப்பகுதி அல்லது நிலப்பரப்பைக் குறிக்கிறது. ‘வயல்வெளிகளில்’ என்பது தமிழில் இயல்பான இடவுருவைத் தருகிறது.
- source_word: צֹעַן
  choice: சோவான்
  rationale: எபிரெய இடப்பெயரைத் தமிழில் ஒலிபெயர்க்கிறது; அதன் கிரேக்க/வரலாற்று அடையாளமான ‘தானிஸ்’ என்பதை மொழிபெயர்ப்புக்குள் மாற்றாமல் குறிப்பில் தருகிறது.
