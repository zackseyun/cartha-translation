translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. சங்கீதம் 78:42-இன் ‘நினைவுகூரவில்லை’ என்ற வினையுடன் வசனம் 43 தொடர்வதால், தனியே வாசிக்கும்போது கூட இணைப்பை உணர்த்த இரு தொடர்களிலும் ‘-போதும்’ பயன்படுத்தப்பட்டுள்ளது. ‘அடையாளங்கள் / அதிசயங்கள்’ என்ற மூலச் சொல் இணை வேறுபாடு பாதுகாக்கப்பட்டுள்ளது.
