  text: וַ/יָּשׁ֣וּבוּ וַ/יְנַסּ֣וּ אֵ֑ל וּ/קְד֖וֹשׁ יִשְׂרָאֵ֣ל הִתְווּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/041.yaml
  text: Again they turned back and tested God[a], and they limited the Holy One of Israel.
translation:
  language: ta
  text: 'அவர்கள் மீண்டும் திரும்பி, கடவுளைச் சோதித்தார்கள்;

    இஸ்ரவேலின் பரிசுத்தரைச் சினமூட்டினார்கள்[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்குள்ள எபிரெய வினைச்சொல் அரிதானதும் அதன் பொருள் உறுதியற்றதுமாகும். இதை ‘இஸ்ரவேலின் பரிசுத்தருக்கு வரம்பு வைத்தார்கள்,’ ‘அவர்மேல் ஓர் அடையாளம் இட்டார்கள்,’ அல்லது ‘அவரைப் புண்படுத்தினார்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּשׁוּבוּ
  choice: மீண்டும் பின்வாங்கி
  rationale: שׁוּב இங்கு முந்தைய நம்பிக்கையின்மைக்குத் திரும்பிய மீள்செயலைக் குறிக்கிறது. ‘மீண்டும்’ அதன் தொடர்ச்சியான தன்மையையும், ‘பின்வாங்கி’ சூழலில் உள்ள விசுவாச விலகலையும் இயல்பாக வெளிப்படுத்துகின்றன.
- source_word: וַיְנַסּוּ
  choice: சோதித்தார்கள்
  rationale: נסה என்பதன் வழக்கமான பொருள் ‘சோதித்தல்/சோதனைக்கு உட்படுத்துதல்.’ இங்கு மக்கள் நம்பிக்கையின்மையால் கடவுளைச் சவாலுக்கு உட்படுத்தியதை ‘சோதித்தார்கள்’ தெளிவாகக் காட்டுகிறது.
- source_word: אֵל
  choice: கடவுள்
  rationale: אֵל இங்கு இஸ்ரவேலின் இறைவனைக் குறிக்கும் பொதுவான தெய்வப் பெயராக உள்ளது. ‘கடவுள்’ நவீனத் தமிழில் தெளிவானதும் இயல்பானதும்; ‘வல்லமையுள்ள கடவுள்’ என்று மொழிபெயர்ப்பது இச்சூழலில் இல்லாத நுண்பொருளைச் சேர்க்கும்.
- source_word: וּקְדוֹשׁ יִשְׂרָאֵל
  choice: இஸ்ரவேலின் பரிசுத்தர்
  rationale: இது கடவுளின் பரிசுத்தத்தையும் இஸ்ரவேலுடனான உறவையும் வலியுறுத்தும் நிலையான வேதாகமப் பட்டப்பெயர். ‘இஸ்ரவேலின் பரிசுத்தர்’ அதன் சுருக்கத்தையும் இறையியல் நிறையையும் காக்கிறது.
- source_word: הִתְווּ
  choice: சினமூட்டினார்கள்
  rationale: இந்த அரிய வினைச்சொல்லின் துல்லியப் பொருள் உறுதியற்றது. ‘கடவுளைச் சோதித்தார்கள்’ என்ற இணை அடிக்கு ஏற்றவாறு, அவருக்கு எதிரான அவமதிப்பும் தூண்டுதலும் கொண்ட செயலை ‘சினமூட்டினார்கள்’ இயல்பாக வெளிப்படுத்துகிறது; பிற சாத்தியங்கள் அடிக்குறிப்பில் காக்கப்படுகின்றன.
theological_decisions:
- issue: הִתְווּ என்ற அரிய வினைச்சொல்லின் பொருள்
  choice: சினமூட்டினார்கள்
  alternative: வரம்பிட்டார்கள்; அடையாளமிட்டார்கள்; புண்படுத்தினார்கள்
  rationale: எபிரெய வினை அரிதானதும் பொருள் உறுதியற்றதுமாகும். இணைவாக்கியத்தில் வரும் ‘கடவுளைச் சோதித்தார்கள்’ என்பதோடு ‘சினமூட்டினார்கள்’ நன்றாகப் பொருந்துகிறது. ‘வரம்பிட்டார்கள்’ என்ற மரபுவழி மொழிபெயர்ப்பு, கடவுளின் இயல்பையே மனிதர் கட்டுப்படுத்த முடியும் என்ற தேவையற்ற இறையியல் முடிவைத் தூண்டக்கூடும்; எனினும் முக்கியமான மாற்று வாசிப்பாக அது அடிக்குறிப்பில் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைநடையின் சுருக்கமும் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘பரிசுத்தர்’ என்ற நிலையான வேதாகமப் பட்டப்பெயர் தக்கவைக்கப்பட்டுள்ளது; அரிய எபிரெய வினையின் தெளிவின்மை அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
