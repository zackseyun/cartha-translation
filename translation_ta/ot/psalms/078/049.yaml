source:
  edition: WLC
  text: יְשַׁלַּח בָּ֨/ם חֲר֬וֹן אַפּ֗/וֹ עֶבְרָ֣ה וָ/זַ֣עַם וְ/צָרָ֑ה מִ֝שְׁלַ֗חַת מַלְאֲכֵ֥י רָעִֽים־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/049.yaml
  text: He sent against them his burning anger[a], fury, indignation, and distress, a band of destructive messengers.
translation:
  language: ta
  text: அவர் அவர்களுக்கு எதிராகத் தமது எரியும் கோபத்தையும், சீற்றத்தையும், சினத்தையும், நெருக்கடியையும், அழிவை விளைவிக்கும் தூதர் கூட்டத்தையும் அனுப்பினார்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பேரழிவின் தூதர் கூட்டத்தை’; பாரம்பரிய மொழிபெயர்ப்பு, ‘தீய தேவதூதர்களை.’ எபிரேயச் சொற்றொடர் ஒழுக்க ரீதியாகத் தீயவர்களைக் கட்டாயமாகக் குறிக்காமல், அழிவை விளைவிக்கும் தூதர்களைக் குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: יְשַׁלַּח בָּם
  choice: அவர் அவர்களுக்கு எதிராக ... அனுப்பினார்
  rationale: பீயேல் வினை இறைவன் அவர்கள்மீது செலுத்திய தண்டனைச் செயலைக் குறிக்கிறது; சங்கீதத்தின் கவிதைநடைக் கதையோட்டத்தில் தமிழ் இறந்தகாலம் இயல்பாக அமைகிறது. בָּם என்பதன் பகைமைச் சூழலை ‘அவர்களுக்கு எதிராக’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: חֲרוֹן אַפּוֹ
  choice: தமது எரியும் கோபம்
  rationale: ‘அவருடைய மூக்கு/கோபத்தின் வெம்மை’ என்ற எபிரேய மரபுத்தொடரின் தீவிரத்தையும் வெம்மை உருவகத்தையும் இயல்பான தமிழில் காக்கிறது.
- source_word: עֶבְרָה
  choice: சீற்றம்
  rationale: பொங்கி வழியும் கடுங்கோபத்தைக் குறிக்கிறது; அருகிலுள்ள கோபச் சொற்களிலிருந்து வேறுபடுத்தியும் கவிதையின் சொற்குவிப்பைக் காத்தும் வழங்குகிறது.
- source_word: זַעַם
  choice: சினம்
  rationale: கண்டனத்துடன் கூடிய கடுங்கோபத்தைச் சுட்டும் சொல்; தமிழில் இயல்பாகவும் முந்தைய ‘சீற்றம்’ என்பதிலிருந்து ஓரளவு வேறுபட்டும் உள்ளது.
- source_word: צָרָה
  choice: நெருக்கடி
  rationale: பெறுகிறவர்கள்மீது வரும் துன்பம், இடுக்கண், நெருக்கடி ஆகிய பொருள்களை இங்கு சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: מִשְׁלַחַת
  choice: கூட்டம்
  rationale: அனுப்பப்பட்ட குழு அல்லது படை என்ற கூட்டுப்பொருளை இயல்பான தமிழில் தருகிறது; ‘அனுப்புதல்’ என்ற பெயர்ச்சொல்லைச் சொற்சொல்லாக மொழிபெயர்ப்பதால் உண்டாகும் செயற்கைத்தன்மையைத் தவிர்க்கிறது.
- source_word: מַלְאֲכֵי
  choice: தூதர்
  rationale: מלאך என்பது மனித அல்லது வானுலகத் தூதர் என இருவகையிலும் அமையக்கூடும்; ‘தூதர்’ அந்தச் சொற்பொருள் அகலத்தைப் பாதுகாக்கிறது.
- source_word: רָעִים
  choice: அழிவைக் கொண்டுவரும்
  rationale: இந்தத் தண்டனைச் சூழலில், தூதர்களின் ஒழுக்கத் தீமையை அவசியமாகக் கூறாமல் அவர்களால் வரும் தீங்கு அல்லது பேரழிவைக் குறிக்கிறது.
theological_decisions:
- issue: מַלְאֲכֵי רָעִים என்பது ஒழுக்க ரீதியாகத் தீய தேவதூதர்களையா, அல்லது அழிவுத் தீர்ப்பைக் கொண்டுவரும் தூதர்களையா குறிக்கிறது?
  choice: அழிவைக் கொண்டுவரும் தூதர் கூட்டம்
  alternative: தீய தூதர்கள்; பேரழிவின் தூதர்கள்
  rationale: מלאך என்பதற்கு பொதுவாக ‘தூதர்’ என்றும் רָעִים என்பதற்கு இச்சூழலில் ‘தீங்கு விளைவிக்கும்/பேரழிவுக்குரிய’ என்றும் பொருள் கொள்ள முடியும். ஆகவே முதன்மை உரை தூதர்களின் ஒழுக்கத் தன்மையை முடிவுசெய்யாமல் தீர்ப்பின் அழிவுத்தன்மையை வெளிப்படுத்துகிறது; பாரம்பரிய மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. கோபத்தைக் குறிக்கும் நெருங்கிய பொருளுடைய எபிரேயச் சொற்களின் அடுக்கை ‘எரியும் கோபம், சீற்றம், சினம்’ என வேறுபடுத்திக் காத்துள்ளோம். இறுதி தூதர் சொற்றொடர் முன் நீள்கோடு இடப்பட்டு, அது முன் கூறிய தெய்வீகத் தீர்ப்பை விளக்கும் இணைப்பாக வாசிக்கப்படுமாறு அமைக்கப்பட்டுள்ளது.
