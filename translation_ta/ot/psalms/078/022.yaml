source:
  edition: WLC
  text: כִּ֤י לֹ֣א הֶ֭אֱמִינוּ בֵּ/אלֹהִ֑ים וְ/לֹ֥א בָ֝טְח֗וּ בִּֽ/ישׁוּעָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/022.yaml
  text: because they did not believe in God, and did not trust in his salvation.
translation:
  language: ta
  text: ஏனெனில் அவர்கள் கடவுளில் நம்பிக்கை வைக்கவில்லை; அவருடைய மீட்பில் நம்பிக்கை வைக்கவில்லை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֶאֱמִינוּ בֵּאלֹהִים
  choice: கடவுளில் நம்பிக்கை வைக்கவில்லை
  rationale: ஹீப்ரு בְּ உடன் வரும் האמין, கடவுளை நம்பத்தகுந்தவராக ஏற்று அவரில் நம்பிக்கை வைப்பதைக் குறிக்கிறது; ‘கடவுள் சொன்னதை நம்பவில்லை’ என்று மட்டும் பொருளைக் குறுக்காமல் உறவுசார் நம்பிக்கையைத் தக்கவைக்கிறது.
- source_word: בָטְחוּ
  choice: நம்பி சார்ந்திருக்கவில்லை
  rationale: בטח என்பது வெறும் மனப்பூர்வ நம்பிக்கையைவிட பாதுகாப்புக்காக நம்பியிருத்தல் அல்லது சார்ந்திருத்தல் என்ற கருத்தையும் கொண்டது; முதல் அடியின் ‘நம்பிக்கை’ என்பதிலிருந்து வேறுபாட்டைத் தெளிவாக்க இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: בִישׁוּעָתוֹ
  choice: அவருடைய மீட்பையும்
  rationale: יְשׁוּעָה இச்சூழலில் கடவுள் அளிக்கும் விடுதலை அல்லது மீட்பைக் குறிக்கிறது. ‘இரட்சிப்பு’ சாத்தியமானதே என்றாலும், சங்கீதத்தின் வரலாற்றுச் சூழலில் இயல்பான ‘மீட்பு’ தேர்ந்தெடுக்கப்பட்டது; וְלֹא என்பதன் இணைப்பை இயல்பாகக் காட்ட ‘-யும்’ சேர்க்கப்பட்டது.
theological_decisions:
- issue: ‘கடவுளை நம்புதல்’ என்பதா, ‘கடவுளில் நம்பிக்கை வைத்தல்’ என்பதா
  choice: கடவுளில் நம்பிக்கை வைக்கவில்லை
  alternative: கடவுளை நம்பவில்லை
  rationale: בֵּאלֹהִים என்ற முன்னிடைச்சொல் அமைப்பு நம்பிக்கையின் இலக்காகவும் ஆதாரமாகவும் கடவுளைக் காட்டுகிறது. ஆகவே English POB-இன் ‘believe in God’ உடனும் பொருந்தும் வகையில் ‘கடவுளில் நம்பிக்கை வைத்தல்’ பயன்படுத்தப்பட்டது; கடவுளின் இருப்பை நம்புதல் என்ற பிந்தைய தத்துவப் பொருளை மட்டும் திணிக்கவில்லை.
- issue: יְשׁוּעָה என்பதின் பரப்பு
  choice: மீட்பு
  alternative: இரட்சிப்பு / விடுதலை
  rationale: இஸ்ரவேலின் வனாந்தர அனுபவத்தை விவரிக்கும் உடனடி சூழலில் கடவுளின் காப்பும் விடுதலையும் முன்னிலையில் உள்ளன. அதேவேளை ‘மீட்பு’ என்ற சொல் வசனத்தின் இறையியல் பரப்பை தேவையின்றி சுருக்குவதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழ்; எளிதில் புரியும், கண்ணியமான கவிதைநடை. இணையான இரண்டு மறுப்புக் கூறுகளும் அரைப்புள்ளி மூலம் பாதுகாக்கப்பட்டுள்ளன; தேவையற்ற சமயக்குழுச் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
