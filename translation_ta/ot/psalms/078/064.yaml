  yaml_path: translation/ot/psalms/078/064.yaml
  text: His priests fell by the sword[a], and his widows could not weep.
translation:
  language: ta
  text: அவனுடைய ஆசாரியர்கள் வாளால் வீழ்ந்தார்கள்; அவனுடைய விதவைகள் அழவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அழ முடியவில்லை.” எபிரெயில் நேரடியாக “அழவில்லை” என்று உள்ளது. இது நடந்ததை அப்படியே கூறலாம்; அல்லது பேரழிவினால் வழக்கமான துக்கத்தை அனுசரிக்க வாய்ப்பே இல்லாததை உணர்த்தலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּהֲנָיו
  choice: அவனுடைய ஆசாரியர்கள்
  rationale: כֹּהֵן என்பதன் வழக்கமான பொருள் ‘ஆசாரியன்’. இங்கு இஸ்ரவேலின் வழிபாட்டுப் பணியோடு தொடர்புடைய பதவியைத் தெளிவாகக் குறிக்கிறது; ‘ஊழியர்கள்’ என்பது அளவுக்கு மீறிய பொதுமைப்படுத்தலாகும்.
- source_word: בַּחֶרֶב
  choice: வாளால்
  rationale: בְּ முன்னொட்டுடன் வரும் ‘வாள்’ இங்கு கருவி அல்லது வழிமுறையைக் குறிக்கிறது. ‘வாளால்’ என்பது இயல்பான தமிழில் வன்முறையான போர்மரணத்தைத் தெரிவிக்கிறது.
- source_word: נָפָלוּ
  choice: வீழ்ந்தார்கள்
  rationale: נפל என்பதன் அடிப்படைப் படிமம் ‘விழுதல்/வீழ்தல்’. ‘வாளால்’ என்பதுடன் சேரும்போது கொல்லப்பட்டதை உணர்த்தினாலும், எபிரெயப் படிமத்தை ‘வீழ்ந்தார்கள்’ தக்கவைக்கிறது.
- source_word: וְאַלְמְנֹתָיו
  choice: அவனுடைய விதவைகள்
  rationale: பின்னொட்டு மூன்றாம் நபர் ஆண்பால் ஒருமையில் உள்ளது. சங்கீதத்தில் கூட்டுமக்கள் ஒருமை உருவகத்தில் குறிப்பிடப்படுவதை மறைக்காமல், ஒருமை உடைமையைத் தமிழிலும் தக்கவைக்கிறது.
- source_word: לֹא תִבְכֶּינָה
  choice: அழவில்லை
  rationale: எபிரெயச் சொற்றொடரின் நேரடியான கூற்று ‘அழவில்லை’. பேரழிவால் துக்கம் அனுசரிக்க வாய்ப்பில்லாமையை இது சூழலில் உட்குறிக்கலாம்; ஆனால் அந்த விளக்கத்தை முதன்மை உரையில் கட்டாயப்படுத்தாமல் அடிக்குறிப்பில் தருவது மூலத்தின் உண்மையான தெளிவின்மையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: விதவைகள் அழாததன் பொருள்
  choice: அவர்கள் ‘அழவில்லை’ என்ற மூலத்தின் நேரடியான, விளக்கத் திறந்த கூற்றை வைத்தல்
  alternative: பேரழிவால் வழக்கமான துக்கத்தை அனுசரிக்க முடியாமல் ‘அழ முடியவில்லை’ என்று வெளிப்படையாக மொழிபெயர்த்தல்
  rationale: לֹא துகளுடன் வரும் வினை நேரடியாக அழவில்லை எனக் கூறுகிறது. சூழல் வாய்ப்பின்மை அல்லது இயலாமையை உணர்த்தக்கூடும்; இருப்பினும் அதை முதன்மை உரையில் உறுதிப்படுத்துவது எபிரெயில் உள்ள கவித்துவத் தெளிவின்மையைத் தீர்த்துவிடும். ஆகவே மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், சங்கீதத்திற்கேற்ற கண்ணியமான கவிநடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. ‘ஆசாரியர்கள்,’ ‘வாளால் வீழ்ந்தார்கள்’ போன்ற நிலைபெற்ற வேதாகமச் சொற்கள் இயல்பாகப் பயன்படுத்தப்பட்டுள்ளன. ஒருமை உடைமை வடிவான ‘அவனுடைய’ மூல எபிரெயை முறையாகத் தக்கவைக்கிறது.
