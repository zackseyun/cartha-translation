  source_fidelity: மூல எபிரெயத்தில் வַיִּזְכֹּר என்பது இறந்தகாலத்தில் ‘அவர் நினைவுகூர்ந்தார்’; כִּי அதன்பின் நினைவுகூரப்பட்ட உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது. בָשָׂר மற்றும் רוּחַ ஆகிய இரு உருவகங்களும் மனிதரின் நிலையாமையைச் சுட்டுகின்றன. வரைவு இதை அடிப்படையில் காக்கிறது; ஆனால் ‘என்றும் ... என்றும்’ அமைப்பு தமிழில் இரண்டு தனித்த மேற்கோள்-உள்ளடக்கங்களாகச் சற்றே தளர்வாகிறது. இணைப்புக் கோடுகளுடன் உள்ள நேரடியான கவித்துவ இணைநிலை மூலத்தின் சுருக்கமான உருவகத் தொடர்பைத் தெளிவாகக் காக்கிறது.
  naturalness: ‘அவர்கள் மாம்சம் என்றும், ... காற்று என்றும்’ என்பது புரியக்கூடியதே; ஆயினும் நவீன பொதுத் தமிழில் சற்றே செயற்கையாகவும் முழுமையற்றதாகவும் ஒலிக்கிறது. ‘அவர்கள் மாம்சம்—கடந்துபோய்த் திரும்பிவராத காற்று—என்று’ என்பது கவித்துவமான, இயல்பான பெயர்நிலைத் தொடராக அமைகிறது. ‘கடந்துபோய்த்’ என்பதில் சந்தி இயல்பாகச் சரிசெய்யப்பட்டுள்ளது.
  terminology: ‘மாம்சம்’ என்பது בָשָׂר-இன் உருவகப் படிமத்தைத் தக்கவைக்கிறது; ‘காற்று’ என்பது இச்சூழலில் רוּחַ-க்கு ஏற்ற முதன்மைப் பொருள். அடிக்குறிப்பில் ‘மூச்சு’ மற்றும் ‘ஆவி’ என்ற சாத்தியமான சொற்பொருள்கள் குறிப்பிடப்படுவது சரியானது. ‘பலவீனமுமே’ என்பதற்குப் பதில் ‘பலவீனமும்தான்’ இன்றி, ‘நிலையாமையும் பலவீனமும்’ எனச் சுருக்குவது இயல்பான நடையாகும்.
