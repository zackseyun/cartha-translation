  yaml_path: translation/ot/psalms/078/039.yaml
  text: He remembered that they were flesh[a], a wind that passes and does not return.
translation:
  language: ta
  text: அவர்கள் மாம்சம்—கடந்துபோய்த் திரும்பிவராத காற்று—என்று அவர் நினைவுகூர்ந்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கடந்துபோய்த் திரும்பிவராத மூச்சு.’ எபிரெய மொழியில் רוּחַ என்ற சொல் ‘காற்று,’ ‘மூச்சு,’ அல்லது ‘ஆவி’ என்று பொருள்படலாம்; இங்கு நிலையாமையும் பலவீனமும் பெரும்பாலும் கருத்தில் உள்ளன.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְכֹּר
  choice: அவர் நினைவுகூர்ந்தார்
  rationale: זכר என்பதன் Qal wayyiqtol வடிவம்; சூழலில் மறைமுக எழுவாய் கடவுள். இறந்தகாலக் கதைநடையை இயல்பான தமிழில் தருகிறது.
- source_word: כִּי
  choice: என்றும் ... என்றும்
  rationale: நினைவுகூரப்பட்டவற்றின் உள்ளடக்கத்தை அறிமுகப்படுத்துவதால், தமிழில் மேற்கோள் உள்ளடக்கத்தைக் குறிக்கும் ‘என்று’ அமைப்பு இயல்பாகப் பயன்படுத்தப்பட்டுள்ளது.
- source_word: בָשָׂר
  choice: மாம்சம்
  rationale: மனிதரின் பலவீனத்தையும் மரணத்திற்குட்பட்ட நிலையையும் உணர்த்தும் எபிரெய concrete சொல்லைத் தக்கவைக்கிறது; விளக்கமான சொற்களை மூலத்தில் சேர்க்கவில்லை.
- source_word: הֵמָּה
  choice: அவர்கள்
  rationale: எபிரெய தனிப்பட்ட பன்மைச் சுட்டுப்பெயரை நேரடியாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: רוּחַ
  choice: காற்று
  rationale: இங்கு நிலையாமையையும் விரைவில் கடந்துபோகும் தன்மையையும் குறிக்கிறது. ‘மூச்சு’ என்பதும் சாத்தியம்; ‘ஆவி’ என்று மொழிபெயர்ப்பது தேவையற்ற மானுடவியல் கோட்பாட்டை வாசகத்தில் புகுத்தக்கூடும்.
- source_word: הוֹלֵךְ
  choice: கடந்துபோய்
  rationale: சென்றுகொண்டிருப்பதைக் குறிக்கும் participle-ஐ, நிலையாமையை இயல்பான தமிழில் வெளிப்படுத்தும் வகையில் மொழிபெயர்க்கிறது.
- source_word: וְלֹא יָשׁוּב
  choice: திரும்பிவராத
  rationale: திரும்பாத தன்மையை பொதுவான கவித்துவ உண்மையாக வெளிப்படுத்துகிறது; எதிர்காலக் காலத்தை அளவுக்கு மீறிக் குறிப்பதில்லை.
theological_decisions:
- issue: மனித பலவீனத்தையும் நிலையாமையையும் குறிக்கும் உருவகம்
  choice: மனிதர்கள் ‘மாம்சம்’ என்றும், கடந்துபோய் திரும்பிவராத ‘காற்று’ என்றும் கூறி அவர்களின் பலவீனமும் நிலையாமையும் சித்தரிக்கப்படுகின்றன.
  alternative: רוּחַ என்பதை ‘ஆவி’ என்று கொண்டு, மனித ஆவி உடலைவிட்டுப் புறப்பட்டுச் செல்வதைப் பற்றிய கூற்றாக வாசித்தல்.
  rationale: உடனடியான கவித்துவ இணைப்பு மரணத்திற்குட்பட்ட நிலையையும் நிலையாமையையும் வலியுறுத்துகிறது. ‘காற்று’ என்ற மொழிபெயர்ப்பு, வசனம் கட்டாயப்படுத்தாத ஆன்மா அல்லது ஆவி குறித்த தொழில்நுட்பக் கோட்பாட்டைச் சேர்க்காமல் மூலத்தின் படிமத்தைக் காக்கிறது.
translation_notes:
  register: நவீன பொதுத் தமிழில், கவித்துவக் கண்ணியத்துடன் அமைக்கப்பட்டுள்ளது. ‘மாம்சம்’ என்ற மூலப்படிமமும் רוּחַ சொல்லின் உண்மையான பொருள் நெகிழ்வும் தக்கவைக்கப்பட்டுள்ளன; அடிக்குறிப்பு குறியீடு பிரதான உரையில் சேர்க்கப்பட்டுள்ளது.
