base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/024.yaml
  text: He rained down manna on them to eat[a], and gave them the grain of heaven.
translation:
  language: ta
  text: அவர்கள் உண்பதற்காக அவர்கள்மேல் மன்னாவைப் பொழியச் செய்தார்; வானத்தின் தானியத்தை அவர்களுக்குக் கொடுத்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வானங்களின் தானியம்’ என்றும் மொழிபெயர்க்கலாம். இது மன்னாவைக் குறிக்கும் கவிதைநயமான வருணனை; தொடர்புடைய சூழல்களில் இதை விளக்கமாக ‘வானத்திலிருந்து வந்த உணவு’ அல்லது ‘வானத்தின் அப்பம்’ என்றும் கூறுவர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּמְטֵר
  choice: பொழியச் செய்தார்
  rationale: מטר என்பதன் ஹிஃபில் வடிவம் ‘மழையாகப் பொழியச் செய்தார்’ என்ற காரணவினைப் பொருளைக் கொண்டது; தமிழில் ‘பொழியச் செய்தார்’ அந்தப் பொருளைத் தெளிவாகக் காக்கிறது.
- source_word: עֲלֵיהֶם
  choice: அவர்கள்மேல்
  rationale: על உடன் இணைந்த பன்மைச் சுட்டுப்பெயர் இங்கு மேலிருந்து அவர்கள்மீது பொழிந்த திசையைச் சுட்டுகிறது.
- source_word: מָן
  choice: மன்னா
  rationale: வனாந்தரத்தில் வழங்கப்பட்ட உணவைக் குறிக்கும் மரபாக நிலைபெற்ற தமிழ் ஒலிபெயர்ப்பு.
- source_word: לֶאֱכֹל
  choice: அவர்கள் உண்பதற்காக
  rationale: ל உடன் வரும் வினையெச்சம் நோக்கத்தைத் தெரிவிக்கிறது; மறைந்துள்ள செய்பவரைத் தமிழில் இயல்பாக வெளிப்படுத்த ‘அவர்கள்’ சேர்க்கப்பட்டது.
- source_word: דְגַן
  choice: தானியம்
  rationale: דגן தானிய விளைபொருளைக் குறிக்கிறது; ‘தானியம்’ அதன் நேரடியான பொருளையும் கவிதை உருவகத்தையும் காக்கிறது.
- source_word: שָׁמַיִם
  choice: வானத்தின்
  rationale: இணைப்புத் தொடரில் இது ‘வானத்தின்’ என்று இயல்பாக அமைகிறது; கவிதைநயத்தையும் மேலுலகத் தொடர்பையும் காக்கிறது.
- source_word: נָתַן
  choice: கொடுத்தார்
  rationale: נתן என்பதன் எளிய, நேரடியான பொருள் ‘கொடுத்தார்’.
- source_word: לָמוֹ
  choice: அவர்களுக்குக்
  rationale: இந்தக் கவிதை வடிவச் சுட்டுப்பெயர் ‘அவர்களுக்கு’ என்ற மறைமுகச் செயப்படுபொருளைக் குறிக்கிறது.
theological_decisions:
- issue: மன்னாவை ‘வானத்தின் தானியம்’ எனக் கூறும் உருவகம்
  choice: ‘வானத்தின் தானியம்’ என்ற கவிதை உருவகத்தை அப்படியே வைத்தல்
  alternative: ‘வானத்திலிருந்து வந்த உணவு’ அல்லது ‘வானத்தின் அப்பம்’
  rationale: எபிரெய உரை דגן (‘தானியம்’) என்று கூறி மன்னாவுடன் கவிதை இணைநிலையை அமைக்கிறது. அதை விளக்கவுரையாக மாற்றாமல் வைத்திருப்பது மூல உருவகத்தையும் அதன் இறையியல் நயத்தையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், சங்கீதத்திற்கேற்ற கண்ணியமான கவிதைநடையுடன் மொழிபெயர்க்கப்பட்டது. ‘பொழியச் செய்தார்’ காரணவினையைப் பாதுகாக்கிறது; ‘வானத்தின் தானியம்’ மூல உருவகத்தை விளக்கமாக மாற்றாமல் வைத்திருக்கிறது. அடிக்குறி குறியீடு தொடர்புடைய உருவகத் தொடரின் முடிவில் இடப்பட்டுள்ளது.
