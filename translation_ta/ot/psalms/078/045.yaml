- from: அவர்களிடையே ஈக்கூட்டங்களை[a] அனுப்பினார்; அவை அவர்களை விழுங்கின. தவளைகளையும் அனுப்பினார்; அவை அவர்களை அழித்தன.
  to: அவர் அவர்களிடையே ஈக்கூட்டங்களை[a] அனுப்பினார்; அவை அவர்களைத் தின்றன. தவளைகளையும் அனுப்பினார்; அவை அவர்களை அழித்தன.
