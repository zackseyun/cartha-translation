  text: יְשַׁלַּ֬ח בָּ/הֶ֣ם עָ֭רֹב וַ/יֹּאכְלֵ֑/ם וּ֝/צְפַרְדֵּ֗עַ וַ/תַּשְׁחִיתֵֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/045.yaml
  text: He sent among them swarms of flies[a], which devoured them, and frogs[b], which destroyed them.
translation:
  language: ta
  text: அவர் அவர்களிடையே ஈக்கூட்டங்களை[a] அனுப்பினார்; அவை அவர்களைத் தின்றன. தவளைகளையும் அனுப்பினார்; அவை அவர்களை அழித்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பூச்சிக்கூட்டங்களை’; எபிரெயச் சொல் עָרֹב பொதுவாகப் பலவகைத் திரள் பூச்சிகளைக் குறிக்கக்கூடும்; மரபாக இது ஈக்கள் என்று புரிந்துகொள்ளப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְשַׁלַּח
  choice: அனுப்பினார்
  rationale: שׁלח என்பதன் பியேல் வடிவம், எகிப்தியரின் நடுவே ஒரு வாதையை வரச்செய்ததைக் குறிக்கிறது. தமிழில் ‘அனுப்பினார்’ என்பது இயல்பாகவும் போதிய வலிமையுடனும் உள்ளது.
- source_word: בָּהֶם
  choice: அவர்களிடையே
  rationale: ב என்ற முன்னிடைச்சொல் இங்கு வாதை அவர்களின் நடுவில் வந்ததை இடவியல் முறையில் குறிக்கிறது; ‘அவர்களுக்கு எதிராக’ என்பதைக் காட்டிலும் ‘அவர்களிடையே’ மூலத்துக்கு நெருக்கமானது.
- source_word: עָרֹב
  choice: ஈக்கூட்டங்களை
  rationale: விடுதலைப் பயண வாதைகளின் சூழலில் עָרֹב என்பது கூட்டமாகத் திரியும் பூச்சிகளைக் குறிக்கிறது; மரபாக ஈக்கள் எனப் புரிந்துகொள்ளப்படுகிறது. பொதுவாசகருக்கு தெளிவாக இருக்க ‘ஈக்கூட்டங்கள்’ பயன்படுத்தப்படுகிறது; பரந்த பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וַיֹּאכְלֵם
  choice: அவை அவர்களை விழுங்கின
  rationale: אכל என்பதன் தீவிரமான அழிவுப் படிமத்தை ‘விழுங்கின’ காக்கிறது. ‘ஈக்கூட்டங்கள்’ தமிழில் பன்மையாக அமைந்ததால் ‘அவை’ என இயல்பான ஒத்திசைவு தரப்படுகிறது.
- source_word: וּצְפַרְדֵּעַ
  choice: தவளைகளையும்
  rationale: எபிரெயச் சொல் ஒருமையில் இருந்தாலும் இனத்தைக் கூட்டாகக் குறிக்கிறது. தமிழில் இவ்வாதையை இயல்பாகக் குறிப்பிட பன்மை பயன்படுத்தப்படுகிறது; இணைப்பும் அனுப்புதல் வினையுடன் தெளிவாக இணைக்கப்படுகிறது.
- source_word: וַתַּשְׁחִיתֵם
  choice: அவை அவர்களை அழித்தன
  rationale: שׁחת அழிவு அல்லது நாசத்தைச் சுட்டுகிறது. ‘அழித்தன’ அதன் வலிமையைத் தக்கவைக்கிறது; பன்மையான ‘தவளைகள்’ என்பதற்கு ‘அவை’ இயல்பாக ஒத்திசைகிறது.
