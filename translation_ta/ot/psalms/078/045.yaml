translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. எபிரெய மூலத்தின் தொடர்ச்சியான இணைப்புகள் தமிழில் தெளிவான இரு வாக்கியங்களாக அமைக்கப்பட்டுள்ளன. கூட்டுப்பொருள் கொண்ட எபிரெய ஒருமைச் சொற்கள் தமிழின் இயல்பின்படி பன்மையாக வழங்கப்பட்டுள்ளன.
