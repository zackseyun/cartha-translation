  yaml_path: translation/ot/psalms/078/048.yaml
  text: He gave over their cattle to the hail[a], and their livestock to the lightning bolts.
translation:
  language: ta
  text: 'அவர்களுடைய கால்நடைகளை ஆலங்கட்டிக்கும்,

    அவர்களுடைய மந்தைகளை மின்னல்களுக்கும்[a] ஒப்புக்கொடுத்தார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தீப்பிழம்புகளுக்கும்”; எபிரெயச் சொல் எரியும் அல்லது மின்னும் அழிவுச் சக்திகளைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּסְגֵּר
  choice: ஒப்புக்கொடுத்தார்
  rationale: סגר என்பதற்கு அடிப்படையில் ‘அடைத்தல்’ என்றும், ஒருவரையோ ஒன்றையோ வேறொன்றின் கையில் அல்லது அழிவுக்கு ‘ஒப்புக்கொடுத்தல்’ என்றும் பொருள் உண்டு. இங்கு விலங்குகளை அழிவுக்குரிய சக்திகளிடம் விட்டுக்கொடுத்த செயலை இயல்பான தமிழில் இது தெரிவிக்கிறது.
- source_word: לַבָּרָד
  choice: ஆலங்கட்டிக்கும்
  rationale: בָּרָד என்பது ‘ஆலங்கட்டி’. ל முன்னொட்டு அவை எதற்கு ஒப்புக்கொடுக்கப்பட்டன என்பதைக் குறிக்கிறது.
- source_word: בְּעִירָם
  choice: அவர்களுடைய கால்நடைகளை
  rationale: בְּעִיר என்பது வளர்ப்பு விலங்குகளை, குறிப்பாக வேலைக்குப் பயன்படுத்தப்பட்ட கால்நடைகளை, குறிக்கலாம். பொதுவாகவும் இயல்பாகவும் புரியும் ‘கால்நடைகள்’ என்பதைத் தேர்ந்தெடுத்தோம்.
- source_word: וּמִקְנֵיהֶם
  choice: அவர்களுடைய மந்தைகளை
  rationale: מִקְנֶה என்பது உடைமையாக வளர்க்கப்படும் ஆடு, மாடு முதலிய கால்நடைத் தொகுதியைக் குறிக்கும். முந்தைய இணைச்சொல்லுடனான கவிதைநடை ஒற்றுமையையும் சிறு வேறுபாட்டையும் காக்க ‘மந்தைகள்’ பயன்படுத்தப்பட்டது.
- source_word: לָרְשָׁפִים
  choice: தீப்பிழம்புகளுக்கும்
  rationale: רְשָׁפִים என்பது எரியும் அல்லது மின்னும் அழிவுச் சக்திகளைக் குறிக்கக்கூடிய பன்மைச்சொல். யாத்திராகமத்தின் ஆலங்கட்டி வாதைச் சூழலில் இது மின்னல்களைக் குறிக்கலாம்; இருப்பினும் மூலச்சொல்லின் பரந்த தீ சார்ந்த பொருளை முதன்மை உரையில் காக்க ‘தீப்பிழம்புகள்’ தேர்ந்தெடுக்கப்பட்டது.
