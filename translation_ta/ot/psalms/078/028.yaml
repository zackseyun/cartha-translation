source:
  edition: WLC
  text: וַ֭/יַּפֵּל בְּ/קֶ֣רֶב מַחֲנֵ֑/הוּ סָ֝בִ֗יב לְ/מִשְׁכְּנֹתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/028.yaml
  text: He made it fall in the midst of their camp[a], all around their dwellings.
translation:
  language: ta
  text: 'அவற்றை அவர்களுடைய முகாமின் நடுவில் விழச் செய்தார்;[a]

    அவர்களுடைய குடியிருப்புகளைச் சுற்றிலும் விழச் செய்தார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மூலத்தில் நேரடியாக, ‘அவனுடைய முகாம்’, ‘அவனுடைய குடியிருப்புகள்’ என்று ஒருமை உடைமைப்பின்னொட்டுகள் உள்ளன. அவை இஸ்ரவேல் மக்களை ஒரு கூட்டாகக் குறிப்பதாகத் தோன்றுவதால், தமிழில் ‘அவர்களுடைய’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּפֵּל
  choice: விழச் செய்தார்
  rationale: נפל என்பதன் ஹிஃபில் வடிவம் காரணவினைப் பொருளைத் தருவதால், கடவுள் அவற்றை விழும்படி செய்தார் என்ற கருத்தை நேரடியாக வெளிப்படுத்துகிறது. முந்தைய வசனத்திலுள்ள காடைகள் தமிழில் இயல்பாகப் பன்மையில் சுட்டப்படுவதால் ‘அவற்றை’ என வழங்கப்பட்டது.
- source_word: בְּקֶרֶב
  choice: நடுவில்
  rationale: வெறும் அருகாமையை அல்லாமல், முகாமின் உட்பகுதியில் விழுந்த இடத்தைக் குறிக்கிறது; நவீனத் தமிழில் இயல்பானதும் துல்லியமானதும் ஆகும்.
- source_word: מַחֲנֵהוּ
  choice: அவர்களுடைய முகாம்
  rationale: எபிரெயத்தில் பின்னொட்டு இலக்கணப்படி ஒருமையாக இருந்தாலும், இஸ்ரவேல் மக்களை ஒரு கூட்டாகக் குறிக்கிறது. தமிழில் அந்தக் கூட்டுப் பொருளைத் தெளிவாகக் காட்ட பன்மை உடைமைப்பெயர் பயன்படுத்தப்பட்டது.
- source_word: סָבִיב
  choice: சுற்றிலும்
  rationale: பல குடியிருப்புகளின் எல்லாப் பக்கங்களிலும் பரவியிருந்ததைச் சுருக்கமாகவும் இயல்பாகவும் உணர்த்துகிறது.
- source_word: לְמִשְׁכְּנֹתָיו
  choice: அவர்களுடைய குடியிருப்புகளைச் சுற்றிலும்
  rationale: מִשְׁכָּן இங்கு கூடாரங்கள் என்று மட்டும் வரையறுக்காமல் வாழும் இடங்களைப் பொதுவாகக் குறிக்கிறது. לְ உடன் סָבִיב அமைவது ‘குடியிருப்புகளைச் சுற்றிலும்’ என்ற இடப்பொருளைத் தருகிறது.
