translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைநடையின் இணை அமைப்பைப் பேணும் வகையில் இரண்டு அடிகளாக வழங்கப்பட்டது. ‘விழச் செய்தார்’ என்ற வினை இரண்டாம் அடியிலும் மீண்டும் இடப்பட்டிருப்பது, தமிழில் வாக்கியத்தை முழுமையாகவும் தெளிவாகவும் வைத்திருக்கிறது.
