  source_fidelity: வַיַּפֵּל என்ற ஹிஃபில் வினைச்சொல்லின் காரணவினைப் பொருள் ‘விழச் செய்தார்’ என்பதில் துல்லியமாக உள்ளது. முந்தைய வசனத்தில் உள்ள காடைகளையே ‘அவற்றை’ குறிக்கிறது. בְּקֶרֶב மַחֲנֵהוּ என்பதன் ‘முகாமின் நடுவில்’ என்ற உட்புற இடப்பொருளும், סָבִיב לְמִשְׁכְּנֹתָיו என்பதன் ‘குடியிருப்புகளைச் சுற்றிலும்’ என்ற பரவல்/சுற்றுப்புறப் பொருளும் பாதுகாக்கப்பட்டுள்ளன.
  naturalness: இரு அடிகளாக அமைந்த நடை நவீன நிலையான தமிழில் இயல்பாகவும் சங்கீதக் கவிதைநடைக்குப் பொருத்தமாகவும் உள்ளது. இரண்டாவது அடியில் ‘விழச் செய்தார்’ மீண்டும் வருவது மூலத்தில் வெளிப்படையாக இல்லாவிட்டாலும், தமிழில் கருத்தை முழுமையாகத் தரும் இயல்பான ellipsis-நிரப்பல்; பொருளை மாற்றவில்லை.
  terminology: ‘முகாம்’ மற்றும் ‘குடியிருப்புகள்’ சூழலுக்கும் எபிரெயச் சொற்களுக்கும் பொருத்தமானவை. ஒருமை உடைமைப்பின்னொட்டுகளின் கூட்டுப்பொருளை ‘அவர்களுடைய’ எனக் கொடுத்திருப்பதற்கான அடிக்குறிப்பு துல்லியமாகவும் வெளிப்படையாகவும் உள்ளது.
