translation:
  language: ta
  text: ஆனாலும், அவர் மேலே உள்ள மேகங்களுக்குக் கட்டளையிட்டார்[a]; வானத்தின் கதவுகளைத் திறந்தார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மேலே உள்ள வானவெளிகளுக்குக் கட்டளையிட்டார்.’
    reason: lexical_alternative
  - marker: b
    text: ‘வானத்தின் வாசல்களைத் திறந்தார்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: கட்டளையிட்டார்
  rationale: צוה என்பதன் இயல்பான பொருள் ‘கட்டளையிடுதல்’. இங்கு இறைவனின் அதிகாரமுள்ள செயலைத் தெளிவாகவும் சுருக்கமாகவும் காட்டுகிறது; முன்னொட்டான வாவுடன் வரும் வினை, கடந்தகாலக் கதைநடையாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: שְׁחָקִים
  choice: மேகங்கள்
  rationale: שׁחקים என்பது ‘மேகங்கள்’ அல்லது ‘வானவெளிகள்’ எனப் பொருள்படலாம். தொடர்ந்து வானத்தின் கதவுகள் திறக்கப்படுவதும், பின்னணியில் மன்னா பொழிவதும் கூறப்படுவதால் ‘மேகங்கள்’ என்பது இயல்பான, உருவகத்தைத் தக்கவைக்கும் தேர்வு.
- source_word: מִמָּעַל
  choice: மேலே உள்ள
  rationale: இந்தச் சொல் உயர்ந்த இடத்தையோ ‘மேலிருந்து/மேலே’ என்பதையோ குறிக்கிறது. தமிழில் ‘மேலே உள்ள மேகங்கள்’ என்பது இடத்தைக் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: דַלְתֵי
  choice: கதவுகள்
  rationale: דלת என்பதன் நேரடியான பொருள் ‘கதவு’. பன்மை உடைமைத் தொடரான דַלְתֵי שָׁמַיִם, ‘வானத்தின் கதவுகள்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது; ‘வாசல்கள்’ என்பதும் சாத்தியம்.
- source_word: שָׁמַיִם
  choice: வானம்
  rationale: שׁמים என்பது சூழலுக்கேற்ப ‘வானம்’, ‘வானங்கள்’ அல்லது ‘வானவெளி’ எனலாம். ‘வானத்தின் கதவுகள்’ என்பது தமிழில் இயல்பாகவும் கவித்துவ உருவகத்தைத் தக்கவைத்தும் உள்ளது.
- source_word: פָּתָח
  choice: திறந்தார்
  rationale: פתח என்பதன் நேரடியான பொருள் ‘திறத்தல்’. மூலத்தில் இல்லாத தீவிரத்தையோ கூடுதல் கருத்தையோ சேர்க்காமல் எளிய வினைச்செயலைத் தக்கவைக்கிறது.
- source_word: וַ
  choice: ஆனாலும்
  rationale: வாவ் இணைப்புச்சொல் பொதுவாக ‘மற்றும்/அப்போது’ என வரலாம். ஆனால் முன்சூழலில் இஸ்ரவேலரின் நம்பிக்கையின்மைக்கும் இறைவன் தொடர்ந்து வழங்கியதற்கும் உள்ள முரண்பாட்டை இங்கு ‘ஆனாலும்’ இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: இஸ்ரவேலரின் நம்பிக்கையின்மைக்கும் இறைவனின் வழங்குதலுக்கும் இடையில் தொடக்க வாவ் காட்டும் உரைநடைத் தொடர்பு
  choice: முரண்பாட்டை வெளிப்படுத்தும் ‘ஆனாலும்’
  alternative: ‘மேலும்’ அல்லது ‘அப்போது’
  rationale: எபிரெய இணைப்புச்சொல் தனியாகப் பலவகை உறவுகளைக் குறிக்கக்கூடியது. சங்கீதத்தின் உடனடிச் சூழல், மக்களின் நம்பிக்கையின்மையையும் அதற்கிடையிலும் இறைவன் உணவு வழங்கியதையும் எதிரெதிராக நிறுத்துவதால், ‘ஆனாலும்’ அந்த இறையியல் பதற்றத்தைத் தீர்த்துவிடாமல் வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் சங்கீதத்திற்குரிய கண்ணியமான கவித்துவ நடையுடனும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘வானத்தின் கதவுகள்’ என்ற மூல உருவகம் நேரடியாகத் தக்கவைக்கப்பட்டுள்ளது.
