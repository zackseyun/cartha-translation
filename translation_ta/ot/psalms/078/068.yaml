  yaml_path: translation/ot/psalms/078/068.yaml
  text: But he chose the tribe of Judah[b][a], Mount Zion which he loved.
translation:
  language: ta
  text: ஆனால் அவர் யூதா கோத்திரத்தையும், தாம் நேசித்த சீயோன் மலையையும் தேர்ந்தெடுத்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘தேர்ந்தெடுத்தார்’ என்ற ஒரே வினைக்கு ‘யூதா கோத்திரம்’, ‘சீயோன் மலை’ என்ற இரண்டு நேர்செயப்படுபொருள்கள் உள்ளன; இடையில் ‘மற்றும்’ என்பதற்கான தனிச்சொல் இல்லை.
    reason: source_syntax
lexical_decisions:
- source_word: וַיִּבְחַר
  choice: ஆனால் அவர் ... தேர்ந்தெடுத்தார்
  rationale: בחר என்பதன் அடிப்படைப் பொருள் ‘தேர்ந்தெடு’. முந்தைய வசனத்தில் எப்பிராயீம் நிராகரிக்கப்பட்டதற்கு மாறாக யூதா தேர்ந்தெடுக்கப்படுவதைச் சூழல் காட்டுவதால், தொடர்ச்சிக்கான וַ இங்கு இயல்பான தமிழில் ‘ஆனால்’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: שֵׁבֶט יְהוּדָה
  choice: யூதா கோத்திரம்
  rationale: இஸ்ரவேலின் குல அமைப்பைக் குறிக்கும் שֵׁבֶט என்பதற்கு நவீன வேதாகமத் தமிழில் பரவலாகப் புரிந்துகொள்ளப்படும் ‘கோத்திரம்’ பொருத்தமானது.
- source_word: הַר צִיּוֹן
  choice: சீயோன் மலை
  rationale: இடப்பெயரான צִיּוֹן மற்றும் הַר (‘மலை’) ஆகிய இரண்டையும் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: אֲשֶׁר אָהֵב
  choice: தாம் நேசித்த
  rationale: உடனடியாக முந்திய ‘சீயோன் மலை’யை உறவுப்பெயரெச்சத் தொடர் விளக்குகிறது. இறைவனைக் குறிக்கும் ‘அவர்’ என்பதோடு பொருந்தும் மரியாதைத் தற்சுட்டாக ‘தாம்’ பயன்படுத்தப்பட்டது.
- source_word: אֶת ... אֶת
  choice: '...கோத்திரத்தையும், ...மலையையும்'
  rationale: எபிரெயத்தில் ஒரே ‘தேர்ந்தெடுத்தார்’ வினைக்கு இரண்டு நேர்செயப்படுபொருள்கள் குறிக்கப்படுகின்றன. தமிழில் ‘-ஐயும் ... -ஐயும்’ அமைப்பு அவற்றை இரு இணையான செயப்படுபொருள்களாக இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: இறைவன் யூதாவையும் சீயோன் மலையையும் தேர்ந்தெடுத்ததன் தொடர்பு
  choice: யூதா கோத்திரமும் சீயோன் மலையும் ஒரே வினையின் இரு செயப்படுபொருள்களாக மொழிபெயர்க்கப்பட்டன.
  alternative: ‘சீயோன் மலை’ என்பதை ‘யூதா கோத்திரம்’ என்பதற்கான விளக்க இணைப்பாக வாசித்தல்.
  rationale: இரண்டு பெயர்த்தொடர்களுக்கும் முன் אֶת வருவதால், இரண்டையும் ‘தேர்ந்தெடுத்தார்’ என்பதன் செயப்படுபொருள்களாகக் கொள்வது இலக்கண ரீதியாக நேரடியானது. வசனத்திற்கு அப்பாற்பட்ட தேர்தல் கோட்பாட்டு விளக்கம் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை. ‘கோத்திரம்’, ‘சீயோன்’ ஆகிய பரவலான வேதாகமச் சொற்கள் தக்கவைக்கப்பட்டுள்ளன; எபிரெயத்தின் இரட்டைச் செயப்படுபொருள் அமைப்பு இயல்பான தமிழ் இணைப்பால் தெளிவாக்கப்பட்டுள்ளது.
