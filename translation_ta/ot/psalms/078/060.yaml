id: PSA.78.60
reference: Psalms 78:60
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ֭/יִּטֹּשׁ מִשְׁכַּ֣ן שִׁל֑וֹ אֹ֝֗הֶל שִׁכֵּ֥ן בָּ/אָדָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/060.yaml
  text: So he abandoned the tabernacle of Shiloh[b][a], the tent where he dwelt among mankind.
translation:
  language: ta
  text: அவர் சீலோவின் திருவாசஸ்தலத்தை, மனிதர்களிடையே அவர் நிறுவிய கூடாரத்தை, கைவிட்டார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּטֹּשׁ
  choice: கைவிட்டார்
  rationale: נטשׁ என்பது முற்றிலும் விட்டுவிடுதல் அல்லது புறக்கணித்துச் செல்லுதல் என்ற வலிமையான பொருளைக் கொண்டது. ‘கைவிட்டார்’ என்பது தெய்வீக விலகலை மேலதிக விளக்கமின்றி இயல்பாகத் தெரிவிக்கிறது.
- source_word: מִשְׁכַּן
  choice: திருவுறைவிடம்
  rationale: מִשְׁכָּן என்பது கடவுளின் உறைவிடமாகிய வழிபாட்டுத் தலத்தைக் குறிக்கிறது. ‘திருவுறைவிடம்’ அதன் புனிதத்தையும் ‘உறைதல்’ என்ற சொல்லடிப்படையையும் காக்கிறது; அடுத்துள்ள אֹהֶל என்பதிலிருந்து இதை வேறுபடுத்தவும் உதவுகிறது.
- source_word: שִׁלֹה
  choice: சீலோ
  rationale: எபிரெய இடப்பெயர் தமிழில் இயல்பான ஒலிபெயர்ப்பாக வழங்கப்பட்டுள்ளது.
- source_word: אֹהֶל
  choice: கூடாரம்
  rationale: אֹהֶל என்பதன் நேரான பொருள் ‘கூடாரம்’. முந்தைய מִשְׁכַּן என்பதுடன் உள்ள கவிதை இணைப்பைச் சொற்களை ஒன்றாக்காமல் காக்கிறது.
- source_word: שִׁכֵּן
  choice: தாம் தங்கியிருந்த
  rationale: இச்சூழலில் சீலோவிலிருந்த கூடாரத்தோடு தொடர்புடைய கடவுளின் வாசத்தை இது இயல்பாக எடுத்துரைக்கிறது. எபிரெய வினையின் காரணவினை அல்லது நிறுவுதல் சார்ந்த நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: בָּאָדָם
  choice: மனிதர்களிடையே
  rationale: אָדָם இங்கு ஓர் ஆணைத் தனிப்படக் குறிக்காமல் மனிதகுலத்தைத் தொகுப்பாகக் குறிக்கிறது. ‘மனிதர்களிடையே’ என்பது நவீன தமிழில் இயல்பாகவும் பாலினத் துல்லியத்துடனும் உள்ளது.
theological_decisions:
- issue: கூடாரத்துடன் தொடர்புடைய உறைதல் மொழியின் பொருள்
  choice: கடவுள் மனிதர்களிடையே தங்கியிருந்த கூடாரம்
  alternative: மனிதர்களிடையே அவர் அமைத்துவைத்த கூடாரம்
  rationale: שִׁכֵּן என்ற பியேல் வடிவம் ‘குடியிருக்கச் செய்தார்/அமைத்தார்’ என்று காரணவினையாகவும், இச்சூழலில் கடவுளின் வாசத்தைக் குறிக்கும் வகையிலும் புரிந்துகொள்ளப்படலாம். முதன்மை உரை சங்கீதத்தின் தெய்வீக வாசக் கருத்தை இயல்பாகத் தருகிறது; அமைத்தல் சார்ந்த வாசிப்பை அடிக்குறிப்பு காக்கிறது.
- issue: אָדָם என்பதன் தொகுப்புப் பொருள்
  choice: மனிதர்களிடையே
  alternative: மனிதகுலத்தின் நடுவில்
  rationale: தனிப்பட்ட ஆண் ஒருவரைக் குறிக்காத எபிரெயத் தொகுப்புச் சொல்லை நவீன தமிழில் தெளிவாகவும் உள்ளடக்கமாகவும் மொழிபெயர்க்கிறது.
translation_notes:
  register: நவீன, கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘திருவுறைவிடம்’ மற்றும் ‘கூடாரம்’ என்ற வேறுபாடு எபிரெய இணைநிலையின் இரு சொற்களையும் காக்கிறது. இடைச்செருகலை நீண்ட கோடுகளால் அமைத்தது இரண்டாம் அடியை முதலாம் அடிக்கான கவிதை மறுவிளக்கமாகத் தெளிவுபடுத்துகிறது.
