lexical_decisions:
- source_word: מַשְׂכִּיל
  choice: மஸ்கீல்
  rationale: சங்கீதத் தலைப்புகளில் வரும் பொருள் உறுதியாகத் தெரியாத தொழில்நுட்பச் சொல்லாதலால், ஊகப் பொருளை முதன்மை உரையில் திணிக்காமல் ஒலிபெயர்க்கப்பட்டது.
- source_word: לְאָסָף
  choice: ஆசாபின்
  rationale: இந்த எபிரெய முன்னிடைச்சொல் ஆசிரியத்துவம், தொடர்பு, அல்லது அர்ப்பணிப்பு போன்ற உறவைக் குறிக்கக்கூடும்; இயல்பான தமிழ்த் தலைப்பாக ‘ஆசாபின்’ என வழங்கி அந்தச் சுருக்கமான உறவுமுறையைப் பேணுகிறது.
- source_word: תּוֹרָתִי
  choice: என் போதனை
  rationale: இங்கு தோரா என்பது சட்டத் தொகுப்பை மட்டும் அல்லாமல் அறிவுரை அல்லது போதனையையும் குறிக்கிறது; சங்கீதத்தின் ஞானப் போதனைச் சூழலுக்கு ‘போதனை’ இயல்பாகப் பொருந்துகிறது.
- source_word: הַאֲזִינָה ... הַטּוּ אָזְנְכֶם
  choice: செவிகொடுங்கள் ... உங்கள் செவிகளைச் சாயுங்கள்
  rationale: கவனமாகக் கேட்கும்படி அழைக்கும் இணையான கட்டளைகளையும், இரண்டாவது சொற்றொடரின் உடலுறுப்பு உருவகத்தையும் தமிழில் பேணுகிறது.
