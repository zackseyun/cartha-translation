  text: Before their fathers he did wonders in the land of Egypt[b][a], in the fields of Zoan.
translation:
  language: ta
  text: அவர்களுடைய தந்தையரின் கண்முன்னே அவர் ஒரு வியப்பூட்டும் செயலைச் செய்தார்—எகிப்து நாட்டில், சோவானின் வயல்வெளியில்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், ‘சோவானின் வயல்’; இது சோவானைச் சுற்றிய வயல்வெளிகளையோ அதன் பிரதேசத்தையோ குறிக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: נֶגֶד
  choice: கண்முன்னே
  rationale: ஒருவரின் முன்னிலையில் அல்லது பார்வைக்கு உட்பட்டு என்பதே இங்கு பொருள். ‘கண்முன்னே’ என்பது அச்செயல்கள் அவர்களால் காணப்பட்டதை இயல்பான நவீனத் தமிழில் தெளிவாகக் கூறுகிறது.
- source_word: אֲבוֹתָם
  choice: அவர்களுடைய தந்தையர்
  rationale: எபிரெயச் சொல் நேரடியாக ‘அவர்களுடைய தந்தையர்’ எனப் பொருள்படும்; சூழலில் இஸ்ரவேலின் முற்பிதாக்களைக் குறித்தாலும், குடும்ப மற்றும் உடன்படிக்கை சார்ந்த மூலச் சொல்லாட்சியை இது காக்கிறது.
- source_word: עָשָׂה פֶלֶא
  choice: வியத்தகு செயல்களைச் செய்தார்
  rationale: פֶלֶא ஒருமை வடிவில் இருந்தாலும் இச்சூழலில் கூட்டுப் பொருளில் அமையலாம். ‘வியத்தகு செயல்கள்’ என்பது அதிசயத்தன்மையை வெளிப்படுத்துகிறது; ‘அற்புதங்கள்’ என்பதில் ஏற்படக்கூடிய கூடுதல் இறையியல் வகைப்படுத்தலைத் தவிர்க்கிறது.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: எகிப்து நாட்டில்
  rationale: மூலத்தில் உள்ள ‘நாடு’ என்ற புவியியல் கூறைத் தக்கவைத்து இயல்பான தமிழில் வழங்குகிறது.
- source_word: שְׂדֵה צֹעַן
  choice: சோவான் பிரதேசத்தில்
  rationale: சொல்லுக்கு நேரடியாக ‘சோவானின் வயல்’ எனப் பொருள் இருந்தாலும், நகரைச் சுற்றிய வயல்வெளி அல்லது பகுதியைக் குறிக்கும் இடப்பெயர்ச் சொல்லாட்சியாக இங்கு அமைகிறது. ‘பிரதேசம்’ தமிழில் அந்தப் பொருளை இயல்பாகத் தருகிறது.
