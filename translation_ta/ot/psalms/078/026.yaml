  yaml_path: translation/ot/psalms/078/026.yaml
  text: He stirred up the east wind in the heavens[b][a], and by his strength he guided the south wind.
translation:
  language: ta
  text: வானங்களில் கிழக்குக் காற்றை எழுப்பினார்[a]; தமது வல்லமையால் தென்காற்றை வழிநடத்தினார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வானங்களில் கிழக்குக் காற்றைப் புறப்படச் செய்தார்.’
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், ‘தெற்கு’; கிழக்குக் காற்றுடன் உள்ள இணைவரிசையால் இங்கு ‘தென்காற்று’ எனப் பொருள்படும் வாய்ப்பு அதிகம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַסַּע
  choice: எழும்பச் செய்தார்
  rationale: נסע என்பதன் ஹிஃபில் வடிவம் அடிப்படையில் ‘புறப்படச் செய்தல்’ எனப் பொருள்படும். காற்றைக் குறிக்கும் இச்சூழலில், கடவுள் அதைக் கிளம்பி வீசச் செய்தார் என்ற இயக்கத்தையும் தெய்வீகச் செயலையும் ‘எழும்பச் செய்தார்’ இயல்பாகத் தெரிவிக்கிறது.
- source_word: קָדִים
  choice: கீழ்க்காற்றை
  rationale: קָדִים பொதுவாகக் கிழக்கிலிருந்து வீசும் காற்றைக் குறிக்கிறது. தமிழின் இயல்பான திசைக்காற்றுச் சொல்லான ‘கீழ்க்காற்று’ கவிதைநடையையும் பொருளையும் காக்கிறது.
- source_word: בַּשָּׁמָיִם
  choice: வானங்களில்
  rationale: שָׁמַיִם என்பதன் எபிரெய பன்மை வடிவத்தையும் சங்கீதத்தின் கவிதைச் செறிவையும் காக்க ‘வானங்களில்’ என்று மொழிபெயர்க்கப்பட்டது; இங்கு காற்று இயங்கும் வானவெளியே குறிப்பு.
- source_word: וַיְנַהֵג
  choice: வழிநடத்தினார்
  rationale: נהג என்பதற்கு ‘நடத்துதல், வழிநடத்துதல், ஓட்டுதல்’ என்ற பொருட்கள் உண்டு. காற்றின் திசையை கடவுள் கட்டுப்படுத்தி நடத்துவதை ‘வழிநடத்தினார்’ தெளிவாகக் காட்டுகிறது.
- source_word: בְּעֻזּוֹ
  choice: தமது வலிமையால்
  rationale: עֹז என்பது வலிமை, ஆற்றல், வல்லமை என்பவற்றைக் குறிக்கும். முன்னிடைச்சொல்லுடன் சேர்ந்த வடிவம் செயல் நிகழும் சாதனத்தைக் காட்டுவதால் ‘தமது வலிமையால்’ நேரடியான மொழிபெயர்ப்பு.
- source_word: תֵימָן
  choice: தென்காற்றை
  rationale: תֵימָן சொல்லளவில் ‘தெற்கு’ அல்லது ‘தென்பகுதி’ எனினும், இணையான முதல் அடியிலுள்ள קָדִים மற்றும் காடைகளை வரவழைக்கும் சூழல் காரணமாக இங்கு ‘தென்காற்று’ என்பது இயல்பான மறைபொருள் நிறைவு.
theological_decisions:
- issue: இயற்கைச் சக்திகள்மீது கடவுளின் செயற்பாடு
  choice: காற்றை எழும்பச் செய்து வழிநடத்துபவராகக் கடவுளை நேரடியாகக் காட்டுதல்
  alternative: காற்றுகள் தாமாக எழுந்து வீசியதாகச் செயப்படாத அல்லது தன்மைப் பொருளில் மொழிபெயர்த்தல்
  rationale: இரு வினைகளுக்கும் கடவுளே எழுவாயாக உள்ளார். இஸ்ரவேலருக்கு உணவு வழங்க இயற்கைச் சக்திகளை அவர் இயக்குவதைச் சங்கீதச் சூழல் வலியுறுத்துகிறது; அதற்கு அப்பாற்பட்ட கோட்பாட்டைச் சேர்க்காமல் இந்தச் செயற்பாடு காக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘கீழ்க்காற்று’ என்பது கிழக்கிலிருந்து வீசும் காற்றுக்கான மரபான தமிழ்ச் சொல்; பரந்த வாசகர் புரிதலுக்காக வேண்டுமெனில் ‘கிழக்குக் காற்று’ என்றும் அமைக்கலாம். எபிரெய வினையின் ‘புறப்படச் செய்தார்’ என்ற சொற்சார்ந்த மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது. ‘தெற்கு’ என்பதிலுள்ள மறைந்த ‘காற்று’ இணைவரிசையின் அடிப்படையில் உரையிலேயே வெளிப்படுத்தப்பட்டுள்ளது.
