  text: He split rocks in the wilderness and gave them drink abundantly[a], as from the great depths.
translation:
  language: ta
  text: அவர் வனாந்தரத்தில் பாறைகளைப் பிளந்து, பெரும் ஆழ்நீர்களிலிருந்து வருவதுபோல் அவர்களுக்குக் குடிக்கக் கொடுத்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பெரும் ஆழ்நீரிலிருந்து அவர்களுக்குக் குடிக்கக் கொடுத்தார்.”
    reason: כִּתְהֹמוֹת רַבָּה என்பதிலுள்ள כְּ-ஒப்புமையை, ‘ஆழ்நீரிலிருந்து’ என்ற நேரடியான மூல/வழி உணர்வாகப் புரிந்துகொள்ளும் சொற்பொருள் மாற்று.
lexical_decisions:
- source_word: יְבַקַּע
  choice: பிளந்து
  rationale: בקע என்பதன் பியேல் வடிவம் வலிமையாகப் பிளத்தல் அல்லது திறத்தலைக் குறிக்கிறது; ‘பிளந்து’ என்பது அந்தத் தெளிவான செயற்படிமத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: צֻרִים
  choice: பாறைகளை
  rationale: צוּר என்பதன் பன்மை பெரிய பாறைகள் அல்லது பாறைத்திரள்களைக் குறிக்கிறது; ‘பாறைகள்’ பன்மையையும் காட்சியையும் நேரடியாகக் காக்கிறது.
- source_word: בַּמִּדְבָּר
  choice: வனாந்தரத்தில்
  rationale: מִדְבָּר என்பது மக்கள் குடியிருப்பில்லாத வறண்ட வனாந்தரப் பகுதியைக் குறிக்கலாம்; ‘வனாந்தரம்’ இஸ்ரவேலின் பயணச் சூழலை மிகையாகக் குறுக்காமல் தெரிவிக்கிறது.
- source_word: וַיַּשְׁקְ
  choice: அவர்களுக்குக் குடிக்கக் கொடுத்தார்
  rationale: שׁקה என்பதன் ஹிப்ஃபீல் வடிவம் ‘குடிக்கச் செய்தல்/குடிக்கக் கொடுத்தல்’ என்று பொருள்படும். சூழலில் மறைந்துள்ள பெறுநர்கள் இஸ்ரவேல் மக்கள் என்பதால் ‘அவர்களுக்கு’ இயல்பாகச் சேர்க்கப்பட்டுள்ளது.
- source_word: כִּתְהֹמוֹת
  choice: ஆழ்நீர்களிலிருந்து கொடுப்பதுபோல்
  rationale: כְּ ஒப்புமையையும் תְּהֹמוֹת ஆழமான பெருநீர்ப்பரப்புகளையும் குறிக்கின்றன. தமிழில் ஒப்புமையும் நீரின் ஆழப் படிமமும் தெளிவாக இருக்க இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: רַבָּה
  choice: பெரும்
  rationale: רַבָּה இங்கு ஆழ்நீர்களின் அளவு அல்லது மிகுதியை வலுப்படுத்துகிறது; ‘பெரும்’ கவித்துவமான பரப்பையும் மிகுதியையும் சுருக்கமாகக் காக்கிறது.
theological_decisions:
- issue: தண்ணீர் வழங்கப்பட்ட விதத்தைச் சித்தரிக்கும் ஆழ்நீர் உருவகம்
  choice: ‘பெரும் ஆழ்நீர்களிலிருந்து கொடுப்பதுபோல்’ என்ற ஒப்புமையைத் தக்கவைத்தல்
  alternative: ‘மிகுதியாகக் குடிக்கக் கொடுத்தார்’ அல்லது ‘வல்ல ஆழ்நீரிலிருந்து குடிக்கக் கொடுத்தார்’
  rationale: כְּ குறிக்கும் ஒப்புமையைப் பாதுகாப்பதால், இது நிலத்தடி நீர்த்தேக்கங்களைப் பற்றிய நேரடியான பிரபஞ்சவியல் கூற்றாகவும் வெறும் மிகுதியைக் குறிக்கும் உரையாகவும் மாற்றப்படவில்லை.
