  text: Therefore Yahweh heard and was enraged[a]; and a fire was kindled against Jacob[c][b], and anger also rose against Israel.
translation:
  language: ta
  text: ஆகையால், யாவே கேட்டுக் கடுங்கோபமடைந்தார்[a]; யாக்கோபுக்கு எதிராக நெருப்பு மூண்டது[b], இஸ்ரவேலுக்கு எதிராகவும் கோபம் எழுந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கோபப்படத் தூண்டப்பட்டார்.’
    reason: lexical_alternative
  - marker: b
    text: ‘யாக்கோபுக்கு எதிராக’ மற்றும் ‘இஸ்ரவேலுக்கு எதிராக’ என்பவை சொல்லுக்குச் சொல் முறையில் ‘யாக்கோபில்’ மற்றும் ‘இஸ்ரவேலில்’; இங்கு தண்டனை சார்ந்த சூழலால் ‘எதிராக’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
