  alternative: ‘ஏனெனில்’ என்று விளக்க உறவாக வெளிப்படுத்துதல்
  rationale: וְ என்பதன் அடிப்படை இணைப்புப் பொருளும், நெருப்பும் கோபமும் இணையாக வரும் கவிதை அமைப்பும் பாதுகாக்கப்படுகின்றன; விளக்க உறவைத் திணிக்கவில்லை.
