  register: நவீன தரநிலைத் தமிழ்; வழிபாட்டு மரியாதையைத் தக்கவைத்தாலும் சாதாரண வாசகர்களுக்கு எளிதில் புரியும் நடை. கவிதை இணைநிலையும் தெய்வீகக் கோபத்தின் தீவிரமும் காக்கப்பட்டுள்ளன. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
