  source_fidelity: திருத்தம் தேவை. எபிரெயத்தில் கேட்டதற்கான வெளிப்படையான பொருள் இல்லை; ‘அதைக்’ சேர்ப்பது முந்தைய சூழலைக் குறிப்பிட்டாலும், இவ்வசனத்தின் சொல்-நிலைத் திறந்த தன்மையைக் குறைக்கிறது. மேலும் יהוה-க்கு ஆங்கில POB வழித்தடம் பின்பற்றும் ‘Yahweh’ ஒலிபெயர்ப்புடன் ‘யாவே’ பொருந்துகிறது; ‘யெகோவா’ வேறுபட்ட பாரம்பரிய வடிவம். נִשְּׂקָה என்பதன் ‘kindled’ கருத்தை ‘மூண்டது’ இயல்பாகத் தருகிறது.
