base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/070.yaml
  text: He chose David his servant and took him from the sheepfolds[a].
translation:
  language: ta
  text: அவர் தமது ஊழியனாகிய தாவீதைத் தேர்ந்தெடுத்து, ஆட்டுத் தொழுவங்களிலிருந்து[a] அவனை எடுத்துக்கொண்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பட்டிகளிலிருந்து” அல்லது “வேலியிட்ட அடைப்புகளிலிருந்து.”
    reason: מִכְלְאֹת என்பது கால்நடைகளுக்கான அடைக்கப்பட்ட இடங்களைக் குறிக்கிறது; சூழலில் צֹאן உடன் சேர்ந்து ஆடுகள் அல்லது சிறுகால்நடை மந்தையுடன் தொடர்புடைய தொழுவங்களைக் குறிக்கிறது.
lexical_decisions:
- source_word: וַיִּבְחַר
  choice: தேர்ந்தெடுத்து
  rationale: בחר என்பதன் Qal wayyiqtol வடிவம்; கடவுள் தாவீதைத் தேர்வு செய்ததை இயல்பான நவீன தமிழில் தெரிவிக்கிறது. அடுத்த தொடர்வினையுடன் இணைக்க வினையெச்ச வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: בְּדָוִד
  choice: தாவீதை
  rationale: எபிரெயப் பெயரின் வழக்கமான தமிழாக்கம்; בְ இங்கு בחר வினையோடு வரும் இலக்கணப் பயன்பாடு என்பதால் தமிழில் நேரடி செயப்படுபொருளாக அமைக்கப்பட்டுள்ளது.
- source_word: עַבְדּוֹ
  choice: தமது ஊழியனாகிய
  rationale: עבד இங்கு அடிமைத்தனத்தை முன்னிறுத்தாமல், கடவுளுக்குச் சேவை செய்கிற தாவீதின் மதிப்புக்குரிய நிலையைச் சுட்டுகிறது. ‘தமது’ என்பது எழுவாயான கடவுளையே தெளிவாகக் குறிக்கிறது.
- source_word: וַיִּקָּחֵהוּ
  choice: அவனை அழைத்துக்கொண்டார்
  rationale: לקח என்பதன் அடிப்படைப் பொருள் ‘எடுத்துக்கொள்’. இச்சூழலில் மேய்ப்புப் பணியிலிருந்து தாவீதைத் தம்மிடம் எடுத்துக்கொண்ட செயலை நவீன தமிழில் இயல்பாகத் தெரிவிக்க ‘அழைத்துக்கொண்டார்’ தேர்ந்தெடுக்கப்பட்டது; ‘கொண்டுவந்தார்’ என்பதையும் சாத்தியமாக விட்டுவைக்கிறது.
- source_word: מִמִּכְלְאֹת צֹאן
  choice: ஆட்டுக்கிடைகளிலிருந்து
  rationale: מִכְלְאֹת என்பது கால்நடைகளை அடைக்கும் வேலியிட்ட இடங்களையும் צֹאן என்பது செம்மறியாடுகள், வெள்ளாடுகள் உள்ளிட்ட சிறுகால்நடை மந்தையையும் குறிக்கலாம். தமிழில் ‘ஆட்டுக்கிடைகள்’ மேய்ப்புச் சூழலைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: கடவுளுடனான உறவில் தாவீதின் עבד நிலை
  choice: தமது ஊழியனாகிய
  alternative: தமது அடிமையாகிய
  rationale: இங்கு சொல் தாவீதின் கடவுள் சேவையையும் அவருக்குரிய மதிப்புமிக்க பணிநிலையையும் குறிக்கிறது; கட்டாய அடிமைநிலையை உரை முன்னிறுத்தவில்லை. ஆகவே ‘ஊழியன்’ சூழலுக்கு ஏற்றது.
- issue: וַיִּקָּחֵהוּ என்பதில் உள்ள ‘எடுத்தல்’ மற்றும் அழைப்பு நுணுக்கம்
  choice: அவனை அழைத்துக்கொண்டார்
  alternative: அவனை எடுத்துக்கொண்டார்
  rationale: தமிழில் நேரடியான ‘எடுத்துக்கொண்டார்’ ஒருவரை பொருள்போல் எடுத்தல் என்ற தேவையற்ற ஒலிப்பைத் தரக்கூடும். ‘அழைத்துக்கொண்டார்’ மேய்ப்பிடத்திலிருந்து புதிய பணிக்குக் கொண்டுவரப்பட்டதை இயல்பாகக் காட்டுகிறது; அரசனாக்கினார் என்று வெளிப்படையாகச் சேர்த்து உரையைத் தீர்மானிக்கவில்லை.
translation_notes:
  register: மொழிநடை நவீன, பொதுவாகப் புரியும், மரியாதைமிக்க தரத் தமிழில் அமைந்துள்ளது. எபிரெயக் கவிதை வரியின் தொடர்ச்சியை இயல்பான தமிழ் வாக்கியமாக்கியபோதும், தேர்ந்தெடுத்தல், ஊழியன் நிலை, மேய்ப்புச் சூழல் ஆகிய மையக் கூறுகள் பாதுகாக்கப்பட்டுள்ளன.
