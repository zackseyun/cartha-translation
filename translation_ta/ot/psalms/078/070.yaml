revisions:
- from: அவர் தமது ஊழியனாகிய தாவீதைத் தேர்ந்தெடுத்து, ஆட்டுக்கிடைகளிலிருந்து[a] அவனை அழைத்துக்கொண்டார்.
  to: அவர் தமது ஊழியனாகிய தாவீதைத் தேர்ந்தெடுத்து, ஆட்டுத் தொழுவங்களிலிருந்து[a] அவனை எடுத்துக்கொண்டார்.
  rationale: The revision replaces the interpretive ‘அழைத்துக்கொண்டார்’ with ‘எடுத்துக்கொண்டார்’ to match the direct force of וַיִּקָּחֵהוּ. It also uses ‘ஆட்டுத் தொழுவங்கள்’ for a clear, idiomatic rendering of sheepfolds, while retaining lexical alternatives in the footnote. No theological interpretation has been added.
