  text: He gave his strength to captivity[c][b][a], and his splendor into the hand of the foe.
translation:
  language: ta
  text: 'தமது வல்லமையைச் சிறையிருப்புக்கு ஒப்புக்கொடுத்தார்[a];

    தமது மகிமையைப் பகைவனின் கையில் ஒப்புக்கொடுத்தார்[b][c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தமது வல்லமையைச் சிறையிருப்புக்கு அளித்தார்’ என்றும் மொழிபெயர்க்கலாம். இச்சொற்றொடர் இஸ்ரவேலின் நடுவில் கடவுளுடைய வல்லமைக்கு அடையாளமாக இருந்த உடன்படிக்கைப் பெட்டியைக் குறிப்பதாக இருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘மகிமை’ என்பதற்கான எபிரெயச் சொல் ‘சிறப்பு’, ‘மாட்சிமை’ அல்லது ‘அழகு’ என்றும் பொருள்படும்.
    reason: lexical_alternative
  - marker: c
    text: ‘பகைவனின் கையில்’ என்பது பகைவனின் அதிகாரத்திற்குள் என்பதாகும்.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: ஒப்புக்கொடுத்தார் / கொடுத்தார்
  rationale: נתן என்பதன் அடிப்படைப் பொருள் ‘கொடுத்தார்’. முதல் அடியில் சூழல் பிறரிடம் பிடிபட அனுமதித்ததைக் குறிப்பதால் ‘ஒப்புக்கொடுத்தார்’ இயல்பாக உள்ளது; இரண்டாம் அடியில் ‘கையில் கொடுத்தார்’ எபிரெய உருவகத்தைத் தெளிவாகக் காக்கிறது.
- source_word: לַשְּׁבִי
  choice: சிறையிருப்புக்கு
  rationale: שְׁבִי இங்கு சிறைபிடிக்கப்படுதல் அல்லது சிறையிருப்பு என்ற நிலையைச் சுட்டுகிறது. ‘சிறையிருப்புக்கு’ என்பது மூலத்தின் சுருக்கத்தையும் இலக்கையும் காக்கிறது.
- source_word: עֻזּוֹ
  choice: தமது வல்லமை
  rationale: עֹז என்பது வலிமை, ஆற்றல், வல்லமை எனப் பொருள்படும். ‘வல்லமை’ உயர்ந்த கவிதை நடைக்கு ஏற்றதுடன், இங்கு அது எதைக் குறிக்கிறது என்பதை விளக்கிச் சுருக்காமல் விடுகிறது.
- source_word: וְתִפְאַרְתּוֹ
  choice: தமது மகிமை
  rationale: תִּפְאֶרֶת மகிமை, சிறப்பு, அழகு ஆகிய பொருட்களை உடையது. ‘மகிமை’ இச்சூழலில் இயல்பாகவும் கவித்துவமாகவும் உள்ளது; பொருள் வரம்பை அடிக்குறிப்பு பதிவு செய்கிறது.
- source_word: בְיַד
  choice: கையில்
  rationale: ‘கையில்’ என்ற நேரடி உருவகம் ஒருவரின் அதிகாரத்திற்குள் ஒப்புக்கொடுக்கப்படுவதைத் தமிழிலும் தெளிவாக உணர்த்துகிறது.
- source_word: צָר
  choice: பகைவன்
  rationale: צַר என்பது பகைவன் அல்லது எதிரி. ‘பகைவன்’ சங்கீதத்தின் கவிதை நடைக்கு ஏற்ற, தெளிவான தமிழ்ச் சொல்.
theological_decisions:
- issue: ‘தமது வல்லமை’ மற்றும் ‘தமது மகிமை’ என்பவை உடன்படிக்கைப் பெட்டி, பரிசுத்த இடம், அல்லது வெளிப்பட்ட இறைசன்னிதி என்று வெளிப்படையாக அடையாளப்படுத்தப்பட வேண்டுமா?
  choice: முதன்மை உரையில் கவிதைச் சொற்றொடர்களை அடையாளம் தீர்மானிக்காமல் அப்படியே காத்தல்
  alternative: ‘வல்லமை’ என்பது உடன்படிக்கைப் பெட்டியைக் குறிக்கிறது என்று நேரடியாக மொழிபெயர்த்தல் அல்லது இரு சொற்றொடர்களையும் பரிசுத்த இடம்/இறைசன்னிதியுடன் வெளிப்படையாக இணைத்தல்
  rationale: சூழல் உடன்படிக்கைப் பெட்டி பிடிபட்ட நிகழ்வை நினைவூட்டக்கூடும்; ஆனால் எபிரெய உரை அதைப் பெயரிட்டு கூறவில்லை. ஆகவே உண்மையான கவிதை மற்றும் இறையியல் பன்முகத்தன்மை முதன்மை உரையில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் வாசிக்க எளிதான, ஆனால் சங்கீதத்திற்கேற்ற கண்ணியமான கவிதை நடை பயன்படுத்தப்பட்டுள்ளது. ஒரே எபிரெய வினைச்சொல் தமிழில் சூழலுக்கேற்ப ‘ஒப்புக்கொடுத்தார்’ மற்றும் ‘கொடுத்தார்’ என மாறுபடுத்தப்பட்டுள்ளது. ‘அவர்’ என்பதற்குப் பதில் மரியாதைத் தன்னிலை வடிவமான ‘தமது’ பயன்படுத்தப்பட்டு, கடவுளைக் குறிக்கும் இயல்பான தமிழ் நடை பேணப்பட்டுள்ளது.
