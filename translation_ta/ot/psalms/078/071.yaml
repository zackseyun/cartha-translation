  text: from following the nursing ewes he brought him[a], to shepherd Jacob his people[b], and Israel his inheritance.
translation:
  language: ta
  text: 'குட்டிகளுக்குப் பாலூட்டும் பெண் செம்மறியாடுகளின் பின்னால் சென்றுகொண்டிருந்த அவனை அழைத்து வந்து[a],


    தம் மக்களாகிய யாக்கோபையும்


    தம் சுதந்தரமாகிய இஸ்ரவேலையும்[b] மேய்க்கும்படி செய்தார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “குட்டிகளையுடைய பெண் செம்மறியாடுகளின் பின்னாலிருந்து.”
    reason: lexical_alternative
  - marker: b
    text: “சுதந்தரம்” என்பதை “மரபுரிமை” அல்லது “உரிமைப் பங்கு” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאַחַר
  choice: பின்னால் சென்றுகொண்டிருந்த அவனை அங்கிருந்து
  rationale: இந்த எபிரெயச் சொற்றொடர் மந்தையின் பின்னால் செல்வதையும் அங்கிருந்து அழைத்துவரப்படுவதையும் குறிக்கிறது. தமிழில் இயல்பாக இருக்கும்படியும் மேய்ப்புத் தொழிலின் காட்சி நிலைக்கும்படியும் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: עָלוֹת
  choice: குட்டிகளுக்குப் பாலூட்டும் பெண் செம்மறியாடுகள்
  rationale: இச்சூழலில் இச்சொல் பால்குடிக்கும் குட்டிகளையுடைய பெண் செம்மறியாடுகளைக் குறிக்கிறது. பொதுவாக ‘ஆடுகள்’ என்று மட்டும் கூறாமல் மூலத்தின் குறிப்பான மேய்ப்புச் சூழல் காக்கப்பட்டது.
- source_word: הֱבִיאוֹ
  choice: அவனை அங்கிருந்து அழைத்துவந்து
  rationale: Hiphil வடிவிலுள்ள בוא என்பதன் நேரடிப் பொருள் ‘அழைத்துவருதல்/கொண்டுவருதல்.’ முந்தைய சூழலின்படி மறைமுக எழுவாய் கடவுளும், செயப்படுபொருள் தாவீதும் ஆவர்.
- source_word: לִרְעוֹת
  choice: மேய்க்க வைத்தார்
  rationale: רעה என்பது மேய்த்தல், பராமரித்தல், மந்தையை நடத்துதல் ஆகிய பொருள்களை உடையது. மக்களை ஆடுகளாக உருவகிக்கும் அரச–மேய்ப்பர் படிமம் மறையாமல் ‘மேய்க்க’ எனத் தக்கவைக்கப்பட்டது.
- source_word: בְּיַעֲקֹב עַמּוֹ
  choice: தம் மக்களாகிய யாக்கோபை
  rationale: ‘யாக்கோபு’ மற்றும் ‘தம் மக்கள்’ என்பவற்றுக்கிடையிலான விளக்கப் பொருத்தத்தைத் தமிழில் ‘மக்களாகிய’ என்பது தெளிவாகக் காட்டுகிறது.
- source_word: וּבְיִשְׂרָאֵל נַחֲלָתוֹ
  choice: தம் உரிமைச் சொத்தாகிய இஸ்ரவேலை
  rationale: נחלה என்பது சுதந்தரம், உரிமைப் பங்கு அல்லது உரிமைச் சொத்து எனப் பொருள்படலாம். இங்கு இஸ்ரவேல் கடவுளுக்குரிய மக்கள் என்பதைக் காட்டும் இயல்பான நவீனத் தமிழ் வடிவாக ‘உரிமைச் சொத்து’ தேர்ந்தெடுக்கப்பட்டது.
theological_decisions:
- issue: தாவீதின் அழைப்பில் அரச–மேய்ப்பர் உருவகம்
  choice: ‘மேய்க்க’ என்ற மேய்ப்பர் படிமத்தை வெளிப்படையாகத் தக்கவைத்தல்
  alternative: ‘வழிநடத்த’ அல்லது ‘பராமரிக்க’
  rationale: தாவீதின் முந்தைய ஆடு மேய்க்கும் பணியையும் இஸ்ரவேல்மீதான அவரது பிந்தைய பொறுப்பையும் இவ்வசனம் திட்டமிட்டு இணைக்கிறது. ‘மேய்க்க’ என்பது அந்த இலக்கிய மற்றும் இறையியல் இணைப்பை மேலதிகக் கோட்பாட்டைச் சேர்க்காமல் காக்கிறது.
- issue: இஸ்ரவேல் கடவுளின் נחלה எனப்படுதல்
  choice: ‘தம் உரிமைச் சொத்தாகிய இஸ்ரவேல்’
  alternative: ‘தம் சுதந்தரமாகிய இஸ்ரவேல்’ அல்லது ‘தம் உரிமைப் பங்காகிய இஸ்ரவேல்’
  rationale: உடல் வழிச் சொத்துரிமை என்ற ஒரு பொருளுக்கு மட்டும் வசனத்தைச் சுருக்காமல், கடவுளுக்குரிய மக்கள் என்ற உடன்படிக்கைச் சார்ந்த கருத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது; பிற சாத்தியமான சொற்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
translation_notes:
  register: நவீனத் தரத் தமிழில், கவித்துவ இணை அமைப்பைத் தக்கவைத்து மொழிபெயர்க்கப்பட்டது. ‘பெண் செம்மறியாடுகள்’ மற்றும் ‘மேய்க்க’ என்பவை மூலத்தின் குறிப்பான மேய்ப்புச் சொல்லாட்சியைப் பாதுகாக்கின்றன; ‘தம்’ என்பது கடவுளைக் குறிக்கும் மரியாதை ஒருமையாகப் பயன்படுத்தப்பட்டுள்ளது.
