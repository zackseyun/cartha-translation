id: PSA.78.10
reference: Psalms 78:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: לֹ֣א שָׁ֭מְרוּ בְּרִ֣ית אֱלֹהִ֑ים וּ֝/בְ/תוֹרָת֗/וֹ מֵאֲנ֥וּ לָ/לֶֽכֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/010.yaml
  text: They did not keep the covenant of God[a], and they refused to walk in his law.
translation:
  language: ta
  text: அவர்கள் கடவுளின் உடன்படிக்கையைக் கடைப்பிடிக்கவில்லை; அவருடைய திருச்சட்டத்தின்படி[a] நடக்க மறுத்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “போதனையின்படி.” எபிரெய மொழியின் தோரா என்ற சொல் கடவுளின் சட்டம், போதனை அல்லது அறிவுரை ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְרוּ
  choice: கடைப்பிடிக்கவில்லை
  rationale: שׁמר என்பதற்கு காத்தல், பேணுதல், கடைப்பிடித்தல் ஆகிய பொருள்கள் உண்டு. உடன்படிக்கைக்குரிய கீழ்ப்படிதலை இயல்பாகவும் தெளிவாகவும் தெரிவிக்க ‘கடைப்பிடித்தல்’ பொருத்தமானது.
- source_word: בְּרִית אֱלֹהִים
  choice: கடவுளின் உடன்படிக்கை
  rationale: இணைப்புநிலைத் தொடர், கடவுள் ஏற்படுத்திய அல்லது அவருக்குரிய உடன்படிக்கையைக் குறிக்கிறது; நவீன தமிழில் உடைமைத் தொடர்பு இயல்பாக வெளிப்படுகிறது.
- source_word: וּבְתוֹרָתוֹ
  choice: அவருடைய திருச்சட்டத்தின்படி
  rationale: תּוֹרָה சட்டம், போதனை, அறிவுரை என்னும் பொருள் வரம்பைக் கொண்டது. இங்குள்ள உடன்படிக்கைச் சூழலில் அதன் கட்டுப்படுத்தும் தன்மையை ‘திருச்சட்டம்’ தக்கவைக்கிறது; בְ முன்னொட்டு வாழ்வின் நெறி அல்லது அளவுகோலைக் குறிப்பதால் ‘-இன்படி’ இயல்பான தமிழ் வடிவம்.
- source_word: מֵאֲנוּ
  choice: மறுத்தார்கள்
  rationale: מֵאֲנוּ திட்டவட்டமான மறுப்பு அல்லது விருப்பமின்மையைக் குறிக்கிறது; ‘மறுத்தார்கள்’ குற்றச்சாட்டின் வலிமையைத் தெளிவாகக் காக்கிறது.
- source_word: לָלֶכֶת
  choice: நடக்க
  rationale: הלך என்பதன் நேர்ப்பொருள் ‘நடத்தல்’; இங்கு வாழ்க்கை நடத்தையைக் குறிக்கும் வேதாகம உருவகப் பயன்பாடு. ‘நடக்க’ அந்த உருவகத்தையும் இறையியல் நயத்தையும் காக்கிறது.
- source_word: לֹא
  choice: இல்லை
  rationale: எபிரெய எதிர்மறையை, தமிழில் இறந்தகால வினைமுற்றுடன் இயல்பாக ‘கடைப்பிடிக்கவில்லை’ என்று வெளிப்படுத்துகிறது.
theological_decisions:
- issue: உடன்படிக்கைச் சூழலில் תּוֹרָה என்பதன் மொழிபெயர்ப்பு
  choice: திருச்சட்டம்
  alternative: போதனை / அறிவுரை
  rationale: உடன்படிக்கையைக் கடைப்பிடிப்பதுடன் இணையாக வரும் இச்சொல், கடவுள் விதித்த வாழ்க்கை நெறியின் அதிகாரத்தையும் கட்டுப்படுத்தும் வலிமையையும் கொண்டுள்ளது. அதனால் ‘திருச்சட்டம்’ முதன்மை உரையில் தேர்ந்தெடுக்கப்படுகிறது; ஆனால் תּוֹרָה வெறும் சட்ட விதிகளைவிட விரிவான போதனையையும் குறிக்கக்கூடும் என்பதால் மாற்றுப் பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதத்துக்கேற்ற கண்ணியமான ஆனால் எளிதில் புரியும் நடை. ‘திருச்சட்டம்’ கடவுளுடைய தோராவைக் குறிக்கும் இயல்பான சமயச் சொல்லாகப் பயன்படுத்தப்பட்டுள்ளது; ‘நடக்க’ என்ற வேதாகம உருவகம் தக்கவைக்கப்பட்டுள்ளது. அடிக்குறி [a] முதன்மை உரையில் உரிய இடத்தில் உள்ளது.
