translation:
  language: ta
  text: 'தங்களுக்காக உணவு கேட்டதன் மூலம், தங்கள் உள்ளத்தில் கடவுளைச் சோதித்தார்கள்.[a][b]


    [a] “தங்கள் உள்ளங்களில்” என்றும் மொழிபெயர்க்கலாம். எபிரெயத்தில் ஒருமை வடிவில் “தங்கள் உள்ளத்தில்” என்று உள்ளது.


    [b] “தங்கள் பசியைத் தீர்க்க உணவு கேட்டதன் மூலம்” என்றும் மொழிபெயர்க்கலாம். இங்கு வரும் எபிரெயச் சொல் நெஃபெஷ் என்பது “உயிர்,” “தன்னையே,” “ஆசை,” அல்லது “பசி” என்று பொருள்படலாம்; உணவைக் கேட்கும் இந்தச் சூழலில் “பசி” அல்லது “உணவுக்கான ஆசை” என்ற பொருள் பொருத்தமானது.'
  philosophy: optimal-equivalence
