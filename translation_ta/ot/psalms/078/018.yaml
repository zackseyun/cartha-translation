lexical_decisions:
- source_word: וַיְנַסּוּ
  choice: சோதித்து
  rationale: נסה என்பதன் பியேல் வடிவம் ஒருவரைச் சோதித்தல் அல்லது சோதனைக்கு உட்படுத்துதல் எனப் பொருள்படும். இங்கு கடவுளைத் தவறுக்கு இழுப்பது அல்ல, அவரைச் சவாலுக்குட்படுத்துவது கருத்தாக இருப்பதால் “சோதித்து” பொருத்தமானது.
- source_word: אֵל
  choice: கடவுள்
  rationale: אֵל இங்கு பொதுவான இறைப்பட்டமாக வருகிறது; நவீன நிலையான தமிழில் “கடவுள்” தெளிவானதும் இயல்பானதும் ஆகும்.
- source_word: בִּלְבָבָם
  choice: தங்கள் உள்ளத்தில்
  rationale: எபிரெயத்தில் பெயர்ச்சொல் ஒருமையிலும், உரிமை விகுதி பன்மையிலும் உள்ளது. “தங்கள் உள்ளத்தில்” என்பது கூட்டான அகநிலையைக் குறிக்கும் அந்த வடிவை இயல்பான தமிழில் காக்கிறது.
- source_word: לִשְׁאָל
  choice: கேட்டார்கள்
  rationale: ל உடனான வினையெச்ச வடிவம் இங்கு சோதித்த விதம் அல்லது வழியைக் காட்டுகிறது. தமிழில் “சோதித்து ... கேட்டார்கள்” என்ற தொடர் அந்த உறவை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֹכֶל
  choice: உணவு
  rationale: אֹכֶל என்பது பொதுவாக உணவைக் குறிக்கிறது; அதை “அப்பம்” என்று குறுக்குவதற்கு இங்கு ஆதாரம் இல்லை.
- source_word: לְנַפְשָׁם
  choice: தங்களுக்காக
  rationale: נֶפֶשׁ இங்கு தம்மையே அல்லது உடல்சார்ந்த பசி/ஆசையைச் சுட்டலாம். முதன்மை உரையில் “தங்களுக்காக” என்பது எபிரெயத்தின் தெளிவின்மையை மிகைப்படுத்தாமல் காக்கிறது; சூழல்சார்ந்த “தங்கள் பசியைத் தீர்க்க” என்ற வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: உணவுக்கான ஏக்கத்தின் சூழலில் נֶפֶשׁ என்பதன் பொருள்
  choice: தங்களுக்காக
  alternative: தங்கள் பசியைத் தீர்க்க / தங்கள் ஆசைக்காக / தங்கள் உயிருக்கு
  rationale: נֶפֶשׁ என்பது மனிதரின் பொருளற்ற “ஆத்துமா”வை மட்டுமே குறிக்கும் சொல் அல்ல; உயிர், தன்னையே, ஆசை, பசி ஆகிய பொருள்களையும் ஏற்கும். உணவு கேட்கும் சூழல் பசி அல்லது உணவாசையை வலியுறுத்தினாலும், எபிரெயத்தின் விரிவை முதன்மை உரையில் “தங்களுக்காக” காக்கவும், சூழல்சார்ந்த வாசிப்பை அடிக்குறிப்பில் வழங்கவும் தீர்மானிக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான, பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. எபிரெயத்தின் கூட்டான ஒருமை “தங்கள் உள்ளத்தில்” எனக் காக்கப்பட்டுள்ளது; “நெஃபெஷ்” என்ற சொல்லின் உணர்த்தலை முதன்மை உரை ஒரே பொருளுக்குள் அடைத்துவிடாமல், சூழல்சார்ந்த “பசி” வாசிப்பை அடிக்குறிப்பில் விளக்குகிறது.
