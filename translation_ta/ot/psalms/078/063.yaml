  yaml_path: translation/ot/psalms/078/063.yaml
  text: Fire consumed his young men[a], and his virgins were not praised in song.
translation:
  language: ta
  text: 'அவனுடைய இளைஞர்களை நெருப்பு விழுங்கியது;

    அவனுடைய கன்னிப்பெண்கள் பாடலால் போற்றப்படவில்லை.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனுடைய கன்னிப்பெண்கள் கொண்டாடப்படவில்லை.” அழிவின் காரணமாக அந்த இளம்பெண்களுக்குத் திருமணப் பாடல்கள் பாடப்படாததை இச்சொற்றொடர் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחוּרָיו
  choice: அவனுடைய இளைஞர்கள்
  rationale: בָּחוּר என்பது பொதுவாக வாழ்வின் வலிமையான பருவத்திலுள்ள இளைஞர்களைக் குறிக்கிறது; இணைவரியில் வரும் கன்னிப்பெண்களோடும் இது இயல்பாகப் பொருந்துகிறது.
- source_word: אָכְלָה אֵשׁ
  choice: நெருப்பு விழுங்கியது
  rationale: אָכַל என்பதன் அடிப்படைப் பொருள் ‘உண்ணுதல்’; நெருப்பை எழுவாயாகக் கொண்ட இத்தொடரில் அது அழிவின் தீவிரத்தைச் சித்தரிக்கும் ‘விழுங்குதல்’ என்ற இயல்பான உருவகப் பொருளைத் தருகிறது.
- source_word: וּבְתוּלֹתָיו
  choice: அவனுடைய கன்னிப்பெண்கள்
  rationale: בְּתוּלָה கன்னித்தன்மையுடைய இளம்பெண்ணைக் குறிக்கிறது. ‘கன்னிப்பெண்கள்’ என்பது அந்தக் குறிப்பைத் தெளிவாகத் தக்கவைத்து, இளைஞர்களுடனான இணை அமைப்பையும் பாதுகாக்கிறது.
- source_word: לֹא הוּלָּלוּ
  choice: திருமணப் பாடல்கள் பாடப்படவில்லை
  rationale: הלל என்பதன் புவால் வடிவம் இங்கு ‘பாடலால் போற்றப்படுதல்/கொண்டாடப்படுதல்’ என்று புரிந்துகொள்ளப்படுகிறது. கன்னிப்பெண்கள் மற்றும் அழிவின் சூழலில், நடைபெறாத திருமணக் கொண்டாட்டத்தை இது சுட்டுவதாகத் தெரிகிறது; தமிழில் பொருள் இயல்பாக விளங்க இவ்வாறு மொழிபெயர்க்கப்பட்டது.
theological_decisions: []
translation_notes:
  register: நவீன தரத் தமிழில், கவிதைத் தன்மையும் எபிரேய இணைவரி அமைப்பும் இயன்றவரை காக்கப்பட்டுள்ளன. ‘நெருப்பு விழுங்கியது’ அழிவின் மூல உருவகத்தைத் தக்கவைக்கிறது; இரண்டாம் வரியின் சூழல் சார்ந்த விளக்கம் அடிக்குறிப்பில் மாற்றுப் பொருளுடன் தரப்பட்டுள்ளது.
