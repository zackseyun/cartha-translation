source:
  edition: WLC
  text: מַשְׂכִּ֗יל לְ/אָ֫סָ֥ף הַאֲזִ֣ינָ/ה עַ֭מִּ/י תּוֹרָתִ֑/י הַטּ֥וּ אָ֝זְנְ/כֶ֗ם לְ/אִמְרֵי פִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/001.yaml
  text: A Maskil of Asaph. Give ear[a], my people, to my instruction; incline your ears to the words of my mouth.
translation:
  language: ta
  text: 'ஆசாப்பின் மஸ்கீல்.[a]

    என் மக்களே, என் போதனைக்குச் செவிகொடுங்கள்;

    என் வாயின் சொற்களுக்கு உங்கள் செவிகளைச் சாயுங்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மஸ்கீல்” என்பது சங்கீதத் தலைப்புகளில் வரும் ஒரு தொழில்நுட்பச் சொல்; இது போதனை தரும் அல்லது தியானத்திற்குரிய ஒரு பாடலைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשְׂכִּיל
  choice: மஸ்கீல்
  rationale: சங்கீதத் தலைப்புகளில் வரும் இத்தொழில்நுட்பச் சொல்லின் துல்லியமான பொருள் உறுதியற்றது. ஆகவே விவாதத்திற்குரிய பொருளை முதன்மை உரையில் தீர்மானிக்காமல் ஒலிபெயர்த்து, சாத்தியமான பொருளை அடிக்குறிப்பில் தருகிறது.
- source_word: לְאָסָף
  choice: ஆசாப்பின்
  rationale: தலைப்பிலுள்ள לְ என்பது ஆசிரியத்துவம், தொடர்பு, அர்ப்பணிப்பு ஆகியவற்றைக் குறிக்கக்கூடும். இயல்பான தமிழில் ‘ஆசாப்பின்’ என்று வழங்குவது இத்தொடர்பைச் சுருக்கமாகக் காட்டுகிறது; அதன் துல்லியமான தன்மையை மிகையாக வரையறுப்பதில்லை.
- source_word: הַאֲזִינָה
  choice: செவிகொடுங்கள்
  rationale: கவனத்துடன் கேட்குமாறு அழைக்கும் கட்டளையை இயல்பான, உயரிய தமிழிலும் செவி என்ற உருவகத்துடனும் வழங்குகிறது.
- source_word: עַמִּי
  choice: என் மக்களே
  rationale: எபிரெயச் சொல்லிலுள்ள முதலாம் நபர் உரிமையையும் விளித்தல் பயன்பாட்டையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: תּוֹרָתִי
  choice: என் போதனை
  rationale: இங்கு תּוֹרָה என்பது சட்டத் தொகுப்பை மட்டும் அல்லாமல் அறிவுறுத்தல் அல்லது போதனையைக் குறிக்கிறது. சங்கீதத்தின் ஞானபோதனை சார்ந்த தொடக்கத்திற்கு ‘போதனை’ பொருத்தமானது.
- source_word: הַטּוּ
  choice: சாயுங்கள்
  rationale: கவனித்துக் கேட்பதற்காகச் செவியைத் திருப்புதல் அல்லது சாய்த்தல் என்ற எபிரெய உருவகத்தைத் தக்கவைக்கிறது.
- source_word: אָזְנְכֶם
  choice: உங்கள் செவிகளை
  rationale: எபிரெய மூலத்தின் பன்மையைப் பாதுகாக்கிறது; பலரிடம் உரைக்கப்படும் கட்டளையோடும் இயல்பாகப் பொருந்துகிறது.
- source_word: לְאִמְרֵי
  choice: சொற்களுக்கு
  rationale: தெளிவான நவீனத் தமிழில் எபிரெயச் சொல்லின் பொதுவான பொருளை வழங்குகிறது.
- source_word: פִי
  choice: என் வாயின்
  rationale: ‘செவிகள்’ என்பதுடன் அமைந்துள்ள உடல் உறுப்புச் சித்திரத்தையும் கவிதை இணைப்பையும் தக்கவைக்கிறது.
