translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளக்கூடிய கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘செவிகொடுங்கள் / செவிகளைச் சாயுங்கள்’ என்ற இணைநடை எபிரெயச் செய்யுளின் செவிசார் உருவகத்தையும் ஒத்திசைவையும் காக்கிறது. தலைப்பு தனி வரியாக வைக்கப்பட்டுள்ளது.
