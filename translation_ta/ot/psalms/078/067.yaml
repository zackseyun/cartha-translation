  yaml_path: translation/ot/psalms/078/067.yaml
  text: Then he rejected the tent of Joseph[b][a], and he did not choose the tribe of Ephraim.
translation:
  language: ta
  text: பின்பு அவர் யோசேப்பின் கூடாரத்தை நிராகரித்தார்[a][b]; எப்பிராயீம் கோத்திரத்தை அவர் தேர்ந்தெடுக்கவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘யோசேப்பின் கூடாரத்தை வெறுத்து ஒதுக்கினார்.’
    reason: lexical_alternative
  - marker: b
    text: இங்கு யோசேப்பின் கோத்திரங்களில் முதன்மையான எப்பிராயீம் குறிக்கப்படுகிறது; அடுத்துவரும் சூழல் யூதாவும் சீயோனும் தேர்ந்தெடுக்கப்படுவதை முன்னறிவிக்கிறது.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּמְאַס
  choice: பின்பு அவர் ... புறக்கணித்தார்
  rationale: מָאַס என்பது நிராகரித்தல், புறக்கணித்தல், வெறுத்து ஒதுக்குதல் ஆகிய பொருள்களைக் கொள்ளலாம். இங்கு ‘புறக்கணித்தார்’ என்பது உணர்ச்சிசார் வெறுப்பை அளவுக்கு மீறிக் கூறாமல், வரலாற்றுச் சூழலில் தேர்ந்தெடுக்காமல் ஒதுக்கியதைக் காட்டுகிறது. தொடக்க வாவ் தொடரும் நிகழ்வைச் சுட்டுவதால் ‘பின்பு’ என மொழிபெயர்க்கப்பட்டது.
- source_word: בְּאֹהֶל יוֹסֵף
  choice: யோசேப்பின் கூடாரத்தை
  rationale: אֹהֶל என்பதன் நேரடிப் பொருள் ‘கூடாரம்’. யோசேப்புடன் தொடர்புடைய வாசஸ்தலம் அல்லது கோத்திரப் பகுதியைக் குறிப்பதாக உருவகப் பயன்பாடு இருந்தாலும், மூலத்தின் கவிதைப் படிமத்தைப் பாதுகாக்க ‘கூடாரம்’ தக்கவைக்கப்பட்டது.
- source_word: וּבְשֵׁבֶט אֶפְרַיִם
  choice: எப்பிராயீம் கோத்திரத்தை
  rationale: שֵׁבֶט என்பதற்கு கோத்திரம், கோல், செங்கோல் ஆகிய பொருள்கள் உண்டு. கோத்திரப் பெயருடனும் ‘யோசேப்பின் கூடாரம்’ என்பதற்கு இணையாகவும் வருவதால் ‘கோத்திரம்’ இங்கு இயல்பான பொருள்.
- source_word: לֹא בָחָר
  choice: அவர் தேர்ந்தெடுக்கவில்லை
  rationale: בָּחַר என்பது தேர்ந்தெடுத்தல் என்பதாகும். ‘தேர்ந்தெடுக்கவில்லை’ என்பது நேரடியான மொழிபெயர்ப்பு; பிற்கால இறையியல் கலைச்சொற்களைத் தேவையின்றி புகுத்தாமல் தேர்வு சார்ந்த கருத்தைத் தெளிவாக வைத்திருக்கிறது.
theological_decisions:
- issue: இஸ்ரவேலின் கோத்திர மையங்களில் தேவனுடைய புறக்கணிப்பும் தேர்வும்
  choice: யோசேப்பு/எப்பிராயீமைத் தேர்ந்தெடுக்கப்பட்ட கோத்திர அல்லது பரிசுத்த இட மையமாக ஏற்காத வரலாற்றுச் செயலை நேரடியாக மொழிபெயர்த்தல்
  alternative: யோசேப்பையும் எப்பிராயீமையும் முழு வடக்கு ராஜ்யத்திற்கான அடையாளங்களாக வெளிப்படையாக விரித்துரைத்தல்
  rationale: சங்கீதம் 78 இஸ்ரவேலின் வரலாற்றைக் கூறி, அடுத்த வசனங்களில் யூதாவும் சீயோனும் தேர்ந்தெடுக்கப்படுவதை முன்வைக்கிறது. ஆகவே மூலத்தின் குறிப்பான கோத்திர மொழியை முதன்மை உரையில் பாதுகாத்து, அதன் விரிந்த வரலாற்றுப் பொருளை அடிக்குறிப்பிலும் சூழலிலும் உணர இடமளிக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் கவிதைத் தன்மையும் கொண்ட எளிய நடை. ‘கூடாரம்’ என்ற நேரடிப் படிமமும் ‘கோத்திரம்’ என்ற சூழலுக்கேற்ற பொருளும் பாதுகாக்கப்பட்டுள்ளன. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
