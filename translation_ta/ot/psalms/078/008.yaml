  text: וְ/לֹ֤א יִהְי֨וּ כַּ/אֲבוֹתָ֗/ם דּוֹר֮ סוֹרֵ֪ר וּ/מֹ֫רֶ֥ה דּ֭וֹר לֹא הֵכִ֣ין לִבּ֑/וֹ וְ/לֹא נֶאֶמְנָ֖ה אֶת אֵ֣ל רוּחֽ/וֹ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/008.yaml
  text: and that they should not be like their fathers[a], a stubborn and rebellious generation[b], a generation that did not set its heart aright and whose spirit was not faithful to God.
translation:
  language: ta
  text: 'அவர்கள் தங்கள் முன்னோர்களைப் போல—பிடிவாதமும் கலகமும் கொண்ட தலைமுறையாக, தன் இதயத்தை நிலைநிறுத்தாத[a], தன் ஆவி கடவுளுக்கு உண்மையாயிராத[b] தலைமுறையாக—இருக்காதபடியும்.


    [a] அல்லது, “தன் இதயத்தை ஆயத்தப்படுத்தாத” அல்லது “தன் இதயத்தை உறுதிப்படுத்தாத.”


    [b] அல்லது, “தன் ஆவி கடவுளோடு உறுதியாய் நிலைத்திராத.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தன் இதயத்தை ஆயத்தப்படுத்தாத” அல்லது “தன் இதயத்தை உறுதிப்படுத்தாத.”
    reason: הֵכִין என்ற வினை ஆயத்தப்படுத்துதல், நிறுவுதல் அல்லது உறுதிப்படுத்துதல் ஆகிய பொருள்களைக் கொள்ளலாம்.
  - marker: b
    text: அல்லது, “தன் ஆவி கடவுளோடு உறுதியாய் நிலைத்திராத.”
    reason: נֶאֶמְנָה என்பது உண்மையாயிருத்தல் அல்லது உறுதியாக நிலைத்திருத்தல் எனப் பொருள்படலாம்; אֶת אֵל என்பதும் ‘கடவுளுக்கு’ அல்லது ‘கடவுளோடு’ என்ற உறவை அனுமதிக்கிறது.
lexical_decisions:
- source_word: וְלֹא יִהְיוּ
  choice: இருக்காதபடிக்கும்
  rationale: முந்தைய வசனத்தின் நோக்கத்தைத் தொடரும் எபிரெய வினை வடிவைத் தமிழில் இயல்பான நோக்கத் தொடராக வழங்குகிறது.
- source_word: כַאֲבוֹתָם
  choice: தங்கள் முன்னோர்களைப் போல
  rationale: אָבוֹת என்பது சொற்படியாக ‘தந்தையர்’ என்றாலும், இங்கு தலைமுறைகளுக்கு முந்திய மூதாதையரைச் சுட்டுவதால் ‘முன்னோர்கள்’ நவீன தமிழில் தெளிவாக உள்ளது.
- source_word: דּוֹר
  choice: தலைமுறை
  rationale: ஒரே காலத்தைச் சேர்ந்த கூட்டத்தைக் குறிக்கும் வழக்கமான பொருளையும், செய்யுளில் மீண்டும் வரும் கூட்டொருமையையும் காக்கிறது.
- source_word: סוֹרֵר וּמֹרֶה
  choice: பிடிவாதமும் கலகமும் கொண்ட
  rationale: வழிவிலகும் மனவுறுதியையும் வெளிப்படையான எதிர்ப்பையும் இணைத்துக் காட்டும் இரு எபிரெயச் சொற்களின் வலிமையை இயல்பான தமிழில் காக்கிறது.
- source_word: הֵכִין לִבּוֹ
  choice: தன் இதயத்தை நிலைநிறுத்தாத
  rationale: இதயத்தை ஆயத்தப்படுத்துதல், நிறுவுதல், உறுதியாக அமைத்தல் ஆகிய பொருள் வாய்ப்புகளில், உள்ளார்ந்த உறுதியை வெளிப்படுத்தும் உருவகத்தை இது காக்கிறது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: לִבּוֹ
  choice: தன் இதயத்தை
  rationale: எபிரெய மனிதவியலில் விருப்பம், தீர்மானம், உள்ளார்ந்த மனப்பாங்கு ஆகியவற்றை உள்ளடக்கும் ‘இதயம்’ என்ற உருவகத்தைத் தக்கவைக்கிறது.
- source_word: נֶאֶמְנָה אֶת אֵל רוּחוֹ
  choice: தன் ஆவி கடவுளுக்கு உண்மையாயிராத
  rationale: נֶאֶמְנָה என்பதன் உண்மைத்தன்மை அல்லது நிலைத்தன்மை சார்ந்த பொருளையும், கடவுளை நோக்கிய உறவையும் நேரடியாகக் காட்டுகிறது.
- source_word: רוּחוֹ
  choice: தன் ஆவி
  rationale: ‘இதயம்’ என்பதிலிருந்து வேறுபட்டிருந்தாலும் தொடர்புடைய உள்ளார்ந்த மனப்பாங்கைக் குறிக்கும் மூலச் சொல்லைத் தனியே காக்கிறது.
theological_decisions:
- issue: ‘இதயம்’ மற்றும் ‘ஆவி’ என்ற மனிதவியல் இணை
  choice: இரண்டையும் தனித்தனி சொற்களாகத் தக்கவைத்தல்
  alternative: இரண்டையும் ‘உள்ளம்’ அல்லது ‘மனம்’ என்ற ஒரே கருத்தாக இணைத்தல்
  rationale: மூல எபிரெயம் தொடர்புடைய ஆனால் வேறுபட்ட இரண்டு சொற்களைப் பயன்படுத்துகிறது; அவற்றை ஒன்றாக்காமல் இருப்பது செய்யுளின் மற்றும் இறையியல் உரையின் நுணுக்கத்தைப் பாதுகாக்கிறது.
- issue: ‘தலைமுறை’ என்பதைக் குறிக்கும் ஒருமை வடிவங்கள்
  choice: ‘தன் இதயம்’, ‘தன் ஆவி’ என்ற ஒருமை வடிவங்களைப் பயன்படுத்துதல்
  alternative: ‘அவர்களுடைய இதயங்கள்’, ‘அவர்களுடைய ஆவிகள்’ என்ற பன்மையைப் பயன்படுத்துதல்
  rationale: דּוֹר என்ற ஒருமைக் கூட்டுப்பெயரைக் குறிக்கும் எபிரெய ஒருமை பின்னொட்டுகளை இது காக்கிறது; தமிழிலும் கூட்டொருமையுடன் வாசிக்க இயலும்.
- issue: கடவுளுடன் ஆவிக்குள்ள உறவின் தன்மை
  choice: ‘கடவுளுக்கு உண்மையாயிராத’
  alternative: ‘கடவுளோடு உறுதியாய் நிலைத்திராத’
  rationale: மூலத்தில் உண்மைத்தன்மை மற்றும் நிலைத்தன்மை இரண்டும் சாத்தியம். முதன்மை உரை உண்மைத்தன்மையைத் தேர்ந்தெடுக்கிறது; நிலைத்தன்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் சங்கீதத்தின் கண்ணியமான செய்யுள் நடையைத் தக்கவைக்கும் வகையிலும் மொழிபெயர்க்கப்பட்டது. நீண்ட எபிரெய வாக்கியத்தின் இணை அமைப்பை தெளிவாக்க இடைக்கோடுகள் பயன்படுத்தப்பட்டுள்ளன; பழமையான அல்லது சமயப்பிரிவு சார்ந்த சொற்கள் தவிர்க்கப்பட்டுள்ளன.
