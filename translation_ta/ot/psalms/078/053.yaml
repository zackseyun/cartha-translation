source:
  edition: WLC
  text: וַ/יַּנְחֵ֣/ם לָ֭/בֶטַח וְ/לֹ֣א פָחָ֑דוּ וְ/אֶת א֝וֹיְבֵי/הֶ֗ם כִּסָּ֥ה הַ/יָּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/053.yaml
  text: He led them securely[a], and they were not afraid; and the sea covered their enemies.
translation:
  language: ta
  text: அவர்களைப் பாதுகாப்பாக வழிநடத்தினார்[a]; அவர்கள் அஞ்சவில்லை; கடல் அவர்களுடைய எதிரிகளை மூடியது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘கடல்’ என்று மட்டுமே உள்ளது. இவ்வசனம் விடுதலைப் பயணத்தின்போது இஸ்ரவேலர் கடலைக் கடந்த நிகழ்வைச் சுட்டுகிறது. ‘செங்கடல்’ அல்லது ‘நாணல் கடல்’ என்பது விளக்கமான விரிவாக்கங்கள்; எபிரெய உரை இங்கே அதைவிடக் குறிப்பாகச் சொல்லவில்லை.
    reason: மூலத்தின் குறிப்பற்ற ‘கடல்’ என்ற சொல்லைத் தக்கவைத்தபடி, வரலாற்றுச் சுட்டையும் மாற்று அடையாளங்களின் விளக்கத் தன்மையையும் பதிவு செய்கிறது.
lexical_decisions:
- source_word: וַיַּנְחֵם
  choice: அவர்களை வழிநடத்தினார்
  rationale: נחה என்பதன் ஹிப்இல் வடிவம் இங்கு கடவுள் மக்களை வழிநடத்தியதைக் குறிக்கிறது. ‘வழிநடத்தினார்’ என்பது பயணச் சூழலையும் தெய்வீக வழிகாட்டுதலையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לָבֶטַח
  choice: பாதுகாப்பாக
  rationale: בֶּטַח பாதுகாப்பு அல்லது அச்சமின்மையைக் குறிக்கிறது; முன்னொட்டுடன் இங்கு வழிநடத்திய விதத்தை விவரிக்கும் வினையடையாக வருகிறது.
- source_word: וְלֹא פָחָדוּ
  choice: அவர்கள் அஞ்சவில்லை
  rationale: எபிரெய உரையில் உள்ள எளிய இணைப்பையும் פחד என்பதன் ‘அஞ்சுதல்’ என்ற பொருளையும் நேரடியாகத் தக்கவைக்கிறது; வெளிப்படையாகக் கூறப்படாத நோக்கம் அல்லது விளைவு உறவைச் சேர்க்கவில்லை.
- source_word: אֹיְבֵיהֶם
  choice: அவர்களுடைய எதிரிகள்
  rationale: אויב என்பதற்கான தெளிவான, பொதுவான நவீனத் தமிழ் இணைச்சொல்.
- source_word: כִּסָּה
  choice: மூடியது
  rationale: כסה என்பதன் அடிப்படை ‘மூடுதல்’ என்ற காட்சியைத் தக்கவைக்கிறது; ‘மூழ்கடித்தது’ போன்ற விளக்க விரிவாக்கத்தைத் தவிர்க்கிறது.
- source_word: הַיָּם
  choice: கடல்
  rationale: எபிரெய உரை குறிப்பிட்ட பெயரை அல்லாமல் ‘அந்தக் கடல்/கடல்’ என்ற பொதுப்பெயரையே பயன்படுத்துகிறது. தமிழில் இச்சூழலில் ‘கடல்’ இயல்பாகவும் போதுமானதாகவும் உள்ளது.
theological_decisions:
- issue: விடுதலைப் பயணத்தின் கடல் கடத்தலைக் குறிக்கும் வரலாற்றுச் சுட்டு
  choice: முதன்மை உரையில் ‘கடல்’ என்று பொதுவாகவே மொழிபெயர்த்தல்
  alternative: ‘செங்கடல்’ அல்லது ‘நாணல் கடல்’
  rationale: இவ்வசனம் விடுதலைப் பயண நிகழ்வைத் தெளிவாகச் சுட்டினாலும், மூல எபிரெய உரை הַיָּם (‘கடல்’) என்று மட்டுமே கூறுகிறது. ஆகவே உரையில் இல்லாத குறிப்பைச் சேர்க்காமல் மூலத்தின் பொதுவான சொல்லைத் தக்கவைக்கிறது.
translation_notes:
  register: 'நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை. எபிரெய வாக்கியத்தின் இணைநிலை அமைப்பு மூன்று நேரடியான கூற்றுகளாகப் பாதுகாக்கப்பட்டுள்ளது. தனியான அடிக்குறிப்பு தேவையில்லை; ஆங்கில அடிக்குறிப்பில் ‘Hebrew: the sea’ என்று இருப்பது முதன்மை உரையோடு முரணாகத் தோன்றுவதால், அதன் பயனுள்ள தகவல் மொழிபெயர்ப்பு முடிவுகளிலேயே பதிவு செய்யப்பட்டுள்ளது.'
