- source_word: בִּבְרִיתוֹ
  choice: அவருடைய உடன்படிக்கைக்கு
  rationale: எபிரெய முன்னொட்டு בְּ நேரடியாக ‘இல்’ என்றாலும், ‘உண்மையுள்ளவர்’ என்பதோடு தமிழில் ‘உடன்படிக்கைக்கு’ என்பது இயல்பாகவும் உடன்படிக்கைப் பற்றுறுதியைத் தெளிவாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: உடன்படிக்கைக்கு உண்மையாயிருத்தல்
  choice: இஸ்ரவேலர் தேவனுடைய உடன்படிக்கைக்கு உண்மையுள்ளவர்களாக இருக்கவில்லை என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘அவருடைய உடன்படிக்கையில் அவர்கள் உறுதிப்படுத்தப்படவில்லை’ என்று அதிகச் சொற்சார்பாக மொழிபெயர்க்கலாம்.
  rationale: உறுதியற்ற இதயத்துக்கும் உடன்படிக்கை தொடர்பான தோல்விக்கும் இடையிலான இணை அமைப்பு, அறிவுசார் நம்பிக்கையை மட்டும் அல்லாமல் உறவுசார் மற்றும் ஒழுக்கச் சார்ந்த பற்றுறுதியின்மையைச் சுட்டுகிறது; பின்னாளைய கோட்பாட்டு கருத்துகளைச் சேர்க்காமல் இந்த வலிமை காக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயத்தின் கூட்டு ஒருமையான ‘இதயம்’ தக்கவைக்கப்பட்டு, இரு அடிகளின் இணை அமைப்பும் பாதுகாக்கப்பட்டுள்ளது.
