source:
  edition: WLC
  text: וַ/יִּסֹּ֣גוּ וַֽ֭/יִּבְגְּדוּ כַּ/אֲבוֹתָ֑/ם נֶ֝הְפְּכ֗וּ כְּ/קֶ֣שֶׁת רְמִיָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/057.yaml
  text: But they turned back and acted treacherously like their fathers[a]; they turned aside like a deceitful bow.
translation:
  language: ta
  text: ஆனால் அவர்கள் தங்கள் தந்தையரைப் போலப் பின்வாங்கித் துரோகம் செய்தார்கள்; நம்பத்தகாத வில்லைப் போலத் திசைமாறினார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வஞ்சிக்கும் வில்’, ‘தளர்ந்த வில்’ அல்லது ‘குறைபாடுள்ள வில்’ என்றும் மொழிபெயர்க்கலாம்—அதாவது, அம்பைக் குறிதவறாமல் எய்யும் என்று நம்ப முடியாத வில்.
    reason: רְמִיָּה என்பதன் ‘வஞ்சகம்’, ‘தளர்ச்சி’, ‘நம்பகமின்மை’ ஆகிய சொல்லியல் சாத்தியங்களைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: וַיִּסֹּגוּ
  choice: பின்வாங்கி
  rationale: סוג என்பதன் முந்தைய பாதையிலிருந்து பின்னோக்கிச் செல்லுதல் அல்லது விலகுதல் என்ற இயக்கத்தை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; பிற்கால இறையியல் கலைச்சொல்லைச் சேர்ப்பதில்லை.
- source_word: וַיִּבְגְּדוּ
  choice: துரோகம் செய்தார்கள்
  rationale: בגד குறிக்கும் நம்பிக்கைத் துரோகம் மற்றும் ஒழுக்கக் கனத்தைப் பாதுகாக்கிறது; எவருக்கு எதிராக என்று எபிரெய உரையில் இல்லாத செயப்படுபொருளைச் சேர்க்கவில்லை.
- source_word: כַּאֲבוֹתָם
  choice: தங்கள் தந்தையரைப் போல
  rationale: எபிரெயத்தின் ஆண்பால் குடும்பச் சொல்லான ‘தந்தையர்’ என்பதை ‘முன்னோர்’ என்று பொதுமைப்படுத்தாமல் நேரடியாகப் பாதுகாக்கிறது.
- source_word: נֶהְפְּכוּ
  choice: திசைமாறினார்கள்
  rationale: הפך இங்கு வில் உருவகத்தோடு சேர்ந்து குறி தவறிச் செல்லும் திருப்பம் அல்லது விலகலைக் காட்டுகிறது. ‘திசைமாறினார்கள்’ என்பது உருவகத்தை இயல்பாகத் தாங்குகிறது; ‘முறுக்கப்பட்டார்கள்’ என்ற தமிழின் இயல்பற்ற சொல்லாக்கத்தைத் தவிர்க்கிறது.
- source_word: כְּקֶשֶׁת רְמִיָּה
  choice: நம்பத்தகாத வில்லைப் போல
  rationale: רמיה என்பதில் வஞ்சகம், தளர்ச்சி அல்லது நம்பகமின்மை ஆகிய பொருள் வாய்ப்புகள் உள்ளன. குறியை நேராக எய்யும் என்று நம்ப முடியாத வில் என்ற உருவகத்தை ‘நம்பத்தகாத வில்’ தெளிவாகவும் இயல்பாகவும் தருகிறது; பிற சாத்தியங்களை அடிக்குறிப்பு பாதுகாக்கிறது.
theological_decisions:
- issue: இஸ்ரவேலரின் உடன்படிக்கை சார்ந்த நம்பிக்கைத் துரோகம்
  choice: ‘துரோகம் செய்தார்கள்’ என்ற ஒழுக்க மற்றும் உறவு சார்ந்த கனமுள்ள வினையைப் பயன்படுத்தி, வெளிப்படையான உடன்படிக்கைச் சொல்லையோ செயப்படுபொருளையோ சேர்க்காமல் இருத்தல்
  alternative: ‘நம்பிக்கையற்றவர்களானார்கள்’ என்று மென்மையாக மொழிபெயர்த்தல், அல்லது ‘கடவுளிடம் செய்த உடன்படிக்கையை மீறினார்கள்’ என்று விரிவாக்குதல்
  rationale: சங்கீதத்தின் விரிந்த சூழல் உடன்படிக்கைத் துரோகத்தைச் சுட்டினாலும், இவ்வசனம் பொதுவான துரோகச் சொல்லையே பயன்படுத்துகிறது. ஆகவே மூலத்தின் ஒழுக்கக் கனத்தைப் பாதுகாத்து, அது வெளிப்படையாகக் கூறாத இறையியல் விரிவாக்கம் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் dignified நடையுடன் மொழிபெயர்க்கப்பட்டது. இணை வாக்கியங்களின் இயக்கமும் வில் உருவகமும் பாதுகாக்கப்பட்டுள்ளன; தேவையற்ற சமயக் கலைச்சொற்கள் தவிர்க்கப்பட்டுள்ளன.
