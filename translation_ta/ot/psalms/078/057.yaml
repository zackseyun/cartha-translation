  source_fidelity: மூல எபிரெயத்தின் இரு இணை வினைகளான ‘பின்வாங்குதல்/விலகுதல்’ மற்றும் ‘துரோகம் செய்தல்’ துல்லியமாகப் பாதுகாக்கப்பட்டுள்ளன. ‘தங்கள் தந்தையரைப் போல’ என்பது כַּאֲבוֹתָם என்பதற்கு நேர்மையான மொழிபெயர்ப்பு. நֶהְפְּכוּ-வின் உருவகச் சார்ந்த விலகல் ‘திசைமாறினார்கள்’ என இயல்பாகத் தரப்பட்டுள்ளது. ‘நம்பத்தகாத வில்’ என்பது כְּקֶשֶׁת רְמִיָּה-வின் நம்பகமின்மை/குறிதவறல் உருவகத்தைத் தெளிவாக வெளிப்படுத்துகிறது.
  naturalness: நடை நவீன தரத் தமிழில் இயல்பாகவும் மரியாதையான வேதாகமப் பதிவுக்கு ஏற்றதாகவும் உள்ளது. அரைப்புள்ளி இரண்டு இணைச் செயல்களையும் நன்றாகப் பிரிக்கிறது. ‘திசைமாறினார்கள்’ வில் உருவகத்தின் விளைவான குறிதவறுதலைப் பொதுவாசகர் புரிந்துகொள்ளும் வகையில் தெரிவிக்கிறது.
  terminology: ‘துரோகம் செய்தார்கள்’ בגד என்பதன் ஒழுக்க மற்றும் உறவுசார் கனத்தைத் தக்கவைக்கிறது; உரையில் இல்லாத உடன்படிக்கைச் செயப்படுபொருள் சேர்க்கப்படவில்லை. ‘தந்தையர்’ பால்சுட்டும் மூலச் சொல்லைச் சரியாகத் தக்கவைக்கிறது. அடிக்குறிப்பு ரְמִיָּה-வின் ‘வஞ்சகம்,’ ‘தளர்ச்சி,’ ‘குறைபாடு’ ஆகிய பொருள் வாய்ப்புகளைச் சமநிலையாகப் பாதுகாக்கிறது; [a] குறியீடும் உரிய இடத்தில் உள்ளது.
