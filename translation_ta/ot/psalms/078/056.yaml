  text: ஆனாலும் அவர்கள் உன்னதமான கடவுளைச் சோதித்து[a], அவருக்கு எதிராகக் கலகம் செய்தார்கள்; அவருடைய சாட்சியக் கட்டளைகளை[b] கடைப்பிடிக்கவில்லை.
