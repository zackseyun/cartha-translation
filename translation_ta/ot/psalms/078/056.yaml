lexical_decisions:
- source_word: וַיְנַסּוּ
  choice: சோதித்து
  rationale: נסה என்பதன் உடன்படிக்கைச் சூழலிலான ‘சோதித்தல்/சோதனைக்கு உட்படுத்துதல்’ என்ற குற்றஞ்சாட்டும் பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: וַיַּמְרוּ
  choice: அவருக்கு எதிராகக் கலகம் செய்தார்கள்
  rationale: מרה குறிக்கும் செயல்முறையான எதிர்ப்பையும் கீழ்ப்படியாமையையும் ‘கலகம் செய்தார்கள்’ தெளிவாக வெளிப்படுத்துகிறது; ‘அவருக்கு எதிராக’ என்பது தமிழில் தேவையான உறவைத் தெளிவாக்குகிறது.
- source_word: אֱלֹהִים עֶלְיוֹן
  choice: உன்னதமான கடவுள்
  rationale: எபிரேயச் சொற்றொடரில் உள்ள கடவுளின் மேலான நிலையை இயல்பான தமிழில் காக்கிறது; கூடுதல் கோட்பாட்டுப் பொருள் சேர்க்கப்படவில்லை.
- source_word: וְעֵדוֹתָיו
  choice: அவருடைய சாட்சியக் கட்டளைகளை
  rationale: עֵדוֹת என்பதிலுள்ள சாட்சி சார்ந்த உடன்படிக்கை நுண்ணுணர்வையும், நடைமுறையில் கடைப்பிடிக்க வேண்டிய கட்டளைகள் என்ற பொருளையும் இணைத்துக் காக்கிறது.
- source_word: לֹא שָׁמָרוּ
  choice: கடைப்பிடிக்கவில்லை
  rationale: கட்டளைகள் அல்லது உடன்படிக்கை விதிகளுடன் வரும் שׁמר என்பதன் ‘கைக்கொள்ளுதல்/கடைப்பிடித்தல்’ என்ற பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: וַ
  choice: ஆனாலும்
  rationale: முந்தைய சூழலில் கடவுள் செய்தவற்றுக்கும் இஸ்ரவேலரின் மறுமொழிக்கும் இடையிலுள்ள முரண்பாட்டை உரையாடல் மட்டத்தில் வெளிப்படுத்துகிறது.
