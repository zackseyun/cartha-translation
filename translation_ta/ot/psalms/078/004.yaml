base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/004.yaml
  text: We will not hide them from their children[a], telling the coming generation the praiseworthy deeds of Yahweh, and his strength[c][b], and his wonders that he has done.
translation:
  language: ta
  text: 'அவற்றை அவர்களுடைய பிள்ளைகளிடமிருந்து மறைக்காமல்,


    பின்வரும் தலைமுறைக்கு யாவேயின் புகழுக்குரிய செயல்களையும்,[a]


    அவரது வல்லமையையும்,


    அவர் செய்த அதிசயங்களையும் எடுத்துரைப்போம்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேயின் புகழ்ச்சிகளையும்.” எபிரெயச் சொல் யாவேக்குச் செலுத்தப்படும் புகழ்ச்சிகளையோ, யாவேயைப் புகழத்தக்கவராக்கும் செயல்களையோ குறிக்கலாம்; இங்குள்ள சூழல் இரண்டாவது பொருளை ஆதரிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְכַחֵד
  choice: மறைக்காமல்
  rationale: פיעל வடிவம் மறைத்தல் அல்லது தெரிவிக்காமல் வைத்தல் என்ற பொருளைத் தருகிறது. எபிரெயப் பங்கேற்பு அமைப்புடன் இயல்பாக இணைய, எதிர்மறை வினையெச்சமாக மொழிபெயர்க்கப்பட்டது.
- source_word: מִבְּנֵיהֶם
  choice: அவர்களுடைய பிள்ளைகளுக்கு
  rationale: בנים என்பது மகன்களை மட்டுமல்லாமல் பிள்ளைகளையும் சந்ததியினரையும் குறிக்கலாம். தலைமுறைகளுக்கிடையேயான அறிவிப்பே சூழல் என்பதால் பாலினத்தைச் சுருக்காத ‘பிள்ளைகள்’ தேர்ந்தெடுக்கப்பட்டது; தமிழில் மறைத்தல் என்பதுடன் இலக்கை ‘-க்கு’ எனக் குறிப்பது இயல்பு.
- source_word: לְדוֹר אַחֲרוֹן
  choice: பின்வரும் தலைமுறைக்கு
  rationale: சொற்றொடர் பின்னால் வரும் அல்லது அடுத்த தலைமுறையைக் குறிக்கிறது. ‘பின்வரும் தலைமுறை’ அதன் முன்னோக்கிய பார்வையையும் ஓரளவு நெகிழ்வான காலச் சுட்டையும் காக்கிறது.
- source_word: מְסַפְּרִים
  choice: எடுத்துரைப்போம்
  rationale: இந்தப் பங்கேற்பு மறைக்காமல் இருப்பது எவ்வாறு நிகழ்கிறது என்பதை—விவரித்துச் சொல்வதன் மூலம்—காட்டுகிறது. தமிழ் வாக்கியத்தின் முடிவில் முதன்மை வினையாக அமைப்பது இயல்பானதும் தெளிவானதும் ஆகும்.
- source_word: תְּהִלּוֹת יְהוָה
  choice: யாவேயின் புகழுக்குரிய செயல்கள்
  rationale: תהלות என்பது யாவேக்குச் செலுத்தப்படும் புகழ்ச்சிகளையோ, அவரைப் புகழத்தக்கவராக்கும் செயல்கள் அல்லது மேன்மைகளையோ குறிக்கலாம். ‘வல்லமை’, ‘அதிசயங்கள்’ என்பவற்றுடன் இணைந்திருப்பதால் இங்கு செயல்கள் என்ற பொருள் சூழலுக்கு ஏற்றது; மாற்றுப் பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெயத் தனிப்பெயரான יהוה பட்டப்பெயராக மாற்றப்படாமல், நவீன தமிழில் தெளிவாக ஒலிபெயர்க்கப்பட்டது.
- source_word: עֱזוּזוֹ
  choice: அவரது வல்லமை
  rationale: இந்தப் பெயர்ச்சொல் வலிமை, ஆற்றல், வல்லமை ஆகிய பொருள்களைக் கொண்டது. சங்கீத நடைக்கு ஏற்ற கண்ணியமான, இயல்பான சொல் ‘வல்லமை’.
- source_word: נִפְלְאוֹתָיו
  choice: அவர் செய்த அதிசயங்கள்
  rationale: வியப்பை ஏற்படுத்தும் அசாதாரண செயல்களை இச்சொல் குறிக்கிறது. தொடர்புடைய אֲשֶׁר עָשָׂה என்பதையும் தமிழில் இதனோடு இயல்பாக இணைத்துள்ளோம்.
- source_word: אֲשֶׁר עָשָׂה
  choice: அவர் செய்த
  rationale: இத்தொடர்புச் சொற்றொடர் ‘அதிசயங்கள்’ என்பதையே வரையறுக்கிறது. தமிழ் பெயரெச்ச வடிவம் மூலத்தின் நிறைவேறிய செயலைச் சுருக்கமாகவும் தெளிவாகவும் தருகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பொதுப் பட்டப்பெயர் அல்ல, நான்கு எழுத்துகளைக் கொண்ட இறைத் தனிப்பெயர் நேரடியாக உள்ளது. ஆகவே அதை பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைக் காக்கிறது.
- issue: תְּהִלּוֹת יְהוָה என்பதன் பொருள்
  choice: யாவேயின் புகழுக்குரிய செயல்கள்
  alternative: யாவேக்குச் செலுத்தப்படும் புகழ்ச்சிகள்
  rationale: ‘அவரது வல்லமை’, ‘அவர் செய்த அதிசயங்கள்’ ஆகிய இணைத் தொடர்கள், யாவேயைப் பற்றிக் கூறப்படும் புகழத்தக்க செயல்கள் என்ற பொருளை ஆதரிக்கின்றன. எனினும் எபிரெயச் சொல்லின் மற்ற பொருள் உண்மையான சாத்தியம் என்பதால் அடிக்குறிப்பில் வழங்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான சங்கீத நடையில் வடிவமைக்கப்பட்டது. எபிரெய வாக்கியத்தின் ‘மறைக்காமல்—எடுத்துரைப்போம்’ என்ற முறைத் தொடர்பு இயல்பான தமிழ் வாக்கிய அமைப்பில் காக்கப்பட்டுள்ளது. கவிதை வரிப்பிரிப்புகள் கருத்து அலகுகளைக் காட்டுகின்றன.
