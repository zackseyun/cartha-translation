  register: நவீன நிலையான தமிழில், சங்கீதத்தின் இணைவரிசை மற்றும் கவிதைநயத்தைத் தக்கவைக்கும் கண்ணியமான நடை. ‘முதற்பேறான’ என்பது பாலினத்தை மூலத்தில் இல்லாதவாறு கட்டுப்படுத்தாமல் விடுகிறது; ‘காமின் கூடாரங்கள்’ என்ற உருவகம் அப்படியே பாதுகாக்கப்படுகிறது.
