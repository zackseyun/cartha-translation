translation:
  language: ta
  text: 'எகிப்திலுள்ள முதற்பேறான அனைவரையும் அவர் வீழ்த்தினார்;

    காமின் கூடாரங்களில் அவர்களின் வலிமையின் முதல் விளைவானவர்களை வீழ்த்தினார்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களின் இனப்பெருக்க வலிமையின் முதற்பலனை.” எபிரெய மரபுத்தொடர் சந்ததியை உருவாக்கும் வலிமையின் முதல் விளைவைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּךְ
  choice: வீழ்த்தினார்
  rationale: נכה என்ற வினை இச்சூழலில் முதற்பேறானோரின் மரணத்தைச் சுட்டுவதால், வெறும் ‘அடித்தார்’ என்பதைக் காட்டிலும் உயிரிழக்கச் செய்த தாக்கத்தை ‘வீழ்த்தினார்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כָּל בְּכוֹר
  choice: முதற்பேறான அனைவரையும்
  rationale: כָּל என்பதன் முழுமை/பகிர்ந்தளிக்கும் வலிமையைத் தக்கவைக்கிறது; எபிரெயத்தில் வெளிப்படையாக இல்லாத ‘ஆண்’ என்ற சொல்லைச் சேர்க்கவில்லை.
- source_word: בְּמִצְרָיִם
  choice: எகிப்தில் இருந்த
  rationale: בְּ குறிக்கும் இடப்பொருளை இயல்பான தமிழில் தருகிறது; இது எகிப்தின் முதற்பேறானோரைக் குறிக்கிறது.
- source_word: רֵאשִׁית אֹנִים
  choice: அவர்களுடைய இனப்பெருக்க வலிமையின் முதற்பலனை
  rationale: רֵאשִׁית என்பது முதல் விளைவு/முதற்பலன் என்பதையும், אֹנִים இங்கு சந்ததியை உருவாக்கும் வலிமையைக் குறிக்கும் மரபுத்தொடர் என்பதையும் வெளிப்படுத்துகிறது.
- source_word: בְּאָהֳלֵי חָם
  choice: காமின் கூடாரங்களில்
  rationale: எகிப்தைக் கவிதைநயமாகக் குறிக்கும் ‘காமின் கூடாரங்கள்’ என்ற மரபுவழி மற்றும் வம்சாவளிச் சித்திரத்தை விளக்கிப் பதிலீடு செய்யாமல் பாதுகாக்கிறது.
theological_decisions:
- issue: எகிப்துக்கான கவிதைநயப் பெயராக ‘காம்’
  choice: முதன்மை உரையில் ‘காமின் கூடாரங்கள்’ எனத் தக்கவைத்தல்
  alternative: ‘எகிப்தியரின் குடியிருப்புகளில்’ அல்லது ‘எகிப்தின் குடியிருப்புகளில்’
  rationale: முதல் அடியே எகிப்தை நேரடியாகக் குறிப்பிடுகிறது; இரண்டாம் அடி ‘காமின் கூடாரங்கள்’ என்று கவிதைநயத்தையும் வம்சாவளி ஒலிப்பையும் சேர்க்கிறது. இதைத் தக்கவைப்பது மூலத்தின் இலக்கிய மற்றும் திருமறைத் தொடர்பை பாதுகாக்கிறது.
- issue: רֵאשִׁית אֹנִים என்ற மரபுத்தொடரின் பொருள்
  choice: ‘இனப்பெருக்க வலிமையின் முதற்பலன்’ என வழங்கி, மாற்றுப் பொருளை அடிக்குறிப்பில் குறிப்பிடுதல்
  alternative: ‘அவர்களுடைய வலிமையின் முதல் வெளிப்பாடு’
  rationale: இந்தச் சொற்றொடர் முதற்பேறானவரை சந்ததியுறும் வலிமையின் முதல் விளைவாகக் குறிப்பிடுகிறது. உருவகத்தைத் தக்கவைத்தபடியே அதன் உட்பொருளை நவீன தமிழில் தெளிவாக்குகிறது.
