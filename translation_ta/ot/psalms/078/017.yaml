source:
  edition: WLC
  text: וַ/יּוֹסִ֣יפוּ ע֭וֹד לַ/חֲטֹא ל֑/וֹ לַֽ/מְר֥וֹת עֶ֝לְי֗וֹן בַּ/צִּיָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/017.yaml
  text: Yet they continued to sin against him[a], rebelling against the Most High in the dry land.
translation:
  language: ta
  text: 'ஆனாலும் அவர்கள் அவருக்கு எதிராகத் தொடர்ந்து பாவம் செய்தார்கள்;

    வறண்ட நிலத்தில் உன்னதமானவருக்கு எதிராகக் கலகம் செய்தார்கள்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיּוֹסִיפוּ עוֹד
  choice: ஆனாலும் ... தொடர்ந்து
  rationale: הוסיף உடன் வரும் வினையெச்சம் தொடர்ச்சியையோ மீண்டும் செய்தலையோ குறிக்கிறது; עוֹד சூழலில் எதிர்மறையான தொடர்ச்சியை வலியுறுத்துகிறது. நவீன தமிழில் ‘ஆனாலும் ... தொடர்ந்து’ இரு கூறுகளையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לַחֲטֹא לוֹ
  choice: அவருக்கு எதிராகப் பாவம் செய்தார்கள்
  rationale: חטא + ל இங்கு ஒருவருக்கு எதிராகப் பாவம் செய்வதைக் குறிக்கிறது; முன்னிலைச் சூழலின்படி ‘அவர்’ என்பது கடவுளைக் குறிக்கிறது.
- source_word: לַמְרוֹת
  choice: கலகம் செய்தார்கள்
  rationale: מרה கீழ்ப்படியாமையுடன் எதிர்த்து நிற்பதையும் கலகம் செய்வதையும் குறிக்கிறது. ‘கலகம் செய்தார்கள்’ வினையின் வலிமையைத் தெளிவாகப் பேணுகிறது.
- source_word: עֶלְיוֹן
  choice: உன்னதமானவர்
  rationale: கடவுளுக்குரிய ‘மிக உயர்ந்தவர்’ என்ற பட்டத்தை இயல்பான, கண்ணியமான தமிழில் பெயர்ச்சொல் வடிவில் தருகிறது.
- source_word: בַּצִּיָּה
  choice: வறண்ட நிலத்தில்
  rationale: צִיָּה குறிப்பாக வறண்ட, நீரற்ற இடத்தைக் குறிக்கிறது. பொதுவான ‘வனாந்தரம்’ என்பதைக் காட்டிலும் எபிரெயச் சொல்லின் தனிப்பட்ட பொருளை இது நேரடியாகப் பேணுகிறது.
theological_decisions:
- issue: עֶלְיוֹן என்ற இறைப் பட்டத்தின் மொழிபெயர்ப்பு
  choice: உன்னதமானவர்
  alternative: மிக உயர்ந்தவர்
  rationale: ‘உன்னதமானவர்’ இறைப் பட்டத்தின் மேன்மைப் பொருளைப் பேணுவதோடு, நவீன நிலையான தமிழில் கண்ணியமாகவும் சுருக்கமாகவும் உள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதத்துக்கேற்ற கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டது. எபிரெய இணைவரி அமைப்பு பேணப்பட்டுள்ளது; முதல் வரியின் ‘அவருக்கு எதிராக’ என்பதும் இரண்டாம் வரியின் இறைப் பட்டமும் மூலத்தின் கருத்து முன்னேற்றத்தைத் தெளிவாக்குகின்றன.
