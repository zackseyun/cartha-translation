source:
  edition: WLC
  text: וַ/יֹּאכְל֣וּ וַ/יִּשְׂבְּע֣וּ מְאֹ֑ד וְ֝/תַֽאֲוָתָ֗/ם יָבִ֥א לָ/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/029.yaml
  text: So they ate and were very full[a], and he brought them what they craved.
translation:
  language: ta
  text: அவர்கள் உண்டு, மிகவும் திருப்தியடைந்தார்கள்; அவர்கள் ஏங்கியதை[a] அவர் அவர்களுக்குக் கொண்டுவந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுடைய ஏக்கத்தை / பேராவலை.” எபிரெயப் பெயர்ச்சொல் ஏக்கத்தையே அல்லது ஏங்கிய பொருளையே குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאכְלוּ
  choice: அவர்கள் உண்டு
  rationale: אכל என்பதன் எளிய, வழக்கமான பொருள் ‘உண்ணுதல்’. செய்யுளுக்கேற்ற சுருக்கத்தையும் இயல்பான தமிழையும் இது காக்கிறது.
- source_word: וַיִּשְׂבְּעוּ מְאֹד
  choice: மிகவும் திருப்தியடைந்தார்கள்
  rationale: שׂבע என்பது உண்டதால் நிறைவடைதல் அல்லது திருப்தியடைதலைக் குறிக்கிறது; מְאֹד அதன் தீவிரத்தை வலியுறுத்துகிறது. தமிழில் இயல்பாகவும் தெளிவாகவும் இருக்க இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: תַאֲוָתָם
  choice: அவர்கள் ஏங்கியதை
  rationale: תַּאֲוָה என்பது ஏக்கம், பேராவல் அல்லது ஏங்கப்படும் பொருள் ஆகியவற்றைக் குறிக்கலாம். இங்கு உணவுக்கான ஏக்கத்தின் பொருள் முன்னிலையில் இருப்பதால், ‘அவர்கள் ஏங்கியதை’ என்பது சூழலில் இயல்பாக உள்ளது; பெயர்ச்சொல்லின் அடிப்படை இருபொருள் சாத்தியம் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: יָבִא לָהֶם
  choice: அவர் அவர்களுக்குக் கொண்டுவந்தார்
  rationale: בוא என்பதன் ஹிஃபில் வடிவம் ‘வரச்செய்தல்’ அல்லது ‘கொண்டுவருதல்’ எனப் பொருள்படும். לָהֶם உடன், கடவுள் அவர்கள் விரும்பியதை அவர்களுக்குக் கொண்டுவந்தார் என்ற சூழல்சார் பொருளை இச்சொற்றொடர் இயல்பாகத் தருகிறது.
theological_decisions:
- issue: יָבִא என்பதன் வெளிப்படையாகச் சொல்லப்படாத எழுவாய்
  choice: சூழலில் கடவுளைக் குறிக்கும் ‘அவர்’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘அவர்களுடைய ஏக்கம் அவர்களிடம் வந்தது’ போன்ற எழுவாயற்ற அல்லது தன்வினை வாசிப்பு.
  rationale: சங்கீதத்தின் நிகழ்வோட்டத்தில் உணவை வழங்கிச் செயல்படுபவர் கடவுள். בוא என்பதன் ஹிஃபில் வடிவமும் ‘கொண்டுவந்தார்’ என்ற பிறவினைப் பொருளை இயல்பாக ஆதரிக்கிறது. ஆயினும் மூலத்தில் ‘கடவுள்’ என்ற பெயர் இவ்வரியில் வெளிப்படையாக இல்லாததால், தமிழிலும் ‘அவர்’ என்றே வைக்கப்பட்டது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, எளிதில் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘உண்டு’ என்பது செய்யுள் நடைக்கேற்ற சுருக்கமான வடிவம்; ‘மிகவும் திருப்தியடைந்தார்கள்’ என்பது உண்டதால் ஏற்பட்ட நிறைவை இயல்பாக வெளிப்படுத்துகிறது. ‘அவர்’ என்பது கடவுளைச் சூழலிலிருந்து உணர்த்துகிறது; மூலத்தில் இல்லாத பெயர் வெளிப்படையாகச் சேர்க்கப்படவில்லை.
