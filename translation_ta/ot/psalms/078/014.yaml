  yaml_path: translation/ot/psalms/078/014.yaml
  text: He led them with a cloud by day[a], and all the night with the light of fire.
translation:
  language: ta
  text: பகலில் மேகத்தினாலும், இரவு முழுவதும் நெருப்பின் ஒளியினாலும் அவர்களை வழிநடத்தினார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பகலில் மேகத்தைக் கொண்டு அவர்களுக்கு வழிகாட்டினார்; இரவு முழுவதும் நெருப்பின் ஒளியைக் கொண்டு வழிகாட்டினார்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּנְחֵם
  choice: அவர்களை வழிநடத்தினார்
  rationale: נחה என்பதன் ஹிஃபில் வடிவம், மூன்றாம் நபர் ஆண்பால் பன்மை பின்னொட்டுடன், ‘அவர்களை வழிநடத்தினார்’ என்று பொருள்படும். வனாந்தரப் பயணத்தில் கடவுள் திசைகாட்டி நடத்தினதை இச்சொல் இயல்பாகவும் நேரடியாகவும் வெளிப்படுத்துகிறது.
- source_word: בֶּעָנָן
  choice: மேகத்தினால்
  rationale: ב இங்கு கருவிப்பொருளில் வந்து, மேகத்தின் மூலமாக வழிநடத்தியதைக் குறிக்கிறது. ‘மேகத்தினால்’ என்பது எபிரெய உருவகத்தை மிகைப்படுத்தாமல் காக்கிறது.
- source_word: יוֹמָם
  choice: பகலில்
  rationale: பகல் வேளையைக் குறிக்கும் வினையடைப் பயன்பாடு. ‘பகலில்’ என்பது சுருக்கமான, இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: וְכָל הַלַּיְלָה
  choice: இரவு முழுவதும்
  rationale: எபிரெய மொழியின் ‘இரவு முழுவதும்’ என்ற கால நிறைவை தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: בְּאוֹר אֵשׁ
  choice: நெருப்பின் ஒளியினால்
  rationale: ‘நெருப்பு’ மற்றும் ‘ஒளி’ ஆகிய இரு பெயர்ச்சொற்களையும் தனித்தே காத்து, அந்த ஒளியின் மூலமாக வழிநடத்தியதைக் கருவிப்பொருள் வேற்றுமையில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: வனாந்தர வழிநடத்துதலின் மேகம்–நெருப்பு உருவகம்
  choice: கடவுள் இஸ்ரவேலரை மேகத்தினாலும் நெருப்பின் ஒளியினாலும் வரலாற்றில் வழிநடத்தியதாக மட்டும் மொழிபெயர்க்கப்பட்டது.
  alternative: மேகத்தையும் நெருப்பையும் பிரதான உரையிலேயே முன்குறியீட்டு அல்லது விரிவான இறையியல் விளக்கமாக எடுத்துரைத்தல்.
  rationale: எபிரெய வசனம் யாத்திராகம வழிநடத்துதலை நினைவுகூர்கிறது; அதன் விரிவான இறையியல் பொருளை மொழிபெயர்ப்புக்குள் சேர்க்காமல், வசனம் கூறுவதை மட்டும் காப்பது பொருத்தமானது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. இணையான இரு காலப்பகுதிகளையும் வழிநடத்தும் கருவிகளையும் தெளிவுபடுத்த இணை அமைப்பு காக்கப்பட்டது.
