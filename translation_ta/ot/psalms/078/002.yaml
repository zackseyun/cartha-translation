  yaml_path: translation/ot/psalms/078/002.yaml
  text: I will open my mouth in a parable[d][c][b][a]; I will utter riddles from of old.
translation:
  language: ta
  text: 'உவமையால்[a][d] என் வாயைத் திறப்பேன்;

    பண்டைக்காலத்து புதிர்களை[b][c] உரைப்பேன்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பழமொழியால்” அல்லது “ஒரு கூற்றால்.” எபிரேயச் சொல் பழமொழி, உவமை அல்லது உருவகக் கூற்று எனப் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “மறைபொருள் கூற்றுகளை” அல்லது “விடுகதைகளை.”
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “தொன்றுதொட்டு வந்த.”
    reason: lexical_alternative
  - marker: d
    text: இயேசு உவமைகளில் பேசியது தொடர்பாக இந்த வசனம் மத்தேயு 13:35-ல் மேற்கோள் காட்டப்படுகிறது.
    reason: cross_reference
lexical_decisions:
- source_word: אֶפְתְּחָה
  choice: திறப்பேன்
  rationale: פתח என்பதன் முதலாம் நபர் ஒருமை கவிதை வடிவம் விருப்பம் கலந்த எதிர்காலச் செயலைக் குறிக்கிறது; தமிழில் இயல்பாக ‘திறப்பேன்’ என வழங்கப்படுகிறது.
- source_word: בְּמָשָׁל
  choice: உவமையால்
  rationale: מָשָׁל என்பது பழமொழி, உவமை அல்லது உருவகக் கூற்று எனப் பொருள்படலாம். இங்கு ‘புதிர்கள்’ என்பதுடன் இணையாக வருவதால் உருவகப் போதனைக் கூற்றைக் குறிக்கும் ‘உவமை’ முதன்மை உரையில் ஏற்றது; எபிரேய בְּ முன்னிடைச்சொல்லின் கருவி/முறை நுட்பத்தை ‘-ஆல்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: פִּי
  choice: என் வாயை
  rationale: எபிரேயத்தின் நேரடியான உடல் சார்ந்த சொல்லாட்சியைத் தக்கவைத்து, தமிழிலும் இயல்பான ‘என் வாயைத் திறப்பேன்’ என்ற மரபுத்தொடரை வழங்குகிறது.
- source_word: אַבִּיעָה
  choice: உரைப்பேன்
  rationale: נבע என்பதன் ஹிஃபில் வடிவம் சொற்களைப் பொங்கவிடுதல் அல்லது வெளிப்படுத்துதல் என்ற படிமத்தைக் கொண்டது. ‘உரைப்பேன்’ கவிதைச் சூழலுக்கு ஏற்ற, கண்ணியமான நவீனத் தமிழ்; மிகையாக விளக்குவதில்லை.
- source_word: חִידוֹת
  choice: புதிர்களை
  rationale: חִידָה என்பதன் நேரடிப் பொருள் புதிர் அல்லது பொருள் மறைந்த கூற்று. ‘புதிர்கள்’ அதன் பன்மையையும் உண்மையான அர்த்தத் தெளிவின்மையையும் காக்கிறது.
- source_word: מִנִּי קֶדֶם
  choice: பண்டைக்காலத்து
  rationale: இந்தச் சொற்றொடர் தொன்மையான அல்லது முற்காலத்தைச் சேர்ந்தவற்றைக் குறிக்கிறது. ‘பண்டைக்காலத்து’ என்பது அவை பழங்காலத்திலிருந்து வந்தவை என்ற தொடர்பைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது; படைப்பின் முழுமையான தொடக்கத்தைத் தேவையின்றி குறிக்காது.
theological_decisions:
- issue: மத்தேயு 13:35 உடனான தொடர்பும் מָשָׁל / חִידוֹת என்பவற்றின் பொருளும்
  choice: எபிரேய உரையை அதன் சொந்தச் சூழலில் ‘உவமை’ மற்றும் ‘புதிர்கள்’ என மொழிபெயர்த்து, புதிய ஏற்பாட்டு மேற்கோளின் ‘மறைந்தவை’ போன்ற சொல்லாட்சியுடன் ஒத்திசைக்கவில்லை.
  alternative: ‘பழமொழியால் என் வாயைத் திறப்பேன்; பழங்காலத்து மறைபொருள் கூற்றுகளை உரைப்பேன்’ அல்லது ‘உவமைகளில் பேசுவேன்; பண்டைக்காலம் முதல் மறைந்தவற்றை உரைப்பேன்.’
  rationale: மூலமொழி முன்னுரிமைப்படி, சங்கீதத்தின் எபிரேய உரை தொன்மையிலிருந்து வந்த உருவகமான, புதிர்த்தன்மையுள்ள போதனையைச் சொல்கிறது. மத்தேயுவின் பயன்பாடு முக்கியமான இடையுரைத் தொடர்பு என்றாலும், அதன் சொல்லாட்சியை இவ்வசனத்துக்குள் பின்னோக்கி இறக்குமதி செய்யவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியும் அதேவேளையில் கவிதைக்குரிய கண்ணியத்தைத் தக்கவைக்கும் நடை. எபிரேய இணைவாக்கிய அமைப்பும் ‘என் வாயைத் திறப்பேன்’ என்ற உருவகமும் பாதுகாக்கப்பட்டுள்ளன. அடிக்குறிப்புக் குறிகள் உரிய சொற்களுக்கு அடுத்தே இடப்பட்டுள்ளன.
