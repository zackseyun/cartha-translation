  text: בָּ֣קַע יָ֭ם וַ/יַּֽעֲבִירֵ֑/ם וַֽ/יַּצֶּב מַ֥יִם כְּמוֹ נֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/013.yaml
  text: He split the sea and made them pass through[c][b][a]; he made the waters stand like a heap.
translation:
  language: ta
  text: அவர் கடலைப் பிளந்து, அவர்களைக் கடந்து செல்லச் செய்தார்; தண்ணீரை ஒரு குவியல்போல் நிற்கச் செய்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּקַע
  choice: பிளந்து
  rationale: இந்த வினை பிளத்தல் அல்லது பிளந்து திறத்தலைக் குறிக்கிறது. ‘பிளந்து’ என்பது எபிரெயச் சொல்லின் வலிமையான, தெளிவான படிமத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: יָם
  choice: கடலை
  rationale: எபிரெயக் கவிதையில் சுட்டுச்சொல் இல்லாவிட்டாலும், வெளியேற்ற நிகழ்வில் மக்கள் கடந்த கடலையே சூழல் குறிக்கிறது; குறிப்பிட்ட கடற்பெயரை வசனத்தில் சேர்க்கவில்லை.
- source_word: וַיַּעֲבִירֵם
  choice: அவர்களைக் கடந்து செல்லச் செய்தார்
  rationale: 'עבר என்பதன் ஹிஃபில் வடிவிலுள்ள காரணவினைப் பொருளை வெளிப்படையாகக் காக்கிறது: அவர் அவர்களை மறுகரைக்குக் கடக்கச் செய்தார்.'
- source_word: וַיַּצֶּב
  choice: நிற்கச் செய்தார்
  rationale: அமைத்து நிறுத்துதல் அல்லது நிலையாக நிற்கச் செய்தல் என்ற காரணவினை நுட்பத்தை நேரடியாகக் காக்கிறது.
- source_word: מַיִם
  choice: தண்ணீரை
  rationale: எபிரெயில் வடிவியல் பன்மையாக இருந்தாலும், நவீனத் தமிழில் ‘தண்ணீர்’ இயல்பாக ஒருமைத் தொகுப்புப்பெயராகப் பயன்படுகிறது; இங்கு செயப்படுபொருள் உருபுடன் தரப்பட்டுள்ளது.
- source_word: כְּמוֹ
  choice: போல்
  rationale: நேரடியான உவமை உருபு; நவீனத் தமிழில் சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: נֵד
  choice: குவியல்
  rationale: குவிக்கப்பட்ட திரள் அல்லது மேட்டைக் குறிக்கும் மூலப்படிமத்தை இது காக்கிறது. ‘சுவர்’ என்பது சாத்தியமான சூழல்சார் விளக்கமாக இருந்தாலும், இச்சொல்லின் நேரடியான படிமம் அல்ல.
theological_decisions:
- issue: கடல் அற்புதத்தின் படிமம்
  choice: ‘தண்ணீரைக் குவியல்போல் நிற்கச் செய்தார்’ என்ற உறுதியான படிமத்தை அப்படியே காத்தல்
  alternative: ‘தண்ணீரைத் தடுத்து நிறுத்தினார்’ என்று இயக்கத்தை விளக்கும் விதமாகப் பொழிப்புரை செய்தல்
  rationale: வசனம் கடவுளின் செயலை வெளியேற்ற நிகழ்வின் உயிரோட்டமான கவிதைப் படிமத்தில் முன்வைக்கிறது. அதன் நிகழ்முறையை விளக்கவோ, அதை வெறும் மிகைப்படுத்தலாகத் தீர்மானிக்கவோாமல் மூலத்தின் இறையியல் வலிமையும் பதற்றமும் காக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் கவிதைமிக்க கண்ணியமான நடை பயன்படுத்தப்பட்டது. ‘கடந்து செல்லச் செய்தார்’ மற்றும் ‘நிற்கச் செய்தார்’ என்பவை மூல எபிரெயத்தின் காரணவினை வடிவங்களைத் தெளிவாகக் காக்கின்றன.
