- from: ஆனால் அவர்கள் தங்கள் வாயால் அவரிடம் நயமாகப் பேசி[a], தங்கள் நாவால் அவரிடம் பொய் சொன்னார்கள்.
  to: ஆனால் அவர்கள் தங்கள் வாயால் அவரைப் புகழ்ந்து பேசினார்கள்[a]; தங்கள் நாவால் அவரிடம் பொய் சொன்னார்கள்.
