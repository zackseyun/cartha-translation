source:
  edition: WLC
  text: וַ/יְפַתּ֥וּ/הוּ בְּ/פִי/הֶ֑ם וּ֝/בִ/לְשׁוֹנָ֗/ם יְכַזְּבוּ לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/036.yaml
  text: But they flattered him with their mouth[a], and with their tongue they lied to him.
translation:
  language: ta
  text: ஆனால் அவர்கள் தங்கள் வாயால் அவரைப் புகழ்ந்து பேசினார்கள்[a]; தங்கள் நாவால் அவரிடம் பொய் சொன்னார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவரை ஏமாற்றினார்கள்’ அல்லது ‘அவரைக் கவர முயன்றார்கள்.’ எபிரெய வினைச்சொல் இப்பொருள்களையும் தரலாம்; இங்கு அது பெரும்பாலும் உண்மையற்ற முகஸ்துதிப் பேச்சைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְפַתּוּהוּ
  choice: அவரிடம் நயமாகப் பேசி
  rationale: פִּתָּה என்பதன் பியேல் வடிவம் கவர்தல், ஏமாற்றுதல், இணங்கச் செய்தல் போன்ற பொருள்களைக் கொள்ளலாம். இங்கு ‘நாவால் பொய் சொன்னார்கள்’ என்பதுடன் இணைந்து வருவதால், உண்மையற்ற இனிய பேச்சால் கடவுளைத் தங்களுக்குச் சாதகமாக்க முயன்றதைக் குறிக்கும் இயல்பான தமிழ் தெரிவாக இது உள்ளது; அவர்கள் உண்மையில் கடவுளை ஏமாற்றிவிட்டார்கள் என்று பொருளைத் தீர்மானித்துவிடுவதையும் தவிர்க்கிறது.
- source_word: בְּפִיהֶם
  choice: தங்கள் வாயால்
  rationale: בְּ இங்கு கருவி அல்லது வழிமுறையைக் குறிக்கிறது. எபிரெயக் கவித்துவத்தின் ‘வாய்’ என்ற உருவகத்தைத் தமிழிலும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: וּבִלְשׁוֹנָם
  choice: தங்கள் நாவால்
  rationale: לָשׁוֹן என்பதன் நேர்ப்பொருள் ‘நாவு’. ‘வாய்’ என்பதோடு உள்ள கவித்துவ இணைநிலையையும் பேச்சுக்கான உடல் உருவகத்தையும் இத்தெரிவு காக்கிறது.
- source_word: יְכַזְּבוּ
  choice: பொய் சொன்னார்கள்
  rationale: כזב என்பதன் பியேல் வடிவம் பொய்யுரைத்தல் அல்லது பொய்மையாக நடந்துகொள்ளுதல் எனப் பொருள்படும். ‘பொய் சொன்னார்கள்’ என்பது தெளிவான, இயல்பான நவீனத் தமிழ்.
- source_word: לוֹ
  choice: அவரிடம்
  rationale: 'לְּ + ஆண்பால் ஒருமை பின்னொட்டு இங்கு பொய்யான பேச்சின் மறைமுகச் செயப்படுபொருளைக் குறிக்கிறது: அவர்கள் கடவுளிடம் பொய் சொன்னார்கள்.'
theological_decisions:
- issue: மனிதர்கள் கடவுளை உண்மையில் ஏமாற்றிவிட்டார்கள் என்று வசனம் கூறுகிறதா, அல்லது அவரிடம் வஞ்சகமாகப் பேசினார்கள் என்று கூறுகிறதா?
  choice: கடவுளிடம் உண்மையற்ற, நயமான பேச்சைப் பேசினார்கள் என மொழிபெயர்க்கப்பட்டது.
  alternative: ‘அவரை ஏமாற்றினார்கள்’ அல்லது ‘அவரைக் கவர்ந்தார்கள்.’
  rationale: மூல வினைச்சொல் ஏமாற்றுதல், கவர்தல், இணங்கச் செய்தல் ஆகிய அர்த்தங்களை அனுமதிக்கிறது. உடனுள்ள ‘அவரிடம் பொய் சொன்னார்கள்’ என்ற இணைவரி, உண்மையற்ற வாய்ப்பேச்சை முன்னிறுத்துகிறது. எனினும் மாற்றுப் பொருள்கள் அடிக்குறிப்பில் வைக்கப்பட்டு மூலத்தின் அர்த்த விரிவு பாதுகாக்கப்படுகிறது; கடவுள் உண்மையில் ஏமாற்றப்பட்டாரா என்ற கேள்வி மொழிபெயர்ப்பால் தேவையின்றித் தீர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான கவித்துவ நடை. ‘வாய்/நாவு’ என்ற எபிரெய இணைநிலை பாதுகாக்கப்பட்டுள்ளது; ‘நயமாகப் பேசி’ என்பது தற்போதைய தமிழில் இயல்பாக இருந்து, போலியான இனிய பேச்சைச் சுட்டுகிறது.
