    text: 'வேறு விதமாக: “அவருடைய வல்லமையை” அல்லது “அவருடைய கை செய்ததை.” எபிரெய மூலத்தில் சொல்லுக்குச் சொல் “அவருடைய கை” என்று உள்ளது.'
