  yaml_path: translation/ot/psalms/078/042.yaml
  text: They did not remember his hand[b][a], the day when he redeemed them from the foe.
translation:
  language: ta
  text: 'பகைவனிடமிருந்து[b] அவர்களை அவர் மீட்ட நாளில், அவர்கள் அவருடைய கையை[a] நினைவுகூரவில்லை.


    [a] வேறு விதமாக: “அவருடைய வல்லமையை” அல்லது “அவருடைய கை செய்ததை.” எபிரெய மூலத்தில் சொல்லுக்குச் சொல் “அவருடைய கை” என்று உள்ளது.

    [b] வேறு விதமாக: “எதிரியிடமிருந்து” அல்லது “விரோதியிடமிருந்து.”'
  philosophy: optimal-equivalence
  footnotes:
