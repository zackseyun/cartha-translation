lexical_decisions:
- source_word: זָכְרוּ
  choice: நினைவுகூரவில்லை
  rationale: זכר என்பதன் அடிப்படைப் பொருளான ‘நினைவுகூர்/நினைவில் கொள்’ என்பதை நேரடியாகத் தக்கவைக்கிறது; ‘மறந்தார்கள்’ என்பதைவிட எபிரெயச் சொல்லமைப்புக்கு நெருக்கமானது.
- source_word: יָדוֹ
  choice: அவருடைய கையை
  rationale: ‘கை’ என்பது வல்லமையையும் செயலையும் குறிக்கும் எபிரெய உருவகம். அதை விளக்கப் பொருளாக மாற்றாமல், மூலத்தின் தெளிவான உருவகத்தை முதன்மை உரையில் தக்கவைக்கிறது.
- source_word: יוֹם אֲשֶׁר
  choice: அவர்களை அவர் மீட்ட நாளில்
  rationale: יום אשר என்பதன் காலப்பொருளை இயல்பான தமிழில் ‘... நாளில்’ என்று வெளிப்படுத்துகிறது.
- source_word: פָּדָם
  choice: அவர்களை அவர் மீட்ட
  rationale: פדה என்பது அடிமைத்தனம் அல்லது ஆபத்திலிருந்து விலைகொடுத்து விடுவித்தல்/மீட்டல் என்ற பொருள்வட்டத்தைக் கொண்டது. இங்கு ‘மீட்ட’ என்பது யாத்திராகமச் சூழலின் மீட்புப் பொருளை இயல்பாகத் தக்கவைக்கிறது.
- source_word: מִנִּי צָר
  choice: பகைவனிடமிருந்து
  rationale: צָר என்பது பகைவன், எதிரி, விரோதி அல்லது ஒடுக்குபவன் என்பதைக் குறிக்கலாம். ‘பகைவன்’ கவிதை நடைக்கும் பொதுவான நவீன தமிழுக்கும் பொருந்துகிறது.
theological_decisions:
- issue: ‘அவருடைய கை’ என்ற உருவகத்தின் பொருள்
  choice: முதன்மை உரையில் ‘அவருடைய கையை’ என்ற உருவகத்தைத் தக்கவைத்தல்
  alternative: ‘அவருடைய வல்லமையை’ அல்லது ‘அவருடைய கை செய்ததை’
  rationale: மூல எபிரெயம் வல்லமையையும் செயலையும் குறிக்கும் ‘கை’ என்ற திடமான உருவகத்தைப் பயன்படுத்துகிறது. அதைத் தக்கவைப்பது உரையின் உருவகச் செறிவையும் உண்மையான பொருள் விரிவையும் பாதுகாக்கிறது.
- issue: யாத்திராகமச் சூழலில் פדה என்பதன் மொழிபெயர்ப்பு
  choice: ‘மீட்ட’
  alternative: ‘விடுவித்த’ அல்லது ‘விலைகொடுத்து மீட்ட’
  rationale: ‘மீட்ட’ என்பது தேவன் இஸ்ரவேலை ஒடுக்குதலிலிருந்து காப்பாற்றிய செயலைக் குறிக்கும் சொல்லின் மீட்புப் பொருளைத் தக்கவைக்கிறது; அதே நேரத்தில் மூலத்தில் வெளிப்படையாகக் கூறப்படாத விலைக்கொடுப்பைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில், சங்கீதத்துக்கேற்ற கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. காலத்தைக் குறிக்கும் பகுதி தமிழின் இயல்பான வாக்கிய ஒழுங்குக்காக முன்னிறுத்தப்பட்டுள்ளது; எபிரெயத்தின் ‘கை’ உருவகம் முதன்மை உரையில் பாதுகாக்கப்பட்டுள்ளது.
