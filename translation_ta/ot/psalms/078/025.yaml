source:
  edition: WLC
  text: לֶ֣חֶם אַ֭בִּירִים אָ֣כַל אִ֑ישׁ צֵידָ֬ה שָׁלַ֖ח לָ/הֶ֣ם לָ/שֹֽׂבַע׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/025.yaml
  text: Man ate the bread of the mighty[a]; he sent them provisions to the full.
translation:
  language: ta
  text: 'வலிமைமிக்கோரின் அப்பத்தை[a] மனிதன் உண்டான்;

    அவர் அவர்களுக்குத் திருப்தியடையும் அளவுக்கு உணவை அனுப்பினார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தேவதூதர்களின் அப்பம்.” எபிரெயத்தில் நேரடியான சொற்பொருள், “வலிமைமிக்கோரின் அப்பம்” அல்லது “வல்லவர்களின் அப்பம்.”
    reason: alternative_reading
lexical_decisions:
- source_word: לֶחֶם
  choice: அப்பம்
  rationale: எபிரெயச் சொல்லின் அடிப்படைப் பொருளான ‘அப்பம்’ என்பதையும் கவிதையின் தெளிவான உருவகத்தையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: אַבִּירִים
  choice: வலிமைமிக்கோர்
  rationale: இச்சொல் அடிப்படையில் வலிமையுள்ளவர்களை அல்லது வல்லவர்களைக் குறிக்கிறது. ‘தேவதூதர்கள்’ என்பது சூழல்சார்ந்த பழமையான விளக்கம் என்பதால், நேரடியான பொருள் முதன்மை உரையில் வைக்கப்படுகிறது.
- source_word: אָכַל
  choice: உண்டான்
  rationale: நிறைவுற்ற செயலைக் குறிக்கும் வினை வடிவம் இங்கு கடந்தகாலக் கதைநடையில் இயல்பாக மொழிபெயர்க்கப்படுகிறது.
- source_word: אִישׁ
  choice: மனிதன்
  rationale: ஒருமைச் சொல் இங்கு மனிதரைப் பொதுப்படையாகப் பிரதிநிதித்துவப்படுத்துகிறது; தமிழில் ‘மனிதன்’ அந்த ஒருமை வடிவத்தையும் பொதுப்பொருளையும் தக்கவைக்கிறது.
- source_word: צֵידָה
  choice: உணவு
  rationale: தேவைக்காக வழங்கப்பட்ட உணவு அல்லது உணவுப்பொருளைக் குறிக்கிறது. இச்சூழலில் ‘உணவு’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: שָׁלַח
  choice: அனுப்பினார்
  rationale: எபிரெய வினையின் நேரடியான பொருள் ‘அனுப்புதல்’; ‘கொடுத்தார்’ என்று மாற்றுவது தேவையற்ற விளக்கமாகிவிடும்.
- source_word: לָשֹׂבַע
  choice: நிறைவடையும் அளவுக்கு
  rationale: வயிறார உண்டு திருப்தியடையும் போதுமான அளவை இச்சொற்றொடர் குறிக்கிறது; தமிழில் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: אַבִּירִים என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘வலிமைமிக்கோர்’
  alternative: ‘தேவதூதர்கள்’
  rationale: மன்னா பற்றிய சூழலும் பழமையான மொழிபெயர்ப்பு மரபும் ‘தேவதூதர்கள்’ என்ற புரிதலை ஆதரித்தாலும், எபிரெயச் சொல் தானாகவே தேவதூதர்களைத் தெளிவாகக் குறிப்பிடவில்லை. ஆகவே நேரடியான சொற்பொருள் முதன்மை உரையில் வைக்கப்பட்டு, மரபுவழி விளக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், சங்கீதக் கவிதைக்கு ஏற்ற கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் ஒருமை வடிவமும் ‘அப்பம்’ என்ற தெளிவான உருவகமும் தக்கவைக்கப்பட்டுள்ளன.
