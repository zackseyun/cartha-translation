lexical_decisions:
- source_word: וַיַּךְ
  choice: அடித்தார்
  rationale: נכה என்பதன் தொடர்நிகழ்வு வடிவம் கடந்தகாலச் செயலைக் கூறுகிறது. மரணத்தைத் தனியாகக் குறிப்பதில்லை என்பதால் ‘வீழ்த்தினார்’ என்று மிகைப்படுத்தாமல், இயல்பான ‘அடித்தார்’ பயன்படுத்தப்பட்டது.
- source_word: צָרָיו
  choice: தம் எதிரிகளை
  rationale: பகைவர் அல்லது எதிர்ப்பவர் என்ற பொருளைத் தருகிறது. ‘எதிரிகள்’ நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது; ‘தம்’ என்பது எழுவாயான இறைவனோடு உடைமையை இணைக்கிறது.
- source_word: אָחוֹר
  choice: பின்னோக்கி
  rationale: திசையைக் குறிக்கும் வினையடைப் பொருளை நேரடியாகப் பாதுகாக்கிறது. அதே எபிரேயச் சொல் தாக்கப்பட்ட இடமாக, ‘முதுகில்’ என்றும் புரிந்துகொள்ளப்படலாம்; அந்த மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: חֶרְפַּת עוֹלָם
  choice: என்றென்றும் நீங்காத அவமானம்
  rationale: חֶרְפָּה பொதுமக்கள் முன் ஏற்படும் பழி அல்லது அவமானத்தையும், עוֹלָם நீடித்த தன்மையையும் குறிக்கிறது. ‘என்றென்றும் நீங்காத’ என்பது இங்கு தொடர்ந்திருக்கும் அவமானத்தை இயல்பான தமிழில் தெரிவிக்கிறது; தத்துவ ரீதியான முழுமையான நித்தியத்தை வற்புறுத்துவதில்லை.
- source_word: נָתַן לָמוֹ
  choice: அவர்களை ... உள்ளாக்கினார்
  rationale: நேரடியாக ‘அவர்களுக்குக் கொடுத்தார்’ என்பதற்குப் பதிலாக, ஒருவர்மேல் அவமானத்தை ஏற்படுத்துதல் என்ற எபிரேயச் சொல்லாட்சியின் பொருளைத் தெளிவான தமிழில் வெளிப்படுத்துகிறது.
