  yaml_path: translation/ot/psalms/078/066.yaml
  text: He struck his foes backward[a]; he put everlasting disgrace on them.
translation:
  language: ta
  text: அவர் தம் எதிரிகளைப் பின்னோக்கி அடித்தார்[a]; அவர்கள்மேல் நிலையான பழியை ஏற்படுத்தினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர் தம் எதிரிகளை முதுகில் அடித்தார்.” எபிரேயச் சொல்லை “பின்னோக்கி” என்று திசையைக் குறிப்பதாகவோ, “முதுகில்” என்று அடிபட்ட இடத்தைக் குறிப்பதாகவோ புரிந்துகொள்ளலாம்.
