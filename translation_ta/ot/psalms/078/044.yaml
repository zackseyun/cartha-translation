  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. எபிரெயக் கவிதையின் இரு அரையடிகளும் அரைப்புள்ளியால் பிரிக்கப்பட்டுள்ளன. தேவனைச் சுட்டும் ஒருமை மரியாதை வடிவமான ‘அவர்’ பயன்படுத்தப்பட்டுள்ளது; மூலத்தில் வெளிப்படையாக இல்லாத ‘அதிலிருந்து’ என்ற உறவை இயல்பான தமிழுக்காக வேற்றுமை உருபால் வெளிப்படுத்தியுள்ளோம்.
