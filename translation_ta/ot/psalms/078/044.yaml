  yaml_path: translation/ot/psalms/078/044.yaml
  text: He turned their rivers to blood[a], and their flowing streams[c][b], so that they could not drink.
translation:
  language: ta
  text: அவர்களுடைய ஆறுகளையும் ஓடும் நீரோடைகளையும்[a][b][c] அவர் இரத்தமாக மாற்றினார்; அதனால் அவர்களால் அவற்றிலிருந்து குடிக்க முடியவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஆறுகள்’ என்பதற்கு மாற்றாக ‘நைல் நதிக் கால்வாய்கள்’ என்றும் மொழிபெயர்க்கலாம்; எகிப்தியச் சூழலில் எபிரெயச் சொல் நைல் நதியையோ அதன் கால்வாய்களையோ அடிக்கடி குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘ஓடும் நீரோடைகள்’ என்பதற்கு மாற்றாக ‘ஓடும் நீர்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: இரண்டாம் அரையடியை, ‘அவர்களுடைய ஓடும் நீரோடைகளிலிருந்தும் அவர்களால் குடிக்க முடியவில்லை’ என, முதல் வினையிலிருந்து தனித்த விளைவுக் கூற்றாகவும் வாசிக்கலாம்.
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: וַיַּהֲפֹךְ
  choice: மாற்றினார்
  rationale: הפך என்பது ஒன்றை வேறொரு நிலைக்கு மாற்றுவதைக் குறிக்கிறது. ‘மாற்றினார்’ என்பது தமிழில் இயல்பாகவும் விளைவுநிலையைத் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: לְדָם
  choice: இரத்தமாக
  rationale: לְ இங்கு ஏற்பட்ட விளைவுநிலையைக் குறிக்கிறது; தமிழில் ‘இரத்தமாக’ அதனைச் சுருக்கமாகவும் துல்லியமாகவும் வெளிப்படுத்துகிறது.
- source_word: יְאֹרֵיהֶם
  choice: அவர்களுடைய ஆறுகளை
  rationale: எகிப்தியச் சூழலில் יְאֹר என்பது நைல் நதியையோ அதன் கால்வாய்களையோ அடிக்கடி குறிக்கும். பொதுவாசகருக்கு இயல்பான ‘ஆறுகள்’ முதன்மை உரையில் வைக்கப்பட்டு, குறிப்பான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְנֹזְלֵיהֶם
  choice: அவர்களுடைய ஓடும் நீரோடைகளிலிருந்தும்
  rationale: נזל வேரின் ‘ஓடுதல்’ என்ற படிமத்தை ‘ஓடும்’ காக்கிறது. குடிப்பதற்கான நீராதாரம் என்ற பொருளை இயல்பான தமிழில் வெளிப்படுத்த ‘நீரோடைகளிலிருந்து’ என அமைக்கப்பட்டுள்ளது.
- source_word: בַּל יִשְׁתָּיוּן
  choice: அவர்களால் குடிக்க முடியவில்லை
  rationale: கவிதைநடை மறுப்பான בַּל உடன் வரும் வினை, இச்சூழலில் குடிக்க இயலாமை அல்லது ஏற்பட்ட விளைவைக் குறிக்கிறது. ‘குடிக்க முடியவில்லை’ இதைத் தெளிவாகத் தருகிறது.
theological_decisions:
- issue: இரண்டாம் அரையடியின் தொடரியல் தொடர்பு
  choice: ‘அவர்களுடைய ஓடும் நீரோடைகளிலிருந்தும் அவர்களால் குடிக்க முடியவில்லை’ என்ற தனி விளைவு வாக்கியமாக மொழிபெயர்க்கப்பட்டது.
  alternative: முதல் வினையை இரண்டாம் பொருளுக்கும் நீட்டி, ‘அவர்கள் குடிக்க முடியாதபடி அவர்களுடைய ஓடும் நீரோடைகளையும் [இரத்தமாக] மாற்றினார்’ என்று புரிந்துகொள்ளலாம்.
  rationale: மசோரா இடைநிறுத்தமும் எபிரெய வாக்கிய அமைப்பும் இரண்டாம் பகுதியை முன்வைக்கப்பட்ட பொருளுடன் கூடிய தனி கூற்றாக வாசிக்க இடமளிக்கின்றன; அதேவேளை இணையான கவிதை அமைப்பு முதல் வினையின் நீட்சியையும் சாத்தியமாக்குவதால் அந்த மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
