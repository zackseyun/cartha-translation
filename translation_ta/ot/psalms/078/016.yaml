lexical_decisions:
- source_word: וַיּוֹצִא
  choice: புறப்படச் செய்தார்
  rationale: יצא என்பதன் ஹிஃபில் வடிவம் காரணவினைப் பொருளைத் தருகிறது; கற்பாறையிலிருந்து நீரோடைகள் வெளிவரும்படி கடவுள் செய்தார் என்ற பொருளை இது காக்கிறது.
- source_word: נוֹזְלִים
  choice: நீரோடைகளை
  rationale: נזל என்பதிலிருந்து வரும் இச்சொல் பாய்கின்றவற்றைக் குறிக்கிறது; பின்னர் வரும் מָיִם மற்றும் வனாந்தரத் தண்ணீர் சூழலில் ‘நீரோடைகள்’ தெளிவான, இயல்பான தமிழாக்கம்.
- source_word: מִסָּלַע
  choice: கற்பாறையிலிருந்து
  rationale: סֶלַע பாறை அல்லது பாறைக்குன்றைக் குறிக்கலாம்; இங்கு வனாந்தர அற்புதத்தைக் குறிப்பதால் ‘கற்பாறை’ இயல்பாகவும் குறிப்பிட்ட பாறை என்ற உணர்வுடனும் அமைகிறது.
- source_word: וַיּוֹרֶד
  choice: பாய்ந்திறங்கச் செய்தார்
  rationale: ירד என்பதன் ஹிஃபில் வடிவம் கீழிறங்கச் செய்தல் என்ற காரணவினைப் பொருளைக் கொண்டது; தண்ணீருக்குரிய பாய்தல் என்ற இயல்பான உருவகத்தையும் ‘இறங்க’ என்ற திசையுணர்வையும் இத்தேர்வு காக்கிறது.
- source_word: כַּנְּהָרוֹת
  choice: ஆறுகளைப்போல்
  rationale: כְּ ஒப்புமையைக் குறிக்கிறது; נְהָרוֹת என்பதற்கு ‘ஆறுகள்’ என்பது நேரான பொருள்.
- source_word: מָיִם
  choice: தண்ணீரை
  rationale: எபிரெயில் வடிவம் பன்மையாக இருந்தாலும் இங்கு திரவப் பொருளைக் குறிக்கும் தொகைச்சொல்; நவீன தமிழில் ‘தண்ணீர்’ இயல்பானது.
