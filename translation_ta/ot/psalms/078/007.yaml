source:
  edition: WLC
  text: וְ/יָשִׂ֥ימוּ בֵֽ/אלֹהִ֗ים כִּ֫סְלָ֥/ם וְ/לֹ֣א יִ֭שְׁכְּחוּ מַֽעַלְלֵי אֵ֑ל וּ/מִצְוֺתָ֥י/ו יִנְצֹֽרוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/007.yaml
  text: so that they might set their hope in God and not forget the deeds of God[b][a], but keep his commandments.
translation:
  language: ta
  text: அவர்கள் இறைவன்மேல் தங்கள் நம்பிக்கையை வைக்கவும்[a], இறைவனின் செயல்களை[b] மறக்காமலும், அவருடைய கட்டளைகளைக் கடைப்பிடிக்கவும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தங்கள் உறுதிநம்பிக்கையை’ அல்லது ‘தங்கள் நம்பியிருப்பை’.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘இறைவனின் செய்கைகளை’ அல்லது ‘இறைவனின் கிரியைகளை’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָשִׂימוּ בֵאלֹהִים כִּסְלָם
  choice: அவர்கள் தங்கள் நம்பிக்கையை இறைவன்மேல் வைத்து
  rationale: שׂים என்பது ‘வை/நிறுத்து’ என்றும், כֶּסֶל என்பது இங்கு ‘நம்பிக்கை/நம்பியிருத்தல்’ என்றும் பொருள்படுகிறது. முந்தைய வசனத்தின் நோக்க ஓட்டத்தைத் தொடர்ந்து, தமிழில் இயல்பான நோக்கத் தொடராக அமைக்கப்பட்டுள்ளது.
- source_word: וְלֹא יִשְׁכְּחוּ
  choice: மறவாமல்
  rationale: שׁכח என்பதன் மறுப்பு வடிவத்தைத் தமிழின் நோக்கத் தொடருடன் இயல்பாக இணைக்கிறது.
- source_word: מַעַלְלֵי אֵל
  choice: இறைவனின் செயல்களை
  rationale: מַעֲלָלִים என்பது செயல்கள் அல்லது செய்கைகள் என்பதைக் குறிக்கிறது; தெளிவான நவீனத் தமிழுக்காக ‘செயல்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: וּמִצְוֺתָיו יִנְצֹרוּ
  choice: அவருடைய கட்டளைகளைக் கடைப்பிடிப்பதற்காக
  rationale: נצר என்பதன் அடிப்படை உணர்வு ‘காத்தல்/பாதுகாத்தல்’; கட்டளைகளைப் பொறுத்தவரை கவனமாக அனுசரிப்பதை ‘கடைப்பிடித்தல்’ இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: אֱלֹהִים மற்றும் אֵל ஆகிய இரு இறைச் சொற்களின் கவிதை இணைநிலை
  choice: இரண்டையும் ‘இறைவன்’ என்று மொழிபெயர்த்தல்
  alternative: אֵל என்பதை ‘வல்லவர்’ என்று வேறுபடுத்துதல்
  rationale: இவை இங்கு வெவ்வேறு இறையியல் அடையாளங்களை வலியுறுத்தாமல் கவிதை இணைநிலையில் வரும் பொதுவான இறைக் குறிப்புகள். செயற்கையான வேறுபாட்டைச் சேர்க்காமல் ஒரே தமிழ்ச் சொல்லால் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீன, கண்ணியமான, பொதுவாசகருக்குப் புரியும் தமிழ். சங்கீதத்தின் கவிதைநடையும் முந்தைய வசனத்திலிருந்து தொடரும் நோக்கப் பொருளும் காக்கப்பட்டுள்ளன; ‘கட்டளைகளைக் கடைப்பிடித்தல்’ வேதாகமப் பதிவுக்கு ஏற்ற இயல்பான தமிழ்.
