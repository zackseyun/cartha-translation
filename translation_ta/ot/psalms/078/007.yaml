- from: அவர்கள் தங்கள் நம்பிக்கையை இறைவன்மேல் வைத்து[a], இறைவனின் செயல்களை மறவாமல்[b], அவருடைய கட்டளைகளைக் கடைப்பிடிப்பதற்காக.
  to: அவர்கள் இறைவன்மேல் தங்கள் நம்பிக்கையை வைக்கவும்[a], இறைவனின் செயல்களை[b] மறக்காமலும், அவருடைய கட்டளைகளைக் கடைப்பிடிக்கவும்.
  rationale: 'The revision makes all three Hebrew verbal expressions parallel components of the purpose flow carried over from the preceding verse: that they may place their hope/confidence in God, not forget God''s deeds, and keep his commandments. Footnote anchors are placed directly after the terms they qualify.'
