  text: In spite of all this[a], they still sinned and did not believe in his wondrous works.
translation:
  language: ta
  text: இவையெல்லாம் இருந்தபோதிலும், அவர்கள் இன்னும் பாவம் செய்தார்கள்; அவருடைய வியத்தகு செயல்களில் நம்பிக்கை வைக்கவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவருடைய வியத்தகு செயல்களை நம்பவில்லை” / “அவருடைய வியத்தகு செயல்களில் நம்பிக்கை கொள்ளவில்லை.” எபிரெய வினை ‘நம்புதல்’ அல்லது ‘நம்பிக்கை வைத்தல்’ என்ற பொருள்களைத் தரலாம்; அதனுடன் வரும் முன்னிடைச்சொல்லையும் தமிழில் ஒன்றுக்கு மேற்பட்ட விதங்களில் இயல்பாக மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/כָל זֹאת
  choice: இவை அனைத்தும் நடந்தபோதிலும்
  rationale: בכל זאת என்பது இங்கு இடப்பொருளை அல்ல, விட்டுக்கொடுப்பு சார்ந்த ‘இவை அனைத்தையும் மீறியும்’ என்ற கருத்தைத் தருகிறது. முந்தைய நியாயத்தீர்ப்பும் பராமரிப்பும் நடந்தபோதிலும் அவர்கள் பாவத்தில் தொடர்ந்ததை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: חָטְאוּ עוֹד
  choice: தொடர்ந்து பாவம் செய்தார்கள்
  rationale: חָטְאוּ என்பதன் இயல்பான பொருள் ‘பாவம் செய்தார்கள்’; עוֹד இங்கு முந்தைய நிகழ்வுகளுக்குப் பின்னரும் செயல் நீடித்ததைச் சுட்டுகிறது. ‘தொடர்ந்து’ என்பது அந்த விடாப்பிடியான நீட்சியைத் தெளிவாகக் காட்டுகிறது.
- source_word: וְ/לֹא
  choice: …வில்லை
  rationale: எபிரெய இணைப்பும் மறுப்பும் தமிழில் முந்தைய கூறுடன் அரைப்புள்ளி வழியாக இணைக்கப்பட்ட எதிர்மறை வினையாக இயல்பாக வெளிப்படுகின்றன; தேவையற்ற வலுவான முரண்பாடு சேர்க்கப்படவில்லை.
- source_word: הֶאֱמִינוּ
  choice: நம்பிக்கை வைக்கவில்லை
  rationale: אמן என்பதன் ஹிஃபில் வடிவம் ‘நம்புதல்’ அல்லது ‘நம்பிக்கை வைத்தல்’ என்று பொருள்படலாம். ב முன்னிடைச்சொல்லுடன் வரும் இவ்வமைப்பில் ‘நம்பிக்கை வைக்கவில்லை’ என்பது அறிவார்ந்த ஏற்றுக்கொள்ளுதலையும் சார்ந்திருக்கும் நம்பிக்கையையும் முழுமையாகப் பிரித்துவிடாமல் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: בְּ/נִפְלְאוֹתָיו
  choice: அவருடைய வியத்தகு செயல்களில்
  rationale: נפלאות என்பது கடவுளின் அசாதாரணமான, வியப்பூட்டும் செயல்களைக் குறிக்கிறது. ‘வியத்தகு செயல்கள்’ அவை வெறும் உணர்ச்சியூட்டும் அதிசயங்கள் அல்ல, அவர் நிகழ்த்திய செயல்கள் என்பதையும் காட்டுகிறது; ஆண்பால் ஒருமை பின்னொட்டு ‘அவருடைய’ என மொழிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: கடவுளுடைய வியத்தகு செயல்களுக்கு இஸ்ரவேலர் காட்டிய எதிர்வினையின் தன்மை
  choice: அவருடைய வியத்தகு செயல்களில் நம்பிக்கை வைக்கவில்லை
  alternative: அவருடைய வியத்தகு செயல்களை நம்பவில்லை / அவருடைய வியத்தகு செயல்களைச் சார்ந்திருக்கவில்லை
  rationale: எபிரெய வினை நம்புதல் மற்றும் நம்பிக்கை வைத்தல் ஆகிய இரு நிழற்பொருள்களையும் கொண்டிருக்கலாம். கடவுள் வெளிப்படையாகச் செய்த செயல்களின் முன்னிலையிலும் மக்களிடம் நம்பிக்கை பிறக்கவில்லை என்ற இறையியல் பதற்றத்தை மொழிபெயர்ப்பு காக்கிறது; விசுவாசம், கடினப்படுதல், அல்லது உடன்படிக்கைத் துரோகம் குறித்த விரிவான கோட்பாட்டை வசனத்திற்குள் சேர்க்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தரத் தமிழ்; எளிதில் புரியக்கூடியதாயும் சங்கீதத்திற்கேற்ற கண்ணியமுடையதாயும் அமைக்கப்பட்டது. ‘தொடர்ந்து’ என்பது עוֹד-ன் நீடித்த செயற்பொருளைத் தருகிறது. ‘வியத்தகு செயல்கள்’ என்பது ‘அதிசயங்கள்’ என்பதைவிட נפלאות-ன் செயல் சார்ந்த பரப்பைச் சிறப்பாகக் காக்கிறது.
