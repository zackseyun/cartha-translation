source:
  edition: WLC
  text: יַהֲרֹ֣ג בַּ/בָּרָ֣ד גַּפְנָ֑/ם וְ֝/שִׁקְמוֹתָ֗/ם בַּֽ/חֲנָמַֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/047.yaml
  text: He destroyed their vines with hail[a], and their sycamore trees with frost.
translation:
  language: ta
  text: 'அவர் அவர்களுடைய திராட்சைக்கொடிகளை ஆலங்கட்டியாலும்,

    அவர்களுடைய காட்டத்தி மரங்களை உறைபனியாலும்[a] அழித்தார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உறைபனி” என்று மொழிபெயர்க்கப்பட்டுள்ள எபிரெயச் சொல் அரிதானது; அதன் பொருள் உறுதியற்றது. இதை “வெட்டுக்கிளிகள்,” “ஆலங்கற்கள்,” அல்லது “பனிக்கட்டி மழை” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַהֲרֹג
  choice: அழித்தார்
  rationale: வினைச்சொல்லின் அடிப்படைப் பொருள் ‘கொன்றார்’ என்றாலும், இங்கு அதன் பொருள்கள் தாவரங்கள் என்பதால் விளைவை இயல்பாகக் கூற ‘அழித்தார்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: בַּבָּרָד
  choice: ஆலங்கட்டியால்
  rationale: ב முன்னொட்டு கருவிப்பொருளில் வந்து, திராட்சைக்கொடிகள் ஆலங்கட்டி மூலம் அழிக்கப்பட்டதைக் குறிக்கிறது.
- source_word: גַּפְנָם
  choice: அவர்களுடைய திராட்சைக்கொடிகளை
  rationale: ஒருமை வடிவிலுள்ள கூட்டுப்பெயர் திராட்சைக்கொடிகளைப் பொதுவாகக் குறிக்கிறது; பயிரிடப்பட்ட நிலப்பகுதியைக் குறிக்கும் ‘திராட்சைத்தோட்டங்கள்’ என்பதைவிட இது மூலத்துக்கு நெருக்கமானது.
- source_word: וְשִׁקְמוֹתָם
  choice: அவர்களுடைய காட்டத்தி மரங்களை
  rationale: שִׁקְמָה என்பது sycamore fig (Ficus sycomorus) மரத்தைக் குறிக்கிறது; ‘காட்டத்தி மரம்’ என்பது தமிழில் புரிந்துகொள்ளத்தக்க தாவரப்பெயர்.
- source_word: בַּחֲנָמַל
  choice: உறைபனியால்
  rationale: இந்த அரிய சொல்லின் பொருள் உறுதியற்றது. ஆலங்கட்டிக்கு இணையான பயிரழிக்கும் வானிலை நிகழ்வாக ‘உறைபனி’ என்பது பழமையானதும் சூழலுக்குப் பொருத்தமானதுமான விளக்கம்; பிற சாத்தியங்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
