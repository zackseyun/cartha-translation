  to: அவர் அவர்கள்மேல் இறைச்சியைத் தூசியைப்போல் மழையாகப் பொழிந்தார்; கடல்களின் மணலைப்போல் சிறகுள்ள பறவைகளையும் பொழிந்தார்.
  rationale: This is a light stylistic revision only. It preserves the source’s two comparisons, its plural ‘seas,’ and its depiction of God raining down meat and winged birds, while improving Tamil coordination and the scope of ‘upon them.’ No footnote is required because the chosen Tamil terms do not leave a necessary unresolved ambiguity in this verse.
