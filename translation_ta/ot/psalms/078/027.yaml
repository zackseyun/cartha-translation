translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை. எபிரெய இணைவரி அமைப்பை உணர்த்த இரண்டாம் வரியிலும் ‘பொழிந்தார்’ மீண்டும் வெளிப்படுத்தப்பட்டுள்ளது; இது தமிழில் வாக்கியத்தை நிறைவாக்குகிறது. மூலத்தில் உள்ள ‘கடல்கள்’ என்ற பன்மை பாதுகாக்கப்பட்டுள்ளது.
