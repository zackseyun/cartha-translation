translation:
  language: ta
  text: அவர் அவர்கள்மேல் இறைச்சியைத் தூசியைப்போல் மழையாகப் பொழிந்தார்; கடல்களின் மணலைப்போல் சிறகுள்ள பறவைகளையும் பொழிந்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּמְטֵר
  choice: மழையாகப் பொழிந்தார்
  rationale: מטר என்பதன் ஹிஃபில் வடிவம் ‘மழையாகப் பொழியச் செய்தார்’ என்ற காரணவினைப் பொருளைத் தருகிறது. தமிழில் ‘மழையாகப் பொழிந்தார்’ என்பது அந்தப் படிமத்தையும் செயற்பொருளையும் இயல்பாகக் காக்கிறது.
- source_word: עֲלֵיהֶם
  choice: அவர்கள்மேல்
  rationale: על என்பதும் பன்மைச் சுட்டுப்பெயர் பின்னொட்டும் சேர்ந்து ‘அவர்கள்மேல்’ என்று நேரடியாகப் பொருள்படுகின்றன.
- source_word: כֶּעָפָר
  choice: தூசியைப்போல்
  rationale: כ ஒப்புமையைக் குறிக்கிறது; עָפָר என்பதற்கான இயல்பான நேரடிப் பொருள் ‘தூசி’.
- source_word: שְׁאֵר
  choice: இறைச்சி
  rationale: שְׁאֵר என்பது சதை அல்லது உணவுக்குரிய இறைச்சியைக் குறிக்கலாம். வனாந்தரத்தில் உணவாக வழங்கப்பட்ட பறவைகள் குறித்த இச்சூழலில் ‘இறைச்சி’ தெளிவானதும் இயல்பானதும் ஆகும்.
- source_word: וּכְחוֹל יַמִּים
  choice: கடல்களின் மணலைப்போல்
  rationale: எபிரெய உரையில் יַמִּים ‘கடல்கள்’ எனப் பன்மையில் உள்ளது. தமிழிலும் அந்தப் பன்மையை இயல்பாகத் தக்கவைக்க முடிகிறது.
- source_word: עוֹף כָּנָף
  choice: சிறகுள்ள பறவைகள்
  rationale: சொல்லுக்கு சொல் ‘சிறகுடைய பறவை’ என்ற இந்த எபிரெயச் சொற்றொடரை, தற்போதைய தமிழில் இயல்பாகவும் படிமம் குன்றாமலும் ‘சிறகுள்ள பறவைகள்’ என வழங்கலாம்.
