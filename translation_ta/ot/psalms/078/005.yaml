  text: וַ/יָּ֤קֶם עֵד֨וּת בְּֽ/יַעֲקֹ֗ב וְ/תוֹרָה֮ שָׂ֤ם בְּ/יִשְׂרָ֫אֵ֥ל אֲשֶׁ֣ר צִ֭וָּה אֶת אֲבוֹתֵ֑י/נוּ לְ֝/הוֹדִיעָ֗/ם לִ/בְנֵי/הֶֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/005.yaml
  text: For he established a testimony in Jacob and set a law in Israel[c][b][a], which he commanded our fathers to make known to their children.
translation:
  language: ta
  text: அவர் யாக்கோபில் ஒரு சாட்சியை நிலைநிறுத்தி, இஸ்ரவேலில் ஒரு சட்டத்தை[a] ஏற்படுத்தினார். அவற்றைத் தங்கள் பிள்ளைகளுக்கு[c] அறிவிக்கும்படி அவர் நம் தந்தையருக்குக்[b] கட்டளையிட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘சட்டம்’ என்பதற்குப் பதிலாக ‘போதனை’ என்றும் மொழிபெயர்க்கலாம் (எபிரெயம்: தோரா).'
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் ‘நம் தந்தையர்’; மூலம் வெளிப்படையாக ஆண்பால் சொல்லைப் பயன்படுத்துவதால் அது இங்கே தக்கவைக்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: c
    text: எபிரெயத்தில் ‘அவர்களுடைய மகன்கள்’; இங்கு தலைமுறைகளுக்கிடையிலான சூழலில் இச்சொல் பிள்ளைகளைப் பொதுவாகக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: நிலைநிறுத்தி
  rationale: קום என்பதன் ஹிஃபீல் வடிவம் ஒன்றை நிலைபெறச் செய்தல் அல்லது நிறுவுதல் என்ற பொருளைத் தருகிறது; சாட்சியைப் பற்றிய இச்சூழலில் ‘நிலைநிறுத்தி’ இயல்பாக உள்ளது.
- source_word: עֵדוּת
  choice: ஒரு சாட்சி
  rationale: இச்சொல் சாட்சி என்பதையும் உடன்படிக்கை சார்ந்த சான்று அல்லது நியமம் என்பதையும் குறிக்கலாம்; ‘சாட்சி’ அதன் அடிப்படைப் பொருளையும் இங்குள்ள சாத்தியமான விரிவையும் பாதுகாக்கிறது.
- source_word: בְּיַעֲקֹב
  choice: யாக்கோபில்
  rationale: ב முன்னிடைச்சொல்லின் நேரிய பொருளையும் ‘இஸ்ரவேலில்’ என்ற இணைவரியுடனான எபிரெயக் கவிதை ஒத்திசைவையும் இது காக்கிறது; ‘யாக்கோபு’ இங்கு மக்களைக் கூட்டாகக் குறிக்கிறது.
- source_word: וְתוֹרָה
  choice: ஒரு சட்டத்தை
  rationale: תורה என்பது போதனை அல்லது சட்டம் எனப் பொருள்படும். עֵדוּת உடன் இணைந்த உடன்படிக்கைச் சூழலில் அதன் கட்டுப்படுத்தும் தன்மையை ‘சட்டம்’ தெளிவாகத் தருகிறது; ‘போதனை’ அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: שָׂם
  choice: ஏற்படுத்தினார்
  rationale: שים என்பது வைக்குதல் அல்லது ஏற்படுத்துதல். தமிழில் ஒரு மக்களிடையே சட்டத்தை நிறுவும் கருத்துக்கு ‘ஏற்படுத்தினார்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: בְּיִשְׂרָאֵל
  choice: இஸ்ரவேலில்
  rationale: மூலத்தின் முன்னிடைச்சொல்லையும் ‘யாக்கோபில்’ என்பதுடனான இணை அமைப்பையும் காக்கிறது.
- source_word: אֲשֶׁר צִוָּה
  choice: கட்டளையிட்டார்
  rationale: צוה என்பதன் கட்டளையிடுதல் என்ற நேரிய வினைப் பொருளை இது தருகிறது. தமிழ் வாக்கிய அமைப்பில் தொடர்புப்பகுதி இயல்பாக மறுசீரமைக்கப்பட்டுள்ளது.
- source_word: אֶת אֲבוֹתֵינוּ
  choice: நம் தந்தையருக்கு
  rationale: மூலம் வெளிப்படையாக ஆண்பால் பன்மையான ‘நம் தந்தையர்’ என்று கூறுவதால் அதைத் தக்கவைத்துள்ளது.
- source_word: לְהוֹדִיעָם
  choice: அவற்றை ... அறிவிக்கும்படி
  rationale: ידע என்பதன் ஹிஃபீல் வடிவம் ‘அறியச் செய்தல்’ என்று பொருள்படும். ஆண்பால் பன்மை பின்னொட்டு முன் கூறப்பட்ட சாட்சியையும் சட்டத்தையும் கூட்டாகச் சுட்டுவதால் தமிழில் ‘அவற்றை’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: לִבְנֵיהֶם
  choice: தங்கள் பிள்ளைகளுக்கு
  rationale: בנים வடிவத்தில் ‘மகன்கள்’ என்றாலும் தலைமுறைகளுக்கிடையிலான பரிமாற்றச் சூழலில் சந்ததியினரைப் பொதுவாகக் குறிக்கிறது; ‘பிள்ளைகள்’ அந்தப் பொருளை இயல்பாகத் தருகிறது.
theological_decisions:
- issue: உடன்படிக்கைச் சங்கீதச் சூழலில் תּוֹרָה என்பதன் மொழிபெயர்ப்பு
  choice: ஒரு சட்டம்
  alternative: ஒரு போதனை
  rationale: சாட்சியை நிலைநிறுத்துதல், அதைத் தலைமுறைகளுக்கு அறிவிக்கக் கட்டளையிடுதல் ஆகியவை நெறிப்படுத்தும் உடன்படிக்கைச் சூழலை உருவாக்குகின்றன. ‘சட்டம்’ அந்த அதிகாரத் தன்மையைப் பாதுகாக்கிறது; ‘போதனை’ என்ற உண்மையான மாற்றுப் பொருள் அடிக்குறிப்பில் உள்ளது.
- issue: אֲשֶׁר மற்றும் לְהוֹדִיעָם ஆகியவற்றின் தொடர்பும் எண்ணும்
  choice: கட்டளை தந்தையருக்குக் கொடுக்கப்பட்டது; அவர்கள் சாட்சியையும் சட்டத்தையும் பிள்ளைகளுக்கு அறிவிக்க வேண்டும்
  alternative: ஒருமைத் தொடர்புச்சொல்லைச் சட்டத்துக்கு மட்டும் இணைத்து, அதையே அறிவிக்க வேண்டும் என வாசித்தல்
  rationale: לְהוֹדִיעָם இல் உள்ள ஆண்பால் பன்மை பின்னொட்டு முன் கூறப்பட்ட இரண்டு கருத்துகளையும் கூட்டாகச் சுட்டுவதற்கு வலுவான ஆதாரம் தருகிறது. எபிரெயத்தில் אֲשֶׁר எண்ணைக் காட்டாததால் தமிழ் உரை தேவையற்ற ஒருமைத் தீர்மானத்தைத் தவிர்க்கிறது.
- issue: אֲבוֹתֵינוּ மற்றும் בְנֵיהֶם ஆகிய உறவுமுறைச் சொற்களில் பாலினம்
  choice: நம் தந்தையர் ... தங்கள் பிள்ளைகள்
  alternative: நம் முன்னோர் ... தங்கள் மகன்கள்
  rationale: முதல் சொல் வெளிப்படையாக ‘தந்தையர்’ என்பதால் அது தக்கவைக்கப்படுகிறது. இரண்டாவது சொல் இத்தலைமுறைச் சூழலில் பிள்ளைகளைப் பொதுவாகக் குறிக்கும் பிரதிநிதிப் பன்மையாக இருப்பதால் ‘பிள்ளைகள்’ என மொழிபெயர்க்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் மரியாதையும் சங்கீதத்திற்குரிய கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘யாக்கோபில் / இஸ்ரவேலில்’ என்ற இணை அமைப்பு எபிரெயக் கவிதை ஒத்திசைவைக் காக்கிறது. நீண்ட எபிரெய வாக்கியம் தமிழில் தெளிவுக்காக இரண்டு வாக்கியங்களாக அமைக்கப்பட்டாலும் காரணத்தொடரும் கருத்து வரிசையும் பாதுகாக்கப்பட்டுள்ளன.
