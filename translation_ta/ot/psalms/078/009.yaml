revisions:
- from: எபிராயீமின் மகன்கள்[a] ஆயுதம் ஏந்தி வில் எய்பவர்களாக இருந்தும், போர்நாளில் பின்வாங்கினர்.
  to: ஆயுதம் ஏந்தி வில் எய்யும் எபிராயீமின் மகன்கள்[a] போர்நாளில் பின்வாங்கினர்.
  rationale: The revision removes the added concessive connective while preserving the Hebrew’s compact description of Ephraim’s sons as armed bow shooters. It also uses more idiomatic modern Tamil for shooting with a bow and retains the tribal/genealogical wording in the main text. The footnote preserves the legitimate alternative of rendering the group as ‘Ephraimites.’
