  yaml_path: translation/ot/psalms/078/009.yaml
  text: The sons of Ephraim[a], armed with bows, turned back on the day of battle.
translation:
  language: ta
  text: ஆயுதம் ஏந்தி வில் எய்யும் எபிராயீமின் மகன்கள்[a] போர்நாளில் பின்வாங்கினர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆயுதம் ஏந்தி, வில் எய்யும் எபிராயீமியர் போர்நாளில் பின்வாங்கினர்.” எபிரெய மொழியில் இங்கு சுருக்கமான பங்கேற்புவினைச் சொற்றொடர் உள்ளது; அதைத் தமிழில் ஒன்றுக்கு மேற்பட்ட இயல்பான முறைகளில் தரலாம்.
