lexical_decisions:
- source_word: בְּנֵי אֶפְרַיִם
  choice: எபிராயீமின் மகன்கள்
  rationale: பழங்குடிப் பெயருடன் வரும் בְּנֵי என்பதன் நேரடியான வம்சவழி மொழிநடையைப் பேணுகிறது; தமிழிலும் இயல்பாகப் புரிகிறது.
- source_word: נוֹשְׁקֵי
  choice: ஆயுதம் ஏந்தி
  rationale: இங்கு வினைச்சொல் போருக்காக ஆயுதம் தரித்திருப்பதையோ ஆயுதம் பூண்டிருப்பதையோ குறிக்கிறது. ‘ஆயுதம் ஏந்தி’ என்பது தெளிவான நவீனத் தமிழ்.
- source_word: רוֹמֵי קָשֶׁת
  choice: வில் எய்பவர்கள்
  rationale: சொல்லடிப்படையில் ‘வில்லை எறிபவர்கள்/எய்பவர்கள்’; சூழலில் வில்லாளர்களைக் குறிக்கிறது. ‘வில் எய்பவர்கள்’ எபிரெய உருவகத்தை நேரடியாகப் பேணுகிறது.
- source_word: הָפְכוּ
  choice: பின்வாங்கினர்
  rationale: போர்ச் சூழலில் திரும்புதல் அல்லது பின்னோக்கிச் செல்லுதல் என்பதைக் குறிக்கிறது; ‘பின்வாங்கினர்’ அதன் பொருளை இயல்பாகத் தருகிறது, முற்றிலும் ஓடிப்போனார்கள் என்று மிகைப்படுத்தவில்லை.
- source_word: בְּיוֹם קְרָב
  choice: போர்நாளில்
  rationale: காலத்தைக் குறிக்கும் எபிரெய சொற்றொடரின் சுருக்கத்தையும் கவிதைநடையையும் இயல்பான தமிழில் தக்கவைக்கிறது.
