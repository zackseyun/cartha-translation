translation_notes:
  register: நவீனத் தரமான, கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆயுதம் ஏந்தி வில் எய்பவர்களாக இருந்தும்’ என்பது மூலத்தின் இரு தொடர்ச்சியான பங்கேற்புவினை வடிவங்களையும் வெளிப்படுத்துகிறது; ‘இருந்தும்’ என்பதில் போர்த்திறனுக்கும் பின்வாங்குதலுக்கும் இடையிலான மூலத்தில் உட்கிடக்கும் எதிர்மறை மாறுபாடு இயல்பான தமிழில் வெளிப்படுகிறது.
