source:
  edition: WLC
  text: לְ/דָוִ֡ד אֵלֶ֥י/ךָ יְ֝הוָ֗ה נַפְשִׁ֥/י אֶשָּֽׂא׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/000.yaml
  text: Of David. To you[a], Yahweh, I lift up my soul.
translation:
  language: ta
  text: 'தாவீதுக்குரியது.

    யாவே, உம்மிடம் என் உயிரை உயர்த்துகிறேன்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் வாழ்க்கையை” அல்லது “என்னையே.” எபிரெயச் சொல் நֶפֶשׁ (நெஃபெஷ்; இங்கே, “என் நெஃபெஷ்”) “உயிர்,” “வாழ்க்கை,” அல்லது முழு நபரைக் குறிக்கலாம்; உடலற்ற ஓர் அம்சத்தை மட்டும் அல்ல.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: தாவீதின் பாடல்
  rationale: சங்கீதத் தலைப்பில் உள்ள לְ־ உறவை இயல்பான தமிழில் காட்டுகிறது; இது ஆசிரியத்துவம் அல்லது தாவீதுடன் தொடர்பு ஆகியவற்றில் எதை மட்டும் குறிக்கிறது என்று அளவுக்கு மீறி தீர்மானிக்காமல், தலைப்பாக வாசிக்க உதவுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தேவனுடைய தனிப்பெயரான நான்கு எழுத்துப் பெயரை பொதுப்பட்டமான ‘ஆண்டவர்’ என்று மாற்றாமல் ஒலிபெயர்க்கிறது.
- source_word: נַפְשִׁי
  choice: என் உயிரை
  rationale: נֶפֶשׁ இங்கு முழு உயிருள்ள நபரையும் உயிரையும் குறிக்கக்கூடும்; ‘ஆத்துமா’ என்ற சொல் உருவாக்கக்கூடிய உடலற்ற பகுதி என்ற குறுகிய எண்ணத்தைத் தவிர்க்கிறது.
- source_word: אֶשָּׂא
  choice: உயர்த்துகிறேன்
  rationale: ‘தூக்குகிறேன்/உயர்த்துகிறேன்’ என்ற உருவகத்தைப் பாதுகாத்து, வேண்டுதல் மற்றும் நம்பிக்கையுடன் தன்னைத் தேவனிடம் ஒப்படைக்கும் கருத்தை முன்கூட்டியே விளக்கிவிடாமல் விடுகிறது.
theological_decisions:
- issue: נֶפֶשׁ என்பதன் மனித இயல்பு சார்ந்த பொருள்
  choice: என் உயிரை
  alternative: என் ஆத்துமாவை / என்னையே
  rationale: எபிரெயச் சொல் வெறும் உடலற்ற கூறை மட்டுமல்லாமல் உயிர் அல்லது முழு நபரைக் குறிக்க முடியும். முதன்மை உரையில் இயல்பான ‘உயிர்’ வைக்கப்பட்டு, பரந்த பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான பக்திப் பாங்கு பயன்படுத்தப்பட்டுள்ளது. தேவனை நோக்கிய மரியாதை ஒருமை வடிவமான ‘உம்மிடத்தில்’ தேர்ந்தெடுக்கப்பட்டுள்ளது; எபிரெய உருவகம் இயன்றவரை அப்படியே வைக்கப்பட்டுள்ளது.
