  rationale: The revision removes the unsupported addition “பாடல்” from the superscription while retaining its ambiguity, and it clarifies the lexical footnote for נֶפֶשׁ. The verse’s direct address, divine name, respectful Tamil register, and Hebrew lifting metaphor remain intact.
