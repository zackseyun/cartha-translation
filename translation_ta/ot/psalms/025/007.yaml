  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: חַטֹּ֤אות נְעוּרַ֨/י וּ/פְשָׁעַ֗/י אַל תִּ֫זְכֹּ֥ר כְּ/חַסְדְּ/ךָ֥ זְכָר לִ/י אַ֑תָּה לְמַ֖עַן טוּבְ/ךָ֣ יְהוָֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/007.yaml
  text: Do not remember the sins of my youth or my transgressions[a]; according to your steadfast love, remember me—for the sake of your goodness[b], O Yahweh.
translation:
  language: ta
  text: என் இளமைக் காலப் பாவங்களையும் என் மீறுதல்களையும் நினைவுகூராதிரும். யாவே, உமது மாறாத அன்பின்படி என்னை நினைவுகூரும்; உமது நன்மையின் பொருட்டு.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַטֹּאות נְעוּרַי
  choice: என் இளமைக் காலப் பாவங்கள்
  rationale: இது இளமைப் பருவத்துடன் தொடர்புடைய குறிப்பிட்ட பாவச் செயல்களைக் குறிக்கிறது; தமிழ் இயல்புக்கு ஏற்றவாறு உடைமைத் தொடர்பு தெளிவாகக் கொடுக்கப்பட்டுள்ளது.
- source_word: וּפְשָׁעַי
  choice: என் மீறுதல்கள்
  rationale: פשע என்பது சாதாரணத் தவறை விட அறிந்தே வரம்பு மீறுதல் அல்லது கலகம் செய்தல் என்ற வலிமையைக் கொண்டது; ‘மீறுதல்கள்’ அதன் அறநெறி மற்றும் சட்டத் தன்மையைத் தக்கவைக்கிறது.
- source_word: אַל תִּזְכֹּר
  choice: நினைவுகூராதிரும்
  rationale: இது இறைவனிடம் வைக்கப்படும் எதிர்மறை வேண்டுகோள். தொடர்ந்து வரும் நேர்மறையான ‘என்னை நினைவுகூரும்’ என்பதுடனான சொல்லியல் எதிரிணையையும் இந்த மொழிபெயர்ப்பு காக்கிறது.
- source_word: כְּחַסְדְּךָ
  choice: உமது மாறாத அன்பின்படி
  rationale: חסד என்பதில் அன்பு, விசுவாசத்தன்மை, நிலைத்த பற்றுறுதி ஆகியவை இணைந்துள்ளன. ‘மாறாத அன்பு’ இதை இயல்பான நவீன தமிழில் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: זְכָר לִי אַתָּה
  choice: என்னை நினைவுகூரும்
  rationale: என் பாவங்களை நினைவுகூர வேண்டாம் என்பதற்கு நேர்மறையான எதிரிணையாக, என்னை அருளுடன் கருத்தில் கொள்ள வேண்டும் என்ற வேண்டுகோள் உள்ளது. எபிரெய வலியுறுத்தும் சுட்டுப்பெயரை தமிழில் தனியே சேர்ப்பது இயல்பற்றதாக இருப்பதால் வினை வடிவில் விடப்பட்டுள்ளது.
- source_word: לְמַעַן טוּבְךָ
  choice: உமது நன்மையை முன்னிட்டு
  rationale: வேண்டுகோளுக்கான அடிப்படை இறைவனுடைய சொந்த நன்மையே என்பதை இது காட்டுகிறது. ‘முன்னிட்டு’ என்பது காரணம் அல்லது அடிப்படை என்ற நுணுக்கத்தை இயல்பாகத் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் உள்ள இறைத் திருப்பெயரை ஒரு பொதுப் பட்டத்தால் மாற்றாமல், தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பாக வழங்குகிறது.
theological_decisions:
- issue: חסד என்பதன் பரந்த பொருள்
  choice: மாறாத அன்பு
  alternative: இரக்கம்; உடன்படிக்கை அன்பு; பேரன்பு
  rationale: சொல்லை இரக்கம் என்ற ஒரே அம்சமாகக் குறுக்காமல், அன்பின் நிலைத்தன்மையையும் பற்றுறுதியையும் வெளிப்படுத்துகிறது. ‘உடன்படிக்கை’ என்பதை முதன்மை உரையில் சேர்ப்பது மூலத்தில் மறைமுகமாக உள்ள கருத்தை வெளிப்படையாகத் தீர்மானித்துவிடக்கூடும் என்பதால் அது அடிக்குறிப்பில் விளக்கப்படுகிறது.
- issue: இறைத் திருப்பெயர் יהוה
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட இறைத் திருப்பெயர் நேரடியாக உள்ளது; ஆகவே பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
- issue: பாவங்களை நினைவுகூராமையும் மனிதரை நினைவுகூருதலும்
  choice: ‘நினைவுகூர்’ என்ற ஒரே வினையை இரு இடங்களிலும் தக்கவைத்தல்
  alternative: முதல் இடத்தில் ‘கணக்கில் கொள்ளாதிரும்’, இரண்டாவது இடத்தில் ‘என்னை நினைத்தருளும்’
  rationale: எபிரெய உரையின் திட்டமிட்ட எதிரிணையைப் பாதுகாக்கிறது; பாவங்களை எதிராகக் கணக்கிடாமல், வேண்டுகிறவரை அருளுடன் கருத்தில் கொள்ளும் இறையியல் அழுத்தத்தை வாசகர் உணர வழிவகுக்கிறது.
translation_notes:
  register: நவீன செந்தமிழுக்கு அணுக்கமான, வழிபாட்டு மரியாதை கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. இறைவனை நோக்கிய ஒருமை மரியாதை வடிவங்களான ‘உமது’, ‘நினைவுகூரும்’ ஆகியவை தேர்ந்தெடுக்கப்பட்டன. மூலத்தின் ‘நினைவுகூர்/நினைவுகூர்’ எதிரிணை பாதுகாக்கப்பட்டுள்ளது; கடைசி காரணவுரை தமிழில் தெளிவாக அமைய ‘அப்படிச் செய்யும்’ சேர்க்கப்பட்டுள்ளது.
