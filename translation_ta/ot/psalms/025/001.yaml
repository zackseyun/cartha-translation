source:
  edition: WLC
  text: לְ/דָוִ֡ד אֵלֶ֥י/ךָ יְ֝הוָ֗ה נַפְשִׁ֥/י אֶשָּֽׂא׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/001.yaml
  text: Of David. To you[a], O Yahweh, I lift up my soul.
translation:
  language: ta
  text: 'தாவீதுக்கு உரியது.


    யாவே, உம்மிடத்தில் என் ஆத்துமாவை[a] உயர்த்துகிறேன்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது ‘என் உயிரை’ அல்லது ‘என்னையே’. ‘ஆத்துமா’ என மொழிபெயர்க்கப்பட்ட எபிரெயச் சொல் (நெஃபெஷ்) உடலற்ற ஓர் அம்சத்தை மட்டும் அல்லாமல் முழு நபரையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: தாவீதுக்கு உரியது
  rationale: சங்கீதத் தலைப்பில் வரும் לְ என்ற முன்னொட்டு ஆசிரியத்துவம், அர்ப்பணம் அல்லது தொடர்பு ஆகியவற்றைக் குறிக்கக்கூடும். ‘தாவீதுக்கு உரியது’ என்பது மூலத்தில் இல்லாத ‘சங்கீதம்’ என்ற சொல்லைச் சேர்க்காமல் அந்தத் தொடர்பின் தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: אֵלֶיךָ
  choice: உம்மிடத்தில்
  rationale: אֶל என்பதன் திசைநோக்கிய பொருளை இயல்பான நவீனத் தமிழில் தருகிறது; மரியாதை ஒருமை, தேவனை நேரடியாக அழைக்கும் சூழலுக்கு ஏற்றது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது ஒரு பட்டப்பெயர் அல்ல, எபிரெயத் தெய்வீகப் பெயரான יהוה-வின் ஒலிபெயர்ப்பு. ஆகவே ‘கர்த்தர்’ போன்ற மாற்றுப் பட்டத்தைப் பயன்படுத்தாமல் தனிப்பெயர் பாதுகாக்கப்படுகிறது.
- source_word: נַפְשִׁי
  choice: என் ஆத்துமாவை
  rationale: נֶפֶשׁ என்பது ஆத்துமா, உயிர், தன்முழுமை அல்லது நபர் எனப் பரந்த பொருளுடையது. ‘ஆத்துமா’ எபிரெய உருவகத்தையும் வழிபாட்டு மொழியின் கண்ணியத்தையும் காக்கிறது; அதன் பரந்த பொருள் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: אֶשָּׂא
  choice: உயர்த்துகிறேன்
  rationale: נָשָׂא என்பதன் அடிப்படைப் பொருள் ‘உயர்த்துதல்/தூக்குதல்’. ‘ஆத்துமாவை உம்மிடத்தில் உயர்த்துகிறேன்’ என்பது வேண்டுதல் அல்லது நம்பிக்கையுடன் தன்னை தேவனை நோக்கித் திருப்பும் மூல உருவகத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: יהוה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூல வசனம் உடன்படிக்கையின் தனிப்பெயரான יהוה-வை நேரடியாகப் பயன்படுத்துகிறது. ‘யாவே’ என்பது பட்டப்பெயரால் மாற்றாமல் அந்தப் பெயரை ஒலிபெயர்க்கிறது.
- issue: נֶפֶשׁ என்பதன் மனிதவியல் பரப்பு
  choice: ஆத்துமா; அடிக்குறிப்பில் ‘உயிர்’ மற்றும் ‘என்னையே’
  alternative: உயிர் / என்னையே
  rationale: இங்கே அந்தச் சொல் உடலற்ற ஓர் அம்சத்தை மட்டும் கட்டாயமாகக் குறிக்காது; முழு நபரையும் அல்லது உயிரையும் குறிக்கலாம். முதன்மை உரை பாரம்பரிய உருவகத்தைப் பாதுகாக்க, அடிக்குறிப்பு அதன் உண்மையான பொருள் பரப்பைக் காட்டுகிறது.
translation_notes:
  register: இயல்பான, கண்ணியமான நவீனத் தமிழ் பயன்படுத்தப்பட்டுள்ளது. தேவனை நோக்கிய உரையில் மரியாதை ஒருமையான ‘உம்மிடத்தில்’ இடம்பெறுகிறது. சங்கீதத் தலைப்பின் சுருக்கமும் அதன் தொடர்பு சார்ந்த தெளிவின்மையும் காக்கப்பட்டுள்ளன.
