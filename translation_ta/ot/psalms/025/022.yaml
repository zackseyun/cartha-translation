revisions:
- from: தேவனே, இஸ்ரவேலை அவனுடைய எல்லா நெருக்கடிகளிலிருந்தும் மீட்டருளும்.[a]
  to: தேவனே, இஸ்ரவேலை அதன் எல்லா நெருக்கடிகளிலிருந்தும் மீட்டருளும்.[a]
  rationale: The revision resolves a misleading Tamil gender/person implication while retaining the Hebrew singular collective sense. The footnote continues to document the legitimate plural rendering for Israel understood explicitly as a people.
