  yaml_path: translation/ot/psalms/025/022.yaml
  text: Redeem Israel[a], O God, from all his troubles.
translation:
  language: ta
  text: தேவனே, இஸ்ரவேலை அதன் எல்லா நெருக்கடிகளிலிருந்தும் மீட்டருளும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுடைய எல்லா நெருக்கடிகளிலிருந்தும்”; ‘இஸ்ரவேல்’ என்பதை ஒரு கூட்டுமக்களாகக் கருதி பன்மையில் எடுத்துக்கொண்டால்.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּדֵה
  choice: மீட்டருளும்
  rationale: פדה என்பதன் கட்டளை வடிவம் மீட்பு, விலைகொடுத்து விடுவித்தல், அல்லது ஆபத்திலிருந்து விடுவித்தல் ஆகிய பொருள்களைத் தாங்குகிறது. ‘மீட்டருளும்’ என்பது இறைவனை நோக்கிய வேண்டுதலுக்குரிய மரியாதையையும் மீட்பின் இறையியல் நிறையையும் இயல்பான தமிழில் காக்கிறது.
- source_word: אֱלֹהִים
  choice: தேவனே
  rationale: இது நேரடி விளியாக இருப்பதால், தமிழ் விளிவேற்றுமையுடன் ‘தேவனே’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: יִשְׂרָאֵל
  choice: இஸ்ரவேல்
  rationale: இச்சூழலில் முற்பிதாவான யாக்கோபை மட்டும் அல்லாமல், உடன்படிக்கை மக்களை மொத்தமாகக் குறிக்கும் பெயராக உள்ளது.
- source_word: מִכֹּל
  choice: எல்லா ... இலிருந்தும்
  rationale: מִן உடன் כֹּל சேர்ந்து, நெருக்கடிகள் அனைத்திலிருந்தும் விடுவிக்கப்படுவதைத் தெரிவிக்கிறது; தமிழில் பிரிக்கப்பட்ட இந்த அமைப்பு இயல்பானது.
- source_word: צָרוֹתָיו
  choice: அவனுடைய எல்லா நெருக்கடிகளிலிருந்தும்
  rationale: צָרוֹת என்பது நெருக்கடிகள், துன்பங்கள், இடுக்கண்கள் ஆகிய பரந்த பொருளைக் கொண்டது. ‘நெருக்கடிகள்’ நவீனத் தமிழில் தெளிவாகவும் சங்கீதச் சூழலுக்கு ஏற்ற பரப்புடனும் உள்ளது. எபிரெய 3ஆம் நபர் ஆண்பால் ஒருமை பின்னொட்டு ‘அவனுடைய’ என்று பாதுகாக்கப்பட்டது.
theological_decisions:
- issue: இஸ்ரவேலைக் குறிக்கும் கூட்டொருமைச் சுட்டுப்பெயர்
  choice: ‘அவனுடைய நெருக்கடிகள்’ என்ற ஒருமை இலக்கண வடிவத்தைப் பாதுகாத்தல்
  alternative: ‘அவர்களுடைய நெருக்கடிகள்’ என்று இஸ்ரவேல் மக்களைப் பன்மையாக வெளிப்படுத்தல்
  rationale: எபிரெய உரையில் ‘நெருக்கடிகள்’ என்பதுடன் 3ஆம் நபர் ஆண்பால் ஒருமை பின்னொட்டு உள்ளது; ‘இஸ்ரவேல்’ ஒரு கூட்டுமக்களை ஒருமையாகக் குறிக்கிறது. ‘அவனுடைய’ என்பது மூல இலக்கணத்தைப் பாதுகாக்கிறது; ஆனால் தமிழில் அது இஸ்ரவேலை ஓர் தனிநபராகப் புரிந்துகொள்ளச் செய்யக்கூடும் என்பதால் பன்மை மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. இறைவனை நோக்கிய வேண்டுதலின் மரியாதையை ‘மீட்டருளும்’ காக்கிறது. மூலத்தின் கூட்டொருமைத் தன்மை முதன்மை உரையில் பாதுகாக்கப்பட்டு, இயல்பான பன்மை வாசிப்பு அடிக்குறிப்பில் வழங்கப்பட்டுள்ளது.
