source:
  edition: WLC
  text: דְּרָכֶ֣י/ךָ יְ֭הוָה הוֹדִיעֵ֑/נִי אֹ֖רְחוֹתֶ֣י/ךָ לַמְּדֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/004.yaml
  text: Make your ways known to me[a], O Yahweh; teach me your paths.
translation:
  language: ta
  text: யாவே, உமது வழிகளை எனக்கு அறிவியும்[a]; உமது பாதைகளை எனக்குக் கற்பியும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “என்னை அறியச் செய்யும்”; மரபாக, “எனக்குக் காண்பியும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּרָכֶיךָ
  choice: உமது வழிகளை
  rationale: דֶּרֶךְ என்பதன் அடிப்படை உருவகமான ‘வழி’ என்பதைக் காக்கிறது; இங்கு அது யாவேயின் செயல்முறை அல்லது அவர் காட்டும் வாழ்க்கைநெறி ஆகிய இரண்டையும் உள்ளடக்கக்கூடிய கவித்துவப் பொருளைக் கொண்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டப்பெயராக மாற்றாமல், தமிழில் இயல்பாக ஒலிபெயர்க்கிறது.
- source_word: הוֹדִיעֵנִי
  choice: எனக்கு அறிவியும்
  rationale: ידע என்பதன் ஹிஃபில் ஏவல் வடிவம் ‘என்னை அறியச் செய்யும்/எனக்கு அறியப்பண்ணும்’ என்ற காரணவினைப் பொருளைத் தருகிறது. ‘அறிவியும்’ அந்தப் பொருளை இயல்பான, செம்மையான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֹרְחוֹתֶיךָ
  choice: உமது பாதைகளை
  rationale: אֹרַח என்பதற்கு ‘பாதை, தடம்’ என்ற பொருள் உண்டு. ‘பாதைகள்’ என்பது முதல் அரையடியிலுள்ள ‘வழிகள்’ என்பதுடன் கவித்துவ இணைநிலையைப் பேணுவதோடு, இரு எபிரெயச் சொற்களையும் ஒரே தமிழ்ச் சொல்லாகத் தட்டையாக்காமல் காக்கிறது.
- source_word: לַמְּדֵנִי
  choice: எனக்குக் கற்பியும்
  rationale: למד என்பதன் பியேல் ஏவல் வடிவமும் முதலாம் நபர் ஒருமை பின்னொட்டும் நேரடியாக ‘எனக்குக் கற்பியும்’ எனப் பொருள்படுகின்றன.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூல வசனம் தெய்வீகத் தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. ஆகவே அதைப் பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்ப்பது உடன்படிக்கையின் தனிப்பெயரைப் பேணுகிறது.
- issue: ‘வழிகள்’ மற்றும் ‘பாதைகள்’ என்பவற்றின் பொருள்
  choice: உருவகங்களை விளக்கமாக விரிவாக்காமல் அப்படியே பேணுதல்
  alternative: உமது சித்தம் / உமது கட்டளைகள்
  rationale: மூலத்தின் கவித்துவ உருவகம் ஒழுக்கநெறி, தெய்வீக நடத்துமுறை, கடவுள் காட்டும் பாதை ஆகியவற்றைக் குறிக்கக்கூடும். அவற்றுள் ஒன்றை மட்டும் தேர்ந்து மொழிபெயர்ப்பது மூலத்தின் பொருள் விரிவைக் குறைக்கும்.
translation_notes:
  register: நவீன நிலையான தமிழில், ஜெபத்திற்கேற்ற கண்ணியமான நடையும் மரியாதை ஏவல் வடிவங்களும் பயன்படுத்தப்பட்டுள்ளன. ‘உமது’ என்பது தெய்வத்தை நோக்கிய ஒருமை மரியாதையைத் தெளிவாகக் காட்டுகிறது; ‘அறிவியும்/கற்பியும்’ என்ற இணை அமைப்பு எபிரெயக் கவித்துவ இணைநிலையைப் பேணுகிறது.
