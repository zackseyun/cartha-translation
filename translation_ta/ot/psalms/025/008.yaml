lexical_decisions:
- source_word: טוֹב
  choice: நல்லவர்
  rationale: இங்கு இந்தப் பெயரடை ஒழுக்கரீதியான நன்மையைக் குறிக்கிறது. யாவேயைக் குறிக்கும் ஆண்பால் மரியாதை ஒருமை வடிவம் இயல்பான தமிழுக்காகப் பயன்படுத்தப்பட்டது.
- source_word: וְיָשָׁר
  choice: நேர்மையானவர்
  rationale: יָשָׁר என்பதன் ஒழுக்க நேர்மையும் செம்மையும் இச்சொல்லால் இயல்பாக வெளிப்படுகின்றன; சொல்லுக்குச் சொல் ‘நேரானவர்’ என்பது இங்கு தமிழில் இயல்பாக இருக்காது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது பட்டப்பெயராக மாற்றப்படாமல், எபிரெய இறைப்பெயரின் தமிழில் பரவலாகப் புரிந்துகொள்ளத்தக்க ஒலிபெயர்ப்பாக வழங்கப்படுகிறது.
- source_word: עַל כֵּן
  choice: ஆகையால்
  rationale: யாவேயின் நன்மை மற்றும் நேர்மையிலிருந்து அடுத்த கூற்று விளைவாக வருவதைத் தெளிவாகவும் சுருக்கமாகவும் காட்டுகிறது.
- source_word: יוֹרֶה
  choice: கற்பிக்கிறார்
  rationale: Hiphil வடிவிலுள்ள ירה, கற்பித்தல், அறிவுறுத்தல் அல்லது வழிகாட்டுதல் ஆகிய பொருள்களைத் தரலாம். சூழலில் வழியை அறியச் செய்வது முதன்மையாக இருப்பதால் ‘கற்பிக்கிறார்’ தேர்ந்தெடுக்கப்பட்டது; வழிநடத்துதல் என்ற நிழற்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: חַטָּאִים
  choice: பாவிகளுக்கு
  rationale: பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்ட பன்மை வடிவத்தின் ஒழுக்க வகைப்பாட்டை மென்மைப்படுத்தாமல் நேரடியாக வழங்குகிறது.
- source_word: בַּדָּרֶךְ
  choice: வழியை
  rationale: எபிரெய மொழியில் முன்னிடைச்சொல்லுடன் வந்தாலும், தமிழில் ‘வழியைக் கற்பித்தல்’ என்பது இயல்பான அமைப்பு. ‘சரியான வழி’ என்று மூலத்தில் இல்லாத பெயரடையைச் சேர்க்காமல் வழி என்ற உருவகத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட இறைப்பெயர் இருப்பதால் அதை ஒரு பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்ப்பது உடன்படிக்கை சார்ந்த தனிப்பெயர் தன்மையைப் பாதுகாக்கிறது.
- issue: בַּדָּרֶךְ மற்றும் יוֹרֶה ஆகியவற்றின் இணைந்த பொருள்
  choice: பாவிகளுக்கு வழியைக் கற்பிக்கிறார்
  alternative: பாவிகளை வழியில் நடத்துகிறார்
  rationale: இந்த எபிரெய வினை கற்பித்தல் மற்றும் வழிகாட்டுதல் ஆகிய இரு கருத்துகளையும் தாங்கக்கூடும். முதன்மை உரை போதிக்கும் கருத்தை முன்வைக்கிறது; எந்த வழி என்று ‘சரியான’ அல்லது ‘அவருடைய’ போன்ற விளக்கங்களைச் சேர்க்கவில்லை. வழிநடத்தும் வாசிப்பு அடிக்குறிப்பில் வைக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், வழிபாட்டு மரியாதையுடன் இருந்தாலும் சாதாரண வாசகருக்குப் புரியும் நடையில் அமைக்கப்பட்டுள்ளது. முதல் அடியின் பெயரடை அமைப்பு இயல்பான தமிழ் வாக்கியமாக விரிக்கப்பட்டுள்ளது; இரண்டாம் அடியில் மூலத்தின் காரணவிளைவு உறவு மற்றும் ‘வழி’ உருவகம் பாதுகாக்கப்பட்டுள்ளன.
