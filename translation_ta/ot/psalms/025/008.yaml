  yaml_path: translation/ot/psalms/025/008.yaml
  text: Good and upright is Yahweh[a]; therefore he instructs sinners in the way.
translation:
  language: ta
  text: 'யாவே நல்லவரும் நேர்மையானவருமாய் இருக்கிறார்;

    ஆகையால் பாவிகளுக்கு வழியைக் கற்பிக்கிறார்.[a]'
  philosophy: optimal-equivalence
