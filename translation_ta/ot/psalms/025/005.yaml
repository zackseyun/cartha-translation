  text: Lead me in your truth and teach me[a], for you are the God of my salvation[b]; for you I wait all day long.
translation:
  language: ta
  text: உமது உண்மையில்[a] என்னை நடத்தி, எனக்குக் கற்பியும்; ஏனெனில் நீரே என் மீட்பின் கடவுள். நாள் முழுவதும் உம்மையே காத்திருக்கிறேன்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உமது உண்மைத்தன்மையில் என்னை நடத்தி.” எபிரெயச் சொல் ‘உண்மை’ அல்லது ‘உண்மைத்தன்மை’ என்று பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நாள் முழுவதும் உம்மையே நம்பிக்கையோடு எதிர்பார்க்கிறேன்.” எபிரெய வினை நம்பிக்கையுடன் காத்திருக்கும் பொருளையும் கொண்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדְרִיכֵנִי
  choice: என்னை நடத்தி
  rationale: דרך என்பதன் ஹிஃபில் கட்டளை வடிவம் ஒருவரை ஒரு வழியில் செலுத்துவதைக் குறிக்கிறது. ‘என்னை நடத்தி’ என்பது வழி என்ற உருவகத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: בַאֲמִתֶּךָ
  choice: உமது உண்மையில்
  rationale: אֱמֶת என்பது ‘உண்மை,’ ‘நம்பகத்தன்மை,’ அல்லது ‘உண்மைத்தன்மை’ எனப் பொருள்படலாம். நடத்துதல், கற்பித்தல் ஆகிய சூழலில் ‘உமது உண்மையில்’ என்பது வழிநடத்தலின் தளத்தையும் நெறியையும் வெளிப்படுத்துகிறது; மற்றொரு சாத்தியம் அடிக்குறிப்பில் காக்கப்பட்டுள்ளது.
- source_word: וְלַמְּדֵנִי
  choice: எனக்குக் கற்றுக்கொடுங்கள்
  rationale: למד என்பதன் பியேல் கட்டளை வடிவம் நேரடியாக ‘கற்பி’ என்று பொருள்படும். ‘எனக்குக் கற்றுக்கொடுங்கள்’ என்பது தெளிவான, இயல்பான நவீன தமிழ்.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: இந்த இணைப்புச்சொல் வேண்டுதலுக்கான காரணத்தை அறிமுகப்படுத்துகிறது. ‘ஏனெனில்’ அதன் விளக்கக் கூறைத் தெளிவாகக் காக்கிறது.
- source_word: אֱלֹהֵי יִשְׁעִי
  choice: என் மீட்பின் கடவுள்
  rationale: இந்த இணைநிலைப் பெயர்த்தொடர் கடவுளை மீட்பின் மூலமாகக் காட்டுகிறது. ‘என் மீட்பின் கடவுள்’ மூலமொழியின் பெயர்ச்சொல் அமைப்பையும் இறையியல் செறிவையும் காக்கிறது.
- source_word: קִוִּיתִי
  choice: காத்திருக்கிறேன்
  rationale: קוה என்பது நம்பிக்கையுடனும் எதிர்பார்ப்புடனும் காத்திருப்பதைக் குறிக்கிறது. ‘காத்திருக்கிறேன்’ காலநீடிப்பையும் சார்ந்திருக்கும் மனநிலையையும் காக்கிறது; எதிர்பார்ப்பு சார்ந்த மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: אוֹתְךָ
  choice: உமக்காக
  rationale: קוה என்பதுடன் வரும் இந்த நேரடி பொருள் குறியீடும் முன்னிலைப் பெயரும் ஒருவருக்காகக் காத்திருப்பதைக் குறிக்கின்றன. ‘உமக்காக’ என்பது தமிழில் இயல்பான தொடர்பைத் தருகிறது.
- source_word: כָּל הַיּוֹם
  choice: நாள் முழுவதும்
  rationale: இந்த மரபுத்தொடர் முழு நாளையும் குறிக்கிறது. ‘நாள் முழுவதும்’ அதன் நீடித்த கால உணர்வை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: இறைவழிநடத்தலுடன் தொடர்புடைய אֱמֶת என்பதன் பொருள்
  choice: ‘உண்மை’ என்று முதன்மை உரையில் மொழிபெயர்க்கப்பட்டது.
  alternative: ‘உண்மைத்தன்மை’ அல்லது ‘நம்பகத்தன்மை’
  rationale: வழிநடத்துதலும் கற்பித்தலும் இணையும் இச்சூழலில், சங்கீதக்காரர் நடத்தப்பட விரும்பும் நெறி அல்லது தளமாகக் கடவுளின் ‘உண்மை’ பொருந்துகிறது. ஆயினும், கடவுளின் உண்மைத்தன்மையால் நடத்தப்படுதல் என்ற பொருளும் எபிரெயில் சாத்தியமுள்ளதால் அது அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- issue: קוה என்பதிலுள்ள காத்திருத்தல் மற்றும் நம்பிக்கை என்ற இரட்டை நுணுக்கம்
  choice: முதன்மை உரையில் ‘காத்திருக்கிறேன்’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘நம்பிக்கையோடு எதிர்பார்க்கிறேன்’
  rationale: எபிரெய வினை காத்திருத்தலையும் நம்பிக்கையான எதிர்பார்ப்பையும் உள்ளடக்குகிறது. முதன்மை உரை காலம் சார்ந்த தெளிவான படிமத்தைக் காக்கிறது; அதன் எதிர்பார்ப்பு நுணுக்கத்தைத் தீர்த்துவிடாமல் அடிக்குறிப்பில் தருகிறது.
translation_notes:
  register: நவீனத் தரமான, எளிதில் புரியும், மரியாதைமிக்க தமிழ்நடை பயன்படுத்தப்பட்டுள்ளது. கடவுளை நேரடியாக அழைக்கும் இடத்தில் ‘நீர்/உமது/உமக்கு’ என்ற ஒருமை மரியாதை வடிவங்கள் ஒரே சீராகப் பயன்படுத்தப்பட்டுள்ளன. எபிரெயக் கவிதையின் வேண்டுதல், காரணம், நீடித்த காத்திருப்பு ஆகிய நகர்வுகள் சுருக்கமாகக் காக்கப்பட்டுள்ளன.
