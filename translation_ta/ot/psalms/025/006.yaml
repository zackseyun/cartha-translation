source:
  edition: WLC
  text: זְכֹר רַחֲמֶ֣י/ךָ יְ֭הוָה וַ/חֲסָדֶ֑י/ךָ כִּ֖י מֵ/עוֹלָ֣ם הֵֽמָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/006.yaml
  text: Remember your mercies[a], O Yahweh, and your steadfast love[c][b], for they are from of old.
translation:
  language: ta
  text: யாவே, உமது இரக்கத்தையும்[a] உமது மாறாத அன்பையும்[b] நினைவுகூரும்; ஏனெனில் அவை தொன்றுதொட்டு[c] உள்ளவை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உமது பரிவையும்.” எபிரெயச் சொல் பன்மை வடிவில் உள்ளது; “உமது இரக்கங்களையும்” என்றும் சொல்லலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் “மாறாத அன்பு” என்பது பன்மை வடிவில் உள்ளது; “உமது மாறாத அன்புச் செயல்களையும்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “நித்தியத்திலிருந்து.” எபிரெயச் சொற்றொடர் தொலைந்த பழங்காலத்தையோ நித்திய காலத்தையோ குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: זְכֹר
  choice: நினைவுகூரும்
  rationale: זכר என்பதன் Qal ஆண்பால் ஒருமை ஏவல் வடிவம்; கடவுளை நோக்கிய நேரடியான வேண்டுதலை மரியாதைமிக்க, இயல்பான தமிழ் ஏவல் வடிவில் தருகிறது.
- source_word: רַחֲמֶיךָ
  choice: உமது இரக்கம்
  rationale: רחמים எபிரெயத்தில் பன்மை வடிவில் இருந்து ஆழ்ந்த பரிவையும் மிகுந்த இரக்கத்தையும் குறிக்கிறது. தமிழில் ‘இரக்கம்’ என்ற ஒருமைத் தொகுப்புப்பொருள் இயல்பாக இருப்பதால் முதன்மை உரையில் அதைப் பயன்படுத்தி, பன்மை நுட்பத்தை அடிக்குறிப்பில் குறிப்பிட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் அதன் பெயரொலியை வெளிப்படுத்துகிறது.
- source_word: וַחֲסָדֶיךָ
  choice: உமது மாறாத அன்பு
  rationale: חסד என்பது நிலையான, உண்மையுள்ள அன்பைக் குறிக்கிறது. மூலத்தில் பன்மை இருந்தாலும், தமிழில் இயல்பான தொகுப்புப்பொருளாக ஒருமை பயன்படுத்தப்பட்டு, பன்மை வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய வேண்டுதலுக்கான காரணத்தை அறிமுகப்படுத்தும் இணைப்புச் சொல்.
- source_word: מֵעוֹלָם
  choice: தொன்றுதொட்டு
  rationale: தொலைந்த பழங்காலத்திலிருந்து தொடர்வதைக் குறிக்கும் இயல்பான தமிழ் சொல்; இச்சொற்றொடர் நித்தியத்தையும் குறிக்கக்கூடிய தெளிவின்மையை அடிக்குறிப்பு பாதுகாக்கிறது.
- source_word: הֵמָּה
  choice: அவை ... உள்ளவை
  rationale: முன்னுள்ள இரக்கத்தையும் மாறாத அன்பையும் சுட்டும் மூன்றாம் நபர் பன்மைப் பெயர்ச்சுட்டை தமிழில் வெளிப்படையாகக் காட்டுகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: யெகோவா; கர்த்தர்
  rationale: மூல உரை ஒரு பட்டத்தை அல்ல, தெய்வீகப் பெயரையே பயன்படுத்துகிறது. ஆகவே பெயரைத் தமிழில் ஒலிபெயர்த்து, பட்டத்தால் மாற்றவில்லை.
- issue: מֵעוֹלָם என்பதன் காலப் பொருள்
  choice: தொன்றுதொட்டு
  alternative: நித்தியத்திலிருந்து; என்றென்றுமிருந்து
  rationale: இந்த எபிரெயச் சொல் தொலைந்த பழங்காலத்தையோ முடிவற்ற காலத்தையோ குறிக்கலாம். சூழலில் கடவுளின் நீண்டகால இரக்க இயல்பை வேண்டுதலுக்கு ஆதாரமாகக் கூறுவதால் ‘தொன்றுதொட்டு’ முதன்மையாகத் தேர்ந்தெடுக்கப்பட்டது; வலுவான நித்தியப் பொருள் அடிக்குறிப்பில் வைக்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சங்கீத வேண்டுதலுக்கேற்ற மரியாதையும் கண்ணியமும் கொண்ட நடை. ‘உமது’ மற்றும் ‘நினைவுகூரும்’ ஆகியவை கடவுளை நோக்கிய உயர்நிலை மரியாதையைத் தக்கவைக்கின்றன; எபிரெயப் பன்மைகள் தமிழில் செயற்கையாக ஒலிக்காமல் அடிக்குறிப்புகளில் வெளிப்படுத்தப்பட்டுள்ளன.
