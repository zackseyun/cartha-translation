  text: תֹּם וָ/יֹ֥שֶׁר יִצְּר֑וּ/נִי כִּ֝֗י קִוִּיתִֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/021.yaml
  text: Integrity and uprightness may preserve me[b][a], for I wait for you.
translation:
  language: ta
  text: உத்தமமும் நேர்மையும் என்னைக் காக்கட்டும்[a]; ஏனெனில் நான் உம்மை எதிர்நோக்கிக் காத்திருக்கிறேன்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உத்தமமும் நேர்மையும் என்னைக் காக்கும்.’ இங்குள்ள எபிரெய வினைச்சொல், இச்சூழலில் நம்பிக்கையான எதிர்பார்ப்பையோ விருப்பம் அல்லது வேண்டுதலையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘நான் உம்மில் நம்பிக்கை வைத்திருக்கிறேன்.’ எபிரெய வினைச்சொல் நம்பிக்கையோடு காத்திருக்கும் கருத்தையும் உள்ளடக்குகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֹּם
  choice: உத்தமம்
  rationale: இச்சொல் ஒழுக்கப் பூரணத்தன்மை, குற்றமற்ற நிலை, நேரிய குணம் ஆகிய கருத்துகளைக் குறிக்கிறது. ‘உத்தமம்’ பாவமற்ற முழுநிறைவை மிகைப்படுத்தாமல், ஒருவரின் முழுமையான ஒழுக்கநிலையைச் சுருக்கமாகத் தெரிவிக்கிறது.
- source_word: וָיֹשֶׁר
  choice: நேர்மை
  rationale: יֹשֶׁר என்பதன் அடிப்படைக் கருத்து ‘நேராக இருப்பது’; இங்கு அது ஒழுக்கநெறியில் நேர்மையைக் குறிக்கிறது. ‘உத்தமம்’ என்பதுடன் இயல்பான கவிதை இணையாக அமைகிறது.
- source_word: יִצְּרוּנִי
  choice: என்னைக் காக்கட்டும்
  rationale: נצר என்பது காத்தல், பாதுகாத்தல், பேணுதல் எனப் பொருள்படும். இங்குள்ள yiqtol வடிவம் வேண்டுதலாகவும் நம்பிக்கையுள்ள எதிர்பார்ப்பாகவும் புரிந்துகொள்ளப்படலாம்; சங்கீதத்தின் மன்றாட்டுத் தொனிக்கேற்ப ‘காக்கட்டும்’ முதன்மை உரையாகத் தேர்ந்தெடுக்கப்பட்டது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்திய வேண்டுதலுக்கான காரணத்தை அறிமுகப்படுத்துகிறது; தமிழில் அந்தத் தொடர்பைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: קִוִּיתִיךָ
  choice: நான் உமக்காகக் காத்திருக்கிறேன்
  rationale: קוה நம்பிக்கையோடும் எதிர்பார்ப்போடும் காத்திருப்பதைக் குறிக்கிறது. ‘உமக்காகக் காத்திருக்கிறேன்’ என்பது காத்திருக்கும் செயலை நேரடியாகப் பாதுகாக்கிறது; அதிலுள்ள நம்பிக்கையின் நுண்பொருள் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
theological_decisions:
- issue: சங்கீதக்காரனின் ஒழுக்கப் பண்புகள் தன்னால் ஈட்டிய தகுதியாகக் கூறப்படுகின்றனவா, அல்லது அவை பாதுகாப்பை வேண்டுவதில் இடம்பெறும் பண்புகளா?
  choice: உத்தமமும் நேர்மையும் தன்னைக் காக்கட்டும் என்ற வேண்டுதலாக உரை வழங்கப்படுகிறது; சுயநீதியால் தகுதி பெற்றதாக எந்த விளக்கமும் சேர்க்கப்படவில்லை.
  alternative: சங்கீதக்காரன் தன் நீதியையே விடுதலைக்கான தகுதியாக முன்வைக்கிறான் என்று வலுவாகப் புரிந்துகொள்ளுதல்.
  rationale: எபிரெய உரை இந்த ஒழுக்கப் பண்புகளையே இலக்கணரீதியாகக் காக்கும் எழுவாய்களாகக் குறிப்பிடுவதோடு, தேவனுக்காகக் காத்திருப்பதையும் காரணமாக இணைக்கிறது. மொழிபெயர்ப்பு அந்த இறையியல் இழுபறியை விளக்கிச் சமப்படுத்தாமல் அப்படியே பாதுகாக்கிறது.
- issue: יִצְּרוּנִי என்பது வேண்டுதலா அல்லது உறுதியான எதிர்பார்ப்பா?
  choice: ‘காக்கட்டும்’ என்ற வேண்டுதல் வடிவம்.
  alternative: ‘என்னைக் காக்கும்’ என்ற நம்பிக்கையான எதிர்பார்ப்பு.
  rationale: yiqtol வடிவம் இச்சூழலில் இரண்டையும் அனுமதிக்கிறது. சங்கீதத்தின் மன்றாட்டுத் தொனி வேண்டுதல் வடிவத்தை ஆதரிக்கிறது; மாற்றுப் புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. தேவனை நோக்கிய ஒருமை மரியாதை வடிவமாக ‘உமக்காக’ அமைக்கப்பட்டுள்ளது. எபிரெயக் கவிதையின் இணைச்சொல் அமைப்பும், வேண்டுதல் மற்றும் எதிர்பார்ப்பு இடையிலான உண்மையான இருபொருள் வாய்ப்பும் பாதுகாக்கப்பட்டுள்ளன.
