lexical_decisions:
- source_word: כָּל אָרְחוֹת
  choice: பாதைகள் அனைத்தும்
  rationale: ‘பாதைகள்’ என்பது மூலத்தின் உருவகத்தைப் பாதுகாக்கிறது; ‘அனைத்தும்’ முழுமையைக் குறிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருப்பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டமாக மாற்றாமல், அதன் பரவலாக ஏற்கப்பட்ட தமிழாக்க ஒலிபெயர்ப்பால் தருகிறது.
- source_word: חֶסֶד
  choice: மாறாத அன்பு
  rationale: உடன்படிக்கைச் சூழலில் காணப்படும் நிலையான, பற்றுறுதியுள்ள அருளன்பை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֱמֶת
  choice: உண்மைத்தன்மை
  rationale: חֶסֶד என்பதுடன் இணையும் இச்சூழலில் வெறும் கருத்தியல் ‘உண்மை’ என்பதைக் காட்டிலும் நம்பத்தகுந்த பற்றுறுதியைச் சுட்டுகிறது; ‘உண்மை’ என்ற பொருளும் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: לְנֹצְרֵי
  choice: கைக்கொள்கிறவர்களுக்கு
  rationale: נצר என்பதிலுள்ள கவனமாகக் காத்து அனுசரிக்கும் பொருளை இயல்பான தமிழில் தருகிறது; ‘-க்கு’ வேற்றுமை உருபு எபிரேய לְ என்பதன் ‘அவர்களுக்கு/அவர்களைப் பொறுத்தவரை’ என்ற உறவை மிகையாகத் தீர்மானிக்காமல் காட்டுகிறது.
- source_word: בְרִיתוֹ
  choice: அவருடைய உடன்படிக்கையை
  rationale: வேதாகம உடன்படிக்கைச் சூழலுக்குரிய நிலையான, நேரடியான சொல்.
- source_word: וְעֵדֹתָיו
  choice: அவருடைய சாட்சிகளை
  rationale: தெய்வீக சாட்சியங்களாகவும் கடைப்பிடிக்க வேண்டிய விதிகளாகவும் வரும் עֵדוֹת என்ற சொல்லின் வடிவத்தையும் வேதாகமச் சொற்பயன்பாட்டையும் பாதுகாக்கிறது.
theological_decisions:
- issue: யாவேவின் எல்லாப் பாதைகளுக்கும் ‘மாறாத அன்பும் உண்மைத்தன்மையும்’ என்பதற்கும் உள்ள பயனிலை உறவு
  choice: யாவேவின் பாதைகள் மாறாத அன்பும் உண்மைத்தன்மையுமாக இருக்கின்றன என்று மொழிபெயர்க்கப்பட்டது.
  alternative: அவருடைய பாதைகள் மாறாத அன்புக்கும் உண்மைத்தன்மைக்கும் வழிநடத்துகின்றன; அல்லது அவை பொதுவாக இரக்கமும் உண்மையும் கொண்டவை.
  rationale: வினைச்சொல் இல்லாத எபிரேய வாக்கியம் חֶסֶד וֶאֱמֶת என்பதை யாவேவின் பாதைகளின் பண்பாக இயல்பாகக் கூறுகிறது. தொடர்ந்து வரும் சொற்றொடர் உடன்படிக்கையையும் சாட்சிகளையும் கைக்கொள்கிறவர்களோடு அதன் உறவைச் சுட்டுகிறது; அதற்கு அப்பாற்பட்ட கோட்பாட்டு முடிவை மொழிபெயர்ப்பில் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதாகப் புரியக்கூடிய, அதேவேளையில் சங்கீதத்திற்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பாதைகள்’ என்ற உருவகமும், ‘யாவே’ என்ற திருப்பெயரும், ‘சாட்சிகள்’ என்ற மூலத்துக்கு நெருக்கமான வேதாகமச் சொல்லும் பாதுகாக்கப்பட்டுள்ளன.
