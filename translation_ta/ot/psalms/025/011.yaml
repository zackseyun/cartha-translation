source:
  edition: WLC
  text: לְמַֽעַן שִׁמְ/ךָ֥ יְהוָ֑ה וְֽ/סָלַחְתָּ֥ לַ֝/עֲוֺנִ֗/י כִּ֣י רַב הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/011.yaml
  text: For the sake of your name[a], O Yahweh, forgive my iniquity[b], for it is great.
translation:
  language: ta
  text: யாவே, உமது பெயரின் பொருட்டு[a] என் அக்கிரமத்தை[b] மன்னித்தருளும்; ஏனெனில் அது பெரிது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உமது பெயரின் பொருட்டு’ என்பது வெறும் பெயரொலியை மட்டும் குறிக்காமல், யாவேயின் குணம், புகழ், உடன்படிக்கை மாண்பு ஆகியவற்றை முன்னிட்டு விடுக்கப்படும் வேண்டுகோள்.
    reason: cultural_note
  - marker: b
    text: ‘அக்கிரமம்’ என்பதற்கான எபிரெயச் சொல் עָוֹן; அது தவறான செயல், குற்றப்பழி, அல்லது குற்றப்பழியின் சுமை/விளைவு ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן שִׁמְךָ
  choice: உமது பெயரின் பொருட்டு
  rationale: לְמַעַן என்பது வேண்டுதலுக்கான அடிப்படை அல்லது நோக்கத்தைச் சுட்டுகிறது. שֵׁם என்பதன் நேரடிப் பொருளான ‘பெயர்’ பாதுகாக்கப்படுகிறது; இங்கு அது இறைவனின் குணம், புகழ், உடன்படிக்கை மாண்பு ஆகியவற்றையும் உள்ளடக்குகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் வரும் இறைத் திருப்பெயரான יהוה, ஒரு பட்டப்பெயராக மாற்றப்படாமல் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְסָלַחְתָּ
  choice: மன்னித்தருளும்
  rationale: வடிவத்தில் வாவுடன் கூடிய நிறைவுவினையாக இருந்தாலும், இச்செபச் சூழலில் இது வேண்டுகோளாகச் செயல்படுகிறது. ‘மன்னித்தருளும்’ என்பது தமிழில் இயல்பான, மரியாதைமிக்க வேண்டுதல்.
- source_word: לַעֲוֺנִי
  choice: என் அக்கிரமத்தை
  rationale: עָוֹן என்பது தவறான செயல், அதனால் உண்டாகும் குற்றப்பழி, அல்லது அதன் சுமை/விளைவு ஆகியவற்றைக் குறிக்கலாம். ‘அக்கிரமம்’ அதன் அறநெறிசார் கனத்தைப் பாதுகாக்கிறது.
- source_word: כִּי רַב הוּא
  choice: ஏனெனில் அது பெரிது
  rationale: כִּי காரணத்தை அறிமுகப்படுத்துகிறது. ஒருமைச் சொல்லை மீண்டும் சுட்டும் הוּא உடன் வரும் רַב, எண்ணிக்கையை அல்லாமல் அக்கிரமத்தின் மிகுதியையும் தீவிரத்தையும் குறிக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைத் திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் பொதுவான பட்டப்பெயர் அல்ல, தனிப்பட்ட இறைத் திருப்பெயர் நேரடியாக வருகிறது; எனவே அதை ‘ஆண்டவர்’ என்று மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: עָוֹן என்பதன் பொருள் வரம்பு
  choice: அக்கிரமம்
  alternative: குற்றம் / பாவம் / குற்றப்பழி
  rationale: இந்தச் சொல் தவறான செயலையும் அதனால் வரும் குற்றப்பழி அல்லது சுமையையும் குறிக்கக்கூடும். முதன்மை உரையில் ‘அக்கிரமம்’ அறநெறிசார் கனத்தைத் தக்கவைக்கிறது; மற்ற சாத்தியங்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- issue: அக்கிரமம் ‘பெரிது’ என்பதே மன்னிப்புக்கான காரணமாக அமைதல்
  choice: ஏனெனில் அது பெரிது
  alternative: அது பெரிதாயிருந்தாலும்
  rationale: כִּי என்பதன் இயல்பான காரணப் பொருள் பாதுகாக்கப்படுகிறது. வேண்டுதலின் இறையியல் பதற்றத்தைத் தணிக்க ‘இருந்தாலும்’ என மாற்றுவது மூலத்தில் வெளிப்படையாக இல்லாத விளக்கத்தைச் சேர்க்கும்.
translation_notes:
  register: நவீனத் தரமான தமிழில், செபத்திற்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘உமது’, ‘மன்னித்தருளும்’ ஆகிய வடிவங்கள் மரியாதையைக் காக்கின்றன; தேவையற்ற பழந்தமிழ் அல்லது சமயக்குழு சார்ந்த சொற்கள் தவிர்க்கப்பட்டுள்ளன. ஆங்கில ஆலோசனை உரையில் அடிக்குறிப்பு குறியீடுகளின் உள்ளடக்கம் இடமாற்றமாக இருந்ததால், தமிழில் பெயருக்கான விளக்கம் [a] என்றும் அக்கிரமத்துக்கான சொற்பொருள் விளக்கம் [b] என்றும் உரையுடன் சரியாகப் பொருத்தப்பட்டுள்ளது.
