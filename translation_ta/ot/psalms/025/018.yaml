source:
  edition: WLC
  text: רְאֵ֣ה עָ֭נְיִ/י וַ/עֲמָלִ֑/י וְ֝/שָׂ֗א לְ/כָל חַטֹּאותָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/018.yaml
  text: Look on my affliction and my trouble[a], and forgive all my sins.
translation:
  language: ta
  text: என் துன்பத்தையும் என் துயரத்தையும் நோக்கியருளும்; என் பாவங்கள் அனைத்தையும் மன்னித்தருளும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்கு நெருக்கமாக, “என் பாவங்கள் அனைத்தையும் தூக்கி அகற்றும்.” எபிரெய வினைச்சொல் “தூக்குதல்,” “சுமந்து செல்லுதல்,” அல்லது “அகற்றுதல்” என்று பொருள்படலாம்; இங்கே அது பாவங்களை மன்னிப்பதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה
  choice: நோக்கி
  rationale: தேவனிடம் உதவியும் அக்கறையும் வேண்டி கூறப்படும் கட்டளை வடிவத்தின் விண்ணப்பத் தன்மையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: עָנְיִי
  choice: என் துன்பத்தையும்
  rationale: இச்சொல் துயரம், சிறுமை, இடுக்கண் ஆகிய பரந்த பொருள்களைக் கொண்டது; பொருளாதார வறுமை என்று குறுக்காமல் சங்கீதப் புலம்பலின் சூழலை ‘துன்பம்’ இயல்பாகத் தருகிறது.
- source_word: וַעֲמָלִי
  choice: என் வேதனையையும்
  rationale: עָמָל என்பது கடின உழைப்பு, தொல்லை, துயரமிக்க சுமை ஆகியவற்றைக் குறிக்கலாம்; இணைச்சொல்லான ‘துன்பம்’ என்பதுடன் சேர்ந்து அனுபவிக்கும் வலியை ‘வேதனை’ தெளிவாகக் காட்டுகிறது.
- source_word: וְשָׂא
  choice: மன்னித்தருளும்
  rationale: נשׂא என்பதன் அடிப்படைப் பொருள் ‘தூக்கு/சுமந்து அகற்று’; பாவங்களைச் செயப்படுபொருளாகக் கொண்ட இவ்விடத்தில் அது பாவத்தை நீக்கி மன்னிப்பதைக் குறிக்கும் எபிரெய மரபுத்தொடர். ‘மன்னித்தருளும்’ என்பது வேண்டுதல் சூழலுக்கு ஏற்ற மரியாதையான தமிழ்.
- source_word: לְכָל
  choice: அனைத்தையும்
  rationale: נשׂא உடனான கட்டமைப்பில் ‘என் பாவங்கள் அனைத்தையும்’ என்ற முழுமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: חַטֹּאותָי
  choice: என் பாவங்கள்
  rationale: ஒழுக்க மற்றும் இறையியல் பொருளிலுள்ள חטאת என்பதன் பன்மையைத் தெளிவாகவும் வழக்கமாகவும் தருகிறது.
theological_decisions:
- issue: பாவங்களைச் செயப்படுபொருளாகக் கொண்ட נשׂא என்ற மரபுத்தொடர்
  choice: ‘என் பாவங்கள் அனைத்தையும் மன்னித்தருளும்’ என்று மன்னிப்புக்கான வேண்டுதலாக மொழிபெயர்த்தல்
  alternative: ‘என் பாவங்கள் அனைத்தையும் தூக்கி அகற்றும்’
  rationale: எபிரெய உருவகம் பாவத்தைச் சுமந்து அல்லது தூக்கி அகற்றுவதைச் சொன்னாலும், அதன் சூழல்சார் பொருள் தெய்வீக மன்னிப்பு. முதன்மை உரையில் தெளிவான தமிழை வழங்கி, அடிப்படை உருவகத்தை அடிக்குறிப்பில் பாதுகாக்கிறது; கூடுதல் கோட்பாட்டுப் பொருளைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான வேண்டுதல் நடை. ‘மன்னித்தருளும்’ இறைவனை நோக்கிய விண்ணப்பத்தின் மரியாதைத் தொனியை இயல்பாகக் காக்கிறது. ‘துன்பம்/வேதனை’ என்ற இணைச்சொற்கள் எபிரெயச் சமநிலையைத் தக்கவைத்தபடி தேவையற்ற பொருளாதாரக் குறுக்கலைத் தவிர்க்கின்றன.
