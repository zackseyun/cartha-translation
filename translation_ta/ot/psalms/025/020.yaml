review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately represents all principal Hebrew elements: שָׁמְרָה as a plea for protection, נַפְשִׁי as the psalmist''s life, וְהַצִּילֵנִי as rescue, אַל־אֵבוֹשׁ as avoidance of shame, and חָסִיתִי בָךְ as having taken refuge in God. The proposed revision preserves these correspondences and the causal relation marked by כִּי.'
  naturalness: ‘என்னை விடுவியும்’ is not the most idiomatic modern-standard Tamil form in this reverential petition. ‘என்னை மீட்டருளும்’ is natural, dignified, and directly conveys rescue from danger. Parallel honorific imperatives also improve the flow.
  terminology: ‘உயிர்’ appropriately avoids importing a body–soul distinction into נֶפֶשׁ. ‘வெட்கமடைய’ retains the Hebrew’s broad shame/disgrace sense without over-specifying its cause. ‘அடைக்கலம் புகுந்திருக்கிறேன்’ naturally expresses the completed act with continuing relevance implied by חָסִיתִי.
  issues:
  - severity: low
    issue: The imperative ‘என்னை விடுவியும்’ is stylistically awkward in modern standard Tamil.
    rationale: Replacing it with ‘என்னை மீட்டருளும்’ supplies an idiomatic respectful imperative while retaining the meaning of הַצִּילֵנִי, ‘rescue me.’
  revised_text: என் உயிரைக் காத்தருளும்; என்னை மீட்டருளும்; நான் வெட்கமடைய விடாதேயும்; ஏனெனில், உம்மிடம் அடைக்கலம் புகுந்திருக்கிறேன்.
