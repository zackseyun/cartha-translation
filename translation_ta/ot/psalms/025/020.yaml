source:
  edition: WLC
  text: שָׁמְרָ֣/ה נַ֭פְשִׁ/י וְ/הַצִּילֵ֑/נִי אַל אֵ֝ב֗וֹשׁ כִּֽי חָסִ֥יתִי בָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/020.yaml
  text: Guard my life and rescue me; let me not be put to shame, for I take refuge in you.
translation:
  language: ta
  text: என் உயிரைக் காத்தருளும்; என்னை மீட்டருளும்; நான் வெட்கமடைய விடாதேயும்; ஏனெனில், உம்மிடம் அடைக்கலம் புகுந்திருக்கிறேன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נַפְשִׁי
  choice: என் உயிரை
  rationale: இங்கு נֶפֶשׁ என்பது மனிதரின் முழு உயிர் அல்லது வாழ்வைக் குறிக்கிறது; நவீன தமிழில் ‘ஆத்துமா’ என மொழிபெயர்ப்பது உடல்–ஆத்துமா பிரிவை தேவையின்றி முன்வைக்கக்கூடும்.
- source_word: שָׁמְרָה
  choice: காத்து
  rationale: வேண்டுதல் வடிவிலுள்ள ‘பாதுகாத்தருளும்’ என்ற பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: וְהַצִּילֵנִי
  choice: என்னை விடுவியும்
  rationale: ஆபத்திலிருந்து மீட்டல் அல்லது தப்புவித்தல் என்ற הציל வினையின் பரந்த பொருளைத் தக்கவைக்கிறது.
- source_word: אַל־אֵבוֹשׁ
  choice: நான் வெட்கமடைய விடாதேயும்
  rationale: בוש இங்கு எதிரிகள்முன் அவமானம் அல்லது ஏமாற்றம் அடைதலைக் குறிக்கலாம்; அதனைத் தீர்மானமாகச் சுருக்காமல் ‘வெட்கமடைய’ என வைத்திருக்கிறது.
- source_word: חָסִיתִי בָךְ
  choice: உம்மிடம் அடைக்கலம் புகுந்திருக்கிறேன்
  rationale: חסה என்பது பாதுகாப்புக்காக ஒருவரிடம் அடைக்கலம் தேடுவதைச் சுட்டுகிறது; எபிரெய நிறைவு வடிவின் நிகழ்காலத் தொடர்விளைவை ‘புகுந்திருக்கிறேன்’ வெளிப்படுத்துகிறது.
theological_decisions:
- issue: נֶפֶשׁ என்பதன் மனித இயல்பு சார்ந்த பொருள்
  choice: என் உயிரை
  alternative: என் ஆத்துமாவை
  rationale: சூழலில் சங்கீதக்காரர் தனது உயிரும் வாழ்வும் பாதுகாக்கப்பட வேண்டுமென வேண்டுகிறார்; தனித்த உடலற்ற கூறு குறித்த கோட்பாட்டை வசனத்தில் இறக்குமதி செய்யாமல் உள்ளது.
- issue: ‘வெட்கம்’ என்பதன் பரப்பு
  choice: வெட்கமடைய விடாதேயும்
  alternative: அவமானப்பட விடாதேயும்
  rationale: மூலச்சொல்லின் வெட்கம், அவமானம், நம்பிக்கை பொய்த்தல் ஆகிய சாத்தியங்களை ஓரளவு திறந்தவாறே வைத்திருக்கிறது.
translation_notes:
  register: நவீன நிலையான, கண்ணியமான தமிழ். கடவுளை நோக்கிய வேண்டுதலுக்கேற்ற மரியாதைப் பன்மை வினைமுற்றுகள் பயன்படுத்தப்பட்டுள்ளன; தேவையற்ற சமயத் தொழில்நுட்பச் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
