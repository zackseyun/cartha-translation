lexical_decisions:
- source_word: יַדְרֵךְ
  choice: வழிநடத்துகிறார்
  rationale: דרך என்பதன் ஹிஃபில் வடிவம் ஒருவரை ஒரு வழியில் நடத்துதல் அல்லது வழிகாட்டுதல் என்று பொருள்படும்; ‘வழிநடத்துகிறார்’ என்பது காரணவினை நுணுக்கத்தையும் இயல்பான தமிழையும் காக்கிறது.
- source_word: עֲנָוִים
  choice: தாழ்மையுள்ளவர்கள்
  rationale: இந்தச் சொல் தாழ்மையானவர்கள், சாந்தமானவர்கள், தாழ்நிலையில் அல்லது துன்பத்தில் உள்ளவர்கள் ஆகியோரைக் குறிக்கலாம். சங்கீதத்தின் போதனை பெறும் சூழலில் ‘தாழ்மையுள்ளவர்கள்’ பொருத்தமானது; மூலத்திலுள்ள மறுபயன்பாடும் வலியுறுத்தலுக்காகப் பாதுகாக்கப்பட்டது.
- source_word: בַּמִּשְׁפָּט
  choice: நீதியில்
  rationale: מִשְׁפָּט என்பது நீதி, நியாயத்தீர்ப்பு, சரியானது ஆகிய பொருள்களைக் கொள்ளலாம். இங்கு கடவுளின் வழிநடத்தலின் தரம் அல்லது தளம் என்பதைக் காட்ட ‘நீதியில்’ என நேரடியாக மொழிபெயர்க்கப்பட்டது.
- source_word: וִילַמֵּד
  choice: கற்பிக்கிறார்
  rationale: למד என்பதன் பியேல் வடிவம் கற்பித்தல் அல்லது போதித்தல் என்று பொருள்படும்; பொதுவான நவீன தமிழில் ‘கற்பிக்கிறார்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: דַּרְכּוֹ
  choice: தமது வழி
  rationale: இது மூன்றாம் நபர் ஆண்பால் ஒருமை உடைமைப் பின்னொட்டுடன் உள்ள ஒருமைச் சொல். கடவுளைக் குறிக்கும் மரியாதைத் தமிழில் ‘தமது வழி’ என்பது இயல்பாகவும் மூலத்தின் ஒருமையைப் பாதுகாப்பதாகவும் உள்ளது.
theological_decisions:
- issue: עֲנָוִים என்பதன் சமூக மற்றும் ஆன்மிக நுணுக்கம்
  choice: தாழ்மையுள்ளவர்கள்
  alternative: சாந்தமானவர்கள்; தாழ்நிலையில் உள்ளவர்கள்; துன்புறுகிறவர்கள்
  rationale: சூழல் கடவுளிடமிருந்து வழிகாட்டுதலும் போதனையும் பெறும் பணிவான மனநிலையை முன்னிறுத்துகிறது. எனினும் எபிரெயச் சொல் சமூகத் தாழ்நிலை அல்லது துன்பத்தையும் குறிக்கக்கூடும் என்பதால் அந்த விரிவை அடிக்குறிப்பில் பாதுகாத்துள்ளோம்.
- issue: בַּמִּשְׁפָּט என்பதில் வழிநடத்தலின் தளம் அல்லது அளவுகோல்
  choice: நீதியில்
  alternative: நியாயத்தீர்ப்பில்; சரியானதில்
  rationale: முன்னிடைச்சொல் வழிநடத்தல் நடைபெறும் தளம், முறை அல்லது தரத்தைச் சுட்டலாம். ‘நீதியில்’ இந்தத் திறந்த நுணுக்கத்தை முழுமையாகத் தீர்மானிக்காமல் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டது. எபிரெய இணைநிலைக் கட்டமைப்பும் ‘தாழ்மையுள்ளவர்கள்’ என்ற மறுபயன்பாடும் பாதுகாக்கப்பட்டன. மரியாதை ஒருமைக்காக ‘அவர்/தமது’ பயன்படுத்தப்பட்டது.
