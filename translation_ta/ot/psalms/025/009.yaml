  language: ta
  text: அவர் தாழ்மையுள்ளவர்களை[b] நீதியின்படி[a] வழிநடத்துகிறார்; தாழ்மையுள்ளவர்களுக்குத் தமது வழியைக் கற்பிக்கிறார்.
