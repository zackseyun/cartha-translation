    text: அல்லது, “நியாயத்தீர்ப்பில்” அல்லது “எது சரியானதோ அதில்.”
    reason: lexical_alternative
  - marker: b
    text: “தாழ்மையுள்ளவர்கள்” என்பதற்கான எபிரெயச் சொல் சூழலுக்கேற்ப “சாந்தமானவர்கள்,” “தாழ்நிலையில் உள்ளவர்கள்,” அல்லது “துன்புறுகிறவர்கள்” என்றும் பொருள்படலாம்.
