  yaml_path: translation/ot/psalms/025/013.yaml
  text: His soul will dwell in goodness[b][a], and his offspring will inherit the land.
translation:
  language: ta
  text: அவன் நல்வாழ்வில் நிலைத்திருப்பான்[b]; அவனுடைய சந்ததி நாட்டை[a] சுதந்தரித்துக்கொள்ளும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பூமியை.” எபிரெயச் சொல் ‘நாடு’ அல்லது ‘பூமி’ எனப் பொருள்படலாம்; இங்கு உடன்படிக்கை சார்ந்த நாட்டைச் சுதந்தரித்துக்கொள்ளும் கருத்து பொருத்தமாகத் தெரிகிறது.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “தங்குவான்” அல்லது “இரவைக் கழிப்பான்.” எபிரெய வினைச்சொல் ஓரிடத்தில் இரவு தங்கும் படிமத்தைக் கொண்டது; இங்கு நல்வாழ்வில் தொடர்ந்திருக்கும் நிலையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַפְשׁוֹ
  choice: அவன்
  rationale: נֶפֶשׁ இங்கு முழு மனிதரைக் குறிக்கும் எபிரெய வழக்காகப் புரிந்துகொள்ளப்படுகிறது. ‘அவனுடைய ஆத்துமா’ என்ற சொற்சொல் மொழிபெயர்ப்பு நவீன தமிழில் உடல்–ஆத்துமா பிரிவைத் தேவையின்றி வலியுறுத்தக்கூடும்; ‘அவன்’ என்பது பொருளை இயல்பாகத் தருகிறது.
- source_word: בְּטוֹב
  choice: நலத்தில்
  rationale: טוֹב இங்கு நன்மை, நல்வாழ்வு, செழிப்பு ஆகியவற்றை உள்ளடக்கும் நல்ல நிலையைக் குறிக்கிறது. ‘நலத்தில்’ என்பது பொருளாதாரச் செழிப்பாக மட்டும் சுருக்காமல் இந்த விரிவைத் தக்கவைக்கிறது.
- source_word: תָלִין
  choice: தங்கியிருப்பான்
  rationale: לון என்பதன் அடிப்படைப் படிமம் இரவு தங்குவது அல்லது தங்குவது. இங்கு தொடர்ந்திருக்கும் நிலையை இயல்பான தமிழில் ‘தங்கியிருப்பான்’ என வழங்கப்பட்டுள்ளது; அடிப்படைப் படிமம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְזַרְעוֹ
  choice: அவனுடைய சந்ததி
  rationale: זֶרַע என்பதன் நேர்ப்பொருள் ‘விதை’; இங்கு அது ஒருவரின் பிள்ளைகள் அல்லது வழிவருவோரைச் சுட்டுவதால் ‘சந்ததி’ சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: יִירַשׁ
  choice: உரிமையாகப் பெறும்
  rationale: ירשׁ என்பது உரிமை பெறுதல் அல்லது உடைமையாக்குதல் எனப் பொருள்படும். ‘உரிமையாகப் பெறும்’ என்பது பரம்பரை மற்றும் உடைமை ஆகிய இரு நுணுக்கங்களையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: אָרֶץ
  choice: நாட்டை
  rationale: אֶרֶץ என்பது ‘நாடு’ அல்லது ‘பூமி’ எனப் பொருள்படலாம். ירשׁ உடன் வரும் இச்சூழலில் உடன்படிக்கை சார்ந்த நாட்டைப் பெறுதல் என்ற எதிரொலி காரணமாக ‘நாட்டை’ முதன்மை வாசகமாகத் தேர்ந்தெடுக்கப்பட்டுள்ளது.
theological_decisions:
- issue: יִירַשׁ אָרֶץ என்பதில் אָרֶץ என்பதன் பரப்பு
  choice: நாட்டை
  alternative: பூமியை
  rationale: இந்தச் சொற்றொடர் இஸ்ரவேலின் உடன்படிக்கை மொழியில் நாட்டை உரிமையாகப் பெறுவதை எதிரொலிக்க வாய்ப்புள்ளது. இருப்பினும் אָרֶץ என்பதற்கு ‘பூமி’ என்ற விரிவான பொருளும் உண்மையாக இருப்பதால் அது அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், வாசிக்க எளிதான அதேவேளையில் கவிதைநயம் குன்றாத நடையைக் கடைப்பிடிக்கிறது. ‘அவன் நலத்தில் தங்கியிருப்பான்’ என்பது எபிரெய மொழியின் தங்கும் படிமத்தையும் נֶפֶשׁ குறிக்கும் முழு மனிதரையும் இயல்பாக வெளிப்படுத்துகிறது. அடிக்குறிப்பு குறிகள் அவை தொடர்புடைய சொற்களுக்குப் பின்னரே இடப்பட்டுள்ளன.
