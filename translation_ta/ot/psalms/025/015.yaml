  text: עֵינַ֣/י תָּ֭מִיד אֶל יְהוָ֑ה כִּ֤י הֽוּא יוֹצִ֖יא מֵ/רֶ֣שֶׁת רַגְלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/015.yaml
  text: My eyes are continually toward Yahweh[a], for he will bring my feet out of the net.
translation:
  language: ta
  text: 'என் கண்கள் எப்போதும் யாவேயை நோக்கியிருக்கின்றன;

    ஏனெனில் அவரே வலையிலிருந்து என் கால்களை வெளியே எடுப்பார்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “வெளியே எடுப்பார்” என்பது எபிரெயத்தில் சொல்லுக்குச் சொல் “வெளியே வரச் செய்வார்” என்று பொருள்படும்; வலையில் சிக்கிய நிலையிலிருந்து மீட்கப்படும் உருவகத்தை இது பாதுகாக்கிறது.
    reason: lexical_explanation
lexical_decisions:
- source_word: עֵינַי
  choice: என் கண்கள்
  rationale: முதல் நபர் ஒருமை உடைமை விகுதியுடன் வரும் பன்மைச் சொல்லை நேரடியாகத் தருகிறது; பார்வை என்ற கருத்தாக்கத்தைவிட எபிரெயத்தின் உடல்சார் உருவகத்தைப் பாதுகாக்கிறது.
- source_word: תָּמִיד
  choice: எப்போதும்
  rationale: தொடர்ந்தும் வழக்கமாகவும் யாவேயை நோக்கியிருக்கும் நிலையை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: אֶל
  choice: நோக்கியிருக்கின்றன
  rationale: கண்கள் ஒரு திசையில் நிலைத்திருப்பதைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; மூலத்திலுள்ள திசைநோக்கிய கவனத்தைப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பட்டத்தால் மாற்றாமல், எபிரெய நான்கெழுத்துத் திருப்பெயரின் ஏற்றுக்கொள்ளப்பட்ட தமிழ் ஒலிபெயர்ப்பை வழங்குகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: சங்கீதக்காரரின் தொடர்ந்த நோக்கத்திற்கான காரணத்தை அறிமுகப்படுத்தும் இணைப்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: הוּא
  choice: அவரே
  rationale: தனி சுட்டுப்பெயரின் வலியுறுத்தலை ‘-ஏ’ மூலம் காக்கிறது; இறைவனைக் குறிக்க இயல்பான மரியாதைப் பன்மை பயன்படுத்தப்படுகிறது.
- source_word: יוֹצִיא
  choice: வெளியே எடுப்பார்
  rationale: ஹிஃபில் வடிவின் ‘வெளியே வரச் செய்வார்’ என்ற துல்லியமான இயக்க உருவகத்தைப் பாதுகாக்கிறது; பொதுவான ‘விடுவிப்பார்’ என்பதைவிட வலையிலிருந்து எடுக்கும் காட்சியைத் தெளிவாக வைத்திருக்கிறது.
- source_word: מֵרֶשֶׁת
  choice: வலையிலிருந்து
  rationale: ‘வலை’ என்ற நேரடி பொருளைத் தருவதால் சிக்கிக்கொள்ளும் மூல உருவகம் பாதுகாக்கப்படுகிறது.
- source_word: רַגְלָי
  choice: என் கால்களை
  rationale: முதல் நபர் ஒருமை உடைமை விகுதியுடன் வரும் பன்மையை நேரடியாகத் தந்து, வலையில் சிக்கிய கால்களின் உடல்சார் உருவகத்தைக் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: வசனம் இறைப்பட்டத்தை அல்ல, நான்கெழுத்துத் தனிப்பெயரையே பயன்படுத்துகிறது. ‘யாவே’ என்பது அந்தப் பெயரின் எபிரெய ஒலியமைப்பை நெருக்கமாகப் பிரதிபலித்து, தனிப்பெயரைப் பட்டத்தால் மாற்றுவதைத் தவிர்க்கிறது.
- issue: הוּא என்ற தனிச் சுட்டுப்பெயரின் வலியுறுத்தல்
  choice: அவரே
  alternative: அவர்
  rationale: மூலத்தில் தனிச் சுட்டுப்பெயர் வெளிப்படையாக இருப்பதால் உண்டாகும் வலியுறுத்தலைக் காக்கிறது; அதே நேரத்தில் அதற்கு அப்பாற்பட்ட கோட்பாட்டுப் பொருளைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும், சங்கீதக் கவிதைக்கு ஏற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. முதல் வரியின் கவனநிலையும் இரண்டாம் வரியின் மீட்பு நம்பிக்கையும் தனித்தனி கவிதை வரிகளாக வைக்கப்பட்டுள்ளன.
