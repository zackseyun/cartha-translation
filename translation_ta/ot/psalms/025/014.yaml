translation:
  language: ta
  text: யெகோவாவின் இரகசிய ஆலோசனை அவருக்குப் பயப்படுகிறவர்களுக்கே; அவர் தமது உடன்படிக்கையை அவர்களுக்கு அறிவிக்கிறார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “அவருடைய உடன்படிக்கை, அவர்களுக்கு அறிவிக்கும்படி” என்ற சுருக்கமான அமைப்பு உள்ளது. இதை “அவருடைய உடன்படிக்கையை அவர்களுக்கு அறிவிப்பதற்காக” என்றும் மொழிபெயர்க்கலாம்.
    reason: לְהוֹדִיעָם என்பது வினையெச்ச வடிவம்; தமிழில் இயல்பாக இருக்கும்படி உட்கிடையான செய்பவரை ‘அவர்’ என வெளிப்படுத்தியுள்ளோம். மாற்று மொழிபெயர்ப்பு மூலத்தின் சுருக்கமான நோக்கத் தொடர்பைச் சுட்டுகிறது.
lexical_decisions:
- source_word: סוֹד
  choice: நெருக்கமான ஆலோசனை
  rationale: இந்தச் சொல் நெருங்கிய வட்டத்தில் பகிரப்படும் இரகசியம், நம்பிக்கைக்குரிய உரையாடல் அல்லது ஆலோசனை ஆகிய பொருள்களைத் தரலாம். சூழலில் தேவனுடன் உள்ள நெருக்கத்தையும் அவர் அளிக்கும் அறிவுரையையும் ஒருங்கே வெளிப்படுத்த இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: எபிரெய தனிப்பெயரான நான்கு எழுத்துத் திருப்பெயரை பொதுவான பட்டப்பெயரான ‘ஆண்டவர்’ என்பதிலிருந்து வேறுபடுத்திக் காட்டும் தமிழ்ப் பயன்பாடு.
- source_word: לִירֵאָיו
  choice: அவருக்குப் பயந்து நடக்கிறவர்களுக்கு
  rationale: இங்கு ‘பயம்’ என்பது வெறும் அச்சத்தை மட்டுமல்லாமல் பயபக்தியையும் அதற்கேற்ற வாழ்க்கையையும் குறிக்கிறது; இயல்பான தமிழில் அந்த உணர்வு வெளிப்படுத்தப்பட்டது.
- source_word: וּבְרִיתוֹ
  choice: அவருடைய உடன்படிக்கை
  rationale: בְּרִית என்பதன் வழக்கமான உடன்படிக்கைப் பொருளை நேரடியாகப் பாதுகாக்கிறது.
- source_word: לְהוֹדִיעָם
  choice: அவர்களுக்குத் தெரியப்படுத்துவது
  rationale: ஹிபில் வினையெச்ச அமைப்பின் ‘அவர்களை அறியச் செய்தல்’ என்ற பொருளை இயல்பான தமிழில் தருகிறது; வெளிப்படையாகக் குறிப்பிடப்படாத செய்பவரைச் சேர்க்கவில்லை.
theological_decisions:
- issue: לְהוֹדִיעָם என்ற இறுதித் தொடரின் இலக்கணத் தொடர்பு
  choice: ‘அவருடைய உடன்படிக்கையை அவர்களுக்குத் தெரியப்படுத்துவதும் உரியது’ என்று நோக்கத்தைக் குறிக்கும் இணை அமைப்பாக மொழிபெயர்த்தல்
  alternative: ‘அவர் தமது உடன்படிக்கையை அவர்களுக்குத் தெரியப்படுத்துகிறார்’
  rationale: எபிரெயத்தில் தனி finite வினை இல்லை; ‘அவருடைய உடன்படிக்கை—அவர்களுக்குத் தெரியப்படுத்துவதற்கு’ என்ற சுருக்கமான அமைப்பு உள்ளது. மூலத்தின் இலக்கணத் திண்மையையும் ஆங்கில ஆலோசனை அடுக்கின் நோக்க வாசிப்பையும் காக்கிறது; அதேவேளை செய்பவரை உரையில் வெளிப்படையாகச் சேர்ப்பதைத் தவிர்க்கிறது.
- issue: סוֹד என்பதிலுள்ள இரகசியம்/நெருக்கமான ஆலோசனை என்ற பொருள் விரிவு
  choice: ‘நெருக்கமான ஆலோசனை’
  alternative: ‘இரகசியம்’ அல்லது ‘நெருங்கிய உறவு’
  rationale: ஒரு மறைபொருள் மட்டுமே சிலருக்குக் கொடுக்கப்படுகிறது என்ற கோட்பாட்டைத் தேவையின்றி வலியுறுத்தாமல், நம்பிக்கைக்குரிய நெருக்கமும் ஆலோசனையும் சேர்ந்த மூலச்சொல்லின் பரப்பைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சங்கீதத்திற்கேற்ற கண்ணியமான ஆனால் சாதாரண வாசகர்களுக்குப் புரியும் நடை. ‘யெகோவா’ தனிப்பெயராக வைக்கப்பட்டது; ‘பயந்து நடக்கிறவர்கள்’ என்பது பயபக்தியின் நடைமுறைத் தன்மையை வெளிப்படுத்துகிறது. முதன்மை உரையின் இரு அரைவரிகளிலும் இணையான ‘உரியது’ அமைப்பு பயன்படுத்தப்பட்டுள்ளது.
