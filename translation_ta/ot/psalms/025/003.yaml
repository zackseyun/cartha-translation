  yaml_path: translation/ot/psalms/025/003.yaml
  text: Indeed[a], none of those who wait for you will be put to shame[b]; those who deal treacherously without cause will be put to shame.
translation:
  language: ta
  text: 'நிச்சயமாக, உமக்காகக் காத்திருப்போர்[a] எவரும் வெட்கத்திற்கு உள்ளாக மாட்டார்கள்;

    காரணமின்றித்[b] துரோகம் செய்பவர்கள் வெட்கத்திற்கு உள்ளாவார்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உம்மில் நம்பிக்கை வைப்போர்.’ எபிரெய வினைச்சொல் எதிர்பார்ப்புடன் காத்திருக்கும் பொருளைக் கொண்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘வீணாகத் துரோகம் செய்பவர்கள்’ / ‘எதற்குமின்றித் துரோகம் செய்பவர்கள்.’ இங்குள்ள எபிரெயச் சொல் רֵיקָם ஒன்றுக்கு மேற்பட்ட விதத்தில் புரிந்துகொள்ளப்படலாம்; இம்மொழிபெயர்ப்பு அதை ‘காரணமின்றி’ என எடுத்துக்கொள்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: ஆம்
  rationale: இங்கு இச்சொல் வெறும் சேர்க்கையைக் காட்டாமல், கூற்றை உறுதிப்படுத்துகிறது; நவீன தமிழில் ‘ஆம்’ அந்த வலியுறுத்தலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כָּל קֹוֶיךָ לֹא יֵבֹשׁוּ
  choice: உமக்காகக் காத்திருப்போர் எவரும் வெட்கத்திற்கு உள்ளாக மாட்டார்கள்
  rationale: எபிரெயச் சொற்றொடரின் சொற்படி அமைப்பு ‘உமக்காகக் காத்திருப்போர் அனைவரும் வெட்கமடைய மாட்டார்கள்’ என்பதாக இருந்தாலும், உலகளாவிய மறுப்பைத் தமிழில் ‘எவரும் ... மாட்டார்கள்’ என்று கூறுவது தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: קֹוֶיךָ
  choice: உமக்காகக் காத்திருப்போர்
  rationale: קוה என்பது எதிர்பார்ப்புடனும் நம்பிக்கையுடனும் காத்திருப்பதைக் குறிக்கிறது. ‘உமக்காகக் காத்திருப்போர்’ அதன் நேரடியான காத்திருத்தல் உணர்வைப் பாதுகாக்கிறது.
- source_word: יֵבֹשׁוּ / לֹא יֵבֹשׁוּ
  choice: வெட்கத்திற்கு உள்ளாவார்கள் / வெட்கத்திற்கு உள்ளாக மாட்டார்கள்
  rationale: בוש இங்கு வெட்கமும் அவமானமும் நேரிடுவதைக் குறிக்கிறது. இரு அடிகளிலும் ஒரே தமிழ்ச் சொல்லாட்சியை வைத்திருப்பது எபிரெயக் கவிதையின் எதிர்மறை இணைநிலையைப் பாதுகாக்கிறது.
- source_word: הַבּוֹגְדִים
  choice: துரோகம் செய்பவர்கள்
  rationale: בגד விசுவாசமின்றி அல்லது வஞ்சகமாகச் செயல்படுவதைக் குறிக்கிறது. பெயரடையாக மட்டும் மொழிபெயர்க்காமல், எபிரெயப் பங்கேற்புச் சொல்லின் செயற்பாட்டு நுணுக்கத்தை இத்தேர்வு காக்கிறது.
- source_word: רֵיקָם
  choice: காரணமின்றி
  rationale: இங்கு רֵיקָם என்பது ஆதாரமோ நியாயமான காரணமோ இன்றித் துரோகம் செய்வதைக் குறிப்பதாக இயல்பாகப் புரிந்துகொள்ளலாம்; எனினும் ‘வீணாக’ அல்லது ‘எதற்குமின்றி’ என்ற பொருளும் சாத்தியம்.
