translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் இயல்பான ஆனால் கண்ணியமான நடையைப் பயன்படுத்துகிறது. இறைவனைச் சுட்டும் ‘உமக்கு’ மரியாதை ஒருமையைப் பேணுகிறது; இரு கவிதை அடிகளிலும் ‘வெட்கத்திற்கு உள்ளாக’ என்பதைத் திரும்பப் பயன்படுத்தி மூலத்தின் இணைநிலையும் முரண்பாடும் காக்கப்பட்டுள்ளன.
