  text: מִי זֶ֣ה הָ֭/אִישׁ יְרֵ֣א יְהוָ֑ה י֝וֹרֶ֗/נּוּ בְּ/דֶ֣רֶךְ יִבְחָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/012.yaml
  text: Who is the man who fears Yahweh? He will instruct him in the way he should choose[a].
translation:
  language: ta
  text: யாவேவுக்கு அஞ்சும் மனிதன் யார்? அவன் தேர்ந்தெடுக்க வேண்டிய வழியை யாவே அவனுக்குக் கற்பிப்பார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவன் தேர்ந்தெடுக்கும் வழியை’ அல்லது ‘அவன் தேர்ந்தெடுக்கப்போகும் வழியை.’ இறுதி எபிரெய வினைச்சொல் இவ்வாறு சற்றே வேறுபட்ட நுணுக்கங்களைக் கொள்ள இடமளிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי זֶה הָאִישׁ
  choice: மனிதன் யார்?
  rationale: מִי זֶה என்பது வலியுறுத்தலுடன் கூடிய வினாவாக இங்கு வருகிறது. நவீனத் தமிழில் இயல்பாக இருக்கும்படி ‘மனிதன் யார்?’ என்று மொழிபெயர்க்கப்பட்டது; הָאִישׁ என்பதன் ஒருமை மனிதக் குறிப்பும் தக்கவைக்கப்பட்டது.
- source_word: יְרֵא יְהוָה
  choice: யாவேவுக்கு அஞ்சுகிற
  rationale: יָרֵא என்பது இச்சூழலில் கடவுளுக்குரிய பயபக்தியைக் குறிக்கிறது. ‘அஞ்சுகிற’ என்பது பயம் மற்றும் மரியாதை இரண்டையும் உள்ளடக்கும் செறிவைத் தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெயத் தெய்வீகப் பெயரான יהוה ஒரு பட்டத்தால் மாற்றப்படாமல், தமிழில் அதன் ஒலிபெயர்ப்பாக வழங்கப்பட்டது.
- source_word: יוֹרֶנּוּ
  choice: அவர் அவனுக்குக் கற்பிப்பார்
  rationale: ירה என்பதன் ஹிஃபில் வடிவம் கற்பித்தல் அல்லது வழிகாட்டுதல் என்ற பொருளைக் கொள்ளலாம். இங்கு ‘கற்பிப்பார்’ இரண்டிற்கும் இடமளிக்கிறது; ஆண்பால் ஒருமை பின்னொட்டு ‘அவனுக்கு’ என்று வெளிப்படுத்தப்பட்டது.
- source_word: בְּדֶרֶךְ
  choice: வழியில்
  rationale: דֶּרֶךְ என்பது நேரடியான பாதையையும் வாழ்க்கை நெறியையும் குறிக்கக்கூடும். ‘வழியில்’ என்ற உருவகம் மூலத்துக்கு நெருக்கமாகத் தக்கவைக்கப்பட்டது.
- source_word: יִבְחָר
  choice: தேர்ந்தெடுக்க வேண்டிய
  rationale: முற்றுப்பெறாத இவ்வினை வடிவம் நிகழ், எதிர் அல்லது சூழல்சார் கடமை நுணுக்கம் பெறலாம். முதன்மை உரையில் அறிவுறுத்தல் சார்ந்த ‘வேண்டிய’ தெரிவு இயல்பான தமிழில் தரப்பட்டது; பிற சாத்தியங்கள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டன.
theological_decisions:
- issue: יוֹרֶנּוּ என்பதன் மறைந்த எழுவாய் யார்?
  choice: யாவே அந்த மனிதனுக்குக் கற்பிப்பார்
  alternative: குறிப்பிடப்படாத ஒருவர் அவனுக்குக் கற்பிப்பார்
  rationale: முந்தைய அரையடியில் யாவே மட்டுமே சாத்தியமான தனிப்பட்ட முன்னோடியாக இருப்பதாலும், சங்கீதத்தின் உடனடிச் சூழல் கடவுளின் வழிகாட்டுதலைப் பற்றியதாக இருப்பதாலும் ‘அவர்’ என்பது யாவேவைக் குறிக்கும் என எடுத்துக்கொள்ளப்பட்டது.
- issue: יִבְחָר என்பதன் காலமும் நுணுக்கமும்
  choice: அவன் தேர்ந்தெடுக்க வேண்டிய வழி
  alternative: அவன் தேர்ந்தெடுக்கும் வழி அல்லது அவன் தேர்ந்தெடுக்கப்போகும் வழி
  rationale: எபிரெய முற்றுப்பெறாத வினை வடிவம் இங்கு ஒன்றுக்கு மேற்பட்ட நுணுக்கத்தை அனுமதிக்கிறது. முதன்மை உரை அறிவுறுத்தல் பொருளை ஏற்றாலும், மாற்று வாசிப்புகள் அடிக்குறிப்பில் வெளிப்படையாகத் தரப்பட்டுள்ளன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் அதேவேளையில் சங்கீதத்திற்குரிய கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘யாவே’ என்ற தனிப்பெயரும் ‘அஞ்சுகிற’ என்ற பயபக்திச் சொல்லும் மூலத்தின் உடன்படிக்கை மற்றும் ஞான இலக்கியச் செறிவைத் தக்கவைக்கின்றன.
