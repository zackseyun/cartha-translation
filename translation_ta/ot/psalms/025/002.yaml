  source_fidelity: 'மூல எபிரெயத்தின் பொருள் பெரும்பாலும் சரியாக உள்ளது: ‘என் கடவுளே,’ ‘உம்மை நம்பியிருக்கிறேன்,’ அவமானம் அடையாமை, பகைவர்களின் களிப்பு ஆகியவை நன்றாகக் காக்கப்பட்டுள்ளன. ஆனால் முதன்மை உரையின் இரண்டு வேண்டுதல்களிலும் ‘விடாதேயும்’ என்பது தமிழில் வழுவான கட்டமைப்பு; பொருள் ‘என்னை அவமானப்பட விடாதேயும்’ அல்லது ‘நான் அவமானம் அடையாதபடி காத்தருளும்’ என அமைய வேண்டும். மேலும் לִי உடனான யַעַלְצוּ-வின் ‘என்னைப் பற்றி/என்மேல் களிகூருதல்’ என்ற உறவை ‘என்னைப் பார்த்து’ விட ‘என்மேல்’ துல்லியமாகக் காட்டுகிறது.'
  naturalness: ‘நான் அவமானத்துக்கு உள்ளாக விடாதேயும்’ மற்றும் ‘களிகூர விடாதேயும்’ ஆகியவை, கடவுளிடம் யாரைத் தடுக்கும்படி கேட்கிறார் என்பதைக் தெளிவாகச் சொல்லாததால் இயல்பான நவீனத் தமிழ் அல்ல. ‘என்னை அவமானப்படுத்த விடாதேயும்; என் பகைவர்கள் என்மேல் களிகூர விடாதேயும்’ என்பது செப நடையிலும் நவீனத் தரத் தமிழிலும் இயல்பாகும்.
