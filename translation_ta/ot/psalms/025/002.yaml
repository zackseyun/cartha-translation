base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/002.yaml
  text: My God[a], in you I trust; do not let me be put to shame[b]; do not let my enemies exult over me.
translation:
  language: ta
  text: என் கடவுளே, உம்மை நம்பியிருக்கிறேன்; என்னை அவமானப்படுத்த விடாதேயும்[a]; என் பகைவர்கள் என்மேல் களிகூர விடாதேயும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என்னை வெட்கமடைய விடாதேயும்.” எபிரெய வினைச்சொல் உள்ளார்ந்த வெட்கத்தையோ, பிறர் முன்னிலையில் அவமானப்படுத்தப்படுவதையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “என் பகைவர்கள் என்மேல் வெற்றிக்களிப்படைய விடாதேயும்” அல்லது “என்மேல் மகிழ விடாதேயும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהַי
  choice: என் கடவுளே
  rationale: முதல் நபர் ஒருமை உடைமை விகுதி ‘என் கடவுள்’ என்பதைக் குறிக்கிறது; அழைப்புமுறையைத் தமிழில் ‘கடவுளே’ என இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּךָ בָטַחְתִּי
  choice: உம்மை நம்பியிருக்கிறேன்
  rationale: ב உடன் வரும் בטח, நம்பிக்கையின் இலக்கைச் சுட்டுகிறது. எபிரெய நிறைவுவினை வடிவத்தின் நிலைபெற்ற, தொடரும் நம்பிக்கையை ‘நம்பியிருக்கிறேன்’ இயல்பாகக் காட்டுகிறது.
- source_word: אַל אֵבוֹשָׁה
  choice: நான் அவமானத்துக்கு உள்ளாக விடாதேயும்
  rationale: בושׁ உள்ளார்ந்த வெட்கத்தையும் வெளிப்படையான அவமானத்தையும் குறிக்கலாம். பகைவர்களின் முன்னிலையில் நியாயம் நிலைநாட்டப்பட வேண்டும் என்ற சூழலில், பொதுவான இழிவை உணர்த்தும் இத்தொடர் பொருத்தமானது.
- source_word: אַל יַעַלְצוּ אֹיְבַי לִי
  choice: என் பகைவர்கள் என்னைப் பார்த்துக் களிகூர விடாதேயும்
  rationale: עלץ மிகுந்த மகிழ்ச்சியையும் களிப்பையும் குறிக்கிறது; பகைவர்கள் எழுவாயாக இருப்பதால், சங்கீதக்காரனின் துன்பத்தைப் பார்த்து அவர்கள் களிப்பதைக் கூறும் இயல்பான தமிழாக்கம் இது.
theological_decisions:
- issue: சங்கீதக்காரன் வேண்டிக்கொள்ளும் ‘அவமானம்’
  choice: அவமானத்துக்கு உள்ளாக விடாதேயும்
  alternative: வெட்கமடைய விடாதேயும்
  rationale: வினைச்சொல் உள்ளார்ந்த வெட்கம் அல்லது பிறர் முன்னிலையில் ஏற்படும் அவமானம் ஆகிய இரண்டையும் குறிக்கக்கூடும். பகைவர்களைப் பற்றிய அடுத்த வேண்டுதலோடு இணைந்துள்ளதால் பொதுவான இழிவு முன்னிலைப்படுத்தப்படுகிறது; மற்ற சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: பகைவர்களின் களிப்பு
  choice: என்னைப் பார்த்துக் களிகூர விடாதேயும்
  alternative: என்னை வென்றதாக வெற்றிக்களிப்படைய விடாதேயும்
  rationale: மூல வினை மிகுந்த களிப்பைக் குறிக்கிறது; ‘வெற்றி’ என்ற கருத்தை முதன்மை உரையில் கட்டாயமாகச் சேர்க்காமல், பகைமையான களிப்பைத் தெளிவாகக் காட்டுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், செபத்திற்குரிய கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. கடவுளை நோக்கிய ஒருமை முன்னிலைக்கு மரியாதை வடிவமான ‘உம்மை’ பயன்படுத்தப்பட்டுள்ளது; அரிதான அல்லது பழமையான சொற்கள் தவிர்க்கப்பட்டுள்ளன.
