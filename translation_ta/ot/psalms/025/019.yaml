    text: 'எபிரெயத்தில் சொல்லுக்குச் சொல்: “வன்முறையின் வெறுப்பால் அவர்கள் என்னை வெறுக்கிறார்கள்.” இச்சொற்றொடர் அவர்களுடைய வெறுப்பின் வன்முறையான, இரக்கமற்ற தன்மையை வலியுறுத்துகிறது.'
