lexical_decisions:
- source_word: רְאֵה
  choice: பாரும்
  rationale: ראה என்பதன் ஆண்பால் ஒருமை ஏவல் வடிவம், ஜெபத்தில் கடவுளை நோக்கி உரைக்கப்படுகிறது. ‘பாரும்’ என்பது வேண்டுதலின் வலிமையையும் கண்ணியமான கவிதை நடையையும் காக்கிறது.
- source_word: אוֹיְבַי
  choice: என் பகைவர்களை
  rationale: முதலாம் நபர் ஒருமை உடைமைப் பின்னொட்டுடன் வரும் பெயர்ச்சொல்லின் நேரடியான, தெளிவான மொழிபெயர்ப்பு.
- source_word: כִּי רָבּוּ
  choice: அவர்கள் ஏராளமாயிருக்கிறார்கள்
  rationale: כִּי காரணத்தை அறிமுகப்படுத்துகிறது; רבה இங்கு பகைவர்களின் பெரும் எண்ணிக்கையைச் சுட்டுகிறது. இந்தத் தேர்வு இயல்பான தமிழில் இரண்டையும் வெளிப்படுத்துகிறது.
- source_word: וְשִׂנְאַת חָמָס שְׂנֵאוּנִי
  choice: கொடூரமான பகையுடன் என்னைப் பகைக்கிறார்கள்
  rationale: שִׂנְאַת חָמָס என்ற சொற்றொடரின் வன்முறையான, இரக்கமற்ற தன்மையையும் שְׂנֵאוּנִי என்பதிலுள்ள ‘என்னைப் பகைக்கிறார்கள்’ என்ற வினை அமைப்பையும் காக்கிறது.
