- from: என் பகைவர்களைப் பாரும்; அவர்கள் ஏராளமாயிருக்கிறார்கள்; கொடூரமான பகையுடன் என்னைப் பகைக்கிறார்கள்.[a]
  to: என் பகைவர்களைப் பாரும்; ஏனெனில் அவர்கள் ஏராளமானவர்கள்; வன்முறையான வெறுப்புடன் அவர்கள் என்னை வெறுக்கிறார்கள்.[a]
  rationale: The revision explicitly renders the causal כִּי, preserves the Hebrew repetition of the hate-word, and corrects the explanatory footnote while retaining a dignified modern Tamil psalm register. The footnote continues to signal the underlying construct expression and its emphasis without resolving it beyond what the context supports.
