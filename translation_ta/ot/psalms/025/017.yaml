lexical_decisions:
- source_word: צָרוֹת
  choice: துன்பங்கள்
  rationale: இந்தப் பன்மைச் சொல் துயரங்களையும் இடர்களையும் குறிக்கிறது; ‘துன்பங்கள்’ என்பது இயல்பான நவீனத் தமிழில் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: לְבָבִי
  choice: என் இதயத்தின்
  rationale: எண்ணங்களும் உணர்வுகளும் அடங்கிய உள்ளார்ந்த மனிதனைச் சுட்டும் எபிரெய உருவகத்தை ‘இதயம்’ தக்கவைக்கிறது.
- source_word: הִרְחִיבוּ
  choice: பெருகிவிட்டன
  rationale: வினைச்சொல்லின் அடிப்படைப் பொருள் ‘விரிவாக்குதல்/அகலமாக்குதல்’; துன்பங்கள் எழுவாயாக இருப்பதால் அவை அதிகரித்தன என்ற சூழற்பொருளை ‘பெருகிவிட்டன’ இயல்பாகத் தெரிவிக்கிறது, அதேவேளை உருவகத்தின் மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: מִמְּצוּקוֹתַי
  choice: என் நெருக்கங்களிலிருந்து
  rationale: இந்தச் சொல் இறுக்கம், நெருக்கடி, துன்பம் ஆகிய உணர்வுகளைத் தருகிறது; ‘நெருக்கங்கள்’ என்பது தொடர்ந்து வரும் வெளியே கொண்டுவருதல் என்ற இடவெளி உருவகத்தையும் பன்மையையும் தக்கவைக்கிறது.
- source_word: הוֹצִיאֵנִי
  choice: என்னை வெளியே கொண்டுவாரும்
  rationale: ‘வெளியே கொண்டுவருதல்’ என்ற காரணவினைப் பொருளையும் நெருக்கத்திலிருந்து மீட்கும் தெளிவான உருவகத்தையும் நேரடியாகப் பாதுகாக்கிறது.
