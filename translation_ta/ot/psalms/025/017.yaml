  text: The troubles of my heart have multiplied[b][a]; bring me out of my distresses.
translation:
  language: ta
  text: என் இதயத்தின் துன்பங்கள் பெருகிவிட்டன[a]; என் நெருக்கடிகளிலிருந்து என்னை வெளியே கொண்டுவாரும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் இதயத்தின் துன்பங்கள் விரிவடைந்துவிட்டன”; இது எபிரெய மொழியின் உருவகத்தை இன்னும் நேரடியாகப் பாதுகாக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “என் நெருக்கடிகளிலிருந்து என்னை விடுவியும்.”
