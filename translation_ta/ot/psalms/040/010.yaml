revisions:
- from: உமது நீதியை என் உள்ளத்தில் மறைத்து வைக்கவில்லை[a]; உமது உண்மைத்தன்மையையும் உமது மீட்பையும்[b] அறிவித்தேன். உமது மாறாத அன்பையும்[c] உமது சத்தியத்தையும் பெரும் சபையாரிடமிருந்து மறைக்கவில்லை[d].
  to: உமது நீதியை என் உள்ளத்தில் மறைத்து வைக்கவில்லை[a]; உமது நம்பகத்தன்மையையும் உமது மீட்பையும்[b] அறிவித்தேன். உமது மாறாத அன்பையும்[c] உமது சத்தியத்தையும் பெரும் சபையிடமிருந்து மறைக்கவில்லை[d].
  rationale: 'The revision makes two limited improvements: it replaces an abstract expression for divine faithfulness with natural modern Tamil, and it corrects the collective expression for the great assembly. The verse''s syntax, poetic repetition, lexical distinctions, and the source-supported ambiguity noted at d are otherwise preserved.'
  reviewer_model: gpt-5.6-terra
