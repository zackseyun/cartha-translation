  text: צִדְקָתְ/ךָ֬ לֹא כִסִּ֨יתִי בְּ/ת֬וֹךְ לִבִּ֗/י אֱמוּנָתְ/ךָ֣ וּ/תְשׁוּעָתְ/ךָ֣ אָמָ֑רְתִּי לֹא כִחַ֥דְתִּי חַסְדְּ/ךָ֥ וַ֝/אֲמִתְּ/ךָ֗ לְ/קָהָ֥ל רָֽב־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/010.yaml
  text: I have not hidden your righteousness within my heart[a]; I have spoken of your faithfulness and your salvation[d][c][b]. I have not concealed your steadfast love and your truth from the great assembly.
translation:
  language: ta
  text: உமது நீதியை என் உள்ளத்தில் மறைத்து வைக்கவில்லை[a]; உமது நம்பகத்தன்மையையும் உமது மீட்பையும்[b] அறிவித்தேன். உமது மாறாத அன்பையும்[c] உமது சத்தியத்தையும் பெரும் சபையிடமிருந்து மறைக்கவில்லை[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உமது நீதி’ என்பதற்கு ‘உமது நீதியான செயல்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் ஒழுக்க நேர்மையையோ நீதிசெய்தல் அல்லது நியாயப்படுத்துதலையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘உமது மீட்பு’ என்பதற்கு ‘உமது விடுதலை’ அல்லது ‘உமது இரட்சிப்பு’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: ‘உமது மாறாத அன்பு’ என்பதற்கு ‘உமது உடன்படிக்கை அன்பு’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: d
    text: ‘பெரும் சபையிடமிருந்து’ என்பதற்கு ‘பெரும் சபைக்கு முன்பாக’ என்றும் மொழிபெயர்க்கலாம். எபிரெயத் தொடர், அவர் யாரிடமிருந்து இவற்றை மறைக்கவில்லை என்பதையோ அவர் யாருக்கு முன்பாகப் பேசினார் என்பதையோ வலியுறுத்தலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: צִדְקָתְךָ
  choice: உமது நீதி
  rationale: צדקה என்பதில் ஒழுக்க நேர்மையும் நீதியான செயலும் விடுவிக்கும் நீதியும் அடங்கலாம். இங்கு தேவனுடைய பிற உடன்படிக்கைப் பண்புகளுடன் இணைந்து வருவதால், இயல்பான தமிழில் இந்த விரிவை மிகச் சிறப்பாகத் தக்கவைப்பது ‘நீதி’.
- source_word: כִסִּיתִי
  choice: மறைத்து வைக்கவில்லை
  rationale: כסה என்பதன் அடிப்படைப் பொருள் ‘மூடுதல்’; ‘என் உள்ளத்தில்’ என்ற தொடருடன், வெளிப்படுத்தாமல் அகத்தே வைத்திருப்பதைக் ‘மறைத்து வைக்கவில்லை’ இயல்பாகக் காட்டுகிறது.
- source_word: בְּתוֹךְ לִבִּי
  choice: என் உள்ளத்தில்
  rationale: எபிரெய உருவகத்தைத் தக்கவைத்தபடியே, அகத்தில் வைத்திருத்தல் என்ற கருத்தை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֱמוּנָתְךָ
  choice: உமது உண்மைத்தன்மை
  rationale: இங்கு אֱמוּנָה நம்பிக்கையை அல்ல, தேவனுடைய நம்பகத்தன்மையையும் தவறாத தன்மையையும் குறிக்கிறது. பின்னர் வரும் אמת என்பதிலிருந்து வேறுபாட்டையும் இது காக்கிறது.
- source_word: וּתְשׁוּעָתְךָ
  choice: உமது மீட்பு
  rationale: תשועה இரட்சிப்பு, விடுவிப்பு, வெற்றி ஆகிய அர்த்தங்களை ஏற்கலாம். சங்கீதத்தின் தெய்வீகக் காப்புச் சூழலில் ‘மீட்பு’ தெளிவான, இயல்பான பொதுச் சொல்லாகிறது.
- source_word: אָמָרְתִּי
  choice: அறிவித்தேன்
  rationale: சொற்படி ‘சொன்னேன்’ என்றாலும், தொடர்ந்து வரும் தேவப் பண்புகள் நேரடிப் பொருள்களாக இருப்பதாலும் பொதுச் சபைச் சூழலாலும் ‘அறிவித்தேன்’ இயல்பாகப் பொது பிரகடனத்தை வெளிப்படுத்துகிறது.
- source_word: כִחַדְתִּי
  choice: மறைக்கவில்லை
  rationale: כחד மறைத்தல் அல்லது தெரிவிக்காமல் வைத்தல் என்பதைக் குறிக்கிறது. முதல் வினையுடன் உள்ள கவிதை இணைநிலையைத் தக்கவைத்து, தமிழில் சுருக்கமாக உள்ளது.
- source_word: חַסְדְּךָ
  choice: உமது மாறாத அன்பு
  rationale: חסד அன்பு, விசுவாசம், உடன்படிக்கைப் பற்றுறுதி ஆகியவற்றை இணைக்கும் செறிவான சொல். ‘மாறாத அன்பு’ அன்பையும் நிலைத்த விசுவாசத்தையும் நவீனத் தமிழில் உணர்த்துகிறது.
- source_word: וַאֲמִתְּךָ
  choice: உமது சத்தியம்
  rationale: אמת சத்தியம், நம்பகத்தன்மை, உண்மைத்தன்மை ஆகியவற்றைக் குறிக்கலாம். முன்னுள்ள אֱמוּנָה-வை ‘உண்மைத்தன்மை’ என்று மொழிபெயர்த்துள்ளதால், ‘சத்தியம்’ மூலத்தின் சொல் வேறுபாட்டைப் பாதுகாக்கிறது.
- source_word: לְקָהָל רָב
  choice: பெரும் சபையாரிடமிருந்து
  rationale: כחד என்ற மறைத்தல் வினைக்குப் பின் வரும் לְ, யாரிடமிருந்து மறைக்கவில்லை என்ற பொருளை இயல்பாகத் தருகிறது. ‘பெரும் சபை’ பொதுவான, சமூக வழிபாட்டுச் சூழலைக் காக்கிறது.
theological_decisions:
- issue: אֱמוּנָה மற்றும் אֱמֶת என்ற தொடர்புடைய உடன்படிக்கைச் சொற்களை வேறுபடுத்துதல்
  choice: אֱמוּנָתְךָ என்பதை ‘உமது உண்மைத்தன்மை’ என்றும் אֲמִתְּךָ என்பதை ‘உமது சத்தியம்’ என்றும் மொழிபெயர்த்தல்
  alternative: இரண்டையும் ‘உண்மைத்தன்மை’ போன்ற ஒரே அல்லது ஒன்றோடொன்று கலக்கும் சொற்களால் மொழிபெயர்த்தல்
  rationale: கவிதையில் அடுக்கப்படும் தொடர்புடைய தேவப் பண்புகளை ஒரே கருத்தாகச் சுருக்காமல், மூலத்தின் சொல்லாட்சிப் பன்மையையும் உண்மையாய் இருப்பது மற்றும் சத்தியம் ஆகிய இணைந்த கருத்துகளையும் காக்கிறது.
- issue: எபிரெய நிறைவு வினைகளின் தமிழ்க் காலம்
  choice: ‘மறைத்து வைக்கவில்லை’, ‘அறிவித்தேன்’, ‘மறைக்கவில்லை’ என்ற இறந்தகால வடிவங்கள்
  alternative: தொடர்ந்த நிலையைக் கூடுதலாக வெளிப்படுத்தும் ‘மறைத்து வைத்திருக்கவில்லை’, ‘அறிவித்திருக்கிறேன்’ போன்ற வடிவங்கள்
  rationale: எபிரெய நிறைவு வினைகள் நிறைவுற்ற சாட்சிச் செயல்களைக் கூறுகின்றன. தமிழில் எளிய இறந்தகாலம் அந்தச் செயல்களை இயல்பாகவும் மிகை விளக்கமின்றியும் தெரிவிக்கிறது; சூழலே அவற்றின் தற்போதைய சாட்சிப் பொருத்தத்தை அளிக்கிறது.
- issue: לְקָהָל רָב என்பதன் தொடர்பு
  choice: ‘பெரும் சபையாரிடமிருந்து மறைக்கவில்லை’
  alternative: ‘பெரும் சபைக்கு முன்பாக மறைக்கவில்லை’ அல்லது அறிவித்ததை ‘பெரும் சபைக்கு முன்பாக’ என்பதுடன் இணைத்தல்
  rationale: சொற்றொடரின் அருகிலுள்ள כחד ‘மறைத்தல்’ வினையுடன் לְ இயல்பாக மறைக்கப்பட்டிருக்கக் கூடிய நபர்களைக் குறிக்கிறது. இருப்பினும் பொதுச் சபைக்கு முன் அறிவித்தல் என்ற வலியுறுத்தலும் இலக்கண ரீதியாக சாத்தியமுள்ளதால் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுமக்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான சங்கீத நடையைப் பயன்படுத்துகிறது. தேவனை நோக்கிய மரியாதைப் பன்மைக்காக ‘உமது’ பயன்படுத்தப்பட்டுள்ளது. எபிரெயக் கவிதையின் மறைத்தல்–அறிவித்தல் எதிர்நிலையும் உடன்படிக்கைப் பண்புகளின் அடுக்குமுறையும் பாதுகாக்கப்பட்டுள்ளன.
