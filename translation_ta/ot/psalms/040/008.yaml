lexical_decisions:
- source_word: לַעֲשׂוֹת
  choice: நிறைவேற்றுவதில்
  rationale: עשה என்பதன் infinitive construct, חפץ உடன் சேர்ந்து மகிழ்ச்சியின் பொருளைச் சுட்டுகிறது. தமிழில் ‘விருப்பத்தை நிறைவேற்றுதல்’ என்பது இயல்பான இணைச்சொல்; செயற்படுத்தும் பொருளையும் தெளிவாகக் காட்டுகிறது.
- source_word: רְצוֹנְךָ
  choice: உமது விருப்பத்தை
  rationale: רָצוֹן என்பது விருப்பம், சித்தம், பிரியம் ஆகிய பொருள்களைக் கொண்டது. ‘உமது விருப்பம்’ என்பது இறைவனுடைய மனவிருப்பத்தை இயல்பாகத் தெரிவிக்கிறது; ‘சித்தம்’ என்ற சமயச் சிறப்பு வழக்கைத் தவிர்த்து பொதுவாசகருக்கும் புரியும்படி உள்ளது.
- source_word: אֱלֹהַי
  choice: என் இறைவனே
  rationale: முதல் நபர் ஒருமை உரிமை விகுதியையும் நேரடி அழைப்பையும் தமிழில் ‘என் இறைவனே’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: חָפָצְתִּי
  choice: நான் மகிழ்கிறேன்
  rationale: חפץ விரும்புதல், இன்பம் காணுதல், மகிழ்தல் ஆகிய நுண்பொருள்களைக் கொண்டது. இங்கு இறைவனின் விருப்பத்தைச் செய்வதில் உள்ள மனமுவந்த மகிழ்ச்சியை ‘மகிழ்கிறேன்’ தெளிவாகக் காட்டுகிறது.
- source_word: וְתוֹרָתְךָ
  choice: உமது திருச்சட்டம்
  rationale: תּוֹרָה என்பது சட்டம் மட்டுமல்லாமல் போதனை அல்லது அறிவுறுத்தலையும் குறிக்கலாம். முதன்மை உரையில் உடன்படிக்கை மற்றும் வேதநூல் சார்ந்த நிறையைத் தக்கவைக்க ‘திருச்சட்டம்’ பயன்படுத்தப்பட்டு, விரிந்த பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בְּתוֹךְ
  choice: ஆழத்தில்
  rationale: בְּתוֹךְ என்பது நடுவில் அல்லது உள்ளே இருப்பதைக் குறிக்கிறது. מֵעַי உடன் சேரும்போது ஆழ்ந்த அகநிலையைச் சுட்டுவதால் ‘உள்ளத்தின் ஆழத்தில்’ தமிழில் இயல்பான சமவிலக்காக அமைகிறது.
- source_word: מֵעָי
  choice: என் உள்ளத்தின்
  rationale: מֵעֶה சொல்லர்த்தமாக உடலின் உள்ளுறுப்புகளைக் குறித்தாலும், இங்கு அகமனிதன் அல்லது ஆழ்ந்த உணர்வு மையத்தைக் குறிக்கிறது. ‘என் உள்ளத்தின் ஆழத்தில்’ உடற்கூறு சார்ந்த தவறான புரிதலைத் தவிர்த்து அந்த மானுடவியல் உருவகத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: பக்திசார் சூழலில் תּוֹרָה என்பதன் மொழிபெயர்ப்பு
  choice: திருச்சட்டம்
  alternative: போதனை / அறிவுரை
  rationale: ‘திருச்சட்டம்’ உடன்படிக்கை மற்றும் வேதநூல் சார்ந்த ஒலிப்பைத் தக்கவைக்கிறது. எனினும் תּוֹרָה சட்ட விதிகளை விட விரிவாக இறைவனுடைய போதனையையும் குறிக்கக்கூடும் என்பதால் அந்த மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ்நடை. இறைவனை நோக்கிய மரியாதை ஒருமைக்காக ‘உமது’ பயன்படுத்தப்பட்டுள்ளது. ‘சித்தம்’ போன்ற சமய வட்டாரத்துக்கே உரிய சொற்களுக்குப் பதிலாக பொதுவாகப் புரியும் ‘விருப்பம்’ தேர்ந்தெடுக்கப்பட்டுள்ளது; எபிரெய உருவகத்தின் அகநிலை வலிமை ‘என் உள்ளத்தின் ஆழத்தில்’ என இயல்பாக்கப்பட்டுள்ளது.
