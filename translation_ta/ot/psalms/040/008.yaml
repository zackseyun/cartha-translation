  yaml_path: translation/ot/psalms/040/008.yaml
  text: I delight to do your will[a], my God, and your law is within my inner being.
translation:
  language: ta
  text: என் இறைவனே, உமது விருப்பத்தை நிறைவேற்றுவதில் நான் மகிழ்கிறேன்; உமது திருச்சட்டம்[a] என் உள்ளத்தின் ஆழத்தில் இருக்கிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘போதனை.’ எபிரெயச் சொல்லான தோரா சட்ட விதிகளை மட்டும் அல்லாமல், இறைவனுடைய போதனையை விரிவாகவும் குறிக்கலாம்.
