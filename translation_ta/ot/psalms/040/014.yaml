  text: יֵ֘בֹ֤שׁוּ וְ/יַחְפְּר֨וּ יַחַד֮ מְבַקְשֵׁ֥י נַפְשִׁ֗/י לִ/סְפּ֫וֹתָ֥/הּ יִסֹּ֣גוּ אָ֭חוֹר וְ/יִכָּלְמ֑וּ חֲ֝פֵצֵ֗י רָעָתִֽ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/014.yaml
  text: Let those who seek to sweep away my life be put to shame and humiliated together[c][b][a]; let those who delight in my harm turn back and be disgraced.
translation:
  language: ta
  text: என் உயிரை[a] அழித்துவிட[b] நாடுகிறவர்கள் அனைவரும் ஒன்றாக வெட்கமடைந்து அவமானப்படுவார்களாக; எனக்குத் தீங்கு நேர்வதில் மகிழ்கிறவர்கள் பின்வாங்கி இழிவடைவார்களாக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உயிரை’ என்பதற்கான எபிரெயச் சொல் நேரடியாக ‘என் உயிர்/என் நெஃபெஷ்’ என உள்ளது; இச்சூழலில் சங்கீதக்காரரின் உயிர் அல்லது வாழ்வைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘அழித்துவிட’ என்பதற்கு ‘முற்றிலும் ஒழித்துவிட’ அல்லது ‘விழுங்கிவிட’ என்றும் பொருள் கொள்ளலாம்; எபிரெய வினை உயிரை முடிவுக்குக் கொண்டுவரும் கருத்தைத் தருகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵבֹשׁוּ וְיַחְפְּרוּ יַחַד
  choice: அனைவரும் ஒன்றாக வெட்கமடைந்து அவமானப்படுவார்களாக
  rationale: இரு இணைச் சொற்களும் வெட்கம் மற்றும் அவமானத்தை வலியுறுத்துகின்றன; יַחַד என்பதன் கூட்டுப் பொருளை ‘அனைவரும் ஒன்றாக’ இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מְבַקְשֵׁי נַפְשִׁי
  choice: என் உயிரை ... நாடுகிறவர்கள்
  rationale: נֶפֶשׁ இங்கு உடலிலிருந்து வேறான ‘ஆத்துமா’ என்பதைவிட சங்கீதக்காரரின் உயிர் அல்லது வாழ்வைக் குறிக்கிறது; பகைமையான நோக்கத்தையும் ‘நாடுகிறவர்கள்’ தக்கவைக்கிறது.
- source_word: לִסְפּוֹתָהּ
  choice: அழித்துவிட
  rationale: ספה என்பதன் சூழல்சார் பொருள் உயிரை முடிவுக்குக் கொண்டுவருதல் அல்லது முற்றிலும் அழித்தல். ‘அழித்துவிட’ என்பது தெளிவாகவும் இயல்பாகவும் உள்ளது; வினையுடன் சேர்ந்த பெண்பால் ஒருமை பின்னொட்டு נֶפֶשׁ என்பதையே சுட்டுகிறது.
- source_word: יִסֹּגוּ אָחוֹר
  choice: பின்வாங்கி
  rationale: סוג மற்றும் אָחוֹר இணைந்து பின்னோக்கிச் செல்லுதல் அல்லது முயற்சியிலிருந்து விலகுதல் என்ற பொருளைத் தருகின்றன; ‘பின்வாங்கி’ சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: וְיִכָּלְמוּ
  choice: இழிவடைவார்களாக
  rationale: כלם அவமானம் அல்லது இழிவு அடைவதைக் குறிக்கிறது. முதல் அரையடியிலுள்ள வெட்கச் சொற்களுடன் கவிதை இணைநிலையைப் பேணியபடியே தமிழில் தேவையற்ற சொல் மறுபடியையும் தவிர்க்கிறது.
- source_word: חֲפֵצֵי רָעָתִי
  choice: எனக்குத் தீங்கு நேர்வதில் மகிழ்கிறவர்கள்
  rationale: חפץ விருப்பம் அல்லது மகிழ்ச்சியைக் குறிக்கலாம்; רָעָתִי இங்கு சங்கீதக்காரரின் ஒழுக்கத் தீமையை அல்ல, அவருக்கு நேரும் தீங்கு அல்லது கேட்டை குறிக்கிறது.
theological_decisions:
- issue: வினை வடிவங்களின் வேண்டுதல்/சாப வேண்டுதல் நயம்
  choice: ‘வர்களாக’ என்ற வேண்டுதல் வடிவம்
  alternative: எதிர்கால நிகழ்வாக ‘வார்கள்’ என்று மொழிபெயர்த்தல்
  rationale: எபிரெய வினை வடிவங்கள் இச்சூழலில் பகைவர்களுக்கு எதிரான வேண்டுதலை வெளிப்படுத்துகின்றன. அவற்றை உறுதியான முன்னறிவிப்பாக மாற்றாமல், சங்கீதக்காரரின் வேண்டுதலாகவே தமிழ் வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், வழிபாட்டு மரியாதையையும் சங்கீதத்தின் இணை அமைப்பையும் காக்கும் நடை. அரிதான அல்லது பிரிவுசார் சமயச் சொற்கள் தவிர்க்கப்பட்டுள்ளன; வேண்டுதல் நயத்தை ‘வர்களாக’ வடிவம் பேணுகிறது.
