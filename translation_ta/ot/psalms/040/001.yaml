base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/001.yaml
  text: I waited patiently for Yahweh[a], and he turned to me and heard my cry for help.
translation:
  language: ta
  text: நான் யாவேவைப் பொறுமையுடன் எதிர்பார்த்துக் காத்திருந்தேன்[a]; அவர் என்னை நோக்கித் திரும்பி, என் உதவிக் கூக்குரலைக் கேட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில், “காத்திருக்க, நான் யாவேவுக்காகக் காத்திருந்தேன்” என ஒரே வினைச்சொல் இரட்டித்து வலியுறுத்தப்படுகிறது. இதை “நான் பொறுமையுடன் காத்திருந்தேன்” அல்லது “ஆவலுடன் எதிர்பார்த்துக் காத்திருந்தேன்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַוֺּה קִוִּיתִי
  choice: பொறுமையுடன் எதிர்பார்த்துக் காத்திருந்தேன்
  rationale: קוה என்பதன் வினையெச்ச முழுவடிவமும் வினைமுற்றும் இணைந்து காத்திருப்பதை வலியுறுத்துகின்றன. தமிழில் ‘எதிர்பார்த்துக் காத்திருந்தேன்’ என்பது நம்பிக்கையோடு தொடர்ந்த காத்திருப்பையும், ‘பொறுமையுடன்’ என்பது அதன் வலியுறுத்தலையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் பொதுப்பட்டம் அல்ல, கடவுளின் தனிப்பெயரான நான்கெழுத்துப் பெயர் உள்ளது. அதனைத் தமிழில் ஒலிபெயர்த்து ‘யாவே’ என வழங்குவது அந்தத் தனிப்பெயரைப் பாதுகாக்கிறது.
- source_word: וַיֵּט אֵלַי
  choice: அவர் என்னை நோக்கித் திரும்பி
  rationale: נטה என்பது சாய்தல், திருப்புதல் அல்லது ஒருவரை நோக்கித் தன்னைச் செலுத்துதல் என்ற பொருள்களைத் தருகிறது. இச்சூழலில் ‘என்னை நோக்கித் திரும்பி’ என்பது கவனத்துடன் அணுகிய இயக்கத்தை இயல்பான தமிழில் தருகிறது; ‘குனிந்தார்’ என்று மொழிபெயர்த்து மூலத்தில் உறுதியாக இல்லாத உடல் இயக்கத்தைச் சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: וַיִּשְׁמַע
  choice: கேட்டார்
  rationale: שׁמע இங்கு முறையீட்டைக் கவனித்துக் கேட்டதைக் குறிக்கிறது. ‘கேட்டார்’ என்பது தமிழில் இயல்பானதும், பின்னணியில் உள்ள பதிலளிக்கும் கவனத்தை மறுக்காததும் ஆகும்.
- source_word: שַׁוְעָתִי
  choice: என் உதவிக் கூக்குரல்
  rationale: שַׁוְעָה சாதாரணக் குரலை அல்ல, துன்பத்தில் உதவி கேட்டு எழுப்பும் கூக்குரலைக் குறிக்கிறது. ‘உதவிக் கூக்குரல்’ அந்தச் சிறப்புப் பொருளைச் சுருக்கமாகத் தெளிவாக்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: வசனம் நேரடியாக நான்கெழுத்து இறைப்பெயரைப் பயன்படுத்துகிறது. பட்டப்பெயரால் மாற்றாமல் ‘யாவே’ என ஒலிபெயர்ப்பது மூலத்தின் தனிப்பெயரைப் பாதுகாக்கிறது; எந்தச் சமயப்பிரிவுக்குரிய தனித்த விளக்கத்தையும் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. எபிரெயத்தின் வலியுறுத்தல் இயல்பான தமிழில் வினையடை மற்றும் கூட்டு வினை மூலம் தரப்பட்டுள்ளது; இறைப்பெயர் தனிப்பெயராக ஒலிபெயர்க்கப்பட்டுள்ளது.
