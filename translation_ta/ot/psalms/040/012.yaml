  rationale: சிறு நடையியல் மற்றும் துல்லியத் திருத்தங்கள் மட்டுமே செய்யப்பட்டுள்ளன. மூலத்தில் இல்லாத ‘கூட’ நீக்கப்பட்டது; ‘பிடித்துக்கொண்டன’ என்பது பின்தொடர்ந்து வந்து பிடித்துக்கொள்ளும்/மேற்கொள்ளும் உருவகத்தை இயல்பாகக் காக்கிறது; தலைமுடி ஒப்புமை தனித்தனி முடிகளின் எண்ணிக்கையைத் தெளிவாகக் காட்டுமாறு மாற்றப்பட்டது. அடிக்குறிப்பு குறியீடுகளும் அவற்றின் பொருளும் முழுமையாகப் பாதுகாக்கப்பட்டுள்ளன.
