source:
  edition: WLC
  text: כִּ֤י אָפְפ֥וּ עָלַ֨/י רָע֡וֹת עַד אֵ֬ין מִסְפָּ֗ר הִשִּׂיג֣וּ/נִי עֲ֭וֺנֹתַ/י וְ/לֹא יָכֹ֣לְתִּי לִ/רְא֑וֹת עָצְמ֥וּ מִ/שַּֽׂעֲר֥וֹת רֹ֝אשִׁ֗/י וְ/לִבִּ֥/י עֲזָבָֽ/נִי־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/012.yaml
  text: For evils beyond number have surrounded me[a]; my iniquities have overtaken me, and I am not able to see. They are more than the hairs of my head[c][b], and my heart fails me.
translation:
  language: ta
  text: ஏனெனில், எண்ணிக்கைக்கு அடங்காத[a] தீமைகள் என்னைச் சூழ்ந்துகொண்டன; என் அக்கிரமங்கள்[b] என்னைப் பிடித்துக்கொண்டன; என்னால் பார்க்க முடியவில்லை. அவை என் தலையின் முடிகளைவிட மிகுதியானவை; என் இதயம் தளர்ந்துவிட்டது[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘எண்ணிக்கையே இல்லாத’ அல்லது ‘எண்ண முடியாத அளவுக்கு மிகுந்த’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘என் அக்கிரமங்கள்’ என்பதை ‘என் பாவங்கள்’ அல்லது ‘என் குற்றப்பழி’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் தவறான செயலையும் அதனால் சுமக்கப்படும் பழியையும் உள்ளடக்கக்கூடும்.
    reason: lexical_alternative
  - marker: c
    text: சொல்லுக்குச் சொல், ‘என் இதயம் என்னைக் கைவிட்டது.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: சுற்றியுள்ள வேண்டுதலுக்கான காரணத்தை அறிமுகப்படுத்தும் எபிரெய இணைப்புச் சொல்லின் விளக்க வலிமையை இயல்பான தமிழில் காக்கிறது.
- source_word: אָפְפוּ עָלַי
  choice: என்னைச் சூழ்ந்துகொண்டன
  rationale: எல்லாப் பக்கங்களிலும் நெருக்கப்படுதல் அல்லது சூழப்படுதல் என்ற உருவகத்தைத் தெளிவாகக் காக்கிறது.
- source_word: רָעוֹת
  choice: தீமைகள்
  rationale: இச்சொல் தீமை, தீங்கு, பேரிடர் ஆகிய பரந்த பொருள்களைக் கொள்ளக்கூடியது. ‘தீமைகள்’ என்பது ஒழுக்கத் தீமையையும் அனுபவிக்கும் கேடுகளையும் முன்கூட்டியே ஒன்றாக மட்டும் குறுக்காமல் அதன் அகலத்தைப் பாதுகாக்கிறது.
- source_word: עַד אֵין מִסְפָּר
  choice: எண்ணிக்கைக்கு அடங்காத
  rationale: எண்ண முடியாத அளவு மிகுதி என்ற எபிரெய மரபுத்தொடரை இயல்பான, கண்ணியமான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הִשִּׂיגוּנִי
  choice: என்னை எட்டிப்பிடித்தன
  rationale: பின்தொடர்ந்து வந்து எட்டுதல், பிடித்துக்கொள்ளுதல், மேற்கொள்ளுதல் ஆகிய இயக்கமும் அழுத்தமும் கொண்ட உருவகத்தைப் பாதுகாக்கிறது.
- source_word: עֲוֹנֹתַי
  choice: என் அக்கிரமங்கள்
  rationale: தவறான செயல், பாவம், அதனால் உண்டாகும் குற்றப்பழி ஆகியவற்றை உள்ளடக்கக்கூடிய சொல்லின் ஒழுக்கக் கனத்தை ‘அக்கிரமங்கள்’ காக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְלֹא יָכֹלְתִּי לִרְאוֹת
  choice: என்னால் பார்க்கக்கூட முடியவில்லை
  rationale: காண இயலாமையை நேரடியாகக் கூறுகிறது; அது உடல்சார் பார்வையா அல்லது மிகுந்த துயரத்தால் ஏற்பட்ட திகைப்பா என்பதைத் தீர்மானிக்காமல் விடுகிறது.
- source_word: עָצְמוּ מִשַּׂעֲרוֹת רֹאשִׁי
  choice: அவை என் தலைமுடிகளைக் காட்டிலும் மிகுதியானவை
  rationale: எண்ணிலடங்காத பெருக்கைக் குறிக்கும் எபிரெய ஒப்புமையைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: לִבִּי עֲזָבָנִי
  choice: என் இதயம் தளர்ந்துவிட்டது
  rationale: சொல்லுக்குச் சொல் ‘என் இதயம் என்னைக் கைவிட்டது’ என்ற உருவகம் வலிமை அல்லது துணிவு முற்றிலும் தளர்வதைச் சுட்டுகிறது. தமிழில் இயல்பான ‘இதயம் தளர்ந்துவிட்டது’ அதன் உருவக மையத்தைப் பாதுகாக்கிறது; நேரடி வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: עֲוֹנֹתַי என்பது சங்கீதக்காரரின் சொந்தப் பாவங்களையா, குற்றப்பழியையா, அல்லது அவற்றின் விளைவான துன்பங்களையா குறிக்கிறது?
  choice: என் அக்கிரமங்கள்
  alternative: என் பாவங்கள்; என் குற்றப்பழி; என் பாவங்களின் விளைவுகள்
  rationale: முதலாம் நபர் உடைமை விகுதியுடன் வரும் עָוֹן இயல்பாகப் பேசுகிறவரின் சொந்த அக்கிரமங்களையோ குற்றப்பழியையோ குறிக்கிறது. வெளிப்புறத் தீமைகளுக்கும் உள்ளார்ந்த ஒழுக்கப் பொறுப்புக்கும் இடையிலுள்ள பதற்றத்தை ‘துன்பங்கள்’ என்று சமப்படுத்தாமல் மொழிபெயர்ப்பு காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான சங்கீத நடையைப் பயன்படுத்துகிறது. எளிதில் புரியும் சொற்களுடன் மூலத்தின் சூழப்படுதல், எட்டிப்பிடிக்கப்படுதல், தலைமுடியுடன் ஒப்பிடுதல், இதயம் தளர்தல் ஆகிய உருவகங்கள் காக்கப்பட்டுள்ளன. ‘தீமைகள்’ மற்றும் ‘அக்கிரமங்கள்’ என்பவற்றின் பொருள் அகலம் அடிக்குறிப்புகளால் விளக்கப்படுகிறது.
