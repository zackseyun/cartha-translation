  text: יָ֘שִׂ֤ישׂוּ וְ/יִשְׂמְח֨וּ בְּ/ךָ֗ כָּֽל מְבַ֫קְשֶׁ֥י/ךָ יֹאמְר֣וּ תָ֭מִיד יִגְדַּ֣ל יְהוָ֑ה אֹֽ֝הֲבֵ֗י תְּשׁוּעָתֶֽ/ךָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/016.yaml
  text: Let all who seek you rejoice and be glad in you[a]; let those who love your salvation say continually[b], “May Yahweh be magnified!”
translation:
  language: ta
  text: உம்மைத் தேடுகிற அனைவரும் உம்மில் மகிழ்ந்து களிகூரட்டும்; உமது மீட்பை நேசிக்கிறவர்கள், “யாவே மகிமைப்படுவாராக!” என்று எப்போதும் சொல்லட்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “யாவே மகிமைப்படுவாராக” என்பது யாவேயின் மகத்துவம் வெளிப்படையாக அறியப்பட்டுப் போற்றப்பட வேண்டும் என்ற வாழ்த்துரை.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשִׂישׂוּ וְיִשְׂמְחוּ
  choice: மகிழ்ந்து களிகூரட்டும்
  rationale: இரு வினைகளின் விருப்ப/வேண்டுதல் நுணுக்கத்தையும் கவிதை இணைநிலையையும் இயல்பான தமிழில் காக்கிறது.
- source_word: בְּךָ
  choice: உம்மில்
  rationale: மகிழ்ச்சியின் மையமும் அடித்தளமும் கடவுளே என்பதை எபிரெய முன்னிடைச்சொல்லுக்கு நெருக்கமாக வெளிப்படுத்துகிறது.
- source_word: כָּל מְבַקְשֶׁיךָ
  choice: உம்மைத் தேடுகிற அனைவரும்
  rationale: கடவுளைத் தேடுவதை இவர்களின் தொடர்ந்த பண்பாகக் காட்டும் பங்கேற்பு வடிவத்தை இயல்பாக வழங்குகிறது.
- source_word: אֹהֲבֵי תְּשׁוּעָתֶךָ
  choice: உமது மீட்பை நேசிக்கிறவர்கள்
  rationale: תְּשׁוּעָה என்பதன் இச்சூழலிலுள்ள காப்பாற்றுதல்/விடுவித்தல் பொருளை பொதுவாசகருக்கு இயல்பான ‘மீட்பு’ என்ற சொல்லால் தருகிறது.
- source_word: יֹאמְרוּ תָמִיד
  choice: எப்போதும் சொல்லட்டும்
  rationale: தொடர்ந்து நிகழும் உரைத்தலையும் வேண்டுதல் நுணுக்கத்தையும் காக்கிறது.
- source_word: יִגְדַּל יְהוָה
  choice: யாவே மகத்துவமுள்ளவர் எனப் போற்றப்படுவாராக
  rationale: גדל வடிவத்தின் வேண்டுதல்/வாழ்த்துரைத் தன்மையை வெறும் ‘யாவே பெரியவர்’ என்ற கூற்றாக மாற்றாமல், அவரது மகத்துவம் வெளிப்படையாக ஏற்றுப் போற்றப்பட வேண்டும் என்ற பொருளில் வழங்குகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருப்பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் வழக்கமான ஒலிபெயர்ப்பாகத் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் உள்ள தனிப்பட்ட இறைப்பெயரைப் பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: תְּשׁוּעָה என்பதன் பொருள்
  choice: மீட்பு
  alternative: இரட்சிப்பு / விடுதலை
  rationale: எபிரெயச் சொல் குறிப்பிட்ட ஆபத்திலிருந்து விடுவிப்பதையும் விரிவான இரட்சிப்பையும் குறிக்கக்கூடும்; ‘மீட்பு’ இவ்விரு பரப்புகளையும் இயல்பாகத் திறந்துவைக்கிறது.
- issue: יִגְדַּל என்பதன் வாக்கிய வலிமை
  choice: மகத்துவமுள்ளவர் எனப் போற்றப்படுவாராக
  alternative: யாவே பெரியவர் / யாவே உயர்த்தப்படுவாராக
  rationale: இது சாதாரண அறிவிப்பு அல்ல, இறைவனின் மகத்துவம் அங்கீகரிக்கப்பட வேண்டும் என்ற வாழ்த்துரை அல்லது வேண்டுதல் என்பதைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனச் செந்தமிழுக்கு ஏற்ற, மரியாதையும் சங்கீதத்துக்குரிய கவித்துவமும் கொண்ட நடை. ‘உம்மை/உமது’ இறைவனை நோக்கிய உயர்மரியாதை ஒருமையைத் தொடர்ந்து காக்கின்றன; அரிதான அல்லது சமயப்பிரிவு சார்ந்த சொற்கள் தவிர்க்கப்பட்டுள்ளன.
