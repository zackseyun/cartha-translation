- from: உம்மைத் தேடுகிற அனைவரும் உம்மில் மகிழ்ந்து களிகூரட்டும்; உமது மீட்பை நேசிக்கிறவர்கள், “யாவே மகத்துவமுள்ளவர் எனப் போற்றப்படுவாராக!” என்று எப்போதும் சொல்லட்டும்.[a]
  to: உம்மைத் தேடுகிற அனைவரும் உம்மில் மகிழ்ந்து களிகூரட்டும்; உமது மீட்பை நேசிக்கிறவர்கள், “யாவே மகிமைப்படுவாராக!” என்று எப்போதும் சொல்லட்டும்.[a]
