    text: ‘மனமுவந்து’ என்பதற்கு ‘விருப்பங்கொண்டு’ அல்லது ‘இசைந்து’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘எனக்கு உதவ விரைவாக வருவீராக.’
    reason: lexical_alternative
lexical_decisions:
- source_word: רְצֵה
  choice: மனமுவந்தருளும்
  rationale: רצה என்பதன் கட்டளை வடிவம், யாவே தயவுடன் இசைந்து செயல்பட வேண்டும் என்ற விண்ணப்பத்தைத் தெரிவிக்கிறது. ‘மனமுவந்து’ என்பது விருப்பத்தையும் சாதகமான மனநிலையையும் இயல்பான தமிழில் காக்கிறது; ‘அருளும்’ மரியாதைமிக்க வேண்டுதல் நடையை வழங்குகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய வேதப்பெயரான יהוה-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், அதன் வழக்கமான ஒலிபெயர்ப்பாக ‘யாவே’ என்று தரப்பட்டுள்ளது.
- source_word: לְהַצִּילֵנִי
  choice: என்னை விடுவிக்க
  rationale: נצל என்பதன் ஹிஃபில் வடிவம் ஆபத்திலிருந்து மீட்பதை அல்லது விடுவிப்பதைச் சுட்டுகிறது. ‘விடுவிக்க’ என்பது சங்கீத வேண்டுதலின் சூழலில் இயல்பாகவும் பரந்த பொருளுடனும் உள்ளது.
- source_word: לְעֶזְרָתִי
  choice: எனக்கு உதவ
  rationale: சொல்லுக்கு நெருக்கமாக ‘என் உதவிக்காக/என் உதவிக்கு’ எனப் பொருள் கொள்ளலாம்; ‘எனக்கு உதவ’ என்பது அதே கருத்தைத் தெளிவான நவீன தமிழில் வழங்குகிறது.
- source_word: חוּשָׁה
  choice: விரைந்தருளும்
  rationale: חוּשָׁה என்பது ‘விரை, துரிதப்படு’ என்ற அவசரக் கட்டளை. ‘விரைந்தருளும்’ அதன் அவசரத்தையும் கடவுளை நோக்கிய மரியாதைமிக்க வேண்டுதல் நடையையும் காக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூல உரை தனிப்பட்ட இறைப்பெயரான יהוה-ஐ இருமுறை பயன்படுத்துகிறது. அதனைப் பட்டப்பெயரான ‘ஆண்டவர்’ என்று மாற்றாமல், ‘யாவே’ என ஒலிபெயர்ப்பது மூலத்தின் தன்மையைப் பாதுகாக்கிறது.
- issue: רְצֵה என்பதிலுள்ள இறைவிருப்பத்தின் நுட்பம்
  choice: மனமுவந்தருளும்
  alternative: விரும்பும்; பிரியப்படுவீராக
  rationale: இது இறைவனை ஒரு செயலைச் செய்ய கட்டாயப்படுத்தும் கூற்றல்ல; விடுவிக்க அவர் சாதகமாக மனமுவந்து இசைய வேண்டும் என்ற மன்றாட்டு. தேர்ந்த சொற்றொடர் அந்த இறையியல் பதற்றத்தைத் தீர்த்துவிடாமல் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சங்கீத மன்றாட்டுக்கேற்ற கண்ணியமான மரியாதை நடை பயன்படுத்தப்பட்டுள்ளது. ‘அருளும்’ என்பது தமிழில் கடவுளை நோக்கிய வேண்டுதலுக்குரிய இயல்பான வடிவம்; மூலத்தில் இல்லாத புதிய இறையியல் கருத்தைச் சேர்ப்பதற்காக அல்ல.
