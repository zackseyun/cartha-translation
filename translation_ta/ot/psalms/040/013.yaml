  text: Be pleased[a], O Yahweh, to deliver me; O Yahweh[b], hurry to help me.
translation:
  language: ta
  text: யாவே, என்னை விடுவிக்க மனமுவந்தருளும்[a]; யாவே, எனக்கு உதவ விரைந்தருளும்[b].
  philosophy: optimal-equivalence
  footnotes:
