source:
  edition: WLC
  text: רַבּ֤וֹת עָשִׂ֨יתָ אַתָּ֤ה יְהוָ֣ה אֱלֹהַ/י֮ נִֽפְלְאֹתֶ֥י/ךָ וּ/מַחְשְׁבֹתֶ֗י/ךָ אֵ֫לֵ֥י/נוּ אֵ֤ין עֲרֹ֬ךְ אֵלֶ֗י/ךָ אַגִּ֥ידָה וַ/אֲדַבֵּ֑רָה עָ֝צְמ֗וּ מִ/סַּפֵּֽר׀׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/005.yaml
  text: You have done many things[a], O Yahweh my God—your wonders and your plans for us; none can be compared to you. If I would declare and speak of them, they are too many to recount.
translation:
  language: ta
  text: என் தேவனாகிய யாவே, நீர் செய்த அதிசயங்களும் எங்களுக்கான உமது திட்டங்களும் ஏராளம்.[a] உம்மோடு ஒப்பிடத்தக்கது எதுவுமில்லை. அவற்றை நான் அறிவித்துப் பேசினால், அவை எண்ணிச் சொல்ல முடியாத அளவுக்கு மிகுதியானவை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எங்களை நோக்கிய உமது எண்ணங்கள்.”
    reason: מַחְשְׁבוֹתֶיךָ என்பது ‘திட்டங்கள்’ அல்லது ‘எண்ணங்கள்’ எனப் பொருள்படலாம்; אֵלֵינוּ என்பதன் திசைநிலைப் பொருளை மாற்று வாசகம் காக்கிறது.
lexical_decisions:
- source_word: רַבּוֹת עָשִׂיתָ
  choice: நீர் செய்தவை ஏராளம்
  rationale: רַבּוֹת செயற்பாட்டின் பெருக்கைக் குறிக்கிறது; தமிழில் இயல்பாக இருக்க மறைந்துள்ள செயப்படுபொருளை ‘செய்தவை’ என வெளிப்படுத்தி, எண்ணிக்கையின் மிகுதியைப் பாதுகாக்கிறது.
- source_word: יְהוָה אֱלֹהַי
  choice: என் தேவனாகிய யாவே
  rationale: தெய்வீகப் பெயரான יהוה-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல் ‘யாவே’ என ஒலிபெயர்த்து, אֱלֹהַי என்பதன் தனிப்பட்ட உரிமைத் தொடர்பையும் காக்கிறது.
- source_word: נִפְלְאֹתֶיךָ
  choice: உமது அதிசயங்கள்
  rationale: פלא வேரிலிருந்து வரும் இச்சொல் வியப்பூட்டும் தெய்வீகச் செயல்களைக் குறிக்கிறது; ‘அதிசயங்கள்’ சுருக்கமாகவும் இயல்பாகவும் அந்தப் பொருளைத் தருகிறது.
- source_word: וּמַחְשְׁבֹתֶיךָ אֵלֵינוּ
  choice: எங்களுக்காக நீர் தீட்டிய திட்டங்கள்
  rationale: מַחְשָׁבוֹת என்பது எண்ணங்கள், திட்டங்கள், நோக்கங்கள் எனப் பொருள்படலாம். சூழலில் நோக்கமுள்ள தெய்வீகச் செயல்பாட்டை ‘திட்டங்கள்’ தெளிவாகக் காட்டுகிறது; ‘எங்களுக்காக’ என்பது אֵלֵינוּ-வின் திசை/தொடர்பை இயல்பான தமிழில் தெரிவிக்கிறது. ‘எண்ணங்கள்’ என்ற நேரடியான மாற்று அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: אֵין עֲרֹךְ אֵלֶיךָ
  choice: உமக்கு நிகரானவர் எவருமில்லை
  rationale: இந்த எபிரெய மரபுத்தொடர் யாவேயின் ஒப்பற்ற தன்மையைச் சொல்கிறது; தமிழில் நேரடியாகவும் இயல்பாகவும் அதையே வெளிப்படுத்துகிறது.
- source_word: אַגִּידָה וַאֲדַבֵּרָה
  choice: அவற்றை நான் அறிவித்து எடுத்துரைக்க முயன்றால்
  rationale: இரு cohortative வடிவங்களும் அடுத்துவரும் ‘எண்ண முடியாதவை’ என்ற கூற்றுக்கு நிபந்தனைப் பின்னணியை உருவாக்குகின்றன; ‘முயன்றால்’ அந்த ஓட்டத்தை இயல்பான தமிழில் தருகிறது.
- source_word: עָצְמוּ מִסַּפֵּר
  choice: அவை எண்ணிச் சொல்ல முடியாத அளவுக்கு மிகுதியானவை
  rationale: עָצְמוּ இங்கு வலிமையை அல்ல, எண்ணிக்கையின் பெருக்கைக் குறிக்கிறது; מִסַּפֵּר உடன் சேர்ந்து எண்ணி விவரிக்க முடியாத மிகுதியைத் தெரிவிக்கிறது.
theological_decisions:
- issue: מַחְשְׁבוֹת என்பது மக்களை நோக்கிய தேவனுடைய எண்ணங்களா, திட்டங்களா
  choice: எங்களுக்காக நீர் தீட்டிய திட்டங்கள்
  alternative: எங்களைக் குறித்த உமது எண்ணங்கள்
  rationale: சூழல் தேவனுடைய நோக்கமுள்ள நன்மையை உணர்த்துகிறது; ஆனால் முன்னறிவிப்பு அல்லது பராமரிப்பு குறித்த பிற்காலக் கோட்பாட்டு அமைப்பை வசனத்துக்குள் கொண்டு வரவில்லை. மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: אֵין עֲרֹךְ אֵלֶיךָ என்பதன் ஒப்பீட்டு குறிப்பு
  choice: உமக்கு நிகரானவர் எவருமில்லை
  alternative: உம்மோடு ஒப்பிடத்தக்கது எதுவுமில்லை
  rationale: எபிரெயத்தில் ஒப்பீட்டின் பொருள் வெளிப்படையாகக் குறிப்பிடப்படவில்லை. தமிழில் தேவனை நேரடியாக அழைக்கும் சூழலுக்கு ஏற்றவாறு நபர்சார் வடிவம் பயன்படுத்தப்பட்டாலும், அடிப்படை கருத்தான அவருடைய ஒப்பற்ற தன்மை மட்டுமே கூறப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சங்கீதத்திற்கேற்ற கண்ணியமான நேரடி அழைப்பு நடை பயன்படுத்தப்பட்டுள்ளது. மரியாதைப் பன்மை வினைமுற்றுகளும் ‘உமது’ என்ற வடிவமும் தொடர்ச்சியாகக் கையாளப்பட்டுள்ளன; அரிதான பழமொழிநடை தவிர்க்கப்பட்டுள்ளது.
