  naturalness: ‘என் தேவனாகிய யாவே’ மற்றும் மரியாதைப் பன்மை நடை நவீனத் தரத் தமிழுக்கு ஏற்றவை. திருத்தப்பட்ட அமைப்பு வசனத்தின் தொடர்புகளையும் ஓட்டத்தையும் தெளிவாகவும் இயல்பாகவும் தருகிறது. ‘உம்மோடு ஒப்பிடத்தக்கது எதுவுமில்லை’ என்பது எபிரெயத்தில் வெளிப்படையாகச் சொல்லப்படாத ஒப்பிடப்படும் பொருளை ‘எவரும்’ எனக் கட்டுப்படுத்தாமல் காக்கிறது.
