  to: என் தேவனாகிய யாவே, நீர் செய்த அதிசயங்களும் எங்களுக்கான உமது திட்டங்களும் ஏராளம்.[a] உம்மோடு ஒப்பிடத்தக்கது எதுவுமில்லை. அவற்றை நான் அறிவித்துப் பேசினால், அவை எண்ணிச் சொல்ல முடியாத அளவுக்கு மிகுதியானவை.
  rationale: 'திருத்தம் எபிரெய வாக்கியத் தொடர்பைத் தெளிவாக்குகிறது: தேவன் செய்த அதிசயங்களும் மக்களை நோக்கிய அவருடைய திட்டங்கள்/எண்ணங்களும் எண்ணிலடங்காதவை. நிபந்தனைத் தன்மையும் எண்ணிக்கைக்கு அப்பாற்பட்ட தன்மையும் காக்கப்பட்டுள்ளன; மூலத்தில் குறிப்பிடப்படாத முயற்சி மற்றும் ஒப்பிடப்படும் பொருளின் நபர்சார் கட்டுப்பாடு நீக்கப்பட்டுள்ளன.'
