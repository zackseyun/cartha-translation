  text: יָ֭שֹׁמּוּ עַל עֵ֣קֶב בָּשְׁתָּ֑/ם הָ/אֹמְרִ֥ים לִ֝֗/י הֶ֘אָ֥ח הֶאָֽח־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/015.yaml
  text: Let those who say to me[a], “Aha[b], aha!” be appalled because of their shame.
translation:
  language: ta
  text: “ஆஹா! ஆஹா!” என்று என்னிடம் சொல்கிறவர்கள் தங்கள் அவமானத்தின் காரணமாகத் திகைத்துப் போகட்டும்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “திகைத்துப் போகட்டும்” என்பதற்கு “பாழடைந்து போகட்டும்,” “அதிர்ச்சியடையட்டும்” என்றும் மொழிபெயர்க்கலாம். எபிரெய வினை பாழடைதலையோ திகைப்பூட்டும் அதிர்ச்சியையோ குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லளவில், “அவர்களுடைய அவமானத்தின் குதிகாலின்மேல்/பின்தொடர்ந்து” என்று உள்ளது. இது காரணத்தையோ அதனால் வரும் விளைவையோ குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשֹׁמּוּ
  choice: திகைத்துப்போகட்டும்
  rationale: שׁמם என்பதன் Qal வடிவம் பாழடைதல் அல்லது அதிர்ச்சியால் திகைத்தல் ஆகிய பொருள் நிழல்களைக் கொண்டுள்ளது. இகழ்ந்து களிப்பவர்களுக்கு வரும் தீர்ப்பை இங்கு இயல்பான தமிழில் ‘திகைத்துப்போகட்டும்’ வெளிப்படுத்துகிறது; அழிவின் நிழலும் முற்றிலும் நீக்கப்படவில்லை.
- source_word: עַל עֵקֶב
  choice: விளைவாக
  rationale: சொல்லளவில் ‘குதிகால்/பின்தொடர்தல்’ சார்ந்த இந்த எபிரெய மரபுத்தொடர் இங்கு காரணத்தையோ விளைவையோ குறிக்கிறது. ‘விளைவாக’ என்பது வசனத்தின் தீர்ப்பு சார்ந்த தொடர் உறவைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: בָּשְׁתָּם
  choice: தங்கள் அவமானம்
  rationale: בֹּשֶׁת என்பது அவமானம், இழிவு, வெட்கக்கேடு ஆகியவற்றைக் குறிக்கிறது. ‘அவமானம்’ நேரடியான, நவீனத் தமிழுக்கு ஏற்ற தெரிவாகும்.
- source_word: הָאֹמְרִים לִי
  choice: என்னிடம் சொல்கிறவர்கள்
  rationale: உறுப்புடன் வரும் எபிரெய வினையெச்சத்தின் பெயர்ச்சொல் செயல்பாட்டை இயல்பான தமிழில் இவ்வாறு காட்டுகிறது.
- source_word: הֶאָח הֶאָח
  choice: ஆகா! ஆகா!
  rationale: தீய மகிழ்ச்சியையும் ஏளனத்தையும் வெளிப்படுத்தும் இருமுறை கூறப்பட்ட இடைச்சொல். ‘ஆகா! ஆகா!’ அதன் ஒலியையும் இகழ்ச்சித் தொனியையும் காக்கிறது.
