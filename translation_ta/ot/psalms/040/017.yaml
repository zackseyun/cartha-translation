  text: וַ/אֲנִ֤י עָנִ֣י וְ/אֶבְיוֹן֮ אֲדֹנָ֪/י יַחֲשָׁ֫ב לִ֥/י עֶזְרָתִ֣/י וּ/מְפַלְטִ֣/י אַ֑תָּה אֱ֝לֹהַ֗/י אַל תְּאַחַֽר׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/017.yaml
  text: But I am poor and needy; the Lord thinks of me. You are my help and my deliverer; my God[a], do not delay.
translation:
  language: ta
  text: ஆனால் நானோ ஏழையும் தேவையுள்ளவனுமாய் இருக்கிறேன்; ஆண்டவர் என்னை நினைவில் கொள்கிறார்.[a] நீரே எனக்குத் துணையும் என்னை விடுவிப்பவரும்; என் இறைவனே, தாமதிக்காதீர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆண்டவர் என்மீது அக்கறை கொள்கிறார்”; அல்லது, “ஆண்டவர் என்னைக் குறித்து நினைப்பார்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: ஆனால் நானோ
  rationale: சுயாதீனப் பிரதிப்பெயருடன் வரும் இணைப்புச்சொல் முந்தைய சூழலுக்கு மாறுபாட்டை வலியுறுத்துகிறது; ‘ஆனால் நானோ’ அதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: עָנִי וְאֶבְיוֹן
  choice: ஏழையும் தேவையுள்ளவனுமாய்
  rationale: 'ஒன்றோடொன்று தொடர்புடைய இரு சொற்களின் வேறுபாட்டைக் காக்கிறது: முதலாவது தாழ்ந்த அல்லது வறிய நிலையையும், இரண்டாவது உதவி தேவைப்படும் நிலையையும் குறிக்கிறது.'
- source_word: אֲדֹנָי
  choice: ஆண்டவர்
  rationale: இது יהוה என்ற திருப்பெயர் அல்ல, ஆண்டவர் என்னும் தெய்வீகப் பட்டம்; எனவே நவீனத் தமிழில் மரியாதைக்குரிய பட்டமாக மொழிபெயர்க்கப்படுகிறது.
- source_word: יַחֲשָׁב לִי
  choice: என்னை நினைவில் கொள்கிறார்
  rationale: חשב + ל என்பது ஒருவரைக் குறித்து நினைத்தல் அல்லது அவர்மீது அக்கறை கொள்ளுதல் எனப் பொருள்படலாம். ‘நினைவில் கொள்கிறார்’ தனிப்பட்ட கவனத்தை இயல்பாகத் தெரிவிக்கிறது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் காக்கப்படுகின்றன.
- source_word: עֶזְרָתִי
  choice: எனக்குத் துணை
  rationale: இச்சொல் உதவி அல்லது துணை என்பதைக் குறிக்கிறது; ‘எனக்குத் துணை’ தமிழில் இயல்பாக இருந்து கவிதைச் செறிவையும் காக்கிறது.
- source_word: וּמְפַלְטִי
  choice: என்னை விடுவிப்பவர்
  rationale: פלט வேரிலிருந்து வந்த பெயரெச்ச வடிவம் விடுவிக்கிற அல்லது மீட்கிற ஒருவரைக் குறிக்கிறது; ‘விடுவிப்பவர்’ அதன் செயற்பொருளைக் காக்கிறது.
- source_word: אַתָּה
  choice: நீரே
  rationale: எபிரெயத்தில் பிரதிப்பெயர் வெளிப்படையாக இடப்பட்டு வலியுறுத்தப்படுகிறது; மரியாதை ஒருமையுடன் ‘நீரே’ அந்த வலியுறுத்தலை வெளிப்படுத்துகிறது.
- source_word: אֱלֹהַי
  choice: என் இறைவனே
  rationale: முதலாம் நபர் உடைமைப் பின்னொட்டையும் நேரடி அழைப்பையும் இயல்பான தமிழ் விளிவடிவில் வெளிப்படுத்துகிறது.
- source_word: אַל תְּאַחַר
  choice: தாமதிக்காதீர்
  rationale: எதிர்மறைக் கட்டளை உடனடி உதவிக்கான வேண்டுதலைக் குறிக்கிறது; இத்தேர்வு அதன் அவசரத்தையும் மரியாதை ஒருமையையும் காக்கிறது.
theological_decisions:
- issue: אֲדֹנָי என்ற தெய்வீகப் பட்டத்தின் மொழிபெயர்ப்பு
  choice: ஆண்டவர்
  alternative: என் ஆண்டவர்
  rationale: மூலத்தில் இருப்பது אֲדֹנָי என்னும் பட்டமே அன்றி יהוה அல்ல. ஆகவே தனிப்பட்ட உடைமையைச் சேர்க்காமல் ‘ஆண்டவர்’ என்று மொழிபெயர்ப்பது மூலத்தைத் துல்லியமாக வேறுபடுத்துகிறது.
- issue: יַחֲשָׁב לִי என்பதன் பொருள்
  choice: ஆண்டவர் என்னை நினைவில் கொள்கிறார்
  alternative: ஆண்டவர் என்மீது அக்கறை கொள்கிறார்; ஆண்டவர் என்னைக் குறித்து நினைப்பார்
  rationale: எபிரெயச் சொற்றொடர் நினைத்தல், கருத்தில் கொள்ளுதல் அல்லது அக்கறை காட்டுதல் ஆகிய நெருங்கிய பொருள்களை ஏற்கிறது. முதன்மை உரை தனிப்பட்ட நினைவையும் கவனத்தையும் தெரிவிக்கிறது; காலம் மற்றும் பொருளின் உண்மையான நெகிழ்வு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரநிலைத் தமிழில் இயல்பான, கண்ணியமான வேண்டுதல் நடை பயன்படுத்தப்பட்டுள்ளது. கடவுளை நோக்கிய ஒருமை மரியாதை வடிவங்களான ‘நீரே’, ‘தாமதிக்காதீர்’ பயன்படுத்தப்பட்டுள்ளன; எபிரெயக் கவிதையின் சுருக்கமும் இணை அமைப்பும் இயன்றவரை காக்கப்பட்டுள்ளன.
