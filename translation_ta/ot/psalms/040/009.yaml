base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/009.yaml
  text: I have proclaimed righteousness in the great assembly[a]; behold, I have not restrained my lips; O Yahweh[b], you know.
translation:
  language: ta
  text: 'பெரும் சபையில் நான் நீதியை[a] அறிவித்தேன்;


    இதோ, என் உதடுகளை நான் அடக்கி வைக்கவில்லை;


    யாவே, நீர் அறிவீர்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நியாயத்தை” அல்லது “நேர்மையை.” எபிரெயச் சொல் தார்மீக நேர்மையையும் நீதிநியாயத்தையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשַּׂרְתִּי
  choice: அறிவித்தேன்
  rationale: பொதுவெளியில் செய்தியை எடுத்துரைக்கும் பியல் வினையின் அறிவிப்பு சார்ந்த பொருளை இயல்பான தமிழில் தருகிறது. இங்கு அதன் பொருள் ‘நீதி’ என்பதால், ‘நற்செய்தி அறிவித்தேன்’ என்று மொழிபெயர்த்து தேவையற்ற தனிப்பொருளை ஏற்றவில்லை.
- source_word: צֶדֶק
  choice: நீதி
  rationale: எபிரெயச் சொல் தார்மீக நேர்மையையும் நீதிநியாயத்தையும் குறிக்கலாம். ‘நீதி’ தமிழில் இவ்விரு நிழற்பொருள்களையும் பெருமளவு தக்கவைக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: בְּקָהָל רָב
  choice: பெரும் சபையில்
  rationale: கூடியிருக்கும் பெரிய மக்கள் கூட்டத்தின் பொது, சமூகச் சூழலைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் எபிரெய உரையாடல் இடைச்சொல்லின் வலியுறுத்தலையும் கவிதை நடையையும் காக்கிறது.
- source_word: שְׂפָתַי לֹא אֶכְלָא
  choice: என் உதடுகளை நான் அடக்கவில்லை
  rationale: ‘உதடுகள்’ என்ற மூல உருவகத்தைத் தக்கவைத்து, பேசாமல் நிறுத்திக்கொள்ளவில்லை என்ற கருத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் ஏற்ற ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: יָדָעְתָּ
  choice: நீர் அறிவீர்
  rationale: எபிரெய நிறைவுவினை இங்கு தற்போதைய அறிவை உறுதிப்படுத்தும் நேரடி அழைப்பாகச் செயல்படுகிறது; மரியாதையும் கவிதைத் தன்மையும் கொண்ட தமிழாக இது அமைகிறது.
theological_decisions:
- issue: צֶדֶק என்பதன் தார்மீக மற்றும் நீதித்துறை நிழற்பொருள்கள்
  choice: நீதி
  alternative: நியாயம்; நேர்மை
  rationale: ஒரே பொருளை மட்டும் இறுக்கமாகத் தேர்ந்தெடுக்காமல், தமிழின் ‘நீதி’ மூலம் மூலத்தின் பரந்த பொருள் நிலையைப் பாதுகாத்து, மாற்று நிழற்பொருளை அடிக்குறிப்பில் குறிப்பிடுகிறது.
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் நேரடியாக உள்ள உடன்படிக்கைப் பெயரைப் பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்த்து வழங்குகிறது; குறிப்பிட்ட சமயப்பிரிவின் தனிப்பட்ட விளக்கத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும், சங்கீதத்திற்கேற்ற கண்ணியமான கவிதை நடையிலும் அமைக்கப்பட்டது. ‘இதோ,’ ‘உதடுகள்,’ ‘நீர் அறிவீர்’ ஆகியவை மூலத்தின் வலியுறுத்தல், உருவகம், நேரடி அழைப்பு ஆகியவற்றைத் தக்கவைக்கின்றன.
