base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/002.yaml
  text: He brought me up out of the pit of tumult[a], out of the miry clay; he set my feet on a rock, making my steps secure.
translation:
  language: ta
  text: அவர் என்னைக் கொந்தளிப்பின் குழியிலிருந்து[a], சேறும் சகதியிலிருந்து மேலே தூக்கினார்; என் கால்களைக் கற்பாறையின்மேல் நிறுத்தி, என் அடிகளை உறுதிப்படுத்தினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பேரொலியின் குழியிலிருந்து” அல்லது “முழக்கத்தின் குழியிலிருந்து”; பல மொழிபெயர்ப்புகள் இதை விளக்கமளிக்கும் வகையில் “அழிவின் குழியிலிருந்து” என்று வழங்குகின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלֵנִי
  choice: என்னை மேலே தூக்கினார்
  rationale: עלה என்பதன் ஹிஃபில் வடிவம் ‘மேலே கொண்டுவருதல்/தூக்குதல்’ எனப் பொருள்படும்; குழியிலிருந்து மீட்கும் திடமான உருவகத்தைத் தமிழ் இயல்பாகப் பேணுகிறது.
- source_word: מִבּוֹר
  choice: குழியிலிருந்து
  rationale: בּוֹר என்பது குழி, நீர்த்தொட்டி அல்லது சிறைபோன்ற பள்ளத்தைக் குறிக்கலாம்; இக்கவிதைச் சூழலில் ‘குழி’ பரந்ததும் இயல்பானதும்.
- source_word: שָׁאוֹן
  choice: கொந்தளிப்பின்
  rationale: שָׁאוֹן அடிப்படையில் பேரொலி, முழக்கம், அமளி அல்லது கொந்தளிப்பைக் குறிக்கிறது. ‘அழிவு’ என்று விளக்கமளித்து விடாமல் மூலத்தின் தெளிவின்மையைப் பேணுகிறது.
- source_word: מִטִּיט הַיָּוֵן
  choice: சேறும் சகதியுமான புதைகுழியிலிருந்து
  rationale: טִיט மற்றும் יָוֵן இணைந்து ஒட்டும் சேறு, சகதி, நிலைகொள்ள முடியாத புதைசேறு ஆகியவற்றின் தீவிரப் படிமத்தை உருவாக்குகின்றன; தமிழில் இயல்பாகவும் தெளிவாகவும் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: וַיָּקֶם עַל סֶלַע רַגְלַי
  choice: என் கால்களைக் கற்பாறையின்மேல் நிறுத்தி
  rationale: קום ஹிஃபில் ‘நிற்கச் செய்தல்/நிறுத்துதல்’; סֶלַע உறுதியான பாறையைக் குறிக்கிறது. உடல் சார்ந்த மீட்பு உருவகம் அப்படியே பேணப்படுகிறது.
- source_word: כּוֹנֵן אֲשֻׁרָי
  choice: என் அடிகளை உறுதிப்படுத்தினார்
  rationale: כון போலேல் உறுதியாக்குதல் அல்லது நிலைநிறுத்துதல் என்றும் אֲשֻׁרָי ‘என் அடிகள்’ என்றும் பொருள்படும்; கால்கள்–அடிகள் என்ற கவிதை இணைவு காக்கப்படுகிறது.
theological_decisions:
- issue: மீட்பின் திடமான உருவகங்களை அறநெறி அல்லது ஆன்மிக விடுதலையாக விளக்க வேண்டுமா
  choice: குழி, சேறு, கால்கள், கற்பாறை, அடிகள் ஆகிய திடமான உருவகங்களை முதன்மை உரையில் பேணுதல்
  alternative: ‘அழிவிலிருந்து என்னை மீட்டார்’ போன்ற கருத்துவிளக்க மொழிபெயர்ப்பு
  rationale: எபிரெயக் கவிதை உருவகமுள்ளதாக இருந்தாலும் அதன் படிமங்கள் தெளிவாக உடல் சார்ந்தவை; அவற்றை ஆன்மிக அல்லது அறநெறி விளக்கமாக மாற்றுவது மூலத்தில் இல்லாத தீர்மானத்தைச் சேர்க்கும்.
- issue: שָׁאוֹן என்பதன் பொருள்
  choice: கொந்தளிப்பு
  alternative: பேரொலி / முழக்கம் / அழிவு
  rationale: சொல் ஒலி, அமளி, கொந்தளிப்பு ஆகிய பொருட்களைத் தருகிறது; சில மொழிபெயர்ப்புகளின் ‘அழிவு’ என்பது விளக்கமளிக்கும் வாசிப்பு. முதன்மை உரை அடிப்படைச் சொற்பொருளுக்கு அருகில் வைக்கப்பட்டு, மாற்றுகள் அடிக்குறிப்பில் தரப்படுகின்றன.
