source:
  edition: WLC
  text: וַ/יִּתֵּ֬ן בְּ/פִ֨/י שִׁ֥יר חָדָשׁ֮ תְּהִלָּ֪ה לֵֽ/אלֹ֫הֵ֥י/נוּ יִרְא֣וּ רַבִּ֣ים וְ/יִירָ֑אוּ וְ֝/יִבְטְח֗וּ בַּ/יהוָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/003.yaml
  text: He put a new song in my mouth[a], a song of praise to our God. Many will see and fear[c][b], and will trust in Yahweh.
translation:
  language: ta
  text: அவர் என் வாயில் ஒரு புதிய பாடலை வைத்தார்—நம் கடவுளைப் போற்றும் பாடலை. பலர் கண்டு பயபக்தி கொள்வார்கள்[a]; யாவேமீது நம்பிக்கை வைப்பார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பயப்படுவார்கள்,” “வியந்து மரியாதை கொள்வார்கள்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் பயம், பயபக்தி, வியப்பு ஆகிய பொருள்களை ஏற்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: 'எபிரெயத்தில்: “YHWH” (יהוה); இங்கு இறைவனின் தனிப்பெயர் “யாவே” என்று வழங்கப்பட்டுள்ளது.'
    reason: divine_name
lexical_decisions:
- source_word: וַיִּתֵּן בְּפִי
  choice: அவர் என் வாயில் ... வைத்தார்
  rationale: נתן என்பதன் அடிப்படைப் பொருள் ‘கொடுத்தார்’ என்றாலும், ‘என் வாயில்’ என்பதோடு வரும் இச்சொற்றொடரில் ‘வைத்தார்’ என்பது எபிரெய உருவகத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: שִׁיר חָדָשׁ
  choice: ஒரு புதிய பாடல்
  rationale: பெயரடையின் நேரடிப் பொருளையும், கடவுளின் மீட்பால் எழும் புதிதான துதியையும் தெளிவாகக் காக்கிறது.
- source_word: תְּהִלָּה לֵאלֹהֵינוּ
  choice: நம் கடவுளைப் போற்றும் பாடல்
  rationale: இது ‘புதிய பாடல்’ என்பதற்கு விளக்கமாக இணைந்து, அந்தப் பாடலின் தன்மையையும் நோக்கத்தையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: יִרְאוּ רַבִּים
  choice: பலர் அதைக் கண்டு
  rationale: இச்சூழலில் imperfect வடிவம் எதிர்கால விளைவைச் சுட்டுகிறது. தமிழில் தேவைப்படும் செயப்படுபொருளை ‘அதை’ என்று வெளிப்படுத்துவது முந்தைய இறைச்செயலும் பாடலும் பொதுவாகக் காணப்படுவதைச் சுட்டுகிறது.
- source_word: וְיִירָאוּ
  choice: பயபக்தி கொள்வார்கள்
  rationale: ירא என்பதில் பயம், மரியாதை, வியப்பு ஆகிய நிழற்பொருள்கள் உள்ளன. ‘பயபக்தி’ அவற்றின் இறையியல் பதற்றத்தைத் தமிழில் இயல்பாகத் தக்கவைக்கிறது.
- source_word: וְיִבְטְחוּ בַּיהוָה
  choice: யாவேமீது நம்பிக்கை வைப்பார்கள்
  rationale: בטח என்பது நம்புதல் அல்லது சார்ந்திருத்தலைக் குறிக்கிறது; ‘நம்பிக்கை வைப்பார்கள்’ என்பது முன் வரும் எதிர்வினைகளின் தொடரை இயல்பாகத் தருகிறது. יהוה தனிப்பெயராக ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் பொதுப்பட்டம் அல்ல, நான்கெழுத்து இறைப் பெயர் நேரடியாக உள்ளது; அதைத் தனிப்பெயராகக் காப்பது மூலத்தின் வேறுபாட்டைத் தெரிவிக்கிறது.
- issue: וְיִירָאוּ என்பதின் உணர்வுநிலை
  choice: பயபக்தி கொள்வார்கள்
  alternative: பயப்படுவார்கள் / வியப்பார்கள்
  rationale: எபிரெய வினை பயத்தையும் மரியாதை கலந்த வியப்பையும் ஏற்கக்கூடும். முதன்மை உரை இரண்டையும் ஒன்றிணைக்கும் இயல்பான தமிழைப் பயன்படுத்துகிறது; அடிக்குறிப்பு உண்மையான பொருள் விரிவைக் காட்டுகிறது.
- issue: יִרְאוּ என்பதற்குரிய காணப்படும் பொருள்
  choice: அதைக் கண்டு
  alternative: கண்டு
  rationale: மூலத்தில் வெளிப்படையான செயப்படுபொருள் இல்லை. தமிழின் இயல்புக்காக ‘அதை’ சேர்க்கப்பட்டாலும், அது குறிப்பாகப் பாடலை மட்டுமே குறிக்கிறது என்று தீர்மானிக்காமல், கடவுளின் செயலும் அதனால் எழுந்த துதியும் அடங்கிய முந்தைய நிகழ்வைச் சுட்டுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், வழிபாட்டிற்கேற்ற கண்ணியமான ஆனால் சாதாரண வாசகருக்கும் தெளிவான நடை. ‘என் வாயில்’ என்ற மூல உருவகம் காக்கப்பட்டது. ‘பயபக்தி’ என்ற சொல் பயம் மற்றும் மரியாதை கலந்த வியப்பு ஆகிய இரு நுணுக்கங்களையும் தக்கவைக்கிறது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
