review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately represents the main Hebrew clauses: God places a new song in the psalmist''s mouth; it is praise directed to the psalmist''s God; many see, respond with fear/reverence, and trust in Yahweh. However, the explicit object in “பலர் அதைக் கண்டு” is not present in Hebrew and, in Tamil, most readily identifies the object as the song alone, narrowing the source''s open reference.'
  naturalness: The register is modern, clear, and suitable for a psalm. “நம் கடவுளைப் போற்றும் பாடலை” is natural Tamil and adequately conveys the appositional “praise to our God.” Removing the supplied object after “பலர் கண்டு” preserves the Hebrew's ellipsis while remaining idiomatic in elevated Tamil.
  terminology: “யாவே” appropriately preserves יהוה as a personal divine name. “பயபக்தி கொள்வார்கள்” is a natural rendering that conveys reverential fear; the footnote appropriately retains the lexical range, including plain fear and awe.
  issues:
  - severity: low
    issue: The main text supplies “அதைக்” after “பலர் கண்டு.”
    rationale: The Hebrew יִרְאוּ has no expressed object. Its referent may encompass the preceding divine action and resulting praise, rather than the song alone. In Tamil, “அதைக்” naturally points chiefly to the immediately preceding song. Omitting it preserves the source's intended openness.
  revised_text: அவர் என் வாயில் ஒரு புதிய பாடலை வைத்தார்—நம் கடவுளைப் போற்றும் பாடலை. பலர் கண்டு பயபக்தி கொள்வார்கள்[a]; யாவேமீது நம்பிக்கை வைப்பார்கள்.[b]
