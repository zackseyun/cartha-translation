    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: நற்பேறு பெற்றவன்
  rationale: எபிரெய ஞான இலக்கிய வாழ்த்துரையின் மகிழ்ச்சி மற்றும் ஆசீர்வதிக்கப்பட்ட நல்வாழ்வு ஆகிய இரு நுண்ணுணர்வுகளையும், இயல்பான நவீனத் தமிழில் இயன்றவரை இணைக்கிறது.
- source_word: הַגֶּבֶר
  choice: மனிதன்
  rationale: மூலத்தில் உள்ள ஆண்பால் ஒருமையைப் பாதுகாக்கிறது; இச்சூழலில் அது முன்மாதிரித் தன்மையுடன் பொதுவான மனிதரைக் குறிக்கிறது.
- source_word: שָׂם
  choice: வைத்து
  rationale: ‘வைத்தல்/நிறுத்துதல்’ என்ற அடிப்படைப் பொருளைத் தக்கவைத்து, யாவேவைத் தனது நம்பிக்கையின் பொருளாக்குவதை இயல்பாகச் சொல்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பட்டத்தால் மாற்றாமல், எபிரெய நான்கெழுத்துத் திருப்பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: מִבְטַחוֹ
  choice: தன் நம்பிக்கையாக
  rationale: ஒருவர் நம்பிக்கை வைக்கும் பொருள் அல்லது ஆதாரம் என்ற பெயர்ச்சொல்லின் கருத்தைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: פָנָה אֶל
  choice: …இடமும் திரும்பாத
  rationale: ஒருவரை அல்லது ஒன்றை நாடுதல், சார்தல், கவனம் செலுத்துதல் ஆகியவற்றை உள்ளடக்கும் ‘அவர்களிடம் திரும்புதல்’ என்ற மூல உருவகத்தைப் பாதுகாக்கிறது.
- source_word: רְהָבִים
  choice: அகந்தையுள்ளவர்கள்
  rationale: இப்பன்மை வடிவமும் சூழலும் இதை ராகாப் என்ற பெயரைவிடச் செருக்குள்ள மனிதர்களைக் குறிக்கும் பொதுப்பெயராகப் புரிந்துகொள்ள ஆதரிக்கின்றன.
- source_word: שָׂטֵי כָזָב
  choice: பொய்மையை நோக்கி விலகிச் செல்கிறவர்கள்
  rationale: ‘விலகுதல்/வழுவுதல்’ என்ற செயப்பொருளையும் ‘பொய்மை’ என்ற பெயர்ச்சொல்லையும் வெளிப்படையாக வைத்திருக்கிறது; ‘விசுவாசத் துரோகிகள்’ போன்ற மிகைத் தெய்வவியல் விளக்கத்தைத் தவிர்க்கிறது.
theological_decisions:
- issue: ஞான இலக்கிய வாழ்த்துரையில் வரும் ஆண்பால் ஒருமை
  choice: மனிதன் … பெற்றவன்
  alternative: நபர் / ஒருவர்
  rationale: மூலத்தின் ஆண்பால் ஒருமை வடிவத்தைத் தக்கவைக்கிறது; அதேவேளை அடிக்குறிப்பு அதன் முன்மாதிரிப் பொதுப்பொருளை விளக்குகிறது.
- issue: יְהוָה என்ற இறைப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: ஆண்டவர் / யெகோவா
  rationale: மூலத்தில் நேரடியாக உள்ள தனிப்பட்ட இறைப்பெயரை ஒரு பட்டத்தால் மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: רְהָבִים என்பதன் அடையாளம்
  choice: அகந்தையுள்ளவர்கள்
  alternative: ராகாப் எனப்படுவோர் / செருக்குள்ளவர்கள்
  rationale: பன்மை வடிவமும் இணைத் தொடரும் பொதுப்பெயர்ப் பொருளை ஆதரிக்கின்றன; ஆயினும் பெயராகப் புரியும் வாய்ப்பு அடிக்குறிப்பில் விடப்பட்டுள்ளது.
- issue: שָׂטֵי כָזָב தொடரின் தொடர்பு
  choice: பொய்மையை நோக்கி விலகிச் செல்கிறவர்கள்
  alternative: பொய்கள் / வஞ்சகத்தை நாடுவோர்
  rationale: தொடரின் இலக்கணச் சுருக்கத்தையும் பொருள் நெகிழ்வையும் அளவுக்கு மீறித் தீர்மானிக்காமல், வழுவுதல் மற்றும் பொய்மை ஆகிய இரண்டையும் வெளிப்படுத்துகிறது.
