    reason: cultural_note
  - marker: c
    text: அல்லது, “செருக்குள்ளவர்களிடம்.” இங்குள்ள எபிரெயச் சொல் அகந்தையுள்ள அல்லது செருக்குள்ள மனிதர்களைக் குறிக்கிறது.
    reason: lexical_alternative
