  register: நவீன நிலையான தமிழில், கவிதைக்குரிய கண்ணியத்துடன் எளிதில் புரியும் சொற்கள் பயன்படுத்தப்பட்டுள்ளன. எபிரெயச் செய்யுளின் எதிர்மறை இணைப்பும் ‘திரும்புதல்’ என்ற உருவகமும் காக்கப்பட்டுள்ளன; இறுதியில் வரும் வாழ்த்துரை தமிழில் இயல்பான வலியுறுத்தலை அளிக்கிறது.
