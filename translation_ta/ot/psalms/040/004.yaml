  text: אַ֥שְֽׁרֵי הַ/גֶּ֗בֶר אֲשֶׁר שָׂ֣ם יְ֭הֹוָה מִבְטַח֑/וֹ וְֽ/לֹא פָנָ֥ה אֶל רְ֝הָבִ֗ים וְ/שָׂטֵ֥י כָזָֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/004.yaml
  text: Blessed is the man who has made Yahweh his trust[a], and has not turned to the proud[d][c][b], to those who turn aside to falsehood.
translation:
  language: ta
  text: 'யாவேவைத் தன் நம்பிக்கையாகக் கொண்டு,

    அகந்தையுள்ளவர்களிடமும்[c]

    பொய்மையை நோக்கி வழுவிச் செல்கிறவர்களிடமும்[d]

    திரும்பாத மனிதன்[b] பேறுபெற்றவன்![a]


    [a] அல்லது, “மகிழ்ச்சிக்குரியவன்.” எபிரெயச் சொல் நல்வாழ்வு, மகிழ்ச்சி, இறையருள் பெற்ற நிலை ஆகிய நுண்ணுணர்வுகளைத் தரக்கூடும்.


    [b] எபிரெய மொழியில் இங்கு ஆண்பால் ஒருமைச் சொல் உள்ளது; அது பொதுவாக ஒரு மனிதனை முன்மாதிரியாகக் குறிக்கிறது.


    [c] அல்லது, “செருக்குள்ளவர்களிடம்.” இங்குள்ள எபிரெயச் சொல் அகந்தையுள்ள அல்லது செருக்குள்ள மனிதர்களைக் குறிக்கிறது.


    [d] அல்லது, “பொய்களிடம்” அல்லது “வஞ்சகத்திடம்.” இத்தொடர், பொய்மையை நோக்கி வழுவிச் செல்கிறவர்களைக் குறிக்கிறது.'
  philosophy: optimal-equivalence
  footnotes:
