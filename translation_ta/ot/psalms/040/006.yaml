  text: זֶ֤בַח וּ/מִנְחָ֨ה לֹֽא חָפַ֗צְתָּ אָ֭זְנַיִם כָּרִ֣יתָ לִּ֑/י עוֹלָ֥ה וַ֝/חֲטָאָ֗ה לֹ֣א שָׁאָֽלְתָּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/006.yaml
  text: Sacrifice and offering you did not desire[a]; ears you have opened for me[b]; burnt offering and sin offering you did not ask for.
translation:
  language: ta
  text: 'பலியையும் காணிக்கையையும்[a] நீர் விரும்பவில்லை;

    எனக்குச் செவிகளைத் திறந்தீர்[b];

    தகனபலியையும் பாவநிவாரணப் பலியையும்

    நீர் கேட்கவில்லை.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதை இன்னும் குறிப்பாக, “தானியக் காணிக்கை” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: 'எபிரெயில் சொல்லுக்குச் சொல், “எனக்குச் செவிகளைத் தோண்டினீர்.” இது கேட்கவோ கீழ்ப்படியவோ திறனளிப்பதைக் குறிக்கும் மரபுத்தொடராக இருக்கலாம். ஒப்பிடுக: “என் செவிகளைத் திறந்தீர்.” செப்துவஜிந்தா கிரேக்க மொழிபெயர்ப்பிலும் அதைத் தொடர்ந்து எபிரெயர் 10:5-லும், “எனக்கு ஓர் உடலை ஆயத்தப்படுத்தினீர்” என்று வருகிறது.'
    reason: alternative_reading
lexical_decisions:
- source_word: זֶבַח
  choice: பலி
  rationale: வழிபாட்டுச் சூழலில் கொல்லப்பட்டு செலுத்தப்படும் பலியைக் குறிக்கும் பொதுவான, இயல்பான தமிழ்ச் சொல்.
- source_word: מִנְחָה
  choice: காணிக்கை
  rationale: கவிதை இணைப்பில் இயல்பாக அமையும் பொதுப்பொருள்; தானியக் காணிக்கை என்ற குறிப்பான வழிபாட்டுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: חָפַצְתָּ
  choice: விரும்பவில்லை
  rationale: மனவிருப்பம் அல்லது இன்பம் கொள்ளுதல் என்ற பொருளை மிகைப்படுத்தாமல், அடுத்துவரும் ‘கேட்கவில்லை’ என்பதுடன் இணையாகக் காட்டுகிறது.
- source_word: אָזְנַיִם כָּרִיתָ לִּי
  choice: எனக்குச் செவிகளைத் திறந்தீர்
  rationale: ‘செவிகளைத் தோண்டினீர்’ என்ற எபிரெய உருவகத்தின் நோக்கமான கேட்கும் திறன் அல்லது கீழ்ப்படிதலை இயல்பான தமிழில் தெரிவிக்கிறது; சொல்லுக்குச் சொல் உருவமும் கிரேக்க மாற்று வாசகமும் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: עוֹלָה
  choice: தகனபலி
  rationale: முழுவதும் எரித்துச் செலுத்தப்படும் பலிக்கான நிலையான, துல்லியமான வழிபாட்டுச் சொல்.
- source_word: חֲטָאָה
  choice: பாவநிவாரணப் பலி
  rationale: இங்கு கருத்தளவிலான ‘பாவம்’ அல்ல, பாவத்திற்காகச் செலுத்தப்படும் வழிபாட்டுப் பலியே இணைப்பால் குறிக்கப்படுகிறது.
- source_word: שָׁאָלְתָּ
  choice: கேட்கவில்லை
  rationale: எபிரெய வினையின் நேரான பொருளைப் பாதுகாக்கிறது; ‘கட்டாயப்படுத்தவில்லை’ அல்லது ‘தேவைப்படுத்தவில்லை’ என்பதைவிட குறைவான விளக்கச் சேர்க்கையுடையது.
theological_decisions:
- issue: ‘எனக்குச் செவிகளைத் தோண்டினீர்’ என்ற எபிரெய வாசகத்துக்கும் எபிரெயர் 10:5 மேற்கோளிலுள்ள ‘எனக்கு ஓர் உடலை ஆயத்தப்படுத்தினீர்’ என்ற கிரேக்க வாசகத்துக்கும் உள்ள தொடர்பு
  choice: எபிரெய உருவகத்தின் பொருளை முதன்மை உரையில் ‘எனக்குச் செவிகளைத் திறந்தீர்’ என்று வழங்கி, அதன் சொல்லுக்குச் சொல் வடிவத்தையும் கிரேக்க வாசகத்தையும் அடிக்குறிப்பில் பாதுகாத்தல்.
  alternative: ‘எனக்குச் செவிகளைத் தோண்டினீர்’ அல்லது ‘எனக்கு ஓர் உடலை ஆயத்தப்படுத்தினீர்.’
  rationale: சங்கீதத்தின் எபிரெய மூலத்திற்கு முன்னுரிமை அளிக்கப்படுகிறது; அதேவேளையில் செப்துவஜிந்தாவும் எபிரெயர் 10:5-மும் தரும் வேறுபட்ட வாசகம் மறைக்கப்படாமல், வேதவியல் இழுபறி அடிக்குறிப்பில் வெளிப்படையாக வைக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், வழிபாட்டுச் சொற்களின் துல்லியத்தையும் சங்கீதத்துக்குரிய சுருக்கமான கவிதை நடையையும் பேணும் கண்ணியமான மொழிநடை. மரியாதை ஒருமைக்காக ‘நீர்’ பயன்படுத்தப்பட்டுள்ளது.
