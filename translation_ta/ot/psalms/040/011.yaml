source:
  edition: WLC
  text: אַתָּ֤ה יְהוָ֗ה לֹא תִכְלָ֣א רַחֲמֶ֣י/ךָ מִמֶּ֑/נִּי חַסְדְּ/ךָ֥ וַ֝/אֲמִתְּ/ךָ֗ תָּמִ֥יד יִצְּרֽוּ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/011.yaml
  text: You[a], O Yahweh, will not withhold your compassion from me[b]; your steadfast love and your faithfulness will continually preserve me.
translation:
  language: ta
  text: யாவே, நீர் உமது இரக்கத்தை என்னிடமிருந்து தடுத்துவைக்க மாட்டீர்[a]; உமது மாறாத அன்பும் உமது உண்மைத்தன்மையும்[b] எப்போதும் என்னைக் காக்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவே, நீர் உமது இரக்கத்தை என்னிடமிருந்து தடுத்துவைக்காதிரும்.” வினைச்சொல்லை நம்பிக்கைக் கூற்றாக அல்லாமல் வேண்டுகோளாகவும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “உண்மை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: தேவனுடைய தனிப்பெயரை மறைக்காமல், நவீனத் தமிழில் வழக்கமான ஒலிபெயர்ப்பாகத் தருகிறது.
- source_word: תִכְלָא
  choice: விலக்கிவைக்க மாட்டீர்
  rationale: כלא என்பதன் ‘தடுத்துவைத்தல்/கொடுக்காமல் வைத்தல்’ என்ற பொருளை இச்சூழலில் இயல்பாக வெளிப்படுத்துகிறது; yiqtol வடிவை நம்பிக்கை தெரிவிக்கும் எதிர்காலக் கூற்றாக முதன்மையாக எடுத்துக்கொள்கிறது.
- source_word: רַחֲמֶיךָ
  choice: உமது இரக்கத்தை
  rationale: எபிரெயச் சொல்லின் பன்மை வடிவத்தைத் தமிழில் இயற்கைக்கு மாறான ‘இரக்கங்கள்’ என வழங்காமல், அதன் பரிவும் கருணையும் நிறைந்த கூட்டுப்பொருளை ஒருமையில் தெரிவிக்கிறது.
- source_word: חַסְדְּךָ
  choice: உமது மாறாத அன்பு
  rationale: חסד என்பதில் உள்ள உறுதியான அன்பு, கனிவு, பற்றுறுதி ஆகியவற்றை மதப்பிரிவுக்குரிய தொழில்நுட்பச் சொல்லின்றி எடுத்துரைக்கிறது.
- source_word: אֲמִתְּךָ
  choice: உமது உண்மைத்தன்மை
  rationale: חסד உடனான இணைப்பிலும் பாதுகாக்கும் செயலுடனான தொடர்பிலும், தேவனுடைய நம்பகமான பண்பை வெளிப்படுத்துகிறது; ‘உண்மை’ என்பதும் சாத்தியமான பொருளாக அடிக்குறிப்பில் வைக்கப்படுகிறது.
- source_word: תָּמִיד
  choice: எப்போதும்
  rationale: தொடர்ந்து நிகழும் பாதுகாப்பை இயல்பான நவீனத் தமிழில் குறிக்கிறது.
- source_word: יִצְּרוּנִי
  choice: என்னைக் காத்துக்கொள்ளும்
  rationale: נצר என்பதன் காத்தல், பாதுகாத்தல், பேணுதல் ஆகிய நுணுக்கங்களை கவிதைநயமுள்ள இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் நேரடியாக உள்ள உடன்படிக்கைப் பெயரை பொதுப்பட்டமாக மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: תִכְלָא என்பதை நம்பிக்கைக் கூற்றாகவா வேண்டுதலாகவா வாசிப்பது
  choice: விலக்கிவைக்க மாட்டீர்
  alternative: விலக்கிவைக்காதிரும்
  rationale: இது வடிவியல் ரீதியாக இரண்டாம் நபர் ஆண்பால் ஒருமை yiqtol ஆக இருப்பதால் நம்பிக்கைக் கூற்றை முதன்மைப்படுத்துகிறது; சங்கீத வேண்டுதல் சூழலில் வேண்டுகோள் நுணுக்கமும் சாத்தியமாதலால் அதை அடிக்குறிப்பில் காக்கிறது.
- issue: אֱמֶת என்பதன் சூழல்சார் பொருள்
  choice: உண்மைத்தன்மை
  alternative: உண்மை
  rationale: חסד உடன் இணைந்து சங்கீதக்காரனைக் காக்கும் தெய்வீகப் பண்பாக வருவதால் நம்பகத்தன்மை/உண்மைத்தன்மை பொருள் இங்கு பொருத்தமானது; அடிப்படை ‘உண்மை’ பொருளும் மறைக்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதை ஒருமையான ‘நீர்/உமது’ வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. மொழிநடை எளிமையாகவும் கண்ணியமாகவும் வைக்கப்பட்டுள்ளது; மூலத்தின் கவிதை உருவகமான—தேவனுடைய அன்பும் உண்மைத்தன்மையும் ஒருவரைக் காப்பது—அப்படியே பேணப்பட்டுள்ளது.
