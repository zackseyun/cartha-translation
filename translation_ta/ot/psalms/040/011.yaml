revisions:
- from: யாவே, நீர் உமது இரக்கத்தை என்னிடமிருந்து விலக்கிவைக்க மாட்டீர்[a]; உமது மாறாத அன்பும் உமது உண்மைத்தன்மையும்[b] எப்போதும் என்னைக் காத்துக்கொள்ளும்.
  to: யாவே, நீர் உமது இரக்கத்தை என்னிடமிருந்து தடுத்துவைக்க மாட்டீர்[a]; உமது மாறாத அன்பும் உமது உண்மைத்தன்மையும்[b] எப்போதும் என்னைக் காக்கும்.
  rationale: Only minor idiomatic refinements are made. “தடுத்துவைக்க” expresses withholding more naturally than “விலக்கிவைக்க,” and “காக்கும்” gives a concise, natural equivalent for the Hebrew verb meaning guard or preserve. The source’s grammatical and contextual ambiguity concerning the first clause remains explicitly preserved in footnote a.
