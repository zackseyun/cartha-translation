base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/007.yaml
  text: Then I said[a], “Behold, I have come[b]; in the scroll of the book it is written about me.”
translation:
  language: ta
  text: 'அப்போது நான் சொன்னேன்: “இதோ, நான் வந்திருக்கிறேன்[b]; புத்தகச் சுருளில் என்னைக் குறித்து[a] எழுதப்பட்டுள்ளது.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எனக்காக எழுதப்பட்டுள்ளது” அல்லது “எனக்கு விதிக்கப்பட்டுள்ளது.” இந்த எபிரெயச் சொற்றொடர், பேசுபவரைக் குறித்து எழுதப்பட்டதையோ அவருக்காக வகுக்கப்பட்டதையோ குறிக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: மேசியாவுடன் தொடர்புபடுத்தி எபிரெயர் 10:7-ல் மேற்கோள் காட்டப்பட்டுள்ளது.
    reason: cross_reference
lexical_decisions:
- source_word: אָז
  choice: அப்போது
  rationale: முந்தைய சூழலைத் தொடர்ந்து பேசுபவரின் பதிலை அறிமுகப்படுத்தும் கால/தொடர்ச்சி வினையடை; நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: אָמַרְתִּי
  choice: நான் சொன்னேன்
  rationale: முதல் நபர் ஒருமை நிறைவுவினையின் நேரடியான, இயல்பான தமிழ் வடிவம்; தொடர்ந்து வரும் நேர்கூற்றுக்கும் பொருந்துகிறது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: அடுத்து வருவதன்மீது கவனத்தை ஈர்க்கும் எபிரெயச் சுட்டிடைச்சொல்லின் வலியுறுத்தலை dignified, current Tamil-ல் இயல்பாகத் தருகிறது.
- source_word: בָאתִי
  choice: நான் வந்திருக்கிறேன்
  rationale: பேசுபவர் தாம் வந்து முன்னிலையாகியிருப்பதை நிகழ்கால விளைவுடன் தெரிவிக்கும் நிறைவுவினை நுட்பத்தைப் பாதுகாக்கிறது.
- source_word: בִּמְגִלַּת סֵפֶר
  choice: புத்தகச் சுருளில்
  rationale: מְגִלָּה என்பதன் ‘சுருள்’ உருவகத்தையும் סֵפֶר என்பதன் எழுதப்பட்ட நூல்/ஆவணக் கருத்தையும் சுருக்காமல் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: כָּתוּב
  choice: எழுதப்பட்டுள்ளது
  rationale: நிலைத்த செயல்பாட்டு பொருளுடைய எபிரெயச் செயப்பாட்டு எச்சத்தைத் தெளிவான தமிழ் செயப்பாட்டு வடிவில் தருகிறது.
- source_word: עָלַי
  choice: என்னைக் குறித்து
  rationale: எழுதப்பட்ட உள்ளடக்கம் பேசுபவரைப் பற்றியது என்ற நேரடியான பொருளைத் தருகிறது; ‘எனக்காக’ அல்லது ‘எனக்கு விதிக்கப்பட்டதாக’ என்ற சாத்தியத்தைக் குறிப்பில் பாதுகாக்கிறது.
theological_decisions:
- issue: எபிரெயர் 10-ல் பின்னர் மேசியாவோடு தொடர்புபடுத்தி மேற்கோள் காட்டப்படும் עָלַי என்பதன் பொருள்
  choice: என்னைக் குறித்து
  alternative: எனக்காக; எனக்கு விதிக்கப்பட்டதாக
  rationale: சங்கீதத்தின் உடனடிச் சூழலில் ‘என்னைப் பற்றி/என்னைக் குறித்து’ என்பது நேரடியான வாசிப்பு. பின்னைய கிறிஸ்துவியல் பயன்பாட்டை முதன்மை உரைக்குள் முன்கூட்டியே புகுத்தாமல், எபிரெய மொழியின் பிற சாத்தியப் பொருள்களை அடிக்குறிப்பில் வைத்துப் பொருள் இழுபறியைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும், சங்கீதத்திற்கேற்ற கண்ணியமான கவிதைநடையுடனும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘இதோ’ என்ற வலியுறுத்தலும் ‘புத்தகச் சுருள்’ என்ற மூல உருவகமும் தக்கவைக்கப்பட்டுள்ளன. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்றொடர்களுக்கு அருகில் வைக்கப்பட்டுள்ளன.
