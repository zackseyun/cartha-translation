lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: இசைத் தலைவருக்கு
  rationale: இசை நிகழ்த்துதலை மேற்பார்வையிடும் தலைவரைக் குறிக்கும் சங்கீதத் தலைப்புச் சொல்லாகப் புரிந்துகொண்டு, முன்னொட்டு לַ־ என்பதையும் இயல்பாக ‘-க்கு’ என்று மொழிபெயர்க்கிறது.
- source_word: לְדָוִד
  choice: தாவீதின்
  rationale: எபிரெய முன்னொட்டு לְ־ இங்கு இயற்றியவர், தொடர்பு, உரிமை அல்லது அர்ப்பணிப்பு ஆகியவற்றில் ஒன்றைக் குறிக்கலாம். ‘தாவீதின்’ என்பது ஆசிரியத்துவத்தை மட்டும் உறுதிப்படுத்தாமல் அந்த விரிவான தொடர்பைத் தக்கவைக்கிறது.
- source_word: מִזְמוֹר
  choice: சங்கீதம்
  rationale: இசை சார்ந்த பாடல்வகையைக் குறிக்கும் வழக்கமான எபிரெயச் சொல்; தமிழில் தெளிவாகவும் மரபாகவும் புரிந்துகொள்ளப்படும் இணைச்சொல் ‘சங்கீதம்’ ஆகும்.
theological_decisions:
- issue: தாவீதுடன் தொடர்புடைய தலைப்பின் பொருள்
  choice: לְדָוִד என்பதை ‘தாவீதின்’ என்று மொழிபெயர்த்தல்
  alternative: ‘தாவீது இயற்றியது’ அல்லது ‘தாவீதுக்காக’
  rationale: இத்தலைப்பு தாவீதே கட்டாயம் ஆசிரியர் என்று தனியாகத் தீர்மானிப்பதில்லை. ‘தாவீதின்’ என்பது மூல எபிரெயில் உள்ள ஆசிரியத்துவம், தொடர்பு அல்லது அர்ப்பணிப்பு ஆகிய சாத்தியங்களைத் திறந்தவையாக வைத்திருக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் சுருக்கமான, கண்ணியமான சங்கீதத் தலைப்பாக அமைக்கப்பட்டுள்ளது. ‘தாவீதின்’ என்பதற்குப் பின்னரே [a] குறியீடு வைக்கப்பட்டு, அதன் பொருள் குறித்த அடிக்குறிப்பு சரியான சொல்லுடன் இணைக்கப்பட்டுள்ளது.
