  text: வீணையே, யாழே, விழித்தெழுங்கள்; நான் வைகறையை எழுப்புவேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் விடியலை எழுப்புவேன்,” “நான் காலையைத் துயிலெழுப்புவேன்.” கடவுளைப் புகழ்வதற்காகப் பொழுது புலருமுன்பே எழுவதை எபிரேய மொழி உயிரோட்டமான கவித்துவ உருவகமாகச் சொல்கிறது.
