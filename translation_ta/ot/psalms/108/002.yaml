lexical_decisions:
- source_word: עוּרָה
  choice: விழித்தெழுங்கள்
  rationale: עור என்ற வேரிலிருந்து வந்த கட்டளை வடிவம்; இசைக்கருவிகளை உயிருள்ளவர்கள்போல் அழைக்கும் கவித்துவத்தை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது. எபிரெயத்தில் ஒருமை வடிவம் இருந்தாலும், இணைக்கப்பட்ட இரு கருவிகளையும் நோக்கிய தமிழ் அழைப்பில் பன்மை மரியாதையற்ற கட்டளை இயல்பாக உள்ளது.
- source_word: הַנֵּבֶל
  choice: வீணை
  rationale: பண்டைய நரம்பிசைக் கருவியைக் குறிக்கிறது. அதன் துல்லிய அமைப்பு உறுதியல்ல; பொதுவாசகருக்குப் புரியும் வகையில் ‘வீணை’ பயன்படுத்தப்படுகிறது.
- source_word: וְכִנּוֹר
  choice: யாழ்
  rationale: כִּנּוֹר என்பது நரம்பிசைக் கருவி, பொதுவாக lyre என அடையாளப்படுத்தப்படுகிறது. נֵבֶל என்பதிலிருந்து வேறுபட்ட இரண்டாவது கருவி என்பதைப் பாதுகாக்க ‘யாழ்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: אָעִירָה
  choice: நான் ... விழித்தெழச் செய்வேன்
  rationale: עור என்ற அதே வேரின் முதலாம் நபர் வடிவம். தொடக்கக் கட்டளையுடனான சொல்விளையாட்டையும், வைகறையைத் தானே எழுப்புவதாகிய கவித்துவ உருவகத்தையும் காக்கிறது.
- source_word: שָּׁחַר
  choice: வைகறை
  rationale: விடியல் அல்லது பொழுது புலரும் நேரத்தைக் குறிக்கிறது; ‘வைகறை’ கவித்துவமும் நவீன வாசகருக்குப் புரியத்தக்கதுமான தமிழ் இணைச்சொல்.
