source:
  edition: WLC
  text: נָכ֣וֹן לִבִּ֣/י אֱלֹהִ֑ים אָשִׁ֥ירָה וַ֝/אֲזַמְּרָ֗ה אַף כְּבוֹדִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/108/001.yaml
  text: My heart is steadfast[a], O God; I will sing and make music, even with my glory.
translation:
  language: ta
  text: 'என் இதயம் உறுதியாயிருக்கிறது, கடவுளே;

    நான் பாடுவேன், இசையெழுப்புவேன்;

    என் மகிமையைக்கூடக் கொண்டு[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் முழு உள்ளத்தைக்கூடக் கொண்டு.” எபிரெயத்தில் நேரடியாக “என் மகிமை” என்று உள்ளது; “கூட” என்பது அதனுடன் வரும் வலியுறுத்தும் சொல்லின் பொருள். இந்தக் கவிதைச் சொற்றொடர் பேச்சாளரின் உள்ளார்ந்த சுயத்தையோ, முழு ஆளுமையையோ, புகழ்பாடும் கருவியான நாவையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָכוֹן
  choice: உறுதியாயிருக்கிறது
  rationale: இச்சொல் நிலைநிறுத்தப்பட்ட, உறுதியான மனநிலையைக் குறிக்கிறது. புகழ்ந்து பாடுவதற்கான உள்ளார்ந்த தீர்மானத்தை இயல்பான நவீனத் தமிழில் இது வெளிப்படுத்துகிறது.
- source_word: לִבִּי
  choice: என் இதயம்
  rationale: எபிரெய மொழியில் ‘இதயம்’ என்பது உணர்ச்சிகளை மட்டுமல்லாமல் உள்ளம், மனவுறுதி, விருப்பம் ஆகியவற்றையும் குறிக்கலாம்; மூல உருவகத்தைத் தமிழிலும் தக்கவைக்கிறது.
- source_word: אֱלֹהִים
  choice: கடவுளே
  rationale: இங்கு நேரடி அழைப்பாக இருப்பதால் தமிழ் விளிவேற்றுமை வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: אָשִׁירָה
  choice: நான் பாடுவேன்
  rationale: விருப்பத்தையும் உறுதியான நோக்கத்தையும் காட்டும் cohortative வடிவத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וַאֲזַמְּרָה
  choice: இசையெழுப்புவேன்
  rationale: זמר என்ற வினை பாடுதல் அல்லது இசையுடன் புகழ்தல் என்ற பொருளைக் கொண்டது. முந்தைய ‘பாடுவேன்’ என்பதோடு கவிதை இணைநிலையைப் பேணிக்கொண்டே இசை நுணுக்கத்தையும் வெளிப்படுத்துகிறது.
- source_word: אַף
  choice: கூட
  rationale: இறுதிச் சொற்றொடரை வலியுறுத்தி, அதையும் புகழ்ச்சிச் செயலில் உள்ளடக்கும் பொருளைத் தருகிறது.
- source_word: כְּבוֹדִי
  choice: என் மகிமை
  rationale: மூலத்தில் நேரடியாக ‘என் மகிமை’ என்று உள்ளது. இது பேச்சாளரின் உள்ளார்ந்த சுயத்தையோ, முழு ஆளுமையையோ, புகழ் பாடும் நாவையோ குறிக்கக்கூடிய கவிதை உருவகம் என்பதால் அதன் தெளிவின்மை முதன்மை உரையில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: כְּבוֹדִי என்ற கவிதை உருவகத்தின் பொருள்
  choice: என் மகிமை
  alternative: என் முழு உள்ளம்; என் ஆத்துமா; என் நாவு
  rationale: எபிரெயச் சொல் பலவாறு புரிந்துகொள்ளப்படலாம். ஒரு குறிப்பிட்ட விளக்கத்தை முதன்மை உரையில் திணிக்காமல், நேரடி கவிதை உருவகம் வைக்கப்பட்டு, முக்கிய விளக்க வாய்ப்புகள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியக்கூடிய கண்ணியமான கவிதை நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் இணைநிலை அமைப்பும் כְּבוֹדִי என்பதிலுள்ள உண்மையான பொருள் தெளிவின்மையும் பாதுகாக்கப்பட்டுள்ளன.
