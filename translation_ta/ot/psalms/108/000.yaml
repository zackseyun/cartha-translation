  text: A song, a psalm of David[a].
translation:
  language: ta
  text: ஒரு பாடல், தாவீதுக்குரிய ஒரு சங்கீதம்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தாவீதால் இயற்றப்பட்ட’ அல்லது ‘தாவீதுக்காக’ என்றும் பொருள்படலாம்; எபிரெயச் சொற்றொடர் ஆசிரியத்துவம், அர்ப்பணம், உடைமை அல்லது தொடர்பைக் குறிக்கக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: שִׁיר
  choice: பாடல்
  rationale: இச்சொல் பொதுவாக ஒரு பாடலைக் குறிக்கிறது. מִזְמוֹר என்பதிலிருந்து இதை வேறுபடுத்திக் காட்டவும், குறிப்பாகத் துதிப்பாடல் என்று பொருளைக் குறுக்காமல் இருக்கவும் எளிய ‘பாடல்’ பயன்படுத்தப்பட்டது.
- source_word: מִזְמוֹר
  choice: சங்கீதம்
  rationale: சங்கீதங்களின் தலைப்புகளில் இது இசையோடு தொடர்புடைய கவிதைப் பாடல் வகையைக் குறிக்கும் வழக்குச் சொல். தமிழில் நிலைபெற்ற ‘சங்கீதம்’ அந்த வகைப்பெயரை இயல்பாகக் காக்கிறது.
- source_word: לְדָוִד
  choice: தாவீதுக்குரிய
  rationale: לְ என்ற முன்னொட்டு ஆசிரியத்துவம், அர்ப்பணம், உடைமை அல்லது தொடர்பைக் குறிக்கலாம். ‘தாவீதுக்குரிய’ என்பது ‘தாவீதால் எழுதப்பட்டது’ என்று அளவுக்கு மீறித் தீர்மானிக்காமல் அந்தத் தொடர்பைத் திறந்த நிலையில் வைக்கிறது.
theological_decisions:
- issue: தாவீதுடன் உள்ள தொடர்பின் பொருள்
  choice: ‘தாவீதுக்குரிய’ என்று தெளிவுபடுத்தாமல் மொழிபெயர்த்தல்
  alternative: ‘தாவீதால் இயற்றப்பட்டது’ அல்லது ‘தாவீதுக்காக’
  rationale: எபிரெயத் தலைப்பு ஆசிரியத்துவத்தை மட்டுமே கட்டாயமாகக் கூறுவதில்லை. ஆகவே ஆசிரியத்துவம், அர்ப்பணம், உடைமை அல்லது தொடர்பு ஆகிய சாத்தியங்களை மொழிபெயர்ப்பு முன்கூட்டியே முடிவுசெய்யவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் சுருக்கமான, கண்ணியமான சங்கீதத் தலைப்பாக அமைக்கப்பட்டது. மூலத்திலுள்ள שִׁיר மற்றும் מִזְמוֹר என்ற இரு வகைப்பெயர்களும் முறையே ‘பாடல்’, ‘சங்கீதம்’ எனத் தனித்தனியாகப் பாதுகாக்கப்பட்டுள்ளன; அடிக்குறி குறியீடு அது விளக்கும் தாவீதுத் தொடர்புக்குப் பின்னர் வைக்கப்பட்டுள்ளது.
