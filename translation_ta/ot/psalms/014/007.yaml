source:
  edition: WLC
  text: מִ֥י יִתֵּ֣ן מִ/צִּיּוֹן֮ יְשׁוּעַ֪ת יִשְׂרָ֫אֵ֥ל בְּ/שׁ֣וּב יְ֭הוָה שְׁב֣וּת עַמּ֑/וֹ יָגֵ֥ל יַ֝עֲקֹ֗ב יִשְׂמַ֥ח יִשְׂרָֽאֵל׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/014/007.yaml
  text: Oh[a], that Israel’s salvation would come from Zion! When Yahweh restores the fortunes of his people, Jacob will rejoice; Israel will be glad.
translation:
  language: ta
  text: இஸ்ரவேலின் மீட்பு சீயோனிலிருந்து வந்தால் எவ்வளவு நன்றாயிருக்கும்! யாவே தம் மக்களின் நல்வாழ்வை மீட்டளிக்கும்போது[a], யாக்கோபு களிகூருவான்; இஸ்ரவேல் மகிழ்வான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இன்னும் சொல்லுக்குச் சொல்லாக, “யாவே தம் மக்களின் சிறையிருப்பைத் திருப்பியளிக்கும்போது.” இந்த எபிரெய மரபுத்தொடர் ஒரு மக்களின் நன்னிலையை மீட்டளிப்பதையோ அவர்களுடைய துயர்நிலையை மாற்றுவதையோ அடிக்கடி குறிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: מִי יִתֵּן
  choice: வந்தால் எவ்வளவு நன்றாயிருக்கும்!
  rationale: இது சொல்லுக்குச் சொல்லாகக் கேள்விபோல் தோன்றினாலும், எபிரெய மொழியில் தீவிரமான விருப்பத்தையும் ஏக்கத்தையும் தெரிவிக்கும் மரபுத்தொடர். நவீனத் தமிழில் இயல்பாக அந்த ஏக்கத்தை வெளிப்படுத்த இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: מִצִּיּוֹן
  choice: சீயோனிலிருந்து
  rationale: מִן என்ற முன்னொட்டு மூலத்தையோ தொடக்க இடத்தையோ குறிக்கிறது; சீயோன் என்ற இடப்பெயர் வழக்கமான தமிழ் ஒலிபெயர்ப்பில் வைக்கப்பட்டது.
- source_word: יְשׁוּעַת יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மீட்பு
  rationale: இணைப்புநிலைச் சொற்றொடர் ‘இஸ்ரவேலின் மீட்பு’ என இயல்பாக அமைகிறது. இங்கு יְשׁוּעָה குறிக்கும் விடுதலை மற்றும் காப்பு ஆகிய பரந்த பொருளை ‘மீட்பு’ தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பட்டத்தைப் பதிலாக இடாமல், எபிரெய இறைப்பெயரின் பரவலாக ஏற்கப்பட்ட தமிழ் ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டது.
- source_word: בְּשׁוּב יְהוָה שְׁבוּת עַמּוֹ
  choice: யாவே தம் மக்களின் நிலையைச் சீராக்கும்போது
  rationale: שׁוּב שְׁבוּת என்பது மக்களின் துயர்நிலையை மாற்றி அவர்களை மீண்டும் நன்னிலைக்குக் கொண்டுவருவதைக் குறிக்கும் மரபுத்தொடர். தமிழில் இயல்பாகவும், சிறையிருப்பு என்ற ஒரே வரலாற்றுச் சூழலுக்குள் பொருளைக் குறுக்காமலும் இருக்க ‘நிலையைச் சீராக்கு’ என வழங்கப்பட்டது.
- source_word: יָגֵל
  choice: களிகூருவான்
  rationale: גיל தீவிரமான மகிழ்ச்சியையும் களிப்பையும் குறிக்கிறது; அடுத்த இணைவரியிலுள்ள שמח என்பதிலிருந்து வேறுபாட்டையும் கவிதை இணைநிலையையும் இது காக்கிறது.
- source_word: יַעֲקֹב
  choice: யாக்கோபு
  rationale: பெயர் வழக்கமான தமிழ் வடிவில் தரப்பட்டுள்ளது; இங்கு அது மக்களைக் கூட்டாகக் குறிக்கும் கவிதைப் பெயராகச் செயல்படுகிறது.
- source_word: יִשְׂמַח
  choice: மகிழ்வான்
  rationale: שמח என்பதன் இயல்பான பொருளைத் தருவதோடு, முந்தைய ‘களிகூருவான்’ என்பதுடன் மகிழ்ச்சியைச் சுட்டும் இணைநிலையையும் சொல் வேறுபாட்டையும் காக்கிறது.
- source_word: יִשְׂרָאֵל
  choice: இஸ்ரவேல்
  rationale: வழக்கமான தமிழ் ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டது; இங்கு ‘யாக்கோபு’ என்பதற்கு இணையாக மக்களை மொத்தமாகக் குறிக்கிறது.
theological_decisions:
- issue: שׁוּב שְׁבוּת என்ற மரபுத்தொடரின் பொருள்
  choice: தம் மக்களின் நிலையைச் சீராக்கும்போது
  alternative: தம் மக்களின் சிறையிருப்பைத் திருப்பும்போது
  rationale: சொல்லுக்குச் சொல்லான வடிவம் சிறையிருப்பைக் குறிப்பிடலாம்; ஆனால் இந்த எபிரெய மரபுத்தொடர் பொதுவாக ஒரு மக்களின் துன்பநிலையை மாற்றி நன்னிலையை மீட்டளிப்பதையும் குறிக்கும். சங்கீதம் 14 ஒரு குறிப்பிட்ட வரலாற்றுச் சிறையிருப்பை வெளிப்படையாகச் சுட்டாததால், பரந்த மரபுப்பொருள் முதன்மை உரையில் வைக்கப்பட்டு, நேரடியான மாற்று அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீன, செம்மையான, பொதுவாசகர்களுக்குப் புரியும் தமிழ்நடை பயன்படுத்தப்பட்டது. முதல் வாக்கியத்தில் எபிரெய விருப்பநிலையின் ஏக்கம் இயல்பான தமிழ் வியப்புத் தொடரால் வெளிப்படுத்தப்பட்டுள்ளது. இரண்டாம் வாக்கியத்தில் ‘களிகூருவான் / மகிழ்வான்’ என்ற இணைச்சொற்கள் எபிரெயக் கவிதையின் இணைநிலையையும் நுண்ணிய சொல்வேறுபாட்டையும் காக்கின்றன.
