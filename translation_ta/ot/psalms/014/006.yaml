source:
  edition: WLC
  text: עֲצַת עָנִ֥י תָבִ֑ישׁוּ כִּ֖י יְהוָ֣ה מַחְסֵֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/014/006.yaml
  text: You shame the counsel of the poor[a], because Yahweh is his refuge.
translation:
  language: ta
  text: ஏழையின் ஆலோசனையை நீங்கள் அவமானப்படுத்துகிறீர்கள்[a]; ஏனெனில் யாவே அவனுடைய அடைக்கலம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஏழையின் திட்டத்தை நீங்கள் அவமானத்துக்குள்ளாக்குகிறீர்கள்.’ எபிரேயத் தொடர் ‘ஏழையின் ஆலோசனை/திட்டம்’ என இருவகையிலும் புரிந்துகொள்ளப்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲצַת
  choice: ஆலோசனையை
  rationale: עֵצָה என்பதன் construct வடிவம் ஆலோசனை, திட்டம் அல்லது யோசனை எனப் பொருள்படலாம். குறிப்பாகப் பேச்சாக வழங்கப்பட்ட அறிவுரையையோ உள்ளார்ந்த திட்டத்தையோ மட்டும் குறுக்காமல், ‘ஆலோசனை’ அதன் பரந்த பொருளைத் தக்கவைக்கிறது.
- source_word: עָנִי
  choice: ஏழையின்
  rationale: עָנִי என்பது ஏழை, துன்புறுபவர் அல்லது ஒடுக்கப்பட்டவர் எனக் குறிக்கலாம். இச்சங்கீதத்தின் சமூகச் சூழலில் ‘ஏழை’ இயல்பானதும் சுருக்கமானதும் ஆகும்; அவரது பாதிப்புக்குள்ளாகும் நிலையையும் இது மறுப்பதில்லை.
- source_word: תָבִישׁוּ
  choice: நீங்கள் அவமானப்படுத்துகிறீர்கள்
  rationale: בוש வேரின் Hiphil இரண்டாம் நபர் ஆண்பால் பன்மை வடிவம் ‘வெட்கமடையச் செய்தல்/அவமானப்படுத்துதல்’ எனப் பொருள்படும். இத்தேர்வு பன்மை நேரடி அழைப்பையும் காரணமாக்கும் வினையுணர்வையும் காக்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: இங்கு כִּי காரணத்தை அறிமுகப்படுத்துகிறது. நவீன தமிழில் அதன் causal force-ஐ ‘ஏனெனில்’ தெளிவாகக் காட்டுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் இயல்பான ஒலிபெயர்ப்பாக ‘யாவே’ வழங்கப்படுகிறது.
- source_word: מַחְסֵהוּ
  choice: அவனுடைய அடைக்கலம்
  rationale: מַחְסֶה என்பது பாதுகாப்பளிக்கும் அடைக்கலம் அல்லது புகலிடம்; 3ஆம் நபர் ஆண்பால் ஒருமை பின்னொட்டு ‘அவனுடைய’ என வெளிப்படுகிறது. ‘அடைக்கலம்’ பாதுகாப்பு உருவகத்தை இயல்பாகக் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: யெகோவா
  rationale: எபிரெய மூலத்தில் தனிப்பட்ட தெய்வீகப் பெயர் நேரடியாக உள்ளது. அதை ‘ஆண்டவர்’ என்ற பட்டத்தால் மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் தன்மையைப் பாதுகாக்கிறது; தமிழில் தற்போதைய ஆய்வுசார் உச்சரிப்புக்கு ‘யாவே’ நெருக்கமானது.
translation_notes:
  register: நவீன செந்தமிழுக்கு நெருக்கமான, கண்ணியமான பொதுநடை பயன்படுத்தப்பட்டுள்ளது. இரண்டாம் நபர் பன்மையும், ஏழையைச் சுட்டும் மூன்றாம் நபர் ஆண்பால் ஒருமையும் வெளிப்படையாகக் காக்கப்பட்டுள்ளன; மூலத்தின் ‘ஆலோசனை/திட்டம்’ என்ற பொருள் விரிவை அடிக்குறிப்பு பாதுகாக்கிறது.
