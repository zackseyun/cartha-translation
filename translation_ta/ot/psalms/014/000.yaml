base_translation:
  language: en
  yaml_path: translation/ot/psalms/014/000.yaml
  text: 'For the choir director[a]. Of David.


    The fool says in his heart, “There is no God.”

    They are corrupt; they do abominable deeds[c][b].

    There is none who does good.'
translation:
  language: ta
  text: 'இசைத் தலைவருக்கு[a]. தாவீதினுடையது[b].


    மூடன் தன் உள்ளத்தில்,


    “கடவுள் இல்லை” என்று சொல்கிறான்.


    அவர்கள் சீர்கெட்டுப்போய்[c], அருவருப்பான செயல்களைச் செய்கிறார்கள்;


    நன்மை செய்கிறவன் ஒருவனும் இல்லை.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இசை இயக்குநருக்கு’ அல்லது ‘பாடகர் குழுத் தலைவருக்கு’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சங்கீதத் தலைப்பிலுள்ள ‘தாவீதினுடையது’ என்பது ‘தாவீதால் இயற்றப்பட்டது’ அல்லது ‘தாவீதுக்காக’ என்றும் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: c
    text: எபிரெயம் ‘மூடன்’ என்ற ஒருமையிலிருந்து ‘அவர்கள் சீர்கெட்டுப்போனார்கள்’ என்ற பன்மைக்கு மாறுகிறது; பிரதிநிதியான ஒருவனிலிருந்து அவன் சார்ந்த வகுப்பினருக்கு கவனம் நகர்கிறது.
    reason: source_grammar
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: இசைக்குழுத் தலைவருக்கு
  rationale: சங்கீதத் தலைப்பில் இசை நிகழ்த்துதலை மேற்பார்வையிடுபவரைக் குறிக்கும் சொல்லாகத் தெரிகிறது; அதன் துல்லியமான பதவிப்பெயர் உறுதியில்லை என்பதால் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לְדָוִד
  choice: தாவீதின் பாடல்
  rationale: தலைப்பில் உள்ள לְ என்ற முன்னொட்டு ஆசிரியர், தொடர்பு அல்லது அர்ப்பணம் ஆகிய உறவுகளைக் குறிக்கக்கூடும். இயல்பான தமிழுக்காக ‘தாவீதின் பாடல்’ என வழங்கி, பிற சாத்தியங்களை அடிக்குறிப்பில் பாதுகாக்கிறது.
- source_word: נָבָל
  choice: மூடன்
  rationale: இது வெறும் அறிவுத்திறன் குறைவைவிட ஒழுக்க மற்றும் ஆன்மீக விவேகமின்மையைக் குறிக்கிறது; ‘மூடன்’ அந்த விரிவைச் சுருக்கமாகத் தக்கவைக்கிறது.
- source_word: הִשְׁחִיתוּ
  choice: சீர்கெட்டுப்போய்
  rationale: பன்மை வினைச்சொல் ஒழுக்கச் சீரழிவைக் குறிக்கிறது. தமிழில் நிலையும் செயல்பாடும் இயல்பாக வெளிப்பட இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: הִתְעִיבוּ עֲלִילָה
  choice: அருவருப்பான செயல்களைச் செய்கிறார்கள்
  rationale: எபிரெய சொற்றொடர் அருவருக்கத்தக்க நடத்தை அல்லது செயல்களை விவரிக்கிறது. இயல்பான நவீன தமிழில் அதன் ஒழுக்க வலிமை தக்கவைக்கப்படுகிறது.
- source_word: אֵין עֹשֵׂה טוֹב
  choice: நன்மை செய்கிறவன் ஒருவனும் இல்லை
  rationale: ‘நன்மை செய்பவர் இல்லை’ என்ற முழுமையான எபிரெய மறுப்பை நேரடியாகவும் இயல்பாகவும் வழங்குகிறது.
theological_decisions:
- issue: “கடவுள் இல்லை” என்பதன் பொருள்
  choice: கூற்றை விளக்கமின்றி நேரடியாக மொழிபெயர்த்தல்
  alternative: ‘கடவுள் செயல்படுவதில்லை’ அல்லது ‘கடவுள் இல்லை என்பதுபோல்’ என்று விளக்குதல்
  rationale: אֵין אֱלֹהִים என்பது கடவுளின் இருப்பை மறுக்கும் கூற்றாகவும், நடைமுறையில் கடவுளை நிராகரிக்கும் மனநிலையாகவும் புரிந்துகொள்ளப்படலாம். மூலத்தின் சுருக்கத்தையும் பதற்றத்தையும் மொழிபெயர்ப்பு தீர்த்துவைக்கவில்லை.
- issue: ஒருமையிலிருந்து பன்மைக்கு மாறுதல்
  choice: ‘மூடன்... சொல்கிறான்’ என்பதற்குப் பின் ‘அவர்கள்... செய்கிறார்கள்’ என மாற்றத்தைப் பாதுகாத்தல்
  alternative: முழுவதையும் ஒருமையிலோ பன்மையிலோ ஒரே மாதிரியாக்குதல்
  rationale: மூல எபிரெயத்தில் பிரதிநிதியான ஒருவனிலிருந்து அவன் பிரதிநிதித்துவப்படுத்தும் கூட்டத்திற்கான திடீர் மாற்றம் உள்ளது; அதை சமப்படுத்தாமல் காக்க வேண்டும்.
translation_notes:
  register: நவீன நிலையான தமிழில், வாசிப்புக்கு எளியதாயும் சங்கீதத்திற்குரிய கண்ணியமான ஓசையுடனும் வடிவமைக்கப்பட்டது. தலைப்புக்கும் பாடல் உரைக்கும் இடையில் பத்தி இடைவெளி வைக்கப்பட்டுள்ளது; கவிதை வரிகள் மூலத்தின் சிந்தனை அலகுகளைப் பின்பற்றுகின்றன.
