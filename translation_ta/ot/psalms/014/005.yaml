  text: שָׁ֤ם פָּ֣חֲדוּ פָ֑חַד כִּֽי אֱ֝לֹהִ֗ים בְּ/ד֣וֹר צַדִּֽיק׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/014/005.yaml
  text: There they were in great dread[b][a], for God is with the generation of the righteous.
translation:
  language: ta
  text: அங்கே அவர்கள் பெரும் அச்சமடைந்தார்கள்[a]; ஏனெனில், நீதிமான்களின் தலைமுறையில் கடவுள் இருக்கிறார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “அவர்கள் அச்சத்தை அஞ்சினார்கள்”; இது பெரும் அச்சத்தை வலியுறுத்தும் சொற்றொடர்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நீதிமான்களின் தலைமுறையோடு கடவுள் இருக்கிறார்.”
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁם
  choice: அங்கே
  rationale: இடத்தையோ அந்த நிகழ்வுச் சூழலையோ சுருக்கமாகச் சுட்டும் எபிரெய வினையடை; கவிதையின் செறிவைத் தக்கவைக்கிறது.
- source_word: פָּחֲדוּ פָחַד
  choice: கடும் அச்சத்தால் நடுங்கினார்கள்
  rationale: ‘அச்சத்தை அஞ்சினார்கள்’ என்ற வினை–அதே வேர்ச்சொல் பெயர் அமைப்பு அச்சத்தின் தீவிரத்தை வலியுறுத்துகிறது. தமிழில் இயல்பாகவும் வலிமையாகவும் அதை வெளிப்படுத்த இவ்வாறு மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய அச்சத்திற்கான காரணத்தை அறிமுகப்படுத்தும் காரண இணைப்பாக உள்ளது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: இச்சூழலில் இஸ்ரவேலின் கடவுளைக் குறிக்கும் ஒருமைப் பொருளுடைய பொதுவான எபிரெய வடிவம்.
- source_word: בְּדוֹר
  choice: தலைமுறையினரிடையே
  rationale: בְ என்பது ‘இல்,’ ‘நடுவில்,’ அல்லது ‘இடையே’ என்ற நெருங்கிய பொருட்களைத் தரக்கூடும். இங்கு ஒரு மக்கள் கூட்டத்தின் மத்தியில் கடவுள் இருப்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: צַדִּיק
  choice: நீதிமான்களின்
  rationale: வடிவில் ஒருமையாக இருந்தாலும் דּוֹר உடன் சேர்ந்து நீதியுள்ள மக்களை ஒரு கூட்டு வகுப்பாகக் குறிக்கிறது; ‘நீதிமான்களின் தலைமுறையினர்’ அந்தக் கூட்டு உணர்வைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: בְּדוֹר צַדִּיק என்பதில் நீதிமான்களோடு கடவுளுக்குள்ள உறவு
  choice: நீதிமான்களின் தலைமுறையினரிடையே கடவுள் இருக்கிறார்
  alternative: நீதிமான்களின் தலைமுறையினரோடு கடவுள் இருக்கிறார்
  rationale: எபிரெய முன்னொட்டு கடவுள் அவர்களிடையே இருப்பதையும் அவர்களோடு இருப்பதையும் அனுமதிக்கிறது. முதன்மை உரை இடைப்பட்டிருப்பதை நேரடியாகக் காட்டுகிறது; அடிக்குறிப்பு ‘அவர்களோடு’ என்ற நெருங்கிய மாற்றைத் தக்கவைக்கிறது. இதற்கு மேலான கோட்பாட்டுக் கருத்து சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன, பொதுவாகப் புரியும், மதிப்புமிக்க கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் சுருக்கமும் அச்சத்தின் தீவிரமும் காக்கப்பட்டுள்ளன; בְ என்ற முன்னொட்டின் ‘இடையே/உடன்’ என்ற உண்மையான நுண்பொருள் வேறுபாடு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
