source:
  edition: WLC
  text: הֲ/לֹ֥א יָדְעוּ֮ כָּל פֹּ֪עֲלֵ֫י אָ֥וֶן אֹכְלֵ֣י עַ֭מִּ/י אָ֣כְלוּ לֶ֑חֶם יְ֝הוָ֗ה לֹ֣א קָרָֽאוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/014/004.yaml
  text: Do not all the workers of wickedness know—those who eat up my people as they eat bread[a], and do not call on Yahweh?
translation:
  language: ta
  text: அப்பம் உண்பதுபோல் என் மக்களை விழுங்கி, யாவேயை அழைக்காத தீமை செய்கிற அனைவரும் அறியவில்லையா?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்சொல்லாக, “என் மக்களை உண்கிறவர்கள்; அவர்கள் அப்பம் உண்கிறார்கள்.” கடவுளுடைய மக்களை அவர்கள் அழிப்பதை அன்றாடம் அப்பம் உண்பதுடன் ஒப்பிடும் சொல்லாட்சி இது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא יָדְעוּ
  choice: அறியவில்லையா
  rationale: הֲלֹא அறுதியான பதிலை எதிர்பார்க்கும் வினாவை அறிமுகப்படுத்துகிறது; ידע என்பதன் அடிப்படைப் பொருளான ‘அறிதல்’ இயல்பான தமிழ் வினாவாக வழங்கப்பட்டுள்ளது.
- source_word: כָּל פֹּעֲלֵי אָוֶן
  choice: தீமை செய்கிற அனைவரும்
  rationale: எல்லாரையும் உள்ளடக்கும் כָּל என்பதையும், செயலில் ஈடுபடுவோரைக் குறிக்கும் பன்மைப் பங்கேற்பு வடிவத்தையும் தெளிவாகப் பாதுகாக்கிறது; ‘தீமை’ என்பது אָוֶן என்பதன் ஒழுக்கச் சுமையை நவீன தமிழில் இயல்பாகத் தருகிறது.
- source_word: אֹכְלֵי עַמִּי
  choice: என் மக்களை விழுங்குகிறவர்கள்
  rationale: אכל என்ற உண்பதற்கான உருவகத்தை ‘விழுங்கு’ தெளிவாகவும் வலிமையாகவும் வெளிப்படுத்துகிறது; தொடர்ந்து வரும் அப்பம் பற்றிய ஒப்பீடும் இதனால் இயல்பாக அமைகிறது.
- source_word: אָכְלוּ לֶחֶם
  choice: அப்பத்தை உண்பதுபோல்
  rationale: எபிரெய உரை சொற்சொல்லாக ‘அவர்கள் அப்பம் உண்டார்கள்’ என்று அடுத்தடுத்து வைக்கிறது; இங்கு குறிக்கப்படும் ஒப்பீட்டைத் தமிழில் புரியும்படி வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எழுத்துகளாலான இறைப் பெயரை பொதுப்பட்டப் பெயராக மாற்றாமல், தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பால் வழங்குகிறது.
- source_word: לֹא קָרָאוּ
  choice: நோக்கிக் கூப்பிடாதவர்கள்
  rationale: இறைவனுடைய பெயருடன் வரும் קרא, வழிபாட்டிலோ வேண்டுதலிலோ அவரை அழைப்பதைக் குறிக்கிறது; ‘நோக்கிக் கூப்பிடு’ இந்த உறவுநிலையை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரை பொதுவான இறைப் பட்டத்தை அல்ல, தனிப்பட்ட உடன்படிக்கைப் பெயரையே பயன்படுத்துகிறது; ஆகவே பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது.
- issue: குற்றஞ்சாட்டப்படும் மக்களின் செயலை உண்பது என்ற உருவகத்தால் விவரித்தல்
  choice: ‘என் மக்களை விழுங்குகிறவர்கள்’ என்ற உருவகத்தைப் பாதுகாத்தல்
  alternative: ‘என் மக்களை ஒடுக்குகிறவர்கள்’ என்று பொருளை மட்டும் விளக்குதல்
  rationale: மூலத்தின் கடுமையான உருவகத்தையும் அப்பம் உண்பதுடனான தொடர்பையும் பாதுகாக்கிறது; ஒடுக்குதலின் குறிப்பிட்ட வடிவத்தை உரை கூறாததால் அதைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதத்துக்கேற்ற கண்ணியமான ஆனால் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. முழு வசனமும் ஒரே சொல்லாட்சிசார் வினாவாக வைக்கப்பட்டுள்ளது; மூலத்தின் குற்றச்சாட்டு வலிமையும் உருவகமும் பாதுகாக்கப்பட்டுள்ளன.
