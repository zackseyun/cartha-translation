  text: הַ/כֹּ֥ל סָר֮ יַחְדָּ֪ו נֶ֫אֱלָ֥חוּ אֵ֤ין עֹֽשֵׂה ט֑וֹב אֵ֝֗ין גַּם אֶחָֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/014/003.yaml
  text: All have turned aside; together they have become corrupt. There is none who does good[a], not even one.
translation:
  language: ta
  text: அனைவரும் விலகிப்போனார்கள்; ஒன்றாகச் சீர்கெட்டுப்போனார்கள்.[a] நன்மை செய்பவர் எவரும் இல்லை; ஒருவர் கூட இல்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒன்றாக மாசுபட்டுப்போனார்கள்” அல்லது “ஒன்றாக அருவருப்பானவர்களானார்கள்.” எபிரெய வினை கெட்டுப்போதல் அல்லது சீரழிதல் என்ற பொருளைத் தருகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּל
  choice: அனைவரும்
  rationale: குறிப்பிட்ட சூழலில் எல்லா மனிதர்களையும் உள்ளடக்கும் முழுமையான பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: סָר
  choice: விலகிப்போனார்கள்
  rationale: סור என்பதன் ‘விலகு/பாதையை விட்டு விலகு’ என்ற அடிப்படைப் பொருளைப் பாதுகாக்கிறது. எபிரெயத்தில் வினை ஒருமையில் இருந்தாலும், கூட்டுப்பொருளுடைய எழுவாய்க்கேற்ப தமிழில் பன்மை இயல்பானது.
- source_word: יַחְדָּו
  choice: ஒன்றாக
  rationale: அவர்களுடைய செயல் கூட்டாக நிகழ்ந்ததைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: נֶאֱלָחוּ
  choice: சீர்கெட்டுப்போனார்கள்
  rationale: நாசமடைந்து கெட்டுப்போதல் அல்லது மாசுபடுதல் என்ற விளைவுநிலையைத் தருகிறது; தேவையற்ற உடல்சார்ந்த ‘அசுத்தம்’ என்ற நுணுக்கத்தைச் சேர்ப்பதில்லை.
- source_word: אֵין
  choice: எவரும் இல்லை
  rationale: ஒருவரும் இருப்பதில்லை என்ற வலியுறுத்தப்பட்ட மறுப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: עֹשֵׂה טוֹב
  choice: நன்மை செய்பவர்
  rationale: தொடர்ச்சியான அல்லது பண்புசார் செயலைக் குறிக்கும் எபிரெயப் பெயரெச்ச வினையின் பொருளைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: גַּם אֶחָד
  choice: ஒருவர் கூட இல்லை
  rationale: மறுப்பின் தீவிரத்தைத் தெளிவாகக் காட்டும் இயல்பான தமிழ் வடிவம்.
theological_decisions:
- issue: மனிதச் சீர்கேட்டைப் பற்றிய கூற்றின் பரப்பு
  choice: ‘அனைவரும்,’ ‘எவரும் இல்லை,’ ‘ஒருவர் கூட இல்லை’ என்று முழுமையான குற்றச்சாட்டாக மொழிபெயர்த்தல்
  alternative: பலரைப் பற்றிய பொதுவான விளக்கமாக மென்மைப்படுத்துதல்
  rationale: மூலவசனத்தின் முழுமையான சொற்கள் கூற்றைச் சுருக்கவோ, பிற்காலக் கோட்பாட்டு வடிவமைப்பை அதில் சேர்க்கவோ இடமளிக்கவில்லை; அதன் உரைநடை மற்றும் இறையியல் அழுத்தம் அப்படியே பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிதில் புரியக்கூடியதாயும் கண்ணியமானதாயும் உள்ளது. எபிரெயக் கவிதையின் இரண்டு இணையான மறுப்புகளும், முழுமையான பரப்பும் பாதுகாக்கப்பட்டுள்ளன.
