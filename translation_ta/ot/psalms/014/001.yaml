  yaml_path: translation/ot/psalms/014/001.yaml
  text: For the choir director[a]. Of David. The fool says in his heart, “There is no God.” They are corrupt; they do abominable deeds[c][b]. There is no one who does good.
translation:
  language: ta
  text: 'இசைத் தலைவருக்கு[a]. தாவீதினுடையது[b].


    மூடன் தன் உள்ளத்தில், “கடவுள் இல்லை” என்று சொல்கிறான். அவர்கள் சீர்கெட்டுப் போயினர்; அருவருப்பான செயல்களைச் செய்தனர்[c]. நன்மை செய்பவன் ஒருவனும் இல்லை.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இசை இயக்குநருக்கு’ அல்லது ‘பாடகர் குழுத் தலைவருக்கு’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘தாவீதினுடையது’ என்பது ‘தாவீதால் இயற்றப்பட்டது’ அல்லது ‘தாவீதுக்காக’ என்றும் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: c
    text: எபிரெய உரை ஒருமையில் வரும் ‘மூடன்’ என்பதிலிருந்து பன்மையிலுள்ள ‘அவர்கள்’ என்பதற்கு மாறுகிறது; இவ்வாறு ஒரு பிரதிநிதி நபரிலிருந்து அவன் பிரதிநிதித்துவப்படுத்தும் வகுப்பினருக்கு நகர்கிறது.
    reason: source_text_feature
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: இசைத் தலைவருக்கு
  rationale: சங்கீதத் தலைப்பில் இசையை வழிநடத்தும் பொறுப்பாளரைக் குறிக்கும் சொல்லாகத் தெரிகிறது. ‘இசைத் தலைவர்’ என்பது நவீன தமிழில் இயல்பாகவும், பாடகர் குழுவை மட்டும் குறிப்பதாகச் சுருக்காமலும் உள்ளது.
- source_word: לְדָוִד
  choice: தாவீதினுடையது
  rationale: לְ என்ற முன்னொட்டு ஆசிரியத்துவம், தொடர்பு, அல்லது அர்ப்பணிப்பு ஆகியவற்றைக் குறிக்கக்கூடும். ‘தாவீதினுடையது’ அந்தத் தொடர்பைத் தேவையின்றி ஒரே பொருளாக முடிவுசெய்யாமல் விடுகிறது.
- source_word: נָבָל
  choice: மூடன்
  rationale: இச்சொல் வெறும் அறிவுத்திறன் குறைவை அல்ல, ஒழுக்க மற்றும் ஆன்மிக மதிகேட்டைக் குறிக்கிறது. ‘மூடன்’ பிரதிநிதித்துவ ஒருமையையும் வேதாகமச் சொல்லின் வலிமையையும் காக்கிறது.
- source_word: בְּלִבּוֹ
  choice: தன் உள்ளத்தில்
  rationale: எபிரெயச் சிந்தனையில் ‘இதயம்’ எண்ணம், விருப்பம், மனத்தீர்மானம் ஆகியவற்றின் அகமையைக் குறிக்கிறது. தமிழில் ‘தன் உள்ளத்தில்’ இவ்விடத்தில் இயல்பாக அந்த உட்பொருளைத் தருகிறது.
- source_word: אֵין אֱלֹהִים
  choice: கடவுள் இல்லை
  rationale: எபிரெயச் சொற்றொடரின் நேரடியான இருப்புமறுப்பைத் தெளிவாக வெளிப்படுத்துகிறது; மறைமுகமாக ‘கடவுள் பொருட்டல்ல’ அல்லது ‘நியாயத்தீர்ப்பு இல்லை’ என்று மாற்றவில்லை.
- source_word: הִשְׁחִיתוּ
  choice: அவர்கள் சீர்கெட்டுப்போனார்கள்
  rationale: வினைச்சொல் கெடுதல் அல்லது சீரழிதலைக் குறிக்கிறது. நிறைவுற்ற செயலும் அதன் விளைவான ஒழுக்க நிலையையும் இந்தத் தமிழ் வடிவம் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הִתְעִיבוּ עֲלִילָה
  choice: அருவருப்பான செயல்களைச் செய்தார்கள்
  rationale: வினைச்சொல்லின் அருவருப்பாக நடத்தல் என்ற கருத்தையும், עֲלִילָה என்பதன் செயல் அல்லது நடத்தை என்ற பொருளையும் தெளிவான தமிழில் இணைக்கிறது.
- source_word: אֵין עֹשֵׂה טוֹב
  choice: நன்மை செய்பவன் ஒருவனும் இல்லை
  rationale: நன்மை செய்பவர் எவரும் இல்லை என்ற பொதுமையான மறுப்பை எபிரெய வாக்கிய அமைப்புக்கு நெருக்கமாகவும் இயல்பான தமிழிலும் தருகிறது.
