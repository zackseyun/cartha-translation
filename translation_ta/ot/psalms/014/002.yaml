source:
  edition: WLC
  text: יְֽהוָ֗ה מִ/שָּׁמַיִם֮ הִשְׁקִ֪יף עַֽל בְּנֵי אָ֫דָ֥ם לִ֭/רְאוֹת הֲ/יֵ֣שׁ מַשְׂכִּ֑יל דֹּ֝רֵשׁ אֶת אֱלֹהִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/014/002.yaml
  text: Yahweh looks down from heaven on the children of man to see whether there is one who has insight[a], one who seeks God.
translation:
  language: ta
  text: யாவே வானத்திலிருந்து மனிதர்கள்மேல் நோக்கிப் பார்த்து, புரிந்துணர்வுள்ளவனும் கடவுளைத் தேடுகிறவனும் ஒருவனாவது இருக்கிறானா என்று காண்கிறார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைவனின் தனிப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், எபிரேய நான்கெழுத்துப் பெயரின் வழக்கமான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: מִשָּׁמַיִם
  choice: வானத்திலிருந்து
  rationale: எபிரேய வடிவம் பன்மையாக இருந்தாலும், இங்கு உயரத்திலுள்ள இறைவனின் நோக்கிடத்தைக் குறிக்கும் இயல்பான தமிழ் ஒருமைச் சொற்றொடர் பொருத்தமானது.
- source_word: הִשְׁקִיף עַל
  choice: நோக்கிப் பார்க்கிறார்
  rationale: உயர்ந்த இடத்திலிருந்து கீழே நோக்கும் காட்சியை இயல்பான தமிழில் வெளிப்படுத்துகிறது; சங்கீதத்தின் உயிரோட்டமான நிகழ்காலமும் காக்கப்படுகிறது.
- source_word: בְּנֵי אָדָם
  choice: மனிதர்களை
  rationale: சொல்லுக்கு சொல் ‘மனிதனின் மகன்கள்’ என்ற எபிரேய மரபுத்தொடர் இங்கு மனிதர்கள் அனைவரையும் பொதுவாகக் குறிக்கிறது; தமிழில் ‘மனிதர்கள்’ என்பதே இயல்பாகவும் துல்லியமாகவும் அந்தக் கூட்டுப்பொருளை வழங்குகிறது.
- source_word: לִרְאוֹת הֲיֵשׁ
  choice: ஒருவனாவது இருக்கிறானா என்று காண்கிறார்
  rationale: நோக்கிப் பார்ப்பதன் நோக்கத்தையும், யாராவது இருக்கிறார்களா என்ற ஆராய்வுத் தன்மையையும் தெளிவாகக் காக்கிறது.
- source_word: מַשְׂכִּיל
  choice: புரிந்துணர்வு உள்ளவன்
  rationale: שׂכל வேரின் அறிவார்ந்த புரிதல் அல்லது நுண்ணறிவு என்ற பொருளைக் காக்கிறது; வெறுமனே ‘ஞானி’ என்று இறையியல் பொருளை மிகைப்படுத்தவில்லை.
- source_word: דֹּרֵשׁ אֶת אֱלֹהִים
  choice: கடவுளைத் தேடுகிறவன்
  rationale: செயலில் தொடர்ந்து தேடுதல் அல்லது நாடுதல் என்ற வினையெச்சப் பொருளை நேரடியாகத் தருகிறது.
theological_decisions:
- issue: בְּנֵי אָדָם என்ற பிரதிநிதித்துவ ஆண்பால் மரபுத்தொடரின் மொழிபெயர்ப்பு
  choice: மனிதர்களை
  alternative: மனிதனின் மகன்களை
  rationale: எபிரேயத்தில் ஆண்பால் வடிவம் இருந்தாலும், இது ஆண்களை மட்டும் அல்லாமல் மனிதகுலத்தையே பொதுவாகக் குறிக்கும் நிலையான மரபுத்தொடர். தமிழில் சொற்படி வடிவம் இயல்பற்றதோடு பொருளைத் தவறாகக் குறுக்கக்கூடும்; ஆகவே பொதுப் பொருள் முதன்மை உரையில் வழங்கப்படுகிறது.
- issue: מַשְׂכִּיל என்பதன் பொருள்
  choice: புரிந்துணர்வு உள்ளவன்
  alternative: ஞானமுள்ளவன்
  rationale: மூலச்சொல் புரிதல் மற்றும் விவேகத்தைச் சுட்டுகிறது. ‘ஞானமுள்ளவன்’ சாத்தியமானாலும், அது குறிப்பிட்ட ஞானமரபுச் சார்பை அதிகமாக உணர்த்தலாம்; தேர்ந்த வடிவம் மூலத்தின் திறந்த பொருளைக் காக்கிறது.
translation_notes:
  register: நவீன செந்தமிழ் நடையில், சாதாரண வாசகருக்குப் புரியும் வகையிலும் சங்கீதத்திற்கேற்ற கண்ணியத்துடனும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘ஒருவனாவது’ என்பது எபிரேய வினாவின் ‘யாரேனும் ஒருவர் இருக்கிறாரா’ என்ற தேடல் வலிமையை இயல்பான தமிழில் எடுத்துரைக்கிறது.
