base_translation:
  language: en
  yaml_path: translation/ot/psalms/016/009.yaml
  text: Therefore my heart is glad[a], and my glory rejoices[b]; even my flesh will dwell securely.
translation:
  language: ta
  text: ஆகையால் என் இதயம் மகிழ்கிறது; என் மகிமையும்[a] களிகூருகிறது; என் மாம்சம்கூட பாதுகாப்பாகத் தங்கியிருக்கும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “என் மதிப்பு,” “என் முழு ஆளுமை.” இங்குள்ள “என் மகிமை” என்பதைத் தன்னையே குறிக்கும் மரபுத்தொடராகச் சிலர் புரிந்துகொள்கிறார்கள்; பண்டைய விளக்கவுரையாளர்கள் சிலர் இதை “நாவு” என்பதோடும் தொடர்புபடுத்தினர்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது “பாதுகாப்பில் இளைப்பாறும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: ஆகையால்
  rationale: முந்தைய வசனங்களில் ஆண்டவரின் ஆலோசனையிலும் உடனிருப்பிலும் வெளிப்பட்ட நம்பிக்கையிலிருந்து வரும் முடிவை இயல்பாகக் குறிக்கிறது.
- source_word: שָׂמַח לִבִּי
  choice: என் இதயம் மகிழ்கிறது
  rationale: எபிரெய வினை இச்சூழலில் விளைவாகத் தொடரும் தற்போதைய மகிழ்ச்சிநிலையைக் காட்டுகிறது; ‘இதயம்’ என்ற மூல உருவகமும் காக்கப்படுகிறது.
- source_word: וַיָּגֶל
  choice: களிகூருகிறது
  rationale: גיל குறிப்பிடும் மிகுந்த, வெளிப்படும் மகிழ்ச்சியைத் தெளிவாகவும் கவிதைநயத்துடனும் தெரிவிக்கிறது.
- source_word: כְּבוֹדִי
  choice: என் மகிமை
  rationale: மூலச்சொல்லின் நேரடிப் பொருளைக் காத்து, அது ‘கனம்,’ ‘முழு ஆளுமை,’ அல்லது ‘நாவு’ என்பதைக் குறிக்கும் என்ற விளக்கத் தேர்வுகளை அடிக்குறிப்பில் திறந்துவைக்கிறது.
- source_word: אַף בְּשָׂרִי
  choice: என் மாம்சம்கூட
  rationale: אַף என்பதன் வலியுறுத்தும் விரிவை ‘கூட’ தெரிவிக்கிறது; בשר என்பதன் உடல்சார் உருவகத்தையும் பிற்கால மேற்கோளுடனான தொடர்பையும் ‘மாம்சம்’ காக்கிறது.
- source_word: יִשְׁכֹּן לָבֶטַח
  choice: பாதுகாப்பாகத் தங்கியிருக்கும்
  rationale: שכן என்பதன் தங்குதல் அல்லது குடியிருத்தல் என்ற அடிப்படைப் பொருளையும் לבטח என்பதன் பாதுகாப்பு உணர்வையும் இயல்பான தமிழில் இணைக்கிறது.
theological_decisions:
- issue: புதிய ஏற்பாட்டில் கிறிஸ்துவைக் குறித்து மேற்கோள் காட்டப்படும் இவ்வசனத்தில் כְּבוֹדִי என்பதன் மொழிபெயர்ப்பு
  choice: என் மகிமை
  alternative: என் கனம்; என் முழு ஆளுமை; என் நாவு
  rationale: ‘மகிமை’ என்பது நேரடி மூலப்பொருளைக் காத்து, அப்போஸ்தலர் 2-இல் உள்ள மேற்கோளுடனான சொல்தொடர்பையும் நிலைநிறுத்துகிறது; அதேவேளை எபிரெய மரபுத்தொடரின் பொருளைத் தீர்மானித்துவிடாமல் மாற்றுப் புரிதல்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- issue: בְּשָׂרִי என்பதன் மொழிபெயர்ப்பு
  choice: என் மாம்சம்
  alternative: என் உடல்
  rationale: இங்கு பாவ இயல்பு குறிக்கப்படவில்லை; உடல்சார் தன்மையே குறிக்கப்படுகிறது. இருப்பினும் மூல உருவகத்தையும் அப்போஸ்தலர் 2-இல் உள்ள பிற்கால மேற்கோளின் தொடர்பையும் காக்க ‘மாம்சம்’ பயன்படுத்தப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகருக்குப் புரியக்கூடியதாகவும் சங்கீதத்துக்குரிய கண்ணியமான கவிதைநடையுடனும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘மகிமை,’ ‘மாம்சம்’ ஆகிய சொற்கள் மூல உருவகங்களையும் வேதாகமங்களுக்கிடையிலான தொடர்பையும் காக்கத் தேர்ந்தெடுக்கப்பட்டுள்ளன; அவற்றின் பொருள் தேவையின்றி சமயக்கோட்பாட்டு வகையில் விரிவாக்கப்படவில்லை.
