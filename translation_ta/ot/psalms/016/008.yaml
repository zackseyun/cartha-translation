source:
  edition: WLC
  text: שִׁוִּ֬יתִי יְהוָ֣ה לְ/נֶגְדִּ֣/י תָמִ֑יד כִּ֥י מִֽ֝/ימִינִ֗/י בַּל אֶמּֽוֹט־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/016/008.yaml
  text: I have set Yahweh before me continually[a]; because he is at my right hand[b], I will not be shaken.
translation:
  language: ta
  text: 'நான் எப்போதும் யாவே[a]யை என் கண்முன் வைத்திருக்கிறேன்;

    அவர் என் வலப்பக்கத்தில் இருப்பதால், நான் அசைக்கப்படமாட்டேன்[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் יהוה (YHWH) என்ற இறைப் பெயர்; இங்கு “யாவே” என்று ஒலிபெயர்க்கப்பட்டுள்ளது.
    reason: divine_name
  - marker: b
    text: அல்லது, “நான் நிலைகுலையமாட்டேன்.” எபிரெயச் சொல் தடுமாறுவதையோ உறுதியான நிலையிலிருந்து அசைக்கப்படுவதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁוִּיתִי
  choice: வைத்திருக்கிறேன்
  rationale: פיעל வடிவிலுள்ள שׁוה இங்கு திட்டமிட்டு ஒன்றை முன்னிலையில் வைப்பதைக் குறிக்கிறது. நிறைவுற்ற செயல் தொடர்ந்து நிலவும் மனநிலையாக இருப்பதைத் தமிழில் இயல்பாக வெளிப்படுத்த “வைத்திருக்கிறேன்” தேர்ந்தெடுக்கப்பட்டது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெயத் திருப்பெயரான יהוה-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், அதன் வழக்கமான தமிழ் ஒலிபெயர்ப்பாக “யாவே” வழங்கப்படுகிறது.
- source_word: לְנֶגְדִּי
  choice: என் கண்முன்
  rationale: נגד என்பதன் இடவியல் மற்றும் கவனத்தில் வைத்திருக்கும் உருவகப் பொருள் இரண்டையும் இயல்பான தமிழில் “என் கண்முன்” காக்கிறது.
- source_word: תָמִיד
  choice: எப்போதும்
  rationale: தொடர்ச்சியையும் நிலையான வழக்கத்தையும் குறிக்கும் சொல்லுக்கு நவீனத் தமிழில் தெளிவான இணை “எப்போதும்” ஆகும்.
- source_word: כִּי
  choice: இருப்பதால்
  rationale: இரண்டாம் கூற்று சங்கீதக்காரரின் உறுதிக்கான காரணத்தைத் தருவதால், காரணத் தொடர்பு “இருப்பதால்” என வெளிப்படுத்தப்படுகிறது.
- source_word: מִימִינִי
  choice: என் வலப்பக்கத்தில்
  rationale: சொல்லின் இடவியல் உருவகத்தைத் தக்கவைத்தபடி பாதுகாப்பான துணைநிற்றலையும் உணர்த்தும் இயல்பான தமிழ் வடிவம்.
- source_word: בַּל אֶמּוֹט
  choice: நான் அசைக்கப்படமாட்டேன்
  rationale: מוט தடுமாறுதல், நிலைகுலைதல் அல்லது உறுதியான நிலையிலிருந்து அசைக்கப்படுதல் ஆகியவற்றைக் குறிக்கலாம். “அசைக்கப்படமாட்டேன்” இந்த உருவகத்தையும் நம்பிக்கையையும் காக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூல வசனம் திருப்பெயரையே நேரடியாகப் பயன்படுத்துகிறது. எனவே அதை ஒரு பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்ப்பது தனிப்பட்ட இறைப் பெயரைப் பாதுகாக்கிறது.
- issue: வலப்பக்கத்தில் இருப்பதன் பொருள்
  choice: இடவியல் உருவகத்தை அப்படியே வைத்தல்
  alternative: எனக்குத் துணையாக இருக்கிறார்
  rationale: பாதுகாப்பு அல்லது ஆதரவு என்ற உட்பொருள் இருக்கக்கூடும்; ஆனால் மூலத்தின் “வலப்பக்கம்” என்ற உருவகத்தை விளக்கவுரையாக மாற்றாமல் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதத்திற்கேற்ற கண்ணியமான ஆனால் எளிதில் புரியும் நடையில் வடிவமைக்கப்பட்டது. “என் கண்முன்” மற்றும் “என் வலப்பக்கத்தில்” ஆகிய உருவகங்கள் விளக்கவுரையாக்கப்படாமல் பாதுகாக்கப்பட்டுள்ளன.
