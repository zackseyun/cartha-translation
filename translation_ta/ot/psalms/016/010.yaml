source:
  edition: WLC
  text: כִּ֤י לֹא תַעֲזֹ֣ב נַפְשִׁ֣/י לִ/שְׁא֑וֹל לֹֽא תִתֵּ֥ן חֲ֝סִידְ/ךָ֗ לִ/רְא֥וֹת שָֽׁחַת׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/016/010.yaml
  text: For you will not abandon my soul to Sheol[b][a], nor will you let your faithful one see the pit.
translation:
  language: ta
  text: 'ஏனெனில், என் உயிரை ஷியோலுக்குக் கைவிடமாட்டீர்;

    உமக்கு உண்மையுள்ளவனை[a] படுகுழியைக்[b] காணவும் விடமாட்டீர்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உமது பரிசுத்தவானை.” எபிரெயச் சொல் உண்மையுள்ளவர், பற்றுறுதியுள்ளவர், இறைப்பற்றுள்ளவர், அல்லது பரிசுத்தமானவர் என்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அழுகலை.” செப்துவஜிந்தாவிலும் புதிய ஏற்பாட்டில் மேற்கோள் காட்டப்படும் இவ்வசனத்திலும் அழுகல் அல்லது சிதைவு என்பதை வலியுறுத்தும் சொல் பயன்படுத்தப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்தில் வெளிப்பட்ட நம்பிக்கைக்கான காரணத்தை அறிமுகப்படுத்துவதால், தமிழில் இயல்பான காரண இணைப்புச் சொல் பயன்படுத்தப்பட்டது.
- source_word: תַעֲזֹב
  choice: கைவிடமாட்டீர்
  rationale: עזב என்பதன் ‘விட்டுவிடுதல், கைவிடுதல்’ என்ற பொருளையும், மரணத்தின் ஆட்சிக்கு ஒப்படைக்கப்படாதிருப்பதையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: נַפְשִׁי
  choice: என் உயிரை
  rationale: נפש இங்கு உயிர், தன்முழுமை, அல்லது ‘நான்’ என்பதைக் குறிக்கலாம். ‘உயிர்’ என்பது தேவையற்ற உடல்–ஆன்மா இருமையைத் திணிக்காமல், தமிழில் இயல்பாக அந்தப் பரந்த பொருளைத் தக்கவைக்கிறது.
- source_word: לִשְׁאוֹל
  choice: ஷியோலில்
  rationale: שְׁאוֹל என்பது ஒரு தனிப்பட்ட கல்லறையை மட்டும் அல்லாமல் இறந்தோரின் உலகைக் குறிக்கும் எபிரெயச் சொல். அதன் மூல உலகக் கருத்தைச் சுருக்கிவிடாமல் இருக்க ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டது.
- source_word: תִתֵּן
  choice: விடமாட்டீர்
  rationale: נתן என்பதற்கு அடிப்படையில் ‘கொடு’ என்று பொருள் இருந்தாலும், இங்கு வினையெச்சத்துடன் ‘அனுமதி அளி/விடு’ என்ற இயல்பான பொருளைக் கொண்டுள்ளது.
- source_word: חֲסִידְךָ
  choice: உமக்கு உண்மையுள்ளவனை
  rationale: חסיד என்பது உடன்படிக்கை சார்ந்த பற்றுறுதி, விசுவாசம், இறைப்பற்று ஆகிய பொருட்களைத் தரக்கூடும். ‘உமக்கு உண்மையுள்ளவன்’ அதன் உறவுசார் பொருளை இயல்பாகக் காட்டுகிறது; ‘உமது பரிசுத்தவான்’ என்ற மரபுவழி மாற்று அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: לִרְאוֹת
  choice: காண
  rationale: ראה என்பதன் நேரடிப் பொருளான ‘காணுதல்’ தக்கவைக்கப்பட்டுள்ளது; சூழலில் அது ‘அனுபவித்தல்’ என்பதையும் உணர்த்தலாம்.
- source_word: שָׁחַת
  choice: படுகுழி
  rationale: שחת என்பதற்கு படுகுழி, அழிவு, அழுகல் ஆகிய பொருட்கள் இருக்கலாம். ஷியோலுடன் அமைந்த கவிதை இணைப்பில் ‘படுகுழி’ நேரடியான பொருளாகும்; முக்கியமான ‘அழுகல்’ என்ற மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
theological_decisions:
- issue: புதிய ஏற்பாட்டில் இவ்வசனத்திற்குக் கொடுக்கப்படும் மேசியா சார்ந்த பயன்பாடு
  choice: எபிரெயச் சங்கீதத்தின் உடனடி சொற்பொருளின்படி முதன்மை உரையை மொழிபெயர்த்து, மேசியா சார்ந்த விளக்கத்தை அதற்குள் வெளிப்படையாகச் சேர்க்கவில்லை.
  alternative: חֲסִידְךָ என்பதை ‘உமது பரிசுத்தவான்’ என்றும், שָׁחַת என்பதை ‘அழுகல்’ என்றும் முதன்மை உரையில் மொழிபெயர்த்து, செப்துவஜிந்தா மற்றும் புதிய ஏற்பாட்டுப் பயன்பாட்டை முன்னிறுத்துதல்.
  rationale: புதிய ஏற்பாடு இவ்வசனத்தை மேசியாவுக்குப் பொருத்தினாலும், எபிரெய மூலத்தின் உண்மையான சொற்பொருள் பரப்பையும் இறையியல் இழுவிசையையும் முதன்மை உரை தக்கவைக்க வேண்டும். கிறிஸ்து சார்ந்த முக்கியமான மரபுவழி வாசிப்புகள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
translation_notes:
  register: நவீன பொதுத்தமிழில் புரியக்கூடிய, கவிதைத் தன்மையும் கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டது. இறைவனை நோக்கிய இரண்டாம் நபர் ஒருமைக்கு மரியாதை காட்டும் ‘நீர்/உமது’ வடிவங்கள் தேர்ந்தெடுக்கப்பட்டன. ‘ஷியோல்’ ஒலிபெயர்ப்பாக வைக்கப்பட்டு, அதை வெறும் தனிக்கல்லறையாகக் குறுக்காமல் மூலப் பண்பாட்டு கருத்து பாதுகாக்கப்பட்டது.
