base_translation:
  language: en
  yaml_path: translation/ot/psalms/016/004.yaml
  text: The sorrows of those who hurry after another god will multiply[a]; I will not pour out their drink offerings of blood[b], nor will I lift up their names on my lips.
translation:
  language: ta
  text: வேறொரு தெய்வத்தின் பின்னால் விரைகிறவர்களின் துயரங்கள் பெருகும்[a]; அவர்களுடைய இரத்தத்தாலான பானபலிகளை[b] நான் ஊற்றமாட்டேன்; அவர்களுடைய பெயர்களை என் உதடுகளால் உச்சரிக்கவும் மாட்டேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவர்களுடைய சிலைகள் பெருகும்’; இங்கே வரும் எபிரெயச் சொல் சில சூழல்களில் சிலைகளோடு தொடர்புபடுத்தப்படலாம். எனினும் இவ்வரியில் ‘துயரங்கள்’ என்பதே பொருளுக்கு நன்கு பொருந்துகிறது.
    reason: alternative_reading
  - marker: b
    text: அல்லது, ‘இரத்தத்துடன் கூடிய பானபலிகளை.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְבּוּ
  choice: பெருகும்
  rationale: רבה என்பதன் Qal imperfect வடிவம் அதிகரித்தல் அல்லது பெருகுதல் என்ற பொருளைத் தருகிறது; கவிதைநடையில் விளைவைக் குறிக்கும் இயல்பான எதிர்காலக் கூற்றாக மொழிபெயர்க்கப்பட்டது.
- source_word: עַצְּבוֹתָם
  choice: அவர்களின் துயரங்கள்
  rationale: இச்சொல் துயரங்கள் அல்லது வேதனைகள் எனப் பொருள்படலாம்; சில சூழல்களில் சிலைகள் என்பதோடும் தொடர்புபடுத்தப்படலாம். இங்கு வேற்று தெய்வத்தை நாடுவோருக்கு ஏற்படும் விளைவு என்ற பொருளில் ‘துயரங்கள்’ நன்கு பொருந்துகிறது.
- source_word: אַחֵר מָהָרוּ
  choice: வேறொரு தெய்வத்தை நாடி விரைகிறவர்கள்
  rationale: אַחֵר என்பது ‘வேறொன்று/வேறொருவர்’ என்றும் מָהָרוּ என்பது ‘விரைந்தார்கள்’ என்றும் பொருள் தருகின்றன. பலிகளும் பெயர்களும் வரும் வழிபாட்டுச் சூழலால் மறைந்துள்ள குறிப்பு ‘தெய்வம்’ எனத் தெளிவாக்கப்பட்டது; ‘நாடி விரைகிறவர்கள்’ ஆர்வமிக்க பின்தொடர்தலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: בַּל אַסִּיךְ
  choice: நான் ஊற்றமாட்டேன்
  rationale: בַּל கவிதைநடை மறுப்புச் சொல்; נסך என்பதன் Hiphil வடிவம் பானபலியை ஊற்றுவதைக் குறிக்கிறது. பலியிடும் செயலின் உருவகத்தை நேரடியாகத் தக்கவைக்கிறது.
- source_word: נִסְכֵּיהֶם
  choice: அவர்களுடைய பானபலிகள்
  rationale: வழிபாட்டில் ஊற்றப்படும் திரவப் பலியைக் குறிக்கும் தொழில்நுட்பச் சொல்; ‘பானபலி’ நவீன தமிழ் வேதாகம நடையில் தெளிவானதும் சுருக்கமானதும் ஆகும்.
- source_word: מִדָּם
  choice: இரத்தப்
  rationale: מן இங்கு பொருள் அல்லது மூலப்பொருளைக் குறிக்கலாம். ‘இரத்தப் பானபலிகள்’ என்பது இரத்தத்தாலான பலிகள் என்ற அதிர்ச்சியூட்டும் மூலப்படிமத்தைச் சுருக்கமாகத் தக்கவைக்கிறது.
- source_word: אֶשָּׂא אֶת שְׁמוֹתָם עַל שְׂפָתָי
  choice: அவர்களுடைய பெயர்களை என் உதடுகளில் ஏந்தவும் மாட்டேன்
  rationale: נשא என்பதன் அடிப்படை ‘தூக்குதல்/ஏந்துதல்’ படிமத்தையும் ‘உதடுகளில்’ என்ற எபிரெய மொழியுருவையும் தக்கவைக்கிறது; சூழலில் அவற்றின் பெயர்களை உச்சரிக்கமாட்டேன் என்ற பொருள் புரியக்கூடியதாக உள்ளது.
theological_decisions:
- issue: אַחֵר என்பதற்குப் பின் மறைந்துள்ள பொருள்
  choice: வேறொரு தெய்வம்
  alternative: வேறொன்று / வேறொருவர்
  rationale: பானபலிகளும் பெயர்களைக் கூற மறுப்பதும் விக்கிரக வழிபாட்டுச் சூழலைச் சுட்டுவதால் ‘தெய்வம்’ என்பது இயல்பாக மறைந்துள்ள பொருள். இதை வெளிப்படுத்துவது புதிய கோட்பாட்டைச் சேர்க்காமல் குறிப்பைத் தெளிவாக்குகிறது.
- issue: עַצְּבוֹתָם என்பதன் பொருள்
  choice: துயரங்கள்
  alternative: சிலைகள் / விக்கிரகங்கள்
  rationale: வேற்று தெய்வத்தை ஆர்வமாக நாடுவோரின் துயரங்கள் பெருகும் என்ற விளைவுக் கூற்று இவ்வாக்கிய அமைப்பில் இயல்பாகப் பொருந்துகிறது. எனினும் சிலை சார்ந்த மாற்றுப் பொருள் உண்மையான சொற்பொருள் சாத்தியமாக இருப்பதால் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: שְׁמוֹתָם குறிக்கும் நபர்கள் அல்லது பொருட்கள்
  choice: தெளிவுபடுத்தாமல் ‘அவர்களுடைய பெயர்கள்’ என வைத்தல்
  alternative: வேற்று தெய்வங்களின் பெயர்கள் / அவற்றை வழிபடுவோரின் பெயர்கள்
  rationale: பன்மைச் சுட்டுப்பெயர் வேற்று தெய்வங்களையோ அவற்றின் வழிபாட்டுடன் தொடர்புடையவர்களையோ குறிக்கக்கூடும். மூலத்தின் தெளிவின்மையைத் தீர்மானிக்காமல் தமிழிலும் தக்கவைக்கப்பட்டது.
translation_notes:
  register: நவீன தரத் தமிழில் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டது. ‘பானபலி’, ‘உதடுகளில் ஏந்துதல்’ ஆகியவை மூலத்தின் வழிபாட்டு மற்றும் உடலுறுப்பு படிமங்களைத் தக்கவைக்கின்றன; அரிதான சொற்களும் கடுமையான பழந்தமிழ் அமைப்புகளும் தவிர்க்கப்பட்டன.
