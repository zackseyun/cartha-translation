  text: יְֽהוָ֗ה מְנָת חֶלְקִ֥/י וְ/כוֹסִ֑/י אַ֝תָּ֗ה תּוֹמִ֥יךְ גּוֹרָלִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/016/005.yaml
  text: Yahweh is the portion of my inheritance and my cup[a]; you uphold my lot.
translation:
  language: ta
  text: யாவே என் சுதந்தரப் பங்கின் பங்கும் என் கிண்ணமும்[a]; நீரே என் ஒதுக்கப்பட்ட பங்கைத் தாங்குகிறீர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவே என் பங்கும் என் கிண்ணமும்.” எபிரெயத்தில் ‘பங்கு,’ ‘சுதந்தரப் பங்கு,’ ‘ஒதுக்கப்பட்ட பங்கு’ என்ற தொடர்புடைய உருவகங்கள் அடுத்தடுத்து வருகின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டமாக மாற்றாமல், தமிழில் அதன் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: מְנָת חֶלְקִי
  choice: என் பங்காகிய உரிமைச்சொத்து
  rationale: מְנָת என்ற ஒதுக்கப்பட்ட பங்கின் கருத்தையும் חֶלְקִי என்ற உரிமைப் பங்கு/சுதந்தரக் கருத்தையும் இயல்பான தமிழில் இணைத்துப் பாதுகாக்கிறது.
- source_word: וְכוֹסִי
  choice: என் கிண்ணமும்
  rationale: ஒருவருக்கு அளிக்கப்பட்ட அனுபவம் அல்லது நிலையைச் சுட்டும் கவித்துவ உருவகத்தை விளக்கிப் பெயர்க்காமல் அப்படியே வைத்திருக்கிறது.
- source_word: אַתָּה
  choice: நீரே
  rationale: எபிரெய உரையில் வெளிப்படையாக வரும் வலியுறுத்தப்பட்ட இரண்டாம் நபர் சுட்டுப்பெயரை மரியாதையும் வலியுறுத்தலும் கொண்ட தமிழில் வெளிப்படுத்துகிறது.
- source_word: תּוֹמִיךְ גּוֹרָלִי
  choice: என் பங்கை உறுதிப்படுத்துகிறவர்
  rationale: வினைச்சொல்லின் தாங்குதல்/நிலைநிறுத்துதல் பொருளையும் גּוֹרָלִי என்பதன் ஒதுக்கீட்டுப் பங்கு கருத்தையும் தெளிவான தமிழில் தருகிறது; 'சீட்டு' என்ற கருவிப் பொருளால் கவனம் சிதறுவதைத் தவிர்க்கிறது.
theological_decisions:
- issue: யாவே தாமே சங்கீதக்காரரின் ஒதுக்கப்பட்ட உரிமைப் பங்காக இருப்பது
  choice: “என் பங்காகிய உரிமைச்சொத்து ... என் பங்கு” என்று ஒதுக்கீடு மற்றும் உரிமைச்சொத்து உருவகங்கள் இரண்டையும் வைத்திருக்கிறது.
  alternative: “என் பங்கும் என் கிண்ணமும்” அல்லது “என் சுதந்தர பாகமும் என் பாத்திரமும்”
  rationale: மூலத்தில் நெருக்கமாக வரும் מְנָת, חֵלֶק, גּוֹרָל ஆகிய ஒதுக்கீட்டுச் சொற்களை ஒரே கருத்தாகச் சுருக்காமல், யாவே தாமே சங்கீதக்காரரின் உரிமைப் பங்காகவும் அதை உறுதிப்படுத்துபவராகவும் இருப்பதிலுள்ள கவித்துவ-இறையியல் அழுத்தத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; கவித்துவமானதாயினும் பொதுவாசகருக்குப் புரியும் கண்ணியமான நடை. இறைவனை நோக்கும் ஒருமை மரியாதை வடிவமாக “நீரே” பயன்படுத்தப்பட்டுள்ளது.
