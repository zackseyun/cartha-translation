  yaml_path: translation/ot/psalms/016/002.yaml
  text: I said to Yahweh[a], “You are my Lord; I have no good apart from you.”
translation:
  language: ta
  text: 'நான் யாவேயிடம் சொன்னேன்: “நீரே என் ஆண்டவர்; உம்மைத் தவிர எனக்கு நன்மை இல்லை.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொற்சொல்லாக, “என் நன்மை உமக்கு அப்பால் இல்லை.” அதாவது, என் நன்மை உம்மைத் தவிர இல்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַרְתְּ
  choice: நான் சொன்னேன்
  rationale: மசோரா உயிர்க்குறியீட்டின்படி வடிவம் இரண்டாம் நபர் பெண்பால் ஒருமையாக இருந்தாலும், சூழலில் சங்கீதக்காரரே முதலாம் நபரில் யாவேவை நோக்கிப் பேசுகிறார். பண்டைய மொழிபெயர்ப்புகளும் இவ்வாறு புரிந்துகொள்கின்றன; தமிழில் எழுவாயை வெளிப்படையாகத் தருவது இயல்பு.
- source_word: לַיהוָה
  choice: யாவேவிடம்
  rationale: לְ முன்னொட்டு உரையின் முகவரியைக் குறிக்கிறது. יהוה என்ற உடன்படிக்கைப் பெயர் தமிழில் இயல்பாக ‘யாவே’ என ஒலிபெயர்க்கப்பட்டது.
- source_word: אֲדֹנָי
  choice: என் ஆண்டவர்
  rationale: முதலாம் நபர் ஒருமை உடைமைப் பின்னொட்டுடன் இச்சொல் ‘என் ஆண்டவர்’ என்று பொருள்படும்; நேரடியான மன்றாட்டின் மரியாதையையும் இது காக்கிறது.
- source_word: אָתָּה
  choice: நீரே
  rationale: தனித்துநிற்கும் இரண்டாம் நபர் சுட்டுப்பெயர் வலியுறுத்தலைக் கொண்டுள்ளது. ‘நீரே’ என்பது அந்த வலியுறுத்தலையும் இறைவனை நோக்கிய மரியாதையான ஒருமையையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: טוֹבָתִי
  choice: எனக்கு நன்மை
  rationale: இச்சொல் நன்மை, நலன், பயன் ஆகிய பரந்த பொருள்களைக் கொள்ளலாம். ‘எனக்கு நன்மை’ என்பது அறநெறிசார் ‘என் நல்லொழுக்கம்’ என்ற தவறான புரிதலைத் தவிர்த்து, சூழலின் பரந்த பொருளைத் தருகிறது.
- source_word: בַּל עָלֶיךָ
  choice: உம்மைத் தவிர ... இல்லை
  rationale: சொற்சொல்லாக இத்தொடர் ‘என் நன்மை உமக்கு அப்பால் இல்லை’ எனப் புரியக்கூடிய சுருக்கமான கவிதை மொழி. முதன்மை உரையில் அதன் இயல்பான தமிழ்ப் பொருள் தரப்பட்டு, சொற்சொல் நுணுக்கம் அடிக்குறிப்பில் காக்கப்படுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: எபிரெய உரையில் உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது. அதை பொதுப்பட்டமாக மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்ப்பது பெயரின் தனித்தன்மையைப் பாதுகாக்கிறது.
- issue: இறுதிக் கூற்றின் பொருள்
  choice: உம்மைத் தவிர எனக்கு நன்மை இல்லை
  alternative: என் நன்மை உமக்கு அப்பால் இல்லை
  rationale: எபிரெயக் கூற்று சுருக்கமானதும் பல நுணுக்கங்களுக்கு இடமளிப்பதும் ஆகும். முதன்மை மொழியாக்கம் சங்கீதக்காரரின் நன்மை யாவேவுக்கு வெளியே இல்லை என்ற சார்பை இயல்பான தமிழில் தெரிவிக்கிறது; முறையான மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டு மூலத்தின் தெளிவின்மை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், ஜெபத்திற்குரிய கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டது. இறைவனை நோக்கி ‘நீர்/உம்’ மரியாதை ஒருமை பயன்படுத்தப்பட்டுள்ளது; எபிரெயத்தின் கவிதைச் சுருக்கம் வாசிக்க இயல்பான தமிழில் தரப்பட்டு, மாற்று முறையான வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
