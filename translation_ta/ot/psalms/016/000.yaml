  yaml_path: translation/ot/psalms/016/000.yaml
  text: A miktam of David. Preserve me[a], God, for I take refuge in you.
translation:
  language: ta
  text: 'தாவீதின் மிக்தாம்[a].

    கடவுளே, என்னைக் காத்தருளும்;

    ஏனெனில், உம்மிடம் அடைக்கலம் புகுந்திருக்கிறேன்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மிக்தாம்” என்பது பொருள் உறுதியாகத் தெரியாத ஒரு சங்கீதத் தலைப்பு; இது ஒரு வகைப் பாடலைக் குறிக்கலாம். சிலர் இதை “சங்கீதம்” அல்லது “பொற்பாடல்” என்று மொழிபெயர்க்கின்றனர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכְתָּם
  choice: மிக்தாம்
  rationale: பொருள் உறுதியாகத் தெரியாத சங்கீதத் தலைப்புச் சொல்லை ஊகித்து மொழிபெயர்க்காமல் ஒலிபெயர்த்துள்ளது.
- source_word: שָׁמְרֵנִי
  choice: என்னைக் காத்தருளும்
  rationale: ‘என்னைக் காப்பாற்றும்/பாதுகாத்தருளும்’ என்ற வேண்டுதலை இயல்பான, கண்ணியமான தமிழில் தருகிறது.
- source_word: חָסִיתִי
  choice: அடைக்கலம் புகுந்திருக்கிறேன்
  rationale: எபிரெய வினையின் நிறைவுற்ற வடிவத்தையும், கடவுளிடம் பாதுகாப்பு நாடியுள்ள நிலையின் தொடர்ச்சியையும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: אֵל என்ற இறை அழைப்பு
  choice: கடவுளே
  alternative: இறைவனே
  rationale: மூலத்தில் உள்ள பொதுவான இறைப் பெயரை எந்தத் தனிப்பட்ட சமய மரபுச் சாயலும் சேர்க்காமல் நேரடியாக வழங்குகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சங்கீதத்திற்குரிய கண்ணியமான வேண்டுதல் நடையைப் பேணுகிறது. ஒருமை இறைமுகப்புக்கு மரியாதை வடிவமான ‘உம்மிடம்’ பயன்படுத்தப்பட்டுள்ளது; மூலத்தின் வரிசையும் கவித்துவச் சுருக்கமும் இயன்றவரை காக்கப்பட்டுள்ளன.
