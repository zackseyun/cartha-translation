source:
  edition: WLC
  text: מִכְתָּ֥ם לְ/דָוִ֑ד שָֽׁמְרֵ֥/נִי אֵ֝֗ל כִּֽי חָסִ֥יתִי בָֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/016/001.yaml
  text: A miktam of David. Preserve me[a], O God, for I take refuge in you.
translation:
  language: ta
  text: 'தாவீதின் மிக்தாம்[a].


    இறைவனே, என்னைக் காத்தருளும்;

    ஏனெனில், உம்மிடம் அடைக்கலம் புகுந்திருக்கிறேன்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் மிக்தாம்; பொருள் உறுதியாகத் தெரியாத ஒரு சங்கீதத் தலைப்பு. இது ஒரு வகைப் பாடலைக் குறிக்கலாம். சிலர் இதை ‘சங்கீதம்’ அல்லது ‘பொன் பாடல்’ என்று மொழிபெயர்க்கின்றனர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכְתָּם
  choice: மிக்தாம்
  rationale: சங்கீதத் தலைப்பில் வரும் இச்சொல்லின் பொருள் உறுதியாகத் தெரியாததால், ஊகமான பொருளைத் திணிக்காமல் எபிரெய வடிவம் ஒலிபெயர்க்கப்பட்டது.
- source_word: לְדָוִד
  choice: தாவீதின்
  rationale: לְ என்ற முன்னொட்டு ஆசிரியத்துவம், தொடர்பு, உடைமை, அல்லது அர்ப்பணிப்பு ஆகியவற்றைக் குறிக்கக்கூடும். ‘தாவீதின்’ என்பது இவற்றில் ஒன்றை மட்டும் உறுதிப்படுத்தாமல் இயல்பாகத் தலைப்பை வழங்குகிறது.
- source_word: שָׁמְרֵנִי
  choice: என்னைக் காத்தருளும்
  rationale: שׁמר என்ற வினை பாதுகாத்தல், பேணிக் காத்தல் என்ற விரிவான பொருளைக் கொண்டது. தமிழ் மன்றாட்டு நடையில் ‘காத்தருளும்’ இயல்பாகவும் கண்ணியமாகவும் உள்ளது.
- source_word: אֵל
  choice: இறைவனே
  rationale: אֵל என்பது கடவுளைக் குறிக்கும் பொதுவான இறைப் பட்டம்; அழைப்புவேற்றுமைத் தன்மை ‘இறைவனே’ என்பதில் தெளிவாக வெளிப்படுகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: இந்த இடத்தில் כִּי மன்றாட்டிற்கான காரணத்தை அறிமுகப்படுத்துவதால், தெளிவான காரணத் தொடர்பை ‘ஏனெனில்’ வழங்குகிறது.
- source_word: חָסִיתִי
  choice: அடைக்கலம் புகுந்திருக்கிறேன்
  rationale: חסה என்பது ஒருவரிடம் பாதுகாப்புக்காக அடைக்கலம் புகுதலைக் குறிக்கிறது. எபிரெய நிறைவுவினையின் விளைவுநிலைத் தன்மையையும் அடைக்கல உருவகத்தையும் இச்சொற்றொடர் காக்கிறது.
- source_word: בָךְ
  choice: உம்மிடம்
  rationale: חסה உடன் வரும் בְ அடைக்கலம் அளிப்பவரைக் குறிக்கிறது. தமிழில் ‘உம்மிடம் அடைக்கலம் புகுதல்’ என்பது இயல்பான இணைவு; ‘உம்மில்’ என்பதைவிட தெளிவானது.
theological_decisions:
- issue: மִכְתָּם என்ற சங்கீதத் தலைப்பின் பொருள்
  choice: பொருளை ஊகித்து மொழிபெயர்க்காமல் ‘மிக்தாம்’ என்று ஒலிபெயர்த்தல்
  alternative: ‘சங்கீதம்’, ‘பொன் பாடல்’, அல்லது ‘கல்வெட்டு’ என்று பொருள் விளக்கி மொழிபெயர்த்தல்
  rationale: இச்சொல்லின் துல்லியமான பொருள் அறியப்படவில்லை. ஒலிபெயர்ப்பு மூலமொழியின் தெளிவின்மையைப் பாதுகாத்து, விவாதத்துக்குரிய ஒரு பொருளை உறுதியானதாகக் காட்டுவதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளக்கூடிய கண்ணியமான மன்றாட்டு நடை பயன்படுத்தப்பட்டது. ‘உம்மிடம்’ மற்றும் ‘காத்தருளும்’ ஆகியவை மரியாதையையும் இயல்பான தமிழ் இறைவேண்டல் நடையையும் பேணுகின்றன. அடைக்கல உருவகம் மொழிபெயர்ப்பில் தக்கவைக்கப்பட்டது.
