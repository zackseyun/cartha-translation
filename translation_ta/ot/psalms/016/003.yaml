id: PSA.16.3
reference: Psalms 16:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: לִ֭/קְדוֹשִׁים אֲשֶׁר בָּ/אָ֣רֶץ הֵ֑מָּה וְ֝/אַדִּירֵ֗י כָּל חֶפְצִ/י בָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/016/003.yaml
  text: As for the holy ones who are in the land[c][b][a], they are the noble ones in whom is all my delight.
translation:
  language: ta
  text: நாட்டில் இருக்கும் பரிசுத்தமானவர்களோ[a][b] மேன்மையானவர்கள்[c]; அவர்களிலேயே என் மகிழ்ச்சியெல்லாம் இருக்கிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பரிசுத்தவான்கள்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘பூமியில் இருக்கும்.’
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘மகத்துவமானவர்கள்’ அல்லது ‘சிறந்தவர்கள்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: לִקְדוֹשִׁים
  choice: பரிசுத்தமானவர்களோ
  rationale: முன்னொட்டு ל இங்கு எளிய வேற்றுமை உருபாக இல்லாமல் உரையாடலின் தலைப்பைக் குறிக்கலாம்; ஆகவே ‘...வர்களோ’ என்பது ‘அவர்களைப் பொறுத்தவரை’ என்ற இயல்பான பொருளைச் சுருக்கமாகத் தருகிறது. קְדוֹשִׁים என்பதன் பெயரடை சார்ந்த பொருளையும் காக்கிறது.
- source_word: אֲשֶׁר בָּאָרֶץ
  choice: நாட்டில் இருக்கும்
  rationale: אֶרֶץ என்பதற்கு ‘நாடு’ என்றும் ‘பூமி’ என்றும் பொருள் உண்டு. இங்கு நாட்டிலுள்ள மனிதர்களைக் குறிக்கும் வாசிப்பு சூழலுக்கு இயல்பானது; மற்ற வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: הֵמָּה
  choice: மேன்மையானவர்கள்
  rationale: எபிரெய தனிப்பட்ட பன்மைச் சுட்டுப்பெயரின் வலியுறுத்தல், தமிழில் தலைப்புக்குப் பின் வரும் பெயர்ப் பயனிலை அமைப்பில் இயல்பாக வெளிப்படுகிறது.
- source_word: וְאַדִּירֵי
  choice: மேன்மையானவர்கள்
  rationale: אַדִּיר என்பது மேன்மை, மகத்துவம், சிறப்பு ஆகியவற்றைக் குறிக்கலாம். இங்கு இராணுவ வலிமையைவிட மதிப்பும் உயர்வும் முன்னிலையில் இருப்பதால் ‘மேன்மையானவர்கள்’ பொருத்தமானது.
- source_word: כָּל חֶפְצִי
  choice: என் மகிழ்ச்சியெல்லாம்
  rationale: חֵפֶץ இங்கு விருப்பம் அல்லது இன்பத்தைவிட அன்பார்ந்த மகிழ்ச்சியை வெளிப்படுத்துகிறது; ‘மகிழ்ச்சியெல்லாம்’ இயல்பான நவீனத் தமிழ்.
- source_word: בָם
  choice: அவர்களிலேயே
  rationale: ב முன்னொட்டின் ‘அவர்களில்’ என்ற உறவையும், முழு மகிழ்ச்சி அவர்களிடமே இருப்பதைக் காட்டும் வலியுறுத்தலையும் இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: ‘பரிசுத்தமானவர்கள்’ என்போரின் அடையாளம்
  choice: நாட்டிலுள்ள மனித விசுவாசிகளை முதன்மை வாசிப்பாக வைத்தல்
  alternative: வானுலகப் பரிசுத்த உயிர்கள் அல்லது பொதுவாக அர்ப்பணிக்கப்பட்டவர்கள்
  rationale: ‘நாட்டில் இருக்கும்’ என்ற சொற்றொடர் பூமிக்குரிய மனிதர்களை வலுவாகச் சுட்டுகிறது. எனினும் மொழிபெயர்ப்பு பின்னாளைய திருச்சபைத் தொழில்நுட்பச் சொல்லைத் திணிக்காமல் ‘பரிசுத்தமானவர்கள்’ என்ற பரந்த சொல்லை வைத்திருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதத்திற்கேற்ற கண்ணியமான ஆனால் எளிதில் புரியும் நடை. எபிரெய மொழியின் தலைப்புக் குறியீடு ‘...வர்களோ’ என இயல்பாக்கப்பட்டுள்ளது; ‘நாடு/பூமி’ மற்றும் אַדִּיר சொல்லின் பொருள் விரிவு அடிக்குறிப்புகளில் காக்கப்பட்டுள்ளது.
