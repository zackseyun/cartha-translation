  text: חֲבָלִ֣ים נָֽפְלוּ לִ֭/י בַּ/נְּעִמִ֑ים אַף נַ֝חֲלָ֗ת שָֽׁפְרָ֥ה עָלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/016/006.yaml
  text: The boundary lines have fallen for me in pleasant places[a]; indeed[b], my inheritance is beautiful to me.
translation:
  language: ta
  text: எல்லைக் கோடுகள் எனக்கு இனிய இடங்களில் விழுந்துள்ளன[a]; உண்மையாகவே, என் உரிமைப்பங்கு எனக்கு அழகாக உள்ளது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அளவுக் கயிறுகள் எனக்கு இனிய இடங்களில் விழுந்துள்ளன.’ எபிரேய மொழியின் உருவகம், ஒருவருக்கு ஒதுக்கப்பட்ட நிலப்பங்கை அளந்து குறிக்கும் கயிறுகளையோ கோடுகளையோ சுட்டுகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘என் உரிமைப்பங்கு எனக்கு இனிமையானது.’
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲבָלִים
  choice: எல்லைக் கோடுகள்
  rationale: நிலத்தைப் பங்கிடும்போது அளவுக் கயிறுகளால் குறிக்கப்படும் எல்லைகளை இச்சொல் சுட்டுகிறது. ‘எல்லைக் கோடுகள்’ என்பது பங்கீட்டு உருவகத்தை நவீன தமிழில் தெளிவாகத் தக்கவைக்கிறது.
- source_word: נָפְלוּ
  choice: விழுந்துள்ளன
  rationale: எபிரெய வினையின் நேரடியான ‘விழுதல்’ என்ற உருவகத்தைத் தக்கவைக்கிறது; சீட்டிடுதல் அல்லது பங்கிடுதல் என்ற உட்பொருளை வெளிப்படையாகச் சேர்த்து உருவகத்தைத் தட்டையாக்கவில்லை.
- source_word: בַּנְּעִמִים
  choice: இனிய இடங்களில்
  rationale: נעים என்பதன் இனிமை, விருப்பத்தன்மை, அழகு ஆகிய பொருள் வட்டத்தையும் நிலப்பங்கீட்டுச் சூழலின் இடவுணர்வையும் இயல்பான தமிழில் தருகிறது.
- source_word: אַף
  choice: ஆம்
  rationale: முதல் கூற்றை உறுதிப்படுத்தி அடுத்த கூற்றை வலியுறுத்தும் சொல்லாக இங்கு செயல்படுகிறது; ‘ஆம்’ அதன் உறுதிப்படுத்தும் வலிமையைச் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: נַחֲלָת
  choice: என் உரிமைப்பங்கு
  rationale: பரம்பரை உரிமையாகவோ ஒதுக்கப்பட்ட உடைமைப்பங்காகவோ கிடைக்கும் பங்கைச் சுட்டும் சொல். நிலப்பங்கீட்டு நயத்தைத் தக்கவைத்து, வெறும் பொதுவான ‘ஆசீர்வாதம்’ என்று மாற்றாமல் இருக்க ‘உரிமைப்பங்கு’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: שָׁפְרָה עָלָי
  choice: எனக்கு அழகானதாக இருக்கிறது
  rationale: வினையின் அழகு, நயம், இனிமை ஆகிய மதிப்பீட்டு வலிமையையும் עָלַי வெளிப்படுத்தும் தனிப்பட்ட தொடர்பையும் இயல்பான தமிழில் அளிக்கிறது.
theological_decisions:
- issue: நிலப்பங்கீட்டு உருவகம் கடவுள் அளித்த பங்கைச் சுட்டுவது
  choice: ‘எல்லைக் கோடுகள்’ மற்றும் ‘உரிமைப்பங்கு’ என்ற உறுதியான நிலப்பங்கீட்டு மொழியைத் தக்கவைத்தல்
  alternative: ‘எனக்குக் கிடைத்த ஆசீர்வாதங்கள் இனிமையானவை’ என்று பொதுமைப்படுத்துதல்
  rationale: சுற்றியுள்ள வசனங்களில் ஆண்டவரே சங்கீதக்காரரின் பங்கு என்ற கருத்துடன் இந்நிலப்பங்கீட்டு மொழி ஒலிக்கிறது. அதைப் பொதுவான நன்மைகள் என்ற கூற்றாக மாற்றாமல் இருப்பது மூலத்தின் உடன்படிக்கை மற்றும் உரிமைப்பங்கு சார்ந்த நயத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையில் அமைக்கப்பட்டுள்ளது. அதே நேரத்தில் மூலத்தின் நிலப்பங்கீட்டு உருவகமும் ‘விழுந்துள்ளன’ என்ற திட்டமிட்ட உருவக மொழியும் பாதுகாக்கப்பட்டுள்ளன.
