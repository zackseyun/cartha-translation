revisions:
- from: எல்லைக் கோடுகள் எனக்கு இனிய இடங்களில் விழுந்துள்ளன[a]; ஆம், என் உரிமைப்பங்கு எனக்கு அழகானதாக இருக்கிறது[b].
  to: எல்லைக் கோடுகள் எனக்கு இனிய இடங்களில் விழுந்துள்ளன[a]; உண்மையாகவே, என் உரிமைப்பங்கு எனக்கு அழகாக உள்ளது[b].
  rationale: The revision preserves the source’s concrete boundary-line and inheritance imagery, including the literal ‘fallen’ metaphor, while improving modern Tamil idiom. It changes only the emphatic connector and the stiff predicate construction; it does not resolve or expand the verse’s theological metaphor.
