source:
  edition: WLC
  text: תּֽוֹדִיעֵ/נִי֮ אֹ֤רַח חַ֫יִּ֥ים שֹׂ֣בַע שְׂ֭מָחוֹת אֶת פָּנֶ֑י/ךָ נְעִמ֖וֹת בִּ/ימִינְ/ךָ֣ נֶֽצַח־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/016/011.yaml
  text: You make known to me the path of life[a]; in your presence is fullness of joy[b]; at your right hand are pleasures forever.
translation:
  language: ta
  text: வாழ்வின் பாதையை நீர் எனக்கு அறிவிக்கிறீர்[a]; உமது முன்னிலையில் நிறைவான மகிழ்ச்சி உண்டு[b]; உமது வலக்கையில் என்றென்றும் இன்பங்கள் உண்டு.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நீர் எனக்கு அறிவிப்பீர்’ என்றும் மொழிபெயர்க்கலாம்; எபிரெய வினை எதிர்கால நுட்பத்தையும் ஏற்கக்கூடும்.
    reason: காலவினை மாற்று
  - marker: b
    text: சொல்லாட்சிப்படி, ‘உமது முகத்தின்முன் மகிழ்ச்சிகளின் நிறைவு உண்டு.’
    reason: சொல்லாட்சிப்படியான மாற்று
lexical_decisions:
- source_word: תּוֹדִיעֵנִי
  choice: நீர் எனக்கு அறிவிக்கிறீர்
  rationale: ידע என்பதன் ஹிஃபில் வடிவம் ‘என்னை அறியச் செய்கிறீர் / எனக்கு அறிவிக்கிறீர்’ என்று பொருள்படும். ‘அறிவிக்கிறீர்’ காரணவினைப் பொருளை இயல்பான நவீனத் தமிழில் தக்கவைக்கிறது; கவிதையில் வெளிப்படும் நம்பிக்கையைக் கருத்தில் கொண்டு இங்கு நிகழ்காலம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: אֹרַח חַיִּים
  choice: வாழ்வின் பாதை
  rationale: אֹרַח என்பது பாதை அல்லது வழி; חַיִּים வடிவில் பன்மையாக இருந்தாலும் இங்கு ‘வாழ்வு’ என்னும் கருத்துப்பெயராகச் செயல்படுகிறது. ‘வாழ்வின் பாதை’ மூல உருவகத்தைத் தெளிவாகத் தக்கவைக்கிறது.
- source_word: שֹׂבַע שְׂמָחוֹת
  choice: நிறைவான மகிழ்ச்சி
  rationale: שֹׂבַע நிறைவு, மிகுதி, திருப்தி ஆகிய கருத்துகளையும் שְׂמָחוֹת பன்மையான மகிழ்ச்சிகளையும் குறிக்கின்றன. தமிழில் ‘நிறைவான மகிழ்ச்சி’ இயல்பாக ஒலித்தாலும், மூலத்தின் பன்மை அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: אֶת־פָּנֶיךָ
  choice: உமது முன்னிலையில்
  rationale: சொல்லாட்சிப்படி ‘உமது முகத்துக்கு முன்பாக’ என்றாலும், எபிரெயச் சொற்றொடர் ஒருவரின் நேரடியான சந்நிதி அல்லது முன்னிலையைக் குறிக்கிறது. ‘உமது முன்னிலையில்’ பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: נְעִמוֹת
  choice: இன்பங்கள்
  rationale: נעם வேர் சார்ந்த இப்பன்மை வடிவம் இனிமையானவை, மகிழ்வூட்டும் இன்பங்கள் அல்லது களிப்புகளைக் குறிக்கிறது. ‘இன்பங்கள்’ அதன் பன்மையையும் கவித்துவத் தன்மையையும் தக்கவைக்கிறது.
- source_word: בִּימִינְךָ
  choice: உமது வலப்பக்கத்தில்
  rationale: இச்சூழலில் בְּ உடனான ‘வலக்கை’ இடத்தைக் குறிக்கும் வகையில் ‘வலப்பக்கத்தில்’ என்று இயல்பாக மொழிபெயர்க்கப்படுகிறது; ஆதரவு அல்லது அருள் என்ற விளக்கத்தை உரைக்குள் கூடுதலாகச் சேர்க்கவில்லை.
- source_word: נֶצַח
  choice: என்றென்றும்
  rationale: இங்கு நீடித்த, முடிவற்ற தொடர்ச்சியைக் குறிக்கிறது. ‘என்றென்றும்’ கவிதை நடைக்கு ஏற்ற இயல்பான தமிழ்.
theological_decisions:
- issue: אֶת־פָּנֶיךָ என்பதை சொல்லாட்சிப்படி ‘உமது முகத்துக்கு முன்பாக’ எனவா, பொருளுக்கேற்ப ‘உமது முன்னிலையில்’ எனவா மொழிபெயர்ப்பது
  choice: உமது முன்னிலையில்
  alternative: உமது முகத்துக்கு முன்பாக
  rationale: ‘முகம்’ என்ற மூல உருவத்தைச் சொல்லாட்சிப்படி தருவது சாத்தியம்; ஆனால் இச்சொற்றொடர் எபிரெயத்தில் தேவனுடைய நேரடியான முன்னிலையைக் குறிக்கும் இயல்பான வழக்கு. முதன்மை உரையில் தெளிவான தமிழ் பயன்படுத்தப்பட்டு, சொல்லாட்சிப்படியான வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: תּוֹדִיעֵנִי என்ற நிறைவுறா வினையை நிகழ்காலமாகவா எதிர்காலமாகவா தருவது
  choice: அறிவிக்கிறீர்
  alternative: அறிவிப்பீர்
  rationale: நிறைவுறா வினை எதிர்கால நுட்பத்தையும் ஏற்கலாம். ஆயினும் சங்கீதத்தின் நம்பிக்கை மொழியில் நிகழ்காலம் இயல்பானது; எதிர்கால வாய்ப்பு அடிக்குறிப்பில் விடப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையில் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. தேவனை நோக்கிய ஒருமை மரியாதை வடிவங்களான ‘நீர்’, ‘உமது’ பயன்படுத்தப்பட்டுள்ளன. மூலத்தின் மூன்று இணைச் சொற்றொடர்களும் அரைப்புள்ளிகளால் தக்கவைக்கப்பட்டுள்ளன.
