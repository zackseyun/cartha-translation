  text: I will bless Yahweh[a], who counsels me; even at night my inner being instructs me.
translation:
  language: ta
  text: எனக்கு ஆலோசனை வழங்குகிற யெகோவாவை நான் போற்றுவேன்; இரவுகளிலும் என் அகமனம்[a] எனக்கு அறிவுறுத்துகிறது.
  philosophy: optimal-equivalence
