lexical_decisions:
- source_word: אֲבָרֵךְ
  choice: நான் போற்றுவேன்
  rationale: ברך என்பதன் பியேல் வடிவம், கடவுளைப் பற்றிய சூழலில் அவரை வாழ்த்திப் புகழ்வதைக் குறிக்கிறது. தமிழில் கடவுளை மனிதன் ‘ஆசீர்வதிப்பேன்’ என்பது இயல்பற்றதும் தவறாகப் புரிந்துகொள்ளக்கூடியதும் என்பதால், மூலத்தின் புகழ்ந்து பேசும் பொருளை ‘போற்றுவேன்’ இயல்பாகத் தருகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: நான்கு எழுத்துகளாலான தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் நன்கு நிலைபெற்ற தனிப்பெயர் வடிவமான ‘யெகோவா’ என்று வழங்குகிறது.
- source_word: יְעָצָנִי
  choice: எனக்கு ஆலோசனை வழங்குகிற
  rationale: יעץ என்பதன் ‘ஆலோசனை கூறுதல்’ என்ற நேரடியான பொருளைப் பாதுகாக்கிறது; முற்றுமையற்ற வினை இங்கு வழக்கமான அல்லது தொடரும் செயலைக் குறிக்கிறது.
- source_word: אַף לֵילוֹת
  choice: இரவுகளில்கூட
  rationale: אַף என்பதன் வலியுறுத்தும் சேர்க்கைப் பொருளை ‘கூட’ தருகிறது; לֵילוֹת என்பதன் பன்மையையும் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: יִסְּרוּנִי
  choice: எனக்குப் புத்தி புகட்டுகின்றன
  rationale: יסר என்பது ஒழுக்கப்படுத்துதல், திருத்துதல், அறிவுறுத்துதல் ஆகிய பொருட்களைக் கொள்ளலாம். இரவுநேர உள்ளார்ந்த அறிவுறுத்தல் என்ற சூழலில் ‘புத்தி புகட்டுகின்றன’ அதன் உருவாக்கும் மற்றும் திருத்தும் நுண்ணுணர்வைத் தக்கவைக்கிறது.
- source_word: כִלְיוֹתָי
  choice: என் உள்ளுறுப்புகள்
  rationale: சொல்லுக்கு நேராக ‘என் சிறுநீரகங்கள்’; எபிரெய சிந்தனையில் இது ஆழ்ந்த உணர்வு, மனச்சாட்சி உள்ளிட்ட அகமனிதனைச் சுட்டும் உடலுறுப்பு உருவகம். ‘உள்ளுறுப்புகள்’ மூல உருவகத்தின் உடல்சார் தன்மையை ஓரளவு காத்து, அடிக்குறிப்பின் மூலம் பொருளை விளக்க இடமளிக்கிறது.
theological_decisions:
- issue: כִלְיוֹתָי என்ற மனித இயல்பியல் உருவகம்
  choice: மூல உடலுறுப்பு உருவகத்தை ‘என் உள்ளுறுப்புகள்’ என்று உரையில் தக்கவைத்து, அடிக்குறிப்பில் அதன் பண்பாட்டு பொருளை விளக்குதல்
  alternative: ‘என் உள்ளம்’ அல்லது ‘என் அகமனம்’ என்று முழுமையாகப் பொருளாக்குதல்
  rationale: ‘உள்ளம்’ என்பது வேறொரு எபிரெய உருவகப் பிரிவுடன் இதை ஒன்றாக்கக்கூடும்; ‘சிறுநீரகங்கள்’ மட்டும் நவீன வாசகரைத் தவறாக வழிநடத்தலாம். தேர்ந்த வடிவம் உண்மையான உருவகத்தையும் வாசிப்புத் தெளிவையும் சமநிலைப்படுத்துகிறது.
- issue: יִסְּרוּנִי என்பதிலுள்ள அறிவுறுத்தல்–ஒழுக்கப்படுத்தல் நுண்ணுணர்வு
  choice: ‘புத்தி புகட்டுகின்றன’
  alternative: ‘என்னைத் திருத்துகின்றன’ அல்லது ‘எனக்கு அறிவுறுத்துகின்றன’
  rationale: மூல வினையின் போதித்து உருவாக்கும் பொருளை முன்னிறுத்துகிறது; அதிலுள்ள திருத்தும் சாத்தியத்தை முற்றிலும் தீவிர தண்டனையாக மாற்றுவதில்லை.
