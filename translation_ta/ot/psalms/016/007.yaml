    text: நேரடியாக, “என் சிறுநீரகங்கள்.” எபிரெயப் பயன்பாட்டில் சிறுநீரகங்கள் மனச்சாட்சி மற்றும் ஆழ்ந்த உணர்வுகள் உட்பட ஒருவரின் ஆழ்ந்த உள்ளார்ந்த தன்மையைக் குறிக்கலாம்.
