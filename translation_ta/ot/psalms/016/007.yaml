revisions:
- from: எனக்கு ஆலோசனை வழங்குகிற யெகோவாவை நான் போற்றுவேன்; இரவுகளில்கூட என் உள்ளுறுப்புகள்[a] எனக்குப் புத்தி புகட்டுகின்றன.
  to: எனக்கு ஆலோசனை வழங்குகிற யெகோவாவை நான் போற்றுவேன்; இரவுகளிலும் என் அகமனம்[a] எனக்கு அறிவுறுத்துகிறது.
  rationale: The revision preserves the Hebrew’s praise vow, divine name, ongoing counsel, emphatic nighttime setting, and inward instruction. ‘என் அகமனம்’ communicates the culturally figurative sense of ‘kidneys’ without the misleadingly broad anatomical term ‘உள்ளுறுப்புகள்’; the footnote preserves the literal Hebrew image. ‘அறிவுறுத்துகிறது’ retains the instructional/admonitory range of יסר without forcing a punitive sense.
