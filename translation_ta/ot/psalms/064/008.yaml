  source_fidelity: 'முதன்மை உரை எபிரெயக் கவிதையின் பொதுவாக ஏற்கப்படும் பொருளைச் சரியாகத் தருகிறது: துன்மார்க்கர் வீழ்த்தப்படுதல், அவர்களுடைய நாவு அவர்களுக்கு எதிராக இருத்தல், அதைக் காண்போரின் எதிர்வினை. ஆனால் [a] அடிக்குறிப்பின் சொற்சார்பான மாற்று வாசிப்பு எபிரெயச் சுட்டுப்பெயர் அமைப்பைத் தவறாக மாற்றுகிறது: வினையின் ஒருமைச் செயப்படுபொருள் பின்னொட்டை ‘அவனை/அதை’ எனக் காக்க வேண்டும்; ‘அவனுடைய/அதனுடைய நாவு’ என்பது மூலத்தில் இல்லை.'
  naturalness: ‘இடறும்படி செய்யப்பட்டார்கள்’ புரிந்துகொள்ளத்தக்கது; ஆயினும் ‘இடறச் செய்யப்படுவார்கள்’ நவீன நிலையான தமிழில் அதிக இயல்பாகவும் கவிதைநடைக்கு ஒத்ததாகவும் உள்ளது. இறுதி எதிர்வினையை ‘தலைகளை அசைப்பார்கள்’ எனக் கூறுவது வெறும் உடன்பாட்டு தலையசைப்பாகப் புரியக்கூடிய வாய்ப்பைக் குறைக்கிறது.
