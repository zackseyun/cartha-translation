  to: அவர்கள் இடறச் செய்யப்படுவார்கள்[a]; அவர்களுடைய நாவே அவர்களுக்கு எதிராக இருக்கும்; அவர்களைக் காணும் அனைவரும் தலைகளை அசைப்பார்கள்[b].
  rationale: முதல் அடிக்குறிப்பு மூல எபிரெயத்தின் கடினமான தொடரமைப்பையும் ஒருமைச் செயப்படுபொருள் பின்னொட்டையும் துல்லியமாகக் காட்டுமாறு திருத்தப்பட்டுள்ளது. முதன்மை உரையில் பொதுவாக ஏற்கப்படும் கூட்டுப்பொருள் தக்கவைக்கப்பட்டுள்ளது; ஆனால் தமிழ் வினைநடை மற்றும் இறுதிக் காட்சிப்படுத்தல் இயல்பாக்கப்பட்டுள்ளன. எந்தக் கோட்பாட்டுச் சார்ந்த விளக்கமும் சேர்க்கப்படவில்லை.
