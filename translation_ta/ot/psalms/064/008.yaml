source:
  edition: WLC
  text: וַ/יַּכְשִׁיל֣וּ/הוּ עָלֵ֣י/מוֹ לְשׁוֹנָ֑/ם יִ֝תְנֹדֲד֗וּ כָּל רֹ֥אֵה בָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/064/008.yaml
  text: They are made to stumble[a]; their own tongue is against them[b]; all who see them shake their heads.
translation:
  language: ta
  text: அவர்கள் இடறச் செய்யப்படுவார்கள்[a]; அவர்களுடைய நாவே அவர்களுக்கு எதிராக இருக்கும்; அவர்களைக் காணும் அனைவரும் தலைகளை அசைப்பார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, சொற்சார்பாக: ‘அவர்கள் அவனை/அதை இடறச் செய்தார்கள்; அவர்கள்மேல் அவர்களுடைய நாவு [இருக்கிறது].’ முதல் அரையடியின் எபிரெய வாக்கிய அமைப்பு கடினமானது; சுட்டுப்பெயர்கள் எவற்றைக் குறிக்கின்றன என்பதில் மொழிபெயர்ப்புகள் வேறுபடுகின்றன. தீயவர்கள் தங்கள் பேச்சினாலேயே வீழ்கிறார்கள் என்ற பொருளை முதன்மை உரை பின்பற்றுகிறது.'
    reason: alternative_reading
  - marker: b
    text: இவ்வினைச்சொல்லை ‘தலையை ஆட்டுவார்கள்,’ ‘நடுங்குவார்கள்,’ அல்லது சில சூழல்களில் ‘விலகி ஓடுவார்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכְשִׁילוּהוּ
  choice: அவர்கள் இடறும்படி செய்யப்பட்டார்கள்
  rationale: כשׁל என்பதன் ஹிஃபில் வடிவம் ‘இடறச் செய்/விழச் செய்’ எனப் பொருள்படும். வினையோடு இணைந்த பின்னொட்டு இலக்கணப்படி மூன்றாம் நபர் ஆண்பால் ஒருமையாக இருந்தாலும், எபிரெய வாக்கிய அமைப்பு கடினமானது; உடனுள்ள பன்மைச் சுட்டுகளோடு பொருந்துமாறு தீயவர்கள் இடறச் செய்யப்படுகிறார்கள் என்ற கூட்டு உணர்வு முதன்மை உரையில் தரப்படுகிறது.
- source_word: עָלֵימוֹ
  choice: அவர்களுக்கு எதிரானது
  rationale: על என்பதற்கு இங்கு ‘அவர்கள்மேல்/அவர்களுக்கு எதிராக’ என்ற பொருள் அமையலாம். நாவே அவர்களுக்கு எதிராகத் திரும்புகிறது என்ற இயல்பான தமிழ் சொற்றொடர், கவிதையின் சுருக்கத்தையும் கருத்தையும் காக்கிறது.
- source_word: לְשׁוֹנָם
  choice: அவர்களுடைய சொந்த நாவே
  rationale: எபிரெயில் பன்மை உடைமைப் பின்னொட்டுடன் வரும் ஒருமை ‘நாவு’ என்ற உருவகத்தைத் தக்கவைத்து, வீழ்ச்சிக்குக் காரணம் அவர்களுடைய பேச்சே என்பதை ‘சொந்த’ மற்றும் ‘-ஏ’ வலியுறுத்துகின்றன.
- source_word: יִתְנֹדֲדוּ
  choice: தலையசைப்பார்கள்
  rationale: נוד என்பது அசைதல், அலைதல், நடுங்குதல் அல்லது எதிர்வினையாகச் சைகை செய்தல் ஆகிய பொருட்களை ஏற்கலாம். ‘அவர்களைக் காணும் அனைவரும்’ என்ற சூழலில் தலையசைத்தல் இயல்பான காட்சிப்படுத்தல்; பிற சாத்தியங்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: כָּל רֹאֵה בָם
  choice: அவர்களைக் காணும் அனைவரும்
  rationale: ‘அனைவர்’ என்ற முழுமையையும், காண்பவர்களைக் குறிக்கும் பங்கேற்பு வடிவத்தையும், பன்மைப் பொருள் சுட்டையும் நேரடியாகப் பாதுகாக்கும் இயல்பான தமிழ் மொழிபெயர்ப்பு.
theological_decisions:
- issue: முதல் அரையடியிலுள்ள தெளிவற்ற சுட்டுப்பெயர் தொடர்புகள்
  choice: தீயவர்கள் தங்கள் சொந்தப் பேச்சினால் வீழ்ச்சியடையும் கருத்தை முதன்மை உரையில் தருதல்
  alternative: ‘அவனுடைய/அதனுடைய நாவு அவர்கள்மேல் அவனை/அதை இடறச் செய்தது’ என்று இலக்கண வடிவங்களை நேரடியாகப் பிரதிபலித்தல்
  rationale: மூலத்தின் தொடரமைப்பு உண்மையிலேயே கடினமானது. சூழலிலுள்ள பன்மைச் சுட்டுகள் முதன்மை வாசிப்பை ஆதரித்தாலும், ஒருமைப் பின்னொட்டின் சிக்கலை மறைக்காமல் அடிக்குறிப்பில் பதிவு செய்வது பொருத்தம்.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘நாவு’ என்ற மூல உருவகம் காக்கப்பட்டுள்ளது. முதல் அரையடியின் மூலமொழித் தெளிவின்மை அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது; இரண்டாம் அடிக்குறிப்பு சரியான [b] குறியீட்டுடன் இறுதி வினைச்சொல்லில் இணைக்கப்பட்டுள்ளது.
