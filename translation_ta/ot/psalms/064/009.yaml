id: PSA.64.9
reference: Psalms 64:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יִּֽירְא֗וּ כָּל אָ֫דָ֥ם וַ֭/יַּגִּידוּ פֹּ֥עַל אֱלֹהִ֗ים וּֽ/מַעֲשֵׂ֥/הוּ הִשְׂכִּֽילוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/064/009.yaml
  text: Then all mankind will fear[a], and they will declare the work of God; they will understand what he has done.
translation:
  language: ta
  text: அப்போது மனிதர் அனைவரும் அஞ்சுவார்கள்[a]; கடவுளின் செயலை அறிவிப்பார்கள்; அவர் செய்ததைப் புரிந்துகொள்வார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஒவ்வொரு மனிதரும்’ அல்லது ‘மனிதகுலம் முழுவதும்.’ எபிரெயத்தில் ‘எல்லா மனிதரும்’ என்று உள்ளது; இங்கு அந்தச் சொல் மனிதர்களை ஒட்டுமொத்தமாகக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירְאוּ
  choice: அஞ்சுவார்கள்
  rationale: ירא என்பது பயத்தையும் பயபக்தியையும் குறிக்கக்கூடும். தெய்வீகத் தீர்ப்பின் சூழலில் இரு நுண்ணுணர்வுகளையும் முற்றிலும் நீக்காமல் ‘அஞ்சுவார்கள்’ இயல்பாக வெளிப்படுத்துகிறது; கவிதைத் தொடரையும் எதிர்கால வடிவில் தருகிறது.
- source_word: כָּל אָדָם
  choice: மனிதர் அனைவரும்
  rationale: אָדָם இங்கு தனிப்பட்ட ஆணைக் குறிக்காமல் மனிதகுலத்தைப் பொதுவாகக் குறிக்கும் தொகுப்புச் சொல். ‘மனிதர் அனைவரும்’ என்பது நவீனத் தமிழில் இயல்பாகவும் உள்ளடக்கமாகவும் உள்ளது.
- source_word: וַיַּגִּידוּ
  choice: அறிவிப்பார்கள்
  rationale: נגד என்பதன் ஹிஃபில் வடிவம் தெரியப்படுத்துதல், எடுத்துரைத்தல், அறிவித்தல் என்னும் பொருளுடையது. இங்கு கடவுளின் செயலைப் பொதுவாக எடுத்துரைக்கும் தொனிக்கு ‘அறிவிப்பார்கள்’ பொருந்துகிறது.
- source_word: פֹּעַל אֱלֹהִים
  choice: கடவுளின் செயலை
  rationale: פֹּעַל என்பது செயல், கிரியை, நடவடிக்கை ஆகிய பொருள்களைக் கொண்டது. சூழலில் கடவுளின் தீர்ப்புச் செயலைக் குறித்தாலும், மூலத்தின் பரந்த பொருளை ‘செயல்’ பாதுகாக்கிறது.
- source_word: וּמַעֲשֵׂהוּ
  choice: அவர் செய்ததை
  rationale: சொல்லுக்கு நேராக ‘அவருடைய செயல்’ என்றாலும், முந்தைய ‘செயல்’ என்பதன் தேவையற்ற மறுபடியுரைத்தலைத் தவிர்த்து, கடவுள் புரிந்த செயலைத் தெளிவாகக் குறிக்கிறது.
- source_word: הִשְׂכִּילוּ
  choice: புரிந்துகொள்வார்கள்
  rationale: שׂכל என்பதன் ஹிஃபில் இங்கு கடவுளின் செயலை நுண்ணறிவுடன் உணர்தல் அல்லது புரிந்துகொள்ளுதல் என்பதைக் குறிக்கிறது. பொருள் ஒரு செயல் என்பதால் ‘புரிந்துகொள்வார்கள்’ சூழலுக்கு ஏற்றது.
theological_decisions:
- issue: אָדָם என்பதன் பொதுமனிதப் பொருள்
  choice: மனிதர் அனைவரும்
  alternative: ஒவ்வொரு மனிதனும்
  rationale: எபிரெயச் சொல் இலக்கணத்தில் ஒருமையாக இருந்தாலும், இங்கு மனிதர்களை ஒட்டுமொத்தமாகக் குறிக்கிறது. ஆகவே ஆண்களை மட்டும் குறிப்பதாகத் தோன்றாத தொகுப்பு வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- issue: ירא என்பதில் பயமும் பயபக்தியும் உள்ள சாத்தியம்
  choice: அஞ்சுவார்கள்
  alternative: பயப்படுவார்கள் / பயபக்தி கொள்வார்கள்
  rationale: தெய்வீகத் தீர்ப்பைக் கண்ட மனிதர்களின் திகிலையும் கடவுள்மீதான பயபக்தியையும் மூலச்சொல் ஒருங்கே சுமக்கலாம். அவற்றில் ஒன்றை மட்டும் கட்டாயப்படுத்தாமல் ‘அஞ்சுவார்கள்’ என்ற சொல் பதற்றத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. எபிரெயக் கவிதையின் தொடரைத் தக்கவைக்க மூன்று எதிர்கால வினைமுற்றுகள் இணையாக அமைக்கப்பட்டுள்ளன; மிகுந்த சமயச் சிறப்புச் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
