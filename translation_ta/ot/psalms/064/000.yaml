lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: இசைத் தலைவருக்கு
  rationale: சங்கீதங்களின் தலைப்புகளில் இந்தச் சொல் இசை நிகழ்த்துதலை மேற்பார்வையிடுபவரைக் குறிக்கிறது. ‘இசைத் தலைவர்’ என்பது வழிபாட்டு இசைச் சூழலைத் தெளிவாகக் காட்டும் இயல்பான நவீனத் தமிழ்.
- source_word: מִזְמוֹר
  choice: சங்கீதம்
  rationale: இது இசைத் தொடர்புடைய பாடல் வகையைக் குறிக்கும் வழக்கமான எபிரெயத் தலைப்புச் சொல். வேதாகமச் சூழலில் ‘சங்கீதம்’ என்பது துல்லியமும் பரவலான பயன்பாடும் கொண்ட இணைச்சொல்.
- source_word: לְדָוִד
  choice: தாவீதின்
  rationale: எபிரெய முன்னிடைச்சொல் ஆசிரியத்துவம், தொடர்பு, உடைமை அல்லது அர்ப்பணிப்பு ஆகிய பல உறவுகளைக் குறிக்கலாம். ‘தாவீதின்’ அந்தப் பரந்த தொடர்பை இயன்றவரைத் திறந்த நிலையில் வைக்கிறது; ‘தாவீது இயற்றியது’ என்று மொழிபெயர்ப்பது ஆசிரியத்துவத்தை தேவையின்றி உறுதிப்படுத்தும்.
theological_decisions:
- issue: தலைப்பிலுள்ள தாவீதுடன் தொடர்புடைய குறிப்பின் பொருள்
  choice: தாவீதின்
  alternative: தாவீது இயற்றிய; தாவீதுக்காக
  rationale: לְדָוִד என்ற அமைப்பு ஆசிரியத்துவம் மட்டுமல்லாமல் தொடர்பையோ அர்ப்பணிப்பையோ குறிக்கக்கூடும். மூலத்தின் உண்மையான பொருள் விரிவைச் சுருக்காமல் இருக்கப் பொதுவான உறவுமுறைப் பொருள் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், சுருக்கமான சங்கீதத் தலைப்புக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘இசைத் தலைவர்’ தெளிவான வழிபாட்டு-இசைச் சொல்லாகவும், ‘தாவீதின்’ மூலமொழியின் பொருள் விரிவைப் பாதுகாக்கும் இயல்பான வடிவமாகவும் தேர்ந்தெடுக்கப்பட்டுள்ளன.
