translation:
  language: ta
  text: ஆனால் கடவுள் அவர்கள்மீது ஓர் அம்பை எய்கிறார்; திடீரென அவர்கள் காயமடைகிறார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொற்சார்பான மாற்று: “ஆனால் கடவுள் அவர்களை ஓர் அம்பால் எய்தார்; திடீரென அவர்களுடைய காயங்கள் ஏற்பட்டன.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּרֵם
  choice: அவர்கள்மீது ... எய்கிறார்
  rationale: ירה என்பதன் ஹிஃபில் வடிவமும் மூன்றாம் நபர் ஆண்பால் பன்மை பின்னொட்டும் சேர்ந்த இச்சொல், இங்கு கடவுள் அவர்கள்மீது எய்வதைக் குறிக்கிறது. எபிரெயக் கவிதையின் உயிரோட்டமான நிகழ்வுரையைத் தமிழில் நிகழ்காலம் இயல்பாகத் தருகிறது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: இச்சூழலில் இஸ்ரவேலின் ஒரே கடவுளைக் குறிக்கும் ஒருமைப் பொருளுடைய வழக்கமான மொழிபெயர்ப்பு.
- source_word: חֵץ
  choice: ஓர் அம்பை
  rationale: அடிப்படைப் பொருள் ‘அம்பு.’ எய்யப்படும் பொருளாக இருப்பதைத் தமிழில் செயப்படுபொருள் உருபுடன் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: פִּתְאֹם
  choice: திடீரென
  rationale: எதிர்பாராதவிதமாகவும் உடனடியாகவும் நிகழ்வதை நேரடியாகக் குறிக்கிறது.
- source_word: הָיוּ מַכּוֹתָם
  choice: அவர்கள் காயமடைகிறார்கள்
  rationale: சொற்சார்பாக ‘அவர்களுடைய காயங்கள் ஏற்பட்டன/இருந்தன’ என வரக்கூடிய சுருக்கமான எபிரெய விளைவுக் கூற்றை, அம்பு எய்யப்பட்டதன் விளைவாக அவர்கள் காயப்படுவதைத் தெளிவான இயல்பான தமிழில் கூறுகிறது.
theological_decisions:
- issue: கவிதைப் படிமத்தில் கடவுளின் நியாயத்தீர்ப்பு
  choice: கடவுளே தீயவர்கள்மீது அம்பை எய்யும் செய்பவராக நேரடியாகக் காட்டப்பட்டது.
  alternative: இதை வெறும் சூழ்நிலைத் தலைகீழ் மாற்றமாக மென்மைப்படுத்துவது.
  rationale: எபிரெய உரையில் கடவுள் வெளிப்படையான எழுவாய்; ஆகவே தெய்வீகச் செயற்பாட்டையும் அம்புப் படிமத்தையும் குறைக்காமல், கூடுதல் கோட்பாட்டு விளக்கமின்றிப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘அவர்கள்மீது ஓர் அம்பை எய்கிறார்’ என்பது இயல்பான தமிழையும் மூலத்தின் அம்புப் படிமத்தையும் காக்கிறது; அடிக்குறிப்பு எபிரெயச் சொல்லமைப்பின் முறையான மாற்றைத் தருகிறது.
