  text: תַּ֭סְתִּירֵ/נִי מִ/סּ֣וֹד מְרֵעִ֑ים מֵ֝/רִגְשַׁ֗ת פֹּ֣עֲלֵי אָֽוֶן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/064/002.yaml
  text: Hide me from the secret counsel of evildoers[b][a], from the tumult of workers of wickedness.
translation:
  language: ta
  text: தீமை செய்பவர்களின் இரகசிய ஆலோசனையிலிருந்தும்[a], அக்கிரமம் செய்பவர்களின் கொந்தளிப்பிலிருந்தும்[b] என்னை மறைத்தருளும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தீமை செய்பவர்களின் இரகசியச் சதித்திட்டத்திலிருந்து.’ எபிரெயச் சொல் סוֹד ரகசியமான கலந்தாலோசனை, நெருங்கிய வட்டம், அல்லது மறைவான திட்டம் ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அக்கிரமம் செய்பவர்களின் ஆரவாரமான கூட்டத்திலிருந்து.’ எபிரெயச் சொல் רִגְשָׁה பகைமையான கிளர்ச்சி, கூட்ட நெரிசல், அல்லது கொந்தளிப்பைக் குறிப்பதாக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּסְתִּירֵנִי
  choice: என்னை மறைத்தருளும்
  rationale: סתר என்பதன் ஹிஃபில் வடிவமும் முதலாம் நபர் ஒருமை பின்னொட்டும் ‘என்னை மறைத்திடு/காத்து மறைத்திடு’ எனப் பொருள்படும். சூழலில் இது கடவுளை நோக்கிய வேண்டுதல்; ‘மறைத்தருளும்’ என்பது நவீன, கண்ணியமான தமிழ் வேண்டுதல் நடையைத் தருகிறது.
- source_word: מִסּוֹד
  choice: இரகசிய ஆலோசனையிலிருந்து
  rationale: סוֹד என்பது நம்பிக்கைக்குரிய உள்ளார்ந்த வட்டம், மறைவான ஆலோசனை, அல்லது இரகசியத் திட்டம் ஆகியவற்றைக் குறிக்கலாம். ‘இரகசிய ஆலோசனை’ அதன் மறைவும் கலந்தாலோசனையும் ஆகிய இரு கூறுகளையும் காக்கிறது.
- source_word: מְרֵעִים
  choice: தீமை செய்பவர்கள்
  rationale: רעע வேரிலிருந்து வந்த பங்கேற்புப் பெயர் தீமை செய்துகொண்டிருப்பவர்களைக் குறிக்கிறது. ‘தீமை செய்பவர்கள்’ செயற்பாட்டு வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מֵרִגְשַׁת
  choice: கொந்தளிப்பிலிருந்து
  rationale: רִגְשָׁה பகைமையான கிளர்ச்சி, ஆரவாரம், அல்லது கூட்டக் குழப்பத்தைக் குறிக்கலாம். ‘கொந்தளிப்பு’ கூட்டத்தின் அளவைத் தேவையின்றி நிர்ணயிக்காமல் அதன் அச்சுறுத்தும் பரபரப்பைத் தெரிவிக்கிறது.
- source_word: פֹּעֲלֵי אָוֶן
  choice: அக்கிரமம் செய்பவர்கள்
  rationale: இந்தச் சேர்க்கை אָוֶן எனும் அக்கிரமத்தைச் செய்பவர்களை நேரடியாகக் குறிக்கிறது. ‘அக்கிரமம் செய்பவர்கள்’ செயல் சார்ந்த பொருளைக் காத்து, முந்தைய ‘தீமை செய்பவர்கள்’ என்பதிலிருந்து எபிரெயச் சொல் வேறுபாட்டையும் ஓரளவு வெளிப்படுத்துகிறது.
