  terminology: “தீய காரியம்” appropriately preserves the breadth of דָּבָר רָע. “கண்ணிகள்” is suitable for מוֹקְשִׁים. The footnotes preserve both the lexical range and the compressed reference of לָמוֹ without forcing an interpretation.
