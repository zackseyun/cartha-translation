  yaml_path: translation/ot/psalms/064/005.yaml
  text: They strengthen for themselves an evil matter[a]; they talk of hiding snares; they say[b], “Who will see them?”
translation:
  language: ta
  text: தீய காரியத்தைத் தங்களுக்காக வலுப்படுத்துகிறார்கள்[a]; கண்ணிகளை மறைத்து வைப்பதைப் பற்றிப் பேசுகிறார்கள்; “அவற்றை யார் காண்பார்?”[b] என்கிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தீய காரியம்” என்பதை “தீய திட்டம்” அல்லது “கொடிய சூழ்ச்சி” என்றும் பொருள்கொள்ளலாம்; எபிரெயச் சொல் “சொல்,” “காரியம்,” “விவகாரம்” ஆகிய பொருள்களையும் தரக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “எங்களை யார் காண்பார்?” எனச் சிலர் பொருள்கொள்கிறார்கள். ஆயினும், எபிரெய வடிவம் மூன்றாம் நபர் பன்மையில், “அவர்களை/அவற்றை” என்றே உள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: יְחַזְּקוּ לָמוֹ
  choice: அவர்கள் தங்களை உறுதிப்படுத்திக்கொள்கிறார்கள்
  rationale: חזק என்பதன் பியேல் வடிவம் ஒன்றை வலுப்படுத்துதல் அல்லது உறுதியாக்குதல் என்ற பொருளைத் தருகிறது. לָמוֹ என்பதை இச்சூழலில் தன்மைப் பொருளுடன் எடுத்துக்கொண்டு, தீய செயலில் அவர்கள் தங்கள் உறுதியை வலுப்படுத்துவதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: דָּבָר רָע
  choice: தீய காரியம்
  rationale: דבר என்பது சொல், காரியம், விவகாரம், திட்டம் ஆகிய பல பொருள்களைக் கொள்ளலாம். “காரியம்” அதன் பொருள் அகலத்தைத் தக்கவைக்கிறது; சூழலில் இது தீய திட்டத்தையும் குறிக்கலாம்.
- source_word: יְסַפְּרוּ
  choice: பேசுகிறார்கள்
  rationale: ספר என்பதன் பியேல் வடிவம் சொல்லுதல் அல்லது விவரித்தல் எனப் பொருள்படும். தொடர்ந்து வரும் வினையெச்சத்துடன், கண்ணிகளை மறைப்பது குறித்து அவர்கள் கலந்துபேசுவதை இங்கு குறிக்கிறது.
- source_word: לִטְמוֹן מוֹקְשִׁים
  choice: கண்ணிகளை மறைத்து வைப்பதை
  rationale: טמן என்பதன் அடிப்படைப் பொருள் மறைத்தல் அல்லது ஒளித்துவைத்தல்; מוקשׁ என்பது கண்ணி அல்லது பொறி. “கண்ணிகளை மறைத்து வைப்பது” இரண்டின் பொருளையும் இயல்பான தமிழில் தருகிறது.
- source_word: אָמְרוּ
  choice: என்கிறார்கள்
  rationale: இது வடிவத்தில் நிறைவுற்ற வினையாக இருந்தாலும், கவிதைச் சித்தரிப்பில் நிகழ்காலத் தன்மையுடன் அவர்களின் பேச்சை அறிமுகப்படுத்துகிறது.
- source_word: מִי יִרְאֶה לָּמוֹ
  choice: அவற்றை யார் காண்பார்?
  rationale: לָמוֹ மூன்றாம் நபர் பன்மை வடிவம். அருகிலுள்ள பன்மையான “கண்ணிகள்” என்பதைக் குறிப்பதாக எடுத்து “அவற்றை” என்று மொழிபெயர்க்கப்பட்டுள்ளது; எபிரெயக் கவிதையில் அதன் சுட்டுப்பொருள் சுருக்கமாகவும் ஓரளவு தெளிவற்றதாகவும் உள்ளது.
