source:
  edition: WLC
  text: יַֽחְפְּֽשׂוּ עוֹלֹ֗ת תַּ֭מְנוּ חֵ֣פֶשׂ מְחֻפָּ֑שׂ וְ/קֶ֥רֶב אִ֝֗ישׁ וְ/לֵ֣ב עָמֹֽק־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/064/006.yaml
  text: 'They devise injustices: “We have perfected a carefully concealed plot.” And the inward part of each man, and the heart, are deep.'
translation:
  language: ta
  text: 'அவர்கள் அநியாயங்களை ஆராய்ந்து வகுக்கிறார்கள்:


    “நன்கு ஆராய்ந்து வகுத்த ஒரு திட்டத்தை நாங்கள் முடித்துவிட்டோம்” என்கிறார்கள்.


    ஒவ்வொருவரின் உள்ளமும் இதயமும் ஆழமானவை.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַחְפְּשׂוּ
  choice: திட்டமிடுகிறார்கள்
  rationale: பியெல் வடிவம் தீவிரமாகத் தேடுதல் அல்லது ஆராய்ந்து வகுத்தல் என்ற பொருளைக் கொண்டது; இங்கு தீய சூழ்ச்சியை ஆராய்ந்து வகுப்பதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: עוֹלֹת
  choice: அநீதிகளை
  rationale: עוֹלָה என்பதன் பன்மை; அநியாயமான அல்லது தீய செயல்களைச் சுட்டுகிறது.
- source_word: תַּמְנוּ
  choice: முழுமையாக்கிவிட்டோம்
  rationale: תמם வேரின் முதல் நபர் பன்மை வடிவத்தைப் பின்பற்றி, திட்டத்தை முடித்து நிறைவு செய்ததாகக் கூறும் பொருளைத் தக்கவைக்கிறது.
- source_word: חֵפֶשׂ מְחֻפָּשׂ
  choice: நுணுக்கமாக மறைக்கப்பட்ட ஒரு திட்டத்தை
  rationale: இணைந்த சொற்றொடர் ஆராய்ந்து உருவாக்கப்பட்டதும் கண்டுபிடிக்கக் கடினமாக மறைக்கப்பட்டதுமான சூழ்ச்சியை உணர்த்துகிறது; தமிழில் புரியத்தக்க வகையில் இரு நுணுக்கங்களையும் சுருக்கமாகக் கொண்டுவருகிறது.
- source_word: קֶרֶב אִישׁ וְלֵב
  choice: ஒவ்வொருவரின் உள்ளமும் இதயமும்
  rationale: קֶרֶב என்பது மனிதனின் அகப்பகுதியையும் לֵב எண்ணம், நோக்கம், மனம் ஆகியவற்றின் மையத்தையும் குறிக்கிறது; இணை உறுப்புகளைத் தனித்தனியாக வைத்திருக்கிறது.
- source_word: עָמֹק
  choice: ஆழமானவை
  rationale: மனித அகத்தின் மறைவான, எளிதில் அறிய முடியாத தன்மையை நேரடியாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: மனித அகத்தின் ஆழம்
  choice: “உள்ளமும் இதயமும் ஆழமானவை” என்று மதிப்பீட்டை திறந்த நிலையில் வைத்தல்
  alternative: அவை குறிப்பாக வஞ்சகமானவை அல்லது தீயவை என்று விளக்கிச் சொல்லுதல்
  rationale: எபிரெய உரை ‘ஆழமானது’ என்று மட்டுமே கூறுகிறது; சூழல் தீய நோக்கத்தை உணர்த்தினாலும், அந்த விளக்கத்தை மொழிபெயர்ப்புக்குள் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைக்குரிய கண்ணியத்துடனும் சாதாரண வாசகருக்குப் புரியும் சொற்களுடனும் அமைக்கப்பட்டது. எபிரெய உரையின் சுருக்கமான தொடரையும் மனித அகத்தைப் பற்றிய இறுதி வரியின் தெளிவுறாத ஆழத்தையும் பாதுகாக்கிறது.
