  text: שְׁמַע אֱלֹהִ֣ים קוֹלִ֣/י בְ/שִׂיחִ֑/י מִ/פַּ֥חַד א֝וֹיֵ֗ב תִּצֹּ֥ר חַיָּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/064/001.yaml
  text: Hear[a], O God, my voice in my complaint; preserve my life from the fear of the enemy.
translation:
  language: ta
  text: 'கடவுளே, என் புலம்பலில்[a] என் குரலைக் கேளும்;

    பகைவன் பற்றிய அச்சத்திலிருந்து என் உயிரைக் காத்தருளும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் தியானத்தில்” அல்லது “என் மனச்சிந்தனையில்.” எபிரெயச் சொல் வெளிப்படுத்தப்படும் புலம்பலையும் உள்ளார்ந்த சிந்தனையையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע
  choice: கேளும்
  rationale: கடவுளிடம் நேரடியாகச் சொல்லப்படும் ஒருமை ஏவல். தமிழின் மன்றாட்டு நடைக்கு ஏற்ற, மரியாதையும் நேரடித் தன்மையும் கொண்ட வடிவம்.
- source_word: אֱלֹהִים
  choice: கடவுளே
  rationale: நேரடி விளிப்பை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: קוֹלִי
  choice: என் குரலை
  rationale: ‘என்னை’ அல்லது ‘என் வேண்டுதலை’ என்று சுருக்காமல், எபிரெய மொழியின் தெளிவான ‘என் குரல்’ என்ற உருவகத்தைத் தக்கவைக்கிறது.
- source_word: בְשִׂיחִי
  choice: என் புலம்பலில்
  rationale: பகைவரிடமிருந்து பாதுகாப்புக் கோரும் சூழலில் புலம்பல் அல்லது முறையீடு என்ற பொருள் பொருத்தமானது; அதே சொல் உள்ளார்ந்த சிந்தனையையும் குறிக்கக்கூடும் என்பதால் அடிக்குறிப்பில் மாற்றுப் பொருள் தரப்படுகிறது.
- source_word: מִפַּחַד
  choice: அச்சத்திலிருந்து
  rationale: פַּחַד என்பதன் பயம், அச்சம், திகில் ஆகிய பொருள் வரம்பில், அச்சுறுத்தலின் தீவிரத்தை மிகைப்படுத்தாமல் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אוֹיֵב
  choice: பகைவன்
  rationale: மூலத்தின் ஒருமை வடிவத்தையும் சங்கீத நடையையும் தக்கவைக்கிறது; இது பொதுமையான அல்லது கூட்டுப் பொருளையும் கொண்டிருக்கலாம்.
- source_word: תִּצֹּר
  choice: காத்தருளும்
  rationale: ‘காத்தல், பாதுகாத்தல்’ என்ற பொருளை உயிருடன் இயல்பாக இணைக்கிறது; ‘அருளும்’ மன்றாட்டு நடையின் மரியாதையை வெளிப்படுத்துகிறது.
- source_word: חַיָּי
  choice: என் உயிரை
  rationale: எபிரெய மொழியில் இலக்கணப்படி பன்மை வடிவம் இருந்தாலும், இங்கு ஒருவரின் உயிர் அல்லது வாழ்வு குறிக்கப்படுவதால் தமிழில் இயல்பான ஒருமை பயன்படுத்தப்படுகிறது.
theological_decisions:
- issue: בְשִׂיחִי என்பதன் பொருள்
  choice: என் புலம்பலில்
  alternative: என் தியானத்தில் / என் மனச்சிந்தனையில்
  rationale: பகைவரால் வரும் ஆபத்திலிருந்து காப்புக் கோரும் புலம்பல் சூழல் முதன்மைப் பொருளை ஆதரிக்கிறது. இருப்பினும், எபிரெயச் சொல் உள்ளார்ந்த சிந்தனை அல்லது தியானத்தையும் குறிக்கக்கூடியதால் அந்த உண்மையான தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: מִפַּחַד אוֹיֵב என்ற தொடர்பு
  choice: பகைவன் பற்றிய அச்சத்திலிருந்து
  alternative: பகைவனால் உண்டாகும் அச்சத்திலிருந்து
  rationale: மூலமொழியின் சுருக்கமான பெயர்ச்சொல் தொடர்பைத் தக்கவைத்து, அது பகைவனை நோக்கிய பயமா அல்லது பகைவனால் விளையும் அச்சமா என்பதை மொழிபெயர்ப்பில் அளவுக்கு மீறித் தீர்மானிக்காமல் விடுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சங்கீத மன்றாட்டிற்கு ஏற்ற மரியாதையும் கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘கேளும்’, ‘காத்தருளும்’ ஆகியவை புரிந்துகொள்ள எளிய செம்மையான வேண்டுதல் வடிவங்கள்; தேவையற்ற சமயக்குழுச் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
