  text: to shoot at the blameless from hiding places[b][a]; suddenly they shoot at him and do not fear.
translation:
  language: ta
  text: மறைவிடங்களிலிருந்து[a] களங்கமற்றவனை[b] நோக்கி எய்வதற்காக; திடீரென்று அவனை நோக்கி எய்கிறார்கள், அஞ்சுவதுமில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மறைவிடங்களில்.’ எபிரெய முன்னிடைச்சொல் சொற்படியாக ‘இல்’ என்று பொருள்படும்; சூழலில் அவர்கள் மறைந்திருக்கும் இடங்களிலிருந்து தாக்குகிறார்கள் என்பதே கருத்து.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘குற்றமற்றவனை.’ எபிரெயச் சொல் அறநெறிசார் களங்கமின்மையையோ குற்றமின்மையையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִירוֹת
  choice: எய்வதற்காக
  rationale: ירה என்ற வினை இங்குள்ள தாக்குதல் சூழலில் அம்பு போன்ற எறிபடையை எய்வதைக் குறிக்கிறது. எதை எய்கிறார்கள் என்று எபிரெயம் வெளிப்படையாகச் சொல்லாததால், பொருளைச் சேர்க்காமல் ‘எய்தல்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: בַּמִּסְתָּרִים
  choice: மறைவிடங்களிலிருந்து
  rationale: இந்தப் பன்மை பெயர்ச்சொல் மறைந்த அல்லது ஒளிவான இடங்களைக் குறிக்கிறது. எபிரெய முன்னிடைச்சொல் சொற்படியாக ‘மறைவிடங்களில்’ என்றாலும், பதுங்கிய இடத்திலிருந்து தாக்கும் காட்சியை இயல்பான தமிழில் ‘மறைவிடங்களிலிருந்து’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: תָּם
  choice: களங்கமற்றவனை
  rationale: תָּם என்பது நேர்மை, முழுமை, அல்லது குற்றமின்மை கொண்ட ஒருவரைக் குறிக்கலாம். ‘களங்கமற்றவன்’ அதன் அறநெறிசார் பரப்பைத் தக்கவைக்கிறது.
- source_word: פִּתְאֹם
  choice: திடீரென்று
  rationale: தாக்குதல் எதிர்பாராத விதமாக உடனே நிகழ்வதைச் சுட்டும் இயல்பான நவீனத் தமிழ் இணைச்சொல்.
- source_word: יֹרֻהוּ
  choice: அவனை எய்கிறார்கள்
  rationale: மூன்றாம் நபர் ஆண்பால் ஒருமை பின்னொட்டு, முன் கூறப்பட்ட களங்கமற்ற மனிதனை மீண்டும் சுட்டுகிறது. எபிரெயத்தின் செயலைத் தமிழில் சுருக்கமாகத் தக்கவைக்கிறது.
- source_word: וְלֹא יִירָאוּ
  choice: அஞ்சுவதுமில்லை
  rationale: அச்சத்தின் பொருள் எபிரெயத்தில் குறிப்பிடப்படவில்லை. ஆகவே யாருக்கும் அல்லது இறைவனுக்கும் அஞ்சவில்லை என்று விளக்கிச் சேர்க்காமல் அதன் சுருக்கமும் தெளிவின்மையும் பாதுகாக்கப்பட்டுள்ளன.
