- from: நீதிமான் யாவேயில் மகிழ்ந்து, அவரிடம் அடைக்கலம் புகுவான்; உள்ளத்தில் நேர்மையான அனைவரும் பெருமிதம் கொள்வார்கள்.[a]
  to: நீதிமான் யாவேயில் மகிழ்வான்; அவரிடம் அடைக்கலம் புகுவான்; உள்ளத்தில் நேர்மையான அனைவரும் பெருமை கொள்வார்கள்.[a]
  rationale: Finite future verbs now reflect the coordinated Hebrew imperfects more clearly. The final expression preserves the source verb's positive yet somewhat open sense of glorying/boasting without importing the stronger implication of self-satisfied pride. The footnote remains anchored to that expression and gives its supported lexical alternative.
