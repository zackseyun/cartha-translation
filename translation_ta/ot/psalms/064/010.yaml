lexical_decisions:
- source_word: יִשְׂמַח
  choice: மகிழ்ந்து
  rationale: எபிரெய முற்றுப்பெறாத வினை, தேவனுடைய நீதித்தீர்ப்புக்குப் பிந்தைய எதிர்பார்க்கப்படும் விளைவைச் சுட்டுகிறது. அடுத்த வினையுடன் இயல்பாக இணைக்க வினையெச்ச வடிவம் பயன்படுத்தப்பட்டது; எதிர்காலப் பொருள் ‘புகுவான்’ என்பதில் வெளிப்படுகிறது.
- source_word: צַדִּיק
  choice: நீதிமான்
  rationale: ஆண்பால் ஒருமையில் பெயர்ச்சொல்லாகப் பயன்படும் பெயரடை. ‘நீதிமான்’ என்பது வடிவத்தையும் பிரதிநிதித்துவ ஒருமையையும் சுருக்கமாகக் காக்கிறது.
- source_word: בַּיהוָה
  choice: யாவேயில்
  rationale: בְּ என்ற முன்னொட்டு மகிழ்ச்சியின் சார்பு அல்லது களத்தைச் சுட்டுகிறது. יהוה என்ற திருப்பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டது.
- source_word: וְחָסָה בּוֹ
  choice: அவரிடம் அடைக்கலம் புகுவான்
  rationale: חסה பாதுகாப்புக்காக அடைக்கலம் நாடும் உருவகத்தைத் தருகிறது; பொதுவான ‘நம்புவான்’ என்பதைவிட ‘அடைக்கலம் புகுவான்’ மூல உருவகத்தைத் துல்லியமாகக் காக்கிறது.
- source_word: וְיִתְהַלְלוּ
  choice: பெருமிதம் கொள்வார்கள்
  rationale: הלל என்பதன் ஹித்பயேல் வடிவம் பெருமைபாராட்டுதல் அல்லது களிப்புடன் மேன்மை கூறுதல் என்ற பொருளைக் கொள்ளலாம். இங்கு தேவனுடைய செயலால் உண்டாகும் நேர்மறையான களிப்பை இயல்பான தமிழில் தெரிவிக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: כָּל יִשְׁרֵי לֵב
  choice: உள்ளத்தில் நேர்மையான அனைவரும்
  rationale: ‘இதயத்தில் செம்மையானவர்கள்’ என்ற எபிரெய உருவகத்தின் உள்ளார்ந்த ஒழுக்கநேர்மையை நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் உடன்படிக்கையின் தனிப்பெயரான יהוה நேரடியாக உள்ளது. அதை பொதுப்பட்டமாக மாற்றாமல் ‘யாவே’ என ஒலிபெயர்ப்பது பெயரின் தனித்தன்மையைக் காக்கிறது.
- issue: וְיִתְהַלְלוּ என்பதன் நேர்மறையான பெருமை/களிப்பு பொருள்
  choice: பெருமிதம் கொள்வார்கள்
  alternative: பெருமை பாராட்டுவார்கள்; களிகூர்வார்கள்
  rationale: சூழலில் இது தன்னலமான தற்பெருமையைக் காட்டிலும், தேவனுடைய நீதியான மீட்புச் செயலினால் உண்டாகும் பெருமிதம் அல்லது களிப்பைக் குறிக்கிறது. ஆனாலும் வினையின் ‘பெருமை பாராட்டுதல்’ என்ற நுண்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
