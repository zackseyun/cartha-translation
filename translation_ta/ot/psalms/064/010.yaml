  text: நீதிமான் யாவேயில் மகிழ்வான்; அவரிடம் அடைக்கலம் புகுவான்; உள்ளத்தில் நேர்மையான அனைவரும் பெருமை கொள்வார்கள்.[a]
  philosophy: optimal-equivalence
