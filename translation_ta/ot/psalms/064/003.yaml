  text: who sharpen their tongue like a sword; they bend their arrow—a bitter word—
translation:
  language: ta
  text: வாளைப் போலத் தங்கள் நாவைக் கூராக்கி, கசப்பான சொல்லாகிய தங்கள் அம்பை எய்யத் தங்கள் வில்லை வளைத்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁנְנוּ
  choice: கூராக்கியவர்கள்
  rationale: ‘கூர்மையாக்குதல்’ என்ற எபிரெய வினையின் உருவகப் பொருளை இயல்பான தமிழில் காக்கிறது.
- source_word: דָרְכוּ
  choice: எய்ய வில்லை வளைத்தார்கள்
  rationale: வில்லைக் காலால் மிதித்து வளைத்து அம்பெய்யத் தயாராக்கும் செயலைக் குறிக்கும் வினை; தமிழில் புரிதலுக்காக மறைமுகமாக உள்ள ‘வில்’ சேர்க்கப்பட்டது.
- source_word: חִצָּם
  choice: தங்கள் அம்பை
  rationale: மசோரா உரையின் ஒருமை வடிவையும் மூன்றாம் நபர் பன்மை உடைமைப் பின்னொட்டையும் காக்கிறது.
- source_word: דָּבָר מָר
  choice: கசப்பான சொல்லாகிய
  rationale: ‘கசப்பான சொல்’ அம்பை விளக்கும் இணைப்பாகப் புரியும்படி மொழிபெயர்க்கிறது; தீங்கிழைக்கும் பேச்சின் உருவகம் காக்கப்படுகிறது.
theological_decisions:
- issue: ‘கசப்பான சொல்’ என்பதற்கும் ‘அம்பு’ என்பதற்கும் உள்ள தொடரியல் உறவு
  choice: ‘கசப்பான சொல்லாகிய தங்கள் அம்பு’ என்று அம்புக்கான விளக்க இணைப்பாக மொழிபெயர்த்தல்
  alternative: ‘தங்கள் அம்பை—கசப்பான சொல்லை—’ என இடைச்செருகலாக அமைத்தல்
  rationale: எபிரெயத்தில் דָּבָר מָר என்பது חִצָּם என்பதற்குப் பின் வந்து அம்பு எதைக் குறிக்கிறது என்பதைத் திறந்த உருவகத்தில் விளக்குகிறது; தேவையற்ற கோட்பாட்டு விளக்கம் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான, கண்ணியமான தமிழ். எபிரெயக் கவிதையின் வாள்–நா மற்றும் அம்பு–சொல் இணை உருவகங்கள் தெளிவாகப் பாதுகாக்கப்பட்டுள்ளன.
