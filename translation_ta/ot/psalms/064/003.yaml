revisions:
- from: வாளைப் போலத் தங்கள் நாவைக் கூராக்கியவர்கள்; கசப்பான சொல்லாகிய தங்கள் அம்பை எய்ய வில்லை வளைத்தார்கள்.
  to: வாளைப் போலத் தங்கள் நாவைக் கூராக்கி, கசப்பான சொல்லாகிய தங்கள் அம்பை எய்யத் தங்கள் வில்லை வளைத்தார்கள்.
  rationale: The revision retains the source’s verbal sequence and its open metaphor in which the “bitter word” is their arrow. It regularizes the Tamil syntax by coordinating “sharpening” and “bending” under the same implied subject, and uses the natural purpose form “எய்யத்.” The supplied “வில்” reflects the sense of the Hebrew idiom without adding interpretive theology.
