- from: ஆனால் நானோ, உமது பேரளவான மாறாத அன்பினால்[a] உமது வீட்டிற்குள் வருவேன்; உமக்குப் பயந்து[b] உமது பரிசுத்த ஆலயத்தை நோக்கிப் பணிந்துகொள்வேன்.
  to: ஆனால் நானோ, உமது மிகுந்த மாறாத அன்பினால்[a] உமது வீட்டிற்குள் வருவேன்; உமக்குப் பயந்து[b] உமது பரிசுத்த ஆலயத்தை நோக்கித் தாழ்ந்து வணங்குவேன்.
  rationale: The revision improves idiomatic modern Tamil and makes the physical bowing explicit, while preserving the Hebrew contrast, the abundance and constancy of divine חֶסֶד, the literal ‘house’/‘temple’ distinction, and the full weight of reverential fear. Footnote alternatives are retained with idiomatic Tamil phrasing.
