source:
  edition: WLC
  text: וַ/אֲנִ֗י בְּ/רֹ֣ב חַ֭סְדְּ/ךָ אָב֣וֹא בֵיתֶ֑/ךָ אֶשְׁתַּחֲוֶ֥ה אֶל הֵֽיכַל קָ֝דְשְׁ/ךָ֗ בְּ/יִרְאָתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/007.yaml
  text: But as for me[a], by the abundance of your steadfast love I will enter your house[b]; I will bow down toward your holy temple in fear of you.
translation:
  language: ta
  text: ஆனால் நானோ, உமது மிகுந்த மாறாத அன்பினால்[a] உமது வீட்டிற்குள் வருவேன்; உமக்குப் பயந்து[b] உமது பரிசுத்த ஆலயத்தை நோக்கித் தாழ்ந்து வணங்குவேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உமது மிகுந்த உடன்படிக்கைக்குரிய உண்மையினால்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உமக்குப் பயபக்தியுடன்” அல்லது “உம்மைக் குறித்து பிரமிப்புடன்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: ஆனால் நானோ
  rationale: முந்தைய வசனங்களில் கூறப்பட்ட தீயவர்களுக்கு மாறாகச் சங்கீதக்காரரை வலியுறுத்தும் இணைப்புச்சொல் மற்றும் தனிப்பட்ட சுட்டுப்பெயரின் எதிர்மறை ஒப்புமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְּרֹב חַסְדְּךָ
  choice: உமது பேரளவான மாறாத அன்பினால்
  rationale: בְּרֹב என்பது அடிப்படை அல்லது காரணச் சூழலைக் குறிக்கிறது; חֶסֶד என்பது வெறும் உணர்ச்சியல்ல, நிலைத்த விசுவாசமுள்ள அன்பைக் குறிக்கிறது. இறைவனுடைய அன்பே அணுகுவதற்கான அடிப்படை என்பதை இச்சொற்றொடர் காட்டுகிறது.
- source_word: אָבוֹא בֵיתֶךָ
  choice: உமது வீட்டிற்குள் வருவேன்
  rationale: இம்பெர்ஃபெக்ட் வடிவத்தின் தீர்மானம் அல்லது எதிர்பார்ப்பு உணர்வை ‘வருவேன்’ காக்கிறது. בַּיִת என்பதைக் ‘ஆலயம்’ என்று முன்கூட்டியே விளக்காமல் ‘வீடு’ எனப் பாதுகாக்கிறது; இயக்கத்தின் உள்ள்நோக்கை ‘வீட்டிற்குள்’ இயல்பாகத் தெரிவிக்கிறது.
- source_word: אֶשְׁתַּחֲוֶה
  choice: பணிந்துகொள்வேன்
  rationale: வினைச்சொல்லின் உடலைத் தாழ்த்திப் பணியும் அடிப்படைப் படிமத்தைப் பாதுகாக்கிறது; சூழலில் வழிபாட்டையும் இயல்பாக உணர்த்துகிறது.
- source_word: אֶל הֵיכַל קָדְשְׁךָ
  choice: உமது பரிசுத்த ஆலயத்தை நோக்கி
  rationale: אֶל என்பதன் திசைநோக்கை ‘நோக்கி’ தெளிவாக்குகிறது. הֵיכַל இச்சூழலில் இறைவனுடைய ஆலயத்தைக் குறிக்கிறது; קֹדֶשׁ அதன் பரிசுத்தத் தன்மையைச் சுட்டுகிறது.
- source_word: בְּיִרְאָתֶךָ
  choice: உமக்குப் பயந்து
  rationale: יִרְאָה என்பதில் பயம், பயபக்தி, பிரமிப்பு ஆகிய பரப்புகள் உள்ளன. ‘பயந்து’ என்பது எபிரெயச் சொல்லின் எடையைத் தணிக்காமல், தமிழில் இறைவன் முன்னிலையிலான பணிவான அச்சத்தை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: வழிபாட்டுச் சூழலில் חֶסֶד என்பதன் பொருள்
  choice: மாறாத அன்பு
  alternative: உடன்படிக்கை உண்மைத்தன்மை; இரக்கம்
  rationale: இறைவனுடைய இல்லத்தை அணுகுவதற்கான அடிப்படையாக அவரது நிலைத்த, விசுவாசமுள்ள அன்பை வசனம் வைக்கிறது. ‘மாறாத அன்பு’ பாசத்தையும் நிலைத்தன்மையையும் காக்கிறது; அதேவேளையில் ‘உடன்படிக்கை’ என்பதை மூலத்தில் வெளிப்படையாக இருப்பதைவிட அதிகமாக்குவதில்லை.
- issue: இறைவன் முன்னிலையில் יִרְאָה என்பதன் நுண்பொருள்
  choice: உமக்குப் பயந்து
  alternative: உம்மீது பயபக்தியுடன்; உம்மைக் குறித்து பிரமிப்புடன்
  rationale: இது வெறும் திகிலாகவோ சாதாரண மரியாதையாகவோ சுருக்கப்படாமல், பரிசுத்தமான அச்சம், பயபக்தி, பிரமிப்பு ஆகியவற்றுக்கிடையிலான மூலமொழியின் அழுத்தத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வழிபாட்டுக்குரிய கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘உமது/உமக்கு’ என்ற மரியாதை ஒருமை இறைவனை நோக்கிய உயர்வான தொனியைத் தருகிறது. இரு அடிக்குறிப்பு குறிகளும் அவை விளக்கும் சொற்றொடர்களின் உடனேயே வைக்கப்பட்டுள்ளன.
