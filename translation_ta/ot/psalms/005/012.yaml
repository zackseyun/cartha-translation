  yaml_path: translation/ot/psalms/005/012.yaml
  text: For you bless the righteous[a], O Yahweh; like a shield, favor surrounds him.
translation:
  language: ta
  text: ஏனெனில், யாவே, நீர் நீதிமானை ஆசீர்வதிக்கிறீர்; உமது தயவு அவனை ஒரு கேடயம்போல் சூழ்ந்துகொள்கிறது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உமது தயவு அவனுக்கு ஒரு கேடயம்போல் முடிசூட்டுகிறது.” எபிரெய வினைச்சொல் “முடிசூட்டு” அல்லது “சுற்றிலும் சூழ்” எனப் பொருள்படலாம்; கேடய உருவகம் பாதுகாப்பாகச் சூழ்வதை ஆதரிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய வேண்டுதலுக்கும் நம்பிக்கைக்கும் அடிப்படையை அறிமுகப்படுத்தும் காரணப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: תְּבָרֵךְ
  choice: ஆசீர்வதிக்கிறீர்
  rationale: இங்கு imperfect வடிவம் தேவனுடைய வழக்கமானதும் உறுதியானதுமான செயலைக் குறிக்கிறது; நிகழ்காலத் தமிழ் அந்த நம்பிக்கையை இயல்பாகத் தருகிறது.
- source_word: צַדִּיק
  choice: நீதிமானை
  rationale: ஒரு வகுப்பை பிரதிநிதித்துவப்படுத்தும் ஒருமை substantival adjective-ஐத் தமிழில் இயல்பான பொதுமை ஒருமையாகப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருப்பெயரை பொதுப்பட்டமாக மாற்றாமல், எபிரெய மெய்யெழுத்துப் பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: כַּצִּנָּה
  choice: ஒரு கேடயத்தைப் போல
  rationale: כְּ ஒப்புமையையும் צִנָּה-வின் பாதுகாப்புக் கேடய உருவகத்தையும் தெளிவாகக் காக்கிறது; அதன் பெரிய அளவு பிரதான உரையில் தேவையற்ற வகையில் குறிப்பாக்கப்படவில்லை.
- source_word: רָצוֹן
  choice: உமது தயவால்
  rationale: இச்சூழலில் தேவனுடைய சாதகமான மனப்பான்மையைக் குறிக்கிறது; வினையின் இரண்டாம் நபர் எழுவாயுடன் அதன் பாதுகாப்புச் செயல்பாட்டை இயல்பான தமிழில் இணைக்கிறது.
- source_word: תַּעְטְרֶנּוּ
  choice: அவனைச் சூழ்ந்துகொள்கிறீர்
  rationale: வினை ‘முடிசூட்டு’ அல்லது ‘சுற்றிவளை’ எனப் பொருள்படலாம்; கேடய உருவகம் பாதுகாப்பாகச் சூழ்வதை இங்கு வலுப்படுத்துகிறது. மாற்றுப் பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: யெகோவா
  rationale: மூல உரை திருப்பெயரை நேரடியாகப் பயன்படுத்துவதால், அதை ‘ஆண்டவர்’ என்ற பட்டமாக மாற்றாமல் ஒலிபெயர்த்து வழங்குகிறது.
- issue: தயவு செயல்படும் உருவகம்
  choice: தயவால் கேடயத்தைப் போலச் சூழ்தல்
  alternative: தயவு கேடயத்தைப் போல முடிசூட்டுதல்
  rationale: கேடய உருவகம் பாதுகாப்பான சுற்றிவளைப்பை ஆதரிக்கிறது; ஆயினும் ‘முடிசூட்டுதல்’ என்ற உண்மையான சொற்பொருள் வாய்ப்பு அடிக்குறிப்பில் விடப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில் மரியாதை ஒருமை வினைவடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. கவிதைநயமும் மூலத்தின் இரண்டாம் நபர் நேரடி அழைப்பும் காக்கப்பட்டுள்ளன; அரிதான அல்லது சமயப்பிரிவுக்கே உரிய சொற்கள் தவிர்க்கப்பட்டுள்ளன.
