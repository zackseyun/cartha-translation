  yaml_path: translation/ot/psalms/005/004.yaml
  text: For you are not a God who delights in wickedness[a]; evil may not dwell with you.
translation:
  language: ta
  text: ஏனெனில், நீர் அக்கிரமத்தில் மகிழ்ச்சியடையும் கடவுள் அல்லர்; தீமை[a] உம்மோடு தங்காது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தீயவன் உம்மோடு தங்கமாட்டான்” / “தீமை செய்பவன் எவனும் உம்மோடு தங்கமாட்டான்.”
    reason: רָע என்பது அருவமான ‘தீமை’ என்பதையும் ஆள்சார் ‘தீயவன்’ என்பதையும் குறிக்கக்கூடியதால் மாற்று வாசிப்பு தரப்படுகிறது.
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய வேண்டுகோளுக்கான காரணத்தை அறிமுகப்படுத்துகிறது; சங்கீதத்தின் வாத ஓட்டத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֵל
  choice: கடவுள்
  rationale: நேரடியாக உண்மையான கடவுளைக் குறிப்பிடும் பொதுவான, நவீனத் தமிழ் சொல்.
- source_word: חָפֵץ
  choice: மகிழ்ச்சியடையும்
  rationale: வெறுமனே விரும்புவதைவிட, ஒன்றில் இன்பம் காணுதல் அல்லது அதற்கு ஆதரவு காட்டுதல் என்ற உணர்வைத் தருகிறது.
- source_word: רֶשַׁע
  choice: அக்கிரமம்
  rationale: தார்மீகக் கேட்டையும் குற்றத்தன்மையையும் குறிக்கும் அருவப் பெயராக இருப்பதால், பொதுவான ‘தீங்கு’ என்ற பொருளுக்குச் சுருக்காமல் மூலத்தின் நெறிசார் வலிமையைத் தக்கவைக்கிறது.
- source_word: יְגֻרְךָ
  choice: உம்மோடு தங்காது
  rationale: גור என்பது விருந்தினராகத் தங்குதல் அல்லது சிறிதுகாலம் குடியிருத்தல் என்பதைக் குறிக்கிறது. இங்கு கடவுளின் சமூகத்தில் தீமைக்கு இடமில்லை என்ற விலக்குதலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: רָע
  choice: தீமை
  rationale: இச்சொல் அருவமான தீமையையோ தீய மனிதனையோ குறிக்கலாம். ‘அக்கிரமம்’ என்பதுடனான இணைநிலை காரணமாக அருவப் பொருள் முதன்மை உரையில் வைக்கப்படுகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: רָע என்பது ‘தீமை’ என்ற அருவப் பொருளிலா, ‘தீயவன்/தீமை செய்பவன்’ என்ற ஆள்சார் பொருளிலா மொழிபெயர்க்கப்பட வேண்டும்?
  choice: தீமை
  alternative: தீயவன் / தீமை செய்பவன்
  rationale: எபிரெயச் சொல் பெயர்ச்சொல்லாகப் பயன்படும் பெயரடையாக இருப்பதால் இரு வாசிப்புகளுக்கும் இடமுண்டு. முந்தைய ‘அக்கிரமம்’ என்பதுடனான இணைநிலை அருவ வாசிப்பை ஆதரிக்கிறது; அடுத்த வசனம் தீமை செய்பவர்களை வெளிப்படையாகக் குறிப்பிடுகிறது. ஆகவே தெளிவின்மையை நீக்காமல் மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கடவுளை நேரடியாக அழைக்கும் மரியாதை ஒருமை வடிவங்களான ‘நீர்’, ‘உம்மோடு’ பயன்படுத்தப்பட்டுள்ளன. மொழிநடை கண்ணியமாகவும் சாதாரண வாசகர்களுக்கு எளிதில் புரியத்தக்கதாகவும் வைக்கப்பட்டுள்ளது.
