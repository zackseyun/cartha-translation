  yaml_path: translation/ot/psalms/005/010.yaml
  text: Declare them guilty[a], O God; let them fall by their own counsels. Drive them away because of their many transgressions[b], for they have rebelled against you.
translation:
  language: ta
  text: 'கடவுளே, அவர்களைக் குற்றவாளிகளாகத் தீர்ப்பிடும்;

    அவர்களுடைய திட்டங்களாலேயே அவர்கள் வீழட்டும்.[a]

    அவர்களுடைய பல மீறுதல்களினால் அவர்களைத் துரத்தி அகற்றும்;[b]

    ஏனெனில் அவர்கள் உமக்கு எதிராகக் கலகம் செய்திருக்கிறார்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுடைய திட்டங்களினின்று அவர்கள் வீழட்டும்”; அதாவது, அவர்களுடைய திட்டங்களே அவர்களின் அழிவுக்கு வழிவகுக்கட்டும்.
    reason: lexical_alternative
  - marker: b
    text: “துரத்தி அகற்றும்” என்பதை “வெளியேற்றும்” அல்லது “நாடுகடத்தும்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֲשִׁימֵם
  choice: அவர்களைக் குற்றவாளிகளென்று தீர்ப்பளியும்
  rationale: אשם என்பதன் ஹிஃபில் கட்டளை வடிவம், அவர்களைச் சட்டநீதிசார் பொருளில் குற்றமுள்ளவர்களெனத் தீர்க்கும்படி கடவுளிடம் வேண்டுகிறது. ‘குற்றவாளிகளென்று தீர்ப்பளியும்’ என்பது தண்டனையின் வடிவத்தை மேலதிகமாகக் குறிப்பிடாமல் அந்த நீதித்துறைப் பொருளைக் காக்கிறது.
- source_word: אֱלֹהִים
  choice: கடவுளே
  rationale: இது ஜெபத்தில் வரும் நேரடி விளி; நவீனத் தமிழில் இயல்பான, கண்ணியமான அழைப்பாக ‘கடவுளே’ அமைகிறது.
- source_word: יִפְּלוּ
  choice: அவர்கள் வீழட்டும்
  rationale: வேண்டுதலைக் குறிக்கும் யுஸ்ஸிவ் தன்மையுள்ள நிறைவுறா வினை. இதை முன்னறிவிப்பாக மாற்றாமல், கடவுளிடம் முன்வைக்கப்படும் நேரடியான வேண்டுதலாக மொழிபெயர்க்கிறது.
- source_word: מִמֹּעֲצוֹתֵיהֶם
  choice: தங்களுடைய திட்டங்களாலேயே
  rationale: מוֹעֵצוֹת என்பது ஆலோசனைகள் அல்லது திட்டங்களைக் குறிக்கிறது. מן காரணம், வழிமுறை அல்லது பிரிவைச் சுட்டலாம்; இச்சூழலில் அவர்களுடைய திட்டங்களே அவர்களின் வீழ்ச்சிக்குக் காரணமாவதைக் ‘-ஆலேயே’ இயல்பாக வெளிப்படுத்துகிறது. மாற்றுப் பொருள் அடிக்குறிப்பில் காக்கப்பட்டுள்ளது.
- source_word: בְּרֹב פִּשְׁעֵיהֶם
  choice: அவர்களுடைய ஏராளமான மீறுதல்களினிமித்தம்
  rationale: בְּ இங்கு காரணப் பொருளையும் רֹב மிகுதி அல்லது பெருக்கத்தையும் தருகிறது. פֶּשַׁע என்பது மீறுதலையும் கலகத்தன்மையையும் குறிக்கும்; ‘மீறுதல்கள்’ அதன் அறநெறிசார் கனத்தைத் தக்கவைக்கிறது.
- source_word: הַדִּיחֵמוֹ
  choice: அவர்களைத் துரத்தியடியும்
  rationale: נדח என்பதன் ஹிஃபில் கட்டளை வடிவம் ஒருவரை அகற்றுதல், விரட்டுதல் அல்லது வெளியேற்றுதல் என்ற வலுவான பொருளைக் கொண்டது. ‘துரத்தியடியும்’ வேண்டுதலின் தீவிரத்தைக் காக்கும் இயல்பான தமிழ்.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய வேண்டுதல்களுக்கான காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: מָרוּ בָךְ
  choice: அவர்கள் உமக்கு எதிராகக் கலகம் செய்திருக்கிறார்கள்
  rationale: מרה உடன் வரும் בְּ கடவுளுக்கு எதிரான கலகத்தைக் குறிக்கிறது. ‘கலகம் செய்திருக்கிறார்கள்’ என்பது செயற்பாட்டின் தீவிரத்தையும் நிறைவேறிய நிலையும் தெளிவாகத் தருகிறது.
theological_decisions:
- issue: தீர்ப்பைக் கோரும் ஜெப மொழி
  choice: தெய்வீகத் தீர்ப்புக்கான நேரடி வேண்டுதல்களாகவே வைக்கப்பட்டது.
  alternative: அவற்றை எதிர்காலத்தைப் பற்றிய முன்னறிவிப்புகளாக அல்லது மென்மையான ஒழுக்க வேண்டுதல்களாக மாற்றுதல்.
  rationale: எபிரெய உரையில் கட்டளை வடிவங்களும் யுஸ்ஸிவ் தன்மையுள்ள வினையும் கடவுளை நோக்கிப் பயன்படுத்தப்பட்டுள்ளன. அவற்றைத் தணிக்காமல் மொழிபெயர்ப்பது சங்கீதத்தின் உண்மையான இறையியல் பதற்றத்தைக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், ஜெபத்திற்கேற்ற கண்ணியமான நடையும் நேரடியான கவிதை வரியமைப்பும் பயன்படுத்தப்பட்டுள்ளன. கடவுளை நோக்கி ‘உமக்கு’ என்ற மரியாதை ஒருமை வடிவம் வைக்கப்பட்டுள்ளது; நீதித்தீர்ப்பின் கடுமை மென்மையாக்கப்படவில்லை.
