base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/003.yaml
  text: Yahweh[a], in the morning you hear my voice[b]; in the morning I lay my request before you and watch expectantly.
translation:
  language: ta
  text: யாவே, காலையில் என் குரலைக் கேட்பீர்; காலையில் என் வேண்டுதலை உம்முன் வைப்பேன்[a]; எதிர்பார்த்துக் காத்திருப்பேன்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உமக்காக ஒழுங்குபடுத்துவேன்.” எபிரெய வினைச்சொல் ஒழுங்குபடுத்துதல் அல்லது முன்வைத்தல் என்று பொருள்படலாம். ஒழுங்குபடுத்தப்படுவது என்ன என்பது மூலத்தில் வெளிப்படையாகக் கூறப்படவில்லை; இங்கு அது ஜெபம் அல்லது வேண்டுதலை இறைவன்முன் வைப்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “எதிர்பார்ப்புடன் கவனித்திருப்பேன்.” எபிரெய வினைச்சொல் கவனித்தல், நோக்கிக் காத்திருத்தல், நம்பிக்கையோடு எதிர்பார்த்தல் ஆகிய பொருள்களைத் தரலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைவனின் தனிப்பட்ட உடன்படிக்கைப் பெயரை ஒரு பட்டப்பெயராக மாற்றாமல், எபிரெய வடிவின் ஒலிபெயர்ப்பாகத் தருகிறது.
- source_word: בֹּקֶר
  choice: காலையில்
  rationale: காலத்தைக் குறிக்கும் வினையடைப் பயன்பாட்டை இயல்பான தமிழில் தருகிறது; மூலத்திலுள்ள வலியுறுத்தலைக் காக்க இரு இடங்களிலும் மீண்டும் வருகிறது.
- source_word: תִּשְׁמַע
  choice: கேட்பீர்
  rationale: Qal imperfect வடிவிலுள்ள உறுதியான எதிர்பார்ப்பை மரியாதையான, இயல்பான தமிழில் வெளிப்படுத்துகிறது; இது பழக்கமான நிகழ்காலமாகவும் எதிர்கால உறுதியாகவும் புரிந்துகொள்ள இடமளிக்கிறது.
- source_word: קוֹלִי
  choice: என் குரலை
  rationale: ‘என் கூக்குரலை’ என்று தீவிரத்தைச் சேர்க்காமல், קוֹל என்பதன் நேரடியான பொருளைத் தக்கவைக்கிறது.
- source_word: אֶעֱרָךְ לְךָ
  choice: என் வேண்டுதலை உம்முன் வைப்பேன்
  rationale: ערך என்பதன் ‘ஒழுங்குபடுத்து/முன்வை’ என்ற கருத்தை ஜெபச் சூழலில் தெளிவான தமிழில் தருகிறது. மூலத்தில் செயப்படுபொருள் வெளிப்படையாக இல்லாததால் மாற்று நேரடி வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וַאֲצַפֶּה
  choice: எதிர்பார்த்துக் காத்திருப்பேன்
  rationale: צפה என்பதிலுள்ள கவனித்தல், நோக்கிக் காத்திருத்தல், நம்பிக்கையோடு எதிர்பார்த்தல் ஆகிய நுணுக்கங்களை ஜெபச் சூழலுக்கு இயல்பாகத் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல வசனம் நான்கு எழுத்துகளாலான இறைப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. அதை ஒரு பட்டப்பெயரால் மாற்றாமல் தனிப்பட்ட பெயராக ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைக் காக்கிறது.
- issue: אֶעֱרָךְ என்பதன் மறைந்த செயப்படுபொருள்
  choice: என் வேண்டுதலை உம்முன் வைப்பேன்
  alternative: உமக்காக ஒழுங்குபடுத்துவேன்
  rationale: ஜெபச் சூழல் மறைந்த செயப்படுபொருள் வேண்டுதல் அல்லது விண்ணப்பம் என்பதைச் சுட்டுகிறது; எனினும் எபிரெயத்தில் அது வெளிப்படையாக இல்லை என்பதால் அடிக்குறிப்பில் அதிக நேரடியான மாற்று தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, மரியாதையும் கவிதைநயமும் கொண்ட தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘உம்முன்’, ‘கேட்பீர்’ ஆகிய வடிவங்கள் இறைவனிடம் நேரடியாகப் பேசும் சங்கீதத்தின் கண்ணியமான தொனியைத் தக்கவைக்கின்றன; அரிதான அல்லது சமயப்பிரிவுக்கே உரிய சொற்கள் தவிர்க்கப்பட்டுள்ளன.
