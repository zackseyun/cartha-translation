base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/009.yaml
  text: For there is nothing trustworthy in their mouth[a]; their inward part is destruction. Their throat is an open grave[c][b]; with their tongue they flatter.
translation:
  language: ta
  text: ஏனெனில், அவர்களுடைய வாயில் நம்பத்தகுந்தது எதுவுமில்லை[a]; அவர்களுடைய அகமோ அழிவே[b]. அவர்களுடைய தொண்டை திறந்த கல்லறை; தங்கள் நாவால் அவர்கள் முகஸ்துதி பேசுகிறார்கள்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் இங்கு ஒருமைச் சுட்டுவடிவம் இருப்பதால், “அவனுடைய வாயில் நம்பத்தகுந்தது எதுவுமில்லை” என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
  - marker: b
    text: அல்லது “அவர்களுடைய உள்ளார்ந்த நிலை அழிவே” அல்லது “அவர்களுடைய உள்ளம் கேடே.”
    reason: lexical_alternative
  - marker: c
    text: அல்லது “தங்கள் நாவால் அவர்கள் நயமாகப் பேசுகிறார்கள்.” எபிரெயச் சொல் பேச்சை மென்மையாக்குவதைக் குறிக்கிறது; இச்சூழலில் அது முகஸ்துதியான அல்லது வஞ்சகமான பேச்சைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்திய வேண்டுதலுக்கான காரணத்தை அறிமுகப்படுத்தும் தொடர்புச் சொல்லாக இயல்பாக அமைகிறது.
- source_word: אֵין ... נְכוֹנָה
  choice: நம்பத்தகுந்தது எதுவுமில்லை
  rationale: பேச்சில் உறுதியான அல்லது நம்பகமான ஒன்று முற்றிலும் இல்லை என்ற பொருளை நவீன தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: בְּפִיהוּ
  choice: அவர்களுடைய வாயில்
  rationale: எபிரெய வடிவம் ஒருமையாக இருந்தாலும், தொடர்ந்து வரும் பன்மைச் சுட்டுகளும் கூட்டாகக் குறிப்பிடப்படும் பொல்லாதவர்களும் பன்மை மொழிபெயர்ப்பைச் சூழலுக்கு ஏற்றதாக்குகின்றன; ஒருமை மாற்று அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- source_word: קִרְבָּם
  choice: அவர்களுடைய உள்ளம்
  rationale: அவர்களின் அகநிலையைக் குறிக்கும் எபிரெய உருவகத்தை இயல்பான தமிழில் தருகிறது; இதை ஒரு குறிப்பிட்ட மனத்திறனாக மட்டும் குறுக்கவில்லை.
- source_word: הַוּוֹת
  choice: அழிவே
  rationale: அழிவு, கேடு, அழிவை விளைவிக்கும் திட்டங்கள் ஆகிய பொருள் பரப்பைக் கொண்ட பன்மைச் சொல்லின் இங்கு வரும் வலியுறுத்தும் பயனைக் தமிழில் ஒருமைத் தொகுப்புப் பெயராக இயல்பாகத் தருகிறது.
- source_word: קֶבֶר פָּתוּחַ
  choice: திறந்த கல்லறை
  rationale: அவர்களுடைய பேச்சின் கொடியதும் கேடுண்டாக்குவதுமான தன்மையைச் சித்தரிக்கும் மூல உருவகத்தை நேரடியாகப் பாதுகாக்கிறது.
- source_word: גְּרוֹנָם
  choice: அவர்களுடைய தொண்டை
  rationale: பேச்சைக் குறிக்கும் உடலுறுப்பு உருவகத்திற்கு இயல்பான, நேரடியான தமிழ் சொல்.
- source_word: לְשׁוֹנָם
  choice: தங்கள் நாவால்
  rationale: செய்பவர்களையே திரும்பச் சுட்டும் தமிழின் இயல்பான வடிவம்; எபிரெய மொழியின் கூட்டொருமை உருவகத்தையும் காக்கிறது.
- source_word: יַחֲלִיקוּן
  choice: முகஸ்துதி செய்கிறார்கள்
  rationale: சொற்களை மென்மையாக்குதல் என்ற சொல்லுருவம் இச்சூழலில் வஞ்சகமான புகழ்ச்சியைக் குறிக்கிறது; தமிழ் வாசகருக்கு நோக்கத்தைத் தெளிவாகத் தருகிறது.
theological_decisions:
- issue: קִרְבָּם என்பதிலுள்ள மனித அகநிலை உருவகம்
  choice: அவர்களுடைய உள்ளம்
  alternative: அவர்களுடைய அகமெல்லாம் / அவர்களுக்குள் இருப்பதெல்லாம்
  rationale: உள்ளார்ந்த சீர்கேடு பேச்சில் வெளிப்படுவதைச் சொல்கிறது. ‘இதயம்’ என்று குறிப்பிட்ட ஓர் உறுப்புக்கோ திறனுக்கோ பொருளைக் குறுக்காமல், கவிதை உருவகத்தை இயல்பாக வைத்திருக்கிறது.
- issue: בְּפִיהוּ என்பதின் எண்ணும் சூழலிலுள்ள கூட்டுக் குறிப்பும்
  choice: அவர்களுடைய வாயில்
  alternative: அவனுடைய வாயில்
  rationale: மசோரா வடிவத்தின் ஒருமையை அடிக்குறிப்பில் வெளிப்படையாக வைத்தபடியே, தொடர்ந்து வரும் பன்மைச் சுட்டுகளுடன் முதன்மை உரை இசைவாக அமைகிறது. இதனால் எந்தக் கோட்பாட்டு முடிவும் இறக்குமதி செய்யப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதக் கவிதைக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘திறந்த கல்லறை’ என்ற வலுவான மூல உருவகம் அப்படியே காக்கப்பட்டுள்ளது. வாக்கியம் சாதாரண வாசகருக்குப் புரியும் வகையில் இயல்பாக அமைந்தாலும், ஒருமை/பன்மை வேறுபாடும் ‘மென்மையாக்கிப் பேசுதல்’ என்ற சொற்பொருள் நுணுக்கமும் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
