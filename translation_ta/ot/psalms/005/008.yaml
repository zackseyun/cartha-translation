revisions:
- from: யாவே, என் பகைவர்களின் நிமித்தம்[a] உமது நீதிக்கேற்ப என்னை நடத்தும்; உமது வழியை எனக்கு முன்பாக நேராக்கும்[b].
  to: யாவே, என் பகைவர்களின் காரணமாக உமது நீதிக்கேற்ப என்னை நடத்தும்; உமது வழியை எனக்கு முன்பாக நேராக்கும்.
  rationale: 'The verse is retained apart from replacing ‘நிமித்தம்’ with the more explicit modern causal phrase ‘காரணமாக.’ The necessary correction is in footnote [a]: ‘எனக்காக’ is changed to ‘என்னைப்’ so that the hostile-watcher nuance agrees with the Hebrew and does not invert the meaning. Footnote anchors remain correctly attached to the adversaries phrase ([a]) and the straight-way phrase ([b]).'
