source:
  edition: WLC
  text: יְהוָ֤ה נְחֵ֬/נִי בְ/צִדְקָתֶ֗/ךָ לְמַ֥עַן שׁוֹרְרָ֑/י הושר לְ/פָנַ֣/י דַּרְכֶּֽ/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/008.yaml
  text: O Yahweh[a], lead me in your righteousness because of my enemies[b]; make your way straight before me.
translation:
  language: ta
  text: யாவே, என் பகைவர்களின் காரணமாக உமது நீதிக்கேற்ப என்னை நடத்தும்; உமது வழியை எனக்கு முன்பாக நேராக்கும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: தேவனுடைய தனிப்பெயரைத் தமிழில் இயல்பான அழைப்புமுறை வடிவில் ஒலிபெயர்க்கிறது; பொதுப்பட்டமான ‘கர்த்தர்’ என்பதைக் கொண்டு தனிப்பெயரை மறைக்கவில்லை.
- source_word: נְחֵנִי
  choice: என்னை நடத்தும்
  rationale: נחה என்பதன் வழிநடத்துதல் என்ற பொருளையும் சங்கீதத்தின் வேண்டுதல் தொனியையும் இயல்பான தமிழில் தருகிறது.
- source_word: בְצִדְקָתֶךָ
  choice: உமது நீதிக்கேற்ப
  rationale: ב இங்கு தேவனுடைய நீதியை வழிநடத்துதலின் அடிப்படை அல்லது அளவுகோலாகக் காட்டக்கூடும். சொல்லுக்குச் சொல் ‘உமது நீதியில்’ என்பதைவிட இவ்வடிவம் நவீன தமிழில் தெளிவாக உள்ளது.
- source_word: לְמַעַן
  choice: நிமித்தம்
  rationale: பகைவர்கள் உருவாக்கும் சூழ்நிலையை வேண்டுதலுக்கான காரணமாகக் காட்டும் எபிரெயச் சொல்லின் பொருளைப் பாதுகாக்கிறது.
- source_word: שׁוֹרְרָי
  choice: என் பகைவர்கள்
  rationale: சூழலில் hostile adversaries என்பதே தெளிவான மையப்பொருள்; பதுங்கிக் கவனிப்பவர்கள் என்ற குறிப்பான நிழற்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: הושר
  choice: நேராக்கும்
  rationale: ישר என்பதன் causative வடிவிலுள்ள ‘நேராக/செவ்வையாக ஆக்கு’ என்ற பாதை உருவகத்தை நேரடியாகத் தருகிறது.
- source_word: לְפָנַי
  choice: எனக்கு முன்பாக
  rationale: இடத்தையும் உருவகமான வழிகாட்டுதலையும் இயல்பாகத் தெரிவிக்கிறது.
- source_word: דַּרְכֶּךָ
  choice: உமது வழி
  rationale: דרך என்பதிலுள்ள பாதை, நடத்தை, வாழ்க்கைநெறி ஆகிய ஒலிப்புகளைத் திறந்தவாறே வைத்திருக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைபெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தாவே / யெகோவாவே
  rationale: மூலத்தில் வரும் உடன்படிக்கைத் தனிப்பெயரை ஒரு பொதுப்பட்டமாக மாற்றாமல் வெளிப்படையாகப் பாதுகாக்கிறது.
- issue: צדקה என்பதன் பொருள்
  choice: நீதி
  alternative: நியாயம்
  rationale: இங்கு குறிப்பாக நீதித்தீர்ப்பு மட்டுமல்லாமல் தேவனுடைய நேர்மையான பண்பும் செயல்முறையும் வேண்டுதலின் அடிப்படையாக உள்ளதால் விரிவான ‘நீதி’ பொருத்தமானது.
translation_notes:
  register: நவீனத் தரத் தமிழில், வேண்டுதல் சங்கீதத்திற்கேற்ற கண்ணியமான ஒருமை மரியாதை நடையில் அமைக்கப்பட்டுள்ளது. ‘நடத்தும்’, ‘நேராக்கும்’ ஆகிய வடிவங்கள் பாரம்பரிய இறைவேண்டுதல் தொனியைத் தக்கவைத்தும் சாதாரண வாசகருக்குப் புரியத்தக்கவாறும் உள்ளன. ஆங்கில ஆலோசனை உரையில் அடிக்குறிப்பு குறியீடுகள் கருத்துகளுடன் பொருந்தாமல் இடம்பெயர்ந்திருந்ததால், [a] பகைவர்களுக்கும் [b] வழியை நேராக்குவதற்கும் பொருத்தமாக இணைக்கப்பட்டன.
