lexical_decisions:
- source_word: יִתְיַצְּבוּ
  choice: நிலைநிற்க மாட்டார்கள்
  rationale: יצב என்பதன் ஹித்பயேல் வடிவம் ஒருவர் தம்மை நிறுத்திக்கொள்வதையோ ஒரு முன்னிலையில் வந்து நிற்பதையோ குறிக்கிறது. இங்கு இறைவனின் முன்னிலையில் நிலைத்திருக்க இயலாமை என்ற பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: הוֹלְלִים
  choice: பெருமை பேசுவோர்
  rationale: இந்தச் சூழலில் இச்சொல் வெறும் அறிவின்மையை அல்ல, வீண்பெருமையும் இறுமாப்பும் கொண்டவர்களைக் குறிக்கிறது. ‘பெருமை பேசுவோர்’ என்பது அந்த ஒழுக்கநிலையைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: לְנֶגֶד עֵינֶיךָ
  choice: உமது கண்முன்
  rationale: எபிரெயச் சொற்றொடரின் ‘உமது கண்களுக்கு முன்’ என்ற தெளிவான காட்சிப்படிமத்தை இயல்பான தமிழில் காத்து, இறைவனின் பார்வை அல்லது முன்னிலை என்ற பொருளையும் தருகிறது.
- source_word: שָׂנֵאתָ
  choice: நீர் வெறுக்கிறீர்
  rationale: எபிரெய வினை நேரடியாக ‘வெறுத்தல்’ என்று பொருள்படுகிறது. மூலத்தின் கடுமையான கூற்றை ‘எதிர்க்கிறீர்’ அல்லது ‘புறக்கணிக்கிறீர்’ என்று மென்மைப்படுத்தாமல் காக்கிறது.
- source_word: פֹּעֲלֵי אָוֶן
  choice: தீமை செய்கிற அனைவரையும்
  rationale: சொற்றொடர் אָוֶן எனப்படும் தீமை அல்லது அநீதியைச் செய்பவர்களைக் குறிக்கிறது. ‘தீமை செய்கிறவர்கள்’ என்பது செயற்பாட்டுப் பொருளையும் ஒழுக்கத் தீவிரத்தையும் தெளிவான நவீன தமிழில் தருகிறது; כָּל என்பதற்கான ‘அனைவரையும்’ என்பதும் வெளிப்படையாக வைக்கப்பட்டுள்ளது.
theological_decisions:
- issue: இறைவன் வெறுக்கிறார் என்ற மொழிநடை
  choice: ‘தீமை செய்கிற அனைவரையும் நீர் வெறுக்கிறீர்’ என்ற நேரடிக் கூற்றைத் தக்கவைத்தல்
  alternative: ‘நீர் எதிர்க்கிறீர்’ அல்லது ‘நீர் நிராகரிக்கிறீர்’ என்று மென்மைப்படுத்துதல்
  rationale: שָׂנֵאתָ என்பதன் நேரடிப் பொருள் ‘நீர் வெறுக்கிறீர்’ என்பதே. இறையியல் சிரமத்தை மொழிபெயர்ப்பில் மறைத்துவிடாமல், மனிதர்களாகிய தீமை செய்பவர்களையே இவ்வாக்கியம் வெறுப்பின் பொருளாகக் குறிப்பிடும் பதற்றத்தையும் அப்படியே காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டு மரியாதையைத் தக்கவைக்கும் வகையில் இறைவனை ‘நீர்/உமது’ என்று குறிப்பிடுகிறது. ‘கண்முன்’ என்ற இயல்பான சொல் மூலத்தின் காட்சிப்படிமத்தைக் காக்கிறது; வாக்கியத்தின் நேரடியான ஒழுக்க மற்றும் இறையியல் தீவிரம் மென்மைப்படுத்தப்படவில்லை.
