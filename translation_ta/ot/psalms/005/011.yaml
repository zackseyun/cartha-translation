theological_decisions:
- issue: வசனம் முழுவதிலும் வேண்டுதலா அல்லது முன்னறிவிப்பா
  choice: ‘மகிழ்வார்களாக’, ‘எழுப்புவார்களாக’, ‘விரிப்பீராக’, ‘களிகூருவார்களாக’ என வேண்டுதல்/விருப்ப வடிவில் மொழிபெயர்த்தல்
  alternative: ‘மகிழ்வார்கள்; மகிழ்ச்சிக் குரல் எழுப்புவார்கள்; நீர் பாதுகாப்பை விரிப்பீர்; களிகூருவார்கள்’ என எதிர்கால உறுதிக்கூற்றாக மொழிபெயர்த்தல்
  rationale: சங்கீதத்தின் மன்றாட்டு சூழலில் எபிரெய நிறைவேறாத வினைவடிவங்கள் வேண்டுதல் சார்ந்த பொருளை இயல்பாக ஏற்கின்றன. அதே நேரத்தில் அவை எதிர்கால நம்பிக்கையின் நிழற்பொருளையும் தாங்கலாம்; தேர்ந்த வடிவம் முதன்மையான மன்றாட்டு வலிமையை முன்னிறுத்துகிறது.
- issue: பாதுகாப்புக்கும் பின்னர் வரும் களிகூருதலுக்கும் இடையிலான தொடர்பு
  choice: இரு கூற்றுகளையும் இணையான வேண்டுதல்களாக அமைத்தல்
  alternative: ‘அதனால்’ அல்லது ‘அவ்வாறு’ என்று வெளிப்படையான காரண–விளைவு தொடர்பைச் சேர்த்தல்
  rationale: எபிரெயில் எளிய இணைப்புச் சொல் மட்டுமே உள்ளது. காரணத் தொடர்பு சூழலால் உணரப்படலாம்; ஆனால் அதை உரையில் வெளிப்படையாகச் சேர்ப்பது மூலத்திலுள்ள திறந்த தொடர்பைத் தேவையின்றி முடிவுசெய்யும்.
