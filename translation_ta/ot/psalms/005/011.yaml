  text: But let all who take refuge in you rejoice[a]; let them shout for joy forever. Spread your protection over them[b], so that those who love your name may exult in you.
translation:
  language: ta
  text: ஆனால் உம்மிடம் அடைக்கலம் புகும் அனைவரும் மகிழ்வார்களாக; அவர்கள் என்றென்றும் மகிழ்ச்சிக் குரல் எழுப்புவார்களாக.[a] நீர் அவர்கள்மேல் உமது பாதுகாப்பை விரிப்பீராக.[b] உமது பெயரை நேசிப்பவர்கள் உம்மில் களிகூருவார்களாக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவர்கள் என்றென்றும் மகிழ்ச்சியுடன் பாடுவார்களாக.’ எபிரெய வினைச்சொல் பேருவகையுடன் ஒலிக்கும் குரலைக் குறிக்கிறது; அதில் பாடுதலும் அடங்கலாம்.
    reason: lexical_alternative
