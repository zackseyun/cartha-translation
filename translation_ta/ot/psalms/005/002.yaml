lexical_decisions:
- source_word: הַקְשִׁיבָה
  choice: செவிசாய்த்தருளும்
  rationale: קשׁב என்பதன் கட்டளை வடிவம் கவனத்துடன் கேட்குமாறு வேண்டுகிறது. ‘செவிசாய்த்தருளும்’ என்பது அந்த வலியுறுத்தலை இயல்பான, கண்ணியமான தமிழ் வேண்டுதல் நடையில் தருகிறது.
- source_word: לְקוֹל שַׁוְעִי
  choice: என் உதவிக் கூக்குரலுக்கு
  rationale: קוֹל என்பது ‘ஒலி/குரல்’ என்றும் שַׁוְעָה என்பது துன்பத்தில் உதவி கோரி எழுப்பும் கூக்குரல் என்றும் பொருள்படும். தமிழில் தேவையற்ற இரட்டிப்பைத் தவிர்த்து, முழுக் கூறின் பொருளை ‘உதவிக் கூக்குரல்’ என இயல்பாகத் தருகிறது.
- source_word: מַלְכִּי
  choice: என் அரசரே
  rationale: முதல் நபர் உரிமை விகுதியையும் நேரடி விளிப்பையும் காக்கிறது; தேவனை அரசராக அழைக்கும் மூலப்படிமம் அப்படியே நிற்கிறது.
- source_word: וֵאלֹהָי
  choice: என் தேவனே
  rationale: தெய்வீகப் பட்டத்தையும் முதல் நபர் உரிமையையும் நேரடி அழைப்பாகத் துல்லியமாக வழங்குகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய வேண்டுகோளுக்கான காரணத்தை அறிமுகப்படுத்தும் இணைப்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: אֵלֶיךָ
  choice: உம்மிடமே
  rationale: ஜெபம் செலுத்தப்படும் திசையையும் தேவனையே நோக்கிய வலியுறுத்தலையும் ‘-மே’ என்பதன் மூலம் இயல்பாகப் பாதுகாக்கிறது.
- source_word: אֶתְפַּלָּל
  choice: நான் மன்றாடுகிறேன்
  rationale: פלל என்பதன் ஹித்பஅேல் வடிவம் இங்கு தேவனை நோக்கி ஜெபித்தல் அல்லது வேண்டுதல் என்பதைக் குறிக்கிறது. ‘மன்றாடுகிறேன்’ உடனடி வேண்டுதல் சூழலுக்கு இயல்பாக உள்ளது; எபிரெய வினைவடிவத்தின் காலத் திறந்தநிலை அடிக்குறிப்பில் காக்கப்படுகிறது.
theological_decisions:
- issue: தேவனை அரசராக நேரடியாக அழைத்தல்
  choice: என் அரசரே, என் தேவனே
  alternative: என் ராஜாவே, என் தேவனே
  rationale: மூலத்தில் உள்ள அரச மற்றும் தெய்வீக அழைப்புகள் இரண்டையும் எந்தப் பிற்கால கோட்பாட்டு விரிவாக்கமும் இன்றி பாதுகாக்கிறது. ‘அரசர்’ என்பது நவீன நிலையான தமிழில் இயல்பானதும் கண்ணியமானதும் ஆகும்.
- issue: אֶתְפַּלָּל என்பதன் காலம்/வினைநோக்கு
  choice: நான் மன்றாடுகிறேன்
  alternative: நான் மன்றாடுவேன்
  rationale: எபிரெய முற்றாத வினைவடிவம் சூழலைப் பொறுத்து நிகழ், தொடர்ச்சி, வழக்கம் அல்லது எதிர்காலச் செயலைக் குறிக்கலாம். உடனடி வேண்டுதல் சூழலில் நிகழ்கால வாசிப்பு இயல்பானது; எதிர்கால வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், தேவனை நோக்கிய கண்ணியமான ஒருமை மரியாதை வடிவங்களான ‘உம்மிடமே’ மற்றும் வேண்டுதல் நடையான ‘செவிசாய்த்தருளும்’ பயன்படுத்தப்பட்டுள்ளன. கவிதைநயத்தைத் தக்கவைத்தபடியே சாதாரண வாசகருக்குப் புரியும் சொற்கள் தேர்ந்தெடுக்கப்பட்டுள்ளன.
