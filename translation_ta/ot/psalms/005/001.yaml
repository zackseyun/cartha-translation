id: PSA.5.1
reference: Psalms 5:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: אֲמָרַ֖/י הַאֲזִ֥ינָ/ה יְהוָ֗ה בִּ֣ינָ/ה הֲגִֽיגִ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/001.yaml
  text: Give ear to my words[a], O Yahweh; understand my groaning.
translation:
  language: ta
  text: 'என் வார்த்தைகளுக்குச் செவிசாயும், யாவே;

    என் உள்ளக் குமுறலை[a] உணர்ந்துகொள்ளும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘என் தியானத்தை’ அல்லது ‘என் முணுமுணுப்பை.’ எபிரெயச் சொல் உள்ளார்ந்த சிந்தனையையோ மெல்லிய உச்சரிப்பையோ குறிக்கலாம்; இங்கு புலம்பல் சூழலுக்கு ஏற்ப ‘உள்ளக் குமுறல்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲמָרַי
  choice: என் வார்த்தைகள்
  rationale: אמר என்பதன் பன்மை வடிவத்துடன் முதலாம் நபர் ஒருமை உரிமை விகுதி சேர்ந்துள்ளது. ‘என் வார்த்தைகள்’ என்பது சங்கீதக்காரர் கூறும் சொற்களை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: הַאֲזִינָה
  choice: செவிசாயும்
  rationale: אזן வேரிலிருந்து வரும் வேண்டுகோள் வடிவம் கவனமாகக் கேட்பதைக் குறிக்கிறது. ‘செவிசாயும்’ என்பது எபிரெய உருவகத்தையும் மன்றாட்டின் தொனியையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது இறைவனின் தனிப்பெயரான நான்கு எழுத்துப் பெயர். பட்டப்பெயரால் மாற்றாமல், தமிழில் பரவலாகப் புரிந்துகொள்ளக்கூடிய ஒலிபெயர்ப்பாக ‘யாவே’ பயன்படுத்தப்படுகிறது.
- source_word: בִּינָה
  choice: உணர்ந்துகொள்ளும்
  rationale: בין வேரிலிருந்து வரும் இவ்வேண்டுகோள் வெறுமனே கேட்பதை அல்ல, உள்ளார்ந்த பொருளை உணர்ந்து கொள்வதைக் குறிக்கிறது. தமிழில் ‘உணர்ந்துகொள்ளும்’ இந்த நுணுக்கத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הֲגִיגִי
  choice: என் உள்ளக் குமுறல்
  rationale: הגיג என்பது உள்ளார்ந்த சிந்தனை, மெல்லிய முணுமுணுப்பு அல்லது வேதனையுடன் வெளிப்படும் தாழ்ந்த ஒலி ஆகியவற்றைக் குறிக்கலாம். புலம்பல் சூழலில் ‘உள்ளக் குமுறல்’ உணர்ச்சி வலிமையையும் உள்ளார்ந்த தன்மையையும் தெரிவிக்கிறது; பிற சாத்தியங்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலவசனம் இறைவனின் தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. அதை ஒரு பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் பெயர்சார் தன்மையைப் பாதுகாக்கிறது.
- issue: הֲגִיגִי என்பதன் உணர்ச்சி மற்றும் உள்ளார்ந்த தன்மை
  choice: என் உள்ளக் குமுறல்
  alternative: என் தியானம் / என் முணுமுணுப்பு
  rationale: புலம்பல் மன்றாட்டின் சூழல் வேதனையுடன் கூடிய உள்ளார்ந்த வெளிப்பாட்டைச் சுட்டுகிறது. இருப்பினும் சொல் அமைதியான சிந்தனையையோ மெல்லிய உச்சரிப்பையோ குறிக்கக்கூடியதால் அந்தத் தெளிவின்மை அடிக்குறிப்பில் வெளிப்படையாக வைக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும், அதேவேளை ஜெபத்திற்குரிய கண்ணியமான தொனியுடனும் அமைக்கப்பட்டுள்ளது. ‘செவிசாயும்’ மற்றும் ‘உணர்ந்துகொள்ளும்’ ஆகிய வேண்டுகோள் வடிவங்கள் கவிதைத் தன்மையையும் நேரடி மன்றாட்டையும் தக்கவைக்கின்றன.
