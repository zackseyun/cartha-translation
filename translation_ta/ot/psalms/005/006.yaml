    reason: lexical_alternative
lexical_decisions:
- source_word: תְּאַבֵּד
  choice: நீர் அழிக்கிறீர்
  rationale: אבד என்பதன் பியேல் வடிவம், கடவுளை இரண்டாம் நபர் ஆண்பால் ஒருமையில் நேரடியாகக் குறிப்பிட்டு, அழிவுறச் செய்வதை உணர்த்துகிறது. இச்சூழலில் நிகழ்காலம் கடவுளின் வழக்கமான செயலை இயல்பாக வெளிப்படுத்துகிறது; எதிர்காலப் பொருளும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: דֹּבְרֵי כָזָב
  choice: பொய்பேசுகிறவர்கள்
  rationale: சொல்லுக்கு நெருக்கமாக ‘பொய்யைப் பேசுகிறவர்கள்’ என்ற பொருள். ‘பொய்யர்கள்’ என்று சுருக்காமல், எபிரெயப் பதரின் வினைச்செயல் தன்மை காக்கப்பட்டுள்ளது.
- source_word: אִישׁ דָּמִים וּמִרְמָה
  choice: இரத்தஞ்சிந்துதலும் வஞ்சகமும் நிறைந்த மனிதன்
  rationale: ‘இரத்தங்களின் மனிதன்’ என்ற எபிரெய மரபுத்தொடர் இரத்தப்பழி அல்லது வன்முறையால் குறிக்கப்படுபவனைச் சுட்டுகிறது. וּמִרְמָה என்பதன் வஞ்சகம்/துரோகம் என்ற பரந்த பொருளில் ‘வஞ்சகம்’ தேர்ந்தெடுக்கப்பட்டது. தமிழில் இயல்பாகவும் இரு பண்புகளும் அந்த மனிதனை வரையறுப்பதாகவும் வெளிப்பட ‘நிறைந்த’ பயன்படுத்தப்பட்டது.
- source_word: יְתָעֵב
  choice: அருவருக்கிறார்
  rationale: תעב என்பதன் பியேல் வடிவம் கடும் வெறுப்பையும் ஒழுக்கரீதியான அருவருப்பையும் வெளிப்படுத்துகிறது; ‘அருவருக்கிறார்’ கவிதைநடையின் தீவிரத்தைக் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எழுத்துத் தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், நவீன தமிழில் பரவலாகவும் இயல்பாகவும் ஒலிக்கும் ‘யாவே’ என்று எழுத்துப்பெயர்ப்பு செய்யப்பட்டுள்ளது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட தெய்வீகப் பெயர் நேரடியாக உள்ளது. அதனைப் பட்டமாக மாற்றாமல் தமிழில் எழுத்துப்பெயர்ப்பது மூலத்தின் தன்மையைப் பாதுகாக்கிறது.
- issue: אִישׁ என்ற ஆண்பால் ஒருமை
  choice: மனிதன்
  alternative: ஒருவன் / நபர்
  rationale: எபிரெயம் ஆண்பால் ஒருமையைப் பயன்படுத்துகிறது. ‘மனிதன்’ அந்த வடிவைத் தக்கவைத்தபடியே நவீனத் தமிழில் இயல்பாக உள்ளது.
- issue: תְּאַבֵּד என்பதன் கால/நிலைப் பொருள்
  choice: நீர் அழிக்கிறீர்
  alternative: நீர் அழிப்பீர்
  rationale: இது கடவுளின் செயல்பாட்டைப் பற்றிய பொதுவான கூற்றாகவும் எதிர்காலச் செயலாகவும் கேட்கலாம். முதன்மை உரையில் சூழலுக்கேற்ற பொதுநிகழ்காலம் தேர்ந்தெடுக்கப்பட்டு, மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், இறைவனை நோக்கிய மரியாதைப் பன்மையையும் சங்கீதத்துக்கேற்ற கண்ணியமான கவிதைநடையையும் பயன்படுத்துகிறது. மூலத்தின் இரு இணையான அரையடிகளும் கடுமையான ஒழுக்கத் தொனியும் காக்கப்பட்டுள்ளன; காலப்பொருளின் உண்மையான தெளிவின்மை அடிக்குறிப்பில் தெரிவிக்கப்பட்டுள்ளது.
