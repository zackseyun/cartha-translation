  yaml_path: translation/ot/psalms/005/006.yaml
  text: You destroy those who speak lies[b][a]; Yahweh abhors a man of bloodshed and deceit.
translation:
  language: ta
  text: பொய் பேசுகிறவர்களை நீர் அழிக்கிறீர்[a]; இரத்தப்பழியும் வஞ்சகமும் கொண்ட மனிதனை யாவே அருவருக்கிறார்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பொய் பேசுகிறவர்களை நீர் அழிப்பீர்.” எபிரெய வினைச்சொல் எதிர்காலச் செயலாகவோ, கடவுளின் வழக்கமான செயலைக் குறிக்கும் பொதுக்கூற்றாகவோ புரிந்துகொள்ளப்படலாம்.
