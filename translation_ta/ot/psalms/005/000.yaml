  text: 'For the choirmaster: according to the flutes[a]. A psalm of David[b].'
translation:
  language: ta
  text: இசைக்குழுத் தலைவருக்கு; புல்லாங்குழல்களுக்கேற்ப[a]. தாவீதின் சங்கீதம்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “காற்றிசைக் கருவிகளுக்கேற்ப.” எபிரேயச் சொல் ஒரு தொழில்நுட்ப இசைக் குறிப்பாக இருக்கலாம்; பாரம்பரியமாக அது “நெகிலோத்” என மொழிபெயர்க்காமல் ஒலிபெயர்த்தும் வழங்கப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: “தாவீதின்” என்ற தலைப்பு, தாவீது இதை இயற்றினார் என்பதையோ, அவருக்கு அர்ப்பணிக்கப்பட்டது என்பதையோ, அவரோடு அல்லது தாவீதியத் தொகுப்போடு தொடர்புடையது என்பதையோ குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: பாடகர் தலைவருக்கு
  rationale: சங்கீதத் தலைப்புகளில் இச்சொல் இசை நிகழ்த்துதலை வழிநடத்தும் பொறுப்பாளரைக் குறிக்கிறது; தமிழில் வழிபாட்டு-இசைச் சூழலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֶל
  choice: இசைக்கேற்ப
  rationale: இசைத் தலைப்பில் இது மெட்டு, இசைமுறை அல்லது இசைக்கருவியை அறிமுகப்படுத்தலாம்; இங்கு தொழில்நுட்பப் பயன்பாட்டை மிகையாகக் குறுக்காமல் காட்டுகிறது.
- source_word: הַנְּחִילוֹת
  choice: புல்லாங்குழல்களின் இசை
  rationale: இச்சொல் புல்லாங்குழல்கள் அல்லது பொதுவாகக் காற்றிசைக் கருவிகளைக் குறிக்கலாம்; சரியான தொழில்நுட்பப் பொருள் உறுதியற்றதால் முதன்மை உரையில் சாத்தியமான பொருளும் அடிக்குறிப்பில் ஐயமும் தரப்படுகின்றன.
- source_word: מִזְמוֹר
  choice: சங்கீதம்
  rationale: இது எபிரேய வேதாகமத்தில் இசையுடன் பாடப்படும் சங்கீதத்திற்கான வழக்கமான தலைப்புச் சொல்; தமிழில் நிறுவப்பட்டும் இயல்பாகவும் உள்ளது.
- source_word: לְדָוִד
  choice: தாவீதின்
  rationale: எபிரேய לְ ஆசிரியத்துவம், அர்ப்பணம், தொடர்பு அல்லது தொகுப்புச் சார்பு ஆகியவற்றைக் குறிக்கக்கூடும்; ‘தாவீது எழுதிய’ என்று ஒரே பொருளைத் திணிக்காமல் ‘தாவீதின்’ அந்தத் தெளிவின்மையைத் தக்கவைக்கிறது.
theological_decisions:
- issue: לְדָוִד என்பதிலுள்ள உறவின் தன்மை
  choice: தாவீதின்
  alternative: தாவீது எழுதிய
  rationale: மூலத்தின் இலக்கண வடிவம் நேரடி ஆசிரியத்துவத்தை மட்டும் கட்டாயப்படுத்தாததால், ஆசிரியத்துவம், அர்ப்பணம் அல்லது தாவீதியத் தொகுப்புடனான தொடர்பு ஆகிய சாத்தியங்களைத் திறந்தவையாக வைத்திருக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் சுருக்கமான, கண்ணியமான சங்கீதத் தலைப்பாக வடிவமைக்கப்பட்டது. இசைத் தொழில்நுட்பச் சொல்லின் உறுதியின்மையும் לְדָוִד என்பதன் பலவகை உறவும் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
