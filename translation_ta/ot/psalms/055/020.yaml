  text: שָׁלַ֣ח יָ֭דָי/ו בִּ/שְׁלֹמָ֗י/ו חִלֵּ֥ל בְּרִיתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/020.yaml
  text: He stretched out his hands against those at peace with him[b][a]; he profaned his covenant.
translation:
  language: ta
  text: தன்னுடன் சமாதான உறவில் இருந்தவர்களுக்கு எதிராக அவன் தன் கைகளை நீட்டினான்[a]; தன் உடன்படிக்கையை மீறினான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தன் நண்பர்களுக்கு எதிராக’ அல்லது ‘தன் கூட்டாளிகளுக்கு எதிராக.’ எபிரெயச் சொற்றொடர் அவனுடன் சமாதான உறவில் இருந்தவர்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘தன் உடன்படிக்கையைத் தீட்டுப்படுத்தினான்.’ எபிரெய வினைச்சொல் இன்னும் சொல்லுக்குச் சொல்லாக, ‘தீட்டுப்படுத்தினான்’ அல்லது ‘தீட்டானதாக நடத்தினான்’ என்று பொருள்படும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלַח
  choice: நீட்டினான்
  rationale: יָדָיו என்பதுடன் வரும் இந்த வினை, பகைமையான நோக்கத்தோடு கைகளை நீட்டுவதைக் குறிக்கிறது. ‘தாக்கினான்’ என்று பொருளை மட்டும் சொல்லாமல், எபிரெய மொழியின் உருவகத்தைத் தக்கவைக்கிறது.
- source_word: יָדָיו
  choice: தன் கைகளை
  rationale: மசோரா உரையில் உள்ள பன்மையைத் தக்கவைத்து, மூன்றாம் நபர் ஆண்பால் ஒருமை உடைமைப் பின்னொட்டை ‘தன்’ என்று இயல்பான தமிழில் வழங்குகிறது.
- source_word: בִּשְׁלֹמָיו
  choice: தன்னுடன் சமாதான உறவில் இருந்தவர்களுக்கு எதிராக
  rationale: שָׁלוֹם இங்கு வெறும் மோதலின்மையை அல்ல, அவனுடன் நிலவிய அமைதியான உறவைக் குறிக்கிறது. ‘நண்பர்கள்’ அல்லது ‘கூட்டாளிகள்’ என்பதைவிட இந்த மொழிபெயர்ப்பு மூலத்தின் பரந்த உறவுநிலையைப் பாதுகாக்கிறது.
- source_word: חִלֵּל
  choice: தீட்டுப்படுத்தினான்
  rationale: חלל என்பதன் பியேல் வடிவம் பரிசுத்தமானதாக அல்லது மதிப்பிற்குரியதாகக் கருதப்படுவதைத் தீட்டாக்குதல், இழிவுபடுத்துதல் என்ற வலிமையைக் கொண்டது. ‘மீறினான்’ என்பதைக் காட்டிலும் மூலத்தின் அற-சமய வலிமையை இது தக்கவைக்கிறது.
- source_word: בְּרִיתוֹ
  choice: தன் உடன்படிக்கையை
  rationale: בְּרִית என்பதற்கான வழக்கமான தமிழ் இணை ‘உடன்படிக்கை.’ உடைமைப் பின்னொட்டு ‘தன்’ என வழங்கப்பட்டதால், இது அவன் செய்த உடன்படிக்கையா அல்லது அவனுக்குரிய உடன்படிக்கையா என்பதை மூலத்தைப் போலவே விரித்துரைக்காமல் விடுகிறது.
theological_decisions:
- issue: உடன்படிக்கை மொழியின் தன்மை
  choice: ‘தன் உடன்படிக்கையைத் தீட்டுப்படுத்தினான்’ என்று மொழிபெயர்த்து, உடன்படிக்கையின் அற மற்றும் உறவுசார் கனத்தைத் தக்கவைத்தல்
  alternative: ‘தன் ஒப்பந்தத்தை மீறினான்’ அல்லது ‘தன் உடன்படிக்கையை மீறினான்’
  rationale: உடனடிச் சூழல் துரோகம் செய்த ஒரு துணையைப் பற்றியது; தேவனுடைய உடன்படிக்கை என்று வெளிப்படையாகக் குறிப்பிடவில்லை. ஆகவே உடன்படிக்கை என்ற உயர்ந்த பதிவைத் தக்கவைத்தும், அது தெய்வீக உடன்படிக்கை என்று கூடுதலாக வரையறுக்காமலும் மொழிபெயர்க்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘சமாதான உறவு,’ ‘உடன்படிக்கை’ ஆகியவை மூலத்தின் உறவுசார் மற்றும் உடன்படிக்கைப் பதிவைத் தக்கவைக்கின்றன; பகைமையான செயலை வெளிப்படுத்த ‘எதிராக’ சேர்க்கப்பட்டுள்ளது.
