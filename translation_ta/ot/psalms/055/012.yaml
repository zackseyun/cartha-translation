  yaml_path: translation/ot/psalms/055/012.yaml
  text: For it is not an enemy who taunts me—then I could bear it[b][a]; it is not one who hates me who has magnified himself against me—then I could hide from him.
translation:
  language: ta
  text: ஏனெனில், என்னைப் பழித்துப் பேசுகிறவன் ஒரு பகைவன் அல்ல—அப்படியிருந்தால் அதை நான் தாங்கிக்கொள்வேன்; எனக்கு எதிராகத் தன்னைப் பெரிதாக்கிக்கொள்கிறவன் என்னை வெறுப்பவன் அல்ல—அப்படியிருந்தால் அவனிடமிருந்து நான் மறைந்துகொள்வேன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: சுற்றியுள்ள புலம்பலுக்கான விளக்கத்தை அறிமுகப்படுத்துகிறது; தமிழில் காரணத் தொடர்பை இயல்பாகக் காட்டுகிறது.
- source_word: אוֹיֵב
  choice: ஒரு பகைவன்
  rationale: எதிரி அல்லது பகைவன் என்ற பொதுவான பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: יְחָרְפֵנִי
  choice: என்னைப் பழித்துப் பேசுவது
  rationale: חרף என்பதில் உள்ள இகழ்ச்சியும் வாய்மொழிப் பழிப்பும் நவீன தமிழில் இயல்பாக வெளிப்படுகின்றன.
- source_word: וְאֶשָּׂא
  choice: அப்படியிருந்தால் அதை நான் தாங்கிக்கொள்வேன்
  rationale: נשׂא இங்கு ‘தாங்குதல்/சகித்தல்’ என்ற இடியோமப் பொருளில் வருகிறது; செய்யுளின் எதிர்நிலை நிபந்தனையை ‘அப்படியிருந்தால்’ தெளிவாக்குகிறது.
- source_word: מְשַׂנְאִי
  choice: என்னை வெறுப்பவன்
  rationale: பங்கேற்புவினை வடிவின் தனிப்பட்ட, தொடர்ச்சியான பகைமை உணர்வைப் பாதுகாக்கிறது.
- source_word: עָלַי
  choice: எனக்கு எதிராக
  rationale: இங்கு இடவியல் பொருளைவிட பகைமையான எதிர்ப்பைக் குறிக்கிறது.
- source_word: הִגְדִּיל
  choice: தன்னைப் பெரியவனாக்குவது
  rationale: ‘பெரிதாக்குதல்/பெரியவனாக்குதல்’ என்ற எபிரெயச் சொல்லாட்சியைப் பாதுகாத்து, மற்றொருவருக்கு எதிராகத் தன்னை உயர்த்திக்கொள்ளும் பொருளையும் வெளிப்படுத்துகிறது.
- source_word: וְאֶסָּתֵר
  choice: அப்படியிருந்தால் ... நான் மறைந்துகொள்வேன்
  rationale: நிபால் வடிவின் ‘தன்னை மறைத்துக்கொள்ளுதல்’ என்ற பொருளையும் எதிர்நிலை நிபந்தனையையும் இயல்பான தமிழில் தருகிறது.
- source_word: מִמֶּנּוּ
  choice: அவனிடமிருந்து
  rationale: எபிரெய முன்னிடைச்சொல் மற்றும் ஆண்பால் ஒருமைப் பெயர்ப்பதிலியின் பொருளை நேரடியாகத் தருகிறது.
