  text: הַקְשִׁ֣יבָ/ה לִּ֣/י וַ/עֲנֵ֑/נִי אָרִ֖יד בְּ/שִׂיחִ֣/י וְ/אָהִֽימָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/002.yaml
  text: Pay attention to me and answer me[a]; I am restless in my complaint[b], and I moan.
translation:
  language: ta
  text: எனக்குச் செவிகொடுத்து, எனக்குப் பதிலளியுங்கள்; என் முறையீட்டில்[b] நான் அமைதியின்றி அலைகிறேன்[a], முனகுகிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் முறையீட்டில் கலங்குகிறேன்.” எபிரெய வினை துயரத்தினால் ஏற்படும் அமைதியற்ற அலைச்சலையையோ பதற்றத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “முறையீடு” என்பதற்கு “தியானம்,” “சிந்தனை,” அல்லது “மனக்குமுறல்” என்றும் பொருள் கொள்ளலாம்; இங்குள்ள புலம்பல் சூழல் “முறையீடு” என்ற பொருளை ஆதரிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְשִׁיבָה
  choice: செவிகொடுத்து
  rationale: קשׁב என்பதன் கட்டளை வடிவம் கவனத்துடன் கேட்குமாறு வேண்டுகிறது. ‘செவிகொடுத்து’ என்பது நவீனத் தமிழில் இயல்பாகவும் வேண்டுதலின் தீவிரத்தைத் தக்கவைத்தும் உள்ளது.
- source_word: לִּי
  choice: எனக்கு
  rationale: முதலாம் நபர் ஒருமைப் பெயர்ப்பதிலி; ‘எனக்குச் செவிகொடுத்து’ என்ற தமிழ்த் தொடரில் இயல்பாக வெளிப்படுகிறது.
- source_word: וַעֲנֵנִי
  choice: எனக்குப் பதிலளியும்
  rationale: ענה இங்கு பதில் அளித்தல் அல்லது மறுமொழி தருதல் என்று பொருள்படும். இறைவனை நோக்கிய மன்றாட்டில் ‘பதிலளியும்’ நேரடியான, கண்ணியமான தேர்வு.
- source_word: אָרִיד
  choice: நான் அமைதியின்றித் தவிக்கிறேன்
  rationale: இந்த வினை துயரத்தால் ஏற்படும் அமைதியின்மை, அலைக்கழிப்பு அல்லது பதற்றத்தைக் குறிக்கலாம். ‘அமைதியின்றித் தவிக்கிறேன்’ என்பது உடல்சார் அலைந்து திரிதலை மட்டும் நிர்ணயிக்காமல் உள்ளக் கலக்கத்தையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּשִׂיחִי
  choice: என் முறையீட்டில்
  rationale: שׂיח என்பது சிந்தனை, மனக்குமுறல் அல்லது முறையீடு எனப் பொருள்படலாம். சங்கீதத்தின் புலம்பல் சூழலில் ‘முறையீடு’ பொருத்தமானது; பிற சாத்தியங்கள் அடிக்குறிப்பில் காக்கப்படுகின்றன.
- source_word: וְאָהִימָה
  choice: புலம்புகிறேன்
  rationale: המה ஒலியெழுப்புதல், முனகுதல் அல்லது புலம்புதல் ஆகியவற்றைக் குறிக்கிறது. இங்குள்ள துயரச் சூழலில் ‘புலம்புகிறேன்’ கேட்கத்தக்க வேதனைக் குரலை இயல்பான தமிழில் தருகிறது.
