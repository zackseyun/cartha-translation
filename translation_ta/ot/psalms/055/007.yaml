- source_word: אָלִין
  choice: இரவு தங்குவேன்
  rationale: לון/לין என்பதன் இரவைக் கழித்தல் அல்லது இரவு தங்குதல் என்ற தெளிவான காலச்சார்ந்த பொருளைப் பாதுகாக்கிறது.
- source_word: בַּמִּדְבָּר
  choice: வனாந்தரத்தில்
  rationale: மணற்பாலையை மட்டும் அல்லாமல் மக்கள் குடியிராத காட்டுவெளி அல்லது வறண்ட புறநிலத்தையும் குறிக்கக்கூடிய מִדְבָּר என்பதற்கு மரபாகவும் பரவலாகப் புரியக்கூடியதாகவும் உள்ளது.
- source_word: סֶלָה
  choice: சேலா
  rationale: துல்லியமான பொருள் உறுதியாகத் தெரியாததால் ஊகமாக மொழிபெயர்க்காமல் ஒலிபெயர்க்கப்படுகிறது.
