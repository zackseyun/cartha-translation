translation_notes:
  register: நவீன பொதுத்தமிழில், சங்கீதத்திற்கேற்ற கண்ணியமான நடையில் அமைக்கப்பட்டது. “வனாந்தரம்” வேதாகம வழக்கில் பரிச்சயமானதுடன் מִדְבָּר என்பதன் பரந்த நிலவியல் பொருளையும் தாங்குகிறது. மூலத்தில் வெளிப்படையான நிபந்தனைச் சொல் இல்லாததால் “நான் ... இருப்பேனே” போன்ற கூடுதல் நிபந்தனை வடிவம் சேர்க்கப்படவில்லை.
