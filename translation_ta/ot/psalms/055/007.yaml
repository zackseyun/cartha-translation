  yaml_path: translation/ot/psalms/055/007.yaml
  text: Look[a], I would wander far away; I would lodge in the wilderness[c][b]. Selah
translation:
  language: ta
  text: இதோ, வெகுதூரம் அலைந்து செல்வேன்[a]; வனாந்தரத்தில் இரவு தங்குவேன்[b]. சேலா[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வெகுதூரம் தப்பிச் செல்வேன்.” எபிரெயத்தில் தூரப்படுதலைக் குறிக்கும் ஒரு வினையுடன், அலைதல் அல்லது தப்பிச் செல்லுதல் என்று பொருள்படக்கூடிய வேரிலிருந்து வந்த சொல் இணைக்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “வனாந்தரத்தில் தங்குவேன்.” இங்குள்ள எபிரெய வினை பொதுவாக இரவு தங்குவதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: “சேலா” என்பதன் துல்லியமான பொருள் உறுதியாகத் தெரியவில்லை; இது இசை அல்லது வழிபாட்டுக்குரிய ஒரு குறியீடாக இருக்கலாம். எனவே வழக்கமாக மொழிபெயர்க்கப்படாமல் ஒலிபெயர்க்கப்படுகிறது.
    reason: cultural_note
