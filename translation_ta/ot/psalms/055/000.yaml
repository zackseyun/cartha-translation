source:
  edition: WLC
  text: לַ/מְנַצֵּ֥חַ בִּ/נְגִינֹ֗ת מַשְׂכִּ֥יל לְ/דָוִֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/000.yaml
  text: 'For the choirmaster: with stringed instruments. A Maskil[a] of David[b].'
translation:
  language: ta
  text: 'இசைத் தலைவருக்கு: நரம்பிசைக் கருவிகளுடன். தாவீதின்[b] மஸ்கீல்[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “போதனை தரும் சங்கீதம்” அல்லது “தியானப் பாடல்”; சங்கீதத் தலைப்புகளில் வரும் “மஸ்கீல்” என்ற சொல்லின் துல்லியமான பொருள் உறுதியில்லை.
    reason: lexical_alternative
  - marker: b
    text: “தாவீதின்” என்பது “தாவீதால் இயற்றப்பட்டது,” “தாவீதுக்குரியது” அல்லது “தாவீதுக்காக” என்றும் பொருள்படலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: இசைத் தலைவருக்கு
  rationale: சங்கீதத் தலைப்புகளில் இந்தச் சொல் இசையை வழிநடத்தும் அல்லது மேற்பார்வையிடும் தலைவரைக் குறிக்கும் மரபுச் சொல்லாக உள்ளது. முன்னொட்டு לַ- இங்கே ‘-க்கு’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: בִּנְגִינֹת
  choice: நரம்பிசைக் கருவிகளுடன்
  rationale: இந்தப் பன்மைச்சொல் சங்கீதத் தலைப்புகளில் நரம்பிசைக் கருவிகளின் இசைத்துணையைக் குறிக்கிறது. בִּ- முன்னொட்டின் கருவி அல்லது உடனிகழ்வு பொருளை ‘உடன்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מַשְׂכִּיל
  choice: மஸ்கீல்
  rationale: இது சங்கீதத் தலைப்புகளில் வரும் ஒரு தொழில்நுட்ப அல்லது இலக்கிய வகைப்பாட்டுச் சொல்; இதன் துல்லியமான பொருள் உறுதியில்லை. பொருளைத் தேவையின்றி முடிவுசெய்யாமல் எபிரெயச் சொல் ஒலிபெயர்க்கப்பட்டு, சாத்தியமான விளக்கங்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: לְדָוִד
  choice: தாவீதின்
  rationale: לְ- முன்னொட்டு ஆசிரியத்துவம், தொடர்பு, அர்ப்பணம் அல்லது தொகுப்பைச் சார்ந்த உறவு ஆகியவற்றில் ஒன்றைக் குறிக்கலாம். தமிழின் உடைமை வேற்றுமை வடிவமான ‘தாவீதின்’ இந்த உறவை இயல்பாகவும் ஓரளவு திறந்ததாகவும் வைத்திருக்கிறது.
theological_decisions:
- issue: தலைப்பிலுள்ள לְדָוִד என்பதால் குறிக்கப்படும் ஆசிரியத்துவம் அல்லது தொடர்பு
  choice: தாவீதின்
  alternative: தாவீதால்; தாவீதுக்காக; தாவீதுக்குரிய
  rationale: எபிரெயத் தொடர் தாவீதுடனான உறவின் தன்மையை ஒரே விதமாக நிர்ணயிப்பதில்லை. ‘தாவீதால்’ என்று மொழிபெயர்த்தால் நேரடி ஆசிரியத்துவத்தை மூலத்தைவிட வலுவாகக் கூறிவிடும்; ‘தாவீதின்’ அந்தத் தெளிவின்மையைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் சுருக்கமான, கண்ணியமான சங்கீதத் தலைப்பாக வடிவமைக்கப்பட்டுள்ளது. அறியப்படாத இலக்கிய வகைப்பாட்டுச் சொல்லான ‘மஸ்கீல்’ ஒலிபெயர்க்கப்பட்டுள்ளது; அதன் விளக்கம் அடிக்குறிப்பில் உள்ளது. அடிக்குறி [a] ‘மஸ்கீல்’ என்பதோடும் [b] ‘தாவீதின்’ என்பதோடும் நேரடியாக இணைக்கப்பட்டுள்ளன.
