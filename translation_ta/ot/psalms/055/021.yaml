base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/021.yaml
  text: The words of his mouth are smooth[a], but his heart is war; his words are softer than oil[b], yet they are drawn swords.
translation:
  language: ta
  text: அவன் வாயின் சொற்கள் மென்மையானவை[a]; ஆனால் அவன் இதயத்தில் போர் இருக்கிறது. அவன் சொற்கள் எண்ணெயைவிட மென்மையானவை; ஆனாலும் அவை உறையிலிருந்து எடுக்கப்பட்ட வாள்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவன் வாயிலிருந்து முகஸ்துதியான பேச்சு வருகிறது.” எபிரெயச் சொற்றொடர் அரிதானது; அது மென்மையான அல்லது முகஸ்துதியான பேச்சை இன்னும் குறிப்பாக வலியுறுத்தலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உறை நீக்கப்பட்ட வாள்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: חָלְקוּ מַחְמָאֹת פִּיו
  choice: அவன் வாயிலிருந்து வரும் பேச்சு வெண்ணெயைவிட மென்மையானது
  rationale: அரிதான எபிரெயச் சொற்றொடர் வெண்ணெய்போன்ற மென்மையான அல்லது முகஸ்துதியான பேச்சைக் குறிக்கிறது. ‘வெண்ணெயைவிட மென்மையானது’ என்பது உருவகத்தையும் பேச்சின் வஞ்சக இனிமையையும் இயல்பான தமிழில் தருகிறது.
- source_word: וּקֲרָב לִבּוֹ
  choice: ஆனால் அவன் இதயத்தில் போர் இருக்கிறது
  rationale: קְרָב என்பது ‘போர்/சண்டை’ என்ற பெயர்ச்சொல். வெளிப்புற மென்மைக்கும் உள்ளார்ந்த பகைமைக்கும் இடையிலான எதிர்மறையை, உருவகத்தை விளக்கவுரையாக மாற்றாமல் பாதுகாக்கிறது.
- source_word: רַכּוּ דְבָרָיו מִשֶּׁמֶן
  choice: அவன் சொற்கள் எண்ணெயைவிட மிருதுவானவை
  rationale: ஒப்பீட்டு அமைப்பையும் எண்ணெயின் வழுவழுப்பான மென்மை என்ற உணர்வுப்பூர்வ உருவகத்தையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: וְהֵמָּה פְתִחוֹת
  choice: ஆனாலும் அவை உருவப்பட்ட வாள்கள்
  rationale: פְתִחוֹת இங்கு உறையிலிருந்து எடுக்கப்பட்ட, தாக்கத் தயாரான ஆயுதங்களைக் குறிக்கும் வழக்காகப் புரிந்துகொள்ளப்படுகிறது. ‘உருவப்பட்ட வாள்கள்’ என்பது சுருக்கமான கவித்துவ எதிர்மறையைத் தக்கவைக்கிறது.
