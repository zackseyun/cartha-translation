  text: Cast your burden on Yahweh[a], and he will sustain you[b]; he will never allow the righteous to be shaken.
translation:
  language: ta
  text: 'உன் சுமையை[a] யாவே மீது போட்டுவிடு;


    அவர் உன்னைத் தாங்குவார்.


    நீதிமானை[b] ஒருபோதும் நிலைகுலைய விடமாட்டார்.'
  philosophy: optimal-equivalence
