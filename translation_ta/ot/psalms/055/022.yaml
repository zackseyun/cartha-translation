  - marker: a
    text: ‘உனக்கு விதிக்கப்பட்டது,’ ‘உன் கவலை,’ அல்லது ‘அவர் உனக்குக் கொடுத்தது’ என்றும் பொருள்கொள்ளலாம். அரிதாக வரும் எபிரெயப் பெயர்ச்சொல், ஒருவர்மீது வைக்கப்பட்டிருப்பதைப் பரந்த பொருளில் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் ‘நீதிமான்’ என்பது ஒருமை ஆண்பால் வடிவில் உள்ளது; இங்கு அது பொதுவாக நீதியுள்ள ஒருவரைப் பிரதிநிதித்துவப்படுத்தக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְׁלֵךְ
  choice: போட்டுவிடு
  rationale: שלך என்பதன் கட்டளை வடிவம் எதையாவது மற்றொருவர்மீது எறிவதையோ போட்டுவிடுவதையோ குறிக்கிறது. தமிழில் ‘போட்டுவிடு’ என்பது உருவகத்தின் வலிமையையும் ஒப்படைத்துவிடும் கருத்தையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் உள்ள நான்கெழுத்து இறைப்பெயரை பொதுப்பட்டமான ‘ஆண்டவர்’ என்று மாற்றாமல், ‘யாவே’ என ஒலிபெயர்த்துள்ளது.
- source_word: יְהָבְךָ
  choice: உன் சுமை
  rationale: அரிதாக வரும் இந்தப் பெயர்ச்சொல் ஒருவர்மீது சுமத்தப்பட்டிருப்பதைக் குறிக்கலாம். சூழலில் ‘சுமை’ இயல்பாகவும் அடுத்துவரும் இறைத் தாங்குதலுடன் பொருந்துமாறும் உள்ளது; பிற சாத்தியங்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: יְכַלְכְּלֶךָ
  choice: அவர் உன்னைத் தாங்குவார்
  rationale: כלכל இங்கு ஆதரித்தல், நிலைநிறுத்துதல் அல்லது தேவைகளை அளித்துப் பேணுதல் ஆகிய கருத்துகளைக் கொண்டது. ‘தாங்குவார்’ சுமை என்ற முன்வரும் உருவகத்தையும் பரந்த ஆதரவுக் கருத்தையும் காக்கிறது.
- source_word: לֹא יִתֵּן לְעוֹלָם
  choice: ஒருபோதும் ... விடமாட்டார்
  rationale: இந்த எபிரெயச் சொற்றொடர் நீடித்த மறுப்பை, அதாவது எக்காலத்திலும் அனுமதிக்காமையைத் தெரிவிக்கிறது. தமிழில் ‘ஒருபோதும் ... விடமாட்டார்’ தெளிவான இயல்பான வடிவம்.
- source_word: מוֹט
  choice: நிலைகுலைய
  rationale: இந்தச் சொல் தடுமாற்றம், அசைவு அல்லது நிலையிழத்தலைக் குறிக்கிறது. ‘நிலைகுலைய’ என்பது முற்றிலும் அழிவதைக் கட்டாயப்படுத்தாமல் நிலையற்றுப்போகும் உருவகத்தைப் பாதுகாக்கிறது.
- source_word: לַצַּדִּיק
  choice: நீதிமானை
  rationale: மூலத்தில் குறிப்பிட்ட ஒருமை ஆண்பால் வடிவம் பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்டுள்ளது. ‘நீதிமான்’ அதன் இலக்கண வடிவத்தைப் பேணுகிறது; அது பிரதிநிதித்துவ அல்லது பொதுப்பொருள் கொண்டிருக்கலாம் என்பது அடிக்குறிப்பில் குறிப்பிடப்பட்டுள்ளது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூலவசனம் உடன்படிக்கைக்குரிய தனிப்பட்ட இறைப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. பொதுப்பட்டத்தால் அதை மாற்றாமல், எபிரெயப் பெயரின் வழக்கமான அறிஞர் சார்ந்த உச்சரிப்பைத் தமிழில் ஒலிபெயர்த்துள்ளது.
- issue: לַצַּדִּיק என்பதன் ஒருமை ஆண்பால் வடிவம்
  choice: நீதிமானை
  alternative: நீதியுள்ளவர்களை; நீதியுள்ள ஒருவரை
  rationale: மூலத்தின் ஒருமை ஆண்பால் வடிவம் பாதுகாக்கப்பட்டுள்ளது; அதே நேரத்தில் அது ஒரே நபரை மட்டுமே குறிக்காமல் பொதுவாக நீதிமானை பிரதிநிதித்துவப்படுத்தக்கூடும் என்ற வாய்ப்பு அடிக்குறிப்பில் தெளிவாக்கப்பட்டுள்ளது.
- issue: நீதிமான் நிலைகுலைய அனுமதிக்கப்படமாட்டார் என்ற வாக்குறுதியின் பரப்பு
  choice: ஒருபோதும் நிலைகுலைய விடமாட்டார்
  alternative: என்றென்றும் தடுமாற விடமாட்டார்
  rationale: வசனம் துன்பமே வராது என்று வெளிப்படையாகச் சொல்லாமல், இறுதியாக அல்லது நிலைத்த வகையில் நிலையிழக்க யாவே அனுமதிக்கமாட்டார் என்ற மூல உருவகத்தையே வைத்திருக்கிறது; கூடுதல் கோட்பாட்டு விளக்கம் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் கவிதைத் தன்மையும் கொண்ட எளிய நடை பயன்படுத்தப்பட்டுள்ளது. யாவேவைச் சுட்டும் சுட்டுப்பெயரும் வினைமுற்றும் தமிழ் மரியாதை ஒருமையில் அமைந்துள்ளன. மூன்று எபிரெயக் கூறுகளின் இணைநிலையை வரிப்பிரிப்பு தெளிவாக்குகிறது.
