translation_notes:
  register: நவீன நிலையான தமிழ்; கண்ணியமானதாயும் பொதுவாசகர்களுக்கு எளிதில் புரியத்தக்கதாயும் அமைந்துள்ளது. முதன்மை உரை எபிரெயக் கேள்வி வடிவத்தையும் ‘தங்குதல்’ என்ற நேரடிப் பொருளையும் காக்கிறது; அடிக்குறிப்பு அதன் இயல்பான விருப்பப் பொருளையும் சூழல் சார்ந்த ‘இளைப்பாறுதல்’ பொருளையும் வழங்குகிறது.
