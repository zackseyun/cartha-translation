source:
  edition: WLC
  text: וָ/אֹמַ֗ר מִֽי יִתֶּן לִּ֣/י אֵ֭בֶר כַּ/יּוֹנָ֗ה אָע֥וּפָה וְ/אֶשְׁכֹּֽנָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/006.yaml
  text: And I said[a], “Who will give me wings like a dove? I would fly away and dwell.”
translation:
  language: ta
  text: 'நான் சொன்னேன்[a]: “புறாவைப் போன்ற சிறகுகளை எனக்கு யார் தருவார்? நான் பறந்து சென்று தங்குவேனே!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதனை இன்னும் இயல்பான விருப்பக் கூற்றாக, “புறாவைப் போன்ற சிறகுகள் எனக்கு இருந்தால் எவ்வளவு நன்றாயிருக்கும்! நான் பறந்து சென்று இளைப்பாறுவேனே!” என்றும் மொழிபெயர்க்கலாம்.
    reason: מִי יִתֶּן לִּי என்ற சொற்றொடர் எழுத்துப்படியாகக் கேள்வி வடிவில் இருந்தாலும், ஏக்கமிக்க விருப்பத்தைக் குறிக்கலாம்; மேலும் ‘இளைப்பாறுவேன்’ என்பது சூழல் சார்ந்த பொருள், וְאֶשְׁכֹּנָה என்பதன் நேரடிப் பொருள் அல்ல.
lexical_decisions:
- source_word: וָאֹמַר
  choice: அப்போது நான் சொன்னேன்
  rationale: אמר வினையின் தொடர்நிலை வடிவம் சங்கீதக்காரரின் கூற்றை நிகழ்வின் தொடர்ச்சியாக அறிமுகப்படுத்துகிறது. ‘அப்போது’ என்பது அந்த எளிய முன்னேற்றத்தை இயல்பான தமிழில் காட்டுகிறது.
- source_word: מִי יִתֶּן לִּי
  choice: எனக்கு யார் தருவார்?
  rationale: எழுத்துப்படியான கேள்வி வடிவத்தைப் பாதுகாக்கிறது; சூழலில் அது தீவிரமான ஏக்கத்தையும் விருப்பத்தையும் வெளிப்படுத்துகிறது.
- source_word: אֵבֶר
  choice: சிறகுகளை
  rationale: எபிரெயத்தில் ஒருமை வடிவிலிருந்தாலும் இங்கு பறப்பதற்குரிய சிறகுகளைத் தொகுப்பாகக் குறிக்கிறது; தமிழில் பன்மை இயல்பானது.
- source_word: כַּיּוֹנָה
  choice: புறாவைப் போன்ற
  rationale: כ ஒப்புமையைக் குறிக்கிறது; இந்தத் தெரிவு புறாவுடன் செய்யப்படும் உருவக ஒப்பீட்டை நேரடியாகத் தக்கவைக்கிறது.
- source_word: אָעוּפָה
  choice: நான் பறந்து சென்று
  rationale: விருப்பம் அல்லது ஏக்கத்தை வெளிப்படுத்தும் cohortative வடிவத்தின் நுணுக்கம், தொடரும் ‘தங்கியிருப்பேனே’ என்பதோடு இணைந்து தமிழில் வெளிப்படுகிறது.
- source_word: וְאֶשְׁכֹּנָה
  choice: தங்கியிருப்பேனே
  rationale: שׁכן என்பதன் அடிப்படைப் பொருளான தங்குதல் அல்லது வசித்தலைப் பாதுகாக்கிறது; இறுதி ‘ஏ’ ஏக்கத்துடன் கூடிய விருப்பநிலையை இயல்பாக உணர்த்துகிறது.
