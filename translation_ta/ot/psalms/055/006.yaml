    rationale: וָאֹמַר has the ordinary narrative conjunction plus ‘I said’; it does not require an explicit ‘at that time.’ Tamil can naturally introduce the speech with ‘நான் சொன்னேன்.’
  - severity: low
    issue: Footnote-marker placement is awkward.
    rationale: The marker should directly follow the word or clause it annotates, before the colon introducing the quotation.
  - severity: low
    issue: ‘தங்கியிருப்பேனே’ is more durative than necessary.
    rationale: וְאֶשְׁכֹּנָה expresses ‘I would dwell/stay’; ‘தங்குவேனே’ is a closer and more natural concise rendering.
