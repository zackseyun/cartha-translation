  source_fidelity: எபிரேய மூலத்தின் இரட்டை எழுவாய், ‘என்னில்/என்மேல் வருகிறது’ என்ற அனுபவத்தை ஆட்கொள்ளும் வினைச்சொல், மற்றும் பல்லாட்சூத் என்பதன் தீவிர அச்ச/திகில் பொருள் ஆகியவை நன்றாகக் காக்கப்பட்டுள்ளன. ‘என்மேல் வருகின்றன’ என்பது יָבֹא בִי என்பதன் சொற்சொல் ‘என்னுள் வருகிறது’ என்பதிலிருந்து சிறு இடியமாற்றமாக இருந்தாலும், கவிதைச் சூழலில் இயல்பானதும் பொருளுக்கு உண்மையானதுமாகும்.
  naturalness: ‘பயமும் நடுக்கமும் என்மேல் வருகின்றன; திகில் என்னை மூடிக்கொள்கிறது’ என்பது நவீன நிலையான தமிழில் தெளிவாகவும் கவித்துவத் தீவிரத்துடனும் இயல்பாகவும் உள்ளது. ஒருமை-பன்மை வினை ஒத்திசைவு சரியாக உள்ளது.
  terminology: ‘பயம்’, ‘நடுக்கம்’, ‘திகில்’ ஆகியவை எபிரேயச் சொற்களின் பொருள் எல்லையையும் சங்கீதத்தின் கண்ணியமான கவிதை நடையையும் தக்கவைக்கின்றன. இறையியல் சார்ந்த தனிப்பட்ட சொல் அல்லது விளக்கத் தலையீடு இல்லை.
