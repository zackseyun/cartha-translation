  text: יִרְאָ֣ה וָ֭/רַעַד יָ֣בֹא בִ֑/י וַ֝/תְּכַסֵּ֗/נִי פַּלָּצֽוּת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/005.yaml
  text: Fear and trembling come upon me[a], and horror covers me.
translation:
  language: ta
  text: பயமும் நடுக்கமும் என்மேல் வருகின்றன; திகில் என்னை மூடிக்கொள்கிறது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִרְאָה
  choice: பயம்
  rationale: இந்தப் பெயர்ச்சொல் பயம் அல்லது அச்சத்தைக் குறிக்கிறது; இங்கு இயல்பானதும் நேரடியானதும் ஆகிய தமிழ் இணைச்சொல் ‘பயம்’.
- source_word: וָרַעַד
  choice: நடுக்கமும்
  rationale: அச்சத்தால் ஏற்படும் உடல் நடுக்கத்தைக் குறிக்கிறது; ‘பயமும் நடுக்கமும்’ என்பது எபிரேய இணைப்பையும் இயல்பான தமிழ் சொல்லாட்சியையும் காக்கிறது.
- source_word: יָבֹא בִי
  choice: என்மேல் வருகின்றன
  rationale: சொல்லுக்குச் சொல் ‘என்னுள் வருகிறது’ என்றாலும், அனுபவம் ஒருவரை ஆட்கொள்வதைக் குறிக்கும் இச்சொற்றொடருக்கு ‘என்மேல் வருகின்றன’ என்பது பொருத்தமான இயல்பான தமிழ். கூட்டு எழுவாய்க்கேற்ப பன்மை வினை பயன்படுத்தப்பட்டுள்ளது.
- source_word: וַתְכַסֵּנִי
  choice: என்னை மூடிக்கொள்கிறது
  rationale: כסה என்பதன் ‘மூடு’ என்ற உருவகத்தை விளக்கமாக ‘ஆட்கொள்கிறது’ என்று மாற்றாமல் காக்கிறது.
- source_word: פַּלָּצוּת
  choice: திகில்
  rationale: கடும் அச்சம், திகைப்பு, உடல் சிலிர்ப்பு ஆகிய பொருள் பரப்பைக் கொண்ட இச்சொல்லுக்கு, மூடும் உருவகத்துடன் இயல்பாக அமையும் தீவிரமான தமிழ்ச் சொல் ‘திகில்’.
theological_decisions: []
