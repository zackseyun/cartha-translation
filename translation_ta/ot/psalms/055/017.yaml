base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/017.yaml
  text: Evening[a], morning, and noon I complain and groan[c][b], and he hears my voice.
translation:
  language: ta
  text: மாலையிலும் காலையிலும் நண்பகலிலும் நான் புலம்பி முனகுகிறேன்[a]; அவர் என் குரலைக் கேட்கிறார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நான் தியானித்து முனகுகிறேன்” அல்லது “நான் பேசி முனகுகிறேன்” என்றும் மொழிபெயர்க்கலாம். இங்குள்ள எபிரெய வினைச்சொல் சிந்தித்தல், பேசுதல், புலம்புதல் ஆகிய பொருள்களைக் கொள்ளலாம்; இப்புலம்பல் சூழலில் துயரைப் புலம்புதல் என்பது பொருத்தமாகத் தெரிகிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் எழுவாய் பெயரால் குறிப்பிடப்படாமல், “அவர் என் குரலைக் கேட்கிறார்” என்றே உள்ளது; சுற்றியுள்ள சூழலில் “அவர்” என்பது கடவுளைக் குறிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: עֶרֶב וָבֹקֶר וְצָהֳרַיִם
  choice: மாலையிலும் காலையிலும் நண்பகலிலும்
  rationale: மூன்று நாள்வேளைகளையும் ஒரே இலக்கண அமைப்பில் தருகிறது; எபிரெயக் கவிதையின் மும்மைத் தொடரையும் இயல்பான தமிழையும் காக்கிறது.
- source_word: אָשִׂיחָה
  choice: நான் புலம்பி
  rationale: שׂיח என்பதற்கு சிந்தித்தல், பேசுதல், முறையிடுதல் போன்ற பொருள்கள் உண்டு. இப்புலம்பல் சங்கீதத்தின் சூழலிலும் அடுத்த வினையோடு இணைந்தும், துயரைச் சொல்லிப் புலம்புதல் என்ற பொருள் ஏற்றது.
- source_word: וְאֶהֱמֶה
  choice: முறையிடுகிறேன்
  rationale: המה இங்கு உள்ளக் கலக்கத்தை ஒலியுடன் வெளிப்படுத்துவதைக் குறிக்கிறது. ‘முறையிடுகிறேன்’ என்பது தமிழில் இயல்பாக இருந்து, புலம்பலின் கேட்கத்தக்க தன்மையை வெளிப்படுத்துகிறது.
- source_word: וַיִּשְׁמַע
  choice: அவர் ... கேட்கிறார்
  rationale: கவிதைச் சூழலில் உறுதியான, வழக்கமான நிகழ்வாக நிகழ்காலத்தில் மொழிபெயர்க்கப்பட்டுள்ளது. மரியாதை ஒருமை தமிழ் நடையில் கடவுளைக் குறிக்கும் இயல்பான வடிவம்.
- source_word: קוֹלִי
  choice: என் குரலை
  rationale: קוֹל என்பதன் நேரான பொருள் ‘குரல்’; வேண்டுதலின் வாய்மொழித் தன்மையையும் இது காக்கிறது.
theological_decisions:
- issue: וַיִּשְׁמַע என்பதன் வெளிப்படையாகக் கூறப்படாத எழுவாய்
  choice: அவர்
  alternative: ஆண்டவர் என் குரலைக் கேட்கிறார்
  rationale: எபிரெய உரையில் இறைபெயர் இவ்வசனத்தில் இல்லை; சுற்றியுள்ள சூழல் கடவுளையே சுட்டுகிறது. ஆகவே உரையில் இல்லாத இறைபெயரைச் சேர்க்காமல், தமிழில் இயல்பான ‘அவர்’ பயன்படுத்தப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியும் அதேவேளையில் சங்கீதத்திற்குரிய கண்ணியமான புலம்பல் நடையில் வடிவமைக்கப்பட்டது. மூன்று நாள்வேளைகளின் இணை அமைப்பு காக்கப்பட்டுள்ளது; சாத்தியமான சொற்பொருள் வேறுபாடுகள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
