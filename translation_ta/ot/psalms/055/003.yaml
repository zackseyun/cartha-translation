translation_notes:
  register: நவீனத் தரத் தமிழில், புலம்பல் கவிதைக்குரிய சுருக்கமும் கண்ணியமும் காக்கப்பட்டுள்ளன. முதல் இரண்டு காரணத் தொடர்கள் எபிரெய மூலத்தின் வினையில்லா கவிதை அமைப்பைத் தொடர்கின்றன; முந்தைய வசனத்திலிருந்து வினைச்சொல் சேர்த்து பொருளை மறைமுகமாகத் தீர்மானிக்கவில்லை.
