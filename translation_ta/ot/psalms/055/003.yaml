  text: מִ/קּ֤וֹל אוֹיֵ֗ב מִ/פְּנֵ֣י עָקַ֣ת רָשָׁ֑ע כִּי יָמִ֥יטוּ עָלַ֥/י אָ֝֗וֶן וּ/בְ/אַ֥ף יִשְׂטְמֽוּ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/003.yaml
  text: Because of the voice of the enemy[a], because of the oppression of the wicked; for they cast trouble upon me[b], and in anger they hate me.
translation:
  language: ta
  text: 'பகைவனின் குரல் காரணமாக,

    தீயவனின் ஒடுக்குதல் காரணமாக—

    அவர்கள் என்மேல் துன்பத்தை வீசுகிறார்கள்[a];

    கோபத்தில் என்னை வெறுக்கிறார்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தீங்கு” அல்லது “தீமை” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் துன்பம், தீங்கு, தீமை அல்லது அக்கிரமம் ஆகிய பொருள்களைத் தரக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקּוֹל אוֹיֵב
  choice: பகைவனின் குரல் காரணமாக
  rationale: מִן என்பதை இப்புலம்பலின் இணை அமைப்பில் காரணத்தைக் குறிப்பதாக எடுத்துள்ளோம்; קוֹל என்பதன் நேரடியான ‘குரல்’ உருவகத்தையும், אוֹיֵב என்பதன் ஒருமையையும் காத்துள்ளோம்.
- source_word: מִפְּנֵי עָקַת רָשָׁע
  choice: தீயவனின் நெருக்குதல் காரணமாக
  rationale: מִפְּנֵי இங்கு காரணத்தைக் குறிக்கிறது. עָקַת என்பது அழுத்தம், நெருக்கடி, ஒடுக்குதல் ஆகிய பொருள்களைத் தரலாம்; பகைமையான துன்புறுத்தலை இயல்பாக வெளிப்படுத்த ‘நெருக்குதல்’ தேர்ந்தெடுக்கப்பட்டது. רָשָׁע என்பதன் ஒருமை காக்கப்பட்டது.
- source_word: יָמִיטוּ עָלַי
  choice: அவர்கள் என்மேல் … வீசுகிறார்கள்
  rationale: Hiphil வடிவம் ஒன்றை ஒருவர்மேல் விழச் செய்வது அல்லது கொண்டுவருவது என்ற பகைமையான செயலைக் காட்டுகிறது. ‘வீசுகிறார்கள்’ என்பது அந்த இயக்க உருவகத்தைத் தமிழில் சுருக்கமாகக் காக்கிறது.
- source_word: אָוֶן
  choice: துன்பம்
  rationale: இச்சொல் துன்பம், தீங்கு, தீமை அல்லது அக்கிரமம் எனப் பொருள்படலாம். இங்கு சங்கீதக்காரர்மேல் பகைவர்கள் கொண்டுவருவதைக் குறிப்பதால் ‘துன்பம்’ முதன்மை மொழிபெயர்ப்பாகத் தேர்ந்தெடுக்கப்பட்டது; உண்மையான பொருள் விரிவு அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: וּבְאַף יִשְׂטְמוּנִי
  choice: கோபத்துடன் என்னைப் பகைக்கிறார்கள்
  rationale: אַף இங்கு ‘கோபம்’ என்ற மரபுத்தொடர் பொருளிலும், שׂטם ஆழ்ந்த பகைமை அல்லது வெறுப்பைக் குறிக்கும் பொருளிலும் வருகிறது. ‘பகைக்கிறார்கள்’ இரண்டையும் மிகைப்படுத்தாமல் இயல்பாக வெளிப்படுத்துகிறது.
