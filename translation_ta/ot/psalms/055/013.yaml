  text: But you—a man as my equal[a], my companion, and my familiar friend.
translation:
  language: ta
  text: ஆனால் நீயோ—எனக்குச் சமமான ஒரு மனிதன், என் நெருங்கிய தோழன்[a], எனக்கு நன்கு தெரிந்த நண்பன்.
