lexical_decisions:
- source_word: וְאַתָּה
  choice: ஆனால் நீயோ
  rationale: முந்தைய சூழலுடன் உள்ள கூர்மையான முரண்பாட்டையும் நேரடி அழைப்பின் வலியுறுத்தலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֱנוֹשׁ
  choice: ஒரு மனிதன்
  rationale: இங்கு மனிதனின் மரணத்தன்மையைவிட, தன்னைப் போன்ற ஒருவனால் நிகழ்ந்த துரோகமே முன்னிலைப்படுவதால் இத்தேர்வு பொருத்தமானது.
- source_word: כְּעֶרְכִּי
  choice: எனக்குச் சமமான
  rationale: עֵרֶךְ என்பதிலிருந்து வந்த இச்சொற்றொடர் ஒப்பான நிலை அல்லது சமத்துவத்தைக் குறிக்கிறது; தமிழில் சுருக்கமாகவும் தெளிவாகவும் இதைத் தருகிறது.
- source_word: אַלּוּפִי
  choice: என் நெருங்கிய தோழன்
  rationale: இச்சொல் நெருக்கமான கூட்டாளி, தோழன், அல்லது வழிகாட்டி என்பதைக் குறிக்கலாம். சூழலில் உறவின் நெருக்கம் முதன்மையாக இருப்பதால் ‘நெருங்கிய தோழன்’ எனத் தரப்பட்டு, ‘வழிகாட்டி’ என்ற சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וּמְיֻדָּעִי
  choice: எனக்கு நன்கு பழக்கமான நண்பன்
  rationale: ידע வேரிலிருந்து வரும் இவ்வடிவம் நெருக்கமாக அறியப்பட்ட ஒருவரைக் குறிக்கிறது. வெறும் ‘அறிமுகமானவன்’ என்பது சூழலின் உணர்ச்சி வலிமையைத் தராது; இத்தொடர் தனிப்பட்ட நெருக்கத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
