  text: My heart writhes within me[a], and the terrors of death have fallen upon me.
translation:
  language: ta
  text: என் இதயம் எனக்குள் துடிக்கிறது[a]; மரணத்தின் திகில்கள் என்மேல் விழுந்திருக்கின்றன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் இதயம் எனக்குள் நடுங்குகிறது.” எபிரெய வினை துடித்தல், நடுங்குதல் அல்லது கடும் துயரத்தில் இருத்தல் ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבִּי
  choice: என் இதயம்
  rationale: לֵב என்பது சிந்தனை மற்றும் உணர்ச்சியின் உள்ளார்ந்த மையத்தைக் குறிக்கிறது. இப்புலம்பல் சூழலில் “என் இதயம்” என்பது இயல்பாகவும் உடல்சார்ந்த உணர்ச்சி வலிமையைத் தக்கவைத்தும் அமைகிறது.
- source_word: יָחִיל
  choice: வேதனையால் துடிக்கிறது
  rationale: חול/חיל வினை வேதனையில் துடித்தல், நடுங்குதல், உள்ளம் கலங்குதல் ஆகிய பொருட்களைத் தரக்கூடும். “வேதனையால் துடிக்கிறது” என்பது தீவிரமான உள்ளக் கொந்தளிப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: בְּקִרְבִּי
  choice: எனக்குள்
  rationale: קֶרֶב இங்கு ஒருவரின் உட்புறத்தையோ உள்ளார்ந்த நிலையையோ குறிக்கிறது. “எனக்குள்” என்பது தெளிவான, இயல்பான தமிழ் இணை.
- source_word: אֵימוֹת
  choice: திகில்கள்
  rationale: אֵימָה என்பதன் பன்மை வடிவம் கடும் பயத்தையும் பயங்கர உணர்வுகளையும் குறிக்கிறது. “திகில்கள்” பன்மையையும் அதன் தீவிரத்தையும் காக்கிறது.
- source_word: מָוֶת
  choice: மரணத்தின்
  rationale: மரணத்துக்கும் திகில்களுக்கும் உள்ள எபிரெயச் சொல்லிணைப்பை “மரணத்தின் திகில்கள்” எனக் காத்திருக்கிறது; மரணம் அவற்றின் காரணமா, பொருளா, அல்லது உருவகப்படுத்தப்பட்ட ஆற்றலா என்பதைத் தீர்மானித்து விடவில்லை.
- source_word: נָפְלוּ
  choice: விழுந்திருக்கின்றன
  rationale: நிறைவுற்ற செயலும் அதன் தற்போதைய விளைவும் வெளிப்படும்படி மொழிபெயர்க்கப்பட்டுள்ளது. இது அச்சங்கள் திடீரென வந்து ஆட்கொண்ட படிமத்தையும் காக்கிறது.
- source_word: עָלָי
  choice: என்மேல்
  rationale: עַל உடன் வரும் முதலாம் நபர் பின்னொட்டின் நேரான, கவிதைநயமுள்ள தமிழ் இணை “என்மேல்” ஆகும்.
