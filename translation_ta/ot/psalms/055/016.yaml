source:
  edition: WLC
  text: אֲ֭נִי אֶל אֱלֹהִ֣ים אֶקְרָ֑א וַ֝/יהוָ֗ה יוֹשִׁיעֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/016.yaml
  text: As for me[a], I call to God, and Yahweh will save me.
translation:
  language: ta
  text: நானோ கடவுளை நோக்கிக் கூப்பிடுகிறேன்; யாவே[a] என்னைக் காப்பாற்றுவார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெய மொழியில்: יהוה (YHWH), கடவுளின் தனிப்பெயர்; இங்கு ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.'
    reason: divine_name
lexical_decisions:
- source_word: אֲנִי
  choice: நானோ
  rationale: தனிப்பட்ட சுட்டுப்பெயர் வெளிப்படையாகவும் வாக்கியத்தின் தொடக்கத்தில் வலியுறுத்தப்பட்டும் உள்ளது. ‘நானோ’ என்பது அதன் வேறுபடுத்திக் காட்டும் அழுத்தத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֶל אֱלֹהִים
  choice: கடவுளை நோக்கி
  rationale: אֶל என்பது அழைப்பு செலுத்தப்படும் திசை அல்லது நபரைக் குறிக்கிறது; ‘கடவுளை நோக்கி’ என்பது இதைத் தெளிவாகவும் இயல்பாகவும் தருகிறது. אֱלֹהִים இங்கு அடுத்த அரையடியில் வரும் யாவேயையே குறிக்கும் ஒருமைப் பொருளில் உள்ளது.
- source_word: אֶקְרָא
  choice: கூப்பிடுகிறேன்
  rationale: קרא என்பதன் அடிப்படைப் பொருள் ‘அழை/கூப்பிடு’. எபிரெய நிறைவுறா வினை நிகழ்கால, வழக்கநிலை அல்லது எதிர்கால நுட்பத்தை ஏற்கலாம்; இங்கு சங்கீதக்காரரின் தற்போதைய முறையீட்டை இயல்பாக வெளிப்படுத்த நிகழ்காலம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: וַיהוָה
  choice: யாவே
  rationale: וְ இணைப்பைத் தமிழின் அரைப்புள்ளி இயல்பாக எடுத்துச் செல்கிறது. יהוה என்ற தனிப்பெயர் பட்டப்பெயராக மாற்றப்படாமல் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: יוֹשִׁיעֵנִי
  choice: என்னைக் காப்பாற்றுவார்
  rationale: ישׁע வேரின் ஹிஃபீல் வடிவம் ‘காப்பாற்று/விடுவி’ என்று பொருள்படும். நிறைவுறா வினை இங்கு எதிர்கால நம்பிக்கையை வெளிப்படுத்துவதால் ‘காப்பாற்றுவார்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலவசனம் உடன்படிக்கைக்குரிய தனிப்பெயரான יהוה என்பதை நேரடியாகப் பயன்படுத்துகிறது. அதை பொதுவான பட்டப்பெயராக மாற்றாமல், தமிழில் பரவலாக அறியப்படும் ‘யாவே’ என்ற ஒலிவடிவத்தில் தருவது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: אֶקְרָא என்பதன் காலநுட்பம்
  choice: கூப்பிடுகிறேன்
  alternative: கூப்பிடுவேன்
  rationale: எபிரெய நிறைவுறா வடிவம் நிகழ்கால அல்லது எதிர்கால நுட்பம் இரண்டையும் தாங்கக்கூடும். அடுத்த வினையின் எதிர்கால நம்பிக்கையுடன் முரண்படாமல், சங்கீதக்காரரின் உடனடி செயலை முன்வைக்க நிகழ்காலம் தேர்ந்தெடுக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன பொதுத்தமிழில், கவிதைக்குரிய சுருக்கத்தையும் கண்ணியத்தையும் காக்கும் நடை. ‘நானோ’ என்ற தொடக்கம் மூலத்தின் வலியுறுத்தலைக் காக்கிறது; இரண்டு இணை அரையடிகள் அரைப்புள்ளியால் பிரிக்கப்பட்டுள்ளன.
