source:
  edition: WLC
  text: יִשְׁמַ֤ע אֵ֨ל וְֽ/יַעֲנֵ/ם֮ וְ/יֹ֤שֵׁ֥ב קֶ֗דֶם סֶ֥לָה אֲשֶׁ֤ר אֵ֣ין חֲלִיפ֣וֹת לָ֑/מוֹ וְ/לֹ֖א יָרְא֣וּ אֱלֹהִֽים׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/019.yaml
  text: God will hear and answer them—he who sits enthroned from of old (Selah)—because they have no changes[c][b][a], and they do not fear God.
translation:
  language: ta
  text: தேவன் கேட்டுத் அவர்களைத் தாழ்த்துவார்[a]—பண்டைக்காலம் முதல் அரியணையில் வீற்றிருப்பவரான அவர் (சேலா)—ஏனெனில், அவர்களுக்கு மாற்றங்கள் இல்லை; அவர்கள் தேவனுக்குப் பயப்படுவதில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தேவன் கேட்டு அவர்களுக்குப் பதிலளிப்பார்.” எபிரெய வினைச்சொல் “பதிலளிப்பார்” என்றும் பொருள்படலாம்; இச்சூழலில் அது தீர்ப்பினால் தாழ்த்துதல் அல்லது துன்புறுத்துதல் என்ற பொருளையும் தரக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: יִשְׁמַע
  choice: கேட்டு
  rationale: שׁמע என்பதன் நிறைவுறாத வினைவடிவம் இங்கு சங்கீதக்காரரின் நம்பிக்கையை வெளிப்படுத்தும் எதிர்காலச் செயலாகப் பொருள்படுகிறது; அடுத்த வினையுடன் இயல்பாக இணைக்கப்பட்டுள்ளது.
- source_word: אֵל
  choice: தேவன்
  rationale: இது கவிதை நடையில் வரும் பொதுவான இறைப்பட்டம்; தமிழில் இயல்பாகவும் மிகைப்படுத்தாமலும் ‘தேவன்’ என வழங்கப்பட்டுள்ளது.
- source_word: וְיַעֲנֵם
  choice: அவர்களைத் தாழ்த்துவார்
  rationale: ענה என்ற வடிவம் ‘பதிலளிப்பார்’ என்றும் புரிந்துகொள்ளப்படலாம். ஆனால் பகைவர்மீதான இறைத்தீர்ப்பைப் பேசும் சூழலில், தண்டனைக்குரிய தாழ்த்துதல் என்ற பொருள் பொருத்தமாகத் தெரிகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் காக்கப்பட்டுள்ளது.
- source_word: וְיֹשֵׁב קֶדֶם
  choice: பண்டைக்காலமுதல் அரியணையில் வீற்றிருப்பவர்
  rationale: ישׁב மற்றும் קדם ஆகியவை தேவனுடைய தொன்மையான, நிலையான அரசாட்சியை உணர்த்துகின்றன; ‘அரியணையில் வீற்றிருப்பவர்’ அரசருக்குரிய நுண்பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: סֶלָה
  choice: சேலா
  rationale: இதன் துல்லியமான பொருளும் வழிபாட்டுப் பயன்பாடும் உறுதியற்றவை; ஆகவே மொழிபெயர்க்காமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: אֲשֶׁר אֵין חֲלִיפוֹת לָמוֹ
  choice: ஏனெனில், அவர்களுடைய நிலைமையில் எந்த மாற்றமும் இல்லை
  rationale: חֲלִיפוֹת என்பது மாற்றங்கள், மாறுதல்கள் அல்லது நிலைத் தலைகீழாக்கங்களைக் குறிக்கலாம். சிரமமான இத்தொடர், இடையூறற்ற நிலை அவர்களிடம் இறைப்பயமின்மையை வளர்த்தது என்பதைக் குறிக்கலாம்.
- source_word: וְלֹא יָרְאוּ אֱלֹהִים
  choice: அவர்கள் தேவனுக்குப் பயப்படுவதும் இல்லை
  rationale: எபிரெய நிறைவுற்ற வினை இங்கு அவர்களுடைய நிலையான மனப்பாங்கைக் குறிக்கும் நிகழ்காலப் பொருளில் இயல்பாக வழங்கப்பட்டுள்ளது.
theological_decisions:
- issue: ענה என்ற இரண்டாவது வினையின் பொருள்
  choice: தேவன் அவர்களைத் தண்டனைத் தீர்ப்பில் தாழ்த்துவார்
  alternative: தேவன் அவர்களுக்குப் பதிலளிப்பார்
  rationale: உடனடிச் சூழல் தீய பகைவர்களையும் தேவனுடைய தீர்ப்பையும் பற்றியது. எனவே தண்டனை சார்ந்த ‘தாழ்த்துவார்’ முதன்மை உரையில் கொள்ளப்பட்டுள்ளது; ஆனால் வடிவியல் ரீதியாக இயல்பான ‘பதிலளிப்பார்’ என்ற வாசிப்பும் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- issue: חֲלִיפוֹת לָמוֹ என்ற சிரமமான தொடரின் குறிப்பு
  choice: அவர்களுடைய சூழ்நிலையில் மாற்றமின்மை
  alternative: அவர்களுக்கு நிலைத் தலைகீழாக்கங்கள் இல்லை; அல்லது அவர்களுக்குள் மாற்றம் இல்லை
  rationale: தொடர் உண்மையாகவே பலவாறு புரிந்துகொள்ளத்தக்கது. சூழ்நிலையில் இடையூறு அல்லது மாற்றமில்லாததால் உருவாகும் தன்னிறைவை முதன்மை வாசிப்பு காட்டுகிறது; மற்ற சாத்தியங்கள் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளன.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘சேலா’வின் உறுதியற்ற பொருள் ஒலிபெயர்ப்பால் காக்கப்பட்டுள்ளது. முதன்மை உரையின் ஓட்டத்தையும் எபிரெயத்தின் பொருள் மயக்கத்தையும் சமநிலைப்படுத்த அடிக்குறிப்புகள் பயன்படுத்தப்பட்டுள்ளன.
