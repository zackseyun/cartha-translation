  text: Destruction is within her[b][a]; oppression and deceit do not depart from her square.
translation:
  language: ta
  text: அழிவை விளைவிக்கும் தீமைகள்[a] அவளுக்குள் இருக்கின்றன; ஒடுக்குதலும் வஞ்சகமும் அவளுடைய பொதுச் சதுக்கத்திலிருந்து[b] நீங்குவதில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பேரழிவுகள்.” எபிரெயச் சொல் பன்மை வடிவில் உள்ளது; அது அழிவுச் செயல்கள் அல்லது கேடுண்டாக்கும் தீமைகளையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவளுடைய தெருக்களிலிருந்து.” எபிரெயச் சொல் நகரத்திலுள்ள திறந்த பொதுவிடம் அல்லது சதுக்கத்தைக் குறிப்பாகக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַוּוֹת
  choice: அழிவை விளைவிக்கும் தீமைகள்
  rationale: எபிரெயச் சொல் பன்மையில் இருந்து, அழிவுச் செயல்கள், பேரழிவுகள் அல்லது கேடுண்டாக்கும் தீமைகள் ஆகியவற்றைக் குறிக்கலாம். பன்மையைப் பாதுகாத்து, இந்நகரச் சூழலில் இயல்பாகப் புரியும் வகையில் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: בְּקִרְבָּהּ
  choice: அவளுக்குள்
  rationale: சொல்லர்த்தமாக ‘அவளின் நடுவில்’ எனப் பொருள்படும். பெண்பாலில் உருவகப்படுத்தப்பட்ட நகரத்தையும், அதன் உள்ளே என்ற இடப் பொருளையும் இது பாதுகாக்கிறது.
- source_word: יָמִישׁ
  choice: நீங்குவதில்லை
  rationale: வினைச்சொல் ஒருமை வடிவில் இருந்தாலும், ‘ஒடுக்குதலும் வஞ்சகமும்’ என்ற இணைந்த தீமைகள் தொடர்ந்து அங்கே இருப்பதைக் குறிக்கும் இயல்பான தமிழாக அமைக்கப்பட்டுள்ளது.
- source_word: מֵרְחֹבָהּ
  choice: அவளுடைய பொதுச் சதுக்கத்திலிருந்து
  rationale: רְחוֹב என்பது நகரத்தின் திறந்த பொதுவிடம் அல்லது சதுக்கத்தைச் சிறப்பாகக் குறிக்கலாம். பெண்பால் நகர உருவகத்தையும் מן முன்னொட்டின் ‘இலிருந்து’ பொருளையும் மொழிபெயர்ப்பு தக்கவைக்கிறது.
- source_word: תֹּךְ
  choice: ஒடுக்குதல்
  rationale: இச்சொல் ஒடுக்குதல், சுரண்டல் அல்லது பலவந்தப் பறிப்பு ஆகிய பொருள்களைக் கொள்ளலாம். சமூகத் தீமைகள் நிறைந்த நகரச் சூழலில் ‘ஒடுக்குதல்’ தெளிவான, பரந்த பொருளுடைய தேர்வு.
- source_word: וּמִרְמָה
  choice: வஞ்சகம்
  rationale: מִרְמָה என்பது வஞ்சகம், மோசடி அல்லது துரோகம் எனப் பொருள்படலாம். இங்கு ‘வஞ்சகம்’ பொதுவான பொருளை இயல்பாக வெளிப்படுத்துகிறது.
