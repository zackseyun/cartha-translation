translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, கண்ணியமான மற்றும் பொதுவாசகர்களுக்குப் புரியும் நடை. நகரத்தைப் பெண்பாலாக உருவகிக்கும் மூலத்தின் அமைப்பு ‘அவள்’ என்பதன் மூலம் காக்கப்பட்டுள்ளது. குறிப்பிடப்படாத பன்மை எழுவாயை ஊகித்து நிரப்பாமல் ‘அவை’ என வழங்கப்பட்டுள்ளது.
