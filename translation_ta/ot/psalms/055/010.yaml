  text: יוֹמָ֤ם וָ/לַ֗יְלָה יְסוֹבְבֻ֥/הָ עַל חוֹמֹתֶ֑י/הָ וְ/אָ֖וֶן וְ/עָמָ֣ל בְּ/קִרְבָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/010.yaml
  text: Day and night they go around her on her walls[b][a], and trouble and misery are within her.
translation:
  language: ta
  text: பகலும் இரவும் அவை அவளுடைய மதில்களின்மேல் அவளைச் சுற்றித் திரிகின்றன[a]; தீமையும் துன்பமும் அவளுக்குள் இருக்கின்றன[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவை அவளுடைய மதில்களின்மேல் அவளைச் சூழ்ந்திருக்கின்றன.” எபிரெய வினைச்சொல் சுற்றித் திரிவதையும் சூழ்ந்துகொள்வதையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: “தீமையும் துன்பமும்” என்பதை “அக்கிரமமும் ஒடுக்குமுறையும்” அல்லது “கேடும் வருத்தமும்” என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொற்கள் அறநெறிசார் தீமையையும் அது உண்டாக்கும் துன்பத்தையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹמָם וָלַיְלָה
  choice: பகலும் இரவும்
  rationale: தொடர்ந்து நடைபெறும் செயலைக் குறிக்கும் இயல்பான தமிழ்ச் சொற்றொடர்; எபிரெய இணையின் சுருக்கத்தையும் காக்கிறது.
- source_word: יְסוֹבְבֻהָ
  choice: அவை அவளைச் சுற்றித் திரிகின்றன
  rationale: סבב என்பது சுற்றிச் செல்லுதல் அல்லது சூழ்ந்துகொள்ளுதல் என இருபொருள் தரக்கூடும். பன்மை வினையின் எழுவாய் இவ்வசனத்தில் வெளிப்படையாகக் கூறப்படாததால், பாலினமற்ற பன்மைச் சுட்டான ‘அவை’ பயன்படுத்தப்பட்டுள்ளது; இயக்க உணர்வும் காக்கப்படுகிறது.
- source_word: עַל חוֹמֹתֶיהָ
  choice: அவளுடைய மதில்களின்மேல்
  rationale: עַל என்பதன் நேரடிப் பொருளான ‘மேல்’ என்பதையும், பெண்பாலாக உருவகிக்கப்படும் நகரத்தையும் தெளிவாகக் காட்டுகிறது.
- source_word: אָוֶן
  choice: தீமை
  rationale: இச்சொல் அக்கிரமம், தீமை, அதனால் விளையும் கேடு அல்லது துன்பம் ஆகியவற்றைக் குறிக்கலாம். இணைச்சொல்லிலிருந்து வேறுபாட்டைக் காத்து அதன் அறநெறிசார் வலிமையை வெளிப்படுத்த ‘தீமை’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: עָמָל
  choice: துன்பம்
  rationale: இச்சொல் துன்பம், வருத்தம், கடுமையான உழைப்பு அல்லது ஒடுக்குமுறை சார்ந்த கேடு ஆகியவற்றைக் குறிக்கலாம். இங்கு நகரத்தின் அகநிலையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: בְּקִרְבָּהּ
  choice: அவளுக்குள் இருக்கின்றன
  rationale: எழுத்துப்பொருள் ‘அவளுடைய நடுவில்.’ நகரத்தின் பெண்பால் உருவகத்தைப் பாதுகாத்து, நவீன தமிழில் இயல்பாக வழங்குகிறது.
