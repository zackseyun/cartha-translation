lexical_decisions:
- source_word: אָחִישָׁה
  choice: விரைந்து செல்வேன்
  rationale: חוּשׁ என்பதன் இவ்வடிவம் அவசரத்தையும், முதலாம் நபரின் உறுதியான விருப்பம் அல்லது தீர்மானத்தையும் வெளிப்படுத்துகிறது. தமிழில் இயல்பாக இவ்விரு நுணுக்கங்களையும் கொண்டுவர “விரைந்து செல்வேன்” தேர்ந்தெடுக்கப்பட்டது.
- source_word: מִפְלָט
  choice: ஒரு புகலிடம்
  rationale: இச்சொல் தப்பிச் செல்லும் வழியையோ பாதுகாப்பான இடத்தையோ குறிக்கலாம். சங்கீதத்தின் சூழலில் “புகலிடம்” தெளிவாகவும் இயல்பாகவும் உள்ளது; தப்பித்தல் என்ற கருத்தும் சூழலில் நிலைத்திருக்கிறது.
- source_word: לִי
  choice: எனக்கென
  rationale: முதலாம் நபருக்கான தனிப்பட்ட நலன் அல்லது பயன்பாட்டைக் குறிக்கும் எபிரெய முன்னொட்டு தமிழில் “எனக்கென” என்று இயல்பாக வெளிப்படுத்தப்படுகிறது.
- source_word: מֵרוּחַ סֹעָה
  choice: கொந்தளிக்கும் காற்றிலிருந்து
  rationale: רוּחַ இங்கு தொடர்ந்து வரும் புயல் உருவகத்தால் “காற்று” எனப் பொருள்படுகிறது. סֹעָה காற்றின் வன்மையான, கலங்கிய இயக்கத்தை விவரிப்பதால் “கொந்தளிக்கும்” என மொழிபெயர்க்கப்பட்டது.
- source_word: מִסָּעַר
  choice: புயலிலிருந்து
  rationale: סַעַר என்பதற்கு இச்சூழலில் தெளிவான நவீனத் தமிழ் இணை “புயல்.” எபிரெயத்தில் மீண்டும் வரும் מִן என்ற முன்னொட்டின் இணை அமைப்பு தமிழில் “காற்றிலிருந்தும் புயலிலிருந்தும்” என்று காக்கப்பட்டுள்ளது.
