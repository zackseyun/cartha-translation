  text: I would hasten to a refuge for myself from the rushing wind[a], from the storm.
translation:
  language: ta
  text: கொந்தளிக்கும் காற்றிலிருந்தும் புயலிலிருந்தும் தப்பிக்க, எனக்கென ஒரு புகலிடத்துக்கு விரைந்து செல்வேன்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “விரைந்து தப்பிச் செல்வேன்” அல்லது “ஒரு புகலிடத்துக்கு நான் விரைந்து செல்லட்டும்.” எபிரெய வினை வடிவம் பேச்சாளரின் அவசரமான தனிப்பட்ட தீர்மானத்தையோ விருப்பத்தையோ வெளிப்படுத்துகிறது.
