revisions:
- from: தேவனே, என் விண்ணப்பத்திற்குச் செவிகொடும்; என் மன்றாட்டிலிருந்து உம்மை மறைத்துக்கொள்ளாதிரும்.[a]
  to: தேவனே, என் ஜெபத்திற்குச் செவிகொடும்; என் மன்றாட்டுக்கு உம்மை மறைத்துக்கொள்ளாதிரும்.[a]
  rationale: The revision keeps the Hebrew imagery of God ‘hiding himself’ while replacing an unnatural literal Tamil prepositional phrase with the idiomatic dative construction. It also restores a clear prayer/plea distinction and locates the lexical-alternative footnote at the relevant clause.
