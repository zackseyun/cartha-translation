  text: הַאֲזִ֣ינָ/ה אֱ֭לֹהִים תְּפִלָּתִ֑/י וְ/אַל תִּ֝תְעַלַּ֗ם מִ/תְּחִנָּתִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/001.yaml
  text: Give ear[a], O God, to my prayer, and do not hide yourself from my supplication.
translation:
  language: ta
  text: தேவனே, என் ஜெபத்திற்குச் செவிகொடும்; என் மன்றாட்டுக்கு உம்மை மறைத்துக்கொள்ளாதிரும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் மன்றாட்டைப் புறக்கணிக்காதிரும்.” எபிரெய வினைச்சொல் சொற்பொருளில் “உம்மை மறைத்துக்கொள்ளாதிரும்” என்று வருகிறது; அது மன்றாட்டைக் கவனிக்க மறுப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֲזִינָה
  choice: செவிகொடும்
  rationale: אזן என்பதன் கட்டளை வடிவம் கவனமாகக் கேட்பதைக் குறிக்கிறது. ‘செவிகொடும்’ என்ற இயல்பான தமிழ் வேண்டுதல் நடை, எபிரெய உருவகத்தையும் மன்றாட்டின் தொனியையும் காக்கிறது.
- source_word: אֱלֹהִים
  choice: தேவனே
  rationale: இது இஸ்ரவேலின் தேவனை நேரடியாக அழைக்கும் சொல். இங்கு உடன்படிக்கைப் பெயர் இல்லாததால் ‘கர்த்தாவே’ என்று மொழிபெயர்க்காமல், விளிவேற்றுமையுடன் ‘தேவனே’ என வழங்கப்பட்டுள்ளது.
- source_word: תְּפִלָּתִי
  choice: என் விண்ணப்பம்
  rationale: תְּפִלָּה என்பது பொதுவாக இறைவனை நோக்கிய வேண்டுதல் அல்லது ஜெபத்தைக் குறிக்கிறது. இச்சூழலில் ‘விண்ணப்பம்’ வேண்டுகோளின் தன்மையையும் கண்ணியமான நவீன நடையையும் தருகிறது.
- source_word: וְאַל
  choice: …ஆதிரும்
  rationale: இணைப்புச் சொலும் எதிர்மறைக் கட்டளைத் துகளும் முதல் வேண்டுதலோடு இரண்டாவது வேண்டுதலை இணைக்கின்றன. தமிழில் எதிர்மறை வேண்டுகோள் வினைமுற்றால் இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: תִּתְעַלַּם
  choice: உம்மை மறைத்துக்கொள்ளாதிரும்
  rationale: עלם என்பதன் இவ்வடிவம் தம்மை மறைத்துக்கொள்வது அல்லது அணுக முடியாதவராக இருப்பது என்ற உருவகத்தைத் தருகிறது. ‘புறக்கணிக்காதிரும்’ என்ற விளக்கப் பொருளை நேரடியாக்காமல், மூலத்தின் உறவுசார் உருவகம் காக்கப்பட்டுள்ளது.
- source_word: מִתְּחִנָּתִי
  choice: என் மன்றாட்டிலிருந்து
  rationale: תְּחִנָּה என்பது அருள் அல்லது இரக்கம் நாடும் தீவிர மன்றாட்டைக் குறிக்கிறது. முன்னொட்டு מִן தரும் ‘இருந்து’ என்ற தொடர்பும் நேரடியாகத் தக்கவைக்கப்பட்டுள்ளது.
