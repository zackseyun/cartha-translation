translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் அதேவேளையில் சங்கீதத்தின் உயர்ந்த கவிதைத் தொனியைத் தக்கவைக்கும் நடை. சாபவேண்டுதலின் வலிமை மென்மையாக்கப்படவில்லை. ‘ஷியோல்’ ஒலிபெயர்க்கப்பட்டு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது; மூலத்தின் உறுதியின்மையும் பொருள் இரட்டுறுதலும் மறைக்கப்படவில்லை.
