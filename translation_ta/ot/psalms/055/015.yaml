base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/015.yaml
  text: Let death come upon them[a]; let them go down alive to Sheol, for evil is in their dwelling[d][c][b], in their midst.
translation:
  language: ta
  text: 'மரணம் அவர்கள்மேல் வரட்டும்[a];

    அவர்கள் உயிரோடே ஷியோலுக்குள் இறங்கட்டும்[b];

    ஏனெனில், அவர்களுடைய குடியிருப்பிலும்[c]

    அவர்கள் நடுவிலும்[d] தீமை இருக்கிறது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அழிவுகள் அவர்கள்மேல் வரட்டும்,” “மரணம் அவர்களைத் திடீரென வந்தடையட்டும்,” அல்லது இதைப் போன்ற பொருள். தொடக்க எபிரெயச் சொல் கடினமானது; அதன் சரியான நுட்பம் உறுதியற்றது.
    reason: textual_variant
  - marker: b
    text: “ஷியோல்” என்பது இறந்தோரின் உலகைக் குறிக்கும் எபிரெயச் சொல்; அல்லது, “கல்லறை.”
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “அவர்களுடைய வாழ்விடத்திலும்” / “அவர்கள் தங்கியிருப்பிலும்.”
    reason: lexical_alternative
  - marker: d
    text: அல்லது, “அவர்களுக்குள்ளும்” / “அவர்களிடையிலும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ישימות
  choice: மரணம் … வரட்டும்
  rationale: தொடக்கத்திலுள்ள எபிரெய வடிவம் கடினமானதும் அதன் சரியான நுட்பம் உறுதியற்றதுமாகும். அடுத்த அடியில் உயிரோடே ஷியோலுக்குள் இறங்குவது கூறப்படுவதால், மரணம் அவர்களை வந்தடைய வேண்டும் என்ற சாபவேண்டுதல் இணைநிலைக்கு ஏற்றதாகிறது; பிற சாத்தியங்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: עָלֵימוֹ
  choice: அவர்கள்மேல்
  rationale: எபிரெய முன்னொட்டும் மூன்றாம் நபர் ஆண்பால் பன்மை பின்னொட்டும் நேரடியாகக் காட்டும் பொருளை இயல்பான கவிதை நடையில் தருகிறது.
- source_word: יֵרְדוּ
  choice: இறங்கட்டும்
  rationale: சூழலில் விருப்ப/சாபவேண்டுதல் வலிமை உள்ளது; கீழ்நோக்கிய இயக்க உருவகத்தையும் தமிழ் வினை தெளிவாகக் காக்கிறது.
- source_word: שְׁאוֹל
  choice: ஷியோல்
  rationale: ‘கல்லறை’ அல்லது பிற்காலக் கோட்பாட்டு கருத்தான ‘நரகம்’ என்று பொருளைச் சுருக்காமல், இறந்தோரின் உலகைக் குறிக்கும் எபிரெயச் சொல்லின் பரப்பை ஒலிபெயர்ப்பு பாதுகாக்கிறது.
- source_word: חַיִּים
  choice: உயிரோடே
  rationale: அவர்கள் இன்னும் உயிருடன் இருக்கும்போதே இறங்குவதை வினையடைப் பொருளில் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய சாபவேண்டுதலுக்கான காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: רָעוֹת
  choice: தீமை
  rationale: பன்மை வடிவிலுள்ள சொல் இங்கு கூட்டு அர்த்தத்தில் ஒழுக்கத் தீமையையோ கொடுமையையோ குறிக்கிறது; ‘தீமை’ என்பது இயல்பாகவும் பரந்த பொருளுடனும் உள்ளது.
- source_word: בִּמְגוּרָם
  choice: அவர்களுடைய குடியிருப்பிலும்
  rationale: இச்சூழலில் அவர்கள் வசிக்கும் இடம் அல்லது வாழ்விடம் என்பதே பொருத்தமான பொருள்; அடுத்த இடவியல் தொடருடன் இணைவதை ‘-இலும்’ வெளிப்படுத்துகிறது.
- source_word: בְּקִרְבָּם
  choice: அவர்கள் நடுவிலும்
  rationale: இது ‘அவர்களுக்குள்’ அல்லது ‘அவர்களிடையே’ எனவும் பொருள்படலாம். முந்தைய குடியிருப்பு குறிப்பு காரணமாக, சமூகத்தின் மத்தியில் தீமை இருப்பதைச் சொல்லும் இத்தேர்வு பொருத்தமானது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
