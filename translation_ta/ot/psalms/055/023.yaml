  text: But you[a], God, will bring them down to the pit of destruction; men of bloodshed and deceit will not live out half their days[b], but I will trust in you.
translation:
  language: ta
  text: ஆனால் கடவுளே, நீர் அவர்களை அழிவின் குழிக்குள்[a] இறக்குவீர்; இரத்தம் சிந்தும் வஞ்சகர்கள் தங்கள் வாழ்நாளில் பாதியைக்கூட எட்ட மாட்டார்கள்[b]. நானோ உம்மை நம்புவேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சிதைவின் குழி,’ ‘கல்லறைக் குழி,’ அல்லது ‘குழி’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்குச் சொல்: ‘தங்கள் நாட்களைப் பாதியாகப் பிரிக்க மாட்டார்கள்.’ அதாவது, அவர்களுடைய வாழ்க்கை முன்கூட்டியே முடிவடையும்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרִדֵם
  choice: அவர்களை இறக்குவீர்
  rationale: ירד என்பதன் ஹிஃபில் வடிவம் ‘கீழே செல்லச் செய்தல்’ என்ற காரணவினைப் பொருளைத் தருகிறது. ‘இறக்குவீர்’ அந்தப் பொருளை இயல்பான தமிழில் காக்கிறது; தீர்ப்பின் முறை என்ன என்பதைத் தேவையின்றி விளக்குவதில்லை.
- source_word: לִבְאֵר שַׁחַת
  choice: அழிவின் குழிக்குள்
  rationale: בְּאֵר என்பது ‘குழி/கிணறு’ என்றும் שַׁחַת என்பது ‘அழிவு, சிதைவு, குழி’ என்றும் பொருள்படலாம். ‘அழிவின் குழி’ மரணத்தையும் தெய்வீகத் தீர்ப்பையும் சித்தரிக்கும் உருவகத்தைப் பாதுகாக்கிறது; அதை வெறும் ‘கல்லறை’ எனக் குறுக்குவதில்லை.
- source_word: אַנְשֵׁי דָמִים וּמִרְמָה
  choice: இரத்தம் சிந்துகிற வஞ்சகர்கள்
  rationale: ‘இரத்தங்களின் மனிதர்கள்’ என்பது வன்முறையிலும் இரத்தப்பழியிலும் ஈடுபடுவோரைக் குறிக்கும் எபிரேய மரபுத்தொடர்; מִרְמָה அவர்களுடைய வஞ்சகத்தையும் குறிக்கிறது. தமிழில் இரு பண்புகளையும் ஒரே குழுவுக்குரியவையாக இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לֹא יֶחֱצוּ יְמֵיהֶם
  choice: தங்கள் வாழ்நாளில் பாதியைக்கூட எட்ட மாட்டார்கள்
  rationale: חצה என்பதன் நேர்ப்பொருள் ‘பாதியாகப் பிரித்தல்’. இங்குள்ள மரபுத்தொடர் அவர்களுடைய வாழ்க்கை எதிர்பார்க்கப்படும் காலத்துக்கு முன்பே முடிவடையும் என்பதைக் குறிக்கிறது. மொழிபெயர்ப்பு ‘பாதி’ என்ற மூலப்படிமத்தையும் குறுகிய ஆயுள் என்ற பொருளையும் காக்கிறது.
- source_word: וַאֲנִי אֶבְטַח בָּךְ
  choice: நானோ உம்மை நம்புவேன்
  rationale: வெளிப்படையாக இடம்பெறும் אֲנִי வலியுறுத்தலையும், தீயோரின் முடிவுக்கும் சங்கீதக்காரரின் நம்பிக்கைக்கும் இடையிலான வேறுபாட்டையும் ‘நானோ’ தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: ‘அழிவின் குழி’ என்ற தீர்ப்பு உருவகத்தின் இயல்பு
  choice: தெய்வீகத் தீர்ப்பு மரணம் அல்லது அழிவுக்கு இட்டுச் செல்வதைச் சித்தரிக்கும் வலுவான உருவகமாக மொழிபெயர்க்கப்பட்டது; குறிப்பிட்ட மறுமைத் தண்டனைக் கோட்பாடாக வரையறுக்கப்படவில்லை.
  alternative: ‘கல்லறை’, ‘பாதாளம்’, அல்லது ‘சிதைவு’ என்று குறிப்பாக்குதல்.
  rationale: எபிரேயச் சொற்றொடர் வலுவான தீர்ப்பு மற்றும் மரணப் படிமத்தை அளிக்கிறது; ஆனால் இவ்விடத்தில் ‘நரகம்’ போன்ற தொழில்நுட்பமான இறுதிக்காலக் கருத்தை கட்டாயப்படுத்தும் அளவுக்குத் துல்லியமாக இல்லை. ஆகவே மூலத்தின் தெளிவின்மை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் விதத்திலும் சங்கீதத்திற்கேற்ற கண்ணியமான நடையிலும் அமைக்கப்பட்டது. கடவுளை நோக்கும் ஒருமை மரியாதை வடிவமாக ‘நீர்/உம்மை’ பயன்படுத்தப்பட்டது. ‘நானோ’ எதிர்மறை ஒப்புமையையும் உரையாசிரியரின் வலியுறுத்தலையும் காக்கிறது.
