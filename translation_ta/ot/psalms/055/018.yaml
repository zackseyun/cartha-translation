  text: פָּ֘דָ֤ה בְ/שָׁל֣וֹם נַ֭פְשִׁ/י מִ/קֲּרָב לִ֑/י כִּֽי בְ֝/רַבִּ֗ים הָי֥וּ עִמָּדִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/018.yaml
  text: He has redeemed my soul in peace from the battle against me[a], for many were with me.
translation:
  language: ta
  text: அவர் எனக்கு எதிரான போரிலிருந்து என் உயிரைச் சமாதானத்தில் மீட்டார்[a]; ஏனெனில் பலர் என்னுடன் இருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எனக்கு எதிரான போரிலிருந்து என் உயிரைப் பாதுகாப்பாக மீட்டார்.” இறுதிக் கூற்றையும் சூழலின் அடிப்படையில், “ஏனெனில் பலர் எனக்கு எதிராக இருந்தார்கள்” என்று புரிந்துகொள்ளலாம். எபிரெயில் சொல்லுக்குச் சொல், “ஏனெனில் பலர் என்னுடன் இருந்தார்கள்” என்று உள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: פָּדָה
  choice: மீட்டார்
  rationale: மீட்புவிலையால் விடுவித்தல் அல்லது ஆபத்திலிருந்து மீட்டல் என்ற வினையின் வலுவான மீட்பு நுணுக்கத்தைத் தக்கவைக்கிறது.
- source_word: בְשָׁלוֹם
  choice: சமாதானத்துடன்
  rationale: சமாதானம், நலம், முழுமை ஆகிய பொருள் விரிவைச் சுருக்காமல், எபிரெயச் சொற்றொடரின் பெயர்ச்சொல் வடிவையும் இயன்றவரை தக்கவைக்கிறது.
- source_word: נַפְשִׁי
  choice: என் உயிரை
  rationale: நֶפֶשׁ இங்கு உயிர், தன்முழுமை, நபர் ஆகியவற்றைக் குறிக்கலாம்; நவீன தமிழில் ‘என் உயிரை’ என்பது இயல்பாகவும் கவித்துவமாகவும் இருந்து, உடலிலிருந்து பிரிந்த ‘ஆத்துமா’ என்ற குறுகிய வாசிப்பைத் தவிர்க்கிறது.
- source_word: מִקֲּרָב לִי
  choice: எனக்கு எதிரான போரிலிருந்து
  rationale: קְרָב என்பதன் போர்/மோதல் உருவகத்தையும், לִי என்பதன் சூழல்சார் எதிர்நிலையையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றிற்கான காரணம் அல்லது விளக்கத்தை அறிமுகப்படுத்தும் இணைப்புச் சொல்லின் இயல்பான தமிழ் இணை.
- source_word: בְרַבִּים הָיוּ עִמָּדִי
  choice: பலர் என்னுடன் இருந்தார்கள்
  rationale: עִמָּדִי என்பதன் நேரடியான ‘என்னுடன்’ என்ற பொருளைத் தக்கவைத்து, இறுதிக் கூற்றிலுள்ள உண்மையான சூழல்சார் இருபொருள்தன்மையைத் தீர்த்துவிடாமல் விடுகிறது.
theological_decisions:
- issue: בְרַבִּים הָיוּ עִמָּדִי என்ற இறுதிக் கூற்றின் விளக்கம்
  choice: பலர் என்னுடன் இருந்தார்கள்
  alternative: பலர் எனக்கு எதிராக இருந்தார்கள்
  rationale: எபிரெயில் עִמָּדִי என்பதன் இயல்பான பொருள் ‘என்னுடன்’; ஆனால் மோதல் சூழலில் அது எண்ணற்ற எதிரிகளைக் குறிக்கும் கூற்றாகவும் புரிந்துகொள்ளப்பட்டுள்ளது. மூலத்தின் பதற்றத்தை முதன்மை உரை தக்கவைக்கிறது; சூழல்சார் மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் ஆனால் சங்கீதத்திற்கேற்ற கண்ணியமான கவித்துவ நடையைப் பயன்படுத்துகிறது. ‘என் உயிரை’ என்பது נֶפֶשׁ என்பதன் முழு நபர்/உயிர் நுணுக்கத்தை இயல்பாகக் கொண்டுவருகிறது; இறுதிக் கூற்றின் இருபொருள்தன்மை அடிக்குறிப்புடன் பாதுகாக்கப்பட்டுள்ளது.
