source:
  edition: WLC
  text: בַּלַּ֣ע אֲ֭דֹנָ/י פַּלַּ֣ג לְשׁוֹנָ֑/ם כִּֽי רָאִ֨יתִי חָמָ֖ס וְ/רִ֣יב בָּ/עִֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/009.yaml
  text: Confuse them[a], Lord; divide their speech[b], for I have seen violence and strife in the city.
translation:
  language: ta
  text: ஆண்டவரே, அவர்களைக் குழப்பிவிடும்[a]; அவர்களுடைய பேச்சைப் பிரித்துவிடும்[b]. ஏனெனில் நகரத்தில் வன்முறையையும் சண்டையையும் நான் கண்டேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு மொழிபெயர்ப்பு: ‘ஆண்டவரே, அவர்களை விழுங்கிவிடும்’ அல்லது ‘அவர்களை அழித்துவிடும்.’ எபிரெய வினைக்கு நேரடியாக அழிவைக் குறிக்கும் பொருள் இருக்கலாம்; இங்கு அவர்களுடைய திட்டங்களைக் குழப்பி முறியடிப்பதையும் அது குறிக்கலாம்.'
    reason: alternative_reading
  - marker: b
    text: 'நேரடி மொழிபெயர்ப்பு: ‘அவர்களுடைய நாக்கைப் பிரித்துவிடும்’; அதாவது, அவர்கள் ஒருமித்துப் பேசவோ ஒருவரையொருவர் புரிந்துகொள்ளவோ முடியாதபடி அவர்களுடைய தொடர்பைச் சீர்குலைத்துவிடும்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּלַּע
  choice: அவர்களைக் குழப்பிவிடும்
  rationale: בּלע என்பதன் அடிப்படைப் பொருள் ‘விழுங்கு’ அல்லது அழிவுக்குட்படுத்து என்பதாக இருக்கலாம். ஆனால் அடுத்துள்ள ‘அவர்களுடைய பேச்சைப் பிரித்துவிடும்’ என்ற இணை வேண்டுதலுடன் பார்க்கும்போது, அவர்களின் ஒருங்கிணைந்த திட்டத்தையும் தொடர்பையும் சீர்குலைக்கும் பொருள் இங்கு இயல்பாகிறது. சொல்லின் அழிவுசார் நேரடிப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: אֲדֹנָי
  choice: ஆண்டவரே
  rationale: இது יהוה என்ற தனிப்பெயர் அல்ல; ‘ஆண்டவர்’ என்னும் இறைப்பட்டம். விளிவேற்றுமையுடன் வரும் வேண்டுதலுக்கு நவீனத் தமிழில் ‘ஆண்டவரே’ இயல்பானது.
- source_word: פַּלַּג
  choice: பிரித்துவிடும்
  rationale: கட்டளை வடிவிலுள்ள வினை ‘பிரி/பிளவு செய்’ என்று பொருள்படும். வேண்டுதல் நடையின் வலிமையைத் தமிழில் ‘பிரித்துவிடும்’ வெளிப்படுத்துகிறது.
- source_word: לְשׁוֹנָם
  choice: அவர்களுடைய பேச்சை
  rationale: לָשׁוֹן என்பதன் நேரடிப் பொருள் ‘நாக்கு’; இங்கு அது பேச்சு அல்லது மொழித் தொடர்பைக் குறிக்கிறது. ‘பேச்சு’ சாதாரண வாசகருக்கு இயல்பாக இருந்து, கூட்டாகப் பேசிச் செயல்படும் திறன் சீர்குலைவதைத் தெரிவிக்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய வேண்டுதலுக்கான காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: רָאִיתִי
  choice: நான் கண்டேன்
  rationale: எபிரெய நிறைவுற்ற வினையைத் தமிழில் இயல்பான இறந்தகாலமாக வழங்குகிறது; கவிஞரின் நேரடி அவதானிப்பைத் தக்கவைக்கிறது.
- source_word: חָמָס
  choice: வன்முறை
  rationale: இச்சொல் வன்முறை, கொடுமை, வன்முறையோடு கூடிய அநீதி ஆகியவற்றைக் குறிக்கலாம். இச்சூழலில் ‘வன்முறை’ தெளிவான முதன்மைப் பொருள்.
- source_word: וְרִיב
  choice: சண்டை
  rationale: רִיב என்பது தகராறு, பூசல், மோதல் ஆகியவற்றைக் குறிக்கும். ‘சண்டை’ நவீனத் தமிழில் இயல்பாகவும் ‘வன்முறை’ என்பதோடு பொருத்தமான இணையாகவும் உள்ளது.
- source_word: בָּעִיר
  choice: நகரத்தில்
  rationale: குறிப்பிட்ட நகரத்திற்குள் நிகழ்வதைச் சுட்டும் நேரடியான இடவியல் மொழிபெயர்ப்பு.
theological_decisions:
- issue: தொடக்கக் கட்டளை בַּלַּע என்பதையும் தொடர்ந்து வரும் ‘அவர்களுடைய பேச்சைப் பிரித்துவிடும்’ என்பதையும் எவ்வாறு தொடர்புபடுத்துவது
  choice: முதன்மை உரையில் எதிரிகளை அல்லது அவர்களின் ஒருங்கிணைப்பைக் குழப்பும்படியான வேண்டுதலாக வழங்கப்பட்டது.
  alternative: ‘அவர்களை விழுங்கிவிடும்’ அல்லது ‘அவர்களை அழித்துவிடும்’ என்ற அழிவுசார் வாசிப்பு.
  rationale: அடுத்து வரும் பேச்சைப் பிரிக்கும் வேண்டுதல், தொடர்பையும் கூட்டு முயற்சியையும் சீர்குலைக்கும் கருத்தை ஆதரிக்கிறது; பாபேல் நிகழ்வின் மொழிப் பிரிவையும் நினைவூட்டக்கூடும். எனினும் எபிரெய வினையின் நேரடியான அழிவுசார் பொருள் உண்மையான மாற்று என்பதால் அது அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீத வேண்டுதலுக்கேற்ற கண்ணியமான ஆனால் எளிதில் புரியும் நடையில் அமைக்கப்பட்டது. ‘குழப்பிவிடும்/பிரித்துவிடும்’ என்ற இணை அமைப்பு எபிரெயக் கவிதையின் கட்டளைத் தீவிரத்தையும் இணைப்பொருளையும் தக்கவைக்கிறது. அனைத்து அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
