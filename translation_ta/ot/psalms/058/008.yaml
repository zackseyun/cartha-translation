- source_word: כְּמוֹ
  choice: போல
  rationale: உவமையை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: שַׁבְּלוּל
  choice: நத்தை
  rationale: பாரம்பரியமாகவும் அகராதி ஆதாரத்துடனும் ஏற்கப்படும் பொருள்; ஊரும்போது கரைவது என்ற கவிதைப் படிமத்துக்கும் பொருந்துகிறது.
- source_word: תֶּמֶס
