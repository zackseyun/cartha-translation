- source_word: יַהֲלֹךְ
  choice: ஊர்ந்து செல்லும்போதே
  rationale: நத்தையின் இயக்கத்தை இயல்பாகக் குறிக்கிறது; நிகழும் இயக்கத்தோடு கரைதல் இணைந்திருப்பதையும் காட்டுகிறது.
- source_word: נֵפֶל אֵשֶׁת
  choice: குறைப்பிரசவக் குழந்தை
  rationale: சொல்லுக்குச் சொல் 'ஒரு பெண்ணின் கருச்சிதைவு/முதிராத பிறப்பு'; இங்கு சூரியனைக் காணாத உயிரையே அடுத்த தொடர் குறிப்பதால், தமிழில் மனிதக் குறிப்பைத் தெளிவாகவும் மரியாதையாகவும் தருகிறது.
- source_word: בַּל חָזוּ שָׁמֶשׁ
  choice: சூரியனைக் காணாத
  rationale: எபிரெயத்தில் வினை பன்மையில் இருந்தாலும் அது பிறக்காத அல்லது உயிரின்றிப் பிறந்த குழந்தை/குழந்தைகளைப் பொருளடிப்படையில் குறிக்கிறது; தமிழில் எண்ணிக்கைச் சிக்கலை இயல்பாகத் தவிர்க்கிறது.
