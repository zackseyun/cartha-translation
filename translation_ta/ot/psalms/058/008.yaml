revisions:
- from: அது, ஊர்ந்து செல்லும்போதே கரைந்துபோகும் நத்தையைப்போலவும், சூரியனைக் காணாத குறைப்பிரசவக் குழந்தையைப்போலவும் ஆகட்டும்.[a]
  to: அவர்கள், ஊர்ந்து செல்லும்போதே கரைந்துபோகும் நத்தையைப்போலவும், சூரியனைக் காணாத உயிரின்றிப் பிறந்த குழந்தையைப்போலவும் ஆகட்டும்.[a]
  rationale: “குறைப்பிரசவக் குழந்தை” என்பதற்குப் பதிலாக “உயிரின்றிப் பிறந்த குழந்தை” பயன்படுத்தப்பட்டுள்ளது; இது நֵפֶל குறிக்கும் கருச்சிதைவு/உயிரின்றிப் பிறப்பு என்ற படிமத்தைச் சரியாகத் தருகிறது. முன்சூழலிலிருந்து தெளிவாகும் பன்மை இலக்கைத் தமிழில் இயல்பாக்க “அவர்கள்” சேர்க்கப்பட்டுள்ளது. அடிக்குறிப்பு எபிரெய பன்மை வினைச் சிக்கலைத் தக்கவைத்துக் குறிப்பிடுகிறது.
