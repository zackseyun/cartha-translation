translation:
  language: ta
  text: அவர்கள், ஊர்ந்து செல்லும்போதே கரைந்துபோகும் நத்தையைப்போலவும், சூரியனைக் காணாத உயிரின்றிப் பிறந்த குழந்தையைப்போலவும் ஆகட்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இரண்டாவது உவமையின் எபிரெய இலக்கண அமைப்பு கடினமானது. சொல்லுக்குச் சொல், “ஒரு பெண்ணின் கருச்சிதைவு—அவர்கள் சூரியனைக் காணவில்லை” என உள்ளது. இங்கு பன்மை வினை, பிறக்காத அல்லது உயிரின்றிப் பிறந்த குழந்தைகளைப் பொருளடிப்படையில் குறிப்பதாகப் புரிந்துகொள்ளப்படுகிறது.
    reason: lexical_alternative
