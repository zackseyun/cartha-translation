source:
  edition: WLC
  text: זֹ֣רוּ רְשָׁעִ֣ים מֵ/רָ֑חֶם תָּע֥וּ מִ֝/בֶּ֗טֶן דֹּבְרֵ֥י כָזָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/058/003.yaml
  text: The wicked are estranged from the womb; they go astray from birth[a], speaking lies.
translation:
  language: ta
  text: 'தீயவர்கள் கருப்பையிலிருந்தே விலகிப்போயிருக்கிறார்கள்;

    வயிற்றிலிருந்தே வழிதவறி, பொய்களைப் பேசுகிறார்கள்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்படி, “கருப்பையிலிருந்து” … “வயிற்றிலிருந்து.” தீயவர்கள் வாழ்வின் மிகத் தொடக்கத்திலிருந்தே வழிதவறியவர்கள் என்பதை இவ்வசனம் கவித்துவ மிகைப்பால் விவரிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹרוּ
  choice: அந்நியப்பட்டிருக்கிறார்கள்
  rationale: זור என்பதன் பிரிவையும் விலகிய நிலையையும் வெளிப்படுத்துகிறது; அதை வெறும் ஒழுக்கச் சீர்கேடாக மட்டும் குறுக்காமல், அடுத்துவரும் ‘வழிதவறி’ என்பதோடு இணையான கவித்துவ உறவையும் காக்கிறது.
- source_word: רְשָׁעִים
  choice: தீயவர்கள்
  rationale: רְשָׁעִים என்பதற்கான தெளிவான, இயல்பான நவீனத் தமிழ் வகைப்பெயர்.
- source_word: מֵרָחֶם
  choice: கருப்பையிலிருந்தே
  rationale: מִן + רֶחֶם என்பதன் நேரடியான உருவகத்தைப் பாதுகாக்கிறது; ‘-இலிருந்தே’ தொடக்கக் காலத்திலிருந்து என்ற வலியுறுத்தலை இயல்பாகத் தருகிறது.
- source_word: תָּעוּ
  choice: வழிதவறி
  rationale: תעה என்பதன் அலைதல்/தவறிப்போதல் கருத்தை இயல்பான தமிழில் தருகிறது; தொடரும் பண்பாகிய பொய்ப்பேச்சுடன் வாக்கியத்தை இணைக்கிறது.
- source_word: מִבֶּטֶן
  choice: வயிற்றிலிருந்தே
  rationale: בֶּטֶן என்பதன் ‘வயிறு/கருப்பை’ என்ற உடல்சார் உருவகத்தைத் தமிழில் காக்கிறது; எபிரெயக் கவிதையின் இணைநிலையையும் மறைக்கவில்லை.
- source_word: דֹּבְרֵי כָזָב
  choice: பொய்பேசுகிறார்கள்
  rationale: பங்கேற்பு வடிவின் தொடர்ச்சியான பண்பைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: כָזָב
  choice: பொய்
  rationale: இங்கு பேச்சுடன் தொடர்புடைய כָזָב என்பதற்கான தெளிவான நவீனத் தமிழ் சொல்.
theological_decisions:
- issue: இந்த வசனம் கருவிலேயே ஒழுக்கக் குற்றம் அல்லது பிறவிப்பாவம் குறித்த தொழில்நுட்பக் கோட்பாட்டை நேரடியாகப் போதிக்கிறதா?
  choice: தீயவர்கள் வாழ்வின் மிகத் தொடக்கத்திலிருந்தே வழிதவறியவர்கள் எனச் சித்தரிக்கும் சங்கீதத்தின் கவித்துவ மிகைப்பை அப்படியே பாதுகாத்தல்.
  alternative: இதை கருவுற்ற கணத்திலிருந்தே குற்றவாளிகள் என்ற முறையான கோட்பாட்டுக் கூற்றாகத் தெளிவுபடுத்துதல்.
  rationale: ‘கருப்பையிலிருந்து’ மற்றும் ‘வயிற்றிலிருந்து’ என்ற இணைச் சொற்றொடர்கள் கண்டனச் சங்கீதத்தின் தீவிரமான கவித்துவ மொழி. மொழிபெயர்ப்பு அதன் வலிமையைக் காக்க வேண்டும்; ஆனால் வசனம் வெளிப்படையாகச் சொல்லாத கோட்பாட்டு முடிவைச் சேர்க்கக் கூடாது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘கருப்பை’ மற்றும் ‘வயிறு’ என்ற வேறுபட்ட எபிரெயச் சொற்கள் இணைவரிகளில் காக்கப்பட்டுள்ளன. அடிக்குறி குறியீடு பிரதான உரையில் சேர்க்கப்பட்டுள்ளது.
