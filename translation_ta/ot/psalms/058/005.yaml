  text: that does not listen to the voice of charmers[b][a], of one who skillfully casts spells.
translation:
  language: ta
  text: மந்திரம் ஓதுகிறவர்களின்[a] குரலுக்கோ, மந்திரங்களைக் கட்டுவதில் தேர்ந்தவனின்[b] குரலுக்கோ அது செவிசாய்ப்பதில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “முணுமுணுப்பவர்களின்.” இங்கு பயன்படுத்தப்பட்டுள்ள எபிரெயச் சொல் முணுமுணுத்தல் அல்லது மந்திர உச்சாடனம் செய்வதோடு தொடர்புடையது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், “மந்திரங்களைக் கட்டுகிற தேர்ந்தவன்.” இது திறமையான மந்திரவாதி அல்லது பாம்பை மந்திரத்தால் வசப்படுத்துகிறவனைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: அது
  rationale: முந்தைய வசனத்தில் வரும் செவிட்டுப் பாம்பைக் குறிக்கும் தொடர்பைத் தமிழில் இயல்பாகத் தொடர்கிறது.
- source_word: לֹא יִשְׁמַע
  choice: செவிசாய்ப்பதில்லை
  rationale: வெறுமனே ஒலியைக் கேட்காத நிலையைக் காட்டிலும், மந்திரிப்பவர்களின் குரலுக்கு இணங்காத அல்லது கவனம் செலுத்தாத தன்மையை இச்சூழலில் தெளிவாகக் காட்டுகிறது.
- source_word: לְקוֹל
  choice: குரலுக்கு
  rationale: קוֹל என்பதன் இயல்பான பொருளான ‘குரல்’ இங்கு மனிதர்கள் மந்திரம் ஓதுவதோடு நன்கு பொருந்துகிறது; ‘ஒலி’ என்பதும் சாத்தியம்.
- source_word: מְלַחֲשִׁים
  choice: மந்திரம் ஓதுகிறவர்கள்
  rationale: இச்சொல் முணுமுணுத்தல் அல்லது மந்திர உச்சாடனம் செய்தல் என்பதோடு தொடர்புடையது. பாம்பை வசப்படுத்தும் சூழலை உணர்த்தினாலும், ‘பாம்பாட்டிகள்’ என்று மூலத்தில் இல்லாத தொழில்பெயரைச் சேர்க்காமல் மூலச்சொல்லின் பரப்பை காக்கிறது.
- source_word: חוֹבֵר חֲבָרִים
  choice: மந்திரங்களைக் கட்டுவதில்
  rationale: ‘கட்டுகிறவன்/கட்டுகள்’ என மீண்டும் வரும் கடினமான எபிரெய மரபுத்தொடரை, அதன் மந்திர உச்சாடனப் பொருளையும் ‘கட்டுதல்’ என்ற உருவகத்தையும் காக்கும் வகையில் வழங்குகிறது.
- source_word: מְחֻכָּם
  choice: தேர்ந்தவன்
  rationale: இங்கு ஒழுக்கஞானத்தை அல்ல, பயிற்சியால் வந்த திறமையையும் நிபுணத்துவத்தையும் குறிக்கிறது.
