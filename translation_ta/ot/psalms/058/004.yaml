lexical_decisions:
- source_word: חֲמַת
  choice: நஞ்சு
  rationale: பாம்புகளைக் குறிக்கும் இரு இணைவரிகளிலும் இச்சொல் ‘கோபம்’ என்பதைக் காட்டிலும் பாம்பின் நச்சான நஞ்சையே இயல்பாகக் குறிக்கிறது.
- source_word: לָמוֹ
  choice: அவர்களுடைய
  rationale: இச்சூழலில் இந்தப் பிரதிப்பெயர் வடிவம் அடுத்துவரும் பெயர்ச்சொல்லுடன் உடைமைப் பொருளில் அமைந்து ‘அவர்களுடைய நஞ்சு’ எனப் பொருள்படுகிறது.
- source_word: כִּדְמוּת / כְּמוֹ
  choice: போன்றது
  rationale: இரு எபிரெய ஒப்புமை அமைப்புகளையும் இயல்பான தமிழ்க் கவிதை நடையில் தெளிவாகக் காட்டுகிறது.
- source_word: נָחָשׁ
  choice: பாம்பு
  rationale: முதல் இணைவரியில் பொதுவான வகையைக் குறிக்கும் இயல்பான தமிழ்ச்சொல்; அடுத்த வரியின் குறிப்பிட்ட நச்சுப்பாம்பிலிருந்து இதை வேறுபடுத்துகிறது.
- source_word: פֶתֶן
  choice: நாகப்பாம்பு
  rationale: இச்சொல் ஒரு நச்சுப்பாம்பைக் குறிக்கிறது; துல்லியமான உயிரின அடையாளம் உறுதியல்ல என்றாலும், நவீன வாசகருக்கு ‘நாகப்பாம்பு’ தெளிவான பொருத்தமாக உள்ளது. மாற்று மரபுவழி அடையாளம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: חֵרֵשׁ
  choice: செவிடான
  rationale: பாம்பாட்டியின் ஒலிக்குச் செவிகொடுக்காத பாம்பே உருவகம்; ஆகவே ‘ஊமை’ அல்ல, ‘செவிடான’ என்பதே பொருத்தம்.
- source_word: יַאְטֵם אָזְנוֹ
  choice: தன் செவியை அடைத்துக்கொள்ளும்
  rationale: வினைச்சொல்லின் மூடுதல் அல்லது அடைத்தல் என்ற உயிரோட்டமான உருவகத்தையும், எபிரெய ஒருமை உடைமையையும் இயல்பான தமிழில் காக்கிறது.
