    text: அல்லது, ‘நாகப்பாம்பு’ அல்லது ‘விரியன் பாம்பு’; எபிரெயச் சொல் ஒரு நச்சுப்பாம்பைக் குறிக்கிறது; அதன் துல்லியமான இனம் உறுதியாகத் தெரியவில்லை.
