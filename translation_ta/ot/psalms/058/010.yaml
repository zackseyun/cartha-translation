source:
  edition: WLC
  text: יִשְׂמַ֣ח צַ֭דִּיק כִּי חָזָ֣ה נָקָ֑ם פְּעָמָ֥י/ו יִ֝רְחַ֗ץ בְּ/דַ֣ם הָ/רָשָֽׁע־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/058/010.yaml
  text: The righteous will rejoice when he sees vengeance[b][a]; he will wash his feet in the blood of the wicked.
translation:
  language: ta
  text: பழித்தீர்ப்பைக் காணும்போது[a] நீதிமான் மகிழ்வான்; பொல்லாதவனின் இரத்தத்தில் தன் கால்களைக் கழுவுவான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பழித்தீர்ப்பைக் கண்டதால் நீதிமான் மகிழ்வான்.” எபிரெய இணைப்புச்சொல் காலப்பொருளில் (“காணும்போது”) மட்டுமல்ல, காரணப்பொருளிலும் (“கண்டதால்”) புரிந்துகொள்ளப்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: “பொல்லாதவனின் இரத்தத்தில் தன் கால்களைக் கழுவுவான்” என்பது தீர்ப்பின் முழுமையைச் சித்தரிக்கும் கவிதை உருவகம்; தனிப்பட்ட வன்முறையைச் செய்யும்படி கொடுக்கப்பட்ட கட்டளை அல்ல.
    reason: cultural_note
lexical_decisions:
- source_word: יִשְׂמַח
  choice: மகிழ்வான்
  rationale: שׂמח என்பதன் Qal முற்றுப்பெறாத வடிவம் இக்கவிதைச் சூழலில் வருங்காலப் பொருளைத் தருகிறது; “மகிழ்வான்” இயல்பாகவும் சுருக்கமாகவும் அதைக் காக்கிறது.
- source_word: צַדִּיק
  choice: நீதிமான்
  rationale: ஒருமை பெயர்ச்சொல்லாகப் பயன்படும் பெயரடை; “நீதிமான்” ஆண்பால் ஒருமையையும் பிரதிநிதித்துவப் பயன்பாட்டையும் காக்கிறது.
- source_word: כִּי
  choice: காணும்போது
  rationale: כִּי இங்கு காலப்பொருளிலோ காரணப்பொருளிலோ புரிந்துகொள்ளப்படலாம். முதன்மை உரையில் சூழ்நிலையை இயல்பாகக் காட்டும் “காணும்போது” தேர்ந்தெடுக்கப்பட்டு, காரணப்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: חָזָה
  choice: காண்
  rationale: חזה என்பதன் நிறைவுற்ற வடிவம், வருங்கால நோக்குடைய முதன்மை வாக்கியத்துக்குப் பின் தமிழில் “காணும்போது” என இயல்பாக மொழிபெயர்க்கப்படுகிறது.
- source_word: נָקָם
  choice: பழித்தீர்ப்பு
  rationale: இந்தச் சொல் பழிவாங்கல் அல்லது தண்டனைமிக்க பதில்செயலைக் குறிக்கிறது. “பழித்தீர்ப்பு” அதன் கடுமையை மென்மைப்படுத்தாமல், தனிப்பட்ட பழிவாங்கலை அவசியமாகச் சேர்க்காமலும் நிற்கிறது.
- source_word: פְּעָמָיו
  choice: தன் கால்கள்
  rationale: פעם என்பது அடி அல்லது காலடி எனவும் வரலாம்; இரத்தத்தில் கழுவுதல் என்ற உருவகத்தில் உடல் உறுப்பான “கால்கள்” இயல்பான பொருத்தம்.
- source_word: יִרְחַץ
  choice: கழுவுவான்
  rationale: רחץ என்பதன் Qal முற்றுப்பெறாத வடிவத்தின் ‘கழுவுதல்’ என்ற நேரடிப் பொருளையும் வருங்கால வினையையும் காக்கிறது.
- source_word: בְּדַם
  choice: இரத்தத்தில்
  rationale: בְּ முன்னொட்டு இங்கு இடப்பொருளில் இயல்பாகப் புரிகிறது; “இரத்தத்தில்” மூலத்தின் கூர்மையான காட்சியை நேரடியாகக் காக்கிறது.
- source_word: הָרָשָׁע
  choice: பொல்லாதவன்
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் ஒருமை பெயரடை. “பொல்லாதவன்” மூலத்தின் ஒருமை வடிவத்தைத் தெளிவாகக் காக்கிறது.
theological_decisions:
- issue: நீதிமான் தனிப்பட்ட பழிவாங்கலில் மகிழ்கிறானா, அல்லது நீதியான தீர்ப்பைக் கண்டு மகிழ்கிறானா?
  choice: பழித்தீர்ப்பைக் காணும் மகிழ்ச்சியையும் இரத்தத்தின் கடுமையான உருவகத்தையும் உரை அப்படியே காக்கிறது; அதைத் தனிப்பட்ட வன்முறைக்கான அழைப்பாக மாற்றவில்லை.
  alternative: “இறைவனுடைய நீதித்தீர்ப்பு” அல்லது “தனிப்பட்ட பழிவாங்கல்” என்று விளக்கத்தை முதன்மை உரையிலேயே வெளிப்படையாகச் சேர்த்தல்.
  rationale: எபிரெய உரை பழித்தீர்ப்பின் செயற்பாட்டாளரை இவ்வசனத்தில் வெளிப்படையாகச் சொல்லவில்லை. ஆகவே “இறைவனுடைய” என்ற விளக்கத்தையோ தனிப்பட்ட பழிவாங்கல் என்ற முடிவையோ சேர்க்காமல், சங்கீதத்தின் இறையியல் பதற்றம் காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கவிதைக்குரிய கண்ணியமும் மூலத்தின் கடுமையான காட்சியும் காக்கப்பட்டுள்ளன. “பழித்தீர்ப்பு,” “நீதிமான்,” “பொல்லாதவன்” ஆகிய சொற்கள் பொதுவாசகர்களுக்குப் புரியத்தக்கவையாகவும் வேதாகமக் கவிதை நடைக்கு ஏற்றவையாகவும் தேர்ந்தெடுக்கப்பட்டன.
