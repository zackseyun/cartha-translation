  source_fidelity: 'மூல எபிரெய உரையின் முக்கிய கூறுகள் துல்லியமாகக் காக்கப்பட்டுள்ளன: יִשְׂמַח-ன் வருங்காலத் தன்மை “மகிழ்வான்” எனவும், כִּי-ன் கால/காரண இருமுகத் தெளிவின்மை முதன்மை உரை மற்றும் அடிக்குறிப்பில் உரியவாறு காக்கப்பட்டும் உள்ளன. נָקָם “பழித்தீர்ப்பு” என மொழிபெயர்க்கப்பட்டிருப்பது பழிவாங்கும்/தண்டனைத் தீர்ப்பு என்ற பொருளை மென்மையாக்காமல் தக்கவைக்கிறது. இரத்தத்தில் கால்களைக் கழுவும் கவிதை உருவகமும் நேரடியாக மொழிபெயர்க்கப்பட்டுள்ளது.'
