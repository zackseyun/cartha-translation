  yaml_path: translation/ot/psalms/058/001.yaml
  text: Do you indeed speak righteousness in silence? Do you judge uprightly[c][b][a], sons of man?
translation:
  language: ta
  text: உண்மையாகவே நீங்கள் மௌனமாக நீதியைப் பேசுகிறீர்களா?[b] மனிதர்களே,[a] நீங்கள் நேர்மையாகத் தீர்ப்பளிக்கிறீர்களா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல் “மனிதனின் மகன்களே.” இதை “மனிதர்களே” அல்லது “மாந்தர்களே” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: '“மௌனமாக” என மொழிபெயர்க்கப்பட்டுள்ள எபிரெயச் சொல் கடினமானது. மசோரா உரையின் உயிர்க்குறிப்பீடு “மௌனம்” அல்லது “பேச இயலாமை” என்ற பொருளைச் சுட்டுகிறது. பலர் இதை வேறுவிதமாகப் புரிந்து, “வல்லவர்களே” அல்லது “தெய்வங்களே” என்று வாசிக்கின்றனர்: “வல்லவர்களே, நீங்கள் உண்மையாகவே நீதியைப் பேசுகிறீர்களா? மனிதர்களே, நீங்கள் நேர்மையாகத் தீர்ப்பளிக்கிறீர்களா?”'
    reason: alternative_reading
lexical_decisions:
- source_word: הַאֻמְנָם
  choice: உண்மையாகவே ... ஆ?
  rationale: வலியுறுத்தலுடன் கூடிய வினாவையும், சங்கீதக்காரரின் குற்றஞ்சாட்டும் தொனியையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֵלֶם
  choice: மௌனத்தில்
  rationale: மசோரா உயிர்க்குறிப்பீட்டின்படி ‘மௌனம்/பேச இயலாமை’ என்ற கடினமான வாசகத்தை முதன்மை உரையில் பேணுகிறது; வேறு வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: צֶדֶק
  choice: நீதியை
  rationale: பேச்சின் ஒழுக்கநெறி மற்றும் நீதித்துறை சார்ந்த பொருளைத் தமிழில் இயல்பாகத் தருகிறது.
- source_word: תְּדַבֵּרוּן
  choice: பேசுகிறீர்களா
  rationale: דבר என்ற வினையின் நேரடியான பொருளையும் சொல்லாட்சியின் இணை அமைப்பையும் பேணுகிறது.
- source_word: מֵישָׁרִים
  choice: நேர்மையாக
  rationale: ‘நேர்மை/செம்மை’ என்ற உருவகத்தையும் நியாயமான தீர்ப்பின் கருத்தையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: תִּשְׁפְּטוּ
  choice: தீர்ப்பளிக்கிறீர்களா
  rationale: இச்சூழலில் உள்ள நீதித்துறைச் செயலை வெறும் ‘நியாயந்தீர்த்தல்’ என்பதைவிடத் தெளிவான நவீன தமிழில் கூறுகிறது.
- source_word: בְּנֵי אָדָם
  choice: மனுமக்களே
  rationale: சொல்லுக்குச் சொல் ‘மனிதனின் மகன்கள்’ என்ற எபிரெய வெளிப்பாட்டின் மனிதர்/மாந்தர் என்ற அழைப்புப் பொருளைச் சுருக்கமாகவும் கவித்துவமாகவும் பேணுகிறது.
theological_decisions:
- issue: אֵלֶם என்ற கடினமான சொல்லின் விளக்கம்
  choice: மசோரா உயிர்க்குறிப்பீட்டைப் பின்பற்றி ‘மௌனத்தில்’ என்று முதன்மை உரையில் மொழிபெயர்த்தல்
  alternative: ‘வல்லவர்களே’ அல்லது ‘தெய்வங்களே’ என அழைப்புச் சொல்லாகப் புரிந்துகொள்ளுதல்
  rationale: பெறப்பட்ட எபிரெய உரை மௌனம் சார்ந்த பொருளை ஆதரிக்கிறது; ஆயினும் மாற்று வாசிப்பு வசனத்தின் பொருளை குறிப்பிடத்தக்க விதத்தில் மாற்றுவதால் அதை மறைக்காமல் அடிக்குறிப்பில் பேணுவது சரியானது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. இரண்டு வினாக்களின் குற்றஞ்சாட்டும் தொனி, நீதித்துறைச் சொற்கள், மேலும் மூலத்தின் கடினமான ‘மௌனம்’ வாசிப்பு ஆகியவை பேணப்பட்டுள்ளன. எபிரெயச் சொல் வரிசையை நெருக்கமாகப் பின்பற்றி அழைப்புச் சொல் இரண்டாம் வினாவில் வைக்கப்பட்டுள்ளது; தமிழில் அடிக்குறிப்பு குறிகள் தத்தம் தொடர்புடைய சொல்/வாக்கியத்தோடு இணைக்கப்பட்டுள்ளன.
