reference: Psalms 58:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/יֹאמַ֣ר אָ֭דָם אַךְ פְּרִ֣י לַ/צַּדִּ֑יק אַ֥ךְ יֵשׁ אֱ֝לֹהִ֗ים שֹׁפְטִ֥ים בָּ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/058/011.yaml
  text: And people will say[a], “Surely there is fruit for the righteous[b]; surely there is a God who judges on the earth.”
translation:
  language: ta
  text: மக்கள், “நீதிமானுக்குப் பலன் உண்டு என்பது நிச்சயம்; பூமியில் நியாயந்தீர்க்கும் கடவுள் இருக்கிறார் என்பது நிச்சயம்” என்று சொல்வார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/יֹאמַר אָדָם
  choice: அப்போது மக்கள் ... என்று சொல்வார்கள்
  rationale: וְיֹאמַר என்பது முந்தைய நியாயத்தீர்ப்புக் காட்சியின் விளைவைக் குறிக்கும் எதிர்கால/விளைவுநிலையாகப் புரிந்துகொள்ளப்படுகிறது. אָדָם இலக்கணத்தில் ஒருமையாக இருந்தாலும் இங்கு மனிதர்களைப் பொதுவாகக் குறிக்கிறது; நவீன தமிழில் ‘மக்கள்’ என்பது அந்தப் பொதுப்பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אַךְ
  choice: என்பது உறுதி
  rationale: இரு இடங்களிலும் இந்தத் துகள் கட்டுப்படுத்தும் பொருளில் அல்ல, வலியுறுத்தி உறுதிப்படுத்தும் பொருளில் வருகிறது. மேற்கோள் வாக்கியத்தின் தமிழ்நடைக்கு ஏற்றவாறு ‘என்பது உறுதி’ என வழங்கப்பட்டுள்ளது.
- source_word: פְּרִי
  choice: பலன்
  rationale: சொல்லின் நேர்ப்பொருள் ‘கனி’; இச்சூழலில் அது நீதிமானுக்குக் கிடைக்கும் முடிவு அல்லது கைம்மாறைக் குறிக்கும் உருவகமாக இருப்பதால், இயல்பான தமிழில் ‘பலன்’ என மொழிபெயர்க்கப்பட்டுள்ளது; நேர்ப்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: לַ/צַּדִּיק
  choice: நீதிமானுக்கு
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் ஒருமை அடைமொழியையும், அந்த நீதிமானுக்கு நன்மையாகச் சேரும் பலனையும் நேரடியாகக் காட்டுகிறது.
- source_word: יֵשׁ אֱלֹהִים
  choice: கடவுள் இருக்கிறார்
  rationale: יֵשׁ இருப்பை உறுதிப்படுத்துகிறது. இங்கு אֱלֹהִים ஒரே மெய்யான கடவுளைக் குறிப்பதாக வாசிக்கப்படுகிறது; தமிழில் மரியாதை ஒருமையுடன் இயல்பாக வழங்கப்பட்டுள்ளது.
- source_word: שֹׁפְטִים
  choice: நியாயந்தீர்க்கும்
  rationale: எபிரெயச் சொல் வடிவத்தில் பன்மை வினையெச்சமாக இருந்தாலும், אֱלֹהִים இங்கு ஒருமையான கடவுளைக் குறிக்கிறது என்ற முதன்மை வாசிப்புக்கு ஏற்ப தமிழில் ஒருமைப் பொருளாக மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் பன்மை வடிவம் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: בָּ/אָֽרֶץ
  choice: பூமியில்
  rationale: சங்கீதத்தின் பரந்த அறநீதி மற்றும் நியாயத்தீர்ப்புச் சூழலில் குறுகிய ‘நாட்டில்’ என்பதைக் காட்டிலும் உலகளாவிய ‘பூமியில்’ பொருத்தமானது.
theological_decisions:
- issue: אֱלֹהִים שֹׁפְטִים என்பதை ஒருமையாகவா பன்மையாகவா மொழிபெயர்ப்பது
  choice: 'ஒருமை: ‘நியாயந்தீர்க்கும் கடவுள்’'
  alternative: 'பன்மை: ‘நியாயந்தீர்க்கும் தெய்வங்கள்’'
  rationale: வசனம் உலகில் செயல்படும் இறைநீதியை மக்கள் உணர்வதில் உச்சமடைகிறது; உடனடியான கவிதைச் சூழல் ஒரே மெய்யான கடவுளையே சுட்டுகிறது. ஆயினும் אֱלֹהִים என்பதும் அதனுடன் வரும் שֹׁפְטִים என்பதும் வடிவத்தில் பன்மையாக இருப்பதால், அந்த உண்மையான இலக்கணத் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத்தமிழில், பொதுவாசகர்களுக்குப் புரியும் அதேவேளையில் சங்கீதத்திற்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. மேற்கோளின் இரு இணை வாக்கியங்களிலும் אַךְ தரும் வலியுறுத்தலை ‘என்பது உறுதி’ என்ற மீளுருவாக்கம் காக்கிறது.
