  text: God[a], break their teeth in their mouths; shatter the fangs of the young lions[b], O Yahweh.
translation:
  language: ta
  text: 'தேவனே, அவர்கள் வாயிலுள்ள பற்களை உடைத்துப்போடுங்கள்;

    யாவே, இளம் சிங்கங்களின் கடைவாய்ப் பற்களை[a] தகர்த்துப்போடுங்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கடைவாய்ப் பற்கள்” என்பதற்கு “தாடைப் பற்கள்” என்றும் பொருள் கொள்ளலாம்; எபிரெயச் சொல் நசுக்கப் பயன்படும் பற்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: தேவனே
  rationale: இது நேரடி அழைப்பு; தமிழில் அழைப்புவேற்றுமை உருபைச் சேர்ப்பது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: הֲרָס
  choice: உடைத்துப்போடும்
  rationale: הרס என்பதன் ‘இடித்தல்/அழித்தல்’ என்ற வலிமையை, ‘பற்கள்’ என்னும் செயப்படுபொருளுடன் இயல்பான தமிழில் எடுத்துரைக்கிறது.
- source_word: שִׁנֵּימוֹ
  choice: அவர்கள் வாயிலுள்ள பற்கள்
  rationale: மூன்றாம் நபர் ஆண்பால் பன்மை பின்னொட்டைத் தெளிவாகக் காட்டி, அடுத்துள்ள בְּפִימוֹ என்பதையும் இயல்பான ஒரே தொடரில் இணைக்கிறது.
- source_word: מַלְתְּעוֹת
  choice: கடைவாய்ப் பற்கள்
  rationale: இச்சொல் நசுக்கப் பயன்படும் தாடை அல்லது கடைவாய்ப் பற்களைக் குறிக்கிறது; இளம் சிங்கங்களின் ஆபத்தான கடிக்கும் வலிமையைத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: כְּפִירִים
  choice: இளம் சிங்கங்கள்
  rationale: சிறிய குட்டிகளை அல்லாமல் வலிமைமிக்க இளம் சிங்கங்களைக் குறிக்கும் எபிரெயச் சொல்லின் வழக்கமான பொருளைப் பாதுகாக்கிறது.
- source_word: נְתֹץ
  choice: தகர்த்துப்போடும்
  rationale: נתץ என்பதிலுள்ள இடித்துத் தகர்க்கும் வன்மையைப் பாதுகாக்கிறது; பற்கள் பிடுங்கப்படுகின்றனவா அல்லது நொறுக்கப்படுகின்றனவா என்பதைத் தேவையின்றி தீர்மானிப்பதில்லை.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான יהוה-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் அறியத்தக்க ஒலிபெயர்ப்பாக வழங்குகிறது.
theological_decisions:
- issue: יהוה என்னும் தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரையில் நேரடியாக வரும் உடன்படிக்கைப் பெயரைப் பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: பகைவர்களுக்கு எதிரான வன்மையான வேண்டுதல்
  choice: பற்களையும் கடைவாய்ப் பற்களையும் உடைத்துத் தகர்க்கும்படி கேட்கும் உருவகத்தை அப்படியே வைத்தல்
  alternative: ‘அவர்களின் வலிமையை அகற்றும்’ என்று மென்மையாக்குதல்
  rationale: எபிரெயக் கவிதையின் திட்டவட்டமான உடல் சார்ந்த உருவகத்தையும் அதன் இறையியல் பதற்றத்தையும் சுருக்கமான கருத்துரையாக மாற்றாமல் பாதுகாக்கிறது.
