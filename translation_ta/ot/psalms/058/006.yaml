  register: நவீன செந்தமிழுக்கு ஏற்ற, எளிதில் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. இரண்டு நேரடி அழைப்புகளும் இணையான கட்டளைகளும் எபிரெயக் கவிதையின் அமைப்பின்படி பாதுகாக்கப்பட்டுள்ளன.
