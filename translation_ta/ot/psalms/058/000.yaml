translation:
  language: ta
  text: 'இசை இயக்குநருக்கு: “அழிக்காதே.”[a] தாவீதுக்குரியது. ஒரு மிக்தாம்.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இது மெட்டு அல்லது இசை அமைப்பை இன்னும் வெளிப்படையாகக் குறிப்பதாக இருந்தால், “அழிக்காதே என்னும் மெட்டில்” எனலாம்.
    reason: alternative_reading
  - marker: b
    text: “மிக்தாம்” என்ற எபிரெயச் சொல்லின் பொருள் உறுதியாகத் தெரியவில்லை; அது ஒரு படைப்பு வகையையோ இசை அமைப்பையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: இசைக்குழுத் தலைவருக்கு
  rationale: சங்கீதத் தலைப்புகளில் வரும் இச்சொல் இசை நிகழ்த்துதலை வழிநடத்துபவரைக் குறிக்கிறது. ‘இசைக்குழுத் தலைவர்’ என்பது அதன் வழிபாட்டு இசைச் செயல்பாட்டைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: אַל תַּשְׁחֵת
  choice: “அழிக்காதே”
  rationale: இது சங்கீதத்தின் நேரடி கட்டளையாக அல்லாமல், ஓர் இசைமெட்டு அல்லது இசை அமைப்பின் பெயராக இருந்திருக்கலாம். எபிரெயத்தில் ‘இதன் மெட்டில்’ என்பதற்கான வெளிப்படையான முன்னிடைச்சொல் இல்லாததால், மேற்கோள் குறிகளுக்குள் தலைப்பாகவே தரப்பட்டுள்ளது.
- source_word: לְדָוִד
  choice: தாவீதுக்குரியது
  rationale: לְ என்ற முன்னொட்டு ஆசிரியத்துவம், அர்ப்பணம், அல்லது தொடர்பு ஆகியவற்றைக் குறிக்கக்கூடும். ‘தாவீதுக்குரியது’ என்பது ‘தாவீதால் எழுதப்பட்டது’ என்று மிகையாகத் தீர்மானிக்காமல் அந்தத் தெளிவின்மையைப் பேணுகிறது.
- source_word: מִכְתָּם
  choice: ஒரு மிக்தாம்
  rationale: இச்சங்கீத வகைப்பெயரின் துல்லியமான பொருள் தெரியவில்லை. ஊகமான பொருளாக்கத்தைவிட ஒலிபெயர்ப்பு மூலச்சொல்லின் தெளிவின்மையை நேர்மையாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: சங்கீதத் தலைப்பிலுள்ள இசை மற்றும் இலக்கியச் சொற்களின் இயல்பு
  choice: இவ்வரியைச் சங்கீதத்தின் தலைப்புத் தகவலாகக் கொண்டு, உறுதியற்ற இசை/இலக்கியப் பெயர்களை வெளிப்படையாகவும் எச்சரிக்கையுடனும் மொழிபெயர்த்தல்
  alternative: אַל תַּשְׁחֵת என்பதை நேரடிக் கட்டளையாகவும், לְדָוִד என்பதை ‘தாவீதால் எழுதப்பட்டது’ என்ற வெளிப்படையான ஆசிரியத்துவக் கூற்றாகவும் மொழிபெயர்த்தல்
  rationale: மூல எபிரெயம் இசைமெட்டை வெளிப்படையாகக் குறிப்பிடவில்லை; தாவீதுடனான உறவின் தன்மையையும் முடிவாக நிர்ணயிக்கவில்லை. ஆகவே மொழிபெயர்ப்பு இந்த உண்மையான தெளிவின்மைகளைத் தீர்த்துவிடாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், வழிபாட்டுக்குரிய கண்ணியமான ஆனால் பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. மேற்கோள் குறிகள் ‘அழிக்காதே’ என்பதை சாத்தியமான இசைத் தலைப்பாக உணர்த்துகின்றன; ‘மிக்தாம்’ விளக்கமின்றி ஊகித்து மொழிபெயர்க்கப்படாமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
