  to: உங்கள் பானைகள் முட்செடியின் வெப்பத்தை உணருமுன்னே—அது இன்னும் பசுமையாக இருந்தாலும் எரிந்துகொண்டிருந்தாலும்—அவர் அவற்றை வாரிக்கொண்டு போவார்.[a]
  rationale: முட்செடி எரிபொருளால் பானைகள் சூடேறுவதற்கு முன்பே நிகழும் திடீர் அகற்றல் என்ற முதன்மை வாசிப்பு தக்கவைக்கப்பட்டுள்ளது. தேவையற்ற வெளிப்படையான சுழற்காற்று-உவமை நீக்கப்பட்டுள்ளது. எபிரெயத்தின் இலக்கண மற்றும் பொருள் தெளிவின்மைகள்—குறிப்பாக ‘பசுமை/உயிர்,’ ‘எரிதல்/கடும் கோபம்,’ மற்றும் இறுதிச் சுட்டுப்பெயர்—அடிக்குறிப்பில் தெளிவாகப் பாதுகாக்கப்பட்டுள்ளன.
