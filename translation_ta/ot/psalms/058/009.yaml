  yaml_path: translation/ot/psalms/058/009.yaml
  text: Before your pots can feel the thornbush[a], whether green or burning, he will sweep them away.
translation:
  language: ta
  text: உங்கள் பானைகள் முட்செடியின் வெப்பத்தை உணருமுன்னே—அது இன்னும் பசுமையாக இருந்தாலும் எரிந்துகொண்டிருந்தாலும்—அவர் அவற்றை வாரிக்கொண்டு போவார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய வாசகம் மிகவும் கடினமானது. சொற்சார்ந்த வகையில், “உங்கள் பானைகள் முட்செடியை உணருமுன், பசுமையானதாக, எரிதலாக/கடும் கோபமாக, அவர் அதை/அவனைச் சுழற்றி அகற்றுவார்” என அமைகிறது. முட்செடி நெருப்பு பானைகளைச் சூடாக்குமுன் நிகழும் திடீர் அகற்றலே இங்கு உவமிக்கப்படுவதாக இருக்கலாம். இறுதிப் பகுதியை, “அவர் கடுங்கோபத்தில் அவற்றை வாரிக்கொண்டு போவார்” என்றும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּטֶרֶם
  choice: உணருமுன்
  rationale: மற்றொரு நிகழ்வு நடைபெறுவதற்கு முன்னரே செயல் நிகழ்வதைத் தெரிவிக்கும் காலக் குறிப்பு; தமிழில் சுருக்கமாகவும் இயல்பாகவும் அமைக்கப்பட்டது.
- source_word: יָבִינוּ
  choice: வெப்பத்தை உணரு
  rationale: வினைச்சொல்லின் அடிப்படைப் பொருள் ‘புரிந்துகொள்/உணர்’; பானைகள் எழுவாயாக வரும் இக்கடினமான உருவகத்தில் நெருப்பின் வெப்பத்தை உணர்வது எனச் சூழலுக்கேற்ற வகையில் தரப்பட்டது.
- source_word: סִּירֹתֵיכֶם
  choice: உங்கள் பானைகள்
  rationale: சமைப்பதற்கான பாத்திரங்களைக் குறிக்கிறது; ‘பானைகள்’ தெளிவான, பொதுவான நவீனத் தமிழ்.
- source_word: אָטָד
  choice: முட்செடி
  rationale: விரைவாக எரியும் எரிபொருளாகப் பயன்படும் முட்கள் நிறைந்த செடியின் நேரடியான படிமத்தைப் பாதுகாக்கிறது.
- source_word: כְּמוֹ חַי
  choice: அது பச்சையாக இருந்தாலும்
  rationale: எரிபொருளாகிய செடி இன்னும் உயிர்ப்பசையுடன் அல்லது காயாமல் இருப்பதைக் குறிக்கலாம்; ‘பச்சையாக’ என்பது தமிழில் இயல்பாக அந்த நிலையைத் தெரிவிக்கிறது.
- source_word: כְּמוֹ חָרוֹן
  choice: எரிந்துகொண்டிருந்தாலும்
  rationale: חָרוֹן பொதுவாக ‘கடும் கோபம்’ என்றும் பொருள்படலாம்; ஆயினும் இங்குள்ள நெருப்பு உருவகத்தில் எரியும் நிலை சாத்தியம். பிரதான உரையில் வெப்பப் படிமம் வைக்கப்பட்டு மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- source_word: יִשְׂעָרֶנּוּ
  choice: அவர் அவற்றைச் சுழற்காற்றைப்போல் வாரிக்கொண்டுபோவார்
  rationale: புயலாகச் சுழற்றி அகற்றும் வன்மையான, திடீர் செயலை வினை வெளிப்படுத்துகிறது. எபிரெய ஒருமைச் சுட்டுப்பெயரின் தொடர்பு தெளிவற்றதால், சூழலில் பன்மையான பானைகளோடு பொருந்தும் வாசிப்பு பிரதான உரையில் தரப்பட்டு சிக்கல் அடிக்குறிப்பில் குறிப்பிடப்பட்டது.
theological_decisions:
- issue: கடினமான நெருப்பு உருவகமும் திடீர் நியாயத்தீர்ப்பும்
  choice: முட்செடியின் நெருப்பு பானைகளைச் சூடாக்குவதற்கு முன்னரே அவை திடீரென வாரிக்கொண்டுபோகப்படும் உருவகமாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘பச்சையானதையும் எரிந்துகொண்டிருப்பதையும் அவர் கடுங்கோபத்தில் சுழற்றி அகற்றுவார்’ அல்லது ‘அதை/அவனைச் சுழற்றி அகற்றுவார்’ எனவும் வாசிக்கலாம்.
  rationale: எபிரெய தொடரமைப்பும் சுட்டுப்பெயர்களும் மிகவும் கடினமானவை. பிரதான வாசிப்பு திடீர் அகற்றலின் மையப் பொருளையும் உறுதியான உருவகத்தையும் காக்கிறது; ‘கடும் கோபம்’ என்ற இறையியல் நுணுக்கத்தை உறுதியாகத் திணிக்காமல் மாற்று வாசிப்பாக அடிக்குறிப்பில் வைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைக்குரிய கண்ணியத்துடனும் சாதாரண வாசகருக்குப் புரியும் வகையிலும் அமைக்கப்பட்டது. மூலத்தின் கடினமான தொடரமைப்பு மற்றும் ‘எரிதல்/கடும் கோபம்’ என்ற இருபொருள் அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளன.
