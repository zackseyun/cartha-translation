  rationale: நீர் மறைந்து போகும் உருவகத்துடன் இணைந்து, வீணாகி மறைதல் அல்லது கரைதல் என்ற கவிதை வலிமையையும் விருப்பவினைத் தொனியையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כְמוֹ מַיִם
  choice: தண்ணீரைப்போல்
  rationale: எபிரெய உருவகத்தை நேராகவும் நவீனத் தமிழில் இயல்பாகவும் காக்கிறது.
- source_word: יִתְהַלְּכוּ לָמוֹ
  choice: ஓடிப்போகும்
  rationale: நீர் நகர்ந்து விலகி மறையும் படிமத்தைச் சுருக்கமாகத் தருகிறது; ‘அவர்களுக்கு’ எனப் பொருள்படக்கூடிய לָמוֹ இவ்விடத்தில் சிக்கலானது என்பதால் தமிழில் வற்புறுத்தப்படவில்லை.
- source_word: יִדְרֹךְ
  choice: எய்ய வில்லை வளைக்கும்போது
  rationale: அம்புடன் வரும் דרך என்பது வில்லை மிதித்தல்/வளைத்துத் தயாரித்தல் என்ற வில்வித்தைச் சொற்றொடர்; இலக்கையும் தாக்குதலுக்கான ஆயத்தத்தையும் இயல்பான தமிழில் காட்டுகிறது.
- source_word: חצו
  choice: தன் அம்பை
  rationale: மசோரெட்டிக் வாசிப்பின் ஒருமையான ‘அவனுடைய அம்பு’ என்பதைக் காக்கிறது; சூழலில் இது தொகுப்பொருளாகவும் கொள்ளப்படலாம்.
- source_word: כְּמוֹ יִתְמֹלָלוּ
  choice: அது முனை மழுங்கிப்போகட்டும்
  rationale: இறுதிச் சொல் அரிதும் விவாதத்திற்குரியதும் ஆகும். அம்பு பயனற்றதாதல் என்ற சூழல்சார் பொருளைத் தருகிறது; உறுதியின்மை அடிக்குறிப்பில் காக்கப்படுகிறது.
