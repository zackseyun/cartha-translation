translation:
  language: ta
  text: வழிந்தோடும் நீரைப்போல் அவர்கள் கரைந்துபோகட்டும்[a]; அவன் தன் அம்புகளை எய்ய வில்லை வளைக்கும்போது[b], அவை மழுங்கிப்போனவைபோல் ஆகட்டும்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஓடிப்போகும் நீரைப்போல்.’ எபிரெயச் சொற்றொடர் நீர் வழிந்தோடி விலகி மறைவதைப் படமாக்குகிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயில் ‘அவனுடைய அம்புகள்’ என்று பன்மையில் உள்ளது; கவிதைச் சூழலில் இதைத் தொகுப்பொருளாகவும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
  - marker: c
    text: இறுதிப் பகுதியின் எபிரெய வாசகமும் சொற்பொருளும் கடினமானவை. ‘அவை அறுபட்டதுபோல் ஆகட்டும்,’ ‘அவை மழுங்கிப்போகட்டும்,’ அல்லது ‘அவை வாடிப்போகட்டும்’ என்பன வேறு சாத்தியமான மொழிபெயர்ப்புகள்.
