theological_decisions:
- issue: நீதித்துறைச் சூழலில் இறுதி வினைச்சொல்லின் உருவக வலிமை
  choice: ‘வன்முறையை எடைபோட்டு வழங்குகிறீர்கள்’ என்று மொழிபெயர்த்து, அளந்து பகிர்தல் அல்லது தீர்ப்பு வழங்குதல் என்ற உருவகத்தைத் தக்கவைத்தல்
  alternative: ‘வன்முறையை அளந்து வழங்குகிறீர்கள்’ அல்லது ‘வன்முறையைப் பகிர்ந்தளிக்கிறீர்கள்’
  rationale: நீதியை அளிக்க வேண்டியவர்கள் வன்முறையை அளித்து வழங்குகிறார்கள் என்ற முரண்நயத்தை ‘எடைபோட்டு’ என்பது பாதுகாக்கிறது; இது கோட்பாட்டை நிர்ணயிக்கும் முடிவு அல்ல, இலக்கிய மற்றும் சொற்பொருள் சார்ந்த முடிவு.
