source:
  edition: WLC
  text: יֵבֹ֣שׁוּ וְ/יַחְפְּרוּ֮ מְבַקְשֵׁ֪י נַ֫פְשִׁ֥/י יִסֹּ֣גוּ אָ֭חוֹר וְ/יִכָּלְמ֑וּ חֲ֝פֵצֵ֗י רָעָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/070/002.yaml
  text: Let those who seek my life be put to shame and confounded[a]; let those who delight in my harm turn back and be disgraced.
translation:
  language: ta
  text: என் உயிரைப் பறிக்க நாடுகிறவர்கள்[a] வெட்கமடைந்து அவமானத்துக்குள்ளாகட்டும்; எனக்குத் தீங்கு நேரிடுவதில் மகிழ்கிறவர்கள் பின்வாங்கி இழிவடையட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொற்சார்ந்த மொழிபெயர்ப்பு: “என் உயிரைத் தேடுகிறவர்கள்” அல்லது “என் ஆத்துமாவைத் தேடுகிறவர்கள்.” இங்கு “உயிர்/ஆத்துமா” (נפש) என்பது உயிருக்கு ஆபத்தான சூழலில் ஒருவரின் உயிரையோ அவரையே குறிக்கும் எபிரெய மரபுத்தொடர்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: வெட்கமடையட்டும்
  rationale: בוש என்பது வெட்கத்திற்கும் மானக்கேட்டிற்கும் உள்ளாவதைக் குறிக்கிறது. சங்கீதத்தின் வேண்டுதல் சூழலுக்கு ஏற்ப விருப்பநிலை வினையாக மொழிபெயர்க்கப்பட்டது.
- source_word: וְיַחְפְּרוּ
  choice: அவமானத்துக்குள்ளாகட்டும்
  rationale: חפר இங்கு அவமானம் அல்லது இழிவுக்கு உள்ளாவதைக் குறிக்கிறது. முந்தைய வெட்கச் சொல்லுடன் இணைந்துள்ள தீவிரப்படுத்தும் இணைச்சொல் அமைப்பு பாதுகாக்கப்பட்டது.
- source_word: מְבַקְשֵׁי נַפְשִׁי
  choice: என் உயிரைப் பறிக்க நாடுகிறவர்கள்
  rationale: உயிருக்கு ஆபத்தான பகைமைச் சூழலில் נפש என்பது ஒருவரின் உயிரையோ அவரையே குறிக்கும். தமிழில் நோக்கம் தெளிவாக இருக்க ‘உயிரைப் பறிக்க நாடுகிறவர்கள்’ என இயல்பாக வழங்கப்பட்டது; சொற்சார்ந்த மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: יִסֹּגוּ אָחוֹר
  choice: பின்வாங்கட்டும்
  rationale: סוג + אחר பின்னோக்கிச் செல்லுதல் அல்லது பின்வாங்குதலைக் குறிக்கிறது. ‘பின்வாங்கட்டும்’ என்பது சுருக்கமான, இயல்பான தமிழ் இணை.
- source_word: וְיִכָּלְמוּ
  choice: இழிவடையட்டும்
  rationale: כלם வெட்கம், மானக்கேடு, இழிவு ஆகிய பொருள் வட்டத்தைக் கொண்டது. வசனத்திலுள்ள வெவ்வேறு வெட்கச் சொற்களை முற்றிலும் ஒன்றாக்காமல் இருக்க ‘இழிவடையட்டும்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: חֲפֵצֵי רָעָתִי
  choice: எனக்குத் தீங்கு நேரிடுவதில் மகிழ்கிறவர்கள்
  rationale: חפץ விருப்பத்தையும் மகிழ்ச்சியையும் குறிக்கலாம்; רעה இங்கு அறநெறித் தீமையை அல்ல, சங்கீதக்காரருக்கு நேரும் கேடு அல்லது தீங்கைக் குறிக்கிறது.
theological_decisions:
- issue: வினைத் தொடரின் வேண்டுதல்/சாப வேண்டுதல் வலிமை
  choice: ‘-ட்டும்’ என்னும் விருப்பநிலை வடிவங்களில் வேண்டுதலாக வழங்குதல்
  alternative: எதிர்கால அறிவிப்பாக ‘வெட்கமடைவார்கள்… பின்வாங்குவார்கள்’ என்று வழங்குதல்
  rationale: சங்கீத ஜெபச் சூழலில் இவ்வினைகள் சாதாரண எதிர்கால முன்னறிவிப்பை விட வேண்டுதலையோ விருப்பத்தையோ வெளிப்படுத்துகின்றன. தமிழ் ‘-ட்டும்’ வடிவம் அந்த வலிமையை நேரடியாகப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், ஜெபத்திற்குரிய கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. மூலத்திலுள்ள மூன்று நெருங்கிய வெட்கம்/அவமானம் சார்ந்த சொற்களின் வேறுபாட்டை ‘வெட்கம்’, ‘அவமானம்’, ‘இழிவு’ என இயன்றவரை பாதுகாக்கிறது.
