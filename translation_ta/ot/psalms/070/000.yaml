lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: இசைத்தலைவருக்கு
  rationale: சங்கீதத் தலைப்புகளில் இச்சொல் இசை அல்லது வழிபாட்டு நிகழ்வை வழிநடத்துபவரைக் குறிக்கிறது. முன்னொட்டு לְ- இங்குள்ள ஒப்படைப்பு அல்லது நோக்குத் தொடர்பைத் தமிழின் ‘-க்கு’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לְדָוִד
  choice: தாவீதுடையது
  rationale: இங்குள்ள לְ- ஆசிரியத்துவம், தொடர்பு, அர்ப்பணிப்பு அல்லது தொகுப்பைச் சுட்டலாம். ‘தாவீது எழுதியது’ என்று பொருளைச் சுருக்காமல், ‘தாவீதுடையது’ மூலத்தின் தொடர்புசார் தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: לְהַזְכִּיר
  choice: நினைவுகூருவதற்காக
  rationale: זכר என்பதன் ஹிபீல் வினையெச்சம் ‘நினைவுபடுத்துதல்’ அல்லது ‘நினைவுகூரச் செய்தல்’ என்னும் நோக்கைக் கொண்டது. யார் நினைவுகூர வேண்டும் என்பதைத் தீர்மானிக்காமல், தலைப்புக்கேற்ற சுருக்கமான நோக்குச் சொல்லாக இது அமைந்துள்ளது.
theological_decisions:
- issue: לְהַזְכִּיר என்ற தலைப்புச் சொல்லின் செயல்பாடு
  choice: யார் நினைவுகூருகிறார் என்பதைச் சொல்லாத நோக்குக் குறிப்பாக ‘நினைவுகூருவதற்காக’
  alternative: நினைவுப்பலியைக் குறிக்கும் சூத்திரம்; கடவுளுக்கு நினைவூட்டுவதற்காக; வழிபடுபவர் நினைவுகூருவதற்காக
  rationale: எபிரெய உரை நினைவுகூருபவர் அல்லது நினைவுகூரப்படுபவர் யார் என்பதைத் தெளிவுபடுத்தவில்லை. குறிப்பிட்ட பலிசார் அல்லது இறையியல் விளக்கத்தைத் திணிக்காமல், வழிபாட்டு அல்லது இசைத் தலைப்பாக இருக்கக்கூடிய அதன் திறந்த பொருளை மொழிபெயர்ப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் சுருக்கமான சங்கீதத் தலைப்பு நடை பயன்படுத்தப்பட்டுள்ளது. ‘தாவீதுடையது’ சற்று செறிவான தலைப்பு மொழியாக இருந்தாலும், ‘தாவீது எழுதியது’ அல்லது ‘தாவீதுக்காக’ என்று எபிரெயத் தொடர்பை ஒரே பொருளாகத் தீர்மானிப்பதைத் தவிர்க்கிறது. அடிக்குறி குறியீடு அதற்குரிய ‘நினைவுகூருவதற்காக’ என்பதற்குப் பின்னரே வைக்கப்பட்டுள்ளது.
