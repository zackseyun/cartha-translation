source:
  edition: WLC
  text: וַ/אֲנִ֤י עָנִ֣י וְ/אֶבְיוֹן֮ אֱלֹהִ֪ים חֽוּשָׁ֫/ה לִּ֥/י עֶזְרִ֣/י וּ/מְפַלְטִ֣/י אַ֑תָּה יְ֝הוָ֗ה אַל תְּאַחַֽר׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/070/005.yaml
  text: But as for me[a], I am poor and needy; O God, hurry to me. You are my help and my deliverer; O Yahweh[b], do not delay.
translation:
  language: ta
  text: ஆனால் நானோ ஏழையும் தேவையுள்ளவனுமாய் இருக்கிறேன்; கடவுளே, என்னிடம்[a] விரைந்து வாரும். நீரே எனக்குத் துணையும் என்னை விடுவிப்பவரும்; யாவே[b], தாமதிக்காதிரும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எனக்காக விரையுங்கள்.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் YHWH என்ற தெய்வீகப் பெயர்; மரபாக “கர்த்தர்” என்றும் வழங்கப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: וַאֲנִי
  choice: ஆனால் நானோ
  rationale: இணைப்புச்சொல்லும் தனிப்பெயரும் முந்தைய கருத்திலிருந்து சங்கீதக்காரரின் சொந்த நிலைக்கு வரும் முரண்பாட்டுத் திருப்பத்தைச் சுட்டுகின்றன.
- source_word: עָנִי וְאֶבְיוֹן
  choice: ஏழையும் தேவையுள்ளவனுமாய்
  rationale: 'இரு எபிரெயச் சொற்களின் தொடர்பையும் வேறுபாட்டையும் காக்கிறது: முதலாவது தாழ்ந்த, துன்புற்ற வறிய நிலையையும் இரண்டாவது உதவி தேவைப்படும் நிலையையும் குறிக்கிறது.'
- source_word: אֱלֹהִים חוּשָׁה לִי
  choice: கடவுளே, என்னிடம் விரைந்து வாரும்
  rationale: אֱלֹהִים இங்கு விளிப்பாக உள்ளது; חוּשָׁה அவசரமான வேண்டுகோள். לִי என்பதன் இயல்பான திசைப்பொருளை ‘என்னிடம்’ வெளிப்படுத்துகிறது; செயல் நெருங்கிவருதலைத் தமிழ் இயல்புக்கேற்ப ‘வாரும்’ தெளிவாக்குகிறது.
- source_word: עֶזְרִי
  choice: எனக்குத் துணை
  rationale: עֵזֶר என்பது உதவி அல்லது துணை என்பதைக் குறிக்கிறது; இங்கு கடவுளே அந்தத் துணை என்று பெயர்ப்பயனிலையில் கூறப்படுகிறது.
- source_word: וּמְפַלְטִי
  choice: என்னை விடுவிப்பவர்
  rationale: פלט வேரிலிருந்து வந்த இவ்வடிவம் தப்புவித்து பாதுகாப்பவர் என்பதைக் குறிக்கிறது; ‘விடுவிப்பவர்’ அதைத் தெளிவாகவும் சுருக்கமாகவும் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கு எழுத்துப் பெயரை ஒரு பொதுப் பட்டமாக மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பால் தருகிறது.
- source_word: אַל תְּאַחַר
  choice: தாமதிக்காதிரும்
  rationale: எதிர்மறை வேண்டுகோளின் அவசரத்தையும் மரியாதையான நேரடி அழைப்பையும் இயல்பான நவீன தமிழில் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட தெய்வீகப் பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டத்தால் மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் தன்மையைப் பாதுகாக்கிறது; ‘யாவே’ என்பது நவீன ஆய்வில் பரவலாக ஏற்கப்படும் ஒலிப்பிற்கு ஏற்ற தமிழ் வடிவம்.
- issue: חוּשָׁה לִי என்பதன் திசை அல்லது நன்மைப் பொருள்
  choice: என்னிடம் விரைந்து வாரும்
  alternative: எனக்காக விரைந்து செயல்படும்
  rationale: לִי என்பது ‘என்னிடம்’ என்றும் ‘எனக்காக’ என்றும் புரிந்துகொள்ளப்படலாம். முதன்மை உரை திசைப்பொருளை ஏற்கிறது; அடிக்குறிப்பு உண்மையான மாற்றுப் பொருளைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், ஜெபத்திற்குரிய கண்ணியமும் அவசரமும் காக்கப்பட்டுள்ளன. கடவுளை நேரடியாக அழைக்கும் இடங்களில் மரியாதைப் பன்மை வினைமுற்றுகள் பயன்படுத்தப்பட்டுள்ளன; தேவையற்ற பழமையான சொற்கள் தவிர்க்கப்பட்டுள்ளன.
