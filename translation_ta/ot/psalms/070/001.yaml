lexical_decisions:
- source_word: אֱלֹהִים
  choice: கடவுளே
  rationale: நேரடி அழைப்பைக் காட்டும் எபிரெயச் சொல்லை, இயல்பான தமிழ் விளிவேற்றுமையுடன் மொழிபெயர்க்கிறது.
- source_word: לְהַצִּילֵנִי
  choice: என்னை விடுவிக்க
  rationale: נצל என்பதன் ஹிஃபில் வடிவம் ஆபத்திலிருந்து விடுவித்தல் அல்லது காப்பாற்றுதல் என்ற பொருள் தருகிறது; ‘விடுவிக்க’ என்பது இதை இரட்சிப்பின் குறிப்பிட்ட கோட்பாட்டுப் பொருளாகக் குறுக்காமல் தெரிவிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தலைப்புப் பெயரால் மாற்றாமல், எபிரெய மூலத்திலுள்ள இறைத் திருப்பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: לְעֶזְרָתִי
  choice: எனக்கு உதவ
  rationale: עֶזְרָה என்ற பெயர்ச்சொல்லுடன் வரும் לְ உதவி செய்வதற்காக வருதல் என்ற நோக்கத்தைக் குறிக்கிறது; இத்தொடர் நவீன தமிழில் இயல்பாக உள்ளது.
- source_word: חוּשָׁה
  choice: விரைந்து வாரும்
  rationale: அவசரமாகச் செயல்படுமாறு வேண்டுகிற கட்டளை வடிவத்தின் பொருளை, மன்றாட்டுக்கேற்ற மரியாதையான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் பொதுவான பட்டப்பெயர் அல்ல, நான்கு எழுத்துகளைக் கொண்ட இறைத் திருப்பெயரே வருகிறது. எனவே அதை ஒரு பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்த்துள்ளோம்.
- issue: இறுதி חוּשָׁה இரு வேண்டுதல்களுடனும் கொண்டுள்ள தொடர்பு
  choice: ‘விரைந்து வாரும்’ என்பதை இரு அடிகளிலும் வெளிப்படையாக வழங்குதல்
  alternative: முதல் அடியை வினையின்றி விட்டுவிட்டு, இரண்டாம் அடியில் மட்டும் ‘விரைந்து வாரும்’ என வழங்குதல்
  rationale: எபிரெயத்தில் ‘விரைந்து வா’ என்பது இறுதியில் ஒருமுறை மட்டுமே இருந்தாலும், முன்வரும் இரு இணையான வேண்டுதல்களையும் இயல்பாக ஆளக்கூடும். தமிழில் பொருளும் கவிதை இணைத்தன்மையும் தெளிவாக இருக்க வினை இருமுறை வழங்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சங்கீத மன்றாட்டுக்கேற்ற கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘வாரும்’ என்ற மரியாதைமிக்க வேண்டுகோள் வடிவம் அவசரத்தையும் பக்திநடையையும் ஒருங்கே காக்கிறது.
