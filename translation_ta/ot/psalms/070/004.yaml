source:
  edition: WLC
  text: יָ֘שִׂ֤ישׂוּ וְ/יִשְׂמְח֨וּ בְּ/ךָ֗ כָּֽל מְבַ֫קְשֶׁ֥י/ךָ וְ/יֹאמְר֣וּ תָ֭מִיד יִגְדַּ֣ל אֱלֹהִ֑ים אֹ֝הֲבֵ֗י יְשׁוּעָתֶֽ/ךָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/070/004.yaml
  text: Let all who seek you rejoice and be glad in you[a]; let those who love your salvation say continually[b], “May God be magnified!”
translation:
  language: ta
  text: உம்மைத் தேடுகிற அனைவரும் உம்மில் களிகூர்ந்து மகிழட்டும்; உமது மீட்பை நேசிப்பவர்கள்[a], “கடவுள் உயர்த்தப்படுவாராக!”[b] என்று எப்போதும் சொல்லட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உமது இரட்சிப்பை’ அல்லது ‘உமது விடுதலையை’ என்றும் மொழிபெயர்க்கலாம். எபிரேயச் சொல் துன்பத்திலிருந்து காப்பாற்றப்படுவதையோ விரிவான பொருளில் இரட்சிப்பையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘கடவுள் மேன்மையானவராக விளங்குவாராக!’ அல்லது ‘கடவுள் மகத்துவப்படுவாராக!’ என்றும் மொழிபெயர்க்கலாம். எபிரேய வாசகம் கடவுளின் மகத்துவத்தைப் பற்றிய விருப்பத்தையோ வாழ்த்தொலியையோ வெளிப்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשִׂישׂוּ וְיִשְׂמְחוּ
  choice: களிகூர்ந்து மகிழட்டும்
  rationale: இரு எபிரேய வினைகளும் மகிழ்ச்சியைச் சுட்டினாலும், முதலாவது மிகுந்த களிப்பையும் இரண்டாவது மகிழ்வையும் குறிக்கிறது. இரண்டையும் தனித்துவமாகவும் இயல்பான தமிழிலும் வைத்திருக்கிறது.
- source_word: בְּךָ
  choice: உம்மில்
  rationale: இங்கு בְּ என்பது மகிழ்ச்சியின் மையத்தையோ தளத்தையோ குறிக்கிறது. ‘உம்மில்’ என்பது தேவனை நோக்கிய கவனத்தைப் பாதுகாக்கிறது; ‘உம்மால்’ என்று காரணப் பொருளாக மட்டும் சுருக்கவில்லை.
- source_word: כָּל מְבַקְשֶׁיךָ
  choice: உம்மைத் தேடுகிற அனைவரும்
  rationale: כָּל உடன் வரும் பங்கேற்புவினை, தேவனைத் தேடுவோர் என்ற மக்கள்வகையைக் குறிக்கிறது. இத்தமிழாக்கம் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: אֹהֲבֵי יְשׁוּעָתֶךָ
  choice: உமது மீட்பை நேசிப்பவர்கள்
  rationale: יְשׁוּעָה துன்பத்திலிருந்து விடுவித்தல் அல்லது விரிவான இரட்சிப்பு ஆகிய இரண்டையும் குறிக்கலாம். ‘மீட்பு’ உடனடி விடுதலையையும் பரந்த இறையியல் கருத்தையும் அளவுக்கு மீறி வரையறுக்காமல் தாங்குகிறது.
- source_word: וְיֹאמְרוּ תָמִיד
  choice: என்று எப்போதும் சொல்லட்டும்
  rationale: இறந்தகாலமல்லாத வினைவடிவமும் תָמִיד என்பதும் தொடர்ச்சியான அல்லது மீண்டும் மீண்டும் நிகழும் அறிவிப்பைக் குறிக்கின்றன.
- source_word: יִגְדַּל אֱלֹהִים
  choice: கடவுள் உயர்த்திப் போற்றப்படுவாராக
  rationale: יִגְדַּל இங்கு வெறும் ‘கடவுள் பெரியவர்’ என்ற கூற்றாக இல்லாமல் விருப்பம் அல்லது வாழ்த்தொலியின் வலிமையைக் கொண்டுள்ளது. தேர்ந்த தமிழ் வடிவம் கடவுளின் மேன்மை அறிவிக்கப்பட்டுப் போற்றப்பட வேண்டும் என்ற பொருளை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְשׁוּעָה என்பதன் பொருள்
  choice: மீட்பு
  alternative: இரட்சிப்பு; விடுதலை
  rationale: எபிரேயச் சொல் குறிப்பிட்ட துன்பத்திலிருந்து காப்பாற்றப்படுதலையும் பரந்த இரட்சிப்பையும் குறிக்க முடியும். ‘மீட்பு’ இரு சாத்தியங்களையும் திறந்தவாறு வைத்திருக்கிறது; அடிக்குறிப்பு மாற்றுப் பொருள்களைத் தெளிவுபடுத்துகிறது.
- issue: יִגְדַּל אֱלֹהִים என்பதன் விருப்ப/வாழ்த்தொலி வலிமை
  choice: கடவுள் உயர்த்திப் போற்றப்படுவாராக
  alternative: கடவுள் மேன்மையானவராக விளங்குவாராக; கடவுள் பெரியவர்
  rationale: இது வெறும் உண்மை அறிவிப்பு என்பதைவிட, மீண்டும் கூறப்படும் வாழ்த்தொலி அல்லது வேண்டுதலாகப் புரிந்துகொள்ளப்படுகிறது. தமிழ் மொழிபெயர்ப்பு அந்தப் பேச்சுச் செயலையும் கடவுளின் மகத்துவத்தையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வழிபாட்டு நடையுடன் மொழிபெயர்க்கப்பட்டது. தேவனை நோக்கும் ஒருமை மரியாதை வடிவங்களான ‘உம்மை/உமது’ பயன்படுத்தப்பட்டுள்ளன. கவிதை இணைநிலையும் வாழ்த்தொலியின் வலிமையும் பாதுகாக்கப்பட்டுள்ளன.
