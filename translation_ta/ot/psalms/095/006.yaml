  text: בֹּ֭אוּ נִשְׁתַּחֲוֶ֣ה וְ/נִכְרָ֑עָה נִ֝בְרְכָ֗ה לִֽ/פְנֵי יְהוָ֥ה עֹשֵֽׂ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/095/006.yaml
  text: Come[a], let us bow down in worship and kneel; let us bless[b] before Yahweh, our Maker.
translation:
  language: ta
  text: வாருங்கள், நாம் பணிந்து வணங்குவோம்; மண்டியிடுவோம்; நம்மை உண்டாக்கிய யாவேயின் முன்னிலையில் முழந்தாளிடுவோம்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “முழந்தாளிடுவோம்” என்பதற்கான எபிரெயச் சொல், வேறு வினைவடிவத்தில் “ஆசீர்வதித்தல்” எனப் பொருள்படும் வேருடன் ஒரே மெய்யெழுத்துகளைக் கொண்டது. ஆனால் இங்குள்ள உயிர்க்குறிப்பும் சூழலும் “முழந்தாளிடுவோம்” என்பதையே சுட்டுகின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֹּאוּ
  choice: வாருங்கள்
  rationale: பலரையும் அழைக்கும் எபிரெய பன்மை ஏவலை இயல்பான, மரியாதையான தமிழில் வெளிப்படுத்துகிறது.
- source_word: נִשְׁתַּחֲוֶה
  choice: நாம் பணிந்து வணங்குவோம்
  rationale: வழிபாட்டில் உடலைத் தாழ்த்திப் பணிவதையும் வணக்கத்தையும் ஒருங்கே குறிக்கும் வினையின் உடல்சார் மற்றும் பக்திசார் கூறுகளைப் பாதுகாக்கிறது.
- source_word: וְנִכְרָעָה
  choice: மண்டியிடுவோம்
  rationale: முழங்காலை மடக்கித் தாழும் உடல் நிலையைக் குறிக்கும் எபிரெய வினைக்கு தெளிவான நவீனத் தமிழ் இணை.
- source_word: נִבְרְכָה
  choice: முழந்தாளிடுவோம்
  rationale: இங்கு மசோரா உயிர்க்குறிப்பும் மூன்று உடல் நிலைகளைக் கொண்ட கவிதைத் தொடரும் இதை ‘முழந்தாளிடுதல்’ என்ற பொருளில் வாசிக்க ஆதரிக்கின்றன; ‘ஆசீர்வதிப்போம்’ என்பது இவ்விடத்தில் வேறு வேர்ப்பொருளைக் கலக்குகிறது.
- source_word: לִפְנֵי
  choice: முன்னிலையில்
  rationale: ஒருவரின் முகத்திற்கு முன்பாக அல்லது சந்நிதியில் இருப்பதைக் குறிக்கும் உறவை இயல்பான தமிழில் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய நான்கெழுத்துத் திருப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: עֹשֵׂנוּ
  choice: நம்மை உண்டாக்கிய
  rationale: ‘நம்மை உண்டாக்குகிறவர்/உண்டாக்கியவர்’ என்ற எபிரெயப் பங்கேற்புவினையின் பொருளை எளிய, நேர்த்தியான தமிழில் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் பட்டப்பெயர் அல்ல, தனிப்பட்ட உடன்படிக்கைப் பெயரே உள்ளது; ஆகவே அதை மறைக்காமல் ஒலிபெயர்ப்பாகப் பாதுகாக்கிறது.
- issue: נִבְרְכָה என்பதன் பொருள்
  choice: முழந்தாளிடுவோம்
  alternative: ஆசீர்வதிப்போம் / போற்றுவோம்
  rationale: மசோரா உரையின் வடிவமும், ‘பணிதல்—மண்டியிடுதல்—முழந்தாளிடுதல்’ என்ற இணையான உடல் இயக்கங்களின் சூழலும் ‘முழந்தாளிடுவோம்’ என்ற வாசிப்பை ஆதரிக்கின்றன. இதை ‘ஆசீர்வதிப்போம்’ என மாற்றுவது இங்குள்ள உண்மையான வடிவியல் மற்றும் சூழல்சார் சான்றை மறைக்கும்.
translation_notes:
  register: நவீன நிலையான தமிழில், கூட்டுவழிபாட்டுக்கேற்ற கண்ணியமான அழைப்பு நடை பயன்படுத்தப்பட்டுள்ளது. தொடர்ச்சியான மூன்று உடல் பணிவு உருவகங்களின் எபிரெயக் கவிதை அமைப்பு தமிழிலும் வேறுபட்ட சொற்களால் பாதுகாக்கப்பட்டுள்ளது.
