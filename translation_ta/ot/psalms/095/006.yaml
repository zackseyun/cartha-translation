  source_fidelity: மூல எபிரெய மசோரா உயிர்க்குறிப்பின்படி נִבְרְכָה என்பது ‘நாம் முழந்தாளிடுவோம்/மண்டியிடுவோம்’ என்ற பொருளையே தருகிறது; ‘நாம் ஆசீர்வதிப்போம்’ என்பதற்கான எதிர்பார்க்கப்படும் வடிவம் வேறுபடும். ஆகவே, ஆங்கில POB audit trail-இன் ‘bless’ முடிவுக்கு மாறாக, வரைவின் மூன்று உடல்சார் பணிவு வினைகள் மூலத்திற்கு உண்மையாயுள்ளன. לִפְנֵי יְהוָה עֹשֵׂנוּ என்பதும் ‘நம்மை உண்டாக்கிய யாவேயின் முன்னிலையில்’ என்று சரியாகத் தரப்பட்டுள்ளது.
  naturalness: ‘வாருங்கள், நாம் பணிந்து வணங்குவோம்; மண்டியிடுவோம்; ... முழந்தாளிடுவோம்’ என்பது நவீன நிலையான தமிழில் வழிபாட்டு அழைப்புக்கு ஏற்ற கண்ணியமான நடை. இரு நெருங்கிய முழங்கால்/பணிவு சொற்கள் தொடர்வது தமிழில் ஓரளவு மீளுரைப்பாகத் தோன்றினாலும், அது எபிரெயக் கவிதையின் திட்டமிட்ட மூவகைப் பணிவு வரிசையைப் பாதுகாக்கிறது.
  terminology: ‘யாவே’ என்பது யְהוָה-வின் ஒலிபெயர்ப்பாகச் சீரானது. ‘பணிந்து வணங்குவோம்,’ ‘மண்டியிடுவோம்,’ ‘முழந்தாளிடுவோம்’ ஆகியவை முறையே உடலைத் தாழ்த்துதல், குனிதல்/மண்டியிடுதல், முழங்கால்படிதல் என்ற வேறுபாடுகளைப் பொருத்தமாக வெளிப்படுத்துகின்றன. அடிக்குறிப்பு வடிவியல் வேறுபாட்டையும் ஒரே மெய்யெழுத்து வரிசையால் ஏற்படக்கூடிய குழப்பத்தையும் நியாயமாக விளக்குகிறது.
