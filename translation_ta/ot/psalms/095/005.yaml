  yaml_path: translation/ot/psalms/095/005.yaml
  text: The sea is his[a], for he made it[b], and his hands formed the dry land.
translation:
  language: ta
  text: கடல் அவருடையது[a]; ஏனெனில் அவர் அதை உண்டாக்கினார்[b]; உலர்ந்த நிலத்தை அவருடைய கைகள் உருவாக்கின.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடல் அவருக்குரியது.” எபிரெயத்தில் சொற்சொல்லாக, “அவருக்கு கடல் [உரியது]” என்று உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “மற்றும் அவர் அதை உண்டாக்கினார்.” எபிரெய இணைப்புச்சொல் வடிவில் “மற்றும்” என்று பொருள்படும்; இங்கு அது காரணத் தொடர்பைக் குறிப்பதாகத் தெரிகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר לֹו
  choice: அவருடையது
  rationale: இந்தத் தொடர்புச் சொற்றொடர் உடைமையைக் குறிக்கிறது. “அவருடையது” என்பது அதன் பொருளைச் சுருக்கமாகவும் இயல்பான நவீனத் தமிழிலும் தருகிறது.
- source_word: הַיָּם
  choice: கடல்
  rationale: இந்த எபிரெயச் சொல்லின் வழக்கமான பொருள் “கடல்”; “பெருங்கடல்” என்பது தேவையற்ற பொருள் விரிவாக்கமாகிவிடும்.
- source_word: וְהוּא
  choice: ஏனெனில், அவரே
  rationale: וְ என்பது வடிவில் “மற்றும்/ஆனால்” எனும் இணைப்புச்சொல்; இங்கு கடல் அவருடையது என்பதற்கான காரணத்தை அடுத்த கூற்று தருவதால் “ஏனெனில்” என்று மொழிபெயர்க்கப்பட்டது. הוּא வெளிப்படையாக இருப்பதன் வலியுறுத்தலை “அவரே” தக்கவைக்கிறது.
- source_word: עָשָׂהוּ
  choice: அதை உண்டாக்கினார்
  rationale: பின்னொட்டு முன் குறிப்பிடப்பட்ட கடலைச் சுட்டுகிறது. עשה என்பதற்கு இங்கு படைப்புச் செயலைத் தெளிவாகக் கூறும் “உண்டாக்கினார்” இயல்பான இணைச்சொல்.
- source_word: וְיַבֶּשֶׁת
  choice: உலர்ந்த நிலத்தையும்
  rationale: יַבֶּשֶׁת கடலுக்கு மாறாக உலர்ந்த நிலத்தைக் குறிக்கிறது. “-யும்” என்பது எபிரெய இணைப்பை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: יָדָיו
  choice: அவருடைய கைகள்
  rationale: மூலத்தின் பன்மை வடிவமும் கவித்துவமான மனித உருவக மொழியும் நேரடியாகத் தக்கவைக்கப்பட்டுள்ளன.
- source_word: יָצָרוּ
  choice: உருவாக்கின
  rationale: יצר வடிவமைத்தல் அல்லது உருவமைத்தல் என்ற நுணுக்கத்தைக் கொண்டது. “உருவாக்கின” என்பது עשה என்பதற்குப் பயன்படுத்திய “உண்டாக்கினார்” என்பதிலிருந்து சொல்வேறுபாட்டையும் கவிதை இணைநிலையையும் காக்கிறது.
theological_decisions:
- issue: இறைச்செயலை மனித உறுப்புகளால் விவரிக்கும் உருவக மொழி
  choice: “அவருடைய கைகள் உருவாக்கின” என்ற கவித்துவ உருவகத்தைத் தக்கவைத்தல்
  alternative: “அவர் உருவாக்கினார்” அல்லது “அவருடைய வல்லமை உருவாக்கியது”
  rationale: எபிரெய உரை கடவுளுடைய “கைகள்” என்று வெளிப்படையாகக் கூறுகிறது. அதை விளக்கமாக மாற்றாமல் வைத்திருப்பது சங்கீதத்தின் கவித்துவப் படிமத்தைப் பாதுகாக்கிறது.
- issue: עשה, יצר ஆகிய படைப்புச் செயல் வினைகளின் வேறுபாடு
  choice: “உண்டாக்கினார்” மற்றும் “உருவாக்கின” என இரு வேறு தமிழ் வினைகளைப் பயன்படுத்துதல்
  alternative: இரண்டையும் “உருவாக்கினார்” அல்லது “உண்டாக்கினார்” என்று ஒரே சொல்லால் மொழிபெயர்த்தல்
  rationale: இரு சொற்களுக்கும் இடையே அளவுக்கு மீறிய இறையியல் வேறுபாட்டை உருவாக்காமல், மூலத்தின் சொல்வேறுபாட்டையும் கவிதை அமைப்பையும் இது பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பாகவும், சங்கீதத்துக்கேற்ற கண்ணியமான கவித்துவத் தொனியுடனும் அமைக்கப்பட்டது. இறைவனைச் சுட்டும் மரியாதைப் பன்மை தமிழ் நடை முழுவதும் ஒருமையாகப் பின்பற்றப்பட்டது.
