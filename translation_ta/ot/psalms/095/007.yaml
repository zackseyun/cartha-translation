  text: כִּ֘י ה֤וּא אֱלֹהֵ֗י/נוּ וַ/אֲנַ֤חְנוּ עַ֣ם מַ֭רְעִית/וֹ וְ/צֹ֣אן יָד֑/וֹ הַ֝/יּ֗וֹם אִֽם בְּ/קֹל֥/וֹ תִשְׁמָֽעוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/095/007.yaml
  text: For he is our God[a], and we are the people of his pasture, and the sheep of his hand. Today, if you hear his voice—
translation:
  language: ta
  text: ஏனெனில், அவரே நம் கடவுள்; நாம் அவர் மேய்க்கும் மக்களும், அவரது கைக்குள் இருக்கும் ஆடுகளும். இன்று நீங்கள் அவரது குரலைக் கேட்டால்—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இன்று நீங்கள் அவரது குரலைக் கேட்பீர்களாக!” எபிரெய மொழியின் இச்சொல் சாதாரண நிபந்தனையை மட்டுமல்லாமல், விருப்பம் கலந்த அறிவுறுத்தலையும் அறிமுகப்படுத்தக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய வழிபாட்டு அழைப்புக்கான காரணத்தை அறிமுகப்படுத்துகிறது; தமிழில் இயல்பான காரணத் தொடர்பைக் காட்டுகிறது.
- source_word: אֱלֹהֵינוּ
  choice: நம் கடவுள்
  rationale: முதலாம் நபர் பன்மை உடைமைப் பின்னொட்டையும் உடன்படிக்கை உறவையும் தெளிவாகத் தருகிறது.
- source_word: עַם מַרְעִיתוֹ
  choice: அவரது மேய்ச்சலின் மக்கள்
  rationale: மேய்ப்பர் உருவகத்தையும் எபிரெயக் கட்டமைப்பையும் பாதுகாக்கிறது; ‘மேய்ச்சல்’ என்பது இடத்தையும் பராமரிப்பையும் சுட்டக்கூடும்.
- source_word: צֹאן יָדוֹ
  choice: அவரது கையிலுள்ள மந்தை
  rationale: சொல்லாட்சியின் ‘அவரது கையின் மந்தை’ என்ற உருவகத்தை இயல்பான தமிழில், அவரது வழிநடத்தல் மற்றும் பாதுகாப்பின் கீழிருப்பதை உணர்த்தும் வகையில் வழங்குகிறது.
- source_word: הַיּוֹם
  choice: இன்று
  rationale: அடுத்துவரும் எச்சரிக்கைக்கான முக்கிய காலச் சுட்டியை நேரடியாகப் பாதுகாக்கிறது.
- source_word: אִם
  choice: என்றால்
  rationale: அடுத்த வசனத்தின் அறிவுறுத்தலுக்கு வழிவகுக்கும் நிபந்தனை-அறிவுறுத்தல் தன்மையைத் தருகிறது; விருப்பவுரைச் சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: בְּקֹלוֹ תִשְׁמָעוּ
  choice: நீங்கள் அவரது குரலைக் கேட்டால்
  rationale: שׁמע என்பதன் அடிப்படை ‘கேள்’ பொருளைப் பாதுகாத்து, கவனித்தல் அல்லது கீழ்ப்படிதல் என்ற சூழல்சார் உட்பொருளை மொழிபெயர்ப்பில் முன்கூட்டியே தீர்மானிக்கவில்லை.
theological_decisions:
- issue: הַיּוֹם אִם בְּקֹלוֹ תִשְׁמָעוּ என்ற இறுதிக் கூறின் வலிமை
  choice: “இன்று நீங்கள் அவரது குரலைக் கேட்டால்—” என்ற நிபந்தனை-அறிவுறுத்தல் தொடக்கமாக மொழிபெயர்க்கப்பட்டது.
  alternative: “இன்றாவது நீங்கள் அவரது குரலைக் கேட்பீர்களாக!” என்ற விருப்பம் கலந்த வேண்டுகோள்.
  rationale: אִם பொதுவாக நிபந்தனையை அறிமுகப்படுத்தினாலும், கவிதை மற்றும் அறிவுறுத்தல் சூழல்களில் விருப்பவுரைத் தன்மையையும் கொள்ளலாம். இங்கே அடுத்த வசனத்தின் ‘உங்கள் இதயங்களைக் கடினப்படுத்தாதீர்கள்’ என்ற எச்சரிக்கைக்குச் செல்லும் நிபந்தனை வாசிப்பு இயல்பானது; மாற்றுச் சாத்தியம் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘மேய்ச்சல்’, ‘மந்தை’, ‘கை’ ஆகிய மேய்ப்பர் உருவகங்கள் பாதுகாக்கப்பட்டுள்ளன. இறுதியிலுள்ள நீண்ட கோடு, சிந்தனை அடுத்த வசனத்தில் தொடர்வதைக் காட்டுகிறது.
