  yaml_path: translation/ot/psalms/095/003.yaml
  text: For Yahweh is a great God[a], and a great King above all gods.
translation:
  language: ta
  text: ஏனெனில், யாவே மகத்தான இறைவனும் எல்லாத் தெய்வங்களுக்கும்[a] மேலான மகத்தான அரசருமாவார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘எல்லாத் தெய்வீக உயிர்களுக்கும் மேலான.’ எபிரேயச் சொல்லான אֱלֹהִים, சூழலைப் பொறுத்து தெய்வங்கள், தெய்வீக உயிர்கள், அல்லது வானுலக உயிர்கள் ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய வழிபாட்டு அழைப்புக்கான காரணத்தை அறிமுகப்படுத்தும் எபிரேயச் சொல்லின் காரணப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֵל
  choice: இறைவன்
  rationale: இங்கு யாவேயின் தெய்வத்தன்மையை நேரடியாகக் கூறுகிறது; பன்மையிலுள்ள אֱלֹהִים என்பதற்கு பயன்படுத்திய ‘தெய்வங்கள்’ என்பதிலிருந்து மூலத்தின் சொல்வேறுபாட்டையும் இயன்றவரை காக்கிறது.
- source_word: גָּדוֹל
  choice: மகத்தான
  rationale: மேன்மையையும் உயர்ந்த நிலையையும் குறிக்கிறது; இரு அரையடிகளிலும் வரும் சொல்லின் மறுபயன்பாட்டைக் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், எபிரேய நான்கெழுத்துப் பெயரின் பரவலான தமிழ் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: וּמֶלֶךְ
  choice: அரசர்
  rationale: இணைப்புச் சொல் எபிரேயக் கவிதையின் இணை அமைப்பில் அரைப்புள்ளியால் இயல்பாக வெளிப்படுகிறது; மரியாதை ஒருமையான ‘அரசர்’ யாவேயைக் குறிக்கும் தமிழுக்கு ஏற்றது.
- source_word: עַל
  choice: மேலான
  rationale: ஒப்பீட்டு சூழலில் உயர்வையும் ஆட்சிச் சிறப்பையும் இயல்பாகத் தெரிவிக்கிறது.
- source_word: כָּל אֱלֹהִים
  choice: எல்லாத் தெய்வங்களுக்கும்
  rationale: ‘தெய்வங்கள்’ என்ற மொழிபெயர்ப்பு எபிரேயப் பன்மையின் வெளிப்படையான பொருளையும் அதன் இறையியல் பதற்றத்தையும் காக்கிறது; இவை சிலைகளா, பொய்த் தெய்வங்களா, அல்லது ஆன்மீக உயிர்களா என்பதை வசனத்திலேயே முடிவுசெய்யவில்லை.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட இறைப் பெயர் நேரடியாக இருப்பதால், அதை ஒரு பட்டத்தால் மாற்றாமல் ஒலிபெயர்த்துள்ளது.
- issue: ‘எல்லாத் தெய்வங்களுக்கும் மேலானவர்’ என்பதில் אֱלֹהִים என்பதன் பொருள்
  choice: தெய்வங்கள்
  alternative: தெய்வீக உயிர்கள்
  rationale: மூலத்தின் ஒப்பீட்டு மற்றும் வாதமுறை வலிமையை இது காக்கிறது; குறிப்பிடப்படுவோர் பொய்த் தெய்வங்களா அல்லது வானுலக உயிர்களா என்பதைத் தீர்மானிக்காமல் உண்மையான பொருள் மயக்கத்தைப் பாதுகாக்கிறது.
