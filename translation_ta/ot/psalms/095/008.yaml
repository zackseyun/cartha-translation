theological_decisions:
- issue: מְרִיבָה மற்றும் מַסָּה ஆகியவற்றை பொதுப்பெயர்களாக மொழிபெயர்ப்பதா, வரலாற்று இடப்பெயர்களாக ஒலிபெயர்ப்பதா
  choice: ‘மெரிபா’, ‘மாசா’ என்னும் வரலாற்றுப் பெயர்களாக முதன்மை உரையில் கொடுத்தல்
  alternative: ‘சச்சரவின்போது போலவும், வனாந்தரத்தில் சோதித்த நாளில் போலவும்’
  rationale: யாத்திராகமம் 17:7-இல் பெயரிடப்பட்ட சம்பவத்துடனான தொடர்பை இடப்பெயர்கள் பாதுகாக்கின்றன. அதே நேரத்தில், பெயர்களில் அடங்கிய ‘சச்சரவு’ மற்றும் ‘சோதித்தல்’ என்ற பொருள்கள் அடிக்குறிப்புகளில் தரப்பட்டதால் எபிரெயச் சொல் விளையாட்டும் இறையியல் பதற்றமும் மறைக்கப்படவில்லை.
