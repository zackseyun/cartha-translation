  text: in whose hand are the depths of the earth[b][a], and the heights of the mountains are his.
translation:
  language: ta
  text: பூமியின் ஆழங்கள் அவருடைய கையில் இருக்கின்றன; மலைகளின் உயரங்களும் அவருக்குரியவை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲשֶׁר בְּיָדוֹ
  choice: அவருடைய கையில் இருக்கின்றன
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட ஆண்டவரைச் சார்ந்த உறவுத்தொடரைத் தமிழில் இயல்பாகத் தொடர்கிறது. உடைமையையும் ஆளுகையையும் குறிக்கும் எபிரேய உருவகத்தைச் சுருக்காமல் காக்கிறது.
- source_word: מֶחְקְרֵי
  choice: ஆழங்கள்
  rationale: ஆராய்ந்து எட்டுவதற்குக் கடினமான ஆழ்ந்த அல்லது மறைவான இடங்களைக் குறிக்கும் சொல்லை, அடுத்த அடியிலுள்ள மலைகளின் உயரங்களோடு உள்ள செங்குத்தான கவித்துவ எதிரிணையைப் பாதுகாக்கும் வகையில் மொழிபெயர்க்கிறது.
- source_word: אָרֶץ
  choice: பூமியின்
  rationale: படைப்பனைத்தையும் உள்ளடக்கும் துதிச் சூழலில், ஒரு குறிப்பிட்ட நாட்டையோ நிலப்பகுதியையோ விட உலகளாவிய பொருளை வெளிப்படுத்துகிறது.
- source_word: וְתוֹעֲפוֹת
  choice: உயரங்களும்
  rationale: இச்சொல் உயர்ந்த இடங்கள் அல்லது சிகரங்களைக் குறிக்கலாம். 'உயரங்கள்' என்பது மூலத்தின் பரந்த பொருளையும் 'ஆழங்கள்' என்பதுடனான கவித்துவ எதிரிணையையும் காக்கிறது.
- source_word: הָרִים
  choice: மலைகளின்
  rationale: மூலத்திலுள்ள வரையறுக்கப்பட்ட பன்மையை இயல்பான தமிழில் கொண்டு வந்து, மலைகளைப் பொதுவான படைப்புலகப் படிமமாகக் காட்டுகிறது.
- source_word: לוֹ
  choice: அவருக்கே உரியவை
  rationale: உடைமையைத் தெளிவாகக் கூறுவதோடு, எபிரேய இறுதிச்சொல்லின் வலியுறுத்தலைத் தமிழின் '-க்கே' மூலம் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: படைப்பின் மீதான இறை உடைமையின் எல்லை
  choice: பூமியின் ஆழங்கள் முதல் மலைகளின் உயரங்கள் வரை படைப்பனைத்தும் ஆண்டவரின் ஆளுகைக்கும் உடைமைக்கும் உட்பட்டது என்ற உலகளாவிய கூற்று
  alternative: இஸ்ரவேல் நாட்டையும் அதன் நில அமைப்பையும் மட்டும் குறிக்கும் வட்டாரக் கூற்று
  rationale: சங்கீதத்தின் பரந்த வழிபாட்டு அழைப்பும் ஆழம்–உயரம் என்ற இரு எல்லைகளின் இணைப்பும், ஒரு குறிப்பிட்ட பகுதியை அல்லாமல் படைப்புலகம் முழுவதையும் குறிக்கின்றன.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகருக்கு எளிதில் புரியும் தமிழ். 'கையில்' என்ற மூல உருவகம் காக்கப்பட்டுள்ளது; 'ஆழங்கள்/உயரங்கள்' என்ற கவித்துவ இணைநிலையும் பேணப்பட்டுள்ளது.
