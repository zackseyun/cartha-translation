id: PSA.95.1
reference: Psalms 95:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: לְ֭כוּ נְרַנְּנָ֣ה לַ/יהוָ֑ה נָ֝רִ֗יעָה לְ/צ֣וּר יִשְׁעֵֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/095/001.yaml
  text: Come[a], let us sing for joy to Yahweh; let us shout aloud to the Rock of our salvation.
translation:
  language: ta
  text: வாருங்கள், யாவேக்கு மகிழ்ச்சியுடன் பாடுவோம்; நமது மீட்பின் கன்மலையை நோக்கி ஆர்ப்பரிப்போம்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְכוּ
  choice: வாருங்கள்
  rationale: הלך என்பதன் பன்மை ஏவல் வடிவம் இங்கு நேரடியான ‘செல்லுங்கள்’ என்ற பொருளில் அல்லாமல், ஒன்றுகூடிய அழைப்பாக வருகிறது; ‘வாருங்கள்’ அதன் இயல்பான தமிழாக்கம்.
- source_word: נְרַנְּנָה
  choice: மகிழ்ச்சியுடன் பாடுவோம்
  rationale: רנן என்பதன் cohortative வடிவம் களிப்பான, குரலெழுப்பும் புகழ்ச்சியைக் குறிக்கிறது; இத்தொடர் அதன் இசை மற்றும் மகிழ்ச்சி ஆகிய இரு கூறுகளையும் வெளிப்படுத்துகிறது.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: לְ முன்னொட்டு புகழ்ச்சியின் முகவரைக் குறிக்கிறது; יהוה என்ற இறைபெயர் பொதுப்பட்டத்தால் மாற்றப்படாமல் ‘யாவே’ என ஒலிபெயர்க்கப்படுகிறது.
- source_word: נָרִיעָה
  choice: ஆர்ப்பரிப்போம்
  rationale: רוע/ריע என்பதன் Hiphil cohortative வடிவம் வழிபாடு அல்லது வெற்றியில் உரத்த முழக்கமிடுவதைக் குறிக்கிறது; ‘ஆர்ப்பரிப்போம்’ அதன் வலிமையையும் பொதுவான குரலெழுப்புதலையும் சுருக்கமாகத் தருகிறது.
- source_word: לְצוּר
  choice: கன்மலையை நோக்கி
  rationale: צוּר என்பது நேரடியாக ‘கன்மலை’; இங்கு கடவுளின் உறுதி, பாதுகாப்பு, வலிமை ஆகியவற்றை உணர்த்தும் உருவகம். לְ என்பதன் முகவரிப் பொருளை இயல்பான தமிழில் ‘நோக்கி’ வெளிப்படுத்துகிறது.
- source_word: יִשְׁעֵנוּ
  choice: நமது மீட்பின்
  rationale: יֵשַׁע என்ற பெயர்ச்சொல்லின் முதலாம் நபர் பன்மை உரிமை வடிவம்; ‘நமது மீட்பு’ விடுதலை மற்றும் இரட்சிப்பு ஆகிய பரந்த பொருளைத் தக்கவைக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைபெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: எபிரெய உரை நான்கெழுத்து இறைபெயரை நேரடியாகப் பயன்படுத்துகிறது. அதை ஒரு பொதுப்பட்டமாக மாற்றாமல், உடன்படிக்கைப் பெயராக ‘யாவே’ என ஒலிபெயர்ப்பது மூலவடிவின் தனித்தன்மையைப் பாதுகாக்கிறது.
- issue: צוּר என்ற தெய்வீக உருவகம்
  choice: கன்மலை
  alternative: அடைக்கலம்; வலிமையானவர்
  rationale: மூலத்தின் உறுதியான உருவகத்தை விளக்கவுரையால் மாற்றாமல் தக்கவைக்கிறது; அதன் பாதுகாப்பு, நிலைத்தன்மை, வலிமை ஆகிய உட்பொருள்களை வாசகர் உணர இடமளிக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கூட்டுவழிபாட்டுக்குரிய அழைப்பின் உற்சாகமும் சங்கீதத்திற்குரிய கண்ணியமும் காக்கப்பட்டுள்ளன. இரு cohortative வினைகளும் ‘பாடுவோம்’, ‘ஆர்ப்பரிப்போம்’ என்ற உள்ளடக்கும் பன்மை வடிவங்களில் வழங்கப்பட்டுள்ளன.
