source:
  edition: WLC
  text: אַרְבָּ֘עִ֤ים שָׁנָ֨ה אָ֘ק֤וּט בְּ/ד֗וֹר וָ/אֹמַ֗ר עַ֤ם תֹּעֵ֣י לֵבָ֣ב הֵ֑ם וְ֝/הֵ֗ם לֹא יָדְע֥וּ דְרָכָֽ/י׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/095/010.yaml
  text: For forty years I loathed that generation[a], and said, “They are a people who go astray in heart, and they have not known my ways.”
translation:
  language: ta
  text: நாற்பது ஆண்டுகளாக அந்தத் தலைமுறையைக் கண்டு அருவருப்படைந்தேன்[a]. “இவர்கள் உள்ளத்தில் வழிதவறும் மக்கள்; என் வழிகளை இவர்கள் அறியவில்லை” என்று சொன்னேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்தத் தலைமுறையைக் குறித்து மனம் வருந்தினேன்.” எபிரெய வினை அருவருப்பு, சலிப்பு, அல்லது மனவருத்தத்தை வெளிப்படுத்தலாம்; சூழலின் கடுமையைத் தெரிவிக்க முதன்மை உரையில் வலுவான சொல் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַרְבָּעִים שָׁנָה
  choice: நாற்பது ஆண்டுகளாக
  rationale: காலநீட்சியைத் தெளிவாகவும் இயல்பான தமிழிலும் வெளிப்படுத்துகிறது.
- source_word: אָקוּט
  choice: அருவருப்படைந்தேன்
  rationale: קוט என்ற வினை சலிப்பு, வெறுப்பு, அருவருப்பு அல்லது மனவருத்தத்தை வெளிப்படுத்தலாம். இச்சூழலின் கடுமையைப் பாதுகாக்க ‘அருவருப்படைந்தேன்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: בְּדוֹר
  choice: அந்தத் தலைமுறையின்மேல்
  rationale: வனாந்தரத் தலைமுறையைக் குறிப்பதாகச் சூழல் காட்டுகிறது; உணர்ச்சி நிலையைச் சுட்டும் வினையோடு வரும் בְּ என்பதற்கு இயல்பான தமிழ் உறவு ‘-மேல்’ ஆகும்.
- source_word: עַם תֹּעֵי לֵבָב
  choice: இவர்கள் உள்ளத்தில் வழிதவறிச் செல்கிற மக்கள்
  rationale: தொடர்ந்து வழிதவறும் நிலையைக் காட்டும் எபிரெயப் பங்கேற்புவினையையும், உள்ளார்ந்த மனப்போக்கைக் குறிக்கும் ‘இதயம்/உள்ளம்’ உருவகத்தையும் பாதுகாக்கிறது.
- source_word: לֹא יָדְעוּ דְרָכָי
  choice: என் வழிகளை இவர்கள் அறிந்துகொள்ளவில்லை
  rationale: ידע என்பதன் அடிப்படைப் பொருளான ‘அறிதல்’ என்பதையும், தேவனுடைய நடைமுறைகள் அல்லது வழிநடத்துதல்களைக் குறிக்கும் ‘என் வழிகள்’ என்பதையும் இயல்பான தமிழில் தருகிறது.
- source_word: וָאֹמַר
  choice: என்று சொன்னேன்
  rationale: இறைவனுடைய எதிர்வினையைத் தொடர்ந்து வரும் மதிப்பீட்டை நேரடியான பேச்சாக இயல்பாக இணைக்கிறது.
theological_decisions:
- issue: קוט வெளிப்படுத்தும் இறை அணுகுமுறை
  choice: கடுமையான அருவருப்பு/வெறுப்புணர்வு (‘அருவருப்படைந்தேன்’)
  alternative: மென்மையான மனவருத்தம் (‘அந்தத் தலைமுறையால் மனம் வருந்தினேன்’)
  rationale: எபிரெய வினை வெறும் துயரத்தைவிட வலுவான வெறுப்பு, சலிப்பு அல்லது அருவருப்பைக் குறிக்கக்கூடும். தொடர்ச்சியான கலகத்திற்கான இறை மறுப்பின் கடுமையை முதன்மை உரை பாதுகாக்கிறது; சொற்பொருளின் விரிவை அடிக்குறிப்பு தெரிவிக்கிறது.
- issue: לֹא יָדְעוּ דְרָכָי என்பதன் காலநிலை மற்றும் குற்றச்சாட்டு
  choice: நிலைத்த அறியாமை/அங்கீகரிக்காமை (‘அறிந்துகொள்ளவில்லை’)
  alternative: எளிய இறந்தகாலம் (‘அறியவில்லை’)
  rationale: எபிரெய நிறைவுவினை, சூழலில் அவர்களுடைய தொடர்ந்த தோல்வியைச் சுருக்கிக் கூறுகிறது. தமிழ் எதிர்மறை நிறைவுவடிவம் அந்த நிலைத்த குற்றச்சாட்டை இயல்பாகக் காட்டுகிறது.
