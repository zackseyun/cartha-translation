  text: so I swore in my anger[b][a], ‘They shall not enter my rest.’
translation:
  language: ta
  text: 'ஆகவே, என் கோபத்தில் நான் சத்தியம் செய்தேன்: “அவர்கள் என் இளைப்பாறுதலுக்குள் நுழையவே மாட்டார்கள்.”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்சொல்லாக, “அவர்கள் என் இளைப்பாறுதலுக்குள் நுழைந்தால்”—இது “அவர்கள் நிச்சயமாக நுழைய மாட்டார்கள்” என்று பொருள்படும் ஒரு சத்திய உறுதிமொழிச் சொற்றொடர்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “என் இளைப்பாறும் இடத்துக்குள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: ஆகவே
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட மக்களின் கலகத்தையும் அதற்கான விளைவாகிய இறைவனின் ஆணையையும் இணைக்கும் விளைவுப்பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: נִשְׁבַּעְתִּי
  choice: நான் ஆணையிட்டேன்
  rationale: שבע என்பதன் நிபால் வடிவம் ‘சத்தியம் செய்தல், ஆணையிடுதல்’ என்று பொருள்படும். இங்கு இறைவனின் உறுதியான சத்திய அறிவிப்பை ‘ஆணையிட்டேன்’ தெளிவாகவும் கண்ணியமாகவும் தெரிவிக்கிறது.
- source_word: בְאַפִּי
  choice: என் கோபத்தில்
  rationale: אַף என்பதன் அடிப்படைப் பொருள் ‘மூக்கு’ என்றாலும், இங்கு அது மரபுத்தொடராகக் ‘கோபம்’ என்பதைக் குறிக்கிறது.
- source_word: אִם
  choice: நுழையவே மாட்டார்கள்
  rationale: சத்தியத்தைத் தொடர்ந்து வரும் אִם, சொல்லெச்சமாக ‘என்றால்’ என்று இருந்தாலும், இங்கு மிக உறுதியான மறுப்பைக் குறிக்கும் எபிரெய சத்தியச் சூத்திரம். தமிழில் அதன் உண்மையான வலிமையை வெளிப்படுத்த மறுப்பு தெளிவாகக் கூறப்படுகிறது.
- source_word: יְבֹאוּן אֶל
  choice: நுழையவே மாட்டார்கள்
  rationale: בוא உடன் אֶל சேர்ந்து ஒரு இடத்திற்குள் வருதல் அல்லது நுழைதல் என்ற பொருளைத் தருகிறது; ‘நுழை’ என்பது தமிழில் இயல்பான சுருக்கமான தெரிவு.
- source_word: מְנוּחָתִי
  choice: என் இளைப்பாறுதல்
  rationale: מְנוּחָה என்பது இளைப்பாறும் நிலை அல்லது இளைப்பாறும் இடம் ஆகிய இரண்டையும் குறிக்கலாம். ‘என் இளைப்பாறுதல்’ அதன் சுருக்கத்தையும் பொருள் விரிவையும் காக்கிறது.
theological_decisions:
- issue: אִם கொண்ட சொல்லெச்ச சத்தியச் சூத்திரம்
  choice: ‘அவர்கள் ... நுழையவே மாட்டார்கள்’ என்ற வெளிப்படையான, வலியுறுத்தப்பட்ட மறுப்பு
  alternative: ‘அவர்கள் ... நுழைந்தால்’ என்ற சொற்சொல்லான வடிவம்
  rationale: எபிரெயத்தில் சத்தியத்துக்குப் பின் வரும் אִם மிக உறுதியான மறுப்பைத் தெரிவிக்கிறது. தமிழில் ‘என்றால்’ என்று மட்டும் மொழிபெயர்த்தால் பொருள் முழுமையற்றதாகவும் தவறாகப் புரியக்கூடியதாகவும் இருக்கும்.
- issue: מְנוּחָה என்பதன் பொருள் விரிவு
  choice: என் இளைப்பாறுதல்
  alternative: என் இளைப்பாறும் இடம் / என் ஓய்விடம்
  rationale: மூலச்சொல் ஒரு நிலை அல்லது ஓர் இடம் ஆகிய இரண்டையும் சுட்டலாம். ‘இளைப்பாறுதல்’ என்று மொழிபெயர்ப்பது அந்தத் தெளிவின்மையையும் வேதாகமப் பின்னணியில் அதன் விரிந்த இறையியல் ஒலிப்பையும் குறுக்காமல் காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், சங்கீதத்திற்குரிய கண்ணியத்துடன் வடிவமைக்கப்பட்டது. ‘நுழையவே மாட்டார்கள்’ என்பது மூலத்தின் வலுவான சத்திய மறுப்பை இயல்பான தமிழில் எடுத்துரைக்கிறது; ‘இளைப்பாறுதல்’ என்பது நிலை/இடம் என்ற இரு சாத்தியங்களையும் திறந்தவையாக வைத்திருக்கிறது.
