  to: நன்றியுடன் அவருடைய திருமுகத்தின் முன் வருவோம்[a]; பாடல்களோடு அவருக்கு மகிழ்ச்சியுடன் ஆர்ப்பரிப்போம்.
  rationale: The revision preserves the source’s cohortative invitation, thanksgiving, concrete ‘face’ imagery, songs, and jubilant shout, while improving idiomatic modern Tamil. The footnote remains anchored to ‘திருமுகத்தின் முன்’ and explains the lexical alternative without replacing the main-text imagery.
