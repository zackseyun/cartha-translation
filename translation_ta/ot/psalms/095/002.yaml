translation_notes:
  register: நவீனத் தரத் தமிழில், கூட்டுத் தொழுகைக்கேற்ற கண்ணியமான ஊக்கவினை நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் ‘முகம்’ என்ற தெளிவான உருவகம் ‘திருமுகம்’ என முதன்மை உரையில் காக்கப்பட்டு, அதன் மரபுத்தொடர்ப் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
