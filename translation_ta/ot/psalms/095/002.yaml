id: PSA.95.2
reference: Psalms 95:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: נְקַדְּמָ֣ה פָנָ֣י/ו בְּ/תוֹדָ֑ה בִּ֝/זְמִר֗וֹת נָרִ֥יעַֽ לֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/095/002.yaml
  text: Let us come before his face with thanksgiving[a]; let us shout joyfully to him with songs.
translation:
  language: ta
  text: நன்றியுடன் அவருடைய திருமுகத்தின் முன் வருவோம்[a]; பாடல்களோடு அவருக்கு மகிழ்ச்சியுடன் ஆர்ப்பரிப்போம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவருடைய முன்னிலையில்.’ எபிரெயத்தில் ‘அவருடைய முகம்’ என்பது ஒருவரின் தனிப்பட்ட முன்னிலையைக் குறிக்கும் பொதுவான மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְקַדְּמָה
  choice: வருவோம்
  rationale: קדם என்பதன் ஹிஃபில், முதலாம் நபர் பன்மை ஊக்கவினை வடிவம்; ஒருவரை எதிர்கொண்டு அணுகுதல் அல்லது அவர் முன் வருதல் என்ற பொருளில் கூட்டான அழைப்பை வெளிப்படுத்துகிறது. பின்வரும் ‘திருமுகத்துக்கு முன்பாக’ என்பதுடன் ‘வருவோம்’ இயல்பாக இணைகிறது.
- source_word: פָנָיו
  choice: அவருடைய திருமுகத்துக்கு முன்பாக
  rationale: எபிரெயச் சொல்லின் நேரடிப் பொருள் ‘அவருடைய முகம்’; அது ஒருவரின் தனிப்பட்ட முன்னிலையைக் குறிக்கும் மரபுத்தொடராகவும் பயன்படுகிறது. ‘திருமுகம்’ இறைவனைப் பற்றிய கண்ணியமான தமிழ் வழக்காக இருந்து, மூலத்தின் உருவகத்தையும் காக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בְּתוֹדָה
  choice: நன்றியுடன்
  rationale: תוֹדָה என்பது நன்றி, துதி, அல்லது நன்றிப் பலி எனப் பொருள்படலாம். இசைப் புகழ்ச்சியுடன் அமைந்துள்ள இச்சூழலில் மனத்தாலும் சொல்லாலும் செலுத்தும் நன்றி முதன்மையானது; ‘நன்றியுடன்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: בִּזְמִרוֹת
  choice: பாடல்களால்
  rationale: זְמִרוֹת இசையுடன் பாடப்படும் பாடல்களை, குறிப்பாகப் புகழ்ச்சிப் பாடல்களை, குறிக்கிறது. ‘பாடல்கள்’ என்பது தேவையற்ற குறிப்பாக்கம் இன்றிய விரிவான, வாசிக்க எளிய மொழிபெயர்ப்பு.
- source_word: נָרִיעַ
  choice: மகிழ்ச்சி ஆரவாரம் எழுப்புவோம்
  rationale: רוע/ריע என்பதன் ஹிஃபில், முதலாம் நபர் பன்மை ஊக்கவினை வடிவம்; கொண்டாட்டமிக்க உரத்த முழக்கத்தை எழுப்புவதைச் சுட்டுகிறது. இத்தமிழாக்கம் ஒலியையும் மகிழ்ச்சித் தன்மையையும் வெளிப்படுத்துகிறது.
- source_word: לוֹ
  choice: அவரை நோக்கி
  rationale: לְ முன்னொட்டுடன் மூன்றாம் நபர் ஆண்பால் ஒருமை பின்னொட்டு சேர்ந்து, புகழ்ச்சியின் இலக்கைச் சுட்டுகிறது. ‘அவரை நோக்கி’ என்பது அந்தத் திசை மற்றும் இலக்கைத் தெளிவாகக் காட்டுகிறது.
