  text: where your fathers tested me and tried me[b][a], though they had seen my work.
translation:
  language: ta
  text: அங்கே உங்கள் தந்தையர் என் செயலைக் கண்டிருந்தும், என்னைச் சோதித்துப் பரிசோதித்தார்கள்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அங்கே உங்கள் தந்தையர் என்னைச் சோதித்தார்கள்; என்னைப் பரிசோதித்தார்கள்; என் செயலையும் கண்டார்கள்.” எபிரேயத்தை இவ்வாறு மேலும் நேரடியாக மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “என்னைச் சோதித்தார்கள்; என்னைப் பரிசோதித்தார்கள்.”
    reason: previous_rendering
lexical_decisions:
- source_word: אֲשֶׁר
  choice: அங்கே
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட வனாந்தர இடத்தை இச்சார்புப்பெயர் சுட்டுவதால், இடப்பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: נִסּוּנִי
  choice: என்னைச் சோதித்து
  rationale: נסה என்பதன் சோதித்தல் அல்லது சோதனைக்கு உட்படுத்துதல் என்ற எதிர்ப்புணர்வை நேரடியாகத் தருகிறது.
- source_word: אֲבוֹתֵיכֶם
  choice: உங்கள் தந்தையர்
  rationale: எபிரெயச் சொல்லின் ஆண்பால் வடிவத்தையும் உடன்படிக்கைச் சமூகத்தின் முற்பிதாக்களை நோக்கும் சொல்லாட்சியையும் காக்கிறது.
- source_word: בְּחָנוּנִי
  choice: பரிசோதித்தார்கள்
  rationale: בחן என்பது சோதித்து மெய்ப்பிக்க முயல்வதைக் குறிக்கிறது; முந்தைய வினையுடன் உள்ள இணைநிலையைக் காத்தபடி அதன் தனி நிழற்பொருளையும் காட்டுகிறது.
- source_word: גַּם
  choice: கண்டிருந்தும்
  rationale: גם என்பதன் அடிப்படைப் பொருள் ‘மேலும்/கூட’ என்றாலும், இச்சூழலில் தேவனுடைய செயலை முன்பே கண்ட நிலையிலும் அவரைச் சோதித்தார்கள் என்ற விட்டுக்கொடுப்பு உறவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: רָאוּ
  choice: கண்டிருந்தும்
  rationale: சோதித்த செயலுக்கு முன்னரே அவர்கள் கண்ட அனுபவம் இருந்ததை இறந்தகால நிறைவுவடிவம் உணர்த்துகிறது.
- source_word: פָעֳלִי
  choice: என் செயலை
  rationale: פעל என்பதன் ஒருமைத் தொகுப்புணர்வை நெருக்கமாகக் காத்து, வனாந்தரத்தில் தேவன் செய்த வல்லமையான செயல்களைச் சுட்டுகிறது.
theological_decisions:
- issue: இறுதிக் கூறின் விட்டுக்கொடுப்பு பொருள்
  choice: என் செயலைக் கண்டிருந்தும் அப்படிச் செய்தார்கள்
  alternative: அவர்கள் என்னைப் பரிசோதித்தார்கள்; என் செயலையும் கண்டார்கள்
  rationale: גם என்பதை சொற்சொல்லாக ‘மேலும்’ என்று மொழிபெயர்க்கலாம். ஆயினும், தேவனுடைய செயலைக் கண்ட பின்னும் அவரைச் சோதித்தார்கள் என்பதே சூழலுக்கு ஏற்ற வாய்ப்பு மிகுந்த தொடர்பு. அடிக்குறிப்பு சொற்சொல் மாற்றைத் தக்கவைக்கிறது.
- issue: אֲבוֹתֵיכֶם என்பதன் மொழிபெயர்ப்பு
  choice: உங்கள் தந்தையர்
  alternative: உங்கள் முன்னோர்கள்
  rationale: எபிரெய மூலத்தின் ஆண்பால் சொல்லையும் சமூகத்தின் முற்பிதாக்களை நேரடியாகச் சுட்டும் கவித்துவ மொழியையும் காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், சங்கீதத்துக்குரிய கண்ணியமான கவிநடையுடன் மொழிபெயர்க்கப்பட்டது. ‘சோதித்து பரிசோதித்தார்கள்’ என்பது இரு எபிரெய வினைகளின் நெருங்கிய இணைநிலையைப் பாதுகாக்கிறது; தெளிவுக்காக இறுதியில் ‘அப்படிச் செய்தார்கள்’ சேர்க்கப்பட்டுள்ளது.
