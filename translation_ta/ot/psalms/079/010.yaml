  text: לָ֤/מָּה יֹאמְר֣וּ הַ/גּוֹיִם֮ אַיֵּ֪ה אֱֽלֹהֵ֫י/הֶ֥ם יִוָּדַ֣ע ב/גיים לְ/עֵינֵ֑י/נוּ נִ֝קְמַ֗ת דַּֽם עֲבָדֶ֥י/ךָ הַ/שָּׁפֽוּךְ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/010.yaml
  text: Why should the nations say[b][a], “Where is their God?” Let the vengeance of your servants' shed blood be made known among the nations before our eyes.
translation:
  language: ta
  text: “அவர்களுடைய கடவுள் எங்கே?” என்று பிற நாடுகள் ஏன் சொல்ல வேண்டும்? உம் அடியார்களின் சிந்தப்பட்ட இரத்தத்திற்கான பழிவாங்குதல் பிற நாடுகளிடையே எங்கள் கண்முன் அறியப்படட்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, “பிற நாடுகளிடையே எங்கள் கண்முன் இது அறியப்படட்டும்: உம் அடியார்களின் சிந்தப்பட்ட இரத்தத்திற்கான பழிவாங்குதல்.”'
    reason: ‘எங்கள் கண்முன்’ என்பதன் தொடர்பையும் பழிவாங்குதல் அறியப்படுவதன் தொடரியல் அமைப்பையும் வேறுவிதமாக வெளிப்படுத்தக்கூடிய மூலமொழி வாய்ப்பைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: לָמָּה יֹאמְרוּ
  choice: ஏன் சொல்ல வேண்டும்?
  rationale: இது வெறும் காரணவினா அல்ல; பிற இனத்தாரின் ஏளனத்துக்கு எதிரான விண்ணப்பமும் எதிர்ப்பும் கொண்ட சொல்லாட்சி. ‘ஏன் சொல்ல வேண்டும்?’ என்பது அந்த நயத்தை இயல்பான தமிழில் தருகிறது.
- source_word: הַגּוֹיִם
  choice: பிற இனத்தார்
  rationale: இங்கு இஸ்ரவேலுக்கு வெளியேயுள்ள அயல் மக்களைக் குறிக்கிறது. புதிய ஏற்பாட்டுக்குரிய தனிப்பட்ட சமய நுணுக்கத்தைச் சேர்க்காமல், மக்கள் குழுக்களைக் குறிக்கும் இயல்பான தமிழ்.
- source_word: אַיֵּה אֱלֹהֵיהֶם
  choice: அவர்களுடைய கடவுள் எங்கே?
  rationale: இஸ்ரவேலின் கடவுளைக் குறித்து பிற இனத்தார் கூறும் நேரடியான ஏளனக் கேள்வியைப் பாதுகாக்கிறது.
- source_word: יִוָּדַע
  choice: வெளிப்படட்டும்
  rationale: ידע என்பதன் நிபால் வடிவம் ‘அறியப்படுதல்/வெளிப்படுதல்’ என்ற பொருளைக் கொண்டது. பொதுவாகக் காணத்தக்க விதத்தில் பழிவாங்குதல் தெரியவர வேண்டும் என்ற விண்ணப்பத்தைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: בַגּוֹיִם
  choice: பிற இனத்தாரிடையே
  rationale: கடவுளின் செயல் அயல் மக்களிடையே பொதுவாக அறியப்பட வேண்டிய களத்தைக் குறிக்கிறது.
- source_word: לְעֵינֵינוּ
  choice: எங்கள் கண்முன்
  rationale: நேரடியாகக் காணத்தக்க நிகழ்வைக் குறிக்கும் எபிரெய வழக்கின் உயிரோட்டத்தை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: נִקְמַת
  choice: பழிவாங்குதல்
  rationale: נקמה என்பதன் வெளிப்படையான பழிவாங்கும் வலிமையை ‘நீதி’ என்று மென்மைப்படுத்தாமல் தக்கவைக்கிறது.
- source_word: דַּם עֲבָדֶיךָ הַשָּׁפוּךְ
  choice: சிந்தப்பட்ட உம் அடியார்களின் இரத்தம்
  rationale: வன்முறையாகச் சிந்தப்பட்ட இரத்தத்தையும், கடவுளோடு அவர்களுக்கு உள்ள பணிவுறவையும் தெளிவாகக் காட்டுகிறது. ‘அடியார்கள்’ என்பது சங்கீத மொழிநடைக்கு ஏற்ற, புரிந்துகொள்ளத்தக்க மரியாதைச் சொல்.
theological_decisions:
- issue: தெய்வீகப் பழிவாங்குதலுக்கான சாபவிண்ணப்பம்
  choice: ‘பழிவாங்குதல்’ என்ற நேரடியான சொல்லைப் பாதுகாத்தல்
  alternative: ‘நீதி வழங்குதல்’ அல்லது ‘நியாயம் செய்தல்’ என்று மென்மைப்படுத்துதல்
  rationale: மூலத்தில் נִקְמַת என்பது பழிவாங்குதல் அல்லது பழிதீர்த்தல் என்பதைக் குறிப்பாகச் சொல்கிறது. சங்கீதத்தின் இறையியல் பதற்றத்தையும் தீவிரமான விண்ணப்பத்தையும் மொழிபெயர்ப்பு மறைக்கக்கூடாது.
- issue: ‘எங்கள் கண்முன்’ என்பதன் தொடரியல் தொடர்பு
  choice: பிற இனத்தாரிடையே பழிவாங்குதல் வெளிப்படுவதோடு இணைத்தல்
  alternative: ‘எங்கள் கண்முன் நிகழும் பழிவாங்குதல்’ என்று ‘பழிவாங்குதல்’ என்பதோடு இன்னும் இறுக்கமாக இணைத்தல்
  rationale: எபிரெயச் சொல் வரிசை ஓரளவு இருபொருள் வாய்ப்பை விடுகிறது. முதன்மை உரை, பழிவாங்கும் செயல் பிற இனத்தாரிடையே வெளிப்படுவதையும் வேண்டுகிறவர்கள் அதை நேரில் காண விரும்புவதையும் இயல்பாக வெளிப்படுத்துகிறது; மாற்று அமைப்பு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதத்துக்கேற்ற கண்ணியமான வேண்டுதல் நடை பயன்படுத்தப்பட்டுள்ளது. கடவுளை நோக்கி ‘உம்’ என்ற மரியாதை வடிவமும், עֲבָדֶיךָ என்பதற்கு ‘அடியார்கள்’ என்பதும் தேர்ந்தெடுக்கப்பட்டுள்ளன. ‘பிற இனத்தார்’ என்பது இச்சூழலில் அயல் தேச மக்களைக் குறிக்கிறது. பழிவாங்கும் வேண்டுதல் மென்மைப்படுத்தப்படவில்லை; அதேவேளை தமிழில் இயல்பில்லாத பெயர்ச்சொல் அடுக்கைத் தவிர்க்க ‘இரத்தத்திற்கான பழிவாங்குதல்’ என உறவு தெளிவாக்கப்பட்டுள்ளது.
