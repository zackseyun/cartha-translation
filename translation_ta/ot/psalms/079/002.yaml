  text: They have given the corpses of your servants as food to the birds of the heavens[b][a], the flesh of your faithful ones to the beasts of the earth.
translation:
  language: ta
  text: உமது ஊழியர்களின் சடலங்களை வானத்துப் பறவைகளுக்கு உணவாகவும், உமக்கு உண்மையுள்ளவர்களின்[a] சதையைப் பூமியின் காட்டு விலங்குகளுக்கு உணவாகவும் கொடுத்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உமது பரிசுத்தவான்களின்,” “உமது பக்தர்களின்,” அல்லது “உமக்கு பற்றுறுதியுள்ளவர்களின்.” எபிரேயச் சொல் கடவுளிடம் உடன்படிக்கை சார்ந்த பற்றுறுதியுடன் இருப்பவர்களைக் குறிக்கலாம்.
    reason: lexical_alternative
