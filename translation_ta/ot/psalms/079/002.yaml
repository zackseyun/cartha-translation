theological_decisions:
- issue: חֲסִידֶיךָ என்ற உடன்படிக்கை சார்ந்த அடையாளச் சொல்லின் மொழிபெயர்ப்பு
  choice: உமக்கு உண்மையுள்ளவர்கள்
  alternative: உமது பரிசுத்தவான்கள்; உமது பக்தர்கள்; உமக்கு பற்றுறுதியுள்ளவர்கள்
  rationale: இந்தச் சொல் கடவுளிடம் அன்பும் உடன்படிக்கைப் பற்றுறுதியும் கொண்டவர்களைக் குறிக்கலாம். ‘உமக்கு உண்மையுள்ளவர்கள்’ என்பது அந்த உறவுசார் பொருளை வெளிப்படுத்துகிறது; பின்னாளைய சமயத் தொழில்நுட்பப் பொருளைத் தேவையின்றி இறக்குமதி செய்யாது. பிற சாத்தியப் பொருள்கள் அடிக்குறிப்பில் காக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க கவித்துவத் தமிழ். ‘உமது’ என்ற வடிவம் கடவுளை நேரடியாக அழைக்கும் சங்கீத நடையைக் காக்கிறது. வானம்—பூமி மற்றும் சடலம்—சதை என்ற இணைநிலைகள் பாதுகாக்கப்பட்டுள்ளன; இரு அரையடிகளிலும் பொருந்தும் ‘உணவாக’ தமிழின் தெளிவுக்காக மீண்டும் வழங்கப்பட்டுள்ளது.
