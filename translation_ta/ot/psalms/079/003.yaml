  text: They have poured out their blood like water all around Jerusalem[a], and there is no one to bury them.
translation:
  language: ta
  text: அவர்களுடைய இரத்தத்தைத் தண்ணீரைப்போல் எருசலேமைச் சுற்றிலும் ஊற்றிவிட்டார்கள்[a]; அவர்களை அடக்கம் செய்ய யாரும் இல்லை.
  philosophy: optimal-equivalence
  footnotes:
