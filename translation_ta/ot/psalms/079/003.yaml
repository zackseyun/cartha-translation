lexical_decisions:
- source_word: שָׁפְכוּ
  choice: ஊற்றிவிட்டார்கள்
  rationale: שׁפך என்பதன் Qal perfect 3cp வடிவம் நிறைவுற்ற ‘ஊற்றுதல்/சிந்துதல்’ செயலைக் குறிக்கிறது. தொடர்ந்து வரும் தண்ணீர் உவமையின் காட்சித்தன்மையை ‘ஊற்றிவிட்டார்கள்’ நேரடியாகப் பேணுகிறது.
- source_word: דָמָם
  choice: அவர்களுடைய இரத்தத்தை
  rationale: דם என்பதுடன் மூன்றாம் நபர் ஆண்பால் பன்மை பின்னொட்டு இணைந்திருப்பதால் இதன் நேரடிப் பொருள் ‘அவர்களுடைய இரத்தம்.’ ‘உயிர் இரத்தம்’ என்று விளக்கமாக விரிவாக்காமல் மூலத்தின் சொற்தன்மை பேணப்பட்டுள்ளது.
- source_word: כמים
  choice: தண்ணீரைப்போல்
  rationale: כ ஒப்புமையைக் குறிக்கிறது. ‘தண்ணீரைப்போல்’ என்பது இயல்பான நவீனத் தமிழில் உவமையைத் தெளிவாகப் பேணுகிறது.
- source_word: סביבות ירושלים
  choice: எருசலேமைச் சுற்றிலும்
  rationale: סביבות ஒரு இடத்தைச் சுற்றியுள்ள பரப்பைக் குறிக்கிறது. ‘சுற்றிலும்’ என்பது எருசலேமைச் சுற்றியெங்கும் நிகழ்ந்த பரவலான அவமதிப்புக் காட்சியைத் தருகிறது.
- source_word: וְאֵין
  choice: யாரும் இல்லை
  rationale: אין இருப்பின்மையைக் குறிக்கும் எதிர்மறைச் சொல். சூழலில் அடக்கம் செய்பவர் ஒருவரும் இல்லை என்பதால் ‘யாரும் இல்லை’ இயல்பாகவும் நேரடியாகவும் அமைகிறது.
- source_word: קוֹבֵר
  choice: அடக்கம் செய்ய
  rationale: קֹבֵר என்பது ‘அடக்கம் செய்பவர்’ அல்லது ‘அடக்கம் செய்ய ஒருவர்’ என்னும் பங்கேற்பு வடிவம். தமிழில் ‘அவர்களை அடக்கம் செய்ய யாரும் இல்லை’ என்று சூழலிலுள்ள மறைமுகச் செயப்படுபொருளை வெளிப்படுத்துவது தெளிவானது.
