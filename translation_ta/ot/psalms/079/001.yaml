  text: מִזְמ֗וֹר לְ/אָ֫סָ֥ף אֱֽלֹהִ֡ים בָּ֤אוּ גוֹיִ֨ם בְּֽ/נַחֲלָתֶ֗/ךָ טִ֭מְּאוּ אֶת הֵיכַ֣ל קָדְשֶׁ֑/ךָ שָׂ֖מוּ אֶת יְרוּשָׁלִַ֣ם לְ/עִיִּֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/001.yaml
  text: A psalm of Asaph. O God[a], the nations have come into your inheritance; they have defiled your holy temple; they have made Jerusalem a heap of ruins.
translation:
  language: ta
  text: 'ஆசாப்பின் சங்கீதம்.


    தேவனே, பிறநாட்டினர் உமது சுதந்தரச் சொத்திற்குள் வந்துவிட்டனர்; உமது பரிசுத்த ஆலயத்தைத் தீட்டுப்படுத்தினர்; எருசலேமைப் பாழ்மேடுகளாக்கினர்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எருசலேமை இடிபாட்டுக் குவியல்களாக்கினர்.”
    reason: עִיִּים என்பது பாழான இடங்களையோ இடிபாடுகளின் குவியல்களையோ குறிக்கலாம்; மாற்று மொழிபெயர்ப்பு அதன் உருவகத்தை வெளிப்படையாகக் காட்டுகிறது.
lexical_decisions:
- source_word: מִזְמוֹר
  choice: சங்கீதம்
  rationale: சங்கீதத் தலைப்புகளில் வரும் வழக்கமான இலக்கிய வகைப்பெயர்; நவீனத் தமிழிலும் நன்கு அறியப்பட்ட, பொருத்தமான சொல்.
- source_word: לְאָסָף
  choice: ஆசாப்பின்
  rationale: לְ குறிக்கும் ஆசாப்புடனான தொடர்பை இயல்பான தமிழில் தெரிவிக்கிறது; தலைப்பில் உள்ள தொடர்பு ஆசிரியத்துவமா, அர்ப்பணிப்பா என்பதைக் கூடுதலாக விளக்கவில்லை.
- source_word: אֱלֹהִים
  choice: தேவனே
  rationale: இங்கு நேரடி விளி அமைப்பு இருப்பதால் ‘-ஏ’ விகுதியுடன் மொழிபெயர்க்கப்பட்டது.
- source_word: בָּאוּ גוֹיִם
  choice: பிறநாட்டினர் ... வந்துவிட்டனர்
  rationale: גּוֹיִם இச்சூழலில் படையெடுத்து வந்த அந்நிய நாடுகளின் மக்களைக் குறிக்கிறது. நிறைவுற்ற செயலின் தற்போதைய விளைவை ‘வந்துவிட்டனர்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּנַחֲלָתֶךָ
  choice: உமது சுதந்தரச் சொத்திற்குள்
  rationale: נַחֲלָה என்பதிலுள்ள உடைமை மற்றும் உடன்படிக்கை சார்ந்த சுதந்தரப் பொருளைத் தக்கவைத்து, அது நிலமா மக்களா என்று குறுக்கிக் குறிப்பிடாமல் விடுகிறது.
- source_word: טִמְּאוּ
  choice: தீட்டுப்படுத்தினர்
  rationale: வழிபாட்டுத் தூய்மையைக் கெடுத்தல் என்ற வினையின் சமயச் சூழல் சார்ந்த வலிமையைத் தக்கவைக்கிறது.
- source_word: הֵיכַל קָדְשֶׁךָ
  choice: உமது பரிசுத்த ஆலயம்
  rationale: הֵיכָל என்பதை ஆலயக் கட்டடமாகவும், קָדְשֶׁךָ என்பதை இயல்பான தமிழில் பெயரடையாகவும் வழங்குகிறது.
- source_word: שָׂמוּ אֶת־יְרוּשָׁלִַם לְעִיִּים
  choice: எருசலேமைப் பாழ்மேடுகளாக்கினர்
  rationale: שׂוּם + לְ அமைப்பின் விளைவுப்பொருளை ‘ஆக்கினர்’ தெரிவிக்கிறது; עִיִּים என்ற பன்மை வடிவத்தை ‘பாழ்மேடுகள்’ தக்கவைக்கிறது.
theological_decisions:
- issue: ‘உமது சுதந்தரச் சொத்து’ என்பதன் உடன்படிக்கை சார்ந்த பரப்பு
  choice: நிலம் அல்லது மக்கள் என்று குறிப்பாக்காமல் ‘உமது சுதந்தரச் சொத்து’ என வைத்தல்
  alternative: உமது நாட்டிற்குள் / உமது மக்களிடையே
  rationale: எபிரெயச் சொல் தேவனுக்குரிய உடைமையாகிய நிலத்தையும் மக்களையும் நினைவூட்டக்கூடிய பரந்த பொருளைக் கொண்டுள்ளது; குறிப்பாக்குவது மூலத்தின் திட்டமிட்ட பரப்பைக் குறைக்கும்.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதில் புரியும், ஆனால் புலம்பலுக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மரியாதை ஒருமை வடிவமான ‘உமது’ தேவனை நோக்கிய நேரடி உரையைத் தக்கவைக்கிறது; தொடர் வினைகளில் பன்மை எழுவாய்க்கேற்ற ‘-னர்’ வடிவம் பயன்படுத்தப்பட்டுள்ளது.
