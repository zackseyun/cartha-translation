  register: நவீன தரத் தமிழில், சாதாரண வாசகருக்கு விளங்கும் வகையிலும் சங்கீதக் கவிதைக்குரிய கண்ணியத்துடனும் அமைக்கப்பட்டது. எபிரேய இணைவரி அமைப்பை அரைப்புள்ளி மற்றும் வரிப்பிரிவால் காட்டுகிறது; ‘யாக்கோபு’ என்ற கவித்துவக் கூட்டுப்பெயரும் வன்முறையான ‘விழுங்குதல்’ உருவகமும் தக்கவைக்கப்பட்டுள்ளன.
