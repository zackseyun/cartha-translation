    text: அல்லது, “ஏனெனில், அவர்கள் யாக்கோபை அழித்துவிட்டு, அவனுடைய வாழிடத்தைப் பாழாக்கினார்கள்.” எபிரேய உரையில் முதல் வினை ஒருமையிலும், இரண்டாவது வினை பன்மையிலும் உள்ளது. “உறைவிடம்” என்பதற்கு “வாழிடம்” அல்லது “மேய்ச்சல் நிலம்” என்றும் பொருள் கொள்ளலாம்.
    reason: மாற்று விளக்கமான பன்மை வாசிப்பையும் נָוֶה என்பதன் பொருள் பரப்பையும் குறிப்பிடுகிறது; அதேவேளையில் முதன்மை உரையில் மசோரா எபிரேயத்தின் ஒருமை–பன்மை வேறுபாடு பாதுகாக்கப்படுகிறது.
