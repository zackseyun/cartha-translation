- source_word: הֵשַׁמּוּ
  choice: பாழாக்கினார்கள்
  rationale: காரணவினை வடிவம் ஒரு இடத்தை வெறுமையும் அழிவும் அடையச் செய்ததைச் சுட்டுகிறது; ‘பாழாக்கினார்கள்’ என்பது தெளிவான, இயல்பான, கவிதைக்கேற்ற தமிழ்.
theological_decisions:
- issue: ‘அவனுடைய உறைவிடம்’ என்பதன் குறிப்பு
  choice: யாக்கோபு/இஸ்ரவேல் மக்களின் வாழிடத்தைப் பொதுவாகக் குறிப்பதாக மொழிபெயர்க்கப்பட்டது.
  alternative: ஆலயம் அல்லது பரிசுத்த ஸ்தலம் மட்டும்; அல்லது நாடு முழுவதும்.
  rationale: נָוֵהוּ என்பதிலுள்ள ஒருமை ஆண்பால் பின்னொட்டு இயல்பாக யாக்கோபைச் சுட்டுகிறது. சங்கீதத்தின் பரந்த சூழலில் ஆலயம் நினைவில் இருக்கலாம்; எனினும் இச்சொற்றொடர் அதை மட்டும் கட்டாயப்படுத்தாததால் பரந்த பொருள் பாதுகாக்கப்பட்டது.
- issue: אָכַל வினையின் இலக்கண எண்ணிக்கை
  choice: சூழலில் முன் குறிப்பிடப்பட்ட தேசங்களையும் அரசுகளையும் சுட்டும் வகையில் ‘அவர்கள் ... விழுங்கினார்கள்’ என வழங்கப்பட்டது.
  alternative: மசோரா உயிர்க்குறிப்பின்படி முதலாவது வினையைச் சொல்லுக்கு நெருக்கமாக ‘அவன் விழுங்கினான்’ என வழங்குதல்.
  rationale: எபிரேயத்தில் முதலாவது வினை ஒருமையாகவும் அடுத்த வினை பன்மையாகவும் உள்ளது. முந்தைய வசனத்தின் பன்மைக் கூட்டுப்பொருளும் இவ்வசனத்தின் இரண்டாவது பன்மை வினையும் தமிழில் பன்மை எழுவாயை ஆதரிக்கின்றன; ஆயினும் மூலத்தின் இலக்கண வேறுபாடு அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்படுகிறது.
