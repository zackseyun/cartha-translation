  yaml_path: translation/ot/psalms/079/012.yaml
  text: And repay to our neighbors sevenfold into their lap the reproach with which they reproached you[b][a], O Lord.
translation:
  language: ta
  text: ஆண்டவரே, எங்கள் அயலாருக்கு, அவர்கள் உம்மை இகழ்ந்த இகழ்ச்சியை அவர்களுடைய மடியில்[a] ஏழு மடங்காகத் திருப்பிச் செலுத்தும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய உருவகத்தில், அவர்கள் உம்மை இகழ்ந்த இகழ்ச்சி அவர்களிடமே திரும்பி வந்து சேருவதைக் குறிக்கிறது.
    reason: idiom_explanation
lexical_decisions:
- source_word: וְהָשֵׁב
  choice: திருப்பிச் செலுத்தும்
  rationale: שׁוב என்பதன் ஹிஃபில் ஏவல்வடிவம், அவர்கள் செய்தது அவர்கள்மீதே திரும்புமாறு செய்வதைக் குறிக்கிறது. ‘திருப்பிச் செலுத்தும்’ என்பது பழிவாங்கும் வேண்டுதலின் வலிமையையும் ‘திரும்புதல்’ என்ற உருவகத்தையும் தக்கவைக்கிறது.
- source_word: לִשְׁכֵנֵינוּ
  choice: எங்கள் அயலார்
  rationale: שָׁכֵן என்பது அருகில் குடியிருப்பவரையோ அயலாரையோ குறிக்கிறது. சூழலில் அண்டை மக்களைக் குறிக்கக்கூடும்; ஆனால் ‘அயலார்’ என்பது எபிரெயச் சொல்லைத் தேவையின்றி குறிப்பாக்காமல் விடுகிறது.
- source_word: שִׁבְעָתַיִם
  choice: ஏழு மடங்காக
  rationale: இது ‘ஏழு முறை’ அல்லது ‘ஏழு மடங்கு’ என்ற தீவிரமான அளவைக் குறிக்கிறது. ‘ஏழு மடங்காக’ என்பது கவிதை நடையிலும் தமிழிலும் இயல்பாக உள்ளது.
- source_word: אֶל חֵיקָם
  choice: அவர்களுடைய மடியிலேயே
  rationale: חֵיק என்பது மார்புப்பகுதி அல்லது மடியைக் குறிக்கிறது. ஒருவர் செய்தது அவரிடமே வந்து சேரும் எபிரெய உருவகத்தை ‘மடியிலேயே’ தக்கவைக்கிறது.
- source_word: חֶרְפָּתָם ... חֵרְפוּךָ
  choice: அவர்கள் உம்மை இகழ்ந்த இகழ்ச்சியை
  rationale: பெயர்ச்சொல்லும் வினைச்சொல்லும் ஒரே எபிரெய வேர் சார்ந்தவை. ‘இகழ்ந்த இகழ்ச்சி’ அந்தச் சொல் தொடர்பைத் தமிழிலும் வெளிப்படுத்தி, தேவனை நோக்கிய அவமதிப்பைத் தெளிவாக்குகிறது.
- source_word: אֲדֹנָי
  choice: ஆண்டவரே
  rationale: தெய்வீகப் பட்டமான אֲדֹנָי நேரடி அழைப்பாக வருகிறது. ‘ஆண்டவரே’ என்பது நவீனத் தமிழில் மரியாதையும் சங்கீதத்துக்குரிய கண்ணியமும் கொண்ட வடிவம்.
theological_decisions:
- issue: பகைவர்களுக்கு ஏழு மடங்கு திருப்பிச் செலுத்தும்படி வேண்டுதல்
  choice: தெய்வீகப் பதிலடியைக் கோரும் நேரடியான வேண்டுதலை மென்மைப்படுத்தாமல் தக்கவைத்தல்
  alternative: இதைப் பொதுவான நீதிக்கான வேண்டுதலாகப் பொழிப்புரை செய்தல்
  rationale: மூலவசனம் அயலார் செய்த இகழ்ச்சியை அவர்கள்மீதே ஏழு மடங்காகத் திருப்பும்படி வேண்டுகிறது. ‘திருப்பிச் செலுத்தும்’ என்றும் ‘ஏழு மடங்காக’ என்றும் மொழிபெயர்ப்பது அந்த இறையியல் பதற்றத்தையும் கவிதையின் வலிமையையும் தீர்த்துவிடாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீத ஜெபத்துக்குரிய கண்ணியமான நேரடி அழைப்பு நடை பயன்படுத்தப்பட்டுள்ளது. ‘உம்மை’ மற்றும் ‘செலுத்தும்’ ஆகியவை மரியாதையான ஜெப நடையைத் தக்கவைக்கின்றன; தேவையற்ற சமயப்பிரிவு சார்ந்த சொற்கள் தவிர்க்கப்பட்டுள்ளன.
