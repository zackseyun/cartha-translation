revisions:
- from: ஆண்டவரே, எங்கள் அயலார் உம்மை இகழ்ந்த இகழ்ச்சியை ஏழு மடங்காக அவர்களுடைய மடியிலேயே[a] திருப்பிச் செலுத்தும்.
  to: ஆண்டவரே, எங்கள் அயலாருக்கு, அவர்கள் உம்மை இகழ்ந்த இகழ்ச்சியை அவர்களுடைய மடியில்[a] ஏழு மடங்காகத் திருப்பிச் செலுத்தும்.
