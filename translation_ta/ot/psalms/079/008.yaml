source:
  edition: WLC
  text: אַֽל תִּזְכָּר לָ/נוּ֮ עֲוֺנֹ֪ת רִאשֹׁ֫נִ֥ים מַ֭הֵר יְקַדְּמ֣וּ/נוּ רַחֲמֶ֑י/ךָ כִּ֖י דַלּ֣וֹנוּ מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/008.yaml
  text: Do not remember against us the iniquities of former times; let your mercies quickly come to meet us[a], for we have been brought very low.
translation:
  language: ta
  text: முற்கால அக்கிரமங்களை எங்களுக்கு எதிராக நினைவுகூராதீர்[a]; உமது இரக்கம் விரைந்து எங்களை எதிர்கொண்டு வரட்டும்; ஏனெனில் நாங்கள் மிகவும் நலிந்துபோயிருக்கிறோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘எங்கள் முன்னோர்களின் அக்கிரமங்களை’; வேறொரு சாத்தியம், ‘எங்கள் முந்தைய அக்கிரமங்களை.’ எபிரேய சொற்றொடர் காலரீதியாகத் தெளிவற்றது.
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּזְכָּר לָנוּ
  choice: எங்களுக்கு எதிராக நினைவுகூராதீர்
  rationale: வேண்டுதலில் வரும் தடைப் பொருளையும், குற்றத்தைப் பாதகமாகக் கணக்கில் வைத்திருக்கும் நீதி சார்ந்த உட்பொருளையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: עֲוֺנֹת רִאשֹׁנִים
  choice: முற்கால அக்கிரமங்கள்
  rationale: עָוֹן என்பதின் குற்றத்தன்மையை ‘அக்கிரமங்கள்’ காக்கிறது; רִאשֹׁנִים யாருடைய அக்கிரமங்கள் என்று தீர்மானிக்காமல் காலத்தைக் குறிக்கும் வகையில் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: מַהֵר יְקַדְּמוּנוּ
  choice: விரைந்து எங்களை எதிர்கொண்டு வரட்டும்
  rationale: வேண்டுதலின் அவசரத்தையும், இரக்கம் அவர்களைச் சந்திக்க முன்வரும் எபிரெய உருவகத்தையும் காக்கிறது.
- source_word: רַחֲמֶיךָ
  choice: உமது இரக்கம்
  rationale: எபிரெயத்தில் பன்மை வடிவம் இருந்தாலும், தமிழில் இயல்பான கூட்டுப்/பண்புப்பொருளாக ஒருமையில் வழங்குவது கருணையின் முழுப் பொருளைக் காக்கிறது.
- source_word: כִּי דַלּוֹנוּ מְאֹד
  choice: ஏனெனில் நாங்கள் மிகவும் நலிந்துபோயிருக்கிறோம்
  rationale: அவர்கள் கடுமையாகத் தாழ்த்தப்பட்டு, வலிமை குன்றிய தற்போதைய விளைவு நிலையைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: ‘முற்கால அக்கிரமங்கள்’ யாருடையவை என்பது
  choice: முதன்மை உரையில் ‘முற்கால அக்கிரமங்கள்’ என்று காலரீதியாகத் தெளிவில்லாமல் வைக்கப்பட்டது.
  alternative: ‘எங்கள் முன்னோர்களின் அக்கிரமங்கள்’ அல்லது ‘எங்கள் முந்தைய அக்கிரமங்கள்’.
  rationale: எபிரெய சொற்றொடர் முன்னோர்களின் குற்றங்களையோ, வேண்டுவோரின் முந்தைய குற்றங்களையோ, பொதுவாக முற்காலக் குற்றங்களையோ குறிக்கலாம்; உரை தீர்மானிக்காததை மொழிபெயர்ப்பு தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க வேண்டுதல் நடை பயன்படுத்தப்பட்டுள்ளது. ‘நினைவுகூராதீர்’ மற்றும் ‘எதிர்கொண்டு வரட்டும்’ என்பவை மூலத்தின் நீதி சார்ந்த நிழலையும் உயிருள்ள உருவகத்தையும் காக்கின்றன; அரிதான அல்லது மிகப் பழமையான சொற்கள் தவிர்க்கப்பட்டுள்ளன.
