  text: מִזְמ֗וֹר לְ/אָ֫סָ֥ף אֱֽלֹהִ֡ים בָּ֤אוּ גוֹיִ֨ם בְּֽ/נַחֲלָתֶ֗/ךָ טִ֭מְּאוּ אֶת הֵיכַ֣ל קָדְשֶׁ֑/ךָ שָׂ֖מוּ אֶת יְרוּשָׁלִַ֣ם לְ/עִיִּֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/000.yaml
  text: A psalm of Asaph. God[a], nations have come into your inheritance; they have defiled your holy temple; they have made Jerusalem into ruins.
translation:
  language: ta
  text: ஆசாப்பின் சங்கீதம். கடவுளே, வேற்றினத்தார் உமது சுதந்தரத்திற்குள் நுழைந்தார்கள்; உமது பரிசுத்த ஆலயத்தைத் தீட்டுப்படுத்தினார்கள்; எருசலேமை இடிபாடுக் குவியலாக்கினார்கள்.எ[அ]
  philosophy: optimal-equivalence
  footnotes:
  - marker: அ
    text: அல்லது, “எருசலேமை இடிபாடுகளாக்கினார்கள்.”
    reason: לְעִיִּים என்பதன் பொருள் “இடிபாடுகள்” அல்லது “இடிபாடுக் குவியல்” என அமையலாம்; மூலத்தின் சொற்சார் மாற்றுப்பொருளை இது காக்கிறது.
lexical_decisions:
- source_word: מִזְמוֹר לְאָסָף
  choice: ஆசாப்பின் சங்கீதம்
  rationale: לְ can indicate attribution, authorship, association, or dedication. The conventional concise Tamil heading preserves the Hebrew attribution without overexplaining it.
- source_word: גוֹיִם
  choice: பிற இனத்தார்
  rationale: Here the term refers to foreign peoples who invaded Jerusalem. This is clearer in modern Tamil than a wooden rendering such as 'இனங்கள்'.
- source_word: נַחֲלָתֶךָ
  choice: உமது உரிமைச் சொத்து
  rationale: The noun denotes an inherited possession or allotted property; in context it refers to what belongs specially to God, likely the land and its people, so the broad possessive sense is retained.
- source_word: הֵיכַל קָדְשֶׁךָ
  choice: உமது பரிசுத்த ஆலயம்
  rationale: הֵיכָל refers here to the temple, and קֹדֶשׁ marks it as God's holy sanctuary.
- source_word: לְעִיִּים
  choice: இடிபாடுகளின் குவியல்
  rationale: The plural noun denotes ruined heaps. This rendering conveys both devastation and the heap-like imagery naturally in Tamil.
theological_decisions:
- issue: Referent of God's inheritance
  choice: உமது உரிமைச் சொத்து
  alternative: உமது சுதந்தரம்
  rationale: The Hebrew can encompass land, people, or both. A broad expression avoids narrowing the referent while remaining natural in Tamil.
- issue: Force of the perfect verbs
  choice: நுழைந்துவிட்டார்கள்; ... தீட்டுப்படுத்தினார்கள்; ... குவியலாக்கினார்கள்
  alternative: நுழைந்தார்கள்; ... அசுத்தப்படுத்தினார்கள்; ... பாழாக்கினார்கள்
  rationale: The completed-action force and the lament's sense of an accomplished catastrophe are preserved without adding a theological interpretation.
translation_notes:
  register: நவீனத் தரத் தமிழில், புலம்பலின் நேரடியான அழைப்பையும் மூன்று தாக்கமான செயற்கூறுகளையும் காத்துள்ளோம். 'உமது' என்பது சங்கீத மொழிக்கேற்ற மரியாதைமிக்க இரண்டாம் நபர் வடிவம். தலைப்பும் வசனமும் ஒரே பதிவாக வழங்கப்பட்டுள்ளன.
