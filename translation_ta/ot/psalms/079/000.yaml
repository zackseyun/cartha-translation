- from: ஆசாப்பின் சங்கீதம். கடவுளே, பிற இனத்தார் உமது உரிமைச் சொத்திற்குள் நுழைந்துவிட்டார்கள்; உமது பரிசுத்த ஆலயத்தைத் தீட்டுப்படுத்தினார்கள்; எருசலேமை இடிபாடுகளின் குவியலாக்கினார்கள்.
