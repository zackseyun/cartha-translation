source:
  edition: WLC
  text: תָּ֤ב֣וֹא לְ/פָנֶי/ךָ֮ אֶנְקַ֪ת אָ֫סִ֥יר כְּ/גֹ֥דֶל זְרוֹעֲ/ךָ֑ ה֝וֹתֵ֗ר בְּנֵ֣י תְמוּתָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/011.yaml
  text: Let the groaning of the prisoner come before you; according to the greatness of your arm[a], preserve the children of death.
translation:
  language: ta
  text: சிறைப்பட்டவனின் பெருமூச்சு உம்முன் வரட்டும்; உமது புயத்தின் பெருவல்லமைக்கேற்ப, சாவுக்குரியவர்களை உயிரோடு காத்தருளும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்கு சொல், “சாவின் மகன்கள்”; இது மரணத்துக்கு ஆளாகியவர்களையோ சாகும்படி தீர்ப்பிடப்பட்டவர்களையோ குறிக்கும் எபிரெய மொழிவழக்கு.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּב֣וֹא
  choice: வரட்டும்
  rationale: வேண்டுதல் சூழலில் விருப்ப அல்லது மன்றாட்டு வலிமையுடன் வரும் Qal imperfect-ஐ இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לְפָנֶיךָ
  choice: உம்முன்
  rationale: தேவனுடைய முன்னிலையைச் சுட்டும் எபிரெய மொழிவழக்கைச் சுருக்கமாகவும் இயல்பாகவும் காக்கிறது.
- source_word: אֶנְקַת
  choice: பெருமூச்சு
  rationale: துயரத்தால் எழும் கேட்கக்கூடிய நெடுமூச்சு அல்லது முனகலைக் குறிக்கிறது; சங்கீதப் புலம்பலுக்கு ஏற்ற தற்போதைய தமிழ் சொல்.
- source_word: אָסִיר
  choice: சிறைப்பட்டவன்
  rationale: காவலிலோ கட்டுப்பாட்டிலோ வைக்கப்பட்ட ஒருவரைத் தெளிவாகக் குறிக்கிறது; இராணுவப் பிடிப்பை மட்டும் உணர்த்தும் சொல்லைத் தவிர்க்கிறது.
- source_word: כְּגֹדֶל
  choice: பெருவல்லமைக்கேற்ப
  rationale: כ plus גֹּדֶל காட்டும் அளவு அல்லது தரத்தின்படியான வேண்டுதலைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: זְרוֹעֲךָ
  choice: உமது புயம்
  rationale: வல்லமைக்கான எபிரெய உருவகத்தைத் தட்டையாக்காமல் உடல் உறுப்பின் உருவகமாகவே காக்கிறது.
- source_word: הוֹתֵר
  choice: உயிரோடு காத்தருளும்
  rationale: Hiphil imperative இங்கு மரணத்திலிருந்து மீதியாக இருக்கச் செய்தல், அதாவது உயிர் பிழைக்கச் செய்தல் என்ற பொருளைத் தெளிவாகத் தருகிறது; மன்றாட்டுத் தொனிக்காக ‘அருளும்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: בְּנֵי תְמוּתָה
  choice: சாவுக்குரியவர்கள்
  rationale: சொல்லுக்கு சொல் ‘சாவின் மகன்கள்’ என்ற எபிரெய மொழிவழக்கின் பொருளை—மரணத்துக்கு ஆளாகியோர் அல்லது மரணத்தை எதிர்நோக்குவோர்—தேவையற்ற தீர்மானவாத விளக்கம் இன்றி தெரிவிக்கிறது.
theological_decisions:
- issue: בְּנֵי תְמוּתָה என்பது தெய்வீகமாக முன்நியமிக்கப்பட்ட மரணத்தைக் குறிக்கிறதா அல்லது மரணத்துக்கு ஆளாகிய நிலையைக் குறிக்கிறதா
  choice: சாவுக்குரியவர்கள்
  alternative: சாவுக்கு நியமிக்கப்பட்டவர்கள்
  rationale: எபிரெய மொழிவழக்கு மரணத் தீர்ப்புக்கோ மரண ஆபத்துக்கோ உட்பட்டவர்களைக் குறிக்கலாம்; ‘நியமிக்கப்பட்டவர்கள்’ என்பது மூலத்தில் தெளிவாக இல்லாத தெய்வீக முன்நியமனத்தைச் சேர்க்கக்கூடும். தேர்ந்தெடுத்த மொழிபெயர்ப்பு அந்தத் தெளிவின்மையை காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; தேவனை நோக்கிய சங்கீத மன்றாட்டின் மாண்பைத் தக்கவைக்க ‘உம்/உமது’ மரியாதை வடிவங்களும் ‘காத்தருளும்’ என்பதும் பயன்படுத்தப்பட்டுள்ளன. ‘புயம்’ என்ற தெளிவான உருவகம் காக்கப்பட்டுள்ளது; இறுதி மொழிவழக்கு முதன்மை உரையில் பொருள்பட மொழிபெயர்க்கப்பட்டு, அதன் சொல்லுக்கு சொல் வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
