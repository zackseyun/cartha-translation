  yaml_path: translation/ot/psalms/079/013.yaml
  text: But we[a], your people and the sheep of your pasture, will give thanks to you forever[b]; from generation to generation we will recount your praise.
translation:
  language: ta
  text: ஆனால் நாங்களோ—உமது மக்களும் உமது மேய்ச்சலின் ஆடுகளுமாகிய[a] நாங்கள்—உமக்கு என்றென்றும் நன்றி செலுத்துவோம்; தலைமுறை தலைமுறையாக உமது புகழை எடுத்துரைப்போம்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உமது மேய்ச்சலின் மந்தையாகிய.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உமது புகழை அறிவிப்போம்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנַחְנוּ
  choice: ஆனால் நாங்களோ
  rationale: இணைப்புச்சொல்லுடன் வரும் தனிப்பட்ட பதிலிப்பெயர், முன்பு கூறப்பட்ட பிற இனத்தாருக்கும் அழிவுக்கும் எதிராக வழிபடும் சமூகத்தை வலியுறுத்துகிறது. ‘ஆனால் நாங்களோ’ என்பது அந்த எதிர்மறைத் தொடர்பையும் வலியுறுத்தலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: עַמְּךָ
  choice: உமது மக்கள்
  rationale: கடவுளுக்கும் இஸ்ரவேலுக்கும் உள்ள உறவைக் குறிக்கும் நேரடியான, இயல்பான மொழிபெயர்ப்பு.
- source_word: וְצֹאן מַרְעִיתֶךָ
  choice: உமது மேய்ச்சலின் ஆடுகள்
  rationale: கடவுளுடைய பராமரிப்பின்கீழ் இருக்கும் மக்களைச் சித்தரிக்கும் மேய்ப்பர் உருவகத்தை வெளிப்படையாகத் தக்கவைக்கிறது; ‘மந்தை’ என்ற கூட்டுப்பொருளும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: נוֹדֶה לְּךָ
  choice: உமக்கு ... நன்றி செலுத்துவோம்
  rationale: ידה என்பதன் ஹிபீல் வடிவம் இங்கு நன்றி செலுத்துதல் அல்லது புகழ்தல் எனப் பொருள்படலாம். அடுத்த அடியில் תְּהִלָּה ‘புகழ்’ என்று வருவதால், இரு அடிகளின் சொற்பொருள் வேறுபாட்டை ‘நன்றி செலுத்துவோம்’ காக்கிறது.
- source_word: לְעוֹלָם
  choice: என்றென்றும்
  rationale: தொடர்ந்து நீடிக்கும் காலத்தைச் சுட்டும் இயல்பான, கண்ணியமான தமிழ் சொல்.
- source_word: לְדֹר וָדֹר
  choice: தலைமுறை தலைமுறையாக
  rationale: அடுத்தடுத்து வரும் தலைமுறைகள் முழுவதிலும் தொடர்வதைத் தெரிவிக்கும் எபிரெய மரபுத்தொடருக்கு இயல்பான தமிழ் இணை.
- source_word: נְסַפֵּר
  choice: எடுத்துரைப்போம்
  rationale: ספר என்பதன் பியேல் வடிவம் விவரித்துச் சொல்லுதல், எடுத்துரைத்தல், அறிவித்தல் ஆகிய பொருள்களைத் தருகிறது. ‘எடுத்துரைப்போம்’ என்பது புகழைத் தலைமுறைதோறும் சொல்லிவருவதை வெளிப்படுத்துகிறது.
- source_word: תְּהִלָּתֶךָ
  choice: உமது புகழை
  rationale: கடவுளுக்குச் செலுத்தப்படும் புகழையோ அவரைப் பற்றிய புகழத்தக்க செய்தியையோ குறிக்கக்கூடிய சொல்லை நேரடியாகவும் அதன் சாத்தியமான விரிவைச் சுருக்காமலும் தருகிறது.
theological_decisions:
- issue: கடவுளுடைய உடன்படிக்கை மக்களுக்கான மேய்ப்பர் உருவகம்
  choice: ‘உமது மேய்ச்சலின் ஆடுகள்’ என்று உருவகத்தை வெளிப்படையாகத் தக்கவைத்தல்
  alternative: ‘உமது மேய்ச்சலின் மந்தை’
  rationale: வழிபடும் சமூகம் கடவுளுடைய மக்களாகவும் அவரது பராமரிப்பிலுள்ள ஆடுகளாகவும் அடையாளப்படுத்தப்படுகிறது. உருவகத்தைத் தக்கவைப்பது பிற்காலக் கோட்பாடுகளைச் சேர்க்காமல் மூலத்தின் மேய்ப்பர் மற்றும் உறவுச் சித்திரத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதத்திற்கேற்ற கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டது. கடவுளை நோக்கிய மரியாதைப் பன்மை வடிவங்களான ‘உமது’, ‘உமக்கு’ பயன்படுத்தப்பட்டுள்ளன. இடைக்கோடுகள் ‘நாங்கள்’ என்பதற்கான இணை விளக்கத்தைத் தெளிவாக்குகின்றன.
