base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/009.yaml
  text: Help us[a], God of our salvation, for the glory of your name[b]; deliver us and atone for our sins for your name’s sake.
translation:
  language: ta
  text: எங்கள் மீட்பின் கடவுளே, உமது பெயரின் மகிமையை முன்னிட்டு எங்களுக்கு உதவி செய்யும்; எங்களை விடுவியும்; உமது பெயருக்காக எங்கள் பாவங்களுக்குப் பரிகாரம் செய்யும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எங்கள் பாவங்களுக்காகப் பரிகாரம் ஏற்படுத்தும்.” எபிரெய வினைச்சொல் வெறும் மன்னிப்பை மட்டுமல்ல, பரிகாரம் செய்வதையும் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָזְרֵנוּ
  choice: எங்களுக்கு உதவிசெய்யும்
  rationale: முதல் நபர் பன்மை பின்னொட்டுடன் வரும் கட்டளை வடிவத்தை நேரடியான, இயல்பான தமிழில் அவசர வேண்டுதலாகக் காட்டுகிறது.
- source_word: אֱלֹהֵי יִשְׁעֵנוּ
  choice: எங்கள் மீட்பின் கடவுளே
  rationale: எபிரெயக் கூட்டுச்சொல்லின் அமைப்பைப் பேணி, மீட்பின் மூலமாகக் கடவுளைக் காட்டுகிறது; விளிப்பையும் தமிழில் தெளிவாக்குகிறது.
- source_word: עַל דְּבַר כְּבוֹד שְׁמֶךָ
  choice: உமது பெயரின் மகிமையை முன்னிட்டு
  rationale: עַל דְּבַר என்பதிலுள்ள காரணம் அல்லது செயலுக்கான அடிப்படை என்ற நுணுக்கத்தைப் பேணி, כבוד மற்றும் שם ஆகிய இரண்டையும் தனித்தனியாகக் காட்டுகிறது.
- source_word: וְהַצִּילֵנוּ
  choice: எங்களை விடுவித்து
  rationale: נצל என்பதன் ஆபத்திலிருந்து மீட்பது அல்லது விடுவிப்பது என்ற பொருளை இயல்பான சங்கீத நடையில் தருகிறது.
- source_word: וְכַפֵּר עַל
  choice: பரிகாரம் செய்யும்
  rationale: כפר என்பதிலுள்ள பாவக்குற்றத்தை நீக்கும் பரிகார நுணுக்கத்தை வெறும் ‘மன்னியும்’ என்று குறுக்காமல் பேணுகிறது.
- source_word: חַטֹּאתֵינוּ
  choice: எங்கள் பாவங்களுக்கு
  rationale: பன்மை பெயர்ச்சொல்லையும் முதல் நபர் பன்மை உடைமைப் பொருளையும் நேரடியாகக் காட்டுகிறது.
- source_word: לְמַעַן שְׁמֶךָ
  choice: உமது பெயருக்காக
  rationale: கடவுளின் பெயர், அதாவது அவரது மாண்பும் நற்பெயரும், செயலுக்கான நோக்கமாக இருப்பதைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது.
theological_decisions:
- issue: மனந்திரும்புதல் சார்ந்த வேண்டுதலில் כפר என்பதன் மொழிபெயர்ப்பு
  choice: எங்கள் பாவங்களுக்குப் பரிகாரம் செய்யும்
  alternative: எங்கள் பாவங்களை மன்னியும்
  rationale: כפר என்பது சாதாரண மன்னிப்பை விடக் கனமான பரிகார மொழியை உடையது. பின்னாளைய குறிப்பிட்ட கோட்பாட்டு செயல்முறையைச் சேர்க்காமல் அதன் இறையியல் நிறையை இத்தேர்வு பேணுகிறது.
- issue: கடவுளின் பெயரை மையமாகக் கொண்ட செயலுக்கான அடிப்படை
  choice: உமது பெயரின் மகிமையை முன்னிட்டு ... உமது பெயருக்காக
  alternative: உமது மகிமையான பெயரினிமித்தம்
  rationale: முதல் சொற்றொடரில் ‘பெயர்’ மற்றும் ‘மகிமை’ இரண்டையும் தனித்தனியாக வைத்தும், இறுதியில் பெயருக்காக என்ற மறுவிண்ணப்பத்தைப் பேணியும் உள்ளது; இதனால் மனிதத் தகுதியை அல்ல, கடவுளின் மாண்பையே வேண்டுதலின் அடிப்படையாக வசனம் வைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் மரியாதைமிக்க சங்கீத வேண்டுதல் நடை பயன்படுத்தப்பட்டுள்ளது. ‘உமது’, ‘செய்யும்’ போன்ற வடிவங்கள் dignified biblical register-ஐத் தருகின்றன; தேவையற்ற பழந்தமிழ்ச் சொற்கள் தவிர்க்கப்பட்டுள்ளன. எபிரெய மூலத்தில் உள்ள இரு ‘பெயர்’ விண்ணப்பங்களும் மறுசீரமைக்காமல் பேணப்பட்டுள்ளன.
