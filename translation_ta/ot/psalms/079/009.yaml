  to: எங்கள் மீட்பின் கடவுளே, உமது பெயரின் மகிமையை முன்னிட்டு எங்களுக்கு உதவி செய்யும்; எங்களை விடுவியும்; உமது பெயருக்காக எங்கள் பாவங்களுக்குப் பரிகாரம் செய்யும்.[a]
