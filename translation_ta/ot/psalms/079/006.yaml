base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/006.yaml
  text: Pour out your wrath on the nations that do not know you[b][a], and on the kingdoms that do not call on your name.
translation:
  language: ta
  text: உம்மை அறியாத[a] நாடுகள்மேலும், உமது பெயரைச் சொல்லி அழைக்காத[b] அரசாட்சிகள்மேலும் உமது கடுஞ்சினத்தை ஊற்றும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உம்மை ஏற்றுக்கொள்ளாத.’ எபிரேயத்தில் ‘அறிதல்’ என்பது அறிவால் தெரிந்திருப்பதை மட்டுமல்லாமல், உறவுமுறையில் ஏற்று அங்கீகரிப்பதையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘உமது பெயரைச் சொல்லி மன்றாடாத.’ ‘பெயரைச் சொல்லி அழைத்தல்’ என்ற எபிரேய மரபுத்தொடர், வேண்டுதலுடன் அழைப்பதையோ வழிபடுவதையோ குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁפֹךְ
  choice: ஊற்றும்
  rationale: கோபம் ஒரு திரவம்போல் இலக்கின்மேல் ஊற்றப்படுவது என்ற எபிரேய உருவகத்தையும், வேண்டுதல் வடிவிலான கட்டளையையும் இயல்பான தமிழில் காக்கிறது.
- source_word: חֲמָתְךָ
  choice: உமது கடுஞ்சினத்தை
  rationale: חֵמָה குறிக்கும் எரியும் தீவிரமான கோபத்தை ‘கடுஞ்சினம்’ கண்ணியமான, புரியத்தக்க தமிழில் வெளிப்படுத்துகிறது.
- source_word: הַגּוֹיִם
  choice: பிற இனத்தார்
  rationale: இங்கு இஸ்ரவேலுக்கு வெளியேயுள்ள மக்களைக் குறிக்கிறது; ‘புறவினத்தார்’ என்பதன் பிற்கால மதச்சார்ந்த ஒலியைத் தவிர்த்து, மக்கள் குழுக்களைக் குறிப்பாக வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר לֹא יְדָעוּךָ
  choice: உம்மை அறியாத
  rationale: יָדַע என்பதன் நேரடிப் பொருளைத் தக்கவைத்து, அறிவுசார் அறிதலோடு உறவுமுறை அங்கீகாரத்தையும் உள்ளடக்கக்கூடிய அதன் பரப்பைச் சுருக்காமல் விடுகிறது.
- source_word: מַמְלָכוֹת
  choice: அரசுகள்
  rationale: அரசியல் ஆட்சிப்பரப்புகளைக் குறிக்கும் சொல்லை நவீன வாசகருக்கு இயல்பாகத் தருகிறது; ‘பிற இனத்தார்’ என்பதுடன் உள்ள கவிதை இணைநிலையையும் காக்கிறது.
- source_word: אֲשֶׁר בְּשִׁמְךָ לֹא קָרָאוּ
  choice: உமது பெயரைச் சொல்லிக் கூப்பிடாத
  rationale: קרא בשם என்ற மரபுத்தொடரில் உள்ள பெயரை உச்சரித்து இறைவனை நோக்கி வேண்டுதல் அல்லது வழிபாட்டில் அழைக்கும் கருத்தைத் தெளிவாகவும், அளவுக்கு மீறி விளக்காமலும் தருகிறது.
theological_decisions:
- issue: தேவனை ‘அறிதல்’ என்பதன் இயல்பு
  choice: ‘உம்மை அறியாத’ என்று நேரடியாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘உம்மை ஏற்றுக்கொள்ளாத’ அல்லது ‘உம்மை அங்கீகரிக்காத’
  rationale: יָדַע உறவுமுறை அங்கீகாரத்தையும் குறிக்கலாம்; எனினும் அதை முதன்மை உரையில் ஒரே பொருளாகச் சுருக்காமல், எபிரேயத்தின் இறையியல் ஆழத்தையும் தெளிவின்மையையும் காக்கிறது.
- issue: தேவனுடைய பெயரை அழைப்பதன் பொருள்
  choice: ‘உமது பெயரைச் சொல்லிக் கூப்பிடாத’ என மரபுத்தொடரின் உருவம் காக்கப்பட்டது.
  alternative: ‘உம்மை நோக்கி மன்றாடாத’ அல்லது ‘உம்மை வழிபடாத’
  rationale: இந்த எபிரேய மரபுத்தொடர் மன்றாட்டையோ வழிபாட்டையோ குறிக்கலாம்; ஒரே செயற்பொருளைத் திணிக்காமல் இரு சாத்தியங்களையும் திறந்துவைக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. இறைவனை நோக்கிய ஒருமை மரியாதை வடிவங்களான ‘உம்மை/உமது’ என்பவை தொடர்ச்சியாக வைக்கப்பட்டுள்ளன; ‘கடுஞ்சினம்’ சங்கீதத்தின் தீவிரத்தையும் ‘ஊற்றும்’ மூல உருவகத்தையும் காக்கின்றன.
