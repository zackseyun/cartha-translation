  text: עַד מָ֣ה יְ֭הוָה תֶּאֱנַ֣ף לָ/נֶ֑צַח תִּבְעַ֥ר כְּמוֹ אֵ֝֗שׁ קִנְאָתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/005.yaml
  text: How long[a], O Yahweh? Will you be angry forever? Will your jealousy burn like fire?
translation:
  language: ta
  text: யாவே, எவ்வளவு காலம்? நீர் என்றென்றும் கோபமாயிருப்பீரா? உமது பொறாமை[a] நெருப்பைப்போல் எரியுமா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உமது ஆர்வம் நெருப்பைப்போல் எரியுமா?” எபிரெயச் சொல் ‘பொறாமை’ அல்லது ‘ஆர்வம்’ ஆகிய இரு பொருள்களையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד מָה
  choice: எதுவரை?
  rationale: புலம்பல் மொழியில் காலநீடிப்பைக் குறித்த அவசரமான கேள்வி; நவீனத் தமிழில் இயல்பாகவும் சுருக்கமாகவும் உள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தலைப்பாக மாற்றாமல், எபிரெய இறைப்பெயரைத் தமிழில் ஒலிபெயர்த்து வழங்குகிறது.
- source_word: תֶּאֱנַף
  choice: கோபமாயிருப்பீரா?
  rationale: אנף வேரின் கோபம் என்ற பொருளை மிகைப்படுத்தாமல் நேரடியாகத் தெரிவிக்கிறது.
- source_word: לָנֶצַח
  choice: என்றென்றும்
  rationale: இறைவனின் கோபம் முடிவில்லாமல் நீடிக்குமோ என்ற புலம்பலின் கேள்வியை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: תִּבְעַר
  choice: எரியுமா?
  rationale: எரிதலைக் குறிக்கும் வினையையும் தொடரும் நெருப்பு உவமையையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: כְּמוֹ אֵשׁ
  choice: நெருப்பைப்போல்
  rationale: மூலத்தின் நேரடியான உவமையை இயல்பான தமிழ்ச் சொல்லாக்கத்தில் தருகிறது.
- source_word: קִנְאָתֶךָ
  choice: உமது பொறாமை[a]
  rationale: கִנְאָה என்பதன் கூர்மையான உடன்படிக்கைச் சார்ந்த ‘jealousy’ பொருளை முதன்மை உரையில் தக்கவைக்கிறது; ‘வைராக்கியம்’ என்ற பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட இறைப்பெயர் நேரடியாக இருப்பதால், அதை ‘ஆண்டவர்’ என்ற பட்டமாக மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: இறைவனைச் சார்ந்த קִנְאָה என்பதன் பொருள்
  choice: பொறாமை
  alternative: வைராக்கியம்
  rationale: கோபம் மற்றும் எரியும் நெருப்பு என்ற சூழலில் ‘பொறாமை’ உடன்படிக்கை உறவின் உரிமைகோரும் தீவிரத்தைத் தக்கவைக்கிறது; சொல்லின் ‘வைராக்கியம்’ என்ற நேர்முகப் பொருளையும் அடிக்குறிப்பு மூலம் வெளிப்படையாகப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், நேரடியான புலம்பல் கேள்விகளின் தீவிரத்தையும் கவிதைச் சுருக்கத்தையும் தக்கவைக்கும் கண்ணியமான நடை. இறைவனை நோக்கிய மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது.
