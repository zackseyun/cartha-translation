translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான புலம்பல் நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய கவிதையின் இணை அமைப்பும் ‘நிந்தை—ஏளனம்—பரிகாசம்’ என்ற அவமானச் சொற்களின் அடுக்குமுறையும் பாதுகாக்கப்பட்டுள்ளன.
