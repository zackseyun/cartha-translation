source:
  edition: WLC
  text: הָיִ֣ינוּ חֶ֭רְפָּה לִ/שְׁכֵנֵ֑י/נוּ לַ֥עַג וָ֝/קֶ֗לֶס לִ/סְבִיבוֹתֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/004.yaml
  text: We have become a reproach to our neighbors[a], a mockery and derision to those around us.
translation:
  language: ta
  text: நாங்கள் எங்கள் அண்டை மக்களுக்கு நிந்தையாகவும், எங்களைச் சுற்றியிருப்பவர்களுக்கு ஏளனமும் பரிகாசமுமாகவும் ஆகியிருக்கிறோம்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָיִינוּ
  choice: ஆகியிருக்கிறோம்
  rationale: Qal perfect 1cp முந்தைய நிகழ்வுகளால் உருவான, இப்போதும் நீடிக்கும் நிலையைச் சுட்டுகிறது; ‘ஆகியிருக்கிறோம்’ நிறைவுற்ற மாற்றத்தையும் தற்போதைய விளைவையும் இயல்பாகத் தெரிவிக்கிறது.
- source_word: חֶרְפָּה
  choice: நிந்தை
  rationale: பொதுவெளியில் ஏற்படும் அவமானத்தையும் பிறருடைய இகழ்ச்சிக்கு இலக்காவதையும் குறிக்கும் பெயர்ச்சொல்; சங்கீதப் புலம்பலின் சூழலில் ‘நிந்தை’ பொருத்தமானதும் dignified ஆனதும் ஆகும்.
- source_word: לִשְׁכֵנֵינוּ
  choice: எங்கள் அண்டை மக்களுக்கு
  rationale: ל முன்னிடைச்சொல் இங்கு தொடர்பு அல்லது யாருடைய பார்வையில் என்ற உறவைச் சுட்டுகிறது; ‘அண்டை மக்கள்’ அருகிலுள்ள பிற மக்களினங்களைக் குறிக்கும் வகையில் இயல்பாக உள்ளது.
- source_word: לַעַג
  choice: ஏளனம்
  rationale: இகழ்ந்து நகைப்பதைச் சுட்டும் பெயர்ச்சொல்; எபிரெய மூலத்தின் பெயர்ச்சொல் அமைப்பையும் கவிதை இணைப்பையும் காக்கிறது.
- source_word: קֶלֶס
  choice: பரிகாசம்
  rationale: לַעַג உடன் பொருள் ஒட்டினாலும் தனியான இகழ்ச்சி அல்லது கேலிச் சொல்லை உணர்த்துகிறது; ‘பரிகாசம்’ இரண்டு சொற்களையும் ஒன்றாகக் கலக்காமல் கவிதைச் செறிவைக் காக்கிறது.
- source_word: לִסְבִיבוֹתֵינוּ
  choice: எங்களைச் சுற்றியிருப்பவர்களுக்கு
  rationale: சொல்லாட்சிப்படி சுற்றிலும் இருப்பவர்களைக் குறிக்கிறது; முந்தைய ‘அண்டை மக்கள்’ என்பதைக் காட்டிலும் விரிந்த சுற்றுப்புறக் குழுவைக் குறிக்கும் வேறுபாட்டை இது காக்கிறது.
