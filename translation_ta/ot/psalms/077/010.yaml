  text: 'Then I said[b][a], “This is my grief: the years of the right hand of the Most High.”'
translation:
  language: ta
  text: 'அப்போது நான் சொன்னேன்: “இதுவே என் துயரம்[a]—உன்னதமானவரின் வலக்கரத்தின் ஆண்டுகள்[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் பலவீனம்,” அல்லது “என் நோய்.” இங்குள்ள எபிரெயச் சொல் பொருள் காண்பதற்குக் கடினமானது; அது துன்பம், பலவீனம் அல்லது நோயைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உன்னதமானவரின் வலக்கரத்தின் மாற்றம்.” உன்னதமானவரின் வலக்கரம் மாறிவிட்டதாக இங்குள்ள எபிரெயம் கூறுகிறது என்று சிலர் புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֹמַר
  choice: அப்போது நான் சொன்னேன்
  rationale: தொடர்நிகழ்வைக் குறிக்கும் wayyiqtol வடிவம் சங்கீதக்காரரின் கூற்றை அறிமுகப்படுத்துகிறது; ‘அப்போது’ என்பது அந்தத் திருப்பத்தை இயல்பான தமிழில் தருகிறது.
- source_word: חַלּוֹתִי
  choice: என் துயரம்
  rationale: இச்சொல் பொருள் காண்பதற்குக் கடினமானது; துன்பம், பலவீனம் அல்லது நோய் ஆகியவற்றைக் குறிக்கக்கூடும். புலம்பல் சூழலில் ‘என் துயரம்’ இயல்பாகப் பொருந்துகிறது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: הִיא
  choice: இதுவே
  rationale: முன்னர் கூறப்பட்ட நிலையையோ இப்போது உணரப்பட்டதையோ சுட்டும் பெண்பால் ஒருமைச் சுட்டுப்பெயரைத் தமிழில் தெளிவாகவும் அழுத்தத்துடனும் வெளிப்படுத்துகிறது.
- source_word: שְׁנוֹת
  choice: ஆண்டுகள்
  rationale: שנה (‘ஆண்டு’) என்பதன் பன்மை இணைப்புவடிவமாகப் புரிந்துகொள்வது நேரடியான வாசிப்பு. ‘மாற்றம்’ என்ற மாற்று விளக்கம் முக்கியமானதால் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: יְמִין
  choice: வலக்கரம்
  rationale: எபிரெயக் கவிதையில் வல்லமையையும் மீட்புச் செயலையும் சுட்டும் உடல் உருவகத்தை அப்படியே காக்கும் மரபான, இயல்பான தமிழ்ச் சொல்.
- source_word: עֶלְיוֹן
  choice: உன்னதமானவர்
  rationale: இது கடவுளுக்குரிய பட்டப்பெயர்; உயர்ந்த நிலையைக் காட்டும் பொருளையும் தமிழில் நிலைபெற்ற வேதாகம நடையையும் காக்கிறது.
theological_decisions:
- issue: மிகவும் கடினமான இவ்வசனத்தின் பொருளமைப்பு
  choice: சங்கீதக்காரர் தமது தற்போதைய துயரத்தை உன்னதமானவரின் வல்லமையான செயல்களுக்குரிய கடந்த ஆண்டுகளோடு தொடர்புபடுத்திக் கூறுவதாக முதன்மை உரை அமைக்கப்பட்டுள்ளது.
  alternative: “உன்னதமானவரின் வலக்கரம் மாறிவிட்டதே—இதுவே என் துயரம்” அல்லது “இதுவே என் பலவீனம்; உன்னதமானவரின் வலக்கரத்தின் ஆண்டுகள்.”
  rationale: חלותי மற்றும் שנות ஆகிய இரு சொற்களும் பலவாறு புரிந்துகொள்ளப்படலாம். முதன்மை உரை சாத்தியமான ஒரு வாசிப்பை அளிக்கிறது; ஆனால் எபிரெயத்தில் உள்ள உண்மையான தெளிவின்மையையும் இறையியல் பதற்றத்தையும் அடிக்குறிப்புகள் மூலம் காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும், சங்கீதக் கவிதைக்கேற்ற கண்ணியத்துடனும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘வலக்கரம்,’ ‘உன்னதமானவர்’ ஆகிய உருவகமும் தெய்வீகப் பட்டப்பெயரும் பாதுகாக்கப்பட்டுள்ளன; கடினமான எபிரெயச் சொற்களின் மாற்று வாசிப்புகள் அடிக்குறிப்புகளில் வெளிப்படையாகத் தரப்பட்டுள்ளன.
