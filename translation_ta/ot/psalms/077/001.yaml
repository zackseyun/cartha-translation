  text: My voice is to God[a], and I cry out; my voice is to God[b], and he gives ear to me.
translation:
  language: ta
  text: 'கடவுளை நோக்கி என் குரலை எழுப்புகிறேன்; நான் கூக்குரலிடுகிறேன்;

    கடவுளை நோக்கி என் குரலை எழுப்புகிறேன்; அவர் எனக்குச் செவிகொடுக்கிறார்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இறுதி எபிரெய வினை வடிவம் அறிவிப்பாக, “அவர் எனக்குச் செவிகொடுக்கிறார்” அல்லது “செவிகொடுத்தார்” என்று வாசிக்கப்படுகிறது. சிலர் இதை கடவுளை நோக்கிய ஏவலாக, “எனக்குச் செவிகொடும்!” என்றும் புரிந்துகொள்கிறார்கள்.
    reason: textual_grammatical_alternative
lexical_decisions:
- source_word: קוֹלִי אֶל אֱלֹהִים
  choice: கடவுளை நோக்கி என் குரலை எழுப்புகிறேன்
  rationale: எபிரெயச் சொற்றொடர் சொற்படியாக ‘என் குரல் கடவுளை நோக்கி’ என்று வினையில்லாமல் அமைந்துள்ளது. தமிழில் இயல்பாகவும் அதன் திசைநோக்கையும் ‘என் குரல்’ என்ற கவித்துவ வலியுறுத்தலையும் காக்கவும் ‘குரலை எழுப்புகிறேன்’ என்று வெளிப்படுத்தப்பட்டுள்ளது; இருமுறை வரும் மூலச் சொற்றொடரின் இணைநிலையும் காக்கப்பட்டுள்ளது.
- source_word: וְאֶצְעָקָה
  choice: கூக்குரலிடுகிறேன்
  rationale: צעק என்பது உதவிக்காக உரத்த குரலில் அழைப்பதைக் குறிக்கிறது. இங்குள்ள கவித்துவமான தீவிரத்தை ‘கூக்குரலிடுகிறேன்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: இங்கு אֱלֹהִים ஒரே கடவுளைக் குறிக்கும் ஒருமைப் பொருளில் உள்ளது.
- source_word: וְהַאֲזִין אֵלָי
  choice: எனக்குச் செவிகொடும்
  rationale: மசோரெட்டிய உயிர்க்குறிப்புள்ள הַאֲזִין வடிவம் இயல்பாக ஆண்பால் ஒருமை ஏவலாகப் புரிகிறது. אזן கவனமாகக் கேட்பதைச் சுட்டுவதால் ‘செவிகொடும்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: இறுதி வினையின் இலக்கணப் பொருளும் கடவுளின் பதிலும்
  choice: கடவுளை நேரடியாக நோக்கி, ‘எனக்குச் செவிகொடும்!’ என்ற வேண்டுகோளாக மொழிபெயர்த்தல்
  alternative: ‘அவர் எனக்குச் செவிகொடுத்தார்’ அல்லது ‘அவர் எனக்குச் செவிகொடுப்பார்’ என்ற அறிவிப்பாகப் புரிந்துகொள்ளுதல்
  rationale: WLC-இன் הַאֲזִין என்ற உயிர்க்குறிப்புள்ள வடிவம் பொதுவாக ஏவல் வடிவமே; ‘அவர் கேட்கிறார்/கேட்டார்’ என்பதற்குரிய வழக்கமான மூன்றாம் நபர் வடிவம் இதுவல்ல. ஆயினும் பழமையான மொழிபெயர்ப்புகளிலும் மொழிபெயர்ப்பு மரபிலும் அறிவிப்பு வாசிப்பு காணப்படுவதால் அது அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சங்கீதத்திற்கேற்ற கண்ணியமான கவித்துவ நடையும் சாதாரண வாசகருக்குப் புரியும் சொற்களும் பயன்படுத்தப்பட்டுள்ளன. மூலத்தின் திரும்பக்கூறல் காக்கப்பட்டுள்ளது; தமிழின் இயல்புக்காக வினையில்லா எபிரெயத் தொடர் ‘குரலை எழுப்புகிறேன்’ எனத் தெளிவாக்கப்பட்டுள்ளது.
