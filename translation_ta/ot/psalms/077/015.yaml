lexical_decisions:
- source_word: גָּאַלְתָּ
  choice: மீட்டீர்
  rationale: גאל என்பது உறவினருக்குரிய மீட்புச் செயல், விலைகொடுத்து மீட்டல், விடுவித்தல் ஆகிய பொருள் நிழல்களைக் கொண்டது. ‘மீட்டீர்’ என்பது சங்கீதத்தின் இரட்சிப்புச் சார்ந்த நிறையைக் காத்துக்கொண்டு இயல்பான தமிழையும் தருகிறது.
- source_word: בִּזְרוֹעַ
  choice: உமது புயத்தால்
  rationale: זְרוֹעַ என்பதன் நேர்ப்பொருள் ‘புயம்/கை’; இங்கு அது தேவனுடைய வல்லமையான செயலை உருவகமாகக் குறிக்கிறது. ‘புயத்தால்’ என மொழிபெயர்ப்பது எபிரேயக் கவிதைப் படிமத்தையும் கருவிப்பொருளையும் காக்கிறது.
- source_word: עַמֶּךָ
  choice: உமது மக்கள்
  rationale: இரண்டாம் ஆண்பால் ஒருமை உடைமை விகுதியுடன் வரும் עַם என்பதன் நேரான பொருள் ‘உமது மக்கள்’.
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: בְּנֵי என்பதன் முறையான பொருள் ‘மகன்கள்’. இங்கு அது வம்சத்தாரைக் குறிக்கக்கூடும்; ஆயினும் மூலத்தின் வம்சவழிக் கூறை வெளிப்படையாகக் காக்க ‘மகன்கள்’ பயன்படுத்தப்படுகிறது.
- source_word: יַעֲקֹב
  choice: யாக்கோபு
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்பட்ட பெயர்வடிவம்.
- source_word: וְיוֹסֵף
  choice: யோசேப்பு
  rationale: பெயர் அப்படியே வைக்கப்படுகிறது; யோசேப்பு எந்தக் கோத்திரக் குழுவைச் சுட்டுகிறார் என்பதை மொழிபெயர்ப்பு தீர்மானிப்பதில்லை.
- source_word: סֶלָה
  choice: சேலா
  rationale: இதன் துல்லியமான பொருள் உறுதியில்லாததால், வழிபாட்டு அல்லது இசைக் குறியீடாக இருக்கக்கூடிய மூலச்சொல் ஒலிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: ‘யாக்கோபின் மகன்களும் யோசேப்பின் மகன்களும்’ என்ற தேசிய அடையாளம்
  choice: இரு பெயர்களையும் வெளிப்படையாக வைத்திருந்து, அவர்களை ‘உமது மக்கள்’ என்பதற்கு விளக்கமாக இணைத்தல்
  alternative: ‘இஸ்ரவேலர்’ என்று பொதுப்படுத்துதல் அல்லது ‘யோசேப்பு’ என்பதை எப்பிராயீம்–மனாசே/வடக்கு ராஜ்யம் என்று குறிப்பாக்குதல்
  rationale: எபிரேய உரை யாக்கோபையும் யோசேப்பையும் இணைக்கிறது; ஆனால் யோசேப்பின் பிரதிநிதித்துவ நோக்கத்தை விளக்கவில்லை. ஆகவே கவித்துவ, வரலாற்று, கோத்திரச் சார்ந்த தெளிவின்மை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பும் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘புயம்’ சற்றுக் கவித்துவமானதாயினும் புரிந்துகொள்ளத்தக்கது; அது மூலத்தின் ‘கை/புயம்’ என்ற படிமத்தைச் சிதைக்காமல் காக்கிறது. மரியாதை ஒருமையான ‘உமது/மீட்டீர்’ வடிவங்கள் சங்கீதத்தின் நேரடி இறைமுகப்புக்கு ஏற்றவையாக உள்ளன.
