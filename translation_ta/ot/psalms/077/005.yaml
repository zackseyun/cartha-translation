  text: חִשַּׁ֣בְתִּי יָמִ֣ים מִ/קֶּ֑דֶם שְׁ֝נ֗וֹת עוֹלָמִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/005.yaml
  text: I considered the days of old[a], the years of ages past.
translation:
  language: ta
  text: 'பண்டைய நாட்களையும்

    தொலைப் பழங்கால ஆண்டுகளையும் நினைத்துப் பார்த்தேன்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பண்டைய காலங்களின் ஆண்டுகளை.” இங்குள்ள எபிரேயச் சொல் முழுமையான நித்தியத்தைக் கட்டாயமாகக் குறிக்காமல், மிகத் தொலைவான பழங்காலத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: חִשַּׁבְתִּי
  choice: நினைத்துப் பார்த்தேன் / எண்ணிப் பார்த்தேன்
  rationale: חשׁב என்பது சிந்தித்தல், எண்ணிப் பார்த்தல், ஆராய்தல் ஆகிய பொருள்களைக் கொண்டது. சங்கீதத்தின் தன்னாய்வுச் சூழலில், வெறும் நினைவுகூருதலைவிட ஆழ்ந்து சிந்திப்பதை இச்சொற்கள் இயல்பாக வெளிப்படுத்துகின்றன; எபிரேயத்தில் ஒரே வினைச்சொல் மட்டுமே இருந்தாலும், தமிழ்க் கவிதை நடையில் இரு இணை வரிகளுக்கும் இயல்பான வினை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன.
- source_word: יָמִים
  choice: நாட்களை
  rationale: பன்மைச் சொல்லான יָמִים என்பதன் நேரான தமிழ் இணை; தொடர்ந்து வரும் காலக் குறிப்புடன் இயல்பாக அமைகிறது.
- source_word: מִקֶּדֶם
  choice: பண்டைய
  rationale: முன்னிருந்த காலம் அல்லது வெகுகாலத்துக்கு முந்தைய காலம் என்ற பொருளைச் சுருக்கமாகவும் கவிதைநயத்துடனும் தருகிறது.
- source_word: שְׁנוֹת
  choice: ஆண்டுகளை
  rationale: שָׁנָה என்பதன் இணைநிலைப் பன்மை வடிவத்தைக் கருத்தில் கொண்டு நேராக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: עוֹלָמִים
  choice: தொன்மையான
  rationale: இச்சூழலில் עוֹלָמִים என்பது முழுமையான நித்தியத்தை அவசியம் குறிக்காமல், மிகத் தொலைவான கடந்த காலத்தைச் சுட்டுகிறது. ‘தொன்மையான’ என்பது அந்தப் பழமையையும் கவிதைத் தன்மையையும் காக்கிறது.
theological_decisions:
- issue: עוֹלָמִים என்பதன் காலப் பொருள்
  choice: மிகத் தொலைவான கடந்த காலம்
  alternative: நித்தியம் அல்லது முடிவற்ற காலம்
  rationale: ‘ஆண்டுகள்’ என்பதுடன் இணைந்தும் ‘பண்டைய நாட்கள்’ என்பதற்கு இணையான கவிதை வரியாகவும் வருவதால், இங்கு பழங்காலமே முதன்மைப் பொருள்; இருப்பினும் சொல்லின் நீண்டகால நிழற்பொருள் அடிக்குறிப்பில் சுட்டப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியக்கூடிய கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரேய இணைவரிசைத் தன்மை இரண்டு வரிகளாகப் பேணப்பட்டுள்ளது.
