  text: אזכיר מַֽעַלְלֵי יָ֑הּ כִּֽי אֶזְכְּרָ֖ה מִ/קֶּ֣דֶם פִּלְאֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/011.yaml
  text: I will remember the deeds of Yah[b][a], for I will remember your wonders from of old.
translation:
  language: ta
  text: யாவின் செயல்களை நான் நினைவுகூருவேன்[a]; ஏனெனில், பண்டைக்காலத்து உமது அதிசயங்களை நான் நினைவுகூருவேன்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘யாவின் செயல்களை நான் எடுத்துரைப்பேன்.’ இவ்வினைச்சொல் நினைவுகூருதல் மட்டுமல்லாமல், நினைவுகூர்ந்து சொல்லுதல் அல்லது குறிப்பிடுதல் என்ற பொருளையும் தரலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘பண்டைய காலத்து உமது அதிசயங்களை’ அல்லது ‘மிகப் பழங்காலத்து உமது அதிசயங்களை.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אַזְכִּיר
  choice: நான் நினைவுகூருவேன்
  rationale: זכר என்பதன் ஹிஃபில் வடிவம் நினைவுகூருதல், குறிப்பிடுதல், எடுத்துரைத்தல் ஆகிய பொருள்களைத் தரலாம். அடுத்த அரையடியில் இதே வேர்ச்சொல் மீண்டும் வருவதால், திட்டமிட்ட நினைவுகூரலை வெளிப்படுத்தும் இந்த மொழிபெயர்ப்பு சொல்லடுக்கையும் இணைப்பையும் காக்கிறது.
- source_word: מַעַלְלֵי
  choice: செயல்களை
  rationale: இச்சொல் செயல்கள் அல்லது செய்கைகள் என்பதைக் குறிக்கிறது. ‘செயல்கள்’ என்பது இயல்பான நவீனத் தமிழில் கவிதைநடைக்கும் பொருந்துகிறது.
- source_word: יָהּ
  choice: யா
  rationale: இது יהוה என்ற முழு இறைப்பெயர் அல்ல; அதன் சுருக்கமான கவிதை வடிவம். ஆகவே அதன் தனித்துவத்தை மறைக்காமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: כִּי
  choice: ஆம்
  rationale: இங்கு כִּי முந்தைய கூற்றை விளக்குவதைக் காட்டிலும் வலியுறுத்தி மறுபடியும் உரைப்பதாகவும் புரிந்துகொள்ளலாம். சங்கீதத்தின் இணை அடிகளுக்கு இயல்பாக அமையும் வகையில் ‘ஆம்’ தேர்ந்தெடுக்கப்பட்டது; காரணப் பொருளும் சாத்தியம்.
- source_word: אֶזְכְּרָה
  choice: நான் நினைவுகூருவேன்
  rationale: இந்த முதலாம் நபர் வடிவம் உறுதியான தீர்மானத்தையோ விருப்பத்தையோ வெளிப்படுத்துகிறது. ‘நான் நினைவுகூருவேன்’ என்பது நவீனத் தமிழில் அந்த மனவுறுதியைத் தெளிவாகக் காட்டுகிறது.
- source_word: מִקֶּדֶם
  choice: முற்காலத்து
  rationale: இச்சொல் பண்டைய அல்லது வெகுகாலத்திற்கு முந்திய காலத்தைக் குறிக்கிறது; முழுமையான ஆதியைக் கட்டாயமாகக் குறிக்காது.
- source_word: פִּלְאֶךָ
  choice: உமது அதிசயங்களை
  rationale: פלא வியப்பூட்டும் செயல் அல்லது அதிசயத்தைக் குறிக்கிறது. எபிரெயச் சொல்லின் கூட்டு அல்லது பொதுமைப் பொருளை இயல்பான தமிழில் ‘அதிசயங்களை’ என வழங்குகிறது.
theological_decisions:
- issue: יָהּ என்ற சுருக்கமான இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யா
  alternative: ஆண்டவர்
  rationale: மூலத்தில் முழு יהוה அல்ல, அதன் சுருக்கமான கவிதை வடிவமே உள்ளது. எனவே வடிவ வேறுபாட்டைத் தக்கவைக்க ‘யா’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
- issue: כִּי என்ற இணைப்பின் உறவு
  choice: ஆம்
  alternative: ஏனெனில்
  rationale: இரண்டாம் அரையடி முதலாவது அரையடியை வலியுறுத்தி விரிவாக்குவதாக வாசிக்க முடியும். காரணத்தைச் சுட்டும் வாசிப்பும் சாத்தியமாதலால் அது முற்றிலும் நிராகரிக்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் dignified கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய இணை அடிகளில் வரும் ‘நினைவுகூருவேன்’ என்ற மறுபடிதல் திட்டமிட்டு காக்கப்பட்டுள்ளது. இறைவனைச் சுட்டும் இரண்டாம் நபர் வடிவமாக மரியாதைமிக்க ‘உமது’ பயன்படுத்தப்பட்டுள்ளது.
