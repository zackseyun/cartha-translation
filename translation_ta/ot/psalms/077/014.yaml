  terminology: ‘கடவுள்,’ ‘அதிசயங்கள்,’ and ‘வல்லமை’ are appropriate dignified terms. Respectful second-person forms are used consistently. The added note preserves ‘நாடுகள்’ as a legitimate alternative for עַמִּים without narrowing the main translation.
