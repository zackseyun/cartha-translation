  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: אַתָּ֣ה הָ֭/אֵל עֹ֣שֵׂה פֶ֑לֶא הוֹדַ֖עְתָּ בָ/עַמִּ֣ים עֻזֶּֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/014.yaml
  text: You are the God who works wonders[b][a]; you have made your strength known among the peoples.
translation:
  language: ta
  text: அதிசயங்களைச் செய்கிற கடவுள் நீரே; பல்வேறு மக்களிடையே[a] உமது வல்லமையை[b] அறியச் செய்தீர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நாடுகளிடையே” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “உமது வலிமையை” அல்லது “உமது ஆற்றலை” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵל
  choice: கடவுள்
  rationale: குறிப்புச் சுட்டுடன் வரும் எபிரெயச் சொற்றொடர் கடவுளை வலியுறுத்தி அடையாளப்படுத்துகிறது. தமிழில் “கடவுள் நீரே” என்பது அந்த வலியுறுத்தலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עֹשֵׂה
  choice: செய்கிற
  rationale: எபிரெயப் பங்கேற்பு வடிவம் கடவுளின் இயல்பான, அடையாளமான செயலைக் குறிக்கிறது; நிகழ்காலத் தொடர்பெயர் இதைப் பாதுகாக்கிறது.
- source_word: פֶלֶא
  choice: அதிசயங்களை
  rationale: ஒருமை வடிவம் இங்கு வியத்தகு செயல்களைத் தொகுப்பாகக் குறிக்கலாம். “அதிசயங்கள்” என்பது “அற்புதங்கள்” என்பதைவிட அசாதாரணமான வியத்தகு செயல்கள் என்ற பரந்த பொருளைப் பாதுகாக்கிறது.
- source_word: הוֹדַעְתָּ
  choice: தெரியப்படுத்தினீர்
  rationale: ידע என்பதன் ஹிஃபீல் வடிவத்திலுள்ள ‘அறியச் செய்தல்’ என்ற காரணவினைப் பொருளை நேரடியாகக் காட்டுகிறது.
- source_word: בָעַמִּים
  choice: மக்களினங்களிடையே
  rationale: ב என்ற முன்னிடைச்சொல்லின் ‘இடையே/மத்தியில்’ என்ற பொருளையும், עַמִּים என்பதன் பல்வேறு மக்கள் குழுக்கள் என்ற பரந்த பொருளையும் வெளிப்படுத்துகிறது.
- source_word: עֻזֶּךָ
  choice: உமது வல்லமை
  rationale: עֹז என்பதன் வலிமை, ஆற்றல், வல்லமை ஆகிய பொருள் வரம்பை “வல்லமை” இயல்பாகவும் இச்சூழலில் கடவுளின் வியத்தகு செயல்களோடு பொருந்துமாறும் தெரிவிக்கிறது.
theological_decisions:
- issue: בָעַמִּים என்பதிலுள்ள தெய்வீக வல்லமையின் வெளிப்பாட்டுப் பரப்பு
  choice: மக்களினங்களிடையே
  alternative: நாடுகளிடையே; மக்களினங்களுக்கு
  rationale: வசனம் கடவுளின் வல்லமை பல்வேறு மக்கள் குழுக்களின் மத்தியில் வெளிப்படையாக அறியப்பட்டதைக் கொண்டாடுகிறது. தேர்ந்த மொழிபெயர்ப்பு எபிரெய முன்னிடைச்சொல்லையும் பரந்த மனிதக் குழுக்களைக் குறிக்கும் சொல்லையும் பாதுகாக்கிறது; குறிப்பிட்ட பிற்கால இறையியல் திட்டத்தை இதில் புகுத்தவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. கடவுளை நோக்கிய மரியாதைப் பன்மை வினைமுற்றும் “உமது” என்ற வடிவமும் கடைப்பிடிக்கப்பட்டுள்ளன. மூலத்தில் உள்ள இரு கவிதை உறுப்புகளும் அரைப்புள்ளியால் இணைக்கப்பட்டுள்ளன.
