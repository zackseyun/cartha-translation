- from: அதிசயங்களைச் செய்கிற கடவுள் நீரே; மக்களினங்களிடையே உமது வல்லமையைத் தெரியப்படுத்தினீர்.[a]
  to: அதிசயங்களைச் செய்கிற கடவுள் நீரே; பல்வேறு மக்களிடையே[a] உமது வல்லமையை[b] அறியச் செய்தீர்.
  rationale: The revision retains the verse’s two poetic clauses, its emphatic identification of God, and the causative force of ‘made known.’ It replaces a comparatively cumbersome collective noun with an idiomatic plural expression and adds the omitted lexical alternative for ‘peoples/nations,’ with anchors placed on the relevant Tamil terms.
