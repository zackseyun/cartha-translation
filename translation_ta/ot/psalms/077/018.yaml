translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. எபிரெயக் கவிதையின் மூன்று படிமங்கள்—இடியின் முழக்கம், மின்னலின் ஒளி, பூமியின் நடுக்கம்—சுருக்கமாகவும் இயல்பாகவும் தக்கவைக்கப்பட்டுள்ளன; ‘உமது’ என்பது கடவுளை நேரடியாக விளிக்கும் மரியாதைநிலையை வெளிப்படுத்துகிறது.
