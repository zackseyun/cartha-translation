  text: ק֤וֹל רַעַמְ/ךָ֨ בַּ/גַּלְגַּ֗ל הֵאִ֣ירוּ בְרָקִ֣ים תֵּבֵ֑ל רָגְזָ֖ה וַ/תִּרְעַ֣שׁ הָ/אָֽרֶץ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/018.yaml
  text: The sound of your thunder was in the whirlwind[a]; lightning lit up the world; the earth trembled and quaked.
translation:
  language: ta
  text: 'சுழற்காற்றில்[a] உமது இடியின் முழக்கம் ஒலித்தது;

    மின்னல்கள் உலகத்தை ஒளிரச் செய்தன;

    பூமி நடுங்கி அதிர்ந்தது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சக்கரத்தில்”; எபிரெயச் சொல் சுழலும் புயலை நினைவூட்டுவதாக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֤וֹל רַעַמְךָ
  choice: உமது இடியின் முழக்கம்
  rationale: קוֹל என்பது ‘ஒலி’ அல்லது ‘குரல்’ எனப் பொருள்படும். இடியுடன் சேர்ந்து வருவதால், இயல்பான தமிழில் ‘இடியின் முழக்கம்’ என்பது செவிப்புலப் படிமத்தையும் கடவுளை நேரடியாகக் குறிக்கும் இரண்டாம் நபர் ஒருமை உடைமை விகுதியையும் தக்கவைக்கிறது.
- source_word: בַּגַּלְגַּל
  choice: சுழற்காற்றில்
  rationale: גַּלְגַּל என்பதன் அடிப்படைப் பொருள் ‘சக்கரம்’ அல்லது உருளும்/சுழலும் ஒன்று. இடி, மின்னல் ஆகிய வானிலைச் சூழலில், சுழலும் புயலைக் குறிக்கும் ‘சுழற்காற்றில்’ இயல்பானதும் படிமத்திற்கு நெருக்கமானதும் ஆகும்; சொற்பொருள் மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: הֵאִירוּ בְרָקִים
  choice: மின்னல்கள் உலகத்தை ஒளிரச் செய்தன
  rationale: הֵאִירוּ என்பது ‘ஒளியூட்டின’ என்ற காரணவினைப் பொருளுடையது; בְרָקִים பன்மை என்பதால் ‘மின்னல்கள்’ எனத் தக்கவைக்கப்பட்டது.
- source_word: תֵּבֵל
  choice: உலகத்தை
  rationale: תֵּבֵל இங்கு வாழப்படும் உலகம் அல்லது பூவுலகைக் குறிக்கிறது; பிரபஞ்ச அளவிலான இறைத்தோற்றச் சூழலுக்கு ‘உலகம்’ சுருக்கமாகவும் இயல்பாகவும் பொருந்துகிறது.
- source_word: רָגְזָה וַתִּרְעַשׁ הָאָרֶץ
  choice: பூமி நடுங்கி அதிர்ந்தது
  rationale: ரָגְזָה மற்றும் תִּרְעַשׁ ஆகிய இரு வினைகளின் வேறுபாட்டையும் கவிதைநடை தீவிரப்படுத்தலையும் ‘நடுங்கி அதிர்ந்தது’ தக்கவைக்கிறது; இச்சூழலில் הָאָרֶץ என்பது உள்ளூர் ‘நிலம்’ என்பதைவிட ‘பூமி’ எனப் பொருந்துகிறது.
