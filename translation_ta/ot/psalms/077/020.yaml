  yaml_path: translation/ot/psalms/077/020.yaml
  text: You led your people like a flock by the hand of Moses and Aaron[a][b].
translation:
  language: ta
  text: உமது மக்களை ஒரு மந்தையைப் போல மோசேயும் ஆரோனும் ஆகியோரின் கையால்[a] வழிநடத்தினீர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், ‘மோசே மற்றும் ஆரோனின் கையால்’; இது அவர்களின் வழியாக அல்லது அவர்களுடைய தலைமையின் மூலம் என்பதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָחִיתָ
  choice: வழிநடத்தினீர்
  rationale: இது இறைவனை நேரடியாக ஒருமையில் முன்னிலைப்படுத்தி அழைக்கும் வினை; மேய்ப்புச் சித்திரத்துக்கு ஏற்றவாறு நடத்திச் செல்வதைக் குறிக்கிறது.
- source_word: כַצֹּאן
  choice: ஒரு மந்தையைப் போல
  rationale: כ ஒப்புமையைக் குறிக்கிறது; צאן என்பது செம்மறியாடுகள் அல்லது வெள்ளாடுகள் அடங்கிய சிறுகால்நடைகளின் கூட்டைக் குறிக்கும் தொகுதிப்பெயர். ‘மந்தை’ கூட்டு மேய்ப்புச் சித்திரத்தை இயல்பாகப் பாதுகாக்கிறது.
- source_word: עַמֶּךָ
  choice: உமது மக்களை
  rationale: עם இங்கு இறைவனுக்குரிய உடன்படிக்கை மக்களாகிய இஸ்ரவேலைக் குறிக்கிறது; ‘உமது மக்கள்’ இயல்பானதும் பொருத்தமானதும் ஆகும்.
- source_word: בְּיַד
  choice: கையால்
  rationale: எபிரெய மொழியில் ‘கையால்’ என்பது ஒருவரின் வழியாக அல்லது அவருடைய செயலாண்மையால் நிகழ்வதைக் குறிக்கும் மரபுத்தொடர். மூல உருவகத்தைப் பாதுகாக்க இது நேரடியாக மொழிபெயர்க்கப்பட்டது.
- source_word: מֹשֶׁה וְאַהֲרֹן
  choice: மோசே, ஆரோன்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற பெயர் வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன.
theological_decisions:
- issue: மோசே மற்றும் ஆரோன் வழியாக இறைவன் மக்களை வழிநடத்திய செயற்பாடு
  choice: இறைவனே முதன்மைச் செயற்பாட்டாளர்; மோசே மற்றும் ஆரோன் அவர் பயன்படுத்திய மனித முகவர்கள்.
  alternative: இறைவன் மக்களை வழிநடத்தினார்; மோசே மற்றும் ஆரோன் வெறும் வரலாற்றுத் துணைக் குறிப்புகள்.
  rationale: வசனம் இறைவனை ஒருமை முன்னிலையில் நேரடியாக அழைத்து, பின்னர் ‘மோசே, ஆரோன் ஆகியோரின் கையால்’ என்ற கருவி/முகவர் தொடரைச் சேர்க்கிறது. இதனால் இறைச் செயலும் மனித வழிநடத்தலும் இரண்டும் குறையாமல் காக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க தமிழ்நடை. ‘உமது’, ‘வழிநடத்தினீர்’ ஆகிய வடிவங்கள் சங்கீதத்தில் இறைவனை நேரடியாக அழைக்கும் உயர்வான தொனியைத் தக்கவைக்கின்றன; அதேவேளை வாக்கியம் சாதாரண வாசகருக்கும் தெளிவாக உள்ளது.
