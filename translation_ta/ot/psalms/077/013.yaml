  text: אֱ֭לֹהִים בַּ/קֹּ֣דֶשׁ דַּרְכֶּ֑/ךָ מִי אֵ֥ל גָּ֝ד֗וֹל כֵּֽ/אלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/013.yaml
  text: God[a], your way is in holiness; who is a great god like God?
translation:
  language: ta
  text: தேவனே, உமது வழி பரிசுத்தத்தில் உள்ளது[a]; தேவனைப்போல் பெரிய தெய்வம் யார்?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உமது வழி பரிசுத்த ஸ்தலத்தில் உள்ளது.” எபிரெயச் சொற்றொடர் பரிசுத்தத்தை தேவனுடைய இயல்பு அல்லது செயலின் தளமாகவும், பரிசுத்த ஸ்தலமாகவும் குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלֹהִים
  choice: தேவனே
  rationale: அடுத்து வரும் இரண்டாம் நபர் உடைமைப் பின்னொட்டு நேரடி விளிப்பைச் சுட்டுவதால், முதல் சொல்லை விளிவேற்றுமையில் மொழிபெயர்த்துள்ளது.
- source_word: בַּקֹּדֶשׁ
  choice: பரிசுத்தத்தில்
  rationale: קֹדֶשׁ என்பது பரிசுத்தத் தன்மையையோ பரிசுத்த ஸ்தலத்தையோ குறிக்கலாம். முதன்மை உரை அதன் விரிவான, பண்புசார் பொருளைப் பேணுகிறது; இடம்சார் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: דַּרְכֶּךָ
  choice: உமது வழி
  rationale: தேவனுடைய செயல்முறையையும் அவர் செயல்படும் விதத்தையும் உள்ளடக்கக்கூடிய இயல்பான நேரடி மொழிபெயர்ப்பு.
- source_word: מִי
  choice: யார்
  rationale: ஒப்புமையை அறிமுகப்படுத்தும் வினாவாகவும் பதிலை எதிர்பாராத வலியுறுத்தல் வினாவாகவும் இயல்பாக அமைகிறது.
- source_word: אֵל
  choice: தெய்வம்
  rationale: இங்கு இஸ்ரவேலின் தேவனோடு ஒப்பிடப்படும் எந்தத் தெய்வத்தையும் குறிக்கும் பொதுப்பெயராக உள்ளது.
- source_word: גָּדוֹל
  choice: பெரிய
  rationale: எபிரெயச் சொல்லின் நேரடியான பொருளையும் வலியுறுத்தல் வினாவின் மகத்துவ உணர்வையும் பேணுகிறது.
- source_word: כֵּאלֹהִים
  choice: தேவனைப்போல்
  rationale: ஒப்புமையைக் குறிக்கும் כְּ முன்னொட்டையும், சூழலில் ஒருமைப் பொருளில் வரும் אֱלֹהִים என்பதையும் சுருக்கமாகப் பேணுகிறது.
theological_decisions:
- issue: בַּקֹּדֶשׁ என்பதன் பொருள்
  choice: தேவனுடைய வழி பரிசுத்தத்தின் வட்டத்திலும் தன்மையிலும் உள்ளது
  alternative: தேவனுடைய வழி பரிசுத்த ஸ்தலத்தில் உள்ளது
  rationale: எபிரெயச் சொற்றொடர் பண்புசார் பொருளையும் இடம்சார்/ஆலயப் பொருளையும் அனுமதிக்கிறது. முதன்மை உரை அதை பரிசுத்தத் தன்மையாகக் கொள்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் வெளிப்படையாகப் பேணப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான இறைநூல் நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. தேவனை நேரடியாக அழைக்கும் இடத்தில் “தேவனே” என்றும், ஒப்பிடப்படும் பொதுவகை தெய்வத்துக்கு “தெய்வம்” என்றும் வேறுபடுத்தப்பட்டுள்ளது.
