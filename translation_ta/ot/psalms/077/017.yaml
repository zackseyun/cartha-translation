    issue: ‘ஆம்’ is an unsuitable rendering of אַף in this poetic context.
    rationale: In contemporary Tamil, ‘ஆம்’ primarily means ‘yes’ and can sound like a reply or confirmation rather than an additive/emphatic particle linking the final colon. ‘மேலும்’ preserves the particle’s connective force without over-interpreting it.
