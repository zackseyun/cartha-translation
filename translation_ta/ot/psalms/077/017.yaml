  text: The clouds poured out water; the skies gave forth a sound; indeed[a], your arrows moved about.
translation:
  language: ta
  text: 'மேகங்கள் நீரைப் பொழிந்தன;

    வானங்கள் ஒலி எழுப்பின;

    மேலும், உமது அம்புகள்[a] அங்குமிங்கும் சென்றன.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உமது மின்னல்கள் அங்குமிங்கும் சென்றன.’ எபிரெய மூலத்தில் ‘உமது அம்புகள்’ என்று உள்ளது; இந்தப் புயல் காட்சியில் அது மின்னல்களைப் போர்ப் படிமமாகக் குறிப்பிடலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹרְמוּ מַיִם עָבוֹת
  choice: மேகங்கள் நீரைப் பொழிந்தன
  rationale: זֹרְמוּ என்பது பெருக்கெடுத்து ஓடுதல் அல்லது கொட்டுதல் என்ற வலிமையான ஓட்டத்தைக் குறிக்கிறது. புயல் சூழலில் ‘நீரைப் பொழிந்தன’ என்பது இயல்பான தமிழாகவும் மூலப்படிமத்தைத் தக்கவைத்ததாகவும் உள்ளது.
- source_word: קוֹל נָתְנוּ
  choice: ஒலி எழுப்பின
  rationale: எபிரெய மொழியின் ‘ஒலி/குரல் கொடுத்தன’ என்ற சொற்றொடரை இயல்பான தமிழில் தருகிறது; ‘இடிமுழங்கின’ என்று பொருளை முன்கூட்டியே குறுக்கிவிடவில்லை.
- source_word: שְׁחָקִים
  choice: வானங்கள்
  rationale: இச்சொல் வானங்களையோ மேகங்களையோ குறிக்கலாம். முந்தைய அடியில் עָבוֹת என்பதற்கு ‘மேகங்கள்’ பயன்படுத்தப்பட்டுள்ளதால், கவிதை இணைநிலையைத் தக்கவைக்க ‘வானங்கள்’ எனத் தரப்பட்டுள்ளது.
- source_word: אַף
  choice: ஆம்
  rationale: இங்கு இச்சொல் வலியுறுத்தும் பணியைச் செய்கிறது. ‘ஆம்’ என்பது அடுத்த படிமத்தை உச்சப்படுத்தும் இயல்பான தமிழ் கவிதைச் சொல்லாகும்.
- source_word: חֲצָצֶיךָ
  choice: உமது அம்புகள்
  rationale: சொல்லின் நேரடிப் பொருள் ‘உமது அம்புகள்.’ புயலில் அது மின்னல்களை உருவகமாகக் குறிக்கலாம்; அந்த விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: יִתְהַלָּכוּ
  choice: அங்குமிங்கும் சென்றன
  rationale: הלך என்பதன் ஹித்பயேல் வடிவம் பல திசைகளில் அல்லது அங்குமிங்கும் நகர்வதைக் குறிக்கிறது. ‘சென்றன’ என்பது அம்புகள் என்ற நேரடிப் படிமத்திற்கும் மின்னல் என்ற உருவகப் பொருளிற்கும் இடமளிக்கிறது.
theological_decisions:
- issue: இறைவெளிப்பாட்டுப் புயல் படிமத்தில் அம்புகளா, மின்னல்களா
  choice: முதன்மை உரையில் ‘உமது அம்புகள்’ என்று நேரடிப் படிமம் தக்கவைக்கப்பட்டுள்ளது.
  alternative: ‘உமது மின்னல்கள்’ அல்லது ‘உமது மின்னல் அம்புகள்’ என்று நேரடியாக விளக்கிப் பெயர்த்தல்.
  rationale: எபிரெயச் சொல் ‘அம்புகள்’ என்பதே. சூழல் மின்னலைக் குறிக்க வாய்ப்பிருந்தாலும், அந்தக் கவிதை உருவகத்தை முதன்மை உரையிலேயே தீர்த்துவிடாமல் அடிக்குறிப்பில் விளக்குவது மூலத்தின் படிமத்தையும் அதன் பொருள் வாய்ப்பையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சங்கீதக் கவிதைக்கு ஏற்ற சுருக்கமும் கண்ணியமும் பேணப்பட்டுள்ளன. ‘உமது’ என்ற வடிவம் இறைவனை நோக்கிய உயர்தர உரையாடல் நடையைத் தருகிறது; புரிதலைக் கடினப்படுத்தும் பழமையான சொற்கள் தவிர்க்கப்பட்டுள்ளன.
