source:
  edition: WLC
  text: בְּ/י֥וֹם צָרָתִ/י֮ אֲדֹנָ֪/י דָּ֫רָ֥שְׁתִּי יָדִ֤/י לַ֣יְלָה נִ֭גְּרָה וְ/לֹ֣א תָפ֑וּג מֵאֲנָ֖ה הִנָּחֵ֣ם נַפְשִֽׁ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/002.yaml
  text: In the day of my distress I sought the Lord[a]; my hand was stretched out in the night and did not grow numb; my soul refused to be comforted.
translation:
  language: ta
  text: எனக்கு நெருக்கடி ஏற்பட்ட நாளில் நான் ஆண்டவரைத் தேடினேன்; இரவில் என் கை நீட்டியிருந்தது; அது தளரவில்லை[a]. என் உள்ளம் ஆறுதல் அடைய மறுத்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இரவில் என் கை பாய்ந்தது; அது தளரவில்லை.” எபிரெயப் படிமம் புரிந்துகொள்ளக் கடினமானது; முதன்மை உரை இதை விடாமுயற்சியுடன் வேண்டுதலில் நீட்டிய கையாகப் புரிந்துகொள்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיוֹם צָרָתִי
  choice: என் நெருக்கத்தின் நாளில்
  rationale: ב plus יוֹם காலத்தைக் குறிக்கிறது; צָרָה துன்பம், நெருக்கடி, இடுக்கண் ஆகிய பொருள்களைக் கொண்டது. கவிதைத் தன்மையையும் இயல்பான நவீனத் தமிழையும் இணைக்க இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: אֲדֹנָי
  choice: ஆண்டவர்
  rationale: இங்கு இருப்பது இறைப்பெயரான יהוה அல்ல, אֲדֹנָי என்னும் பட்டம். எனவே தமிழில் இயல்பான இறைப்பட்டமான ‘ஆண்டவர்’ பயன்படுத்தப்பட்டது.
- source_word: דָּרָשְׁתִּי
  choice: நான் ... தேடினேன்
  rationale: தேவனைச் சார்ந்த சூழலில் דרשׁ அவரை நாடுதல் அல்லது தேடுதல் என்று பொருள்படும்; ‘தேடினேன்’ நேரடியும் தெளிவுமாக உள்ளது.
- source_word: יָדִי
  choice: என் கை
  rationale: எபிரெய உரை ஒருமையில் இருப்பதால் ‘கை’ என்ற ஒருமை தக்கவைக்கப்பட்டது.
- source_word: לַיְלָה נִגְּרָה וְלֹא תָפוּג
  choice: இரவில் ... தளராமல் நீட்டப்பட்டிருந்தது
  rationale: נגר என்பதன் அடிப்படைப் படிமம் பாய்தல் அல்லது ஊற்றப்படுதல்; ‘கை’ என்பதோடு இது இடைவிடாத வேண்டுதலில் நீட்டப்பட்ட கையைக் குறிக்கலாம். פוג என்பதன் தளர்தல் அல்லது ஓய்தல் என்ற பொருள் ‘தளராமல்’ என்பதில் வெளிப்படுகிறது. கடினமான மூலப் படிமம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: מֵאֲנָה הִנָּחֵם
  choice: ஆறுதல் அடைய மறுத்தது
  rationale: מאן மறுத்தலைக் குறிக்கிறது; נחם இங்கு ஆறுதல் பெறுதல் எனப் பொருள்படும். தமிழ் வாக்கியம் மூலத்தின் வலுவான மறுப்பைத் தக்கவைக்கிறது.
- source_word: נַפְשִׁי
  choice: என் உள்ளம்
  rationale: נפשׁ என்பது உயிர், தன்முழுமை அல்லது உள்ளார்ந்த ஆளுமையைக் குறிக்கலாம். ‘என் உள்ளம்’ நவீனத் தமிழில் இயல்பாக இருந்து, புலம்பலின் ஆழ்ந்த தனிப்பட்ட வேதனையையும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: אֲדֹנָי என்பதன் மொழிபெயர்ப்பு
  choice: ஆண்டவர்
  alternative: கர்த்தர்
  rationale: இது יהוה என்னும் தனிப்பெயர் அல்ல, ஆண்டுரிமையைக் குறிக்கும் אֲדֹנָי என்னும் பட்டம். ‘ஆண்டவர்’ நவீனத் தமிழில் தெளிவான பட்டமாக இருந்து, இறைப்பெயரையும் பட்டத்தையும் ஒன்றாக்காமல் காக்கிறது.
- issue: נַפְשִׁי என்பதன் மனித இயல்பு சார்ந்த பொருள்
  choice: என் உள்ளம்
  alternative: என் ஆத்துமா / நானே
  rationale: இச்சொல் தனியே பிரிந்த ஒரு மனிதக் கூறைப் பற்றிய கோட்பாட்டை கட்டாயப்படுத்தாது; இங்கு துயருறும் நபரின் உள்ளார்ந்த தன்மையைப் படிமமாகக் காட்டுகிறது. ‘என் உள்ளம்’ அந்தக் கவித்துவமான நபராக்கத்தைக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கவிதை நடையில் வடிவமைக்கப்பட்டது. ‘ஆத்துமா’ போன்ற மரபுசார் சொற்களுக்குப் பதிலாக ‘உள்ளம்’ பயன்படுத்தப்பட்டது; மூலத்தின் கடினமான கைப் படிமம் முதன்மை உரையில் இயல்பாக்கப்பட்டு, மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
