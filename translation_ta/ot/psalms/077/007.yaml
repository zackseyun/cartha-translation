    reason: יִזְנַח என்பது ‘தள்ளிவிடுதல்’ அல்லது ‘புறக்கணித்தல்’ என்ற நெருங்கிய பொருள்களில் மொழிபெயர்க்கப்படலாம்; முதன்மை உரை நிராகரிப்பின் வலிமையை நேரடியாக வெளிப்படுத்துகிறது.
lexical_decisions:
- source_word: הַלְעוֹלָמִים
  choice: என்றென்றைக்கும்
  rationale: கேள்வி உருபுடன் வரும் இச்சொற்றொடர் நீடித்த காலத்தைக் குறிக்கும் வினாவை உருவாக்குகிறது; ‘என்றென்றைக்கும்’ என்பது இயல்பான நவீனத் தமிழில் அதன் வலிமையைத் தருகிறது.
- source_word: יִזְנַח
  choice: புறக்கணித்துவிடுவாரா
  rationale: இவ்வினைச்சொல் நிராகரித்தல் அல்லது தள்ளிவிடுதல் என்ற உறவுசார் பொருளைக் கொண்டது. ‘புறக்கணித்துவிடுவாரா’ என்பது புலம்பலின் சூழலில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: אֲדֹנָי
  choice: ஆண்டவர்
  rationale: இது இறைத் தலைப்பான அதோனாய்; திருப்பெயராக அல்லாமல் தலைப்பாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְלֹא יֹסִיף ... עוֹד
  choice: இனி ஒருபோதும் ... மாட்டாரா
  rationale: மறுப்புடன் சேர்ந்த யாசஃப் மற்றும் ஓத் அமைப்பு, ஒரு செயல் இனிமேல் மீண்டும் நிகழாதோ என்ற அச்சத்தை வலியுறுத்துகிறது; இத்தமிழ் அமைப்பு அந்தப் புலம்பல் வலிமையை இயல்பாகத் தருகிறது.
- source_word: לִרְצוֹת
  choice: தயவு காட்ட
  rationale: இங்கு רצה சாதகமாக அல்லது அருளுடன் அணுகுவதைக் குறிக்கிறது; ‘தயவு காட்ட’ என்பது உறவுசார் அருள் உணர்வைத் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: אֲדֹנָי என்ற இறைத் தலைப்பை மொழிபெயர்த்தல்
  choice: ஆண்டவர்
  alternative: ஆண்டவா / கர்த்தர்
  rationale: மூலத்தில் இருப்பது அதோனாய் என்னும் தலைப்பு; YHWH என்னும் திருப்பெயர் அல்ல. ஆகவே தலைப்பாகவே மொழிபெயர்க்கப்பட்டுள்ளது. ‘ஆண்டவர்’ என்பது நவீனத் தமிழில் இயல்பாகவும் பரந்த பயன்பாட்டுடனும் உள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், புலம்பலுக்குரிய தீவிரத்தையும் இரு சொல்லாட்சிக் கேள்விகளின் அமைப்பையும் காக்கும் வகையில் மொழிபெயர்க்கப்பட்டது. மொழிநடை எளிமையானது, கண்ணியமானது, சமயப் பிரிவுசார் சொற்பயன்பாட்டைத் தவிர்ப்பது.
