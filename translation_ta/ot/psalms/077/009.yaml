lexical_decisions:
- source_word: הֲ/שָׁכַח
  choice: மறந்துவிட்டாரா?
  rationale: வினாப்பெயரிடை הֲ மற்றும் שׁכח இணைந்து வேதனையுடன் கூடிய சொல்லாட்சிக் கேள்வியை உருவாக்குகின்றன. ‘மறந்துவிட்டாரா?’ என்பது அதன் இயல்பான தமிழாக்கம்.
- source_word: חַנּוֹת
  choice: அருள்கூர
  rationale: חנן என்ற வேரின் இந்த வினையெச்ச வடிவம் அருள் அல்லது தயவு காட்டுவதைக் குறிக்கிறது. ‘அருள்கூர’ என்பது இறையருளுடன் உள்ள சொற்பொருள் தொடர்பைத் தக்கவைத்து, தமிழிலும் சுருக்கமாகவும் கண்ணியமாகவும் ஒலிக்கிறது.
- source_word: אֵל
  choice: தேவன்
  rationale: இங்கு אֵל என்பது பொதுவான இறைப்பட்டம்; திருநாமம் அல்ல. ‘தேவன்’ என்பது தெளிவான, வழக்கமான தமிழ் வேதாகமச் சொல்.
- source_word: אִם
  choice: அல்லது
  rationale: முதல் கேள்வியைத் தொடர்ந்து, אִם இணையான இரண்டாவது கேள்வியை மாற்றுக் கேள்வியாக அறிமுகப்படுத்துகிறது. ‘அல்லது’ அந்தத் தொடர்பை வெளிப்படையாகத் தக்கவைக்கிறது.
- source_word: קָפַץ
  choice: அடைத்துவிட்டாரா?
  rationale: இந்த வினை மூடுதல் அல்லது அடைத்தல் என்ற உருவகத்தைத் தருகிறது. ‘அடைத்துவிட்டாரா?’ என்பது வெறுமனே ‘வழங்காமல் வைத்தாரா?’ என்று விளக்கிவிடாமல், எபிரெய உருவகத்தைப் பாதுகாக்கிறது.
- source_word: בְּ/אַף
  choice: கோபத்தில்
  rationale: אַף என்பதன் நேர்ப்பொருள் ‘மூக்கு’; இங்கு அது கோபத்தைக் குறிக்கிறது. முன்னிடைச்சொல்லுடன் சேர்ந்து ‘கோபத்தில்’ என்பது இயல்பான தமிழாக்கம்.
- source_word: רַחֲמָיו
  choice: தமது இரக்கத்தை
  rationale: வடிவத்தில் பன்மையாக இருந்தாலும், இச்சொல் இறை இரக்கம் அல்லது கருணையைக் குறிக்கும் தொகுப்புப் பொருளுடைய கருத்துப்பெயராக வரலாம். இயல்பான தமிழுக்காக ஒருமை கருத்துப்பெயர் பயன்படுத்தப்பட்டுள்ளது; பன்மை மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: סֶלָה
  choice: சேலா
  rationale: இதன் துல்லியமான பொருள் உறுதியில்லை. ஊகித்து மொழிபெயர்ப்பதற்குப் பதிலாக, எபிரெய வழிபாட்டு அல்லது இசைக் குறிப்பை ஒலிபெயர்ப்பது தெளிவின்மையை நேர்மையாகப் பாதுகாக்கிறது.
theological_decisions:
