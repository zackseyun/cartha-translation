  choice: சங்கீதக்காரரின் வேதனையை வெளிப்படுத்தும் இரண்டு சொல்லாட்சிக் கேள்விகள்
  alternative: ‘தேவன் மறந்துவிட்டார்’ போன்ற உறுதிக் கூற்றுகள்
  rationale: வினாப்பெயரிடையும் புலம்பல் சூழலும் கேள்வி வாசிப்பையே ஆதரிக்கின்றன. உறுதிக் கூற்றுகளாக மாற்றுவது சங்கீதக்காரரின் முறையீட்டை மிகைப்படுத்தி, உரையிலுள்ள இறையியல் பதற்றத்தைத் தணித்துவிடும்.
