  text: אֶֽזְכְּרָ֥ה נְגִינָתִ֗/י בַּ֫/לָּ֥יְלָה עִם לְבָבִ֥/י אָשִׂ֑יחָה וַ/יְחַפֵּ֥שׂ רוּחִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/006.yaml
  text: I remember my song in the night[a]; with my heart I meditate[d][c][b], and my spirit searches.
translation:
  language: ta
  text: இரவில் என் பாடலை நினைவுகூர்கிறேன்[a]; என் உள்ளத்தோடு ஆழ்ந்து சிந்திக்கிறேன்[b]; என் ஆவி ஆராய்கிறது[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் இசையை” அல்லது “என் மெட்டை.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “என் உள்ளத்தோடு உரையாடுகிறேன்” அல்லது “தனக்குள் பேசுகிறேன்.” எபிரெய வினைச்சொல் ஆழ்ந்து சிந்தித்தல், பேசுதல், அல்லது தனக்குள் உரையாடுதல் ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “என் மனம்” அல்லது “என் உள்ளார்ந்த சுயம்.” இங்கு “ஆவி” என்பது சங்கீதக்காரரின் உள்ளார்ந்த சுயத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶזְכְּרָה
  choice: நினைவுகூர்கிறேன்
  rationale: זכר என்பதன் முதலாம் நபர் ஒருமை வடிவம் எதிர்கால அல்லது விருப்ப நுணுக்கத்தையும் கொள்ளக்கூடும். இங்குள்ள தன்னாய்வுச் செய்யுள் தொடரில் நிகழ்காலம் தொடர்ந்து நடைபெறும் நினைவுகூருதலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: נְגִינָתִי
  choice: என் பாடலை
  rationale: נגינה என்பது பாடல், இசை, அல்லது மெட்டு என்று பொருள்படலாம். சூழலில் ‘என் பாடல்’ இயல்பாகவும் கவிதைநயத்துடனும் உள்ளது; மற்ற சாத்தியங்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: בַּלָּיְלָה
  choice: இரவில்
  rationale: எபிரெய முன்னிடைச்சொல் தொடரைச் சுருக்கமாகவும் இயல்பான தமிழிலும் வெளிப்படுத்துகிறது.
- source_word: עִם לְבָבִי
  choice: என் உள்ளத்தோடு
  rationale: עִם என்பதன் ‘உடன்/ஓடு’ உறவைப் பேணுகிறது. לֵבָב இங்கு உடல் உறுப்பை மட்டும் அல்லாமல் மனம் அல்லது உள்ளான மனிதரைச் சுட்டுவதால் ‘உள்ளம்’ பொருத்தமானது.
- source_word: אָשִׂיחָה
  choice: உரையாடுகிறேன்
  rationale: שׂיח என்பது பேசுதல், தனக்குள் உரையாடுதல், அல்லது ஆழ்ந்து சிந்தித்தல் ஆகிய நுணுக்கங்களைக் கொள்ளும். ‘என் உள்ளத்தோடு உரையாடுகிறேன்’ என்பது עִם என்ற கட்டமைப்பையும் உள்நோக்கிய செயலையும் இயல்பாகப் பேணுகிறது; தியானித்தல் என்ற மாற்று அடிக்குறிப்பில் உள்ளது.
- source_word: וַיְחַפֵּשׂ
  choice: ஆராய்கிறது
  rationale: חפשׂ என்பதன் துருவித் தேடும் அல்லது சோதித்தறியும் பொருளை ‘ஆராய்கிறது’ வெளிப்படுத்துகிறது. வடிவம் இறந்தகாலமாகப் புரிந்துகொள்ளப்படக்கூடியதாயினும், செய்யுளின் தொடர்ந்த உள்நோக்கச் செயல்களை நிகழ்காலத்தில் வழங்குவது தமிழில் இயல்பாக உள்ளது.
- source_word: רוּחִי
  choice: என் ஆவி
  rationale: רוּחַ இங்கு காற்றையோ மூச்சையோ அல்ல, சங்கீதக்காரரின் உள்ளார்ந்த சுயத்தைச் சுட்டுகிறது. ‘ஆவி’ அதன் பரந்த மானுடவியல் பொருளைச் சுருக்காமல் பேணுகிறது.
