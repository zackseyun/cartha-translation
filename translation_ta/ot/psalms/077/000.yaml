translation_notes:
  register: நவீன நிலையான தமிழில், சுருக்கமான சங்கீதத் தலைப்பின் மரியாதையான நடையைப் பேணுகிறது. ‘இசை நடத்துநர்’ என்பது ‘பாடகர் குழுத் தலைவர்’ என்பதைக் காட்டிலும் மூலத்தின் இசைச் செயல்பாட்டை விரிவாகக் காக்கிறது. எதுத்தூன் குறித்த இசைத் தொழில்நுட்பத் தெளிவின்மையும் לְאָסָף என்பதிலுள்ள ஆசிரியத்துவம்/தொடர்பு/அர்ப்பணிப்பு என்ற பன்முகத்தன்மையும் அடிக்குறிப்புகளில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளன.
