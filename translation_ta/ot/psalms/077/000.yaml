  yaml_path: translation/ot/psalms/077/000.yaml
  text: 'For the choir director: according to Jeduthun[d][c][b][a]. A psalm of Asaph.'
translation:
  language: ta
  text: 'இசை நடத்துநருக்கு[a]: எதுத்தூன் முறைப்படி[b]. ஆசாப்பின் சங்கீதம்[c][d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இசை மேற்பார்வையாளருக்கு’ அல்லது ‘பாடகர் குழுத் தலைவருக்கு.’
    reason: lexical_alternative
  - marker: b
    text: ‘எதுத்தூன் முறைப்படி’ என்பது ஓர் இசைப்பாணி, மெட்டு, இசைக்குழு அல்லது எதுத்தூனோடு தொடர்புடைய இசை மரபைக் குறிக்கலாம்.
    reason: cultural_note
  - marker: c
    text: அல்லது, ‘ஆசாப்புக்காக’; இங்குள்ள எபிரேய முன்னொட்டு ஆசிரியத்துவம், தொடர்பு அல்லது அர்ப்பணிப்பு ஆகியவற்றில் ஒன்றைக் குறிக்கலாம்.
    reason: alternative_reading
  - marker: d
    text: இதனை ‘ஆசாப்புக்குரியது. ஒரு சங்கீதம்’ என்றும் பிரித்து மொழிபெயர்க்கலாம்.
    reason: previous_rendering
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: இசை நடத்துநருக்கு
  rationale: சங்கீதத் தலைப்புகளில் இசை நிகழ்த்துதலை மேற்பார்வையிடுபவரைக் குறிக்கும் வழக்குச் சொல். ‘இசை நடத்துநர்’ என்பது பாடகர் குழுவை மட்டும் குறுக்காமல், மூலத்தின் விரிவான இசைச் செயல்பாட்டை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: עַל
  choice: முறைப்படி
  rationale: இசைத் தலைப்புகளில் இது இடப்பொருளான ‘மேல்’ என்பதைக் காட்டிலும், ஓர் இசைமுறை, மெட்டு அல்லது நிகழ்த்தும் மரபை அறிமுகப்படுத்தக்கூடும். ‘முறைப்படி’ அந்தத் தலைப்புப் பயன்பாட்டைச் சுருக்கமாகக் காட்டுகிறது; அதன் துல்லியமான குறிப்பு அடிக்குறிப்பில் திறந்துவைக்கப்படுகிறது.
- source_word: ידיתון
  choice: எதுத்தூன்
  rationale: இது ஒருவரின் பெயராகவோ அவரோடு தொடர்புடைய இசைக் குழு அல்லது மரபின் பெயராகவோ இருக்கலாம்; எனவே மொழிபெயர்க்காமல் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: לְאָסָף
  choice: ஆசாப்பின்
  rationale: சங்கீதத் தலைப்பிலுள்ள לְ என்னும் முன்னொட்டு ஆசிரியத்துவம், தொடர்பு அல்லது அர்ப்பணிப்பு ஆகியவற்றைக் குறிக்கலாம். ‘ஆசாப்பின்’ என்பது இயல்பான சுருக்கமான தமிழ்; அது ஆசிரியத்துவத்தை மட்டுமே திட்டவட்டமாக வலியுறுத்தாமல் தொடர்புப் பொருளையும் தாங்குகிறது.
- source_word: מִזְמוֹר
  choice: சங்கீதம்
  rationale: இசைக்கருவி இசையோடு தொடர்புடைய பாடலை வகைப்படுத்தும் நிலையான வேதாகமத் தமிழ் இலக்கியச் சொல்; இங்கு தலைப்பின் பாணியையும் இயல்பாகப் பாதுகாக்கிறது.
