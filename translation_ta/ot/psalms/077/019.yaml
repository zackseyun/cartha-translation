base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/019.yaml
  text: Your way was through the sea[a], and your paths through many waters[b], yet your footprints were not known.
translation:
  language: ta
  text: 'கடலினூடாக உமது வழி இருந்தது[a];


    திரளான நீரினூடாக உமது பாதைகள் இருந்தன;


    உமது காலடிச் சுவடுகள் அறியப்படவில்லை[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடலில் உமது வழி.” எபிரெய முன்னிடைச்சொல்லை “இல்” என்றும் மொழிபெயர்க்கலாம்; இங்கு அது நீரினூடாகச் செல்லும் வழியைக் குறிப்பதாகத் தெரிகிறது.
    reason: lexical_alternative
  - marker: b
    text: “காலடிச் சுவடுகள்” என்பதை “தடங்கள்” அல்லது “அடிகள்” என்றும் மொழிபெயர்க்கலாம். “அறியப்படவில்லை” என்பது அவை காணப்படவில்லை, அடையாளம் காணப்படவில்லை, அல்லது தடமறிய முடியவில்லை என்ற பொருள் நிழல்களைத் திறந்தே வைக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיָּם
  choice: கடலின் வழியாக
  rationale: בְּ என்பதன் அடிப்படைப் பொருள் ‘இல்’ என்றாலும், ‘வழி’ என்பதோடு இங்கு கடலுக்குள் ஊடாகச் செல்லும் பாதையைச் சுட்டுகிறது. ‘கடலின் வழியாக’ என்பது நகர்வின் கருத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: דַּרְכֶּךָ
  choice: உமது வழி
  rationale: דֶּרֶךְ என்பதன் விரிவான ‘வழி/பாதை’ பொருளையும் நேரடியான, உருவகமான இரு ஒலிப்புகளையும் ‘வழி’ காக்கிறது.
- source_word: שביליך
  choice: உமது பாதைகள்
  rationale: שְׁבִיל என்பது பாதை அல்லது தடம். முதல் அடியின் ‘வழி’ என்பதோடு கவிதை இணைநிலையைப் பேண ‘பாதைகள்’ பொருத்தமானது.
- source_word: בְּמַיִם רַבִּים
  choice: பெருவெள்ளங்களின் வழியாக
  rationale: מַיִם רַבִּים என்பது சொற்பட ‘பெரும்/திரளான நீர்கள்.’ தமிழில் கவிதைநயத்துடனும் இயல்பாகவும் நீர்த்திரள்களை உணர்த்த ‘பெருவெள்ளங்கள்’ பயன்படுத்தப்படுகிறது; ‘வழியாக’ நகர்வின் இணைநிலையைப் பேணுகிறது.
- source_word: עִקְּבוֹתֶיךָ
  choice: உமது காலடித் தடங்கள்
  rationale: עִקְּבוֹת என்பது காலடிச் சுவடுகள் அல்லது தடங்கள். ‘காலடித் தடங்கள்’ கடந்து சென்ற பின் எஞ்சும் சுவடுகளின் காட்சியைத் தெளிவாகத் தருகிறது.
- source_word: לֹא נֹדָעוּ
  choice: அறியப்படவில்லை
  rationale: ידע என்பதன் நிஃபால் வடிவிலுள்ள செயப்பாட்டு அமைப்பை நேரடியாகப் பேணுகிறது; அவை காணப்படவில்லையா, அடையாளம் காணப்படவில்லையா, தடமறிய முடியவில்லையா என்பதைத் தீர்மானிக்காமல் மூலத்தின் பொருள் அகலத்தை வைத்திருக்கிறது.
theological_decisions:
- issue: யாத்திராகமக் கடல் நிகழ்வை எவ்வளவு வெளிப்படையாகக் குறிப்பிடுவது
  choice: கடலின் வழியாகச் செல்லும் இறைவனின் வழி என்ற கவிதைப் படிமத்தை மட்டும் வைத்திருத்தல்
  alternative: செங்கடல் கடத்தலை முதன்மை உரையிலேயே வெளிப்படையாகப் பெயரிடுதல்
  rationale: வசனம் நீரினூடான இறைச் செயலைத் தெளிவாக நினைவூட்டினாலும், எபிரெய உரை நிகழ்வைப் பெயரிடாமல் கவிதைப் படிமமாக வழங்குகிறது. இறைவன் செயல்பட்டும் அவரது தடங்கள் மனிதருக்கு அறியப்படாமல் இருப்பதான இறையியல் பதற்றத்தை இவ்வாறு காக்க முடிகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையுடனும் கவிதைநயத்துடனும் அமைக்கப்பட்டது. இறைவனைச் சுட்டும் இரண்டாம் நபர் உரிமை வடிவமாக ‘உமது’ பயன்படுத்தப்பட்டுள்ளது. எபிரெய இணைநிலை மூன்று அடிகளாகப் பேணப்பட்டுள்ளது; மூலத்தில் இல்லாத ‘செங்கடல்’ என்ற விளக்கம் முதன்மை உரையில் சேர்க்கப்படவில்லை.
