  text: The waters saw you[a], O God; the waters saw you and writhed[b]; even the depths trembled.
translation:
  language: ta
  text: 'நீர்த்திரள்கள் உம்மைக் கண்டன, கடவுளே;


    நீர்த்திரள்கள் உம்மைக் கண்டு துடித்தன[a];


    ஆழங்கள் கூட நடுங்கின[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வேதனையில் துடித்தன,’ ‘நெளிந்தன,’ அல்லது ‘நடுங்கின’ என்றும் மொழிபெயர்க்கலாம். எபிரெய வினை வலிப்பினால் ஏற்படும் உடல் அசைவு அல்லது பிரசவவேதனை போன்ற துடிப்பையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: ‘ஆழ்நீர்ப்பரப்புகள்’ அல்லது ‘கடலின் ஆழங்கள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் ஆழமான நீர்ப்பரப்புகளையோ அவற்றின் ஆழங்களையோ குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאוּךָ
  choice: உம்மைக் கண்டன
  rationale: רָאָה என்பதன் கால் நிறைவுவினையும் இரண்டாம் நபர் ஆண்பால் ஒருமை பின்னொட்டும் நேரடியாக ‘உம்மைக் கண்டன’ எனப் பொருள்படும். எபிரெயக் கவிதையின் வலியுறுத்தலைக் காக்க இருமுறையும் வரும் சொல்லமைப்பு தக்கவைக்கப்பட்டது.
- source_word: מַיִם
  choice: நீர்த்திரள்கள்
  rationale: מַיִם என்பது பன்மை வடிவில் வரும் ‘நீர்/நீர்ப்பரப்புகள்’ என்பதைக் குறிக்கிறது. தமிழில் இயல்பான பன்மையையும் கவிதையில் நீர் உயிருள்ளதுபோல் செயல்படும் உருவகத்தையும் வெளிப்படுத்த ‘நீர்த்திரள்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: אֱלֹהִים
  choice: கடவுளே
  rationale: இங்கு அசைநிலை அழைப்பாக இருப்பதால், தமிழின் இயல்பான விளிவேற்றுமை வடிவமான ‘கடவுளே’ பயன்படுத்தப்பட்டது.
- source_word: יָחִילוּ
  choice: துடித்தன
  rationale: חול/חיל வேரிலிருந்து வரும் இவ்வினை நடுக்கம், முறுக்கிக்கொள்ளுதல், வேதனையில் துடித்தல் அல்லது பிரசவவேதனை போன்ற அசைவைச் சுட்டலாம். அடுத்த அடியில் வரும் רגז என்பதற்கான ‘நடுங்கின’ என்பதிலிருந்து வேறுபாட்டைக் காத்து, உடல் சார்ந்த தீவிர அசைவை உணர்த்த ‘துடித்தன’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: אַף
  choice: கூட
  rationale: நீர்த்திரள்கள் மட்டுமல்ல, ஆழ்கடல்களும் எதிர்வினையாற்றின என்ற வலியுறுத்தலை இயல்பான தமிழில் ‘கூட’ வெளிப்படுத்துகிறது.
- source_word: יִרְגְּזוּ
  choice: நடுங்கின
  rationale: רגז பொதுவாக நடுங்குதல் அல்லது அதிர்தலைக் குறிக்கிறது. தெளிவான நவீனத் தமிழாகவும் முந்தைய ‘துடித்தன’ என்பதுடன் தேவையற்ற ஒரேசொல் மீளலைத் தவிர்ப்பதாகவும் ‘நடுங்கின’ உள்ளது.
- source_word: תְהֹמוֹת
  choice: ஆழ்கடல்கள்
  rationale: תְּהוֹם என்பதன் பன்மை ஆழமான நீர்ப்பரப்புகள் அல்லது கடலின் ஆழங்களைக் குறிக்கிறது. பிரபஞ்ச நீர்ப்படிமத்தை இயல்பான தமிழில் தக்கவைக்க ‘ஆழ்கடல்கள்’ தேர்ந்தெடுக்கப்பட்டது.
theological_decisions:
- issue: கடவுளுக்கு முன் நீரும் ஆழ்கடல்களும் உயிருள்ளவைபோல் எதிர்வினையாற்றுதல்
  choice: நீர்த்திரள்களும் ஆழ்கடல்களும் கடவுளின் முன்னிலையில் துடித்து நடுங்குவதாகக் கூறும் கவிதை உருவகம் அப்படியே வைக்கப்பட்டது.
  alternative: இதைச் செங்கடல் நிகழ்வை மட்டுமே குறிக்கும் நேரடி குறிப்பாகவோ, புராணக் கடல் சக்திகளுடனான போராட்டமாகவோ மொழிபெயர்ப்பிலேயே விளக்கலாம்.
  rationale: வசனம் படைப்புலகமே கடவுளின் முன்னிலையில் அதிர்வதை உருவகமாகச் சொல்கிறது. அதன் வரலாற்று அல்லது புராணக் கவிதைத் தொடர்புகளை மொழிபெயர்ப்பே தீர்மானிக்காமல், மூலத்தின் விளக்கத் திறப்பைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டு மரியாதையையும் சங்கீதக் கவிதையின் செறிவையும் இணைக்கும் நடை பயன்படுத்தப்பட்டது. கடவுளை நோக்கிய உரையில் ‘உம்மை’ என்றும் அழைப்பில் ‘கடவுளே’ என்றும் வைத்து மரியாதை காக்கப்பட்டது. எபிரெய இணைநிலைக் கவிதையின் மறுபடியும் கூறும் அமைப்பு மூன்று அடிகளாகத் தக்கவைக்கப்பட்டது.
