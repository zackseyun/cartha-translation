  text: I remember God[a], and I groan; I meditate, and my spirit grows faint[b]. Selah
translation:
  language: ta
  text: நான் கடவுளை நினைவுகூர்கிறேன்; முனகுகிறேன். ஆழ்ந்து சிந்திக்கிறேன்[a]; என் ஆவி சோர்ந்துபோகிறது[b]. சேலா.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “மனதில் எண்ணிப்பார்க்கிறேன்” அல்லது “புலம்புகிறேன்.” எபிரெய வினைச்சொல் ஆழ்ந்த சிந்தனையையோ புலம்பலை வெளிப்படுத்துவதையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது “என் ஆவி நிலைகுலைகிறது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶזְכְּרָה
  choice: நான் நினைக்கிறேன்
  rationale: முதலாம் நபர் ஒருமை வினைச்சொல்லில் நிகழ்காலம், எதிர்காலம் அல்லது விருப்ப நுணுக்கம் இருக்கலாம். புலம்பலின் உடனடி சூழலில் தொடரும் தற்போதைய செயலைத் தமிழின் நிகழ்காலம் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: இங்கு இஸ்ரவேலின் கடவுளே குறிக்கப்படுவதால் ஒருமைப் பொருளில் ‘கடவுள்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְאֶהֱמָיָה
  choice: முனகுகிறேன்
  rationale: המה இங்கு துயரத்தால் எழும் கேட்கத்தக்க உள்ளக் கலக்கத்தைக் குறிக்கிறது. ‘முனகுகிறேன்’ என்பது அந்தப் புலம்பல் ஒலியை இயல்பாகத் தருகிறது.
- source_word: אָשִׂיחָה
  choice: நான் ஆழ்ந்து சிந்திக்கிறேன்
  rationale: שיח என்பது மனதில் எண்ணிப்பார்த்தல், தியானித்தல் அல்லது புலம்பலைச் சொல்லுதல் ஆகியவற்றைக் குறிக்கலாம். நினைவு மற்றும் உள்ளச் சோர்வு ஆகிய இணைச் சூழலில் ‘ஆழ்ந்து சிந்திக்கிறேன்’ அடிப்படைப் பொருளை இயல்பாகத் தருகிறது; மற்ற சாத்தியங்கள் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளன.
- source_word: וְתִתְעַטֵּף
  choice: சோர்ந்துபோகிறது
  rationale: עטף என்பதன் Hitpael வடிவம் தளர்ந்து சோர்தல் அல்லது நெருக்கப்பட்டு நிலைகுலைதல் எனப் பொருள்படலாம். ‘என் ஆவி’ என்பதுடன் ‘சோர்ந்துபோகிறது’ உள்ளார்ந்த தளர்ச்சியைத் தெளிவாகக் காட்டுகிறது.
- source_word: רוּחִי
  choice: என் ஆவி
  rationale: רוּחַ என்பதற்கு காற்று, மூச்சு, ஆவி ஆகிய பொருள்கள் உண்டு. இந்த உள்ளார்ந்த புலம்பலில் சங்கீதக்காரரின் அகநிலையை ‘என் ஆவி’ சிறப்பாக வெளிப்படுத்துகிறது.
- source_word: סֶלָה
  choice: சேலா
  rationale: இந்தச் சொல்லின் துல்லியமான செயல்பாடு உறுதியாகத் தெரியாததால் ஊகமாக மொழிபெயர்க்காமல் ஒலிபெயர்ப்பு செய்யப்பட்டுள்ளது.
