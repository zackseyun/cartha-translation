  text: I will meditate on all your work[a], and I will ponder your deeds.
translation:
  language: ta
  text: 'உமது செயல்கள் அனைத்தையும் தியானிப்பேன்;


    உமது செய்கைகளைக் குறித்து ஆழ்ந்து சிந்திப்பேன்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உமது செய்கைகளைப் பற்றிப் பேசுவேன்.” இங்கு ‘ஆழ்ந்து சிந்திப்பேன்’ என்று மொழிபெயர்க்கப்பட்டுள்ள எபிரெய வினைச்சொல், ஆழ்ந்து சிந்தித்தல் அல்லது தியானித்தல் என்றும், பேசுதல் அல்லது உரையாடுதல் என்றும் பொருள்படலாம்; இவ்விணைவரியில் சிந்திக்கும் பொருள் பொருத்தமாகத் தோன்றுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָגִיתִי
  choice: தியானிப்பேன்
  rationale: הגה என்பதன் Qal முதல் நபர் ஒருமை வடிவம் ஆழ்ந்து எண்ணுதல் அல்லது தியானித்தலைக் குறிக்கிறது. அடுத்துவரும் இணையான வினையுடன் சேர்ந்து, உறுதியான எதிர்கால நோக்கைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְכָל
  choice: அனைத்தையும்
  rationale: சிந்தனை அல்லது பேச்சைக் குறிக்கும் வினையுடன் ב அதன் பொருளைக் குறிக்கலாம். தமிழில் ‘செயல்கள் அனைத்தையும் தியானிப்பேன்’ என்பது இயல்பாகவும் பொருள் தெளிவாகவும் உள்ளது.
- source_word: פָעֳלֶךָ
  choice: உமது செயல்கள்
  rationale: פֹּעַל என்பது செயல், வேலை அல்லது நடவடிக்கையைக் குறிக்கலாம். எபிரெயத்தில் ஒருமை கூட்டுப்பொருளில் வருவதால், இயல்பான தமிழில் பன்மையான ‘செயல்கள்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: וּבַעֲלִילוֹתֶיךָ
  choice: உமது செய்கைகளைக் குறித்து
  rationale: עֲלִילָה என்பது செய்கை அல்லது நடவடிக்கை. முதல் அடியின் ‘செயல்கள்’ என்பதுடன் கவிதை இணைநிலையை வைத்துக்கொண்டு சிறிய சொல்வேறுபாட்டையும் இது பாதுகாக்கிறது.
- source_word: אָשִׂיחָה
  choice: ஆழ்ந்து சிந்திப்பேன்
  rationale: שיח என்பது உள்ளார்ந்து சிந்தித்தல், தியானித்தல், அல்லது பேசுதல்/உரையாடுதல் ஆகிய பொருட்களைக் கொள்ளலாம். இங்குள்ள இணைநிலையில் சிந்தனைப் பொருள் பொருத்தமாக இருந்தாலும், பேச்சுப் பொருளும் உண்மையான மொழியியல் மாற்றாக அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
