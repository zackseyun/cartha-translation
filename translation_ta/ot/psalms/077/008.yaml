    rationale: “இல்லாமற்போய்விட்டதா” after “வாக்குறுதி” does not read naturally and may suggest that the promise itself has vanished rather than that it has reached its end. “முடிவுக்கு வந்துவிட்டதா” more directly renders גָּמַר and is fluent Tamil.
