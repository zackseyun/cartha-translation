source:
  edition: WLC
  text: הֶ/אָפֵ֣ס לָ/נֶ֣צַח חַסְדּ֑/וֹ גָּ֥מַר אֹ֝֗מֶר לְ/דֹ֣ר וָ/דֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/008.yaml
  text: Has his steadfast love ceased forever? Has his promise come to an end for generation after generation?[a]
translation:
  language: ta
  text: அவருடைய மாறாத அன்பு என்றென்றைக்கும் முடிந்துவிட்டதா? அவருடைய வாக்குறுதி தலைமுறை தலைமுறைக்கும் முடிவுக்கு வந்துவிட்டதா?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவருடைய சொல் தலைமுறை தலைமுறைக்கும் முடிவுக்கு வந்துவிட்டதா?”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶאָפֵס
  choice: முடிந்துவிட்டதா
  rationale: கேள்வி முன்னொட்டுடன் வரும் இச்சொல் ஏதாவது முடிவடைந்துவிட்டதா அல்லது இல்லாமற்போய்விட்டதா என்று கேட்கிறது; புலம்பலின் கூர்மையை இயல்பான தமிழில் தருகிறது.
- source_word: לָנֶצַח
  choice: என்றென்றைக்கும்
  rationale: நிரந்தரமான காலத்தைச் சுட்டும் எபிரெய வழக்கைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: חַסְדּוֹ
  choice: அவருடைய மாறாத அன்பு
  rationale: חֶסֶד என்பதிலுள்ள உண்மைப்பற்றும் நிலைத்த அன்பும் ஆகிய இரு கூறுகளையும், தேவையற்ற சமயக்குழுச் சிறப்பாக்கமின்றி, நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: גָּמַר
  choice: இல்லாமற்போய்விட்டதா
  rationale: முடிதல் அல்லது நிறுத்தப்படுதல் என்ற பொருளை, முதல் அரையடியுடன் தமிழில் தேவையற்ற சொல் மறுபடிவைத் தவிர்த்து வெளிப்படுத்துகிறது.
- source_word: אֹמֶר
  choice: வாக்குறுதி
  rationale: அடிப்படையில் ‘சொல்/உரை’ என்றாலும், இங்கு கடவுளின் நம்பத்தகுந்த உறுதிமொழியைச் சுட்டுவது சாத்தியம்; நேரடியான மாற்று அடிக்குறிப்பில் வைக்கப்படுகிறது.
- source_word: לְדֹר וָדֹר
  choice: தலைமுறை தலைமுறையாக
  rationale: தொடர்ந்து வரும் தலைமுறைகளெங்கும் என்ற மீளுருவாக்க வலிமையை இயல்பான தமிழில் காக்கிறது.
theological_decisions:
- issue: אֹמֶר என்பதை ‘சொல்’ என்று நேரடியாகவா அல்லது ‘வாக்குறுதி’ என்று சூழலுக்கேற்பவா மொழிபெயர்ப்பது
  choice: வாக்குறுதி
  alternative: சொல்
  rationale: மாறாத அன்புடன் இணையாக வருவதால் கடவுளின் உறுதியளிக்கப்பட்ட வார்த்தை என்பது சாத்தியமான பொருள். எனினும் மூலச்சொல்லின் பரந்த பொருளை மறைக்காமல் ‘சொல்’ என்ற மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியக்கூடிய கண்ணியமான புலம்பல் நடையைப் பயன்படுத்துகிறது. இரு வினாக்களின் தீவிரமும், אֹמֶר என்பதிலுள்ள ‘சொல்/வாக்குறுதி’ தெளிவின்மையும் பாதுகாக்கப்பட்டுள்ளன.
