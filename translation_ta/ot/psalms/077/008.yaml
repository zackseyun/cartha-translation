- from: அவருடைய மாறாத அன்பு என்றென்றைக்கும் முடிந்துவிட்டதா? அவருடைய வாக்குறுதி தலைமுறை தலைமுறையாக இல்லாமற்போய்விட்டதா?[a]
  to: அவருடைய மாறாத அன்பு என்றென்றைக்கும் முடிந்துவிட்டதா? அவருடைய வாக்குறுதி தலைமுறை தலைமுறைக்கும் முடிவுக்கு வந்துவிட்டதா?[a]
