  alternative: சங்கீதக்காரர் வெறுமனே தூங்காமல் இருந்ததாகப் பொதுவாகக் கூறுதல்
  rationale: எபிரெய உரையின் இரண்டாம் நபர் வினை கடவுளையே செய்பவராகக் காட்டுகிறது; அந்த பதற்றத்தை மொழிபெயர்ப்பில் நீக்கக்கூடாது.
translation_notes:
  register: நவீன தரத் தமிழில், கடவுளை நோக்கிய மரியாதைப் பன்மையைப் பயன்படுத்தியுள்ளோம். கவிதைத் தீவிரம் காக்கப்பட்டாலும் அரிதான சொற்களும் செயற்கையான சொற்சொல் மொழிபெயர்ப்பும் தவிர்க்கப்பட்டுள்ளன.
