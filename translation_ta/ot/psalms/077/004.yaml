    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நான் கலங்கியிருக்கிறேன்; பேசவில்லை.” எபிரெய வாக்கியம் பேச இயலாமையையோ, கலக்கத்தால் ஏற்பட்ட மௌனத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
