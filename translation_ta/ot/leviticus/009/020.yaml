  text: וַ/יָּשִׂ֥ימוּ אֶת הַ/חֲלָבִ֖ים עַל הֶ/חָז֑וֹת וַ/יַּקְטֵ֥ר הַ/חֲלָבִ֖ים הַ/מִּזְבֵּֽחָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/020.yaml
  text: They placed the fat pieces on the breasts[a], and he burned the fat pieces on the altar.
translation:
  language: ta
  text: அவர்கள் கொழுப்புத் துண்டுகளை மார்புப் பகுதிகளின்மேல் வைத்தார்கள்; அவன் கொழுப்புத் துண்டுகளைப் பலிபீடத்தின்மேல் எரித்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொல்லுக்குச் சொல்லாக, “அவன் கொழுப்புத் துண்டுகளைப் பலிபீடத்தின்மேல் புகையாக எழும்பச் செய்தான்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂימוּ
  choice: அவர்கள் வைத்தார்கள்
  rationale: שׂים என்பதன் இயல்பான பொருள் ‘வை/இடு’. எபிரெய உரையிலுள்ள பன்மை எழுவாயைத் தெளிவாகப் பேணுகிறது.
- source_word: הַחֲלָבִים
  choice: கொழுப்புத் துண்டுகள்
  rationale: பலிச் சடங்குச் சூழலில் חֵלֶב என்பது பலியிடுவதற்காகப் பிரித்தெடுக்கப்பட்ட கொழுப்புப் பகுதிகளைக் குறிக்கிறது; பன்மையையும் நடைமுறைச் செயலையும் இச்சொற்றொடர் வெளிப்படுத்துகிறது.
- source_word: עַל הֶחָזוֹת
  choice: மார்புப் பகுதிகளின்மேல்
  rationale: חָזֶה இங்கு பலியிடப்பட்ட விலங்கின் மார்புப் பகுதியைக் குறிக்கிறது. எபிரெய பன்மையை இயல்பான தமிழில் தெரிவிக்க ‘மார்புப் பகுதிகள்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: וַיַּקְטֵר
  choice: அவன் எரித்தான்
  rationale: ஆசாரிய பலிச் சூழலில் קטר என்பது பலிபீடத்தில் எரித்து புகையெழச் செய்வதைக் குறிக்கிறது. முதன்மை உரையில் இயல்பான ‘எரித்தான்’ பயன்படுத்தப்பட்டு, அதன் துல்லியமான புகை நுணுக்கம் அடிக்குறிப்பில் தரப்பட்டுள்ளது. எபிரெய உரையின் ஒருமை எழுவாய் பேணப்பட்டுள்ளது.
- source_word: הַמִּזְבֵּחָה
  choice: பலிபீடத்தின்மேல்
  rationale: திசைச்சுட்டு முடிவுடன் வரும் இவ்வடிவம் קטר என்ற வினையுடன் சேர்ந்து, எரித்தல் நிகழ்ந்த இடத்தைச் சுட்டுகிறது; தமிழில் ‘பலிபீடத்தின்மேல்’ என்பது இயல்பும் துல்லியமும் உடையது.
