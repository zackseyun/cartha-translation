  source_fidelity: மூல எபிரெய உரையின் பன்மை வினைச்சொல் (‘அவர்கள் வைத்தார்கள்’), கொழுப்புப் பகுதிகளின் பன்மை, மார்புப் பகுதிகள், பின்னர் வரும் ஒருமை வினைச்சொல் (‘அவன் எரித்தான்’) ஆகியவை நம்பகமாகப் பேணப்பட்டுள்ளன. קטר என்பதன் சடங்கு சார்ந்த ‘புகையாக எழும்பச் செய்தல்’ நுணுக்கம் அடிக்குறிப்பில் உரியவாறு தரப்பட்டுள்ளது.
  naturalness: நடை நவீன நிலையான தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது. ‘மார்புப் பகுதிகளின்மேல்’ என்பது சடங்கு-உடற்கூறு சூழலில் துல்லியமான, புரிந்துகொள்ளத்தக்க தெரிவாகும்.
  terminology: ‘கொழுப்புத் துண்டுகள்’ மற்றும் ‘பலிபீடம்’ ஆகியவை பலிச் சடங்கின் பொருளைத் துல்லியமாகத் தெரிவிக்கின்றன. ‘எரித்தான்’ முதன்மை உரைக்குப் பொருத்தமானது; அடிக்குறிப்பு கטר வினையின் புகை-சார்ந்த மாற்று நுணுக்கத்தை வழங்குகிறது.
