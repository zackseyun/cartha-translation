translation_notes:
  register: நவீனத் தரமான தமிழில், வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமான நடையும் பொதுவாசகர்களுக்குப் புரியும் சொற்களும் பயன்படுத்தப்பட்டுள்ளன. மூலத்தின் செயல்வரிசையும் ‘காலைத் தகனபலிக்கு மேலாக’ என்ற கூடுதல் உறவும் காக்கப்பட்டுள்ளன.
