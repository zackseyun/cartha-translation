source:
  edition: WLC
  text: וַ/יַּקְרֵב֮ אֶת הַ/מִּנְחָה֒ וַ/יְמַלֵּ֤א כַפּ/וֹ֙ מִמֶּ֔/נָּה וַ/יַּקְטֵ֖ר עַל הַ/מִּזְבֵּ֑חַ מִ/לְּ/בַ֖ד עֹלַ֥ת הַ/בֹּֽקֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/017.yaml
  text: Then he presented the grain offering[a], filled his hand from it, and burned it on the altar, besides the morning burnt offering.
translation:
  language: ta
  text: பின்பு அவன் தானியக் காணிக்கையைச் செலுத்தி, அதிலிருந்து தன் உள்ளங்கை நிறைய எடுத்தான்[a]. காலைத் தகனபலிக்கு மேலாக, அதையும் பலிபீடத்தின்மேல் எரித்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'நேர்ச்சொல் மொழிபெயர்ப்பு: “அதிலிருந்து தன் உள்ளங்கையை நிரப்பினான்.” பலிபீடத்தில் எரிப்பதற்காகத் தானியக் காணிக்கையின் ஒரு பகுதியைக் கையில் எடுப்பதைக் குறிக்கும் மரபுத்தொடர் இது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: செலுத்தி
  rationale: பலியிடும் சடங்கின் சூழலில், ‘அருகில் கொண்டுவந்தான்/முன்வைத்தான்’ என்ற எபிரெய வினையின் பொருளை இயல்பான தமிழில் ‘காணிக்கையைச் செலுத்தி’ எனத் தருகிறது.
- source_word: הַמִּנְחָה
  choice: தானியக் காணிக்கை
  rationale: லேவியராகமத்தின் பலிச்சட்டங்களில் מִנְחָה பொதுவான காணிக்கையைக் குறிக்காமல், குறிப்பாகத் தானியத்தால் செய்யப்பட்ட காணிக்கையைக் குறிக்கிறது.
- source_word: וַיְמַלֵּא כַפּוֹ מִמֶּנָּה
  choice: அதிலிருந்து தன் உள்ளங்கை நிறைய எடுத்தான்
  rationale: ‘அதிலிருந்து தன் உள்ளங்கையை நிரப்பினான்’ என்ற மூலமொழியின் உருவகத்தை இயல்பான தமிழில் காத்து, எரிப்பதற்குரிய ஒரு பகுதியை கையில் எடுத்த செயலைத் தெளிவுபடுத்துகிறது.
- source_word: וַיַּקְטֵר
  choice: எரித்தான்
  rationale: பலியிடும் சூழலில் இவ்வினை காணிக்கையைப் பலிபீடத்தில் எரித்து புகையெழச் செய்வதைக் குறிக்கிறது; ‘எரித்தான்’ என்பது சுருக்கமாகவும் தெளிவாகவும் உள்ளது.
- source_word: עַל הַמִּזְבֵּחַ
  choice: பலிபீடத்தின்மேல்
  rationale: பலியிடும் இடத்தைக் குறிக்கும் இயல்பான, நிலையான தமிழ் மொழிபெயர்ப்பு.
- source_word: מִלְּבַד
  choice: மேலாக
  rationale: இங்கு அந்தச் செயல் வழக்கமான காலைத் தகனபலியுடன் கூடுதலாகச் செய்யப்பட்டதைச் சுட்டுகிறது.
- source_word: עֹלַת הַבֹּקֶר
  choice: காலைத் தகனபலி
  rationale: עֹלָה என்பது முழுவதும் எரிக்கப்படும் நிலையான பலிவகையைக் குறிக்கிறது; ‘காலைத் தகனபலி’ அதன் நேரத்தையும் பலிவகையையும் தெளிவாகத் தருகிறது.
