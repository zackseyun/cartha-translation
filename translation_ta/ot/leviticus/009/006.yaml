id: LEV.9.6
reference: Leviticus 9:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֔ה זֶ֧ה הַ/דָּבָ֛ר אֲשֶׁר צִוָּ֥ה יְהוָ֖ה תַּעֲשׂ֑וּ וְ/יֵרָ֥א אֲלֵי/כֶ֖ם כְּב֥וֹד יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/006.yaml
  text: And Moses said[a], “This is the thing that Yahweh has commanded you to do, that the glory of Yahweh may appear to you.”
translation:
  language: ta
  text: 'மோசே கூறினார்: “யாவே கட்டளையிட்ட காரியம் இதுதான்: யாவேயின் மகிமை உங்களுக்குத் தோன்றும்படி இதைச் செய்யுங்கள்.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இதைச் செய்யுங்கள்; யாவேயின் மகிமை உங்களுக்குத் தோன்றும்.”
    reason: இறுதிக் கூறை நோக்கம் அல்லது விளைவாக அல்லாமல், இணைக்கப்பட்ட எதிர்கால வாக்குறுதியாகவும் எபிரெய மொழியில் புரிந்துகொள்ளலாம்.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: கூறினார்
  rationale: வாவ் தொடர்வினை கதைநடையை முன்னெடுக்கிறது; தமிழில் இயல்பான தொடர் உரையாக ‘கூறினார்’ போதுமானது.
- source_word: מֹשֶׁה
  choice: மோசே
  rationale: தமிழ் வேதாகம வழக்கில் நிலைபெற்ற பெயர்வடிவம்.
- source_word: זֶה הַדָּבָר
  choice: காரியம் இதுதான்
  rationale: ‘இந்தச் சொல்/காரியம்’ என்ற எபிரெய ஒருமைச் சொல்லின் குறிப்புத்தன்மையைப் பேணிக்கொண்டு, நவீனத் தமிழில் இயல்பாக உள்ளது.
- source_word: צִוָּה
  choice: கட்டளையிட்ட
  rationale: צוה அதிகாரப்பூர்வமான கட்டளையைக் குறிக்கிறது; வழிபாட்டுச் சூழலிலும் ‘கட்டளையிட்ட’ பொருத்தமானது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பட்டத்தால் மாற்றாமல், எபிரெய நான்கெழுத்து இறைப்பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: תַּעֲשׂוּ
  choice: இதைச் செய்யுங்கள்
  rationale: இரண்டாம் நபர் பன்மை வடிவத்தையும் கட்டளையின் செயற்பாட்டையும் தெளிவாக வெளிப்படுத்துகிறது; ‘இதை’ என்பது முன்சொன்ன காரியத்தைக் குறிக்கிறது.
- source_word: וְיֵרָא
  choice: தோன்றும்படி
  rationale: கட்டளையிட்ட செயலைத் தொடர்ந்து வரும் நோக்கம் அல்லது விளைவு சார்ந்த தொடர்பை இயல்பான தமிழில் தருகிறது; இணை எதிர்கால வாக்குறுதி என்ற வாசிப்பும் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: אֲלֵיכֶם
  choice: உங்களுக்குத்
  rationale: தெய்வீக வெளிப்பாட்டைப் பெறுபவர்களைக் குறிக்கும் אֶל முன்னிடைச்சொல்லின் நேரடியான தமிழ் இணை.
- source_word: כְּבוֹד יְהוָה
  choice: யாவேயின் மகிமை
  rationale: இறைவனுடைய வெளிப்படும் மாட்சியைக் குறிக்கும் construct தொடரைத் தெளிவாகவும் சுருக்கமாகவும் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது; அதனை ஒரு பட்டத்தால் மாற்றாமல் ஒலிபெயர்ப்பது மூலத்துக்கு நெருக்கமானது.
- issue: וְיֵרָא தொடங்கும் இறுதிக் கூறின் பொருள் உறவு
  choice: 'நோக்கம்/விளைவு: ‘மகிமை ... தோன்றும்படி’'
  alternative: 'இணை எதிர்காலம்/வாக்குறுதி: ‘மகிமை ... தோன்றும்’'
  rationale: கட்டளையை நிறைவேற்றுவதற்கும் தெய்வீக மகிமை வெளிப்படுவதற்கும் உள்ள தொடர்பை முதன்மை உரை காட்டுகிறது; எபிரெய வாவ் இணைப்பை நேரடியான எதிர்கால வாக்குறுதியாகவும் வாசிக்க முடிவதால் அந்த வாய்ப்பு அடிக்குறிப்பில் வைக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிமையானதாயும் கண்ணியமானதாயும் உள்ள வழிபாட்டு மொழிநடை. ‘காரியம் இதுதான்’ என்பது மூலத்தின் குறிப்புத்தன்மையைப் பேணுகிறது; வாக்கிய அமைப்பு தமிழ் வாசிப்பின் இயல்புக்காகச் சற்றே மறுவரிசைப்படுத்தப்பட்டுள்ளது.
