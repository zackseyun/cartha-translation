translation:
  language: ta
  text: ஆரோன் மார்புப் பகுதிகளையும் வலது தொடையையும் யாவேக்கு முன்பாக அசைவுக் காணிக்கையாக அசைவாட்டினார்; மோசே கட்டளையிட்டபடியே ஆரோன் செய்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֶחָזוֹת
  choice: மார்புப் பகுதிகள்
  rationale: பலியிடப்பட்ட விலங்குகளிலிருந்து ஒதுக்கப்பட்ட மார்பிறைச்சிப் பகுதிகளைச் சுட்டும் பலியியல் பன்மை; தமிழில் வெறும் ‘மார்புகள்’ என்பதைவிட ‘மார்புப் பகுதிகள்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: שׁוֹק הַיָּמִין
  choice: வலது தொடை
  rationale: שׁוֹק கால் அல்லது தொடைப் பகுதியைக் குறிக்கலாம்; பலியியல் சூழலில் மரபான, புரிந்துகொள்ளத்தக்க ‘தொடை’ பொருத்தமானது.
- source_word: הֵנִיף
  choice: அசைவாட்டினார்
  rationale: נוּף என்பதன் ஹிபீல் வடிவம் யாவேக்கு முன்பாகச் செய்யப்படும் சடங்குசார் அசைவாட்டுதலைக் குறிக்கிறது; செயலை நேரடியாகப் பாதுகாக்கிறது.
- source_word: תְּנוּפָה
  choice: அசைவாட்டும் காணிக்கையாக
  rationale: சடங்குமுறையில் அசைத்து சமர்ப்பிக்கப்படும் காணிக்கைக்கான தொழில்நுட்பப் பெயரைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: לִפְנֵי יְהוָה
  choice: யாவேக்கு முன்பாக
  rationale: לִפְנֵי என்பதன் ‘முன்பாக/சந்நிதியில்’ என்ற பொருளையும், יהוה என்ற உடன்படிக்கைப் பெயரையும் நேரடியாகக் காக்கிறது.
- source_word: כַּאֲשֶׁר צִוָּה מֹשֶׁה
  choice: மோசே கட்டளையிட்டபடியே
  rationale: ஆரோனின் செயல் மோசேயின் முந்தைய கட்டளைக்கு முற்றிலும் இணங்கியதை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: எபிரெய மூலத்தில் வரும் தனிப்பட்ட உடன்படிக்கைப் பெயரைப் பொதுப்பட்டப் பெயராக மாற்றாமல் ஒலிபெயர்த்துக் காக்கிறது.
- issue: அசைவாட்டுதலின் சடங்குசார் தன்மை
  choice: அசைவாட்டும் காணிக்கையாக அசைவாட்டினார்
  alternative: காணிக்கையாகச் செலுத்தினார்
  rationale: வினைச்சொல் הֵנִיף மற்றும் பெயர்ச்சொல் תְּנוּפָה ஆகிய இரண்டையும் வெளிப்படையாகப் பாதுகாத்து, மூலத்தின் சடங்குசார் மீளுரைப்பை மறைக்காமல் வைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் கண்ணியமான பலியியல் சொற்கள் பயன்படுத்தப்பட்டுள்ளன. மூலத்தின் வினை–பெயர் மீளுரை நோக்கத்துடன் பாதுகாக்கப்பட்டுள்ளது.
