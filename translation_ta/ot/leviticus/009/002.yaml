  text: וַ/יֹּ֣אמֶר אֶֽל אַהֲרֹ֗ן קַח לְ֠/ךָ עֵ֣גֶל בֶּן בָּקָ֧ר לְ/חַטָּ֛את וְ/אַ֥יִל לְ/עֹלָ֖ה תְּמִימִ֑ם וְ/הַקְרֵ֖ב לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/002.yaml
  text: And he said to Aaron[a], “Take for yourself a calf, a son of the herd, for a sin offering, and a ram for a burnt offering, both without blemish, and present them before Yahweh.”
translation:
  language: ta
  text: அவர் ஆரோனிடம், “உனக்காக மாட்டினத்தைச் சேர்ந்த ஒரு குறைபாடற்ற கன்றைப்[a] பாவப்பலியாகவும், ஒரு குறைபாடற்ற செம்மறியாட்டுக் கடாவைத் தகனபலியாகவும் எடுத்துக்கொள்; அவற்றை யாவேயின் முன்னிலையில் கொண்டுவா” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேய மொழியில் சொற்சொல்லாக, “ஒரு கன்று, மாட்டினத்தின் மகன்”; அதாவது, மாட்டினத்தைச் சேர்ந்த ஓர் இளம் விலங்கு.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֶל אַהֲרֹן
  choice: அவர் ஆரோனிடம் … என்றார்
  rationale: எபிரேயக் கதைநடையின் தொடர்ச்சியை இயல்பான நவீனத் தமிழில் தருகிறது; மூலத்தில் பெயரிடப்படாத எழுவாயை ‘அவர்’ என்றே வைத்திருக்கிறது.
- source_word: קַח לְךָ
  choice: உனக்காக … எடுத்துக்கொள்
  rationale: לְךָ என்பதிலுள்ள தனக்குரிய/தனக்காக என்ற நுணுக்கத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: עֵגֶל בֶּן בָּקָר
  choice: மாட்டினத்தைச் சேர்ந்த ஒரு கன்று
  rationale: இளம் மாட்டின விலங்கைக் குறிக்கும் எபிரேயச் சொல்லிணையைத் தமிழில் தெளிவாகத் தருகிறது; அதன் சொற்சொல் வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: לְחַטָּאת
  choice: பாவப்பலியாக
  rationale: பலிச்சடங்குச் சூழலில் חַטָּאת என்பது பாவத்திற்காகச் செலுத்தப்படும் பலியைக் குறிக்கிறது. ‘பாவப்பலி’ சுருக்கமாகவும் புரியத்தக்கதாகவும் உள்ளது; ‘சுத்திகரிப்புப் பலி’ என்ற மாற்றுப் புரிதலைத் திணிக்கவில்லை.
- source_word: וְאַיִל לְעֹלָה
  choice: ஒரு செம்மறியாட்டுக் கடாவைத் தகனபலியாகவும்
  rationale: אַיִל என்பதைக் குறிப்பான ஆண் செம்மறியாடாகவும், עֹלָה என்பதைக் முழுவதும் எரிக்கப்படும் பலிக்கான வழக்குச் சொல்லான ‘தகனபலி’ என்றும் தருகிறது.
- source_word: תְּמִימִם
  choice: இரண்டும் குறைபாடற்றவையாக இருக்க வேண்டும்
  rationale: பன்மை வடிவம் இரு விலங்குகளையும் குறிப்பதைத் தமிழில் வெளிப்படையாக்குகிறது.
- source_word: וְהַקְרֵב
  choice: அவற்றை … கொண்டுவா
  rationale: Hiphil வடிவத்தின் ‘அருகில் கொண்டுவருதல்/முன்னிலையில் சமர்ப்பித்தல்’ என்ற பொருளைப் பாதுகாக்கிறது; அடுத்துவரும் பலிச் செயல்களை முன்கூட்டியே ‘பலியிடு’ என்று சொல்லவில்லை.
- source_word: לִפְנֵי יְהוָה
  choice: யாவேக்கு முன்பாக
  rationale: தெய்வீகப் பெயரை ஒலிபெயர்த்து, ‘அவரது முன்னிலையில்’ என்ற வழிபாட்டுச் சூழலையும் இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற உடன்படிக்கைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் நேரடியாக உள்ள நான்கெழுத்துத் தெய்வீகப் பெயரை ஒரு பொதுப் பட்டமாக மாற்றாமல், பரவலாக ஏற்றுக்கொள்ளப்படும் உச்சரிப்புக்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்க்கிறது.
- issue: חַטָּאת என்ற பலியின் பெயர்
  choice: பாவப்பலி
  alternative: சுத்திகரிப்புப் பலி; பாவநிவாரண பலி
  rationale: இந்தச் சொல் பாவத்தோடும் சுத்திகரிப்போடும் தொடர்புடைய பலியைச் சூழலின்படி குறிக்கக்கூடும். இவ்வசனத்தில் பொதுவாகப் புரியக்கூடிய ‘பாவப்பலி’ என்பதைப் பயன்படுத்தி, ‘நிவாரணம்’ போன்ற கூடுதல் இறையியல் விளக்கத்தை மூலத்திற்குள் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்கள் புரிந்துகொள்ளும் வகையில் இயல்பாகவும், பலிச்சடங்கின் கண்ணியமான தொனியைத் தக்கவைத்தும் அமைக்கப்பட்டுள்ளது. ‘செம்மறியாட்டுக் கடா’ என்பது விலங்கினத்தையும் பாலினத்தையும் தெளிவாகக் காட்டுகிறது.
