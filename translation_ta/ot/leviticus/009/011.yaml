base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/011.yaml
  text: But the flesh and the hide he burned with fire outside the camp[a].
translation:
  language: ta
  text: ஆனால் இறைச்சியையும் தோலையும் முகாமுக்கு வெளியே நெருப்பில் எரித்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இறைச்சியையும் தோலையும் முகாமுக்கு வெளியே நெருப்பில் எரித்தார்.”
    reason: וְ என்பதைக் கருத்து வேறுபாட்டைக் காட்டும் “ஆனால்” என்று வழங்காமல், தொடர்ச்சியை மட்டும் காட்டும் விதமாகவும் மொழிபெயர்க்கலாம்.
lexical_decisions:
- source_word: וְ/אֶת
  choice: ஆனால் … -ஐயும்
  rationale: וְ தொடர்ச்சியைக் குறித்தாலும், முந்தைய வசனத்தில் பலிபீடத்தின் மேல் எரிக்கப்பட்டவற்றுக்கும் இங்கே முகாமுக்கு வெளியே எரிக்கப்பட்டவற்றுக்கும் உள்ள வேறுபாட்டைத் தமிழில் இயல்பாகக் காட்ட “ஆனால்” பயன்படுத்தப்பட்டது; אֵת நேரடியாக மொழிபெயர்க்கப்படாத நேரடி செயப்படுபொருள் குறியீடு.
- source_word: הַ/בָּשָׂר
  choice: இறைச்சி
  rationale: בָּשָׂר என்பது உடலின் சதை அல்லது இறைச்சியைக் குறிக்கிறது. பலியிடப்பட்ட விலங்கின் உடற்பகுதியை நவீனத் தமிழில் தெளிவாகக் குறிக்க “இறைச்சி” தேர்ந்தெடுக்கப்பட்டது.
- source_word: הָ/ע֑וֹר
  choice: தோல்
  rationale: עוֹר விலங்கின் தோலைக் குறிக்கிறது; “தோல்” என்பது தமிழில் இயல்பானதும் துல்லியமானதும் ஆகும்.
- source_word: שָׂרַף
  choice: எரித்தார்
  rationale: வினைச்சொல் எரித்தலை நேரடியாகக் குறிக்கிறது. எபிரெய மூலத்தில் வெளிப்படையாக இல்லாத நிறைவு நுணுக்கத்தைச் சேர்க்காமல் எளிமையாக மொழிபெயர்க்கப்பட்டது.
- source_word: בָּ/אֵשׁ
  choice: நெருப்பில்
  rationale: בְּ + אֵשׁ இங்கு எரித்தல் நிகழ்ந்த ஊடகம் அல்லது சாதனத்தைச் சுட்டுகிறது. “நெருப்பில்” என்பது இயல்பான தமிழ்; “நெருப்பினால்” என்பதும் சாத்தியம்.
- source_word: מִ/חוּץ לַ/מַּחֲנֶה
  choice: முகாமுக்கு வெளியே
  rationale: இஸ்ரவேலரின் முகாம் எல்லைக்கு அப்பாற்பட்ட இடத்தைத் துல்லியமாகவும் இயல்பாகவும் குறிக்கிறது.
theological_decisions:
- issue: பலிச் சடங்கில் எஞ்சியவற்றை அகற்றும் செயல்
  choice: இறைச்சியும் தோலும் முகாமுக்கு வெளியே எரிக்கப்பட்டதாக நேரடியாக மொழிபெயர்த்தல்
  alternative: பிற்கால வேதாகமத் தொடர்புகளையோ முன்நிழல் விளக்கத்தையோ மொழிபெயர்ப்பிலேயே முன்னிறுத்துதல்
  rationale: வசனம் ஆசாரியச் சடங்கு நடவடிக்கையை மட்டுமே விவரிக்கிறது. மூல எபிரெய உரைக்கு அப்பாற்பட்ட இறையியல் குறியீடுகளை மொழிபெயர்ப்பில் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிய, கண்ணியமான நடையில் பலிச் சடங்கின் செயலைத் தெளிவாக வழங்குகிறது. மரியாதை வினைமுற்றான “எரித்தார்” சூழலிலுள்ள மோசேயைக் குறிக்கப் பயன்படுத்தப்பட்டது.
