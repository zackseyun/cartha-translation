base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/022.yaml
  text: Then Aaron lifted up his hands toward the people and blessed them[a], and he came down from offering the sin offering, the burnt offering[c][b], and the peace offerings.
translation:
  language: ta
  text: பின்பு ஆரோன் தம் கையை[a] மக்களை நோக்கி உயர்த்தி, அவர்களை ஆசீர்வதித்தார். பாவநிவாரணப் பலியையும்[b] தகன பலியையும் சமாதானப் பலிகளையும்[c] செலுத்தி முடித்தபின், அவர் கீழே இறங்கினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தம் கைகளை’ என்றும் புரிந்துகொள்ளலாம். எபிரெய வடிவம் ஒருமையில் ‘தம் கையை’ என்று உள்ளது; ஆனால் ஆசீர்வதிக்கும் சைகை பொதுவாக இரு கைகளையும் உயர்த்துவதாகப் புரிந்துகொள்ளப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘தூய்மைப்படுத்தும் பலி’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: ‘உறவுப் பலிகள்’ அல்லது ‘நல்வாழ்வுப் பலிகள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא
  choice: உயர்த்தி
  rationale: נשׂא என்பது கை தொடர்பாக வரும்போது ‘உயர்த்துதல்’ என்று பொருள்படும்; ஆசீர்வாதத்திற்கு முந்திய உடல் அசைவை இது இயல்பாகத் தெரிவிக்கிறது.
- source_word: יָדוֹ
  choice: தமது கையை
  rationale: எபிரெய வடிவம் ஒருமையில் ‘அவருடைய கை’ என்று இருப்பதால், அந்த எண்ணை முதன்மை உரையில் பாதுகாக்கிறது; இரு கைகளையும் குறிக்கும் வழக்கான புரிதல் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אֶל הָעָם
  choice: மக்களை நோக்கி
  rationale: אֶל திசையைக் குறிக்கிறது; ஆரோனின் உயர்த்தப்பட்ட கை மக்களை நோக்கியிருந்ததை இச்சொற்றொடர் தெளிவாகக் காட்டுகிறது.
- source_word: וַיְבָרְכֵם
  choice: அவர்களை ஆசீர்வதித்தார்
  rationale: பியேல் வடிவிலுள்ள ברך என்பதன் நேரான பொருள் ‘ஆசீர்வதித்தல்’; நவீனத் தமிழிலும் இது தெளிவான, மரியாதையான நடை.
- source_word: וַיֵּרֶד
  choice: அவர் கீழே இறங்கினார்
  rationale: ירד என்பது கீழிறங்குதலைக் குறிக்கிறது. பலிகளைச் செலுத்திய இடத்திலிருந்து ஆரோன் இறங்கிய செயலை இது இயல்பாகத் தெரிவிக்கிறது; குறிப்பாக எங்கிருந்து இறங்கினார் என்பதை மூல உரை சொல்லாததால் சேர்க்கப்படவில்லை.
- source_word: מֵעֲשֹׂת
  choice: செலுத்திவிட்டு
  rationale: מן உடன் வரும் עשה வினையெச்சம், அச்செயலை முடித்த பின்பு நிகழ்ந்த நகர்வைக் காட்டுகிறது. பலிச் சூழலில் ‘பலிகளைச் செலுத்திவிட்டு’ என்பது இயல்பான தமிழ்.
- source_word: הַחַטָּאת
  choice: பாவநிவாரணப் பலி
  rationale: லேவியராகமத்தின் பலியியல் சூழலில் חטאת குறிக்கும் நிலையான பலிவகையை அடையாளப்படுத்தும் பரிச்சயமான தமிழ்ச் சொல்; தூய்மைப்படுத்தும் செயல்பாட்டை வலியுறுத்தும் மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: הָעֹלָה
  choice: தகன பலி
  rationale: עלה குறிக்கும் முழுமையாக எரிக்கப்படும் பலிவகைக்கான தெளிவான, வழக்கமான தமிழ்ப் பெயர்.
- source_word: הַשְּׁלָמִים
  choice: சமாதானப் பலிகள்
  rationale: שׁלמים என்பதற்கான பாரம்பரியமும் அடையாளம் காண எளிதுமான தமிழாக்கம்; அதன் உறவு அல்லது நல்வாழ்வு நுணுக்கங்களை வெளிப்படுத்தும் மாற்றுகள் அடிக்குறிப்பில் தரப்படுகின்றன.
theological_decisions:
- issue: பலியியல் தொழில்நுட்பச் சொற்களின் மொழிபெயர்ப்பு
  choice: முதன்மை உரையில் ‘பாவநிவாரணப் பலி,’ ‘தகன பலி,’ ‘சமாதானப் பலிகள்’ என்ற அடையாளம் காணக்கூடிய பலிவகைப் பெயர்களைப் பயன்படுத்துதல்
  alternative: ‘தூய்மைப்படுத்தும் பலி,’ ‘முழுத் தகன பலி,’ ‘உறவுப் பலிகள்’ அல்லது ‘நல்வாழ்வுப் பலிகள்’
  rationale: இவை லேவியராகமத்தில் தனித்தனி பலிவகைகளைக் குறிக்கும் தொழில்நுட்பச் சொற்கள். முதன்மைத் தேர்வுகள் வாசகர்களுக்குப் பரிச்சயத்தையும் நூல் முழுவதுமான சொல் ஒற்றுமையையும் தருகின்றன; செயல்பாடு மற்றும் உறவு சார்ந்த பிற நுணுக்கங்கள் அடிக்குறிப்புகளில் பாதுகாக்கப்படுகின்றன.
- issue: יָדוֹ என்பதிலுள்ள ஒருமை
  choice: முதன்மை உரையில் ‘தமது கையை’ என்று ஒருமையைப் பாதுகாத்தல்
  alternative: ‘தமது கைகளை’
  rationale: மசோரெட்டிக் எபிரெய உரை இலக்கண ரீதியாக ஒருமையில் உள்ளது. ஆசீர்வதிக்கும் சைகை இரு கைகளாலும் செய்யப்பட்டதாகப் புரிந்துகொள்ளப்படலாம் என்றாலும், அதை உரையில் தீர்மானமாக மாற்றாமல் அடிக்குறிப்பில் தெரிவிப்பது மூலத்தின் வடிவத்தையும் உண்மையான விளக்கச் சாத்தியத்தையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வாசிப்பின் இயல்பும் காக்கப்பட்டுள்ளன. ஆரோனைச் சுட்டும் வினைகளில் மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது. மூல எபிரெயத்தின் ஒருமை ‘கை’ முதன்மை உரையில் பாதுகாக்கப்பட்டு, வழக்கமான இருகைச் சைகை அடிக்குறிப்பில் பதிவு செய்யப்பட்டுள்ளது. பலிவகைப் பெயர்கள் தெளிவான தொழில்நுட்பச் சொற்களாக வைக்கப்பட்டுள்ளன.
