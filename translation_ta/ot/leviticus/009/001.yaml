  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரேய வாக்கியத்தின் பட்டியல் அமைப்பும் ‘எட்டாம் நாள்’ என்ற விளக்கப்படாத காலக் குறிப்பும் பாதுகாக்கப்பட்டுள்ளன.
