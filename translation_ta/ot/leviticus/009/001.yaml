source:
  edition: WLC
  text: וַ/יְהִי֙ בַּ/יּ֣וֹם הַ/שְּׁמִינִ֔י קָרָ֣א מֹשֶׁ֔ה לְ/אַהֲרֹ֖ן וּ/לְ/בָנָ֑י/ו וּ/לְ/זִקְנֵ֖י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/001.yaml
  text: And it happened on the eighth day that Moses called Aaron and his sons and the elders of Israel[a].
translation:
  language: ta
  text: எட்டாம் நாளில் மோசே ஆரோனையும் அவனுடைய மகன்களையும் இஸ்ரவேலின் மூப்பர்களையும் அழைத்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அழைத்தார்’ என்பதற்கு ‘வரவழைத்தார்’ என்றும் மொழிபெயர்க்கலாம்; எபிரேய வினை இச்சூழலில் இரு பொருள்களையும் தரக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: எட்டாம் நாளில்
  rationale: எபிரேயக் கதைநடையின் וַיְהִי புதிய நிகழ்வை அறிமுகப்படுத்துகிறது. தமிழில் தனியாக ‘அப்போது நிகழ்ந்ததாவது’ என்று மொழிபெயர்ப்பது இயல்பற்ற மிகைப்பாக இருக்கும்; காலத் தொடரை வாக்கியத் தொடக்கத்திலேயே இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: எட்டாம் நாளில்
  rationale: மூலத்தின் நேரடியான காலக் குறிப்பைத் தக்கவைக்கிறது; முந்தைய ஏழு நாள் அர்ப்பணிப்பு நிகழ்வுக்குப் பிந்தைய நாள் என்ற விளக்கத்தை உரைக்குள் சேர்க்கவில்லை.
- source_word: קָרָא
  choice: அழைத்தார்
  rationale: இந்த வினை ‘அழைத்தல்’ அல்லது ‘வரவழைத்தல்’ என்ற பொருளைக் கொள்ளலாம். ‘அழைத்தார்’ என்பது நேரடியும் இயல்புமான தமிழாக்கம்; சூழலில் அதிகாரபூர்வ அழைப்பாகவும் புரிந்துகொள்ள முடியும்.
- source_word: לְאַהֲרֹן
  choice: ஆரோனை
  rationale: பெயர் நவீனத் தமிழில் நிலைபெற்ற வேதாகம ஒலிபெயர்ப்பின்படி வழங்கப்பட்டு, வினைக்கு ஏற்ற இரண்டாம் வேற்றுமை உருபு சேர்க்கப்பட்டுள்ளது.
- source_word: וּלְבָנָיו
  choice: அவனுடைய மகன்களையும்
  rationale: ஆசாரியப் பணிக்குரிய ஆரோனின் ஆண் பிள்ளைகளையே בנים குறிக்கிறது; ஆகவே ‘மகன்கள்’ சூழலுக்கும் சொல்லுக்கும் துல்லியமானது.
- source_word: וּלְזִקְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மூப்பர்களையும்
  rationale: இஸ்ரவேல் சமூகத்தின் அங்கீகரிக்கப்பட்ட மூத்த தலைவர்கள் அல்லது பிரதிநிதிகளைக் குறிக்கும் நிலையான சொற்றொடர்; ‘மூப்பர்கள்’ இயல்பான, மரியாதைக்குரிய தமிழ் இணை.
