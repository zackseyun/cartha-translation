  text: וְ/אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל תְּדַבֵּ֣ר לֵ/אמֹ֑ר קְח֤וּ שְׂעִיר עִזִּים֙ לְ/חַטָּ֔את וְ/עֵ֨גֶל וָ/כֶ֧בֶשׂ בְּנֵי שָׁנָ֛ה תְּמִימִ֖ם לְ/עֹלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/003.yaml
  text: And to the sons of Israel you shall speak[a], saying, ‘Take a male goat for a sin offering, and a calf and a lamb, each a year old, without blemish, for a burnt offering.’
translation:
  language: ta
  text: 'இஸ்ரயேலின் மகன்களிடம் நீ இவ்வாறு பேசு: “பாவநிவாரணப் பலிக்காக[a] ஒரு வெள்ளாட்டுக் கடாவையும், தகனபலிக்காக இரண்டும் ஒரு வயதுடையவையும் குறையற்றவையுமாகிய ஒரு கன்றையும் ஒரு செம்மறியாட்டுக் குட்டியையும் எடுத்துக்கொள்ளுங்கள்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தூய்மைப்படுத்தும் பலிக்காக.” ஆசாரியப் பலிச் சூழல்களில் எபிரெயச் சொல் חַטָּאת இவ்வாறும் புரிந்துகொள்ளப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶל בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரயேலின் மகன்களிடம்
  rationale: கூட்டத்தாரை நோக்கிய புதிய அறிவுறுத்தலை இயல்பான தமிழில் காட்டுகிறது; בְּנֵי என்ற ஆண்பால் பன்மை வடிவத்தையும் வெளிப்படையாகப் பாதுகாக்கிறது.
- source_word: תְּדַבֵּר לֵאמֹר
  choice: நீ பேசிச் சொல்ல வேண்டியது
  rationale: மோசேயை நோக்கிய கட்டளைத் தன்மையையும், தொடர்ந்து வரும் நேர்கூற்றை அறிமுகப்படுத்தும் எபிரெய மொழிநடையையும் இயல்பான நவீன தமிழில் இணைக்கிறது.
- source_word: קְחוּ
  choice: எடுத்துக்கொள்ளுங்கள்
  rationale: பன்மை ஏவல் வடிவத்தை மரியாதைமிக்க பொதுத் தமிழில் தருகிறது; மூல வினையில் வெளிப்படையாக இல்லாத ‘கொண்டுவாருங்கள்’ என்ற இலக்கு நுணுக்கத்தைச் சேர்க்கவில்லை.
- source_word: שְׂעִיר עִזִּים
  choice: ஒரு வெள்ளாட்டுக் கடா
  rationale: பலிக்கான மிருகத்தின் இனத்தையும் ஆண்பாலையும் தெளிவாகக் காட்டுகிறது.
- source_word: לְחַטָּאת
  choice: பாவநிவாரணப் பலிக்காக
  rationale: ஆசாரிய பலியியல் சூழலில் இது பாவம் என்ற கருத்தை மட்டும் அல்ல, ஒரு குறிப்பிட்ட பலிவகையைக் குறிக்கிறது; தமிழில் பரவலாகப் புரியக்கூடிய பெயர் பயன்படுத்தப்பட்டுள்ளது.
- source_word: וְעֵגֶל וָכֶבֶשׂ
  choice: ஒரு கன்றையும் செம்மறியாட்டுக் குட்டியையும்
  rationale: இரு மிருகங்களையும் அவற்றின் பொதுவான சொற்பொருளின்படி வேறுபடுத்திக் காட்டுகிறது.
- source_word: בְּנֵי שָׁנָה
  choice: ஒரு வயதான
  rationale: பன்மைச் சொற்றொடர் கன்றுக்கும் செம்மறியாட்டுக் குட்டிக்கும் பொருந்துவதால், தமிழில் ஒரே பகிர்ந்த அடைமொழியாக இயல்பாக அமைக்கப்பட்டுள்ளது.
- source_word: תְּמִימִם
  choice: பழுதற்ற
  rationale: பலிக்கான மிருகங்களில் உடற்குறை அல்லது குறைபாடு இல்லாத நிலையைத் துல்லியமாகக் குறிக்கிறது.
- source_word: לְעֹלָה
  choice: தகனபலிக்காக
  rationale: முழுமையாக எரிக்கப்படும் பலிவகைக்கான தமிழில் நிலைபெற்ற, தெளிவான சொல்லைத் தருகிறது.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל என்பதன் மொழிபெயர்ப்பு
  choice: இஸ்ரயேலின் மகன்கள்
  alternative: இஸ்ரயேல் மக்கள்
  rationale: மூலத்தின் ஆண்பால் பன்மை அமைப்பை முதன்மை உரையில் வெளிப்படையாகப் பாதுகாக்கிறது; இது உடன்படிக்கைச் சமூகத்தைக் கூட்டாகச் சுட்டினாலும் பாலினத்தை அமைதியாகப் பொதுமைப்படுத்தவில்லை.
- issue: ஆசாரிய பலியியல் சூழலில் חַטָּאת என்பதன் பொருள்
  choice: பாவநிவாரணப் பலி
  alternative: தூய்மைப்படுத்தும் பலி
  rationale: இங்கு ஒரு குறிப்பிட்ட பலிவகை குறிக்கப்படுகிறது. ‘பாவநிவாரணப் பலி’ வாசகர்களுக்கு எளிதில் அடையாளம் காணக்கூடியது; தூய்மைப்படுத்தும் செயல்பாட்டை வலியுறுத்தும் மாற்று மொழிபெயர்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதைமிக்கதும் பொதுவாசகர்களுக்குப் புரியத்தக்கதுமான நடையைப் பயன்படுத்துகிறது. பலியியல் சொற்களில் தெளிவும் மூல வடிவத்திற்கான வெளிப்படைத்தன்மையும் சமநிலைப்படுத்தப்பட்டுள்ளன.
