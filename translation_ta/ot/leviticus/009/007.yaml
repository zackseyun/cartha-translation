  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶֽל אַהֲרֹ֗ן קְרַ֤ב אֶל הַ/מִּזְבֵּ֨חַ֙ וַ/עֲשֵׂ֞ה אֶת חַטָּֽאתְ/ךָ֙ וְ/אֶת עֹ֣לָתֶ֔/ךָ וְ/כַפֵּ֥ר בַּֽעַדְ/ךָ֖ וּ/בְעַ֣ד הָ/עָ֑ם וַ/עֲשֵׂ֞ה אֶת קָרְבַּ֤ן הָ/עָם֙ וְ/כַפֵּ֣ר בַּֽעֲדָ֔/ם כַּ/אֲשֶׁ֖ר צִוָּ֥ה יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/007.yaml
  text: And Moses said to Aaron[a], “Come near to the altar, and offer your sin offering and your burnt offering, and make atonement for yourself and for the people. Then offer the people's offering, and make atonement for them, just as Yahweh commanded.”
translation:
  language: ta
  text: மோசே ஆரோனிடம், “பலிபீடத்தை அணுகி, உனக்கான பாவநிவாரணப் பலியையும்[a] உனக்கான தகனபலியையும் செலுத்தி, உனக்காகவும் மக்களுக்காகவும் பாவநிவிர்த்தி செய். பிறகு மக்களின் காணிக்கையைச் செலுத்தி, யாவே கட்டளையிட்டபடியே அவர்களுக்காகப் பாவநிவிர்த்தி செய்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தூய்மைப்படுத்தும் பலியையும்.” எபிரெயச் சொல் חַטָּאת பாவநிவாரணப் பலியைக் குறிக்கலாம்; சில சூழல்களில் அசுத்தத்திலிருந்து தூய்மைப்படுத்துதலை வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: קְרַב אֶל הַמִּזְבֵּחַ
  choice: பலிபீடத்தை நெருங்கி வா
  rationale: קרב என்பதன் கட்டளை வடிவம் சடங்குச் சூழலில் பலிபீடத்தை அணுகுவதைக் குறிக்கிறது; தமிழில் நேரடியான அழைப்பாக இயல்பாக உள்ளது.
- source_word: וַעֲשֵׂה
  choice: செலுத்து
  rationale: எழுத்துப்படி ‘செய்’ என்றாலும், பலிகளைப் பொருளாகக் கொள்ளும் இச்சூழலில் ‘பலியைச் செலுத்து’ என்பது இயல்பான சடங்கு வழக்கு.
- source_word: חַטָּאתְךָ
  choice: உனக்கான பாவநிவாரணப் பலி
  rationale: חַטָּאת இங்கு ஒரு பலியைக் குறிக்கிறது. ‘பாவநிவாரணப் பலி’ வழக்கமான பொருளைப் பாதுகாக்கிறது; தூய்மைப்படுத்தும் பலி என்ற சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: עֹלָתֶךָ
  choice: உனக்கான தகனபலி
  rationale: עֹלָה முழுவதும் எரிக்கப்படும் பலியைக் குறிக்கும் நிலையான சடங்குச் சொல்.
- source_word: וְכַפֵּר
  choice: பாவநிவிர்த்தி செய்
  rationale: כפר என்பதன் பரிகாரம், சுத்திகரிப்பு, ஒப்புரவு சார்ந்த பரந்த சடங்கு-இறையியல் வலிமையை ஒரு குறிப்பிட்ட கோட்பாட்டுக்குள் சுருக்காமல் காக்கிறது.
- source_word: בַּעַדְךָ וּבְעַד הָעָם
  choice: உனக்காகவும் மக்களுக்காகவும்
  rationale: בְּעַד பயன் அல்லது பிரதிநிதித்துவத்தைச் சுட்டுகிறது; தமிழில் ‘-க்காக’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: קָרְבַּן הָעָם
  choice: மக்களுடைய பலி
  rationale: קָרְבָּן என்பது கொண்டுவரப்படும் காணிக்கை அல்லது பலிக்கான பொதுச்சொல்; இச்சூழலில் ‘பலி’ சுருக்கமாகவும் துல்லியமாகவும் உள்ளது.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה
  choice: யெகோவா கட்டளையிட்டபடியே
  rationale: כַּאֲשֶׁר கட்டளையுடன் துல்லியமான ஒத்திசைவை உணர்த்துகிறது; יהוה தனிப்பெயராக ‘யெகோவா’ என்று ஒலிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: பலிச் சூழலில் חַטָּאת என்பதன் பொருள்
  choice: பாவநிவாரணப் பலி
  alternative: தூய்மைப்படுத்தும் பலி
  rationale: இச்சொல் பாவத்திற்கான பலியையும் சடங்கு அசுத்தத்தை அகற்றும் செயலையும் சுட்டக்கூடும். முதன்மை உரை வழக்கமான பொருளைத் தருகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: כפר என்பதன் மொழிபெயர்ப்பு
  choice: பாவநிவிர்த்தி செய்
  alternative: பரிகாரம் செய்; தூய்மைப்படுத்து
  rationale: எபிரெய வினையின் பலி, பரிகாரம், சுத்திகரிப்பு சார்ந்த இறையியல் பரப்பைத் தேவையற்ற வகையில் ஒரு கோட்பாடாகக் குறுக்காமல் வைக்கிறது.
- issue: יהוה என்ற இறைப்பெயர்
  choice: யெகோவா
  alternative: கர்த்தர்; யாவே
  rationale: மூலத்தில் உள்ள தனிப்பட்ட இறைப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல் தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பால் வழங்குகிறது.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க தமிழ். சடங்குச் சொற்களான ‘பலிபீடம்’, ‘தகனபலி’, ‘பாவநிவிர்த்தி’ ஆகியவை துல்லியத்திற்காக வைக்கப்பட்டுள்ளன; வாக்கிய அமைப்பு சாதாரண வாசகர்களுக்குப் புரியும் வகையில் இயல்பாக்கப்பட்டுள்ளது.
