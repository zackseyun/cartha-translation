reference: Leviticus 9:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יִּקְח֗וּ אֵ֚ת אֲשֶׁ֣ר צִוָּ֣ה מֹשֶׁ֔ה אֶל פְּנֵ֖י אֹ֣הֶל מוֹעֵ֑ד וַֽ/יִּקְרְבוּ֙ כָּל הָ֣/עֵדָ֔ה וַ/יַּֽעַמְד֖וּ לִ/פְנֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/005.yaml
  text: So they brought what Moses had commanded to the front of the tent of meeting, and all the congregation came near and stood before Yahweh.
translation:
  language: ta
  text: அவர்கள் மோசே கட்டளையிட்டதைச் சந்திப்புக் கூடாரத்தின் முன்புறத்துக்குக் கொண்டுவந்தார்கள். சபையினர் அனைவரும் நெருங்கிவந்து யாவே முன்னிலையில் நின்றார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: கொண்டுவந்தார்கள்
  rationale: לקח என்பதன் அடிப்படைப் பொருள் ‘எடுத்தல்’ என்றாலும், பொருட்கள் சந்திப்புக் கூடாரத்தின் முன்புறத்துக்கு நகர்த்தப்படும் இச்சூழலில் ‘கொண்டுவந்தார்கள்’ என்பது திசையையும் செயலையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֵת אֲשֶׁר צִוָּה מֹשֶׁה
  choice: மோசே கட்டளையிட்டவற்றை
  rationale: முந்தைய வசனங்களில் கட்டளையிடப்பட்ட பலியிடும் பொருட்களை இத்தொடர் குறிக்கிறது; பன்மைப் பொருட்களைக் குறிக்கும் இயல்பான தமிழ்ச் சொல்லாக்கம் தேர்ந்தெடுக்கப்பட்டது.
- source_word: אֶל־פְּנֵי
  choice: முன்புறத்துக்கு
  rationale: இங்கு சந்திப்புக் கூடாரத்தின் முன்னுள்ள இடத்தைச் சுட்டும் இடவியல் பொருள் உள்ளது. வசனத்தின் இறுதியில் வரும் தெய்வீக முன்னிலையிலிருந்து இதைத் தெளிவாக வேறுபடுத்துகிறது.
- source_word: אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரம்
  rationale: எபிரெயச் சொற்றொடரின் வெளிப்படையான பொருளைப் பாதுகாத்து, நவீன தமிழில் புரியக்கூடிய வடிவமாக உள்ளது.
- source_word: וַיִּקְרְבוּ
  choice: நெருங்கிவந்து
  rationale: קרב குறிக்கும் அணுகிவருதலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: כָּל־הָעֵדָה
  choice: சபையார் அனைவரும்
  rationale: עֵדָה இங்கு இஸ்ரவேலின் ஒன்றுகூடிய சமூகத்தைக் குறிக்கிறது; ‘சபையார் அனைவரும்’ என்பது மொத்த சமூகத்தையும் தெளிவாகக் குறிக்கிறது.
- source_word: וַיַּעַמְדוּ
  choice: நின்றார்கள்
  rationale: עמד என்பதன் நேரடியான பொருளை எளிய, இயல்பான தமிழில் தருகிறது.
- source_word: לִפְנֵי יְהוָה
  choice: யாவே முன்னிலையில்
  rationale: இத்தொடரிலுள்ள இடவியல் மற்றும் வழிபாட்டுச் சார்ந்த இரு நுணுக்கங்களையும் ‘முன்னிலையில்’ பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைபெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் வெளிப்படையாக உள்ள உடன்படிக்கைப் பெயரை பொதுப்பட்டமாக மாற்றாமல், தமிழில் உச்சரிப்புக்கு ஏற்ற ஒலிபெயர்ப்பாகத் தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட நடையில் மொழிபெயர்க்கப்பட்டது. ‘முன்புறத்துக்கு’ என்பது கூடாரத்தின் இடவியல் முன்னைப் குறிக்கவும், ‘முன்னிலையில்’ என்பது யாவேக்கு முன்பாக நிற்பதன் இடவியல்-வழிபாட்டு நுணுக்கத்தைத் தக்கவைக்கவும் பயன்படுத்தப்பட்டது.
