base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/010.yaml
  text: And the fat[a], the kidneys, and the lobe of the liver from the sin offering he turned into smoke on the altar, just as Yahweh had commanded Moses.
translation:
  language: ta
  text: பாவப்பலி[a]யிலிருந்த கொழுப்பையும், சிறுநீரகங்களையும், கல்லீரலின் மேல் உள்ள மடலையும் அவர் பலிபீடத்தின்மேல் புகையாக எழும்பச் செய்தார். யெகோவா மோசேக்குக் கட்டளையிட்டபடியே அவர் செய்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பாவப்பலி” என்பதை “தூய்மைப்படுத்தும் பலி” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் பாவத்தைக் கையாளுவதோடு அசுத்தத்தை அகற்றும் இந்தப் பலியின் பணியையும் வலியுறுத்தக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: חֵלֶב
  choice: கொழுப்பு
  rationale: பலிச் சூழலில் பலிபீடத்தில் செலுத்துவதற்கென ஒதுக்கப்பட்ட கொழுப்புப் பகுதிகளைக் குறிக்கிறது; தமிழில் நேரடியான சொல்லைத் தேர்ந்தெடுத்துள்ளது.
- source_word: כְּלָיֹת
  choice: சிறுநீரகங்கள்
  rationale: எபிரெய உரையின் துல்லியமான உடற்கூறு விவரத்தைப் பாதுகாக்கிறது.
- source_word: יֹּתֶרֶת מִן־הַכָּבֵד
  choice: கல்லீரலின் மேல் இருந்த மடல்
  rationale: கல்லீரலுடன் தொடர்புடைய நீக்கத்தக்க மடல் அல்லது இணைப்புப் பகுதியைக் குறிக்கும் சொற்றொடரின் உடற்கூறு நுணுக்கத்தை இயல்பான தமிழில் தருகிறது.
- source_word: חַטָּאת
  choice: பாவநிவாரணப் பலி
  rationale: பலியின் பாவத்துடன் தொடர்புடைய தன்மையையும் நிவர்த்திசெய்யும் சடங்குப் பணியையும் தமிழில் தெளிவாகக் காட்டுகிறது; தூய்மைப்படுத்தும் பலி என்ற செயல்பாட்டு நுணுக்கம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: הִקְטִיר
  choice: புகையாக எழும்பச் செய்தார்
  rationale: பொதுவாக எரித்தார் என்பதைக் காட்டிலும், பலியைப் பலிபீடத்தில் புகையாக எழச் செய்யும் குறிப்பிட்ட சடங்குச் செயலைப் பாதுகாக்கிறது.
- source_word: הַמִּזְבֵּחָה
  choice: பலிபீடத்தின்மேல்
  rationale: திசைச்சுட்டும் வடிவம் இருந்தாலும், இச்சடங்குச் சூழலில் செயல் நடைபெற்ற இடத்தை இயல்பான தமிழில் குறிக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தெய்வீகப் பெயரை ஒரு பொதுப் பட்டத்தால் மாற்றாமல், தமிழில் பரவலாக அறியப்படும் தனிப்பெயர் வடிவில் தருகிறது.
theological_decisions:
- issue: பலிச் சட்டங்களில் חַטָּאת என்பதன் பொருள்
  choice: பாவநிவாரணப் பலி
  alternative: தூய்மைப்படுத்தும் பலி
  rationale: இச்சொல் பாவத்தையும் அசுத்தத்தை அகற்றும் பலியின் செயலையும் சுட்டக்கூடும். முதன்மை உரையில் வாசகர்களுக்கு அறிமுகமான பாவநிவாரணப் பலி பயன்படுத்தப்பட்டு, உண்மையான செயல்பாட்டு மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; பலிச் சடங்கின் உடற்கூறு மற்றும் செயல்விளக்க நுணுக்கங்கள் தெளிவாகவும் கண்ணியமாகவும் பாதுகாக்கப்பட்டுள்ளன. அடிக்குறிப்பு குறியீடு தொடர்புடைய சொல்லுக்குப் பதிலாக வசன முடிவில் இடப்படாமல் இருக்க வேண்டும் என்ற இலக்கை கருத்தில் கொண்டாலும், இவ்வரைவு கருவி உரையில் அது இறுதியில் உள்ளது; வெளியீட்டில் ‘பாவநிவாரணப் பலி[a]’ என நகர்த்தப்பட வேண்டும்.
