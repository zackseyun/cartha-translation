base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/015.yaml
  text: Then he presented the people's offering[a], and he took the goat of the sin offering that was for the people, and slaughtered it and offered it for sin, as with the first one.
translation:
  language: ta
  text: பின்பு அவர் மக்களின் காணிக்கையை முன்வைத்தார். மக்களுக்கான பாவப் பலியின் வெள்ளாட்டுக்கடாவை எடுத்து, அதை அறுத்து, முதலில் செய்ததுபோலவே அதைப் பாவப் பலியாகச் செலுத்தினார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அதைப் பாவப் பலியாகச் செலுத்தினார்” என்பதற்கு, “அதைக் கொண்டு சடங்குமுறையில் சுத்திகரிப்பு செய்தார்” என்றும் பொருள் கொள்ளலாம். எபிரெய வினைச்சொல் ஆசாரியச் சடங்குச் சூழல்களில் சுத்திகரித்தல் அல்லது களையுதல் என்னும் நுணுக்கத்தையும் கொண்டிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: முன்வைத்தார்
  rationale: ஹிஃபில் வடிவிலுள்ள קרב பலிசார் சூழலில் காணிக்கையை அணுகச் செய்தல் அல்லது முன்வைத்தல் என்று பொருள்படும். ‘முன்வைத்தார்’ என்பது முழுப் பலியிடும் செயலையும் தேவையின்றி இதில் அடக்காமல் சடங்குச் செயலை இயல்பாகக் காட்டுகிறது.
- source_word: קָרְבַּן הָעָם
  choice: மக்களின் காணிக்கை
  rationale: קָרְבָּן என்பது கடவுளிடம் கொண்டுவரப்படும் காணிக்கைக்கான பொதுச் சொல்; இணைப்புத் தொடர் மக்களுடைய காணிக்கை என்பதைக் குறிக்கிறது.
- source_word: שְׂעִיר הַחַטָּאת
  choice: பாவநிவாரணப் பலியின் வெள்ளாட்டுக்கடா
  rationale: שָׂעִיר ஆண் வெள்ளாட்டையும், பலிசார் சூழலில் חַטָּאת பாவத்திற்கான பலியையும் குறிக்கிறது. ‘வெள்ளாட்டுக்கடா’ பாலினத்தையும் விலங்கையும் தெளிவாகக் காட்டுகிறது.
- source_word: אֲשֶׁר לָעָם
  choice: மக்களுக்கான
  rationale: לָעָם இங்கு வெறும் உடைமையைக் காட்டாமல், அந்தப் பலி மக்களின் சார்பாக அல்லது அவர்களுக்காக நியமிக்கப்பட்டதைச் சுட்டுகிறது.
- source_word: וַיִּשְׁחָטֵהוּ
  choice: அதை அறுத்து
  rationale: שׁחט என்பது பலிக்குரிய விலங்கை முறையாக அறுப்பதற்கான வழக்குச் சொல். தமிழில் ‘அறுத்து’ இயல்பாகவும் சடங்குச் சூழலுக்கு ஏற்றதாகவும் உள்ளது.
- source_word: וַיְחַטְּאֵהוּ
  choice: அதைப் பாவநிவாரணப் பலியாகச் செலுத்தினார்
  rationale: חטא என்பதன் பியேல் வடிவம் இங்கு அந்த விலங்கைக் கொண்டு பாவபலிச் சடங்கைச் செய்வதைக் குறிக்கிறது. இந்த மொழிபெயர்ப்பு விலங்கே தூய்மைப்படுத்தப்பட்டது என்ற தவறான எண்ணத்தைத் தவிர்த்து, பொருளை இயல்பாகத் தருகிறது; மூலவினையின் தூய்மைப்படுத்துதல்/களையுதல் சார்ந்த நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: כָּרִאשׁוֹן
  choice: முந்தினதைப் போலவே
  rationale: இது இவ்வதிகாரத்தில் முன்பு செலுத்தப்பட்ட பாவநிவாரணப் பலியையும் அதற்குப் பின்பற்றப்பட்ட முறையையும் சுட்டுகிறது. ‘முந்தினதைப் போலவே’ இயல்பாக அந்தப் பின்னோக்குச் சுட்டலைப் பாதுகாக்கிறது.
theological_decisions:
- issue: பலிசார் சூழலில் חַטָּאת என்பதன் பொருள்
  choice: பாவநிவாரணப் பலி
  alternative: பாவம்; பாவப்பலி
  rationale: லேவியராகமம் 9-ன் உடனடிச் சூழல் பலிச் சடங்கைப் பற்றியது; இங்கு חַטָּאת அருவமான ‘பாவம்’ அல்ல, அந்தப் பாவம் தொடர்பான பலியைச் சுட்டுகிறது. ‘பாவநிவாரணப் பலி’ என்பது பயன்பாட்டைத் தெளிவுபடுத்துகிறது; நிவிர்த்தியின் துல்லிய இயங்குமுறையை வரையறுப்பதில்லை.
- issue: וַיְחַטְּאֵהוּ என்பதன் சடங்குசார் பொருள்
  choice: அதைப் பாவநிவாரணப் பலியாகச் செலுத்தினார்
  alternative: அதைத் தூய்மைப்படுத்தினார்; அதைக் கொண்டு பாவத்தைப் போக்கும் சடங்கைச் செய்தார்
  rationale: வினைச்சொல் ஆசாரியச் சூழலில் பாவபலிச் சடங்கை நிறைவேற்றுதல் அல்லது சடங்குமுறையில் தூய்மைப்படுத்துதல்/களையுதல் ஆகிய நுணுக்கங்களைக் கொண்டிருக்கலாம். முதன்மை உரை இயல்பான தமிழைத் தருகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் வைக்கப்படுகிறது. ‘பாவநிவிர்த்தி செய்தார்’ போன்ற இன்னும் குறிப்பான இறையியல் சொல்லை நேரடியாகச் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க தமிழ் பயன்படுத்தப்பட்டுள்ளது. பலிச் சொற்கள் சாதாரண வாசகருக்குப் புரியும் வகையில் அமைக்கப்பட்டுள்ளன; அதே நேரத்தில் எபிரெய ஆசாரிய மொழியின் உண்மையான பொருள் விரிவு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது. தொடர்ச்சியான எபிரெய வினை அமைப்பு தமிழில் இயல்பான இரு வாக்கியங்களாக வழங்கப்பட்டுள்ளது.
