  text: And they brought the burnt offering to him[a], piece by piece, and the head[b]; and he burned them on the altar.
translation:
  language: ta
  text: அவர்கள் தகனபலியின் துண்டுகளையும் தலையையும் அவரிடம் கொண்டுவந்தார்கள்; அவர் அவற்றைப் பலிபீடத்தின்மேல் புகையெழும்பச் செலுத்தினார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעֹלָה
  choice: தகனபலி
  rationale: லேவியராகமத்தின் பலியிடும் சூழலில் עֹלָה என்பதற்கான நிலைபெற்ற, இயல்பான தமிழ் சொல்; பலி முழுவதும் எரிக்கப்படுவதையும் சுட்டுகிறது.
- source_word: הִמְצִיאוּ אֵלָיו
  choice: அவரிடம் கொண்டுவந்தார்கள்
  rationale: இங்கு Hiphil வடிவம் பலியின் பகுதிகளை ஆரோனிடம் கொண்டுவந்து கொடுப்பதைக் குறிக்கிறது; நவீன தமிழில் இயல்பாக உள்ளது.
- source_word: לִנְתָחֶיהָ
  choice: துண்டு துண்டாக
  rationale: நֶתַח வெட்டப்பட்ட பகுதிகளைக் குறிக்கிறது; לְ முன்னொட்டு இங்கு பகுதி பகுதியாகக் கொண்டுவரப்பட்ட விநியோக உணர்வைத் தருகிறது.
- source_word: הָרֹאשׁ
  choice: அதன் தலையையும்
  rationale: மற்ற வெட்டப்பட்ட துண்டுகளிலிருந்து தலையை உரை தனியே குறிப்பிடுவதால் அந்த வேறுபாடு வெளிப்படையாகத் தக்கவைக்கப்படுகிறது.
- source_word: וַיַּקְטֵר
  choice: பலிப்புகையாக எரித்தார்
  rationale: கற்பலி சூழலில் קטר வெறுமனே எரிப்பதைவிட, பலிபீடத்தில் புகையாக எழும்பும்படி செலுத்துவதைச் சிறப்பாகக் குறிக்கிறது; தமிழ் சொற்றொடர் அந்த வழிபாட்டு நுட்பத்தைத் தக்கவைக்கிறது.
- source_word: עַל הַמִּזְבֵּחַ
  choice: பலிபீடத்தின்மேல்
  rationale: வழிபாட்டுச் சூழலுக்குரிய தெளிவான, நிலைபெற்ற தமிழ் இணைச்சொல்.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், வழிபாட்டு மரியாதையும் மூலத்தின் சுருக்கமான நிகழ்வுவரிசையும் காக்கப்பட்டுள்ளன. ‘பலிப்புகையாக எரித்தார்’ என்பது கற்பலிக்குரிய קטר வினையின் நுட்பத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
