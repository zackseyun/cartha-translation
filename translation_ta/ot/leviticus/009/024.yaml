  text: וַ/תֵּ֤צֵא אֵשׁ֙ מִ/לִּ/פְנֵ֣י יְהוָ֔ה וַ/תֹּ֨אכַל֙ עַל הַ/מִּזְבֵּ֔חַ אֶת הָ/עֹלָ֖ה וְ/אֶת הַ/חֲלָבִ֑ים וַ/יַּ֤רְא כָּל הָ/עָם֙ וַ/יָּרֹ֔נּוּ וַֽ/יִּפְּל֖וּ עַל פְּנֵי/הֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/024.yaml
  text: And fire came out from before Yahweh and consumed on the altar the burnt offering and the fat portions[a]. And all the people saw[b], and they shouted for joy and fell on their faces.
translation:
  language: ta
  text: யாவேவின் முன்னிலையிலிருந்து[a] நெருப்பு புறப்பட்டு, பலிபீடத்தின்மேல் தகனபலியையும் கொழுப்புப் பகுதிகளையும் முற்றிலும் எரித்தது. மக்கள் அனைவரும் அதைக் கண்டு, மகிழ்ச்சியால் ஆரவாரம் செய்தார்கள்[b]; முகங்குப்புற விழுந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் நேரடியாக, ‘யாவேவின் முன்பிருந்து’; ‘யாவேவின் பிரசன்னத்திலிருந்து’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘களிப்புடன் உரக்க முழங்கினார்கள்’; இச்சொல் மகிழ்ச்சியான ஆரவாரத்தையோ பாடல்போன்ற முழக்கத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּצֵא אֵשׁ
  choice: நெருப்பு புறப்பட்டு வந்து
  rationale: יצא வெளிநோக்கிய இயக்கத்தைக் குறிக்கிறது. ‘புறப்பட்டு வந்து’ என்பது நெருப்பு யாவேவின் முன்னிலையிலிருந்து வெளிவந்ததை இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: מִלִּפְנֵי יְהוָה
  choice: யாவேவின் முன்னிலையிலிருந்து
  rationale: לִפְנֵי என்பதன் நேரடிப் பொருள் ‘முன்பிருந்து/முன்னிலையிலிருந்து.’ இங்கு யாவேவின் பிரசன்னத்திலிருந்து நெருப்பு வெளிப்பட்டது என்ற இடவுணர்வை இது காக்கிறது; יהוה என்பது ‘யாவே’ எனப் பெயராக்கப்பட்டுள்ளது.
- source_word: וַתֹּאכַל
  choice: முற்றிலும் எரித்தது
  rationale: இந்த வினைச்சொல் நேரடியாக ‘தின்றது’ எனப் பொருள்பட்டாலும், நெருப்பு பலியை அழித்துச் சாம்பலாக்கிய சூழலில் ‘முற்றிலும் எரித்தது’ என்பது இயல்பான தமிழாகவும் முழுமையாக உட்கொண்டது என்ற வலிமையைத் தக்கவைத்ததாகவும் உள்ளது.
- source_word: הָעֹלָה
  choice: தகனபலி
  rationale: עֹלָה என்பது பலிபீடத்தில் முழுவதும் எரிக்கப்படும் பலிவகையைக் குறிக்கும் நிலையான ஆசாரச் சொல்; ‘தகனபலி’ அதன் சுருக்கமான, மரபறிந்த தமிழ் இணைச்சொல்.
- source_word: הַחֲלָבִים
  choice: கொழுப்புப் பகுதிகள்
  rationale: இது பொதுவான கொழுப்பை மட்டும் அல்லாமல் பலிக்கென ஒதுக்கப்பட்ட குறிப்பிட்ட கொழுப்புத் துண்டுகளைக் குறிக்கிறது. ஆகவே ‘கொழுப்புப் பகுதிகள்’ என்பது ஆசாரத் துல்லியத்தைக் காக்கிறது.
- source_word: וַיַּרְא כָּל הָעָם
  choice: மக்கள் அனைவரும் அதைக் கண்டபோது
  rationale: எபிரெய வாக்கியத் தொடரை இயல்பான தமிழில் இணைக்க ‘கண்டபோது’ பயன்படுத்தப்பட்டுள்ளது; ‘அதை’ என்பது நெருப்பு பலியை எரித்த நிகழ்வைக் குறிக்கிறது.
- source_word: וַיָּרֹנּוּ
  choice: மகிழ்ச்சி ஆரவாரம் செய்தார்கள்
  rationale: רנן என்பது மகிழ்ச்சியுடனான உரத்த முழக்கத்தையோ களிப்பாரவாரத்தையோ குறிக்கலாம். இது முறையான பாடல் என்று தேவையின்றி தீர்மானிக்காமல், களிப்பான எதிர்வினையை வெளிப்படுத்துகிறது.
- source_word: וַיִּפְּלוּ עַל פְּנֵיהֶם
  choice: முகங்குப்புற விழுந்தார்கள்
  rationale: எபிரெய மொழியின் ‘தங்கள் முகங்களின்மேல் விழுந்தார்கள்’ என்ற உடல்சார்ந்த படிமத்தை, பயபக்தியுடன் தரையில் விழுந்த செயல் எனத் தெளிவான நவீன தமிழில் வழங்குகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரையில் உடன்படிக்கையின் தனிப்பெயரான יהוה நேரடியாக வருகிறது. அதை பொதுப்பட்டமான ‘கர்த்தர்’ என மாற்றாமல், ‘யாவே’ என ஒலிபெயர்ப்பது பெயரின் தனித்தன்மையைப் பாதுகாக்கிறது.
- issue: மக்களின் முகங்குப்புற விழுதல் எவ்வாறு புரிந்துகொள்ளப்பட வேண்டும்
  choice: செயலை மட்டும் விவரித்தல்
  alternative: ‘வணங்கினார்கள்’ என நோக்கத்தை வெளிப்படையாகக் கூறுதல்
  rationale: மூல உரை அவர்கள் முகங்களின்மேல் விழுந்தார்கள் என்று உடல் செயலைக் கூறுகிறது; அது வணக்கத்தையோ பயபக்தியையோ உணர்த்தக்கூடும் என்றாலும், அந்த நோக்கத்தை வினைச்சொல்லுக்குள் சேர்க்காமல் மூலத்தின் திறந்த தன்மை பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. பலியியல் துல்லியத்திற்காக ‘தகனபலி,’ ‘கொழுப்புப் பகுதிகள்’ ஆகிய சொற்கள் வைக்கப்பட்டுள்ளன. ‘முகங்குப்புற விழுந்தார்கள்’ என்பது விளக்கவுரையின்றி மூலத்தின் தெளிவான உடல் படிமத்தைப் பேணுகிறது.
