  text: He washed the entrails and the lower legs[a], and he burned them on the altar, on top of the burnt offering.
translation:
  language: ta
  text: 'அவன் உள்ளுறுப்புகளையும் கீழ்க்கால்களையும் கழுவி, அவற்றைப் பலிபீடத்தின் மேல் தகனபலியின் மீது புகையாக எழும்பச் செய்தான்.[a]


    [a] அல்லது, “அவற்றைப் பலிபீடத்தின் மேல் தகனபலியின் மீது எரித்தான்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவற்றைப் பலிபீடத்தின் மேல் தகனபலியின் மீது எரித்தான்.”
    reason: וַיַּקְטֵר என்பதற்கு சடங்கு நுணுக்கமுள்ள ‘புகையாக எழும்பச் செய்தான்’ என்பதோடு, இயல்பான ‘எரித்தான்’ என்ற மொழிபெயர்ப்பும் சாத்தியம்.
lexical_decisions:
- source_word: וַיִּרְחַץ
  choice: கழுவி
  rationale: רחץ என்பது பலிச் சடங்குச் சூழலில் தண்ணீரால் கழுவுவதைக் குறிக்கிறது; ‘கழுவி’ என்பது இயல்பான, தெளிவான தமிழ்.
- source_word: הַקֶּרֶב
  choice: உள்ளுறுப்புகள்
  rationale: קֶרֶב பொதுவாக ‘உட்பகுதி’ எனப் பொருள்படலாம்; இங்கு பலியிடப்படும் விலங்கின் உள் உறுப்புகளைக் குறிப்பதால் ‘உள்ளுறுப்புகள்’ பொருத்தமானது.
- source_word: הַכְּרָעָיִם
  choice: கீழ்க்கால்கள்
  rationale: כְּרָעַיִם விலங்கின் கால்களை, குறிப்பாக அவற்றின் கீழ்ப்பகுதிகளை அல்லது கணைக்கால்களைச் சுட்டுகிறது; ‘கீழ்க்கால்கள்’ அந்த உடற்கூற்றுச் சிறப்பைத் தக்கவைக்கிறது.
- source_word: וַיַּקְטֵר
  choice: புகையாக எழும்பச் செய்தான்
  rationale: קטר என்பதன் ஹிஃபில் வடிவம் ஆசாரிய பலிச் சூழலில் பலிபீடத்தின் மீது செலுத்தப்பட்டதைப் புகையாக எழச் செய்வதைக் குறிக்கிறது; இது பொதுவான ‘எரித்தான்’ என்பதைவிட சடங்கு நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: עַל
  choice: மேல்
  rationale: இங்கு עַל, பலிபீடத்தில் ஏற்கெனவே இருந்த தகனபலியின் மீது இப்பகுதிகள் வைக்கப்பட்டதைக் காட்டுகிறது.
- source_word: הָעֹלָה
  choice: தகனபலி
  rationale: עֹלָה முழுமையாக எரிக்கப்படும் பலிக்கான நிலையான ஆசாரியச் சொல்; ‘தகனபலி’ தமிழில் சுருக்கமாகவும் மரியாதையான வழக்கிலும் உள்ளது.
- source_word: הַמִּזְבֵּחָה
  choice: பலிபீடத்தில்
  rationale: מִזְבֵּחַ என்பது பலிபீடம்; திசைநோக்குச் சொல்லிறுதியுடன் இங்கு நிகழ்விடம் குறிக்கப்படுவதால் ‘பலிபீடத்தில்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
