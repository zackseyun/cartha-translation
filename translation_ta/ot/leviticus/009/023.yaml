source:
  edition: WLC
  text: וַ/יָּבֹ֨א מֹשֶׁ֤ה וְ/אַהֲרֹן֙ אֶל אֹ֣הֶל מוֹעֵ֔ד וַ/יֵּ֣צְא֔וּ וַֽ/יְבָרֲכ֖וּ אֶת הָ/עָ֑ם וַ/יֵּרָ֥א כְבוֹד יְהוָ֖ה אֶל כָּל הָ/עָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/023.yaml
  text: Moses and Aaron went into the tent of meeting, and when they came out, they blessed the people. Then the glory of Yahweh appeared to all the people.
translation:
  language: ta
  text: மோசேயும் ஆரோனும் சந்திப்புக் கூடாரத்திற்குள் சென்று, வெளியே வந்தபோது மக்களை ஆசீர்வதித்தார்கள். அப்போது யாவேயின் மகிமை மக்கள் அனைவருக்கும் தோன்றியது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரம்
  rationale: இறைவன் தமது மக்களைச் சந்திக்கும் பரிசுத்தக் கூடாரத்தைக் குறிக்கும் நிலையான, இயல்பான தமிழ் வழக்கு; தொழில்நுட்பமான வழிபாட்டுச் சூழலையும் காக்கிறது.
- source_word: וַיָּבֹא ... וַיֵּצְאוּ
  choice: சென்று, வெளியே வந்தபோது
  rationale: மோசேயும் ஆரோனும் உள்ளே சென்றதும் பின்னர் வெளியே வந்ததும் ஆகிய செயல்களின் வரிசையை இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது; ஒருங்கிணைந்த எழுவாயும் தொடரும் பன்மை வினைகளும் இருவரையும் எழுவாயாகக் கொள்ள ஆதரிக்கின்றன.
- source_word: וַיְבָרֲכוּ
  choice: ஆசீர்வதித்தார்கள்
  rationale: ஆசீர்வாதத்தின் வடிவத்தை மேலதிகமாக வரையறுக்காமல் எபிரெய வினையின் நேரடியான பொருளைத் தருகிறது.
- source_word: הָעָם / כָּל הָעָם
  choice: மக்களை / மக்கள் அனைவருக்கும்
  rationale: கூடியிருந்த உடன்படிக்கைச் சமூகத்தை இயல்பான நவீன தமிழில் குறிக்கிறது; כָּל என்பதன் முழுமையையும் ‘அனைவருக்கும்’ காக்கிறது.
- source_word: כְבוֹד יְהוָה
  choice: யாவேயின் மகிமை
  rationale: כָּבוֹד குறிக்கும் கண்கூடாக வெளிப்பட்ட இறை மாட்சியை ‘மகிமை’ எனக் காக்கிறது; יהוה என்ற உடன்படிக்கைப் பெயரைப் பெயராகவே வழங்குகிறது.
- source_word: וַיֵּרָא
  choice: தோன்றியது
  rationale: நிஃபால் வடிவத்தின் காணத்தக்க வெளிப்பாட்டை இயல்பாகவும் இறைத்தோற்றச் சூழலுக்கு ஏற்றவாறும் தெரிவிக்கிறது.
- source_word: אֶל כָּל הָעָם
  choice: மக்கள் அனைவருக்கும்
  rationale: அனைத்து மக்களுக்கும் நிகழ்ந்த நேரடியான வெளிப்பாட்டை, கூடுதல் விளக்கத்தைச் சேர்க்காமல் தருகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் வரும் நான்கு எழுத்து உடன்படிக்கைப் பெயரை பொதுப்பட்டமாக மாற்றாமல் தனிப்பெயராகப் பாதுகாக்கிறது.
- issue: உட்பிரிவுகளுக்கிடையிலான கால/தொடர்ச்சி உறவு
  choice: வெளியே வந்தபோது ... அப்போது
  alternative: வெளியே வந்து ... மேலும்
  rationale: எபிரெய தொடர் வினைகளின் நிகழ்வுவரிசையை நவீன தமிழில் தெளிவாகத் தருகிறது; உரையில் இல்லாத வலுவான காரண உறவைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமான ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘சந்திப்புக் கூடாரம்’, ‘ஆசீர்வதித்தார்கள்’, ‘மகிமை’ ஆகிய நிலையான வேதாகமச் சொற்கள் இயல்பான வாக்கிய அமைப்பில் வைக்கப்பட்டுள்ளன.
