source:
  edition: WLC
  text: וְ/שׁ֨וֹר וָ/אַ֜יִל לִ/שְׁלָמִ֗ים לִ/זְבֹּ֨חַ֙ לִ/פְנֵ֣י יְהוָ֔ה וּ/מִנְחָ֖ה בְּלוּלָ֣ה בַ/שָּׁ֑מֶן כִּ֣י הַ/יּ֔וֹם יְהוָ֖ה נִרְאָ֥ה אֲלֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/004.yaml
  text: and an ox and a ram for peace offerings[a], to sacrifice before Yahweh, and a grain offering mixed with oil[b]; for today Yahweh will appear to you.
translation:
  language: ta
  text: மேலும், சமாதானப் பலிகளாக[a] ஒரு மாட்டையும் ஒரு செம்மறியாட்டுக் கடாவையும் யாவேக்கு[b] முன்பாகப் பலியிடுவதற்குக் கொண்டுவாருங்கள்; எண்ணெய் கலந்த தானியக் காணிக்கையையும் கொண்டுவாருங்கள். ஏனெனில் இன்று யாவே உங்களுக்குத் தோன்றுவார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஐக்கியப் பலிகள்’ அல்லது ‘நல்வாழ்வுப் பலிகள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரேயத்தில் יהוה (YHWH) என்ற தெய்வீக நாமம் உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹר
  choice: மாடு
  rationale: இச்சொல் மாட்டினத்தைச் சேர்ந்த பலியிடத்தக்க விலங்கைக் குறிக்கிறது. ‘மாடு’ என்பது பாலினத்தையோ உழைப்புப் பயன்பாட்டையோ தேவையின்றி மிகத் துல்லியமாக நிர்ணயிக்காமல், எபிரேயச் சொல்லின் பரந்த பொருளைப் பாதுகாக்கிறது.
- source_word: אַיִל
  choice: செம்மறியாட்டுக் கடா
  rationale: இச்சொல் ஆண் செம்மறியாட்டைக் குறிப்பாகக் குறிக்கிறது; நவீனத் தமிழில் ‘செம்மறியாட்டுக் கடா’ தெளிவான வடிவம்.
- source_word: שְׁלָמִים
  choice: சமாதானப் பலிகள்
  rationale: லேவியராகமப் பலிமுறையில் இது நல்வாழ்வு, முழுமை, ஐக்கியம் ஆகிய கருத்துகளுடன் தொடர்புடைய பலிவகை. பரிச்சயமான ‘சமாதானப் பலிகள்’ முதன்மை உரையில் வைக்கப்பட்டு, பிற சாத்தியமான பொருள்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: לִזְבֹּחַ
  choice: பலியிடுவதற்கு
  rationale: வெறுமனே கொல்வதைவிட, இச்சூழலில் உள்ள சடங்குசார் பலிச் செயலைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: לִפְנֵי יְהוָה
  choice: யாவேக்கு முன்பாக
  rationale: לִפְנֵי என்பதன் ‘முன்பாக/சந்நிதியில்’ என்ற இடப்பொருளையும், தெய்வீக நாமத்தையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: מִנְחָה
  choice: தானியக் காணிக்கை
  rationale: லேவியராகமச் சூழலில் இது தானியத்தால் செய்யப்படும் குறிப்பிட்ட காணிக்கை வகையைக் குறிக்கிறது.
- source_word: בְּלוּלָה בַשָּׁמֶן
  choice: எண்ணெய் கலந்த
  rationale: காணிக்கை எண்ணெயுடன் கலக்கப்பட்ட தயாரிப்பு முறையை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: כִּי הַיּוֹם
  choice: ஏனெனில் இன்று
  rationale: כִּי தரும் காரணத் தொடர்பையும் הַיּוֹם தரும் கால அழுத்தத்தையும் வெளிப்படையாகக் காக்கிறது.
- source_word: נִרְאָה אֲלֵיכֶם
  choice: உங்களுக்குத் தோன்றுவார்
  rationale: வடிவில் நிறைவுநிலை வினையாக இருந்தாலும், சூழலில் உடனடியாக எதிர்பார்க்கப்படும் தெய்வீக வெளிப்பாட்டைக் குறிப்பதால் தமிழில் எதிர்கால வடிவம் பொருத்தமானது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீக நாமத்தை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரை பொதுப்பட்டத்தை அல்ல, יהוה என்ற தனிப்பட்ட உடன்படிக்கை நாமத்தையே பயன்படுத்துகிறது; ஆகவே அதன் ஒலிபெயர்ப்பு முதன்மை உரையில் பாதுகாக்கப்படுகிறது.
- issue: தெய்வீக வெளிப்பாட்டின் பொருள்
  choice: யாவே உங்களுக்குத் தோன்றுவார்
  alternative: யாவேயின் மகிமை உங்களுக்குத் தோன்றும்
  rationale: இந்த வசனம் யாவே என்றே நேரடியாகக் கூறுகிறது; அடுத்த வசனத்தில் வரும் ‘யாவேயின் மகிமை’ என்ற விரிவான சொற்றொடரை இங்கே இறக்குமதி செய்யவில்லை. நிகழ்வு எதிர்பார்க்கப்படுவதால் எதிர்கால வடிவம் பயன்படுத்தப்படுகிறது.
- issue: முந்தைய வசனத்திலிருந்து தொடரும் கட்டளையைத் தமிழில் வெளிப்படுத்துதல்
  choice: கொண்டுவாருங்கள் என்பதை இரு கூறுகளிலும் வெளிப்படையாகச் சேர்த்தல்
  alternative: பெயர்ச்சொல் பட்டியலாக மட்டும் விடுதல்
  rationale: எபிரேயத்தில் இவ்வசனம் முந்தைய கட்டளையின் பட்டியலைத் தொடர்கிறது. தனி வசனமாக வாசிக்கும் தமிழருக்கு இலக்கணத் தெளிவு கிடைக்க, சூழலில் மறைந்துள்ள கட்டளை வெளிப்படுத்தப்பட்டது; புதிய செயல் எதுவும் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. முந்தைய வசனத்திலிருந்து தொடரும் ‘கொண்டுவாருங்கள்’ என்ற கட்டளை தமிழில் வெளிப்படையாக மீட்டுரைக்கப்பட்டது. ‘சமாதானப் பலிகள்’ என்ற பரிச்சயமான சடங்குசார் சொல் தக்கவைக்கப்பட்டாலும் அதன் பொருள் பரப்பு அடிக்குறிப்பில் திறந்துவைக்கப்பட்டுள்ளது.
