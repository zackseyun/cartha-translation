base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/012.yaml
  text: Then he slaughtered the burnt offering[a], and Aaron’s sons brought the blood to him, and he splashed it against the altar on all sides.
translation:
  language: ta
  text: பின்னர் அவன் தகனபலியை அறுத்தான். ஆரோனின் மகன்கள் இரத்தத்தை அவனிடம் கொண்டுவந்தார்கள்; அவன் அதை பலிபீடத்தின் எல்லாப் பக்கங்களின்மீதும் தெறிக்கும்படி வீசினான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதைப் பலிபீடத்தைச் சுற்றிலும் வீசியடித்தான்.” இரத்தத்தைப் பயன்படுத்திய செயலைக் குறிக்கும் எபிரேய வினை, மென்மையாகத் தூவுவதையல்ல, விசையுடன் வீசிப் படியச் செய்வதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחַט
  choice: பின்னர் அவன் ... அறுத்தான்
  rationale: שׁחט பலியிடும் சூழலில் சடங்குமுறையாக அறுப்பதைக் குறிக்கிறது; ‘பின்னர்’ என்பது தொடர் நிகழ்வைக் காட்டும் வாவை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: הָעֹלָה
  choice: தகனபலி
  rationale: עוֹלָה என்பது முழுவதும் எரிக்கப்படும் பலிக்கான வழக்கமான எபிரேயச் சொல்; ‘தகனபலி’ தமிழில் சுருக்கமாகவும் நிலைபெற்ற பலியியல் சொல்லாகவும் உள்ளது.
- source_word: וַיַּמְצִאוּ
  choice: கொண்டுவந்தார்கள்
  rationale: இச்சடங்குச் சூழலில் ஆரோனின் மகன்கள் இரத்தத்தை அவனிடம் கொண்டுவருவதையோ வழங்குவதையோ இவ்வினை குறிக்கிறது; ‘கொண்டுவந்தார்கள்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: בְּנֵי אַהֲרֹן
  choice: ஆரோனின் மகன்கள்
  rationale: குடும்ப உறவையும் ஆசாரியப் பணியில் ஈடுபட்டவர்களின் அடையாளத்தையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: אֵלָיו
  choice: அவனிடம்
  rationale: இத்திசைச்சொல் ஆரோனைக் குறிக்கிறது; நவீன தமிழில் ‘அவனிடம்’ இயல்பான வடிவம்.
- source_word: הַדָּם
  choice: இரத்தத்தை
  rationale: பலிச் செயல்முறையில் குறிப்பிடப்பட்ட அந்த இரத்தத்தையே சுட்டுகிறது; தேவையற்ற விளக்கம் சேர்க்கப்படவில்லை.
- source_word: וַיִּזְרְקֵהוּ
  choice: அதை ... தெறிக்கும்படி வீசினான்
  rationale: זרק இங்கு இரத்தத்தை மென்மையாகத் தூவுவதைவிட பலிபீடத்தின்மீது விசையுடன் வீசிப் படியச் செய்வதைக் குறிக்கிறது. இந்தத் தமிழ் வடிவம் திரவத்தின் தெறிப்பையும் செயலின் வலிமையையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עַל הַמִּזְבֵּחַ
  choice: பலிபீடத்தின் ... மீதும்
  rationale: இரத்தம் பலிபீடத்தின் மேற்பரப்புகளில் படியுமாறு செய்யப்பட்டதைத் தெளிவாகக் காட்டுகிறது.
- source_word: סָבִיב
  choice: எல்லாப் பக்கங்களின்மீதும்
  rationale: இரத்தம் பலிபீடத்தைச் சுற்றியுள்ள பக்கங்களில் பகிர்ந்து இடப்பட்டதைத் தெளிவாக வெளிப்படுத்துகிறது.
