translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் பலிச் சடங்கின் கண்ணியமான நடையைப் பேணியும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘அறுத்தான்’, ‘தகனபலி’, ‘பலிபீடம்’ ஆகியவை துல்லியமான சடங்குசார் சொற்களாகப் பயன்படுத்தப்பட்டுள்ளன; இரத்தத்தைப் பயன்படுத்திய முறையின் வலிமை ‘தெறிக்கும்படி வீசினான்’ என்பதால் பாதுகாக்கப்பட்டுள்ளது.
