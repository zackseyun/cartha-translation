base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/009.yaml
  text: And Aaron’s sons brought the blood to him[a], and he dipped his finger in the blood and put it on the horns of the altar[c][b], and he poured out the blood at the base of the altar.
translation:
  language: ta
  text: ஆரோனின் மகன்கள் இரத்தத்தை அவரிடம் கொண்டுவந்தார்கள்[a]. அவர் தமது விரலை இரத்தத்தில் தோய்த்து, அதைப் பலிபீடத்தின் கொம்புகளின்மேல்[b] இட்டார்; பின்னர் இரத்தத்தைப் பலிபீடத்தின் அடிப்பகுதியில்[c] ஊற்றினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இரத்தத்தை அவரிடம் சமர்ப்பித்தார்கள்”; இங்கு பயன்படுத்தப்பட்டுள்ள எபிரெய வினைச்சொல், சடங்குச் சூழலில் “அருகில் கொண்டுவருதல்” அல்லது “சமர்ப்பித்தல்” என்று பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: “பலிபீடத்தின் கொம்புகள்” என்பது அதன் மூலைகளிலிருந்து கொம்புபோல் நீண்டிருந்த பகுதிகளைக் குறிக்கிறது.
    reason: cultural_note
  - marker: c
    text: அல்லது, “பலிபீடத்தின் அடித்தளத்தில்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרִבוּ
  choice: கொண்டுவந்தார்கள்
  rationale: ஹிஃபில் வடிவிலுள்ள קרב என்பதற்கு ‘அருகில் கொண்டுவருதல்’ அல்லது சடங்குமுறையில் ‘சமர்ப்பித்தல்’ என்று பொருள் கொள்ளலாம். இங்கு ஆரோனிடம் இரத்தத்தைக் கொண்டுசெல்லும் செயலை இயல்பாகத் தெரிவிக்க ‘கொண்டுவந்தார்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: בְּנֵי אַהֲרֹן
  choice: ஆரோனின் மகன்கள்
  rationale: குடும்ப உறவையும் ஆசாரிய உதவியாளர்களின் அடையாளத்தையும் நேரடியாகக் காக்கும் இயல்பான தமிழ்த் தொடர்.
- source_word: הַדָּם
  choice: இரத்தம்
  rationale: முன்னரே குறிப்பிடப்பட்ட பலியின் குறிப்பிட்ட இரத்தத்தைச் சுட்டுகிறது; தமிழில் வேற்றுமை உருபுகளுடன் அதன் குறிப்புத்தன்மை சூழலால் தெளிவாகிறது.
- source_word: אֵלָיו
  choice: அவரிடம்
  rationale: எபிரெய உரையின் ஆண்பால் ஒருமைப் பிரதிப்பெயரைத் தக்கவைக்கிறது. முந்தைய சூழலின்படி அது ஆரோனைக் குறிக்கிறது.
- source_word: וַיִּטְבֹּל
  choice: தோய்த்து
  rationale: טבל என்பது ‘தோய்த்தல்/முழுக்குதல்’ என்று பொருள்படும். விரலை இரத்தத்தில் இடும் இச்செயலுக்கு ‘தோய்த்து’ என்பது தெளிவான, இயல்பான தமிழ்.
- source_word: אֶצְבָּעוֹ
  choice: தமது விரலை
  rationale: ஒருமையைத் தக்கவைக்கிறது; செய்பவர் ஆரோன் என்பதால் மரியாதை ஒருமைக்கு ஏற்ற தற்சுட்டு உடைமை வடிவம் பயன்படுத்தப்பட்டது.
- source_word: וַיִּתֵּן עַל
  choice: அதைக் … கொம்புகளின்மேல் இட்டார்
  rationale: נתן על என்பதன் அடிப்படைச் செயலைத் தீர்மானமாக ‘பூசினார்’ என்று விரிவுபடுத்தாமல், இரத்தத்தைப் பலிபீடக் கொம்புகள்மேல் வைத்த சடங்குச் செயலை ‘இட்டார்’ என நெருக்கமாகக் காக்கிறது.
- source_word: קַרְנוֹת הַמִּזְבֵּחַ
  choice: பலிபீடத்தின் கொம்புகள்
  rationale: பலிபீடத்தின் மூலைகளிலிருந்து கொம்புபோல் நீண்டிருந்த பகுதிகளைக் குறிக்கும் வழிபாட்டுச் சொல்லை நேரடியாகத் தக்கவைக்கிறது.
- source_word: יָצַק
  choice: ஊற்றினார்
  rationale: יצק என்பதன் ‘ஊற்றுதல்’ என்ற செயலைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: אֶל יְסוֹד הַמִּזְבֵּחַ
  choice: பலிபீடத்தின் அடிப்பகுதியில்
  rationale: יְסוֹד என்பதற்கு ‘அடித்தளம்/அடிப்பகுதி’ என்று பொருள். பலிபீடத்தின் கீழ்ப்பகுதியில் இரத்தம் ஊற்றப்பட்டதை நவீன தமிழில் தெளிவாகக் கூற ‘அடிப்பகுதியில்’ தேர்ந்தெடுக்கப்பட்டது.
theological_decisions:
- issue: אֵלָיו (‘அவரிடம்’) என்ற பிரதிப்பெயர் யாரைக் குறிக்கிறது?
  choice: இரத்தம் ஆரோனிடம் கொண்டுவரப்பட்டது.
  alternative: பலிபீடத்திடமோ, சொல்லப்படாமல் உள்ள வேறொரு நபரிடமோ கொண்டுவரப்பட்டது.
  rationale: உடனடியான சூழலில் ஆரோன் சடங்கைச் செய்கிறார்; அவரது மகன்கள் அவருக்கு உதவுகிறார்கள். ஆகவே பிரதிப்பெயரின் இயல்பான முன்னிலை ஆரோனே. பெயரை உரைக்குள் சேர்க்காமல், மூலத்தின் பிரதிப்பெயர் வடிவம் காக்கப்பட்டது.
translation_notes:
  register: நவீன தரமான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. சடங்கியல் சொற்களில் மூலத்தின் உருவகத்தைத் தக்கவைக்க ‘பலிபீடத்தின் கொம்புகள்’ பயன்படுத்தப்பட்டுள்ளது. ஆரோனைக் குறிக்கும் ஒருமைப் பிரதிப்பெயருடன் தமிழ் மரியாதை ஒருமை வினை மற்றும் உடைமை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன.
