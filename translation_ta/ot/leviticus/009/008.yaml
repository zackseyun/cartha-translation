source:
  edition: WLC
  text: וַ/יִּקְרַ֥ב אַהֲרֹ֖ן אֶל הַ/מִּזְבֵּ֑חַ וַ/יִּשְׁחַ֛ט אֶת עֵ֥גֶל הַ/חַטָּ֖את אֲשֶׁר לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/008.yaml
  text: Then Aaron came near to the altar and slaughtered the calf of the sin offering that was for himself[a].
translation:
  language: ta
  text: பின்பு ஆரோன் பலிபீடத்தை அணுகி, தனக்கான பாவப் பலியின் கன்றுக்குட்டியை அறுத்தான்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தனக்கான தூய்மைப்படுத்தும் பலியின் கன்றுக்குட்டியை.” எபிரெயச் சொல் பாவம் மற்றும் அசுத்தம் அகற்றப்படுவதோடு தொடர்புடைய பலியைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרַב
  choice: அணுகி
  rationale: קרב என்பது அருகில் வருதல் அல்லது அணுகுதல் என்னும் நேரடியான இயக்கத்தைக் குறிக்கிறது; பலிபீடத்தை நோக்கிய செயலை இயல்பான நவீனத் தமிழில் இது தெரிவிக்கிறது.
- source_word: הַמִּזְבֵּחַ
  choice: பலிபீடம்
  rationale: பலியிடும் இடத்தைக் குறிக்கும் מזבח என்பதற்கான தெளிவான, வழக்கமான தமிழ்ச் சொல்.
- source_word: וַיִּשְׁחַט
  choice: அறுத்தான்
  rationale: שׁחט பலிச் சூழலில் விலங்கைக் குறிப்பிட்ட முறையில் அறுப்பதைக் குறிக்கிறது; பொதுவான ‘கொன்றான்’ என்பதைவிட இது துல்லியமானது.
- source_word: עֵגֶל
  choice: கன்றுக்குட்டி
  rationale: עֵגֶל இளம் மாட்டைக் குறிக்கிறது; தமிழில் இயல்பாகவும் தெளிவாகவும் ‘கன்றுக்குட்டி’ என வழங்கப்பட்டுள்ளது.
- source_word: הַחַטָּאת
  choice: பாவப் பலி
  rationale: பலியியல் சூழலில் חטאת ஒரு குறிப்பிட்ட பலிவகையைக் குறிக்கிறது. ‘பாவப் பலி’ எபிரெயச் சொல்லோடு நெருக்கமாகவும் வாசகர்களுக்குப் புரியுமாறும் உள்ளது; தூய்மைப்படுத்தும் செயல்பாட்டை வலியுறுத்தும் மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: אֲשֶׁר לוֹ
  choice: தனக்கான
  rationale: சுற்றியுள்ள வசனங்களில் மக்களுக்கான பலிகளிலிருந்து வேறுபட்டு, இது ஆரோனுக்காகச் செலுத்தப்படும் பலி என்பதைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது.
theological_decisions:
- issue: ஆசாரிய பலியியல் சூழலில் חטאת என்பதன் மொழிபெயர்ப்பு
  choice: பாவப் பலி
  alternative: தூய்மைப்படுத்தும் பலி
  rationale: இச்சொல் பலிவகையின் மரபான பெயராக ‘பாவப் பலி’ என்று வழங்கப்படலாம்; அதேவேளையில் பாவம் மற்றும் சடங்குசார் அசுத்தத்தை அகற்றும் அதன் செயல்பாட்டை முன்னிறுத்தி ‘தூய்மைப்படுத்தும் பலி’ என்றும் புரிந்துகொள்ள முடியும். விவாதத்திற்குரிய அந்த நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளக்கூடிய கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. பலியியல் சொற்களில் தேவையற்ற விளக்கத்தை மூலவசனத்துக்குள் சேர்க்காமல், உண்மையான சொற்பொருள் நுணுக்கம் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
