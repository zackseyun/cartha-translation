id: LEV.9.16
reference: Leviticus 9:16
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יַּקְרֵ֖ב אֶת הָ/עֹלָ֑ה וַֽ/יַּעֲשֶׂ֖/הָ כַּ/מִּשְׁפָּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/016.yaml
  text: And he presented the burnt offering and offered it according to the ordinance[a].
translation:
  language: ta
  text: அவன் தகனபலியை முன்வைத்து, விதிமுறைப்படி[a] அதை நிறைவேற்றினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நிர்ணயிக்கப்பட்ட முறைப்படி”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: முன்வைத்து
  rationale: קרב என்பதன் ஹிஃபில் வடிவம் ‘அருகே கொண்டுவருதல்/முன்வைத்தல்’ என்று பொருள்படும். பலிச்சடங்கின் சூழலில் ‘முன்வைத்து’ என்பது பலியைச் சமர்ப்பிப்பதற்காகக் கொண்டுவந்ததை இயல்பாகக் குறிக்கிறது; அடுத்த வினையின் பொருளை முன்கூட்டியே எடுத்துக்கொள்ளவில்லை.
- source_word: הָעֹלָה
  choice: தகனபலி
  rationale: עֹלָה என்பது முழுவதும் எரிக்கப்படும் பலிக்கான நிலையான எபிரெயச் சொல். ‘தகனபலி’ என்பது லேவியராகமச் சூழலில் சுருக்கமாகவும் துல்லியமாகவும் புரியும் வழக்கமான தமிழ் சொல்.
- source_word: וַיַּעֲשֶׂהָ
  choice: அதை நிறைவேற்றினான்
  rationale: עשה என்பது பொதுவாக ‘செய்தல்’ எனப் பொருள்பட்டாலும், இங்கு பலிக்குரிய செய்முறையை மேற்கொண்டதைக் குறிக்கிறது. ‘அதை நிறைவேற்றினான்’ என்பது மூலத்தின் பரந்த பொருளைத் தக்கவைத்தபடி இயல்பான தமிழில் சடங்கு மேற்கொள்ளப்பட்டதைத் தெரிவிக்கிறது; ‘அதைப் பலியிட்டான்’ எனத் தேவையின்றி பொருளைக் குறுக்கவில்லை.
- source_word: כַּמִּשְׁפָּט
  choice: விதிமுறைப்படி
  rationale: מִשְׁפָּט இங்கு பலியை நிறைவேற்றுவதற்கான நிர்ணயிக்கப்பட்ட நெறி அல்லது நடைமுறையைக் குறிக்கிறது. ‘விதிமுறைப்படி’ அதன் சட்ட மற்றும் செய்முறை சார்ந்த வலிமையைச் சுருக்கமாகத் தருகிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியும் அதேவேளையில் பலிச்சடங்கிற்கேற்ற கண்ணியமான நடையில் அமைக்கப்பட்டது. மூலத்தில் பெயர்ச்சொல்லாக வரும் מִשְׁפָּט என்பதன் விதி/நடைமுறை சார்ந்த நுணுக்கம் முதன்மை உரையிலும் மாற்று வாசிப்பிலும் பாதுகாக்கப்பட்டது.
