  yaml_path: translation/ot/leviticus/009/019.yaml
  text: 'and the fat pieces from the ox and from the ram: the fat tail[a], the covering fat, the kidneys, and the lobe of the liver.'
translation:
  language: ta
  text: காளையிலிருந்தும் செம்மறியாட்டுக் கடாவிலிருந்தும் கொழுப்புப் பகுதிகள்—கொழுப்பான வால், உள்ளுறுப்புகளை மூடியிருக்கும் கொழுப்பு, சிறுநீரகங்கள், கல்லீரலின் மடல்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֶת הַחֲלָבִים
  choice: கொழுப்புப் பகுதிகளான
  rationale: பலவினையிலுள்ள חֲלָבִים பலிக்காகப் பிரித்தெடுக்கப்பட்ட குறிப்பிட்ட கொழுப்புப் பகுதிகளைக் குறிக்கிறது; பொதுவான கொழுப்பை மட்டும் குறிக்கவில்லை.
- source_word: מִן הַשּׁוֹר
  choice: காளையிலிருந்தும்
  rationale: שׁוֹר என்பது மாட்டினத்தைக் குறிக்கக்கூடியது; இங்கு முந்தைய பலிச்சூழலுக்கு ஏற்றபடி ‘காளை’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: וּמִן הָאַיִל
  choice: செம்மறியாட்டுக் கடாவிலிருந்தும்
  rationale: אַיִל பலிச்சூழலில் ஆண் செம்மறியாட்டைக் குறிக்கிறது; நவீன தமிழில் தெளிவுக்காக ‘செம்மறியாட்டுக் கடா’ பயன்படுத்தப்பட்டது.
- source_word: הָאַלְיָה
  choice: கொழுப்பு நிறைந்த வால்
  rationale: இது செம்மறியாட்டின் கொழுப்புமிக்க வாலைச் சுட்டும் பலியியல் உடற்கூறு சொல்.
- source_word: וְהַמְכַסֶּה
  choice: உள்ளுறுப்புகளை மூடியிருக்கும் கொழுப்பு
  rationale: כסה என்ற ‘மூடு’ வேரிலிருந்து வந்த இச்சொல், உடற்கூறு பட்டியலில் உள்ளுறுப்புகளை மூடும் கொழுப்பைக் குறிக்கிறது; சூழலிலிருந்து உள்ளுறுப்புகள் தெளிவுபடுத்தப்பட்டன.
- source_word: וְהַכְּלָיֹת
  choice: சிறுநீரகங்கள்
  rationale: இது வழக்கமான உடற்கூறுப் பெயர்; எபிரெய பலவினை தமிழிலும் காக்கப்பட்டது.
- source_word: וְיֹתֶרֶת הַכָּבֵד
  choice: கல்லீரலின் மடல்
  rationale: கல்லீரலோடு இணைந்துள்ள ஒரு குறிப்பிட்ட பகுதியைக் குறிக்கும் மரபான உடற்கூறு தொடர்; ‘மடல்’ இயல்பான சுருக்கமான தமிழ் இணையாகும்.
