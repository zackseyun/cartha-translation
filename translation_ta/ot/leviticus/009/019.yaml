translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குத் தெளிவாகவும் பலியியல் பட்டியலின் துல்லியத்தைப் பேணியும் மொழிபெயர்க்கப்பட்டது. எபிரெய வசனம் முந்தைய வாக்கியத்தின் தொடராக இருப்பதால், தமிழில் முழுமையான வாக்கியமாக இயல்புபடுத்த ‘எடுத்தார்கள்’ சேர்க்கப்பட்டது; இது முந்தைய வசனத்தின் செயலைத் தொடர்கிறது.
