- from: காளையிலிருந்தும் செம்மறியாட்டுக் கடாவிலிருந்தும் எடுத்த கொழுப்புப் பகுதிகளான கொழுப்பு நிறைந்த வால், உள்ளுறுப்புகளை மூடியிருக்கும் கொழுப்பு, சிறுநீரகங்கள், கல்லீரலின் மடல் ஆகியவற்றையும் எடுத்தார்கள்.
