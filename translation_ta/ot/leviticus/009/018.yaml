base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/018.yaml
  text: Then he slaughtered the ox and the ram[a], the sacrifice of peace offerings that was for the people. Aaron’s sons brought the blood to him, and he splashed it on the altar all around.
translation:
  language: ta
  text: பின்பு அவர் மக்களுக்கான சமாதானப் பலியாகிய காளையையும் செம்மறியாட்டுக் கடாவையும்[a] அறுத்தார். ஆரோனின் மகன்கள் இரத்தத்தை அவரிடம் கொண்டுவந்தார்கள்; அவர் அதை பலிபீடத்தின் எல்லாப் பக்கங்களிலும் தெளித்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கூட்டுறவுப் பலி’ அல்லது ‘நல்வாழ்வுப் பலி’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல்லில் சமாதானம், முழுநலம், கூட்டுறவு ஆகிய கருத்துகளின் தொடர்பு உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחַט
  choice: பின்பு அவர் ... அறுத்தார்
  rationale: தொடர்கதை வரிசையை וַ குறிக்கிறது; பலியிடும் சூழலில் שׁחט என்பதற்கு ‘அறுத்தார்’ என்பது இயல்பான, துல்லியமான தமிழ்.
- source_word: הַשּׁוֹר
  choice: காளை
  rationale: שׁוֹר என்பது மாட்டின விலங்கைக் குறிக்கும்; இப்பலிச் சூழலில் ‘காளை’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: הָאַיִל
  choice: செம்மறியாட்டுக் கடா
  rationale: אַיִל குறிப்பாக ஆண் செம்மறியாட்டைக் குறிக்கிறது; ‘செம்மறியாட்டுக் கடா’ அந்த வேறுபாட்டைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: זֶבַח הַשְּׁלָמִים
  choice: சமாதானப் பலி
  rationale: שְׁלָמִים என்பதில் சமாதானம், நலமுழுமை, உறவுப் பங்கேற்பு ஆகிய தொடர்புகள் உள்ளன. ‘சமாதானப் பலி’ அதன் שׁלום சார்ந்த சொல்லியல் தொடர்பைப் பாதுகாக்கிறது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: אֲשֶׁר לָעָם
  choice: மக்களுக்கான
  rationale: לָעָם இப்பலிகள் மக்களுக்காக அல்லது அவர்கள் சார்பாகச் செலுத்தப்பட்டவை என்பதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וַיַּמְצִאוּ
  choice: கொண்டுவந்தார்கள்
  rationale: இச்சடங்குச் சூழலில் வினைச்சொல் இரத்தத்தை ஆரோனிடம் கொண்டுவந்து அளித்ததைக் குறிக்கிறது.
- source_word: אֶת הַדָּם אֵלָיו
  choice: இரத்தத்தை அவரிடம்
  rationale: எபிரெய உரையில் உள்ள பிரதிப்பெயர் பாதுகாக்கப்படுகிறது; சூழலில் அது ஆரோனைக் குறிக்கிறது.
- source_word: וַיִּזְרְקֵהוּ
  choice: அதை ... தெளித்தார்
  rationale: זָרַק பலியிடும் சடங்கில் இரத்தத்தை பலிபீடத்தின்மீது வீசித் தெளிக்கும் செயலைக் குறிக்கிறது. நவீன தமிழில் ‘தெளித்தார்’ இயல்பான சடங்கு மொழி; இது மென்மையாகத் தூவுதல் மட்டுமே என்று கட்டுப்படுத்தப்படவில்லை.
- source_word: עַל הַמִּזְבֵּחַ סָבִיב
  choice: பலிபீடத்தின் மேல் சுற்றிலும்
  rationale: עַל என்பதன் மேல்/மீது என்ற தொடர்பையும் סָבִיב என்பதன் சுற்றுப்புறப் பகிர்வையும் நேரடியாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: שְׁלָמִים என்பதன் பலவகைப் பொருள்
  choice: முதன்மை உரையில் ‘சமாதானப் பலி’
  alternative: ‘உறவுப் பங்கேற்புப் பலி’ அல்லது ‘நல்வாழ்வுப் பலி’
  rationale: ஒரே விளக்கத்தை இறுதியானதாகத் திணிக்காமல், எபிரெயச் சொல்லின் சமாதானம், முழுநலம், உறவு ஆகிய பொருள் தொடர்புகளை அடிக்குறிப்பில் வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான சடங்கு நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘பலிபீடம்’, ‘சமாதானப் பலி’ ஆகிய சொற்கள் வேதாகமச் சூழலின் மரியாதைமிக்க பதிவைத் தக்கவைக்கின்றன; எபிரெயத்தின் தொடர்கதை இயக்கம் இயல்பான தமிழ் வாக்கிய அமைப்பில் வழங்கப்பட்டுள்ளது.
