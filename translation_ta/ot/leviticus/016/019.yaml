  text: וְ/הִזָּ֨ה עָלָ֧י/ו מִן הַ/דָּ֛ם בְּ/אֶצְבָּע֖/וֹ שֶׁ֣בַע פְּעָמִ֑ים וְ/טִהֲר֣/וֹ וְ/קִדְּשׁ֔/וֹ מִ/טֻּמְאֹ֖ת בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/019.yaml
  text: He shall sprinkle some of the blood on it with his finger seven times[c][b][a], and cleanse it and consecrate it from the uncleannesses of the sons of Israel.
translation:
  language: ta
  text: அவன் தன் விரலால் அந்த இரத்தத்தில் சிறிதை அதன்மேல் ஏழு முறை தெளித்து, இஸ்ரவேல் மக்களின்[c] தீட்டுகளிலிருந்து அதைத் தூய்மைப்படுத்தி[a] புனிதமாக்க வேண்டும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அதைச் சுத்தமாக்கி’ அல்லது ‘அதைத் தூயதாக்கி’ என்றும் மொழிபெயர்க்கலாம்; எபிரெய வினைச்சொல் ஆசார முறைப்படி தூய்மையாக்குவதைக் குறிக்கும் வழக்கமான ஆசாரியச் சொல்லாகும்.
    reason: lexical_alternative
  - marker: b
    text: ‘அதைப் பரிசுத்தமாக்க வேண்டும்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: எபிரெயத்தில் சொற்பட, ‘இஸ்ரவேலின் மகன்கள்’; இங்கு அது இஸ்ரவேல் மக்களை ஒட்டுமொத்தமாகக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִזָּה
  choice: தெளித்து
  rationale: நזה என்பதன் ஹிஃபில் வடிவம் ஆசாரச் சடங்கில் இரத்தத்தைத் தெளிப்பதைக் குறிக்கிறது; ‘தெளித்து’ என்பது இயல்பான, தெளிவான தமிழ்.
- source_word: עָלָיו
  choice: அதன்மேல்
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட பலிபீடத்தைக் குறிக்கிறது; ‘அதன்மேல்’ தொடர்பை இயல்பாகக் காட்டுகிறது.
- source_word: מִן־הַדָּם
  choice: அந்த இரத்தத்தில் சிறிதை
  rationale: מִן இங்கு பகுதியைக் குறிக்கிறது; தெளிப்பதற்காக இரத்தத்தின் ஒரு பகுதி எடுக்கப்படுவதை இச்சொற்றொடர் தெளிவாக்குகிறது.
- source_word: בְּאֶצְבָּעוֹ
  choice: தன் விரலால்
  rationale: கருவிப் பொருளைக் காட்டும் בְּ என்பதற்கு இயல்பான தமிழ் வடிவம்.
- source_word: שֶׁבַע פְּעָמִים
  choice: ஏழு முறை
  rationale: சடங்கின் துல்லியமான எண்ணிக்கையை நேரடியாகப் பாதுகாக்கிறது.
- source_word: וְטִהֲרוֹ
  choice: அதைத் தூய்மைப்படுத்தி
  rationale: טהר என்பது ஆசாரச் சூழலில் சடங்குமுறைத் தூய்மையை ஏற்படுத்துவதைக் குறிக்கிறது; ‘தூய்மைப்படுத்தி’ இதை நவீன தமிழில் தெளிவாகத் தெரிவிக்கிறது.
- source_word: וְקִדְּשׁוֹ
  choice: புனிதமாக்க வேண்டும்
  rationale: קדש இங்கு புனிதமானதாக வேறுபடுத்தி வைப்பதைக் குறிக்கிறது; ‘புனிதமாக்க’ என்பது துல்லியமும் வாசிப்புத் தெளிவும் கொண்டது.
- source_word: מִטֻּמְאֹת
  choice: தீட்டுகளிலிருந்து
  rationale: பன்மை வடிவத்தையும் ஆசாரத் தூய்மைக்கேட்டின் கருத்தையும் ‘தீட்டுகள்’ இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: எபிரெயச் சொற்றொடர் சொற்பட ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு அது உடன்படிக்கைச் சமூகத்தை ஒட்டுமொத்தமாகக் குறிக்கிறது; ‘இஸ்ரவேல் மக்கள்’ இயல்பான நவீன தமிழில் அந்தக் கூட்டுப் பொருளைத் தருகிறது, சொற்படையான வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: பலிபீடத்திற்கான ஆசாரத் தூய்மைப்படுத்தல் மொழி
  choice: இஸ்ரவேல் மக்களின் தீட்டுகளிலிருந்து பலிபீடத்தைத் தூய்மைப்படுத்தி புனிதமாக்குதல்
  alternative: ‘சுத்திகரித்து அர்ப்பணித்தல்’ அல்லது ‘பரிசுத்தமாக்குதல்’
  rationale: இவ்வசனம் உள்ளார்ந்த ஒழுக்க மாற்றத்தை அல்ல, ஆசாரச் சடங்கினால் பரிசுத்த இடத்திலுள்ள பொருளுக்கு நிகழும் தூய்மைப்படுத்தலையும் புனிதமாக்கலையும் குறிக்கிறது.
- issue: בְּנֵי יִשְׂרָאֵל என்பதன் மொழிபெயர்ப்பு
  choice: இஸ்ரவேல் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரெயத்தில் ஆண்பால் பன்மைச் சொற்றொடர் இருந்தாலும், இச்சூழலில் அது இஸ்ரவேல் சமூகத்தைச் சேர்த்துக் குறிக்கும் மரபுத்தொடர். இயல்பான தமிழுக்காக கூட்டுப் பொருள் முதன்மை உரையில் தரப்பட்டு, சொற்படையான வடிவம் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified ஆசார மொழிநடை பயன்படுத்தப்பட்டுள்ளது. ‘தீட்டு’, ‘தூய்மைப்படுத்து’, ‘புனிதமாக்கு’ ஆகியவை சடங்குமுறைப் பொருளைத் தெளிவாக வைத்திருக்கின்றன; தேவையற்ற சமயப்பிரிவு சார்ந்த சொற்கள் தவிர்க்கப்பட்டுள்ளன.
