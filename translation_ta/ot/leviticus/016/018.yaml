  text: וְ/יָצָ֗א אֶל הַ/מִּזְבֵּ֛חַ אֲשֶׁ֥ר לִ/פְנֵֽי יְהוָ֖ה וְ/כִפֶּ֣ר עָלָ֑י/ו וְ/לָקַ֞ח מִ/דַּ֤ם הַ/פָּר֙ וּ/מִ/דַּ֣ם הַ/שָּׂעִ֔יר וְ/נָתַ֛ן עַל קַרְנ֥וֹת הַ/מִּזְבֵּ֖חַ סָבִֽיב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/018.yaml
  text: Then he shall go out to the altar that is before Yahweh and make atonement for it[a], and he shall take some of the bull's blood and some of the goat's blood and put it on the horns of the altar all around.
translation:
  language: ta
  text: பின்பு அவன் யாவேக்கு முன்பாக இருக்கும் பலிபீடத்தினிடத்திற்கு வெளியே சென்று, அதற்காகப் பாவநிவிர்த்தி[a] செய்ய வேண்டும். காளையின் இரத்தத்தில் கொஞ்சமும் வெள்ளாட்டுக்கடாவின் இரத்தத்தில் கொஞ்சமும் எடுத்து, பலிபீடத்தின் கொம்புகளின்மேல் சுற்றிலும் வைக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதைத் தூய்மைப்படுத்த.” ஆசாரியச் சடங்குச் சூழல்களில் இந்த எபிரெய வினைச்சொல் தூய்மைப்படுத்தும் பொருளையும் கொண்டிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָא
  choice: பின்பு அவன் ... வெளியே சென்று
  rationale: சடங்கு வழிமுறையின் தொடர்ச்சியையும் உட்புறத் திருத்தலத்திலிருந்து வெளியே செல்லும் நகர்வையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: הַמִּזְבֵּחַ אֲשֶׁר לִפְנֵי יְהוָה
  choice: யாவேக்கு முன்பாக இருக்கும் பலிபீடத்திடம்
  rationale: לִפְנֵי என்பதன் இடவியல் பொருளான ‘முன்பாக’ என்பதையும், குறிப்பிட்ட பலிபீடத்தை நோக்கிச் செல்வதையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான நான்கெழுத்துத் திருப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: וְכִפֶּר עָלָיו
  choice: அதற்காகப் பாவநிவிர்த்தி செய்ய வேண்டும்
  rationale: כפר என்பதன் ஆசாரியச் சடங்கு சார்ந்த பரந்த இறையியல் பொருளைப் பாதுகாக்கிறது; அதன் தூய்மைப்படுத்தும் நிழற்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְלָקַח מִדַּם הַפָּר וּמִדַּם הַשָּׂעִיר
  choice: காளையின் இரத்தத்தில் கொஞ்சமும் வெள்ளாட்டுக்கடாவின் இரத்தத்தில் கொஞ்சமும் எடுத்து
  rationale: மீண்டும் வரும் מִן என்பதன் பகுதியெடுக்கும் பொருளை ‘கொஞ்சம்’ என்று வெளிப்படுத்துகிறது; שָׂעִיר என்பதன் ஆண்பால் குறிப்பையும் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: וְנָתַן עַל קַרְנוֹת הַמִּזְבֵּחַ סָבִיב
  choice: பலிபீடத்தின் கொம்புகள் அனைத்தின்மேலும் பூச வேண்டும்
  rationale: சடங்கில் இரத்தத்தைப் பலிபீடக் கொம்புகள்மேல் இடுவதை ‘பூச’ என்பது இயல்பாகத் தெரிவிக்கிறது; סָבִיב குறிக்கும் சுற்றுமுழுதான பயன்பாட்டை ‘அனைத்தின்மேலும்’ வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ஆசாரியச் சடங்கில் כפר என்பதன் மொழிபெயர்ப்பு
  choice: பாவநிவிர்த்தி செய்ய வேண்டும்
  alternative: அதைத் தூய்மைப்படுத்த வேண்டும்
  rationale: பலிபீடத்தை நோக்கிய இந்தச் சடங்குச் செயலில் பாவநிவிர்த்தி மற்றும் தூய்மைப்படுத்துதல் ஆகிய இரு கருத்துகளும் உள்ளன. முதன்மை உரை நிலைபெற்ற பரந்த சடங்கு-இறையியல் சொல்லைப் பயன்படுத்துகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் சடங்கு உரைக்கு ஏற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘பாவநிவிர்த்தி’ என்ற பரிச்சயமான இறையியல் சொல் வைத்துக்கொள்ளப்பட்டு அதன் உண்மையான தூய்மைப்படுத்தும் நிழற்பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
