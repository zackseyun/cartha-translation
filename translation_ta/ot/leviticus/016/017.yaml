id: LEV.16.17
reference: Leviticus 16:17
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/כָל אָדָ֞ם לֹא יִהְיֶ֣ה בְּ/אֹ֣הֶל מוֹעֵ֗ד בְּ/בֹא֛/וֹ לְ/כַפֵּ֥ר בַּ/קֹּ֖דֶשׁ עַד צֵאת֑/וֹ וְ/כִפֶּ֤ר בַּעֲד/וֹ֙ וּ/בְעַ֣ד בֵּית֔/וֹ וּ/בְעַ֖ד כָּל קְהַ֥ל יִשְׂרָאֵֽל־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/017.yaml
  text: And no man shall be in the tent of meeting when he enters to make atonement in the holy place, until he comes out. And he shall make atonement for himself, and for his household, and for all the assembly of Israel.
translation:
  language: ta
  text: அவர் பரிசுத்த இடத்தில் பாவநிவிர்த்தி செய்வதற்காகச் சந்திப்புக் கூடாரத்திற்குள் நுழைந்ததுமுதல் வெளியே வரும்வரை, மனிதர் எவரும் அந்தக் கூடாரத்தில் இருக்கக் கூடாது. அவர் தனக்காகவும், தன் வீட்டாருக்காகவும், இஸ்ரவேலின் சபை முழுவதற்காகவும் பாவநிவிர்த்தி செய்ய வேண்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָל אָדָם לֹא
  choice: மனிதர் எவரும் ... இருக்கக் கூடாது
  rationale: 'The Hebrew construction literally says “every human shall not be,” but functions as a universal prohibition: no human/person may be present. This Tamil wording is natural while retaining the comprehensive force.'
- source_word: אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரம்
  rationale: Renders the tent designated for meeting/encounter in clear modern Tamil without using a church-specific term.
- source_word: לְכַפֵּר / וְכִפֶּר
  choice: பாவநிவிர்த்தி செய்வதற்காக / பாவநிவிர்த்தி செய்ய வேண்டும்
  rationale: Conveys the cultic act of making atonement in familiar, dignified Tamil and preserves the repeated Hebrew verb.
- source_word: בַּקֹּדֶשׁ
  choice: பரிசுத்த இடத்தில்
  rationale: Preserves the locative sense and the source text’s general designation “the holy place,” without over-specifying an inner sanctuary.
- source_word: בֵיתוֹ
  choice: தன் வீட்டார்
  rationale: In context, “house” denotes the priest’s household rather than a building.
- source_word: כָּל קְהַל יִשְׂרָאֵל
  choice: இஸ்ரவேலின் சபை முழுவதற்காகவும்
  rationale: Expresses the whole gathered assembly of Israel and preserves the collective character of קהל.
theological_decisions:
- issue: The subject of “when he enters” and “he shall make atonement”
  choice: அவர்
  alternative: ஆரோன்
  rationale: The Hebrew uses a third-person masculine suffix and verb, with Aaron supplied from context. The translation preserves that textual form rather than inserting the proper name.
- issue: Meaning of atonement language
  choice: பாவநிவிர்த்தி செய்ய
  alternative: பரிகாரம் செய்ய
  rationale: The chosen conventional Tamil biblical expression communicates the ritual-theological force of כפר more specifically than a generic remedy or compensation, without explaining a particular theory of atonement.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் மதிப்புமிக்க நடையில் வடிவமைக்கப்பட்டது. முதல் வாக்கியத்தின் காலவரம்பு தமிழில் இயல்பாக இருக்க “நுழைந்ததுமுதல் வெளியே வரும்வரை” என அமைக்கப்பட்டுள்ளது; மூலத்தின் தடைச்சொல்லும் மீளுரையும் பாதுகாக்கப்பட்டுள்ளன.
