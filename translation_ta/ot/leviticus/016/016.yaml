revisions:
- from: இவ்வாறு, இஸ்ரவேல் மக்களின் தீட்டுகளினிமித்தமும் அவர்களுடைய மீறுதல்களினிமித்தமும்—அவர்களுடைய எல்லாப் பாவங்களினிமித்தமும்—அவன் பரிசுத்த இடத்திற்காகப் பாவநிவிர்த்தி செய்வான்.[a] அவர்களுடன், அவர்களுடைய தீட்டுகளின் நடுவே குடிகொண்டிருக்கும் சந்திப்புக் கூடாரத்திற்கும் அவ்வாறே செய்வான்.
  to: இவ்வாறு, இஸ்ரவேல் மக்களின் தீட்டுகளினிமித்தமும் அவர்களுடைய மீறுதல்களினிமித்தமும், அவர்களுடைய எல்லாப் பாவங்களுக்காகவும், அவன் பரிசுத்த இடத்திற்காகப் பாவநிவிர்த்தி செய்வான்.[a] அவர்களுடன், அவர்களுடைய தீட்டுகளின் நடுவே குடிகொண்டிருக்கும் சந்திப்புக் கூடாரத்திற்கும் அவ்வாறே செய்வான்.
  rationale: The revision preserves the draft’s sound terminology and imagery while differentiating the Hebrew causal מן-phrases from לְכָל (‘for all’). It also removes punctuation that over-specifies the relationship between transgressions and sins.
