  yaml_path: translation/ot/leviticus/016/016.yaml
  text: Thus he shall make atonement for the sanctuary because of the uncleannesses of the sons of Israel and because of their transgressions[a], for all their sins[c][b]; and so he shall do for the tent of meeting that dwells with them in the midst of their uncleannesses.
translation:
  language: ta
  text: இவ்வாறு, இஸ்ரவேல் மக்களின் தீட்டுகளினிமித்தமும் அவர்களுடைய மீறுதல்களினிமித்தமும், அவர்களுடைய எல்லாப் பாவங்களுக்காகவும், அவன் பரிசுத்த இடத்திற்காகப் பாவநிவிர்த்தி செய்வான்.[a] அவர்களுடன், அவர்களுடைய தீட்டுகளின் நடுவே குடிகொண்டிருக்கும் சந்திப்புக் கூடாரத்திற்கும் அவ்வாறே செய்வான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பாவநிவிர்த்தி செய்வான்” என்பதை இச்சூழலில் “தீட்டு நீக்குவான்” அல்லது “தூய்மைப்படுத்துவான்” என்றும் பொருள்கொள்ளலாம்; இந்தச் சடங்கு தீட்டையும் பாவத்தையும் எதிர்கொள்கிறது. “பரிசுத்த இடம்” என்பதை “திருத்தலம்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִפֶּר
  choice: பாவநிவிர்த்தி செய்வான்
  rationale: லேவியராகமத்தின் சடங்கியல் சூழலில் כפר என்பது தீட்டையும் பாவத்தையும் எதிர்கொள்ளும் பரிகாரச் செயலைக் குறிக்கிறது. தமிழில் நிலைபெற்ற வேதாகமச் சொல்லான ‘பாவநிவிர்த்தி’ அதன் சடங்கியல்-இறையியல் பரப்பைத் தக்கவைக்கிறது; தூய்மைப்படுத்துதல் என்பது அதன் விளைவின் ஒரு கூறு மட்டுமே.
- source_word: עַל הַקֹּדֶשׁ
  choice: பரிசுத்த இடத்திற்காக
  rationale: הַקֹּדֶשׁ இங்கு அருவமான பரிசுத்தத்தன்மையை அல்ல, பரிசுத்தமான ஆலயப் பகுதியைக் குறிக்கிறது. ‘பரிசுத்த இடம்’ என்பது ‘திருத்தலம்’ என்பதைக் காட்டிலும் மூலச்சொல்லுக்கு நெருக்கமாகவும் இச்சடங்கியல் சூழலில் தெளிவாகவும் உள்ளது.
- source_word: מִטֻּמְאֹת בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்களின் தீட்டுகளினிமித்தம்
  rationale: מִן இங்கு பாவநிவிர்த்திச் செயலைத் தேவைப்படுத்தும் காரணத்தைச் சுட்டுகிறது. טֻמְאוֹת என்பதன் பன்மையை ‘தீட்டுகள்’ காக்கிறது; בְּנֵי יִשְׂרָאֵל என்பது கூட்டாக இஸ்ரவேல் மக்களைக் குறிக்கும் எபிரெய மொழிவழக்கு என்பதால் இயல்பான தமிழில் ‘இஸ்ரவேல் மக்கள்’ என வழங்கப்படுகிறது.
- source_word: וּמִפִּשְׁעֵיהֶם לְכָל חַטֹּאתָם
  choice: அவர்களுடைய மீறுதல்களினிமித்தமும்—அவர்களுடைய எல்லாப் பாவங்களினிமித்தமும்—
  rationale: פשע என்பதன் குற்றத்தன்மையையும் எதிர்ப்புத் தொனியையும் ‘மீறுதல்’ காக்கிறது. לְכָל חַטֹּאתָם என்பதை முந்தைய குற்றவகைகளைக் முழுமைப்படுத்தும் விளக்கத் தொடராகக் காட்ட இடைக்கோடுகள் பயன்படுத்தப்பட்டுள்ளன; இதனால் எபிரெய உரையின் சற்றே நெருக்கமான தொடரமைப்பும் காக்கப்படுகிறது.
- source_word: לְאֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரத்திற்கு
  rationale: אֹהֶל מוֹעֵד என்பதன் கூறுகளைத் தெளிவாக வெளிப்படுத்தும் இயல்பான தமிழ்; மரபுசார் கடன்சொல்லைத் தவிர்க்கிறது.
- source_word: הַשֹּׁכֵן אִתָּם בְּתוֹךְ טֻמְאֹתָם
  choice: அவர்களுடன், அவர்களுடைய தீட்டுகளின் நடுவே குடிகொண்டிருக்கும்
  rationale: שׁכן என்பதன் ‘குடியிருத்தல்/குடிகொள்ளுதல்’ பொருளையும், கூடாரம் தீட்டுகளின் நடுவிலும் அவர்களுடன் இருப்பதாக உரை கூறும் வலுவான படிமத்தையும் காக்கிறது.
theological_decisions:
- issue: பாவநிவிர்த்தியும் தூய்மைப்படுத்துதலும்
  choice: כפר என்பதை ‘பாவநிவிர்த்தி செய்வான்’ என வழங்குதல்
  alternative: ‘தீட்டு நீக்குவான்’ அல்லது ‘தூய்மைப்படுத்துவான்’
  rationale: இந்த வசனத்தில் சடங்கு தீட்டையும் மீறுதல்களையும் பாவங்களையும் எதிர்கொள்கிறது. ‘தூய்மைப்படுத்துதல்’ மட்டும் என மொழிபெயர்த்தால் சடங்கின் பரிகாரப் பரப்பு குறுகிவிடும்; அதேவேளை மாற்றுப் பொருள் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- issue: சந்திப்புக் கூடாரம் ‘குடிகொண்டிருப்பது’
  choice: எபிரெய இலக்கணத்தின்படி கூடாரத்தையே ‘குடிகொண்டிருக்கும்’ என வர்ணித்தல்
  alternative: அங்கே இறைவன் குடியிருப்பதாக வெளிப்படையாக மாற்றிக் கூறுதல்
  rationale: மூல உரையில் הַשֹּׁכֵן என்பது אֹהֶל מוֹעֵד என்பதோடு தொடர்புடையது. இறைவனின் இருப்பை விளக்கமாகச் சேர்ப்பது சாத்தியமான இறையியல் உட்பொருளை உரையிலேயே தீர்மானித்து விடும்; ஆகவே மூலத்தின் படிமமும் பதற்றமும் காக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் மதிப்புமிக்க நடையில் வடிவமைக்கப்பட்டது. ‘பாவநிவிர்த்தி’ சடங்கியல் துல்லியத்திற்காகத் தக்கவைக்கப்பட்டது; ‘தீட்டு’, ‘மீறுதல்’, ‘சந்திப்புக் கூடாரம்’ ஆகியவை மூலத்தின் வேறுபட்ட கருத்துவகைகளைத் தெளிவாகக் காக்கின்றன.
