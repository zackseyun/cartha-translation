  register: நவீன பொதுத்தரத் தமிழ்; சட்டவிதிக்குரிய கண்ணியமான தொனி காக்கப்பட்டுள்ளது. ‘நியமம்’, ‘பாவநிவிர்த்தி’ போன்ற வேதாகமச் சூழலுக்குத் தேவையான சொற்கள் பயன்படுத்தப்பட்டாலும், வாக்கிய அமைப்பு சாதாரண வாசகர்களுக்குப் புரியுமாறு வைக்கப்பட்டுள்ளது.
