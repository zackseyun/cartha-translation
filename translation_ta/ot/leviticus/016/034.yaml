base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/034.yaml
  text: This shall be for you a permanent statute[a], to make atonement for the sons of Israel for all their sins once in the year[b]. And he did as Yahweh commanded Moses.
translation:
  language: ta
  text: 'இது உங்களுக்கு நிரந்தரமான நியமமாக இருக்கும்: இஸ்ரவேல் மக்களுடைய எல்லாப் பாவங்களுக்காகவும் ஆண்டுக்கு ஒருமுறை பாவநிவிர்த்தி செய்யப்பட வேண்டும்.[a] யாவே மோசேக்குக் கட்டளையிட்டபடியே அவன்[b] செய்தான்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இஸ்ரவேல் மக்களுடைய எல்லாப் பாவங்களிலிருந்தும் பாவநிவிர்த்தி செய்யப்பட வேண்டும்” என்றும் மொழிபெயர்க்கலாம்; இது பாவத்திலிருந்து தூய்மைப்படுத்தும் நுட்பத்தை வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: சூழலில் “அவன்” என்பது ஆரோனைக் குறிக்கலாம்; எபிரெய மூலத்தில் எழுவாயின் பெயர் இவ்வசனத்தில் வெளிப்படையாகக் கூறப்படவில்லை.
    reason: source_ambiguity
lexical_decisions:
- source_word: וְהָיְתָה זֹּאת לָכֶם
  choice: இது உங்களுக்கு ... இருக்க வேண்டும்
  rationale: சட்டவிதியின் தொடர்ச்சியான கட்டாயத் தன்மையை நவீன, இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לְחֻקַּת עוֹלָם
  choice: நிரந்தரமான நியமம்
  rationale: חֻקָּה என்பதன் சட்டவிதிப் பொருளையும் עוֹלָם என்பதன் நீடித்த நிலைத்தன்மையையும் தெளிவாகக் காக்கிறது.
- source_word: לְכַפֵּר
  choice: பாவநிவிர்த்தி செய்ய
  rationale: லேவியராகமம் 16-ன் பலி மற்றும் பரிசுத்தப்படுத்துதல் சார்ந்த சூழலில் כפר என்பதன் வழிபாட்டியல்-இறையியல் பொருளைத் தக்கவைக்கிறது.
- source_word: עַל בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்களுக்காக
  rationale: சொல்லுக்கு சொல் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு முழு உடன்படிக்கை மக்களையும் குறிக்கும் நிலையான இனக்குழுப் பெயராக இருப்பதால் இயல்பான தமிழில் ‘இஸ்ரவேல் மக்கள்’ என வழங்கப்படுகிறது.
- source_word: מִכָּל חַטֹּאתָם
  choice: அவர்களுடைய எல்லாப் பாவங்களுக்காகவும்
  rationale: பாவநிவிர்த்தி செய்யப்படுவதற்கான பாவங்களை இயல்பான தமிழில் குறிக்கிறது; מן முன்னொட்டில் காணப்படும் ‘பாவங்களிலிருந்து நீக்குதல்/தூய்மைப்படுத்துதல்’ நுட்பம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: אַחַת בַּשָּׁנָה
  choice: ஆண்டுக்கு ஒருமுறை
  rationale: வருடந்தோறும் ஒரே முறை நிகழ்வதைத் துல்லியமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וַיַּעַשׂ
  choice: அவன் செய்தான்
  rationale: எபிரெய வினையின் ஒருமை ஆண்பால் எழுவாயைத் தக்கவைக்கிறது; வசனத்தில் பெயர் வெளிப்படையாகக் கூறப்படாததால் ஆரோன் என்று முதன்மை உரையில் சேர்க்கவில்லை.
- source_word: יְהוָה
  choice: யாவே
  rationale: மூலத்தில் நேரடியாக வரும் உடன்படிக்கைப் பெயரை ஒலிபெயர்த்து வழங்குகிறது.
theological_decisions:
- issue: כפר என்ற சொல்லின் பலி-வழிபாட்டியல் பொருள்
  choice: பாவநிவிர்த்தி செய்ய
  alternative: தூய்மைப்படுத்த / பரிகாரம் செய்ய
  rationale: ‘பாவநிவிர்த்தி’ என்பது குற்றம், பலி, தூய்மைப்படுத்துதல் ஆகியவை சந்திக்கும் இந்தச் சூழலின் இறையியல் செறிவைத் தீர்த்துவிடாமல் காக்கிறது.
- issue: בְּנֵי יִשְׂרָאֵל என்ற கூட்டுப்பெயர்
  choice: இஸ்ரவேல் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: இங்கு ஆண்களை மட்டும் அல்லாமல் உடன்படிக்கைச் சமூகத்தையே குறிக்கும் மரபுச் சொற்றொடர் என்பதால், பொருளைத் துல்லியமாகவும் இயல்பாகவும் வழங்குகிறது.
- issue: וַיַּעַשׂ என்பதன் மறைமுக எழுவாய்
  choice: அவன்
  alternative: ஆரோன்
  rationale: சூழலில் ஆரோனைக் குறிக்க வாய்ப்புள்ளது; ஆயினும் இவ்வசனத்தின் எபிரெய உரை பெயரைச் சொல்லாததால் அந்த மறைமுகத்தன்மை முதன்மை உரையில் பாதுகாக்கப்படுகிறது.
