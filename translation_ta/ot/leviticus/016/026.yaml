base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/026.yaml
  text: The one who sends the goat away to Azazel shall wash his clothes and bathe his body in water[a], and afterward he may come into the camp.
translation:
  language: ta
  text: அசாசேலுக்கு[a] வெள்ளாட்டை அனுப்பிவிடுகிறவர் தம் ஆடைகளைத் துவைத்து, தம் உடலைத் தண்ணீரில் கழுவ வேண்டும். அதன் பிறகு அவர் முகாமுக்குள் வரலாம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அசாசேலுக்காக’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல்லின் பொருள் விவாதத்திற்குரியது; அது ஒரு பெயர் அல்லது சிறப்புப் பெயராக இருக்கலாம்; அல்லது அகற்றப்படுதலை, அதாவது ‘போக்காடு’ எனப்படும் கருத்தை, குறிக்கும் செயல்சார் சொல்லாகப் புரிந்துகொள்ளப்படலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהַמְשַׁלֵּחַ
  choice: அனுப்பிவிடுகிறவர்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் எபிரெயப் பங்கேற்புவினை, வெள்ளாட்டை அனுப்பும் பொறுப்புடைய நபரைக் குறிக்கிறது. ‘அனுப்பிவிடுகிறவர்’ என்பது அந்தப் பங்கையும் விலக்கி அனுப்பும் செயலையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַשָּׂעִיר
  choice: வெள்ளாட்டை
  rationale: பலியிடும் சூழலில் இது ஆண் வெள்ளாட்டைக் குறித்தாலும், முன்சூழலில் குறிப்பிட்ட மிருகம் ஏற்கெனவே அடையாளப்படுத்தப்பட்டிருப்பதால் ‘வெள்ளாடு’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: לַעֲזָאזֵל
  choice: அசாசேலுக்காக
  rationale: לְ முன்னிடைச்சொல் இலக்கு அல்லது ஒதுக்கீட்டைக் குறிக்கலாம். சர்ச்சைக்குரிய עֲזָאזֵל என்பதை விளக்கிப் பொருள் தீர்மானிக்காமல் ஒலிபெயர்த்து, ‘-க்காக’ எனக் கொடுப்பது ‘அசாசேலுக்காக ஒதுக்கப்பட்ட வெள்ளாடு’ என்ற சடங்குச் சூழலைத் தமிழில் இயல்பாகத் தருகிறது; மாற்று நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: தம் ஆடைகளைத் துவைத்து
  rationale: சடங்குத் தூய்மையாக்கத்தில் ஆடைகளை நீரால் துவைப்பதைக் குறிக்கும் வழக்கமான சொற்றொடர். ‘துவைத்து’ என்பது நவீனத் தமிழில் துல்லியமானதும் இயல்பானதும்.
- source_word: וְרָחַץ אֶת־בְּשָׂרוֹ בַּמָּיִם
  choice: தம் உடலைத் தண்ணீரில் கழுவ வேண்டும்
  rationale: בָּשָׂר என்பதன் நேர்ப்பொருள் ‘சதை’ என்றாலும், இச்சடங்குச் சூழலில் முழு உடலைக் குறிக்கிறது. ‘உடலைத் தண்ணீரில் கழுவ’ என்பது பொருளைத் தெளிவாகவும் மரியாதையான நடையிலும் தெரிவிக்கிறது.
- source_word: וְאַחֲרֵי כֵן
  choice: அதன் பிறகு
  rationale: செயல்களின் காலவரிசையை நேரடியாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: יָבֹא אֶל־הַמַּחֲנֶה
  choice: அவர் முகாமுக்குள் வரலாம்
  rationale: கழுவிய பின்னரே முகாமில் மீண்டும் நுழைய அனுமதி உண்டு என்ற சடங்கு ஒழுங்கை ‘வரலாம்’ தெளிவுபடுத்துகிறது; இதை ஒரு புதிய கட்டளையாக மாற்றுவதில்லை.
theological_decisions:
- issue: பாவநிவாரண நாளின் சடங்கில் לַעֲזָאזֵל என்பதன் பொருள்
  choice: ‘அசாசேல்’ என ஒலிபெயர்த்து, பிரதான உரையில் ‘அசாசேலுக்காக’ என வழங்குதல்
  alternative: ‘அசாசேலிடம்,’ ‘அகற்றப்படுவதற்காக,’ அல்லது ‘போக்காடு’ என விளக்கிப் பெயர்த்தல்
  rationale: இந்த எபிரெயச் சொல்லின் பொருளும் அது ஒரு தனிப்பெயரா, சடங்குச் செயல்பாட்டைக் குறிக்கும் சொல்லா என்பதும் விவாதத்திற்குரியது. ஒலிபெயர்ப்பு அந்தத் தெளிவின்மையையும் இறையியல் அழுத்தத்தையும் பாதுகாக்கிறது; அடிக்குறிப்பு முக்கிய மாற்று புரிதல்களைக் குறிப்பிடுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சட்ட-சடங்கு உரைக்கு ஏற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ஒரே நபரை மரியாதையுடன் குறிக்க ‘அவர்/தம்’ அமைப்பு பயன்படுத்தப்பட்டது. ‘அசாசேல்’ விளக்கிப் பொருள் தீர்மானிக்கப்படாமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
