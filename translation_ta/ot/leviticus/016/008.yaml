reference: Leviticus 16:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/נָתַ֧ן אַהֲרֹ֛ן עַל שְׁנֵ֥י הַ/שְּׂעִירִ֖ם גּוֹרָל֑וֹת גּוֹרָ֤ל אֶחָד֙ לַ/יהוָ֔ה וְ/גוֹרָ֥ל אֶחָ֖ד לַ/עֲזָאזֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/008.yaml
  text: 'And Aaron shall cast lots over the two goats: one lot for Yahweh and one lot for Azazel[a].'
translation:
  language: ta
  text: 'ஆரோன் அந்த இரண்டு வெள்ளாடுகளுக்காகச் சீட்டுப் போட வேண்டும்: ஒரு சீட்டு யெகோவாவுக்காகவும், ஒரு சீட்டு அசாசேலுக்காகவும்[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒரு சீட்டு போக்காட்டுக்காக.” ‘அசாசேல்’ என்ற எபிரெயச் சொல்லின் பொருள் விவாதத்திற்குரியது; அது ஒரு தனிப்பெயராகவோ, வெள்ளாட்டின் பணியைக் குறிப்பதாகவோ, அகற்றுதலோடு தொடர்புடைய சொல்லாகவோ புரிந்துகொள்ளப்படலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וְנָתַן
  choice: சீட்டுகளைப் போட வேண்டும்
  rationale: வினைச்சொல் சொற்பொருளில் ‘வைக்க/கொடுக்க’ என்பதைக் குறித்தாலும், גּוֹרָלוֹת மற்றும் עַל உடன் வரும் இச்சடங்குச் சூழலில் சீட்டுப் போட்டு ஒதுக்குவதைக் குறிக்கிறது. இயல்பான நவீனத் தமிழில் ‘சீட்டுகளைப் போட’ என்பது அந்தச் செயலைத் தெளிவாகக் காட்டுகிறது.
- source_word: עַל
  choice: மேல்
  rationale: எபிரெய முன்னிடைச்சொல்லின் ‘மேல்/மீது’ என்ற படிமத்தைப் பேணி, சீட்டுகள் இரண்டு வெள்ளாடுகளைப் பற்றிப் போடப்படுவதைச் சொல்கிறது.
- source_word: שְׁנֵי הַשְּׂעִירִם
  choice: அந்த இரண்டு வெள்ளாடுகள்
  rationale: שָׂעִיר இங்கு ஆண் வெள்ளாட்டைக் குறிக்கக்கூடும்; எனினும் சடங்குச் சூழலிலும் முந்தைய வசனத்திலும் பாலினம் தெளிவாக இருப்பதால், இயல்பான தமிழுக்கு ‘வெள்ளாடுகள்’ போதுமானது.
- source_word: גּוֹרָלוֹת
  choice: சீட்டுகள்
  rationale: சடங்குமுறையில் தேர்வு அல்லது ஒதுக்கீடு செய்வதற்குப் பயன்படுத்தப்படும் lots என்பதற்கான வழக்கமான தமிழ் சொல்.
- source_word: גּוֹרָל אֶחָד
  choice: ஒரு சீட்டு
  rationale: மீண்டும் வரும் ஒருமைச் சொற்றொடரை நேரடியாகவும் சடங்கு ஒதுக்கீட்டுக்கு ஏற்றவாறும் மொழிபெயர்க்கிறது.
- source_word: לַיהוָה
  choice: யெகோவாவுக்காக
  rationale: தெய்வீகப் பெயரான יהוה-ஐ பெயராகத் தமிழில் ஒலிபெயர்த்து, ל முன்னொட்டின் ஒதுக்கீட்டுப் பொருளை ‘-க்காக’ என வழங்குகிறது.
- source_word: לַעֲזָאזֵל
  choice: அசாசேலுக்காக
  rationale: עֲזָאזֵל என்பதன் பொருள் விவாதத்திற்குரியது. அதை விளக்கமாகத் தீர்மானிக்காமல் பெயர்போல் ஒலிபெயர்ப்பது மூலத்தின் தெளிவின்மையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: பாவநிவாரண நாளின் சடங்கில் עֲזָאזֵל என்பதன் பொருள்
  choice: முதன்மை உரையில் மொழிபெயர்க்காமல் ‘அசாசேல்’ என ஒலிபெயர்த்தல்
  alternative: ‘போக்காடு’, ‘முழுமையான அகற்றுதல்’, அல்லது வனாந்தரத்தோடு தொடர்புடைய ஓர் ஆளுமை/உருவம்
  rationale: இந்தச் சொல் வெள்ளாட்டின் பணி, அது அனுப்பப்படும் இடம், அல்லது ஓர் ஆளுமை ஆகியவற்றில் எதைக் குறிக்கிறது என்பதை வசனம் மட்டும் உறுதியாகத் தீர்மானிக்கவில்லை. ஒலிபெயர்ப்பு அந்த இறையியல் மற்றும் சொற்பொருள் பதற்றத்தைத் தீர்க்காமல் பாதுகாக்கிறது; வரலாற்றுச் செல்வாக்குள்ள ‘போக்காடு’ வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சடங்கின் கண்ணியத்தையும் எபிரெய உரையின் மீளுரையையும் பேணும் தெளிவான நடை. ‘அசாசேல்’ குறித்த உண்மையான தெளிவின்மை முதன்மை உரையிலும் அடிக்குறிப்பிலும் பாதுகாக்கப்பட்டுள்ளது.
