  to: 'ஆரோன் அந்த இரண்டு வெள்ளாடுகளுக்காகச் சீட்டுப் போட வேண்டும்: ஒரு சீட்டு யெகோவாவுக்காகவும், ஒரு சீட்டு அசாசேலுக்காகவும்[a].'
