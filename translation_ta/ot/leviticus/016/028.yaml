base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/028.yaml
  text: The one who burns them shall wash his clothes and bathe his body in water[b][a], and afterward he may come into the camp.
translation:
  language: ta
  text: அவற்றை எரிப்பவன் தன் உடைகளைக் கழுவி, தன் உடலை[b]த் தண்ணீரில் கழுவ வேண்டும். அதற்குப் பிறகு அவன் முகாமுக்குள் வரலாம்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவன் முகாமுக்குள் வருவான்.” எபிரெய வினைச்சொல்லை எளிய எதிர்காலமாக வாசிக்கலாம்; ஆனால் இங்கு தூய்மைப்படுத்தலுக்குப் பின் மீண்டும் நுழைய அனுமதி கிடைப்பதைக் குறிப்பதாகத் தோன்றுகிறது.
    reason: alternative_reading
  - marker: b
    text: சொல்லுக்குச் சொல், “தன் சதையை.” இந்தக் கழுவுதல் வழக்கில் அது “தன் உடலை” என்று பொருள்படும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַשֹּׂרֵף
  choice: எரிப்பவன்
  rationale: குறிப்பிட்டவற்றை எரிக்கும் நபரைக் குறிக்கும் பெயர்ச்சொல் பொருளுடைய எபிரெயப் பெயரெச்சத்தை இயல்பான தமிழில் தருகிறது.
- source_word: אֹתָם
  choice: அவற்றை
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட காளை மற்றும் வெள்ளாட்டுக்கடா அல்லது அவற்றின் எஞ்சிய பகுதிகளைச் சுட்டுகிறது.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: தன் உடைகளைக் கழுவி
  rationale: சடங்குச் சட்டத்தின் கட்டளையைத் தெரிவிக்கிறது; தொடரும் இரு செயல்களையும் இயல்பான தமிழ் வாக்கியமாக இணைக்க வினையெச்சம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: וְרָחַץ אֶת־בְּשָׂרוֹ בַּמָּיִם
  choice: தன் உடலைத் தண்ணீரில் குளிப்பாட்ட வேண்டும்
  rationale: בשר என்பதன் சொற்பொருள் ‘சதை’ என்றாலும், இந்தக் கழுவுதல் மரபுத்தொடரில் முழு உடலையே குறிக்கிறது. உடைகளைக் கழுவுவதிலிருந்து உடலைக் குளிப்பாட்டுவதைத் தெளிவாக வேறுபடுத்துகிறது.
- source_word: וְאַחֲרֵי כֵן
  choice: அதற்குப் பிறகு
  rationale: தூய்மைப்படுத்தும் செயல்கள் முடிந்த பின்பே அடுத்த செயல் நிகழ்வதைத் தெளிவாகக் குறிக்கிறது.
- source_word: יָבֹא אֶל־הַמַּחֲנֶה
  choice: அவன் முகாமுக்குள் வரலாம்
  rationale: சூழலில் கழுவிய பின் மீண்டும் முகாமுக்குள் நுழைய அனுமதி கிடைப்பதை ‘வரலாம்’ இயல்பாகத் தெரிவிக்கிறது; எளிய எதிர்கால வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: இறுதிக் கூற்றின் சடங்குத் தூய்மை சார்ந்த வலிமை
  choice: 'தூய்மைப்படுத்தலுக்குப் பிறகு மீண்டும் நுழைய அனுமதி: ‘முகாமுக்குள் வரலாம்’'
  alternative: 'எளிய எதிர்காலம் அல்லது விதிப்பொருள்: ‘முகாமுக்குள் வருவான்/வர வேண்டும்’'
  rationale: வசனத்தின் ஒழுங்கு, உடைகளையும் உடலையும் கழுவிய பின்னரே முகாமுக்குள் மீண்டும் நுழைய முடியும் என்பதைக் காட்டுகிறது. ‘வரலாம்’ இந்த அனுமதி/மீள்சேர்க்கைப் பொருளைத் தருகிறது; மாற்று இலக்கண வாசிப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், சடங்குச் சட்டத்திற்கேற்ற கண்ணியமான ஆனால் பொதுமக்களுக்கு எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘உடைகள்’, ‘உடல்’, ‘முகாம்’ ஆகியவை தெளிவான நடப்பு சொற்களாகத் தேர்ந்தெடுக்கப்பட்டுள்ளன; எபிரெயத்தின் உண்மையான மாற்று வாசிப்புகள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
