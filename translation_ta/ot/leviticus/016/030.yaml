  text: כִּֽי בַ/יּ֥וֹם הַ/זֶּ֛ה יְכַפֵּ֥ר עֲלֵי/כֶ֖ם לְ/טַהֵ֣ר אֶתְ/כֶ֑ם מִ/כֹּל֙ חַטֹּ֣אתֵי/כֶ֔ם לִ/פְנֵ֥י יְהוָ֖ה תִּטְהָֽרוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/030.yaml
  text: For on this day atonement shall be made for you to cleanse you[b][a]; from all your sins before Yahweh you shall be clean.
translation:
  language: ta
  text: ஏனெனில், இந்த நாளில் உங்களைத் தூய்மைப்படுத்துவதற்காக உங்களுக்காகப் பாவநிவிர்த்தி செய்யப்படும்[a]; யாவேக்கு முன்பாக உங்கள் எல்லாப் பாவங்களிலிருந்தும் நீங்கள் தூய்மையாவீர்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர் உங்களுக்காகப் பாவநிவிர்த்தி செய்வார்.” எபிரெய வினை ஒருமையில் உள்ளது; ஆனால் இந்தக் கூறில் அதன் எழுவாய் வெளிப்படையாகச் சொல்லப்படவில்லை.
    reason: lexical_alternative
  - marker: b
    text: “தூய்மையாவீர்கள்” என்பதை “தூய்மையாக இருப்பீர்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கட்டளைக்கான காரணத்தை அல்லது விளக்கத்தை அறிமுகப்படுத்துகிறது.
- source_word: בַיּוֹם הַזֶּה
  choice: இந்த நாளில்
  rationale: எபிரெயச் சுட்டுப்பெயரின் உடனடித்தன்மையையும் சடங்கு நாளின் குறிப்பையும் காக்கிறது.
- source_word: יְכַפֵּר עֲלֵיכֶם
  choice: உங்களுக்காகப் பாவநிவிர்த்தி செய்யப்படும்
  rationale: כפר என்பதன் பலிச் சடங்கு சார்ந்த பொருளைத் தருகிறது; வினை ஒருமையில் இருந்தும் எழுவாய் வெளிப்படையாக இல்லாததால், தமிழில் செயப்பாட்டு வடிவம் எழுவாயைத் தேவையின்றி நிர்ணயிப்பதைத் தவிர்க்கிறது.
- source_word: לְטַהֵר אֶתְכֶם
  choice: உங்களைத் தூய்மைப்படுத்துவதற்காக
  rationale: பாவநிவிர்த்தியின் நோக்கம் அல்லது விளைவாகிய தூய்மைப்படுத்துதலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מִכֹּל חַטֹּאתֵיכֶם
  choice: உங்கள் எல்லாப் பாவங்களிலிருந்தும்
  rationale: இங்கு חטאת என்பது பாவபலிகளைக் காட்டிலும் மக்களின் பாவங்களைக் குறிக்கிறது.
- source_word: לִפְנֵי יְהוָה
  choice: யாவேக்கு முன்பாக
  rationale: தேவநாமமான יהוה-ஐ பெயராகவே வழங்கி, לִפְנֵי என்பதன் 'முன்பாக/சந்நிதியில்' என்ற பொருளைக் காக்கிறது.
- source_word: תִּטְהָרוּ
  choice: நீங்கள் தூய்மையாவீர்கள்
  rationale: முந்தைய பீயேல் வடிவமான 'தூய்மைப்படுத்த' என்பதிலிருந்து வேறுபட்டு, இக்கால் வடிவம் விளைவான தூய்மை நிலையைச் சுட்டுகிறது.
theological_decisions:
- issue: יהוה என்ற தேவநாமத்தின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் உள்ள உடன்படிக்கைப் பெயரை பொதுப்பட்டத்தால் மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: כפר என்ற பலிச் சடங்கு சொல்
  choice: பாவநிவிர்த்தி செய்யப்படும்
  alternative: அவர் பாவநிவிர்த்தி செய்வார்
  rationale: பிற்காலப் பாவநிவிர்த்திக் கோட்பாடுகளில் ஒன்றைத் திணிக்காமல் சடங்கு சார்ந்த பொருளைக் காக்கிறது; வெளிப்படையாகக் கூறப்படாத எழுவாயையும் நிர்ணயிக்கவில்லை.
- issue: תִּטְהָרוּ என்பதன் செயலா அல்லது விளைவு நிலையா
  choice: நீங்கள் தூய்மையாவீர்கள்
  alternative: நீங்கள் தூய்மைப்படுத்தப்படுவீர்கள்
  rationale: கால் வினைவடிவத்தை விளைவான தூய்மை நிலையாகத் தருவதன் மூலம், முன் வரும் பீயேல் infinitive-இன் செயப்படுத்தும் நுணுக்கத்திலிருந்து வேறுபாட்டைக் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; சடங்கு மற்றும் இறையியல் செறிவைத் தக்கவைக்கும் கண்ணியமான, பொதுவாசகருக்குப் புரியும் நடை. 'பாவநிவிர்த்தி' என்பது இச்சூழலுக்கேற்ற நிறுவப்பட்ட சொல். மூலத்தின் எழுவாய் தெளிவின்மையும், தூய்மைப்படுத்தும் செயல் மற்றும் தூய்மை நிலை ஆகியவற்றின் வேறுபாடும் காக்கப்பட்டுள்ளன.
