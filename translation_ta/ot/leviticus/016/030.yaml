  source_fidelity: மூல எபிரெயத்தின் காரணவிளக்கத் தொடர்பு (כִּי), காலக்குறிப்பு, வெளிப்படையாகக் கூறப்படாத ஒருமை எழுவாயுடனான כפר வினை, தூய்மைப்படுத்தும் நோக்க infinitive, ‘எல்லாப் பாவங்களிலிருந்தும்,’ யாவேக்கு முன்பாக, மற்றும் இறுதியான தூய்மை நிலை ஆகிய அனைத்தும் துல்லியமாகக் காக்கப்பட்டுள்ளன. செயப்பாட்டு வடிவம் மூலத்தில் வெளிப்படையாக இல்லாத செய்பவரைச் சேர்க்காமல் இயல்பாகச் செயல்படுகிறது.
