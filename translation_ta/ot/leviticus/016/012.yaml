source:
  edition: WLC
  text: וְ/לָקַ֣ח מְלֹֽא הַ֠/מַּחְתָּה גַּֽחֲלֵי אֵ֞שׁ מֵ/עַ֤ל הַ/מִּזְבֵּ֨חַ֙ מִ/לִּ/פְנֵ֣י יְהוָ֔ה וּ/מְלֹ֣א חָפְנָ֔י/ו קְטֹ֥רֶת סַמִּ֖ים דַּקָּ֑ה וְ/הֵבִ֖יא מִ/בֵּ֥ית לַ/פָּרֹֽכֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/012.yaml
  text: And he shall take a full censer of coals of fire from upon the altar before Yahweh[a], and both the fullness of his hands of finely ground fragrant incense, and bring it inside the veil.
translation:
  language: ta
  text: அவன் யாவேக்கு முன்பாக இருக்கும் பலிபீடத்தின்மேலிருந்து நெருப்புத் தணல்களால் நிரம்பிய ஒரு தூபக்கலசத்தை எடுத்துக்கொள்ள வேண்டும். நன்றாகப் பொடியாக்கப்பட்ட நறுமணத் தூபத்தைத் தன் இரு கைகளும் நிறைய அள்ளிக்கொண்டு, அவற்றைத் திரைக்குப் பின்னால்[a] கொண்டுவர வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘திரைக்குள்.’ எபிரெயச் சொற்றொடர், திரையால் பிரிக்கப்பட்ட உட்புறப் பரிசுத்த இடத்திற்குத் தூபக்கலசத்தையும் தூபத்தையும் கொண்டுசெல்வதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: எடுத்துக்கொள்ள வேண்டும்
  rationale: சடங்குமுறை விதியில் வரும் இந்த வினைச்சொல் கட்டளையைக் குறிக்கிறது; நவீனத் தமிழில் ‘வேண்டும்’ அமைப்பு இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מְלֹא הַמַּחְתָּה
  choice: தூபக்கலசத்தை நிறைத்து
  rationale: ‘கலசத்தின் நிறைவு’ என்ற எபிரெய அளவுச் சொல்லை, பாத்திரம் முழுவதும் நிரம்பியிருப்பதைத் தெளிவாகக் காட்டும் இயல்பான தமிழில் வழங்குகிறது.
- source_word: גַּחֲלֵי אֵשׁ
  choice: நெருப்புத்தணல்கள்
  rationale: தீப்பற்றி எரியும் தணல்களைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: מֵעַל הַמִּזְבֵּחַ
  choice: பலிபீடத்தின்மேல் உள்ள
  rationale: தணல்கள் பலிபீடத்தின் மேற்பரப்பிலிருந்து எடுக்கப்படுகின்றன என்ற இடவியல் விவரத்தைப் பாதுகாக்கிறது.
- source_word: מִלִּפְנֵי יְהוָה
  choice: யாவேக்கு முன்பாக இருக்கும்
  rationale: இந்தச் சொற்றொடர் பலிபீடம் யாவேயின் முன்னிலையில் அமைந்திருப்பதைக் குறிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய வேதப்பெயரான YHWH-ஐ ஒரு பட்டத்தால் மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: וּמְלֹא חָפְנָיו
  choice: தன் இரு கைகளும் நிறைய அள்ளிக்கொண்டு
  rationale: இரு உள்ளங்கைகளையும் குறிக்கும் எபிரெய இருமை வடிவத்தையும், அவற்றின் முழு அளவையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: קְטֹרֶת סַמִּים דַּקָּה
  choice: நன்றாகப் பொடியாக்கப்பட்ட நறுமணத் தூபம்
  rationale: நறுமணப் பொருளால் செய்யப்பட்ட தூபத்தையும் அது நுண்ணியதாக இடிக்கப்பட்டிருந்ததையும் இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: וְהֵבִיא
  choice: கொண்டுவர வேண்டும்
  rationale: சடங்கு அறிவுறுத்தலின் தொடர்ச்சியையும் பொருட்களை குறிப்பிட்ட இடத்திற்குள் எடுத்துச் செல்லும் இயக்கத்தையும் காட்டுகிறது.
- source_word: מִבֵּית לַפָּרֹכֶת
  choice: திரைக்குப் பின்னால்
  rationale: திரையால் பிரிக்கப்பட்ட உட்புறப் பரிசுத்த இடத்திற்குள் கொண்டுசெல்லப்படுவதைத் தெளிவாகக் கூறுகிறது; எபிரெயச் சொற்றொடரின் சுருக்கமான இடவியல் அமைப்பு அடிக்குறிப்பில் விளக்கப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக வருவதால், அதை ஒரு பொதுப் பட்டத்தால் மாற்றாமல் ஒலிபெயர்த்துள்ளது.
- issue: מִבֵּית לַפָּרֹכֶת குறிக்கும் இடம்
  choice: திரைக்குப் பின்னால்
  alternative: திரைக்குள்
  rationale: இது திரையைத் தாண்டிய உள் பரிசுத்த இடத்தைக் குறிக்கிறது. மூலத்தின் சுருக்கமான சொற்றொடரைத் தவறான திசை அர்த்தமின்றி இயல்பான தமிழில் வழங்கி, மாற்று வடிவத்தை அடிக்குறிப்பில் தக்கவைத்துள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சடங்குமுறை அறிவுறுத்தலுக்கேற்ற கண்ணியமான ‘வேண்டும்’ நடையைக் கொண்டுள்ளது. ‘இரு கைகளும் நிறைய’ என்பது மூலத்தின் இருமை வடிவத்தை வெளிப்படையாகப் பாதுகாக்கிறது; வாக்கியத்தை இரண்டாகப் பிரித்தது தமிழில் தெளிவையும் இயல்பையும் மேம்படுத்துகிறது.
