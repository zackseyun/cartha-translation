base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/014.yaml
  text: And he shall take some of the bull's blood and sprinkle it with his finger on the front of the mercy seat[a], eastward; and before the mercy seat he shall sprinkle some of the blood with his finger seven times.
translation:
  language: ta
  text: பின்பு அவன் காளையின் இரத்தத்தில் சிறிதை எடுத்து, தன் விரலால் கிருபாசனத்தின்[a] மேல், அதன் கிழக்குப் பக்கத்தில் தெளிக்க வேண்டும். கிருபாசனத்தின் முன்பாகவும் அவன் தன் விரலால் அந்த இரத்தத்தில் சிறிதை ஏழு முறை தெளிக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பாவநிவாரண மூடி.” எபிரெயச் சொல்லான கப்போரேத் உடன்படிக்கைப் பெட்டியின் மூடியைக் குறிக்கிறது; அது பாவநிவாரணத்துடன் தொடர்புடையது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: பின்பு அவன் ... எடுத்து
  rationale: சடங்கு நடைமுறையைத் தொடரும் கட்டளையாக இருப்பதால், தமிழில் இயல்பான தொடர்ச்சியையும் விதிப்பொருளையும் காட்டுகிறது.
- source_word: מִדַּם הַפָּר
  choice: காளையின் இரத்தத்தில் சிறிதை
  rationale: מִן இங்கு பகுதியைக் குறிக்கிறது; இரத்தம் முழுவதையும் அல்ல, அதில் ஒரு பகுதியை எடுத்துக்கொள்வதைத் தெளிவாக்குகிறது.
- source_word: וְהִזָּה / יַזֶּה
  choice: தெளிக்க வேண்டும்
  rationale: ஆசாரியச் சடங்கில் விரலால் இரத்தத்தைப் பயன்படுத்தும் செயலை இயல்பாகவும் தெளிவாகவும் குறிக்கிறது; விதிப்பொருளையும் காக்கிறது.
- source_word: בְאֶצְבָּעוֹ
  choice: தன் விரலால்
  rationale: בְּ கருவியைக் குறிக்கிறது; செயலைச் செய்பவரின் சொந்த விரல் என்பதையும் தமிழ் பிரதிபெயர் இயல்பாகத் தெரிவிக்கிறது.
- source_word: עַל פְּנֵי הַכַּפֹּרֶת קֵדְמָה
  choice: கிருபாசனத்தின் முன்புறத்தில் கிழக்கு நோக்கி
  rationale: פְּנֵי என்பதன் இடவியல் பொருளையும் קֵדְמָה என்பதன் கிழக்குத் திசை நோக்கையும் வேறுபடுத்திப் பாதுகாக்கிறது.
- source_word: וְלִפְנֵי הַכַּפֹּרֶת
  choice: கிருபாசனத்துக்கு முன்பாகவும்
  rationale: முதல் தெளிப்பு மூடியின் முன்புறத்தின் மேல் நிகழ்வதையும், அடுத்த தெளிப்பு அதற்கு முன்பாக நிகழ்வதையும் வேறுபடுத்துகிறது.
- source_word: שֶׁבַע פְּעָמִים
  choice: ஏழு முறை
  rationale: சடங்கில் முக்கியமான எண்ணிக்கையைத் தெளிவாகவும் நேரடியாகவும் பாதுகாக்கிறது.
- source_word: הַכַּפֹּרֶת
  choice: கிருபாசனம்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் அறியப்பட்ட வழிபாட்டுச் சொல்; பொருளின் உடலமைப்பை நேரடியாகக் காட்டும் மாற்றை அடிக்குறிப்பில் வழங்குவது தெளிவை மேம்படுத்துகிறது.
theological_decisions:
- issue: הַכַּפֹּרֶת என்பதன் மொழிபெயர்ப்பு
  choice: கிருபாசனம்
  alternative: பாவநிவாரண மூடி
  rationale: இச்சொல் உடன்படிக்கைப் பெட்டியின் மூடியையும் பாவநிவாரணச் சடங்குடன் தொடர்புடைய இடத்தையும் குறிக்கிறது. மரபாக அறியப்பட்ட வழிபாட்டுச் சொல்லை முதன்மை உரையில் வைத்துக்கொண்டு, அதன் உடலமைப்பு மற்றும் சடங்குப் பொருளை உணர்த்தும் மாற்றை அடிக்குறிப்பில் தருவது இரு கூறுகளையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சடங்கு விதிப்பொருளை ‘வேண்டும்’ வடிவில் வெளிப்படுத்துகிறது. ‘கிருபாசனம்’ என்ற அறியப்பட்ட வழிபாட்டுச் சொல் வைக்கப்பட்டாலும், அதன் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது. ‘முன்புறத்தில்’ மற்றும் ‘முன்பாக’ என்ற சொற்கள் இரு தெளிப்பு இடங்களுக்கிடையிலான வேறுபாட்டைக் காக்கின்றன.
