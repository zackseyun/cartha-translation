revisions:
- from: பின்பு அவன் காளையின் இரத்தத்தில் சிறிதை எடுத்து, தன் விரலால் கிருபாசனத்தின்[a] முன்புறத்தில் கிழக்கு நோக்கித் தெளிக்க வேண்டும். கிருபாசனத்துக்கு முன்பாகவும் அந்த இரத்தத்தில் சிறிதைத் தன் விரலால் ஏழு முறை தெளிக்க வேண்டும்.
