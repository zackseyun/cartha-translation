source:
  edition: WLC
  text: בְּ/זֹ֛את יָבֹ֥א אַהֲרֹ֖ן אֶל הַ/קֹּ֑דֶשׁ בְּ/פַ֧ר בֶּן בָּקָ֛ר לְ/חַטָּ֖את וְ/אַ֥יִל לְ/עֹלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/003.yaml
  text: 'With this Aaron shall enter the Holy Place: with a bull from the herd for a sin offering[b][a], and a ram for a burnt offering.'
translation:
  language: ta
  text: 'ஆரோன் இவ்வாறு பரிசுத்த ஸ்தலத்திற்குள் வர வேண்டும்: பாவநிவாரணப் பலிக்காக[a] மாட்டு மந்தையிலிருந்து ஒரு காளையுடனும்[b], தகனபலிக்காக ஒரு செம்மறியாட்டுக் கடாவுடனும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தூய்மைப்படுத்தும் பலிக்காக.” எபிரெயச் சொல் பாவத்துடனான தொடர்போடு சடங்குத் தூய்மைப்படுத்துதலையும் வலியுறுத்தக்கூடும்.
    reason: alternative_reading
  - marker: b
    text: எபிரெயத்தில் சொற்சார்ந்து, “ஒரு காளை, மாட்டு மந்தையின் மகன்”; இது மாடுகளிலிருந்து எடுக்கப்பட்ட ஒரு காளையைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/זֹאת
  choice: இவ்வாறு
  rationale: בְּ + זֹאת இங்கு முறை அல்லது வழிமுறையைக் குறிக்கிறது. தொடர்ந்து கூறப்படும் பலிகளோடு ஆரோன் நுழைய வேண்டிய முறையை இயல்பான தமிழில் இது வெளிப்படுத்துகிறது.
- source_word: יָבֹא
  choice: வர வேண்டும்
  rationale: சட்டவிதி சூழலில் இந்த imperfect வடிவம் கட்டளையிடும் அல்லது விதிக்கும் தன்மையுடையது; வெறும் எதிர்காலத்தைவிட ‘வர வேண்டும்’ அந்த வலிமையைத் தெளிவாகக் காட்டுகிறது.
- source_word: אֶל הַ/קֹּדֶשׁ
  choice: புனித இடத்திற்குள்
  rationale: הַקֹּדֶשׁ இங்கு ஆரோன் நுழைய அனுமதிக்கப்படும் புனிதமான உள் இடத்தைக் குறிக்கிறது. ‘புனித இடம்’ என்பது தேவையற்ற கூடுதல் குறிப்பைச் சேர்க்காமல் இயல்பாக உள்ளது.
- source_word: בְּ/פַר בֶּן בָּקָר
  choice: மாட்டு மந்தையிலிருந்து ஒரு காளை
  rationale: ‘ஒரு காளை, மாட்டு மந்தையின் மகன்’ என்ற எபிரெய மரபுத்தொடரின் பொருளை இயல்பான தமிழில் தருகிறது; அதன் சொற்சார்ந்த வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: לְ/חַטָּאת
  choice: பாவநிவாரணப் பலிக்காக
  rationale: பலியிடுதல் சார்ந்த சூழலில் חַטָּאת என்பதற்கான பரவலாகப் புரிந்துகொள்ளப்படும் தமிழ் சொல் இது. சடங்குத் தூய்மைப்படுத்தலை வலியுறுத்தும் மாற்று மொழிபெயர்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְ/אַיִל
  choice: ஒரு செம்மறியாட்டுக் கடா
  rationale: אַיִל என்பது வளர்ந்த ஆண் செம்மறியாட்டைக் குறிக்கிறது; ‘செம்மறியாட்டுக் கடா’ அதைத் துல்லியமாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: לְ/עֹלָה
  choice: தகனபலிக்காக
  rationale: עֹלָה என்பது முழுவதும் எரித்துச் செலுத்தப்படும் பலிக்கான வழக்கமான வழிபாட்டுச் சொல்; ‘தகனபலி’ சுருக்கமாகவும் மரியாதைமிக்க நடையிலும் உள்ளது.
theological_decisions:
- issue: பலியிடுதல் விதிகளில் வரும் חַטָּאת என்ற வழிபாட்டுச் சொல்
  choice: பாவநிவாரணப் பலி
  alternative: தூய்மைப்படுத்தும் பலி
  rationale: இச்சொல் பாவத்துடனான தொடர்பையும் சடங்குத் தூய்மைப்படுத்தும் செயலையும் தாங்கக்கூடும். பழக்கமான முதன்மை மொழிபெயர்ப்பை உரையில் வைத்துக்கொண்டு, அதன் மற்றொரு உண்மையான நுட்பத்தை அடிக்குறிப்பில் பாதுகாப்பது இறையியல் அழுத்தத்தைத் தீர்த்துவிடாமல் காக்கிறது.
translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, பொதுவாசகர்கள் புரிந்துகொள்ளக்கூடிய மரியாதைமிக்க சட்டவிதி நடை பயன்படுத்தப்பட்டுள்ளது. ‘மகா பரிசுத்த ஸ்தலம்’ போன்ற மூலத்தில் வெளிப்படையாக இல்லாத கூடுதல் தனிப்படுத்தலும், குறிப்பிட்ட திருச்சபை மரபைச் சுட்டும் சொற்களும் தவிர்க்கப்பட்டுள்ளன.
