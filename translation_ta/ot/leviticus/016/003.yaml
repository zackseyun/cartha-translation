revisions:
- from: 'ஆரோன் புனித இடத்திற்குள் இவ்வாறு வர வேண்டும்: பாவநிவாரணப் பலிக்காக மாட்டு மந்தையிலிருந்து ஒரு காளையையும்[a][b], தகனபலிக்காக ஒரு செம்மறியாட்டுக் கடாவையும் கொண்டுவர வேண்டும்.'
  to: 'ஆரோன் இவ்வாறு பரிசுத்த ஸ்தலத்திற்குள் வர வேண்டும்: பாவநிவாரணப் பலிக்காக[a] மாட்டு மந்தையிலிருந்து ஒரு காளையுடனும்[b], தகனபலிக்காக ஒரு செம்மறியாட்டுக் கடாவுடனும்.'
  rationale: The revision removes the added verb “bring” and uses “காளையுடனும் … கடாவுடனும்” to represent the Hebrew בְּ (“with”) directly. It also uses the cultically precise but not over-specific “பரிசுத்த ஸ்தலம்” and corrects the placement of both footnote anchors. The disputed semantic range of חַטָּאת remains represented in the footnote without imposing a theological conclusion.
