source:
  edition: WLC
  text: וַ/יְדַבֵּ֤ר יְהוָה֙ אֶל מֹשֶׁ֔ה אַחֲרֵ֣י מ֔וֹת שְׁנֵ֖י בְּנֵ֣י אַהֲרֹ֑ן בְּ/קָרְבָתָ֥/ם לִ/פְנֵי יְהוָ֖ה וַ/יָּמֻֽתוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/001.yaml
  text: And Yahweh spoke to Moses after the death of Aaron’s two sons[a], when they came near before Yahweh and died.
translation:
  language: ta
  text: ஆரோனின் இரண்டு மகன்கள் யாவேக்கு முன்பாக நெருங்கியபோது[a] இறந்தார்கள். அவர்கள் இறந்தபின் யாவே மோசேயிடம் பேசினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள் யாவேக்கு முன்பாக அணுகியபோது.” எபிரெயச் சொற்றொடரை இன்னும் சொல்லுக்குச் சொல்லாக, “அவர்கள் யாவேக்கு முன்பாக நெருங்கியதில்” என்றும் கூறலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பேசினார்
  rationale: தெய்வீக உரையை அறிமுகப்படுத்தும் வழக்கமான எபிரெயக் கதைநடைச் சொல்லை இயல்பாகவும் நேரடியாகவும் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: יְהוָה என்ற இறைப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், அதன் பரவலாக ஏற்றுக்கொள்ளப்பட்ட தமிழ் ஒலிபெயர்ப்பில் தருகிறது.
- source_word: אַחֲרֵי מוֹת שְׁנֵי בְּנֵי אַהֲרֹן
  choice: ஆரோனின் இரண்டு மகன்கள் ... இறந்தபின்
  rationale: ‘ஆரோனின் இரண்டு மகன்களின் மரணத்திற்குப் பின்’ என்ற பொருளை நவீன தமிழில் இயல்பான வினைத் தொடராக வழங்குகிறது; இருவரும் ஒரே நிகழ்வில் இறந்ததைத் தெளிவாக வைத்திருக்கிறது.
- source_word: בְּקָרְבָתָם
  choice: நெருங்கியபோது
  rationale: בְּ + வினையெச்சப் பெயரின் காலப்பொருளான ‘அவர்கள் நெருங்கியபோது’ என்பதைக் காக்கிறது; ஆசாரச் சூழலில் உள்ள அணுகுதலின் நுணுக்கத்தையும் தேவையின்றி விளக்காமல் விடுகிறது.
- source_word: לִפְנֵי יְהוָה
  choice: யாவேக்கு முன்பாக
  rationale: இடத்தையும் தெய்வீக முன்னிலையையும் குறிக்கக்கூடிய எபிரெயச் சொற்றொடரைத் தெளிவாகவும் மரபான முறையிலும் பிரதிபலிக்கிறது.
- source_word: וַיָּמֻתוּ
  choice: இறந்தார்கள்
  rationale: எபிரெய உரையின் சுருக்கமான கதைத் தொடரை நேரடியாகக் காக்கிறது; காரணத்தைக் குறிப்பாகச் சேர்க்கவில்லை.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரை தனிப்பட்ட இறைப்பெயரான நான்கெழுத்துப் பெயரை நேரடியாகப் பயன்படுத்துவதால், பட்டப்பெயரால் மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டது.
- issue: ஆரோனின் மகன்கள் நெருங்கியதற்கும் அவர்கள் இறந்ததற்கும் இடையிலான தொடர்பு
  choice: நெருங்கியபோது இறந்தார்கள்
  alternative: நெருங்கியதால் இறந்தார்கள்
  rationale: எபிரெய בְּקָרְבָתָם காலச் சூழலைத் தெளிவாகக் குறிக்கிறது; காரணத் தொடர்பு சூழலில் உணரப்பட்டாலும், இந்தச் சொல்லமைப்பு தனியே ‘நெருங்கியதால்’ என்று வெளிப்படையாகக் கூறவில்லை. ஆகவே காரணத்தைச் சேர்க்காமல் மூலத்தின் இறுக்கம் காக்கப்பட்டது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாக வாசிக்கும்படி ஒரே நீண்ட எபிரெய வாக்கியம் இரண்டு தமிழ் வாக்கியங்களாக அமைக்கப்பட்டுள்ளது. மூலத்தில் ‘மரணம்/இறந்தார்கள்’ என்ற கருத்து இருமுறை வருவதால், தமிழிலும் அந்த மீளுரை காக்கப்பட்டுள்ளது. நடை மரியாதையானதும் எளிதில் புரியக்கூடியதுமாக உள்ளது.
