  text: כְּתֹֽנֶת בַּ֨ד קֹ֜דֶשׁ יִלְבָּ֗שׁ וּ/מִֽכְנְסֵי בַד֮ יִהְי֣וּ עַל בְּשָׂר/וֹ֒ וּ/בְ/אַבְנֵ֥ט בַּד֙ יַחְגֹּ֔ר וּ/בְ/מִצְנֶ֥פֶת בַּ֖ד יִצְנֹ֑ף בִּגְדֵי קֹ֣דֶשׁ הֵ֔ם וְ/רָחַ֥ץ בַּ/מַּ֛יִם אֶת בְּשָׂר֖/וֹ וּ/לְבֵשָֽׁ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/004.yaml
  text: He shall put on the holy linen tunic[a], and the linen undergarments shall be on his body; he shall tie the linen sash around himself and wrap the linen turban around himself. These are holy garments[b]. He shall wash his body with water then put them on.
translation:
  language: ta
  text: அவர் பரிசுத்தமான சணல்நூல் அங்கியை அணிந்துகொள்ள வேண்டும்; சணல்நூல் உள்ளாடைகள் அவரது உடல்மீது இருக்க வேண்டும். சணல்நூல் இடைக்கச்சையைத் தம்மைச் சுற்றிக் கட்டிக்கொண்டு, சணல்நூல் தலைப்பாகையைத் தலையில் சுற்றிக்கொள்ள வேண்டும். இவை பரிசுத்த ஆடைகள். அவர் தமது உடலைத் தண்ணீரால் கழுவி[a], அவற்றை அணிந்துகொள்ள வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உடல்” என்பதற்கான எபிரெயச் சொல் சொல்லடிப்படையில் “சதை” என்று பொருள்படும்; இவ்வசனத்தில் அது இரண்டு முறை வருகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּתֹנֶת בַּד קֹדֶשׁ
  choice: பரிசுத்தமான சணல்நூல் அங்கி
  rationale: כְּתֹנֶת என்பது உடலில் அணியும் அங்கி; בַּד ஆசாரிய ஆடைகளின் சூழலில் சணல்நூலைக் குறிக்கிறது; קֹדֶשׁ சடங்குப் பணிக்காகப் பிரித்துவைக்கப்பட்ட தன்மையை ‘பரிசுத்தமான’ என்று இயல்பாகக் காட்டுகிறது.
- source_word: מִכְנְסֵי בַד
  choice: சணல்நூல் உள்ளாடைகள்
  rationale: உடலின் கீழ்ப்பகுதியில் நேரடியாக அணியும் ஆசாரிய உடையைத் தெளிவான நவீன தமிழில் குறிக்கிறது.
- source_word: אַבְנֵט בַּד
  choice: சணல்நூல் இடைக்கச்சை
  rationale: אַבְנֵט என்பது இடுப்பைச் சுற்றிக் கட்டப்படும் துணிக் கச்சை; ‘இடைக்கச்சை’ அதன் வடிவத்தையும் பயன்பாட்டையும் தெரிவிக்கிறது.
- source_word: מִצְנֶפֶת בַּד
  choice: சணல்நூல் தலைப்பாகை
  rationale: ஆசாரியர் தலையில் சுற்றிக்கொள்ளும் ஆடையை ‘தலைப்பாகை’ இயல்பாகவும் துல்லியமாகவும் குறிக்கிறது.
- source_word: וְרָחַץ בַּמַּיִם אֶת־בְּשָׂרוֹ
  choice: தமது உடலைத் தண்ணீரால் கழுவி
  rationale: எபிரெயில் ‘தமது சதையைத் தண்ணீரால் கழுவி’ என்பது சொல்லடிப்படை; சடங்குக் குளிப்பை நவீன தமிழில் இயல்பாகத் தெரிவிக்க ‘உடலைத் தண்ணீரால் கழுவி’ என வழங்கப்பட்டுள்ளது.
- source_word: וּלְבֵשָׁם
  choice: அவற்றை அணிந்துகொள்ள வேண்டும்
  rationale: பன்மைச் சுட்டுப்பெயர் முன் குறிப்பிடப்பட்ட பரிசுத்த ஆடைகளைக் குறிக்கிறது; வாவ் தொடரின் செயல்வரிசை ‘கழுவி ... அணிந்துகொள்ள’ என்ற தமிழ்த் தொடரால் காக்கப்படுகிறது.
theological_decisions:
- issue: ஆடைகளின் பரிசுத்தத் தன்மை
  choice: ‘பரிசுத்த ஆடைகள்’ என்று சடங்கு மற்றும் ஆசாரியப் பணிக்காகப் பிரித்துவைக்கப்பட்ட தன்மையை மட்டும் கூறுதல்
  alternative: ‘புனித ஆடைகள்’ அல்லது பிற்கால அடையாளவியல் விளக்கத்தைச் சேர்த்தல்
  rationale: வசனம் ஆடைகளை קֹדֶשׁ என்று நேரடியாக அழைக்கிறது; அவற்றுக்கு உரையில் கூறப்படாத கூடுதல் கோட்பாட்டு அடையாளத்தை மொழிபெயர்ப்பு சேர்க்கவில்லை.
- issue: בָּשָׂר என்ற சொல்லின் சடங்குச் சூழல்
  choice: முதன்மை உரையில் ‘உடல்’
  alternative: ‘சதை’
  rationale: இங்கு உடலில் ஆடை அணிவதும் உடலைக் கழுவுவதுமே பொருள். ‘உடல்’ அந்தக் konkrete பொருளை இயல்பாகத் தருகிறது; ‘சதை’ என்பதன் சொல்லடிப்படைத் தகவல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: கழுவுதலுக்கும் ஆடை அணிதலுக்கும் இடையிலான வரிசை
  choice: ‘கழுவி, அவற்றை அணிந்துகொள்ள வேண்டும்’
  alternative: இரு செயல்களையும் வரிசையற்ற தனித்தனி கட்டளைகளாக வழங்குதல்
  rationale: וְרָחַץ ... וּלְבֵשָׁם என்ற தொடரில் வெளிப்படும் இயல்பான செயல்வரிசையைத் தமிழின் வினையெச்ச அமைப்பு காக்கிறது; மூலத்தில் இல்லாத வலுவான விளக்கச் சொல்லைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில், ஆனால் ஆராதனை வாசிப்புக்கு ஏற்ற கண்ணியமான நடையில் அமைக்கப்பட்டது. ஆசாரிய உடைகளுக்கான தொழில்நுட்பச் சொற்கள் புரியும்படி ‘சணல்நூல்’, ‘அங்கி’, ‘இடைக்கச்சை’, ‘தலைப்பாகை’ ஆகியவை பயன்படுத்தப்பட்டுள்ளன. ஒரே நபரைக் கண்ணியமாகச் சுட்ட ‘அவர்/தமது/தம்மை’ என்ற ஒருமையான மரியாதை வடிவங்கள் ஒருமைப்படுத்தப்பட்டுள்ளன.
