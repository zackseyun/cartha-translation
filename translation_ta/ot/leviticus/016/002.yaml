    rationale: ‘பேழையின் மேல் இருக்கும்’ is the more standard and readily readable modern Tamil construction while retaining the Hebrew sense ‘that is on the ark.’
  - severity: low
    issue: Awkward compounded locative expression
    rationale: ‘திரைக்கு உட்புறம் உள்ள’ communicates the same location more naturally than ‘திரைக்கு உட்புறத்திலுள்ள,’ without altering the meaning.
