base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/002.yaml
  text: And Yahweh said to Moses[a], “Tell Aaron your brother that he must not come at just any time into the Holy Place, inside the veil, before the atonement cover that is on the ark, so that he may not die. For I will appear in the cloud over the atonement cover.”
translation:
  language: ta
  text: 'யாவே மோசேயிடம், “உன் சகோதரன் ஆரோனிடம் சொல்: அவன் இறந்துபோகாதபடி, எப்போது வேண்டுமானாலும் திரைக்கு உட்புறம் உள்ள பரிசுத்த இடத்திற்குள், பேழையின் மேல் இருக்கும் பாவநிவாரண மூடிக்கு[a] முன்பாக வரக் கூடாது. ஏனெனில் பாவநிவாரண மூடியின்மேல் மேகத்தில் நான் தோன்றுவேன்” என்றார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கிருபாசனம்’ என்பது இதற்கான மரபுவழி மொழிபெயர்ப்பு.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், எபிரெய நான்கெழுத்துப் பெயரின் பரவலாக ஏற்றுக்கொள்ளப்பட்ட ஒலிபெயர்ப்பைத் தமிழில் தருகிறது.
- source_word: דַּבֵּר אֶל־אַהֲרֹן אָחִיךָ
  choice: உன் சகோதரன் ஆரோனிடம் சொல்
  rationale: கட்டளையின் நேரடியான வலிமையையும் எபிரெயச் சொல் வரிசையின் அடிப்படை உறவையும் இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: וְאַל־יָבֹא בְכָל־עֵת
  choice: எப்போது வேண்டுமானாலும் ... வரக் கூடாது
  rationale: எல்லாக் காலங்களிலும் வருதல் பற்றிய கூற்றாக அல்லாமல், கட்டுப்பாடற்ற நுழைவைத் தடைசெய்யும் சூழல்சார் பொருளைத் தெளிவாக்குகிறது.
- source_word: הַקֹּדֶשׁ
  choice: பரிசுத்த இடம்
  rationale: இங்கு திரைக்கு உட்புறமுள்ள புனித உள் இடத்தைக் குறிக்கும் வழிபாட்டுச் சொல்லைத் தெளிவாகவும் மரியாதையான நடையிலும் தருகிறது.
- source_word: מִבֵּית לַפָּרֹכֶת
  choice: திரைக்கு உட்புறத்திலுள்ள
  rationale: திரையின் மறுபுறம் அமைந்த உள் பகுதி என்ற இடவியல் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הַכַּפֹּרֶת
  choice: பாவநிவாரண மூடி
  rationale: இது பேழையின் மேல் அமைந்த உறுதியான பொருள் என்பதையும் பாவநிவாரணச் சடங்குடன் அதன் தொடர்பையும் ஒருங்கே வெளிப்படுத்துகிறது; மரபான ‘கிருபாசனம்’ அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: הָאָרֹן
  choice: பேழை
  rationale: மூலத்தில் உள்ள ‘பேழை’ என்ற சுருக்கமான குறிப்பை மட்டும் காக்கிறது; இவ்வசனத்தில் இல்லாத ‘உடன்படிக்கை’ போன்ற விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: וְלֹא יָמוּת
  choice: அவன் இறந்துபோகாதபடி
  rationale: தடையின் நோக்கம் அல்லது தவிர்க்கப்பட வேண்டிய விளைவைத் தமிழில் தெளிவாகத் தெரிவிக்கிறது; மூலத்தின் தொடர்பை மிகையாகக் கடுமைப்படுத்தவில்லை.
- source_word: כִּי בֶּעָנָן אֵרָאֶה עַל־הַכַּפֹּרֶת
  choice: ஏனெனில் பாவநிவாரண மூடியின்மேல் மேகத்தில் நான் தோன்றுவேன்
  rationale: தடைக்கான காரணத்தையும் ‘மேகத்தில்’ என்ற சொல்லின் உண்மையான ஆனால் ஓரளவு திறந்த தொடர்பையும் மூலச் சொல் வரிசைக்கு அருகில் காக்கிறது.
theological_decisions:
- issue: כַּפֹּרֶת என்ற வழிபாட்டுச் சொல்லின் பொருள்
  choice: பாவநிவாரண மூடி
  alternative: கிருபாசனம்
  rationale: சொல் பேழையின் மூடியைக் குறிக்கும் பொருட்சார்ந்த தன்மையையும் பாவநிவாரணச் சடங்கில் அதன் பங்கையும் காக்கிறது. ‘கிருபாசனம்’ வரலாற்றுச் சிறப்புடைய மரபுவழி மொழிபெயர்ப்பாக அடிக்குறிப்பில் வைக்கப்படுகிறது; மூலச்சொல் தானாகவே ஒரு அரியணையைத் தெளிவாகக் கூறுவதில்லை.
- issue: בְּכָל עֵת என்பதன் தடைப் பொருள்
  choice: எப்போது வேண்டுமானாலும்
  alternative: எல்லா நேரங்களிலும்
  rationale: சூழலில் குறிக்கப்படுவது இடைவிடாத வருகை அல்ல, நியமிக்கப்பட்ட முறைக்கு வெளியே கட்டுப்பாடின்றி நுழைவதே. தேர்ந்த சொற்றொடர் அந்தத் தடைப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- issue: בֶּעָנָן என்பதன் தொடர்பு
  choice: மேகத்தில் நான் தோன்றுவேன்
  alternative: மேகமாக நான் தோன்றுவேன்
  rationale: எபிரெய முன்னிடைச்சொல் பொதுவாக ‘மேகத்தில்’ என்று பொருள்படும். தேவன் மேகமாகவே இருப்பார் என்று அடையாளப்படுத்தாமல், மேகத்தில் நிகழும் வெளிப்பாட்டைச் சொல்வதால் மூலத்தின் இறையியல் நுட்பம் காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் இயல்பான ஆனால் மரியாதைமிக்க நடை பயன்படுத்தப்பட்டுள்ளது. ‘பேழை,’ ‘பரிசுத்த இடம்’ போன்ற நிலைபெற்ற வேதாகமச் சொற்கள் அளவோடு வைக்கப்பட்டுள்ளன; வாக்கிய அமைப்பு தேவையற்ற பழமையாக்கமின்றி மூலத்தின் இடவியல் மற்றும் எச்சரிக்கைத் தொனியைப் பாதுகாக்கிறது.
