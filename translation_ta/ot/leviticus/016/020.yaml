  text: וְ/כִלָּה֙ מִ/כַּפֵּ֣ר אֶת הַ/קֹּ֔דֶשׁ וְ/אֶת אֹ֥הֶל מוֹעֵ֖ד וְ/אֶת הַ/מִּזְבֵּ֑חַ וְ/הִקְרִ֖יב אֶת הַ/שָּׂעִ֥יר הֶ/חָֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/020.yaml
  text: When he has finished making atonement for the sanctuary[a], the tent of meeting, and the altar[c][b], he shall present the live goat.
translation:
  language: ta
  text: அவன் பரிசுத்த இடத்திற்கும்[a], சந்திப்புக் கூடாரத்திற்கும், பலிபீடத்திற்கும் ஆகியவற்றிற்காகப் பாவநிவிர்த்தி செய்து முடித்தபின்[c], உயிரோடுள்ள வெள்ளாட்டுக்கடாவை முன்வைக்க வேண்டும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பரிசுத்த ஸ்தலம்.’
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், ‘அருகில் கொண்டுவர வேண்டும்’; அதாவது, அடுத்த சடங்கு நடவடிக்கைக்காக முறையாக முன்வைக்க வேண்டும்.
    reason: lexical_alternative
  - marker: c
    text: ‘பாவநிவிர்த்தி செய்தல்’ என்பது இச்சூழலில் சடங்குமுறையில் தூய்மைப்படுத்துதல் அல்லது களங்கம் நீக்குதல் என்றும் புரிந்துகொள்ளப்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִלָּה מִכַּפֵּר
  choice: பாவநிவிர்த்திச் சடங்கைச் செய்து முடித்ததும்
  rationale: כִּלָּה தொடரும் מן-இறந்தெச்சத்துடன் செயல் நிறைவுற்ற பின்வரும் காலவரிசையைக் குறிக்கிறது. כפר என்பதன் வழிபாட்டுச் சார்ந்த பரப்பைத் தக்கவைக்க ‘பாவநிவிர்த்திச் சடங்கு’ என மொழிபெயர்க்கப்பட்டது; இதை ஒரு குறிப்பிட்ட நிவிர்த்திக் கோட்பாட்டுக்குள் சுருக்கவில்லை.
- source_word: הַקֹּדֶשׁ
  choice: பரிசுத்த இடம்
  rationale: இங்கு சொல் அரூபமான பரிசுத்தத்தைக் குறிக்காமல், புனிதமான ஆலயப் பகுதியைக் குறிக்கிறது. ‘பரிசுத்த இடம்’ என்பது எபிரெயச் சொல்லின் வடிவத்தையும் சூழலையும் தெளிவாகப் பிரதிபலிக்கிறது.
- source_word: אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரம்
  rationale: מועד என்பதிலுள்ள நியமிக்கப்பட்ட சந்திப்பு என்ற கருத்தையும், אהל என்பதிலுள்ள கூடாரம் என்ற பொருளையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: הַמִּזְבֵּחַ
  choice: பலிபீடம்
  rationale: வழிபாட்டுச் சூழலில் இயல்பாகவும் துல்லியமாகவும் பயன்படும் தமிழ் இணைச்சொல்.
- source_word: וְהִקְרִיב
  choice: முன் கொண்டுவர வேண்டும்
  rationale: הקריב என்பதன் அடிப்படைப் பொருள் ‘அருகில் கொண்டுவருதல்’; இங்கு அடுத்த சடங்கு நடவடிக்கைக்காக ஆட்டை முறையாக முன்வைப்பதைக் குறிக்கிறது.
- source_word: הַשָּׂעִיר הֶחָי
  choice: உயிரோடிருக்கும் வெள்ளாட்டுக்கடா
  rationale: ஏற்கெனவே கொல்லப்பட்ட ஆட்டிலிருந்து இதை வேறுபடுத்தும் חי என்பதன் எதிர்மறை வேறுபாட்டைத் தெளிவாகக் காட்டுகிறது; שעיר என்பது ஆண் வெள்ளாட்டைக் குறிக்கிறது.
theological_decisions:
- issue: பலிசார் சூழலில் כפר என்பதன் பொருள்
  choice: பாவநிவிர்த்திச் சடங்கைச் செய்தல்
  alternative: சடங்குமுறையில் தூய்மைப்படுத்துதல் / களங்கம் நீக்குதல்
  rationale: כפר இச்சூழலில் பரிகாரம், தூய்மைப்படுத்தல், களங்கநீக்கம் ஆகிய தொடர்புடைய வழிபாட்டுப் பொருட்களைத் தாங்க முடியும். முதன்மை உரை அதன் மரபான பலிசார் பரப்பை வைத்துக்கொள்கிறது; அடிக்குறிப்பு சடங்குமுறைத் தூய்மைப்படுத்தல் என்ற சாத்தியத்தை வெளிப்படையாகப் பாதுகாக்கிறது.
- issue: הַקֹּדֶשׁ குறிக்கும் இடம்
  choice: பரிசுத்த இடம்
  alternative: பரிசுத்த ஸ்தலம் / சரணாலயம்
  rationale: இந்தச் சொல் புனித வளாகத்தையோ அதிலுள்ள பரிசுத்தப் பகுதியையோ குறிக்கக்கூடும். ‘பரிசுத்த இடம்’ மூலத்தின் நெகிழ்வைத் தக்கவைத்து, தேவையற்ற கட்டட அடையாளத்தைத் திணிக்காது.
translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘பாவநிவிர்த்திச் சடங்கு’ பொதுவாசகருக்குப் புரியும் வகையில் செயலை வெளிப்படுத்துகிறது; அதேவேளையில் כפר என்பதன் பொருளை ஒரு தனிப்பட்ட இறையியல் விளக்கத்துக்குள் கட்டுப்படுத்தாமல் அடிக்குறிப்பில் அதன் சடங்கு-தூய்மைப்படுத்தல் நுணுக்கம் பாதுகாக்கப்படுகிறது.
