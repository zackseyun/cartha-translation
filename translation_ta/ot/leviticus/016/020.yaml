revisions:
- from: அவர் பரிசுத்த இடத்திற்கும்[a], சந்திப்புக் கூடாரத்திற்கும், பலிபீடத்திற்கும் பாவநிவிர்த்திச் சடங்கைச் செய்து முடித்ததும்[c], உயிரோடிருக்கும் வெள்ளாட்டுக்கடாவை முன் கொண்டுவர வேண்டும்[b].
  to: அவன் பரிசுத்த இடத்திற்கும்[a], சந்திப்புக் கூடாரத்திற்கும், பலிபீடத்திற்கும் ஆகியவற்றிற்காகப் பாவநிவிர்த்தி செய்து முடித்தபின்[c], உயிரோடுள்ள வெள்ளாட்டுக்கடாவை முன்வைக்க வேண்டும்[b].
  rationale: The revision improves the Tamil syntax governing the three sacred objects, simplifies the rendering of כפר so its lexical and theological breadth remains intact, and uses a more natural formal expression for the presentation of the live goat. Footnote anchors and their intended lexical alternatives are retained.
