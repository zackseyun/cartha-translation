    reason: alternative_reading
  revision_rationale: The revision replaces the broader and interpretively enhanced ‘மெல்லிய நாரிழை’ with ‘சணல்,’ which directly represents the linen material of בַּד. It also uses ‘வைக்க வேண்டும்’ for the instruction to leave the garments there. The generic ‘பரிசுத்த இடம்’ and its alternative-reading footnote preserve the Hebrew’s wording without deciding the disputed architectural referent.
