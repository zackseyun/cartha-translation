revisions:
- from: பின்பு ஆரோன் சந்திப்புக் கூடாரத்துக்குள் வந்து, பரிசுத்த இடத்துக்குள்[a] சென்றபோது அணிந்திருந்த மெல்லிய நாரிழை ஆடைகளைக் கழற்றி, அவற்றை அங்கேயே வைத்துவிட வேண்டும்.
  to: பின்பு ஆரோன் சந்திப்புக் கூடாரத்துக்குள் வந்து, பரிசுத்த இடத்துக்குள்[a] சென்றபோது அணிந்திருந்த சணல் ஆடைகளைக் கழற்றி, அவற்றை அங்கேயே வைக்க வேண்டும்.
  rationale: The revision replaces the broader and interpretively enhanced ‘மெல்லிய நாரிழை’ with ‘சணல்,’ which directly represents the linen material of בַּד. It also uses ‘வைக்க வேண்டும்’ for the instruction to leave the garments there. The generic ‘பரிசுத்த இடம்’ and its alternative-reading footnote preserve the Hebrew’s wording without deciding the disputed architectural referent.
