source:
  edition: WLC
  text: וּ/בָ֤א אַהֲרֹן֙ אֶל אֹ֣הֶל מוֹעֵ֔ד וּ/פָשַׁט֙ אֶת בִּגְדֵ֣י הַ/בָּ֔ד אֲשֶׁ֥ר לָבַ֖שׁ בְּ/בֹא֣/וֹ אֶל הַ/קֹּ֑דֶשׁ וְ/הִנִּיחָ֖/ם שָֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/023.yaml
  text: Then Aaron shall come into the tent of meeting and take off the linen garments that he put on when he went into the holy place[a], and he shall leave them there.
translation:
  language: ta
  text: பின்பு ஆரோன் சந்திப்புக் கூடாரத்துக்குள் வந்து, பரிசுத்த இடத்துக்குள்[a] சென்றபோது அணிந்திருந்த சணல் ஆடைகளைக் கழற்றி, அவற்றை அங்கேயே வைக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘திருத்தலம்’; பரிகார நாளைப் பற்றிய விரிவான சூழலின் அடிப்படையில் சிலர் இதை இன்னும் குறிப்பாக ‘மகா பரிசுத்த இடம்’ என்று புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבָא
  choice: பின்பு ... வந்து
  rationale: சடங்கு வழிமுறையின் தொடர்ச்சியைக் குறிக்கும் வாவ் + நிறைவுவினை அமைப்பை இயல்பான தமிழில் ‘பின்பு ... வந்து’ எனக் கொடுக்கிறது; בוא என்பதன் வருதல்/உள்நுழைதல் கருத்தும் நிலைக்கிறது.
- source_word: אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரம்
  rationale: இது திருவுறைவிடக் கட்டமைப்புக்கான நிலையான பெயர்; מועד என்பதிலுள்ள சந்திப்பு/நியமிக்கப்பட்ட சந்திப்பு என்ற கருத்தைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וּפָשַׁט
  choice: கழற்றி
  rationale: ஆடையை நீக்குவதைக் குறிக்கும் இயல்பான நவீனத் தமிழ்ச் சொல்; மூலத்தின் செயலை மிகைப்படுத்தாமல் தெரிவிக்கிறது.
- source_word: בִּגְדֵי הַבָּד
  choice: மெல்லிய நாரிழை ஆடைகள்
  rationale: בגד என்பது ஆடைகளையும் בד என்பது இச்சூழலில் மென்மையான தாவர நாரால் செய்யப்பட்ட துணியையும் குறிக்கிறது. பொதுவாகப் புரியும் வகையில் பொருளைத் தெரிவிக்கிறது.
- source_word: אֲשֶׁר לָבַשׁ
  choice: அணிந்திருந்த
  rationale: לבש என்பதன் அணிதல்/உடுத்துதல் பொருளையும், ஏற்கெனவே அணிந்திருந்த ஆடைகளைச் சுட்டும் உறவுத் தொடரையும் இயல்பாகக் காட்டுகிறது.
- source_word: בְּבֹאוֹ
  choice: சென்றபோது
  rationale: ב + வினையெச்சப் பெயர் காலச் சூழலைக் குறிக்கிறது. இலக்கிடப்பட்ட பரிசுத்த இடத்துக்குள் நகர்வதைத் தமிழில் இயல்பாக ‘சென்றபோது’ எனத் தருகிறது.
- source_word: הַקֹּדֶשׁ
  choice: பரிசுத்த இடம்
  rationale: எபிரெயச் சொல் நேரடியாக ‘பரிசுத்தமானது/பரிசுத்த இடம்’ என்று பொருள்படும். வசனம் குறிப்பிடாத கட்டடவியல் துல்லியத்தை முதன்மை உரையில் சேர்க்காமல் இருக்கிறது.
- source_word: וְהִנִּיחָם שָׁם
  choice: அவற்றை அங்கேயே வைத்துவிட வேண்டும்
  rationale: הניח என்பதன் வைத்தல்/விட்டுவைத்தல் பொருளைத் தெளிவான வழிமுறைத் தமிழில் வழங்குகிறது; வைக்கும் முறையை தேவையின்றி குறிப்பாக்கவில்லை.
theological_decisions:
- issue: הַקֹּדֶשׁ என்பதன் இடச் சுட்டு
  choice: பரிசுத்த இடம்
  alternative: திருத்தலம்; மகா பரிசுத்த இடம்
  rationale: மூலத்தில் முழுமையான ‘மகா பரிசுத்த இடம்’ என்ற குறிப்பிட்ட சொற்றொடர் இல்லை. ஆகவே பரிகார நாளின் விரிவான சூழல் இன்னும் குறிப்பிட்ட இடத்தை உணர்த்தக்கூடும் என்ற சாத்தியத்தை அடிக்குறிப்பில் வைத்து, மூலத்தின் பொதுவான சொல்லை முதன்மை உரை பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சடங்கு வழிமுறைக்கு ஏற்ற கண்ணியமானதும் பொதுவாசகர்கள் புரிந்துகொள்ளக்கூடியதுமான நடை. வினைத் தொடர் தமிழில் இயல்பாக ஒருங்கிணைக்கப்பட்டுள்ளது; மூலத்தில் உள்ள இடச் சுட்டின் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
