source:
  edition: WLC
  text: וְ/אֵ֛ת חֵ֥לֶב הַֽ/חַטָּ֖את יַקְטִ֥יר הַ/מִּזְבֵּֽחָ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/025.yaml
  text: And he shall burn the fat of the sin offering on the altar[a].
translation:
  language: ta
  text: பாவநிவாரணப் பலியின்[a] கொழுப்பை பலிபீடத்தின்மேல் எரித்துப் புகையாக்குவான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சுத்திகரிப்புப் பலி.” பாவம் அல்லது தீட்டிலிருந்து சுத்திகரிப்பதற்குப் பயன்படுத்தப்பட்ட பலியை எபிரெயச் சொல் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵת
  choice: கொழுப்பை
  rationale: וְ தொடரும் சடங்கு நடவடிக்கையை இணைக்கிறது; தமிழில் தனி ‘மேலும்’ சேர்ப்பதைவிட வாக்கியத் தொடர்ச்சியே இயல்பாக அந்த இணைப்பை உணர்த்துகிறது. אֵת குறிக்கும் நேரடிச் செயப்படுபொருள் ‘கொழுப்பை’ என்ற வேற்றுமை உருபில் வெளிப்படுகிறது.
- source_word: חֵלֶב
  choice: கொழுப்பு
  rationale: பலியாகச் செலுத்துவதற்கென ஒதுக்கப்பட்ட கொழுப்பைக் குறிக்கிறது. மூலத்தில் வெளிப்படையாக இல்லாத ‘பகுதிகள்’ என்பதைச் சேர்க்காமல் நேரடியாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: הַחַטָּאת
  choice: பாவநிவாரணப் பலி
  rationale: பலிச்சட்டச் சூழலில் இது பாவத்துடன் தொடர்புடைய நிவாரணப் பலியைக் குறிக்கும் வழக்குச் சொல். சுத்திகரிப்பை முன்னிறுத்தும் பொருளும் இருக்கக்கூடும்; அது அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: יַקְטִיר
  choice: எரித்துப் புகையாக்க வேண்டும்
  rationale: கட்டர் என்பதன் ஹிஃபில் வடிவம் பலிபீடத்தில் பலியை எரித்துப் புகையெழச் செய்வதைக் குறிக்கிறது. வெறும் ‘எரிக்க வேண்டும்’ என்பதைக் காட்டிலும் சடங்குசார் செயலைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: הַמִּזְבֵּחָה
  choice: பலிபீடத்தின்மேல்
  rationale: திசைநோக்கைக் காட்டும் இறுதி வடிவம் சொற்படியாக ‘பலிபீடத்துக்கு’ என அமையலாம்; இச்சூழலில் எரித்தல் நடைபெறும் இடத்தைத் தமிழில் ‘பலிபீடத்தின்மேல்’ என்பது இயல்பாகக் குறிக்கிறது.
theological_decisions:
- issue: பலிச்சட்டத்தில் חַטָּאת என்பதன் மொழிபெயர்ப்பு
  choice: பாவநிவாரணப் பலி
  alternative: சுத்திகரிப்புப் பலி
  rationale: எபிரெயச் சொல் பாவத்தையும் பாவம் அல்லது தீட்டிலிருந்து சுத்திகரிக்கும் பலியையும் சுட்டக்கூடும். தமிழில் அறியப்பட்ட பலிச்சார் பொருளை ‘பாவநிவாரணப் பலி’ தெளிவாகத் தருகிறது; சடங்கின் சுத்திகரிப்புச் செயல்பாட்டை வலியுறுத்தும் மாற்று வாசகம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. ‘எரித்துப் புகையாக்க’ என்பது பலிபீடச் செயலைத் துல்லியமாக வெளிப்படுத்துகிறது; குறிப்பிடத்தக்க சொற்பொருள் மாற்று அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
