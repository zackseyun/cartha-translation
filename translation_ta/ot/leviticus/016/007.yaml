base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/007.yaml
  text: And he shall take the two goats and set them before Yahweh at the entrance of the tent of meeting[a].
translation:
  language: ta
  text: அவன் அந்த இரண்டு வெள்ளாட்டுக்கடாக்களையும் எடுத்து, சந்திப்புக்கூடாரத்தின் நுழைவாயிலில் யாவேக்கு முன்பாக அவற்றை நிறுத்த வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மூலத்தில் இறைவனின் தனிப்பெயரான יהוה (YHWH) இடம்பெறுகிறது; அது “யாவே” என்று ஒலிபெயர்க்கப்பட்டுள்ளது.
    reason: இறைப்பெயரின் மூலவடிவத்தையும் மொழிபெயர்ப்பு முறையையும் தெளிவுபடுத்துதல்.
lexical_decisions:
- source_word: וְלָקַח
  choice: பின்பு அவன் … கொண்டுவந்து
  rationale: சடங்கு விதிமுறையின் தொடர்ச்சியை இணைப்புச்சொல்லுடன் வந்த வினை உணர்த்துகிறது. தமிழில் இயல்பான தொடர்நிலையை வெளிப்படுத்த “பின்பு” என்றும், ஆடுகளை அந்த இடத்துக்குக் கொண்டுசெல்லும் செயலை “கொண்டுவந்து” என்றும் மொழிபெயர்க்கப்பட்டது.
- source_word: שְׁנֵי הַשְּׂעִירִם
  choice: அந்த இரண்டு வெள்ளாட்டுக் கடாக்கள்
  rationale: שָׂעִיר என்பது வெள்ளாட்டை, இச்சூழலில் குறிப்பாக ஆண் வெள்ளாட்டைக் குறிக்கிறது. தமிழில் பாலினத் தகவலைப் பாதுகாக்க “வெள்ளாட்டுக் கடாக்கள்” பயன்படுத்தப்பட்டது.
- source_word: וְהֶעֱמִיד אֹתָם
  choice: அவற்றை நிறுத்த வேண்டும்
  rationale: עמד என்பதன் ஹிஃபில் வடிவம் ‘நிற்கச் செய்தல், நிறுத்துதல்’ என்ற நேரடியான இடநிறுத்தும் செயலைக் குறிக்கிறது; சடங்குக்காக ‘சமர்ப்பித்தல்’ என்று கூடுதலாகப் பொருள் விளக்காமல் மூலத்தின் காட்சியைப் பாதுகாக்கிறது.
- source_word: לִפְנֵי יְהוָה
  choice: யாவேக்கு முன்பாக
  rationale: לִפְנֵי என்பதன் இடம் மற்றும் முன்னிலை சார்ந்த ‘முன்பாக’ என்ற பொருள் காக்கப்பட்டது; יְהוָה என்பது பொதுப்பட்டமாக மாற்றப்படாமல் “யாவே” என்று பெயரெழுத்தாக்கப்பட்டது.
- source_word: פֶּתַח
  choice: நுழைவாயிலில்
  rationale: פֶּתַח என்பது திறப்பு அல்லது நுழைவிடத்தைக் குறிக்கிறது. இங்கு இருப்பிடத்தை இயல்பான தமிழில் “நுழைவாயிலில்” என்பது தெளிவாகக் காட்டுகிறது.
- source_word: אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரம்
  rationale: ‘சந்திப்பின் கூடாரம்’ என்ற எபிரெயப் பெயரின் கூறுகளைப் பாதுகாத்து, தமிழில் நிலைபெறக்கூடிய சுருக்கமான பெயராக வழங்கப்பட்டது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல எபிரெய உரையில் இறைவனின் தனிப்பெயரான நான்கெழுத்துப் பெயர் நேரடியாக உள்ளது. அதை ஒரு பொதுப்பட்டமாக மாற்றாமல், உடன்படிக்கையின் பெயராகத் தமிழில் ஒலிபெயர்த்தது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சடங்கு விதிமுறைக்கேற்ற கண்ணியமான மற்றும் நேரடியான நடை பயன்படுத்தப்பட்டுள்ளது. “நிறுத்த வேண்டும்” என்பது கட்டளைத் தன்மையை இயல்பாக வெளிப்படுத்துகிறது; “சமர்ப்பிக்க வேண்டும்” போன்ற விளக்கவுரை தவிர்க்கப்பட்டுள்ளது.
