- source_word: הַשָּׂעִיר
  choice: அந்த வெள்ளாடு
  rationale: שָׂעִיר ஆண் வெள்ளாட்டைக் குறிக்கக்கூடும்; எனினும் இச்சூழலில் முன்பே குறிப்பிடப்பட்ட குறிப்பிட்ட வெள்ளாட்டைக் குறிக்கும் இயல்பான தமிழ் வடிவம் போதுமானது.
- source_word: עָלָיו
  choice: தன்மேல்
  rationale: அக்கிரமங்கள் வெள்ளாட்டின்மேல் சுமத்தப்பட்டுள்ளன என்ற உறுதியான உருவகத்தைத் தெளிவாகவும் சுருக்கமாகவும் தெரிவிக்கிறது.
- source_word: כָּל עֲוֺנֹתָם
  choice: அவர்களுடைய எல்லா அக்கிரமங்களையும்
  rationale: עָוֹן என்பதில் பாவம், குற்றம், குற்றப்பழி ஆகிய அர்த்தநிழல்கள் உள்ளன; ‘அக்கிரமங்கள்’ அதன் கனமான ஒழுக்க மற்றும் சடங்குசார் பொருளைத் தக்கவைக்கிறது.
- source_word: אֶל אֶרֶץ גְּזֵרָה
