base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/022.yaml
  text: The goat shall carry on itself all their iniquities to a cut-off land[a], and he shall send the goat away into the wilderness.
translation:
  language: ta
  text: அந்த வெள்ளாடு அவர்களுடைய எல்லா அக்கிரமங்களையும் தன்மேல் சுமந்துகொண்டு, பிரிக்கப்பட்ட ஒரு நிலத்திற்குச் செல்லும்[a]. அவன் அந்த வெள்ளாட்டை வனாந்தரத்துக்கு அனுப்பிவிட வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தனிமையான ஒரு நிலத்திற்கு,” “அணுக முடியாத ஒரு நிலத்திற்கு,” அல்லது “பாழான ஒரு நிலத்திற்கு.” எபிரெயச் சொல், மக்கள் குடியிருப்பிலிருந்து பிரிக்கப்பட்ட அல்லது தனிமைப்படுத்தப்பட்ட ஓர் இடத்தைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
