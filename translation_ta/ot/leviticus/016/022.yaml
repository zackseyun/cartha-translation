- source_word: בַּמִּדְבָּר
  choice: வனாந்தரத்தில்
  rationale: מִדְבָּר என்பது மக்கள் குடியிராத வறண்ட வெளி அல்லது வனாந்தரப் பகுதியைக் குறிக்கும்; ‘வனாந்தரம்’ இச்சடங்குச் சூழலுக்கு ஏற்ற மரியாதைமிக்க பொதுத் தமிழ் சொல்.
theological_decisions:
- issue: வெள்ளாடு மக்களின் அக்கிரமங்களைச் சுமக்கும் உருவகம்
  choice: அக்கிரமங்களைத் ‘தன்மேல் சுமந்துகொண்டு செல்லும்’ என்ற உறுதியான மொழியைத் தக்கவைத்தல்
  alternative: ‘அவர்களுடைய பாவங்களைப் போக்கும்’ என்று விளக்கமாக மொழிபெயர்த்தல்
  rationale: எபிரெய உரை அக்கிரமங்கள் வெள்ளாட்டின்மேல் சுமத்தப்பட்டு அகற்றப்படுகின்ற உயிரோட்டமான சடங்குக் காட்சியை அளிக்கிறது. பின்னாளைய கோட்பாட்டு முடிவுகளைச் சேர்க்காமல் அந்த உருவகத்தையும் அதன் பதற்றத்தையும் இம்மொழிபெயர்ப்பு காக்கிறது.
- issue: אֶרֶץ גְּזֵרָה என்பதன் தெளிவற்ற பொருள்
  choice: முதன்மை உரையில் ‘குடியிருப்பிலிருந்து துண்டிக்கப்பட்ட ஒரு நிலம்’
  alternative: தனிமையான நிலம்; அணுக முடியாத நிலம்; பாழான நிலம்
  rationale: இந்த எபிரெயச் சொற்றொடர் அரிதானதும் பொருள் நிச்சயமற்றதுமாகும். பிரிப்பு மற்றும் தனிமைப்படுத்தல் என்ற அடிப்படை உருவகத்தை முதன்மை உரை காக்கிறது; சாத்தியமான பிற வாசிப்புகள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- issue: וְשִׁלַּח என்ற இறுதி வினையின் செய்பவர் மற்றும் காலவகை
  choice: ‘அவன் ... அனுப்பிவிட வேண்டும்’ என்று விதிமுறைத் தொடர்ச்சியாக மொழிபெயர்த்தல்
  alternative: ‘அவன் ... அனுப்பிவிடுவான்’ அல்லது ‘அனுப்பிவிடுவான்’
  rationale: முந்தைய வசனங்களில் தொடரும் சடங்கு விதிமுறையின் செய்பவர் சூழலால் அறியப்படுகிறார். தமிழ் உரையில் ‘அவன்’ என்பதை வைத்திருப்பது எபிரெய வினையின் மூன்றாம் ஆண்பால் ஒருமையை வெளிப்படுத்துகிறது; ‘வேண்டும்’ சட்டவிதியின் கட்டளைத் தன்மையை இயல்பாகக் காட்டுகிறது.
