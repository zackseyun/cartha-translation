source:
  edition: WLC
  text: וְ/כִפֶּר֙ אֶת מִקְדַּ֣שׁ הַ/קֹּ֔דֶשׁ וְ/אֶת אֹ֧הֶל מוֹעֵ֛ד וְ/אֶת הַ/מִּזְבֵּ֖חַ יְכַפֵּ֑ר וְ/עַ֧ל הַ/כֹּהֲנִ֛ים וְ/עַל כָּל עַ֥ם הַ/קָּהָ֖ל יְכַפֵּֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/033.yaml
  text: Thus he shall make atonement for the Holy Sanctuary[a], and for the Tent of Meeting, and for the altar[b]; and he shall make atonement for the priests and for all the people of the assembly.
translation:
  language: ta
  text: இவ்வாறு அவர் பரிசுத்த திருத்தலத்திற்காகவும், சந்திப்புக் கூடாரத்திற்காகவும், பலிபீடத்திற்காகவும் பாவநிவிர்த்தி செய்வார்[a]; ஆசாரியர்களுக்காகவும் சபையைச் சேர்ந்த மக்கள் அனைவருக்காகவும்[b] பாவநிவிர்த்தி செய்வார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பாவநிவிர்த்தி செய்வார்’ என்பதற்கு ‘கழுவாய் செய்வார்’ என்றும் மொழிபெயர்க்கலாம்; இச்சடங்குச் சூழலில் எபிரெய வினைச்சொல் பாவநிவிர்த்தியோடு சடங்கு சார்ந்த அசுத்தத்தை அகற்றுவதையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘சபையைச் சேர்ந்த மக்கள்’ என்பதை ‘கூட்டத்தைச் சேர்ந்த மக்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִפֶּר / יְכַפֵּר / יְכַפֵּר
  choice: பாவநிவிர்த்தி செய்வார்
  rationale: כפר என்பது இங்கே பலிச் சடங்கு சார்ந்த தொழில்நுட்பச் சொல். ஒரே தமிழ் தொடரைத் திருத்தலம், கூடாரம், பலிபீடம், ஆசாரியர்கள், மக்கள் ஆகிய அனைத்திற்கும் பயன்படுத்துவது எபிரெயச் சொல்லின் மீளுரைப்பையும் சடங்கின் ஒருமைப்பாட்டையும் காக்கிறது.
- source_word: מִקְדַּשׁ הַקֹּדֶשׁ
  choice: பரிசுத்த திருத்தலம்
  rationale: இந்தச் சொற்றொடரின் புனித இடம் என்ற உயரிய பொருளை இயல்பான தமிழில் தருகிறது; எபிரெயம் வெளிப்படையாகக் கூறாத ‘மகா பரிசுத்த ஸ்தலம்’ என்ற குறிப்பிட்ட பொருளைத் திணிக்கவில்லை.
- source_word: אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரம்
  rationale: எபிரெயப் பெயரின் உருவகத்தையும் சந்திப்புக்குரிய செயல்பாட்டையும் தெளிவான நவீன தமிழில் காக்கிறது.
- source_word: הַמִּזְבֵּחַ
  choice: பலிபீடம்
  rationale: பலிச் சடங்கு சார்ந்த இச்சொல்லுக்கு இயல்பாகவும் நிலையாகவும் பயன்படுத்தப்படும் தமிழ் இணை.
- source_word: עַל
  choice: -க்காக
  rationale: כפר உடன் வரும் עַל என்பதை நவீன தமிழில் ‘ஒருவருக்காகப் பாவநிவிர்த்தி செய்தல்’ என்ற இயல்பான உறவாக வெளிப்படுத்துகிறது.
- source_word: הַכֹּהֲנִים
  choice: ஆசாரியர்கள்
  rationale: இஸ்ரவேலின் வழிபாட்டுப் பணியாளர்களைக் குறிக்கும் நிலையான, பரவலாகப் புரிந்துகொள்ளப்படும் தமிழ் சொல்.
- source_word: כָּל עַם הַקָּהָל
  choice: சபையைச் சேர்ந்த மக்கள் அனைவரும்
  rationale: வெறுமனே ‘மக்கள் அனைவரும்’ என்று சுருக்காமல், அவர்கள் கூடிய சமூகத்தைச் சேர்ந்தவர்கள் என்ற எபிரெயச் சொல்லின் வெளிப்படையான கூட்டுப் பொருளைக் காக்கிறது.
theological_decisions:
- issue: புனிதப் பொருட்களுக்கும் மனிதர்களுக்கும் பயன்படுத்தப்படும் பாவநிவிர்த்தி மொழியின் பரப்பு
  choice: திருத்தலம், கூடாரம், பலிபீடம், ஆசாரியர்கள், மக்கள் ஆகிய அனைத்திற்கும் ‘பாவநிவிர்த்தி செய்வார்’ என்ற ஒரே தொடரைப் பயன்படுத்துதல்
  alternative: புனித இடங்களுக்காக ‘தூய்மைப்படுத்துவார்’ என்றும் மனிதர்களுக்காக ‘பாவநிவிர்த்தி செய்வார்’ என்றும் வேறுபடுத்துதல்
  rationale: எபிரெய உரை כפר என்ற ஒரே வினையை நோக்கத்துடன் மீண்டும் பயன்படுத்துகிறது. ஒரே தொடரைக் காப்பது சடங்கின் ஒருமைப்பாட்டை வெளிப்படுத்தி, அதன் செயல்பாட்டைப் பிரித்துக் கூறும் அளவுக்கு மொழிபெயர்ப்பில் விளக்கம் புகுத்துவதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பாவநிவிர்த்தி’ என்ற முக்கியச் சொல் வசனம் முழுவதும் தொடர்ந்து காக்கப்பட்டுள்ளது; ‘மகா பரிசுத்த ஸ்தலம்’ போன்ற அளவுக்கு மீறிய குறிப்பாக்கம் தவிர்க்கப்பட்டுள்ளது.
