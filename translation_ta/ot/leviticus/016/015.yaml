  source_fidelity: 'மூல எபிரேயச் சடங்கு-வழிமுறை துல்லியமாகப் பாதுகாக்கப்பட்டுள்ளது: மக்களுக்குரிய பாவநிவாரணப் பலியின் ஆட்டுக்கடாவை அறுத்தல், இரத்தத்தைத் திரைக்குள் கொண்டுவருதல், காளையின் இரத்தத்திற்குச் செய்யப்பட்டபடி செய்தல், மூடியின்மேலும் அதன் முன்பாகவும் தெளித்தல் ஆகிய அனைத்தும் இடம்பெறுகின்றன. עַל மற்றும் לִפְנֵי குறிக்கும் வேறுபட்ட இடநிலைகளும் தெளிவாக வேறுபடுத்தப்பட்டுள்ளன.'
