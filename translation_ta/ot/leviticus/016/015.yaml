  edition: WLC
  text: וְ/שָׁחַ֞ט אֶת שְׂעִ֤יר הַֽ/חַטָּאת֙ אֲשֶׁ֣ר לָ/עָ֔ם וְ/הֵבִיא֙ אֶת דָּמ֔/וֹ אֶל מִ/בֵּ֖ית לַ/פָּרֹ֑כֶת וְ/עָשָׂ֣ה אֶת דָּמ֗/וֹ כַּ/אֲשֶׁ֤ר עָשָׂה֙ לְ/דַ֣ם הַ/פָּ֔ר וְ/הִזָּ֥ה אֹת֛/וֹ עַל הַ/כַּפֹּ֖רֶת וְ/לִ/פְנֵ֥י הַ/כַּפֹּֽרֶת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/015.yaml
  text: Then he shall slaughter the goat of the sin offering that is for the people[a], and bring its blood inside the veil, and do with its blood as he did with the blood of the bull, and sprinkle it on the atonement cover and before the mercy seat.
translation:
  language: ta
  text: பின்பு மக்களுக்கான பாவநிவாரணப் பலியின் வெள்ளாட்டுக்கடாவை அவன் அறுத்து, அதன் இரத்தத்தைத் திரைக்கு உட்புறமாகக் கொண்டுவர வேண்டும். காளையின் இரத்தத்தைக் கொண்டு செய்ததுபோலவே அதன் இரத்தத்தைக் கொண்டும் செய்து, அதைப் பாவநிவாரண மூடியின்மேலும்[a] அந்த மூடியின் முன்பாகவும் தெளிக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மரபுவழியாக, “கிருபாசனம்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁחַט
  choice: பின்பு ... அவன் அறுத்து
  rationale: சடங்கு வழிமுறையின் தொடர்ச்சியை וְ உணர்த்துவதால் ‘பின்பு’ பயன்படுத்தப்பட்டது; שׁחט என்பதன் பலிக்குரிய அறுத்தலை ‘அறுத்து’ இயல்பாகத் தருகிறது.
- source_word: שְׂעִיר הַחַטָּאת אֲשֶׁר לָעָם
  choice: மக்களுக்கான பாவநிவாரணப் பலியின் வெள்ளாட்டுக்கடா
  rationale: שׂעיר ஆண் வெள்ளாட்டைக் குறிக்கிறது; לָעָם இந்தப் பலி மக்களுக்கானது என்பதை வேறுபடுத்துகிறது. חטאת என்பதற்கு இச்சடங்குச் சூழலில் ‘பாவநிவாரணப் பலி’ தெளிவான நடை.
- source_word: אֶל מִבֵּית לַפָּרֹכֶת
  choice: திரைக்கு உட்புறமாக
  rationale: சொல்லுக்குச் சொல் அமைப்பை வற்புறுத்தாமல், பிரிக்கும் திரைக்குப் பின்னுள்ள உட்பகுதியைத் தெளிவாகக் குறிக்கிறது.
- source_word: וְעָשָׂה אֶת דָּמוֹ כַּאֲשֶׁר עָשָׂה לְדַם הַפָּר
  choice: காளையின் இரத்தத்தைக் கொண்டு செய்ததுபோலவே அதன் இரத்தத்தைக் கொண்டும் செய்து
  rationale: எபிரேய வாக்கியத்தின் சற்றே விடுபட்ட அமைப்பைத் தீர்த்துவிடாமல், முந்தைய இரத்தச் சடங்கே இதற்கும் செய்யப்பட வேண்டும் என்ற பொருளை இயல்பாகப் பாதுகாக்கிறது.
- source_word: וְהִזָּה אֹתוֹ
  choice: அதைத் ... தெளிக்க வேண்டும்
  rationale: נזה பலிச்சடங்கில் இரத்தத்தைத் தெளிப்பதைக் குறிக்கிறது; சட்ட வழிமுறையின் கட்டளையுணர்வை ‘வேண்டும்’ வெளிப்படுத்துகிறது.
- source_word: הַכַּפֹּרֶת
  choice: பாவநிவாரண மூடி
  rationale: இது உடன்படிக்கைப் பெட்டியின் பொன் மூடியைக் குறிக்கிறது. ‘பாவநிவாரண’ என்பது כפר வேருடன் உள்ள கருத்துத் தொடர்பை வெளிப்படுத்துகிறது; ‘மூடி’ பொருளின் வடிவத்தையும் தெளிவாக்குகிறது.
- source_word: עַל ... וְלִפְנֵי
  choice: மேலும் ... முன்பாகவும்
  rationale: இரத்தம் மூடியின்மேலும் அதன் முன்பாகவும் தெளிக்கப்படும் இரு தனித்த இடநிலைகளைப் பாதுகாக்கிறது.
theological_decisions:
- issue: הַכַּפֹּרֶת என்பதன் மொழிபெயர்ப்பு
  choice: பாவநிவாரண மூடி
  alternative: கிருபாசனம்
  rationale: மூலச்சொல் பெட்டியின் மூடியைச் சுட்டுவதோடு כפר வேரின் பாவநிவாரணத் தொடர்பையும் கொண்டுள்ளது. ‘கிருபாசனம்’ என்பது மரபுவழிப் பெயராக இருந்தாலும், ‘ஆசனம்’ என்ற சொல்லால் மூலத்தில் வெளிப்படையாக இல்லாத இருக்கை எண்ணத்தை முன்வைக்கலாம். மரபுவழி மாற்று அடிக்குறிப்பில் வைக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. சடங்கு வழிமுறைக்கேற்ற ‘வேண்டும்’ நடை தொடர்கிறது. ஒரே எபிரேயச் சொல் הַכַּפֹּרֶת இரு இடங்களிலும் ஒரே கருத்துடன் மொழிபெயர்க்கப்பட்டு, இரண்டாம் இடத்தில் இயல்புக்காக ‘அந்த மூடி’ என்று மீள்குறிக்கப்பட்டுள்ளது.
