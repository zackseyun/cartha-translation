source:
  edition: WLC
  text: וְ/הַ/שָּׂעִ֗יר אֲשֶׁר֩ עָלָ֨ה עָלָ֤י/ו הַ/גּוֹרָל֙ לַ/עֲזָאזֵ֔ל יָֽעֳמַד חַ֛י לִ/פְנֵ֥י יְהוָ֖ה לְ/כַפֵּ֣ר עָלָ֑י/ו לְ/שַׁלַּ֥ח אֹת֛/וֹ לַ/עֲזָאזֵ֖ל הַ/מִּדְבָּֽרָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/010.yaml
  text: But the goat on which the lot for Azazel fell shall be presented alive before Yahweh[a], to make atonement over it[b], to send it away into the wilderness to Azazel.
translation:
  language: ta
  text: ஆனால் அசாசேலுக்கான[a] சீட்டு எந்த வெள்ளாட்டின்மேல் விழுந்ததோ, அது உயிரோடு யெகோவாவின் முன்னிலையில் நிறுத்தப்பட வேண்டும்; அதன்மேல் பாவநிவிர்த்தி செய்வதற்காகவும் அதை அசாசேலுக்குப் பாலைநிலத்திற்குள் அனுப்பிவிடுவதற்காகவும்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அசாசேல்” என்ற எபிரெயச் சொல்லின் பொருள் விவாதத்திற்குரியது; அது ஒரு பெயராகவோ, இடத்தைக் குறிக்கிற சொல்லாகவோ, அகற்றுதலோடு தொடர்புடைய சொல்லாகவோ இருக்கலாம். சில மொழிபெயர்ப்புகள் இதை “போக்காடு” என வழங்குகின்றன.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “அதற்காகப் பாவநிவிர்த்தி செய்வதற்காக.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַשָּׂעִיר
  choice: ஆனால் ... வெள்ளாடு
  rationale: முந்தைய வெள்ளாட்டுடன் உள்ள வேறுபாட்டை முன்னொட்டு வாவ் இங்கு காட்டுவதால் ‘ஆனால்’ என மொழிபெயர்க்கப்பட்டது. שָׂעִיר ஆண் வெள்ளாட்டைக் குறிக்கிறது; தமிழில் இயல்பாக ‘வெள்ளாடு’ பயன்படுத்தப்பட்டது.
- source_word: אֲשֶׁר עָלָה עָלָיו הַגּוֹרָל
  choice: சீட்டு எந்த வெள்ளாட்டின்மேல் விழுந்ததோ
  rationale: சீட்டின் மூலம் தெரிவு செய்யப்படுவதைச் சுட்டும் எபிரெய மொழிவழக்கை இயல்பான தமிழில் தருகிறது.
- source_word: לַעֲזָאזֵל
  choice: அசாசேலுக்கான / அசாசேலுக்காக
  rationale: עֲזָאזֵל என்பதன் பொருள் விவாதத்திற்குரியது. பொருளை முன்கூட்டியே தீர்மானிக்காமல் அதன் ஒலிபெயர்ப்பு முதன்மை உரையில் வைக்கப்பட்டது.
- source_word: יָעֳמַד חַי לִפְנֵי יְהוָה
  choice: உயிரோடு யெகோவாவின் முன்னிலையில் நிறுத்தப்பட வேண்டும்
  rationale: ஹொஃபால் வினைவடிவத்தின் காரணப்பாட்டு-செயப்பாட்டு வலிமையை ‘நிறுத்தப்பட வேண்டும்’ காக்கிறது; חַי பலியிடப்பட்ட மற்ற வெள்ளாட்டுக்கு மாறாக இது உயிருடன் இருப்பதை வலியுறுத்துகிறது.
- source_word: לְכַפֵּר עָלָיו
  choice: அதன்மேல் பாவநிவிர்த்தி செய்வதற்காக
  rationale: כפר என்பதற்கு வழிபாட்டுச் சூழலில் ‘பாவநிவிர்த்தி செய்’ பொருத்தமானது. עַל என்பதன் ‘மேல்’ என்ற உறவைப் பாதுகாத்து, வெள்ளாட்டுக்காகவே நிவிர்த்தி செய்யப்படுகிறதா என்பதைத் தீர்மானிக்காமல் விடுகிறது.
- source_word: לְשַׁלַּח אֹתוֹ ... הַמִּדְבָּרָה
  choice: அதை ... பாலைநிலத்திற்குள் அனுப்பிவிடுவதற்காக
  rationale: לְשַׁלַּח நோக்கத்தையும் அனுப்பி அகற்றுவதையும் குறிக்கிறது; திசைச்சுட்டு முடிவுடைய הַמִּדְבָּרָה பாலைநிலத்திற்குள் செல்லும் இயக்கத்தை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: עֲזָאזֵל என்பதன் பொருள்
  choice: அசாசேல் (ஒலிபெயர்ப்பு)
  alternative: போக்காட்டுக்குரியது; முற்றிலும் அகற்றுதல்; ஒரு பாலைநில ஆள் அல்லது இடத்தின் பெயர்
  rationale: சொல்லின் துல்லியமான குறிப்பு உறுதியற்றது. ஒலிபெயர்ப்பு பாலைநில ஆள், இடம் அல்லது அகற்றுதலுடன் தொடர்புடைய சொல் ஆகிய சாத்தியங்களை முதன்மை உரையில் திறந்தே வைக்கிறது.
- issue: לְכַפֵּר עָלָיו என்பதன் வலிமை
  choice: அதன்மேல் பாவநிவிர்த்தி செய்வதற்காக
  alternative: அதற்காகப் பாவநிவிர்த்தி செய்வதற்காக
  rationale: עַל என்பதன் அடிப்படையான இட/உறவுப் பொருளைப் பாதுகாப்பதால், வெள்ளாடு பாவநிவிர்த்தியின் பயனைப் பெறுகிறதா அல்லது சடங்கில் தொடர்புடைய கருவியாக உள்ளதா என்பதை மொழிபெயர்ப்பு தீர்மானிப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘பாவநிவிர்த்தி’ என்ற பரவலாக அறியப்பட்ட வேதாகமச் சொல் வைக்கப்பட்டுள்ளது. யெகோவா என்ற திருப்பெயர் மூலத்தின் தனிப்பெயர் வடிவை வெளிப்படுத்துகிறது. இரு அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெறுகின்றன.
