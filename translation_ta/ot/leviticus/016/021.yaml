  text: וְ/סָמַ֨ךְ אַהֲרֹ֜ן אֶת שְׁתֵּ֣י יד/ו עַ֨ל רֹ֣אשׁ הַ/שָּׂעִיר֮ הַ/חַי֒ וְ/הִתְוַדָּ֣ה עָלָ֗י/ו אֶת כָּל עֲוֺנֹת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אֶת כָּל פִּשְׁעֵי/הֶ֖ם לְ/כָל חַטֹּאתָ֑/ם וְ/נָתַ֤ן אֹתָ/ם֙ עַל רֹ֣אשׁ הַ/שָּׂעִ֔יר וְ/שִׁלַּ֛ח בְּ/יַד אִ֥ישׁ עִתִּ֖י הַ/מִּדְבָּֽרָ/ה־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/021.yaml
  text: And Aaron shall lay both his hands on the head of the live goat[a], and confess over it all the iniquities of the sons of Israel, and all their transgressions, all their sins, and put them on the head of the goat[b], and send it away into the wilderness by the hand of a man appointed for the task.
translation:
  language: ta
  text: ஆரோன் உயிருடன் இருக்கும் வெள்ளாட்டுக்கடாவின் தலைமீது தன் இரு கைகளையும் வைத்து, இஸ்ரவேல் மக்களின்[a] எல்லா அக்கிரமங்களையும், அவர்களுடைய எல்லா மீறுதல்களையும், எல்லாப் பாவங்களையும் அதன்மேல் அறிக்கையிட்டு, அவற்றை அந்த வெள்ளாட்டுக்கடாவின் தலைமீது சுமத்த வேண்டும். பின்னர், இதற்கெனத் தயாராக இருக்கும் ஒருவன்[b] மூலம் அதை வனாந்தரத்துக்கு அனுப்ப வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில் நேரடியாக, “இஸ்ரவேலின் புதல்வர்கள்.” இச்சொற்றொடர் இஸ்ரவேல் மக்களை ஒட்டுமொத்தமாகக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “இதற்கென நியமிக்கப்பட்ட ஒருவன்.” இங்கு வரும் எபிரெயச் சொல் அரிதானது; அது ஆயத்தம், நியமனம், அல்லது இச்செயலுக்கான தகுதி ஆகியவற்றை வலியுறுத்தலாம்.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: וְסָמַךְ
  choice: கைகளையும் வைத்து
  rationale: பலியீட்டுச் சடங்கில் கைகளை விலங்கின் தலைமீது வைக்கும் செயலைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது; அழுத்தத்தின் அளவை தேவையின்றி வரையறுக்கவில்லை.
- source_word: שְׁתֵּי יָדוֹ
  choice: தன் இரு கைகளையும்
  rationale: எபிரெயச் சொற்றொடரில் இரு கைகளும் வெளிப்படையாகக் குறிப்பிடப்படுவதைக் காக்கிறது.
- source_word: הַשָּׂעִיר הַחַי
  choice: உயிரோடிருக்கும் வெள்ளாட்டுக்கடா
  rationale: சடங்கில் உயிருடன் வைக்கப்பட்ட ஆண் வெள்ளாட்டைத் துல்லியமாக அடையாளப்படுத்துகிறது.
- source_word: וְהִתְוַדָּה עָלָיו
  choice: அதன்மேல் அறிக்கையிட வேண்டும்
  rationale: விலங்கின்மேல் பாவங்களை அறிக்கையிடும் சடங்குச் செயலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: עֲוֺנֹת
  choice: அக்கிரமங்கள்
  rationale: ஒழுக்கச் சீர்கேடும் குற்றப்பொறுப்பும் அடங்கிய சொல்லின் பாரத்தைத் தக்கவைத்து, அடுத்த இரு பாவச் சொற்களிலிருந்து வேறுபடுத்துகிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: கூட்டாகிய உடன்படிக்கை மக்களைக் குறிக்கும் எபிரெய வழக்கை நவீனத் தமிழில் இயல்பாகத் தருகிறது; நேரடியான வடிவம் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: פִּשְׁעֵיהֶם
  choice: அவர்களுடைய மீறுதல்கள்
  rationale: எல்லைமீறல் அல்லது கலகத்தன்மை கொண்ட குற்றங்களைச் சுட்டும் தனித்த பாவச் சொல்லாக மொழிபெயர்க்கிறது.
- source_word: לְכָל חַטֹּאתָם
  choice: எல்லாப் பாவங்களையும்
  rationale: முன்னுள்ள சொற்களுடன் சேர்ந்து இஸ்ரவேலின் பாவங்களின் முழுமையைக் காட்டும் தொகுப்புப் பட்டியலாக இயல்பாக வழங்குகிறது.
- source_word: וְנָתַן אֹתָם עַל רֹאשׁ
  choice: அவற்றை ... தலைமீது சுமத்தி
  rationale: அறிக்கையிடப்பட்ட பாவங்கள் அடையாளமாக வெள்ளாட்டின் தலைமீது வைக்கப்படுவதைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וְשִׁלַּח
  choice: அனுப்ப வேண்டும்
  rationale: வெள்ளாட்டை அங்கிருந்து அகற்றி வனாந்தரத்துக்கு அனுப்பும் செயலை நேரடியாகக் காக்கிறது.
- source_word: בְּיַד אִישׁ עִתִּי
  choice: இதற்கென ஆயத்தமாக இருக்கும் ஒருவன் மூலம்
  rationale: בְּיַד என்பதன் முகவர் பொருளையும், பொருள் தெளிவில்லாத עִתִּי என்பதில் இருக்கக்கூடிய ஆயத்தம் அல்லது நியமனம் என்ற கருத்தையும் அளவுக்கு மீறித் தீர்மானிக்காமல் தருகிறது.
- source_word: הַמִּדְבָּרָה
  choice: வனாந்தரத்துக்கு
  rationale: திசைநோக்கிய எபிரெய வடிவத்தையும் குடியிருப்பற்ற காட்டுப்பகுதி என்ற பரந்த பொருளையும் காக்கிறது.
theological_decisions:
- issue: மூன்று பாவச் சொற்களையும் தனித்தனியாக மொழிபெயர்த்தல்
  choice: அக்கிரமங்கள் / மீறுதல்கள் / பாவங்கள்
  alternative: எல்லாவற்றையும் ‘பாவங்கள்’ என்று ஒரே சொல்லால் மொழிபெயர்த்தல்
  rationale: עֲוֺנֹת, פִּשְׁעֵיהֶם, חַטֹּאתָם என்ற மூன்று நெருங்கிய பொருளுடைய சொற்களின் குவிப்பு இஸ்ரவேலின் குற்றத்தின் முழுமையை வலியுறுத்துகிறது; தனித்த சொற்கள் அந்த இறையியல் மற்றும் சொல்லாட்சிப் பாரத்தைப் பாதுகாக்கின்றன.
- issue: בְּנֵי יִשְׂרָאֵל என்பதன் வடிவம்
  choice: முதன்மை உரையில் ‘இஸ்ரவேல் மக்கள்’; நேரடி வடிவம் அடிக்குறிப்பில்
  alternative: இஸ்ரவேலின் புதல்வர்கள்
  rationale: இச்சொற்றொடர் முழு இஸ்ரவேல் சமூகத்தையும் குறிக்கிறது. நவீனத் தமிழில் தவறான பாலின அல்லது வயது வரம்பை உண்டாக்காமல் கூட்டுப் பொருளைத் தெளிவாக்கி, மூலத்தின் புதல்வர் உருவகத்தை அடிக்குறிப்பில் காக்கிறது.
- issue: பாவங்களை வெள்ளாட்டின் தலைமீது வைப்பதன் மொழி
  choice: சுமத்தி
  alternative: வைத்து
  rationale: இது சடங்கின் அடையாளச் செயலை வலுவாகத் தெரிவிக்கிறது; ஆனால் அந்தச் செயல் எவ்வாறு பரிகாரம் செய்கிறது என்பது குறித்த கூடுதல் கோட்பாட்டை உரைக்குள் சேர்க்கவில்லை.
- issue: אִישׁ עִתִּי என்பதன் தெளிவின்மை
  choice: ஆயத்தமாக இருக்கும் ஒருவன்
  alternative: நியமிக்கப்பட்ட ஒருவன்
  rationale: எபிரெயச் சொல் ஆயத்தம், குறிப்பிட்ட நேரத்திற்கான நியமனம், அல்லது தகுதி ஆகிய நுணுக்கங்களைக் கொண்டிருக்கலாம். முதன்மை உரை ஒரு சாத்தியமான பொருளைத் தருகிறது; மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான சடங்கு மொழி பயன்படுத்தப்பட்டுள்ளது. ‘வெள்ளாட்டுக்கடா,’ ‘அறிக்கையிடுதல்,’ ‘வனாந்தரம்’ ஆகியவை லேவியராகமத்தின் வழிபாட்டுச் சூழலைத் தெளிவாகக் காக்கின்றன; தேவையற்ற பழமொழிநடை தவிர்க்கப்பட்டுள்ளது.
