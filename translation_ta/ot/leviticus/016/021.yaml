    rationale: עִתִּי என்பதன் தெளிவின்மையை அடிக்குறிப்பு சரியாகக் காக்கிறது. முதன்மை உரையில் ‘இதற்கெனத் தயாராக இருக்கும்’ என்பது அதே சாத்தியமான ‘ready’ பொருளைச் சற்றே இயல்பாக வெளிப்படுத்துகிறது.
  revised_text: ஆரோன் உயிருடன் இருக்கும் வெள்ளாட்டுக்கடாவின் தலைமீது தன் இரு கைகளையும் வைத்து, இஸ்ரவேல் மக்களின்[a] எல்லா அக்கிரமங்களையும், அவர்களுடைய எல்லா மீறுதல்களையும், எல்லாப் பாவங்களையும் அதன்மேல் அறிக்கையிட்டு, அவற்றை அந்த வெள்ளாட்டுக்கடாவின் தலைமீது சுமத்த வேண்டும். பின்னர், இதற்கெனத் தயாராக இருக்கும் ஒருவன்[b] மூலம் அதை வனாந்தரத்துக்கு அனுப்ப வேண்டும்.
