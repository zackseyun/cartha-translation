  source_fidelity: மூலத்தின் சடங்குச் செயல், மூன்று வகை பாவங்களின் குவிப்பு, பாவங்களை ஆட்டின் தலைமீது வைப்பது, வனாந்தரத்துக்கு அனுப்புதல் ஆகியவை வரைவு உரையில் நன்றாகக் காக்கப்பட்டுள்ளன. ஆனால் עִתִּי என்ற அரிதான சொல்லின் பொருள் உறுதியாக இல்லாத நிலையில், முதன்மை உரையின் ‘ஆயத்தமாக இருக்கும்’ என்பது ஓரளவு இயல்பற்றதாக உள்ளது; ‘இதற்கெனத் தயாராக இருக்கும்’ என்பது அதே திறந்த பொருளை நவீனத் தமிழில் தெளிவாகத் தருகிறது.
  naturalness: ‘உயிருடன் இருக்கும்’ என்பது ‘உயிரோடிருக்கும்’ என்பதைக் காட்டிலும் நவீன நிலையான தமிழில் சற்றே இயல்பானது. ‘அறிக்கையிட்டு’ என்பது கைகளை வைத்து பாவங்களை அறிக்கையிடும் தொடர்ச்சியான சடங்குச் செயலைச் சீராக இணைக்கிறது.
  terminology: ‘வெள்ளாட்டுக்கடா,’ ‘அக்கிரமங்கள்,’ ‘மீறுதல்கள்,’ ‘பாவங்கள்,’ ‘வனாந்தரம்’ ஆகியவை பொருத்தமானவை. மூன்று பாவச் சொற்களும் வேறுபடுத்தப்பட்டிருப்பது எபிரெயச் சொல்லாட்சியை நன்றாகப் பாதுகாக்கிறது. அடிக்குறிப்பு a மூலத்தின் நேரடி ‘இஸ்ரவேலின் புதல்வர்கள்’ என்ற வடிவத்தையும் அதன் கூட்டுப் பொருளையும் சரியாகக் குறிப்பிடுகிறது.
