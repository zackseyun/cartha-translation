  revision_rationale: 'சிறிய நடைத்திருத்தங்கள் மட்டுமே செய்யப்பட்டுள்ளன. உரை எபிரெய வாக்கியத்தின் தொடர்ச்சியைத் தெளிவாக்குகிறது: ஆரோன் கைகளை வைத்து, பாவங்களை ஆட்டின்மேல் அறிக்கையிட்டு, அவற்றை அதன் தலைமீது சுமத்துகிறான்; பின்னர் அது நியமிக்கப்பட்ட/தயாரான மனிதன் மூலம் வனாந்தரத்துக்கு அனுப்பப்படுகிறது. עִתִּי பற்றிய தீர்மானிக்கப்படாத நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.'
