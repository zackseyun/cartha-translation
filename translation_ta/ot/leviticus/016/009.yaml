base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/009.yaml
  text: Then Aaron shall present the goat on which the lot for Yahweh fell[a], and make it a sin offering.
translation:
  language: ta
  text: பின்பு, யாவேவுக்கான சீட்டு விழுந்த வெள்ளாட்டை ஆரோன் முன்வைத்து, அதைப் பாவப் பலியாகச் செலுத்த வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேவுக்கான சீட்டு வந்த வெள்ளாடு.”
    reason: எபிரெயச் சொற்றொடரின் நேரடியான மாற்று வழங்கல்; சீட்டு ‘விழுந்தது’ என்பதற்குப் பதிலாக ‘வந்தது/ஏறிவந்தது’ என்ற நெருக்கமான வடிவத்தைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: முன்நிறுத்தி
  rationale: பலியிடும் சடங்குச் சூழலில் இச்சொல் விலங்கை அண்மையில் கொண்டுவந்து சடங்கிற்காக முன்நிறுத்துவதைக் குறிக்கிறது; அடுத்த வினைச்சொல்லுக்கு முன்பே பலியிடுதல் நிறைவேறியதாகச் சொல்லாமல் இந்த வேறுபாட்டைக் காக்கிறது.
- source_word: הַשָּׂעִיר
  choice: வெள்ளாடு
  rationale: שׂעיר இங்கு பலிக்குரிய ஆண் வெள்ளாட்டைக் குறிக்கிறது. தமிழில் சடங்குச் சூழலில் இயல்பாகவும் தெளிவாகவும் ‘வெள்ளாடு’ பயன்படுத்தப்படுகிறது.
- source_word: אֲשֶׁר עָלָה עָלָיו הַגּוֹרָל
  choice: சீட்டு எந்த வெள்ளாட்டின்மேல் விழுந்ததோ
  rationale: ‘சீட்டு விழுதல்’ என்பது எபிரெயச் சொற்றொடரின் பொருளை இயல்பான தமிழில் துல்லியமாகத் தருகிறது; எந்த விலங்கு நியமிக்கப்பட்டது என்பதையும் தெளிவாக்குகிறது.
- source_word: לַיהוָה
  choice: யெகோவாவுக்கான
  rationale: ל முன்னொட்டு நியமிப்பை—‘யெகோவாவுக்கானது’—குறிக்கிறது. יהוה என்ற உடன்படிக்கைப் பெயர் ஒலிபெயர்ப்பாகக் காக்கப்படுகிறது.
- source_word: וְעָשָׂהוּ חַטָּאת
  choice: அதைப் பாவநிவாரணப் பலியாகச் செலுத்த வேண்டும்
  rationale: பலிச் சட்டங்களில் חטאת பாவத்துக்கான பலிவகையைக் குறிக்கிறது. ‘பாவநிவாரணப் பலி’ அதன் சடங்கு நோக்கத்தைத் தெளிவாகக் காட்டுகிறது; עשה என்பதன் சூழல்சார் பொருள் ‘பலியாகச் செலுத்துதல்’ என வழங்கப்படுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: கர்த்தர் / யாவே
  rationale: மூல உரை நான்கெழுத்து உடன்படிக்கைப் பெயரை நேரடியாகப் பயன்படுத்துவதால், பொதுப் பட்டப்பெயராக மாற்றாமல் தனிப்பெயராக ஒலிபெயர்க்கப்படுகிறது. தமிழில் பரவலாக அறியப்படும் ‘யெகோவா’ வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- issue: חטאת என்ற பலிச் சொல்லின் பொருள்
  choice: பாவநிவாரணப் பலி
  alternative: பாவப் பலி
  rationale: இது வெறுமனே ‘பாவம்’ என்று அல்லாமல் ஒரு குறிப்பிட்ட பலிவகையைக் குறிக்கிறது. ‘பாவநிவாரணப் பலி’ சடங்கின் செயல்பாட்டைத் தமிழில் தெளிவாக எடுத்துரைக்கிறது; பரிகாரத்தின் முழுத் தத்துவத்தை இவ்வசனத்திலேயே விரிவாக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் மரியாதையும் சடங்குச் செறிவும் காக்கப்பட்டுள்ளன. ‘முன்நிறுத்தி’ மற்றும் ‘செலுத்த வேண்டும்’ என்பவை எபிரெய உரையிலுள்ள இரு தனித்த சடங்கு நடவடிக்கைகளையும் இயல்பாக வேறுபடுத்துகின்றன.
