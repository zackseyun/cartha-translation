source:
  edition: WLC
  text: וְ/הִקְרִ֧יב אַהֲרֹ֛ן אֶת פַּ֥ר הַ/חַטָּ֖את אֲשֶׁר ל֑/וֹ וְ/כִפֶּ֥ר בַּעֲד֖/וֹ וּ/בְעַ֥ד בֵּיתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/006.yaml
  text: Aaron shall present the bull of the sin offering that is for himself[a], and he shall make atonement for himself and for his household.
translation:
  language: ta
  text: ஆரோன் தனக்குரிய பாவநிவாரணப் பலிக்கான காளையை[a] முன்வைத்து, தனக்காகவும் தன் குடும்பத்தாருக்காகவும் பாவநிவிர்த்தி செய்ய வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தனக்குரிய தூய்மைப்படுத்தும் பலிக்கான காளையை.” எபிரெய மொழியிலுள்ள חַטָּאת என்ற சொல் பாவநிவாரணப் பலியைக் குறிக்கலாம்; சில சூழல்களில் அது சடங்குமுறைத் தூய்மைப்படுத்துதலை வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: முன்வைத்து
  rationale: பலியிடும் சடங்குச் சூழலில் הקריב என்பது ஆண்டவரின் முன்னிலையில் பலியை அருகே கொண்டுவந்து முன்வைப்பதைக் குறிக்கிறது. பலியிடுதல் முழுமையாக முடிந்துவிட்டதாக முன்கூட்டியே சொல்லாமல், சடங்கின் இக்கட்டத்தைத் துல்லியமாகக் காட்டுகிறது.
- source_word: פַּר
  choice: காளையை
  rationale: פַּר என்பது பலிக்குரிய ஆண் மாட்டைக் குறிக்கிறது; நவீனத் தமிழில் “காளை” தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: הַחַטָּאת
  choice: பாவநிவாரணப் பலியின்
  rationale: பலிச்சட்டச் சூழலில் חַטָּאת என்பது பாவத்தை அல்ல, அதற்குரிய பலியைக் குறிக்கிறது. “பாவநிவாரணப் பலி” அதன் பரவலாக அறியப்பட்ட சடங்கு-இறையியல் பொருளைக் காக்கிறது; தூய்மைப்படுத்தும் பலி என்ற மாற்று நுணுக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אֲשֶׁר לוֹ
  choice: தனக்கான
  rationale: இக்காளை மக்களுக்குரிய பலியிலிருந்து வேறுபட்டு ஆரோனுக்காக நியமிக்கப்பட்டது என்பதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וְכִפֶּר
  choice: பாவநிவிர்த்தி செய்ய வேண்டும்
  rationale: ஆசாரிய பலிச் சூழலில் כפר என்பதன் சடங்கு மற்றும் இறையியல் வலிமையை “பாவநிவிர்த்தி செய்” காக்கிறது; எபிரெயச் சொல் வெளிப்படையாகக் கூறாத செயல்முறையை இது மேலும் குறுக்குவதில்லை.
- source_word: בַּעֲדוֹ
  choice: தனக்காகவும்
  rationale: בעד என்பது ஒருவரின் சார்பாக அல்லது நலனுக்காகச் செய்யப்படுவதைக் குறிக்கிறது; “தனக்காக” இயல்பான, சுருக்கமான தமிழ்.
- source_word: וּבְעַד בֵּיתוֹ
  choice: தன் குடும்பத்தாருக்காகவும்
  rationale: בַּיִת இங்கு கட்டிடத்தைவிட குடும்பம் அல்லது வீட்டாரைக் குறிக்கிறது. “குடும்பத்தார்” அந்த மனிதக் குழுவைத் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: பலிச்சட்டங்களில் חַטָּאת என்பதன் மொழிபெயர்ப்பு
  choice: பாவநிவாரணப் பலி
  alternative: தூய்மைப்படுத்தும் பலி
  rationale: உடனடிச் சூழல் பலிச் சடங்கைப் பற்றியது; ஆகவே இச்சொல் கருத்தளவிலான பாவத்தை அல்ல, பலியைக் குறிக்கிறது. “பாவநிவாரணப் பலி” வாசகர்களுக்கு தெளிவான மரபுச் சொல்லாக இருப்பதால் முதன்மை உரையில் பயன்படுத்தப்படுகிறது; சடங்கின் தூய்மைப்படுத்தும் செயல்பாட்டை வலியுறுத்தும் மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: בֵּיתוֹ என்பதன் வரம்பு
  choice: தன் குடும்பத்தார்
  alternative: தன் வீடு
  rationale: இங்கு எபிரெயச் சொல் ஒரு கட்டிடத்தைக் காட்டிலும் ஆரோனின் குடும்பம் அல்லது வீட்டாரைக் குறிக்கிறது. இந்த மொழிபெயர்ப்பு பின்னைய கோட்பாட்டு முடிவுகளைச் சேர்க்காமல் பிரதிநிதித்துவக் குடும்பப் பொருளைக் காக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், வழிபாட்டுச் சட்டத்திற்கேற்ற கண்ணியமான ஆனால் பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. “முன்வைத்து” என்பது பலியை முழுமையாகச் செலுத்திவிட்டதாகச் சொல்லாமல் சடங்கின் அடுத்தடுத்த செயல்முறையைப் பாதுகாக்கிறது; “குடும்பத்தார்” என்பது உடல் கட்டிடமான வீட்டுடன் ஏற்படும் குழப்பத்தைத் தவிர்க்கிறது.
