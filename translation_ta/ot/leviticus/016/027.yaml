base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/027.yaml
  text: And the bull for the sin offering and the goat for the sin offering, whose blood was brought in to make atonement in the sanctuary, he shall bring out to outside the camp, and they shall burn their hides, their flesh, and their dung in the fire.
translation:
  language: ta
  text: பரிசுத்த இடத்தில் பாவநிவிர்த்தி செய்வதற்காக இரத்தம் உள்ளே கொண்டுவரப்பட்ட பாவநிவாரணப் பலிக்கான காளையையும் பாவநிவாரணப் பலிக்கான வெள்ளாட்டுக்கடாவையும் அவன் முகாமுக்கு வெளியே கொண்டுபோக வேண்டும்; அவற்றின் தோல்களையும் சதையையும் சாணத்தையும் அவர்கள்[a] நெருப்பில் எரிக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் “அவன் ... கொண்டுபோக வேண்டும்” என்ற ஒருமை வினையிலிருந்து “அவர்கள் ... எரிக்க வேண்டும்” என்ற பன்மை வினைக்கு மாறுகிறது.
    reason: cultural_note
lexical_decisions:
- source_word: פַּר הַחַטָּאת
  choice: பாவநிவாரணப் பலிக்கான காளை
  rationale: חַטָּאת என்பதன் பலிசார் செயல்பாட்டைத் தெளிவாகக் காட்டும், தமிழில் நிலைபெற்றுள்ள இயல்பான சொற்றொடர்.
- source_word: שְׂעִיר הַחַטָּאת
  choice: பாவநிவாரணப் பலிக்கான வெள்ளாட்டுக்கடா
  rationale: שְׂעִיר என்பது இங்கு ஆண் வெள்ளாட்டைக் குறிக்கிறது; முந்தைய பலிசார் தொடருக்கு இணையாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: הוּבָא אֶת־דָּמָם
  choice: அவற்றின் இரத்தம் உள்ளே கொண்டுவரப்பட்டிருந்ததே
  rationale: בוא வினையின் செயல்பாட்டு வினைப்பாட்டு வடிவத்தையும் பரிசுத்த இடத்துக்குள் சென்ற திசை உணர்வையும் காக்கிறது.
- source_word: לְכַפֵּר
  choice: பாவநிவிர்த்தி செய்வதற்காக
  rationale: כפר என்பதன் பலிசார் பொருளை கோட்பாட்டு விளக்கத்தால் குறுக்காமல், புரிந்துகொள்ளத்தக்க மரபான தமிழில் தருகிறது.
- source_word: בַּקֹּדֶשׁ
  choice: பரிசுத்த இடத்தில்
  rationale: இங்கு קֹדֶשׁ என்பது பண்பாகிய பரிசுத்தத்தை அல்ல, சடங்குக்குரிய புனித இடத்தைக் குறிக்கிறது.
- source_word: יוֹצִיא אֶל־מִחוּץ לַמַּחֲנֶה
  choice: அவன் முகாமுக்கு வெளியே கொண்டுபோக வேண்டும்
  rationale: எபிரெயச் சொற்றொடரின் திசை உணர்வை இயல்பான தமிழில் வெளிப்படுத்துகிறது; ஒருமை வினைச் சுட்டையும் காக்கிறது.
- source_word: וְשָׂרְפוּ בָאֵשׁ
  choice: அவர்கள் நெருப்பில் எரிக்க வேண்டும்
  rationale: எபிரெயத்தில் வரும் பன்மை வினையையும், எரித்தழிக்கும் செயற்பாட்டையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: עֹרֹתָם
  choice: அவற்றின் தோல்கள்
  rationale: விலங்குகளின் வெளித்தோலைக் குறிக்கும் இயல்பான தமிழ்ச் சொல்.
- source_word: בְּשָׂרָם
  choice: அவற்றின் சதை
  rationale: பலியிடப்பட்ட விலங்கின் உடல் திசுவைக் குறிக்கும் בשר என்பதற்கான துல்லியமான சூழல்சார் மொழிபெயர்ப்பு.
- source_word: פִּרְשָׁם
  choice: அவற்றின் சாணம்
  rationale: உட்கழிவு அல்லது மலம் என்பதைக் குறிக்கும் சொல்லின் நேரடியான, சூழலுக்கு ஏற்ற பொருளை வழங்குகிறது.
theological_decisions:
- issue: חטאת மற்றும் כפר ஆகிய பலிசார் சொற்களின் மொழிபெயர்ப்பு
  choice: “பாவநிவாரணப் பலி” மற்றும் “பாவநிவிர்த்தி செய்”
  alternative: “தூய்மைப்படுத்தும் பலி” மற்றும் “தூய்மைப்படுத்து”
  rationale: பாவநிவாரண நாளின் சடங்குச் சூழலில் வழக்கமான இறையியல் சொற்களைப் பயன்படுத்தினாலும், כפר என்பதன் செயலை ஓர் ஒற்றைக் கோட்பாட்டு விளக்கமாகச் சுருக்காமல் விடுகிறது.
- issue: ஒருமையான יוֹצִיא இலிருந்து பன்மையான וְשָׂרְפוּக்கு மாறுதல்
  choice: “அவன் ... கொண்டுபோக வேண்டும்; ... அவர்கள் ... எரிக்க வேண்டும்” என்று எண்ணிக்கை மாற்றத்தைத் தக்கவைத்தல்
  alternative: இரு செயல்களையும் ஒரே ஒருமை அல்லது பொதுப்படையான எழுவாயில் அமைத்தல்
  rationale: மூலத்தில் உள்ள இலக்கண மாற்றத்தை வெளிப்படையாகக் காக்கிறது; யார் உதவியாளர்கள் என்பதை உரை தெளிவாகச் சொல்லாததால் அதற்கு மேலான விளக்கத்தைத் திணிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், திருச்சட்ட உரைக்கு ஏற்ற கண்ணியமான ஆனால் எளிதில் புரியும் நடை. நீண்ட தொடர்புச் சொற்றொடரை இடைக்கோடுகளால் பிரித்து வாசிப்புத் தெளிவு பெற்றுள்ளது; மூலத்தின் ஒருமை–பன்மை மாற்றம் பாதுகாக்கப்பட்டுள்ளது.
