  text: He shall wash his body with water in a holy place[a], put on his garments, come out, and offer his burnt offering and the burnt offering of the people[c][b], and make atonement for himself and for the people.
translation:
  language: ta
  text: அவர் பரிசுத்தமான ஒரு இடத்தில்[a] தன் உடலைத்[b] தண்ணீரால் கழுவி, தன் ஆடைகளை அணிந்து, வெளியே வந்து, தனது தகனபலியையும் மக்களின் தகனபலியையும் செலுத்தி, தனக்காகவும் மக்களுக்காகவும் பரிகாரம் செய்ய வேண்டும்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘பரிசுத்தமான ஒரு இடத்தில்’ என்று உள்ளது; இது ஆசரிப்புக்கூடாரத்தின் ‘பரிசுத்த ஸ்தலம்’ எனப்படும் குறிப்பிட்ட அறையைக் கட்டாயமாகக் குறிக்காது.
    reason: lexical_alternative
  - marker: b
    text: நேரடியாக, ‘தன் சதையை’.
    reason: lexical_alternative
  - marker: c
    text: ‘பாவநிவிர்த்தி செய்ய’ என்றும், சில சடங்குச் சூழல்களில் ‘தூய்மைப்படுத்த’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָחַץ
  choice: கழுவி ... வேண்டும்
  rationale: சட்ட வழிமுறைகளின் தொடரில் வரும் இந்த வினை வடிவம் கடந்தகால நிகழ்வை அல்ல, செய்ய வேண்டிய நடைமுறையைச் சுட்டுகிறது. தமிழில் இறுதியில் வரும் ‘வேண்டும்’ முழு வினைத்தொடருக்கும் விதிமுறைப் பொருளை அளிக்கிறது.
- source_word: בְּשָׂרוֹ
  choice: தன் உடலை
  rationale: எபிரெயச் சொல்லின் நேரடிப் பொருள் ‘தன் சதையை’ என்றாலும், சடங்கு சார்ந்த குளிப்பைக் குறிக்கும் இச்சூழலில் ‘உடல்’ என்பது இயல்பாகவும் தவறான இறையியல் தொடர்புகளைத் தவிர்ப்பதாகவும் உள்ளது.
- source_word: בַּמַּיִם
  choice: தண்ணீரால்
  rationale: רחץ என்ற கழுவுதல் வினையுடன் கருவிப் பொருளில் வரும் ב முன்னிடைச்சொல்லை நவீன தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: בְּמָקוֹם קָדוֹשׁ
  choice: பரிசுத்தமான ஓர் இடத்தில்
  rationale: מקום என்பதற்கு எபிரெயத்தில் குறிப்புச் சுட்டு இல்லை. எனவே இது ஆசரிப்புக்கூடாரத்தின் தொழில்நுட்பப் பெயரான ‘பரிசுத்த ஸ்தலம்’ என்று கட்டாயமாகப் பொருள்படாமல், பரிசுத்தமான ஓர் இடத்தைக் குறிக்கிறது.
- source_word: וְלָבַשׁ אֶת בְּגָדָיו
  choice: தன் ஆடைகளை அணிந்துகொண்டு
