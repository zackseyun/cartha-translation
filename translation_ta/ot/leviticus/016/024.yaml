- source_word: וְיָצָא
  choice: வெளியே வந்து
  rationale: பரிசுத்தமான இடத்திலிருந்து அடுத்த சடங்கு நடவடிக்கைக்காக வெளியே நகர்வதைத் தெளிவாகக் காட்டுகிறது.
- source_word: וְעָשָׂה
  choice: செலுத்தி
  rationale: தகனபலியுடன் வரும் עשה என்பதன் சடங்குப் பொருளை ‘செய்து’ என்பதைவிட ‘பலி செலுத்தி’ என்ற தமிழ் வழக்கு தெளிவாக வெளிப்படுத்துகிறது.
- source_word: עֹלָתוֹ
  choice: தனக்கான தகனபலி
  rationale: עֹלָה என்பதற்கான வழக்கமான பலியியல் சொல்லாக ‘தகனபலி’ பயன்படுத்தப்பட்டுள்ளது; உடைமை மட்டுமல்லாது அவருக்காகச் செலுத்தப்படும் பலி என்ற பொருளையும் ‘தனக்கான’ தெளிவுபடுத்துகிறது.
- source_word: עֹלַת הָעָם
  choice: மக்களுக்கான தகனபலி
  rationale: முந்தைய சொற்றொடருடன் இணையான அமைப்பைத் தக்கவைத்து, மக்களின் சார்பாகச் செலுத்தப்படும் பலியைக் காட்டுகிறது.
- source_word: וְכִפֶּר
  choice: பாவநிவிர்த்தி செய்ய
  rationale: லேவியராகமப் பலியியல் சூழலில் כפר என்பதன் பரந்த ஒப்புரவாக்கும் பொருளைத் தமிழில் நிலைபெற்ற முறையில் தெரிவிக்கிறது; ஒரு குறிப்பிட்ட பாவநிவாரணக் கோட்பாட்டுக்குள் பொருளைக் குறுக்கவில்லை.
- source_word: בַּעֲדוֹ וּבְעַד הָעָם
  choice: தனக்காகவும் மக்களுக்காகவும்
  rationale: בעד என்பதன் சார்பாகச் செய்யப்படும் செயல் என்ற பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: லேவியராகமப் பலிச் சட்டத்தில் כפר என்பதன் மொழிபெயர்ப்பு
  choice: பாவநிவிர்த்தி செய்ய
  alternative: பரிகாரம் செய்ய; சடங்கு முறையில் தூய்மைப்படுத்த
  rationale: ‘பாவநிவிர்த்தி செய்ய’ என்பது இங்கு ஆசாரியர் பலி செலுத்துவதன் ஒப்புரவாக்கும் நோக்கத்தைப் பரந்த வகையில் தக்கவைக்கிறது. ‘பரிகாரம்’ மற்றும் சில சடங்குச் சூழல்களில் ‘தூய்மைப்படுத்துதல்’ என்பன சாத்தியமான நுண்பொருள்கள்; ஆனால் அவற்றில் ஒன்றை மட்டும் முதன்மை உரையில் தேர்ந்தெடுப்பது எபிரெயச் சொல்லின் பொருளைத் தேவையின்றிக் குறுக்கலாம்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதையான சட்ட-சடங்கு நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் தொடர் நடவடிக்கைகள் தமிழ் வினையெச்சங்களால் இணைக்கப்பட்டு, இறுதியிலுள்ள ‘வேண்டும்’ முழுத் தொடருக்கும் கட்டளை/விதிமுறை வலிமையை வழங்குகிறது. ‘பரிசுத்த ஸ்தலம்’ என்ற தொழில்நுட்பப் புரிதலைத் தவிர்க்க ‘பரிசுத்தமான ஓர் இடம்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
