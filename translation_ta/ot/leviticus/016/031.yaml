source:
  edition: WLC
  text: שַׁבַּ֨ת שַׁבָּת֥וֹן הִיא֙ לָ/כֶ֔ם וְ/עִנִּיתֶ֖ם אֶת נַפְשֹׁתֵי/כֶ֑ם חֻקַּ֖ת עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/031.yaml
  text: It is a Sabbath of complete rest for you[a], and you shall humble yourselves; it is a permanent statute.
translation:
  language: ta
  text: இது உங்களுக்கு முழுமையான ஓய்வுநாள்; நீங்கள் உங்களைத் தாழ்த்திக்கொள்ள வேண்டும்[a]. இது நிரந்தரமான நியமம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உங்களை வருத்திக்கொள்ள வேண்டும்’; இது நோன்பிருத்தலையும் தன்னொடுக்கத்தையும் உள்ளடக்குவதாக மரபாகப் புரிந்துகொள்ளப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁבַּת שַׁבָּתוֹן
  choice: முழுமையான ஓய்வுக்குரிய ஓய்வுநாள்
  rationale: ‘ஓய்வுநாள்’ என்பதைத் தோராவின் நிலையான வழிபாட்டு-இறையியல் சொல்லாக வைத்துக்கொண்டு, இரட்டைப் பதத்தின் வலியுறுத்தலை ‘முழுமையான ஓய்வு’ என இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הִיא לָכֶם
  choice: அது உங்களுக்கு
  rationale: சமூகத்தாரை நோக்கிய எபிரெய முன்னிலைத் தொடரையும் பெயர்ப்பயனிலை வாக்கியத்தையும் சுருக்கமான, இயல்பான தமிழில் காக்கிறது.
- source_word: וְעִנִּיתֶם אֶת נַפְשֹׁתֵיכֶם
  choice: நீங்கள் உங்களைத் தாழ்த்திக்கொள்ள வேண்டும்
  rationale: נֶפֶשׁ இங்கு தனித்த ‘ஆத்துமா’வைக் குறிக்காமல் தற்சுட்டுப் பொருளில் வருகிறது. ענה என்பதன் சடங்குசார் தன்னைத் தாழ்த்துதல்/வருத்துதல் என்ற பரந்த பொருளை, உடல் வன்முறையாகத் தவறாகப் புரிந்துகொள்ளாத வகையில் அளிக்கிறது.
- source_word: חֻקַּת עוֹלָם
  choice: என்றென்றைக்குமான நியமம்
  rationale: சட்ட ஏற்பாட்டின் தொடர்ந்த நிலைத்தன்மையைத் தெளிவாகக் கூறும் எபிரெய மரபுத்தொடருக்கு இயல்பான, கண்ணியமான தமிழ் வடிவம்.
theological_decisions:
- issue: பாவநிவாரண நாளில் கட்டளையிடப்படும் தன்னொடுக்கத்தின் பொருள்
  choice: முதன்மை உரையில் ‘உங்களைத் தாழ்த்திக்கொள்ள வேண்டும்’ என்று பொதுவான பொருளில் மொழிபெயர்த்தல்
  alternative: ‘உங்களை வருத்திக்கொள்ள வேண்டும்’ அல்லது நேரடியாக ‘நோன்பிருக்க வேண்டும்’ என்று மொழிபெயர்த்தல்
  rationale: எபிரெய உரை நோன்பைக் குறிக்கும் நேரடி வினையைப் பயன்படுத்தாமல், ענה + נפשׁ என்ற பரந்த மரபுத்தொடரைப் பயன்படுத்துகிறது. ஆகவே நோன்பை மட்டும் முதன்மை உரையில் நிர்ணயிக்காமல், மரபான புரிதலை அடிக்குறிப்பில் தருவது மூலத்தின் பொருள் விரிவையும் இறையியல் இழுவிசையையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான சட்ட-வழிபாட்டு நடையைப் பயன்படுத்துகிறது. ‘ஓய்வுநாள்’ என்ற பரிச்சயமான தோராசார் சொல்லைத் தக்கவைத்து, தேவையற்ற பழமையான நடையைத் தவிர்க்கிறது.
