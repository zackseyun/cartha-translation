review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the self-humbling command and the enduring legal formula. However, ‘முழுமையான ஓய்வுக்குரிய ஓய்வுநாள்’ is syntactically cumbersome and does not naturally express the Hebrew intensive cultic designation שַׁבַּת שַׁבָּתוֹן.
  naturalness: The proposed revision uses clear modern standard Tamil while retaining the established theological/cultic term ‘ஓய்வுநாள்.’ ‘முழுமையான ஓய்வுநாள்’ is a more idiomatic rendering of the emphatic expression.
  terminology: ‘உங்களைத் தாழ்த்திக்கொள்ள வேண்டும்’ appropriately preserves the broad ritual idiom ענה את נפש without narrowing it to fasting. ‘நிரந்தரமான நியமம்’ suitably renders חֻקַּת עוֹלָם. The footnote retains the lexical alternative and traditional association without making it the main-text meaning.
  issues:
  - severity: medium
    issue: Awkward rendering of שַׁבַּת שַׁבָּתוֹן
    rationale: ‘முழுமையான ஓய்வுக்குரிய ஓய்வுநாள்’ has an unnatural nested construction (‘a rest day for complete rest’). The Hebrew denotes an emphatic Sabbath/rest-day designation, which Tamil can express directly as ‘முழுமையான ஓய்வுநாள்.’
  revised_text: இது உங்களுக்கு முழுமையான ஓய்வுநாள்; நீங்கள் உங்களைத் தாழ்த்திக்கொள்ள வேண்டும்[a]. இது நிரந்தரமான நியமம்.
