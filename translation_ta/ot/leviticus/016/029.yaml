base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/029.yaml
  text: 'And this shall be for you a permanent statute: in the seventh month[a], on the tenth day of the month, you shall humble yourselves, and you shall do no work, whether the native-born or the sojourner who sojourns among you.'
translation:
  language: ta
  text: 'இது உங்களுக்கு நிலையான நியமமாக இருக்க வேண்டும்: ஏழாம் மாதத்தின் பத்தாம் நாளில் நீங்கள் உங்களைத் தாழ்த்திக்கொள்ள வேண்டும்[a]. நாட்டில் பிறந்தவராயினும் உங்களிடையே குடியிருக்கும் அந்நியராயினும், எந்த வேலையும் செய்யக்கூடாது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொற்பொருளுக்கு நெருக்கமாக, “நீங்கள் உங்களை வருத்திக்கொள்ள வேண்டும்.” இந்தச் சொற்றொடர் நோன்பிருப்பதையும் உள்ளடக்குவதாக மரபாகப் புரிந்துகொள்ளப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: இது ... இருக்க வேண்டும்
  rationale: சட்ட உரையில் முந்தைய கட்டளைகளைச் சுட்டி, அவை நிலையான நியமமாக இருக்க வேண்டும் என்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: לְחֻקַּת עוֹלָם
  choice: என்றென்றைக்குமான நியமம்
  rationale: חֻקָּה என்பதன் கட்டுப்படுத்தும் சட்டப் பொருளையும் עוֹלָם என்பதன் தொடர்ந்துநிலைக்கும் கால வலிமையையும் காக்கிறது.
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי בֶּעָשׂוֹר לַחֹדֶשׁ
  choice: ஏழாம் மாதம், மாதத்தின் பத்தாம் நாளில்
  rationale: எபிரெய நாட்காட்டிக் குறிப்பைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: תְּעַנּוּ אֶת־נַפְשֹׁתֵיכֶם
  choice: நீங்கள் உங்களைத் தாழ்த்திக்கொள்ள வேண்டும்
  rationale: இந்த எபிரெய மரபுத்தொடர் தன்னடக்கம், தன்னை வருத்துதல், தாழ்த்துதல் ஆகிய பரப்பைக் கொண்டது. நோன்பு மட்டும் என்று குறுக்காமல் அதன் விரிவான பொருளைக் காக்கிறது.
- source_word: וְכָל־מְלָאכָה לֹא תַעֲשׂוּ
  choice: எந்த வேலையும் செய்யக்கூடாது
  rationale: מְלָאכָה என்பதன் வேலை அல்லது உழைப்பு என்ற பொதுப்பொருளைத் தெளிவான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: הָאֶזְרָח
  choice: நாட்டில் பிறந்தவர்
  rationale: சமூகத்தின் பிறப்புவழி உறுப்பினரை, குடியிருக்கும் அந்நியரிலிருந்து வேறுபடுத்திக் காட்டுகிறது.
- source_word: הַגֵּר הַגָּר בְּתוֹכְכֶם
  choice: உங்களிடையே குடியிருக்கும் அந்நியர்
  rationale: இஸ்ரவேல் சமூகத்துக்குள் வசிக்கும் வெளியினரை இயல்பான தமிழில் குறிக்கிறது; நவீன அரசியல் அல்லது இழிவான உட்பொருள்களைத் தவிர்க்கிறது.
theological_decisions:
- issue: பாவநிவாரண நாளில் தன்னைத் தாழ்த்திக்கொள்ளும் கட்டளையின் பொருள்
  choice: முதன்மை உரையில் “உங்களைத் தாழ்த்திக்கொள்ள வேண்டும்” என்று விரிவாக மொழிபெயர்த்தல்
  alternative: “உங்களை வருத்திக்கொள்ள வேண்டும்” அல்லது “நோன்பிருக்க வேண்டும்”
  rationale: எபிரெய மரபுத்தொடர் நோன்பை உள்ளடக்கலாம்; ஆனால் அது நோன்பை மட்டும் வெளிப்படையாகக் குறிப்பிடவில்லை. ஆகவே முதன்மை உரை அதன் பொருள் பரப்பையும் இறையியல் அழுத்தத்தையும் குறுக்காமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்ட உரைக்கேற்ற கண்ணியமான ஆனால் பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயச் சொற்றொடரின் உண்மையான பொருள் விரிவு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
