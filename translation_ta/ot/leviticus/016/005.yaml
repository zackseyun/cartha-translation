  text: וּ/מֵ/אֵ֗ת עֲדַת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל יִקַּ֛ח שְׁנֵֽי שְׂעִירֵ֥י עִזִּ֖ים לְ/חַטָּ֑את וְ/אַ֥יִל אֶחָ֖ד לְ/עֹלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/005.yaml
  text: And from the congregation of the sons of Israel he shall take two male goats for a sin offering and one ram for a burnt offering[a][b].
translation:
  language: ta
  text: இஸ்ரவேல் மக்களின் சபையிடமிருந்து[a], பாவப் பலிக்காக இரண்டு வெள்ளாட்டுக் கடாக்களையும், தகனப் பலிக்காக ஒரு செம்மறியாட்டுக் கடாவையும் அவன் எடுத்துக்கொள்ள வேண்டும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “இஸ்ரவேலின் மகன்களுடைய சபையிடமிருந்து”; அதாவது, இஸ்ரவேல் மக்களின் சமூகத்திடமிருந்து.
    reason: lexical_alternative
  - marker: b
    text: “பாவப் பலி” என்பதை “தூய்மைப்படுத்தும் பலி” என்றும் மொழிபெயர்க்கலாம். லேவியராகமத்தில் இச்சொல் பாவத்தையும் சடங்குத் தீட்டையும் கையாளும் பலியைக் குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמֵאֵת
  choice: இடமிருந்து
  rationale: இணைப்புச் சொல்லுடன் வரும் இந்த முன்னிடைச்சொல், பலிக்குரிய விலங்குகள் இஸ்ரவேல் சமூகத்திடமிருந்து பெறப்பட வேண்டும் என்பதைக் குறிக்கிறது. தமிழில் வாக்கியத் தொடர்ச்சி சூழலால் இயல்பாகத் தெளிவாகிறது.
- source_word: עֲדַת
  choice: சபை
  rationale: உடன்படிக்கைச் சமூகமாகக் கூடியிருக்கும் மக்களைக் குறிக்கும் சொல். லேவியராகமத்தின் சடங்குச் சூழலுக்கு ஏற்ற, பொதுவாகப் புரிந்துகொள்ளக்கூடிய சொல்.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: எபிரெயச் சொற்றொடர் சொற்படியாக ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு இஸ்ரவேல் சமூகத்தாரை மொத்தமாகக் குறிக்கிறது. இயல்பான நவீன தமிழில் ‘இஸ்ரவேல் மக்கள்’ என வழங்கி, சொற்படியான வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: יִקַּח
  choice: எடுத்துக்கொள்ள வேண்டும்
  rationale: இங்கு imperfect வடிவம் சடங்குச் சட்டத்தின் கட்டளையைக் குறிக்கிறது. ‘வேண்டும்’ என்பது அதன் நெறிப்படுத்தும் வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: שְׁנֵי שְׂעִירֵי עִזִּים
  choice: இரண்டு வெள்ளாட்டுக் கடாக்கள்
  rationale: இந்தச் சொற்றொடர் ஆண் வெள்ளாடுகளைச் சுட்டுகிறது. ‘கடா’ பாலின வேறுபாட்டைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: לְחַטָּאת
  choice: பாவப் பலிக்காக
  rationale: பலியியல் சூழலில் חַטָּאת என்பது பாவத்தோடும் சடங்குத் தீட்டோடும் தொடர்புடைய குறிப்பிட்ட பலிவகையைக் குறிக்கிறது. ‘பாவப் பலி’ மரபாகவும் சுருக்கமாகவும் புரியும்; ‘தூய்மைப்படுத்தும் பலி’ என்ற சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְאַיִל אֶחָד
  choice: ஒரு செம்மறியாட்டுக் கடா
  rationale: אַיִל குறிப்பாக ஆண் செம்மறியாட்டைக் குறிக்கிறது. வெள்ளாட்டுக் கடாக்களிலிருந்து வேறுபாடு தெளிவாக இருக்க இவ்வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- source_word: לְעֹלָה
  choice: தகனப் பலிக்காக
  rationale: עֹלָה முழுவதுமாக எரிக்கப்படும் பலியைக் குறிக்கும் நிலையான பலியியல் சொல். ‘தகனப் பலி’ தமிழில் சுருக்கமானதும் தெளிவானதும் ஆகும்.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל என்பதன் சமூகப் பொருள்
  choice: இஸ்ரவேல் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: இச்சட்டத்தில் சொற்றொடர் ஆண் பிள்ளைகளை மட்டும் அல்லாமல் உடன்படிக்கைச் சமூகத்தை மொத்தமாகக் குறிக்கிறது. பிரதான உரையில் இயல்பான சமூகப் பொருள் தரப்பட்டு, மூலத்தின் ஆண்பால் வடிவம் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- issue: חַטָּאת பலியின் பெயர்
  choice: பாவப் பலி
  alternative: தூய்மைப்படுத்தும் பலி
  rationale: எபிரெயச் சொல் பாவத்தைக் கையாளும் பலியையும் சடங்குத் தீட்டை நீக்கும் அதன் தூய்மைப்படுத்தும் செயலையும் உள்ளடக்கக்கூடும். பிரதான உரை பரவலாக அறியப்பட்ட பெயரைப் பயன்படுத்துகிறது; மாற்றுப் புரிதலை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் சட்டவிதிக்குரிய தெளிவும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. பலிவகைகளுக்கு சுருக்கமான மரபுச் சொற்கள் பயன்படுத்தப்பட்டுள்ளன; விலங்குகளின் இனம் மற்றும் பாலின வேறுபாடு வெளிப்படையாகக் காக்கப்பட்டுள்ளது.
