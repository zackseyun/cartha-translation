base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/013.yaml
  text: And he shall put the incense on the fire before Yahweh[a], so that the cloud of the incense may cover the mercy seat that is over the testimony, so that he may not die.
translation:
  language: ta
  text: அவன் யாவேவின் திருமுன் நெருப்பின்மேல் தூபப்பொருளை இட வேண்டும்; அவன் சாகாதபடி, தூபப்புகை சாட்சிக்கு மேலிருக்கும் பாவநிவாரண மூடியை[a] மூட வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மரபாக, ‘கிருபாசனம்.’ எபிரேயச் சொல் பேழையின் மூடியை, குறிப்பாகப் பாவநிவாரணச் சடங்கில் அதற்குள்ள பங்கை, குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַן
  choice: இட வேண்டும்
  rationale: சடங்கு நடைமுறையை அறிவுறுத்தும் இந்தச் சட்டச் சூழலில், இணைப்புடன் வந்த நிறைவுவினை கட்டளை சார்ந்த எதிர்கால வலிமை பெறுகிறது; நவீன தமிழில் ‘இட வேண்டும்’ இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַקְּטֹרֶת
  choice: தூபப்பொருள்
  rationale: பரிசுத்த இடச் சடங்கில் பயன்படுத்தப்பட்ட நறுமணத் தூபக் கலவையை இது குறிக்கிறது. வெறும் புகையைக் குறிக்கும் சொல்லாகத் தவறாகப் புரியாதபடி ‘தூபப்பொருள்’ எனப்பட்டது.
- source_word: עַל הָאֵשׁ
  choice: நெருப்பின்மேல்
  rationale: தூபப்பொருளை எரியும் தணல்களின்மேல் இடுவதை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: לִפְנֵי יְהוָה
  choice: யாவேவின் திருமுன்
  rationale: யாவே முன்னிலையில், அவருக்கு அருகில் நடைபெறும் திருச்சடங்கு என்ற இடவியல் மற்றும் உறவியல் பொருளை மரியாதையான தமிழில் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தலைப்பொன்றால் மாற்றாமல், எபிரேய இறைப்பெயரின் பரவலாக ஏற்கப்பட்ட தமிழ் ஒலிபெயர்ப்பைப் பயன்படுத்துகிறது.
- source_word: וְכִסָּה
  choice: மூடிக்கொள்ள வேண்டும்
  rationale: தூபப்புகை மூடியை மறைக்கும் நோக்கம் அல்லது எதிர்பார்க்கப்படும் விளைவு ஆகிய இரண்டுக்கும் இடமளிக்கிறது; எபிரேய வாக்கியத் தொடரை அளவுக்கு மீறி விளக்கவில்லை.
- source_word: עֲנַן הַקְּטֹרֶת
  choice: தூபப்புகை
  rationale: சொல்லளவில் ‘தூபத்தின் மேகம்’ என்றாலும், தமிழில் தூபத்திலிருந்து எழும் அடர்ந்த புகைமேகத்தை ‘தூபப்புகை’ இயல்பாகவும் தெளிவாகவும் கூறுகிறது.
- source_word: הַכַּפֹּרֶת
  choice: பாவநிவாரண மூடி
  rationale: இது உடன்படிக்கைப் பேழையின் மூடியையும், பாவநிவாரணச் சடங்கில் அதன் சிறப்புப் பங்கையும் குறிக்கிறது. ‘மூடி’ பொருளைத் தெளிவாக்குகிறது; ‘பாவநிவாரண’ அதன் சடங்கியல் தொடர்பைக் காக்கிறது.
- source_word: אֲשֶׁר עַל הָעֵדוּת
  choice: சாட்சிக்கு மேலிருக்கும்
  rationale: எபிரேயத்தின் ‘சாட்சி’ என்ற சொல்லை விரிவாக்காமல் காக்கிறது; அது பேழைக்குள் வைக்கப்பட்ட உடன்படிக்கைச் சாட்சியைச் சுட்டுகிறது.
- source_word: וְלֹא יָמוּת
  choice: அப்போது அவன் சாகமாட்டான்
  rationale: தூபப்புகை மூடியை மறைப்பதன் பாதுகாப்பான விளைவை இயல்பான தமிழில் தெரிவிக்கிறது. இது நோக்கம் அல்லது விளைவு என்ற தொடர்பை கடுமையாக ஒரே விதத்தில் தீர்மானிப்பதில்லை.
theological_decisions:
- issue: பரிசுத்த இடம் மற்றும் பாவநிவாரணச் சூழலில் הַכַּפֹּרֶת என்பதன் மொழிபெயர்ப்பு
  choice: பாவநிவாரண மூடி
  alternative: கிருபாசனம்
  rationale: எபிரேயச் சொல் பேழையின் மூடியைக் குறிக்கிறது; பாவநிவாரணச் சடங்கோடு நெருங்கிய தொடர்பும் கொண்டது. ‘பாவநிவாரண மூடி’ பொருளையும் சடங்கியல் பணியையும் தெளிவாக வைத்திருக்கிறது. மரபான ‘கிருபாசனம்’ அடிக்குறிப்பில் தரப்படுகிறது.
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் உள்ள தனிப்பட்ட இறைப்பெயரை ஒரு பட்டத்தால் மாற்றாமல் ஒலிபெயர்த்து வழங்குகிறது.
- issue: וְכִסָּה ... וְלֹא יָמוּת என்ற தொடர்களின் தர்க்க உறவு
  choice: எதிர்பார்க்கப்படும் விளைவைக் காட்டும் தொடராக மொழிபெயர்த்தல்
  alternative: ‘அவன் சாகாதபடி’ என்று வெளிப்படையான நோக்கத் தொடராக மொழிபெயர்த்தல்
  rationale: எபிரேய இணைப்புகள் நோக்கம் அல்லது விளைவு இரண்டிற்கும் இடமளிக்கின்றன. ‘அப்போது அவன் சாகமாட்டான்’ பாதுகாப்பான விளைவைத் தெளிவாக்குவதோடு, நோக்கம் மட்டுமே என்று வாக்கியத்தைச் சுருக்கித் தீர்மானிப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன தரமான தமிழில், சட்ட-திருச்சடங்கு உரைக்கு ஏற்ற மரியாதையான ஆனால் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘திருமுன்’ சடங்கியல் முன்னிலையைச் சுருக்கமாகத் தருகிறது; பழமையான வினைமுற்றுகள் தவிர்க்கப்பட்டுள்ளன.
