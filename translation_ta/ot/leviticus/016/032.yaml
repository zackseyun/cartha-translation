  edition: WLC
  text: וְ/כִפֶּ֨ר הַ/כֹּהֵ֜ן אֲשֶׁר יִמְשַׁ֣ח אֹת֗/וֹ וַ/אֲשֶׁ֤ר יְמַלֵּא֙ אֶת יָד֔/וֹ לְ/כַהֵ֖ן תַּ֣חַת אָבִ֑י/ו וְ/לָבַ֛שׁ אֶת בִּגְדֵ֥י הַ/בָּ֖ד בִּגְדֵ֥י הַ/קֹּֽדֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/032.yaml
  text: And the priest who is anointed and whose hand is filled to serve as priest in place of his father shall make atonement[a], and he shall put on the linen garments, the holy garments.
translation:
  language: ta
  text: அபிஷேகம் செய்யப்பட்டு, தன் தந்தைக்குப் பதிலாக ஆசாரியராகப் பணியாற்றுவதற்காக ஆசாரியப் பணியில் அமர்த்தப்பட்ட அந்த ஆசாரியர்[a] பாவநிவிர்த்தி செய்ய வேண்டும். அவர் சணல் நூல் உடைகளாகிய பரிசுத்த உடைகளை அணிந்துகொள்ள வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்கு சொல், ‘அவருடைய கை நிரப்பப்பட்டவர்.’ இது ஆசாரியப் பணியில் ஒருவரை முறைப்படி அமர்த்துவதைக் குறிக்கும் மரபுத்தொடர்.
    reason: ‘கையை நிரப்புதல்’ என்ற எபிரெய பணி நியமன மரபுத்தொடரின் சொற்சார்ந்த வடிவத்தையும் பொருளையும் பாதுகாக்கிறது.
lexical_decisions:
- source_word: וְכִפֶּר
  choice: பாவநிவிர்த்தி செய்ய வேண்டும்
  rationale: ஆசாரியச் சடங்குச் சூழலில் כפר குறிக்கும் பாவநிவிர்த்தி அல்லது தூய்மைப்படுத்தும் செயலை, அதன் செயல்முறையை அளவுக்கு மீறி விளக்காமல் வழக்கமான தமிழ் இறையியல் சொல்லாட்சியில் தருகிறது.
- source_word: הַכֹּהֵן
  choice: ஆசாரியராகப் பணியாற்றுவதற்காக ... ஆசாரியப் பணியில் அமர்த்தப்பட்டவர்
  rationale: எபிரெய மூலத்தில் தனியாக ‘தலைமை ஆசாரியர்’ என்ற பட்டம் இல்லை; அபிஷேகம், பணி அமர்த்துதல், தந்தைக்குப் பதிலாக வருதல் ஆகியவற்றால் அந்த ஆசாரியர் அடையாளப்படுத்தப்படுகிறார்.
- source_word: אֲשֶׁר יִמְשַׁח אֹתוֹ
  choice: அபிஷேகம் செய்யப்பட்டு
  rationale: அபிஷேகத்தின் மூலம் அந்த ஆசாரியர் நியமிக்கப்படுவதை இயல்பான தமிழ் செயப்பாட்டு வடிவில் தெரிவிக்கிறது; செய்பவர் எபிரெய வாக்கியத்தில் வெளிப்படையாகக் குறிப்பிடப்படாததையும் காக்கிறது.
- source_word: וַאֲשֶׁר יְמַלֵּא אֶת יָדוֹ
  choice: ஆசாரியப் பணியில் அமர்த்தப்பட்டவர்[a]
  rationale: ‘அவருடைய கையை நிரப்புதல்’ என்ற எபிரெய மரபுத்தொடர் ஆசாரியப் பணியில் முறைப்படி அமர்த்தப்படுவதைக் குறிக்கிறது. பொருள் முதன்மை உரையில் இயல்பாகவும், சொற்சார்ந்த வடிவம் அடிக்குறிப்பிலும் தரப்படுகிறது.
- source_word: לְכַהֵן
  choice: ஆசாரியராகப் பணியாற்றுவதற்காக
  rationale: ஆசாரிய அலுவலைச் செய்வதையும் சேவையாற்றுவதையும் தெளிவான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: תַּחַת אָבִיו
  choice: தன் தந்தைக்குப் பதிலாக
  rationale: தந்தையின் பதவியைத் தொடர்ந்து ஏற்கும் மாற்றீட்டையும் வாரிசுரிமைச் சூழலையும், மூலத்தின் תחת என்ற சொல்லுக்கு நெருக்கமாகத் தருகிறது.
- source_word: וְלָבַשׁ
  choice: அணிந்துகொள்ள வேண்டும்
  rationale: சடங்கிற்குரிய உடைகளைத் தாமே அணியும் செயலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: בִּגְדֵי הַבָּד
  choice: சணல் உடைகள்
  rationale: בד என்பது இச்சூழலில் சணலால் செய்யப்பட்ட ஆசாரிய உடைகளைக் குறிக்கிறது; ‘சணல் உடைகள்’ தெளிவாகவும் சுருக்கமாகவும் உள்ளது.
- source_word: בִּגְדֵי הַקֹּדֶשׁ
  choice: சணல் உடைகளாகிய பரிசுத்த உடைகள்
  rationale: இரண்டாவது சொற்றொடர் அதே சணல் உடைகளைப் பரிசுத்தப் பயன்பாட்டுக்கென பிரித்துவைக்கப்பட்ட உடைகளாக அடையாளப்படுத்துகிறது; ‘ஆகிய’ என்ற இணைப்பு அந்த விளக்க உறவைப் பாதுகாக்கிறது.
theological_decisions:
- issue: הַכֹּהֵן என்பதை ‘ஆசாரியர்’ என்றா, ‘தலைமை ஆசாரியர்’ என்றா மொழிபெயர்ப்பது
  choice: ஆசாரியர்
  alternative: தலைமை ஆசாரியர்
  rationale: சூழல் தலைமை ஆசாரியரின் வாரிசைக் குறிப்பிட்டாலும், மூல உரை ‘ஆசாரியர்’ என்று கூறி, அபிஷேகம், பணி அமர்த்துதல், தந்தைக்குப் பதிலாகச் சேவித்தல் ஆகியவற்றால் அவரை வரையறுக்கிறது. எனவே மூலத்தில் இல்லாத பட்டம் சேர்க்கப்படவில்லை.
- issue: ‘கையை நிரப்புதல்’ என்ற பணி நியமன மரபுத்தொடரை எவ்வாறு தருவது
  choice: ஆசாரியப் பணியில் அமர்த்தப்பட்டவர்
  alternative: அவருடைய கை நிரப்பப்பட்டவர்
  rationale: சொல்லுக்குச் சொல் மொழிபெயர்ப்பு நவீன தமிழ் வாசகருக்குத் தெளிவற்றதாக இருக்கும். முதன்மை உரை மரபுத்தொடரின் பணிநியமனப் பொருளைத் தருகிறது; அடிக்குறிப்பு அதன் எபிரெய உருவகத்தைப் பாதுகாக்கிறது.
- issue: כפר என்பதன் சடங்கு சார்ந்த பொருள்
  choice: பாவநிவிர்த்தி செய்ய வேண்டும்
  alternative: பாவநிவிர்த்திச் சடங்கை நிறைவேற்ற வேண்டும்
  rationale: ‘பாவநிவிர்த்தி’ என்பது சடங்கின் இறையியல் வலிமையைப் பாதுகாக்கிறது; ‘சடங்கு’ என்று உரையிலேயே சேர்த்து, மூல வினைச்சொல்லைத் தேவையின்றி விரிவுபடுத்துவது தவிர்க்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் திருவிவிலிய உரைக்கேற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘அபிஷேகம்’, ‘ஆசாரியர்’, ‘பாவநிவிர்த்தி’, ‘பரிசுத்த’ போன்ற பரவலாக அறியப்பட்ட சொற்கள் துல்லியத்திற்காகத் தக்கவைக்கப்பட்டுள்ளன; தேவையற்ற சமயப்பிரிவு சார்ந்த விளக்கங்கள் சேர்க்கப்படவில்லை.
