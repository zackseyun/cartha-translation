    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “தனக்காகவும் தன் வீட்டுக்காகவும்”; இங்கே “வீடு” என்பது அவருடைய வீட்டாரைக் குறிக்கிறது.
    reason: lexical_alternative
