revisions:
- from: ஆரோன் தனக்கான பாவப்பலிக் காளையை முன்நிறுத்தி[a], தனக்காகவும் தன் வீட்டாருக்காகவும்[b] பாவநிவிர்த்தி செய்ய வேண்டும்; பின்னர் தனக்கான பாவப்பலிக் காளையை அறுக்க வேண்டும்.
  to: ஆரோன் தனக்கான பாவநிவாரணப் பலிக்கான காளையை முன்நிறுத்த வேண்டும்; தனக்காகவும் தன் வீட்டாருக்காகவும் பாவநிவிர்த்தி செய்ய வேண்டும்; பின்னர் தனக்கான பாவநிவாரணப் பலிக்கான காளையை அறுக்க வேண்டும்.
  rationale: The revision makes the three Hebrew ritual actions explicitly coordinate and sequential in Tamil, clarifies the established sacrificial designation of the bull, and retains the source repetition and both footnote anchors. It does not add doctrinal explanation to the atonement language.
