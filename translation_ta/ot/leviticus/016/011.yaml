  text: וְ/הִקְרִ֨יב אַהֲרֹ֜ן אֶת פַּ֤ר הַֽ/חַטָּאת֙ אֲשֶׁר ל֔/וֹ וְ/כִפֶּ֥ר בַּֽעֲד֖/וֹ וּ/בְעַ֣ד בֵּית֑/וֹ וְ/שָׁחַ֛ט אֶת פַּ֥ר הַֽ/חַטָּ֖את אֲשֶׁר לֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/011.yaml
  text: Aaron shall present the bull of the sin offering that is for himself[a], and he shall make atonement for himself and for his household[b]; then he shall slaughter the bull of the sin offering that is for himself.
translation:
  language: ta
  text: ஆரோன் தனக்கான பாவநிவாரணப் பலிக்கான காளையை முன்நிறுத்த வேண்டும்; தனக்காகவும் தன் வீட்டாருக்காகவும் பாவநிவிர்த்தி செய்ய வேண்டும்; பின்னர் தனக்கான பாவநிவாரணப் பலிக்கான காளையை அறுக்க வேண்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: முன்நிறுத்தி
  rationale: קרב என்பதன் ஹிஃபில் வடிவம் பலிச் சடங்குச் சூழலில் விலங்கை அருகே கொண்டுவந்து முறையாக முன்நிறுத்துவதைக் குறிக்கிறது. தொடர்ந்து அறுக்கும் செயல் வருவதால், இங்கேயே முழுப் பலியிடுதலைக் குறிப்பதாக மொழிபெயர்க்காமல் இருக்கிறது.
- source_word: פַּר הַחַטָּאת
  choice: பாவப்பலிக் காளை
  rationale: காளைக்கும் חטאת பலிக்கும் உள்ள தொடர்பை இயல்பான நவீனத் தமிழில் சுருக்கமாகக் கூறுகிறது; இதை ‘பாவப்பலிக்கான காளை’ என்றும் புரிந்துகொள்ளலாம்.
- source_word: אֲשֶׁר לוֹ
  choice: தனக்கான
  rationale: இச்சூழலில் காளை ஆரோனுடைய உடைமை என்பதை மட்டும் அல்லாமல், அவருக்காக நியமிக்கப்பட்டது என்பதைக் குறிக்கிறது.
- source_word: וְכִפֶּר
  choice: பாவநிவிர்த்தி செய்ய வேண்டும்
  rationale: ஆசாரியப் பலிச் சடங்குகளில் כפר குறிக்கும் நிவிர்த்திசெய்யும் செயலைத் தமிழில் நிலைபெற்ற, ஆனால் அதன் செயல்முறையைத் தேவையின்றி விளக்காத சொல்லால் தருகிறது.
- source_word: בַּעֲדוֹ וּבְעַד בֵּיתוֹ
  choice: தனக்காகவும் தன் வீட்டாருக்காகவும்
  rationale: בעד என்பதன் ‘சார்பாக/நன்மைக்காக’ என்ற பொருளையும், ביתו என்பதன் குடும்பம் அல்லது வீட்டைச் சேர்ந்தவர்கள் என்ற பொருளையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְשָׁחַט
  choice: பின்னர் ... அறுக்க வேண்டும்
  rationale: שׁחט என்பது பலிக்குரிய விலங்கை முறையாக அறுப்பதற்கான வழக்குச் சொல். ‘பின்னர்’ என்பது எபிரெய இணைப்பில் உள்ள செயல்களின் வரிசையைத் தமிழில் தெளிவாக்குகிறது.
- source_word: פַּר הַחַטָּאת אֲשֶׁר לוֹ
  choice: தனக்கான பாவப்பலிக் காளை
  rationale: எபிரெய மூலத்தில் இருமுறை வரும் சொற்றொடரைத் தமிழிலும் ஒரே விதமாக மீண்டும் கூறி, சடங்கின் வலியுறுத்தலைப் பாதுகாக்கிறது.
theological_decisions:
- issue: பலிச் சடங்கில் כפר என்ற சொல்லின் மொழிபெயர்ப்பு
  choice: பாவநிவிர்த்தி செய்ய
  alternative: தூய்மைப்படுத்த / பரிகாரம் செய்ய
  rationale: வசனம் கூறும் சடங்குச் செயலையும் அதன் பயன் பெறுவோரையும் மட்டும் தெரிவிக்கிறது. பாவநிவிர்த்தி எவ்வாறு நிகழ்கிறது என்ற குறிப்பிட்ட பிற்காலக் கோட்பாட்டை இதில் புகுத்தாமல், ஆசாரியச் சூழலின் பரந்த பொருளைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான சடங்கு மொழிநடை பயன்படுத்தப்பட்டுள்ளது. ‘முன்நிறுத்தி’ என்பது அறுப்பதற்கு முந்திய முறையான சமர்ப்பிப்பை வேறுபடுத்துகிறது; எபிரெய மூலத்தின் மீளுரையும் செயல்வரிசையும் பாதுகாக்கப்பட்டுள்ளன.
