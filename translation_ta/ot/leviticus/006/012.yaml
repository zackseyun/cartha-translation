  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/012.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ta
  text: 'யாவே[a] மோசேயிடம் கூறினார்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயம்: “YHWH.” மரபாக “ஆண்டவர்” என்று மொழிபெயர்க்கப்படுகிறது; “யெகோவா” என்பதும் மாற்று ஒலிபெயர்ப்பு.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பேசி
  rationale: וַיְדַבֵּר என்பது தொடர்ந்து வரும் நேரடி உரையை அறிமுகப்படுத்தும் வழக்கமான எபிரெயக் கதைநடைச் சொற்றொடர். தமிழில் ‘பேசி’ என்பது לֵאמֹר உடன் சேர்ந்த முழு அறிமுகச் சூத்திரத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: இது பட்டமான ‘ஆண்டவர்’ என்பதற்குப் பதிலாக எபிரெய மெய்யெழுத்துப் பெயரான YHWH-ஐக் குறிக்கும் தமிழில் பரவலாக அறியப்பட்ட ஒலிபெயர்ப்பு.
- source_word: אֶל־מֹשֶׁה
  choice: மோசேயிடம்
  rationale: பேச்சின் பெறுநரைக் குறிக்கும் אֶל என்பதற்கு நவீனத் தமிழில் ‘மோசேயிடம்’ இயல்பான இணை.
- source_word: לֵאמֹר
  choice: பேசி,
  rationale: ‘சொல்லும்படியாக’ என்று சொற்சொல்லாக மொழிபெயர்ப்பது தமிழில் தேவையற்ற மீளுரைப்பாகும்; அடுத்து வரும் நேரடி உரையை அறிமுகப்படுத்தும் வகையில் ‘பேசி,’ என்ற நிறுத்தம் அதன் பணியை இயல்பாகத் தக்கவைக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே; ஆண்டவர்
  rationale: மூலத்தில் தனிப்பட்ட இறைப்பெயர் நேரடியாக உள்ளது. பட்டமான ‘ஆண்டவர்’ என்று மாற்றாமல் பெயராகவே காட்டப்படுகிறது; அதன் பழைய உச்சரிப்பு உறுதியாகத் தெரியாததால் மாற்று ஒலிபெயர்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன, மரியாதையான, எளிதில் புரியும் தமிழ். எபிரெய உரையின் சுருக்கமான தெய்வீகப் பேச்சு அறிமுகம் தமிழில் இயல்பாகத் தரப்பட்டுள்ளது; அடுத்த வசனத்தில் உரை தொடர்வதை இறுதிக் காற்புள்ளி உணர்த்துகிறது.
