base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/003.yaml
  text: And the priest shall put on his linen garment, and he shall put linen undergarments on his body, and he shall remove the ashes to which the fire has reduced the burnt offering on the altar, and he shall place them beside the altar.
translation:
  language: ta
  text: ஆசாரியன் தன் ஆளிநார் ஆடையை அணிய வேண்டும்; ஆளிநார் உள்ளாடைகளையும் தன் உடல்மேல் அணிய வேண்டும். பலிபீடத்தின்மேல் நெருப்பு தகனபலியை எரித்ததால் உண்டான சாம்பலை எடுத்து, பலிபீடத்தின் அருகே வைக்க வேண்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִדּוֹ בַד
  choice: தன் நாரிழை ஆடை
  rationale: மִדּוֹ என்பது இங்கு ஆசாரியருக்குரிய ஆடையைக் குறிக்கிறது; בַד அதன் நாரிழைப் பொருளைக் குறிப்பிடுகிறது. ஆடையின் துல்லியமான வடிவத்தை ஊகிக்காமல் பொதுவாக மொழிபெயர்க்கப்பட்டது.
- source_word: מִכְנְסֵי בַד
  choice: நாரிழை உள்ளாடைகள்
  rationale: உடலோடு அணியும் ஆசாரியரின் கீழாடையை நவீன தமிழில் அதன் செயல்பாட்டின்படி இயல்பாகக் குறிக்கிறது.
- source_word: עַל בְּשָׂרוֹ
  choice: தன் உடலின்மேல்
  rationale: எபிரெயில் சொற்பொருளாக ‘தன் சதையின்மேல்’; நேரடியாக உடலில் அணிவதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וְהֵרִים
  choice: எடுத்து
  rationale: வினைச்சொல்லின் அடிப்படைப் பொருள் ‘தூக்குதல்’; இச்சடங்குச் சூழலில் பலிபீடத்திலிருந்து சாம்பலை எடுத்தலைக் குறிக்கிறது.
- source_word: הַדֶּשֶׁן
  choice: சாம்பல்
  rationale: பலிபீடத்தில் எரிக்கப்பட்ட பலியிலிருந்து மீந்த சாம்பல் எச்சத்தைக் குறிக்கிறது.
- source_word: אֲשֶׁר תֹּאכַל הָאֵשׁ אֶת הָעֹלָה
  choice: நெருப்பு தகனபலியை எரித்ததால் உண்டான
  rationale: எபிரெய் தொடர் செறிவானதும் இலக்கண ரீதியாகச் சற்றுக் கடினமானதும் ஆகும். நெருப்பு பலியை எரிப்பதற்கும் சாம்பல் உருவாவதற்கும் உள்ள உறவைத் தெளிவாகவும் இயல்பாகவும் தருகிறது; மாற்று நேரடி வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: הָעֹלָה
  choice: தகனபலி
  rationale: முழுவதும் எரிக்கப்படும் עֹלָה பலிக்கான தமிழில் நிலைபெற்ற, தெளிவான வழிபாட்டு சொல்.
- source_word: אֵצֶל הַמִּזְבֵּחַ
  choice: பலிபீடத்தின் அருகே
  rationale: பலிபீடத்தின் பக்கத்திலுள்ள அண்மையான இடத்தைக் குறிக்கும் இயல்பான தமிழ்.
