revisions:
- from: ஆசாரியன் தன் நாரிழை ஆடையை அணிந்துகொண்டு, நாரிழை உள்ளாடைகளையும் தன் உடலின்மேல்[a] அணிய வேண்டும். பின்பு, பலிபீடத்தின்மேல் நெருப்பு தகனபலியை எரித்ததால் உண்டான சாம்பலை[b] எடுத்து, பலிபீடத்தின் அருகே வைக்க வேண்டும்.
  to: ஆசாரியன் தன் ஆளிநார் ஆடையை அணிய வேண்டும்; ஆளிநார் உள்ளாடைகளையும் தன் உடல்மேல் அணிய வேண்டும். பலிபீடத்தின்மேல் நெருப்பு தகனபலியை எரித்ததால் உண்டான சாம்பலை எடுத்து, பலிபீடத்தின் அருகே வைக்க வேண்டும்.
  rationale: The revision explicitly renders the linen material specified by בַד as “ஆளிநார்,” while retaining the source’s non-specific reference to the outer garment and lower-body garment. The ash clause remains a natural Tamil rendering of the compact Hebrew relation between the fire, burnt offering, and ashes. Footnotes are retained with their anchors and revised only for clarity.
