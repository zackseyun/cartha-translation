translation:
  language: ta
  text: பலிபீடத்தின்மேல் நெருப்பு இடைவிடாமல் எரியவைக்கப்பட வேண்டும்[a]; அது அணையக் கூடாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பலிபீடத்தின்மேல் நெருப்பு எப்போதும் எரிந்துகொண்டிருக்க வேண்டும்; அது அணைக்கப்படக் கூடாது.”
    reason: தொடர்ச்சியையும் செயப்பாட்டு நுணுக்கத்தையும் வேறுவிதமாக வெளிப்படுத்தும் மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: אֵשׁ
  choice: நெருப்பு
  rationale: சொல்லின் நேரடியான பொருள் ‘நெருப்பு’; பலிபீடச் சூழலிலும் இதுவே இயல்பான தமிழ்ச் சொல்.
- source_word: תָּמִיד
  choice: இடைவிடாமல்
  rationale: தொடர்ந்து நீடிக்கும் தன்மையை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: תּוּקַד
  choice: எரியவைக்கப்பட வேண்டும்
  rationale: Hophal வடிவத்தின் காரணப்பாட்டு-செயப்பாட்டு நுணுக்கத்தையும், நெருப்பைத் தொடர்ந்து பராமரிக்க வேண்டிய கட்டளையையும் காக்கிறது.
- source_word: עַל הַמִּזְבֵּחַ
  choice: பலிபீடத்தின்மேல்
  rationale: இடத்தைக் குறிக்கும் முன்னிடைச்சொல்லையும் குறிப்பிட்ட பலிபீடத்தையும் தெளிவாகப் பிரதிபலிக்கிறது.
- source_word: לֹא תִכְבֶה
  choice: அது அணைந்துபோகக் கூடாது
  rationale: எதிர்மறைக் கட்டளையையும் வினையின் இயல்பான ‘அணைந்துபோதல்’ என்ற பொருளையும் தெளிவாகக் காக்கிறது.
