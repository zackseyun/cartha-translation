base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/002.yaml
  text: 'Command Aaron and his sons[a], saying, This is the law of the burnt offering: the burnt offering itself shall remain on its hearth on the altar all night until the morning[b], and the fire of the altar shall be kept burning on it.'
translation:
  language: ta
  text: 'ஆரோனுக்கும் அவன் மகன்களுக்கும் கட்டளையிட்டு இவ்வாறு சொல்: “தகனபலிக்கான விதிமுறை[a] இதுதான்: தகனபலி இரவு முழுவதும் காலைவரை பலிபீடத்தின்மேல் உள்ள எரிப்பிடத்தில்[b] இருக்க வேண்டும். பலிபீடத்தின் நெருப்பு பலிபீடத்தின்மேல் தொடர்ந்து எரியும்படி பராமரிக்கப்பட வேண்டும்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தகனபலிக்கான அறிவுறுத்தல்.”
    reason: תּוֹרָה என்பது இச்சூழலில் ‘விதிமுறை,’ ‘சட்டம்,’ அல்லது ‘அறிவுறுத்தல்’ என மொழிபெயர்க்கப்படலாம்.
  - marker: b
    text: அல்லது, “பலிபீடத்தின்மேல் உள்ள எரியும் இடத்தில்.” எபிரெயச் சொல் பலி எரிக்கப்படும் இடத்தை அல்லது நெருப்புத் தளத்தைக் குறிக்கிறது.
    reason: מוֹקְדָה என்ற அரிய பலிசார் சொல்லின் பொருளையும் மொழிபெயர்ப்பு மாற்றையும் விளக்குகிறது.
lexical_decisions:
- source_word: צַו
  choice: கட்டளையிட்டுச் சொல்
  rationale: צוה என்பதன் கட்டளை வலிமையை ‘கட்டளையிடு’ காக்கிறது; לֵאמֹר உடன் இயல்பான தமிழில் ‘கட்டளையிட்டுச் சொல்’ என வழங்கப்பட்டுள்ளது.
- source_word: אַהֲרֹן וְאֶת־בָּנָיו
  choice: ஆரோனுக்கும் அவன் மகன்களுக்கும்
  rationale: ஆசாரியப் பணிக்குரிய ஆரோனின் ஆண் சந்ததியினரைச் சூழல் குறிப்பதால் ‘மகன்கள்’ துல்லியமானது.
- source_word: זֹאת תּוֹרַת
  choice: விதிமுறை இதுதான்
  rationale: பலியை நிர்வகிக்கும் முறையான கட்டுப்பாட்டை இச்சூழலில் ‘விதிமுறை’ தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது; תורה என்ற சொல்லின் ‘போதனை/அறிவுறுத்தல்’ நிழற்பொருளும் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: הָעֹלָה
  choice: தகனபலி
  rationale: முழுவதுமாக எரிக்கப்படும் இப்பலிவகைக்கான நிலைபெற்ற, சுருக்கமான தமிழ் பெயர்.
- source_word: הִוא הָעֹלָה
  choice: தகனபலி
  rationale: எபிரெயில் பெயர்ச்சொல் மீண்டும் வருவதையும் தலைப்புக்குப் பின் பலியைப் பொருளாக முன்னிறுத்துவதையும் தமிழில் மறுபடியும் ‘தகனபலி’ என்று கூறுவது இயல்பாகப் பாதுகாக்கிறது.
- source_word: עַל מוֹקְדָה עַל הַמִּזְבֵּחַ
  choice: பலிபீடத்தின்மேல் உள்ள எரிப்பிடத்தில்
  rationale: מוֹקְדָה என்பது பலி எரியும் இடத்தை அல்லது நெருப்புத் தளத்தைக் குறிக்கிறது. ‘எரிப்பிடம்’ காட்சிப்பூர்வமான பொருளை எளிய தமிழில் காக்கிறது.
- source_word: כָּל הַלַּיְלָה עַד הַבֹּקֶר
  choice: இரவு முழுவதும் காலைவரை
  rationale: காலத் தொடரை எபிரெய் வரிசைக்கு நெருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: וְאֵשׁ הַמִּזְבֵּחַ תּוּקַד בּוֹ
  choice: பலிபீடத்தின் நெருப்பு அதன்மேல் தொடர்ந்து எரியும்படி பராமரிக்கப்பட வேண்டும்
  rationale: תּוּקַד என்பதன் ஹொஃபால் வடிவம் நெருப்பு வெறுமனே எரிகிறது என்பதைக் காட்டாமல், அது எரிந்துகொண்டிருக்கச் செய்யப்பட வேண்டும் என்ற கடமையைக் காட்டுகிறது. בוֹ என்பதை அருகிலுள்ள ஆண்பால் பெயரான பலிபீடத்தைக் குறிப்பதாக எடுத்துள்ளது.
theological_decisions:
- issue: பலிச் சட்டத்தில் תּוֹרָה என்பதன் மொழிபெயர்ப்பு
  choice: விதிமுறை
  alternative: சட்டம்; அறிவுறுத்தல்
  rationale: இங்கு முழு மோசேயின் தோராவுக்கான தலைப்பாக அல்லாமல், குறிப்பிட்ட பலிக்குரிய அதிகாரப்பூர்வ நடைமுறையாகச் சொல் வருகிறது. ‘விதிமுறை’ சட்டபூர்வத் தொனியையும் நடைமுறைப் பொருளையும் காக்கிறது.
- issue: பலிபீட நெருப்பைப் பற்றிய கட்டளையின் தன்மை
  choice: தொடர்ந்து எரியும்படி பராமரிக்கப்பட வேண்டும்
  alternative: எரிந்துகொண்டிருக்க வேண்டும்
  rationale: வினையின் வடிவம் வெறும் நிலை விளக்கத்தைவிட நெருப்பைப் பராமரிக்கும் கடமையைச் சுட்டுகிறது; அதனால் கட்டளையின் செயற்பாட்டு வலிமை வெளிப்படையாகக் காக்கப்பட்டுள்ளது.
- issue: בוֹ என்ற சுட்டுப்பெயரின் குறிப்பு
  choice: பலிபீடத்தின்மேல்
  alternative: எரிப்பிடத்தில்; பலியின்மேல்
  rationale: ஆண்பால் ஒருமை வடிவமான בוֹ, அருகிலுள்ள ஆண்பால் הַמִּזְבֵּחַ (‘பலிபீடம்’) என்பதோடு இலக்கண ரீதியாக இயல்பாக இணைகிறது. இருந்தாலும் எரிப்பிடம் சார்ந்த மொத்தச் சூழலை மொழிபெயர்ப்பு மறுப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டு விதிக்கேற்ற கண்ணியமான ஆனால் பொதுவாசகருக்குப் புரியும் நடையில் அமைக்கப்பட்டது. ‘தகனபலி,’ ‘பலிபீடம்’ ஆகிய நிலைபெற்ற வேதாகமச் சொற்கள் தொடர்ச்சிக்காகப் பயன்படுத்தப்பட்டன; வாக்கிய அமைப்பு தேவையற்ற பழமையாக்கமின்றி கட்டளையின் அதிகாரத் தொனியைப் பாதுகாக்கிறது.
