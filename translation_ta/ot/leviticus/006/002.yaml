  to: 'ஆரோனுக்கும் அவன் மகன்களுக்கும் கட்டளையிட்டு இவ்வாறு சொல்: “தகனபலிக்கான விதிமுறை[a] இதுதான்: தகனபலி இரவு முழுவதும் காலைவரை பலிபீடத்தின்மேல் உள்ள எரிப்பிடத்தில்[b] இருக்க வேண்டும். பலிபீடத்தின் நெருப்பு பலிபீடத்தின்மேல் தொடர்ந்து எரியும்படி பராமரிக்கப்பட வேண்டும்.”'
  rationale: Only safe clarifications were made. The final locative was made explicit as “on the altar” to reflect the most natural grammatical antecedent of Hebrew בּוֹ and to prevent a Tamil reading that locates the altar fire on the offering. The opening formula was lightly smoothed for modern Tamil. The lexical ambiguity of מוֹקְדָה remains documented by the anchored footnote.
