  text: עַֽל מַחֲבַ֗ת בַּ/שֶּׁ֛מֶן תֵּעָשֶׂ֖ה מֻרְבֶּ֣כֶת תְּבִיאֶ֑/נָּה תֻּפִינֵי֙ מִנְחַ֣ת פִּתִּ֔ים תַּקְרִ֥יב רֵֽיחַ נִיחֹ֖חַ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/014.yaml
  text: On a griddle with oil it shall be made[a], well mixed; you shall bring it in baked pieces, a grain offering broken into pieces[c][b], and present it as a pleasing aroma to Yahweh.
translation:
  language: ta
  text: அது எண்ணெயுடன் தட்டையான வாணலியில் செய்யப்பட வேண்டும்; நன்றாகக் கலந்ததாக அதைக் கொண்டு வர வேண்டும். சுட்டுத் தயாரிக்கப்பட்ட[a] தானியக் காணிக்கையைத் துண்டுகளாக யாவேக்கு இனிய நறுமணமாகச் செலுத்த வேண்டும்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சுட்டுத் தயாரிக்கப்பட்ட” என மொழிபெயர்க்கப்பட்டுள்ள எபிரெயச் சொல் அரிதானது; தட்டையான வாணலியில் சுட்டுத் தயாரிக்கப்பட்ட பகுதிகளைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “இனிய நறுமணம்” என்பது காணிக்கை யாவேக்கு ஏற்புடையதாக இருப்பதைக் குறிக்கும் வழக்கமான பலியாராதனைச் சொற்றொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: מַחֲבַת
  choice: தட்டையான வாணலி
  rationale: தானியக் காணிக்கையைச் சுடப் பயன்படுத்தப்பட்ட தட்டையான சமையல் பாத்திரத்தைக் குறிக்கிறது; நவீன தமிழில் பொருள் தெளிவாக இருக்க இச்சொற்றொடர் தேர்ந்தெடுக்கப்பட்டது.
- source_word: בַּשֶּׁמֶן
  choice: எண்ணெயுடன்
  rationale: בְּ இங்கு ‘எண்ணெயில்’ அல்லது ‘எண்ணெயுடன்’ எனப் பொருள்படலாம்; தயாரிக்கும் முறையை இயல்பாகக் கூற ‘எண்ணெயுடன்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: תֵּעָשֶׂה
  choice: செய்ய வேண்டும்
  rationale: நிபால் வினையின் செயப்பாட்டு அறிவுறுத்தலை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: מֻרְבֶּכֶת
  choice: நன்றாகக் கலக்க வேண்டும்
  rationale: எண்ணெயோடு கலக்கப்பட்ட அல்லது பிசையப்பட்ட தயாரிப்பைக் குறிக்கிறது; அரிய தொழில்நுட்ப முறையை அளவுக்கு மீறி வரையறுக்காமல் பொருளைக் காட்டுகிறது.
- source_word: תְּבִיאֶנָּה
  choice: அதைக் கொண்டுவர வேண்டும்
  rationale: பெண்பால் பின்னொட்டு காணிக்கையைச் சுட்டுகிறது; בוא வினையின் அடிப்படை ‘கொண்டுவருதல்’ பொருள் பாதுகாக்கப்படுகிறது.
- source_word: תֻּפִינֵי
  choice: சுடப்பட்ட துண்டுகள்
  rationale: இது அரிதான சமையல் சொல்; சுடப்பட்ட பகுதிகள் அல்லது துண்டுகள் என்ற சாத்தியமான பொருளை உரையில் தருகிறது, மேலும் அதன் நிச்சயமின்மையை அடிக்குறிப்பு குறிப்பிடுகிறது.
- source_word: מִנְחַת
  choice: தானியக் காணிக்கை
  rationale: லேவியராகமத்தில் மாவு அல்லது தானியத்தால் செய்யப்படும் காணிக்கைக்கான வழக்கமான, குறிப்பான பெயர்.
- source_word: פִּתִּים
  choice: துண்டுகளாக்கப்பட்ட
  rationale: பிரிக்கப்பட்ட அல்லது உடைக்கப்பட்ட பகுதிகள் என்ற பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: תַּקְרִיב
  choice: செலுத்த வேண்டும்
  rationale: பலியாராதனைச் சூழலில் ‘அருகே கொண்டுவருதல்/காணிக்கையாக அளித்தல்’ என்ற பொருளை மரியாதையான தமிழில் தருகிறது.
- source_word: רֵיחַ נִיחֹחַ
  choice: இனிய நறுமணம்
  rationale: பலியாகச் செலுத்தப்பட்டது தேவனுக்கு ஏற்புடையது என்பதைக் குறிக்கும் நிலையான பலியாராதனைச் சொற்றொடரை இயல்பாகப் பாதுகாக்கிறது.
- source_word: לַיהוָה
  choice: யெகோவாவுக்கு
  rationale: יהוה என்ற உடன்படிக்கைப் பெயரை பொதுவான பட்டப்பெயராக மாற்றாமல் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பால் வழங்குகிறது.
theological_decisions:
- issue: יהוה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே / கர்த்தர்
  rationale: எபிரெய உரையிலுள்ள தனிப்பட்ட உடன்படிக்கைப் பெயரைப் பட்டப்பெயராக மாற்றாமல் பாதுகாக்கிறது; ‘யெகோவா’ நவீன தமிழ் வேதாகமப் பயன்பாட்டில் அறியப்பட்ட வடிவம்.
- issue: רֵיחַ נִיחֹחַ என்ற பலியாராதனைச் சொற்றொடரின் பொருள்
  choice: இனிய நறுமணம்
  alternative: ஏற்புடைய நறுமணம் / இதமளிக்கும் நறுமணம்
  rationale: மூல உருவகத்தைப் பாதுகாக்கிறது; அதேவேளை இது காணிக்கை தேவனுக்கு ஏற்புடையதாக இருப்பதைக் குறிக்கும் வழக்குச் சொற்றொடர் என்பதை அடிக்குறிப்பு விளக்குகிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் வகையில் தெளிவும், பலியாராதனைச் சூழலுக்கேற்ற கண்ணியமும் பேணப்பட்டுள்ளன. அரிய תֻּפִינֵי சொல்லின் நிச்சயமின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
