revisions:
- from: அதை எண்ணெயுடன் தட்டையான வாணலியில் செய்து, நன்றாகக் கலக்க வேண்டும்; சுடப்பட்ட துண்டுகளாக அதைக் கொண்டுவர வேண்டும்.[a] துண்டுகளாக்கப்பட்ட தானியக் காணிக்கையாக அதை யெகோவாவுக்கு இனிய நறுமணமாகச் செலுத்த வேண்டும்.[b]
  to: அது எண்ணெயுடன் தட்டையான வாணலியில் செய்யப்பட வேண்டும்; நன்றாகக் கலந்ததாக அதைக் கொண்டு வர வேண்டும். சுட்டுத் தயாரிக்கப்பட்ட[a] தானியக் காணிக்கையைத் துண்டுகளாக யாவேக்கு இனிய நறுமணமாகச் செலுத்த வேண்டும்.[b]
  rationale: திருத்தம் எபிரெய செயப்பாட்டு அமைப்பையும், எண்ணெயோடு கலந்த தயார்நிலையையும் காக்கிறது. அரிதான תֻּפִינֵי சொல்லை ‘சுட்டுத் தயாரிக்கப்பட்ட’ என எச்சரிக்கையுடன் வழங்கி, அதன் மாற்றுச் சாத்தியத்தை அடிக்குறிப்பில் பாதுகாக்கிறது. פִּתִּים-இன் ‘துண்டுகளாக’ என்ற பொருள் உரையிலேயே தொடர்கிறது; எந்தக் குறிப்பிட்ட சமையல் முறையையும் அளவுக்கு மீறி வரையறுக்கவில்லை.
