translation_notes:
  register: நவீனத் தரத் தமிழில், சட்ட அறிவுறுத்தலுக்குரிய கண்ணியமான நேரடி நடை பயன்படுத்தப்பட்டுள்ளது. ‘வேண்டும்’ கட்டாயத்தை வெளிப்படுத்துகிறது; தொழில்நுட்பமாகத் தோன்றக்கூடிய ‘உரஞ்சுதல்’ என்பதற்குப் பதிலாகப் பொதுவாகப் புரியும் ‘நன்றாகத் தேய்க்கப்பட்டு’ பயன்படுத்தப்பட்டுள்ளது.
