  text: וּ/כְלִי חֶ֛רֶשׂ אֲשֶׁ֥ר תְּבֻשַּׁל בּ֖/וֹ יִשָּׁבֵ֑ר וְ/אִם בִּ/כְלִ֤י נְחֹ֨שֶׁת֙ בֻּשָּׁ֔לָה וּ/מֹרַ֥ק וְ/שֻׁטַּ֖ף בַּ/מָּֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/021.yaml
  text: And an earthenware vessel in which it is boiled must be broken; but if it is boiled in a bronze vessel[a], it must be scoured and rinsed with water.
translation:
  language: ta
  text: அது வேகவைக்கப்படும் மண்பாண்டம் உடைக்கப்பட வேண்டும். ஆனால் அது வெண்கலப் பாத்திரத்தில்[a] வேகவைக்கப்பட்டால், அந்தப் பாத்திரம் நன்றாகத் தேய்க்கப்பட்டு, தண்ணீரால் அலசப்பட வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘செம்புப் பாத்திரத்தில்.’ எபிரெயச் சொல் נְחֹשֶׁת சூழலைப் பொறுத்துச் செம்பையோ வெண்கலத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְלִי חֶרֶשׂ
  choice: மண்பாண்டம்
  rationale: כְלִי என்பது பாத்திரத்தையும் חֶרֶשׂ என்பது சுட்ட களிமண் பொருளையும் குறிக்கிறது. ‘மண்பாண்டம்’ என்பது பொருள் வேறுபாட்டைத் தெளிவாகவும் இயல்பான தமிழிலும் காட்டுகிறது.
- source_word: תְּבֻשַּׁל / בֻּשָּׁלָה
  choice: வேகவைக்கப்பட்ட
  rationale: בשׁל இச்சூழலில் உணவை நீரில் வேகவைத்தல் அல்லது கொதிக்கவைத்துச் சமைத்தலைக் குறிக்கிறது. தமிழில் பாத்திரத்துக்குள் நிகழும் செயலை இயல்பாகத் தெரிவிக்க ‘வேகவைக்கப்பட்ட’ தேர்ந்தெடுக்கப்பட்டது; மூலத்தின் செயப்பாட்டு வடிவமும் காக்கப்படுகிறது.
- source_word: בּוֹ
  choice: அது வேகவைக்கப்பட்ட
  rationale: ‘அதில்’ என்ற இடத்தொடர்பை, தமிழில் முன்னுள்ள மண்பாண்டத்தைத் தெளிவாகச் சுட்டும் தொடர்பமைப்பாக வெளிப்படுத்துகிறது.
- source_word: יִשָּׁבֵר
  choice: உடைக்கப்பட வேண்டும்
  rationale: சட்ட அறிவுறுத்தலில் உள்ள கட்டாயத்தை நவீன தமிழில் தெளிவாகக் காட்டுகிறது; செயப்பாட்டு வடிவமும் பாதுகாக்கப்படுகிறது.
- source_word: כְלִי נְחֹשֶׁת
  choice: வெண்கலப் பாத்திரம்
  rationale: נְחֹשֶׁת செம்பையோ வெண்கலத்தையோ குறிக்கலாம். பண்டைய உலோகப் பாத்திரச் சூழலில் ‘வெண்கலம்’ பொருத்தமான முதன்மைத் தேர்வு; ‘செம்பு’ அடிக்குறிப்பில் மாற்றாகத் தரப்படுகிறது.
- source_word: וּמֹרַק
  choice: நன்றாகத் தேய்க்கப்பட்டு
  rationale: מרק என்பது உரசித் தீவிரமாகச் சுத்தப்படுத்துவதை உணர்த்துகிறது. ‘நன்றாகத் தேய்க்கப்பட்டு’ என்பது சாதாரண வாசகருக்கு இயல்பாகவும் செயலின் வலிமையைத் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: וְשֻׁטַּף בַּמָּיִם
  choice: தண்ணீரால் அலசப்பட வேண்டும்
  rationale: שטף நீரைப் பயன்படுத்திக் கழுவுதல் அல்லது அலசுதலைக் குறிக்கிறது. முன் வரும் தேய்த்தலுக்குப் பிந்தைய தனி சுத்திகரிப்புச் செயலை ‘அலசப்பட வேண்டும்’ தெளிவாகக் காட்டுகிறது.
