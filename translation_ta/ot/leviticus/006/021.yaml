review_pass:
  verdict: revise
  source_fidelity: The draft accurately distinguishes the earthenware vessel from the bronze/copper vessel and correctly renders the required breaking, scouring, and rinsing. However, the opening Tamil wording, “அது வேகவைக்கப்பட்ட மண்பாண்டம்,” can grammatically suggest that the earthenware vessel itself was cooked, rather than that the unspecified antecedent was boiled in it. Changing this to a relative construction preserves the Hebrew locative sense of בּוֹ clearly.
  naturalness: The revised relative construction is natural, clear modern standard Tamil for a legal instruction. The remaining phrasing is appropriately direct and retains the passive, obligatory force.
  terminology: “மண்பாண்டம்,” “வெண்கலப் பாத்திரம்,” “நன்றாகத் தேய்க்கப்பட்டு,” and “தண்ணீரால் அலசப்பட வேண்டும்” are suitable. The footnote properly preserves the lexical ambiguity of נְחֹשֶׁת as copper or bronze.
  issues:
  - severity: medium
    issue: The initial phrase can imply that the earthenware vessel was boiled.
    rationale: The Hebrew means “an earthenware vessel in which it is boiled.” Tamil “அது வேகவைக்கப்பட்ட மண்பாண்டம்” most readily modifies மண்பாண்டம் with “cooked/boiled.” A relative clause explicitly marks the vessel as the location of boiling.
  revised_text: அது வேகவைக்கப்படும் மண்பாண்டம் உடைக்கப்பட வேண்டும். ஆனால் அது வெண்கலப் பாத்திரத்தில்[a] வேகவைக்கப்பட்டால், அந்தப் பாத்திரம் நன்றாகத் தேய்க்கப்பட்டு, தண்ணீரால் அலசப்பட வேண்டும்.
