revisions:
- from: 'அவன் தானியக் காணிக்கையின் மெல்லிய மாவிலிருந்து ஒரு கைப்பிடியளவும் அதன் எண்ணெயில் சிறிதும் எடுத்துக்கொண்டு[a], தானியக் காணிக்கையின்மேல் இருக்கும் குங்கிலியம் முழுவதையும் சேர்த்து, அதன் நினைவுப் பங்கை[b] யாவேக்கு இனிய நறுமணமாகப் பலிபீடத்தின்மேல் எரிக்க வேண்டும்.


    [a] “எடுத்துக்கொண்டு” என்பதற்கு “தன் கைப்பிடியால் அதிலிருந்து உயர்த்தி எடுத்து” என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல்லும் பெயர்ச்சொல்லும், காணிக்கையிலிருந்து குறிக்கப்பட்ட கைப்பிடியளவு எடுக்கப்படுவதை வலியுறுத்துகின்றன.


    [b] “நினைவுப் பங்கு” என்பது தானியக் காணிக்கை முழுவதையும் பிரதிநிதித்துவப்படுத்தும் வகையில் பலிபீடத்தில் எரிக்கப்படும் பகுதிக்கான சிறப்புப் பலியியல் சொல்.'
  to: அவன் தானியக் காணிக்கையின் நுண்ணிய மாவிலிருந்து ஒரு கைப்பிடியளவையும், அதன் எண்ணெயிலிருந்து சிறிதையும், தானியக் காணிக்கையின்மேல் இருக்கும் குங்கிலியம் முழுவதையும் எடுத்து[a], அதன் நினைவுப் பங்கை[b] யாவேக்கு இனிய நறுமணமாகப் பலிபீடத்தின்மேல் எரிக்க வேண்டும்.
  rationale: 'The correction retains the draft’s terminology and legal register while making the Hebrew coordination explicit: the priest takes a handful of flour, some oil, and all the frankincense. It removes a possible implication that the frankincense is merely mixed in rather than taken as the whole incense component of the memorial portion.'
