  text: וְ/הֵרִ֨ים מִמֶּ֜/נּוּ בְּ/קֻמְצ֗/וֹ מִ/סֹּ֤לֶת הַ/מִּנְחָה֙ וּ/מִ/שַּׁמְנָ֔/הּ וְ/אֵת֙ כָּל הַ/לְּבֹנָ֔ה אֲשֶׁ֖ר עַל הַ/מִּנְחָ֑ה וְ/הִקְטִ֣יר הַ/מִּזְבֵּ֗חַ רֵ֧יחַ נִיחֹ֛חַ אַזְכָּרָתָ֖/הּ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/008.yaml
  text: And he shall take up from it a handful of the fine flour of the grain offering and some of its oil[a], with all the frankincense that is on the grain offering[b], and he shall burn its memorial portion on the altar as a pleasing aroma to Yahweh.
translation:
  language: ta
  text: அவன் தானியக் காணிக்கையின் நுண்ணிய மாவிலிருந்து ஒரு கைப்பிடியளவையும், அதன் எண்ணெயிலிருந்து சிறிதையும், தானியக் காணிக்கையின்மேல் இருக்கும் குங்கிலியம் முழுவதையும் எடுத்து[a], அதன் நினைவுப் பங்கை[b] யாவேக்கு இனிய நறுமணமாகப் பலிபீடத்தின்மேல் எரிக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “எடுத்து” என்பதற்கு “தன் கைப்பிடியால் அதிலிருந்து உயர்த்தி எடுத்து” என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல்லும் பெயர்ச்சொல்லும், காணிக்கையிலிருந்து குறிக்கப்பட்ட கைப்பிடியளவு எடுக்கப்படுவதை வலியுறுத்துகின்றன.
    reason: lexical_alternative
  - marker: b
    text: “நினைவுப் பங்கு” என்பது தானியக் காணிக்கையைப் பிரதிநிதித்துவப்படுத்தும் வகையில் பலிபீடத்தில் எரிக்கப்படும் பகுதிக்கான சிறப்புப் பலியியல் சொல்.
    reason: cultural_note
lexical_decisions:
- source_word: וְהֵרִים ... בְּקֻמְצוֹ
  choice: ஒரு கைப்பிடியளவும் ... எடுத்துக்கொண்டு
  rationale: ரום என்பதன் ஹிஃபில் வடிவம் காணிக்கையிலிருந்து குறிக்கப்பட்ட பகுதியை உயர்த்தி எடுப்பதைக் குறிக்கிறது; קֹמֶץ அதன் கைப்பிடியளவைக் குறிப்பிடுகிறது. இயல்பான தமிழில் இரண்டின் பொருளும் இவ்வாறு தக்கவைக்கப்படுகிறது.
- source_word: מִסֹּלֶת הַמִּנְחָה
  choice: தானியக் காணிக்கையின் மெல்லிய மாவிலிருந்து
  rationale: סֹלֶת என்பது பலிக்குரிய நுண்ணிய அல்லது மெல்லிய மாவு; מִנְחָה இச்சூழலில் குறிப்பாகத் தானியக் காணிக்கை.
- source_word: וּמִשַּׁמְנָהּ
  choice: அதன் எண்ணெயில் சிறிதும்
  rationale: மִן பகுதியைக் குறிக்கிறது; எண்ணெய் முழுவதும் அல்ல, அதிலிருந்து ஒரு பகுதி எடுக்கப்படுவதைத் தெளிவுபடுத்துகிறது.
- source_word: כָּל הַלְּבֹנָה
  choice: குங்கிலியம் முழுவதையும்
  rationale: לְבֹנָה பொதுவான தூபமல்ல, frankincense எனப்படும் குறிப்பிட்ட நறுமணப் பிசின்; ‘குங்கிலியம்’ அதற்கான துல்லியமான தமிழ் வழக்கு.
- source_word: וְהִקְטִיר
  choice: எரிக்க வேண்டும்
  rationale: பலியியல் சூழலில் பலிபீடத்தின்மேல் புகையாக எழும்பும்படி எரிப்பதைச் சுட்டுகிறது; சட்ட அறிவுறுத்தலின் நடை ‘வேண்டும்’ என்பதால் இயல்பாக வெளிப்படுகிறது.
- source_word: אַזְכָּרָתָהּ
  choice: அதன் நினைவுப் பங்கு
  rationale: முழுத் தானியக் காணிக்கையையும் பிரதிநிதித்துவப்படுத்தி எரிக்கப்படும் சிறப்புப் பகுதியைக் குறிக்கும் தொழில்நுட்பப் பலியியல் சொல்; அதன் ‘நினைவு’ கூறை மொழிபெயர்ப்பு தக்கவைக்கிறது.
- source_word: רֵיחַ נִיחֹחַ
  choice: இனிய நறுமணமாக
  rationale: தேவனுக்கு ஏற்றுக்கொள்ளத்தக்க பலியைக் குறிக்கும் நிலையான பலியியல் தொடர்; உடல்சார்ந்த நுகர்ச்சி என்ற கருத்தை மிகைப்படுத்தாமல் இயல்பான தமிழில் தரப்படுகிறது.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: יהוה என்ற உடன்படிக்கைப் பெயரைப் பொதுப் பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்த்து வழங்குகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் நேரடியாக இடம்பெறும் நான்கெழுத்து இறைப்பெயரைப் பட்டப்பெயராக மாற்றாமல், அதன் தனிப்பெயர் இயல்பைப் பாதுகாக்கிறது.
- issue: רֵיחַ נִיחֹחַ என்ற பலியியல் தொடரின் பொருள்
  choice: யாவேக்கு இனிய நறுமணமாக
  alternative: யாவேக்கு ஆறுதலளிக்கும் மணமாக
  rationale: பலியின் ஏற்றுக்கொள்ளத்தக்க தன்மையை வெளிப்படுத்துகிறது; தேவனுடைய நுகர்ச்சியை இயந்திரத்தனமாகவோ உடல்சார்ந்ததாகவோ விளக்காமல் மூல உருவகத்தைப் பாதுகாக்கிறது.
- issue: אַזְכָּרָה என்ற தொழில்நுட்பச் சொல்லின் விளக்கம்
  choice: நினைவுப் பங்கு
  alternative: நினைவுக் காணிக்கை
  rationale: எரிக்கப்படுவது முழுக் காணிக்கை அல்ல, அதன் பிரதிநிதிப் பகுதி என்பதை ‘பங்கு’ தெளிவாக்குகிறது; எது அல்லது யார் நினைவுகூரப்படுகிறது என்ற மூலத்தின் திறந்த தன்மையைத் தீர்மானிக்காமல் விடுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், வாசிக்க எளிதானதாயும் பலியியல் சொற்களின் துல்லியத்தைப் பாதுகாப்பதாயும் அமைக்கப்பட்டது. ‘காணிக்கை,’ ‘பலிபீடம்’ போன்ற பரவலாக அறியப்பட்ட மரியாதைமிக்க வேதாகமச் சொற்கள் தக்கவைக்கப்பட்டுள்ளன; அரிதான தொழில்நுட்பக் கருத்தான ‘நினைவுப் பங்கு’ அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
