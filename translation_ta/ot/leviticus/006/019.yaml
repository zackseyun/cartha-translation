base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/019.yaml
  text: The priest who makes atonement with it shall eat it. It shall be eaten in a holy place[a], in the court of the tent of meeting.
translation:
  language: ta
  text: அதைப் பாவநிவாரண பலியாகச் செலுத்தும் ஆசாரியன்[a] அதை உண்ண வேண்டும். அது பரிசுத்தமான ஓர் இடத்தில், சந்திப்புக் கூடாரத்தின் முற்றத்தில் உண்ணப்பட வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதைக் கொண்டு பரிகாரம் செய்கிற ஆசாரியன்.” எபிரெய வினையெச்சம், பாவநிவாரண பலிச் சடங்கை நடத்துவதையோ அதன்மூலம் தூய்மைப்படுத்துவதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּהֵן
  choice: ஆசாரியன்
  rationale: כֹּהֵן என்பதற்கான வழக்கமான, புரிந்துகொள்ள எளிய தமிழ்ச் சொல்; குறிப்பிட்ட ஆசாரியனைக் குறிக்கும் எபிரெய definite article சூழலால் வெளிப்படுகிறது.
- source_word: הַמְחַטֵּא אֹתָהּ
  choice: அதைப் பாவநிவாரண பலியாகச் செலுத்தும்
  rationale: பீயேல் வினையெச்சம் இங்கு பாவநிவாரண பலிச் சடங்கை நடத்துவதைக் குறிக்கும் சிறப்புப் பயன்பாட்டைக் கொண்டது. இந்த மொழிபெயர்ப்பு செயலைத் தெளிவாகக் கூறுகிறது; அதேவேளை ‘பரிகாரம் செய்கிற’ அல்லது ‘தூய்மைப்படுத்துகிற’ என்ற சாத்தியமான நுட்பத்தை அடிக்குறிப்பில் பாதுகாக்கிறது.
- source_word: יֹאכֲלֶנָּה
  choice: அதைச் சாப்பிட வேண்டும்
  rationale: பலிச்சட்டத்தில் வரும் imperfect கட்டளையையோ கடமையையோ குறிக்கிறது; நவீனத் தமிழில் ‘வேண்டும்’ இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּמָקוֹם קָדֹשׁ
  choice: பரிசுத்தமான ஓர் இடத்தில்
  rationale: מָקוֹם என்பதற்கு definite article இல்லாததால் ‘ஓர் இடத்தில்’ என மொழிபெயர்க்கப்பட்டது; ‘பரிசுத்தமான’ என்பது லேவியராகமத்தின் வழிபாட்டு சொற்பயன்பாட்டுடன் ஒத்துள்ளது.
- source_word: תֵּאָכֵל
  choice: சாப்பிடப்பட வேண்டும்
  rationale: நிஃபால் வடிவத்தின் செயப்பாட்டு கட்டளையைப் பாதுகாத்து, பலியின்மீது எபிரெய உரை வைக்கும் கவனத்தைத் தொடர்கிறது.
- source_word: בַּחֲצַר אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரத்தின் முற்றத்தில்
  rationale: אֹהֶל מוֹעֵד என்பதற்கு ‘சந்திப்புக் கூடாரம்’ தெளிவான நிலையான இணை; חָצֵר இங்கு அதன் முற்றத்தைக் குறிக்கிறது.
theological_decisions:
- issue: חטא என்ற வினையின் பலிச்சடங்கு சார்ந்த பொருள்
  choice: அதைப் பாவநிவாரண பலியாகச் செலுத்தும் ஆசாரியன்
  alternative: அதைக் கொண்டு பரிகாரம் செய்கிற ஆசாரியன் / அதன்மூலம் தூய்மைப்படுத்துகிற ஆசாரியன்
  rationale: இவ்வினை லேவியராகமத்தின் இச்சூழலில் பாவநிவாரண பலிச் சடங்கை நடத்துவதைக் குறிக்கலாம். முதன்மை உரை வாசகருக்குத் தெளிவாகச் சடங்கைக் குறிப்பிடுகிறது; எபிரெயச் சொல்லின் உண்மையான பொருள் விரிவை அடிக்குறிப்பு பாதுகாக்கிறது; பிற்காலக் கோட்பாட்டுச் சொற்பொருள் எதுவும் திணிக்கப்படவில்லை.
- issue: பெண்பால் பின்னொட்டுகளின் குறிப்பு
  choice: பலிப்பொருளைக் குறிக்கும் ‘அது’
  alternative: இலக்கணப் பெண்பாலை வடிவில் பிரதிபலித்தல்
  rationale: எபிரெயில் பின்னொட்டுகள் பெண்பாலாக இருந்தாலும், அவை பலியாகச் செலுத்தப்படும் விலங்கை அல்லது பலிப்பொருளைக் குறிக்கின்றன. தமிழில் உயிரற்ற பலிப்பொருளைக் குறிப்பிட ‘அது’ இயல்பானது.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க தமிழ் பயன்படுத்தப்பட்டுள்ளது. பலிச்சட்டத்தின் கடமைத் தொனி ‘வேண்டும்’ என்பதாலும், எபிரெய செயப்பாட்டு அமைப்பு ‘சாப்பிடப்பட வேண்டும்’ என்பதாலும் பாதுகாக்கப்பட்டுள்ளது.
