base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/009.yaml
  text: What is left of it Aaron and his sons shall eat[a]. It shall be eaten unleavened in a holy place[c][b]; they shall eat it in the court of the tent of meeting.
translation:
  language: ta
  text: அதில் மீதியானதை ஆரோனும் அவன் மகன்களும் சாப்பிட வேண்டும்[a]. அது புளிப்பில்லாததாக ஒரு பரிசுத்தமான இடத்தில் சாப்பிடப்பட வேண்டும்[b][c]; சந்திப்புக் கூடாரத்தின் முற்றத்தில் அவர்கள் அதைச் சாப்பிட வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அதில் எஞ்சியிருப்பதை.’
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் ‘ஒரு பரிசுத்தமான இடத்தில்’ என்றுள்ளது; ‘அந்தப் பரிசுத்த இடத்தில்’ என்று இல்லை. அடுத்த பகுதி அந்த இடம் சந்திப்புக் கூடாரத்தின் முற்றம் என்று குறிப்பிடுகிறது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘புளிப்பில்லாத அப்பங்களாக.’ எபிரெயச் சொல், காணிக்கை புளிப்பில்லாத வடிவில் உண்ணப்படுவதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנּוֹתֶרֶת מִמֶּנָּה
  choice: அதில் மீதியானதை
  rationale: பெண்பால் ஒருமைச் சொல்லெச்சம் பெயர்ச்சொல்லாகப் பயன்பட்டு, காணிக்கையில் மீந்த பகுதியைக் குறிக்கிறது. ‘அதில் மீதியானதை’ என்பது மூலத்தின் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: יֹאכְלוּ
  choice: சாப்பிட வேண்டும்
  rationale: சட்ட உரைச்சூழலில் இவ்வினை கட்டளையையும் கடமையையும் குறிக்கிறது; ‘வேண்டும்’ அந்த நெறிப்படுத்தும் வலிமையைத் தெளிவாகக் காட்டுகிறது.
- source_word: אַהֲרֹן וּבָנָיו
  choice: ஆரோனும் அவன் மகன்களும்
  rationale: இங்கு בנים என்பது ஆசாரியப் பணியிலுள்ள ஆரோனின் ஆண் வழித்தோன்றல்களைக் குறிக்கும்; எனவே ‘மகன்கள்’ துல்லியமானது.
- source_word: מַצּוֹת תֵּאָכֵל
  choice: அது புளிப்பில்லாததாக ... சாப்பிடப்பட வேண்டும்
  rationale: மூலத்தில் மַצּוֹת பன்மை வடிவில் இருந்தாலும், இங்கு காணிக்கை புளிப்பில்லாத நிலையில் உண்ணப்பட வேண்டும் என்பதே கருத்து. ‘அப்பம்’ அல்லது குறிப்பிட்ட வடிவத்தைச் சேர்க்காமல் அந்த நிலையைத் தமிழ் வெளிப்படுத்துகிறது.
- source_word: בְּמָקוֹם קָדֹשׁ
  choice: ஒரு பரிசுத்தமான இடத்தில்
  rationale: מָקוֹם என்பதற்கு வரையறைச் சுட்டு இல்லை; ஆகவே ‘அந்தப் பரிசுத்த இடத்தில்’ என்று அல்லாமல் ‘ஒரு பரிசுத்தமான இடத்தில்’ என்று மொழிபெயர்க்கப்படுகிறது. அடுத்த வாக்கியப்பகுதி அந்த இடத்தைத் துல்லியமாகக் குறிப்பிடுகிறது.
- source_word: בַּחֲצַר אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரத்தின் முற்றத்தில்
  rationale: חצר என்பது கூடார வளாகத்தின் சூழப்பட்ட முற்றத்தையும், אֹהֶל מוֹעֵד என்பது சந்திப்புக்குரிய பரிசுத்தக் கூடாரத்தையும் குறிக்கிறது.
- source_word: יֹאכְלוּהָ
  choice: அவர்கள் அதைச் சாப்பிட வேண்டும்
  rationale: மூலத்தின் இறுதி வினை பொருள் விகுதியுடன் கட்டளையை மறுபடியும் வலியுறுத்துகிறது; அந்தத் திரும்பக்கூறல் தமிழிலும் பாதுகாக்கப்படுகிறது.
