translation_notes:
  register: நவீனத் தரத் தமிழில், சட்ட உரைக்கேற்ற கண்ணியமான நடையும் தெளிவான கட்டளைத் தொனியும் பயன்படுத்தப்பட்டுள்ளன. ‘சாப்பிட வேண்டும்’ என்பது சாதாரண வாசகர்களுக்கு இயல்பாக இருப்பதோடு மூலத்தின் விதிப்பொருளையும் தருகிறது. ‘சந்திப்புக் கூடாரம்’ மூல உருவகத்தைப் பாதுகாக்கிறது.
