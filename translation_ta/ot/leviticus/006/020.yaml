  source_fidelity: முதல் வாக்கியம் எபிரெய மூலத்தின் பொதுவான சட்டவிதி நடையையும், பலியின் சதையைத் தொடுவதால் ஏற்படும் சடங்குசார் பரிசுத்த நிலையையும் சரியாகப் பேணுகிறது. இரண்டாம் வாக்கியத்தில் «அதன் இரத்தத்தில் சிறிது» என்பது מִדָּמָהּ (‘அதன் இரத்தத்தில் சில/சிறிது’) என்பதற்கு இலக்கண ரீதியாகச் சாத்தியமானாலும், நவீன தமிழில் தெளிவும் இயல்பும் குறைவாக உள்ளது. «அதன் இரத்தத்தின் சில துளிகள்» மூலத்தின் பகுதியளவு கருத்தைத் தெளிவாக வெளிப்படுத்துகிறது.
  naturalness: «அதன் இரத்தத்தில் சிறிது ஓர் ஆடையின்மேல் தெறித்தால்» என்ற தொடர் இயல்பற்றதாக ஒலிக்கிறது. «அதன் இரத்தத்தின் சில துளிகள் ஓர் ஆடையின்மேல் தெறித்தால்» என்பது நவீன நிலையான தமிழில் தெளிவானது. «அது தெறித்த அந்த ஆடையை» என்பது இரத்தத்தை எழுவாயாகக் கொள்ளச் செய்யக்கூடிய சிறு தெளிவின்மையை உடையது; «இரத்தம் தெறித்த அந்த ஆடையை» என வெளிப்படையாகச் சொல்வது பொருளைத் துல்லியப்படுத்துகிறது.
