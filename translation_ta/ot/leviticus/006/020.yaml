source:
  edition: WLC
  text: כֹּ֛ל אֲשֶׁר יִגַּ֥ע בִּ/בְשָׂרָ֖/הּ יִקְדָּ֑שׁ וַ/אֲשֶׁ֨ר יִזֶּ֤ה מִ/דָּמָ/הּ֙ עַל הַ/בֶּ֔גֶד אֲשֶׁר֙ יִזֶּ֣ה עָלֶ֔י/הָ תְּכַבֵּ֖ס בְּ/מָק֥וֹם קָדֹֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/020.yaml
  text: Anything that touches its flesh shall become holy[a], and if any of its blood is spattered on a garment, you shall wash that on which it was spattered in a holy place.
translation:
  language: ta
  text: அதன் சதையைத் தொடும் எதுவும் பரிசுத்தமாகும். அதன் இரத்தத்தின் சில துளிகள் ஓர் ஆடையின்மேல் தெறித்தால்[a], இரத்தம் தெறித்த அந்த ஆடையைப் பரிசுத்தமான ஓர் இடத்தில் துவைக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தெளிக்கப்பட்டால்.’ எபிரெய வினை சடங்குமுறையாகத் தெளிப்பதையும் குறிக்கலாம்; ஆனால் இங்கு இரத்தம் ஆடையின்மேல் படுவதும், பின்னர் அந்த ஆடை துவைக்கப்படுவதும் கூறப்படுவதால் ‘தெறித்தால்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל אֲשֶׁר
  choice: எதுவும்
  rationale: இது வரையறுக்கப்படாத, அனைத்தையும் உள்ளடக்கும் எபிரெயச் சொற்றொடர். உயிருள்ளவர்களுக்கு மட்டும் பொருளைக் குறுக்காமல், தொடும் எதையும் இயல்பான தமிழில் குறிக்கிறது.
- source_word: יִגַּע בִּבְשָׂרָהּ
  choice: அதன் சதையைத் தொடுகிற
  rationale: בָּשָׂר பலியின் உடல் சதையைக் குறிக்கிறது. ‘சதை’ என்பது பலியுணவுச் சூழலில் ‘இறைச்சி’ என்பதைவிட மூலத்தின் உருவகமற்ற உடற்கூறு சொல்லை நெருக்கமாகப் பேணுகிறது.
- source_word: יִקְדָּשׁ
  choice: பரிசுத்தமாகும்
  rationale: Qal வினை தொடர்பினால் பரிசுத்த நிலையை அடைவதைக் குறிக்கிறது. தனியான பிரதிஷ்டைச் சடங்கு நடந்ததாகச் சேர்க்காமல் நிலைமாற்றத்தை வெளிப்படுத்துகிறது.
- source_word: וַאֲשֶׁר יִזֶּה מִדָּמָהּ
  choice: அதன் இரத்தத்தில் சிறிது ... தெறித்தால்
  rationale: נזה இரத்தம் ஓர் ஆடையின்மேல் படுமாறு சிதறுவதை இங்கு குறிக்கிறது. ‘தெறித்தால்’ ஆடையைத் துவைக்கும் இச்சூழலுக்கு இயல்பானது; அதேவேளை சடங்குமுறை தெளிப்பாகப் புரிந்துகொள்ளும் வாய்ப்பை அடிக்குறிப்பு பாதுகாக்கிறது.
- source_word: עַל הַבֶּגֶד
  choice: ஓர் ஆடையின்மேல்
  rationale: சட்டவிதியின் பொதுவான நிகழ்வைத் தமிழில் இயல்பாகக் குறிக்க ‘ஓர் ஆடை’ பயன்படுத்தப்படுகிறது.
- source_word: אֲשֶׁר יִזֶּה עָלֶיהָ
  choice: அது தெறித்த அந்த ஆடையை
  rationale: பெண்பால் ஒருமை பின்னொட்டு ஆடையையே மீண்டும் சுட்டுகிறது. எந்தப் பொருளைத் துவைக்க வேண்டும் என்பதைத் தமிழில் தெளிவாகவும் மூலத்துக்கு நெருக்கமாகவும் கூறுகிறது.
- source_word: תְּכַבֵּס
  choice: துவைக்க வேண்டும்
  rationale: כבס என்பதன் Piel வடிவம் ஆடையைத் துவைப்பதைக் குறிக்கிறது. தமிழ் சட்டநடை கட்டளைக்கு இயல்பான கடப்பாட்டை இவ்வடிவம் தருகிறது.
- source_word: בְּמָקוֹם קָדֹשׁ
  choice: பரிசுத்தமான ஓர் இடத்தில்
  rationale: ‘இடம்’ என்பதற்கு எபிரெயத்தில் குறிப்புச் சுட்டு இல்லாததால், உள் பரிசுத்த ஸ்தலத்தை மிகையாகக் குறிப்பாக்காமல் பரிசுத்தமாக ஒதுக்கப்பட்ட ஓர் இடம் என்ற பொருளைப் பேணுகிறது.
theological_decisions:
- issue: பாவநிவாரண பலியின் சதையைத் தொடுவதால் ஏற்படும் பரிசுத்த நிலை
  choice: தொடுகிற எதுவும் ‘பரிசுத்தமாகும்’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: அது பரிசுத்தப் பயன்பாட்டுக்கென கட்டுப்படுத்தப்படும்; உள்ளார்ந்த அறநெறிப் பரிசுத்தம் பெறும் என்று பொருளல்ல.
  rationale: சூழல் சடங்குசார் பரிசுத்தத்தைப் பற்றியது. மொழிபெயர்ப்பு மூலத்தின் நிலைமாற்றக் கூற்றைப் பேணுகிறது; அது அறநெறிசார் உள்ளார்ந்த மாற்றம் என்று விளக்கத்தில் தீர்மானித்து விடவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் சட்டவிதிக்குரிய செறிவும் கொண்ட நடை. ‘பரிசுத்தம்’ என்ற பரவலாக அறியப்பட்ட வேதாகமச் சொல் பேணப்பட்டுள்ளது. இரண்டாம் ஆண்பால் ஒருமை கட்டளையைத் தமிழில் இயல்பான பொதுக் கடப்பாட்டு வடிவமான ‘துவைக்க வேண்டும்’ என வழங்கியுள்ளது.
