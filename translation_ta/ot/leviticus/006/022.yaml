  text: כָּל זָכָ֥ר בַּ/כֹּהֲנִ֖ים יֹאכַ֣ל אֹתָ֑/הּ קֹ֥דֶשׁ קָֽדָשִׁ֖ים הִֽוא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/022.yaml
  text: Every male among the priests may eat it[a]; it is most holy.
translation:
  language: ta
  text: ஆசாரியர்களில் ஒவ்வோர் ஆணும் அதை உண்ணலாம்; அது மகா பரிசுத்தமானது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “பரிசுத்தங்களின் பரிசுத்தம்”; இது “மகா பரிசுத்தமானது” என்று பொருள்படும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל זָכָר
  choice: ஒவ்வோர் ஆணும்
  rationale: כָּל என்பது ஒருமையில் உள்ள זָכָר என்பதுடன் சேர்ந்து பகிர்ந்தளிக்கும் பொருளில் ‘ஒவ்வோர் ஆணும்’ எனக் குறிக்கிறது; זָכָר வயதுவந்த மனிதனை அல்ல, ஆண்பாலினத்தவரைக் குறிப்பாகக் குறிக்கிறது.
- source_word: בַּכֹּהֲנִים
  choice: ஆசாரியர்களில்
  rationale: בְּ இங்கு ஆசாரியக் குழுவுக்குள் ஒருவராக இருப்பதைக் குறிக்கிறது; ‘ஆசாரியர்களில்’ என்பது இதை இயல்பாகவும் சுருக்கமாகவும் வெளிப்படுத்துகிறது.
- source_word: יֹאכַל
  choice: உண்ணலாம்
  rationale: இந்தச் சட்டச் சூழலில் வினை அனுமதிக்கப்பட்ட செயலைக் குறிக்கிறது; ‘உண்ணலாம்’ என்பது ஒவ்வொருவரும் கட்டாயம் உண்ண வேண்டும் என்ற பொருளைத் தவிர்க்கிறது.
- source_word: אֹתָהּ
  choice: அதை
  rationale: பெண்பால் ஒருமைச் சுட்டுப்பெயர் முன் விவாதிக்கப்பட்ட பலிப்பொருளைக் குறிக்கிறது; மூலத்தில் இல்லாத பெயர்ச்சொல்லைச் சேர்க்காமல் ‘அதை’ என வழங்கப்பட்டுள்ளது.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: மகா பரிசுத்தமானது
  rationale: ‘பரிசுத்தங்களின் பரிசுத்தம்’ என்ற எபிரெய உயர்நிலை மரபுத்தொடர், பலிப்பொருளின் மிக உயர்ந்த பரிசுத்த நிலையைக் குறிக்கிறது; ‘மகா பரிசுத்தமானது’ என்பது வழிபாட்டுச் சூழலுக்கேற்ற இயல்பான தமிழ்.
- source_word: הִוא
  choice: அது ... ஆனது
  rationale: எபிரெயத்தில் உள்ள பெண்பால் சுட்டுப்பெயர் அதன் இலக்கண முன்னிலையுடன் ஒத்துப்போகிறது; தமிழில் பொருளைக் குறிக்கும் ‘அது’ இயல்பானது, மேலும் வினையில்லா கூற்று ‘ஆனது’ மூலம் தெளிவாகிறது.
