translation_notes:
  register: நவீன பொதுத்தமிழில், சட்ட மற்றும் வழிபாட்டுச் சூழலுக்குரிய கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. அனுமதியைக் குறிக்கும் ‘உண்ணலாம்’ என்பதும், ஆசாரியக் குழுவுக்குள் தகுதியுடைய ஆண்பாலினத்தவரைக் குறிக்கும் ‘ஆசாரியர்களில் ஒவ்வோர் ஆணும்’ என்பதும் மூலத்தின் நுணுக்கத்தைப் பேணுகின்றன.
