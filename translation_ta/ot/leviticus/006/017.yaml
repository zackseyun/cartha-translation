  yaml_path: translation/ot/leviticus/006/017.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ta
  text: 'யாவே[a] மோசேயிடம் கூறியதாவது:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில்: ‘YHWH’; மரபாக ‘கர்த்தர்’ என்று மொழிபெயர்க்கப்படுகிறது.'
    reason: இறைப்பெயரின் எபிரெய வடிவத்தையும் மரபு மொழிபெயர்ப்பையும் தெரிவிக்கிறது.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பேசி
  rationale: வாவ்-தொடருடன் வரும் דּבר புதிய உரைப் பகுதியை அறிமுகப்படுத்துகிறது. அடுத்த வசனத்தில் நேரடி உரை தொடர்வதால், தமிழில் இயல்பான இணைப்பாக வினையெச்ச வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: எபிரெய தனிப்பெயரான நான்கெழுத்துத் திருப்பெயரை ஒரு பொதுப் பட்டமாக மாற்றாமல், தமிழில் பரவலாக அறியப்படும் பெயர் வடிவில் வழங்குகிறது.
- source_word: אֶל
  choice: -இடம்
  rationale: பேச்சு செலுத்தப்படும் நபரைக் குறிக்கும் எபிரெய முன்னிடைச்சொல்லுக்கு இயல்பான தமிழ் வேற்றுமை வடிவம்.
- source_word: מֹשֶׁה
  choice: மோசே
  rationale: தமிழில் நிலைபெற்றுள்ள இந்தத் தனிப்பெயரின் வடிவம்.
- source_word: לֵאמֹר
  choice: தனி மொழிபெயர்ப்பின்றி, வினையெச்சத் தொடரில் உட்பொருத்தப்பட்டது
  rationale: இச்சூழலில் நேரடி உரையை அறிமுகப்படுத்தும் எபிரெய வாய்பாடு. ‘பேசி’ என்ற தமிழ் வினையெச்சமும் அடுத்த வசனத்தில் தொடங்கும் உரையும் சேர்ந்து இதன் செயல்பாட்டை இயல்பாக வெளிப்படுத்துகின்றன; ‘சொல்லியதாவது’ எனச் சேர்ப்பது தேவையற்ற கனத்தை உண்டாக்கும்.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை வழங்குதல்
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் பொதுப் பட்டம் அல்ல, இறைவனின் தனிப்பெயரே உள்ளது. ஆகவே ‘கர்த்தர்’ என மாற்றாமல் பெயராகவே வழங்கப்பட்டது. ‘யாவே’ என்பது சாத்தியமான மறுகட்டமைக்கப்பட்ட உச்சரிப்பு; ‘யெகோவா’ தமிழில் பரவலாக அறியப்பட்ட பெயர் வடிவம். உண்மையான வடிவம் YHWH என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
translation_notes:
  register: நவீன, கண்ணியமான, பொதுவாசகருக்குப் புரியும் தமிழ். இவ்வசனம் அடுத்த வசனத்தின் நேரடி உரைக்கான அறிமுகமாக இருப்பதால், ‘பேசி,’ என்ற இயல்பான தொடர்வடிவம் பயன்படுத்தப்பட்டுள்ளது.
