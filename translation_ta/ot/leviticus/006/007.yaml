  to: '“தானியக் காணிக்கைக்கான நியமம்[a] இதுவே: ஆரோனின் மகன்கள் அதை யாவேவின் முன்னிலையில், பலிபீடத்தின் முன்பாகக் கொண்டுவந்து சமர்ப்பிக்க வேண்டும்.”'
