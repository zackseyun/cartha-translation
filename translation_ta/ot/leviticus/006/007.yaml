reference: Leviticus 6:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/זֹ֥את תּוֹרַ֖ת הַ/מִּנְחָ֑ה הַקְרֵ֨ב אֹתָ֤/הּ בְּנֵֽי אַהֲרֹן֙ לִ/פְנֵ֣י יְהוָ֔ה אֶל פְּנֵ֖י הַ/מִּזְבֵּֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/007.yaml
  text: 'And this is the law of the grain offering: the sons of Aaron shall present it before Yahweh[a], in front of the altar.'
translation:
  language: ta
  text: '“தானியக் காணிக்கைக்கான நியமம்[a] இதுவே: ஆரோனின் மகன்கள் அதை யாவேவின் முன்னிலையில், பலிபீடத்தின் முன்பாகக் கொண்டுவந்து சமர்ப்பிக்க வேண்டும்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “தானியக் காணிக்கைக்கான அறிவுறுத்தல்” அல்லது “தானியக் காணிக்கைக்கான ஒழுங்குமுறை.”
    reason: תּוֹרָה என்ற சொல் இச்சூழலில் சட்டம், அறிவுறுத்தல், அல்லது ஒழுங்குமுறை என்ற தொடர்புடைய பொருள்களைத் தரக்கூடும்.
lexical_decisions:
- source_word: וְזֹאת
  choice: இதுவே
  rationale: புதிய வழிமுறைப் பகுதியை அறிமுகப்படுத்தும் எபிரெய இணைப்பையும் சுட்டுப்பெயரையும், இயல்பான நவீனத் தமிழில் சுருக்கமாகத் தெரிவிக்கிறது.
- source_word: תּוֹרַת
  choice: நியமம்
  rationale: இங்கு பலிச் சடங்கிற்குரிய கட்டுப்படுத்தப்பட்ட நடைமுறையைக் குறிக்கிறது. ‘நியமம்’ சட்டத்தன்மையையும் நடைமுறை அறிவுறுத்தலையும் தக்கவைக்கிறது.
- source_word: הַמִּנְחָה
  choice: தானியக் காணிக்கை
  rationale: லேவியராகமத்தின் பலியியல் சூழலில் இது பொதுவான காணிக்கையல்ல, தானியத்தால் செய்யப்படும் குறிப்பிட்ட காணிக்கையைக் குறிக்கிறது.
- source_word: הַקְרֵב אֹתָהּ
  choice: அதை ... கொண்டுவந்து படைக்க வேண்டும்
  rationale: காணிக்கையைச் சடங்குமுறையில் அருகே கொண்டுவந்து கடவுள்முன் சமர்ப்பிக்கும் செயலைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: בְּנֵי אַהֲרֹן
  choice: ஆரோனின் மகன்கள்
  rationale: ஆசாரியப் பணியுடன் தொடர்புடைய குடும்ப அடையாளத்தை மூலத்திற்கு நெருக்கமாகப் பாதுகாக்கிறது.
- source_word: לִפְנֵי יְהוָה
  choice: யாவேக்கு முன்பாக
  rationale: காணிக்கை யாவேயின் சந்நிதியில் படைக்கப்படுவதைத் தெரிவிக்கிறது; தேவநாமத்தை மொழிபெயர்க்காமல் ஒலிபெயர்க்கிறது.
- source_word: אֶל פְּנֵי הַמִּזְבֵּחַ
  choice: பலிபீடத்தின் முன்னே
  rationale: முந்தைய ‘யாவேக்கு முன்பாக’ என்பதிலிருந்து வேறுபட்ட, பலிபீடத்துடன் தொடர்புடைய இடக்குறிப்பைப் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தேவநாமத்தை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: எபிரெய உரையில் வரும் உடன்படிக்கைப் பெயரைப் பொதுப்பட்டமாக மாற்றாமல் நேரடியாக ஒலிபெயர்க்கிறது.
- issue: பலியியல் சூழலில் תּוֹרָה என்பதன் பொருள்
  choice: நியமம்
  alternative: அறிவுறுத்தல் / ஒழுங்குமுறை
  rationale: சட்டத்தன்மையையும் சடங்கு நடைமுறையையும் வெளிப்படுத்துகிறது; சொல்லின் பரந்த பொருள் மாற்று வாசிப்பாக அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டு உரைக்கு ஏற்ற கண்ணியமானதும் பொதுவாசகர்களுக்குப் புரியக்கூடியதுமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘யாவேக்கு முன்பாக’ மற்றும் ‘பலிபீடத்தின் முன்னே’ ஆகிய இரு இடவியல் சொற்றொடர்களும் தனித்தனியாகப் பாதுகாக்கப்பட்டுள்ளன.
