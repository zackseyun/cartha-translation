  revision_rationale: The revision changes only the first spatial phrase so that it expresses the Hebrew sense of presentation in Yahweh’s presence rather than a dative relation. It retains the draft’s valid distinction between being before Yahweh and being at the front of the altar, as well as its established sacrificial terminology and footnote alternative.
