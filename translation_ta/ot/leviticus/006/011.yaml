revisions:
- from: ஆரோனின் மகன்களில் ஆண்கள் அனைவரும் அதிலிருந்து சாப்பிடலாம். யெகோவாவுக்குச் செலுத்தப்படும் நெருப்புப் பலிகளிலிருந்து கிடைக்கும் பங்கைக் குறித்த இது, தலைமுறைதோறும் உங்களுக்கு நிரந்தர நியமமாக இருக்கும். அவற்றைத் தொடுவது எதுவோ அது புனிதமாகும்.[a]
  to: ஆரோனின் மகன்களிலுள்ள ஒவ்வோர் ஆணும் அதிலிருந்து உண்ணலாம். யாவேக்கான நெருப்புப் பலிகளைப் பற்றிய இது, உங்கள் தலைமுறைகள் முழுவதும் நிரந்தர நியமமாகும். அவற்றைத் தொடுவது எதுவோ அது புனிதமாகும்.[a]
  rationale: The revision corrects the divine name to the project-default “யாவே,” removes the unexpressed addition “கிடைக்கும் பங்கு,” improves the distributive wording for כָּל זָכָר, and recasts the legal formula into natural Tamil without resolving the disputed force of יִקְדָּשׁ. The footnote retains both resultant sanctification and the more restrictive alternative reading.
