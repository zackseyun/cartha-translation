  text: כָּל זָכָ֞ר בִּ/בְנֵ֤י אַהֲרֹן֙ יֹֽאכֲלֶ֔/נָּה חָק עוֹלָם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם מֵ/אִשֵּׁ֖י יְהוָ֑ה כֹּ֛ל אֲשֶׁר יִגַּ֥ע בָּ/הֶ֖ם יִקְדָּֽשׁ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/011.yaml
  text: Every male among the sons of Aaron may eat of it[a]. It is a permanent statute throughout your generations from the food offerings of Yahweh. Whatever touches them shall become holy.
translation:
  language: ta
  text: ஆரோனின் மகன்களிலுள்ள ஒவ்வோர் ஆணும் அதிலிருந்து உண்ணலாம். யாவேக்கான நெருப்புப் பலிகளைப் பற்றிய இது, உங்கள் தலைமுறைகள் முழுவதும் நிரந்தர நியமமாகும். அவற்றைத் தொடுவது எதுவோ அது புனிதமாகும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவற்றைத் தொடுவது எதுவோ அது பரிசுத்தமாக்கப்படும்.” தொடுதலால் புனித நிலை ஏற்படுவதை எபிரெய வாசகம் குறிக்கலாம்; புனிதமானது மட்டுமே அவற்றைத் தொடலாம் என்றும் சிலர் இதைப் புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל זָכָר בִּבְנֵי אַהֲרֹן
  choice: ஆரோனின் மகன்களில் ஆண்கள் அனைவரும்
  rationale: ஆசாரியத் தகுதியைக் குறிக்கும் சூழலில் זָכָר என்பதன் பாலினத் துல்லியத்தையும், ‘ஆரோனின் மகன்கள்’ என்ற குடும்ப/ஆசாரிய அடையாளத்தையும் காக்கிறது.
- source_word: יֹאכֲלֶנָּה
  choice: அதிலிருந்து சாப்பிடலாம்
  rationale: முந்தைய சூழலில் கூறப்பட்ட பலிப் பங்கைக் குறிக்கும் பெண்பால் ஒருமை பின்னொட்டையும், அதை உண்ண ஆசாரியர்களுக்கு உள்ள அனுமதி/உரிமையையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: חָק עוֹלָם לְדֹרֹתֵיכֶם
  choice: தலைமுறைதோறும் உங்களுக்கு நிரந்தர நியமமாக இருக்கும்
  rationale: தொடர்ந்து வரும் தலைமுறைகளுக்கும் பொருந்தும் நிலையான சட்ட ஏற்பாடு என்ற உடன்படிக்கைச் சூத்திரத்தின் கருத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: מֵאִשֵּׁי יְהוָה
  choice: யெகோவாவுக்குச் செலுத்தப்படும் நெருப்புப் பலிகளிலிருந்து கிடைக்கும் பங்கு
  rationale: אִשֶּׁה என்பது நெருப்பின்மூலம் செலுத்தப்படும் பலிகளைக் குறிக்கிறது; முன்வரும் உண்ணத்தக்க ஆசாரியப் பங்குடன் சட்டவாக்கியத்தை இயல்பாக இணைக்க ‘கிடைக்கும் பங்கு’ வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: திருப்பெயரை ஒரு பொதுப்பட்டமாக மாற்றாமல், நவீன தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பால் வழங்குகிறது.
- source_word: כֹּל אֲשֶׁר יִגַּע בָּהֶם
  choice: அவற்றைத் தொடுவது எதுவோ
  rationale: தொடுவது நபரா பொருளா என்று எபிரெயம் வரையறுக்காத பரந்த பொருளைத் தமிழிலும் காக்கிறது.
- source_word: יִקְדָּשׁ
  choice: புனிதமாகும்
  rationale: தொடுதலின் விளைவாகப் புனித நிலையை அடைவது என்ற எளிய வினைமுற்றுப் பொருளைத் தருகிறது; மாற்று கட்டுப்பாட்டு வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: இறுதிக் கூறில் புனிதம் தொடுதலால் உண்டாகிறதா என்பது
  choice: தொடுவது புனிதமாகும் என்ற விளைவு நிலையாக மொழிபெயர்க்கப்பட்டது.
  alternative: புனிதமானது மட்டுமே அவற்றைத் தொட வேண்டும்; அல்லது தொடுவது அர்ப்பணிக்கப்பட்டதாகக் கருதப்படும்.
  rationale: יִקְדָּשׁ என்பதன் நேரடியான வடிவம் புனித நிலையை அடைவதைக் குறிக்கிறது. ஆயினும் அதன் சடங்கியல் நடைமுறை விளைவு மற்றும் கட்டுப்பாட்டு புரிதல் உரையிலேயே தீர்க்கப்படாமல் அடிக்குறிப்பில் வைக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான சட்டநடை பயன்படுத்தப்பட்டுள்ளது. ‘புனிதம்’, ‘நிரந்தர நியமம்’, ‘நெருப்புப் பலிகள்’ ஆகியவை லேவியராகமத்தின் சடங்கியல் சொற்களஞ்சியத்தைத் துல்லியமாக வைத்திருக்கின்றன.
