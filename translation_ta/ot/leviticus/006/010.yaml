source:
  edition: WLC
  text: לֹ֤א תֵאָפֶה֙ חָמֵ֔ץ חֶלְקָ֛/ם נָתַ֥תִּי אֹתָ֖/הּ מֵ/אִשָּׁ֑/י קֹ֤דֶשׁ קָֽדָשִׁים֙ הִ֔וא כַּ/חַטָּ֖את וְ/כָ/אָשָֽׁם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/010.yaml
  text: It shall not be baked with leaven[a]. I have given it as their portion from my food offerings. It is most holy[b], like the sin offering and the guilt offering.
translation:
  language: ta
  text: அது புளிப்புடன் சுடப்படக் கூடாது. என் நெருப்புப் பலிகளிலிருந்து அதை அவர்களுடைய பங்காகக் கொடுத்திருக்கிறேன்.[a] பாவநிவாரணப் பலியையும் குற்றநிவாரணப் பலியையும்[b] போல, அது மிகப் பரிசுத்தமானது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் உணவுப் பலிகளிலிருந்து”; அல்லது, “நெருப்பால் செலுத்தப்படும் என் பலிகளிலிருந்து.”
    reason: lexical_alternative
  - marker: b
    text: “குற்றநிவாரணப் பலி” என்பதற்கு “ஈடுசெய்யும் பலி” அல்லது “குற்றப்பலி” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵאָפֶה
  choice: சுடப்படக் கூடாது
  rationale: நிஃபால் வினைவடிவத்தின் செயப்பாட்டு பொருளையும் சட்டக் கட்டளையின் வலிமையையும் இயல்பான தமிழில் தருகிறது.
- source_word: חָמֵץ
  choice: புளிப்புடன்
  rationale: புளிப்பூட்டும் பொருள் அல்லது புளித்த தன்மையைக் குறிக்கும் சொல்லை, அப்பம் என்று கூடுதலாகக் குறிப்பிடாமல் சுடும் சூழலுக்கு ஏற்றவாறு தருகிறது.
- source_word: חֶלְקָם
  choice: அவர்களுடைய பங்கு
  rationale: ஆசாரியர்களுக்கு ஒதுக்கப்பட்ட உரிமைப் பங்கைத் தெளிவாகக் காட்டி, பன்மை உடைமை விகுதியையும் காக்கிறது.
- source_word: נָתַתִּי אֹתָהּ
  choice: அதை ... கொடுத்திருக்கிறேன்
  rationale: நிறைவேறியிருந்தாலும் தொடர்ந்து செல்லுபடியாகும் ஆண்டவரின் ஒதுக்கீட்டைத் தமிழ் இறந்தகால நிறைவு வடிவில் வெளிப்படுத்துகிறது.
- source_word: מֵאִשַּׁי
  choice: என் நெருப்புப் பலிகளிலிருந்து
  rationale: אִשֶּׁה என்ற தொழில்நுட்பப் பலிச் சொல்லில் உள்ள நெருப்பு சார்ந்த பொருளை நேரடியாகக் காக்கிறது; 'என்' என்ற உடைமையையும் விடாமல் தருகிறது.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: மகா பரிசுத்தமானது
  rationale: எபிரெயச் சிறப்புயர்வு அமைப்பு குறிக்கும் மிக உயர்ந்த பரிசுத்த நிலையை, இடப்பெயராகத் தோன்றாமல் பலியின் வகைப்பாடாகக் காட்டுகிறது.
- source_word: כַּחַטָּאת
  choice: பாவநிவாரணப் பலியைப் போல
  rationale: כ என்ற ஒப்புமை முன்னொட்டைத் தெளிவாகக் காத்து, חַטָּאת என்பதைக் காலத்திற்கேற்ற புரிந்துகொள்ளத்தக்க பலிப்பெயராக வழங்குகிறது.
- source_word: וְכָאָשָׁם
  choice: குற்றநிவாரணப் பலியையும் போல
  rationale: אָשָׁם குற்றத்தோடும் அதற்கான ஈடுசெய்தலோடும் தொடர்புடைய பலிவகை என்பதைத் தெரிவிக்கிறது; பாரம்பரியமாகத் தெளிவில்லாத சொல்லைத் தவிர்க்கிறது.
theological_decisions:
- issue: אָשָׁם என்ற பலிச் சொல்லின் மொழிபெயர்ப்பு
  choice: குற்றநிவாரணப் பலி
  alternative: ஈடுசெய்யும் பலி; குற்றப்பலி
  rationale: குற்றம் காரணமாகச் செலுத்தப்படும் தனிப்பட்ட பலிவகையைத் தெளிவாகக் குறிக்கிறது; ஒரு குறிப்பிட்ட பாவநிவாரணக் கோட்பாட்டை வசனத்தில் திணிக்கவில்லை. மாற்று வழக்குகளைக் குறிப்பில் பாதுகாக்கிறது.
- issue: אִשֶּׁה என்ற பலிச் சொல்லின் மொழிபெயர்ப்பு
  choice: நெருப்புப் பலிகள்
  alternative: உணவுப் பலிகள்; நெருப்பால் செலுத்தப்படும் பலிகள்
  rationale: மூலச்சொல்லின் நெருப்பு சார்ந்த ஒலிப்பை காக்கிறது. இந்தச் சொல் தொழில்நுட்பப் பலிவகையைக் குறிக்கக்கூடும் என்பதால் விரிவான மாற்றை அடிக்குறிப்பில் தருகிறது.
- issue: קֹדֶשׁ קָדָשִׁים என்பதன் நிலை
  choice: மகா பரிசுத்தமானது
  alternative: பரிசுத்தங்களில் பரிசுத்தமானது; மிகவும் பரிசுத்தமானது
  rationale: இது ஒரு ஆலய இடத்தைக் குறிக்காமல், பலியின் மிக உயர்ந்த பரிசுத்த வகைப்பாட்டைக் குறிக்கிறது என்பதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சட்ட-வழிபாட்டு சூழலுக்கேற்ற கண்ணியமான நடை. தொழில்நுட்பப் பலிச் சொற்கள் வாசகருக்குப் புரியுமாறு அமைக்கப்பட்டுள்ளன; மூலத்தின் மாற்றுப் பொருள் வாய்ப்புகள் அடிக்குறிப்புகளில் காக்கப்பட்டுள்ளன.
