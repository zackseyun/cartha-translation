base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/018.yaml
  text: 'Speak to Aaron and to his sons[a], saying, ‘This is the law of the sin offering: in the place where the burnt offering is slaughtered, the sin offering shall be slaughtered before Yahweh. It is most holy.’'
translation:
  language: ta
  text: 'ஆரோனிடமும் அவன் மகன்களிடமும் இவ்வாறு சொல்: ‘பாவப் பலியைப்[a] பற்றிய விதிமுறை இதுவே: தகனப் பலி அறுக்கப்படும் இடத்தில் பாவப் பலியும் யாவேவின் முன்னிலையில் அறுக்கப்பட வேண்டும். அது மிகப் பரிசுத்தமானது.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தூய்மைப்படுத்தும் பலி.’ எபிரேயச் சொல் חַטָּאת பாவத்தையும், பாவத்திலிருந்தோ தீட்டிலிருந்தோ தூய்மைப்படுத்துதலோடு தொடர்புடைய பலியையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר אֶל אַהֲרֹן וְאֶל בָּנָיו לֵאמֹר
  choice: ஆரோனிடமும் அவன் மகன்களிடமும் பேசி, அவர்களிடம் சொல்
  rationale: எபிரேய கட்டளைச் சூத்திரத்தின் முறையான தொனியையும் ஆரோன் மற்றும் அவன் மகன்கள் இருவருக்கும் முன்வைக்கப்பட்டுள்ள தனித்தனி முன்னிடைச்சொற்களின் வலியுறுத்தலையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: זֹאת תּוֹרַת
  choice: பற்றிய விதிமுறை இதுவே
  rationale: பலிச்சடங்கு சட்டப்பகுதியில் תּוֹרָה என்பது பொது அர்த்தத்திலான ‘சட்டம்’ என்பதைவிட ஒரு குறிப்பிட்ட ஒழுங்குமுறை அல்லது அறிவுறுத்தலைக் குறிக்கிறது; ‘விதிமுறை’ தற்போதைய தமிழில் தெளிவாக உள்ளது.
- source_word: הַחַטָּאת
  choice: பாவநிவாரணப் பலி
  rationale: இங்கு חַטָּאת அருவமான ‘பாவத்தை’ அல்ல, அதனுடன் தொடர்புடைய பலியைச் சுட்டுகிறது. ‘பாவநிவாரணப் பலி’ தமிழ் வேதாகமச் சூழலில் அறியத்தக்கதாகவும் பலியின் நோக்கத்தைச் சுருக்கமாக வெளிப்படுத்துவதாகவும் உள்ளது; தூய்மைப்படுத்தும் பலி என்ற சடங்கியல் நுணுக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: הָעֹלָה
  choice: தகனப் பலி
  rationale: עֹלָה முழுவதுமாக எரிக்கப்படும் பலிக்கான தொழில்நுட்பச் சொல்; ‘தகனப் பலி’ சுருக்கமான, கண்ணியமான தமிழ் இணைச்சொல்.
- source_word: תִּשָּׁחֵט
  choice: அறுக்கப்பட வேண்டும்
  rationale: שׁחט பலிக்காக விலங்கைக் கழுத்தறுத்தலைக் குறிக்கிறது. சட்டப்பகுதியிலுள்ள imperfect வடிவத்தின் கட்டளைச் சக்தியை ‘வேண்டும்’ வெளிப்படுத்துகிறது.
- source_word: לִפְנֵי יְהוָה
  choice: யாவேக்கு முன்பாக
  rationale: לִפְנֵי என்பதன் நேரடியான சடங்கியல் உறவைக் காக்கிறது; יהוה என்ற உடன்படிக்கைப் பெயர் பொதுவான பட்டமாக மாற்றப்படாமல் ‘யாவே’ என ஒலிபெயர்க்கப்படுகிறது.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: மகா பரிசுத்தமானது
  rationale: எபிரேய உயர்நிலைச் சொற்றொடர் மிக உயர்ந்த பரிசுத்த நிலையைச் சுட்டுகிறது. ‘மகா பரிசுத்தமானது’ என்பது ஆலயத்தின் ‘மகா பரிசுத்த ஸ்தலம்’ என்பதோடு இதைத் தவறாக ஒன்றுபடுத்தாமல் பலியின் வகைப்பாட்டைத் தெளிவாகக் கூறுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயரான יהוה நேரடியாக உள்ளது. அதை ஒரு பட்டமாக மாற்றாமல் தமிழில் அறியத்தக்க ஒலிபெயர்ப்பாக வழங்குவது மூலத்தின் தனித்தன்மையைக் காக்கிறது.
- issue: חַטָּאת என்பதன் பலிச்சடங்கு பொருள்
  choice: பாவநிவாரணப் பலி
  alternative: தூய்மைப்படுத்தும் பலி
  rationale: இந்தச் சொல் பாவத்துடன் தொடர்புடைய பலியையும் சடங்கியல் தூய்மைப்படுத்துதலையும் உள்ளடக்கக்கூடும். பிரதான உரையில் பரவலாகப் புரிந்துகொள்ளப்படும் பெயர் பயன்படுத்தப்பட்டு, மாற்று நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டப்பகுதிக்கேற்ற கண்ணியமான மற்றும் தெளிவான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பலியும்’ என்ற இணைப்புச் சொல் மூலத்தில் உள்ள ஒரே இடத்தில் இரு பலிகளும் அறுக்கப்படுகின்றன என்ற இணைநிலையை இயல்பாக வெளிப்படுத்துகிறது; புதிய கருத்தைச் சேர்ப்பதில்லை.
