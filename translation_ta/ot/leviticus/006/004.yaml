  text: וּ/פָשַׁט֙ אֶת בְּגָדָ֔י/ו וְ/לָבַ֖שׁ בְּגָדִ֣ים אֲחֵרִ֑ים וְ/הוֹצִ֤יא אֶת הַ/דֶּ֨שֶׁן֙ אֶל מִ/ח֣וּץ לַֽ/מַּחֲנֶ֔ה אֶל מָק֖וֹם טָהֽוֹר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/004.yaml
  text: Then he shall take off his garments and put on other garments[b][a], and carry the ashes outside the camp to a clean place.
translation:
  language: ta
  text: பின்பு அவன் தன் ஆடைகளைக் கழற்றி, வேறு ஆடைகளை அணிந்துகொண்டு, சாம்பலை முகாமுக்கு வெளியே சுத்தமான[b] ஓர் இடத்துக்குக் கொண்டுபோக வேண்டும்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சாம்பலை வெளியே எடுத்துச் செல்ல வேண்டும்.”
    reason: lexical_alternative
  - marker: b
    text: இங்கு “சுத்தமான” என்பது லேவியராகமத்தில் கூறப்படும் சடங்குமுறைத் தூய்மையைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וּפָשַׁט
  choice: பின்பு அவன் ... கழற்றி
  rationale: ஆடைகளைக் குறிக்கும் இச்சூழலில் פשט என்பது ‘கழற்றுதல்’ என்று பொருள்படும். தொடர் சடங்கு வழிமுறையைக் காட்ட வாவ் இணைப்பை இயல்பான தமிழில் ‘பின்பு’ என வழங்கியது.
- source_word: בְּגָדָיו
  choice: தன் ஆடைகளை
  rationale: בגד என்பதன் இயல்பான பொருள் ‘ஆடை’. எபிரெய உரையில் உள்ள உடைமைத் தொடர்பை தமிழில் இயல்பாகக் காட்ட ‘தன்’ பயன்படுத்தப்பட்டது.
- source_word: וְלָבַשׁ
  choice: அணிந்துகொண்டு
  rationale: לבש என்பது ஆடையை அணிவதைக் குறிக்கிறது. அடுத்த செயலுடன் தொடர்ச்சியைத் தெளிவாக்க வினையெச்ச வடிவம் பயன்படுத்தப்பட்டது.
- source_word: בְּגָדִים אֲחֵרִים
  choice: வேறு ஆடைகளை
  rationale: אֲחֵרִים என்பது முன்பு அணிந்திருந்தவற்றிலிருந்து வேறான ஆடைகளைக் குறிக்கிறது; ‘வேறு ஆடைகள்’ இதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וְהוֹצִיא
  choice: கொண்டுபோக வேண்டும்
  rationale: יצא என்பதன் ஹிஃபில் வடிவம் ஒன்றை வெளியே எடுத்துச் செல்வதைக் குறிக்கிறது. இலக்கை நோக்கிய நகர்வை இங்கு ‘கொண்டுபோக’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַדֶּשֶׁן
  choice: சாம்பலை
  rationale: இங்கு דֶּשֶׁן பலிபீடத்தில் எரிந்த பலியின் சாம்பல் எச்சத்தைக் குறிக்கிறது. தமிழில் ‘சாம்பல்’ இயல்பான கூட்டுப்பொருள் பெயராக அமைகிறது.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: முகாமுக்கு வெளியே
  rationale: முகாமின் எல்லைக்கு அப்பால் கொண்டு செல்வதை இந்தச் சொற்றொடர் குறிக்கிறது; தமிழில் இவ்வடிவம் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: אֶל מָקוֹם טָהוֹר
  choice: சுத்தமான ஓர் இடத்துக்கு
  rationale: טָהוֹר என்பதற்கு நேரடியான தமிழ் இணை ‘சுத்தமான’. லேவியராகமச் சூழலில் உள்ள சடங்குமுறைப் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது; முதன்மை உரையில் மிகைவிளக்கம் தவிர்க்கப்படுகிறது.
theological_decisions:
- issue: טָהוֹר என்பதிலுள்ள சடங்குமுறைத் தூய்மை நுணுக்கம்
  choice: சுத்தமான இடம்
  alternative: சடங்குமுறைப்படி சுத்தமான இடம்; தூய்மையான இடம்
  rationale: எபிரெயச் சொல் சுத்தம் அல்லது தூய்மை என்ற வகைப்பாட்டைத் தருகிறது; லேவியராகமச் சூழலில் அது சடங்குமுறைப் பொருளையும் கொண்டுள்ளது. முதன்மை உரையில் அந்தப் பொருளை விளக்கமாகச் சேர்த்து குறுக்காமல், அடிக்குறிப்பில் தெளிவுபடுத்தப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் ஆசாரியச் சடங்கு வழிமுறைக்கேற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டது. எபிரெய வாக்கியத்தின் தொடர்ச்சியான செயல்முறை இயல்பான தமிழ் வினையெச்சங்களால் வெளிப்படுத்தப்பட்டது.
