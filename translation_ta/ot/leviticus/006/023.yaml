review_pass:
  verdict: revise
  source_fidelity: The draft accurately identifies חַטָּאת as an offering, preserves the partitive force of מִדָּמָהּ, and correctly conveys the prohibition and required burning. However, “இரத்தத்தில் ஒரு பகுதி” can mean ‘a portion within the blood’ rather than ‘a portion of the blood.’ It should explicitly use ‘இரத்தத்திலிருந்து ஒரு பகுதி.’
  naturalness: The legal-register Tamil is clear and appropriately dignified. The revised wording improves the genitive/partitive relationship and places the purpose phrase more naturally with the bringing of the blood.
  terminology: “பாவநிவாரணப் பலி,” “சந்திப்புக் கூடாரம்,” “பரிசுத்த இடம்,” and “பாவநிவிர்த்தி” are suitable, consistent modern-standard Tamil cultic terms. The lexical-alternative footnote appropriately retains ‘தூய்மைப்படுத்தும் பலி’ without forcing that interpretation into the text.
  issues:
  - severity: medium
    issue: Ambiguous expression for the partitive blood reference
    rationale: “எந்தப் பாவநிவாரணப் பலியின் இரத்தத்தில் ஒரு பகுதி” is not idiomatic for the Hebrew מִדָּמָהּ (‘from its blood’), and may be read as a portion located in the blood. “இரத்தத்திலிருந்து ஒரு பகுதி” clearly conveys that some of the offering’s blood is brought in.
  revised_text: எந்தப் பாவநிவாரணப் பலியின் இரத்தத்திலிருந்து ஒரு பகுதி பரிசுத்த இடத்தில் பாவநிவிர்த்தி செய்யும்படி சந்திப்புக் கூடாரத்திற்குள் கொண்டுவரப்படுகிறதோ, அந்தப் பலியை உண்ணக்கூடாது; அது நெருப்பில் எரிக்கப்பட வேண்டும்.
