base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/023.yaml
  text: But any sin offering from whose blood some is brought into the tent of meeting to make atonement in the holy place shall not be eaten[a]; it shall be burned with fire.
translation:
  language: ta
  text: எந்தப் பாவநிவாரணப் பலியின் இரத்தத்திலிருந்து ஒரு பகுதி பரிசுத்த இடத்தில் பாவநிவிர்த்தி செய்யும்படி சந்திப்புக் கூடாரத்திற்குள் கொண்டுவரப்படுகிறதோ, அந்தப் பலியை உண்ணக்கூடாது; அது நெருப்பில் எரிக்கப்பட வேண்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכָל חַטָּאת
  choice: எந்தப் பாவநிவாரணப் பலி
  rationale: כָל உடன் தொடர்புச் சொல் வரும் இச்சட்ட வாக்கியத்தில் ‘எந்த ... பலியோ’ என்ற தமிழ் அமைப்பு முழுமையான வரம்பையும் இயல்பாக வெளிப்படுத்துகிறது. חַטָּאת இங்கு கருத்தியல் ‘பாவம்’ அல்ல, பலியையே குறிக்கிறது.
- source_word: אֲשֶׁר יוּבָא מִדָּמָהּ
  choice: இரத்தத்தில் ஒரு பகுதி ... கொண்டுவரப்படுகிறதோ
  rationale: מִן பகுதியைக் குறிக்கும் என்பதால், இரத்தம் முழுவதுமல்ல அதன் ஒரு பகுதி கொண்டுவரப்படுவதைத் தெளிவாக்குகிறது; எபிரெயச் செயலப்பாட்டு வடிவமும் காக்கப்படுகிறது.
- source_word: אֶל אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரத்திற்குள்
  rationale: אֹהֶל מוֹעֵד என்பதற்கான தெளிவான வழிபாட்டுச் சூழல் சார்ந்த பெயர்; אֶל இங்கு உள்ளே கொண்டு செல்லப்படுவதைச் சுட்டுவதால் ‘க்குள்’ பயன்படுத்தப்பட்டது.
- source_word: לְכַפֵּר
  choice: பாவநிவிர்த்தி செய்வதற்காக
  rationale: כפר என்பதன் பலியியல் மற்றும் இறையியல் வலிமையை ஒரு குறிப்பிட்ட நிவிர்த்திக் கோட்பாட்டிற்குள் சுருக்காமல், தமிழில் பரவலாக அறியப்பட்ட சொற்றொடரால் வழங்குகிறது.
- source_word: בַּקֹּדֶשׁ
  choice: பரிசுத்த இடத்தில்
  rationale: இது கருத்தியல் பரிசுத்தத்தை அல்ல, ஆலயத்தின் புனிதப் பகுதியைக் குறிக்கிறது; மூலத்தின் concrete expression-ஐப் பாதுகாக்கிறது.
- source_word: לֹא תֵאָכֵל
  choice: உண்ணக் கூடாது
  rationale: எபிரெய நிபால் செயலப்பாட்டு தடையை இயல்பான நவீனத் தமிழ் சட்ட நடையில் வெளிப்படுத்துகிறது.
- source_word: בָּאֵשׁ תִּשָּׂרֵף
  choice: நெருப்பில் எரிக்கப்பட வேண்டும்
  rationale: ‘நெருப்பால்/நெருப்பில் எரித்தல்’ என்ற மூலத்தின் வலியுறுத்தலைத் தக்கவைத்து, செயலப்பாட்டு கட்டளை நடையையும் காக்கிறது.
theological_decisions:
- issue: ஆசாரிய பலிச் சட்டங்களில் חַטָּאת என்பதன் பொருள்
  choice: பாவநிவாரணப் பலி
  alternative: தூய்மைப்படுத்தும் பலி
  rationale: இச்சூழலில் சொல் பலியைக் குறிக்கிறது. ‘பாவநிவாரணப் பலி’ பொது வாசகர்களுக்குப் புரியக்கூடிய வழக்கமான பலியியல் சொல்லாக உள்ளது; அதேவேளை தூய்மைப்படுத்தும் பரிமாணமும் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: பரிசுத்த இடத்திற்குள் கொண்டுவரப்படும் இரத்தத்தின் அளவு
  choice: இரத்தத்தில் ஒரு பகுதி
  alternative: அதன் இரத்தம்
  rationale: מִדָּמָהּ என்பதிலுள்ள מִן பகுதியைக் குறிக்கும் இயல்பை வெளிப்படுத்தி, முழு இரத்தமும் கொண்டுவரப்பட்டது என்ற தவறான எண்ணத்தைத் தவிர்க்கிறது.
- issue: כפר என்பதன் மொழிபெயர்ப்பு
  choice: பாவநிவிர்த்தி செய்வது
  alternative: தூய்மைப்படுத்துவது
  rationale: பலியியல் செயலை அதன் இறையியல் பதற்றத்தோடு காக்கிறது; அது எவ்வாறு செயல்படுகிறது என்பதைக் குறித்த ஒரு தனிப்பட்ட கோட்பாட்டை மொழிபெயர்ப்பில் புகுத்தவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், dignified ஆனால் பொதுவாசகருக்குப் புரியும் பலியியல் நடையைக் கடைப்பிடிக்கிறது. ‘எந்த ... ஓ, அந்த ...’ அமைப்பு எபிரெயச் சட்ட வாக்கியத்தின் வரம்பையும் தொடர்பையும் தமிழில் இயல்பாக வழங்குகிறது.
