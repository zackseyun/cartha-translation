base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ta
  text: 'யாவே மோசேயிடம் பேசினார்:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பேசிச் சொன்னார்
  rationale: דבר என்பதன் ‘பேசுதல்’ என்ற நுணுக்கத்தையும், அடுத்து வரும் לאמר உடன் அமைந்த எபிரெய உரையறிமுகச் சூத்திரத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது. தொடக்க וַ என்பது தொடர்ச்சியை உணர்த்தினாலும், தமிழில் தனியே ‘மேலும்’ என்று சேர்ப்பது இங்கு இயல்பற்றதாக இருக்கும்.
- source_word: יְהוָה
  choice: யாவே
  rationale: தேவப்பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பாகத் தருகிறது.
- source_word: אֶל
  choice: -யிடம்
  rationale: பேச்சு நோக்கிச் செலுத்தப்பட்ட நபரைச் சுட்டும் எபிரெய முன்னிடைச்சொல்லுக்கு இயல்பான தமிழ் வேற்றுமை வடிவம்.
- source_word: מֹשֶׁה
  choice: மோசே
  rationale: இப்பெயரின் நவீனத் தமிழில் நிலைபெற்ற வடிவம்.
- source_word: לֵאמֹר
  choice: சொன்னார்
  rationale: அடுத்து வரும் நேரடிக் கூற்றை அறிமுகப்படுத்தும் எபிரெயச் சூத்திரத்தை ‘பேசிச் சொன்னார்’ என்ற இயல்பான தமிழ் இணைப்பில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற தேவப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பட்டமல்ல, தேவனுடைய தனிப்பெயரான יהוה நேரடியாக உள்ளது. ஆகவே அதன் தனிப்பெயர் இயல்பைப் பாதுகாக்க ‘யாவே’ என ஒலிபெயர்க்கப்படுகிறது; பாரம்பரிய மாற்றீடு அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீன, கண்ணியமான பொதுத்தமிழ். எபிரெய உரையறிமுகச் சூத்திரம் தமிழில் இயல்பாக இருக்க ‘பேசிச் சொன்னார்’ என வழங்கப்பட்டு, அடுத்து வரும் நேரடிப் பேச்சைக் குறிக்க முக்காற்புள்ளி பயன்படுத்தப்பட்டுள்ளது.
