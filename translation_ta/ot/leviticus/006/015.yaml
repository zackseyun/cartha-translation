base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/015.yaml
  text: 'And the anointed priest from among his sons[a], who succeeds him, shall prepare it[c][b]. It is a permanent statute for Yahweh: it shall be completely turned into smoke.'
translation:
  language: ta
  text: அவனுக்குப் பின், அவனுடைய மகன்களில் அபிஷேகம் செய்யப்பட்ட ஆசாரியன்[a] அதைத் தயாரிக்க வேண்டும். இது ஆண்டவருக்குரிய நிரந்தர விதி[b]; அது முழுவதும் புகையாக எழச் செய்யப்பட வேண்டும்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவனுக்குப் பின்’ என்பதை ‘அவனுடைய இடத்தில்’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயத்தில் சொல்லுக்குச் சொல், ‘அவனுக்குக் கீழ்.’
    reason: lexical_alternative
  - marker: b
    text: ‘நிரந்தர விதி’ என்பதை ‘என்றென்றும் நிலைக்கும் நியமம்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: சொல்லுக்குச் சொல், ‘அது முழுவதுமாகப் புகையாக எழச் செய்யப்பட வேண்டும்’; அதாவது, அந்தக் காணிக்கை பலிபீடத்தில் முழுவதும் எரிக்கப்பட வேண்டும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּהֵן הַמָּשִׁיחַ
  choice: அபிஷேகம் செய்யப்பட்ட ஆசாரியன்
  rationale: ஆசாரியப் பதவிக்காக எண்ணெயால் அபிஷேகம் செய்யப்பட்டவரைக் குறிக்கும் வழிபாட்டுச் சூழலைப் பாதுகாக்கிறது; இங்கு இது மேசியாவைக் குறிக்கும் பட்டம் அல்ல.
- source_word: תַּחְתָּיו מִבָּנָיו
  choice: அவனுடைய மகன்களில், அவனுக்குப் பின் பொறுப்பேற்கும்படி
  rationale: מִבָּנָיו என்பதிலுள்ள ஆண் வழித்தோன்றல் மொழியையும், תַּחְתָּיו என்பதன் ‘அவனுடைய இடத்தில்/அவனுக்குப் பின்’ என்ற பதவிவழித் தொடர்ச்சிப் பொருளையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: יַעֲשֶׂה אֹתָהּ
  choice: அதைத் தயாரிக்க வேண்டும்
  rationale: עָשָׂה என்பதன் பரந்த ‘செய்/உருவாக்கு’ பொருளை, பலிச்சடங்கின் சூழலில் அளவுக்கு மீறி விவரிக்காமல் ‘தயாரிக்க’ என்று வழங்குகிறது.
- source_word: חָק עוֹלָם
  choice: நிரந்தர நியமம்
  rationale: தொடர்ந்து நிலைத்திருக்கும் கட்டளையின் சட்டத் தன்மையை நவீன, புரிந்துகொள்ளத்தக்க தமிழில் வெளிப்படுத்துகிறது.
- source_word: לַיהוָה
  choice: ஆண்டவருக்கான
  rationale: יהוה என்ற திருப்பெயரை மரியாதை மரபின்படி ‘ஆண்டவர்’ என வழங்கி, לְ முன்னிடைச்சொல்லின் அர்ப்பணிப்பு/சார்பு பொருளை ‘-க்கான’ எனக் காட்டுகிறது.
- source_word: כָּלִיל תָּקְטָר
  choice: முழுவதுமாகப் புகையாக எழும்பும்படி எரிக்கப்பட வேண்டும்
  rationale: כָּלִיל குறிக்கும் முழுமையையும், קטר என்பதன் பலிபீடத்தில் புகையாக எழச் செய்யும் சிறப்புப் பொருளையும் தெளிவான தமிழில் பாதுகாக்கிறது.
theological_decisions:
- issue: ‘அபிஷேகம் செய்யப்பட்ட ஆசாரியன்’ என்பவரின் அடையாளம்
  choice: முன்னிருந்த ஆசாரியனுக்குப் பின் அவனுடைய மகன்களில் இருந்து பதவியேற்கும் அபிஷேகம் செய்யப்பட்ட ஆசாரியன்
  alternative: அபிஷேகம் செய்யப்பட்ட எந்த ஆசாரியனும்; அல்லது மேசியாவைக் குறிக்கும் பட்டம்
  rationale: லேவிய வழிபாட்டுச் சூழலும், ‘அவனுடைய மகன்களில், அவனுக்குப் பின்’ என்ற தொடரும் பரம்பரை வழியாகத் தொடரும் ஆசாரியப் பதவியையே சுட்டுகின்றன; மேசியா குறித்த வாசிப்பை உரைக்குள் இறக்குமதி செய்யவில்லை.
- issue: יהוה என்ற திருப்பெயரின் மொழிபெயர்ப்பு
  choice: ஆண்டவர்
  alternative: யாவே; யெகோவா
  rationale: திருப்பெயரை நேரடியாக ஒலிபெயர்க்காமல் மரியாதைப் பட்டத்தால் வழங்கும் பரவலான வேதாகம மரபைப் பின்பற்றுகிறது; அதேவேளையில் மூலத்தில் יהוה இருப்பது lexical குறிப்பில் வெளிப்படையாகப் பதிவு செய்யப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமான ஆனால் பொதுவாசகருக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘அபிஷேகம்’ மற்றும் ‘ஆசாரியன்’ ஆகிய நிலைபெற்ற வேதாகமச் சொற்கள் துல்லியத்திற்காக வைக்கப்பட்டுள்ளன; சிக்கலான எபிரெய சொற்றொடர்கள் இயல்பான தமிழ் வாக்கிய அமைப்பில் வழங்கப்பட்டுள்ளன.
