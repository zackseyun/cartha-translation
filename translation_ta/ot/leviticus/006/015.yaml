revisions:
- from: அவனுடைய மகன்களில், அவனுக்குப் பின் பொறுப்பேற்கும்படி அபிஷேகம் செய்யப்பட்ட ஆசாரியன்[a] அதைத் தயாரிக்க வேண்டும். இது ஆண்டவருக்கான நிரந்தர நியமம்[b]; அது முழுவதுமாகப் புகையாக எழும்பும்படி எரிக்கப்பட வேண்டும்[c].
  to: அவனுக்குப் பின், அவனுடைய மகன்களில் அபிஷேகம் செய்யப்பட்ட ஆசாரியன்[a] அதைத் தயாரிக்க வேண்டும். இது ஆண்டவருக்குரிய நிரந்தர விதி[b]; அது முழுவதும் புகையாக எழச் செய்யப்பட வேண்டும்[c].
  rationale: The revision keeps the Hebrew sequence of ideas and its cultic terminology while making the succession clause idiomatic in modern standard Tamil. It also corrects the erroneous noun in footnote c and expresses the total smoke-offering action without reducing it to generic burning.
