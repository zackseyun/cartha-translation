    text: எபிரெய மூலத்தில் ‘அபிஷேகம் செய்யப்படும்’ என்பதுடன் தொடர்புடைய சுட்டுப்பெயர் ஒருமையாக உள்ளது; ஆனால் வசனத்தின் தொடக்கத்தில் ‘ஆரோனும் அவன் மகன்களும்’ என்று கூறப்பட்டுள்ளது. இது ஆரோனைக் குறிப்பாகவோ, அபிஷேகம் பெறும் ஒவ்வொரு ஆசாரியனையும் பிரதிநிதித்துவமாகவோ குறிக்கலாம்.
