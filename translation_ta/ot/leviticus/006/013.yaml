reference: Leviticus 6:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: זֶ֡ה קָרְבַּן֩ אַהֲרֹ֨ן וּ/בָנָ֜י/ו אֲשֶׁר יַקְרִ֣יבוּ לַֽ/יהוָ֗ה בְּ/יוֹם֙ הִמָּשַׁ֣ח אֹת֔/וֹ עֲשִׂירִ֨ת הָ/אֵפָ֥ה סֹ֛לֶת מִנְחָ֖ה תָּמִ֑יד מַחֲצִיתָ֣/הּ בַּ/בֹּ֔קֶר וּ/מַחֲצִיתָ֖/הּ בָּ/עָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/013.yaml
  text: 'This is the offering of Aaron and his sons[a], which they shall present to Yahweh on the day he is anointed: a tenth of an ephah of fine flour as a regular grain offering, half of it in the morning and half of it in the evening.'
translation:
  language: ta
  text: 'ஆரோனும் அவன் மகன்களும் யாவேக்குச் செலுத்த வேண்டிய காணிக்கை இதுவே: அவன் அபிஷேகம் செய்யப்படும் நாளில், ஒரு எப்பாவில் பத்தில் ஒரு பங்கு நுண்ணிய மாவை வழக்கமான தானியக் காணிக்கையாகச் செலுத்த வேண்டும்; அதில் பாதியைக் காலையிலும் பாதியை மாலையிலும் செலுத்த வேண்டும்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קָרְבַּן
  choice: காணிக்கை
  rationale: பலியிடும் சூழலில் கடவுளுக்குச் செலுத்தப்படும் பொருளைக் குறிக்கும் பரந்த சொல்; நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: יַקְרִיבוּ
  choice: செலுத்த வேண்டும்
  rationale: ஹிஃபில் வடிவம் பலி அல்லது காணிக்கையை ஆண்டவரின் முன்னிலையில் கொண்டுவந்து அர்ப்பணிப்பதைக் குறிக்கிறது; சட்டவிதியின் கட்டாயத் தன்மையையும் இச்சொற்றொடர் வெளிப்படுத்துகிறது.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: மூலத்தில் உள்ள இறைபெயர் יהוה என்பதை மறைக்காமல் தமிழில் ஒலிபெயர்த்துள்ளது.
- source_word: בְּיוֹם הִמָּשַׁח אֹתוֹ
  choice: அவன் அபிஷேகம் செய்யப்படும் நாளில்
  rationale: காலத்தைக் குறிக்கும் ‘நாளில்’ என்பதையும் எபிரெய மூலத்தின் ஒருமை ஆண்பால் சுட்டுப்பெயரையும் பாதுகாக்கிறது.
- source_word: עֲשִׂירִת הָאֵפָה
  choice: ஒரு எப்பாவில் பத்தில் ஒரு பங்கு
  rationale: அளவின் பெயரையும் அதன் துல்லியமான விகிதத்தையும் நேரடியாகக் கொடுக்கிறது.
- source_word: סֹלֶת
  choice: நைசான மாவு
  rationale: தானியக் காணிக்கைக்குப் பயன்படுத்தப்பட்ட நன்றாகச் சலிக்கப்பட்ட உயர்தர மாவைக் குறிக்கும் வழக்கமான, சுருக்கமான தமிழ் இணைச்சொல்.
- source_word: מִנְחָה
  choice: தானியக் காணிக்கை
  rationale: லேவியராகமத்தின் பலிச்சூழலில் தானியத்தால் செய்யப்படும் குறிப்பிட்ட காணிக்கை வகையைக் தெளிவுபடுத்துகிறது.
- source_word: תָּמִיד
  choice: வழக்கமான
  rationale: இடைவிடாத செயலைவிட ஒழுங்காகத் தொடர்ந்து செலுத்தப்படுவதை இச்சூழலில் குறிக்கிறது.
- source_word: מַחֲצִיתָהּ ... וּמַחֲצִיתָהּ
  choice: அதில் பாதியை ... பாதியை
  rationale: காணிக்கை இரண்டு சமப் பகுதிகளாகப் பிரிக்கப்படுவதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בַּבֹּקֶר ... בָּעָרֶב
  choice: காலையிலும் ... மாலையிலும்
  rationale: இரு நேரங்களையும் இணையான, இயல்பான தமிழ்த் தொடரில் தருகிறது.
theological_decisions:
- issue: ‘ஆரோனும் அவன் மகன்களும்’ என்ற பன்மைத் தொடருக்குப் பின் அபிஷேகம் பெறுபவரைக் குறிக்கும் ஒருமைச் சுட்டுப்பெயர் வருதல்
  choice: மூலத்தின் ஒருமையை ‘அவன்’ என்று தக்கவைத்தல்
  alternative: பொருளை விரித்து ‘அவர்கள் அபிஷேகம் செய்யப்படும் நாளில்’ என்று பன்மையாக்குதல்
  rationale: மசோரா மூலத்தில் אֹתוֹ என்பது ஒருமை ஆண்பால். அது ஆரோனை அல்லது ஒவ்வொரு அபிஷேகம் பெற்ற ஆசாரியனையும் பிரதிநிதித்துவ முறையில் குறிக்கக்கூடும்; மொழிபெயர்ப்பு இந்தத் தெளிவின்மையைத் தீர்மானித்து விடாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டவிதிக்குரிய கண்ணியத்தையும் தெளிவையும் காக்கும் நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் மீளுரைப்பை அளவோடு தக்கவைத்து, தமிழில் இயல்பாக வாசிக்க அரைப்புள்ளி பயன்படுத்தப்பட்டுள்ளது.
