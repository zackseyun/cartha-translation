  text: וְ/הָ/אֵ֨שׁ עַל הַ/מִּזְבֵּ֤חַ תּֽוּקַד בּ/וֹ֙ לֹ֣א תִכְבֶּ֔ה וּ/בִעֵ֨ר עָלֶ֧י/הָ הַ/כֹּהֵ֛ן עֵצִ֖ים בַּ/בֹּ֣קֶר בַּ/בֹּ֑קֶר וְ/עָרַ֤ךְ עָלֶ֨י/הָ֙ הָֽ/עֹלָ֔ה וְ/הִקְטִ֥יר עָלֶ֖י/הָ חֶלְבֵ֥י הַ/שְּׁלָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/005.yaml
  text: And the fire on the altar shall be kept burning on it[a]; it shall not go out. The priest shall burn wood on it every morning[b], and he shall arrange the burnt offering on it and burn up on it the fat portions of the peace offerings.
translation:
  language: ta
  text: பலிபீடத்தின் மேல் நெருப்பு தொடர்ந்து எரியவைக்கப்பட வேண்டும்; அது அணைந்துபோகக் கூடாது. ஆசாரியன் காலைதோறும்[a] அதன்மேல் விறகைப் போட்டு எரிக்க வேண்டும். பின்பு அதன்மேல் தகனபலியை ஒழுங்காக அடுக்கி, சமாதானப் பலிகளின்[b] கொழுப்புப் பகுதிகளை அதன்மேல் எரித்துப் புகையெழச் செய்ய வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘காலையில், காலையில்’ என்று இருமுறை வருகிறது; இது ‘ஒவ்வொரு காலையிலும்’ என்ற பொருளைக் கொடுக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘நல்லுறவுப் பலிகள்’ அல்லது ‘நல்வாழ்வுப் பலிகள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוּקַד
  choice: தொடர்ந்து எரியவைக்கப்பட வேண்டும்
  rationale: இந்த ஹொஃபால் வடிவம் நெருப்பு வெறுமனே எரிவதை அல்ல, அது எரியும் நிலையில் தொடர்ந்து பராமரிக்கப்பட வேண்டியதைக் குறிக்கிறது.
- source_word: בּוֹ
  choice: அதன்மேல்
  rationale: இது பலிபீடத்தைக் குறிப்பதால், பலியிடும் சூழலில் ‘அதன்மேல்’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: לֹא תִכְבֶּה
  choice: அது அணைந்துபோகக் கூடாது
  rationale: பலிபீட நெருப்பு இடைவிடாமல் எரிய வேண்டிய கட்டளையை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: וּבִעֵר
  choice: விறகைப் போட்டு எரிக்க வேண்டும்
  rationale: ஆசாரியன் புதிய நெருப்பை மூட்டுவதைவிட, விறகு சேர்த்து ஏற்கெனவே உள்ள நெருப்பைப் பராமரிப்பதே சூழலின் பொருள்.
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: காலைதோறும்
  rationale: ‘காலை’ என்ற சொல்லின் எபிரெய இரட்டிப்பு தினந்தோறும் நிகழும் பகிர்நிலைப் பொருளைக் கொண்டுள்ளது.
- source_word: וְעָרַךְ
  choice: ஒழுங்காக அடுக்கி
  rationale: பலியை பலிபீடத்தின் மேல் உரிய வரிசையில் வைக்கும் சடங்குச் செயலைத் தெளிவாகக் காட்டுகிறது.
- source_word: הָעֹלָה
  choice: தகனபலி
  rationale: முழுவதும் எரிக்கப்படும் இந்தப் பலிவகைக்கான அறியப்பட்ட தமிழ் வேதாகமச் சொல்; பலியின் வகையைச் சுருக்கமாக அடையாளப்படுத்துகிறது.
- source_word: וְהִקְטִיר
  choice: எரித்துப் புகையெழச் செய்ய வேண்டும்
  rationale: கிதாரின் ஹிஃபில் வடிவம் பலிபீடத்தில் பலிப்பொருளைப் புகையாக மேலெழச் செய்வதைச் சுட்டுகிறது; மொழிபெயர்ப்பு எரித்தல் மற்றும் புகையெழுதல் ஆகிய இரு நுணுக்கங்களையும் காக்கிறது.
- source_word: חֶלְבֵי
  choice: கொழுப்புப் பகுதிகள்
  rationale: இது பொதுவாகச் ‘சிறந்த பகுதிகளை’ அல்ல, பலியின்போது எரிப்பதற்கென ஒதுக்கப்பட்ட கொழுப்புப் பகுதிகளையே குறிக்கிறது.
- source_word: הַשְּׁלָמִים
  choice: சமாதானப் பலிகள்
  rationale: இந்தப் பலிவகைக்கான பரவலாக அறியப்பட்ட பெயரைப் பயன்படுத்துகிறது; அதன் நல்லுறவு அல்லது நல்வாழ்வு சார்ந்த பொருள் அடிக்குறிப்பில் மாற்றாகக் கொடுக்கப்படுகிறது.
theological_decisions:
- issue: பலியியல் சொற்களை மொழிபெயர்த்தல்
  choice: ‘தகனபலி’, ‘சமாதானப் பலிகள்’ என்ற நிலைபெற்ற பலியியல் சொற்களைப் பயன்படுத்தி, சடங்குச் செயல்களை வெளிப்படையாகக் கூறுதல்
  alternative: ‘மேலேறும் பலி’, ‘நல்லுறவுப் பலிகள்’ அல்லது ‘நல்வாழ்வுப் பலிகள்’ போன்ற சொற்பிறப்பை நெருக்கமாகப் பின்பற்றும் பெயர்களைப் பயன்படுத்துதல்
  rationale: இது சடங்கு சார்ந்த சட்ட அறிவுரை. ஆகவே பலிவகைகள் எளிதில் அடையாளம் காணப்பட வேண்டும்; அதேவேளையில் மாற்றுப் பொருள் சாத்தியங்களை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்ட மற்றும் சடங்கு உரைக்கேற்ற கண்ணியமான கட்டளைநடை பயன்படுத்தப்பட்டுள்ளது. ‘எரியவைக்கப்பட வேண்டும்’ என்பது நெருப்பைத் தொடர்ந்து பராமரிக்கும் கடமையையும், ‘எரித்துப் புகையெழச் செய்ய வேண்டும்’ என்பது பலியைப் புகையாக மேலெழச் செய்யும் சடங்குச் செயலையும் வெளிப்படுத்துகிறது. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்களுக்குப் பின்பே வைக்கப்பட்டுள்ளன.
