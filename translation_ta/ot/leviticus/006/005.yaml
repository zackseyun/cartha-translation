  naturalness: ‘பலிபீடத்தின் மேல் நெருப்பு அதன்மேல்’ என்ற தொடர் நவீன தமிழில் சற்றே மீளுரையாகவும் தடைபட்டதாகவும் ஒலிக்கிறது. ‘பலிபீடத்தின் மேல் நெருப்பு தொடர்ந்து எரியவைக்கப்பட வேண்டும்’ என்பது அதே கட்டளையையும் தொடர்ச்சியான பராமரிப்பு உணர்வையும் இயல்பாகத் தருகிறது. பிற சொற்றொடர்கள் சட்ட/சடங்கு நடைக்கு ஏற்றவை.
