base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/016.yaml
  text: And every grain offering of a priest shall be wholly burned[a]; it shall not be eaten.
translation:
  language: ta
  text: ஆசாரியனின் ஒவ்வொரு தானியப் படையலும் முழுவதுமாக எரிக்கப்பட வேண்டும்[a]; அதை உண்ணக் கூடாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “முழுமையான படையலாக இருக்க வேண்டும்.” எபிரெயச் சொல் படையல் முழுவதுமாக அல்லது குறைவின்றி இருப்பதைக் குறிக்கலாம்; இங்கு அது உண்ணப்படாமல் பலிபீடத்தில் முழுவதும் ஒப்படைக்கப்படுவதை நடைமுறையில் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל
  choice: ஒவ்வொரு
  rationale: וְ சட்டவிதிகளின் தொடர்ச்சியைச் சுட்டுகிறது; தமிழ் வாக்கியத் தொடரில் அது இயல்பாக வெளிப்படுவதால் தனியே ‘மேலும்’ சேர்க்கப்படவில்லை. כָּל இங்கு பகிர்ந்தளிக்கும் பொருளில் ‘ஒவ்வொரு’ என மொழிபெயர்க்கப்படுகிறது.
- source_word: מִנְחַת
  choice: தானியப் படையல்
  rationale: லேவியராகமத்தில் מִנְחָה என்பது பொதுவான காணிக்கையைக் காட்டிலும் தானியத்தால் செய்யப்படும் பலிவகைக்கான தொழில்நுட்பச் சொல்; ‘தானியப் படையல்’ அதைப் புரியத்தக்க வகையில் காட்டுகிறது.
- source_word: כֹּהֵן
  choice: ஆசாரியனின்
  rationale: מִנְחַת כֹּהֵן என்ற இணைப்பின் இயல்பான தமிழ் வடிவம் ‘ஆசாரியனின் ... படையல்’; எபிரெயத்தில் ஒருமை பொதுப்பொருளில் வருகிறது.
- source_word: כָּלִיל
  choice: முழுவதுமாக எரிக்கப்பட வேண்டும்
  rationale: כָּלִיל என்பது முழுமையானது அல்லது முற்றிலும் ஒப்படைக்கப்பட்டது என்பதைக் குறிக்கிறது; பலிச்சூழலிலும் அடுத்துள்ள ‘உண்ணக் கூடாது’ என்ற தடையிலும், பலிபீடத்தில் முழுவதும் எரிக்கப்படுதல் நடைமுறைப் பொருளாகிறது. எரித்தல் என்ற வினை எபிரெயத்தில் வெளிப்படையாக இல்லாததால் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: תִּהְיֶה
  choice: வேண்டும்
  rationale: சட்டப்பகுதியில் היה வினையின் imperfect வடிவம் கட்டாய விதியை வெளிப்படுத்துகிறது; ‘வேண்டும்’ நவீன தமிழில் இயல்பான சட்டநடையைத் தருகிறது.
- source_word: לֹא תֵאָכֵל
  choice: அதை உண்ணக் கூடாது
  rationale: Niphal வினையின் செயப்பாட்டு பொருளை இயல்பான தமிழ் தடைநடையில் வெளிப்படுத்துகிறது; படையலில் எதுவும் உண்ணப்படக் கூடாது என்பதே பொருள்.
