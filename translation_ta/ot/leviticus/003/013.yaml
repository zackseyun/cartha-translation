base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/013.yaml
  text: And he shall lay his hand on its head and slaughter it before the tent of meeting[a], and the sons of Aaron shall throw its blood against the altar all around.
translation:
  language: ta
  text: அவன் தன் கையை அதன் தலையின்மேல் வைத்து, சந்திப்புக் கூடாரத்திற்கு முன்பாக அதை அறுக்க வேண்டும். ஆரோனின் மகன்கள் அதன் இரத்தத்தைப் பலிபீடத்தின் எல்லாப் பக்கங்களிலும் தெறிக்க வேண்டும்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதன் இரத்தத்தைப் பலிபீடத்தின் எல்லாப் பக்கங்களிலும் வீச வேண்டும்.” பலிச்சடங்குச் சூழலில் எபிரெய வினை இரத்தத்தை வீசி இடுவதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָמַךְ אֶת יָדוֹ עַל רֹאשׁוֹ
  choice: தன் கையை அதன் தலையின்மேல் வைத்து
  rationale: பலியிடும் சூழலில் கையை விலங்கின் தலையின்மேல் வைக்கும் செயலை இயல்பான தமிழில் குறிக்கிறது; எபிரெய உரையிலுள்ள ஒருமை ‘கை’ பாதுகாக்கப்படுகிறது.
- source_word: וְשָׁחַט אֹתוֹ
  choice: அதை அறுக்க வேண்டும்
  rationale: שׁחט என்பது பலிக்கான சடங்குமுறை அறுப்பைக் குறிக்கும் வழக்கமான வினை; ‘கொல்ல’ என்பதைக் காட்டிலும் ‘அறுக்க’ அதன் குறிப்பான செயலைப் பாதுகாக்கிறது.
- source_word: לִפְנֵי אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரத்திற்கு முன்பாக
  rationale: கடவுளும் மக்களும் சந்திக்கும் வழிபாட்டுக் கூடாரத்திற்கான நிலையான, பொருள் தெளிவான பெயரையும் இடவுறவையும் வழங்குகிறது.
- source_word: וְזָרְקוּ
  choice: தெளிக்க வேண்டும்
  rationale: பலியிடும் சடங்கில் இரத்தத்தைப் பலிபீடத்தின் மீது வீசி இடும் செயலைத் தமிழில் இயல்பாகக் குறிக்கிறது; வேறு எபிரெய வினைகளாலும் ‘தெளித்தல்’ குறிக்கப்படலாம் என்பதால் செயல் சூழல் முக்கியம்.
- source_word: בְּנֵי אַהֲרֹן
  choice: ஆரோனின் மகன்கள்
  rationale: எபிரெயச் சேர்க்கை அமைப்பையும் ஆசாரியக் குழுவின் முறையான அடையாளத்தையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: אֶת דָּמוֹ
  choice: அதன் இரத்தத்தை
  rationale: பின்னொட்டு பலியிடப்படும் விலங்கைக் குறிக்கிறது; தமிழில் இயல்பான உடைமைத் தொடர்.
- source_word: עַל הַמִּזְבֵּחַ סָבִיב
  choice: பலிபீடத்தின் எல்லாப் பக்கங்களின்மேலும்
  rationale: இரத்தம் பலிபீடத்தைச் சுற்றியுள்ள பக்கங்களில் இடப்படுவதைக் காட்டும் סָבִיב என்பதன் பகிர்ந்தளிக்கும் வலிமையைத் தெளிவாக வெளிப்படுத்துகிறது.
