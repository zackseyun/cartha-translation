  source_fidelity: 'முதற் பகுதி எபிரெய உரையைத் துல்லியமாகப் பின்பற்றுகிறது: ஒருமைக் ‘கை,’ பலிவிலங்கின் ‘தலை,’ சடங்குமுறை அறுத்தல், சந்திப்புக்கூடாரத்திற்கு முன்பாக என்ற இடவுறவு ஆகியவை பாதுகாக்கப்பட்டுள்ளன. ஆனால் וְזָרְקוּ என்பது இரத்தத்தை வீசி/தெறிக்கச் செய்வதைக் குறிக்கிறது; ‘தெளிக்க’ என்பது வேறு எபிரெயச் சடங்கு வினையுடன் குழப்பமளிக்கக்கூடும். ஆகவே அந்த வினை திருத்தப்பட வேண்டும்.'
  naturalness: ‘தன் கையை அதன் தலையின்மேல் வைத்து’ மற்றும் ‘அதை அறுக்க வேண்டும்’ நவீனத் தரமான தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளன. ‘இரத்தத்தைப் பலிபீடத்தின் எல்லாப் பக்கங்களின்மேலும் தெளிக்க’ என்பதை ‘இரத்தத்தைப் பலிபீடத்தின் எல்லாப் பக்கங்களிலும் தெறிக்க’ என மாற்றுவது செயலைத் துல்லியமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
  terminology: ‘சந்திப்புக் கூடாரம்,’ ‘ஆரோனின் மகன்கள்,’ ‘பலிபீடம்’ ஆகியவை பொருத்தமான நிலையான சொல்லாட்சிகள். ‘தெறிக்க’ என்பது זָרַקின் வலிமையான வீசுதல்/பாய்ச்சுதல் என்ற பொருளை ‘தெளிக்க’ என்பதைக் காட்டிலும் நன்றாகக் காக்கிறது.
