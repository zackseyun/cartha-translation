  - marker: a
    text: 'எபிரேயத்தில்: YHWH என்ற இறைத்தனிப்பெயர்; ‘கர்த்தர்’ என்பது மரபுவழி வழங்கல்.'
    reason: יְהוָה என்ற இறைத்தனிப்பெயர் முதன்மை உரையில் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது; மரபுவழிப் பதிலீட்டைத் தெரிவிக்கிறது.
