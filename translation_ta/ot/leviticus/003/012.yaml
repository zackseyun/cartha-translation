  text: But if his offering is a goat[a], then he shall present it before Yahweh.
translation:
  language: ta
  text: ஆனால், அவனுடைய காணிக்கை ஒரு வெள்ளாடாக இருந்தால், அதை யாவேயின்[a] முன்னிலையில் சமர்ப்பிக்க வேண்டும்.
  philosophy: optimal-equivalence
