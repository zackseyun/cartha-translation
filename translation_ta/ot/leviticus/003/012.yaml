- source_word: יְהוָה
  choice: யெகோவா
  rationale: எபிரேய மெய்யெழுத்துப் பெயரான YHWH-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல் தமிழில் பரவலாக அறியப்படும் தனிப்பெயர் வடிவில் வழங்குகிறது; உச்சரிப்பு குறித்த மாற்று வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் பட்டப்பெயர் அல்ல, நான்கு மெய்யெழுத்துகளைக் கொண்ட இறைத்தனிப்பெயர் உள்ளது. அதனைத் தனிப்பெயராகவே முதன்மை உரையில் வைத்துள்ளோம்; ‘யாவே’ என்பது பரவலாக ஏற்கப்படும் மாற்று ஒலிபெயர்ப்பு என்பதால் அடிக்குறிப்பில் தரப்படுகிறது. ‘கர்த்தர்’ என்பது மரபுவழிப் பதிலீடு என்றாலும் மூலத்தின் தனிப்பெயர் இயல்பை மறைக்கக்கூடும்.
translation_notes:
  register: நவீன தரத் தமிழில், சட்ட/வழிபாட்டு அறிவுறுத்தலுக்கேற்ற கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘கொண்டுவந்து செலுத்த வேண்டும்’ என்பது மூலத்தின் சடங்குசார் ‘அருகில் கொண்டுவருதல்’ என்ற கருத்தையும் கட்டளை வலிமையையும் இயல்பாக வெளிப்படுத்துகிறது.
