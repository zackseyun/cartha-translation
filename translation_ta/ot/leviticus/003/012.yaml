  rationale: קָרְבָּן என்பது கொண்டுவந்து செலுத்தப்படும் காணிக்கைக்கான பொதுப்பெயர்; ‘பலி’ என்பதைவிட ‘காணிக்கை’ மூலச்சொல்லின் பரந்த பொருளைப் பாதுகாக்கிறது.
