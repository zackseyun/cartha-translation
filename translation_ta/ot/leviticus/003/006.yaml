source:
  edition: WLC
  text: וְ/אִם מִן הַ/צֹּ֧אן קָרְבָּנ֛/וֹ לְ/זֶ֥בַח שְׁלָמִ֖ים לַ/יהוָ֑ה זָכָר֙ א֣וֹ נְקֵבָ֔ה תָּמִ֖ים יַקְרִיבֶֽ/נּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/006.yaml
  text: And if his offering for a sacrifice of peace offerings to Yahweh is from the flock[a], male or female, he shall offer it without blemish.
translation:
  language: ta
  text: மேலும், அவனுடைய காணிக்கை யாவேவுக்கான சமாதானப் பலியாக ஆட்டு மந்தையிலிருந்து இருந்தால், அது ஆணாக இருந்தாலும் பெண்ணாக இருந்தாலும், குறைபாடற்றதாக அவன் அதைச் செலுத்த வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நல்லுறவுப் பலி.’ எபிரெயச் சொல் שְׁלָמִים பாரம்பரியமாக ‘சமாதானப் பலி’ என மொழிபெயர்க்கப்படுகிறது; பலியுணவைப் பகிர்வதன் மூலம் வெளிப்படும் நல்வாழ்வு அல்லது நல்லுறவையும் அது வலியுறுத்தலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: செலுத்தப்படுமானால்
  rationale: முந்தைய பலி விதிகளோடு தொடர்புடைய நிபந்தனையை இயல்பான தமிழில் வெளிப்படுத்துகிறது; தொடக்க வாவ் இணைப்பின் தொடர்ச்சியும் சூழலில் தெளிவாக உள்ளது.
- source_word: מִן הַצֹּאן
  choice: ஆட்டு மந்தையிலிருந்து
  rationale: צֹאן என்பது செம்மறியாடுகளையும் வெள்ளாடுகளையும் உள்ளடக்கும் சிறுகால்நடை மந்தையைக் குறிக்கிறது. ‘ஆட்டு மந்தை’ என்பது தமிழில் இயல்பாகவும் தேவையின்றி ஓர் இனத்தை மட்டும் வரையறுக்காமலும் உள்ளது.
- source_word: קָרְבָּנוֹ
  choice: அவனுடைய காணிக்கை
  rationale: קָרְבָּן என்பது கடவுளிடம் கொண்டுவந்து செலுத்தப்படும் காணிக்கைக்கான வழிபாட்டுச் சொல்; ஆண்பால் ஒருமை உடைமைப் பின்னொட்டும் பாதுகாக்கப்படுகிறது.
- source_word: לְזֶבַח שְׁלָמִים
  choice: சமாதானப் பலியாக
  rationale: זֶבַח என்பதன் பலியிடும் கருத்தையும் שְׁלָמִים என்ற தொழில்நுட்ப வழிபாட்டுச் சொல்லின் பாரம்பரிய ‘சமாதான’ தொடர்பையும் சுருக்கமாகப் பாதுகாக்கிறது; நல்லுறவு/கூட்டுறவு என்ற மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לַיהוָה
  choice: யாவேவுக்கான
  rationale: திருநாமமான יהוה என்பதை பொதுப்பட்டப் பெயரால் மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்த்து, லாமேத் குறிக்கும் அர்ப்பணிப்பை ‘-வுக்கான’ என வெளிப்படுத்துகிறது.
- source_word: זָכָר אוֹ נְקֵבָה
  choice: ஆணாக இருந்தாலும் பெண்ணாக இருந்தாலும்
  rationale: பலிக்குரிய விலங்கு ஆண் அல்லது பெண் எதுவாகவும் இருக்கலாம் என்ற மூலமொழியின் தெளிவான வேறுபாட்டை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: תָּמִים
  choice: பழுதற்ற
  rationale: பலியிடும் சூழலில் תָּמִים என்பது உடற்குறை அல்லது குறைபாடு இல்லாத விலங்கைக் குறிக்கிறது; ‘பழுதற்ற’ என்பது தெளிவான நவீனத் தமிழ்.
- source_word: יַקְרִיבֶנּוּ
  choice: ஒன்றை அவன் செலுத்த வேண்டும்
  rationale: קרב என்பதன் ஹிஃபில் வடிவம் வழிபாட்டில் காணிக்கையை முன்வைத்துச் செலுத்துவதைக் குறிக்கிறது; ‘ஒன்றை’ என்பது முன்னர் குறிப்பிடப்பட்ட ஆண் அல்லது பெண் விலங்கை இயல்பாகச் சுட்டுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைநாமத்தின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலவசனம் நான்கெழுத்துத் திருநாமத்தை நேரடியாகப் பயன்படுத்துவதால், பொதுப்பட்டப் பெயரால் மாற்றாமல் உடன்படிக்கைத் திருநாமத்தை ஒலிபெயர்க்கிறது.
- issue: שְׁלָמִים என்ற பலியின் பொருள்
  choice: சமாதானப் பலி
  alternative: நல்லுறவுப் பலி
  rationale: இச்சொல் சமாதானம், நல்வாழ்வு, பகிரப்பட்ட பலியுணவு சார்ந்த நல்லுறவு ஆகிய கருத்துகளைத் தாங்கக்கூடும். முதன்மை உரையில் பாரம்பரிய தொழில்நுட்பப் பெயர் வைக்கப்பட்டு, பொருளின் விரிவை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வழிபாட்டு நடையில் வடிவமைக்கப்பட்டது. எபிரெயச் சொல் வரிசையின் முக்கிய கூறுகள் பாதுகாக்கப்பட்டுள்ளன; அதே நேரத்தில் தமிழ் வாக்கிய ஓட்டத்திற்காக நிபந்தனை முடிவு இயல்பான இடத்தில் வைக்கப்பட்டுள்ளது.
