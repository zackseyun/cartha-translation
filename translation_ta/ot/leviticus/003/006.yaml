revisions:
- from: அவனுடைய காணிக்கை யாவேவுக்கான சமாதானப் பலியாக[a] ஆட்டு மந்தையிலிருந்து செலுத்தப்படுமானால், ஆணாக இருந்தாலும் பெண்ணாக இருந்தாலும், பழுதற்ற ஒன்றை அவன் செலுத்த வேண்டும்.
  to: மேலும், அவனுடைய காணிக்கை யாவேவுக்கான சமாதானப் பலியாக ஆட்டு மந்தையிலிருந்து இருந்தால், அது ஆணாக இருந்தாலும் பெண்ணாக இருந்தாலும், குறைபாடற்றதாக அவன் அதைச் செலுத்த வேண்டும்.[a]
