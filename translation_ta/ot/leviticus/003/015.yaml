translation_notes:
  register: நவீனச் செந்தரத் தமிழில், பலிச் சட்டத்திற்கேற்ற கண்ணியமான அறிவுறுத்தல் நடை பயன்படுத்தப்பட்டுள்ளது. உடற்கூற்றுச் சொற்கள் சாதாரண வாசகருக்குப் புரியுமாறு வைக்கப்பட்டுள்ளன; உறுதியற்ற எபிரெயச் சொல்லின் துல்லியம் மிகைப்படுத்தப்படவில்லை. ஆங்கில ஆலோசனைப் பிரதியில் [a] குறி ‘kidneys’ என்பதற்குப் பின் தோன்றினாலும் அதன் அடிக்குறிப்பு יֹתֶרֶת என்பதையே விளக்குவதால், தமிழில் அது ‘நீட்சி’ என்பதற்குப் பின் பொருத்தப்பட்டுள்ளது.
