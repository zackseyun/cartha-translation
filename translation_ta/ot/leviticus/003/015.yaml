base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/015.yaml
  text: and the two kidneys[a], and the fat that is on them, which is on the loins, and the appendage on the liver, with the kidneys[b], he shall remove.
translation:
  language: ta
  text: இரண்டு சிறுநீரகங்களையும், அவற்றின் மேலே இடுப்புப் பகுதியில் உள்ள கொழுப்பையும், கல்லீரலின் மேலுள்ள நீட்சியையும்[a] சிறுநீரகங்களோடு சேர்த்து[b] அவன் அகற்ற வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கல்லீரலின் மடல்’ என்றும் மொழிபெயர்க்கலாம். இந்த உடற்பகுதியைக் குறிக்கும் எபிரெயச் சொல் (יֹתֶרֶת) துல்லியமாக எதைச் சுட்டுகிறது என்பது உறுதியற்றது; ஆகவே மூலவசனத்தின் தெளிவின்மையைத் தக்கவைக்க முதன்மைப் பிரதியில் ‘நீட்சி’ பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: எழுத்துப்படி, ‘சிறுநீரகங்களின் மேல்.’ இங்கு அந்தப் பகுதியைச் சிறுநீரகங்களோடு சேர்த்து அகற்ற வேண்டும் என்பதே கருத்தாக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: இரண்டு சிறுநீரகங்களையும்
  rationale: பலியிடப்படும் விலங்கின் உடற்கூற்றைக் குறிக்கும் כְּלָיָה என்பது தெளிவாகச் ‘சிறுநீரகம்’ எனப் பொருள்படும்; இருமை வடிவம் ‘இரண்டு’ என்று இயல்பாக வெளிப்படுத்தப்பட்டது.
- source_word: הַחֵלֶב
  choice: கொழுப்பையும்
  rationale: லேவியராகமத்தின் பலிச் சடங்குச் சூழலில் חֵלֶב பலியாகப் பிரித்தெடுக்கப்படும் கொழுப்புப் பகுதியைக் குறிக்கிறது; நவீனத் தமிழில் ‘கொழுப்பு’ தெளிவானதும் இயல்பானதும் ஆகும்.
- source_word: אֲשֶׁר עֲלֵהֶן אֲשֶׁר עַל הַכְּסָלִים
  choice: அவற்றின் மேலே இடுப்புப் பகுதியில் உள்ள
  rationale: சிறுநீரகங்களின் மேலுள்ள கொழுப்பு இடுப்பு அல்லது பக்கவாட்டுப் பகுதியில் இருப்பதை இரு தொடர்புச் சொற்றொடர்களும் விளக்குகின்றன; தமிழில் தேவையற்ற மறுபடியுரைத்தலைத் தவிர்த்து உறவைத் தெளிவாக வைத்திருக்கிறது.
- source_word: הַיֹּתֶרֶת
  choice: நீட்சி
  rationale: இந்த உடற்கூற்றுச் சொல்லின் துல்லியமான நவீன அடையாளம் உறுதியற்றது. ‘நீட்சி’ என்பது கல்லீரலுடன் தொடர்புடைய புடைத்த அல்லது இணைந்த பகுதியைச் சுட்டுகிறது; குறிப்பிட்ட ‘மடல்’ எனத் தீர்மானிப்பதைத் தவிர்க்கிறது.
- source_word: עַל הַכָּבֵד
  choice: கல்லீரலின் மேலுள்ள
  rationale: עַל என்பதன் நேரடியான இடவியல் பொருளை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: עַל הַכְּלָיֹת
  choice: சிறுநீரகங்களோடு சேர்த்து
  rationale: எழுத்துப்படியான ‘சிறுநீரகங்களின் மேல்’ என்பதைக் காட்டிலும், பலிச் சடங்கின் செயன்முறைச் சூழலில் அந்தப் பகுதி சிறுநீரகங்களுடன் அகற்றப்படுவதைக் குறிக்கும் இயல்பான தமிழ். எழுத்துப்படியான வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: יְסִירֶנָּה
  choice: அவன் அகற்ற வேண்டும்
  rationale: סור என்பதன் ஹிஃபில் வடிவம் இங்கு அகற்றுதலைக் குறிக்கிறது. எபிரெயச் சட்டவழக்கின் கட்டளையுணர்வை ‘வேண்டும்’ வெளிப்படுத்துகிறது; ஒருமை ஆண்பால் செய்பவர் ‘அவன்’ எனத் தக்கவைக்கப்பட்டார்.
