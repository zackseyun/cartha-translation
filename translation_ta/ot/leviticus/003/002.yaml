base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/002.yaml
  text: He shall lay his hand on the head of his offering and slaughter it at the entrance of the tent of meeting[a], and Aaron’s sons, the priests[b], shall throw the blood against the altar all around.
translation:
  language: ta
  text: அவன் தன் காணிக்கையின் தலையின்மேல் தன் கையை வைத்து, சந்திப்புக் கூடாரத்தின் நுழைவிடத்தில்[a] அதை அறுக்க வேண்டும். ஆரோனின் மகன்களான ஆசாரியர்கள் அந்த இரத்தத்தைப் பலிபீடத்தின் எல்லாப் பக்கங்களிலும் வீச வேண்டும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சந்திப்புக் கூடாரத்தின் வாசலில்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அந்த இரத்தத்தைப் பலிபீடத்தின் எல்லாப் பக்கங்களிலும் எறிய வேண்டும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָמַךְ
  choice: வைத்து
  rationale: பலியிடும் சடங்கில் விலங்கின் தலையின்மேல் கையை வைப்பதை இயல்பாகக் குறிக்கிறது; அழுத்துதல் என்ற சாத்தியமான நுணுக்கத்தைத் தேவையின்றி மிகைப்படுத்தவில்லை.
- source_word: יָדוֹ
  choice: தன் கையை
  rationale: மூலத்தில் ஒருமை பெயர்ச்சொல்லும் மூன்றாம் நபர் ஆண்பால் ஒருமை உரிமை விகுதியும் உள்ளதால், காணிக்கை செலுத்துபவனின் ஒரு கை என நேரடியாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: רֹאשׁ קָרְבָּנוֹ
  choice: தன் காணிக்கையின் தலையின்மேல்
  rationale: קָרְבָּן என்பது கடவுளிடம் கொண்டுவரப்படும் காணிக்கைக்கான பொதுச் சொல்; விலங்கின் தலை என்ற உடற்கூற்று குறிப்பும் அப்படியே காக்கப்பட்டுள்ளது.
- source_word: וּשְׁחָטוֹ
  choice: அதை அறுக்க வேண்டும்
  rationale: שׁחט பலிக்குரிய விலங்கைச் சடங்குமுறையில் அறுப்பதைக் குறிக்கிறது; பொதுவான ‘கொல்லுதல்’ என்பதைக் காட்டிலும் ‘அறுத்தல்’ இச்சூழலுக்கு துல்லியமானது.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரத்தின் நுழைவிடத்தில்
  rationale: פֶּתַח என்பதன் திறப்பு/நுழைவு என்ற பொருளையும், אֹהֶל מוֹעֵד என்பதன் கூடார அமைப்பையும் காக்கும் இயல்பான நவீனத் தமிழ்.
- source_word: בְּנֵי אַהֲרֹן הַכֹּהֲנִים
  choice: ஆசாரியர்களான ஆரோனின் மகன்கள்
  rationale: ஆரோனின் மகன்களை ஆசாரியர்கள் என்று அடையாளப்படுத்தும் எபிரெய ஒட்டுநிலைத் தொடரைத் தெளிவாகக் காக்கிறது.
- source_word: וְזָרְקוּ
  choice: வீச வேண்டும்
  rationale: זרק இங்கு இரத்தத்தைப் பலிபீடத்தின்மீது எறிந்து/வீசி இடும் செயலைக் குறிக்கிறது. வேறொரு சடங்கு முறையை உணர்த்தக்கூடிய ‘தூவுதல்’ என்பதை முதன்மை உரையில் தவிர்க்கிறது.
- source_word: עַל הַמִּזְבֵּחַ סָבִיב
  choice: பலிபீடத்தின் மீது சுற்றிலும்
  rationale: עַל என்பதன் பலிபீடத்தின் மீது/அதற்கு எதிராக என்ற தொடர்பையும், סָבִיב என்பதன் சுற்றுப்புறப் பரப்பையும் சுருக்கமாகக் காக்கிறது.
theological_decisions:
- issue: பலிபீடத்தில் இரத்தத்தைப் பயன்படுத்தும் சடங்கு நடவடிக்கை
  choice: அந்த இரத்தத்தைப் பலிபீடத்தின் மீது சுற்றிலும் வீச வேண்டும்
  alternative: அந்த இரத்தத்தைப் பலிபீடத்தின்மீது சுற்றிலும் தெளிக்க வேண்டும்
  rationale: זרק என்பதன் அடிப்படைச் செயல் வீசுதல் அல்லது எறிதல்; ‘தெளித்தல்’ வேறுபட்ட, அதிகச் சிறப்புடைய சடங்கு செயலை வாசகர் மனதில் உருவாக்கக்கூடும். எனவே சடங்கின் முறையைத் தேவையின்றி விளக்கித் தீர்மானிக்காமல் மூலச் சொல்லின் வலிமை காக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான சடங்கு மொழிநடை பயன்படுத்தப்பட்டுள்ளது. ‘சந்திப்புக் கூடாரம்,’ ‘காணிக்கை,’ ‘பலிபீடம்,’ ‘ஆசாரியர்’ ஆகியவை பொருளைத் தெளிவாகக் காக்கும் பரவலாக அறியப்பட்ட சொற்கள். எபிரெய வாக்கியத்தின் தொடர்ச்சி இயல்பான தமிழுக்காக இரண்டு வாக்கியங்களாக அமைக்கப்பட்டாலும், செயல்களின் வரிசையும் செய்பவர்களின் அடையாளமும் மாற்றப்படவில்லை.
