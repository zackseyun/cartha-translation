base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/001.yaml
  text: If his offering is a sacrifice of peace offerings[a], if he offers it from the herd, whether male or female[b], he shall offer it without blemish before Yahweh.
translation:
  language: ta
  text: அவனுடைய காணிக்கை சமாதானப் பலிகளின் பலியாக இருந்தால், அவன் மாட்டினத்திலிருந்து அதைச் செலுத்தினால், ஆணாகவோ பெண்ணாகவோ உள்ள குறையற்ற விலங்கை யாவேக்கு முன்பாகச் செலுத்த வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சமாதானப் பலிகளின் பலி’ என்பதற்கு ‘சமாதானப் பலி’ அல்லது ‘நல்லுறவுப் பலி’ என்றும் மொழிபெயர்க்கலாம். எபிரெயத்தில் சொல்லுக்கு சொல் ‘சமாதானப் பலிகளின் பலி’ என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶבַח שְׁלָמִים
  choice: சமாதானப் பலிகளின் பலி
  rationale: זֶבַח என்பதன் ‘பலி’ என்ற பொருளையும், שְׁלָמִים குறிக்கும் பலிவகையையும் வெளிப்படையாக வைத்திருக்கிறது. ‘சமாதானப் பலி’ என்பது மரபான, சொற்பொருள் சார்ந்த பெயர்; ‘உறவுப் பலி’ என்பது அதிக விளக்கத் தன்மை கொண்டது.
- source_word: קָרְבָּנוֹ
  choice: அவனுடைய காணிக்கை
  rationale: קָרְבָּן என்பது கடவுளிடம் கொண்டுவரப்படும் பொதுவான காணிக்கையைக் குறிக்கிறது; பலி சார்ந்த சூழலில் ‘காணிக்கை’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: מִן הַבָּקָר
  choice: மாட்டினத்திலிருந்து
  rationale: בָּקָר என்பது எருது, பசு உள்ளிட்ட மாட்டு இனத்தைக் குறிக்கிறது; ‘மாட்டினம்’ நவீன தமிழில் இயல்பாக இந்த வகையை உள்ளடக்குகிறது.
- source_word: מַקְרִיב / יַקְרִיבֶנּוּ
  choice: செலுத்தினால் / செலுத்த வேண்டும்
  rationale: קרב என்பதன் ஹிஃபில் வடிவம் பலி வழக்கில் ‘சமர்ப்பித்தல், செலுத்துதல்’ என்று பொருள்படும். ‘செலுத்து’ என்பது காணிக்கை மற்றும் பலி சூழலுக்கு ஏற்ற கண்ணியமான தமிழ் வழக்கு.
- source_word: אִם זָכָר אִם נְקֵבָה
  choice: ஆணாக இருந்தாலும் பெண்ணாக இருந்தாலும்
  rationale: இணையான אִם ... אִם அமைப்பு இரு பாலினங்களில் எதுவும் ஏற்கத்தக்கது என்பதைக் காட்டுகிறது; இந்தத் தமிழ் அமைப்பு அதை இயல்பாகப் பாதுகாக்கிறது.
- source_word: תָּמִים
  choice: பழுதற்றதாக
  rationale: பலிக்குரிய விலங்கில் குறைபாடு அல்லது ஊனம் இல்லாத நிலையை תָּמִים குறிக்கிறது; ‘பழுதற்ற’ என்பது தெளிவான, பொதுவாகப் புரியும் சொல்.
- source_word: לִפְנֵי יְהוָה
  choice: யாவேக்கு முன்பாக
  rationale: לִפְנֵי என்பது ‘முன்பாக/சந்நிதியில்’ என்றும், יהוה என்பது உடன்படிக்கைத் திருப்பெயரான யாவே என்றும் நேரடியாகக் கொடுக்கப்பட்டுள்ளது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் நான்கெழுத்து இறைப்பெயர் நேரடியாக உள்ளது. அதை பொதுப்பட்டமான ‘கர்த்தர்’ என்று மாற்றாமல், திருப்பெயராக ‘யாவே’ என்று எழுத்துப்பெயர்ப்பது மூலத்தின் தனித்தன்மையைப் பாதுகாக்கிறது.
- issue: שְׁלָמִים என்ற பலிவகையின் பெயர்
  choice: சமாதானப் பலிகள்
  alternative: நல்லுறவுப் பலிகள்; உறவுப் பலிகள்
  rationale: ‘சமாதானம்’ என்பது மரபானதும் எபிரெயச் சொல்லின் நலநிலை/முழுமை சார்ந்த பொருட்பரப்பைத் திறந்தவாறே வைப்பதும் ஆகும். ‘உறவு’ என்பது அதன் சமூகப் பரிமாணத்தை மட்டும் முன்னிறுத்தக்கூடிய விளக்க மொழிபெயர்ப்பு.
translation_notes:
  register: நவீனத் தரத் தமிழில், பலிச்சட்டத்திற்குரிய கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டது. எபிரெய வாக்கியத்தின் நிபந்தனை அமைப்பும், ஆண் அல்லது பெண் விலங்கு இரண்டுமே ஏற்கத்தக்கது என்பதும் பாதுகாக்கப்பட்டுள்ளன. பிரதான உரையில் உள்ள [a] குறி அடிக்குறிப்புடன் பொருந்துகிறது.
