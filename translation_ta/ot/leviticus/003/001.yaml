revisions:
- from: அவனுடைய காணிக்கை சமாதானப் பலிகளின் பலியாக இருந்து, அதை அவன் மாட்டினத்திலிருந்து செலுத்தினால், அது ஆணாக இருந்தாலும் பெண்ணாக இருந்தாலும், பழுதற்றதாக அதை யாவேக்கு முன்பாகச் செலுத்த வேண்டும்.[a]
  to: அவனுடைய காணிக்கை சமாதானப் பலிகளின் பலியாக இருந்தால், அவன் மாட்டினத்திலிருந்து அதைச் செலுத்தினால், ஆணாகவோ பெண்ணாகவோ உள்ள குறையற்ற விலங்கை யாவேக்கு முன்பாகச் செலுத்த வேண்டும்.[a]
  rationale: The revision retains the Hebrew conditional structure and the repeated sacrificial verb while explicitly identifying the qualified referent as a “குறையற்ற விலங்கு.” This resolves the Tamil ambiguity without adding a theological interpretation. The footnote is retained, with only a minor stylistic smoothing.
