base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/004.yaml
  text: and the two kidneys[a], and the fat that is on them, which is on the loins, and the appendage on the liver, with the kidneys, he shall remove.
translation:
  language: ta
  text: இரண்டு சிறுநீரகங்களையும், அவற்றின்மேலும் இடுப்புப் பகுதியிலும் இருக்கும் கொழுப்பையும், சிறுநீரகங்களோடு சேர்த்து கல்லீரலின்மேல் இருக்கும் நீட்சிப் பகுதியையும்[a] அவன் அகற்ற வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கல்லீரலின் மடல்.” இந்த உடற்கூறியல் பகுதியைக் குறிக்கும் எபிரேயச் சொல்லின் துல்லியமான பொருள் உறுதியில்லை; தேவையற்ற துல்லியத்தைத் தவிர்ப்பதற்காக முதன்மை உரையில் “நீட்சிப் பகுதி” என்று தரப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: இரண்டு சிறுநீரகங்கள்
  rationale: இது பலிக்குரிய விலங்கின் இரண்டு சிறுநீரகங்களையும் நேரடியாகக் குறிக்கிறது; நவீன தமிழில் தெளிவான உடற்கூறியல் சொல் பயன்படுத்தப்பட்டது.
- source_word: הַחֵלֶב
  choice: கொழுப்பு
  rationale: லேவியராகமத்தின் பலியிடும் சூழலில் பலிக்காகப் பிரித்தெடுக்கப்படும் கொழுப்புப் பகுதிகளைக் குறிக்கிறது; ‘கொழுப்பு’ இயல்பானதும் தெளிவானதும் ஆகும்.
- source_word: אֲשֶׁר עֲלֵהֶן
  choice: அவற்றின்மேல் இருக்கும்
  rationale: கொழுப்பு சிறுநீரகங்களின் மேல் இருப்பதைச் சுட்டும் உறவுத்தொடரின் இடவியல் பொருளைப் பாதுகாக்கிறது.
- source_word: הַכְּסָלִים
  choice: இடுப்புப் பகுதி
  rationale: இந்தச் சொல் இடுப்பு அல்லது விலாப்புறப் பகுதியைக் குறிக்கிறது; ‘இடுப்புப் பகுதி’ பொதுவாசகர்களுக்குத் தெளிவாகவும் உடற்கூறியல் சூழலுக்கு ஏற்றதாகவும் உள்ளது.
- source_word: הַיֹּתֶרֶת
  choice: நீட்சிப் பகுதி
  rationale: இது கல்லீரலுடன் தொடர்புடைய, துல்லியமாக அடையாளம் காண இயலாத உடற்கூறியல் பகுதி. ‘நீட்சிப் பகுதி’ தேவையற்ற துல்லியத்தைத் திணிக்காமல் அதன் புடைத்தோ நீண்டோ இருக்கும் தன்மையை வெளிப்படுத்துகிறது.
- source_word: עַל הַכָּבֵד
  choice: கல்லீரலின்மேல் இருக்கும்
  rationale: עַל என்பதன் நேரடியான இடவியல் பொருளைப் பாதுகாக்கிறது; ‘கல்லீரலுடன் இணைந்த’ என்று விளக்கமாகத் தீர்மானிப்பதைத் தவிர்க்கிறது.
- source_word: עַל הַכְּלָיוֹת
  choice: சிறுநீரகங்களோடு சேர்த்து
  rationale: பலியிடும் செயல்முறையில் கல்லீரல் பகுதி சிறுநீரகங்களுடன் அகற்றப்படுவதை இயல்பான தமிழில் தெரிவிக்கிறது; மூலத்தின் தொடர்பை அளவுக்கு மீறி உடற்கூறியல் நிலையாக விளக்கவில்லை.
- source_word: יְסִירֶנָּה
  choice: அவன் அகற்ற வேண்டும்
  rationale: ஹிபில் வினையின் நீக்குதல் என்ற பொருளையும் சடங்குச் சட்டத்தின் கட்டளை வலிமையையும் நவீன தமிழில் இயல்பாக வழங்குகிறது.
