  text: וְ/הִקְרִיב֙ מִ/זֶּ֣בַח הַ/שְּׁלָמִ֔ים אִשֶּׁ֖ה לַ/יהוָ֑ה אֶת הַ/חֵ֨לֶב֙ הַֽ/מְכַסֶּ֣ה אֶת הַ/קֶּ֔רֶב וְ/אֵת֙ כָּל הַ/חֵ֔לֶב אֲשֶׁ֖ר עַל הַ/קֶּֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/003.yaml
  text: And from the sacrifice of peace offerings he shall present as a food offering to Yahweh the fat that covers the entrails[a], and all the fat that is on the entrails,
translation:
  language: ta
  text: சமாதானப் பலியிலிருந்து, உட்பாகங்களை மூடியிருக்கும் கொழுப்பையும் உட்பாகங்களின் மேல் இருக்கும் கொழுப்பு முழுவதையும் யாவேக்கு நெருப்புப் படையலாக[a] அவன் செலுத்த வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உணவுப் படையலாக.’
    reason: אִשֶּׁה என்பது நெருப்பில் எரித்துப் புகையாக்கப்படும் படையலைக் குறிக்கலாம்; ஆசாரிய நூல்களின் மொழிநடையில் கடவுளுக்குரிய உணவுப் படையல் என்ற நுண்பொருளும் இருக்கலாம்.
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: அவன் செலுத்த வேண்டும்
  rationale: இப்பலிச் சூழலில் ஹிஃபில் வடிவம் சடங்குமுறையாகப் படையலை முன்வைத்துச் செலுத்துவதைக் குறிக்கிறது; நவீன தமிழில் இயல்பாகவும் அதிகாரப்பூர்வமாகவும் உள்ளது.
- source_word: מִזֶּבַח הַשְּׁלָמִים
  choice: சமாதானப் பலியிலிருந்து
  rationale: זֶבַח என்பது பலியிடப்பட்ட காணிக்கையையும் שְׁלָמִים என்பது குறிப்பிட்ட பலிவகையையும் குறிக்கிறது. மரபாக அறியப்பட்ட ‘சமாதானப் பலி’ என்ற பெயர் தொடர்ச்சிக்காக வைக்கப்படுகிறது; இதன் சொற்பொருள் நல்வாழ்வு அல்லது நல்லுறவையும் சுட்டலாம்.
- source_word: אִשֶּׁה
  choice: நெருப்புப் படையலாக
  rationale: இந்த ஆசாரியச் சட்டச் சூழலில் நெருப்பில் எரித்துப் புகையாக்கப்படும் படையலைக் குறிக்கிறது. ‘நெருப்புப் படையல்’ என்பது சொல்லின் நெருப்பு சார்ந்த பொருளைத் தெளிவாகக் காக்கிறது; ‘உணவுப் படையல்’ என்ற சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: எபிரெய மூலத்தில் வரும் உடன்படிக்கைப் பெயரான יהוה என்பதை பொதுப்பட்டமாக மாற்றாமல் தமிழில் ‘யாவே’ என ஒலிபெயர்க்கிறது.
- source_word: הַחֵלֶב הַמְכַסֶּה אֶת הַקֶּרֶב
  choice: உட்பாகங்களை மூடியிருக்கும் கொழுப்பு
  rationale: பலியிடும் சட்டங்களில் חֵלֶב என்பது அர்ப்பணிக்க ஒதுக்கப்பட்ட கொழுப்புப் பகுதிகளையும் קֶרֶב என்பது விலங்கின் உள்ளுறுப்புகளையும் குறிக்கிறது; attributive participle-இன் தொடர்ச்சியான செயற்பொருளை ‘மூடியிருக்கும்’ காக்கிறது.
- source_word: כָּל הַחֵלֶב אֲשֶׁר עַל הַקֶּרֶב
  choice: உட்பாகங்களின் மேல் இருக்கும் கொழுப்பு முழுவதையும்
  rationale: உட்பாகங்களை மூடும் கொழுப்பிலிருந்து அவற்றோடு இணைந்துள்ள மற்ற கொழுப்பு முழுவதையும் வேறுபடுத்தும் மூலவாக்கிய அமைப்பைத் தெளிவாகப் பிரதிபலிக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலவசனம் தனிப்பட்ட உடன்படிக்கைப் பெயரை நேரடியாகப் பயன்படுத்துவதால், அதை பொதுவான பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைக் காக்கிறது.
- issue: אִשֶּׁה என்ற பலிச்சொல்லின் பொருள்
  choice: நெருப்புப் படையல்
  alternative: உணவுப் படையல்
  rationale: சொல்லின் சரியான வரலாற்று விளக்கம் விவாதத்திற்குரியது. பிரதான உரையில் நெருப்பால் புகையாக்கப்படும் படையல் என்ற சடங்குச் சார்பை வைத்துக்கொண்டு, ‘உணவுப் படையல்’ என்ற பொருளை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், பலிச்சட்டத்திற்கேற்ற கண்ணியமான மற்றும் நேரடியான நடை பயன்படுத்தப்பட்டுள்ளது. ‘உட்பாகங்கள்’, ‘கொழுப்பு’, ‘செலுத்த வேண்டும்’ ஆகியவை சாதாரண வாசகருக்குப் புரியும் வகையில் தேர்ந்தெடுக்கப்பட்டுள்ளன; தொழில்நுட்ப பலிவகையான ‘சமாதானப் பலி’ மரபுத் தொடர்ச்சிக்காக வைக்கப்பட்டுள்ளது.
