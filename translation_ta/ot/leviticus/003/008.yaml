  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் வகையிலும் வழிபாட்டு உரைக்கேற்ற கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. கட்டளையின் தொடர்ச்சியைத் தமிழில் இயல்பாகக் காட்ட ‘வேண்டும்’ பயன்படுத்தப்பட்டுள்ளது; மூலவசனத்தின் சடங்கு சார்ந்த துல்லியமும் பாலினக் குறிப்பும் பாதுகாக்கப்பட்டுள்ளன.
