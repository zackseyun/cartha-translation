base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/008.yaml
  text: He shall lay his hand on the head of his offering and slaughter it before the tent of meeting[a], and Aaron’s sons shall throw its blood against the altar all around.
translation:
  language: ta
  text: அவன் தன் காணிக்கையின் தலையின்மேல் தன் கையை வைத்து, சந்திப்புக் கூடாரத்தின் முன்பாக அதை அறுக்க வேண்டும். ஆரோனின் மகன்கள் அதன் இரத்தத்தைப் பலிபீடத்தின் எல்லாப் பக்கங்களின்மீதும் வீச வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வீச வேண்டும்’ என்பதற்கு ‘பாய்ச்ச வேண்டும்’ அல்லது ‘தெறிக்கச் செய்ய வேண்டும்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய வினை, இரத்தத்தை மெதுவாகத் தெளிப்பதை அல்ல, வலுவாகச் செலுத்தும் ஒரு சடங்குச் செயலைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָמַךְ
  choice: கையை வைத்து
  rationale: பலிச்சடங்குச் சூழலில், விலங்கின் தலையின்மேல் கையை வைக்கும் செயலைக் குறிக்கிறது. எவ்வளவு அழுத்தம் கொடுக்கப்பட்டது என்பதை மூலவசனம் வெளிப்படையாகக் கூறாததால், இயல்பான தமிழில் பொதுவாக மொழிபெயர்க்கப்பட்டது.
- source_word: יָדוֹ
  choice: தன் கையை
  rationale: மூலமொழியில் ஒருமை உள்ளது; செய்பவரையே குறிக்கும் உடைமைத் தொடர்பைத் தமிழில் ‘தன்’ தெளிவாகக் காட்டுகிறது.
- source_word: רֹאשׁ
  choice: தலையின்மேல்
  rationale: பலியிடப்படும் விலங்கின் உடற்கூறு என்ற நேரடியான பொருள் பாதுகாக்கப்பட்டுள்ளது.
- source_word: קָרְבָּנוֹ
  choice: தன் காணிக்கையின்
  rationale: קָרְבָּן என்பது கடவுளிடம் கொண்டுவரப்படும் அர்ப்பணிப்பைக் குறிக்கும் பரந்த சொல். ‘காணிக்கை’ இங்கு ‘பலி’ என்பதைவிட மூலச்சொல்லின் பரந்த பொருளை நன்றாகப் பாதுகாக்கிறது.
- source_word: וְשָׁחַט
  choice: அறுக்க வேண்டும்
  rationale: பலிக்கான விலங்கைக் கொல்லும் சடங்குச் செயலைக் குறிக்கும் தொழில்நுட்ப வினை. நவீன தமிழில் ‘அறுத்தல்’ அந்தச் செயலை இயல்பாகவும் துல்லியமாகவும் தெரிவிக்கிறது.
- source_word: לִפְנֵי
  choice: முன்பாக
  rationale: இடத்தையும் முன்னிலையையும் குறிக்கும் வழிபாட்டுச் சூழலுக்கேற்ற நேரடி மொழிபெயர்ப்பு.
- source_word: אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரம்
  rationale: இறைவன் தமது மக்களைச் சந்திக்கும் கூடாரம் என்ற எபிரெயப் பெயரின் பொருளைச் சுருக்கமாகப் பாதுகாக்கும் நிலையான தமிழ் வடிவம்.
- source_word: וְזָרְקוּ
  choice: வீச வேண்டும்
  rationale: இரத்தத்தை வலுவான சடங்குச் செயலாக எறிதல் அல்லது பாய்ச்சுதலைக் குறிக்கிறது. ‘தெளித்தல்’ மென்மையான வேறொரு செயலை உணர்த்தக்கூடும் என்பதால் தவிர்க்கப்பட்டது.
- source_word: בְּנֵי אַהֲרֹן
  choice: ஆரோனின் மகன்கள்
  rationale: மூலமொழியின் ஆண்பால் குடும்பக் குறிப்பை விரிவுபடுத்தாமலும் பொதுமைப்படுத்தாமலும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: דָּמוֹ
  choice: அதன் இரத்தத்தை
  rationale: பின்னொட்டு பலியிடப்படும் விலங்கைக் குறிக்கிறது; தமிழில் உயிரினத்தைக் குறிக்கும் இயல்பான நடுநிலைச் சுட்டுப்பெயர் பயன்படுத்தப்பட்டுள்ளது.
- source_word: עַל הַמִּזְבֵּחַ
  choice: பலிபீடத்தின் ... மீதும்
  rationale: இரத்தம் பலிபீடத்தின் மேற்பரப்பில் வெறுமனே வைக்கப்படுவது அல்ல, அதை நோக்கி வீசப்படுவது என்ற சூழலைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: סָבִיב
  choice: எல்லாப் பக்கங்களின்மீதும்
  rationale: பலிபீடத்தைச் சுற்றியுள்ள பக்கங்களில் இரத்தம் செலுத்தப்படுவதைத் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: பலிச்சடங்கில் கையை வைக்கும் செயலின் பொருள்
  choice: ‘தன் கையை வைத்து’ என்று செயல் மட்டும் மொழிபெயர்க்கப்பட்டது.
  alternative: குற்றம் மாற்றப்படுதல் அல்லது பலியுடன் அடையாளப்படுத்திக்கொள்ளுதல் என்ற விளக்கத்தை மொழிபெயர்ப்பிலேயே சேர்த்தல்; அல்லது அழுத்தத்தை வலியுறுத்த ‘கையை ஊன்றி’ என மொழிபெயர்த்தல்.
  rationale: வசனம் சடங்குச் செயலை விவரிக்கிறது; அதன் இறையியல் பொருளை விளக்கவில்லை. ஆகவே குறிப்பிட்ட கோட்பாட்டு விளக்கம் சேர்க்கப்படவில்லை.
- issue: בְּנֵי אַהֲרֹן என்ற பாலினம் குறிக்கப்பட்ட குடும்பச் சொல்
  choice: ஆரோனின் மகன்கள்
  alternative: ஆரோனின் சந்ததியினர்; ஆரோனிய ஆசாரியர்கள்
  rationale: எபிரெய உரை குறிப்பாக ‘மகன்கள்’ என்று கூறுவதால், அதன் குடும்ப மற்றும் பாலினக் குறிப்பு பாதுகாக்கப்பட்டது.
