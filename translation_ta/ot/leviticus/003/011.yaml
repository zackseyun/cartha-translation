  text: The priest shall burn it on the altar as food[a], an offering made by fire to Yahweh.
translation:
  language: ta
  text: ஆசாரியன் அதை பலிபீடத்தின் மேல் புகையெழும்பும்படி எரிக்க வேண்டும். அது யாவேக்குரிய நெருப்புப் பலியின் உணவாகும்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “யாவேக்கான நெருப்புப் பலியின் அப்பம்.” இங்கு “அப்பம்” என்பது பலிச்சடங்கு மரபுத்தொடரில் உணவைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְטִירוֹ
  choice: அதை ... புகையெழும்பும்படி எரிக்க வேண்டும்
  rationale: கטר என்பதன் ஹிஃபீல் வடிவம் பலிச்சடங்கு சூழலில், பலிபீடத்தின் மேல் எரித்து புகையாக எழச் செய்வதைக் குறிக்கிறது. தமிழில் ‘புகையெழும்பும்படி எரிக்க’ என்பது செயலும் அதன் சடங்குசார் நுட்பமும் தெளிவாக வெளிப்படச் செய்கிறது.
- source_word: הַכֹּהֵן
  choice: ஆசாரியன்
  rationale: இஸ்ரவேலின் பலிச்சடங்கு சூழலில் כֹּהֵן என்பதற்கான வழக்கமான, தெளிவான தமிழ் சொல்.
- source_word: הַמִּזְבֵּחָה
  choice: பலிபீடத்தின் மேல்
  rationale: திசையைக் குறிக்கும் ־ָה இறுதி, இச்செயலின் சூழலில் பலிபீடத்தை நோக்கி எடுத்துச் சென்று அதன் மேல் எரிப்பதைக் குறிக்கிறது.
- source_word: לֶחֶם
  choice: உணவு
  rationale: לֶחֶם என்பதன் அடிப்படைப் பொருள் ‘அப்பம்’ என்றாலும், இங்குள்ள பலிச்சடங்கு மரபுத்தொடரில் பலிபீடத்தில் கடவுளுக்குரிய பங்காகச் செலுத்தப்படுவதைக் குறிக்கும் பொதுவான ‘உணவு’ என்ற பொருள் பொருந்துகிறது; எரிக்கப்படுவது சொற்பொருளிலான அப்பம் அல்ல.
- source_word: אִשֶּׁה
  choice: நெருப்புப் பலி
  rationale: இது நெருப்பின் மூலம் செலுத்தப்படும் பலியைக் குறிக்கும் தொழில்நுட்பமான பலிச்சடங்குச் சொல். ‘நெருப்புப் பலி’ சுருக்கமாகவும் இயல்பாகவும் அதன் சடங்குசார் பொருளைப் பாதுகாக்கிறது.
- source_word: לַיהוָה
  choice: யெகோவாவுக்குச் செலுத்தப்படும்
  rationale: לְ முன்னொட்டு அர்ப்பணிப்பின் பெறுநரைக் குறிக்கிறது. יהוה என்ற தனிப்பெயர் தமிழில் ‘யெகோவா’ என ஒலிபெயர்க்கப்பட்டு, ‘செலுத்தப்படும்’ என்பது அர்ப்பணிப்புத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: לֶחֶם אִשֶּׁה என்ற பலிச்சடங்கு மரபுத்தொடரின் பொருள்
  choice: நெருப்புப் பலியாகிய உணவு
  alternative: நெருப்புப் பலியின் உணவு; அப்பமாகிய நெருப்புப் பலி
  rationale: எபிரெயச் சொற்றொடர் ‘உணவு/அப்பம்’ மற்றும் ‘நெருப்புப் பலி’ ஆகிய இரு சடங்குசார் கருத்துகளையும் இணைக்கிறது. கடவுளுக்கு உடல்சார் ஊட்டம் தேவை என்ற கருத்தை ஏற்படுத்தாமல், பலிபீடத்தில் அவருக்குரிய பங்காக அர்ப்பணிக்கப்படும் ‘உணவு’ என்ற உருவகத்தை இம்மொழிபெயர்ப்பு பாதுகாக்கிறது.
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: கர்த்தர்; ஆண்டவர்
  rationale: மூலத்தில் பொதுப்பட்டப்பெயர் அல்ல, தனிப்பட்ட உடன்படிக்கைப் பெயரான יהוה உள்ளது. அதை பொதுப்பட்டப்பெயராக மாற்றாமல் தமிழில் பரவலாக அறியப்பட்ட ஒலிபெயர்ப்பால் வழங்குவது மூலத்தின் தன்மையை வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையில் கண்ணியமான பலிச்சடங்கு நடையைப் பயன்படுத்துகிறது. ‘புகையெழும்பும்படி எரிக்க’ என்பது மூல வினையின் புகை நுட்பத்தைப் பாதுகாக்கிறது; ‘நெருப்புப் பலி’ தொழில்நுட்பச் சொல்லைச் சுருக்கமாக வழங்குகிறது. அடிக்குறிப்பு குறியீடு [a] முதன்மை உரையில் இடம்பெற்றுள்ளது.
