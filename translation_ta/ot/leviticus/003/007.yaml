theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: யெகோவா; கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட தெய்வீகப் பெயர் நேரடியாக இருப்பதால் பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்க்கப்பட்டது; ‘யாவே’ என்பது எபிரெயப் பெயரின் பரவலாக ஏற்றுக்கொள்ளப்பட்ட மறுவடிவ உச்சரிப்பைப் பிரதிபலிக்கிறது.
