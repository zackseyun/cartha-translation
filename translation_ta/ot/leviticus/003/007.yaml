    reason: כֶּשֶׂב என்பது செம்மறியாடு என்றும், சூழலின்படி செம்மறியாட்டுக்குட்டி என்றும் பொருள்படக்கூடும்; இந்த உண்மையான சொற்பொருள் மாற்று பாதுகாக்கப்படுகிறது.
