revisions:
- from: 'இது தலைமுறைதோறும், நீங்கள் குடியிருக்கும் எல்லா இடங்களிலும் கடைப்பிடிக்க வேண்டிய நிரந்தரச் சட்டம்[a]: கொழுப்பு எதையும் இரத்தம் எதையும் நீங்கள் உண்ணக் கூடாது.'
  to: 'இது தலைமுறைதோறும், நீங்கள் குடியிருக்கும் எல்லா இடங்களிலும் கடைப்பிடிக்க வேண்டிய நிரந்தரச் சட்டம்[a]: எந்தக் கொழுப்பையும் எந்த இரத்தத்தையும் நீங்கள் உண்ணக் கூடாது.'
