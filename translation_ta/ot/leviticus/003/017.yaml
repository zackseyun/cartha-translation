source:
  edition: WLC
  text: חֻקַּ֤ת עוֹלָם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם בְּ/כֹ֖ל מֽוֹשְׁבֹתֵי/כֶ֑ם כָּל חֵ֥לֶב וְ/כָל דָּ֖ם לֹ֥א תֹאכֵֽלוּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/017.yaml
  text: 'It shall be a permanent statute throughout your generations, in all your dwellings: you shall eat neither any fat nor any blood.'
translation:
  language: ta
  text: 'இது தலைமுறைதோறும், நீங்கள் குடியிருக்கும் எல்லா இடங்களிலும் கடைப்பிடிக்க வேண்டிய நிரந்தரச் சட்டம்[a]: எந்தக் கொழுப்பையும் எந்த இரத்தத்தையும் நீங்கள் உண்ணக் கூடாது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “என்றென்றைக்குமான சட்டம்” அல்லது “என்றும் நிலைக்கும் சட்டம்” என்றும் மொழிபெயர்க்கலாம். சட்டச் சூழல்களில் எபிரெய עוֹלָם என்பது பொதுவாக நீடித்து, தொடர்ந்து செல்லுபடியாக இருப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֻקַּת
  choice: சட்டம்
  rationale: நிலையாக விதிக்கப்பட்ட கட்டளையைக் குறிக்கும் எபிரெயச் சொல்லின் சட்டரீதியான வலிமையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: עוֹלָם
  choice: நிரந்தர
  rationale: சட்டச் சூழலில் தொடர்ந்து நிலவும் செல்லுபடியைச் சுட்டுகிறது; முழுமையான காலமற்ற தன்மையைத் தேவையின்றி வலியுறுத்தாமல் மூலத்தின் பொருளைத் தக்கவைக்கிறது.
- source_word: לְדֹרֹתֵיכֶם
  choice: தலைமுறைதோறும்
  rationale: அடுத்தடுத்து வரும் தலைமுறைகள் அனைத்திலும் கட்டளை தொடர்வதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: בְּכֹל מוֹשְׁבֹתֵיכֶם
  choice: நீங்கள் குடியிருக்கும் எல்லா இடங்களிலும்
  rationale: அவர்கள் வாழும் ஒவ்வொரு இடத்திலும் இச்சட்டம் பொருந்தும் என்ற பரப்பைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: כָּל חֵלֶב
  choice: கொழுப்பு எதையும்
  rationale: தடையுடன் வரும் כָּל என்பதன் முழுமையான பரப்பை இயல்பான தமிழில் காட்டுகிறது.
- source_word: וְכָל דָּם
  choice: இரத்தம் எதையும்
  rationale: இணையான சொற்றொடரின் முழுமையான தடையைத் தக்கவைத்து, 'கொழுப்பு எதையும்' என்பதோடு சமச்சீராக அமைகிறது.
- source_word: לֹא תֹאכֵלוּ
  choice: நீங்கள் உண்ணக் கூடாது
  rationale: சட்டப்பகுதியில் לֹא உடன் வரும் வினையின் தடைப் பொருளைத் தெளிவான நவீனத் தமிழில் அளிக்கிறது.
theological_decisions:
- issue: עוֹלָם குறிக்கும் கட்டளையின் காலநீட்சி
  choice: நிரந்தரச் சட்டம்
  alternative: என்றென்றைக்குமான சட்டம்; என்றும் நிலைக்கும் சட்டம்
  rationale: எபிரெயச் சட்டச் சூத்திரம் தலைமுறைகள் முழுவதும் தொடரும் உடன்படிக்கைச் செல்லுபடியை வலியுறுத்துகிறது. 'நிரந்தர' என்பது அந்த வலிமையைத் தக்கவைக்கிறது; அதேவேளையில், இந்தச் சொல்வழக்கைத் தாண்டிய முழுமையான முடிவற்ற காலத்தை மொழிபெயர்ப்பிலேயே தீர்மானித்துவிடாது.
translation_notes:
  register: நவீன நிலையான தமிழில், வாசிக்க எளிதானதாயும் சட்டப்பாங்கின் கண்ணியத்தைத் தக்கவைத்தும் மொழிபெயர்க்கப்பட்டது. 'கடைப்பிடிக்க வேண்டிய' என்பது தமிழில் இயல்பான வாக்கிய அமைப்புக்காகச் சேர்க்கப்பட்ட வெளிப்படுத்தல்; மூலத்தில் உள்ள 'சட்டம்' என்ற பெயர்ச்சொல் வாக்கியத்தின் கட்டாயத் தன்மையை ஏற்கெனவே தாங்குகிறது.
