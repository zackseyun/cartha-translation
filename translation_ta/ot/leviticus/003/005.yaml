base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/005.yaml
  text: And Aaron’s sons shall burn it on the altar[a], on top of the burnt offering that is on the wood that is on the fire. It is a food offering, a pleasing aroma to Yahweh.
translation:
  language: ta
  text: ஆரோனின் மகன்கள் அதை பலிபீடத்தின்மேல், நெருப்பின்மேலுள்ள விறகுகளின்மேல் இருக்கும் தகனபலிக்குமேல் எரித்துப் புகையெழச் செய்ய வேண்டும். அது யாவேக்கு இனிய நறுமணமான நெருப்புப் பலி.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உணவுப் பலி.”
    reason: אִשֵּׁה என்ற தொழில்நுட்பச் சொல்லுக்கு நெருப்பில் செலுத்தப்படும் பலி என்ற பொருளோடு, தெய்வத்துக்குரிய உணவுப் பங்கு என்ற சடங்குசார் நுணுக்கமும் இருக்கக்கூடும்.
lexical_decisions:
- source_word: וְהִקְטִירוּ
  choice: எரித்துப் புகையெழச் செய்ய வேண்டும்
  rationale: קטר என்பதன் ஹிஃபில் வடிவம் பலியைப் பலிபீடத்தில் எரித்து புகையாக மேலெழச் செய்வதைக் குறிக்கிறது. ‘எரிக்க வேண்டும்’ என்பதைக் காட்டிலும் இத்தேர்வு சடங்குசார் பொருளைத் தெளிவாகக் காக்கிறது.
- source_word: אֹתוֹ
  choice: அதை
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட சமாதானப் பலியின் கொழுப்புப் பகுதிகளைச் சுட்டும் நேரடி செயப்படுபொருள் சுட்டுப்பெயர்.
- source_word: בְנֵי אַהֲרֹן
  choice: ஆரோனின் மகன்கள்
  rationale: எபிரெயக் கட்டமைப்பை இயல்பான நவீனத் தமிழில் நேரடியாக வழங்குகிறது; இங்கு அவர்கள் ஆசாரியர்களாகச் செயல்படுவது சூழலால் தெளிவாகிறது.
- source_word: הַמִּזְבֵּחָה
  choice: பலிபீடத்தின்மேல்
  rationale: பலியை எரிக்கும் பீடத்தையும், செயல் நடைபெறும் இடம் அல்லது இலக்கையும் தெளிவாகக் குறிக்கிறது.
- source_word: עַל הָעֹלָה
  choice: தகனபலிக்குமேல்
  rationale: עַל என்பதன் அடிப்படை இடப்பொருளான ‘மேல்’ என்பதைக் காக்கிறது. עֹלָה என்பதற்கு லேவியராகமம் முழுவதும் ஒத்திசைவாக ‘தகனபலி’ பயன்படுத்தப்படுகிறது.
- source_word: אֲשֶׁר עַל הָעֵצִים אֲשֶׁר עַל הָאֵשׁ
  choice: நெருப்பின்மேல் இருக்கும் விறகுகளின்மேல் உள்ள
  rationale: மூலத்தின் அடுக்கான அமைப்பையும் இருமுறை வரும் עַל என்பதையும் காத்து, தமிழில் புரியத்தக்க தொடர்புச் சொற்றொடராக வழங்குகிறது.
- source_word: אִשֵּׁה
  choice: நெருப்புப் பலி
  rationale: இது நெருப்பில் செலுத்தப்படும் பலிக்கான தொழில்நுட்பச் சடங்குச் சொல். ‘உணவுப் பலி’ என்ற பொருளாக்கம் சாத்தியமானதாயினும், இவ்வசனத்தில் அச்சொல்லின் வடிவவியல் மற்றும் நெருப்பு சார்ந்த பொருளை ‘நெருப்புப் பலி’ நெருக்கமாகக் காக்கிறது.
- source_word: רֵיחַ נִיחֹחַ
  choice: இனிய நறுமணம்
  rationale: ஏற்றுக்கொள்ளத்தக்க பலியைக் குறிக்கும் நிலையான பலிசார் சொற்றொடரை இயல்பாக வழங்குகிறது; கடவுள் உண்மையில் மணத்தைத் தேவைப்படுகிறார் என்ற மிகை உடல்சார் கருத்தைச் சேர்ப்பதில்லை.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: יהוה என்ற உடன்படிக்கைப் பெயரை பொதுவாக ஏற்றுக்கொள்ளப்பட்ட தமிழாக்கமான ‘யாவே’ என்று ஒலிபெயர்த்து, ל முன்னிடைச்சொல்லை நான்காம் வேற்றுமையால் வழங்குகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பொதுப்பட்டப் பெயர் அல்ல, நான்கு எழுத்துகளைக் கொண்ட தனிப்பட்ட இறைப்பெயர் நேரடியாக உள்ளது. ஆகவே அதை பட்டப்பெயராக மாற்றாமல் ‘யாவே’ என ஒலிபெயர்க்கிறது.
- issue: אִשֵּׁה என்ற பலிசார் சொல்லின் பொருள்
  choice: நெருப்புப் பலி
  alternative: உணவுப் பலி
  rationale: இச்சொல் நெருப்பில் செலுத்தப்படும் பலியைக் குறிக்கும் தொழில்நுட்பச் சொல். பலி யாவேக்கான ‘உணவு’ எனக் கருதப்படும் சடங்குச் சூழல் வேறு இடங்களில் தென்பட்டாலும், அந்த விளக்கத்தை இங்கு பிரதான உரையில் கட்டாயப்படுத்தாமல், மாற்று வாசிப்பை அடிக்குறிப்பில் காக்கிறது.
- issue: רֵיחַ נִיחֹחַ என்ற சொற்றொடரின் தெய்வவியல் நுணுக்கம்
  choice: யாவேக்கு இனிய நறுமணம்
  alternative: யாவேக்கு அமைதியளிக்கும் நறுமணம்
  rationale: நִיחֹחַ ஏற்றுக்கொள்ளுதல் அல்லது இன்பம் சார்ந்த பொருளைக் கொண்டுள்ளது. ‘அமைதியளிக்கும்’ என்பது கடவுளின் கோபத்தைத் தணிப்பதாக அதிகமாக விளக்கக்கூடும்; ‘இனிய’ என்பது மூலத்தின் உருவகத்தையும் திறந்த நுணுக்கத்தையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. சடங்குசார் துல்லியத்திற்காக ‘தகனபலி’, ‘பலிபீடம்’, ‘நெருப்புப் பலி’ ஆகிய நிலையான சொற்கள் வைக்கப்பட்டுள்ளன. மூல எபிரெயத்தின் அடுக்கான இடவமைப்பு வாசிக்கத்தக்க அளவில் காக்கப்பட்டுள்ளது; ‘எரித்துப் புகையெழச் செய்ய வேண்டும்’ என்பது சாதாரண எரிப்புக்கும் பலிசார் புகையாக்கத்திற்கும் இடையிலான வேறுபாட்டை வெளிப்படுத்துகிறது.
