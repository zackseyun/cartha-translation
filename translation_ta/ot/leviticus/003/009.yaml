  text: וְ/הִקְרִ֨יב מִ/זֶּ֣בַח הַ/שְּׁלָמִים֮ אִשֶּׁ֣ה לַ/יהוָה֒ חֶלְבּ/וֹ֙ הָ/אַלְיָ֣ה תְמִימָ֔ה לְ/עֻמַּ֥ת הֶ/עָצֶ֖ה יְסִירֶ֑/נָּה וְ/אֶת הַ/חֵ֨לֶב֙ הַֽ/מְכַסֶּ֣ה אֶת הַ/קֶּ֔רֶב וְ/אֵת֙ כָּל הַ/חֵ֔לֶב אֲשֶׁ֖ר עַל הַ/קֶּֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/009.yaml
  text: 'And from the sacrifice of peace offerings he shall present an offering made by fire to Yahweh: its fat[a], the whole fat tail, which he shall remove close to the backbone, and the fat that covers the entrails, and all the fat that is on the entrails[c][b],'
translation:
  language: ta
  text: 'அவன் சமாதானப் பலியிலிருந்து[a] யாவேக்கு நெருப்பினால் செலுத்தும் காணிக்கையாக இவற்றைச் செலுத்த வேண்டும்: அதன் கொழுப்பையும், முதுகெலும்புக்கு அருகிலிருந்து அகற்ற வேண்டிய முழு கொழுத்த வாலையும்[b][c], உள்ளுறுப்புகளை மூடியிருக்கும் கொழுப்பையும், உள்ளுறுப்புகளின்மேல் இருக்கும் கொழுப்பு அனைத்தையும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உறவுப் பலி’ அல்லது ‘நல்வாழ்வுப் பலி’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இது பலியாகச் செலுத்தப்பட்ட செம்மறியாட்டின் அகன்ற, கொழுப்பு நிறைந்த வாலைக் குறிக்கிறது.
    reason: cultural_note
  - marker: c
    text: “முதுகெலும்புக்கு எதிரே” அல்லது “முதுகுத்தண்டின் அடிப்பகுதியில்” என்றும் பொருள்கொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶבַח הַשְּׁלָמִים
  choice: சமாதானப் பலி
  rationale: שְׁלָמִים என்பது சமாதானம், நல்வாழ்வு, உறவு ஆகிய கருத்துகளை உள்ளடக்கும் பலிவகையின் தொழில்நுட்பப் பெயர். தமிழில் மரபாகப் புரிந்துகொள்ளத்தக்க ‘சமாதானப் பலி’ முதன்மை உரையில் வைக்கப்பட்டு, பிற சாத்தியமான பொருள்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: אִשֶּׁה
  choice: நெருப்பில் செலுத்தும் காணிக்கை
  rationale: பலிபீட நெருப்பில் அர்ப்பணிக்கப்படும் சடங்குக் காணிக்கையை இது குறிக்கிறது. சாதாரண உணவு என்ற தவறான எண்ணத்தைத் தவிர்த்து, நெருப்பின் வழியாகச் செலுத்தப்படுவதை இச்சொற்றொடர் தெளிவாகக் காட்டுகிறது.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: மூலத்தில் வரும் உடன்படிக்கைப் பெயரான יהוה-ஐ பொதுப்பட்டப் பெயராக மாற்றாமல், தமிழில் உச்சரிப்புக்கு ஏற்றவாறு ‘யாவே’ என்று எழுத்துப்பெயர்த்துள்ளது.
- source_word: חֶלְבּוֹ
  choice: அதன் கொழுப்பு
  rationale: பலிக்காக ஒதுக்கப்பட்ட மிருகத்தின் கொழுப்புப் பகுதிகளைக் குறிக்கும் நேரடியான உடைமைத் தொடர்.
- source_word: הָאַלְיָה תְמִימָה
  choice: முழுக் கொழுத்த வால்
  rationale: אַלְיָה என்பது குறிப்பாகச் செம்மறியாட்டின் அகன்ற கொழுப்பு நிறைந்த வாலைச் சுட்டுகிறது; תְמִימָה அது முழுமையாக அகற்றப்பட வேண்டும் என்பதைக் காட்டுகிறது.
- source_word: לְעֻמַּת הֶעָצֶה
  choice: முதுகெலும்புக்கு அருகில்
  rationale: வாலை அகற்றும் இடத்தை முதுகெலும்பு அல்லது முதுகுத்தண்டின் அடிப்பகுதியோடு தொடர்புபடுத்தும் உடற்கூற்றுச் சொற்றொடர். எபிரெயச் சொற்றொடரின் துல்லியமான இடவுறவு தெளிவற்றதால் மாற்றுகள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: יְסִירֶנָּה
  choice: அகற்ற வேண்டிய
  rationale: சூழலில் வாலை வெட்டி அல்லது பிரித்து அகற்றும் செயலைக் குறிக்கிறது; முன்வரும் பெயர்த்தொடரோடு இயல்பாக இணைக்கப்பட்டுள்ளது.
- source_word: הַחֵלֶב הַמְכַסֶּה אֶת הַקֶּרֶב
  choice: குடல்களை மூடியிருக்கும் கொழுப்பு
  rationale: பலிக்குரிய உடற்கூற்றுச் சூழலில் קֶרֶב என்பது உள்ளுறுப்புகள் அல்லது குடற்பகுதியைக் குறிக்கிறது. சாதாரண வாசகருக்குத் தெளிவாக ‘குடல்கள்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: כָּל הַחֵלֶב אֲשֶׁר עַל הַקֶּרֶב
  choice: குடல்களின்மேல் இருக்கும் கொழுப்பு அனைத்தும்
  rationale: குடல்களை மூடும் கொழுப்புக்கும் அவற்றின்மேல் ஒட்டியுள்ள கொழுப்பு முழுவதற்கும் இடையே மூல உரை காட்டும் வேறுபாட்டைப் பேணுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல உரை இறைவனின் தனிப்பட்ட உடன்படிக்கைப் பெயரை நேரடியாகக் கொண்டிருப்பதால், அதை ஒரு பட்டப்பெயராக மாற்றாமல் ‘யாவே’ என்று எழுத்துப்பெயர்த்துள்ளது.
- issue: שְׁלָמִים பலியின் பொருள் நுணுக்கம்
  choice: சமாதானப் பலி
  alternative: உறவுப் பலி; நல்வாழ்வுப் பலி
  rationale: இச்சொல் சமாதானம் மட்டுமல்லாமல் உறவு மற்றும் நலநிலை ஆகிய நுணுக்கங்களையும் தாங்கக்கூடும். முதன்மை உரையில் பரிச்சயமான பெயர் வைக்கப்பட்டு, பொருள் வரம்பு அடிக்குறிப்பில் திறந்துவைக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சடங்கு சார்ந்த கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் பட்டியல் அமைப்பும் உடற்கூற்றுப் பகுதிகளுக்கிடையிலான வேறுபாடும் பேணப்பட்டுள்ளன. ‘இவற்றைப்’ என்பது தொடர்ந்து பட்டியலிடப்படும் பல கொழுப்புப் பகுதிகளை இயல்பாக முன்னறிவிக்கிறது.
