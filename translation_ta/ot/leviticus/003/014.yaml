base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/014.yaml
  text: 'And from it he shall present his offering[a], a food offering to Yahweh: the fat that covers the entrails, and all the fat that is on the entrails,'
translation:
  language: ta
  text: 'அதிலிருந்து அவன் தன் காணிக்கையை, யாவேக்கான நெருப்பினால் செலுத்தப்படும் காணிக்கையாக[a], செலுத்த வேண்டும்: குடற்பகுதியை மூடியிருக்கும் கொழுப்பையும், குடற்பகுதியின்மேல் உள்ள கொழுப்பு முழுவதையும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உணவுக் காணிக்கையாக.” אִשֶּׁה (இஷ்ஷே) என்ற எபிரெயச் சொல் பலிச் சடங்குச் சூழல்களில் பாரம்பரியமாக “நெருப்பினால் செலுத்தப்படும் காணிக்கை” என்று மொழிபெயர்க்கப்படுகிறது.
    reason: அִשֶּׁה என்பதன் மாற்று சொற்பொருள் வாய்ப்பைத் தக்கவைத்துக்கொண்டு, தமிழில் ‘உணவுக் காணிக்கை’ என்ற சொல்லால் ஏற்படக்கூடிய தானியக் காணிக்கை சார்ந்த குழப்பத்தை முதன்மை உரையில் தவிர்க்கிறது.
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: செலுத்த வேண்டும்
  rationale: ஹிஃபில் வடிவிலுள்ள קרב பலிச் சடங்குச் சூழலில் ஒரு காணிக்கையை இறைவனிடம் கொண்டுவந்து செலுத்துவதைக் குறிக்கிறது. நவீன தமிழில் ‘செலுத்த வேண்டும்’ இயல்பாகவும் சடங்குச் செயலுக்கு ஏற்றதாகவும் உள்ளது.
- source_word: מִמֶּנּוּ
  choice: அதிலிருந்து
  rationale: பின்னொட்டு முந்தைய வசனத்தில் கூறப்பட்ட பலியிடப்படும் விலங்கைக் குறிக்கிறது; மனிதரைக் குறிக்கவில்லை.
- source_word: קָרְבָּנוֹ
  choice: தன் காணிக்கையை
  rationale: קָרְבָּן என்பது பலி வழிபாட்டில் செலுத்தப்படும் காணிக்கைக்கான தொழில்நுட்பச் சொல். எழுவாயோடு பொருந்தும் தற்சுட்டுப் பெயரடையாக ‘தன்’ இயல்பான தமிழ் நடையைத் தருகிறது.
- source_word: אִשֶּׁה
  choice: உணவுக் காணிக்கையாக
  rationale: ஆசாரிய இலக்கியத்தில் இந்தச் சொல் நெருப்பில் செலுத்தப்படும் இறைவனுக்குரிய காணிக்கையைக் குறிக்கிறது; சில சூழல்களில் இறைவனுக்கான உணவுக் காணிக்கை என்ற பலிமொழியோடு செயல்படுகிறது. பாரம்பரிய ‘தீயில் செலுத்தும் காணிக்கை’ என்ற புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: לַיהוָה
  choice: யாவேக்கான
  rationale: ל முன்னிடைச்சொல் காணிக்கையின் பெறுநரை அல்லது உரியவரைக் குறிக்கிறது. יהוה என்ற உடன்படிக்கைப் பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: הַחֵלֶב
  choice: கொழுப்பு
  rationale: பலிச் சட்டங்களில் חֵלֶב என்பது எரிக்க ஒதுக்கப்பட்ட குறிப்பிட்ட கொழுப்புப் பகுதிகளைக் குறிக்கிறது.
- source_word: הַמְכַסֶּה אֶת הַקֶּרֶב
  choice: குடல்களை மூடியிருக்கும்
  rationale: எபிரெயப் பெயரெச்சத் தொடரை இயல்பான தமிழ் தொடர்பெயரெச்சத் தொடராக வழங்குகிறது. קֶרֶב இங்கு வயிற்றின் உட்புற உறுப்புகள் அல்லது குடற்பகுதியைக் குறிக்கிறது.
- source_word: וְאֵת כָּל הַחֵלֶב אֲשֶׁר עַל הַקֶּרֶב
  choice: குடல்களின்மேல் உள்ள கொழுப்பு முழுவதையும்
  rationale: עַל என்பதன் இடவியல் பொருளையும் כָּל என்பதன் முழுமையையும் தெளிவாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூலத்தில் நான்கெழுத்து உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது. அதை பொதுப்பட்டப் பெயராக மாற்றாமல், பரவலாக ஏற்கப்படும் உச்சரிப்பின் தமிழ் ஒலிபெயர்ப்பாக ‘யாவே’ என்று வழங்குவது பெயரின் தனித்தன்மையைப் பாதுகாக்கிறது.
- issue: אִשֶּׁה என்பதன் பலிமுறைப் பொருள்
  choice: உணவுக் காணிக்கை
  alternative: தீயில் செலுத்தும் காணிக்கை; எரிகாணிக்கை
  rationale: இந்தச் சொல் நெருப்போடு தொடர்புடைய பலிக்காணிக்கையைக் குறித்தாலும் அதன் சொற்பிறப்பும் துல்லிய நுட்பமும் விவாதத்திற்குரியவை. முதன்மை உரையில் ஆசாரிய மரபின் உணவுக் காணிக்கை மொழி வழங்கப்பட்டு, பாரம்பரிய நெருப்பு சார்ந்த மொழிபெயர்ப்பு அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது; இதனால் உண்மையான சொற்பொருள் இழுபறி மறைக்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான பலிச் சட்ட நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. மூல வசனம் அடுத்த வசனத்துக்குத் தொடரும் பட்டியலாக அமைந்திருந்தாலும், தமிழில் இலக்கணத் தெளிவுக்காக ‘செலுத்த வேண்டும்’ இறுதியில் மீண்டும் கூறப்பட்டுள்ளது. அடிக்குறிப்பு குறியீடு அது விளக்கும் ‘உணவுக் காணிக்கை’ தொடருக்குப் பின்பே இடப்பட்டுள்ளது.
