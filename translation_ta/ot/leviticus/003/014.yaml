- from: 'அதிலிருந்து அவன் தன் காணிக்கையை யாவேக்கான உணவுக் காணிக்கையாக[a]ச் செலுத்த வேண்டும்: குடல்களை மூடியிருக்கும் கொழுப்பையும், குடல்களின்மேல் உள்ள கொழுப்பு முழுவதையும் செலுத்த வேண்டும்.'
  to: 'அதிலிருந்து அவன் தன் காணிக்கையை, யாவேக்கான நெருப்பினால் செலுத்தப்படும் காணிக்கையாக[a], செலுத்த வேண்டும்: குடற்பகுதியை மூடியிருக்கும் கொழுப்பையும், குடற்பகுதியின்மேல் உள்ள கொழுப்பு முழுவதையும்.'
