  source_fidelity: திருத்தம் தேவை. אִשֶּׁה என்பதற்கு முதன்மை உரையில் ‘உணவுக் காணிக்கை’ என்பதைப் பயன்படுத்துவது தமிழில் தானியக் காணிக்கையைக் குறிக்கும் நிலையான சொல்லான ‘உணவுக் காணிக்கை’யுடன் குழப்பத்தை ஏற்படுத்தலாம். இவ்வசனத்தில் எரிக்கப்படும் கொழுப்புப் பகுதிகள் குறிக்கப்படுவதால், ‘நெருப்பினால் செலுத்தப்படும் காணிக்கை’ என்பது மூலத்தின் சடங்கு அர்த்தத்தையும் அதன் விவாதத்திற்குரிய சொற்பொருளையும் பாதுகாக்கிறது. קֶרֶב என்பதற்கு ‘குடல்கள்’ என்பது சற்றே குறுகலானது; ‘குடற்பகுதி’ பொருத்தமானது.
  naturalness: திருத்தப்பட்ட உரை நவீனத் தரத் தமிழில் இயல்பாக உள்ளது. வினைச்சொல்லை இரண்டாம் முறை சேர்க்காமல், பெருங்குடலுக்குரிய கொழுப்புப் பகுதிகள் ‘காணிக்கை’யின் விளக்கப்பட்டியலாக வருமாறு அமைக்கப்பட்டுள்ளது.
  terminology: யாவே என்ற பெயர்ப்பயன்பாடு மூலத்தில் உள்ள יהוה-வைத் தக்கவைக்கிறது. ‘நெருப்பினால் செலுத்தப்படும் காணிக்கை’ அִשֶּׁה-வின் பாரம்பரியச் சடங்கு பயன்பாட்டை முதன்மை உரையில் தெளிவாக்குகிறது; ‘உணவுக் காணிக்கை’ என்ற மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
