base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/010.yaml
  text: and the two kidneys[a], and the fat that is on them, which is on the loins, and the appendage on the liver, which he shall remove with the kidneys.
translation:
  language: ta
  text: இரண்டு சிறுநீரகங்களையும், அவற்றின்மேல் இடுப்புப் பகுதியில் இருக்கும் கொழுப்பையும், கல்லீரலின் மேல் இருக்கும் நீட்சிப் பகுதியையும்[a] அவன் சிறுநீரகங்களுடன் சேர்த்து அகற்ற வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கல்லீரலின் மடல்.’ இந்த உடற்பகுதியைக் குறிக்கும் எபிரெயச் சொல்லின் (יֹתֶרֶת) துல்லியமான பொருள் உறுதியற்றது.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: இரண்டு சிறுநீரகங்கள்
  rationale: சடங்குப் பலியின் உடற்கூறியல் சூழலில் כְּלָיֹת என்பது தெளிவாகச் சிறுநீரகங்களைக் குறிக்கிறது.
- source_word: הַחֵלֶב
  choice: கொழுப்பு
  rationale: லேவியராகமத்தின் பலிச் சூழலில் חֵלֶב என்பது பலிக்காக ஒதுக்கப்பட்ட உட்புறக் கொழுப்பைக் குறிக்கிறது; நவீனத் தமிழில் ‘கொழுப்பு’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: אֲשֶׁר עֲלֵהֶן אֲשֶׁר עַל הַכְּסָלִים
  choice: அவற்றின்மேல் இடுப்புப் பகுதியில் இருக்கும்
  rationale: இவ்விரு தொடர்புச் சொற்றொடர்களும் கொழுப்பின் இருப்பிடத்தை விவரிக்கின்றன. כְּסָלִים குறிக்கும் இடுப்பு/விலாப்புறப் பகுதியை பொதுவாசகருக்கு இயல்பாக ‘இடுப்புப் பகுதி’ என வழங்குகிறது.
- source_word: הַיֹּתֶרֶת עַל הַכָּבֵד
  choice: கல்லீரல்மேல் இருக்கும் நீட்சிப் பகுதி
  rationale: יֹתֶרֶת குறிக்கும் துல்லியமான உடற்கூறு உறுப்பு உறுதியற்றது. ‘நீட்சிப் பகுதி’ என்பது குறிப்பிட்ட ஒரு கல்லீரல் மடல் என்று அளவுக்கு மீறித் துல்லியப்படுத்தாமல், அதனுடன் தொடர்புடைய உடற்பகுதியைக் குறிக்கிறது.
- source_word: עַל הַכְּלָיֹת יְסִירֶנָּה
  choice: சிறுநீரகங்களுடன் சேர்த்து அகற்ற வேண்டும்
  rationale: இச்சடங்கு வழிமுறையில் עַל என்பது சிறுநீரகங்களோடு இணைத்து அகற்றும் நடைமுறை உறவை வெளிப்படுத்துகிறது; יְסִירֶנָּה என்பதன் கட்டளைத் தன்மையை ‘அகற்ற வேண்டும்’ இயல்பாகத் தருகிறது.
