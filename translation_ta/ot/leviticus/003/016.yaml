id: LEV.3.16
reference: Leviticus 3:16
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/הִקְטִירָ֥/ם הַ/כֹּהֵ֖ן הַ/מִּזְבֵּ֑חָ/ה לֶ֤חֶם אִשֶּׁה֙ לְ/רֵ֣יחַ נִיחֹ֔חַ כָּל חֵ֖לֶב לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/016.yaml
  text: And the priest shall burn them on the altar as food[a], an offering made by fire for a pleasing aroma[c][b]. All the fat belongs to Yahweh.
translation:
  language: ta
  text: ஆசாரியன் அவற்றைப் பலிபீடத்தின்மேல் எரிக்க வேண்டும்; அவை நெருப்பினால் செலுத்தப்படும் பலியின் உணவாக, இனிய நறுமணத்திற்காகச் செலுத்தப்படுகின்றன. கொழுப்பு முழுவதும் யாவேவுக்குரியது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִקְטִירָם
  choice: அவற்றை ஆசாரியன் ... எரிக்க வேண்டும்
  rationale: பலிச் சூழலில் קטר என்பதன் ஹிஃபில் வடிவம், பலிபீடத்தில் எரித்துப் புகையாக எழச் செய்வதைக் குறிக்கிறது. 3ஆம் நபர் ஆண்பால் பன்மை பின்னொட்டு முந்தைய வசனங்களில் குறிப்பிடப்பட்ட பலிப் பகுதிகளைக் குறிக்கும் ‘அவற்றை’ எனப் பாதுகாக்கப்படுகிறது.
- source_word: הַמִּזְבֵּחָה
  choice: பலிபீடத்தின்மேல்
  rationale: திசை/இடத்தைக் குறிக்கும் வடிவம் இங்கு எரிப்பு நிகழும் இடமாகிய பலிபீடத்தின் மேற்பரப்பைக் குறிக்கிறது.
- source_word: לֶחֶם אִשֶּׁה
  choice: உணவாகவும், நெருப்பினால் செலுத்தப்படும் பலியாகவும்
  rationale: לֶחֶם இங்கு அப்பம் என்ற குறுகிய பொருளைவிட உணவு என்ற விரிந்த பலிசார் பொருளில் உள்ளது; אִשֶּׁה நெருப்பின் வழியாகச் செலுத்தப்படும் பலியைக் குறிக்கிறது. இரு கூறுகளும் இயல்பான தமிழில் தனித்தனியாகப் பாதுகாக்கப்பட்டுள்ளன.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: அது இனிய மணமாக இருக்கும்
  rationale: நிலையான பலிசார் சொற்றொடரின் மணம் என்ற உருவகம் நேரடியாகப் பாதுகாக்கப்படுகிறது; தெய்வீக ஏற்றுக்கொள்ளுதலை விளக்கமாகச் சேர்த்து உரையின் இறுக்கம் தீர்க்கப்படவில்லை.
- source_word: כָּל חֵלֶב
  choice: கொழுப்பு முழுவதும்
  rationale: כָּל என்பதன் முழுமை வலியுறுத்தப்படுகிறது; சூழலில் பலிக்கென ஒதுக்கப்பட்ட கொழுப்புப் பகுதிகள் குறிக்கப்படுகின்றன.
- source_word: לַיהוָה
  choice: யெகோவாவுக்கே உரியது
  rationale: לְ அர்ப்பணிப்பு அல்லது உரிமையைச் சுட்டுகிறது. ‘உரியது’ அந்த உறவை இயல்பான தமிழில் தெரிவிக்கிறது; ‘-க்கே’ ஒதுக்கப்பட்ட தன்மையைப் பாதுகாக்கிறது. יהוה என்பதற்கு தமிழில் பரவலாக அறியப்படும் நேரடி பெயர்வடிவமான ‘யெகோவா’ பயன்படுத்தப்படுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: எபிரெய உரை பொதுப்பட்டப்பெயரை அல்ல, நான்கெழுத்து உடன்படிக்கைப் பெயரை நேரடியாகக் கொண்டுள்ளது. அதை பட்டப்பெயராக மாற்றாமல் தமிழில் பரவலாக அறியப்படும் ‘யெகோவா’ என்ற பெயர்வடிவத்தில் பாதுகாக்கப்பட்டுள்ளது.
- issue: לְרֵיחַ נִיחֹחַ என்ற பலிசார் சூத்திரம்
  choice: இனிய மணமாக
  alternative: மனநிறைவளிக்கும் மணமாக; நறுமணமாக
  rationale: மணத்தைப் பற்றிய மூல உருவகம் பாதுகாக்கப்படுகிறது. ‘தேவனால் ஏற்றுக்கொள்ளப்படும்’ என்ற விளக்கத்தை உரைக்குள் சேர்க்காமல் அதன் இறையியல் நெருக்கடி அப்படியே விடப்படுகிறது.
- issue: לַיהוָה குறிக்கும் உறவு
  choice: யெகோவாவுக்கே உரியது
  alternative: யெகோவாவுக்கானது
  rationale: இது அர்ப்பணிப்பையும் உரிமையையும் குறிக்க இயலும். இயல்பான தமிழுக்காக ‘உரியது’ தேர்ந்தெடுக்கப்பட்டாலும், கொழுப்பு இறைவனுக்கே ஒதுக்கப்பட்டது என்ற மையக் கருத்தை மட்டும் வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான, கண்ணியமான தமிழ். ஆசாரியச் சடங்கு சார்ந்த ‘ஆசாரியன்’, ‘பலிபீடம்’, ‘பலி’ ஆகிய பரவலாகப் புரியும் சொற்கள் பயன்படுத்தப்பட்டுள்ளன. மூலத்தில் உள்ள பலிசார் உருவகமும் வாக்கியத்தின் வலியுறுத்தலும் பாதுகாக்கப்பட்டுள்ளன.
