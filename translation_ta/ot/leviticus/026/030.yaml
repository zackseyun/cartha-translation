  text: וְ/הִשְׁמַדְתִּ֞י אֶת בָּמֹֽתֵי/כֶ֗ם וְ/הִכְרַתִּי֙ אֶת חַמָּ֣נֵי/כֶ֔ם וְ/נָֽתַתִּי֙ אֶת פִּגְרֵי/כֶ֔ם עַל פִּגְרֵ֖י גִּלּוּלֵי/כֶ֑ם וְ/גָעֲלָ֥ה נַפְשִׁ֖/י אֶתְ/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/030.yaml
  text: And I will destroy your high places[a], and cut down your incense altars, and place your corpses on the carcasses of your idols[b], and my soul will abhor you.
translation:
  language: ta
  text: உங்கள் வழிபாட்டு மேடுகளை[a] நான் அழித்துப்போடுவேன்; உங்கள் தூபபீடங்களை[b] வெட்டித் தள்ளுவேன்; உங்கள் பிணங்களை உங்கள் சிலைகளின் பிணங்கள்மேல் போடுவேன்; என் ஆத்துமா உங்களை அருவருக்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல் பொய்த் தெய்வ வழிபாட்டுக்குப் பயன்படுத்தப்பட்ட உயர்ந்த இடங்கள் அல்லது மேடுகளைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘உங்கள் சூரியத் தூண்கள்.’ எபிரெயச் சொல் முறையற்ற வழிபாட்டுடன் தொடர்புடைய பொருளைக் குறிக்கிறது; அதன் துல்லியமான வடிவம் விவாதத்திற்குரியது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשְׁמַדְתִּי
  choice: அழித்துப்போடுவேன்
  rationale: ஹிஃபில் வடிவம் முழுமையான அழிவை உண்டாக்குவதைக் குறிக்கிறது; இச்சூழலில் வலிமையும் இயல்பும் கொண்ட தமிழாக்கம்.
- source_word: בָּמֹתֵיכֶם
  choice: உங்கள் மேடுகளை
  rationale: במות என்பது வழிபாட்டுக்குரிய உயர்ந்த இடங்கள் அல்லது மேடுகளைக் குறிக்கும். சுருக்கமான முதன்மை மொழிபெயர்ப்பு; அதன் வழிபாட்டுப் பொருள் அடிக்குறிப்பில் தெளிவாக்கப்படுகிறது.
- source_word: הִכְרַתִּי
  choice: வெட்டித் தள்ளுவேன்
  rationale: כרת என்பதன் வெட்டுதல்/அகற்றுதல் என்ற நேரடியான படிமத்தை வழிபாட்டுப் பொருட்கள் தொடர்பில் பாதுகாக்கிறது.
- source_word: חַמָּנֵיכֶם
  choice: உங்கள் தூபபீடங்களை
  rationale: இச்சொல் சூரிய வழிபாட்டுத் தூண்கள் அல்லது தூபம் தொடர்பான வழிபாட்டுப் பொருட்களைக் குறிக்கலாம்; சரியான வடிவம் விவாதத்திற்குரியதால் வாசிக்க எளிய செயல்பாட்டு மொழிபெயர்ப்பு தேர்ந்தெடுக்கப்பட்டது.
- source_word: פִּגְרֵיכֶם ... פִּגְרֵי גִּלּוּלֵיכֶם
  choice: உங்கள் பிணங்களை உங்கள் சிலைகளின் பிணங்கள்மேல்
  rationale: פגר என்ற ஒரே சொல் மனிதர்களுக்கும் சிலைகளுக்கும் பயன்படுத்தப்படுவதைத் தமிழிலும் மீளுரைப்பதன் மூலம், சிலைகளின் உயிரற்ற தன்மையையும் அவமானத்தையும் பாதுகாக்கிறது.
- source_word: גִּלּוּלֵיכֶם
  choice: உங்கள் சிலைகள்
  rationale: இச்சொல் இகழ்ச்சியுணர்வு கொண்ட விக்கிரகங்களைக் குறிக்கிறது. இயல்பான நவீன தமிழில் ‘சிலைகள்’ தெளிவாக உள்ளது; சூழல் அதன் கண்டனத்தன்மையை வெளிப்படுத்துகிறது.
- source_word: גָעֲלָה נַפְשִׁי אֶתְכֶם
  choice: என் ஆத்துமா உங்களை அருவருக்கும்
  rationale: ‘என் ஆத்துமா’ என்ற மூலத்தின் வெளிப்பாட்டைத் தக்கவைத்து, தெய்வீக வெறுப்பின் தீவிரத்தையும் மானுடவுருவக மொழியின் இறையியல் பதற்றத்தையும் பாதுகாக்கிறது.
theological_decisions:
- issue: தெய்வீக அருவருப்பைக் குறிக்கும் மானுடவுருவக வெளிப்பாடு
  choice: என் ஆத்துமா உங்களை அருவருக்கும்
  alternative: நான் உங்களை அருவருப்பேன்
  rationale: נפשי என்பதைக் கைவிடாமல் மொழிபெயர்ப்பது மூலத்தின் தீவிரமான உடன்படிக்கைச் சார்ந்த நிராகரிப்பையும் அதன் இறையியல் பதற்றத்தையும் சமப்படுத்தாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கடுமையான தீர்ப்புத் தொனியும் மூலத்தின் மீளுரைப்பும் பாதுகாக்கப்பட்டுள்ளன. ‘ஆத்துமா’ என்பது இங்கு மரியாதைமிக்க வேதாகம நடையில் மூலத்தின் נֶפֶשׁ வெளிப்பாட்டைத் தக்கவைக்கிறது; ‘மேடுகள்’ என்ற சொல் அடிக்குறிப்பால் வழிபாட்டுச் சூழலில் விளக்கப்படுகிறது.
