revisions:
- from: உங்கள் மேடுகளை[a] நான் அழித்துப்போடுவேன்; உங்கள் தூபபீடங்களை வெட்டித் தள்ளுவேன்; உங்கள் பிணங்களை உங்கள் சிலைகளின் பிணங்கள்மேல் போடுவேன்[b]; என் ஆத்துமா உங்களை அருவருக்கும்.
  to: உங்கள் வழிபாட்டு மேடுகளை[a] நான் அழித்துப்போடுவேன்; உங்கள் தூபபீடங்களை[b] வெட்டித் தள்ளுவேன்; உங்கள் பிணங்களை உங்கள் சிலைகளின் பிணங்கள்மேல் போடுவேன்; என் ஆத்துமா உங்களை அருவருக்கும்.
