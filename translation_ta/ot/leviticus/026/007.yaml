  yaml_path: translation/ot/leviticus/026/007.yaml
  text: You will pursue your enemies[a], and they will fall before you by the sword.
translation:
  language: ta
  text: நீங்கள் உங்கள் பகைவர்களைத் துரத்துவீர்கள்; அவர்கள் உங்கள் முன்னே வாளால் வீழ்வார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள் உங்கள் முன்னே வாளுக்கு வீழ்வார்கள்.” எபிரேயத் தொடரை அதன் இலக்கண அமைப்பின்படி ஒன்றுக்கு மேற்பட்ட விதத்தில் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּרְדַפְתֶּם
  choice: நீங்கள் ... துரத்துவீர்கள்
  rationale: רדף என்பதன் அடிப்படைப் பொருள் ‘துரத்து, பின்தொடர்ந்து செல்’ என்பதாகும். போர்ச் சூழலில் ‘துரத்துவீர்கள்’ என்பது இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: אֹיְבֵיכֶם
  choice: உங்கள் பகைவர்களை
  rationale: אויב என்பது ‘பகைவர்’ என்பதற்கான வழக்கமான எபிரெயச் சொல்; பன்மையையும் இரண்டாம் நபர் பன்மை உடைமை விகுதியையும் இத்தொடர் நேரடியாகக் காட்டுகிறது.
- source_word: וְנָפְלוּ
  choice: அவர்கள் ... வீழ்வார்கள்
  rationale: נפל என்பதன் நேரடிப் பொருள் ‘விழு/வீழ்.’ போரில் தோல்வி அல்லது மரணத்தையும் இது குறிக்கக்கூடும்; ‘வீழ்வார்கள்’ மூல உருவகத்தையும் அதன் பொருள் விரிவையும் காக்கிறது.
- source_word: לִפְנֵיכֶם
  choice: உங்கள் முன்னே
  rationale: לפני என்பது இங்கு ‘உங்கள் முன்பாக/உங்கள் முன்னிலையில்’ என்று பொருள்படும். ‘உங்கள் முன்னே’ என்பது சுருக்கமான, இயல்பான தமிழாக்கம்.
- source_word: לֶחָרֶב
  choice: வாளால்
  rationale: חרב என்பது ‘வாள்.’ அதற்கு முன் வரும் ל போர்ச் சூழலில் விளைவு அல்லது கருவியைக் குறிக்கலாம்; ‘வாளால்’ என்பது தமிழில் இயல்பாக இருந்து, ஆயுதத்தால் அவர்கள் வீழ்வதைத் தெரிவிக்கிறது.
