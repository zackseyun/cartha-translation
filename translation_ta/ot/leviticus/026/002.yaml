base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/002.yaml
  text: You shall keep my Sabbaths and revere my sanctuary[a]; I am Yahweh.
translation:
  language: ta
  text: என் ஓய்வுநாட்களை நீங்கள் கடைப்பிடிக்க வேண்டும்; என் பரிசுத்த இடத்தைப் பயபக்தியுடன் மதிக்க வேண்டும்[a]. நான் யாவே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் பரிசுத்த இடத்தை அஞ்ச வேண்டும்,” அல்லது “என் பரிசுத்த இடத்தைப் பிரமிப்புடன் மதிக்க வேண்டும்.” எபிரெய வினைச்சொல் சூழலைப் பொறுத்து அச்சம், பயபக்தி, அல்லது பிரமிப்பை வெளிப்படுத்தலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁבְּתֹתַי
  choice: என் ஓய்வுநாட்கள்
  rationale: முதல் நபர் ஒருமை உடைமை விகுதியுடன் வரும் பன்மையைத் தக்கவைத்து, வாராந்திர ஓய்வுநாள் உட்பட யாவேக்குரிய பரிசுத்த ஓய்வுக் காலங்களின் பரப்பை வெளிப்படுத்துகிறது.
- source_word: תִּשְׁמֹרוּ
  choice: கடைப்பிடிக்க வேண்டும்
  rationale: கட்டளைகளையும் பரிசுத்த காலங்களையும் கவனமாகக் காத்து அனுசரிப்பது என்ற שׁמר என்பதன் உடன்படிக்கைச் சூழல் பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: וּמִקְדָּשִׁי
  choice: என் பரிசுத்த இடத்திற்கு
  rationale: מִקְדָּשׁ என்பது பரிசுத்தமாக்கப்பட்ட இடம் அல்லது சரணாலயத்தைக் குறிக்கிறது; இங்கு தேவனுடைய பரிசுத்த வாசஸ்தலத்தைக் குறிக்கும் இயல்பான பொதுத் தமிழ் சொற்றொடர் பயன்படுத்தப்பட்டுள்ளது.
- source_word: תִּירָאוּ
  choice: பயபக்தி காட்ட வேண்டும்
  rationale: ירא என்பதில் உள்ள பயம், ஆழ்ந்த மரியாதை, பிரமிப்பு ஆகிய பொருள் பரப்பை ‘பயபக்தி’ சுருக்கமாகத் தக்கவைக்கிறது; வெறும் அச்சம் என்று மட்டும் பொருள் குறுகுவதைத் தவிர்க்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான יהוה-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், நவீன தமிழில் வழக்கமான ஒலிபெயர்ப்பாகத் தருகிறது.
- source_word: אֲנִי יְהוָה
  choice: நான் யாவே
  rationale: கட்டளைகளுக்கு அடிப்படையாக நிற்கும் பேச்சாளரின் வலியுறுத்தப்பட்ட தெய்வீகத் தன்னடையாளத்தை நேரடியாகத் தக்கவைக்கிறது.
theological_decisions:
- issue: יהוה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக இருப்பதால், அதை ஒரு பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்ப்பது உடன்படிக்கைப் பெயரைத் தக்கவைக்கிறது.
- issue: பரிசுத்த இடத்தை நோக்கிய ירא வினையின் வலிமை
  choice: பயபக்தி காட்ட வேண்டும்
  alternative: அஞ்ச வேண்டும் / பிரமிப்புடன் மதிக்க வேண்டும்
  rationale: கட்டளை வெறும் உணர்ச்சிசார் அச்சத்தை மட்டுமல்ல, தேவனுடைய பரிசுத்த இடத்திற்குரிய ஆழ்ந்த மரியாதையையும் பயத்தையும் கோருகிறது; ‘பயபக்தி’ இந்த இறையியல் அழுத்தத்தைத் திறந்தவாறு வைத்திருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட கட்டளை நடையில் வடிவமைக்கப்பட்டது. ‘ஓய்வுநாட்கள்’ என்ற பன்மையும், ‘பயபக்தி’ என்பதிலுள்ள பொருள் பதற்றமும் தக்கவைக்கப்பட்டுள்ளன.
