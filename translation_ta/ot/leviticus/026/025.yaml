base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/025.yaml
  text: And I will bring against you a sword executing the vengeance of the covenant[a], and you will be gathered into your cities. Then I will send pestilence among you, and you will be given into the hand of the enemy.
translation:
  language: ta
  text: உடன்படிக்கையின் பழிவாங்குதலை நிறைவேற்றும் வாளை உங்களுக்கு எதிராக வரச்செய்வேன்[a]. நீங்கள் உங்கள் நகரங்களுக்குள் ஒன்றுகூட்டப்படுவீர்கள். அப்போது உங்கள் நடுவில் கொள்ளைநோயை அனுப்புவேன்; நீங்கள் பகைவரின் கையில் ஒப்புக்கொடுக்கப்படுவீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உடன்படிக்கைக்காகப் பழிவாங்கும் வாளை” அல்லது “உடன்படிக்கையை மீறியதற்குப் பழிவாங்கும் வாளை.” எபிரெயில் சொல்லுக்கு சொல், “உடன்படிக்கையின் பழிவாங்குதலைப் பழிவாங்கும் வாள்”; இந்த வலியுறுத்தும் சொற்றொடர் வாளை உடன்படிக்கைத் தீர்ப்போடு இணைக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבֵאתִי עֲלֵיכֶם חֶרֶב
  choice: வாளை உங்களுக்கு எதிராக வரச்செய்வேன்
  rationale: הֵבֵאתִי என்பது בוא வினையின் ஹிஃபில் வடிவம்; காரணவினைப் பொருளைத் தெளிவாகக் காட்ட “வரச்செய்வேன்” என்றும், தீர்ப்பின் பகைமைச் சூழலைக் காட்ட עֲלֵיכֶם என்பதற்கு “உங்களுக்கு எதிராக” என்றும் மொழிபெயர்க்கப்பட்டது.
- source_word: נֹקֶמֶת נְקַם בְּרִית
  choice: உடன்படிக்கையின் பழிவாங்குதலை நிறைவேற்றும்
  rationale: வினையெச்சமும் அதே வேரிலான பெயர்ச்சொல்லும் சேர்ந்துள்ள எபிரெய வலியுறுத்தலை இயல்பான தமிழில் “பழிவாங்குதலை நிறைவேற்றும்” எனக் காட்டுகிறது; בְּרִית உடனான சார்பு “உடன்படிக்கையின்” என்று பாதுகாக்கப்படுகிறது.
- source_word: וְנֶאֱסַפְתֶּם אֶל עָרֵיכֶם
  choice: நீங்கள் உங்கள் நகரங்களுக்குள் ஒன்றுகூட்டப்படுவீர்கள்
  rationale: நிஃபால் செயப்பாட்டு வடிவத்தை “ஒன்றுகூட்டப்படுவீர்கள்” எனப் பாதுகாத்து, முற்றுகையின்போது நகரங்களுக்குள் செல்லும் இயக்கத்தை “நகரங்களுக்குள்” வெளிப்படுத்துகிறது.
- source_word: וְשִׁלַּחְתִּי דֶבֶר בְּתוֹכְכֶם
  choice: அப்போது உங்கள் நடுவில் கொள்ளைநோயை அனுப்புவேன்
  rationale: דֶבֶר என்பது உடன்படிக்கைச் சாபச் சூழலில் பரவும் கொடிய நோயைக் குறிக்கிறது; நவீனத் தமிழில் மரியாதையான வேதாகம நடையுடன் “கொள்ளைநோய்” பொருத்தமானது. தொடர்ச்சியை “அப்போது” தெளிவாக்குகிறது.
- source_word: וְנִתַּתֶּם בְּיַד אוֹיֵב
  choice: நீங்கள் பகைவரின் கையில் ஒப்புக்கொடுக்கப்படுவீர்கள்
  rationale: נִתַּתֶּם என்பதன் செயப்பாட்டு பொருளையும், “கையில்” என்ற அதிகாரம் அல்லது கட்டுப்பாட்டைக் குறிக்கும் எபிரெய மரபுத்தொடரையும் பாதுகாக்கிறது.
theological_decisions:
- issue: “உடன்படிக்கையின் பழிவாங்குதல்” என்பதன் பொருள்
  choice: உடன்படிக்கையின் பழிவாங்குதலை நிறைவேற்றும்
  alternative: உடன்படிக்கைக்காகப் பழிவாங்கும்; உடன்படிக்கையை மீறியதற்குப் பழிவாங்கும்
  rationale: எபிரெய சார்புத்தொடர், உடன்படிக்கையே தீர்ப்பின் அடிப்படையா, அதன் சார்பில் பழிவாங்கப்படுகிறதா, அல்லது உடன்படிக்கை விதித்த தண்டனைகளா என்பதை முழுமையாகப் பிரித்துத் தீர்மானிக்கவில்லை. ஆகவே அந்த இறையியல் நெருக்கடியை முதன்மை உரை பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. “வாள்,” “கொள்ளைநோய்,” “பகைவரின் கையில்” ஆகியவை மூலத்தின் தீர்ப்பு மற்றும் முற்றுகைச் சித்திரங்களைப் பாதுகாக்கின்றன; அடிக்குறிப்பு உண்மையான இலக்கண-இறையியல் தெளிவின்மையைச் சுட்டுகிறது.
