  text: וְ/רָדְפ֨וּ מִ/כֶּ֤ם חֲמִשָּׁה֙ מֵאָ֔ה וּ/מֵאָ֥ה מִ/כֶּ֖ם רְבָבָ֣ה יִרְדֹּ֑פוּ וְ/נָפְל֧וּ אֹיְבֵי/כֶ֛ם לִ/פְנֵי/כֶ֖ם לֶ/חָֽרֶב׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/008.yaml
  text: Five of you will chase a hundred[a], and a hundred of you will chase ten thousand[b], and your enemies will fall before you by the sword.
translation:
  language: ta
  text: உங்களில் ஐந்து பேர் நூறு பேரைத் துரத்துவார்கள்[a]; உங்களில் நூறு பேர் பத்தாயிரம் பேரைத் துரத்துவார்கள்[b]; உங்கள் பகைவர்கள் உங்கள் முன் வாளால் வீழ்வார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “துரத்துவார்கள்” என்பதற்கு “விரட்டுவார்கள்” என்றும் மொழிபெயர்க்கலாம்; இது இரண்டு வாக்கியங்களுக்கும் பொருந்தும்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயச் சொல் רְבָבָה “பத்தாயிரம்” அல்லது “எண்ணிறந்த பெருந்தொகை” எனப் பொருள்படலாம்; இங்குள்ள எண்ணியல் இணை அமைப்புக்கு “பத்தாயிரம்” பொருத்தமாக உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָדְפוּ / יִרְדֹּפוּ
  choice: துரத்துவார்கள்
  rationale: רדף என்பது பின்தொடர்ந்து துரத்துதல் அல்லது விரட்டுதல் எனப் பொருள்படும். இங்குள்ள போர்ச் சூழலில் “துரத்துவார்கள்” இயல்பாகவும் இரு இணை வாக்கியங்களுக்கும் பொருத்தமாகவும் உள்ளது.
- source_word: מִכֶּם
  choice: உங்களில்
  rationale: 'מן இங்கு பகுதியைக் குறிக்கிறது: இஸ்ரவேலரில் ஐந்து பேர், நூறு பேர் என்பதே பொருள்; இடத்திலிருந்து பிரிவதைக் குறிக்கவில்லை.'
- source_word: חֲמִשָּׁה מֵאָה
  choice: உங்களில் ஐந்து பேர் நூறு பேரை
  rationale: எபிரெய எண்களின் நேரடியான உறவைத் தெளிவான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: רְבָבָה
  choice: பத்தாயிரம் பேர்
  rationale: רְבָבָה என்பதற்கு பத்தாயிரம் அல்லது எண்ணிறந்த பெருந்தொகை என்ற பொருள் வரலாம். இங்கு ஐந்து—நூறு, நூறு—பத்தாயிரம் என்ற எண்ணியல் இணை அமைப்பு இருப்பதால் “பத்தாயிரம்” பொருத்தமானது; மனித எதிரிகள் மறைமுகமாக உள்ளதால் “பேர்” சேர்க்கப்பட்டுள்ளது.
- source_word: וְנָפְלוּ
  choice: வீழ்வார்கள்
  rationale: נפל என்பதன் ‘விழுதல்/வீழ்தல்’ என்ற உருவகத்தைப் பாதுகாத்து, போரில் தோற்று உயிரிழப்பதையும் இயல்பாக உணர்த்துகிறது.
- source_word: אֹיְבֵיכֶם
  choice: உங்கள் பகைவர்கள்
  rationale: போர்ச் சூழலில் אויב என்பதற்கான தெளிவான, வழக்கமான தமிழ் இணை.
- source_word: לִפְנֵיכֶם
  choice: உங்கள் முன்
  rationale: இது அவர்கள் பார்வையில் இருப்பதை மட்டும் அல்லாமல், அவர்களுக்கு எதிராகப் போரிட்டு தோல்வியடைவதைக் குறிக்கும் எபிரெய மரபுத்தொடரை நெருக்கமாகப் பாதுகாக்கிறது.
- source_word: לֶחָרֶב
  choice: வாளால்
  rationale: לְ இங்கு கருவி அல்லது வழிமுறையைக் குறிக்கிறது. “வாளால்” என்பது போரில் ஆயுதத்தால் வீழ்வதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: 'உடன்படிக்கை ஆசீர்வாதத்திலுள்ள மிகுதியான போர்வெற்றி: மிகைப்படுத்தலா அல்லது சொல்லுக்குச் சொல் வாக்குறுதியா'
  choice: விகிதாசாரத்தை மென்மைப்படுத்தாமல் நேரடியான போர்வெற்றி வாக்குறுதியாக மொழிபெயர்த்தல்
  alternative: இதனை குறிப்பிட்ட எண்ணிக்கையற்ற பொதுவான ஊக்கவுரையாக மாற்றுதல்
  rationale: லேவியராகமம் 26-ன் உடன்படிக்கை ஆசீர்வாதச் சூழல், மிகக் குறைந்தோர் மிகப் பலரைத் துரத்தும் உறுதியான படிமத்தை முன்வைக்கிறது. மொழிபெயர்ப்பு அது எவ்வாறு நிறைவேறும் அல்லது எண்கள் எவ்வாறு புரிந்துகொள்ளப்பட வேண்டும் என்பதைத் தீர்மானிக்காமல் அந்த அழுத்தத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. “உங்களில்” பகுதியைக் குறிக்கும் அமைப்பைப் பாதுகாக்கிறது; “உங்கள் முன் வாளால் வீழ்வார்கள்” எபிரெயப் போர்ப்படிமத்தை விளக்கவுரையின்றி தக்கவைக்கிறது.
