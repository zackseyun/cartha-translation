  to: அப்போது நான் உங்களுக்கு மழைகளை அவற்றுக்குரிய காலத்தில் தருவேன்[a]. நிலம் தன் விளைச்சலைத் தரும்; வயலில் உள்ள மரம்[b] தன் கனியைத் தரும்.
