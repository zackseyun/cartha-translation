source:
  edition: WLC
  text: וְ/נָתַתִּ֥י גִשְׁמֵי/כֶ֖ם בְּ/עִתָּ֑/ם וְ/נָתְנָ֤ה הָ/אָ֨רֶץ֙ יְבוּלָ֔/הּ וְ/עֵ֥ץ הַ/שָּׂדֶ֖ה יִתֵּ֥ן פִּרְיֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/004.yaml
  text: then I will give you your rains in their season[a], and the land will yield its produce[b], and the tree of the field will give their fruit.
translation:
  language: ta
  text: அப்போது நான் உங்களுக்கு மழைகளை அவற்றுக்குரிய காலத்தில் தருவேன்[a]. நிலம் தன் விளைச்சலைத் தரும்; வயலில் உள்ள மரம்[b] தன் கனியைத் தரும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவற்றின் சரியான நேரத்தில்” அல்லது “உரிய பருவத்தில்.”
    reason: lexical_alternative
  - marker: b
    text: எபிரேயத்தில் “வயலில் உள்ள மரம்” என்பது ஒருமை வடிவில் உள்ளது; ஆனால் அது மரங்களைப் பொதுவாகக் குறிக்கும் கூட்டுப்பொருள் கொண்டது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: நான் ... தருவேன்
  rationale: נתן என்பதன் நேரடியான பொருள் ‘கொடு/தரு.’ உடன்படிக்கை வாக்குறுதியை விளக்கிச் சேர்க்காமல் இயல்பாக வெளிப்படுத்த ‘தருவேன்’ பயன்படுத்தப்பட்டது.
- source_word: גִשְׁמֵיכֶם
  choice: உங்களுக்கான மழைகள்
  rationale: எபிரேயப் பன்மை பருவந்தோறும் கிடைக்கும் மழைப்பொழிவுகளைக் குறிக்கிறது; இரண்டாம் நபர் பன்மை உரிமை விகுதி, இஸ்ரவேலருக்காக அளிக்கப்படும் மழை என்ற பொருளில் இயல்பான தமிழில் தரப்பட்டது.
- source_word: בְּעִתָּם
  choice: அவற்றுக்குரிய காலத்தில்
  rationale: மழைகள் பெய்ய வேண்டிய பொருத்தமான நேரத்தை இது குறிக்கிறது. பன்மை மழைகளோடு உள்ள தொடர்பையும் வேளாண்மைச் சூழலையும் இச்சொற்றொடர் காக்கிறது.
- source_word: וְנָתְנָה הָאָרֶץ
  choice: நிலம் ... தரும்
  rationale: சொல்லாட்சியில் ‘நிலம் கொடுக்கும்’ என்பதே உள்ளது. தமிழில் விளைச்சலைத் தருவது என்ற வழக்கு இயல்பாக இருப்பதால், נתן வினையின் மறுபயன்பாடும் காக்கப்பட்டது.
- source_word: יְבוּלָהּ
  choice: தன் விளைச்சல்
  rationale: יבול என்பது நிலத்தின் உற்பத்தி அல்லது விளைச்சலைக் குறிக்கிறது. குறிப்பிட்ட ஒரு பயிராக வரையறுக்காமல் வேளாண் பலனைப் பரந்த விதத்தில் தெரிவிக்கிறது.
- source_word: וְעֵץ הַשָּׂדֶה
  choice: வயல்வெளி மரம்
  rationale: மூலத்தில் ஒருமை வடிவம் கூட்டுப்பொருளில் வருகிறது. அதை தமிழிலும் பொதுமையான ஒருமையாக வைத்து, அதன் கூட்டுப்பொருளை அடிக்குறிப்பில் தெளிவுபடுத்தப்பட்டது.
- source_word: יִתֵּן פִּרְיוֹ
  choice: தன் கனியைத் தரும்
  rationale: נתן என்ற ‘தரு’ வினை இங்கும் வருவதால், வசனத்திலுள்ள சொல் மறுபயன்பாடு காக்கப்பட்டது; ஒருமை மரத்துடன் பொருந்த ‘தன் கனி’ என வழங்கப்பட்டது.
theological_decisions:
- issue: கீழ்ப்படிதலோடு தொடர்புடைய உடன்படிக்கை ஆசீர்வாதத்தின் வேளாண்மை மொழி
  choice: மழையையும் நிலம் மற்றும் மரங்களின் பலனையும் குறித்த இறை வாக்குறுதியாக நேரடியாக மொழிபெயர்க்கப்பட்டது.
  alternative: இதை எல்லாக் காலங்களுக்கும் பொருந்தும் பொருளாதாரச் செழிப்பு வாக்குறுதியாக விரிவுபடுத்துவது அல்லது முழுவதும் உருவகமான ஆவிக்குரிய வளமாக மாற்றுவது.
  rationale: லேவியராகமம் 26-ன் சூழலில் இவை உடன்படிக்கை ஆசீர்வாதங்களாகிய உண்மையான மழை மற்றும் வேளாண் செழிப்பைக் குறிக்கின்றன. பிற்காலக் கோட்பாட்டு பயன்பாடுகளை வசனத்தில் சேர்க்காமல் அந்தத் திடமான பொருள் காக்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. ‘தரும்’ என்ற வினையின் மறுபயன்பாடு மூலத்தின் இலக்கிய இணைப்பைக் காக்கிறது; ‘வயல்வெளி மரம்’ என்ற ஒருமைப் பொதுப்பெயர் உண்மையான எபிரேயக் கூட்டுப்பொருளை மறைக்காமல் வைத்துள்ளது.
