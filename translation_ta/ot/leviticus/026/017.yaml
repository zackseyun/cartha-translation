base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/017.yaml
  text: And I will set my face against you[a], and you will be struck down before your enemies; those who hate you will rule over you[c][b], and you will flee when no one is pursuing you.
translation:
  language: ta
  text: நான் என் முகத்தை உங்களுக்கு எதிராகத் திருப்புவேன்[a]. உங்கள் பகைவர்களுக்கு முன் நீங்கள் வீழ்த்தப்படுவீர்கள்[b]. உங்களை வெறுப்பவர்கள் உங்களை ஆள்வார்கள்; யாரும் உங்களைத் துரத்தாத நிலையிலும்[c] நீங்கள் தப்பியோடுவீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘என் முகத்தை உங்களுக்கு எதிராகத் திருப்புவேன்’ என்பது தீர்ப்பில் உறுதியாக எதிர்த்து நிற்பதைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: cultural_note
  - marker: b
    text: அல்லது, ‘நீங்கள் தோற்கடிக்கப்படுவீர்கள்.’
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘யாரும் உங்களைத் துரத்தாதபோது.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי פָנַי בָכֶם
  choice: நான் என் முகத்தை உங்களுக்கு எதிராக நிலைநிறுத்துவேன்
  rationale: ‘முகம்’ என்ற எபிரெய உருவகத்தைத் தக்கவைத்து, தீர்ப்பில் கடவுள் உறுதியாக எதிர்த்து நிற்பதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְנִגַּפְתֶּם
  choice: நீங்கள் வீழ்த்தப்படுவீர்கள்
  rationale: போரில் தாக்கப்பட்டு முறியடிக்கப்படுதல் அல்லது தோற்கடிக்கப்படுதல் என்ற நிபால் வினையின் வலிமையைத் தக்கவைக்கிறது.
- source_word: לִפְנֵי אֹיְבֵיכֶם
  choice: உங்கள் பகைவர்களுக்குமுன்
  rationale: இடம் மற்றும் போர்த் தோல்வி ஆகிய இரு நுண்ணுணர்வுகளையும் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: וְרָדוּ בָכֶם
  choice: உங்களை ஆள்வார்கள்
  rationale: ரדה என்பதன் ஆட்சி செலுத்துதல் என்ற அடிப்படைப் பொருளைத் தருகிறது; கொடுமையின் அளவை உரை கூறுவதற்கும் மேலாக வலுப்படுத்தவில்லை.
- source_word: שֹׂנְאֵיכֶם
  choice: உங்களை வெறுப்பவர்கள்
  rationale: முன்னர் வரும் ‘பகைவர்கள்’ என்பதிலிருந்து வேறுபட்டு, வெறுப்பவர்களைக் குறிக்கும் எபிரெயப் பங்கேற்பு வடிவத்தைத் தெளிவாகப் பிரதிபலிக்கிறது.
- source_word: וְנַסְתֶּם
  choice: நீங்கள் தப்பியோடுவீர்கள்
  rationale: அச்சத்தால் ஓடுதல் என்ற போர்ச் சூழலுக்குரிய பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: וְאֵין רֹדֵף אֶתְכֶם
  choice: யாரும் உங்களைத் துரத்தாதபோதும்
  rationale: உண்மையில் துரத்துபவர் இல்லாத நிலையிலும் அச்சத்தால் ஓடுவார்கள் என்ற முரண்பாட்டைத் தெளிவாக வெளிப்படுத்துகிறது; எபிரெயத் தொடரை காலவாக்கியமாகவும் புரிந்துகொள்ள முடியும் என்பதால் மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: தீர்ப்பில் கடவுளைப் பற்றிய மனித உருவக மொழி
  choice: ‘என் முகத்தை உங்களுக்கு எதிராக நிலைநிறுத்துவேன்’ என்று உருவகத்தைத் தக்கவைத்தல்
  alternative: ‘நான் உங்களை எதிர்ப்பேன்’
  rationale: இது வெறும் பகைமையை மட்டும் அல்லாமல், உடன்படிக்கை உறவில் கடவுள் தனிப்பட்ட முறையில் உறுதியாக எதிர்த்து நிற்பதையும் வெளிப்படுத்துகிறது.
- issue: பகைவர்களின் கட்டுப்பாட்டின் தன்மை
  choice: ‘உங்களை ஆள்வார்கள்’
  alternative: ‘உங்களை அடக்கி ஆதிக்கம் செலுத்துவார்கள்’
  rationale: தண்டனையாக வரும் கீழ்ப்படிதலை உரை உறுதிப்படுத்துகிறது; ஆனால் இந்தச் சொற்றொடரில் சொல்லப்படாத கொடுமையின் அளவை மொழிபெயர்ப்பு சேர்க்கவில்லை.
