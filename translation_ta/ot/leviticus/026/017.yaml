  source_fidelity: 'மூல எபிரெய வாக்கியத்தின் வரிசையும் பொருளும் பாதுகாக்கப்பட்டுள்ளன: இறைவனின் உறுதியான எதிர்நிலை, பகைவர்களுக்கு முன்பான தோல்வி, வெறுப்பவர்களின் ஆட்சி, துரத்துபவர் இல்லாமலேயே ஓடுதல் ஆகிய அனைத்தும் உள்ளன. ஆனால் ‘என் முகத்தை ... நிலைநிறுத்துவேன்’ என்பது இச்சூழலில் தமிழில் சற்றே செயற்கையாக உள்ளது; ‘திருப்புவேன்’ என்பது மூலத்தின் மனிதஉருவகத்தையும் தீர்ப்பின் எதிர்நிலையையும் இயல்பாகத் தருகிறது.'
  naturalness: ‘என் முகத்தை உங்களுக்கு எதிராகத் திருப்புவேன்’ நவீன தரத் தமிழில் அதிக இயல்பானது. மற்ற வாக்கியங்கள் தெளிவாகவும் கண்ணியமான வேதாகம நடையிலும் உள்ளன. இறுதிப் பிரிவில் ‘நிலையிலும்’ என்பது மூலத்தின் ‘துரத்துபவர் இல்லை’ என்ற நிலையைத் தெளிவாகக் காட்டி, சூழலுக்கேற்ற முரணையும் காக்கிறது.
