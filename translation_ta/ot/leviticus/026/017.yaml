  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘முகம்’ என்ற மூல உருவகமும், ‘பகைவர்கள்’/‘வெறுப்பவர்கள்’ என்ற சொற்பொருள் வேறுபாடும் பாதுகாக்கப்பட்டுள்ளன.
