base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/013.yaml
  text: I am Yahweh your God[a], who brought you out of the land of Egypt, from being their servants[c][b]; I broke the bars of your yoke and made you walk upright.
translation:
  language: ta
  text: “நானே உங்கள் கடவுளான யாவே; எகிப்து நாட்டிலிருந்து, அவர்களுக்கு அடிமைகளாக இருந்த உங்களை வெளியே கொண்டுவந்தேன். உங்கள் நுகத்தடிகளை முறித்து, உங்களை நிமிர்ந்து நடக்கச் செய்தேன்.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்களைத் தலைநிமிர்ந்து நடக்கச் செய்தேன்.”
    reason: קוֹמְמִיּוּת என்பதன் நிமிர்ந்த உடல்நிலையையும் மீட்டளிக்கப்பட்ட கண்ணியத்தையும் இயல்பான தமிழ் மரபுத்தொடரில் வெளிப்படுத்தும் மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப் பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், அதன் தனிப்பெயர் தன்மையைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אֱלֹהֵיכֶם
  choice: உங்கள் கடவுள்
  rationale: உடன்படிக்கைச் சூழலில் இச்சொல் ஒருமையில் யாவேவைக் குறிக்கிறது.
- source_word: הוֹצֵאתִי
  choice: வெளியே கொண்டுவந்தேன்
  rationale: יצא என்பதன் ஹிஃபில் வடிவிலுள்ள காரணவினைப் பொருளையும் எகிப்திலிருந்து விடுவித்துச் சென்ற நிகழ்வையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: எகிப்து நாட்டில் ... அங்கிருந்து
  rationale: எபிரெயச் சொற்றொடரின் புறப்பாட்டு இயக்கத்தைத் தமிழில் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: מִהְיוֹת לָהֶם עֲבָדִים
  choice: அவர்களுக்கு அடிமைகளாக இருந்த உங்களை
  rationale: எகிப்தியரின் கட்டாய அடிமைத்தனத்திலிருந்து விடுவிக்கப்பட்ட நிலையை மென்மைப்படுத்தாமல் காட்டுகிறது.
- source_word: מֹטֹת עֻלְּכֶם
  choice: உங்கள் நுகத்தடிகள்
  rationale: நுகத்தின் பாரத்தைத் தாங்கும் அல்லது இணைக்கும் தடிகள் என்ற concrete உருவகத்தைச் சுருக்கமான தமிழில் காக்கிறது.
- source_word: וָאוֹלֵךְ אֶתְכֶם
  choice: உங்களை ... நடக்கச் செய்தேன்
  rationale: הלך என்பதன் ஹிஃபில் காரணவினைத் தன்மையை நேரடியாகப் பாதுகாக்கிறது.
- source_word: קוֹמְמִיּוּת
  choice: நிமிர்ந்து
  rationale: அடக்குமுறைக்கு எதிரான நிமிர்ந்த உடல்நிலையையும் மீட்டளிக்கப்பட்ட கண்ணியத்தையும் ஒரே சொல்லில் தக்கவைக்கிறது.
theological_decisions:
- issue: எகிப்தில் இஸ்ரவேலரின் நிலை
  choice: அடிமைகள்
  alternative: வேலைக்காரர்கள் / பணியாளர்கள்
  rationale: עֲבָדִים இச்சூழலில் ஒடுக்குமுறைக்குட்பட்ட அடிமை நிலையைக் குறிக்கிறது; அதை மென்மைப்படுத்தாமல் மொழிபெயர்ப்பது விடுதலையின் வலிமையைப் பாதுகாக்கிறது.
- issue: இறுதி விடுதலை உருவகம்
  choice: நிமிர்ந்து நடக்கச் செய்தேன்
  alternative: தலைநிமிர்ந்து நடக்கச் செய்தேன்
  rationale: எபிரெயம் காரணவினை இயக்கத்தையும் நிமிர்ந்த நிலையையும் இணைக்கிறது. முதன்மை மொழிபெயர்ப்பு உடல் நிலை மற்றும் கண்ணியம் ஆகிய இரு நிழற்பொருள்களையும் அதிக விளக்கமின்றிக் காக்கிறது; இயல்பான உருவக மொழிபெயர்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் மரியாதையும் வேதாகம உரையின் வலிமையும் காக்கப்பட்டுள்ளன. “நுகத்தடிகள்” அடிமைத்தனத்தின் concrete உருவகத்தைத் தக்கவைக்கிறது; “நிமிர்ந்து நடக்கச் செய்தேன்” காரணவினையையும் விடுதலையால் கிடைத்த கண்ணியத்தையும் ஒருங்கே வெளிப்படுத்துகிறது.
