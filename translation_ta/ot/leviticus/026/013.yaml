- from: “நானே உங்கள் கடவுளாகிய யாவே. எகிப்து நாட்டில் அவர்களுக்கு அடிமைகளாக இருந்த உங்களை அங்கிருந்து வெளியே கொண்டுவந்தேன்; உங்கள் நுகத்தடிகளை முறித்து, உங்களை நிமிர்ந்து நடக்கச் செய்தேன்.[a]”
  to: “நானே உங்கள் கடவுளான யாவே; எகிப்து நாட்டிலிருந்து, அவர்களுக்கு அடிமைகளாக இருந்த உங்களை வெளியே கொண்டுவந்தேன். உங்கள் நுகத்தடிகளை முறித்து, உங்களை நிமிர்ந்து நடக்கச் செய்தேன்.[a]”
