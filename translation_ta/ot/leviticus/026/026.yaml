  register: நவீன தரநிலைத் தமிழ்; சாதாரண வாசகர்களுக்கு விளங்கும் இயல்பான, கண்ணியமான நடை. மூலத்தின் பஞ்சம் மற்றும் பங்கீட்டு உருவகங்கள் பாதுகாக்கப்பட்டுள்ளன.
