revisions:
- from: நான் உங்கள் உணவாதாரமான அப்பத்தின் கோலை[a] முறிக்கும்போது, பத்துப் பெண்கள் ஒரே அடுப்பில் உங்கள் அப்பத்தைச் சுட்டு, அதை எடைபோட்டு உங்களிடம் திருப்பிக் கொடுப்பார்கள். நீங்கள் சாப்பிட்டும் திருப்தியடைய மாட்டீர்கள்.
  to: உங்களுக்கு அப்பம் கிடைக்கும் ஆதாரத்தை நான் முறிக்கும்போது, பத்துப் பெண்கள் ஒரே அடுப்பில் உங்கள் அப்பத்தைச் சுட்டு, அதை எடையின்படி உங்களிடம் திருப்பிக் கொடுப்பார்கள். நீங்கள் சாப்பிடுவீர்கள்; ஆனாலும் திருப்தியடைய மாட்டீர்கள்.
