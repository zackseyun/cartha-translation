base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/026.yaml
  text: When I break your supply of bread[a], ten women will bake your bread in a single oven and return your bread by weight; and you will eat, but you will not be satisfied.
translation:
  language: ta
  text: உங்களுக்கு அப்பம் கிடைக்கும் ஆதாரத்தை நான் முறிக்கும்போது, பத்துப் பெண்கள் ஒரே அடுப்பில் உங்கள் அப்பத்தைச் சுட்டு, அதை எடையின்படி உங்களிடம் திருப்பிக் கொடுப்பார்கள். நீங்கள் சாப்பிடுவீர்கள்; ஆனாலும் திருப்தியடைய மாட்டீர்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּשִׁבְרִי
  choice: நான் ... முறிக்கும்போது
  rationale: ב prefixed infinitive construct temporal sense is preserved; முறிக்கும்போது retains the vivid metaphor without implying merely literal smashing.
- source_word: מַטֵּה לֶחֶם
  choice: உணவாதாரமான அப்பத்தின் கோல்
  rationale: The literal image ‘staff of bread’ is retained in the text, while உணவாதாரமான makes its sustaining-force sense intelligible in modern Tamil.
- source_word: וְאָפוּ עֶשֶׂר נָשִׁים
  choice: பத்துப் பெண்கள் ... சுட்டு
  rationale: Preserves the explicit subject ‘ten women’ and uses the natural Tamil verb for baking bread.
- source_word: בְּתַנּוּר אֶחָד
  choice: ஒரே அடுப்பில்
  rationale: ஒரே emphasizes the scarcity conveyed by ten households’ bread fitting into a single oven.
- source_word: וְהֵשִׁיבוּ לַחְמְכֶם בַּמִּשְׁקָל
  choice: அதை எடைபோட்டு உங்களிடம் திருப்பிக் கொடுப்பார்கள்
  rationale: Expresses both bringing the bread back and rationing it by weight in idiomatic Tamil.
- source_word: וַאֲכַלְתֶּם וְלֹא תִשְׂבָּעוּ
  choice: நீங்கள் சாப்பிட்டும் திருப்தியடைய மாட்டீர்கள்
  rationale: The concessive Tamil construction naturally conveys eating without becoming sated.
