  text: אִם בְּ/חֻקֹּתַ֖/י תֵּלֵ֑כוּ וְ/אֶת מִצְוֺתַ֣/י תִּשְׁמְר֔וּ וַ/עֲשִׂיתֶ֖ם אֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/003.yaml
  text: If you walk in my statutes and keep my commandments and do them,[a]
translation:
  language: ta
  text: நீங்கள் என் நியமங்களின்படி நடந்து,[a] என் கட்டளைகளைக் கடைப்பிடித்து அவற்றைச் செயல்படுத்தினால்,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் நியமங்களைப் பின்பற்றி.” எபிரெய மொழியில் சொல்லுக்கு சொல், “என் நியமங்களில் நடந்து”; இது அவற்றுக்கு ஏற்ப ஒருவர் தமது வாழ்க்கையை நடத்துவதைக் குறிக்கும் உடன்படிக்கைச் சொல்லாட்சி.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: -ஆல் (நிபந்தனை விகுதி)
  rationale: இந்தச் சொல் நிபந்தனை வாக்கியத்தை அறிமுகப்படுத்துகிறது. தமிழில் வாக்கிய இறுதியில் வரும் ‘செயல்படுத்தினால்’ என்ற வடிவம் அதன் நிபந்தனைப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּחֻקֹּתַי
  choice: என் நியமங்களின்படி
  rationale: חֻקּוֹת என்பது விதிக்கப்பட்ட சட்டநியமங்களைக் குறிக்கிறது. בְּ உடன் வரும் ‘நியமங்களின்படி’ என்பது சட்ட-உடன்படிக்கை நுணுக்கத்தையும் அவற்றுக்கு ஏற்ப வாழும் கருத்தையும் தெளிவாகத் தருகிறது.
- source_word: תֵּלֵכוּ
  choice: நடந்து
  rationale: הלך என்பதன் நேரடிப் பொருள் ‘நடத்தல்’; இங்கு அது ஒருவரின் வாழ்க்கை நடத்தையைக் குறிக்கும் உடன்படிக்கைச் சொல்லாட்சி. ‘நடந்து’ என்பது அந்த உருவகத்தைத் தமிழிலும் காக்கிறது.
- source_word: מִצְוֺתַי
  choice: என் கட்டளைகள்
  rationale: מִצְוָה என்பது கட்டளை அல்லது கட்டளையைக் குறிக்கிறது. ‘கட்டளைகள்’ இந்த வசனத்தின் சட்டநடைக்கு இயல்பாகப் பொருந்துகிறது.
- source_word: תִּשְׁמְרוּ
  choice: கடைப்பிடித்து
  rationale: שׁמר என்பது சட்டச் சூழலில் கட்டளைகளைக் காத்து அனுசரிப்பதைக் குறிக்கிறது. நவீன தமிழில் ‘கடைப்பிடித்து’ இந்தச் செயற்பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: அவற்றைச் செயல்படுத்தினால்
  rationale: עשה மற்றும் பொருட்சுட்டுப் பெயர் இணைந்து கட்டளைகளை நடைமுறையில் செய்வதை வலியுறுத்துகின்றன. ‘செயல்படுத்துதல்’ வெறும் அறிதல் அல்லது ஏற்றுக்கொள்ளுதலுக்கு மாறாக நடைமுறை கீழ்ப்படிதலைக் காட்டுகிறது; நிபந்தனை விகுதியும் இங்கே இயல்பாக இணைகிறது.
theological_decisions:
- issue: உடன்படிக்கைக்குரிய ‘நடத்தல்’ உருவகம்
  choice: ‘என் நியமங்களின்படி நடந்து’ என்று உருவகத்தைத் தக்கவைத்தல்
  alternative: ‘என் நியமங்களைப் பின்பற்றி’ அல்லது ‘என் நியமங்களின்படி வாழ்ந்து’
  rationale: எபிரெயச் சொல்லாட்சி உடன்படிக்கை உறவையும் முழு வாழ்க்கை நடத்தையையும் ஒருங்கே சுட்டுகிறது. ‘நடந்து’ என்பது அதன் வேதாகம உருவகத்தைப் பாதுகாக்கிறது; ‘நியமங்களின்படி’ என்பதால் அதன் கருத்தும் சாதாரண வாசகருக்குத் தெளிவாகிறது.
translation_notes:
  register: நவீன செந்தமிழுக்கு நெருக்கமான, கண்ணியமான பொது நடையைப் பயன்படுத்துகிறது. ‘நியமங்கள்’, ‘கட்டளைகள்’, ‘கடைப்பிடித்து’ ஆகியவை சட்ட-உடன்படிக்கைத் தன்மையைத் தக்கவைக்கின்றன. இவ்வசனம் அடுத்த வசனங்களுடன் தொடரும் நிபந்தனைத் துணைவாக்கியம் என்பதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
