base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/036.yaml
  text: As for those of you who remain, I will bring faintness into their hearts in the lands of their enemies, and the sound of a driven leaf will pursue them; they will flee as one flees from the sword, and they will fall when no one is pursuing.
translation:
  language: ta
  text: உங்களில் எஞ்சியிருப்பவர்களுக்கோ, அவர்களுடைய பகைவர்களின் நாடுகளில் அவர்களுடைய உள்ளங்களில் மனத்தளர்ச்சியை வரச்செய்வேன். அடித்துச் செல்லப்படும் ஓர் இலையின் ஓசை[a] அவர்களைத் துரத்தும்; வாளுக்குத் தப்பி ஓடுவதுபோல் அவர்கள் ஓடுவார்கள்; துரத்துகிறவன் எவனும் இல்லாதபோதும் அவர்கள் விழுவார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “காற்றால் அடித்துச் செல்லப்படும் ஓர் இலையின் ஓசை.”
    reason: நִדָּף என்பது இலை அடித்துச் செல்லப்படுவதைச் சொல்கிறது; காற்று மூலத்தில் வெளிப்படையாகக் குறிப்பிடப்படவில்லை, ஆனால் சூழலுக்கு ஏற்ற விளக்கமான மாற்றாக அமைகிறது.
lexical_decisions:
- source_word: הַנִּשְׁאָרִים בָּכֶם
  choice: உங்களில் எஞ்சியிருப்பவர்கள்
  rationale: தீர்ப்புக்குப் பின் மீந்தவர்களைக் குறிக்கும் பங்கேற்புப் பெயரின் பொருளையும், בכם காட்டும் இஸ்ரவேலருக்கான நேரடி தொடர்பையும் இயல்பான தமிழில் காக்கிறது.
- source_word: וְהֵבֵאתִי מֹרֶךְ בִּלְבָבָם
  choice: அவர்களுடைய உள்ளங்களில் மனத்தளர்ச்சியை வரச்செய்வேன்
  rationale: இறைவனின் காரணச் செயலை வெளிப்படையாகக் காத்து, מֹרֶךְ குறிக்கும் தைரியக் குலைவு அல்லது உளச்சோர்வை ‘மனத்தளர்ச்சி’ என இயல்பாகத் தருகிறது.
- source_word: בְּאַרְצֹת אֹיְבֵיהֶם
  choice: அவர்களுடைய பகைவர்களின் நாடுகளில்
  rationale: ‘நாடுகள்’ என்ற எபிரெயப் பன்மையையும் பகைவர்களின் பிரதேசங்களில் சிதறியிருக்கும் சூழலையும் காக்கிறது.
- source_word: קוֹל עָלֶה נִדָּף
  choice: காற்றில் அடித்துச் செல்லப்படும் ஓர் இலையின் ஓசை
  rationale: קוֹל என்பதை ‘ஓசை’ என்றும், עָלֶה என்பதை ‘இலை’ என்றும் தருகிறது; נִדָּף என்பதன் அசைக்கப்பட்டு அடித்துச் செல்லப்படும் நிலையைக் தமிழில் தெளிவாக வெளிப்படுத்துகிறது. காற்று எபிரெயத்தில் வெளிப்படையாகக் குறிப்பிடப்படாததால் மாற்று வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְרָדַף אֹתָם
  choice: அவர்களைத் துரத்தும்
  rationale: அற்பமான இலையோசையே துரத்துபவனாகச் சித்தரிக்கப்படும் பயமூட்டும் முரணை நேரடியாகக் காக்கிறது.
- source_word: וְנָסוּ מְנֻסַת חֶרֶב
  choice: வாளுக்குத் தப்பி ஓடுவதுபோல் அவர்கள் ஓடுவார்கள்
  rationale: வாளின் முன் நிகழும் ஓட்டத்தை ஒப்புமையாகக் கூறும் எபிரெயத் தொடரை தெளிவான நவீன தமிழில் அளிக்கிறது.
- source_word: וְנָפְלוּ וְאֵין רֹדֵף
  choice: துரத்துகிறவன் எவனும் இல்லாதபோதும் அவர்கள் விழுவார்கள்
  rationale: உண்மையான துரத்துபவன் இல்லாமலேயே அவர்கள் விழும் கொடிய முரணைத் தக்கவைத்து, נפל என்பதன் சுருக்கமான ‘விழுதல்’ என்ற பொருளை விரிவுபடுத்தாமல் காக்கிறது.
theological_decisions:
- issue: தீர்ப்பின் தன்மை
  choice: நாடுகடத்தப்பட்ட நிலையில் கடவுள் உண்டாக்கும் உள்ளார்ந்த மனத்தளர்ச்சியும் அதனால் எழும் காரணமற்ற பீதியும்
  alternative: வெளிப்புற இராணுவத் துரத்தல் மட்டுமே
  rationale: மனத்தளர்ச்சியைத் தாமே வரச்செய்வதாகப் பேசுபவர் கூறுகிறார்; பின்னர் மிகச் சிறிய ஓசைக்கே மக்கள் ஓடுவதாக வசனம் விளக்குகிறது. ஆகவே தெய்வீகச் செயலும் உளவியல் பீதியும் இரண்டுமே மொழிபெயர்ப்பில் காக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் வகையில் இயல்பாகவும், தீர்ப்புரையின் கண்ணியமான தீவிரத்தைத் தக்கவைக்கும் வகையில் உயர்வான நடையிலும் அமைக்கப்பட்டது. அடிக்குறிப்பு குறியீடு முதன்மை உரையில் சேர்க்கப்பட்டுள்ளது.
