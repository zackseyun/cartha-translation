  source_fidelity: முதல் வாக்கியத்தில் எபிரெய மூலத்தின் எஞ்சியோர், அவர்களுடைய அக்கிரமம், பகைவர்களின் நாடுகள், மற்றும் தேய்ந்து அழிதல் ஆகிய கூறுகள் நன்றாகக் காக்கப்பட்டுள்ளன. ஆனால் இரண்டாம் வாக்கியத்தின் ‘அவர்களுடைய தந்தையரின் அக்கிரமங்கள் அவர்களோடு இருக்க’ என்ற அமைப்பு தமிழில் முழுமையற்ற இடைநிலைத்தொடராகத் தோன்றுகிறது. אִתָּם என்பதன் நோக்கமுள்ள இருமையைப் பாதுகாத்தபடியே, அது ‘தந்தையரின் அக்கிரமங்கள்’ உடன் தொடர்புடையதாகச் சீரமைக்கப்பட வேண்டும்.
  naturalness: ‘தேய்ந்து போவார்கள்,’ ‘அக்கிரமம்,’ மற்றும் ‘உங்கள் பகைவர்களின் நாடுகளில்’ ஆகியவை நவீன நிலையான தமிழில் இயல்பாகவும் பொருத்தமான கண்ணியமான பதிவிலும் உள்ளன. இரண்டாம் வாக்கியத்தை ‘அவர்களோடு இருக்கும் ... அக்கிரமங்களினாலும்’ என அமைப்பது தெளிவானதும் இயல்பானதுமாகும்.
  terminology: ‘அக்கிரமம்’ עָוֹן-இன் ஒழுக்கக் குற்றம்/குற்றப்பொறுப்பு சார்ந்த வலிமையை ஏற்றவாறு தருகிறது. ‘தந்தையர்’ என்பது אֲבֹתָם-க்கு நேர்மையான, நடுநிலையான தேர்வாகும். ‘தேய்ந்து போவார்கள்’ מקק-இன் மெதுவான சிதைவு அல்லது வாடுதலைச் சரியாக வெளிப்படுத்துகிறது.
