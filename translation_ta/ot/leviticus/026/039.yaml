  text: וְ/הַ/נִּשְׁאָרִ֣ים בָּ/כֶ֗ם יִמַּ֨קּוּ֙ בַּֽ/עֲוֺנָ֔/ם בְּ/אַרְצֹ֖ת אֹיְבֵי/כֶ֑ם וְ/אַ֛ף בַּ/עֲוֺנֹ֥ת אֲבֹתָ֖/ם אִתָּ֥/ם יִמָּֽקּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/039.yaml
  text: And those of you who remain will waste away in the lands of your enemies because of their iniquity[b][a]; and also because of the iniquities of their fathers with them they will waste away.
translation:
  language: ta
  text: உங்களில் எஞ்சியிருப்பவர்கள் தங்கள் அக்கிரமத்தினால் உங்கள் பகைவர்களின் நாடுகளில் தேய்ந்து போவார்கள்[a]; மேலும், அவர்களோடு இருக்கும் அவர்களுடைய தந்தையரின் அக்கிரமங்களினாலும் அவர்கள் தேய்ந்து போவார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தேய்ந்து போவார்கள்’ என்பதற்கு ‘அழுகிச் சிதைவார்கள்’ அல்லது ‘வாடிப்போவார்கள்’ என்றும் மொழிபெயர்க்கலாம்; எபிரெய வினை நியாயத்தீர்ப்பின் கீழ் மெதுவாகச் சிதைந்து அழிவதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘அவர்களோடு இருக்கும்’ என்பது தந்தையரின் அக்கிரமங்கள் அவர்களோடு தொடர்ந்து இருப்பதைக் குறிக்கலாம்; அல்லது அந்த முன்னோர் அக்கிரமங்கள் இன்னும் விளைவுகளை ஏற்படுத்திக்கொண்டிருக்க, அவற்றோடு இவர்களும் தேய்ந்து போவதைக் குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהַנִּשְׁאָרִים בָּכֶם
  choice: உங்களில் எஞ்சியிருப்பவர்கள்
  rationale: שׁאר என்பதன் பங்கேற்புவினை வடிவம் நியாயத்தீர்ப்புக்குப் பின் மீந்திருப்பவர்களைக் குறிக்கிறது; בָּכֶם தரும் ‘உங்களில்’ என்ற நேரடி தொடர்பையும் இச்சொற்றொடர் இயல்பாகக் காக்கிறது.
- source_word: יִמַּקּוּ
  choice: தேய்ந்து போவார்கள்
  rationale: מקק என்பதன் நிஃபால் வடிவம் நியாயத்தீர்ப்பின் கீழ் மெதுவாகச் சிதைந்து அல்லது வலுவிழந்து அழிவதைத் தெரிவிக்கிறது. ‘தேய்ந்து போவார்கள்’ என்பது இரு இடங்களிலும் இயல்பாகவும் கருத்தாழத்துடனும் பொருந்துகிறது.
- source_word: בַּעֲוֺנָם
  choice: தங்கள் அக்கிரமத்தினால்
  rationale: עָוֹן அக்கிரமத்தையும் அதனால் வரும் குற்றப்பொறுப்பு அல்லது விளைவையும் குறிக்கலாம். இங்குள்ள בְּ காரணப் பொருளில் புரிந்துகொள்ளப்பட்டாலும், மூலச்சொல்லின் நீதித்தீர்ப்புச் சார்ந்த வலிமை காக்கப்படுகிறது.
- source_word: בְּאַרְצֹת אֹיְבֵיכֶם
  choice: உங்கள் பகைவர்களின் நாடுகளில்
  rationale: ‘நாடுகள்’ என்பது எபிரெய மூலத்தின் பன்மையைத் தக்கவைத்து, பல அந்நியப் பகுதிகளில் சிதறியிருக்கும் சூழலை வெளிப்படுத்துகிறது.
- source_word: וְאַף
  choice: மேலும்
  rationale: இது முன் கூறியதோடு இன்னொன்றை வலியுறுத்திச் சேர்க்கிறது; ‘மேலும்’ நவீனத் தமிழில் இயல்பான இணைப்பாகும்.
- source_word: בַּעֲוֺנֹת אֲבֹתָם
  choice: அவர்களுடைய தந்தையரின் அக்கிரமங்கள்
  rationale: மூலத்தில் ‘அக்கிரமங்கள்’ பன்மையில் உள்ளது; אבותם என்பதற்கு ‘தந்தையர்’ என்று மொழிபெயர்ப்பது அதன் குடும்பத் தலைமுறைச் சொல்லாட்சியைத் தக்கவைக்கிறது.
- source_word: אִתָּם
  choice: அவர்களோடு இருக்க
  rationale: எபிரெயச் சொற்றொடர் சுருக்கமாகவும் பொருள் இருமை உடையதாகவும் உள்ளது. தந்தையரின் அக்கிரமங்கள் இவர்களோடு தொடர்கின்றன என்ற முதன்மையான வாசிப்பை இத்தேர்வு தருகிறது; மாற்று நுட்பம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: தலைமுறைகளைக் கடந்து வரும் அக்கிரமமும் நியாயத்தீர்ப்பும்
  choice: மீதியானவர்கள் தங்கள் சொந்த அக்கிரமத்தினாலும் தந்தையரின் அக்கிரமங்கள் அவர்களோடு இருப்பதாலும் தேய்ந்து போவார்கள் என்ற இரு கூறுகளும் தக்கவைக்கப்பட்டன.
  alternative: இதை முன்னோர்களின் பாவங்களால் வந்த விளைவுகள் மட்டுமே என்றோ, அவர்கள் தந்தையரின் அதே பாவங்களில் பங்கெடுத்தார்கள் என்றோ வெளிப்படையாக விளக்குதல்.
  rationale: வசனம் இவர்களுடைய அக்கிரமத்தையும் இவர்களுடைய தந்தையரின் அக்கிரமங்களையும் தனித்தனியாகக் குறிப்பிடுகிறது. தனிப்பட்ட பொறுப்புக்கும் தலைமுறை விளைவுக்கும் இடையிலான பதற்றத்தை மொழிபெயர்ப்பு தீர்த்துவிடாமல் பாதுகாக்க வேண்டும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘அக்கிரமம்’ நீதித்தீர்ப்பு மற்றும் குற்றப்பொறுப்பு சார்ந்த மூலச்சொல்லின் வலிமையைத் தக்கவைக்கிறது; ‘தேய்ந்து போவார்கள்’ மெதுவான சிதைவைக் காட்டுகிறது. மூலத்தின் தலைமுறை சார்ந்த இறையியல் பதற்றம் விளக்கவுரையால் சமனாக்கப்படவில்லை.
