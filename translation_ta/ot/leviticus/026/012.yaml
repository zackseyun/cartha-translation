  yaml_path: translation/ot/leviticus/026/012.yaml
  text: I will walk among you and will be your God[a], and you will be my people.
translation:
  language: ta
  text: நான் உங்கள் நடுவில் நடமாடுவேன்; உங்கள் கடவுளாக இருப்பேன்; நீங்கள் என் மக்களாக இருப்பீர்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִתְהַלַּכְתִּי
  choice: நடமாடி
  rationale: הלך என்பதன் ஹித்பயேல் வடிவம் இங்கு மக்களின் நடுவே தொடர்ந்து நடந்து செல்லும் இருப்பைச் சித்தரிக்கிறது. ‘நடமாடுவேன்’ என்பது அந்தத் தெளிவான உருவகத்தைப் பாதுகாக்கிறது; ‘குடியிருப்பேன்’ என்பது வினையின் நேரடிப் பொருளை மீறிய விளக்கமாகிவிடும்.
- source_word: בְּתוֹכְכֶם
  choice: உங்கள் நடுவில்
  rationale: இந்தத் தொடர் சமூகத்தின் மத்தியில் இருப்பதைக் குறிக்கிறது. ‘உங்கள் நடுவில்’ என்பது எபிரெயச் சொல்லமைப்புக்கு நெருக்கமாகவும் இயல்பான தமிழாகவும் உள்ளது; ‘உங்களுக்குள்’ என்பது தனிநபர்களின் அகத்தே இருப்பதாகத் தவறாகப் புரிந்துகொள்ளப்படலாம்.
- source_word: וְהָיִיתִי לָכֶם לֵאלֹהִים
  choice: உங்கள் கடவுளாக இருப்பேன்
  rationale: இது உடன்படிக்கை உறவைக் குறிக்கும் நிலையான மொழிநடை. தமிழ் உரிமைத் தொடர்பின் மூலம் அதன் உறவுசார் வலிமையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לֵאלֹהִים
  choice: கடவுள்
  rationale: இஸ்ரவேலுடனான உடன்படிக்கைச் சூழலில் אֱלֹהִים என்பது ஏதோ ஒரு தெய்வத்தை அல்ல, அவர்களுடன் உறவு கொள்ளும் ஒரே கடவுளைக் குறிக்கிறது.
- source_word: וְאַתֶּם תִּהְיוּ לִי לְעָם
  choice: நீங்கள் என் மக்களாக இருப்பீர்கள்
  rationale: இது பரஸ்பர உடன்படிக்கை உறவின் மறுபக்கத்தைச் சொல்லும் நிலையான தொடர். ‘என் மக்களாக’ என்பது ‘எனக்கு ஒரு மக்களாக’ என்பதைக் காட்டிலும் இயல்பான தமிழில் அதே உறவுப் பொருளைப் பாதுகாக்கிறது.
theological_decisions:
- issue: உடன்படிக்கைச் சூத்திரத்தின் மொழிபெயர்ப்பு
  choice: உங்கள் கடவுளாக இருப்பேன்; நீங்கள் என் மக்களாக இருப்பீர்கள்
  alternative: உங்களுக்கு கடவுளாக இருப்பேன்; நீங்கள் எனக்கு ஒரு மக்களாக இருப்பீர்கள்
  rationale: எபிரெய மொழியில் உள்ள பரஸ்பர உடன்படிக்கை உறவை, கூடுதல் கோட்பாட்டு விளக்கம் ஏதும் சேர்க்காமல், இயல்பான தமிழில் இவ்வடிவம் தெளிவாகப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிமையானதும் கண்ணியமானதும். தெய்வீக இருப்பின் தெளிவான நடை உருவகத்தையும் உடன்படிக்கை மொழியின் பரஸ்பர உறவையும் பாதுகாக்கிறது.
