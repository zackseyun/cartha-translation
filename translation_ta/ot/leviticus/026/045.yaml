base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/045.yaml
  text: 'But I will remember for them the covenant with their forefathers, whom I brought out from the land of Egypt in the sight of the nations, to be their God: I am Yahweh.'
translation:
  language: ta
  text: ஆனாலும், அவர்களுக்குக் கடவுளாக இருப்பதற்காக நாடுகளின் கண்முன்னே எகிப்து நாட்டிலிருந்து நான் வெளியே கொண்டுவந்த அவர்களுடைய முன்னோர்களோடு செய்த உடன்படிக்கையை அவர்களுக்காக நினைவுகூருவேன்[a]. நானே யாவே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்படியாக, “முந்தையவர்களுடைய உடன்படிக்கை” அல்லது “முந்தையவர்களோடு செய்த உடன்படிக்கை”; இது எகிப்திலிருந்து வெளியே கொண்டுவரப்பட்ட முந்தைய தலைமுறையினரைச் சுட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתִּי
  choice: ஆனாலும் … நினைவுகூருவேன்
  rationale: இணைப்புச் சொல் அடிப்படையில் ‘மேலும்/அப்போது’ எனப் பொருள்படலாம்; ஆனால் முந்தைய நியாயத்தீர்ப்புக் கூற்றுகளுக்குப் பின் வரும் அருள்மிகு திருப்பத்தைச் சூழல் காட்டுவதால் ‘ஆனாலும்’ இயல்பாக உள்ளது. ‘நினைவுகூருவேன்’ என்பது உடன்படிக்கையின்படி செயல்படுவதை உள்ளடக்கக்கூடிய மூல வினையின் பொருளைத் தக்கவைக்கிறது.
- source_word: לָהֶם
  choice: அவர்களுக்காக
  rationale: ל முன்னிடைச்சொல்லின் பயன்நோக்கிய நுணுக்கத்தைப் பாதுகாக்கிறது; வெறுமனே ‘அவர்களை நினைவுகூருவேன்’ என்று மாற்றவில்லை.
- source_word: בְּרִית רִאשֹׁנִים
  choice: அவர்களுடைய முன்னோர்களோடு செய்த உடன்படிக்கை
  rationale: ரִאשֹׁנִים என்பது ‘முந்தையவர்கள்/முன்னிருந்தவர்கள்’ என்று பெயர்ச்சொல்லாகச் செயல்படுகிறது. தொடர்ந்து வரும் ‘நான் வெளியே கொண்டுவந்த’ என்ற உறவுச் சொற்றொடர் மக்களையே சுட்டுவதால், தமிழில் இயல்பாக ‘முன்னோர்கள்’ என வழங்கப்பட்டுள்ளது; மூலத்தின் சொற்பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: אֲשֶׁר הוֹצֵאתִי אֹתָם מֵאֶרֶץ מִצְרַיִם
  choice: எகிப்து நாட்டிலிருந்து நான் வெளியே கொண்டுவந்த
  rationale: உறவுச் சொற்றொடர் உடன்படிக்கையை அல்ல, முன்னோர்களைச் சுட்டுகிறது. வெளியேற்ற நிகழ்வைக் குறிக்கும் மரபான உடன்படிக்கை மொழியைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: לְעֵינֵי הַגּוֹיִם
  choice: நாடுகளின் கண்முன்னே
  rationale: எகிப்திலிருந்து வெளியேற்றியது பிற நாடுகள் காணும்படி பொதுவெளியில் நடந்தது என்ற காட்சிமிக்க எபிரெயச் சொற்றொடரை நெருக்கமாகப் பிரதிபலிக்கிறது.
- source_word: לִהְיֹת לָהֶם לֵאלֹהִים
  choice: அவர்களுக்குக் கடவுளாக இருப்பதற்காக
  rationale: உடன்படிக்கைக்குரிய நோக்கத்தைத் தெரிவிக்கும் மூல இலக்கணத்தையும், ‘அவர்களுடைய கடவுளாக இருப்பது’ என்ற உறவையும் இயல்பான தமிழில் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், எபிரெய நான்கெழுத்துப் பெயரின் பரவலான தமிழ் ஒலிபெயர்ப்பாக வழங்குகிறது.
theological_decisions:
- issue: בְּרִית רִאשֹׁנִים என்பதன் தொடர்பும் குறிக்கும் மக்களும்
  choice: எகிப்திலிருந்து வெளியே கொண்டுவரப்பட்ட அவர்களுடைய முன்னோர்களோடு செய்யப்பட்ட உடன்படிக்கை
  alternative: ‘முந்தையவர்களின் உடன்படிக்கை’ அல்லது ‘முந்தைய தலைமுறையினரோடு செய்த உடன்படிக்கை’
  rationale: எபிரெயத் தொடர் சுருக்கமானதும் முன்னிடைச்சொல் வெளிப்படையாக இல்லாததுமாக உள்ளது. ஆயினும் ‘அவர்களை எகிப்து நாட்டிலிருந்து வெளியே கொண்டுவந்தேன்’ என்ற அடுத்த உறவுச் சொற்றொடர், இது ஓர் அருவமான ‘முதல் உடன்படிக்கை’ அல்லாமல் முந்தைய மக்களைச் சுட்டுவதை வலுப்படுத்துகிறது. ‘முன்னோர்கள்’ வாசிப்பைத் தெளிவாக்குகிறது; சொற்படியான மாற்று அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- issue: לִהְיֹת לָהֶם לֵאלֹהִים என்ற நோக்கச் சொற்றொடரின் இணைப்பு
  choice: எகிப்திலிருந்து அவர்களை வெளியே கொண்டுவந்ததன் நோக்கமாக இணைத்தல்
  alternative: உடன்படிக்கையின் பொதுவான நோக்கமாகத் தனியே வாசித்தல்
  rationale: சொல் வரிசையில் இந்த நோக்கச் சொற்றொடர் வெளியே கொண்டுவருதலைத் தொடர்ந்து வருவதால் அதனுடன் இணைப்பது இயல்பானது. அதேவேளை, அது உடன்படிக்கை உறவின் நோக்கத்தையும் வெளிப்படுத்துகிறது; தமிழ் மொழிபெயர்ப்பு இந்த இரு கருத்துகளையும் முரண்பாடின்றி தக்கவைக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் வேதாகம உடன்படிக்கை மொழியின் செறிவும் காக்கப்பட்டுள்ளன. ‘நாடுகளின் கண்முன்னே’, ‘நினைவுகூருவேன்’ போன்ற வடிவங்கள் மூலத்தின் காட்சியையும் இறையியல் நிறையையும் தக்கவைக்கின்றன; கடினமான எபிரெயத் தொடரமைப்பு மட்டும் இயல்பான தமிழ் சொல் வரிசைக்கு மாற்றப்பட்டுள்ளது.
