- from: ஆனால், நாடு அவர்களால் கைவிடப்பட்டு, அவர்கள் இல்லாமல் அது பாழாய்க் கிடக்கும் காலத்தில் தன் ஓய்வுநாடுகளை அனுபவிக்கும்; அவர்களோ தங்கள் அக்கிரமத்திற்கான தண்டனையை ஏற்றுக்கொள்வார்கள்[a]. ஏனெனில்—ஆம், ஏனெனில்—அவர்கள் என் நீதிநியமங்களைப் புறக்கணித்தார்கள்; அவர்களுடைய உள்ளம் என் சட்டங்களை அருவருத்தது.
  to: ஆனால், அந்த நாடு அவர்களால் கைவிடப்படும்; அவர்கள் இல்லாதபோது அது பாழாய்க் கிடந்து, தன் சபாத்து ஓய்வுநாடுகளை அனுபவிக்கும். அவர்களோ தங்கள் அக்கிரமத்திற்கான தண்டனையை ஏற்றுக்கொள்வார்கள்[a]; ஏனெனில்—ஆம், ஏனெனில்—அவர்கள் என் நீதிநியமங்களை நிராகரித்தார்கள்; அவர்களுடைய உள்ளம் என் விதிமுறைகளை அருவருத்தது.
