translation_notes:
  register: நவீனத் தரத் தமிழ்; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதாகம நடை. ‘ஓய்வுநாடுகள்,’ ‘நீதிநியமங்கள்,’ ‘சட்டங்கள்’ ஆகியவை மூலத்தின் சட்ட-உடன்படிக்கை வேறுபாடுகளை இயன்றவரைத் தக்கவைக்கின்றன. ‘அவர்களுடைய உள்ளம்’ என்பது தமிழில் கடினமாக ஒலிக்கும் சொற்படியான ‘அவர்களுடைய ஆத்துமா’ என்பதற்குப் பதிலாக மூலத்தின் உள்ளார்ந்த வெறுப்பை இயல்பாக வெளிப்படுத்துகிறது.
