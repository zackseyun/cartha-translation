  choice: அக்கிரமத்திற்கான தண்டனையை ஏற்றுக்கொள்வார்கள்
  alternative: தங்கள் அக்கிரமத்தை ஏற்றுக்கொள்வார்கள்; அல்லது தங்கள் அக்கிரமத்திற்குப் பரிகாரம் செய்வார்கள்
