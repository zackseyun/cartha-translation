  yaml_path: translation/ot/leviticus/026/043.yaml
  text: But the land will be abandoned by them and will enjoy its Sabbaths while it lies desolate without them[a], and they will accept the punishment for their iniquity, because—indeed, because—they rejected my judgments and their soul abhorred my statutes.
translation:
  language: ta
  text: ஆனால், அந்த நாடு அவர்களால் கைவிடப்படும்; அவர்கள் இல்லாதபோது அது பாழாய்க் கிடந்து, தன் சபாத்து ஓய்வுநாடுகளை அனுபவிக்கும். அவர்களோ தங்கள் அக்கிரமத்திற்கான தண்டனையை ஏற்றுக்கொள்வார்கள்[a]; ஏனெனில்—ஆம், ஏனெனில்—அவர்கள் என் நீதிநியமங்களை நிராகரித்தார்கள்; அவர்களுடைய உள்ளம் என் விதிமுறைகளை அருவருத்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தங்கள் அக்கிரமத்தை ஏற்றுக்கொள்வார்கள்”; அல்லது, “தங்கள் அக்கிரமத்திற்குப் பரிகாரம் செய்வார்கள்.” இந்த எபிரெயச் சொல்லிணையை ஒன்றுக்கு மேற்பட்ட விதங்களில் புரிந்துகொள்ளலாம். உடன்படிக்கையை மீறியதற்கான தண்டனையைச் சொல்லும் இச்சூழலில், அதன் நீதித்தீர்ப்புச் சார்ந்த பொருள் முதன்மை உரையில் கொடுக்கப்பட்டுள்ளது.
    reason: lexical_alternative
