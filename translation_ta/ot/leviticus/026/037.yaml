  text: They will stumble over one another as if before a sword[a], though no one is pursuing[b]; and you will have no power to stand before your enemies.
translation:
  language: ta
  text: ஒருவர்மேல் ஒருவர் இடறுவார்கள்; வாளுக்கு முன் ஓடுவதுபோல் இடறுவார்கள்[a], ஆனால் அவர்களைத் துரத்துகிறவர் ஒருவரும் இருக்கமாட்டார். உங்கள் பகைவர்களுக்கு முன்பாக நிலைநிற்க உங்களால் முடியாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லர்த்தமாக, “ஒருவன் தன் சகோதரன்மேல்”; இங்கு பீதியில் ஒருவரோடு ஒருவர் மோதிக்கொள்வதை இது குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָשְׁלוּ
  choice: இடறி விழுவார்கள்
  rationale: כשל என்பதன் இடறுதல் அல்லது தடுமாறி விழுதல் என்ற தெளிவான உருவகத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: אִישׁ בְּאָחִיו
  choice: ஒருவர்மேல் ஒருவர்
  rationale: சொல்லர்த்தம் ‘ஒருவன் தன் சகோதரனில்/மேல்’; இங்கு பீதியில் ஒருவரோடு ஒருவர் மோதிக்கொள்வதைக் குறிக்கும் பரஸ்பரப் பயன்பாடு.
- source_word: כְּמִפְּנֵי חֶרֶב
  choice: வாளுக்கு முன்பாக இருப்பதுபோல்
  rationale: ஒப்புமையையும் ‘வாளின் முன்னிலையிலிருந்து/முன்பாக’ என்ற மூலத்தின் படிமத்தையும் காக்கிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘ஓடுதல்’ சேர்க்கப்படவில்லை.
- source_word: וְרֹדֵף אָיִן
  choice: ஆனால் அவர்களைத் துரத்துகிறவர் ஒருவரும் இருக்கமாட்டார்
  rationale: ‘துரத்துகிறவன் இல்லை’ என்ற நேரடியான பொருளை, சூழலில் உள்ள முரண்பாட்டுத் தொடர்புடன் இயல்பான தமிழில் தருகிறது.
- source_word: וְלֹא תִהְיֶה לָכֶם תְּקוּמָה
  choice: நிலைநிற்க உங்களால் முடியாது
  rationale: תקומה குறிக்கும் எழுதல், நிலைத்திருத்தல் அல்லது எதிர்த்து நிற்கும் திறன் ஆகியவற்றில், பகைவர்களை எதிர்கொள்ள இயலாமை என்ற சூழல்சார் பொருளை வெளிப்படுத்துகிறது.
- source_word: לִפְנֵי אֹיְבֵיכֶם
  choice: உங்கள் பகைவர்களுக்கு முன்பாக
  rationale: பகைவர்களை நேருக்கு நேர் எதிர்கொள்ளும் பொருளை நெருக்கமாகக் காக்கிறது.
