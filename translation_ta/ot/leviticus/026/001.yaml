revisions:
- from: உங்களுக்கென்று விக்கிரகங்களைச் செய்யாதீர்கள்; செதுக்கப்பட்ட உருவத்தையோ நிறுத்தப்பட்ட கல்லையோ உங்களுக்காக நிறுவாதீர்கள். அதற்கு முன்பாகப் பணிந்துகொள்வதற்காக உருவம் பொறிக்கப்பட்ட கல்லை[a] உங்கள் நாட்டில் வைக்காதீர்கள். ஏனெனில், நானே உங்கள் கடவுளாகிய யாவே[b].
  to: உங்களுக்கென்று விக்கிரகங்களைச் செய்யாதீர்கள்; செதுக்கப்பட்ட உருவத்தையோ நிறுத்தப்பட்ட கல்லையோ உங்களுக்காக நிறுவாதீர்கள். அதற்குப் பணிந்துகொள்வதற்காக உருவம் பொறிக்கப்பட்ட கல்லை[a] உங்கள் நாட்டில் வைக்காதீர்கள். ஏனெனில், நான் யாவே, உங்கள் கடவுள்[b].
  rationale: The revision removes the added ‘before it’ spatial sense, while retaining the purpose clause and the stone as the object of prohibited reverence. It also makes the final divine self-identification idiomatic and syntactically clear in modern standard Tamil. The source’s distinct cultic terms, divine name, and existing footnote content are retained.
  reviewer_model: gpt-5.6-terra
