base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/001.yaml
  text: You shall not make idols for yourselves[a], and you shall not set up for yourselves a carved image or a standing stone, and you shall not place a figured stone in your land to bow down to it[b], for I am Yahweh your God.
translation:
  language: ta
  text: உங்களுக்கென்று விக்கிரகங்களைச் செய்யாதீர்கள்; செதுக்கப்பட்ட உருவத்தையோ நிறுத்தப்பட்ட கல்லையோ உங்களுக்காக நிறுவாதீர்கள். அதற்குப் பணிந்துகொள்வதற்காக உருவம் பொறிக்கப்பட்ட கல்லை[a] உங்கள் நாட்டில் வைக்காதீர்கள். ஏனெனில், நான் யாவே, உங்கள் கடவுள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘உருவம் பொறிக்கப்பட்ட கல்’ என்பதற்குப் பதிலாக ‘செதுக்கப்பட்ட கல்’ அல்லது ‘உருவக் கல்’ என்றும் மொழிபெயர்க்கலாம் (எபிரெயம்: אֶבֶן מַשְׂכִּית). இதன் துல்லியமான நுட்பம் விவாதத்திற்குரியது; தடைசெய்யப்பட்ட வழிபாட்டுடன் தொடர்புடைய ஒரு கற்பொருளை இது குறிக்கிறது.'
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் YHWH; மரபாக ‘ஆண்டவர்’ என்று வழங்கப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלִילִם
  choice: விக்கிரகங்கள்
  rationale: வழிபாட்டுக்குரிய பொய்யான அல்லது மதிப்பற்ற உருவங்களைக் குறிக்கும் சொல்லாக இங்கு வருகிறது. நவீன தமிழில் தெளிவாகப் புரியும் ‘விக்கிரகங்கள்’ என்பது அதன் வழிபாட்டுச் சூழலையும் தடைச் சட்டத்தின் வலிமையையும் தக்கவைக்கிறது.
- source_word: פֶסֶל
  choice: செதுக்கப்பட்ட உருவம்
  rationale: செதுக்கி உருவாக்கப்பட்ட படிமம் என்பதைக் காட்சிப்படுத்துகிறது; பொதுவான ‘விக்கிரகம்’ என்ற சொல்லுடன் இதைக் கலக்காமல் எபிரெயச் சொற்களின் வேறுபாட்டைக் காக்கிறது.
- source_word: מַצֵּבָה
  choice: நிறுத்தப்பட்ட கல்
  rationale: நிமிர்த்தி நிறுவப்பட்ட கல் நினைவுச்சின்னம் அல்லது தூண் என்பது அடிப்படைப் பொருள். ‘புனிதத் தூண்’ என்று மொழிபெயர்ப்பது மூலச்சொல்லில் வெளிப்படையாக இல்லாத வழிபாட்டு விளக்கத்தைச் சேர்க்கும்.
- source_word: אֶבֶן מַשְׂכִּית
  choice: உருவம் பொறிக்கப்பட்ட கல்
  rationale: பொறிப்பு அல்லது உருவமைப்பு கொண்ட வழிபாட்டுக் கல்லைக் குறிப்பதாகத் தெரிகிறது. சொல்லின் துல்லியமான நுட்பம் விவாதத்திற்குரியது என்பதால் மாற்று மொழிபெயர்ப்புகள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: תַעֲשׂוּ לָכֶם
  choice: உங்களுக்கென்று ... செய்யாதீர்கள்
  rationale: செய்தல் என்ற வினையையும், தங்களுக்காக அல்லது தங்கள் பயன்பாட்டுக்காக என்ற לָכֶם என்பதன் பயனிலை நுட்பத்தையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: תָקִימוּ לָכֶם
  choice: உங்களுக்காக நிறுவாதீர்கள்
  rationale: קום என்பதன் ஹிஃபீல் வடிவம் இங்கு ஒரு பொருளை நிமிர்த்தி அமைத்தல் அல்லது நிறுவுதல் என்று பொருள்படுகிறது.
- source_word: תִתְּנוּ בְּאַרְצְכֶם
  choice: உங்கள் நாட்டில் வைக்காதீர்கள்
  rationale: நிலத்துக்குள் உள்ள ஓர் இடத்தில் வைப்பதை இயல்பாகக் கூறுவதோடு, உடன்படிக்கைக்குரிய நாட்டைச் சுட்டும் பரப்பையும் காக்கிறது.
- source_word: לְהִשְׁתַּחֲוֺת עָלֶיהָ
  choice: அதற்கு முன்பாகப் பணிந்துகொள்வதற்காக
  rationale: தன்னைத் தாழ்த்திப் பணிதல் என்ற வழிபாட்டுச் செயலும், அந்தக் கல்லை வைப்பதன் நோக்கமும் வெளிப்படுகின்றன. עַל இங்கு வழிபாடு செலுத்தப்படும் பொருளை நோக்கிய உறவாகப் புரிந்துகொள்ளப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெயத் திருப்பெயரான YHWH-ஐ ஒரு பட்டத்தால் மாற்றாமல், தமிழில் அதன் பரவலான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: כִּי אֲנִי יְהוָה אֱלֹהֵיכֶם
  choice: ஏனெனில், நானே உங்கள் கடவுளாகிய யாவே
  rationale: כִּי தடைகளுக்கான காரணத்தை அறிமுகப்படுத்துகிறது. אֲנִי என்பதன் வலியுறுத்தலை ‘நானே’ என்பதும், உடன்படிக்கை உறவை ‘உங்கள் கடவுளாகிய’ என்பதும் இயல்பான தமிழில் தக்கவைக்கின்றன.
theological_decisions:
- issue: יְהוָה என்ற திருப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூலத்தில் கடவுளின் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது. ஆகவே அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் தனித்தன்மையைப் பாதுகாக்கிறது; மரபான பட்டப்பெயர் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- issue: வழிபாட்டுப் பொருள்களைக் குறிக்கும் பல்வேறு சொற்கள்
  choice: விக்கிரகங்கள், செதுக்கப்பட்ட உருவம், நிறுத்தப்பட்ட கல், உருவம் பொறிக்கப்பட்ட கல் எனத் தனித்தனியாக மொழிபெயர்த்தல்
  alternative: அனைத்தையும் ‘விக்கிரகங்கள்’ அல்லது ‘உருவங்கள்’ என்று ஒரே சொல்லில் வழங்குதல்
  rationale: வசனம் வெவ்வேறு எபிரெயச் சொற்களைத் தொடர்ச்சியாகப் பயன்படுத்துகிறது. அவற்றை வேறுபடுத்துவது சட்டத்தின் குறிப்புத்தன்மையைப் பாதுகாக்கிறது; எல்லாவற்றையும் ஒரே சொல்லாக்குவது மூலத்தின் சொற்பல்வகையை அழித்துவிடும்.
- issue: עָלֶיהָ என்பதன் தொடர்பு
  choice: அதற்கு முன்பாகப் பணிந்துகொள்வது
  alternative: அதன்மேல் பணிந்துகொள்வது
  rationale: சூழலில் தடைசெய்யப்பட்ட கல் வழிபாட்டின் பொருளாக இருப்பதே அதிகம் சாத்தியம். எனினும் முன்னிடைச்சொல் ‘அதன்மேல்’ என்ற இடவியல் வாசிப்பையும் இலக்கணரீதியாக அனுமதிப்பதால் அந்தத் தெளிவின்மை பதிவு செய்யப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் புரியக்கூடிய, சட்ட அறிவுறுத்தலுக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘செய்யாதீர்கள்’, ‘நிறுவாதீர்கள்’, ‘வைக்காதீர்கள்’ என்ற இணையான தடை வடிவங்கள் மூலத்தின் கட்டமைப்பைத் தெளிவாகக் காட்டுகின்றன. ‘நிறுத்தப்பட்ட கல்’ மற்றும் ‘உருவம் பொறிக்கப்பட்ட கல்’ ஆகியவை தொழில்நுட்பத் துல்லியத்தையும் சாதாரண வாசகருக்கான தெளிவையும் சமநிலைப்படுத்துகின்றன.
