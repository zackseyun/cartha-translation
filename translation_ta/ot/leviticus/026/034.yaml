base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/034.yaml
  text: Then the land will enjoy its Sabbaths all the days of its desolation[a], while you are in the land of your enemies; then the land will rest and enjoy its Sabbaths.
translation:
  language: ta
  text: அப்போது அந்த நாடு பாழாய்க் கிடக்கும் காலமெல்லாம் தனக்குரிய ஓய்வுநாடுகளை அனுபவிக்கும்[a]; நீங்கள் உங்கள் பகைவர்களின் நாட்டில் இருக்கும்போது, அந்த நாடு ஓய்வெடுத்து தனக்குரிய ஓய்வுநாடுகளை அனுபவிக்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தனக்குரிய ஓய்வுநாடுகளுக்கான குறையை ஈடுசெய்யும்.” இச்சூழலில் எபிரெய வினை, முன்பு கிடைக்காத உரிய ஓய்வை நாடு பெற்றுக்கொள்வதையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: அப்போது
  rationale: முந்தைய நியாயத்தீர்ப்பின் விளைவு நிகழும் காலத்தை இயல்பாகக் குறிக்கிறது.
- source_word: תִּרְצֶה / וְהִרְצָת
  choice: அனுபவிக்கும்
  rationale: רצה என்ற வினை இச்சூழலில் முன்பு மறுக்கப்பட்ட ஓய்வுகளை நாடு பெற்றுக்கொள்வதைச் சுட்டுகிறது. எபிரெயச் சொல்லில் மகிழ்ச்சி அல்லது ஈடுசெய்தல் ஆகிய நிழற்பொருள்கள் இருக்கக்கூடும் என்பதால் மாற்று விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது; இரு இடங்களிலும் ஒரே சொல்லாட்சி வைக்கப்பட்டுள்ளது.
- source_word: הָאָרֶץ
  choice: அந்த நாடு
  rationale: இங்கு உலகம் முழுவதையும் அல்ல, உடன்படிக்கையின் குறிப்பிட்ட நாட்டையே குறிக்கிறது.
- source_word: אֶת שַׁבְּתֹתֶיהָ
  choice: தனக்குரிய ஓய்வுநாடுகளை
  rationale: நாட்டுக்குரிய சபத்து ஓய்வுகளை, குறிப்பாக ஓய்வாண்டுகளை, சுட்டும் எபிரெய வெளிப்பாட்டை நவீன தமிழில் தெளிவாக வழங்குகிறது.
- source_word: כֹּל יְמֵי הֳשַׁמָּה
  choice: பாழாய்க் கிடக்கும் காலமெல்லாம்
  rationale: நாடு பாழடைந்து கிடக்கும் முழுக் காலத்தையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וְאַתֶּם בְּאֶרֶץ אֹיְבֵיכֶם
  choice: நீங்கள் உங்கள் பகைவர்களின் நாட்டில் இருக்கும்போது
  rationale: நாடு பாழாய்க் கிடக்கும் காலத்துடன் சமகாலத்தில் நிகழும் சூழலைத் தெளிவாகக் காட்டுகிறது.
- source_word: תִּשְׁבַּת
  choice: ஓய்ந்திருந்து
  rationale: שבת என்பதன் உழவு முதலியவற்றிலிருந்து விலகி ஓய்வதைக் குறிக்கும் பொருளையும், ஓய்வுநாள் கருப்பொருளுடனான சொல் தொடர்பையும் பாதுகாக்கிறது.
theological_decisions:
- issue: நாடு தனது ஓய்வுநாடுகளுடன் கொண்டுள்ள உறவு
  choice: நாடு முன்பு மறுக்கப்பட்ட தனக்குரிய ஓய்வுகளைப் பாழ்க்காலத்தில் அனுபவிக்கிறது
  alternative: நாடு தனது ஓய்வுநாடுகளுக்கான ஈட்டை அடைகிறது
  rationale: சூழல் புறக்கணிக்கப்பட்ட ஓய்வாண்டுகளுக்கும் நாடுகடத்தல் நியாயத்தீர்ப்புக்கும் இடையிலான தொடர்பைக் காட்டுகிறது. முதன்மை உரை எபிரெய வினையின் பொதுவான நயத்தைப் பாதுகாக்கிறது; அதன் ஈடுசெய்யும் நிழற்பொருள் அடிக்குறிப்பில் வெளிப்படுத்தப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிமையும் கண்ணியமும் உடைய நடை. ‘அந்த நாடு’ என்பது குறிப்பிட்ட உடன்படிக்கை நாட்டைக் குறிக்கிறது; ‘ஓய்வுநாடுகள்’ என்ற சொல்லாட்சி சபத்து ஓய்வுகளையும் ஓய்வாண்டுகளையும் உள்ளடக்குமாறு வைக்கப்பட்டுள்ளது.
