translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் dignified நடையில் அமைக்கப்பட்டது. ‘பழையது/புதியது’ என்பவற்றின் மறைபொருளை ‘விளைச்சல்’ என்று தெளிவாக்கியுள்ளது; முதன்மை உரையில் תּוֹצִיאוּ என்பதன் நேரடியான இயக்கப் பொருள் பேணப்பட்டு, சூழல்சார் ‘அகற்றுதல்’ அடிக்குறிப்பில் தரப்பட்டுள்ளது.
