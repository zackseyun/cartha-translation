source:
  edition: WLC
  text: וַ/אֲכַלְתֶּ֥ם יָשָׁ֖ן נוֹשָׁ֑ן וְ/יָשָׁ֕ן מִ/פְּנֵ֥י חָדָ֖שׁ תּוֹצִֽיאוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/010.yaml
  text: You will eat old stores long kept[a], and you will clear out the old because of the new.
translation:
  language: ta
  text: நீங்கள் நீண்ட காலமாகச் சேமித்து வைத்த பழைய விளைச்சலை உண்பீர்கள்; புதிய விளைச்சலுக்காகப் பழையதை வெளியே கொண்டுவருவீர்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, சூழலின் நடைமுறைப் பொருளை வெளிப்படையாகக் கூறினால்: “புதிய விளைச்சலுக்காகப் பழையதை அகற்றுவீர்கள்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲכַלְתֶּם
  choice: உண்பீர்கள்
  rationale: உடன்படிக்கை ஆசீர்வாதங்களின் தொடரில் எதிர்கால வாக்குறுதியைக் குறிக்கும் வினையாக இருப்பதால், தமிழில் எதிர்கால வடிவம் இயல்பாகப் பொருளைத் தருகிறது.
- source_word: יָשָׁן נוֹשָׁן
  choice: நீண்ட காலமாகச் சேமித்து வைத்த பழைய விளைச்சல்
  rationale: יָשָׁן இங்கு பெயர்ச்சொல் போலப் பயன்படுத்தப்பட்டு முந்தைய அறுவடையின் சேமிப்பைக் குறிக்கிறது; נוֹשָׁן அதன் நீண்டகாலச் சேமிப்பை வலியுறுத்துகிறது. ‘விளைச்சல்’ பொருளைத் தெளிவாக்கினாலும் தானியம் என்று தேவையின்றிக் குறுக்கவில்லை.
- source_word: וְיָשָׁן
  choice: பழையதை
  rationale: முன்னரே குறிப்பிடப்பட்ட பழைய சேமிப்பு விளைச்சலைச் சுருக்கமாகச் சுட்டும் பெயர்ச்சொல் பயன்பாட்டைத் தமிழில் இயல்பாகப் பேணுகிறது.
- source_word: מִפְּנֵי חָדָשׁ
  choice: புதிய விளைச்சலுக்காக
  rationale: புதிய விளைச்சல் வந்ததன் காரணமாக அல்லது அதற்கு இடமளிக்கப் பழையது அகற்றப்படுவதைச் சுருக்கமாக வெளிப்படுத்துகிறது; எபிரெயச் சொற்றொடரின் காரணம்/இடமாற்றம் சார்ந்த நெகிழ்வையும் அளவுக்கு மீறித் தீர்மானிக்கவில்லை.
- source_word: תּוֹצִיאוּ
  choice: வெளியே கொண்டுவருவீர்கள்
  rationale: יצא என்பதன் ஹிஃபில் வடிவமான ‘வெளியே வரச் செய்தல், வெளியே கொண்டுவருதல்’ என்ற அடிப்படைப் பொருளை முறையாகப் பேணுகிறது. சூழலில் அகற்றுதல் என்ற நடைமுறை விளைவு இருந்தாலும் அதை மொழிபெயர்ப்பிலேயே மிகையாக விளக்கவில்லை.
