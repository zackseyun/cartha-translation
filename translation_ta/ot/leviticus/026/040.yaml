review_pass:
  verdict: revise
  source_fidelity: 'கருத்து முழுவதும் மூலத்துக்கு அணுக்கமாக உள்ளது: அவர்களுடையதும் தந்தையருடையதும் அக்கிரமம், யெகோவாவுக்கு எதிரான துரோகம், மற்றும் קֶרִי-யில் நடந்துகொண்டமை ஆகியவை தக்கவைக்கப்பட்டுள்ளன. ஆனால் தற்போதைய உரையில் ஒரே எபிரெய வினையான ‘அறிக்கையிடுதல்/ஒப்புக்கொள்ளுதல்’ இருமுறை (‘அறிக்கையிட்டு ... ஒப்புக்கொண்டால்’) வெளிப்படுகிறது; இதனால் மூலத்தின் ஒரு வினை-ஆளுகையும் தமிழ் வாக்கிய அமைப்பும் மங்குகின்றன.'
  naturalness: ‘அறிக்கையிட்டு ... ஒப்புக்கொண்டால்’ என்பது தேவையற்ற இரட்டை வினையாக்கம். எல்லாப் பொருள்களையும் இறுதியில் வரும் ‘ஒப்புக்கொண்டால்’ ஆளுமாறு அமைத்தல் நவீன தரத் தமிழில் இயல்பானதும் தெளிவானதும் ஆகும். ‘எனக்கு விரோதமாக நடந்துகொண்டதையும்’ என்பது தொடர்ச்சியான நடத்தை மற்றும் எதிர்ப்பின் உணர்வை இயல்பாகத் தருகிறது.
  terminology: ‘அக்கிரமம்,’ ‘தந்தையர்,’ ‘துரோகம்,’ ‘ஒப்புக்கொள்’ ஆகியவை கண்ணியமான பொதுவாசகத் தமிழ் வேதாகம நடைக்கு ஏற்றவை. மַעַל / מָעֲלוּ என்ற ஒரேவேர் வலியுறுத்தலை ‘தங்கள் துரோகத்தையும், தாங்கள் ... செய்த’ என முழுமையாக அதே சொல்லால் மீளச்செய்ய இயலாவிட்டாலும், ‘துரோகம்’ மற்றும் ‘செய்த’ அமைப்பு பொருளைத் தெளிவாகக் காக்கிறது. அடிக்குறிப்பில் קֶרִי என்பதன் பொருள் விவாதத்திற்குரியது என்பதைக் குறிக்க வேண்டும்.
  issues:
  - severity: medium
    issue: ஒரே மூல வினைக்கு இரட்டைத் தமிழ் வினை வழங்கப்பட்டுள்ளது.
    rationale: וְהִתְוַדּוּ என்பது ஒருமுறை மட்டுமே வருகிறது; ‘அறிக்கையிட்டு’ மற்றும் ‘ஒப்புக்கொண்டால்’ இரண்டையும் பயன்படுத்துவது பொருள்களைப் பிரித்தும் உரையைச் செயற்கையாகவும் ஆக்குகிறது.
