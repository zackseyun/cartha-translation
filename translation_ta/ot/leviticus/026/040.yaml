base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/040.yaml
  text: But if they confess their iniquity and the iniquity of their fathers[a], in the unfaithfulness by which they were unfaithful to me, and also that they walked contrary to me[b],
translation:
  language: ta
  text: ஆனால் அவர்கள் தங்கள் அக்கிரமத்தையும் தங்கள் தந்தையரின் அக்கிரமத்தையும், தாங்கள் எனக்கு எதிராகச் செய்த தங்கள் துரோகத்தையும், மேலும் எனக்கு விரோதமாக நடந்துகொண்டதையும்[a] ஒப்புக்கொண்டால்,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என்னிடம் பகைமையோடு நடந்துகொண்டதையும்.” இவ்வதிகாரத்தில் மீண்டும் மீண்டும் வரும் קֶרִי (கெரி) என்ற எபிரெயச் சொல்லின் பொருள் விவாதத்திற்குரியது; அது எதிர்ப்பு அல்லது பகைமை நிறைந்த நடத்தையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִתְוַדּוּ
  choice: அறிக்கையிட்டு ... ஒப்புக்கொண்டால்
  rationale: ידה என்பதன் ஹித்பயேல் வடிவம் ‘அறிக்கையிடுதல்/ஒப்புக்கொள்ளுதல்’ எனப் பொருள்படும். முந்தைய வசனத்திலிருந்து தொடரும் நிபந்தனை அமைப்பைத் தமிழில் இயல்பாக வெளிப்படுத்த, வாக்கிய முடிவில் ‘ஒப்புக்கொண்டால்’ வைக்கப்பட்டுள்ளது.
- source_word: עֲוֺנָם
  choice: தங்கள் அக்கிரமம்
  rationale: עָוֹן குற்றச்செயல், குற்றப்பழி ஆகிய இரண்டையும் குறிக்கக்கூடும்; இங்கு அறிக்கையிடப்பட வேண்டிய குற்றமுள்ள தீச்செயலைக் குறிக்க ‘அக்கிரமம்’ பொருத்தமானது.
- source_word: עֲוֺן אֲבֹתָם
  choice: தங்கள் தந்தையரின் அக்கிரமம்
  rationale: எபிரெய மூலத்தின் ஆண்பால் மூதாதையர் சொல்லையும், சொந்த அக்கிரமத்துடன் இணைந்த இணைப்பையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: בְּמַעֲלָם אֲשֶׁר מָעֲלוּ בִי
  choice: எனக்கு எதிராகத் துரோகம் செய்த தங்கள் துரோகம்
  rationale: மூலத்தில் மַעַל என்ற பெயர்ச்சொல்லும் அதே வேரிலான வினைச்சொல்லும் சேர்ந்து உடன்படிக்கை விசுவாசமின்மையை வலியுறுத்துகின்றன. ‘துரோகம்/துரோகம் செய்த’ என்ற சொல் மீளுருவாக்கம் அந்த அழுத்தத்தைத் தமிழிலும் காக்கிறது.
- source_word: וְאַף
  choice: மேலும்
  rationale: அறிக்கையின் இன்னொரு கூறைச் சேர்க்கும் இணைப்பாக நவீன தமிழில் இயல்பாக உள்ளது.
- source_word: הָלְכוּ עִמִּי בְּקֶרִי
  choice: எனக்கு விரோதமாக நடந்தார்கள்
  rationale: קֶרִי என்பது இவ்வதிகாரத்தில் எதிர்ப்பு அல்லது பகைமையான நடத்தையைக் குறிக்கும் கடினமான சொல். ‘விரோதமாக நடந்தார்கள்’ என்பதில் நடத்தை உருவகமும் எதிர்ப்புணர்வும் காக்கப்படுகின்றன.
theological_decisions:
- issue: மூதாதையரின் அக்கிரமத்தையும் உள்ளடக்கும் கூட்டு அறிக்கை
  choice: ‘தங்கள் தந்தையரின் அக்கிரமம்’ என்பதைத் தெளிவாகத் தக்கவைத்தல்
  alternative: ‘தங்கள் முன்னோரின் பாவங்கள்’ அல்லது ‘தந்தையரால் வந்த விளைவுகள்’
  rationale: மூலம் அவர்களுடைய சொந்த அக்கிரமத்தோடு தந்தையரின் அக்கிரமத்தையும் அறிக்கையிடுவதை வெளிப்படையாகக் கூறுகிறது. அதன் உடன்படிக்கை சார்ந்த கூட்டு பரிமாணத்தைத் தனிநபர்மயமாக்காமலும் கூடுதல் கோட்பாட்டு விளக்கத்தைச் சேர்க்காமலும் பாதுகாக்க வேண்டும்.
translation_notes:
  register: நவீன தரத் தமிழ்; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. மூலத்தின் ஒரேவேர் சொல் மீளுருவாக்கத்தை ‘துரோகம் செய்த தங்கள் துரோகம்’ எனப் பாதுகாத்துள்ளது. வசனம் அடுத்த வசனத்தில் தொடரும் நிபந்தனை வாக்கியத்தின் ஒரு பகுதி என்பதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
