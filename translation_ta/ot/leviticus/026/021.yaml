base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/021.yaml
  text: And if you walk contrary to me and are not willing to listen to me[b][a], then I will continue to strike you sevenfold according to your sins.
translation:
  language: ta
  text: “நீங்கள் எனக்கு எதிராக நடந்துகொண்டு, எனக்குச் செவிகொடுக்க விரும்பாவிட்டால்,[a] உங்கள் பாவங்களுக்கு ஏற்றவாறு உங்களை இன்னும் ஏழு மடங்கு தாக்குவேன்.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீங்கள் என்னிடம் பகைமையுடன் நடந்துகொண்டு, எனக்குச் செவிகொடுக்க விரும்பாவிட்டால்.” ‘என்னுடன் கெரியாக நடப்பது’ என்ற எபிரெய மரபுத்தொடர் பொருள் காண்பதற்குக் கடினமானது; இவ்வதிகாரத்தில் அது வெறும் தற்செயலை அல்ல, எதிர்ப்பு அல்லது பகைமை மனப்பான்மையைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: நேரடியாக, “உங்கள் பாவங்களுக்கு ஏற்றவாறு உங்கள்மேல் ஏழு மடங்கு மேலும் ஒரு தாக்குதலைச் சேர்ப்பேன்.”
    reason: alternative_reading
lexical_decisions:
- source_word: קֶרִי
  choice: எதிராக
  rationale: இச்சொல் கடினமான எபிரெய மரபுத்தொடரில் வருகிறது. இவ்வதிகாரத்தில் அது தற்செயலைவிட எதிர்ப்பு மனப்பான்மையைக் குறிப்பதால், இயல்பான தமிழில் ‘எதிராக’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: תֵּלְכוּ עִמִּי קֶרִי
  choice: எனக்கு எதிராக நடந்துகொண்டு
  rationale: ‘நடத்தல்’ என்பது ஒருவரின் வாழ்க்கை முறையையோ நடத்தையையோ குறிக்கும் எபிரெய வழக்கு. ‘நடந்துகொண்டு’ என்ற சொல் மூல உருவகத்தையும், ‘எதிராக’ என்பது அதன் சூழல்சார் பொருளையும் காக்கின்றன.
- source_word: תֹאבוּ
  choice: விரும்பாவிட்டால்
  rationale: இவ்வினைச்சொல் வெறும் செயற்பாட்டின்மையை அல்ல, மனவிருப்பமின்மையை வெளிப்படுத்துகிறது. ‘விரும்பாவிட்டால்’ அதன் நோக்கத்தையும் நிபந்தனை அமைப்பையும் இயல்பாகத் தருகிறது.
- source_word: לִשְׁמֹעַ לִי
  choice: எனக்குச் செவிகொடுக்க
  rationale: உடன்படிக்கைச் சூழலில் கேட்டல் கீழ்ப்படிதலையும் உள்ளடக்கலாம். ‘செவிகொடுக்க’ என்பது கேட்டல் என்ற அடிப்படைப் பொருளையும் அதிலுள்ள கீழ்ப்படிதல் நுணுக்கத்தையும் வெளிப்படையாகத் தீர்மானிக்காமல் காக்கிறது.
- source_word: וְיָסַפְתִּי
  choice: இன்னும்
  rationale: இதன் அடிப்படைப் பொருள் ‘சேர்த்தல்’ அல்லது ‘மேலும் செய்தல்.’ முன்னைய தண்டனைகளோடு கூடுதலாக வரும் நடவடிக்கையைத் தமிழில் ‘இன்னும்’ இயல்பாக உணர்த்துகிறது.
- source_word: מַכָּה
  choice: தாக்குவேன்
  rationale: பெயர்ச்சொல் வடிவில் ‘அடி/தாக்குதல்/வாதை’ எனப் பொருள்படலாம். தமிழ் வாக்கிய அமைப்பில் வினையாக வழங்குவது இயல்பாகவும், தண்டனையின் பொதுவான தன்மையை ‘கொள்ளைநோய்’ போன்ற குறிப்பிட்ட வடிவாகக் குறுக்காமல் இருக்கவும் உதவுகிறது.
- source_word: שֶׁבַע
  choice: ஏழு மடங்கு
  rationale: இங்கு இது தீவிரத்தையோ அளவையோ குறிக்கும் வினையடைப் பயன்பாட்டைக் கொண்டுள்ளது. ‘ஏழு மடங்கு’ உடன்படிக்கைத் தண்டனைச் சூத்திரத்தின் அளவுயர்வைத் தெளிவாகக் காட்டுகிறது.
- source_word: כְּחַטֹּאתֵיכֶם
  choice: உங்கள் பாவங்களுக்கு ஏற்றவாறு
  rationale: כְּ முன்னொட்டு இங்கு ஒப்புமை அல்லது அளவுப்பொருத்தத்தைக் குறிக்கிறது. ‘ஏற்றவாறு’ என்பது வெறும் காரணத்தை மட்டுமல்லாமல், பாவங்களுக்கும் தண்டனைக்கும் உள்ள பொருத்தத்தையும் காக்கிறது.
theological_decisions:
- issue: உடன்படிக்கைத் தண்டனைச் சூத்திரத்தின் தன்மை
  choice: இஸ்ரவேலரின் பாவங்களுக்கு ஏற்றவாறு தீவிரமடையும் இறைத்தீர்ப்பாக மொழிபெயர்த்தல்; அதன் குறிப்பிட்ட வடிவத்தை நிர்ணயிக்காமல் விடுதல்.
  alternative: מַכָּה என்பதை குறிப்பாக ‘கொள்ளைநோய்’ அல்லது ‘வாதை’ என்றும், כְּחַטֹּאתֵיכֶם என்பதை வெறும் ‘உங்கள் பாவங்களுக்காக’ என்றும் மொழிபெயர்த்தல்.
  rationale: இவ்வசனம் லேவியராகமம் 26-இன் படிப்படியாகத் தீவிரமடையும் உடன்படிக்கைச் சாபங்களின் தொடரில் உள்ளது. எபிரெயம் கட்டாயப்படுத்தாத ஒரு குறிப்பிட்ட தண்டனை முறையைச் சேர்க்காமல், தீர்ப்பின் தீவிரத்தையும் பாவங்களுக்கு ஏற்ப அது வருவதையும் மொழிபெயர்ப்பு காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வழங்கப்பட்டது. ‘நடந்துகொண்டு,’ ‘செவிகொடுக்க’ ஆகியவை மூலத்தின் உருவகத்தையும் உடன்படிக்கைச் சூழலின் நுணுக்கத்தையும் காக்கின்றன; கடினமான קֶרִי சொல்லின் மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
