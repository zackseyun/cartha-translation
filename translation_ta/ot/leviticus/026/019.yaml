source:
  edition: WLC
  text: וְ/שָׁבַרְתִּ֖י אֶת גְּא֣וֹן עֻזְּ/כֶ֑ם וְ/נָתַתִּ֤י אֶת שְׁמֵי/כֶם֙ כַּ/בַּרְזֶ֔ל וְ/אֶֽת אַרְצְ/כֶ֖ם כַּ/נְּחֻשָֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/019.yaml
  text: And I will break the pride of your strength[b][a], and I will make your heavens like iron and your land like bronze.
translation:
  language: ta
  text: உங்கள் வலிமையின் பெருமையை நான் உடைப்பேன்; உங்கள் வானத்தை[a] இரும்பைப் போலவும், உங்கள் நிலத்தை வெண்கலத்தைப் போலவும்[b] ஆக்குவேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘வானங்கள்’ என்று பன்மை வடிவம் உள்ளது; அது பெரும்பாலும் மேலுள்ள வானத்தைக் குறிக்கும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘செம்பைப் போலவும்.’ எபிரெயச் சொல் செம்பையோ வெண்கலத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁבַרְתִּי
  choice: நான் முறித்துப்போடுவேன்
  rationale: שׁבר என்பதன் அடிப்படைப் பொருளான ‘முறித்தல்’ என்பதையும், பெருமையைத் தகர்க்கும் உருவகத்தையும் இயல்பான தமிழில் காக்கிறது.
- source_word: גְּאוֹן עֻזְּכֶם
  choice: உங்கள் வலிமையின் பெருமை
  rationale: எபிரெய genitive அமைப்பையும், தங்கள் வலிமையை நம்பியதால் எழும் செருக்கு என்ற எதிர்மறை நிழற்பொருளையும் தேவையின்றி விரித்துரைக்காமல் காக்கிறது.
- source_word: וְנָתַתִּי
  choice: ஆக்குவேன்
  rationale: נתן என்பதற்கு சொற்பொருளாக ‘கொடுப்பேன்/வைப்பேன்’ என்று இருந்தாலும், இங்கு ஒப்புமையுடன் வரும் இவ்வமைப்பில் ஒரு நிலைக்கு மாற்றுவதை இயல்பாகக் குறிக்கிறது.
- source_word: שְׁמֵיכֶם
  choice: உங்கள் வானம்
  rationale: எபிரெயத்தில் பன்மை வடிவம் இருந்தாலும், மழை தரும் மேலுள்ள வானைக் குறிக்கும் இடத்தில் நவீனத் தமிழில் ஒருமை இயல்பானது; மூல வடிவம் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: כַּבַּרְזֶל
  choice: இரும்பைப் போல
  rationale: மழையைத் தராமல் கடினமாகவும் இணங்காததாகவும் இருக்கும் வானத்தைச் சித்தரிக்கும் ஒப்புமையை நேரடியாகக் காக்கிறது.
- source_word: אַרְצְכֶם
  choice: உங்கள் நிலம்
  rationale: உடன்படிக்கைச் சாபத்தின் வேளாண்மைச் சூழலில் אֶרֶץ என்பது பயிரிடப்படும் நாட்டுநிலத்தைச் சுட்டுவதால் ‘நிலம்’ பொருத்தமானது.
- source_word: כַּנְּחֻשָׁה
  choice: வெண்கலத்தைப் போல
  rationale: נְחֻשָׁה செம்பையோ வெண்கலத்தையோ குறிக்கலாம்; கடினமான, விளைச்சலற்ற நிலத்தின் உருவகத்தில் ‘வெண்கலம்’ இயல்பான முதன்மைத் தேர்வு.
theological_decisions:
- issue: சாப உருவகத்தின் பொருள்
  choice: வானம் இரும்பைப் போலவும் நிலம் வெண்கலத்தைப் போலவும் ஆகும் என்ற உருவகத்தை அப்படியே வைத்தல்
  alternative: வறட்சியும் விளைச்சலின்மையும் நேரடியாகக் கூறுதல்
  rationale: சூழல் வறட்சியையும் வேளாண்மை விளைச்சலின்மையையும் சுட்டினாலும், மூல வசனம் அவற்றை உலோக உருவகங்களால் கூறுகிறது; மொழிபெயர்ப்பு அந்த உருவகத்தையும் அதன் வலிமையையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய உருவகமும் இணையான வாக்கிய அமைப்பும் காக்கப்பட்டுள்ளன; தமிழில் இயல்புக்காக ‘வானம்’ ஒருமையில் வழங்கப்பட்டு மூலத்தின் பன்மை அடிக்குறிப்பில் பதிவு செய்யப்பட்டுள்ளது.
