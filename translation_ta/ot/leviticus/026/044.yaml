base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/044.yaml
  text: Yet even then[a], when they are in the land of their enemies, I will not reject them, and I will not abhor them so as to destroy them, to break my covenant with them[c][b]; for I am Yahweh their God.
translation:
  language: ta
  text: ஆனாலும், அவர்கள் தங்கள் பகைவர்களின் நாட்டில் இருக்கும்போதும், அவர்களை முற்றிலும் அழித்து, அவர்களோடு செய்த என் உடன்படிக்கையை முறிப்பதற்காக நான் அவர்களை நிராகரிக்கவோ அருவருக்கவோ மாட்டேன். ஏனெனில், நானே அவர்களுடைய கடவுளான யாவே.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “யாவே” என்பது எபிரெயத்தில் வரும் יהוה (YHWH) என்ற இறைப்பெயர்.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאַף גַּם זֹאת
  choice: ஆனாலும்
  rationale: முந்தைய தண்டனைகளுக்கு மத்தியிலும் அடுத்து கூறப்படுவது நிலைத்திருப்பதை இயல்பான நவீன தமிழில் சலுகை-எதிர்மறைத் தொடர்புடன் தெரிவிக்கிறது.
- source_word: בִּהְיוֹתָם בְּאֶרֶץ אֹיְבֵיהֶם
  choice: அவர்கள் தங்கள் பகைவர்களின் நாட்டில் இருக்கும்போதும்
  rationale: ב prefixed infinitive construct-இன் காலச் சூழலை ‘இருக்கும்போது’ என்றும், concessive force-ஐ ‘-உம்’ என்றும் தெளிவாகக் காட்டுகிறது.
- source_word: לֹא מְאַסְתִּים
  choice: அவர்களைப் புறக்கணிக்கவும் மாட்டேன்
  rationale: מָאַס இங்கு உடன்படிக்கை உறவில் நிராகரித்துத் தள்ளுவதை குறிக்கிறது; ‘புறக்கணிக்க’ என்பது பொதுவாசகருக்குப் புரியும் மரியாதையான தமிழ், அடுத்த வலுவான வினையிலிருந்து வேறுபாட்டையும் காக்கிறது.
- source_word: וְלֹא גְעַלְתִּים
  choice: அருவருக்கவும் மாட்டேன்
  rationale: גָּעַל குறிக்கும் வலுவான வெறுப்பு/அருவருப்பு உணர்வை ‘அருவருக்க’ நேரடியாகப் பாதுகாக்கிறது.
- source_word: לְכַלֹּתָם
  choice: அவர்களை முற்றிலும் அழித்துவிடும் அளவுக்கு
  rationale: כלה-வின் முழுமையாக முடிவுக்குக் கொண்டுவரும் பொருளையும், முந்தைய வினைகளுடன் உள்ள விளைவு அல்லது எல்லைத் தொடர்பையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לְהָפֵר בְּרִיתִי אִתָּם
  choice: அவர்களோடு செய்த என் உடன்படிக்கையை முறிக்கவும் மாட்டேன்
  rationale: הֵפֵר என்பதன் உடன்படிக்கையைச் செல்லாததாக்குதல்/முறித்தல் என்ற தீவிரத்தை ‘முறிக்க’ தெளிவாகத் தருகிறது; ‘செய்த’ என்பது தமிழில் உறவைக் கூற இயல்பாகச் சேர்க்கப்பட்டது.
- source_word: כִּי אֲנִי יְהוָה אֱלֹהֵיהֶם
  choice: ஏனெனில், நானே அவர்களுடைய கடவுளாகிய யாவே
  rationale: כִּי வழங்கும் காரணத்தை ‘ஏனெனில்’ காக்கிறது; אֲנִי-யின் வலியுறுத்தலை ‘நானே’ காட்டுகிறது; יהוה தனிப்பெயராக ஒலிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: எபிரெய மூலத்தில் உடன்படிக்கையின் தனிப்பெயர் நேரடியாக உள்ளது. பட்டப்பெயராக மாற்றாமல், வழக்கமான தமிழ் ஒலிபெயர்ப்பான ‘யாவே’ பயன்படுத்தப்பட்டு, அதன் மூல வடிவம் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- issue: מְאַסְתִּים மற்றும் גְעַלְתִּים ஆகிய qatal வினைகளின் கால/நிலை மதிப்பு
  choice: 'எதிர்கால உறுதி: ‘மாட்டேன்’'
  alternative: ‘புறக்கணிக்கவில்லை / அருவருக்கவில்லை’ அல்லது ‘புறக்கணிப்பதில்லை / அருவருப்பதில்லை’
  rationale: வரவிருக்கும் பகைவர் நாட்டிலான நிலையைச் சூழலாகக் கொண்ட வாக்குறுதி என்பதால் எதிர்கால உறுதி இயல்பாகிறது; எபிரெய qatal-ஐ வெறும் கடந்தகாலமாகக் கட்டுப்படுத்தாமல் அதன் உரையாடல் செயல்பாட்டைத் தருகிறது.
- issue: லְכַלֹּתָם மற்றும் לְהָפֵר ஆகிய இரு infinitive-களின் தொடர்பு
  choice: முழு அழிவும் உடன்படிக்கை முறிவும் இரண்டும் மறுக்கப்படும் இணை விளைவுகள்
  alternative: ‘அவர்களை அழித்து, அதன் மூலம் உடன்படிக்கையை முறிக்க’ என்ற தொடர்ச்சியான நோக்கம்
  rationale: எபிரெய தொடரமைப்பு இரு வாசிப்புகளுக்கும் இடமளிக்கிறது. தமிழ் வாக்கியம் இரண்டையும் ஒரே மறுப்பின் கீழ் இணைத்துக் காட்டி, உடன்படிக்கை முறிவை அழிவின் விளைவாக மட்டும் கட்டாயப்படுத்தவில்லை.
translation_notes:
  register: நவீன தரத் தமிழ்; சாதாரண வாசகர்களுக்குத் தெளிவாகவும் வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் அமைக்கப்பட்டது. வலுவான அருவருப்பு மொழியும் உடன்படிக்கைத் தீவிரமும் மெலிதாக்கப்படவில்லை. ஒரே அடிக்குறிப்பு குறியீடு [a] முதன்மை உரையில் இடம்பெற்றுள்ளது.
