  text: וְ/אִ֨ם בְּ/זֹ֔את לֹ֥א תִשְׁמְע֖וּ לִ֑/י וַ/הֲלַכְתֶּ֥ם עִמִּ֖/י בְּ/קֶֽרִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/027.yaml
  text: But if in spite of this you will not listen to me[a], and you walk contrary to me[b],
translation:
  language: ta
  text: ஆனால், இவற்றையெல்லாம் மீறியும்[a] நீங்கள் எனக்குச் செவிகொடுக்காமல், எனக்கு எதிராக நடந்துகொண்டால்[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இவையெல்லாம் இருந்தபோதிலும்.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “என்னுடன் எதிர்ப்பான முறையில் நடந்து”; இது கடவுளுக்கு எதிராக நடந்துகொள்வதைக் குறிக்கும் ஒரு மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: ஆனால் … நடந்தால்
  rationale: தொடர்ந்து தீவிரமாகும் உடன்படிக்கை எச்சரிக்கையின் அடுத்த நிபந்தனையை அறிமுகப்படுத்துகிறது. ‘ஆனால்’ என்பது முந்தைய சூழலோடு உள்ள எதிர்மறைத் தொடர்ச்சியையும், ‘நடந்தால்’ என்பது நிபந்தனையையும் இயல்பான தமிழில் வெளிப்படுத்துகின்றன.
- source_word: בְּזֹאת
  choice: இவையெல்லாம் நடந்த பிறகும்
  rationale: முன்பு கூறப்பட்ட தண்டனை நடவடிக்கைகளைச் சுட்டி, அவை நடந்தபோதிலும் என்ற விட்டுக்கொடுப்பு நுணுக்கத்தைத் தருகிறது; வெறும் ‘இதில்’ என்ற நேரடி பொருள் இச்சூழலுக்குப் போதாது.
- source_word: לֹא תִשְׁמְעוּ לִי
  choice: நீங்கள் எனக்குச் செவிகொடுக்காமல்
  rationale: שׁמע என்ற சொல்லின் கேட்பது என்னும் உருவகத்தையும், அதற்குள் அடங்கிய கீழ்ப்படிந்து ஏற்றுக்கொள்ளுதல் என்னும் பொருளையும் ஒருங்கே காக்கிறது.
- source_word: וַהֲלַכְתֶּם
  choice: நடந்துகொண்டால்
  rationale: הלך இங்கு உடல்சார் நடையை மட்டும் குறிக்காமல் நடத்தை அல்லது வாழ்க்கை முறையைக் குறிக்கும் மரபுத்தொடராக உள்ளது. ‘நடந்துகொள்’ என்பது தமிழில் அந்த நடத்தைப் பொருளை இயல்பாகத் தருகிறது.
- source_word: עִמִּי בְּקֶרִי
  choice: எனக்கு எதிராக நடந்துகொண்டால்
  rationale: சொல்லுக்குச் சொல் ‘என்னுடன் எதிர்ப்பில் நடப்பது’ என்ற கடினமான அமைப்பைக் கொண்ட எபிரெய மரபுத்தொடர், கடவுளுக்கு எதிரான அல்லது பகைமையான நடத்தையைக் குறிக்கிறது. ‘எனக்கு எதிராக’ என்பது அதன் உறவுசார் எதிர்ப்பைத் தெளிவாகவும் மிகைவிளக்கமின்றியும் தருகிறது.
theological_decisions:
- issue: லேவியராகமம் 26-இல் வரும் உடன்படிக்கை எச்சரிக்கை மரபுத்தொடர்
  choice: ‘எனக்கு எதிராக நடந்துகொண்டால்’ என்று உறவுசார் எதிர்ப்பையும் நடத்தை உருவகத்தையும் காத்தல்
  alternative: ‘எனக்குக் கீழ்ப்படியாமல் இருந்தால்’ அல்லது ‘என்னிடம் பகைமையுடன் நடந்துகொண்டால்’
  rationale: இவ்வசனம் வெறும் கீழ்ப்படியாமையை மட்டுமல்ல, உடன்படிக்கை உறவில் கடவுளுக்கு எதிரான நிலைப்பாட்டையும் சித்தரிக்கிறது. தேர்ந்த மொழிபெயர்ப்பு அந்தத் தீவிரத்தைத் தக்கவைத்து, ‘பகைமை’ என்ற இன்னும் குறிப்பான விளக்கத்தை மூலத்திற்குள் திணிக்காமல் விடுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘செவிகொடுக்காமல்’ என்பது கேட்பதும் கீழ்ப்படிவதும் இணைந்த எபிரெய நுணுக்கத்தைப் பேணுகிறது; ‘எதிராக நடந்துகொண்டால்’ என்பது முக்கியமான நடை/நடத்தை உருவகத்தை இயல்பான தமிழில் காக்கிறது.
