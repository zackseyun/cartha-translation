  yaml_path: translation/ot/leviticus/026/035.yaml
  text: All the days of its desolation it shall rest—the rest that it did not have during your Sabbaths[b][a], while you were dwelling on it.
translation:
  language: ta
  text: அது பாழாயிருக்கும் நாட்களெல்லாம் அது ஓய்வெடுக்கும்; நீங்கள் அதில் குடியிருந்த காலத்தில் உங்கள் ஓய்வுநாட்களில்[b] அது பெறாத ஓய்வை அது பெறும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொற்சொல்லாக: “உங்கள் ஓய்வுநாட்களில் அது ஓயாததை ஓயும்.” எபிரெயில் ‘ஓய்தல்’ என்ற வினை வலியுறுத்தலுக்காக மீண்டும் வருகிறது.'
    reason: lexical_alternative
  - marker: b
    text: இங்கே “உங்கள் ஓய்வுநாட்கள்” என்பது சுற்றியுள்ள சூழலில், குறிப்பாக நிலத்துக்குக் கொடுக்கப்பட வேண்டிய ஓய்வுகளையும் ஓய்வு ஆண்டுகளையும் குறிக்கிறது.
    reason: cross_reference
lexical_decisions:
- source_word: כָּל יְמֵי הָשַּׁמָּה
  choice: அது பாழாயிருக்கும் நாட்களெல்லாம்
  rationale: כָּל יְמֵי என்பது காலத்தின் முழுமையைக் குறிக்கிறது; הָשַּׁמָּה என்பதிலுள்ள பெண்பால் ஒருமைச் சுட்டு நிலத்தைக் குறிக்கிறது. தமிழில் இயல்பாகவும் தெளிவாகவும் இருக்க, நிலைமையை காலவாக்கியமாக மொழிபெயர்க்கப்பட்டது.
- source_word: תִּשְׁבֹּת
  choice: ஓய்ந்திருக்கும்
  rationale: שׁבת என்ற வினை இங்கு நிலத்தைக் குறிக்கும் பெண்பால் ஒருமையில் வந்து, உழவிலிருந்து ஓய்வதைச் சுட்டுகிறது. ‘ஓய்ந்திருக்கும்’ என்பது தொடரும் எதிர்கால ஓய்வை இயல்பாகத் தெரிவிக்கிறது.
- source_word: אֵת אֲשֶׁר לֹא שָׁבְתָה
  choice: அது பெறாத ஓய்வை அப்போது பெறும்
  rationale: אֵת אֲשֶׁר என்பது முந்தைய வினையின் பொருளை அறிமுகப்படுத்துகிறது. எபிரெயில் ‘ஓய்தல்’ வினை மீண்டும் வருவதைத் தமிழில் முற்றிலும் சொற்சொல்லாகக் கூறினால் செயற்கையாக இருக்கும்; ‘பெறாத ஓய்வைப் பெறும்’ என்பது அதன் தொடர்புடைய கருத்தையும் வலியுறுத்தலையும் காக்கிறது.
- source_word: בְּשַׁבְּתֹתֵיכֶם
  choice: உங்கள் ஓய்வுநாட்களில்
  rationale: שַׁבָּתוֹת என்பதன் பன்மை வடிவமும் இரண்டாம் நபர் பன்மை உரிமைச் சுட்டும் காக்கப்பட்டுள்ளன. சூழலில் இது குறிப்பாக நிலத்துக்குரிய ஓய்வுக் காலங்களைச் சுட்டுவதால் விளக்கக் குறிப்பு சேர்க்கப்பட்டுள்ளது.
- source_word: בְּשִׁבְתְּכֶם עָלֶיהָ
  choice: நீங்கள் அதில் குடியிருந்தபோது
  rationale: ישׁב என்பதன் infinitive construct காலப் பொருளில் வந்துள்ளது; עָלֶיהָ நிலத்தைக் குறிக்கிறது. ‘அதில் குடியிருந்தபோது’ என்பது நவீனத் தமிழில் இயல்பானதும் மூலத்தின் காலத் தொடர்பைக் காப்பதும் ஆகும்.
theological_decisions:
- issue: ‘உங்கள் ஓய்வுநாட்கள்’ என்பதன் குறிப்பு
  choice: முதன்மை உரையில் ‘உங்கள் ஓய்வுநாட்களில்’ என்று வடிவத்தை நெருக்கமாகக் காத்து, சூழல் பொருளை அடிக்குறிப்பில் விளக்குதல்
  alternative: ‘நிலத்தின் ஓய்வு ஆண்டுகளில்’ என்று உரையிலேயே விளக்கமாக மொழிபெயர்த்தல்
  rationale: லேவியராகமம் 26:34-ன் உடனடி சூழல் நிலத்துக்குரிய ஓய்வைக் காட்டினாலும், மூலத்தில் உள்ள இரண்டாம் நபர் உரிமைச் சுட்டையும் ‘சப்பாத்துகள்/ஓய்வுகள்’ என்ற பொதுவான வடிவத்தையும் பிரதான உரையில் காப்பது உண்மையான சொற்றொடர் அமைப்பையும் அதன் இறையியல் அழுத்தத்தையும் முன்கூட்டியே குறுக்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. நிலம் பெண்பால் ஒருமையாகச் சுட்டப்படுவது தமிழில் ‘அது’ என இயல்பாக்கப்பட்டுள்ளது. மூலத்தின் ஓய்வு/ஓயாதிருத்தல் என்ற மீளுரைப்பை பிரதான உரையில் ‘ஓய்ந்திருக்கும்… பெறாத ஓய்வைப் பெறும்’ என்று பொருள் தெளிவுடன் காத்து, சொற்சொல் வடிவம் அடிக்குறிப்பில் வழங்கப்பட்டுள்ளது.
