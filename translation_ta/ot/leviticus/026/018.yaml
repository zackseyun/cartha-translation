source:
  edition: WLC
  text: וְ/אִ֨ם עַד אֵ֔לֶּה לֹ֥א תִשְׁמְע֖וּ לִ֑/י וְ/יָסַפְתִּי֙ לְ/יַסְּרָ֣ה אֶתְ/כֶ֔ם שֶׁ֖בַע עַל חַטֹּאתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/018.yaml
  text: And if[a], despite these things, you do not listen to me[b], then I will continue to discipline you sevenfold for your sins.
translation:
  language: ta
  text: இவற்றையெல்லாம் மீறியும் நீங்கள் எனக்குச் செவிகொடுக்காவிட்டால், உங்கள் பாவங்களுக்காக உங்களை மேலும் ஏழு மடங்கு தண்டித்துத் திருத்துவேன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: நீங்கள் ... செவிகொடுக்காவிட்டால்
  rationale: நிபந்தனையை இயல்பான தமிழ் எதிர்மறை நிபந்தனை வினைமுற்றால் வெளிப்படுத்துகிறது; וְ என்பதன் தொடர்ச்சி அடுத்துள்ள ‘இவற்றிற்குப் பிறகும்’ மற்றும் வாக்கிய ஓட்டத்தில் வெளிப்படுகிறது.
- source_word: עַד אֵלֶּה
  choice: இவற்றிற்குப் பிறகும்
  rationale: முந்தைய தண்டனைத் தீர்ப்புகள் நேர்ந்த பிறகும் கீழ்ப்படியாமை நீடிப்பதை இந்த எபிரேய மரபுத்தொடர் குறிக்கிறது; வெறும் கால எல்லையாகப் பொருள்கொள்ளவில்லை.
- source_word: לֹא תִשְׁמְעוּ לִי
  choice: நீங்கள் எனக்குச் செவிகொடுக்காவிட்டால்
  rationale: שׁמע என்பதிலுள்ள கேட்டல் உருவகத்தையும், அதில் உட்பட்ட கீழ்ப்படிதல் கருத்தையும் ‘செவிகொடு’ இயல்பாகத் தக்கவைக்கிறது.
- source_word: וְיָסַפְתִּי
  choice: மேலும் ... திருத்துவேன்
  rationale: முந்தைய நடவடிக்கையின் தொடர்ச்சியையும் தீவிரப்படுத்துதலையும் ‘மேலும்’ சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: לְיַסְּרָה אֶתְכֶם
  choice: உங்களைக் கண்டித்துத் திருத்துவேன்
  rationale: יסר என்பதில் உள்ள தண்டனை சார்ந்த கண்டிப்பையும் திருத்தும் நோக்கத்தையும் இணைத்துப் பாதுகாக்கிறது; வெறும் பழிவாங்கும் தண்டனையாகவோ மென்மையான அறிவுரையாகவோ குறுக்கவில்லை.
- source_word: שֶׁבַע
  choice: ஏழு மடங்கு
  rationale: நியாயத்தீர்ப்பு சூத்திரத்தில் தண்டனையின் தீவிரமான அளவை இயல்பான தமிழில் காட்டுகிறது; நேரடியாக எண்ணிக்கையைக் குறிக்கும் வாய்ப்பை அடிக்குறிப்பு தக்கவைக்கிறது.
- source_word: עַל חַטֹּאתֵיכֶם
  choice: உங்கள் பாவங்களுக்காக
  rationale: ஒழுக்க நடவடிக்கைக்கான காரணம் அவர்களுடைய பாவங்கள் என்பதை இயல்பாகவும் தெளிவாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: உடன்படிக்கைச் சாபங்களின் சூழலில் יָסַר என்பதன் இயல்பு
  choice: கண்டித்துத் திருத்துவேன்
  alternative: தண்டிப்பேன்
  rationale: இங்கு நடவடிக்கை தண்டனைத் தன்மையுடையதாயினும் திருத்தும் நோக்கத்தையும் கொண்டுள்ளது. இரு கூறுகளுக்கிடையிலான இறையியல் பதற்றத்தை மொழிபெயர்ப்பு தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘செவிகொடுக்காவிட்டால்’ கேட்டலையும் கீழ்ப்படிதலையும் இணைக்கிறது; ‘கண்டித்துத் திருத்துவேன்’ தண்டனை மற்றும் சீர்திருத்தம் ஆகிய இரண்டையும் தக்கவைக்கிறது.
