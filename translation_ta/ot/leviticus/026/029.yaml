source:
  edition: WLC
  text: וַ/אֲכַלְתֶּ֖ם בְּשַׂ֣ר בְּנֵי/כֶ֑ם וּ/בְשַׂ֥ר בְּנֹתֵי/כֶ֖ם תֹּאכֵֽלוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/029.yaml
  text: And you will eat the flesh of your sons, and you will eat the flesh of your daughters.
translation:
  language: ta
  text: உங்கள் மகன்களின் சதையை நீங்கள் தின்பீர்கள்; உங்கள் மகள்களின் சதையையும் நீங்கள் தின்பீர்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲכַלְתֶּם
  choice: நீங்கள் தின்பீர்கள்
  rationale: אכל என்பதன் கால் வினை வடிவம், இரண்டாம் நபர் ஆண்பால் பன்மை. உடன்படிக்கைச் சாபங்களின் தொடரில் இது வரவிருக்கும் கொடிய விளைவை முன்னறிவிக்கிறது. ‘தின்பீர்கள்’ என்பது அதன் நேரடியான, அதிர்ச்சியூட்டும் பொருளை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: בְּשַׂר
  choice: சதையை
  rationale: בָּשָׂר என்பதற்கு இங்கு ‘சதை’ என்பது பொருத்தமான நேரடி இணை. ‘இறைச்சி’ என்பதைவிட மனித உடலைத் தின்பதன் கொடூரத்தை மறைக்காமல் வெளிப்படுத்துகிறது.
- source_word: בְּנֵיכֶם
  choice: உங்கள் மகன்களின்
  rationale: ஆண்பால் பன்மையான ‘மகன்கள்’ என்பதைத் தனிப்பட மொழிபெயர்க்கிறது; அடுத்ததாக மகள்கள் தனியே குறிப்பிடப்படுவதால் இதை பொதுவான ‘பிள்ளைகள்’ என மாற்றவில்லை.
- source_word: וּבְשַׂר
  choice: சதையையும்
  rationale: எபிரெய உரையின் இணைப்பையும் மீண்டும் வரும் பெயர்ச்சொல்லையும் தக்கவைக்கிறது. தமிழ் வாக்கியத்தில் ‘-யும்’ இணைப்பு இரண்டாம் இணையான கூறை இயல்பாகவும் வலியுறுத்தலுடனும் காட்டுகிறது.
- source_word: בְּנֹתֵיכֶם
  choice: உங்கள் மகள்களின்
  rationale: மூலத்தின் பெண்பால் பன்மையை நேரடியாகத் தருகிறது; மகன்கள்–மகள்கள் என்ற இணை அமைப்பைப் பாதுகாக்கிறது.
- source_word: תֹּאכֵלוּ
  choice: நீங்கள் தின்பீர்கள்
  rationale: மூலத்தில் இரண்டாவது வினைச்சொல் மீண்டும் வெளிப்படையாக வருவதால் தமிழிலும் அதை விடாமல் மீண்டும் கூறி, எச்சரிக்கையின் இணை அமைப்பையும் கொடிய வலியுறுத்தலையும் தக்கவைக்கிறது.
theological_decisions:
- issue: உடன்படிக்கைச் சாபத்தில் மனிதச் சதை உண்ணுதல் பற்றிய கூற்று
  choice: மகன்கள் மற்றும் மகள்களின் சதையைத் தின்பீர்கள் என்ற நேரடியான முன்னறிவிப்பாக மொழிபெயர்த்தல்
  alternative: கொடுமையைத் தணிக்கும் மறைமுக அல்லது நயப்படுத்திய மொழிபெயர்ப்பு
  rationale: இது உடன்படிக்கைச் சாபத்தின் கொடிய விளைவை நேரடியாக எச்சரிக்கிறது. மூலத்தின் அதிர்ச்சியையும் தீர்ப்பின் தீவிரத்தையும் குறைக்காமலும் கூடுதல் கோட்பாட்டு விளக்கத்தைச் சேர்க்காமலும் மொழிபெயர்க்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் ஆனால் கண்ணியமும் தீவிரமும் கொண்ட நடை. எபிரெய இணை அமைப்பைப் பாதுகாக்க இரு கூறுகளிலும் ‘சதை’ மற்றும் ‘தின்பீர்கள்’ மீண்டும் கூறப்பட்டுள்ளன. வசனத்தின் கடுமையை மென்மைப்படுத்தவில்லை.
