  text: אַף אֲנִ֗י אֵלֵ֤ךְ עִמָּ/ם֙ בְּ/קֶ֔רִי וְ/הֵבֵאתִ֣י אֹתָ֔/ם בְּ/אֶ֖רֶץ אֹיְבֵי/הֶ֑ם אוֹ אָ֣ז יִכָּנַ֗ע לְבָבָ/ם֙ הֶֽ/עָרֵ֔ל וְ/אָ֖ז יִרְצ֥וּ אֶת עֲוֺנָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/041.yaml
  text: I too will walk contrary to them and bring them into the land of their enemies[a]; or then their uncircumcised heart will be humbled[e][d][c][b], and then they will accept the punishment for their iniquity.
translation:
  language: ta
  text: நானும் அவர்களுக்கு எதிராக நடந்து, அவர்களுடைய பகைவர்களின் நாட்டிற்குள் அவர்களைக் கொண்டுபோவேன். அல்லது அப்போது அவர்களுடைய விருத்தசேதனம் செய்யப்படாத இதயம் தாழ்த்தப்படும்[a]; அப்போது அவர்கள் தங்கள் அக்கிரமத்திற்கான தண்டனையை ஏற்றுக்கொள்வார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அல்லது அப்போது” என்ற எபிரெயச் சொற்றொடர் கடினமானது; அவர்களுடைய இதயம் தாழ்த்தப்படும் தருணத்தை இது அறிமுகப்படுத்தலாம். “விருத்தசேதனம் செய்யப்படாத இதயம்” என்பது உள்ளார்ந்த பிடிவாதத்தையும் அசுத்தத்தையும் குறிக்கும் உடன்படிக்கை உருவகம்.
    reason: alternative_reading_and_cultural_note
  - marker: b
    text: “தங்கள் அக்கிரமத்திற்கான விளைவைச் சுமப்பார்கள்,” “தங்கள் அக்கிரமத்திற்குப் பரிகாரம் செய்வார்கள்,” அல்லது “அவர்களுடைய அக்கிரமத்திற்கான கடன் தீர்க்கப்படும்” என்றும் பொருள் கொள்ளலாம். குற்றத்திற்குரிய விளைவை ஏற்றல் அல்லது அனுபவித்தல் என்பதே எபிரெய மரபுத்தொடரின் கருத்து.
    reason: alternative_reading
lexical_decisions:
- source_word: אַף אֲנִי
  choice: நானும்
  rationale: אַף உடன் வரும் தனிப்பட்ட சுட்டுப்பெயர் வலியுறுத்தலையும் பரஸ்பர எதிர்வினையையும் காட்டுகிறது; தமிழில் “நானும்” இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֵלֵךְ עִמָּם בְּקֶרִי
  choice: அவர்களுக்கு எதிராக நடந்து
  rationale: இந்த அதிகாரம் முழுவதும் மீளும் உடன்படிக்கைச் சாப மொழியைத் தொடர்ந்து, קֶרִי என்பது தற்செயலை அல்ல, எதிர்ப்பான நடத்தையைக் குறிக்கிறது. “எதிராக நடந்து” எபிரெய உருவகத்தையும் பொருளையும் காக்கிறது.
- source_word: וְהֵבֵאתִי אֹתָם בְּאֶרֶץ אֹיְבֵיהֶם
  choice: அவர்களுடைய பகைவர்களின் நாட்டிற்குள் அவர்களைக் கொண்டுபோவேன்
  rationale: בוא என்பதன் ஹிஃபில் வடிவம் “கொண்டுபோதல்” என்று பொருள்படும்; நாடுகடத்தல் சூழலும் இலக்கு நோக்கிய இயக்கமும் தெளிவாகப் பாதுகாக்கப்படுகின்றன.
- source_word: אוֹ אָז
  choice: அல்லது அப்போது
  rationale: இச்சொற்றொடர் இலக்கணரீதியாகக் கடினமானது. அதை விளக்கி மென்மைப்படுத்தாமல், எபிரெயத்தின் பிரிநிலைத் தன்மையை “அல்லது அப்போது” எனக் காக்கிறது.
- source_word: יִכָּנַע
  choice: தாழ்த்தப்படும்
  rationale: כנע என்பதன் நிஃபால் வடிவம் “தாழ்த்தப்படுதல்” அல்லது “அடக்கப்படுதல்” எனப் பொருள்படும். இதயம் எழுவாயாக இருப்பதால் உள்ளார்ந்த தாழ்வு என்ற நுணுக்கத்தை இத்தேர்வு தருகிறது.
- source_word: לְבָבָם הֶעָרֵל
  choice: விருத்தசேதனம் செய்யப்படாத அவர்களுடைய இதயம்
  rationale: மூலத்தின் உடன்படிக்கை சார்ந்த உருவகத்தை “பிடிவாதமான இதயம்” என விளக்கிப் பதிலிடாமல் நேரடியாகக் காக்கிறது.
- source_word: וְאָז יִרְצוּ אֶת עֲוֺנָם
  choice: அப்போது அவர்கள் தங்கள் அக்கிரமத்திற்கான தண்டனையை ஏற்றுக்கொள்வார்கள்
  rationale: רצה + עון என்ற மரபுத்தொடர் குற்றத்தின் உரிய விளைவை ஏற்றல் அல்லது சுமத்தப்பட்ட தண்டனையை அனுபவித்தல் என்பதைக் குறிக்கிறது. இத்தமிழாக்கம் தாங்களே பரிகாரம் சம்பாதிப்பதாகப் பொருள் கொள்ளாமல் நீதித்துறை நுணுக்கத்தை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: הֶעָרֵל என்ற விருத்தசேதன உருவகம் இதயத்திற்குப் பயன்படுத்தப்படுதல்
  choice: “விருத்தசேதனம் செய்யப்படாத இதயம்” என்ற உடன்படிக்கை உருவகத்தைத் தக்கவைத்தல்
  alternative: “பிடிவாதமான இதயம்” அல்லது “மனந்திரும்பாத இதயம்”
  rationale: மூலம் பொதுவான பிடிவாதத்தை மட்டும் கூறாமல், உடன்படிக்கைச் சுமையுள்ள உருவகத்தைப் பயன்படுத்துகிறது. அதைத் தக்கவைப்பது வேதாகமத்தின் பிற பகுதிகளுடனான தொடர்பைப் பாதுகாத்து, விளக்கத்தை மொழிபெயர்ப்புக்குள் திணிப்பதைத் தவிர்க்கிறது.
- issue: יִרְצוּ אֶת עֲוֺנָם என்பதன் பொருள்
  choice: அவர்கள் தங்கள் அக்கிரமத்திற்கான தண்டனையை ஏற்றுக்கொள்வார்கள்
  alternative: அவர்கள் தங்கள் அக்கிரமத்திற்குப் பரிகாரம் செய்வார்கள்; அவர்களுடைய அக்கிரமத்திற்கான கடன் தீர்க்கப்படும்
  rationale: இது குற்றத்தால் வரும் உடன்படிக்கைத் தண்டனையை ஏற்றல் அல்லது அதன் விளைவைச் சுமத்தல் பற்றியது; தகுதியால் தாங்களே பாவநிவிர்த்தி செய்வதாகக் கூறுவதில்லை. தேர்ந்தெடுக்கப்பட்ட வாசகம் பிற்கால இறையியல் வகைப்பாடுகளை இறக்குமதி செய்யாமல் நீதித்துறைப் பொருளைத் தெளிவாக்குகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்தியுள்ளது. “விருத்தசேதனம் செய்யப்படாத இதயம்” போன்ற மூலத்தின் முக்கிய உடன்படிக்கை உருவகம் தக்கவைக்கப்பட்டு அடிக்குறிப்பில் சுருக்கமாக விளக்கப்பட்டுள்ளது; கடினமான אוֹ אָז இணைப்பும் விளக்கி அகற்றப்படாமல் பாதுகாக்கப்பட்டுள்ளது.
