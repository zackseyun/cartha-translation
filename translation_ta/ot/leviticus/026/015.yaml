revisions:
- from: மேலும், என் நியமங்களை நீங்கள் வெறுத்துத் தள்ளி, என் நீதிமுறைகளை உங்கள் உள்ளம் அருவருத்து[a], என் கட்டளைகள் அனைத்தையும் கடைப்பிடிக்காமல், என் உடன்படிக்கையை முறித்தால்[b],
  to: மேலும், என் நியமங்களை நீங்கள் வெறுத்துத் தள்ளினால், என் நீதிமுறைகளை உங்கள் உள்ளம் அருவருத்தால், என் கட்டளைகள் அனைத்தையும் கடைப்பிடிக்காதபடி என் உடன்படிக்கையை முறித்தால்,
  rationale: The revision supplies the two parallel conditional forms required by the Hebrew and improves Tamil sentence flow. It preserves the legal-term distinctions, the non-technical rendering of נפשׁ as ‘உள்ளம்,’ the open-ended comma that connects with the following verse, and the source's purpose/result linkage in the final clause.
