  text: וְ/אִם בְּ/חֻקֹּתַ֣/י תִּמְאָ֔סוּ וְ/אִ֥ם אֶת מִשְׁפָּטַ֖/י תִּגְעַ֣ל נַפְשְׁ/כֶ֑ם לְ/בִלְתִּ֤י עֲשׂוֹת֙ אֶת כָּל מִצְוֺתַ֔/י לְ/הַפְרְ/כֶ֖ם אֶת בְּרִיתִֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/015.yaml
  text: and if you reject my statutes[a], and if your soul abhors my judgments, so that you do not do all my commandments, thereby breaking my covenant[c][b],
translation:
  language: ta
  text: மேலும், என் நியமங்களை நீங்கள் வெறுத்துத் தள்ளினால், என் நீதிமுறைகளை உங்கள் உள்ளம் அருவருத்தால், என் கட்டளைகள் அனைத்தையும் கடைப்பிடிக்காதபடி என் உடன்படிக்கையை முறித்தால்,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּחֻקֹּתַי
  choice: என் நியமங்களை
  rationale: חֻקִּים என்பது விதிக்கப்பட்ட சட்டங்களைக் குறிக்கிறது. ‘நியமங்கள்’ சட்ட-உடன்படிக்கைச் சாயலைக் காத்து, அடுத்து வரும் מִשְׁפָּטִים என்பதிலிருந்து வேறுபடுத்துகிறது.
- source_word: תִּמְאָסוּ
  choice: நீங்கள் வெறுத்துத் தள்ளி
  rationale: מאס என்பது வெறும் மறுப்பை மட்டுமல்ல, இகழ்ச்சியோடு நிராகரிப்பதையும் குறிக்கலாம். ‘வெறுத்துத் தள்ளி’ அந்த வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מִשְׁפָּטַי
  choice: என் நீதிமுறைகளை
  rationale: מִשְׁפָּטִים என்பது நீதித் தீர்ப்புகள், சட்ட விதிகள் அல்லது ஒழுங்குமுறைகளைக் குறிக்கலாம். ‘நீதிமுறைகள்’ அதன் சட்ட-நீதி நுணுக்கத்தைக் காத்து ‘நியமங்கள்’ என்பதுடன் கலந்துவிடாமல் செய்கிறது.
- source_word: תִּגְעַל נַפְשְׁכֶם
  choice: உங்கள் உள்ளம் அருவருத்து
  rationale: געל கடுமையான அருவருப்பைக் குறிக்கிறது; נֶפֶשׁ இலக்கண எழுவாயாக உள்ளது. ‘உங்கள் உள்ளம்’ என்ற சொற்றொடர் எபிரேய வெளிப்பாட்டின் தீவிரத்தை இயல்பான தமிழில் காக்கிறது; இதை ஒரு தொழில்நுட்ப ஆன்மவியல் சொல்லாக மாற்றவில்லை.
- source_word: לְבִלְתִּי עֲשׂוֹת
  choice: கடைப்பிடிக்காமல்
  rationale: இந்த அமைப்பு நோக்கம் அல்லது விளைவைக் குறிக்கிறது. தமிழில் ‘கடைப்பிடிக்காமல்’ என்பது அருவருப்புக்கும் கீழ்ப்படியாமைக்கும் உள்ள தொடர்பைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: כָּל מִצְוֺתַי
  choice: என் கட்டளைகள் அனைத்தையும்
  rationale: מִצְוֹת என்பதற்கு ‘கட்டளைகள்’ நேர்த்தியான உடன்படிக்கை-சட்டச் சொல்; כָּל என்பதன் முழுமையும் ‘அனைத்தையும்’ மூலம் வெளிப்படுகிறது.
- source_word: לְהַפְרְכֶם
  choice: முறித்தால்
  rationale: פרר என்பதன் ஹிஃபீல் வடிவம் உடன்படிக்கையைச் செல்லாததாக்குதல் அல்லது முறித்தலைக் குறிக்கிறது. தொடரும் நிபந்தனை வாக்கியத்துக்கு ஏற்றவாறு தமிழில் ‘முறித்தால்’ என வழங்கப்பட்டுள்ளது.
- source_word: בְּרִיתִי
  choice: என் உடன்படிக்கையை
  rationale: בְּרִית என்பது தரப்புகளைப் பிணைக்கும் உடன்படிக்கைக்கான நிலையான சொல். ‘உடன்படிக்கை’ அதன் சட்ட மற்றும் இறையியல் பரிமாணங்களைத் தெளிவாகக் காக்கிறது.
theological_decisions:
- issue: נֶפֶשׁ என்ற மனித இயல்பைக் குறிக்கும் சொல்லை மரபுத்தொடரில் எவ்வாறு காப்பது
  choice: உங்கள் உள்ளம் அருவருத்து
  alternative: நீங்கள் முற்றிலும் அருவருத்து / உங்கள் உயிர் அருவருத்து
  rationale: எபிரேயத்தில் נֶפֶשׁ வெளிப்படையாக எழுவாயாக இருப்பதால் அதை முழுவதும் நீக்கவில்லை. அதேவேளை ‘உயிர்’ என்று சொல்வதால் தமிழில் ஏற்படக்கூடிய தவறான அல்லது செயற்கையான பொருளைத் தவிர்த்து, முழு உள்ளார்ந்த நபரைக் குறிக்கும் ‘உள்ளம்’ தேர்ந்தெடுக்கப்பட்டது.
- issue: உடன்படிக்கைச் சட்டச் சொற்களின் வேறுபாடு
  choice: நியமங்கள் / நீதிமுறைகள் / கட்டளைகள் / உடன்படிக்கை
  alternative: சட்டங்கள் / தீர்ப்புகள் / கட்டளைகள் / உடன்படிக்கை
  rationale: வசனம் பல தொடர்புடைய, ஆனால் வேறுபட்ட சட்டச் சொற்களை அடுக்குகிறது. அவற்றை ஒரே தமிழ்ச் சொல்லாகச் சுருக்காமல் வேறுபாட்டுடன் வழங்குவது மூலத்தின் சட்ட-உடன்படிக்கைத் தன்மையைப் பாதுகாக்கிறது.
- issue: לְהַפְרְכֶם என்பதிலுள்ள நோக்கம் அல்லது விளைவு நுணுக்கம்
  choice: என் உடன்படிக்கையை முறித்தால்
  alternative: அதனால் என் உடன்படிக்கையை மீறினால் / என் உடன்படிக்கையை முறிக்கும்படி
  rationale: எபிரேய அமைப்பு நோக்கத்தையோ விளைவையோ தாங்கக்கூடும். தமிழ் நிபந்தனைத் தொடரில் ‘முறித்தால்’ இரண்டிற்கும் இடமளித்து, கீழ்ப்படியாமை உடன்படிக்கை முறிவாக முடிவதைத் தெளிவுபடுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையில் சட்ட-உடன்படிக்கைச் செம்மை காக்கப்பட்டுள்ளது. தொடக்கத்திலுள்ள ‘மேலும்’ முந்தைய வசனத்தின் நிபந்தனைத் தொடரை இணைக்கிறது; இறுதியிலுள்ள காற்புள்ளி அடுத்த வசனத்தில் வரும் விளைவைக் காத்திருக்கிறது.
