id: LEV.26.5
reference: Leviticus 26:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/הִשִּׂ֨יג לָ/כֶ֥ם דַּ֨יִשׁ֙ אֶת בָּצִ֔יר וּ/בָצִ֖יר יַשִּׂ֣יג אֶת זָ֑רַע וַ/אֲכַלְתֶּ֤ם לַחְמְ/כֶם֙ לָ/שֹׂ֔בַע וִֽ/ישַׁבְתֶּ֥ם לָ/בֶ֖טַח בְּ/אַרְצְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/005.yaml
  text: Your threshing will last for you until the grape harvest, and the grape harvest will last until sowing; and you will eat your bread to the full and live securely in your land.
translation:
  language: ta
  text: உங்களுடைய கதிரடிப்பு திராட்சை அறுவடை வரை நீடிக்கும்; திராட்சை அறுவடை விதைப்புக் காலம் வரை நீடிக்கும். நீங்கள் உங்கள் அப்பத்தை வயிறார உண்டு, உங்கள் நிலத்தில் பாதுகாப்பாகக் குடியிருப்பீர்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דַּיִשׁ
  choice: தானியத்தைப் போரடிக்கும் காலம்
  rationale: இது தானியத்தைப் போரடிக்கும் செயலை மட்டுமல்லாமல் அதற்குரிய பருவத்தையும் இச்சூழலில் குறிக்கிறது; அடுத்த அறுவடைப் பருவம்வரை அது நீடிக்கும் என்ற வளமையின் படிமத்தைத் தெளிவாக அளிக்கிறது.
- source_word: בָּצִיר
  choice: திராட்சை அறுவடைக் காலம்
  rationale: திராட்சைப் பழங்களை அறுவடை செய்யும் பருவத்தைக் குறிக்கும் சொல்லாக இருப்பதால், நவீன தமிழில் தெளிவான பருவக் குறிப்பாக மொழிபெயர்க்கப்பட்டது.
- source_word: יַשִּׂיג / הִשִּׂיג
  choice: நீடிக்கும்
  rationale: சொல்லின் அடிப்படைப் படிமம் ‘எட்டுதல்/தொடர்ந்து சென்று அடைதல்’ என்பதாக இருந்தாலும், மிகுந்த விளைச்சலால் ஒரு வேளாண் பணி அடுத்த பருவம்வரை தொடரும் பொருளை இயல்பான தமிழில் ‘நீடிக்கும்’ என்று வெளிப்படுத்துகிறது.
- source_word: לַחְמְכֶם
  choice: உங்கள் உணவு
  rationale: לֶחֶם என்பதன் நேரடிப் பொருள் ‘அப்பம்’; ஆனால் எபிரெய மொழிப் பயன்பாட்டில் இது பொதுவாக அன்றாட உணவையும் குறிக்கலாம். இங்கு வளமும் நிறைவும் மையமாக இருப்பதால் ‘உணவு’ இயல்பாகவும் பொருத்தமாகவும் உள்ளது.
- source_word: לָשֹׂבַע
  choice: திருப்தியாக
  rationale: போதுமான அளவு உண்டு நிறைவடைவதைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: לָבֶטַח
  choice: பாதுகாப்பாக
  rationale: அச்சமின்றி நிம்மதியாகவும் பாதுகாப்புடனும் வாழும் நிலையை இச்சொல் குறிக்கிறது.
theological_decisions:
- issue: உடன்படிக்கைக்குரிய ஆசீர்வாதத்தின் இயல்பு
  choice: விவசாய வளமும் நாட்டில் பாதுகாப்பான வாழ்வும் நேரடியான வாக்குறுதிகளாக வைக்கப்பட்டன
  alternative: இவற்றை ஆன்மிக வளத்தின் உருவகங்களாக விளக்குவது
  rationale: வசனத்தின் நேரடியான சூழல் நிலம், அறுவடை, உணவு, பாதுகாப்பு ஆகிய இஸ்ரவேலின் உடன்படிக்கை வாழ்வுக்குரிய பொருட்சார்ந்த ஆசீர்வாதங்களைச் சொல்கிறது; மொழிபெயர்ப்பு அதற்கு அப்பாற்பட்ட இறையியல் விளக்கத்தைச் சேர்க்கக்கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில், வேளாண் படிமத்தைப் பாதுகாத்து, சாதாரண வாசகர்களுக்கும் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெயத்தின் ‘ஒன்று அடுத்ததை எட்டும்’ என்ற உவமை தமிழில் இயல்பாக ‘வரை நீடிக்கும்’ என வழங்கப்பட்டது.
