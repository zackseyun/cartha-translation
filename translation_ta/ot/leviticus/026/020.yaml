  register: நவீனத் தரத் தமிழில், எளிமையானதும் கண்ணியமானதும் ஆன நடை. மூலத்தில் மீண்டும் வரும் “தராது” என்பதைக் காத்து, நிலம் மற்றும் மரங்கள் இரண்டின் பலனின்மையை இணையான வாக்கிய அமைப்பில் வெளிப்படுத்துகிறது.
