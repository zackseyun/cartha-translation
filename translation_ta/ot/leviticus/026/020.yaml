language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/תַ֥ם לָ/רִ֖יק כֹּחֲ/כֶ֑ם וְ/לֹֽא תִתֵּ֤ן אַרְצְ/כֶם֙ אֶת יְבוּלָ֔/הּ וְ/עֵ֣ץ הָ/אָ֔רֶץ לֹ֥א יִתֵּ֖ן פִּרְיֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/020.yaml
  text: Your strength will be spent in vain[a], and your land will not yield its produce, and the trees of the land will not yield their fruit.
translation:
  language: ta
  text: உங்கள் வலிமை வீணாகத் தீர்ந்துபோகும்[a]. உங்கள் நிலம் அதன் விளைச்சலைத் தராது; நிலத்தின் மரங்களும் தங்கள் கனிகளைத் தராது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொற்சார்பாக: “உங்கள் வலிமை வெறுமைக்காக முற்றிலும் தீர்ந்துபோகும்”; மேலும், “நிலத்தின் மரம் அதன் கனியைத் தராது.”'
    reason: மூலத்தின் לָרִיק என்பதிலுள்ள “வெறுமைக்காக” என்ற நேரடிப் படிமத்தையும், கூட்டுப்பொருளில் வரும் ஒருமையான “மரம் / அதன் கனி” என்ற இலக்கண வடிவத்தையும் பதிவு செய்கிறது.
lexical_decisions:
- source_word: וְתַם
  choice: தீர்ந்துபோகும்
  rationale: תמם என்பது இங்கு வலிமை முற்றிலும் செலவாகி முடிவுறுவதைக் குறிக்கிறது; “தீர்ந்துபோகும்” என்பது இயல்பான தமிழில் அந்த நிறைவுறும் நுணுக்கத்தைக் காக்கிறது.
- source_word: לָרִיק
  choice: வீணாக
  rationale: இந்தச் சொல் பயனின்மையையும் பலனற்ற நிலையையும் குறிக்கிறது; உடன்படிக்கைச் சாபத்தின் சூழலில் “வீணாக” என்பது தெளிவான இயல்பான இணைச்சொல்.
- source_word: כֹּחֲכֶם
  choice: உங்கள் வலிமை
  rationale: כח என்பதன் அடிப்படைப் பொருள் வலிமை அல்லது ஆற்றல்; உழைப்பின் ஆற்றல் பலனின்றித் தீர்வதை இங்கு “வலிமை” துல்லியமாகக் காட்டுகிறது.
- source_word: תִתֵּן
  choice: தராது
  rationale: எபிரெய வினையின் நேரடிப் பொருள் “கொடு”; நிலமும் மரங்களும் விளைவை அளிப்பதைக் கூறும் தமிழிலும் “தராது” இயல்பாகவும் மூல உருவகத்திற்கு நெருக்கமாகவும் உள்ளது.
- source_word: אַרְצְכֶם
  choice: உங்கள் நிலம்
  rationale: இச்சூழலில் ארץ என்பது மக்களுக்குரிய பயிரிடப்படும் நிலப்பரப்பைக் குறிக்கிறது; “உங்கள் நிலம்” துல்லியமும் இயல்பும் உடையது.
- source_word: יְבוּלָהּ
  choice: அதன் விளைச்சலை
  rationale: יבול என்பது நிலத்தின் உற்பத்தி அல்லது மகசூலைக் குறிக்கிறது; வேளாண்மைச் சூழலில் “விளைச்சல்” பொதுமக்களுக்கு தெளிவான சொல்.
- source_word: וְעֵץ הָאָרֶץ
  choice: நிலத்தின் மரங்களும்
  rationale: עץ இலக்கணத்தில் ஒருமையாக இருந்தாலும் இங்கு கூட்டுப்பொருளில் வருகிறது; இயல்பான தமிழில் பன்மையாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: פִּרְיוֹ
  choice: தங்கள் கனிகளை
  rationale: எபிரெயச் சுட்டுப்பின்னொட்டு ஒருமையாக இருந்து கூட்டுப்பொருளான עץ உடன் இயைகிறது; தமிழில் “மரங்கள்” எனப் பன்மையாக்கப்பட்டதால் “தங்கள் கனிகளை” என்று இயல்பாக ஒத்திசைக்கப்பட்டுள்ளது.
