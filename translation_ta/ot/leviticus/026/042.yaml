base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/042.yaml
  text: Then I will remember my covenant with Jacob[a], and also my covenant with Isaac, and also my covenant with Abraham I will remember; and I will remember the land.
translation:
  language: ta
  text: அப்போது யாக்கோபுடனான என் உடன்படிக்கையை நினைவுகூருவேன்[a]; மேலும், ஈசாக்குடனான என் உடன்படிக்கையையும், மேலும் ஆபிரகாமுடனான என் உடன்படிக்கையையும் நினைவுகூருவேன்; அந்த நாட்டையும் நினைவுகூருவேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மேலும், யாக்கோபுடனான என் உடன்படிக்கையை நினைவுகூருவேன்.” எபிரெய இணைப்புச் சொல்லை “மேலும்” என்றும் மொழிபெயர்க்கலாம்; “அப்போது” என்பது முந்தைய வசனங்களுடனான தொடர்பைக் காட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתִּי
  choice: அப்போது ... நினைவுகூருவேன்
  rationale: זכר என்பதன் அடிப்படைப் பொருளான ‘நினைவுகூருதல்’ தக்கவைக்கப்படுகிறது; உடன்படிக்கைச் சூழலில் அது செயல்படுவதற்காக நினைவில் கொள்வதை உணர்த்தினாலும், அதை மொழிபெயர்ப்பில் விரிவாக்கவில்லை. முன்னுள்ள நிபந்தனைச் சூழலுடன் உள்ள தொடர்பை ‘அப்போது’ இயல்பாகக் காட்டுகிறது.
- source_word: בְּרִיתִי
  choice: நான் செய்த உடன்படிக்கை
  rationale: בְּרִיתִי என்பது எழுத்துப்படி ‘என் உடன்படிக்கை.’ தமிழில் ஒரு நபருடன் தொடர்புபடுத்தும்போது ‘அவருடன் நான் செய்த உடன்படிக்கை’ என்பது இயல்பாகவும் உறவின் பொருளைத் தெளிவாகவும் தருகிறது.
- source_word: יַעֲקֹב
  choice: யாக்கோபு
  rationale: நவீனத் தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்பட்ட பெயர்வடிவம்.
- source_word: וְאַף
  choice: '...யையும்'
  rationale: இங்கு உள்ள இணைப்பு மற்றும் சேர்க்கை வலியுறுத்தலைத் தமிழின் ‘-யையும்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יִצְחָק
  choice: ஈசாக்கு
  rationale: நவீனத் தமிழில் பரவலாக அறியப்பட்ட பெயர்வடிவம்.
- source_word: אַבְרָהָם
  choice: ஆபிரகாம்
  rationale: நவீனத் தமிழில் பரவலாக அறியப்பட்ட பெயர்வடிவம்.
- source_word: אֶזְכֹּר
  choice: நினைவுகூருவேன்
  rationale: ஆபிரகாமின் உடன்படிக்கையையும் நாட்டையும் குறித்த எபிரெய வினைச்சொல் மீளுரைப்பைத் தக்கவைத்து அதன் சொற்பொழிவு வலிமை பாதுகாக்கப்படுகிறது.
- source_word: וְהָאָרֶץ
  choice: அந்த நாடு
  rationale: உடன்படிக்கைச் சூழலில் אֶרֶץ குறிப்பிட்ட வாக்குத்தத்த நாட்டைக் குறிக்கிறது; தமிழ் வாசகருக்கு இந்தக் குறிப்புத்தன்மையை ‘அந்த நாடு’ இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: முற்பிதாக்களின் உடன்படிக்கைகளின் வரிசையும் வலியுறுத்தலும்
  choice: யாக்கோபு, ஈசாக்கு, ஆபிரகாம் என்ற எபிரெய வரிசையையும் ஒவ்வொருவருடனான உடன்படிக்கையின் தனித்த குறிப்பையும் தக்கவைத்தல்
  alternative: காலவரிசைப்படி ஆபிரகாம், ஈசாக்கு, யாக்கோபு என மாற்றுதல் அல்லது மூவரையும் ஒரே சுருக்கத் தொடராக வழங்குதல்
  rationale: மூல உரை பெயர்களை வழக்கமான காலவரிசைக்கு மாறாக அமைத்து, ‘என் உடன்படிக்கை’ என்பதை ஒவ்வொருவருடனும் தனித்தனியாக இணைக்கிறது. அதைச் சீராக்காமல் பாதுகாப்பது உரையின் வலியுறுத்தலைத் தக்கவைக்கிறது.
- issue: இறைவன் ‘நினைவுகூருதல்’ என்பதன் பொருள்
  choice: ‘நினைவுகூருவேன்’ என்று மொழிபெயர்த்தல்
  alternative: ‘நினைவுகூர்ந்து செயல்படுவேன்’ அல்லது ‘புதுப்பிப்பேன்’ என்று விரிவாக்குதல்
  rationale: உடன்படிக்கைச் சூழலில் இறைவனின் நினைவுகூருதல் நடவடிக்கையை உள்ளடக்கக்கூடும்; ஆயினும் மூல உரை கூறும் சொல்லையே வைத்திருப்பது அதன் இறையியல் நிறைவையும் பதற்றத்தையும் வாசகருக்குத் திறந்தவாறு விடுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் வாசிப்பின் இயல்பும் இணைந்த நடை. எபிரெய உரையின் மீளுரை மற்றும் தலைகீழான முற்பிதா வரிசை பாதுகாக்கப்பட்டுள்ளன; தமிழில் இயல்புக்காக உடைமை அமைப்பு ‘அவருடன் நான் செய்த உடன்படிக்கை’ என வழங்கப்பட்டுள்ளது.
