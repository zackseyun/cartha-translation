  text: וַ/הֲשִׁמֹּתִ֥י אֲנִ֖י אֶת הָ/אָ֑רֶץ וְ/שָֽׁמְמ֤וּ עָלֶ֨י/הָ֙ אֹֽיְבֵי/כֶ֔ם הַ/יֹּשְׁבִ֖ים בָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/032.yaml
  text: And I myself will lay the land waste[a], and your enemies who dwell in it will be appalled at it.
translation:
  language: ta
  text: நானே நாட்டைப் பாழாக்குவேன்; அதில் குடியிருக்கும் உங்கள் பகைவர்கள் அதைக் கண்டு திகைத்துப்போவார்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதைக் கண்டு அதிர்ச்சியடைவார்கள்,” அல்லது “அதைக் கண்டு திகிலடைவார்கள்.” எபிரெய வினைச்சொல், பாழாக்கப்பட்ட நிலையைக் கண்டு ஏற்படும் அதிர்ச்சியுடன் கூடிய திகைப்பைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲשִׁמֹּתִי
  choice: பாழாக்குவேன்
  rationale: שׁמם என்பதன் காரணவினை வடிவம் ‘பாழாக்குதல், வெறிச்சோடச் செய்தல்’ எனப் பொருள்படும். ‘பாழாக்குவேன்’ என்பது அதன் காரணவினைப் பொருளை இயல்பான நவீனத் தமிழில் தெளிவாகத் தருகிறது.
- source_word: אֲנִי
  choice: நானே
  rationale: வினைச்சொல்லிலேயே எழுவாய் அடங்கியிருந்தும் தனிப்பட்ட பதிற்பெயர் சேர்க்கப்பட்டிருப்பதால் வலியுறுத்தல் உள்ளது; ‘நானே’ அதைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הָאָרֶץ
  choice: அந்த நாடு
  rationale: உடன்படிக்கைத் தண்டனைகளைப் பற்றிய இச்சூழலில் இது முழு பூமியைக் குறிக்காமல் இஸ்ரவேலருக்குரிய நாட்டைக் குறிக்கிறது. ‘அந்த நாடு’ சூழல்சார்ந்த குறிப்பைத் தெளிவுபடுத்துகிறது.
- source_word: וְשָׁמְמוּ
  choice: திகைத்துப்போவார்கள்
  rationale: எளிய வினைவடிவிலுள்ள שׁמם, பாழ்நிலையைக் கண்டு அதிர்ச்சியுடன் திகைப்பதைக் குறிக்கலாம். எழுவாய் பகைவர்கள் என்பதால், அவர்கள் பாழாவார்கள் என்பதைக் காட்டிலும் நாட்டின் அழிவைக் கண்டு திகைப்பார்கள் என்பதே இங்கு பொருத்தம்; இருந்தாலும் சொல்லின் உணர்ச்சித் தீவிரத்தில் உள்ள நுண்ணிய மாறுபாடு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: עָלֶיהָ
  choice: அதைக் கண்டு
  rationale: שׁמם உடன் வரும் עַל திகைப்பை உண்டாக்கும் பொருளையோ காரணத்தையோ சுட்டலாம். ‘அதைக் கண்டு’ என்பது நாட்டின் பாழ்நிலையே அவர்களுடைய திகைப்பிற்குக் காரணம் என்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: אֹיְבֵיכֶם
  choice: உங்கள் பகைவர்கள்
  rationale: இரண்டாம் நபர் பன்மை உடைமை அமைப்பை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: הַיֹּשְׁבִים בָּהּ
  choice: அதில் குடியிருக்கும்
  rationale: ישׁב என்பதன் பங்கேற்புவினை அங்கே வசிப்பதைக் குறிக்கிறது. ‘குடியிருக்கும்’ என்பது நாட்டில் தொடர்ந்து வசிப்பதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: உடன்படிக்கைத் தண்டனைச் சூழலில் הָאָרֶץ என்பதன் குறிப்பு
  choice: அந்த நாடு—சூழலின்படி இஸ்ரவேலருக்குரிய நாடு
  alternative: பூமி
  rationale: அருகிலுள்ள வசனங்கள் இஸ்ரவேலருடைய நாட்டின்மீது வரும் உடன்படிக்கைத் தண்டனைகளைப் பற்றியவை. ஆகவே தீர்ப்பை உலகம் முழுவதற்கும் விரிவாக்காமல் சூழலுக்கேற்ப ‘அந்த நாடு’ என மொழிபெயர்க்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரநிலைத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘நானே’ மூலமொழியின் வலியுறுத்தலைப் பாதுகாக்கிறது; இணைப்பின் எளிய தொடர்ச்சியைத் தக்கவைக்க அரைப்புள்ளி பயன்படுத்தப்பட்டதே தவிர, நோக்கம் அல்லது விளைவு என்ற உறவு கூடுதலாகச் சேர்க்கப்படவில்லை.
