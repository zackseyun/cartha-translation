  terminology: «தண்டனைகள்», «திருத்தப்படாமல்», and «விரோதமாக» fit the discipline-and-opposition context. «என்னால்» is defensible for לִי with this passive construction, reflecting God as the agent of correction in the immediate covenantal context.
