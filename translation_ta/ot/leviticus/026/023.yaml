  yaml_path: translation/ot/leviticus/026/023.yaml
  text: And if by these things you are not corrected by me[a], but walk contrary to me,
translation:
  language: ta
  text: இந்தத் தண்டனைகளாலும் நீங்கள் என்னால் திருத்தப்படாமல், எனக்கு விரோதமாக நடந்தால்,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּאֵלֶּה
  choice: இந்தத் தண்டனைகளாலும்
  rationale: בְּ இங்கு முந்தைய வசனங்களில் கூறப்பட்ட தண்டனைகளைத் திருத்தும் கருவியாகச் சுட்டுகிறது. வெறும் ‘இவற்றால்’ என்பதைவிடச் சூழலுடனான தொடர்பை இது இயல்பாக வெளிப்படுத்துகிறது.
- source_word: תִוָּסְרוּ
  choice: திருத்தப்படாமல்
  rationale: יסר என்பதன் நிஃபால் வடிவம் தண்டனை அல்லது ஒழுக்கத்தின் வழியாகத் திருத்தப்படுதலைக் குறிக்கிறது; செயலின் நோக்கம் நிறைவேறாததை இந்தச் சொல் தெளிவாக்குகிறது.
- source_word: לִי
  choice: என்னால்
  rationale: இங்குள்ள לִי இலக்கண ரீதியாக ஓரளவு திறந்ததாக இருந்தாலும், செயப்பாட்டு வினையுடன் சேர்ந்து தேவன் தண்டனைகள் மூலம் திருத்துபவர் என்ற பொருளைச் சூழலில் இயல்பாகத் தருகிறது.
- source_word: וַהֲלַכְתֶּם
  choice: நடந்தால்
  rationale: ‘நடத்தல்’ என்பது வாழ்க்கை முறை அல்லது தொடர்ச்சியான நடத்தை குறிக்கும் எபிரெய வழக்கைத் தமிழிலும் இயல்பாகப் பாதுகாக்கிறது; நிபந்தனைத் தொடருக்கு ஏற்ப ‘நடந்தால்’ என அமைக்கப்பட்டுள்ளது.
- source_word: עִמִּי קֶרִי
  choice: எனக்கு விரோதமாகவே
  rationale: עִמִּי என்பதன் சொற்பொருள் ‘என்னுடன்’; קֶרִי அதற்கு எதிர்ப்பு அல்லது பகைமை சார்ந்த வலிமையை அளிக்கிறது. ‘எனக்கு விரோதமாக’ என்பது இந்த இணைந்த சொற்றொடரின் பொருளை இயல்பான தமிழில் தருகிறது; ‘வே’ தொடரும் பிடிவாதமான எதிர்நிலையை உணர்த்துகிறது.
theological_decisions:
- issue: עִמִּי קֶרִי என்ற உடன்படிக்கை-உறவு சார்ந்த சொற்றொடர்
  choice: எனக்கு விரோதமாகவே நடந்தால்
  alternative: என்னுடன் பகைமையோடு நடந்தால்
  rationale: இந்தச் சொற்றொடர் வெறும் தனிப்பட்ட தவறை அல்ல, ஆண்டவருக்கு எதிரான தொடர்ச்சியான உறவுநிலையையும் நடத்தையையும் குறிக்கிறது. தேர்ந்த மொழிபெயர்ப்பு எதிர்ப்பைத் தெளிவாகக் காட்டுகிறது; ‘பகைமை’ என வலுப்படுத்தி மூலத்தின் தெளிவின்மையைத் தேவையின்றி முடிவுசெய்யவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; கண்ணியமானதும் பொதுவாசகர்களுக்கு எளிதில் புரியத்தக்கதுமான நடையில், முந்தைய தண்டனைகளுடனான தொடர்பும் நிபந்தனை வாக்கியத்தின் தொடர்ச்சியும் பாதுகாக்கப்பட்டுள்ளன.
