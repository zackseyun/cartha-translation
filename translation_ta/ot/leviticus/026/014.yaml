reference: Leviticus 26:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/אִם לֹ֥א תִשְׁמְע֖וּ לִ֑/י וְ/לֹ֣א תַעֲשׂ֔וּ אֵ֥ת כָּל הַ/מִּצְוֺ֖ת הָ/אֵֽלֶּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/014.yaml
  text: But if you do not listen to me and do not do all these commandments,[a]
translation:
  language: ta
  text: ஆனால் நீங்கள் எனக்குச் செவிகொடுக்காமலும்[a], இந்தக் கட்டளைகள் அனைத்தையும் கடைப்பிடிக்காமலும் இருந்தால்,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எனக்குக் கீழ்ப்படியாமலும்.” எபிரெய வினைச்சொல் கீழ்ப்படிதலை உட்பொருளாகக் கொண்ட செவிகொடுத்தலைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: ஆனால் ... இருந்தால்
  rationale: முந்தைய ஆசீர்வாதப் பகுதிக்கு மாறான நிபந்தனையை அறிமுகப்படுத்துவதால், இணைப்புச் சொல்லின் எதிர்மறைத் திருப்பத்தையும் אִם என்பதன் நிபந்தனைப் பொருளையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לֹא תִשְׁמְעוּ לִי
  choice: நீங்கள் எனக்குச் செவிகொடுக்காமலும்
  rationale: שׁמע ל என்பது ஒருவருக்குச் செவிகொடுத்தல் என்றும், அதன் உட்பொருளாகக் கீழ்ப்படிதல் என்றும் அமையலாம். அடுத்த கூறு கட்டளைகளைச் செய்வதைத் தனியே குறிப்பிடுவதால், இங்கு கேட்டு ஏற்கும் உறவுசார் உருவகத்தைப் பாதுகாக்கிறது.
- source_word: וְלֹא תַעֲשׂוּ
  choice: கடைப்பிடிக்காமலும்
  rationale: עשה என்பதன் அடிப்படைப் பொருள் ‘செய்’ என்றாலும், கட்டளைகள் பொருளாக வரும்போது ‘கடைப்பிடி’ என்பது தெளிவான, இயல்பான நவீனத் தமிழ்; சட்ட-உடன்படிக்கைச் சூழலில் செயலில் நிறைவேற்றுவதை உணர்த்துகிறது.
- source_word: אֵת כָּל הַמִּצְוֺת הָאֵלֶּה
  choice: இந்தக் கட்டளைகள் அனைத்தையும்
  rationale: כָּל என்பதன் முழுமையையும், הָאֵלֶּה என்பதன் சுட்டுப் பொருளையும், מִצְוֺת என்பதன் உடன்படிக்கை-சட்டத் தன்மையையும் இயல்பான தமிழ் சொல்வரிசையில் தருகிறது.
theological_decisions:
- issue: שׁמע ל என்பதை ‘செவிகொடு’ என்றா, ‘கீழ்ப்படி’ என்றா மொழிபெயர்ப்பது
  choice: எனக்குச் செவிகொடுக்காமலும்
  alternative: எனக்குக் கீழ்ப்படியாமலும்
  rationale: எபிரெயச் சொல் கேட்டல்/செவிகொடுத்தல் என்ற உருவகத்தையும் கீழ்ப்படிதல் என்ற நடைமுறை உட்பொருளையும் கொண்டுள்ளது. அடுத்த கூறு கட்டளைகளைக் கடைப்பிடிப்பதைத் தனியே சொல்வதால், இரண்டையும் ஒன்றாகச் சுருக்காமல் உரையின் வேறுபாட்டைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. வசனம் அடுத்துவரும் விளைவுகளுக்கான நிபந்தனைத் தொடக்கமாக இருப்பதால் இறுதியில் காற்புள்ளி இடப்பட்டுள்ளது. ‘செவிகொடு’ உரையின் உருவகத்தைப் பாதுகாக்கிறது; ‘கடைப்பிடி’ கட்டளைகளைச் செயலில் நிறைவேற்றும் பொருளை இயல்பாகத் தருகிறது.
