base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/031.yaml
  text: And I will make your cities a ruin[a], and I will lay waste your sanctuaries, and I will not smell the pleasing aroma of your offerings.
translation:
  language: ta
  text: உங்கள் நகரங்களைப் பாழாக்குவேன்; உங்கள் பரிசுத்த இடங்களை வெறிச்சோடச் செய்வேன்; உங்கள் பலிகளின் இனிய நறுமணத்தை நான் முகரமாட்டேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் நேரடியாக, “உங்கள் இனிய நறுமணத்தை.” இது பலிகளை இறைவன் ஏற்றுக்கொள்வதைக் குறிக்கும் வழக்கமான பலியிடல் சொற்றொடர்; தெளிவுக்காக “பலிகளின்” என்பது சேர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי אֶת־עָרֵיכֶם חָרְבָּה
  choice: உங்கள் நகரங்களைப் பாழாக்குவேன்
  rationale: נתן என்பதன் அடிப்படைப் பொருள் ‘கொடு/வை’ என்றாலும், ‘உங்கள் நகரங்கள்’ என்ற பொருளுடனும் חָרְבָּה என்ற பயனிலைச் சொல்லுடனும் இங்கு ‘பாழாக்குவேன்’ என்ற காரணவினைப் பொருளைத் தருகிறது.
- source_word: וַהֲשִׁמּוֹתִי
  choice: வெறிச்சோடச் செய்வேன்
  rationale: שמם என்பதன் ஹிஃபில் வடிவம் ஒன்றைப் பாழடைந்த, வெறிச்சோடிய நிலைக்குக் கொண்டுவருவதைச் சுட்டுகிறது; இத்தமிழ்ச் சொற்றொடர் அந்தக் காரணவினை வலிமையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מִקְדְּשֵׁיכֶם
  choice: உங்கள் பரிசுத்த இடங்களை
  rationale: מִקְדָּשׁ என்பது வழிபாட்டுக்கெனப் பரிசுத்தமாக்கப்பட்ட இடத்தைக் குறிக்கிறது. எபிரெய மூலத்தின் பன்மையைத் தக்கவைத்தும், ஒரு குறிப்பிட்ட கட்டடத்தை மட்டும் குறிக்கும் பொருளைத் தவிர்த்தும் ‘பரிசுத்த இடங்கள்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְלֹא אָרִיחַ
  choice: நான் முகரமாட்டேன்
  rationale: ריח என்ற வினை இங்கு நேரடியாக ‘முகர்’ என்று பொருள்படுகிறது. பலிகளை ஏற்காமையை இந்த உருவகம் உணர்த்தினாலும், மூலத்தின் புலனுணர்வு சார்ந்த மனிதப் பண்பேற்ற மொழி பாதுகாக்கப்பட்டுள்ளது.
- source_word: בְּרֵיחַ נִיחֹחֲכֶם
  choice: உங்கள் பலிகளின் இனிய நறுமணத்தை
  rationale: רֵיחַ נִיחֹחַ என்பது பலியிடல் சூழலில் வரும் நிலையான சொற்றொடர். தமிழில் மக்கள் தாமே நறுமணம் வீசுவதாகத் தவறாகப் புரிந்துகொள்ளப்படாதபடி, சூழலில் உள்ள பலிகளைக் குறிக்கும் தொடர்பு வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: இறுதி வாக்கியத்தை நேரடியான முகர்தல் உருவகமாக மொழிபெயர்ப்பதா, பலிகளை ஏற்காமை என்று விளக்கிப் பெயர்ப்பதா
  choice: ‘உங்கள் பலிகளின் இனிய நறுமணத்தை நான் முகரமாட்டேன்’ என்று மூல உருவகத்தைத் தக்கவைத்தல்
  alternative: ‘உங்கள் பலிகளை நான் ஏற்றுக்கொள்ளமாட்டேன்’
  rationale: எபிரெய உரை ‘முகர்’ என்ற வினையையும் பலியிடல் சார்ந்த ‘இனிய நறுமணம்’ என்ற சொற்றொடரையும் வெளிப்படையாகப் பயன்படுத்துகிறது. அதன் உட்கருத்தான நிராகரிப்பை நேரடிப் பொருளாக மாற்றாமல், மூலத்தின் மனிதப் பண்பேற்ற உருவகத்தையும் இறையியல் அழுத்தத்தையும் பாதுகாப்பது பொருத்தமானது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. இணையான மூன்று தீர்ப்புச் செயல்களை அரைப்புள்ளிகள் பிரிக்கின்றன. ‘பரிசுத்த இடங்கள்’ எனப் பன்மை பாதுகாக்கப்பட்டுள்ளது; ‘முகரமாட்டேன்’ என மூலத்தின் நேரடி உருவகமும் தக்கவைக்கப்பட்டுள்ளது.
