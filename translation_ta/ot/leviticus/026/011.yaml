source:
  edition: WLC
  text: וְ/נָתַתִּ֥י מִשְׁכָּנִ֖/י בְּ/תוֹכְ/כֶ֑ם וְ/לֹֽא תִגְעַ֥ל נַפְשִׁ֖/י אֶתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/011.yaml
  text: And I will set my dwelling place among you, and my soul will not abhor you.
translation:
  language: ta
  text: நான் என் உறைவிடத்தை உங்கள் நடுவில் அமைப்பேன்; என் உள்ளம் உங்களை அருவருக்காது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשְׁכָּנִי
  choice: என் உறைவிடம்
  rationale: מִשְׁכָּן என்பது ‘வாசஸ்தலம்/உறைவிடம்’ என்று பொருள்படும்; இங்கு தேவன் மக்களின் நடுவில் தங்கியிருப்பதைக் குறிக்கிறது. ‘திருக்கூடாரம்’ என்று மட்டும் குறிப்பிட்டுக் குறுக்காமல் மூலத்தின் பரந்த பொருளைத் தக்கவைக்கிறது.
- source_word: בְּתוֹכְכֶם
  choice: உங்கள் நடுவில்
  rationale: மக்களுக்கிடையே அல்லது அவர்களின் மத்தியில் இருப்பதைக் காட்டும் இயல்பான, நேரடியான மொழிபெயர்ப்பு.
- source_word: נַפְשִׁי
  choice: என் உள்ளம்
  rationale: נֶפֶשׁ இங்கு தேவனுடைய தன்மையையும் விருப்பத்தையும் வலியுறுத்தும் மனிதவுருவகச் சொல்லாட்சி. தமிழில் ‘என் ஆத்துமா’ என்பது தேவனைப் பற்றிய தவறான உடற்பகுப்பு எண்ணத்தைத் தூண்டக்கூடும்; ‘என் உள்ளம்’ அந்த வலியுறுத்தலை இயல்பாகப் பாதுகாக்கிறது.
- source_word: תִגְעַל
  choice: அருவருக்காது
  rationale: געל என்பதன் வலுவான நிராகரிப்பு அல்லது வெறுப்பை நேரடியாக வெளிப்படுத்துகிறது; 26:30, 43 ஆகிய இடங்களுடனான சொல் தொடர்பையும் காக்கிறது.
theological_decisions:
- issue: தேவனைப் பற்றிய נַפְשִׁי என்ற மனிதவுருவகச் சொல்லாட்சி
  choice: என் உள்ளம்
  alternative: என் ஆத்துமா
  rationale: மூலத்தில் உள்ள தனிப்பட்ட வலியுறுத்தலை நீக்காமல், தேவன் மனிதரைப் போல உடல்-ஆத்துமா கூறுகளால் ஆனவர் என்ற தேவையற்ற கருத்தையும் உருவாக்காமல் மொழிபெயர்க்கிறது.
- issue: מִשְׁכָּן என்பதன் குறிப்பு
  choice: உறைவிடம்
  alternative: திருக்கூடாரம்
  rationale: உடன்படிக்கைச் சூழலில் பரிசுத்த கூடாரத்தை நினைவூட்டினாலும், இவ்வசனம் தேவன் தம் மக்களின் நடுவில் வாசம்பண்ணுவார் என்ற பரந்த வாக்குறுதியைச் சொல்கிறது; ஆகவே மூலத்தின் பொதுப்பெயரைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை. முதல் நபர் வாக்குறுதியின் நேரடித்தன்மையும், ‘அருவருக்காது’ என்பதிலுள்ள வலுவான உடன்படிக்கை மொழியும் பாதுகாக்கப்பட்டுள்ளன.
