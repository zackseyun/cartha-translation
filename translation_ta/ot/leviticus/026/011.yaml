  source_fidelity: 'மூல எபிரேயத்தின் இரு வாக்குறுதிகளும் துல்லியமாகப் பிரதிபலிக்கப்படுகின்றன: מִשְׁכָּנִי என்பது «என் உறைவிடம்», בְּתוֹכְכֶם என்பது «உங்கள் நடுவில்», וְלֹא תִגְעַל נַפְשִׁי אֶתְכֶם என்பது «என் உள்ளம் உங்களை அருவருக்காது» என்று பொருத்தமாக உள்ளது. נַפְשִׁי-யின் மனிதவுருவக வலியுறுத்தல் நீக்கப்படவில்லை.'
  naturalness: «நான் என் உறைவிடத்தை உங்கள் நடுவில் அமைப்பேன்; என் உள்ளம் உங்களை அருவருக்காது» நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமான வேதாகம நடையுடனும் உள்ளது. «அருவருக்காது» மூல வினைச்சொல்லின் வலுவான வெறுப்பு/நிராகரிப்பு உணர்வைத் தக்கவைக்கிறது.
  terminology: «உறைவிடம்» מִשְׁכָּן என்பதற்கான பாதுகாப்பான பொதுப்பெயர்ச் சமமானது; குறிப்பிட்ட சடங்கு அமைப்பான «திருக்கூடாரம்» என்று தேவையின்றிக் குறுக்கவில்லை. «என் உள்ளம்» என்பது «என் ஆத்துமா» என்ற சொற்றொடரைவிட இச்சூழலில் இயல்பானது; மூலத்தின் தனிப்பட்ட, உருவகமான சொல்லாட்சியையும் காக்கிறது.
