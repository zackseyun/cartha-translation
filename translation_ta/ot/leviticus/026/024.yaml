revisions:
- from: அப்போது நானும் உங்களுக்கு எதிராக நடப்பேன்[a]; உங்கள் பாவங்களுக்காக நானே உங்களை ஏழு மடங்கு[b] தாக்குவேன்.
  to: அப்போது நானும் உங்களுக்கு எதிராக நடப்பேன்[a]; உங்கள் பாவங்களுக்காக நானே உங்களை ஏழு மடங்கு தண்டிப்பேன்[b].
  rationale: The revision preserves the Hebrew structure and repeated covenant-judgment idiom while making the Tamil punishment formula unambiguous and idiomatic. It also corrects an unnatural footnote expression. No doctrinal interpretation has been added; “ஏழு மடங்கு” remains appropriately open to the source expression’s conventional intensified-punishment sense, with “ஏழு முறை” retained as an alternative.
