  text: then I also will walk contrary to you[b][a], and I myself will strike you sevenfold for your sins.
translation:
  language: ta
  text: அப்போது நானும் உங்களுக்கு எதிராக நடப்பேன்[a]; உங்கள் பாவங்களுக்காக நானே உங்களை ஏழு மடங்கு தண்டிப்பேன்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்களுடன் பகைமையோடு” அல்லது “உங்களுக்கு எதிராக.” இங்கே “எதிராக” என மொழிபெயர்க்கப்பட்டுள்ள எபிரெயச் சொல், இஸ்ரவேலும் ஆண்டவரும் ஒருவருக்கொருவர் எதிராக நடப்பதை விவரிக்க லேவியராகமம் 26-ல் மீண்டும் மீண்டும் வருகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உங்கள் பாவங்களுக்காக ஏழு முறை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָלַכְתִּי
  choice: அப்போது ... நடப்பேன்
  rationale: הלך என்பதன் அடிப்படைப் பொருளான ‘நட’ என்பதையும், இந்த அதிகாரத்தில் தொடர்ச்சியாக வரும் உடன்படிக்கைச் சொல்லாட்சியையும் காக்கிறது. וְ என்பது எச்சரிக்கைகளின் விளைவு தொடரைச் சுட்டுவதால் ‘அப்போது’ என இயல்பாக மொழிபெயர்க்கப்பட்டது.
- source_word: אַף אֲנִי
  choice: நானும்
  rationale: இஸ்ரவேலின் எதிர்ப்புக்குப் பதிலாக ஆண்டவர் தாமும் செயல்படுவார் என்ற பரஸ்பர வலிமையைச் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: עִמָּכֶם בְּקֶרִי
  choice: உங்களுக்கு எதிராக
  rationale: עִמָּכֶם என்பதன் நேரடிப் பொருள் ‘உங்களுடன்’ என்றாலும், בקרי உடன் சேர்ந்த இச்சொற்றொடர் எதிர்நிலையைச் சுட்டுகிறது. நவீன தமிழில் ‘உங்களுக்கு எதிராக நடப்பேன்’ என்பது இயல்பாகவும் அதிகாரம் முழுவதும் மீளும் கருத்தைத் தெளிவாகவும் தருகிறது.
- source_word: וְהִכֵּיתִי אֶתְכֶם
  choice: உங்களை ... தாக்குவேன்
  rationale: נכה என்பதன் தண்டனை சார்ந்த ‘அடி/தாக்கு’ பொருளைத் தக்கவைத்து, பழமையான சொல்லாட்சியைத் தவிர்க்கிறது.
- source_word: גַּם אָ֔נִי
  choice: நானே
  rationale: தண்டனை ஆண்டவரின் நேரடியான செயல் என்பதை வலியுறுத்தும் எபிரெயச் சுட்டுவலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: שֶׁבַע
  choice: ஏழு மடங்கு
  rationale: தண்டனையின் தீவிரப்படுத்தலைக் காட்டும் சொல்லாட்சியைப் பாதுகாக்கிறது; இதை கண்டிப்பாக ஏழு தனித்தனி நிகழ்வுகள் என்று மட்டும் குறுக்காமல் விடுகிறது.
- source_word: עַל חַטֹּאתֵיכֶם
  choice: உங்கள் பாவங்களுக்காக
  rationale: தண்டனைக்கான காரணம் அல்லது அடிப்படையைச் சுட்டும் עַל என்பதைக் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: בקרי என்ற உடன்படிக்கைத் தீர்ப்பு சொல்லாட்சியில் ஆண்டவருக்கும் இஸ்ரவேலுக்கும் இடையிலான பரஸ்பர எதிர்நிலை
  choice: உங்களுக்கு எதிராக
  alternative: உங்களுடன் பகைமையோடு / எதிர்ப்புடன்
  rationale: இது பின்னைய இறையியல் கருத்துகளைச் சேர்க்காமல், இஸ்ரவேலின் எதிர்நிலைக்கு ஆண்டவர் தீர்ப்பில் எதிர்நிற்கும் இலக்கியப் பரஸ்பரத்தைக் காக்கிறது. உணர்ச்சிசார் ‘பகைமை’ என்ற பொருளுக்கு மட்டும் சொல்லைச் சுருக்கவில்லை.
- issue: שֶׁבַע என்ற தண்டனைச் சூத்திரத்தின் பொருள்
  choice: ஏழு மடங்கு
  alternative: ஏழு முறை
  rationale: வசனத்தின் எச்சரிக்கைத் தீவிரத்தையும் சொல்லாட்சியின் சாத்தியமான பெருக்குப் பொருளையும் காக்கிறது; அதை முற்றிலும் கணித எண்ணிக்கையாகத் தீர்மானிப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. ‘நடப்பேன்’ என்பது அதிகாரத்தில் மீளும் உருவகத்தைப் பாதுகாக்கிறது; ‘தாக்குவேன்’ என்பது தண்டனைச் செயலின் வலிமையைப் பழமையாக்காமல் தருகிறது.
