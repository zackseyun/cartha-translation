  yaml_path: translation/ot/leviticus/026/022.yaml
  text: And I will send against you the wild animals of the field[a], and they will bereave you, cut off your livestock, reduce your number[c][b], and your roads will become desolate.
translation:
  language: ta
  text: உங்களுக்கு எதிராக வயல்வெளியின் காட்டு விலங்குகளை[a] அனுப்புவேன். அவை உங்களைப் பிள்ளையிழக்கச் செய்து[b], உங்கள் கால்நடைகளை அழித்து, உங்கள் எண்ணிக்கையைக் குறைக்கும்; உங்கள் சாலைகள் வெறிச்சோடிப்போகும்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வயல்வெளியின் மிருகங்களை.”
    reason: חַיַּת הַשָּׂדֶה என்பதற்கான நெருக்கமான சொற்சார்ந்த மாற்று.
  - marker: b
    text: எபிரெய வினை பொதுவாகப் பிள்ளையிழத்தலைக் குறிக்கிறது; மூலத்தில் “பிள்ளைகள்” என்ற சொல் வெளிப்படையாக இல்லை.
    reason: שׁכל வினையின் வழக்கமான பொருளை விளக்குகிறது; மூலத்தில் இல்லாத பெயர்ச்சொல்லை வெளிப்படையாகச் சேர்த்ததன் நுணுக்கத்தையும் தெரிவிக்கிறது.
  - marker: c
    text: அல்லது, “உங்கள் வழிகள் பாழாய்ப்போகும்”; இங்கு மக்கள் செல்லும் சாலைகள் அல்லது பயணப் பாதைகள் வெறிச்சோடுவதே பெரும்பாலும் கருத்து.
    reason: דֶּרֶךְ என்பதன் பரந்த சொற்பொருளையும் சூழலுக்கேற்ற வாசிப்பையும் பதிவு செய்கிறது.
lexical_decisions:
- source_word: וְהִשְׁלַחְתִּי בָכֶם
  choice: உங்களுக்கு எதிராக ... அனுப்புவேன்
  rationale: שלח என்பதன் ஹிஃபில் வடிவம் நேரடியாக ‘அனுப்புவேன்’ எனப் பொருள்படும்; பகைமைத் தண்டனைச் சூழலில் בָכֶם என்பது ‘உங்களுக்கு எதிராக’ என்று இயல்பாக அமைகிறது.
- source_word: חַיַּת הַשָּׂדֶה
  choice: வயல்வெளியின் காட்டு விலங்குகள்
  rationale: இந்த இணைப்புத் தொடர் மனிதரால் வளர்க்கப்படாத நிலவாழ் விலங்குகளைக் குறிக்கிறது. ‘வயல்வெளியின்’ என்பது மூலத்தின் உருவகத்தையும், ‘காட்டு விலங்குகள்’ என்பது நவீனத் தமிழின் தெளிவையும் காக்கின்றன.
- source_word: וְשִׁכְּלָה אֶתְכֶם
  choice: அவை உங்களைப் பிள்ளைகளை இழக்கச் செய்து
  rationale: שׁכל என்பதன் பியேல் வடிவம் பொதுவாகப் பிள்ளைகளை இழக்கச் செய்வதைக் குறிக்கிறது. தமிழில் பொருள் தெளிவாக இருக்க, எபிரெய மரபுத்தொடரில் உள்ளுறைந்த ‘பிள்ளைகள்’ வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: וְהִכְרִיתָה אֶת בְּהֶמְתְּכֶם
  choice: உங்கள் கால்நடைகளை அழித்து
  rationale: הכרית இங்கு முற்றாக ஒழித்தல் அல்லது அழித்தலைக் குறிக்கிறது. தமிழில் ‘வெட்டியகற்றி’ என்பது செயற்கையாக ஒலிப்பதால், தண்டனையின் தீவிரத்தை இயல்பாகத் தரும் ‘அழித்து’ தேர்ந்தெடுக்கப்பட்டது; בְּהֵמָה வளர்ப்பு விலங்குகளைச் சுட்டுவதால் ‘கால்நடைகள்’ பொருத்தமானது.
- source_word: וְהִמְעִיטָה אֶתְכֶם
  choice: உங்கள் எண்ணிக்கையைக் குறைக்கும்
  rationale: מעט என்பதன் ஹிஃபில் வடிவம் ‘குறைவாக்குதல்’ என்று பொருள்படும்; இங்கு மக்கள்தொகை குறைவதே கருத்து.
- source_word: וְנָשַׁמּוּ דַּרְכֵיכֶם
  choice: உங்கள் சாலைகள் வெறிச்சோடிப்போகும்
  rationale: נשׁם பாழடைதல் அல்லது வெறிச்சோடுதல் என்றும், דְּרָכִים இச்சூழலில் பயணப் பாதைகள் என்றும் பொருள்படுகின்றன. ‘சாலைகள் வெறிச்சோடிப்போகும்’ என்பது சமூக அழிவால் போக்குவரத்து நின்றுபோவதை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: பிள்ளையிழப்பின் உள்ளுறைந்த செயப்படுபொருள்
  choice: ‘பிள்ளைகளை இழக்கச் செய்து’ என்று வெளிப்படுத்தப்பட்டது
  alternative: ‘உங்களைப் பிள்ளையிழந்தவர்களாக்கி’ அல்லது உள்ளுறைந்த பொருளைச் சொல்லாமல் மொழிபெயர்த்தல்
  rationale: மூலத்தில் ‘பிள்ளைகள்’ என்ற பெயர்ச்சொல் தனியே இல்லாவிட்டாலும், שׁכל என்ற வினை இச்சூழலில் பிள்ளைகளை இழக்கச் செய்வதை மரபாகக் குறிக்கிறது. இதை வெளிப்படுத்துவது புதிய இறையியல் கருத்தைச் சேர்ப்பதல்ல; எபிரெய மரபுத்தொடரின் பொருளைத் தமிழில் புரியச்செய்வதாகும்.
- issue: דַּרְכֵיכֶם என்பதன் நேரடி அல்லது உருவகப் பொருள்
  choice: நேரடியான ‘உங்கள் சாலைகள்’
  alternative: உருவகமான ‘உங்கள் வழிகள்’
  rationale: மக்களும் கால்நடைகளும் குறைந்து நாடு வெறிச்சோடும் தண்டனைச் சூழலில், பயணச் சாலைகள் வெறிச்சோடுவது மிகவும் இயல்பான வாசிப்பு. இருந்தாலும் சொல்லுக்கு ‘வழிகள்’ என்ற பரந்த பொருளும் இருக்க முடியும் என்பதால் அடிக்குறிப்பில் மாற்று தரப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘வயல்வெளியின் காட்டு விலங்குகள்’ மூலமொழியின் சொற்படிமத்தை வைத்திருக்கிறது; ‘கால்நடைகள்’, ‘எண்ணிக்கை’, ‘சாலைகள் வெறிச்சோடிப்போகும்’ ஆகியவை தெளிவான நடப்புத் தமிழ் சொற்களாகத் தேர்ந்தெடுக்கப்பட்டன.
