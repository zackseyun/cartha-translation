  yaml_path: translation/ot/leviticus/026/006.yaml
  text: And I will give peace in the land[a], and you will lie down, with no one making you afraid. And I will remove harmful beasts from the land[b], and the sword will not pass through your land.
translation:
  language: ta
  text: நான் நாட்டில் அமைதியை அளிப்பேன். நீங்கள் படுத்திருப்பீர்கள்; உங்களை அச்சுறுத்த எவரும் இருக்கமாட்டார்கள். ஆபத்தான விலங்குகளை[a] நாட்டிலிருந்து நீக்கிவிடுவேன்; வாள்[b] உங்கள் நாட்டின் வழியாகக் கடந்து செல்லாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘காட்டு விலங்குகளை.’ எபிரெயச் சொற்றொடர் நாட்டிலுள்ள தீங்கு விளைவிக்கும் அல்லது ஆபத்தான விலங்குகளைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘வாள்’ என்பது இங்கு போர் அல்லது ஆயுதப் படையெடுப்பைக் குறிக்கும் எபிரெய ஆகுபெயர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: நான் ... அளிப்பேன்
  rationale: נתן என்பதன் அடிப்படைப் பொருள் ‘கொடு’. அமைதியை அருளும் உடன்படிக்கை ஆசீர்வாதத்தை இயல்பான தமிழில் ‘அளிப்பேன்’ எனத் தருகிறது.
- source_word: שָׁלוֹם
  choice: அமைதி
  rationale: இந்தச் சொல் அமைதி, நல்வாழ்வு, முழுமை ஆகிய பரந்த பொருள்களைக் கொண்டது. இச்சூழலில் அச்சம், ஆபத்தான விலங்குகள், படையெடுப்பு ஆகியவை இல்லாத பாதுகாப்பை ‘அமைதி’ இயல்பாகக் குறிக்கிறது; அதன் பரந்த நல்வாழ்வுப் பொருளையும் முற்றிலும் சுருக்குவதில்லை.
- source_word: בָּאָרֶץ
  choice: நாட்டில்
  rationale: אֶרֶץ இங்கு இஸ்ரவேலின் உடன்படிக்கை நாட்டைக் குறிக்கிறது. நவீனத் தமிழில் ‘நாட்டில்’ என்பது அதன் நிலப்பரப்பு மற்றும் சமூக வாழ்வு இரண்டையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וּשְׁכַבְתֶּם
  choice: நீங்கள் படுத்திருப்பீர்கள்
  rationale: שׁכב என்பதன் நேரடிப் படிமமான ‘படுத்திருத்தல்’ பாதுகாப்பான ஓய்வை உணர்த்துகிறது; அதை ‘தூங்குதல்’ என்று தேவையின்றிக் குறுக்கவில்லை.
- source_word: וְאֵין מַחֲרִיד
  choice: உங்களை அச்சுறுத்த எவரும் இருக்கமாட்டார்கள்
  rationale: מַחֲרִיד அச்சத்தை உண்டாக்குகிறவர் அல்லது அச்சுறுத்துவது என்பதைக் குறிக்கிறது. இத்தமிழ் வடிவம் அதன் காரணவினைப் பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: וְהִשְׁבַּתִּי
  choice: ஒழித்துவிடுவேன்
  rationale: שׁבת என்பதன் Hiphil வடிவம் ‘இல்லாமல் போகச் செய்தல், முடிவுக்குக் கொண்டுவருதல்’ என்று பொருள்படும். நாட்டில் அத்தகைய விலங்குகளின் அச்சுறுத்தல் இனி இருக்காது என்பதை ‘ஒழித்துவிடுவேன்’ தெளிவாகக் காட்டுகிறது.
- source_word: חַיָּה רָעָה
  choice: ஆபத்தான விலங்குகள்
  rationale: חַיָּה என்பது விலங்கையும் רָעָה இங்கு அவற்றின் தீங்கான அல்லது ஆபத்தான தன்மையையும் குறிக்கிறது; அவற்றுக்கு ஒழுக்கரீதியான ‘தீமை’ இருப்பதாகச் சொல்லவில்லை.
- source_word: מִן הָאָרֶץ
  choice: நாட்டிலிருந்து
  rationale: நிலப்பரப்பிலிருந்து அகற்றப்படுவதை நேரடியாக வெளிப்படுத்தும் இயல்பான தமிழ்.
- source_word: וְחֶרֶב
  choice: வாள்
  rationale: חֶרֶב என்பதன் நேரடிப் படிமத்தைப் பாதுகாக்கிறது; இங்கு அது போர் அல்லது ஆயுதப் படையெடுப்பைக் குறிக்கும் ஆகுபெயராகவும் செயல்படுகிறது.
- source_word: לֹא תַעֲבֹר
  choice: கடந்து செல்லாது
  rationale: עבר என்பதன் ‘கடந்து செல்’ என்ற நேரடிப் பொருளைத் தக்கவைத்து, பகைவர் படை நாட்டின் வழியாக நுழைந்து செல்லாத படிமத்தைப் பாதுகாக்கிறது.
- source_word: בְּאַרְצְכֶם
  choice: உங்கள் நாட்டின் வழியாக
  rationale: இரண்டாம் நபர் பன்மை உடைமைப் பின்னொட்டைத் துல்லியமாகக் காட்டி, நாட்டின் ஊடாகச் செல்லுதல் என்ற கருத்தை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: வாக்குறுதியளிக்கப்பட்ட அமைதியின் வரம்பு
  choice: இஸ்ரவேலின் நாட்டில் அச்சமின்மை, ஆபத்தான விலங்குகளிலிருந்து பாதுகாப்பு, படையெடுப்பின்மை ஆகியவற்றை உள்ளடக்கிய உடன்படிக்கைப் பாதுகாப்பாக மொழிபெயர்க்கப்பட்டது.
  alternative: இதை முற்றிலும் உள்ளார்ந்த ஆன்மிக அமைதியாகவோ, முற்றிலும் அரசியல் அமைதியாகவோ மட்டும் புரிந்துகொள்ளுதல்.
  rationale: படுத்திருத்தல், அச்சுறுத்தல் இல்லாமை, ஆபத்தான விலங்குகள், வாள் ஆகிய உறுதியான குறிப்புகள் பொருள்சார்ந்த பாதுகாப்பைத் தெளிவுபடுத்துகின்றன. அதேவேளையில் שָׁלוֹם என்பதன் பரந்த நல்வாழ்வுப் பொருளை மொழிபெயர்ப்பு மறுப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. எபிரெய வாக்கியத்தின் தொடர்ச்சியைச் சுருக்காமல், தமிழில் தெளிவுக்காக வாக்கியப் பிரிப்பு செய்யப்பட்டது. வழங்கப்பட்ட ஆங்கில அடுக்கில் அடிக்குறிப்பு குறிகள் கருத்துகளுடன் தவறாக இணைந்திருந்ததால், [a] ஆபத்தான விலங்குகளுக்குப் பின்னரும் [b] வாளுக்குப் பின்னரும் பொருத்தப்பட்டன.
