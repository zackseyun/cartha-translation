revisions:
- from: நான் நாட்டில் அமைதியை அளிப்பேன். நீங்கள் படுத்திருப்பீர்கள்; உங்களை அச்சுறுத்த எவரும் இருக்கமாட்டார்கள். ஆபத்தான விலங்குகளை[a] நாட்டிலிருந்து ஒழித்துவிடுவேன்; வாள்[b] உங்கள் நாட்டின் வழியாகக் கடந்து செல்லாது.
  to: நான் நாட்டில் அமைதியை அளிப்பேன். நீங்கள் படுத்திருப்பீர்கள்; உங்களை அச்சுறுத்த எவரும் இருக்கமாட்டார்கள். ஆபத்தான விலங்குகளை[a] நாட்டிலிருந்து நீக்கிவிடுவேன்; வாள்[b] உங்கள் நாட்டின் வழியாகக் கடந்து செல்லாது.
  rationale: The revision replaces a potentially over-specific verb of destruction with ‘நீக்கிவிடுவேன்,’ which directly conveys removal and the cessation of the beasts’ presence. Footnote a is aligned more exactly with the lexical alternative ‘wild beasts.’ Footnote markers remain correctly anchored to the animals and the sword, respectively.
