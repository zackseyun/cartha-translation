base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/046.yaml
  text: These are the statutes and the judgments and the laws that Yahweh gave between himself and the sons of Israel at Mount Sinai by the hand of Moses[a][b].
translation:
  language: ta
  text: இவையே யாவே தனக்கும் இஸ்ரவேல் மகன்களுக்கும் இடையே சீனாய் மலையில் மோசேயின் கையால்[a] கொடுத்த விதிமுறைகளும் நியாயத்தீர்ப்புகளும் சட்டங்களும் ஆகும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மோசேயின் கையால்” என்பது “மோசேயின் மூலமாக” என்று பொருள்படும் எபிரேய மரபுத்தொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: אֵלֶּה
  choice: இவையே ... ஆகும்
  rationale: சுருக்கமாக முடிவுரைக்கும் எபிரேயச் சுட்டுச் சொல்லைத் தமிழில் இயல்பான அடையாள வாக்கியமாக வழங்குகிறது.
- source_word: הַחֻקִּים
  choice: சட்டதிட்டங்கள்
  rationale: நிர்ணயிக்கப்பட்ட நிலையான விதிமுறைகள் என்ற சட்ட-உடன்படிக்கைச் சாரத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: הַמִּשְׁפָּטִים
  choice: நீதி ஆணைகள்
  rationale: மִשְׁפָּטִים என்பதிலுள்ள நீதித்தீர்ப்பு மற்றும் சட்ட ஆணை ஆகிய நுண்பொருட்களை இணைத்துப் பாதுகாக்கிறது.
- source_word: הַתּוֹרֹת
  choice: போதனைச் சட்டங்கள்
  rationale: תּוֹרֹת என்பதன் 'போதனைகள்' மற்றும் இச்சூழலின் சட்டத் தொகுப்புகள் ஆகிய இரு கூறுகளையும் வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר נָתַן
  choice: கொடுத்த
  rationale: נָתַן என்பதன் நேரடியான பொருளைப் பாதுகாக்கிறது; 'ஏற்படுத்திய' என்று விளக்கமாக மாற்றவில்லை.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நன்கு அறியப்பட்ட தனிப்பெயர் வடிவில் நான்கெழுத்துத் தெய்வீகப் பெயரைத் தலைப்பாக மாற்றாமல் வழங்குகிறது.
- source_word: בֵּינוֹ וּבֵין בְּנֵי יִשְׂרָאֵל
  choice: தனக்கும் இஸ்ரவேலின் மக்களுக்கும் இடையே
  rationale: உடன்படிக்கையின் இரு தரப்புகளையும் தெளிவாகக் காட்டுகிறது; בְּנֵי יִשְׂרָאֵל என்ற இனக்குழுப் பயன்பாட்டை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: בְּהַר סִינַי
  choice: சீனாய் மலையில்
  rationale: இடத்தைக் குறிக்கும் எபிரேய முன்னிடைச்சொல்லை இயல்பான தமிழில் வழங்குகிறது.
- source_word: בְּיַד מֹשֶׁה
  choice: மோசேயின் கையால்
  rationale: மூலத்தின் உருவகச் சொல்லாட்சியை முதன்மை உரையில் காத்து, அதன் இடைமுகப் பொருளை அடிக்குறிப்பில் விளக்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற உடன்படிக்கைப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே
  rationale: பெயரை 'கர்த்தர்' போன்ற பட்டப்பெயராக மாற்றாமல் தனிப்பெயராகவே வைத்துள்ளது. உயிரெழுத்தாக்கம் உறுதியற்றதாயினும், 'யெகோவா' என்பது தமிழ் வாசகர்களிடையே நிலைபெற்ற வடிவம்.
- issue: בְּנֵי יִשְׂרָאֵל என்பதன் வெளிப்பாடு
  choice: இஸ்ரவேலின் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: இங்கு முழு உடன்படிக்கைச் சமூகத்தைக் குறிக்கும் வழக்குச் சொற்றொடர் என்பதால் நவீன தமிழில் பாலினத்தை தேவையின்றி வரையறுக்காத இயல்பான இனக்குழுப் பெயரைத் தேர்ந்தெடுக்கிறது.
- issue: நியமங்களின் மும்மடங்கு சட்டச் சொற்பிரிவு
  choice: சட்டதிட்டங்கள், நீதி ஆணைகள், போதனைச் சட்டங்கள்
  alternative: கட்டளைகள், நியாயங்கள், பிரமாணங்கள்
  rationale: மூன்று வேறுபட்ட எபிரேயப் பன்மைச் சொற்களின் வேறுபாட்டைக் காத்து, அவை அனைத்தையும் ஒரே பொதுச் சொல்லாகச் சுருக்கவில்லை.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க தமிழ் பயன்படுத்தப்பட்டுள்ளது. சட்ட-உடன்படிக்கை நடையைப் பாதுகாக்க மூன்று சட்டச் சொற்களும் தனித்தனியாக மொழிபெயர்க்கப்பட்டுள்ளன; அரிதான மரபுத்தொடர் மட்டும் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
