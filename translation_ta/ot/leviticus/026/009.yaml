source:
  edition: WLC
  text: וּ/פָנִ֣יתִי אֲלֵי/כֶ֔ם וְ/הִפְרֵיתִ֣י אֶתְ/כֶ֔ם וְ/הִרְבֵּיתִ֖י אֶתְ/כֶ֑ם וַ/הֲקִימֹתִ֥י אֶת בְּרִיתִ֖/י אִתְּ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/009.yaml
  text: And I will turn toward you and make you fruitful and multiply you[a], and I will establish my covenant with you.
translation:
  language: ta
  text: நான் உங்கள்பக்கம் திரும்பி, உங்களைப் பலுகவும் பெருகவும் செய்வேன்; உங்களோடு என் உடன்படிக்கையை நிலைநிறுத்துவேன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּפָנִיתִי אֲלֵיכֶם
  choice: நான் உங்கள்பக்கம் திரும்பி
  rationale: פנה என்பதன் அடிப்படைப் பொருளான ‘திரும்புதல்’ என்ற உருவகத்தைப் பாதுகாக்கிறது; இந்த ஆசீர்வாதச் சூழலில் அது இறைவனின் சாதகமான நோக்கையும் உணர்த்துகிறது.
- source_word: וְהִפְרֵיתִי אֶתְכֶם
  choice: உங்களைப் பலுகி
  rationale: פרה என்பதன் ஹிஃபீல் வடிவம் பலுகச் செய்தல் என்ற காரணவினைப் பொருளைக் கொண்டது. அடுத்த வினையுடன் தமிழில் இயல்பாக இணைக்க ‘பலுகி’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: וְהִרְבֵּיתִי אֶתְכֶם
  choice: பெருகச் செய்வேன்
  rationale: רבה என்பதன் ஹிஃபீல் வடிவம் எண்ணிக்கையில் பெருகச் செய்தலைக் குறிக்கிறது; ‘பலுகிப் பெருகச் செய்வேன்’ என்பது மூலத்தின் இணை ஆசீர்வாதச் சொல்லாட்சியைத் தக்கவைக்கிறது.
- source_word: וַהֲקִימֹתִי
  choice: நிலைநிறுத்துவேன்
  rationale: קום என்பதன் ஹிஃபீல் வடிவம் உடன்படிக்கையுடன் வரும்போது அதை நிலைபெறச் செய்தல், உறுதிப்படுத்துதல் என்ற பொருளைக் கொடுக்கிறது.
- source_word: בְּרִיתִי אִתְּכֶם
  choice: உங்களுடன் என் உடன்படிக்கையை
  rationale: בְּרִית என்பதற்கு வேதாகமச் சூழலில் நிலையான ‘உடன்படிக்கை’ என்பதும், אִתְּכֶם என்பதற்கு உறவைக் குறிக்கும் ‘உங்களுடன்’ என்பதும் நேரான மொழிபெயர்ப்புகள்.
theological_decisions:
- issue: இறைவன் மக்கள்பக்கம் திரும்புவதில் உள்ள சாதகமான அருள்நோக்கை வெளிப்படையாக்குவதா
  choice: ‘நான் உங்கள்பக்கம் திரும்பி’ என்ற மூல உருவகத்தை முதன்மை உரையில் தக்கவைத்தல்
  alternative: ‘நான் உங்கள்மேல் அருள்நோக்கம் வைத்து’
  rationale: சூழல் சாதகமான நோக்கைத் தெளிவாக்கினாலும், எபிரெய வினை நேரடியாக ‘திரும்புதல்’ என்பதே; ஆகவே உருவகம் பாதுகாக்கப்பட்டு, உட்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: பலுகுதல் மற்றும் பெருகுதல் என்னும் உடன்படிக்கை ஆசீர்வாதச் சூத்திரம்
  choice: ‘உங்களைப் பலுகிப் பெருகச் செய்வேன்’
  alternative: ‘உங்களை இனவிருத்தியடையச் செய்து எண்ணிக்கையில் அதிகரிக்கச் செய்வேன்’
  rationale: தேர்ந்தெடுத்த சொற்றொடர் மக்கள் எண்ணிக்கையின் வளர்ச்சியை மட்டும் விளக்காமல், தோரா முழுவதும் எதிரொலிக்கும் ஆசீர்வாதச் சொல்லாட்சியையும் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான வேதாகம நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘பலுகிப் பெருக’ என்பது இயல்பான தமிழ் ஆசீர்வாதச் சொல்லாட்சியாகவும், மூலத்தின் இணை வினைகளைக் காக்கும் வகையிலும் தேர்ந்தெடுக்கப்பட்டது.
