  text: then I also will walk contrary to you in furious hostility[b][a], and I myself will discipline you sevenfold for your sins.
translation:
  language: ta
  text: அப்போது நானும் கடும் சீற்றத்தோடு உங்களுக்கு எதிராக நடப்பேன்[a]; உங்கள் பாவங்களுக்காக நானே உங்களை ஏழுமடங்கு ஒழுக்கப்படுத்துவேன்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எதிர்மையின் சீற்றத்தில் உங்களோடு நடப்பேன்”; மரபாக, “சீற்றத்தோடு உங்களுக்கு எதிராக நடப்பேன்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உங்கள் பாவங்களுக்காக உங்களை ஏழு முறை ஒழுக்கப்படுத்துவேன்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָלַכְתִּי
  choice: நடப்பேன்
  rationale: הלך என்பதன் அடிப்படைப் பொருளான ‘நடத்தல்/நடப்பது’ என்பதையும், இந்த அதிகாரம் முழுவதும் திரும்பத் திரும்ப வரும் உடன்படிக்கைச் சொல்லாட்சியையும் காக்கிறது.
- source_word: עִמָּכֶם
  choice: உங்களுக்கு எதிராக
  rationale: עם என்பதன் நேரடிப் பொருள் ‘உங்களோடு’ என்றாலும், קֶרִי உடன் சேர்ந்த இச்சூழலில் எதிர்நிலையைக் குறிக்கிறது; நவீனத் தமிழில் பொருள் தெளிவாக இருக்க ‘உங்களுக்கு எதிராக’ என வழங்கப்பட்டது.
- source_word: בַּחֲמַת
  choice: கடும் சீற்றத்தோடு
  rationale: חֵמָה குறிக்கும் கொதிப்பு, சினம், சீற்றம் ஆகிய தீவிர உணர்வை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: קֶרִי
  choice: எதிராக
  rationale: இச்சொல் அரிதானதும் பொருள் உறுதியாகத் தீராததும் ஆகும்; இங்கு பகைமை அல்லது எதிர்மையைச் சுட்டும் சூழல்சார் பொருள் முதன்மை உரையில் இயல்பாக வழங்கப்பட்டு, நேரடியான மாற்று அடிக்குறிப்பில் காக்கப்பட்டுள்ளது.
- source_word: וְיִסַּרְתִּי
  choice: கண்டித்துத் திருத்துவேன்
  rationale: יסר என்பது வெறும் தண்டனையை மட்டுமல்லாமல் ஒழுக்கப்படுத்துதல் அல்லது திருத்துதல் என்ற நுணுக்கத்தையும் கொண்டது; இரண்டையும் இயல்பாக இணைக்கும் தமிழ்ச் சொற்றொடர் தேர்ந்தெடுக்கப்பட்டது.
- source_word: אַף אֲנִי
  choice: நானும் ... நானே
  rationale: אַף மற்றும் אֲנִי தரும் வலியுறுத்தலைத் தமிழில் ‘நானும்’ மற்றும் ‘நானே’ என இரு இடங்களில் காக்கிறது.
- source_word: שֶׁבַע
  choice: ஏழுமடங்கு
  rationale: தீர்ப்பின் தீவிரப் பெருக்கத்தைக் குறிக்கும் சுருக்கமான இயல்பான தமிழ் வடிவம்; ‘ஏழு முறை’ என்ற மாற்றும் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: עַל חַטֹּאתֵיכֶם
  choice: உங்கள் பாவங்களுக்காக
  rationale: ஒழுக்க நடவடிக்கையின் காரணம் அல்லது அடிப்படையை עַל இங்கு குறிக்கிறது; ‘பாவங்களுக்காக’ அதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: உடன்படிக்கைச் சாபத்தில் இறைவனின் பதிலின் இயல்பு
  choice: இறைவன் ‘எதிராக நடப்பது’ என்ற உறவுசார் எதிர்நிலையையும், ‘கண்டித்துத் திருத்துவது’ என்ற ஒழுக்க நடவடிக்கையையும் ஒன்றாகக் காத்தல்
  alternative: வசனம் முழுவதையும் தண்டனை என்ற ஒரே பொருளில் வழங்குதல், அல்லது எதிர்நிலையை வெறும் அதிருப்தியாக மென்மைப்படுத்துதல்
  rationale: எபிரெய உரை הלך + עם + קֶרִי என்ற எதிர்நிலைச் சொல்லாட்சியையும், திருத்தும் ஒழுக்கத்தையும் உள்ளடக்கக்கூடிய יסר என்பதையும் இணைக்கிறது. இரண்டையும் காப்பது முற்றிலும் பழிவாங்கும் வாசிப்பையோ அளவுக்கு மீறிய மென்மைப்படுத்தலையோ மொழிபெயர்ப்பில் புகுத்தாமல் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘நடப்பேன்’ என்ற மீளும் உடன்படிக்கை உருவகம் காக்கப்பட்டது; அரிதான קֶרִי என்பதன் ஐயப்பாடு அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்பட்டது.
