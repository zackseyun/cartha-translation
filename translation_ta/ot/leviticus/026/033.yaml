base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/033.yaml
  text: And I will scatter you among the nations[a], and I will draw out the sword after you; and your land will become a desolation, and your cities will become ruins.
translation:
  language: ta
  text: நான் உங்களை நாடுகளிடையே சிதறடிப்பேன்; வாளை உருவி உங்களைத் துரத்துவேன்.[a] உங்கள் நிலம் பாழ்நிலமாகும்; உங்கள் நகரங்கள் இடிபாடுகளாகும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மாற்றாக, “உங்களுக்குப் பின்னால் வாளை உறையிலிருந்து எடுப்பேன்.”
    reason: וַהֲרִיקֹתִי ... חָרֶב என்ற எபிரெய மரபுத்தொடருக்கு ‘வாளை உருவுதல்/உறையிலிருந்து எடுத்தல்’ என்ற மாற்று நேரடியான வடிவத்தைப் பதிவு செய்கிறது; אַחֲרֵיכֶם என்பதன் ‘உங்களுக்குப் பின்னால்’ என்ற கூறையும் காக்கிறது.
lexical_decisions:
- source_word: אֱזָרֶה
  choice: சிதறடிப்பேன்
  rationale: זרה என்ற வினை இங்கு மக்களைப் பல நாடுகளிடையே சிதறிப்போகச் செய்வதைக் குறிக்கிறது. ‘சிதறடிப்பேன்’ என்பது தெய்வீகச் செயற்பாட்டையும் உடன்படிக்கைத் தீர்ப்பின் வலிமையையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: בַגּוֹיִם
  choice: நாடுகளிடையே
  rationale: גּוֹיִם இங்கு அந்நிய அரசியல் மக்களினங்களையும் நாடுகளையும் குறிக்கிறது. ‘புறவினத்தார்’ போன்ற பிற்கால சமயச் சாயலைச் சேர்க்காமல் ‘நாடுகள்’ மூலத்தின் பொருளைத் தருகிறது.
- source_word: וַהֲרִיקֹתִי ... חָרֶב
  choice: வாளை உருவி
  rationale: ריק + חֶרֶב என்பது வாளை உறையிலிருந்து உருவுதல் அல்லது போருக்காக எடுப்பது என்ற எபிரெய மரபுத்தொடர். ‘வாளை உருவி’ அதன் தெளிவான போர்ப்படிமத்தைத் தக்கவைக்கிறது.
- source_word: אַחֲרֵיכֶם
  choice: உங்களைத் துரத்துவேன்
  rationale: சொல்லளவில் ‘உங்களுக்குப் பின்னால்’ என்றாலும், வாள் உருவப்படும் இச்சூழலில் பகைமையுடன் பின்தொடர்தல் பொருள் தெளிவாக உள்ளது. இயல்பான தமிழுக்காக அதைப் ‘உங்களைத் துரத்துவேன்’ என்று வெளிப்படுத்தி, சொல்லளவிலான வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: שְׁמָמָה
  choice: பாழ்நிலமாகும்
  rationale: שְׁמָמָה என்பது அழிவினால் வெறிச்சோடிய நிலையை அல்லது பாழாக்கப்பட்ட இடத்தைக் குறிக்கிறது. ‘பாழ்நிலமாகும்’ என்பது பெயர்ச்சொல் சார்ந்த விளைவையும் நிலத்தின் வெறுமையையும் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: חָרְבָּה
  choice: இடிபாடுகளாகும்
  rationale: חָרְבָּה என்பது அழிக்கப்பட்ட அல்லது பாழடைந்த இடங்களைக் குறிக்கிறது. நகரங்களுடன் ‘இடிபாடுகளாகும்’ என்பது விளைவுநிலையைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: וְהָיְתָה ... יִהְיוּ
  choice: ஆகும்
  rationale: היה இங்கு நிலையும் நகரங்களும் அழிவுநிலைக்கு மாறும் விளைவுப் பொருளைக் கொண்டுள்ளது. ‘ஆகும்’ அந்த மாற்றத்தைச் சுருக்கமாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: நாடுகடத்தலையும் இராணுவத் துரத்தலையும் குறிக்கும் உடன்படிக்கைத் தீர்ப்பில் தேவனுடைய நேரடிச் செயற்பாடு
  choice: ‘நான் ... சிதறடிப்பேன்; ... துரத்துவேன்’ என்ற நேரடி முதலாம் நபர் செயற்பாட்டைத் தக்கவைத்தல்
  alternative: தேவனுடைய செயற்பாட்டை மென்மைப்படுத்தும் செயப்பாட்டு அல்லது ஆளற்ற வாக்கிய அமைப்பு
  rationale: எபிரெய உரை இத்தீர்ப்புகளை நேரடியாகப் பேசுகிறவரின் செயல்களாகக் கூறுகிறது. அதன் இறையியல் தீவிரத்தை மொழிபெயர்ப்பு குறைக்கக் கூடாது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதில் புரியும், அதேவேளையில் உடன்படிக்கைத் தீர்ப்பின் கண்ணியமும் கடுமையும் கொண்ட நடை. ‘வாளை உருவி’ என்ற இலக்கியமான ஆனால் பரவலாகப் புரியக்கூடிய சொற்றொடர் போர்ப்படிமத்தைக் காக்கிறது. அரைப்புள்ளிகள் எபிரெய வாக்கியத்தின் இணையான தீர்ப்பு அலகுகளைத் தெளிவுபடுத்துகின்றன.
