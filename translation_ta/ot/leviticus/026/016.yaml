base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/016.yaml
  text: 'I also will do this to you: I will appoint over you sudden terror[a], wasting disease and fever, consuming the eyes and draining the life; and you will sow your seed in vain[c][b], and your enemies will eat it.'
translation:
  language: ta
  text: 'நானும் உங்களுக்கு இப்படியே செய்வேன்: திடீர் திகிலையும், உடலை மெலியச்செய்யும் நோயையும், காய்ச்சலையும் உங்கள்மேல் கொண்டுவருவேன்; அவை கண்களை மங்கச்செய்து உயிரை வாடச்செய்யும்[c]. நீங்கள் உங்கள் விதையை வீணாக விதைப்பீர்கள்; உங்கள் பகைவர்கள் அதைத் தின்பார்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: c
    text: அல்லது, “கண்களைச் செயலிழக்கச்செய்து உயிர்ச்சக்தியைத் தேயச்செய்யும்.” இச்சொற்றொடர் நோயால் ஏற்படும் கடுமையான தளர்ச்சியையும் உயிர்வலிமை குன்றுதலையும் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף אֲנִי
  choice: நானும்
  rationale: אַף உடன் வரும் தனிப்பெயர்ச்சொல் தொடர்ச்சியையும் வலியுறுத்தலையும் காட்டுகிறது; “நானும்” என்பது இயல்பான தமிழில் இரண்டையும் தக்கவைக்கிறது.
- source_word: אֶעֱשֶׂה זֹּאת לָכֶם
  choice: உங்களுக்கு இப்படியே செய்வேன்
  rationale: நியாயத்தீர்ப்புச் சூழலில் செயல் கேட்போர்மேல் செலுத்தப்படுவதைத் தெளிவாகக் காட்டுகிறது.
- source_word: וְהִפְקַדְתִּי עֲלֵיכֶם
  choice: உங்கள்மேல் வரச்செய்வேன்
  rationale: פקד என்பதன் ஹிஃபில் வடிவம் இங்கு ஒரு தண்டனையை ஒருவர்மேல் நியமித்தல் அல்லது கொண்டுவருதல் என்ற பொருளைக் கொண்டது; இயல்பான தமிழுக்காக “வரச்செய்வேன்” தேர்ந்தெடுக்கப்பட்டது.
- source_word: בֶּהָלָה
  choice: திடீர் திகில்
  rationale: திடீரென ஏற்படும் அச்சம், பதற்றம் ஆகிய உணர்வுகளைச் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: הַשַּׁחֶפֶת
  choice: இளைப்பு நோய்
  rationale: குறிப்பிட்ட பண்டைய நோய் எது என்பது உறுதியில்லை; உடலை மெலியவைக்கும் நோய் என்ற பொதுவான அறிகுறியை இது காட்டுகிறது, குறிப்பிட்ட நவீன நோயறிதலைத் தவிர்க்கிறது.
- source_word: הַקַּדַּחַת
  choice: காய்ச்சல்
  rationale: காய்ச்சலின் எரியும் தன்மையைக் குறிக்கும் எபிரேயச் சொல்லுக்கான தெளிவான நவீனத் தமிழ் இணை.
- source_word: מְכַלּוֹת עֵינַיִם
  choice: கண்களை மங்கச்செய்து
  rationale: கண்கள் தேய்ந்து செயலிழக்கும் எபிரேய உருவகத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וּמְדִיבֹת נָפֶשׁ
  choice: உயிரை வாடச்செய்யும்
  rationale: נפש என்பதை உடலற்ற “ஆத்துமா” எனக் குறுக்காமல், இங்கு உயிர்ச்சக்தி அல்லது வாழ்வு என்ற சூழல்சார்ந்த பொருளில் வழங்குகிறது.
- source_word: וּזְרַעְתֶּם לָרִיק זַרְעֲכֶם
  choice: நீங்கள் உங்கள் விதையை வீணாக விதைப்பீர்கள்
  rationale: לריק என்பதன் பயனின்றி, பலனின்றி என்ற பொருளையும் விதைப்பு உருவகத்தையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: וַאֲכָלֻהוּ אֹיְבֵיכֶם
  choice: உங்கள் பகைவர்கள் அதைத் தின்பார்கள்
  rationale: எபிரேய இணைப்பை நேரடியாகப் பின்பற்றி, விதைத்ததன் விளைச்சலைப் பகைவர்கள் உண்பார்கள் என்ற வேளாண் படிமத்தைத் தக்கவைக்கிறது.
theological_decisions:
- issue: சாபத்தின் சூழலில் נָפֶשׁ என்பதன் மொழிபெயர்ப்பு
  choice: உயிர்
  alternative: ஆத்துமா / தன் உயிர்
  rationale: உடல் நோயால் உயிர்ச்சக்தி வாடும் சூழலுக்கு “உயிர்” பொருந்துகிறது; மனித இயல்பைப் பற்றிய பிற்கால இருமைக் கோட்பாட்டை வசனத்திற்குள் இறக்குமதி செய்வதைத் தவிர்க்கிறது.
