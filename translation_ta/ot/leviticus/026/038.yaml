  text: וַ/אֲבַדְתֶּ֖ם בַּ/גּוֹיִ֑ם וְ/אָכְלָ֣ה אֶתְ/כֶ֔ם אֶ֖רֶץ אֹיְבֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/038.yaml
  text: You will perish among the nations[a], and the land of your enemies will consume you.
translation:
  language: ta
  text: நீங்கள் பிற நாடுகளுக்குள் அழிந்துபோவீர்கள்; உங்கள் பகைவர்களின் நாடு உங்களை விழுங்கும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்கு சொல், ‘உங்களை உண்ணும்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲבַדְתֶּם
  choice: அழிந்துபோவீர்கள்
  rationale: אבד என்பதன் கால் வடிவம் இங்கு உடன்படிக்கைச் சாபத்தின் விளைவாக நேரும் அழிவைக் குறிக்கிறது. வன்முறையாகக் கொல்லப்படுதல் என்று மிகையாகக் குறிப்பாக்காமல், ‘அழிந்துபோவீர்கள்’ அதன் தீவிரத்தையும் இயல்பான தமிழையும் காக்கிறது.
- source_word: בַּגּוֹיִם
  choice: பிற இனத்தாரிடையே
  rationale: גּוֹיִם என்பது நாடுகள் அல்லது மக்கள் இனங்களைக் குறிக்கிறது. இங்கு சிதறடிக்கப்பட்டு அந்நிய மக்களிடையே வாழும் சூழலைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்க ‘பிற இனத்தாரிடையே’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: וְאָכְלָה
  choice: விழுங்கும்
  rationale: אכל என்பதன் நேரடிப் பொருள் ‘தின்னும்/உண்ணும்.’ நாடே எழுவாயாக வரும் இவ்விடத்தில், நாடு அவர்களை முற்றிலும் உட்கொள்ளும் உருவகத்தை இயல்பான தமிழில் ‘விழுங்கும்’ காக்கிறது.
- source_word: אֶתְכֶם
  choice: உங்களை
  rationale: இது இரண்டாம் நபர் ஆண்பால் பன்மை பின்னொட்டுடன் கூடிய நேரடிச் செயப்படுபொருள் குறியீடு; தமிழில் இயல்பாக ‘உங்களை’ என்று தரப்பட்டது.
- source_word: אֶרֶץ
  choice: நாடு
  rationale: אֶרֶץ என்பதற்கு நிலம், நாடு, தேசம் ஆகிய பொருள்கள் உண்டு. பகைவர்களுடைய ஆட்சிப்பரப்பையும் நாடையும் குறிக்கும் இச்சூழலில் ‘நாடு’ இயல்பாக உள்ளது.
- source_word: אֹיְבֵיכֶם
  choice: உங்கள் பகைவர்களின்
  rationale: மூலத்தின் பன்மையையும் உரிமைத் தொடர்பையும் நேரடியாகக் காக்கும் இயல்பான தமிழ் வடிவம்.
theological_decisions:
- issue: பகைவர்களின் நாடு மக்களை உண்பதாகக் கூறும் உருவகம்
  choice: ‘உங்கள் பகைவர்களின் நாடு உங்களை விழுங்கும்’ என்று உருவகத்தைத் தக்கவைத்தல்
  alternative: ‘உங்கள் பகைவர்களின் நாடு உங்களை அழித்துவிடும்’ என்று விளக்கமாக மொழிபெயர்த்தல்
  rationale: எபிரெய மூலத்தில் ‘உண்’ என்ற வினைச்சொல் நாட்டை எழுவாயாகக் கொண்டு உருவகமாகப் பயன்படுத்தப்பட்டுள்ளது. ‘விழுங்கும்’ என்பது அதன் கடுமையையும் இலக்கியப் படிமத்தையும் காக்கிறது; அழிவு எவ்வாறு நிகழும் என்பதை மொழிபெயர்ப்பாளர் தீர்மானித்துச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன செந்தமிழுக்கு நெருக்கமான, பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘புறஜாதியார்’ போன்ற பிற்கால சமயப் பொருள்சாயல் கொண்ட சொல்லைத் தவிர்த்து, ‘பிற இனத்தார்’ பயன்படுத்தப்பட்டுள்ளது. உருவகத்தின் வலிமையை காக்க ‘விழுங்கும்’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
