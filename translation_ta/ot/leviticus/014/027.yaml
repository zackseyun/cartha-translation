  yaml_path: translation/ot/leviticus/014/027.yaml
  text: Then the priest shall sprinkle with his right finger some of the oil that is on his left palm seven times before Yahweh.
translation:
  language: ta
  text: பின்பு ஆசாரியன் தன் இடது உள்ளங்கையில் இருக்கும் எண்ணெயிலிருந்து சிறிதைத் தன் வலது கையின் விரலால் யாவேயின் முன்னிலையில் ஏழு முறை தெளிக்க வேண்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִזָּה
  choice: பின்பு ... தெளிக்க வேண்டும்
  rationale: சடங்குச் சூழலில் נזה என்பதன் ஹிஃபில் வடிவம் திரவத்தைத் தெளிப்பதைக் குறிக்கிறது. וְ தொடர்ச்சியான செயன்முறையைச் சுட்டுவதால் இயல்பான தமிழில் ‘பின்பு’ என வழங்கப்பட்டது.
- source_word: הַכֹּהֵן
  choice: ஆசாரியன்
  rationale: லேவியராகமத்தின் வழிபாட்டுச் சட்டச் சூழலில் כֹּהֵן என்பதற்கான தெளிவான, வழக்கமான தமிழ் சொல்.
- source_word: בְּאֶצְבָּעוֹ הַיְמָנִית
  choice: தன் வலது கை விரலால்
  rationale: செயல் செய்யப்படும் கருவியையும் வலப்பக்கத்தின் சிறப்பையும் காக்கிறது; எபிரெய உரையின் ஒருமையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מִן הַשֶּׁמֶן
  choice: எண்ணெயில் சிறிதை
  rationale: 'מִן இங்கு பகுதியைக் குறிக்கிறது: எண்ணெய் முழுவதையும் அல்ல, அதிலிருந்து ஒரு பகுதியை ஆசாரியன் தெளிக்கிறான்.'
- source_word: אֲשֶׁר עַל כַּפּוֹ הַשְּׂמָאלִית
  choice: தன் இடது உள்ளங்கையில் இருக்கும்
  rationale: כַּף இங்கு பொதுவாகக் ‘கை’ என்பதைவிடக் குறிப்பாக உள்ளங்கையைக் குறிக்கிறது; சடங்கின் காட்சியைத் துல்லியமாகக் காக்கிறது.
- source_word: שֶׁבַע פְּעָמִים
  choice: ஏழு முறை
  rationale: எண்ணிக்கையைக் குறிக்கும் எபிரெயச் சொற்றொடரின் இயல்பான தமிழ் வடிவம்.
- source_word: לִפְנֵי יְהוָה
  choice: யாவே முன்னிலையில்
  rationale: לִפְנֵי இங்கு வழிபாட்டுச் சூழலில் கடவுளின் முன்னிலையில் நிகழும் செயலைக் குறிக்கிறது; יְהוָה தனிப்பெயராக ஒலிபெயர்க்கப்பட்டது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரையில் நான்கு எழுத்துகளாலான உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டப்பெயராக மாற்றாமல், ‘Yahweh’ என்பதற்கு ஏற்ற தமிழ் ஒலிபெயர்ப்பாக ‘யாவே’ பயன்படுத்தப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில், வழிபாட்டுச் சட்டத்திற்கேற்ற கண்ணியமானதும் சாதாரண வாசகர்களுக்குப் புரியக்கூடியதுமான நடை. செயன்முறை வரிசை தெளிவாக இருக்க ‘பின்பு’ என்றும், கட்டளையின் சட்டத் தன்மையை வெளிப்படுத்த ‘தெளிக்க வேண்டும்’ என்றும் அமைக்கப்பட்டது.
