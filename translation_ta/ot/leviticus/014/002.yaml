  text: זֹ֤את תִּֽהְיֶה֙ תּוֹרַ֣ת הַ/מְּצֹרָ֔ע בְּ/י֖וֹם טָהֳרָת֑/וֹ וְ/הוּבָ֖א אֶל הַ/כֹּהֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/002.yaml
  text: 'This shall be the law for the leprous person on the day of his cleansing: he shall be brought to the priest[a].'
translation:
  language: ta
  text: 'தொழுநோய் போன்ற தோல் பாதிப்பு உள்ளவருக்கான சட்டம் இதுவே: அவருடைய சடங்குரீதியான தூய்மைப்படுத்துதலின் நாளில் அவர் ஆசாரியனிடம் கொண்டுவரப்பட வேண்டும்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தொழுநோய் போன்ற தோல் பாதிப்பு உள்ளவர்” என்பதற்கான எபிரெயச் சொல், צָרַעַת எனப்படும் நிலை பாதித்த ஒருவரைக் குறிக்கிறது; அது இன்றைய மருத்துவத்தில் ‘தொழுநோய்’ என்று அழைக்கப்படும் ஹான்சன் நோயை மட்டுமே குறிக்க வேண்டியதில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת תִּהְיֶה
  choice: சட்டம் இதுவே
  rationale: எபிரெயச் சட்டவாக்கியத்தின் அறிமுக அமைப்பை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: תּוֹרַת
  choice: சட்டம்
  rationale: இங்கு תּוֹרָה என்பது பொதுவான போதனையை அல்ல, விதிக்கப்பட்ட சடங்குமுறையைச் சுட்டுகிறது; ‘சட்டம்’ லேவியராகமத்தின் சட்டப் பின்னணிக்கு ஏற்றது.
- source_word: הַמְּצֹרָע
  choice: தொழுநோய் போன்ற தோல் பாதிப்பு உள்ளவர்
  rationale: מְצֹרָע என்பது צָרַעַת எனப்படும் சடங்குத் தீட்டுடன் தொடர்புடைய பாதிப்புக்குள்ளானவரைக் குறிக்கிறது; இதை இன்றைய ஹான்சன் நோயுடன் துல்லியமாக ஒப்பிடாமல், பாரம்பரியத் தொடர்பையும் பரந்த பொருளையும் காக்கிறது.
- source_word: בְּיוֹם טָהֳרָתוֹ
  choice: அவரைத் தூய்மைப்படுத்தும் நாளுக்கான
  rationale: טהר வேரின் சடங்குரீதியான தூய்மை/மீள்சேர்க்கைப் பொருளை ‘தூய்மைப்படுத்தும்’ என வெளிப்படுத்துகிறது; בְּיוֹם என்பதன் காலக் குறிப்பும் காக்கப்படுகிறது.
- source_word: וְהוּבָא
  choice: அவர் ... கொண்டுவரப்பட வேண்டும்
  rationale: ஹோஃபால் வினையின் செயப்பாட்டு வடிவத்தையும் சட்ட நடைமுறையின் கட்டாயத் தன்மையையும் காக்கிறது.
- source_word: אֶל הַכֹּהֵן
  choice: ஆசாரியனிடம்
  rationale: எபிரெய மொழியின் குறிப்பிட்ட சுட்டுருப்பை, சூழலில் சடங்கை நடத்தும் ஆசாரியனைக் குறிக்கும் ஒருமை வடிவமாகத் தருகிறது.
theological_decisions:
- issue: מְצֹרָע என்பதை வரலாற்று ‘தொழுநோய்’ சொல்லுடன் தொடர்புபடுத்துதல்
  choice: தொழுநோய் போன்ற தோல் பாதிப்பு உள்ளவர்
  alternative: தொழுநோயாளர்; தோல் நோய் உள்ளவர்
  rationale: எபிரெயச் சொல் நவீன மருத்துவத்தின் ஹான்சன் நோயை மட்டும் குறிக்காது. தேர்ந்த வடிவம் பாரம்பரியத் தொடர்பைக் காக்கும் அதேவேளையில் துல்லியமற்ற மருத்துவ அடையாளத்தைத் தவிர்த்து, ஒருவரை அவரது பாதிப்பால் மட்டுமே அடையாளப்படுத்துவதையும் தவிர்க்கிறது.
- issue: טָהֳרָתוֹ என்பதன் இயல்பு
  choice: தூய்மைப்படுத்துதல்
  alternative: குணமடைதல்; சுத்திகரித்தல்
  rationale: இப்பகுதி மருத்துவக் குணப்படுத்துதலைவிட சடங்குரீதியான தூய்மை நிலைக்கான நடைமுறையை விவரிக்கிறது; ‘தூய்மைப்படுத்துதல்’ அந்த வேறுபாட்டைக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சட்டப்பாங்கின் கண்ணியத்தைத் தக்கவைத்தபடி சாதாரண வாசகர்களுக்குப் புரியும் சொற்கள் பயன்படுத்தப்பட்டுள்ளன. ‘ஆசாரியன்’ என்பது லேவியராகமச் சூழலில் நிலைபெற்ற வேதாகமத் தமிழ் சொல்லாக வைக்கப்பட்டுள்ளது.
