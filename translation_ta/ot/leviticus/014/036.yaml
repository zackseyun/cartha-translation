base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/036.yaml
  text: Then the priest shall command that they empty the house before the priest goes in to inspect the diseased area[a], so that everything in the house may not become unclean; and afterward the priest shall go in to inspect the house.
translation:
  language: ta
  text: பின்னர் ஆசாரியன், அந்த வீட்டில் உள்ள அனைத்தையும் வெளியே எடுத்துவிடும்படி கட்டளையிட வேண்டும்; ஆசாரியன் பாதிக்கப்பட்ட இடத்தை[a] பரிசோதிக்க உள்ளே வருவதற்கு முன்பே அவ்வாறு செய்ய வேண்டும். அப்போதுதான் வீட்டிலுள்ள எதுவும் தீட்டுப்படாது. அதன் பிறகு ஆசாரியன் வீட்டைப் பரிசோதிக்க உள்ளே வர வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பாதிக்கப்பட்ட இடம்” என்பதற்குப் பதிலாக “பாதிப்பின் அடையாளம்,” “தொற்று,” அல்லது மரபுவழியாக “வாதை” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல்லான நெகா (נֶגַע), ஆசாரியனின் பரிசோதனைக்கு உட்பட்ட பாதிக்கப்பட்ட பகுதியையோ நிலையையோ குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִוָּה
  choice: பின்பு ... கட்டளையிட வேண்டும்
  rationale: சடங்கு நடைமுறையின் அடுத்த படியைக் குறிக்கும் வாவ் இணைப்பையும், சட்ட வழிமுறைக்குரிய கட்டளைத் தன்மையையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: הַכֹּהֵן
  choice: குரு
  rationale: லேவியராகமத்தின் சடங்கு மற்றும் ஆசாரியப் பணிச் சூழலில் כֹּהֵן என்பதற்கான சுருக்கமான, பொதுவாகப் புரியக்கூடிய தமிழ் சொல்.
- source_word: וּפִנּוּ אֶת הַבַּיִת
  choice: அந்த வீட்டில் உள்ளவற்றை எல்லாம் வெளியே எடுத்துவைக்கும்படி
  rationale: பன்மை வினையின் குறிப்பிடப்படாத செய்பவர்களைத் தமிழில் வெளிப்படையாகச் சேர்க்காமல், வீட்டை அதன் பொருட்களிலிருந்து காலி செய்வது என்ற பொருளைத் தெளிவாக்குகிறது.
- source_word: בְּטֶרֶם
  choice: முன்பே
  rationale: ஆய்வு தொடங்குவதற்கு முந்தைய கட்டாயமான நேர வரிசையை இயல்பாகக் காட்டுகிறது.
- source_word: לִרְאוֹת
  choice: பரிசோதிக்க
  rationale: அடிப்படைப் பொருள் ‘பார்க்க’ என்றாலும், இங்கு அதிகாரபூர்வமாக ஆராய்ந்து தீர்மானிக்கும் குருவின் செயலை ‘பரிசோதிக்க’ துல்லியமாக வெளிப்படுத்துகிறது.
- source_word: הַנֶּגַע
  choice: பாதிக்கப்பட்ட இடம்
  rationale: נֶגַע என்பது இங்கு நவீன மருத்துவ நோயறிதலை அவசியம் குறிக்காமல், ஆய்வுக்குட்படும் பாதிப்பு அல்லது அதன் அடையாளம் உள்ள பகுதியைக் குறிக்கிறது.
- source_word: וְלֹא יִטְמָא
  choice: தீட்டுப்படாமல் இருக்கும்
  rationale: வீட்டை முன்கூட்டியே காலி செய்வதன் தடுப்பு நோக்கத்தை வெளிப்படுத்துவதோடு, טמא என்பதன் சடங்குசார் அசுத்த நிலையையும் தக்கவைக்கிறது.
- source_word: כָּל אֲשֶׁר בַּבָּיִת
  choice: வீட்டிலுள்ள அனைத்தும்
  rationale: வீட்டின் உள்ளடக்கங்கள் முழுவதையும் குறிக்கும் எபிரெய சொற்றொடரைச் சுருக்கமாகவும் தெளிவாகவும் வழங்குகிறது.
- source_word: וְאַחַר כֵּן
  choice: அதன் பிறகு
  rationale: சடங்கு நடவடிக்கையின் அடுத்த கட்டத்தைத் தெளிவாகக் குறிக்கிறது.
- source_word: לִרְאוֹת אֶת הַבָּיִת
  choice: அந்த வீட்டைப் பரிசோதிக்க
  rationale: இரண்டாவது இடத்தில் ஆய்வின் பொருள் பாதிக்கப்பட்ட பகுதியிலிருந்து வீடு முழுவதுமாக விரிவடைவதைப் பாதுகாக்கிறது.
theological_decisions:
- issue: טמא என்பதன் சடங்குசார் பொருள்
  choice: தீட்டுப்படுதல்
  alternative: அசுத்தமாகுதல்; மாசுபடுதல்
  rationale: இச்சூழலில் இது ஒழுக்கக் குற்றத்தைக் காட்டிலும் சடங்குசார் அசுத்த நிலையைக் குறிக்கிறது. ‘தீட்டு’ லேவியச் சட்டச் சூழலைத் தெளிவாகத் தக்கவைக்கிறது.
- issue: வீட்டிலுள்ள பொருட்கள் தீட்டுப்படுவதைத் தடுக்கும் உட்கருத்து
  choice: ‘அப்போதுதான் ... தீட்டுப்படாமல் இருக்கும்’ என்று நோக்கத்தை வெளிப்படுத்துதல்
  alternative: ‘இல்லையெனில் ... தீட்டுப்படும்’ அல்லது ‘தீட்டுப்படாதபடிக்கு’
  rationale: וְלֹא יִטְמָא என்பதின் தடுப்பு நோக்கத்தை இயல்பான தமிழில் காட்டுகிறது; எல்லா பொருட்களும் ஏற்கெனவே தீட்டானவை என்ற கருத்தைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்ட மற்றும் சடங்கு நடைமுறைக்குரிய கண்ணியமான ஆனால் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. நீளமான எபிரெய வாக்கியம் வாசிப்புத் தெளிவுக்காக மூன்று வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறியீடு தொடர்புடைய மொழிபெயர்ப்பு மாற்றுவழிகளை விளக்கும் வகையில் வசனத்தின் முடிவில் இடப்பட்டுள்ளது.
