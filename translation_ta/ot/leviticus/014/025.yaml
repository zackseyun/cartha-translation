  text: וְ/שָׁחַט֮ אֶת כֶּ֣בֶשׂ הָֽ/אָשָׁם֒ וְ/לָקַ֤ח הַ/כֹּהֵן֙ מִ/דַּ֣ם הָֽ/אָשָׁ֔ם וְ/נָתַ֛ן עַל תְּנ֥וּךְ אֹֽזֶן הַ/מִּטַּהֵ֖ר הַ/יְמָנִ֑ית וְ/עַל בֹּ֤הֶן יָד/וֹ֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֥הֶן רַגְל֖/וֹ הַ/יְמָנִֽית־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/025.yaml
  text: Then he shall slaughter the guilt-offering lamb[a], and the priest shall take some of the blood of the guilt offering and put it on the lobe of the right ear of the one being cleansed, and on the thumb of his right hand[b], and on the big toe of his right foot.
translation:
  language: ta
  text: பின்பு அவன் குற்றநிவாரணப் பலியின் செம்மறியாட்டு குட்டியை அறுக்க வேண்டும். ஆசாரியன் குற்றநிவாரணப் பலியின் இரத்தத்திலிருந்து சிறிதை எடுத்து, தூய்மையாக்கப்படுகிறவரின் வலது காதின் மடலில்[a], அவருடைய வலது கையின் பெருவிரலில், வலது பாதத்தின் பெருவிரலில் தடவ வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வலது காதின் நுனியில்.” எபிரெயச் சொல் காதின் வெளிப்புற முனைப்பகுதியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁחַט
  choice: அறுக்க வேண்டும்
  rationale: பலியிடும் சடங்குச் சூழலில் பொதுவான ‘கொல்லுதல்’ என்பதைக் காட்டிலும் ‘அறுத்தல்’ துல்லியமானது; தொடர் நடைமுறையை ‘வேண்டும்’ வெளிப்படுத்துகிறது.
- source_word: כֶּבֶשׂ הָאָשָׁם
  choice: குற்றநிவாரணப் பலிக்கான செம்மறியாட்டுக் கடா
  rationale: செம்மறியாடு இங்கு குறிப்பிட்ட குற்றநிவாரணப் பலிக்காக நியமிக்கப்பட்ட ஆண் குட்டி; தமிழ் வாசகருக்குத் தெளிவாக உறவை வெளிப்படுத்துகிறது.
- source_word: אָשָׁם
  choice: குற்றநிவாரணப் பலி
  rationale: இது வெறும் குற்ற உணர்வை அல்ல, லேவியராகமத்தில் உள்ள குறிப்பிட்ட பலிவகையைக் குறிக்கிறது; நிவாரணம்/ஈடுசெய்தல் சார்ந்த செயல்பாட்டையும் பெயர் உணர்த்துகிறது.
- source_word: מִדַּם הָאָשָׁם
  choice: குற்றநிவாரணப் பலியின் இரத்தத்தில் சிறிதை
  rationale: מִן இங்கு பகுதியைக் குறிக்கிறது; இரத்தம் முழுவதுமல்ல, அதில் ஒரு பகுதி பயன்படுத்தப்படுவதைத் தெளிவாக்குகிறது.
- source_word: תְּנוּךְ אֹזֶן
  choice: காதின் மடல்
  rationale: காதின் வெளிப்புற முனை அல்லது நீட்சியைக் குறிக்கும் சொல்லுக்கு இயல்பான தமிழ் உடற்கூறு இணை இது; மாற்று பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: הַמִּטַּהֵר
  choice: தூய்மைப்படுத்தப்பட்டு வருகிறவர்
  rationale: ஹித்பயேல் நிகழ்காலப் பெயரெச்சம், தூய்மைப்படுத்தும் நடைமுறைக்கு உட்பட்டு வருகிற நபரைச் சுட்டுகிறது; செயல் இன்னும் நடைபெறுவதைப் பாதுகாக்கிறது.
- source_word: בֹּהֶן יָדוֹ
  choice: அவருடைய வலது கையின் பெருவிரல்
  rationale: கையோடு வரும்போது בֹּהֶן கட்டைவிரலைக் குறிக்கிறது; பொதுத் தமிழில் ‘பெருவிரல்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: בֹּהֶן רַגְלוֹ
  choice: வலது காலின் பெருவிரல்
  rationale: காலோடு வரும்போது בֹּהֶן பெருவிரலைக் குறிக்கிறது.
- source_word: הַכֹּהֵן
  choice: ஆசாரியன்
  rationale: இஸ்ரவேலின் பலிச் சடங்கை நடத்தும் cultic officiant என்பதற்கான நிலைபெற்ற, புரிந்துகொள்ளத்தக்க தமிழ் சொல்.
- source_word: וְ
  choice: பின்பு / -உம்
  rationale: மீண்டும் வரும் waw சடங்குச் செயல்களின் தொடரை இணைக்கிறது; முதலில் ‘பின்பு’ என்றும் பின்னர் இணைப்பும்மைகளாலும் இயல்பான தமிழில் வெளிப்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: אָשָׁם என்ற பலியியல் சொல்லின் மொழிபெயர்ப்பு
  choice: குற்றநிவாரணப் பலி
  alternative: குற்றப்பலி / ஈடுசெய்யும் பலி
  rationale: இது லேவியராகமத்தின் ஒரு குறிப்பிட்ட பலிவகை. ‘குற்றநிவாரணப் பலி’ என்பது வெறும் உள்ளார்ந்த குற்ற உணர்வாக மாற்றாமல், குற்றத்துடன் தொடர்புடைய சடங்கு நிவாரணத்தைத் தெரிவிக்கிறது; ‘ஈடுசெய்யும் பலி’ என்ற மொழிபெயர்ப்பு அதன் இழப்பீட்டுக் கூறை வலுப்படுத்தினாலும் எல்லா சூழல்களிலும் ஒரே அளவு இயல்பாக இல்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சடங்கு நடைமுறைக்கேற்ற கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ஒரே நீண்ட எபிரெய வாக்கியம் வாசிப்புத் தெளிவுக்காக இரண்டு தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது. பாலினத்தைத் தேவையின்றி மீண்டும் வலியுறுத்தாமல் மரியாதை ஒருமை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன.
