source:
  edition: WLC
  text: וְ/הָיָה֩ בַ/יּ֨וֹם הַ/שְּׁבִיעִ֜י יְגַלַּ֣ח אֶת כָּל שְׂעָר֗/וֹ אֶת רֹאשׁ֤/וֹ וְ/אֶת זְקָנ/וֹ֙ וְ/אֵת֙ גַּבֹּ֣ת עֵינָ֔י/ו וְ/אֶת כָּל שְׂעָר֖/וֹ יְגַלֵּ֑חַ וְ/כִבֶּ֣ס אֶת בְּגָדָ֗י/ו וְ/רָחַ֧ץ אֶת בְּשָׂר֛/וֹ בַּ/מַּ֖יִם וְ/טָהֵֽר־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/009.yaml
  text: 'And on the seventh day he shall shave off all his hair: his head[a], his beard, and his eyebrows. He shall shave off all his hair, wash his clothes, and bathe his body in water; then he shall be clean.'
translation:
  language: ta
  text: ஏழாம் நாளில் அவன் தன் எல்லா முடிகளையும், அதாவது அவன் தலைமுடி, தாடி, புருவங்கள் ஆகியவற்றை, மழிக்க வேண்டும். அவன் தன் எல்லா முடிகளையும் மழித்து, தன் உடைகளைக் கழுவி, தன் உடலை[a] தண்ணீரில் கழுவ வேண்டும்; அப்போது அவன் சுத்தமாவான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “தன் சதையைத் தண்ணீரில் கழுவ வேண்டும்” என்று உள்ளது; இச்சூழலில் இது அவனுடைய உடலைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בַיּוֹם הַשְּׁבִיעִי
  choice: ஏழாம் நாளில்
  rationale: சடங்கின் அடுத்த கட்டத்தை அறிமுகப்படுத்தும் எபிரேயத் தொடரின் காலப்பொருளை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: יְגַלַּח אֶת כָּל שְׂעָרוֹ
  choice: தன் உடலிலுள்ள முடி அனைத்தையும் மழித்துக்கொள்ள வேண்டும்
  rationale: முடியை முழுமையாக அகற்ற வேண்டும் என்ற פיעל வினையின் பொருளையும் כָּל என்பதன் முழுமையையும் தெளிவாகக் காட்டுகிறது.
- source_word: רֹאשׁוֹ וְאֶת זְקָנוֹ וְאֵת גַּבֹּת עֵינָיו
  choice: தன் தலைமுடி, தாடி, புருவங்கள்
  rationale: ரֹאשׁוֹ என்பது சொற்படியாக ‘அவனுடைய தலை’ என்றாலும், மழிக்கும் சூழலில் தமிழில் ‘தலைமுடி’ என்பதே இயல்பும் தெளிவும் உடையது; மற்ற உடற்பகுதிகள் நேரடியாக மொழிபெயர்க்கப்பட்டுள்ளன.
- source_word: וְאֶת כָּל שְׂעָרוֹ יְגַלֵּחַ
  choice: இவ்வாறு தன் முடி அனைத்தையும் மழித்த பின்பு
  rationale: முழுமையை வலியுறுத்தும் மூலத்தின் மறுபடியுரைத்தலைக் காக்கிறது; அதேவேளை தமிழில் இயல்பான தொடர்ச்சியை அளிக்கிறது.
- source_word: וְכִבֶּס אֶת בְּגָדָיו
  choice: தன் உடைகளைக் கழுவி
  rationale: כבס என்பதன் ஆடை கழுவுதல் என்ற வழக்கமான பொருளை எளிய நவீனத் தமிழில் தருகிறது.
- source_word: וְרָחַץ אֶת בְּשָׂרוֹ בַּמָּיִם
  choice: தன் உடலைத் தண்ணீரில் குளிப்பாட்ட வேண்டும்
  rationale: בשר என்பதன் சொற்பொருள் ‘சதை’ என்றாலும் இச்சடங்கு சூழலில் முழு உடலைக் குறிக்கிறது; ‘உடல்’ என்பது இயல்பான தமிழாக்கம், ‘தண்ணீரில்’ மூலத்தின் முன்னிடைச்சொல் உறவைப் பேணுகிறது.
- source_word: וְטָהֵר
  choice: அப்போது அவன் சுத்தமாவான்
  rationale: செயல்களின் விளைவாக ஏற்படும் சடங்குசார் தூய்மை நிலையைத் தருகிறது; ‘அப்போது’ தொடர்விளைவைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: சடங்குசார் தூய்மைச் சொல்
  choice: சுத்தமாவான்
  alternative: தூய்மையாவான்; சுத்திகரிக்கப்படுவான்
  rationale: טהר இங்கு ஒழுக்கக் குற்றமின்மையைக் காட்டாமல் சடங்குசார் நிலையைச் சுட்டுகிறது. ‘சுத்தமாவான்’ என்பது நிலைமாற்றத்தை எளிய தமிழில் காட்டுகிறது; ‘சுத்திகரிக்கப்படுவான்’ என்பது மூலத்தில் இல்லாத செயப்பாட்டு நுணுக்கத்தைச் சேர்க்கக்கூடும்.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பாகவும், லேவியராகமச் சடங்கு மொழிக்கேற்ற கண்ணியத்துடனும் அமைக்கப்பட்டது. மூலத்தின் முழுமை வலியுறுத்தும் மறுபடியுரை பொருளளவில் காக்கப்பட்டுள்ளது.
