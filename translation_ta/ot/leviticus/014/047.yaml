  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/הַ/שֹּׁכֵ֣ב בַּ/בַּ֔יִת יְכַבֵּ֖ס אֶת בְּגָדָ֑י/ו וְ/הָ/אֹכֵ֣ל בַּ/בַּ֔יִת יְכַבֵּ֖ס אֶת בְּגָדָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/047.yaml
  text: And whoever lies down in the house shall wash his clothes[b][a], and whoever eats in the house shall wash his clothes.
translation:
  language: ta
  text: அந்த வீட்டில் படுத்துக்கொள்கிறவர் தன் உடைகளைக் கழுவ வேண்டும்[a]; அந்த வீட்டில் சாப்பிடுகிறவரும் தன் உடைகளைக் கழுவ வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அந்த வீட்டில் தூங்குகிறவர்.’ எபிரெய வினைச்சொல் ‘படுத்துக்கொள்’ அல்லது ‘தூங்கு’ என்று பொருள்படலாம்; சட்டச் சூழலுக்கு ஏற்ற பரந்த பொருளாக ‘படுத்துக்கொள்’ பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַשֹּׁכֵב
  choice: படுத்துக்கொள்கிறவர்
  rationale: குறிப்பிட்ட வினையெச்ச வடிவம் பொதுவான சட்டப் பொருளில் ‘படுத்துக்கொள்கிறவர்’ என ஒருவரைக் குறிக்கிறது. שׁכב என்பது தூங்குவதை மட்டும் அல்லாமல் பொதுவாகப் படுத்துக்கொள்வதையும் குறிக்கலாம்; ஆகவே பரந்த பொருள் பாதுகாக்கப்படுகிறது.
- source_word: בַּבַּיִת
  choice: அந்த வீட்டில்
  rationale: எபிரெய மொழியிலுள்ள குறிப்பிட்ட ‘வீட்டில்’ என்ற இடப்பொருளை இயல்பான தமிழில் தருகிறது; முந்தைய சூழலில் விவரிக்கப்பட்ட வீட்டையே குறிக்கிறது.
- source_word: יְכַבֵּס
  choice: கழுவ வேண்டும்
  rationale: ஆசாரியச் சட்டச் சூழலில் இந்த imperfect வடிவம் கடமையை வெளிப்படுத்துகிறது. ‘வேண்டும்’ என்பது நவீன தமிழில் தெளிவான சட்டக் கட்டளையை இயல்பாகக் காட்டுகிறது.
- source_word: אֶת־בְּגָדָיו
  choice: தன் உடைகளை
  rationale: בֶּגֶד என்பதற்கு நவீன தமிழில் ‘உடைகள்’ தெளிவும் இயல்பும் உடையது. எழுவாயையே திரும்பக் குறிக்கும் உடைமைப் பொருளை ‘தன்’ துல்லியமாக வழங்குகிறது; தமிழில் இது பாலின வேறுபாடின்றி இயங்குகிறது.
- source_word: וְהָאֹכֵל
  choice: சாப்பிடுகிறவரும்
  rationale: இது பொதுவான சட்டப் பொருளுடைய பெயர்ச்செயல்பாட்டு வினையெச்சம். இணைப்பிலுள்ள וְ என்பதையும் இரண்டாவது இணையான விதியையும் தமிழின் இயல்பான ‘-உம்’ வடிவம் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: சட்ட அறிவுறுத்தலில் பொதுப்பொருளுடைய ஆண்பால் ஒருமை வடிவங்கள்
  choice: ‘படுத்துக்கொள்கிறவர் ... தன் உடைகள்’ என்றும் ‘சாப்பிடுகிறவர் ... தன் உடைகள்’ என்றும் மொழிபெயர்த்தல்
  alternative: ஆண்பாலை வெளிப்படையாகக் காட்டி ‘அவன் உடைகள்’ என மொழிபெயர்த்தல்
  rationale: எபிரெய வடிவங்கள் இலக்கணப்படி ஆண்பால் ஒருமையாக இருந்தாலும், இங்கு அவை பிரதிநிதித்துவமான பொதுச் சட்டப் பொருளைக் கொண்டவை. தமிழின் ‘-கிறவர்’ மற்றும் ‘தன்’ வடிவங்கள் ஒருமையையும் பொதுவான வரம்பையும் இயல்பாகத் தக்கவைக்கின்றன; ஆண்களுக்கு மட்டும் விதி கட்டுப்படுகிறது என்ற தவறான எண்ணத்தையும் உருவாக்குவதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் தெளிவான, கண்ணியமான சட்ட நடையைக் கொண்ட மொழிபெயர்ப்பு. ‘கழுவ வேண்டும்’ கடமையை நேரடியாகத் தெரிவிக்கிறது; ‘உடைகள்’ சாதாரண வாசகர்களுக்கு ‘வஸ்திரங்கள்’ என்பதைக் காட்டிலும் இயல்பானது.
