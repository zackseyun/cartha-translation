  text: And on the eighth day he shall take two male lambs without blemish[a], and one ewe lamb a year old without blemish, and three-tenths of an ephah of fine flour as a grain offering mixed with oil, and one log of oil.
translation:
  language: ta
  text: எட்டாம் நாளில் அவன் குறைபாடற்ற இரண்டு ஆண் செம்மறியாட்டுக் குட்டிகளையும், ஒரு வயதுடைய குறைபாடற்ற ஒரு பெண் செம்மறியாட்டுக் குட்டியையும், எண்ணெயுடன் கலந்த நுண்ணிய மாவில் ஒரு எப்பாவின் பத்தில் மூன்று பங்கைத் தானியக் காணிக்கையாகவும், ஒரு லோகு[a] எண்ணெயையும் எடுத்துக்கொள்ள வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘லோகு’ என்பது இஸ்ரவேலரின் சடங்கு வழக்கில் பயன்படுத்தப்பட்ட ஒரு சிறிய திரவ அளவை.
    reason: cultural_note
lexical_decisions:
- source_word: וּבַיּוֹם הַשְּׁמִינִי
  choice: எட்டாம் நாளில்
  rationale: சடங்கு வழிமுறையின் தொடர்ச்சியைச் சூழல் தெளிவாக்குவதால், தமிழில் இயல்பாக ‘எட்டாம் நாளில்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: יִקַּח
  choice: எடுத்துக்கொள்ள வேண்டும்
  rationale: சட்டவழிகாட்டல் சூழலில் இந்த வினை கட்டளையின் வலிமையைக் கொண்டிருப்பதால், நவீன தமிழில் கடமையைத் தெளிவாகக் காட்டும் வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- source_word: שְׁנֵי כְבָשִׂים
  choice: இரண்டு ஆண் செம்மறியாட்டுக் குட்டிகள்
  rationale: அடுத்ததாக வரும் பெண்பால் விலங்கிலிருந்து உள்ள வேறுபாட்டைப் பாதுகாக்க ‘ஆண்’ வெளிப்படையாகக் கூறப்பட்டுள்ளது; செம்மறியாட்டுக் குட்டி எனக் குறிப்பிடுவது வெள்ளாட்டுடன் குழப்பம் ஏற்படாமல் செய்கிறது.
- source_word: תְּמִימִים / תְּמִימָה
  choice: பழுதற்ற
  rationale: பலிக்குரிய விலங்குகளில் உடற்குறை அல்லது குறைபாடு இல்லாத தன்மையைக் குறிக்கும் வழிபாட்டுச் சூழலுக்கேற்ற தெளிவான தமிழ் சொல்.
- source_word: וְכַבְשָׂה אַחַת בַּת שְׁנָתָהּ
  choice: ஒரு வயதுடைய பழுதற்ற ஒரு பெண் செம்மறியாட்டுக் குட்டி
  rationale: பெண்பாலும் வயது நிபந்தனையும் இரண்டையும் வெளிப்படையாகப் பாதுகாக்கிறது.
- source_word: וּשְׁלֹשָׁה עֶשְׂרֹנִים
  choice: ஒரு எப்பாவில் பத்தில் மூன்று பங்கு
  rationale: עִשָּׂרוֹן என்பது வழக்கமாக எப்பாவின் பத்தில் ஒரு பங்கைக் குறிக்கும்; மூன்று அலகுகளை வாசகருக்குப் புரியும் வகையில் முழுமையாகக் கூறுகிறது.
- source_word: סֹלֶת מִנְחָה בְּלוּלָה בַשֶּׁמֶן
  choice: எண்ணெயுடன் கலந்த ... நைசான மாவைத் தானியக் காணிக்கையாக
  rationale: மெல்ல அரைக்கப்பட்ட மாவு, எண்ணெயுடன் கலக்கப்படுதல், அதன் காணிக்கைப் பயன்பாடு ஆகிய மூன்றையும் இயல்பான தமிழ் சொற்றொடரில் காக்கிறது.
- source_word: וְלֹג אֶחָד שָׁמֶן
  choice: ஒரு லோகு எண்ணெய்
  rationale: லோகு என்பது குறிப்பிட்ட இஸ்ரவேலிய திரவ அளவைச் சுட்டுவதால், துல்லியமற்ற நவீன அளவாக மாற்றாமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
