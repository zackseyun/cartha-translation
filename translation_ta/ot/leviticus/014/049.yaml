  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/לָקַ֛ח לְ/חַטֵּ֥א אֶת הַ/בַּ֖יִת שְׁתֵּ֣י צִפֳּרִ֑ים וְ/עֵ֣ץ אֶ֔רֶז וּ/שְׁנִ֥י תוֹלַ֖עַת וְ/אֵזֹֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/049.yaml
  text: And he shall take, to purify the house from sin, two birds, cedar wood, scarlet yarn, and hyssop.
translation:
  language: ta
  text: அந்த வீட்டைச் சுத்திகரிப்பதற்காக[a] அவர் இரண்டு பறவைகளையும், கேதுரு மரப்பொருளையும், செந்நிற நூலையும்[b], ஈசோப்பையும் எடுத்துக்கொள்ள வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்த வீட்டைத் தூய்மைப்படுத்துவதற்காக.” இச்சடங்குச் சூழலில் எபிரெய வினை தீட்டு அல்லது பாவத்துடன் தொடர்புடைய சடங்கியல் மாசை அகற்றிச் சுத்திகரிப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “செந்நிற இழை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: அவர் எடுத்துக்கொள்ள வேண்டும்
  rationale: சடங்கு வழிமுறையின் தொடரில் வரும் இணைப்புடன் கூடிய வினை வடிவத்தின் கட்டளைசார் பொருளை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: לְחַטֵּא אֶת הַבַּיִת
  choice: அந்த வீட்டைத் தூய்மைப்படுத்துவதற்காக
  rationale: இங்கு பியேல் வடிவம் ஒழுக்கரீதியான பாவமன்னிப்பை அல்ல, தீட்டிலிருந்து சடங்குரீதியாகத் தூய்மைப்படுத்துவதைக் குறிக்கிறது. 'பாவத்திலிருந்து' என்று சேர்ப்பது எபிரெயச் சொல்லை அளவுக்கு மீறி விரிவாக்கும் என்பதால், மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: שְׁתֵּי צִפֳּרִים
  choice: இரண்டு பறவைகள்
  rationale: எபிரெய மூலத்தில் இவ்வசனத்தில் உள்ள அளவையே வழங்குகிறது; அருகிலுள்ள சூழலிலிருந்து 'உயிருள்ள' என்பதைச் சேர்க்கவில்லை.
- source_word: וְעֵץ אֶרֶז
  choice: கேதுரு மரக்கட்டை
  rationale: சடங்கில் பயன்படுத்தப்படும் கேதுரு மரப்பொருளைக் குறிக்கும் இணைப்பைத் தெளிவாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: וּשְׁנִי תוֹלַעַת
  choice: செந்நிற நூல்
  rationale: சடங்கில் பயன்படுத்தப்படும் செந்நிறச் சாயமிட்ட நூற்பொருளைக் குறிக்கும் இயல்பான தமிழ்; 'செந்நிற இழை' என்பது சாத்தியமான மாற்று.
- source_word: וְאֵזֹב
  choice: ஈசோப்பு
  rationale: தாவரத்தின் துல்லியமான அடையாளம் விவாதத்திற்குரியதாயினும், אֵזוֹב என்பதற்கான பரவலாக அறியப்பட்ட மரபுவழிப் பெயரைப் பாதுகாக்கிறது.
theological_decisions:
- issue: வீட்டைச் செயப்படுபொருளாகக் கொண்ட לְחַטֵּא என்பதன் சடங்கியல் பொருள்
  choice: வீட்டைத் தூய்மைப்படுத்துதல்
  alternative: வீட்டைப் பாவத்திலிருந்து தூய்மைப்படுத்துதல்; வீட்டிற்காகப் பாவநிவிர்த்தி செய்தல்
  rationale: லேவியராகமம் 14-ன் சூழல் தீட்டுப்பட்ட வீட்டுக்கான சுத்திகரிப்புச் சடங்கு. இவ்வினை தீட்டு அல்லது பாவக் கறையை அகற்றும் சடங்கியல் கருத்தைக் கொண்டிருந்தாலும், இவ்வசனம் மட்டும் வெளிப்படையாகக் கூறாத பாவநிவிர்த்தி முறையை மொழிபெயர்ப்பில் சேர்க்காமல் அதன் பொருள் இழுவிசையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான சடங்கு வழிமுறை நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. பட்டியலின் செயப்படுபொருள் அமைப்பைத் தெளிவுபடுத்த தமிழின் இயல்புக்கு ஏற்ப வேற்றுமை உருபுகள் பயன்படுத்தப்பட்டுள்ளன.
