- from: அந்த வீட்டைத் தூய்மைப்படுத்துவதற்காக[a] அவர் இரண்டு பறவைகளையும், கேதுரு மரக்கட்டையையும், செந்நிற நூலையும்[b], ஈசோப்பையும் எடுத்துக்கொள்ள வேண்டும்.
  to: அந்த வீட்டைச் சுத்திகரிப்பதற்காக[a] அவர் இரண்டு பறவைகளையும், கேதுரு மரப்பொருளையும், செந்நிற நூலையும்[b], ஈசோப்பையும் எடுத்துக்கொள்ள வேண்டும்.
