source:
  edition: WLC
  text: וְ/לָקַ֨ח הַ/כֹּהֵ֜ן אֶת הַ/כֶּ֣בֶשׂ הָ/אֶחָ֗ד וְ/הִקְרִ֥יב אֹת֛/וֹ לְ/אָשָׁ֖ם וְ/אֶת לֹ֣ג הַ/שָּׁ֑מֶן וְ/הֵנִ֥יף אֹתָ֛/ם תְּנוּפָ֖ה לִ/פְנֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/012.yaml
  text: Then the priest shall take the one male lamb and present it as a guilt offering[a], along with the log of oil[b], and he shall wave them as a wave offering before Yahweh.
translation:
  language: ta
  text: பின்பு ஆசாரியன் அந்த ஒரு ஆண் செம்மறியாட்டுக்குட்டியையும் எண்ணெயின் ஒரு லோக் அளவையும் எடுத்து, அந்த ஆட்டுக்குட்டியை குற்றநிவாரணப் பலியாக[a] சமர்ப்பித்து, அவற்றை யாவேவின் முன்னிலையில் அசைவாட்டுக் காணிக்கையாக அசைக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஈடுசெய்யும் பலியாக’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: பின்பு ... எடுத்து
  rationale: வாவ் இணைப்புடன் வந்த வினைச்சொல் சடங்கின் அடுத்த கட்டத்தைத் தொடர்கிறது; ‘பின்பு’ நடைமுறை வரிசையை இயல்பான தமிழில் காட்டுகிறது.
- source_word: הַכֹּהֵן
  choice: ஆசாரியன்
  rationale: லேவியராகமத்தின் வழிபாட்டுச் சூழலில் כֹּהֵן என்பதற்கான தெளிவான, பரவலாக அறியப்பட்ட தமிழ் சொல்.
- source_word: הַכֶּבֶשׂ הָאֶחָד
  choice: அந்த ஓர் ஆண் செம்மறியாட்டுக்குட்டி
  rationale: குறிப்புச் சுட்டியும் ‘ஒன்று’ என்ற எண்ணும் குறிப்பிட்ட விலங்கை மற்றவற்றிலிருந்து வேறுபடுத்துகின்றன; כֶּבֶשׂ பலிச்சூழலில் ஆண் செம்மறியாட்டுக்குட்டியைக் குறிக்கிறது.
- source_word: וְהִקְרִיב אֹתוֹ
  choice: அதைக் ... கொண்டுவந்து
  rationale: הקריב என்பது பலியிடுவதற்கு அண்மையில் கொண்டுவருதல் அல்லது சமர்ப்பித்தலைக் குறிக்கிறது. அடுத்துவரும் தனிப்பட்ட சடங்குச் செயலை முன்கூட்டியே மிகையாக வரையறுக்காமல் ‘கொண்டுவந்து’ என்பது இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לְאָשָׁם
  choice: குற்றநிவாரணப் பலியாக
  rationale: אָשָׁם என்பது லேவியராகமத்தில் குற்றத்தோடும் அதற்கான ஈடுசெய்தலோடும் தொடர்புடைய தொழில்நுட்பப் பலிச்சொல்.
- source_word: לֹג הַשָּׁמֶן
  choice: ஒரு லோக் எண்ணெய்
  rationale: לֹג என்பது குறிப்பிட்ட சிறிய திரவ அளவை; துல்லியமற்ற நவீன அளவாக மாற்றாமல் அதன் பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְהֵנִיף אֹתָם תְּנוּפָה
  choice: அவற்றை ... அசைவாட்டுக் காணிக்கையாக அசைவாட்ட வேண்டும்
  rationale: வினைச்சொல்லும் அதனோடு தொடர்புடைய தொழில்நுட்பப் பெயர்ச்சொல்லும் எபிரேயத்தில் உள்ள சடங்குசார் அசைவாட்டலை வலியுறுத்துகின்றன; தமிழிலும் இரண்டும் பாதுகாக்கப்பட்டுள்ளன.
- source_word: לִפְנֵי יְהוָה
  choice: யாவே முன்னிலையில்
  rationale: לִפְנֵי என்பது சடங்கு நடைபெறும் தெய்வீக முன்னிலையைக் குறிக்கிறது; יהוה என்ற உடன்படிக்கைப் பெயர் ‘யாவே’ என நேரடியாக வழங்கப்பட்டுள்ளது.
theological_decisions:
- issue: אָשָׁם என்ற பலியின் பொருள்
  choice: குற்றநிவாரணப் பலி
  alternative: ஈடுசெய்யும் பலி
  rationale: இந்தச் சொல் குற்றத்தைக் குறித்தாலும் பல இடங்களில் ஈடுசெய்தல் என்ற அம்சத்தையும் கொண்டுள்ளது. முதன்மை உரையில் வழக்கமான தொழில்நுட்பப் பெயர் வைக்கப்பட்டு, மாற்று நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரையில் நான்கெழுத்து உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது; அதை ஒரு பட்டப்பெயராக மாற்றாமல் தமிழில் ஒலிபெயர்த்துள்ளது.
- issue: תְּנוּפָה சடங்கின் தன்மை
  choice: அசைவாட்டுக் காணிக்கை
  alternative: சமர்ப்பணக் காணிக்கை
  rationale: மூல வினைச்சொல் அசைவாட்டும் செயலைத் தெளிவாகக் குறிக்கிறது. அதன் திசையையோ சரியான அசைவுமுறையையோ உரை கூறாததால் அவை சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான சட்ட-சடங்கு நடை பயன்படுத்தப்பட்டுள்ளது. ‘லோக்’, ‘குற்றநிவாரணப் பலி’, ‘அசைவாட்டுக் காணிக்கை’ ஆகிய தொழில்நுட்பச் சொற்கள் மூலத்தின் சடங்குசார் துல்லியத்தைப் பாதுகாக்கின்றன; அறிமுகமற்ற அளவுச் சொல்லுக்கு அடிக்குறிப்பு தரப்பட்டுள்ளது.
