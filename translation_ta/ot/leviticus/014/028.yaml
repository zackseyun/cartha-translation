source:
  edition: WLC
  text: וְ/נָתַ֨ן הַ/כֹּהֵ֜ן מִן הַ/שֶּׁ֣מֶן אֲשֶׁ֣ר עַל כַּפּ֗/וֹ עַל תְּנ֞וּךְ אֹ֤זֶן הַ/מִּטַּהֵר֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֤הֶן יָד/וֹ֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֥הֶן רַגְל֖/וֹ הַ/יְמָנִ֑ית עַל מְק֖וֹם דַּ֥ם הָ/אָשָֽׁם־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/028.yaml
  text: And the priest shall put some of the oil that is on his palm on the lobe of the right ear of the one being cleansed[a], and on the thumb of his right hand, and on the big toe of his right foot, on the place of the guilt-offering blood.
translation:
  language: ta
  text: ஆசாரியன் தன் உள்ளங்கையில் உள்ள எண்ணெயில் சிறிதை எடுத்து, தூய்மைப்படுத்தப்படுகிறவரின் வலது காதுமடலிலும், அவரது வலது கையின் பெருவிரலிலும், அவரது வலது காலின் பெருவிரலிலும், குற்றநிவாரணப் பலியின் இரத்தம் பூசப்பட்ட இடங்களிலேயே பூச வேண்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנָתַן
  choice: பூச வேண்டும்
  rationale: נתן என்பதன் அடிப்படைப் பொருள் ‘கொடு/வை’ என்றாலும், உடல் உறுப்புகளில் எண்ணெயைப் பயன்படுத்தும் இந்தச் சடங்குச் சூழலில் ‘பூச வேண்டும்’ என்பது செயலை இயல்பாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: מִן הַשֶּׁמֶן
  choice: எண்ணெயில் சிறிதை
  rationale: பகுதிப்பொருளைக் குறிக்கும் מִן, மொத்த எண்ணெயிலிருந்து ஒரு பகுதியை எடுத்துப் பயன்படுத்துவதைச் சுட்டுவதால் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: אֲשֶׁר עַל כַּפּוֹ
  choice: தன் உள்ளங்கையில் இருக்கும்
  rationale: כַּף இங்கு ஆசாரியனின் உள்ளங்கையைக் குறிக்கிறது; עַל என்பதையும் தமிழில் இயல்பாக ‘இருக்கும்’ என்று வெளிப்படுத்துகிறது.
- source_word: תְּנוּךְ אֹזֶן
  choice: காதின் மடல்
  rationale: ஆசாரியச் சடங்குச் சூழலில் תְּנוּךְ காதுமடலைக் குறிப்பதாகப் புரிந்துகொள்ளப்படுகிறது; இது நவீனத் தமிழில் தெளிவான உடற்கூறியல் சொல்.
- source_word: הַמִּטַּהֵר
  choice: தூய்மைப்படுத்தப்பட்டுக்கொண்டிருப்பவர்
  rationale: ஹித்பயேல் நிகழ்காலப் பங்கேற்புவினை, சடங்குத் தூய்மைப்படுத்தும் செயல்முறைக்கு உட்பட்டவரைக் குறிக்கிறது; முடிவுற்ற நிலையாக மாற்றாமல் செயல்முறைத் தன்மை பாதுகாக்கப்பட்டது.
- source_word: הַיְמָנִית
  choice: வலது
  rationale: மூன்று உடல் உறுப்புகளுக்கும் உரிய பக்கத்தை இயல்பான தமிழில் துல்லியமாகக் குறிக்கிறது.
- source_word: בֹּהֶן יָדוֹ
  choice: அவரது வலது கையின் பெருவிரல்
  rationale: בֹּהֶן கையில் வரும்போது கட்டைவிரலைக் குறிக்கிறது; பொதுமக்கள் எளிதில் புரிந்துகொள்ளும் ‘பெருவிரல்’ பயன்படுத்தப்பட்டது.
- source_word: בֹּהֶן רַגְלוֹ
  choice: அவரது வலது காலின் பெருவிரல்
  rationale: காலில் בֹּהֶן என்பது பெரிய கால் விரலைக் குறிக்கிறது; ‘காலின் பெருவிரல்’ தெளிவும் இயல்பும் உடையது.
- source_word: עַל מְקוֹם דַּם הָאָשָׁם
  choice: குற்றநிவாரணப் பலியின் இரத்தம் பூசப்பட்ட இடத்தின்மேல்
  rationale: முன்னைய சடங்கு நடவடிக்கையைக் கருத்தில் கொண்டு מְקוֹם דַּם என்பதைக் ‘இரத்தம் பூசப்பட்ட இடம்’ என்று இயல்பாக வெளிப்படுத்துகிறது; אָשָׁם என்பதற்கான பலிவகையும் வெளிப்படையாக வைக்கப்பட்டுள்ளது.
theological_decisions:
- issue: אָשָׁם என்ற பலிவகையின் மொழிபெயர்ப்பு
  choice: குற்றநிவாரணப் பலி
  alternative: குற்றப்பரிகாரப் பலி / இழப்பீட்டுப் பலி
  rationale: אָשָׁם குற்றத்தையும் அதனுடன் தொடர்புடைய நிவாரணம் அல்லது ஈடுசெய்தலையும் உள்ளடக்கலாம். ‘குற்றநிவாரணப் பலி’ என்பது எந்த ஒரு தனிப்பட்ட கோட்பாட்டையும் திணிக்காமல், லேவியராகமத்தின் தனித்த பலிவகையைத் தெளிவாகக் குறிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சடங்குச் செயலை சாதாரண வாசகர் தெளிவாகப் புரிந்துகொள்ளும் வகையில் dignified உரைநடை பயன்படுத்தப்பட்டது. எபிரேய வாக்கியத்தின் தொடர்ச்சியான உடல் உறுப்புப் பட்டியல் பாதுகாக்கப்பட்டது; தேவையற்ற சமயவியல் விளக்கம் சேர்க்கப்படவில்லை.
