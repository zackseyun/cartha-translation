lexical_decisions:
- source_word: וּ/מִן
  choice: பின்பு ... இலிருந்து
  rationale: וְ தொடரும் சடங்கு நடவடிக்கையைச் சுட்டுவதால் இயல்பான தமிழில் ‘பின்பு’ எனவும், מִן மூலத்தைச் சுட்டுவதால் ‘இலிருந்து’ எனவும் மொழிபெயர்க்கப்பட்டது. ‘கொஞ்சம்’ என்பது சூழலில் மறைமுகமாக இருந்தாலும் மூலத்தில் வெளிப்படையாக இல்லை.
- source_word: הַ/שֶּׁמֶן
  choice: அந்த எண்ணெய்
  rationale: குறிப்பிட்ட முன்-சூழல் எண்ணெயைக் குறிக்கும் வரையறைச் சுட்டை தமிழில் ‘அந்த’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יִצֹק
  choice: ஊற்ற வேண்டும்
  rationale: சடங்கு விதிமுறையில் வரும் yiqtol கட்டளை/வழிமுறைப் பொருளை நவீன தமிழில் ‘வேண்டும்’ தெளிவாகக் காட்டுகிறது.
- source_word: הַ/כֹּהֵן
  choice: ஆசாரியன்
  rationale: லேவியராகமத்தின் சடங்கு மற்றும் சட்டச் சூழலில் כֹּהֵן என்பதற்கான வழக்கமான, புரிந்துகொள்ளத்தக்க தமிழ் சொல்.
- source_word: עַל
  choice: இல்
  rationale: ஊற்றப்படும் பொருள் வந்து சேரும் மேற்பரப்பைத் தமிழில் ‘உள்ளங்கையில் ஊற்ற’ என்ற இயல்பான கட்டமைப்பு காட்டுகிறது.
- source_word: כַּף
  choice: உள்ளங்கை
  rationale: כַּף இங்கு கையைப் பொதுவாக அல்லாமல் அதன் உள்ளங்கை அல்லது குழிவான பகுதியைக் குறிப்பதால் ‘உள்ளங்கை’ துல்லியமானது.
- source_word: הַ/כֹּהֵן הַ/שְּׂמָאלִית
  choice: தன் இடது உள்ளங்கை
  rationale: எபிரெய மொழியின் சொற்படி மீளுரையை இயல்பான தமிழில் தற்சுட்டுப் பெயரால் வெளிப்படுத்தி, எண்ணெயை ஊற்றும் ஆசாரியனுடைய இடது உள்ளங்கையே குறிக்கப்படுவதைத் தெளிவாக்குகிறது.
