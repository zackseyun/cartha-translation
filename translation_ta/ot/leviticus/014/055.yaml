base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/055.yaml
  text: and for a skin disease in a garment or in a house,[a]
translation:
  language: ta
  text: உடையிலும் வீட்டிலும் ஏற்படும் சாராத் பாதிப்புக்கும்,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சாராத் (tsaraʿat). இது மரபாக ‘தொழுநோய்’ என்று மொழிபெயர்க்கப்பட்டாலும், லேவியராகமத்தில் மனிதரின் தோல் மட்டுமல்லாமல் உடைகள் மற்றும் வீடுகளில் காணப்படும் பலவகைப் பாதிப்புகளையும் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְ
  choice: …க்கும்
  rationale: இணைப்பிடைச்சொல்லும் முன்னிடைச்சொல்லும் முந்தைய வசனங்களில் தொடங்கிய பட்டியலைத் தொடர்கின்றன. தமிழில் ‘…க்கும்’ என்பது அந்தப் பட்டியல் அமைப்பை இயல்பாகத் தக்கவைக்கிறது.
- source_word: צָרַעַת
  choice: சாராத் பாதிப்பு
  rationale: צָרַעַת (tsaraʿat) என்பது மனிதரின் தோலை மட்டுமல்லாமல் உடைகளையும் வீடுகளையும் பாதிக்கக்கூடிய பலவகை அறிகுறிகளைக் குறிக்கும் வேதாகமச் சொல். ‘தொழுநோய்’ என்பது இங்கு அளவுக்கு மீறிய மருத்துவத் துல்லியத்தைத் தரும்; ‘பூஞ்சை’ என்பதும் பொருளைத் தேவையின்றிக் குறுக்கும். ஆகவே ஒலிபெயர்ப்புடன் பொதுவான ‘பாதிப்பு’ சேர்க்கப்பட்டது.
- source_word: הַבֶּגֶד
  choice: உடையில்
  rationale: எபிரெயச் சொல் ஒருமையில் ‘உடை’ என்று பொருள்படும். இங்கு ஒரு பொதுவகையைக் குறிப்பதால் தமிழில் இடப்பொருளுடன் ‘உடையில்’ என்பது இயல்பாக உள்ளது.
- source_word: וְלַבָּיִת
  choice: வீட்டிலும்
  rationale: இணையான மற்றொரு பாதிப்பிடத்தை இது சேர்க்கிறது. சூழலில் உள்ள இடப்பொருளைத் தமிழில் ‘வீட்டிலும்’ தெளிவாகவும் சுருக்கமாகவும் வெளிப்படுத்துகிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், பட்டியலின் தொடர்ச்சியை உணர்த்தும் சுருக்கமான வசனத் துணுக்காக மொழிபெயர்க்கப்பட்டுள்ளது. அறிமுகமில்லாத எபிரெயச் சொல்லை அடிக்குறிப்பு விளக்குவதால், மூலத்தின் பரந்ததும் தெளிவாக வரையறுக்கப்படாததுமான பொருள் பாதுகாக்கப்படுகிறது.
