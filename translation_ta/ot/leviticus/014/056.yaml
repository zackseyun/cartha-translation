  text: and for a swelling[a], and for a scab[b], and for a bright spot.
translation:
  language: ta
  text: தோலில் எழும்பிய வீக்கத்திற்கும், படைக்கும்[a], ஒளிரும் புள்ளிக்கும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது ‘தோல் தடிப்பு’ அல்லது ‘சொறி’; படை (סַפַּחַת) என்னும் சொல்லின் துல்லியமான தோல் நோயியல் பொருள் உறுதியாகத் தெரியவில்லை.
    reason: lexical_alternative
  - marker: b
    text: அல்லது ‘ஒளிரும் படலம்’; இச்சூழலில் ‘வெண்புள்ளி’ என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאֵת
  choice: தோலில் எழும்பிய வீக்கம்
  rationale: லேவியர் 13–14 அதிகாரங்களின் நோயறிதல் சூழலில், தோலின் மேற்பரப்பில் உயர்ந்து காணப்படும் பாதிப்பை இச்சொல் குறிக்கிறது. ‘தோலில் எழும்பிய வீக்கம்’ என்பது அதனை மிகையாக மருத்துவ ரீதியில் வரையறுக்காமல் தெளிவாகச் சொல்கிறது.
- source_word: סַפַּחַת
  choice: படை
  rationale: இச்சொல் தோலில் தோன்றும் படை, தடிப்பு அல்லது சொறி போன்ற பாதிப்பைக் குறிக்கலாம். துல்லியமான தோல் நோயியல் பொருள் உறுதியல்ல; ‘படை’ என்பது இயல்பான, பொதுவான தமிழ்ச் சொல் என்பதால் தேர்ந்தெடுக்கப்பட்டது.
- source_word: בֶּהֶרֶת
  choice: பளிச்சிடும் திட்டு
  rationale: இச்சொல்லின் அடிப்படை வலியுறுத்தல் நிறத்தைவிட ஒளிரும் அல்லது வெளிர்ந்த தோற்றத்தின்மீது உள்ளது. ‘பளிச்சிடும் திட்டு’ அந்தப் பொருளைப் பாதுகாக்கிறது; சூழலில் அது வெண்மையான திட்டாகவும் இருக்கலாம்.
- source_word: וְ/לַ
  choice: -க்கும்
  rationale: முந்தைய வசனங்களோடு தொடரும் சட்டச் சுருக்கப் பட்டியலில் ‘மற்றும் ... குறித்து/அதற்காக’ என்ற தொடரைத் தமிழ் இணைவேற்றுமை விகுதி இயல்பாக வெளிப்படுத்துகிறது.
