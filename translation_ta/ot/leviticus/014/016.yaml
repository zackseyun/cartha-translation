  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/טָבַ֤ל הַ/כֹּהֵן֙ אֶת אֶצְבָּע֣/וֹ הַ/יְמָנִ֔ית מִן הַ/שֶּׁ֕מֶן אֲשֶׁ֥ר עַל כַּפּ֖/וֹ הַ/שְּׂמָאלִ֑ית וְ/הִזָּ֨ה מִן הַ/שֶּׁ֧מֶן בְּ/אֶצְבָּע֛/וֹ שֶׁ֥בַע פְּעָמִ֖ים לִ/פְנֵ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/016.yaml
  text: The priest shall dip his right finger into some of the oil that is on his left palm[a], and with his finger he shall sprinkle some of the oil seven times before Yahweh.
translation:
  language: ta
  text: ஆசாரியன் தன் இடது உள்ளங்கையில் உள்ள எண்ணெயில் தன் வலது கை விரலை நனைத்து, அந்த விரலால் எண்ணெயை யாவேயின் முன்னிலையில் ஏழு முறை தெளிக்க வேண்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: טָבַל
  choice: தொட்டு எடுத்து
  rationale: ஒரு திரவத்தில் விரலை நனைத்து எடுக்கும் சடங்குச் செயலை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; முழுவதுமாக அமிழ்த்துதல் என்ற தேவையற்ற பொருளைத் தவிர்க்கிறது.
- source_word: אֶצְבָּעוֹ הַיְמָנִית
  choice: தன் வலது கை விரலால்
  rationale: சடங்கில் குறிப்பிடப்படும் வலப்பக்க விரலைத் தெளிவாகவும் தமிழில் இயல்பாகவும் காட்டுகிறது.
- source_word: מִן הַשֶּׁמֶן
  choice: எண்ணெயில் சிறிதை
  rationale: מִן இங்கு எண்ணெயின் ஒரு பகுதியை எடுத்துப் பயன்படுத்துவதை உணர்த்துகிறது.
- source_word: אֲשֶׁר עַל כַּפּוֹ הַשְּׂמָאלִית
  choice: தன் இடது உள்ளங்கையில் இருக்கும்
  rationale: כַּף என்பதன் குறிப்பான பொருளான ‘உள்ளங்கை’யையும், עַל என்பதன் இடவியல் தொடர்பையும் பாதுகாக்கிறது.
- source_word: הִזָּה
  choice: தெளிக்க
  rationale: ஆசாரியச் சடங்கில் திரவத்தை முறைப்படி சிதறச் செய்வதற்கான தெளிவான, வழக்கமான தமிழ் வினைச்சொல்.
- source_word: בְּאֶצְבָּעוֹ
  choice: தன் விரலால்
  rationale: בְּ இங்கு செயற்கருவியைக் குறிக்கிறது; எண்ணெய் விரலால் தெளிக்கப்படுவதை நேரடியாகச் சொல்கிறது.
- source_word: שֶׁבַע פְּעָמִים
  choice: ஏழு முறை
  rationale: சடங்கில் முக்கியமான எண்ணிக்கையைச் சொற்சார்பாகவும் இயல்பாகவும் தருகிறது.
- source_word: לִפְנֵי יְהוָה
  choice: யெகோவாவின் முன்னிலையில்
  rationale: לִפְנֵי என்பதன் முன்னிலை/சந்நிதி கருத்தையும், தெய்வீகப் பெயரையும் தெளிவாகக் காக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: எபிரெய மூலத்தில் நேரடியாக இடம்பெறும் உடன்படிக்கைப் பெயரைத் தமிழில் பரவலாக அறியப்பட்ட பெயருருவில் வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: கர்த்தர்; யாவே
  rationale: மூலத்தின் தனிப்பெயரை பொதுப்பட்டத்தால் மாற்றாமல் பாதுகாக்கிறது. தமிழில் வாசகர்களுக்கு நன்கு அறிமுகமான ‘யெகோவா’ என்ற வடிவம் தேர்ந்தெடுக்கப்பட்டது; உச்சரிப்பின் மீள்கட்டமைப்பு குறித்த விவாதத்தை வசனத்துக்குள் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், ஆசாரியச் சடங்குக்கேற்ற கண்ணியமான மற்றும் தெளிவான நடை. எபிரெயச் சொல்வரிசையை இயந்திரமாகப் பின்பற்றாமல், செயல் தொடரைத் தமிழில் இயல்பாக அமைத்துள்ளது.
