  text: וְ/הֶעֱמִ֞יד הַ/כֹּהֵ֣ן הַֽ/מְטַהֵ֗ר אֵ֛ת הָ/אִ֥ישׁ הַ/מִּטַּהֵ֖ר וְ/אֹתָ֑/ם לִ/פְנֵ֣י יְהוָ֔ה פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/011.yaml
  text: And the priest who cleanses shall present the man who is being cleansed, along with those things, before Yahweh at the entrance of the tent of meeting.
translation:
  language: ta
  text: சுத்திகரிப்புச் சடங்கை நடத்தும் ஆசாரியன், சுத்திகரிக்கப்படுகிற அந்த மனிதனையும் அந்தப் பொருள்களையும் யாவேவின் முன்னிலையில், சந்திப்புக் கூடாரத்தின் நுழைவாயிலில் நிறுத்துவான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֶעֱמִיד
  choice: நிறுத்த வேண்டும்
  rationale: עמד என்பதன் ஹிஃபில் வடிவம் ஒருவரையோ பொருள்களையோ சடங்குமுறையில் முன்னிலையில் நிற்கச் செய்வதைக் குறிக்கிறது. தமிழில் ‘நிறுத்த வேண்டும்’ என்பது மூலத்தின் உருவகத்தையும் கட்டளைத் தன்மையையும் இயல்பாகத் தக்கவைக்கிறது.
- source_word: הַכֹּהֵן הַמְטַהֵר
  choice: சுத்திகரிப்பைச் செய்கிற ஆசாரியன்
  rationale: பங்கேற்பு வினைச்சொல் ஆசாரியனின் சடங்குசார் பணியைச் சுட்டுகிறது. இந்த மொழிபெயர்ப்பு அவர் ஒழுக்கத் தூய்மையை உண்டாக்குகிறார் என்று கூறாமல், சுத்திகரிப்புச் சடங்கை நடத்துகிறார் என்பதைத் தெளிவாக்குகிறது.
- source_word: הָאִישׁ
  choice: அந்த மனிதன்
  rationale: எபிரெய மூலத்தில் ஆண்பால் ஒருமையான ‘மனிதன்’ என்று வெளிப்படையாக இருப்பதால் அதையே தக்கவைக்கிறது.
- source_word: הַמִּטַּהֵר
  choice: சுத்திகரிக்கப்பட்டுவரும்
  rationale: ஹித்பயேல் வடிவம் இங்கு சடங்குசார் சுத்திகரிப்புக்கு உட்பட்டுவரும் மனிதனைச் சுட்டுகிறது. தொடர்ச்சியான செயல்முறையை ‘சுத்திகரிக்கப்பட்டுவரும்’ வெளிப்படுத்துகிறது.
- source_word: וְאֹתָם
  choice: அந்தப் பொருள்களையும்
  rationale: பன்மைச் சுட்டுப்பெயர் முந்தைய வசனத்தில் கூறப்பட்ட சடங்குப் பொருள்களைக் குறிக்கிறது; மனிதர்களைக் குறிக்கவில்லை என்பதைத் தமிழில் தெளிவாக்க ‘பொருள்கள்’ சேர்க்கப்பட்டுள்ளது.
- source_word: לִפְנֵי יְהוָה
  choice: யெகோவாவின் முன்னிலையில்
  rationale: இறைநாமத்தை மறைக்காமல் தனிப்பெயராக வழங்குகிறது; לִפְנֵי என்பதன் சந்நிதி/முன்னிலை சார்ந்த பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரத்தின் நுழைவாயிலில்
  rationale: சரணாலயத்தின் குறிப்பிட்ட இடத்தைச் சுட்டும் மரபுத்தொடரின் பொருளைத் தெளிவான நவீன தமிழில் வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைநாமத்தின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே
  rationale: மூலத்தில் நான்கெழுத்து இறைநாமம் நேரடியாக உள்ளது. அதை ‘கர்த்தர்’ போன்ற பட்டப்பெயராக மாற்றாமல் தமிழில் பரவலாக அறியப்படும் தனிப்பெயர் வடிவமான ‘யெகோவா’ என்று வழங்கப்பட்டுள்ளது; ‘யாவே’ என்பது சாத்தியமான மாற்று ஒலிபெயர்ப்பு.
- issue: ஆசாரியனின் சுத்திகரிப்புப் பங்கு
  choice: சுத்திகரிப்பைச் செய்கிற
  alternative: சுத்தமானவர் என்று அறிவிக்கிற
  rationale: பங்கேற்பு வினைச்சொல் இச்சூழலில் அறிவிப்பை மட்டும் அல்லாமல் முழுச் சடங்கு நடவடிக்கையையும் உள்ளடக்குகிறது. ஆகவே அதை வெறும் தீர்ப்பறிவிப்பாகக் குறுக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பாகவும், லேவியராகமத்தின் சடங்குசார் கண்ணியமான தொனியைத் தக்கவைத்தும் வடிவமைக்கப்பட்டது. மூலத்தின் ஒருமை/பன்மை வேறுபாடும் சுத்திகரிப்பு நடைபெற்று வருகிற நிலையும் பாதுகாக்கப்பட்டுள்ளன.
