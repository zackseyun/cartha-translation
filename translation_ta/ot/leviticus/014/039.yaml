  text: Then the priest shall return on the seventh day and look, and if the infection has spread in the walls of the house,
translation:
  language: ta
  text: ஏழாம் நாளில் ஆசாரியன் திரும்பிவந்து பார்ப்பான்; அப்போது வீட்டின் சுவர்களில் அந்தப் பாதிப்பு பரவியிருந்தால்,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַכֹּהֵן
  choice: ஆசாரியன்
  rationale: இஸ்ரவேலின் வழிபாட்டு மற்றும் தூய்மைச் சடங்குப் பொறுப்பாளரைக் குறிக்கும் வழக்கமான, புரிந்துகொள்ளத்தக்க தமிழ் வேதாகமச் சொல்.
- source_word: הַנֶּגַע
  choice: அந்தப் பாதிப்பு
  rationale: נגע என்பது இச்சூழலில் வீட்டின் சுவர்களில் காணப்படும் சடங்குத் தூய்மையைப் பாதிக்கும் குறியைக் குறிக்கிறது; மருத்துவ நோயாக மட்டும் புரியக்கூடிய ‘தொற்று’ என்பதைத் தவிர்த்து, பரந்த பொருளை ‘பாதிப்பு’ காக்கிறது.
- source_word: פָּשָׂה
  choice: பரவியிருந்தால்
  rationale: குறி அல்லது பாதிப்பு சுவர்களில் விரிவடைந்த நிலையை இயல்பான தமிழில் தெரிவிக்கிறது; எபிரேய தொடரில் உள்ள וְהִנֵּה-யின் நிபந்தனைச் செயல்பாட்டையும் சூழலுக்கேற்ப வெளிப்படுத்துகிறது.
- source_word: בְּקִירֹת הַבָּיִת
  choice: வீட்டின் சுவர்களில்
  rationale: மூலத்தின் இடத்தைக் குறிக்கும் பன்மை வடிவை நேரடியாகவும் இயல்பாகவும் வழங்குகிறது.
theological_decisions:
- issue: וְהִנֵּה என்பதன் மொழிபெயர்ப்பு
  choice: ‘அப்போது ... பரவியிருந்தால்’ என்ற நிபந்தனை அமைப்பு
  alternative: ‘இதோ, ... பரவியிருந்தது’
  rationale: அடுத்த வசனத்தில் தொடரும் சட்ட நிபந்தனையைத் தமிழில் தெளிவாகக் காட்டுகிறது; தனியாக ‘இதோ’ சேர்ப்பது இங்கு இயல்பற்ற வலியுறுத்தலை உருவாக்கலாம்.
- issue: הַנֶּגַע என்பதின் இயல்பு
  choice: பாதிப்பு
  alternative: தொற்று / குஷ்டரோகம்
  rationale: மூலம் இதனை மனித மருத்துவ நோயெனத் துல்லியமாக வரையறுக்கவில்லை; வீட்டில் தோன்றும் சடங்குத் தூய்மை சார்ந்த குறி என்ற உண்மையான பொருள் அகலத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் வகையில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. வசனம் அடுத்த கட்டளைக்குத் தொடர்வதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
