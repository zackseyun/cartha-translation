translation_notes:
  register: நவீன நிலையான தமிழில், சட்ட நடைமுறையின் படிப்படியான தன்மையைப் பேணும் கண்ணியமான, எளிதில் புரியும் நடை. ‘ஆசாரியன்’ என்பது இச்சூழலுக்கான மரபான சொல்; ‘வாசல்’ மற்றும் ‘மூடி வைக்க’ ஆகியவை தேவையற்ற தொழில்நுட்ப விளக்கத்தைத் தவிர்க்கின்றன.
