  terminology: “ஆசாரியன்,” “வீடு,” and “வாசல்” are suitable and consistent choices. “வாசல்” faithfully represents the entrance/opening without over-specifying its construction. The footnote supplies a legitimate lexical alternative and accurately describes the possible access-restricting sense.
