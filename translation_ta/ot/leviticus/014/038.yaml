  source_fidelity: 'The Tamil accurately renders the procedural sequence: the priest goes out from the house, goes to its entrance, and closes the house for seven days. “மூடி வைக்க வேண்டும்” appropriately conveys the Hiphil of סגר without importing the more interpretive sense “quarantine.”'
