  yaml_path: translation/ot/leviticus/014/038.yaml
  text: Then the priest shall go out of the house to the doorway of the house and shut up the house for seven days[a].
translation:
  language: ta
  text: பின்பு ஆசாரியன் வீட்டிலிருந்து வெளியேறி, வீட்டின் வாசலுக்குச் சென்று, அந்த வீட்டை ஏழு நாட்களுக்கு மூடி வைக்க வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அந்த வீட்டை ஏழு நாட்களுக்கு அடைத்து வைக்க வேண்டும்.’ எபிரெய வினைச்சொல், ஆய்வுக் காலத்தில் உள்ளே செல்ல முடியாதபடி மூடி வைப்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָא
  choice: பின்பு ... வெளியேறி
  rationale: சடங்குச் சட்டத்தின் தொடர் நடவடிக்கையில் waw + qatal அடுத்த கட்டத்தைக் குறிக்கிறது; ‘பின்பு’ அந்த வரிசையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הַכֹּהֵן
  choice: ஆசாரியன்
  rationale: லேவியராகமச் சூழலில் כֹּהֵן என்பதற்கான நிலையான, பொதுவாகப் புரியும் தமிழ் சொல்.
- source_word: מִן הַבַּיִת
  choice: வீட்டிலிருந்து
  rationale: יָצָא உடன் வரும் மூல இடத்தைத் தமிழில் இயல்பாகக் குறிக்கிறது.
- source_word: אֶל פֶּתַח הַבָּיִת
  choice: வீட்டின் வாசலுக்குச் சென்று
  rationale: פֶּתַח என்பது நுழைவிடம் அல்லது திறப்பைக் குறிக்கிறது; ‘வாசல்’ கதவுப் பலகையை மிகையாகக் குறிப்பதில்லாமல் இங்கு இயல்பாக உள்ளது. இலக்கைத் தெளிவுபடுத்த ‘சென்று’ சேர்க்கப்பட்டுள்ளது.
- source_word: וְהִסְגִּיר
  choice: மூடி வைக்க வேண்டும்
  rationale: סגר என்பதன் Hiphil வடிவம் குறிப்பிட்ட காலத்திற்கு வீட்டிற்கான அணுகலைத் தடுத்து மூடி வைப்பதைக் குறிக்கிறது; ‘தனிமைப்படுத்து’ போன்ற விளக்கச் சொல்லை விட மூலத்தின் செயற்பாட்டை நேரடியாகப் பேணுகிறது.
- source_word: אֶת הַבַּיִת
  choice: அந்த வீட்டை
  rationale: நேரடி செயப்படுபொருள் குறியீடு மொழிபெயர்க்கப்படவில்லை; முன்னரே குறிப்பிடப்பட்ட வீட்டைத் தமிழில் தெளிவாகச் சுட்ட ‘அந்த’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: שִׁבְעַת יָמִים
  choice: ஏழு நாட்களுக்கு
  rationale: கால அளவை இயல்பான தமிழில் நான்காம் வேற்றுமை வடிவால் வெளிப்படுத்துகிறது.
