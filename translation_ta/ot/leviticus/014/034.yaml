source:
  edition: WLC
  text: כִּ֤י תָבֹ֨אוּ֙ אֶל אֶ֣רֶץ כְּנַ֔עַן אֲשֶׁ֥ר אֲנִ֛י נֹתֵ֥ן לָ/כֶ֖ם לַ/אֲחֻזָּ֑ה וְ/נָתַתִּי֙ נֶ֣גַע צָרַ֔עַת בְּ/בֵ֖ית אֶ֥רֶץ אֲחֻזַּתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/034.yaml
  text: When you enter the land of Canaan that I am giving to you as a possession[a], and I put an outbreak of skin disease in a house in the land of your possession,
translation:
  language: ta
  text: “நான் உங்களுக்கு உடைமையாகக் கொடுக்கிற கானான் நாட்டிற்குள் நீங்கள் நுழையும்போது, உங்கள் உடைமையான நாட்டிலுள்ள ஒரு வீட்டில் தொழுநோய்ப் பாதிப்பை[a] நான் ஏற்படுத்துவேன்,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் இவ்வாறு மொழிபெயர்க்கப்பட்ட சொற்றொடர், நவீன மருத்துவத்தில் ‘தொழுநோய்’ எனப்படும் நோயை மட்டும் குறிக்கவில்லை; மனிதர்களின் தோல், ஆடைகள், வீடுகள் ஆகியவற்றில் காணப்படும் பலவகையான பாதிப்புகளையும் குறிக்கலாம்.
    reason: நவீன மருத்துவத் தொழுநோயுடன் தவறாக ஒன்றுபடுத்துவதைத் தவிர்க்கவும், இச்சொல் வீட்டைப் பற்றியும் பயன்படுத்தப்படுவதைக் விளக்கவும்.
lexical_decisions:
- source_word: כִּי תָבֹאוּ
  choice: நீங்கள் … நுழையும்போது
  rationale: எதிர்காலத்தில் நிகழவிருக்கும் சூழலை அறிமுகப்படுத்தும் காலப்பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֶרֶץ כְּנַעַן
  choice: கானான் நாடு
  rationale: குறிப்பிட்ட நிலப்பரப்பைக் குறிக்கும் வழக்கமான, தெளிவான தமிழாக்கம்.
- source_word: אֲשֶׁר אֲנִי נֹתֵן לָכֶם לַאֲחֻזָּה
  choice: நான் உங்களுக்கு உடைமையாகக் கொடுக்கிற
  rationale: நֹתֵן என்பதன் தொடரும் அல்லது அண்மையில் நிறைவேறவிருக்கும் செயலுணர்வையும், אֲחֻזָּה என்பதன் நிலவுடைமைப் பொருளையும் காக்கிறது.
- source_word: וְנָתַתִּי
  choice: நான் ஏற்படுத்தினால்
  rationale: எபிரெய மூலத்தில் கடவுளின் முதலாம் நபர் செயற்பாடு வெளிப்படையாக உள்ளது. தமிழ்ச் சட்டநடைச் சூழலில் நிபந்தனைத் தொடர்பை இயல்பாகக் காட்ட ‘ஏற்படுத்தினால்’ பயன்படுத்தப்பட்டது.
- source_word: נֶגַע צָרַעַת
  choice: தொழுநோய் போன்ற பாதிப்பு
  rationale: צָרַעַת என்பது நவீன மருத்துவத் தொழுநோயை மட்டும் குறிக்காது; இங்கு வீட்டைப் பாதிக்கும் நிகழ்வாக இருப்பதால் ‘போன்ற’ என்பது ஒப்புமைத் தன்மையை வெளிப்படுத்தி, נֶגַע என்பதன் பாதிப்பு/தாக்கம் என்ற பொருளையும் காக்கிறது.
- source_word: בְּבֵית
  choice: ஒரு வீட்டில்
  rationale: בְּ என்ற முன்னொட்டின் இடப்பொருளை இயல்பாகவும் நேரடியாகவும் தருகிறது.
- source_word: אֶרֶץ אֲחֻזַּתְכֶם
  choice: நீங்கள் உடைமையாகப் பெறும் அந்த நாட்டில்
  rationale: முன்னர் வந்த אֲחֻזָּה என்ற உடைமைச் சொல்லுடன் உள்ள தொடர்பைத் தக்கவைத்தபடி, சொற்சொல் மொழிபெயர்ப்பால் உண்டாகும் இயல்பற்ற தமிழைத் தவிர்க்கிறது.
theological_decisions:
- issue: வீட்டில் ஏற்படும் பாதிப்பில் கடவுளின் செயற்பாடு
  choice: ‘நான் ஏற்படுத்தினால்’ என்று முதலாம் நபர் இறைச் செயற்பாட்டை வெளிப்படையாக வைத்தல்
  alternative: ‘ஒரு பாதிப்பு ஏற்பட்டால்’ எனச் செயற்பாட்டை ஆளில்லா வடிவில் கூறுதல்
  rationale: וְנָתַתִּי என்பது நிகழ்வை நேரடியாகக் கடவுளின் செயலாகக் கூறுகிறது. அதன் இறையியல் பதற்றத்தை மென்மைப்படுத்தாமல் மொழிபெயர்ப்பு காக்க வேண்டும்.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிதில் புரியக்கூடிய, கண்ணியமான சட்டநடை பயன்படுத்தப்பட்டுள்ளது. வசனம் அடுத்த கட்டளைக்குத் தொடர்வதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது; மூலத்தின் இறைச் செயற்பாடும் உடைமைக்குரிய சொல் மீளுருவாக்கமும் இயன்றவரை காக்கப்பட்டுள்ளன.
