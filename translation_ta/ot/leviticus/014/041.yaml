base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/041.yaml
  text: He shall have the inside of the house scraped all around[a], and they shall pour out the dust that they scraped off outside the city into an unclean place.
translation:
  language: ta
  text: அவன் வீட்டின் உட்புறத்தைச் சுற்றிலும் சுரண்டச் செய்ய வேண்டும். அவர்கள் சுரண்டி எடுத்த புழுதியை[a] நகருக்கு வெளியே தீட்டான ஓர் இடத்தில் கொட்ட வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல் நேரடியாக ‘தூசி’ அல்லது ‘புழுதி’ என்று பொருள்படும்; இங்கு அது வீட்டுச் சுவர்களிலிருந்து சுரண்டி எடுக்கப்பட்ட பொருளைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַקְצִעַ
  choice: சுரண்டச் செய்ய வேண்டும்
  rationale: קצע என்பதன் ஹிஃபில் வடிவம் காரணவினைப் பொருளைக் கொண்டது; சம்பந்தப்பட்டவன் தானே முழு வேலையையும் செய்வதாக அல்லாமல், அதைச் செய்ய ஏற்பாடு செய்வதை இவ்வாறு இயல்பாகத் தெரிவிக்கிறது.
- source_word: מִבַּיִת סָבִיב
  choice: வீட்டின் உட்புறம் முழுவதையும் சுற்றிலும்
  rationale: இது வீட்டின் உள்பக்கப் பரப்பைச் சுட்டுகிறது; סָבִיב என்பது அதைச் சுற்றிலும் முழுமையாகச் செய்வதைக் குறிக்கிறது.
- source_word: וְשָׁפְכוּ
  choice: அவர்கள் ... கொட்ட வேண்டும்
  rationale: שׁפך என்பதன் அடிப்படைப் பொருள் ‘ஊற்று’ என்றாலும், சுரண்டிய புழுதியை அகற்றும் இச்சூழலில் ‘கொட்ட வேண்டும்’ என்பது இயல்பான தமிழாகவும் செயலைத் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: הֶעָפָר
  choice: புழுதி
  rationale: עָפָר என்பதன் நேரடிப் பொருளான தூசி அல்லது புழுதி என்பதைக் காக்கிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘சாந்து’ போன்ற குறிப்பிட்ட பொருளைச் சேர்க்கவில்லை.
- source_word: אֲשֶׁר הִקְצוּ
  choice: சுரண்டி எடுத்த
  rationale: சுவர்களிலிருந்து சுரண்டி அகற்றப்பட்ட பொருளை இத்தொடர் குறிக்கிறது; முந்தைய வினையுடனான தொடர்பையும் இச்சொல்லாக்கம் காக்கிறது.
- source_word: אֶל מִחוּץ לָעִיר
  choice: நகருக்கு வெளியே
  rationale: நகர எல்லைக்கு அப்பாலுள்ள இடத்தை நோக்கிய நகர்வை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: אֶל מָקוֹם טָמֵא
  choice: தீட்டான ஓர் இடத்தில்
  rationale: லேவியராகமத்தில் טָמֵא என்பது சடங்குசார் தூய்மை வகைப்பாட்டைக் குறிக்கும் தொழில்நுட்பச் சொல்; ‘தீட்டான’ என்பது அதை ஒழுக்கக்கேடாக மாற்றாமல் காக்கிறது.
theological_decisions:
- issue: லேவியராகமத்தின் தூய்மைச் சூழலில் טָמֵא என்பதன் மொழிபெயர்ப்பு
  choice: தீட்டான
  alternative: அசுத்தமான; தூய்மையற்ற
  rationale: ‘தீட்டான’ என்பது சடங்குசார் தூய்மை நிலையைக் குறிக்கும் வழக்கமான தமிழ்ச் சொல்லாகும்; இங்கு கூறப்படாத ஒழுக்கக் குற்றத்தின் கருத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன பொதுத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. காரணவினை, ஒருமை–பன்மை மாற்றம், சடங்குசார் ‘தீட்டு’ ஆகியவை மூலத்துக்கு ஏற்ப பாதுகாக்கப்பட்டுள்ளன.
