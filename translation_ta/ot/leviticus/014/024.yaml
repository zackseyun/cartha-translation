  terminology: '''குற்றநிவாரணப் பலி'' is an acceptable contemporary rendering of אָשָׁם. ''லோக்'' appropriately preserves the technical liquid measure. ''யாவே'' is preferable here as a Tamil rendering of Yahweh and avoids introducing a distinct traditional pronunciation not chosen by the POB audit trail.'
