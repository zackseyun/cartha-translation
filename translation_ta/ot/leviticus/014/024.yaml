source:
  edition: WLC
  text: וְ/לָקַ֧ח הַ/כֹּהֵ֛ן אֶת כֶּ֥בֶשׂ הָ/אָשָׁ֖ם וְ/אֶת לֹ֣ג הַ/שָּׁ֑מֶן וְ/הֵנִ֨יף אֹתָ֧/ם הַ/כֹּהֵ֛ן תְּנוּפָ֖ה לִ/פְנֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/024.yaml
  text: Then the priest shall take the guilt-offering lamb and the log of oil[b][a], and the priest shall wave them as a wave offering before Yahweh.
translation:
  language: ta
  text: பின்பு ஆசாரியன் குற்றநிவாரணப் பலியின் ஆட்டுக்குட்டியையும் எண்ணெயின் ஒரு லோக் அளவையும்[a] எடுத்துக்கொள்ள வேண்டும். ஆசாரியன் அவற்றை யாவேக்கு முன்பாக அசைவாட்டுக் காணிக்கையாக அசைவாட்ட வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘லோக்’ என்பது இஸ்ரவேலரின் சடங்கு முறையில் பயன்படுத்தப்பட்ட ஒரு சிறிய திரவ அளவையாகும்.
    reason: cultural_note
lexical_decisions:
- source_word: וְלָקַח
  choice: பின்பு ... எடுத்துக்கொள்ள வேண்டும்
  rationale: வாவ் இணைப்புடன் வந்த வினைச்சொல் சடங்கின் அடுத்த கட்டத்தைத் தொடர்கிறது; ‘பின்பு’ நடைமுறை முன்னேற்றத்தை இயல்பான தமிழில் காட்டுகிறது.
- source_word: הַכֹּהֵן
  choice: ஆசாரியன்
  rationale: ஆசாரியச் சடங்கு சார்ந்த சூழலில் כֹּהֵן என்பதற்கான தெளிவான, வழக்கமான தமிழ் சொல். எபிரெயத்தில் எழுவாய் மீண்டும் வருவதால் தமிழிலும் அது தக்கவைக்கப்பட்டுள்ளது.
- source_word: כֶּבֶשׂ הָאָשָׁם
  choice: குற்றநிவாரணப் பலிக்கான ஆட்டுக்குட்டி
  rationale: אָשָׁם என்பது குற்றத்தால் உண்டான பொறுப்பு அல்லது நிவாரணத்துடன் தொடர்புடைய தனித்த பலிவகையைக் குறிக்கிறது; ‘குற்றநிவாரணப் பலி’ அதைக் கொள்கைச் சாய்வின்றித் தெளிவாகக் காட்டுகிறது.
- source_word: לֹג הַשָּׁמֶן
  choice: ஒரு லோக் அளவு எண்ணெய்
  rationale: לֹג என்பது குறிப்பிட்ட சிறிய திரவ அளவை குறிக்கும் தொழில்நுட்பச் சொல். ‘லோக்’ என்ற ஒலிபெயர்ப்புடன் ‘அளவு’ சேர்ப்பது துல்லியத்தையும் புரிதலையும் காக்கிறது.
- source_word: וְהֵנִיף ... תְּנוּפָה
  choice: அசைவாட்டும் காணிக்கையாக அசைவாட்ட வேண்டும்
  rationale: נוּף வேர்ச்சொல்லின் வினையும் அதனுடன் தொடர்புடைய பெயர்ச்சொல்லும் எபிரெயத்தில் மீள்கின்றன; தமிழ் மொழிபெயர்ப்பு சடங்குச் செயலையும் காணிக்கை வகையையும் வெளிப்படையாகப் பாதுகாக்கிறது.
- source_word: אֹתָם
  choice: அவற்றை
  rationale: பன்மைச் சுட்டுப்பெயர் ஆட்டுக்குட்டியையும் எண்ணெய் அளவையும் ஒன்றாகக் குறிக்கிறது.
- source_word: לִפְנֵי יְהוָה
  choice: யெகோவாவின் முன்னிலையில்
  rationale: לִפְנֵי என்பது சந்நிதியில் அல்லது முன்னிலையில் சமர்ப்பிப்பதைக் குறிக்கிறது. יהוה என்ற தனிப்பெயர் தமிழில் நிலைபெற்ற ‘யெகோவா’ என ஒலிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக இருப்பதால் பொதுப்பட்டமான ‘கர்த்தர்’ என்பதற்குப் பதில் தனிப்பெயர் தக்கவைக்கப்படுகிறது. நான்கு எழுத்துப் பெயரின் பண்டைய உச்சரிப்பு முழு உறுதியற்றது; நவீனத் தமிழில் பரவலாக அறியப்படும் ‘யெகோவா’ பயன்படுத்தப்படுகிறது.
- issue: אָשָׁם என்ற பலிவகை
  choice: குற்றநிவாரணப் பலி
  alternative: குற்றப்பலி; நிவாரண பலி
  rationale: இந்தச் சொல் வெறும் மனக்குற்ற உணர்வை மட்டுமல்ல, ஏற்பட்ட குற்றப்பொறுப்புக்கும் அதற்கான நிவாரணத்துக்கும் தொடர்புடைய பலியைச் சுட்டுகிறது. ஆகவே தனித்த சடங்கு வகை தெளிவாக இருக்குமாறு மொழிபெயர்க்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், லேவியராகமச் சடங்கு மொழிக்கேற்ற கண்ணியமான சட்டநடை பயன்படுத்தப்பட்டுள்ளது. தொழில்நுட்ப அளவுச் சொல் விளக்கக் குறிப்புடன் தக்கவைக்கப்பட்டு, எபிரெயத்தின் மீளுரையும் பன்மைச் சுட்டும் பாதுகாக்கப்பட்டுள்ளன.
