source:
  edition: WLC
  text: וּ/שְׁתֵּ֣י תֹרִ֗ים א֤וֹ שְׁנֵי֙ בְּנֵ֣י יוֹנָ֔ה אֲשֶׁ֥ר תַּשִּׂ֖יג יָד֑/וֹ וְ/הָיָ֤ה אֶחָד֙ חַטָּ֔את וְ/הָ/אֶחָ֖ד עֹלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/022.yaml
  text: and two turtledoves or two young pigeons[a], as his means can afford; and one shall be a sin offering and the other a burnt offering.
translation:
  language: ta
  text: மேலும், அவனுடைய வசதிக்கு ஏற்றபடி இரண்டு காட்டுப்புறாக்களையோ இரண்டு புறாக்குஞ்சுகளையோ கொண்டுவர வேண்டும்; அவற்றில் ஒன்று பாவநிவாரணப் பலியாகவும்[a], மற்றொன்று தகனபலியாகவும் இருக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தூய்மைப்படுத்தும் பலி.” எபிரெயச் சொல், சடங்குமுறைத் தூய்மைப்படுத்துதலுக்குப் பயன்படுத்தப்படும் பலியையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁתֵּי תֹרִים
  choice: மேலும், இரண்டு காட்டுப்புறாக்கள்
  rationale: இணைப்புச் சொல் முந்தைய வசனத்தின் பலிப் பட்டியலைத் தொடர்கிறது. תֹרִים என்பது பொதுவான புறாக்களை அல்ல, பலிக்குப் பயன்படுத்தப்பட்ட குறிப்பிட்ட வகை காட்டுப்புறாக்களைக் குறிக்கிறது.
- source_word: אוֹ שְׁנֵי בְּנֵי יוֹנָה
  choice: அல்லது இரண்டு புறாக்குஞ்சுகள்
  rationale: בְּנֵי יוֹנָה என்பதன் சொல்லடி வடிவம் ‘புறாவின் குஞ்சுகள்’; இயல்பான தமிழில் வயது நுட்பத்தைத் தக்கவைத்து ‘புறாக்குஞ்சுகள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: אֲשֶׁר תַּשִּׂיג יָדוֹ
  choice: அவனுடைய வசதிக்கு ஏற்றபடி
  rationale: ‘அவனுடைய கை எட்டுவது’ என்ற எபிரெய மரபுத்தொடர் அவனுடைய பொருளாதாரத் திறனைக் குறிக்கிறது; அதை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְהָיָה אֶחָד
  choice: அவற்றில் ஒன்று ... இருக்க வேண்டும்
  rationale: இரண்டு பறவைகளில் ஒவ்வொன்றுக்கும் வேறுவேறு பலிப்பணி ஒதுக்கப்படுவதைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: חַטָּאת
  choice: பாவநிவாரணப் பலி
  rationale: லேவியராகமத்தின் பலியியல் பயன்பாட்டில் அறிமுகமான மரபுச் சொல் இது. அதே நேரத்தில், இச்சொல்லில் சடங்குத் தூய்மைப்படுத்துதல் என்ற நுட்பமும் இருப்பதால் மாற்று மொழிபெயர்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְהָאֶחָד עֹלָה
  choice: மற்றொன்று தகனபலியாக
  rationale: וְהָאֶחָד என்பது முதல் பறவையுடன் எதிரிணையாக ‘மற்றொன்று’ எனப் பொருள்படும்; עֹלָה என்பதற்கான நிலைபெற்ற தமிழ்ப் பலியியல் சொல் ‘தகனபலி’.
theological_decisions:
- issue: லேவியராகமத்தின் சடங்குச் சூழலில் חַטָּאת என்பதன் பொருள்
  choice: பாவநிவாரணப் பலி
  alternative: தூய்மைப்படுத்தும் பலி
  rationale: חַטָּאת என்பது பாவத்தையும், சடங்குத் தீட்டிலிருந்து தூய்மைப்படுத்துவதற்கான பலியையும் குறிக்கக்கூடும். மரபாக அறியப்படும் பலிப்பெயர் முதன்மை உரையில் வைக்கப்பட்டு, இச்சூழலில் உள்ள தூய்மைப்படுத்தும் நுட்பம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளக்கூடிய கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. முந்தைய வசனத்திலிருந்து தொடரும் பட்டியல் இயல்பாக வாசிக்க ‘கொண்டுவர வேண்டும்’ என்பது சூழலிலிருந்து வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது; பொருளாதாரத் திறனைக் குறிக்கும் எபிரெய மரபுத்தொடர் சொற்படியாக அல்லாமல் இயல்பான தமிழில் தரப்பட்டுள்ளது.
