    reason: lexical_alternative
  revision_rationale: The revision removes the source-unwarranted expression 'தொழுநோய் போன்ற' and renders צָרַעַת broadly as a skin-disease affliction. It retains a concise, non-overprecise primary rendering for נֶתֶק and supplies its lexical uncertainty and traditional alternative in the footnote.
