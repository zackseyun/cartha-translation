source:
  edition: WLC
  text: זֹ֖את הַ/תּוֹרָ֑ה לְ/כָל נֶ֥גַע הַ/צָּרַ֖עַת וְ/לַ/נָּֽתֶק־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/054.yaml
  text: This is the law for every case of leprous disease and for an itch[a].
translation:
  language: ta
  text: ஒவ்வொரு தோல் நோய்ப் பாதிப்புக்கும், சொறிக்கும் உரிய சட்டம் இதுவே.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘செதிலான தோல் வெடிப்புக்கும்’; பாரம்பரியமாக, ‘ஸ்கால்’ (scall). எபிரெயச் சொல் குறிப்பாகத் தலை அல்லது தாடிப் பகுதியில் ஏற்படும் ஒரு தோல் பாதிப்பைக் குறிக்கிறது; அதற்கான துல்லியமான நவீன மருத்துவ இணைவு உறுதியாகத் தெரியவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת הַתּוֹרָה
  choice: உரிய சட்டம் இதுவே
  rationale: இது நிறைவுச் சுருக்கமாக வரும் சட்டவிதி என்பதால், இயல்பான நவீனத் தமிழில் ‘சட்டம் இதுவே’ என மொழிபெயர்க்கப்பட்டது.
- source_word: לְכָל נֶגַע הַצָּרַעַת
  choice: எல்லா வகையான தொழுநோய் போன்ற பாதிப்புக்கும்
  rationale: נֶגַע என்பது இங்கு பரிசோதிக்கப்படும் பாதிப்பு அல்லது நோய்க்குறியைக் குறிக்கிறது. צָרַעַת நவீன ஹான்சன் நோயோடு துல்லியமாக ஒத்ததல்ல; ஆகவே பாரம்பரியச் சொல்லை மட்டும் பயன்படுத்தாமல், ‘போன்ற’ என்பதன் மூலம் அதன் உறுதியற்ற மருத்துவ அடையாளம் காக்கப்படுகிறது.
- source_word: וְלַנָּתֶק
  choice: சொறிக்கும்
  rationale: נֶתֶק என்பது குறிப்பாகத் தலை அல்லது தாடிப் பகுதியில் ஏற்படும், முடி உதிர்வுடன் தொடர்புடைய ஒரு தோல் பாதிப்பைக் குறிக்கிறது. அதன் துல்லியமான நவீன மருத்துவப் பெயர் உறுதியற்றதால் வாசிக்க எளிய ‘சொறி’ முதன்மை உரையில் பயன்படுத்தப்பட்டு, கூடுதல் விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
