translation_notes:
  register: நவீன நிலையான தமிழில், சட்டச் சுருக்கத்துக்கேற்ற கண்ணியமான மற்றும் எளிதில் புரியும் நடையில் அமைக்கப்பட்டது. பழமையான அல்லது தவறாகத் துல்லியம் காட்டும் மருத்துவச் சொற்கள் தவிர்க்கப்பட்டன.
