revisions:
- from: எல்லா வகையான தொழுநோய் போன்ற பாதிப்புக்கும், சொறிக்கும்[a] உரிய சட்டம் இதுவே.
  to: ஒவ்வொரு தோல் நோய்ப் பாதிப்புக்கும், சொறிக்கும் உரிய சட்டம் இதுவே.[a]
  rationale: The revision removes the source-unwarranted expression 'தொழுநோய் போன்ற' and renders צָרַעַת broadly as a skin-disease affliction. It retains a concise, non-overprecise primary rendering for נֶתֶק and supplies its lexical uncertainty and traditional alternative in the footnote.
