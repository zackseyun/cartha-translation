  text: He shall examine the infection, and if the infection is in the walls of the house as sunken areas, greenish or reddish, and their appearance is deeper than the wall,
translation:
  language: ta
  text: அவன் அந்தப் பாதிப்பை ஆராய வேண்டும். வீட்டின் சுவர்களில் அந்தப் பாதிப்பு பச்சைச் சாயல் கொண்ட அல்லது சிவப்புச் சாயல் கொண்ட குழிந்த பகுதிகளாக[a] இருந்து, அவற்றின் தோற்றம் சுவரின் மேற்பரப்பைவிடத் தாழ்வாகத் தோன்றினால்[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பள்ளங்களாக.”
    reason: lexical_alternative
  - marker: b
    text: சொற்சொல்லாக, “சுவரைவிடத் தாழ்வாக”; அதாவது, சுவரின் மேற்பரப்புக்குக் கீழே குழிந்திருப்பதுபோல் தோன்றுதல்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: அவன் ... ஆராய வேண்டும்
  rationale: ஆசாரியன் மேற்கொள்ளும் முறையான நோயறிதல் சூழலில், வெறுமனே ‘பார்ப்பான்’ என்பதைக் காட்டிலும் ‘ஆராய வேண்டும்’ என்பது செயன்முறையைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: הַנֶּגַע
  choice: அந்தப் பாதிப்பு
  rationale: வீட்டுச் சுவரில் காணப்படும் இயல்பற்ற குறியை நֶגַע குறிக்கிறது. மருத்துவ நோய்த்தொற்றை உறுதிப்படுத்தாமல், தோல், உடை, வீடு ஆகிய அனைத்திற்கும் பொருந்தும் வகையில் ‘பாதிப்பு’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: וְהִנֵּה
  choice: '... இருந்தால்'
  rationale: சட்டநடைச் சூழலில் ஆய்வின்போது கண்டறியப்படும் நிலையை அறிமுகப்படுத்துவதால், தமிழில் இயல்பான நிபந்தனை அமைப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: בְּקִירֹת הַבַּיִת
  choice: வீட்டின் சுவர்களில்
  rationale: பாதிப்பு சுவரின் பரப்பிற்குள் அல்லது அதன்மேல் தென்படுவதை இயல்பான தமிழில் ‘சுவர்களில்’ தெரிவிக்கிறது.
- source_word: שְׁקַעֲרוּרֹת
  choice: பள்ளங்கள்
  rationale: அரிதான இச்சொல் குழிந்த அல்லது அமிழ்ந்த பகுதிகளைக் குறிக்கிறது; ‘பள்ளங்கள்’ எளிய, இயல்பான தமிழில் அந்தத் தோற்றத்தைத் தருகிறது.
- source_word: יְרַקְרַקֹּת
  choice: பச்சைநிறம் கலந்த
  rationale: மறுவடிவ adjective முழுமையான பச்சையைவிடப் பச்சைச் சாயலைக் குறிக்கிறது.
- source_word: אֲדַמְדַּמֹּת
  choice: சிவப்புநிறம் கலந்த
  rationale: மறுவடிவ adjective முழுமையான சிவப்பைவிடச் சிவப்புச் சாயலைக் குறிக்கிறது.
- source_word: וּמַרְאֵיהֶן
  choice: அவை பார்ப்பதற்கு ... தோன்றினால்
  rationale: מַרְאֶה என்பது கண்ணுக்குத் தெரியும் தோற்றத்தைக் குறிக்கிறது; தமிழில் வாக்கிய ஓட்டத்திற்கேற்ப வினை அமைப்பாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: שָׁפָל מִן הַקִּיר
  choice: சுவரின் மேற்பரப்பைவிடத் தாழ்வாக
  rationale: எபிரெயத்தில் சொற்சொல்லாக ‘சுவரைவிடத் தாழ்வாக’ உள்ளது. சூழலில் இது சுவரின் மேற்பரப்புக்குக் கீழே குழிந்ததுபோல் தோன்றுவதைச் சுட்டுகிறது.
