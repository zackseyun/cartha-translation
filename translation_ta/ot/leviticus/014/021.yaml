base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/021.yaml
  text: But if he is poor and his means are insufficient[a], then he shall take one male lamb for a guilt offering to be waved, to make atonement for him, and one-tenth of an ephah of fine flour mixed with oil for a grain offering[b], and one log of oil.
translation:
  language: ta
  text: ஆனால் அவன் ஏழையாக இருந்து, அவனுடைய வசதி போதாமலிருந்தால்[a], அவனுக்காகப் பாவநிவிர்த்தி செய்வதற்காக, அசைவாட்டுவதற்குரிய குற்றநிவாரணப் பலியாக ஓர் ஆண் ஆட்டுக்குட்டியையும், தானியப் படையலுக்காக எண்ணெய் கலந்த ஒரு எப்பாவில் பத்தில் ஒரு பங்கு நுண்ணிய மாவையும், ஒரு லோகு எண்ணெயையும்[b] எடுத்துக்கொள்ள வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லர்த்தமாக, “அவனுடைய கை எட்டவில்லை”; அதாவது, தேவையான செலவைச் செய்ய அவனுக்கு வசதி இல்லை.
    reason: lexical_alternative
  - marker: b
    text: “லோகு” என்பது பண்டைய இஸ்ரவேலின் ஆசாரச் சட்டங்களில் பயன்படுத்தப்பட்ட ஒரு சிறிய திரவ அளவு.
    reason: cultural_note
lexical_decisions:
- source_word: דַּל
  choice: ஏழையாக
  rationale: பொருளாதாரத்தில் தாழ்ந்த அல்லது வறிய நிலையைக் குறிக்கும் எபிரெயச் சொல்லை இயல்பான நவீனத் தமிழில் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: וְאֵין יָדוֹ מַשֶּׂגֶת
  choice: அவனுடைய வசதி போதாமலிருந்தால்
  rationale: சொல்லர்த்தமாக ‘அவனுடைய கை எட்டவில்லை’ எனும் பொருளாதாரத் திறனைச் சுட்டும் மரபுத்தொடரை, அதன் கருத்தைத் தெளிவாகவும் அளவுக்கு மீறிய விளக்கமின்றியும் தருகிறது.
- source_word: כֶּבֶשׂ אֶחָד
  choice: ஓர் ஆட்டுக்குட்டி
  rationale: כֶּבֶשׂ ஆண் செம்மறியாட்டுக் குட்டியைக் குறிக்கலாம்; தமிழில் ‘ஆட்டுக்குட்டி’ இயல்பாக உள்ளது. பாலினத் தகவல் இவ்வடிவில் கட்டாயமாகத் தெளிவுபடுத்தப்படாததால் ‘ஆண்’ சேர்க்கப்படவில்லை.
- source_word: אָשָׁם
  choice: குற்றநிவாரணப் பலி
  rationale: குற்றத்தோடும் அதற்கான நிவாரணம் அல்லது ஈடுசெய்தலோடும் தொடர்புடைய தனித்த ஆசாரப் பலிவகையைப் பாதுகாக்கிறது.
- source_word: לִתְנוּפָה
  choice: அசைவாட்டப்பட வேண்டிய
  rationale: இது தனியான ‘அசைவாட்டுப் பலி’ என்று கூறாமல், குற்றநிவாரணப் பலியான ஆட்டுக்குட்டி சடங்கில் அசைவாட்டப்படுவதை எபிரெயக் கட்டமைப்புக்கு ஏற்ப காட்டுகிறது.
- source_word: לְכַפֵּר עָלָיו
  choice: அவனுக்காகப் பாவநிவிர்த்தி செய்யும்படி
  rationale: ஆசாரச் சூழலில் כפר என்பதன் நிவிர்த்திசெய்யும் செயலைப் பாதுகாக்கிறது; அதன் செயல்முறையை ஒரு குறிப்பிட்ட கோட்பாட்டால் விளக்கவில்லை.
- source_word: וְעִשָּׂרוֹן סֹלֶת אֶחָד
  choice: ஒரு எப்பாவில் பத்தில் ஒரு பங்கு நைசான மாவு
  rationale: עִשָּׂרוֹן என்ற அளவை ஆசாரச் சட்டங்களில் வழக்கமான எப்பாவின் பத்தில் ஒரு பங்காகத் தெளிவுபடுத்தி, סֹלֶת என்பதன் நன்றாக அரைக்கப்பட்ட தரமான மாவைக் ‘நைசான மாவு’ என வழங்குகிறது.
- source_word: בָּלוּל בַּשֶּׁמֶן
  choice: எண்ணெயில் பிசைந்த
  rationale: மாவும் எண்ணெயும் கலந்து தயாரிக்கப்பட்ட நிலையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: לְמִנְחָה
  choice: உணவுப் படையலுக்காக
  rationale: லேவியராகம ஆசாரச் சூழலில் தானிய அல்லது மாவு சார்ந்த படையலைக் குறிக்கும் தனிப்பட்ட பலிவகையை வாசகருக்கு புரியும் தமிழில் தருகிறது.
- source_word: לֹג שָׁמֶן
  choice: ஒரு லோகு எண்ணெய்
  rationale: பண்டைய இஸ்ரவேலின் குறிப்பிட்ட திரவ அளவான לֹג என்பதை உறுதியற்ற நவீன அளவாக மாற்றாமல் ஒலிபெயர்த்து வைக்கிறது.
theological_decisions:
- issue: ஆசாரப் பலிகளுக்குரிய சொற்களின் மொழிபெயர்ப்பு
  choice: ‘குற்றநிவாரணப் பலி’, ‘அசைவாட்டப்பட வேண்டிய’, ‘பாவநிவிர்த்தி’, ‘உணவுப் படையல்’ என்ற வேறுபட்ட ஆசாரச் சொற்கள் பயன்படுத்தப்பட்டன.
  alternative: பொதுவாக ‘பலியிடுதல்’, ‘சடங்காகக் காட்டுதல்’ போன்ற விளக்கச் சொற்களைப் பயன்படுத்துதல்.
  rationale: மூலத்தில் உள்ள தனித்த பலிவகைகளையும் சடங்கு செயல்களையும் கலக்காமல் பாதுகாக்கிறது; அதே நேரத்தில் நிவிர்த்தி எவ்வாறு செயல்படுகிறது என்ற தனிப்பட்ட கோட்பாட்டை மொழிபெயர்ப்பில் புகுத்தவில்லை.
- issue: לִתְנוּפָה என்பது தனிப் பலிவகையா அல்லது ஆட்டுக்குட்டியின்மேல் செய்யப்படும் சடங்கா
  choice: குற்றநிவாரணப் பலியான ஆட்டுக்குட்டி ‘அசைவாட்டப்பட வேண்டியது’ என மொழிபெயர்க்கப்பட்டது.
  alternative: ‘அசைவாட்டுப் பலியாக’ எனத் தனிப் பலிவகைபோல் மொழிபெயர்த்தல்.
  rationale: எபிரெயச் சொற்றொடர் ஆட்டுக்குட்டியை அசைவாட்டும் சடங்கு நோக்கத்தைக் குறிக்கிறது; இதை வேறொரு பலியாக எண்ணச் செய்யாமல் விடுவது சூழலுக்கு ஏற்றது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்ட-ஆசார உரைக்கு ஏற்ற கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘எப்பா’, ‘லோகு’ போன்ற பண்டைய அளவுகள் பாதுகாக்கப்பட்டு, தேவையான விளக்கம் அடிக்குறிப்பில் தரப்பட்டது. எல்லா அடிக்குறிப்பு குறிகளும் பிரதான உரையில் இடம்பெற்றுள்ளன.
