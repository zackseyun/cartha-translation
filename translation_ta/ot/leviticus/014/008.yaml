base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/008.yaml
  text: The one being cleansed shall wash his clothes[a], shave off all his hair, and bathe in water; then he shall be clean. Afterward he may come into the camp[b], but he shall stay outside his tent for seven days.
translation:
  language: ta
  text: தூய்மைப்படுத்தப்படும் நபர்[a] தன் உடைகளைத் துவைத்து, தன் முடி அனைத்தையும் மழித்து, தண்ணீரில் குளிக்க வேண்டும்; அப்போது அவர் தூய்மையானவராவார். அதன்பின் அவர் பாளயத்திற்குள் வரலாம்[b]; ஆனால் ஏழு நாட்கள் தன் கூடாரத்திற்கு வெளியே தங்கியிருக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தூய்மைப்படுத்தப்படுகிறவர்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல், விதிக்கப்பட்ட சடங்குமுறைத் தூய்மைப்படுத்துதலுக்கு உட்பட்டிருக்கும் நபரைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘அவர் பாளயத்திற்குள் வருவார்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய வடிவை எளிய எதிர்காலமாகவும் (‘வருவார்’), அனுமதியாகவும் (‘வரலாம்’) புரிந்துகொள்ள முடியும். தொடர்ந்து விதிக்கப்படும் கட்டுப்பாட்டைக் கருத்தில் கொண்டால், கட்டுப்பாடுகளுடன் மீண்டும் நுழைய அனுமதிக்கப்படுவதே சூழலுக்குப் பொருத்தமாகத் தெரிகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: הַמִּטַּהֵר
  choice: தூய்மைப்படுத்தப்படும் நபர்
  rationale: ஹித்பயேல் வினையெச்ச வடிவம், விதிக்கப்பட்ட சடங்குமுறைத் தூய்மைப்படுத்துதலுக்கு உட்பட்டிருக்கும் நபரைக் குறிக்கிறது. தமிழில் இயல்பாகவும் சடங்குசார் செயல்முறையைத் தெளிவாகவும் காட்ட இந்த வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- source_word: כִבֶּס ... בְּגָדָיו
  choice: தன் உடைகளைத் துவைத்து
  rationale: כִבֵּס என்பது இங்கு உடைகளைத் துவைப்பதைக் குறிக்கிறது. ‘உடைகள்’ என்பது நவீனத் தமிழில் இயல்பானதும் துல்லியமானதும் ஆகும்.
- source_word: גִלַּח אֶת כָּל שְׂעָרוֹ
  choice: தன் உடலிலுள்ள முடி அனைத்தையும் மழித்து
  rationale: வினையும் ‘அனைத்தும்’ என்ற அளவுச் சொல்லும் முடியை முழுமையாக அகற்றுவதைக் காட்டுகின்றன. ‘உடலிலுள்ள’ என்பது இதைத் தலைமுடிக்கு மட்டும் வரையறுக்காமல் காக்கிறது.
- source_word: רָחַץ בַּמַּיִם
  choice: தண்ணீரில் குளிக்க வேண்டும்
  rationale: சடங்குசார் சூழலில் רָחַץ உடலைக் கழுவுவதைக் குறிக்கிறது. முன்பு கூறப்பட்ட உடை துவைத்தலிலிருந்து வேறுபடுத்த ‘குளிக்க’ பயன்படுத்தப்பட்டது.
- source_word: וְטָהֵר
  choice: அப்போது அவர் தூய்மையானவராவார்
  rationale: முந்தைய செயல்களுக்குப் பின் கிடைக்கும் சடங்குசார் நிலையை இச்சொற்றொடர் குறிக்கிறது. ‘அப்போது’ எபிரெய வாக்கியத் தொடரின் விளைவுசார் வரிசையை இயல்பான தமிழில் தருகிறது.
- source_word: וְאַחַר
  choice: அதன்பின்
  rationale: தூய்மைப்படுத்தும் நடைமுறையின் அடுத்த கட்டத்தைச் சுருக்கமாகவும் இயல்பாகவும் அறிமுகப்படுத்துகிறது.
- source_word: יָבֹא אֶל הַמַּחֲנֶה
  choice: அவர் பாளயத்திற்குள் வரலாம்
  rationale: அவர் தமது கூடாரத்துக்கு வெளியே தொடர்ந்து தங்க வேண்டும் என்ற அடுத்த கட்டுப்பாட்டைக் கருத்தில் கொண்டால், பாளயத்துக்குள் மீண்டும் வருவதற்கான அனுமதியாக இங்கு வாசிப்பது சூழலுக்கு ஏற்றது; எபிரெய வடிவின் நேரடி எதிர்கால/கட்டளை வாசிப்பு அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: וְיָשַׁב מִחוּץ לְאָהֳלוֹ
  choice: ஆனால் ... தன் கூடாரத்திற்கு வெளியே தங்கியிருக்க வேண்டும்
  rationale: יָשַׁב இங்கு தற்காலிகமாகத் தங்கியிருப்பதைக் குறிக்கிறது. பாளயத்திற்குள் வர அனுமதிக்கப்பட்டாலும் கூடாரத்திற்குள் செல்ல முடியாது என்ற முரணை இயல்பான தமிழில் ‘ஆனால்’ வெளிப்படுத்துகிறது; எபிரெயில் இணைப்புச் சொல் பொதுவான waw ஆகும்.
- source_word: שִׁבְעַת יָמִים
  choice: ஏழு நாட்கள்
  rationale: கால அளவைத் தமிழில் நேரடியாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: சடங்குசார் தூய்மை மொழியின் தன்மை
  choice: טהר/מטהר என்பவை ‘தூய்மைப்படுத்தப்படும்/தூய்மையானவர்’ என்று சடங்குசார் நிலையைக் குறிக்கும் வகையில் மொழிபெயர்க்கப்பட்டன.
  alternative: ‘சுத்திகரிக்கப்படும்/சுத்தமானவர்’
  rationale: இச்சூழல் தோல் நோய்க்குப் பிந்தைய லேவிய சடங்குமுறை மீட்பைப் பற்றியது; முதன்மையாக ஒழுக்க அல்லது உள்ளார்ந்த பரிசுத்தத்தைப் பற்றியது அல்ல. தேர்ந்த சொற்கள் அந்தச் சடங்குசார் நிலையைத் தக்கவைத்து, தமிழில் கண்ணியமாகவும் புரியும்படியாகவும் உள்ளன.
- issue: பாளயத்துக்குள் மீண்டும் நுழையும் வினையின் வலிமை
  choice: அனுமதிப் பொருளில் ‘வரலாம்’
  alternative: எதிர்கால/கட்டளைப் பொருளில் ‘வருவார்’ அல்லது ‘வர வேண்டும்’
  rationale: அடுத்ததாக விதிக்கப்படும் கூடாரத்திற்கு வெளியே தங்கும் கட்டுப்பாடு, பாளயத்துக்குள் வருவது இப்போது அனுமதிக்கப்படுகிறது என்ற வாசிப்பை ஆதரிக்கிறது. இருப்பினும் எபிரெய imperfect வடிவின் உண்மையான இருமை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ் பயன்படுத்தப்பட்டுள்ளது. மொழிநடை கண்ணியமானதும் சாதாரண வாசகர்களுக்குப் புரியக்கூடியதும் ஆகும். ‘பாளயம்’, ‘கூடாரம்’ ஆகியவை லேவியராகமச் சூழலின் வரலாற்று-சடங்குசார் தன்மையைத் தக்கவைக்கின்றன; ‘தூய்மை’ என்பது ஒழுக்கத் தீர்ப்பாக அல்லாமல் சடங்குசார் நிலையைக் குறிக்கிறது.
