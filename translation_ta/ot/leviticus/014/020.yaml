source:
  edition: WLC
  text: וְ/הֶעֱלָ֧ה הַ/כֹּהֵ֛ן אֶת הָ/עֹלָ֥ה וְ/אֶת הַ/מִּנְחָ֖ה הַ/מִּזְבֵּ֑חָ/ה וְ/כִפֶּ֥ר עָלָ֛י/ו הַ/כֹּהֵ֖ן וְ/טָהֵֽר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/020.yaml
  text: Then the priest shall offer up the burnt offering and the grain offering on the altar[a], and the priest shall make atonement for him, and he shall be clean.
translation:
  language: ta
  text: பின்பு ஆசாரியன் தகனபலியையும் தானியக் காணிக்கையையும் பலிபீடத்தின்மேல் செலுத்துவான். ஆசாரியன் அவனுக்காகப் பாவநிவிர்த்தி செய்வான்; அப்போது அவன் சுத்தமானவனாவான்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவன் சுத்திகரிக்கப்படுவான்.” எபிரெய மூலவாக்கியம் விளைவாக ஏற்பட்ட நிலையை இன்னும் நேரடியாக, “அவன் சுத்தமானவனாவான்” என்று கூறுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶעֱלָה
  choice: செலுத்துவான்
  rationale: עלה என்பதன் ஹிஃபில் வடிவம் பலிச் சடங்குச் சூழலில் வெறுமனே மேலே கொண்டுவருவதைக் குறிக்காமல், பலிபீடத்தில் பலியாகச் செலுத்துவதைக் குறிக்கிறது.
- source_word: הָעֹלָה
  choice: தகனபலி
  rationale: லேவியராகமத்தின் பலிச் சட்டங்களில் עֹלָה என்பது முழுவதும் எரிக்கப்படும் பலியைக் குறிக்கும் நிலையான சொல்; ‘தகனபலி’ நவீனத் தமிழில் சுருக்கமாகவும் தெளிவாகவும் உள்ளது.
- source_word: הַמִּנְחָה
  choice: தானியக் காணிக்கை
  rationale: מִנְחָה வேறு சூழல்களில் பொதுவாக அன்பளிப்பு அல்லது திறை எனப் பொருள்படலாம்; இங்குள்ள பலிச் சடங்குச் சூழலில் அது குறிப்பாகத் தானியக் காணிக்கையைக் குறிக்கிறது.
- source_word: הַמִּזְבֵּחָה
  choice: பலிபீடத்தின்மேல்
  rationale: திசையைக் குறிக்கும் இறுதி விகுதி இச்சூழலில் காணிக்கையைப் பலிபீடத்தின்மேல் செலுத்துவதைக் குறிக்கிறது.
- source_word: וְכִפֶּר עָלָיו
  choice: அவனுக்காகப் பாவநிவிர்த்தி செய்வான்
  rationale: ஆசாரிய பலிச் சூழலில் כפר என்பது ‘பாவநிவிர்த்தி செய்’ என்ற நிறுவப்பட்ட கருத்தைக் கொண்டது; עָלָיו இங்கு அந்த நபருக்காக அல்லது அவர் சார்பாக என்பதைக் குறிக்கிறது.
- source_word: וְטָהֵר
  choice: அவன் சுத்தமானவனாவான்
  rationale: கால் வடிவம் சடங்குக்குப் பின் ஏற்படும் சுத்த நிலையை நேரடியாகக் கூறுகிறது; செயப்பாட்டு முறையான ‘சுத்திகரிக்கப்படுவான்’ என்பதைக் காட்டிலும் எபிரெய வடிவத்தை இது நெருக்கமாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: ஆசாரியச் சட்டத்தில் ‘சுத்தம்’ என்பதன் இயல்பு
  choice: சடங்குமுறை சார்ந்த சுத்த நிலையைச் சுட்டும் ‘சுத்தமானவனாவான்’
  alternative: ஒழுக்கரீதியாகத் தூயவனாவான்
  rationale: லேவியராகமம் 14-ன் சூழல் தோல் நோயால் ஏற்பட்ட தீட்டுக்குப் பின் ஒருவரைச் சடங்குமுறையில் மீண்டும் ஏற்றுக்கொள்வதாகும். ஆகவே மூலவசனம் கூறாத ஒழுக்க மாற்றத்தை மொழிபெயர்ப்பில் சேர்க்காமல், அதன் சடங்குமுறை நிலையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளக்கூடிய மரியாதைமிக்க நடையில் மொழிபெயர்க்கப்பட்டது. ‘தகனபலி,’ ‘தானியக் காணிக்கை,’ ‘பலிபீடம்,’ ‘பாவநிவிர்த்தி’ ஆகியவை ஆசாரியச் சடங்கின் தனித்துவத்தைத் தக்கவைக்கும் சொற்களாகப் பயன்படுத்தப்பட்டுள்ளன.
