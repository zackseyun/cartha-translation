  source_fidelity: 'வசனம் எபிரெய மூலத்தின் தொடர்ச்சியையும் பொருளையும் துல்லியமாகப் பாதுகாக்கிறது: ஆசாரியன் தகனபலியையும் தானியக் காணிக்கையையும் பலிபீடத்தின்மேல் செலுத்துதல், அந்த நபருக்காகப் பாவநிவிர்த்தி செய்தல், அதன் விளைவாக அவன் சுத்தநிலையை அடைதல் ஆகிய அனைத்தும் இடம்பெற்றுள்ளன. וְטָהֵר என்பதன் விளைவுநிலையை ‘சுத்தமானவனாவான்’ எனக் கொடுத்திருப்பது பொருத்தமானது.'
