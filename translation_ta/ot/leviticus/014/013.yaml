base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/013.yaml
  text: And he shall slaughter the lamb in the place where they slaughter the sin offering and the burnt offering[a], in the holy place; for like the sin offering, the guilt offering belongs to the priest[b]; it is most holy.
translation:
  language: ta
  text: அவன் அந்தச் செம்மறியாட்டுக் குட்டியை, பாவநிவாரணப் பலியையும்[a] தகனப் பலியையும் அறுக்கிற பரிசுத்த இடத்தில் அறுக்க வேண்டும். ஏனெனில், பாவநிவாரணப் பலியைப் போலவே குற்றநிவாரணப் பலியும்[b] ஆசாரியனுக்குரியது; அது மகா பரிசுத்தமானது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பாவநிவாரணப் பலி’ என்பதற்குப் பதிலாக ‘சுத்திகரிப்புப் பலி’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் חַטָּאת; ஆசாரியச் சட்டங்களில் சடங்குச் சுத்திகரிப்பை இது வலியுறுத்தக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: ‘குற்றநிவாரணப் பலி’ என்பதற்குப் பதிலாக ‘இழப்பீட்டுப் பலி’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் אָשָׁם; இப்பெயர் பலியோடு தொடர்புடைய ஈடு செய்யும் அம்சத்தை வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁחַט
  choice: அறுக்க வேண்டும்
  rationale: שׁחט பலிச் சடங்கில் முறைப்படி விலங்கை அறுப்பதைக் குறிக்கிறது; ‘கொல்ல’ என்பதைவிட ‘அறுக்க’ என்பது சடங்குச் சூழலைத் தெளிவாகக் காக்கிறது.
- source_word: הַכֶּבֶשׂ
  choice: அந்த ஆட்டுக்குட்டி
  rationale: כֶּבֶשׂ பொதுவாகப் பலிக்குரிய இளம் செம்மறியாட்டைக் குறிக்கிறது; முந்தைய சூழலில் குறிப்பிடப்பட்ட விலங்கைக் காட்ட உருபுடன் ‘அந்த’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: בִּמְקוֹם אֲשֶׁר יִשְׁחַט
  choice: அறுக்கிற ... இடத்திலேயே
  rationale: יִשְׁחַט சட்ட மொழியில் பொதுவான செயற்பாட்டைக் குறிக்கலாம். தமிழில் எழுவாயைக் குறிப்பிடாமல் ‘அறுக்கிற இடம்’ எனச் சொல்வது இயல்பாகவும் மூலத்தின் பொதுப்பொருளுக்கு நெருக்கமாகவும் உள்ளது; ‘-லேயே’ ஒரே நியமிக்கப்பட்ட இடம் என்ற தொடர்பை வெளிப்படுத்துகிறது.
- source_word: הַחַטָּאת
  choice: பாவநிவாரணப் பலி
  rationale: חַטָּאת என்பது பாவத்துடன் தொடர்புடைய பலிவகையின் மரபான பெயர்; ‘பாவநிவாரணப் பலி’ நவீனத் தமிழில் அதன் பலிசார் வகையைத் தெளிவாகக் காட்டுகிறது. சுத்திகரிப்புச் செயல்பாட்டை வலியுறுத்தும் மாற்றுப் பெயர் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: הָעֹלָה
  choice: தகனப் பலி
  rationale: עֹלָה முழுமையாக எரிக்கப்படும் பலிவகைக்கான நிலையான சொல்; ‘தகனப் பலி’ சுருக்கமாகவும் வழக்கில் அறியப்பட்டதாகவும் உள்ளது.
- source_word: בִּמְקוֹם הַקֹּדֶשׁ
  choice: பரிசுத்த இடத்தில்
  rationale: குறிப்பிட்ட பலியறுப்பு நடைபெறும் புனிதப் பகுதியைக் குறிக்கிறது; ‘பரிசுத்த இடம்’ சடங்குச் சட்டத்தின் தொழில்நுட்பத் தன்மையைப் பேணுகிறது.
- source_word: כִּי כַּחַטָּאת הָאָשָׁם הוּא לַכֹּהֵן
  choice: ஏனெனில், பாவநிவாரணப் பலியைப் போலவே குற்றநிவாரணப் பலியும் ஆசாரியனுக்குரியது
  rationale: כַּחַטָּאת ஒப்புமையையும் לַכֹּהֵן ஆசாரியரின் உரிமையையும் குறிக்கின்றன. ‘ஆசாரியனுக்குரியது’ உரிமைப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: הָאָשָׁם
  choice: குற்றநிவாரணப் பலி
  rationale: אָשָׁם குற்றம் அல்லது பொறுப்புடன் தொடர்புடைய பலிவகை. ‘குற்றநிவாரணப் பலி’ அதன் வழிபாட்டுச் வகையைத் தெளிவுபடுத்துகிறது; இழப்பீட்டு அம்சத்தை வலியுறுத்தும் மாற்று அடிக்குறிப்பில் உள்ளது.
- source_word: קֹדֶשׁ קָדָשִׁים הוּא
  choice: அது மகா பரிசுத்தமானது
  rationale: קֹדֶשׁ קָדָשִׁים எபிரெய மொழியின் வலியுறுத்தும் உயர்நிலை அமைப்பு; ‘மகா பரிசுத்தமானது’ பலிச் சட்டத்தில் உள்ள மிக உயர்ந்த பரிசுத்த வகைப்பாட்டைப் பேணுகிறது.
theological_decisions:
- issue: ஆசாரியச் சட்டங்களில் חַטָּאת என்பதன் மொழிபெயர்ப்பு
  choice: பாவநிவாரணப் பலி
  alternative: சுத்திகரிப்புப் பலி
  rationale: இச்சொல் பாவத்தையும் சடங்குச் சுத்திகரிப்பையும் தொடர்புபடுத்த முடியும். அறியப்பட்ட பலிவகைப் பெயராக ‘பாவநிவாரணப் பலி’ முதன்மை உரையில் வைக்கப்பட்டு, சுத்திகரிப்புச் செயல்பாட்டை வலியுறுத்தும் உண்மையான மாற்று அடிக்குறிப்பில் காக்கப்படுகிறது.
- issue: אָשָׁם என்பதன் மொழிபெயர்ப்பு
  choice: குற்றநிவாரணப் பலி
  alternative: இழப்பீட்டுப் பலி
  rationale: இங்கு அது חַטָּאת உடன் ஒப்பிடப்படும் தனிப்பட்ட பலிவகை. ‘குற்றநிவாரணப் பலி’ அதன் குற்றப்பொறுப்பு சார்ந்த வகையைப் பேணுகிறது; சில சூழல்களில் உள்ள ஈடு அல்லது இழப்பீட்டு அம்சம் மாற்று மொழிபெயர்ப்பாக அடிக்குறிப்பில் தரப்படுகிறது.
- issue: לַכֹּהֵן என்பதில் உரிமை அல்லது ஒதுக்கீடு
  choice: ஆசாரியனுக்குரியது
  alternative: ஆசாரியனுக்கானது
  rationale: இரண்டும் சாத்தியம்; இச்சூழலில் பலியின் ஆசாரியப் பங்கையும் உரிமையையும் ‘உரியது’ தெளிவாக வெளிப்படுத்துகிறது, ஆனால் அதற்கு மேல் எந்தச் சமயக்கோட்பாட்டையும் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதைமிக்க ஆனால் பொதுவாசகர்களுக்குப் புரியும் சட்ட-வழிபாட்டு நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆசாரியன்’, ‘தகனப் பலி’, ‘பரிசுத்தம்’ போன்ற நிலைபெற்ற வேதாகமச் சொற்கள் தொடர்ச்சிக்காக வைக்கப்பட்டுள்ளன. மூலத்தில் உள்ள பொதுவான ஒருமை வினையின் எழுவாய் தீர்மானிக்கப்படாமல், தமிழில் ‘அறுக்கிற இடம்’ என இயல்பாக விடப்பட்டுள்ளது.
