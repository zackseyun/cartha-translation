revisions:
- from: அவன் அந்த ஆட்டுக்குட்டியை, பாவநிவாரணப் பலியையும்[a] தகனப் பலியையும் அறுக்கிற பரிசுத்த இடத்திலேயே அறுக்க வேண்டும். ஏனெனில், பாவநிவாரணப் பலியைப் போலவே குற்றநிவாரணப் பலியும்[b] ஆசாரியனுக்குரியது; அது மகா பரிசுத்தமானது.
  to: அவன் அந்தச் செம்மறியாட்டுக் குட்டியை, பாவநிவாரணப் பலியையும்[a] தகனப் பலியையும் அறுக்கிற பரிசுத்த இடத்தில் அறுக்க வேண்டும். ஏனெனில், பாவநிவாரணப் பலியைப் போலவே குற்றநிவாரணப் பலியும்[b] ஆசாரியனுக்குரியது; அது மகா பரிசுத்தமானது.
  rationale: The revision corrects the animal term so that the Tamil explicitly denotes a lamb/young sheep rather than a potentially caprine ‘kid,’ and removes a minor added locative emphasis. No theological or interpretive change has been made; the lexical-alternative footnotes remain appropriately anchored and retain the source ambiguity.
