  yaml_path: translation/ot/leviticus/014/043.yaml
  text: But if the disease returns and breaks out in the house after he has removed the stones[a], and after he has scraped the house, and after it has been plastered,
translation:
  language: ta
  text: ஆனால், கற்கள் அகற்றப்பட்டு, வீடு சுரண்டப்பட்டு, சாந்து பூசப்பட்ட பிறகு, அந்தப் பாதிப்பு[a] மீண்டும் வந்து வீட்டில் வெளிப்பட்டால்,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பாதிப்பு’ என்பதற்கு ‘தொற்று’ அல்லது ‘பீடை’ என்றும் மொழிபெயர்க்கலாம். எபிரெய மொழியில் நெகா (נֶגַע) என்பது மனிதர்கள், ஆடைகள் அல்லது வீடுகளைப் பாதிக்கும் அடையாளமுள்ள கேடான நிலையைக் குறிக்க லேவியராகமத்தில் பயன்படுத்தப்படும் தொழில்நுட்பச் சொல்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: ஆனால் ... என்றால்
  rationale: முந்தைய நடைமுறைக்குப் பின் ஏற்படக்கூடிய வேறொரு நிலையை அறிமுகப்படுத்தும் நிபந்தனைத் தொடராக இருப்பதால், இணைப்பையும் மாறுபாட்டையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יָשׁוּב
  choice: திரும்ப வந்து
  rationale: שוב இங்கு பாதிப்பு மீண்டும் தோன்றுவதைக் குறிக்கிறது; இந்தத் தேர்வு அதன் மறுநிகழ்வைத் தெளிவாகக் காட்டுகிறது.
- source_word: הַנֶּגַע
  choice: அந்தப் பாதிப்பு
  rationale: נגע என்பது லேவியராகமத்தில் மனிதர்கள், ஆடைகள், வீடுகள் ஆகியவற்றில் காணப்படும் அடையாளமுள்ள கேடான நிலைக்கான தொழில்நுட்பச் சொல். வீட்டைப் பற்றிய சூழலில் ‘பாதிப்பு’ என்பது நோய் என மிகக் குறுகலாக வரையறுக்காமல் பொருளைப் பாதுகாக்கிறது.
- source_word: וּפָרַח
  choice: பரவினால்
  rationale: פרח என்பதன் அடிப்படை உருவகம் துளிர்த்தல் அல்லது வெடித்தெழுதல்; இங்கு வீட்டுப் பாதிப்பு மீண்டும் வெளிப்பட்டு விரிவடைவதை இயல்பான தமிழில் ‘பரவுதல்’ தெரிவிக்கிறது.
- source_word: בַּבַּיִת
  choice: வீட்டில்
  rationale: ב என்ற இடப்பொருள் முன்னிடைச்சொல்லை நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: אַחַר חִלֵּץ אֶת־הָאֲבָנִים
  choice: கற்கள் அகற்றப்பட்டு ... பிறகு
  rationale: முன்னர் கட்டளையிடப்பட்ட கற்களைப் பிடுங்கி அகற்றும் செயலைக் குறிக்கிறது. தமிழில் செயப்படுபொருள் வடிவம், எபிரெய உரையில் வெளிப்படையாகக் குறிப்பிடப்படாத செய்பவரை தேவையின்றிச் சேர்க்காமல் இருக்கிறது.
- source_word: וְאַחֲרֵי הִקְצוֹת אֶת־הַבַּיִת
  choice: வீடு சுரண்டப்பட்டு
  rationale: קצה இங்கு வீட்டின் மேற்பரப்புகளை உரித்துச் சுரண்டும் உடல்சார்ந்த செயலைக் குறிக்கிறது; பொதுவான ‘சுத்தம் செய்தல்’ என்பதைக் காட்டிலும் ‘சுரண்டுதல்’ மூலச்செயலைத் துல்லியமாகக் காக்கிறது.
- source_word: וְאַחֲרֵי הִטּוֹחַ
  choice: சாந்து பூசப்பட்ட பிறகு
  rationale: טוח என்பது சுரண்டிய பின் வீட்டுக்குச் சாந்து அல்லது பூச்சு இடுவதைக் குறிக்கிறது. செய்பவர் வெளிப்படையாக இல்லாததால் செயப்பாட்டு வடிவம் பொருத்தமானது.
