    issue: Ambiguous antecedent for அவற்றையும்
    rationale: Because the living bird appears in the preceding list, அவற்றையும் may include it, even though the Hebrew construction distinguishes the listed materials (אותם) from the additionally named living bird. An explicit noun phrase removes this ambiguity.
  - severity: low
    issue: Footnote alternative does not include the contextual sense ‘fresh water’
    rationale: The existing note gives the literal rendering and ‘running water,’ but adding ‘fresh water’ better reflects the lexical range and the English audit trail without narrowing the main text.
