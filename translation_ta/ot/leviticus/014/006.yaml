  text: אֶת הַ/צִּפֹּ֤ר הַֽ/חַיָּה֙ יִקַּ֣ח אֹתָ֔/הּ וְ/אֶת עֵ֥ץ הָ/אֶ֛רֶז וְ/אֶת שְׁנִ֥י הַ/תּוֹלַ֖עַת וְ/אֶת הָ/אֵזֹ֑ב וְ/טָבַ֨ל אוֹתָ֜/ם וְ/אֵ֣ת הַ/צִּפֹּ֣ר הַֽ/חַיָּ֗ה בְּ/דַם֙ הַ/צִּפֹּ֣ר הַ/שְּׁחֻטָ֔ה עַ֖ל הַ/מַּ֥יִם הַֽ/חַיִּֽים־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/006.yaml
  text: As for the living bird, he shall take it, along with the cedar wood, the scarlet yarn, and the hyssop, and dip them and the living bird in the blood of the bird that was slaughtered over the fresh water.
translation:
  language: ta
  text: உயிருள்ள பறவையையும் கேதுரு மரத்துண்டையும் செந்நூலையும் ஈசோப்புச் செடியையும் அவன் எடுத்து, அந்தப் பொருட்களையும் உயிருள்ள பறவையையும், ஓடும் நீரின் மேல் அறுக்கப்பட்ட பறவையின் இரத்தத்தில் தோய்க்க வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லர்த்தமாக, “உயிருள்ள நீர்”; “ஊற்றுநீர்” அல்லது “புதுநீர்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצִּפֹּר הַחַיָּה
  choice: உயிருள்ள பறவை
  rationale: சடங்கில் அறுக்கப்பட்ட பறவைக்கு எதிராக உயிரோடிருக்கும் பறவையைக் குறிக்கிறது; எபிரெயச் சொல்லமைப்பையும் வேறுபாட்டையும் இயல்பாகப் பாதுகாக்கிறது.
- source_word: יִקַּח
  choice: எடுத்து ... வேண்டும்
  rationale: இங்கு imperfect வடிவம் சடங்குச் சட்டத்தின் கட்டளையைக் குறிக்கிறது; நவீனத் தமிழில் ‘வேண்டும்’ அந்த விதிப்பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: עֵץ הָאֶרֶז
  choice: கேதுரு மரத்துண்டு
  rationale: சடங்கில் பயன்படுத்தப்படும் கேதுரு மரப்பொருளைக் குறிக்கிறது; ‘மரத்துண்டு’ என்பது பொருளை இயல்பாகத் தெளிவுபடுத்துகிறது.
- source_word: שְׁנִי הַתּוֹלַעַת
  choice: செந்நூல்
  rationale: புழுவிலிருந்து பெறப்பட்ட செந்நிறச் சாயம் ஏற்றப்பட்ட நூல் அல்லது நார்ப்பொருளைக் குறிக்கும் மரபுத்தொடருக்கு சுருக்கமான, புரியத்தக்க தமிழ்.
- source_word: הָאֵזֹב
  choice: ஈசோப்புச் செடி
  rationale: தாவரத்தின் துல்லியமான அடையாளம் விவாதத்திற்குரியதாக இருந்தாலும், சடங்குத் தாவரத்திற்கான வெளிப்படையான மரபுப் பெயரைப் பாதுகாக்கிறது.
- source_word: וְטָבַל
  choice: தோய்க்க வேண்டும்
  rationale: ஒரு திரவத்தில் பொருட்களை நனைத்தெடுக்கும் சடங்குச் செயலை இயல்பான தமிழில் குறிக்கிறது.
- source_word: בְּדַם הַצִּפֹּר הַשְּׁחֻטָה
  choice: அறுக்கப்பட்ட பறவையின் இரத்தத்தில்
  rationale: שׁחט என்பதன் சடங்குசார் அறுத்தல் பொருளைப் பாதுகாத்து, בְּ என்பதைக் ‘இரத்தத்தில்’ என வழங்குகிறது.
- source_word: עַל הַמַּיִם הַחַיִּים
  choice: ஊற்றுநீரின் மேல்
  rationale: சொல்லர்த்தமான ‘உயிருள்ள நீர்’ என்பது தேங்காத, இயற்கையாகப் புதிதாக வரும் நீரைக் குறிக்கிறது; ‘ஊற்றுநீர்’ அந்தச் சூழற்பொருளைத் தமிழில் இயல்பாகக் கூறுகிறது, மாற்றுகள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
theological_decisions:
- issue: מַיִם חַיִּים என்ற சடங்குத் தூய்மைத் தொடரின் மொழிபெயர்ப்பு
  choice: ஊற்றுநீர்
  alternative: உயிருள்ள நீர்; ஓடும் நீர்
  rationale: இத்தொடர் தேங்கிய நீருக்கு மாறாக இயற்கையாகப் புதிதாக வரும் அல்லது ஓடும் நீரைக் குறிக்கிறது. ‘உயிருள்ள நீர்’ என்ற சொல்லர்த்த வடிவம் பிற சூழல்களின் இறையியல் தொடர்புகளைத் தேவையின்றி இங்கு முன்வைக்கக்கூடும்; ஆகவே முதன்மை உரையில் இயல்பான சூழற்பொருளும், அடிக்குறிப்பில் சொல்லர்த்தமும் மாற்றும் தரப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், கண்ணியமான சட்ட-சடங்கு நடையில் மொழிபெயர்க்கப்பட்டது. பொருட்களின் பட்டியலும் உயிருள்ள பறவைக்கும் அறுக்கப்பட்ட பறவைக்கும் இடையிலான வேறுபாடும் தெளிவாகப் பாதுகாக்கப்பட்டுள்ளன.
