- from: ஆசாரியன் முகாமுக்கு வெளியே சென்று, அவரைப் பரிசோதிக்க வேண்டும். தோல் நோயால் பாதிக்கப்பட்டவரிடமிருந்து அந்தத் தோல் நோயின் பாதிப்பு குணமாகியிருப்பதை ஆசாரியன் கண்டால்,[a]
  to: ஆசாரியன் முகாமுக்கு வெளியே செல்ல வேண்டும்; ஆசாரியன் அவரைப் பரிசோதிக்க வேண்டும். இதோ, தோல் நோயின் பாதிப்பு அந்தத் தோல் நோயால் பாதிக்கப்பட்டவரிடமிருந்து நீங்கிக் குணமாகியிருப்பதைக் கண்டால்,[a]
  rationale: The revision restores the repeated priestly action, distinguishes inspection from the resulting observation, and gives וְהִנֵּה a corresponding presentative force with ‘இதோ.’ ‘நீங்கிக் குணமாகியிருப்பது’ preserves both the passive/resultative healing and the Hebrew מִן (‘from’) without implying a modern medical diagnosis.
