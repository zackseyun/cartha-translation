base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/003.yaml
  text: The priest shall go out to a place outside the camp[a], and the priest shall examine him; and behold, the disease of leprosy has been healed in the one with the skin disease,
translation:
  language: ta
  text: ஆசாரியன் முகாமுக்கு வெளியே செல்ல வேண்டும்; ஆசாரியன் அவரைப் பரிசோதிக்க வேண்டும். இதோ, தோல் நோயின் பாதிப்பு அந்தத் தோல் நோயால் பாதிக்கப்பட்டவரிடமிருந்து நீங்கிக் குணமாகியிருப்பதைக் கண்டால்,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மரபுவழியாக, “தொழுநோயின் பாதிப்பு தொழுநோயாளியிடமிருந்து குணமாகியிருந்தால்” என மொழிபெயர்க்கப்படுகிறது. இங்குள்ள எபிரெயச் சொற்கள் நவீன தொழுநோயை மட்டும் அல்லாமல், விரிவான தோல் நோய் அல்லது தோல் பாதிப்பைக் குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וְיָצָא
  choice: சென்று
  rationale: சடங்குச் சட்டத்தின் தொடர்ச்சியான கட்டளைச் சூழலில், அடுத்த செயலைக் குறிக்கும் இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: הַכֹּהֵן
  choice: ஆசாரியன்
  rationale: ஆலய மற்றும் சடங்குச் சட்டச் சூழலில் כֹּהֵן என்பதற்கான நிலையான, பொதுவாகப் புரியக்கூடிய தமிழ் சொல்.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: முகாமுக்கு வெளியே
  rationale: אֶל குறிக்கும் வெளியை நோக்கிய இயக்கத்தையும் מִחוּץ לַמַּחֲנֶה என்பதன் இடத்தையும் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וְרָאָה
  choice: பரிசோதிக்க வேண்டும் … கண்டால்
  rationale: ראה என்பதன் அடிப்படைப் பொருள் ‘பார்’; இச்சட்டச் சூழலில் அது ஆய்ந்து மதிப்பிடுவதைக் குறிக்கிறது. எபிரெயச் சொல்லின் பரிசோதனைச் செயலும் அதன் முடிவைக் காணுதலும் தமிழில் இயல்பாக வெளிப்படுகின்றன.
- source_word: וְהִנֵּה
  choice: கண்டால்
  rationale: சொல்லுக்கு நெருக்கமாக ‘இதோ’ என்றாலும், இங்கு பரிசோதனையில் தெரியவரும் நிலையை அறிமுகப்படுத்துகிறது; நடைமுறைச் சட்டத் தமிழில் ‘கண்டால்’ அதன் செயல்பாட்டைத் தெளிவாகக் காட்டுகிறது.
- source_word: נִרְפָּא
  choice: குணமாகியிருப்பதை
  rationale: நிப்அல் வடிவத்தின் செயல்பாட்டுக்கு உட்பட்ட, விளைவுநிலையைத் தெரிவிக்கும் பொருளைத் தக்கவைக்கிறது.
- source_word: נֶגַע הַצָּרַעַת
  choice: அந்தத் தோல் நோயின் பாதிப்பு
  rationale: נֶגַע என்பது பாதிப்பு அல்லது நோய்க்குறியையும், צָרַעַת என்பது நவீன தொழுநோயுடன் மட்டும் ஒப்பிட முடியாத விரிவான தோல் பாதிப்பையும் குறிக்கலாம்.
- source_word: מִן הַצָּרוּעַ
  choice: தோல் நோயால் பாதிக்கப்பட்டவரிடமிருந்து
  rationale: מִן குறிக்கும் பிரிவு அல்லது நீக்கத்தை வெளிப்படையாகத் தக்கவைத்து, பாதிக்கப்பட்ட நபரைக் கண்ணியமான மொழியில் குறிப்பிடுகிறது.
theological_decisions:
- issue: צָרַעַת / צָרוּעַ என்பவற்றின் மொழிபெயர்ப்பு
  choice: தோல் நோய் / தோல் நோயால் பாதிக்கப்பட்டவர்
  alternative: தொழுநோய் / தொழுநோயாளர்
  rationale: வேதாகம எபிரெயச் சொல் பலவகையான தோல் பாதிப்புகளையும் சடங்குத் தீட்டுடன் தொடர்புடைய நிலைகளையும் குறிக்கக்கூடும்; அதை நவீன ஹான்சன் நோயுடன் மட்டும் அடையாளப்படுத்துவது தேவையற்ற மருத்துவத் துல்லியத்தை இறக்குமதி செய்யும்.
- issue: וְהִנֵּה என்பதன் சட்டச் சூழல்
  choice: கண்டால்
  alternative: இதோ
  rationale: ‘இதோ’ என்பது வடிவத்துக்கு நெருக்கமானது; ஆனால் இங்கு ஆசாரியனின் பரிசோதனையில் உறுதியாகும் நிலையே கருத்து. நிபந்தனைத் தோற்றத்தை அளித்தாலும், ‘கண்டால்’ சட்ட நடைமுறையை இயல்பாகத் தெரிவிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சடங்குச் சட்டத்துக்கேற்ற கண்ணியமான, தெளிவான நடை. எபிரெய மூலத்தின் மீளுரைப்பை ஓரளவு தக்கவைத்தாலும், தமிழ் வாக்கிய ஓட்டத்திற்காக இரண்டாவது ‘ஆசாரியன்’ பின்னர் அமைக்கப்பட்டுள்ளது. வசனம் அடுத்த வசனத்தில் தொடர்வதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
