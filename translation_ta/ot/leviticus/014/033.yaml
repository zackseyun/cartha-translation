    text: 'எபிரெயம்: ‘YHWH’ (יהוה); மரபாக ‘கர்த்தர்’ என்று மொழிபெயர்க்கப்படுகிறது.'
    reason: மூலத்தில் உள்ள இறைத் திருப்பெயரையும் மரபான மாற்று மொழிபெயர்ப்பையும் தெரிவிக்கிறது.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பேசியதாவது
  rationale: தொடர்ந்து வரும் நேரடிக் கூற்றை அறிமுகப்படுத்தும் எபிரெயக் கதையாடல் வாய்பாட்டை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; தனியாக ‘பேசி, கூறினார்’ என்று மீளுரைப்பதைத் தவிர்க்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: இறைத் திருப்பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: மோசேயிடமும் ஆரோனிடமும்
  rationale: இருவரும் உரையின் நேரடி பெறுநர்கள் என்பதை இணையான ‘-இடமும்’ அமைப்பு தெளிவாகக் காட்டுகிறது.
- source_word: לֵאמֹר
  choice: 'பேசியதாவது:'
  rationale: நேரடிப் பேச்சை அறிமுகப்படுத்தும் எபிரெய வாய்பாட்டின் செயல்பாட்டைத் தமிழில் இயல்பாகக் காட்டுகிறது; இரட்டைப் பேச்சுவினை அமைப்பைத் தவிர்க்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் உள்ள தனிப்பட்ட இறைத் திருப்பெயரை ‘கர்த்தர்’ என்ற பட்டத்தால் மாற்றாமல் ஒலிபெயர்க்கிறது. ‘யாவே’ என்பது சாத்தியமான மற்றொரு ஒலிப்புமுறை; எபிரெய உயிரொலிகள் உறுதியாகத் தெரியாததால் அதைக் குறிப்பில் தெரிவிக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையுடன், அடுத்த வசனத்தில் வரும் நேரடிப் பேச்சை இயல்பாக அறிமுகப்படுத்தும் சுருக்கமான வாய்பாடு பயன்படுத்தப்பட்டுள்ளது.
