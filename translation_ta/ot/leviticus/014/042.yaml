  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/לָקְחוּ֙ אֲבָנִ֣ים אֲחֵר֔וֹת וְ/הֵבִ֖יאוּ אֶל תַּ֣חַת הָ/אֲבָנִ֑ים וְ/עָפָ֥ר אַחֵ֛ר יִקַּ֖ח וְ/טָ֥ח אֶת הַ/בָּֽיִת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/042.yaml
  text: Then they shall take other stones and bring them in place of the stones[b][a], and he shall take other mortar and plaster the house.
translation:
  language: ta
  text: பின்பு அவர்கள் வேறு கற்களை எடுத்து, அந்தக் கற்களுக்குப் பதிலாக அவற்றைக் கொண்டுவர வேண்டும்[b]; அவன் வேறு சாந்தை[a] எடுத்து வீட்டிற்குப் பூச வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வேறு மண் கலவையை’; சொல்லுக்கு சொல், ‘வேறு தூசியை/மண்ணை.’ எபிரெயச் சொல், கற்கள் மாற்றப்பட்டபின் வீட்டை மீண்டும் பூசப் பயன்படுத்தப்படும் பொருளைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்கு சொல், ‘அந்தக் கற்களின் கீழே.’ இங்கு இது ‘அந்தக் கற்களுக்குப் பதிலாக’ அல்லது ‘அந்தக் கற்களை மாற்றுவதற்காக’ என்று பொருள்படும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקְחוּ
  choice: பின்பு அவர்கள் ... எடுக்க வேண்டும்
  rationale: சடங்குச் சட்டத்தின் தொடர் நடவடிக்கையை முன்னிலைப்படுத்தும் இணைப்புடன் கூடிய வினை; ‘பின்பு’ அதன் தொடர் பொருளையும், ‘வேண்டும்’ கட்டளையின் வலிமையையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகின்றன.
- source_word: אֲבָנִים אֲחֵרוֹת
  choice: வேறு கற்கள்
  rationale: முன்பு அகற்றப்பட்ட கற்களுக்குப் பதிலாகப் பயன்படுத்தப்படும் கற்கள் என்பதைக் கூடுதல் விளக்கமின்றி நேராகத் தருகிறது.
- source_word: וְהֵבִיאוּ אֶל תַּחַת הָאֲבָנִים
  choice: அந்தக் கற்களுக்குப் பதிலாக அவற்றைக் கொண்டுவர வேண்டும்
  rationale: תַּחַת இங்கு உடல்சார் ‘கீழே’ என்ற பொருளில் அல்லாமல் மாற்றீட்டைக் குறிக்கும் மரபுத்தொடராக உள்ளது; ‘பதிலாக’ சூழலுக்கேற்ற பொருளைத் தருகிறது.
- source_word: וְעָפָר אַחֵר
  choice: வேறு சாந்து
  rationale: עָפָר என்பதன் அடிப்படைப் பொருள் ‘தூசி/மண்’ என்றாலும், இச்சூழலில் வீட்டை மீண்டும் பூசப் பயன்படும் மண் சார்ந்த கட்டுமானக் கலவையைக் குறிக்கிறது; ‘சாந்து’ அதன் செயற்பாட்டுப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יִקַּח
  choice: அவன் ... எடுக்க வேண்டும்
  rationale: எபிரெய வினை மூன்றாம் நபர் ஆண்பால் ஒருமையில் உள்ளது. முந்தைய பன்மையிலிருந்து ஒருமைக்கு வரும் மாற்றத்தை ஒத்திசைத்து நீக்காமல் தமிழிலும் பாதுகாக்கிறது.
- source_word: וְטָח אֶת הַבָּיִת
  choice: வீட்டிற்குப் பூச வேண்டும்
  rationale: טוח என்பது வீட்டின் பரப்பில் சாந்து பூசுவதைக் குறிக்கிறது; ‘பூச வேண்டும்’ நவீன தமிழில் இயல்பானதும் சூழலுக்குத் துல்லியமானதும் ஆகும்.
