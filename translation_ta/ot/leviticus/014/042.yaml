translation_notes:
  register: நவீன தரத் தமிழில், சடங்குச் சட்டத்திற்கேற்ற கண்ணியமான கட்டளைநடை பயன்படுத்தப்பட்டது. எபிரெய மூலத்தில் உள்ள பன்மை (‘அவர்கள்’) முதல் ஒருமை (‘அவன்’) வரையிலான மாற்றம் திட்டமிட்டு அப்படியே வைக்கப்பட்டது; மாற்றீட்டைக் குறிக்கும் மரபுத்தொடரும், עָפָר என்பதன் பொருட்சார் நுணுக்கமும் அடிக்குறிப்புகளில் பதிவு செய்யப்பட்டன.
