revisions:
- from: பின்பு ஆசாரியன் வந்து ஆராய்ந்து பார்ப்பான். அந்தப் பாதிப்பு வீட்டில் பரவியிருப்பது உறுதியானால், அது வீட்டிலுள்ள அழிவுண்டாக்கும் தொழுநோய்[a]; அந்த வீடு தீட்டானது.
  to: பின்பு ஆசாரியன் வந்து பரிசோதிப்பான். வீட்டில் அந்தப் பாதிப்பு பரவியிருப்பதைக் கண்டால், அது வீட்டில் உள்ள அழிவுண்டாக்கும் தொழுநோய்ப் பாதிப்பு[a]; அந்த வீடு தீட்டானது.
  rationale: The revision preserves the legal-procedural sequence and the Hebrew's deliberately broad ritual-affliction terminology. It replaces a certainty-based conditional with the priest's observed finding, improves Tamil syntax, and removes the unsupported biological identification “பூஞ்சை” from the footnote. The final clause explicitly identifies the house as ritually unclean, as required by the antecedent in context.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T09:16:40Z'
review_pass:
  verdict: revise
  source_fidelity: The procedural future sense is correctly represented, and the priest's examination, the spread of the affliction, its serious/ruinous characterization, and the house's ritual uncleanness are all retained. However, “உறுதியானால்” shifts the observation to a condition of certainty rather than the priest's finding, and the wording around the house-affliction category can be made more faithful and idiomatic. The footnote's proposed “பூஞ்சை” alternative identifies the phenomenon as fungus/mildew, which the Hebrew does not specify.
  naturalness: “ஆராய்ந்து பார்ப்பான்” is understandable but somewhat redundant in this legal diagnostic setting; “பரிசோதிப்பான்” is natural and precise. “வீட்டிலுள்ள அழிவுண்டாக்கும் தொழுநோய்” is syntactically awkward because it can sound like a modern human disease located in a house. Explicitly calling it a “தொழுநோய்ப் பாதிப்பு” improves readability while retaining the traditional category term.
  terminology: “ஆசாரியன்” and “தீட்டானது” suit the established Levitical register. “தொழுநோய்” requires the supplied qualification because צָרַעַת is a ritual category and is applied to houses. “பூஞ்சை” should not be offered as an alternative, since it imports a biological diagnosis absent from the source. “அழிவுண்டாக்கும்” adequately conveys מַמְאֶרֶת without asserting a medical diagnosis.
  issues:
  - severity: medium
    issue: “உறுதியானால்” does not directly represent the priest's observed finding.
    rationale: וְרָאָה וְהִנֵּה introduces what the priest sees on inspection. “பரவியிருப்பதைக் கண்டால்” expresses both the examination and the observed condition without adding an evidentiary threshold of certainty.
  - severity: medium
    issue: The footnote offers “அழிவுண்டாக்கும் பூஞ்சை” as a translation alternative.
    rationale: צָרַעַת in a house is not explicitly identified as fungus or mildew in the Hebrew. Such wording may be used interpretively in some translations, but it should not be presented as a lexical alternative to the source term.
  - severity: low
    issue: “வீட்டிலுள்ள அழிவுண்டாக்கும் தொழுநோய்” is potentially awkward and medically misleading.
    rationale: Describing it as a “தொழுநோய்ப் பாதிப்பு” and retaining the explanatory footnote better signals a ritual-affliction category applied to a house.
