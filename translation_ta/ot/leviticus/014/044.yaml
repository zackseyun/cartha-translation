  text: then the priest shall come and inspect[a], and if indeed the infection has spread in the house, it is a destructive mildew in the house[b]; it is unclean.
translation:
  language: ta
  text: பின்பு ஆசாரியன் வந்து பரிசோதிப்பான். வீட்டில் அந்தப் பாதிப்பு பரவியிருப்பதைக் கண்டால், அது வீட்டில் உள்ள அழிவுண்டாக்கும் தொழுநோய்ப் பாதிப்பு[a]; அந்த வீடு தீட்டானது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு “தொழுநோய்ப் பாதிப்பு” என்று மொழிபெயர்க்கப்பட்ட எபிரெயச் சொல் நவீன மருத்துவத்தில் சொல்லப்படும் தொழுநோயை மட்டும் குறிக்காது. மனிதர்கள், ஆடைகள், வீடுகள் ஆகியவற்றில் காணப்படும் சடங்குசார் தீட்டுப் பாதிப்புகளின் விரிவான வகைப்பாட்டிற்கும் இச்சொல் பயன்படுத்தப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָא
  choice: பின்பு ... வந்து
  rationale: சடங்குச் சட்டத்தின் தொடர்நிலைச் செயல்முறையை இயல்பான தமிழில் காட்டுகிறது.
- source_word: הַכֹּהֵן
  choice: ஆசாரியன்
  rationale: லேவியராகமத்தின் வழிபாட்டு அலுவலருக்கான நிலையான, பொதுவாகப் புரியும் சொல்.
- source_word: וְרָאָה
  choice: ஆராய்ந்து பார்ப்பான்
  rationale: வெறுமனே காண்பதைக் காட்டிலும், இச்சூழலில் இடம்பெறும் மதிப்பீட்டு ஆய்வைத் தெளிவாக உணர்த்துகிறது.
- source_word: וְהִנֵּה
  choice: உறுதியானால்
  rationale: ஆய்வில் தெரியவரும் நிலையை நிபந்தனையாகவும் வலியுறுத்தலுடனும் வழங்குகிறது.
- source_word: פָּשָׂה
  choice: பரவியிருப்பது
  rationale: பாதிப்பு விரிவடைந்த நிலையைக் குறிக்கும் எபிரெய வினையின் இயல்பான தமிழ் இணை.
- source_word: הַנֶּגַע
  choice: அந்தப் பாதிப்பு
  rationale: மருத்துவத் தொற்றாக அளவுக்கு மீறித் துல்லியப்படுத்தாமல், கட்டிடத்தில் காணப்படும் பாதிக்கப்பட்ட நிலையைச் சுட்டுகிறது.
- source_word: צָרַעַת מַמְאֶרֶת
  choice: அழிவுண்டாக்கும் தொழுநோய்
  rationale: צָרַעַת என்ற சட்ட-சடங்கு வகைப்பாட்டின் தொடர்ச்சியைப் பேணுகிறது; மַמְאֶרֶת என்பதன் கடுமையான, அழிக்கும் தன்மையையும் வெளிப்படுத்துகிறது. இது வீட்டுக்குப் பயன்படுத்தப்படுவதால் அதன் விரிவான பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: טָמֵא הוּא
  choice: அந்த வீடு தீட்டானது
  rationale: சடங்குசார் அசுத்த நிலையை 'தீட்டு' என்ற நிலையான தமிழ்ச் சொல்லால் தெரிவித்து, சுட்டுப்பெயரின் குறிப்பு வீட்டையே சாரும் என்பதைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: வீட்டைக் குறிக்கும் சூழலில் צָרַעַת என்பதன் மொழிபெயர்ப்பு
  choice: தொழுநோய் என்ற பாரம்பரிய வகைப்பாட்டுச் சொல்லை வைத்து, அதன் விரிவான பொருளை அடிக்குறிப்பில் விளக்குதல்
  alternative: பூஞ்சை / அழிவுண்டாக்கும் பூஞ்சை
  rationale: மூல எபிரெயம் மனிதர்கள், ஆடைகள், வீடுகள் ஆகியவற்றுக்கெல்லாம் ஒரே சொல்லைப் பயன்படுத்துகிறது. அதை நேரடியாக 'பூஞ்சை' என அடையாளப்படுத்துவது மூலத்தில் இல்லாத நவீன உயிரியல் தீர்மானத்தைச் சேர்க்கும்; அதேவேளை அடிக்குறிப்பு இது நவீன ஹான்சன் நோயை மட்டும் குறிக்காது என்பதைத் தெளிவுபடுத்துகிறது.
- issue: சட்டச் செயல்முறையின் வினைநிலை
  choice: எதிர்கால/வழிமுறைத் தொடராக மொழிபெயர்த்தல்
  alternative: கடந்தகால நிகழ்வுரையாக மொழிபெயர்த்தல்
  rationale: இந்த வசனம் ஆசாரிய ஆய்வுக்கான சட்ட நடைமுறையின் ஒரு படி; ஆகவே தமிழில் வழிமுறைத் தன்மையைப் பேணுவது பொருத்தமானது.
