source:
  edition: WLC
  text: וְ/עָשָׂ֤ה הַ/כֹּהֵן֙ אֶת הַ֣/חַטָּ֔את וְ/כִפֶּ֕ר עַל הַ/מִּטַּהֵ֖ר מִ/טֻּמְאָת֑/וֹ וְ/אַחַ֖ר יִשְׁחַ֥ט אֶת הָ/עֹלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/019.yaml
  text: Then the priest shall offer the sin offering and make atonement for the one being cleansed from his uncleanness[a]; and afterward he shall slaughter the burnt offering.
translation:
  language: ta
  text: பின்பு ஆசாரியன் பாவநிவாரணப் பலியைச் செலுத்தி, தன் தீட்டிலிருந்து சுத்திகரிக்கப்படுபவனுக்காகப் பாவநிவிர்த்தி செய்வான்[a]. அதன்பின் அவன் தகனபலியை அறுப்பான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சுத்திகரிப்புப் பலி.” எபிரெயச் சொல் חַטָּאת, லேவியச் சடங்குச் சூழல்களில் சுத்திகரிப்புக்காகப் பயன்படுத்தப்படும் பலியைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשָׂה
  choice: செலுத்தி
  rationale: எபிரெய வினை அடிப்படையில் ‘செய்’ எனப் பொருள்பட்டாலும், பலியிடும் சடங்குச் சூழலில் பலியைச் செலுத்துவதைக் குறிக்கிறது.
- source_word: הַכֹּהֵן
  choice: ஆசாரியன்
  rationale: லேவியராகமத்தின் வழிபாட்டு மற்றும் பலியிடும் சூழலில் כֹּהֵן என்பதற்கான நிலையான, இயல்பான தமிழ்ச் சொல்.
- source_word: הַחַטָּאת
  choice: பாவநிவாரணப் பலி
  rationale: இங்கு חַטָּאת என்பது பாவத்தை அல்ல, பலியையே நேரடிச் செயப்படுபொருளாகக் குறிக்கிறது. ‘பாவநிவாரணப் பலி’ பரவலாகப் புரிந்துகொள்ளப்படும் பெயர்; சுத்திகரிப்புப் பலி என்ற சடங்குசார் நுண்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְכִפֶּר
  choice: பாவநிவிர்த்தி செய்வான்
  rationale: כפר என்பதன் பலிச் சடங்கு மற்றும் இறையியல் வலிமையைத் தக்கவைத்து, பாவநிவிர்த்தியின் செயல்முறையைப் பற்றிய குறிப்பிட்ட கோட்பாட்டை மொழிபெயர்ப்பில் திணிக்காமல் காட்டுகிறது.
- source_word: עַל
  choice: -க்காக
  rationale: כפר உடன் வரும் עַל, யாருக்காகப் பாவநிவிர்த்தி செய்யப்படுகிறது என்பதைக் குறிக்கிறது.
- source_word: הַמִּטַּהֵר
  choice: சுத்திகரிக்கப்படுகிறவன்
  rationale: ஹித்பயேல் நிகழ்காலப் பெயரெச்சம், சடங்குமுறைச் சுத்திகரிப்புக்கு உட்படும் நபரைக் குறிக்கிறது; தமிழில் செயப்பாட்டு வடிவம் இந்நுண்பொருளைத் தெளிவாகத் தருகிறது.
- source_word: מִטֻּמְאָתוֹ
  choice: தீட்டிலிருந்து
  rationale: லேவியராகமத்தில் טֻמְאָה சடங்குமுறைத் தூய்மையின்மையைக் குறிக்கிறது. ‘தீட்டு’ என்பது இச்சூழலுக்குரிய சுருக்கமான தமிழ்ச் சொல்; ஆண்பால் ஒருமைச் சுட்டு ‘சுத்திகரிக்கப்படுகிறவன்’ என்பதில் வெளிப்படுகிறது.
- source_word: וְאַחַר
  choice: அதன்பின்
  rationale: சடங்கு நடவடிக்கைகளின் வரிசையை இயல்பான நவீன தமிழில் குறிக்கிறது.
- source_word: יִשְׁחַט
  choice: அறுப்பான்
  rationale: பலிக்குரிய விலங்கை முறையாக அறுப்பதைக் குறிக்கும் சடங்குசார் வினை; பொதுவான ‘கொல்வான்’ என்பதைவிட மூலத்தின் பொருளுக்கு நெருக்கமானது.
- source_word: הָעֹלָה
  choice: தகனபலி
  rationale: עֹלָה என்பதற்கான அறியப்பட்ட தமிழ்ச் சமயச் சொல்; பலி முழுவதும் எரிக்கப்படும் தன்மையைச் சுருக்கமாக உணர்த்துகிறது.
theological_decisions:
- issue: லேவிய பலிச் சூழலில் חַטָּאת என்பதன் மொழிபெயர்ப்பு
  choice: பாவநிவாரணப் பலி
  alternative: சுத்திகரிப்புப் பலி
  rationale: இச்சொல் இங்கு ஒரு குறிப்பிட்ட பலிவகையின் பெயர். ‘பாவநிவாரணப் பலி’ அறியப்பட்ட மொழிபெயர்ப்பு; எனினும் தீட்டிலிருந்து சுத்திகரிக்கும் இச்சூழலில் ‘சுத்திகரிப்புப் பலி’ என்பது உண்மையான மாற்று, ஆகவே அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: מִטֻּמְאָתוֹ என்ற ஆண்பால் ஒருமை வடிவம்
  choice: சுத்திகரிக்கப்படுகிறவன் ... தீட்டிலிருந்து
  alternative: சுத்திகரிக்கப்படுகிறவர் ... தீட்டிலிருந்து
  rationale: எபிரெயம் ஆண்பால் ஒருமையைக் கொண்டிருப்பதால் அதைத் தமிழிலும் ஒருமை ஆண்பால் வடிவில் தக்கவைத்துள்ளது; பன்மை அல்லது பாலினப் பொதுமைப்படுத்தல் செய்யப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டது. ‘ஆசாரியன்,’ ‘பாவநிவிர்த்தி,’ ‘தகனபலி’ போன்ற பரிச்சயமான வேதாகமச் சொற்கள் தக்கவைக்கப்பட்டுள்ளன; வாக்கிய அமைப்பு சாதாரண வாசகர்களுக்கும் தெளிவாக உள்ளது.
