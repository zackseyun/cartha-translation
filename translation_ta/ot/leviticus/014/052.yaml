  text: וְ/חִטֵּ֣א אֶת הַ/בַּ֔יִת בְּ/דַם֙ הַ/צִּפּ֔וֹר וּ/בַ/מַּ֖יִם הַֽ/חַיִּ֑ים וּ/בַ/צִּפֹּ֣ר הַ/חַיָּ֗ה וּ/בְ/עֵ֥ץ הָ/אֶ֛רֶז וּ/בָ/אֵזֹ֖ב וּ/בִ/שְׁנִ֥י הַ/תּוֹלָֽעַת־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/052.yaml
  text: Thus he shall cleanse the house with the blood of the bird[a], with the living water, with the live bird, with cedar wood, with hyssop[b], and with scarlet yarn.
translation:
  language: ta
  text: அவர் வீட்டைப் பறவையின் இரத்தத்தாலும், உயிருள்ள நீராலும்[a], உயிருள்ள பறவையாலும், கேதுரு மரத்தாலும், ஈசோப்பாலும், செந்நிற நூலாலும்[b] தூய்மைப்படுத்த வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘புதிய நீர்’ அல்லது ‘ஓடும் நீர்.’ எபிரெயத்தில், ‘உயிருள்ள நீர்’; இது புதிய, ஓடும் நீரூற்றிலிருந்து வரும் நீரைக் குறிக்கும் வழக்கமான சொற்றொடர்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘செந்நிறச் சரடு.’ எபிரெயச் சொற்றொடர் இந்தத் தூய்மைப்படுத்தும் சடங்கில் பயன்படுத்தப்பட்ட செந்நிறச் சாயம் ஏற்றப்பட்ட பொருளைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחִטֵּא
  choice: தூய்மைப்படுத்த வேண்டும்
  rationale: חטא என்பதன் பியேல் வடிவம் இச்சடங்குச் சூழலில் பாவம் செய்யச் செய்வதைக் குறிக்காமல், தீட்டு நீக்கித் தூய்மைப்படுத்துவதைக் குறிக்கிறது. தமிழில் இயல்பாகவும் சடங்குசார் பொருளைத் தெளிவாகவும் தெரிவிக்க இச்சொற்றொடர் தேர்ந்தெடுக்கப்பட்டது.
- source_word: הַבַּיִת
  choice: அந்த வீட்டை
  rationale: இங்கு בַּיִת என்பது தீட்டுநீக்கச் சடங்குக்கு உட்படுத்தப்படும் கட்டடமான வீட்டைக் குறிக்கிறது.
- source_word: בְּדַם הַצִּפּוֹר
  choice: பறவையின் இரத்தத்தால்
  rationale: בְּ இங்கு தூய்மைப்படுத்தப் பயன்படும் சாதனம் அல்லது பொருளைக் குறிக்கிறது; தமிழில் கருவிப் பொருளை இயல்பாகக் காட்ட ‘-ஆல்’ பயன்படுத்தப்பட்டது.
- source_word: וּבַמַּיִם הַחַיִּים
  choice: உயிருள்ள நீரால்
  rationale: மொழிநடையில் இது புதிய அல்லது ஓடும் ஊற்றுநீரைக் குறிக்கும் என்றாலும், எபிரெயச் சொற்றொடரின் நேரடிப் படிமத்தையும் வேதாகமங்களுக்கிடையிலான தொடர்பையும் காக்க ‘உயிருள்ள நீர்’ என மொழிபெயர்க்கப்பட்டது; அதன் வழக்குப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וּבַצִּפֹּר הַחַיָּה
  choice: உயிருள்ள பறவையால்
  rationale: இரத்தம் பயன்படுத்தப்பட்ட பறவையிலிருந்து வேறுபட்டு, உயிரோடிருக்கும் பறவையைக் குறிக்கிறது. ‘உயிருள்ள’ என்பது நீருக்குப் பயன்படுத்தப்பட்ட அதே எபிரெய அடைமொழியின் ஒத்திசைவையும் காக்கிறது.
- source_word: וּבְעֵץ הָאֶרֶז
  choice: கேதுரு மரத்துண்டால்
  rationale: இச்சடங்கில் பயன்படுத்தப்படும் கேதுரு மரப்பொருளைத் தெளிவுபடுத்த ‘மரத்துண்டு’ என்று வழங்கப்பட்டது.
- source_word: וּבָאֵזֹב
  choice: ஈசோப்புச் செடியால்
  rationale: אֵזוֹב என்பதன் துல்லியமான தாவரவியல் அடையாளம் விவாதத்திற்குரியது. வேதாகமச் சடங்கு மரபில் நிலைபெற்ற ‘ஈசோப்பு’ என்ற பெயரைப் பேணி, இது ஒரு செடி என்பதைத் தெளிவாக்கப்பட்டது.
- source_word: וּבִשְׁנִי הַתּוֹלָעַת
  choice: செந்நிற நூலால்
  rationale: இச்சொற்றொடர் புழுவிலிருந்து பெறப்பட்ட சாயத்தால் சாயமிடப்பட்ட செந்நிறப் பொருளை, இச்சூழலில் நூலை, குறிக்கிறது. சாதாரண வாசகருக்குத் தெளிவாக ‘செந்நிற நூல்’ தேர்ந்தெடுக்கப்பட்டது.
theological_decisions:
- issue: וְחִטֵּא என்பதன் சடங்குசார் பொருள்
  choice: தூய்மைப்படுத்த வேண்டும்
  alternative: பாவநிவிர்த்தி செய்ய வேண்டும் / தீட்டுநீக்க வேண்டும்
  rationale: இங்கு செயல் வீட்டிலுள்ள சடங்குத் தீட்டை அகற்றுவதைக் குறிக்கிறது; குறிப்பாக பாவமன்னிப்பு அல்லது பரிகாரம் என்ற இறையியல் கருத்தை உரைக்குள் தேவையின்றி சேர்க்காமல், சூழலுக்கேற்ற பரந்த சொல்லான ‘தூய்மைப்படுத்த’ பயன்படுத்தப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் மரியாதைமிக்க நடை பயன்படுத்தப்பட்டது. தமிழின் இயல்பான வாக்கிய அமைப்புக்கேற்ப வினைச்சொல் இறுதியில் வைக்கப்பட்டது. மூலத்தின் சடங்குசார் கருவிப் பட்டியல் ‘-ஆல்’ உருபைத் திரும்பத் திரும்பப் பயன்படுத்தி பாதுகாக்கப்பட்டது. அடிக்குறிப்பு குறிகள் அவை விளக்கும் ‘உயிருள்ள நீர்’ மற்றும் ‘செந்நிற நூல்’ ஆகிய சொற்றொடர்களுக்குப் பின்னரே வைக்கப்பட்டுள்ளன.
