source:
  edition: WLC
  text: וּ/מִ/יֶּ֨תֶר הַ/שֶּׁ֜מֶן אֲשֶׁ֣ר עַל כַּפּ֗/וֹ יִתֵּ֤ן הַ/כֹּהֵן֙ עַל תְּנ֞וּךְ אֹ֤זֶן הַ/מִּטַּהֵר֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֤הֶן יָד/וֹ֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֥הֶן רַגְל֖/וֹ הַ/יְמָנִ֑ית עַ֖ל דַּ֥ם הָ/אָשָֽׁם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/017.yaml
  text: And from the rest of the oil that is on his palm[a], the priest shall put some on the lobe of the right ear of the one being cleansed, and on the thumb of his right hand, and on the big toe of his right foot[b], on top of the blood of the guilt offering.
translation:
  language: ta
  text: ஆசாரியனின் உள்ளங்கையில் இருக்கும் மீதியான எண்ணெயிலிருந்து, ஆசாரியன் சிறிதைச் சுத்திகரிக்கப்படுபவரின் வலது காதின் மடலின்மேலும்[a], அவருடைய வலது கையின் பெருவிரலின்மேலும், அவருடைய வலது காலின் பெருவிரலின்மேலும், குற்றநிவாரணப் பலியின் இரத்தத்தின்மேல்[b] இட வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வலது காதின் நுனியின்மேலும்.’ எபிரெயச் சொல் காதின் வெளிப்புற முனைப்பகுதியைக் குறிக்கிறது; இந்தச் சடங்குச் சூழலில் ‘மடல்’ என்பது தெளிவான மொழிபெயர்ப்பு.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, குற்றநிவாரணப் பலியின் இரத்தம் ஏற்கெனவே இடப்பட்ட அதே இடத்தின்மேல் எண்ணெயும் இடப்பட வேண்டும்.
    reason: lexical_clarification
lexical_decisions:
- source_word: מִיֶּתֶר הַשֶּׁמֶן
  choice: மீதியான எண்ணெயிலிருந்து
  rationale: יֶתֶר என்பது எஞ்சியிருப்பதைக் குறிக்கிறது; מִן தரும் பகுதி சார்ந்த பொருளை ‘-இலிருந்து’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עַל כַּפּוֹ
  choice: தன் உள்ளங்கையில் இருக்கும்
  rationale: כַּף இங்கு கையின் உள்ளங்கையைக் குறிக்கிறது; עַל என்பதன் இடப்பொருளை இயல்பான நவீன தமிழில் கூறுகிறது.
- source_word: יִתֵּן
  choice: சிறிதை ... இட வேண்டும்
  rationale: נתן என்பது இங்கு ‘இடு/பூசு’ என்ற பொதுவான செயல்சொல். மீதியான எண்ணெயில் ஒரு பகுதியே பயன்படுத்தப்படுவதால் ‘சிறிதை’ என்பது מִיֶּתֶר என்பதிலுள்ள பகுதி சார்ந்த கருத்தைத் தெளிவாக்குகிறது.
- source_word: תְּנוּךְ אֹזֶן
  choice: காதின் மடல்
  rationale: சடங்கில் எண்ணெய் இடப்படும் காதின் வெளிப்புற முனைப்பகுதியை இச்சொல் குறிக்கிறது; ‘காதின் மடல்’ நவீன தமிழில் தெளிவான உடற்கூற்றுச் சொல்.
- source_word: הַמִּטַּהֵר
  choice: சுத்திகரிக்கப்படுகிறவர்
  rationale: ஹித்பயேல் நிகழ்காலப் பங்கேற்புவினை, சடங்குமுறைச் சுத்திகரிப்புக்கு உட்பட்டிருக்கும் நபரையும் தொடரும் செயல்முறையையும் காட்டுகிறது.
- source_word: בֹּהֶן יָדוֹ
  choice: வலது கையின் பெருவிரல்
  rationale: בֹּהֶן கையைக் குறிக்கும் சூழலில் கட்டைவிரல் அல்லது பெருவிரலைக் குறிக்கிறது; ‘பெருவிரல்’ dignified, பொதுவாகப் புரியும் தமிழ்.
- source_word: בֹּהֶן רַגְלוֹ
  choice: வலது காலின் பெருவிரல்
  rationale: בֹּהֶן காலைக் குறிக்கும் சூழலில் பெரிய கால் விரலைக் குறிக்கிறது.
- source_word: עַל דַּם הָאָשָׁם
  choice: குற்றநிவாரணப் பலியின் இரத்தத்தின்மேல்
  rationale: இறுதி עַל, ஏற்கெனவே இரத்தம் இடப்பட்ட அதே இடத்தின்மேல் எண்ணெய் இடப்படுவதைச் சுட்டுகிறது; எபிரெய வாக்கியத்தின் சுருக்கத்தையும் தமிழில் காக்கிறது.
theological_decisions:
- issue: אָשָׁם என்ற பலியியல் கலைச்சொல்லின் மொழிபெயர்ப்பு
  choice: குற்றநிவாரணப் பலி
  alternative: குற்றப்பலி; ஈடுசெய்யும் பலி
  rationale: லேவியராகமப் பலியியல் சூழலில் אָשָׁם என்பது குற்றம் அல்லது பொறுப்புடன் தொடர்புடைய தனிப்பட்ட பலிவகையின் கலைச்சொல். ‘குற்றநிவாரணப் பலி’ தமிழில் அறியத்தக்கதாகவும், பிற்காலக் கோட்பாட்டு விளக்கத்தைத் திணிக்காமலும் உள்ளது.
translation_notes:
  register: நவீன செந்தமிழ் நடையில், பொதுவாசகர்களுக்குப் புரியும் வகையில் சடங்கின் துல்லியம் காக்கப்பட்டது. மரியாதைப் பன்மையான ‘அவருடைய’ பயன்படுத்தப்பட்டு, தேவையற்ற மறுபடியுரைத்தல் தவிர்க்கப்பட்டது. அடிக்குறிப்புக் குறிகள் அவை விளக்கும் சொற்றொடர்களின் அருகே வைக்கப்பட்டுள்ளன.
