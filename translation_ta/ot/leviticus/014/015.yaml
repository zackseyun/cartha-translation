source:
  edition: WLC
  text: וְ/לָקַ֥ח הַ/כֹּהֵ֖ן מִ/לֹּ֣ג הַ/שָּׁ֑מֶן וְ/יָצַ֛ק עַל כַּ֥ף הַ/כֹּהֵ֖ן הַ/שְּׂמָאלִֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/015.yaml
  text: Then the priest shall take some of the log of oil and pour it into the palm of his own left hand[a].
translation:
  language: ta
  text: பின்பு ஆசாரியன் அந்த லோக் அளவு எண்ணெயிலிருந்து சிறிது எடுத்து, தன் இடது உள்ளங்கையில் ஊற்ற வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘லோக்’ என்பது பழங்காலத் திரவ அளவைச் சுட்டும் சொல்.
    reason: cultural_note
lexical_decisions:
- source_word: וְלָקַח
  choice: பின்பு ... எடுத்து
  rationale: வாவ் + காத்தால் வடிவம் சடங்குமுறை அறிவுறுத்தலின் அடுத்த செயலைக் குறிக்கிறது; தமிழில் ‘பின்பு ... எடுத்து’ என்பது அந்த வரிசையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַכֹּהֵן
  choice: ஆசாரியன்
  rationale: வழிபாட்டுச் சூழலில் כֹּהֵן என்பதற்கான நிலையான, பொதுவாகப் புரியும் தமிழ் சொல்.
- source_word: מִלֹּג הַשָּׁמֶן
  choice: ஒரு லோக் அளவு எண்ணெயிலிருந்து சிறிது
  rationale: מִן இங்கு மூலத்தையும் பகுதியையும் குறிக்கிறது; முழு அளவையும் அல்லாமல் அதிலிருந்து சிறிதளவு எண்ணெயை எடுப்பதைத் தெளிவாக்குகிறது.
- source_word: לֹג
  choice: லோக் அளவு
  rationale: இது பழங்காலத்தின் குறிப்பிட்ட திரவ அளவைச் சுட்டுவதால், உறுதியற்ற நவீன அளவாக மாற்றாமல் ஒலிபெயர்த்து ‘அளவு’ என விளக்கப்பட்டுள்ளது.
- source_word: וְיָצַק
  choice: ஊற்ற வேண்டும்
  rationale: சடங்குச் சட்டத்தின் கட்டளையியல் தன்மையை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עַל כַּף
  choice: உள்ளங்கையில்
  rationale: சொல்லடிப்படையில் ‘உள்ளங்கையின் மேல்’ என்றாலும், குவித்த கைக்குள் எண்ணெய் ஊற்றும் செயலைத் தமிழில் ‘உள்ளங்கையில்’ என்பது இயல்பாகக் கூறுகிறது.
- source_word: כַּף
  choice: உள்ளங்கை
  rationale: கை முழுவதையும் அல்ல, குறிப்பாக உள்ளங்கையைச் சுட்டும் உடற்கூறு விவரத்தைப் பாதுகாக்கிறது.
- source_word: הַשְּׂמָאלִית
  choice: இடது
  rationale: ஆசாரியனுடைய இடது உள்ளங்கையையே நேரடியாகக் குறிக்கிறது.
