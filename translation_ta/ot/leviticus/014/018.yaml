source:
  edition: WLC
  text: וְ/הַ/נּוֹתָ֗ר בַּ/שֶּׁ֨מֶן֙ אֲשֶׁר֙ עַל כַּ֣ף הַ/כֹּהֵ֔ן יִתֵּ֖ן עַל רֹ֣אשׁ הַ/מִּטַּהֵ֑ר וְ/כִפֶּ֥ר עָלָ֛י/ו הַ/כֹּהֵ֖ן לִ/פְנֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/018.yaml
  text: And what remains of the oil that is on the priest’s palm he shall put on the head of the one being cleansed[a], and the priest shall make atonement for him before Yahweh.
translation:
  language: ta
  text: ஆசாரியனின் உள்ளங்கையில் இருக்கும் மீதமுள்ள எண்ணெயைச் சுத்திகரிக்கப்படுகிறவரின் தலையின்மேல் ஆசாரியன் இடுவான்; ஆசாரியன் யாவே முன்னிலையில் அவருக்காகப் பாவநிவிர்த்தி செய்வான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַנּוֹתָר בַּשֶּׁמֶן
  choice: எண்ணெயில் மீதியானதை
  rationale: נוֹתָר என்பது மீந்துள்ளதைச் சுட்டும் பெயர்ச்சொல் தன்மையுள்ள வினையெச்சம். בַּשֶּׁמֶן இங்கு பகுதியிலிருந்து மீந்தது என்ற பொருளில் இயல்பான தமிழில் ‘எண்ணெயில் மீதியானதை’ என மொழிபெயர்க்கப்பட்டது.
- source_word: אֲשֶׁר עַל כַּף הַכֹּהֵן
  choice: ஆசாரியனின் உள்ளங்கையில் இருக்கும்
  rationale: כַּף என்பது இங்கு கையின் உள்ளங்கையைத் துல்லியமாகக் குறிக்கிறது. עַל என்பதன் அடிப்படைப் பொருள் ‘மேல்’ என்றாலும், கையில் வைத்திருக்கும் எண்ணெயைப் பற்றி தமிழில் ‘உள்ளங்கையில்’ என்பது இயல்பாக உள்ளது; சொற்சார்ந்த வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: יִתֵּן עַל רֹאשׁ
  choice: தலையின்மேல் அவன் இட வேண்டும்
  rationale: נתן என்பதன் பரந்த ‘கொடு/வை/இடு’ பொருள்களில், இந்தச் சடங்கு நடவடிக்கைக்கு ‘இடு’ பொருத்தமானது. עַל רֹאשׁ என்பதன் ‘தலையின்மேல்’ அமைப்பும் காக்கப்படுகிறது.
- source_word: הַמִּטַּהֵר
  choice: சுத்திகரிக்கப்படுகிறவர்
  rationale: טהר என்பதன் ஹித்பயேல் நிகழ்கால வினையெச்சம் சடங்குமுறைச் சுத்திகரிப்புக்கு உட்பட்டுக்கொண்டிருப்பவரைக் குறிக்கிறது. ‘சுத்திகரிக்கப்படுகிறவர்’ அதன் தொடர்நிலையையும் சடங்குசார் பொருளையும் காக்கிறது.
- source_word: וְכִפֶּר עָלָיו
  choice: அவருக்காகப் பாவநிவிர்த்தி செய்வான்
  rationale: ஆசாரியச் சடங்குச் சூழலில் כפר என்பதற்கு நிலைபெற்ற இறையியல்-சடங்குப் பொருளான ‘பாவநிவிர்த்தி செய்’ பயன்படுத்தப்பட்டது; עָלָיו இயல்பான தமிழில் ‘அவருக்காக’ என வழங்கப்பட்டது.
- source_word: לִפְנֵי יְהוָה
  choice: யாவே முன்னிலையில்
  rationale: לִפְנֵי என்பது ‘முன்னிலையில்/சந்நிதியில்’ என்று பொருள்படும். יהוה என்ற உடன்படிக்கைப் பெயர் பொதுப்பட்டமாக மாற்றப்படாமல் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் நான்கெழுத்து இறைப்பெயர் நேரடியாக உள்ளது. அதைக் பொதுப்பட்டமாக மாற்றாமல் உடன்படிக்கைப் பெயராக ஒலிபெயர்ப்பது மூலத்தின் தனித்தன்மையைப் பேணுகிறது.
- issue: ஆசாரியச் சடங்கில் כפר என்பதன் பொருள்
  choice: பாவநிவிர்த்தி செய்வான்
  alternative: பரிகாரம் செய்வான்
  rationale: ‘பாவநிவிர்த்தி’ என்பது சடங்குசார் atonement பொருளைத் தெளிவாகக் காக்கிறது; அது எவ்வாறு நிகழ்கிறது என்ற குறிப்பிட்ட கோட்பாட்டை வசனத்துக்குள் சேர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க தமிழ் பயன்படுத்தப்பட்டுள்ளது. சடங்குசார் சொற்களான ‘ஆசாரியன்’, ‘சுத்திகரிக்கப்படுகிறவர்’, ‘பாவநிவிர்த்தி’ ஆகியவை சூழலின் துல்லியத்திற்காக வைக்கப்பட்டுள்ளன; வாக்கிய அமைப்பு சாதாரண வாசகருக்கும் தெளிவாகப் பிரிக்கப்பட்டுள்ளது.
