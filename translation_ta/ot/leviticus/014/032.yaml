translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் அதேவேளையில் சட்டமுறைச் சூழலுக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘தொழுநோய்’ என்ற குறுகிய, வழிதவறச் செய்யக்கூடிய சொல்லைத் தவிர்த்து, மூலத்தின் விரிவான நோய்வகைப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
