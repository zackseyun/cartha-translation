  to: தோல் நோய்ப் பாதிப்பு உள்ள, தன் சடங்குமுறைத் தூய்மைப்படுத்துதலுக்குத் தேவையானவற்றை அளிக்கப் போதிய வசதி இல்லாத ஒருவனுக்கான விதிமுறை இதுவே.[a][b]
  rationale: ‘செலுத்த’ என்பதற்குப் பதிலாக ‘அளிக்கப் போதிய வசதி இல்லாத’ என்று மாற்றி, மூல எபிரெய மரபுத்தொடர் குறிக்கும் வளக்குறைவைத் துல்லியமாக வெளிப்படுத்தினேன். வாக்கிய அமைப்பை நவீன தமிழில் இயல்பாக்கினேன். சடங்குச் சூழலைத் தெளிவுபடுத்தினாலும், மூலத்தில் இல்லாத குறிப்பிட்ட காணிக்கை அல்லது பணப்பரிவர்த்தனையைச் சேர்க்கவில்லை. அடிக்குறிப்புகள் சொற்பொருள் நுணுக்கத்தையும் மரபுத்தொடரின் பொருளையும் பாதுகாக்கின்றன.
