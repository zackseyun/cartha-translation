base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/032.yaml
  text: This is the law for him in whom there is an infection of skin disease[b][a], whose means cannot afford what is required for his cleansing.
translation:
  language: ta
  text: தோல் நோய்ப் பாதிப்பு உள்ள, தன் சடங்குமுறைத் தூய்மைப்படுத்துதலுக்குத் தேவையானவற்றை அளிக்கப் போதிய வசதி இல்லாத ஒருவனுக்கான விதிமுறை இதுவே.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு ‘தோல் நோய்’ என்று மொழிபெயர்க்கப்பட்டுள்ள எபிரெயச் சொல் צָרָעַת. இது மரபாக ‘தொழுநோய்’ என்று மொழிபெயர்க்கப்பட்டாலும், லேவியராகமத்தில் பலவகையான கடுமையான தோல் பாதிப்புகளையும் அவற்றோடு தொடர்புடைய சடங்குமுறைத் தீட்டையும் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்கு சொல், ‘தன் தூய்மைப்படுத்துதலுக்காக எவனுடைய கை எட்டவில்லையோ.’ தூய்மைப்படுத்தும் சடங்கிற்குத் தேவையானவற்றை அளிக்கப் போதிய பொருளாதார வசதி இல்லாததைக் குறிக்கும் எபிரெய மரபுத்தொடர் இது.
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרַת
  choice: விதிமுறை
  rationale: ஆசாரியச் சட்டப் பின்னணியில் תּוֹרָה என்பது பின்பற்ற வேண்டிய நடைமுறை நியமத்தைக் குறிக்கிறது. நவீன தமிழில் ‘விதிமுறை’ என்பது இங்கு இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: בּוֹ
  choice: உள்ளவனும்
  rationale: பாதிப்பு அந்த நபரிடம் இருப்பதை எபிரெய முன்னிடைச்சொல் காட்டுகிறது; தமிழில் ‘உள்ளவன்’ இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: נֶגַע צָרָעַת
  choice: தோல் நோய்ப் பாதிப்பு
  rationale: צָרָעַת என்பதை நவீன தொழுநோயுடன் மட்டும் ஒப்பிடுவது தவறாக வழிநடத்தலாம். ‘தோல் நோய்’ அதன் விரிவான லேவியராகமப் பயன்பாட்டையும், ‘பாதிப்பு’ נֶגַע என்பதையும் வெளிப்படுத்துகின்றன.
- source_word: לֹא תַשִּׂיג יָדוֹ
  choice: செலுத்த வசதியில்லாதவன்
  rationale: சொல்லுக்கு சொல் ‘அவனுடைய கை எட்டவில்லை’ என்றாலும், இது தேவையான பொருளாதார வசதி போதாமையைக் குறிக்கும் மரபுத்தொடர். தமிழில் பொருளைத் தெளிவாகக் கூறப்பட்டுள்ளது.
- source_word: בְּטָהֳרָתוֹ
  choice: தன்னைத் தூய்மைப்படுத்துவதற்குத் தேவையானவற்றை
  rationale: முந்தைய வசனங்களில் கூறப்பட்ட தூய்மைப்படுத்தும் சடங்கிற்குத் தேவையான காணிக்கைகளைச் சூழல் சுட்டுகிறது. ‘தேவையானவற்றை’ என்பது குறிப்பிட்ட பலியை மட்டுமே சேர்க்காமல் சூழற்பொருளை இயல்பாக வெளிப்படுத்துகிறது.
