lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பேசி
  rationale: דבר என்ற வினை தெய்வீக உரையை அறிமுகப்படுத்தும் வழக்கமான நிகழ்வைக் குறிக்கிறது; ‘பேசி’ என்பது நவீன தமிழில் இயல்பாகவும் மூலத்தின் உரைநடையைப் பாதுகாக்கும் வகையிலும் உள்ளது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: நான்கு எழுத்துத் தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட பெயர்வடிவில் தருகிறது.
- source_word: אֶל־מֹשֶׁה
  choice: மோசேயிடம்
  rationale: பேச்சு நோக்கிச் செல்லும் நபரைத் தமிழில் இயல்பாகக் குறிக்கும் வேற்றுமை வடிவம்.
- source_word: לֵאמֹר
  choice: சொன்னதாவது
  rationale: தொடர்ந்து வரும் நேரடி உரையை அறிமுகப்படுத்தும் எபிரெய வழக்குச் சூத்திரத்தை dignified, இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக உள்ளது. அதை ‘கர்த்தர்’ என்ற பட்டமாக மாற்றாமல் பெயராகவே தருவது மூல வேறுபாட்டைப் பாதுகாக்கிறது; உச்சரிப்பு உறுதியற்றதால் மாற்றுவடிவம் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீன, செம்மையான, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ். எபிரெய உரைச் சூத்திரத்தின் தொடர்ச்சியை ‘பேசி, சொன்னதாவது’ எனப் பாதுகாக்கிறது.
