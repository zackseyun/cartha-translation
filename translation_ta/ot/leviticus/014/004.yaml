base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/004.yaml
  text: Then the priest shall command that two live clean birds[a], cedar wood, scarlet yarn[b], and hyssop be taken for the one being cleansed.
translation:
  language: ta
  text: பின்பு ஆசாரியன், தூய்மையாக்கப்படுகிறவருக்காக உயிருள்ள, சுத்தமான இரண்டு பறவைகளையும், கேதுரு மரத்தையும், செந்நிற நூலையும்[a], ஈசோப்பையும்[b] எடுத்துக்கொள்ளும்படி கட்டளையிட வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘செந்நிற இழை.’ שְׁנִי תוֹלַעַת என்ற எபிரெயச் சொற்றொடர் செந்நிறச் சாயமிடப்பட்ட ஒரு பொருளைக் குறிக்கிறது; அது நூலா, இழையா அல்லது வேறு வடிவிலான பொருளா என்பது துல்லியமாகத் தெரியவில்லை.
    reason: lexical_alternative
  - marker: b
    text: ‘ஈசோப்பு’ என்று அழைக்கப்படும் தாவரம் துல்லியமாக எந்த இனம் என்பது உறுதியில்லை; மரபான பெயர் இங்கே தக்கவைக்கப்பட்டுள்ளது.
    reason: cultural_note
lexical_decisions:
- source_word: וְצִוָּה
  choice: பின்பு ... கட்டளையிட வேண்டும்
  rationale: சடங்கு நடைமுறையின் அடுத்த படியை வாவ் இணைப்பு முன்னெடுப்பதால், ‘பின்பு’ என்று இயல்பாகக் காட்டப்பட்டுள்ளது; கட்டளையின் கடப்பாட்டை ‘வேண்டும்’ தக்கவைக்கிறது.
- source_word: וְלָקַח
  choice: எடுத்துக்கொள்ளும்படி
  rationale: வடிவில் மூன்றாம் ஆண்பால் ஒருமையாக இருந்தாலும், ஆசாரியன் பொருட்களைத் தானே எடுக்க வேண்டும் என்பதைக் காட்டாமல், அவை எடுக்கப்படும்படி அவர் கட்டளையிடுவதைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לַמִּטַּהֵר
  choice: தூய்மையாக்கப்படுகிறவருக்காக
  rationale: ஹித்பயேல் வினையெச்சம் சடங்குசார் தூய்மையாக்கத்தின் செயல்முறையில் உள்ள நபரைக் குறிக்கிறது; முடிந்த நிலையாக மட்டும் காட்டாமல் நிகழும் செயல்முறையை இச்சொற்றொடர் காக்கிறது.
- source_word: שְׁתֵּי צִפֳּרִים
  choice: இரண்டு பறவைகள்
  rationale: צִפּוֹר என்பது குறிப்பாகச் சிட்டுக்குருவியை அல்ல, பொதுவாகப் பறவையைக் குறிக்கிறது; ஆகவே தேவையற்ற இனக் குறிப்பைத் தவிர்க்கிறது.
- source_word: חַיּוֹת
  choice: உயிருள்ள
  rationale: பறவைகள் உயிரோடு இருக்க வேண்டும் என்ற சடங்குசார் வேறுபாட்டை நேரடியாகக் காட்டுகிறது.
- source_word: טְהֹרוֹת
  choice: சுத்தமான
  rationale: லேவியராகமச் சூழலில் சடங்கின்படி ஏற்ற நிலையைக் குறிக்கும் טהור என்பதற்கான சுருக்கமான வழக்குச் சொல்; விளக்கத்தை மூலவசனத்திற்குள் சேர்க்கவில்லை.
- source_word: עֵץ אֶרֶז
  choice: கேதுரு மரம்
  rationale: சடங்கில் பயன்படுத்தப்படும் cedar மரப்பொருளைக் குறிக்கிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘துண்டு’ போன்ற அளவு அல்லது வடிவத்தைச் சேர்க்கவில்லை.
- source_word: שְׁנִי תוֹלַעַת
  choice: செந்நிற நூல்
  rationale: பூச்சியிலிருந்து பெறப்பட்ட சாயத்தால் நிறமூட்டப்பட்ட செந்நிறப் பொருளைக் குறிக்கும் மரபுச் சொற்றொடரைத் தெளிவாகத் தருகிறது; பொருளின் துல்லிய வடிவம் உறுதியற்றதால் மாற்றுக் குறிப்பு இணைக்கப்பட்டுள்ளது.
- source_word: אֵזֹב
  choice: ஈசோப்பு
  rationale: துல்லியமான தாவரவியல் அடையாளம் உறுதியற்றிருந்தாலும், வேதாகமச் சடங்குச் சூழலில் நிலைபெற்ற பெயரைத் தக்கவைத்து ஊகமான இனப்பெயரைத் தவிர்க்கிறது.
