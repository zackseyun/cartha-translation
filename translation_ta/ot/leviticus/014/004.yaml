translation_notes:
  register: நவீன பொதுத்தமிழில், சடங்குசார் கண்ணியத்தைத் தக்கவைக்கும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆசாரியன்,’ ‘சுத்தமான,’ ‘கேதுரு,’ ‘ஈசோப்பு’ ஆகிய சொற்கள் லேவியராகமச் சூழலின் அறிமுகத்தையும் பொருள் தொடர்ச்சியையும் காக்கின்றன. பட்டியல் முழுவதும் ஆசாரியன் பிறப்பிக்கும் ஒரே கட்டளைக்குள் தெளிவாக அமைக்கப்பட்டுள்ளது.
