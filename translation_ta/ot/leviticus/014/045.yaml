- from: பின்பு அவன் அந்த வீட்டை—அதன் கற்களையும், அதன் மரக்கட்டைகளையும், வீட்டின் சாந்து முழுவதையும்[a]—இடித்துத் தள்ளி, அவற்றை நகருக்கு வெளியே அசுத்தமான ஓர் இடத்திற்குக் கொண்டுபோக வேண்டும்.
