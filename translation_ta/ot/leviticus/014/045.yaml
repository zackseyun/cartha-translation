  text: וְ/נָתַ֣ץ אֶת הַ/בַּ֗יִת אֶת אֲבָנָי/ו֙ וְ/אֶת עֵצָ֔י/ו וְ/אֵ֖ת כָּל עֲפַ֣ר הַ/בָּ֑יִת וְ/הוֹצִיא֙ אֶל מִ/ח֣וּץ לָ/עִ֔יר אֶל מָק֖וֹם טָמֵֽא־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/045.yaml
  text: Then he shall tear down the house—its stones[a], its timbers, and all the plaster of the house—and carry them out to an unclean place outside the city.
translation:
  language: ta
  text: பின்பு அவன் அந்த வீட்டை—அதன் கற்களையும், அதன் மரக்கட்டைகளையும், வீட்டின் சுவர் பூச்சு முழுவதையும்[a]—இடிக்க வேண்டும்; அவற்றை நகருக்கு வெளியே, தீட்டான ஓர் இடத்திற்குக் கொண்டுபோக வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வீட்டின் தூசி முழுவதையும்” அல்லது “வீட்டின் காரை/சாந்து முழுவதையும்.” எபிரெய மொழியில் நேரடியாக “வீட்டின் தூசி முழுவதையும்” என்றுள்ளது; கட்டடச் சூழலில் இது சுரண்டி அகற்றப்பட்ட சுவர் பூச்சு அல்லது சாந்துப்பொருளைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַץ
  choice: பின்பு அவன் ... இடித்துத் தள்ளி
  rationale: נתץ என்பது இச்சூழலில் அசுத்தம் படிந்த வீட்டை முழுமையாக இடிப்பதைக் குறிக்கிறது. தொடர் வாவைச் சூழலுக்கேற்ற ‘பின்பு’ காட்டுகிறது.
- source_word: הַבַּיִת
  choice: அந்த வீட்டை
  rationale: இங்கு בית என்பது ஆய்வுக்கும் இடிப்புக்கும் உட்பட்ட கட்டடத்தைக் குறிக்கிறது; தமிழில் ‘அந்த வீடு’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: אֲבָנָיו
  choice: அதன் கற்களையும்
  rationale: எபிரெயச் சொல்லின் நேரடியான, உருவகமற்ற பொருளைத் தக்கவைக்கிறது.
- source_word: עֵצָיו
  choice: அதன் மரக்கட்டைகளையும்
  rationale: சொல்லளவில் மரப்பொருட்கள் எனினும், வீடு இடிக்கப்படும் கட்டடச் சூழலில் கட்டமைப்புக்குரிய மரக்கட்டைகள் என்பதே இயல்பான பொருள்.
- source_word: כָּל עֲפַר הַבָּיִת
  choice: வீட்டின் சாந்து முழுவதையும்
  rationale: עפר என்பதன் அடிப்படைப் பொருள் ‘தூசி/மண்’. ஆனால் சுவர்களைச் சுரண்டுவது பற்றிய உடனடிச் சூழலில், அகற்றப்படும் சுவர் பூச்சு அல்லது சாந்துப்பொருளைக் குறிக்க வாய்ப்புள்ளது. முதன்மை உரையில் இயல்பான கட்டடச் சொல்லாக ‘சாந்து’ பயன்படுத்தப்பட்டு, நேரடிப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וְהוֹצִיא
  choice: அவற்றை ... கொண்டுபோக வேண்டும்
  rationale: இடிக்கப்பட்ட பொருட்களை வெளியே எடுத்துச் செல்வது என்ற causative இயக்கத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: אֶל מִחוּץ לָעִיר
  choice: நகருக்கு வெளியே
  rationale: நகர எல்லைக்கு அப்பால் எடுத்துச் செல்வதைக் குறிக்கும் திசைநிலைச் சொற்றொடரின் இயல்பான தமிழ் வடிவம்.
- source_word: אֶל מָקוֹם טָמֵא
  choice: அசுத்தமான ஓர் இடத்திற்கு
  rationale: טמא என்ற லேவியராகமத்தின் சடங்குத் தூய்மை சார்ந்த முக்கியச் சொல்லை ‘அசுத்தமான’ என ஒத்திசைவாக வழங்குகிறது; இது சாதாரண அழுக்கை மட்டும் குறிக்கவில்லை.
theological_decisions:
- issue: சடங்குத் தூய்மை சார்ந்த טָמֵא என்ற சொல்லின் மொழிபெயர்ப்பு
  choice: அசுத்தமான
  alternative: தீட்டான / தூய்மையற்ற
  rationale: ‘அசுத்தமான’ என்பது சட்ட-சடங்குச் சூழலில் உள்ள தூய்மை நிலையைத் தெளிவாகக் காட்டுகிறது; ஒழுக்கக் குற்றம் அல்லது பாவம் என்ற கூடுதல் கருத்தைத் திணிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டவிதியின் கண்ணியமான கட்டளைநடை பயன்படுத்தப்பட்டுள்ளது. ‘வேண்டும்’ என்பது எபிரெய imperfect-இன் விதிப்பொருளை வெளிப்படுத்துகிறது. இடைச்செருகுக் கோடுகள் இடிக்கப்பட வேண்டிய வீட்டின் கூறுகளைத் தெளிவுபடுத்துகின்றன.
