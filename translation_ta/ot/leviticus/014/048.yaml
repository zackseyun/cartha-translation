  rationale: The revision preserves the source’s condition, sequence, ritual-register ambiguity in טהר, and healing language. It removes the unnecessary and potentially misleading lexical footnote on נגע, since the main text’s ‘பாதிப்பு’ already gives an accurate non-diagnostic rendering. The remaining footnote is anchored to ‘அறிவிக்க வேண்டும்,’ the expression it qualifies.
