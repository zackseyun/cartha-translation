revisions:
- from: ஆனால் ஆசாரியர் வீட்டிற்குள் வந்து பார்த்தபோது, இதோ, வீட்டிற்குச் சாந்து பூசப்பட்ட பிறகு அந்தப் பாதிப்பு[a] வீட்டில் பரவவில்லை என்றால், அந்தப் பாதிப்பு குணமாகிவிட்டதால், ஆசாரியர் அந்த வீட்டைத் தூய்மையானது என்று அறிவிக்க வேண்டும்.[b]
