  text: וְ/אִם בֹּ֨א יָבֹ֜א הַ/כֹּהֵ֗ן וְ/רָאָה֙ וְ֠/הִנֵּה לֹא פָשָׂ֤ה הַ/נֶּ֨גַע֙ בַּ/בַּ֔יִת אַחֲרֵ֖י הִטֹּ֣חַ אֶת הַ/בָּ֑יִת וְ/טִהַ֤ר הַ/כֹּהֵן֙ אֶת הַ/בַּ֔יִת כִּ֥י נִרְפָּ֖א הַ/נָּֽגַע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/048.yaml
  text: But if the priest comes in and looks[a], and behold, the disease has not spread in the house after the house was plastered, then the priest shall pronounce the house clean[b], because the disease is healed.
translation:
  language: ta
  text: ஆனால், ஆசாரியர் வீட்டிற்குள் வந்து பார்த்து, இதோ, வீட்டிற்குச் சாந்து பூசப்பட்ட பிறகு அந்தப் பாதிப்பு வீட்டில் பரவவில்லை என்றால், அந்தப் பாதிப்பு குணமாகிவிட்டதால் ஆசாரியர் அந்த வீட்டைத் தூய்மையானது என்று அறிவிக்க வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆசாரியர் அந்த வீட்டைத் தூய்மைப்படுத்த வேண்டும்.” இச்சூழலில் எபிரெய வினைச்சொல் சடங்குமுறைத் தூய்மைப்படுத்துதலையோ, தூய்மையானது என்ற ஆசாரியரின் அறிவிப்பையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: ஆனால் ... என்றால்
  rationale: முந்தைய சட்ட நடைமுறையுடன் உள்ள முரண்பாட்டையும் நிபந்தனையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בֹּא יָבֹא
  choice: வீட்டிற்குள் வந்து
  rationale: எபிரெய வலியுறுத்தல் அமைப்பை தமிழில் செயற்கையாகப் பெருக்காமல், ஆய்வுக்காக உள்ளே வருதல் என்ற நடைமுறைப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: וְרָאָה
  choice: பார்த்தபோது
  rationale: ஆசாரியர் ஆய்வு செய்வது சூழலில் தெளிவாக இருப்பதால், எபிரெய வினையின் எளிய 'பார்' பொருளைத் தக்கவைக்கிறது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: ஆய்வின் முடிவுக்குக் கவனத்தை ஈர்க்கும் எபிரெய உரையாடல் அடையாளத்தைப் பாதுகாக்கிறது.
- source_word: לֹא פָשָׂה
  choice: பரவவில்லை
  rationale: தோல் மற்றும் வீடு சார்ந்த பாதிப்புகளின் சூழலில் פשה என்பதன் தெளிவான பொருள் 'பரவுதல்' ஆகும்.
- source_word: הַנֶּגַע
  choice: அந்தப் பாதிப்பு
  rationale: נגע என்பது இங்கு வீட்டைத் தாக்கியுள்ள நிலை அல்லது கேட்டைச் சுட்டுகிறது; 'பாதிப்பு' என்பது நவீன மருத்துவ நோயறிதலைத் திணிக்காமல் பொதுவான பொருளைத் தக்கவைக்கிறது.
- source_word: בַּבַּיִת
  choice: வீட்டில்
  rationale: எபிரெய முன்னிடைச்சொல்லின் இயல்பான இடப்பொருளை நேரடியாகக் கொடுக்கிறது.
- source_word: אַחֲרֵי הִטֹּחַ אֶת־הַבָּיִת
  choice: வீட்டிற்குச் சாந்து பூசப்பட்ட பிறகு
  rationale: טוח என்பது வீட்டின் மேற்பரப்பில் சாந்து அல்லது பூச்சு இடுவதைக் குறிக்கிறது; செய்பவர் வலியுறுத்தப்படாததால் தமிழில் செயப்பாட்டு வடிவம் இயல்பாக உள்ளது.
- source_word: וְטִהַר הַכֹּהֵן אֶת־הַבָּיִת
  choice: ஆசாரியர் அந்த வீட்டைத் தூய்மையானது என்று அறிவிக்க வேண்டும்
  rationale: ஆசாரியத் தூய்மைச் சட்டச் சூழலில் טהר என்பது தூய்மையான நிலையை அதிகாரபூர்வமாக அறிவிப்பதைக் குறிக்கலாம்; ஆசாரியரே வீட்டை உடல்ரீதியாகச் சுத்தம் செய்கிறார் என்ற தவறான எண்ணத்தை இது தவிர்க்கிறது.
- source_word: כִּי נִרְפָּא הַנָּגַע
  choice: அந்தப் பாதிப்பு குணமாகிவிட்டதால்
  rationale: רפא வேரின் 'குணமாதல்' உருவகத்தைத் தக்கவைத்து, பாதிப்பு வெறுமனே மறைந்தது என்று பொருளைத் தட்டையாக்காமல் வழங்குகிறது.
theological_decisions:
- issue: וְטִהַר என்பதில் சடங்குமுறை அறிவிப்பா அல்லது உடல்ரீதியான தூய்மைப்படுத்தலா
  choice: ஆசாரியர் வீட்டைத் தூய்மையானது என்று அறிவிக்க வேண்டும்
  alternative: ஆசாரியர் வீட்டைத் தூய்மைப்படுத்த வேண்டும்
  rationale: லேவியராகமத்தின் தூய்மைச் சட்டங்களில் ஆசாரியரின் பங்கு பெரும்பாலும் நிலையைத் தீர்மானித்து அறிவிப்பதாகும். இருப்பினும் வினைச்சொல்லின் 'தூய்மைப்படுத்து' என்ற சாத்தியப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்ட நடைமுறைக்கேற்ற கண்ணியமான மற்றும் பொதுவாசகர்களுக்கு எளிதில் புரியும் நடை பயன்படுத்தப்பட்டது. 'இதோ' என்ற சற்றே உயர்ந்த சொல் எபிரெய வலியுறுத்தலைப் பாதுகாக்கிறது; 'பாதிப்பு' என்பது தேவையற்ற மருத்துவத் துல்லியத்தையும் 'கொள்ளைநோய்' என்ற தவறான நவீன உணர்வையும் தவிர்க்கிறது.
