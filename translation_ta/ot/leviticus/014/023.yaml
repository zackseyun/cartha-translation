  to: எட்டாம் நாளில், அவன் தன் சுத்திகரிப்புக்காக[a] அவற்றைச் சந்திப்புக் கூடாரத்தின் நுழைவாயிலில் யாவேவின் முன்னிலையில் ஆசாரியனிடம் கொண்டுவர வேண்டும்.
