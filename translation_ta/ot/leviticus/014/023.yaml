  text: וְ/הֵבִ֨יא אֹתָ֜/ם בַּ/יּ֧וֹם הַ/שְּׁמִינִ֛י לְ/טָהֳרָת֖/וֹ אֶל הַ/כֹּהֵ֑ן אֶל פֶּ֥תַח אֹֽהֶל מוֹעֵ֖ד לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/023.yaml
  text: And on the eighth day he shall bring them for his cleansing to the priest[a], at the entrance of the tent of meeting, before Yahweh.
translation:
  language: ta
  text: எட்டாம் நாளில், அவன் தன் சுத்திகரிப்புக்காக[a] அவற்றைச் சந்திப்புக் கூடாரத்தின் நுழைவாயிலில் யாவேவின் முன்னிலையில் ஆசாரியனிடம் கொண்டுவர வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தான் தூய்மையாக்கப்படுவதற்காக.” இங்குள்ள எபிரெயச் சொல் இச்சூழலில் சடங்குமுறைத் தூய்மைப்படுத்தும் செயல்முறையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבִיא
  choice: கொண்டுவர வேண்டும்
  rationale: சட்டவழிமுறைச் சூழலில் இந்த வினைவடிவம் கட்டளையுடனான எதிர்காலச் செயலைக் குறிக்கிறது; இயல்பான நவீன தமிழில் ‘கொண்டுவர வேண்டும்’ பொருத்தமானது.
- source_word: אֹתָם
  choice: அவற்றை
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட பலியிடும் பொருட்களைச் சுட்டும் ஆண்பால் பன்மைச் சுட்டுப்பெயர்; பொருட்களைக் குறிக்கும் தமிழ்ச் சொல் ‘அவற்றை’.
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: எட்டாம் நாளில்
  rationale: காலத்தைக் குறிக்கும் எபிரெய வழக்கின் இயல்பான தமிழாக்கம்.
- source_word: לְטָהֳרָתוֹ
  choice: தன் சுத்திகரிப்புக்காக
  rationale: இங்கு தோல் நோய்க்குப் பிந்தைய சடங்குமுறைத் தூய்மை நிலையை அடையும் செயல்முறை குறிக்கப்படுகிறது; ‘சுத்திகரிப்பு’ அந்த வழிபாட்டுச் சூழலைத் தெளிவாகக் காக்கிறது.
- source_word: אֶל הַכֹּהֵן
  choice: ஆசாரியனிடம்
  rationale: திசை அல்லது ஒப்படைப்பு இலக்கைக் குறிக்கும் சொற்றொடருக்கு இயல்பான தமிழ் வடிவம்.
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரத்தின் நுழைவாயிலில்
  rationale: செயல் நடைபெறும் வழிபாட்டு இடத்தைத் தெளிவாகக் குறிப்பிடுகிறது; אֹהֶל מוֹעֵד என்பதன் பொருளை ‘சந்திப்புக் கூடாரம்’ நேரடியாகக் காக்கிறது.
- source_word: לִפְנֵי יְהוָה
  choice: யாவேக்கு முன்பாக
  rationale: தெய்வீக முன்னிலையைக் குறிக்கும் நிலையான வழிபாட்டுச் சொற்றொடரை இயல்பான தமிழில் வழங்குகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய வேதப்பெயரான நான்கு எழுத்துத் திருப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், தனிப்பெயராக ஒலிபெயர்க்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது; அதை ஒரு பொதுப் பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூல வேறுபாட்டைக் காக்கிறது.
- issue: לְטָהֳרָתוֹ என்ற சடங்குத் தூய்மைச் சொல்
  choice: தன் சுத்திகரிப்புக்காக
  alternative: தான் தூய்மையாக்கப்படுவதற்காக
  rationale: இச்சூழல் ஒழுக்கக் குற்றநீக்கத்தை அல்ல, சடங்குமுறைத் தூய்மைப்படுத்தலைக் குறிக்கிறது. முதன்மை வாசகம் சுருக்கமாகவும் இயல்பாகவும் உள்ளது; மாற்று வாசிப்பு அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமான ஆனால் எளிதில் புரியும் நடை. மூல வாக்கியத்தின் இடவமைப்பும் சடங்குமுறைப் பொருளும் காக்கப்பட்டுள்ளன.
