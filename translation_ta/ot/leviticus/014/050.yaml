source:
  edition: WLC
  text: וְ/שָׁחַ֖ט אֶת הַ/צִּפֹּ֣ר הָ/אֶחָ֑ת אֶל כְּלִי חֶ֖רֶשׂ עַל מַ֥יִם חַיִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/050.yaml
  text: Then he shall slaughter the one bird into an earthenware vessel over living water[a].
translation:
  language: ta
  text: பின்பு, அந்த ஒரு பறவையை ஒரு மண்பாண்டத்திலுள்ள ஊற்றுநீரின் மேல் அறுக்க வேண்டும்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்கு நேர் பொருள், ‘உயிருள்ள நீர்’; அதாவது புதிய அல்லது ஓடும் நீர்.
    reason: மூல எபிரெயச் சொல்லின் நேரடிப் பொருளையும் அதன் வழக்குப் பொருளையும் பாதுகாக்கிறது.
lexical_decisions:
- source_word: וְשָׁחַט
  choice: பின்பு ... அறுக்க வேண்டும்
  rationale: சடங்கு வழிமுறையின் தொடர்ச்சியை וְ குறிக்கிறது; שָׁחַט என்பது பொதுவாகக் கொல்வதைவிடச் சடங்குமுறையில் அறுப்பதைத் துல்லியமாகக் குறிக்கிறது.
- source_word: הַצִּפֹּר הָאֶחָת
  choice: அந்த ஒரு பறவையை
  rationale: முன்பு குறிப்பிடப்பட்ட இரு பறவைகளில் ஒன்றை வேறுபடுத்திக் காட்டுகிறது; எபிரெயத்தில் இல்லாத ‘முதல்’ என்ற வரிசைப் பொருளைச் சேர்க்கவில்லை.
- source_word: אֶל כְּלִי חֶרֶשׂ
  choice: ஒரு மண்பாண்டத்திலுள்ள ... மேல்
  rationale: களிமண்ணால் செய்யப்பட்ட பாத்திரத்துக்குள் இரத்தம் விழும்படி பறவை அறுக்கப்படுவதே கட்டமைப்பின் நடைமுறைப் பொருள். இயல்பான தமிழுக்காக பாத்திரத்துக்கும் நீருக்கும் உள்ள தொடர்பு ஒருங்கிணைத்துச் சொல்லப்பட்டுள்ளது.
- source_word: מַיִם חַיִּים
  choice: ஊற்றுநீர்
  rationale: சொல்லுக்கு நேர் பொருள் ‘உயிருள்ள நீர்’; இச்சடங்குச் சூழலில் அது தேங்கிய நீருக்கு மாறான புதிய அல்லது இயற்கையாக ஓடும் நீரைக் குறிக்கிறது. ‘ஊற்றுநீர்’ நவீன தமிழில் இயல்பாக இப்பொருளைத் தருகிறது; நேரடிப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: מַיִם חַיִּים என்ற சொற்றொடரின் சடங்கியல் பொருள்
  choice: ஊற்றுநீர்
  alternative: உயிருள்ள நீர்; ஓடும் நீர்; புதிய நீர்
  rationale: இங்கு முதன்மையாக உருவக அல்லது கோட்பாட்டுப் பொருள் அல்ல, சடங்கிற்குப் பயன்படுத்த வேண்டிய தேங்காத நீரின் தன்மை குறிப்பிடப்படுகிறது. அதேவேளையில், வேதாகமம் முழுவதும் எதிரொலிக்கக்கூடிய ‘உயிருள்ள நீர்’ என்ற நேரடிப் பொருள் அடிக்குறிப்பில் விடப்படுவதால் மூலத்தின் நுணுக்கம் மறைக்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘அறுக்க வேண்டும்’ என்பது சடங்கு வழிமுறைக்குரிய கட்டளைத் தொனியை இயல்பாக வெளிப்படுத்துகிறது; தேவையற்ற பலியியல் அல்லது பிரிவுசார் சொற்கள் சேர்க்கப்படவில்லை.
