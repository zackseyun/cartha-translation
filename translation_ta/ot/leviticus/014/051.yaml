    issue: ‘கேதுரு மரக்கட்டை’ is overly specific.
    rationale: ‘மரக்கட்டை’ commonly denotes a log/block. עֵץ הָאֶרֶז refers to cedar wood and does not specify that form; ‘கேதுரு மரத்துண்டு’ remains concrete for the ritual context without adding that specificity.
  - severity: low
    issue: Footnote b uses ‘புதிய நீர்,’ which is not the clearest Tamil idiom here.
    rationale: For מַיִם חַיִּים, ‘ஊற்றுநீர் அல்லது ஓடும் நீர்’ communicates the fresh/flowing-source sense more naturally while retaining the literal expression.
