base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/051.yaml
  text: Then he shall take the cedar wood[a], the hyssop, the scarlet yarn, and the living bird, and dip them in the blood of the slaughtered bird and in the fresh water[b], and sprinkle the house seven times.
translation:
  language: ta
  text: பின்பு அவர் கேதுரு மரத்துண்டையும், ஈசோப்புச் செடியையும், செந்நிற நூலையும்[a], உயிருள்ள பறவையையும் எடுத்து, அவற்றை அறுக்கப்பட்ட பறவையின் இரத்தத்திலும் ஓடும் நீரிலும்[b] தோய்த்து, வீட்டின்மேல் ஏழு முறை தெளிக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், ‘புழுவின் செந்நிறம்’; இது மரபாகச் செந்நிறச் சாயமிட்ட நூல் அல்லது இழை எனப் புரிந்துகொள்ளப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், ‘உயிருள்ள நீர்’; அதாவது ஊற்றுநீர் அல்லது ஓடும் நீர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: பின்பு அவர் ... எடுத்து
  rationale: சடங்கு வழிமுறைகளில் தொடர்ச்சியை உணர்த்தும் வாவ் இணைந்த வினை வடிவத்தை இயல்பான நவீனத் தமிழில் ‘பின்பு’ என்றும், அடுத்த வினைகளுடன் இணையும் வினையெச்சமாகவும் வழங்குகிறது.
- source_word: עֵץ הָאֶרֶז
  choice: கேதுரு மரக்கட்டை
  rationale: சடங்கில் பயன்படுத்தப்படும் கேதுரு மரத்துண்டைக் குறிக்கும் எபிரெயக் கூட்டுச்சொல்லைத் தெளிவாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: הָאֵזֹב
  choice: ஈசோப்புச் செடி
  rationale: தாவரத்தைக் குறிக்கும் மரபான பெயரைத் தக்கவைத்து, சாதாரண வாசகருக்குத் தெளிவாக ‘செடி’ என்று குறிப்பிடுகிறது.
- source_word: שְׁנִי הַתּוֹלַעַת
  choice: செந்நிற நூல்
  rationale: இந்தச் சொற்றொடர் பொதுவாகச் செந்நிறச் சாயமிட்ட நூல் அல்லது இழையைக் குறிக்கிறது; தமிழில் ‘செந்நிற நூல்’ சுருக்கமாகவும் புரியும்படியும் உள்ளது. சொல்லுக்குச் சொல் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: הַצִּפֹּר הַחַיָּה
  choice: உயிருள்ள பறவை
  rationale: அறுக்கப்பட்ட மற்றொரு பறவையிலிருந்து இதை வேறுபடுத்தும் חַיָּה என்பதன் நேரான பொருளைப் பாதுகாக்கிறது.
- source_word: וְטָבַל אֹתָם
  choice: அவற்றை ... தோய்த்து
  rationale: טבל என்பதன் ‘தோய்த்தல்/முக்குதல்’ என்ற சடங்குசார் பொருளை இயல்பான தமிழில் வழங்குகிறது; ‘அவற்றை’ என்பது முன் பட்டியலிடப்பட்ட அனைத்தையும் குறிக்கிறது.
- source_word: בְּדַם הַצִּפֹּר הַשְּׁחוּטָה
  choice: அறுக்கப்பட்ட பறவையின் இரத்தத்தில்
  rationale: שׁחט என்பதிலுள்ள சடங்குமுறைப்படி அறுக்கும் நுணுக்கத்தை வெறுமனே ‘கொல்லப்பட்ட’ என்பதைக் காட்டிலும் நன்றாகப் பாதுகாக்கிறது.
- source_word: וּבַמַּיִם הַחַיִּים
  choice: ஓடும் நீரில்
  rationale: சொல்லுக்குச் சொல் ‘உயிருள்ள நீர்’ என்றாலும், இச்சடங்குச் சூழலில் அது தேங்கிய நீருக்கு மாறான புதிய அல்லது இயற்கையாக ஓடும் நீரைக் குறிக்கிறது. நேரடி வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: וְהִזָּה אֶל הַבַּיִת
  choice: வீட்டின்மேல் ... தெளிக்க வேண்டும்
  rationale: Hiphil வடிவிலுள்ள נזה சடங்குமுறைத் தெளித்தலைக் குறிக்கிறது; אֶל என்பதன் திசை/இலக்கு உணர்வை ‘வீட்டின்மேல்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: שֶׁבַע פְּעָמִים
  choice: ஏழு முறை
  rationale: எண்ணிக்கையைக் குறிக்கும் சொற்றொடரின் நேரான, இயல்பான தமிழாக்கம்.
theological_decisions:
- issue: מַיִם חַיִּים என்ற சொற்றொடரைச் சடங்குச் சட்டத்தில் மொழிபெயர்த்தல்
  choice: ஓடும் நீர்
  alternative: உயிருள்ள நீர்; புதிய நீர்; ஊற்றுநீர்
  rationale: இங்கு இந்த எபிரெய மரபுத்தொடர் புதிய அல்லது இயற்கையாக ஓடும் நீரைக் குறிக்கிறது. ‘ஓடும் நீர்’ சடங்கின் நடைமுறைப் பொருளைத் தெளிவாகக் கூறுகிறது; அதேவேளை பின்னாளைய இறையியல் தொடர்புகளைத் தேவையின்றி இவ்வசனத்திற்குள் கொண்டுவருவதில்லை. நேரடி மொழிபெயர்ப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், சடங்குச் சட்டத்திற்கு ஏற்ற கண்ணியமானவும் தெளிவானவும் உள்ள நடை பயன்படுத்தப்பட்டுள்ளது. அரிதான தாவரப் பெயரான ‘ஈசோப்பு’ என்பதுடன் ‘செடி’ சேர்க்கப்பட்டு வாசகருக்குத் தெளிவு அளிக்கப்பட்டுள்ளது. அனைத்து அடிக்குறிப்பு குறியீடுகளும் அவை விளக்கும் சொற்றொடர்களுக்குப் பின்பே இடப்பட்டுள்ளன.
