  text: to give instruction about when it is unclean and when it is clean. This is the law concerning the defiling condition[a].
translation:
  language: ta
  text: தீட்டுப்படுத்தும் நிலைக்கான இந்தச் சட்டம், எது எப்போது தீட்டானது, எப்போது தூய்மையானது என்பதை அறிவுறுத்துவதற்கானது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: பாரம்பரியமாக, “தொழுநோய்” என்று மொழிபெயர்க்கப்படுகிறது. எபிரேயச் சொல் மனிதர்கள், துணிகள், அல்லது வீடுகளைப் பாதிக்கும் தீட்டுப்படுத்தும் நிலைகளைக் குறிக்கலாம்; அது நவீன ஹான்சன் நோயை மட்டும் குறிக்கவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהוֹרֹת
  choice: அறிவுறுத்தலை வழங்குவதற்காக
  rationale: ஹிஃபில் வடிவம், முந்தைய விதிகளுக்குட்பட்ட தூய்மை மற்றும் தீட்டு நிலைகளை அறிந்துகொள்வதற்கான அதிகாரபூர்வ அறிவுறுத்தலைக் குறிக்கிறது.
- source_word: בְּיוֹם הַטָּמֵא וּבְיוֹם הַטָּהֹר
  choice: எது எப்போது தீட்டுள்ளதாகவும் எப்போது தூய்மையாகவும் இருக்கிறது
  rationale: இங்குள்ள בְּיוֹם என்பது நேரடி நாளைக் குறிக்காமல், அந்த நிலை எப்போது உள்ளது என்பதைச் சுட்டும் கால மரபுத்தொடர். தமிழில் ‘எப்போது’ இயல்பாக அந்தப் பொருளைத் தருகிறது.
- source_word: תּוֹרַת
  choice: குறித்த சட்டம்
  rationale: லேவியராகமத்தின் சட்டச் சூழலில் תּוֹרָה இவ்வகையை ஆளும் விதிமுறையைக் குறிக்கிறது; ‘சட்டம்’ தெளிவாகவும் மரியாதைமிக்க நடையிலும் உள்ளது.
- source_word: הַצָּרָעַת
  choice: தீட்டுப்படுத்தும் பாதிப்பு
  rationale: இந்த எபிரேயச் சொல் மனிதர்களின் தோலை மட்டுமன்றி துணிகளையும் வீடுகளையும் பாதிக்கும் சடங்குசார் தீட்டு வகையைக் குறிக்கிறது. ஆகவே நவீன தொழுநோயுடன் தவறாக ஒப்பிடாமல், எல்லாச் சூழல்களையும் உள்ளடக்கும் சொற்றொடர் தேர்ந்தெடுக்கப்பட்டது.
theological_decisions:
- issue: லேவியராகமத்தின் தூய்மைச் சட்டங்களில் צָרַעַת என்பதன் மொழிபெயர்ப்பு
  choice: தீட்டுப்படுத்தும் பாதிப்பு
  alternative: தொழுநோய்
  rationale: צָרַעַת என்பது நவீன ஹான்சன் நோயைக் காட்டிலும் விரிவான சடங்குசார் வகை; மனிதர்கள், துணிகள், வீடுகள் ஆகியவற்றுக்கும் பயன்படுத்தப்படுகிறது. எனவே பிரதான உரை அதன் தீட்டு விளைவையும் பரந்த பயன்பாட்டையும் காக்கிறது; பாரம்பரிய மொழிபெயர்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, மரியாதைமிக்க சட்டநடை பயன்படுத்தப்பட்டுள்ளது. ‘நாள்’ என்ற சொல்லைச் சொற்படியாகப் பயன்படுத்தாமல் எபிரேயக் கால மரபுத்தொடரின் நடைமுறைப் பொருள் ‘எப்போது’ என வழங்கப்பட்டுள்ளது. முதல் வாக்கியத்தின் நோக்கத் துணைவாக்கியம் முந்தைய வசனங்களில் பட்டியலிடப்பட்ட சட்டங்களைச் சுட்டுவதால், தமிழில் முழுமையான வாக்கியமாக ‘இவை கொடுக்கப்பட்டன’ என்பது வெளிப்படுத்தப்பட்டுள்ளது.
