    text: நேரடியாக, “உயிருள்ள நீர்”; அதாவது, ஊற்றிலிருந்து கிடைக்கும் அல்லது ஓடும் புதிய நீர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִוָּה
  choice: பின்பு ... கட்டளையிட வேண்டும்
  rationale: சடங்குமுறைச் சட்டத்தில் வரும் தொடர்ச்சியையும் அதிகாரபூர்வமான கட்டளையையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: הַכֹּהֵן
  choice: ஆசாரியன்
  rationale: லேவியராகமத்தின் வழிபாட்டு மற்றும் சட்டச் சூழலில் כֹּהֵן என்பதற்கான நிலையான தமிழ் வேதாகமச் சொல்.
- source_word: וְשָׁחַט
  choice: அறுக்கும்படி
  rationale: எபிரெயத்தில் வினை செய்பாட்டு வடிவில் இருந்தாலும், ‘கட்டளையிட வேண்டும்’ என்பதோடு இணைத்து கட்டளையிடப்படும் செயலைத் தமிழில் இயல்பாகக் காட்டுகிறது; சடங்குசார் விலங்குக் கொலையைத் துல்லியமாகக் குறிக்கிறது.
- source_word: אֶת־הַצִּפּוֹר הָאֶחָת
  choice: ஒரு பறவையை
  rationale: முந்தைய சூழலில் குறிப்பிடப்பட்ட இரு பறவைகளில் ஒன்றைக் குறிக்கும் தனிப்படுத்தும் பொருளைப் பாதுகாக்கிறது.
- source_word: כְּלִי חֶרֶשׂ
  choice: மண்பாண்டம்
  rationale: சுடுமண்ணால் செய்யப்பட்ட சடங்குப் பாத்திரத்தை எளிய, இயல்பான தமிழில் குறிக்கிறது.
- source_word: עַל מַיִם חַיִּים
  choice: ஊற்றுநீர் உள்ள
  rationale: ‘உயிருள்ள நீர்’ என்ற சொல்லடுக்கு இங்கு தேங்கிய நீருக்கு மாறான இயற்கை ஊற்றிலிருந்து கிடைக்கும் புதிய நீரைக் குறிக்கிறது. பாத்திரத்தில் அந்த நீர் இருப்பதையும் தமிழ் வாக்கியம் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: מַיִם חַיִּים என்ற சடங்குசார் சொல்லடுக்கின் மொழிபெயர்ப்பு
  choice: ஊற்றுநீர்
  alternative: உயிருள்ள நீர்; ஓடும் நீர்; புதிய நீர்
  rationale: இங்கு பின்னாளைய இறையியல் உருவகத்தை நேரடியாகப் புகுத்தாமல், தூய்மைப்படுத்தும் சடங்கில் பயன்படுத்தப்படும் இயற்கை ஊற்றிலிருந்து கிடைக்கும் தேங்காத நீரைக் குறிக்கிறது. மூலத்தின் நேரடி சொல்லாக்கமும் பிற பொருள் வாய்ப்புகளும் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான சட்ட-சடங்கு நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆசாரியன்’ என்பது இந்நூலின் வழிபாட்டுச் சூழலைத் தெளிவாக வைத்திருக்கிறது; ‘மண்பாண்டம்’ என்பது தொழில்நுட்பச் சுமையில்லாமல் பொருளைக் கூறுகிறது.
