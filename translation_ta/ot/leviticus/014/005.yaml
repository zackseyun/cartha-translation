  text: Then the priest shall command that one bird be slaughtered over an earthenware vessel containing fresh water[a].
translation:
  language: ta
  text: பின்பு ஆசாரியன், ஊற்றுநீரின் மேல், ஒரு பறவையை மண்பாண்டத்துக்குள் அறுக்கும்படி கட்டளையிட வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
