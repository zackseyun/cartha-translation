id: LEV.14.14
reference: Leviticus 14:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/לָקַ֣ח הַ/כֹּהֵן֮ מִ/דַּ֣ם הָ/אָשָׁם֒ וְ/נָתַן֙ הַ/כֹּהֵ֔ן עַל תְּנ֛וּךְ אֹ֥זֶן הַ/מִּטַּהֵ֖ר הַ/יְמָנִ֑ית וְ/עַל בֹּ֤הֶן יָד/וֹ֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֥הֶן רַגְל֖/וֹ הַ/יְמָנִֽית־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/014.yaml
  text: Then the priest shall take some of the blood of the guilt offering[a], and the priest shall put it on the lobe of the right ear of the one being cleansed, and on the thumb of his right hand[b], and on the big toe of his right foot.
translation:
  language: ta
  text: ஆசாரியன் குற்றநிவாரணப் பலியின் இரத்தத்தில் சிறிதை[b] எடுக்க வேண்டும்; அதைச் சுத்திகரிக்கப்படுகிறவரின் வலது காதின் மடலின்மேலும்[a], அவருடைய வலது கையின் பெருவிரலின்மேலும், வலது காலின் பெருவிரலின்மேலும் பூச வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வலது காதின் நுனியின்மேல்.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “குற்றநிவாரணப் பலியின் இரத்தத்திலிருந்து”; சடங்கிற்காக அதில் சிறிதை ஆசாரியன் எடுக்கிறார் என்பதே பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִדַּם
  choice: இரத்தத்தில் சிறிதை
  rationale: מִן இங்கு பகுதியைக் குறிக்கிறது. சடங்கிற்காக அந்த இரத்தம் முழுவதையும் அல்ல, அதிலிருந்து ஒரு பகுதியை ஆசாரியன் எடுப்பதை நவீன தமிழில் தெளிவாகக் கூறுகிறது; எபிரெய வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: הָאָשָׁם
  choice: குற்றநிவாரணப் பலி
  rationale: லேவியராகமத்தின் பலிச்சட்டங்களில் אָשָׁם என்பது குற்றத்திற்கான நிவாரணத்துடன் தொடர்புடைய குறிப்பிட்ட பலிவகையைக் குறிக்கிறது. ‘குற்றநிவாரணப் பலி’ அதன் தனித்தன்மையையும் நோக்கத்தையும் தெளிவாகத் தெரிவிக்கிறது.
- source_word: תְּנוּךְ אֹזֶן
  choice: காதின் மடல்
  rationale: சடங்குச் சூழலில் תְּנוּךְ காதின் வெளிப்புற மென்மையான பகுதி அல்லது நுனியைக் குறிக்கிறது. ‘காதின் மடல்’ இயல்பான உடற்கூற்றுச் சொல்லாகத் தேர்ந்தெடுக்கப்பட்டது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: הַמִּטַּהֵר
  choice: சுத்திகரிக்கப்படுகிறவர்
  rationale: טהר என்பதன் ஹித்பாயேல் வினையெச்சம் இங்கு ஆசாரியச் சுத்திகரிப்புச் சடங்கிற்கு உட்படுகிற நபரைக் குறிக்கிறது. செயல் நடைபெற்றுக்கொண்டிருப்பதையும் அந்த நபர் சடங்கின் பயனாளி என்பதையும் இவ்வடிவம் காக்கிறது.
- source_word: הַיְמָנִית
  choice: வலது
  rationale: ஒவ்வொரு உடல் உறுப்பின் வலப்பக்கத்தையும் குறிக்கும் பெயரடை. நவீன தமிழில் ‘வலது காது/கை/கால்’ என்பதே இயல்பான வடிவம்.
- source_word: בֹּהֶן יָדוֹ
  choice: கையின் பெருவிரல்
  rationale: בֹּהֶן கை என்பதுடன் வரும்போது கட்டைவிரல் அல்லது பெருவிரலைக் குறிக்கிறது. ‘கையின் பெருவிரல்’ பாதத்தின் பெருவிரலுடன் உள்ள மூலமொழியின் இணை அமைப்பையும் காக்கிறது.
- source_word: בֹּהֶן רַגְלוֹ
  choice: காலின் பெருவிரல்
  rationale: בֹּהֶן கால் என்பதுடன் வரும்போது பாதத்தின் பெரிய விரலைக் குறிக்கிறது. ‘காலின் பெருவிரல்’ பொதுவாகப் புரியும் இயல்பான தமிழ்.
- source_word: וְלָקַח ... וְנָתַן
  choice: எடுக்க வேண்டும் ... பூச வேண்டும்
  rationale: சடங்குச் சட்டத்தின் நடைமுறைக் கட்டளையாக வரும் வினைவடிவங்களை ‘வேண்டும்’ கொண்டு அறிவுறுத்தலாக மொழிபெயர்த்துள்ளது. இரத்தத்தை உடல் உறுப்புகளில் இடுவதைத் தமிழில் ‘பூசுதல்’ இயல்பாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: சுத்திகரிப்புக்கு உட்படும் நபரின் பங்கு
  choice: சுத்திகரிக்கப்படுகிறவர்
  alternative: தம்மைச் சுத்திகரித்துக்கொள்கிறவர் / சுத்தமானவர்
  rationale: இச்சூழலில் அந்த நபர் ஆசாரியன் நடத்தும் சுத்திகரிப்புச் சடங்கிற்கு உட்படுகிறார். அவர் தம்மைத்தாமே சுத்திகரிக்கிறார் என்ற கருத்தையோ சடங்கு ஏற்கெனவே முடிந்துவிட்டது என்ற கருத்தையோ மொழிபெயர்ப்பு சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க தமிழ் பயன்படுத்தப்பட்டுள்ளது. சட்டநடை தெளிவாக இருக்க ‘வேண்டும்’ வடிவம் தேர்ந்தெடுக்கப்பட்டது. பாலினத்தைத் தேவையின்றி முன்னிறுத்தாமல் மரியாதைப் பன்மையான ‘அவர்’ பயன்படுத்தப்பட்டாலும், மூலத்தின் உடல் உறுப்புகளுக்குரிய ஒருமைத் தொடர்பு தெளிவாக வைக்கப்பட்டுள்ளது.
