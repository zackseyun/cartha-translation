  text: וְ/עָשָׂ֤ה אֶת הָֽ/אֶחָד֙ מִן הַ/תֹּרִ֔ים א֖וֹ מִן בְּנֵ֣י הַ/יּוֹנָ֑ה מֵ/אֲשֶׁ֥ר תַּשִּׂ֖יג יָדֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/030.yaml
  text: And he shall offer one of the turtledoves or one of the young pigeons[a], according to what his means can afford—
translation:
  language: ta
  text: அவன் தன் வசதிக்கேற்ப[a] காட்டுப்புறாக்களிலோ புறாக்குஞ்சுகளிலோ ஒன்றைப் பலியாகச் செலுத்த வேண்டும்—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லர்த்தமாக, ‘அவனுடைய கை எட்டுவதற்கேற்ப’; இது அவனால் செலவழிக்க முடிந்த அளவைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשָׂה
  choice: பலியாகச் செலுத்த வேண்டும்
  rationale: வினைச்சொல்லின் அடிப்படைப் பொருள் ‘செய்தல்’ என்றாலும், பலி குறித்த இச்சூழலில் பலியைச் செலுத்துவதைக் குறிக்கிறது; தமிழில் வழிபாட்டுச் சூழலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֶת־הָאֶחָד
  choice: ஒன்றை
  rationale: பின்வரும் இரு வகைப் பறவைகளில் ஒன்றைத் தெரிவுசெய்வதை இந்த அமைப்பு குறிக்கிறது.
- source_word: מִן־הַתֹּרִים
  choice: காட்டுப்புறாக்களிலோ
  rationale: תֹּרִים என்பது பலி விதிகளில் பொதுவான புறாவை அல்ல, குறிப்பாக turtledove வகையைச் சுட்டுகிறது; நவீனத் தமிழில் ‘காட்டுப்புறா’ தெளிவான வழக்குச் சொல்.
- source_word: אוֹ מִן־בְּנֵי הַיּוֹנָה
  choice: புறாக்குஞ்சுகளிலோ
  rationale: எபிரெயச் சொற்றொடர் இளம் புறாக்களைக் குறிக்கிறது; ‘புறாக்குஞ்சுகள்’ இயல்பாகவும் சுருக்கமாகவும் இதைத் தருகிறது.
- source_word: מֵאֲשֶׁר תַּשִּׂיג יָדוֹ
  choice: தன் வசதிக்கேற்ப
  rationale: சொல்லர்த்தமாக ‘அவனுடைய கை எட்டுவதிலிருந்து’ என்ற எபிரெய மரபுத்தொடர், ஒருவரின் பொருளாதாரத் திறனை அல்லது வசதியைக் குறிக்கிறது; ‘தன் வசதிக்கேற்ப’ அதன் பொருளை இயல்பான தமிழில் தருகிறது.
