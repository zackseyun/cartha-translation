  to: பின்பு உயிரோடிருக்கும் பறவையை நகரத்திற்கு வெளியே திறந்த வெளியில் விட்டனுப்ப வேண்டும். இவ்வாறு அவன் அந்த வீட்டிற்காகப் பாவநிவிர்த்தி செய்ய வேண்டும்[a]; அப்போது அது சுத்தமாகும்.
