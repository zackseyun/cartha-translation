  text: וְ/שִׁלַּ֞ח אֶת הַ/צִּפֹּ֧ר הַֽ/חַיָּ֛ה אֶל מִ/ח֥וּץ לָ/עִ֖יר אֶל פְּנֵ֣י הַ/שָּׂדֶ֑ה וְ/כִפֶּ֥ר עַל הַ/בַּ֖יִת וְ/טָהֵֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/053.yaml
  text: Then he shall release the live bird outside the city into the open field. Thus he shall make atonement for the house[a], and it shall be clean.
translation:
  language: ta
  text: பின்பு உயிரோடிருக்கும் பறவையை நகரத்திற்கு வெளியே திறந்த வெளியில் விட்டனுப்ப வேண்டும். இவ்வாறு அவன் அந்த வீட்டிற்காகப் பாவநிவிர்த்தி செய்ய வேண்டும்[a]; அப்போது அது சுத்தமாகும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவன் அந்த வீட்டைச் சடங்குமுறையில் தூய்மைப்படுத்த வேண்டும்’ அல்லது ‘அவன் அந்த வீட்டிற்காகப் பரிகாரம் செய்ய வேண்டும்.’ இங்கு எபிரேய மொழியில், சடங்கு சார்ந்த தூய்மைப்படுத்தும் சூழலில் ஆசாரியப் பாவநிவிர்த்திச் சொல்லாட்சி பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּח
  choice: பின்பு ... பறக்கவிட வேண்டும்
  rationale: பீயேல் வினை இங்கு பறவையைச் சடங்குமுறையில் விடுவிப்பதைக் குறிக்கிறது. ‘பறக்கவிட வேண்டும்’ என்பது பறவையைப் பற்றிய சூழலில் இயல்பான நவீனத் தமிழ்; ‘பின்பு’ தொடர்ச்சியைக் காட்டும் வாவை வெளிப்படுத்துகிறது.
- source_word: הַצִּפֹּר הַחַיָּה
  choice: உயிருள்ள பறவை
  rationale: சடங்கில் முன்பு கொல்லப்பட்ட பறவைக்கு மாறாக, இது உயிரோடிருக்கும் பறவை என்பதைக் குறிக்கிறது.
- source_word: אֶל מִחוּץ לָעִיר
  choice: நகரத்திற்கு வெளியே
  rationale: நகர எல்லைக்கு அப்பாலுள்ள இடத்தை நோக்கிய நகர்வை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: אֶל פְּנֵי הַשָּׂדֶה
  choice: திறந்த வெளியில்
  rationale: ‘வயலின் முகப்பை நோக்கி’ என்ற எபிரெய மொழிமரபு திறந்த வெளிப்பகுதியைக் குறிக்கிறது; சொல்லுக்குச் சொல் மொழிபெயர்ப்பைத் தவிர்த்து அதன் இடவுணர்வைப் பாதுகாக்கிறது.
- source_word: וְכִפֶּר עַל הַבַּיִת
  choice: அந்த வீட்டிற்காகப் பாவநிவிர்த்தி செய்ய வேண்டும்
  rationale: כפר என்பது ஆசாரியச் சடங்கு மொழியில் பாவநிவிர்த்தி அல்லது பரிகாரம் செய்வதைக் குறிக்கிறது. ஒரு வீட்டைக் குறித்த தூய்மைச் சடங்காக இருந்தாலும், மூலத்தின் பலியுறவு சார்ந்த சொல்லாட்சியையும் அதன் திட்டமிட்ட பதற்றத்தையும் இந்த மொழிபெயர்ப்பு காக்கிறது.
- source_word: וְטָהֵר
  choice: அப்போது அது சுத்தமாகும்
  rationale: சடங்குக்குப் பின் வீடு அடையும் தூய்மை நிலையைத் தெளிவாகக் காட்டுகிறது. ‘அது’ என்பது வீட்டைக் குறிக்கிறது.
theological_decisions:
- issue: ஒரு வீட்டுக்கான தூய்மைச் சடங்கில் כפר என்பதன் பொருள்
  choice: பாவநிவிர்த்தி செய்ய வேண்டும்
  alternative: வீட்டைச் சடங்குமுறையில் தூய்மைப்படுத்த வேண்டும்; வீட்டிற்காகப் பரிகாரம் செய்ய வேண்டும்
  rationale: மூலம் ஒரு வீட்டைப் பற்றிய சூழலிலும் ஆசாரியப் பாவநிவிர்த்திச் சொல்லையே பயன்படுத்துகிறது. அதை வெறும் சுத்தப்படுத்துதல் என்று குறுக்காமல் அந்த இறையியல் பதற்றம் பாதுகாக்கப்படுகிறது; அதேவேளை குறிப்பிட்ட பிற்காலப் பாவநிவிர்த்திக் கோட்பாடு எதுவும் இதில் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. சடங்கு சார்ந்த כפר என்பதன் இறையியல் நிறைவும், ஒரு வீட்டிற்குப் ‘பாவநிவிர்த்தி’ செய்வது என்ற மூலத்தின் அசாதாரணமான பதற்றமும் அடிக்குறிப்புடன் பாதுகாக்கப்பட்டுள்ளன.
