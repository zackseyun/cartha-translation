revisions:
- from: பின்பு, தொற்று இருக்கும் கற்களை[a] அகற்றி, நகருக்கு வெளியே அசுத்தமான ஓர் இடத்தில் எறியும்படி ஆசாரியன் கட்டளையிட வேண்டும்.
  to: பின்பு, தொற்று இருக்கும் கற்களை[a] அகற்றி, அவற்றை நகருக்கு வெளியே உள்ள அசுத்தமான ஓர் இடத்துக்கு எறியும்படி ஆசாரியன் கட்டளையிட வேண்டும்.
  rationale: The revision retains the draft's accurate terminology and procedural force while making the destination explicit, as required by the two Hebrew directional phrases. It also supplies ‘அவற்றை’ for clear reference to the stones and revises the footnote to idiomatic Tamil without altering the lexical ambiguity.
