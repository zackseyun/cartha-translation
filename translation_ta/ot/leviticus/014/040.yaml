base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/040.yaml
  text: then the priest shall command that they remove the stones in which the infection is[a], and throw them outside the city to an unclean place.
translation:
  language: ta
  text: பின்பு, தொற்று இருக்கும் கற்களை[a] அகற்றி, அவற்றை நகருக்கு வெளியே உள்ள அசுத்தமான ஓர் இடத்துக்கு எறியும்படி ஆசாரியன் கட்டளையிட வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, “அவற்றில் தொற்று உள்ள கற்களை.” எபிரெய மொழியில் சொல்லுக்குச் சொல்: “அவற்றில் தொற்று இருக்கும் கற்களை.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִוָּה
  choice: பின்பு ... கட்டளையிட வேண்டும்
  rationale: வாவ் இணைப்புடன் வந்த நிறைவுவினை, சடங்கு நடைமுறையின் அடுத்த படியை விதிமுறைசார் எதிர்கால வலிமையுடன் தொடர்கிறது; ‘பின்பு’ படிநிலையை இயல்பாகவும், ‘கட்டளையிட வேண்டும்’ அதன் கட்டாயத் தன்மையையும் தெரிவிக்கிறது.
- source_word: הַכֹּהֵן
  choice: ஆசாரியன்
  rationale: லேவியராகமச் சடங்கு சூழலில் כֹּהֵן என்பதற்கான தெளிவான, வழக்கமான தமிழ் இணைச்சொல்.
- source_word: וְחִלְּצוּ
  choice: அகற்றி
  rationale: சுவரிலிருந்து கற்களை வெளியே எடுப்பதைக் குறிக்கிறது; செய்முறையைத் தேவையின்றி மிகத் துல்லியப்படுத்தாமல் இயல்பாகத் தெரிவிக்கிறது.
- source_word: הָאֲבָנִים
  choice: கற்களை
  rationale: கட்டிடத்தில் உள்ள கற்கள் என்பது சூழலால் தெளிவாகிறது; எபிரெயச் சொல்லின் பொதுவான பொருள் நேரடியாகப் பாதுகாக்கப்படுகிறது.
- source_word: אֲשֶׁר בָּהֵן הַנָּגַע
  choice: தொற்று இருக்கும் கற்களை
  rationale: בָּהֵן என்பதின் ‘அவற்றில்’ என்ற இடவுறவை இயல்பான தமிழில் பாதுகாக்கிறது. נֶגַע என்பதற்கு நவீன மருத்துவ நோயைத் தீர்மானிக்காமல், வீட்டைப் பாதிக்கும் மாசுபடுத்தும் நிலையை ‘தொற்று’ என வழங்குகிறது.
- source_word: וְהִשְׁלִיכוּ אֶתְהֶן
  choice: எறியும்படி
  rationale: השליך என்பதன் இயல்பான செயற்பொருளைத் தெரிவிக்கிறது; ‘அவற்றை’ என்பது தமிழில் கற்களைக் குறிக்கும் பொருளாக வினையுடன் உட்பொருளாகத் தெளிவாக இருப்பதால் மீண்டும் சொல்லப்படவில்லை.
- source_word: אֶל מִחוּץ לָעִיר
  choice: நகருக்கு வெளியே
  rationale: நகரின் எல்லைக்கு அப்பால் கொண்டு செல்லும் திசை மற்றும் இடப்பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: אֶל מָקוֹם טָמֵא
  choice: அசுத்தமான ஓர் இடத்தில்
  rationale: טָמֵא என்பதன் லேவிய தூய்மை–அசுத்த வகைப்பாட்டை ‘அசுத்தமான’ எனப் பாதுகாக்கிறது; இலக்கு இடத்தைத் தமிழில் இயல்பாகக் குறிக்க ‘இடத்தில்’ பயன்படுத்தப்படுகிறது.
theological_decisions:
- issue: லேவியராகமத்தின் தூய்மைச் சொற்களை மொழிபெயர்த்தல்
  choice: טָמֵא என்பதற்கு ‘அசுத்தமான’; வீட்டுச் சூழலில் נֶגַע என்பதற்கு ‘தொற்று’
  alternative: טָמֵא என்பதற்கு ‘தீட்டான’ அல்லது ‘தூய்மையற்ற’; נֶגַע என்பதற்கு ‘பாதிப்பு’, ‘கறை’ அல்லது ‘பூஞ்சை’
  rationale: வசனம் நவீன அறிவியல் அல்லது மருத்துவ நோயறிதலை அளிக்காமல் சடங்குசார் அசுத்தத்தைக் குறிக்கிறது. ‘அசுத்தமான’ அந்த வகைப்பாட்டைத் தெளிவாகக் காட்டுகிறது; ‘தொற்று’ பாதிப்பின் தன்மையைச் சொன்னாலும் அதை பூஞ்சை அல்லது குறிப்பிட்ட நோய் என்று முடிவுசெய்யவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான விதிமுறை நடையைப் பயன்படுத்துகிறது. எபிரெய வாக்கியத்தின் நடைமுறை வரிசையும் சடங்குசார் சொற்பொருளும் பாதுகாக்கப்பட்டுள்ளன.
