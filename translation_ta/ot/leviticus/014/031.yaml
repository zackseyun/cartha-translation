base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/031.yaml
  text: whatever his means can afford[a], one as a sin offering and one as a burnt offering, along with the grain offering[b]. Thus the priest shall make atonement for the one being cleansed before Yahweh.
translation:
  language: ta
  text: அவனால் செலுத்த முடிந்தவற்றில்[a] ஒன்றைப் பாவநிவாரணப் பலியாகவும்[b], மற்றொன்றைத் தகனபலியாகவும், தானியப் படையலுடன் செலுத்த வேண்டும். இவ்வாறு ஆசாரியன் தூய்மையாக்கப்படுகிறவனுக்காக யாவேயின் முன்னிலையில் பரிகாரம் செய்வான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் நேர்ப்பொருள், ‘அவனுடைய கை எட்டுவது’; அதாவது, அவனால் செலவிட முடிந்தது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘தூய்மைப்படுத்தும் பலி’.
    reason: alternative_reading
lexical_decisions:
- source_word: אֲשֶׁר תַּשִּׂיג יָדוֹ
  choice: அவனுடைய வசதிக்கு எட்டியவற்றில்
  rationale: எபிரெய மொழிமரபின் நேர்ப்பொருள் ‘அவனுடைய கை எட்டுவது’; இங்கு அது ஒருவரின் பொருளாதார வசதிக்குள் இருப்பதைக் குறிக்கிறது. தமிழில் இயல்பாகவும் மூல உருவகத்தின் சுவட்டை ஓரளவு தக்கவைத்தும் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: חַטָּאת
  choice: பாவநிவாரணப் பலி
  rationale: லேவியராகமப் பலியியல் சூழலில் பாவத்தையும் சடங்குத் தூய்மைப்படுத்துதலையும் சார்ந்த பலியைக் குறிக்கிறது. பரவலாகப் புரிந்துகொள்ளப்படும் ‘பாவநிவாரணப் பலி’ முதன்மை உரையில் வைக்கப்பட்டு, ‘தூய்மைப்படுத்தும் பலி’ அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: עֹלָה
  choice: தகனபலி
  rationale: முழுவதுமாக எரிக்கப்பட்டு புகையாக மேலே எழும் பலிக்கான வழக்கமான தமிழ்ச் சொல்.
- source_word: עַל הַמִּנְחָה
  choice: தானியப் படையலுடன்
  rationale: இங்கு עַל இடப்பொருளான ‘மேல்’ என்பதைக் காட்டாமல், உடன் சேர்த்துச் செலுத்தப்படுவதைச் சுட்டுகிறது.
- source_word: וְכִפֶּר
  choice: பரிகாரம் செய்வான்
  rationale: ஆசாரியப் பலிச் சடங்கில் כפר குறிக்கும் நிவர்த்தி/பரிகாரச் செயலைத் தக்கவைக்கிறது; குறிப்பிட்ட பிற்காலப் பரிகாரக் கோட்பாட்டை உரைக்குள் திணிப்பதில்லை.
- source_word: הַמִּטַּהֵר
  choice: தூய்மையாக்கப்படுகிறவன்
  rationale: தூய்மைப்படுத்தும் செயல்முறைக்கு உட்பட்டிருக்கும் நபரைக் குறிக்கும் எபிரெயப் பங்கேற்பு வடிவத்தின் தொடர்நிலையை வெளிப்படுத்துகிறது.
- source_word: לִפְנֵי יְהוָה
  choice: யாவேக்கு முன்பாக
  rationale: ‘யாவேயின் முன்னிலையில்’ என்ற பொருளை இயல்பான, சுருக்கமான தமிழில் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் ஒலிபெயர்க்கிறது.
theological_decisions:
- issue: பலியியல் சொற்களையும் பரிகார மொழியையும் மிகையாகத் தீர்மானிக்காமல் மொழிபெயர்த்தல்
  choice: ‘பாவநிவாரணப் பலி’, ‘தகனபலி’, ‘பரிகாரம் செய்வான்’ என்ற மரபான பலியியல் சொற்களைப் பயன்படுத்துதல்
  alternative: ‘தூய்மைப்படுத்தும் பலி’, ‘தூய்மைப்படுத்துவான்’
  rationale: மூல உரையில் பாவநிவர்த்தியும் சடங்குத் தூய்மையும் ஒன்றோடொன்று தொடர்புடையவை. முதன்மை மொழிபெயர்ப்பு பரிச்சயமான பலியியல் சொல்லாட்சியைப் பேணுகிறது; חַטָּאת என்பதன் தூய்மைப்படுத்தும் நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: தெய்வீகப் பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: יהוה என்பதைப் பட்டத்தால் மாற்றாமல் தனிப்பட்ட பெயராக ஒலிபெயர்ப்பது மூல உரையின் தன்மையைக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான வேதாகம நடையில் வடிவமைக்கப்பட்டது. 31ஆம் வசனத்தின் தொடக்கம் முந்தைய வசனத்தின் வினையைத் தொடரும் எபிரெய அமைப்பாக இருப்பதால், தமிழில் வாக்கியத்தை முழுமையாக்க ‘செலுத்த வேண்டும்’ என்பது சூழலிலிருந்து வெளிப்படையாகச் சேர்க்கப்பட்டது. அடிக்குறிப்பு [b] பொருளுக்கேற்றவாறு חַטָּאת என்பதற்குப் பின்னர் வைக்கப்பட்டது.
