  text: then the owner of the house shall come and tell the priest[a], saying, ‘Something like a plague has appeared to me in the house.’
translation:
  language: ta
  text: அப்போது வீட்டின் உரிமையாளர் வந்து, ஆசாரியரிடம், “வீட்டில் எனக்கு வாதை போன்ற ஏதோ ஒன்று தென்பட்டது[a]” என்று தெரிவிக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “வாதை போன்றது.” வீட்டின் உரிமையாளர் தான் கண்ட தோற்றத்தை மட்டுமே தெரிவிக்கிறார்; அது என்னவென்று உறுதியாகத் தீர்மானிக்கவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָא
  choice: அப்போது ... வந்து
  rationale: சட்ட நடைமுறையின் அடுத்த கட்டத்தை இணைப்புச் சொல் குறிக்கிறது; தமிழில் “அப்போது ... வந்து” என்பது அந்தத் தொடர்ச்சியை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר לוֹ הַבַּיִת
  choice: வீட்டின் உரிமையாளர்
  rationale: சொல்லுக்கு சொல் பொருள் ‘வீடு யாருக்குச் சொந்தமோ அவர்’; “வீட்டின் உரிமையாளர்” என்பது தெளிவான, இயல்பான நவீனத் தமிழ்.
- source_word: וְהִגִּיד לַכֹּהֵן
  choice: குருவிடம் ... தெரிவிக்க வேண்டும்
  rationale: נגד என்பதன் ஹிஃபில் வடிவம் ‘அறிவித்தல்/தெரிவித்தல்’ எனப் பொருள்படும். சட்ட நடைமுறையில் அதிகாரப்பூர்வமாக அறியத்தருவதை “தெரிவிக்க வேண்டும்” தெளிவாகக் காட்டுகிறது.
- source_word: לֵאמֹר
  choice: “...” என்று
  rationale: எபிரெய மேற்கோள் அறிமுகத்தைத் தமிழின் இயல்பான நேர்கூற்று அமைப்பான “என்று” மூலம் வெளிப்படுத்துகிறது.
- source_word: כְּנֶגַע
  choice: பாதிப்பு போன்ற ஒன்று
  rationale: כְּ என்ற முன்னொட்டு ‘போன்ற’ என்ற தோராயத் தன்மையைக் குறிக்கிறது. נגע இங்கு வீட்டில் காணப்படும் தூய்மைக்கேடு சார்ந்த பாதிப்பைக் குறிக்கிறது; “பாதிப்பு” நவீன மருத்துவ நோயறிதலைத் திணிக்காமல் பரந்த பொருளைத் தக்கவைக்கிறது.
- source_word: נִרְאָה לִי
  choice: எனக்குத் தென்படுகிறது
  rationale: ראה என்பதன் நிஃபால் வடிவம் ‘தோன்றுதல்/காணப்படுதல்’ என்ற பொருளைத் தருகிறது. “எனக்குத் தென்படுகிறது” என்பது உரிமையாளரின் வரையறுக்கப்பட்ட பார்வையைத் தக்கவைத்து, உறுதியான நோயறிதலாக மாற்றுவதில்லை.
- source_word: בַּבָּיִת
  choice: வீட்டில்
  rationale: ב என்ற முன்னிடைச்சொல் இங்கு பாதிப்பு காணப்படும் கட்டிடத்தைக் குறிப்பதால் “வீட்டில்” இயல்பான மொழிபெயர்ப்பு.
theological_decisions:
- issue: வீட்டின் நிலையை உறுதியான தூய்மைக்கேடாக முன்கூட்டியே தீர்மானித்தல்
  choice: “பாதிப்பு போன்ற ஒன்று ... தென்படுகிறது” என்று உரிமையாளரின் ஐயத்துடனான கவனிப்பாக மொழிபெயர்க்கப்பட்டது.
  alternative: “வீட்டில் வாதை ஏற்பட்டுள்ளது” என்று உறுதியான தீர்ப்பாக மொழிபெயர்த்தல்.
  rationale: அசல் உரையின் כְּ (‘போன்ற’) மற்றும் נִרְאָה לִי (‘எனக்குத் தென்படுகிறது’) ஆகிய இரண்டும் உரிமையாளர் இறுதி முடிவு கூறவில்லை என்பதைக் காட்டுகின்றன; அடுத்ததாகக் குருவே ஆய்வு செய்ய வேண்டும்.
translation_notes:
  register: நவீன தரத் தமிழில், சட்ட நடைமுறைக்கு ஏற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. “குஷ்டம்” அல்லது குறிப்பிட்ட பூஞ்சை போன்ற குறுகிய நோயறிதல் சொற்கள் தவிர்க்கப்பட்டன; அசல் உரையின் தோராயமும் தெளிவின்மையும் காக்கப்பட்டன.
