base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/029.yaml
  text: And the rest of the oil that is in the priest’s palm he shall put on the head of the one being cleansed[a], to make atonement for him before Yahweh.
translation:
  language: ta
  text: ஆசாரியனின் உள்ளங்கையில் இருக்கும் எண்ணெயின் மீதியை[a] ஆசாரியன் சுத்திகரிக்கப்படுகிறவரின் தலையில் வைக்க வேண்டும்; யாவேவின் முன்னிலையில் அவருக்காகப் பரிகாரம் செய்யும் பொருட்டு அவ்வாறு செய்ய வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆசாரியனின் உள்ளங்கையில் இருக்கும் எண்ணெயிலிருந்து மீந்திருப்பதை.”
    reason: மூலமொழியின் מִן என்ற முன்னிடைச்சொல்லை இன்னும் சொற்படி காட்டும் மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: וְהַנּוֹתָר מִן הַשֶּׁמֶן
  choice: எண்ணெயின் மீதியை
  rationale: נותר என்பது எஞ்சியிருப்பதைக் குறிக்கிறது; מן இங்கு பகுதி சார்ந்த பொருளைத் தருவதால், இயல்பான தமிழில் ‘எண்ணெயின் மீதி’ என வழங்கப்படுகிறது.
- source_word: אֲשֶׁר עַל כַּף הַכֹּהֵן
  choice: ஆசாரியனின் உள்ளங்கையில் இருக்கும்
  rationale: כף என்பது கையின் உள்ளங்கையை அல்லது குழிவான பகுதியைக் குறிக்கிறது. திரவம் கையில் தங்கியிருக்கும் சூழலில் עַל என்பதற்கு இயல்பான தமிழாக ‘உள்ளங்கையில்’ பொருந்துகிறது.
- source_word: יִתֵּן עַל רֹאשׁ
  choice: தலையின்மேல் வைக்க வேண்டும்
  rationale: נתן என்பதன் விரிவான ‘கொடு/வை’ பொருள்களில், எண்ணெயைப் பூசும் இந்தச் சடங்குச் செயலில் ‘வைக்க வேண்டும்’ நேரடியும் இயல்பானதும் ஆகும்.
- source_word: הַמִּטַּהֵר
  choice: தூய்மையாக்கப்படுகிறவர்
  rationale: טהר என்பதன் Hitpael வினையெச்ச வடிவம் தூய்மையாக்கும் சடங்கை அனுபவித்து வருகிற நபரைச் சுட்டுகிறது; செயல்முறைத் தன்மையை இவ்வடிவம் காக்கிறது.
- source_word: לְכַפֵּר עָלָיו
  choice: அவருக்காகப் பாவநிவிர்த்தி செய்யும்படி
  rationale: כפר என்பது பலிச் சடங்குச் சூழலின் முக்கிய சொல்; על அந்த நிவிர்த்தி யாருக்காகச் செய்யப்படுகிறது என்பதைக் குறிக்கிறது.
- source_word: לִפְנֵי יְהוָה
  choice: யாவே முன்னிலையில்
  rationale: לפני என்பது தேவனுடைய முன்னிலையைக் குறிக்கிறது; יהוה என்ற உடன்படிக்கைப் பெயர் ஒலிபெயர்ப்பாக ‘யாவே’ என வழங்கப்படுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரையில் நான்கு எழுத்து இறைப்பெயர் நேரடியாக இருப்பதால், பட்டப்பெயராக மாற்றாமல் உடன்படிக்கைப் பெயரைத் தமிழில் ஒலிபெயர்த்துள்ளது.
- issue: כפר என்ற பலிச் சடங்குச் சொல்லின் பொருள்
  choice: பாவநிவிர்த்தி செய்ய
  alternative: பரிகாரம் செய்ய
  rationale: இச்சொல்லின் வழிபாட்டு மற்றும் இறையியல் கனத்தைத் தக்கவைத்தபடி, நபருக்காகச் செய்யப்படும் நிவிர்த்தியைத் தெளிவாகக் காட்டுகிறது; அதன் செயல்முறையை இதற்கு மேல் விளக்கி உரையின் இறையியல் இழுபறியைத் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. சடங்குச் சொற்களின் தனித்துவம் காக்கப்பட்டாலும், தேவையற்ற பழமையான சொல்லாட்சியும் பிரிவுசார் விளக்கமும் தவிர்க்கப்பட்டுள்ளன.
