  source_fidelity: 'மூல எபிரேயத்தின் சடங்கு வரிசையும் முக்கிய கூறுகளும் பெரும்பாலும் துல்லியமாக உள்ளன: ஆசாரியனின் உள்ளங்கையில் எஞ்சிய எண்ணெய், சுத்திகரிக்கப்படுகிற நபரின் தலை, யாவேவின் முன்னிலையில் செய்யப்படும் כפר ஆகியவை காக்கப்பட்டுள்ளன. ஆனால் ‘பாவநிவிர்த்தி’ என்பது כפר-க்கு ‘பாவம்’ என்ற குறிப்பைச் சேர்க்கிறது; இவ்வசனம் அந்தக் குறிப்பை வெளிப்படையாகச் சொல்லவில்லை. ஆகவே பரந்த சடங்குப் பொருளுடைய ‘பரிகாரம்’ பாதுகாப்பானது.'
