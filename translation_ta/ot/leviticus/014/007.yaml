  to: தோல் நோயிலிருந்து[a] தூய்மையாக்கப்படுகிறவர்மேல் அதை ஏழு முறை தெளித்து, அவரைத் தூயவர் என்று அறிவிக்க வேண்டும்[b]. பின்பு உயிருள்ள பறவையை வயல்வெளிக்கு விட வேண்டும்.
