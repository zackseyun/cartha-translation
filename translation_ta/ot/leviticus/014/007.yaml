base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/007.yaml
  text: He shall sprinkle it on the one being cleansed from the skin disease seven times[a], and he shall pronounce him clean[b], and he shall let the living bird go free over the open field.
translation:
  language: ta
  text: தோல் நோயிலிருந்து[a] தூய்மையாக்கப்படுகிறவர்மேல் அதை ஏழு முறை தெளித்து, அவரைத் தூயவர் என்று அறிவிக்க வேண்டும்[b]. பின்பு உயிருள்ள பறவையை வயல்வெளிக்கு விட வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மரபாக ‘தொழுநோய்’ என மொழிபெயர்க்கப்படுகிறது. இங்குள்ள எபிரேயச் சொல், நவீன தொழுநோயை மட்டும் அல்லாமல் லேவியராகமத்தில் பலவகைத் தோல் பாதிப்புகளையும் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அவரைத் தூய்மைப்படுத்த வேண்டும்.’ இங்கு ஆசாரியரின் செயல் வெறும் மருத்துவச் செயல் அல்ல; சடங்கு மற்றும் நீதித்துறை சார்ந்த அதிகாரபூர்வச் செயல்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִזָּה
  choice: அதைத் தெளித்து
  rationale: நזה என்பதன் ஹிஃபில் வடிவம் சடங்குச் சூழலில் ஒரு திரவத்தை அல்லது இரத்தத்தைத் தெளிப்பதைக் குறிக்கிறது. எபிரேயத்தில் செயப்படுபொருள் இவ்வசனத்தில் வெளிப்படையாக இல்லாவிட்டாலும், முந்தைய வசனத்தில் கூறப்பட்ட கலவையைச் சூழல் சுட்டுவதால் தமிழில் இயல்பாக ‘அதை’ சேர்க்கப்பட்டுள்ளது.
- source_word: הַמִּטַּהֵר
  choice: தூய்மையாக்கப்பட்டுக்கொண்டிருப்பவர்
  rationale: טהר என்பதன் ஹித்பயேல் நிகழ்காலப் பெயரெச்சம், தூய்மைப்படுத்தும் சடங்கு நடைமுறைக்கு உட்பட்டிருக்கும் நபரைக் குறிக்கிறது. இத்தொடர் அந்தச் செயல்முறை இன்னும் நடந்துகொண்டிருப்பதைப் பாதுகாக்கிறது.
- source_word: מִן הַצָּרַעַת
  choice: தோல் நோயிலிருந்து
  rationale: லேவியராகமத்தில் צָרַעַת என்பது நவீன தொழுநோயை மட்டும் குறிக்காமல் பலவகைத் தோல் பாதிப்புகளை உள்ளடக்கும் சடங்குத் தீட்டின் வகைப்பாடாக உள்ளது. ஆகவே தவறான மருத்துவத் துல்லியத்தைத் தவிர்க்க ‘தோல் நோய்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: שֶׁבַע פְּעָמִים
  choice: ஏழு முறை
  rationale: எண்ணிக்கையைக் குறிக்கும் இத்தொடரின் நேரடியான, இயல்பான தமிழ் இணை.
- source_word: וְטִהֲרוֹ
  choice: அவரைத் தூயவர் என்று அறிவிக்க வேண்டும்
  rationale: ஆசாரிய மற்றும் சட்டச் சூழலில் טהר என்பது உடலைச் சுத்தப்படுத்துவதை மட்டும் அல்லாமல், ஒருவரைச் சடங்கின்படி தூயவர் என அதிகாரபூர்வமாக அறிவிப்பதையும் குறிக்கலாம். ‘அறிவிக்க’ என்பது அந்தச் சடங்கு-நீதித்துறைச் செயல்பாட்டைத் தெளிவாகக் காட்டுகிறது.
- source_word: וְשִׁלַּח
  choice: பறந்துபோக விட வேண்டும்
  rationale: שׁלח என்பது அனுப்புதல் அல்லது விடுவித்தலைக் குறிக்கிறது. உயிருள்ள பறவை சடங்கின் ஒரு பகுதியாக விடப்படுவதால், தமிழில் இவ்வினை இயல்பாகவும் காட்சித் தெளிவுடனும் அமைந்துள்ளது.
- source_word: הַצִּפֹּר הַחַיָּה
  choice: உயிருள்ள பறவை
  rationale: இந்த அடைமொழி முந்தைய வசனத்தில் கொல்லப்பட்ட பறவையிலிருந்து இதை வேறுபடுத்துகிறது.
- source_word: עַל פְּנֵי הַשָּׂדֶה
  choice: வெட்டவெளியில்
  rationale: עַל־פְּנֵי என்பது இங்கு வயல் அல்லது திறந்த நிலப்பரப்பின்மேல், அதன் வெளிப்பரப்பில் என்ற இடவியல் கருத்தைக் கொடுக்கிறது. ‘வெட்டவெளியில்’ என்பது அதைப் பொருள் மாறாமல் இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: צָרַעַת என்பதன் மொழிபெயர்ப்பு
  choice: தோல் நோய்
  alternative: தொழுநோய்
  rationale: லேவியராகமத்தின் צָרַעַת நவீன ஹான்சன் நோயுடன் முழுமையாக ஒத்துப்போவதில்லை; அது அதைவிட விரிவான சடங்குத் தீட்டு வகைப்பாடு. எனவே காலத்திற்குப் பொருந்தாத மருத்துவக் கருத்தை உரைக்குள் கொண்டுவராமல் ‘தோல் நோய்’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
- issue: וְטִהֲרוֹ என்பதன் செயற்பாட்டு நுணுக்கம்
  choice: தூயவர் என்று அறிவிக்க வேண்டும்
  alternative: அவரைத் தூய்மைப்படுத்த வேண்டும்
  rationale: இங்கு ஆசாரியரின் செயல் உடல்நலச் சிகிச்சை மட்டுமல்ல; சடங்கு மற்றும் நீதித்துறை சார்ந்த அதிகாரபூர்வத் தீர்ப்பும் ஆகும். இருந்தாலும் எபிரேய வினை ‘தூய்மைப்படுத்துதல்’ என்ற காரணவினைப் பொருளையும் தாங்கக்கூடும் என்பதால் அந்த மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் வேதாகமச் சடங்கின் செறிவும் காக்கப்பட்டுள்ளன. நீண்ட எபிரேய வாக்கியம் தமிழில் தெளிவிற்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது. ‘தூய்மை’ என்ற சொல் உடல் சுத்தத்தை விட சடங்குத் தூய்மையை இச்சூழலில் குறிக்கிறது.
