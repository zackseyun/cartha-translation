revisions:
- from: 'அந்த வீடு தனிமைப்படுத்தப்பட்டிருக்கும் நாட்களிலெல்லாம், அதற்குள் நுழைகிற எவரும் மாலைவரை தீட்டுள்ளவராக இருப்பார்.[a]


    [a] “தனிமைப்படுத்தப்பட்டிருக்கும்” என்பதற்கு “பூட்டி வைக்கப்பட்டிருக்கும்” அல்லது “அடைத்து வைக்கப்பட்டிருக்கும்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல், பரிசோதனைக்காக அந்த வீடு ஆசாரியரின் கட்டுப்பாட்டின்கீழ் தனியே வைக்கப்பட்டிருப்பதைக் குறிக்கிறது.'
  to: அந்த வீடு தனிமைப்படுத்தி வைக்கப்பட்டிருக்கும் எல்லா நாட்களிலும், அதற்குள் நுழையும் எவரும் மாலைவரை தீட்டுப்பட்டவராவார்.[a]
  rationale: The revision preserves the Hebrew scope and legal register while improving idiomatic modern Tamil and making the ritual-impurity consequence more explicit. The footnote continues to mark the lexical ambiguity of the confinement term without adding an unwarranted detail such as locking.
