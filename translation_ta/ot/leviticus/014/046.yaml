  yaml_path: translation/ot/leviticus/014/046.yaml
  text: And whoever enters the house during all the days that it is quarantined shall be unclean until the evening[a].
translation:
  language: ta
  text: அந்த வீடு தனிமைப்படுத்தி வைக்கப்பட்டிருக்கும் எல்லா நாட்களிலும், அதற்குள் நுழையும் எவரும் மாலைவரை தீட்டுப்பட்டவராவார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தனிமைப்படுத்தி வைக்கப்பட்டிருக்கும்” என்பதற்கு “மூடி வைக்கப்பட்டிருக்கும்” அல்லது “அடைத்து வைக்கப்பட்டிருக்கும்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல், பரிசோதனைக்காக அந்த வீடு ஆசாரியரின் கட்டுப்பாட்டின்கீழ் தனியே வைக்கப்பட்டிருப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַ/בָּא
  choice: நுழைகிற எவரும்
  rationale: குறிப்பிட்ட பெயர்ச்சொல்லைப் போலச் செயல்படும் எபிரெயப் பெயரெச்சம், பொதுவாக நுழையும் எந்த நபரையும் குறிக்கிறது; தமிழில் சட்ட விதியின் பொதுவான பொருளை இயல்பாகத் தருகிறது.
- source_word: אֶל הַ/בַּיִת
  choice: அதற்குள்
  rationale: בוא உடன் வரும் אֶל, வீட்டின் உள்ளே செல்லும் இயக்கத்தைக் குறிக்கிறது. முன் குறிப்பிடப்பட்ட வீட்டைத் தமிழில் “அதற்குள்” என்பது இயல்பாகச் சுட்டுகிறது.
- source_word: כָּל יְמֵי
  choice: நாட்களிலெல்லாம்
  rationale: வீடு கட்டுப்பாட்டில் வைக்கப்பட்டிருக்கும் முழுக் காலத்தையும் இந்தச் சொற்றொடர் குறிக்கிறது.
- source_word: הִסְגִּיר אֹתוֹ
  choice: தனிமைப்படுத்தப்பட்டிருக்கும்
  rationale: லேவியராகமம் 13–14 இன் சடங்கு-சட்டச் சூழலில் סגר என்பது பரிசோதனைக்காக ஒருவரையோ வீட்டையோ தனியே கட்டுப்பாட்டில் வைப்பதைக் குறிக்கிறது. நவீன மருத்துவத் தனிமைப்படுத்தலை மட்டும் உணர்த்தாமல், இச்சூழலின் சட்டபூர்வமான பிரித்துவைப்பை இந்தத் தேர்வு தெளிவாக வெளிப்படுத்துகிறது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: יִטְמָא
  choice: தீட்டுள்ளவராக இருப்பார்
  rationale: இது சடங்குசார் தீட்டு நிலையை அடைவதையோ அந்த நிலையில் இருப்பதையோ குறிக்கிறது. “தீட்டுள்ளவர்” லேவியராகமத்தின் சூழலுக்கு ஏற்ற மரியாதைமிக்க, புரிந்துகொள்ளத்தக்க சொல்லாக்கம்.
- source_word: עַד הָ/עָרֶב
  choice: மாலைவரை
  rationale: தற்காலிகமான சடங்குசார் தீட்டு நீடிக்கும் கால எல்லையை இயல்பான தமிழில் குறிக்கிறது.
