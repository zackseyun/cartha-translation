translation_notes:
  register: நவீன நிலையான தமிழில், சட்ட விதிக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. “தீட்டு” என்பது பொதுவான அசுத்தத்தை அல்ல, இச்சூழலின் சடங்குசார் நிலையைச் சுட்டுகிறது. எபிரெயத்தில் செய்பவர் வெளிப்படையாகக் குறிப்பிடப்படாததால், தமிழிலும் செயப்பாட்டு வடிவம் பயன்படுத்தப்பட்டுள்ளது.
