  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/אִם מִן הַ/צֹּ֨אן קָרְבָּנ֧/וֹ מִן הַ/כְּשָׂבִ֛ים א֥וֹ מִן הָ/עִזִּ֖ים לְ/עֹלָ֑ה זָכָ֥ר תָּמִ֖ים יַקְרִיבֶֽ/נּוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/010.yaml
  text: And if his offering is from the flock, from the sheep or from the goats, for a burnt offering, he shall offer it, a male without blemish.
translation:
  language: ta
  text: அவனுடைய காணிக்கை மந்தையிலிருந்து—செம்மறியாடுகளிலிருந்தோ வெள்ளாடுகளிலிருந்தோ—தகனபலிக்காக[a] இருந்தால், குறைபாடற்ற[b] ஓர் ஆணை அவன் சமர்ப்பிக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தகனபலியாக இருந்தால்.”
    reason: lexical_alternative
  - marker: b
    text: “குறைபாடற்ற” என்பது இந்தப் பலிக்குத் தேவையானபடி உடல்ரீதியான குறை எதுவும் இல்லாததைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וְאִם
  choice: இருந்தால்
  rationale: வழிபாட்டு விதிகளில் அடுத்த நிபந்தனைக்குரிய நிகழ்வை அறிமுகப்படுத்துகிறது; தமிழில் இயல்பான நிபந்தனை வாக்கிய அமைப்புக்காக வாக்கியத்தின் முடிவுப் பகுதிக்கு இணைக்கப்பட்டது.
- source_word: מִן הַצֹּאן
  choice: மந்தையிலிருந்து
  rationale: צֹאן என்பது செம்மறியாடுகளையும் வெள்ளாடுகளையும் உள்ளடக்கும் சிறுகால்நடை மந்தையைக் குறிக்கும் கூட்டுப்பெயர்; தொடர்ந்து வரும் சொற்கள் அதன் இரு வகைகளையும் தெளிவுபடுத்துகின்றன.
- source_word: קָרְבָּנוֹ
  choice: அவனுடைய பலி
  rationale: வழிபாட்டுக்காகக் கொண்டுவரப்படும் காணிக்கை அல்லது பலியை இச்சொல் குறிக்கிறது; இங்கு விலங்குப் பலி பற்றிய சூழலில் ‘பலி’ தெளிவானதும் இயல்பானதும் ஆகும்.
- source_word: מִן הַכְּשָׂבִים
  choice: செம்மறியாடுகளிலிருந்தோ
  rationale: வயதைத் தேவையின்றிக் குறுக்காமல், வெள்ளாடுகளுக்கு எதிரான விலங்கு வகையைத் துல்லியமாகக் காட்டுகிறது.
- source_word: אוֹ מִן הָעִזִּים
  choice: வெள்ளாடுகளிலிருந்தோ
  rationale: עִזִּים என்பதன் இயல்பான தமிழ் விலங்குவகைப் பெயர்; ‘-ஓ ... -ஓ’ அமைப்பு எபிரெயச் மாற்றுத் தேர்வைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: לְעֹלָה
  choice: தகனபலியாக
  rationale: עֹלָה எனும் முழுவதும் எரிக்கப்படும் பலிவகைக்கான நிலைபெற்ற, புரிந்துகொள்ளத்தக்க தமிழ் வழிபாட்டுச் சொல்.
- source_word: זָכָר
  choice: ஓர் ஆணையே
  rationale: பலியிடப்படும் விலங்கு ஆண்பாலாக இருக்க வேண்டும் என்ற வெளிப்படையான நிபந்தனையைப் பாதுகாக்கிறது; ‘-ஏ’ அந்தத் தகுதியைத் தெளிவாகச் சுட்டுகிறது.
- source_word: תָּמִים
  choice: குறைபாடற்ற
  rationale: பலிக்குரிய விலங்கு உடல்ரீதியான பழுதோ குறையோ இல்லாமல் இருக்க வேண்டும் என்பதை வழிபாட்டுச் சூழலில் துல்லியமாகக் கூறுகிறது.
- source_word: יַקְרִיבֶנּוּ
  choice: அவன் பலியிட வேண்டும்
  rationale: קרב என்பதன் ஹிபீல் வடிவம் வழிபாட்டில் சமர்ப்பித்தல் அல்லது பலியிடுதலைக் குறிக்கிறது; கட்டளையின் வலிமையை இயல்பான நவீன தமிழில் வழங்குகிறது.
theological_decisions:
- issue: עֹלָה என்ற பலிச்சொல்லின் மொழிபெயர்ப்பு
  choice: தகனபலி
  alternative: மேலே எழும்பும் பலி
  rationale: சொற்பிறப்பை மட்டும் முன்னிறுத்தாமல், லேவியராகமத்தில் குறிக்கப்படும் முழுவதும் எரிக்கப்படும் நிறுவப்பட்ட பலிவகையை வாசகருக்குத் தெளிவாகத் தெரிவிக்கிறது.
- issue: பலிக்குரிய விலங்கின் பாலின நிபந்தனை
  choice: ஓர் ஆண்
  alternative: ஆண்பாலானது
  rationale: எபிரெய மூலத்தில் விலங்கின் பாலினம் திட்டவட்டமாகக் குறிப்பிடப்படுவதால் அதை பொதுமைப்படுத்தாமல் பாதுகாக்கிறது.
- issue: תָּמִים என்ற சொல்லின் பலிசார் பொருள்
  choice: குறைபாடற்ற
  alternative: முழுமையான
  rationale: இச்சூழலில் அறநெறிசார் பரிபூரணத்தைக் குறிக்காமல், பலிவிலங்கின் உடல்ரீதியான தகுதியைக் குறிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமான நடையும் சாதாரண வாசகருக்குப் புரியும் சொற்களும் பயன்படுத்தப்பட்டுள்ளன. எபிரெய நிபந்தனை வாக்கியம் தமிழின் இயல்பான சொல் வரிசைக்கேற்ப அமைக்கப்பட்டுள்ளது; இடைச்செருகல் கோடுகள் ‘மந்தை’ என்பதைக் குறிப்பாக செம்மறியாடுகள் அல்லது வெள்ளாடுகள் என விளக்குகின்றன.
