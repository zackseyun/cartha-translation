revisions:
- from: அவனுடைய பலி மந்தையிலிருந்து—செம்மறியாடுகளிலிருந்தோ வெள்ளாடுகளிலிருந்தோ—எடுக்கப்பட்ட தகனபலியாக இருந்தால்,[a] குறைபாடற்ற ஓர் ஆணையே அவன் பலியிட வேண்டும்.[b]
  to: அவனுடைய காணிக்கை மந்தையிலிருந்து—செம்மறியாடுகளிலிருந்தோ வெள்ளாடுகளிலிருந்தோ—தகனபலிக்காக[a] இருந்தால், குறைபாடற்ற[b] ஓர் ஆணை அவன் சமர்ப்பிக்க வேண்டும்.
  rationale: The revision preserves the Hebrew conditional structure and all stated qualifications, removes an unstated selection nuance, renders the offering verb without prematurely specifying slaughter, and places each footnote marker at its relevant expression.
