base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/015.yaml
  text: And the priest shall bring it to the altar[a], and pinch off its head and burn it on the altar[b], and its blood shall be drained out on the side of the altar.
translation:
  language: ta
  text: ஆசாரியன் அதை பலிபீடத்திற்குக் கொண்டுவந்து, அதன் தலையைக் கிள்ளிப் பிரித்து[a], பலிபீடத்தின்மேல் எரித்துப் புகையெழச் செய்ய வேண்டும். அதன் இரத்தம் பலிபீடத்தின் பக்கவாட்டில் பிழியப்பட வேண்டும்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு வரும் எபிரெய வினைச்சொல், பறவைப் பலியை ஆசாரியன் கொல்வதற்குரிய ஒரு குறிப்பிட்ட சடங்குச் செயலைக் குறிக்கிறது; இதை ‘அதன் தலையை நெரித்துப் பிரித்து’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: 'நேர்ப்பொருள்: ‘பலிபீடத்தின் சுவரின்மேல்.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיבוֹ
  choice: அதைக் ... கொண்டுவந்து
  rationale: קרב என்பதன் ஹிஃபில் வடிவம் ‘அருகில் கொண்டுவருதல்’ அல்லது ‘சமர்ப்பித்தல்’ எனப் பொருள்படும். உடனே பலிபீடத்தை நோக்கிய இயக்கம் குறிப்பிடப்படுவதால், இங்கு நிகழும் உடல் இயக்கத்தைத் தெளிவாகக் காட்ட ‘கொண்டுவந்து’ என மொழிபெயர்க்கப்பட்டது.
- source_word: הַכֹּהֵן
  choice: ஆசாரியன்
  rationale: பலிச்சடங்கு சட்டங்களில் כֹּהֵן என்பதற்கான இயல்பான, பொதுவாகப் புரியக்கூடிய தமிழ் சொல்.
- source_word: אֶל הַמִּזְבֵּחַ
  choice: பலிபீடத்திடம்
  rationale: אֶל இலக்கை நோக்கிய இயக்கத்தைக் குறிக்கிறது. தமிழில் ‘பலிபீடத்திடம் கொண்டுவந்து’ என்பது அந்த இயக்கத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וּמָלַק אֶת־רֹאשׁוֹ
  choice: அதன் தலையைக் கிள்ளிப் பிரித்து
  rationale: מלק என்பது பறவைப் பலியை ஆசாரியன் கொல்லும் குறிப்பிட்ட சடங்குச் செயலைக் குறிக்கும் தொழில்நுட்பச் சொல். ‘கிள்ளிப் பிரித்து’ என்பது செயலைத் தெளிவாகக் கூறுகிறது; முறையை மிகுதியாக விவரிக்காமல் அதன் அரிதான தொழில்நுட்ப இயல்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וְהִקְטִיר
  choice: எரித்துப் புகையெழச் செய்யவேண்டும்
  rationale: பலிச்சடங்கு சூழலில் קטר வெறுமனே எரிப்பதை மட்டுமல்ல, பலிபீடத்தில் எரித்து புகையாக எழச்செய்வதையும் குறிக்கிறது. தமிழ் வாசகருக்கு அந்தச் சடங்கு நுணுக்கம் தெளிவாக இருக்க இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: הַמִּזְבֵּחָה
  choice: பலிபீடத்தின்மேல்
  rationale: இங்குள்ள திசைச்சுட்டு வடிவம் பலிபீடத்தில் நடைபெறும் எரிப்புச் செயலைக் குறிக்கிறது; தமிழில் ‘பலிபீடத்தின்மேல்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: וְנִמְצָה דָמוֹ
  choice: அதன் இரத்தம் ... வடியச் செய்யப்பட வேண்டும்
  rationale: מצה என்பதன் நிஃபால் வடிவம் இரத்தம் பிழியப்பட்டு அல்லது வடிக்கப்பட்டு வெளியேறுவதைக் குறிக்கிறது. எபிரெயத்தின் செயப்பாட்டு உணர்வை ‘வடியச் செய்யப்பட வேண்டும்’ பாதுகாக்கிறது.
- source_word: עַל קִיר הַמִּזְבֵּחַ
  choice: பலிபீடத்தின் பக்கவாட்டில்
  rationale: קִיר என்பதன் நேர்ப்பொருள் ‘சுவர்’; பலிபீடத்தைப் பற்றிய தமிழில் ‘பக்கவாட்டு’ இயல்பாகவும் இடத்தைத் தெளிவாகவும் கூறுகிறது. நேர்ப்பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
