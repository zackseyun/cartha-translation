source:
  edition: WLC
  text: וְ/הַ/קֶּ֥רֶב וְ/הַ/כְּרָעַ֖יִם יִרְחַ֣ץ בַּ/מָּ֑יִם וְ/הִקְרִ֨יב הַ/כֹּהֵ֤ן אֶת הַ/כֹּל֙ וְ/הִקְטִ֣יר הַ/מִּזְבֵּ֔חָ/ה עֹלָ֣ה ה֗וּא אִשֵּׁ֛ה רֵ֥יחַ נִיחֹ֖חַ לַ/יהוָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/013.yaml
  text: But he shall wash the entrails and the legs with water[a], and the priest shall present all of it and turn it into smoke on the altar. It is a burnt offering, a food offering, a pleasing aroma to Yahweh.
translation:
  language: ta
  text: ஆனால் அதன் உள்ளுறுப்புகளையும் கால்களையும் அவன் தண்ணீரால் கழுவ வேண்டும். பிறகு ஆசாரியன் அனைத்தையும் சமர்ப்பித்து, பலிபீடத்தின் மேல் புகையாக எழும்பும்படி எரிக்க வேண்டும். அது யாவேக்கு இனிய நறுமணமான தகன பலி, நெருப்பில் செலுத்தப்படும் காணிக்கை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உணவுக் காணிக்கை.”
    reason: אִשֶּׁה என்ற எபிரெயச் சொல்லின் நெருப்பு சார்ந்த பொருளை முதன்மை உரை வெளிப்படுத்துகிறது; பலியியல் சூழலில் “உணவுக் காணிக்கை” என்பதும் ஒரு மாற்று விளக்கமாகக் கொள்ளப்படுகிறது.
lexical_decisions:
- source_word: הַקֶּרֶב
  choice: குடல்கள்
  rationale: பலியிடும் சூழலில் இது விலங்கின் உள்ளுறுப்புகளை, குறிப்பாகக் குடற்பகுதியைக் குறிக்கிறது; நவீனத் தமிழில் தெளிவான, நேரடியான சொல்.
- source_word: הַכְּרָעַיִם
  choice: கால்கள்
  rationale: பலியிடப்படும் விலங்கின் கால்களை, குறிப்பாகக் கீழ்க்கால் பகுதிகளைக் குறிக்கிறது; பொதுவாசகருக்கு இயல்பாகப் புரியும் வடிவம்.
- source_word: יִרְחַץ בַּמָּיִם
  choice: தண்ணீரால் கழுவ வேண்டும்
  rationale: רחץ என்பதன் ‘கழுவுதல்’ என்ற பொருளையும், בַּמָּיִם என்பதன் கருவிப்பொருளையும் வெளிப்படையாகப் பாதுகாக்கிறது.
- source_word: וְהִקְרִיב
  choice: கொண்டுவந்து
  rationale: ஹிஃபில் வடிவம் பலியை அருகே கொண்டுவருதல் அல்லது சமர்ப்பித்தலைக் குறிக்கிறது; அடுத்துள்ள எரித்தல் வினையிலிருந்து இச்செயலை வேறுபடுத்துகிறது.
- source_word: אֶת־הַכֹּל
  choice: அவை அனைத்தையும்
  rationale: தயாரிக்கப்பட்ட பகுதிகள் முழுவதையும் குறிக்கும் எபிரெய வலியுறுத்தலை இயல்பான தமிழில் தருகிறது.
- source_word: וְהִקְטִיר
  choice: புகையாக எழும்பும்படி எரிக்க வேண்டும்
  rationale: பொதுவான ‘எரித்தல்’ என்பதைவிட, பலியைப் பலிபீடத்தில் புகையாக எழச் செய்யும் வழிபாட்டுச் செயலைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: הַמִּזְבֵּחָה
  choice: பலிபீடத்தின்மேல்
  rationale: பலிச் செயல் நடைபெறும் இடத்தைத் துல்லியமாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: עֹלָה
  choice: தகன பலி
  rationale: முழுவதும் எரிக்கப்படும் இவ்வகைப் பலிக்கான நிலைபெற்ற தமிழ்ச் சமயச் சொல்; மூலச்சொல்லின் குறிப்பிட்ட பலிவகையைப் பாதுகாக்கிறது.
- source_word: אִשֵּׁה
  choice: நெருப்பில் செலுத்தப்படும் காணிக்கை
  rationale: இச்சொல்லின் நெருப்பு சார்ந்த வழிபாட்டுப் பொருளை நேரடியாகப் பாதுகாக்கிறது; ‘உணவுக் காணிக்கை’ என்ற மாற்றுப் புரிதல் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: רֵיחַ נִיחֹחַ
  choice: இனிய நறுமணம் தரும்
  rationale: பலியை இறைவன் ஏற்றுக்கொள்வதை உணர்வுப்படிமமாகச் சொல்லும் எபிரெய மொழிநடையைத் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: மூலத்தில் உள்ள தனிப்பெயரான יהוה என்பதை பொதுப்பட்டப் பெயராக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
theological_decisions:
- issue: רֵיחַ נִיחֹחַ என்பதிலுள்ள இறைமனித உருவக மொழி
  choice: யாவேக்கு இனிய நறுமணம் தரும்
  alternative: யாவேக்கு ஏற்புடைய நறுமணம்
  rationale: மூலத்தின் உணர்வுப்படிமத்தையும் பலி ஏற்றுக்கொள்ளப்படுதல் என்ற உட்பொருளையும் பாதுகாக்கிறது; இறைவனுடைய உடலியலைப் பற்றி உரை கூறுவதாக மிகையாக விளக்கவில்லை.
- issue: אִשֵּׁה என்பதன் பலியியல் பொருள்
  choice: நெருப்பில் செலுத்தப்படும் காணிக்கை
  alternative: உணவுக் காணிக்கை
  rationale: மூலச்சொல்லின் நெருப்பு சார்ந்த வெளிப்பாட்டை முதன்மை உரையில் வைத்திருக்கிறது; வேறு சாத்தியமான பலியியல் புரிதலை அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கிறது.
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரையிலுள்ள தனிப்பெயரை பட்டப்பெயராக மாற்றாமல் வழங்குகிறது; பெயரின் உச்சரிப்பு முழு நிச்சயமற்றது என்றாலும் ‘யாவே’ என்பது பரவலாக ஏற்றுக்கொள்ளப்பட்ட நவீன ஒலிபெயர்ப்பு.
translation_notes:
  register: நவீன நிலையான தமிழ்; வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமான நடை. ‘ஆசாரியர்,’ ‘பலிபீடம்,’ ‘தகன பலி’ போன்ற பரவலாக அறியப்பட்ட பலியியல் சொற்கள் பயன்படுத்தப்பட்டுள்ளன. வாக்கிய அமைப்பு பொதுவாசகருக்கு எளிமையாக இருந்தாலும், செயல்களின் வரிசையும் மூலத்தின் உருவகமும் காக்கப்பட்டுள்ளன.
