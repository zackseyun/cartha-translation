  source_fidelity: மூல எபிரேயத்தின் செயன்முறை வரிசை, யாவே என்ற இறைப்பெயர், பலியிடுபவனும் ஆசாரியர்களும் செய்யும் தனித்தனி செயல்கள், இரத்தத்தைப் பலிபீடத்தைச் சுற்றிலும் வீசுதல் ஆகியவை வரைவு உரையில் நன்றாகக் காக்கப்பட்டுள்ளன. ஆனால் אֲשֶׁר פֶּתַח אֹהֶל מוֹעֵד என்பது பலிபீடம் கூடாரத்தின் நுழைவாயிலில் உள்ளதாக அல்லாமல் நுழைவாயிலுக்கு முன்பாக/அருகில் உள்ளதாகக் குறிக்கிறது; இதைத் தமிழில் தெளிவாக்குதல் பாதுகாப்பானது.
  naturalness: நடை நவீன தரத் தமிழிலும் சடங்கு உரைக்கேற்ற கண்ணியமான மொழியிலும் உள்ளது. “நுழைவாயிலில் இருக்கும்” என்பது பலிபீடம் வாயிலின் உட்பகுதியில் இருப்பதுபோல் ஒலிக்க வாய்ப்புள்ளதால் “நுழைவாயிலுக்கு முன்பாக இருக்கும்” என மாற்றப்பட்டுள்ளது. “வீசியடிக்க” என்பது זרק-இன் வலுவான செயல்முறையை இயல்பாக வெளிப்படுத்துகிறது.
