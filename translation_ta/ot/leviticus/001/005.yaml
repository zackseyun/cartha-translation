base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/005.yaml
  text: And he shall slaughter the young bull before Yahweh[a], and Aaron’s sons, the priests, shall present the blood and throw the blood against the altar all around[b], which is at the entrance of the tent of meeting.
translation:
  language: ta
  text: அவன் அந்த இளங்காளையை[a] யாவே முன்னிலையில் அறுக்க வேண்டும். பின்னர், ஆசாரியர்களான ஆரோனின் மகன்கள் அந்த இரத்தத்தை முன்வைத்து, சந்திப்புக் கூடாரத்தின் நுழைவாயிலுக்கு முன்பாக இருக்கும் பலிபீடத்தின் எல்லாப் பக்கங்களின்மீதும் அந்த இரத்தத்தை வீசியடிக்க வேண்டும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்கு சொல், “மாட்டினத்தின் மகன்”; இது மாட்டினத்தைச் சேர்ந்த ஒரு விலங்கைக் குறிக்கும் எபிரேய மரபுத்தொடர். இங்கு “இளங்காளை” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: “இரத்தத்தைப் பீய்ச்சியடிக்க” அல்லது பாரம்பரியமாக “இரத்தத்தைத் தெளிக்க” என்றும் மொழிபெயர்க்கலாம். எபிரேய வினைச்சொல், சடங்கில் இரத்தத்தை எறிந்து அல்லது வீசி இடுவதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁחַט
  choice: அறுக்க வேண்டும்
  rationale: பலியிடுவதற்காக விலங்கைக் கொல்லும் செயலைத் துல்லியமாகவும், இந்தச் சடங்கு வழிமுறையின் கட்டளைத் தன்மையையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: בֶּן הַבָּקָר
  choice: இளங்காளை
  rationale: சொல்லுக்கு சொல் ‘மாட்டினத்தின் மகன்’ என்ற எபிரேய மரபுத்தொடர் இங்கு பலிக்கான இளம் ஆண் மாட்டைக் குறிக்கிறது; ‘இளங்காளை’ தெளிவான இயல்பான தமிழ்.
- source_word: לִפְנֵי יְהוָה
  choice: யாவே முன்னிலையில்
  rationale: சடங்கு நடைபெறும் இடத்தையும் தெய்வீக முன்னிலையையும் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரேய மூலத்திலுள்ள உடன்படிக்கைப் பெயரைப் பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்க்கிறது.
- source_word: וְהִקְרִיבוּ
  choice: முன்வைத்து
  rationale: קרב என்பதன் ஹிஃபில் வடிவிலுள்ள ‘அருகில் கொண்டுவருதல்/முன்வைத்தல்’ என்ற பொருளை, இரத்தமே நேரடிப் பொருளாக உள்ள சூழலில் காக்கிறது.
- source_word: בְּנֵי אַהֲרֹן הַכֹּהֲנִים
  choice: ஆசாரியர்களான ஆரோனின் மகன்கள்
  rationale: குடும்ப அடையாளத்தையும் அவர்களுடைய ஆசாரியப் பணியையும் இணைத்துக் காட்டுகிறது.
- source_word: וְזָרְקוּ
  choice: வீசியடிக்க வேண்டும்
  rationale: இரத்தத்தைச் சடங்குமுறையில் எறிந்து பயன்படுத்தும் வலுவான உடல் செயலைக் காட்டுகிறது; வெறுமனே ‘தெளித்தல்’ என்று மென்மையாக்கவில்லை.
- source_word: עַל הַמִּזְבֵּחַ סָבִיב
  choice: பலிபீடத்தின் எல்லாப் பக்கங்களின்மீதும்
  rationale: இரத்தம் பலிபீடத்தின் சுற்றுப்புறப் பரப்புகளில் பயன்படுத்தப்படுவதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: אֲשֶׁר פֶּתַח אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரத்தின் நுழைவாயிலில் இருக்கும்
  rationale: இந்த உறவுக்கூற்று பலிபீடத்தின் இருப்பிடத்தை அடையாளப்படுத்துவதைத் தெளிவாகக் காட்டுகிறது.
- source_word: אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரம்
  rationale: எபிரேயச் சொற்றொடரின் ‘சந்திப்பு’ மற்றும் ‘கூடாரம்’ ஆகிய இரு கூறுகளையும் வெளிப்படையாகக் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல வசனம் நான்கெழுத்து இறைப்பெயரை நேரடியாகப் பயன்படுத்துவதால், அதை ஒரு பட்டப்பெயரால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- issue: இரத்தத்தைப் பலிபீடத்தில் பயன்படுத்தும் செயல்
  choice: வீசியடிக்க
  alternative: தெளிக்க
  rationale: זרק என்பது எறிதல் அல்லது வீசுதல் சார்ந்த வலுவான செயலைக் குறிக்கிறது. ‘தெளிக்க’ என்பது பாரம்பரியமான மொழிபெயர்ப்பாக இருந்தாலும் செயலை மென்மையாக்கக்கூடும்; அடிக்குறிப்பு இந்த மாற்றுப் பொருளைத் தருகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான சடங்கு மொழிநடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆசாரியர்’, ‘பலிபீடம்’, ‘சந்திப்புக் கூடாரம்’ ஆகியவை தெளிவும் மரபுத் தொடர்பும் கொண்ட சொற்களாகத் தேர்ந்தெடுக்கப்பட்டன. ஆங்கில ஆலோசனை உரையில் அடிக்குறிப்பு குறிகள் உள்ளடக்கத்துடன் இடமாறியிருந்ததால், மூலச் சொற்களுக்கேற்றவாறு [a] இளங்காளைக்குப் பின்னும் [b] இரத்தச் செயலுக்குப் பின்னும் வைக்கப்பட்டன.
