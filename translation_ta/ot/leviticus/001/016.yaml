  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/הֵסִ֥יר אֶת מֻרְאָת֖/וֹ בְּ/נֹצָתָ֑/הּ וְ/הִשְׁלִ֨יךְ אֹתָ֜/הּ אֵ֤צֶל הַ/מִּזְבֵּ֨חַ֙ קֵ֔דְמָ/ה אֶל מְק֖וֹם הַ/דָּֽשֶׁן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/016.yaml
  text: He shall remove its crop with its feathers and throw it beside the altar[a], on the east side[b], to the place of the ashes.
translation:
  language: ta
  text: அதன் தீனிப்பையை[a] அதன் இறகுகளோடு[b] அகற்றி, அதை பலிபீடத்தின் கிழக்குப் பக்கத்தில் உள்ள சாம்பல் இருக்கும் இடத்திற்கு எறிய வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தீனிப்பை’ என்பதற்குப் பதிலாக ‘தொண்டைப்பை’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் ‘அதன் இறகுகளோடு’; சில மொழிபெயர்ப்புகள் இத்தொடரை ‘அதன் அசுத்தத்தோடு’ என்று வழங்குகின்றன.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהֵסִיר
  choice: அகற்றி
  rationale: סור என்பதன் ஹிஃபில் வடிவம் இங்கு ஒன்றை நீக்குவதைக் குறிக்கிறது. பலியிடும் செயல்முறை அறிவுறுத்தலுக்கு இயல்பான சுருக்கமான சொல்.
- source_word: מֻרְאָתוֹ
  choice: அதன் தீனிப்பையை
  rationale: பறவையின் உணவு தற்காலிகமாகத் தேங்கும் ‘crop/craw’ என்னும் உடற்பகுதியைக் குறிக்கிறது. ‘தீனிப்பை’ என்பது தமிழில் தெளிவான உடற்கூறியல் சொல்.
- source_word: בְּנֹצָתָהּ
  choice: அதன் இறகுகளோடு
  rationale: மெய்யெழுத்து வடிவம் נוצה, ‘இறகு/இறகுத்தொகுதி’ என்பதோடு இயல்பாகத் தொடர்புடையது. ‘அசுத்தத்தோடு’ என்ற மரபுவழிப் புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וְהִשְׁלִיךְ אֹתָהּ
  choice: அதை எறிய வேண்டும்
  rationale: שלך என்பதன் ஹிஃபில் வடிவம் ‘எறிதல்’ அல்லது ‘வீசுதல்’ என்று பொருள்படும்; விதிமுறைச் சூழலைத் தமிழில் ‘வேண்டும்’ வெளிப்படுத்துகிறது.
- source_word: אֵצֶל הַמִּזְבֵּחַ
  choice: பலிபீடத்தின் அருகே
  rationale: אצל என்பது ஒன்றின் பக்கத்திலுள்ள அண்மையைச் சுட்டுகிறது. ‘அருகே’ இயல்பான நவீனத் தமிழ்.
- source_word: קֵדְמָה
  choice: அதன் கிழக்குப் பக்கத்திலுள்ள
  rationale: இத்திசைச் சொல் கிழக்கு நோக்கிய இடத்தைக் குறிக்கிறது; இங்கு பலிபீடத்துடன் தொடர்புடைய இடவழிமுறையாகத் தெளிவுபடுத்தப்பட்டுள்ளது.
- source_word: אֶל מְקוֹם הַדָּשֶׁן
  choice: சாம்பலுக்குரிய இடத்தில்
  rationale: பலியிடும் சூழலில் דשן பலிபீடத்திலிருந்து அகற்றப்படும் சாம்பலைக் குறிக்கலாம். எபிரெய உரையை மீறி அதன் தன்மையை மிகையாகக் குறிப்பிடாமல் மொழிபெயர்க்கப்பட்டுள்ளது.
