translation_notes:
  register: நவீன நிலையான தமிழில், சடங்கு அறிவுறுத்தலுக்கேற்ற கண்ணியமானதும் நேரடியானதும் ஆன நடை பயன்படுத்தப்பட்டுள்ளது. அரிதான பறவை உடற்கூறியல் சொல்லுக்கு அடிக்குறிப்பில் மாற்றுச் சொல் தரப்பட்டுள்ளது; சிக்கலான எபிரெய வாசகத்தின் மாற்றுப் புரிதலும் மறைக்கப்படாமல் பதிவு செய்யப்பட்டுள்ளது.
