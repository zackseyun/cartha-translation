source:
  edition: WLC
  text: וְ/סָמַ֣ךְ יָד֔/וֹ עַ֖ל רֹ֣אשׁ הָ/עֹלָ֑ה וְ/נִרְצָ֥ה ל֖/וֹ לְ/כַפֵּ֥ר עָלָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/004.yaml
  text: And he shall lay his hand on the head of the burnt offering[a], and it shall be accepted for him to make atonement on his behalf.
translation:
  language: ta
  text: அவன் தன் கையைத் தகனபலியின் தலையின்மேல் வைக்க வேண்டும்; அவனுக்காகப் பாவநிவிர்த்தி செய்வதற்கு அது ஏற்றுக்கொள்ளப்படும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவன் ஏற்றுக்கொள்ளப்படுவான்.” எபிரெயச் செயப்பாட்டு வினையைப் பலியைவிடப் பலி செலுத்துகிறவனை இன்னும் நேரடியாகக் குறிப்பதாகவும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וְסָמַךְ
  choice: வைக்க வேண்டும்
  rationale: பலியிடும் சடங்கின் சூழலில் סמך என்பது விலங்கின்மேல் கையை வைப்பதை அல்லது சாய்த்து அழுத்துவதைச் சுட்டுகிறது. தமிழில் இயல்பாக இருக்கவும், அழுத்தத்தின் அளவைத் தேவையின்றி மிகைப்படுத்தாமல் இருக்கவும் ‘வைக்க வேண்டும்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: יָדוֹ
  choice: தன் கையை
  rationale: எபிரெய மூலத்தில் ஒருமை உள்ளது. செய்பவரையே உடைமையாளராகத் தெளிவுபடுத்தத் தமிழில் ‘தன்’ பயன்படுத்தப்பட்டது.
- source_word: עַל רֹאשׁ
  choice: தலையின்மேல்
  rationale: சடங்கில் நிகழும் உடல்சார்ந்த செயலை நேரடியாகவும் இயல்பான தமிழிலும் எடுத்துரைக்கிறது.
- source_word: הָעֹלָה
  choice: தகனபலி
  rationale: עֹלָה என்பது முழுவதும் எரிக்கப்படும் பலிக்கான வழக்கமான பலியியல் சொல். நவீன வேதாகமத் தமிழில் புரியக்கூடிய நிலைபெற்ற இணையாக ‘தகனபலி’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: וְנִרְצָה
  choice: அது ஏற்றுக்கொள்ளப்படும்
  rationale: רצה என்பதன் நிஃபால் வடிவம் இங்கு ஏற்றுக்கொள்ளப்படுதலைக் குறிக்கிறது. சூழலில் அருகிலுள்ள பலியையே பிரதான உரை சுட்டுப்பெயரால் குறிப்பிடுகிறது; பலி செலுத்துபவரைக் குறிக்கும் வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: לוֹ
  choice: அவனுக்காக
  rationale: לְ இங்கு பலன் பெறுபவரையோ அவர் சார்பான உறவையோ குறிக்கிறது. ‘அவனுக்காக’ என்பது இவ்விரண்டையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לְכַפֵּר עָלָיו
  choice: அவனுக்காகப் பாவநிவிர்த்தி செய்வதற்கு
  rationale: כפר என்பது பலியியல் சூழலில் நிவிர்த்தி/பரிகாரம் செய்வதைக் குறிக்கும் முக்கிய சொல். ஒரு குறிப்பிட்ட நிவிர்த்திக் கோட்பாட்டைத் திணிக்காமல் அதன் பலியியல்-இறையியல் நிறையைப் பாதுகாக்க ‘பாவநிவிர்த்தி செய்வது’ பயன்படுத்தப்பட்டது; עָלָיו பயனாளியை ‘அவனுக்காக’ எனக் காட்டுகிறது.
theological_decisions:
- issue: וְנִרְצָה என்ற செயப்பாட்டு வினையின் குறிப்பு
  choice: பலி ஏற்றுக்கொள்ளப்படும்
  alternative: பலி செலுத்துகிறவன் ஏற்றுக்கொள்ளப்படுவான்
  rationale: வினை மூன்றாம் ஆண்பால் ஒருமையில் உள்ளது; சூழலில் மிக அருகிலுள்ள பலியைக் குறிப்பதாகப் பிரதான உரை வாசிக்கிறது. எனினும் ஏற்றுக்கொள்ளப்படுதல் பலி செலுத்துகிறவனுக்கு இன்னும் நேரடியாகப் பொருந்தும் என்ற வாசிப்பும் எபிரெய வாக்கியத்தில் சாத்தியம்; ஆகவே அது அடிக்குறிப்பில் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு விளங்கும் மரியாதைமிக்க நடையில் வடிவமைக்கப்பட்டது. பலியியல் சொற்களில் தேவையான இறையியல் நிறை காக்கப்பட்டு, மூலத்தின் சாத்தியமான இரட்டை வாசிப்பு அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்பட்டது.
