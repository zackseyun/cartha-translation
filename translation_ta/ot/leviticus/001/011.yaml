revisions:
- from: அதை அவன் யாவே முன்னிலையில், பலிபீடத்தின் வடக்குப் பக்கத்தில் அறுக்க வேண்டும். பின்பு ஆரோனின் மகன்களாகிய ஆசாரியர்கள் அதன் இரத்தத்தைப் பலிபீடத்தின் எல்லாப் பக்கங்களிலும் வீச வேண்டும்.[a]
  to: அவன் அதை யாவேவின் முன்னிலையில், பலிபீடத்தின் வடக்குப் பக்கத்தில் அறுக்க வேண்டும். ஆரோனின் மகன்களாகிய ஆசாரியர்கள் அதன் இரத்தத்தைப் பலிபீடத்தின் மேல் சுற்றிலும் வீச வேண்டும்.[a]
