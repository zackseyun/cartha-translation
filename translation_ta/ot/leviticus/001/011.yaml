base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/011.yaml
  text: And he shall slaughter it on the north side of the altar before Yahweh[a], and Aaron’s sons, the priests, shall throw its blood against the altar all around.
translation:
  language: ta
  text: அவன் அதை யாவேவின் முன்னிலையில், பலிபீடத்தின் வடக்குப் பக்கத்தில் அறுக்க வேண்டும். ஆரோனின் மகன்களாகிய ஆசாரியர்கள் அதன் இரத்தத்தைப் பலிபீடத்தின் மேல் சுற்றிலும் வீச வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதன் இரத்தத்தைப் பலிபீடத்தின் மேல் சுற்றிலும் விசையுடன் எறிய வேண்டும்.” இங்குள்ள எபிரெய வினைச்சொல் இரத்தத்தை இலேசாகத் தெளிப்பதை அல்ல, விசையுடன் வீசுவதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁחַט
  choice: அறுக்க வேண்டும்
  rationale: שׁחט என்பது பலிக்குரிய விலங்கைக் கொல்வதைக் குறிக்கும் வழக்கமான சடங்குச் சொல். தமிழில் ‘அறுக்க’ என்பது பொதுவான ‘கொல்ல’ என்பதைவிட இந்தச் செயலைத் துல்லியமாகக் காட்டுகிறது; ‘வேண்டும்’ சட்ட/சடங்கு அறிவுறுத்தல் நடையைத் தருகிறது.
- source_word: יֶרֶךְ הַמִּזְבֵּחַ צָפֹנָה
  choice: பலிபீடத்தின் வடக்குப் பக்கத்தில்
  rationale: יֶרֶךְ என்பதன் அடிப்படைப் பொருள் ‘பக்கம்/விலாப்புறம்’; இங்கு பலிபீடத்தின் இருப்பிடப் பக்கத்தைக் குறிக்கிறது. צָפֹנָה வடக்குத் திசையைச் சுட்டுகிறது.
- source_word: לִפְנֵי יְהוָה
  choice: யாவே முன்னிலையில்
  rationale: இந்த வழிபாட்டுச் சொற்றொடர் யாவேயின் சந்நிதி அல்லது முன்னிலையில் நடைபெறும் செயலைக் குறிக்கிறது. ‘முன்னிலையில்’ என்பது இயல்பாகவும் நேரடியாகவும் உள்ளது.
- source_word: וְזָרְקוּ
  choice: வீச வேண்டும்
  rationale: זרק என்பதன் மையப் பொருள் ‘வீசுதல்/எறிதல்’. பலியிரத்தச் சடங்கில் இரத்தத்தைப் பலிபீடத்தின் மீது விசையுடன் செலுத்துவதை இது குறிக்கிறது; ‘தெளித்தல்’ செயலை மிக மென்மையானதாகத் தவறாக உணர்த்தக்கூடும்.
- source_word: בְּנֵי אַהֲרֹן הַכֹּהֲנִים
  choice: ஆரோனின் மகன்களாகிய ஆசாரியர்கள்
  rationale: எபிரெயச் சொற்றொடர் ஆரோனின் மகன்களையே ஆசாரியர்கள் என அடையாளப்படுத்துகிறது. ‘மகன்களாகிய’ என்பது வம்சத்தையும் பணியையும் தெளிவாக இணைக்கிறது.
- source_word: דָּמוֹ
  choice: அதன் இரத்தத்தை
  rationale: பதிலிப்பெயர் பலியிடப்படும் விலங்கைக் குறிக்கிறது; தமிழில் உயிரற்ற ஒருமைப் பொருளுக்குரிய ‘அதன்’ இயல்பானது.
- source_word: עַל הַמִּזְבֵּחַ סָבִיב
  choice: பலிபீடத்தின் எல்லாப் பக்கங்களிலும்
  rationale: סָבִיב பலிபீடத்தைச் சுற்றியுள்ள அனைத்துப் பக்கங்களையும் குறிக்கிறது. זרק உடன் வரும் עַל, இரத்தம் பலிபீடத்தின் பக்கங்கள்மீது செலுத்தப்படுவதைக் காட்டுகிறது; தமிழில் இச்சொற்றொடர் சடங்கின் இடவமைப்பை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரையில் நான்கெழுத்து இறைப்பெயர் நேரடியாக உள்ளது. ‘யாவே’ என்பது அதை ஒரு பொதுப் பட்டமாக மாற்றாமல், உடன்படிக்கைப் பெயராகத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியக்கூடிய கண்ணியமான சடங்கு-சட்ட நடை பயன்படுத்தப்பட்டுள்ளது. செய்பவர் எபிரெயத்தில் வினை வடிவால் மட்டும் குறிக்கப்பட்டிருப்பதால், தமிழில் தெளிவிற்காக ‘அவன்’ சேர்க்கப்பட்டுள்ளது. இரத்தச் செயலைக் குறிக்கும் மூல வினையின் வலிமையைத் தக்கவைக்க ‘வீச வேண்டும்’ பயன்படுத்தப்பட்டு, அதன் நுணுக்கம் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
