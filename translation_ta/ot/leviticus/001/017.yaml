base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/017.yaml
  text: He shall tear it open by its wings[a], but he shall not divide it; and the priest shall burn it on the altar, on the wood that is on the fire. It is a burnt offering, a food offering, a pleasing aroma to Yahweh.
translation:
  language: ta
  text: அவன் அந்தப் பறவையை அதன் சிறகுகளோடு சேர்த்துப் பிளந்து திறக்க வேண்டும்; ஆனால் அதை இரண்டாகப் பிரிக்கக்கூடாது. பிறகு ஆசாரியன் அதை பலிபீடத்தில், நெருப்பின்மேல் உள்ள விறகுகளின்மேல் எரித்துப் புகையெழச் செய்ய வேண்டும். அது யாவேக்கு இன்பமான நறுமணமுள்ள தகன பலி; நெருப்புப் படையல்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நெருப்பில் செலுத்தப்படும் படையல்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁסַּע
  choice: பிளந்து திறக்க வேண்டும்
  rationale: பறவையின் உடலைக் கிழித்தோ பிளந்தோ திறக்கும் செயலைக் குறிக்கிறது; அடுத்து வரும் ‘இரண்டாகப் பிரிக்கக்கூடாது’ என்ற கட்டளையுடன் இயல்பாகப் பொருந்துகிறது.
- source_word: בִכְנָפָיו
  choice: அதன் சிறகுகளோடு
  rationale: சிறகுகள் இருக்கும் பகுதி அல்லது அவற்றுடன் சேர்த்துப் பிளக்கும் செயல் என்ற எபிரேய மொழியின் நெகிழ்வைத் தமிழில் இயல்பாகத் தக்கவைக்கிறது.
- source_word: לֹא יַבְדִּיל
  choice: அதை இரண்டாகப் பிரிக்கக்கூடாது
  rationale: பறவையைத் திறந்தாலும் அதன் இரு பகுதிகளையும் முழுமையாகத் துண்டிக்கக் கூடாது என்பதைக் தெளிவுபடுத்துகிறது.
- source_word: וְהִקְטִיר
  choice: எரித்துப் புகையெழச் செய்ய வேண்டும்
  rationale: பலியிடும் சூழலில் பலிபீடத்தின்மேல் எரித்து புகையாக மேலெழச் செய்வதே வினையின் சிறப்புப் பொருள்.
- source_word: הַמִּזְבֵּחָה
  choice: பலிபீடத்தில்
  rationale: பலிச்சடங்கு சார்ந்த நிலையான, நவீனத் தமிழ் சொல்.
- source_word: עַל הָעֵצִים אֲשֶׁר עַל הָאֵשׁ
  choice: நெருப்பின்மேல் உள்ள விறகுகளின்மேல்
  rationale: விறகும் நெருப்பும் அடுக்கப்பட்டிருக்கும் அமைப்பைக் குறிக்கும் மூலமொழியின் இருமுறை வரும் ‘மேல்’ உறவைப் பாதுகாக்கிறது.
- source_word: עֹלָה
  choice: தகன பலி
  rationale: முழுவதும் பலிபீடத்தில் எரிக்கப்படும் இந்தப் பலிவகைக்கான தெளிவான, வழக்கிலுள்ள தமிழ் வழிபாட்டுச் சொல்.
- source_word: אִשֵּׁה
  choice: நெருப்புப் படையல்
  rationale: நெருப்பின் வழியாகச் செலுத்தப்படும் படையலை நேரடியாகக் குறிக்கிறது; ‘உணவுப் படையல்’ என்று பொருளைத் தேவையின்றி முடிவுசெய்வதைத் தவிர்க்கிறது.
- source_word: רֵיחַ נִיחֹחַ
  choice: மனமகிழ்விக்கும் நறுமணம்
  rationale: பலியை ஏற்றுக்கொள்ளுதல் குறித்த உருவகத்தை இயல்பான நவீனத் தமிழில் தக்கவைக்கிறது.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: மூலத்தில் நேரடியாக வரும் உடன்படிக்கைப் பெயரான יהוה என்பதை பட்டப்பெயராக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலவசனம் நான்கு எழுத்துகளைக் கொண்ட இறைப்பெயரை நேரடியாகப் பயன்படுத்துவதால், அதை பொதுவான பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்ப்பது உரையின் தன்மையைப் பாதுகாக்கிறது.
- issue: רֵיחַ נִיחֹחַ என்ற பலிச்சடங்கு வாய்பாடு
  choice: மனமகிழ்விக்கும் நறுமணம்
  alternative: இதமளிக்கும் நறுமணம்
  rationale: பலியை இறைவன் ஏற்றுக்கொள்வதைக் குறிக்கும் உருவகத்தைத் தக்கவைக்கிறது; உரையில் இல்லாத பிற்கால இறையியல் விளக்கத்தைச் சேர்ப்பதில்லை.
- issue: אִשֵּׁה என்பதன் பொருள்
  choice: நெருப்புப் படையல்
  alternative: நெருப்பில் செலுத்தப்படும் படையல்
  rationale: இச்சொல் நெருப்புடன் தொடர்புடைய பலிப்படையலைக் குறிக்கிறது. அது ‘இறைவனுக்கான உணவு’ என்ற கருத்தையும் சில சூழல்களில் சுமக்கக்கூடும் என்றாலும், இங்கு அதை வெளிப்படையாகச் சேர்க்காமல் மூலத்தின் சொற்பொருள் நெகிழ்வைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு விளங்கும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘அவன்’ என்பதன் குறிப்பு முந்தைய வசனச் சூழலைச் சார்ந்திருப்பதைத் தக்கவைத்து, பின்னர் மூலத்தில் வெளிப்படையாக வரும் ‘ஆசாரியன்’ தனியே குறிப்பிடப்பட்டுள்ளது. அடிக்குறிப்பு குறியீடு அது விளக்கும் אִשֵּׁה என்ற சொல்லுக்குப் பின்னரே வைக்கப்பட்டுள்ளது.
