source:
  edition: WLC
  text: אִם עֹלָ֤ה קָרְבָּנ/וֹ֙ מִן הַ/בָּקָ֔ר זָכָ֥ר תָּמִ֖ים יַקְרִיבֶ֑/נּוּ אֶל פֶּ֝תַח אֹ֤הֶל מוֹעֵד֙ יַקְרִ֣יב אֹת֔/וֹ לִ/רְצֹנ֖/וֹ לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/003.yaml
  text: If his offering is a burnt offering from the herd[a], he shall offer a male without blemish. He shall offer it at the entrance of the tent of meeting, that he may be accepted before Yahweh.
translation:
  language: ta
  text: அவனுடைய காணிக்கை மாட்டு மந்தையிலிருந்து வரும் தகனபலியாக இருந்தால், அவன் குறைபாடற்ற ஒரு ஆண் மாட்டைச் செலுத்த வேண்டும். சந்திப்புக் கூடாரத்தின் நுழைவாயிலில், யாவே முன்னிலையில் அவன் ஏற்றுக்கொள்ளப்படும்படி, அதைச் செலுத்த வேண்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֹלָה
  choice: தகனபலி
  rationale: பலிபீடத்தில் முழுவதுமாக எரித்துச் செலுத்தப்படும் பலியைக் குறிக்கும் லேவியராகமத்தின் வழக்கமான பலிச்சொல்; நவீனத் தமிழில் தெளிவாகவும் சுருக்கமாகவும் உள்ளது.
- source_word: קָרְבָּנוֹ
  choice: அவனுடைய காணிக்கை
  rationale: கடவுளிடம் கொண்டுவரப்படும் பலிப் பொருளைக் குறிக்கும் பொதுச் சொல். இச்சூழலில் ‘காணிக்கை’ இயல்பான தமிழ் வழக்கு.
- source_word: מִן הַבָּקָר
  choice: மாட்டு மந்தையிலிருந்து
  rationale: ஆடு போன்ற சிறுமந்தை விலங்குகளுக்கு மாறாக மாட்டினத்தைச் சேர்ந்த கால்நடைகளைக் குறிக்கிறது; அடுத்துள்ள ஆண்பால் குறிப்பையும் தமிழில் தெளிவுபடுத்துகிறது.
- source_word: זָכָר תָּמִים
  choice: குறைபாடற்ற ஓர் ஆண் மாடு
  rationale: பலிக்குரிய விலங்கு ஆண்பாலாகவும் உடற்குறை இல்லாததாகவும் இருக்க வேண்டும் என்ற இரு நிபந்தனைகளையும் வெளிப்படையாகப் பாதுகாக்கிறது.
- source_word: יַקְרִיבֶנּוּ / יַקְרִיב אֹתוֹ
  choice: அதைச் செலுத்த வேண்டும்
  rationale: קרב என்பதன் ஹிஃபீல் வடிவம் பலிச் சூழலில் கொண்டுவந்து சமர்ப்பித்தல் அல்லது செலுத்துதலைக் குறிக்கிறது. ‘செலுத்த வேண்டும்’ பலி வழக்குக்கு ஏற்ற இயல்பான தமிழாக்கம்.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரத்தின் நுழைவாயில்
  rationale: இஸ்ரவேலின் பரிசுத்த இடத்தைக் குறிக்கும் நிலையான தொடரை அதன் இடவியல் பொருளுடன் தெளிவாக வழங்குகிறது.
- source_word: לִרְצֹנוֹ
  choice: அவன் ஏற்றுக்கொள்ளப்படுவதற்காக
  rationale: இலக்கண ரீதியாகக் கடினமான இத்தொடருக்கு, பலி செலுத்துபவன் கடவுளின் அங்கீகாரத்தைப் பெறுதல் என்ற சாத்தியமான பலிச்சூழல் பொருளை இயல்பான தமிழில் தருகிறது; விருப்பத்தோடு செலுத்துதல் என்ற மாற்றுப் புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: לִפְנֵי יְהוָה
  choice: யாவே முன்னிலையில்
  rationale: לִפְנֵי என்பதன் ‘முன்னிலையில்’ என்ற பொருளையும் יהוה என்ற உடன்படிக்கைப் பெயரையும் நேரடியாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் தமிழாக்கம்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் வரும் நான்கெழுத்து இறைப் பெயரைப் பட்டப்பெயராக மாற்றாமல், ‘Yahweh’ என்பதற்கான நேரடியான தமிழ் ஒலிபெயர்ப்பாக வழங்குகிறது.
- issue: לִרְצֹנוֹ என்பதன் பொருள்
  choice: அவன் ஏற்றுக்கொள்ளப்படுவதற்காக
  alternative: அவன் தன் விருப்பத்தின்படி
  rationale: இத்தொடர் பலி செலுத்துபவன் யாவேயால் ஏற்றுக்கொள்ளப்படுவதைக் குறிக்கலாம்; தன்னார்வத்தைக் குறிக்கிறது என்ற பாரம்பரியப் புரிதலும் உண்மையான மாற்று என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான பலி வழக்கு பயன்படுத்தப்பட்டுள்ளது. ‘ஆண்’ என்று மட்டும் விடாமல் ‘ஆண் மாடு’ எனச் சூழலுக்கேற்ப தெளிவுபடுத்தப்பட்டுள்ளது. மூலத்தின் பொருள் ஐயத்தைத் தீர்த்துவிடாமல் அடிக்குறிப்பில் மாற்று வாசிப்பு பாதுகாக்கப்பட்டுள்ளது.
