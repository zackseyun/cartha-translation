  yaml_path: translation/ot/leviticus/001/012.yaml
  text: And he shall cut it into its pieces[a], with its head and its fat, and the priest shall arrange them on the wood that is on the fire, which is on the altar.
translation:
  language: ta
  text: அவன் அதைத் துண்டுகளாக வெட்ட வேண்டும்; அதன் தலையையும் அதன் கொழுப்பையும் சேர்த்து, ஆசாரியன் அவற்றைப் பலிபீடத்தின் மேல் உள்ள நெருப்பின்மேல் வைக்கப்பட்டிருக்கும் விறகுகளின்மேல் ஒழுங்காக அடுக்க வேண்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנִתַּח אֹתוֹ לִנְתָחָיו
  choice: அவன் அதைப் பகுதிகளாக வெட்டி
  rationale: பலியிடும் சூழலில் נתח என்பது மிருகத்தைத் துண்டுகளாக வெட்டுவதைக் குறிக்கிறது. ‘பகுதிகளாக வெட்டி’ என்பது செய்முறையை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: רֹאשׁוֹ
  choice: அதன் தலை
  rationale: மிருகத்தின் உடற்கூறைக் குறிக்கும் நேரடியான சொல்.
- source_word: פִּדְרוֹ
  choice: அதன் கொழுப்பு
  rationale: פדר என்பது பலிமிருகத்துடன் தொடர்புடைய கொழுப்புத் திசுவை, குறிப்பாக உட்பாகங்களைச் சுற்றியுள்ள கொழுப்பை, குறிக்கலாம். பொதுவாசகர்களுக்குத் தெளிவான ‘கொழுப்பு’ முதன்மை உரையில் வைக்கப்பட்டு, கூடுதல் துல்லியம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְעָרַךְ
  choice: ஒழுங்காக அடுக்க வேண்டும்
  rationale: வழிபாட்டுச் சூழலில் ערך என்பது பொருட்களை வரிசைப்படுத்தி அல்லது ஒழுங்குபடுத்தி வைப்பதைக் குறிக்கிறது. ‘ஒழுங்காக அடுக்க’ என்பது அந்தச் சடங்குமுறைச் செயலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַכֹּהֵן
  choice: ஆசாரியன்
  rationale: லேவியராகமத்தின் பலிச் சட்டங்களில் כהן என்பதற்கான நிலையான, பொதுவாகப் புரிந்துகொள்ளப்படும் தமிழ் வழக்கு.
- source_word: אֹתָם
  choice: அவற்றை
  rationale: வெட்டப்பட்ட பகுதிகள், தலை, கொழுப்பு ஆகியவற்றைச் சேர்த்துக் குறிக்கிறது.
- source_word: עַל הָעֵצִים
  choice: விறகுகளின்மேல்
  rationale: எபிரெயத்தில் பன்மையாக உள்ள עֵצִים, பலிபீட நெருப்புக்குப் பயன்படுத்தப்படும் மரக்கட்டைகளை இச்சூழலில் குறிக்கிறது; ‘விறகுகள்’ தமிழில் இயல்பானதும் தெளிவானதும் ஆகும்.
- source_word: אֲשֶׁר עַל הָאֵשׁ אֲשֶׁר עַל הַמִּזְבֵּחַ
  choice: பலிபீடத்தின்மேல் உள்ள நெருப்பிலிருக்கும்
  rationale: விறகுகள் நெருப்பின்மேலும், அந்த நெருப்பு பலிபீடத்தின்மேலும் இருப்பதாகிய எபிரெய உரையின் அடுக்குநிலைத் தொடர்பைச் சுருக்காமல் காக்கிறது.
