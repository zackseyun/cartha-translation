  source_fidelity: 'மூலத்தின் முக்கிய அமைப்பு நன்றாகப் பாதுகாக்கப்பட்டுள்ளது: இஸ்ரவேலருக்கான அழைப்பு, தனிநபரை அறிமுகப்படுத்தும் நிபந்தனை, யாவேவுக்கான காணிக்கை, கால்நடைகள் மற்றும் மாடு/ஆட்டு மந்தை என்ற வகைப்பாடு, பின்னர் வரும் இரண்டாம் நபர் பன்மை ஆகியவை உள்ளன. ஆனால் “கால்நடைகளிலிருந்து” என்பது எபிரெய מִן הַבְּהֵמָה-வின் உடனடி மூல/வகை உறவைச் சற்றே தெளிவிழக்கச் செய்கிறது; “கால்நடைகளில் இருந்து” இயல்பாகவும் துல்லியமாகவும் அமையும்.'
