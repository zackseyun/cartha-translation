source:
  edition: WLC
  text: דַּבֵּ֞ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם אָדָ֗ם כִּֽי יַקְרִ֥יב מִ/כֶּ֛ם קָרְבָּ֖ן לַֽ/יהוָ֑ה מִן הַ/בְּהֵמָ֗ה מִן הַ/בָּקָר֙ וּ/מִן הַ/צֹּ֔אן תַּקְרִ֖יבוּ אֶת קָרְבַּנְ/כֶֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/002.yaml
  text: 'Speak to the sons of Israel and say to them: When a man from among you brings an offering to Yahweh[b][a], you shall bring your offering from the livestock—from the herd or from the flock.'
translation:
  language: ta
  text: '“இஸ்ரவேல் மக்களிடம்[a] பேசி, அவர்களிடம் சொல்: ‘உங்களில் ஒருவர்[b] யாவேவுக்குக் காணிக்கை ஒன்றைக் கொண்டுவந்தால், கால்நடைகளில் இருந்து—மாட்டு மந்தையிலிருந்தோ ஆடு மந்தையிலிருந்தோ[c]—உங்கள் காணிக்கையைக் கொண்டுவர வேண்டும்.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் நேரடியாக, “இஸ்ரவேலின் மகன்கள்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “ஒரு மனிதன்.” எபிரெய אָדָם இங்கு சமூகத்திலுள்ள ஒரு நபரைப் பிரதிநிதித்துவமாகக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: “ஆடு மந்தை” என்பது இங்கு செம்மறியாடுகளையும் வெள்ளாடுகளையும் உள்ளடக்குகிறது.
    reason: lexical_clarification
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: எபிரெய மொழிவழக்கின் நேரடிப் பொருள் ‘இஸ்ரவேலின் மகன்கள்.’ நவீனத் தமிழில் முழுச் சமூகத்தையும் இயல்பாகக் குறிக்க ‘இஸ்ரவேல் மக்கள்’ என வழங்கப்பட்டுள்ளது; நேரடி வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: אָדָם
  choice: ஒருவர்
  rationale: இந்த ஒருமைச் சொல் சமூகத்திலுள்ள ஒரு நபரை எடுத்துக்காட்டாக அறிமுகப்படுத்துகிறது. இயல்பான தமிழுக்காக ‘ஒருவர்’ என வழங்கி, ‘ஒரு மனிதன்’ என்ற நேரடிப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: יַקְרִיב
  choice: கொண்டுவந்தால்
  rationale: קרב என்பதன் ஹிஃபில் வடிவம் பலிச்சூழலில் ஒரு காணிக்கையை அருகில் கொண்டுவருதல் அல்லது சமர்ப்பித்தலைக் குறிக்கிறது. ‘கொண்டுவருதல்’ அதன் செயற்பாட்டுத் தன்மையையும் பின்னர் வரும் அதே வேர்ச்சொல்லுடனான தொடர்பையும் காக்கிறது.
- source_word: מִכֶּם
  choice: உங்களில்
  rationale: சமூகத்திலிருந்து ஓர் தனிநபரைப் பகுத்துக் காட்டும் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: קָרְבָּן
  choice: காணிக்கை
  rationale: இது பல வகையான அர்ப்பணிப்புகளை உள்ளடக்கும் பரந்த பலிச்சொல்; ‘பலி’ என்பதைவிட ‘காணிக்கை’ இங்கு பரந்த பொருளைச் சிறப்பாகக் காக்கிறது.
- source_word: לַיהוָה
  choice: யாவேவுக்கு
  rationale: மூலத்தில் உள்ள இறைநாமமாகிய יהוה என்பதை பொதுப்பட்டப் பெயராக மாற்றாமல் ஒலிபெயர்த்து வழங்குகிறது.
- source_word: הַבְּהֵמָה
  choice: கால்நடைகள்
  rationale: பலிக்குத் தகுந்த வீட்டுவளர்ப்பு விலங்குகளின் பொதுப்பிரிவை நவீனத் தமிழில் தெளிவாகக் குறிக்கிறது.
- source_word: הַבָּקָר
  choice: மாட்டு மந்தை
  rationale: பெரிய கால்நடைகளாகிய மாடுகளைக் குறிக்கும் துணைப்பிரிவைத் துல்லியமாக வெளிப்படுத்துகிறது.
- source_word: הַצֹּאן
  choice: ஆட்டு மந்தை
  rationale: செம்மறியாடுகளையும் வெள்ளாடுகளையும் உள்ளடக்கும் சிறு கால்நடைக் கூட்டத்தைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது; அதன் வரம்பு அடிக்குறிப்பில் தெளிவாக்கப்படுகிறது.
- source_word: תַּקְרִיבוּ אֶת קָרְבַּנְכֶם
  choice: உங்கள் காணிக்கையைக் கொண்டுவர வேண்டும்
  rationale: மூலத்தின் இரண்டாம் நபர் பன்மையைப் பாதுகாத்து, முன்னர் வந்த יקריב உடனான வேர்ச்சொல் தொடர்பையும் தமிழில் ‘கொண்டுவரு’ என்பதை மீண்டும் பயன்படுத்திக் காட்டுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைநாமத்தை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: வசனம் உடன்படிக்கை இறைநாமத்தை நேரடியாகப் பயன்படுத்துவதால், அதை ஒரு பொதுப்பட்டப் பெயராக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- issue: אָדָם மற்றும் בְּנֵי יִשְׂרָאֵל ஆகியவற்றிலுள்ள பிரதிநிதித்துவ ஆண்பால் மொழி
  choice: முதன்மை உரையில் இயல்பான சமூகக் குறிப்புகளான ‘ஒருவர்,’ ‘இஸ்ரவேல் மக்கள்’; நேரடி ஆண்பால் வடிவங்கள் அடிக்குறிப்பில்
  alternative: ‘ஒரு மனிதன்,’ ‘இஸ்ரவேலின் மகன்கள்’ என்று முதன்மை உரையிலேயே வழங்குதல்
  rationale: எபிரெய வடிவங்களை மறைக்காமல் அடிக்குறிப்புகளில் காட்டியபடியே, அவை இச்சூழலில் முழுச் சமூகத்தையும் அதிலுள்ள எந்தத் தனிநபரையும் பிரதிநிதித்துவமாகக் குறிக்கும் பொருளை இயல்பான நவீனத் தமிழில் எடுத்துரைக்கிறது.
- issue: ஒருமை நிபந்தனைச் சூழலிலிருந்து பன்மை கட்டளைக்கான மாற்றம்
  choice: ‘ஒருவர் ... கொண்டுவந்தால்’ என்பதற்குப் பின் ‘உங்கள் காணிக்கையைக் கொண்டுவர வேண்டும்’
  alternative: முழுவதையும் ஒருமையில் ஒத்திசைத்தல்
  rationale: மூலத்தில் தனிநபர் எடுத்துக்காட்டிலிருந்து சமூகத்தை நோக்கிய இரண்டாம் நபர் பன்மை அறிவுறுத்தலுக்கு நிகழும் மாற்றத்தைச் சீராக்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், வழிபாட்டு உரைக்கு ஏற்ற கண்ணியமான ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘பேசி ... சொல்’ என்ற இரட்டை ஆணை, ஒருமையிலிருந்து பன்மைக்கான மாற்றம், மேலும் ‘கொண்டுவரு’ என்ற வினையின் மீளுருவாக்கம் ஆகியவை மூலத்தின் அமைப்பைப் பாதுகாக்கின்றன.
