base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/014.yaml
  text: And if his offering to Yahweh is a burnt offering from the birds, then he shall present his offering from the turtledoves or from the young pigeons.
translation:
  language: ta
  text: பறவைகளில் இருந்து யாவேக்குச் செலுத்தும் அவரது பலி தகனபலியாக இருந்தால், அவர் தமது பலியை காட்டுப்புறாக்களிலிருந்தோ புறாக்குஞ்சுகளிலிருந்தோ கொண்டுவர வேண்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: ஒருவர் ... செலுத்துவதாக இருந்தால்
  rationale: முந்தைய பலிவகைகளின் தொடர்ச்சியில் அடுத்த நிபந்தனை நிலையை இயல்பான நவீனத் தமிழில் அறிமுகப்படுத்துகிறது.
- source_word: מִן הָעוֹף
  choice: பறவைகளிலிருந்து
  rationale: עוֹף இச்சூழலில் பலிக்காகக் கொண்டுவரப்படும் பறவைகளைக் குறிக்கிறது; பொதுவான வகையைத் தெளிவாகக் காட்டுகிறது.
- source_word: עֹלָה
  choice: தகனபலி
  rationale: முழுவதுமாக எரிக்கப்படும் குறிப்பிட்ட பலிவகையைக் குறிக்கும் வழக்கமான, சுருக்கமான தமிழ்ச் சொல்.
- source_word: קָרְבָּנוֹ
  choice: தமது பலி
  rationale: கடவுளிடம் கொண்டுவரப்படும் அர்ப்பணிப்பை இச்சூழலில் ‘பலி’ இயல்பாகக் குறிக்கிறது; தமிழின் மதிப்புமிக்க ஒருமை நடையில் ‘தமது’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: எபிரெய மூலத்தில் வரும் இறைத் திருப்பெயரைப் பெயராகவே ஒலிபெயர்த்து, ל முன்னிடைச்சொல்லை ‘-க்கு’ எனக் கொடுக்கிறது.
- source_word: וְהִקְרִיב
  choice: செலுத்த வேண்டும்
  rationale: பலியைச் சடங்குமுறையில் முன்வைத்தல் அல்லது கொண்டுவந்து அர்ப்பணித்தல் என்ற Hiphil வினையின் கருத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מִן הַתֹּרִים
  choice: காட்டுப்புறாக்களிலிருந்து
  rationale: תֹּרִים குறிக்கும் turtledoves என்பவற்றை பொதுவாகப் புரியக்கூடிய தமிழில் வேறுபடுத்திக் காட்டுகிறது.
- source_word: אוֹ
  choice: -லிருந்தோ ... -லிருந்தோ
  rationale: அனுமதிக்கப்பட்ட இரு பறவை வகைகளுக்கிடையிலான மாற்றுத் தேர்வைத் தமிழின் இணை ‘-ஓ’ அமைப்பு இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מִן בְּנֵי הַיּוֹנָה
  choice: புறாக்குஞ்சுகளிலிருந்து
  rationale: ‘புறாவின் மகன்கள்’ என்ற எபிரெய மரபுத்தொடர் இங்கு இளம் புறாக்களைக் குறிக்கிறது; தமிழில் ‘புறாக்குஞ்சுகள்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
theological_decisions:
- issue: יהוה என்ற இறைத் திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பொதுப்பட்டம் அல்லாமல் நான்கெழுத்து இறைத் திருப்பெயர் நேரடியாக உள்ளது; அதனை மறைக்காமல் தமிழில் ஒலிபெயர்க்கிறது.
- issue: עֹלָה என்ற பலிவகையின் பெயர்
  choice: தகனபலி
  alternative: மேலேறும் பலி
  rationale: சொல்லின் வேருடன் தொடர்புடைய ‘மேலேறுதல்’ என்ற படிமத்தை விளக்கமாகச் சேர்க்காமல், லேவியராகமச் சடங்கில் குறிக்கப்படும் நிறுவப்பட்ட பலிவகையைத் தெளிவாகக் காட்டுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிமையானதாயினும் கண்ணியமான சடங்கு மொழிநடை. எபிரெய ஆண்பால் ஒருமையை பாலினப் பிரத்தியேகமாக வலியுறுத்தாமல், பொதுவான ‘ஒருவர்/அவர்/தமது’ அமைப்பில் வழங்குகிறது.
