base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/008.yaml
  text: And Aaron’s sons[a], the priests, shall arrange the pieces, the head, and the fat on the wood that is on the fire that is on the altar.
translation:
  language: ta
  text: ஆரோனின் மகன்களாகிய ஆசாரியர்கள், துண்டுகளையும், தலையையும், கொழுப்புப் பகுதியையும்[a] பலிபீடத்தின்மேல் உள்ள நெருப்பின்மேல் இருக்கும் விறகுகளின்மேல் ஒழுங்காக அடுக்கிவைக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “திடக் கொழுப்பு” அல்லது “கொழுப்புப் போர்வை”; எபிரெயச் சொல் பலியில் பயன்படுத்தப்பட்ட விலங்கின் ஒரு கொழுப்பான பகுதியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָרְכוּ
  choice: ஒழுங்காக அடுக்கிவைக்க வேண்டும்
  rationale: ערך என்பது பலிச் சடங்கின் சூழலில் பொருட்களை வரிசையாக அல்லது ஒழுங்காக அமைப்பதைக் குறிக்கிறது. தமிழ் நடைமுறைக் கட்டளையின் இயல்புக்கு ஏற்றவாறு கடமையுணர்வையும் செயலின் ஒழுங்கையும் இச்சொற்றொடர் வெளிப்படுத்துகிறது.
- source_word: בְּנֵי אַהֲרֹן הַכֹּהֲנִים
  choice: ஆரோனின் மகன்களாகிய ஆசாரியர்கள்
  rationale: ‘ஆசாரியர்கள்’ என்பது ஆரோனின் மகன்களை விளக்கும் இணைப்பெயராக உள்ளது; ‘மகன்களாகிய’ என்ற அமைப்பு அந்தத் தொடர்பை இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: הַנְּתָחִים
  choice: துண்டுகள்
  rationale: முந்தைய வசனத்தில் வெட்டப்பட்ட விலங்கின் பகுதிகளையே נְתָחִים குறிக்கிறது. ‘துண்டுகள்’ என்பது மூலத்தில் இல்லாத கூடுதல் விளக்கத்தைச் சேர்க்காமல் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: הָרֹאשׁ
  choice: தலை
  rationale: இது நேரடியான உடலுறுப்புப் பெயர்; எளிய தமிழ்ச் சொல் மூலப்பொருளைத் துல்லியமாகத் தருகிறது.
- source_word: הַפָּדֶר
  choice: கொழுப்புப் பகுதி
  rationale: פָּדֶר பலியில் பயன்படுத்தப்பட்ட விலங்கின் ஒரு கொழுப்பான பகுதியைக் குறிக்கிறது; அதன் துல்லியமான உடற்கூறு அடையாளம் உறுதியற்றதால் பொதுவாகவும் தெளிவாகவும் ‘கொழுப்புப் பகுதி’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: עַל הָעֵצִים
  choice: விறகுகளின்மேல்
  rationale: עֵצִים இங்கு பலிபீடத்தின் எரிபொருளாகிய மரக்கட்டைகளைக் கூட்டுப்பொருளில் குறிக்கிறது. ‘விறகுகள்’ என்பது இச்சூழலில் இயல்பான நவீனத் தமிழ்.
- source_word: אֲשֶׁר עַל הָאֵשׁ אֲשֶׁר עַל הַמִּזְבֵּחַ
  choice: பலிபீடத்தின்மேல் உள்ள நெருப்பின்மேல் இருக்கும் விறகுகளின்மேல்
  rationale: எபிரெயத்தில் விறகு நெருப்பின்மேலும் நெருப்பு பலிபீடத்தின்மேலும் இருப்பதாக இரண்டு தொடர்புச் சொற்றொடர்கள் அடுக்கப்படுகின்றன. தமிழ் வாக்கிய வரிசை இயல்புக்காக கூறுகளின் வரிசை மாற்றப்பட்டாலும், அந்த அடுக்கான இடவமைப்பு முழுமையாகப் பாதுகாக்கப்பட்டுள்ளது.
