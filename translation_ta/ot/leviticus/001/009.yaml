base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/009.yaml
  text: But he shall wash its entrails and its legs with water[a], and the priest shall turn all of it into smoke on the altar, a burnt offering, a food offering[c][b], a pleasing aroma to Yahweh.
translation:
  language: ta
  text: ஆனால், அதன் உள்ளுறுப்புகளையும் கால்களையும் அவன் தண்ணீரால் கழுவ வேண்டும். ஆசாரியன் முழுவதையும் பலிபீடத்தின்மேல் எரித்துப் புகையாக எழும்பச் செய்ய வேண்டும்; அது ஒரு தகனபலி, நெருப்பில் செலுத்தப்படும் பலி[a], யாவேக்கு[c] இனிய நறுமணம்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உணவுக் காணிக்கை.”
    reason: lexical_alternative
  - marker: b
    text: “இனிய நறுமணம்” என்பது பலியை யாவே ஏற்றுக்கொள்வதைக் குறிக்கும் நிலையான பலிச் சொல்லாட்சி.
    reason: cultural_note
  - marker: c
    text: 'எபிரெயம்: יהוה (YHWH); மரபுவழியாக “கர்த்தர்” என்று வழங்கப்படுகிறது.'
    reason: alternative_reading
lexical_decisions:
- source_word: קִרְבּוֹ
  choice: அதன் உள்ளுறுப்புகள்
  rationale: பலியிடப்படும் விலங்கின் உட்புற உறுப்புகளை இச்சொல் குறிக்கிறது. நவீனத் தமிழில் தெளிவாகவும் சடங்கு சார்ந்த சூழலுக்கு ஏற்றவாறும் உள்ளது.
- source_word: כְרָעָיו
  choice: அதன் கால்கள்
  rationale: விலங்கின் கீழ்க்கால்கள் அல்லது கால்பகுதிகளைக் குறிக்கும் எளிய, இயல்பான தமிழ் வடிவம்.
- source_word: יִרְחַץ בַּמָּיִם
  choice: தண்ணீரால் கழுவ வேண்டும்
  rationale: எபிரெய வினையின் கழுவுதல் என்ற நேரடிப் பொருளையும், கருவியைக் குறிக்கும் முன்னொட்டையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְהִקְטִיר
  choice: எரித்துப் புகையாக எழும்பச் செய்ய வேண்டும்
  rationale: இது வெறுமனே எரிப்பதை அல்ல, பலிபீடத்திலிருந்து பலியைப் புகையாக மேலெழச் செய்யும் ஆசாரியச் செயலைக் குறிப்பாகக் குறிக்கிறது.
- source_word: אֶת־הַכֹּל
  choice: அவை அனைத்தையும்
  rationale: ஆயத்தப்படுத்தப்பட்ட பலியின் முழுமையையும் வலியுறுத்துகிறது.
- source_word: עֹלָה
  choice: தகனபலி
  rationale: முழுவதுமாக எரித்துச் செலுத்தப்படும் இப்பலி வகைக்கான நிலைபெற்ற, சுருக்கமான தமிழ் சொல்.
- source_word: אִשֶּׁה
  choice: நெருப்பில் செலுத்தப்படும் பலி
  rationale: நெருப்பின் வழியாகச் செலுத்தப்படும் பலி என்ற வழக்கமான ஆசாரியப் பொருளைத் தருகிறது; ‘உணவுக் காணிக்கை’ என்ற சாத்தியமான புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: רֵיחַ נִיחוֹחַ
  choice: இனிய நறுமணம்
  rationale: இறைவனால் ஏற்றுக்கொள்ளப்படுதலைச் சுட்டும் நிலையான பலிச் சொல்லாட்சியின் உருவகத்தைத் தக்கவைக்கிறது.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: மூலத்தில் நேரடியாக இடம்பெறும் உடன்படிக்கைத் திருப்பெயரை பெயராகவே வழங்குகிறது.
theological_decisions:
- issue: אִשֶּׁה என்பதன் பொருள்
  choice: நெருப்பில் செலுத்தப்படும் பலி
  alternative: உணவுக் காணிக்கை
  rationale: சொல்லின் நெருப்பு சார்ந்த பலிப் பயன்பாட்டை முதன்மை உரை வெளிப்படுத்துகிறது; ஆசாரிய இலக்கியத்தில் உணவாக இறைவனுக்குச் செலுத்தப்படும் காணிக்கை என்ற விளக்கத்தையும் அடிக்குறிப்பு மறைக்காமல் தருகிறது.
- issue: רֵיחַ נִיחוֹחַ என்ற பலிச் சூத்திரம்
  choice: இனிய நறுமணம்
  alternative: மகிழ்வூட்டும் மணம்
  rationale: மூல உருவகத்தைத் தக்கவைத்து, இறைவனுக்கு பலி ஏற்றதாக இருப்பதைச் சுட்டும் வழக்குச் சூத்திரம் என்பதை அடிக்குறிப்பில் விளக்குகிறது; கடவுளின் இயல்பைப் பற்றி உரை கூறாத ஒன்றைச் சேர்ப்பதில்லை.
- issue: יהוה என்ற திருப்பெயர்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல எபிரெய உரையில் உள்ள தனிப்பட்ட திருப்பெயரை வெளிப்படையாகக் காட்டுகிறது; மரபுவழி மாற்றீட்டை அடிக்குறிப்பில் குறிப்பிடுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு விளங்கும் வகையில் மரியாதைமிக்க நடையைக் கடைப்பிடிக்கிறது. ஆசாரியச் செயலைத் துல்லியமாகக் காட்ட ‘எரித்துப் புகையாக எழும்பச் செய்ய’ என்று வழங்கப்பட்டுள்ளது. மூலத்தின் பலிச் சொற்களின் தொடரை இயல்பான தமிழ் வாக்கியங்களாகப் பிரித்தாலும், அவற்றின் இணைப்புப் பொருள் காக்கப்பட்டுள்ளது.
