source:
  edition: WLC
  text: וְ֠/נָתְנוּ בְּנֵ֨י אַהֲרֹ֧ן הַ/כֹּהֵ֛ן אֵ֖שׁ עַל הַ/מִּזְבֵּ֑חַ וְ/עָרְכ֥וּ עֵצִ֖ים עַל הָ/אֵֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/007.yaml
  text: And the sons of Aaron the priest shall put fire on the altar and arrange wood on the fire[a].
translation:
  language: ta
  text: ஆசாரியனாகிய ஆரோனின் மகன்கள் பலிபீடத்தின்மேல் நெருப்பை வைக்க வேண்டும்; நெருப்பின்மேல் விறகுகளை ஒழுங்காக அடுக்க வேண்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנָתְנוּ
  choice: வைத்து
  rationale: נתן என்பதன் அடிப்படைப் பொருள் ‘கொடு/வை/அமை’ என்பதாகும். இப்பலிச் சடங்கு வழிமுறையில் நெருப்பைப் பலிபீடத்தின்மேல் வைப்பதைக் குறிக்க ‘வைத்து’ என்பது இயல்பான தமிழ்.
- source_word: בְּנֵי אַהֲרֹן הַכֹּהֵן
  choice: ஆசாரியனாகிய ஆரோனின் மகன்கள்
  rationale: הַכֹּהֵן என்ற ஒருமைச் சொல் ஆரோனை ‘ஆசாரியன்’ என்று விளக்குகிறது; மகன்களை ஆசாரியக் குடும்பம் என மாற்றிப் பொருள்கொள்ளாமல் எபிரெய இலக்கண உறவு பாதுகாக்கப்படுகிறது.
- source_word: אֵשׁ
  choice: நெருப்பு
  rationale: பலிச் சடங்கில் பயன்படுத்தப்படும் நேரடியான நெருப்பையே குறிக்கிறது.
- source_word: עַל הַמִּזְבֵּחַ
  choice: பலிபீடத்தின்மேல்
  rationale: பலிச் சூழலில் מִזְבֵּחַ என்பதற்கு நிலையான தமிழ் ‘பலிபீடம்’; עַל இங்கு ‘மேல்’ என்ற இடப்பொருளைக் கொண்டுள்ளது.
- source_word: וְעָרְכוּ
  choice: ஒழுங்காக அடுக்கவேண்டும்
  rationale: ערך என்பது சடங்கு வழக்கில் வரிசைப்படுத்துதல் அல்லது ஒழுங்காக அமைத்தல் என்று பொருள்படும். ‘ஒழுங்காக அடுக்க’ என்பது விறகுகளுக்குப் பொருத்தமான இயல்பான தமிழாகவும் ஒழுங்கமைப்பின் நுணுக்கத்தைக் காக்கவும் செய்கிறது.
- source_word: עֵצִים
  choice: விறகுகளை
  rationale: עֵצִים என்பது வடிவில் பன்மை. இங்கு எரிப்பதற்கான மரத்துண்டுகளைக் குறிக்கும் என்பதால், தமிழில் இயல்பான ‘விறகுகள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: עַל הָאֵשׁ
  choice: நெருப்பின்மேல்
  rationale: எபிரெய மூலத்தில் மீண்டும் வரும் இடப்பொருள் சொற்றொடரைத் தமிழிலும் வெளிப்படையாகப் பாதுகாக்கிறது.
