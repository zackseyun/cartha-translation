- from: ஆசாரியனாகிய ஆரோனின் மகன்கள் பலிபீடத்தின்மேல் நெருப்பை வைத்து, நெருப்பின்மேல் விறகுகளை ஒழுங்காக அடுக்கவேண்டும்.
  to: ஆசாரியனாகிய ஆரோனின் மகன்கள் பலிபீடத்தின்மேல் நெருப்பை வைக்க வேண்டும்; நெருப்பின்மேல் விறகுகளை ஒழுங்காக அடுக்க வேண்டும்.
