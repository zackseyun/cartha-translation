translation_notes:
  register: நவீன நிலையான தமிழில், பலிச் சட்டத்திற்குரிய கண்ணியமான அறிவுறுத்தல் நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய தொடரமைப்பு தமிழில் இயல்பாக அமையச் செய்யப்பட்டாலும், ஆரோனை விளக்கும் ‘ஆசாரியன்’ என்ற ஒருமையும் செயல்களின் வரிசையும் பாதுகாக்கப்பட்டுள்ளன.
