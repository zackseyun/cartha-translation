review_pass:
  verdict: revise
  source_fidelity: The draft accurately identifies Aaron as ‘the priest,’ retains the literal altar-fire-wood sequence, and translates the repeated ‘on’ relation explicitly. However, the first finite instruction is rendered as the participle ‘வைத்து’ (‘having placed’), while the second bears the obligation; the Hebrew coordinates two procedural actions, each with instructional force.
  naturalness: ‘ஆசாரியனாகிய ஆரோனின் மகன்கள்’ and the ritual vocabulary are natural and appropriately formal in modern standard Tamil. Making both coordinated actions explicit with ‘வேண்டும்’ is clearer and more idiomatic for a legal-ritual instruction than ‘வைத்து ... அடுக்கவேண்டும்.’
  terminology: ‘ஆசாரியன்,’ ‘பலிபீடம்,’ ‘நெருப்பு,’ and ‘விறகுகள்’ are suitable, standard choices. No theological terminology requires alteration.
  issues:
  - severity: medium
    issue: The coordinated verbal force is not fully represented.
    rationale: וְנָתְנוּ ... וְעָרְכוּ presents two coordinated actions by Aaron’s sons. ‘நெருப்பை வைத்து’ is a dependent participial phrase (‘having put the fire’), whereas the source gives both actions equivalent procedural force. Rendering both with ‘வேண்டும்’ preserves the coordination and directive sense.
  revised_text: ஆசாரியனாகிய ஆரோனின் மகன்கள் பலிபீடத்தின்மேல் நெருப்பை வைக்க வேண்டும்; நெருப்பின்மேல் விறகுகளை ஒழுங்காக அடுக்க வேண்டும்.
  revised_footnotes: []
  revision_rationale: The revision changes only the verbal construction, so that placing the fire and arranging the wood are expressed as two coordinated ritual requirements, matching the Hebrew syntax and instruction-like force. The lexical renderings and the explicit repeated location phrase are retained.
