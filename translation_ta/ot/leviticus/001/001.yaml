  yaml_path: translation/ot/leviticus/001/001.yaml
  text: Then Yahweh called to Moses and spoke to him from the tent of meeting[a], saying,
translation:
  language: ta
  text: 'அப்போது யாவே[a] மோசேயை அழைத்து, சந்திப்புக் கூடாரத்திலிருந்து அவரிடம் பேசி, இவ்வாறு சொன்னார்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மூலத்தில் יהוה (YHWH) என்ற இறைப் பெயர் உள்ளது; ‘யெகோவா’ என்பது ஒரு மரபான மாற்று ஒலிப்பு.
    reason: இறைப் பெயரின் மூல வடிவத்தையும் மாற்று மரபு ஒலிப்பையும் தெரிவிக்கிறது.
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: அப்போது … கூப்பிட்டு
  rationale: קרא இங்கு மோசேயை நோக்கிய இறை அழைப்பைக் குறிக்கிறது. ‘கூப்பிட்டு’ என்பது அழைப்பின் தன்மையை இயல்பாகத் தெரிவிக்கிறது; ‘வரவழைத்து’ என்பது எபிரெயச் சொல்லில் வெளிப்படையாக இல்லாத கட்டளைத் தன்மையைச் சேர்க்கக்கூடும். தொடக்க וַ தொடர் நிகழ்வை முன்னெடுப்பதால் ‘அப்போது’ பயன்படுத்தப்பட்டது.
- source_word: אֶל־מֹשֶׁה
  choice: மோசேயை நோக்கி
  rationale: קרא உடன் வரும் אֶל, அழைப்பு மோசேயை நோக்கியது என்பதைக் காட்டுகிறது. தமிழ் வழக்கில் ‘மோசேயை நோக்கிக் கூப்பிட்டு’ என்பது இயல்பாகவும் பொருளுக்கு நெருக்கமாகவும் உள்ளது.
- source_word: וַיְדַבֵּר
  choice: பேசினார்
  rationale: דבר முறையான இறை உரையைக் குறிக்கிறது. தொடர்ந்து வரும் לֵאמֹר என்பதிலிருந்து வேறுபாட்டைக் காக்க ‘பேசினார்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய நான்கெழுத்து இறைப் பெயரான יהוה-ஐ ஒரு பட்டமாக மாற்றாமல், நவீன தமிழில் அதன் பரவலான ஒலிபெயர்ப்பான ‘யாவே’ என்று வழங்குகிறது.
- source_word: אֵלָיו
  choice: அவரிடம்
  rationale: ஆண்பால் ஒருமை பின்னொட்டு மோசேயைக் குறிக்கிறது. மரியாதையான நவீன தமிழ் நடையில் ‘அவரிடம்’ இயல்பானது.
- source_word: מֵאֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரத்திலிருந்து
  rationale: אֹהֶל מוֹעֵד என்பது நியமிக்கப்பட்ட சந்திப்பின் இடமான பரிசுத்த கூடாரத்தைக் குறிக்கிறது. ‘சந்திப்புக் கூடாரம்’ மூலச் சொற்களைத் தெளிவாகக் காட்டுகிறது; ‘திருக்கூடாரம்’ போன்ற மரபுச் சொல் மூலத்தில் இல்லாத கூடுதல் கருத்தை முன்வைக்கலாம்.
- source_word: לֵאמֹר
  choice: 'அவர் சொன்னதாவது:'
  rationale: அடுத்து வரும் நேரடி உரையை அறிமுகப்படுத்தும் எபிரெயக் கூறைத் தமிழில் இயல்பாகக் காட்டுகிறது; அதேவேளை முந்தைய ‘பேசினார்’ என்பதுடனான இருபகுதி உரைச் சூத்திரமும் காக்கப்படுகிறது.
- source_word: מֹשֶׁה
  choice: மோசே
  rationale: משה என்ற பெயரின் தமிழில் நிலைபெற்ற வடிவம்.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை வழங்குதல்
  choice: யாவே
  alternative: யெகோவா; கர்த்தர்
  rationale: மூல வசனம் יהוה என்ற தனிப்பட்ட இறைப் பெயரை நேரடியாகப் பயன்படுத்துகிறது. ‘யாவே’ அதை பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்க்கிறது; ‘கர்த்தர்’ என்பது பெயருக்குப் பதிலாக ஒரு பட்டத்தை இடும். ‘யெகோவா’ என்பது மாற்று மரபு ஒலிப்பாகும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. எபிரெய உரையில் உள்ள ‘கூப்பிட்டு—பேசினார்—சொன்னதாவது’ என்ற உரைத் தொடரின் வேறுபாடு இயன்றவரை காக்கப்பட்டுள்ளது. அடுத்த வசனத்தின் நேரடி உரைக்குத் திறந்த முடிவாக முக்காற்புள்ளி வைக்கப்பட்டது.
