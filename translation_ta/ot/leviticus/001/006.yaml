  yaml_path: translation/ot/leviticus/001/006.yaml
  text: Then he shall skin the burnt offering and cut it into its pieces[a][b].
translation:
  language: ta
  text: பின்பு அவன் தகனபலியின் தோலை உரித்து[a], அதை அதன் பகுதிகளாக[b] வெட்ட வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தகனபலியின் தோலை அகற்றி.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெய மொழியில், “அதன் துண்டுகளாக”; பலிக்காக விலங்கைத் தனித்தனி பகுதிகளாகப் பிரிப்பதைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִפְשִׁיט
  choice: தோலை உரித்து
  rationale: பலி விலங்கின் தோலை அகற்றும் குறிப்பிட்ட சடங்குச் செயலைத் தெளிவாகவும் இயல்பான நவீனத் தமிழிலும் தெரிவிக்கிறது.
- source_word: הָעֹלָה
  choice: தகனபலி
  rationale: லேவியராகமத்தில் முழுவதுமாக எரிக்கப்படும் பலியைக் குறிக்கும் עֹלָה என்பதற்கான நிலைபெற்ற, சுருக்கமான தமிழ் வழக்கு.
- source_word: וְנִתַּח
  choice: வெட்ட வேண்டும்
  rationale: பலிக்காக விலங்கைப் பகுதிகளாகப் பிரித்து வெட்டுவதைக் குறிக்கும் வினையின் பொருளை இயல்பாகத் தருகிறது; அடுத்த சொற்றொடர் வெட்டுதலின் விளைவைத் தெளிவுபடுத்துகிறது.
- source_word: לִנְתָחֶיהָ
  choice: அதன் பகுதிகளாக
  rationale: விலங்கைப் பலிக்குரிய தனித்தனி பிரிவுகளாக வெட்டுவதைக் குறிக்கிறது; எபிரெயச் சொற்றொடரின் விளைவு/பகிர்வு சார்ந்த பொருளையும் காக்கிறது.
- source_word: וְ
  choice: பின்பு
  rationale: முந்தைய வசனத்திலிருந்து தொடரும் சடங்கு நடைமுறையின் அடுத்த கட்டத்தை நவீனத் தமிழில் தெளிவாகக் காட்டுகிறது.
