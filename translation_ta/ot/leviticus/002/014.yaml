base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/014.yaml
  text: And if you present to Yahweh an offering of firstfruits, you shall present your offering of firstfruits as fresh heads of grain roasted in the fire, crushed kernels from the fresh grain.
translation:
  language: ta
  text: யாவேக்கு முதல்விளைச்சலின் தானியக் காணிக்கையை நீ செலுத்தினால், நெருப்பில் வறுத்த பசுங்கதிர்களை—புதிய தானியத்திலிருந்து நொறுக்கப்பட்ட தானியத்தை—உன் முதல்விளைச்சல் காணிக்கையாகச் செலுத்த வேண்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִנְחַת
  choice: தானியக் காணிக்கை
  rationale: லேவியராகமம் 2-ன் சூழலில் מִנְחָה தானியத்தால் செலுத்தப்படும் காணிக்கையைக் குறிக்கும் தொழில்நுட்பச் சொல்; பொருளைத் தெளிவுபடுத்தவும் வழிபாட்டுச் சூழலைக் காக்கவும் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: בִּכּוּרִים / בִּכּוּרֶיךָ
  choice: முதல்விளைச்சல்
  rationale: முதலில் பழுத்து அறுவடையாகும் விளைபொருளை இறைவனுக்குச் செலுத்தும் வழிபாட்டுக் கருத்தை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: எபிரெய மூலத்தில் வரும் உடன்படிக்கைப் பெயரான יהוה-ஐ பொதுப்பட்டமாக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אָבִיב
  choice: பசுங்கதிர்கள்
  rationale: முழுமையாக உலராத, புதிய நிலையில் கதிரிலிருக்கும் தானியத்தைச் சுருக்கமாகவும் விவசாயப் படிமத்துடனும் தெரிவிக்கிறது.
- source_word: קָלוּי בָּאֵשׁ
  choice: நெருப்பில் வறுத்த
  rationale: நெருப்பினால் வறுக்கப்பட்ட தயாரிப்பு முறையை நேரடியாகப் பாதுகாக்கிறது.
- source_word: גֶּרֶשׂ
  choice: நொறுக்கப்பட்ட தானிய மணிகள்
  rationale: உடைக்கப்பட்ட அல்லது நொறுக்கப்பட்ட தானியத்தைக் குறிக்கும் சொல்லின் பொருளை வாசகனுக்குத் தெளிவாகக் கூறுகிறது.
- source_word: כַּרְמֶל
  choice: புதிய விளைச்சலின்
  rationale: இங்கு இடப்பெயராக அல்லாமல், புதியதாக விளைந்த அல்லது இன்னும் பசுமையான தானியத்தைக் குறிக்கும் சூழல்சார் பொருள் ஏற்கப்பட்டது.
- source_word: תַּקְרִיב ... תַּקְרִיב
  choice: செலுத்தினால் ... செலுத்த வேண்டும்
  rationale: காணிக்கையை இறைவனிடம் கொண்டுவந்து சமர்ப்பிக்கும் சடங்குச் செயலை இயல்பான தமிழில் தெரிவித்து, மூலத்தின் மீள்வருகையையும் ஓரளவு காக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட இறைப் பெயர் நேரடியாக இருப்பதால், பொதுப்பட்டமான ‘கர்த்தர்’ என்பதற்குப் பதிலாக எபிரெயப் பெயரின் பரவலான தமிழாக்கமான ‘யாவே’ பயன்படுத்தப்பட்டது; ‘யெகோவா’ என்பது பிற்கால கலப்பு உச்சரிப்பை பிரதிபலிக்கிறது.
- issue: אָבִיב גֶּרֶשׂ כַּרְמֶל என்ற தொடரின் உட்பிணைப்பு
  choice: பசுங்கதிர்களையும் புதிய விளைச்சலின் நொறுக்கப்பட்ட தானிய மணிகளையும்
  alternative: நெருப்பில் வறுத்த பசுங்கதிர்களாகிய புதிய விளைச்சலின் நொறுக்கப்பட்ட தானியம்
  rationale: எபிரெயத் தொடரின் சொற்களுக்கு இடையிலான துல்லியமான இலக்கண உறவு சுருக்கமானதும் ஓரளவு தெளிவற்றதுமானது. முதன்மை உரை இயல்பான தமிழில் இரு இணைந்த விளக்கங்களாக வழங்கப்படுகிறது; அடிக்குறிப்பு மாற்று உட்பிணைப்பைச் சுட்டுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமான ஆனால் பொதுவாசகனுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘பசுங்கதிர்கள்’, ‘தானிய மணிகள்’ ஆகியவை விவசாயப் படிமத்தைத் தக்கவைக்கின்றன; தேவையற்ற பழமையான சொற்கள் தவிர்க்கப்பட்டுள்ளன.
