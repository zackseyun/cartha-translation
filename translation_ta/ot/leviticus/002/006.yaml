translation_notes:
  register: நவீன நிலையான தமிழில், பலியிடல் செய்முறைக்கேற்ற நேரடி கட்டளை நடையும் கண்ணியமான வேதாகமப் பதிவும் பயன்படுத்தப்பட்டுள்ளன. ‘பிட்டு’ என்பது உணவுப் பொருளைத் துண்டுகளாக்கும் செயலை இயல்பாகக் குறிக்கிறது.
