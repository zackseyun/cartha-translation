  text: Break it into pieces and pour oil on it[a]; it is a grain offering.
translation:
  language: ta
  text: அதைத் துண்டுகளாக உடைத்து, அதன்மேல் எண்ணெயை ஊற்று[a]; அது தானியக் காணிக்கை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதைச் சிறு பகுதிகளாகப் பிரி.” எண்ணெயை ஊற்றுவதற்கு முன்பு காணிக்கையைச் சிறிய துண்டுகளாக்குவதை எபிரெயச் சொற்றொடர் வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּת֤וֹת אֹתָ/הּ֙ פִּתִּ֔ים
  choice: அதைத் துண்டுகளாகப் பிட்டு
  rationale: פתת என்பதன் வலியுறுத்தப்பட்ட கட்டளை வடிவமும், פתים என்பதன் விளைவாகிய சிறு துண்டுகளும் இயல்பான நவீனத் தமிழில் இவ்வாறு வெளிப்படுகின்றன.
- source_word: וְ/יָצַקְתָּ֥ עָלֶ֖י/הָ
  choice: அதன்மேல் ... ஊற்று
  rationale: பலிக்கான செய்முறை வரிசையில் வரும் இரண்டாம் நபர் ஆண்பால் ஒருமை வினை வடிவத்தின் கட்டளைப் பொருளையும், על என்பதன் ‘மேல்’ உறவையும் காக்கிறது.
- source_word: שָׁ֑מֶן
  choice: எண்ணெய்
  rationale: எபிரெய உரை எண்ணெயின் வகையைத் தனிப்படுத்தாததால் ‘ஒலிவ எண்ணெய்’ என்று கூடுதல் தகவல் சேர்க்கப்படவில்லை.
- source_word: מִנְחָ֖ה
  choice: தானியக் காணிக்கை
  rationale: லேவியராகமம் 2-ன் பலியிடல் சூழலில் מנחה என்பது தானியத்தால் செய்யப்படும் காணிக்கையைக் குறிக்கிறது; ‘தானியக் காணிக்கை’ தெளிவும் சூழல்சார் துல்லியமும் உடையது.
- source_word: הִֽוא
  choice: அது ஒரு
  rationale: முன்னர் விவரிக்கப்பட்ட காணிக்கையைச் சுட்டி அதன் வகையை அடையாளப்படுத்தும் எபிரெய வாக்கிய அமைப்பை நேரடியாகக் காக்கிறது.
