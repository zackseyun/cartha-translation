source:
  edition: WLC
  text: וְ/כִ֥י תַקְרִ֛ב קָרְבַּ֥ן מִנְחָ֖ה מַאֲפֵ֣ה תַנּ֑וּר סֹ֣לֶת חַלּ֤וֹת מַצֹּת֙ בְּלוּלֹ֣ת בַּ/שֶּׁ֔מֶן וּ/רְקִיקֵ֥י מַצּ֖וֹת מְשֻׁחִ֥ים בַּ/שָּֽׁמֶן׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/004.yaml
  text: 'And if you bring near an offering of a grain offering baked in an oven[a], it shall be of fine flour: unleavened cakes mixed with oil, or unleavened wafers anointed with oil.'
translation:
  language: ta
  text: நீ அடுப்பில் சுடப்பட்ட தானியக் காணிக்கையைச் சமர்ப்பித்தால், அது மெல்லிய மாவினால் செய்யப்பட்ட எண்ணெய் கலந்த புளிப்பில்லாத அடைகளாகவோ அல்லது[a] எண்ணெய் பூசப்பட்ட புளிப்பில்லாத மெல்லிய அப்பங்களாகவோ இருக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘மற்றும்.’ இங்கு அடுப்பில் சுடப்பட்ட தானியக் காணிக்கையின் மற்றொரு வடிவம் பட்டியலிடப்படுவதால் ‘அல்லது’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי תַקְרִב
  choice: நீ ... பலியாகக் கொண்டுவந்தால்
  rationale: சட்டவழக்கில் வரும் நிபந்தனையை இயல்பான தமிழில் வெளிப்படுத்துகிறது; קרב என்பதிலுள்ள சமர்ப்பிக்கக் கொண்டுவரும் கருத்தையும் காக்கிறது.
- source_word: קָרְבַּן מִנְחָה
  choice: தானியக் காணிக்கையைப் பலியாக
  rationale: קָרְבַּן என்ற பொதுவான பலிச் சொல்லையும், லேவியராகமம் 2-இல் தானியத்தால் செய்யப்படும் குறிப்பிட்ட מִנְחָה வகையையும் வேறுபடுத்திக் காட்டுகிறது.
- source_word: מַאֲפֵה תַנּוּר
  choice: அடுப்பில் சுடப்பட்ட
  rationale: அடுப்பில் சுடும் தயாரிப்பு முறையைத் தெளிவான நவீன தமிழில் தருகிறது.
- source_word: סֹלֶת
  choice: மெல்லிய மாவு
  rationale: பலிக்குப் பயன்படுத்தப்பட்ட நன்றாக அரைக்கப்பட்ட உயர்தர மாவைக் குறிக்கும் இயல்பான தமிழ் இணைச்சொல்.
- source_word: חַלּוֹת מַצּוֹת בְּלוּלֹת בַּשֶּׁמֶן
  choice: எண்ணெய் கலக்கப்பட்ட புளிப்பில்லாத அடைகள்
  rationale: חַלּוֹת என்பதன் அடை/அப்ப வகையையும், மாவில் எண்ணெய் கலக்கப்பட்ட நிலையையும் தெளிவாகக் கூறுகிறது.
- source_word: וּרְקִיקֵי מַצּוֹת
  choice: அல்லது புளிப்பில்லாத மெல்லிய தட்டுகள்
  rationale: רְקִיקִים என்பவை மெல்லிய அப்பத் தட்டுகள்; இணைப்புச்சொல் இங்கு அனுமதிக்கப்பட்ட மற்றொரு வடிவத்தைப் பட்டியலிடுவதால் தமிழில் ‘அல்லது’ எனத் தரப்பட்டுள்ளது.
- source_word: מְשֻׁחִים בַּשָּׁמֶן
  choice: எண்ணெய் பூசப்பட்ட
  rationale: உணவுப் பொருளின் மேற்பரப்பில் எண்ணெயைப் பூசுவதே இங்குள்ள நடைமுறைப் பொருள்; ‘அபிஷேகம்’ என்ற தேவையற்ற சமயச் சாயலைத் தவிர்க்கிறது.
theological_decisions:
- issue: பலிவழக்கில் מִנְחָה என்பதன் பொருள்
  choice: தானியக் காணிக்கை
  alternative: காணிக்கை / திறை
  rationale: பிற சூழல்களில் இச்சொல் பொதுவான பரிசையோ திறையையோ குறிக்கலாம்; ஆனால் லேவியராகமம் 2-இல் மாவும் எண்ணெயும் கொண்ட தனிப்பட்ட பலிவகை தெளிவாகக் குறிக்கப்படுகிறது.
- issue: וּרְקִיקֵי என்பதில் உள்ள וְ இணைப்பின் உறவு
  choice: அல்லது
  alternative: மற்றும்
  rationale: எபிரெயச் சொல் வடிவில் ‘மற்றும்’ இருந்தாலும், அடுப்பில் சுடப்பட்ட காணிக்கையின் இரு மாற்று வடிவங்கள் பட்டியலிடப்படுகின்றன. இந்த விளக்கத்தை உரையில் இயல்பாகக் காட்டி, மூலத்தின் சொற்படி வடிவத்தை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘போஜனபலி,’ ‘அபிஷேகம் செய்யப்பட்ட’ போன்ற பழைய அல்லது இச்சூழலில் தவறாகப் புரிந்துகொள்ளக்கூடிய சமயச் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
