  text: And you shall put oil on it[a], and place frankincense on it; it is a grain offering.
translation:
  language: ta
  text: அதன்மேல் எண்ணெயை வைக்க வேண்டும்; அதன்மேல் குங்கிலியத்தை வைக்க வேண்டும்; அது தானியக் காணிக்கை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנָתַתָּ
  choice: ஊற்றி
  rationale: נתן என்பது பொதுவாக ‘கொடு, வை’ எனப் பொருள்படும்; இங்கு எண்ணெயை ஒரு காணிக்கையின்மேல் இடும் சடங்குச் சூழலில் இயல்பான நவீனத் தமிழாக ‘ஊற்றி’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: עָלֶיהָ
  choice: அதன்மேல்
  rationale: על மற்றும் மூன்றாம் நபர் பெண்பால் ஒருமை பின்னொட்டு, முன்பு விவரிக்கப்பட்ட காணிக்கையின்மேல் இடப்படுவதைக் குறிக்கின்றன.
- source_word: שֶׁמֶן
  choice: எண்ணெய்
  rationale: எபிரெயச் சொல் பொதுவாக எண்ணெயைக் குறிக்கிறது. சடங்குச் சூழலில் ஒலிவ எண்ணெயாக இருக்கலாம் என்றாலும், மூலத்தில் ‘ஒலிவ’ என்று இல்லை.
- source_word: וְשַׂמְתָּ
  choice: வைக்க வேண்டும்
  rationale: שׂים என்பது ‘வை, இடு’ எனப் பொருள்படும். சட்ட/சடங்கு அறிவுறுத்தலின் கட்டளை வலிமையைத் தமிழில் இயல்பாக வெளிப்படுத்த ‘வைக்க வேண்டும்’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
- source_word: לְבֹנָה
  choice: சாம்பிராணி
  rationale: לבנה என்பது பொதுவான தூபப்பொருளை அல்ல, குறிப்பாக frankincense-ஐக் குறிக்கிறது; தமிழில் வழக்கமான பெயர் ‘சாம்பிராணி’.
- source_word: מִנְחָה
  choice: தானியக் காணிக்கை
  rationale: லேவியராகமத்தின் பலிச்சட்டச் சூழலில் מנחה என்பது பொதுவான பரிசையல்ல, தானியத்தால் செய்யப்படும் காணிக்கையைக் குறிக்கிறது.
- source_word: הִוא
  choice: அது
  rationale: இப்பொழுது விவரிக்கப்பட்ட பொருளையே எளிய பயனிலை வாக்கியமாக அடையாளப்படுத்தும் எபிரெயப் பெண்பால் ஒருமைப் பதிற்பெயரின் இயல்பான தமிழ் வடிவம்.
