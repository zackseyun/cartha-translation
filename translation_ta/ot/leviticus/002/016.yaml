  source_fidelity: 'மூலத்தின் முக்கிய கூறுகள் தக்கவைக்கப்பட்டுள்ளன: ஆசாரியன், தானியத்திலிருந்தும் எண்ணெயிலிருந்தும் எடுக்கப்படும் நினைவுப் பகுதி, குங்கிலியம் முழுவதும், யாவேக்கு உரிய நெருப்புப் படையல். இருப்பினும், ‘எடுக்கப்பட்ட நினைவுப் பகுதி’ என்ற பெயரெச்சத் தொடர் தமிழில் எதிலிருந்து எடுக்கப்படுகிறது என்பதுடன் சற்றே தளர்வாக இணைகிறது; செயலை வெளிப்படையாக அமைத்தல் மூலத்தின் מן அமைப்பைத் தெளிவாக்கும்.'
  naturalness: நடை பொதுவாக நவீன நிலையான தமிழுக்கு ஏற்றது. ஆயினும் ‘புகையெழ எரிக்க வேண்டும்’ என்பதற்குப் பதிலாக ‘எரித்துப் புகையாக்க வேண்டும்’ என்பது சடங்குச் சூழலில் இயல்பாகவும் துல்லியமாகவும் உள்ளது. இறுதி அப்போசிஷன் வாக்கியத்தைத் தனி வாக்கியமாக்குவது வாசிப்பைத் தெளிவாக்குகிறது.
  terminology: ‘ஆசாரியன்,’ ‘நினைவுப் பகுதி,’ ‘குங்கிலியம்,’ ‘யாவே’ ஆகியவை பொருத்தமானவை. אִשֶּׁה என்பதற்கு ‘நெருப்பினால் செலுத்தப்படும் படையல்’ என்பது நெருப்பின் மூலம் அர்ப்பணிக்கப்படுதல் என்ற தொழில்நுட்பப் பொருளை இன்னும் தெளிவாகக் காட்டுகிறது.
