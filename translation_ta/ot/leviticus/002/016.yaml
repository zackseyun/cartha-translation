- from: 'ஆசாரியன் அதன் நொறுக்கப்பட்ட தானியத்திலிருந்தும்[a] அதன் எண்ணெயிலிருந்தும் எடுக்கப்பட்ட நினைவுப் பகுதியை, அதன் குங்கிலியம் முழுவதோடும் சேர்த்து, புகையெழ எரிக்க வேண்டும். அது யாவேக்குச் செலுத்தப்படும் நெருப்புப் படையல்.


    [a] “நொறுக்கப்பட்ட தானியம்” என்பதை “உடைக்கப்பட்ட தானிய மணிகள்” அல்லது “முரடாக அரைக்கப்பட்ட தானியம்” என்றும் மொழிபெயர்க்கலாம். தானியப் படையலுக்காகத் தயாரிக்கப்பட்ட நொறுக்கப்பட்ட தானிய மணிகளையே எபிரெயச் சொல் குறிக்கிறது.'
  to: ஆசாரியன் அதன் நொறுக்கப்பட்ட தானியத்திலிருந்தும்[a] அதன் எண்ணெயிலிருந்தும் அதன் நினைவுப் பகுதியை எடுத்து, அதன் குங்கிலியம் முழுவதோடும் சேர்த்து எரித்துப் புகையாக்க வேண்டும். இது யாவேக்கு நெருப்பினால் செலுத்தப்படும் படையல்.
  rationale: திருத்தம் பொருளை மாற்றாமல், நினைவுப் பகுதி தானியத்திலிருந்தும் எண்ணெயிலிருந்தும் எடுக்கப்படுவதைத் தெளிவாக்குகிறது. குங்கிலியம் ‘முழுவதும்’ சேர்க்கப்படுவதும், நெருப்பினால் யாவேக்கு அர்ப்பணிக்கப்படும் படையல் என்பதும் காக்கப்பட்டுள்ளன. அடிக்குறிப்பு குறியீடு அதே மூலச்சொல்லில் நிலைநிறுத்தப்பட்டுள்ளது.
