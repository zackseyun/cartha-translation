base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/016.yaml
  text: And the priest shall burn its memorial portion from its crushed grain and from its oil[a], with all its frankincense—an offering made by fire to Yahweh.
translation:
  language: ta
  text: ஆசாரியன் அதன் நொறுக்கப்பட்ட தானியத்திலிருந்தும்[a] அதன் எண்ணெயிலிருந்தும் அதன் நினைவுப் பகுதியை எடுத்து, அதன் குங்கிலியம் முழுவதோடும் சேர்த்து எரித்துப் புகையாக்க வேண்டும். இது யாவேக்கு நெருப்பினால் செலுத்தப்படும் படையல்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நொறுக்கப்பட்ட தானியம்” என்பதை “உடைக்கப்பட்ட தானிய மணிகள்” அல்லது “முரடாக அரைக்கப்பட்ட தானியம்” என்றும் மொழிபெயர்க்கலாம். தானியப் படையலுக்காகத் தயாரிக்கப்பட்ட நொறுக்கப்பட்ட தானிய மணிகளையே எபிரெயச் சொல் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְטִיר
  choice: புகையெழ எரிக்க வேண்டும்
  rationale: பலியிடும் சூழலில் קטר என்பதன் Hiphil வடிவம், பலிபீடத்தின்மேல் படையலை எரித்து அது புகையாக எழும்பச் செய்வதைக் குறிக்கிறது. இத்தமிழாக்கம் சடங்கு சார்ந்த புகை உருவகத்தையும் இயல்பான நடையையும் காக்கிறது.
- source_word: הַכֹּהֵן
  choice: ஆசாரியன்
  rationale: כהן என்பதற்குப் பலியிடும் வழிபாட்டுச் சூழலில் தெளிவான, நிலைபெற்ற தமிழ்ச் சொல்.
- source_word: אַזְכָּרָתָהּ
  choice: அதன் நினைவுப் பகுதி
  rationale: தானியப் படையலின் சார்பாகப் பலிபீடத்தில் எரிக்கப்படும் குறிப்பிட்ட பகுதியைக் குறிக்கும் தொழில்நுட்பச் சொல்லாக אזכרה வருகிறது. “நினைவுப் பகுதி” அதன் நினைவூட்டும் செயலையும் அது முழுப் படையல் அல்ல, ஒரு பகுதி என்பதையும் காக்கிறது.
- source_word: מִגִּרְשָׂהּ
  choice: அதன் நொறுக்கப்பட்ட தானியத்திலிருந்து
  rationale: גרש என்பது நொறுக்கப்பட்ட அல்லது முரடாக அரைக்கப்பட்ட தானிய மணிகளைக் குறிக்கிறது. “நொறுக்கப்பட்ட தானியம்” நவீன வாசகருக்குப் புரியக்கூடியது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: וּמִשַּׁמְנָהּ
  choice: அதன் எண்ணெயிலிருந்து
  rationale: מן என்ற முன்னிடைச்சொல், நினைவுப் பகுதி தானியத்திலிருந்தும் எண்ணெயிலிருந்தும் எடுக்கப்படுவதைச் சுட்டுகிறது; மூலத்தின் இணையான அமைப்பு தமிழிலும் காக்கப்பட்டுள்ளது.
- source_word: עַל כָּל לְבֹנָתָהּ
  choice: அதன் குங்கிலியம் முழுவதோடும் சேர்த்து
  rationale: 'இங்கு על உடன் நிகழ்வதைக் குறிக்கிறது: நினைவுப் பகுதி குங்கிலியம் முழுவதோடும் சேர்த்து எரிக்கப்படுகிறது. “குங்கிலியம்” frankincense-ஐக் குறிக்கும் துல்லியமான தமிழ்ச் சொல்.'
- source_word: אִשֶּׁה
  choice: நெருப்புப் படையல்
  rationale: אשה என்பது நெருப்பின்மூலம் செலுத்தப்படும் பலிக்குரிய வழக்குச் சொல். “நெருப்புப் படையல்” சுருக்கமாகவும், அதை வெறும் உணவுப் படையலாகத் தவறாகப் புரிந்துகொள்ளாதவாறும் உள்ளது.
- source_word: לַיהוָה
  choice: யாவேக்குச் செலுத்தப்படும்
  rationale: ל அர்ப்பணிப்பின் நோக்கத்தையும் திசையையும் குறிக்கிறது. “செலுத்தப்படும்” என்பது படையல் யாவேக்கே உரியது என்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலவசனத்தில் நான்கெழுத்து இறைப்பெயர் நேரடியாக உள்ளது. பொதுப்பட்டத்தை மாற்றாக இடாமல், சீனாயில் வெளிப்படுத்தப்பட்ட உடன்படிக்கைப் பெயரைத் தமிழில் “யாவே” என ஒலிபெயர்த்துள்ளது.
- issue: אַזְכָּרָה என்பதிலுள்ள ‘நினைவு’ கருத்து
  choice: நினைவுப் பகுதி
  alternative: நினைவுப் படையல்
  rationale: இங்கு முழுப் படையலைவிட அதிலிருந்து எடுத்து எரிக்கப்படும் பிரதிநிதித்துவப் பகுதியே குறிக்கப்படுகிறது. இந்த நினைவு யாருடைய மனத்தில் எவ்வாறு செயல்படுகிறது என்பதை வசனம் விளக்காததால், அந்த இறையியல் தெளிவின்மை தீர்க்கப்படாமல் காக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்குப் புரியும் வகையிலும் வழிபாட்டுச் சட்டத்திற்கேற்ற கண்ணியமான நடையிலும் அமைக்கப்பட்டுள்ளது. எபிரெய மூலத்திலுள்ள ‘தானியத்திலிருந்தும் எண்ணெயிலிருந்தும்’ என்ற இணை அமைப்பும், குங்கிலியம் முழுவதும் சேர்க்கப்படுவது என்ற வலியுறுத்தலும் காக்கப்பட்டுள்ளன.
