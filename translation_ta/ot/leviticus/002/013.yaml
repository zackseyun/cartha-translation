base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/013.yaml
  text: And every offering of your grain offering you shall season with salt[a]. You shall not let the salt of the covenant of your God be lacking from your grain offering[c][b]; with all your offerings you shall offer salt.
translation:
  language: ta
  text: நீ செலுத்தும் ஒவ்வொரு தானியக் காணிக்கையிலும் உப்புச் சேர்க்க வேண்டும்.[a] உன் கடவுளின் உடன்படிக்கையின் உப்பு உன் தானியக் காணிக்கையில் இல்லாமல் போக விடாதே.[b] நீ செலுத்தும் ஒவ்வொரு காணிக்கையோடும் உப்பைப் படைக்க வேண்டும்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: ‘உப்பால் உப்பிட வேண்டும்.’'
    reason: lexical_alternative
  - marker: b
    text: ‘உன் கடவுளின் உடன்படிக்கையின் உப்பு’ என்பது உடன்படிக்கையோடு தொடர்புடைய பலிவழிபாட்டுச் சொற்றொடர்; அதன் அடையாளப் பொருளை வசனம் இங்கே விளக்கவில்லை.
    reason: cultural_note
  - marker: c
    text: 'அல்லது: ‘உன் ஒவ்வொரு காணிக்கையின்மேலும் உப்பைப் படைக்க வேண்டும்.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְבַּן
  choice: காணிக்கை
  rationale: பலியிடும் சூழலில் கடவுளிடம் கொண்டுவரப்படும் பொருளைக் குறிக்கும் பரந்த சொல்; நவீன தமிழில் இயல்பாகவும் மரியாதையான நடையிலும் உள்ளது.
- source_word: מִנְחָה
  choice: தானியக் காணிக்கை
  rationale: லேவியராகமம் 2-இல் இது குறிப்பாகத் தானியத்தால் செய்யப்படும் காணிக்கையைக் குறிக்கிறது; பொதுவான ‘காணிக்கை’ என்பதைக் காட்டிலும் வழிபாட்டுச் சிறப்பைத் தக்கவைக்கிறது.
- source_word: בַּמֶּלַח תִּמְלָח
  choice: உப்புச் சேர்க்க வேண்டும்
  rationale: எபிரெயத்தில் ‘உப்பால் உப்பிடு’ என்ற சொல் மீளுருவாக்கம் உள்ளது. அதன் கட்டாயத்தன்மையைத் தக்கவைத்து, இயல்பான நவீன தமிழில் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: תַשְׁבִּית
  choice: இல்லாமற்போக விடாதே
  rationale: இங்கு ‘நீக்கிவிடுதல், இல்லாமல் செய்தல், தவிர்த்தல்’ என்ற பொருள்; தடை வடிவத்தைத் தெளிவாகத் தருகிறது.
- source_word: מֶלַח בְּרִית אֱלֹהֶיךָ
  choice: உன் கடவுளுடைய உடன்படிக்கையின் உப்பு
  rationale: மூலத்தின் உடன்படிக்கை சார்ந்த உருவகத்தை விளக்கிப் பரப்பாமல், அதன் சொற்றொடரையும் இறையியல் அழுத்தத்தையும் நேரடியாகத் தக்கவைக்கிறது.
- source_word: עַל כָּל קָרְבָּנְךָ
  choice: நீ செலுத்தும் ஒவ்வொரு காணிக்கையோடும்
  rationale: עַל என்பதன் அடிப்படைப் பொருள் ‘மேல்’ என்றாலும், இச்சூழலில் உப்பு ஒவ்வொரு காணிக்கைக்கும் உடன்சேர வேண்டும் என்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: תַּקְרִיב
  choice: படைக்க வேண்டும்
  rationale: קרב என்பதன் ஹிபில் வடிவம் பலியிடும் சூழலில் கடவுளிடம் கொண்டுவந்து செலுத்துவதைக் குறிக்கிறது; ‘படைக்க’ என்பது அச்செயலை வழிபாட்டு நடையில் வேறுபடுத்திக் காட்டுகிறது.
theological_decisions:
- issue: ‘உன் கடவுளுடைய உடன்படிக்கையின் உப்பு’ என்ற உடன்படிக்கைச் சொற்றொடரை விளக்கவுரையாக மாற்ற வேண்டுமா?
  choice: மூலத்தின் உருவகச் சொற்றொடரை முதன்மை உரையில் அப்படியே தக்கவைத்தல்
  alternative: உன் கடவுளுடைய உடன்படிக்கையை அடையாளப்படுத்தும் உப்பு
  rationale: இந்த வசனம் உப்பின் அடையாளப் பொருளைத் தானாக விளக்கவில்லை. ஆகவே அதன் வழிபாட்டு உருவகத்தையும் இறையியல் திறந்தநிலையையும் மொழிபெயர்ப்பு தீர்த்துவிடாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கட்டளைச் சட்டத்தின் கண்ணியமான நடையைப் பேணும் வகையில் ‘வேண்டும்’ மற்றும் நேரடித் தடை வடிவம் பயன்படுத்தப்பட்டுள்ளன. ‘தானியக் காணிக்கை’ வழிபாட்டுச் சிறப்பைத் தெளிவாக்குகிறது; ‘உடன்படிக்கையின் உப்பு’ என்ற திட்டமிட்டுச் சற்றுக் கடினமான மூல உருவகம் எளிமைப்படுத்தப்படவில்லை.
