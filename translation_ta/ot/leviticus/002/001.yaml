id: LEV.2.1
reference: Leviticus 2:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/נֶ֗פֶשׁ כִּֽי תַקְרִ֞יב קָרְבַּ֤ן מִנְחָה֙ לַֽ/יהוָ֔ה סֹ֖לֶת יִהְיֶ֣ה קָרְבָּנ֑/וֹ וְ/יָצַ֤ק עָלֶ֨י/הָ֙ שֶׁ֔מֶן וְ/נָתַ֥ן עָלֶ֖י/הָ לְבֹנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/001.yaml
  text: When a person presents a grain offering to Yahweh[a], his offering shall be of fine flour[b], and he shall pour oil on it and put frankincense on it.
translation:
  language: ta
  text: ஒருவர் யாவேக்கு[a] தானியக் காணிக்கையை[b] சமர்ப்பிக்கும்போது, அவரது காணிக்கை நன்றாக அரைக்கப்பட்ட மாவாக இருக்க வேண்டும். அவர் அதன்மேல் எண்ணெயை ஊற்றி, அதன்மேல் குங்கிலியத்தை வைக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘யாவே’ என்பது எபிரெய மொழியில் יהוה (YHWH) என எழுதப்படும் இறைவனுடைய தனிப்பெயர்.
    reason: divine_name
  - marker: b
    text: ‘தானியக் காணிக்கை’ என்பது எபிரெய מִנְחָה என்பதன் இச்சூழலுக்குரிய மொழிபெயர்ப்பு; இங்கே அது நன்றாக அரைக்கப்பட்ட மாவினால் செய்யப்படுகிறது.
    reason: cultural_note
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: ஒருவர்
  rationale: இந்தச் சட்டச் சூழலில் இச்சொல் ‘ஆத்துமா’ என்ற தனிப்பட்ட பொருளில் அல்ல, காணிக்கை செலுத்தும் தனிநபரைக் குறிக்கிறது. ‘ஒருவர்’ பிரதிநிதித்துவ ஒருமையையும் இயல்பான நவீன தமிழையும் காக்கிறது.
- source_word: תַקְרִיב
  choice: செலுத்தும்போது
  rationale: קרב என்பதன் ஹிஃபில் வடிவம் காணிக்கையை இறைவனிடம் கொண்டுவந்து சமர்ப்பிப்பதைக் குறிக்கிறது. பலியாராதனைச் சூழலில் ‘காணிக்கையைச் செலுத்துதல்’ தெளிவான, இயல்பான தமிழ்.
- source_word: קָרְבַּן
  choice: காணிக்கை
  rationale: இறைவனிடம் கொண்டுவந்து சமர்ப்பிக்கப்படும் பொருளைக் குறிக்கும் பொதுவான பலியியல் சொல்; தமிழில் ‘காணிக்கை’ தெளிவாகவும் பரவலாகவும் புரியும்.
- source_word: מִנְחָה
  choice: தானியக் காணிக்கை
  rationale: லேவியராகமத்தின் இந்தப் பலியியல் சூழலில் இது பொதுவான அன்பளிப்பை அல்ல, மாவு அல்லது தானியப் பொருட்களால் செய்யப்படும் காணிக்கையைக் குறிக்கிறது.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: எபிரெய மூலத்தில் உள்ள உடன்படிக்கைப் பெயரான יהוה ஒலிபெயர்க்கப்பட்டுள்ளது; ל முன்னொட்டின் திசைப்பொருள் ‘-க்கு’ எனக் காக்கப்பட்டுள்ளது.
- source_word: סֹלֶת
  choice: நன்றாக அரைக்கப்பட்ட மாவு
  rationale: காணிக்கைக்குப் பயன்படுத்தப்பட்ட நுண்ணிய, தரமான மாவைக் குறிக்கிறது. பழமையான அல்லது தெளிவற்ற தொழில்சொல்லைவிட இச்சொற்றொடர் சாதாரண வாசகருக்கு உடனடியாகப் புரியும்.
- source_word: יִהְיֶה קָרְבָּנוֹ
  choice: அவரது காணிக்கை ... மாவாக இருக்க வேண்டும்
  rationale: எபிரெய வாக்கியத்தின் உடைமை ஒருமையையும், காணிக்கையின் தன்மையை விதிக்கும் சட்ட நடையையும் காக்கிறது.
- source_word: וְיָצַק עָלֶיהָ שֶׁמֶן
  choice: அவர் அதன்மேல் எண்ணெயை ஊற்றி
  rationale: எண்ணெயை மாவின்மேல் ஊற்றும் செயலை நேரடியாகக் காட்டுகிறது; தொடரும் கட்டளையுடன் இயல்பான தமிழ் வாக்கியமாக இணைக்கப்பட்டுள்ளது.
- source_word: וְנָתַן עָלֶיהָ לְבֹנָה
  choice: சாம்பிராணியை வைக்க வேண்டும்
  rationale: לְבֹנָה என்பது வழிபாட்டில் பயன்படுத்தப்பட்ட நறுமணப் பிசினான frankincense. ‘சாம்பிராணி’ நவீன தமிழில் எளிதில் அறியப்படும் இணைச்சொல்; ‘அதன்மேல்’ என்பது முந்தைய இணைச்செயலுக்கும் இதற்கும் பொருந்துகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரை பொதுப்பட்டத்தை அல்ல, நான்கு எழுத்துகளைக் கொண்ட தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. ‘யாவே’ என்பதால் உடன்படிக்கைப் பெயர் மறைக்கப்படாமல் காக்கப்படுகிறது.
- issue: சட்ட அறிவுறுத்தலில் உள்ள ஒருமை மற்றும் பாலினக் குறிப்பு
  choice: ஒருவர் ... அவரது ... அவர்
  alternative: ஒருவன் ... அவனது ... அவன்
  rationale: மூலத்தின் பிரதிநிதித்துவ ஒருமை காக்கப்படுகிறது. தமிழில் ‘ஒருவர்/அவர்’ ஒருமையைத் தெளிவாக வைத்தபடியே தேவையற்ற ஆண்பால் வரையறையைத் தவிர்க்கிறது; נֶפֶשׁ இங்கு எந்த ஒரு தனிநபரையும் குறிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான சட்ட-வழிபாட்டு நடை பயன்படுத்தப்பட்டுள்ளது. ‘நைசான மாவு’ போன்ற பழைய வழக்குகளுக்குப் பதிலாக ‘நன்றாக அரைக்கப்பட்ட மாவு’ என்றும், பிரதிநிதித்துவ ஒருமைக்காக ‘ஒருவர்/அவர்’ என்றும் வழங்கப்பட்டுள்ளது.
