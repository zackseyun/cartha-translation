- from: ஒருவர் யாவேக்கு[a] தானியக் காணிக்கையை[b] செலுத்தும்போது, அவரது காணிக்கை நன்றாக அரைக்கப்பட்ட மாவாக இருக்க வேண்டும். அவர் அதன்மேல் எண்ணெயை ஊற்றி, சாம்பிராணியை வைக்க வேண்டும்.
