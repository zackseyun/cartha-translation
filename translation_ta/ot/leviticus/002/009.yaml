source:
  edition: WLC
  text: וְ/הֵרִ֨ים הַ/כֹּהֵ֤ן מִן הַ/מִּנְחָה֙ אֶת אַזְכָּ֣רָתָ֔/הּ וְ/הִקְטִ֖יר הַ/מִּזְבֵּ֑חָ/ה אִשֵּׁ֛ה רֵ֥יחַ נִיחֹ֖חַ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/009.yaml
  text: Then the priest shall lift up from the grain offering its memorial portion and burn it on the altar[a], a food offering, a pleasing aroma to Yahweh.
translation:
  language: ta
  text: பின்பு ஆசாரியன் தானியக் காணிக்கையிலிருந்து அதன் நினைவுப் பகுதியை எடுத்து, பலிபீடத்தின் மேல் புகையெழ எரிக்க வேண்டும்; அது யெகோவாவுக்கு நெருப்புக் காணிக்கையாகவும் இனிய மணமாகவும் இருக்கும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யெகோவாவுக்கு இனிய மணமுள்ள உணவுக் காணிக்கை.”
    reason: அִשֶּׁה என்பதன் பொருள் விவாதத்திற்குரியது. இது பொதுவாக நெருப்பின் மூலம் செலுத்தப்படும் காணிக்கையைக் குறிக்கும்; ஆசாரியச் சூழலில் ‘உணவுக் காணிக்கை’ என்ற புரிதலும் முன்வைக்கப்படுகிறது.
lexical_decisions:
- source_word: וְהֵרִים
  choice: எடுத்து
  rationale: ரום என்பதன் ஹிஃபில் வடிவம் இங்கு காணிக்கையின் ஒரு பகுதியை எடுத்துப் பிரிக்கும் சடங்குச் செயலைக் குறிக்கிறது. இயல்பான நவீனத் தமிழில் ‘எடுத்து’ அந்தச் செயலைத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: הַכֹּהֵן
  choice: ஆசாரியன்
  rationale: இஸ்ரவேலின் பலிச் சடங்குச் சூழலில் כֹּהֵן என்பதற்கான தெளிவான, வழக்கமான தமிழ்ச் சொல்.
- source_word: מִן הַמִּנְחָה
  choice: தானியக் காணிக்கையிலிருந்து
  rationale: லேவியராகமம் 2-இல் מִנְחָה குறிப்பாகத் தானியத்தால் செய்யப்படும் காணிக்கையைக் குறிக்கிறது.
- source_word: אַזְכָּרָתָהּ
  choice: அதன் நினைவுப்பகுதி
  rationale: முழுக் காணிக்கையையும் அல்லாமல், பலிபீடத்தில் எரிக்கப்படும் பிரதிநிதித்துவப் பகுதியைக் குறிக்கும் சடங்குசார் பொருளை ‘நினைவுப்பகுதி’ சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: וְהִקְטִיר
  choice: புகையெழ எரிக்க வேண்டும்
  rationale: கטר என்பதன் ஹிஃபில் வடிவம் பலிபீடத்தில் எரித்துப் புகையாக்கும் செயலைக் குறிக்கிறது; ‘புகையெழ எரிக்க’ என்பது அதன் நுண்ணிய பொருளையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הַמִּזְבֵּחָה
  choice: பலிபீடத்தின்மேல்
  rationale: திசையைக் குறிக்கும் வடிவம் இச்சடங்கு வழக்கில் பலிபீடத்தின் மேல் செய்யப்படும் செயலைக் குறிக்கிறது.
- source_word: אִשֵּׁה
  choice: நெருப்பில் செலுத்தப்படும் காணிக்கை
  rationale: இந்தச் சொல்லின் சொற்பிறப்பும் சடங்குச் சூழலும் நெருப்பின் மூலம் செலுத்தப்படும் காணிக்கையைச் சுட்டுகின்றன. ‘உணவுக் காணிக்கை’ என்ற சாத்தியமான புரிதல் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- source_word: רֵיחַ נִיחֹחַ
  choice: இனிய மணமுள்ள
  rationale: நிலையான பலிச் சொற்றொடரின் மணம் மற்றும் ஏற்றுக்கொள்ளப்படுதல் ஆகிய கருத்துகளை, கூடுதல் இறையியல் விளக்கம் சேர்க்காமல் இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: לַיהוָה
  choice: யெகோவாவுக்கு
  rationale: எபிரெய மூலத்தில் உள்ள தனிப்பெயரைப் பொதுப்பட்டமான ‘ஆண்டவர்’ என்று மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட வடிவில் தருகிறது.
theological_decisions:
- issue: אִשֵּׁה רֵיחַ נִיחֹחַ என்ற பலிச் சொற்றொடரின் மொழிபெயர்ப்பு
  choice: யெகோவாவுக்கு இனிய மணமுள்ள நெருப்பில் செலுத்தப்படும் காணிக்கை
  alternative: யெகோவாவுக்கு இனிய மணமுள்ள உணவுக் காணிக்கை
  rationale: אִשֵּׁה என்பதன் துல்லியமான நுண்பொருள் விவாதத்திற்குரியது. முதன்மை உரை நெருப்பின் மூலம் காணிக்கை செலுத்தப்படுவதை நேரடியாக வைத்திருக்கிறது; ஆசாரிய நூல்களில் காணப்படும் ‘உணவு’ உருவகப் புரிதலை அடிக்குறிப்பு பாதுகாக்கிறது. ‘இனிய மணம்’ என்ற மனிதவுருவகச் சொற்றொடரும் விளக்கி மழுப்பப்படாமல் வைக்கப்பட்டுள்ளது.
- issue: יהוה என்ற இறைப்பெயரின் வெளிப்பாடு
  choice: யெகோவா
  alternative: ஆண்டவர்
  rationale: மூல உரையில் தனிப்பெயர் இருப்பதால் அதை பொதுப்பட்டமாக மாற்றாமல் வெளிப்படையாகத் தருவது உரையின் வேறுபாட்டைப் பாதுகாக்கிறது; தமிழில் வாசகர்களுக்கு அறிமுகமான வடிவம் தேர்ந்தெடுக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், சடங்கின் தனித்துவத்தைப் பாதுகாக்கும் எளிய ஆனால் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘நினைவுப்பகுதி’ போன்ற தொழில்நுட்பச் சொல் சூழலால் புரிந்துகொள்ளத்தக்கவாறு வைக்கப்பட்டுள்ளது; வாக்கிய அமைப்பு சாதாரண வாசகருக்காகச் சுருக்கமாக உள்ளது.
