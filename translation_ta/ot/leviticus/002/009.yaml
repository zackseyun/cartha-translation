revisions:
- from: பின்பு ஆசாரியன் தானியக் காணிக்கையிலிருந்து அதன் நினைவுப்பகுதியை எடுத்துப் பலிபீடத்தின்மேல் புகையெழ எரிக்க வேண்டும். அது யெகோவாவுக்கு இனிய மணமுள்ள நெருப்பில் செலுத்தப்படும் காணிக்கை[a].
  to: பின்பு ஆசாரியன் தானியக் காணிக்கையிலிருந்து அதன் நினைவுப் பகுதியை எடுத்து, பலிபீடத்தின் மேல் புகையெழ எரிக்க வேண்டும்; அது யெகோவாவுக்கு நெருப்புக் காணிக்கையாகவும் இனிய மணமாகவும் இருக்கும்.[a]
