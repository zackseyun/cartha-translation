revisions:
- from: தானியக் காணிக்கையில் மீதியானது ஆரோனுக்கும் அவன் மகன்களுக்கும் உரியது. யாவேக்கு நெருப்பில் செலுத்தப்படும் காணிக்கைகளில்[a] அது மகா பரிசுத்தமான பங்கு.
  to: தானியக் காணிக்கையில் மீதியானது ஆரோனுக்கும் அவன் மகன்களுக்கும் உரியது. யாவேக்குச் செலுத்தப்படும் நெருப்புக் காணிக்கைகளில்[a] அது மிகப் பரிசுத்தமான பங்கு.
