source:
  edition: WLC
  text: וְ/הַ/נּוֹתֶ֨רֶת֙ מִן הַ/מִּנְחָ֔ה לְ/אַהֲרֹ֖ן וּ/לְ/בָנָ֑י/ו קֹ֥דֶשׁ קָֽדָשִׁ֖ים מֵ/אִשֵּׁ֥י יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/003.yaml
  text: And what is left of the grain offering shall be for Aaron and for his sons[a], a most holy portion from the food offerings of Yahweh.
translation:
  language: ta
  text: தானியக் காணிக்கையில் மீதியானது ஆரோனுக்கும் அவன் மகன்களுக்கும் உரியது. யாவேக்குச் செலுத்தப்படும் நெருப்புக் காணிக்கைகளில்[a] அது மிகப் பரிசுத்தமான பங்கு.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேயின் உணவுக் காணிக்கைகளில்.”
    reason: אִשֶּׁה என்பது நெருப்பில் செலுத்தப்படும் காணிக்கையையோ, கடவுளுக்குரிய ‘உணவுக் காணிக்கை’ என்ற பலிசார் வகையையோ குறிக்கக்கூடிய தொழில்நுட்பச் சொல்.
lexical_decisions:
- source_word: וְהַנּוֹתֶרֶת
  choice: மீதியானது
  rationale: குறிப்பிட்ட வினையெச்ச வடிவம் காணிக்கையில் எஞ்சிய பகுதியைக் குறிக்கிறது; ‘மீதியானது’ இயல்பான நவீனத் தமிழில் அந்தப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: מִן הַמִּנְחָה
  choice: தானியக் காணிக்கையில்
  rationale: லேவியராகமம் 2-இன் சூழலில் מִנְחָה பொதுவான அன்பளிப்பை அல்ல, தானியத்தால் செய்யப்படும் காணிக்கையைக் குறிக்கிறது. ‘காணிக்கையில்’ என்பது மீதியான பகுதி அதிலிருந்து வருவதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: ஆரோனுக்கும் அவன் மகன்களுக்கும் உரியது
  rationale: לְ இங்கு ஒதுக்கீடு அல்லது உரிமையைக் குறிக்கிறது; ‘உரியது’ அந்த ஆசாரியப் பங்கைத் தெளிவுபடுத்துகிறது.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: மகா பரிசுத்தமான பங்கு
  rationale: இந்த எபிரெயச் செறிவுமுறை மிக உயர்ந்த பரிசுத்த நிலையைச் சுட்டுகிறது. ‘பங்கு’ என்பது இங்கு காணிக்கையின் மீதிப் பகுதியே குறிப்பிடப்படுவதைத் தெளிவாக்குகிறது; இதை ஆலயத்தின் ‘மகா பரிசுத்த இடம்’ என்று தவறாகப் புரிந்துகொள்வதையும் தவிர்க்கிறது.
- source_word: מֵאִשֵּׁי יְהוָה
  choice: யாவேக்கு நெருப்பில் செலுத்தப்படும் காணிக்கைகளில்
  rationale: אִשֶּׁה பலிசார் தொழில்நுட்பச் சொல்; நெருப்பின் மூலம் கடவுளுக்குச் செலுத்தப்படும் காணிக்கைகளை இங்கு குறிக்கிறது. מִן இக்காணிக்கை அந்த வகையைச் சேர்ந்தது என்ற பகுதியியல் உறவை வெளிப்படுத்துகிறது. ‘உணவுக் காணிக்கைகள்’ என்ற சாத்தியமான பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெயத் தனிப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், நவீனத் தமிழில் இயல்பான ஒலிபெயர்ப்பாக வழங்குகிறது.
theological_decisions:
- issue: קֹדֶשׁ קָדָשִׁים என்ற பலிசார் பரிசுத்த வகைப்பாட்டை மொழிபெயர்த்தல்
  choice: மகா பரிசுத்தமான பங்கு
  alternative: மிகவும் பரிசுத்தமானது; பரிசுத்தங்களின் பரிசுத்தம்
  rationale: இது காணிக்கையின் மீதிப்பகுதியை மிக உயர்ந்த பரிசுத்த வகைக்குள் வைக்கிறது. இடத்தைக் குறிக்கும் ‘மகா பரிசுத்த இடம்’ என்ற பிற்காலத் தொடர்பை இறக்குமதி செய்யாமல், பலிசார் வகைப்பாட்டைத் தக்கவைக்கிறது.
- issue: אִשֵּׁי יְהוָה என்ற பலிசார் சொல்லை மொழிபெயர்த்தல்
  choice: யாவேக்கு நெருப்பில் செலுத்தப்படும் காணிக்கைகள்
  alternative: யாவேயின் உணவுக் காணிக்கைகள்
  rationale: மூலச்சொல்லின் நெருப்போடு தொடர்புடைய பலிசார் நுணுக்கத்தை முதன்மை உரை வெளிப்படையாகக் காக்கிறது; ‘உணவுக் காணிக்கைகள்’ என்ற தொழில்நுட்பப் புரிதல் உண்மையான மாற்று என்பதால் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான பலிசார் நடையில் அமைக்கப்பட்டுள்ளது. ‘தானியக் காணிக்கை’, ‘உரியது’, ‘மகா பரிசுத்தமான பங்கு’ ஆகிய சொற்கள் வாசிப்புத் தெளிவையும் மூலத்தின் சடங்குசார் துல்லியத்தையும் சமநிலைப்படுத்துகின்றன.
