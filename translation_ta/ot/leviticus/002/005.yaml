base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/005.yaml
  text: And if your offering is a grain offering on the griddle[a], it shall be of fine flour mixed with oil, unleavened.
translation:
  language: ta
  text: உன் காணிக்கை தட்டையான சுடும் பாத்திரத்தில்[a] தயாரித்த தானியக் காணிக்கையாக இருந்தால், அது எண்ணெயுடன் கலந்த நுண்ணிய மாவினாலான புளிப்பில்லாத காணிக்கையாக இருக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தட்டையான வாணலியில்.” இந்த எபிரெயச் சொல், இத்தானியக் காணிக்கையைத் தயாரிக்கப் பயன்படுத்தப்பட்ட தட்டையான சமையல் மேற்பரப்பையோ பாத்திரத்தையோ குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָה
  choice: தானியக் காணிக்கை
  rationale: லேவியராகமம் 2-இன் சூழலில் இது பொதுவான பரிசை அல்ல, மாவு அல்லது தானியத்தை அடிப்படையாகக் கொண்ட காணிக்கையைக் குறிக்கிறது.
- source_word: עַל הַמַּחֲבַת
  choice: தட்டையான சுடும் பாத்திரத்தில்
  rationale: எபிரெயச் சொல் இந்தக் காணிக்கையைத் தயாரிக்கப் பயன்படுத்தப்பட்ட தட்டையான சமையல் மேற்பரப்பையோ பாத்திரத்தையோ குறிக்கிறது; தமிழில் இயல்பாகவும் தெளிவாகவும் இருக்க இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: קָרְבָּנְךָ
  choice: உன் காணிக்கை
  rationale: நேரடி ஒருமை முன்னிலையைப் பாதுகாத்து, பலியிடுவதற்காகக் கொண்டுவரப்படும் பொருள் என்ற பொதுவான பொருளைத் தருகிறது.
- source_word: סֹלֶת
  choice: மெல்லிய மாவு
  rationale: நன்றாக அரைக்கப்பட்ட உயர்தர மாவைக் குறிக்கும் வழிபாட்டுச் சூழலின் சொல்; மூலத்தில் கோதுமை வெளிப்படையாகக் குறிப்பிடப்படாததால் அதைக் கூடுதலாகச் சேர்க்கவில்லை.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: எண்ணெயுடன் கலக்கப்பட்ட
  rationale: மாவும் எண்ணெயும் சேர்க்கப்பட்டிருப்பதைத் தெளிவாகக் கூறுகிறது; பிசைதல் போன்ற குறிப்பிட்ட செய்முறையை மூலத்தை மீறி நிர்ணயிக்கவில்லை.
- source_word: מַצָּה
  choice: புளிப்பில்லாததாக
  rationale: இங்கு தனியான புளிப்பில்லாத அப்பத்தைக் காட்டிலும் காணிக்கையின் கட்டாயமான தன்மையை விவரிக்கும் பெயரடையாக உள்ளது.
- source_word: תִהְיֶה
  choice: இருக்க வேண்டும்
  rationale: எபிரெய வினை வடிவத்தின் விதிப்பூர்வமான கட்டாயத்தை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
