translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டு-சட்ட உரைக்கு ஏற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. மூலத்தின் ஒருமை இரண்டாம் நபர் முகவரி ‘உன்’ எனப் பாதுகாக்கப்பட்டுள்ளது; பாத்திரத்தின் துல்லிய வடிவம் உறுதியற்றதால் அடிக்குறிப்பில் மாற்று வழங்கப்பட்டுள்ளது.
