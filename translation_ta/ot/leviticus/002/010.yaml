base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/010.yaml
  text: And what remains of the grain offering shall be for Aaron and for his sons[a], most holy from the food offerings of Yahweh.
translation:
  language: ta
  text: தானியக் காணிக்கையில் மீதியிருப்பது ஆரோனுக்கும் அவன் மகன்களுக்கும் உரியது. யாவேக்கு நெருப்பில் செலுத்தப்படும் காணிக்கைகளில்[a] அது மகா பரிசுத்தமானது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேயின் உணவுக் காணிக்கைகளில்.”
    reason: אִשֶּׁה என்ற பலியியல் சொல் நெருப்பில் செலுத்தப்படும் காணிக்கையையோ, கடவுளுக்கான ‘உணவு’ எனக் கருதப்படும் காணிக்கையையோ குறிக்கலாம்.
lexical_decisions:
- source_word: וְהַנּוֹתֶרֶת
  choice: மீதியிருப்பது
  rationale: குறிப்பிட்ட வினையெச்ச வடிவம் பெயர்ச்சொல் போலச் செயல்பட்டு, காணிக்கையில் எஞ்சிய பகுதியைக் குறிக்கிறது; ‘மீதியிருப்பது’ இயல்பான நவீனத் தமிழ்.
- source_word: מִן הַמִּנְחָה
  choice: தானியக் காணிக்கையில்
  rationale: லேவியராகமம் 2-ன் சூழலில் מִנְחָה பொதுவான காணிக்கையல்ல, தானியத்தால் செய்யப்படும் காணிக்கை. מן இங்கு எஞ்சியிருப்பதன் மூலத்தைக் குறிக்கிறது.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: ஆரோனுக்கும் அவன் மகன்களுக்கும் உரியது
  rationale: לְ உடைமை அல்லது ஒதுக்கீட்டைக் குறிக்கிறது; ‘உரியது’ சட்டரீதியான பங்கீட்டைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: மகா பரிசுத்தமானது
  rationale: எபிரெய மிகையுயர்வு மரபுத்தொடர் மிக உயர்ந்த பரிசுத்த நிலையைக் குறிக்கிறது. மூலத்தில் இல்லாத ‘பகுதி’ என்ற சொல்லைச் சேர்க்காமல் அதன் தீவிரத்தைப் பாதுகாக்கிறது.
- source_word: מֵאִשֵּׁי
  choice: நெருப்பில் செலுத்தப்படும் காணிக்கைகளில்
  rationale: אִשֶּׁה பலிபீட நெருப்பின் வழியாகக் கடவுளுக்குச் செலுத்தப்படும் காணிக்கையைக் குறிக்கிறது. מן இங்கு அவ்வகைக் காணிக்கைகளுள் இது மகா பரிசுத்தமானது என்ற உறவை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைபெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், அதன் பொதுவாக ஏற்கப்படும் ஒலிபெயர்ப்பைத் தமிழில் தருகிறது.
theological_decisions:
- issue: אִשֵּׁי יְהוָה என்ற பலியியல் சொற்றொடர்
  choice: யாவேக்கு நெருப்பில் செலுத்தப்படும் காணிக்கைகளில்
  alternative: யாவேயின் உணவுக் காணிக்கைகளில்
  rationale: אִשֶּׁה என்பதன் நெருப்புடன் தொடர்புடைய பலியியல் பொருளை முதன்மை உரை வெளிப்படையாக வைத்திருக்கிறது; ‘உணவுக் காணிக்கை’ என்பது சாத்தியமான வழக்குப்பொருள் என்பதால் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: קֹדֶשׁ קָדָשִׁים என்ற மிகையுயர்வு மரபுத்தொடர்
  choice: மகா பரிசுத்தமானது
  alternative: பரிசுத்தங்களிலெல்லாம் பரிசுத்தமானது
  rationale: மூலத்தின் மிக உயர்ந்த பரிசுத்தத் தரத்தைத் தக்கவைத்தபடி, இடத்தைக் குறிக்கும் ‘மகா பரிசுத்த ஸ்தலம்’ என்ற தவறான எண்ணத்தைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் ஆனால் வழிபாட்டு உரைக்கு ஏற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டது. மூலத்தின் இரண்டு கூறுகளையும் தெளிவாக்க இரண்டு வாக்கியங்களாக அமைக்கப்பட்டது; பொருள் விளக்கத்திற்காக தேவையற்ற சமயக்கோட்பாட்டு சொற்கள் சேர்க்கப்படவில்லை.
