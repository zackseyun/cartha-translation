base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/002.yaml
  text: He shall bring it to Aaron’s sons[a], the priests, and he shall take from there a handful of its fine flour and some of its oil, with all of its frankincense. Then the priest shall burn its memorial portion on the altar, a food offering, a pleasing aroma to Yahweh.
translation:
  language: ta
  text: அதை ஆரோனின் மகன்களாகிய ஆசாரியர்களிடம் அவன் கொண்டுவர வேண்டும். ஆசாரியர் அங்கிருந்து அதன் மெல்லிய மாவில் தன் கைநிறையளவும், அதன் எண்ணெயில் சிறிதும், அதன் சாம்பிராணி முழுவதையும் எடுக்க வேண்டும். பின்பு ஆசாரியர் அதன் நினைவுப் பங்கைப் பலிபீடத்தின் மேல் எரிக்க வேண்டும். அது யாவேக்கு இனிய நறுமணமுள்ள நெருப்புப் பலி[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நெருப்பில் செலுத்தப்படும் பலி” அல்லது “உணவுப் பலி.”
    reason: אִשֵּׁה என்ற ஆசாரியத் தொழில்நுட்பச் சொல்லுக்கான நிலையான சொற்பொருள் மாற்றுகளைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: וֶהֱבִיאָהּ
  choice: அதை ... அவன் கொண்டுவர வேண்டும்
  rationale: இது தானியக் காணிக்கையைக் கொண்டுவரும் நபரின் செயலைக் குறிக்கும்; எபிரெய சட்டநடைத் தொடரை இயல்பான தமிழ் கட்டளை நடையில் தருகிறது.
- source_word: בְּנֵי אַהֲרֹן הַכֹּהֲנִים
  choice: ஆரோனின் மக்களாகிய ஆசாரியர்கள்
  rationale: குடும்ப உறவையும், அவர்கள் ஆசாரியர்கள் என்ற பணியடையாளத்தையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: וְקָמַץ ... מְלֹא קֻמְצוֹ
  choice: ஆசாரியர்களில் ஒருவர் ... தன் கை நிறையையும் ... எடுக்க வேண்டும்
  rationale: קמץ என்பது கையைக் குவித்து எடுப்பதையும், מְלֹא קֻמְצוֹ அந்தக் கை கொள்ளும் முழு அளவையும் குறிக்கிறது. எபிரெயத்தில் செய்பவர் சூழலால் மாறுவதால் தமிழில் ‘ஆசாரியர்களில் ஒருவர்’ என்று வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: מִשָּׁם
  choice: அங்கிருந்து
  rationale: ‘அதிலிருந்து’ என்று பொதுமைப்படுத்தாமல், மூலத்தின் இடச்சுட்டுப் பொருளை நேரடியாகப் பாதுகாக்கிறது.
- source_word: מִסָּלְתָּהּ
  choice: அதன் மெல்லிய மாவு
  rationale: סֹלֶת என்பது காணிக்கைக்குப் பயன்படுத்தப்படும் நன்கு அரைக்கப்பட்ட மெல்லிய மாவைக் குறிக்கிறது.
- source_word: וּמִשַּׁמְנָהּ
  choice: அதன் எண்ணெய்
  rationale: மாவுடன் சேர்ந்து எண்ணெயிலிருந்தும் கை நிறையளவு எடுக்கப்படுவதை தமிழ் தொடரமைப்பு காட்டுகிறது; எண்ணெய் முழுவதும் எடுக்கப்படுவதாகக் கூறவில்லை.
- source_word: עַל כָּל לְבֹנָתָהּ
  choice: அதன் சாம்பிராணி முழுவதையும்
  rationale: மாவும் எண்ணெயும் பகுதியளவு எடுக்கப்படுகின்றன; ஆனால் சாம்பிராணி அனைத்தும் சேர்க்கப்படுவதை ‘முழுவதையும்’ தெளிவாக்குகிறது.
- source_word: אַזְכָּרָתָהּ
  choice: அதன் நினைவுப் பங்கு
  rationale: பலியின் பிரதிநிதிப் பகுதி பலிபீடத்தில் எரிக்கப்படுவதைக் குறிக்கும் ஆசாரியத் தொழில்நுட்பச் சொல்லைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: וְהִקְטִיר ... הַמִּזְבֵּחָה
  choice: பலிபீடத்தின் மேல் எரிக்க வேண்டும்
  rationale: קטר என்பதன் பலிச்சடங்கு சார்ந்த எரித்துப் புகையாக்கும் பொருளையும், பலிபீடமே செயல் நடைபெறும் இடம் என்பதையும் இயல்பாகத் தருகிறது.
- source_word: אִשֵּׁה
  choice: நெருப்புப் பலி
  rationale: நெருப்பின் மூலம் செலுத்தப்படும் பலியைக் குறிக்கும் பாரம்பரியமும் மூலவடிவத்துக்கு நெருக்கமுமான பொருள் தேர்ந்தெடுக்கப்பட்டது; ‘உணவுப் பலி’ என்ற மாற்றுப் புரிதல் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: רֵיחַ נִיחֹחַ
  choice: இனிய நறுமணம்
  rationale: தெய்வீக ஏற்றுக்கொள்ளுதலைச் சுட்டும் பலிச்சடங்கு மொழிப்படிமத்தை இயல்பான நவீன தமிழில் பாதுகாக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் உள்ள உடன்படிக்கைப் பெயரைப் பொதுப்பட்டமாக மாற்றாமல், தமிழில் ஒலிபெயர்த்துக் காட்டுகிறது.
- issue: אִשֵּׁה என்ற ஆசாரியத் தொழில்நுட்பச் சொல்லின் பொருள்
  choice: நெருப்புப் பலி
  alternative: உணவுப் பலி
  rationale: சொல்லின் சொற்பிறப்பும் உடனுள்ள எரிக்கும் செயலும் ‘நெருப்புப் பலி’ என்பதற்கு ஆதரவளிக்கின்றன; எனினும் ஆசாரிய மொழியில் உணவு சார்ந்த பலிவகையை இது குறிக்கலாம் என்ற உண்மையான சொற்பொருள் விவாதம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
