  register: நவீன நிலையான தமிழில், சட்டவிதிக்கேற்ற ‘வேண்டும்’ நடை பயன்படுத்தப்பட்டுள்ளது. மரியாதையும் வாசிப்புத் தெளிவும் காக்கப்பட்டுள்ளன; ஆசாரியச் சொற்களான ‘பலிபீடம்’, ‘நினைவுப் பங்கு’, ‘நெருப்புப் பலி’ ஆகியவை தேவையான துல்லியத்துடன் வைக்கப்பட்டுள்ளன.
