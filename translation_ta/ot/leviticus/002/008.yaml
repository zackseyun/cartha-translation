  text: וְ/הֵבֵאתָ֣ אֶת הַ/מִּנְחָ֗ה אֲשֶׁ֧ר יֵעָשֶׂ֛ה מֵ/אֵ֖לֶּה לַ/יהוָ֑ה וְ/הִקְרִיבָ/הּ֙ אֶל הַ/כֹּהֵ֔ן וְ/הִגִּישָׁ֖/הּ אֶל הַ/מִּזְבֵּֽחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/008.yaml
  text: And you shall bring the grain offering that is made from these things to Yahweh[a], and he shall present it to the priest, and he shall bring it near to the altar.
translation:
  language: ta
  text: இவற்றிலிருந்து செய்யப்பட்ட தானியப் படையலை நீ யாவேக்கு[a] கொண்டுவர வேண்டும். அவன்[b] அதை ஆசாரியனிடம் சமர்ப்பிக்க வேண்டும்; அவன் அதை பலிபீடத்திற்குக் கொண்டுவர வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேவுக்காக.” எபிரெய முன்னிடைச்சொல் திசையையும் அர்ப்பணிப்பையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இங்கிருந்து எபிரெய உரை இரண்டாம் நபரிலிருந்து மூன்றாம் நபருக்கு மாறுகிறது; ‘அவன்’ யார் என்பதை உரை வெளிப்படையாகக் குறிப்பிடவில்லை.
    reason: source_ambiguity
lexical_decisions:
- source_word: וְהֵבֵאתָ
  choice: நீ கொண்டுவர வேண்டும்
  rationale: בוא என்பதன் ஹிஃபில் வடிவம் சட்ட வழிகாட்டுதலில் கட்டளையைக் குறிக்கிறது. நவீன தமிழில் ‘கொண்டுவர வேண்டும்’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: הַמִּנְחָה
  choice: தானியப் படையல்
  rationale: லேவியராகமம் 2-ன் சூழலில் מִנְחָה பொதுவான காணிக்கையைக் காட்டிலும் தானியத்தால் செய்யப்படும் படையலைக் குறிக்கிறது.
- source_word: אֲשֶׁר יֵעָשֶׂה מֵאֵלֶּה
  choice: இவற்றிலிருந்து செய்யப்பட்ட
  rationale: עשה என்பதன் நிஃபால் வடிவத்தின் செயப்பாட்டு பொருளையும் מֵאֵלֶּה என்பதன் மூலப்பொருள் சார்ந்த பொருளையும் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: לַיהוָה
  choice: யாவேவிடம்
  rationale: יהוה என்ற உடன்படிக்கைப் பெயரை ‘யாவே’ என ஒலிபெயர்த்து, ל முன்னிடைச்சொல்லின் திசை சார்ந்த பொருளை முதன்மை உரையில் காட்டுகிறது; அர்ப்பணிப்பு சார்ந்த மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְהִקְרִיבָהּ
  choice: அவன் அதை ஆசாரியனிடம் சமர்ப்பிக்க வேண்டும்
  rationale: קרב என்பதன் ஹிஃபில் வடிவம் ‘அருகே கொண்டுவருதல்/சமர்ப்பித்தல்’ எனப் பொருள்படும். அடுத்துள்ள נגשׁ வடிவத்திலிருந்து வேறுபடுத்த ‘சமர்ப்பிக்க’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: אֶל הַכֹּהֵן
  choice: ஆசாரியனிடம்
  rationale: אֶל குறிக்கும் திசையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְהִגִּישָׁהּ
  choice: அவன் அதை அருகே கொண்டுவர வேண்டும்
  rationale: נגשׁ என்பதன் ஹிஃபில் வடிவம் ஒன்றை அருகில் கொண்டுவருவதைக் குறிக்கிறது; பலிபீடத்தை அணுகும் அடுத்த சடங்கு நடவடிக்கையை இது பாதுகாக்கிறது.
- source_word: אֶל הַמִּזְבֵּחַ
  choice: பலிபீடத்தின் அருகே
  rationale: பலியிடும் பீடத்தைக் குறிக்கும் வழக்கமான தமிழ்ச் சொல்லையும், அருகே கொண்டுவரும் இயக்கத்தையும் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரையில் நான்கு எழுத்துகளைக் கொண்ட இறைப் பெயர் நேரடியாக உள்ளது; அதை ஒரு பட்டப்பெயராக மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்ப்பது உடன்படிக்கைப் பெயரைப் பாதுகாக்கிறது.
- issue: மூன்றாம் நபர் வினைகளின் எழுவாய்
  choice: மூலத்தின் தெளிவின்மையை ‘அவன்’ என்று பாதுகாத்தல்
  alternative: முதல் ‘அவன்’ காணிக்கை கொண்டுவருபவன் என்றும் இரண்டாம் ‘அவன்’ ஆசாரியன் என்றும் வெளிப்படையாக அடையாளப்படுத்துதல்
  rationale: முதல் வினை இரண்டாம் நபரிலும் அடுத்த இரு வினைகள் மூன்றாம் நபர் ஆண்பாலிலும் உள்ளன; மூல எபிரெய உரை அந்த மூன்றாம் நபரை பெயரிட்டு அடையாளப்படுத்தவில்லை. ஆகவே விளக்கவுரையை முதன்மை உரைக்குள் சேர்க்காமல் தெளிவின்மை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டுச் சட்டத்துக்கேற்ற கண்ணியமான ஆனால் பொதுவாசகர்களுக்குப் புரியக்கூடிய நடை பயன்படுத்தப்பட்டுள்ளது. ‘தானியப் படையல்’, ‘ஆசாரியன்’, ‘பலிபீடம்’ ஆகியவை சூழலுக்கேற்ற நிலையான சமயச் சொற்கள். எபிரெய வினைகளில் உள்ள நபர் மாற்றம் விளக்கித் தீர்க்கப்படாமல் பாதுகாக்கப்பட்டுள்ளது.
