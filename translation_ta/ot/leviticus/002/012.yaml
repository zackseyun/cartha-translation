source:
  edition: WLC
  text: קָרְבַּ֥ן רֵאשִׁ֛ית תַּקְרִ֥יבוּ אֹתָ֖/ם לַ/יהוָ֑ה וְ/אֶל הַ/מִּזְבֵּ֥חַ לֹא יַעֲל֖וּ לְ/רֵ֥יחַ נִיחֹֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/012.yaml
  text: As an offering of firstfruits you may present them to Yahweh[b][a], but they must not go up on the altar as a pleasing aroma.
translation:
  language: ta
  text: முதற்கனிகளின் காணிக்கையாக அவற்றை யாவேவுக்கு நீங்கள் சமர்ப்பிக்கலாம்[a]. ஆனால் இனிய நறுமணமாக அவை பலிபீடத்தின்மேல் ஏற்றப்படக் கூடாது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “முதற்கனிப் காணிக்கையாக.”
    reason: קָרְבַּן רֵאשִׁית என்ற எபிரெயச் சொற்றொடரைத் தமிழில் இயல்பாக அமைக்கும் மாற்று முறை.
  - marker: b
    text: சொல்லர்த்தமாக, “இனிய நறுமணத்திற்காக அவை பலிபீடத்துக்கு மேலேறக் கூடாது.” பலியியல் சூழலில் இது அவற்றை பலிபீடத்தின்மேல் ஏற்றுவதைக் குறிக்கிறது.
    reason: עלה என்ற வினையின் நேரடிப் பொருளையும் பலியியல் சூழலில் அதன் பொருளையும் விளக்குகிறது.
lexical_decisions:
- source_word: קָרְבַּן רֵאשִׁית
  choice: முதற்கனிப் படையலாக
  rationale: எபிரெயக் கட்டமைப்பு ‘முதற்கனிகளின் படையல்’ அல்லது ‘முதற்கனிப் படையல்’ எனப் பொருள்படலாம். இங்கு இயல்பான நவீனத் தமிழில் படையலின் வகையைக் குறிக்கும் வகையில் மொழிபெயர்க்கப்பட்டுள்ளது; மாற்றுச் சாத்தியம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: תַּקְרִיבוּ
  choice: நீங்கள் செலுத்தலாம்
  rationale: பலியிடுதல் சார்ந்த சூழலில் ‘கொண்டுவந்து சமர்ப்பித்தல்’ என்பதே பொருள். முந்தைய வசனத்தில் தடைசெய்யப்பட்ட பொருட்களை முதற்கனிப் படையலாகச் செலுத்த அனுமதி இருப்பதைச் சூழல் காட்டுவதால், அனுமதிப் பொருளை ‘லாம்’ வெளிப்படுத்துகிறது.
- source_word: אֹתָם
  choice: அவற்றை
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட புளிப்பும் தேனும் சார்ந்த பொருட்களைச் சுட்டும் ஆண்பால் பன்மைப் பதிலீட்டின் இயல்பான தமிழ் வடிவம்.
- source_word: לַיהוָה
  choice: யாவேவுக்கு
  rationale: உடன்படிக்கைப் பெயரான יהוה-ஐ பட்டப்பெயராக மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்த்து, ל முன்னொட்டின் திசை/அர்ப்பணிப்புப் பொருளை ‘-வுக்கு’ கொண்டு வெளிப்படுத்துகிறது.
- source_word: וְאֶל הַמִּזְבֵּחַ לֹא יַעֲלוּ
  choice: ஆனால் ... அவை பலிபீடத்தின்மேல் ஏற்றப்படக் கூடாது
  rationale: עלה என்பதன் அடிப்படைப் பொருள் ‘மேலேறுதல்’; பலியிடும் சூழலில் பலிபீடத்தின்மேல் ஏற்றி எரிப்பதைக் குறிக்கிறது. ‘ஏற்றப்படுதல்’ மூல உருவகத்தைப் பாதுகாக்கிறது; ‘ஆனால்’ முந்தைய அனுமதிக்கும் இத்தடைக்கும் உள்ள முரண்பாட்டைத் தெளிவாக்குகிறது.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: இனிய நறுமணமாக
  rationale: தேவனுக்கு ஏற்புடைய பலியை விவரிக்கும் நிலையான பலியியல் சொற்றொடரின் மணம் சார்ந்த உருவகத்தை இயல்பான தமிழில் பாதுகாக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் உள்ள தனிப்பட்ட உடன்படிக்கைப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் அறியப்பட்ட ஒலிபெயர்ப்பாக வழங்குகிறது.
- issue: לְרֵיחַ נִיחֹחַ என்பதன் பொருள்
  choice: இனிய நறுமணமாக
  alternative: ஏற்றுக்கொள்ளத்தக்க பலியாக
  rationale: ஏற்றுக்கொள்ளப்படுதல் என்ற கருத்தை விளக்கமாக மட்டும் கூறாமல், மூலத்தின் உணர்வுப்பூர்வமான மண உருவகத்தையும் அதன் பலியியல் பதற்றத்தையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமான ஆனால் பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘படையல்’, ‘செலுத்துதல்’, ‘பலிபீடம்’ ஆகியவை துல்லியத்தையும் இயல்பையும் இணைக்கின்றன; மூலத்தின் ‘மேலேறுதல்’ உருவகம் ‘ஏற்றப்படுதல்’ எனப் பாதுகாக்கப்பட்டுள்ளது.
