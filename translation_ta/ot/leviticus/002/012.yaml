  to: முதற்கனிகளின் காணிக்கையாக அவற்றை யாவேவுக்கு நீங்கள் சமர்ப்பிக்கலாம்[a]. ஆனால் இனிய நறுமணமாக அவை பலிபீடத்தின்மேல் ஏற்றப்படக் கூடாது[b].
  rationale: ‘செலுத்துதல்’ என்பதற்குப் பதிலாக ‘சமர்ப்பித்தல்’ பயன்படுத்தப்பட்டுள்ளது; இது மூலத்தின் காணிக்கையாகக் கொண்டுவரும் பொருளைத் துல்லியமாகக் காட்டுகிறது. ‘முதற்கனிகளின் காணிக்கையாக’ என்பது எபிரெயக் கட்டமைப்பை வெளிப்படையாகக் காட்டுகிறது. அடிக்குறிப்பு b மூலச் சொல்லின் உருவகத்தையும் சூழல் பொருளையும் காக்கும் வகையில், தேவையற்ற விளக்க விரிவாக்கமின்றி மாற்றப்பட்டுள்ளது.
