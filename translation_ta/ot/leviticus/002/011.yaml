  text: כָּל הַ/מִּנְחָ֗ה אֲשֶׁ֤ר תַּקְרִ֨יבוּ֙ לַ/יהוָ֔ה לֹ֥א תֵעָשֶׂ֖ה חָמֵ֑ץ כִּ֤י כָל שְׂאֹר֙ וְ/כָל דְּבַ֔שׁ לֹֽא תַקְטִ֧ירוּ מִמֶּ֛/נּוּ אִשֶּׁ֖ה לַֽ/יהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/011.yaml
  text: Every grain offering that you present to Yahweh shall not be made with leaven[b][a], for you shall not burn any leaven or any honey from it as a food offering to Yahweh.
translation:
  language: ta
  text: யாவேக்கு நீங்கள் செலுத்தும் எந்தத் தானியப் படையலும் புளிப்பூட்டப்பட்டதாகச் செய்யப்படக் கூடாது; ஏனெனில் புளிப்பூட்டும் பொருளையோ எந்தத் தேனையோ[a] யாவேக்கு நெருப்புப் படையலாக[b] நீங்கள் எரிக்கக் கூடாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: பண்டைய பயன்பாட்டில் ‘தேன்’ என்பது தேனீத் தேனை மட்டுமல்லாமல் பேரீச்சம்பழம் போன்ற பழங்களிலிருந்து செய்யப்பட்ட இனிப்புப் பாகையும் குறிக்கலாம்.
    reason: cultural_note
  - marker: b
    text: எபிரெயச் சொல், பலிபீடத்தில் எரித்துச் செலுத்தப்படும் ஒரு படையலைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּנְחָה
  choice: தானியப் படையல்
  rationale: லேவியராகமம் 2-ன் சூழலில் இது பொதுவான காணிக்கையை அல்ல, மாவு அல்லது தானியத்தால் செய்யப்பட்ட படையலைக் குறிக்கிறது.
- source_word: תַּקְרִיבוּ
  choice: நீங்கள் செலுத்தும்
  rationale: பலிச்சூழலில் தேவனிடம் கொண்டுவந்து சமர்ப்பிக்கும் செயலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: எபிரெய மூலத்தில் உள்ள உடன்படிக்கைப் பெயரான יהוה என்பதை பெயராகவே ஒலிபெயர்க்கிறது.
- source_word: תֵעָשֶׂה חָמֵץ
  choice: புளிப்பூட்டப்பட்டதாகத் தயாரிக்கப்படக் கூடாது
  rationale: படையல் புளித்த நிலையில் செய்யப்படக் கூடாது என்ற செயப்பாட்டு வடிவிலான தடையைத் தெளிவாகக் காட்டுகிறது.
- source_word: שְׂאֹר
  choice: புளிப்பூட்டும் பொருள்
  rationale: இது நவீன வணிக ஈஸ்டை மட்டும் அல்லாமல், மாவைப் புளிக்கச் செய்யும் பொருளை விரிவாகக் குறிக்கிறது.
- source_word: דְּבַשׁ
  choice: தேன்
  rationale: சொல்லின் வழக்கமான பொருளை முதன்மை உரையில் தருகிறது; பழச்சாறுப் பாகையும் குறிக்கக்கூடிய பண்டைய பயன்பாடு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: לֹא תַקְטִירוּ
  choice: பலிபீடத்தில் எரிக்கக் கூடாது
  rationale: பலிப்பொருளை எரித்து புகையாக எழச் செய்யும் சடங்குச் செயலைத் துல்லியமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: אִשֶּׁה
  choice: நெருப்புப் படையல்
  rationale: நெருப்பில் எரித்துச் செலுத்தப்படும் பலிவகையைக் குறிக்கும் தொழில்நுட்பச் சொல்லைத் தெளிவாகப் பிரதிபலிக்கிறது.
theological_decisions:
- issue: יהוה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரையில் பொதுப்பட்டம் அல்ல, நான்கு எழுத்துகளைக் கொண்ட தெய்வீகப் பெயரே நேரடியாக உள்ளது; ஆகவே அதை பெயராகப் பாதுகாக்கிறது.
- issue: אִשֶּׁה என்ற பலிச்சொல்லின் பொருள்
  choice: நெருப்புப் படையல்
  alternative: உணவுப் படையல்
  rationale: இவ்வசனத்தில் תקטירו என்ற ‘எரித்தல்/புகையெழச் செய்தல்’ வினையுடன் வருவதால், நெருப்பின் மூலம் செலுத்தப்படும் படையல் என்ற பொருளை வெளிப்படையாக வைத்திருக்கிறது; ‘உணவுப் படையல்’ என்பது இங்கு தேவையற்ற விளக்கத்தைச் சேர்க்கக்கூடும்.
translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டு உரைக்கு ஏற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘படையல்’ என்ற சொல் பலிச்சூழலைத் தெளிவாக வைத்திருக்கிறது; ‘புளிப்பூட்டும் பொருள்’ என்பது ‘ஈஸ்ட்’ என்பதைக் காட்டிலும் மூலச்சொல்லின் பரந்த பொருளைப் பாதுகாக்கிறது.
