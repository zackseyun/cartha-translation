source:
  edition: WLC
  text: וְ/אִם מִנְחַ֥ת מַרְחֶ֖שֶׁת קָרְבָּנֶ֑/ךָ סֹ֥לֶת בַּ/שֶּׁ֖מֶן תֵּעָשֶֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/007.yaml
  text: And if your offering is a grain offering from a pan[a], it shall be made of fine flour with oil.
translation:
  language: ta
  text: மேலும், உன் காணிக்கை சட்டியில்[a] தயாரிக்கப்படும் தானியக் காணிக்கையாக இருந்தால், அது எண்ணெயுடன் நுண்ணிய மாவினால் செய்யப்பட வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வறுக்கும் தட்டு,’ ‘ஆழமான சட்டி,’ அல்லது ‘சமையல் பாத்திரம்’; எபிரெயச் சொல் குறிக்கும் பாத்திரத்தின் துல்லியமான வகை உறுதியாகத் தெரியவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: இருந்தால்
  rationale: இணைப்புச் சொல் மற்றும் நிபந்தனைத் துகள் பலிவிதிகளின் அடுத்த நிலையை அறிமுகப்படுத்துகின்றன. தமிழில் வாக்கிய ஓட்டம் இயல்பாக இருக்க நிபந்தனை வடிவம் பயன்படுத்தப்பட்டது; தொடர்ச்சி சூழலால் தெளிவாகிறது.
- source_word: מִנְחַת
  choice: தானியக் காணிக்கை
  rationale: லேவியராகமம் 2-இல் இது பொதுவான காணிக்கையை அல்ல, தானியத்தால் செய்யப்படும் காணிக்கையைக் குறிக்கிறது.
- source_word: מַרְחֶשֶׁת
  choice: சட்டி
  rationale: இது சமைப்பதற்குப் பயன்படுத்தப்பட்ட ஒரு பாத்திரத்தைக் குறிக்கிறது; அதன் துல்லியமான வடிவம் உறுதியில்லை. ‘சட்டி’ என்பது இயல்பானதும் அளவுக்கு மீறி குறிப்பாக்காததுமான தமிழ்ச் சொல்.
- source_word: קָרְבָּנְךָ
  choice: உன் காணிக்கை
  rationale: இறைவனிடம் கொண்டுவரப்படும் பொருளைக் குறிக்கும் பொதுச் சொல்லின் இரண்டாம் நபர் ஒருமைப் பின்னொட்டு பாதுகாக்கப்படுகிறது.
- source_word: סֹלֶת
  choice: மெல்லிய மாவு
  rationale: நன்கு அரைக்கப்பட்ட உயர்தர மாவைக் குறிக்கும் வழிபாட்டுச் சொல்; ‘மெல்லிய மாவு’ நவீனத் தமிழில் தெளிவாக உள்ளது.
- source_word: בַּשֶּׁמֶן
  choice: எண்ணெயுடன்
  rationale: בְּ முன்னிடைச்சொல் தயாரிப்பில் எண்ணெயின் உடனிருப்பையோ பொருட்கூறையோ குறிக்கிறது. ‘கலந்து’ என்று மூலத்தில் இல்லாத செயலைத் தெளிவுபடுத்தாமல் ‘எண்ணெயுடன்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: תֵּעָשֶׂה
  choice: செய்யப்பட வேண்டும்
  rationale: நிஃபால் வினையின் செயப்பாட்டு வடிவத்தையும் விதிமுறைத் தொனியையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
