revisions:
- from: உன் காணிக்கை சட்டியில்[a] செய்யப்பட்ட தானியக் காணிக்கையாக இருந்தால், அது எண்ணெயுடன் மெல்லிய மாவினால் செய்யப்பட வேண்டும்.
  to: மேலும், உன் காணிக்கை சட்டியில்[a] தயாரிக்கப்படும் தானியக் காணிக்கையாக இருந்தால், அது எண்ணெயுடன் நுண்ணிய மாவினால் செய்யப்பட வேண்டும்.
  rationale: The revision preserves the Hebrew conditional and sequential connection, retains the broad rendering of the uncertain vessel, improves the rendering of fine flour, and corrects a potentially misleading footnote alternative. It does not specify the vessel beyond what the Hebrew safely permits.
