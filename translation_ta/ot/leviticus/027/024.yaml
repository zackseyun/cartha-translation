source:
  edition: WLC
  text: בִּ/שְׁנַ֤ת הַ/יּוֹבֵל֙ יָשׁ֣וּב הַ/שָּׂדֶ֔ה לַ/אֲשֶׁ֥ר קָנָ֖/הוּ מֵ/אִתּ֑/וֹ לַ/אֲשֶׁר ל֖/וֹ אֲחֻזַּ֥ת הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/024.yaml
  text: In the year of jubilee the field shall return to the one from whom it was bought[a], to the one to whom the possession of the land belongs.
translation:
  language: ta
  text: யூபிலி ஆண்டில் அந்த வயல், எவரிடமிருந்து அதை வாங்கினாரோ அவரிடமே, அந்த நிலப்பங்கு யாருக்குரியதோ அவரிடமே திரும்ப வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்த நிலம் எவருடைய பரம்பரை உடைமையோ அவரிடம்.” எபிரெயச் சொற்றொடர் நில உடைமை அல்லது நிலப்பங்கைக் குறிக்கிறது; இச்சூழலில் அது முதலில் ஒரு குடும்பத்துக்குப் பங்கிடப்பட்ட நிலமாகும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁנַת הַיּוֹבֵל
  choice: விடுதலை ஆண்டில்
  rationale: யோபேல் சட்டத்தின் குறிப்பிட்ட ஆண்டைக் குறிக்கிறது. தமிழில் அதன் செயல்பாட்டு பொருளை இயல்பாக வெளிப்படுத்தும் நிலைபெற்ற வேதாகமச் சொற்றொடர்.
- source_word: יָשׁוּב
  choice: திரும்பிச் சேர வேண்டும்
  rationale: இந்த imperfect வடிவம் சட்டரீதியான விளைவைக் குறிக்கிறது; ‘வேண்டும்’ அதன் விதிமுறைத் தன்மையைத் தெளிவாகக் காட்டுகிறது.
- source_word: הַשָּׂדֶה
  choice: அந்த வயல்
  rationale: שָׂדֶה என்பதன் நேரடியான பொருள் ‘வயல்’; எபிரெயக் குறிப்புச் சுட்டைத் தமிழில் ‘அந்த’ என இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לַאֲשֶׁר קָנָהוּ מֵאִתּוֹ
  choice: எவனிடமிருந்து அது வாங்கப்பட்டதோ அவனிடம்
  rationale: קָנָהוּ இலக்கணப்படி ‘அவன் அதை வாங்கினான்’ என்ற செயப்பாட்டு வடிவமாயினும், வெளிப்படையாகக் குறிப்பிடப்படாத வாங்கியவரைத் தமிழில் புதிதாக அறிமுகப்படுத்தாமல், முன் உரிமையாளரைத் தெளிவாக அடையாளப்படுத்தும் இயல்பான வடிவம்.
- source_word: לַאֲשֶׁר לוֹ אֲחֻזַּת הָאָרֶץ
  choice: அந்த நிலம் எவனுடைய உடைமையோ அவனிடம்
  rationale: אֲחֻזָּה என்பது நில உடைமை அல்லது நிலப்பங்கு. பிரதான உரையில் ‘பரம்பரை’ என்பதைச் சேர்க்காமல் அடிப்படைச் சட்டப் பொருளைத் தக்கவைக்கிறது.
theological_decisions:
- issue: யோபேல் சட்டத்தில் אֲחֻזַּת הָאָרֶץ என்பதன் தன்மை
  choice: பிரதான உரையில் ‘அந்த நிலம் எவனுடைய உடைமையோ’
  alternative: ‘அந்த நிலம் எவனுடைய பரம்பரை உடைமையோ’
  rationale: பரந்த சூழல் மூதாதையர் வழி வந்த குடும்ப நிலப்பங்கைக் குறித்தாலும், இவ்வசனத்தின் சொல் நேரடியாக ‘உடைமை/நிலப்பங்கு’ என்பதைக் குறிக்கிறது. ஆகவே பரம்பரைத் தன்மையை அடிக்குறிப்பில் விளக்கி, பிரதான உரையில் தேவைக்கு அதிகமாகத் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், சட்டவிதியின் கண்ணியமான தொனியுடன் மொழிபெயர்க்கப்பட்டது. ‘எவனிடம்/எவனுடைய’ என்பது இங்கு பொதுப்பாலைக் குறிக்கும் சட்டநடைப் பயன்பாடு. ‘அதாவது’ இரு எபிரெய அடையாளச் சொற்றொடர்களும் ஒரே முன்னைய நில உரிமையாளரை விளக்குவதைத் தமிழில் தெளிவாக்குகிறது.
