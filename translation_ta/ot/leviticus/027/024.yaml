revisions:
- from: விடுதலை ஆண்டில் அந்த வயல், எவனிடமிருந்து அது வாங்கப்பட்டதோ அவனிடம்—அதாவது, அந்த நிலம் எவனுடைய உடைமையோ அவனிடம்—திரும்பிச் சேர வேண்டும்.[a]
  to: யூபிலி ஆண்டில் அந்த வயல், எவரிடமிருந்து அதை வாங்கினாரோ அவரிடமே, அந்த நிலப்பங்கு யாருக்குரியதோ அவரிடமே திரும்ப வேண்டும்.[a]
  rationale: The revision retains the source's legal force («திரும்ப வேண்டும்»), uses the technical term «யூபிலி ஆண்டு», restores the active purchase relationship without specifying an unstated purchaser, and renders אֲחֻזַּת הָאָרֶץ as «நிலப்பங்கு». The footnote preserves the viable hereditary-possession nuance as contextual explanation rather than imposing it on the main text.
