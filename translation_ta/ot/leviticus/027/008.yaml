base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/008.yaml
  text: But if he is too poor for your valuation[a], then he shall be made to stand before the priest, and the priest shall assess him[b]; the priest shall assess him according to what the one making the vow can afford.
translation:
  language: ta
  text: ஆனால், உன் மதிப்பீட்டுத் தொகையைச் செலுத்த முடியாத அளவுக்கு அவன் ஏழையாக இருந்தால்[a], அவன் ஆசாரியன் முன் நிறுத்தப்பட வேண்டும்; ஆசாரியன் அவனுக்கான தொகையை மதிப்பிட வேண்டும். நேர்ச்சை செய்தவரால் செலுத்த முடிவதற்கு ஏற்ப[b] ஆசாரியன் அவனுக்கான தொகையை மதிப்பிட வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதை இன்னும் சொல்லுக்குச் சொல்லாக, “அவன் உன் மதிப்பீட்டைவிட ஏழையாக இருந்தால்” என்றும் மொழிபெயர்க்கலாம். இங்கு கருத்து, நிர்ணயிக்கப்பட்ட தொகையை அவனால் செலுத்த இயலாது என்பதாகும்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல்லாக, “நேர்ச்சை செய்தவரின் கை எட்டுவதற்கு ஏற்ப.” இது பொருளாதாரத் திறனைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָךְ
  choice: ஏழையாக
  rationale: இச்சொல் பொருளாதாரத்தில் தாழ்ந்த நிலையைக் குறிக்கிறது; தொடரும் ஒப்பீட்டுக் கட்டமைப்புடன் சேர்ந்து, நிர்ணயிக்கப்பட்ட தொகையைச் செலுத்த இயலாத வறுமையை இங்கு சுட்டுகிறது.
- source_word: מֵעֶרְכֶּךָ
  choice: உன் மதிப்பீட்டுத் தொகையைச் செலுத்த முடியாத அளவுக்கு
  rationale: லேவியராகமம் 27-இல் עֵרֶךְ என்பது நேர்ச்சை தொடர்பாக நிர்ணயிக்கப்படும் பணத்தொகையைக் குறிக்கிறது. இரண்டாம் நபர் ஒருமை விகுதியை ‘உன்’ என்று காத்து, מִן உடன் வரும் ஒப்பீட்டின் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְהֶעֱמִידוֹ
  choice: அவன் ... நிறுத்தப்பட வேண்டும்
  rationale: עמד என்பதன் ஹிஃபில் வடிவம் ‘நிற்கச் செய்தல்’ என்று பொருள்படும். செய்பவர் குறிப்பிடப்படாத சட்ட நடைமுறையைத் தமிழின் செயப்பாட்டு வடிவம் பாதுகாக்கிறது.
- source_word: לִפְנֵי הַכֹּהֵן
  choice: ஆசாரியன் முன்
  rationale: ஆசாரிய அதிகாரத்தின் முன்னிலையில் ஒருவரை ஆஜர்படுத்துவதைக் குறிக்கும் வழக்கமான சட்ட-வழிபாட்டு சொற்றொடர்.
- source_word: וְהֶעֱרִיךְ אֹתוֹ / יַעֲרִיכֶנּוּ
  choice: ஆசாரியன் அவனுக்கான தொகையை மதிப்பிட வேண்டும்
  rationale: ערך இவ்வதிகாரத்தில் ஒருவருக்குரிய பண மதிப்பீட்டை நிர்ணயிப்பதைக் குறிக்கும் தொழில்நுட்பச் சொல். ‘அவனை மதிப்பிடுதல்’ என்பதில் ஏற்படக்கூடிய மனித மதிப்பைப் பற்றிய தவறான எண்ணத்தைத் தவிர்த்து, நிதிசார் பொருளைத் தெளிவாக்குகிறது; வினையின் மறுபயன்பாடும் மொழிபெயர்ப்பில் காக்கப்படுகிறது.
- source_word: עַל פִּי
  choice: ஏற்ப
  rationale: மதிப்பீட்டுக்கான அடிப்படை அல்லது அளவுகோலை அறிமுகப்படுத்தும் ‘அதன்படி’ என்ற பொருளை இயல்பாகத் தருகிறது.
- source_word: אֲשֶׁר תַּשִּׂיג יַד
  choice: செலுத்த முடிவதற்கு
  rationale: ‘கை எட்டுதல்’ என்பது ஒருவரின் பொருளாதாரத் திறனைக் குறிக்கும் எபிரெய மரபுத்தொடர். அதன் சூழல்சார் பொருளை நவீன தமிழில் தெளிவாகத் தருகிறது.
- source_word: הַנֹּדֵר
  choice: நேர்ச்சை செய்தவர்
  rationale: נדר என்பது நேர்ச்சை செய்வதைக் குறிக்கிறது. ‘நேர்ச்சை செய்தவர்’ என்பது தொழில்நுட்பக் குழப்பமின்றி சாதாரண வாசகருக்குப் புரியும் இயல்பான தமிழ்.
