source:
  edition: WLC
  text: וְ/חִשַּׁב ל֣/וֹ הַ/כֹּהֵ֗ן אֵ֚ת מִכְסַ֣ת הָֽ/עֶרְכְּ/ךָ֔ עַ֖ד שְׁנַ֣ת הַ/יֹּבֵ֑ל וְ/נָתַ֤ן אֶת הָ/עֶרְכְּ/ךָ֙ בַּ/יּ֣וֹם הַ/ה֔וּא קֹ֖דֶשׁ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/023.yaml
  text: then the priest shall calculate for him the proportion of your valuation up to the Year of Jubilee[a], and on that day he shall give your valuation as a holy offering to Yahweh.
translation:
  language: ta
  text: அப்போது ஆசாரியன், யூபிலி ஆண்டு வரையிலான உன் மதிப்பீட்டுத் தொகையின் விகிதாசாரப் பங்கை அவனுக்காகக் கணக்கிட வேண்டும். அன்றே உன் மதிப்பீட்டுத் தொகையை யாவேக்குப் பரிசுத்தமான காணிக்கையாகக் கொடுக்க வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, சொல்லுக்குச் சொல்: “யாவேக்குப் பரிசுத்தமானது.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחִשַּׁב
  choice: அப்போது ... கணக்கிட வேண்டும்
  rationale: פיעל வடிவிலுள்ள חשׁב இங்கு தொகையைக் கணக்கிடுவதைக் குறிக்கிறது; தொடர்ச்சியை நவீன தமிழில் இயல்பாகக் காட்ட ‘அப்போது’ பயன்படுத்தப்பட்டது.
- source_word: לּוֹ
  choice: அவனுக்காக
  rationale: இந்த இடத்திலுள்ள தத்திவுப் பெயர்ச்சுட்டு, சம்பந்தப்பட்ட மனிதனுக்காக ஆசாரியன் தொகையைக் கணக்கிடுவதைச் சுட்டுகிறது.
- source_word: מִכְסַת
  choice: உரிய பங்கு
  rationale: מִכְסָה என்பது நிர்ணயிக்கப்பட்ட தொகை அல்லது விகிதாசாரப் பங்கைக் குறிக்கும்; யூபிலி ஆண்டு வரை கணக்கிடப்படும் சூழலில் ‘உரிய பங்கு’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: הָעֶרְכְּךָ
  choice: உன் மதிப்பீட்டுத் தொகை
  rationale: லேவியராகமம் 27-இல் עֵרֶךְ நேர்ச்சை தொடர்பான தொழில்நுட்ப மதிப்பீட்டைக் குறிக்கிறது; இரண்டாம் நபர் ஒருமை பின்னொட்டும் பாதுகாக்கப்பட்டுள்ளது.
- source_word: עַד שְׁנַת הַיֹּבֵל
  choice: யூபிலி ஆண்டு வரையிலான
  rationale: கணக்கீட்டின் இறுதி காலவரம்பை இது குறிக்கிறது; ‘யூபிலி ஆண்டு’ நிறுவனப் பெயராகத் தெளிவாக உள்ளது.
- source_word: וְנָתַן
  choice: அவன் ... கொடுக்க வேண்டும்
  rationale: נתן என்பதன் அடிப்படைப் பொருள் ‘கொடு’; எபிரெயத்தில் எழுவாய் மறைமுகமாக இருப்பதால், சூழலில் காணிக்கையளித்த மனிதனைச் சுட்டும் ‘அவன்’ பயன்படுத்தப்பட்டது.
- source_word: בַּיּוֹם הַהוּא
  choice: அன்றே
  rationale: ‘அந்த நாளில்’ என்ற நேரப் பொருளைச் சுருக்கமாகவும் இயல்பான தமிழிலும் தெரிவிக்கிறது; உடனடி செலுத்துதலையும் சூழலுக்கு ஏற்ப உணர்த்துகிறது.
- source_word: קֹדֶשׁ לַיהוָה
  choice: யாவேக்குப் பரிசுத்தமான காணிக்கையாக
  rationale: சொல்லுக்குச் சொல் ‘யாவேக்குப் பரிசுத்தமானது’; கொடுக்கப்படும் தொகையின் வழிபாட்டுச் சார்ந்த அர்ப்பணிப்பை இயல்பான தமிழில் தெளிவுபடுத்த ‘காணிக்கையாக’ சேர்க்கப்பட்டது, முறையான வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரான יהוה ஒரு பட்டத்தால் மாற்றப்படாமல், தமிழில் பொதுவாக அறியத்தக்க ஒலிபெயர்ப்பாக வழங்கப்பட்டது.
theological_decisions:
- issue: וְנָתַן என்பதன் மறைமுக எழுவாய்
  choice: 'நிலத்தை அர்ப்பணித்த மனிதனே தொகையைக் கொடுப்பவன்: ‘அவன் ... கொடுக்க வேண்டும்’'
  alternative: ஆசாரியனே கொடுப்பவன்
  rationale: ஆசாரியன் கணக்கிடுகிறார்; முந்தைய சூழலில் அர்ப்பணித்த அல்லது மீட்டுக்கொள்ளும் மனிதனே மதிப்பீட்டுத் தொகையைச் செலுத்துகிறான். இருப்பினும் எபிரெயத்தில் எழுவாய் வெளிப்படையாகக் குறிப்பிடப்படவில்லை.
- issue: קֹדֶשׁ לַיהוָה என்பதன் வெளிப்பாடு
  choice: ‘யாவேக்குப் பரிசுத்தமான காணிக்கையாக’ என்று வழிபாட்டுச் சார்ந்த அர்ப்பணிப்பை வெளிப்படுத்துதல்
  alternative: ‘யாவேக்குப் பரிசுத்தமானது’ என்ற முறையான மொழிபெயர்ப்பு
  rationale: ‘காணிக்கை’ என்பது கொடுக்கப்படும் மதிப்பீட்டுத் தொகையின் அர்ப்பணிக்கப்பட்ட தன்மையைத் தமிழில் தெளிவாக்குகிறது; மூலத்தின் சுருக்கமான வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டவிதிக்கேற்ற கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டது. ‘மதிப்பீட்டுத் தொகை’ தொழில்நுட்பச் சொல்லாகவும், ‘உரிய பங்கு’ விகிதாசாரக் கணக்கீட்டை இயல்பாகக் காட்டவும் பயன்படுத்தப்பட்டன.
