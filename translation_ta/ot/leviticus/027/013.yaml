  text: But if he does redeem it[a], then he shall add a fifth to your valuation.
translation:
  language: ta
  text: ஆனால் அவன் அதை மீட்டுக்கொண்டால்[a], உன் மதிப்பீட்டுத் தொகையுடன் அதன் ஐந்தில் ஒரு பங்கைச் சேர்த்துக் கொடுக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவன் அதை மீட்டுக்கொண்டால்” அல்லது “அவன் அதை நிச்சயமாக மீட்டுக்கொண்டால்” என்றும் மொழிபெயர்க்கலாம். எபிரெய மொழியில் வினையை வலியுறுத்த, ஒரே வேரிலிருந்து வந்த வினைமுதல் வடிவமும் வினைமுற்றும் சேர்த்துப் பயன்படுத்தப்பட்டுள்ளன.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: ஆனால் ... விரும்பினால்
  rationale: முந்தைய வசனத்திலுள்ள மாற்று ஏற்பாட்டுக்கு மாறான நிபந்தனையை இயல்பான தமிழில் அறிமுகப்படுத்துகிறது.
- source_word: גָּאֹל יִגְאָלֶנָּה
  choice: அதை மீட்டுக்கொள்ளவே விரும்பினால்
  rationale: גאל என்பதன் infinitive absolute + finite verb அமைப்பு தரும் வலியுறுத்தலை ‘வே’ காட்டுகிறது; சூழலில் இது உரிமையாளர் விலைகொடுத்து விலங்கைத் திரும்பப் பெறும் தெரிவைக் குறிக்கிறது.
- source_word: וְיָסַף
  choice: சேர்த்துக் கொடுக்க வேண்டும்
  rationale: சட்டவிதியின் கட்டாயமான விளைவை நவீன தமிழில் தெளிவாகத் தெரிவிக்கிறது.
- source_word: חֲמִישִׁתוֹ
  choice: அதன் ஐந்தில் ஒரு பங்கை
  rationale: மதிப்பீட்டின் மீது சேர்க்கப்படும் இருபது சதவீதப் பங்கைத் தெளிவாகக் குறிக்கிறது; எபிரெயச் சுட்டுப்பெயரின் தொடர்பை ‘அதன்’ பாதுகாக்கிறது.
- source_word: עַל עֶרְכֶּךָ
  choice: நீ மதிப்பிட்ட தொகையுடன்
  rationale: עֵרֶךְ இங்கு ஆசாரியன் நிர்ணயித்த மதிப்பைக் குறிக்கிறது; இரண்டாம் நபர் ஒருமை ஆண்பால் பின்னொட்டை நேரடியாக ‘நீ’ எனக் காக்கிறது.
