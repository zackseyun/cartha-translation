base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/002.yaml
  text: 'Speak to the sons of Israel and say to them: When a man makes a special vow, involving the valuation of persons to Yahweh,'
translation:
  language: ta
  text: '“இஸ்ரவேல் மக்களிடம் பேசு; அவர்களிடம் சொல்: ஒருவன் மனிதர்களுக்கான உன் மதிப்பீட்டின்படி யாவேக்கு ஒரு சிறப்பான நேர்த்திக்கடன் செய்யும்போது[a],”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒருவன் மனிதர்களைப் பற்றிய உன் மதிப்பீட்டின்படி யாவேக்கு ஒரு விசேஷமான நேர்த்திக்கடன் செய்யும்போது.” ‘உன் மதிப்பீடு’ அடங்கிய எபிரெயத் தொடர் கடினமானது; அடுத்த வசனங்களில் நிர்ணயிக்கப்படும் மதிப்புத் தொகைகளுக்கு உட்பட்ட மனிதர்களைப் பற்றிய நேர்த்திக்கடனே இதன் பொருள்.
    reason: alternative_reading
lexical_decisions:
- source_word: דַּבֵּר
  choice: பேசி
  rationale: פיעל கட்டளை வடிவத்தின் அதிகாரபூர்வமான அறிவுறுத்தல் தொனியை இயல்பான தமிழில் காக்கிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: சொல்லுக்குச் சொல் வடிவம் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு உடன்படிக்கை மக்களைக் கூட்டாகக் குறிக்கிறது; ‘இஸ்ரவேல் மக்கள்’ நவீனத் தமிழில் இயல்பாகவும் உள்ளடக்கத்தைத் துல்லியமாகவும் தருகிறது.
- source_word: אִישׁ
  choice: ஒருவன்
  rationale: எபிரெய ஆண்பால் ஒருமைச் சட்டச் சூத்திரத்தைத் தக்கவைக்கிறது; இவ்வடிவம் பிரதிநிதித்துவப் பொதுப்பொருளையும் கொள்ளக்கூடும்.
- source_word: יַפְלִא נֶדֶר
  choice: சிறப்பான ஒரு நேர்த்திக்கடன் செய்யும்போது
  rationale: הפליא என்பதன் விதிவிலக்கான அல்லது விசேஷமான செயல் என்ற நுணுக்கத்தையும் נדר என்பதன் நேர்ந்துகொள்ளும் கடன் பொருளையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְּעֶרְכְּךָ נְפָשֹׁת
  choice: ஆட்களை மதிப்பிடுவது தொடர்பாக
  rationale: இலக்கண ரீதியாகக் கடினமான தொடரை அடுத்த வசனங்களில் வரும் நிர்ணயிக்கப்பட்ட மதிப்புத் தொகைகளோடு இணைத்து வாசிக்கச் செய்கிறது; ‘ஆத்துமாக்கள்’ என்று தவறாகப் புரிந்துகொள்ளாமல் மனிதர்களையே குறிக்கிறது.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: மூலத்தில் நேரடியாக உள்ள உடன்படிக்கைப் பெயரான יהוה என்பதை பட்டப்பெயரால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் உள்ள தனிப்பட்ட உடன்படிக்கைப் பெயரை வெளிப்படையாகத் தக்கவைக்கிறது; பட்டப்பெயரைப் பயன்படுத்தி அதை மறைக்கவில்லை.
- issue: אִישׁ என்ற ஆண்பால் சட்ட ஒருமை
  choice: ஒருவன்
  alternative: ஒருவர்
  rationale: மூலத்தின் ஆண்பால் ஒருமை வடிவத்தைத் தக்கவைக்கிறது; அதேவேளை இத்தகைய சட்ட மொழி பிரதிநிதித்துவப் பொதுப்பயன்பாடாக இருக்கக்கூடும் என்பதை மொழிபெயர்ப்பு மறுப்பதில்லை.
- issue: בְּעֶרְכְּךָ נְפָשֹׁת என்ற கடினமான தொடரின் பொருள்
  choice: ஆட்களை மதிப்பிடுவது தொடர்பாக
  alternative: ஆட்களை உன் மதிப்பீட்டின்படி
  rationale: இரண்டாம் நபர் ஒருமை பின்னொட்டை நேரடியாகத் தமிழாக்குவது மோசே தனிப்பட்ட முறையில் ஒவ்வொரு மதிப்பையும் நிர்ணயிப்பதாகத் தவறாகத் தோன்றலாம். முதன்மை உரை தொடர்பைத் தெளிவாக்குகிறது; அடிக்குறிப்பு சொற்சார்ந்த மாற்றைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டப்பகுதிக்கேற்ற கண்ணியமான கட்டளைத் தொனி பயன்படுத்தப்பட்டுள்ளது. ‘நேர்த்திக்கடன்’ என்பது சமயச் சூழலில் பரவலாகப் புரியக்கூடிய சொல். கடினமான எபிரெயத் தொடரின் தெளிவின்மை முதன்மை உரையிலும் அடிக்குறிப்பிலும் தேவையற்ற கோட்பாட்டு தீர்மானமின்றி பாதுகாக்கப்பட்டுள்ளது.
