  yaml_path: translation/ot/leviticus/027/029.yaml
  text: No devoted thing that is devoted from man may be redeemed[b][a]; it must surely be put to death.
translation:
  language: ta
  text: மனிதர்களில் தடைசெய்து ஒதுக்கப்பட்ட எவரும்[a][b] மீட்கப்படக் கூடாது; அவர் நிச்சயமாகக் கொல்லப்பட வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு வகையில்: “மனிதர்களில் அழிவுக்கென்று ஒதுக்கப்பட்ட எவரும் மீட்கப்படக் கூடாது; அவர் நிச்சயமாகக் கொல்லப்பட வேண்டும்.”'
    reason: alternative_reading
  - marker: b
    text: “மனிதர்களில்” என்பது மனித இனத்தைச் சேர்ந்த ஒருவரைக் குறிக்கிறது. இங்குள்ள எபிரெயச் சொற்றொடர், மனிதர்களில் ஒருவரைத் தடைசெய்து ஒதுக்குவதைச் சுட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵרֶם
  choice: அர்ப்பணித்து விலக்கப்பட்டவர்
  rationale: חֵרֶם என்பது திரும்பப் பெற முடியாதவாறு அர்ப்பணிக்கப்பட்டதையும் தடையின்கீழ் வைக்கப்பட்டதையும் குறிக்கும் தொழில்நுட்பச் சொல். மִן הָאָדָם என்பதால் இங்கு மனிதரே குறிக்கப்படுகிறார்; ஆகவே தமிழில் இயல்பாக மனிதக் குறிப்பை வெளிப்படுத்தி, ‘அர்ப்பணித்து விலக்கப்பட்டவர்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: יָחֳרַם
  choice: அர்ப்பணித்து விலக்கப்பட்ட
  rationale: חרם என்ற பெயர்ச்சொல்லுக்கும் வினைச்சொல்லுக்கும் உள்ள சொல்லியல் தொடர்பை இயன்றவரை காக்கிறது; அதேவேளையில் ‘அழிவுக்காக’ என்று நேரடியாக விரிவுபடுத்தாமல் மூலத்தின் சட்ட-சமயப் பதற்றத்தைப் பாதுகாக்கிறது.
- source_word: מִן הָאָדָם
  choice: மனிதர்களில்
  rationale: இங்கு אָדָם தனிப்பட்ட ஆணை மட்டும் அல்லாமல் மனித இனத்தை வகையாகக் குறிக்கிறது. ‘மனிதர்களில்’ என்பது ‘மனிதர்களுள்/மனிதர்களிலிருந்து’ என்ற சூழல்சார் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: יִפָּדֶה
  choice: மீட்கப்படக் கூடாது
  rationale: פדה என்பதன் மீட்டல் அல்லது மீட்புவிலை கொடுத்து விடுவித்தல் என்ற சட்ட-சமயப் பொருளை ‘மீட்கப்படுதல்’ பாதுகாக்கிறது; לֹא உடன் இது அனுமதியின்மையைக் குறிக்கிறது.
- source_word: מוֹת יוּמָת
  choice: நிச்சயமாகக் கொல்லப்பட வேண்டும்
  rationale: வினையெச்ச முழுவடிவமும் வரையறுக்கப்பட்ட வினையும் சேர்ந்த எபிரெய தீவிரப்படுத்தலை ‘நிச்சயமாக’ வெளிப்படுத்துகிறது; செயப்பாட்டு வடிவமும் காக்கப்படுகிறது.
theological_decisions:
- issue: மனிதரைச் சார்ந்த சட்ட-சமயச் சூழலில் חֵרֶם என்பதன் பொருள்
  choice: ‘அர்ப்பணித்து விலக்கப்பட்டவர்’ என்ற தொழில்நுட்பப் பொருளை முதன்மை உரையில் வைத்தல்
  alternative: ‘அழிவுக்கென்று ஒதுக்கப்பட்டவர்’ அல்லது ‘தடையின்கீழ் வைக்கப்பட்டவர்’
  rationale: חרם / פדה என்ற அர்ப்பணிப்பு-மீட்பு சொற்களையும் இறுதியில் வரும் மரணக் கட்டளையையும் வசனம் ஒன்றாக நிறுத்துகிறது. ‘அழிவுக்கென்று’ என்று முதன்மை உரையிலேயே சேர்ப்பது அந்தப் பதற்றத்தை முன்கூட்டியே தீர்த்துவிடும்; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: אָדָם என்பதையும் חֵרֶם என்பதையும் மனிதக் குறிப்பாக வெளிப்படுத்துதல்
  choice: ‘மனிதர்களில் ... எவரும்’
  alternative: ‘மனிதரிலிருந்து அர்ப்பணிக்கப்பட்ட எதுவும்’
  rationale: மூலத்தின் חֵרֶם இலக்கணரீதியாக பொருள் அல்லது நபரைக் குறிக்கக்கூடியது; ஆனால் מִן הָאָדָם மற்றும் ‘கொல்லப்பட வேண்டும்’ என்பவை இங்கு மனிதரைக் குறிக்கின்றன. இயல்பான தமிழுக்காக ‘எவரும்’ பயன்படுத்தப்பட்டு, பெயர்ச்சொல்லின் பரந்த வடிவம் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
