  register: நவீனத் தரத் தமிழில், சட்டக் கட்டளைக்கேற்ற கண்ணியமான மற்றும் நேரடியான நடை பயன்படுத்தப்பட்டுள்ளது. ‘அர்ப்பணித்து விலக்கப்பட்ட’ என்பது חרם என்பதன் அர்ப்பணிப்பு மற்றும் தடை ஆகிய இரு கூறுகளையும் சுருக்கமாகத் தக்கவைக்கிறது; ‘எவரும்’ மனிதக் குறிப்பைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
