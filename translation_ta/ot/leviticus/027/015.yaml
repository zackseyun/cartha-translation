  source_fidelity: 'மூலத்தின் முக்கியப் பொருள் நன்றாகப் பாதுகாக்கப்பட்டுள்ளது: அர்ப்பணித்தவர் தம் வீட்டை மீட்டுக்கொள்வதும், மதிப்பீட்டுத் தொகைக்கு ஐந்தில் ஒரு பங்கைச் சேர்ப்பதும், அதன் விளைவாக வீடு அவருக்குச் சொந்தமாவதும் தெளிவாக உள்ளது. ஆனால் יִגְאַל என்பது ‘மீட்டுக்கொள்ள விரும்பினால்’ என்பதைக் காட்டிலும் நேரடியான சட்டநடை நிபந்தனையான ‘மீட்டுக்கொண்டால்/மீட்டுக்கொள்ளுமானால்’ என மொழிபெயர்க்கப்பட வேண்டும்; மூலத்தில் ‘விரும்புதல்’ இல்லை. மேலும் עָלָיו என்பது மதிப்பிடப்பட்ட வெள்ளித் தொகைக்கு மேலாகச் சேர்த்தல் என்பதைக் குறிக்கிறது; ‘அதனுடன்’ என்பதன் குறிப்பு தெளிவற்றது.'
