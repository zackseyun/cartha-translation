base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/015.yaml
  text: And if the one who consecrated it redeems his house[a], then he shall add a fifth of the silver of your valuation to it[b], and it shall be his.
translation:
  language: ta
  text: தன் வீட்டைப் பரிசுத்தமாக அர்ப்பணித்தவன்[a] அதை மீட்டுக்கொள்ளுமானால், நீ மதிப்பிட்ட வெள்ளித் தொகைக்கு மேலாக ஐந்தில் ஒரு பங்கை அவன் செலுத்த வேண்டும்[b]; அது அவனுடையதாகும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பரிசுத்தமாக ஒதுக்கிவைத்தவன்’ அல்லது ‘அர்ப்பணித்தவன்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, ஆசாரியன் நிர்ணயித்த வெள்ளி மதிப்பீட்டுத் தொகைக்கு மேலாக அதன் ஐந்தில் ஒரு பங்கைக் கூடுதலாகச் செலுத்த வேண்டும்.
    reason: cultural_note
lexical_decisions:
- source_word: הַמַּקְדִּישׁ
  choice: பரிசுத்தமாக அர்ப்பணித்தவன்
  rationale: קדשׁ என்ற சொல்லின் வழிபாட்டுச் சூழலிலான ‘பரிசுத்தமானதாக ஒதுக்கிவைத்தல்’ என்ற கருத்தையும், நவீன தமிழின் இயல்பான நடையையும் இச்சொற்றொடர் காக்கிறது.
- source_word: יִגְאַל
  choice: மீட்டுக்கொள்ள விரும்பினால்
  rationale: இங்கு גאל என்பது நிர்ணயிக்கப்பட்ட தொகையைச் செலுத்தி வீட்டை மீண்டும் தன் உடைமையாக்குவதைக் குறிக்கிறது. எபிரெய வினை நிபந்தனை வாக்கியத்தில் வருவதால், தமிழில் ‘விரும்பினால்’ என்பது நோக்கத்தையும் நிபந்தனையையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בֵּיתוֹ
  choice: தன் வீட்டை
  rationale: சட்டரீதியான சொத்து மதிப்பீட்டைப் பற்றிய சூழலில் ‘வீடு’ என்பது மூலத்தின் நேரடியான மற்றும் துல்லியமான பொருள்.
- source_word: וְיָסַף
  choice: சேர்த்துக் கொடுக்க வேண்டும்
  rationale: நிபந்தனை நிறைவேறும்போது செய்ய வேண்டிய கட்டாய நடவடிக்கையை நவீன தமிழ் சட்டநடையில் தெளிவாகக் காட்டுகிறது.
- source_word: חֲמִישִׁית
  choice: ஐந்தில் ஒரு பங்கு
  rationale: மூலத்தில் உள்ள one-fifth என்ற விகிதத்தை நவீன தமிழில் தெளிவாகச் சொல்கிறது; ‘இருபது சதவீதம்’ என்ற நவீனமயமாக்கலைத் தவிர்க்கிறது.
- source_word: כֶּסֶף עֶרְכְּךָ
  choice: நீ மதிப்பிட்ட வெள்ளித் தொகை
  rationale: כֶּסֶף என்பதன் ‘வெள்ளி’ என்ற concrete பொருளையும், இரண்டாம் நபர் ஒருமையில் கூறப்பட்ட ஆசாரியரின் மதிப்பீட்டையும் காக்கிறது.
- source_word: עָלָיו
  choice: அதனுடன்
  rationale: மதிப்பீட்டுத் தொகைக்கு மேலாக ஐந்தில் ஒரு பங்கைச் சேர்ப்பது என்ற கூட்டல் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וְהָיָה לוֹ
  choice: அப்போது அது அவனுடையதாகும்
  rationale: பணம் செலுத்தியதன் விளைவாக வீடு அவனுக்கு உரியதாகும் என்பதை நேரடியாகக் கூறுகிறது.
theological_decisions:
- issue: தேவனுக்கென ஒரு சொத்தைப் பரிசுத்தமாக ஒதுக்குவதற்கான வழிபாட்டுச் சொல்
  choice: பரிசுத்தமாக அர்ப்பணித்தவன்
  alternative: அர்ப்பணித்தவன்; பரிசுத்தப்படுத்தியவன்
  rationale: இந்த வீடு லேவியராகமம் 27-இன் நேர்த்திக்கடன் மற்றும் மதிப்பீட்டு அமைப்பில் கர்த்தருக்கெனப் பரிசுத்தமாக ஒதுக்கப்படுகிறது. ‘பரிசுத்தமாக அர்ப்பணித்தவன்’ என்பது வழிபாட்டு மற்றும் சட்டரீதியான இரு நுணுக்கங்களையும் காக்கிறது; குறிப்பிட்ட சமயப் பிரிவின் கோட்பாட்டைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான சட்ட-வழிபாட்டு நடை பயன்படுத்தப்பட்டுள்ளது. ‘வெள்ளித் தொகை’ மூலத்தின் concrete சொல்லாட்சியைப் பேணுகிறது; ‘சேர்த்துக் கொடுக்க வேண்டும்’ கட்டாய விதியைத் தெளிவாக்குகிறது. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
