base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/028.yaml
  text: However[a], every devoted thing that a man devotes to Yahweh from all that belongs to him—whether human or animal, or from the field of his inherited property—shall not be sold or redeemed. Every devoted thing is most holy to Yahweh.
translation:
  language: ta
  text: ஆனால், ஒருவன் தனக்குச் சொந்தமான எல்லாவற்றிலிருந்தும்—மனிதரையோ மிருகத்தையோ, அல்லது தனது பரம்பரைச் சொத்தான வயலையோ—யெகோவாவுக்கு முழுமையாக அர்ப்பணிக்கும்[a] எதுவும் விற்கப்படவோ மீட்கப்படவோ கூடாது. முழுமையாக அர்ப்பணிக்கப்பட்ட ஒவ்வொன்றும் யெகோவாவுக்கு மிகப் பரிசுத்தமானது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “முழுமையாக அர்ப்பணித்தல்” என்பது எபிரெய மொழியில் ḥērem (חֵרֶם) என்ற தொழில்நுட்பச் சொல்லுடன் தொடர்புடையது. இது யெகோவாவுக்கென்று திரும்பப்பெற முடியாதபடி ஒதுக்கப்பட்டதைக் குறிக்கிறது; சில சூழல்களில் தடைக்கு உட்படுத்துதல் அல்லது அழிவுக்கென்று ஒப்புக்கொடுத்தல் என்ற பொருளையும் கொண்டிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: ஆனால்
  rationale: முந்தைய மீட்பு விதிகளிலிருந்து வேறுபடும் கட்டுப்பாட்டை இயல்பான தமிழில் குறிக்கிறது.
- source_word: חֵרֶם / יַחֲרִם
  choice: முழுமையாக அர்ப்பணிக்கப்பட்டது / முழுமையாக அர்ப்பணிக்கிறான்
  rationale: யெகோவாவுக்கென்று மாற்ற முடியாதபடி ஒதுக்கிவைக்கப்படும் ஒன்றைக் குறிக்கும் தொழில்நுட்பச் சொல்லின் மையப் பொருளைத் தருகிறது; அழிப்பு அல்லது தடை என்ற சாத்தியமான நுண்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: אִישׁ
  choice: ஒருவன்
  rationale: எபிரெய சட்ட நடையின் ஆண்பால் ஒருமையைத் தக்கவைத்தபடியே இயல்பான தமிழை வழங்குகிறது.
- source_word: לַיהוָה
  choice: யெகோவாவுக்கு
  rationale: மூலத்தில் காணப்படும் יהוה என்ற தனிப்பெயரைத் தமிழில் பெயராகவே வெளிப்படுத்துகிறது.
- source_word: מִכָּל אֲשֶׁר לוֹ
  choice: தனக்குச் சொந்தமான எல்லாவற்றிலிருந்தும்
  rationale: அர்ப்பணிக்கப்படும் பொருள் அவனுடைய உடைமைகளிலிருந்து எடுக்கப்படுவதைத் தெளிவாகக் காட்டுகிறது.
- source_word: מֵאָדָם וּבְהֵמָה
  choice: மனிதரையோ மிருகத்தையோ
  rationale: மனிதர் மற்றும் மிருகம் என்ற மூலத்தின் இணையான வகைப்பாட்டைத் தெளிவாகத் தக்கவைக்கிறது.
- source_word: וּמִשְּׂדֵה אֲחֻזָּתוֹ
  choice: அல்லது தனது பரம்பரைச் சொத்தான வயலையோ
  rationale: אֲחֻזָּה என்பது குலவழியாகக் கிடைத்த நிலவுடைமையைக் குறிக்கும் சட்ட நுண்பொருளை வெளிப்படுத்துகிறது.
- source_word: לֹא יִמָּכֵר וְלֹא יִגָּאֵל
  choice: விற்கப்படவோ மீட்கப்படவோ கூடாது
  rationale: விற்பனைக்கும் சட்டரீதியான மீட்புக்கும் விதிக்கப்பட்ட இரட்டைத் தடையை இயல்பாகத் தருகிறது.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: மிகப் பரிசுத்தமானது
  rationale: எபிரெய மொழியின் உயர்நிலைப் பரிசுத்தத்தைக் குறிக்கும் அமைப்பை நவீன, கண்ணியமான தமிழில் தருகிறது.
theological_decisions:
- issue: חֵרֶם என்ற சொல்லின் சட்ட மற்றும் இறையியல் பொருள்
  choice: முதன்மை உரையில் ‘முழுமையாக அர்ப்பணிக்கப்பட்டது’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: அழிவுக்கென்று ஒப்புக்கொடுக்கப்பட்டது; தடைக்கு உட்படுத்தப்பட்டது
  rationale: இந்த வசனத்தின் உடனடிக் கவனம் விற்கவோ மீட்கவோ முடியாத முழுமையான ஒதுக்கீட்டிலும் அதன் மிகப் பரிசுத்த நிலையிலும் உள்ளது. ஆயினும், இச்சொல் வேறு சூழல்களில் தடை அல்லது அழிப்பு என்ற பொருளையும் ஏற்கக்கூடும் என்பதால் அந்தத் தெளிவின்மை அடிக்குறிப்பில் வைக்கப்படுகிறது.
- issue: மனிதர் அர்ப்பணிக்கப்படுவது குறித்த உரையின் பதற்றம்
  choice: ‘மனிதரையோ மிருகத்தையோ’ என்ற வகைப்பாடு மாற்றமின்றித் தக்கவைக்கப்பட்டது.
  alternative: மனிதரைத் தவிர்த்து உடைமைகளை மட்டும் குறிப்பிடுதல்
  rationale: மூலம் மனிதர், மிருகம், பரம்பரை வயல் ஆகியவற்றை வெளிப்படையாகப் பட்டியலிடுகிறது. அடுத்த வசனத்தின் விளக்கத்தை இவ்வசனத்திற்குள் முன்கூட்டியே சேர்க்காமல் மூலத்தின் சட்ட மற்றும் இறையியல் பதற்றம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்ட உரைக்கேற்ற கண்ணியமான மற்றும் தெளிவான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பரம்பரைச் சொத்தான வயல்’ என்பது பண்டைய இஸ்ரவேலின் மரபுரிமை நிலம் என்ற சட்டக் கருத்தை சாதாரண வாசகருக்குப் புரியுமாறு தருகிறது; חֵרֶם என்பதன் பலவகை நுண்பொருள் பிரதான உரையில் மிகையாக விளக்கப்படாமல் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
