  text: and the priest shall assess it[a], whether good or bad; as the priest assesses it, so it shall be.
translation:
  language: ta
  text: ஆசாரியன் அந்த மிருகம் நல்லதோ கெட்டதோ என்று மதிப்பிடுவான். ஆசாரியன் அதற்கு என்ன மதிப்பு நிர்ணயிக்கிறானோ, அதுவே அதன் மதிப்பாகும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மூலத்தில் சொற்சொல்லாக, “ஆசாரியனே, உமது மதிப்பீட்டின்படி அப்படியே இருக்கும்” என்று உள்ளது. ஆசாரியன் நிர்ணயிக்கும் மதிப்பே செல்லுபடியாகும் என்பது இதன் பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶעֱרִיךְ
  choice: மதிப்பிட வேண்டும்
  rationale: ערך என்பதன் ஹிஃபீல் வடிவம் இங்கு நேர்ந்துகொடுக்கப்பட்ட மிருகத்தின் மதிப்பை அதிகாரபூர்வமாக நிர்ணயிப்பதைக் குறிக்கிறது; சட்ட அறிவுறுத்தலுக்கு இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: הַכֹּהֵן
  choice: ஆசாரியன்
  rationale: லேவியராகமத்தின் சட்டப் பின்னணியில் כֹּהֵן என்பதற்கான வழக்கமான, தெளிவான தமிழ் மொழிபெயர்ப்பு.
- source_word: אֹתָהּ
  choice: அந்த மிருகம்
  rationale: பெண்பால் ஒருமைச் சுட்டுப்பெயர் முந்தைய வசனத்திலுள்ள மிருகத்தைக் குறிக்கிறது; தமிழில் குறிப்பைத் தெளிவுபடுத்த பெயர்ச்சொல் வெளிப்படையாக வழங்கப்படுகிறது.
- source_word: בֵּין טוֹב וּבֵין רָע
  choice: நல்லதா கெட்டதா என்று
  rationale: ‘நல்லதற்கும் கெட்டதற்கும் இடையில்’ என்ற சொற்சொல் வடிவத்தின் தர மதிப்பீட்டுப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: כְּעֶרְכְּךָ הַכֹּהֵן
  choice: ஆசாரியன் அதற்கு என்ன மதிப்பு நிர்ணயிக்கிறானோ
  rationale: எபிரெயத்தில் இரண்டாம் நபர் ஒருமை உருபு இருந்தாலும், பின்வரும் ‘ஆசாரியன்’ என்பது அதிகாரபூர்வ மதிப்பீடு அவனுடையது என்பதைத் தெளிவாக்குகிறது; மூலத்தின் இலக்கணத் தனித்தன்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: כֵּן יִהְיֶה
  choice: அதுவே அதன் மதிப்பாக இருக்கும்
  rationale: ஆசாரியனின் மதிப்பீடே செல்லுபடியாகவும் கட்டுப்படுத்துவதாகவும் இருக்கும் என்ற சட்டப் பொருளைத் தெளிவாகக் கூறுகிறது.
