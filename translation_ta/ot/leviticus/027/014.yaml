  text: וְ/אִ֗ישׁ כִּֽי יַקְדִּ֨שׁ אֶת בֵּית֥/וֹ קֹ֨דֶשׁ֙ לַֽ/יהוָ֔ה וְ/הֶעֱרִיכ/וֹ֙ הַ/כֹּהֵ֔ן בֵּ֥ין ט֖וֹב וּ/בֵ֣ין רָ֑ע כַּ/אֲשֶׁ֨ר יַעֲרִ֥יךְ אֹת֛/וֹ הַ/כֹּהֵ֖ן כֵּ֥ן יָקֽוּם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/014.yaml
  text: And if a man consecrates his house as holy to Yahweh[a], then the priest shall assess it, whether good or bad; as the priest assesses it[b], so it shall stand.
translation:
  language: ta
  text: ஒருவன் தன் வீட்டை யாவேவுக்குப் பரிசுத்தமானதாக அர்ப்பணித்தால், அது நல்லதாயிருந்தாலும் மோசமானதாயிருந்தாலும் ஆசாரியன் அதை மதிப்பிடுவான்[a]. ஆசாரியன் அதை எவ்வாறு மதிப்பிடுகிறாரோ[b], அந்த மதிப்பீடே நிலைத்திருக்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நல்லதாயிருந்தாலும் மோசமானதாயிருந்தாலும்” என்பது வீட்டின் நிலை அல்லது தரம் எப்படியிருந்தாலும் ஆசாரியன் அதற்கேற்ப மதிப்பிடுவதைச் சுட்டும் எபிரெய மரபுத்தொடர்.
    reason: cultural_note
  - marker: b
    text: “மதிப்பிடுகிறாரோ” என்பதை “விலை நிர்ணயிக்கிறாரோ” அல்லது “மதிப்பீடு செய்கிறாரோ” என்றும் மொழிபெயர்க்கலாம்; இதே எபிரெய வினை இவ்வசனத்தில் இருமுறை வருகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ כִּי
  choice: ஒருவன் … அர்ப்பணித்தால்
  rationale: இது ஒரு நிபந்தனை சார்ந்த சட்டச் சூழலை அறிமுகப்படுத்துகிறது. אִישׁ என்பதன் ஒருமை ஆண்பால் வடிவத்தைத் தக்கவைத்து, כִּי இயல்பான தமிழ் நிபந்தனை விகுதியால் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: יַקְדִּשׁ
  choice: பரிசுத்தமானதாக அர்ப்பணித்தால்
  rationale: קדשׁ என்பதன் ஹிஃபீல் வடிவம் ஒன்றைப் புனித நோக்கத்திற்காகத் தனியே ஒதுக்குவதைக் குறிக்கிறது. ‘அர்ப்பணித்தல்’ செயலைத் தெளிவாக்க, ‘பரிசுத்தமானதாக’ என்பது அதன் புனித நிலையைத் தக்கவைக்கிறது.
- source_word: בֵּיתוֹ
  choice: தன் வீட்டை
  rationale: இங்கு மதிப்பிடப்படும் கட்டடச் சொத்தையே בַּיִת குறிக்கிறது; எனவே உணர்வுப்பூர்வமான ‘இல்லம்’ என்பதற்கு மாறாக ‘வீடு’ பொருத்தமானது.
- source_word: קֹדֶשׁ לַיהוָה
  choice: யாவேவுக்குப் பரிசுத்தமானதாக
  rationale: வீடு யாவேவுக்கெனப் புனிதமாக ஒதுக்கப்படுவதை இச்சொற்றொடர் தெரிவிக்கிறது. יהוה என்ற திருப்பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְהֶעֱרִיכוֹ
  choice: ஆசாரியன் மதிப்பிட வேண்டும்
  rationale: லேவியராகமம் 27-இல் ערך என்பதன் ஹிஃபீல் வடிவம் அதிகாரபூர்வமான ஆசாரிய மதிப்பீட்டைக் குறிக்கிறது. ‘மதிப்பிடுதல்’ நவீனத் தமிழில் இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: בֵּין טוֹב וּבֵין רָע
  choice: அது நல்லதா மோசமானதா என்பதை
  rationale: வீட்டின் தரம் அல்லது நிலை எப்படியிருந்தாலும் ஆசாரியன் அதைக் கணக்கில் கொள்ள வேண்டும் என்ற எபிரெய மரபுத்தொடரின் பரப்பை இந்த இயல்பான தமிழ் வடிவம் தக்கவைக்கிறது.
- source_word: כַּאֲשֶׁר יַעֲרִיךְ אֹתוֹ הַכֹּהֵן
  choice: ஆசாரியன் அதை எவ்வாறு மதிப்பிடுகிறானோ
  rationale: ஆசாரியனின் மதிப்பீடே தீர்மானமானது என்பதைத் தெரிவிப்பதோடு, ערך என்ற வினையின் மறுபயன்பாட்டையும் ‘மதிப்பிடு’ எனத் தக்கவைக்கிறது.
- source_word: כֵּן יָקוּם
  choice: அவ்வாறே அது நிலைபெறும்
  rationale: קום இங்கு ஆசாரியன் நிர்ணயித்த மதிப்பீடு செல்லுபடியாகவும் மாற்றமின்றியும் இருக்கும் என்ற சட்டப் பொருளைக் கொண்டுள்ளது. ‘நிலைபெறும்’ மூல உருவகத்தையும் சட்ட வலிமையையும் பாதுகாக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூல உரையில் நான்கெழுத்துத் திருப்பெயர் நேரடியாக வருகிறது. பொதுப்பட்டப் பெயராக மாற்றாமல் உடன்படிக்கையின் தனிப்பெயரைத் தக்கவைக்க ‘யாவே’ பயன்படுத்தப்பட்டுள்ளது.
- issue: வீட்டை ‘பரிசுத்தமானதாக’ அர்ப்பணிப்பதன் பொருள்
  choice: புனித நோக்கத்திற்காகத் தனியே ஒதுக்கப்படும் நிலையை வெளிப்படுத்துதல்
  alternative: வீடு தன்னியல்பிலேயே பரிசுத்தமாக மாறுகிறது என்று விளக்குதல்
  rationale: קֹדֶשׁ לַיהוָה என்பது யாவேவுக்கென அர்ப்பணிக்கப்பட்ட சட்ட-வழிபாட்டு நிலையைக் குறிக்கிறது; அதன் இயல்பில் நிகழும் மாற்றத்தை உரை தனியாக வரையறுப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்ட-வழிபாட்டு சூழலுக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘ஆசாரியன்’, ‘பரிசுத்தமானதாக’, ‘நிலைபெறும்’ ஆகியவை மூலத்தின் அதிகாரபூர்வத் தொனியைத் தக்கவைக்கின்றன; வாக்கிய அமைப்பு சாதாரண வாசகரும் எளிதில் புரிந்துகொள்ளும் வகையில் வைக்கப்பட்டுள்ளது.
