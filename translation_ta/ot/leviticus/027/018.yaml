base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/018.yaml
  text: But if he consecrates his field after the Jubilee[a], then the priest shall calculate the money for him according to the years remaining until the year of Jubilee[c][b], and it shall be deducted from your valuation.
translation:
  language: ta
  text: ஆனால், அவன் தனது வயலை யூபிலிக்குப் பிறகு[a] பரிசுத்தமாக ஒதுக்கிவைத்தால், யூபிலி ஆண்டு வரையுள்ள மீதமான ஆண்டுகளின் அடிப்படையில் ஆசாரியன் அவனுக்காகப் பணத்தொகையைக் கணக்கிட வேண்டும்[b]. அது உன் மதிப்பீட்டுத் தொகையிலிருந்து கழிக்கப்பட வேண்டும்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘யூபிலி ஆண்டுக்குப் பிறகு.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘ஆசாரியன் அவனுக்காக விலையை மதிப்பிட வேண்டும்.’
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘அது உன் நிர்ணயிக்கப்பட்ட மதிப்பிலிருந்து குறைக்கப்பட வேண்டும்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַר הַיֹּבֵל
  choice: யூபிலிக்குப் பிறகு
  rationale: אַחַר என்பது கால வரிசையில் ‘பிறகு’ என்பதைக் குறிக்கிறது; הַיֹּבֵל லேவியராகமத்தில் பெயரிடப்பட்ட யூபிலி ஏற்பாட்டையோ ஆண்டையோ குறிக்கிறது.
- source_word: יַקְדִּישׁ
  choice: பரிசுத்தமானதாக ஒதுக்கிவைத்தால்
  rationale: קדשׁ என்பது வயலை ஆண்டவருக்குரிய பரிசுத்தப் பொருளாகத் தனியே ஒதுக்குவதைச் சுட்டுகிறது. இச்சொற்றொடர் வழிபாட்டுச் சட்டப் பொருளையும் நவீனத் தமிழின் இயல்பையும் காக்கிறது.
- source_word: שָׂדֵהוּ
  choice: தனது வயலை
  rationale: மூன்றாம் நபர் ஆண்பால் ஒருமை உடைமைப் பின்னொட்டை இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: וְחִשַּׁב לוֹ הַכֹּהֵן אֶת הַכֶּסֶף
  choice: ஆசாரியன் அவனுக்கான தொகையைக் கணக்கிட வேண்டும்
  rationale: חשב இச்சட்டப் பொருளில் கணக்கிடுதல் அல்லது மதிப்பிடுதலைக் குறிக்கிறது; הַכֶּסֶף என்பது வெள்ளி எனச் சொற்பொருள் கொண்டாலும் இங்கு செலுத்த வேண்டிய பணத்தொகையைக் குறிக்கிறது.
- source_word: עַל פִּי הַשָּׁנִים הַנּוֹתָרֹת
  choice: மீதமான ஆண்டுகளின் அடிப்படையில்
  rationale: עַל־פִּי என்பதன் ‘அடிப்படையில்/ஏற்ப’ என்ற பொருளையும், யூபிலி வரை எஞ்சிய காலத்துக்கு விகிதமாகத் தொகை கணக்கிடப்படுவதையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עַד שְׁנַת הַיֹּבֵל
  choice: யூபிலி ஆண்டு வரையுள்ள
  rationale: கணக்கீட்டுக்குரிய மீதமான ஆண்டுகளின் இறுதி எல்லை யூபிலி ஆண்டு என்பதைப் பாதுகாக்கிறது.
- source_word: וְנִגְרַע
  choice: கழிக்கப்பட வேண்டும்
  rationale: Niphal வடிவம் மதிப்பீட்டுத் தொகையிலிருந்து குறைத்தல் அல்லது கழித்தலைக் குறிக்கிறது; சட்டப் பணப் பின்னணியில் ‘கழிக்கப்பட வேண்டும்’ துல்லியமாக உள்ளது.
- source_word: מֵעֶרְכֶּךָ
  choice: உன் மதிப்பீட்டுத் தொகையிலிருந்து
  rationale: எபிரெயத்தின் இரண்டாம் நபர் ஆண்பால் ஒருமைப் பின்னொட்டை ‘உன்’ என்று தக்கவைத்து, ערך குறிக்கும் நிர்ணயிக்கப்பட்ட மதிப்பை ‘மதிப்பீட்டுத் தொகை’ என்று தெளிவுபடுத்துகிறது.
theological_decisions:
- issue: מֵעֶרְכֶּךָ என்பதிலுள்ள இரண்டாம் நபர் ஒருமை
  choice: உன் மதிப்பீட்டுத் தொகையிலிருந்து
  alternative: அந்த மதிப்பீட்டுத் தொகையிலிருந்து
  rationale: எபிரெய உரையின் நேரடி சட்ட உரையாடல் நடையை மறைக்காமல் ‘உன்’ என்பதைத் தக்கவைக்கிறது.
- issue: יַקְדִּישׁ என்பதற்கான வழிபாட்டுச் சட்டச் சொல்
  choice: பரிசுத்தமானதாக ஒதுக்கிவைத்தால்
  alternative: அர்ப்பணித்தால்
  rationale: சொத்து ஆண்டவருக்குரிய பரிசுத்தப் பயன்பாட்டுக்கெனத் தனியே ஒதுக்கப்படுவதை வெளிப்படுத்துகிறது; குறிப்பிட்ட சமயப் பிரிவின் கருத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டநடையின் துல்லியமும் வழிபாட்டுச் சூழலின் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘யூபிலி’, ‘ஆசாரியன்’, ‘மதிப்பீட்டுத் தொகை’ ஆகிய சொற்கள் இப்பகுதியின் நிறுவன மற்றும் பொருளாதாரப் பின்னணியைத் தெளிவாகத் தருகின்றன.
