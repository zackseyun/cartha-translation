- from: ஒருவர் அறுபது வயது அல்லது அதற்கு மேற்பட்டவராக இருந்தால், ஆணுக்கு நீ நிர்ணயிக்கும் மதிப்பு பதினைந்து சேக்கலாகவும், பெண்ணுக்கு பத்து சேக்கலாகவும் இருக்க வேண்டும்.
