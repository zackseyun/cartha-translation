  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ֠/אִם מִ/בֶּן שִׁשִּׁ֨ים שָׁנָ֤ה וָ/מַ֨עְלָ/ה֙ אִם זָכָ֔ר וְ/הָיָ֣ה עֶרְכְּ/ךָ֔ חֲמִשָּׁ֥ה עָשָׂ֖ר שָׁ֑קֶל וְ/לַ/נְּקֵבָ֖ה עֲשָׂרָ֥ה שְׁקָלִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/007.yaml
  text: And if from sixty years old and upward[a], if male, then your valuation shall be fifteen shekels[b], and for the female ten shekels.
translation:
  language: ta
  text: ஒருவர் அறுபது வயது அல்லது அதற்கு மேற்பட்ட வயதுடையவராக இருந்தால், அவர் ஆணாக இருந்தால், நீ நிர்ணயிக்கும் மதிப்பு பதினைந்து சேக்கலாக இருக்கும்; பெண்ணாக இருந்தால், பத்து சேக்கலாக இருக்கும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִבֶּן שִׁשִּׁים שָׁנָה וָמַעְלָה
  choice: அறுபது வயது அல்லது அதற்கு மேற்பட்டவர்
  rationale: இந்த எபிரேய மரபுத்தொடர் அறுபது வயதில் தொடங்கி அதற்கு மேலான வயதுகளையும் உள்ளடக்குகிறது. தமிழில் இயல்பாகவும் துல்லியமாகவும் வயது வரம்பைச் சொல்கிறது.
- source_word: זָכָר
  choice: ஆண்
  rationale: இங்கு சமூக நிலையை அல்ல, மதிப்பீட்டுக்குரிய நபரின் பாலினத்தைக் குறிக்கிறது; ஆகவே ‘ஆண்’ என்பது பொருத்தமானது.
- source_word: עֶרְכְּךָ
  choice: நீ நிர்ணயிக்கும் மதிப்பு
  rationale: இரண்டாம் நபர் ஒருமை உரிமை விகுதியையும், லேவியராகமம் 27-இல் நேர்த்திக்கடன் தொடர்பாக நிர்ணயிக்கப்படும் தொழில்நுட்ப மதிப்பையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: חֲמִשָּׁה עָשָׂר שָׁקֶל
  choice: பதினைந்து சேக்கல்
  rationale: எண்ணிக்கையையும் எடை/பண அலகையும் நேரடியாகக் கொடுக்கிறது.
- source_word: לַנְּקֵבָה
  choice: பெண்ணுக்கு
  rationale: זָכָר என்பதற்கு இணையான பெண்பால் வகையைத் தமிழில் இயல்பாகக் குறிக்கிறது.
- source_word: עֲשָׂרָה שְׁקָלִים
  choice: பத்து சேக்கல்
  rationale: எண்ணிக்கையையும் அலகையும் நேரடியாக மொழிபெயர்க்கிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. எபிரேயத்தின் இருமுறை வரும் நிபந்தனை அமைப்பு தமிழில் தேவையற்ற தடுமாற்றம் ஏற்படுத்தாதவாறு ஒரே இயல்பான நிபந்தனை வாக்கியமாக வடிவமைக்கப்பட்டுள்ளது; ‘நீ நிர்ணயிக்கும் மதிப்பு’ என்பதன் மூலம் மூலத்தின் இரண்டாம் நபர் வடிவமும் சட்டப்பிரிவின் தொழில்நுட்பப் பொருளும் காக்கப்பட்டுள்ளன.
