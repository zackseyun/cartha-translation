base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/010.yaml
  text: He shall not replace it or exchange it[a], good for bad or bad for good; and if he does indeed exchange one animal for another[b], then both it and its substitute shall be holy.
translation:
  language: ta
  text: அதற்குப் பதிலாக வேறொன்றை வைக்கவோ, நல்லதற்குப் பதிலாகக் கெட்டதையோ கெட்டதற்குப் பதிலாக நல்லதையோ கொடுத்து அதைப் பரிமாற்றம் செய்யவோ கூடாது.[a] அவன் ஓர் மிருகத்திற்குப் பதிலாக வேறொரு மிருகத்தை உண்மையிலேயே பரிமாற்றம் செய்தால்,[b] அந்த மிருகமும் அதற்குப் பதிலாகக் கொடுக்கப்பட்ட மிருகமும் ஆகிய இரண்டும் பரிசுத்தமானவை ஆகும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் இங்கு ‘அதற்குப் பதிலாக வேறொன்றை வைத்தல்’, ‘பரிமாற்றம் செய்தல்’ என்ற தொடர்புடைய, ஆனால் வேறுபட்ட இரண்டு வினைச்சொற்கள் பயன்படுத்தப்பட்டுள்ளன.
    reason: lexical_alternative
  - marker: b
    text: எபிரெய மொழியில் வினைச்சொல் வலியுறுத்தப்பட்டுள்ளது; இதை ‘நிச்சயமாகப் பரிமாற்றம் செய்தால்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחֲלִיפֶנּוּ
  choice: அதை வேறொன்றால் மாற்றவோ
  rationale: חלף என்பதன் ஹிபீல் வடிவம் நேர்ந்துகொடுக்கப்பட்ட மிருகத்திற்குப் பதிலாக வேறொன்றை வைப்பதைக் குறிக்கிறது; அடுத்துவரும் מוּר என்பதிலிருந்து வேறுபாட்டையும் இச்சொல்லாக்கம் காக்கிறது.
- source_word: יָמִיר אֹתוֹ
  choice: பரிமாற்றம் செய்யவோ
  rationale: מוּר இச்சட்டச் சூழலில் ஒரு மிருகத்திற்குப் பதிலாக மற்றொன்றைக் கொடுப்பதைக் குறிக்கிறது; ‘பரிமாற்றம் செய்’ என்பது நவீனத் தமிழில் சட்டக் கருத்தைத் தெளிவாகத் தருகிறது.
- source_word: טוֹב בְּרָע אוֹ רַע בְּטוֹב
  choice: நல்லதற்குப் பதிலாகக் கெட்டதையோ கெட்டதற்குப் பதிலாக நல்லதையோ
  rationale: பெயர்ச்சொற்களாகச் செயல்படும் பெயரடைகளையும், பரிமாற்றத்தில் பதிலாக வைக்கப்படுவதைச் சுட்டும் ב முன்னிடைச்சொல்லையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְאִם הָמֵר יָמִיר
  choice: அவன் ... பரிமாற்றம் செய்தே தீர்ந்தால்
  rationale: வினையெச்சப் பொருளுடைய infinitive absolute உடன் finite verb வருவதால் உண்டாகும் வலியுறுத்தலை ‘செய்தே தீர்ந்தால்’ வெளிப்படுத்துகிறது; இது செயல் நடந்தேவிட்ட நிலையை அல்ல, தடையை மீறி உண்மையிலேயே செய்தால் என்ற நிபந்தனையைச் சுட்டுகிறது.
- source_word: בְּהֵמָה בִּבְהֵמָה
  choice: ஓர் மிருகத்திற்குப் பதிலாக வேறொரு மிருகத்தை
  rationale: இரு மிருகங்களுக்கிடையிலான பதிலீட்டை இயல்பான தமிழில் தெளிவாக்குகிறது.
- source_word: וְהָיָה הוּא וּתְמוּרָתוֹ
  choice: அந்த மிருகமும் அதற்குப் பதிலாகக் கொடுக்கப்பட்ட மிருகமும் ஆகிய இரண்டும்
  rationale: הוּא முதலில் அர்ப்பணிக்கப்பட்ட மிருகத்தையும் תְמוּרָתוֹ அதற்குப் பதிலாக வைக்கப்பட்ட மிருகத்தையும் குறிக்கிறது; இரண்டுக்கும் ஒரே முடிவு பொருந்துவதை வெளிப்படையாக்குகிறது.
- source_word: קֹדֶשׁ
  choice: பரிசுத்தமானவையாக
  rationale: இறைவனுக்குரியதாகப் பிரித்து வைக்கப்பட்ட புனித நிலையை நேரடியாகக் குறிக்கிறது; காணிக்கை மற்றும் நேர்ந்துகொடுத்தல் சார்ந்த சட்டச் சூழலுக்கு ஏற்றது.
theological_decisions:
- issue: பரிமாற்ற முயற்சிக்குப் பின் முதலில் நேர்ந்துகொடுக்கப்பட்ட மிருகத்திற்கும் பதிலாகக் கொடுக்கப்பட்ட மிருகத்திற்கும் ஏற்படும் நிலை
  choice: இரண்டு மிருகங்களும் பரிசுத்தமானவையாகும்.
  alternative: பதிலாகக் கொடுக்கப்பட்ட மிருகம் மட்டுமே பரிசுத்தமாகும்; அல்லது பரிமாற்றம் செல்லாது என்பது மட்டுமே கூறப்படுகிறது.
  rationale: הוּא וּתְמוּרָתוֹ ... קֹדֶשׁ என்ற வாசகம் முதலில் இருந்த மிருகத்திற்கும் அதன் பதிலிக்கும் பரிசுத்த நிலையைத் தெளிவாக விதிக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சட்ட விதியின் கண்ணியமான தொனியும் மூலத்தின் இரண்டு வினைச்சொல் அமைப்பும் வலியுறுத்தலும் காக்கப்பட்டுள்ளன. ‘மிருகம்’ என்பது בְּהֵמָה குறிக்கும் பலியிடத்தக்க வீட்டுவளர்ப்பு விலங்கு என்ற சூழல்சார்ந்த பொருளில் பயன்படுத்தப்பட்டுள்ளது.
