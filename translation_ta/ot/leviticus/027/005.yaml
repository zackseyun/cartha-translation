base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/005.yaml
  text: And if it is from five years old up to twenty years old, your valuation shall be twenty shekels for the male and ten shekels for the female.
translation:
  language: ta
  text: ஐந்து வயது முதல் இருபது வயது வரையுள்ளவருக்கு, ஆணுக்காக நீ நிர்ணயிக்கும் மதிப்பு இருபது சேக்கல்களாகவும், பெண்ணுக்காகப் பத்து சேக்கல்களாகவும் இருக்க வேண்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: இருந்தால்
  rationale: முந்தைய மதிப்பீட்டு விதிகளுடன் தொடரும் நிபந்தனையைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; எபிரேய இணைப்பை வாக்கிய ஓட்டத்திலேயே உணர்த்துகிறது.
- source_word: מִבֶּן חָמֵשׁ שָׁנִים וְעַד בֶּן עֶשְׂרִים שָׁנָה
  choice: ஐந்து வயதுமுதல் இருபது வயதுவரை உள்ளவர்
  rationale: בֶּן உடன் வரும் எண் அமைப்பு குறிக்கும் வயது வரம்பை நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: וְהָיָה
  choice: இருக்க வேண்டும்
  rationale: சட்டரீதியான கட்டளையின் வலிமையைத் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: עֶרְכְּךָ
  choice: உன் மதிப்பீடு
  rationale: நேரடியாக உரையாடப்படுபவரைக் குறிக்கும் இரண்டாம் நபர் உருபையும், நேர்த்திக்கடன் சார்ந்த நிர்ணய மதிப்பு என்ற சட்ட-வழிபாட்டு கருத்தையும் காக்கிறது.
- source_word: הַזָּכָר
  choice: ஆணுக்கான
  rationale: ஒருமை வகைப்பாட்டைத் தக்கவைத்து, மதிப்பீட்டுத் தொகையுடன் தமிழில் இயல்பாக இணைக்கிறது.
- source_word: עֶשְׂרִים שְׁקָלִים
  choice: இருபது சேக்கல்கள்
  rationale: வரலாற்று எடை/பண அலகை நவீன மதிப்பாக மாற்றாமல் ஒலிபெயர்த்து, எண்ணிக்கையைத் துல்லியமாகக் காக்கிறது.
- source_word: וְלַנְּקֵבָה
  choice: பெண்ணுக்கானது
  rationale: இணையான பெண் வகைப்பாட்டையும் அதற்குரிய மதிப்பீட்டையும் சுருக்கமாகத் தெளிவுபடுத்துகிறது.
- source_word: עֲשֶׂרֶת שְׁקָלִים
  choice: பத்துச் சேக்கல்கள்
  rationale: ஆண் வகைக்கான தொகையுடன் உள்ள எண்ணியல் வேறுபாட்டை நேரடியாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: சட்ட/வழிபாட்டு உரையில் பாலின அடிப்படையிலான மதிப்பீட்டு வகைகள்
  choice: ஆண் ... பெண்
  alternative: ஆண்கள் ... பெண்கள்; ஓர் ஆண் ... ஒரு பெண்
  rationale: எபிரேயம் பன்மையான சமூகக் குழுக்களை அல்ல, ஒருமையான பாலின வகைப்பாடுகளைக் குறிப்பிடுகிறது. ஆகவே சட்ட அட்டவணையின் வகைப்பாட்டை மட்டுமே தெரிவித்து, அதற்கு அப்பாற்பட்ட சமூக அல்லது கோட்பாட்டு முடிவைச் சேர்க்காமல் உள்ளது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. சட்டரீதியான கட்டளைத் தொனிக்காக ‘இருக்க வேண்டும்’ என்றும், வரலாற்று அலகுக்காக ‘சேக்கல்’ என்றும் வழங்கப்பட்டுள்ளது. மூலத்தில் இல்லாத விளக்கங்கள் அல்லது சமயப் பிரிவு சார்ந்த சொற்கள் சேர்க்கப்படவில்லை.
