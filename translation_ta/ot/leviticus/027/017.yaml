source:
  edition: WLC
  text: אִם מִ/שְּׁנַ֥ת הַ/יֹּבֵ֖ל יַקְדִּ֣ישׁ שָׂדֵ֑/הוּ כְּ/עֶרְכְּ/ךָ֖ יָקֽוּם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/017.yaml
  text: If he consecrates his field from the year of jubilee[a], your valuation shall stand.
translation:
  language: ta
  text: அவன் யூபிலி ஆண்டிலிருந்து தன் வயலைப் புனிதமாக அர்ப்பணித்தால்[a], நீ நிர்ணயித்த மதிப்பு நிலைத்திருக்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தன் வயலைப் புனிதப் பயன்பாட்டிற்காக ஒதுக்கினால்.” எபிரெய வினைச்சொல், ஒன்றைப் புனிதமானதாகப் பிரித்து வைக்கும் பொருளைக் கொண்டது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: அப்படியானால் / -த்தால்
  rationale: நிபந்தனைச் சட்டக் கூற்றைத் தமிழில் இயல்பான ‘-த்தால்’ வினைமுற்றால் வெளிப்படுத்துகிறது.
- source_word: מִשְּׁנַת הַיֹּבֵל
  choice: யூபிலி ஆண்டு தொடங்கி
  rationale: מִן என்பது காலத்தின் தொடக்கப் புள்ளியைக் குறிக்கிறது; அடுத்த யூபிலிவரை மீதமுள்ள காலத்துடன் மதிப்பீடு தொடர்புடையதால் ‘தொடங்கி’ பொருத்தமானது.
- source_word: יַקְדִּישׁ
  choice: புனிதமாக அர்ப்பணித்தால்
  rationale: קדשׁ என்பதன் ஹிஃபில் வடிவம் ஒன்றைப் புனிதமானதாகப் பிரித்து வைப்பதைக் குறிக்கிறது; ‘புனிதமாக’ என்பது வழிபாட்டுச் சார்ந்த நுண்பொருளைப் பாதுகாக்கிறது.
- source_word: שָׂדֵהוּ
  choice: தனது வயலை
  rationale: மூன்றாம் நபர் ஆண்பால் உடைமைப் பின்னொட்டைத் தமிழில் இயல்பாக ‘தனது’ என வழங்குகிறது.
- source_word: כְּעֶרְכְּךָ
  choice: நீ நிர்ணயித்த மதிப்பு
  rationale: இரண்டாம் நபர் ஒருமையிடம் குறிப்பிடப்படும் அதிகாரப்பூர்வ மதிப்பீட்டைத் தெளிவான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: יָקוּם
  choice: அப்படியே செல்லுபடியாகும்
  rationale: קום இங்கு அந்த மதிப்பீடு சட்டரீதியாக நிலைத்து அமலில் இருப்பதைக் குறிக்கிறது; ‘செல்லுபடியாகும்’ சட்டநடையின் பொருளை இயல்பாகக் கொடுக்கிறது.
theological_decisions:
- issue: கர்த்தருக்காகச் சொத்தைப் புனிதமாக ஒதுக்கும் வழிபாட்டுச் செயல்
  choice: புனிதமாக அர்ப்பணித்தால்
  alternative: அர்ப்பணித்தால்; புனிதப் பயன்பாட்டுக்காக ஒதுக்கினால்
  rationale: இது பொதுவான நன்கொடையைக் காட்டிலும் புனித நோக்கத்திற்காகப் பிரித்து வைக்கும் செயல் என்பதை வெளிப்படுத்துகிறது; அதேவேளையில் தேவையற்ற சமயப்பிரிவு சார்ந்த கருத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டப்பாங்கும் வழிபாட்டுச் சார்ந்த நுண்பொருளும் பாதுகாக்கப்பட்டுள்ளன. ‘யூபிலி’ என்பது இஸ்ரவேலின் குறிப்பிட்ட நிறுவனத்தைக் குறிக்கும் பெயராகப் பயன்படுத்தப்பட்டுள்ளது.
