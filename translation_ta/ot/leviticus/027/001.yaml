lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பேசி
  rationale: דבר என்பதன் தொடர்வினை வடிவம் தெய்வீக உரையை அறிமுகப்படுத்தும் வழக்கமான எபிரெயக் கதைநடைச் சூத்திரம். அடுத்து வரும் לֵאמֹר உடன் இயல்பான தமிழில் இணைவதற்காக ‘பேசி’ என மொழிபெயர்க்கப்பட்டது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: நான்கு எழுத்துத் தெய்வப் பெயரான יהוה, ஒரு பட்டத்தால் மாற்றப்படாமல் தமிழில் பரவலாக அறியப்படும் பெயர்வடிவமான ‘யெகோவா’ என்று ஒலிபெயர்க்கப்பட்டது.
- source_word: אֶל
  choice: -ிடம்
  rationale: தெய்வீகப் பேச்சின் நோக்குப் பொருளைக் குறிக்கும் முன்னிடைச்சொல்; நவீன தமிழில் ‘மோசேயிடம்’ என்பது இயல்பான இணைப்பு.
- source_word: מֹשֶׁה
  choice: மோசே
  rationale: தனிப்பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: לֵאמֹר
  choice: பேசி என்ற தொடரமைப்பில் உட்பொருத்தப்பட்டது
  rationale: இந்த வினையெச்சம் தொடர்ந்து வரும் உரையின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது. ‘சொன்னதாவது’ என்ற கனமான மரபுவடிவத்தைத் தவிர்த்து, அடுத்த வசனத்துடன் இயல்பாகத் தொடரும் ‘பேசி’ என்ற திறந்த அமைப்பில் அதன் பண்பு வெளிப்படுத்தப்பட்டது.
theological_decisions:
- issue: יהוה என்ற தெய்வப் பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட தெய்வப் பெயர் நேரடியாக உள்ளது. அதை ‘கர்த்தர்’ என்ற பட்டத்தால் மாற்றாமல் பெயராகவே வைத்திருக்கிறது; ‘யெகோவா’ தமிழ்க் கிறிஸ்தவப் பயன்பாட்டில் பரவலாக அறியப்படும் ஒலிவடிவம்.
translation_notes:
  register: நவீன, தெளிவான, கண்ணியமான தமிழ். எபிரெய உரை அறிமுகச் சூத்திரத்தின் தொடர்ச்சியைப் பாதுகாக்க, வசனம் அடுத்த வசனத்துக்குத் திறந்தவாறு அமைக்கப்பட்டுள்ளது.
