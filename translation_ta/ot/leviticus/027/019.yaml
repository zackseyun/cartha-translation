  text: וְ/אִם גָּאֹ֤ל יִגְאַל֙ אֶת הַ/שָּׂדֶ֔ה הַ/מַּקְדִּ֖ישׁ אֹת֑/וֹ וְ֠/יָסַף חֲמִשִׁ֧ית כֶּֽסֶף עֶרְכְּ/ךָ֛ עָלָ֖י/ו וְ/קָ֥ם לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/019.yaml
  text: But if the one who consecrated it indeed redeems the field[a], then he shall add a fifth of your valuation money to it[c][b], and it shall remain his.
translation:
  language: ta
  text: ஆனால், அதை அர்ப்பணித்தவர் அந்த வயலை மீட்டுக்கொண்டால்[a], நீ மதிப்பிட்ட தொகைக்கு மேலாக ஐந்தில் ஒரு பங்கை அவர் சேர்க்க வேண்டும்[b]; அப்போது அந்த வயல் அவருக்கே உரியதாக நிலைபெறும்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அதைப் புனிதமாக ஒதுக்கியவர்’ அல்லது ‘அதைப் பரிசுத்தப்படுத்தியவர்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லர்த்தமாக, ‘உன் மதிப்பீட்டின் வெள்ளியில் ஐந்தில் ஒரு பங்கு.’
    reason: lexical_alternative
  - marker: c
    text: ‘அது அவருக்குச் சொந்தமாகும்’ என்றும் மொழிபெயர்க்கலாம்; சொல்லர்த்தமாக, ‘அது அவருக்காக நிலைக்கும்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: ஆனால், ... என்றால்
  rationale: முந்தைய சட்டவிதியின் தொடர்ச்சியில் ஒரு மாற்று நிலையை அறிமுகப்படுத்துவதால், தொடர்ச்சி மற்றும் எதிர்மாற்று நுணுக்கம் இரண்டையும் இயல்பான தமிழில் காட்டுகிறது.
- source_word: גָּאֹל יִגְאַל
  choice: மீட்டுக்கொள்ளத் தீர்மானமாக முன்வந்தால்
  rationale: வினைமுற்றுக்கு முன் வரும் வினையெச்ச வலியுறுத்தலை வெறும் ‘மீட்டுக்கொண்டால்’ என்று தட்டையாக்காமல் காட்டுகிறது; இது சட்டச் சூழலில் உண்மையாக மீட்பை மேற்கொள்ளும் நிலையைச் சுட்டுகிறது.
- source_word: הַשָּׂדֶה
  choice: அந்த வயலை
  rationale: முந்தைய வசனங்களில் குறிப்பிடப்பட்ட குறிப்பிட்ட பயிர்நிலத்தைக் குறிக்கிறது; ‘வயல்’ என்பது இங்கு இயல்பானதும் துல்லியமானதும்.
- source_word: הַמַּקְדִּישׁ אֹתוֹ
  choice: அதை அர்ப்பணித்தவன்
  rationale: கர்த்தருக்கெனப் புனிதப் பயன்பாட்டிற்காக ஒதுக்கிவைத்த நபரைக் குறிக்கிறது. ‘அர்ப்பணித்தவன்’ சாதாரண வாசகருக்குப் புரியும் வகையில் வழிபாட்டு நுணுக்கத்தையும் தக்கவைக்கிறது.
- source_word: וְיָסַף
  choice: சேர்க்க வேண்டும்
  rationale: சட்டவிதியில் கடமையை விதிக்கும் தொடர்வினையாக இருப்பதால், தமிழில் கட்டாயப் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: חֲמִשִׁית
  choice: ஐந்தில் ஒரு பங்கு
  rationale: மதிப்பீட்டுத் தொகைக்கு மேலாகச் சேர்க்க வேண்டிய இருபது சதவீதத்தை மரபான சட்ட மொழியில் துல்லியமாகக் காட்டுகிறது.
- source_word: כֶּסֶף עֶרְכְּךָ
  choice: நீ மதிப்பிட்ட தொகை
  rationale: சொல்லர்த்தமாக ‘உன் மதிப்பீட்டின் வெள்ளி/பணம்.’ மோசேயை அல்லது மதிப்பிடும் அதிகாரியை நோக்கிய இரண்டாம் நபர் வடிவைத் தமிழில் தக்கவைத்து, பண மதிப்பை இயல்பாகத் தெரிவிக்கிறது.
- source_word: עָלָיו
  choice: அதனுடன்
  rationale: ஐந்தில் ஒரு பங்கு மதிப்பீட்டுத் தொகைக்கு மேலாகச் சேர்க்கப்படுவதைக் குறிக்கிறது.
- source_word: וְקָם לוֹ
  choice: அவனுக்கே உரியதாக நிலைபெறும்
  rationale: சொல்லர்த்தமான ‘அவனுக்காக நிலைக்கும்’ என்ற சட்ட மரபுத்தொடரை, உரிமை உறுதிப்படுத்தப்படும் விளைவாகத் தெளிவாகவும் மூல உருவகத்துக்கு நெருக்கமாகவும் வழங்குகிறது.
theological_decisions:
- issue: הקדישׁ என்ற வழிபாட்டுச் சூழல் வினை
  choice: அர்ப்பணித்த
  alternative: புனிதப்படுத்திய / பரிசுத்தமாக ஒதுக்கிய
  rationale: சொத்து கர்த்தருக்கெனப் பிரித்துவைக்கப்படுவதைச் சுட்டும் புனித நுணுக்கத்தைப் பாதுகாக்கிறது; அதேவேளை நவீன தமிழில் இயல்பாக உள்ளது.
- issue: சட்டக் கூற்றின் கட்டாயமும் விளைவும்
  choice: ‘சேர்க்க வேண்டும் ... உரியதாக நிலைபெறும்’
  alternative: ‘சேர்ப்பான் ... அவனுக்காக நிலைக்கும்’
  rationale: முதல் பகுதி சட்டக் கடமையையும், இறுதிப் பகுதி பணம் செலுத்திய பின் உரிமை உறுதியாகும் விளைவையும் வேறுபடுத்தித் தெளிவாக்குகிறது.
- issue: וְקָם לוֹ என்பதன் சட்டப் பொருள்
  choice: அவனுக்கே உரியதாக நிலைபெறும்
  alternative: அது அவனுக்குச் சொந்தமாகும் / அது அவனுக்காக நிலைக்கும்
  rationale: உரிமை உறுதிப்படுத்தப்படுதல் என்ற சூழல்சார் பொருளைக் காட்டுகிறது; அதே சமயம் ‘நிலைபெறும்’ என்பதால் எபிரெய மரபுத்தொடரின் உருவகத்தை முற்றிலும் நீக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், சட்டவிதிக்கேற்ற கண்ணியமான நடையைப் பயன்படுத்தியுள்ளது. ‘அர்ப்பணித்தவன்,’ ‘மதிப்பிட்ட தொகை,’ ‘உரியதாக நிலைபெறும்’ ஆகிய சொற்கள் வழிபாட்டு மற்றும் சட்ட நுணுக்கங்களைச் சாதாரண வாசகருக்கும் தெளிவாகக் கொண்டுசெல்லுகின்றன. அனைத்து அடிக்குறிப்பு குறியீடுகளும் உரையில் இடம்பெற்றுள்ளன.
