- from: ஆனால், அதை அர்ப்பணித்தவனே அந்த வயலை மீட்டுக்கொள்ளத் தீர்மானமாக முன்வந்தால்[a], நீ மதிப்பிட்ட தொகையில் ஐந்தில் ஒரு பங்கை அவன் அதனுடன் சேர்க்க வேண்டும்[b]; அப்போது அந்த வயல் அவனுக்கே உரியதாக நிலைபெறும்[c].
  to: ஆனால், அதை அர்ப்பணித்தவர் அந்த வயலை மீட்டுக்கொண்டால்[a], நீ மதிப்பிட்ட தொகைக்கு மேலாக ஐந்தில் ஒரு பங்கை அவர் சேர்க்க வேண்டும்[b]; அப்போது அந்த வயல் அவருக்கே உரியதாக நிலைபெறும்[c].
  rationale: மீட்புச் செயலைக் குறிக்கும் மூல வினையைத் தவறாக விரிவாக்கிய ‘தீர்மானமாக முன்வந்தால்’ நீக்கப்பட்டது. ஐந்தில் ஒரு பங்கு மதிப்பீட்டுத் தொகைக்கு மேலாகச் சேர்க்கப்படுவதை வெளிப்படையாக்கி, இறுதி சட்டவிளைவான உரிமை உறுதிப்படுத்தப்படுதலைத் தக்கவைத்துள்ளோம். அடிக்குறிப்புகளும் திருத்தப்பட்ட உரையின் மரியாதைமிக்க ‘அவர்’ பயன்பாட்டுடன் ஒத்திசைக்கப்பட்டன.
