  naturalness: The revised wording is concise, idiomatic modern standard Tamil, and retains an appropriately formal legal register.
  terminology: “மதிப்பீடு” suitably renders the technical valuation term in this chapter. “சேக்கல்” preserves the source unit without adding “silver.”
