base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/004.yaml
  text: But if it is a female[a], then your valuation shall be thirty shekels.
translation:
  language: ta
  text: ஆனால், ஒரு பெண்ணாக இருந்தால்[a], உன் மதிப்பீடு முப்பது சேக்கலாகும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவள் பெண்ணாக இருந்தால்.”
    reason: எபிரெய மூலத்தில் பெண்பால் ஒருமைச் சுட்டுப்பெயர் வெளிப்படையாக உள்ளது; தமிழில் அதைச் சேர்த்தும் மொழிபெயர்க்கலாம்.
lexical_decisions:
- source_word: וְאִם
  choice: ஆனால், ... இருந்தால்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட ஆண் குறித்த மதிப்பீட்டுக்கு மாறான நிலையை இந்த இணைப்புச்சொல்லும் நிபந்தனைச் சொல்லும் அறிமுகப்படுத்துகின்றன; ‘ஆனால்’ அந்த வேறுபாட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: נְקֵבָה הִוא
  choice: பெண்ணாக இருந்தால்
  rationale: נְקֵבָה என்பது பெண்பாலைக் குறிக்கிறது; இங்கு மனிதர்களைப் பற்றிய சூழலில் இயல்பான தமிழுக்காக ‘பெண்’ பயன்படுத்தப்பட்டுள்ளது. பெண்பால் ஒருமைச் சுட்டுப்பெயர் தமிழில் வெளிப்படையாகச் சொல்லப்படாமல் விடப்பட்டுள்ளது; அதன் நேரடியான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: וְהָיָה
  choice: இருக்க வேண்டும்
  rationale: சட்டவிதியின் விளைவை அல்லது நிர்ணயிக்கப்பட்ட நிலையைத் தமிழில் இயல்பாகவும் அதிகாரபூர்வமாகவும் தெரிவிக்கிறது.
- source_word: עֶרְכְּךָ
  choice: நீ நிர்ணயிக்கும் மதிப்பு
  rationale: ערך என்பது இந்த அதிகாரத்தில் நேர்த்திக்கடனுடன் தொடர்புடைய நிர்ணய மதிப்பைக் குறிக்கிறது; இரண்டாம் நபர் ஒருமை விகுதியையும் மதிப்பை நிர்ணயிக்கும் செயலையும் தெளிவான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: שְׁלֹשִׁים שָׁקֶל
  choice: முப்பது சேக்கல்
  rationale: எண்ணை நேரடியாகப் பெயர்த்து, மூலத்தில் குறிப்பிடப்படாத ‘வெள்ளி’ என்பதைச் சேர்க்காமல், எபிரெய எடை/நாணய அலகான ‘சேக்கல்’ என்பதைக் காக்கிறது.
