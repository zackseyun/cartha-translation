revisions:
- from: ஆயினும், கால்நடைகளில் யெகோவாவுக்கு உரிய முதற்பேறானதை எவரும் அர்ப்பணிக்கக் கூடாது; அது மாடாக இருந்தாலும் செம்மறியாடாக அல்லது வெள்ளாடாக இருந்தாலும்[a], அது யெகோவாவுக்கே உரியது.
  to: ஆயினும், கால்நடைகளில் யெகோவாவுக்கு முதற்பேறாக உரியதை எவரும் பரிசுத்தமாக அர்ப்பணிக்கக் கூடாது; அது எருதாயினும், செம்மறியாடாயினும்[a], அது யெகோவாவுக்கே உரியது.
  rationale: The revision retains the legal logic that the animal is already Yahweh’s by firstborn status, uses a more precise Tamil equivalent for שׁוֹר, and preserves the lexical range of שֶׂה through the existing footnote rather than expanding it interpretively in the main text.
