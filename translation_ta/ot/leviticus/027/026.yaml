base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/026.yaml
  text: However[a], a firstborn among the livestock, which as a firstborn belongs to Yahweh, no man may consecrate; whether an ox or a sheep[b], it belongs to Yahweh.
translation:
  language: ta
  text: ஆயினும், கால்நடைகளில் யெகோவாவுக்கு முதற்பேறாக உரியதை எவரும் பரிசுத்தமாக அர்ப்பணிக்கக் கூடாது; அது எருதாயினும், செம்மறியாடாயினும்[a], அது யெகோவாவுக்கே உரியது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல் שֶׂה செம்மறியாட்டையோ வெள்ளாட்டையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: ஆயினும்
  rationale: முந்தைய விதிகளுக்கு விதிவிலக்காக அல்லது வரம்பாக இக்கட்டளையை அறிமுகப்படுத்தும் எதிர்மறைத் தொடர்பை இயல்பான தமிழில் காட்டுகிறது.
- source_word: בְּכוֹר
  choice: முதற்பேறானது
  rationale: கால்நடையின் முதலில் பிறந்த குட்டியைக் குறிக்கும் சட்ட மற்றும் வழிபாட்டுச் சூழலுக்கு ஏற்ற, தெளிவான நவீனத் தமிழ் சொல்.
- source_word: אֲשֶׁר יְבֻכַּר לַיהוָה בִּבְהֵמָה
  choice: கால்நடைகளில் யெகோவாவுக்கு உரிய முதற்பேறானது
  rationale: בכר என்பதன் செயல்பாட்டு வடிவத்தை மனிதன் செய்யும் அர்ப்பணிப்பாக அல்லாமல், முதற்பேறு என்ற நிலையால் ஏற்கெனவே யெகோவாவுக்கு உரியதாக இருப்பதாக வெளிப்படுத்துகிறது.
- source_word: לֹא יַקְדִּישׁ אִישׁ אֹתוֹ
  choice: எவரும் அர்ப்பணிக்கக் கூடாது
  rationale: קדש என்பதன் ஹிஃபில் வடிவத்திலுள்ள வழிபாட்டுச் சார்ந்த அர்ப்பணித்தல் பொருளைத் தருகிறது; אִישׁ இங்கு பொதுப்பொருளில் வருவதால் பாலினத்தைச் சுட்டாத இயல்பான ‘எவரும்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: אִם שׁוֹר אִם שֶׂה
  choice: அது மாடாக இருந்தாலும் செம்மறியாடாக அல்லது வெள்ளாடாக இருந்தாலும்
  rationale: שׁוֹר-ஐ மாட்டினமாகவும், שֶׂה-ஐ செம்மறியாடு அல்லது வெள்ளாடு ஆகிய இரண்டையும் உள்ளடக்கும் மந்தை விலங்காகவும் தெளிவாகக் காட்டுகிறது.
- source_word: לַיהוָה הוּא
  choice: அது யெகோவாவுக்கே உரியது
  rationale: לְ என்பதிலுள்ள உரிமை அல்லது சட்டப்பூர்வக் கோரிக்கையை இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘-க்கே’ ஏற்கெனவே அவருக்கு உரியது என்ற வலியுறுத்தலைக் காக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தெய்வீகப் பெயரை பட்டப்பெயராக மாற்றாமல் தமிழில் பரவலாக அறியப்பட்ட ஒலிபெயர்ப்பில் தருகிறது.
theological_decisions:
- issue: முதற்பேறான கால்நடையைப் புதிதாக அர்ப்பணிக்க முடியாததன் காரணம்
  choice: முதற்பேறு என்ற நிலையால் அது ஏற்கெனவே யெகோவாவுக்கு உரியது; ஆகவே மனிதர் அதை மீண்டும் ஒரு நேர்த்திக்கடன் அர்ப்பணிப்பாக அர்ப்பணிக்க முடியாது.
  alternative: முதற்பேறு நிலையே ஒரு வகையான பரிசுத்தப்படுத்தல்; சட்டப்பூர்வ உரிமையைச் சிறப்பாக வலியுறுத்த வேண்டியதில்லை.
  rationale: ‘யெகோவாவுக்கு உரிய முதற்பேறானது’ என்பதும் இறுதியிலுள்ள ‘அது யெகோவாவுக்கே உரியது’ என்பதும் முன்கூட்டிய தெய்வீக உரிமையை வலியுறுத்துகின்றன; அதேவேளையில் மூலத்தில் உள்ள நிலை மற்றும் அர்ப்பணிப்பு சார்ந்த கருத்துகள் காக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்ட-வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. நீளமான எபிரெய வாக்கியத்தின் தர்க்கத் தொடர்ச்சி தமிழில் தெளிவாக இருக்க அரைப்புள்ளி பயன்படுத்தப்பட்டது.
