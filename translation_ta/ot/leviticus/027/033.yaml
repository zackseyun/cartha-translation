source:
  edition: WLC
  text: לֹ֧א יְבַקֵּ֛ר בֵּֽין ט֥וֹב לָ/רַ֖ע וְ/לֹ֣א יְמִירֶ֑/נּוּ וְ/אִם הָמֵ֣ר יְמִירֶ֔/נּוּ וְ/הָֽיָה ה֧וּא וּ/תְמוּרָת֛/וֹ יִֽהְיֶה קֹ֖דֶשׁ לֹ֥א יִגָּאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/033.yaml
  text: He shall not inspect whether it is good or bad[a], nor shall he exchange it; and if he does in fact exchange it, then both it and its substitute shall be holy[b]; it shall not be redeemed.
translation:
  language: ta
  text: அது நல்லதா கெட்டதா என்று அவன் ஆராயக்கூடாது[a]; அதற்குப் பதிலாக மாற்றீடாக வேறொன்றை வைக்கவும் கூடாது. அப்படி அவன் உண்மையிலேயே அதற்குப் பதிலாக வேறொன்றை வைத்தால்[b], அதுவும் அதற்குப் பதிலாக வைக்கப்பட்டதும் பரிசுத்தமானவைகளாகும்; அது மீட்கப்படக் கூடாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் நேரடியாக, ‘நல்லதற்கும் கெட்டதற்கும் இடையில் ஆராயக்கூடாது.’ பத்தில் ஒன்றாக வரும் மிருகத்தைத் தரத்தின் அடிப்படையில் வேறுபடுத்தித் தேர்ந்தெடுப்பதைக் குறிக்கும் மரபுத்தொடர் இது.
    reason: lexical_alternative
  - marker: b
    text: 'எபிரெய மொழியில் வினை வலியுறுத்தப்பட்டுள்ளது: ‘அவன் நிச்சயமாக மாற்றினால்’ அல்லது ‘அவன் உண்மையிலேயே மாற்றினால்.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְבַקֵּר / בֵּין טוֹב לָרַע
  choice: அது நல்லதா கெட்டதா என்று ஆராய்ந்து பார்க்கக்கூடாது
  rationale: பத்தில் ஒன்றாகத் தேர்ந்தெடுக்கப்படும் மிருகத்தின் தரத்தை ஆராய்ந்து வேறுபடுத்துவதை பியல் வினையும் எபிரெய மரபுத்தொடரும் குறிக்கின்றன. இயல்பான தமிழில் இதைத் தெளிவாகக் கூறுகிறது.
- source_word: יְמִירֶנּוּ / הָמֵר יְמִירֶנּוּ
  choice: அதற்குப் பதிலாக வேறொன்றை மாற்றவும் கூடாது / உண்மையிலேயே அதை மாற்றினால்
  rationale: מור என்பது ஓர் அர்ப்பணிக்கப்பட்ட மிருகத்துக்குப் பதிலாக இன்னொன்றை வைக்கும் சட்டக் கருத்தைக் குறிக்கிறது. வினையெச்சப் பெயர்–வினை அமைப்பின் வலியுறுத்தலை ‘உண்மையிலேயே’ காட்டுகிறது.
- source_word: תְמוּרָתוֹ
  choice: அதற்குப் பதிலாக மாற்றப்பட்டது
  rationale: மூல மிருகத்துக்குப் பதிலாக வைக்கப்பட்ட மற்றொரு மிருகத்தைக் குறிக்கிறது; சாதாரண வாசகருக்கு இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: קֹדֶשׁ
  choice: பரிசுத்தமானவையாக
  rationale: தேவனுக்கென்று அர்ப்பணிக்கப்பட்ட வழிபாட்டு நிலையைத் தக்கவைக்கும், லேவியராகமத்துக்கு ஏற்ற திருநிலைச் சொல்.
- source_word: לֹא יִגָּאֵל
  choice: மீட்டுக்கொள்ளக் கூடாது
  rationale: அர்ப்பணிக்கப்பட்ட நிலையிலிருந்து விலை கொடுத்து மீண்டும் தன்வசப்படுத்துவதை குறிக்கும் நிபால் வடிவத்தின் சட்டப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: הוּא וּתְמוּרָתוֹ
  choice: அதுவும் அதற்குப் பதிலாக மாற்றப்பட்டதும்
  rationale: மூல மிருகமும் மாற்றாக வைக்கப்பட்ட மிருகமும் ஆகிய இரண்டையும் உள்ளடக்குகிறது; தொடர்ந்து வரும் பன்மைத் தமிழாக்கம் இரண்டுக்கும் விதி பொருந்துவதை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: அர்ப்பணிப்பு மொழியின் வழிபாட்டு மற்றும் சட்ட வலிமை
  choice: קֹדֶשׁ என்பதை ‘பரிசுத்தமானவை’ என்றும் גאל என்பதை ‘மீட்டுக்கொள்’ என்றும் மொழிபெயர்த்தல்
  alternative: ‘புனிதமானவை’ மற்றும் ‘திரும்ப வாங்கு’ என்று பொதுவாக மொழிபெயர்த்தல்
  rationale: இவ்வசனம் இஸ்ரவேலின் வழிபாட்டுச் சட்டத்தில் அர்ப்பணிக்கப்பட்ட மிருகங்களைப் பற்றியது. தேர்ந்தெடுத்த சொற்கள் பிற்காலக் கோட்பாட்டைத் திணிக்காமல் மூலத்தின் திருநிலை மற்றும் சட்டப் பதிவைத் தக்கவைக்கின்றன.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. சட்டத் தடையை ‘கூடாது’ என்பதும், வழிபாட்டு அர்ப்பணிப்பு நிலையை ‘பரிசுத்தமானவை’ என்பதும் வெளிப்படுத்துகின்றன. கடைசி ஒருமை எபிரெய வினை இரண்டு மிருகங்களின் கூட்டத்தைக் குறிக்கும் சூழலில் தமிழில் பொருள் தெளிவுக்காகப் பன்மையாக வழங்கப்பட்டுள்ளது.
