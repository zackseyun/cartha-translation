  text: וְ/אִם בְּהֵמָ֔ה אֲשֶׁ֨ר יַקְרִ֧יבוּ מִמֶּ֛/נָּה קָרְבָּ֖ן לַֽ/יהוָ֑ה כֹּל֩ אֲשֶׁ֨ר יִתֵּ֥ן מִמֶּ֛/נּוּ לַ/יהוָ֖ה יִֽהְיֶה קֹּֽדֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/009.yaml
  text: And if it is an animal from which they present an offering to Yahweh[a], everything that one gives from it to Yahweh shall be holy.
translation:
  language: ta
  text: யாவேக்கு காணிக்கையாகச் செலுத்தத் தகுந்த விலங்காக அது இருந்தால்[a], அதிலிருந்து ஒருவர் யாவேக்குக் கொடுப்பது எதுவாயினும் பரிசுத்தமானதாக இருக்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேக்கு எந்த விலங்கிலிருந்து காணிக்கை செலுத்தப்படுகிறதோ, அத்தகைய விலங்காக அது இருந்தால்.” எபிரெயச் சொற்றொடர், காணிக்கையாகச் செலுத்தத் தகுந்த விலங்கையோ, உண்மையில் அதிலிருந்து காணிக்கை செலுத்தப்படும் விலங்கையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: அது ... இருந்தால்
  rationale: சட்ட விதியின் நிபந்தனைத் தொடர்ச்சியை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; எபிரெய இணைப்புச் சொல் தமிழில் தனியாக மொழிபெயர்க்கப்படாமலேயே தொடர்ச்சி தெளிவாக உள்ளது.
- source_word: בְּהֵמָה
  choice: விலங்கு
  rationale: பலியிடும் சூழலில் வரும் பொதுவான விலங்குப் பெயர்; ‘மிருகம்’ என்பதைக் காட்டிலும் நடுநிலையானதும் இன்றைய வாசகர்களுக்கு இயல்பானதும் ஆகும்.
- source_word: אֲשֶׁר יַקְרִיבוּ מִמֶּנָּה קָרְבָּן לַיהוָה
  choice: யாவேக்கு ஒரு காணிக்கையைச் செலுத்தும் விலங்கு வகையைச் சேர்ந்ததாக
  rationale: יַקְרִיבוּ என்பதன் பலிசார் ‘அருகே கொண்டுவருதல்/செலுத்துதல்’ பொருளையும், מִמֶּנָּה சுட்டும் வகை அல்லது மூல உறவையும் இயல்பான தமிழில் தருகிறது. இத்தொடரின் உண்மையான இலக்கணப் பொருள் வேறுபாடு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: קָרְבָּן
  choice: காணிக்கை
  rationale: பலிசார் சூழலில் கடவுளுக்குச் செலுத்தப்படும் அர்ப்பணிப்பைக் குறிக்கும் பரவலாகப் புரிந்துகொள்ளப்படும் தமிழ் சொல்.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: எபிரெய மூலத்தில் நேரடியாக வரும் உடன்படிக்கைப் பெயரான יהוה என்பதை மறைக்காமல் ஒலிபெயர்க்கிறது.
- source_word: כֹּל אֲשֶׁר יִתֵּן
  choice: ஒருவர் ... கொடுப்பது எதுவாயினும்
  rationale: எபிரெய ஒருமை வினையின் பொதுப்படையான, குறிப்பற்ற மனிதக் கர்த்தாவைப் பாலினம் சுமத்தாமல் பாதுகாக்கிறது.
- source_word: מִמֶּנּוּ
  choice: அதிலிருந்து
  rationale: முன்னர் குறிப்பிடப்பட்ட ஒருமை விலங்கை நேரடியாகச் சுட்டுகிறது.
- source_word: יִהְיֶה קֹדֶשׁ
  choice: பரிசுத்தமானதாக இருக்கும்
  rationale: அது யாவேக்கென அர்ப்பணிக்கப்பட்ட நிலையை அடைவதைச் சட்ட மற்றும் இறையியல் மரியாதைமிக்க நடையில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூல உரையில் வரும் தனிப்பட்ட உடன்படிக்கைப் பெயரை பொதுப் பட்டத்தால் மாற்றாமல், தமிழில் தெளிவாக ஒலிபெயர்க்கிறது.
- issue: קֹדֶשׁ குறிக்கும் அர்ப்பணிக்கப்பட்ட நிலை
  choice: பரிசுத்தமானதாக இருக்கும்
  alternative: புனிதமானதாக இருக்கும்
  rationale: விலங்கு யாவேக்கென ஒதுக்கப்பட்டு அவருக்குரியதாகும் பலிசார்-சட்ட நிலையைத் தக்கவைக்கிறது; பொதுவான சடங்கு மதிப்பீடாக மட்டும் குறுக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; சட்ட உரைக்கேற்ற சுருக்கமான, மரியாதைமிக்க நடை. ‘ஒருவர்’ என்பது பாலினம் குறிப்பிடாத பொதுப்படையான கர்த்தாவாகப் பயன்படுத்தப்பட்டுள்ளது. அடிக்குறிப்பு குறியீடு முதன்மை உரையில் சேர்க்கப்பட்டுள்ளது.
