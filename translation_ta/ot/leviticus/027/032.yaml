  text: And every tithe of the herd and the flock[a], every tenth animal that passes under the rod[b], shall be holy to Yahweh.
translation:
  language: ta
  text: மாடுகள் மற்றும் ஆட்டு மந்தைகளின் பத்திலொன்றாக, கோலுக்குக் கீழே கடந்து செல்லும் விலங்குகளில் ஒவ்வொரு பத்தாவது விலங்கும் யாவேக்குப் பரிசுத்தமானதாக இருக்கும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில், ‘பத்தாவது.’ கோலுக்குக் கீழே எண்ணப்படுவதற்காகக் கடந்து செல்லும் விலங்குகளில் ஒவ்வொரு பத்தாவது விலங்கையும் இது குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעְשַׂר
  choice: பத்திலொன்று
  rationale: ஒரு பத்தில் ஒரு பங்கைத் தனியே ஒதுக்கும் சட்டபூர்வமான கருத்தைத் தெளிவாகவும் இயல்பான தமிழிலும் வெளிப்படுத்துகிறது.
- source_word: בָּקָר וָצֹאן
  choice: மாடுகளிலும் ஆடுமாடுகளிலும்
  rationale: בָּקָר என்பது பெரிய கால்நடைகளையும் צֹאן என்பது செம்மறியாடுகள் மற்றும் வெள்ளாடுகள் அடங்கிய சிறு கால்நடைகளையும் குறிக்கிறது; ‘ஆடுமாடுகள்’ இங்கு கூட்டுப்பொருளை இயல்பாகத் தருகிறது.
- source_word: יַעֲבֹר תַּחַת הַשָּׁבֶט
  choice: கோலின்கீழ் கடந்து செல்லும்
  rationale: மேய்ப்பனின் கோலின்கீழ் கால்நடைகளை ஒன்றன்பின் ஒன்றாகச் செல்லவிட்டு எண்ணும் நடைமுறையை நேரடியாகப் பாதுகாக்கிறது.
- source_word: הָעֲשִׂירִי
  choice: பத்தாவது விலங்கு ஒவ்வொன்றும்
  rationale: எபிரெயில் உள்ள ‘பத்தாவது’ என்பதோடு சூழலில் மறைந்துள்ள ‘விலங்கு’ என்பதை வெளிப்படையாக்கி, தொடர்ந்து எண்ணப்படும் ஒவ்வொரு பத்தாவது விலங்கும் குறிக்கப்படுவதைத் தெளிவாக்குகிறது.
- source_word: יִהְיֶה קֹּדֶשׁ
  choice: பரிசுத்தமானதாக இருக்கும்
  rationale: அர்ப்பணிக்கப்பட்ட தன்மையையும் தேவனுக்குரிய பரிசுத்த நிலையையும் குறிக்கும் மூலமொழிக் கட்டமைப்பைத் தக்கவைக்கிறது.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: திருநாமமான יהוה என்பதை பொதுப்பட்டத்தால் மாற்றாமல், அதன் உடன்படிக்கைப் பெயராக ஒலிபெயர்க்கிறது; ל முன்னொட்டு அர்ப்பணிப்பு அல்லது உரிமையைச் சுட்டுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைத் திருநாமத்தின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் நேரடியாக வரும் உடன்படிக்கைத் திருநாமத்தை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது அதன் தனிப்பெயர் இயல்பைப் பாதுகாக்கிறது.
- issue: הָעֲשִׂירִי என்பதில் மறைந்துள்ள பெயர்ச்சொல்லை வெளிப்படுத்துதல்
  choice: பத்தாவது விலங்கு ஒவ்வொன்றும்
  alternative: பத்தாவது ஒன்று
  rationale: எண்ணப்படுவது கால்நடைகளே என்பது சூழலில் தெளிவு; ‘விலங்கு’ என்பதைச் சேர்ப்பது புதிய கருத்தைச் சேர்க்காமல் சட்டத்தின் பொருளை நவீன வாசகருக்குத் தெளிவாக்குகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சட்டநடையின் கண்ணியத்தையும் மூலமொழியின் கால்நடை எண்ணும் காட்சியையும் காத்துள்ளோம். ‘பத்திலொன்று’ தொழில்நுட்பக் கருத்தைத் தெளிவாக்குகிறது; ‘கோல்’ எளியதும் பண்பாட்டுச் சூழலுக்கு ஏற்றதும் ஆகும். அடிக்குறிப்பு குறியீடு முதன்மை உரையில் இணைக்கப்பட்டுள்ளது.
