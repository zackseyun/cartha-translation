source:
  edition: WLC
  text: וְ/אִם גָּאֹ֥ל יִגְאַ֛ל אִ֖ישׁ מִ/מַּֽעַשְׂר֑/וֹ חֲמִשִׁית֖/וֹ יֹסֵ֥ף עָלָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/031.yaml
  text: But if a man redeems any of his tithe[a], he shall add a fifth to it.
translation:
  language: ta
  text: ஆனால், ஒருவன் தனது தசமபாகத்தில் ஏதேனும் ஒரு பகுதியை மீட்டுக்கொண்டால்[a], அதனுடன் ஐந்தில் ஒரு பங்கைக் கூடுதலாகச் சேர்க்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், ‘மீட்கவே மீட்டுக்கொண்டால்’ என்பதுபோன்ற வலியுறுத்தும் இலக்கண அமைப்பு உள்ளது.
    reason: மூலமொழியின் வினை வலியுறுத்தலைத் தெரிவிக்கிறது; அதைத் தமிழில் சொற்சொல்லாக அமைத்தால் இயல்பற்றதாக இருக்கும்.
lexical_decisions:
- source_word: וְאִם
  choice: ஆனால், ... என்றால்
  rationale: சட்ட விதிகளின் தொடரில் மற்றொரு நிபந்தனைக்குரிய நிலையை அறிமுகப்படுத்துகிறது; இணைப்புச் சொல்லின் தொடர்ச்சி/மாறுபாட்டு நுணுக்கத்தை ‘ஆனால்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: גָּאֹל יִגְאַל
  choice: மீட்டுக்கொண்டால்[a]
  rationale: גאל என்பதன் infinitive absolute + imperfect அமைப்பு செயலை வலியுறுத்துகிறது. தமிழில் செயற்கையான இரட்டிப்பை முதன்மை உரையில் இடாமல், இயல்பான வினையால் பொருளைத் தந்து, அதன் வலியுறுத்தலை அடிக்குறிப்பில் குறிப்பிடுகிறது.
- source_word: אִישׁ
  choice: ஒருவன்
  rationale: எபிரெய சட்ட நடையில் வரும் ஆண்பால் ஒருமையைப் பொதுப்படையான ‘ஒருவன்’ என்பதால் துல்லியமாகவும் இயல்பாகவும் தருகிறது.
- source_word: מִמַּעַשְׂרוֹ
  choice: தனது பத்தில் ஒரு பங்கில் ஏதேனும் ஒரு பகுதியை
  rationale: מִן இங்கு பகுதிப்பொருளைக் குறிக்கிறது; முழுப் பத்திலிருந்து மீட்கப்படும் ஏதாவது ஒரு பகுதி என்ற பொருளை இந்த வடிவம் தெளிவாகக் காக்கிறது.
- source_word: חֲמִשִׁיתוֹ
  choice: ஐந்தில் ஒரு பங்கு
  rationale: மூலத்தில் உள்ள ‘ஐந்தாம் பங்கு’ என்ற அளவை எளிய நவீன தமிழில் துல்லியமாகத் தருகிறது.
- source_word: יֹסֵף עָלָיו
  choice: அதனுடன் ... கூடுதலாகச் சேர்க்க வேண்டும்
  rationale: Hiphil வினை ‘சேர்த்தல்’ என்றும் עַל இங்கு முதன்மைத் தொகையுடன் கூடுதலாகச் சேர்ப்பதையும் குறிக்கிறது; சட்டக் கடமையை ‘வேண்டும்’ இயல்பாக வெளிப்படுத்துகிறது.
