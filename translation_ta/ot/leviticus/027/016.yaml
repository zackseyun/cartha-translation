  text: וְ/אִ֣ם מִ/שְּׂדֵ֣ה אֲחֻזָּת֗/וֹ יַקְדִּ֥ישׁ אִישׁ֙ לַֽ/יהוָ֔ה וְ/הָיָ֥ה עֶרְכְּ/ךָ֖ לְ/פִ֣י זַרְע֑/וֹ זֶ֚רַע חֹ֣מֶר שְׂעֹרִ֔ים בַּ/חֲמִשִּׁ֖ים שֶׁ֥קֶל כָּֽסֶף׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/016.yaml
  text: 'If a man consecrates to Yahweh part of the field of his possession[a], then your valuation shall be according to its seed requirement: fifty shekels of silver for the seed of a homer of barley.'
translation:
  language: ta
  text: 'ஒருவன் தன் மரபுரிமை நிலத்திலிருந்து ஒரு பகுதியை[a] யாவேக்கெனப் புனிதமாக அர்ப்பணித்தால், நீ நிர்ணயிக்கும் மதிப்பு அதன் விதைப்பின் அளவுக்கேற்ப இருக்க வேண்டும்: ஒரு கோமர் அளவு வாற்கோதுமை விதைக்கு ஐம்பது சேக்கல் வெள்ளி.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தன் மரபுரிமை நிலத்தின் ஒரு பகுதியை.” எபிரெயத் தொடர் மரபுவழியாக உடைமையாக்கப்பட்ட நிலத்தைக் குறிக்கிறது; ‘இலிருந்து’ என்ற பொருளுடைய முன்னொட்டு, முழு நிலத்தையல்லாமல் அதன் ஒரு பகுதியை அர்ப்பணிப்பதைக் சுட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְּׂדֵה אֲחֻזָּתוֹ
  choice: தன் பரம்பரை உரிமை நிலத்தின் ஒரு பகுதியை
  rationale: שדה என்பது நிலத்தையும், אחזה என்பது குறிப்பாக மரபுவழியாகக் கிடைத்த நில உடைமையையும் குறிக்கிறது. முன்னொட்டு מן முழு நிலத்திலிருந்து ஒரு பகுதி அர்ப்பணிக்கப்படுவதைச் சுட்டுவதால் ‘ஒரு பகுதியை’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: יַקְדִּישׁ
  choice: புனிதமாக அர்ப்பணித்தால்
  rationale: லேவியராகமம் 27-ன் மதிப்பீட்டுச் சூழலில், ஒன்றை யாவேக்கெனப் புனிதப் பயன்பாட்டுக்காக வேறுபடுத்தி வைப்பதை இச்சொற்றொடர் தெளிவாக உணர்த்துகிறது.
- source_word: אִישׁ
  choice: ஒருவன்
  rationale: எபிரெயச் சொல் ஆண்பால் ஒருமையில் இருந்து சட்ட விதியில் பிரதிநிதித்துவப் பொருளுடன் வருகிறது; ‘ஒருவன்’ அதைப் பொருத்தமாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: மூலத்தில் வரும் உடன்படிக்கைப் பெயரான יהוה தமிழில் ஒலிபெயர்க்கப்பட்டு நேரடியாகக் கொடுக்கப்பட்டுள்ளது.
- source_word: עֶרְכְּךָ
  choice: நீ மதிப்பிட வேண்டும்
  rationale: இரண்டாம் நபர் ஒருமையைத் தக்கவைத்தபடி, ஆசாரிய அல்லது அதிகாரப்பூர்வ மதிப்பு நிர்ணயத்தை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לְפִי זַרְעוֹ
  choice: அதன் விதைப்புத் தேவைக்கேற்ப
  rationale: பின்னொட்டு நிலத்தைக் குறிக்கிறது; நிலத்தை விதைக்கத் தேவைப்படும் விதையின் அளவே மதிப்பீட்டின் அடிப்படை என்பதைத் தெளிவாக்குகிறது.
- source_word: זֶרַע חֹמֶר שְׂעֹרִים
  choice: ஒரு கோமர் அளவு வாற்கோதுமை விதை தேவைப்படும் நிலத்துக்கு
  rationale: ஒரு கோமர் அளவு வாற்கோதுமை விதையால் விதைக்கக்கூடிய நிலப்பரப்பை அடிப்படையாகக் கொண்ட தொழில்நுட்ப வேளாண் அளவீட்டை வாசகருக்குத் தெளிவாகக் காட்டுகிறது.
- source_word: בַּחֲמִשִּׁים שֶׁקֶל כָּסֶף
  choice: ஐம்பது சேக்கல் வெள்ளி
  rationale: மதிப்பிடப்பட்ட தொகையை மூலத்தின் அளவீட்டு அலகையும் உலோகத்தையும் தக்கவைத்து நேரடியாக வழங்குகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூல எபிரெய உரை நான்கெழுத்து உடன்படிக்கைப் பெயரை நேரடியாகப் பயன்படுத்துவதால், பட்டப்பெயராக மாற்றாமல் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- issue: சட்ட விதியில் வரும் ஆண்பால் איש
  choice: ஒருவன்
  alternative: ஒருவர்
  rationale: மூலத்தின் ஆண்பால் ஒருமை வடிவத்தைத் தக்கவைக்கிறது; அதேவேளையில் இச்சட்ட விதியில் அது பிரதிநிதித்துவப் பயன்பாடு கொண்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்ட மற்றும் வழிபாட்டு சூழலுக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘கோமர்’, ‘சேக்கல்’ ஆகிய மூல அளவீட்டு அலகுகள் தக்கவைக்கப்பட்டுள்ளன; வேளாண் மதிப்பீட்டின் பொருள் இயல்பான தமிழில் தெளிவாக்கப்பட்டுள்ளது.
