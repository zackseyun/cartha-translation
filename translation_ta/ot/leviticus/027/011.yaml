  text: ஆனால், யாவேவுக்குக் காணிக்கையாகச் செலுத்தக்கூடாத ஏதாவது அசுத்தமான விலங்கு என்றால்,[a] அவன் அந்த விலங்கை ஆசாரியரின் முன் நிறுத்த வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேவுக்குக் காணிக்கையாக ஒருவர் செலுத்த முடியாத ஏதாவது அசுத்தமான விலங்கு என்றால்.” எபிரெயத்தில் “அவர்கள் செலுத்தமாட்டார்கள்” என்ற பொதுப்பொருளுடைய பன்மை வினை ஆளில்லாப் பொருளில் பயன்படுத்தப்பட்டுள்ளது.
    reason: יַקְרִיבוּ என்ற பொதுப்பொருளுடைய பன்மை வினைக்கு ‘ஒருவர்’ என்ற ஆளில்லா மாற்று வெளிப்பாட்டை வழங்குகிறது.
lexical_decisions:
- source_word: וְאִם
  choice: ஆனால், ... என்றால்
  rationale: முந்தைய சட்டத்திலிருந்து மாறுபட்ட அடுத்த நிபந்தனையை அறிமுகப்படுத்துகிறது; இணைப்பையும் நிபந்தனைப் பொருளையும் இயல்பான தமிழில் தருகிறது.
- source_word: כָּל בְּהֵמָה טְמֵאָה
  choice: அசுத்தமான விலங்கு ஏதாவது
  rationale: כָּל என்பதன் உறுதியற்ற பொதுப்பொருளை ‘ஏதாவது’ தருகிறது; טְמֵאָה என்பது சடங்குசார் அசுத்தத்தைக் குறிக்கிறது.
- source_word: אֲשֶׁר לֹא יַקְרִיבוּ מִמֶּנָּה קָרְבָּן
  choice: அதிலிருந்து ... காணிக்கை செலுத்தக்கூடாத
  rationale: מִמֶּנָּה என்பதிலுள்ள ‘அதிலிருந்து’ என்ற உறவைப் பாதுகாக்கிறது. יַקְרִיבוּ என்னும் பொதுப்பொருளுடைய பன்மை வினையைத் தமிழில் ஆளில்லா அனுமதி/தகுதி வடிவில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: קָרְבָּן
  choice: காணிக்கை
  rationale: தேவனிடம் கொண்டுவரப்படும் பலி அல்லது அர்ப்பணிப்பைக் குறிக்கும் வழிபாட்டுச் சொல்லுக்கு நவீனத் தமிழில் தெளிவான பொதுச் சொல்.
- source_word: לַיהוָה
  choice: யாவேவுக்கு
  rationale: எபிரெய மூலத்தில் நேரடியாக வரும் உடன்படிக்கைப் பெயரான יהוה என்பதை ஒலிபெயர்த்து வழங்குகிறது.
- source_word: וְהֶעֱמִיד
  choice: நிறுத்த வேண்டும்
  rationale: עמד என்பதன் ஹிஃபில் வடிவிலுள்ள ‘நிற்கச் செய்தல்/முன் நிறுத்துதல்’ என்ற பொருளையும் சட்டக் கட்டளையின் வலிமையையும் பாதுகாக்கிறது.
- source_word: אֶת הַבְּהֵמָה לִפְנֵי הַכֹּהֵן
  choice: அந்த விலங்கைக் குருவின் முன்
  rationale: நேரடி பொருளையும் ஆசாரியரின் முன்னிலையில் மதிப்பிடுவதற்காக நிறுத்தும் முறையான சூழலையும் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: יהוה என்னும் இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் உள்ள தனிப்பட்ட உடன்படிக்கைப் பெயரை பொதுப் பட்டமாக மாற்றாமல் ஒலிபெயர்த்து, அதன் தனித்த அடையாளத்தைப் பாதுகாக்கிறது.
- issue: அசுத்தமான விலங்கு குறித்த விதியின் தன்மை
  choice: சடங்குசார் தகுதியின்மையைக் குறிக்கும் ‘அசுத்தமான’
  alternative: அழுக்கான
  rationale: טָמֵא இங்கு உடல் அழுக்கைக் குறிக்காமல், யாவேவுக்குப் பலியாகச் செலுத்தத் தகுதியற்ற சடங்குசார் நிலையைச் சுட்டுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்ட உரைக்கேற்ற கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டது. ‘குரு’ என்பது ஆசாரியப் பணியிலுள்ள நபரைக் குறிக்கிறது; ‘நிறுத்த வேண்டும்’ என்பது அடுத்த வசனத்தில் நடைபெறும் மதிப்பீட்டுக்காக விலங்கை அவன் முன்னிலையில் கொண்டுவந்து நிறுத்துவதைச் சுட்டுகிறது.
