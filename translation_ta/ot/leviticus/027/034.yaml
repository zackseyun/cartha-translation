source:
  edition: WLC
  text: אֵ֣לֶּה הַ/מִּצְוֺ֗ת אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֶת מֹשֶׁ֖ה אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל בְּ/הַ֖ר סִינָֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/034.yaml
  text: These are the commandments that Yahweh commanded Moses for the sons of Israel at Mount Sinai[a].
translation:
  language: ta
  text: சீனாய் மலையில் இஸ்ரவேல் மக்களுக்காக யாவே மோசேக்கு விதித்த கட்டளைகள் இவையே.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்ரவேல் மக்களிடம்.” “இஸ்ரவேல் மக்கள்” என்பதற்குப் பதிலாக “இஸ்ரவேலர்” என்றும் மொழிபெயர்க்கலாம்.
    reason: אֶל இச்சூழலில் ‘-க்காக’ என்ற நோக்குறவாகவும் ‘-இடம்’ என்ற திசைப்பொருளாகவும் புரிந்துகொள்ளப்படலாம்; בְּנֵי יִשְׂרָאֵל என்பது இஸ்ரவேலின் மக்களைக் குறிக்கும் வழக்கமான இனப்பெயர்.
lexical_decisions:
- source_word: אֵלֶּה הַמִּצְוֺת
  choice: கட்டளைகள் இவையே
  rationale: முடிவுரைச் சூத்திரத்தின் வலியுறுத்தலை இயல்பான தமிழ்ச் சொல் வரிசையில் தருகிறது; מִצְוָה என்பதன் சட்டப்பூர்வ வலிமையை ‘கட்டளைகள்’ காக்கிறது.
- source_word: צִוָּה
  choice: பிறப்பித்த
  rationale: அதிகாரத்துடன் கட்டளையிடுதல் என்ற வினைப்பொருளைத் தருகிறது; ‘கட்டளைகள் பிறப்பித்த’ என்பது நவீனத் தமிழில் இயல்பான சட்டநடை.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பட்டத்தை மாற்றாக இடாமல், எபிரெயத் தனிப்பெயரான நான்கெழுத்துப் பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אֶת מֹשֶׁה
  choice: மோசேயிடம்
  rationale: எபிரெயத்தில் மோசே வினையின் நேரடிச் செயப்படுபொருளாக இருந்தாலும், ‘ஒருவரிடம் கட்டளைகளைப் பிறப்பித்தல்’ என்பது தமிழில் இயல்பாக அதே உறவை வெளிப்படுத்துகிறது.
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் பிள்ளைகளுக்காக
  rationale: בְּנֵי יִשְׂרָאֵל என்பதன் குடும்பவழி உருவகத்தை ‘இஸ்ரவேலின் பிள்ளைகள்’ காக்கிறது; אֶל இங்கு அவர்களை நோக்கமாகக் கொண்ட கட்டளைகள் என்ற பொருளில் ‘-க்காக’ என வழங்கப்பட்டுள்ளது.
- source_word: בְּהַר סִינָי
  choice: சீனாய் மலையில்
  rationale: בְּ என்ற இடப்பொருளையும் மலையின் பெயரையும் நேரடியாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக உள்ளது; பட்டப்பெயராக மாற்றாமல் அதன் தனிப்பெயர்த் தன்மையைப் பாதுகாக்கிறது.
- issue: בְּנֵי יִשְׂרָאֵל என்ற சொற்றொடரின் வழங்கல்
  choice: இஸ்ரவேலின் பிள்ளைகள்
  alternative: இஸ்ரவேலர் / இஸ்ரவேலின் மகன்கள்
  rationale: இது இனமுழுவதையும் குறிக்கும் குடும்பவழிச் சொற்றொடர். ‘பிள்ளைகள்’ அந்த உருவகத்தைப் பாதுகாக்கிறது; ‘மகன்கள்’ தமிழில் ஆண்களை மட்டும் குறிக்கும் தவறான எண்ணத்தை ஏற்படுத்தக்கூடும்.
- issue: אֶל என்பதன் உறவு
  choice: இஸ்ரவேலின் பிள்ளைகளுக்காக
  alternative: இஸ்ரவேலின் பிள்ளைகளிடம்
  rationale: மோசே பெற்ற கட்டளைகள் இஸ்ரவேல் மக்களுக்குத் தெரிவிக்கப்பட வேண்டியவை என்ற நோக்குறவை முதன்மைப்படுத்துகிறது; இருப்பினும் ‘அவர்களிடம்’ என்ற திசைப்பொருளும் இலக்கண ரீதியாகச் சாத்தியமாதலால் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், லேவியராகமத்தின் நிறைவு வசனத்திற்கேற்ற சுருக்கமான, கண்ணியமான சட்டநடை பயன்படுத்தப்பட்டுள்ளது. ‘கட்டளைகள் இவையே’ என்ற இறுதி அமைப்பு எபிரெய முடிவுரை வலியுறுத்தலைத் தக்கவைக்கிறது.
