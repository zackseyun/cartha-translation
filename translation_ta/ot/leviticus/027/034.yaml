    text: அல்லது, “இஸ்ரவேல் மக்களிடம்.” “இஸ்ரவேல் மக்கள்” என்பதற்குப் பதிலாக “இஸ்ரவேலர்” என்றும் மொழிபெயர்க்கலாம்.
    reason: אֶל இச்சூழலில் ‘-க்காக’ என்ற நோக்குறவாகவும் ‘-இடம்’ என்ற திசைப்பொருளாகவும் புரிந்துகொள்ளப்படலாம்; בְּנֵי יִשְׂרָאֵל என்பது இஸ்ரவேலின் மக்களைக் குறிக்கும் வழக்கமான இனப்பெயர்.
  revision_rationale: The revision retains the Hebrew concluding emphasis, legal register, divine name, and Sinai setting. It improves the Tamil expression of Yahweh’s command to Moses and uses an idiomatic collective rendering for Israel while preserving the prepositional alternative in the footnote.
