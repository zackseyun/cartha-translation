  text: And every valuation of yours shall be by the sanctuary shekel[a]; the shekel shall be twenty gerahs.
translation:
  language: ta
  text: உன் ஒவ்வொரு மதிப்பீடும் பரிசுத்த ஸ்தலத்தின் சேக்கல் அளவின்படியே இருக்க வேண்டும்[a]; ஒரு சேக்கல் இருபது கேராவாக இருக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பரிசுத்த சேக்கலின்படி.” எபிரேயச் சொற்றொடர், பரிசுத்த ஸ்தலம் சார்ந்த மதிப்பீடுகளுக்குப் பயன்படுத்தப்பட்ட நிலையான சேக்கல் அளவைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְכְּךָ
  choice: உன் மதிப்பீடுகள்
  rationale: லேவியராகமம் 27-இல் நேர்ந்துகொண்டவை மற்றும் அர்ப்பணிக்கப்பட்ட நபர்கள் அல்லது பொருட்களுக்கு நிர்ணயிக்கப்படும் மதிப்பைக் குறிக்கும் தொழில்நுட்பப் பொருளை ‘மதிப்பீடு’ காக்கிறது; இரண்டாம் நபர் ஒருமை உரிமை விகுதியும் ‘உன்’ எனத் தக்கவைக்கப்படுகிறது.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: பரிசுத்த இடத்தின் சேக்கல் கணக்கின்படி
  rationale: ஆலயம் சார்ந்த மதிப்பீடுகளுக்குப் பயன்படுத்தப்பட்ட அதிகாரப்பூர்வ எடை அல்லது நாணய அளவுத்தரத்தை இயல்பான தமிழில் தெரிவிக்கிறது; ‘பரிசுத்தமான சேக்கல்’ என்ற பண்புசார் பொருளாக மட்டும் சுருக்கவில்லை.
- source_word: גֵּרָה
  choice: கேரா
  rationale: இதற்கு நேரான இயல்பான தமிழ் அளவைச்சொல் இல்லாததால், சிறிய எடை அல்லது நாணய அலகின் எபிரேயப் பெயர் ஒலிபெயர்க்கப்படுகிறது.
- source_word: עֶשְׂרִים גֵּרָה יִהְיֶה הַשָּׁקֶל
  choice: ஒரு சேக்கல் இருபது கேரா
  rationale: சேக்கலின் அளவை வரையறுக்கும் கூற்றைச் சுருக்கமாகவும் தெளிவாகவும் வழங்குகிறது; தமிழில் எண்ணுக்குப் பின் அலகுப்பெயரை ஒருமை வடிவில் பயன்படுத்துவது இயல்பு.
- source_word: וְכָל
  choice: ஒவ்வொன்றும்
  rationale: சூழலில் ஒவ்வொரு மதிப்பீடும் இந்த அளவுத்தரத்தின்படி அமைய வேண்டும் என்ற பகிர்வுப் பொருளைத் தெளிவாக்குகிறது; வசனத்தின் நடுப்பகுதி தொடர்ச்சியை அரைப்புள்ளி இயல்பாகக் காட்டுகிறது.
- source_word: יִהְיֶה
  choice: இருக்க வேண்டும்
  rationale: சட்ட உரையில் வரும் எபிரேய நிறைவுறா வினையின் கட்டளைசார் வலிமையை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
