  text: וְ/הָיָ֨ה הַ/שָּׂדֶ֜ה בְּ/צֵאת֣/וֹ בַ/יֹּבֵ֗ל קֹ֛דֶשׁ לַֽ/יהוָ֖ה כִּ/שְׂדֵ֣ה הַ/חֵ֑רֶם לַ/כֹּהֵ֖ן תִּהְיֶ֥ה אֲחֻזָּתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/021.yaml
  text: But the field[a], when it is released in the Jubilee, shall be holy to Yahweh, like a field devoted to destruction; it shall be the priest’s possession.
translation:
  language: ta
  text: ஆனால் அந்த வயல், யூபிலி ஆண்டில் விடுவிக்கப்படும்போது, திரும்பப் பெறமுடியாதபடி அர்ப்பணிக்கப்பட்ட வயலைப்போல[a] யாவேவுக்குப் பரிசுத்தமானதாக இருக்கும்; அது ஆசாரியனின் நிலஉடைமையாகும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல், யாவேவுக்கு திரும்பப் பெறமுடியாதபடி அர்ப்பணிக்கப்பட்டு, சாதாரண மனிதப் பயன்பாட்டிலிருந்து நீக்கப்பட்ட ஒன்றைக் குறிக்கிறது. இதை ‘தடைக்குட்பட்ட வயலைப்போல’ என்றும் மொழிபெயர்க்கலாம்; சில சூழல்களில் இது ‘அழிப்புக்கென அர்ப்பணிக்கப்பட்ட’ பொருளையும் கொண்டுள்ளது.
    reason: חֵרֶם என்ற சொல்லின் மீளப்பெற முடியாத அர்ப்பணிப்பு என்ற முதன்மைப் பொருளையும், தடை மற்றும் சில சூழல்களிலான அழிவு சார்ந்த பொருள் நிழல்களையும் பாதுகாக்கிறது.
lexical_decisions:
- source_word: וְהָיָה
  choice: ஆனால் ... இருக்கும்
  rationale: முந்தைய வசனத்தின் மீட்பு வாய்ப்புடன் உள்ள விளைவு சார்ந்த வேறுபாட்டை இயல்பான தமிழில் காட்டுகிறது.
- source_word: הַשָּׂדֶה
  choice: அந்த வயல்
  rationale: முன்னர் விவாதிக்கப்பட்ட குறிப்பிட்ட வயலைச் சுட்டும் எபிரெய definite பெயர்ச்சொல்லைத் தெளிவாக வழங்குகிறது.
- source_word: בְּצֵאתוֹ בַיֹּבֵל
  choice: யூபிலி ஆண்டில் விடுவிக்கப்படும்போது
  rationale: சொல்லாட்சிப்படி ‘அது வெளியே செல்லும்போது’; யூபிலிச் சட்டச் சூழலில் சொத்து விடுவிக்கப்படுதல் அல்லது முந்தைய கட்டுப்பாட்டிலிருந்து வெளியேறுதல் என்பதே பொருள்.
- source_word: קֹדֶשׁ לַיהוָה
  choice: யாவேவுக்குப் பரிசுத்தமானதாக
  rationale: யாவேவுக்கெனப் பிரித்துவைக்கப்பட்ட புனித நிலையை வெளிப்படுத்துகிறது; திருப்பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: כִּשְׂדֵה הַחֵרֶם
  choice: முற்றிலும் அர்ப்பணிக்கப்பட்ட வயலைப்போல
  rationale: חֵרֶם என்பது சாதாரண மனிதப் பயன்பாட்டிலிருந்து மீளமுடியாதபடி நீக்கப்பட்டு இறைவனுக்கென ஒதுக்கப்பட்டதைச் சுட்டுகிறது. இச்சூழலில் வயலே ஆசாரியனின் உரிமைச் சொத்தாகிறது என்பதால் ‘அழிப்புக்கென்று’ என்று மட்டும் மொழிபெயர்த்து பொருளைக் குறுக்காமல், அதன் இறுதியான அர்ப்பணிப்பை முதன்மை உரை காக்கிறது.
- source_word: לַכֹּהֵן תִּהְיֶה אֲחֻזָּתוֹ
  choice: அது ஆசாரியனுடைய உரிமைச் சொத்தாக இருக்கும்
  rationale: אֲחֻזָּה என்பதன் நிலையான நிலவுடைமை அல்லது உரிமைப் பங்கு சார்ந்த சட்டப் பொருளை ‘உரிமைச் சொத்து’ வெளிப்படுத்துகிறது.
theological_decisions:
- issue: חֵרֶם என்ற சொல்லின் அர்ப்பணிப்பு மற்றும் அழிவு சார்ந்த பொருள்
  choice: முற்றிலும் அர்ப்பணிக்கப்பட்ட வயல்
  alternative: அழிப்புக்கென்று அர்ப்பணிக்கப்பட்ட வயல் / தடைக்குட்பட்ட வயல்
  rationale: חֵרֶם மீளப்பெற முடியாத அர்ப்பணிப்பையும் சாதாரண பயன்பாட்டிலிருந்து நீக்கப்படுதலையும் குறிக்கிறது; சில சூழல்களில் அழிவையும் உட்படுத்துகிறது. ஆனால் இவ்வசனத்தில் வயல் ஆசாரியனின் உரிமைச் சொத்தாக இருப்பதால், அழிப்பைத் தவிர்க்க முடியாத விளைவாக முதன்மை உரையில் விதிக்காமல் உண்மையான சொற்பொருள் விரிவை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சட்டச் சூழலுக்கேற்ற கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. ‘யூபிலி ஆண்டு’, ‘உரிமைச் சொத்து’ ஆகியவை பொதுவாசகருக்குத் தெளிவாகவும் மூலத்தின் நிலவுடைமைச் சட்ட நுணுக்கத்தைத் தக்கவைத்தும் உள்ளன.
