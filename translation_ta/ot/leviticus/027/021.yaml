revisions:
- from: ஆனால் அந்த வயல், யூபிலி ஆண்டில் விடுவிக்கப்படும்போது, முற்றிலும் அர்ப்பணிக்கப்பட்ட வயலைப்போல[a] யாவேவுக்குப் பரிசுத்தமானதாக இருக்கும்; அது ஆசாரியனுடைய உரிமைச் சொத்தாக இருக்கும்.
  to: ஆனால் அந்த வயல், யூபிலி ஆண்டில் விடுவிக்கப்படும்போது, திரும்பப் பெறமுடியாதபடி அர்ப்பணிக்கப்பட்ட வயலைப்போல[a] யாவேவுக்குப் பரிசுத்தமானதாக இருக்கும்; அது ஆசாரியனின் நிலஉடைமையாகும்.
  rationale: The revision makes the irreversible legal force of חֵרֶם explicit without asserting that this particular field is destroyed, since the verse assigns it to the priest as a landholding. It also improves the Tamil legal-property expression while retaining the draft’s accurate Jubilee and consecration language.
