base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/030.yaml
  text: Every tithe of the land[a], from the seed of the land and from the fruit of the tree, belongs to Yahweh; it is holy to Yahweh.
translation:
  language: ta
  text: நிலத்தின் விதையிலிருந்தும் மரத்தின் கனியிலிருந்தும் கிடைக்கும் பத்தில் ஒரு பங்கு முழுவதும் யாவேக்குரியது; அது யாவேக்குப் பரிசுத்தமானது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכָל מַעְשַׂר הָאָרֶץ
  choice: நிலத்தின் விளைச்சலில் வரும் ஒவ்வொரு பத்திலொரு பங்கும்
  rationale: מַעְשַׂר என்பது பத்தில் ஒரு பங்கைக் குறிக்கும் வழிபாட்டுச் சொல். அடுத்துள்ள விதை, கனி ஆகியவை விவசாய விளைச்சலைக் குறிப்பதால் הָאָרֶץ என்பதை இயல்பான தமிழில் ‘நிலத்தின் விளைச்சல்’ என்று தெளிவுபடுத்துவது பொருளைக் காக்கிறது.
- source_word: מִזֶּרַע הָאָרֶץ
  choice: நிலத்தின் விதையிலிருந்தும்
  rationale: எபிரெயச் சொல்லாட்சியிலுள்ள ‘நிலத்தின் விதை’ என்ற உருவகத்தைத் தக்கவைத்தும், மூலத்திலுள்ள מִן உறவைக் காட்ட ‘இலிருந்தும்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: מִפְּרִי הָעֵץ
  choice: மரத்தின் கனியிலிருந்தும்
  rationale: ‘மரம்’ என்ற ஒருமை எபிரெயத்தில் தொகுதிப்பொருளில் வரக்கூடும்; மூல வடிவத்தைத் தக்கவைக்கும் இயல்பான தமிழ் இது.
- source_word: לַיהוָה הוּא
  choice: யாவேக்கு உரியது
  rationale: לְ இங்கு உடைமை அல்லது அர்ப்பணிப்பைக் குறிக்கிறது. ‘உரியது’ என்பது இரண்டையும் தேவையின்றி மிகத் துல்லியப்படுத்தாமல் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தேவனுடைய தனிப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: קֹדֶשׁ לַיהוָה
  choice: யாவேக்குப் பரிசுத்தமானது
  rationale: קֹדֶשׁ என்பதன் வழிபாட்டு மற்றும் இறையியல் வலிமையை ‘பரிசுத்தமானது’ காக்கிறது; ‘மிகப் பரிசுத்தமானது’ என மொழிபெயர்ப்பதற்கு மூலத்தில் உயர்நிலை வடிவம் இல்லை.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் ஒரு பட்டம் அல்ல, தேவனுடைய தனிப்பெயரே நேரடியாக உள்ளது. ஆகவே அதை ‘யாவே’ என்று ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைக் காக்கிறது.
- issue: காணிக்கையின் பரிசுத்த நிலை
  choice: யாவேக்குப் பரிசுத்தமானது
  alternative: யாவேக்காக ஒதுக்கப்பட்டது
  rationale: ‘ஒதுக்கப்பட்டது’ நடைமுறைப் பொருளை மட்டும் தெரிவிக்கக்கூடும்; ‘பரிசுத்தமானது’ קֹדֶשׁ என்பதன் வழிபாட்டு-இறையியல் கருத்தையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘தசமபாகம்’ என்ற திருச்சபைச் சிறப்புச்சொல்லுக்குப் பதிலாக உடனடியாக விளங்கும் ‘பத்திலொரு பங்கு’ பயன்படுத்தப்பட்டது. மூலத்தின் இரண்டு מִן சொற்றொடர்களும் கோடுகளுக்குள் விளக்கவுரைப் போன்று அமைக்கப்பட்டுள்ளன.
