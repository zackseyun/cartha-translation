base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/003.yaml
  text: And your valuation for the male from twenty years old up to sixty years old shall be fifty shekels of silver[a], according to the sanctuary shekel.
translation:
  language: ta
  text: இருபது வயது முதல் அறுபது வயது வரையுள்ள ஆணுக்கான உன் மதிப்பீடு, பரிசுத்த ஸ்தலச் சேக்கலின்படி ஐம்பது சேக்கல் வெள்ளி[a] ஆக இருக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பரிசுத்த ஸ்தலத்தின் சேக்கல் அளவின்படி.” எபிரெயத் தொடர், சேக்கல் அளவிடப்படுவதற்கான பரிசுத்தமான தரநிலையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְכְּךָ
  choice: நீ நிர்ணயிக்கும் மதிப்பு
  rationale: இது ஒருவரின் உள்ளார்ந்த மதிப்பைக் குறிக்காமல், நேர்த்திக்கடன் தொடர்பாக விதிக்கப்படும் சடங்கு-சட்ட மதிப்பீட்டைக் குறிக்கிறது; இரண்டாம் நபர் பின்னொட்டையும் வெளிப்படுத்துகிறது.
- source_word: הַזָּכָר
  choice: ஆண்
  rationale: எபிரெயச் சொல் பாலினத்தைத் தெளிவாகக் குறிக்கும் சட்ட வகைப்பாடு; ‘மனிதன்’ என்று பொதுமைப்படுத்தாமல் ‘ஆண்’ என்று தரப்படுகிறது.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וְעַד בֶּן שִׁשִּׁים שָׁנָה
  choice: இருபது வயதுமுதல் அறுபது வயதுவரை
  rationale: வயது வரம்பைக் குறிக்கும் எபிரெய மரபுத்தொடரை இயல்பான நவீன தமிழில் துல்லியமாகத் தருகிறது.
- source_word: חֲמִשִּׁים שֶׁקֶל כֶּסֶף
  choice: ஐம்பது சேக்கல் வெள்ளி
  rationale: உலோகத்தையும் எடையலகையும் நேரடியாகப் பாதுகாக்கிறது; ‘சேக்கல்’ என்பது இங்கு எடை மற்றும் மதிப்பீட்டு அலகு.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: பரிசுத்த இடத்தின் சேக்கல் அளவுப்படி
  rationale: בְּ என்பது அளவீட்டுத் தரநிலையைச் சுட்டுகிறது; הַקֹּדֶשׁ இச்சூழலில் பரிசுத்த இடத்துடன் தொடர்புடைய அதிகாரப்பூர்வ சேக்கல் தரநிலையைக் குறிக்கிறது.
- source_word: וְהָיָה ... וְהָיָה
  choice: இருந்தால் ... இருக்க வேண்டும்
  rationale: சட்ட விதியின் நிபந்தனை மற்றும் கட்டளையிடும் தன்மையைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: பாலின அடிப்படையிலான மதிப்பீட்டு வகை
  choice: ஆண்
  alternative: மனிதன் / ஓர் ஆண் நபர்
  rationale: வசனம் வயதையும் பாலினத்தையும் அடிப்படையாகக் கொண்ட சட்ட வகையை வரையறுக்கிறது; மூலத்தின் பாலினக் குறிப்பை நடுநிலைப்படுத்தாமல் பாதுகாக்கிறது.
- issue: עֵרֶךְ என்பதன் தன்மை
  choice: நிர்ணயிக்கும் மதிப்பு
  alternative: மதிப்பு / மதிப்பீடு
  rationale: இது மனிதரின் கண்ணியம் அல்லது சந்தை விலையைப் பற்றிய கூற்று அல்ல; நேர்த்திக்கடனுக்காக நிர்ணயிக்கப்படும் வழிபாட்டு-சட்ட மதிப்பைக் குறிக்கிறது.
- issue: பரிசுத்த இடத்தின் சேக்கல்
  choice: அளவீட்டுத் தரநிலை
  alternative: பரிசுத்தமான சேக்கல்
  rationale: இந்தச் சொற்றொடர் சேக்கலின் ஒழுக்க அல்லது ஆன்மிகத் தன்மையை அல்ல, பரிசுத்த இடத்தோடு தொடர்புடைய அங்கீகரிக்கப்பட்ட எடைத் தரநிலையைச் சுட்டுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டவிதியின் கண்ணியமான தொனியுடன் மொழிபெயர்க்கப்பட்டுள்ளது. ‘நீ நிர்ணயிக்கும் மதிப்பு’ என்பது இரண்டாம் நபர் குறிப்பையும் சடங்கு-சட்டப் பொருளையும் தெளிவாக்குகிறது; தேவையற்ற அடிக்குறிப்பு சேர்க்கப்படவில்லை.
