revisions:
- from: ஆண் இருபது வயதுமுதல் அறுபது வயதுவரை உள்ளவனாக இருந்தால், நீ நிர்ணயிக்கும் மதிப்பு பரிசுத்த இடத்தின் சேக்கல் அளவுப்படி ஐம்பது சேக்கல் வெள்ளியாக இருக்க வேண்டும்.
  to: இருபது வயது முதல் அறுபது வயது வரையுள்ள ஆணுக்கான உன் மதிப்பீடு, பரிசுத்த ஸ்தலச் சேக்கலின்படி ஐம்பது சேக்கல் வெள்ளி[a] ஆக இருக்க வேண்டும்.
  rationale: The revision removes the source-unwarranted conditional, directly reflects the second-person possessive in “உன் மதிப்பீடு,” and uses a more idiomatic Tamil expression for the sanctuary-shekel standard. The age, sex classification, prescribed amount, and legal force are preserved without importing doctrinal interpretation.
