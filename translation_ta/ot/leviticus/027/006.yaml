reference: Leviticus 27:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/אִ֣ם מִ/בֶּן חֹ֗דֶשׁ וְ/עַד֙ בֶּן חָמֵ֣שׁ שָׁנִ֔ים וְ/הָיָ֤ה עֶרְכְּ/ךָ֙ הַ/זָּכָ֔ר חֲמִשָּׁ֥ה שְׁקָלִ֖ים כָּ֑סֶף וְ/לַ/נְּקֵבָ֣ה עֶרְכְּ/ךָ֔ שְׁלֹ֥שֶׁת שְׁקָלִ֖ים כָּֽסֶף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/006.yaml
  text: If it is from a month old up to five years old, your valuation for the male shall be five shekels of silver, and for the female your valuation shall be three shekels of silver.
translation:
  language: ta
  text: ஒரு மாத வயதிலிருந்து ஐந்து வயது வரையுள்ளவராக இருந்தால், ஆணுக்கு நீ நிர்ணயிக்கும் மதிப்பு ஐந்து வெள்ளிச் சேக்கல்களாகவும், பெண்ணுக்கு நீ நிர்ணயிக்கும் மதிப்பு மூன்று வெள்ளிச் சேக்கல்களாகவும் இருக்க வேண்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִבֶּן חֹדֶשׁ
  choice: ஒரு மாத வயதுமுதல்
  rationale: எபிரெய வயதுக் குறிப்பை இயல்பான நவீனத் தமிழில் தருகிறது; வயது வரம்பின் தொடக்கத்தையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: וְעַד בֶּן חָמֵשׁ שָׁנִים
  choice: ஐந்து வயதுவரை
  rationale: சட்டப்பூர்வ மதிப்பீட்டு வயது வரம்பின் முடிவைச் சுருக்கமாகவும் துல்லியமாகவும் காட்டுகிறது.
- source_word: עֶרְכְּךָ
  choice: நீ நிர்ணயிக்கும் மதிப்பு
  rationale: இரண்டாம் நபர் ஒருமை பின்னொட்டையும், நேர்ச்சை தொடர்பான அதிகாரப்பூர்வ நிர்ணய மதிப்பு என்ற சூழலையும் வெளிப்படுத்துகிறது.
- source_word: הַזָּכָר
  choice: ஆணுக்கு
  rationale: வயதைக் குறிக்கும் ‘சிறுவன்’ போன்ற சொல்லைச் சேர்க்காமல், மூலத்தில் உள்ள பாலின வகைப்பாட்டைப் பாதுகாக்கிறது.
- source_word: חֲמִשָּׁה שְׁקָלִים כָּסֶף
  choice: ஐந்து வெள்ளிச் சேக்கல்கள்
  rationale: எண்ணிக்கை, எடை/நாணய அலகு, வெள்ளி ஆகிய அனைத்தையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: וְלַנְּקֵבָה
  choice: பெண்ணுக்கு
  rationale: ஆண்–பெண் என்ற சட்ட வகைப்பாட்டின் இணை அமைப்பை இயல்பான தமிழில் தருகிறது.
- source_word: שְׁלֹשֶׁת שְׁקָלִים כָּסֶף
  choice: மூன்று வெள்ளிச் சேக்கல்கள்
  rationale: ஆணுக்கான தொகையுடன் சொற்றொடர் ஒற்றுமையைப் பேணி, மூலத் தொகையைத் துல்லியமாகத் தருகிறது.
- source_word: וְהָיָה
  choice: இருக்க வேண்டும்
  rationale: சட்ட உரையின் கட்டளை/விதிமுறை வலிமையை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
