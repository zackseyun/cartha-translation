translation_notes:
  register: நவீன நிலையான தமிழ்; லேவியராகமத்தின் சட்டப்பூர்வ தொனியைத் தக்கவைத்து, சாதாரண வாசகர்களுக்குப் புரியும் வகையில் அமைக்கப்பட்டது. ‘மதிப்பு’ என்பது மனிதரின் உள்ளார்ந்த மதிப்பைக் குறிக்காமல், நேர்ச்சைச் சட்டத்தில் நிர்ணயிக்கப்படும் தொகையைக் குறிக்கும் வகையில் ‘நீ நிர்ணயிக்கும்’ என்பதுடன் வழங்கப்பட்டுள்ளது.
