source:
  edition: WLC
  text: וְ/אִם לֹ֤א יִגְאַל֙ אֶת הַ/שָּׂדֶ֔ה וְ/אִם מָכַ֥ר אֶת הַ/שָּׂדֶ֖ה לְ/אִ֣ישׁ אַחֵ֑ר לֹ֥א יִגָּאֵ֖ל עֽוֹד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/020.yaml
  text: But if he does not redeem the field[a], or if he has sold the field to another man, it may not be redeemed again.
translation:
  language: ta
  text: ஆனால் அவன் அந்த வயலை மீட்டுக்கொள்ளாவிட்டால், அல்லது அதை வேறொரு மனிதனுக்கு[a] விற்றுவிட்டால், அதை இனி மீட்க இயலாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வேறொருவருக்கு.” எபிரெயத்தில், “வேறொரு மனிதனுக்கு.”
    reason: איש ஆண்பால் வடிவத்தில் இருந்தாலும், சட்டச் சூழலில் பொதுப்பொருளில் ‘ஒருவர்’ என்றும் புரிந்துகொள்ளப்படலாம்.
lexical_decisions:
- source_word: וְאִם
  choice: ஆனால் ... -ஆவிட்டால் / அல்லது ... -ஆல்
  rationale: முந்தைய வசனத்தின் நிபந்தனைத் தொடர்ச்சியைத் தமிழில் இயல்பாகக் காட்ட ‘ஆனால்’ பயன்படுத்தப்பட்டுள்ளது; இரண்டாவது וְאִם மாற்று நிபந்தனையைச் சுட்டுவதால் ‘அல்லது’ என வழங்கப்பட்டுள்ளது.
- source_word: יִגְאַל / יִגָּאֵל
  choice: மீட்டுக்கொள்ளாவிட்டால் / மீட்க இயலாது
  rationale: גאל என்பதன் அர்ப்பணிக்கப்பட்ட சொத்தை மீட்கும் சட்ட-புனிதப் பொருளை ‘மீட்டுக்கொள்/மீட்க’ காக்கிறது. இறுதி நிபால் வடிவம் சட்டரீதியான மீட்பு இனி சாத்தியமில்லை என்பதாக இயல்பான தமிழில் தரப்பட்டுள்ளது.
- source_word: הַשָּׂדֶה
  choice: அந்த வயல்
  rationale: இங்கு பொதுவான நிலப்பரப்பல்ல, முன்பே குறிப்பிடப்பட்ட குறிப்பிட்ட வயலே குறிக்கப்படுகிறது; தமிழ் சுட்டுப்பெயரடை அந்தத் தொடர்பைத் தெளிவாக்குகிறது.
- source_word: מָכַר
  choice: விற்றுவிட்டால்
  rationale: நிறைவடைந்த விற்பனை தொடர்ந்து சட்ட விளைவை ஏற்படுத்துகிறது என்பதை ‘விற்றுவிட்டால்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לְאִישׁ אַחֵר
  choice: வேறொரு மனிதனுக்கு
  rationale: איש என்பதன் ஆண்பால் ஒருமை வடிவத்தை மறைக்காமல், நவீனத் தமிழில் புரியத்தக்க வகையில் வழங்குகிறது; சட்டப் பயன்பாட்டில் பொதுப்பொருள் இருக்கக்கூடும் என்பதைக் குறிப்பில் தருகிறது.
- source_word: עוֹד
  choice: இனி
  rationale: விற்பனைக்குப் பின் மீட்பு மேலும் சாத்தியமில்லை என்ற காலத்தொடர்புடைய சட்ட விளைவை ‘இனி’ தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: சட்ட வாசகத்தில் பொதுப்பொருளில் வரக்கூடிய ஆண்பால் சொல்
  choice: வேறொரு மனிதனுக்கு
  alternative: வேறொருவருக்கு
  rationale: எபிரெயச் சொல்லின் ஆண்பால் வடிவத்தை முதன்மை உரையில் காக்கிறது; அது சட்டச் சூழலில் பொதுப்பொருளிலும் அமையலாம் என்பதை அடிக்குறிப்பு தெரிவிக்கிறது.
- issue: גאל என்பதன் சட்ட-புனித நுட்பம்
  choice: மீட்டுக்கொள் / மீட்க
  alternative: திரும்ப வாங்கு
  rationale: இது வெறும் வணிகரீதியான மறுவாங்குதல் மட்டுமல்லாமல், அர்ப்பணிக்கப்பட்ட சொத்தைச் சார்ந்த தொழில்நுட்பமான மீட்பைக் குறிக்கிறது; ‘மீட்க’ அந்த நுட்பத்தைக் கூடுதல் கோட்பாட்டு விளக்கமின்றி காக்கிறது.
- issue: לֹא יִגָּאֵל עוֹד என்பதன் சட்ட வலிமை
  choice: அதை இனி மீட்க இயலாது
  alternative: அது மீண்டும் மீட்கப்படாது
  rationale: எபிரெய வாசகம் எதிர்காலக் கணிப்பாக மட்டுமல்லாமல் சட்டரீதியான சாத்தியமின்மையையும் தருகிறது. தேர்ந்த வடிவம் தமிழில் அந்தச் சட்ட விளைவைத் தெளிவாக்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான சட்ட நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘வயல்,’ ‘மீட்க,’ ‘விற்றுவிட்டால்’ ஆகிய சொற்கள் சூழலின் சொத்து-மீட்பு தொடர்பைத் தெளிவாகக் காக்கின்றன; அடிக்குறிப்பு குறியீடு தொடர்புடைய சொற்றொடருக்குப் பின்னரே வைக்கப்பட்டுள்ளது.
