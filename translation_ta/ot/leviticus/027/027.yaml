source:
  edition: WLC
  text: וְ/אִ֨ם בַּ/בְּהֵמָ֤ה הַ/טְּמֵאָה֙ וּ/פָדָ֣ה בְ/עֶרְכֶּ֔/ךָ וְ/יָסַ֥ף חֲמִשִׁת֖/וֹ עָלָ֑י/ו וְ/אִם לֹ֥א יִגָּאֵ֖ל וְ/נִמְכַּ֥ר בְּ/עֶרְכֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/027.yaml
  text: But if it is among the unclean animals[a], then he shall redeem it at your valuation and add a fifth of it to it; and if it is not redeemed[b], then it shall be sold at your valuation.
translation:
  language: ta
  text: ஆனால் அது சடங்குமுறைப்படி தீட்டான விலங்காக இருந்தால்[a], அவன் அதை நீ மதிப்பிட்ட தொகையின்படி மீட்டுக்கொண்டு, அந்த மதிப்பிட்ட தொகையில் ஐந்தில் ஒரு பங்கை கூடுதலாகச் சேர்க்க வேண்டும்[b]. அது மீட்கப்படாவிட்டால், நீ மதிப்பிட்ட தொகையின்படி அது விற்கப்பட வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சடங்குமுறைப்படி தீட்டான கால்நடைகளில் ஒன்றாக இருந்தால்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொற்றொடர், சடங்குமுறைப்படி தீட்டானவை என வகைப்படுத்தப்பட்ட விலங்குகளில் ஒன்றைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், ‘அதன் ஐந்தில் ஒரு பங்கை அதன்மேல் சேர்க்க வேண்டும்.’ அதாவது, மதிப்பிட்ட தொகையுடன் மேலும் இருபது விழுக்காடு சேர்க்க வேண்டும்.
    reason: lexical_clarification
lexical_decisions:
- source_word: בַּבְּהֵמָה הַטְּמֵאָה
  choice: சடங்குமுறைப்படி தீட்டான விலங்கினத்தைச் சேர்ந்ததாக
  rationale: בְּהֵמָה என்பது விலங்கு அல்லது கால்நடை எனப் பொருள்படும். இங்கு בַּ־ வகுப்பைச் சுட்டுவதால், குறிப்பிட்ட விலங்கு தீட்டான விலங்குகளின் வகையைச் சேர்ந்தது என்ற பொருள் இயல்பாகத் தரப்பட்டுள்ளது. טָמֵא குறிக்கும் சடங்குசார் தீட்டை நெறிமுறைத் தீமையாகப் புரிந்துகொள்ளாதபடி ‘சடங்குமுறைப்படி’ சேர்க்கப்பட்டுள்ளது.
- source_word: וּפָדָה
  choice: அவன் அதை ... மீட்டுக்கொண்டு
  rationale: פדה என்பது பணம் செலுத்தி மீட்டுக்கொள்வதைக் குறிக்கிறது. தொடர்ந்துவரும் ‘மீட்கப்படாவிட்டால்’ என்ற மாற்று நடைமுறை, மீட்பு தேர்ந்தெடுக்கப்பட்டால் பின்பற்ற வேண்டிய விதியை இங்கு காட்டுகிறது; தமிழில் தொடர்வினை அமைப்பு சட்ட நடைமுறையை இயல்பாக இணைக்கிறது.
- source_word: בְעֶרְכֶּךָ
  choice: நீ மதிப்பிட்ட தொகைக்கு
  rationale: עֵרֶךְ என்பது மதிப்பீட்டுத் தொகை. இரண்டாம் நபர் ஒருமை ஆண்பால் சுட்டை மறைக்காமல் ‘நீ’ எனப் பேணுகிறது; சூழலில் அது ஆசாரியனை நோக்கியது என்றாலும், வசனத்துக்குள் அந்தப் பதவி வெளிப்படையாகச் சேர்க்கப்படவில்லை.
- source_word: וְיָסַף חֲמִשִׁתוֹ עָלָיו
  choice: அந்தத் தொகையில் ஐந்தில் ஒரு பங்கை அதனுடன் சேர்க்க வேண்டும்
  rationale: எபிரெய மொழியமைப்பு ‘அதன் ஐந்தில் ஒரு பங்கை அதன்மேல் சேர்த்தல்’ என்கிறது. தமிழில் தெளிவாக, மதிப்பீட்டுத் தொகையின் ஐந்தில் ஒரு பங்கு கூடுதலாகச் சேர்க்கப்படுவதை வெளிப்படுத்துகிறது.
- source_word: וְאִם לֹא יִגָּאֵל
  choice: அது மீட்கப்படாவிட்டால்
  rationale: גאל என்பதன் நிஃபால் வடிவம் செய்பவரைக் குறிப்பிடாத நிலையில் உள்ளது. அதனால் செய்பவரை ஊகித்துச் சேர்க்காமல் செயப்பாட்டு வடிவம் பேணப்பட்டுள்ளது.
- source_word: וְנִמְכַּר
  choice: அது விற்கப்பட வேண்டும்
  rationale: நிஃபால் சட்டவிதிக்குரிய செயப்பாட்டு பொருளைத் தருகிறது. ‘விற்கப்பட வேண்டும்’ என்பது நவீன தமிழில் அதன் கட்டளைத் தன்மையை இயல்பாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: ‘தீட்டான’ என்பதன் தன்மை
  choice: சடங்குமுறைப்படி தீட்டான
  alternative: அசுத்தமான
  rationale: லேவியராகமச் சூழலில் இது சடங்குசார் வகைப்பாடு; விலங்கு ஒழுக்கரீதியாகத் தீயது என்ற பொருளைத் தவிர்க்க இவ்வாறு தெளிவுபடுத்தப்பட்டுள்ளது.
- issue: மீட்பு கட்டாயமா அல்லது தேர்வா
  choice: மீட்டுக்கொண்டு ... சேர்க்க வேண்டும்; மீட்கப்படாவிட்டால் ... விற்கப்பட வேண்டும்
  alternative: மீட்டுக்கொள்ளலாம்
  rationale: וּפָדָה என்ற சட்டநடை வடிவத்தின் வலிமையையும், அடுத்துள்ள ‘மீட்கப்படாவிட்டால்’ என்ற மாற்று வாய்ப்பையும் ஒரே அமைப்பில் வைத்துப் பதற்றத்தை முற்றிலும் நீக்காமல் பேணுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், சட்டவிதிக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘மதிப்பிட்ட தொகை,’ ‘மீட்கப்படுதல்,’ ‘விற்கப்பட வேண்டும்’ ஆகியவை பொதுவாசகர்களுக்குப் புரியும் வகையில் உள்ளன; மூலத்தின் இரண்டாம் நபர் உரையாடலும் செயப்படுபொருள் தெளிவின்மையும் இயன்றவரை பேணப்பட்டுள்ளன.
