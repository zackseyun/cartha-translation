source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּ֣ם אֶת מִשְׁמַרְתִּ֗/י לְ/בִלְתִּ֨י עֲשׂ֜וֹת מֵ/חֻקּ֤וֹת הַ/תּֽוֹעֵבֹת֙ אֲשֶׁ֣ר נַעֲשׂ֣וּ לִ/פְנֵי/כֶ֔ם וְ/לֹ֥א תִֽטַּמְּא֖וּ בָּ/הֶ֑ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/030.yaml
  text: So you shall keep my charge[a], so as not to practice any of the abominable statutes that were practiced before you, and you shall not make yourselves unclean by them. I am Yahweh your God.
translation:
  language: ta
  text: என் கட்டளையைக் கடைப்பிடியுங்கள்; உங்களுக்கு முன்பு கடைப்பிடிக்கப்பட்ட அருவருப்பான பழக்கவழக்கங்கள்[a] எதையும் செய்யாதபடியும், அவற்றினால் உங்களைத் தீட்டுப்படுத்திக்கொள்ளாதபடியும் இருங்கள். நான் உங்கள் கடவுளான யாவே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அருவருப்பான சட்டவிதிகள்,” “அருவருப்பான நிர்ணயிக்கப்பட்ட நடைமுறைகள்.” இங்குள்ள எபிரெயச் சொல் முறைப்படுத்தப்பட்ட பழக்கங்களையோ வழக்கங்களையோ குறிக்கலாம்; சட்டங்களை மட்டும் குறிக்க வேண்டியதில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: கடைப்பிடியுங்கள்
  rationale: שׁמר என்பதன் ‘காத்தல், கடைப்பிடித்தல்’ என்ற பொருளையும், இச்சூழலிலுள்ள கட்டளை வலிமையையும் இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: מִשְׁמַרְתִּי
  choice: என் கட்டளை
  rationale: מִשְׁמֶרֶת என்பது காக்க ஒப்படைக்கப்பட்ட பொறுப்பு அல்லது கடமையைக் குறிக்கலாம். ‘என் கட்டளை’ இங்கு தேவன் விதித்த கடமையை எளிதாகவும் கண்ணியமாகவும் தெரிவிக்கிறது; ‘என் காவல்’ என்பது நவீனத் தமிழில் தவறாகப் புரியக்கூடும்.
- source_word: לְבִלְתִּי עֲשׂוֹת
  choice: பின்பற்றாமலும் ... இருக்க
  rationale: இக்கட்டமைப்பின் தடுப்பு அல்லது நோக்கப் பொருளைத் தக்கவைக்கிறது. வழக்கமான செயல்களைப் பற்றியதால் வெறும் ‘செய்யாமல்’ என்பதைவிட ‘பின்பற்றாமல்’ இயல்பாக உள்ளது.
- source_word: מֵחֻקּוֹת הַתּוֹעֵבֹת
  choice: அருவருப்பான பழக்கவழக்கங்கள் எதையும்
  rationale: מִן என்பதன் பகுதிப்பொருளை ‘எதையும்’ காட்டுகிறது. חֻקּוֹת இங்கு முன்னிருந்த மக்களின் நிலைபெற்ற நடைமுறைகளைக் குறிக்கிறது; תּוֹעֵבֹת அவற்றின்மீதான வலுவான ஒழுக்க-வழிபாட்டு வெறுப்பை ‘அருவருப்பான’ எனத் தெரிவிக்கிறது.
- source_word: אֲשֶׁר נַעֲשׂוּ לִפְנֵיכֶם
  choice: உங்களுக்கு முன்பு கடைப்பிடிக்கப்பட்ட
  rationale: இஸ்ரவேலர் வருவதற்கு முன்னர் அவை நடைமுறையில் இருந்தன என்ற காலப்பொருளையும் எபிரெயப் பயனிலைக் கட்டமைப்பையும் காக்கிறது.
- source_word: וְלֹא תִטַּמְּאוּ בָּהֶם
  choice: அவற்றால் உங்களைத் தீட்டுப்படுத்திக்கொள்ளாமலும்
  rationale: வினையின் தற்சுட்டுப் பொருளையும் בָּהֶם என்பதன் கருவிப் பொருளையும் காக்கிறது; ‘தீட்டு’ இங்கு சடங்கு மற்றும் ஒழுக்க அசுத்தம் ஆகிய இரண்டையும் முன்கூட்டியே குறுக்காமல் விடுகிறது.
- source_word: אֲנִי יְהוָה אֱלֹהֵיכֶם
  choice: நானே உங்கள் கடவுளாகிய யாவே
  rationale: உடன்படிக்கை சார்ந்த சுயஅடையாளக் கூற்றின் வலியுறுத்தலை ‘நானே’ காட்டுகிறது; יהוה என்ற தனிப்பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் வரும் உடன்படிக்கைப் பெயரை பொதுப்பட்டமாக மாற்றாமல் தனிப்பெயராகப் பாதுகாக்கிறது.
- issue: תּוֹעֵבֹת என்பதன் ஒழுக்க மற்றும் வழிபாட்டுச் செறிவு
  choice: அருவருப்பான
  alternative: வெறுக்கத்தக்க
  rationale: மூலத்தின் வலுவான எதிர்மதிப்பைத் தக்கவைக்கிறது; அதேவேளை வசனத்தில் வெளிப்படையாகக் கூறப்படாத குறிப்பிட்ட சமயவியல் விளக்கத்தைச் சேர்ப்பதில்லை.
- issue: טמא என்பதிலுள்ள தீட்டின் இயல்பு
  choice: தீட்டுப்படுத்திக்கொள்ளுதல்
  alternative: அசுத்தமாக்கிக்கொள்ளுதல்
  rationale: லேவியராகமச் சூழலில் சடங்கு மற்றும் ஒழுக்க அசுத்தம் ஒன்றோடொன்று தொடர்புபடலாம். ‘தீட்டு’ அந்தச் செறிவைத் தக்கவைத்து, ஒன்றை மட்டும் தீர்மானிக்காமல் விடுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பன்மை முன்னிலைக்கான கட்டளை வடிவம் பயன்படுத்தப்பட்டுள்ளது. சட்ட மொழியின் கண்ணியமும் சாதாரண வாசகருக்கான தெளிவும் சமநிலைப்படுத்தப்பட்டுள்ளன. ‘பழக்கவழக்கங்கள்’ என்பதுடன் அடிக்குறிப்பு இணைக்கப்பட்டு חֻקּוֹת என்பதன் சட்டம்/வழக்கம் சார்ந்த பொருள் விரிவு பாதுகாக்கப்பட்டுள்ளது.
