  text: וְ/לֹֽא תָקִ֤יא הָ/אָ֨רֶץ֙ אֶתְ/כֶ֔ם בְּ/טַֽמַּאֲ/כֶ֖ם אֹתָ֑/הּ כַּ/אֲשֶׁ֥ר קָאָ֛ה אֶת הַ/גּ֖וֹי אֲשֶׁ֥ר לִ/פְנֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/028.yaml
  text: so that the land will not vomit you out when you defile it[a], as it vomited out the nation that was before you.
translation:
  language: ta
  text: நீங்கள் அதைத் தீட்டுப்படுத்தும்போது, உங்களுக்கு முன்பிருந்த இனத்தாரை அந்த நிலம் கக்கி வெளியேற்றியதுபோல, அது உங்களையும் கக்கி வெளியேற்றாதபடி.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கக்கி எறியாதபடி’ என்றும் மொழிபெயர்க்கலாம். எபிரெய மொழி, தீட்டின் காரணமாக நிலம் தன் குடிகளை கக்கி வெளியேற்றுவதைச் சித்தரிக்கும் வலுவான உருவகத்தைப் பயன்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָקִיא / קָאָה
  choice: கக்கி வெளியேற்றும் / கக்கி வெளியேற்றியது
  rationale: எபிரெயச் சொல் நிலம் தன் குடிகளை வாந்திபோல வெளியேற்றும் வலுவான உருவகத்தைப் பயன்படுத்துகிறது. ‘கக்கி வெளியேற்று’ என்பது அந்த அருவருப்பூட்டும், தீவிரமான படிமத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: הָאָרֶץ
  choice: அந்த நிலம்
  rationale: இச்சூழலில் உலகம் முழுவதையும் அல்ல, குறிப்பாக கானான் நிலத்தைக் குறிக்கிறது. தமிழில் முன்பே அறியப்பட்ட குறிப்பிட்ட நிலம் என்பதை ‘அந்த’ தெளிவாக்குகிறது.
- source_word: בְּטַמַּאֲכֶם אֹתָהּ
  choice: நீங்கள் அதைத் தீட்டுப்படுத்தும்போது
  rationale: בְּ + infinitive construct அமைப்பின் காலத்தையும் காரணத் தொடர்பையும் இயல்பாக வெளிப்படுத்துகிறது; טמא என்பதன் பியெல் வடிவிலுள்ள ‘தீட்டானதாக்குதல்’ என்ற கருத்தையும் காக்கிறது.
- source_word: הַגּוֹי
  choice: இனத்தார்
  rationale: ஒருமைத் தொகுப்புச் சொல்லான גוי, முன்பு அந்நிலத்தில் வாழ்ந்த மக்கள் குழுவைக் குறிக்கிறது. ‘இனத்தார்’ என்பது பின்னாளைய ‘புறஜாதியார்’ என்ற சமய நுணுக்கத்தைச் சேர்க்காமல் இதை இயல்பாகத் தருகிறது.
- source_word: אֲשֶׁר לִפְנֵיכֶם
  choice: உங்களுக்கு முன்பு இருந்த
  rationale: இஸ்ரவேலருக்கு முன்னதாக அந்நிலத்தில் வாழ்ந்தவர்களைக் குறிக்கும் கால முன்னுரிமையைத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: וְלֹא
  choice: வெளியேற்றாதபடி பார்த்துக்கொள்ளுங்கள்
  rationale: முந்தைய எச்சரிக்கையைத் தொடரும் எதிர்மறை நோக்கம்/விளைவை நவீன தமிழில் இயல்பாகத் தருகிறது. ‘பார்த்துக்கொள்ளுங்கள்’ என்பது சூழலில் மறைந்துள்ள எச்சரிக்கை வலிமையை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: நியாயத்தீர்ப்பின் செயற்பாட்டாளராக நிலம் உருவகப்படுத்தப்படுதல்
  choice: குடிகளை ‘கக்கி வெளியேற்றும்’ இலக்கண எழுவாயாக நிலத்தையே வைத்தல்
  alternative: கடவுள் நிலத்தின் வழியாக அவர்களை வெளியேற்றுகிறார் என்று நேரடியாக்குதல்
  rationale: எபிரெய உரை, தீட்டுக்கு எதிர்வினையாற்றும் நிலத்தைத் தெளிவாக ஆளுருவகப்படுத்துகிறது. அதைத் தக்கவைப்பது, ஒழுக்கத் தீட்டு நிலத்தை மாசுபடுத்தி வெளியேற்றத்துக்கு வழிவகுக்கும் என்ற லேவியராகமத்தின் இறையியல் அழுத்தத்தைப் பாதுகாக்கிறது; உரையில் வெளிப்படையாக இல்லாத செயற்பாட்டாளரைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமும் வாசிப்புத் தெளிவும் காக்கப்பட்டுள்ளன. ‘கக்கி வெளியேற்று’ என்ற வலுவான சொற்றொடர் மூலத்தின் திட்டமிட்ட அதிர்ச்சியூட்டும் உருவகத்தை மென்மையாக்காமல் தருகிறது; ‘தீட்டுப்படுத்து’ லேவியராகமத்தின் சடங்கு மற்றும் ஒழுக்க மாசு சார்ந்த சொற்பயன்பாட்டோடு பொருந்துகிறது.
