revisions:
- from: நீங்கள் அதைத் தீட்டுப்படுத்தும்போது, உங்களுக்கு முன்பு இருந்த இனத்தாரை அந்த நிலம் கக்கி வெளியேற்றியதுபோல, உங்களையும் அது கக்கி வெளியேற்றாதபடி பார்த்துக்கொள்ளுங்கள்.[a]
  to: நீங்கள் அதைத் தீட்டுப்படுத்தும்போது, உங்களுக்கு முன்பிருந்த இனத்தாரை அந்த நிலம் கக்கி வெளியேற்றியதுபோல, அது உங்களையும் கக்கி வெளியேற்றாதபடி.[a]
  rationale: The revision removes the unsupported imperative while preserving the Hebrew’s dependent negative warning. It retains the personification of the land, the strong expulsion metaphor, the temporal sense of the prior inhabitants, and the ambiguity of the warning’s connection to the preceding command.
  reviewer_model: gpt-5.6-terra
