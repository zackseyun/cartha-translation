  terminology: ‘தீட்டு’ suitably conveys the Levitical ritual category when clarified by the footnote. ‘நிர்வாணத்தை வெளிப்படுத்த’ preserves the source’s euphemistic legal idiom and should not be expanded into an explicit interpretation in the main text.
