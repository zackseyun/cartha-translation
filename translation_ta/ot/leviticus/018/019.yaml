source:
  edition: WLC
  text: וְ/אֶל אִשָּׁ֖ה בְּ/נִדַּ֣ת טֻמְאָתָ֑/הּ לֹ֣א תִקְרַ֔ב לְ/גַלּ֖וֹת עֶרְוָתָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/019.yaml
  text: You shall not approach a woman during her menstrual uncleanness to uncover her nakedness[a].
translation:
  language: ta
  text: ஒரு பெண் மாதவிடாய்த் தீட்டு நிலையில் இருக்கும்போது, அவளுடைய நிர்வாணத்தை வெளிப்படுத்துவதற்காக அவளை நெருங்காதே.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவளுடைய மாதவிடாய் தொடர்பான தீட்டின் நிலையில்.” எபிரேய மொழி சடங்குசார் தூய்மை–தீட்டு சொற்களைப் பயன்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶל אִשָּׁה ... לֹא תִקְרַב
  choice: ஒரு பெண்ணை ... நெருங்காதே
  rationale: אֶל உடன் வரும் קָרַב இங்கு ‘நெருங்குதல்’ என்ற சொற்றொடராக அமைகிறது. אִשָּׁה உடைமைச் சுட்டில்லாமல் பொதுப்பொருளில் இருப்பதால் ‘ஒரு பெண்’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: בְּ/נִדַּת טֻמְאָתָהּ
  choice: மாதவிடாயினால் தீட்டுப்பட்டிருக்கும் காலத்தில்
  rationale: נִדָּה மாதவிடாயோடு தொடர்புடைய நிலையைச் சுட்டுகிறது; טֻמְאָה லேவியராகமத்தில் சடங்குசார் தூய்மை–தீட்டு மொழியாகும். இயல்பான நவீனத் தமிழில் அந்தச் சடங்குசார் கருத்தைத் தக்கவைக்க இந்த வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- source_word: לְ/גַלּוֹת עֶרְוָתָהּ
  choice: அவளுடைய நிர்வாணத்தை வெளிப்படுத்துவதற்காக
  rationale: ‘நிர்வாணத்தை வெளிப்படுத்துதல்’ என்பது எபிரேயச் சட்ட மொழியில் பாலுறவைக் குறிக்கும் மறைமுகச் சொற்றொடர். மூலத்தின் மறைமுகத்தன்மையை மிகையாக விளக்காமல் பாதுகாக்கிறது.
theological_decisions:
- issue: மாதவிடாய் தொடர்பான טֻמְאָה என்பதை ஒழுக்கக் குற்றமாகவோ மருத்துவ நிலையாக்கவோ மொழிபெயர்ப்பதா
  choice: சடங்குசார் தீட்டு என்ற பொருளைத் தக்கவைத்தல்
  alternative: மாதவிடாய் இருக்கும் காலத்தில்
  rationale: טֻמְאָה இங்கு லேவியராகமத்தின் சடங்குசார் தூய்மை மொழியைச் சேர்ந்தது. ‘தீட்டு’ அந்தப் பிரிவைத் தக்கவைக்கிறது; இது தனிப்பட்ட ஒழுக்கக் குற்றம் என்று கூடுதலாகக் கூறுவதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டக் கட்டளைக்குரிய கண்ணியமான நேரடி நடையைப் பயன்படுத்துகிறது. ஒருமைத் தடை வடிவமான ‘நெருங்காதே’ எபிரேய இரண்டாம் நபர் ஆண்பால் ஒருமை வடிவத்தை இயல்பாகப் பிரதிபலிக்கிறது.
