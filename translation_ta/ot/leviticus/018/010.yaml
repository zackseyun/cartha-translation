  text: You shall not uncover the nakedness of your son's daughter or of your daughter's daughter[b][a], for their nakedness is your own.
translation:
  language: ta
  text: உன் மகனுடைய மகளின் நிர்வாணத்தையோ உன் மகளுடைய மகளின் நிர்வாணத்தையோ நீ வெளிப்படுத்தக் கூடாது[a]; ஏனெனில், அவர்களே உன் நிர்வாணம்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதைப் பொருள் விளக்கமாக, “உன் மகனுடைய மகளுடனோ உன் மகளுடைய மகளுடனோ நீ பாலுறவு கொள்ளக் கூடாது” என்றும் மொழிபெயர்க்கலாம். எபிரேயச் சொற்றொடரின் நேர்ப்பொருள், “நிர்வாணத்தை வெளிப்படுத்துதல்” என்பதாகும்.
    reason: lexical_alternative
  - marker: b
    text: “அவர்களே உன் நிர்வாணம்” என்பது மூலமொழியின் நேரடியான சொல்லமைப்பு. இந்த நெருங்கிய வழித்தோன்றல்கள் ஒருவருடைய நெருங்கிய குடும்ப உறவின் பகுதியாகக் கருதப்படுவதால், அவர்களுடனான பாலுறவு தடைசெய்யப்படுகிறது என்பதை இச்சொற்றொடர் உணர்த்துகிறது.
    reason: cultural_note
lexical_decisions:
- source_word: עֶרְוַת / עֶרְוָתָן / עֶרְוָתְךָ
  choice: நிர்வாணம்
  rationale: லேவியராகமம் 18 முழுவதும் திரும்பத் திரும்ப வரும் גלה ערוה என்ற சட்ட மொழிநடையின் உருவகத்தையும், கடைசி காரணவாக்கியத்திலுள்ள சொல் ஒற்றுமையையும் இது காக்கிறது. இச்சொற்றொடர் தடைசெய்யப்பட்ட பாலுறவைக் குறிக்கும் இடக்கரடக்கல் என்பதை அடிக்குறிப்பு விளக்குகிறது.
- source_word: בַּת בִּנְךָ
  choice: உன் மகனுடைய மகள்
  rationale: எபிரேய உறவுமுறை அமைப்பையும், மகன்வழிப் பேத்தியைத் துல்லியமாகக் குறிப்பிடும் சட்டத் தன்மையையும் காக்கிறது.
- source_word: בַת בִּתְּךָ
  choice: உன் மகளுடைய மகள்
  rationale: மகள்வழிப் பேத்தியைத் தனியாகக் குறிப்பிடும் மூலமொழியின் இணை அமைப்பையும் சட்டத் துல்லியத்தையும் காக்கிறது.
- source_word: לֹא תְגַלֶּה
  choice: நீ வெளிப்படுத்தக் கூடாது
  rationale: தடை விதிக்கும் வலிமையையும் ‘நிர்வாணத்தை வெளிப்படுத்துதல்’ என்ற அத்தியாயத்தின் தொடர்ச்சியான சட்ட மொழிநடையையும் காக்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முன்னுள்ள தடைக்கான காரணத்தைத் தெளிவாகக் காட்டும் இயல்பான நவீனத் தமிழ் இணைப்புச்சொல்.
- source_word: הֵנָּה
  choice: அவர்களே
  rationale: இரண்டு பெண் வழித்தோன்றல்களையும் குறிக்கும் பன்மையைத் தெளிவாகக் காட்டுவதோடு, மூலத்தின் வலியுறுத்தலையும் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘அவர்களே உன் நிர்வாணம்’ என்ற இறுதிக் காரணவாக்கியத்தின் பொருள்
  choice: உறவுமுறை சார்ந்த மூல உருவகத்தை முதன்மை உரையில் அப்படியே பேணுதல்
  alternative: அவர்கள் உன் சொந்த சதையைச் சேர்ந்தவர்கள் / அவர்களுடைய நிர்வாணம் உன்னுடையது போன்றதே
  rationale: எபிரேயம் நெருங்கிய சந்ததியினரை ஒருவருடைய சொந்த ‘நிர்வாணம்’ என அடையாளப்படுத்தும் குடும்ப ஒருமைப்பாட்டு தர்க்கத்தை முன்வைக்கிறது. அதை விளக்கவுரையாக மாற்றாமல் வைத்திருப்பது மூலத்தின் ambiguity மற்றும் கருத்துலகைக் காக்கிறது; தேவையான விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified சட்டநடை பயன்படுத்தப்பட்டுள்ளது. ‘பேத்தி’ என்று சுருக்காமல், மகன்வழி மற்றும் மகள்வழி உறவுகளைத் தனித்தனியாகக் காட்ட மூலத்தின் உறவுமுறைச் சொற்றொடர்கள் பேணப்பட்டுள்ளன. அத்தியாயம் முழுவதும் உள்ள சட்ட மொழிநடை ஒற்றுமைக்காக ‘நிர்வாணத்தை வெளிப்படுத்துதல்’ முதன்மை உரையில் வைக்கப்பட்டுள்ளது.
