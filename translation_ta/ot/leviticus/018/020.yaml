base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/020.yaml
  text: You shall not have sexual relations[a] with your neighbor’s wife and so defile yourself with her.
translation:
  language: ta
  text: உன் அயலானின் மனைவியோடு பாலுறவு கொண்டு, அவளோடு உன்னைத் தீட்டுப்படுத்திக்கொள்ளாதே[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லர்த்தமாக, “உன் அயலானின் மனைவிக்கு, விதைக்காக உன் விந்துச் சுரப்பைக் கொடுக்காதே.”
    reason: source_idiom
lexical_decisions:
- source_word: אֵשֶׁת עֲמִיתְךָ
  choice: உன் அயலானின் மனைவி
  rationale: עָמִית் என்பது இச்சட்டச் சூழலில் உடன்படிக்கைச் சமூகத்தைச் சேர்ந்த மற்றொருவரைக் குறிக்கிறது; ‘அயலான்’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: לֹא תִתֵּן שְׁכָבְתְּךָ לְזָרַע
  choice: பாலுறவு கொள்ளாதே
  rationale: எபிரெயச் சொற்றொடர் விதை/விந்து வெளியீட்டை வழங்குவதைச் சொல்லுருவாகக் கொண்டு பாலுறவைக் குறிக்கிறது. சொல்லுருவை அடிக்குறிப்பில் வைத்துக் கொண்டு, தடையின் பொருளை முதன்மை உரையில் தெளிவாக மொழிபெயர்க்கிறது.
- source_word: לְטָמְאָה בָהּ
  choice: அவளால் உன்னைத் தீட்டுப்படுத்திக்கொள்ளாதே
  rationale: טמא என்ற வினை இங்கு அந்த உறவினால் முகவரிக்குத் தீட்டு ஏற்படுவதைச் சுட்டுகிறது. ‘அவளால்’ என்பது בָהּ என்பதன் கருவி/தொடர்பு நுட்பத்தை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: தடையின் தன்மையும் தீட்டு மொழியும்
  choice: அயலானின் மனைவியுடன் பாலுறவு கொள்வதைத் தடைசெய்து, அதனால் ஒருவன் தன்னைத் தீட்டுப்படுத்திக்கொள்வதாகக் கூறுதல்
  alternative: மூலத்தின் விந்து/விதை சொல்லுருவை முதன்மை உரையிலேயே நேரடியாக வைத்தல்; அல்லது இதைச் சடங்குத் தீட்டு என்று மட்டும் வெளிப்படையாக வரையறுத்தல்
  rationale: மூலமொழிச் சொல்லுரு பாலுறவைத் தெளிவாகக் குறிக்கிறது; இறுதித் தொடர் தீட்டைச் சொல்கிறது. ‘தீட்டு’ என்ற சொல் சடங்கு மற்றும் ஒழுக்கப் பரிமாணங்களுக்கு இடையிலான மூலத்தின் பதற்றத்தை முன்கூட்டியே குறுக்காமல் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் நேரடியான சட்டத் தடை வடிவம் பயன்படுத்தப்பட்டுள்ளது. ‘பாலுறவு’ தெளிவான, கண்ணியமான பொதுப் பயன்பாட்டுச் சொல்; ‘தீட்டுப்படுத்திக்கொள்ளுதல்’ லேவியராகமத்தின் טמא சொற்குடும்பத்துடனான தொடர்பைக் காக்கிறது.
