reference: Leviticus 18:29
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: כִּ֚י כָּל אֲשֶׁ֣ר יַעֲשֶׂ֔ה מִ/כֹּ֥ל הַ/תּוֹעֵב֖וֹת הָ/אֵ֑לֶּה וְ/נִכְרְת֛וּ הַ/נְּפָשׁ֥וֹת הָ/עֹשֹׂ֖ת מִ/קֶּ֥רֶב עַמָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/029.yaml
  text: For whoever does any of all these abominations[a], the persons who do them shall be cut off from among their people.
translation:
  language: ta
  text: ஏனெனில், இந்த அருவருக்கத்தக்க செயல்களில் ஏதேனும் ஒன்றைச் செய்கிற நபர்கள் தங்கள் மக்களின் நடுவிலிருந்து அறுத்து நீக்கப்படுவார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கொல்லப்படுவார்கள்”; அல்லது, “சமூகத்திலிருந்து விலக்கப்படுவார்கள்.” எபிரெய உரை, தீர்ப்பு நிறைவேற்றப்படும் சரியான முறையைக் குறிப்பிடாமல், “அறுத்து நீக்கப்படுவார்கள்” என்று கூறுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய தடைகளுக்கான காரணத்தையும் அவற்றின் விளைவையும் அறிமுகப்படுத்தும் இணைப்பாக இயல்பாக அமைகிறது.
- source_word: כָּל אֲשֶׁר
  choice: எவரும்
  rationale: எவ்வித விதிவிலக்கும் இல்லாத பொதுமையான மனிதக் குறிப்பைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: יַעֲשֶׂה / הָעֹשֹׂת
  choice: செய்கிற / செய்கிற
  rationale: எபிரெய வினையின் பொதுவான ‘செய்’ என்ற பொருளைத் தக்கவைத்து, ‘குற்றம் புரி’ போன்ற கூடுதல் சட்டநுட்பப் பொருளைச் சேர்க்கவில்லை.
- source_word: מִכֹּל הַתּוֹעֵבוֹת הָאֵלֶּה
  choice: இந்த அருவருப்பான செயல்களில் எதையாவது
  rationale: מִן என்பதன் பகுதிப்பொருளையும் כֹּל என்பதன் முழுமையான பரப்பையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: תּוֹעֵבוֹת
  choice: அருவருப்பான செயல்கள்
  rationale: சூழலில் பேசப்படுவது குறிப்பிட்ட செயல்கள் என்பதைக் காட்டுவதோடு, மூலச்சொல்லின் கடுமையான அற-சடங்கு மதிப்பீட்டையும் தக்கவைக்கிறது.
- source_word: וְנִכְרְתוּ
  choice: அறுத்துப்போடப்படுவார்கள்
  rationale: כרת என்பதன் உருவகச் சட்டச் சொல்லாட்சியைத் தக்கவைக்கிறது; மரணதண்டனையா, சமூக விலக்கலா, அல்லது இறைத் தீர்ப்பா என்பதை முதன்மை உரையில் தீர்மானிக்கவில்லை.
- source_word: הַנְּפָשׁוֹת
  choice: அந்த நபர்கள்
  rationale: நெஃபெஷ் இங்கு ‘ஆத்துமாக்கள்’ என்ற இருமைவாதப் பொருளில் அல்லாமல் மனித நபர்களைக் குறிக்கிறது.
- source_word: מִקֶּרֶב עַמָּם
  choice: தங்கள் மக்களின் நடுவிலிருந்து
  rationale: உடன்படிக்கைச் சமூகத்தின் மத்தியிலிருந்து நீக்கப்படுதல் அல்லது அறுத்துப்போடப்படுதல் என்ற சமூகச் சூழலை நெருக்கமாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: וְנִכְרְתוּ ... מִקֶּרֶב עַמָּם என்ற தண்டனைச் சூத்திரத்தின் பொருள்
  choice: தங்கள் மக்களின் நடுவிலிருந்து அறுத்துப்போடப்படுவார்கள்
  alternative: கொல்லப்படுவார்கள்; அல்லது சமூகத்திலிருந்து விலக்கப்படுவார்கள்
  rationale: எபிரெயச் சட்டச் சூத்திரம் தீர்ப்பு எவ்வாறு நிறைவேற்றப்படுகிறது என்பதை இவ்வசனத்தில் குறிப்பிடவில்லை. ஆகவே மரணதண்டனை, சமூக விலக்கல், அல்லது நேரடியான இறைத் தீர்ப்பு ஆகியவற்றில் ஒன்றை மட்டும் தேர்ந்தெடுக்காமல் மூலத்தின் தெளிவின்மையும் இறையியல் அழுத்தமும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான சட்டநடையைப் பயன்படுத்துகிறது. ‘அறுத்துப்போடப்படுவார்கள்’ என்ற சற்றுக் கடினமான மூல உருவகம், தண்டனையின் வகையை மொழிபெயர்ப்பிலேயே தீர்மானிக்காமல் இருக்க நோக்கமுடன் தக்கவைக்கப்பட்டுள்ளது.
