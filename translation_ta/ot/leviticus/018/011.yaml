  text: עֶרְוַ֨ת בַּת אֵ֤שֶׁת אָבִ֨י/ךָ֙ מוֹלֶ֣דֶת אָבִ֔י/ךָ אֲחוֹתְ/ךָ֖ הִ֑וא לֹ֥א תְגַלֶּ֖ה עֶרְוָתָֽ/הּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/011.yaml
  text: You shall not uncover the nakedness of your father's wife's daughter[a], born to your father; she is your sister.
translation:
  language: ta
  text: உன் தந்தையின் மனைவியின் மகள்—உன் தந்தையால் பிறந்தவள்—அவள் உன் சகோதரி[a]; அவளுடைய நிர்வாணத்தை வெளிப்படுத்தாதே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் நேரடியாக, “அவள் உன் சகோதரி” என்று உள்ளது; அதற்கு முந்திய விளக்கம் அந்த உறவை வரையறுக்கிறது.
    reason: source_clarification
lexical_decisions:
- source_word: עֶרְוַת / עֶרְוָתָהּ
  choice: நிர்வாணம் / அவளுடைய நிர்வாணம்
  rationale: லேவியராகமம் 18-இன் பாலுறவுத் தடைகளில் இது நிலையான மறைமுகச் சட்டச் சொற்றொடர். உடலுறுப்புகளை வெளிப்படையாகக் குறிப்பிடாமலும், எபிரெயச் சொல்லின் உருவகத்தையும் அதிகாரத்தின் பிற வசனங்களுடனான ஒருமைப்பாட்டையும் காக்கிறது.
- source_word: בַּת
  choice: மகள்
  rationale: உறவுமுறையைக் குறிக்கும் நேரடியான சொல்லாக இருப்பதால் இயல்பாக மொழிபெயர்க்கப்பட்டது.
- source_word: אֵשֶׁת אָבִיךָ
  choice: உன் தகப்பனுடைய மனைவி
  rationale: ‘மாற்றாந்தாய்’ என்று விளக்கிச் சுருக்காமல், எபிரெய மூலத்தின் உறவுமுறைச் சொற்றொடரை அப்படியே காக்கிறது.
- source_word: מוֹלֶדֶת אָבִיךָ
  choice: உன் தகப்பனுக்குப் பிறந்தவள்
  rationale: தகப்பன் வழியான உயிரியல் வம்சத் தொடர்பைத் தெளிவாகவும் இயல்பான நவீன தமிழிலும் தெரிவிக்கிறது.
- source_word: אֲחוֹתְךָ הִוא
  choice: உன் சகோதரி
  rationale: மூல உரை ‘ஒரே தகப்பன் வழியான சகோதரி’ என்று விளக்கிச் சொல்லாமல் பொதுவான உறவுமுறைச் சொல்லையே பயன்படுத்துவதால் அதையே முதன்மை உரையில் காக்கிறது.
- source_word: לֹא תְגַלֶּה
  choice: வெளிப்படுத்தாதே
  rationale: தொடர்ச்சியான சட்டத் தடையை நவீன தமிழில் நேரடியாகவும் கண்ணியமாகவும் தெரிவிக்கிறது; ‘நிர்வாணத்தை வெளிப்படுத்துதல்’ என்ற மூல மொழியின் மறைமுகச் சொற்றொடரையும் தக்கவைக்கிறது.
theological_decisions:
- issue: உறவை முதன்மை உரையில் ‘ஒரே தகப்பன் வழியான சகோதரி’ என்று குறிப்பிடுவதா
  choice: மூலத்தில் உள்ளபடி ‘உன் சகோதரி’ என்று வைத்தல்
  alternative: உன் ஒன்றுவிட்ட சகோதரி / ஒரே தகப்பன் வழியான சகோதரி
  rationale: முந்தைய விளக்கம் உறவின் தன்மையை வரையறுக்கிறது; ஆனால் முடிவுச் சொற்றொடர் நேரடியாக ‘அவள் உன் சகோதரி’ என்றே கூறுகிறது. ஆகவே விளக்கத்தை முதன்மை உரைக்குள் சேர்க்காமல், அடிக்குறிப்பில் தருவது மூலத்தின் சொல்லாட்சியையும் அதன் பரப்பையும் காக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், சட்டக் கட்டளைக்கேற்ற கண்ணியமான நேரடி நடை பயன்படுத்தப்பட்டுள்ளது. ‘தகப்பன்’ என்பது உறவுமுறைத் துல்லியத்திற்காகவும், ‘நிர்வாணத்தை வெளிப்படுத்துதல்’ என்பது அதிகாரம் முழுவதும் தொடரும் எபிரெய மறைமுகச் சட்டச் சொற்றொடரைப் பாதுகாக்கவும் தேர்ந்தெடுக்கப்பட்டது.
