source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּ֤ם אֶת חֻקֹּתַ/י֙ וְ/אֶת מִשְׁפָּטַ֔/י אֲשֶׁ֨ר יַעֲשֶׂ֥ה אֹתָ֛/ם הָ/אָדָ֖ם וָ/חַ֣י בָּ/הֶ֑ם אֲנִ֖י יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/005.yaml
  text: So you shall keep my statutes and my judgments[a], which if a man does them, he shall live by them[b]. I am Yahweh.
translation:
  language: ta
  text: ஆகவே, நீங்கள் என் விதிமுறைகளையும் என் நியாயங்களையும் கடைப்பிடிக்க வேண்டும்; அவற்றைச் செய்கிற மனிதன் அவற்றால் வாழ்வான்[a]. நான் யாவே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவற்றில் வாழ்வான்’ என்றும் மொழிபெயர்க்கலாம். எபிரேய முன்னிடைச்சொல் கருவிப் பொருளில் ‘அவற்றால்’ என்றும், வாழ்க்கையின் தளம் அல்லது சூழல் என்ற பொருளில் ‘அவற்றில்’ என்றும் புரிந்துகொள்ளப்படலாம். ‘மனிதன்’ என்பது இங்கு எந்த மனிதரையும் பிரதிநிதித்துவப்படுத்தும் ஒருமைச் சொல்.
    reason: மாற்று வாசிப்பையும் பிரதிநிதித்துவ ஒருமையின் பொருளையும் விளக்குதல்
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: ஆகையால், நீங்கள் ... கடைப்பிடிக்க வேண்டும்
  rationale: இணைப்புடன் வந்த நிறைவுவினை சட்ட அறிவுறுத்தலில் கட்டளைப் பொருள் பெறுகிறது. முந்தைய தடைகளுடன் உள்ள தொடர்பை ‘ஆகையால்’ இயல்பாகக் காட்டுகிறது; שמר என்பதன் உடன்படிக்கைச் சூழலிலான கருத்தை ‘கடைப்பிடிக்க’ தெரிவிக்கிறது.
- source_word: חֻקֹּתַי
  choice: என் சட்டங்கள்
  rationale: חקה என்பது விதித்த சட்டங்களை அல்லது வரையறைகளைச் சுட்டுகிறது. நவீன தமிழில் ‘சட்டங்கள்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: מִשְׁפָּטַי
  choice: என் நீதிநியமங்கள்
  rationale: משפט என்பதன் நீதி மற்றும் சட்டத் தீர்ப்பு சார்ந்த நுணுக்கத்தைத் தக்கவைத்து, חקות என்பதிலிருந்து அதன் சொற்பொருள் வேறுபாட்டைக் காட்டுகிறது.
- source_word: אֲשֶׁר יַעֲשֶׂה אֹתָם הָאָדָם
  choice: அவற்றைச் செய்கிற மனிதன்
  rationale: எபிரெய உரையின் ஒருமை பிரதிநிதித்துவ அமைப்பையும் עשה என்பதன் செயற்பூர்வமான கீழ்ப்படிதல் மொழியையும் காக்கிறது. ‘மனிதன்’ இங்கு ஓர் ஆணை மட்டும் அல்ல, எந்த மனிதரையும் பிரதிநிதித்துவப்படுத்துகிறது.
- source_word: וָחַי בָּהֶם
  choice: அவற்றால் வாழ்வான்
  rationale: חיה என்பதைக் ‘வாழ்வான்’ என்று நேரடியாக மொழிபெயர்க்கிறது. ב முன்னிடைச்சொல்லின் கருவிப் பொருளை ‘அவற்றால்’ தருகிறது; இடம் அல்லது வாழ்க்கைச் சூழல் என்ற மாற்றுப் பொருள் அடிக்குறிப்பில் வைக்கப்படுகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: திருப்பெயரை ஒரு பொதுப் பட்டமாக மாற்றாமல் தனிப்பட்ட இறைப்பெயராகத் தமிழில் வழங்குகிறது; நவீன தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் வடிவம்.
theological_decisions:
- issue: ‘அவற்றால் வாழ்வான்’ என்பதில் ‘வாழ்வு’ குறிக்கும் பரப்பு
  choice: வாழ்வான்
  alternative: அவற்றின் வழியாக நித்திய வாழ்வைப் பெறுவான் / நாட்டில் செழித்து வாழ்வான்
  rationale: மூல உரை வாழ்வை இவ்வுலக, உடன்படிக்கை, நாட்டிலுள்ள அல்லது நித்திய வாழ்வு என்று குறிப்பாக வரையறுக்கவில்லை. எனவே அதன் பரந்த இறையியல் அழுத்தமும் பதற்றமும் தக்கவைக்கப்படுகின்றன.
- issue: הָאָדָם என்பதன் பிரதிநிதித்துவ ஒருமை
  choice: மனிதன்
  alternative: எவரும் / ஒரு நபர்
  rationale: மூலத்தின் ஒருமை வடிவத்தைத் தக்கவைத்து, அது பொதுவாக மனிதரைக் குறிக்கிறது என்பதை அடிக்குறிப்பில் தெளிவுபடுத்துகிறது.
- issue: בָּהֶם முன்னிடைச்சொல்லின் பொருள்
  choice: அவற்றால்
  alternative: அவற்றில்
  rationale: எபிரெய ב இங்கு கருவி அல்லது வாழ்க்கைத் தளம்/சூழல் ஆகிய இரு வகையிலும் புரிந்துகொள்ளப்படலாம். முதன்மை உரையில் இயல்பான ‘அவற்றால்’ பயன்படுத்தப்பட்டு மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்ட உரைக்குரிய கண்ணியமான ஆனால் பொதுவாசகருக்குப் புரியும் நடை பயன்படுத்தப்பட்டது. ‘சட்டங்கள் / நீதிநியமங்கள்’ என்ற இணை மூலத்தின் இரு சட்டச் சொற்களையும் ஒன்றாக்காமல் வேறுபடுத்துகிறது.
