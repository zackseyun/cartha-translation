  text: וּ/מִֽ/זַּרְעֲ/ךָ֥ לֹא תִתֵּ֖ן לְ/הַעֲבִ֣יר לַ/מֹּ֑לֶךְ וְ/לֹ֧א תְחַלֵּ֛ל אֶת שֵׁ֥ם אֱלֹהֶ֖י/ךָ אֲנִ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/021.yaml
  text: And you shall not give any of your offspring to make them pass over to Molech, and you shall not profane the name of your God. I am Yahweh.
translation:
  language: ta
  text: உன் சந்ததியினரில் எவரையும்[a] மோலேக்குக்குக் கடந்து செல்லச் செய்வதற்காகக் கொடுக்காதே[b]. உன் கடவுளின் பெயரைக் களங்கப்படுத்தாதே. நானே யாவே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உன் பிள்ளைகளில் எவரையும்.’ எபிரேயத்தில் சொல்லுக்குச் சொல், ‘உன் விதையிலிருந்து.’
    reason: lexical_alternative
  - marker: b
    text: அதாவது, மோலேக்குடன் தொடர்புடைய ஒரு சடங்கிற்காக. பலர் இதைக் குழந்தைப் பலியாகப் புரிந்துகொள்கிறார்கள்; வேறு இடங்களில் இது பிள்ளைகளை ‘தீக்குள் கடந்து செல்லச் செய்வது’ என்று விவரிக்கப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִזַּרְעֲךָ
  choice: உன் சந்ததியினரில் எவரையும்
  rationale: זֶרַע என்பதன் அடிப்படைப் பொருள் ‘விதை’; இச்சட்டச் சூழலில் அது ஒருவரின் சந்ததியைக் குறிக்கிறது. מִן கூறின் பகுதிப்பொருளை ‘எவரையும்’ வெளிப்படுத்துகிறது.
- source_word: תִתֵּן
  choice: கொடுக்காதே
  rationale: נתן என்பதன் இயல்பான பொருள் ‘கொடு.’ எதிர்மறைக் கட்டளையின் வலிமையை நவீனத் தமிழில் நேரடியாகக் காட்டுகிறது.
- source_word: לְהַעֲבִיר
  choice: கடந்து செல்லச் செய்வதற்கு
  rationale: עבר என்பதன் ஹிஃபில் வடிவம் ‘கடக்கச் செய்’ அல்லது ‘கடந்து செல்லச் செய்’ என்று பொருள்படும். சடங்கின் இயல்பை முதன்மை உரையிலேயே தீர்மானிக்காமல் எபிரேயச் சொற்றொடரின் காரணவினைப் பொருளைப் பாதுகாக்கிறது.
- source_word: לַמֹּלֶךְ
  choice: மோலேகுக்காக
  rationale: மசோரா உயிர்க்குறியீடும் பாரம்பரியப் புரிதலும் இதை மோலேக் என்ற பெயராகக் காட்டுகின்றன. இங்கு குறிக்கப்படும் செயல் மோலேகுக்கெனச் செய்யப்படுவதைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: תְחַלֵּל
  choice: அவமதிக்காதே
  rationale: חלל என்பதன் பியேல் வடிவம் ‘புனிதத்தைக் கெடு, இழிவுபடுத்து’ என்ற பொருளைக் கொண்டது. ‘அவமதிக்காதே’ என்பது கடவுளின் பெயருக்குரிய மரியாதையைக் குலைப்பதைத் தெளிவான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: שֵׁם אֱלֹהֶיךָ
  choice: உன் கடவுளின் பெயர்
  rationale: உடன்படிக்கைச் சூழலில் கடவுளின் வெளிப்படுத்தப்பட்ட மாண்பையும் புகழையும் சுமக்கும் ‘பெயர்’ என்ற கருத்தை நேரடியாகப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: יהוה என்ற தனிப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரிந்துகொள்ளக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
theological_decisions:
- issue: மோலேக் தொடர்பான தடையின் இயல்பு
  choice: ‘கடந்து செல்லச் செய்வதற்கு’ என்று சடங்கைத் திட்டவட்டமாக வரையறுக்காமல் மொழிபெயர்த்தல்
  alternative: ‘தீயில் பலியிடுவதற்கு’ அல்லது ‘தீக்குள் கடக்கச் செய்வதற்கு’
  rationale: இச்செயல் குழந்தைப் பலியோடும் தீயோடும் தொடர்புடையதாகப் பிற வேதாகமப் பகுதிகள் காட்டினாலும், இந்த வசனத்தில் ‘தீ’ அல்லது ‘பலி’ என்ற சொல் வெளிப்படையாக இல்லை. ஆகவே முதன்மை உரை எபிரேயத்தின் தெளிவின்மையைப் பாதுகாக்கிறது; சாத்தியமான சடங்குப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: זֶרַע என்பதன் இச்சட்டச் சூழலிலான குறிப்பு
  choice: ‘சந்ததி’
  alternative: ‘பிள்ளைகள்’ அல்லது சொல்லுக்குச் சொல் ‘விதை’
  rationale: ‘சந்ததி’ என்பது வயதுப் பிரிவைத் தேவையின்றிக் குறுக்காமல் குடும்ப வழித்தோன்றலைத் துல்லியமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் நேரடியான சட்டக் கட்டளை நடை பயன்படுத்தப்பட்டுள்ளது. ‘சந்ததி,’ ‘அவமதிக்காதே’ ஆகியவை சாதாரண வாசகருக்குப் புரியும் வகையிலும் உரையின் கண்ணியத்தைக் காக்கும் வகையிலும் தேர்ந்தெடுக்கப்பட்டன. ‘கடந்து செல்லச் செய்வது’ என்ற சற்றே அசாதாரணமான சொற்றொடர் மூலத்தின் சடங்கு சார்ந்த தெளிவின்மையை நோக்கத்துடன் பாதுகாக்கிறது.
