- source_word: וּבְכָל בְּהֵמָה
  choice: எந்த மிருகத்துடனும்
  rationale: בְּהֵמָה இங்கு பொதுவாக மிருகத்தைக் குறிக்கிறது; כָּל என்பதன் முழுமையான விரிவை “எந்த…உம்” இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לֹא תִתֵּן שְׁכָבְתְּךָ
  choice: பாலுறவு கொள்ளாதே
  rationale: எபிரெயச் சொற்றொடர் சொற்படி “உன் படுத்தலைக் கொடுக்காதே” என்றாலும், இச்சூழலில் அதன் பாலுறவுப் பொருளை இயல்பான நவீனத் தமிழில் தெளிவாகக் கொடுக்கிறது; மூல உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: לְטָמְאָה בָהּ
  choice: உன்னைத் தீட்டுப்படுத்திக்கொள்ள
  rationale: טמא என்பதிலுள்ள தூய்மைக்கேடு/தீட்டு என்ற வேதாகமக் கருத்தைத் தக்கவைத்து, இதை வெறும் சடங்குத் தீட்டாக மட்டும் சுருக்காமல் செய்பவருக்கே ஏற்படும் தீட்டாக வெளிப்படுத்துகிறது.
- source_word: וְאִשָּׁה
  choice: ஒரு பெண்
  rationale: אִשָּׁה இங்கு மனைவியைச் சிறப்பாகக் குறிக்காமல் பொதுவாகப் பெண்ணைக் குறிக்கிறது.
- source_word: לֹא תַעֲמֹד לִפְנֵי בְהֵמָה
  choice: ஒரு மிருகம் தன்னைப் புணரும்படி அதன் முன் நிற்கக்கூடாது
  rationale: “அதன் முன் நிற்றல்” என்ற மூலப் படிமத்தைத் தக்கவைத்து, பின்வரும் நோக்கவினையால் அதன் பாலுறவுச் சூழலைத் தெளிவாக்குகிறது.
- source_word: לְרִבְעָהּ
  choice: தன்னைப் புணரும்படி
  rationale: רבע இச்சூழலில் மிருகம் பெண்ணை ஏறிப் பாலுறவு கொள்வதைக் குறிக்கிறது; பெண்பால் ஒருமைச் சுட்டுப்பெயர் பெண்ணே செயற்பாட்டின் பெறுபவர் என்பதை காட்டுவதால் “தன்னைப் புணரும்படி” என மொழிபெயர்க்கப்பட்டது.
- source_word: תֶּבֶל
  choice: நெறிபிறழ்வு
  rationale: இச்சொல், குறிப்பாகப் பாலியல் சூழலில், உரிய ஒழுங்கை மீறுவதைக் குறிக்கிறது. “நெறிபிறழ்வு” அதன் ஒழுங்குமீறல் மற்றும் அற மதிப்பீடு ஆகிய இரண்டையும் சுருக்கமாகக் கொடுக்கிறது; வெறும் மனக் “குழப்பம்” என்ற நவீனப் பொருளைத் தவிர்க்கிறது.
theological_decisions:
- issue: தீட்டு மொழியை வெறும் சடங்குத் தூய்மைக்கேடாகவோ பிற்காலக் கோட்பாட்டு வகையாகவோ சுருக்காமல் மொழிபெயர்த்தல்
  choice: உன்னைத் தீட்டுப்படுத்திக்கொள்ள
  alternative: அதனுடன் தீட்டடைய / அதனால் உன்னை அசுத்தப்படுத்திக்கொள்ள
  rationale: வசனம் செயலைத் தீட்டுண்டாக்குவதாகக் கூறுகிறது. “தீட்டுப்படுத்திக்கொள்ள” என்பது வேதாகமத் தூய்மை மொழியையும் செய்பவருக்கான விளைவையும் தக்கவைக்கிறது; தீட்டின் தன்மையைத் தேவையின்றி மேலும் வரையறுப்பதில்லை.
- issue: תֶּבֶל என்பதன் அற மற்றும் ஒழுங்குமீறல் சார்ந்த வலிமை
  choice: நெறிபிறழ்வு
  alternative: ஒழுங்குமீறல் / குழப்பம் / அருவருப்பான செயல்
  rationale: மூலச்சொல் உரிய ஒழுங்கை மீறும் செயலை மதிப்பீடு செய்கிறது. “நெறிபிறழ்வு” அந்த வலிமையை வெளிப்படுத்துகிறது; “குழப்பம்” இன்றைய தமிழில் மிக மெலிதாகவும் தவறாகவும் புரியக்கூடும், “அருவருப்பு” வேறு எபிரெயச் சொல்லுடன் குழப்பத்தை ஏற்படுத்தலாம்.
translation_notes:
  register: நவீனத் தரத் தமிழில் நேரடியானதும் கண்ணியமானதுமான சட்ட மொழிநடை பயன்படுத்தப்பட்டுள்ளது. “பாலுறவு” மற்றும் “புணர்” என்பவை பொருளை மறைக்காமல் தெரிவிக்கின்றன; அதே நேரத்தில் தேவையற்ற கொச்சைத்தன்மையைத் தவிர்க்கின்றன. ஆண்பால் ஒருமை கட்டளையும் பெண்ணைப் பற்றிய தனி தடையும் மூலத்தின் அமைப்புக்கு ஏற்ப வேறுபடுத்தப்பட்டுள்ளன.
