base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/023.yaml
  text: And with any animal you shall not give your lying[a] to become unclean with it, and a woman shall not stand before an animal to mate with it[c][b]; it is a perversion.
translation:
  language: ta
  text: எந்த மிருகத்துடனும் பாலுறவு கொண்டு உன்னைத் தீட்டுப்படுத்திக்கொள்ளாதே[a]. ஒரு பெண், ஒரு மிருகம் தன்னைப் புணரும்படி அதன் முன் நிற்கக்கூடாது[b]. அது ஒழுங்குமீறல்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொற்றொடர் சொற்படி, “உன் படுத்தலைக் கொடுக்காதே”; இது மிருகத்துடன் பாலுறவு கொள்வதைக் குறிக்கிறது. அடுத்த சொற்றொடரை “அதனுடன் தீட்டடைவதற்காக” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெய மொழியில், “அது அவளை ஏறுவதற்காக”; இச்சொற்றொடர் மிருகத்துடனான பாலுறவைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: “ஒழுங்குமீறல்” என்பதற்கான எபிரெயச் சொல்லை “குழப்பம்” அல்லது “அவமதிப்பான செயல்” என்றும் மொழிபெயர்க்கலாம்; பாலியல் சூழலில் அது உரிய ஒழுங்கு மீறப்படுவதைக் குறிக்கிறது.
    reason: lexical_alternative
