    issue: The rendering of תֶּבֶל as “நெறிபிறழ்வு” is somewhat marked and can suggest an internal moral deviation rather than the act’s violation of proper order.
    rationale: The Hebrew term denotes an outrage or disorder/violation of proper order in this context. “ஒழுங்குமீறல்” is more natural modern Tamil and retains the source’s evaluative force.
