base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/013.yaml
  text: You shall not uncover the nakedness of your mother's sister[b][a], for she is your mother's close relative.
translation:
  language: ta
  text: உன் தாயின் சகோதரியின் நிர்வாணத்தை நீ வெளிப்படுத்தக் கூடாது[a]; ஏனெனில் அவள் உன் தாயின் நெருங்கிய உறவினளாக இருக்கிறாள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதைப் பொருள்வழியாக, “உன் தாயின் சகோதரியுடன் நீ பாலுறவு கொள்ளக் கூடாது” என்றும் மொழிபெயர்க்கலாம். எபிரெயத்தில், “உன் தாயின் சகோதரியின் நிர்வாணத்தை வெளிப்படுத்தாதே” என்று உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: “நெருங்கிய உறவினள்” என்பது எபிரெய שְׁאֵר (ஷெஏர்) என்ற சொல்லை மொழிபெயர்க்கிறது; இது உடல் அல்லது சதை சார்ந்த நெருங்கிய உறவைக் குறிக்கும் உறவுமுறைச் சொல்.
    reason: cultural_note
lexical_decisions:
- source_word: עֶרְוַת
  choice: நிர்வாணத்தை
  rationale: லேவியராகமம் 18 முழுவதும் வரும் சட்ட மொழிநடையின் மறைமுகச் சொற்றொடரைத் தக்கவைக்கிறது; இது பாலுறவைக் குறிக்கும் இடக்கரடக்கல்.
- source_word: תְגַלֵּה
  choice: நீ வெளிப்படுத்தக் கூடாது
  rationale: பீயேல் வினை வடிவமும் לֹא தடையும் சேர்ந்து அமைக்கும் சட்டத் தடைச் சூத்திரத்தை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: אֲחוֹת אִמְּךָ
  choice: உன் தாயின் சகோதரி
  rationale: எபிரெயக் கட்டுநிலைத் தொடரின் உறவுமுறையை நேரடியாகப் பாதுகாக்கிறது; ‘தாய்வழி அத்தை’ என்பதைவிட மூலத்தின் வடிவத்துக்கு நெருக்கமானது.
- source_word: שְׁאֵר
  choice: நெருங்கிய இரத்த உறவினர்
  rationale: உடல் அல்லது சதை சார்ந்த நெருங்கிய உறவைக் குறிக்கும் உறவுமுறைச் சொல்லின் பொருளைத் தெளிவாகத் தெரிவிக்கிறது; சொல்லின் உடல்-உறவு நுணுக்கம் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: தடைக்கான காரணத்தை அறிமுகப்படுத்தும் இணைப்புச் சொல்லாக இயல்பாக அமைகிறது.
- source_word: הִוא
  choice: அவள்
  rationale: காரண வாக்கியத்தின் பெண்பால் எழுவாயைத் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: பாலுறவுத் தடையைக் குறிக்கும் எபிரெயச் சட்ட இடக்கரடக்கலை மொழிபெயர்த்தல்
  choice: முதன்மை உரையில் ‘நிர்வாணத்தை வெளிப்படுத்துதல்’ என்ற உருவகத்தைத் தக்கவைத்தல்
  alternative: ‘பாலுறவு கொள்ளுதல்’ என்று நேரடியாக மொழிபெயர்த்தல்
  rationale: மூல எபிரெயம் லேவியராகமம் 18 முழுவதும் மீண்டும் வரும் சட்ட இடக்கரடக்கலைப் பயன்படுத்துகிறது. அதைத் தக்கவைப்பது இலக்கிய ஒற்றுமையையும் சட்டத் தொனியையும் பாதுகாக்கிறது; அதன் பொருள் அடிக்குறிப்பில் தெளிவாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான சட்டத் தொனி பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் மறைமுகமான பாலியல் சொற்றொடர் முதன்மை உரையில் பாதுகாக்கப்பட்டு, அதன் நேரடிப் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது. வசன உரையில் வரும் அடிக்குறிப்பு குறிகள் அவற்றின் விளக்க வரிசைப்படி [a], [b] என அமைக்கப்பட்டுள்ளன.
