  to: உன் தாயின் சகோதரியின் நிர்வாணத்தை நீ வெளிப்படுத்தக் கூடாது[a]; ஏனெனில் அவள் உன் தாயின் நெருங்கிய உறவினளாக இருக்கிறாள்[b].
