  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ta
  text: 'யாவே மோசேயிடம் இவ்வாறு கூறினார்:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பேசி
  rationale: דבר என்பது இங்கு அடுத்துவரும் நேரடிப் பேச்சை அறிமுகப்படுத்தும் வழக்கமான கதைநடைச் சொல். தமிழில் ‘பேசி’ என்பது לֵאמֹר உடன் சேர்ந்துள்ள எபிரெயத் தொடக்கச் சூத்திரத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: இது பட்டப்பெயர் அல்ல, தேவனுடைய தனிப்பெயரைக் குறிக்கும் நான்கு எழுத்துப் பெயர். நவீனத் தமிழில் பரவலாக அறியப்படும் ‘யெகோவா’ என்ற பெயர்வடிவம் பயன்படுத்தப்பட்டது.
- source_word: אֶל־מֹשֶׁה
  choice: மோசேயிடம்
  rationale: பேச்சு யாரை நோக்கிச் சொல்லப்பட்டது என்பதை אֶל குறிக்கிறது; இயல்பான நவீனத் தமிழில் ‘மோசேயிடம்’ என்று வழங்கப்படுகிறது.
- source_word: לֵאמֹר
  choice: “
  rationale: இந்த வினையெச்சம் அடுத்த வசனத்தில் வரும் உரையின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது. தமிழில் ‘என்று கூறினார்’ என இரட்டிப்பதைவிட தொடக்க மேற்கோள் குறி இதன் பணியை இயல்பாக நிறைவேற்றுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை வழங்குதல்
  choice: யெகோவா
  alternative: யாவே
  rationale: மூலத்தில் இறைப் பட்டப்பெயர் அல்ல, தனிப்பெயரே உள்ளது. அதன் பெயர்த்தன்மையைப் பாதுகாக்க ‘கர்த்தர்’ என்று மாற்றாமல், தமிழில் பரவலாக அறியப்படும் ‘யெகோவா’ பயன்படுத்தப்பட்டது; எபிரெய உச்சரிப்பை மறுகட்டமைக்கும் ‘யாவே’ என்பதும் சாத்தியம்.
translation_notes:
  register: நவீன, எளிய, மரியாதைமிக்க தமிழ். இவ்வசனம் அடுத்த வசனத்தின் நேரடிப் பேச்சை அறிமுகப்படுத்துவதால் முடிவில் தொடக்க மேற்கோள் குறி இடப்பட்டுள்ளது; தனித்து வாசிக்கும்போது இது நிறைவுறாத வாக்கியமாகத் தோன்றுவது மூலத்தின் அமைப்பையே பிரதிபலிக்கிறது.
