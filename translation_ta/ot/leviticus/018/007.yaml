  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: עֶרְוַ֥ת אָבִ֛י/ךָ וְ/עֶרְוַ֥ת אִמְּ/ךָ֖ לֹ֣א תְגַלֵּ֑ה אִמְּ/ךָ֣ הִ֔וא לֹ֥א תְגַלֶּ֖ה עֶרְוָתָֽ/הּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/007.yaml
  text: You shall not uncover the nakedness of your father[a], that is, the nakedness of your mother. She is your mother; you shall not uncover her nakedness.
translation:
  language: ta
  text: உன் தந்தையின் நிர்வாணத்தை—அதாவது, உன் தாயின் நிர்வாணத்தை—நீ வெளிப்படுத்தக் கூடாது.[a] அவள் உன் தாய்; அவளுடைய நிர்வாணத்தை நீ வெளிப்படுத்தக் கூடாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொல்லுக்குச் சொல் மொழிபெயர்த்தால்: “உன் தந்தையின் நிர்வாணத்தையும் உன் தாயின் நிர்வாணத்தையும் நீ வெளிப்படுத்தக் கூடாது.” இதைத் தொடர்ந்து வரும் “அவள் உன் தாய்” என்ற சொற்றொடர், இங்கு தாயைக் குறித்தே விளக்கப்படுவதாகக் காட்டுகிறது.'
    reason: alternative_reading
lexical_decisions:
- source_word: עֶרְוַת
  choice: நிர்வாணத்தை
  rationale: லேவியராகமம் 18-இல் גלה ערוה என்பது தடைசெய்யப்பட்ட பாலுறவைக் குறிக்கும் நிலையான சட்ட மொழிவழக்கு. அதை வெளிப்படையான விளக்கவுரையாக மாற்றாமல், மூலத்தின் மறைமுகத்தன்மையையும் சட்டத் தொனியையும் காக்க ‘நிர்வாணம்’ பயன்படுத்தப்பட்டது.
- source_word: תְגַלֵּה / תְגַלֶּה
  choice: நீ வெளிப்படுத்தக் கூடாது
  rationale: גלה என்ற வினையின் அடிப்படை உருவகமான ‘வெளிப்படுத்து/திறந்து காட்டு’ என்ற கருத்தையும், இந்த அதிகாரத்தில் மீண்டும் வரும் தடைச் சூத்திரத்தையும் இது காக்கிறது.
- source_word: אָבִיךָ
  choice: உன் தந்தையின்
  rationale: இரண்டாம் நபர் ஆண்பால் ஒருமை உடைமை விகுதியுடனான உறவுமுறைச் சொல்லின் நேரடியான மொழிபெயர்ப்பு.
- source_word: וְעֶרְוַת אִמְּךָ
  choice: அதாவது, உன் தாயின் நிர்வாணத்தை
  rationale: எபிரெய உரையில் இணைப்புச் சொல் இருந்தாலும், அடுத்துள்ள ‘அவள் உன் தாய்’ என்ற விளக்கம் இரண்டாம் தொடரை முதல் தொடருக்கான விளக்கமாகப் புரிந்துகொள்ள இடமளிக்கிறது. ‘அதாவது’ அந்த வாசிப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது; நேரடி மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: הִוא
  choice: அவள்
  rationale: பெண்பால் ஒருமைச் சுட்டுப்பெயர் தாயைக் குறிக்கிறது; எபிரெயத்தின் வலியுறுத்தலை ‘அவள் உன் தாய்’ எனக் காக்கிறது.
- source_word: אִמְּךָ
  choice: உன் தாய்
  rationale: உறவுமுறைச் சொல்லின் நேரடி மொழிபெயர்ப்பு; சட்டத் தெளிவுக்காக மூலத்தில் உள்ள மறுபடியும் கூறுதலும் காக்கப்பட்டுள்ளது.
theological_decisions:
- issue: ‘உன் தந்தையின் நிர்வாணம்’ என்பதற்கும் ‘உன் தாயின் நிர்வாணம்’ என்பதற்கும் இடையிலான உறவு
  choice: இரண்டாம் தொடரை விளக்க இணைப்பாகக் கொண்டு, ‘உன் தந்தையின் நிர்வாணத்தை—அதாவது, உன் தாயின் நிர்வாணத்தை’ என மொழிபெயர்த்தல்
  alternative: ‘உன் தந்தையின் நிர்வாணத்தையும் உன் தாயின் நிர்வாணத்தையும்’ என ஒருங்கிணைப்பை நேரடியாக மொழிபெயர்த்தல்
  rationale: ‘அவள் உன் தாய்’ என்ற பின்வரும் வாக்கியம் தாயையே உடனடி பாலியல் தடையின் பொருளாகத் தெளிவுபடுத்துகிறது; அதேவேளை எபிரெய இணைப்புச் சொல்லின் நேரடி வாசிப்பும் சாத்தியமாதலால் அது அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான சட்டத் தொனி பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் பாலியல் மறைமொழியைப் பாதுகாக்க ‘நிர்வாணத்தை வெளிப்படுத்து’ என்ற சொற்றொடர் வைக்கப்பட்டுள்ளது; அதன் பொருளை அதிகமாக வெளிப்படையாக்கும் விளக்கவுரை தவிர்க்கப்பட்டது.
