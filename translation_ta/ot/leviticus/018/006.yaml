base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/006.yaml
  text: No man among you shall approach any close relative of his flesh to uncover nakedness[a]; I am Yahweh.
translation:
  language: ta
  text: உங்களில் எவனும் தனக்கு நெருங்கிய இரத்த உறவினரை, அவருடைய நிர்வாணத்தை வெளிப்படுத்துவதற்காக[a], அணுகக் கூடாது. நான் யாவே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நிர்வாணத்தை வெளிப்படுத்துதல்” என்பது இந்த அதிகாரத்தில் நெருங்கிய உறவினருடன் தடைசெய்யப்பட்ட பாலியல் வெளிப்பாடு அல்லது பாலுறவைக் குறிக்கும் எபிரெயச் சட்ட மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אִישׁ
  choice: உங்களில் எவனும்
  rationale: இரட்டிக்கப்பட்ட ஒருமை ஆண்பால் பெயர்ச்சொல் ஒவ்வொருவரையும் தனித்தனியாகக் குறிக்கும் பகிர்வு மரபுத்தொடர். எதிர்மறைக் கட்டளையில் ‘உங்களில் எவனும் ... கூடாது’ என்பது அதன் வலியுறுத்தலையும் இயல்பான தமிழையும் காக்கிறது.
- source_word: שְׁאֵר בְּשָׂרוֹ
  choice: தன் நெருங்கிய இரத்த உறவினர்
  rationale: இச்சொற்றொடர் உடல்/சதை சார்ந்த நெருங்கிய உறவைக் குறிக்கிறது. ‘நெருங்கிய இரத்த உறவினர்’ என்பது எபிரெயக் கருத்தைத் தெளிவான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: לֹא תִקְרְבוּ
  choice: அணுகக் கூடாது
  rationale: எதிர்மறையுடன் வரும் இரண்டாம் நபர் பன்மை வினைச்சொல் சட்டரீதியான தடையைத் தெரிவிக்கிறது. ‘அணுகக் கூடாது’ என்பது மூலத்தின் மறைமுகமான சொல்லாட்சியையும் கட்டளைத் தொனியையும் காக்கிறது.
- source_word: לְגַלּוֹת עֶרְוָה
  choice: நிர்வாணத்தை வெளிப்படுத்துவதற்காக
  rationale: லேவியராகமம் 18-இல் மீண்டும் மீண்டும் வரும் சட்ட மரபுத்தொடரை நேரடியாகப் பாதுகாக்கிறது; அதன் பாலியல் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: אֲנִי יְהוָה
  choice: நான் யெகோவா
  rationale: உடன்படிக்கையின் தெய்வீகப் பெயரான יהוה-ஐ பொதுவாக அறியப்படும் தமிழ் ஒலிபெயர்ப்பான ‘யெகோவா’ என்று வழங்கி, ‘நான்’ என்ற வலியுறுத்தலையும் காக்கிறது.
theological_decisions:
- issue: יהוה என்ற தெய்வீகப் பெயரை எவ்வாறு வழங்குவது
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் பொதுப்பட்டப் பெயர் அல்ல, நான்கெழுத்துத் தெய்வீகப் பெயரே நேரடியாக உள்ளது. ஆகவே அதை பட்டப்பெயராக மாற்றாமல் தமிழ் வாசகர்களிடையே நிலைபெற்ற ஒலிபெயர்ப்பால் வழங்கப்பட்டுள்ளது; ‘யாவே’ என்பதும் சாத்தியமான ஒலிபெயர்ப்பு.
- issue: பாலியல் சட்ட மரபுத்தொடரை முதன்மை உரையில் வெளிப்படையாக்க வேண்டுமா
  choice: ‘நிர்வாணத்தை வெளிப்படுத்துவதற்காக’ என்ற மூல உருவகத்தை வைத்தல்
  alternative: பாலுறவு கொள்வதற்காக
  rationale: இந்த அதிகாரம் முழுவதும் முக்கியமாக மீளும் எபிரெயச் சட்ட மரபுத்தொடரின் உருவகத்தையும் அதன் ஓரளவு பரந்த பொருள் சாத்தியத்தையும் காக்கிறது. பாலியல் வெளிப்பாடு அல்லது பாலுறவு என்ற பொருள் அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டக் கட்டளைக்கேற்ற கண்ணியமான தொனி பயன்படுத்தப்பட்டுள்ளது. ‘அணுகுதல்’ மற்றும் ‘நிர்வாணத்தை வெளிப்படுத்துதல்’ ஆகிய மூலத்தின் மறைமுகச் சொல்லாட்சி பாதுகாக்கப்பட்டு, தவறான புரிதலைத் தவிர்க்க அடிக்குறிப்பு சேர்க்கப்பட்டுள்ளது.
