base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/018.yaml
  text: And you shall not take a woman in addition to her sister as a rival wife[a], to uncover her nakedness while her sister is still alive.
translation:
  language: ta
  text: ஒரு பெண் உயிரோடிருக்கையில், அவளுடைய சகோதரியை அவளுக்குப் போட்டி மனைவியாக நீ எடுத்துக்கொண்டு[a], அந்தச் சகோதரியின் நிர்வாணத்தை வெளிப்படுத்தக் கூடாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவளுடைய சகோதரியை அவளோடு சேர்த்து எடுத்துக்கொண்டு, அவளைப் போட்டியாளாக ஆக்கி.” எபிரெய வாசகம் சுருக்கமாக அமைந்துள்ளது. முதல் சகோதரி உயிரோடிருக்கும்போது அவளுடைய சகோதரியை மேலும் ஒரு மனைவியாக எடுத்துக்கொள்வதே தடைசெய்யப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִשָּׁה אֶל אֲחֹתָהּ
  choice: ஒரு பெண் உயிரோடிருக்கையில், அவளுடைய சகோதரியை
  rationale: אִשָּׁה என்பதற்கு ‘பெண்’ அல்லது ‘மனைவி’ என்று பொருள் வரலாம். திருமணத்திற்காக ‘எடுத்துக்கொள்வது’ என்ற சட்டச் சூழல் திருமணப் பொருளைத் தெளிவாக்குகிறது. தமிழ் வாக்கியத்தில் முதலில் குறிப்பிடப்பட்ட பெண்ணும் அவளுடைய சகோதரியும் குழப்பமின்றி வேறுபடுத்தப்படுகின்றனர்.
- source_word: לֹא תִקָּח
  choice: நீ எடுத்துக்கொண்டு ... கூடாது
  rationale: இரண்டாம் நபர் ஒருமையில் அமைந்த சட்டத் தடையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: לִצְרֹר
  choice: அவளுக்குப் போட்டி மனைவியாக
  rationale: צרר இங்கு இரண்டு சகோதரிகளுக்கிடையே உருவாகும் போட்டி அல்லது பகைமை உறவைக் குறிக்கிறது. ‘மனைவி’ என்பது திருமணச் சூழலைத் தமிழில் வெளிப்படையாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: לְגַלּוֹת עֶרְוָתָהּ
  choice: அந்தச் சகோதரியின் நிர்வாணத்தை வெளிப்படுத்த
  rationale: லேவியராகமத்தில் பாலுறவைக் குறிக்கும் நிலையான எபிரெய மறைமுகச் சொல்லாட்சியை அதன் உருவக வடிவத்தோடு காக்கிறது; பெயர்ச்சுட்டின் தொடர்பைத் தமிழில் தெளிவாக்க ‘அந்தச் சகோதரியின்’ என வழங்கப்பட்டுள்ளது.
- source_word: עָלֶיהָ בְּחַיֶּיהָ
  choice: ஒரு பெண் உயிரோடிருக்கையில் ... அவளுக்குப்
  rationale: ‘அவள்மேல்/அவளோடு, அவள் வாழ்நாளில்’ என்ற சுருக்கமான எபிரெய அமைப்பு, முதல் சகோதரி உயிருடன் இருக்கும்போது அவளுடன் கூடுதலாக மற்ற சகோதரியை மனைவியாக எடுப்பதைக் குறிக்கிறது. தமிழ் சொல் வரிசை கால வரம்பைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: பலதார மணம் மற்றும் சகோதரிகள் இருவரையும் மணத்தல் தொடர்பான தடையின் வரம்பு
  choice: முதல் சகோதரி உயிரோடிருக்கும்போது அவளுடைய சகோதரியை அவளுக்குக் கூடுதலான, போட்டி மனைவியாக எடுப்பதை வசனம் தடைசெய்கிறது.
  alternative: முதல் சகோதரி இறந்த பின்னரும் உட்பட, எந்தச் சூழலிலும் இரு சகோதரிகளை மணப்பதை வசனம் தடைசெய்கிறது; அல்லது போட்டியை உண்டாக்கும் எந்தத் திருமண ஏற்பாட்டையும் பொதுவாகத் தடைசெய்கிறது.
  rationale: לִצְרֹר மற்றும் בְּחַיֶּיהָ ஆகிய சொற்றொடர்கள், முதல் பெண் உயிருடன் இருக்கும்போது அவளுடைய சகோதரியை கூடுதல் மனைவியாக எடுத்து போட்டியை உருவாக்குவதையே மிக இயல்பாகச் சுட்டுகின்றன. மூலவசனம் கூறுவதைவிடத் தடையின் வரம்பை மொழிபெயர்ப்பு விரிவாக்கவில்லை.
