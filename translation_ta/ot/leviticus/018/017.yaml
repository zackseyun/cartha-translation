base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/017.yaml
  text: You shall not uncover the nakedness of a woman and her daughter[a]. You shall not take her son's daughter or her daughter's daughter to uncover her nakedness; they are close relatives[c][b]. It is depravity.
translation:
  language: ta
  text: ஒரு பெண்ணினதும் அவளுடைய மகளினதும் நிர்வாணத்தை வெளிப்படுத்தாதே.[a] அவளுடைய நிர்வாணத்தை வெளிப்படுத்துவதற்காக அவளுடைய மகனின் மகளையோ அவளுடைய மகளின் மகளையோ எடுத்துக்கொள்ளாதே.[b] அவர்கள் அவளுடைய நெருங்கிய இரத்த உறவினர்கள். அது நெறிகெட்ட செயல்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நிர்வாணத்தை வெளிப்படுத்துதல்’ என்பது இங்கு தடைசெய்யப்பட்ட பாலுறவைக் குறிக்கும் எபிரேய மரபுத்தொடர்.
    reason: cultural_note
  - marker: b
    text: ‘அவளுடைய’ என்பது இயல்பாக முதலில் குறிப்பிடப்பட்ட பெண்ணைக் குறிக்கிறது; ஒவ்வொரு பேத்தியையும் தனித்தனியாகக் குறிப்பதாகவும் இதைப் புரிந்துகொள்ளலாம். ‘எடுத்துக்கொள்ளுதல்’ என்பது இச்சூழலில் திருமணம் அல்லது பாலியல் இணைப்பைக் குறிக்கக்கூடும்.
    reason: textual_ambiguity
  - marker: c
    text: ‘கொடுமையான முறைகேடு,’ ‘வெட்கக்கேடான செயல்’ அல்லது ‘அருவருப்பான செயல்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
