  choice: நிர்வாணத்தை வெளிப்படுத்தாதே / நிர்வாணத்தை வெளிப்படுத்துவதற்காக
  rationale: லேவியராகமத்தில் தடைசெய்யப்பட்ட பாலுறவைக் குறிக்கும் நிலையான எபிரேய மரபுத்தொடரைத் தக்கவைக்கிறது. தமிழில் அதன் பாலியல் பொருள் உடனடியாகத் தெளிவாக இல்லாமலிருக்கலாம் என்பதால் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
- source_word: אִשָּׁה
  choice: ஒரு பெண்
  rationale: இச்சொல் ‘பெண்’ அல்லது ‘மனைவி’ எனப் பொருள்படலாம். இங்கு திருமண உறவு கட்டாயமாகக் குறிக்கப்படாததால் விரிவானதும் பாதுகாப்பானதுமான ‘பெண்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: וּבִתָּהּ
  choice: அவளுடைய மகள்
  rationale: பெண்ணைச் சுட்டும் உடைமைத் தொடர் இயல்பாகவும் நேரடியாகவும் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: תִקַּח
