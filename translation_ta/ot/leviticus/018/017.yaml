  rationale: எபிரேய வினையின் பரந்த பொருளைத் தக்கவைக்கிறது; இச்சூழலில் அது திருமணம் செய்துகொள்வதையோ பாலியல் இணைப்பில் ஏற்றுக்கொள்வதையோ குறிக்கலாம். ‘திருமணம் செய்யாதே’ என்று மட்டும் மொழிபெயர்த்து தடையின் பொருளைச் சுருக்கவில்லை.
