theological_decisions:
- issue: לְגַלּוֹת עֶרְוָתָהּ என்பதிலுள்ள ஒருமைப் பெண்பால் பின்னொட்டின் சுட்டுப்பொருள்
  choice: ‘அவளுடைய நிர்வாணம்’ என்று விரிவாக்காமல் தக்கவைத்து, முதலில் குறிப்பிடப்பட்ட பெண்ணையே இயல்பான முதன்மைச் சுட்டுப்பொருளாகக் கொள்ளுதல்
  alternative: ஒவ்வொரு பெண் வழித்தோன்றலையும் தனித்தனியாகச் சுட்டுவதாகப் பகிர்ந்துணர்தல்
  rationale: மூலவசனம் முதலில் பெண்ணையும் அவளுடைய மகளையும் குறிப்பிட்டு, பின்னர் மகன்வழி மற்றும் மகள்வழிப் பேத்திகளுக்கு தடையை விரிவாக்குகிறது. ஒருமைப் பின்னொட்டின் இயல்பான தொடர்பையும் அதிலுள்ள உண்மையான தெளிவின்மையையும் தமிழில் ‘அவளுடைய’ என்று தக்கவைத்து, அடிக்குறிப்பில் மாற்று வாசிப்பைக் குறிப்பிடுகிறது.
- issue: תִקַּח என்பதன் சட்டரீதியான வீச்சு
  choice: ‘எடுத்துக்கொள்ளாதே’ என்ற பரந்த வினையைப் பயன்படுத்துதல்
  alternative: ‘திருமணம் செய்துகொள்ளாதே’ அல்லது ‘பாலுறவுக்காக ஏற்றுக்கொள்ளாதே’
  rationale: இந்தத் தடை முறையான திருமண ஒப்பந்தத்திற்கு மட்டும் வரையறுக்கப்படவில்லை. தொடர்ந்து வரும் நிர்வாணத்தை வெளிப்படுத்துதல் என்ற தொடர் பாலியல் நோக்கத்தை விளக்குவதால், மூலத்தின் பரந்த சொல்லாட்சி பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டவிதிக்குரிய நேரடியான ஒருமை எதிர்மறை ஏவல் நடை பயன்படுத்தப்பட்டுள்ளது. ‘நிர்வாணத்தை வெளிப்படுத்துதல்’ என்ற மூலமொழி மரபுத்தொடர் உரையில் தக்கவைக்கப்பட்டு அடிக்குறிப்பால் விளக்கப்பட்டுள்ளது. உறவுமுறைச் சொற்கள் சட்டத் துல்லியத்திற்காக ‘மகனின் மகள்,’ ‘மகளின் மகள்’ என வெளிப்படையாக வழங்கப்பட்டுள்ளன.
