  source_fidelity: மூல எபிரெயத்தின் இரு முறை வரும் עֶרְוָה (‘நிர்வாணம்’) மற்றும் சட்டரீதியான גלה ערוה மரபுத்தொடர் தக்கவைக்கப்பட்டுள்ளன. ‘உன் சகோதரனுடைய மனைவி’ என்பது אֵשֶׁת אָחִיךָ என்பதற்குத் துல்லியமானது. இறுதிக் கூற்று, ‘அது உன் சகோதரனுடைய நிர்வாணம்,’ மூலத்தின் மீளுரைப்பையும் அதன் திட்டமிட்ட சட்டரீதியான தெளிவின்மையையும் காக்கிறது.
