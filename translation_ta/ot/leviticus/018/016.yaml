source:
  edition: WLC
  text: עֶרְוַ֥ת אֵֽשֶׁת אָחִ֖י/ךָ לֹ֣א תְגַלֵּ֑ה עֶרְוַ֥ת אָחִ֖י/ךָ הִֽוא־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/016.yaml
  text: You shall not uncover the nakedness of your brother’s wife[a]; it is your brother’s nakedness.
translation:
  language: ta
  text: உன் சகோதரனுடைய மனைவியின் நிர்வாணத்தை நீ வெளிப்படுத்தக் கூடாது[a]; அது உன் சகோதரனுடைய நிர்வாணம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, இன்னும் வெளிப்படையாக: “உன் சகோதரனுடைய மனைவியுடன் நீ பாலுறவு கொள்ளக் கூடாது.” எபிரெய மொழியில் “நிர்வாணத்தை வெளிப்படுத்து” என்ற மரபுத்தொடர் பயன்படுத்தப்பட்டுள்ளது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת
  choice: நிர்வாணத்தை
  rationale: லேவியராகமம் 18-இல் גלה ערוה என்பது தடைசெய்யப்பட்ட பாலுறவைக் குறிக்கும் சட்டரீதியான இடக்கரடக்கல். ‘நிர்வாணத்தை வெளிப்படுத்து’ என்று மொழிபெயர்ப்பது மூலமொழியின் உருவகத்தையும் அத்தியாயம் முழுவதிலான சொல் ஒற்றுமையையும் காக்கிறது.
- source_word: אֵשֶׁת אָחִיךָ
  choice: உன் சகோதரனுடைய மனைவியின்
  rationale: கட்டமைப்பு வடிவிலுள்ள אֵשֶׁת என்பது இங்கு திருமண உறவைத் தெளிவாகக் குறிக்கிறது; ஆகவே ‘பெண்’ என்பதைக் காட்டிலும் ‘மனைவி’ துல்லியமானது.
- source_word: לֹא תְגַלֵּה
  choice: நீ வெளிப்படுத்தக் கூடாது
  rationale: לֹא உடன் வரும் வினை வடிவம் சட்டத் தடையைத் தெரிவிக்கிறது. இத்தமிழ் வடிவம் நவீன வாசகருக்கு இயல்பாகவும் கட்டளையின் வலிமையைத் தக்கவைத்தும் உள்ளது.
- source_word: עֶרְוַת אָחִיךָ הִוא
  choice: அது உன் சகோதரனுடைய நிர்வாணம்
  rationale: மூலத்தில் மீண்டும் வரும் עֶרְוָה என்ற சொல்லைத் தக்கவைத்து, தடைக்கான சட்டரீதியான காரணத்தைத் தீர்மானித்து விளக்காமல் அப்படியே முன்வைக்கிறது.
theological_decisions:
- issue: இடக்கரடக்கலான சட்ட மரபுத்தொடரை நேரடியாகப் பாலுறவுத் தடையாக விரித்துரைக்க வேண்டுமா
  choice: முதன்மை உரையில் ‘நிர்வாணத்தை வெளிப்படுத்து’ என்ற எபிரெய மரபுத்தொடரைத் தக்கவைத்தல்
  alternative: ‘உன் சகோதரனுடைய மனைவியுடன் பாலுறவு கொள்ளக் கூடாது’
  rationale: மூல எபிரெயம் நேரடியான சொல்லாட்சிக்குப் பதிலாக மரபான சட்ட இடக்கரடக்கலைப் பயன்படுத்துகிறது. அதைத் தக்கவைப்பது மூலத்தின் வடிவத்தையும் லேவியராகமம் 18 முழுவதிலான ஒற்றுமையையும் பாதுகாக்கிறது; தெளிவான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான சட்டநடை பயன்படுத்தப்பட்டுள்ளது. ‘நிர்வாணத்தை வெளிப்படுத்து’ என்பது தமிழில் சற்றே மூலமொழிச் சாயல் கொண்டிருந்தாலும், எபிரெயச் சட்ட இடக்கரடக்கலையும் முக்கியச் சொல்லின் மறுபயன்பாட்டையும் காக்கிறது; அதன் கருத்து அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
