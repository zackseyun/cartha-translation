  edition: WLC
  text: עֶרְוַ֥ת כַּלָּֽתְ/ךָ֖ לֹ֣א תְגַלֵּ֑ה אֵ֤שֶׁת בִּנְ/ךָ֙ הִ֔וא לֹ֥א תְגַלֶּ֖ה עֶרְוָתָֽ/הּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/015.yaml
  text: You shall not uncover the nakedness of your daughter-in-law[a]; she is your son's wife; you shall not uncover her nakedness.
translation:
  language: ta
  text: உன் மருமகளின் நிர்வாணத்தை[a] வெளிப்படுத்தாதே. அவள் உன் மகனின் மனைவி; அவளுடைய நிர்வாணத்தை வெளிப்படுத்தாதே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “நிர்வாணத்தை வெளிப்படுத்துதல்” என்பது லேவியராகமத்தில் தடைசெய்யப்பட்ட பாலுறவைக் குறிக்க மீண்டும் மீண்டும் பயன்படுத்தப்படும் சட்ட வழக்குச் சொல்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת / עֶרְוָתָהּ
  choice: நிர்வாணத்தை / அவளுடைய நிர்வாணத்தை
  rationale: லேவியராகமம் 18 முழுவதும் வரும் நிலையான சட்ட வழக்குச் சொல்லைத் தக்கவைக்கிறது. இது தடைசெய்யப்பட்ட பாலுறவைக் குறிக்கும் நாகரிக மறைமுகச் சொல்; அதேவேளையில் எபிரெயச் சொல்லின் உருவகத்தையும் மறுமொழியையும் பாதுகாக்கிறது.
- source_word: כַּלָּתְךָ
  choice: உன் மருமகள்
  rationale: இச்சூழலில் இந்த உறவுமுறைச் சொல் மகனின் மனைவியை நேரடியாகக் குறிக்கிறது; அடுத்த வாக்கியம் அதையே தெளிவுபடுத்துகிறது.
- source_word: לֹא תְגַלֵּה / לֹא תְגַלֶּה
  choice: வெளிப்படுத்தாதே
  rationale: עֶרְוָה என்பதுடன் சேர்ந்த גלה வினைச்சொல் இவ்வதிகாரத்தில் மீண்டும் மீண்டும் வரும் தடைச் சூத்திரமாகும். ஒருமை ஆண்பால் முன்னிலையைக் குறிக்கும் இயல்பான நவீனத் தமிழ் கட்டளை வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: אֵשֶׁת בִּנְךָ הִוא
  choice: அவள் உன் மகனின் மனைவி
  rationale: முன்னர் சொல்லப்பட்ட பெண்ணின் உறவை விளக்கும் அடையாள வாக்கியத்தை இயல்பான தமிழில், அதன் வலியுறுத்தலை மிகைப்படுத்தாமல் வழங்குகிறது.
theological_decisions:
- issue: ‘நிர்வாணத்தை வெளிப்படுத்துதல்’ என்ற பாலியல் தடை வழக்குச் சொல்லின் மொழிபெயர்ப்பு
  choice: எபிரெய உருவகத்தை ‘நிர்வாணத்தை வெளிப்படுத்தாதே’ என்று தக்கவைத்தல்
  alternative: ‘பாலுறவு கொள்ளாதே’ என்று வெளிப்படையாகப் பொருளுரைத்தல்
  rationale: மூலத்தில் இவ்வதிகாரம் முழுவதும் பயன்படுத்தப்படும் நிலையான சட்ட மறைமுகச் சொல்லின் சொற்சார் ஒற்றுமையையும் அதன் கண்ணியமான மொழிநடையையும் இது காக்கிறது. அடிக்குறிப்பு அதன் பாலியல் பொருளைத் தெளிவுபடுத்துவதால், மொழிபெயர்ப்பிலேயே உருவகத்தைத் தட்டையாக்கத் தேவையில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான சட்டத் தொனி பயன்படுத்தப்பட்டுள்ளது. எபிரெய மூலத்தின் இருமுறைத் தடை, உறவுமுறை விளக்கம், மறைமுகப் பாலியல் வழக்குச் சொல் ஆகியவை பாதுகாக்கப்பட்டுள்ளன.
