id: LEV.18.12
reference: Leviticus 18:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: עֶרְוַ֥ת אֲחוֹת אָבִ֖י/ךָ לֹ֣א תְגַלֵּ֑ה שְׁאֵ֥ר אָבִ֖י/ךָ הִֽוא־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/012.yaml
  text: You shall not uncover the nakedness of your father's sister[b][a]; she is your father's flesh.
translation:
  language: ta
  text: உன் தகப்பனுடைய சகோதரியின் நிர்வாணத்தை வெளிப்படுத்தாதே[a]; அவள் உன் தகப்பனுடைய இரத்த உறவினள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நிர்வாணத்தை வெளிப்படுத்து” என்பது லேவியராகமத்தில் தடைசெய்யப்பட்ட பாலியல் வெளிப்பாடு அல்லது உறவைக் குறிக்கும் சட்டச் சொற்றொடர்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் நேரடியாக, “அவள் உன் தகப்பனுடைய சதை”; அதாவது, நெருங்கிய இரத்த உறவினள்.
    reason: alternative_reading
lexical_decisions:
- source_word: עֶרְוַת
  choice: நிர்வாணத்தை
  rationale: லேவியராகமம் 18-இல் வரும் நிலையான சட்டச் சொற்றொடரான ‘நிர்வாணத்தை வெளிப்படுத்து’ என்பதைக் காத்து, தடைசெய்யப்பட்ட பாலியல் வெளிப்பாடு அல்லது உறவைக் குறிக்கிறது.
- source_word: תְגַלֵּה
  choice: வெளிப்படுத்தாதே
  rationale: גלה என்பதன் பியேல் வடிவம் עֶרְוָה உடன் சேர்ந்து இவ்வதிகாரத்தின் வழக்கமான தடைச் சூத்திரத்தை உருவாக்குகிறது; வெளிப்படையாக ‘பாலுறவு கொள்ளாதே’ என்று விரித்துரைப்பதைத் தவிர்க்கிறது.
- source_word: אֲחוֹת אָבִיךָ
  choice: உன் தகப்பனுடைய சகோதரி
  rationale: மூலத்தின் உறவுமுறையை நேரடியாகவும் தெளிவாகவும் காட்டும் இயல்பான தமிழாக்கம்.
- source_word: שְׁאֵר
  choice: இரத்த உறவினள்
  rationale: இங்கு שְׁאֵר நெருங்கிய உடல்/குருதி உறவைக் குறிக்கிறது. ‘சதை’ என்ற சொல்லைவிட ‘இரத்த உறவினள்’ சட்டப்பூர்வ உறவுமுறைப் பொருளைத் தெளிவாகத் தெரிவிக்கிறது; நேரடி ‘சதை’ வாசிப்பு அடிக்குறிப்பில் வைக்கப்படுகிறது.
- source_word: הִוא
  choice: அவள்
  rationale: தடைசெய்யப்பட்ட நெருங்கிய உறவுமுறையைச் சேர்ந்த பெண்ணை எளிமையாக அடையாளப்படுத்துகிறது.
theological_decisions:
- issue: உறவுமுறை சார்ந்த பாலியல் தடையை அளவுக்கு மீறி விரித்துரைக்காமல் மொழிபெயர்த்தல்
  choice: ‘நிர்வாணத்தை வெளிப்படுத்தாதே’ என்ற சட்டச் சொற்றொடரை முதன்மை உரையில் வைத்தல்
  alternative: ‘பாலுறவு கொள்ளாதே’
  rationale: மூல எபிரெயத்தின் சூத்திர வடிவத்தையும் லேவியராகமம் 18 முழுவதிலுமுள்ள சொல்லிணக்கத்தையும் காக்கிறது; அதேவேளையில் அதன் சட்டப் பொருளை அடிக்குறிப்பு விளக்குகிறது.
- issue: שְׁאֵר என்பதிலுள்ள உடல் மற்றும் உறவுமுறை நுணுக்கம்
  choice: முதன்மை உரையில் ‘இரத்த உறவினள்’
  alternative: ‘உன் தகப்பனுடைய சதை’ அல்லது ‘நெருங்கிய உறவினள்’
  rationale: தமிழில் ‘சதை’ என்ற நேரடி வடிவம் இயல்பற்றதாகவும் தவறாகப் புரியக்கூடியதாகவும் இருப்பதால் உறவுமுறைப் பொருள் முதன்மைப்படுத்தப்படுகிறது; மூலத்தின் உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டப்பகுதிக்கேற்ற கண்ணியமான நேரடி நடையுடன் மொழிபெயர்க்கப்பட்டது. ‘தகப்பன்’ என்ற வேதாகமப் பதிவுசார் சொல் தக்கவைக்கப்பட்டாலும் வாக்கிய அமைப்பு எளிமையாக உள்ளது; பாலியல் சட்டச் சொற்றொடரின் மூல உருவகம் முதன்மை உரையில் பாதுகாக்கப்பட்டுள்ளது.
