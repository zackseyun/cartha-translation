  text: אַל תִּֽטַּמְּא֖וּ בְּ/כָל אֵ֑לֶּה כִּ֤י בְ/כָל אֵ֨לֶּה֙ נִטְמְא֣וּ הַ/גּוֹיִ֔ם אֲשֶׁר אֲנִ֥י מְשַׁלֵּ֖חַ מִ/פְּנֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/024.yaml
  text: Do not make yourselves unclean by any of these things[a], for by all these things the nations that I am driving out before you became unclean.
translation:
  language: ta
  text: இவற்றில் எதனாலும் உங்களைத் தீட்டுப்படுத்திக்கொள்ளாதீர்கள்[a]. ஏனெனில், நான் உங்கள் முன்னிலையிலிருந்து துரத்திவிடுகிற மக்கள் இனங்கள் இவையெல்லாவற்றாலும் தீட்டுப்பட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இவற்றில் எதனாலும் உங்களை அசுத்தப்படுத்திக்கொள்ளாதீர்கள் … மக்கள் இனங்கள் … அசுத்தமானார்கள்.”
    reason: טמא என்பதற்கான செல்லத்தக்க மாற்றுச் சொல்லாட்சியையும், அதன் தற்சார்பு மற்றும் நிலை நுணுக்கங்களையும் காட்டுகிறது.
lexical_decisions:
- source_word: אַל תִּטַּמְּאוּ
  choice: உங்களைத் தீட்டுப்படுத்திக்கொள்ளாதீர்கள்
  rationale: אַל உடன் வரும் Hitpael வினை நேரடியான தடையையும், ஒருவர் தம்மையே தீட்டுக்கு உட்படுத்திக்கொள்ளும் தற்சார்பு நுணுக்கத்தையும் வெளிப்படுத்துகிறது.
- source_word: בְּכָל אֵלֶּה
  choice: இவற்றில் எதனாலும்
  rationale: எதிர்மறைத் தடையில் כָל இயல்பாக ‘எதனாலும்’ எனப் பகிர்நிலைப் பொருள் பெறுகிறது; בְּ கருவி அல்லது காரணப் பொருளைக் குறிக்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முன்னுள்ள தடைக்கான காரணத்தை அறிமுகப்படுத்தும் இணைப்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: נִטְמְאוּ
  choice: தீட்டுப்பட்டார்கள்
  rationale: Niphal வடிவத்தின் நிகழ்ந்த நிலை அல்லது செயப்பாட்டு நுணுக்கத்தைப் பாதுகாக்கிறது; முதல் வினையுடன் ஒரே טמא சொல்லாட்சித் தொடரையும் நிலைநிறுத்துகிறது.
- source_word: הַגּוֹיִם
  choice: இனத்தார்
  rationale: இச்சூழலில் இஸ்ரவேலரல்லாத, நாட்டில் வாழ்ந்த மக்கள் இனங்களைக் குறிக்கிறது; ‘புறவினத்தார்’ போன்ற பிற்கால சமய நிழலைத் தவிர்க்கிறது.
- source_word: אֲשֶׁר אֲנִי מְשַׁלֵּחַ
  choice: நான் ... துரத்திவிடுகிற
  rationale: שׁלח என்பதன் அடிப்படைப் பொருள் ‘அனுப்பு’ என்றாலும், நாட்டிலிருந்து மக்களை அகற்றும் இச்சூழலில் ‘துரத்திவிடு’ அதன் வெளியேற்றும் வலிமையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מִפְּנֵיכֶם
  choice: உங்கள் முன்னிலையிலிருந்து
  rationale: ‘உங்கள் முன்பிலிருந்து’ என்ற இடவியல் கருத்தையும், இஸ்ரவேலரின் வருகைக்கு முன்னால் அவர்கள் அகற்றப்படுவதையும் பாதுகாக்கிறது.
theological_decisions:
- issue: லேவியராகமம் 18-இல் சடங்கு-ஒழுக்கத் தீட்டு சொல்லாட்சி
  choice: தீட்டுப்படுத்திக்கொள்ளாதீர்கள் / தீட்டுப்பட்டார்கள்
  alternative: அசுத்தப்படுத்திக்கொள்ளாதீர்கள் / அசுத்தமானார்கள்
  rationale: טמא இங்கு தடைசெய்யப்பட்ட பாலியல் செயல்களால் உண்டாகும் உண்மையான சடங்கு-ஒழுக்கத் தீட்டைக் குறிக்கிறது. ‘தீட்டு’ லேவியராகமத்தின் பரிசுத்தம் சார்ந்த கருத்துத்தொடரைத் தக்கவைக்கிறது; ‘அசுத்தம்’ சாத்தியமான மாற்றாக இருந்தாலும் சாதாரண உடல் அழுக்காகவும் புரிந்துகொள்ளப்படலாம்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதையான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘தீட்டு’ என்ற லேவிய சொல்லாட்சி தக்கவைக்கப்பட்டாலும், அதனைச் சாதி சார்ந்த சமூகத் தீண்டாமைக் கருத்தாகப் புரிந்துகொள்ளச் செய்யும் சொற்கள் சேர்க்கப்படவில்லை.
