base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/008.yaml
  text: You shall not uncover the nakedness of your father's wife[a]; it is your father's nakedness.
translation:
  language: ta
  text: உன் தகப்பனுடைய மனைவியின் நிர்வாணத்தை நீ வெளிப்படுத்தக் கூடாது[a]; அது உன் தகப்பனுடைய நிர்வாணம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் வெளிப்படையாக, ‘உன் தகப்பனுடைய மனைவியுடன் நீ பாலுறவு கொள்ளக் கூடாது.’ எபிரெய மொழியில் சொல்லுக்குச் சொல், ‘நிர்வாணத்தை வெளிப்படுத்தக் கூடாது’ என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת
  choice: நிர்வாணத்தை
  rationale: லேவியராகமம் 18 முழுவதும் திரும்பத் திரும்ப வரும் ‘நிர்வாணத்தை வெளிப்படுத்து’ என்ற சட்டநடை மறைமுகச் சொல்லாட்சியை இது காக்கிறது; இச்சூழலில் அது பாலுறவைக் குறிக்கிறது.
- source_word: אֵשֶׁת
  choice: மனைவியின்
  rationale: ‘உன் தகப்பன்’ என்பதுடன் இணைந்து வருவதால், பொதுவாக ஒரு பெண்ணை அல்ல, அவருடைய மனைவியையே குறிக்கிறது.
- source_word: לֹא תְגַלֵּה
  choice: நீ வெளிப்படுத்தக் கூடாது
  rationale: மறுப்புடன் வரும் எபிரெய வினை வடிவம் சட்டத் தடையைத் தெரிவிக்கிறது. ‘வெளிப்படுத்து’ என்பது மூலமொழியின் உருவகத்தையும் அதிகாரத்தின் தொடர்ச்சியான சொல்லாட்சியையும் காக்கிறது.
- source_word: אָבִיךָ
  choice: உன் தகப்பன்
  rationale: நேரடியான உடைமை உறவைக் குறிக்கும் மொழிபெயர்ப்பு; வசனத்தின் இரு இடங்களிலும் தெளிவுக்காக ஒரே சொல்லாட்சி பேணப்படுகிறது.
- source_word: הִוא
  choice: அது
  rationale: எபிரெய மொழியில் இப்பெயர்ப்பதிலி பெண்பாலில் இருந்தாலும், அது பெண்ணையே சுட்டுவதாக அல்லாமல் ‘நிர்வாணம்’ என்பதையே மீண்டும் சுட்டுகிறது; எனவே தமிழில் ‘அது’ இயல்பானது.
theological_decisions:
- issue: மறைமுகமான சட்டச் சொல்லாட்சியைப் பாலுறவுக்கான வெளிப்படையான தடையாக மொழிபெயர்க்க வேண்டுமா?
  choice: முதன்மை உரையில் ‘நிர்வாணத்தை வெளிப்படுத்து’ என்ற மூலமொழி உருவகத்தைத் தக்கவைத்தல்
  alternative: ‘உன் தகப்பனுடைய மனைவியுடன் நீ பாலுறவு கொள்ளக் கூடாது’
  rationale: எபிரெய மூலம் இவ்வதிகாரம் முழுவதும் திரும்ப வரும் உடன்படிக்கைச் சட்டச் சூத்திரத்தைப் பயன்படுத்துகிறது. அந்த மறைமுக நடையையும் சொல் தொடர்ச்சியையும் முதன்மை உரை காக்கிறது; அதன் பொருள் அடிக்குறிப்பில் வெளிப்படையாகத் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சட்டத்துக்குரிய கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. ‘தகப்பன்’ என்பது உறவுச் சட்டச் சூழலுக்கேற்ற தெளிவையும் வசனத்தின் வலியுறுத்தலையும் தருகிறது; மூலத்தின் மறைமுகப் பாலியல் சொல்லாட்சி பாதுகாக்கப்பட்டுள்ளது.
