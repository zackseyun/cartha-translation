base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/026.yaml
  text: But you yourselves shall keep my statutes and my judgments[a], and you shall not do any of these abominations, neither the native-born nor the sojourner who sojourns among you.
translation:
  language: ta
  text: ஆனால் நீங்களோ என் நியமங்களையும் என் நீதித்தீர்ப்புகளையும் கடைப்பிடிக்க வேண்டும். இந்த அருவருப்பான செயல்களில் எதையும் செய்யக்கூடாது; நாட்டில் பிறந்தவரும் உங்களிடையே குடியிருக்கும் அந்நியரும்[a] அவற்றைச் செய்யக்கூடாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்களிடையே வசிக்கும் வெளிநாட்டவர்.”
    reason: גֵּר என்பது சமூகத்துக்குள் வசிக்கும், ஆனால் அந்த நாட்டைப் பிறப்பிடமாகக் கொண்டிராத ஒருவரைக் குறிக்கலாம். “உங்களிடையே குடியிருக்கும்” என்பது הַגָּר בְּתוֹכְכֶם என்பதின் வசிப்பு-நிலையை வெளிப்படுத்துகிறது.
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם אַתֶּם
  choice: ஆனால் நீங்களோ ... கடைப்பிடிக்க வேண்டும்
  rationale: שׁמר என்பதன் உடன்படிக்கை மற்றும் சட்டச் சூழலுக்குரிய ‘கடைப்பிடி’ என்ற பொருளையும், தனித்து வரும் אַתֶּם அளிக்கும் அழுத்தத்தையும் ‘நீங்களோ’ வெளிப்படுத்துகிறது.
- source_word: חֻקֹּתַי
  choice: என் நியமங்கள்
  rationale: חֻקִּים என்பது நிலைநிறுத்தப்பட்ட கட்டளைகள் அல்லது விதிமுறைகள்; ‘நியமங்கள்’ சட்டத் தொனியைத் தக்கவைத்துக்கொண்டு நவீன தமிழில் இயல்பாக உள்ளது.
- source_word: מִשְׁפָּטַי
  choice: என் நீதித்தீர்ப்புகள்
  rationale: מִשְׁפָּטִים என்பதில் நீதிசார் தீர்ப்புகள் மற்றும் சட்ட ஆணைகள் என்ற நுணுக்கம் உள்ளது; ‘நீதித்தீர்ப்புகள்’ அதைத் தெளிவாகத் தக்கவைக்கிறது.
- source_word: מִכֹּל הַתּוֹעֵבֹת הָאֵלֶּה
  choice: இந்த அருவருப்பான செயல்களில் எதையும்
  rationale: மறுப்புடன் வரும் מִן + כֹּל அனைத்தையும் உள்ளடக்கும் ‘எதையும்’ என்ற பொருளை அளிக்கிறது. תּוֹעֵבוֹת என்பதன் கடுமையான அறநெறி மதிப்பீட்டை ‘அருவருப்பான செயல்கள்’ இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הָאֶזְרָח
  choice: நாட்டைச் சேர்ந்தவர்
  rationale: אֶזְרָח என்பது அந்த நாட்டுக்கும் சமூகத்துக்கும் இயல்பாகச் சேர்ந்தவரைக் குறிக்கிறது; ‘நாட்டைச் சேர்ந்தவர்’ என்பது ‘குடியிருக்கும் அந்நியர்’ என்பதற்கு தெளிவான எதிரிணையாக உள்ளது.
- source_word: הַגֵּר הַגָּר בְּתוֹכְכֶם
  choice: உங்களிடையே குடியிருக்கும் அந்நியர்
  rationale: גֵּר என்பது சமூகத்துக்குள் வசிக்கும், ஆனால் அந்நாட்டைப் பிறப்பிடமாகக் கொண்டிராத ஒருவரைக் குறிக்கிறது. தொடர்புடைய גּור வினையின் குடியிருத்தல் என்ற பொருளையும் இச்சொற்றொடர் தக்கவைக்கிறது.
theological_decisions:
- issue: தடை நாட்டைச் சேர்ந்தவருக்கும் அந்நியக் குடியிருப்பாளருக்கும் பொருந்தும் விதம்
  choice: நாட்டைச் சேர்ந்தவரும் இஸ்ரவேலரிடையே குடியிருக்கும் அந்நியரும் இந்தத் தடைக்குக் கட்டுப்பட்டவர்கள்.
  alternative: இறுதிச் சொற்றொடரை, சமமான பொறுப்பை வலியுறுத்தாமல், கட்டளைக்குக் கட்டுப்பட்ட இரு குழுக்களை வெறுமனே அடையாளப்படுத்தும் இணைப்புச் சொல்லாக வாசிக்கலாம்.
  rationale: எபிரெய வாக்கிய அமைப்பில் הָאֶזְרָח மற்றும் הַגֵּר ஆகிய இரண்டும் தடைசெய்யப்பட்ட செயல்களைச் செய்யக்கூடாதவர்களாக இணையாக நிறுத்தப்படுகின்றன. மொழிபெயர்ப்பு இதை வெளிப்படுத்துகிறது; ஆனால் மூலத்தில் இல்லாத கூடுதல் உடன்படிக்கை விளக்கத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் புரியக்கூடிய, அதேவேளை மோசேயின் சட்டப்பகுதிக்கேற்ற கண்ணியமான சட்டத் தொனி பயன்படுத்தப்பட்டுள்ளது. אַתֶּם என்பதன் அழுத்தம் ‘நீங்களோ’ என்பதால் வெளிப்படுத்தப்பட்டுள்ளது. பட்டியலின் இரு குழுக்களுக்கும் தடை நேரடியாகப் பொருந்துவதைத் தெளிவாக்க இறுதியில் ‘அவற்றைச் செய்யக்கூடாது’ மீண்டும் சொல்லப்பட்டுள்ளது; இது தமிழில் பொருளைத் தெளிவாக்கும் இலக்கண விரிவாக்கம்.
