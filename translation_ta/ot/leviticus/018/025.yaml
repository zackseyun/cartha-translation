base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/025.yaml
  text: So the land became unclean[a], and I punished its iniquity upon it[c][b], and the land vomited out its inhabitants.
translation:
  language: ta
  text: அதனால் அந்த நாடு தீட்டுப்பட்டது[a]; அதன் அக்கிரமத்திற்காக அதைத் தண்டித்தேன்[b]; அந்த நாடு அதில் குடியிருந்தவர்களை வாந்தியெடுத்து வெளியே தள்ளியது[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தீட்டாக்கப்பட்டது.” எபிரெய வினைச்சொல் நாடு தீட்டான நிலைக்கு வந்ததையோ, தீட்டாக்கப்பட்டதையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், “அதன் அக்கிரமத்தை அதன்மேல் விசாரித்தேன்”; இது குற்றத்தை நியாயத்தீர்ப்புக்குக் கொண்டுவந்து தண்டிப்பதைக் குறிக்கும் எபிரெய மொழிவழக்கு.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “கக்கி வெளியே தள்ளியது.” எபிரெயம், நாடு தன்னில் குடியிருந்தவர்களை வெளியேற்றுவதை வாந்தியெடுப்பதாகச் சித்தரிக்கும் வலுவான உருவகத்தைப் பயன்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּטְמָא
  choice: தீட்டுப்பட்டது
  rationale: טמא இங்கு அருவருப்பான செயல்களால் நாடு சடங்கு மற்றும் ஒழுக்கக் களங்கத்திற்கு உள்ளானதைக் குறிக்கிறது. “தீட்டுப்பட்டது” என்பது விளைவை இயல்பாகவும் சூழலுக்கேற்ற இறையியல் கனத்துடனும் தெரிவிக்கிறது.
- source_word: הָאָרֶץ
  choice: அந்த நாடு
  rationale: אֶרֶץ என்பதற்கு ‘பூமி’ அல்லது ‘நாடு’ என்று பொருள் வரலாம்; இச்சூழலில் கானான் நாடே குறிப்பாக இருப்பதால் “அந்த நாடு” துல்லியமானது.
- source_word: וָאֶפְקֹד
  choice: தண்டித்தேன்
  rationale: פקד என்பதன் அடிப்படைப் பொருள் ‘கவனித்தல்/விசாரித்தல்’ என்றாலும், עון உடன் வரும்போது குற்றத்தை நியாயத்தீர்ப்புக்குக் கொண்டுவந்து தண்டிப்பதைக் குறிக்கிறது. “தண்டித்தேன்” அதன் மொழிவழக்குப் பொருளையும் தேவனின் நேரடி செயலையும் தெளிவாக்குகிறது.
- source_word: עֲוֺנָהּ
  choice: அதன் அக்கிரமம்
  rationale: עון அக்கிரமம், குற்றம், அல்லது குற்றத்தால் வரும் தண்டனை ஆகிய பொருட்களைக் கொள்ளலாம். “அக்கிரமம்” இங்கு செயலின் ஒழுக்கக் கனத்தைப் பாதுகாக்கிறது.
- source_word: עָלֶיהָ
  choice: அதை
  rationale: פקד עון על என்ற எபிரெய மொழிவழக்கில், குற்றத்திற்கான தண்டனை எதன்மேல் வருகிறதோ அதை עַל சுட்டுகிறது. இயல்பான தமிழில் “அதன் அக்கிரமத்திற்காக அதைத் தண்டித்தேன்” என வெளிப்படுத்துவது இந்த உறவைத் தெளிவாகக் காட்டுகிறது.
- source_word: וַתָּקִא
  choice: கக்கிப்போட்டது
  rationale: קיא என்பது நேரடியாக ‘வாந்தியெடுத்தல்/கக்குதல்’ என்ற வலுவான சொல்லாகும். “கக்கிப்போட்டது” நாட்டை மனிதர்போல் சித்தரிக்கும் தெளிவான உருவகத்தையும் வலுக்கட்டாய வெளியேற்றத்தையும் காக்கிறது.
- source_word: יֹשְׁבֶיהָ
  choice: தன் குடிமக்கள்
  rationale: ישב என்ற வேரிலுள்ள இப்பெயரெச்ச வடிவம் நாட்டில் குடியிருப்போரைக் கூட்டாகக் குறிக்கிறது. “தன் குடிமக்கள்” சுருக்கமாகவும் இயல்பாகவும் நாட்டுடனான தொடர்பைக் காட்டுகிறது.
theological_decisions:
- issue: தீட்டுக்கு எதிர்வினையாற்றும் நாடாக மனிதர்போல் சித்தரித்தல்
  choice: நாடு தன் குடிமக்களைக் “கக்கிப்போட்டது” என்ற உறுதியான உருவகத்தைத் தக்கவைத்தல்.
  alternative: “நாடு தன் குடிமக்களை வெளியேற்றியது” என்று உருவகத்தை மென்மைப்படுத்துதல்.
  rationale: பாவம், தீட்டு, தேவனுடைய நியாயத்தீர்ப்பு, நாட்டிலிருந்து வெளியேற்றம் ஆகியவற்றின் தொடர்பை எபிரெய உருவகம் திட்டமிட்டே வலியுறுத்துகிறது; அதைத் தக்கவைப்பது உரையின் இறையியல் அழுத்தத்தைப் பாதுகாக்கிறது.
- issue: וָאֶפְקֹד עֲוֺנָהּ עָלֶיהָ என்பதில் தேவனுடைய நியாயத்தீர்ப்பு
  choice: “அதன் அக்கிரமத்திற்காக அதைத் தண்டித்தேன்” என்று நேரடியான தண்டனையாக வெளிப்படுத்துதல்.
  alternative: “அதன் அக்கிரமத்தை அதன்மேல் விசாரித்தேன்” அல்லது “அதன் குற்றத்தை அதற்கு எதிராகக் கணக்குக் கேட்டேன்.”
  rationale: இக்கூற்று நியாயத்தீர்ப்பை நேரடியாக தேவனுக்குரிய செயலாகக் காட்டுகிறது. “தண்டித்தேன்” என்பது எபிரெய மொழிவழக்கின் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது; அதேவேளை அக்கிரமம், குற்றப்பொறுப்பு, தண்டனை ஆகியவற்றை ஒன்றாக்காமல் வைத்திருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. “அக்கிரமம்” ஒழுக்கக் கனத்தைத் தக்கவைக்கிறது; “கக்கிப்போட்டது” திட்டமிட்ட எபிரெய உருவகத்தின் அதிர்ச்சியூட்டும் வலிமையை மென்மைப்படுத்தாமல் வழங்குகிறது. எல்லா அடிக்குறிப்பு குறிகளும் உரையில் வரிசையாக இடம்பெற்றுள்ளன.
