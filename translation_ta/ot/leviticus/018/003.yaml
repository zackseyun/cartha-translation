source:
  edition: WLC
  text: כְּ/מַעֲשֵׂ֧ה אֶֽרֶץ מִצְרַ֛יִם אֲשֶׁ֥ר יְשַׁבְתֶּם בָּ֖/הּ לֹ֣א תַעֲשׂ֑וּ וּ/כְ/מַעֲשֵׂ֣ה אֶֽרֶץ כְּנַ֡עַן אֲשֶׁ֣ר אֲנִי֩ מֵבִ֨יא אֶתְ/כֶ֥ם שָׁ֨מָּ/ה֙ לֹ֣א תַעֲשׂ֔וּ וּ/בְ/חֻקֹּתֵי/הֶ֖ם לֹ֥א תֵלֵֽכוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/003.yaml
  text: You shall not do as they do in the land of Egypt[a], where you lived, and you shall not do as they do in the land of Canaan, where I am bringing you[b]. You shall not walk in their statutes.
translation:
  language: ta
  text: நீங்கள் குடியிருந்த எகிப்து நாட்டில் மக்கள் செய்வதுபோல் செய்யக் கூடாது[a]. நான் உங்களைக் கொண்டுபோகும் கானான் நாட்டில் மக்கள் செய்வதுபோல் செய்யக் கூடாது. அவர்களுடைய நியமங்களின்படி நடக்கக் கூடாது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எழுத்துப்படி, “எகிப்து நாட்டின் செயல்களின்படி… கானான் நாட்டின் செயல்களின்படி.” இங்கு “செயல்கள்” என்பது அந்நாட்டு மக்களின் நடைமுறைகளைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவர்களுடைய வழக்கங்கள் அல்லது சட்டதிட்டங்களைப் பின்பற்றக் கூடாது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּמַעֲשֵׂה
  choice: மக்கள் செய்வதுபோல்
  rationale: எபிரெயச் சொற்றொடர் எழுத்துப்படி ‘நாட்டின் செயலின்படி’ என்கிறது. தமிழில் அதன் உண்மையான குறிப்பு அந்த நாட்டின் மக்களுடைய நடைமுறைகள் என்பதால், இயல்பாகவும் தெளிவாகவும் ‘மக்கள் செய்வதுபோல்’ என்று மொழிபெயர்க்கப்பட்டது; மாற்று எழுத்துப்படியான வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אֶרֶץ מִצְרַיִם / אֶרֶץ כְּנַעַן
  choice: எகிப்து நாடு / கானான் நாடு
  rationale: இரு இடங்களிலும் வரும் אֶרֶץ என்பதன் நிலப்பரப்பு சார்ந்த வலியுறுத்தலை ‘நாடு’ என்பது இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: אֲשֶׁר יְשַׁבְתֶּם בָּהּ
  choice: நீங்கள் குடியிருந்த
  rationale: யிஸ்ரவேலர் முன்பு எகிப்தில் வசித்ததைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது; நிறைவுற்ற வினையின் பொருளையும் காக்கிறது.
- source_word: לֹא תַעֲשׂוּ
  choice: செய்யக் கூடாது
  rationale: சட்டப் பின்னணியிலுள்ள எதிர்மறைக் கட்டளையை நவீனத் தமிழில் நேரடியாகவும் கண்ணியமாகவும் வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר אֲנִי מֵבִיא אֶתְכֶם שָׁמָּה
  choice: நான் உங்களைக் கொண்டுபோகிற
  rationale: מֵבִיא என்னும் பங்கேற்பு வினையின் நிகழ்கால/நெருங்கிய எதிர்கால இயக்கத்தையும், கடவுளே அவர்களை இலக்கிடத்துக்குக் கொண்டுசெல்வதையும் காக்கிறது.
- source_word: וּבְחֻקֹּתֵיהֶם
  choice: அவர்களுடைய நியமங்களின்படி
  rationale: חֻקּוֹת என்பது சட்டங்கள், நிர்ணயிக்கப்பட்ட ஒழுங்குகள், வழக்கங்கள் ஆகிய பொருள் வரம்பைக் கொண்டது. ‘நியமங்கள்’ அதன் கட்டுப்படுத்தும் தன்மையைத் தக்கவைத்தபடியே தமிழில் இயல்பாக உள்ளது.
- source_word: לֹא תֵלֵכוּ
  choice: நடக்கக் கூடாது
  rationale: ‘நடத்தல்’ என்ற மூல உருவகத்தைத் தமிழிலும் காக்கிறது; ‘நியமங்களின்படி நடப்பது’ என்பது வாழ்க்கை நடத்தையை இயல்பாகக் குறிக்கிறது.
theological_decisions:
- issue: தடை செய்யப்படுவது நாடு என்னும் நிலப்பரப்பின் ‘செயல்களா’ அல்லது அந்நாட்டு மக்களின் நடைமுறைகளா?
  choice: எகிப்து/கானான் நாட்டில் மக்கள் செய்வதுபோல்
  alternative: எகிப்து/கானான் நாட்டின் செயல்களின்படி
  rationale: எபிரெய மொழிப்பாங்கு செயல்களை ‘நாட்டுக்கு’ உரியவையாகக் கூறினாலும், குறிப்பு அங்கு வாழும் மக்களின் நடத்தையே. ‘மக்கள்’ என்பதை வெளிப்படுத்துவது புதிய கருத்தைச் சேர்க்காமல் தமிழில் தவறான புரிதலைத் தவிர்க்கிறது; மூலத்தின் வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: חֻקֹּתֵיהֶם என்பதை ‘வழக்கங்கள்’ என்றா, ‘நியமங்கள்’ என்றா மொழிபெயர்ப்பது?
  choice: நியமங்கள்
  alternative: வழக்கங்கள் / சட்டதிட்டங்கள்
  rationale: சுற்றியுள்ள சட்டப் பின்னணியிலும் ஆண்டவரின் நியமங்களுடனான எதிர்மறை ஒப்பீட்டிலும் அதன் கட்டுப்படுத்தும் வலிமையை ‘நியமங்கள்’ நன்றாகக் காக்கிறது. அதேவேளை ‘வழக்கங்கள்’ என்ற சாத்திய பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சட்டக் கட்டளைக்கேற்ற கண்ணியமான நேரடி நடை பயன்படுத்தப்பட்டுள்ளது. இரு நாட்டுக் குறிப்புகளின் இணை அமைப்பு காக்கப்பட்டுள்ளது. ‘நடக்க’ என்பது மூலத்தின் வாழ்க்கை-நடத்தை உருவகத்தைத் தக்கவைக்கிறது; ‘மக்கள்’ என்பது எபிரெய மொழிப்பாங்கில் மறைமுகமாக உள்ள குடியிருப்பவர்களைத் தெளிவாக்குகிறது.
