revisions:
- from: நீங்கள் குடியிருந்த எகிப்து நாட்டில் மக்கள் செய்வதுபோல் நீங்களும் செய்யக் கூடாது[a]. நான் உங்களைக் கொண்டுபோகிற கானான் நாட்டில் மக்கள் செய்வதுபோலும் செய்யக் கூடாது. அவர்களுடைய நியமங்களின்படி நடக்கக் கூடாது[b].
