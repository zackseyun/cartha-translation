source:
  edition: WLC
  text: דַּבֵּר֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אָמַרְתָּ֖ אֲלֵ/הֶ֑ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/002.yaml
  text: Speak to the sons of Israel and say to them[b][a], ‘I am Yahweh your God.’
translation:
  language: ta
  text: இஸ்ரவேலின் மகன்களிடம்[a] பேசு; அவர்களிடம், ‘நான் யாவே[b], உங்கள் கடவுள்’ என்று சொல்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இஸ்ரவேலின் பிள்ளைகள்” அல்லது “இஸ்ரவேலர்” என்றும் மொழிபெயர்க்கலாம். எபிரேயத்தில் சொல்லுக்குச் சொல் “இஸ்ரவேலின் மகன்கள்”; இது இஸ்ரவேல் மக்களைக் குறிக்கும் குடும்ப உறவையும் உடன்படிக்கையையும் உணர்த்தும் சொற்றொடர்.
    reason: lexical_alternative
  - marker: b
    text: எபிரேயத்தில் YHWH; மரபாக “கர்த்தர்” என மொழிபெயர்க்கப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: דַּבֵּר
  choice: பேசி
  rationale: דבר என்பதன் கட்டளை வடிவம் மோசே இஸ்ரவேல் மக்களிடம் நேரடியாகப் பேச வேண்டும் என்பதைக் குறிக்கிறது. தொடரும் ‘சொல்’ என்பதோடு இயல்பாக இணைவதற்காகத் தமிழ் வினையெச்ச வடிவம் பயன்படுத்தப்பட்டது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரேயக் குடும்பவழிச் சொல்லாட்சியான ‘இஸ்ரவேலின் மகன்கள்’ என்பதைக் காத்து, அது உடன்படிக்கை மக்களை ஒட்டுமொத்தமாகக் குறிப்பதை அடிக்குறிப்பு விளக்குகிறது.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: அவர்களிடம் … என்று சொல்
  rationale: எபிரேயத்தின் நேரடியான கட்டளைத் தொடரையும் மேற்கோள் அமைப்பையும் இயல்பான தமிழில் பிரதிபலிக்கிறது.
- source_word: אֲנִי
  choice: நான்
  rationale: தனித்து நிற்கும் முதலாம் நபர் சுட்டுப்பெயர், அடையாள அறிவிப்பாக இயல்பாக மொழிபெயர்க்கப்பட்டது; மூலத்தில் இல்லாத அழுத்தத்தைச் சேர்க்கக்கூடிய ‘நானே’ தவிர்க்கப்பட்டது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தேவனுடைய தனிப்பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரிந்துகொள்ளக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֱלֹהֵיכֶם
  choice: உங்கள் கடவுள்
  rationale: இங்கு אֱלֹהִים ஒருமைப் பொருளில் யாவேவைக் குறிக்கிறது; இரண்டாம் நபர் ஆண்பால் பன்மை பின்னொட்டு தமிழில் பாலின வேறுபாடில்லாத ‘உங்கள்’ என இயல்பாக வருகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல எபிரேய உரை இறைவனின் தனிப்பெயரை நேரடியாகக் கொண்டுள்ளது. எனவே அதை ஒரு பட்டத்தால் மாற்றாமல் ஒலிபெயர்த்து, மரபுவழி மாற்றீட்டை அடிக்குறிப்பில் தருகிறது.
- issue: בְּנֵי יִשְׂרָאֵל என்ற உடன்படிக்கைச் சொல்லாட்சி
  choice: இஸ்ரவேலின் மகன்கள்
  alternative: இஸ்ரவேலின் பிள்ளைகள் / இஸ்ரவேலர்
  rationale: மூலத்தின் ஆண்பால் பன்மை குடும்பச் சொல்லாட்சியை முதன்மை உரையில் காக்கிறது; அதே நேரத்தில் அது இஸ்ரவேல் மக்களை ஒட்டுமொத்தமாகக் குறிக்கும் பரந்த பொருளை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- issue: אֲנִי என்பதில் வலியுறுத்தல்
  choice: நான்
  alternative: நானே
  rationale: தனிப்பட்ட சுட்டுப்பெயர் அடையாள அறிவிப்புக்கு ஓரளவு முன்னிலையைக் கொடுத்தாலும், விலக்குக் கருத்துடைய வலியுறுத்தலை கட்டாயப்படுத்தாது. ஆகவே மூலத்தின் சாத்தியமான நுணுக்கத்தை மிகைப்படுத்தாமல் ‘நான்’ என வழங்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘பேசி … சொல்’ என்ற அமைப்பு எபிரேயக் கட்டளைத் தொடரைக் காக்கிறது; தமிழ் மேற்கோள் இலக்கணத்திற்காக ‘என்று’ சேர்க்கப்பட்டுள்ளது.
