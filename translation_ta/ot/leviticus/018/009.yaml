revisions:
- from: உன் சகோதரியின் நிர்வாணத்தை வெளிப்படுத்தாதே; அவள் உன் தகப்பனுடைய மகளாக இருந்தாலும், உன் தாயுடைய மகளாக இருந்தாலும், வீட்டில் பிறந்தவளாக இருந்தாலும், வெளியே பிறந்தவளாக இருந்தாலும் சரி.[a]
  to: உன் சகோதரியின் நிர்வாணத்தை வெளிப்படுத்தாதே; அவள் உன் தந்தையின் மகளாக இருந்தாலும், உன் தாயின் மகளாக இருந்தாலும், வீட்டில் பிறந்தவளாக இருந்தாலும், வெளியே பிறந்தவளாக இருந்தாலும்.
  rationale: The revision is limited to modernizing the paternal kinship expression and smoothing the formal legal cadence. It retains the source’s classification of the sister, the house/outside ambiguity, and the Hebrew sexual-law idiom. The footnote remains anchored to the house/outside expression and preserves the lexical alternative without imposing a narrower interpretation.
  reviewer_model: gpt-5.6-terra
