source:
  edition: WLC
  text: עֶרְוַ֨ת אֲחֽוֹתְ/ךָ֤ בַת אָבִ֨י/ךָ֙ א֣וֹ בַת אִמֶּ֔/ךָ מוֹלֶ֣דֶת בַּ֔יִת א֖וֹ מוֹלֶ֣דֶת ח֑וּץ לֹ֥א תְגַלֶּ֖ה עֶרְוָתָֽ/ן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/009.yaml
  text: You shall not uncover the nakedness of your sister[a], whether your father's daughter or your mother's daughter, born in the household or born outside it.
translation:
  language: ta
  text: உன் சகோதரியின் நிர்வாணத்தை வெளிப்படுத்தாதே; அவள் உன் தந்தையின் மகளாக இருந்தாலும், உன் தாயின் மகளாக இருந்தாலும், வீட்டில் பிறந்தவளாக இருந்தாலும், வெளியே பிறந்தவளாக இருந்தாலும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֶרְוַת / עֶרְוָתָן
  choice: நிர்வாணத்தை
  rationale: லேவியராகமம் 18-இன் சட்ட மொழியில் இது தடைசெய்யப்பட்ட பாலுறவைக் குறிக்கும் நிலையான சொற்றொடரின் பகுதி. ‘நிர்வாணத்தை வெளிப்படுத்துதல்’ என்ற வடிவம் எபிரேய உருவகத்தையும் சட்டப்பூர்வத் தன்மையையும் காக்கிறது.
- source_word: אֲחוֹתְךָ
  choice: உன் சகோதரி
  rationale: ஆண் ஒருவனை ஒருமையில் நேரடியாகக் குறிக்கும் மூலத்தின் உறவுமுறைச் சொல்லைத் துல்லியமாகப் பாதுகாக்கிறது.
- source_word: בַת אָבִיךָ / בַת אִמֶּךָ
  choice: உன் தகப்பனுடைய மகள் / உன் தாயுடைய மகள்
  rationale: தந்தைவழி அல்லது தாய்வழிச் சகோதரி என்ற சட்டப்பூர்வ விரிவை இணை அமைப்புடன் தெளிவாகக் காட்டுகிறது.
- source_word: מוֹלֶדֶת
  choice: பிறந்தவள்
  rationale: பெண்ணைக் குறிக்கும் சூழலுக்கு ஏற்ற இயல்பான தமிழ் வடிவம்; பிறப்பு அல்லது குடும்பத் தோற்றத்தைச் சுட்டுகிறது.
- source_word: בַּיִת / חוּץ
  choice: வீட்டில் / வெளியே
  rationale: எபிரேயத்தில் உள்ள ‘வீடு—வெளி’ எதிரிணையை நேரடியாகக் காக்கிறது; ‘வீடு’ என்பது கட்டிடத்தையோ குடும்பச் சூழலையோ குறிக்கக்கூடிய உண்மையான தெளிவின்மையை அடிக்குறிப்பு விளக்குகிறது.
- source_word: לֹא תְגַלֶּה
  choice: வெளிப்படுத்தாதே
  rationale: ஒருமை ஆண்பால் முகவரியையும் நேரடி சட்டத் தடையின் வலிமையையும் இயல்பான நவீன தமிழில் தருகிறது.
- source_word: אוֹ ... אוֹ
  choice: இருந்தாலும் ... இருந்தாலும்
  rationale: பட்டியலிடப்பட்ட மாற்று நிலைகள் அனைத்திலும் தடை பொருந்துவதை இயல்பான தமிழ் தொடரமைப்பில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: தடைசெய்யப்பட்ட உறவின் வரம்பு
  choice: தந்தையின் மகளாகவோ தாயின் மகளாகவோ உள்ள சகோதரி, வீட்டில் பிறந்தவளாகவோ வெளியே பிறந்தவளாகவோ இருந்தாலும், தடை பொருந்துகிறது.
  alternative: இறுதி சொற்றொடர் முழுச் சகோதரி மற்றும் ஒன்றுவிட்ட சகோதரி என்பதையோ, வீட்டுக்குள் மற்றும் வீட்டுக்கு வெளியே பிறந்தவர்களையோ வேறுபடுத்துவதாகப் புரிந்துகொள்ளலாம்.
  rationale: எபிரேயச் சட்ட வடிவம் ‘உன் சகோதரி’ என்ற வகையைச் சுருக்காமல் விரிவுபடுத்துகிறது. பின்னாளைய சட்ட வேறுபாடுகளை வசனத்துக்குள் சேர்க்காமல் அதன் பரந்த வரம்பையும் ‘வீடு—வெளி’ என்ற தெளிவின்மையையும் மொழிபெயர்ப்பு காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான சட்ட நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘நிர்வாணத்தை வெளிப்படுத்துதல்’ என்ற எபிரேயச் சட்ட மரபுத்தொடர் பாதுகாக்கப்பட்டுள்ளது; ‘வீட்டில்/வெளியே’ என்பதன் சாத்தியமான குடும்பச் சூழல் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
