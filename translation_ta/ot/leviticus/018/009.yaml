review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the Hebrew legal prohibition, the direct singular address, the inclusive alternatives of paternal or maternal sister, and the deliberately broad contrast of birth ‘in the house’ and ‘outside.’ The idiom ‘நிர்வாணத்தை வெளிப்படுத்தாதே’ appropriately retains the established Levitical legal idiom without reducing it to a mere statement about shame.
  naturalness: The wording is clear and suitably formal. Replacing ‘தகப்பனுடைய’ with ‘தந்தையின்’ better fits modern standard Tamil while retaining the legal-family register. Removing the somewhat colloquial emphatic ‘சரி’ gives the list a smoother legislative cadence.
  terminology: ‘சகோதரி,’ ‘நிர்வாணம்,’ and ‘வெளிப்படுத்தாதே’ are appropriate and consistent with the source’s kinship terminology and legal idiom. ‘தந்தை’ is preferred over the more traditional/colloquial ‘தகப்பன்’ for the requested modern standard variant.
  issues:
  - severity: low
    issue: Register of ‘தகப்பனுடைய’
    rationale: Although understandable, ‘தகப்பனுடைய’ is less natural in modern standard Tamil than ‘தந்தையின்.’ This is a stylistic/register correction only and does not affect meaning.
  - severity: low
    issue: Concessive emphasis ‘இருந்தாலும் சரி’
    rationale: The final ‘சரி’ is not wrong, but it is slightly colloquial and unnecessary in a legal list. Omitting it produces a more natural formal rendering while retaining the inclusive force of the Hebrew alternatives.
  revised_text: உன் சகோதரியின் நிர்வாணத்தை வெளிப்படுத்தாதே; அவள் உன் தந்தையின் மகளாக இருந்தாலும், உன் தாயின் மகளாக இருந்தாலும், வீட்டில் பிறந்தவளாக இருந்தாலும், வெளியே பிறந்தவளாக இருந்தாலும்.
  revised_footnotes:
