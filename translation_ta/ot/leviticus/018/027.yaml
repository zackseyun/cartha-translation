  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: כִּ֚י אֶת כָּל הַ/תּוֹעֵבֹ֣ת הָ/אֵ֔ל עָשׂ֥וּ אַנְשֵֽׁי הָ/אָ֖רֶץ אֲשֶׁ֣ר לִ/פְנֵי/כֶ֑ם וַ/תִּטְמָ֖א הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/027.yaml
  text: For the men of the land who were before you did all these abominations[a], and the land became unclean.
translation:
  language: ta
  text: ஏனெனில், உங்களுக்கு முன்பு அந்த நாட்டில் வாழ்ந்த மனிதர்கள் இந்த அருவருப்பான செயல்கள் அனைத்தையும் செய்தார்கள்; அந்த நாடு அசுத்தமடைந்தது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்த நாடு தீட்டுப்பட்டது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய எச்சரிப்புக்கான காரணத்தை அறிமுகப்படுத்தும் இணைப்புச் சொல்லின் விளக்க வலிமையை இயல்பான தமிழில் காக்கிறது.
- source_word: כָּל הַתּוֹעֵבֹת הָאֵל
  choice: அருவருப்பான இந்தச் செயல்கள் அனைத்தையும்
  rationale: תּוֹעֵבָה என்பதன் கடுமையான ஒழுக்க மற்றும் உடன்படிக்கைச் சார்ந்த அருவருப்பு உணர்வைக் காக்கிறது; செயல்கள் என்பது தமிழில் ‘செய்தார்கள்’ என்ற வினையுடன் இயல்பாக அமைகிறது.
- source_word: עָשׂוּ
  choice: செய்தார்கள்
  rationale: עשה என்பதன் பொதுவான ‘செய்’ என்ற பொருளை நேரடியாகத் தருகிறது; தேவையற்ற சட்ட அல்லது சடங்கு நுணுக்கத்தைச் சேர்ப்பதில்லை.
- source_word: אַנְשֵׁי הָאָרֶץ
  choice: அந்த நாட்டில் வாழ்ந்தவர்கள்
  rationale: எபிரெயச் சொற்றொடர் வடிவில் ‘நாட்டின் மனிதர்கள்’ என்றாலும், இங்கு முந்தைய குடியிருப்பாளர்களைக் கூட்டாகக் குறிக்கிறது. ‘வாழ்ந்தவர்கள்’ என்பது பாலினத்தைத் தேவையின்றி விரிவாக்காமலும், தமிழில் இயல்பாகவும் அந்தக் கூட்டுப் பொருளைத் தருகிறது.
- source_word: אֲשֶׁר לִפְנֵיכֶם
  choice: உங்களுக்கு முன்பு
  rationale: இஸ்ரவேலருக்கு முன்பு அந்நாட்டில் இருந்தவர்களைக் குறிக்கும் காலத் தொடர்பைச் சுருக்கமாகவும் தெளிவாகவும் தருகிறது.
- source_word: וַתִּטְמָא
  choice: அசுத்தமடைந்தது
  rationale: טמא வினையின் நிலைமாற்றம் மற்றும் விளைவு ஆகிய இரண்டையும் வெளிப்படுத்துகிறது; அசுத்தம் சடங்குசார் மட்டுமா அல்லது ஒழுக்க உருவகமா என்பதைத் தீர்மானிக்காமல் விடுகிறது.
- source_word: הָאָרֶץ
  choice: அந்த நாடு
  rationale: இங்கு உலகம் முழுவதையும் அல்ல, இஸ்ரவேலருக்கு முன் பிறர் குடியிருந்த குறிப்பிட்ட நிலப்பகுதியையே குறிக்கிறது.
theological_decisions:
- issue: நாட்டின் அசுத்தத்தின் இயல்பு
  choice: அந்த நாடு அசுத்தமடைந்தது
  alternative: அந்த நாடு தீட்டுப்பட்டது
  rationale: முந்தைய குடியிருப்பாளர்களின் செயல்களால் நாடு அசுத்தமாக்கப்பட்டது என்ற மனிதப் பாவத்திற்கும் நாட்டின் அசுத்தத்திற்கும் இடையிலான தொடர்பைக் காக்கிறது; இதை முற்றிலும் சடங்குசார் அல்லது முற்றிலும் உருவகமானதாகக் குறுக்குவதில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘அருவருப்பான செயல்கள்’ என்பது மூலத்தின் வலிமையைப் பேணுகிறது; ‘அசுத்தமடைந்தது’ என்பது இயல்பான தமிழில் நிலைமாற்றத்தைக் காட்டுகிறது.
