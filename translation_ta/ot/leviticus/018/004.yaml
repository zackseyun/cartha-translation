- from: என் நியாயத்தீர்ப்புகளை நீங்கள் கடைப்பிடிக்க வேண்டும்; என் சட்டங்களைக் கைக்கொண்டு, அவற்றின்படி நடக்க வேண்டும்.[a] நான் உங்கள் கடவுளாகிய யாவே.
  to: என் நியாயத்தீர்ப்புகளை நீங்கள் கடைப்பிடிக்க வேண்டும்; என் சட்டங்களைக் கைக்கொள்ள வேண்டும்; அவற்றின்படி நடக்க வேண்டும்.[a] நான் யாவே, உங்கள் கடவுள்.
