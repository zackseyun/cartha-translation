source:
  edition: WLC
  text: אֶת מִשְׁפָּטַ֧/י תַּעֲשׂ֛וּ וְ/אֶת חֻקֹּתַ֥/י תִּשְׁמְר֖וּ לָ/לֶ֣כֶת בָּ/הֶ֑ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/004.yaml
  text: You shall do my judgments[a], and you shall keep my statutes, to walk in them. I am Yahweh your God.
translation:
  language: ta
  text: என் நியாயத்தீர்ப்புகளை நீங்கள் கடைப்பிடிக்க வேண்டும்; என் சட்டங்களைக் கைக்கொள்ள வேண்டும்; அவற்றின்படி நடக்க வேண்டும்.[a] நான் யாவே, உங்கள் கடவுள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவற்றின்படி வாழ வேண்டும்.” எபிரெய மொழியில் நேரடியாக “அவற்றில் நடக்க” என்று உள்ளது; கடவுளுடைய கட்டளைகளுக்கு ஏற்ப ஒருவர் தமது வாழ்க்கையை நடத்துவதை இது குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפָּטַי
  choice: என் நியாயத்தீர்ப்புகள்
  rationale: சட்டம் சார்ந்த தீர்ப்புகள் அல்லது ஒழுங்குமுறைகள் என்ற பொருளைத் தக்கவைத்து, חֻקֹּתַי என்பதிலிருந்து வேறுபடுத்துகிறது.
- source_word: תַּעֲשׂוּ
  choice: கடைப்பிடிக்க வேண்டும்
  rationale: עשה என்பதன் அடிப்படைப் பொருள் ‘செய்’; சட்டச் சூழலில், கட்டளைகளை நடைமுறையில் செயல்படுத்துவதை இயல்பான தமிழில் ‘கடைப்பிடிக்க’ தெரிவிக்கிறது.
- source_word: חֻקֹּתַי
  choice: என் சட்டங்கள்
  rationale: விதிக்கப்பட்ட நிலையான சட்டங்கள் அல்லது நியமங்கள் என்ற பொருளை நவீன, எளிதில் புரியும் தமிழில் தருகிறது.
- source_word: תִּשְׁמְרוּ
  choice: கைக்கொண்டு
  rationale: שׁמר என்பதிலுள்ள கவனமாகக் காத்துக் கடைப்பிடிக்கும் உடன்படிக்கைச் சார்ந்த கருத்தைத் தெரிவிக்கிறது.
- source_word: לָלֶכֶת בָּהֶם
  choice: அவற்றின்படி நடக்க
  rationale: வாழ்க்கை நடத்தையைக் குறிக்கும் ‘நடத்தல்’ உருவகத்தைத் தக்கவைத்தபடி, தமிழில் பொருள் தெளிவாக இருக்க ‘அவற்றின்படி’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரிந்துகொள்ளக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֱלֹהֵיכֶם
  choice: உங்கள் கடவுள்
  rationale: இரண்டாம் நபர் பன்மை உடைமைப் பின்னொட்டைக் கொண்ட வடிவத்தின் நேரடியான பொருளைத் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக இருப்பதால், அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: לָלֶכֶת בָּהֶם என்பதன் பொருள்
  choice: அவற்றின்படி நடக்க
  alternative: அவற்றின்படி வாழ
  rationale: கடவுளுடைய கட்டளைகளுக்கு ஏற்ப வாழ்க்கையை நடத்துவதைக் குறிக்கும் எபிரெய உருவகத்தை முதன்மை உரையில் தக்கவைக்கிறது; ‘வாழ’ என்ற விளக்கப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான சட்ட மற்றும் உடன்படிக்கை நடையைப் பேணுகிறது. ‘நியாயத்தீர்ப்புகள்’ மற்றும் ‘சட்டங்கள்’ என்ற இரு சொற்களையும் வேறுபடுத்தி, எபிரெயச் சொல் இணையின் தனித்தன்மையைத் தக்கவைக்கிறது.
