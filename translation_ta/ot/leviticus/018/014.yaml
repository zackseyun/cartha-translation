id: LEV.18.14
reference: Leviticus 18:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: עֶרְוַ֥ת אֲחִֽי אָבִ֖י/ךָ לֹ֣א תְגַלֵּ֑ה אֶל אִשְׁתּ/וֹ֙ לֹ֣א תִקְרָ֔ב דֹּדָֽתְ/ךָ֖ הִֽוא־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/014.yaml
  text: You shall not uncover the nakedness of your father's brother; you shall not approach his wife[a]. She is your aunt.
translation:
  language: ta
  text: உன் தந்தையின் சகோதரனுடைய நிர்வாணத்தை வெளிப்படுத்தாதே; அவருடைய மனைவியை நெருங்காதே[a]. அவள் உன் அத்தை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘நெருங்கு’; இச்சூழலில் உறவினரிடையிலான பாலுறவைத் தடைசெய்யும் சட்டச் சொற்றொடராக இது பாலியல் பொருள் கொண்டது.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת
  choice: நிர்வாணத்தை
  rationale: லேவியராகமம் 18 முழுவதிலும் வரும் ‘நிர்வாணத்தை வெளிப்படுத்துதல்’ என்ற சட்ட மொழிநடையைப் பாதுகாக்கிறது; சூழலில் இது தடைசெய்யப்பட்ட பாலுறவைக் குறிக்கும் இடக்கரடக்கல்.
- source_word: אֲחִי אָבִיךָ
  choice: உன் தந்தையின் சகோதரன்
  rationale: எபிரெயச் சொற்றொடரின் உறவுமுறைத் துல்லியத்தை நேரடியாகக் காட்டுகிறது; மூத்தவர் அல்லது இளையவர் என்று மூலத்தில் இல்லாத வேறுபாட்டைச் சேர்ப்பதில்லை.
- source_word: לֹא תְגַלֵּה
  choice: வெளிப்படுத்தாதே
  rationale: גלה என்பதன் பியேல் வடிவத்தையும் அதிகாரத்தின் தொடர்ச்சியான தடைச் சட்ட நடையையும் பிரதிபலிக்கிறது.
- source_word: אֶל אִשְׁתּוֹ לֹא תִקְרָב
  choice: அவருடைய மனைவியை நெருங்காதே
  rationale: קרב என்ற கட்டுப்படுத்தப்பட்ட ‘நெருங்குதல்’ சொல்லைத் தக்கவைக்கிறது; இச்சூழலில் அதன் பாலியல் பொருள் அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
- source_word: דֹּדָתְךָ
  choice: உன் அத்தை
  rationale: மூலம் பயன்படுத்தும் சுருக்கமான உறவுமுறைப் பெயரை வழங்குகிறது; முந்தைய பகுதி இங்கு தந்தையின் சகோதரனுடைய மனைவியே குறிக்கப்படுகிறார் என்பதைத் தெளிவாக்குகிறது.
- source_word: הִוא
  choice: அவள்
  rationale: எபிரெயப் பெண்பால் ஒருமைச் சுட்டுப்பெயரின் நேரடியான இயல்பான தமிழாக்கம்; ‘ஏனெனில்’ போன்ற விளக்க இணைப்பை மூலத்திற்கு மேலாகச் சேர்க்கவில்லை.
theological_decisions:
- issue: உறவுமுறை சார்ந்த பாலியல் தடையைச் சொல்லும் இடக்கரடக்கலை மொழிபெயர்த்தல்
  choice: ‘நிர்வாணத்தை வெளிப்படுத்தாதே’ என்ற சட்டச் சொற்றொடரை முதன்மை உரையில் தக்கவைத்தல்
  alternative: ‘பாலுறவு கொள்ளாதே’ என்று பொருளை நேரடியாக விளக்குதல்
  rationale: மூலத்தின் தொடர்ச்சியான சட்டச் சூத்திரத்தையும் அதன் திட்டமிட்ட இடக்கரடக்கலையும் பாதுகாக்கிறது; அதேவேளை சூழலும் அடிக்குறிப்பும் பாலியல் பொருளை உணர்த்துகின்றன.
- issue: דֹּדָתְךָ என்ற உறவுமுறைப் பெயரின் அடையாளம்
  choice: ‘அவள் உன் அத்தை’
  alternative: ‘அவள் உன் தந்தையின் சகோதரனுடைய மனைவி’ என்று மீண்டும் முழுமையாகக் கூறுதல்
  rationale: எபிரெயம் இறுதியில் பொதுவான உறவுமுறைப் பெயரையே பயன்படுத்துகிறது; முந்தைய வாக்கியக்கூறு அந்த உறவின் துல்லியத்தை ஏற்கெனவே அளிக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், கண்ணியமான சட்டத் தொனியுடன் மொழிபெயர்க்கப்பட்டது. ‘தந்தையின் சகோதரன்’ என்பது மூத்த/இளைய சகோதரன் என்ற மூலத்தில் இல்லாத வேறுபாட்டைத் தவிர்க்கிறது. மரியாதை வழக்குக்கு ஏற்ப ‘அவருடைய’ பயன்படுத்தப்பட்டுள்ளது; இறுதி வாக்கியத்தில் மூலத்தின் பெண்பால் ஒருமைச் சுட்டைத் தக்கவைக்க ‘அவள்’ உள்ளது.
