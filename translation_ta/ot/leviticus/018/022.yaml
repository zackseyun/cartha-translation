  text: וְ/אֶ֨ת זָכָ֔ר לֹ֥א תִשְׁכַּ֖ב מִשְׁכְּבֵ֣י אִשָּׁ֑ה תּוֹעֵבָ֖ה הִֽוא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/022.yaml
  text: You shall not lie with a male as with a woman[a]; it is an abomination.
translation:
  language: ta
  text: பெண்ணோடு படுப்பதுபோல் ஓர் ஆணோடு படுக்காதே[a]; அது அருவருப்புக்குரியது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், ‘பெண்ணின் படுக்கைகள்’; இது ஒரு பெண்ணுடன் பாலுறவு கொள்வதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכָר
  choice: ஓர் ஆண்
  rationale: זָכָר என்பது ஆண்பாலினரைக் குறிக்கிறது; எபிரெயச் சொல்லில் இல்லாத வயது வரம்பைச் சேர்க்காமல், தமிழில் இயல்பாகவும் நேரடியாகவும் ‘ஓர் ஆண்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: תִשְׁכַּב
  choice: படுக்காதே
  rationale: שׁכב இங்கு பாலுறவைக் குறிக்கும் மரபுத்தொடராக வருகிறது. ‘படுக்காதே’ என்பது மூலத்தின் உருவகத்தைத் தக்கவைத்தபடியே இச்சூழலில் பொருளை உணர்த்துகிறது.
- source_word: מִשְׁכְּבֵי אִשָּׁה
  choice: பெண்ணோடு படுப்பதுபோல்
  rationale: சொல்லுக்குச் சொல் ‘ஒரு பெண்ணின் படுக்கைகள்’ எனும் பன்மைக் கட்டமைப்பு, ஒரு பெண்ணுடன் பாலுறவு கொள்வதைக் குறிக்கும் எபிரெய மரபுத்தொடர். அதன் ஒப்பீட்டையும் பொருளையும் இயல்பான தமிழில் இவ்வாறு தருகிறது.
- source_word: תּוֹעֵבָה
  choice: அருவருப்புக்குரியது
  rationale: இச்சொல் பரிசுத்தச் சட்டத் தொகுப்பில் வெறுக்கத்தக்கதாகவும் ஏற்கத்தகாததாகவும் கருதப்படுவதை வலுவாகக் குறிக்கிறது; ‘அருவருப்புக்குரியது’ அதன் தீவிரத்தைக் காக்கிறது.
- source_word: הִוא
  choice: அது
  rationale: பெண்பால் ஒருமைப் பதிலிப்பெயர் முன் தடைசெய்யப்பட்ட செயலைச் சுட்டுகிறது; தமிழில் இயல்பாக ‘அது’ என வழங்கப்படுகிறது.
theological_decisions:
- issue: பரிசுத்தச் சட்டத் தொகுப்பின் சூழலில் தடையின் இயல்பு
  choice: ஒரு பெண்ணோடு படுப்பதுபோல் ஓர் ஆணோடு படுப்பதை நேரடியாகத் தடைசெய்வதாக மொழிபெயர்க்கப்பட்டது.
  alternative: மூலத்தில் குறிப்பிடப்படாத வழிபாட்டுச் சடங்கு அல்லது சுரண்டல் சார்ந்த குறிப்பிட்ட செயல்களுக்கு மட்டும் தடையை வரையறுத்தல்.
  rationale: எபிரெய உரை எந்தக் கட்டுப்படுத்தும் அடைமொழியுமின்றி ஓர் ஆணோடு ‘பெண்ணின் படுக்கைகளாக’ படுப்பதைத் தடைசெய்து, அச்செயலை תּוֹעֵבָה எனக் கூறுகிறது. ஆகவே உரையில் இல்லாத வரையறையையோ விரிவாக்கத்தையோ மொழிபெயர்ப்பில் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டக் கட்டளைக்கேற்ற நேரடியான ஒருமைத் தடை வடிவம் பயன்படுத்தப்பட்டுள்ளது. ‘படுக்காதே’ மூலத்தின் மரபுத்தொடரைத் தக்கவைக்கிறது; அடிக்குறிப்பு அதன் பாலுறவுப் பொருளைத் தெளிவுபடுத்துகிறது.
