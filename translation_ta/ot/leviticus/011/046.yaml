  source_fidelity: 'The Tamil accurately renders the Hebrew’s four coordinated categories: livestock/land animals, birds, every living creature moving in the waters, and every creature swarming on the land. It preserves the distinct motion verbs רמש (“move”) and שרץ (“swarm/teem”) without importing a theological sense into נֶפֶשׁ.'
