  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: זֹ֣את תּוֹרַ֤ת הַ/בְּהֵמָה֙ וְ/הָ/ע֔וֹף וְ/כֹל֙ נֶ֣פֶשׁ הַֽ/חַיָּ֔ה הָ/רֹמֶ֖שֶׂת בַּ/מָּ֑יִם וּ/לְ/כָל נֶ֖פֶשׁ הַ/שֹּׁרֶ֥צֶת עַל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/046.yaml
  text: This is the law concerning the livestock[a], the birds, every living creature that moves in the waters[c][b], and every creature that swarms on the earth.
translation:
  language: ta
  text: இது கால்நடைகள், பறவைகள், நீரில் அசையும் ஒவ்வோர் உயிரினம், நிலத்தில் திரளாகச் செல்லும் ஒவ்வோர் உயிரினம் ஆகியவற்றைக் குறித்த சட்டம்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சட்டம்” என்பதற்குப் பதிலாக “அறிவுறுத்தல்” என்றும் மொழிபெயர்க்கலாம்; תּוֹרָה என்ற எபிரெயச் சொல் சட்டத்தை மட்டுமல்ல, அதிகாரமுள்ள போதனையையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרַת
  choice: குறித்த சட்டம்
  rationale: இங்கு תּוֹרָה முந்தைய தூய்மை–தீட்டு விதிமுறைகளைச் சுருக்கிக் கூறும் அதிகாரமுள்ள சட்டத் தொகுப்பைக் குறிக்கிறது; ‘குறித்த சட்டம்’ என்பது நவீன தமிழில் இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: הַבְּהֵמָה
  choice: கால்நடைகள்
  rationale: בְּהֵמָה பொதுவாக நில விலங்குகளை, பல இடங்களில் மனிதர் வளர்க்கும் விலங்குகளைச் சுட்டுகிறது; இச்சூழலில் ‘கால்நடைகள்’ பிற உயிரின வகைகளிலிருந்து இதைத் தெளிவாக வேறுபடுத்துகிறது.
- source_word: הָעוֹף
  choice: பறவைகள்
  rationale: עוֹף விரிவாகப் பறக்கும் உயிரினங்களைக் குறிக்கக்கூடியது; இவ்வகைப் பட்டியலில் ‘பறவைகள்’ இயல்பானதும் போதுமான துல்லியமுடையதும் ஆகும்.
- source_word: כָל נֶפֶשׁ הַחַיָּה
  choice: ஒவ்வோர் உயிரினம்
  rationale: נֶפֶשׁ הַחַיָּה என்பது உயிருள்ள பிராணியைச் சுட்டும் மொழிவழக்கு; தனியாக இருக்கும் அழிவற்ற ‘ஆத்துமா’ என்ற கருத்தை இங்கு புகுத்தாமல் ‘உயிரினம்’ பொருளைப் பாதுகாக்கிறது.
- source_word: הָרֹמֶשֶׂת
  choice: அசையும்
  rationale: רמש சிறிய உயிரினங்களின் நகர்வையும் பொதுவாக நகர்வதையும் குறிக்கிறது; நீர்வாழ் உயிரினங்களுக்குப் பொருந்தும் பரந்த, இயல்பான தமிழ் சொல் ‘அசையும்’.
- source_word: בַּמָּיִם
  choice: நீரில்
  rationale: எபிரெயில் வடிவம் பன்மையாக இருந்தாலும் தமிழில் இச்சூழலில் ‘நீரில்’ என்பதே இயல்பான பொதுப்பொருள் தருகிறது.
- source_word: וּלְכָל נֶפֶשׁ
  choice: ஒவ்வோர் உயிரினம்
  rationale: இரண்டாவது נֶפֶשׁ-மும் உயிருள்ள படைப்பினத்தையே குறிக்கிறது; இணையான தமிழ் அமைப்பு வகைப்பாட்டின் தெளிவைப் பேணுகிறது.
- source_word: הַשֹּׁרֶצֶת
  choice: திரளாகச் செல்லும்
  rationale: שׁרץ சிறிய உயிரினங்கள் பெருகித் திரள்வதையும் கூட்டமாக நகர்வதையும் குறிக்கிறது; ‘திரளாகச் செல்லும்’ என்பது அதன் இயக்கத்தையும் கூட்டத் தன்மையையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עַל הָאָרֶץ
  choice: நிலத்தில்
  rationale: இங்கு אָרֶץ நீருக்கு எதிரான வாழிட வகையாக வருகிறது; ஆகவே ‘பூமியில்’ என்பதைவிட ‘நிலத்தில்’ சூழலுக்குத் துல்லியமானது.
