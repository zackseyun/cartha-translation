  terminology: “குறித்த சட்டம்” suitably conveys תּוֹרַת in this legal summary, while the footnote responsibly notes “அறிவுறுத்தல்” as a viable lexical alternative. “உயிரினம்” appropriately avoids misleading soul-language for נֶפֶשׁ. “நிலத்தில்” correctly conveys the land-side contrast with the waters.
