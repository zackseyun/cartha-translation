translation_notes:
  register: நவீன தரத் தமிழில், சுருக்கமான சட்டத் தொகுப்பு நடையைப் பேணிய மொழிபெயர்ப்பு. ‘உயிரினம்’ என்ற சொல் נֶפֶשׁ என்பதற்கு இச்சூழலில் தவறான ஆத்துமா சார்ந்த பொருள் ஏற்படாமல் காக்கிறது. அடிக்குறிப்பு குறியீடு அது விளக்கும் ‘சட்டம்’ என்பதற்குப் பின்னர் வைக்கப்பட்டுள்ளது.
