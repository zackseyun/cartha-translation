base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/010.yaml
  text: But everything in the seas and in the streams that does not have fins and scales[b][a], among all the swarming things in the waters and among all the living creatures that are in the waters—they are detestable to you.
translation:
  language: ta
  text: ஆனால், கடல்களிலும் நீரோடைகளிலும்[b], நீரில் திரளும் எல்லா உயிரினங்களிலும், நீரில் வாழும் எல்லா உயிரினங்களிலும், துடுப்புகளும் செதில்களும் இல்லாதவை உங்களுக்கு அருவருப்பானவை[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அருவருப்பானவை’ என்பதற்கு ‘வெறுக்கத்தக்கவை’ என்றும் மொழிபெயர்க்கலாம். இந்த உணவுச் சட்டச் சூழலில் எபிரெயச் சொல் சடங்கு முறையில் அருவருத்து விலக்கப்பட வேண்டியதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘நீரோடைகள்’ என்பதைச் சூழலுக்கேற்ப ‘ஆறுகள்’ அல்லது பருவகால நீர்ப்பாதைகள் என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் பொதுவாக ஓடும் நீர்ப்பாதைகளைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל
  choice: ஆனால் ... அனைத்திலும் ... இல்லாதவை
  rationale: முந்தைய வசனத்துடன் உள்ள மாறுபாட்டை ‘ஆனால்’ காட்டுகிறது; כֹל என்பதன் முழுமையான பரப்பை ‘அனைத்திலும்’ தக்கவைக்கிறது.
- source_word: אֲשֶׁר אֵין לוֹ
  choice: இல்லாதவை
  rationale: தேவையான உடற்கூறுகள் அவற்றுக்கு இல்லை என்பதை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: סְנַפִּיר וְקַשְׂקֶשֶׂת
  choice: துடுப்புகளும் செதில்களும்
  rationale: இரண்டு அடையாளங்களும் சேர்ந்து தேவைப்படுவதை ‘-உம் ... -உம்’ தெளிவாகக் காட்டுகிறது.
- source_word: בַּיַּמִּים וּבַנְּחָלִים
  choice: கடல்களிலும் நீரோடைகளிலும்
  rationale: יַמִּים என்பதற்கு ‘கடல்கள்’ என்றும், ஓடும் நீர்ப்பாதைகளைக் குறிக்கும் נְחָלִים என்பதற்கு சூழலுக்கு ஏற்ற பரந்த சொல்லாக ‘நீரோடைகள்’ என்றும் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: מִכֹּל שֶׁרֶץ הַמַּיִם
  choice: நீரில் திரளும் உயிரினங்கள் அனைத்திலும்
  rationale: שֶׁרֶץ குறிக்கும் திரண்டு அல்லது பெருகி அசையும் நீர்வாழ் உயிரின வகையைத் தெளிவான தமிழில் தருகிறது; partitive מִן ‘அனைத்திலும்’ என வெளிப்படுகிறது.
- source_word: וּמִכֹּל נֶפֶשׁ הַחַיָּה
  choice: நீரில் வாழும் உயிரினங்கள் அனைத்திலும்
  rationale: נֶפֶשׁ הַחַיָּה என்பதன் பரந்த உயிருள்ள படைப்பின வகையை, தவறாக மனித ‘ஆத்துமா’ எனக் குறுக்காமல் ‘வாழும் உயிரினங்கள்’ என வழங்குகிறது.
- source_word: שֶׁקֶץ הֵם לָכֶם
  choice: அவை உங்களுக்கு அருவருப்பானவை
  rationale: வினையற்ற எபிரெய நிலை வாக்கியத்தை நிகழ்நிலைத் தமிழில் இயல்பாகக் கொடுத்து, உணவுச் சட்டச் சூழலின் சடங்கு சார்ந்த வெறுக்கத்தக்க நிலையையும் வலிமையையும் காக்கிறது.
theological_decisions:
- issue: உணவுச் சட்டத்தில் சடங்கு நிலையைச் சுட்டும் சொல்
  choice: அருவருப்பானவை
  alternative: வெறுக்கத்தக்கவை
  rationale: שֶׁקֶץ இங்கு பொதுவான ஒழுக்கத் தீர்ப்பை அல்ல, இஸ்ரவேலுக்கான உடன்படிக்கை உணவுச் சட்டத்தில் வெறுத்து விலக்க வேண்டிய நிலையைக் குறிக்கிறது. ‘அருவருப்பானவை’ அதன் வலிமையைத் தக்கவைக்கிறது; அடிப்படையில் இல்லாத ‘தீட்டானவை’ என்ற தனித் தொழில்நுட்பச் சொல்லைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ். சட்டவாக்கியத்தின் வலிமை காக்கப்பட்டுள்ளது; எபிரெயப் பட்டியலின் இரண்டு பரந்த நீர்வாழ் உயிரின வகைகளும் தனித்தனியாக வைக்கப்பட்டுள்ளன.
