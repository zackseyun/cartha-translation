source:
  edition: WLC
  text: כֹּ֣ל אֲשֶׁ֥ר אֵֽין ל֛/וֹ סְנַפִּ֥יר וְ/קַשְׂקֶ֖שֶׂת בַּ/מָּ֑יִם שֶׁ֥קֶץ ה֖וּא לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/012.yaml
  text: Everything in the water that does not have fins and scales is detestable to you[a].
translation:
  language: ta
  text: தண்ணீரில் துடுப்புகளும் செதில்களும் இல்லாத அனைத்தும் உங்களுக்கு அருவருப்பானவை[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்களுக்கு அருவருப்புக்குரியவை.” இங்கு வரும் எபிரெயச் சொல் שֶׁקֶץ, இந்த உணவுச் சட்டச் சூழலில் சடங்குரீதியாக அருவருக்கத்தக்க அல்லது விலக்கத்தக்க ஒன்றைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל אֲשֶׁר
  choice: அனைத்தும்
  rationale: வரையறுக்கப்பட்ட வகை முழுவதையும் குறிக்கும் எபிரெயத் தொடரின் விரிவான பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: אֵין לוֹ
  choice: இல்லாத
  rationale: உடைமையை மறுக்கும் எபிரெயக் கட்டமைப்பைத் தமிழில் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: סְנַפִּיר
  choice: துடுப்புகள்
  rationale: எபிரெயத்தில் ஒருமை வடிவம் பொதுவகைப் பொருளில் வருகிறது; நீர்வாழ் உயிரினங்களின் உடலுறுப்பைக் குறிக்கத் தமிழில் பன்மை இயல்பானது.
- source_word: קַשְׂקֶשֶׂת
  choice: செதில்கள்
  rationale: பொதுவகைப் பொருளில் வரும் எபிரெய ஒருமையை, மீன்களின் உடலை மூடும் scales என்பதற்கான வழக்கமான தமிழ்ச் சொல்லால் பன்மையில் தருகிறது.
- source_word: בַּמָּיִם
  choice: தண்ணீரில்
  rationale: מַיִם வடிவில் பன்மையாக இருந்தாலும் இங்கு நீர்ப்பரப்பை பொதுவாகக் குறிக்கிறது; ‘தண்ணீரில்’ என்பது நவீனத் தமிழில் இயல்பான இடவியல் மொழிபெயர்ப்பு.
- source_word: שֶׁקֶץ
  choice: அருவருப்பானவை
  rationale: உணவுச் சட்டச் சூழலில் சடங்குரீதியாக வெறுக்கத்தக்க அல்லது விலக்கத்தக்கவற்றைக் குறிக்கும் வலுவான மதிப்பீட்டை, வேறு தூய்மைச் சொற்களுடன் கலக்காமல் வெளிப்படுத்துகிறது.
- source_word: הוּא לָכֶם
  choice: உங்களுக்கு ... ஆனவை
  rationale: இஸ்ரவேலருக்குப் பொருந்தும் நிலையைச் சுட்டும் לָכֶם என்பதையும், பெயர்ப் பயனிலைக் கூற்றையும் தமிழில் இயல்பாகத் தருகிறது; ‘அனைத்தும்’ என்பதுடன் எண்ணொத்த பன்மை பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: உணவுச் சட்டச் சூழலில் שֶׁקֶץ என்பதற்கான சடங்கு-மதிப்பீட்டுச் சொல்
  choice: அருவருப்பானவை
  alternative: அருவருப்புக்குரியவை; வெறுக்கத்தக்கவை
  rationale: இச்சொல் பொதுவான அசுத்தத்தைக் குறிக்கும் טָמֵא என்ற சொல்லல்ல. ஆகவே ‘அசுத்தமானவை’ என்று சொற்களை ஒன்றாக்காமல், சடங்குரீதியான விலக்கத்தன்மையையும் கடுமையான வெறுப்புணர்வையும் தக்கவைக்கும் சொல் தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும், அதேவேளை சட்டவுரைத் தொனிக்கேற்ற கண்ணியமான நடை. ‘துடுப்புகள்’, ‘செதில்கள்’ ஆகியவை நீர்வாழ் உயிரினங்களுக்கான இயல்பான வகைப்பாட்டுச் சொற்களாகப் பயன்படுத்தப்பட்டுள்ளன.
