base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/045.yaml
  text: For I am Yahweh[a], who brought you up from the land of Egypt to be your God. And you shall be holy[b], because I am holy.
translation:
  language: ta
  text: ஏனெனில், நான் யாவே; உங்கள் கடவுளாக இருப்பதற்காக எகிப்து நாட்டிலிருந்து உங்களை மேலே கொண்டுவந்தவர்[a] நானே. நீங்கள் பரிசுத்தராக இருக்க வேண்டும்; ஏனெனில்[b], நான் பரிசுத்தர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘எகிப்து நாட்டிலிருந்து உங்களை மேலே கொண்டுவருகிறவர்.’ எபிரெயத்தில் பெயரெச்ச வினை வடிவம் பயன்படுத்தப்பட்டுள்ளது; அதை நிகழ்காலத் தன்மையுடன் இன்னும் சொற்சொல்லாக மொழிபெயர்க்கலாம். எனினும், இங்கு யாத்திராகமம் எனும் கடந்தகால நிகழ்வே குறிக்கப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘நான் பரிசுத்தர் என்பதால்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மெய்யெழுத்துப் பெயரான YHWH-ஐ, ‘கர்த்தர்’ என்ற பட்டமாக மாற்றாமல், நவீனத் தமிழில் வழக்கிலுள்ள ஒலிபெயர்ப்பால் தருகிறது.
- source_word: הַמַּעֲלֶה
  choice: மேலே கொண்டுவந்தவர்
  rationale: עלה என்பதன் ‘மேலே கொண்டுவருதல்’ என்ற உருவகத்தைப் பாதுகாக்கிறது; வடிவம் நிகழ்காலத் தன்மையுள்ள பங்கேற்புவினையாக இருந்தாலும், யாத்திராகமம் கடந்த நிகழ்வு என்பதால் தமிழில் இறந்தகாலம் இயல்பானது.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: எகிப்து நாட்டிலிருந்து
  rationale: எபிரெய மூலத்தில் வெளிப்படையாக உள்ள ‘நாடு’ என்ற சொல்லையும் உடன்படிக்கைச் சூழலிலுள்ள யாத்திராகமச் சொற்றொடரையும் காக்கிறது.
- source_word: לִהְיוֹת לָכֶם לֵאלֹהִים
  choice: உங்கள் கடவுளாக இருப்பதற்காக
  rationale: உடன்படிக்கை உறவை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; ‘உங்களுக்கு ஒரு கடவுளாக’ என்று தேவையற்ற வகையில் பொருளை மாற்றுவதில்லை.
- source_word: וִהְיִיתֶם קְדֹשִׁים
  choice: நீங்களும் பரிசுத்தராக இருக்க வேண்டும்
  rationale: சூழலில் உள்ள கட்டளை வலிமையை ‘இருக்க வேண்டும்’ தெளிவாகத் தருகிறது; ‘நீங்களும்’ என்பது கடவுளின் பரிசுத்தத்துக்கும் மக்களின் பரிசுத்தத்துக்கும் உள்ள ஒப்புமைத் தொடர்பை இயல்பாகக் காட்டுகிறது.
- source_word: כִּי קָדוֹשׁ אָנִי
  choice: நான் பரிசுத்தராக இருப்பதால்
  rationale: כִּי இங்கு தரும் காரணத் தொடர்பை நவீனத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது; ‘நான் பரிசுத்தர்’ என்ற இறையியல் கூற்றை மாற்றாமல் காக்கிறது.
theological_decisions:
- issue: பரிசுத்தத்திற்கான உடன்படிக்கை அடித்தளம்
  choice: இஸ்ரவேல் பரிசுத்தமாக இருக்க வேண்டியதன் அடிப்படையாக யாவேயின் அடையாளம், எகிப்திலிருந்து அவர் செய்த மீட்பு, அவர்களுடைய கடவுளாக அவர் கொண்ட உறவு, அவருடைய சொந்தப் பரிசுத்தம் ஆகியவற்றை வசனம் இணைக்கிறது.
  alternative: இதை விரிவான உடன்படிக்கை முக்கியத்துவமற்ற சடங்குத் தூய்மை விதியாக மட்டும் வாசித்தல்.
  rationale: உடனடிச் சூழல் உணவு மற்றும் தூய்மையைப் பற்றியதாக இருந்தாலும், வசனத்தின் சொற்களே யாத்திராகம மீட்பையும் கடவுளின் பரிசுத்தத்தையும் நேரடியாக இணைக்கின்றன; மொழிபெயர்ப்பு இதை விரிவாக்காமலும் குறுக்காமலும் வைத்திருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் மரியாதையும் தெளிவும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘யாவே’ மூலம் தனிப்பெயர் பாதுகாக்கப்பட்டுள்ளது; ‘பரிசுத்தம்’ என்ற நிலைபெற்ற இறையியல் சொல், வெறும் ‘தனியாகப் பிரிக்கப்பட்டவர்’ என்று சுருக்கப்படாமல் வைக்கப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் வலியுறுத்தலைத் தெரிவிக்க ‘நானே’ பயன்படுத்தப்பட்டுள்ளது.
