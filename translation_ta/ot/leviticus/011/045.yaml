revisions:
- from: ஏனெனில், நானே யாவே. உங்கள் கடவுளாக இருப்பதற்காக எகிப்து நாட்டிலிருந்து உங்களை மேலே கொண்டுவந்தவர்[a] நானே. நான் பரிசுத்தராக இருப்பதால்[b], நீங்களும் பரிசுத்தராக இருக்க வேண்டும்.
