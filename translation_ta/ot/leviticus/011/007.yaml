id: LEV.11.7
reference: Leviticus 11:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/אֶת הַ֠/חֲזִיר כִּֽי מַפְרִ֨יס פַּרְסָ֜ה ה֗וּא וְ/שֹׁסַ֥ע שֶׁ֨סַע֙ פַּרְסָ֔ה וְ/ה֖וּא גֵּרָ֣ה לֹֽא יִגָּ֑ר טָמֵ֥א ה֖וּא לָ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/007.yaml
  text: And the pig[a], because it has a divided hoof and splits the hoof, but does not chew the cud[b], is unclean to you.
translation:
  language: ta
  text: 'பன்றியையும்: அது பிளவுபட்ட குளம்புடையதாயும், குளம்பு முழுமையாகப் பிளந்ததாயும் இருந்தும், அசைபோடாததால்[a], அது உங்களுக்குச் சடங்குமுறையில் அசுத்தமானது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேர்சொல்லாக, ‘அசையை மீண்டும் கொண்டுவருவதில்லை.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֲזִיר
  choice: பன்றி
  rationale: எபிரெயச் சொல் இவ்விலங்கினத்தைப் பொதுவாகக் குறிக்கிறது; ‘பன்றி’ என்பது நவீனத் தமிழில் இயல்பான, தெளிவான பெயர்.
- source_word: כִּי
  choice: இருந்தாலும்
  rationale: כִּי அடிப்படையில் காரணத்தை அறிமுகப்படுத்தினாலும், முழு வாக்கியத்தில் குளம்பு குறித்த தகுதியும் அசைபோடாமையும் முரண்பட்டு நிற்கின்றன. தமிழில் ‘இருந்தாலும்’ அந்த வாக்கியத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מַפְרִיס פַּרְסָה
  choice: குளம்பு பிளந்ததாக
  rationale: பிளவுபட்ட குளம்புடைய நிலையைத் தெளிவாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: וְשֹׁסַע שֶׁסַע פַּרְסָה
  choice: குளம்பு முழுவதும் இரண்டாகப் பிரிந்ததாகவும்
  rationale: எபிரெய மூலத்தில் வரும் இரண்டாவது, வலியுறுத்தும் குளம்பு விளக்கத்தை ஒழிக்காமல், அது முழுமையாக இரு பகுதிகளாகப் பிரிந்திருப்பதைத் தமிழில் தெளிவாக்குகிறது.
- source_word: גֵּרָה לֹא יִגָּר
  choice: அசைபோடுவதில்லை
  rationale: மீண்டும் மேலே கொண்டுவரப்பட்ட இரையை மெல்வதைக் குறிக்கும் வழக்கமான தமிழ் விலங்கியல் சொற்றொடர்; மூலத்தின் நேரடியான உருவகம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: טָמֵא הוּא לָכֶם
  choice: அது உங்களுக்குத் தீட்டானது
  rationale: உணவுச் சட்டத்தின் சடங்குசார் தூய்மை வகைப்பாட்டை வெளிப்படுத்துகிறது; ‘உங்களுக்கு’ என்பது இஸ்ரயேல் மக்களைக் குறித்த மூலத்தின் உறவுநிலையையும் காக்கிறது.
theological_decisions:
- issue: உணவுச் சட்டத்தில் טָמֵא என்பதன் தன்மை
  choice: சடங்கு மற்றும் உணவு வகைப்பாட்டில் ‘தீட்டானது’
  alternative: அசுத்தமானது; மாசுபட்டது
  rationale: லேவியராகமம் 11-இல் இச்சொல் ஒழுக்கத் தீமையை அல்ல, இஸ்ரயேலுக்கான உணவு மற்றும் தூய்மை வேறுபாட்டைக் குறிக்கிறது. ‘தீட்டானது’ அந்தச் சடங்குசார் பொருளை அளவுக்கு மீறாமல் வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதில் புரியும், கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயத்தில் குளம்பின் பிளவை இருமுறை விவரிக்கும் வலியுறுத்தல் தமிழிலும் இரண்டு இணையான கூறுகளாகப் பாதுகாக்கப்பட்டுள்ளது.
