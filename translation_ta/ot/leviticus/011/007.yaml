    text: நேர்சொல்லாக, ‘அசையை மீண்டும் கொண்டுவருவதில்லை.’
    reason: lexical_alternative
  revision_rationale: The revision retains the Hebrew’s twofold hoof description, states the contrast signaled by the animal’s split hoof alongside its failure to chew cud, and restores the explanatory connection underlying its classification. The ritual sense of טָמֵא is made explicit in the text; the note preserves the more literal imagery of the Hebrew idiom.
