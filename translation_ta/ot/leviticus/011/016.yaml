  register: நவீன செந்தமிழ்ச் சொற்களுடன், பொதுவாசகர்கள் புரிந்துகொள்ளக்கூடிய கண்ணியமான பட்டியல் நடை பயன்படுத்தப்பட்டது. பறவை அடையாளங்களில் உள்ள உண்மையான சொற்பொருள் ஐயம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
