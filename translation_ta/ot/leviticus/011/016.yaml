source:
  edition: WLC
  text: וְ/אֵת֙ בַּ֣ת הַֽ/יַּעֲנָ֔ה וְ/אֶת הַ/תַּחְמָ֖ס וְ/אֶת הַ/שָּׁ֑חַף וְ/אֶת הַ/נֵּ֖ץ לְ/מִינֵֽ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/016.yaml
  text: and the ostrich[a], and the hawk, and the gull, and the falcon according to its kind,
translation:
  language: ta
  text: நெருப்புக்கோழியையும், பருந்தையும், கடற்காக்கையையும், வல்லூறையும் அதன் இனத்தின்படி;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּת הַיַּעֲנָה
  choice: நெருப்புக்கோழி
  rationale: சொல்லுக்குச் சொல் பொருள் ‘யஅனாவின் மகள்’ என்றிருந்தாலும், விலங்கியல் பட்டியலில் இது ஒரு பறவையின் நிலைபெற்ற பெயராக வருகிறது. ஒப்பீட்டு மொழியியல் ஆதாரத்தின் அடிப்படையில் ‘நெருப்புக்கோழி’ என்பது சாத்தியமான அடையாளம்; எனினும் உறுதியற்ற தன்மை அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: הַתַּחְמָס
  choice: பருந்து
  rationale: குறிப்பிட்ட பறவை இனம் உறுதியற்றது. வேட்டைப் பறவையைக் குறிக்கும் பொதுவான, இயல்பான தமிழ்ச் சொல்லாக ‘பருந்து’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: הַשָּׁחַף
  choice: கடற்காக்கை
  rationale: எபிரெயச் சொல்லின் துல்லியமான அடையாளம் உறுதியற்றது; நவீன அகராதிகளில் பரவலாக ஏற்கப்படும் ‘gull’ என்பதற்கு இயல்பான தமிழ்ப் பெயராக ‘கடற்காக்கை’ பயன்படுத்தப்பட்டது.
- source_word: הַנֵּץ
  choice: வல்லூறு
  rationale: இது பருந்தின வேட்டைப் பறவையைக் குறிக்கிறது; முந்தைய தַּחְמָס என்பதிலிருந்து வேறுபடுத்தவும், falcon என்ற சாத்தியமான அடையாளத்தைத் தரவும் ‘வல்லூறு’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: לְמִינֵהוּ
  choice: வல்லூறின் ஒவ்வொரு இனமும்
  rationale: எபிரெயில் ஒருமை உடைமைப் பின்னொட்டு உடனடியாக முந்திய நֵץ என்பதைக் குறிக்கிறது. தமிழில் பட்டியல் நடைக்கு இயல்பாகவும் வகைப்பாட்டுப் பொருள் தெளிவாகவும் இருக்க இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: וְאֵת / וְאֶת
  choice: பட்டியல் தொடர்ச்சியைச் சுட்டும் நிறுத்தற்குறிகள்
  rationale: மீண்டும் வரும் וְ இணைப்புச் சொல்லும் நேரடி செயப்படுபொருள் குறியீடும் முந்தைய வசனத்திலிருந்து தொடரும் பட்டியலை அமைக்கின்றன. தனித்து மேற்கோளிடப்பட்ட தமிழ்ப் பட்டியலில் தேவையற்ற பல ‘மற்றும்’ சொற்களைத் தவிர்த்து காற்புள்ளிகளும் இறுதியில் நீண்ட கோடும் பயன்படுத்தப்பட்டன.
