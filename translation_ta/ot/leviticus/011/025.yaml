revisions:
- from: அவற்றின் சடலங்களில் எதையாவது சுமக்கிற ஒவ்வொருவரும் தம் உடைகளைக் கழுவ வேண்டும்; அவர் மாலைவரை தீட்டுள்ளவராக இருப்பார்.[a]
  to: அவற்றின் சடலங்களில் ஏதேனும் ஒன்றைச் சுமக்கிற ஒவ்வொருவரும் தம் உடைகளைக் கழுவ வேண்டும்; அவர் மாலைவரை தீட்டுள்ளவராக இருப்பார்.[a]
  rationale: The revision corrects the ambiguous Tamil expression for the carried object while preserving the Hebrew distributive sense, legal force, singular representative reference, and temporary ritual-impurity terminology. The footnote is adjusted to state the formal alternative directly and naturally.
