  text: וְ/כָל הַ/נֹּשֵׂ֖א מִ/נִּבְלָתָ֑/ם יְכַבֵּ֥ס בְּגָדָ֖י/ו וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/025.yaml
  text: And everyone who carries any of their carcasses shall wash his clothes and be unclean until the evening[a].
translation:
  language: ta
  text: அவற்றின் சடலங்களில் ஏதேனும் ஒன்றைச் சுமக்கிற ஒவ்வொருவரும் தம் உடைகளைக் கழுவ வேண்டும்; அவர் மாலைவரை தீட்டுள்ளவராக இருப்பார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவற்றின் சடலங்களிலிருந்து.” எபிரெயச் சொற்றொடரை இன்னும் சொற்சார்பாக இவ்வாறு மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל הַ/נֹּשֵׂא
  choice: சுமக்கிற ஒவ்வொருவரும்
  rationale: כָּל உடன் வரும் வினையெச்சம் பொதுவான, பகிர்ந்தளிக்கும் பொருளைக் கொடுக்கிறது; נָשָׂא இச்சூழலில் தூக்கிச் செல்வது அல்லது சுமப்பதைக் குறிக்கிறது.
- source_word: מִ/נִּבְלָתָ/ם
  choice: அவற்றின் சடலங்களில் எதையாவது
  rationale: נְבֵלָה இங்கு விலங்கின் சடலத்தைக் குறிக்கிறது. מִן அமைப்பின் சொற்சார்ந்த வடிவத்தையும், அவற்றுள் எந்தச் சடலமானாலும் என்ற பகிர்ந்தளிக்கும் பொருளையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: יְכַבֵּס בְּגָדָי/ו
  choice: தம் உடைகளைக் கழுவ வேண்டும்
  rationale: சட்டவிதியின் கட்டாயத்தை ‘வேண்டும்’ தெளிவாகக் காட்டுகிறது. ஒரே நபரைத் திரும்பக் குறிக்கும் இயல்பான தமிழ்ச் சொல்லாக ‘தம்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: וְ/טָמֵא
  choice: அவர் ... தீட்டுள்ளவராக இருப்பார்
  rationale: טָמֵא என்பது இங்கு ஒழுக்கக்கேட்டை அல்ல, சடங்குசார் தீட்டுநிலையைக் குறிக்கிறது; தனி வாக்கிய அமைப்பு விளைவைக் தெளிவாக்குகிறது.
- source_word: עַד הָ/עָרֶב
  choice: மாலைவரை
  rationale: தீட்டுநிலை நீடிக்கும் கால எல்லையைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது.
theological_decisions:
- issue: பொதுவான சட்டவிதியில் வரும் எபிரெய ஆண்பால் ஒருமை வடிவங்கள்
  choice: ‘ஒவ்வொருவரும் ... தம்’; பின்னர் ‘அவர்’ என்ற ஒருமையைத் தக்கவைத்தல்
  alternative: ‘அவர்கள் ... தங்கள்’ என்று பன்மைப்படுத்தல்
  rationale: எபிரெயம் பிரதிநிதித்துவ ஒருமையைப் பயன்படுத்துகிறது. தமிழ் மொழியின் இயல்புக்கு ஏற்ற மரியாதை/பொதுநிலை வடிவங்களால் அதன் ஒருமைப் பொருளைத் தக்கவைக்கிறது; உயிரியல் பாலினத்தை மூலத்தில் இருப்பதைவிட அதிகமாக வலியுறுத்தவில்லை.
- issue: טָמֵא என்பதன் தன்மை
  choice: சடங்குசார் அசுத்தநிலையைக் குறிக்கும் ‘தீட்டுள்ளவர்’
  alternative: ஒழுக்கத் தவறைக் குறிக்கக்கூடிய ‘அசுத்தமானவர்’
  rationale: லேவியராகமத்தின் இச்சூழலில் இது தற்காலிகமான சடங்குசார் நிலையைக் குறிக்கிறது; ஒழுக்கத் தீமை என்று பொருள்படக் கூடாது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சட்டவிதிக்கேற்ற கண்ணியமான மற்றும் எளிதில் புரியும் நடை. ‘சடலம்’, ‘தீட்டுள்ளவர்’ ஆகியவை விலங்கு உடலும் சடங்குசார் அசுத்தநிலையும் என்பவற்றைத் தெளிவாக வேறுபடுத்துகின்றன.
