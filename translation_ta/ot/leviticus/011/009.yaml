  yaml_path: translation/ot/leviticus/011/009.yaml
  text: 'These you may eat from all that are in the waters: whatever in the waters[a], in the seas and in the streams, has fins and scales—these you may eat.'
translation:
  language: ta
  text: 'நீரில் உள்ள அனைத்திலிருந்தும் இவற்றை நீங்கள் உண்ணலாம்: நீரில்—கடல்களிலும் ஓடைகளிலும்[a]—துடுப்புகளும் செதில்களும் உள்ள எதையும் நீங்கள் உண்ணலாம்.


    [a] அல்லது, “ஆறுகளிலும்.” இங்கு வரும் எபிரெயச் சொல் ஓடைகள், ஆறுகள், அல்லது பருவகால நீரோடைகள் ஆகியவற்றைக் குறிக்கலாம்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆறுகளிலும்.” இங்கு வரும் எபிரெயச் சொல் ஓடைகள், ஆறுகள், அல்லது பருவகால நீரோடைகள் ஆகியவற்றைக் குறிக்கலாம்.
    reason: נְחָלִים என்ற சொல்லின் பரந்த பொருள் வரம்பை வெளிப்படுத்தும் சொற்பொருள் மாற்று.
lexical_decisions:
