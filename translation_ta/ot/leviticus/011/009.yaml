  rationale: முன்னர் விவரிக்கப்பட்ட அனுமதிக்கப்பட்ட உயிரினங்களை மீண்டும் சுட்டும் வலியுறுத்தலைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
