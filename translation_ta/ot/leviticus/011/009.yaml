- source_word: קַשְׂקֶשֶׂת
  choice: செதில்கள்
  rationale: வகைப்பெயரை இயல்பான தமிழ் உயிரியல் சொல்லாகப் பன்மையில் வழங்குகிறது.
- source_word: בַּיַּמִּים וּבַנְּחָלִים
  choice: கடல்களிலும் ஓடைகளிலும்
