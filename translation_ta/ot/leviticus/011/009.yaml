  choice: இவற்றை
  rationale: எபிரெயில் ஒருமைச் சுட்டுப்பெயர் இருந்தாலும், உணவாக அனுமதிக்கப்படும் பலவகை நீர்வாழ் உயிரினங்களை அறிமுகப்படுத்தும் சட்டச் சூழலில் தமிழில் பன்மை இயல்பாக உள்ளது.
- source_word: תֹּאכְלוּ
  choice: நீங்கள் உண்ணலாம்
  rationale: சட்ட அறிவுறுத்தலில் வரும் வினை இங்கு கட்டளையைவிட அனுமதிக்கப்பட்ட உணவைக் குறிக்கிறது; ‘உண்ணலாம்’ அந்த அனுமதிப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: מִכֹּל אֲשֶׁר בַּמָּיִם
  choice: நீரில் உள்ள அனைத்திலும்
  rationale: מִן என்பதன் பகுதியெடுக்கும் பொருளையும், நீரில் உள்ள உயிரினங்களின் மொத்த வகுப்பைக் குறிக்கும் அமைப்பையும் சுருக்கமான நவீன தமிழில் காக்கிறது.
- source_word: סְנַפִּיר
  choice: துடுப்புகள்
