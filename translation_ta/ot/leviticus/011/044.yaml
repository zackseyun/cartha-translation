base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/044.yaml
  text: For I am Yahweh your God[a]. Consecrate yourselves therefore, and be holy, for I am holy[b]. And you shall not defile yourselves with any swarming thing that moves on the earth.
translation:
  language: ta
  text: ஏனெனில், நான் உங்கள் கடவுளாகிய யாவே. ஆகையால், உங்களைப் பரிசுத்தப்படுத்திக்கொள்ளுங்கள்[a]; பரிசுத்தர்களாயிருங்கள், ஏனெனில் நான் பரிசுத்தர். நிலத்தின் மேல் ஊர்ந்து திரியும் எந்தச் சிற்றுயிரினத்தாலும் உங்களைத் தீட்டுப்படுத்தாதீர்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்களைப் பரிசுத்தத்திற்கென வேறுபடுத்திக்கொள்ளுங்கள்.” எபிரெய வினை தற்சுட்டுப் பொருளுடையது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நிலத்தின் மேல் ஊர்ந்து திரியும் எந்தச் சிற்றுயிரினத்தாலும் உங்களை அசுத்தமாக்காதீர்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைவனின் தனிப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֱלֹהֵיכֶם
  choice: உங்கள் கடவுள்
  rationale: யாவே எழுவாயாக உள்ள உடன்படிக்கைச் சூழலில் இது ஒருமைப் பொருளுடைய ‘உங்கள் கடவுள்’ என்பதாகும்.
- source_word: וְהִתְקַדִּשְׁתֶּם
  choice: உங்களைத் தூயவர்களாக அர்ப்பணித்து
  rationale: ஹித்பயேல் வடிவத்தின் தற்சுட்டுப் பொருளையும், தங்களைத் தூய்மைக்கென வேறுபடுத்திக்கொள்ளும் வழிபாட்டு மற்றும் ஒழுக்க வலிமையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וִהְיִיתֶם קְדֹשִׁים
  choice: தூயவர்களாயிருங்கள்
  rationale: தேவையான நிலை அல்லது விளைவைக் கட்டளை வலிமையோடு சுருக்கமாகக் காட்டுகிறது.
- source_word: קָדוֹשׁ
  choice: தூயவர்
  rationale: கடவுளுக்கும் மக்களுக்கும் ஒரே קדשׁ சொற்குடும்பத்தின் தொடர்பைப் பேணி, இச்சூழலில் பரிசுத்தம் மற்றும் தனியே பிரித்துவைக்கப்பட்ட நிலை ஆகியவற்றை உணர்த்துகிறது.
- source_word: תְטַמְּאוּ
  choice: தீட்டுப்படுத்தாதீர்கள்
  rationale: טמא என்பதன் பியெல் வடிவம் உண்டாக்கும் சடங்கு அசுத்தத்தைக் ‘தீட்டு’ தெளிவாகக் குறிக்கிறது; சூழலின் ஒழுக்கத் தாக்கமும் மறையவில்லை.
- source_word: נַפְשֹׁתֵיכֶם
  choice: உங்களை
  rationale: இங்கு נֶפֶשׁ முழு நபரைக் குறிக்கிறது; ‘ஆத்துமாக்கள்’ என்பது உடல்–ஆத்துமா பிரிவை தேவையின்றி இறக்குமதி செய்யக்கூடும்.
- source_word: שֶּׁרֶץ
  choice: சிற்றுயிர்
  rationale: லேவியராகமம் 11-இல் கூட்டமாகப் பெருகும் அல்லது தரைக்கு அருகே இயங்கும் சிறிய உயிரினங்களைக் குறிக்கும் பொதுப்பெயராக வாசிக்கத்தக்க தமிழைத் தேர்ந்தெடுக்கிறது.
- source_word: הָרֹמֵשׂ
  choice: ஊர்ந்து திரியும்
  rationale: רמשׂ குறிக்கும் தரைக்கு அருகான அசைவை இயல்பாகத் தெரிவிக்கிறது; உயிரின வகையை அளவுக்கு மீறிக் குறுக்குவதில்லை.
- source_word: עַל הָאָרֶץ
  choice: நிலத்தின் மேல்
  rationale: இச்சூழலில் வானம் அல்லது நீருக்கு மாறாக நிலப்பரப்பில் அசைவதைச் சுட்டுகிறது.
theological_decisions:
- issue: கடவுளின் தன்மைக்கும் இஸ்ரவேலரின் கடமைக்கும் இடையிலான தூய்மைத் தொடர்பு
  choice: கடவுளுக்கும் மக்களுக்கும் ‘தூய’ என்ற ஒரே மூலச்சொல்லைத் தொடர்ந்து பயன்படுத்துதல்
  alternative: ஒரு இடத்தில் அல்லது இரு இடங்களிலும் ‘தனியே பிரிக்கப்பட்ட’ என்று மொழிபெயர்த்தல்
  rationale: மக்களின் தூய்மைக்கான கட்டளையை கடவுளின் சொந்தத் தூய்மையில் வசனம் அடித்தளப்படுத்துகிறது; ஒரே சொற்குடும்பத்தைப் பேணுவது இந்த இறையியல் தொடர்பைக் காக்கிறது.
- issue: נַפְשֹׁתֵיכֶם என்பதன் பொருள்
  choice: ‘உங்களை’ என்று முழு நபரைக் குறிக்கும் விதத்தில் மொழிபெயர்த்தல்
  alternative: ‘உங்கள் ஆத்துமாக்களை’ அல்லது ‘உங்கள் உயிர்களை’
  rationale: இக்கட்டளைத் தடை செய்யப்பட்ட உயிரினங்களால் நபர்கள் தீட்டுப்படுவதைப் பற்றியது; தொழில்நுட்பமான உடல்–ஆத்துமா மானிடவியலை உரை கூறவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘யாவே’ தனிப்பெயராகப் பேணப்பட்டுள்ளது. ‘தூய’ என்ற சொல் வசனத்தின் முக்கிய மறுமொழித் தொடர்பைக் காக்கிறது; ‘தீட்டு’ லேவியராகமத்தின் சடங்கு அசுத்தச் சூழலைத் தெளிவாகக் காட்டுகிறது.
