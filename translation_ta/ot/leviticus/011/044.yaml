revisions:
- from: ஏனெனில், நானே உங்கள் கடவுளாகிய யாவே. ஆகையால், உங்களைத் தூயவர்களாக அர்ப்பணித்து[a], தூயவர்களாயிருங்கள்; ஏனெனில், நான் தூயவர். நிலத்தின் மேல் ஊர்ந்து திரியும் எந்தச் சிற்றுயிராலும் உங்களைத் தீட்டுப்படுத்தாதீர்கள்[b].
  to: ஏனெனில், நான் உங்கள் கடவுளாகிய யாவே. ஆகையால், உங்களைப் பரிசுத்தப்படுத்திக்கொள்ளுங்கள்[a]; பரிசுத்தர்களாயிருங்கள், ஏனெனில் நான் பரிசுத்தர். நிலத்தின் மேல் ஊர்ந்து திரியும் எந்தச் சிற்றுயிரினத்தாலும் உங்களைத் தீட்டுப்படுத்தாதீர்கள்[b].
  rationale: The revision makes the reflexive imperative explicit, uses consistent established Tamil holiness terminology for the קדשׁ word-group, and smooths the opening covenant formula. It preserves the source’s sequence, its repeated rationale “for I am holy,” its broad reference to terrestrial swarming creatures, and the ritual-defilement sense of the prohibition.
