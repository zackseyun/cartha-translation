base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/027.yaml
  text: And every one that walks on its paws, among all the animals that walk on four feet, they are unclean to you. Everyone who touches their carcass shall be unclean until the evening.
translation:
  language: ta
  text: நான்கு கால்களில்[a] நடக்கும் எல்லா விலங்குகளிலும், தங்கள் பாதங்களின்மேல் நடப்பவை அனைத்தும் உங்களுக்குத் தீட்டானவை. அவற்றின் செத்த உடலைத்[b] தொடுகிற எவரும் மாலைவரை தீட்டுள்ளவராக இருப்பார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “நான்கின்மேல்”; அதாவது, நான்கு கால்களையும் ஊன்றி நகரும்.
    reason: lexical_alternative
  - marker: b
    text: “செத்த உடல்” என்பதற்கான எபிரெயப் பெயர்ச்சொல் ஒருமையிலும், அதனுடன் சேர்ந்த உடைமைப் பின்னொட்டு பன்மையிலும் உள்ளது; இங்கே அது தொகுப்புப் பொருளில் வருகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל הוֹלֵךְ
  choice: நடப்பவை அனைத்தும்
  rationale: எபிரெயச் சொற்றொடர் ஒவ்வொரு உயிரினத்தையும் தனித்தனியாகக் குறித்தாலும், தொடரும் பன்மை வினையெச்சத்துடன் இயல்பான தமிழில் வகுப்பு முழுவதையும் குறிக்கும் வகையில் மொழிபெயர்க்கப்பட்டது.
- source_word: עַל כַּפָּיו
  choice: தங்கள் பாதங்களை ஊன்றி
  rationale: כַּף என்பது உள்ளங்கை அல்லது உள்ளங்கால் போன்ற அடிப்பகுதியைக் குறிக்கும்; விலங்குகளைப் பற்றிய இச்சூழலில் ‘பாதங்கள்’ இயல்பான தமிழ்ச் சொல். ‘ஊன்றி’ என்பது அவற்றின்மேல் நடப்பதைக் தெளிவுபடுத்துகிறது.
- source_word: בְּכָל הַחַיָּה
  choice: எல்லா விலங்குகளிலும்
  rationale: உணவுச் சட்டங்களின் இச்சூழலில் חַיָּה பொதுவான உயிரைக் காட்டிலும் நில விலங்குகளைக் குறிக்கிறது.
- source_word: הַהֹלֶכֶת עַל אַרְבַּע
  choice: நான்கு கால்களில் நடக்கும்
  rationale: எபிரெயத்தின் ‘நான்கின்மேல் நடக்கும்’ என்ற சொல்லமைப்பைத் தெளிவான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: טְמֵאִים הֵם לָכֶם
  choice: உங்களுக்குத் தீட்டானவை
  rationale: טמא இங்கு ஒழுக்கக் குற்றத்தைக் காட்டாமல் சடங்குமுறைத் தூய்மை நிலையைக் குறிக்கிறது; ‘தீட்டு’ லேவியராகமச் சூழலுக்கு ஏற்ற தமிழ்ப் பதம்.
- source_word: בְּנִבְלָתָם
  choice: அவற்றின் செத்த உடலை
  rationale: נְבֵלָה என்பது விலங்கின் உயிரற்ற உடலைக் குறிக்கிறது. மூலத்தில் பெயர்ச்சொல் ஒருமையாகவும் உடைமைப் பின்னொட்டு பன்மையாகவும் இருப்பதால் அந்தத் தொகுப்புப் பயன்பாடு தமிழிலும் காக்கப்பட்டது.
- source_word: יִטְמָא עַד הָעָרֶב
  choice: மாலைவரை தீட்டுள்ளவராக இருப்பார்
  rationale: சட்டவிதியின் விளைவையும் சடங்குமுறைத் தீட்டு நீடிக்கும் கால எல்லையையும் இயல்பான, மரியாதையான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: சடங்குமுறைத் தூய்மைச் சொற்பயன்பாடு
  choice: தீட்டானவை / தீட்டுள்ளவராக
  alternative: அசுத்தமானவை / அசுத்தமுள்ளவராக
  rationale: இப்பகுதி முதன்மையாக ஒழுக்கத் தீமையையோ உடல் அழுக்கையையோ அல்ல, வழிபாட்டு மற்றும் சடங்குமுறை நிலையையே ஒழுங்குபடுத்துகிறது. ‘தீட்டு’ அந்த வேறுபாட்டைத் தெளிவாகக் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சட்டவிதிக்கேற்ற கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. நீளமான எபிரெய வாக்கியத்தின் தொடர்பு காக்கப்பட்டுள்ளதுடன், தமிழில் வாசிக்க இயல்பாக சொல்வரிசை மாற்றப்பட்டுள்ளது.
