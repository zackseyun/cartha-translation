source:
  edition: WLC
  text: אֶת אֵ֤לֶּה מֵ/הֶם֙ תֹּאכֵ֔לוּ אֶת הָֽ/אַרְבֶּ֣ה לְ/מִינ֔/וֹ וְ/אֶת הַ/סָּלְעָ֖ם לְ/מִינֵ֑/הוּ וְ/אֶת הַ/חַרְגֹּ֣ל לְ/מִינֵ֔/הוּ וְ/אֶת הֶ/חָגָ֖ב לְ/מִינֵֽ/הוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/022.yaml
  text: 'These of them you may eat: the locust according to its kind[a], and the bald locust according to its kind, and the cricket according to its kind, and the grasshopper according to its kind.'
translation:
  language: ta
  text: 'அவற்றில் இவற்றை நீங்கள் உண்ணலாம்: வெட்டுக்கிளியை அதன் இனத்தின்படியும்,[a] சல்ஆம் பூச்சியை அதன் இனத்தின்படியும், ஹர்கோல் பூச்சியை அதன் இனத்தின்படியும், துள்ளுக்கிளியை அதன் இனத்தின்படியும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வெட்டுக்கிளி’ என்பதைத் தவிர, இங்கு வரும் எபிரெயப் பூச்சிப் பெயர்களின் துல்லியமான அடையாளம் உறுதியல்ல. סָלְעָם என்பதற்கு மரபாக ‘முடியற்ற வெட்டுக்கிளி’ என்றும், חַרְגֹּל என்பதற்கு ‘சில்வண்டு’ என்றும் மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה מֵהֶם
  choice: அவற்றில் இவற்றை
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட சிறகுள்ள கூட்டுப் பூச்சிகளிலிருந்து அனுமதிக்கப்பட்ட ஒரு பகுதியை இச்சொற்றொடர் சுட்டுகிறது; தமிழ் நடையில் சுருக்கமாகவும் தெளிவாகவும் உள்ளது.
- source_word: תֹּאכֵלוּ
  choice: நீங்கள் உண்ணலாம்
  rationale: உணவுச் சட்டத்தின் சூழலில் இவ்வினை அனுமதியைத் தெரிவிக்கிறது; கட்டளையாக அல்லாமல் அனுமதியாக இயல்பான தமிழில் தரப்பட்டுள்ளது.
- source_word: הָאַרְבֶּה
  choice: வெட்டுக்கிளி
  rationale: אַרְבֶּה என்பதற்கான பரவலாக ஏற்கப்பட்ட அடையாளம் locust; நவீனத் தமிழில் ‘வெட்டுக்கிளி’ இயல்பான பொதுப்பெயர்.
- source_word: לְמִינוֹ / לְמִינֵהוּ
  choice: அதன் இனத்தின்படி
  rationale: தோராவில் மீண்டும் வரும் வகைப்பாட்டு வாய்பாட்டைத் தெளிவாகவும் நெருக்கமாகவும் பாதுகாக்கிறது.
- source_word: הַסָּלְעָם
  choice: சோலாம் பூச்சி
  rationale: துல்லியமான உயிரியல் அடையாளம் உறுதியல்ல. ஊகமான ‘முடியற்ற வெட்டுக்கிளி’ என்பதைக் கட்டாயப்படுத்தாமல் எபிரெயப் பெயரை ஒலிபெயர்த்து, ‘பூச்சி’ என வகையைத் தெளிவுபடுத்துகிறது.
- source_word: הַחַרְגֹּל
  choice: கர்கோல் பூச்சி
  rationale: இப்பூச்சியின் துல்லியமான அடையாளம் உறுதியல்ல; ‘சில்வண்டு’ அல்லது வேறு குறிப்பிட்ட இனத்தை உறுதியாகத் தேர்வுசெய்யாமல் எபிரெயப் பெயர் ஒலிபெயர்க்கப்படுகிறது.
- source_word: הֶחָגָב
  choice: துள்ளுக்கிளி
  rationale: חָגָב என்பது தாவிச் செல்லும் grasshopper வகைப் பூச்சியைக் குறிக்கிறது. அதே வசனத்தில் אַרְבֶּה என்பதற்கு ‘வெட்டுக்கிளி’ பயன்படுத்தப்பட்டதால், இரண்டையும் வேறுபடுத்த ‘துள்ளுக்கிளி’ தேர்ந்தெடுக்கப்பட்டது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், சட்ட உரைக்கேற்ற கண்ணியமான ஆனால் எளிதில் புரியும் நடை. உறுதியற்ற பூச்சிப் பெயர்களை ஊகமாகத் தீர்மானிக்காமல் ஒலிபெயர்த்து, அவற்றின் வகையை ‘பூச்சி’ எனத் தெளிவுபடுத்துகிறது. அடிக்குறி குறியீடு [a] முதன்மை உரையில் இடம்பெற்றுள்ளது.
