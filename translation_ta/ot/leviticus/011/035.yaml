  text: וְ֠/כֹל אֲשֶׁר יִפֹּ֨ל מִ/נִּבְלָתָ֥/ם עָלָי/ו֮ יִטְמָא֒ תַּנּ֧וּר וְ/כִירַ֛יִם יֻתָּ֖ץ טְמֵאִ֣ים הֵ֑ם וּ/טְמֵאִ֖ים יִהְי֥וּ לָ/כֶֽם־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/035.yaml
  text: And anything on which any part of their carcass falls shall become unclean[a]. Whether oven or hearth, it must be broken down; they are unclean[b], and they shall be unclean for you.
translation:
  language: ta
  text: அவற்றின் இறந்த உடலிலிருந்து ஏதேனும் ஒன்று எதன்மேல் விழுந்தாலும், அது தீட்டாகும்.[a] அடுப்பும் கணப்பும்[b] இடித்துத் தள்ளப்பட வேண்டும்; அவை தீட்டானவை; அவை உங்களுக்குத் தீட்டானவையாக இருக்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இறந்த உடல்’ என்பதற்கு ‘சடலம்’ அல்லது ‘இறந்த உடல்கள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் இங்கு தூய்மைச் சட்டச் சூழலில் தீட்டான உயிரினத்தின் இறந்த உடலைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘கணப்பு’ என்பது சமைப்பதற்கான ஓர் அமைப்பைக் குறிக்கிறது; எபிரெயச் சொல் பானை வைக்கும் அடுப்பு, கணப்பு, அல்லது நெருப்பிடம் போன்ற அமைப்பைக் குறிக்கக்கூடும்.
    reason: cultural_note
lexical_decisions:
- source_word: נִבְלָתָם
  choice: அவற்றின் செத்த உடல்
  rationale: נְבֵלָה என்பது தூய்மைச் சட்டச் சூழலில் இறந்த விலங்கின் உடலைக் குறிக்கிறது. தமிழில் ‘செத்த உடல்’ என்பது பொதுமக்களுக்கு இயல்பாகவும் விலங்கைக் குறிக்கும் சூழலில் தெளிவாகவும் உள்ளது; ஒருமை வடிவத்தின் தொகுப்புப் பொருளையும் பாதுகாக்கிறது.
- source_word: יִפֹּל
  choice: விழுகிறதோ
  rationale: சட்டத்தில் பொதுவாக நிகழக்கூடிய நிலையை எபிரெய imperfect வடிவம் சுட்டுகிறது; தமிழின் நிபந்தனைத் தொடர்பமைப்பு இயல்பாக அந்தப் பொதுவிதியை வெளிப்படுத்துகிறது.
- source_word: עָלָיו יִטְמָא
  choice: எதன்மேல் ... அது தீட்டுப்படும்
  rationale: செத்த உடலின் ஒரு பகுதி விழும் பொருள் சடங்குசார் தீட்டு நிலையை அடைவதை ‘தீட்டுப்படும்’ தெளிவாகக் காட்டுகிறது.
- source_word: תַּנּוּר
  choice: அடுப்பு
  rationale: இச்சொல் அப்பம் சுடுவதற்கான அடுப்பைக் குறிக்கிறது; ‘அடுப்பு’ இயல்பான, பரவலாகப் புரியும் தமிழ் இணை.
- source_word: כִירַיִם
  choice: சமையல் அடுப்பு
  rationale: இது பானைகளை வைத்து சமைக்கும் அமைப்பு, கணப்பு அல்லது அடுப்பு வகையைக் குறிக்கலாம். ‘சமையல் அடுப்பு’ பயன்பாட்டைத் தெளிவாக்குகிறது; துல்லியமான பண்டைய வடிவத்தை அளவுக்கு மீறி நிர்ணயிக்கவில்லை.
- source_word: יֻתָּץ
  choice: இடித்துத் தள்ளப்பட வேண்டும்
  rationale: மாசுபட்ட சமையல் அமைப்பை உடைத்து அகற்ற வேண்டிய சட்டக் கட்டாயத்தை passive வடிவத்துடன் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: טְמֵאִים הֵם
  choice: அவை தீட்டானவை
  rationale: טמא இங்கு ஒழுக்கத் தீமையை அல்ல, சடங்குசார் தூய்மையின்மையைச் சுட்டுகிறது. லேவியராகமத்தின் தூய்மைச் சட்ட மொழிக்கு ‘தீட்டு’ பொருத்தமான முக்கியச் சொல்.
- source_word: וּטְמֵאִים יִהְיוּ לָכֶם
  choice: அவை உங்களுக்குத் தீட்டானவையாகவே இருக்கும்
  rationale: לָכֶם என்பதன் ‘உங்களுக்கு’ என்ற தொடர்பையும், தொடர்ந்து அவ்வாறே கருதப்பட வேண்டிய நிலையைச் சுட்டும் இயல்பான தமிழையும் பாதுகாக்கிறது.
theological_decisions:
- issue: லேவியத் தூய்மைச் சட்டத்தில் טמא என்பதன் தன்மை
  choice: ‘தீட்டு/தீட்டானவை’ என்று மொழிபெயர்த்தல்
  alternative: ‘சடங்குமுறையில் தூய்மையற்றவை’
  rationale: இங்கு ஒழுக்கக்கேடு அல்ல, சடங்குசார் தூய்மையின்மை குறிக்கப்படுகிறது. ‘தீட்டு’ சுருக்கமாகவும் வேதாகமத் தூய்மைச் சட்டச் சொல்லாகவும் செயல்படுகிறது; விளக்கத்தை மூலவசனத்துக்குள் அதிகமாகச் சேர்ப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் சட்டவிதிக்குரிய உறுதியும் கொண்ட நடை பயன்படுத்தப்பட்டது. ‘தீட்டு’ என்ற முக்கியச் சொல் வசனம் முழுவதும் ஒரே பொருளில் வைக்கப்பட்டுள்ளது. இரண்டு பழங்கால சமையல் அமைப்புகளின் வேறுபாட்டை ‘அடுப்பு’ மற்றும் ‘சமையல் அடுப்பு’ எனக் காட்டி, இரண்டாவது சொல்லின் பொருள் வரம்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
