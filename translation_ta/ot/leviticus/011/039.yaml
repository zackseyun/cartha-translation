revisions:
- from: நீங்கள் உணவாகக் கொள்ளத்தக்க கால்நடைகளில் ஒன்று இறந்துவிட்டால்,[a] அதன் உடலைத் தொடுகிறவர் மாலைவரை தீட்டுப்பட்டவராக இருப்பார்.
  to: உங்களுக்கு உணவாக அனுமதிக்கப்பட்ட கால்நடைகளில் ஒன்று இறந்தால்,[a] அதன் சடலத்தைத் தொடுகிறவர் மாலைவரை சடங்குமுறையில் தூய்மையற்றவராவார்.
  rationale: The revision retains the source's conditional and partitive wording while rendering נְבֵלָה as 'சடலம்' (carcass/dead body). It also makes the ritual sense of יִטְמָא explicit, without adding a doctrinal interpretation.
