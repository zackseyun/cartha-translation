    text: சொற்சார்ந்து, “உங்களுக்கு உணவாக இருப்பவைகளில் ஒன்று.” இந்த எபிரெயச் சொற்றொடர் உணவாக அனுமதிக்கப்பட்ட விலங்குகளைக் குறிக்கிறது.
    reason: lexical_alternative
