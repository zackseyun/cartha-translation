source:
  edition: WLC
  text: וְ/כִ֤י יָמוּת֙ מִן הַ/בְּהֵמָ֔ה אֲשֶׁר הִ֥יא לָ/כֶ֖ם לְ/אָכְלָ֑ה הַ/נֹּגֵ֥עַ בְּ/נִבְלָתָ֖/הּ יִטְמָ֥א עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/039.yaml
  text: And if any of the livestock that may be used for food dies[a], the one who touches its carcass shall be unclean until the evening.
translation:
  language: ta
  text: உங்களுக்கு உணவாக அனுமதிக்கப்பட்ட கால்நடைகளில் ஒன்று இறந்தால்,[a] அதன் சடலத்தைத் தொடுகிறவர் மாலைவரை சடங்குமுறையில் தூய்மையற்றவராவார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்சார்ந்து, “உங்களுக்கு உணவாக இருப்பவைகளில் ஒன்று.” இந்த எபிரெயச் சொற்றொடர் உணவாக அனுமதிக்கப்பட்ட விலங்குகளைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: …இறந்துவிட்டால்
  rationale: முந்தைய விதிமுறைகளுடன் தொடர்ச்சியுடைய ஒரு நிபந்தனை நிகழ்வை அறிமுகப்படுத்துகிறது; தமிழில் இயல்பான நிபந்தனை வாக்கிய அமைப்பு அந்தத் தொடர்பை போதுமான அளவு வெளிப்படுத்துகிறது.
- source_word: יָמוּת
  choice: இறந்துவிட்டால்
  rationale: நிபந்தனை வாக்கியத்திலுள்ள வினைச்சொல்லின் பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: מִן הַבְּהֵמָה
  choice: கால்நடைகளில் ஒன்று
  rationale: מִן என்பதன் பகுதிப்பொருளை ‘…களில் ஒன்று’ எனத் தெளிவாகக் காட்டுகிறது; இச்சூழலில் בְּהֵמָה என்பது வளர்ப்பு விலங்குகளை, குறிப்பாக கால்நடைகளை, குறிக்கிறது.
- source_word: אֲשֶׁר הִיא לָכֶם לְאָכְלָה
  choice: நீங்கள் உணவாகக் கொள்ளத்தக்க
  rationale: உணவாக அனுமதிக்கப்பட்ட விலங்குகளின் வகையைச் சுட்டுகிறது; எபிரெய உரையின் சொற்சார்ந்த வடிவையும் இயல்பான தமிழையும் சமநிலைப்படுத்துகிறது.
- source_word: הַנֹּגֵעַ
  choice: தொடுகிறவர்
  rationale: செயலைச் செய்பவரைக் குறிக்கும் பெயர்ச்சொல் தன்மையுள்ள வினையெச்சத்தை சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: בְּנִבְלָתָהּ
  choice: அதன் உடலை
  rationale: நְבֵלָה இங்கே இயற்கையாக இறந்த விலங்கின் உயிரற்ற உடலைக் குறிக்கிறது; தமிழில் ‘அதன் உடல்’ தெளிவாகவும் மரியாதையான நடையிலும் உள்ளது.
- source_word: יִטְמָא
  choice: தீட்டுப்பட்டவராக இருப்பார்
  rationale: சடங்குமுறைத் தூய்மையின்மையைக் குறிக்கும் சட்டச் சூழலைத் துல்லியமாக வெளிப்படுத்துகிறது; சாதாரண அழுக்கு என்ற பொருளைத் தவிர்க்கிறது.
- source_word: עַד הָעָרֶב
  choice: மாலைவரை
  rationale: குறிப்பிடப்பட்ட தூய்மையின்மை நீடிக்கும் கால எல்லையை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: יִטְמָא குறிக்கும் தூய்மையின்மையின் தன்மை
  choice: தீட்டுப்பட்டவராக இருப்பார்
  alternative: அசுத்தமானவராக இருப்பார்
  rationale: லேவியராகமத்தின் சடங்குமுறைச் சூழலைக் காட்ட ‘தீட்டு’ பொருத்தமானது; இது ஒழுக்கக் குற்றம் அல்லது சாதாரண அழுக்கு என்று தவறாகப் புரிந்துகொள்வதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழ்; சட்டவிதியின் கண்ணியமான தொனி பேணப்பட்டுள்ளது. ‘கால்நடைகளில் ஒன்று’ பகுதிப்பொருளையும், ‘தீட்டுப்பட்டவர்’ சடங்குமுறைத் தூய்மையின்மையையும் தெளிவுபடுத்துகிறது.
