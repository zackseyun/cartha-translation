  text: 'And by these you shall become unclean: everyone who touches their carcass shall be unclean until the evening[a][b].'
translation:
  language: ta
  text: இவற்றால் நீங்கள் தீட்டுப்படுவீர்கள்:[a] இவற்றின் பிணத்தைத் தொடுகிற எவரும் மாலைவரை தீட்டுள்ளவராக இருப்பார்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இவற்றைக் குறித்து நீங்கள் தீட்டுப்படுவீர்கள்.” தொடக்கச் சொற்றொடர், இவற்றால் தீட்டு ஏற்படுகிறது என்று கூறுவதற்குப் பதிலாக, அடுத்து வரும் பிரிவைப் பொதுவாக அறிமுகப்படுத்தக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் “இவற்றின் பிணம்” என்பதில் ‘பிணம்’ ஒருமையாகவும், உரிமைச் சுட்டு பன்மையாகவும் உள்ளது; “இவற்றின் பிணங்களை” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְאֵלֶּה
  choice: இவற்றால்
  rationale: לְ முன்னொட்டு இங்கு காரணம் அல்லது தொடர்புடைய பிரிவை அறிமுகப்படுத்தலாம். சூழலில் ‘இவற்றால்’ என்பது தீட்டு ஏற்படுவதைக் இயல்பாகக் காட்டுகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: תִּטַּמָּאוּ
  choice: நீங்கள் தீட்டுப்படுவீர்கள்
  rationale: இது இரண்டாம் நபர் ஆண்பால் பன்மை வடிவம்; சடங்குசார் அசுத்த நிலையைச் சுட்டுகிறது, ஒழுக்கக் குற்றத்தை அல்ல. ‘தீட்டுப்படுவீர்கள்’ என்பது விளைவாக ஏற்படும் நிலையைத் தெளிவாகக் கூறுகிறது.
- source_word: כָּל הַנֹּגֵעַ
  choice: தொடுகிற எவரும்
  rationale: כָּל உடன் வரும் ஒருமை வினையெச்சம் பொதுவான, அனைவரையும் உள்ளடக்கும் பொருளைக் கொண்டது. நவீன தமிழில் ‘எவரும்’ இயல்பாக உள்ளது.
- source_word: בְּנִבְלָתָם
  choice: இவற்றின் பிணத்தை
  rationale: נְבֵלָה இறந்த விலங்கின் உடலைக் குறிக்கிறது. எபிரெயத்தில் பெயர்ச்சொல் ஒருமையிலும் உரிமைச் சுட்டு பன்மையிலும் உள்ளது; அதைத் தமிழில் ‘இவற்றின் பிணத்தை’ என நேரடியாகப் பாதுகாக்கப்பட்டுள்ளது.
- source_word: יִטְמָא
  choice: தீட்டுள்ளவராக இருப்பார்
  rationale: பொதுமைப் பொருளுடைய ஒருமை எழுவாய்க்கு ஏற்ற ஒருமை வடிவம். இங்கு தொடர்புக்குப் பின் நிலவும் சடங்குசார் தீட்டு நிலையை வெளிப்படுத்துகிறது.
- source_word: עַד הָעָרֶב
  choice: மாலைவரை
  rationale: சடங்குசார் தீட்டு நீடிக்கும் கால எல்லையைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது.
theological_decisions:
- issue: பரிசுத்தச் சட்டங்களில் טמא என்பதன் தன்மை
  choice: ஒழுக்கக் குற்றமாக அல்லாமல் சடங்குசார் தீட்டு நிலையாக ‘தீட்டு’ என்ற சொற்பயன்பாட்டில் மொழிபெயர்த்தல்
  alternative: அசுத்தம் / களங்கம்
  rationale: இவ்வசனம் விலங்கின் பிணத்தைத் தொடுவதால் ஏற்படும் சடங்குசார் நிலையைக் குறிக்கிறது. ‘தீட்டு’ தமிழில் இந்த வழிபாட்டுச் சட்டப் பிரிவைத் தெளிவாகக் காட்டுகிறது; ஒழுக்கரீதியான குற்றத்தைத் தேவையின்றி உட்புகுத்தாது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சட்ட உரைக்கேற்ற கண்ணியமான மற்றும் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘தீட்டு’ என்பது இச்சூழலின் சடங்குசார் அசுத்தத்தைச் சுட்டுகிறது. மூலத்தின் ஒருமை–பன்மை அமைப்பும் தொடக்கச் சொல்லின் பொருள் நெகிழ்வும் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
