base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/026.yaml
  text: As for every animal that has a divided hoof[a], but does not split the hoof completely and does not chew the cud, they are unclean to you. Everyone who touches them shall be unclean.
translation:
  language: ta
  text: குளம்பு பிளவுபட்டிருந்தாலும், அதன் பிளவு முழுமையாகப் பிரிந்திருக்காமலும்[a], அசைபோடாமலும் இருக்கும் எல்லா விலங்குகளும் உங்களுக்குத் தீட்டானவை. அவற்றைத் தொடுகிற எவரும் தீட்டுப்படுவார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்சொல்லாக, “ஒரு பிளவைப் பிளக்காமலும்”; எபிரெயச் சொற்றொடர் குளம்பின் பிளவு முழுமையாகப் பிரிந்திருப்பதை வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכָל הַבְּהֵמָה
  choice: எல்லா விலங்குகளும்
  rationale: לְ இங்கு விவாதிக்கப்படும் வகையை அறிமுகப்படுத்துகிறது; தமிழில் தனியாக ‘என்றால்’ போன்ற தொடர் தேவையில்லாமல், முழு வாக்கிய அமைப்பே அந்தப் பொருளை இயல்பாக வெளிப்படுத்துகிறது. בְּהֵמָה நிலவாழ் விலங்கைக் குறிக்கும் பொதுச்சொல்.
- source_word: מַפְרֶסֶת פַּרְסָה
  choice: குளம்பு பிளவுபட்டிருந்தும்
  rationale: எபிரெயச் சொற்றொடர் பிளவுபட்ட குளம்பைக் கொண்டிருப்பதைக் குறிக்கிறது. அடுத்த எதிர்மறை நிபந்தனையோடு இயல்பாக இணைய ‘இருந்தும்’ பயன்படுத்தப்பட்டது.
- source_word: וְשֶׁסַע אֵינֶנָּה שֹׁסַעַת
  choice: அது முழுமையாகப் பிளந்திருக்காமலும்[a]
  rationale: ஒரே வேரைச் சேர்ந்த பெயர்ச்சொல்–வினைச்சொல் அமைப்பு குளம்பின் பிளவு முழுமையாக இருப்பதை வலியுறுத்துகிறது. ‘முழுமையாக’ அந்த வலியுறுத்தலை வாசிக்கத் தெளிவாகக் காட்டுகிறது; சொற்சொல் வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְגֵרָה אֵינֶנָּה מַעֲלָה
  choice: அசைபோடாமலும்
  rationale: சொற்சொல்லாக ‘அசையை மேலே கொண்டுவருதல்’ என்றாலும், தமிழில் மெல்லுண்டதை மீண்டும் வாய்க்குக் கொண்டுவந்து மெல்லும் செயலைக் குறிக்கும் நிலையான சொல் ‘அசைபோடுதல்’.
- source_word: טְמֵאִים הֵם לָכֶם
  choice: உங்களுக்குத் தீட்டானவை
  rationale: லேவியராகமத்தின் சடங்கு சார்ந்த தூய்மை வகைப்பாட்டில் טָמֵא என்பதற்கு ‘தீட்டு’ இயல்பான தமிழ் இணை. לָכֶם குறிக்கும் ‘உங்களுக்கு’ என்ற சட்ட/உடன்படிக்கை நோக்கும் பாதுகாக்கப்பட்டுள்ளது.
- source_word: כָּל הַנֹּגֵעַ בָּהֶם
  choice: அவற்றைத் தொடுகிற எவரும்
  rationale: כָּל உடன் வரும் ஒருமை வினையெச்சம் பொதுவாக யாரையும் உள்ளடக்கும் விதியைத் தெரிவிக்கிறது; ‘எவரும்’ அதைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: יִטְמָא
  choice: தீட்டுப்படுவார்
  rationale: இங்கு imperfect வடிவம் தொடுதலின் சட்டரீதியான விளைவைச் சொல்கிறது. ‘தீட்டுப்படுவார்’ அதன் விளைவாக ஒருவர் தீட்டான நிலையை அடைவதை இயல்பான தமிழில் காட்டுகிறது.
theological_decisions:
- issue: லேவிய தூய்மைச் சட்டத்தில் טָמֵא என்ற சொல்
  choice: தீட்டானவை / தீட்டுப்படுவார்
  alternative: அசுத்தமானவை / அசுத்தமாவார்
  rationale: இவ்வசனம் முதன்மையாகச் சடங்கு சார்ந்த தூய்மை வகையைப் பற்றியது; ஒழுக்கக்கேட்டை அவசியமாகக் குறிக்கவில்லை. ‘தீட்டு’ இந்தச் சட்ட–சடங்கு வேறுபாட்டைத் தமிழில் தெளிவாகப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகருக்குப் புரியும் சட்ட–சடங்கு நடையில் மொழிபெயர்க்கப்பட்டது. ‘குளம்பு’, ‘அசைபோடுதல்’, ‘தீட்டு’ ஆகிய நிலையான சொற்கள் பயன்படுத்தப்பட்டுள்ளன; மூலத்தின் வகைப்பாட்டு அமைப்பும் சட்டரீதியான விளைவும் பாதுகாக்கப்பட்டுள்ளன.
