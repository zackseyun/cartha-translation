- from: 'அவற்றில் ஏதாவது ஒன்று செத்திருக்கும்போது எதன்மேல் விழுகிறதோ, அது தீட்டுப்படும்: மரத்தால் செய்யப்பட்ட எந்தப் பொருளானாலும், ஆடையானாலும், தோலானாலும், சாக்குத் துணியானாலும்—வேலை செய்வதற்குப் பயன்படுத்தப்படும் எந்தப் பொருளானாலும்—அது தண்ணீருக்குள் போடப்பட வேண்டும்.[a] மாலைவரை அது தீட்டாக இருக்கும்; அதன்பின் அது சுத்தமாகும்.'
  to: அவற்றில் ஏதாவது ஒன்று இறந்தபின் எதன்மேல் விழுகிறதோ, அது தீட்டுப்படும்—மரத்தாலான எந்தப் பொருளாயினும், ஆடையாயினும், தோலாயினும், சாக்குத்துணியாயினும், வேலைக்குப் பயன்படும் எந்தப் பொருளாயினும். அது தண்ணீருக்குள் கொண்டுவரப்பட வேண்டும்.[a] மாலைவரை அது தீட்டாக இருக்கும்; பின்னர் அது சுத்தமாகும்.
  rationale: 'The revision makes two restrained improvements only: it replaces an awkward expression for the creatures’ death with idiomatic “இறந்தபின்,” and it renders the passive Hebrew יוּבָא more literally as “கொண்டுவரப்பட வேண்டும்.” The broad scope of כְּלִי, the ritual—not moral—sense of impurity, and the source text’s lack of an explicit requirement of total immersion remain preserved.'
