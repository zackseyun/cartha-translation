  text: וְ/כֹ֣ל אֲשֶׁר יִפֹּל עָלָי/ו֩ מֵ/הֶ֨ם בְּ/מֹתָ֜/ם יִטְמָ֗א מִ/כָּל כְּלִי עֵץ֙ א֣וֹ בֶ֤גֶד אוֹ עוֹר֙ א֣וֹ שָׂ֔ק כָּל כְּלִ֕י אֲשֶׁר יֵעָשֶׂ֥ה מְלָאכָ֖ה בָּ/הֶ֑ם בַּ/מַּ֧יִם יוּבָ֛א וְ/טָמֵ֥א עַד הָ/עֶ֖רֶב וְ/טָהֵֽר־־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/032.yaml
  text: And everything on which any of them falls when they are dead shall become unclean—from any wooden vessel or garment or skin or sackcloth, any vessel with which work is done. It shall be put into the water, and it shall be unclean until the evening; then it shall be clean.
translation:
  language: ta
  text: அவற்றில் ஏதாவது ஒன்று இறந்தபின் எதன்மேல் விழுகிறதோ, அது தீட்டுப்படும்—மரத்தாலான எந்தப் பொருளாயினும், ஆடையாயினும், தோலாயினும், சாக்குத்துணியாயினும், வேலைக்குப் பயன்படும் எந்தப் பொருளாயினும். அது தண்ணீருக்குள் கொண்டுவரப்பட வேண்டும்.[a] மாலைவரை அது தீட்டாக இருக்கும்; பின்னர் அது சுத்தமாகும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அது தண்ணீரில் மூழ்கடிக்கப்பட வேண்டும்.” எபிரெயத்தில் சொற்சொல்லாக, “அது தண்ணீருக்குள் கொண்டுவரப்பட வேண்டும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל אֲשֶׁר יִפֹּל עָלָיו מֵהֶם בְּמֹתָם
  choice: அவற்றில் ஏதாவது ஒன்று செத்திருக்கும்போது எதன்மேல் விழுகிறதோ
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட உயிரினங்களைப் பின்னோக்கிச் சுட்டும் מֵהֶם என்பதன் பகிர்வுப் பொருளையும், בְּמֹתָם குறிக்கும் இறந்த நிலையையும் இயல்பான தமிழில் காக்கிறது.
- source_word: יִטְמָא
  choice: அது தீட்டுப்படும்
  rationale: சடங்கு சார்ந்த தூய்மைநிலையிலிருந்து தீட்டு நிலைக்கு ஏற்படும் மாற்றத்தைத் தெரிவிக்கிறது; ஒழுக்கக் குற்றத்தை உட்புகுத்துவதில்லை.
- source_word: מִכָּל כְּלִי עֵץ
  choice: மரத்தால் செய்யப்பட்ட எந்தப் பொருளானாலும்
  rationale: כְּלִי என்பது பாத்திரம் மட்டுமல்லாமல் கருவி அல்லது பயன்பாட்டுப் பொருளையும் குறிக்கக்கூடிய விரிந்த சொல்; தமிழில் ‘பொருள்’ அந்த விரிவைக் காக்கிறது.
- source_word: בֶגֶד אוֹ עוֹר אוֹ שָׂק
  choice: ஆடையானாலும், தோலானாலும், சாக்குத் துணியானாலும்
  rationale: பட்டியலின் பொருள் வகைகளைத் தெளிவாகவும் நவீனத் தமிழில் புரியுமாறும் தருகிறது; שָׂק என்பதற்கு அதன் கரடுமுரடான நெய்த பொருள் தன்மையை ‘சாக்குத் துணி’ காட்டுகிறது.
- source_word: כָּל כְּלִי אֲשֶׁר יֵעָשֶׂה מְלָאכָה בָּהֶם
  choice: வேலை செய்வதற்குப் பயன்படுத்தப்படும் எந்தப் பொருளானாலும்
  rationale: எபிரெயப் பகுதியின் செயப்பாட்டு மற்றும் கருவிப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது; முன் பட்டியலிடப்பட்ட பொருட்களால் ஆன பயன்பாட்டுப் பொருளைச் சுட்டுகிறது.
- source_word: בַּמַּיִם יוּבָא
  choice: அது தண்ணீருக்குள் போடப்பட வேண்டும்
  rationale: ஹொஃப்அல் வடிவின் ‘தண்ணீருக்குள் கொண்டுவரப்படுதல்’ என்ற அடிப்படை எண்ணத்தை இயல்பான சட்டநடைத் தமிழில் தருகிறது; முழுக்க மூழ்கடிக்கப்பட வேண்டும் என்று பிரதான உரையில் தீர்மானிக்கவில்லை.
- source_word: וְטָמֵא עַד הָעֶרֶב וְטָהֵר
  choice: மாலைவரை அது தீட்டாக இருக்கும்; அதன்பின் அது சுத்தமாகும்
  rationale: தீட்டு நீடிக்கும் காலத்தையும் அதன் பின்னர் ஏற்படும் சுத்தநிலையையும் தெளிவான காலவரிசையில் காக்கிறது.
theological_decisions:
- issue: தீட்டு மற்றும் சுத்தம் என்பவற்றின் இயல்பு
  choice: טמא/טהר என்பவற்றை ‘தீட்டு/சுத்தம்’ என்ற சடங்கு-சட்டச் சொற்களால் மொழிபெயர்த்தல்
  alternative: அசுத்தம்/தூய்மை அல்லது களங்கம்/களங்கமின்மை
  rationale: லேவியராகமத்தின் இச்சூழல் முதன்மையாகச் சடங்கு நிலையைப் பற்றியது. ‘தீட்டு/சுத்தம்’ என்பது ஒழுக்கக் குற்றம் அல்லது பாவம் என்ற கருத்தை தேவையின்றி சேர்க்காமல் தமிழில் இதைத் தெளிவாக உணர்த்துகிறது.
- issue: தண்ணீரில் இடும் செயலின் அளவு
  choice: ‘தண்ணீருக்குள் போடப்பட வேண்டும்’ என்று மொழிபெயர்த்து செயலைக் குறிப்பிடுதல்
  alternative: ‘தண்ணீரில் முழுக்க மூழ்கடிக்கப்பட வேண்டும்’
  rationale: בַּמַּיִם יוּבָא என்பதன் நேரடிப் பொருள் ‘தண்ணீருக்குள் கொண்டுவரப்பட வேண்டும்.’ சூழலில் மூழ்கடித்தல் சாத்தியமானாலும், அந்தத் துல்லியத்தை எபிரெயச் சொல் வெளிப்படையாகக் கட்டாயப்படுத்தாததால் அடிக்குறிப்பில் மாற்று தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான சட்டநடை பயன்படுத்தப்பட்டுள்ளது. ‘தீட்டு/சுத்தம்’ என்ற இணை சடங்கு நிலையைத் தெளிவாக்குகிறது. כְּלִי என்பதன் விரிவைச் சுருக்காமல் இருக்க ‘பொருள்’ பயன்படுத்தப்பட்டது; பட்டியல் மற்றும் அதன் சுருக்கவுரை கோடுகளால் தெளிவுபடுத்தப்பட்டுள்ளன.
