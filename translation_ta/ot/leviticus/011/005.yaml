reference: Leviticus 11:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/אֶת הַ/שָּׁפָ֗ן כִּֽי מַעֲלֵ֤ה גֵרָה֙ ה֔וּא וּ/פַרְסָ֖ה לֹ֣א יַפְרִ֑יס טָמֵ֥א ה֖וּא לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/005.yaml
  text: And the rock badger[a], because it chews the cud but does not divide the hoof, is unclean for you.
translation:
  language: ta
  text: பாறை ஹைராக்ஸ்[a] அசைபோடுகிறது; ஆனால் அதன் குளம்பு பிளவுபடவில்லை. ஏனெனில், அது உங்களுக்குத் தீட்டானது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பாறைக் குழிமுயல்.’ பாரம்பரிய மொழிபெயர்ப்புகளில் ‘குழிமுயல்’ என்றும் உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׁפָן
  choice: பாறைக் குழிமுயல்
  rationale: இச்சொல் பாறைகளில் வாழும் சிறிய பாலூட்டியான ஹைராக்ஸைக் குறிக்கிறது. ‘பாறைக் குழிமுயல்’ என்பது தமிழில் ஓரளவு அறியப்பட்ட, வாசகருக்கு விளங்கக்கூடிய பெயர்; விலங்கியல் துல்லியமான ‘ஹைராக்ஸ்’ அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: כִּי
  choice: —
  rationale: எபிரெயத்தில் காரணத்தை அறிமுகப்படுத்தும் כִּי உள்ளது. ஆனால் முந்தைய வசனத்திலிருந்து தொடரும் சட்டப்பட்டியலின் தமிழ் வாக்கிய அமைப்பில் தனியே ‘ஏனெனில்’ சேர்ப்பது இயல்பற்றதாக இருப்பதால், காரண உறவு அரைப்புள்ளியால் இணைக்கப்பட்ட விளக்கக் கூற்றுகளில் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: מַעֲלֵה גֵרָה
  choice: அசைபோடுகிறது
  rationale: அசையை மீண்டும் வாய்க்குக் கொண்டுவந்து மெல்லுவதைக் குறிக்கும் எபிரெய மொழிமரபுக்கு இயல்பான, வழக்கிலுள்ள தமிழ் இணைச்சொல்.
- source_word: וּפַרְסָה לֹא יַפְרִיס
  choice: அதன் குளம்பு பிளவுபட்டதல்ல
  rationale: பிளவுபட்ட குளம்பு இல்லாமையைத் தெளிவாகச் சொல்கிறது. எபிரெய வினை வடிவை செயற்கையாக நகலெடுக்காமல் அதன் வகைப்பாட்டு பொருளைப் பாதுகாக்கிறது.
- source_word: טָמֵא
  choice: தீட்டானது
  rationale: லேவியராகமத்தின் சடங்கு மற்றும் உணவுச் சட்டச் சூழலில் உள்ள தூய்மைநிலைக்கு எதிரான சட்டநிலையை ‘தீட்டு’ இயல்பாகக் குறிக்கிறது; விலங்கு ஒழுக்கரீதியில் தீயது என்ற பொருளைத் தவிர்க்கிறது.
- source_word: לָכֶם
  choice: உங்களுக்கு
  rationale: இவ்வகைப்பாடு உரையாடப்படும் சமூகத்தினருக்குப் பொருந்துவதை நேரடியாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: லேவியராகமத்தின் உணவுச் சட்டத்தில் טָמֵא என்பதன் தன்மை
  choice: சடங்கு/சட்ட வகைப்பாட்டைக் குறிக்கும் ‘தீட்டானது’
  alternative: ஒழுக்கரீதியாக அசுத்தமானது அல்லது தீயது
  rationale: லேவியராகமம் 11-இல் இச்சொல் விலங்கின் உள்ளார்ந்த ஒழுக்கத் தீமையை அல்ல, இஸ்ரவேலருக்கான தூய்மை அமைப்பில் அதன் நிலையைச் சுட்டுகிறது.
translation_notes:
  register: நவீனத் தரத்தமிழில், எளிதில் புரியும் ஆனால் கண்ணியமான சட்டநடை பயன்படுத்தப்பட்டுள்ளது. விலங்கின் பொதுப்பெயர் முதன்மை உரையில் தரப்பட்டு, விலங்கியல் பெயர் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
