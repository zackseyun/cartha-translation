review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys cud-chewing, the lack of a divided hoof, and ritual uncleanness. However, it omits the explicit causal force of כִּי ('because/for') and adds 'மேலும்' ('moreover'), which is not represented by the Hebrew conjunction-object construction. The animal term is better rendered by the zoologically precise 'ஹைராக்ஸ்' in the text, with the traditional descriptive alternative in a note.
  naturalness: The proposed revision uses clear modern standard Tamil and a natural legal-classificatory rhythm. 'குளம்பு பிளவுபடவில்லை' is more idiomatic than 'குளம்பு பிளவுபட்டதல்ல.'
  terminology: '''அசைபோடுகிறது'' is the established Tamil expression for the Hebrew dietary idiom. ''தீட்டானது'' suitably retains the ritual/legal category of טָמֵא without suggesting moral evil. ''பாறை ஹைராக்ஸ்'' avoids identifying the animal as an actual rabbit while retaining a readable traditional alternative in the footnote.'
  issues:
  - severity: medium
    issue: The causal particle כִּי is not translated.
    rationale: The semicolon alone does not adequately express the stated reason for the classification. Tamil can convey it naturally with 'ஏனெனில்.'
  - severity: low
    issue: ‘மேலும்’ adds a discourse meaning not present in the source.
    rationale: וְאֶת introduces the animal as the next item in the list; it does not specifically mean 'moreover.'
  - severity: low
    issue: ‘குளம்பு பிளவுபட்டதல்ல’ is less natural Tamil.
    rationale: ‘அதன் குளம்பு பிளவுபடவில்லை’ states the relevant classification naturally and accurately.
  - severity: low
    issue: The primary animal name may misleadingly suggest a rabbit.
    rationale: שָׁפָן is commonly identified as the rock hyrax, not a rabbit. Using ‘ஹைராக்ஸ்’ in the main text is more precise, while preserving ‘பாறைக் குழிமுயல்’ as an alternative.
  revised_text: பாறை ஹைராக்ஸ்[a] அசைபோடுகிறது; ஆனால் அதன் குளம்பு பிளவுபடவில்லை. ஏனெனில், அது உங்களுக்குத் தீட்டானது.
  revised_footnotes:
