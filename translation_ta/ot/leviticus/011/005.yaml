revisions:
- from: மேலும், பாறைக் குழிமுயல்[a] அசைபோடுகிறது; ஆனால் அதன் குளம்பு பிளவுபட்டதல்ல. அது உங்களுக்குத் தீட்டானது.
  to: பாறை ஹைராக்ஸ்[a] அசைபோடுகிறது; ஆனால் அதன் குளம்பு பிளவுபடவில்லை. ஏனெனில், அது உங்களுக்குத் தீட்டானது.
  rationale: The revision removes the unsupported additive ‘மேலும்,’ explicitly represents the Hebrew causal particle, improves the hoof clause’s naturalness, and uses the zoologically precise animal name. The Hebrew wording’s classificatory logic and the ritual sense of ‘unclean’ are retained.
