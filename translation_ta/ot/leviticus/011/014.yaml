  text: the kite[a], and the falcon according to its kind,
translation:
  language: ta
  text: செம்பருந்தையும்[a], வல்லூறையும் அதன் இனத்தின்படி,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இந்தப் பறவைப் பெயர்கள் எந்தப் பறவைகளைக் குறிக்கின்றன என்பது துல்லியமாகத் தெரியவில்லை; முதல் பெயரை ‘பிணந்தின்னிக் கழுகு’ என்றும், இரண்டாவதை ‘செம்பருந்து’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדָּאָה
  choice: செம்பருந்து
  rationale: இச்சொல் குறிக்கும் பறவையின் துல்லியமான இனம் உறுதியில்லை. வேட்டையாடும் பறவையைக் குறிக்கும் இயல்பான நவீனத் தமிழ்ச் சொல்லாகவும், அடுத்த எபிரெயப் பறவைப் பெயரிலிருந்து வேறுபடுத்தவும் ‘செம்பருந்து’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: הָאַיָּה
  choice: வல்லூறு
  rationale: இது ஒரு வேட்டைப் பறவையைக் குறிக்கும்; வல்லூறு அல்லது செம்பருந்து போன்ற அடையாளங்கள் முன்வைக்கப்படுகின்றன. இரண்டு தனித்த எபிரெயப் பெயர்களையும் தமிழில் வேறுபடுத்திக் காட்ட ‘வல்லூறு’ பயன்படுத்தப்பட்டது.
- source_word: לְמִינָהּ
  choice: அதன் இனங்களோடு
  rationale: ‘அதன் இனத்தின்படி’ என்பது நேரடி வடிவம்; பறவைப் பட்டியலில் அந்தப் பறவையின் பல்வேறு வகைகளையும் உள்ளடக்கும் வகைப்பாட்டுப் பொருளை இயல்பான தமிழில் ‘அதன் இனங்களோடு’ தெரிவிக்கிறது.
- source_word: וְאֶת ... וְאֶת
  choice: …ஐயும், …ஐயும்
  rationale: אֵת என்னும் நேரடி செயப்படுபொருள் குறியீடு தனியே மொழிபெயர்க்கப்படாது; தொடரும் பட்டியலின் இணைப்பு அமைப்பு தமிழின் ‘-ஐயும்’ வடிவால் இயல்பாகக் காட்டப்படுகிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், வேதாகமப் பட்டியலுக்கேற்ற சுருக்கமானதும் கண்ணியமானதுமான நடை பயன்படுத்தப்பட்டுள்ளது. பறவைகளின் துல்லியமான விலங்கியல் அடையாளம் உறுதியற்றிருப்பது அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
