source:
  edition: WLC
  text: וְ/כָל הַ/שֶּׁ֖רֶץ הַ/שֹּׁרֵ֣ץ עַל הָ/אָ֑רֶץ שֶׁ֥קֶץ ה֖וּא לֹ֥א יֵאָכֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/041.yaml
  text: And every swarming thing that swarms on the earth is detestable[b][a]; it shall not be eaten.
translation:
  language: ta
  text: நிலத்தில் ஊர்ந்து திரியும் சிறிய உயிரினங்கள் அனைத்தும் அருவருப்பானவை[b]; அவற்றை உண்ணக் கூடாது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் இது, “அது உண்ணப்படக் கூடாது” என்ற செயப்பாட்டு வடிவில் உள்ளது.
    reason: translation_form
  - marker: b
    text: அதாவது, உணவாகச் சடங்குமுறைப்படி அருவருப்பானவை. “அருவருக்கத்தக்கவை” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל
  choice: அனைத்தும்
  rationale: כָּל என்பதன் முழுமையான பொருளைத் தெளிவாகக் கொடுக்கிறது; தமிழில் வசனத் தொடர்ச்சி இயல்பாக இருப்பதால் וְ-ஐத் தனியே மொழிபெயர்க்கவில்லை.
- source_word: הַ/שֶּׁרֶץ הַ/שֹּׁרֵץ
  choice: ஊர்ந்து திரியும் சிறிய உயிரினங்கள்
  rationale: שֶׁרֶץ மற்றும் அதே வேரிலான שֹׁרֵץ ஆகியவற்றின் பொருளை நவீனத் தமிழில் இயல்பாகவும், நிலத்துக்கு அருகே நகரும் சிறிய உயிரினங்களைக் குறிக்கும் பரந்த வகைப்பாடாகவும் வழங்குகிறது. எபிரெயச் சொல் மீளுரையைச் சொற்சொல்லாகக் காப்பது தமிழில் செயற்கையாக அமையும்.
- source_word: עַל הָ/אָ֑רֶץ
  choice: நிலத்தில்
  rationale: இவ்வதிகாரத்தின் சூழலில் நீர்வாழ் மற்றும் பறக்கும் உயிரினங்களுக்கு மாறாகத் தரையில் வாழ்ந்து நகரும் உயிரினங்களைக் குறிக்கிறது; ஆகவே ‘நிலத்தில்’ இயல்பானது.
- source_word: שֶׁ֥קֶץ ה֖וּא
  choice: அருவருப்பானவை
  rationale: உணவாக ஏற்கத் தகாத, சடங்குமுறை சார்ந்த அருவருப்பை வெளிப்படுத்துகிறது; பொதுவான ஒழுக்கத் தீமையைத் தேவையின்றி உணர்த்தாது. தமிழ் எண்ணொத்திசைவுக்காக உயிரினங்கள் என்பதுடன் பன்மை பயன்படுத்தப்பட்டுள்ளது.
- source_word: לֹ֥א יֵאָכֵֽל
  choice: அவற்றை உண்ணக் கூடாது
  rationale: எபிரெய நிபால் வடிவிலுள்ள செயப்பாட்டு தடையைத் தமிழில் இயல்பான சட்டத் தடையாக வழங்குகிறது.
theological_decisions:
- issue: שֶׁקֶץ என்பதன் மதச்சட்டச் சார்பு
  choice: அருவருப்பானவை
  alternative: அருவருக்கத்தக்கவை / தீட்டானவை
  rationale: சொல் இங்கு உணவுக்கான சடங்குமுறை விலக்கைச் சுட்டுகிறது. ‘தீட்டானவை’ என்று மட்டும் மொழிபெயர்த்தால் טָמֵא உடன் தேவையற்ற சொற்பொருள் ஒற்றுமை உருவாகும்; ‘அருவருப்பானவை’ மூலத்தின் வலிமையையும் வேறுபாட்டையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் dignified சட்டநடை பயன்படுத்தப்பட்டுள்ளது. ‘ஊர்ந்து திரியும் சிறிய உயிரினங்கள்’ என்பது பரந்த உயிரின வகையைத் தெளிவுபடுத்துகிறது; ‘உண்ணக் கூடாது’ உறுதியான தடையை இயல்பாகத் தெரிவிக்கிறது. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
