  source_fidelity: மூல எபிரெயத்தின் முழுமைச் சுட்டல், நிலத்தில் நகரும் שֶׁרֶץ வகை, அதன் சடங்குமுறை சார்ந்த שֶׁקֶץ மதிப்பீடு, மற்றும் உணவு-தடை ஆகியவை துல்லியமாக வெளிப்படுத்தப்பட்டுள்ளன. எபிரெயத்தின் ஒருமை-கூட்டுப்பொருளைத் தமிழில் பன்மையாக வழங்குவது இயல்பானதும் பொருளை மாற்றாததும் ஆகும். ‘சிறிய உயிரினங்கள்’ என்பது இச்சொல்வகைக்குப் பொருத்தமான விளக்கமாக உள்ளது; சூழலில் அனுமதிக்கத்தக்கது.
  naturalness: ‘நிலத்தில் ஊர்ந்து திரியும் சிறிய உயிரினங்கள் அனைத்தும் ...; அவற்றை உண்ணக் கூடாது’ என்பது நவீன நிலையான தமிழில் தெளிவான, கண்ணியமான சட்டநடையாக உள்ளது. செயப்பாட்டு மூலவடிவத்தைத் தமிழின் இயல்பான தடைநடையாக மாற்றியிருப்பது நன்றாக அமைந்துள்ளது.
  terminology: ‘அருவருப்பானவை’ שֶׁקֶץ என்பதன் உணவு மற்றும் சடங்குமுறை விலக்குச் சூழலைச் சரிவரக் காட்டுகிறது; טָמֵא என்பதற்குரிய ‘தீட்டு/அசுத்தம்’ சொல்லுடன் தேவையற்ற கலப்பைத் தவிர்க்கிறது. அடிக்குறிப்பு இந்தச் சடங்குமுறைப் பொருளையும் மாற்றுச் சொல்லையும் தெளிவுபடுத்துகிறது.
