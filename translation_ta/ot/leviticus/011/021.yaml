base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/021.yaml
  text: 'Yet these you may eat from all the swarming things that fly[b][a], that go on all fours: those that have jointed legs above their feet to hop on the ground with them.'
translation:
  language: ta
  text: ஆனாலும், நான்கு கால்களில் செல்லும் பறக்கும் ஊரும் உயிரினங்கள் எல்லாவற்றிலும், தங்கள் கால்களுக்கு மேலாகத் தரையில் துள்ளுவதற்கு ஏற்ற பின்கால்களைக் கொண்டவற்றை[a] நீங்கள் உண்ணலாம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேய எழுத்து வடிவத்தில் ‘கால்கள் இல்லாதவை’ என்று உள்ளது; ஆனால் வாசிப்பு மரபு, சூழல், பழங்கால மொழிபெயர்ப்புகள் ஆகியவை ஆதரிப்பது ‘கால்களைக் கொண்டவை’ என்பதாகும்.
    reason: textual_variant
lexical_decisions:
- source_word: אַךְ
  choice: ஆனாலும்
  rationale: முந்தைய தடையிலிருந்து இங்கு அனுமதிக்கப்படும் விதிவிலக்கைத் தெளிவாகக் குறிக்கிறது.
- source_word: אֶת זֶה
  choice: கொண்டவற்றை
  rationale: எபிரேயில் ஒருமை வடிவம் இருந்தாலும், சூழலில் அனுமதிக்கப்படும் உயிரின வகையைச் சுட்டுவதால் தமிழில் பன்மை வகைப்பாட்டாக இயல்பாக வழங்கப்பட்டுள்ளது.
- source_word: תֹּאכְלוּ
  choice: நீங்கள் உண்ணலாம்
  rationale: சட்டச் சூழலில் இந்த வினைவடிவம் கட்டளையைவிட அனுமதியைத் தெரிவிக்கிறது.
- source_word: מִכֹּל שֶׁרֶץ הָעוֹף
  choice: பறக்கும் ஊரும் உயிரினங்கள் எல்லாவற்றிலும்
  rationale: שֶׁרֶץ என்பதன் ஊர்ந்து அல்லது திரண்டு இயங்கும் சிறிய உயிரின வகை உணர்வையும், הָעוֹף என்பதன் பறக்கும் வகைப்பாட்டையும் காக்கிறது; ‘பறவைகள்’ என்று தவறாகக் குறுக்கவில்லை.
- source_word: הַהֹלֵךְ עַל אַרְבַּע
  choice: நான்கு கால்களில் செல்லும்
  rationale: மூலத்தின் உடலியக்க விளக்கத்தை நவீன தமிழில் நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: אֲשֶׁר לא/לוֹ כְרָעַיִם
  choice: துள்ளும் கால்களைக் கொண்டவற்றை[a]
  rationale: எழுதப்பட்ட மரபின் לֹא (‘இல்லை’) என்பதற்குப் பதிலாக, சூழலும் பழைய மொழிபெயர்ப்புகளும் ஆதரிக்கும் வாசிக்கப்பட்ட மரபின் לוֹ (‘அதற்கு உண்டு’) பொருள் ஏற்கப்பட்டது. כְרָעַיִם இங்கு துள்ளுவதற்கேற்ற சிறப்பு பின்கால்களைக் குறிக்கிறது.
- source_word: מִמַּעַל לְרַגְלָיו
  choice: தங்கள் கால்களுக்கு மேலாக
  rationale: சிறப்பு துள்ளும் கால்களின் உடற்கூறு இருப்பிடத்தை மூலத்துக்கு நெருக்கமாகப் பாதுகாக்கிறது.
- source_word: לְנַתֵּר בָּהֵן עַל הָאָרֶץ
  choice: தரையில் துள்ளுவதற்குரிய
  rationale: அந்தச் சிறப்புக் கால்களின் நோக்கத்தையும் தரையில் நிகழும் இயக்கத்தையும் சுருக்கமாகவும் தெளிவாகவும் தெரிவிக்கிறது.
