revisions:
- from: ஆனால், நான்கு கால்களுள்ள பறக்கும் சிற்றுயிரினம் ஒவ்வொன்றும் உங்களுக்கு அருவருப்பானது[a][b].
  to: ஆனால், நான்கு கால்களுள்ள பறக்கும் சிறு உயிரினம் ஒவ்வொன்றும் உங்களுக்கு அருவருப்பானது[a][b].
  rationale: A minimal lexical revision prevents ‘சிற்றுயிரினம்’ from being read as ‘microorganism,’ while preserving the source’s broad category and every other element of the draft. The footnote wording is correspondingly clarified without adding interpretive claims.
