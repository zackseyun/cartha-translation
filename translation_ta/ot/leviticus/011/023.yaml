source:
  edition: WLC
  text: וְ/כֹל֙ שֶׁ֣רֶץ הָ/ע֔וֹף אֲשֶׁר ל֖/וֹ אַרְבַּ֣ע רַגְלָ֑יִם שֶׁ֥קֶץ ה֖וּא לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/023.yaml
  text: But every winged swarming thing that has four feet is detestable to you[a][b].
translation:
  language: ta
  text: ஆனால், நான்கு கால்களுள்ள பறக்கும் சிறு உயிரினம் ஒவ்வொன்றும் உங்களுக்கு அருவருப்பானது[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சிறகுள்ள, ஊர்ந்து செல்லும் உயிரினம்.’ எபிரெயச் சொற்றொடர் திரளாகச் செல்லும் பறக்கும் உயிரினங்களை, குறிப்பாகப் பூச்சிகளை, பரந்த வகையில் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் நேரடியாக, ‘நான்கு கால்கள்.’ சுற்றியுள்ள வசனங்களின் வகைப்பாட்டு சொல்லாட்சியே இங்கும் தொடர்கிறது.
    reason: source_clarification
lexical_decisions:
- source_word: וְ/כֹל
  choice: ஆனால், … ஒவ்வொன்றும்
  rationale: முந்தைய வசனத்தில் அனுமதிக்கப்பட்டவற்றுக்கு அடுத்ததாக வரும் முரண்பாட்டை וְ இங்கு காட்டுகிறது; כֹל என்பதன் பகிர்வுப் பொருளை ‘ஒவ்வொன்றும்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: שֶׁרֶץ הָעֹוף
  choice: பறக்கும் சிற்றுயிரினம்
  rationale: இந்த எபிரெயச் சொற்றொடர் திரளாகச் செல்லும் அல்லது ஊர்ந்து திரியும் சிறிய பறக்கும் உயிரினங்களை, குறிப்பாகப் பூச்சிகளை, பரந்த வகையாகக் குறிக்கிறது. தமிழில் ‘பறக்கும் சிற்றுயிரினம்’ இயல்பாகவும் வகையின் பரப்பைத் தேவையின்றிக் குறுக்காமலும் உள்ளது.
- source_word: אֲשֶׁר לוֹ
  choice: உள்ள
  rationale: உடைமையைக் குறிக்கும் எபிரெய உறவுத்தொடரைத் தமிழில் பெயரெச்ச வடிவில் இயல்பாக வழங்குகிறது.
- source_word: אַרְבַּע רַגְלָיִם
  choice: நான்கு கால்கள்
  rationale: எபிரெய வாசகத்தின் நேரடியான உடற்கூறு சொல்லாட்சியைப் பாதுகாக்கிறது; தமிழில் விலங்குகளுக்கும் பூச்சிகளுக்கும் ‘கால்கள்’ என்பது இயல்பான சொல்.
- source_word: שֶׁקֶץ הוּא לָכֶם
  choice: உங்களுக்கு அருவருப்பானது
  rationale: שֶׁקֶץ என்பதன் கடுமையான வெறுப்புக்குரிய, உணவாகத் தடைசெய்யப்பட்ட தன்மையை ‘அருவருப்பானது’ தெளிவாகக் காட்டுகிறது. לָכֶם என்பதையும் வெளிப்படையாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: שֶׁקֶץ என்பதன் சடங்கு மற்றும் உணவுச் சட்டச் சூழல்
  choice: அருவருப்பானது
  alternative: தீட்டானது / அருவருப்புக்குரிய பொருள்
  rationale: ‘தீட்டானது’ என்று மட்டும் மொழிபெயர்த்தால் שֶׁקֶץ என்பதன் வெறுப்புணர்வுத் தீவிரம் குறையும்; ‘அருவருப்பானது’ மூலத்தின் வலிமையைப் பாதுகாக்கிறது, அதே நேரத்தில் குறிப்பிட்ட பிற்கால சமயப் பதத்தைத் திணிக்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் எளிதில் புரியும், ஆனால் சட்ட உரைக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பறக்கும் சிற்றுயிரினம்’ என்பது சொல்லுக்குச் சொல் இயல்பற்ற வடிவத்தைத் தவிர்த்து, மூலத்தின் பரந்த உயிரின வகையைப் பாதுகாக்கிறது.
