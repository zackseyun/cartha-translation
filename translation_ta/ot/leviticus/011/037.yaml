  text: அவற்றின் சடலத்திலிருந்து ஏதேனும் ஒன்று விதைக்கப்படவிருக்கும் எந்த விதைமீதும் விழுந்தால், அது தீட்டற்றது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִי
  choice: விழுந்தால்
  rationale: தொடர்ந்து வரும் நிபந்தனைச் சட்டத்தை இயல்பான தமிழ் நிபந்தனை விகுதியால் வெளிப்படுத்துகிறது; வசனத் தொடக்கத்தில் தனியே ‘மேலும்’ சேர்ப்பது தமிழில் தேவையற்றதாக இருக்கும்.
- source_word: יִפֹּל
  choice: விழுந்தால்
  rationale: நிபந்தனைச் சட்டத்தில் வரும் Qal imperfect-ஐ இயல்பான நிகழக்கூடிய நிபந்தனையாக மொழிபெயர்க்கிறது.
- source_word: מִנִּבְלָתָם
  choice: அவற்றின் சடலத்திலிருந்து ஏதாவது[a]
  rationale: מִן என்பதன் பகுதியைக் குறிக்கும் வலிமையையும், נְבֵלָה என்பதன் இறந்த உடல் என்ற பொருளையும் காக்கிறது. எபிரேயத் தொடரின் எண்ணிக்கை மற்றும் பகுதி சார்ந்த தெளிவின்மை அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: עַל כָּל
  choice: எந்த … மீதும்
  rationale: நிபந்தனைச் சட்டத்தில் כָּל கொண்ட பகிர்வுப் பொருளை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: זֶרַע זֵרוּעַ אֲשֶׁר יִזָּרֵעַ
  choice: விதைக்கப்படவிருக்கும் … விதை
  rationale: விதைப்பதற்கென்று உள்ள விதையையும் அதன் எதிர்நோக்கிய பயன்பாட்டையும் தேவையற்ற சொல் மீளுரையின்றி எடுத்துரைக்கிறது.
- source_word: טָהוֹר הוּא
  choice: அது தீட்டற்றது
  rationale: லேவியராகமத்தின் சடங்குசார் தூய்மைச் சூழலில் ‘தீட்டற்றது’ என்பது טָהוֹר-ன் சட்டநிலையை தெளிவாகவும் இயல்பாகவும் குறிக்கிறது; ‘தொடர்ந்து தீட்டற்றிருக்கும்’ என்று மூலத்தில் இல்லாத தொடர்நிலையைச் சேர்க்கவில்லை.
theological_decisions:
- issue: טָהוֹר என்பதன் சடங்குசார் பொருள்
  choice: தீட்டற்றது
  alternative: தூய்மையானது
  rationale: இங்கு ஒழுக்கத் தூய்மையோ பொதுவான சுத்தமோ அல்ல, தீட்டு விதிகளின்படி உள்ள நிலையே குறிக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் எளிதில் புரியும், ஆனால் சட்டவிதிக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘தீட்டற்றது’ என்பது லேவியராகமத்தின் சடங்குசார் எதிர்மறை/நேர்மறை வேறுபாட்டைத் தெளிவாகக் காக்கிறது.
