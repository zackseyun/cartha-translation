translation_notes:
  register: நவீன தரமான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் சட்டநடை பயன்படுத்தப்பட்டுள்ளது. “ஊர்வன” என்ற உயிரியல் ரீதியாகக் குறுகிய சொல்லைத் தவிர்த்து, மூலத்தின் பரந்த உயிரின வகையை விளக்கும் சொற்றொடர் தேர்ந்தெடுக்கப்பட்டது.
