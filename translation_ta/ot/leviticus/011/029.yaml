reference: Leviticus 11:29
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/זֶ֤ה לָ/כֶם֙ הַ/טָּמֵ֔א בַּ/שֶּׁ֖רֶץ הַ/שֹּׁרֵ֣ץ עַל הָ/אָ֑רֶץ הַ/חֹ֥לֶד וְ/הָ/עַכְבָּ֖ר וְ/הַ/צָּ֥ב לְ/מִינֵֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/029.yaml
  text: 'And these are unclean for you among the swarming things that swarm on the earth: the mole-rat[a], and the mouse, and the great lizard according to its kind.'
translation:
  language: ta
  text: 'நிலத்தில் ஊர்ந்து திரியும் சிறு உயிரினங்களில் இவை உங்களுக்குத் தீட்டானவை: நிலத்தடி எலி[a], எலி, பெரிய பல்லி, அதன் இனத்தின்படி[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: חֹלֶד என்ற எபிரெயச் சொல் எந்த விலங்கைத் துல்லியமாகக் குறிக்கிறது என்பது உறுதியில்லை; “கீரி” அல்லது “மூஞ்சூறு” என்பன மரபுவழி மாற்று மொழிபெயர்ப்புகள்.
    reason: lexical_alternative
  - marker: b
    text: צָב என்ற எபிரெயச் சொல்லின் துல்லியமான பொருள் உறுதியில்லை; “ஆமை” அல்லது பொதுவாக “பல்லி” என்றும் மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֶה
  choice: இவை
  rationale: எபிரெயச் சொல் இலக்கணத்தில் ஒருமையாக இருந்தாலும், தொடர்ந்து வரும் உயிரினங்களின் பட்டியலை அறிமுகப்படுத்துவதால் தமிழில் பன்மையான “இவை” இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: לָכֶם הַטָּמֵא
  choice: உங்களுக்குத் தீட்டானவை
  rationale: லேவியராகமத்தின் சடங்குசார் தூய்மைச் சூழலில் טָמֵא என்பதற்கு “தீட்டு” என்பது தெளிவான தமிழ் வழக்கு; לָכֶם இஸ்ரவேலருடன் தொடர்புடைய நிலையை “உங்களுக்கு” எனக் குறிக்கிறது.
- source_word: בַּשֶּׁרֶץ הַשֹּׁרֵץ עַל הָאָרֶץ
  choice: நிலத்தில் ஊர்ந்து திரியும் சிறு உயிரினங்களில்
  rationale: שֶׁרֶץ என்பது சிறிய, தரையில் இயங்கும் அல்லது திரளும் உயிரினங்களைப் பரந்த வகையில் குறிக்கிறது. “ஊர்வன” என்று மட்டும் மொழிபெயர்த்தால் நவீன உயிரியல் வகைப்பாட்டில் ஊர்வனவாகிய reptiles என்ற குறுகிய பொருள் ஏற்படக்கூடும்; ஆகவே விளக்கமான இயல்புத் தமிழ் பயன்படுத்தப்பட்டது.
- source_word: הַחֹלֶד
  choice: நிலத்தடி எலி
  rationale: குறிப்பிட்ட விலங்கின அடையாளம் உறுதியற்றது. நிலத்தில் வாழும் சிறு பாலூட்டியைச் சுட்டும் சாத்தியமான நவீன பெயராக இது தேர்ந்தெடுக்கப்பட்டது; மாற்று மரபுவழிப் பொருள்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: הָעַכְבָּר
  choice: எலி
  rationale: עַכְבָּר பொதுவாக எலி அல்லது எலி போன்ற கொறித்துண்ணியைச் சுட்டுகிறது; “எலி” எளிய, பரவலாகப் புரியும் தமிழ்ச் சொல்.
- source_word: הַצָּב לְמִינֵהוּ
  choice: பெரிய பல்லி வகைகள்
  rationale: צָב என்பதன் துல்லியமான விலங்கின அடையாளம் உறுதியற்றது; பல்லி இன உயிரினம் என்பது இச்சூழலில் சாத்தியம். לְמִינֵהוּ தரும் இனவகைப்பாட்டுப் பொருள் இயல்பான தமிழில் “வகைகள்” என வெளிப்படுத்தப்பட்டுள்ளது.
