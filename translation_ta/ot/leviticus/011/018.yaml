base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/018.yaml
  text: the owl, the pelican, and the carrion vulture;
translation:
  language: ta
  text: ஆந்தையையும்[a], கூழைக்கடாவையும்[b], பிணந்தின்னிக் கழுகையும்[c];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயச் சொல் குறிக்கும் ஆந்தையின் துல்லியமான இனம் உறுதியாகத் தெரியவில்லை.
    reason: பண்டைய பறவைப்பெயரின் இன அடையாளத்தில் உள்ள உண்மையான சொற்பொருள் ஐயத்தைப் பாதுகாக்கிறது.
  - marker: b
    text: இந்தப் பறவையின் அடையாளமும் உறுதியானதல்ல; சிலர் இதை வேறொரு நீர்ப்பறவை அல்லது பாலைவனப் பறவை எனக் கருதுகின்றனர்.
    reason: கָּאָת என்பதற்கான அகராதி மற்றும் மொழிபெயர்ப்பு மரபுகளில் காணப்படும் வேறுபாட்டை வாசகருக்குத் தெரிவிக்கிறது.
  - marker: c
    text: அநேகமாக எகிப்தியப் பிணந்தின்னிக் கழுகு; துல்லியமான இனம் உறுதியாகத் தெரியவில்லை.
    reason: רָחָם என்பதன் பொதுவான அடையாளத்தை அளித்தபடியே அதன் உறுதியின்மையையும் வெளிப்படுத்துகிறது.
lexical_decisions:
- source_word: הַתִּנְשֶׁמֶת (hattinšemet)
  choice: ஆந்தை
  rationale: இது ஓர் இரவுப்பறவையைக் குறிக்கலாம்; அதன் துல்லியமான இனம் உறுதியாகத் தெரியாததால், ஆங்கில ஆலோசனை உரையைப் போல பொதுவான இயற்கைத் தமிழ்ப் பெயர் பயன்படுத்தப்பட்டது.
- source_word: הַקָּאָת (haqqāʾat)
  choice: கூழைக்கடா
  rationale: பண்டைய மொழிபெயர்ப்பு மரபுகளிலும் பல நவீன அகராதிகளிலும் இது pelican என அடையாளப்படுத்தப்படுகிறது; அதற்குரிய வழக்கமான தமிழ்ப் பெயர் தேர்ந்தெடுக்கப்பட்டது.
- source_word: הָרָחָם (hārāḥām)
  choice: பிணந்தின்னிக் கழுகு
  rationale: இச்சொல் பொதுவாக Egyptian vulture போன்ற பிணந்தின்னிக் கழுகுடன் தொடர்புபடுத்தப்படுகிறது; உறுதியற்ற இனத்தை மிகத் துல்லியமாகக் குறிப்பிடாமல் அதன் வகையைத் தெளிவாகச் சொல்லும் பெயர் பயன்படுத்தப்பட்டது.
