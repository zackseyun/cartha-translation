translation_notes:
  register: நவீன தரத் தமிழில், உணவுச் சட்டத்தில் வரும் தொடர்ச்சியான பட்டியலுக்கு ஏற்றவாறு ஒவ்வொரு பெயருக்கும் ‘-ஐயும்’ இணைக்கப்பட்டுள்ளது. இறுதியிலுள்ள அரைப்புள்ளி, வசனம் அடுத்த பட்டியல் உறுப்புகளோடு தொடர்வதைக் காட்டுகிறது. பறவைகளின் இன அடையாளம் உறுதியற்ற இடங்களில் அடிக்குறிப்புகள் மூலம் அந்த ஐயம் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
