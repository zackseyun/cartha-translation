translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. சடங்காசாரத் தூய்மைச் சொல்லாட்சிக்காக ‘தீட்டுப்படும்’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
