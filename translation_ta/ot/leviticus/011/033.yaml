source:
  edition: WLC
  text: וְ/כָל כְּלִי חֶ֔רֶשׂ אֲשֶׁר יִפֹּ֥ל מֵ/הֶ֖ם אֶל תּוֹכ֑/וֹ כֹּ֣ל אֲשֶׁ֧ר בְּ/תוֹכ֛/וֹ יִטְמָ֖א וְ/אֹת֥/וֹ תִשְׁבֹּֽרוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/033.yaml
  text: And every earthenware vessel into which any of them falls—everything that is in it shall become unclean[a], and you shall break it.
translation:
  language: ta
  text: அவற்றில் ஏதாவது ஒன்று ஒவ்வொரு மண்பாண்டத்திற்குள்ளும் விழுந்தால், அதற்குள் இருப்பவை அனைத்தும் தீட்டாகும்; அந்தப் பாண்டத்தை நீங்கள் உடைக்க வேண்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּלִי חֶרֶשׂ
  choice: மண்பாண்டம்
  rationale: כְּלִי என்பது பொருள் அல்லது கொள்கலனைக் குறிக்கும் பொதுச்சொல்; חֶרֶשׂ அது மண்ணால் செய்யப்பட்ட பாண்டம் என்பதைக் குறிப்பிடுகிறது. ‘மண்பாண்டம்’ என்பது தமிழில் இயல்பாகவும் சடங்காசார விதியில் பொருளின் தன்மையைத் தெளிவாகவும் காட்டுகிறது.
- source_word: יִפֹּל מֵהֶם
  choice: அவற்றில் ஏதாவது ஒன்று ... விழுந்தாலும்
  rationale: பன்மைச் சுட்டுப்பெயர் முந்தைய வசனங்களில் கூறப்பட்ட ஊரும் உயிரினங்களின் செத்த உடல்களைச் சுட்டுகிறது. ‘ஏதாவது ஒன்று’ என்பது அவற்றுள் ஒன்றே விழுந்தாலும் இவ்விதி பொருந்தும் என்ற பகிர்நிலைப் பொருளைத் தருகிறது.
- source_word: אֶל תּוֹכוֹ
  choice: எந்த மண்பாண்டத்திற்குள்
  rationale: תּוֹךְ பாண்டத்தின் உட்பகுதியைக் குறிக்கிறது. ‘-க்குள்’ என்பது உள்ளே விழுவதை இயல்பான தமிழில் துல்லியமாக வெளிப்படுத்துகிறது; ‘எந்த ... விழுந்தாலும்’ என்ற அமைப்பு எபிரெய உரையின் ‘ஒவ்வொரு பாண்டமும்’ என்ற பொதுவியாபகப் பொருளையும் காக்கிறது.
- source_word: כֹּל אֲשֶׁר בְּתוֹכוֹ
  choice: அதற்குள் இருப்பவை அனைத்தும்
  rationale: כֹּל என்பதன் முழுமையான பரப்பை ‘அனைத்தும்’ காக்கிறது; இச்சொற்றொடர் பாண்டத்திலுள்ள உள்ளடக்கங்கள் யாவற்றையும் குறிக்கிறது.
- source_word: יִטְמָא
  choice: தீட்டுப்படும்
  rationale: லேவியராகமத்தின் சடங்காசாரத் தூய்மைச் சூழலில் טמא என்பதற்கான இயல்பான தமிழ் சொல் ‘தீட்டு’. வினை வடிவம் தொடர்பின் விளைவாக அந்த நிலை ஏற்படுவதைக் காட்டுகிறது.
- source_word: וְאֹתוֹ תִשְׁבֹּרוּ
  choice: அந்தப் பாண்டத்தை நீங்கள் உடைத்துவிட வேண்டும்
  rationale: எபிரெயத்தில் முன்னிலைப்படுத்தப்பட்ட நேர்ச்செயப்படுபொருள் பாண்டத்தையே உடைக்க வேண்டும் என்பதை வலியுறுத்துகிறது. ‘அந்தப் பாண்டத்தை’ அந்த வலியுறுத்தலைத் தெளிவாக்குகிறது; ‘உடைத்துவிட வேண்டும்’ கட்டளையின் வலிமையை மிகைப்படுத்தாமல் வழங்குகிறது.
