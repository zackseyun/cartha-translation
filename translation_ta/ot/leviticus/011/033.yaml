revisions:
- from: அவற்றில் ஏதாவது ஒன்று எந்த மண்பாண்டத்திற்குள்[a] விழுந்தாலும், அதற்குள் இருப்பவை அனைத்தும் தீட்டுப்படும்; அந்தப் பாண்டத்தை நீங்கள் உடைத்துவிட வேண்டும்.
  to: அவற்றில் ஏதாவது ஒன்று ஒவ்வொரு மண்பாண்டத்திற்குள்ளும் விழுந்தால், அதற்குள் இருப்பவை அனைத்தும் தீட்டாகும்; அந்தப் பாண்டத்தை நீங்கள் உடைக்க வேண்டும்.
  rationale: ‘ஒவ்வொரு’ Hebrew வְכָל-இன் பொதுவியாபகப் பொருளைத் தெளிவாகக் காட்டுகிறது. ‘தீட்டாகும்’ சடங்காசாரத் தூய்மைக் சூழலில் இயல்பானதும், விளைவாக ஏற்படும் நிலையைத் துல்லியமாகக் காட்டுவதுமாகும். அடிக்குறிப்பு சுடுமண்/மட்பாண்டம் என்ற பொருள்சார்ந்த வேறுபாட்டைச் சேர்க்கிறது.
