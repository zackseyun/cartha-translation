translation_notes:
  register: நவீன தரத் தமிழில், சட்ட உரைக்கேற்ற கண்ணியமான ஆனால் பொதுவாசகர்களுக்கு எளிய நடை. ‘அசைபோடும்’ என்ற நிலைபெற்ற தமிழ் சொல் பயன்படுத்தப்பட்டு, அதன் எபிரெய உருவகம் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு சுட்டிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
