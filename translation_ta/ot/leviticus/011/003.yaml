  yaml_path: translation/ot/leviticus/011/003.yaml
  text: You may eat any animal that has a split hoof[a], completely divided[b], and that chews the cud.
translation:
  language: ta
  text: குளம்பு பிளவுபட்டு, இரு பகுதிகளாக முழுமையாகப் பிரிந்திருந்து,[a] அசைபோடும்[b] எந்த நிலவாழ் விலங்கையும் நீங்கள் உண்ணலாம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எழுத்துப்படி, “குளம்பைப் பிரித்து, குளம்புகளில் பிளவைப் பிளக்கிற.” உண்மையாகவே முழுமையாகப் பிரிந்த குளம்பைக் குறிப்பிட எபிரெய மொழி தொடர்புடைய இரண்டு சொற்றொடர்களைப் பயன்படுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: எழுத்துப்படி, “அசையை மேலே கொண்டுவரும்”; அதாவது, விழுங்கிய உணவை மீண்டும் வாய்க்குக் கொண்டுவந்து மெல்லும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל
  choice: எந்த ... விலங்கையும்
  rationale: தொடர்ந்து வரும் பண்புகளைக் கொண்ட அனுமதிக்கப்பட்ட விலங்குகளின் முழு வகையையும் பகிர்வுப் பொருளில் குறிக்கிறது; சட்டரீதியான அனுமதியை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: מַפְרֶסֶת פַּרְסָה
  choice: குளம்பு பிளவுபட்டு
  rationale: குளம்பைப் பிரிக்கும் உடலமைப்புப் பண்பைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וְשֹׁסַעַת שֶׁסַע פְּרָסֹת
  choice: இரு பகுதிகளாக முழுமையாகப் பிரிந்திருந்து
  rationale: முந்தைய குளம்புப் பிளவை மேலும் துல்லியப்படுத்தும் எபிரெய இரட்டிப்பு வலியுறுத்தலை வாசிக்க எளிதான தமிழில் காக்கிறது.
- source_word: מַעֲלַת גֵּרָה
  choice: அசைபோடும்
  rationale: சொல்லுக்கு சொல் பொருள் ‘அசையை மேலே கொண்டுவருவது’; மீண்டும் வாய்க்குக் கொண்டுவந்து மெல்லும் இயல்பைக் குறிக்கும் வழக்கமான தமிழ் விலங்கியல் சொல் ‘அசைபோடுதல்’.
- source_word: בַּבְּהֵמָה
  choice: நிலவாழ் விலங்கு
  rationale: இவ்வுணவுச் சட்ட வகைப்பாட்டில் நீர்வாழ் உயிரினங்களுக்கும் பறவைகளுக்கும் மாறாக நில விலங்குகளைக் குறிக்கிறது; ‘கால்நடை’ என்பது தேவையற்ற அளவு குறுகியது.
- source_word: אֹתָהּ תֹּאכֵלוּ
  choice: நீங்கள் உண்ணலாம்
  rationale: இங்கு கட்டாயமாக உண்ணும்படி கட்டளையிடாமல், குறிப்பிட்ட வகையை உண்ண அனுமதிக்கிறது.
