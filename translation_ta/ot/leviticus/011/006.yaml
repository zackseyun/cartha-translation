id: LEV.11.6
reference: Leviticus 11:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/אֶת הָ/אַרְנֶ֗בֶת כִּֽי מַעֲלַ֤ת גֵּרָה֙ הִ֔וא וּ/פַרְסָ֖ה לֹ֣א הִפְרִ֑יסָה טְמֵאָ֥ה הִ֖וא לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/006.yaml
  text: And the hare[a], because it chews the cud but does not divide the hoof, is unclean for you.
translation:
  language: ta
  text: காட்டு முயல்[a] அசைபோடுகிறது, ஆனால் அதன் குளம்பு பிளவுபட்டிருக்கவில்லை; அது உங்களுக்குத் தீட்டானது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘முயல்.’ எபிரெயச் சொல் பாரம்பரியமாகக் காட்டு முயலைக் குறிப்பதாகப் புரிந்துகொள்ளப்படுகிறது; சிலர் அதை இன்னும் பொதுவான பொருளில் எடுத்துக்கொள்கிறார்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאַרְנֶבֶת
  choice: காட்டு முயல்
  rationale: எபிரெயச் சொல் பாரம்பரியமாக ‘hare’ என அடையாளப்படுத்தப்படுகிறது. தமிழில் ‘காட்டு முயல்’ என்பது அந்த விலங்கைச் சற்றுத் துல்லியமாகக் குறிக்கிறது; ‘முயல்’ என்ற பொதுவான அடையாளத்தை அடிக்குறிப்பில் தருவது சொல்லின் வரம்பைப் பற்றிய நிச்சயமின்மையைப் பாதுகாக்கிறது.
- source_word: כִּי מַעֲלַת גֵּרָה הִוא
  choice: அசைபோட்டாலும்
  rationale: מַעֲלַת גֵּרָה என்பதன் நேரடிப் பொருள் இரையை மீண்டும் வாய்க்குக் கொண்டுவருவதைக் குறிக்கிறது. ‘அசைபோடு’ என்பது தமிழில் இதற்கான இயல்பான வழக்கு. அடுத்த எதிர்மறைத் தகுதியுடன் உள்ள முரண்பாட்டை ‘-ஆலும்’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וּפַרְסָה לֹא הִפְרִיסָה
  choice: அதன் குளம்பு பிளவுபட்டதல்ல
  rationale: குளம்பு பிளந்திராத இரண்டாவது உடற்கூற்றுத் தகுதியைத் தெளிவாகவும் இயல்பாகவும் சொல்கிறது. எபிரெய வினையின் காரணப்பண்பை மிகைப்படுத்தாமல், விலங்கின் வகைப்பாட்டுக்குரிய நிலையைத் தெரிவிக்கிறது.
- source_word: טְמֵאָה הִוא לָכֶם
  choice: அது உங்களுக்குத் தீட்டானது
  rationale: லேவியராகமத்தின் உணவுச் சட்டச் சூழலில் טָמֵא சடங்குசார் தீட்டைக் குறிக்கிறது. ‘உங்களுக்குத்’ என்பது לָכֶם என்பதன் உடன்படிக்கைச் சார்ந்த முகவரியைப் பாதுகாக்கிறது; ‘தீட்டானது’ ஒழுக்கத் தீமையைக் குறிக்காமல் வகைப்பாட்டைத் தெரிவிக்கிறது.
theological_decisions:
- issue: லேவிய உணவுச் சட்டத்தில் தீட்டின் இயல்பு
  choice: சடங்குசார் வகைப்பாட்டைக் குறிக்கும் ‘தீட்டானது’
  alternative: ஒழுக்கரீதியாக அசுத்தமானது அல்லது தீயது
  rationale: இவ்வசனம் விலங்கின் ஒழுக்க இயல்பைப் பற்றி அல்ல, இஸ்ரவேலருக்கான உணவுச் சட்ட வகைப்பாட்டைப் பற்றிப் பேசுகிறது. ஆகவே பொதுவான வேதாகமச் சொல்லை வைத்துக்கொண்டு, அதை ஒழுக்கத் தீமையாக விரிவுபடுத்தவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘அசைபோடு’ உணவுச் சட்டச் சூழலில் இயல்பான தமிழ்ச் சொல்லாகும்; ‘தீட்டானது’ சடங்குசார் வகைப்பாட்டைத் தக்கவைக்கிறது.
