base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/013.yaml
  text: 'And these from among the birds you shall regard as detestable[a]; they shall not be eaten; they are detestable: the eagle, the vulture[c][b], and the black vulture.'
translation:
  language: ta
  text: 'பறவைகளில் பின்வருவனவற்றை நீங்கள் அருவருப்பானவையாகக் கருத வேண்டும்; அவற்றை உண்ணக் கூடாது; அவை அருவருப்பானவை: கழுகு[a], தாடிக் கழுகு[b], கறுப்புப் பிணந்தின்னிக் கழுகு[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இப்பட்டியலிலுள்ள எபிரேயப் பறவைப் பெயர்களை எப்போதும் உறுதியாக அடையாளம் காண முடியாது. இங்குள்ள சொல் கழுகை மட்டுமல்லாமல், பெரிய இரைகொல்லிப் பறவையையோ பிணந்தின்னிக் கழுகையையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இப்பறவை பொதுவாக ‘தாடிக் கழுகு’ (lammergeier) என்று அடையாளம் காணப்படுகிறது; ஆனால் அதன் துல்லியமான அடையாளம் உறுதியில்லை.
    reason: lexical_alternative
  - marker: c
    text: இப்பறவையின் அடையாளம் உறுதியில்லை. சில மொழிபெயர்ப்புகள் இதை மீன்பிடிக் கழுகு என்றும், வேறு சில பெரிய கழுகு அல்லது பிணந்தின்னிக் கழுகு வகை என்றும் தருகின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּשַׁקְּצוּ
  choice: அருவருப்பானவையாகக் கருத வேண்டும்
  rationale: பீயேல் வினை வடிவம் வெறும் உணர்ச்சியை அல்லாமல், உணவுச் சட்டத்தின் சூழலில் அவற்றை அருவருக்கத்தக்கவையாக மதித்துத் தவிர்க்க வேண்டும் என்ற பொருளைத் தருகிறது.
- source_word: מִן הָעוֹף
  choice: பறவைகளில்
  rationale: מִן என்பதன் பகுதி சார்ந்த பொருளை இயல்பான தமிழில் ‘பறவைகளில்’ எனத் தருகிறது; இச்சூழலில் עוֹף என்பதற்கு ‘பறவைகள்’ பொருத்தமானது.
- source_word: לֹא יֵאָכְלוּ
  choice: இவற்றை உண்ணக் கூடாது
  rationale: எபிரெய மொழியின் செயப்பாட்டு வடிவிலான தடையை, நவீன தமிழில் தெளிவான சட்டநடையுடன் இயல்பாகத் தருகிறது.
- source_word: שֶׁקֶץ
  choice: அருவருப்பானவை
  rationale: சடங்கு மற்றும் உணவுச் சட்டச் சூழலில் தவிர்க்கப்பட வேண்டிய அருவருக்கத்தக்கவற்றைக் குறிக்கிறது; அதை வெறுமனே ‘தீட்டானவை’ என்று குறுக்காமல் அதன் வலிமையைப் பேணுகிறது.
- source_word: הַנֶּשֶׁר
  choice: கழுகு
  rationale: இது வழக்கமாக ‘கழுகு’ என்று மொழிபெயர்க்கப்படுகிறது; ஆனால் பெரிய இரைகொல்லிப் பறவை அல்லது பிணந்தின்னிக் கழுகையும் குறிக்கக்கூடும் என்பதால் அடிக்குறிப்பில் உறுதியின்மை தெரிவிக்கப்படுகிறது.
- source_word: הַפֶּרֶס
  choice: தாடிக் கழுகு
  rationale: இப்பெயர் பொதுவாக lammergeier அல்லது bearded vulture இனத்துடன் தொடர்புபடுத்தப்படுகிறது; தமிழில் புரிந்துகொள்ளத்தக்க பெயராக ‘தாடிக் கழுகு’ பயன்படுத்தப்படுகிறது, ஆனால் அடையாளம் முற்றிலும் உறுதியானதல்ல.
- source_word: הָעָזְנִיָּה
  choice: கருங்கழுகு
  rationale: ஒரு வகை பிணந்தின்னிக் கழுகைக் குறிக்கும் சாத்தியமுள்ள நவீன அடையாளம் இது; வேறு அடையாளங்களும் முன்வைக்கப்படுவதால் அடிக்குறிப்பு சேர்க்கப்பட்டுள்ளது.
