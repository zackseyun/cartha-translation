  text: the little owl[a], the cormorant, and the great owl.
translation:
  language: ta
  text: சிறிய ஆந்தை[a], நீர்க்காகம், பெரிய ஆந்தை ஆகியவற்றையும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இப்பறவைகளின் துல்லியமான அடையாளங்கள் உறுதியில்லை. ‘சிறிய ஆந்தை,’ ‘நீர்க்காகம்,’ ‘பெரிய ஆந்தை’ என்பவை மரபிலும் ஆய்வுலகிலும் முன்வைக்கப்படும் சாத்தியமான பெயர்கள். כוֹס என்பதற்கு ‘ஆந்தை’ அல்லது ‘அலறும் ஆந்தை’ என்றும், שָׁלָךְ என்பதற்கு ‘கூழைக்கடா’ என்றும், יַנְשׁוּף என்பதற்கு ‘கொம்பு ஆந்தை’ அல்லது ‘கழுகு ஆந்தை’ என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכּוֹס
  choice: சிறிய ஆந்தை
  rationale: இது தீட்டான பறவைகளின் பட்டியலில் வரும் ஒரு குறிப்பிட்ட பறவையின் பெயர்; துல்லியமான இனம் உறுதியில்லை. பொதுவாக ஏற்கப்படும் சாத்தியமான அடையாளத்தை உரையில் கொடுத்து, ஐயத்தை அடிக்குறிப்பில் காக்கிறது.
- source_word: הַשָּׁלָךְ
  choice: நீர்க்காகம்
  rationale: இந்த எபிரெயச் சொல்லின் பறவை அடையாளம் விவாதத்திற்குரியது. நீரில் மூழ்கி மீன் பிடிக்கும் பறவையைக் குறிக்கலாம் என்பதால் ‘நீர்க்காகம்’ சாத்தியமான இயல்பான தமிழாக்கம்; மாற்று அடையாளம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: הַיַּנְשׁוּף
  choice: பெரிய ஆந்தை
  rationale: இது இரவுப் பறவையாகவும், பெரிய வகை ஆந்தையாகவும் பொதுவாக அடையாளப்படுத்தப்படுகிறது; குறிப்பிட்ட நவீன இனத்தை உறுதியாகக் கூறாமல் மூலத்தின் தனிப்பெயர்த் தன்மையை வெளிப்படுத்துகிறது.
- source_word: וְאֶת
  choice: ஆகியவற்றையும்
  rationale: மீண்டும் மீண்டும் வரும் இணைப்புச் சொல் மற்றும் நேர்முக வேற்றுமை உருபு முந்தைய பட்டியலின் தொடர்ச்சியைச் சுட்டுகின்றன. தமிழில் பட்டியலின் இறுதியில் ‘ஆகியவற்றையும்’ என்பது இதை இயல்பாக வெளிப்படுத்துகிறது.
