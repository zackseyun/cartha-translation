  text: the gecko[a], the monitor lizard, the lizard, the sand lizard, and the chameleon.
translation:
  language: ta
  text: கெக்கோ பல்லி[a], உடும்பு, பல்லி, மணற்பல்லி, பச்சோந்தி ஆகியவையும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இந்த வசனத்தில் வரும் பல விலங்குகளின் துல்லியமான அடையாளம் உறுதியற்றது. ‘கெக்கோ பல்லி’ என்பதற்கு மரநாய் அல்லது மூஞ்சூறு என்றும்; ‘உடும்பு’ என்பதற்கு பச்சோந்தி என்றும்; ‘மணற்பல்லி’ என்பதற்கு ஸ்கிங்க் வகைப் பல்லி அல்லது பழைய மரபில் நத்தை என்றும்; ‘பச்சோந்தி’ என்பதற்கு மண்ணுள் தோண்டும் சிறு பாலூட்டி அல்லது வேறொரு பல்லி வகை என்றும் கருத்துகள் முன்வைக்கப்பட்டுள்ளன.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֲנָקָה
  choice: பல்லி வகையைச் சேர்ந்த கெக்கோ
  rationale: துல்லியமான விலங்கின அடையாளம் உறுதியில்லை. ஊர்வனவற்றின் இப்பட்டியலில் இது ஒரு வகைப் பல்லியைக் குறிப்பதாகக் கொள்வது பொருத்தமானது; தமிழில் ‘கெக்கோ’ மட்டும் எல்லாருக்கும் தெளிவாக இருக்காது என்பதால் வகைப்பெயரும் சேர்க்கப்பட்டது.
- source_word: הַכֹּחַ
  choice: உடும்பு
  rationale: இது பெரிய பல்லி வகையைக் குறிக்கலாம்; ‘monitor lizard’ என்பதற்கான இயல்பான, பரவலாக அறியப்பட்ட தமிழ்ச் சொல் ‘உடும்பு’.
- source_word: הַלְּטָאָה
  choice: பல்லி
  rationale: குறிப்பிட்ட இனம் தெளிவாக இல்லாததால், எபிரெயச் சொல்லின் பொதுவான விலங்கியல் பொருளை மிகைப்படுத்தாமல் ‘பல்லி’ என வழங்கப்பட்டது.
- source_word: הַחֹמֶט
  choice: மணற்பல்லி
  rationale: ஊர்வனப் பட்டியல் என்ற சூழலில் பழைய ‘நத்தை’ என்ற அடையாளத்தைவிட ஒரு பல்லி வகை பொருத்தமாக உள்ளது; எனினும் துல்லியமான இனம் உறுதியற்றது.
- source_word: הַתִּנְשָׁמֶת
  choice: பச்சோந்தி
  rationale: இதே எபிரெயச் சொல் வேறிடத்தில் ஒரு பறவையைக் குறிக்கக்கூடும்; ஆனால் இங்கு தரையில் ஊர்ந்து செல்லும் உயிரினங்களின் பட்டியலில் வருவதால் ஊர்வன அடையாளமான ‘பச்சோந்தி’ தேர்ந்தெடுக்கப்பட்டது.
