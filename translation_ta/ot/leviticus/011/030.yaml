translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாகப் புரியும் விலங்குப் பெயர்கள் பயன்படுத்தப்பட்டுள்ளன. மூலத்தில் உள்ள ஐந்து பெயர்களின் பட்டியல் அமைப்பும் இறுதியிலுள்ள இணைப்பும் காக்கப்பட்டுள்ளன; விலங்கின அடையாளங்களில் உள்ள உண்மையான ஐயம் அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
