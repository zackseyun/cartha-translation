base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/011.yaml
  text: And they shall be detestable to you; you shall not eat any of their flesh[a], and you shall regard their carcasses as detestable.
translation:
  language: ta
  text: அவை உங்களுக்கு அருவருக்கத்தக்கவையாக[a] இருக்க வேண்டும்; அவற்றின் இறைச்சியில் எதையும் நீங்கள் உண்ணக் கூடாது; அவற்றின் சடலங்களை அருவருக்கத்தக்கவையாகக் கருத வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அருவருப்புக்குரியவையாக’ என்றும் மொழிபெயர்க்கலாம்; இங்குள்ள எபிரேயச் சொல், இந்த உணவுச் சட்டச் சூழலில் சடங்குமுறையில் கடுமையாக ஒதுக்கப்பட வேண்டியவற்றைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁקֶץ
  choice: அருவருக்கத்தக்கவை
  rationale: உணவுச் சட்டத்தின் சூழலில் சடங்குமுறை சார்ந்த கடும் வெறுப்பையும் ஒதுக்குதலையும் குறிக்கும் சொல்லாக இது உள்ளது. ‘தீட்டானவை’ என்பது வேறு எபிரேயத் தூய்மைச் சொற்களோடு கலந்து, இச்சொல்லின் வலிமையைக் குறைக்கக்கூடும்.
- source_word: יִהְיוּ לָכֶם
  choice: அவை உங்களுக்கு ... இருக்க வேண்டும்
  rationale: לָכֶם என்பதன் ‘உங்களுக்கு’ என்ற தொடர்பைத் தக்கவைத்து, சட்டவிதியின் கட்டாயத் தன்மையை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מִבְּשָׂרָם
  choice: அவற்றின் இறைச்சியில் எதையும்
  rationale: மறுக்கப்பட்ட உண்ணுதல் வினைக்குப் பின் வரும் מִן பகுதியைக் குறிக்கும் பயன்பாடு உடையது; ஆகவே எந்தப் பகுதியையும் உண்ணக் கூடாது என்ற பொருளைத் தெளிவாகத் தருகிறது.
- source_word: לֹא תֹאכֵלוּ
  choice: நீங்கள் உண்ணக் கூடாது
  rationale: சட்ட உரையில் உள்ள தடையை நவீன, கண்ணியமான தமிழில் நேரடியாகவும் கட்டாய வலிமையுடனும் தெரிவிக்கிறது.
- source_word: נִבְלָתָם
  choice: அவற்றின் சடலங்கள்
  rationale: இறந்த விலங்குகளின் உடல்களைக் குறிக்கும் சூழலுக்கேற்ற துல்லியமான தமிழ்ச் சொல்.
- source_word: תְּשַׁקֵּצוּ
  choice: அருவருக்கத்தக்கவையாகக் கருத வேண்டும்
  rationale: שֶׁקֶץ உடன் உள்ள சொல்வேர்த் தொடர்பைத் தக்கவைத்து, வெறும் உணர்ச்சிசார் வெறுப்பாக அல்லாமல் அவற்றை ஒதுக்கப்பட்டவையாக மதிப்பிட வேண்டிய சட்ட-சடங்குமுறைச் செயலை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: உணவுச் சட்டத்தில் வரும் ஒதுக்குதல் மொழியின் தன்மை
  choice: ‘அருவருக்கத்தக்கவை’ என்ற சடங்குமுறை சார்ந்த கடும் ஒதுக்குதல் மொழியைப் பயன்படுத்துதல்
  alternative: ‘தீட்டானவை’ அல்லது ‘அருவருப்பான பாவப் பொருட்கள்’ போன்ற மொழியைப் பயன்படுத்துதல்
  rationale: இவ்வசனம் இஸ்ரவேலின் உடன்படிக்கை சார்ந்த உணவு வேறுபாடுகளைப் பற்றியது. தேர்ந்த சொல் உரையின் வலுவான எதிர்மறை மதிப்பீட்டைத் தக்கவைக்கிறது; அதேவேளையில், மூலத்தில் வெளிப்படையாக இல்லாத விரிவான ஒழுக்கக் குற்றப்பொருளைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டவிதிக்குரிய கண்ணியமான நடையைப் பேணுகிறது. தொடக்கத்திலுள்ள ‘மேலும்’ எபிரேய இணைப்புச் சொல்லையும் முந்தைய வசனத்துடனான தொடர்ச்சியையும் பிரதிபலிக்கிறது; அரைப்புள்ளிகள் மூன்று இணைந்த கட்டளைக் கூறுகளின் அமைப்பைத் தக்கவைக்கின்றன.
