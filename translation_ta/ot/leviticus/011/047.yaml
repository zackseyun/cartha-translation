source:
  edition: WLC
  text: לְ/הַבְדִּ֕יל בֵּ֥ין הַ/טָּמֵ֖א וּ/בֵ֣ין הַ/טָּהֹ֑ר וּ/בֵ֤ין הַֽ/חַיָּה֙ הַֽ/נֶּאֱכֶ֔לֶת וּ/בֵין֙ הַֽ/חַיָּ֔ה אֲשֶׁ֖ר לֹ֥א תֵאָכֵֽל׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/047.yaml
  text: to distinguish between the unclean and the clean[a], and between the creature that may be eaten and the creature that may not be eaten.
translation:
  language: ta
  text: தீட்டானதற்கும் தூய்மையானதற்கும் இடையிலும், உண்ணத்தக்க உயிரினத்திற்கும் உண்ணக்கூடாத உயிரினத்திற்கும் இடையிலும் வேறுபடுத்துவதற்காக.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְהַבְדִּיל
  choice: வேறுபடுத்துவதற்காக
  rationale: முந்தைய சூழலில் கூறப்பட்ட சட்டங்களின் நோக்கத்தை உணர்த்தும் எபிரெய நோக்க வினையெச்சத்தைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: בֵּין ... וּבֵין
  choice: …க்கும் …க்கும் இடையில்
  rationale: இரண்டு இணையான எதிரிணைகளை அமைக்கும் எபிரெயத் தொடரைத் தமிழில் இயல்பான இணை அமைப்புடன் காக்கிறது.
- source_word: הַטָּמֵא
  choice: தீட்டானது
  rationale: லேவியராகமத்தின் சடங்கு சார்ந்த வகைப்பாட்டைக் குறிக்கிறது; ஒழுக்கத் தீமை என்ற பொருளைத் தேவையின்றி சேர்ப்பதில்லை.
- source_word: הַטָּהֹר
  choice: தூய்மையானது
  rationale: தீட்டானது என்பதற்கு எதிரான சடங்கு-சட்ட வகைப்பாட்டை நவீனத் தமிழில் தெளிவாகக் குறிக்கிறது.
- source_word: הַחַיָּה
  choice: உயிரினம்
  rationale: விலங்கு என்று குறுக்காமல், இச்சுருக்கக் கூற்றில் உள்ள எபிரெயச் சொல்லின் பரந்த உயிரினப் பொருளைக் காக்கிறது.
- source_word: הַנֶּאֱכֶלֶת
  choice: உண்ணத்தக்க
  rationale: வெறுமனே உண்ண இயலும் என்பதல்லாமல், உணவுச் சட்டத்தின்படி உண்ண அனுமதிக்கப்பட்டது என்ற பொருளைச் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר לֹא תֵאָכֵל
  choice: உண்ணக்கூடாத
  rationale: உண்ணப்படாதது என்ற நிகழ்வை அல்ல, உண்ணுவதற்கான தடையைத் தெளிவான நவீனத் தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: லேவிய உணவுச் சட்டங்களில் சடங்கு தூய்மைச் சொற்கள்
  choice: טָמֵא/טָהֹר என்பவற்றை ‘தீட்டானது/தூய்மையானது’ என்று மொழிபெயர்த்தல்
  alternative: ‘அசுத்தமானது/சுத்தமானது’ அல்லது ‘தூய்மையற்றது/தூய்மையானது’
  rationale: இவை சடங்கு-சட்ட வகைப்பாடுகள் என்பதைத் தக்கவைத்து, உயிரினங்களுக்குத் தன்னியல்பான ஒழுக்கத் தீமை உண்டு என்று உரையில் இல்லாத கருத்தைச் சேர்க்காமல் இருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிதில் புரியும், கண்ணியமான சட்டநடை. எபிரெய வசனம் முந்தைய வாக்கியத்தின் நோக்கத்தைத் தொடரும் வினையெச்சத் துணைவாக்கியமாக இருப்பதால், தமிழிலும் ‘வேறுபடுத்துவதற்காக’ என்று முடிக்கப்பட்டுள்ளது.
