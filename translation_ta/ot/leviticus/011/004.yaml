- from: 'ஆனால், அசைபோடும் விலங்குகளிலும் குளம்பைப் பிளந்துள்ள விலங்குகளிலும் இவற்றை நீங்கள் உண்ணக்கூடாது: ஒட்டகம் அசைபோடுகிறது; ஆனால் அதன் குளம்பு பிளந்திருக்கவில்லை[a]. அது உங்களுக்குத் தீட்டானது[b].'
  to: 'ஆனால், அசைபோடும் விலங்குகளிலிருந்தும் அல்லது குளம்பைப் பிளக்கும் விலங்குகளிலிருந்தும் பின்வருவனவற்றை நீங்கள் உண்ணக்கூடாது: ஒட்டகம் அசைபோடுகிறது; ஆனால் அது குளம்பைப் பிளக்கவில்லை[a]. அது உங்களுக்குத் தீட்டானது[b].'
