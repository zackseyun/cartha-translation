  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: אַ֤ךְ אֶת זֶה֙ לֹ֣א תֹֽאכְל֔וּ מִֽ/מַּעֲלֵי֙ הַ/גֵּרָ֔ה וּ/מִ/מַּפְרִיסֵ֖י הַ/פַּרְסָ֑ה אֶֽת הַ֠/גָּמָל כִּֽי מַעֲלֵ֨ה גֵרָ֜ה ה֗וּא וּ/פַרְסָה֙ אֵינֶ֣/נּוּ מַפְרִ֔יס טָמֵ֥א ה֖וּא לָ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/004.yaml
  text: 'Nevertheless[a], you shall not eat these from among those that chew the cud or from among those that divide the hoof: the camel, because it chews the cud but does not divide the hoof[b]; it is unclean to you.'
translation:
  language: ta
  text: 'ஆனால், அசைபோடும் விலங்குகளிலிருந்தும் அல்லது குளம்பைப் பிளக்கும் விலங்குகளிலிருந்தும் பின்வருவனவற்றை நீங்கள் உண்ணக்கூடாது: ஒட்டகம் அசைபோடுகிறது; ஆனால் அது குளம்பைப் பிளக்கவில்லை[a]. அது உங்களுக்குத் தீட்டானது[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு வகையில்: “அதன் குளம்பு முழுமையாகப் பிளவுபட்டிருக்கவில்லை.”'
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “உங்களுக்குத் தீட்டானது”; அதாவது, இஸ்ரவேலருக்குக் கொடுக்கப்பட்ட உணவுச் சட்டங்களின்படி தீட்டானது.
    reason: cultural_note
lexical_decisions:
- source_word: אַךְ
  choice: ஆனால்
  rationale: முந்தைய விதிக்கு விதிவிலக்கு அல்லது வரம்பை அறிமுகப்படுத்தும் எதிர்மறைத் தொடர்பை இயல்பான தமிழில் காட்டுகிறது.
- source_word: מִמַּעֲלֵי הַגֵּרָה
  choice: அசைபோடும் விலங்குகளில்
  rationale: எபிரெயச் சொற்றொடர் அசையை மீண்டும் வாய்க்குக் கொண்டுவருவதைக் குறிக்கிறது; ‘அசைபோடுதல்’ என்பது இதற்கான தெளிவான வழக்குத் தமிழ்.
- source_word: וּמִמַּפְרִיסֵי הַפַּרְסָה
  choice: குளம்பைப் பிளந்துள்ள விலங்குகளில்
  rationale: இரண்டாவது வகைப்பாட்டு அடையாளத்தைத் துல்லியமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: הַגָּמָל
  choice: ஒட்டகம்
  rationale: குறிப்பிடப்பட்ட விலங்கிற்கான நேரடியான தமிழ் இணைச்சொல்.
- source_word: כִּי מַעֲלֵה גֵרָה הוּא
  choice: ஒட்டகம் அசைபோடுகிறது
  rationale: ஒட்டகம் முதல் தகுதியைப் பெற்றிருப்பதைத் தமிழில் நேரடியாகக் கூறுகிறது.
- source_word: וּפַרְסָה אֵינֶנּוּ מַפְרִיס
  choice: ஆனால் அதன் குளம்பு பிளந்திருக்கவில்லை
  rationale: இரண்டாவது தகுதி இல்லாததையும், இரு பண்புகளுக்கிடையிலான முரண்பாட்டையும் தெளிவாகக் காட்டுகிறது.
- source_word: טָמֵא הוּא לָכֶם
  choice: அது உங்களுக்குத் தீட்டானது
  rationale: லேவியராகமத்தின் தூய்மை வகைப்பாட்டில் טָמֵא என்பதற்குரிய மரபான, புரிந்துகொள்ளத்தக்க தமிழ்ச் சொல்லைத் தேர்ந்தெடுத்து, לָכֶם என்பதையும் காக்கிறது.
theological_decisions:
- issue: லேவிய உணவுச் சட்டத்தில் தீட்டின் தன்மை
  choice: தீட்டானது
  alternative: சடங்குமுறைப்படி தீட்டானது
  rationale: மூலத்தின் טָמֵא என்ற மையச் சொல்லை பிரதான உரையில் காக்கிறது; ‘சடங்குமுறைப்படி’ என்று சேர்த்து அதன் பொருளை தேவையின்றி குறுக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘அசைபோடுதல்’, ‘குளம்பு’, ‘தீட்டு’ ஆகியவை சூழலுக்கேற்ற நிலையான சொற்களாகப் பயன்படுத்தப்பட்டுள்ளன.
