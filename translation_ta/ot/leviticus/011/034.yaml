  text: מִ/כָּל הָ/אֹ֜כֶל אֲשֶׁ֣ר יֵאָכֵ֗ל אֲשֶׁ֨ר יָב֥וֹא עָלָ֛י/ו מַ֖יִם יִטְמָ֑א וְ/כָל מַשְׁקֶה֙ אֲשֶׁ֣ר יִשָּׁתֶ֔ה בְּ/כָל כְּלִ֖י יִטְמָֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/034.yaml
  text: Any food that may be eaten[a], on which water comes, becomes unclean; and any drink that may be drunk in any vessel becomes unclean.
translation:
  language: ta
  text: தண்ணீர் படுகிற உண்ணத்தக்க எந்த உணவும்[a] தீட்டாகும்; எந்தப் பாத்திரத்திலுள்ள குடிக்கத்தக்க பானமும் தீட்டாகும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இன்னும் சொற்சார்ந்து, “உண்ணப்படும் ஒவ்வொரு உணவும், அதன்மேல் தண்ணீர் வருகிறதோ, [தீட்டாகும்].”
    reason: ‘אֲשֶׁר יֵאָכֵל’ என்பதை ‘உண்ணத்தக்க’ என்றும் ‘உண்ணப்படும்’ என்றும் புரிந்துகொள்ளக்கூடிய இலக்கண வாய்ப்பையும், எபிரெயத் தொடர்புத்தொடரின் வடிவையும் காட்டுகிறது.
lexical_decisions:
- source_word: מִכָּל הָאֹכֶל
  choice: எந்த உணவு
  rationale: מִכָּל இங்கு உணவு என்ற பொதுவகைக்குள் ‘எதுவாயினும்’ என்ற பகுதி/பொதுமைப்படுத்தும் பொருளைத் தருகிறது; நவீனத் தமிழில் ‘எந்த உணவு’ இயல்பாக உள்ளது.
- source_word: אֲשֶׁר יֵאָכֵל
  choice: உண்ணத்தக்க
  rationale: நிஃபால் முற்றுப்பெறாத வினை இங்கு உண்ணப்படுவது அல்லது உண்பதற்கு ஏற்றது என்ற தகுதியைக் குறிக்கலாம். ‘உண்ணத்தக்க’ என்பது சட்டவகைப்படுத்தும் பொருளைச் சுருக்கமாகக் காக்கிறது; சொற்சார்ந்த மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אֲשֶׁר יָבֹא עָלָיו מַיִם
  choice: எதன்மேல் தண்ணீர் படுகிறதோ
  rationale: சொற்சார்ந்து ‘அதன்மேல் தண்ணீர் வருகிறதோ’ என்பதாக இருந்தாலும், திரவம் உணவின்மேல் சேர்வதைத் தமிழில் ‘படுகிறது’ என்பது இயல்பாகத் தெரிவிக்கிறது; தண்ணீர் வேண்டுமென்றே ஊற்றப்பட்டது என்று மூலத்தில் இல்லாத செயற்பாட்டை இது சேர்ப்பதில்லை.
- source_word: יִטְמָא
  choice: தீட்டாகும்
  rationale: லேவியராகமத்தின் சடங்குசார் சூழலில் טמא என்பது தீட்டான நிலையை அடைவதைக் குறிக்கிறது. ‘தீட்டாகும்’ மாற்றமடைந்த நிலையைத் தெளிவாகவும் வழக்கமான வேதாகமத் தமிழிலும் தருகிறது.
- source_word: מַשְׁקֶה אֲשֶׁר יִשָּׁתֶה
  choice: குடிக்கத்தக்க பானம்
  rationale: מַשְׁקֶה என்பது குடிக்கப்படும் ஒன்றைக் குறிக்கிறது; தொடர்புடைய நிஃபால் வடிவம் அதன் குடிக்கத்தக்க தன்மையை வகைப்படுத்துகிறது. ‘பானம்’ என்பது ‘திரவம்’ என்பதைவிடத் துல்லியமானது.
- source_word: בְּכָל כְּלִי
  choice: எந்தப் பாத்திரத்திலுள்ள
  rationale: כְּלִי என்பதற்கு இச்சூழலில் ‘பாத்திரம்’ இயல்பானது. ‘எந்தப் பாத்திரத்திலுள்ள’ என்பது பானத்துக்கும் பாத்திரத்துக்கும் உள்ள தொடர்பைத் தெளிவாகவும் சுருக்கமாகவும் தருகிறது.
