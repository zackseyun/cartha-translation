translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் சுருக்கமான பட்டியல் நடை பயன்படுத்தப்பட்டுள்ளது. விலங்கியல் அடையாளம் உறுதியில்லாத இடம் முதன்மை உரையில் கட்டாயமாகத் தீர்மானிக்கப்படாமல் அடிக்குறிப்பில் தெரிவிக்கப்பட்டுள்ளது; ‘அதன் இனங்களோடும்’ என்பது எபிரெய வகைப்பாட்டு சொற்றொடரின் பொருளை இயல்பான தமிழில் தருகிறது.
