base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/019.yaml
  text: and the stork[a], the heron according to its kind, and the hoopoe[c][b], and the bat.
translation:
  language: ta
  text: நாரையையும், அதன் இனத்தின்படியான கொக்கையும்[a], கொண்டலாத்தியையும்[b], வௌவாலையும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு ‘கொக்கு’ என்று மொழிபெயர்க்கப்பட்டுள்ள எபிரெயச் சொல்லின் துல்லியமான பறவையின அடையாளம் உறுதியல்ல; அது அரிவாள் மூக்கன் அல்லது வேறொரு நீண்ட கால்களையுடைய நீர்ப்பறவையைக் குறிக்கவும் வாய்ப்புள்ளது.
    reason: lexical_alternative
  - marker: b
    text: பழைய மொழிபெயர்ப்புகள் சிலவற்றில் வேறொரு பறவையாகக் குறிப்பிடப்பட்டாலும், எபிரெயச் சொல் பெரும்பாலும் கொண்டலாத்தியையே குறிக்கும்.
    reason: alternative_reading
lexical_decisions:
- source_word: חֲסִידָה
  choice: நாரை
  rationale: இந்தப் பறவையின் பரவலாக ஏற்றுக்கொள்ளப்பட்ட அடையாளம் ‘stork’. அதற்கு இயல்பான நவீனத் தமிழ் இணையாக ‘நாரை’ பயன்படுத்தப்படுகிறது.
- source_word: אֲנָפָה
  choice: கொக்கு
  rationale: துல்லியமான பறவையின அடையாளம் உறுதியல்ல; நீண்ட கால்களையுடைய நீர்ப்பறவையான ‘heron’ என்பதே பொதுவான, சூழலுக்குப் பொருந்தும் அடையாளம். தமிழில் ‘கொக்கு’ இயல்பான பொதுப்பெயர்; ஐயப்பாடு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: לְמִינָהּ
  choice: அதன் இனங்களோடும்
  rationale: ஒரே பொதுவகையைச் சேர்ந்த பல தொடர்புடைய வகைகளை இச்சொற்றொடர் குறிக்கிறது. பட்டியலின் தமிழ்நடையில் இயல்பாக அமையவும் எபிரெய வகைப்பாட்டு எண்ணத்தைப் பாதுகாக்கவும் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: דּוּכִיפַת
  choice: கொண்டலாத்தி
  rationale: நவீன அகராதியியல் அடையாளம் ‘hoopoe’ என்பதையே வலுவாக ஆதரிக்கிறது. அதன் தெளிவான தமிழ் பறவைப்பெயர் ‘கொண்டலாத்தி’.
- source_word: עֲטַלֵּף
  choice: வௌவால்
  rationale: இச்சொல்லின் அடையாளம் உறுதியானது. நவீன வகைப்பாட்டில் இது பாலூட்டியாக இருந்தாலும், எபிரெயப் பட்டியல் பறக்கும் உயிரினங்களோடு தோற்றத்தின் அடிப்படையில் இதைச் சேர்க்கிறது.
- source_word: וְאֵת / וְאֶת
  choice: -யையும் / -ஐயும்
  rationale: எபிரெய இணைப்புச் சொல்லும் நேரடி செயப்படுபொருள் குறியும் தமிழில் பட்டியலின் ஒவ்வோர் உறுப்புக்கும் ‘உம்’ இணைந்த இரண்டாம் வேற்றுமை வடிவால் இயல்பாகக் காட்டப்படுகின்றன.
