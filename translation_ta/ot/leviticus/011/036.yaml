  text: However[a], a spring or a cistern collecting water shall remain clean, but whoever touches their carcass shall be unclean.
translation:
  language: ta
  text: ஆனால்[a], நீரூற்றோ நீர்த்தொட்டியோ, நீர் தேங்கிய இடமாக இருந்தால், தீட்டில்லாததாக இருக்கும்; அவற்றின் சடலத்தைத் தொடுகிறவர் தீட்டுப்படுவார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நீர் தேங்கிய இடம்’ என்பதை ‘நீரின் திரட்சி’ அல்லது ‘நீர்த்தேக்கம்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொற்றொடர் ஒன்றாகச் சேர்ந்த அல்லது சேகரிக்கப்பட்ட நீரைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: ஆனால்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட தீட்டு விதிக்கு இங்கு விதிவிலக்கு வருவதை இயல்பான நவீனத் தமிழில் குறிக்கிறது.
- source_word: מַעְיָן
  choice: நீரூற்று
  rationale: இயற்கையாக நீர் வெளிப்படும் ஊற்றைக் குறிக்கும் துல்லியமான, பொதுவாகப் புரியும் சொல்.
- source_word: בּוֹר
  choice: நீர்த்தொட்டி
  rationale: நீரைச் சேமிக்கும் மனிதனால் அமைக்கப்பட்ட குழி அல்லது தொட்டியை இச்சூழலில் குறிக்கிறது; ‘கிணறு’ என்று மொழிபெயர்த்தால் நீர் ஊறும் கிணறு எனத் தவறாகப் புரிந்துகொள்ளப்படலாம்.
- source_word: מִקְוֵה מַיִם
  choice: தண்ணீர் தேங்கும்
  rationale: ‘நீரின் திரட்சி/சேர்க்கை’ என்ற பொருளை, நீர்த்தொட்டியை விளக்கும் இயல்பான தமிழ்ச் சொற்றொடராக வழங்குகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: יִהְיֶה טָהוֹר
  choice: தீட்டில்லாததாகவே இருக்கும்
  rationale: சடங்குசார் தூய்மைச் சூழலைக் காத்து, செத்த உடல் விழுந்தாலும் அந்த நீராதாரம் தீட்டுப்படாது என்ற தொடர்நிலையை ‘வே’ மூலம் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: נֹגֵעַ
  choice: தொடுகிறவன்
  rationale: எபிரெயப் பங்கேற்புவினை பொதுவாக ஒருவரைக் குறிக்கிறது; தமிழில் பொதுப்பொருளுடன் இயல்பாக உள்ளது.
- source_word: נִבְלָתָם
  choice: அவற்றின் செத்த உடல்
  rationale: முந்தைய சூழலில் குறிப்பிடப்பட்ட உயிரினங்களின் பிணத்தைக் குறிக்கிறது; ஒருமை வடிவத்தின் தொகுப்புப் பொருளைத் தக்கவைக்கிறது.
- source_word: יִטְמָא
  choice: தீட்டுப்படுவான்
  rationale: லேவியராகமத்தின் சடங்குசார் அசுத்த நிலையை ஒழுக்கக் குற்றமாக மாற்றாமல் தெளிவாகக் குறிக்கிறது.
theological_decisions:
- issue: சடங்குசார் தூய்மைச் சொற்கள்
  choice: தீட்டில்லாத / தீட்டுப்படுவான்
  alternative: தூய்மையான / தூய்மையற்றவனாவான்
  rationale: இப்பகுதி ஒழுக்கத் தூய்மையை அல்ல, சடங்குசார் நிலையைப் பற்றியது. ‘தீட்டு’ என்ற சொல் அந்த வேறுபாட்டை நவீனத் தமிழில் தெளிவாகக் காட்டுகிறது.
- issue: יִהְיֶה טָהוֹר என்பதிலுள்ள நிலைத்தொடர்ச்சி
  choice: தீட்டில்லாததாகவே இருக்கும்
  alternative: தீட்டில்லாததாக இருக்கும்
  rationale: எபிரெயத்தில் நேரடியாக ‘தொடர்ந்து’ என்ற சொல் இல்லாவிட்டாலும், முந்தைய தீட்டு விதியிலிருந்து அளிக்கப்படும் விதிவிலக்கே சூழலில் முக்கியம். ‘வே’ அந்த தொடர்நிலையை அளவோடு வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் லேவியராகமத்தின் சடங்குசார் மொழிநடையைப் பேணியும் மொழிபெயர்க்கப்பட்டது. ‘செத்த உடல்’ என்பது இயல்பான பொதுமொழி; ‘தீட்டு’ என்பது இங்கு ஒழுக்கக் குற்றமல்ல, சடங்குசார் நிலையைக் குறிக்கிறது.
