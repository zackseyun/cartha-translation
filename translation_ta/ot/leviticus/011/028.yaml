  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/הַ/נֹּשֵׂא֙ אֶת נִבְלָתָ֔/ם יְכַבֵּ֥ס בְּגָדָ֖י/ו וְ/טָמֵ֣א עַד הָ/עָ֑רֶב טְמֵאִ֥ים הֵ֖מָּה לָ/כֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/028.yaml
  text: Whoever carries their carcass shall wash his clothes and be unclean until the evening[a]. They are unclean for you.
translation:
  language: ta
  text: அவற்றின் பிணத்தைச் சுமப்பவர் தம் உடைகளைக் கழுவ வேண்டும்; அவர் மாலைவரை தீட்டானவராக இருப்பார். அவை உங்களுக்குத் தீட்டானவை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַנֹּשֵׂא
  choice: சுமக்கிற எவரும்
  rationale: குறிப்பிட்ட வினையெச்ச வடிவம் பொதுவான சட்டப் பொருளில் ‘சுமக்கிறவர்’ என்பதைக் குறிக்கிறது. ‘எவரும்’ என்பது அந்தப் பொதுவான நிபந்தனையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: נִבְלָתָם
  choice: அவற்றின் பிணத்தை
  rationale: נְבֵלָה என்பது இங்கு விலங்கின் இறந்த உடலை, அதாவது பிணத்தைக் குறிக்கிறது. பன்மை உடைமைப் பின்னொட்டு முந்தைய வசனத்தில் குறிப்பிடப்பட்ட விலங்குகளைச் சுட்டுகிறது; ஒருமைச் சொல் ஒவ்வொரு விலங்கிற்கும் தனித்தனியாகப் பொருந்தும் வகையில் பகிர்நிலைப் பொருளில் புரிந்துகொள்ளப்படலாம். பன்மை வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: தன் உடைகளைக் கழுவ வேண்டும்
  rationale: சட்ட உரையில் இங்குள்ள நிறைவுறா வினை கட்டளைக் கடமையைத் தெரிவிக்கிறது; ‘வேண்டும்’ அதைத் தெளிவாகவும் இயல்பாகவும் தருகிறது. ‘தன் உடைகள்’ என்பது பொதுவாகக் குறிப்பிடப்படும் நபருக்குரிய ஆடைகளைப் பாலினத்தை முன்னிறுத்தாமல் உண்மையுடன் தெரிவிக்கிறது.
- source_word: וְטָמֵא עַד הָעָרֶב
  choice: அவர் மாலைவரை தீட்டுள்ளவராக இருப்பார்
  rationale: இது பிணத்தைச் சுமந்ததன் விளைவாக நீடிக்கும் சடங்குசார் நிலையைத் தெரிவிக்கிறது. ‘மாலைவரை’ என்பது கால எல்லையை இயல்பாகக் குறிக்கிறது; ‘தீட்டுள்ளவராக’ என்பது ஒழுக்கக் குற்றத்தைச் சேர்க்காமல் அந்தச் சடங்குசார் நிலையைப் பாதுகாக்கிறது.
- source_word: טְמֵאִים הֵמָּה לָכֶם
  choice: அவை உங்களுக்குத் தீட்டானவை
  rationale: இந்தச் சொற்றொடர் முன் குறிப்பிடப்பட்ட விலங்குகளின் நிலையை இஸ்ரவேலருக்கான விதியாகச் சுருக்குகிறது. ‘உங்களுக்கு’ என்பது לָכֶם என்பதையும், ‘அவை’ என்பது பன்மைக் குறிப்பையும் நேரடியாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: சடங்குசார் தீட்டு குறித்த சொல்லாட்சி
  choice: தீட்டு / தீட்டான / தீட்டுள்ள
  alternative: அசுத்தம் / அசுத்தமான
  rationale: லேவியராகமத்தின் தூய்மைச் சட்டங்களில் טמא என்பது முதன்மையாகச் சடங்குசார் நிலையைச் சுட்டுகிறது. ‘தீட்டு’ என்ற சொல் ஒழுக்கக் குற்றம் அல்லது உடல் அழுக்கு என்று தேவையின்றி விளக்காமல் அந்தத் தொழில்நுட்பப் பொருளைத் தமிழில் தெளிவாகக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்ட உரைக்கேற்ற கண்ணியமான ஆனால் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. பொதுவான நபரைக் குறிக்கும் இடத்தில் பாலினத்தை தேவையின்றி முன்னிறுத்தாமல் ‘எவரும்’, ‘தன்’, ‘அவர்’ ஆகிய வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன; சடங்குசார் טמא என்பதற்கு தொடர்ச்சியாக ‘தீட்டு’ சொல்லாட்சி காக்கப்பட்டுள்ளது.
