revisions:
- from: அவற்றின் பிணத்தை[a] சுமக்கிற எவரும் தன் உடைகளைக் கழுவ வேண்டும்; அவர் மாலைவரை தீட்டுள்ளவராக இருப்பார். அவை உங்களுக்குத் தீட்டானவை.
  to: அவற்றின் பிணத்தைச் சுமப்பவர் தம் உடைகளைக் கழுவ வேண்டும்; அவர் மாலைவரை தீட்டானவராக இருப்பார். அவை உங்களுக்குத் தீட்டானவை.
  rationale: The revision retains the source meaning and the draft’s carefully chosen ritual-purity terminology, while making the generic subject and ritual-status wording more idiomatic in modern standard Tamil. The footnote continues to preserve the source’s possible distributive/plural nuance.
