  text: אַל תְּשַׁקְּצוּ֙ אֶת נַפְשֹׁ֣תֵי/כֶ֔ם בְּ/כָל הַ/שֶּׁ֖רֶץ הַ/שֹּׁרֵ֑ץ וְ/לֹ֤א תִֽטַּמְּאוּ֙ בָּ/הֶ֔ם וְ/נִטְמֵתֶ֖ם בָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/043.yaml
  text: Do not make yourselves detestable by any swarming thing that swarms[a], and do not make yourselves unclean by them, so that you do not become unclean by them.
translation:
  language: ta
  text: திரளாக இயங்கும் எந்தச் சிறிய உயிரினத்தாலும்[a] உங்களை அருவருப்புக்குரியவர்களாக்கிக்கொள்ளாதீர்கள். அவற்றால் உங்களைத் தீட்டுப்படுத்திக்கொள்ளாதீர்கள்[b]; இல்லையெனில், அவற்றால் தீட்டுப்பட்டவர்களாகிவிடுவீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஊர்ந்து செல்லும் எந்த உயிரினத்தாலும்.” எபிரெயச் சொல் ஊர்வனவற்றை மட்டும் அல்லாமல் திரளாக இயங்கும் சிறிய உயிரினங்களையும் குறிக்கும் பரந்த சொல்லாகும்.
    reason: lexical_alternative
  - marker: b
    text: இங்கு “தீட்டு” என்பது லேவியராகமச் சட்டங்களின்படி ஏற்படும் சடங்கு சார்ந்த தூய்மையின்மையைக் குறிக்கிறது.
    reason: theological_clarity
lexical_decisions:
- source_word: תְּשַׁקְּצוּ אֶת נַפְשֹׁתֵיכֶם
  choice: உங்களையே அருவருப்பானவர்களாக்கிக்கொள்ளாதீர்கள்
  rationale: שׁקץ என்பதன் ‘அருவருப்புக்குரியதாக ஆக்குதல்’ என்ற பொருளையும், נֶפֶשׁ இங்கு ‘உங்கள் ஆத்துமாக்கள்’ என்ற குறுகிய பொருளில் அல்லாமல் முழு நபரைக் குறிக்கும் தற்சுட்டுப் பயன்பாட்டையும் வெளிப்படுத்துகிறது. பின்னர் வரும் טמא என்பதிலிருந்து இதை வேறுபடுத்துகிறது.
- source_word: בְּכָל הַשֶּׁרֶץ הַשֹּׁרֵץ
  choice: திரண்டு அசையும் எந்தச் சிற்றுயிரினாலும்
  rationale: שׁרץ என்ற சொல் ஊர்வதை மட்டும் அல்லாமல் திரளாக இயங்கும் அல்லது பெருகிக் காணப்படும் சிறிய உயிரினங்களின் பரந்த வகையைக் குறிக்கலாம். எபிரெயச் சொல்லின் வினை–பெயர் தொடர்பை இயல்பான தமிழில் ஓரளவு காக்கிறது.
- source_word: תִטַּמְּאוּ
  choice: உங்களைத் தீட்டுப்படுத்திக்கொள்ளாதீர்கள்
  rationale: வினையின் தற்சுட்டுப் பொருளைத் தெளிவாகக் காட்டுகிறது; லேவியராகமத்தின் சடங்குமுறைத் தூய்மைச் சூழலில் ‘அசுத்தமாக்குதல்’ என்பதைவிட ‘தீட்டுப்படுத்துதல்’ துல்லியமானது.
- source_word: וְנִטְמֵתֶם בָּם
  choice: இல்லையெனில், அவற்றால் தீட்டுப்பட்டவர்களாகிவிடுவீர்கள்
  rationale: தடையைத் தொடர்ந்து வரும் விளைவு அல்லது எச்சரிக்கைத் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது. בָּם என்பது அந்த உயிரினங்களே தீட்டுக்கான வழிமூலம் என்பதைச் சுட்டுகிறது.
theological_decisions:
- issue: லேவியராகமத்தின் பரிசுத்தச் சட்டங்களில் טמא என்பதன் பொருள்
  choice: தீட்டுப்பட்ட / தீட்டுப்படுத்திக்கொள்ள
  alternative: அசுத்தமான / களங்கப்பட்ட
  rationale: இங்கு முதன்மையாகக் குறிக்கப்படுவது உடல் அழுக்கோ வெளிப்படையான ஒழுக்கக் குற்றமோ அல்ல; உடன்படிக்கைச் சட்டங்களுக்குள் உள்ள சடங்குமுறைத் தூய்மை நிலை. ‘தீட்டு’ அந்த வேறுபாட்டைக் காக்கிறது; ஆனால் சாதி சார்ந்த கருத்து எதையும் வசனத்துக்குள் சேர்ப்பதில்லை.
- issue: וְנִטְמֵתֶם என்ற இறுதிக் கூறின் தொடர்பு
  choice: 'தடையை மீறுவதால் வரும் விளைவு/எச்சரிக்கை: ‘இல்லையெனில் … ஆகிவிடுவீர்கள்’'
  alternative: ‘அதனால் நீங்கள் தீட்டுப்படாதபடி’ என்ற நோக்கக் கூறு அல்லது ‘நீங்கள் தீட்டுப்படுவீர்கள்’ என்ற நேரடியான இணைப்பு
  rationale: எபிரெய வாவ் இணைப்பின் நெகிழ்வையும் தடைக்குப் பின்வரும் நடைமுறை விளைவையும் கருத்தில் கொண்டு எச்சரிக்கைத் தொடர்பு தேர்ந்தெடுக்கப்பட்டது; இது காரணத்தை அளவுக்கு மீறி கோட்பாட்டாக்காமல் இயல்பான தமிழை வழங்குகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் மரியாதைமிக்க நடையில் மொழிபெயர்க்கப்பட்டது. ‘அருவருப்பானவர்களாக்கிக்கொள்ளாதீர்கள்’ மற்றும் ‘தீட்டுப்படுத்திக்கொள்ளாதீர்கள்’ என்பவை மூலத்தில் உள்ள இரு வேறு வினைகளையும் தற்சுட்டுத் தன்மையையும் காக்கின்றன. ‘திரண்டு அசையும் சிற்றுயிர்’ என்பது பாரம்பரியமான ‘ஊர்வன’ என்பதைக் காட்டிலும் மூலச் சொல்லின் பரந்த உயிரியல் வகையை வெளிப்படுத்துகிறது.
