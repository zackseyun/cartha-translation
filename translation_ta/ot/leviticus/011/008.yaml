  yaml_path: translation/ot/leviticus/011/008.yaml
  text: You shall not eat any of their flesh[a], and you shall not touch their carcasses; they are unclean to you.
translation:
  language: ta
  text: அவற்றின் இறைச்சியில் எதையும் நீங்கள் உண்ணக்கூடாது; அவற்றின் சடலங்களைத்[a] தொடக்கூடாது; அவை உங்களுக்குத் தீட்டானவை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயச் சொல் இறந்த விலங்கின் உடலைக் குறிக்கிறது; ‘இறந்த உடல்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבְּשָׂרָם
  choice: அவற்றின் இறைச்சியில் எதையும்
  rationale: מִן என்பதன் பகுதியைக் குறிக்கும் பொருளை ‘எதையும்’ என்பதன் மூலம் வெளிப்படுத்துகிறது; בָּשָׂר இங்கு விலங்கின் சதையை உணவுச் சூழலில் குறிக்கும் என்பதால் இயல்பான தமிழில் ‘இறைச்சி’ என மொழிபெயர்க்கப்பட்டது.
- source_word: לֹא תֹאכֵלוּ
  choice: நீங்கள் உண்ணக்கூடாது
  rationale: சட்டரீதியான தடையைத் தெளிவாகவும் நவீனத் தமிழுக்கு இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וּבְנִבְלָתָם
  choice: அவற்றின் செத்த உடல்களை
  rationale: נְבֵלָה என்பது இறந்த விலங்கின் உடலைக் குறிக்கிறது. ‘செத்த உடல்’ என்பது மனிதப் பிணம் என்ற தவறான எண்ணத்தைத் தவிர்த்து, பொருளை நேரடியாகத் தருகிறது.
- source_word: לֹא תִגָּעוּ
  choice: தொடக்கூடாது
  rationale: נגע என்பதன் நேரடியான ‘தொடு/தொடர்புகொள்’ என்ற பொருளைச் சுருக்கமாகவும் தெளிவாகவும் தருகிறது.
- source_word: טְמֵאִים
  choice: தீட்டானவை
  rationale: லேவியராகமத்தின் சடங்குசார் தூய்மை விதிகளில் טָמֵא குறிக்கும் வகைப்பாட்டை, ஒழுக்கக்கேடு என்ற பொருளைச் சேர்க்காமல், தமிழில் நிலைபெற்ற ‘தீட்டு’ சொல்லால் தெரிவிக்கிறது.
- source_word: הֵם לָכֶם
  choice: அவை உங்களுக்குத் தீட்டானவை
  rationale: לָכֶם என்பதன் இஸ்ரவேலருடனான தொடர்புசார் வலிமையை ‘உங்களுக்கு’ எனப் பாதுகாக்கிறது.
theological_decisions:
- issue: லேவிய உணவுச் சட்டத்தில் தீட்டின் தன்மை
  choice: ‘தீட்டானவை’ என்று சடங்குசார் வகைப்பாட்டைப் பாதுகாத்தல்
  alternative: ‘தூய்மையற்றவை’ என்று மொழிபெயர்த்தல்
  rationale: இவ்வசனம் இஸ்ரவேலின் தூய்மைச் சட்ட வகைப்பாட்டைப் பேசுகிறது. இதை ஒழுக்கத் தீமை என மாற்றாமலும், இச்சட்டத்தின் பிற்கால உடன்படிக்கைப் பயன்பாட்டைப் பற்றிய முடிவை மொழிபெயர்ப்பில் புகுத்தாமலும் இருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குத் தெளிவான, கண்ணியமான சட்டநடை. ‘உண்ணக்கூடாது’, ‘தொடக்கூடாது’ ஆகியவை தடையின் வலிமையை இயல்பாகத் தெரிவிக்கின்றன.
