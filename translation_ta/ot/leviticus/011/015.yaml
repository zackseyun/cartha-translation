lexical_decisions:
- source_word: אֵת
  choice: '[தனியாக மொழிபெயர்க்கப்படவில்லை]'
  rationale: இது நேரடிச் செயப்படுபொருளைக் குறிக்கும் எபிரெய இலக்கணத் துகள். முந்தைய வசனத்தில் தொடங்கும் பட்டியலின் தொடர்ச்சியாகத் தமிழில் அதன் பொருள் வாக்கிய அமைப்பில் வெளிப்படுகிறது.
- source_word: כָּל
  choice: ஒவ்வொன்றும்
  rationale: ஒருமைத் தொகுப்புப் பெயருடன் வரும் כָּל, இங்கு அந்த இனத்தைச் சேர்ந்த அனைத்தையும் உள்ளடக்கும் பகிர்வுப் பொருளில் உள்ளது.
- source_word: עֹרֵב
  choice: காக்கை
  rationale: எபிரெயச் சொல் பொதுவாக raven என்பதைக் குறித்தாலும், காக்கை/அண்டங்காக்கை குடும்பத்தைப் பரந்த வகையில் குறிக்கக்கூடும். இயல்பான நவீனத் தமிழில் ‘காக்கை’ தெளிவான பொதுப்பெயராக உள்ளது; குறிப்பான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לְמִינוֹ
  choice: இனத்தைச் சேர்ந்த
  rationale: לְמִין + பின்னொட்டு என்பது ஆசாரிய நூல்களில் வகைப்படுத்தலைக் குறிக்கும் நிலையான தொடர். ‘இனத்தைச் சேர்ந்த’ என்பது நவீன உயிரியல் துல்லியத்தைத் தேவையின்றி புகுத்தாமல் இயல்பாக அந்த வகைப்பாட்டுப் பொருளைக் காட்டுகிறது.
