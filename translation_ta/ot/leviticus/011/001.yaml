  source_fidelity: திருத்தம் தேவை. மூலத்தில் உள்ள יהוה, ‘யெகோவா’ அல்ல, POB-இன் நிர்ணயிக்கப்பட்ட வடிவான ‘யாவே’ என வழங்கப்பட வேண்டும். மேலும், ‘பேசி ... சொன்னது’ என்பது ஒரே எபிரெய வினை மற்றும் לֵאמֹר-ஐ தமிழில் தேவையற்ற இரட்டைச் செயலாகவும் இயல்பற்ற நடையிலும் காட்டுகிறது.
  naturalness: ‘யாவே மோசேக்கும் ஆரோனுக்கும் இவ்வாறு கூறினார்:’ என்பது நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமான வேதாகம நடையிலும் உள்ளது. ‘இவ்வாறு’ என்பது அடுத்து வரும் நேரடி உரையைத் தெளிவாகத் தொடங்குகிறது.
