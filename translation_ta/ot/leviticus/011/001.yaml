    text: 'எபிரெயம்: ‘YHWH’; மரபாக ‘கர்த்தர்’ என்று மொழிபெயர்க்கப்படுகிறது.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பேசி
  rationale: דבר என்பதன் தொடர்கதை வடிவம் புதிய உரைநிகழ்வை அறிமுகப்படுத்துகிறது; தெய்வீக உரைக்கு ஏற்ற இயல்பான, கண்ணியமான தமிழ் சொல்.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: திருப்பெயரான יהוה-ஐ ஒரு பட்டப்பெயராக மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட ஒலிபெயர்ப்பு வடிவில் தருகிறது.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: மோசேயிடமும் ஆரோனிடமும்
  rationale: இருவரும் உரையின் முகவரிகள் என்பதை, எபிரெயத்தில் மீண்டும் வரும் אֶל முன்னிடைச்சொல்லுக்கு ஏற்றவாறு தெளிவாகக் காட்டுகிறது.
- source_word: לֵאמֹר
  choice: சொன்னது
  rationale: தொடர்ந்து வரும் நேரடி உரையை அறிமுகப்படுத்தும் எபிரெயச் சூத்திரத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֲלֵהֶם
  choice: அவர்கள் இருவரிடமும்
  rationale: மோசே, ஆரோன் ஆகிய இருவரையும் பன்மைச் சுட்டுப்பெயர் மீண்டும் குறிப்பதை வழுவாமல் பாதுகாக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட இறைப்பெயர் நேரடியாக இருப்பதால் அதை ஒரு பொதுப் பட்டப்பெயரால் மாற்றவில்லை. எபிரெய உயிரொலிப்பு உறுதியாகத் தெரியாததால் மாற்று ஒலிபெயர்ப்பை அடிக்குறிப்பு சுட்டுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான வேதாகம நடையைப் பேணுகிறது. אֲלֵהֶם என்பதன் மீள்சுட்டலை ‘அவர்கள் இருவரிடமும்’ என்று வெளிப்படையாக வைத்துள்ளது; வசனம் அடுத்த உரைக்குத் திறப்பதால் இறுதியில் முக்காற்புள்ளி பயன்படுத்தப்பட்டுள்ளது.
