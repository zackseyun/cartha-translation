  yaml_path: translation/ot/leviticus/011/020.yaml
  text: Every swarming winged creature that walks on four feet is detestable to you[a][b][c].
translation:
  language: ta
  text: சிறகுள்ள கூட்டமாகத் திரியும் உயிரினங்கள் அனைத்தும் நான்கு கால்களில் நடப்பவை உங்களுக்கு அருவருப்பானவை[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பறக்கும், கூட்டமாகத் திரியும் உயிரினங்கள்.” எபிரெயச் சொல் பறவைகளை மட்டும் அல்லாமல் பறக்கும் உயிரினங்களைப் பரந்த பொருளில் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயில், “நான்கின்மேல் நடப்பவை.” இது நான்கு கால்களைப் பயன்படுத்தி நகர்வதைக் குறிக்கும் சொற்றொடர்; எனினும் அடுத்த வசனங்கள் துள்ளுவதற்கான கால்களையுடைய சில பூச்சிகளுக்கு விதிவிலக்கு அளிக்கின்றன.
    reason: cultural_note
  - marker: c
    text: அல்லது, “உங்களுக்கு அருவருப்புக்குரியவை.” இங்குள்ள சொல் உணவுச் சட்டங்களில் சடங்குசார் அருவருப்பைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל
  choice: ஒவ்வொன்றும்
  rationale: சட்டத்தின் கீழ் இந்த வகையைச் சேர்ந்த ஒவ்வோர் உயிரினத்தையும் தனித்தனியாக உள்ளடக்கும் எபிரெய விநியோகப் பொருளைத் தெரிவிக்கிறது.
- source_word: שֶׁרֶץ
  choice: ஊரும் உயிரினம்
  rationale: சிறியதாக ஊர்ந்து அல்லது கூட்டமாகத் திரியும் உயிரின வகையை இயல்பான நவீனத் தமிழில் குறிக்கிறது; இங்கே இதை வெறும் பறவையாகக் கட்டுப்படுத்தவில்லை.
- source_word: הָעוֹף
  choice: சிறகுள்ள
  rationale: இச்சூழலில் பறவைகள் மட்டுமல்லாமல் பறக்கும் பூச்சிகளும் அடங்குவதால், பரந்த வகைப்பாட்டைத் தக்கவைக்கிறது.
- source_word: הַהֹלֵךְ
  choice: நடக்கும்
  rationale: உயிரினத்தின் வழக்கமான நகரும் முறையைக் குறிக்கும் எபிரெயப் பங்கேற்புச் சொல்லுக்கு நேரான, இயல்பான இணை.
- source_word: עַל אַרְבַּע
  choice: நான்கு கால்களில்
  rationale: எழுத்துப்படி 'நான்கின்மேல்' என்பதன் உடற்கூற்றுச் சார்ந்த பொருளைத் தெளிவுபடுத்துகிறது; அடுத்த வசனங்களில் சில துள்ளும் பூச்சிகளுக்கான விதிவிலக்கு வருகிறது.
- source_word: שֶׁקֶץ
  choice: அருவருப்பானது
  rationale: உணவுத் தூய்மைச் சட்டங்களில் சடங்குசார் வெறுப்புக்குரிய அல்லது விலக்கப்பட்ட நிலையை வலுவாகக் குறிக்கிறது; இதை பொதுவான 'தீட்டானது' என்பதோடு ஒன்றாக்கவில்லை.
- source_word: לָכֶם
  choice: உங்களுக்கு
  rationale: இந்த வகை உயிரினங்களை இஸ்ரவேலர் தங்களுக்கு அருவருப்பானவையாகக் கருத வேண்டும் என்ற உறவுப்பொருளைத் தக்கவைக்கிறது.
theological_decisions:
- issue: שֶׁקֶץ என்பதன் சட்டச் சூழல்
  choice: அருவருப்பானது
  alternative: தீட்டானது / அருவருப்புக்குரியது
  rationale: இங்கே சொல்லின் வலிமையையும் உணவுச் சட்டங்களிலுள்ள சடங்குசார் விலக்கையும் காக்கிறது; அதைத் தானாகவே ஒழுக்கத் தீமைக்கான தீர்ப்பாக மாற்றவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்ட உரைக்கு ஏற்ற சுருக்கமானதும் கண்ணியமானதுமான நடை. எபிரெய வகைப்பாட்டு மொழியை மிகையாக அறிவியல் வகைப்பாடாக மாற்றாமல், சாதாரண வாசகருக்குப் புரியும் வகையில் வழங்கப்பட்டுள்ளது.
