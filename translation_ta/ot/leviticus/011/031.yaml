id: LEV.11.31
reference: Leviticus 11:31
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: אֵ֛לֶּה הַ/טְּמֵאִ֥ים לָ/כֶ֖ם בְּ/כָל הַ/שָּׁ֑רֶץ כָּל הַ/נֹּגֵ֧עַ בָּ/הֶ֛ם בְּ/מֹתָ֖/ם יִטְמָ֥א עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/031.yaml
  text: These are unclean for you among all the swarming things[b][a]. Everyone who touches them when they are dead shall be unclean until the evening.
translation:
  language: ta
  text: ஊர்ந்து திரியும் சிறு உயிரினங்கள் அனைத்திலும் இவையே உங்களுக்குத் தீட்டானவை. இவை இறந்த நிலையில்[a] இவற்றைத் தொடுகிற எவரும் மாலைவரை தீட்டுப்பட்டிருப்பார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “அவற்றின் மரணத்தில்”; அவை இறந்திருக்கும்போது அவற்றைத் தொடுவதையே இங்கு குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה הַטְּמֵאִים לָכֶם
  choice: இவையே உங்களுக்குத் தீட்டானவை
  rationale: אֵלֶּה என்பதைச் சுட்டும் பன்மையாகவும், הַטְּמֵאִים என்பதை லேவியராகமத்தின் சடங்குசார் தூய்மைச் சூழலில் இயல்பான ‘தீட்டானவை’ என்றும் வழங்குகிறது; לָכֶם என்பதன் உடன்படிக்கை சார்ந்த தொடர்பை ‘உங்களுக்கு’ காக்கிறது.
- source_word: בְּכָל הַשָּׁרֶץ
  choice: ஊர்ந்து திரியும் சிறு உயிரினங்கள் அனைத்திலும்
  rationale: שֶׁרֶץ என்பது திரளாக இயங்கும் அல்லது ஊர்ந்து செல்லும் சிறிய உயிரினங்களை விரிவாகக் குறிக்கும் வகைப்பாட்டுச் சொல். குறிப்பிட்ட விலங்கியல் பிரிவாகச் சுருக்காமல், தமிழில் புரியும்படி இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: כָּל הַנֹּגֵעַ בָּהֶם
  choice: இவற்றைத் தொடுகிற எவரும்
  rationale: பொதுவான, ஒவ்வொருவருக்கும் பொருந்தும் நிபந்தனையை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְּמֹתָם
  choice: இவை இறந்த நிலையில்
  rationale: சொல்லுக்குச் சொல் ‘அவற்றின் மரணத்தில்’ என்றாலும், இங்கு மரண நிகழ்வின் கணத்தைவிட அவற்றின் இறந்த உடல்நிலையோடு ஏற்படும் தொடர்பே கருத்து.
- source_word: יִטְמָא עַד הָעָרֶב
  choice: மாலைவரை தீட்டுப்பட்டிருப்பார்
  rationale: தொடுதலால் விளையும் சடங்குசார் தீட்டு மாலைவரை நீடிக்கும் என்பதைத் தமிழ் சட்டநடைத் தெளிவுடன் தெரிவிக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான சட்டநடை பயன்படுத்தப்பட்டுள்ளது. ‘தீட்டு’ என்பது இங்கு ஒழுக்கக் குற்றத்தை அல்ல, சடங்குசார் அசுத்த நிலையைக் குறிக்கிறது. שֶׁרֶץ என்பதன் பரந்த உயிரின வகைப்பாட்டை மிகத் துல்லியமாகச் சுருக்காமல் ‘ஊர்ந்து திரியும் சிறு உயிரினங்கள்’ என வழங்கப்பட்டுள்ளது.
