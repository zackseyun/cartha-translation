  terminology: '''தீட்டானவை'' and ''தீட்டுப்பட்டிருப்பார்'' consistently express Levitical ritual impurity. ''ஊர்ந்து திரியும் சிறு உயிரினங்கள்'' is a suitably broad, non-technical rendering of the Hebrew category without falsely identifying a precise zoological class.'
