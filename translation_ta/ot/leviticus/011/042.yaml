base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/042.yaml
  text: Anything that goes on its belly[a], and anything that goes on four feet, even every creature with many feet, among all the swarming things that swarm on the earth—you shall not eat them[c][b], for they are detestable.
translation:
  language: ta
  text: நிலத்தில் ஊர்ந்து திரியும் உயிரினங்களில், வயிற்றின்மேல் நகர்வதையும், நான்கு கால்களின்மேல் நகர்வதையும், பல கால்களையுடைய எதையும் நீங்கள் உண்ணக்கூடாது; ஏனெனில் அவை அருவருப்பானவை[c].[b][a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வயிற்றால் ஊர்கிற எதையும்.’
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், ‘ஊர்ந்து திரியும் ஊரும் உயிரினம்’ என்று ஒரே வேர்ச்சொல் மீண்டும் வருகிறது; இது இந்த உயிரின வகையை வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘வெறுக்கத்தக்கவை.’ உணவுத் தூய்மைச் சட்டச் சூழலில் விலக்கத்தக்கவற்றைக் குறிக்கும் வலுவான சொல்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל
  choice: எதையும் / அனைத்தையும்
  rationale: வெவ்வேறு உயிரின வகைகளை ஒவ்வொன்றாகவும் முழுமையாகவும் உள்ளடக்கும் எபிரெய விநியோகப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הוֹלֵךְ עַל גָּח
  choice: வயிற்றின்மேல் செல்கிற
  rationale: நகரும் முறையைச் சொல்லும் எபிரெய சொற்றொடருக்கு நெருக்கமாக உள்ளது; ‘ஊர்கிற’ என்று மட்டும் மொழிபெயர்த்து பொருளை மிகையாகக் குறிப்பாக்கவில்லை.
- source_word: הוֹלֵךְ עַל אַרְבַּע
  choice: நான்கு கால்களின்மேல் செல்கிற
  rationale: எபிரெயின் தெளிவான உடற்கூறு உருவகத்தையும் நகரும் முறையையும் காக்கிறது.
- source_word: עַד כָּל מַרְבֵּה רַגְלַיִם
  choice: பல கால்களையுடைய அனைத்தையும்
  rationale: முந்தைய வகைகளோடு பல கால்கள் கொண்ட உயிரினங்களையும் சேர்க்கும் உள்ளடக்கப் பொருளை இயல்பாகத் தருகிறது.
- source_word: לְכָל הַשֶּׁרֶץ הַשֹּׁרֵץ
  choice: ஊர்ந்து திரியும் உயிரினங்கள் அனைத்திலும்
  rationale: ஒரே வேரிலிருந்து வந்த பெயர்ச்சொல்–வினையெச்ச மறுமொழியின் வகைப்பாட்டுப் பொருளை வாசிக்கத்தக்க தமிழில் தருகிறது; அதன் எபிரெய வடிவம் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: עַל הָאָרֶץ
  choice: நிலத்தில்
  rationale: இங்கு உயிரினங்கள் நகரும் தரைப்பரப்பைக் குறிக்கும் சூழலில் ‘நிலத்தில்’ என்பது இயல்பும் துல்லியமும் உடையது.
- source_word: לֹא תֹאכְלֻם
  choice: நீங்கள் சாப்பிடக் கூடாது
  rationale: சட்ட உரையின் நேரடியான தடையுத்தரவை நவீனத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: שֶׁקֶץ
  choice: அருவருப்பானவை
  rationale: உணவுத் தூய்மைச் சட்டச் சூழலில் விலக்கத்தக்கதும் வெறுக்கத்தக்கதுமான நிலையை வலுவாகக் காட்டுகிறது; தேவையற்ற பிற்கால இறையியல் பொருளைச் சேர்க்கவில்லை.
theological_decisions:
- issue: பரிசுத்தச் சட்டத்தில் இந்தத் தடையின் இயல்பு
  choice: லேவியராகமத் தூய்மைச் சட்டத்திற்குள் உள்ள நேரடியான உணவுத் தடையாக மொழிபெயர்க்கப்பட்டது.
  alternative: இதை எல்லாக் காலத்திற்குமான அறநெறிக் கட்டளையாக விளக்குவது அல்லது வெறும் பண்பாட்டு விலக்காக மென்மைப்படுத்துவது.
  rationale: எபிரெய உரை நேரடியாக உண்பதைத் தடை செய்கிறது; அதன் பிற்காலப் பொருந்துதலைப் பற்றிய சமயக் கோட்பாட்டு விவாதத்தை இந்த வசனம் தானாகத் தீர்மானிப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்ட உரைக்கேற்ற கண்ணியமான நேரடி நடை பயன்படுத்தப்பட்டுள்ளது. ‘செல்கிற’ என்பது மூலத்தின் பொதுவான நகர்தல் வினையைப் பாதுகாக்கிறது; ‘ஊர்ந்து திரியும்’ என்பது שׁרץ வகைப்பாட்டை இயல்பான தமிழில் எடுத்துரைக்கிறது.
