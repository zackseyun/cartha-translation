base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/040.yaml
  text: And the one who eats any of its carcass shall wash his clothes and be unclean until the evening[b][a], and the one who carries its carcass shall wash his clothes and be unclean until the evening.
translation:
  language: ta
  text: அதன் சடலத்தின் ஏதேனும் ஒரு பகுதியைச் சாப்பிடுகிறவன் தன் உடைகளைக் கழுவ வேண்டும்; மாலைவரை தீட்டுள்ளவனாய் இருப்பான்[a][b]. அதன் சடலத்தைச் சுமக்கிறவனும் தன் உடைகளைக் கழுவ வேண்டும்; மாலைவரை தீட்டுள்ளவனாய் இருப்பான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, இஸ்ரவேலின் சடங்கியல் தூய்மைச் சட்டங்களின்படி தீட்டுள்ளவராக இருப்பார்.
    reason: cultural_note
  - marker: b
    text: ‘அதன் சடலத்திலிருந்து’ அல்லது ‘அதன் சடலத்தின் ஒரு பகுதியை’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொற்றொடர் பகுதி சார்ந்த பொருளுடையது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֹכֵל
  choice: சாப்பிடுகிறவன்
  rationale: குறிப்பிட்ட வினையெச்சம் பொதுவாக அந்தச் செயலைச் செய்யும் எவரையும் குறிக்கிறது; தமிழில் ஒருமை சட்டநடை இயல்பாகப் பாதுகாக்கப்படுகிறது.
- source_word: מִנִּבְלָתָהּ
  choice: அதன் சடலத்தில் சிறிதை
  rationale: מִן இங்கு பகுதி சார்ந்த பொருளைத் தருகிறது; சடலத்தின் ஒரு பகுதியைச் சாப்பிடுவதைக் காட்ட ‘சிறிதை’ என வெளிப்படுத்தப்பட்டது.
- source_word: נִבְלָתָהּ
  choice: அதன் சடலம்
  rationale: இச்சூழலில் נְבֵלָה மனித உடலை அல்ல, இறந்த விலங்கின் சடலத்தைக் குறிக்கிறது.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: தன் உடைகளைக் கழுவ வேண்டும்
  rationale: சட்ட உரையில் இம்முற்றுப்பெறா வினை கட்டளைக் கடமையை உணர்த்துகிறது; ‘வேண்டும்’ நவீன தமிழில் தெளிவான விதிமுறை நடையாகும்.
- source_word: וְטָמֵא
  choice: தீட்டுள்ளவனாக இருப்பான்
  rationale: இது லேவியராகமத் தூய்மைச் சட்டங்களின்படியான அசுத்த நிலையைக் குறிக்கிறது; தமிழ்வேதாகமச் சூழலில் ‘தீட்டு’ அந்தச் சடங்கியல் நிலையைத் துல்லியமாக உணர்த்துகிறது.
- source_word: עַד הָעָרֶב
  choice: மாலைவரை
  rationale: எபிரெயச் சட்டச் சூத்திரத்தின் கால எல்லையை இயல்பான, சுருக்கமான தமிழில் தருகிறது.
- source_word: הַנֹּשֵׂא
  choice: சுமக்கிறவன்
  rationale: இது செயலைச் செய்கிற எவரையும் குறிக்கும் பெயர்ச்சொல் பயன்பாட்டிலான வினையெச்சம்; முதல் கூறுடன் இணையான ஒருமை அமைப்பு காக்கப்படுகிறது.
theological_decisions:
- issue: தீட்டு மொழியின் இயல்பு
  choice: முதன்மை உரையில் ‘தீட்டுள்ளவனாக’ என மொழிபெயர்த்து, அதன் சடங்கியல் பொருளை அடிக்குறிப்பில் விளக்குதல்
  alternative: ‘சடங்கின்படி தீட்டுள்ளவனாக’ என்று முதன்மை உரையிலேயே விரிவுபடுத்துதல்
  rationale: טָמֵא என்பதில் ‘சடங்கியல்’ என்ற தனிச் சொல் இல்லை; ஆனால் இச்சூழல் இஸ்ரவேலின் தூய்மைச் சட்டங்களைச் சார்ந்தது. ஆகவே மூலத்தின் சுருக்கம் காக்கப்பட்டு விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: சட்ட வினையெச்சங்களில் பாலின வெளிப்பாடு
  choice: எபிரெய ஒருமை ஆண்பால் வடிவத்தைத் தொடர்ந்து ‘சாப்பிடுகிறவன்’, ‘சுமக்கிறவன்’, ‘தன் உடைகள்’ என வழங்குதல்
  alternative: பாலினப் பொதுமையை வெளிப்படுத்த பன்மை அல்லது ‘எவர்’ வடிவைப் பயன்படுத்துதல்
  rationale: எபிரெய உரையின் ஒருமைச் சட்ட வடிவம் பிரதிநிதித்துவப் பொதுப்பொருளைக் கொண்டது; அதைத் தமிழிலும் இயல்பான ஒருமை சட்டநடையில் காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான சட்டநடை பயன்படுத்தப்பட்டுள்ளது. ‘வேண்டும்’ கட்டளைக் கடமையையும், ‘இருப்பான்’ அதன் விளைவான நிலையையும் வேறுபடுத்துகிறது. ‘தீட்டு’ என்ற மரபறிந்த சொல் பயன்படுத்தப்பட்டாலும், அதை ஒழுக்கக் குற்றமாகத் தவறாகப் புரிந்துகொள்ளாதபடி அடிக்குறிப்பு சேர்க்கப்பட்டுள்ளது.
