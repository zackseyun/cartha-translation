  yaml_path: translation/ot/leviticus/011/038.yaml
  text: But if water is put on the seed[a], and any of their carcasses falls on it, it is unclean to you.
translation:
  language: ta
  text: ஆனால் விதையின்மேல் தண்ணீர் விடப்பட்டிருந்தால், அவற்றின் சடலங்களில் ஏதேனும் ஒன்று அதன்மேல் விழுந்தால், அது உங்களுக்குத் தீட்டானது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִי
  choice: ஆனால் ... பின்பு ... விழுந்தால்
  rationale: முந்தைய வசனத்துடன் உள்ள நிபந்தனை சார்ந்த முரண்பாட்டை ‘ஆனால்’ காட்டுகிறது; முழு வாக்கியமும் தமிழில் இயல்பான நிபந்தனை அமைப்பில் தரப்படுகிறது.
- source_word: יֻתַּן מַיִם עַל זֶרַע
  choice: விதையின்மேல் தண்ணீர் ஊற்றப்பட்ட பின்பு
  rationale: Hophal செயப்பாட்டு வடிவத்தைக் ‘ஊற்றப்பட்ட’ எனக் காக்கிறது. இங்கு தண்ணீர் விதையின்மேல் இடப்படுவதைக் குறிக்க ‘ஊற்று’ இயல்பான தமிழ்; ‘பின்பு’ அந்நிலையின் விளைவைக் காட்டுகிறது, ஆனால் வெறும் ‘ஈரப்படுத்தப்பட்ட’ என்ற விளக்கத்தைச் சேர்ப்பதில்லை.
- source_word: וְנָפַל
  choice: விழுந்தால்
  rationale: சட்டவிதிக்குரிய நிபந்தனையை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מִנִּבְלָתָם
  choice: அவற்றின் சடலங்களில் ஏதாவது
  rationale: מן என்பதன் பகுதிப்பொருளையும், נְבֵלָה என்பதன் விலங்கு சடலம் என்ற பொருளையும் காக்கிறது.
- source_word: עָלָיו
  choice: அதன்மேல்
  rationale: ஒருமை கூட்டுப்பெயரான ‘விதை’யைத் தெளிவாகச் சுட்டுகிறது.
- source_word: טָמֵא הוּא לָכֶם
  choice: அது உங்களுக்குத் தீட்டானது
  rationale: லேவியராகமத் தூய்மைச் சட்டத்தின் சடங்குசார் நிலையை, ஒழுக்கக் குற்றமாக மாற்றாமல், தமிழில் வழக்கமான ‘தீட்டு’ சொல்லால் தெரிவிக்கிறது.
theological_decisions:
- issue: טָמֵא என்பதன் தன்மை
  choice: சடங்குசார் தீட்டு
  alternative: ஒழுக்கரீதியான களங்கம் அல்லது பாவம்
  rationale: இவ்வசனம் விலங்குச் சடலத்தால் ஏற்படும் லேவியத் தூய்மைநிலையைப் பற்றியது; ஒழுக்கக் குற்றத்தைப் பற்றியது அல்ல.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்குப் புரியும் dignified சட்டநடை பயன்படுத்தப்பட்டுள்ளது. ‘தீட்டானது’ என்பது இச்சூழலில் சடங்குசார் அசுத்தநிலையைக் குறிக்கிறது.
