  register: நவீன நிலையான தமிழில், சட்ட அறிவுறுத்தலுக்கேற்ற கண்ணியமான நேரடி நடை பயன்படுத்தப்பட்டுள்ளது. ‘உண்ணுதல்’ வேதாகமச் சூழலுக்கேற்ற உயர்நடைத் தன்மையைத் தக்கவைத்தாலும் பொதுவாசகருக்குப் புரியக்கூடியது. எபிரெய ஒருமை வடிவமும் அதன் கூட்டுப்பொருளும் அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளன.
