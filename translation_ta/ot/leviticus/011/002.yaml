  text: Speak to the sons of Israel[a], saying[c][b], ‘These are the living creatures that you may eat from among all the animals that are on the earth.’
translation:
  language: ta
  text: 'இஸ்ரவேல் மக்களிடம் இவ்வாறு சொல்லுங்கள்: ‘பூமியில் உள்ள எல்லா விலங்குகளிலிருந்தும் நீங்கள் உண்ணக்கூடிய உயிரினங்கள் இவையே.’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דַּבְּרוּ
  choice: பேசிச் சொல்லுங்கள்
  rationale: இது பன்மை கட்டளை; முந்தைய வசனச் சூழலில் மோசேயையும் ஆரோனையும் நோக்கிக் கூறப்படுகிறது. அடுத்துள்ள לֵאמֹר என்பதையும் தமிழில் இயல்பாக இணைக்கிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மக்கள்
  rationale: எபிரெயச் சொற்றொடர் சொல்லர்த்தமாக ‘இஸ்ரவேலின் மகன்கள்.’ இங்கு முழு உடன்படிக்கைச் சமூகத்தையும் குறிக்கும் கூட்டுப்பெயராக இருப்பதால், நவீனத் தமிழில் ‘மக்கள்’ இயல்பாகவும் உள்ளடக்கமாகவும் உள்ளது; சொல்லர்த்த வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לֵאמֹר
  choice: சொல்லுங்கள்
  rationale: நேர்கூற்றை அறிமுகப்படுத்தும் வழக்கமான எபிரெய வடிவம்; דַּבְּרוּ உடன் ‘பேசிச் சொல்லுங்கள்’ என இணைப்பது தமிழில் தெளிவான கட்டளைநடையை அளிக்கிறது.
- source_word: זֹאת הַחַיָּה
  choice: உயிரினங்கள் இவையே
  rationale: வடிவத்தில் சுட்டுப்பெயரும் பெயர்ச்சொலும் ஒருமையாக இருந்தாலும், தொடர்ந்து வரும் பட்டியலை வகைப்படுத்தும் கூட்டுப்பொருள் இங்கு உள்ளது. தமிழ் பன்மை இயல்பாக அந்த வகைப்பாட்டு நோக்கத்தை வெளிப்படுத்துகிறது; வடிவ ஒருமை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: אֲשֶׁר תֹּאכְלוּ
  choice: நீங்கள் உண்ணக்கூடிய
  rationale: சட்டச் சூழலில் அனுமதிக்கப்பட்ட உணவைச் சுட்டுகிறது; ‘உண்பீர்கள்’ என்ற வெறும் எதிர்காலத்தைவிட ‘உண்ணக்கூடிய’ அனுமதி/தகுதி நுணுக்கத்தைத் தருகிறது.
- source_word: מִכָּל הַבְּהֵמָה
  choice: எல்லா விலங்குகளிலிருந்தும்
  rationale: מִן + כֹּל தேர்ந்தெடுக்கும் பகுதிப்பொருளைக் காட்டுகிறது. בְּהֵמָה இங்கு நிலவாழ் விலங்குகளுக்கான விரிவான வகைப்பெயராகப் பயன்படுகிறது.
- source_word: אֲשֶׁר עַל הָאָרֶץ
  choice: பூமியில் உள்ள
  rationale: பின்வரும் நீர்வாழ் உயிரினங்கள் போன்ற பிரிவுகளிலிருந்து நிலவாழ் உயிரினங்களை வேறுபடுத்தும் இடவியல் சொற்றொடர். ‘நிலத்தில் உள்ள’ என்பதும் சாத்தியம்.
