base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/055.yaml
  text: For the sons of Israel are my servants[a]; they are my servants, whom I brought out of the land of Egypt[b]. I am Yahweh your God.
translation:
  language: ta
  text: ஏனெனில் இஸ்ரயேல் மக்கள்[a] என் அடிமைகள்[b]; எகிப்து நாட்டிலிருந்து நான் வெளியே கொண்டுவந்த அவர்கள் என் அடிமைகள். நானே உங்கள் கடவுளாகிய யாவே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “இஸ்ரயேலின் மகன்கள்”; “இஸ்ரயேலின் பிள்ளைகள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “பணியாளர்கள்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் கட்டுப்பட்ட பணிநிலையைக் குறிக்கக்கூடும்; இங்கு இஸ்ரயேலர் மனித எஜமானர்களுக்கல்ல, யாவேவுக்குச் சொந்தமானவர்கள் என்பது வலியுறுத்தப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கட்டளைகளுக்கான காரணத்தை அறிமுகப்படுத்தும் எபிரெய இணைப்புச்சொல்லின் விளக்க வலிமையை இயல்பான தமிழில் தருகிறது.
- source_word: לִי
  choice: எனக்குச் சொந்தமான
  rationale: இங்கு முன்னிடைச்சொல்லும் பிரதிப்பெயரும் உடைமை அல்லது உரிமைசார் உறவைக் குறிக்கின்றன; சூழலில் மனித எஜமானர்களுக்கு மாறாக யாவேவுக்குச் சொந்தமானவர்கள் என்ற கருத்து மையமாக உள்ளது.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரயேல் மக்கள்
  rationale: சொல்லுக்குச் சொல் ‘இஸ்ரயேலின் மகன்கள்’ என்றாலும், இது முழு இஸ்ரயேல் சமூகத்தையும் குறிக்கும் மரபுத்தொடர். ‘இஸ்ரயேல் மக்கள்’ என்பது அதன் கூட்டுப்பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது; நேரடிப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: עֲבָדִים / עֲבָדַי
  choice: அடிமைகள் / என் அடிமைகள்
  rationale: עבד என்பது பணியாளர் அல்லது அடிமை எனும் பொருள்வீச்சைக் கொண்டது. யூபிலி சட்டங்களின் இச்சூழலில் கட்டுப்பட்ட நிலையும் யாருக்குச் சொந்தமானவர்கள் என்ற முரண்பாடும் முக்கியமாதலால் ‘அடிமைகள்’ அதன் வலிமையைப் பாதுகாக்கிறது. எபிரெய உரையின் வலியுறுத்தும் மறுபடியும் தமிழிலும் வைக்கப்பட்டுள்ளது.
- source_word: אֲשֶׁר הוֹצֵאתִי אוֹתָם
  choice: நான் வெளியே கொண்டுவந்த அவர்கள்
  rationale: எகிப்திலிருந்து விடுவித்து அழைத்து வந்த நிகழ்வைக் குறிக்கும் வழக்கமான யாத்திராகமச் சொல்லாட்சியைத் தக்கவைக்கிறது.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: எகிப்து நாட்டிலிருந்து
  rationale: எபிரெய மூலத்தின் ‘எகிப்து நாடு’ என்ற நிலையான சொற்றொடரைச் சுருக்கமின்றி இயல்பான தமிழில் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகத் தனிப்பெயரை பொதுப்பட்டமாக மாற்றாமல் ஒலிபெயர்க்கிறது.
- source_word: אֱלֹהֵיכֶם
  choice: உங்கள் கடவுள்
  rationale: உடன்படிக்கைச் சூத்திரத்தின் இரண்டாம் நபர் பன்மை உடைமை வடிவத்தை நேரடியாகப் பிரதிபலிக்கிறது.
theological_decisions:
- issue: உடன்படிக்கைச் சார்ந்த சொந்தத்தையும் கட்டுப்பட்ட பணிநிலையையும் குறிக்கும் עבד என்பதன் மொழிபெயர்ப்பு
  choice: அடிமைகள்
  alternative: பணியாளர்கள் / ஊழியர்கள்
  rationale: இஸ்ரயேலர் மனிதர்களின் நிரந்தர உடைமையாக இருக்கக்கூடாது என்பதற்கான காரணமாக அவர்கள் யாவேவுக்குச் சொந்தமானவர்கள் என வசனம் கூறுகிறது. ஆகவே மென்மையான ‘பணியாளர்கள்’ என்பதைக் காட்டிலும் ‘அடிமைகள்’ இந்தச் சட்டச் சூழலின் பதற்றத்தையும் உரிமைசார் வலிமையையும் தெளிவாகக் காக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: בְנֵי יִשְׂרָאֵל என்ற ஆண்பால் வடிவமுள்ள கூட்டுப்பெயர்
  choice: இஸ்ரயேல் மக்கள்
  alternative: இஸ்ரயேலின் மகன்கள் / இஸ்ரயேலின் பிள்ளைகள்
  rationale: இந்த எபிரெய மரபுத்தொடர் ஆண்களை மட்டும் அல்லாமல் உடன்படிக்கைச் சமூகமான இஸ்ரயேலரை மொத்தமாகக் குறிக்கிறது. நவீன தமிழில் தவறான பாலினக் கட்டுப்பாட்டை உருவாக்காமல் அதன் உண்மையான கூட்டுப்பொருளை முதன்மை உரை தருகிறது; வடிவநேர்த்தியான மாற்று அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘எனக்குச் சொந்தமான’ என்பது לִי என்பதன் உரிமைசார் கருத்தைத் தெளிவாக்குகிறது; ‘என் அடிமைகள்’ என்ற மறுபடி எபிரெய வலியுறுத்தலைப் பாதுகாக்கிறது. தெய்வீகப் பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
