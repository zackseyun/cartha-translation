    issue: The two occurrences of the Hebrew possessive formulation are rendered differently.
    rationale: 'The source has an emphatic repetition: “they are mine as slaves; they are my slaves.” Rendering both as “என் அடிமைகள்” better retains the deliberate repetition and is more concise in Tamil.'
