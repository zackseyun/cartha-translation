base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/047.yaml
  text: If the means of a resident foreigner among you become sufficient[a], and your brother beside him becomes poor and sells himself to the resident foreigner among you, or to a member of the foreigner’s clan,
translation:
  language: ta
  text: உங்களுடன் குடியிருக்கும் அந்நியன் பொருள்வளம் பெற்றிருக்க, அவனுடன் இருக்கும் உன் சகோதரன் வறுமையடைந்து, உங்களுடன் குடியிருக்கும் அந்த அந்நியனுக்கோ அந்நியனுடைய குடும்பத்தைச் சேர்ந்த ஒருவனுக்கோ[a] தன்னை விற்றால்,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்நியனுடைய குடும்பத்தின் வேர்க்கிளைக்கோ.” இதற்கான எபிரெயச் சொற்றொடரின் துல்லியப் பொருள் உறுதியற்றது.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַשִּׂיג יַד
  choice: பொருள்வளம் பெற்றிருக்க
  rationale: ‘கை எட்டுதல்’ என்ற எபிரெய மரபுத்தொடர் இங்கு போதிய பொருளாதார வசதியை அடைவதைக் குறிக்கிறது. அதன் பொருளை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: גֵּר וְתוֹשָׁב
  choice: உங்களுடன் குடியிருக்கும் அந்நியன்
  rationale: இரு சொற்களும் சேர்ந்து இஸ்ரவேலரிடையே தங்கியிருந்த, பிற இனத்தைச் சேர்ந்த குடியிருப்பாளரைக் குறிக்கின்றன. தமிழில் தேவையற்ற இரட்டிப்பைத் தவிர்த்து குடியிருப்பு நிலையையும் அந்நியர் நிலையையும் காக்கிறது.
- source_word: וּמָךְ
  choice: வறுமையடைந்து
  rationale: முன்பு இருந்த நிலையிலிருந்து ஏழ்மை நிலைக்குச் செல்வதை வினைச்சொல் குறிக்கிறது.
- source_word: אָחִיךָ
  choice: உன் சகோதரன்
  rationale: சூழலில் இது சக இஸ்ரவேலரைக் குறித்தாலும், சட்டத்தின் குடும்ப உறவுசார் அறநெறி வலிமையைக் காக்க மூலத்தின் ‘சகோதரன்’ என்ற சொல்லே வைக்கப்படுகிறது.
- source_word: עִמּוֹ
  choice: அவனுடன் இருக்கும்
  rationale: வறுமையடைந்த சகோதரனை பொருள்வளம் பெற்ற அந்நியனுடன் தொடர்புபடுத்தும் மூலத்தின் இடைநிலைத் தொடர்பை இயல்பான தமிழில் காட்டுகிறது.
- source_word: וְנִמְכַּר
  choice: தன்னை விற்றால்
  rationale: வடிவம் செயப்பாட்டுப் பொருளையும் அனுமதித்தாலும், கடன் வறுமையால் ஒருவர் தம்மை ஊழியத்துக்கு விற்பதே இச்சட்டச் சூழலில் குறிக்கப்படுகிறது.
- source_word: לְעֵקֶר מִשְׁפַּחַת גֵּר
  choice: அந்நியனுடைய குடும்பத்தைச் சேர்ந்த ஒருவனுக்கு
  rationale: עֵקֶר என்பதன் துல்லியப் பொருள் கடினமானது; குடும்பத்தின் வேர், கிளை அல்லது உறுப்பினர் என்ற கருத்துகளில், சூழலுக்குப் பொருந்தும் வாசிக்கத்தக்க பொருள் முதன்மை உரையில் தரப்படுகிறது.
theological_decisions:
- issue: இஸ்ரவேலருக்கான உறவுமுறைச் சொல்லை மொழிபெயர்த்தல்
  choice: உன் சகோதரன்
  alternative: உன் சக இஸ்ரவேலன் / உன் உறவினன்
  rationale: மூலத்தின் குடும்ப உறவுச் சொல்லையும் அதன் அறநெறி அழுத்தத்தையும் காக்கிறது; அதை வெறும் குடியுரிமை அடையாளமாக மாற்றவில்லை.
- issue: וְנִמְכַּר குறிக்கும் விற்பனையின் தன்மை
  choice: தன்னை விற்றால்
  alternative: விற்கப்பட்டால்
  rationale: எபிரெய வடிவத்தின் செயப்பாட்டு சாத்தியத்தை ஏற்றுக்கொண்டபோதும், லேவியராகமம் 25-ன் கடன் அடிமைத்தனச் சூழலில் தன்னையே சேவைக்காக விற்பது இயல்பான கருத்தாகும்.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்ட உரைக்கு ஏற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. வசனம் அடுத்த வசனத்தில் தொடர்வதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது. கடினமான இறுதிச் சொற்றொடருக்கான அடிக்குறி அதே இடத்தில் குறிக்கப்பட்டுள்ளது.
