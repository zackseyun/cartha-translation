  source_fidelity: 'மூலத்தின் நிபந்தனைத் தொடரும் பொருளாதார எதிர்மறை நிலையும் துல்லியமாகக் காக்கப்பட்டுள்ளன: உங்களிடையே குடியிருக்கும் அந்நியரின் வசதி/செல்வம் பெருகுதல், அதனோடு தொடர்பாகச் சகோதரன் வறுமையடைதல், பின்னர் தன்னை விற்றுக்கொள்ளுதல். גֵּר וְתוֹשָׁב இணைப்பை “உங்களுடன் குடியிருக்கும் அந்நியன்” என இயல்பாக ஒருங்கிணைத்திருப்பது ஏற்றது. לְעֵקֶר מִשְׁפַּחַת גֵּר என்பதன் உறுதியற்ற தன்மையை முதன்மை உரையின் வாசிக்கத்தக்க பொருளும் அடிக்குறிப்பும் சேர்ந்து சரியாகக் காக்கின்றன.'
