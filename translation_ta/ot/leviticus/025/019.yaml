source:
  edition: WLC
  text: וְ/נָתְנָ֤ה הָ/אָ֨רֶץ֙ פִּרְיָ֔/הּ וַ/אֲכַלְתֶּ֖ם לָ/שֹׂ֑בַע וִֽ/ישַׁבְתֶּ֥ם לָ/בֶ֖טַח עָלֶֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/019.yaml
  text: The land will yield its fruit[a], and you will eat your fill and live securely on it.
translation:
  language: ta
  text: நிலம் தன் கனியைக் கொடுக்கும்; நீங்கள் வயிறார உண்டு, அதில் பாதுகாப்பாக வாழ்வீர்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “வாழ்வீர்கள்” என்பதை “குடியிருப்பீர்கள்” என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல் ஓர் இடத்தில் வாழ்வதையோ குடியிருப்பதையோ குறிக்கலாம்; இச்சொற்றொடர் அந்த நிலத்தில் பாதுகாப்பாகக் குடியிருப்பதை வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתְנָה
  choice: கொடுக்கும்
  rationale: נתן என்பதன் அடிப்படைப் பொருளான ‘கொடு’ என்பதையும், நிலம் தன் விளைச்சலைத் தருகிறது என்ற வேளாண்மைச் சூழலையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הָאָרֶץ
  choice: நிலம்
  rationale: லேவியராகமம் 25-ன் சூழலில் இது பொதுவாகப் பூமியை அல்ல, இஸ்ரயேலருக்குக் கொடுக்கப்பட்ட விவசாய நிலத்தைச் சுட்டுகிறது.
- source_word: פִּרְיָהּ
  choice: தன் கனி
  rationale: פְּרִי என்பதன் நேரடியான ‘கனி’ என்ற உருவகத்தைப் பேணுகிறது; இங்கு அது நிலத்தின் மொத்த விளைச்சலையும் உள்ளடக்கலாம்.
- source_word: וַאֲכַלְתֶּם
  choice: நீங்கள் ... உண்டு
  rationale: இரண்டாம் நபர் பன்மையையும் அடுத்துவரும் நிறைவு உணர்வையும் இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: לָשֹׂבַע
  choice: வயிறார
  rationale: שֹׂבַע குறிக்கும் திருப்தியடையும் அளவுக்கு உண்பதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וִישַׁבְתֶּם
  choice: வாழ்வீர்கள்
  rationale: ישב இங்கு ஓர் இடத்தில் நிலையாக வாழ்தல் அல்லது குடியிருத்தலைக் குறிக்கிறது; ‘வாழ்வீர்கள்’ பொதுவான வாசகருக்கு இயல்பானது, ‘குடியிருப்பீர்கள்’ என்ற மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: לָבֶטַח
  choice: பாதுகாப்பாக
  rationale: בֶּטַח குறிக்கும் அச்சமற்ற பாதுகாப்பான வாழ்வைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: עָלֶיהָ
  choice: அதில்
  rationale: பெண்பால் ஒருமையான ‘நிலம்’ என்பதையே திரும்பச் சுட்டி, அந்த நிலத்தில் வாழ்வதை இயல்பான தமிழில் தெரிவிக்கிறது.
