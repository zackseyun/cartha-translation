base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/037.yaml
  text: You shall not lend him your money at interest[b][a], nor give him your food for increase.
translation:
  language: ta
  text: உன் பணத்தை அவனுக்கு வட்டிக்குக் கடனாகக் கொடுக்காதே; உன் உணவையும் ஆதாயத்திற்காகக் கொடுக்காதே.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஆதாயத்திற்காக” என்பதற்கு மாற்றாக, “அதிகரிப்புடன்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல், கொடுக்கப்பட்டதற்கு மேலாகப் பெறப்படும் பெருக்கம் அல்லது கூடுதலைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּסְפְּךָ
  choice: உன் பணத்தை
  rationale: כֶּסֶף என்பதன் அடிப்படைப் பொருள் ‘வெள்ளி’; ஆனால் கடன் கொடுக்கும் இந்தச் சட்டப் பொருளாதாரச் சூழலில் அது ‘பணம்’ என்பதைக் குறிக்கிறது.
- source_word: תִתֵּן לוֹ
  choice: அவனுக்குக் கடனாகக் கொடுக்காதே
  rationale: נתן என்பதற்கு நேரடியாக ‘கொடு’ என்று பொருள்; பணமும் வட்டியும் குறிப்பிடப்படும் சூழல், இங்கு கடன் கொடுப்பதைக் குறிக்கிறது என்பதைத் தெளிவாக்குகிறது.
- source_word: בְּנֶשֶׁךְ
  choice: வட்டிக்கு
  rationale: נֶשֶׁךְ கடனுக்காகப் பெறப்படும் கூடுதல் தொகையை, அதாவது வட்டியைக் குறிக்கிறது; ‘வட்டி’ என்பது இயல்பான நவீனத் தமிழ் சொல்.
- source_word: וּבְמַרְבִּית
  choice: ஆதாயத்திற்காக
  rationale: מַרְבִּית என்பது கொடுக்கப்பட்ட பொருளுக்கு மேலாகப் பெறும் பெருக்கம் அல்லது ஆதாயத்தைக் குறிக்கிறது. உணவைப் பற்றிய இணைத் தடையில் ‘ஆதாயத்திற்காக’ என்பது பொருளை இயல்பாகத் தெரிவிக்கிறது; ‘அதிகரிப்புடன்’ என்பது மாற்று நேரடி வாசிப்பு.
- source_word: אָכְלֶךָ
  choice: உன் உணவையும்
  rationale: אָכֶל என்பதன் நேரடிப் பொருள் ‘உணவு’; இது மூலத்தின் concrete சொல்லாட்சியைத் தக்கவைக்கிறது.
- source_word: לֹא ... לֹא
  choice: கொடுக்காதே ... கொடுக்காதே
  rationale: இரு இணையான தடைகளையும் தமிழில் தெளிவான சட்டக் கட்டளைகளாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: מַרְבִּית என்பதன் பொருள்—பொதுவான அதிகரிப்பா அல்லது ஆதாயமா
  choice: ஆதாயத்திற்காக
  alternative: அதிகரிப்புடன்
  rationale: சொல் நேரடியாக ‘பெருக்கம்/அதிகரிப்பு’ எனப் பொருள்படலாம்; ஆனால் உணவை வழங்கி மேலதிகம் பெறும் பொருளாதாரச் சூழலில் ‘ஆதாயம்’ இயல்பான தமிழ். மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுமக்களுக்கு எளிதில் புரியும் தமிழ். ‘கடனாக’ என்பது சூழலால் குறிக்கப்படும் பொருளை இயல்பாக வெளிப்படுத்துகிறது; இரு தடைகளின் இணை அமைப்பு தக்கவைக்கப்பட்டுள்ளது.
