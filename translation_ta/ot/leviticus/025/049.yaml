  text: or his uncle[a], or his uncle’s son, may redeem him; or one of his close blood relatives from his clan may redeem him; or if his hand prospers[b], he may redeem himself.
translation:
  language: ta
  text: அல்லது அவனுடைய தந்தையின் சகோதரனோ, அவனுடைய தந்தையின் சகோதரனின் மகனோ[a] அவனை மீட்டுக்கொள்ளலாம்; அல்லது அவனுடைய குலத்தைச் சேர்ந்த நெருங்கிய இரத்த உறவினர்களில் ஒருவர் அவனை மீட்டுக்கொள்ளலாம்; அல்லது அவனுக்குப் போதிய வசதி கிடைத்தால்[b], அவன் தன்னை மீட்டுக்கொள்ளலாம்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், “அவனுடைய தந்தையின் சகோதரனின் மகன்”; அதாவது, அவனுடைய உறவுச் சகோதரன் (cousin).
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவனுடைய கை போதிய அளவை எட்டினால்.” எபிரெய மரபுத்தொடர் அவனுக்குத் தன்னை மீட்டுக்கொள்ளத் தேவையான பொருளாதார வசதி கிடைப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “அவன் மீட்கப்படலாம்.” எபிரெய வினை வடிவம் செயப்பாட்டுத் தோற்றம் கொண்டது; இச்சூழல் அவன் தன்னை மீட்டுக்கொள்வதைக் குறிக்கிறது.
    reason: ambiguity
lexical_decisions:
- source_word: דֹדוֹ
  choice: அவனுடைய தந்தையின் சகோதரன்
  rationale: இச்சட்டத்தின் உறவுமுறைச் சூழலில் דּוֹד என்பது ‘நேசிப்பவர்’ என்ற பொருளில் அல்லாமல் தந்தையின் சகோதரனைக் குறிக்கிறது. ‘மாமா’ போன்ற சொற்களால் தாய்வழி உறவு எனத் தவறாகப் புரிந்துகொள்ளப்படாமல் இருக்க உறவு வெளிப்படையாகச் சொல்லப்பட்டுள்ளது.
- source_word: בֶן דֹּדוֹ
  choice: அவருடைய மகன்
  rationale: எபிரெய மொழியில் நேரடியாக ‘அவனுடைய தந்தையின் சகோதரனின் மகன்’ என்று உள்ளது. முந்தைய உறவுச் சொல்லைத் தொடர்ந்து ‘அவருடைய மகன்’ என்பது தமிழில் இயல்பாகவும் மூலத்தின் உறவுமுறையைத் தெளிவாகவும் தருகிறது.
- source_word: יִגְאָלֶנּוּ
  choice: அவனை மீட்டுக்கொள்ளலாம்
  rationale: גאל என்ற உறவினரால் செய்யப்படும் சட்டப்பூர்வ மீட்பைக் குறிக்கும் முக்கியச் சொல்லை ‘மீட்டுக்கொள்’ என்பதால் தொடர்ச்சியாகக் காக்கிறது; இங்கு கட்டாயக் கட்டளையைவிட அனுமதி அல்லது சாத்தியத்தைக் காட்ட ‘லாம்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: מִשְּׁאֵר בְּשָׂרוֹ
  choice: நெருங்கிய இரத்த உறவினர்களில் ஒருவர்
  rationale: ‘அவனுடைய மாம்சத்தின் நெருங்கியவர்’ என்ற எபிரெய மரபுத்தொடர் நெருங்கிய இரத்த உறவைக் குறிக்கிறது. அதன் உடல்சார்ந்த உருவகத்தை மரத்த தமிழில் தராமல் உறவின் தன்மையைத் தெளிவாகச் சொல்கிறது.
- source_word: מִמִּשְׁפַּחְתּוֹ
  choice: அவனுடைய குலத்தைச் சேர்ந்த
  rationale: מִשְׁפָּחָה இச்சமூகச் சட்டச் சூழலில் தனிக்குடும்பத்தைவிட விரிந்த உறவுக் குழுவைக் குறிப்பதால் ‘குலம்’ பொருத்தமானது.
- source_word: הִשִּׂיגָה יָדוֹ
  choice: அவனுடைய கைக்கு போதிய வசதி எட்டினால்
  rationale: ‘அவனுடைய கை எட்டுதல்’ என்ற எபிரெய உருவகத்தைத் தமிழில் ஓரளவு காத்தபடியே, தன்னை மீட்கத் தேவையான பொருளாதார வசதி கிடைப்பதே பொருள் என்பதை வெளிப்படுத்துகிறது.
- source_word: וְנִגְאָל
  choice: அவன் தன்னையே மீட்டுக்கொள்ளலாம்
  rationale: எபிரெய வடிவம் இலக்கணத்தில் இறைச்செயப்பாட்டு வடிவமாக இருந்தாலும், போதிய வசதி பெற்றவன் தனது விடுதலை விலையைச் செலுத்தும் சூழலில் தமிழில் தற்சுட்டுப் பொருள் இயல்பானது. வடிவிலுள்ள மாற்றுவாசிப்பு அடிக்குறிப்பில் காக்கப்பட்டுள்ளது.
theological_decisions:
- issue: உறவினர் மீட்பைக் குறிக்கும் גאל சொல்லின் மொழிபெயர்ப்பு
  choice: ‘மீட்டுக்கொள்’ என்பதைப் பயன்படுத்துதல்
  alternative: ‘விலைகொடுத்து வாங்கிக்கொள்’
  rationale: இது பொருளாதாரப் பரிவர்த்தனையை உள்ளடக்கியிருந்தாலும், அதிகாரம் முழுவதும் தொடரும் உறவினர்-மீட்பு கருத்தையும் அதன் சட்ட-இறையியல் ஒற்றுமையையும் ‘மீட்டுக்கொள்’ சிறப்பாகக் காக்கிறது.
- issue: הִשִּׂיגָה יָדוֹ என்னும் கை-மரபுத்தொடர்
  choice: ‘அவனுடைய கைக்கு போதிய வசதி எட்டினால்’ என்று உருவகத்தை வாசிக்கத்தக்க வகையில் காத்தல்
  alternative: ‘அவன் போதிய வசதி பெற்றால்’
  rationale: மூலத்தின் தனித்துவமான ‘கை’ உருவகத்தை முற்றிலும் நீக்காமல், அதன் பொருளாதாரப் பொருளையும் சாதாரண தமிழ் வாசகருக்குத் தெளிவாக்குகிறது.
- issue: וְנִגְאָל என்பதன் செயப்பாட்டு வடிவமும் சூழல்சார் தற்சுட்டுப் பொருளும்
  choice: முதன்மை உரையில் ‘அவன் தன்னையே மீட்டுக்கொள்ளலாம்’
  alternative: ‘அவன் மீட்கப்படலாம்’
  rationale: முந்தைய நிபந்தனை அவனுக்கே போதிய வசதி கிடைப்பதைச் சொல்வதால் தன்னை மீட்டுக்கொள்வதே சூழலின் இயல்பான பொருள். எனினும் எபிரெய வடிவின் செயப்பாட்டு தோற்றம் அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன செந்தமிழுக்கு அணுக்கமான, கண்ணியமான சட்டநடை பயன்படுத்தப்பட்டுள்ளது. ‘தந்தையின் சகோதரன்’ என்பது பிராந்தியத்துக்கு ஏற்ப மாறும் உறவுப்பெயர்களைத் தவிர்த்துத் துல்லியத்தைப் பேணுகிறது. அரைப்புள்ளிகள் மூன்று மாற்று மீட்பு வழிகளையும் தெளிவாகப் பிரிக்கின்றன.
