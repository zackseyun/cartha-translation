source:
  edition: WLC
  text: וּֽ/שְׂדֵ֛ה מִגְרַ֥שׁ עָרֵי/הֶ֖ם לֹ֣א יִמָּכֵ֑ר כִּֽי אֲחֻזַּ֥ת עוֹלָ֛ם ה֖וּא לָ/הֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/034.yaml
  text: But the field of pastureland belonging to their cities must not be sold[b][a], for it is their permanent possession.
translation:
  language: ta
  text: ஆனால், அவர்களுடைய நகரங்களைச் சேர்ந்த மேய்ச்சல் நிலம் விற்கப்படக் கூடாது; ஏனெனில் அது அவர்களுக்கு நிலையான உடைமை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நிலையான உடைமை” என்பதை “என்றென்றைக்குமான உடைமை” என்றும் மொழிபெயர்க்கலாம். இங்கு எபிரேயச் சொல், இந்த நிலம் பிறருக்கு நிரந்தரமாக மாற்றப்படாமல் அவர்களுக்குரியதாகத் தொடர்ந்து இருப்பதைக் குறிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: וּשְׂדֵה
  choice: ஆனால் ... வயல்
  rationale: שָׂדֶה என்பதன் நேரடிப் பொருளான ‘வயல்’ தக்கவைக்கப்படுகிறது; முன்னுள்ள விதியுடன் உள்ள மாறுபாட்டை וּ இங்கு ‘ஆனால்’ என இயல்பாகக் காட்டுகிறது.
- source_word: מִגְרַשׁ
  choice: மேய்ச்சல் நிலம்
  rationale: லேவியர் நகரங்களைச் சுற்றியிருந்த திறந்த வெளி அல்லது கால்நடை மேய்ச்சலுக்குரிய பொதுநிலத்தை இச்சொல் குறிக்கிறது; ‘மேய்ச்சல் நிலம்’ சூழலுக்கு ஏற்ற தெளிவான நவீனத் தமிழ்.
- source_word: עָרֵיהֶם
  choice: அவர்களுடைய நகரங்களைச் சேர்ந்த
  rationale: எபிரேய ஆக்கநிலைத் தொடரிலுள்ள உடைமைத் தொடர்பைத் தமிழில் இயல்பாகவும் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: לֹא יִמָּכֵר
  choice: விற்கப்படக் கூடாது
  rationale: Niphal வினையின் செயப்பாட்டு வடிவத்தையும் சட்டத் தடையின் வலிமையையும் நவீனத் தமிழில் நேரடியாகத் தருகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய தடைக்கான காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: אֲחֻזַּת עוֹלָם
  choice: நிலையான உடைமை
  rationale: நிலச் சட்டச் சூழலில் மாற்றிக் கொடுக்க முடியாத, தொடர்ந்து நிலைக்கும் உரிமையைக் குறிக்கிறது; காலவரையற்ற metaphysical பொருளைத் தேவையின்றி மிகைப்படுத்தாது.
- source_word: הוּא לָהֶם
  choice: அது அவர்களுக்கு
  rationale: அந்த நிலம் அவர்களுக்குரிய உடைமை என்பதை எபிரேய வாக்கிய அமைப்புக்கு நெருக்கமாகக் காட்டுகிறது.
theological_decisions:
- issue: இஸ்ரவேலின் நிலச் சட்டத்தில் עוֹלָם என்பதன் வலிமை
  choice: நிலையான
  alternative: என்றென்றைக்குமான / நிரந்தரமான
  rationale: இச்சட்டச் சூழலில் இச்சொல் நிலத்தின் தொடர்ந்து நிலைக்கும், பிறருக்கு மாற்ற முடியாத உரிமை நிலையைக் குறிக்கிறது; முடிவற்ற காலத்தைப் பற்றிய தனி இறையியல் கூற்றாக அதை வலுப்படுத்தாமல் உண்மையான பொருள் பராமரிக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க தமிழ் பயன்படுத்தப்பட்டுள்ளது. שְׂדֵה מִגְרַשׁ என்ற இரு கூறுகளையும் வெளிப்படையாகக் காக்க ‘மேய்ச்சல் நிலத்தின் வயல்’ என மொழிபெயர்க்கப்பட்டது. வசனத்தில் உள்ள ஒரே அடிக்குறிப்பு [a] ‘நிலையான’ என்பதன் மாற்று வாசிப்பை விளக்குகிறது.
