revisions:
- from: ஆனால், அவர்களுடைய நகரங்களைச் சேர்ந்த மேய்ச்சல் நிலத்தின் வயல் விற்கப்படக் கூடாது; ஏனெனில் அது அவர்களுக்கு நிலையான உடைமை.[a]
  to: ஆனால், அவர்களுடைய நகரங்களைச் சேர்ந்த மேய்ச்சல் நிலம் விற்கப்படக் கூடாது; ஏனெனில் அது அவர்களுக்கு நிலையான உடைமை.[a]
  rationale: The revision removes only the awkward literal duplication “வயல்” after “மேய்ச்சல் நிலம்.” This produces natural modern Tamil while retaining the referent, possessive relationship to the cities, prohibition on sale, and the enduring-possession rationale. The existing footnote anchor and alternative-reading note remain valid.
