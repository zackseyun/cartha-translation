language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: יוֹבֵ֣ל הִ֗וא שְׁנַ֛ת הַ/חֲמִשִּׁ֥ים שָׁנָ֖ה תִּהְיֶ֣ה לָ/כֶ֑ם לֹ֣א תִזְרָ֔עוּ וְ/לֹ֤א תִקְצְרוּ֙ אֶת סְפִיחֶ֔י/הָ וְ/לֹ֥א תִבְצְר֖וּ אֶת נְזִרֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/011.yaml
  text: It is a Jubilee[a]; the fiftieth year shall be for you. You shall not sow, and you shall not reap its volunteer growth[c][b], and you shall not gather the grapes of its unpruned vines.
translation:
  language: ta
  text: அது யூபிலி ஆண்டு[a]; ஐம்பதாம் ஆண்டு உங்களுக்குரியதாக இருக்கும். நீங்கள் விதைக்கக் கூடாது; தானாக முளைத்து வளர்ந்ததை[b] அறுவடை செய்யக் கூடாது; கிளைகள் நறுக்கப்படாமல் வளர்ந்த திராட்சைக்கொடிகளின் பழங்களையும்[c] பறிக்கக் கூடாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல் ‘யோவேல்’. இங்கு அது ஐம்பதாம் ஆண்டாகிய சிறப்பு ஆண்டைக் குறிக்கிறது; வேறு சூழல்களில் இதே சொல் ஆட்டுக்கடாவின் கொம்பைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘தானாக விளைந்ததை.’ விதைக்கப்படாமல் தானே வளர்ந்த பயிர் இங்கு குறிக்கப்படுகிறது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘பராமரிக்கப்படாமல் விடப்பட்ட கொடிகளின் திராட்சைகளை.’ எபிரெயச் சொல் கிளைகள் நறுக்கப்படாமல் அல்லது கவனிக்கப்படாமல் வளர்ந்த கொடிகளைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹבֵל
  choice: யூபிலி ஆண்டு
  rationale: லேவியராகமம் 25-இல் இச்சொல் ஆட்டுக்கடாவின் கொம்பை அல்ல, ஐம்பதாம் ஆண்டாகிய சிறப்பு நிறுவனத்தைக் குறிக்கிறது. தமிழில் அடையாளப் பெயரை ஒலிபெயர்த்து, அதன் பொருள்வகையைத் தெளிவுபடுத்த ‘ஆண்டு’ சேர்க்கப்பட்டுள்ளது.
- source_word: שְׁנַת הַחֲמִשִּׁים שָׁנָה
  choice: ஐம்பதாம் ஆண்டு
  rationale: எபிரெயக் கட்டமைப்பை இயல்பான நவீன தமிழில் துல்லியமாகக் காட்டுகிறது.
- source_word: תִּהְיֶה לָכֶם
  choice: உங்களுக்குரியதாக இருக்கும்
  rationale: ‘உங்களுக்கு இருக்கும்’ என்ற எபிரெய தத்துவினைத் தமிழில் இயல்பாகத் தெரிவிக்கிறது; அந்த ஆண்டு மக்களுக்கென நிர்ணயிக்கப்பட்டது என்ற கருத்தையும் மிகைப்படுத்தாமல் தக்கவைக்கிறது.
- source_word: לֹא תִזְרָעוּ
  choice: நீங்கள் விதைக்கக் கூடாது
  rationale: சட்டப்பகுதியிலுள்ள எதிர்மறைக் கட்டளையை நவீன தமிழில் நேரடியாகவும் தெளிவாகவும் வழங்குகிறது.
- source_word: לֹא תִקְצְרוּ
  choice: அறுவடை செய்யக் கூடாது
  rationale: தானிய அல்லது தானாக வளர்ந்த பயிரை அறுக்கும் செயலைக் குறிக்கும் வினையை, பின்னுள்ள திராட்சைப் பறித்தலிலிருந்து வேறுபடுத்துகிறது.
- source_word: סְפִיחֶיהָ
  choice: தானாக முளைத்து வளர்ந்ததை
  rationale: விதைக்கப்படாமலேயே முந்தைய பயிரிலிருந்து தானாக வளர்ந்த விளைச்சலைக் குறிக்கிறது; தொழில்நுட்பச் சொல்லைத் தவிர்த்து பொதுவாசகருக்குத் தெளிவாக வழங்கப்பட்டுள்ளது.
- source_word: לֹא תִבְצְרוּ
  choice: பறிக்கக் கூடாது
  rationale: திராட்சைப் பழங்களைச் சேகரிப்பதற்குரிய சிறப்பான வேளாண் வினையை இயல்பான தமிழில் காட்டுகிறது.
- source_word: נְזִרֶיהָ
  choice: கிளைகள் நறுக்கப்படாமல் வளர்ந்த திராட்சைக்கொடிகளின் பழங்கள்
  rationale: இச்சூழலில் பராமரிக்காமல் அல்லது கிளைகள் நறுக்காமல் விடப்பட்ட கொடிகளின் திராட்சைகளைச் சுட்டுகிறது. בצר என்ற வினையின் மறைமுகப் பொருளான திராட்சைப்பழங்கள் தமிழில் வெளிப்படையாகக் கூறப்பட்டுள்ளன.
theological_decisions:
- issue: יוֹבֵל என்பதைக் ‘விடுதலை ஆண்டு’ எனப் பொருளாக்குவதா அல்லது அடையாளப் பெயராக ஒலிபெயர்ப்பதா
  choice: யூபிலி ஆண்டு
  alternative: விடுதலை ஆண்டு
  rationale: அத்தியாயத்தின் சூழலில் விடுதலை முக்கியமானதாயிருந்தாலும், இவ்வசனத்தில் יוֹבֵל என்பது நிறுவனத்தின் பெயராக வருகிறது. ‘விடுதலை ஆண்டு’ என்பது சொல்லின் முழுப் பயன்பாட்டையும் ஒரே கருத்துக்குள் குறுக்கக்கூடும்; எனவே ஒலிபெயர்ப்பு மூலம் இறையியல் விளக்கத்தை உரைக்குள் இறக்காமல் தவிர்க்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன தரத் தமிழில், சட்டக் கட்டளைகளுக்கு ‘கூடாது’ வடிவம் பயன்படுத்தப்பட்டுள்ளது. வேளாண் செயல்களான அறுவடை செய்தல் மற்றும் திராட்சைப் பழம் பறித்தல் தனித்தனியாக வைக்கப்பட்டுள்ளன. உரை கண்ணியமானதும் பொதுவாசகருக்கு எளிதில் புரியத்தக்கதுமான நடையில் அமைக்கப்பட்டுள்ளது.
