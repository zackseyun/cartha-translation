  terminology: “யூபிலி ஆண்டு” நிறுவப்பட்ட ஆண்டுப் பெயரைத் திணிக்கப்பட்ட இறையியல் விளக்கமின்றி வழங்குகிறது. “தானாக முளைத்து வளர்ந்தது,” “அறுவடை,” “பறித்தல்,” மற்றும் பராமரிக்கப்படாத/நறுக்கப்படாத திராட்சைக்கொடிகள் ஆகிய வேளாண்மைப் பதங்கள் பொருத்தமானவை. அடிக்குறிப்புகள் தகுந்த இடங்களில் இணைக்கப்பட்டுள்ளன; அவை உரையின் பொருளை மாற்றவில்லை.
