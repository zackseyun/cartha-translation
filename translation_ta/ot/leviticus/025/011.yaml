  source_fidelity: எபிரெய மூலத்தின் இரட்டை அறிவிப்பான “யூபிலி” மற்றும் “ஐம்பதாம் ஆண்டு ... உங்களுக்கு” என்பவை காக்கப்பட்டுள்ளன. விதைத்தல், தானாக வளர்ந்த விளைச்சலை அறுவடை செய்தல், பராமரிக்கப்படாத திராட்சைக்கொடிகளின் பழங்களைப் பறித்தல் ஆகிய மூன்று தடைகளும் வேறுபடுத்தித் துல்லியமாக வழங்கப்பட்டுள்ளன. இறுதிப் பகுதியில் எபிரெயத்தில் உட்கிடையாக உள்ள திராட்சைப்பழங்கள் தமிழில் வெளிப்படையாகக் கூறப்படுவது சூழலுக்கு ஏற்றது.
