  text: כִּֽי יָמ֣וּךְ אָחִ֔י/ךָ וּ/מָכַ֖ר מֵ/אֲחֻזָּת֑/וֹ וּ/בָ֤א גֹֽאֲל/וֹ֙ הַ/קָּרֹ֣ב אֵלָ֔י/ו וְ/גָאַ֕ל אֵ֖ת מִמְכַּ֥ר אָחִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/025.yaml
  text: If your brother becomes poor and sells some of his property[b][a], then his nearest kinsman-redeemer shall come and redeem what his brother has sold.
translation:
  language: ta
  text: உன் சகோதரன் வறுமைப்பட்டுத் தன் பரம்பரை நிலவுடைமையில் ஒரு பகுதியை விற்றால்[b], அவனுக்கு மிக நெருங்கிய மீட்புரிமையுள்ள உறவினன்[a] வந்து, தன் சகோதரன் விற்றதை மீட்டுக்கொள்ள வேண்டும்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மீட்புரிமையுள்ள உறவினன்” என்பது குடும்பச் சொத்தை மீட்டுக்கொள்ளும் உரிமையும் பொறுப்பும் உடைய நெருங்கிய உறவினனைக் குறிக்கிறது.
    reason: lexical_and_cultural_note
  - marker: b
    text: “பரம்பரை நிலவுடைமை” என்பது இஸ்ரவேலில் ஒரு குடும்பத்துக்குத் தலைமுறைதோறும் உரியதாக இருந்த நிலப்பங்கைக் குறிக்கிறது.
    reason: cultural_note
  - marker: c
    text: அல்லது, “வந்து, தன் சகோதரன் விற்றதை மீட்டுக்கொள்ளலாம்.” இங்குள்ள எபிரெயச் சட்டநடையை உரிமை அல்லது அனுமதியாகவும் புரிந்துகொள்ள முடியும்.
    reason: grammatical_alternative
lexical_decisions:
- source_word: יָמוּךְ
  choice: வறுமைப்படு
  rationale: பொருளாதார நிலையில் தாழ்ந்து ஏழையாகிவிடுவதைக் குறிக்கும் வினை; சட்டச் சூழலில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: אָחִיךָ
  choice: உன் சகோதரன்
  rationale: எபிரெயச் சொல்லின் நேரடியான உறவுமுறை மொழியைப் பேணுகிறது; இச்சட்டச் சூழலில் உடன்படிக்கைச் சமூகத்தைச் சேர்ந்த சக இஸ்ரவேலனையும் குறிக்கக்கூடும்.
- source_word: מֵאֲחֻזָּתוֹ
  choice: தன் பரம்பரை நிலவுடைமையில் ஒரு பகுதி
  rationale: מִן பகுதியைக் குறிக்கிறது; אֲחֻזָּה இச்சூழலில் பொதுவான சொத்து மட்டுமல்ல, குடும்பத்துக்கு ஒதுக்கப்பட்டு தலைமுறையாகத் தொடரும் நிலவுடைமையைக் குறிக்கிறது.
- source_word: גֹאֲלוֹ הַקָּרֹב אֵלָיו
  choice: அவனுக்கு மிக நெருங்கிய மீட்புரிமையுள்ள உறவினன்
  rationale: גאל என்ற சொல்லிலுள்ள குடும்ப உறவையும், குடும்ப நிலத்தை மீட்கும் உரிமை/கடமையையும் தமிழில் தெளிவாக வெளிப்படுத்துகிறது; הַקָּרֹב சட்டப்படி முன்னுரிமையுள்ள மிக நெருங்கிய உறவினனைக் குறிக்கிறது.
- source_word: וְגָאַל
  choice: மீட்டுக்கொள்ள வேண்டும்
  rationale: விற்பனையால் குடும்பத்திலிருந்து சென்ற நிலத்தை உறவினர் மீண்டும் குடும்பத்துக்காகப் பெறுவதைச் சொல்கிறது; சட்டவிதியின் கட்டாயத் தொனியை முதன்மை உரையில் வெளிப்படுத்துகிறது.
- source_word: אֵת מִמְכַּר אָחִיו
  choice: தன் சகோதரன் விற்றதை
  rationale: מִמְכָּר என்பது விற்கப்பட்ட பொருளையோ விற்பனையையோ குறிக்கலாம்; இங்கு விற்கப்பட்ட நிலப்பகுதியை இயல்பான தமிழில் சுட்டுகிறது.
theological_decisions:
- issue: இஸ்ரவேலரின் சட்டத்தில் אָחִיךָ என்ற உறவுமுறைச் சொல்
  choice: உன் சகோதரன்
  alternative: உன் உறவினன் / உன் சக இஸ்ரவேலன்
  rationale: சொல்லின் குடும்ப உறவுத் தோற்றத்தை மறைக்காமல் பேணுகிறது; அதேவேளை அதன் சமூகச் சட்டப் பரப்பை மொழிபெயர்ப்பில் தேவையின்றி குறுக்கவோ விரிவாக்கவோ செய்யவில்லை.
- issue: גאל என்ற மீட்புச் சொற்பிரயோகம்
  choice: மீட்புரிமையுள்ள உறவினன் / மீட்டுக்கொள்
  alternative: மீட்பவன் / திரும்ப வாங்கு
  rationale: இது வெறும் வணிகரீதியான வாங்குதலைவிட, நெருங்கிய உறவினர் குடும்ப நிலத்தை மீட்கும் உரிமையையும் பொறுப்பையும் குறிக்கிறது; ஆகவே சட்ட மற்றும் வேதாகமத் தொடர்பு இரண்டையும் பேணும் சொற்கள் தேர்ந்தெடுக்கப்பட்டன.
- issue: וּבָא וְגָאַל என்பதன் சட்டவிதி வலிமை
  choice: வந்து ... மீட்டுக்கொள்ள வேண்டும்
  alternative: வந்து ... மீட்டுக்கொள்ளலாம்
  rationale: எபிரெய சட்டநடையில் இது எதிர்பார்க்கப்படும் அல்லது விதிக்கப்படும் செயலைக் குறிக்கலாம்; ஆனால் உரிமை/அனுமதி என்ற வாசிப்பும் சாத்தியமாதலால் அடிக்குறிப்பில் மாற்று தரப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் மதிப்புமிக்க சட்டநடை பயன்படுத்தப்பட்டுள்ளது. “நிலவுடைமை” சூழலுக்கேற்ற துல்லியத்தை அளிக்கிறது; “மீட்புரிமையுள்ள உறவினன்” தொழில்நுட்பக் கருத்தை இயல்பான தமிழில் விளக்குகிறது.
