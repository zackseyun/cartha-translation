- from: அவன் விற்கப்பட்ட பிறகும், அவனை மீட்கலாம்; அவனுடைய சகோதரர்களில் ஒருவன் அவனை மீட்கலாம்.
  to: அவன் விற்கப்பட்ட பிறகு, மீட்பு அவனுக்கு உண்டு; அவனுடைய சகோதரர்களில்[a] ஒருவன் அவனை மீட்கலாம்.
  rationale: The temporal connector is corrected from concessive “பிறகும்” to neutral “பிறகு.” The first legal clause is rendered with the noun “மீட்பு,” corresponding directly to גְּאֻלָּה, while the second clause retains the permissive legal force of יִגְאָלֶנּוּ. A footnote anchor and translated lexical-alternative note are added to preserve the English POB audit trail without broadening the main text.
