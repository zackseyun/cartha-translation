  yaml_path: translation/ot/leviticus/025/048.yaml
  text: After he has been sold[a], he may be redeemed; one of his brothers may redeem him.
translation:
  language: ta
  text: அவன் விற்கப்பட்ட பிறகு, மீட்பு அவனுக்கு உண்டு; அவனுடைய சகோதரர்களில்[a] ஒருவன் அவனை மீட்கலாம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, விரிவான பொருளில், “அவனுடைய உறவினர்களில் ஒருவன்.” எபிரெயத்தில் சொற்படி “அவனுடைய சகோதரர்களில் ஒருவன்” என்று உள்ளது; இது உறவினர்-மீட்பராகச் செயல்படும் ஓர் ஆண் குடும்ப உறுப்பினரைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרֵי נִמְכַּר
  choice: அவன் விற்கப்பட்ட பிறகும்
  rationale: אַחֲרֵי காலத் தொடர்பைக் குறிக்கிறது; נִמְכַּר என்பது מכר என்பதன் நிஃபால் வடிவமாக, ‘விற்கப்படுதல்’ என்ற செயப்பாட்டு பொருளைத் தருகிறது. சூழலில், விற்பனை நடந்துவிட்டாலும் மீட்புரிமை நீடிப்பதை ‘பிறகும்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: גְּאֻלָּה תִּהְיֶה לּוֹ
  choice: அவனை மீட்கலாம்
  rationale: எபிரெயத்தில் சொற்படி ‘அவனுக்கு மீட்பு இருக்கும்’ என்ற பெயர்ச்சொல் சார்ந்த சட்ட மொழிநடை உள்ளது. தமிழில் ‘அவனை மீட்கலாம்’ என்பது அந்த மீட்பு வாய்ப்பு அல்லது உரிமையை இயல்பாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: אֶחָד מֵאֶחָיו
  choice: அவனுடைய சகோதரர்களில் ஒருவன்
  rationale: எபிரெயம் சொற்படியாக ‘அவனுடைய சகோதரர்களிலிருந்து ஒருவன்’ என ஆண்பால் உறவினரைக் குறிக்கிறது. ஆகவே பொதுவான ‘உறவினர்’ என்று விரிவுபடுத்தாமல் மூலத்தின் குறிப்பைத் தக்கவைக்கிறது.
- source_word: יִגְאָלֶנּוּ
  choice: அவனை மீட்கலாம்
  rationale: גאל என்பது குடும்ப உறவின் அடிப்படையில் விலைகொடுத்து மீட்பதற்கான வழக்கமான சட்டச் சொல். ‘மீட்கலாம்’ அதன் சட்ட-மீட்புப் பொருளையும் இங்கு உள்ள அனுமதி அல்லது வாய்ப்பையும் காக்கிறது.
theological_decisions:
- issue: אֶחָיו என்ற உறவுமுறைச் சொல்லின் வரம்பு
  choice: அவனுடைய சகோதரர்கள்
  alternative: அவனுடைய ஆண் உறவினர்கள்
  rationale: மூல எபிரெயம் ஆண்பால் பன்மையில் சொற்படியாக ‘அவனுடைய சகோதரர்கள்’ என்று கூறுகிறது. சுற்றியுள்ள வசனங்கள் மற்ற நெருங்கிய உறவினர்களையும் தனித்தனியாகக் குறிப்பிடுவதால், இவ்வசனத்தில் உள்ள சொல்லை பொதுமைப்படுத்தாமல் வைத்திருக்கிறது.
- issue: גְּאֻלָּה תִּהְיֶה לּוֹ என்பதன் சட்ட வலிமை
  choice: அவனை மீட்கலாம்
  alternative: அவனுக்கு மீட்பு உண்டு
  rationale: இந்தக் கட்டமைப்பு மீட்பு கிடைக்கக்கூடியதாக அல்லது உரிமையாக இருப்பதைக் குறிக்கிறது; குறிப்பிட்ட சகோதரன் கட்டாயம் மீட்கவேண்டும் என்று கூறுவதில்லை. தமிழில் வாய்ப்பைத் தெரிவிக்கும் வடிவம் இந்தத் திறந்த நிலையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டப்பகுதிக்கேற்ற கண்ணியமான ஆனால் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ஒரே எபிரெய வேர் சார்ந்த மீட்புக் கருத்து இரு அரைக்கூற்றுகளிலும் ‘மீட்க’ என ஒருமையாகத் தக்கவைக்கப்பட்டுள்ளது.
