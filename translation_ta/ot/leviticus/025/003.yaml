  yaml_path: translation/ot/leviticus/025/003.yaml
  text: For six years you shall sow your field[a], and for six years you shall prune your vineyard and gather its produce.
translation:
  language: ta
  text: ஆறு ஆண்டுகள் உன் வயலில் விதைக்க வேண்டும்; ஆறு ஆண்டுகள் உன் திராட்சைத்தோட்டத்தைக் கிளைகழிக்க வேண்டும்; அதன் விளைச்சலைச் சேகரிக்க வேண்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שֵׁשׁ שָׁנִים
  choice: ஆறு ஆண்டுகள்
  rationale: காலநீட்சியைக் குறிக்கும் எபிரெயச் சொற்றொடரைத் தமிழில் இயல்பாகவும் தெளிவாகவும் காட்டுகிறது.
- source_word: תִּזְרַע
  choice: விதைக்க வேண்டும்
  rationale: சட்டப் பின்னணியில் அறிவுறுத்தும் வினைநிலையை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: שָׂדֶךָ
  choice: உன் வயலில்
  rationale: பொதுவான ‘நிலம்’ என்பதைவிடப் பயிரிடப்படும் வயலைத் துல்லியமாகக் குறிக்கிறது; தமிழ் வழக்கில் விதைத்தல் ‘வயலில்’ நடைபெறுவதால் இடவேற்றுமை இயல்பானது.
- source_word: תִּזְמֹר
  choice: கிளைகழிக்க வேண்டும்
  rationale: திராட்சைக்கொடிகளின் தேவையற்ற கிளைகளை வெட்டிப் பராமரிக்கும் செயலைத் துல்லியமாகக் குறிக்கும் வேளாண்மைச் சொல்.
- source_word: כַּרְמֶךָ
  choice: உன் திராட்சைத்தோட்டத்தை
  rationale: திராட்சைக் கொடிகள் பயிரிடப்படும் தோட்டத்திற்கான தெளிவான, வழக்கமான தமிழ் இணை.
- source_word: וְאָסַפְתָּ
  choice: சேகரிக்க வேண்டும்
  rationale: எபிரெய வினையின் ‘ஒன்றுசேர்த்தல்/சேகரித்தல்’ என்ற அடிப்படைப் பொருளைப் பாதுகாக்கிறது; ‘அறுவடை’ என்று குறுக்கவில்லை.
- source_word: תְּבוּאָתָהּ
  choice: அதன் விளைச்சலை
  rationale: நிலம் அல்லது திராட்சைத்தோட்டம் தரும் வேளாண் உற்பத்தியை இயல்பான தமிழில் குறிக்கிறது; உடைமைப் பின்னொட்டை ‘அதன்’ எனப் பாதுகாக்கிறது.
