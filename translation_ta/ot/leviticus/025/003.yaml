translation_notes:
  register: நவீன நிலையான தமிழில், சட்ட அறிவுறுத்தலுக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய இணை அமைப்பும் மூன்று செயல்களின் வரிசையும் பாதுகாக்கப்பட்டுள்ளன. ஆங்கில ஆலோசனை உரையில் உள்ள [a] குறிப்பு ‘your field’ என்பதோடு பொருந்தாமல் இடம்பெயர்ந்ததாகத் தெரிகிறது; மேலும் ‘produce/yield’ வேறுபாடு தமிழில் தனிக் குறிப்பைத் தேவைப்படுத்தாததால் அடிக்குறிப்பு சேர்க்கப்படவில்லை.
