  register: நவீன தரத் தமிழில், சட்டப்பண்பும் கண்ணியமும் தக்கவைக்கப்பட்டுள்ளன. ‘சுதந்தரம்’, ‘உடைமை’, ‘உழைப்பு’, ‘கடுமையாக ஆளுதல்’ ஆகிய சொற்கள் மூலத்தின் பரம்பரைச் சொத்து மற்றும் கட்டாய உழைப்பு சார்ந்த கடினமான சமூக உண்மையை மென்மையாக்காமல், சாதாரண வாசகருக்கும் புரியும் வகையில் வழங்குகின்றன.
