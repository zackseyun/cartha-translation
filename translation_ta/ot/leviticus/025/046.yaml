  yaml_path: translation/ot/leviticus/025/046.yaml
  text: You may pass them on as an inheritance to your sons after you[a], to inherit as a possession permanently; from them you may exact labor. But over your brothers, the sons of Israel[b], no man shall rule over his brother harshly.
translation:
  language: ta
  text: உங்களுக்குப் பின் உங்கள் மகன்கள் அவர்களை நிரந்தர உடைமையாகப் பெறும்படி, அவர்களை அவர்களுக்குச் சொத்தாக விட்டுச் செல்லலாம்[a]. அவர்களிடமிருந்து நீங்கள் உழைப்பைப் பெறலாம். ஆனால் உங்கள் சகோதரர்களாகிய இஸ்ரயேல் மக்களைப் பொறுத்தவரை, ஒருவனும் தன் சகோதரனை கொடுமையாக ஆளக் கூடாது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவர்களை உங்களுக்குப் பின் உங்கள் மகன்களுக்கு வழிவழிச் சொத்தாக விட்டுச் செல்லலாம்.’
    reason: lexical_alternative
  - marker: b
    text: ‘சகோதரர்கள்’ மற்றும் ‘இஸ்ரயேல் மக்கள்’ என்பவை எபிரெய மூலத்தின் ஆண்பால் உறவுமுறைச் சொற்களை நேரடியாகத் தருகின்றன; இச்சட்டம் சக இஸ்ரயேலரை உடன்படிக்கை உறவினராகக் குறிப்பிடுகிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִתְנַחֲלְתֶּם
  choice: சொத்துரிமையாகக் கொடுக்கலாம்
  rationale: இந்த வினைவடிவம் ஒருவரை அல்லது ஒன்றை வழிவழிச் சொத்தாக அடுத்த தலைமுறைக்குக் கடத்துவதைக் குறிக்கிறது; தமிழில் சட்டபூர்வமான பரம்பரைச் சொத்து உணர்வை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לִבְנֵיכֶם אַחֲרֵיכֶם
  choice: உங்களுக்குப் பின் உங்கள் மகன்களுக்கு
  rationale: בנים என்பதன் நேரடியான ஆண்பால் உறவுமுறையை ‘மகன்கள்’ எனத் தக்கவைத்து, אַחֲרֵיכֶם என்பதைக் காலத்தொடராகத் தெளிவாகக் காட்டுகிறது.
- source_word: לָרֶשֶׁת אֲחֻזָּה
  choice: நிலையான உடைமையாகச் சுதந்தரித்துக்கொள்ளலாம்
  rationale: இச்சொற்றொடரில் உள்ள சுதந்தரித்தல் மற்றும் சட்டபூர்வ உடைமை ஆகிய இரு கருத்துகளையும் வெளிப்படுத்துகிறது.
- source_word: לְעֹלָם
  choice: நிலையான
  rationale: இந்தச் சட்டச் சூழலில் நீடித்த அல்லது நிரந்தரமான உடைமை நிலையைக் குறிக்கிறது; மெய்யியல் சார்ந்த முடிவில்லா நித்தியத்தைக் கட்டாயமாகச் சுட்டவில்லை.
- source_word: בָּהֶם תַּעֲבֹדוּ
  choice: அவர்களிடமிருந்து நீங்கள் உழைப்பைப் பெறலாம்
  rationale: உடைமையாக வைக்கப்பட்டவர்களிடமிருந்து வேலை பெறும் கட்டாய உழைப்பின் சமூக உண்மையை மறைக்காமல், தமிழில் அளவான நேரடித்தன்மையுடன் கூறுகிறது.
- source_word: וּבְאַחֵיכֶם בְּנֵי יִשְׂרָאֵל
  choice: ஆனால் உங்கள் சகோதரர்களான இஸ்ரயேல் மக்களில்
  rationale: முந்தைய குழுவுடனான முரண்பாட்டையும், இஸ்ரயேலரை உடன்படிக்கை உறவினராகக் காட்டும் ‘சகோதரர்கள்’ என்ற சொல்லையும் தக்கவைக்கிறது.
- source_word: אִישׁ בְּאָחִיו
  choice: ஒருவனும் தன் சகோதரனை
  rationale: ஒவ்வொரு இஸ்ரயேலரும் தன் சகோதரரிடம் எவ்வாறு நடக்க வேண்டும் என்ற பகிர்வுத்தன்மையுள்ள தடை தமிழில் இயல்பாக வெளிப்படுகிறது.
- source_word: לֹא תִרְדֶּה בוֹ
  choice: ஆளக் கூடாது
  rationale: רדה என்பதன் ஆட்சி அல்லது ஆதிக்கம் செலுத்துதல் என்ற அடிப்படைப் பொருளைத் தக்கவைக்கிறது; அதன் கடுமையான தன்மை அடுத்த சொற்றொடரால் தெரிவிக்கப்படுகிறது.
- source_word: בְּפָרֶךְ
  choice: கடுமையாக
  rationale: கட்டாய உழைப்புச் சூழலில் காணப்படும் கொடுமையான கடுமையைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: இஸ்ரயேலருக்குள் உள்ள உறவுமுறை மொழியை மொழிபெயர்த்தல்
  choice: ‘சகோதரர்கள்’ மற்றும் ‘இஸ்ரயேல் மக்கள்’ என்ற உறவுமுறை அடையாளத்தைத் தக்கவைத்தல்
  alternative: ‘சக இஸ்ரயேலர்’ அல்லது ‘இனத்தார்’
  rationale: எபிரெய மூலத்தின் ஆண்பால் உறவுமுறைச் சொல் உடன்படிக்கைச் சமூகத்தின் குடும்பப் பிணைப்பை வலியுறுத்துகிறது; அதை பொதுமைப்படுத்தி மறைக்காமல் தமிழில் பாதுகாக்கப்பட்டுள்ளது.
- issue: அடிமைத்தனம், சொத்துரிமை, கட்டாய உழைப்பு பற்றிய மொழியின் நேரடித்தன்மை
  choice: சொத்துரிமை, உடைமை, உழைப்பைப் பெறுதல் ஆகிய சட்ட மற்றும் சமூகக் கருத்துகளை வெளிப்படையாகக் கூறுதல்
  alternative: உடைமை உணர்வைக் குறைக்கும் ‘பணியாளர்கள்’ அல்லது தன்னார்வச் சேவையைப் போன்ற மென்மையான சொற்கள்
  rationale: மூலம் மனிதர்களை வழிவழி உடைமையாக வைத்திருப்பதையும் அவர்களிடமிருந்து உழைப்பைப் பெறுவதையும் நேரடியாகக் கூறுகிறது; அதன் அறச்சுமையையோ சமூக உண்மையையோ மொழிபெயர்ப்பு மென்மையாக்கக் கூடாது.
