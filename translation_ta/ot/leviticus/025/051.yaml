  text: אִם ע֥וֹד רַבּ֖וֹת בַּ/שָּׁנִ֑ים לְ/פִי/הֶן֙ יָשִׁ֣יב גְּאֻלָּת֔/וֹ מִ/כֶּ֖סֶף מִקְנָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/051.yaml
  text: If many years still remain[a], in proportion to them he shall repay his redemption price from the money of his purchase.
translation:
  language: ta
  text: இன்னும் பல ஆண்டுகள் மீதியிருந்தால், அவற்றின் எண்ணிக்கைக்கு ஏற்ப, தான் வாங்கப்பட்ட பணத்திலிருந்து தன் மீட்புத் தொகையை அவன் திருப்பிச் செலுத்த வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தன் மீட்பைத் திருப்பிச் செலுத்த வேண்டும்.” எபிரெயப் பெயர்ச்சொல் மீட்புச் செயலையும் குறிக்கலாம்; ஆனால் இங்கு மீட்புக்காகத் திருப்பிச் செலுத்த வேண்டிய தொகையைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: இருந்தால்
  rationale: இந்தச் சட்டத்தின் குறிப்பிட்ட சூழ்நிலையை அறிமுகப்படுத்தும் இயல்பான நிபந்தனை வடிவம்.
- source_word: עוֹד רַבּוֹת בַּשָּׁנִים
  choice: இன்னும் பல ஆண்டுகள் மீதியிருந்தால்
  rationale: עוֹד என்பதன் ‘இன்னும்’ என்ற பொருளையும், பல ஆண்டுகள் எஞ்சியிருப்பதாக உட்கிடையாகத் தெரிவிக்கும் எபிரெயக் கட்டமைப்பையும் இயல்பான தமிழில் தருகிறது.
- source_word: לְפִיהֶן
  choice: அவற்றின் எண்ணிக்கைக்கு ஏற்ப
  rationale: சொல்லுக்கு சொல் ‘அவற்றின் வாயின்படி’ என்றாலும், இங்கு முன்கூறிய ஆண்டுகளின் எண்ணிக்கைக்கு விகிதாசாரமாக என்பதே மரபுத்தொடரின் பொருள்.
- source_word: יָשִׁיב
  choice: திருப்பிச் செலுத்த வேண்டும்
  rationale: שוב என்பதன் ஹிஃபில் வடிவம் இங்கே பணத்தைத் திருப்பிக் கொடுப்பதை, அதாவது மீளச் செலுத்துவதைச் சுட்டுகிறது.
- source_word: גְּאֻלָּתוֹ
  choice: தன் மீட்புத் தொகையை
  rationale: மீட்புச் செயலைக் குறிக்கக்கூடிய பெயர்ச்சொல் இச்சட்டப்பூர்வப் பணச் சூழலில் மீட்புக்காகச் செலுத்த வேண்டிய தொகையைக் குறிப்பதாகத் தெரிகிறது.
- source_word: מִכֶּסֶף מִקְנָתוֹ
  choice: தான் வாங்கப்பட்ட பணத்திலிருந்து
  rationale: சொல்லடியாக ‘அவனுடைய வாங்குதலின் பணத்திலிருந்து’; இங்கு அவன் வாங்கப்பட்டபோது செலுத்தப்பட்ட மூலத் தொகையே கணக்கீட்டின் அடிப்படை என்பதைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
