translation_notes:
  register: நவீனத் தரத் தமிழில் சட்டப்பூர்வத் தொனியைப் பேணியுள்ளோம். ‘விகிதாசாரமாக’ என்பதற்குப் பதிலாக பொதுவாசகர்களுக்கு எளிதான ‘எண்ணிக்கைக்கு ஏற்ப’ பயன்படுத்தப்பட்டுள்ளது; பாலின ஒருமைச் சுட்டு இயல்பாக அமைய ‘அவன்’ ஒருமுறை மட்டும் இடம்பெறுகிறது.
