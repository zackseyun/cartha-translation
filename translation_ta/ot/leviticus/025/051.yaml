  source_fidelity: மூல எபிரெயத்தின் நிபந்தனை, எஞ்சியிருக்கும் பல ஆண்டுகள், அவற்றின் எண்ணிக்கைக்கு ஏற்ற விகிதம், மீட்புத் தொகையைத் திருப்பிச் செலுத்துதல், மற்றும் வாங்கப்பட்டபோதைய பணத்தை அடிப்படையாக்குதல் ஆகியவை அனைத்தும் துல்லியமாகத் தரப்பட்டுள்ளன. “தான் வாங்கப்பட்ட பணத்திலிருந்து” என்பது מִכֶּסֶף מִקְנָתוֹ என்பதன் சட்ட-பொருளாதாரப் பொருளைச் சரியாக வெளிப்படுத்துகிறது.
  naturalness: நடை நவீனத் தரத் தமிழில் இயல்பாகவும் சட்டப்பூர்வத் தொனிக்கேற்றதாகவும் உள்ளது. “அவற்றின் எண்ணிக்கைக்கு ஏற்ப” என்பது לְפִיהֶן என்பதன் விகிதாசாரப் பொருளை தெளிவாகக் காட்டுகிறது.
  terminology: “மீட்புத் தொகை” இச்சூழலில் גְּאֻלָּתוֹ என்பதற்கான பொருத்தமான, தெளிவான சொல்லாகும். “திருப்பிச் செலுத்த வேண்டும்” நிதி/சட்டச் சூழலில் யָשִׁיב என்பதற்கு ஏற்றது. அடிக்குறிப்பு சொல்-பொருள் மாற்றத்தைச் சரியாகச் சுட்டுகிறது; [a] குறியீடும் சரியான இடத்தில் உள்ளது.
