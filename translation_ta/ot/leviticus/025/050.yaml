base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/050.yaml
  text: He shall calculate with his buyer from the year he sold himself to him until the year of jubilee[a], and the price of his sale shall be according to the number of years[b]; like the days of a hired worker he shall be with him.
translation:
  language: ta
  text: அவன் அவனை வாங்கியவனோடு, அவனிடம் தன்னை விற்ற ஆண்டு[a] முதல் யூபிலி ஆண்டு வரை கணக்கிட வேண்டும். அவனுடைய விற்பனை விலை ஆண்டுகளின் எண்ணிக்கைக்கு ஏற்ப இருக்க வேண்டும்; கூலித் தொழிலாளியின் பணிக்காலத்தைப் போலவே அவன் வாங்கியவனிடம் இருக்க வேண்டும்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதை இன்னும் சொற்சொல்லாக, “அவன் அவனுக்கு விற்கப்பட்ட ஆண்டு” என்றும் மொழிபெயர்க்கலாம். சூழல், அந்த மனிதன் தன்னைப் பணிச் சேவைக்காக விற்றதைக் காட்டுகிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் சொற்சொல்லாக, “கூலித் தொழிலாளியின் நாட்களைப்போல் அவன் அவனுடன் இருப்பான்.” இங்கு அவனுடைய சேவைக்காலம் கூலித் தொழிலாளியின் பணிக்காலத்துடன் ஒப்பிடப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחִשַּׁב
  choice: கணக்கிட வேண்டும்
  rationale: மீட்பு விலையை நிர்ணயிக்கும் சட்டப் பின்னணியில், நிதிசார் கணக்கீட்டைத் தெளிவாகக் குறிக்கிறது.
- source_word: קֹנֵהוּ
  choice: அவனை வாங்கியவன்
  rationale: קנה என்பதன் வினையெச்ச வடிவம் அவனை வாங்கிய நபரைக் குறிக்கிறது; தமிழில் இது இயல்பாகவும் பரிவர்த்தனைச் சார்ந்த பொருளைத் தக்கவைத்தும் உள்ளது.
- source_word: מִשְּׁנַת הִמָּכְרוֹ לוֹ
  choice: அவனிடம் தன்னை விற்ற ஆண்டு முதல்
  rationale: சூழலில் அந்த நபர் தன்னையே பணிச் சேவைக்கு விற்றதைக் காட்டுவதால், எபிரெயச் செயல்பாட்டு வடிவத்தின் மறைமுகமான தற்சுட்டுப் பொருள் இயல்பான தமிழில் வெளிப்படுத்தப்படுகிறது; முறையான செயப்பாட்டு மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: עַד שְׁנַת הַיֹּבֵל
  choice: யூபிலி ஆண்டு வரை
  rationale: லேவியராகமம் 25-இல் நிறுவப்பட்ட சிறப்பு ஆண்டுக்கான பெயரைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: כֶּסֶף מִמְכָּרוֹ
  choice: அவனுடைய விற்பனை விலை
  rationale: כֶּסֶף என்பதன் சொற்பொருள் ‘வெள்ளி/பணம்’ என்றாலும், இச்சட்ட வணிகச் சூழலில் விற்பனைக்கான பண மதிப்பைக் குறிக்கிறது.
- source_word: בְּמִסְפַּר שָׁנִים
  choice: ஆண்டுகளின் எண்ணிக்கைக்கு ஏற்ப
  rationale: ஆண்டுகளின் எண்ணிக்கையை அடிப்படையாகக் கொண்ட விகிதாசாரக் கணக்கீட்டைக் குறிக்கிறது; எந்த ஆண்டுகள் என்பதைக் கூடுதலாக நிர்ணயிக்காமல் மூலத்தின் சுருக்கத்தைப் பாதுகாக்கிறது.
- source_word: כִּימֵי שָׂכִיר
  choice: கூலித் தொழிலாளியின் பணிக்காலத்தைப் போலவே
  rationale: שָׂכִיר என்பது கூலிக்கு வேலை செய்பவரைக் குறிக்கிறது. ‘நாட்கள்’ என்ற எபிரெய மரபுத்தொடர் தமிழில் இயல்பாக ‘பணிக்காலம்’ என வழங்கப்பட்டு, ஒப்பீடு பாதுகாக்கப்படுகிறது.
- source_word: יִהְיֶה עִמּוֹ
  choice: அவன் வாங்கியவனிடம் இருக்க வேண்டும்
  rationale: எபிரெய மூலத்தின் ‘அவனுடன் இருப்பான்’ என்ற உறவைத் தக்கவைத்தபடி, தமிழில் தெளிவுக்காக முன்னர் குறிப்பிடப்பட்ட வாங்கியவனை மீண்டும் பெயரிடுகிறது.
theological_decisions:
- issue: வாங்கப்பட்ட இஸ்ரயேலரின் சேவை நிலை
  choice: கூலித் தொழிலாளியின் பணிக்காலத்தைப் போலவே
  alternative: கூலித் தொழிலாளியின் நாட்களைப்போல்
  rationale: மூலம் அவனை நிரந்தர உடைமையாக நேரடியாக வரையறுக்காமல், அவனுடைய காலத்தை ஒரு கூலித் தொழிலாளியின் காலத்துடன் ஒப்பிடுகிறது. தமிழாக்கம் அந்த ஒப்பீட்டைத் தக்கவைக்கிறது; அதன் சட்ட விளைவை முதன்மை உரையில் விரிவாக்கவில்லை.
translation_notes:
  register: நவீன தரநிலைத் தமிழில் சட்டநடையின் கண்ணியமும் தெளிவும் பேணப்பட்டுள்ளன. ‘வருஷம்’ என்பதற்குப் பதில் ‘ஆண்டு’, ‘கூலியாள்’ என்பதற்குப் பதில் பொதுவாகப் புரியும் ‘கூலித் தொழிலாளி’ பயன்படுத்தப்பட்டுள்ளது. ‘யூபிலி’ என்ற நிறுவனப் பெயர் ஒலிபெயர்ப்பாகத் தக்கவைக்கப்பட்டுள்ளது.
