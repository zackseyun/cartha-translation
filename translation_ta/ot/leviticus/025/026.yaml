revisions:
- from: ஆனால், ஒருவனுக்கு மீட்புரிமையுள்ள உறவினன் இல்லாமல், பின்னர் அவனுடைய வசதி பெருகி, தன் நிலத்தை மீட்பதற்குப் போதுமான தொகையை அவன் பெற்றால்,
  to: ஆனால், ஒருவனுக்கு மீட்கும் உரிமையுள்ள உறவினர் இல்லாமல், அவனுடைய வசதி போதுமான அளவுக்கு உயர்ந்து, தன் நிலத்தை மீட்பதற்குத் தேவையான தொகையை அவன் பெற்றால்,
  rationale: The revision removes the added temporal adverb and renders the Hebrew idiom concerning a person’s means reaching sufficiency more precisely. It preserves the legal sense of the family redeemer, the land-redemption context, the singular masculine case, and the incomplete conditional syntax of the verse.
