source:
  edition: WLC
  text: וְ/אִ֕ישׁ כִּ֛י לֹ֥א יִֽהְיֶה לּ֖/וֹ גֹּאֵ֑ל וְ/הִשִּׂ֣יגָה יָד֔/וֹ וּ/מָצָ֖א כְּ/דֵ֥י גְאֻלָּתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/026.yaml
  text: But if a man has no redeemer[a], and his hand attains enough and he finds sufficient means for his redemption[b],
translation:
  language: ta
  text: ஆனால், ஒருவனுக்கு மீட்கும் உரிமையுள்ள உறவினர் இல்லாமல், அவனுடைய வசதி போதுமான அளவுக்கு உயர்ந்து, தன் நிலத்தை மீட்பதற்குத் தேவையான தொகையை அவன் பெற்றால்,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אִישׁ כִּי
  choice: ஆனால், ஒருவனுக்கு
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட உறவினரின் மீட்பைத் தொடர்ந்து ஒரு மாற்று சட்டநிலையை அறிமுகப்படுத்துகிறது. אִישׁ என்பதன் ஒருமை ஆண்பால் வடிவமும் காக்கப்படுகிறது.
- source_word: לֹא יִהְיֶה לּוֹ גֹּאֵל
  choice: மீட்புரிமையுள்ள உறவினன் இல்லாமல்
  rationale: גֹּאֵל என்பது இந்நிலச் சட்டச் சூழலில் குடும்பச் சொத்தை மீட்கும் உரிமையோ கடமையோ உள்ள நெருங்கிய உறவினரைக் குறிக்கிறது; வெறும் ‘மீட்பர்’ என்பதைவிட இத்தேர்வு சட்டப் பொருளைத் தெளிவாக்குகிறது.
- source_word: וְהִשִּׂיגָה יָדוֹ
  choice: பின்னர் அவனுடைய வசதி பெருகி
  rationale: எழுத்துப்படி ‘அவனுடைய கை எட்டுகிறது’ என்ற எபிரெய மரபுத்தொடர், ஒருவருடைய பொருளாதார வசதி போதியதாக ஆவதைக் குறிக்கிறது. இயல்பான தமிழில் அதன் பொருள் வழங்கப்படுகிறது.
- source_word: וּמָצָא כְּדֵי גְאֻלָּתוֹ
  choice: தன் நிலத்தை மீட்பதற்குப் போதுமான தொகையை அவன் பெற்றால்
  rationale: מָצָא அடிப்படையில் ‘கண்டடைதல்’ என்றாலும் இங்கு தேவையான தொகையைப் பெற்றிருப்பதைக் குறிக்கிறது. גְאֻלָּה இச்சூழலில் முன்பு விற்ற நிலத்தைத் திரும்ப வாங்கும் சட்டநடவடிக்கை என்பதால் ‘தன் நிலத்தை’ என்பது சூழலால் தெளிவுபடுத்தப்படுகிறது.
theological_decisions: []
translation_notes:
  register: நவீன பொதுத்தமிழில், சட்டப்பகுதிக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய மரபுத்தொடரை சொற்சொல்லாகக் கொடுத்து குழப்பாமல் அதன் பொருளை இயல்பாக வழங்குகிறது; வசனம் அடுத்த வசனத்தில் நிறைவுறும் நிபந்தனை வாக்கியம் என்பதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
