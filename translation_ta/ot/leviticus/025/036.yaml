  text: אַל תִּקַּ֤ח מֵֽ/אִתּ/וֹ֙ נֶ֣שֶׁךְ וְ/תַרְבִּ֔ית וְ/יָרֵ֖אתָ מֵֽ/אֱלֹהֶ֑י/ךָ וְ/חֵ֥י אָחִ֖י/ךָ עִמָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/036.yaml
  text: Do not take interest or profit from him[a], but fear your God[b], and let your brother live with you.
translation:
  language: ta
  text: அவனிடமிருந்து வட்டியையோ ஆதாயத்தையோ[a] வாங்காதே. உன் கடவுளுக்குப் பயப்படு; உன் சகோதரன்[b] உன்னோடு வாழட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஆதாயம்’ என்பதற்கு ‘பெருக்கம்’ அல்லது ‘லாபம்’ என்றும் மொழிபெயர்க்கலாம். ஏழைக் கடனாளியிடமிருந்து பெறப்படும் வட்டியையோ கூடுதல் பலனையோ குறிக்கும் தொடர்புடைய இரண்டு சொற்களை எபிரெயம் இணைத்துப் பயன்படுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: இங்கு ‘சகோதரன்’ என்பது உயிரியல் சகோதரனை மட்டுமல்ல, உடன்படிக்கைச் சமூகத்தைச் சேர்ந்த சக உறுப்பினரையும் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: אַל תִּקַּח
  choice: வாங்காதே
  rationale: אַל உடன் வரும் வினை வடிவம் நேரடியான தடையைத் தெரிவிக்கிறது. ‘வாங்காதே’ என்பது இங்கு ஒருவரிடமிருந்து பொருளாதாரப் பலனைப் பெறாதிருப்பதை இயல்பான நவீனத் தமிழில் கூறுகிறது.
- source_word: מֵאִתּוֹ
  choice: அவனிடமிருந்து
  rationale: தடைசெய்யப்பட்ட வட்டியோ ஆதாயமோ நலிவுற்ற அந்த நபரிடமிருந்து பெறப்படுவதைக் குறிக்கும் மூலமொழியின் உறவை நேரடியாகப் பாதுகாக்கிறது.
- source_word: נֶשֶׁךְ
  choice: வட்டி
  rationale: கடனுக்காக வசூலிக்கப்படும் வட்டியை இச்சொல் குறிக்கிறது. ‘வட்டி’ என்பது அர்த்தத்தைத் தெளிவாகவும் நவீனமாகவும் தருகிறது.
- source_word: וְתַרְבִּית
  choice: ஆதாயம்
  rationale: נֶשֶׁךְ என்பதுடன் இணைக்கப்பட்ட இச்சொல், கடனாளியிடமிருந்து பெறப்படும் கூடுதல் தொகை அல்லது பெருக்கத்தைக் குறிக்கிறது. ‘ஆதாயம்’ பொருளாதாரச் சூழலை இயல்பாகத் தெரிவிக்கிறது; ‘பெருக்கம்’, ‘லாபம்’ என்பவையும் சாத்தியம்.
- source_word: וְיָרֵאתָ מֵאֱלֹהֶיךָ
  choice: உன் கடவுளுக்குப் பயப்படு
  rationale: கடவுளை மதித்துப் பயப்படும் உடன்படிக்கைச் சார்ந்த ஒழுக்கப் பொறுப்பை நேரடியான கட்டளையாகப் பாதுகாக்கிறது. ‘உன் கடவுள்’ என்ற தனிப்பட்ட உடன்படிக்கைச் சொல்லாட்சியும் தக்கவைக்கப்படுகிறது.
- source_word: וְחֵי
  choice: வாழட்டும்
  rationale: இச்சூழலில் உயிர்வாழ அனுமதித்தல் அல்லது அதற்கு வழிசெய்தல் என்ற கட்டளைத் தன்மையை ‘வாழட்டும்’ சுருக்கமாகக் காட்டுகிறது; வெளிப்படையாக இல்லாத நோக்கப் பொருளைச் சேர்ப்பதையும் தவிர்க்கிறது.
- source_word: אָחִיךָ
  choice: உன் சகோதரன்
  rationale: எபிரெயச் சொல்லின் குடும்ப மற்றும் உடன்படிக்கைச் சமூக நெருக்கத்தை நேரடியாகப் பாதுகாக்கிறது. இங்கு உயிரியல் சகோதரன் மட்டும் குறிக்கப்படவில்லை என்பதை அடிக்குறிப்பு விளக்குகிறது.
- source_word: עִמָּךְ
  choice: உன்னோடு
  rationale: கட்டளை பெறுபவருடன் சமூகத்தில் தொடர்ந்து வாழ்வதை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: உடன்படிக்கைச் சட்டத்தில் אָחִיךָ என்ற சமூக-உறவுச் சொல்லை மொழிபெயர்த்தல்
  choice: உன் சகோதரன்
  alternative: உன் சக இஸ்ரயேலன்; உன் இனத்தான்
  rationale: மூலத்தின் குடும்ப உருவகத்தையும் உடன்படிக்கைச் சமூக நெருக்கத்தையும் ‘சகோதரன்’ பாதுகாக்கிறது. அது உயிரியல் உறவை மட்டும் குறிக்காது என்பதைக் குறிப்பில் தெளிவுபடுத்துவது, உரைக்குள் விளக்கத்தைச் சேர்ப்பதைவிட மூலத்தின் பதற்றத்தை நன்றாகக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், ஒருமை இரண்டாம் நபருக்கான நேரடியான சட்டக் கட்டளை நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘பொலிசை’ போன்ற பழமையான சொல்லைத் தவிர்த்து ‘வட்டி’ பயன்படுத்தப்பட்டுள்ளது. வாக்கியத்தின் இறுதிக் கூறு நோக்கவாக்கியமாகத் தீர்மானிக்கப்படாமல், மூலத்தின் இணைப்பையும் அனுமதி/கட்டளை நயத்தையும் காக்க ‘வாழட்டும்’ என வழங்கப்பட்டுள்ளது.
