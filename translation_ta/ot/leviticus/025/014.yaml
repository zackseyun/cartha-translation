source:
  edition: WLC
  text: וְ/כִֽי תִמְכְּר֤וּ מִמְכָּר֙ לַ/עֲמִיתֶ֔/ךָ א֥וֹ קָנֹ֖ה מִ/יַּ֣ד עֲמִיתֶ֑/ךָ אַל תּוֹנ֖וּ אִ֥ישׁ אֶת אָחִֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/014.yaml
  text: And if you sell something to your neighbor[a], or buy from your neighbor, no man shall oppress his brother.
translation:
  language: ta
  text: நீங்கள் உங்கள் சமூகத்தைச் சேர்ந்த ஒருவருக்கு ஏதேனும் ஒரு பொருளை விற்றாலோ, அல்லது அவரிடமிருந்து வாங்கினாலோ, ஒருவன் தன் சகோதரனுக்கு அநியாயம் செய்யக் கூடாது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஒருவரையொருவர் ஏமாற்றாதீர்கள்’ அல்லது ‘ஒருவரிடமிருந்து ஒருவர் நியாயமற்ற ஆதாயம் பெறாதீர்கள்’ என்றும் மொழிபெயர்க்கலாம்; இங்கு வரும் வினை, குறிப்பாக வணிகப் பரிவர்த்தனைகளில், ஒருவரை அநியாயமாகப் பயன்படுத்திக்கொள்வதைக் குறிக்கலாம்.
    reason: ינה என்ற எபிரேய வினையின் பொருள் பரப்பையும் இவ்வசனத்தின் வணிகச் சூழலையும் விளக்குகிறது.
lexical_decisions:
- source_word: וְכִי
  choice: நீங்கள் ... விற்றாலோ
  rationale: சட்ட நிபந்தனையைத் தொடங்கும் וְכִי என்பதன் இணைப்பு மற்றும் நிபந்தனைப் பொருளைத் தமிழின் இயல்பான ‘-ஆலோ’ அமைப்பு வெளிப்படுத்துகிறது.
- source_word: תִמְכְּרוּ מִמְכָּר
  choice: எதையாவது விற்றாலோ
  rationale: מִמְכָּר என்பது விற்கப்படும் பொருளையோ விற்பனைப் பரிவர்த்தனையையோ குறிக்கலாம்; இங்கு ‘எதையாவது’ என்பது பொருளைத் தேவையின்றிக் குறிப்பாக்காமல் இயல்பாக உள்ளது.
- source_word: לַעֲמִיתֶךָ / עֲמִיתֶךָ
  choice: உங்கள் சமூகத்தைச் சேர்ந்த ஒருவருக்கு / அவரிடமிருந்து
  rationale: עָמִית என்பது வெறும் பக்கத்து வீட்டுக்காரரை அல்ல, அதே சமூகத்தைச் சேர்ந்த ஒருவரைக் குறிக்கிறது. இரண்டாவது இடத்தில் இயல்பான தமிழுக்காகச் சுட்டுப்பெயர் பயன்படுத்தப்பட்டுள்ளது.
- source_word: אוֹ קָנֹה מִיַּד
  choice: அவரிடமிருந்து எதையாவது வாங்கினாலோ
  rationale: קָנֹה முந்தைய நிபந்தனை வினையுடன் இணைந்து ‘வாங்கினாலோ’ எனப் பொருள்படுகிறது. מִיַּד என்பதிலுள்ள ‘கையிலிருந்து’ என்ற எபிரேய மரபுத்தொடரின் கருத்து தமிழில் இயல்பாக ‘அவரிடமிருந்து’ என வழங்கப்படுகிறது.
- source_word: אַל תּוֹנוּ
  choice: அநியாயமாக நடத்தக் கூடாது
  rationale: ינה என்ற வினை இவ்வணிகச் சூழலில் ஒருவருக்குத் தீங்கு செய்வது அல்லது நியாயமற்ற ஆதாயம் பெறுவது என்ற பரப்பைக் கொண்டுள்ளது; பரந்த பொருளையும் சூழலின் வணிகத் தீவிரத்தையும் இந்தத் தேர்வு தக்கவைக்கிறது.
- source_word: אִישׁ אֶת אָחִיו
  choice: உங்களில் ஒருவன் தன் சகோதரனை
  rationale: אִישׁ வழங்கும் பகிர்வுநிலையிலான ஒருமையையும் אָחִיו என்பதன் நேரடியான ‘தன் சகோதரன்’ என்ற சமூக-உறவுச் சொல்லையும் தக்கவைக்கிறது.
theological_decisions:
- issue: சட்டத் தடையில் வரும் ஆண்பால் பிரதிநிதிச் சொற்கள்
  choice: ‘உங்களில் ஒருவன் தன் சகோதரனை’ என்று ஆண்பால் வடிவங்களை முதன்மை உரையில் தக்கவைத்தல்
  alternative: ‘ஒருவரையொருவர்’ அல்லது ‘எவரையும்’
  rationale: எபிரேயத்தில் אִישׁ மற்றும் אָחִיו என்ற ஆண்பால் சொற்கள் பரந்த சமூகப் பயன்பாட்டுடன் வருகின்றன. அவற்றின் உரை வடிவத்தையும் சகோதர ஒற்றுமை நுணுக்கத்தையும் பாலினநடுநிலையாக்காமல் காக்கப்பட்டுள்ளது.
- issue: ינה என்பதன் வணிகச் சூழல் பொருள்
  choice: ‘அநியாயமாக நடத்தக் கூடாது’
  alternative: ‘ஒடுக்கக் கூடாது’, ‘ஏமாற்றக் கூடாது’, அல்லது ‘அநியாய ஆதாயம் பெறக் கூடாது’
  rationale: வினை தீங்கு செய்தல், ஒடுக்குதல், நியாயமற்ற முறையில் சாதகமாகப் பயன்படுத்திக்கொள்ளுதல் ஆகிய தொடர்புடைய பொருள்களைக் கொள்ள முடியும். முதன்மை உரை அதன் பரப்பைத் திறந்தவாறு வைக்கிறது; அடிக்குறிப்பு வணிகச் சூழலை விளக்குகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான சட்ட மொழிநடை பயன்படுத்தப்பட்டுள்ளது. ‘அயலான்’ என்பது עָמִית என்பதைக் புவியியல் அயலுறவாகத் தவறாகக் குறுக்கக்கூடும் என்பதால், ‘உங்கள் சமூகத்தைச் சேர்ந்த ஒருவர்’ என மொழிபெயர்க்கப்பட்டுள்ளது. மரியாதைமிக்க, பொதுவாசகர்களுக்கு எளிதில் புரியும் நடை காக்கப்பட்டுள்ளது.
