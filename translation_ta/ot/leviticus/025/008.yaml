base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/008.yaml
  text: You shall count for yourself seven sabbaths of years[a], seven years seven times, and the days of the seven sabbaths of years shall be for you forty-nine years.
translation:
  language: ta
  text: “நீ உனக்காக ஏழு ஓய்வாண்டுச் சுழற்சிகளை[a]—ஏழு ஆண்டுகளை ஏழு முறை—எண்ண வேண்டும். அந்த ஏழு ஓய்வாண்டுச் சுழற்சிகளின் நாட்கள் உனக்கு நாற்பத்தொன்பது ஆண்டுகளாக இருக்கும்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஏழு ஆண்டுவாரங்கள்.” எபிரெயத்தில் நேரடியாக, “ஆண்டுகளின் ஏழு சபத்துகள்”; இது தலா ஏழு ஆண்டுகள் கொண்ட ஏழு சுழற்சிகளைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָפַרְתָּ
  choice: எண்ண வேண்டும்
  rationale: ספר என்ற வினை இங்கு காலத் தொகுதிகளை எண்ணிக் கணக்கிடுவதைக் குறிக்கிறது; நவீனத் தமிழில் இயல்பாகவும் கட்டளையின் வலிமையுடனும் உள்ளது.
- source_word: לְךָ
  choice: உனக்காக
  rationale: எபிரெய உரையில் வெளிப்படையாக உள்ள இரண்டாம் நபர் நோக்குநிலையைத் தக்கவைக்கிறது.
- source_word: שֶׁבַע שַׁבְּתֹת שָׁנִים
  choice: ஏழு ஓய்வாண்டுத் தொகுதிகள்
  rationale: இது வாராந்திர ஓய்வுநாட்களைக் குறிக்காமல், தலா ஏழு ஆண்டுகள் கொண்ட ஓய்வாண்டுச் சுழற்சிகளைக் குறிக்கிறது. ‘தொகுதிகள்’ என்பது பொருளைத் தெளிவாக்குகிறது; ‘ஓய்வாண்டு’ சுற்றியுள்ள சட்டத்துடனான தொடர்பைக் காக்கிறது.
- source_word: שֶׁבַע שָׁנִים שֶׁבַע פְּעָמִים
  choice: ஏழு ஆண்டுகளை ஏழு முறை
  rationale: மூலத்தின் மீளுரைப்பையும் கணக்கீட்டையும் இயல்பான தமிழ்ச் சொல்லமைப்பில் பாதுகாக்கிறது.
- source_word: וְהָיוּ לְךָ
  choice: உனக்கு … ஆக இருக்கும்
  rationale: மூலத்தின் ‘உனக்கு இருக்கும்’ என்ற விளைவுக் கட்டமைப்பைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יְמֵי
  choice: நாட்கள்
  rationale: ‘காலம்’ என்று பொதுமைப்படுத்தாமல், மூலத்தின் நேரடியான ‘நாட்கள்’ என்ற சொல்லைத் தக்கவைக்கிறது.
- source_word: תֵּשַׁע וְאַרְבָּעִים שָׁנָה
  choice: நாற்பத்தொன்பது ஆண்டுகள்
  rationale: எபிரெய எண்ணை நவீனத் தமிழின் வழக்கமான வரிசையில் தெளிவாக வழங்குகிறது.
