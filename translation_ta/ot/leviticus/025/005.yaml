base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/005.yaml
  text: You shall not reap the aftergrowth of your harvest[a], and you shall not gather the grapes of your unpruned vine[c][b]; it shall be a year of complete rest for the land.
translation:
  language: ta
  text: உன் அறுவடையின் தானாக முளைத்த விளைச்சலை[a] நீ அறுவடை செய்யக்கூடாது; பராமரிக்கப்படாமல் விடப்பட்ட உன் திராட்சைக்கொடியின்[b] திராட்சைப் பழங்களை நீ பறிக்கக்கூடாது. அது நிலத்துக்கு முழுமையான ஓய்வு ஆண்டாக[c] இருக்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தானாக விளைந்த பயிரை.” முந்தைய பயிரின் விதைகளிலிருந்து விதைக்கப்படாமலே வளரும் விளைச்சல் இங்கு குறிக்கப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “தனியே விடப்பட்ட உன் கொடி.” ஓய்வு ஆண்டில் வெட்டிப் பராமரிக்கப்படாமல் விடப்பட்ட திராட்சைக்கொடியை இது குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “ஓய்வு ஆண்டு” அல்லது “புனித ஓய்வின் ஆண்டு.”
    reason: lexical_alternative
lexical_decisions:
- source_word: סְפִיחַ קְצִירְךָ
  choice: உன் அறுவடையிலிருந்து தானாக முளைத்து வளர்ந்ததை
  rationale: סְפִיחַ என்பது முந்தைய பயிரின் விதையிலிருந்து விதைக்காமலேயே தானாக வளரும் விளைச்சலைக் குறிக்கிறது. தமிழில் இயல்பாகவும் பொருள் தெளிவாகவும் இருக்க வினைத்தொடராக மொழிபெயர்க்கப்பட்டது.
- source_word: לֹא תִקְצוֹר
  choice: நீ அறுவடை செய்யக்கூடாது
  rationale: קצר என்பது வயல் விளைச்சலை அறுப்பதைச் சுட்டுகிறது; ‘அறுவடை செய்யக்கூடாது’ என்பது இச்சட்டத் தடையை நவீன தமிழில் தெளிவாகத் தெரிவிக்கிறது.
- source_word: עִנְּבֵי נְזִירֶךָ
  choice: பராமரிக்கப்படாமல் விடப்பட்ட உன் திராட்சைக்கொடியின் திராட்சைப் பழங்கள்
  rationale: வேளாண்மைச் சூழலில் נָזִיר் வெட்டிக் கவனிக்கப்படாமல் தனியே விடப்பட்ட கொடியைக் குறிக்கிறது. ‘பராமரிக்கப்படாமல் விடப்பட்ட’ என்பது வெறும் ‘கிளை வெட்டப்படாத’ என்பதைக் காட்டிலும் அதன் விரிந்த சூழற்பொருளைத் தருகிறது.
- source_word: לֹא תִבְצֹר
  choice: நீ பறிக்கக்கூடாது
  rationale: בצר என்பது குறிப்பாக திராட்சைப் பழங்களைச் சேகரிப்பதைக் குறிக்கிறது; தமிழில் ‘பறி’ இயல்பான வேளாண்மைச் சொல்.
- source_word: שְׁנַת שַׁבָּתוֹן
  choice: முழு ஓய்வின் ஆண்டு
  rationale: שַׁבָּתוֹן ஓய்வின் வலியுறுத்தப்பட்ட அல்லது முழுமையான தன்மையை வெளிப்படுத்துகிறது. ‘முழு ஓய்வின் ஆண்டு’ அந்த வலிமையைப் பாதுகாக்கிறது.
- source_word: לָאָרֶץ
  choice: நிலத்திற்கு
  rationale: இங்கு குறிப்பிடப்படுவது பயிரிடப்படும் நிலம்; ஆகவே ‘பூமிக்கு’ என்பதைக் காட்டிலும் ‘நிலத்திற்கு’ துல்லியமானது.
theological_decisions:
- issue: ஓய்வாண்டுச் சொல்லை பிற்கால சமய அல்லது சடங்கு அர்த்தங்களைச் சேர்க்காமல் மொழிபெயர்த்தல்
  choice: நிலத்திற்கு முழு ஓய்வின் ஆண்டு
  alternative: நிலத்திற்கு ஓய்வுநாள் ஆண்டு / நிலத்திற்கு சப ஓய்வின் ஆண்டு
  rationale: இந்த வசனம் நிலத்தின் தீவிரமான ஓய்வை வலியுறுத்துகிறது. ‘முழு ஓய்வின் ஆண்டு’ என்பது שַׁבָּתוֹן என்பதன் வலிமையைத் தெரிவிப்பதோடு, தமிழில் தெளிவற்ற அல்லது பிற்காலப் பயன்பாட்டைச் சுமக்கும் பெயர்ச்சொல்லைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான சட்டநடை பயன்படுத்தப்பட்டுள்ளது. ‘நீ ... செய்யக்கூடாது’ என்ற வடிவம் எபிரெயத் தடைக் கட்டளைகளை இயல்பாக வெளிப்படுத்துகிறது. மூலத்தின் வேளாண்மைச் சொற்கள் தெளிவாக வைக்கப்பட்டுள்ளன; உண்மையான சொற்பொருள் மாற்றுகள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
