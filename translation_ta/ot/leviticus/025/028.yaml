  text: וְ/אִ֨ם לֹֽא מָֽצְאָ֜ה יָד֗/וֹ דֵּי֮ הָשִׁ֣יב ל/וֹ֒ וְ/הָיָ֣ה מִמְכָּר֗/וֹ בְּ/יַד֙ הַ/קֹּנֶ֣ה אֹת֔/וֹ עַ֖ד שְׁנַ֣ת הַ/יּוֹבֵ֑ל וְ/יָצָא֙ בַּ/יֹּבֵ֔ל וְ/שָׁ֖ב לַ/אֲחֻזָּתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/028.yaml
  text: But if his hand does not find enough to restore it to him[a], then what he sold shall remain in the hand of the one who bought it until the year of Jubilee; and it shall go out in the Jubilee, and he shall return to his property.
translation:
  language: ta
  text: ஆனால், அதை மீட்டுக்கொள்ளத் தேவையான அளவு அவனுக்குக் கிடைக்காவிட்டால், அவன் விற்றது அதை வாங்கியவனின் கையில் யூபிலி ஆண்டுவரை இருக்கும். யூபிலி ஆண்டில் அது வாங்கியவனின் கையிலிருந்து வெளியேறும்; விற்றவன் தன் உரிமை நிலத்திற்குத் திரும்புவான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அது அவனுடைய உடைமையாகத் திரும்பும்.” இறுதி எபிரெய வினையின் எழுவாய் விற்றவனாகவும் விற்கப்பட்ட சொத்தாகவும் புரிந்துகொள்ளப்படலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: מָצְאָה יָדוֹ
  choice: வசதி அவனுக்குக் கிடைக்காவிட்டால்
  rationale: எபிரெய மொழியில் ‘அவன் கை கண்டடையவில்லை’ என்பது தேவையான பொருளாதார வளம் கிடைக்காததைக் குறிக்கும் மரபுத்தொடர். தமிழில் இயல்பாகவும் சட்டச் சூழலில் தெளிவாகவும் இருக்க ‘வசதி அவனுக்குக் கிடைக்காவிட்டால்’ எனப் பொருள் மொழிபெயர்க்கப்பட்டது.
- source_word: דֵּי
  choice: போதுமான
  rationale: தேவையான அளவு அல்லது நிறைவைச் சுட்டும் சொல்லாக இருப்பதால் ‘போதுமான’ என்பது இயல்பான தமிழ்ச் சமம்.
- source_word: הָשִׁיב לוֹ
  choice: அதை அவனுக்குத் திருப்பிக்கொடுக்க
  rationale: இங்கு விற்ற நிலத்தை மீட்பதற்குரிய தொகையை வாங்கியவனுக்குக் கொடுத்து, சொத்தை மீளப் பெறும் சட்ட நடவடிக்கை குறிக்கப்படுகிறது. ‘திருப்பிக்கொடுக்க’ என்பது பணத்தை மட்டும் செலுத்துதல் என்ற குறுகிய பொருளைத் தவிர்த்து, பரிவர்த்தனையைத் திரும்பச் செய்வதையும் வெளிப்படுத்துகிறது.
- source_word: מִמְכָּרוֹ
  choice: அவன் விற்றது
  rationale: இச்சொல் விற்பனையையோ விற்கப்பட்ட பொருளையோ குறிக்கலாம். தொடர்ந்து அது வாங்கியவனிடம் இருப்பதாகக் கூறப்படுவதால், இங்கு விற்கப்பட்ட சொத்தே குறிப்பு.
- source_word: בְּיַד הַקֹּנֶה אֹתוֹ
  choice: அதை வாங்கியவனின் கையில்
  rationale: ‘கையில்’ என்பது உடைமை அல்லது கட்டுப்பாட்டைக் குறிக்கும் எபிரெய சட்ட மரபுத்தொடரைத் தமிழிலும் புரியத்தக்க வகையில் தக்கவைக்கிறது.
- source_word: שְׁנַת הַיּוֹבֵל
  choice: யூபிலி ஆண்டு
  rationale: சட்டத்தில் குறிப்பிடப்படும் சிறப்பு ஆண்டிற்கான பெயரை ஒலிபெயர்த்து, ‘ஆண்டு’ என்பதுடன் தெளிவுபடுத்துகிறது.
- source_word: וְיָצָא בַּיּוֹבֵל
  choice: யூபிலி ஆண்டில் அது அவனுடைய கையிலிருந்து விடுபடும்
  rationale: יָצָא என்பதன் அடிப்படைப் பொருள் ‘வெளியே செல்லுதல்’. சொத்து வாங்கியவனின் கட்டுப்பாட்டிலிருந்து நீங்குவதைத் தமிழில் இயல்பாகக் காட்ட ‘கையிலிருந்து விடுபடும்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: וְשָׁב לַאֲחֻזָּתוֹ
  choice: விற்றவன் தன் உரிமைச் சொத்துக்குத் திரும்புவான்
  rationale: இறுதி ஆண்பால் ஒருமை வினையின் எழுவாய் முந்தைய விற்பவனாக இருக்க வாய்ப்பு அதிகம். אֲחֻזָּה என்பது குறிப்பாக ஒருவருக்குரிய நிலையான அல்லது பரம்பரை உரிமைச் சொத்தைக் குறிப்பதால் ‘உரிமைச் சொத்து’ என வழங்கப்பட்டது.
theological_decisions:
- issue: இறுதி וְשָׁב வினையின் எழுவாய்
  choice: 'விற்றவனே எழுவாய்: ‘விற்றவன் தன் உரிமைச் சொத்துக்குத் திரும்புவான்.’'
  alternative: 'விற்கப்பட்ட சொத்தே எழுவாய்: ‘அது அவனுடைய உரிமைச் சொத்தாகத் திரும்பும்.’'
  rationale: எபிரெய ஆண்பால் ஒருமை வினை இலக்கணப்படி விற்றவனையோ விற்கப்பட்ட சொத்தையோ குறிக்கக்கூடும். யூபிலிச் சட்டத்தின் தனிப்பட்ட-உரிமைச் சூழல் விற்றவனை எழுவாயாகக் கொள்வதற்கு ஆதரவளிக்கிறது; இருப்பினும் மெய்யான இலக்கணத் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீன தரத் தமிழில், சட்ட உரையின் கண்ணியமும் தெளிவும் பேணப்பட்டுள்ளன. எபிரெய ‘கை’ மரபுத்தொடர் உடைமைச் சூழலில் மட்டும் தக்கவைக்கப்பட்டு, பொருளாதார இயலாமையைக் குறிக்கும் முதல் மரபுத்தொடர் இயல்பான தமிழாக மாற்றப்பட்டுள்ளது. உண்மையான எழுவாய் ஐயம் [a] அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
