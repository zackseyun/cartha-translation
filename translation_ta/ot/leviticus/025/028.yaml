- from: ஆனால், அதை அவனுக்குத் திருப்பிக்கொடுக்கப் போதுமான வசதி அவனுக்குக் கிடைக்காவிட்டால், அவன் விற்றது அதை வாங்கியவனின் கையில் யூபிலி ஆண்டுவரை இருக்கும். யூபிலி ஆண்டில் அது அவனுடைய கையிலிருந்து விடுபடும்; விற்றவன் தன் உரிமைச் சொத்துக்குத் திரும்புவான்.[a]
  to: ஆனால், அதை மீட்டுக்கொள்ளத் தேவையான அளவு அவனுக்குக் கிடைக்காவிட்டால், அவன் விற்றது அதை வாங்கியவனின் கையில் யூபிலி ஆண்டுவரை இருக்கும். யூபிலி ஆண்டில் அது வாங்கியவனின் கையிலிருந்து வெளியேறும்; விற்றவன் தன் உரிமை நிலத்திற்குத் திரும்புவான்.[a]
  rationale: The revision clarifies that the seller lacks the means to redeem the sold holding, explicitly identifies the buyer as the party from whose possession it leaves at Jubilee, and uses a landholding-specific term for אֲחֻזָּה. The footnote continues to preserve the genuine ambiguity concerning the subject of the final Hebrew verb without forcing an interpretive conclusion.
