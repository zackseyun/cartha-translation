source:
  edition: WLC
  text: כִּ/שְׂכִ֥יר שָׁנָ֛ה בְּ/שָׁנָ֖ה יִהְיֶ֣ה עִמּ֑/וֹ לֹֽא יִרְדֶּ֥/נּֽוּ בְּ/פֶ֖רֶךְ לְ/עֵינֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/053.yaml
  text: Like a hired worker year by year he shall be with him[a]; he shall not rule over him harshly in your sight.
translation:
  language: ta
  text: அவன் ஆண்டுதோறும் கூலித் தொழிலாளியைப் போல அவருடன் இருப்பான்[a]. உன் கண்முன்னே அவர் அவனைக் கடுமையாக ஆளக்கூடாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆண்டுதோறும் கூலிக்கு அமர்த்தப்பட்ட பணியாளனாக அவன் அவருடன் இருப்பான்.”
    reason: ஒப்பீட்டுச் சொற்றொடரின் இலக்கண அமைப்பையும் שׂכיר என்பதற்கான மாற்று இயல்பான தமிழாக்கத்தையும் காட்டுகிறது.
lexical_decisions:
- source_word: כִּשְׂכִיר
  choice: கூலித் தொழிலாளியைப் போல
  rationale: כ என்ற முன்னொட்டு ஒப்பீட்டைக் குறிக்கிறது; שׂכיר அடிமையை அல்ல, கூலிக்கு வேலை செய்பவரைக் குறிக்கிறது. ‘கூலித் தொழிலாளி’ என்பது நவீனத் தமிழில் தெளிவானதும் துல்லியமானதும் ஆகும்.
- source_word: שָׁנָה בְּשָׁנָה
  choice: ஆண்டுதோறும்
  rationale: இந்த எபிரெயச் சொற்றொடர் ஒவ்வோர் ஆண்டாகத் தொடரும் நிலையைக் குறிக்கிறது; ‘ஆண்டுதோறும்’ அதன் பகிர்ந்தளிக்கும் காலப்பொருளை இயல்பாகத் தருகிறது.
- source_word: יִהְיֶה עִמּוֹ
  choice: அவருடன் இருப்பான்
  rationale: எபிரெய உரை நேரடியாக ‘அவருடன் இருப்பான்’ என்றே கூறுகிறது. ‘தங்கியிருப்பான்’ அல்லது ‘பணிபுரிவான்’ என்பது மூலத்தில் வெளிப்படையாக இல்லாத பொருளைச் சேர்க்கும்.
- source_word: לֹא יִרְדֶּנּוּ
  choice: அவர் அவனை ஆளக்கூடாது
  rationale: רדה என்பது ‘ஆளுதல்’ அல்லது ‘ஆதிக்கம் செலுத்துதல்’ என்பதைக் குறிக்கிறது. சட்டச் சூழலில் எஜமான் பாதுகாக்கப்பட்ட இஸ்ரவேலர்மீது கடுமையான அதிகாரம் செலுத்துவதை இது தடைசெய்கிறது.
- source_word: בְּפֶרֶךְ
  choice: கடுமையாக
  rationale: இந்தச் சொல் இரக்கமற்ற கடுமையையும், குறிப்பாகக் கட்டாய உழைப்பில் காட்டப்படும் கொடுமையையும் குறிக்கிறது. ‘ஆளக்கூடாது’ என்பதுடன் ‘கடுமையாக’ இயல்பாக இணைகிறது.
- source_word: לְעֵינֶיךָ
  choice: உன் கண்முன்னே
  rationale: இது சொற்படியாக ‘உன் கண்களுக்கு முன்’ என்பதாகும்; காணக்கூடிய, சாட்சியாக இருக்கும் நடத்தையைக் குறிக்கும் இயல்பான தமிழாக்கம் ‘உன் கண்முன்னே’.
theological_decisions:
- issue: அந்நிய உரிமையாளரின் கீழுள்ள இஸ்ரவேலரின் நிலை
  choice: அடிமை என்று நேரடியாக அழைக்காமல், கூலித் தொழிலாளியுடன் ஒப்பிட்டு மொழிபெயர்க்கப்பட்டது.
  alternative: கூலிக்கு அமர்த்தப்பட்ட பணியாளனைப் போல
  rationale: இவ்வசனம் அந்நியரிடம் விற்கப்பட்ட இஸ்ரவேலரின் நடத்தையை ஒழுங்குபடுத்தி, அவருடைய நிலையை ஒரு கூலித் தொழிலாளியின் நிலையுடன் ஒப்பிடுகிறது. இதனால் שׂכיר என்பதில் இல்லாத முழுமையான உடைமை-அடிமைத்தனப் பொருள் புகுத்தப்படாமல், அத்தியாயத்தின் பணிவிடைச் சூழலும் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டவிதிக்குரிய கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ஒருமை ஆண் சுட்டுப்பெயர்களில் கீழ்நிலையிலுள்ள நபருக்கு ‘அவன்’, உரிமையாளருக்கு மரியாதை/வேறுபாடு தெளிவாக இருக்க ‘அவர்’ பயன்படுத்தப்பட்டுள்ளது; இதனால் இரு ஆண் நபர்களுக்கிடையிலான குறிப்புத் தெளிவு மேம்படுகிறது.
