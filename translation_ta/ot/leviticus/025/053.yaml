  source_fidelity: மூல எபிரெயத்தின் ஒப்பீட்டுப் பொருள் (כִּשְׂכִיר), ஆண்டுக்கு ஆண்டு தொடரும் நிலை, எளிய ‘அவருடன் இருப்பான்’ என்ற வினை, கடுமையான ஆட்சிக்குத் தடை, மற்றும் ‘உன் கண்முன்னே’ என்ற நேரடியான சாட்சிப் பொருள் ஆகியவை அனைத்தும் தக்கவைக்கப்பட்டுள்ளன. ‘கூலித் தொழிலாளியைப் போல’ என்பது שָׂכִיר என்பதற்கு நவீனத் தமிழில் துல்லியமான மொழிபெயர்ப்பு.
  naturalness: நடை நவீன நிலையான தமிழில் தெளிவாகவும் சட்டவிதிக்குரிய கண்ணியத்துடனும் உள்ளது. இரு ஆண் குறிப்பாளர்களை வேறுபடுத்த ‘அவன்/அவர்’ பயன்படுத்துவது, மரியாதை நுணுக்கத்தைச் சேர்த்தாலும், இவ்விடத்தில் குறிப்புத் தெளிவை நன்கு வழங்குகிறது.
  terminology: ‘கூலித் தொழிலாளி,’ ‘கடுமையாக ஆளக்கூடாது,’ மற்றும் ‘உன் கண்முன்னே’ ஆகிய சொற்கள் மூலத்தின் சட்ட, சமூக, நெறிசார் வலிமையை மிகைப்படுத்தாமலும் குறைக்காமலும் தெரிவிக்கின்றன. அடிமைத்தனத்தை நேரடியாகச் சொல்வதைத் தவிர்த்து, மூலத்தில் உள்ள கூலியாளருடனான ஒப்பீடு பாதுகாக்கப்பட்டுள்ளது.
