base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/007.yaml
  text: And for your livestock[a], and for the wild animals that are in your land, all its produce shall be for food.
translation:
  language: ta
  text: உன் கால்நடைகளுக்கும், உன் நிலத்தில் உள்ள காட்டு விலங்குகளுக்கும், அந்த நிலத்தின் விளைச்சல் அனைத்தும்[a] உணவாக இருக்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதன் விளைச்சல் அனைத்தும் உண்பதற்காக இருக்கும்.” எபிரெயத்தில், “அதன் விளைச்சல் அனைத்தும் உண்பதற்காக” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְהֶמְתְּךָ
  choice: உன் கால்நடைகளுக்கும்
  rationale: בְּהֵמָה என்பது இங்கு உரையாடப்படுபவருக்குச் சொந்தமான வளர்ப்பு விலங்குகளைத் தொகுப்பாகக் குறிக்கிறது. அடுத்து வரும் காட்டு விலங்குகளிலிருந்து இதைத் தெளிவாக வேறுபடுத்துவதற்கு ‘கால்நடைகள்’ இயல்பான நவீனத் தமிழ் சொல்லாகும்.
- source_word: לַחַיָּה
  choice: காட்டு விலங்குகளுக்கும்
  rationale: חַיָּה இங்கு கால்நடைகளுக்கு எதிராக வளர்க்கப்படாத விலங்குகளைக் குறிக்கிறது. ‘காட்டு விலங்குகள்’ என்பது தெளிவான, நேரடியான தமிழ் மொழிபெயர்ப்பு.
- source_word: אֲשֶׁר בְּאַרְצְךָ
  choice: உன் நாட்டிலுள்ள
  rationale: இந்தத் தொடர்புரை காட்டு விலங்குகளை விளக்குகிறது. אֶרֶץ என்பதன் நிலம்/நாடு என்ற பொருளை இச்சூழலில் ‘உன் நாட்டிலுள்ள’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: תִּהְיֶה
  choice: இருக்கும்
  rationale: היה இங்கு விளைச்சல் உணவாகக் கிடைக்கும் அல்லது ஒதுக்கப்பட்டிருக்கும் நிலையைச் சுட்டுகிறது. ‘இருக்கும்’ கட்டளையின் விளைவைக் கூறும் இயல்பான எதிர்கால வடிவம்.
- source_word: כָּל תְּבוּאָתָהּ
  choice: அதன் விளைச்சல் அனைத்தும்
  rationale: תְּבוּאָה நிலத்திலிருந்து கிடைக்கும் விளைச்சலைக் குறிக்கிறது; பெண்பால் பின்னொட்டு முன் குறிப்பிடப்பட்ட நாட்டை/நிலத்தைச் சுட்டுகிறது. ‘விளைச்சல்’ வேளாண்மைச் சூழலுக்குப் பொருத்தமானது.
- source_word: לֶאֱכֹל
  choice: உணவாக
  rationale: ל உடனான வினையெச்ச வடிவம் நோக்கம் அல்லது பயன்பாட்டைத் தெரிவிக்கிறது. ‘உணவாக இருக்கும்’ என்பது ‘உண்பதற்காக இருக்கும்’ என்ற எபிரெயக் கருத்தைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
