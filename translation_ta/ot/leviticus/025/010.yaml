base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/010.yaml
  text: And you shall consecrate the fiftieth year[a], and proclaim liberty in the land to all its inhabitants. It shall be a jubilee for you, and each of you shall return to his property[d][c][b], and each of you shall return to his family.
translation:
  language: ta
  text: ஐம்பதாம் ஆண்டைப் புனிதமாக ஒதுக்கி, நாட்டில் குடியிருப்போர் அனைவருக்கும் விடுதலையை அறிவிக்க வேண்டும்.[a] அது உங்களுக்கு யூபிலி ஆண்டாக இருக்கும்.[b] அப்போது ஒவ்வொருவரும் தங்கள் உரிமை நிலத்திற்குத் திரும்ப வேண்டும்; ஒவ்வொருவரும் தங்கள் குடும்பத்தாரிடம் திரும்ப வேண்டும்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “விடுதலை” என்பதற்கு “விடுவிப்பு” அல்லது “சுதந்திரம்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் யூபிலி ஆண்டில் முறையாக அறிவிக்கப்படும் விடுதலையைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “யூபிலி” என்பது ஐம்பதாம் ஆண்டில் விடுதலையும் உரிமை நிலங்களின் மீட்டளிப்பும் நடைபெறும் சிறப்பு ஆண்டைக் குறிக்கிறது. இச்சொல் அந்த ஆண்டை அறிவிக்க ஊதப்பட்ட ஆட்டுக்கடாக் கொம்புடன் தொடர்புடையது.
    reason: lexical_and_cultural_note
  - marker: c
    text: “குடும்பத்தார்” என்பதற்கு “குலத்தார்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקִדַּשְׁתֶּם
  choice: புனிதமாக ஒதுக்கி
  rationale: קדשׁ என்பதன் பியேல் வடிவம் ஒன்றைப் புனிதமானதாக ஆக்குதல் அல்லது புனித நோக்கத்திற்காக ஒதுக்குதல் என்பதைக் குறிக்கிறது; இச்சொற்றொடர் தமிழில் இயல்பாகவும் வழிபாட்டுச் சார்ந்த பொருளுடனும் உள்ளது.
- source_word: שְׁנַת הַחֲמִשִּׁים שָׁנָה
  choice: ஐம்பதாம் ஆண்டு
  rationale: எபிரெய எண்ணமைப்பின் இயல்பான தமிழ் வடிவம்.
- source_word: וּקְרָאתֶם דְּרוֹר
  choice: விடுதலையை அறிவிக்க வேண்டும்
  rationale: דְּרוֹר இங்கு யூபிலி ஆண்டில் அதிகாரப்பூர்வமாக அறிவிக்கப்படும் விடுதலை அல்லது விடுவிப்பைக் குறிக்கிறது; 'விடுதலை' அதன் பரந்த பொருளைத் தக்கவைக்கிறது.
- source_word: בָּאָרֶץ לְכָל יֹשְׁבֶיהָ
  choice: தேசத்தில் குடியிருப்போர் அனைவருக்கும்
  rationale: בְּ என்பதன் இடப்பொருளையும், יֹשְׁבֶיהָ என்பதன் 'அதில் குடியிருப்போர்' என்ற பொருளையும் தெளிவாகக் காட்டுகிறது.
- source_word: יוֹבֵל הִוא תִּהְיֶה לָכֶם
  choice: அது உங்களுக்கு யூபிலி ஆண்டாக இருக்கும்
  rationale: இச்சூழலில் יוֹבֵל வெறும் ஆட்டுக்கடாக் கொம்பை அல்ல, ஐம்பதாம் ஆண்டின் சிறப்பு அமைப்பைக் குறிக்கும் தொழில்நுட்பச் சொல்; 'ஆண்டு' என்பதைச் சேர்ப்பது தமிழில் குறிப்பைத் தெளிவாக்குகிறது.
- source_word: וְשַׁבְתֶּם ... תָּשֻׁבוּ
  choice: திரும்ப வேண்டும் ... திரும்ப வேண்டும்
  rationale: שׁוב என்ற வினையின் எபிரெய மறுபயன்பாட்டையும் மீட்டளிப்பு மையக்கருத்தையும் தமிழிலும் தக்கவைக்கிறது.
- source_word: אִישׁ
  choice: ஒவ்வொருவரும்
  rationale: ஆண்பால் ஒருமை வடிவம் இச்சட்டச் சூழலில் பகிர்வுப் பொருளில் ஒவ்வொரு இஸ்ரவேலரையும் குறிக்கிறது; பாலினத்தைத் தேவையின்றி முன்வைக்காமல் அதன் பகிர்வுப் பொருளை இயல்பான தமிழில் வழங்குகிறது.
- source_word: אֶל אֲחֻזָּתוֹ
  choice: தங்கள் உரிமை நிலத்திற்கு
  rationale: אֲחֻזָּה பொதுவான உடைமையைவிட, குறிப்பாக குடும்ப வழியாகக் கிடைத்த நில உரிமையைக் குறிக்கிறது; 'உரிமை நிலம்' சூழலுக்கேற்ற துல்லியமான தமிழ்.
- source_word: אֶל מִשְׁפַּחְתּוֹ
  choice: தங்கள் குடும்பத்தாரிடம்
  rationale: מִשְׁפָּחָה குடும்பம் அல்லது குலக்குழுவைக் குறிக்கலாம்; முதன்மை உரையில் இயல்பான 'குடும்பத்தார்' வைக்கப்பட்டு மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: சட்ட உரையில் பகிர்வுப் பொருளுடைய אִישׁ
  choice: ஒவ்வொருவரும்
  alternative: ஒவ்வொரு ஆணும்
  rationale: אִישׁ வடிவில் ஆண்பாலாக இருந்தாலும் இங்கு பகிர்வுப் பயன்பாட்டில் ஒவ்வொரு சம்பந்தப்பட்ட இஸ்ரவேலரையும் குறிக்கிறது. 'ஒவ்வொருவரும்' இரண்டாம் நபர் பன்மை உரையோடும் இயல்பாக இணைகிறது; மூலத்தின் சட்டப் பொருளை மாற்றுவதில்லை.
- issue: יוֹבֵל என்பதன் தொழில்நுட்பப் பொருள்
  choice: யூபிலி ஆண்டு
  alternative: ஆட்டுக்கடாக் கொம்பு
  rationale: லேவியராகமம் 25-இல் இச்சொல் கொம்பினால் செய்யப்பட்ட அறிவிப்பை மட்டும் அல்லாமல் ஐம்பதாம் ஆண்டின் விடுதலை மற்றும் மீட்டளிப்பு அமைப்பைக் குறிக்கிறது.
- issue: מִשְׁפָּחָה குறிக்கும் சமூக அலகு
  choice: குடும்பத்தார்
  alternative: குலத்தார்
  rationale: எபிரெயச் சொல் குடும்பம் முதல் விரிந்த குலக்குழு வரை குறிக்கக்கூடும். அந்தத் தெளிவின்மையை மாற்றுப் பொருளுடன் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்ட உரைக்கேற்ற கண்ணியமான கட்டளை நடையைப் பயன்படுத்துகிறது. இரண்டாம் நபர் பன்மைச் சூழலைத் தமிழின் மரியாதை/பன்மை வடிவில் இயல்பாக வெளிப்படுத்தி, எபிரெய வினை மறுபயன்பாட்டைத் தக்கவைக்கிறது.
