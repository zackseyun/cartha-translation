  revised_text: ஐம்பதாம் ஆண்டைப் புனிதமாக ஒதுக்கி, நாட்டில் குடியிருப்போர் அனைவருக்கும் விடுதலையை அறிவிக்க வேண்டும்.[a] அது உங்களுக்கு யூபிலி ஆண்டாக இருக்கும்.[b] அப்போது ஒவ்வொருவரும் தங்கள் உரிமை நிலத்திற்குத் திரும்ப வேண்டும்; ஒவ்வொருவரும் தங்கள் குடும்பத்தாரிடம் திரும்ப வேண்டும்.[c]
