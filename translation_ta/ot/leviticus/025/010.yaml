  source_fidelity: 'மூல எபிரெய உரையின் வரிசையும் பொருளும் பெரும்பாலும் சரியாகக் காக்கப்பட்டுள்ளன: ஐம்பதாம் ஆண்டைப் புனிதமாக ஒதுக்குதல், நாட்டின் குடியிருப்போருக்கெல்லாம் விடுதலையை அறிவித்தல், யூபிலி, உரிமை நிலத்திற்கும் குடும்பம்/குலத்திற்கும் திரும்புதல் ஆகியவை தெளிவாக உள்ளன. ஆனால் דְּרוֹר என்பதற்கான மாற்றுப்பொருள் அடிக்குறிப்பு இல்லாததால், அதன் ‘விடுவிப்பு/சுதந்திரம்’ என்ற சொற்பொருள் நுணுக்கம் குறைவாகப் பதிவாகிறது.'
  naturalness: நடை நவீன நிலையான தமிழில் இயல்பாகவும் சட்டவகை அறிவிப்பு நடைக்கு ஏற்றதாகவும் உள்ளது. ‘தேசத்தில்’ என்பதற்குப் பதிலாக ‘நாட்டில்’ என்பது בָּאָרֶץ என்ற சூழல்சார் ‘land’ பொருளுக்கு மேலும் இயல்பாகவும் துல்லியமாகவும் அமையும்.
  terminology: ‘புனிதமாக ஒதுக்கி’, ‘யூபிலி ஆண்டு’, ‘உரிமை நிலம்’ ஆகியவை பொருத்தமானவை. ‘குடும்பத்தார்’ என்பது מִשְׁפָּחָה-வின் உடனடி பொருளைத் தருகிறது; ‘குலத்தார்’ என்ற மாற்று அடிக்குறிப்பு அதன் விரிந்த சமூக அலகுப் பொருளைக் காக்கிறது. דְּרוֹר-க்கு ‘விடுதலை’ சரியான முதன்மை மொழிபெயர்ப்பு; மாற்றாக ‘விடுவிப்பு’ அல்லது ‘சுதந்திரம்’ என்பதைக் குறிப்பு மூலம் தர வேண்டும்.
