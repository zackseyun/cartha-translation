  rationale: முதன்மை உரையின் பொருளை மாற்றாமல், בָּאָרֶץ-க்கு ‘நாட்டில்’ என்ற இயல்பான சூழல்சார் வடிவம் பயன்படுத்தப்பட்டுள்ளது. மேலும் דְּרוֹר-ன் ‘விடுதலை/விடுவிப்பு’ நுணுக்கத்தை வெளிப்படுத்தும் அடிக்குறிப்பு சேர்க்கப்பட்டு, யூபிலி மற்றும் குடும்பம்/குலம் குறித்த குறிப்புகளுக்கான அடிக்குறிப்பு அடையாளங்கள் தெளிவாக மறுசீரமைக்கப்பட்டுள்ளன.
