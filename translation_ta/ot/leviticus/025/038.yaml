revisions:
- from: உங்கள் கடவுளாகிய யாவே[a] நானே. உங்களுக்குக் கானான் நாட்டைக் கொடுப்பதற்காக உங்களை எகிப்து நாட்டிலிருந்து வெளியே கொண்டுவந்தவர் நானே; நான் உங்கள் கடவுளாக இருப்பேன்.
  to: உங்கள் கடவுளாகிய யாவே[a] நானே; உங்களுக்குக் கானான் நாட்டைக் கொடுப்பதற்காகவும் உங்கள் கடவுளாக இருப்பதற்காகவும் உங்களை எகிப்து நாட்டிலிருந்து வெளியே கொண்டுவந்தேன்.
