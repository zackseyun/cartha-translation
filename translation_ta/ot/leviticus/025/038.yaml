  text: אֲנִ֗י יְהוָה֙ אֱלֹ֣הֵי/כֶ֔ם אֲשֶׁר הוֹצֵ֥אתִי אֶתְ/כֶ֖ם מֵ/אֶ֣רֶץ מִצְרָ֑יִם לָ/תֵ֤ת לָ/כֶם֙ אֶת אֶ֣רֶץ כְּנַ֔עַן לִ/הְי֥וֹת לָ/כֶ֖ם לֵ/אלֹהִֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/038.yaml
  text: I am Yahweh your God[a], who brought you out of the land of Egypt to give you the land of Canaan, to be your God.
translation:
  language: ta
  text: உங்கள் கடவுளாகிய யாவே[a] நானே; உங்களுக்குக் கானான் நாட்டைக் கொடுப்பதற்காகவும் உங்கள் கடவுளாக இருப்பதற்காகவும் உங்களை எகிப்து நாட்டிலிருந்து வெளியே கொண்டுவந்தேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரேயத்தில்: “YHWH”; மரபாக “கர்த்தர்” என்று மொழிபெயர்க்கப்படுகிறது.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இஸ்ரயேலின் கடவுளுடைய தனிப்பட்ட உடன்படிக்கைப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், எபிரேய நான்கெழுத்துப் பெயரின் பொதுவான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֱלֹהֵיכֶם
  choice: உங்கள் கடவுள்
  rationale: வடிவில் பன்மையாக இருந்தாலும், இங்கு ஒருமையான யாவேயைக் குறிக்கும் உடன்படிக்கைச் சூழல் காரணமாக ஒருமையில் மொழிபெயர்க்கப்படுகிறது.
- source_word: הוֹצֵאתִי
  choice: வெளியே கொண்டுவந்தவர் நானே
  rationale: יצא என்பதன் Hiphil வடிவம் யாத்திராகமச் சூழலில் ‘வெளியே கொண்டுவருதல்’ என்று பொருள்படும்; தமிழ் வாக்கியத்தில் முதல் நபர் செயலை இயல்பாகவும் வலியுறுத்தலுடனும் தருகிறது.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: எகிப்து நாட்டிலிருந்து
  rationale: אֶרֶץ என்ற சொல்லை விடாமல் ‘நாடு’ என வெளிப்படையாகத் தக்கவைக்கிறது.
- source_word: לָתֵת לָכֶם אֶת אֶרֶץ כְּנַעַן
  choice: உங்களுக்குக் கானான் நாட்டைக் கொடுப்பதற்காக
  rationale: லாமேத் முன்னொட்டுடன் வரும் infinitive construct இங்குள்ள நோக்கப் பொருளை நேரடியாகப் பாதுகாக்கிறது.
- source_word: לִהְיוֹת לָכֶם לֵאלֹהִים
  choice: நான் உங்கள் கடவுளாக இருப்பேன்
  rationale: உடன்படிக்கை உறவை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; கடவுளின் இயல்பில் மாற்றம் ஏற்பட்டது என்ற எண்ணத்தைச் சேர்ப்பதில்லை.
- source_word: אֲנִי
  choice: நானே
  rationale: தனி நபர்ப் பெயர்ச்சொல்லின் வலியுறுத்தலைத் தமிழின் ‘-ஏ’ விகுதியால் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற உடன்படிக்கைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் ஒரு பட்டமல்ல, கடவுளின் தனிப்பட்ட பெயரே உள்ளது; ஆகவே அதை ஒலிபெயர்ப்பாகத் தக்கவைக்கிறது.
- issue: לִהְיוֹת לָכֶם לֵאלֹהִים என்ற உடன்படிக்கை வாய்பாடு
  choice: நான் உங்கள் கடவுளாக இருப்பேன்
  alternative: உங்களுக்குக் கடவுளாக இருக்கும்படி; உங்கள் கடவுளாக ஆவதற்கு
  rationale: இது கடவுளின் இருப்பில் மாற்றத்தை அல்ல, அவர் தம் மக்களுடன் கொண்ட உடன்படிக்கை உறவைச் சுட்டுகிறது. தமிழில் முழு வாக்கியமாக்குவது அந்த உறவுப் பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. எபிரேய வாக்கியத்தின் தொடக்கத்திலும் முடிவிலும் உள்ள தெய்வீகத் தன்னடையாளம் மற்றும் உடன்படிக்கை நோக்கம் தமிழில் வலியுறுத்தப்பட்டுள்ளன; வசனத்தில் பன்மை ‘நீங்கள்’ தொடர்ந்து பயன்படுத்தப்பட்டுள்ளது.
