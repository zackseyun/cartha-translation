source:
  edition: WLC
  text: וְ/אִ֣ם לֹֽא יִגָּאֵ֗ל עַד מְלֹ֣את ל/וֹ֮ שָׁנָ֣ה תְמִימָה֒ וְ֠/קָם הַ/בַּ֨יִת אֲשֶׁר בָּ/עִ֜יר אֲשֶׁר לא חֹמָ֗ה לַ/צְּמִיתֻ֛ת לַ/קֹּנֶ֥ה אֹת֖/וֹ לְ/דֹרֹתָ֑י/ו לֹ֥א יֵצֵ֖א בַּ/יֹּבֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/030.yaml
  text: But if it is not redeemed before a full year is completed for it[a], then the house that is in a city that has no wall shall pass permanently to the one who bought it, throughout his generations[b]; it shall not go out in the Jubilee.
translation:
  language: ta
  text: ஆனால், அதற்கான ஒரு முழு ஆண்டு முடிவதற்குள் அந்த வீடு மீட்கப்படாவிட்டால், மதிலுள்ள நகரத்தில் உள்ள அந்த வீடு[a] அதை வாங்கியவருக்கும் அவரது தலைமுறையினருக்கும் நிரந்தரமாக உரியதாக நிலைபெறும்; யூபிலி ஆண்டில் அது விடுவிக்கப்படாது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மசோரெத்திய உரையின் எழுதப்பட்ட வடிவம் “மதில் இல்லாத நகரம்” என வாசிக்கப்படுகிறது; ஆனால் ஓரக் குறிப்பிலுள்ள பாரம்பரிய வாசிப்பு “மதிலுள்ள நகரம்” என்பதாகும். அடுத்த வசனத்தின் மாறுபட்ட விதியும் இந்தப் பாரம்பரிய வாசிப்பை ஆதரிக்கிறது.
    reason: textual_variant
  - marker: b
    text: அதாவது, யூபிலி ஆண்டில் அந்த வீடு முந்தைய உரிமையாளரின் குடும்பத்திற்குத் திரும்பாது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִגָּאֵל
  choice: மீட்கப்படாவிட்டால்
  rationale: גאל என்பதன் நிபால் வடிவம் இங்குச் சொத்தை உரிய காலத்துக்குள் விலை கொடுத்து மீட்பதைக் குறிக்கிறது. லேவியராகமம் 25 முழுவதிலும் தொடரும் சட்டரீதியான ‘மீட்பு’ சொல்லாட்சியை இது காக்கிறது.
- source_word: עַד מְלֹאת לוֹ שָׁנָה תְמִימָה
  choice: அதற்கான ஒரு முழு ஆண்டு நிறைவடைவதற்குள்
  rationale: வீட்டை மீட்பதற்குரிய முழுமையான ஓராண்டுக் காலக்கெடுவைத் தெளிவாகவும் இயல்பான தமிழிலும் தெரிவிக்கிறது; לוֹ என்ற பின்னொட்டின் தொடர்பை ‘அதற்கான’ காக்கிறது.
- source_word: וְקָם ... לַצְּמִיתֻת
  choice: நிரந்தரமாகச் சொந்தமாகிவிடும்
  rationale: ‘நிற்கும்/நிலைபெறும்’ என்ற நேரடிப் பொருள் இச்சட்டச் சூழலில் விற்பனை மாற்ற முடியாதபடி உறுதியாகிவிடுவதைக் குறிக்கிறது. தமிழில் அதன் சட்ட விளைவை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַבַּיִת אֲשֶׁר בָּעִיר אֲשֶׁר לוֹ חֹמָה (Qere)
  choice: மதிலுள்ள நகரத்தில் இருக்கும் அந்த வீடு
  rationale: மசோரெத்திய வாசிப்பு மரபான Qere ‘அதற்கு மதில் உள்ளது’ என்று வாசிக்கிறது; அடுத்த வசனத்தில் மதிலில்லாத ஊர்களுக்கான மாறுபட்ட விதி வருவதாலும் இதுவே சூழலுக்கு ஏற்ற முதன்மை வாசிப்பு. எழுத்து வடிவின் வேறுபாடு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: לַקֹּנֶה אֹתוֹ לְדֹרֹתָיו
  choice: அதை வாங்கியவருக்கும் அவருடைய தலைமுறையினருக்கும்
  rationale: வாங்கியவரின் குடும்ப வழியில் உரிமை தொடர்ந்து நிலைப்பதை வெளிப்படுத்துகிறது; לְדֹרֹתָיו என்பதைக் ‘சந்ததியினர்’ என்று மட்டும் சுருக்காமல் தலைமுறைத் தொடர்ச்சியைப் பாதுகாக்கிறது.
- source_word: לֹא יֵצֵא בַּיּוֹבֵל
  choice: யூபிலி ஆண்டில் அது விடுவிக்கப்படாது
  rationale: יצא என்பதன் நேரடிப் பொருள் ‘வெளியே செல்லுதல்’ என்றாலும், இச்சொத்துச் சட்டத்தில் யூபிலியில் உரிமை விடுவிக்கப்பட்டு முந்தைய குடும்பத்திற்குத் திரும்பாததைக் குறிக்கிறது. ‘விடுவிக்கப்படாது’ என்பது தெளிவான நவீனத் தமிழ்.
- source_word: יּוֹבֵל
  choice: யூபிலி ஆண்டு
  rationale: லேவியராகமம் 25-இன் நிறுவப்பட்ட சிறப்பு ஆண்டைக் குறிக்கும் பெயரைத் திரிபின்றி அடையாளப்படுத்தும் தமிழ் ஒலிபெயர்ப்பு.
theological_decisions:
- issue: மதிலுள்ள நகர வீட்டின் விற்பனை நிரந்தரமாவது
  choice: ஒரு முழு ஆண்டுக்குள் மீட்கப்படாத வீடு வாங்கியவரின் தலைமுறைகளுக்கு நிரந்தர உரிமையாகி, யூபிலியில் விடுவிக்கப்படாது.
  alternative: விற்பனை வெறுமனே செல்லுபடியாகத் தொடரும் என்று மட்டும் சொல்லி, பரம்பரை உரிமையின் நிரந்தரத்தன்மையை வெளிப்படுத்தாமல் விடுதல்.
  rationale: וְקָם, לַצְּמִיתֻת, לְדֹרֹתָיו, לֹא יֵצֵא בַּיּוֹבֵל ஆகியவை சேர்ந்து, வழக்கமான யூபிலி மீளளிப்புக்கு மாறாக மாற்ற முடியாத பரம்பரை உரிமையைத் தெளிவாகக் காட்டுகின்றன.
- issue: לא/לו என்ற மசோரெத்திய எழுத்து–வாசிப்பு வேறுபாடு
  choice: முதன்மை உரையில் Qere-ஐப் பின்பற்றி ‘மதிலுள்ள நகரம்’ என்று வாசித்து, Ketiv-இன் ‘மதில் இல்லாத’ வாசிப்பை அடிக்குறிப்பில் குறிப்பிடுதல்.
  alternative: எழுதப்பட்ட Ketiv-ஐப் பின்பற்றி ‘மதில் இல்லாத நகரம்’ என்று முதன்மை உரையில் மொழிபெயர்த்தல்.
  rationale: Qere வாசிப்பு, பழமையான மொழிபெயர்ப்பு மரபு மற்றும் வசனம் 31-இன் எதிர்மறை ஒப்பீடு ஆகியவை ‘மதிலுள்ள நகரம்’ என்பதை வலுவாக ஆதரிக்கின்றன. எனினும் உண்மையான உரை வேறுபாடு மறைக்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்ட உரைக்கேற்ற கண்ணியமான ஆனால் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘மீட்கப்படுதல்’, ‘நிரந்தரமாகச் சொந்தமாகுதல்’, ‘விடுவிக்கப்படுதல்’ ஆகிய சொற்கள் சொத்துச் சட்டத்தின் கருத்தைத் தெளிவாக்குகின்றன. Ketiv/Qere வேறுபாடு முதன்மை உரையைச் சுமையாக்காமல் அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
