source:
  edition: WLC
  text: בִּ/שְׁנַ֥ת הַ/יּוֹבֵ֖ל הַ/זֹּ֑את תָּשֻׁ֕בוּ אִ֖ישׁ אֶל אֲחֻזָּתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/013.yaml
  text: In this Year of Jubilee[a], each of you shall return to his property.
translation:
  language: ta
  text: இந்த யூபிலி ஆண்டில்[a], நீங்கள் ஒவ்வொருவரும் அவரவர் உரிமைச் சொத்துக்குத் திரும்ப வேண்டும்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “யூபிலி ஆண்டு” என்பது விடுதலையையும் சொத்து மீட்பையும் குறித்த சிறப்பு ஆண்டு.
    reason: term_explanation
  - marker: b
    text: அல்லது, “அவரவர் உடைமைக்குத் திரும்ப வேண்டும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁנַת הַיּוֹבֵל הַזֹּאת
  choice: இந்த யூபிலி ஆண்டில்
  rationale: בְּ என்பதன் காலப் பொருளையும், הַזֹּאת என்பதன் அண்மைச் சுட்டையும் இயல்பான தமிழ் சொல் வரிசையில் தருகிறது. יוֹבֵל என்பதைச் சிறப்பு ஏற்பாட்டின் பெயராக ஒலிபெயர்த்து, அதன் பொருளை அடிக்குறிப்பில் விளக்குகிறது.
- source_word: תָּשֻׁבוּ
  choice: திரும்ப வேண்டும்
  rationale: சட்டக் கட்டளையாக வரும் இரண்டாம் நபர் பன்மை வடிவத்தை நவீனத் தமிழில் இயல்பான கடப்பாட்டு நடையில் தருகிறது.
- source_word: אִישׁ
  choice: நீங்கள் ஒவ்வொருவரும்
  rationale: இங்கு אִישׁ பகிர்நிலைப் பொருளில் ‘ஒவ்வொருவரும்’ என வருகிறது; வினையின் இரண்டாம் நபர் பன்மையையும் தமிழில் வெளிப்படையாகப் பேணுகிறது.
- source_word: אֶל אֲחֻזָּתוֹ
  choice: அவரவர் உரிமைச் சொத்துக்கு
  rationale: אֲחֻזָּה என்பது இச்சூழலில் ஒருவருக்குரிய சொத்து அல்லது நிலவுடைமையைக் குறிக்கிறது. ‘அவரவர்’ என்பது எபிரெயச் சொற்றொடரின் பகிர்நிலை ஒருமையை இயல்பாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: אִישׁ என்பதன் ஆண்பால் பகிர்நிலை வடிவம்
  choice: நீங்கள் ஒவ்வொருவரும்
  alternative: ஒவ்வொரு ஆணும்
  rationale: இங்கு ஆண்பால் ஒருமை வடிவம் ஒவ்வொரு உறுப்பினரையும் பகிர்நிலையில் குறிக்கிறது. தமிழில் ‘நீங்கள் ஒவ்வொருவரும்’ என்பது அதன் கட்டளைப் பொருளையும் பகிர்நிலையையும் இயல்பாகப் பேணுகிறது; உரை வெளிப்படையாக வலியுறுத்தாத பாலின வரம்பைச் சேர்ப்பதில்லை.
- issue: אֲחֻזָּה என்பதன் சட்ட மற்றும் உடைமைப் பொருள்
  choice: உரிமைச் சொத்து
  alternative: உடைமை
  rationale: லேவியராகமம் 25-ன் சூழலில் குடும்பத்துக்குரிய நிலச் சொத்து முன்னிலையில் இருந்தாலும், வசனம் தானாக ‘நிலம்’ அல்லது ‘பரம்பரை’ என்று விரிவாக்கவில்லை. எனவே அந்தச் சூழலை உணர்த்தியும் மிகைவிளக்கம் சேர்க்காமலும் ‘உரிமைச் சொத்து’ பயன்படுத்தப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சட்டக் கட்டளைக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘வருஷம்’, ‘காணியாட்சி’ போன்ற பழைய அல்லது வட்டாரத் தோற்றமுள்ள சொற்கள் தவிர்க்கப்பட்டன; பகிர்நிலைப் பொருள் ‘ஒவ்வொருவரும் அவரவர்’ எனத் தெளிவாகவும் இயல்பாகவும் தரப்பட்டுள்ளது.
