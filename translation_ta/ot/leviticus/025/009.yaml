base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/009.yaml
  text: Then you shall sound a trumpet blast in the seventh month[a], on the tenth day of the month[b]. On the Day of Atonement you shall sound the trumpet throughout all your land.
translation:
  language: ta
  text: ஏழாம் மாதத்தின் பத்தாம் நாளில் எக்காளப் பேரொலியை எழுப்புவாய்[a]. பாவநிவாரண நாளில்[b] உங்கள் நாடெங்கும் எக்காளத்தை முழங்கச் செய்வீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘ஷோஃபார்’; அதாவது, கொம்பால் செய்யப்பட்ட எக்காளம். பாரம்பரியமாக இது பெரும்பாலும் செம்மறியாட்டுக் கடாவின் கொம்பு எனப் புரிந்துகொள்ளப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘பாவநிவாரண நாள்’ என்பது எபிரெயத்தில் சொற்படியாக ‘பாவநிவாரணங்களின் நாள்’ என்று பன்மையில் உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַעֲבַרְתָּ
  choice: எழுப்புங்கள்
  rationale: עבר என்பதன் ஹிஃபில் வடிவம் சொற்படியாக ‘கடக்கச் செய்’ எனினும், שׁוֹפָר உடன் வரும்போது கொம்பின் ஒலியைப் பரவச் செய்வதைக் குறிக்கிறது. தமிழில் ‘ஒலியை எழுப்புங்கள்’ என்பது இயல்பான கட்டளைநடை.
- source_word: שׁוֹפַר תְּרוּעָה
  choice: எக்காளத்தின் பேரொலி
  rationale: שׁוֹפָר என்பது கொம்பால் செய்யப்பட்ட ஊதுகருவி; תְּרוּעָה இங்கு அதன் வலிமையான அறிவிப்பு ஒலியைக் குறிக்கிறது. ‘பேரொலி’ என்பது சாதாரண ‘ஒலி’யைவிட அதன் தீவிரத்தைக் காட்டுகிறது.
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי בֶּעָשׂוֹר לַחֹדֶשׁ
  choice: ஏழாம் மாதத்தின் பத்தாம் நாளில்
  rationale: இரு காலக் குறிப்புகளையும் இயல்பான நவீன தமிழில் ஒன்றிணைத்து, மாதமும் நாளும் தெளிவாகத் தருகிறது.
- source_word: בְּיוֹם הַכִּפֻּרִים
  choice: பாவநிவாரண நாளில்
  rationale: இது இஸ்ரவேலின் குறிப்பிட்ட வழிபாட்டு நாளைக் குறிக்கிறது. כִּפֻּרִים இலக்கணத்தில் பன்மையாக இருந்தாலும், தமிழில் வழக்கமான விழாப்பெயராக ஒருமை வடிவம் தெளிவாக உள்ளது; மூலத்தின் பன்மை அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: תַּעֲבִירוּ שׁוֹפָר
  choice: எக்காளத்தை முழங்கச் செய்யுங்கள்
  rationale: வினைச்சொல்லின் காரணவினைத் தன்மையையும், எக்காள ஒலி நாடெங்கும் செல்லச் செய்யப்படுவதையும் ‘முழங்கச் செய்யுங்கள்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּכָל אַרְצְכֶם
  choice: உங்கள் நாடெங்கும்
  rationale: בכל என்பதன் முழுப் பரப்பையும் உள்ளடக்கும் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: יוֹם הַכִּפֻּרִים என்பதன் மொழிபெயர்ப்பு
  choice: பாவநிவாரண நாள்
  alternative: நிவாரணங்களின் நாள் / பாவப்பரிகார நாள்
  rationale: மூலச்சொல் இலக்கணப் பன்மையில் இருந்தாலும் குறிப்பிட்ட வருடாந்திரப் பரிசுத்த நாளையே குறிக்கிறது. ‘பாவநிவாரண நாள்’ அதன் வழிபாட்டுச் சூழலைத் தெளிவாகச் சொல்லுகிறது; பன்மை நுட்பம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான வழிபாட்டு நடையுடன் மொழிபெயர்க்கப்பட்டது. வசனத்தின் இரு கட்டளைகளும் பன்மை மரியாதை/கூட்டுக் கட்டளை வடிவில் தரப்பட்டுள்ளன; எபிரெயத்தின் முதல் வினை ஒருமையில் இருப்பது சூழலில் மோசேயை நோக்கிய கட்டளையாகவும், இரண்டாவது பன்மையில் சமூகத்தை நோக்கியதாகவும் இருக்கலாம் என்ற இலக்கண வேறுபாடு தமிழில் இயல்புக்காக வெளிப்படையாகக் காட்டப்படவில்லை.
