base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/052.yaml
  text: But if few years remain until the Year of Jubilee, then he shall calculate with him; according to his years he shall repay his redemption.
translation:
  language: ta
  text: ஆனால் யூபிலி ஆண்டு வரும்வரைச் சில ஆண்டுகளே மீதமிருந்தால், அவன் அவனுடன் கணக்கிட்டுத் தன் மீட்புத் தொகையை மீதியுள்ள ஆண்டுகளின் விகிதப்படி திருப்பிச் செலுத்த வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறுவிதமாக: “தன் மீட்பைத் திருப்பிச் செலுத்த வேண்டும்.” எபிரெயச் சொற்றொடர் இங்கு மீட்புக்காகச் செலுத்த வேண்டிய தொகையைக் குறிக்கிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעַט נִשְׁאַר בַּשָּׁנִים
  choice: சில ஆண்டுகளே மீதியிருந்தால்
  rationale: שׁאר என்பதன் நிபால் வடிவம் ‘மீதியிருத்தல்’ என்ற பொருளைத் தருகிறது; מְעַט என்பது ஆண்டுகளின் குறைந்த எண்ணிக்கையைச் சுட்டுகிறது. நவீனத் தமிழில் இயல்பாகவும் அளவுப் பொருளைத் தெளிவாகவும் கூறுகிறது.
- source_word: שְׁנַת הַיֹּבֵל
  choice: யூபிலி ஆண்டு
  rationale: லேவியராகமம் 25-இல் நிறுவப்பட்ட குறிப்பிட்ட ஆண்டைக் குறிக்கும் எபிரெயச் சொல்லின் ஒலிப்பெயர்ப்பையும் ‘ஆண்டு’ என்ற விளக்கத்தையும் இணைக்கிறது.
- source_word: וְחִשַּׁב לוֹ
  choice: அவன் அவருடன் கணக்கிட்டு
  rationale: சட்ட-பொருளாதாரச் சூழலில் חשב கணக்கிடுதல் அல்லது தொகையை நிர்ணயித்தல் என்பதைக் குறிக்கிறது. לוֹ இங்கு சம்பந்தப்பட்ட மறுதரப்புடன் செய்யப்படும் கணக்கீட்டைச் சுட்டுவதாக இயல்பான தமிழில் வழங்கப்பட்டுள்ளது.
- source_word: כְּפִי שָׁנָיו
  choice: மீதியுள்ள ஆண்டுகளின் விகிதப்படி
  rationale: כְּפִי என்பது அளவு அல்லது விகிதத்துக்கு ஏற்ப என்பதைக் குறிக்கிறது. சூழலில் கணக்கீட்டுக்குப் பொருந்துவது யூபிலிவரை மீதியுள்ள ஆண்டுகள் என்பதால், தமிழில் அந்தத் தொடர்பு வெளிப்படையாகக் கூறப்பட்டுள்ளது.
- source_word: יָשִׁיב אֶת גְּאֻלָּתוֹ
  choice: தன் மீட்புத் தொகையைத் திருப்பிச் செலுத்த வேண்டும்
  rationale: שוב என்பதன் ஹிபில் வடிவம் இங்கு திருப்பிக் கொடுத்தல் அல்லது செலுத்துதல்; גְּאֻלָּה விடுதலைக்காகச் செலுத்த வேண்டிய தொகையைச் சுட்டுகிறது. ‘மீட்பு’ என்ற கருத்தியல் பொருளாகத் தவறாகப் புரியாமல் நிதிசார் பொருளைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: גְּאֻלָּתוֹ என்பது மீட்புச் செயலையா அல்லது மீட்புக்கான பணத்தையா குறிக்கிறது?
  choice: மீட்புத் தொகை
  alternative: மீட்பு
  rationale: இந்தச் சட்ட-பொருளாதாரச் சூழலும் יָשִׁיב (‘திருப்பிச் செலுத்துதல்’) என்ற வினையும் பணத் தொகையைக் குறிக்கின்றன. இது ஒரு குறிப்பிட்ட இறையியல் மீட்புக் கருத்தை வசனத்தில் திணிப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் சட்டவிதிக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘அவன்’ என்பது மீட்கப்படுகிற நபரையும், மரியாதைப் பன்மையான ‘அவருடன்’ என்பது கணக்கிடப்படும் மறுதரப்பையும் குறிக்கிறது; தொடர்ச்சியான சூழலில் இவை தெளிவாகின்றன.
