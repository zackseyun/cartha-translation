  source_fidelity: மூல எபிரெயத்தின் நிபந்தனை அமைப்பு, யூபிலிவரை மீதமுள்ள குறைந்த ஆண்டுகள், இரு தரப்பினரிடையேயான கணக்கீடு, ஆண்டுகளின் விகிதத்துக்கேற்ப மீட்புக்கான தொகையைத் திருப்பிச் செலுத்துதல் ஆகியவை வரைவில் சரியாக உள்ளன. இருப்பினும், ‘அவருடன்’ என்ற மரியாதைப் பன்மை மூலத்தின் ஒருமைச் சுட்டுப்பெயருக்கு அப்பாற்பட்ட சமூகப் பதிவைச் சேர்க்கிறது; நடுநிலையான ஒருமை வடிவம் சிறந்தது.
  naturalness: ‘மீதியிருந்தால்’ என்பதற்குப் பதில் ‘மீதமிருந்தால்’ நவீன நிலையான தமிழில் இயல்பானது. மேலும் ‘யூபிலி ஆண்டு வருவதற்குச்’ என்பதற்குப் பதில் ‘யூபிலி ஆண்டு வரும்வரை’ கால எல்லையை நேரடியாகவும் இயல்பாகவும் காட்டுகிறது. வினையெச்சத்தை ‘கணக்கிட்டுத்’ என அமைப்பது வாக்கிய ஓட்டத்தைச் செம்மையாக்குகிறது.
