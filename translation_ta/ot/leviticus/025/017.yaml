revisions:
- from: ஒருவன் தன் சக மனிதனை அநியாயமாக நடத்தக்கூடாது[a]. நீயோ உன் தேவனுக்குப் பயப்பட வேண்டும்; ஏனெனில் நானே யாவே, உங்கள் தேவன்.
  to: ஒருவன் தன் சகமனிதனிடம் அநியாயமாக நடந்துகொள்ளக்கூடாது[a]. நீயோ உன் தேவனுக்குப் பயப்பட வேண்டும்; ஏனெனில் நான் உங்கள் தேவனாகிய யாவே.
  rationale: 'The revision makes only limited linguistic corrections: it uses an idiomatic Tamil expression for wronging a fellow person, removes added emphasis from the first-person divine declaration, and recasts the closing covenant formula in natural Tamil. The lexical footnote remains anchored to the prohibition and continues to preserve the relevant semantic range.'
