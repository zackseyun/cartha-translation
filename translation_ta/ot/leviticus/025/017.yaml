source:
  edition: WLC
  text: וְ/לֹ֤א תוֹנוּ֙ אִ֣ישׁ אֶת עֲמִית֔/וֹ וְ/יָרֵ֖אתָ מֵֽ/אֱלֹהֶ֑י/ךָ כִּ֛י אֲנִ֥י יְהֹוָ֖ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/017.yaml
  text: And no man shall oppress his neighbor[a], but you shall fear your God, for I am Yahweh your God.
translation:
  language: ta
  text: ஒருவன் தன் சகமனிதனிடம் அநியாயமாக நடந்துகொள்ளக்கூடாது[a]. நீயோ உன் தேவனுக்குப் பயப்பட வேண்டும்; ஏனெனில் நான் உங்கள் தேவனாகிய யாவே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சுரண்டக்கூடாது’ அல்லது ‘தீங்கு செய்யக்கூடாது’ என்றும் மொழிபெயர்க்கலாம். சமூக அல்லது பொருளாதாரப் பரிவர்த்தனைகளில் மற்றவரிடம் அநியாயமாகப் பயனடைவதையும் எபிரெய வினை குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: תוֹנוּ
  choice: அநியாயமாக நடத்தக்கூடாது
  rationale: இந்தச் சட்ட மற்றும் பொருளாதாரச் சூழலில், மற்றவரை வஞ்சித்து அவரிடமிருந்து அநியாயமாக ஆதாயம் பெறுவதையும் அவரைச் சுரண்டுவதையும் இந்த வினை குறிக்கலாம். தமிழில் இயல்பாகவும் அதன் பரந்த ஒழுக்க வலிமையைத் தக்கவைக்கவும் ‘அநியாயமாக நடத்தக்கூடாது’ என மொழிபெயர்க்கப்பட்டது.
- source_word: אִישׁ
  choice: ஒருவன்
  rationale: எபிரெயச் சொல் இலக்கணப்படி ஆண்பால் ஒருமையாக இருந்து, ஒவ்வொருவரையும் தனித்தனியாகக் குறிக்கும் பகிர்வுப் பொருளில் வருகிறது. அந்த வடிவத்தைத் தமிழில் இயல்பாகப் பிரதிபலிக்க ‘ஒருவன்’ பயன்படுத்தப்பட்டது.
- source_word: עֲמִיתוֹ
  choice: தன் சக மனிதனை
  rationale: சட்டப் பகுதிகளில் இச்சொல் ஒரே சமூகத்தைச் சேர்ந்த சக உறுப்பினரையோ ஒருவருக்கு இணையான மற்றவரையோ குறிக்கிறது. ‘சக மனிதன்’ அதன் மனித உறவையும் சமூகப் பொருளையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְיָרֵאתָ
  choice: நீயோ ... பயப்பட வேண்டும்
  rationale: இணைப்புச்சொல் வடிவில் ‘மற்றும்’ என்றாலும், முன்னுள்ள தடைக்கும் இங்குள்ள நேர்மறைக் கட்டளைக்கும் இடையிலான எதிர்மறை வேறுபாட்டை ‘நீயோ’ இயல்பாகக் காட்டுகிறது.
- source_word: מֵאֱלֹהֶיךָ
  choice: உன் தேவனுக்குப்
  rationale: ירא என்ற வினையுடன் מן வந்தால் பயத்தின் பொருளைக் குறிக்கிறது. தமிழில் ‘தேவனுக்குப் பயப்படு’ என்பது இயல்பான மரபுத்தொடர்.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது ஒரு பட்டம் அல்ல, இஸ்ரவேலருக்கு வெளிப்படுத்தப்பட்ட தேவனுடைய தனிப்பெயர். எனவே தமிழில் வழக்கமான ஒலிபெயர்ப்பான ‘யாவே’ பயன்படுத்தப்பட்டது.
- source_word: אֱלֹהֵיכֶם
  choice: உங்கள் தேவன்
  rationale: எபிரெயச் சொல்லில் உள்ள பன்மை உடைமைப் பின்னொட்டு முழு உடன்படிக்கைச் சமூகத்தையும் நோக்குகிறது; ‘உங்கள் தேவன்’ அந்த எண்ணைத் தெளிவாகத் தக்கவைக்கிறது.
- source_word: כִּי אֲנִי יְהוָה אֱלֹהֵיכֶם
  choice: ஏனெனில் நானே யாவே, உங்கள் தேவன்
  rationale: כִּי கட்டளைக்கான காரணத்தைத் தருகிறது. ‘நானே’ என்பது אֲנִי-யின் வலியுறுத்தலை இயல்பாக வெளிப்படுத்துகிறது; இறுதித் தொடர் தேவனுடைய அடையாளத்திலும் அதிகாரத்திலும் கட்டளையை நிலைநிறுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற தேவப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தேவனுடைய நான்கெழுத்துத் தனிப்பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் அதன் பெயரொலியை ‘யாவே’ எனத் தக்கவைத்தது.
- issue: אִישׁ என்பதிலுள்ள பிரதிநிதித்துவ ஆண்பால் வடிவம்
  choice: ஒருவன்
  alternative: ஒருவர்; எவரும்
  rationale: மூலம் ஆண்பால் ஒருமையை ஒவ்வொருவரையும் குறிக்கும் வகையில் பயன்படுத்துகிறது. ‘ஒருவன்’ அந்த இலக்கண வடிவத்தைப் பாதுகாக்கிறது; சட்டத்தின் ஒழுக்கக் கட்டளை சமூகத்தின் ஒவ்வோர் உறுப்பினருக்கும் பொருந்துகிறது.
- issue: தனியொருமையிலிருந்து சமூகப் பன்மைக்கு மாறும் முகவரி
  choice: உன் தேவன் ... உங்கள் தேவன்
  alternative: உங்கள் தேவன் ... உங்கள் தேவன்
  rationale: וְיָרֵאתָ மற்றும் אֱלֹהֶיךָ தனியொருமையில் ஒவ்வொரு கேட்பவரையும் நோக்குகின்றன; இறுதி אֱלֹהֵיכֶם பன்மையில் சமூகமுழுவதையும் நோக்குகிறது. இந்த அர்த்தமுள்ள மாற்றம் தமிழிலும் பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான சட்டநடை பயன்படுத்தப்பட்டுள்ளது. ‘நீயோ/உன்’ மற்றும் ‘உங்கள்’ என்ற எண் மாற்றம் மூலத்தின் தனிநபர்–சமூக முகவரி வேறுபாட்டைப் பாதுகாக்கிறது; ‘யாவே’ தனிப்பெயராக ஒலிபெயர்க்கப்பட்டுள்ளது.
