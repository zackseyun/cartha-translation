  edition: WLC
  text: כְּ/שָׂכִ֥יר כְּ/תוֹשָׁ֖ב יִהְיֶ֣ה עִמָּ֑/ךְ עַד שְׁנַ֥ת הַ/יֹּבֵ֖ל יַעֲבֹ֥ד עִמָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/040.yaml
  text: He shall be with you like a hired worker[a], like a sojourner; he shall serve with you until the year of jubilee.
translation:
  language: ta
  text: அவன் உன்னுடன் கூலித் தொழிலாளியைப்போலவும், குடியேறி வாழும் அந்நியனைப்போலவும் இருக்க வேண்டும்; யூபிலி ஆண்டு வரை அவன் உன்னுடன் வேலை செய்ய வேண்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּשָׂכִיר
  choice: கூலித் தொழிலாளியைப்போல
  rationale: שָׂכִיר என்பது கூலிக்காக வேலை செய்பவரைக் குறிக்கிறது. ‘கூலித் தொழிலாளி’ என்பது இன்றைய தமிழில் தெளிவான சொல்; இச்சூழலில் அடிமையிலிருந்து வேறுபட்ட அவரது சட்டநிலையையும் வெளிப்படுத்துகிறது.
- source_word: כְּתוֹשָׁב
  choice: குடியிருக்கும் அந்நியனைப்போல
  rationale: תּוֹשָׁב என்பது இஸ்ரவேலரிடையே வசித்தாலும் நாட்டினராக இல்லாத ஒருவரைக் குறிக்கிறது. ‘குடியிருக்கும் அந்நியன்’ என்ற சொற்றொடர் அவரது குடியிருப்பு நிலையையும் அந்நியத்தன்மையையும் பாதுகாக்கிறது.
- source_word: יִהְיֶה עִמָּךְ
  choice: அவன் உன்னுடன் ... இருக்க வேண்டும்
  rationale: எபிரெய உரையின் நேரடியான உறவுநிலையைத் தக்கவைத்து, முன்வரும் இரண்டு ஒப்புமைகளையும் இயல்பான தமிழில் இணைக்கிறது.
- source_word: עַד שְׁנַת הַיֹּבֵל
  choice: யூபிலி ஆண்டு வரை
  rationale: லேவியராகமம் 25-இல் விடுதலைக்குரிய குறிப்பிட்ட ஆண்டைக் குறிக்கும் தொழில்நுட்பச் சொல்லாக יוֹבֵל உள்ளது; ‘யூபிலி ஆண்டு’ அதன் தனித்துவமான சட்டப் பெயரைத் தக்கவைக்கிறது.
- source_word: יַעֲבֹד עִמָּךְ
  choice: அவன் உன்னுடன் வேலை செய்ய வேண்டும்
  rationale: עבד இங்கு வேலை செய்தல் அல்லது சேவை செய்தல் என்ற பொருளுடையது. சூழல் அவரை அடிமையாக நடத்துவதைத் தடைசெய்வதால், ‘வேலை செய்ய’ என்பது தேவையற்ற அடிமைத்தனச் சாயலைத் தவிர்க்கிறது; עִמָּךְ என்பதையும் ‘உன்னுடன்’ என்று நேரடியாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: கடன் காரணமாகப் பணிபுரியும் இஸ்ரவேலரின் நிலை
  choice: அவரை அடிமையாக அல்லாமல் கூலித் தொழிலாளி மற்றும் குடியிருக்கும் அந்நியன் ஆகியோருக்கு ஒப்பான நிலையுடையவராக மொழிபெயர்த்தல்
  alternative: ‘கூலி அடிமையைப்போல ... உனக்குச் சேவை செய்ய வேண்டும்’ என்று மொழிபெயர்த்தல்
  rationale: உடனடிச் சூழல் (லேவி 25:39–43) இவரை அடிமையிலிருந்து வேறுபடுத்தி, அவரது உழைப்பைத் தற்காலிகமாகவும் பாதுகாப்புக்குட்பட்டதாகவும் ஒழுங்குபடுத்துகிறது. ஆகவே மூலத்தில் வரையறுக்கப்படும் ஆதிக்கத்தைவிட அதிகமான அடிமைத்தனக் கருத்தை மொழிபெயர்ப்பு சேர்க்கக்கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டவிதியின் கண்ணியமான தொனியைப் பேணும் எளிய நடை. ஒருமை ஆண்பால் சுட்டுப்பெயர்களும் ‘உன்னுடன்’ என்ற இரண்டாம் நபர் ஒருமையும் மூலத்தைப் பின்பற்றுகின்றன. வசனத்தில் அடிக்குறிப்பு தேவைப்படாததால் எந்தக் குறியீடும் சேர்க்கப்படவில்லை.
