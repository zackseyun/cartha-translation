  text: וְ/הָ/אָ֗רֶץ לֹ֤א תִמָּכֵר֙ לִ/צְמִתֻ֔ת כִּי לִ֖/י הָ/אָ֑רֶץ כִּֽי גֵרִ֧ים וְ/תוֹשָׁבִ֛ים אַתֶּ֖ם עִמָּדִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/023.yaml
  text: The land must not be sold permanently[a], because the land is mine[b]. For you are strangers and sojourners with me.
translation:
  language: ta
  text: நிலம் நிரந்தரமாக விற்கப்படக் கூடாது[a]; ஏனெனில் நிலம் என்னுடையது. நீங்கள் என்னிடத்தில் பரதேசிகளாகவும் தற்காலக் குடியிருப்பவர்களாகவும் இருக்கிறீர்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘என்றென்றைக்கும்’ அல்லது ‘நிரந்தரமாகக் கைமாற்றப்படக் கூடாது.’
    reason: lexical_alternative
  - marker: b
    text: ‘பரதேசிகளாகவும் தற்காலக் குடியிருப்பவர்களாகவும்’ என்பது, கடவுளின் நிலத்தில் முழு உரிமையின்றி அவரைச் சார்ந்து வசிக்கும் நிலையைச் சுட்டுகிறது.
    reason: cultural_note
lexical_decisions:
- source_word: תִמָּכֵר
  choice: விற்கப்படக் கூடாது
  rationale: நிஃபால் வினைவடிவத்தின் செயப்பாட்டு பொருளையும் சட்டச் சூழலின் தடையாணை வலிமையையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: לִצְמִתֻת
  choice: நிரந்தரமாக
  rationale: நிலம் மீட்க முடியாத வகையில் முற்றிலும் கைமாறுவதை இச்சொல் குறிக்கிறது; ‘நிரந்தரமாக’ என்பது தெளிவாகவும் பொதுவாகப் புரியக்கூடியதாகவும் உள்ளது.
- source_word: כִּי לִי הָאָרֶץ
  choice: ஏனெனில் நிலம் என்னுடையது
  rationale: தடைக்கான காரணத்தையும் கடவுளின் நேரடியான உரிமைக் கோரிக்கையையும் அப்படியே காக்கிறது.
- source_word: גֵרִים
  choice: அந்நியர்கள்
  rationale: தங்களுக்குச் சொந்தமல்லாத நாட்டில் சார்புநிலையில் வாழ்பவர்களைக் குறிக்கிறது; அடுத்த சொல்லிலிருந்து வேறுபாட்டையும் பேணுகிறது.
- source_word: וְתוֹשָׁבִים
  choice: குடியிருப்பவர்கள்
  rationale: அங்கு வசித்தாலும் பரம்பரை வழியான முழு உரிமை இல்லாத குடியிருப்புநிலையைச் சுட்டுகிறது; ‘அந்நியர்கள்’ என்பதுடன் சேர்ந்துவரும் இரட்டைச் சொல்லாட்சியைப் பேணுகிறது.
- source_word: עִמָּדִי
  choice: என்னோடு
  rationale: עם என்ற முன்னிடைச்சொல்லின் நேரடியான பொருளைத் தக்கவைத்து, கடவுளுக்குச் சொந்தமான நிலத்தில் அவரைச் சார்ந்து வாழும் உறவைத் திறந்தவாறே விடுகிறது.
theological_decisions:
- issue: இஸ்ரவேலருக்கும் நிலத்திற்கும் உள்ள உறவு
  choice: நிலத்தின் உரிமையாளர் கடவுள்; இஸ்ரவேலர் அவரோடு அந்நியர்களாகவும் குடியிருப்பவர்களாகவும் வாழ்கிறார்கள்.
  alternative: இதைத் தெய்வீக உரிமைக் கூற்று இல்லாத சமூக-பொருளாதார ஒழுங்காக மட்டும் வாசித்தல்; அல்லது யூபிலி சூழலைத் தாண்டிய முழுமையான உரிமையகற்றலாக விரிவுபடுத்தல்.
  rationale: ‘நிலம் என்னுடையது’ என்ற வெளிப்படையான கூற்று சட்டத்தை இறையியல் அடிப்படையில் நிலைநிறுத்துகிறது. மொழிபெயர்ப்பு உடனடியான யூபிலி சூழலைத் தாண்டி கருத்தை விரிவாக்காமல், சட்ட மற்றும் இறையியல் வலிமைகள் இரண்டையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; சட்டத்தின் வலிமைக்காக ‘விற்கப்படக் கூடாது’ என்றும், எளிதில் புரியும் சொல்லாட்சிக்காக ‘நிரந்தரமாக’ என்றும் பயன்படுத்தப்பட்டுள்ளது. ‘அந்நியர்கள்’ மற்றும் ‘குடியிருப்பவர்கள்’ என்ற இணைச்சொற்கள் எபிரெய மூலத்தின் தனித்த இரு சமூகநிலைக் குறிப்புகளையும் இயன்றவரை பேணுகின்றன.
