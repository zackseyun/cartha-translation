revisions:
- from: நிலம் நிரந்தரமாக விற்கப்படக் கூடாது[a]; ஏனெனில் நிலம் என்னுடையது. நீங்கள் என்னோடு அந்நியர்களாகவும் குடியிருப்பவர்களாகவும் இருக்கிறீர்கள்[b].
  to: நிலம் நிரந்தரமாக விற்கப்படக் கூடாது[a]; ஏனெனில் நிலம் என்னுடையது. நீங்கள் என்னிடத்தில் பரதேசிகளாகவும் தற்காலக் குடியிருப்பவர்களாகவும் இருக்கிறீர்கள்[b].
  rationale: The revision retains the draft’s accurate legal prohibition and divine ownership rationale. It refines only the final paired social-status terms and their note so that the Tamil better reflects the Hebrew distinction and the verse’s land-tenure context, without importing doctrinal conclusions or expanding the scope beyond the text.
