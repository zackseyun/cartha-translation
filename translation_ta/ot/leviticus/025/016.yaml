base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/016.yaml
  text: In proportion to the greater number of years you shall increase its purchase price[a], and in proportion to the fewer number of years you shall reduce its purchase price, because he is selling to you a number of harvests.
translation:
  language: ta
  text: ஆண்டுகள் அதிகமாக இருப்பதற்கு ஏற்ப, கொள்முதல் விலையை அதிகப்படுத்த வேண்டும்; ஆண்டுகள் குறைவாக இருப்பதற்கு ஏற்ப, கொள்முதல் விலையைக் குறைக்க வேண்டும். ஏனெனில், அவன் உனக்கு விற்பது அறுவடைகளின் எண்ணிக்கையைத்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவன் உனக்கு விற்பது விளைச்சல்களின் எண்ணிக்கையைத்தான்.” எபிரேயச் சொல் ‘பயிர்கள்,’ ‘விளைச்சல்,’ அல்லது ‘அறுவடைகள்’ என்று மொழிபெயர்க்கப்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְפִי
  choice: அதற்கேற்ப
  rationale: இந்த எபிரேய மரபுத்தொடர் எண்ணிக்கைக்கு ஏற்ற விகிதாசாரத் தொடர்பைக் குறிக்கிறது; நவீன தமிழில் ‘அதற்கேற்ப’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: רֹב הַשָּׁנִים / מְעֹט הַשָּׁנִים
  choice: ஆண்டுகள் அதிகமாக இருந்தால் / ஆண்டுகள் குறைவாக இருந்தால்
  rationale: யூபிலிவரை மீதமுள்ள ஆண்டுகளின் ஒப்பீட்டு அதிகம்–குறைவைத் தெளிவாகவும் இணையான வாக்கிய அமைப்பிலும் வெளிப்படுத்துகிறது.
- source_word: תַּרְבֶּה / תַּמְעִיט
  choice: உயர்த்த வேண்டும் / குறைக்க வேண்டும்
  rationale: விலையை அதிகரித்தல் அல்லது குறைத்தல் என்ற சட்டரீதியான அறிவுறுத்தலை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: מִקְנָתוֹ
  choice: அதன் கொள்முதல் விலை
  rationale: சொல் ‘கொள்முதல்,’ ‘வாங்கப்பட்ட பொருள்,’ அல்லது ‘கொள்முதல் விலை’ எனப் பொருள்படலாம்; ஆண்டுகள் மற்றும் விளைச்சல்களின் எண்ணிக்கையால் மதிப்பு கணிக்கப்படும் இச்சூழலில் ‘கொள்முதல் விலை’ பொருத்தமானது.
- source_word: מִסְפַּר תְּבוּאֹת
  choice: குறிப்பிட்ட எண்ணிக்கையிலான அறுவடைகள்
  rationale: תְּבוּאוֹת என்பது விளைச்சல்கள், பயிர்கள் அல்லது அறுவடைகள் எனக் குறிக்கலாம். நிலத்தின் எதிர்கால உற்பத்திக் காலங்களே விற்பனையின் பொருள் என்பதை ‘அறுவடைகள்’ தெளிவாகக் காட்டுகிறது.
- source_word: הוּא מֹכֵר לָךְ
  choice: அவன் உனக்கு விற்பது
  rationale: ஆண்பால் ஒருமை வடிவத்தைப் பாதுகாத்து, பரிவர்த்தனையின் உண்மையான பொருளை விளக்கும் இயல்பான தமிழ் அமைப்பாக வழங்குகிறது.
