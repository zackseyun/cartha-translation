source:
  edition: WLC
  text: כִּֽי עֲבָדַ֣/י הֵ֔ם אֲשֶׁר הוֹצֵ֥אתִי אֹתָ֖/ם מֵ/אֶ֣רֶץ מִצְרָ֑יִם לֹ֥א יִמָּכְר֖וּ מִמְכֶּ֥רֶת עָֽבֶד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/042.yaml
  text: For they are my servants[a], whom I brought out from the land of Egypt[b]; they shall not be sold as servants are sold.
translation:
  language: ta
  text: ஏனெனில், எகிப்து நாட்டிலிருந்து நான் வெளியே கொண்டுவந்த அவர்கள் என் அடிமைகள்[a]; அடிமையை விற்பதுபோல் அவர்களை விற்கக் கூடாது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘என் பணியாளர்கள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் பணி செய்வதையும் அடிமை நிலையையும் குறிக்கக்கூடும்; இங்கே தேவனுடைய உரிமையும், மனிதர்களால் அவர்களை அடிமைச் சொத்தாக விற்கக் கூடாது என்பதும் வலியுறுத்தப்படுவதால், ‘அடிமைகள்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்குச் சொல்: ‘அடிமையின் விற்பனையாக அவர்கள் விற்கப்படக் கூடாது’; அதாவது, சாதாரண அடிமை விற்பனையில் விற்பதுபோல் அவர்களை விற்கக் கூடாது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கட்டளைக்கான காரணத்தை அறிமுகப்படுத்தும் எபிரெய இணைப்புச்சொல்லின் விளக்கப் பொருளைப் பாதுகாக்கிறது.
- source_word: עֲבָדַי
  choice: என் அடிமைகள்
  rationale: முதலாம் நபர் ஒருமை உடைமை விகுதியுடன் வரும் עֶבֶד. இச்சூழலில் இஸ்ரவேலர் யெகோவாவுக்குச் சொந்தமானவர்கள் என்பதும், அவர்களைச் சாதாரண அடிமைச் சொத்தாக நடத்தக் கூடாது என்பதும் மையமாக இருப்பதால், மென்மையாக்காமல் ‘அடிமைகள்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: הֵם
  choice: அவர்கள்
  rationale: வலியுறுத்தப்பட்ட பன்மைச் சுட்டுப்பெயரை இயல்பான தமிழில் பாதுகாக்கிறது; ‘என் அடிமைகள்’ என்ற பயனிலை இருப்புப் பொருளைத் தெளிவாக்குகிறது.
- source_word: אֲשֶׁר הוֹצֵאתִי אֹתָם
  choice: நான் வெளியே கொண்டுவந்த அவர்கள்
  rationale: உறவுநிலைத் தொடரையும், தேவனே அவர்களை வெளியே கொண்டுவந்தார் என்ற முதலாம் நபர் செயற்பாட்டையும் தமிழில் இயல்பாக இணைக்கிறது.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: எகிப்து நாட்டிலிருந்து
  rationale: புவியியல் சொற்றொடரின் நேரடியான, இயல்பான தமிழ் வடிவம்.
- source_word: לֹא יִמָּכְרוּ
  choice: அவர்களை விற்கக் கூடாது
  rationale: சட்டச் சூழலில் உள்ள எதிர்மறை நிபால் வினையின் தடையுத்தரவை இயல்பான தமிழில் வெளிப்படுத்துகிறது. எபிரெயத்தில் செயப்பாட்டு வடிவம் இருந்தாலும், தமிழில் செயப்படுபொருளை முன்னிறுத்தும் இவ்வடிவம் அதே தடையைத் தெளிவாகக் கூறுகிறது.
- source_word: מִמְכֶּרֶת עָבֶד
  choice: அடிமைகளை விற்கும் முறையில்
  rationale: சாதாரண அடிமை விற்பனைக்குரிய முறை அல்லது வகையைச் சுட்டும் எபிரெயச் சொற்றொடரின் பொருளைப் பாதுகாக்கிறது.
theological_decisions:
- issue: עֶבֶד / עֲבָדַי என்பதன் மொழிபெயர்ப்பு—தேவனுடைய உரிமையும் விடுதலையும் குறிக்கும் சூழல்
  choice: அடிமைகள்
  alternative: பணியாளர்கள் / ஊழியர்கள்
  rationale: எகிப்திலிருந்து விடுவிக்கப்பட்ட இஸ்ரவேலர் தேவனுக்குச் சொந்தமானவர்கள் என்பதே இத்தடையின் அடிப்படை. பிணைப்பும் உரிமையும் இங்கு முக்கியமானதால், ‘பணியாளர்கள்’ அல்லது ‘ஊழியர்கள்’ என்று மென்மையாக்காமல் ‘அடிமைகள்’ என வழங்குவது பண்டைய சமூக-சட்டப் பொருளையும் வசனத்தின் இறுக்கத்தையும் காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும், சட்டக் கட்டளைக்குரிய கண்ணியமான உறுதியுடனும் வடிவமைக்கப்பட்டுள்ளது. ‘அடிமைகள்’ என்பது கடினமான சொல்லாக இருந்தாலும், மூலத்தின் சமூக-சட்ட வலிமையை மறைக்காமல் வைத்திருக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
