revisions:
- from: ஆனால் ஏழாம் ஆண்டில் நிலத்திற்கு முழுமையான ஓய்வின் ஓய்வுநாள்[a] இருக்க வேண்டும்; அது யாவேக்குரிய ஓய்வுநாள். உங்கள் வயலில் விதைக்கக் கூடாது; உங்கள் திராட்சைத்தோட்டத்தைக் கிளைநறுக்கவும் கூடாது.
  to: ஆனால், ஏழாம் ஆண்டில் நிலத்திற்கு முழுமையான ஓய்வுக் காலம் இருக்க வேண்டும்; அது யாவேக்குரிய ஓய்வுக் காலம். உங்கள் வயலில் விதைக்கக் கூடாது; உங்கள் திராட்சைத்தோட்டத்தைக் கிளைநறுக்கவும் கூடாது.
