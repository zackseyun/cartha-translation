source:
  edition: WLC
  text: וּ/בַ/שָּׁנָ֣ה הַ/שְּׁבִיעִ֗ת שַׁבַּ֤ת שַׁבָּתוֹן֙ יִהְיֶ֣ה לָ/אָ֔רֶץ שַׁבָּ֖ת לַ/יהוָ֑ה שָֽׂדְ/ךָ֙ לֹ֣א תִזְרָ֔ע וְ/כַרְמְ/ךָ֖ לֹ֥א תִזְמֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/004.yaml
  text: But in the seventh year there shall be a sabbath of complete rest for the land[a], a sabbath to Yahweh. You shall not sow your field, and you shall not prune your vineyard.
translation:
  language: ta
  text: ஆனால், ஏழாம் ஆண்டில் நிலத்திற்கு முழுமையான ஓய்வுக் காலம் இருக்க வேண்டும்; அது யாவேக்குரிய ஓய்வுக் காலம். உங்கள் வயலில் விதைக்கக் கூடாது; உங்கள் திராட்சைத்தோட்டத்தைக் கிளைநறுக்கவும் கூடாது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבַשָּׁנָה הַשְּׁבִיעִת
  choice: ஆனால் ஏழாம் ஆண்டில்
  rationale: முந்தைய வசனத்தில் அனுமதிக்கப்பட்ட ஆறு ஆண்டு உழவுக்கும் ஏழாம் ஆண்டின் தடைக்கும் உள்ள மாறுபாட்டை ו இங்கு காட்டுவதால், இயல்பான தமிழில் ‘ஆனால்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: שַׁבַּת שַׁבָּתוֹן
  choice: முழுமையான ஓய்வின் ஓய்வுநாள்
  rationale: இரு தொடர்புடைய எபிரெயச் சொற்களும் ஓய்வை வலியுறுத்துகின்றன. ‘ஓய்வுநாள்’ என்ற சப்தக் கருத்தையும், முற்றான செயல்நிறுத்தத்தின் தீவிரத்தையும் இந்தச் சொற்றொடர் தக்கவைக்கிறது.
- source_word: יִהְיֶה לָאָרֶץ
  choice: நிலத்திற்கு ... இருக்க வேண்டும்
  rationale: ஓய்வு நிலத்திற்குரியது என்ற எபிரெய வாக்கிய அமைப்பைத் தமிழில் தெளிவாகப் பாதுகாக்கிறது.
- source_word: שַׁבָּת לַיהוָה
  choice: யாவேக்குரிய ஓய்வுநாள்
  rationale: ל என்பதன் அர்ப்பணிப்பு அல்லது உரிமை சார்ந்த நுணுக்கத்தை ‘க்குரிய’ வெளிப்படுத்துகிறது; יהוה உடன்படிக்கைப் பெயராக ‘யாவே’ என்று ஒலிபெயர்க்கப்படுகிறது.
- source_word: שָׂדְךָ לֹא תִזְרָע
  choice: உங்கள் வயலில் விதைக்கக் கூடாது
  rationale: இரண்டாம் நபர் ஒருமையை நவீன மரியாதை/பொதுப்பயன் தமிழில் ‘உங்கள்’ என்றும், சட்டத் தடையை இயல்பாக ‘கூடாது’ என்றும் வழங்குகிறது.
- source_word: וְכַרְמְךָ לֹא תִזְמֹר
  choice: உங்கள் திராட்சைத்தோட்டத்தைக் கிளைநறுக்கவும் கூடாது
  rationale: כרם என்பதற்கு ‘திராட்சைத்தோட்டம்’; திராட்சை வளர்ப்புச் சூழலில் זמר என்பதற்கு துல்லியமான செயற்பாடாக ‘கிளைநறுக்கு’ தேர்ந்தெடுக்கப்பட்டது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் உடன்படிக்கைப் பெயர் நேரடியாக இருப்பதால், பொதுப்பட்டப் பெயராக மாற்றாமல் தமிழில் இயல்பான ஒலிபெயர்ப்பான ‘யாவே’ பயன்படுத்தப்பட்டது.
- issue: שַׁבַּת לַיהוָה என்பதன் தொடர்பு
  choice: யாவேக்குரிய ஓய்வுநாள்
  alternative: யாவேக்காகக் கடைப்பிடிக்கும் ஓய்வுநாள்
  rationale: ל அர்ப்பணிப்பு, நோக்கம் அல்லது உரிமையைக் குறிக்கக்கூடும். முதன்மை உரை சுருக்கமான மூல அமைப்பையும் அதன் நுண்ணிய திறந்த தன்மையையும் தக்கவைக்கிறது.
translation_notes:
  register: நவீன செந்தமிழுக்கு நெருக்கமான, பொதுவாசகர்கள் புரிந்துகொள்ளக்கூடிய கண்ணியமான சட்டநடை பயன்படுத்தப்பட்டுள்ளது. ‘முழுமையான ஓய்வின் ஓய்வுநாள்’ என்பது தமிழில் சற்றே செறிவானதாக இருந்தாலும், மூலத்தின் வலியுறுத்தலையும் சப்தக் கருத்தையும் திட்டமிட்டு பாதுகாக்கிறது.
