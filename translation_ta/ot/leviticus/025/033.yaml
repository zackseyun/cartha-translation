base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/033.yaml
  text: And if one of the Levites redeems it[a], then the sale of the house in the city of his possession shall be released in the Jubilee[b]; for the houses of the cities of the Levites are their possession among the sons of Israel.
translation:
  language: ta
  text: லேவியர்களில் ஒருவர் அதை மீட்டுக்கொண்டால்[a], அவனுடைய உடைமையாகிய நகரத்தில் விற்கப்பட்ட வீடு யூபிலி ஆண்டில் விடுவிக்கப்படும். ஏனெனில், லேவியர்களின் நகரங்களிலுள்ள வீடுகள் இஸ்ரவேலின் மக்களிடையே அவர்களுடைய உடைமையாகும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: தொடக்கத் தொடரை ‘லேவியர்களிடமிருந்து ஒருவர் அதை மீட்டுக்கொண்டால்’ என்றும் இலக்கணப்படி புரிந்துகொள்ளலாம். ‘விடுவிக்கப்படும்’ என்பதற்கான எபிரெயச் சொல் நேரடியாக ‘வெளியேறும்’ என்பதாகும்; யூபிலி ஆண்டில் விற்கப்பட்ட சொத்து வாங்கியவரின் உரிமையிலிருந்து நீங்குவதைக் குறிக்கிறது.
    reason: syntactic_and_lexical_alternative
  - marker: b
    text: எபிரெயத்தில் ‘இஸ்ரவேலின் மகன்கள்’; இது இஸ்ரவேல் மக்களைக் குறிக்கும் வழக்கமான உடன்படிக்கைத் தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲשֶׁר יִגְאַל מִן הַלְוִיִּם
  choice: லேவியர்களில் ஒருவர் அதை மீட்டுக்கொண்டாலும்
  rationale: מִן הַלְוִיִּם என்பதை இங்கு பகுதிப்பொருளில், ‘லேவியர்களில் ஒருவர்’ எனக் கொள்வது சட்டச் சூழலுக்கும் முந்தைய வசனத்துக்கும் பொருந்துகிறது. יִגְאַל என்பதன் சொத்து மீட்பு சார்ந்த தொழில்நுட்பப் பொருளை ‘மீட்டுக்கொண்டாலும்’ காக்கிறது.
- source_word: וְיָצָא
  choice: அவன் கைக்குத் திரும்பிவிடும்
  rationale: இதன் நேர்ப்பொருள் ‘வெளியேறும்’; யூபிலிச் சட்டத்தில் வாங்கியவரின் கையிலிருந்து வெளியேறி முந்தைய உரிமையாளரிடம் திரும்புவதே குறிப்பு. இயல்பான தமிழில் சட்ட விளைவைத் தெளிவாக்குகிறது; நேர்ப்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: מִמְכַּר בַּיִת וְעִיר אֲחֻזָּתוֹ
  choice: அவனுடைய உரிமைப்பட்ட நகரத்தில் விற்கப்பட்ட வீடு
  rationale: சுருக்கமான எபிரெயத் தொடரைச் சூழலுக்கேற்ப வீட்டையும் அது அமைந்த லேவிய நகரத்தையும் இணைத்து வழங்குகிறது. מִמְכָּר என்பதைக் கச்சிதமாக ‘விற்பனை’ என்று மட்டும் கூறாமல், விற்பனை செய்யப்பட்ட பொருளான வீட்டைக் குறிக்கிறது.
- source_word: בַּיֹּבֵל
  choice: யூபிலி ஆண்டில்
  rationale: இது சொத்துகள் திரும்பும் குறிப்பிட்ட ஐம்பதாம் ஆண்டு அமைப்பைக் குறிக்கிறது; ‘ஆண்டில்’ என்பது தமிழில் குறிப்பைத் தெளிவாக்குகிறது.
- source_word: בָּתֵּי עָרֵי הַלְוִיִּם
  choice: லேவியர்களுடைய நகரங்களிலுள்ள வீடுகள்
  rationale: எபிரெயக் கட்டமைப்பை இயல்பான தமிழில் இடவுறவாக வெளிப்படுத்துகிறது.
- source_word: אֲחֻזָּתָם
  choice: அவர்களுக்குரிய உடைமை
  rationale: நிலையான, சட்டப்பூர்வமான சொத்துரிமையைக் குறிக்கும் அֲחֻזָּה என்பதன் சட்ட நுணுக்கத்தை ‘உடைமை’ காக்கிறது.
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மக்களிடையே
  rationale: בְּנֵי יִשְׂרָאֵל என்பது முழு உடன்படிக்கை மக்களையும் குறிக்கும் மரபுத்தொடர். நவீனத் தமிழில் ‘இஸ்ரவேலின் மக்கள்’ அதன் கூட்டுப்பொருளை இயல்பாகவும் துல்லியமாகவும் தருகிறது.
theological_decisions:
- issue: מִן הַלְוִיִּם தொடரின் தொடர்பு
  choice: லேவியர்களில் ஒருவர் மீட்டுக்கொள்வது
  alternative: லேவியர்களிடமிருந்து ஒருவர் மீட்டுக்கொள்வது
  rationale: מִן என்பதை பகுதிப்பொருளாகக் கொள்வது மசோரா உரையின் இயல்பான சாத்திய வாசிப்பாகவும் இவ்விதியின் லேவியர் சார்ந்த சூழலுக்கு ஏற்றதாகவும் உள்ளது. வேறு இலக்கண வாசிப்பு சாத்தியமானதால் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- issue: யூபிலியில் வீடு ‘வெளியேறுதல்’
  choice: முந்தைய உரிமையாளரின் கைக்குத் திரும்புதல்
  alternative: விடுவிக்கப்படுதல் / வெளியேறுதல்
  rationale: இது ஆன்மீக விடுதலை அல்ல; வாங்கியவரின் கட்டுப்பாட்டிலிருந்து சொத்து வெளியேறி லேவியரின் நிலையான உடைமைக்குத் திரும்பும் சட்ட விளைவு.
- issue: בְּנֵי יִשְׂרָאֵל என்பதன் மொழிபெயர்ப்பு
  choice: இஸ்ரவேலின் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: இத்தொடர் இங்கு ஆண் சந்ததியினரை மட்டும் அல்லாமல் இஸ்ரவேல் சமூகத்தையே குறிக்கும் நிலையான கூட்டுப்பெயர். ‘மக்கள்’ நவீனத் தமிழில் அந்தச் சூழற்பொருளைத் தெளிவாக வழங்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்ட உரைக்கேற்ற கண்ணியமான ஆனால் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘மீட்டுக்கொள்’, ‘உரிமைப்பட்ட’, ‘உடைமை’ ஆகிய சொற்கள் நிலச் சொத்து மீட்பு மற்றும் நிலையான உரிமை என்ற சட்டத் தன்மையைப் பேணுகின்றன.
