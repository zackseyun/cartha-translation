  alternative: சொல்லுக்கு நெருக்கமாக ‘நிலத்தின் ஓய்வு’
  rationale: மூலத்தின் ‘ஓய்வு’ கருத்தை ஓய்வாண்டு என்ற வடிவில் பேணியபடியே, உணவாகக் கிடைப்பது ஓய்வு என்ற நிகழ்வு அல்ல, அந்த ஆண்டின் விளைச்சல் என்பதைத் தெளிவாக்குகிறது; மாற்று நேரடி பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
