  rationale: எபிரெயச் சொற்றொடர் நேரடியாக ‘நிலத்தின் ஓய்வு’ எனினும், இங்கு ஓய்வாண்டில் நிலம் தானாகத் தரும் விளைச்சலே உணவாகப் பயன்படுவதைச் சூழல் காட்டுகிறது. ‘ஓய்வாண்டு’ நிறுவனத் தொடர்பையும் ‘விளைச்சல்’ இவ்வசனத்தின் நடைமுறைப் பொருளையும் வெளிப்படுத்துகின்றன.
