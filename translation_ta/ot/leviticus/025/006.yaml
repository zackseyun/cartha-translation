  yaml_path: translation/ot/leviticus/025/006.yaml
  text: The Sabbath produce of the land shall be for you for food—for you[a], for your male servant, for your female servant, for your hired worker[b], and for your resident foreigner who dwells with you.
translation:
  language: ta
  text: நிலத்தின் ஓய்வாண்டு விளைச்சல்[a] உங்களுக்கு உணவாக இருக்கும்—உனக்கும், உன் ஆண் அடிமைக்கும், உன் பெண் அடிமைக்கும், உன் கூலித் தொழிலாளிக்கும், உன்னுடன் வாழும் அந்நியக் குடியிருப்பாளருக்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் நேரடியாக, ‘நிலத்தின் ஓய்வு.’ இது நிலம் ஓய்வுபெறும் ஆண்டில் அது தரும் விளைச்சலை இங்கு குறிக்கிறது.
    reason: lexical_alternative
