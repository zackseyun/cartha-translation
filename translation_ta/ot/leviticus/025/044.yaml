base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/044.yaml
  text: As for your male servant and your female servant who may belong to you[a], from the nations that are around you[b], from them you may buy a male servant and a female servant.
translation:
  language: ta
  text: உங்களுக்குச் சொந்தமாக இருக்கக்கூடிய ஆண் அடிமைகளையும் பெண் அடிமைகளையும் உங்களைச் சுற்றியுள்ள மக்களினங்களிடமிருந்து நீங்கள் வாங்கலாம்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மூலத்தில் ‘ஆண் அடிமை’, ‘பெண் அடிமை’ ஆகியவை ஒருமையில் கூறப்பட்டாலும், இரு வகையினரையும் பொதுவாகக் குறிக்கின்றன. ‘அடிமை’ என்பதற்கு ‘பணியாள்’ என்றும் மொழிபெயர்க்கலாம்; ஆனால் இங்கு வாங்கப்படுவதும் உடைமையாக இருப்பதும் வெளிப்படையாக உள்ளதால் ‘அடிமை’ என்று தரப்பட்டுள்ளது. ‘மக்களினங்கள்’ என்பது இஸ்ரவேலைச் சுற்றியிருந்த இஸ்ரவேலர் அல்லாத மக்களைக் குறிக்கிறது; ‘மக்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדְּךָ / עֶבֶד
  choice: ஆண் அடிமை
  rationale: עֶבֶד என்பது பணியாளர் முதல் அடிமை வரை பல நிலைகளைக் குறிக்கக்கூடும். ஆனால் இங்கு விலைக்கு வாங்குவதும் ஒருவருக்குச் சொந்தமாக இருப்பதும் வெளிப்படையாகக் கூறப்படுவதால், ‘அடிமை’ என்பதே சட்டச் சூழலைத் தெளிவாகக் காட்டுகிறது; אָמָה என்பதிலிருந்து வேறுபடுத்த ‘ஆண்’ சேர்க்கப்பட்டுள்ளது.
- source_word: אֲמָתְךָ / אָמָה
  choice: பெண் அடிமை
  rationale: இந்தச் சூழலில் אָמָה, ஆண் அடிமையைக் குறிக்கும் עֶבֶד என்பதற்கு இணையான பெண்பால் சொல்லாக உள்ளது. ‘பெண் அடிமை’ என்பது பாலின வேறுபாட்டைத் தெளிவாகவும் இன்றைய தமிழில் இயல்பாகவும் காட்டுகிறது.
- source_word: אֲשֶׁר יִהְיוּ לָךְ
  choice: உங்களுக்குச் சொந்தமாக இருக்கக்கூடிய
  rationale: இச்சொற்றொடர் அந்த அடிமைகள் முகவரியிடப்பட்டவர்களின் உடைமையாக வருவதை விவரிக்கிறது. ‘இருக்கக்கூடிய’ என்பது எதிர்காலத்தைக் கட்டாயமாக்காமல் சட்டரீதியான சாத்தியத்தையும் உடைமைப் பொருளையும் தருகிறது.
- source_word: מֵאֵת הַגּוֹיִם אֲשֶׁר סְבִיבֹתֵיכֶם
  choice: உங்களைச் சுற்றியுள்ள பிற இனத்தாரிடமிருந்து
  rationale: גּוֹיִם இங்கு இஸ்ரவேலைச் சுற்றியிருந்த இஸ்ரவேலர் அல்லாத மக்கள் குழுக்களைக் குறிக்கிறது. தமிழில் ‘பிற இனத்தார்’ என்பது அந்த மனிதக் குழுக்களையும் அவர்களிடமிருந்து வாங்குதல் என்ற தொடரையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: תִּקְנוּ
  choice: நீங்கள் வாங்கிக்கொள்ளலாம்
  rationale: קנה என்பதன் அடிப்படைப் பொருள் வாங்குதல் அல்லது பெற்றுக்கொள்ளுதல். இச்சட்டச் சூழல் வாங்கும்படி கட்டளையிடாமல் அதற்கு அனுமதி அளிப்பதால், ‘வாங்கிக்கொள்ளலாம்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: עֶבֶד וְאָמָה
  choice: ஆண் அடிமைகளையும் பெண் அடிமைகளையும்
  rationale: எபிரெயச் சொற்கள் ஆண், பெண் எனத் தனித்தனியாகக் குறிப்பிடுகின்றன. ஒருமை வடிவிலுள்ள இந்த இணை பொதுவகையைக் குறிப்பதால், இயல்பான தமிழில் பன்மையாகத் தரப்பட்டுள்ளது.
theological_decisions:
- issue: அடிமைத்தனத்தைச் சுட்டும் சட்டச் சொல்லாக்கம்
  choice: ‘பணியாள்’ என்பதற்குப் பதிலாக ‘அடிமை’
  alternative: பணியாள்; வேலைக்காரன்/வேலைக்காரி
  rationale: இவ்வசனத்தில் மனிதர்கள் விலைக்கு வாங்கப்பட்டு ஒருவருக்குச் சொந்தமாக இருப்பது மையமான சட்டக் கருத்து. மென்மையாக்காமல் அந்த நிலையைக் காட்ட ‘அடிமை’ பயன்படுத்தப்பட்டுள்ளது; இது வசனம் கூறும் நடைமுறையை ஆதரிப்பதாகவோ கண்டிப்பதாகவோ கூடுதல் தீர்ப்பை மொழிபெயர்ப்பில் புகுத்தாது.
- issue: תִּקְנוּ என்பதன் சட்டரீதியான வலிமை
  choice: அனுமதியாக ‘வாங்கிக்கொள்ளலாம்’
  alternative: ‘வாங்கிக்கொள்ள வேண்டும்’; ‘வாங்குவீர்கள்’
  rationale: சுற்றியுள்ள சட்டப்பகுதியில் இது வாங்குவதற்கான அனுமதியையும் அதன் மூலத்தையும் வரையறுக்கிறது; வாங்கும்படி கட்டளையிடுவதாக எடுத்துக்கொள்ள வேண்டியதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், சட்ட உரைக்கேற்ற நேரடியானவும் கண்ணியமானவும் சொல்லாக்கம் பயன்படுத்தப்பட்டுள்ளது. எபிரெயத்தில் ஒருமை மற்றும் பன்மை முகவரிகள் மாறிமாறி வருவது தமிழில் இயல்பான பொதுப் பன்மையாக ஒருமைப்படுத்தப்பட்டுள்ளது; ஆண்–பெண் வேறுபாடும் வாங்குதல் மற்றும் உடைமைக்குரிய கடினமான பொருளும் மறைக்கப்படவில்லை.
