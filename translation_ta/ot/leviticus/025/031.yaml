  text: וּ/בָתֵּ֣י הַ/חֲצֵרִ֗ים אֲשֶׁ֨ר אֵין לָ/הֶ֤ם חֹמָה֙ סָבִ֔יב עַל שְׂדֵ֥ה הָ/אָ֖רֶץ יֵחָשֵׁ֑ב גְּאֻלָּה֙ תִּהְיֶה לּ֔/וֹ וּ/בַ/יֹּבֵ֖ל יֵצֵֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/031.yaml
  text: But the houses of the villages that have no wall around them shall be regarded as the fields of the land[a]; redemption shall be available for them[b], and in the Jubilee they shall go out.
translation:
  language: ta
  text: ஆனால், சுற்றிலும் மதில் இல்லாத கிராமங்களிலுள்ள வீடுகள் நாட்டின் வயல்நிலம்போல் கணக்கிடப்பட வேண்டும்[a]. அவற்றை மீட்டுக்கொள்ளும் உரிமை உண்டு; யூபிலி ஆண்டில் அவை விடுவிக்கப்படும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'நேர்ச்சொல்: “நாட்டின் வயலாகக் கணக்கிடப்படும்.” அதாவது, இத்தகைய கிராம வீடுகள் மதிலுள்ள நகர வீடுகளைப் போல அல்லாமல், ஊரக நிலத்தைப் போலச் சட்டப்படி நடத்தப்படும்.'
    reason: lexical_alternative
  - marker: b
    text: 'நேர்ச்சொல்: “யூபிலியில் அது வெளியேறும்.” அதாவது, யூபிலி ஆண்டில் அந்தச் சொத்து விடுவிக்கப்பட்டு அதன் முதன்மை உரிமையாளரிடம் திரும்பும்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בָתֵּי הַ/חֲצֵרִים
  choice: கிராமங்களிலுள்ள வீடுகள்
  rationale: חֲצֵרִים என்பது இச்சூழலில் மதிலற்ற ஊரகக் கிராமங்கள் அல்லது குடியிருப்புகளைக் குறிக்கிறது; அடுத்த சொற்றொடர் மதில் இல்லாமையைத் தெளிவாகக் கூறுவதால், இயல்பான தமிழில் ‘கிராமங்கள்’ என வழங்கப்பட்டது.
- source_word: אֲשֶׁר אֵין לָהֶם חֹמָה סָבִיב
  choice: சுற்றிலும் மதில் இல்லாத
  rationale: சுற்றிலும் சூழ்ந்த மதில் இல்லாத நிலையைச் சுருக்கமாகவும் நேரடியாகவும் பிரதிபலிக்கிறது.
- source_word: עַל שְׂדֵה הָאָרֶץ יֵחָשֵׁב
  choice: நாட்டின் வயல்வெளியைப் போலக் கணக்கிடப்பட வேண்டும்
  rationale: எபிரெயச் சொற்றொடரின் ‘நாட்டின் வயலாக/வயலோடு கணக்கிடப்படும்’ என்ற சட்ட வகைப்பாட்டைத் தக்கவைக்கிறது; மதிலுள்ள நகர வீடுகளுக்கு மாறாக இவை ஊரக நிலத்தைப் போல நடத்தப்படுகின்றன.
- source_word: גְּאֻלָּה תִּהְיֶה לּוֹ
  choice: அவற்றை மீட்டுக்கொள்ளும் உரிமை உண்டு
  rationale: சொத்து மீட்கத்தக்கது என்ற சட்டப் பொருளை இயல்பான நவீன தமிழில் தெரிவிக்கிறது. எபிரெயத்தில் ஒருமை பின்னொட்டு இருந்தாலும், தமிழில் முன்னுள்ள பன்மை ‘வீடுகள்’ என்பதற்கு ஏற்ப ‘அவற்றை’ பயன்படுத்தப்பட்டது.
- source_word: וּ/בַ/יֹּבֵל יֵצֵא
  choice: யூபிலி ஆண்டில் அவை விடுவிக்கப்படும்
  rationale: יֵצֵא என்பதன் சொற்பொருள் ‘வெளியேறும்’; இச்சட்டச் சூழலில் சொத்து யூபிலியில் உரிமையாளரிடம் திரும்பும் அல்லது கட்டுப்பாட்டிலிருந்து விடுவிக்கப்படும் பொருளை ‘விடுவிக்கப்படும்’ இயல்பாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: யூபிலியில் ‘வெளியேறுதல்’ என்பதன் சட்டப் பொருள்
  choice: அவை விடுவிக்கப்படும்
  alternative: அவை வெளியேறும் / அவை திரும்பிவிடும்
  rationale: எபிரெய வினையின் அடிப்படை உருவகத்தை வார்த்தைக்கு வார்த்தை மொழிபெயர்ப்பது தமிழில் தெளிவற்றதாக இருக்கும். சூழல் சொத்தின் யூபிலி விடுதலை அல்லது மீளளிப்பைக் குறிக்கிறது; எந்த மேலதிக சமயக் கோட்பாட்டையும் சேர்க்காமல் ‘விடுவிக்கப்படும்’ என வழங்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்ட உரையின் கண்ணியமான தொனி பேணப்பட்டுள்ளது. ‘மீட்பு’ என்ற தனிப்பெயர்ச்சியை விட ‘மீட்டுக்கொள்ளும் உரிமை’ என்பது பொதுவாசகருக்கு சட்டப் பொருளைத் தெளிவாக்குகிறது. ‘யூபிலி’ என்பது நூலின் தொழில்நுட்பச் சொல்லாகத் தக்கவைக்கப்பட்டுள்ளது.
