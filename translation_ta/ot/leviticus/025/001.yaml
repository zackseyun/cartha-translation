  yaml_path: translation/ot/leviticus/025/001.yaml
  text: And Yahweh spoke to Moses on Mount Sinai[a], saying,
translation:
  language: ta
  text: 'யாவே[a] சீனாய் மலையில் மோசேயிடம் இவ்வாறு பேசினார்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில்: יהוה (YHWH); இதை “யெகோவா” என்றும் ஒலிபெயர்க்கலாம்.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பேசினார்
  rationale: וַ־ தொடரும் நிகழ்வை அறிமுகப்படுத்துகிறது; דִּבֵּר என்பதன் ‘பேசு’ என்ற பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பட்டமாக மாற்றாமல், יהוה என்ற தனிப்பெயரின் பரவலான தமிழ் ஒலிபெயர்ப்பைப் பயன்படுத்துகிறது.
- source_word: אֶל־מֹשֶׁה
  choice: மோசேயிடம்
  rationale: பேச்சு யாரை நோக்கிச் சொல்லப்பட்டது என்பதை இயல்பான நவீன தமிழில் குறிக்கிறது.
- source_word: בְּהַר סִינַי
  choice: சீனாய் மலையில்
  rationale: בְּ־ இங்கு இடத்தைக் குறிக்கிறது; மலைப் பகுதியில் நிகழ்ந்த பேச்சை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לֵאמֹר
  choice: 'அவர் சொன்னதாவது:'
  rationale: அடுத்த வசனத்தில் வரும் நேரடிப் பேச்சை அறிமுகப்படுத்தும் எபிரெய வடிவத்தின் முன்னோக்கிய இணைப்பைத் தெளிவாகப் பேணுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: யெகோவா; ஆண்டவர்
  rationale: மூலத்தில் பட்டம் அல்ல, நான்கு எழுத்துகளைக் கொண்ட தனிப்பெயர் நேரடியாக உள்ளது. ஆகவே அதை ‘ஆண்டவர்’ என்ற பட்டமாக மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்க்கிறது; மாற்று ஒலிபெயர்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘அவர் சொன்னதாவது:’ என்பது அடுத்த வசனத்திலுள்ள இறைவாக்குடன் உள்ள தொடர்பை இயல்பாகக் காட்டுகிறது.
