  text: וְ/אִם לֹ֥א יִגָּאֵ֖ל בְּ/אֵ֑לֶּה וְ/יָצָא֙ בִּ/שְׁנַ֣ת הַ/יֹּבֵ֔ל ה֖וּא וּ/בָנָ֥י/ו עִמּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/054.yaml
  text: But if he is not redeemed by these means[a], then he and his sons with him shall go out in the year of Jubilee.
translation:
  language: ta
  text: ஆனால், இவற்றால்[a] அவன் மீட்கப்படாவிட்டால், அவனும், அவனுடன் அவனுடைய மகன்களும் யூபிலி ஆண்டில் வெளியேறுவார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இவற்றின் மூலம்’—முந்தைய வசனங்களில் விவரிக்கப்பட்ட மீட்பு ஏற்பாடுகளை இது குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: ஆனால், ... அவிட்டால்
  rationale: முந்தைய மீட்பு வாய்ப்புகளோடு தொடர்ச்சியையும் மென்மையான எதிர்மறைத் திருப்பத்தையும் காட்டும் நிபந்தனை அமைப்பு.
- source_word: יִגָּאֵל
  choice: மீட்கப்படாவிட்டால்
  rationale: גאל என்பதன் நிஃபால் வடிவம் இச்சட்டச் சூழலில் உறவினர் அல்லது கட்டணம் மூலம் ஒருவர் மீட்கப்படுவதைக் குறிக்கிறது; செயப்பாட்டு வடிவம் பாதுகாக்கப்படுகிறது.
- source_word: בְּאֵלֶּה
  choice: இவற்றால்
  rationale: முந்தைய வசனங்களில் சொல்லப்பட்ட மீட்பு ஏற்பாடுகளைச் சுட்டும் எபிரெயச் சுட்டுப்பெயரின் சுருக்கத்தையும் உண்மையான குறிப்புத் தெளிவின்மையையும் பாதுகாக்கிறது.
- source_word: וְיָצָא
  choice: விடுதலையாகிச் செல்வார்கள்
  rationale: சொல்லுக்குச் சொல் பொருள் ‘வெளியே செல்வான்’; அடிமைச் சேவைச் சூழலில் விடுதலையை இயல்பான தமிழில் வெளிப்படுத்துகிறது, அதேவேளை ‘செல்’ என்ற மூல உருவகத்தையும் வைத்திருக்கிறது.
- source_word: בִּשְׁנַת הַיֹּבֵל
  choice: யூபிலி ஆண்டில்
  rationale: லேவியராகமச் சட்டத்தில் יוֹבֵל என்பதற்கான அறியப்பட்ட பெயரை ஒலிபெயர்த்து, காலக் குறிப்பைத் தெளிவாக வழங்குகிறது.
- source_word: הוּא וּבָנָיו עִמּוֹ
  choice: அவனும் அவனோடு அவன் மகன்களும்
  rationale: தனி ஆண்பால் சுட்டுப்பெயரையும் בנים என்ற ஆண்பால் பன்மையான ‘மகன்கள்’ என்பதையும் விரிவுபடுத்தாமல் பாதுகாக்கிறது.
theological_decisions:
- issue: בָנָיו என்ற பாலினம் குறிக்கப்பட்ட குடும்பச் சொல்
  choice: மகன்கள்
  alternative: பிள்ளைகள்
  rationale: எபிரெய மூலத்தில் குறிப்பாக ஆண்பால் பன்மை உள்ளது; அதை பாலினப் பொதுமைப்படுத்தாமல் மொழிபெயர்க்கிறது.
- issue: יָצָא என்பதிலுள்ள வெளியே செல்லுதல் மற்றும் விடுதலை என்ற சட்டப் பொருள்
  choice: விடுதலையாகிச் செல்வார்கள்
  alternative: வெளியே செல்வார்கள்
  rationale: அடிமைச் சேவையிலிருந்து விடுபடுதல் என்ற சூழற்பொருளைத் தெளிவாக்கி, மூலத்தின் ‘செல்’ கூறையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சட்ட உரைக்கு ஏற்ற கண்ணியமான மற்றும் எளிதில் புரியும் நடை. எபிரெய நிபந்தனை அமைப்பும் பாலினம் குறிக்கப்பட்ட ‘மகன்கள்’ என்பதும் பாதுகாக்கப்பட்டுள்ளன; ‘விடுதலையாகிச் செல்வார்கள்’ என்பது மூல மொழி உருவகத்தையும் சூழற்பொருளையும் இணைக்கிறது.
