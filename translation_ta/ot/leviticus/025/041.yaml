base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/041.yaml
  text: Then he and his sons with him shall go out from you[b][a], and he shall return to his clan and return to the property of his fathers.
translation:
  language: ta
  text: அப்போது அவன் தன் மகன்களுடன் உன்னிடமிருந்து புறப்பட்டுச் செல்வான்; அவன் தன் குலத்தாரிடம்[a] திரும்புவான்; தன் தந்தையரின் பரம்பரைச் சொத்துக்குத்[b] திரும்புவான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தன் குடும்பத்தாரிடம்”; எபிரெயச் சொல் உடனடி குடும்பத்தையோ விரிவான குலம் அல்லது உறவுக் குழுவையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “தன் தந்தையரின் உடைமைக்கு” அல்லது “தன் மூதாதையர் வழிச் சொத்துக்கு.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָא
  choice: புறப்பட்டு
  rationale: சட்டச் சூழலில் தொடர்ச்சியாக நிகழவிருக்கும் செயலைக் குறிக்கிறது. அடிமைத்தனத்திலிருந்து விடுதலை என்பது சூழலில் உள்ள பொருள்; ஆனால் எபிரெயச் சொல்லின் நேரடியான ‘வெளியேறு/புறப்படு’ என்ற உருவகத்தை மொழிபெயர்ப்பு காக்கிறது.
- source_word: מֵעִמָּךְ
  choice: உன்னிடமிருந்து
  rationale: சொல்லுக்கு நெருக்கமாக ‘உன்னுடன் இருந்த இடத்திலிருந்து’ என்ற கருத்து உள்ளது. இயல்பான தமிழில் எஜமானின் வீட்டையும் பணியையும் விட்டு நீங்குவதை ‘உன்னிடமிருந்து’ தெளிவாகத் தெரிவிக்கிறது.
- source_word: הוּא וּבָנָיו עִמּוֹ
  choice: அவன் தன் மகன்களுடன்
  rationale: בָּנִים இங்கு ஆண்பால் பன்மையாக இருப்பதால் ‘மகன்கள்’ எனக் காக்கப்படுகிறது; ‘அவனுடன்’ என்பதை இயல்பான தமிழில் உடனிகழ்ச்சியைக் காட்டும் ‘தன் மகன்களுடன்’ என வழங்குகிறது.
- source_word: וְשָׁב ... יָשׁוּב
  choice: திரும்பி ... திரும்ப வேண்டும்
  rationale: שׁוב என்ற வினை இருமுறை வருவதைக் காத்து, குடும்ப உறவுக்கும் பரம்பரைச் சொத்துக்கும் மீட்கப்படுதல் என்ற வலியுறுத்தலை வெளிப்படுத்துகிறது.
- source_word: מִשְׁפַּחְתּוֹ
  choice: தன் குலத்தாரிடம்
  rationale: מִשְׁפָּחָה உடனடி குடும்பத்தைவிட விரிவான உறவுக் குழுவைக் குறிக்கக்கூடும். நிலவுடைமை மற்றும் உறவுமுறைச் சூழலில் ‘குலத்தார்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: אֲחֻזַּת אֲבֹתָיו
  choice: தன் தந்தையரின் பரம்பரைச் சொத்துக்கு
  rationale: אֲחֻזָּה என்பது நிலம் சார்ந்த மரபுரிமை உடைமையைக் குறிக்கிறது. ‘பரம்பரைச் சொத்து’ அதன் சட்ட-சமூகப் பொருளைத் தெளிவாக்குகிறது; ‘தந்தையரின்’ என்பது மூலத்தின் ஆண்பால் மரபுவழிச் சொல்லாட்சியைக் காக்கிறது.
theological_decisions:
- issue: ஆண்பால் உறவுமுறைச் சொல்லாட்சி
  choice: மகன்கள் ... தந்தையர்
  alternative: பிள்ளைகள் ... முன்னோர்
  rationale: எபிரெய மூலத்தில் வெளிப்படையான ஆண்பால் வடிவங்கள் உள்ளன. தந்தைவழி நில உரிமைச் சூழலுடன் தொடர்புடையதால் அவற்றைப் பாலினப் பொதுமைப்படுத்தாமல் காக்கிறது.
- issue: விடுதலையின் சமூக-சட்ட வலிமை
  choice: உன்னிடமிருந்து புறப்பட்டு
  alternative: உன் பணியிலிருந்து விடுதலையாகி
  rationale: யூபிலி ஆண்டில் கடன் பணிநிலையிலிருந்து மீட்கப்படுவது சூழலால் தெளிவாகிறது; எனினும் மூலத்தில் தொழில்நுட்பமான ‘விடுதலை செய்’ என்பதற்குப் பதில் ‘புறப்படு’ என்ற வினை உள்ளது. ஆகவே சட்ட விளைவைச் சொல்லுக்குள் கூடுதலாகப் புகுத்தாமல் மூல உருவகம் காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரநிலைத் தமிழில், சட்ட உரைக்கு ஏற்ற கண்ணியமான ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் நடை. மூலத்தில் இருமுறை வரும் ‘திரும்பு’ காக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறிகள் சம்பந்தப்பட்ட சொற்றொடர்களின் பின்னர் வருமாறு அமைக்கப்பட்டுள்ளன.
