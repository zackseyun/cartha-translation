  text: then he shall calculate the years since its sale and return the surplus to the man to whom he sold it, and he shall return to his property.
translation:
  language: ta
  text: அவன் அது விற்கப்பட்டதிலிருந்து கடந்த ஆண்டுகளைக் கணக்கிட வேண்டும்; மீதித் தொகையை[a] அவன் அதை விற்றுக் கொடுத்த மனிதனுக்குத் திருப்பிக் கொடுக்க வேண்டும்; பின்னர் தன் நிலப்பங்குக்குத்[b] திரும்ப வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘எஞ்சிய தொகை’ அல்லது ‘மிகுதித் தொகை’ என்றும் மொழிபெயர்க்கலாம். பயன்படுத்தப்படாமல் மீதியுள்ள ஆண்டுகளின் மதிப்பைக் கணக்கிட்ட பின் எஞ்சும் தொகையை எபிரெயச் சொல் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘நிலப்பங்கு’ என்பது அவனுக்குரிய நிலக்கைப்பற்றைக் குறிக்கிறது; பெரும்பாலும் அது இஸ்ரவேலில் அவனுடைய பரம்பரை நிலமாக இருந்தது.
    reason: cultural_note
lexical_decisions:
- source_word: וְחִשַּׁב
  choice: கணக்கிட்டு
  rationale: חשׁב இங்கு மீட்புத் தொகையை நிர்ணயிப்பதற்கான கணக்கிடுதலைக் குறிக்கிறது; தொடர்ச்சியான சட்ட நடைமுறையை இயல்பான தமிழில் வினையெச்சம் வெளிப்படுத்துகிறது.
- source_word: שְׁנֵי מִמְכָּרוֹ
  choice: அது விற்கப்பட்டதிலிருந்து கடந்த ஆண்டுகள்
  rationale: சொல்லுக்கு சொல் வடிவம் ‘அதன் விற்பனையின் ஆண்டுகள்’; சூழலில், விற்பனைக்குப் பின் கடந்த ஆண்டுகளே மீட்புத் தொகையைக் கணக்கிடப் பயன்படுகின்றன.
- source_word: וְהֵשִׁיב
  choice: திருப்பிக் கொடுக்க வேண்டும்
  rationale: שוב என்பதன் ஹிஃபில் வடிவம் இங்கு மீதித் தொகையை வாங்கியவரிடம் திருப்பிச் செலுத்துவதைக் குறிக்கிறது.
- source_word: הָעֹדֵף
  choice: மீதித் தொகை
  rationale: עודף என்பது கணக்கிட்ட பின் எஞ்சியிருப்பதைக் குறிக்கிறது; பணம் சார்ந்த இச்சூழலில் ‘மீதித் தொகை’ தெளிவானது.
- source_word: לָאִישׁ אֲשֶׁר מָכַר לוֹ
  choice: தான் அதை விற்ற மனிதனுக்கு
  rationale: எபிரெய உரை வாங்கியவரை ‘அவன் விற்ற மனிதன்’ என்று தனிநபர் குறிப்புடன் சொல்கிறது; தமிழில் பொருளைத் தெளிவாக்க ‘அதை’ சேர்க்கப்பட்டுள்ளது.
- source_word: וְשָׁב
  choice: அவன் திரும்பலாம்
  rationale: Qal שוב திரும்பிச் செல்வதைக் குறிக்கிறது. முந்தைய நிபந்தனை நிறைவேறிய பின் நிலத்திற்குத் திரும்பும் உரிமையைச் சட்டச் சூழல் எடுத்துரைப்பதால் ‘திரும்பலாம்’ இயல்பாக உள்ளது.
- source_word: לַאֲחֻזָּתוֹ
  choice: தன் நிலவுடைமைக்கு
  rationale: אֲחֻזָּה இச்சட்டச் சூழலில் பொதுவான சொத்தை அல்ல, ஒருவருக்குரிய நிலப்பங்கையோ பரம்பரை நிலவுடைமையையோ குறிக்கிறது.
theological_decisions:
- issue: யூபிலி சட்டத்தில் אֲחֻזָּה என்பதன் இயல்பு
  choice: நிலவுடைமை
  alternative: பரம்பரை நிலவுடைமை
  rationale: இச்சொல் இஸ்ரவேலின் நிலப் பங்கீட்டு அமைப்புக்குள் ஒருவருக்குரிய நிலத்தைச் சுட்டுகிறது. ‘நிலவுடைமை’ வாசிப்புக்கு இயல்பாகவும் சட்டப் பின்னணியைப் பொதுவான ‘சொத்து’ என்பதைக் காட்டிலும் நன்றாகவும் காக்கிறது; பரம்பரை நுணுக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான சட்ட நடையில் மொழிபெயர்க்கப்பட்டது. ‘மீதித் தொகை’, ‘நிலவுடைமை’ ஆகியவை நிதி மற்றும் நிலச்சட்டச் சூழலைத் தெளிவாகப் பாதுகாக்கின்றன.
