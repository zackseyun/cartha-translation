  yaml_path: translation/ot/leviticus/025/020.yaml
  text: And if you say, ‘What will we eat in the seventh year, since we will not sow or gather our produce?’
translation:
  language: ta
  text: நீங்கள், “ஏழாம் ஆண்டில் நாம் என்ன சாப்பிடுவோம்? இதோ, நாம் விதைக்கவும் நம் விளைச்சலைச் சேகரிக்கவும் மாட்டோமே” என்று சொன்னால்,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִי תֹאמְרוּ
  choice: என்று நீங்கள் கேட்கலாம்
  rationale: இங்கு வரும் நிபந்தனைத் தொடர், எதிர்பார்க்கப்படும் கேள்வியை அறிமுகப்படுத்துகிறது; இயல்பான நவீனத் தமிழில் கேள்வியாக வெளிப்படுத்தப்பட்டது.
- source_word: בַשָּׁנָה הַשְּׁבִיעִת
  choice: ஏழாம் ஆண்டில்
  rationale: மூலத்தின் காலக் குறிப்பை நேரடியாகவும் தெளிவாகவும் தருகிறது.
- source_word: הֵן לֹא נִזְרָע וְלֹא נֶאֱסֹף
  choice: நாம் விதைக்காமலும் ... சேகரிக்காமலும் இருந்தால்
  rationale: הֵן இங்கு கேள்விக்கான காரணத்தை முன்வைக்கிறது; தமிழ் நிபந்தனை அமைப்பு அதன் தர்க்கத் தொடர்பை இயல்பாகத் தக்கவைக்கிறது.
- source_word: תְּבוּאָתֵנוּ
  choice: நம் விளைச்சலை
  rationale: இச்சொல் நிலத்தின் உற்பத்தி அல்லது விளைபொருளைக் குறிக்கிறது; சூழலில் ‘விளைச்சல்’ சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
