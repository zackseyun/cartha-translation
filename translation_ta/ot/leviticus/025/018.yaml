  source_fidelity: திருத்தம் தேவை. வரைவு வ.18-இன் சட்டம்–நீதிநியமம் வேறுபாட்டையும் பாதுகாப்பான குடியிருப்பையும் நன்றாகக் காக்கிறது. ஆனால் முதல் עָשָׂה (‘செய்தல்/நிறைவேற்றல்’) ‘சட்டங்களின்படி நடந்து’ என மாற்றப்பட்டிருப்பதால், மூலத்தில் உள்ள செயல் வினையும் அதன் இறுதி மீளுரைப்பும் போதியளவு வெளிப்படவில்லை.
  naturalness: நடை நவீன நிலையான தமிழில் இயல்பாக உள்ளது. ‘சட்டங்களை நிறைவேற்றி … அவற்றின்படி நடக்க வேண்டும்’ என்பது மூலத்தின் நோக்கமுள்ள மீளுரைப்பைத் தக்கவைத்துக் கொண்டு வாசிப்பிலும் இயல்பாக அமையும்.
  terminology: ‘சட்டங்கள்’ (חֻקֹּתַי), ‘நீதிநியமங்கள்’ (מִשְׁפָּטַי), ‘கடைப்பிடித்து’ (תִּשְׁמְרוּ), ‘குடியிருப்பீர்கள்’ (וִישַׁבְתֶּם), ‘பாதுகாப்பாக’ (לָבֶטַח) ஆகியவை பொருத்தமானவை. ‘அந்த நாடு’ என்பது இச்சூழலில் குறிப்பிட்ட உடன்படிக்கை நாட்டைக் குறிக்கும் விதத்தில் ஏற்றது.
