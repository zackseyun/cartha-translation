base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/018.yaml
  text: So you shall carry out my statutes and keep my judgments[a], and do them[c][b], and you shall dwell in the land securely.
translation:
  language: ta
  text: நீங்கள் என் சட்டங்களை நிறைவேற்றி, என் நீதிநியமங்களைக் கடைப்பிடித்து, அவற்றின்படி நடக்க வேண்டும்[a][b]. அப்பொழுது நீங்கள் அந்த நாட்டில் பாதுகாப்பாகக் குடியிருப்பீர்கள்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “என் விதிமுறைகள் … என் நீதி ஆணைகள்” என்றும் மொழிபெயர்க்கலாம். எபிரெயத்தில் חֻקִּים, מִשְׁפָּטִים என்ற இரு வேறுபட்ட சட்டச் சொற்கள் உள்ளன.
    reason: lexical_alternative
  - marker: b
    text: 'எபிரெயத்தில் “செய்” என்ற வினை இருமுறை வருகிறது; சொற்சொல்லாக: “என் சட்டங்களை நிறைவேற்றுங்கள்; என் நீதிநியமங்களைக் கடைப்பிடித்து, அவற்றின்படி நடவுங்கள்.”'
    reason: lexical_alternative
  - marker: c
    text: அதாவது, வாக்குறுதி அளிக்கப்பட்ட நாட்டில் பாதுகாப்பாகக் குடியிருப்பீர்கள்.
    reason: cultural_note
lexical_decisions:
- source_word: חֻקֹּתַי
  choice: என் சட்டங்கள்
  rationale: கடவுள் விதித்த நிலையான சட்டங்களைக் குறிக்கும் உடன்படிக்கைச் சட்டப் பொருளை நவீன தமிழில் தெளிவாகத் தருகிறது; מִשְׁפָּטַי என்பதிலிருந்து வேறுபாட்டையும் காக்கிறது.
- source_word: מִשְׁפָּטַי
  choice: என் நீதிநியமங்கள்
  rationale: நீதித் தீர்ப்புகள், சட்ட விதிமுறைகள் ஆகிய பொருள்களை உள்ளடக்கும் சொல்லாக இருப்பதால், சட்டங்களிலிருந்து வேறுபட்ட சட்டவியல் நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: תִּשְׁמְרוּ
  choice: கடைப்பிடித்து
  rationale: உடன்படிக்கை மற்றும் சட்டச் சூழலில் שׁמר என்பது கவனமாகப் பேணிக் கடைப்பிடிப்பதைக் குறிக்கிறது; தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: וַעֲשִׂיתֶם ... אֹתָם
  choice: நடந்து ... அவற்றைச் செயல்படுத்த வேண்டும்
  rationale: எபிரெயத்தில் עשה இருமுறை வருவதை, தமிழில் இயல்பற்ற சொல் மறுபடியைத் தவிர்த்தும் நடைமுறை கீழ்ப்படிதலுக்கான வலியுறுத்தலைக் காத்தும் இரண்டு வேறுபட்ட சொற்றொடர்களால் தருகிறது.
- source_word: וִישַׁבְתֶּם
  choice: குடியிருப்பீர்கள்
  rationale: நாட்டில் நிலையாக வாழ்வதையும் குடியேறியிருப்பதையும் குறிக்கும் ישׁב என்பதன் நிலவாழ்வு நுணுக்கத்தை வெளிப்படுத்துகிறது.
- source_word: הָאָרֶץ
  choice: அந்த நாடு
  rationale: உடனடிச் சூழலில் குறிப்பிட்ட உடன்படிக்கை நாட்டைக் குறிக்கிறது; ‘அந்த’ என்பது அதை பொதுவான எந்தவொரு நாட்டாகவும் வாசிப்பதைத் தவிர்க்க உதவுகிறது.
- source_word: לָבֶטַח
  choice: பாதுகாப்பாக
  rationale: அச்சமின்றி நிலையான பாதுகாப்புடன் வாழ்வதைக் குறிக்கும் בֶּטַח என்பதற்கு இயல்பான நவீனத் தமிழ் இணை.
theological_decisions:
- issue: கீழ்ப்படிதலுக்கும் நாட்டில் பாதுகாப்பாகக் குடியிருப்பதற்கும் உள்ள தொடர்பு
  choice: இஸ்ரவேலின் உடன்படிக்கை நாட்டுச் சூழலில், சட்டங்களைக் கடைப்பிடிப்பதைத் தொடர்ந்து பாதுகாப்பான குடியிருப்பு வருவதாக மொழிபெயர்க்கப்பட்டது.
  alternative: எல்லாக் காலங்களிலும் எல்லா விசுவாசிகளுக்கும் தனிப்பட்ட பாதுகாப்பு அல்லது செழிப்பு உறுதியாகக் கிடைக்கும் என்ற பொதுவாக்குறுதி.
  rationale: எபிரெய உரை கீழ்ப்படிதலையும் ‘அந்த நாட்டில்’ பாதுகாப்பாகக் குடியிருப்பதையும் நேரடியாக இணைக்கிறது. ‘அப்பொழுது’ அந்தத் தொடர்ச்சியைத் தெளிவாக்குகிறது; ஆனால் உரையின் நாட்டுடன்படிக்கைச் சூழலைத் தாண்டி வாக்குறுதியைப் பொதுமைப்படுத்தவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான சட்ட-உடன்படிக்கை நடையில் அமைக்கப்பட்டது. ‘சட்டங்கள்’ மற்றும் ‘நீதிநியமங்கள்’ என்ற இரு சொற்கள் மூலத்தின் சட்டவியல் வேறுபாட்டைக் காக்கின்றன; ‘குடியிருப்பீர்கள்’ என்பது நாட்டில் நிலையான வாழ்வைச் சுட்டுகிறது.
