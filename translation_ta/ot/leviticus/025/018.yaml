- from: நீங்கள் என் சட்டங்களின்படி நடந்து, என் நீதிநியமங்களைக் கடைப்பிடித்து[a], அவற்றைச் செயல்படுத்த வேண்டும்[b]. அப்பொழுது நீங்கள் அந்த நாட்டில் பாதுகாப்பாகக் குடியிருப்பீர்கள்[c].
  to: நீங்கள் என் சட்டங்களை நிறைவேற்றி, என் நீதிநியமங்களைக் கடைப்பிடித்து, அவற்றின்படி நடக்க வேண்டும்[a][b]. அப்பொழுது நீங்கள் அந்த நாட்டில் பாதுகாப்பாகக் குடியிருப்பீர்கள்[c].
  rationale: ‘சட்டங்களின்படி நடந்து’ என்பதற்குப் பதிலாக ‘சட்டங்களை நிறைவேற்றி’ என மாற்றுவது முதல் עָשָׂה வினையை நேரடியாகப் பிரதிபலிக்கிறது. இறுதி ‘அவற்றின்படி நடக்க வேண்டும்’ என்பது இரண்டாம் வினையின் நடைமுறை கீழ்ப்படிதல் வலியுறுத்தலை இயல்பான தமிழில் காக்கிறது. சட்டவியல் சொற்களின் வேறுபாடும் நாட்டில் பாதுகாப்பாகக் குடியிருப்பதற்கான சூழல்-நிபந்தனைத் தொடர்பும் மாற்றப்படவில்லை.
