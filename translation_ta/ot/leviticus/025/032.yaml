source:
  edition: WLC
  text: וְ/עָרֵי֙ הַ/לְוִיִּ֔ם בָּתֵּ֖י עָרֵ֣י אֲחֻזָּתָ֑/ם גְּאֻלַּ֥ת עוֹלָ֖ם תִּהְיֶ֥ה לַ/לְוִיִּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/032.yaml
  text: As for the cities of the Levites[a], the houses in the cities of their possession may be redeemed permanently by the Levites.
translation:
  language: ta
  text: லேவியருடைய நகரங்களைப் பொறுத்தவரை, அவர்களுடைய உடைமை நகரங்களிலுள்ள வீடுகளை மீட்டுக்கொள்ளும் உரிமை லேவியருக்கு நிரந்தரமாக இருக்கும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல் முறையில்: “நிரந்தரமான மீட்பு உரிமை லேவியருக்கு இருக்கும்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עָרֵי הַ/לְוִיִּם
  choice: லேவியருடைய நகரங்களைப் பொறுத்தவரை
  rationale: וְ இங்கு சட்ட உரையாடலில் ஒரு புதிய நிலையை அறிமுகப்படுத்துகிறது. தமிழில் ‘...பொறுத்தவரை’ என்பது அந்தத் தலைப்பு மாற்றத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בָּתֵּי עָרֵי אֲחֻזָּתָם
  choice: அவர்களுக்குச் சொந்தமான நகரங்களிலுள்ள வீடுகளை
  rationale: எபிரெயச் சொற்றொடரின் நேரடி அமைப்பு ‘அவர்களுடைய உடைமை நகரங்களின் வீடுகள்’ என்பதாக இருந்தாலும், வீடுகள் அந்த நகரங்களில் அமைந்துள்ளன என்ற உறவைத் தெளிவாகவும் இயல்பாகவும் தமிழில் கூறுகிறது. אֲחֻזָּה என்பதன் சட்டப்பூர்வ உடைமை உணர்வையும் காக்கிறது.
- source_word: גְּאֻלַּת
  choice: மீட்டுக்கொள்ளும் உரிமை
  rationale: இங்கு ‘மீட்பு’ என்ற பெயர்ச்சொல், תִּהְיֶה மற்றும் லேவியரைக் குறிக்கும் לַ உடன் சேர்ந்து, தொடர்ந்து நிலவும் சட்ட உரிமையைச் சுட்டுகிறது. ‘மீட்டுக்கொள்ளுதல்’ விற்கப்பட்ட சொத்தைத் திரும்பப் பெறும் சூழலுக்கு ஏற்றது.
- source_word: עוֹלָם
  choice: என்றென்றும்
  rationale: இந்தச் சட்டச் சூழலில் காலவரையின்றித் தொடரும் நிலையைச் சுட்டுகிறது. இயல்பான தமிழில் அதன் நீடித்த தன்மையை வெளிப்படுத்துகிறது.
- source_word: תִּהְיֶה לַ/לְוִיִּם
  choice: லேவியருக்கு ... இருக்கும்
  rationale: லேவியருக்குச் சட்டப்படி உரித்தான நிரந்தர ஏற்பாட்டை எபிரெய உரைக்கு நெருக்கமாகக் காட்டுகிறது; செயப்பாட்டு வடிவத்தைத் தேவையின்றி இறக்குமதி செய்யவில்லை.
theological_decisions:
- issue: லேவியருடைய வீடுகளை மீட்டுக்கொள்வதற்கான சட்ட ஏற்பாட்டின் தன்மை
  choice: லேவியருக்கு எப்போதும் தொடரும் மீட்டுக்கொள்ளும் உரிமை உண்டு
  alternative: ‘நிரந்தர மீட்பு லேவியருக்கு இருக்கும்’ என்று பெயர்ச்சொல் அமைப்பை நேரடியாக மொழிபெயர்த்தல்
  rationale: גְּאֻלַּת עוֹלָם תִּהְיֶה לַלְוִיִּם என்ற கூறு, லேவியருக்குத் தொடர்ந்து கிடைக்கும் சட்ட உரிமையை நிறுவுகிறது. முதன்மை உரை அதன் நடைமுறைப் பொருளைத் தெளிவாக்குகிறது; அடிக்குறிப்பு முறையான மாற்றைத் தருகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் தெளிவான, கண்ணியமான சட்டநடை பயன்படுத்தப்பட்டுள்ளது. ‘சுதந்தர நகரங்கள்’ போன்ற இன்றைய வாசகருக்குத் தெளிவில்லாத சொற்றொடருக்குப் பதிலாக ‘அவர்களுக்குச் சொந்தமான நகரங்கள்’ பயன்படுத்தப்பட்டுள்ளது; ‘மீட்டுக்கொள்ளும் உரிமை’ சட்டப்பொருளை வெளிப்படையாகக் காட்டுகிறது.
