  source_fidelity: முதல் தொடரில் உள்ள וְצִוִּיתִי (‘நான் கட்டளையிடுவேன்’) மற்றும் ‘என் ஆசீர்வாதம்’ ஆகியவை காக்கப்பட்டுள்ளன. ஆனால் வரைவிலுள்ள இரண்டாம் தொடரின் ‘அது’ உடனடியாக முன்வரும் ‘என் ஆசீர்வாதம்’ என்பதையே சுட்டுவதாக இயல்பாகப் படுகிறது. எபிரெய வினை பெண்பால் ஒருமையில் இருப்பதால், இச்சூழலில் அது ஆறாம் ஆண்டைக் குறிக்கும் வகையில் அமைந்துள்ளது. ‘அந்த ஆண்டு’ என வெளிப்படுத்துவது மூலத்தின் கருத்துத் தொடர்பைத் தெளிவாக்குகிறது.
