  text: Then I will command my blessing for you in the sixth year[a], and it will produce the yield for three years.
translation:
  language: ta
  text: அப்போது, ஆறாம் ஆண்டில் உங்கள்மேல் என் ஆசீர்வாதம் வருமாறு நான் கட்டளையிடுவேன்; அந்த ஆண்டு மூன்று ஆண்டுகளுக்கான விளைச்சலைத் தரும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘விளைச்சல்’ என்பதற்கு ‘நிலத்தின் பலன்’ அல்லது ‘அறுவடைப் பலன்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִוִּיתִי
  choice: அப்போது … உண்டாகும்படி நான் கட்டளையிடுவேன்
  rationale: צוה என்பதிலுள்ள தெய்வீகக் கட்டளையின் வலிமையைப் பேணுகிறது. முந்தைய வசனத்தில் எழும் கேள்விக்கான பதிலை וְ தொடங்குவதால், அதன் உரையாடல் செயல்பாட்டை ‘அப்போது’ வெளிப்படுத்துகிறது.
- source_word: בִּרְכָתִי
  choice: என் ஆசீர்வாதம்
  rationale: வேளாண் செழிப்பை விளைவிக்கும் ஆண்டவரின் அருளை நேரடியாகக் குறிக்கிறது; அதன் குறிப்பான விளைவு அடுத்த தொடரில் சொல்லப்படுகிறது.
- source_word: לָכֶם
  choice: உங்களுக்கு
  rationale: ל இங்கு ஆசீர்வாதத்தின் பயனடைவோரைக் குறிக்கிறது; ‘உங்களுக்கு’ என்பது இயல்பான தமிழாக்கம்.
- source_word: בַּשָּׁנָה הַשִּׁשִּׁית
  choice: ஆறாம் ஆண்டில்
  rationale: ஓய்வு ஆண்டு சுழற்சியோடு தொடர்புடைய காலத்தைக் குறிக்கும் சொற்றொடரை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: וְעָשָׂת
  choice: அது … தரும்
  rationale: பெண்பால் ஒருமை வினைச்சொல் முன் வரும் ‘என் ஆசீர்வாதம்’ என்பதைக் குறிக்க இயலும். வேளாண் பலனை உருவாக்குவதைத் தமிழில் இயல்பாக ‘தரும்’ என்கிறது.
- source_word: הַתְּבוּאָה
  choice: விளைச்சல்
  rationale: תבואה என்பது குறிப்பாக நிலத்தின் உற்பத்தி அல்லது அறுவடைப் பலனைக் குறிக்கிறது; ‘விளைச்சல்’ தெளிவான நவீனத் தமிழ் சொல்.
- source_word: לִשְׁלֹשׁ הַשָּׁנִים
  choice: மூன்று ஆண்டுகளுக்கான
  rationale: விளைச்சல் மூன்று ஆண்டுகளுக்கு வழங்கும் என்பதைச் சுருக்கமாகக் கூறுகிறது; ‘போதுமான’ என்று மூலத்தில் வெளிப்படையாக இல்லாத சொல்லைச் சேர்க்கவில்லை.
theological_decisions:
- issue: வாக்குறுதியளிக்கப்பட்ட ஆசீர்வாதத்தின் இயல்பு
  choice: அசாதாரண வேளாண் வளத்தை விளைவிக்கும் நேரடியான தெய்வீகக் கட்டளை
  alternative: பொதுவான இறைப் பராமரிப்பைப் பற்றிய கூற்று மட்டும்
  rationale: ‘நான் கட்டளையிடுவேன்’ என்றும் ‘என் ஆசீர்வாதம்’ என்றும் முதல் நபரில் கூறப்படுவது, வழக்கமான அறுவடை நிலையைப் பற்றிய பொதுக் கூற்றாக அல்லாமல் குறிப்பான தெய்வீகச் செயலாக இதைக் காட்டுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘என் ஆசீர்வாதத்தைக் கட்டளையிடுவேன்’ என்ற இயல்பற்ற நேரடி வடிவத்தைத் தவிர்த்து, எபிரெயச் சொல்லின் வலிமையைப் பேணும் வகையில் ‘என் ஆசீர்வாதம் … உண்டாகும்படி … கட்டளையிடுவேன்’ என அமைக்கப்பட்டுள்ளது.
