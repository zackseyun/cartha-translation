- from: அவனை நீ கொடுமையாக ஆளக்கூடாது[a]; உன் கடவுளுக்குப் பயப்பட வேண்டும்.
  to: அவனை நீ கொடுமையாக ஆளக்கூடாது[a]; உன் கடவுளுக்கு அஞ்ச வேண்டும்.
