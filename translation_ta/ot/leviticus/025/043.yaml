review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the prohibition, its masculine-singular object, and the severity expressed by בְּפָרֶךְ. The final clause should more clearly retain the second-person command and the reverential sense of ירא in this ethical context.
  naturalness: ‘அவனை நீ கொடுமையாக ஆளக்கூடாது’ is clear, idiomatic modern Tamil for the legal instruction. ‘உன் கடவுளுக்குப் பயப்பட வேண்டும்’ can sound impersonal and may primarily suggest being frightened; ‘உன் கடவுளுக்கு அஞ்ச வேண்டும்’ is more natural in elevated legal-scriptural Tamil and conveys reverent fear.
  terminology: ‘அஞ்சுதல்’ is the appropriate established Tamil rendering here for fear/reverence toward God, without importing a doctrinal interpretation. ‘கொடுமையாக’ suitably renders the harsh/severe manner of rule.
  issues:
  - severity: medium
    issue: The final command uses ‘பயப்பட வேண்டும்.’
    rationale: Although understandable, it can be impersonal and suggest ordinary fright. Hebrew וְיָרֵאתָ is a second-person singular command whose context calls for reverential fear of God. ‘உன் கடவுளுக்கு அஞ்ச வேண்டும்’ better preserves this force in modern standard Tamil.
  revised_text: அவனை நீ கொடுமையாக ஆளக்கூடாது[a]; உன் கடவுளுக்கு அஞ்ச வேண்டும்.
  revised_footnotes:
