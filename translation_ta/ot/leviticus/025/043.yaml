source:
  edition: WLC
  text: לֹא תִרְדֶּ֥ה ב֖/וֹ בְּ/פָ֑רֶךְ וְ/יָרֵ֖אתָ מֵ/אֱלֹהֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/043.yaml
  text: You shall not rule over him harshly[a], but you shall fear your God.
translation:
  language: ta
  text: அவனை நீ கொடுமையாக ஆளக்கூடாது[a]; உன் கடவுளுக்கு அஞ்ச வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கடுமையாக,’ ‘இரக்கமின்றி.’ எபிரெயச் சொல் கடுமையான, நசுக்கும் விதமான நடத்தையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִרְדֶּה
  choice: ஆளக்கூடாது
  rationale: רדה என்பது ‘ஆளுதல், அதிகாரம் செலுத்துதல்’ என்று பொருள்படும். இங்குள்ள தடை வடிவத்துடன் ‘ஆளக்கூடாது’ என்பது அதிகார உறவைத் தெளிவாகவும் மிகைவிளக்கமின்றியும் தருகிறது.
- source_word: בּוֹ
  choice: அவனை
  rationale: ஆண்பால் ஒருமைச் சுட்டுப்பெயர், பணிவிடை நிலையில் உள்ள முந்தைய வசனத்தின் இஸ்ரவேலனைச் சுட்டுகிறது; தமிழில் வினையின் நேர்செயப்படுபொருளாக இயல்பாக வழங்கப்படுகிறது.
- source_word: בְּפָרֶךְ
  choice: கொடுமையாக
  rationale: פָרֶךְ கடுமையான, நசுக்கும் விதமான நடத்தையையோ உழைப்பையோ குறிக்கிறது. ‘கொடுமையாக’ என்பது இங்கு இயல்பான நவீனத் தமிழில் அதன் வலிமையைப் பாதுகாக்கிறது; ‘இரக்கமின்றி’ என்பது சற்றுக் கூடுதல் விளக்கமாகிவிடும்.
- source_word: וְיָרֵאתָ
  choice: பயப்பட வேண்டும்
  rationale: וְ என்பது வடிவில் ‘மற்றும்’; ஆனால் தடையைத் தொடர்ந்து வரும் இக்கட்டளை, கடவுளுக்கான பயபக்தியே அதிகாரப் பயன்பாட்டைக் கட்டுப்படுத்த வேண்டும் என்ற எதிர்நிலைத் தொடர்பைக் கொண்டுள்ளது. தமிழில் அரைப்புள்ளி அந்தத் தொடர்பை இயல்பாகக் காட்டுகிறது; தனியாக ‘ஆனால்’ சேர்க்க வேண்டியதில்லை.
- source_word: מֵאֱלֹהֶיךָ
  choice: உன் கடவுளுக்குப்
  rationale: ירא உடன் வரும் מִן பயத்தின் பொருளைக் குறிக்கும் எபிரெய வழக்கு. தமிழில் ‘கடவுளுக்குப் பயப்படு’ என்பது இயல்பான இலக்கண அமைப்பு; உரிமைத் தொடர்பான ‘உன்’ தக்கவைக்கப்பட்டுள்ளது.
theological_decisions:
- issue: இறுதிக் கட்டளை மனிதாபிமானமான நடத்தைக்கான இறையியல் அடிப்படையா, அல்லது வெறும் இணைக் கட்டளையா?
  choice: தடையைத் தொடர்ந்து ‘உன் கடவுளுக்குப் பயப்பட வேண்டும்’ என்று வழங்கி, கடவுளுக்கான பயபக்தி சமூக அதிகாரத்தைக் கட்டுப்படுத்தும் நெறியாகத் தெரிவிக்கப்படுகிறது.
  alternative: ‘மேலும் உன் கடவுளுக்குப் பயப்பட வேண்டும்’ என்று முற்றிலும் இணைக் கட்டளையாக மொழிபெயர்க்கலாம்.
  rationale: எபிரெய வாவ் இணைப்பை மிகையாகத் தீர்மானிக்காமல் அரைப்புள்ளியால் இரு கூற்றுகளின் தொடர்பு பாதுகாக்கப்படுகிறது. இதனால் எதிர்நிலை சார்ந்த நெறியியல் வலிமையும், வடிவிலுள்ள இணைப்பின் நெகிழ்வும் இரண்டும் நிலைக்கின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டக் கட்டளைக்கேற்ற கண்ணியமான நேரடி நடை பயன்படுத்தப்பட்டுள்ளது. ‘கொடுமையாக ஆளுதல்’ பொதுவாசகருக்குப் புரியும் வகையில் அதிகாரத் தொடர்பையும் கடுமையான நடத்தையையும் ஒருங்கே தெரிவிக்கிறது.
