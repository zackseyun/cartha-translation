    text: அல்லது, ‘கடுமையாக,’ ‘இரக்கமின்றி.’ எபிரெயச் சொல் கடுமையான, நசுக்கும் விதமான நடத்தையைக் குறிக்கிறது.
    reason: lexical_alternative
