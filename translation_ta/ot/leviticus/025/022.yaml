- from: எட்டாம் ஆண்டில் நீங்கள் விதைத்து, ஒன்பதாம் ஆண்டுவரை பழைய விளைச்சலிலிருந்து சாப்பிடுவீர்கள்; அந்த ஆண்டின் விளைச்சல் வந்துசேரும்வரை பழையதையே[a] சாப்பிடுவீர்கள்.
  to: எட்டாம் ஆண்டில் நீங்கள் விதைத்து, ஒன்பதாம் ஆண்டுவரை பழைய விளைச்சலிலிருந்து உண்பீர்கள்; அந்த ஆண்டின் விளைச்சல் வந்துசேரும்வரை பழையதை[a] உண்பீர்கள்.
