translation_notes:
  register: நவீனத் தரநிலைத் தமிழில், சாதாரண வாசகர்களுக்கு எளிதாகவும் சட்ட அறிவுறுத்தலுக்கேற்ற கண்ணியத்துடனும் அமைக்கப்பட்டுள்ளது. ‘விளைச்சல்’ வேளாண் பொருளைத் துல்லியமாகக் குறிக்கிறது; எபிரெயத்தின் இறுதி சுருக்கமான மறுபடியுரைத்தல் ‘பழையதையே’ என்பதால் பாதுகாக்கப்பட்டுள்ளது.
