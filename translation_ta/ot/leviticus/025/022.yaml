  text: וּ/זְרַעְתֶּ֗ם אֵ֚ת הַ/שָּׁנָ֣ה הַ/שְּׁמִינִ֔ת וַ/אֲכַלְתֶּ֖ם מִן הַ/תְּבוּאָ֣ה יָשָׁ֑ן עַ֣ד הַ/שָּׁנָ֣ה הַ/תְּשִׁיעִ֗ת עַד בּוֹא֙ תְּב֣וּאָתָ֔/הּ תֹּאכְל֖וּ יָשָֽׁן־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/022.yaml
  text: And you shall sow in the eighth year and eat from the old produce until the ninth year; until its produce comes in[a], you shall eat the old.
translation:
  language: ta
  text: எட்டாம் ஆண்டில் நீங்கள் விதைத்து, ஒன்பதாம் ஆண்டுவரை பழைய விளைச்சலிலிருந்து உண்பீர்கள்; அந்த ஆண்டின் விளைச்சல் வந்துசேரும்வரை பழையதை[a] உண்பீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் இங்கு ‘பழையது’ என்று மட்டுமே உள்ளது; சூழலிலிருந்து ‘பழைய விளைச்சல்’ என்பது புரிந்துகொள்ளப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּזְרַעְתֶּם
  choice: நீங்கள் விதைத்து
  rationale: சட்ட அறிவுறுத்தலின் தொடர்ச்சியில் வரும் வினைச்சொல் எதிர்காலச் செயலையும் செய்யவேண்டியதையும் குறிக்கிறது; தமிழில் அடுத்த வினையோடு இயல்பாக இணைக்கப்பட்டுள்ளது.
- source_word: הַשָּׁנָה הַשְּׁמִינִת
  choice: எட்டாம் ஆண்டில்
  rationale: எபிரெய வரிசை எண்ணையும் காலக் குறிப்பையும் நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: מִן הַתְּבוּאָה יָשָׁן
  choice: பழைய விளைச்சலிலிருந்து
  rationale: תְּבוּאָה என்பது வேளாண் விளைச்சலைக் குறிக்கிறது; יָשָׁן முந்தைய அறுவடையிலிருந்து சேமிக்கப்பட்ட பழைய விளைச்சல் என்பதைக் காட்டுகிறது.
- source_word: עַד הַשָּׁנָה הַתְּשִׁיעִת
  choice: ஒன்பதாம் ஆண்டுவரை
  rationale: கால எல்லையைத் தெளிவாகவும் சுருக்கமாகவும் மொழிபெயர்க்கிறது.
- source_word: עַד בּוֹא תְּבוּאָתָהּ
  choice: அந்த ஆண்டின் விளைச்சல் வந்துசேரும்வரை
  rationale: பெண்பால் ஒருமை பின்னொட்டு முன் குறிப்பிடப்பட்ட ஒன்பதாம் ஆண்டைக் குறிக்கிறது. ‘அந்த ஆண்டின்’ என்பது தமிழில் அந்தத் தொடர்பைத் தெளிவாக்குகிறது; ‘வந்துசேரும்’ என்பது விளைச்சல் உணவாகக் கிடைக்கத் தொடங்குவதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: תֹּאכְלוּ יָשָׁן
  choice: பழையதையே சாப்பிடுவீர்கள்
  rationale: எபிரெயத்தில் ‘பழையது’ என்ற பெயரடை மட்டும் மீண்டும் வருகிறது; சூழலிலிருந்து ‘விளைச்சல்’ என்பது புரிந்துகொள்ளப்படுகிறது. ‘-ஏ’ தொடர்ந்தும் அதையே உண்பதை இயல்பாக வலியுறுத்துகிறது.
