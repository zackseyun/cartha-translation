base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/029.yaml
  text: If a man sells a house for dwelling in a walled city[a], its redemption may be made until the completion of a full year from its sale; its right of redemption shall last for days, that is, a full year.
translation:
  language: ta
  text: ஒருவன் மதில்சூழ்ந்த நகரத்தில் குடியிருப்பதற்கான ஒரு வீட்டை விற்றால், விற்பனை செய்யப்பட்ட நாளிலிருந்து ஓராண்டு நிறைவடையும்வரை அந்த வீட்டை மீட்டுக்கொள்ளலாம்; அந்த வீட்டை மீட்டுக்கொள்ளும் உரிமை முழு ஓராண்டுக்கு[a] இருக்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘நாட்கள்’; இந்தச் சட்ட மரபுத்தொடர் முழு ஓராண்டுக் காலத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ כִּי
  choice: ஒருவன் … விற்றால்
  rationale: எபிரெய சட்ட வழக்கில் כִּי ஒரு நிபந்தனைச் சூழலை அறிமுகப்படுத்துகிறது. אִישׁ ஒருமை ஆண்பால் வடிவமாக இருப்பதால், பிரதிநிதித்துவ சட்ட மொழிநடையில் ‘ஒருவன்’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: בֵּית מוֹשַׁב
  choice: குடியிருப்பதற்கான ஒரு வீடு
  rationale: இது குடியிருப்பாகப் பயன்படுத்தப்படும் வீட்டைக் குறிக்கும் இணைப்புத் தொடர். வெறும் ‘வீடு’ என்று சுருக்காமல், கட்டிடத்தின் குடியிருப்புப் பயன்பாட்டைத் தக்கவைக்கிறது.
- source_word: עִיר חוֹמָה
  choice: மதில்சூழ்ந்த நகரம்
  rationale: மதில் கொண்ட நகரம் என்பதே தொடரின் பொருள்; ‘அரண்மிக்க நகரம்’ என்பதைவிட மூலத்தின் மதில் குறிப்பு வெளிப்படையாகப் பாதுகாக்கப்படுகிறது.
- source_word: וְהָיְתָה גְּאֻלָּתוֹ
  choice: அதை மீட்டுக்கொள்ளலாம்
  rationale: இந்தச் சொத்து சட்டச் சூழலில் גְּאֻלָּה விற்கப்பட்ட வீட்டை மீண்டும் பெற்றுக்கொள்ளும் வாய்ப்பு அல்லது உரிமையைக் குறிக்கிறது. தமிழில் செயப்பாட்டு வடிவம் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: עַד תֹּם שְׁנַת מִמְכָּרוֹ
  choice: அதை விற்ற நாளிலிருந்து ஓராண்டு நிறைவடையும்வரை
  rationale: சொற்றொடர் சொற்படியாக ‘அது விற்கப்பட்ட ஆண்டின் நிறைவுவரை’ என இருந்தாலும், சட்டச் சூழலில் விற்பனைத் தேதியிலிருந்து கணக்கிடப்படும் முழு ஆண்டைக் குறிக்கிறது; நாட்காட்டி ஆண்டின் முடிவை அல்ல.
- source_word: יָמִים
  choice: நாட்களுக்கு—அதாவது, ஓராண்டு முழுவதும்
  rationale: יָמִים என்பதன் அடிப்படைப் பொருள் ‘நாட்கள்’; இச்சட்ட மரபுத்தொடரில் அது முழு ஆண்டுக் காலத்தைக் குறிக்கிறது. மொழிபெயர்ப்பு மூல உருவகத்தை வைத்துக்கொண்டு அதன் சூழற்பொருளையும் தெளிவாக்குகிறது.
- source_word: תִּהְיֶה גְאֻלָּתוֹ
  choice: அதை மீட்டுக்கொள்ளும் உரிமை … இருக்கும்
  rationale: இறுதிக் கூற்று மீட்புக்கான காலவரம்பை மீண்டும் வலியுறுத்துகிறது. ‘உரிமை இருக்கும்’ என்பது சட்டப் பொருளையும் காலநீடிப்பையும் இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: גְּאֻלָּה என்ற சொல்லின் பொருள்
  choice: சொத்தை மீட்டுக்கொள்ளுதல் / மீட்டுக்கொள்ளும் உரிமை
  alternative: ஆவிக்குரிய மீட்பு
  rationale: இங்கு விற்கப்பட்ட வீட்டுக்கான சட்ட நடைமுறையே பேசப்படுகிறது. ஆகவே சொல்லுக்கு பின்னாளைய அல்லது தனிப்பட்ட இரட்சிப்பியல் பொருளைச் சேர்க்காமல் சொத்து மீட்பின் பொருள் பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சட்டத் தன்மை தெளிவாகத் தோன்றும் கண்ணியமான மொழிநடை பயன்படுத்தப்பட்டுள்ளது. ‘குடியிருப்பதற்கான வீடு’ என்ற சொற்றொடர் மூல இணைப்பின் வேறுபாட்டைத் தக்கவைக்கிறது; ‘நாட்களுக்கு’ என்ற எபிரெய மரபுத்தொடர் அடிக்குறிப்புடன் பாதுகாக்கப்பட்டுள்ளது.
