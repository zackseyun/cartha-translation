- from: ஒருவன் மதில்சூழ்ந்த நகரத்தில் குடியிருப்பதற்கான ஒரு வீட்டை விற்றால், அதை விற்ற நாளிலிருந்து ஓராண்டு நிறைவடையும்வரை அதை மீட்டுக்கொள்ளலாம்; அதை மீட்டுக்கொள்ளும் உரிமை நாட்களுக்கு[a]—அதாவது, ஓராண்டு முழுவதும்—இருக்கும்.
