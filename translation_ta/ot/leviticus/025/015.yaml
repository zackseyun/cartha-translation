  text: בְּ/מִסְפַּ֤ר שָׁנִים֙ אַחַ֣ר הַ/יּוֹבֵ֔ל תִּקְנֶ֖ה מֵ/אֵ֣ת עֲמִיתֶ֑/ךָ בְּ/מִסְפַּ֥ר שְׁנֵֽי תְבוּאֹ֖ת יִמְכָּר לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/015.yaml
  text: According to the number of years after the Jubilee[a], you shall buy from your fellow; according to the number of years of crops he shall sell to you.
translation:
  language: ta
  text: யூபிலி ஆண்டுக்குப் பின் உள்ள ஆண்டுகளின் எண்ணிக்கைக்கு ஏற்ப, உன் சகமனிதரிடமிருந்து நீ வாங்க வேண்டும்; விளைச்சல் தரும் ஆண்டுகளின் எண்ணிக்கைக்கு ஏற்ப[a] அது உனக்கு விற்கப்பட வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லடியாக, ‘விளைச்சல்களின் ஆண்டுகளின் எண்ணிக்கைக்கு ஏற்ப.’ நிலம் நிரந்தரமாகக் கைமாறுவதாக அல்லாமல், அடுத்த யூபிலி ஆண்டுவரை விளைச்சல் தரும் ஆண்டுகளின் எண்ணிக்கையை அடிப்படையாகக் கொண்டே விற்பனை மதிப்பு கணக்கிடப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּמִסְפַּר
  choice: எண்ணிக்கைக்கு ஏற்ப
  rationale: בְּ இங்கு அளவையோ கணக்கீட்டின் அடிப்படையையோ குறிக்கிறது; நவீனத் தமிழில் இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: אַחַר הַיּוֹבֵל
  choice: யூபிலி ஆண்டுக்குப் பிந்திய
  rationale: יוֹבֵל என்பதற்கான நிறுவப்பட்ட வேதாகமச் சொல்லைத் தக்கவைத்து, אַחַר என்பதன் காலத் தொடர்பை நேரடியாகக் காட்டுகிறது.
- source_word: תִּקְנֶה
  choice: நீ வாங்க வேண்டும்
  rationale: சட்ட அறிவுறுத்தலில் வரும் இரண்டாம் நபர் வினையின் கட்டளையாற்றலைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: מֵאֵת עֲמִיתֶךָ
  choice: உன் சக சமூகத்தவரிடமிருந்து
  rationale: עָמִית் சட்டச் சூழலில் அதே சமூகத்தைச் சேர்ந்த சக நபரைக் குறிக்கிறது; இனத்தையோ குடும்ப உறவையோ தேவையின்றி குறிப்பாக்காமல் இந்த உறவைப் பாதுகாக்கிறது.
- source_word: שְׁנֵי תְבוּאֹת
  choice: விளைச்சல் கிடைக்கும் ஆண்டுகள்
  rationale: சொல்லடியாக ‘விளைச்சல்களின் ஆண்டுகள்’; வெறும் நாட்காட்டி ஆண்டுகள் அல்லாமல் பயிர் விளையும் ஆண்டுகளே கணக்கின் அடிப்படை என்பதை இயல்பான தமிழில் உணர்த்துகிறது.
- source_word: יִמְכָּר לָךְ
  choice: அவர் உனக்கு விற்க வேண்டும்
  rationale: வாங்குபவருக்கான அறிவுறுத்தலுக்கு இணையாக விற்பவரின் செயலைச் சட்ட மொழியில் கூறுகிறது; தமிழில் மரியாதைமிக்க பாலினப் பொதுமை கொண்ட ஒருமையைப் பயன்படுத்துகிறது.
