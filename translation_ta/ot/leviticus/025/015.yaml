revisions:
- from: யூபிலி ஆண்டுக்குப் பிந்திய ஆண்டுகளின் எண்ணிக்கைக்கு ஏற்ப, உன் சக சமூகத்தவரிடமிருந்து நீ வாங்க வேண்டும்; விளைச்சல் கிடைக்கும் ஆண்டுகளின் எண்ணிக்கைக்கு ஏற்ப[a] அவர் உனக்கு விற்க வேண்டும்.
  to: யூபிலி ஆண்டுக்குப் பின் உள்ள ஆண்டுகளின் எண்ணிக்கைக்கு ஏற்ப, உன் சகமனிதரிடமிருந்து நீ வாங்க வேண்டும்; விளைச்சல் தரும் ஆண்டுகளின் எண்ணிக்கைக்கு ஏற்ப[a] அது உனக்கு விற்கப்பட வேண்டும்.
