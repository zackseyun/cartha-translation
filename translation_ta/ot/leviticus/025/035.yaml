base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/035.yaml
  text: If your brother becomes poor and his hand falters beside you[a], then you shall support him[b]; so that he may live beside you as a resident foreigner or a temporary resident.
translation:
  language: ta
  text: உன் சகோதரன் வறுமையடைந்து, அவனுடைய கை உன்னோடு தளர்ந்துபோனால்[a], நீ அவனை ஆதரிக்க வேண்டும்; குடியிருக்கும் அந்நியனாகவோ தற்காலிகக் குடியிருப்பாளனாகவோ அவன் உன்னோடு வாழும்படி.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், ‘அவனுடைய கை உன்னோடு தளர்ந்துபோனால்.’ இது அவனுடைய வாழ்வாதாரம் குன்றுவதையோ, தன்னைத்தானே தாங்கிக்கொள்ள முடியாமல் போவதையோ குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: ‘குடியிருக்கும் அந்நியன், தற்காலிகக் குடியிருப்பாளர்’ என்ற எபிரெயத் தொடர் இலக்கண ரீதியாகச் சுருக்கமானது. இதை, ‘அவனை ஆதரி—குடியிருக்கும் அந்நியனையும் தற்காலிகக் குடியிருப்பாளனையும் [ஆதரிப்பதுபோல அல்லது அவர்களையும் ஆதரித்து]—அவன் உன்னோடு வாழட்டும்’ எனவும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וְכִי
  choice: …போனால்
  rationale: நிபந்தனை சார்ந்த சட்டச் சூழலை இயல்பான தமிழில் காட்டுகிறது; எபிரெய முன்னொட்டிலுள்ள இணைப்புச் சொல்லைத் தனியே மொழிபெயர்க்க வேண்டியதில்லை.
- source_word: יָמוּךְ
  choice: வறுமையடைந்து
  rationale: பொருளாதார நிலையில் தாழ்ந்து ஏழையாகும் கருத்தைத் தெளிவாகத் தருகிறது.
- source_word: אָחִיךָ
  choice: உன் சகோதரன்
  rationale: மூலத்தின் உறவுமுறைச் சொல்லைத் தக்கவைக்கிறது; சூழலில் இது உடன்படிக்கைச் சமூகத்தைச் சேர்ந்த ஒருவனைக் குறிக்கலாம்.
- source_word: וּמָטָה יָדוֹ עִמָּךְ
  choice: உன்னோடு இருக்கையில் அவனுடைய கை தளர்ந்துபோனால்
  rationale: வாழ்வாதாரத்தையோ தன்னைத்தானே தாங்கும் திறனையோ இழப்பதைக் குறிக்கும் எபிரெய உருவகத்தைத் தக்கவைத்து, עִמָּךְ என்பதன் உறவுசார் பொருளையும் வெளிப்படுத்துகிறது.
- source_word: וְהֶחֱזַקְתָּ בּוֹ
  choice: நீ அவனை ஆதரிக்க வேண்டும்
  rationale: חזק என்பதன் ஹிஃபீல் வடிவம் இங்கு தேவையிலுள்ள ஒருவரைத் தாங்கி உதவுவதைக் குறிக்கிறது; பொருளாதார-சமூகச் சூழலுக்கு ‘ஆதரிக்க’ இயல்பாகப் பொருந்துகிறது.
- source_word: גֵּר
  choice: குடியிருக்கும் அந்நியன்
  rationale: இஸ்ரவேல் சமூகத்தில் வாழ்ந்தாலும் அந்நாட்டைச் சேர்ந்தவரல்லாத குடியிருப்பாளரின் சட்ட-சமூக நிலையைத் தெளிவாகக் காட்டுகிறது.
- source_word: וְתוֹשָׁב
  choice: தற்காலிகக் குடியிருப்பாளர்
  rationale: גֵּר என்பதிலிருந்து வேறுபட்ட, நிலைத்தன்மை குறைந்த குடியிருப்பு நிலையைக் காட்டுகிறது.
- source_word: וָחַי עִמָּךְ
  choice: அவன் உன்னோடு வாழும்படி செய்
  rationale: கட்டளையிடப்பட்ட ஆதரவின் நோக்கம் அல்லது விளைவை இயல்பான தமிழில் வெளிப்படுத்துகிறது; עִמָּךְ என்பதையும் ‘உன்னோடு’ என மீண்டும் தருகிறது.
theological_decisions:
- issue: ‘உன் சகோதரன்’ என்பதன் வரம்பு
  choice: மூலத்திலுள்ள உறவுமுறை மொழியை ‘உன் சகோதரன்’ என்று தக்கவைத்தல்
  alternative: ‘உன் சக இஸ்ரவேலன்’ அல்லது ‘உன் இனத்தான்’
  rationale: வசனம் சமூகத்திற்குள் உள்ள பொருளாதாரப் பொறுப்பைப் பற்றியது; ஆனாலும் விளக்கமான விரிவாக்கத்தை முதன்மை உரைக்குள் சேர்க்காமல் மூலத்தின் உறவுமுறைச் சொல்லையே தக்கவைக்கிறது.
- issue: גֵּר וְתוֹשָׁב என்பதன் இலக்கணப் பணி
  choice: ஏழையான சகோதரன் எந்த நிலையில் தொடர்ந்து வாழ வேண்டும் என்பதைக் காட்டும் ஒப்புமையாக மொழிபெயர்த்தல்
  alternative: ‘குடியிருக்கும் அந்நியனையும் தற்காலிகக் குடியிருப்பாளனையும் ஆதரி’ என்ற கூடுதல் செயப்படுபொருளாக எடுத்துக்கொள்ளுதல்
  rationale: எபிரெயத் தொடர் சுருக்கமாகவும் இலக்கண ரீதியாக இரு விதமாகப் புரிந்துகொள்ளத்தக்கதாகவும் உள்ளது. முதன்மை உரை உடனடியான தொடர்ச்சியைப் பின்பற்றுகிறது; மாற்றுப் புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, கண்ணியமான மற்றும் பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘கை தளர்தல்’ என்ற மூல உருவகம் தக்கவைக்கப்பட்டு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது; சட்ட-சமூகப் பதவிகளுக்கிடையிலான வேறுபாடும் முடிந்தவரை பாதுகாக்கப்பட்டுள்ளது.
