  to: உன் சகோதரன் வறுமையடைந்து, அவனுடைய கை உன்னோடு தளர்ந்துபோனால்[a], நீ அவனை ஆதரிக்க வேண்டும்; குடியிருக்கும் அந்நியனாகவோ தற்காலிகக் குடியிருப்பாளனாகவோ அவன் உன்னோடு வாழும்படி.[b]
