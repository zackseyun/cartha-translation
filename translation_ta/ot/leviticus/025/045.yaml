  yaml_path: translation/ot/leviticus/025/045.yaml
  text: You may also buy from the sons of the sojourners who reside with you[a], and from their families who are with you, whom they have fathered in your land[b]; and they shall become your possession.
translation:
  language: ta
  text: மேலும், உங்களோடு தங்கியிருக்கும் அந்நியக் குடியிருப்பாளர்களின் பிள்ளைகளிலிருந்தும்[a], உங்களோடு இருக்கும் அவர்களுடைய குடும்பத்தாரில், அவர்கள் உங்கள் நாட்டில் பெற்ற பிள்ளைகளிலிருந்தும் நீங்கள் வாங்கலாம்; அவர்கள் உங்களுக்கு உடைமையாவார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்களோடு தங்கியிருக்கும் அந்நியக் குடியிருப்பாளர்களின் வழித்தோன்றல்களிலிருந்து.”
    reason: בְּנֵי என்பது சொற்பட ‘மகன்கள்/பிள்ளைகள்’; சட்டச் சூழலில் அது விரிவாக ‘வழித்தோன்றல்கள்’ என்றும் பொருள்படலாம்.
  - marker: b
    text: “உடைமை” என்பது இங்கு சட்டரீதியாக மரபுவழியாக வைத்திருக்கத்தக்க சொத்துரிமையைக் குறிக்கிறது.
    reason: אֲחֻזָּה என்பதன் இச்சூழலிலுள்ள சட்டப் பொருளைத் தெளிவுபடுத்துகிறது.
lexical_decisions:
- source_word: וְגַם ... מֵהֶם תִּקְנוּ
  choice: அவர்களிலிருந்தும் நீங்கள் வாங்கலாம்
  rationale: וְגַם முந்தைய வசனத்தோடு கூடுதல் அனுமதியை இணைக்கிறது; קנה என்பதற்கு இச்சட்டச் சூழலில் வணிகப் பொருளான ‘வாங்கு’ தெளிவானது. ‘வாங்கலாம்’ என்பது சூழலிலுள்ள அனுமதிப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מִבְּנֵי
  choice: பிள்ளைகளிலிருந்து
  rationale: בְּנֵי என்பதன் அடிப்படைப் பொருள் ‘மகன்கள்/பிள்ளைகள்’; இங்கு பாலினத்தை மட்டும் குறிக்காமல் சந்ததி அல்லது வழித்தோன்றல்களைக் குறிக்கக்கூடும் என்பதால் இயல்பான விரிவுடைய ‘பிள்ளைகள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: הַתּוֹשָׁבִים הַגָּרִים עִמָּכֶם
  choice: உங்களோடு வாழும் அந்நியக் குடியிருப்பாளர்கள்
  rationale: תּוֹשָׁב மற்றும் גּוּר ஆகியவை சொந்த நாட்டினர் அல்லாத, இஸ்ரவேலரிடையே தங்கியிருக்கும் குடியிருப்பாளர்களைக் குறிக்கின்றன. ‘அந்நியக் குடியிருப்பாளர்கள்’ சட்டப் பொருளையும் நவீனத் தெளிவையும் காக்கிறது.
- source_word: וּמִמִּשְׁפַּחְתָּם אֲשֶׁר עִמָּכֶם
  choice: உங்களோடு இருக்கும் அவர்களுடைய குடும்பங்களில்
  rationale: מִשְׁפָּחָה குடும்பம் அல்லது குலக்குழுவைக் குறிக்கலாம்; பொதுவாசகனுக்குத் தெளிவான ‘குடும்பங்கள்’ இங்கு பொருத்தமானது.
- source_word: אֲשֶׁר הוֹלִידוּ בְּאַרְצְכֶם
  choice: உங்கள் நாட்டில் அவர்களுக்குப் பிறந்தவர்கள்
  rationale: הוליד என்பதன் செயப்படுத்தும் வடிவம் சொற்பட ‘பெறச் செய்தனர்/தந்தையாயினர்’ எனினும், தமிழ் இயல்புக்காகவும் சந்ததிப் பொருளைக் காக்கவும் ‘அவர்களுக்குப் பிறந்தவர்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: וְהָיוּ לָכֶם לַאֲחֻזָּה
  choice: அவர்கள் உங்கள் உடைமையாவார்கள்
  rationale: אֲחֻזָּה என்பது சட்டரீதியான உடைமை அல்லது உரிமையிலுள்ள சொத்தைக் குறிக்கிறது. மனிதர்கள் மரபுவழியாக வைத்திருக்கத்தக்க உடைமையாகக் கருதப்படும் கடுமையான சட்டநிலையை மென்மைப்படுத்தாமல் ‘உடைமை’ வெளிப்படுத்துகிறது.
theological_decisions:
- issue: அடிமைத்தனத்தையும் மனிதர்கள்மீதான சொத்துரிமையையும் குறிக்கும் சட்ட மொழி
  choice: ‘வாங்கலாம்’, ‘உடைமையாவார்கள்’ என்ற நேரடி மொழியைப் பயன்படுத்துதல்
  alternative: ‘பெற்றுக்கொள்ளலாம்’, ‘பணியாளர்களாவார்கள்’ போன்ற மென்மையான மொழி
  rationale: எபிரெயச் சட்ட மொழி மனிதர்களை வாங்குவதையும் உடைமையாக வைத்திருப்பதையும் நேரடியாகக் கூறுகிறது. மொழிபெயர்ப்பு அந்த வரலாற்றுச் சட்டநிலையை ஆதரிக்கவோ மறைக்கவோ செய்யாமல் துல்லியமாகத் தெரிவிக்க வேண்டும்.
- issue: בְּנֵי என்பதன் வரம்பு
  choice: ‘பிள்ளைகள்’ என முதன்மை உரையில் கொடுத்து, ‘வழித்தோன்றல்கள்’ என்பதைக் குறிப்பில் காட்டுதல்
  alternative: ‘மகன்கள்’ அல்லது ‘வழித்தோன்றல்கள்’ என்பதை மட்டும் முதன்மை உரையில் பயன்படுத்துதல்
  rationale: சொல்லின் அடிப்படை குடும்ப உறவையும் சட்டச் சூழலில் சாத்தியமான விரிந்த சந்ததிப் பொருளையும் இரண்டையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகனுக்குப் புரியும் வகையிலும் சட்டப்பகுதியின் கண்ணியமான ஆனால் கடுமையான தொனியை மென்மைப்படுத்தாமலும் மொழிபெயர்க்கப்பட்டுள்ளது. இரண்டாம் நபர் பன்மை ‘உங்கள்/நீங்கள்’ மூலம் காக்கப்பட்டுள்ளது.
