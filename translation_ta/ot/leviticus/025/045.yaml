revisions:
- from: உங்களோடு வாழும் அந்நியக் குடியிருப்பாளர்களின் பிள்ளைகளிலிருந்தும்[a], உங்களோடு இருக்கும் அவர்களுடைய குடும்பங்களில் உங்கள் நாட்டில் அவர்களுக்குப் பிறந்தவர்களிலிருந்தும் நீங்கள் வாங்கலாம்; அவர்கள் உங்கள் உடைமையாவார்கள்.[b]
  to: மேலும், உங்களோடு தங்கியிருக்கும் அந்நியக் குடியிருப்பாளர்களின் பிள்ளைகளிலிருந்தும்[a], உங்களோடு இருக்கும் அவர்களுடைய குடும்பத்தாரில், அவர்கள் உங்கள் நாட்டில் பெற்ற பிள்ளைகளிலிருந்தும் நீங்கள் வாங்கலாம்; அவர்கள் உங்களுக்கு உடைமையாவார்கள்.[b]
  rationale: திருத்தம் הוֹלִידוּ என்பதன் செயற்பாட்டு, சந்ததி-மையமான பொருளை ‘அவர்கள் உங்கள் நாட்டில் பெற்ற பிள்ளைகள்’ என வெளிப்படுத்துகிறது; அதேவேளை நவீன நிலையான தமிழில் வாசிக்கத்தக்க சட்டத் தொனியையும் நேரடியான வாங்குதல்/உடைமை மொழியையும் காக்கிறது. குறிப்பு b இப்போது ‘உடைமையாவார்கள்’ என்பதோடு நேரடியாக இணைக்கப்பட்டுள்ளது.
