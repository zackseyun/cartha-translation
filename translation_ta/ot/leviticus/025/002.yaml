- from: '“இஸ்ரவேலரிடம் பேசு; அவர்களிடம் சொல்: ‘நான் உங்களுக்குக் கொடுக்கிற நாட்டிற்குள் நீங்கள் வரும்போது, அந்த நாடு யெகோவாவுக்காக ஓய்வுநாளைக் கடைப்பிடிக்க வேண்டும்.[a]’”'
