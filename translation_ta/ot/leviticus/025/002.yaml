source:
  edition: WLC
  text: דַּבֵּ֞ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם כִּ֤י תָבֹ֨אוּ֙ אֶל הָ/אָ֔רֶץ אֲשֶׁ֥ר אֲנִ֖י נֹתֵ֣ן לָ/כֶ֑ם וְ/שָׁבְתָ֣ה הָ/אָ֔רֶץ שַׁבָּ֖ת לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/002.yaml
  text: Speak to the sons of Israel and say to them, ‘When you come into the land that I am giving to you, then the land shall keep a Sabbath to Yahweh.
translation:
  language: ta
  text: '“இஸ்ரவேல் மக்களிடம் பேசு; அவர்களிடம் சொல்: ‘நான் உங்களுக்குக் கொடுக்கிற நாட்டிற்குள் நீங்கள் வரும்போது, அந்த நாடு யாவேக்கென்று ஒரு சபத்து ஓய்வை அனுசரிக்க வேண்டும்.[a]’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்த நாடு யாவேக்காக ஓய்வெடுக்க வேண்டும்.” எபிரெயத்தில் நாடு சபத்து ஓய்வை அனுசரிப்பதாக உருவகப்படுத்தப்படுகிறது.
    reason: மூலத்தின் உருவகத்தையும் “சபத்து ஓய்வு” என்பதன் மாற்று இயல்பான வெளிப்பாட்டையும் விளக்குகிறது.
lexical_decisions:
- source_word: דַּבֵּר אֶל־בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலரிடம் பேசு
  rationale: בְּנֵי יִשְׂרָאֵל என்பதன் சொற்பொருள் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு முழு உடன்படிக்கை மக்களையும் குறிக்கும் இயல்பான நவீனத் தமிழ் வடிவமாக ‘இஸ்ரவேலர்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: அவர்களிடம் சொல்
  rationale: கட்டளையின் தொடர்ச்சியையும் எபிரெயச் சட்டநடையின் மறுபடியும் கூறும் அமைப்பையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: כִּי תָבֹאוּ אֶל־הָאָרֶץ
  choice: நாட்டிற்குள் நீங்கள் வரும்போது
  rationale: כִּי இங்கு எதிர்பார்க்கப்படும் எதிர்கால நிகழ்வை அறிமுகப்படுத்தும் காலப்பொருளில் வருகிறது; בוא + אֶל நாட்டிற்குள் நுழைவதைச் சுட்டுகிறது.
- source_word: אֲשֶׁר אֲנִי נֹתֵן לָכֶם
  choice: நான் உங்களுக்குக் கொடுக்கிற
  rationale: נֹתֵן என்னும் பங்கேற்புவினையின் நிகழ்/நெருங்கிய செயற்பாட்டுத் தன்மையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְשָׁבְתָה הָאָרֶץ שַׁבָּת
  choice: அந்த நாடு ஓய்வுநாளைக் கடைப்பிடிக்க வேண்டும்
  rationale: நிலம் ஓய்வுநாளை அனுசரிப்பதாக உருவகப்படுத்தும் எபிரெயச் சொற்றொடரைப் பாதுகாக்கிறது; ‘கடைப்பிடிக்க வேண்டும்’ என்பது சட்டக் கட்டளையின் வலிமையையும் காட்டுகிறது.
- source_word: לַיהוָה
  choice: யெகோவாவுக்காக
  rationale: לְ முன்னிடைச்சொல்லின் அர்ப்பணிப்பு/நோக்கப் பொருளை ‘-க்காக’ வெளிப்படுத்துகிறது; יהוה என்ற தனிப்பெயர் தமிழில் பரவலாக அறியப்பட்ட ‘யெகோவா’ என ஒலிபெயர்க்கப்பட்டது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே / கர்த்தர்
  rationale: மூலத்தில் உள்ள உடன்படிக்கைத் தனிப்பெயரை பொதுப்பட்டமாக மாற்றாமல் வெளிப்படையாகக் காக்கிறது. உச்சரிப்பின் வரலாற்று நிச்சயமின்மையால் மாற்று ஒலிபெயர்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- issue: நாடு ஓய்வுநாளைக் கடைப்பிடித்தல்
  choice: நாட்டைச் செயற்பாட்டாளராகவே வைத்தல்
  alternative: நாட்டை ஓய்வில் விட வேண்டும்
  rationale: மூல எபிரெயம் நாட்டை உருவகமாகச் செயற்பாட்டாளராக்குகிறது; அதனை மனிதர்களுக்கான நேரடி கட்டளையாக மாற்றி அதன் இறையியல் மற்றும் இலக்கியத் தளர்வை நீக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; மரியாதையும் சட்டநடைத் தெளிவும் கொண்ட எளிய உரை. ‘தேசம்’ என்பதற்குப் பதில் பொதுவழக்கிலுள்ள ‘நாடு’ பயன்படுத்தப்பட்டது. வசனம் முந்தைய வசனத்தில் தொடங்கும் இறைவாக்கின் நேரடி உரையாக இருப்பதால் மேற்கோள் குறிகள் இடப்பட்டன.
