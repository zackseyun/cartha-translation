source:
  edition: WLC
  text: וּ/בְ/כֹ֖ל אֶ֣רֶץ אֲחֻזַּתְ/כֶ֑ם גְּאֻלָּ֖ה תִּתְּנ֥וּ לָ/אָֽרֶץ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/024.yaml
  text: And in all the land of your possession[b][a], you shall grant redemption for the land.
translation:
  language: ta
  text: மேலும், உங்களுக்குரிய நிலம் முழுவதிலும், நிலத்தை மீட்டுக்கொள்ளும் உரிமையை நீங்கள் வழங்க வேண்டும்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நிலத்தை மீட்டுக்கொள்ள வழிவகை செய்ய வேண்டும்.”
    reason: lexical_alternative
  - marker: b
    text: “உங்களுக்குரிய நிலம்” என்பது இஸ்ரவேலருக்குப் பங்காகக் கிடைத்த மரபுரிமை நிலச்சொத்தை அல்லது நிலப்பங்கைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וּבְכֹל
  choice: மேலும், ... எங்கும்
  rationale: இணைப்புச் சொல்லையும் முழுப் பரப்பைக் குறிக்கும் பொருளையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֶרֶץ
  choice: நிலம்
  rationale: இந்தச் சட்டச் சூழலில் இது முழு பூமியையோ நாட்டையோ அல்ல, நிலச் சொத்தைக் குறிக்கிறது.
- source_word: אֲחֻזַּתְכֶם
  choice: உங்கள் உடைமை நிலம்
  rationale: இஸ்ரவேலருக்குப் பங்காகக் கிடைத்த நிலவுடைமையைக் குறிக்கும் சட்டப்பொருளைத் தக்கவைக்கிறது; மரபுரிமை சார்ந்த பின்னணி அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: גְּאֻלָּה
  choice: மீட்டுக்கொள்ளும் உரிமை
  rationale: விற்கப்பட்ட நிலத்தை விலை கொடுத்து மீண்டும் பெறும் செயல் அல்லது அதற்கான சட்ட உரிமை ஆகிய பொருள்களை இச்சூழலில் தெளிவாகத் தெரிவிக்கிறது.
- source_word: תִּתְּנוּ
  choice: நீங்கள் வழங்க வேண்டும்
  rationale: எழுத்துப்பொருளான ‘கொடுப்பீர்கள்’ என்பதன் சட்டரீதியான கட்டளையை இயல்பான தமிழில் எடுத்துரைக்கிறது.
- source_word: לָאָרֶץ
  choice: அந்த நிலத்தை
  rationale: எபிரெய மொழியில் ‘நிலத்துக்கு’ என்ற அமைப்பு இருந்தாலும், தமிழில் மீட்டுக்கொள்ளப்படும் பொருளாக நிலத்தைக் குறிப்பிடுவது இயல்பாகவும் சூழலுக்கு உண்மையாகவும் உள்ளது.
theological_decisions:
- issue: விற்கப்பட்ட பங்குரிமை நிலத்துக்கான கட்டளையின் தன்மை
  choice: நிலத்தை மீட்டுக்கொள்ளும் உரிமை வழங்கப்பட வேண்டும் என்ற சட்டக் கட்டளையாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘நிலத்துக்கு மீட்பு வழங்க வேண்டும்’ என்று சொல்லர்த்தத்திற்கு இன்னும் நெருக்கமாக மொழிபெயர்க்கலாம்.
  rationale: லேவியராகமம் 25-ன் நிலவுடைமைச் சட்டச் சூழல், நிலத்தை மீண்டும் பெறுவதற்கான நடைமுறை வாய்ப்பு அல்லது உரிமையைச் சுட்டுகிறது. பிற்கால இறையியல் சார்ந்த ‘மீட்பு’ கருத்துகளை இங்கு புகுத்தாமல் சட்டப்பொருள் தெளிவாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான சட்ட நடையில் அமைக்கப்பட்டது. ‘மீட்டுக்கொள்ளும் உரிமை’ என்பது சூழலைத் தெளிவாக்கினாலும், மூலச்சொல்லில் செயல் மற்றும் உரிமை இரண்டும் சாத்தியமுள்ளதால் மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
