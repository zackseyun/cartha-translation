base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/039.yaml
  text: And if your brother becomes poor with you and sells himself to you[b][a], you shall not make him serve as a servant.
translation:
  language: ta
  text: உன் சகோதரன் உன்னோடு இருக்கையில் வறுமையடைந்து, தன்னை உனக்கு விற்றுக்கொண்டால்[a], அவனை அடிமையின் வேலையைச் செய்ய வைக்காதே[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உனக்கு விற்கப்பட்டால்.” எபிரேயச் சொற்றொடரைச் செயப்பாட்டு வடிவிலும் மொழிபெயர்க்கலாம்; இச்சூழலில் வறுமையால் ஒருவர் கடன் பணிக்காகத் தம்மையே விற்றுக்கொள்வதை இது குறிக்கிறது.
    reason: alternative_reading
  - marker: b
    text: நேரடியாக, “அவனை அடிமையின் பணியைச் செய்யவைக்காதே.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי יָמוּךְ
  choice: வறுமையடைந்து
  rationale: வறிய நிலைக்குத் தாழ்வதைச் சுட்டும் வினையை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; நிபந்தனை அமைப்பு முழு வாக்கியத்தின் ‘-ஆல்’ முடிவால் வெளிப்படுகிறது.
- source_word: אָחִיךָ
  choice: உன் சகோதரன்
  rationale: எபிரெய மொழியின் குடும்ப உறவுச் சொல்லை நேரடியாகத் தக்கவைக்கிறது; சூழலில் இது உடன்படிக்கைச் சமூகத்தைச் சேர்ந்த ஒருவரையும் குறிக்கக்கூடும்.
- source_word: עִמָּךְ
  choice: உன்னோடு வாழும்
  rationale: ‘உன்னோடு/உன்னிடம்’ என்ற உறவுசார் சூழலைத் தமிழில் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: וְנִמְכַּר לָךְ
  choice: தன்னை உனக்கு விற்றுக்கொண்டால்
  rationale: நிஃபால் வடிவின் சட்டச் சூழலிலுள்ள தன்னை விற்றுக்கொள்ளும் பொருளை வெளிப்படுத்துகிறது; இலக்கணரீதியான ‘உனக்கு விற்கப்பட்டால்’ என்ற வாசிப்பும் அடிக்குறிப்பில் தக்கவைக்கப்படுகிறது.
- source_word: לֹא תַעֲבֹד בּוֹ
  choice: அவனை ... வேலை செய்ய வைக்காதே
  rationale: அவனிடமிருந்து உழைப்பைக் கட்டாயப்படுத்தக் கூடாது என்ற causative பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: עֲבֹדַת עָבֶד
  choice: அடிமையைப்போல்
  rationale: ‘அடிமையின் வேலை/பணி’ என்ற எபிரெயச் சொல்லிணையின் சமூக அந்தஸ்தையும் உழைப்பின் தன்மையையும் சுருக்கமாகவும் தெளிவாகவும் காட்டுகிறது.
theological_decisions:
- issue: கடன் காரணமான பணிச் சூழலில் עבד என்ற சமூக-அந்தஸ்துச் சொல்லின் மொழிபெயர்ப்பு
  choice: அடிமையைப்போல்
  alternative: வேலைக்காரனைப்போல்; அடிமையின் வேலையை
  rationale: இவ்வசனம் எல்லா பணியையும் மறுப்பதில்லை; வறுமையடைந்த சகோதரனை அடிமைக்குரிய அந்தஸ்திலும் உழைப்பு முறையிலும் நடத்துவதைத் தடை செய்கிறது. ‘அடிமை’ என்பது அந்த வலிமையை மறைக்காமல் காக்கிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழ்; ஒருமை இரண்டாம் நபர் சட்டக் கட்டளையின் நேர்த்தியைத் தக்கவைக்கும் dignified, பொதுவாகப் புரியும் நடை. ‘சகோதரன்’ என்ற மூல உருவகம் விளக்கமாக மாற்றப்படாமல் வைக்கப்பட்டுள்ளது.
