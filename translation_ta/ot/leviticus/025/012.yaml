  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: כִּ֚י יוֹבֵ֣ל הִ֔וא קֹ֖דֶשׁ תִּהְיֶ֣ה לָ/כֶ֑ם מִן הַ֨/שָּׂדֶ֔ה תֹּאכְל֖וּ אֶת תְּבוּאָתָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/012.yaml
  text: For it is a jubilee; it shall be holy to you[a]. From the field you shall eat its produce.
translation:
  language: ta
  text: ஏனெனில், அது யூபிலி ஆண்டு; அது உங்களுக்குப் பரிசுத்தமானதாக இருக்க வேண்டும். வயலிலிருந்து கிடைக்கும் விளைச்சலை[a] நீங்கள் உண்ண வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “விளைபொருளை” அல்லது “பயிரை.” எபிரெயச் சொல் வயல் விளைவிப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கட்டளைக்கான காரணத்தை அறிமுகப்படுத்தும் இணைப்புச் சொல்லாக இங்கு வருகிறது.
- source_word: יוֹבֵל
  choice: யூபிலி ஆண்டு
  rationale: லேவியராகமம் 25-இல் இது ஆட்டுக்கொம்பைக் குறிக்காமல், சிறப்பாக அனுசரிக்கப்படும் ஐம்பதாவது ஆண்டைக் குறிக்கிறது. தமிழில் புரிதலுக்காக ‘ஆண்டு’ சேர்க்கப்பட்டுள்ளது.
- source_word: קֹדֶשׁ תִּהְיֶה לָכֶם
  choice: அது உங்களுக்குப் பரிசுத்தமானதாக இருக்க வேண்டும்
  rationale: קֹדֶשׁ என்பதன் உடன்படிக்கை சார்ந்த பரிசுத்தத்தையும் தனியே ஒதுக்கப்பட்ட நிலையையும் ‘பரிசுத்தமானது’ காக்கிறது; சட்ட உரையின் கட்டளைத் தன்மையை ‘இருக்க வேண்டும்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מִן הַשָּׂדֶה
  choice: வயலிலிருந்து
  rationale: வழக்கமான அறுவடை மற்றும் சேமிப்பிலிருந்து அல்லாமல், நிலத்தில் கிடைப்பதிலிருந்து உண்பதை நேரடியாகச் சுட்டுகிறது.
- source_word: תֹּאכְלוּ
  choice: நீங்கள் உண்ண வேண்டும்
  rationale: சட்டப் பின்னணியில் இந்த வினைவடிவம் அறிவுறுத்தல் அல்லது கடமையை வெளிப்படுத்துகிறது.
- source_word: תְּבוּאָתָהּ
  choice: கிடைக்கும் விளைச்சலை
  rationale: நிலம் அல்லது வயல் விளைவிப்பதைப் பரந்த வகையில் குறிக்கிறது; யூபிலி ஆண்டில் தானாகக் கிடைக்கும் விளைவையும் உள்ளடக்கும் இயல்பான நவீனத் தமிழ்ச் சொற்றொடர் இது.
theological_decisions:
- issue: யூபிலி ஆண்டுக்குரிய பரிசுத்த மொழிநடை
  choice: அது உங்களுக்குப் பரிசுத்தமானதாக இருக்க வேண்டும்
  alternative: அது உங்களுக்குப் புனிதமானதாக / தனியே ஒதுக்கப்பட்டதாக இருக்க வேண்டும்
  rationale: யூபிலி ஆண்டுக்கே இஸ்ரவேலரின் அனுசரிப்போடு தொடர்புடைய உடன்படிக்கைப் பரிசுத்தம் அளிக்கப்படுவதை இவ்வாசகம் காக்கிறது; அதை வெறும் சமூக அல்லது சடங்கு சிறப்பாகக் குறுக்கவில்லை.
translation_notes:
  register: நவீன நிலையான, மரியாதைமிக்க தமிழ் பயன்படுத்தப்பட்டுள்ளது. சட்ட உரையின் கட்டளைத் தொனி காக்கப்பட்டாலும், சொற்றொடர் சாதாரண வாசகர்களுக்குப் புரியும் வகையில் அமைக்கப்பட்டுள்ளது. ‘யூபிலி’ என்ற தொழில்நுட்பச் சொல்லுடன் பொருளைத் தெளிவாக்க ‘ஆண்டு’ சேர்க்கப்பட்டுள்ளது.
