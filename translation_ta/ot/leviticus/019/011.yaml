  yaml_path: translation/ot/leviticus/019/011.yaml
  text: You shall not steal[a], and you shall not deal falsely, and you shall not lie to one another.
translation:
  language: ta
  text: நீங்கள் திருடக்கூடாது; வஞ்சகமாக நடந்துகொள்ளக்கூடாது; ஒருவருக்கொருவர்[a] பொய் சொல்லக்கூடாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “ஒவ்வொருவனும் தன் உடனிருப்பவரிடம்”; அல்லது, “ஒவ்வொருவரும் தம் அயலாரிடம்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּגְנֹבוּ
  choice: நீங்கள் திருடக்கூடாது
  rationale: לֹא உடன் வரும் Qal imperfect இங்கு சட்டரீதியான தடையைத் தெரிவிக்கிறது. גנב என்பதன் நேரடியான பொருளை இயல்பான நவீனத் தமிழில் ‘திருடக்கூடாது’ எனத் தெளிவாக வழங்குகிறது.
- source_word: תְכַחֲשׁוּ
  choice: மோசடியாக நடந்துகொள்ளக்கூடாது
  rationale: כחש என்பதன் Piel வடிவம் ஏமாற்றுதல், பொய்யாக மறுத்தல், நேர்மையின்றி நடந்துகொள்ளுதல் ஆகிய பொருள் நிழல்களைக் கொண்டது. அடுத்துள்ள ‘பொய் சொல்லுதல்’ என்பதிலிருந்து வேறுபாட்டைக் காத்து, நேர்மையற்ற நடத்தையை விரிவாகக் குறிக்க இந்தச் சொற்றொடர் தேர்ந்தெடுக்கப்பட்டது.
- source_word: תְשַׁקְּרוּ
  choice: பொய் சொல்லக்கூடாது
  rationale: שקר என்பதன் Piel வடிவம் இச்சூழலில் பொய் கூறுவதைக் குறிக்கிறது. தமிழில் ‘பொய் சொல்லுதல்’ இயல்பாகவும் நேரடியாகவும் அதன் வாய்மொழிசார் வலிமையை வெளிப்படுத்துகிறது.
- source_word: אִישׁ בַּעֲמִיתוֹ
  choice: ஒருவருக்கொருவர்
  rationale: சொல்லுக்குச் சொல் வடிவம் ‘ஒருவன் தன் சக மனிதனிடம்’ என்பதற்கு நெருக்கமானது; ஆனால் சூழலில் இது பகிர்ந்தளிக்கும், பரஸ்பரமான பொருளைக் கொண்டுள்ளது. ‘ஒருவருக்கொருவர்’ பாலின வரம்பைத் தவிர்த்து அந்த உறவுசார் பொருளை இயல்பாகத் தருகிறது.
- source_word: עֲמִית
  choice: ஒருவருக்கொருவர் என்ற முழுச் சொற்றொடருக்குள் பிரதிபலிப்பு
  rationale: עֲמִית என்பது உடனிருப்பவர், சக சமூக உறுப்பினர் அல்லது அயலார் என்பதைக் குறிக்கலாம். אִישׁ ... עֲמִיתוֹ என்ற முழு எபிரெயச் சொற்றொடரைத் தமிழில் பரஸ்பர வினையுறவாக வழங்குவது இங்கு மிக இயல்பானது.
theological_decisions:
- issue: אִישׁ ... עֲמִיתוֹ என்ற இலக்கண ஆண்பால் பகிர்ந்தளிப்பு வெளிப்பாடு
  choice: முதன்மை உரையில் பாலினம் உள்ளடங்கிய ‘ஒருவருக்கொருவர்’
  alternative: ‘ஒருவன் தன் சக மனிதனிடம்’ அல்லது ‘ஒவ்வொருவனும் தன் அயலானிடம்’
  rationale: எபிரெயில் ஆண்பால் ஒருமை வடிவம் இருந்தாலும், கட்டளை ஆண்களுக்கு மட்டும் வரையறுக்கப்படவில்லை; அது சமூக உறுப்பினர்களைப் பொதுவாகக் குறிக்கிறது. ஆகவே மூல நோக்கத்தைப் பாதுகாக்க உள்ளடக்கமான பரஸ்பர வடிவம் பயன்படுத்தப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுமக்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான சட்ட/அறிவுறுத்தல் நடை பயன்படுத்தப்பட்டுள்ளது. மூன்று தடைகளும் ஒரே இலக்கண ஓட்டத்தில் வைக்கப்பட்டுள்ளன; כחש மற்றும் שקר ஆகியவற்றின் வேறுபாட்டைக் காக்க ‘மோசடியாக நடந்துகொள்ளுதல்’ மற்றும் ‘பொய் சொல்லுதல்’ எனத் தனித்தனியாக மொழிபெயர்க்கப்பட்டுள்ளன.
