  source_fidelity: முதன்மை உரை எபிரெயச் சட்ட மொழியின் பொருளை பெருமளவு சரியாகக் கொண்டுள்ளது. ஆனால் חִלֵּל என்பதற்கான ‘தூய்மைக்கேடாக்கினான்’ என்பது சடங்கு அசுத்தம் உண்டாக்குதல் என்ற பொருளை முன்னிறுத்தக்கூடும்; இங்கு பரிசுத்தமானதைப் புனிதமற்றதாக நடத்துதல்/அவமதித்தல் என்பதே பொருள். நֶפֶשׁ-க்குரிய மாற்று வாசகக் குறிப்பு விடுபட்டுள்ளது.
  naturalness: ‘அறுத்துப்போடப்படுவார்’ என்பதில் முன்னைய பொதுமை ஒருமை ஆண்பால் வடிவங்களுடன் மரியாதைப் பன்மை வினை பொருந்தவில்லை. ‘அறுத்து அகற்றப்படுவான்’ சட்டத் தொனியுடனும் உருவகத்துடனும் சீராக அமைகிறது.
  terminology: ‘யாவேவுக்குரிய பரிசுத்தமானது’ என்பது קֹדֶשׁ יְהוָה-வின் உறவைக் தெளிவாகக் காட்டுகிறது. ‘அவமதித்தான்’ என்பது חלל-ன் இச்சூழல் பொருளான பரிசுத்தமானதைச் சாதாரணமாக நடத்தி இழிவுபடுத்துதலை இயல்பாகத் தருகிறது. ‘அறுத்து அகற்றப்படுவான்’ தண்டனையின் நடைமுறையை வரையறுக்காமல் כרת என்ற சூத்திரத்தைப் பேணுகிறது.
