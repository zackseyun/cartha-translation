  text: וְ/אֹֽכְלָי/ו֙ עֲוֺנ֣/וֹ יִשָּׂ֔א כִּֽי אֶת קֹ֥דֶשׁ יְהוָ֖ה חִלֵּ֑ל וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מֵ/עַמֶּֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/008.yaml
  text: Whoever eats it shall bear his iniquity[a], because he has profaned the holy thing of Yahweh[d][c][b], and that person shall be cut off from his people.
translation:
  language: ta
  text: அதைச் சாப்பிடுகிறவன் தன் குற்றத்தைச் சுமப்பான்[a]. ஏனெனில், அவன் யாவேவுக்குரிய பரிசுத்தமானதை அவமதித்தான்[b]. அந்த நபர்[c] தன் மக்களிடமிருந்து அறுத்து அகற்றப்படுவான்[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தன் குற்றப்பழியைச் சுமப்பான்.’ இந்த எபிரெய மரபுத்தொடர் குற்றப்பொறுப்பையும் அதன் விளைவுகளையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘யாவேவுக்குரிய பரிசுத்தமானது’ என்பது யாவேவுக்கென அர்ப்பணிக்கப்பட்டதைக் குறிக்கிறது; இங்கே அது பலியிறைச்சியைக் குறிக்கிறது.
    reason: cultural_note
  - marker: c
    text: அல்லது, ‘அந்த ஆத்துமா.’ எபிரெயத்தில் ‘ஆத்துமா/உயிர்’ என்று உள்ளது; இச்சட்டச் சூழலில் அது அந்த நபரைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: d
    text: ‘அறுத்து அகற்றப்படுவான்’ என்பது உடன்படிக்கைத் தண்டனைச் சூத்திரம். இது மரணம், சமூகத்திலிருந்து விலக்குதல், அல்லது நேரடியான தெய்வீகத் தீர்ப்பு ஆகியவற்றில் எதைக் குறிக்கிறது என்பதை இவ்வசனம் குறிப்பிடவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֹכְלָיו
  choice: அதைச் சாப்பிடுகிறவன்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட பலியிறைச்சியைத் தடைசெய்யப்பட்ட காலத்தில் சாப்பிடும் எவரையும் எபிரெயப் பெயரெச்ச வடிவம் குறிக்கிறது; இத்தமிழாக்கம் பொதுமை ஒருமையை இயல்பாகப் பேணுகிறது.
- source_word: עֲוֺנוֹ יִשָּׂא
  choice: தன் குற்றத்தைச் சுமப்பான்
  rationale: இந்த எபிரெய மரபுத்தொடர் குற்றப்பொறுப்பையும் அதன் விளைவுகளையும் ஏற்றுக்கொள்வதைக் குறிக்கலாம்; ‘குற்றத்தைச் சுமப்பான்’ என்பது அதன் உருவகத்தையும் பொருள் விரிவையும் பேணுகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: தண்டனைக்கான காரணத்தை அறிமுகப்படுத்துவதால், நவீனத் தமிழில் தெளிவான காரண இணைப்புச் சொல் பயன்படுத்தப்பட்டது.
- source_word: קֹדֶשׁ יְהוָה
  choice: யாவேவுக்குப் பரிசுத்தமானதை
  rationale: யாவேவுக்கென அர்ப்பணிக்கப்பட்ட ஒன்றைக் குறிக்கிறது; இச்சூழலில் அது பலியிறைச்சி என்றாலும், இக்கூற்றில் இல்லாத ‘பலி’ என்ற சொல்லை முதன்மை உரையில் சேர்க்காமல் எபிரெயத்தின் பொதுமை பேணப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கெழுத்துப் பெயரை திட்டத்தின் வழக்குப்படி பெயராக ஒலிபெயர்க்கிறது.
- source_word: חִלֵּל
  choice: தூய்மைக்கேடாக்கினான்
  rationale: பரிசுத்தமானதைச் சாதாரணமாக அல்லது அவமதிப்பாக நடத்துதல் என்னும் பியேல் வினையின் பொருளை இயல்பான, கண்ணியமான தமிழில் தெரிவிக்கிறது.
- source_word: וְנִכְרְתָה
  choice: அறுத்துப்போடப்படுவார்
  rationale: உடன்படிக்கைத் தண்டனைக்குரிய எபிரெய உருவகத்தைப் பேணுகிறது; அது மரணமா, சமூக விலக்கமா, நேரடியான தெய்வீகத் தீர்ப்பா என்பதைத் தீர்மானித்துவிடவில்லை.
- source_word: הַנֶּפֶשׁ הַהִוא
  choice: அந்த நபர்
  rationale: נֶפֶשׁ என்பதன் சொற்பொருள் ‘உயிர்/ஆத்துமா’ என்றாலும், இச்சட்டச் சூழலில் முழு நபரைக் குறிக்கும்; நவீனத் தமிழில் ‘அந்த நபர்’ இயல்பானது.
- source_word: מֵעַמֶּיהָ
  choice: தன் மக்களிடமிருந்து
  rationale: பெயர்ச்சொல்லின் இலக்கணப் பாலுக்கேற்ப எபிரெயப் பின்னொட்டு பெண்பாலில் இருந்தாலும், குற்றஞ்செய்த பொதுவான நபரையே குறிக்கிறது; ‘தன்’ பாலினத்தைத் திணிக்காமல் உறவைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: ‘அறுத்துப்போடப்படுவார்’ என்ற தண்டனைச் சூத்திரத்தின் பொருள்
  choice: தண்டனை எவ்வாறு நிறைவேறும் என்பதைச் சொல்லாமல், ‘தன் மக்களிடமிருந்து அறுத்துப்போடப்படுவார்’ என்ற உருவகத்தைப் பேணுதல்.
  alternative: ‘கொல்லப்படுவார்’, ‘சமூகத்திலிருந்து விலக்கப்படுவார்’, அல்லது ‘தெய்வீகத் தீர்ப்பால் அகற்றப்படுவார்’ என்று குறிப்பாக்குதல்.
  rationale: இவ்வசனத்தில் எபிரெய உடன்படிக்கைத் தண்டனைச் சூத்திரம் அதன் நிறைவேற்ற முறையை வெளிப்படையாகக் குறிப்பிடவில்லை. ஆகவே விவாதத்திற்குரிய விளக்கத்தைத் தீர்மானிக்காமல் மூலத்தின் இறையியல் மற்றும் சட்டப் பதற்றம் பேணப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் கண்ணியமான, பொதுவாசகருக்கு எளிதில் புரியும் நடை பயன்படுத்தப்பட்டது. சட்டத் தொனியும் எபிரெய உருவகங்களின் இறையியல் எடையும் இயன்றவரை பேணப்பட்டுள்ளன; ‘தன்’ என்ற வடிவம் பொதுவான குற்றவாளியின் பாலினத்தைத் தேவையின்றி குறிப்பாக்குவதைத் தவிர்க்கிறது.
