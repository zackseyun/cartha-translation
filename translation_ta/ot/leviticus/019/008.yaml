revisions:
- from: அதைச் சாப்பிடுகிறவன் தன் குற்றத்தைச் சுமப்பான்[a]. ஏனெனில், அவன் யாவேவுக்குப் பரிசுத்தமானதைத் தூய்மைக்கேடாக்கினான்[b]. அந்த நபர் தன் மக்களிடமிருந்து அறுத்துப்போடப்படுவார்[c].
  to: அதைச் சாப்பிடுகிறவன் தன் குற்றத்தைச் சுமப்பான்[a]. ஏனெனில், அவன் யாவேவுக்குரிய பரிசுத்தமானதை அவமதித்தான்[b]. அந்த நபர்[c] தன் மக்களிடமிருந்து அறுத்து அகற்றப்படுவான்[d].
  rationale: திருத்தம் חלל என்பதன் ‘அவமதித்தல்/பரிசுத்தத்தை மீறுதல்’ என்ற பொருளைச் சடங்கு அசுத்தம் என்ற கூடுதல் நுணுக்கமின்றித் தருகிறது. மேலும் பொதுமை ஒருமை நடை ஒற்றுமைப்படுத்தப்பட்டு, நֶפֶשׁ குறித்த ஆங்கில ஆய்வுத் தடத்தின் மாற்று வாசகக் குறிப்பு பொருத்தமான இடத்தில் சேர்க்கப்பட்டுள்ளது. ‘அறுத்து அகற்றப்படுவான்’ என்ற சொல்லாக்கம் தண்டனையின் செயல்முறையைத் தீர்மானிக்கவில்லை.
