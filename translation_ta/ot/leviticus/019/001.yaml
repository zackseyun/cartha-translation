  yaml_path: translation/ot/leviticus/019/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ta
  text: 'யாவே மோசேயிடம்[a] கூறினார்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில்: ‘YHWH’; பாரம்பரியமாக ‘கர்த்தர்’ என்று மொழிபெயர்க்கப்படுகிறது.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பேசினார்
  rationale: דבר என்பதன் தொடர்நிகழ்வு வடிவம் ஒரு புதிய உரையாடல் நிகழ்வை அறிமுகப்படுத்துகிறது; தெய்வீக உரை அறிமுகச் சூத்திரத்தில் ‘பேசினார்’ என்பது இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: יהוה என்ற இறைப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரிந்துகொள்ளத்தக்க ஒலிபெயர்ப்பாக ‘யாவே’ என்று வழங்குகிறது.
- source_word: אֶל
  choice: -யிடம்
  rationale: பேச்சு யாரை நோக்கிச் சொல்லப்பட்டது என்பதைக் குறிக்கும் எபிரெய முன்னிடைச்சொல்லுக்கு இயல்பான தமிழ் வேற்றுமை வடிவம்.
- source_word: מֹשֶׁה
  choice: மோசே
  rationale: மֹשֶׁה என்ற தனிப்பெயரின் தமிழில் நிலைபெற்ற வடிவம்.
- source_word: לֵאמֹר
  choice: சொன்னார்
  rationale: எபிரெய உரை அறிமுகச் சூத்திரமான לֵאמֹר அடுத்து வரும் நேரடி உரையை அறிமுகப்படுத்துகிறது; ‘பேசிச் சொன்னார்’ என்பது அதன் செயல்பாட்டை இயல்பான தமிழில் காக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரையில் பட்டம் அல்ல, நான்கு எழுத்துகளைக் கொண்ட தனிப்பட்ட இறைப்பெயரே உள்ளது. ஆகவே அதை மறைக்காமல் ஒலிபெயர்க்கப்பட்டுள்ளது; பாரம்பரிய பட்ட வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டது. எபிரெய உரை அறிமுகச் சூத்திரத்தின் மீளுரைப்பை முற்றிலும் நீக்காமல் ‘பேசிச் சொன்னார்’ என இயல்பாக்கப்பட்டுள்ளது.
