id: LEV.19.37
reference: Leviticus 19:37
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּ֤ם אֶת כָּל חֻקֹּתַ/י֙ וְ/אֶת כָּל מִשְׁפָּטַ֔/י וַ/עֲשִׂיתֶ֖ם אֹתָ֑/ם אֲנִ֖י יְהוָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/037.yaml
  text: So you shall keep all my statutes and all my judgments[a], and do them. I am Yahweh.
translation:
  language: ta
  text: ஆகவே, என் எல்லாக் கட்டளைகளையும் என் எல்லா நீதித் தீர்ப்புகளையும்[a] கடைப்பிடித்து, அவற்றின்படி நடங்கள். நானே யாவே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கட்டளைகள்’ என்பதற்கு ‘நியமங்கள்’ என்றும், ‘நீதித் தீர்ப்புகள்’ என்பதற்கு ‘விதிமுறைகள்’ அல்லது ‘சட்டத் தீர்ப்புகள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய மொழியில் இங்கு இரு வேறுபட்ட சட்டச் சொற்கள் பயன்படுத்தப்பட்டுள்ளன.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׁמַרְתֶּם
  choice: ஆகவே ... கடைப்பிடித்து
  rationale: שׁמר என்பதன் உடன்படிக்கை மற்றும் சட்டச் சூழலுக்குரிய ‘கடைப்பிடித்தல்’ என்ற பொருளைத் தருகிறது. தொடக்க இணைப்புச் சொல், அதிகாரத்தின் முடிவில் வரும் தொகுப்புரைப் பொருளை வெளிப்படுத்த ‘ஆகவே’ என மொழிபெயர்க்கப்பட்டது.
- source_word: כָּל
  choice: எல்லா
  rationale: இரு இடங்களிலும் எபிரெயச் சொல்லின் முழுமையான உள்ளடக்கத்தைப் பேணுகிறது.
- source_word: חֻקֹּתַי
  choice: என் கட்டளைகள்
  rationale: חֻקִּים என்பது விதிக்கப்பட்ட சட்டங்கள் அல்லது நியமங்களைக் குறிக்கிறது. நவீனத் தமிழில் இயல்பாகப் புரிய ‘கட்டளைகள்’ தேர்ந்தெடுக்கப்பட்டது; அடுத்த சட்டச் சொல்லிலிருந்து வேறுபாடு பேணப்பட்டுள்ளது.
- source_word: מִשְׁפָּטַי
  choice: என் நீதித் தீர்ப்புகள்
  rationale: מִשְׁפָּטִים என்பது நீதித் தீர்ப்புகள், சட்டத் தீர்மானங்கள் அல்லது விதிமுறைகளைக் குறிக்கலாம். ‘நீதித் தீர்ப்புகள்’ சட்டப் பதிவையும் חֻקִּים என்பதிலிருந்து உள்ள சொல்வேறுபாட்டையும் காக்கிறது.
- source_word: וַ/עֲשִׂיתֶם אֹתָם
  choice: அவற்றின்படி நடங்கள்
  rationale: சட்டங்களைப் பொருளாகக் கொண்ட עשה, அவற்றைச் செய்தல் அல்லது நடைமுறைப்படுத்துதல் என்று பொருள்படும். சொற்சொற் பெயர்ப்பான ‘அவற்றைச் செய்யுங்கள்’ என்பதைவிட, தமிழில் இயல்பாக அதே செயல்பாட்டு வலிமையைத் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநான்கெழுத்தான இறைப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகவும் இயல்பாகவும் ஒலிபெயர்க்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: யெகோவா; ஆண்டவர்
  rationale: மூலத்தில் தனிப்பட்ட இறைப்பெயர் நேரடியாக உள்ளது. ஆகவே பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்த்து, உடன்படிக்கைப் பெயரின் தன்மையைப் பேணுகிறது.
- issue: இரு தனித்த சட்டச் சொற்களின் தொடர்பு
  choice: கட்டளைகள் / நீதித் தீர்ப்புகள்
  alternative: நியமங்கள் / விதிமுறைகள்
  rationale: חֻקִּים மற்றும் מִשְׁפָּטִים ஆகியவற்றை ஒரே பொதுச்சொல்லாகக் கலக்காமல், அவற்றிடையிலான உண்மையான சொற்பொருள் வேறுபாட்டைப் பேணுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, மதிப்புமிக்க சட்ட மற்றும் உடன்படிக்கைப் பதிவு பயன்படுத்தப்பட்டுள்ளது. பன்மை முன்னிலை வினைகள் தெளிவாக உள்ளன; இறுதி ‘நானே யாவே’ என்பது மூலத்தின் சுருக்கமான வலியுறுத்தலைப் பேணுகிறது.
