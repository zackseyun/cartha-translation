  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் லேவியராகமத்தின் புனிதத்தன்மைச் சொல்லாட்சியை இழக்காத வகையிலும் மொழிபெயர்க்கப்பட்டது. ‘விபசாரம்’ என்ற சொல் மூலத்தின் பாலியல் உருவகத்தைத் தெளிவாகத் தக்கவைக்கிறது; ‘நாடே’ என்பது உருவகத்தின் வலிமையை எடுத்துக்காட்டுகிறது.
