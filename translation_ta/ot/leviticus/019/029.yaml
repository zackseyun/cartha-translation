base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/029.yaml
  text: Do not profane your daughter by making her a prostitute[c][b][a], lest the land become prostituted and the land be filled with depravity.
translation:
  language: ta
  text: உன் மகளை விபசாரம் செய்யவைத்து[a] அவளைப் புனிதம் இழக்கச் செய்யாதே. இல்லையெனில், நாடு விபசாரத்தில் ஈடுபடும்[b]; நாடு வெட்கக்கேடான ஒழுக்கக்கேட்டால்[c] நிறைந்துவிடும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவளை விபசாரத்தில் ஈடுபடுத்தி’ அல்லது ‘அவளை விபசாரியாக்கி.’ எபிரெய வினை காரணவினைப் பொருளுடையது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லர்த்தமாக, ‘நாடு விபசாரம் செய்யும்.’ சமுதாயம் முழுவதும் சீரழிவதைக் குறித்து இந்தச் சொற்றொடர் உருவகமாகப் பேசுகிறது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘வெட்கக்கேடான நடத்தை,’ ‘கொடுமையான ஒழுக்கக்கேடு’ அல்லது ‘தீமை.’ எபிரெயச் சொல், பெரும்பாலும் பாலியல் சூழலில், எல்லைமீறிய ஒழுக்கச் சீர்கேட்டைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּחַלֵּל
  choice: புனிதமற்றவளாக்காதே
  rationale: חלל என்பதன் பியேல் வடிவம் இங்கு ஒருவரின் புனித நிலையைப் பாழாக்குதல் அல்லது அவரைப் பொதுவான/தீட்டான நிலைக்குக் கொண்டுவருதல் என்ற பொருளைக் கொண்டது. லேவியராகமத்தின் புனிதம்–புனிதமின்மை கருத்துலகைத் தக்கவைக்க இந்தச் சொற்றொடர் தேர்ந்தெடுக்கப்பட்டது.
- source_word: בִּתְּךָ
  choice: உன் மகளை
  rationale: இது இரண்டாம் நபர் ஆண்பால் ஒருமை உடைமை விகுதியுடன் வரும் ‘மகள்’ என்னும் நேரடியான உறவுப்பெயர்; ஒருமை தக்கவைக்கப்பட்டது.
- source_word: לְהַזְנוֹתָהּ
  choice: விபசாரம் செய்யவைத்து
  rationale: 'זנה என்பதன் ஹிஃபில் வினையெச்சம் காரணவினைப் பொருளுடையது: மகளை விபசாரம் செய்யும்படி செய்வது. ‘செய்யவைத்து’ என்பது அந்தக் காரணவினைத் தன்மையைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.'
- source_word: תִזְנֶה הָאָרֶץ
  choice: நாடே விபசாரத்தில் ஈடுபட்டு
  rationale: எபிரெயத்தில் ‘நாடு விபசாரம் செய்யும்’ என்ற துணிவான உருவகம் உள்ளது. அதை பொதுவான ஒழுக்கச் சீரழிவாகத் தட்டையாக்காமல், தமிழில் புரியும்படி உருவகம் தக்கவைக்கப்பட்டது.
- source_word: וּמָלְאָה הָאָרֶץ
  choice: நாடு … நிறைந்துவிடும்
  rationale: முந்தைய தடை மீறப்பட்டால் ஏற்படும் விளைவை இந்த வினை எடுத்துரைக்கிறது. ‘நிறைந்துவிடும்’ என்பது எச்சரிக்கையின் விளைவுத்தன்மையை இயல்பான தமிழில் காட்டுகிறது.
- source_word: זִמָּה
  choice: சீர்கேடு
  rationale: இந்தச் சொல், குறிப்பாகப் பாலியல் சூழலில், வெட்கக்கேடான தீய திட்டத்தையோ கடுமையான ஒழுக்கச் சீரழிவையோ குறிக்கலாம். ‘சீர்கேடு’ அதன் பரந்த ஒழுக்கப் பொருளைத் தக்கவைக்கிறது; பாலியல் பொருளை மட்டும் கட்டாயப்படுத்துவதில்லை.
theological_decisions:
- issue: நாடு ‘விபசாரம் செய்வது’ என்ற உருவகத்தை எவ்வாறு மொழிபெயர்ப்பது
  choice: ‘நாடே விபசாரத்தில் ஈடுபட்டு’ என்று உருவகத்தைத் தக்கவைத்தல்
  alternative: ‘நாடு ஒழுக்கம் கெட்டு’ என்று பொதுப்படுத்துதல்
  rationale: மூல உரை தனிநபரின் பாலியல் தவறு சமூகமெங்கும் பரவும் சீரழிவாக மாறுவதை விபசார உருவகத்தால் வலியுறுத்துகிறது. அந்த இறையியல் மற்றும் சொற்பொழிவுத் தீவிரத்தைத் தக்கவைக்க உருவகம் பாதுகாக்கப்பட்டது.
- issue: חלל என்பதைக் லேவியராகமத்தின் புனிதத்தன்மைச் சொல்லாட்சியில் மொழிபெயர்ப்பதா
  choice: ‘புனிதமற்றவளாக்காதே’
  alternative: ‘அவமதிக்காதே’ அல்லது ‘தீட்டுப்படுத்தாதே’
  rationale: லேவியராகமத்தின் புனிதம்–புனிதமின்மை வேறுபாட்டை ‘புனிதமற்றவளாக்காதே’ நேரடியாகக் காக்கிறது. ‘அவமதிக்காதே’ மிகவும் பொதுவானது; ‘தீட்டுப்படுத்தாதே’ என்பது சடங்குசார் தீட்டாக மட்டும் தவறாகப் புரியப்படக்கூடும்.
