  text: אִ֣ישׁ אִמּ֤/וֹ וְ/אָבִי/ו֙ תִּירָ֔אוּ וְ/אֶת שַׁבְּתֹתַ֖/י תִּשְׁמֹ֑רוּ אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/003.yaml
  text: Each man shall fear his mother and his father[a], and you shall keep my Sabbaths[b]. I am Yahweh your God.
translation:
  language: ta
  text: ஒவ்வொரு ஆணும்[a] தன் தாயையும் தந்தையையும் அஞ்ச வேண்டும்[b]; நீங்கள் என் ஓய்வுநாட்களைக் கடைப்பிடிக்க வேண்டும். நான் உங்கள் கடவுளாகிய யாவே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒவ்வொருவரும்.” எபிரெயத்தில் “ஒவ்வொரு ஆணும்” என்ற ஆண்பால் ஒருமை வடிவம் சமூகத்திலுள்ள ஒவ்வொருவரையும் பகிர்ந்தளிக்கும் வகையில் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “பயபக்தி காட்ட வேண்டும்.” எபிரெய வினை பயம், மரியாதை கலந்த அச்சம், பயபக்தி ஆகிய அர்த்தங்களைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: உங்களில் ஒவ்வொரு ஆணும்
  rationale: ஆண்பால் ஒருமை வடிவம் சமூகத்திலுள்ள ஒவ்வொருவருக்கும் பகிர்ந்தளிக்கும் வகையில் பயன்படுத்தப்பட்டுள்ளது. எபிரெய மூலத்தின் ஆண்பால் வடிவை முதன்மை உரையில் காக்கிறது; அதேவேளை ‘உங்களில்’ என்பது பன்மைச் சமூகத்துக்கான கட்டளையுடன் அதன் தொடர்பை இயல்பான தமிழில் காட்டுகிறது.
- source_word: אִמּוֹ וְאָבִיו
  choice: தன் தாயையும் தந்தையையும்
  rationale: மூலத்தில் தாய் முதலில், தந்தை அடுத்ததாகத் தனித்தனியாகக் குறிப்பிடப்படுகிறார்கள். ‘பெற்றோர்’ என்று பொதுமைப்படுத்தாமல் அந்த வரிசையும் உறவுப்பெயர்களும் காக்கப்பட்டுள்ளன.
- source_word: תִּירָאוּ
  choice: அஞ்ச வேண்டும்
  rationale: ירא என்ற வினையின் பயம், மரியாதை கலந்த அச்சம், பயபக்தி ஆகிய அர்த்தவீச்சை ‘அஞ்ச’ நேரடியாகக் காக்கிறது. வெறும் பீதியெனக் குறுக்காமலும் ‘மதிக்க’ என்று வலிமையைக் குறைக்காமலும் உள்ளது.
- source_word: שַׁבְּתֹתַי
  choice: என் ஓய்வுநாட்கள்
  rationale: மூலத்தின் பன்மையையும் இறை உடைமைச் சுட்டையும் காக்கிறது. ‘ஓய்வுநாள்’ என்பது நவீனத் தமிழில் தெளிவாகப் புரியும் சொல்லாக்கம்.
- source_word: תִּשְׁמֹרוּ
  choice: கடைப்பிடிக்க வேண்டும்
  rationale: שׁמר என்பதன் காத்தல்/கவனித்தல்/அனுசரித்தல் என்ற பொருள்களில், ஓய்வுநாட்களைப் பற்றிய சூழலில் ‘கடைப்பிடித்தல்’ இயல்பான தமிழாகவும் உடன்படிக்கை சார்ந்த கவனமான அனுசரிப்பை வெளிப்படுத்துவதாகவும் உள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைவனின் தனிப்பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אֱלֹהֵיכֶם
  choice: உங்கள் கடவுள்
  rationale: இங்கு யாவேயைக் குறிக்கும் ஒருமைச் சார்பில் பயன்படுவதால் ‘உங்கள் கடவுள்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: பெற்றோருக்குரிய மனப்பாங்கின் வலிமை
  choice: அஞ்ச வேண்டும்
  alternative: பயபக்தி காட்ட வேண்டும் / மதிக்க வேண்டும்
  rationale: மூல வினை அச்சத்தையும் பயபக்தியையும் உள்ளடக்கக்கூடும். ‘அஞ்ச’ அதன் வலிமையையும் பொருள் நெருக்கடியையும் காக்கிறது; சூழல் இதைப் பெற்றோருக்குரிய மரியாதை கலந்த அச்சமாகப் புரிந்துகொள்ள வழிகாட்டுகிறது.
- issue: தொடக்கத்திலுள்ள பகிர்ந்தளிக்கும் ஆண்பால் ஒருமை
  choice: உங்களில் ஒவ்வொரு ஆணும்
  alternative: உங்களில் ஒவ்வொருவரும்
  rationale: אִישׁ என்ற வெளிப்படையான ஆண்பால் ஒருமை வடிவை அழிக்காமல் காக்கிறது; அது சமூகத்துக்குப் பகிர்ந்தளிக்கும் பயன்பாடு என்பதைக் குறிப்பில் தெரிவிக்கிறது.
- issue: இறைத் திருப்பெயர்
  choice: யாவே
  alternative: கர்த்தர் / ஆண்டவர்
  rationale: יְהוָה என்பது ஒரு பட்டம் அல்ல, உடன்படிக்கைச் சூழலில் வரும் தனிப்பெயர். ஆகவே அதைப் பட்டத்தால் மாற்றாமல் ஒலிபெயர்த்துள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘தாய்—தந்தை’ என்ற மூல வரிசை, ‘ஓய்வுநாட்கள்’ என்ற பன்மை, இரண்டாம் கட்டளையின் பன்மைச் சமூக நோக்கு, மற்றும் ‘யாவே’ என்ற தனிப்பெயர் காக்கப்பட்டுள்ளன.
