source:
  edition: WLC
  text: מִ/פְּנֵ֤י שֵׂיבָה֙ תָּק֔וּם וְ/הָדַרְתָּ֖ פְּנֵ֣י זָקֵ֑ן וְ/יָרֵ֥אתָ מֵּ/אֱלֹהֶ֖י/ךָ אֲנִ֥י יְהוָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/032.yaml
  text: You shall rise before gray hair[a], and you shall honor the face of an old man, and you shall fear your God[b]; I am Yahweh.
translation:
  language: ta
  text: நரைத்த தலைமுடியுள்ளவரின் முன்னிலையில் எழுந்து நிற்பாயாக; முதியவனுக்கு மரியாதை செலுத்துவாயாக; உன் இறைவனுக்கு அஞ்சுவாயாக. நான் யாவே.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִפְּנֵי שֵׂיבָה
  choice: நரைத்த தலைமுடியுள்ளவரின் முன்னிலையில்
  rationale: שֵׂיבָה என்பதன் நரை என்ற எபிரெயக் கண்கூடான உருவகத்தைத் தக்கவைத்தபடியே, மִפְּנֵי என்பதைக் கום வினையுடன் இயல்பான தமிழில் ‘முன்னிலையில்’ என்று வழங்குகிறது.
- source_word: תָּקוּם
  choice: எழுந்து நிற்பாயாக
  rationale: மரியாதையின் அடையாளமாக ஒருவர் முன்னிலையில் எழுந்து நிற்பதைக் குறிக்கும் கட்டளையைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וְהָדַרְתָּ
  choice: கனம்பண்ணுவாயாக
  rationale: பியேல் வடிவிலுள்ள הדר இங்கு மதிப்பும் மரியாதையும் செலுத்துவதைக் குறிக்கிறது; வழிபாட்டுக்குரிய வணக்கமாக மிகைப்படுத்தாமல் அதைப் பாதுகாக்கிறது.
- source_word: פְּנֵי זָקֵן
  choice: முதியவரின் முகத்தை
  rationale: எபிரெயின் ‘முதியவரின் முகம்’ என்ற சொற்றொடரைத் தக்கவைத்து, முதல் கூறிலுள்ள פָּנִים தொடர்பையும் பாதுகாக்கிறது. זָקֵן இலக்கண ஆண்பால் ஒருமையாக இருந்தாலும், தமிழில் ‘முதியவர்’ இயல்பாகவும் மூலத்தின் வயது சார்ந்த குறிப்பைத் தெளிவாகவும் தருகிறது.
- source_word: וְיָרֵאתָ מֵאֱלֹהֶיךָ
  choice: உன் இறைவனுக்குப் பயப்படுவாயாக
  rationale: יִרְאָה-வின் பயம், பேரச்சம், பயபக்தி ஆகிய இறையியல் அழுத்தத்தை மென்மையாக்காமல் காக்கிறது; இரண்டாம் நபர் ஒருமை உடைமையையும் தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பாக வழங்குகிறது.
theological_decisions:
- issue: זָקֵן என்பதிலுள்ள பாலினக் குறிப்பு
  choice: முதியவர்
  alternative: முதிய ஆண் / மூப்பர்
  rationale: மூலம் ஆண்பால் ஒருமையைக் கொண்டுள்ளது. ஆனால் நவீனத் தமிழில் ‘முதியவர்’ என்பது மரியாதை ஒருமையாக இயல்பாக இருந்து, பாலினத்தைச் செயற்கையாக விரிவாக்காமலும் ஆண் பாலைக் கடுமையாக வலியுறுத்தாமலும் மூலக் குறிப்பைச் சுமக்கிறது.
- issue: இறைவனுக்குப் பயப்படுதல்
  choice: பயப்படுவாயாக
  alternative: பயபக்தியாயிருப்பாயாக / அஞ்சுவாயாக
  rationale: கட்டளையின் உடன்படிக்கை சார்ந்த அச்சம் மற்றும் பயபக்தி இடையிலான உண்மையான இறையியல் நெருக்கடியை ‘மரியாதை’ என்று மென்மையாக்காமல் பாதுகாக்கிறது.
- issue: יְהוָה என்ற தெய்வீகப் பெயர்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் வரும் தனிப்பட்ட உடன்படிக்கைப் பெயரைப் பட்டமாக மாற்றாமல் ஒலிபெயர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் கண்ணியமான கட்டளை நடையாக ‘-வாயாக’ வடிவம் பயன்படுத்தப்பட்டுள்ளது. எபிரெயின் கண்கூடான ‘நரை’ மற்றும் ‘முகம்’ உருவகங்கள் இயன்றவரை பாதுகாக்கப்பட்டுள்ளன; வசனம் இயல்பாக இருப்பதால் அடிக்குறிப்புகள் தேவையில்லை.
