review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the commands to rise in the presence of gray hair, honor an elderly man, fear God, and identifies Yahweh by name. However, ‘முதியவரின் முகத்தைக் கனம்பண்ணுவாயாக’ is an overly literal and non-idiomatic calque in modern Tamil. Rendering the Hebrew ‘face’ idiom as honor shown to the elderly man, with a lexical footnote, preserves both meaning and the source expression.
  naturalness: ‘கனம்பண்ணுவாயாக’ and especially ‘முகத்தைக் கனம்பண்ணுவாயாக’ are not natural modern-standard Tamil. ‘மரியாதை செலுத்துவாயாக’ is clear, dignified, and appropriate to the imperative register. ‘அஞ்சுவாயாக’ communicates covenantal fear/awe more naturally than ‘பயப்படுவாயாக,’ which can suggest merely being frightened.
  terminology: ‘யாவே’ appropriately transliterates יהוה. ‘முதியவன்’ preserves the masculine singular form of זָקֵן more explicitly than the potentially gender-neutral honorific ‘முதியவர்.’
  issues:
  - severity: medium
    issue: Non-idiomatic literal rendering of ‘honor the face of an old man’
    rationale: ‘முதியவரின் முகத்தைக் கனம்பண்ணுவாயாக’ is unnatural Tamil and can be misunderstood as honoring a physical face. The Hebrew ‘face’ functions idiomatically for the person/presence; Tamil should render the command idiomatically and note the literal wording.
  - severity: low
    issue: ‘கனம்பண்ணுவாயாக’ is archaic/unnatural in the stated target variant
    rationale: Modern standard Tamil more naturally says ‘மரியாதை செலுத்துவாயாக’ or ‘மதிப்பாயாக.’
  - severity: low
    issue: ‘பயப்படுவாயாக’ can overemphasize fright
    rationale: In this ethical and covenantal formula, ‘அஞ்சுவாயாக’ is the conventional Tamil expression that retains fear and reverence without reducing it to terror.
  revised_text: நரைத்த தலைமுடியுள்ளவரின் முன்னிலையில் எழுந்து நிற்பாயாக; முதியவனுக்கு மரியாதை செலுத்துவாயாக; உன் இறைவனுக்கு அஞ்சுவாயாக. நான் யாவே.
  revised_footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், ‘முதியவனின் முகத்துக்கு மரியாதை செலுத்துவாயாக.’ இங்கு ‘முகம்’ என்பது அந்த நபரையோ அவரது முன்னிலையையோ குறிக்கும் சொல்வழக்கு.
    reason: lexical_alternative
  revision_rationale: The revision retains the concrete gray-hair image, the masculine singular reference to an old man, the personal address (‘your God’), and the divine name. It replaces an unnatural literal calque with idiomatic modern Tamil and supplies a footnote for the Hebrew ‘face’ expression. ‘அஞ்சுவாயாக’ preserves the force of ירא in this covenantal context.
