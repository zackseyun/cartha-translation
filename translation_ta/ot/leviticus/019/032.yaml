revisions:
- from: நரைத்த தலைமுடியுள்ளவரின் முன்னிலையில் எழுந்து நிற்பாயாக; முதியவரின் முகத்தைக் கனம்பண்ணுவாயாக; உன் இறைவனுக்குப் பயப்படுவாயாக. நான் யாவே.
  to: நரைத்த தலைமுடியுள்ளவரின் முன்னிலையில் எழுந்து நிற்பாயாக; முதியவனுக்கு மரியாதை செலுத்துவாயாக; உன் இறைவனுக்கு அஞ்சுவாயாக. நான் யாவே.
  rationale: The revision retains the concrete gray-hair image, the masculine singular reference to an old man, the personal address (‘your God’), and the divine name. It replaces an unnatural literal calque with idiomatic modern Tamil and supplies a footnote for the Hebrew ‘face’ expression. ‘அஞ்சுவாயாக’ preserves the force of ירא in this covenantal context.
  reviewer_model: gpt-5.6-terra
