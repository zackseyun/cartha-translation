id: LEV.19.14
reference: Leviticus 19:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: לֹא תְקַלֵּ֣ל חֵרֵ֔שׁ וְ/לִ/פְנֵ֣י עִוֵּ֔ר לֹ֥א תִתֵּ֖ן מִכְשֹׁ֑ל וְ/יָרֵ֥אתָ מֵּ/אֱלֹהֶ֖י/ךָ אֲנִ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/014.yaml
  text: 'You shall not curse a deaf man[a], and before a blind man you shall not put a stumbling block; but you shall fear your God: I am Yahweh.'
translation:
  language: ta
  text: காது கேளாத ஒருவனை[a] நீ சபிக்கக் கூடாது; பார்வையற்ற ஒருவன் முன் இடறல் ஏற்படுத்தும் ஒன்றை வைக்கக் கூடாது. ஆனால் உன் கடவுளுக்குப் பயப்படு. நானே யாவே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘காது கேளாதவர்,’ ‘பார்வையற்றவர்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய மூலத்தில் சட்டத்தின் பிரதிநிதித்துவ எடுத்துக்காட்டுகளாக ஆண்பால் ஒருமை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְקַלֵּל
  choice: சபிக்க
  rationale: பியேல் வடிவிலுள்ள קלל இங்கு சபித்தல் அல்லது இகழ்ச்சியுடன் பேசுதல் என்ற வலுவைக் கொண்டது; ‘சபிக்க’ என்பது நேரடியான, இயல்பான இணைச்சொல்.
- source_word: חֵרֵשׁ
  choice: காது கேளாத ஒருவன்
  rationale: எபிரெயச் சொல் ஆண்பால் ஒருமையில் சட்டத்தின் பிரதிநிதித்துவ எடுத்துக்காட்டாக வருகிறது; தமிழில் இயல்பாகவும் மூல வடிவுக்கு நெருக்கமாகவும் இவ்வாறு தரப்பட்டுள்ளது.
- source_word: לִפְנֵי
  choice: முன்பாக
  rationale: இடத்தைக் குறிக்கும் அடிப்படைப் பொருளைப் பாதுகாக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: עִוֵּר
  choice: பார்வையற்ற ஒருவன்
  rationale: எபிரெயத்தில் ஆண்பால் ஒருமை; ‘பார்வையற்ற’ என்பது நவீன, மரியாதையான தமிழாக இருந்து பிரதிநிதித்துவ சட்ட எடுத்துக்காட்டையும் காக்கிறது.
- source_word: תִתֵּן
  choice: வைக்க
  rationale: נתן என்பதன் அடிப்படைப் பொருள் ‘கொடு’ என்றாலும், இடறவைக்கும் பொருளோடு தமிழில் ‘வைக்க’ என்பதே இயல்பானது.
- source_word: מִכְשֹׁל
  choice: இடறவைக்கும் எதையும்
  rationale: சொல் இடறச் செய்யும் பொருள் அல்லது தடையை குறிக்கிறது. ‘எதையும்’ என்பது உருவகத்தையும் நடைமுறைப் பொருளையும் இயல்பாக உள்ளடக்குகிறது.
- source_word: וְיָרֵאתָ
  choice: மாறாக ... பயப்பட வேண்டும்
  rationale: வாவ் இணைப்பின் அடிப்படை ‘மற்றும்’ என்றாலும், மறைவாகச் செய்யக்கூடிய தீங்குக்கும் கடவுளுக்கான பொறுப்புணர்வுக்கும் இடையிலான எதிர்மறைத் திருப்பத்தை ‘மாறாக’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מֵאֱלֹהֶיךָ
  choice: உன் கடவுளுக்குப் பயப்பட
  rationale: ירא உடன் வரும் מן பயத்தின் பொருளைச் சுட்டுகிறது; தமிழில் ‘கடவுளுக்குப் பயப்படுதல்’ என்பது இயல்பான ஆட்சி.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: நான்கு எழுத்துத் தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட தனிப்பெயர் வடிவில் தருகிறது.
theological_decisions:
- issue: சட்ட மொழியிலுள்ள பிரதிநிதித்துவ ஆண்பால் ஒருமை
  choice: ‘காது கேளாத ஒருவன்,’ ‘பார்வையற்ற ஒருவன்’ என ஆண்பால் ஒருமையைத் தக்கவைத்தல்
  alternative: ‘காது கேளாதவர்கள்,’ ‘பார்வையற்றவர்கள்’ அல்லது பாலினம் குறிப்பிடாத ஒருமை வடிவுகள்
  rationale: எபிரெயம் ஆண்பால் ஒருமை எடுத்துக்காட்டுகளைப் பயன்படுத்துகிறது. அவை சட்டத்தின் பொதுவான நெறிப் பயன்பாட்டை மறுக்காமல் மூல வடிவைத் துல்லியமாகக் காட்டுகின்றன; இதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- issue: இறுதி ஊக்கக் கூற்றின் தொடர்பு
  choice: ‘மாறாக, உன் கடவுளுக்குப் பயப்பட வேண்டும்’
  alternative: ‘உன் கடவுளுக்குப் பயப்பட வேண்டும்’ அல்லது ‘மேலும் ... பயப்பட வேண்டும்’
  rationale: பாதிக்கப்படுபவர்களின் இயலாமையைப் பயன்படுத்திக் கொள்ளும் மறைவான தீங்கிற்கு எதிராக, கடவுளுக்கு முன் உள்ள பொறுப்பை இந்தக் கூற்று முன்வைக்கிறது. ‘மாறாக’ இந்த உரையாடல் எதிர்மறையை வெளிக்கொணர்கிறது; காரணத் தொடர்பை அளவுக்கு மீறி விரிவாக்கவில்லை.
translation_notes:
  register: நவீன தரத் தமிழ்; எளிமையானதும் கண்ணியமானதும் சட்டக் கட்டளையின் நேரடித் தன்மையைத் தக்கவைத்ததுமான நடை. உடல் இயலாமையைக் குறிக்கும் இடங்களில் மரியாதையான தற்போதைய சொற்கள் பயன்படுத்தப்பட்டுள்ளன.
