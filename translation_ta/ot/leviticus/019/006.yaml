  text: בְּ/י֧וֹם זִבְחֲ/כֶ֛ם יֵאָכֵ֖ל וּ/מִֽ/מָּחֳרָ֑ת וְ/הַ/נּוֹתָר֙ עַד י֣וֹם הַ/שְּׁלִישִׁ֔י בָּ/אֵ֖שׁ יִשָּׂרֵֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/006.yaml
  text: It shall be eaten on the day of your sacrifice and on the next day[a], but what remains until the third day shall be burned in the fire.
translation:
  language: ta
  text: நீங்கள் பலி செலுத்தும் நாளிலும் அதற்கு அடுத்த நாளிலும் அது உண்ணப்பட வேண்டும்; ஆனால் மூன்றாம் நாள்வரை எஞ்சியிருப்பது நெருப்பில் எரிக்கப்பட வேண்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּיוֹם זִבְחֲכֶם
  choice: நீங்கள் பலி செலுத்தும் நாளில்
  rationale: காலத்தைக் குறிக்கும் בְּיוֹם என்பதையும், ‘உங்கள் பலி’ என்ற எபிரெய வடிவத்தையும் இயல்பான நவீனத் தமிழில் செயல்வடிவமாக வெளிப்படுத்துகிறது; பலியின் சூழலை மிகையாகக் குறிப்பாக்கவில்லை.
- source_word: יֵאָכֵל
  choice: அது உண்ணப்பட வேண்டும்
  rationale: நிஃபால் எதிர்கால வினையின் செயப்பாட்டு வடிவத்தையும் சட்டநெறி சார்ந்த கட்டளையையும் தெளிவாகக் காக்கிறது.
- source_word: וּמִמָּחֳרָת
  choice: அதற்கு அடுத்த நாளிலும்
  rationale: מָחֳרָת குறிக்கும் ‘அடுத்த நாள்’ என்ற காலத் தொடரை இயல்பான தமிழில் தருகிறது.
- source_word: וְהַנּוֹתָר
  choice: ஆனால் ... எஞ்சியிருப்பது
  rationale: எஞ்சிய பகுதியைக் குறிக்கும் பெயரெச்ச வினைவடிவத்தைத் தக்கவைத்து, அடுத்த முரண்பட்ட விதிக்கான மாற்றத்தை ‘ஆனால்’ இயல்பாகக் காட்டுகிறது.
- source_word: עַד יוֹם הַשְּׁלִישִׁי
  choice: மூன்றாம் நாள்வரை
  rationale: עַד குறிக்கும் கால எல்லையை நேரடியாகவும் சுருக்கமாகவும் வெளிப்படுத்துகிறது.
- source_word: בָּאֵשׁ יִשָּׂרֵף
  choice: நெருப்பில் எரிக்கப்பட வேண்டும்
  rationale: בָּאֵשׁ என்பதன் தெளிவான உருவகத்தையும் יִשָּׂרֵף என்பதன் செயப்பாட்டு, கட்டளை சார்ந்த பொருளையும் காக்கிறது.
