revisions:
- from: உங்கள் நாட்டில் உங்களோடு அந்நியக் குடியிருப்பாளர் ஒருவர் வாழ்ந்தால்[a], அவரைத் தவறாக நடத்தாதீர்கள்[b].
  to: உங்களோடு உங்கள் நாட்டில் குடியேறி வாழும் அந்நியர் ஒருவர் இருந்தால்[a], அவரைக் கொடுமைப்படுத்தாதீர்கள்[b].
  rationale: The revision improves modern Tamil fluency, gives a more direct rendering of the prohibition, corrects the Hebrew form in the note, and reframes the cultural explanation to retain the lexical and historical nuance of גֵּר without overstating a disputed ethnic-legal definition. Both footnote markers remain anchored in the text and retain their intended functions.
