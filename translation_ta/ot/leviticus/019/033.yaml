review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the conditional legal setting, the non-native resident sense of גֵּר, residence within the addressees’ land, and the prohibition. However, “உங்கள் நாட்டில் உங்களோடு” is a somewhat awkward ordering for the Hebrew “with you in your land”; placing “உங்களோடு” first produces clearer Tamil while retaining both elements. The prohibition is adequately broad, though “கொடுமைப்படுத்தாதீர்கள்” more directly and naturally conveys the wrongful/oppressive force of תוֹנוּ than “தவறாக நடத்தாதீர்கள்.”
  naturalness: “அந்நியக் குடியிருப்பாளர்” is understandable but bureaucratic and less idiomatic in modern standard Tamil. “குடியேறி வாழும் அந்நியர்” is more natural while retaining both non-native status and residence. “ஒருவர்” is not required, since the indefinite sense is already natural in the conditional clause.
  terminology: The revised rendering preserves the culturally specific status of גֵּר without importing modern legal categories. The cultural note should use the Hebrew spelling גֵּר rather than the incorrect vowel form shown in the draft, and should avoid categorically defining the person as “இஸ்ரவேலரல்லாதவர்,” since the term’s central semantic feature is resident/sojourning status and its precise ethnic-legal scope is debated. The lexical note retains the viable alternatives for ינה.
  issues:
  - severity: medium
    issue: “அந்நியக் குடியிருப்பாளர்” is bureaucratic and stylistically heavy.
    rationale: It is comprehensible but not the most natural modern Tamil wording for a non-native person residing among a people. “குடியேறி வாழும் அந்நியர்” is clearer and more idiomatic.
  - severity: medium
    issue: The cultural footnote overstates the ethnic definition of גֵּר.
    rationale: Although ger commonly denotes a non-native resident, defining it flatly as “இஸ்ரவேலரல்லாதவர்” goes beyond the lexical core and can obscure debated historical-social boundaries. The note should describe resident status without making an absolute ethnic assertion.
  - severity: low
    issue: The order “உங்கள் நாட்டில் உங்களோடு” is less natural in Tamil.
    rationale: “உங்களோடு உங்கள் நாட்டில்” more smoothly reflects the relationship and location expressed by the Hebrew.
  - severity: low
    issue: The Hebrew term in the footnote is vocalized inaccurately.
    rationale: The source term is גֵּר (ger), not the form displayed in the draft.
