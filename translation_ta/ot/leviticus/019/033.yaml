  text: וְ/כִֽי יָג֧וּר אִתְּ/ךָ֛ גֵּ֖ר בְּ/אַרְצְ/כֶ֑ם לֹ֥א תוֹנ֖וּ אֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/033.yaml
  text: When a foreigner resides with you in your land[b][a], you shall not mistreat him.
translation:
  language: ta
  text: உங்களோடு உங்கள் நாட்டில் குடியேறி வாழும் அந்நியர் ஒருவர் இருந்தால்[a], அவரைக் கொடுமைப்படுத்தாதீர்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “குடியேறி வாழும் அந்நியர்” என்பது எபிரெயச் சொல்லான גֵּר (கேர்) என்பதன் மொழிபெயர்ப்பு. இது ஒரு சமூகத்தின் நடுவில் குடியிருந்து வாழும் அந்நியரைச் சுட்டுகிறது; இதை “பரதேசி” அல்லது “வெளிநாட்டவர்” என்றும் மொழிபெயர்க்கலாம்.
    reason: cultural_note
  - marker: b
    text: அல்லது, “அவரை ஒடுக்காதீர்கள்” அல்லது “அவருக்கு அநீதி செய்யாதீர்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כִי
  choice: வாழ்ந்தால்
  rationale: சட்டச் சூழலை அறிமுகப்படுத்தும் நிபந்தனைத் தன்மையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: יָגוּר
  choice: வாழ்ந்தால்
  rationale: குறுகிய காலம் தங்கிச் செல்வதைவிட, அந்நியராக ஒரு சமூகத்தின் நடுவில் குடியிருந்து வாழ்வதைக் குறிக்கிறது.
- source_word: אִתְּךָ
  choice: உங்களோடு
  rationale: எபிரெய முன்னிடைச்சொல்லின் நேரடியான பொருளான ‘உன்னோடு’ என்பதை, சமூகத்தைக் குறிக்கும் இயல்பான தமிழ் பன்மையில் தருகிறது.
- source_word: גֵּר
  choice: அந்நியக் குடியிருப்பாளர்
  rationale: இவர் வழிப்போக்கரோ அறிமுகமில்லாதவரோ அல்ல; இஸ்ரவேலரல்லாதவராக இருந்தும் அவர்கள் நடுவில் குடியிருப்பவர் என்ற பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: בְּאַרְצְכֶם
  choice: உங்கள் நாட்டில்
  rationale: இங்குள்ள אֶרֶץ என்பது மக்கள் வாழும் அவர்களுடைய நிலப்பரப்பைக் குறிக்கிறது; நவீனத் தமிழில் ‘நாடு’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: לֹא תוֹנוּ
  choice: தவறாக நடத்தாதீர்கள்
  rationale: ינה என்பதன் பிறருக்குத் தீங்கிழைத்தல், ஒடுக்குதல், அநீதி செய்தல் ஆகிய பரப்பை வாசிக்க எளிய பொதுச் சொல்லாக்கத்தில் காக்கிறது.
- source_word: אֹתוֹ
  choice: அவரை
  rationale: ஆண்பால் ஒருமைச் சுட்டுப்பெயரைத் தமிழின் மரியாதைமிக்க மனிதர் குறிப்பு வழக்கில் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: இஸ்ரவேலின் பரிசுத்தச் சட்டங்களில் גֵּר என்பதன் பொருள்
  choice: அந்நியக் குடியிருப்பாளர்
  alternative: அந்நியன்; பரதேசி; குடியேறிய அந்நியர்
  rationale: சொல் இஸ்ரவேலரல்லாத, ஆனால் நாட்டில் குடியிருந்து சமூக-சட்டப் பாதுகாப்புக்குள் வாழும் நபரைக் குறிக்கிறது. இத்தேர்வு அந்நியத் தன்மையையும் குடியிருப்புத் தன்மையையும் ஒன்றாகக் காக்கிறது.
- issue: ינה வினையின் வலிமையும் பொருள் பரப்பும்
  choice: தவறாக நடத்தாதீர்கள்
  alternative: ஒடுக்காதீர்கள்; அநீதி செய்யாதீர்கள்
  rationale: மூலச்சொல் பொதுவான தீங்கிழைத்தல் முதல் ஒடுக்குதல் வரை பொருள் கொள்ளக்கூடியதால், முதன்மை உரை அதன் பரப்பைச் சுருக்காமல் வைத்திருக்கிறது; வலுவான மாற்றுகள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுமக்களுக்கு எளிதில் புரியும் தமிழ். சமூகத்தை நோக்கிய எபிரெய ஒருமை/பன்மை மாற்றத்தைத் தமிழில் இயல்பான ‘உங்கள்/உங்களோடு’ வடிவில் அளிக்கிறது. எல்லா அடிக்குறிப்பு குறிகளும் உரையில் இணைக்கப்பட்டுள்ளன.
