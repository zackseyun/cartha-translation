source:
  edition: WLC
  text: וְ֠/אִישׁ כִּֽי יִשְׁכַּ֨ב אֶת אִשָּׁ֜ה שִׁכְבַת זֶ֗רַע וְ/הִ֤וא שִׁפְחָה֙ נֶחֱרֶ֣פֶת לְ/אִ֔ישׁ וְ/הָפְדֵּה֙ לֹ֣א נִפְדָּ֔תָה א֥וֹ חֻפְשָׁ֖ה לֹ֣א נִתַּן לָ֑/הּ בִּקֹּ֧רֶת תִּהְיֶ֛ה לֹ֥א יוּמְת֖וּ כִּי לֹ֥א חֻפָּֽשָׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/020.yaml
  text: If a man lies with a woman and has an emission of semen[a], and she is a servant woman designated for a man, but she has not been redeemed or given her freedom, there shall be an inquiry; they shall not be put to death[b], because she had not been freed.
translation:
  language: ta
  text: ஒருவன் ஒரு பெண்ணுடன் விந்து வெளியேறுமாறு உடலுறவு கொண்டால், அவள் ஓர் ஆணுக்கென ஒதுக்கப்பட்ட[a] அடிமைப் பெண்ணாக இருந்து, இன்னும் மீட்கப்படாமலும் அவளுக்கு விடுதலை அளிக்கப்படாமலும் இருந்தால், விசாரணை நடைபெற வேண்டும்.[b] அவள் விடுதலை பெற்றிருக்காததால், அவர்கள் இருவருக்கும் மரணதண்டனை விதிக்கக் கூடாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஓர் ஆணுக்கு நிச்சயிக்கப்பட்ட” அல்லது “வாக்களிக்கப்பட்ட.” அடிமைப் பெண் ஓர் ஆணுக்கு நியமிக்கப்பட்டிருந்தாள் அல்லது வாக்களிக்கப்பட்டிருந்தாள் என்பதே எபிரெயச் சொல்லின் சாத்தியமான பொருள்; ஆனால் அவளுடைய சட்டநிலை முழுமையாகச் சுதந்திரமான மனைவியின் நிலைக்கு இணையானதல்ல.
    reason: lexical_alternative
  - marker: b
    text: “விசாரணை” என்று மொழிபெயர்க்கப்பட்ட எபிரெயச் சொல் அரிதானது; அதன் பொருள் உறுதியற்றது. அது “தண்டனை” அல்லது “இழப்பீடு” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: ஒருவன்
  rationale: சட்ட விதியின் நிபந்தனை நடையில் வரும் ஆண்பால் ஒருமையை இயல்பான நவீன தமிழில் துல்லியமாகக் காட்டுகிறது.
- source_word: יִשְׁכַּב אֶת אִשָּׁה שִׁכְבַת זֶרַע
  choice: ஒரு பெண்ணுடன் விந்து வெளியேறும் வகையில் உடலுறவு கொள்ளும்போது
  rationale: எபிரெயச் சொற்றொடரில் பாலுறவும் விந்து வெளியேற்றமும் குறிப்பாக உள்ளன; சட்டச் சூழலுக்குத் தேவையான இவ்விரு கூறுகளையும் மறைக்காமல், தமிழில் இயல்பாகத் தருகிறது.
- source_word: שִׁפְחָה
  choice: அடிமைப் பெண்
  rationale: இவ்விதியில் அவளுடைய கட்டுண்ட சட்டநிலையே முக்கியம் என்பதால், அதை மென்மைப்படுத்தும் ‘வேலைக்காரப் பெண்’ என்பதற்குப் பதிலாக அடிமை நிலையை வெளிப்படையாகக் காட்டுகிறது.
- source_word: נֶחֱרֶפֶת לְאִישׁ
  choice: வேறொரு ஆணுக்கென ஒதுக்கப்பட்ட
  rationale: அரியதும் பொருள் விவாதத்திற்குரியதுமான இச்சொல், ஓர் ஆணுக்கு நியமிக்கப்பட்ட அல்லது வாக்களிக்கப்பட்ட உறவைக் குறிக்கலாம். ‘நிச்சயிக்கப்பட்ட’ என்று மொழிபெயர்த்து முழுமையான சுதந்திரப் பெண்ணின் திருமண நிச்சய நிலையை முன்கூட்டியே தீர்மானிப்பதைத் தவிர்க்கிறது.
- source_word: וְהָפְדֵּה לֹא נִפְדָּתָה
  choice: இன்னும் மீட்கப்படாமல்
  rationale: அடிமை நிலையிலிருந்து விலை கொடுத்து மீட்கப்படுதல் நிகழவில்லை என்ற சட்டப் பொருளைச் சுருக்கமாகவும் தெளிவாகவும் தருகிறது; எபிரெய வலியுறுத்தலை ‘இன்னும்’ இயல்பாகப் பிரதிபலிக்கிறது.
- source_word: חֻפְשָׁה לֹא נִתַּן לָהּ
  choice: அவளுக்கு விடுதலை அளிக்கப்படாமல்
  rationale: அடிமைத்தனத்திலிருந்து சட்டப்படி சுதந்திரம் அளிக்கப்படாத நிலையைத் தெளிவாகக் காட்டுகிறது.
- source_word: בִּקֹּרֶת
  choice: விசாரணை
  rationale: இந்த அரிய சொல்லின் பொருள் உறுதியற்றது. அதிகாரப்பூர்வ ஆய்வு அல்லது விசாரணை என்ற சாத்தியமான பொருளைத் தருகிறது; தண்டனை அல்லது இழப்பீடு என்ற குறிப்பிட்ட முடிவை மூலத்தில் இல்லாமல் திணிப்பதில்லை.
- source_word: לֹא יוּמְתוּ
  choice: அவர்கள் இருவருக்கும் மரணதண்டனை விதிக்கக் கூடாது
  rationale: எபிரெயப் பன்மை இருவரையும் குறிக்கிறது; சட்ட மற்றும் நீதித்துறைச் சூழலிலுள்ள கொல்லப்படுதலை நவீன தமிழில் தெளிவாகக் கூறுகிறது.
- source_word: כִּי לֹא חֻפָּשָׁה
  choice: அவள் விடுதலை பெற்றிருக்காததால்
  rationale: மரணதண்டனை விதிக்கப்படாததற்கான காரணம் அவளுடைய தொடரும் அடிமைநிலை என்பதை முந்தைய கூற்றோடு தெளிவாக இணைக்கிறது.
theological_decisions:
- issue: נֶחֱרֶפֶת לְאִישׁ என்பதன் சட்ட உறவுநிலை
  choice: வேறொரு ஆணுக்கென ஒதுக்கப்பட்ட
  alternative: ஓர் ஆணுக்கு நிச்சயிக்கப்பட்ட / வாக்களிக்கப்பட்ட
  rationale: இங்கு பெண் இன்னும் மீட்கப்படாதவளாகவும் விடுதலை பெறாதவளாகவும் இருக்கிறாள். ஆகவே முழுச் சட்ட உரிமையுள்ள சுதந்திரப் பெண்ணின் முறையான திருமண நிச்சயமாக இதை உறுதியாக்காமல், உறவுச் சார்பை மட்டும் மொழிபெயர்ப்பு பாதுகாக்கிறது.
- issue: בִּקֹּרֶת என்பதன் பொருள்
  choice: விசாரணை நடைபெற வேண்டும்
  alternative: தண்டனை இருக்க வேண்டும் / இழப்பீடு செலுத்தப்பட வேண்டும்
  rationale: இச்சொல் அரிதானதும் பொருள் விவாதத்திற்குரியதுமானதால், ஒரு குறிப்பிட்ட தண்டனைக் கோட்பாட்டைத் திணிக்காமல் முக்கிய மாற்றுப் பொருள்களை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சட்ட உரைக்கு ஏற்ற கண்ணியமான மற்றும் நேரடியான நடை பயன்படுத்தப்பட்டுள்ளது. பாலுறவும் அடிமைநிலையும் மூலத்தில் இருப்பதுபோல மறைக்காமல் கூறப்பட்டுள்ளன; அதேவேளை தேவையற்ற மருத்துவ அல்லது பழமையான சொற்கள் தவிர்க்கப்பட்டுள்ளன. உண்மையான சொற்பொருள் ஐயங்கள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
