review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the two prohibitions and the prohibition against retaining a hired worker’s wages until morning. However, ‘உனக்கு அடுத்திருப்பவனை’ can denote someone physically next to the addressee rather than the Hebrew legal-ethical sense of רֵעַ, and ‘விடியற்காலை’ is narrower than בֹּקֶר (‘morning’).
  naturalness: The imperative register is clear and modern. ‘கூலித் தொழிலாளியின் கூலி’ is understandable but stylistically repetitive; ‘கூலித் தொழிலாளியின் ஊதியம்’ is smoother. ‘காலைவரை உன்னிடம் இருக்கக் கூடாது’ is a direct, natural rendering of the wages not remaining with the employer.
  terminology: ‘உன் அயலானை’ is established, natural Tamil for the ethical-social referent of רֵעַ. ‘ஒடுக்காதே’ suitably retains the broad force of עשק. ‘பறித்துக்கொள்ளாதே’ conveys wrongful seizure without importing a specific scenario beyond גזל. ‘ஊதியம்’ appropriately renders the wages due to a hired worker.
  issues:
  - severity: medium
    issue: ரֵעֲךָ rendered as ‘உனக்கு அடுத்திருப்பவனை’
    rationale: This wording can be read spatially (‘the person next to you’) and does not naturally convey the Hebrew’s fellow/neighbour sense in this legal context.
  - severity: low
    issue: בֹּקֶר rendered as ‘விடியற்காலை’
    rationale: ‘விடியற்காலை’ specifically means dawn/early dawn, whereas the source says ‘morning.’ ‘காலை’ preserves the broader temporal reference.
  - severity: low
    issue: ‘கூலித் தொழிலாளியின் கூலி’ is repetitive
    rationale: Though not inaccurate, ‘கூலித் தொழிலாளியின் ஊதியம்’ is more idiomatic modern standard Tamil while retaining the construct relationship.
  revised_text: உன் அயலானை ஒடுக்காதே; அவனிடமிருந்து பறித்துக்கொள்ளாதே. கூலித் தொழிலாளியின் ஊதியம் காலைவரை உன்னிடம் இருக்கக் கூடாது.
  revised_footnotes: []
  revision_rationale: The revision preserves the Hebrew’s direct second-person legal commands, distinguishes oppression from wrongful seizure, and retains the concrete limit of morning for payment. It replaces spatially ambiguous and temporally over-specific Tamil expressions with standard equivalents, without adding interpretation.
