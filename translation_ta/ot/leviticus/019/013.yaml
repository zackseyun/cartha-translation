revisions:
- from: உனக்கு அடுத்திருப்பவனை ஒடுக்காதே; அவனிடமிருந்து கொள்ளையடிக்காதே. கூலித் தொழிலாளியின் கூலி விடியற்காலைவரை உன்னிடம் தங்கிவிடக் கூடாது.
  to: உன் அயலானை ஒடுக்காதே; அவனிடமிருந்து பறித்துக்கொள்ளாதே. கூலித் தொழிலாளியின் ஊதியம் காலைவரை உன்னிடம் இருக்கக் கூடாது.
  rationale: The revision preserves the Hebrew’s direct second-person legal commands, distinguishes oppression from wrongful seizure, and retains the concrete limit of morning for payment. It replaces spatially ambiguous and temporally over-specific Tamil expressions with standard equivalents, without adding interpretation.
