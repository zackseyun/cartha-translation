  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: לֹֽא תַעֲשֹׁ֥ק אֶת רֵֽעֲ/ךָ֖ וְ/לֹ֣א תִגְזֹ֑ל לֹֽא תָלִ֞ין פְּעֻלַּ֥ת שָׂכִ֛יר אִתְּ/ךָ֖ עַד בֹּֽקֶר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/013.yaml
  text: You shall not oppress your neighbor or rob him[a]. The wages of a hired worker shall not remain with you until morning.
translation:
  language: ta
  text: உன் அயலானை ஒடுக்காதே; அவனிடமிருந்து பறித்துக்கொள்ளாதே. கூலித் தொழிலாளியின் ஊதியம் காலைவரை உன்னிடம் இருக்கக் கூடாது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תַעֲשֹׁק
  choice: ஒடுக்காதே
  rationale: עָשַׁק என்பது அதிகாரத்தைத் தவறாகப் பயன்படுத்துதல் அல்லது ஒருவருக்குச் சேர வேண்டியதைத் தடுத்துவைத்தல் உள்ளிட்ட பரந்த ஒடுக்குதலைக் குறிக்கிறது. பொருளாதாரச் சூழலை மட்டும் சுருக்காமல் அந்தப் பரந்த அறநெறி வலிமையைப் பேணுகிறது.
- source_word: רֵעֲךָ
  choice: உனக்கு அடுத்திருப்பவனை
  rationale: רֵעַ சட்ட மற்றும் அறநெறிச் சூழலில் சமூகத்திலுள்ள சக மனிதனைக் குறிக்கிறது. ‘உனக்கு அடுத்திருப்பவன்’ என்பது லேவியராகமம் 19-ன் தொடர்ச்சியையும் பரந்த சமூக உறவையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: תִגְזֹל
  choice: அவனிடமிருந்து கொள்ளையடிக்காதே
  rationale: גָּזַל வலுக்கட்டாயமாக அல்லது அநியாயமாகப் பறித்துக்கொள்வதைக் குறிக்கிறது. ‘கொள்ளையடிக்காதே’ என்பது பொதுவான ‘திருடாதே’ என்பதைவிட மூலச்சொல்லின் வலிமையை நன்றாகக் காட்டுகிறது.
- source_word: תָלִין
  choice: தங்கிவிடக் கூடாது
  rationale: לין இங்கு பெண்பால் ஒருமையான ‘கூலி’ என்பதோடு இயைந்து, இரவு முழுவதும் தங்கியிருப்பதைக் குறிக்கிறது. கூலியை மறுநாள்வரை பிடித்துவைக்கக் கூடாது என்ற சட்டப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: פְּעֻלַּת
  choice: கூலி
  rationale: פְּעֻלָּה வேலை அல்லது அதற்கான ஊதியம் எனப் பொருள்படலாம்; שָׂכִיר உடனான இச்சேர்க்கையிலும் பணம் கொடுப்பதைத் தாமதிக்கக் கூடாது என்ற சூழலிலும் ‘கூலி’ பொருத்தமானது.
- source_word: שָׂכִיר
  choice: கூலித் தொழிலாளி
  rationale: שָׂכִיר கூலிக்காக அமர்த்தப்பட்ட ஒருவரைக் குறிக்கிறது. ‘கூலித் தொழிலாளி’ தெளிவான, நவீனத் தமிழ் வழக்கு.
- source_word: אִתְּךָ
  choice: உன்னிடம்
  rationale: கொடுக்கப்பட வேண்டிய கூலி முதலாளியின் வசம் தடுத்துவைக்கப்பட்டிருப்பதை இந்த முன்னிடைச்சொல் குறிக்கிறது. ‘உன்னிடம்’ நேரடியும் இயல்பானதுமாகும்.
- source_word: עַד בֹּקֶר
  choice: விடியற்காலைவரை
  rationale: இந்தக் காலக் குறிப்பு கூலி வழங்கப்படாமல் தாமதிக்கப்படுவதற்கான எல்லையைத் தெளிவாகக் காட்டுகிறது; ‘விடியற்காலைவரை’ மூலத்தின் குறிப்பான நேரச் சுட்டுதலைப் பேணுகிறது.
