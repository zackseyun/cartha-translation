source:
  edition: WLC
  text: וְ/כִי תָבֹ֣אוּ אֶל הָ/אָ֗רֶץ וּ/נְטַעְתֶּם֙ כָּל עֵ֣ץ מַאֲכָ֔ל וַ/עֲרַלְתֶּ֥ם עָרְלָת֖/וֹ אֶת פִּרְי֑/וֹ שָׁלֹ֣שׁ שָׁנִ֗ים יִהְיֶ֥ה לָ/כֶ֛ם עֲרֵלִ֖ים לֹ֥א יֵאָכֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/023.yaml
  text: When you come into the land and plant any kind of tree for food[a], you shall regard its fruit as uncircumcised. For three years it shall be forbidden to you; it shall not be eaten.
translation:
  language: ta
  text: நீங்கள் அந்த நாட்டிற்குள் வந்து, உணவுக்காகப் பயன்படும் எந்த மரத்தையும் நட்டால், அதன் கனியை விருத்தசேதனம் செய்யப்படாததாகக் கருத வேண்டும்.[a] மூன்று ஆண்டுகள் அதன் கனிகள் உங்களுக்கு விருத்தசேதனம் செய்யப்படாதவையாக இருக்க வேண்டும்; அவை உண்ணப்படக்கூடாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில், ‘விருத்தசேதனம் செய்யப்படாதது.’ முதல் மூன்று ஆண்டுகளில் உண்ண அனுமதிக்கப்படாத கனியைக் குறிக்க இச்சொல் உருவகமாகப் பயன்படுத்தப்பட்டுள்ளது.
    reason: மூல உருவகமும் அதன் சட்டப் பொருளும் தெளிவாக இருக்க வேண்டி.
lexical_decisions:
- source_word: וְכִי תָבֹאוּ אֶל־הָאָרֶץ
  choice: நீங்கள் அந்த நாட்டிற்குள் வந்து
  rationale: சட்ட அறிவுறுத்தலில் כִּי வருங்காலச் சூழலை அறிமுகப்படுத்துவதால் ‘வந்து’ என வழங்கப்பட்டது. குறிப்பிட்ட உடன்படிக்கை நாட்டைக் குறிக்கும் הָאָרֶץ, சூழலுக்கேற்ப ‘அந்த நாடு’ என மொழிபெயர்க்கப்பட்டது; மூலத்தில் இல்லாத ‘கானான்’ சேர்க்கப்படவில்லை.
- source_word: וּנְטַעְתֶּם כָּל־עֵץ מַאֲכָל
  choice: உணவுக்காகப் பயன்படும் எந்த மரத்தையும் நட்டால்
  rationale: עֵץ מַאֲכָל என்பது உண்ணும் பயன் தரும் மரத்தைக் குறிக்கிறது. כָּל என்பதன் பகிர்வுப் பொருளை ‘எந்த மரத்தையும்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַעֲרַלְתֶּם עָרְלָתוֹ אֶת־פִּרְיוֹ
  choice: அதன் கனியை விருத்தசேதனம் செய்யப்படாததாகக் கருத வேண்டும்
  rationale: ערל/ערלה என்பதன் திட்டமிட்ட உருவகத்தைத் தக்கவைத்து, கனியின் சட்ட/சடங்கு நிலையை ‘கருத வேண்டும்’ என்பதால் தெளிவாக்குகிறது.
- source_word: שָׁלֹשׁ שָׁנִים יִהְיֶה לָכֶם עֲרֵלִים
  choice: மூன்று ஆண்டுகளுக்கு அது உங்களுக்குத் தடைசெய்யப்பட்டதாக இருக்கும்
  rationale: கனியை மொத்த விளைச்சலாக ஒருமையில் சுட்டுகிறது. இரண்டாவது இடத்தில் உருவகத்தின் நடைமுறை விளைவான உண்ணத் தடை இயல்பான தமிழில் கூறப்படுகிறது; לָכֶם என்பதன் உறவுநிலை ‘உங்களுக்கு’ எனத் தக்கவைக்கப்பட்டுள்ளது.
- source_word: לֹא יֵאָכֵל
  choice: அதை உண்ணக் கூடாது
  rationale: எபிரெயத்தின் செயப்பாட்டு/பொதுநிலைத் தடையை இயல்பான தமிழ் தடை வடிவில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘விருத்தசேதனம் செய்யப்படாத’ கனி என்ற உருவகத்தைத் தக்கவைக்க வேண்டுமா
  choice: முதல் கூற்றில் உருவகத்தைத் தக்கவைத்து, அடுத்த கூற்றில் அதன் நடைமுறைப் பொருளான ‘தடைசெய்யப்பட்டது’ என்பதைப் பயன்படுத்துதல்
  alternative: இரு இடங்களிலும் ‘தடைசெய்யப்பட்டது’ என்று மட்டும் கூறுதல் அல்லது இரு இடங்களிலும் ‘விருத்தசேதனம் செய்யப்படாதது’ என்று கூறுதல்
  rationale: மூலத்தின் உடன்படிக்கை/சடங்கு சார்ந்த ערל உருவகத்தை அழிக்காமல் பாதுகாக்கிறது; அதேவேளையில், மூன்று ஆண்டுகள் கனியை உண்ணக் கூடாது என்ற சட்ட விளைவை சாதாரண வாசகருக்குத் தெளிவாக்குகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான சட்ட அறிவுறுத்தல் நடை பயன்படுத்தப்பட்டுள்ளது. ‘விருத்தசேதனம்’ என்பது தொழில்நுட்பமான வேதாகமச் சொல் என்பதால் அடிக்குறிப்பின் உதவியுடன் தக்கவைக்கப்பட்டுள்ளது.
