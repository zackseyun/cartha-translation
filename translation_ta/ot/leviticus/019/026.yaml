  variant: modern standard Tamil
source:
  edition: WLC
  text: לֹ֥א תֹאכְל֖וּ עַל הַ/דָּ֑ם לֹ֥א תְנַחֲשׁ֖וּ וְ/לֹ֥א תְעוֹנֵֽנוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/026.yaml
  text: You shall not eat over the blood[b][a]. You shall not practice divination or interpret omens.
translation:
  language: ta
  text: இரத்தத்தின் மேல் உண்ணக் கூடாது.[a] குறிபார்க்கக் கூடாது; சகுனம் பார்க்கவும் கூடாது.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இரத்தத்தோடு.” எபிரெயச் சொற்றொடர் தெளிவற்றது; இரத்தம் உள்ள இறைச்சியை உண்பதையோ, இரத்தத்துடன் தொடர்புடைய ஒரு சடங்கு உணவில் பங்கேற்பதையோ இது குறிக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: இந்த எபிரெயச் சொல் குறிபார்த்தல் அல்லது வருங்காலம் கணித்தல் என்றும் புரிந்துகொள்ளப்படலாம்; மரபுவழியாக, “காலம் பார்த்தல்” என்றும் மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תֹאכְלוּ
  choice: நீங்கள் சாப்பிடக் கூடாது
  rationale: எதிர்மறையுடன் வரும் எபிரெய நிறைவுறா வினைச்சொல் சட்டப் பின்னணியில் தடையாக அமைகிறது; இந்தத் தமிழ் வடிவம் நவீனமாகவும் தெளிவாகவும் உள்ளது.
- source_word: עַל הַדָּם
  choice: இரத்தத்தின்மேல் வைத்து
  rationale: எபிரெய முன்இடைச்சொல் עַל-ஐ ஒப்பீட்டளவில் நேரடியாக வெளிப்படுத்தி, தடைசெய்யப்பட்ட நடைமுறை என்ன என்பதைத் தீர்மானித்துவிடாமல் அதன் தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: תְנַחֲשׁוּ
  choice: குறிபார்க்கக் கூடாது
  rationale: נחשׁ என்ற வினையின் பியேல் வடிவம் மறைமுறை அறிகுறிகளைக் கொண்டு கணிக்கும் செயலைக் குறிக்கிறது; ‘குறிபார்த்தல்’ இயல்பான தமிழில் இதைச் சுருக்கமாகத் தெரிவிக்கிறது.
- source_word: תְעוֹנֵנוּ
  choice: சகுனம் பார்க்கவும் கூடாது
  rationale: ענן என்ற வினையின் இவ்வடிவம் சகுனம் அல்லது காலக்குறிகளை வாசிக்கும் நடைமுறையுடன் தொடர்புடையது; ‘சகுனம் பார்த்தல்’ பொதுவாகப் புரியக்கூடிய நவீனத் தமிழ்.
theological_decisions:
- issue: עַל הַדָּם என்ற தெளிவற்ற தடையை எவ்வளவு குறிப்பாக மொழிபெயர்ப்பது
  choice: முதன்மை உரையில் ‘இரத்தத்தின்மேல் வைத்து’ என்ற ஒப்பீட்டளவில் நேரடியான வடிவத்தை வைத்தல்
  alternative: ‘இரத்தத்தோடு’, ‘இரத்தம் இன்னும் உள்ள இறைச்சியை’, அல்லது ‘இரத்தச் சடங்கு விருந்தில்’
  rationale: இந்தத் தடை இரத்தம் உள்ள இறைச்சியை உண்பதையோ, இரத்தத்துடன் தொடர்புடைய சடங்கு உணவையோ, வேறொரு வழிபாட்டு நடைமுறையையோ குறிக்கலாம். உறுதியற்ற பொருளைத் தீர்மானிக்காமல், மூலத்தின் இறையியல் மற்றும் சடங்கியல் பதற்றத்தை முதன்மை உரை பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான சட்டநடை பயன்படுத்தப்பட்டுள்ளது. இணையான தடைகளில் ‘கூடாது’ மீளப் பயன்படுத்தப்பட்டு, மூலத்தின் கட்டளை அமைப்பு காக்கப்பட்டுள்ளது.
