revisions:
- from: இரத்தத்தின்மேல் வைத்து நீங்கள் சாப்பிடக் கூடாது.[a] குறிபார்க்கக் கூடாது; சகுனம் பார்க்கவும் கூடாது.[b]
  to: இரத்தத்தின் மேல் உண்ணக் கூடாது.[a] குறிபார்க்கக் கூடாது; சகுனம் பார்க்கவும் கூடாது.[b]
  rationale: The revision removes வைத்து, which is not represented in the Hebrew and inadvertently specifies the action. “இரத்தத்தின் மேல்” preserves the deliberately literal and disputed expression, with the footnote supplying possible interpretations. The remainder faithfully maintains the legal prohibitions, their parallel structure, and the distinction between the two divinatory terms.
