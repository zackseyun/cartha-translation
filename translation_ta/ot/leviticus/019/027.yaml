base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/027.yaml
  text: You shall not round off the hair at the sides of your head[c][b][a], and you shall not mar the edges of your beard.
translation:
  language: ta
  text: உங்கள் தலையின் ஓரங்களில் உள்ள முடியை வட்டமாக வெட்டாதீர்கள்[a][b]; உங்கள் தாடியின் ஓரத்தைச் சிதைக்காதீர்கள்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்கள் தலைமுடியின் ஓரத்தை.” எபிரெயச் சொல் “ஓரம்,” “பக்கம்,” அல்லது “முனை” என்று பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: இது தலையின் பக்கங்களிலுள்ள முடியைச் சுற்றிலும் வட்டமாக மழிப்பதையோ வெட்டுவதையோ குறிக்கக்கூடும்.
    reason: cultural_note
  - marker: c
    text: அல்லது, “உங்கள் தாடியின் ஓரத்தை அழிக்காதீர்கள்,” “கெடுக்காதீர்கள்,” அல்லது “உருக்குலைக்காதீர்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תַקִּפוּ
  choice: வட்ட வடிவில் வெட்டாதீர்கள்
  rationale: נקף என்பதன் ஹிஃபீல் வடிவம் இங்கு தலையின் ஓர முடியைச் சுற்றி வட்டமாக வெட்டுவதைக் குறிக்கிறது. இத்தமிழாக்கம் செயலைத் தெளிவாகச் சொல்கிறது; குறிப்பாகச் சவரம் செய்தல் என்ற முறையை உரையில் சேர்ப்பதில்லை.
- source_word: פְּאַת רֹאשְׁכֶם
  choice: உங்கள் தலைகளின் ஓரத்திலுள்ள முடி
  rationale: פֵּאָה என்பது ஓரம், பக்கம், முனை ஆகிய பொருள்களைக் கொண்டது. முடியைப் பற்றிய கட்டளை என்பதை இயல்பான தமிழில் வெளிப்படுத்தியபோதும், רֹאשְׁכֶם என்பதிலுள்ள பன்மையைப் பாதுகாக்கிறது.
- source_word: תַשְׁחִית
  choice: சிதைக்காதே
  rationale: שׁחת என்பதன் ஹிஃபீல் வடிவம் அழித்தல், கெடுத்தல், உருக்குலைத்தல் எனப் பொருள்படும். தாடிப் பராமரிப்புச் சூழலில் ‘சிதைக்காதே’ என்பது செய்முறையை அளவுக்கு மீறிக் குறிப்பாக்காமல் அதன் வலிமையைத் தக்கவைக்கிறது.
- source_word: פְּאַת זְקָנֶךָ
  choice: உன் தாடியின் ஓரம்
  rationale: זָקָן என்பதற்கு ‘தாடி’ என்பது நேரான பொருள்; פֵּאָה என்பதன் ‘ஓரம்’ என்ற பொருளையும் ஒருமை உடைமைச் சுட்டையும் இவ்வாக்கியம் பாதுகாக்கிறது.
- source_word: לֹא ... וְלֹא
  choice: வெட்டாதீர்கள் ... சிதைக்காதே
  rationale: இவை இரண்டும் உறுதியான தடைக் கட்டளைகளாக மொழிபெயர்க்கப்பட்டுள்ளன. முதல் வினையின் பன்மையையும் இரண்டாம் வினையின் ஒருமையையும் எபிரெய வடிவுக்கேற்ப தக்கவைத்ததால் தமிழிலும் எண்ணிக்கை மாறுகிறது.
theological_decisions:
- issue: தடையின் தன்மை
  choice: குறிப்பிட்ட தலை முடி மற்றும் தாடி வெட்டும் செயல்களைத் தடைசெய்யும் நேரடியான கட்டளையாக மொழிபெயர்த்தல்
  alternative: இதைப் புறமதத் துக்கச் சடங்கோ சுற்றியிருந்த மக்களின் அலங்கார முறையோடு நேரடியாக இணைத்து மொழிபெயர்த்தல்
  rationale: இந்த வசனம் தடைசெய்யப்பட்ட செயல்களைக் கூறுகிறது; அவற்றுக்கான காரணத்தை வெளிப்படையாகக் கூறவில்லை. ஆகவே சாத்தியமான வரலாற்றுப் பின்னணியை முதன்மை உரைக்குள் சேர்க்காமல், உரையின் விளக்கத் திறந்தநிலையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் தெளிவான, கண்ணியமான சட்டக் கட்டளை நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய உரையில் முதல் கட்டளை பன்மையிலும் இரண்டாவது கட்டளை ஒருமையிலும் இருப்பதால், அந்த குறிப்பிடத்தக்க எண்ணிக்கை மாற்றம் தமிழிலும் பாதுகாக்கப்பட்டுள்ளது. ‘வட்ட வடிவில் வெட்டுதல்’ செயலை விளக்குகிறது; அதன் பின்னணிக் காரணத்தை உரைக்குள் சேர்ப்பதில்லை.
