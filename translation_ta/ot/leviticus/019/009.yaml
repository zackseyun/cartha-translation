translation_notes:
  register: நவீன செந்தமிழுக்கு நெருக்கமான, பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் மரியாதையான சட்டநடை பயன்படுத்தப்பட்டது. எபிரேய உரையின் பன்மை ‘நீங்கள்’ வடிவிலும், வயலின் உரிமையாளரை நோக்கும் ஒருமை உணர்வு தமிழில் சூழலால் புரியுமாறும் வைக்கப்பட்டுள்ளது.
