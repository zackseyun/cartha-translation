language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וּֽ/בְ/קֻצְרְ/כֶם֙ אֶת קְצִ֣יר אַרְצְ/כֶ֔ם לֹ֧א תְכַלֶּ֛ה פְּאַ֥ת שָׂדְ/ךָ֖ לִ/קְצֹ֑ר וְ/לֶ֥קֶט קְצִֽירְ/ךָ֖ לֹ֥א תְלַקֵּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/009.yaml
  text: When you reap the harvest of your land[a], you shall not completely reap the edge of your field, and you shall not gather the gleanings of your harvest.
translation:
  language: ta
  text: உங்கள் நிலத்தின் விளைச்சலை நீங்கள் அறுவடை செய்யும்போது, உங்கள் வயலின் ஓரம்[a] முழுவதையும் அறுவடை செய்யாதீர்கள்; உங்கள் அறுவடையில் சிதறிக் கிடப்பவற்றையும் பொறுக்காதீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்கள் வயலின் மூலையை.” எபிரேயச் சொல் ஓரம், பக்கம், அல்லது மூலை எனப் பொருள்படும்; இங்கே அறுவடை செய்யாமல் விடப்பட வேண்டிய வயலின் வெளிப்புறப் பகுதியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְקֻצְרְכֶם
  choice: நீங்கள் ... அறுவடை செய்யும்போது
  rationale: בְּ + குறைவினை வடிவம் காலச் சூழலைக் குறிக்கிறது; தமிழில் இயல்பான சட்ட மொழியாக இவ்வாறு தரப்படுகிறது.
- source_word: קְצִיר אַרְצְכֶם
  choice: உங்கள் நிலத்தின் விளைச்சல்
  rationale: קְצִיר இங்கு அறுவடை செய்யப்படும் விளைச்சலைக் குறிக்கிறது; אֶרֶץ அரசியல் நாடு என்பதற்குப் பதிலாக வேளாண் நிலத்தைக் குறிக்கிறது.
- source_word: לֹא תְכַלֶּה ... לִקְצֹר
  choice: முழுவதுமாக அறுவடை செய்யாதீர்கள்
  rationale: Piel כלה முடித்துவிடுதல் அல்லது முற்றிலும் செய்தல் என்ற பொருளுடையது; לִקְצֹר செயலை வெளிப்படையாக்குகிறது.
- source_word: פְּאַת שָׂדְךָ
  choice: உங்கள் வயலின் ஓரம்
  rationale: פֵּאָה என்பது ஓரம், பக்கம், அல்லது மூலை எனப் பொருள்படலாம்; இவ்வேளாண் சட்டத்தில் வயலின் வெளிப்புறப் பகுதியை இயல்பாகக் குறிக்க ‘ஓரம்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: לֶקֶט קְצִירְךָ
  choice: உங்கள் அறுவடையில் சிதறியவை
  rationale: לֶקֶט அறுவடையின்போது விழுந்து அல்லது சிதறிக் கிடக்கும் விளைபொருளைக் குறிக்கிறது; பொதுவாசகர்களுக்குப் புரியும் வகையில் பொருள் தெளிவாக மொழிபெயர்க்கப்பட்டது.
- source_word: לֹא תְלַקֵּט
  choice: பொறுக்காதீர்கள்
  rationale: לקט சிதறிக் கிடப்பவற்றை ஒன்றொன்றாக எடுத்துச் சேர்த்தலைக் குறிக்கிறது; இச்சூழலில் ‘பொறுக்குதல்’ துல்லியமும் இயல்பும் உடையது.
