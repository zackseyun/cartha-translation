  source_fidelity: The temporal clause, the prohibition against completely reaping the field’s pe'ah, and the prohibition against gathering leqet are substantially represented. The rendering should retain the lexical ambiguity of פאה by supplying the corresponding footnote, as in the audit trail.
  naturalness: The Tamil is clear and suitably formal. Recasting the first prohibition as “வயலின் ஓரம் முழுவதையும்” is slightly more direct and natural than treating “ஓரம்” as the object followed by “முழுவதுமாக.”
  terminology: “அறுவடை,” “வயல்,” and “பொறுக்குதல்” are appropriate modern-standard Tamil terms. “சிதறிக் கிடப்பவை” communicates the practical sense of לקט without artificially narrowing it to one particular crop product.
