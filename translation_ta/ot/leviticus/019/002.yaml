  text: דַּבֵּ֞ר אֶל כָּל עֲדַ֧ת בְּנֵי יִשְׂרָאֵ֛ל וְ/אָמַרְתָּ֥ אֲלֵ/הֶ֖ם קְדֹשִׁ֣ים תִּהְי֑וּ כִּ֣י קָד֔וֹשׁ אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/002.yaml
  text: Speak to all the congregation of the sons of Israel[a], and say to them, ‘You shall be holy, for I, Yahweh your God[b], am holy.’
translation:
  language: ta
  text: “இஸ்ரவேல் மக்களின் முழுச் சபையிடம்[a] பேசு. அவர்களிடம், ‘நீங்கள் பரிசுத்தராக இருக்க வேண்டும்[b]; ஏனெனில் நான், உங்கள் கடவுளாகிய யாவே, பரிசுத்தர்’ என்று சொல்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “இஸ்ரவேல் மகன்களின் முழுச் சபையிடம்.”'
    reason: lexical_alternative
  - marker: b
    text: 'அல்லது: “பரிசுத்தராக இருங்கள்” அல்லது “நீங்கள் பரிசுத்தராய் இருப்பீர்கள்.”'
    reason: alternative_reading
lexical_decisions:
- source_word: דַּבֵּר
  choice: பேசு
  rationale: பியேல் கட்டளை வடிவின் நேரடியான ஆணையைத் தக்கவைத்து, சட்டப்பகுதியின் கண்ணியமான தொனிக்கும் பொருந்துகிறது.
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்களின் சபையார் அனைவரிடமும்
  rationale: עֵדָה குறிக்கும் உடன்படிக்கைச் சமூகத்தின் கூட்டு இயல்பையும் כָּל என்பதன் முழுமையையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; בְּנֵי יִשְׂרָאֵל என்ற எபிரேய மரபுத்தொடரின் அதிகச் சொற்சார்ந்த வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: அவர்களிடம் … என்று சொல்
  rationale: எபிரேய சட்ட உரையின் கட்டளைத் தொடரையும், தொடர்ந்து வரும் நேர்க் கூற்றையும் தெளிவாகக் காட்டுகிறது.
- source_word: קְדֹשִׁים תִּהְיוּ
  choice: நீங்கள் பரிசுத்தராக இருக்க வேண்டும்
  rationale: பெயரடை மற்றும் நிறைவுறா வினை வடிவம் இங்கு தரும் கடமை அல்லது கட்டளைச் சக்தியை இயல்பான தமிழில் வெளிப்படுத்துகிறது; கட்டளை மற்றும் எதிர்காலத் தொனி கொண்ட மாற்றுகள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.
- source_word: קָדוֹשׁ
  choice: பரிசுத்தர்
  rationale: தேவனுக்குரிய தூய்மையையும் தனித்துவத்தையும் ஒருங்கே சுட்டும் நிலைபெற்ற, இறையியல் ரீதியாக நிறைவான தமிழ்ச் சொல்.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது ஒரு பட்டப்பெயர் அல்ல, தேவனுடைய தனிப்பட்ட பெயர் என்பதைக் காக்கும் ஒலிபெயர்ப்பு.
- source_word: אֱלֹהֵיכֶם
  choice: உங்கள் கடவுள்
  rationale: இரண்டாம் நபர் பன்மை உடைமைப் பின்னொட்டைத் தெளிவாகவும் இயல்பாகவும் மொழிபெயர்க்கிறது.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל என்ற உடன்படிக்கை அடையாளத் தொடரை மொழிபெயர்த்தல்
  choice: இஸ்ரவேல் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரேயத் தொடர் வடிவில் ஆண்பால் பன்மையாக இருந்தாலும், இச்சூழலில் முழு உடன்படிக்கைச் சமூகத்தைக் குறிக்கும் மரபுத்தொடராகச் செயல்படுகிறது. இயல்பான தமிழுக்காகக் கூட்டு அர்த்தம் முதன்மை உரையில் தரப்பட்டு, சொற்சார்ந்த வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: பரிசுத்தத்திற்கான கூற்றின் கட்டளைச் சக்தி
  choice: நீங்கள் பரிசுத்தராக இருக்க வேண்டும்
  alternative: பரிசுத்தராக இருங்கள் / நீங்கள் பரிசுத்தராயிருப்பீர்கள்
  rationale: תִּהְיוּ என்பது வடிவில் நிறைவுறா வினையாக இருந்தாலும் இச்சட்டச் சூழலில் கடமை அல்லது கட்டளைச் சக்தி பெறுகிறது. தமிழ் முதன்மை உரை அந்தக் கடமையைத் தெளிவாகக் காட்டுகிறது; கட்டளை மற்றும் எதிர்காலத் தொனிகள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான சட்டநடை பயன்படுத்தப்பட்டுள்ளது. “பரிசுத்தர்” என்ற மரியாதைப் பன்மை தேவனைச் சுட்டுகிறது; மனிதக் கூட்டத்துக்கு “பரிசுத்தராக” என்பது இயல்பான பன்மை அமைப்பில் வருகிறது. நேர்க் கூற்றின் எபிரேய வரிசை தமிழில் வாசிக்க இயலுமாறு சற்றே ஒழுங்குபடுத்தப்பட்டுள்ளது.
