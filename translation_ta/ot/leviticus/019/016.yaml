source:
  edition: WLC
  text: לֹא תֵלֵ֤ךְ רָכִיל֙ בְּ/עַמֶּ֔י/ךָ לֹ֥א תַעֲמֹ֖ד עַל דַּ֣ם רֵעֶ֑/ךָ אֲנִ֖י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/016.yaml
  text: You shall not go about as a slanderer among your people[a]. You shall not stand against the blood of your neighbor. I am Yahweh.
translation:
  language: ta
  text: உன் மக்களிடையே அவதூறு பரப்பிக்கொண்டு திரியாதே. உன் அயலானின் இரத்தத்துக்கு விரோதமாக நிற்காதே.[a] நானே யாவே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உன் அயலானின் இரத்தம் சிந்தப்படும்போது பார்த்துக்கொண்டு நிற்காதே.’
    reason: alternative_reading
lexical_decisions:
- source_word: תֵלֵךְ רָכִיל
  choice: அவதூறு பரப்பிக்கொண்டு திரியாதே
  rationale: הלך உடன் רכיל சேர்ந்த சொற்றொடர், சமூகத்தில் இடம்விட்டு இடம் சென்று தீங்கு விளைவிக்கும் செய்திகளைப் பரப்புவதைக் குறிக்கிறது. ‘திரியாதே’ என்ற நடை எபிரெய வினைப்படிமத்தைத் தக்கவைக்கிறது; ‘அவதூறு பரப்பிக்கொண்டு’ அதன் கடுமையான ஒழுக்கப் பொருளை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: בְּעַמֶּיךָ
  choice: உன் மக்களிடையே
  rationale: ב முன்னிடைச்சொல்லும் ‘உன் மக்கள்’ என்பதும் சேர்ந்து, உடன்படிக்கைச் சமூகத்திற்குள் நிகழும் நடத்தையைச் சுட்டுகின்றன; ‘மக்களிடையே’ இதை இயல்பாகத் தருகிறது.
- source_word: תַעֲמֹד
  choice: நிற்காதே
  rationale: עמד என்பதன் அடிப்படைப் பொருள் ‘நில்.’ மூலத்தின் காட்சிப்படிமத்தையும் அடுத்துவரும் தெளிவற்ற முன்னிடைச்சொல் அமைப்பையும் காக்க ‘நிற்காதே’ பயன்படுத்தப்பட்டது.
- source_word: עַל דַּם
  choice: இரத்தத்திற்கு எதிராக
  rationale: על இங்கு ‘எதிராக,’ ‘அருகில்/பார்த்துக்கொண்டு,’ அல்லது தொடர்புடைய வேறு நுண்பொருள்களை அனுமதிக்கிறது. முதன்மை உரையில் ‘எதிராக’ என்றும் דם-ஐ ‘இரத்தம்’ என்றும் நேரடியாகத் தருவது, அயலானின் உயிருக்கு எதிரான அல்லது அதைப் பேராபத்துக்குள்ளாக்கும் செயலைச் சுட்டும் வாய்ப்பைத் தக்கவைக்கிறது.
- source_word: רֵעֶךָ
  choice: உன் அயலான்
  rationale: רע இச்சட்ட-ஒழுக்கச் சூழலில் சமூகத்திலுள்ள சக மனிதனைக் குறிக்கிறது. ‘அயலான்’ நிறுவப்பட்ட வேதாகமச் சொல்லாகவும் சாதாரண வாசகருக்குப் புரியத்தக்கதாகவும் உள்ளது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: יהוה என்ற தனிப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல் தமிழில் பரவலாக அறியப்படும் ‘யெகோவா’ என்ற ஒலிபெயர்ப்பில் வழங்குகிறது.
theological_decisions:
- issue: לֹא תַעֲמֹד עַל דַּם רֵעֶךָ என்பதன் விளக்கம்
  choice: ‘உன் அயலானின் இரத்தத்திற்கு எதிராக நிற்காதே’ என்று மூலத்தின் சுருக்கமான உருவகத்தைப் பிரதான உரையில் தக்கவைத்தல்
  alternative: ‘உன் அயலானின் இரத்தம் சிந்தப்படும்போது பார்த்துக்கொண்டு நிற்காதே’
  rationale: 'எபிரெயச் சொற்றொடர் சுருக்கமானதும் பல நுண்பொருள்களை அனுமதிப்பதும் ஆகும்: அயலானின் உயிருக்கு எதிராகச் செயல்படுதல், அவன் உயிர் ஆபத்தில் இருக்கும்போது செயலற்றிருத்தல், அல்லது மரணத் தண்டனைக்குரிய வழக்கில் அவனுக்கு எதிராக நிற்றல் ஆகிய புரிதல்கள் முன்வைக்கப்பட்டுள்ளன. பிரதான உரை ‘இரத்தம்’ மற்றும் ‘எதிராக நிற்றல்’ என்ற வடிவத்தைப் பாதுகாக்கிறது; செயலற்ற அலட்சியத்தைச் சுட்டும் முக்கிய மாற்றுப் புரிதல் அடிக்குறிப்பில் தரப்படுகிறது.'
translation_notes:
  register: நவீன நிலையான தமிழில், நேரடியான ஒருமைத் தடை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. ‘அவதூறு’ தீங்கு விளைவிக்கும் அறிக்கைகளின் கடுமையைத் தருகிறது; ‘இரத்தம்’ என்ற மூல உருவகம் விளக்கமாக ‘உயிர்’ என்று மாற்றப்படவில்லை. அடிக்குறிப்பு குறி தொடர்புடைய இரண்டாம் கட்டளையின் பின்னர் இடப்பட்டுள்ளது.
