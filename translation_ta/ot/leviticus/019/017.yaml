  to: உன் சகோதரனை உன் உள்ளத்தில் வெறுக்காதே. உன் அயலானைக் கண்டிப்பாகக் கடிந்துகொள்; அவன் காரணமாகப் பாவக்குற்றத்தை ஏற்காதே.[a]
