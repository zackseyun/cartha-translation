source:
  edition: WLC
  text: לֹֽא תִשְׂנָ֥א אֶת אָחִ֖י/ךָ בִּ/לְבָבֶ֑/ךָ הוֹכֵ֤חַ תּוֹכִ֨יחַ֙ אֶת עֲמִיתֶ֔/ךָ וְ/לֹא תִשָּׂ֥א עָלָ֖י/ו חֵֽטְא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/017.yaml
  text: You shall not hate your brother in your heart. You shall surely rebuke your neighbor[a], and you shall not bear sin because of him.
translation:
  language: ta
  text: உன் சகோதரனை உன் உள்ளத்தில் வெறுக்காதே. உன் அயலானைக் கண்டிப்பாகக் கடிந்துகொள்; அவன் காரணமாகப் பாவக்குற்றத்தை ஏற்காதே.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயச் சொற்றொடரை ‘அவனுடைய கணக்கில் பாவக்குற்றத்தை ஏற்காதே’ என்றும் மொழிபெயர்க்கலாம். இதன் துல்லியமான தொடர்பு விவாதத்திற்குரியது: தவற்றை எதிர்கொள்ளத் தவறினால் ஒருவர் குற்றப்பொறுப்புக்கு உள்ளாகலாம் என்பதையோ, ‘அவனுடைய பாவத்தில் பங்குகொள்ளாதே’ என்பதையோ இது குறிக்கலாம்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשְׂנָא
  choice: வெறுக்காதே
  rationale: שׂנא என்பதன் நேரடியான அறநெறி வலிமையைத் தளர்த்தாமல், இயல்பான தமிழில் ‘வெறுக்காதே’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: אָחִיךָ
  choice: உன் சகோதரனை
  rationale: אָח என்பது உடன்பிறந்தவனையோ உடன்படிக்கைச் சமூகத்தைச் சேர்ந்த ஒருவனையோ குறிக்கலாம். மூலத்தின் குடும்ப/சமூக உறவுணர்வைப் பாதுகாக்க ‘சகோதரன்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: בִּלְבָבֶךָ
  choice: உன் உள்ளத்தில்
  rationale: לֵבָב சிந்தனை, நோக்கம் உள்ளிட்ட அகமனிதனைச் சுட்டுகிறது; நவீன தமிழில் இயல்பாகவும் உள்ளார்ந்த வெறுப்பைத் தெளிவாகவும் காட்ட ‘உள்ளத்தில்’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
- source_word: הוֹכֵחַ תּוֹכִיחַ
  choice: உறுதியாகக் கண்டித்துத் திருத்து
  rationale: முற்றுவினை வடிவத்துடன் வரும் infinitive absolute கட்டளைக்கு வலியுறுத்தலை அளிக்கிறது. ‘உறுதியாக’ அந்த வலிமையை வெளிப்படுத்துகிறது; יכח இங்கு தவற்றை நேரடியாகச் சுட்டிக்காட்டித் திருத்தும் பொருளைக் கொண்டிருப்பதால் ‘கண்டித்துத் திருத்து’ என வழங்கப்பட்டுள்ளது.
- source_word: עֲמִיתֶךָ
  choice: உன் அயலானை
  rationale: עָמִית சமூகத்தில் உடன் வாழும் ஒருவரைக் குறிக்கிறது. லேவியராகமம் 19-ன் அறநெறிச் சூழலில் ‘அயலான்’ இயல்பானதும் அறிமுகமானதுமான இணைச்சொல்.
- source_word: תִשָּׂא עָלָיו חֵטְא
  choice: அவன் காரணமாக நீ பாவப்பழியைச் சுமப்பாய்
  rationale: נשא חטא என்பது பாவத்தையோ அதனால் வரும் குற்றப்பழியையோ சுமத்தல்/ஏற்றல் என்ற மொழிமரபாகும்; עליו காரணம், கணக்கு அல்லது பங்குபற்றுதல் ஆகிய நிழற்பொருட்களை அனுமதிக்கிறது. ‘பாவப்பழி’ செயலும் பொறுப்பும் இணைந்திருப்பதைத் தக்கவைக்கிறது.
theological_decisions:
- issue: உறவுமுறைச் சொற்களின் சமூக வரம்பு
  choice: ‘உன் சகோதரன்’, ‘உன் அயலான்’ என்ற ஆண்பால் ஒருமை வடிவங்களைத் தக்கவைத்தல்
  alternative: ‘உன் சக மனிதன்’ அல்லது ‘மற்றொரு இஸ்ரவேலன்’
  rationale: எபிரெய உரை இலக்கணரீதியாக ஆண்பால் ஒருமையைப் பயன்படுத்தினாலும், அது சமூக உறுப்பினரைப் பிரதிநிதித்துவ முறையில் குறிக்கக்கூடும். குறிப்பாக ‘இஸ்ரவேலன்’ எனச் சுருக்காமலும், பாலினநடுநிலையாக்கி மூல உருவகத்தை அழிக்காமலும் உறவுமுறை மொழி பாதுகாக்கப்பட்டுள்ளது.
- issue: தவறைக் கண்டிக்காமல் இருப்பதால் வரும் பொறுப்பு
  choice: ‘இல்லையெனில்’ மூலம் கட்டளைகளுக்கிடையேயான விளைவுத் தொடர்பை வெளிப்படுத்தி, ‘அவன் காரணமாக நீ பாவப்பழியைச் சுமப்பாய்’ என வழங்குதல்
  alternative: ‘அவன்மேல் பாவத்தைச் சுமத்தாதே’ அல்லது ‘அவனுடைய பாவத்தில் பங்குகொள்ளாதே’
  rationale: וְלֹא תִשָּׂא עָלָיו חֵטְא என்ற சொற்றொடர் மொழிமரபுசார் தெளிவின்மையைக் கொண்டுள்ளது. சூழல், தவற்றை எதிர்கொள்ளத் தவறுவதால் ஒருவன் குற்றப்பொறுப்புக்குள்ளாவதை ஆதரிக்கிறது; இருப்பினும் பிற சாத்தியங்களை அடிக்குறிப்பு வெளிப்படையாகப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், நேரடியான இரண்டாம் நபர் ஒருமைக் கட்டளைகள் பயன்படுத்தப்பட்டுள்ளன. ‘கண்டித்துத் திருத்து’ என்பது வெறும் கடிந்துகொள்ளுதலைவிட, தவற்றை நேரடியாகச் சுட்டிக்காட்டித் திருத்த முயல்வதை உணர்த்துகிறது. மூலத்தின் இறுதிச் சொற்றொடரில் உள்ள உண்மையான பொருள் நிழல்கள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.
