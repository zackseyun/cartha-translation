  text: You shall not swear falsely by my name and so profane the name of your God[a]. I am Yahweh.
translation:
  language: ta
  text: என் பெயரால் பொய்யாகச் சத்தியம் செய்யாதீர்கள்; அவ்வாறு உங்கள் கடவுளின் பெயரின் புனிதத்தைக் குலைக்காதீர்கள்.[a] நான் யாவே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்கு நெருக்கமாக: “என் பெயரால் பொய்க்காகச் சத்தியம் செய்யாதீர்கள்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשָּׁבְעוּ
  choice: ஆணை இடாதீர்கள்
  rationale: שׁבע என்பதன் நிஃபால் வடிவம் இச்சட்டச் சூழலில் ஆணையிடுதல் அல்லது சத்தியம் செய்தல் என்பதைக் குறிக்கிறது. பன்மைத் தடை வடிவத்தை இயல்பான நவீனத் தமிழில் நேரடியாகப் பேணுகிறது.
- source_word: בִשְׁמִי
  choice: என் பெயரால்
  rationale: ஆணைச் சூழலில் ב என்ற முன்னொட்டு, அந்தப் பெயரை ஆணைக்கான சான்றாக அழைப்பதைக் குறிக்கிறது; ஆகவே ‘என் பெயரால்’ பொருத்தமானது.
- source_word: לַשָּׁקֶר
  choice: பொய்யாணை
  rationale: சொல்லுக்கு நெருக்கமாக ‘பொய்க்காக’ என இருந்தாலும், இங்கு ஆணையின் பொய்மையான தன்மையைக் குறிக்கும் வினையடைப் பொருள் உள்ளது. ‘பொய்யாணை இடுதல்’ தமிழில் தெளிவாகவும் சுருக்கமாகவும் உள்ளது.
- source_word: וְחִלַּלְתָּ
  choice: அதனால் ... தீட்டுப்படுத்தாதீர்கள்
  rationale: חלל என்பதன் பியேல் வடிவம் புனிதமானதைப் பொதுமையாக்குதல், அவமதித்தல் அல்லது தீட்டுப்படுத்துதல் என்பதைக் குறிக்கிறது. இணைப்புச் சொல் இங்கு பொய்யாணையின் விளைவைக் காட்டக்கூடும்; ‘அதனால்’ அந்தத் தொடர்பைப் பேணுகிறது.
- source_word: שֵׁם
  choice: பெயர்
  rationale: கடவுளின் வெளிப்படுத்தப்பட்ட அடையாளத்தையும் மதிப்பையும் குறிக்கும் மூல உருவகத்தை மொழிபெயர்ப்பு அப்படியே பேணுகிறது.
- source_word: אֱלֹהֶיךָ
  choice: உங்கள் கடவுள்
  rationale: אֱלֹהִים வடிவத்தில் பன்மையாக இருந்தாலும், இங்கு ஒருமைச் சுட்டுடன் இஸ்ரவேலின் ஒரே கடவுளைக் குறிக்கிறது. எபிரெய உரையின் இரண்டாம் நபர் ஆண்பால் ஒருமை, சூழலில் சமூகத்துக்கான சட்ட உரையாக இருப்பதால் இயல்பான தமிழ் மரியாதை/பொதுப் பன்மையில் தரப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எழுத்துத் தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், நவீனத் தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பாக ‘யாவே’ எனத் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூல உரை தெய்வீகப் பெயரையே பயன்படுத்துவதால், அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது அதன் தனிப்பெயர்த் தன்மையைப் பேணுகிறது.
- issue: இரண்டாம் கூறின் தொடர்பு
  choice: 'விளைவுத் தொடர்பு: ‘அதனால் ... தீட்டுப்படுத்தாதீர்கள்’'
  alternative: 'எளிய இணைப்பு: ‘... தீட்டுப்படுத்தாதீர்கள்’'
  rationale: எபிரெய וְ எளிய இணைப்பாகவும் விளைவைக் குறிக்கவும் இயலும். இச்சூழலில் பொய்யாணை கடவுளின் பெயரைத் தீட்டுப்படுத்துகிறது என்ற தொடர்பு தெளிவாக உள்ளது; இருப்பினும் அதன் இலக்கணத் தெளிவின்மையை அடிக்குறிப்பு குறிப்பிடுகிறது.
