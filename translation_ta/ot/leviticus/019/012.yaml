  register: நவீன நிலையான, கண்ணியமான தமிழ். சட்டத் தடையின் நேரடித் தன்மையைப் பேண ‘ஆணை இடாதீர்கள்’ பயன்படுத்தப்பட்டுள்ளது. தனிப்பட்ட ஒருமை வடிவமுள்ள எபிரெய கட்டளை, தமிழில் சமூகத்தை நோக்கும் இயல்பான மரியாதை/பொதுப் பன்மையில் மொழிபெயர்க்கப்பட்டுள்ளது.
