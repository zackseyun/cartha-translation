  text: וּ/בַ/שָּׁנָה֙ הָ/רְבִיעִ֔ת יִהְיֶ֖ה כָּל פִּרְי֑/וֹ קֹ֥דֶשׁ הִלּוּלִ֖ים לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/024.yaml
  text: But in the fourth year all its fruit shall be holy[a], for giving praise to Yahweh.
translation:
  language: ta
  text: ஆனால் நான்காம் ஆண்டில் அதன் பழங்கள் அனைத்தும் யெகோவாவைப் புகழ்வதற்காகப் பரிசுத்தமானவையாக இருக்கும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொற்சொல்லான மொழிபெயர்ப்பு: “பரிசுத்தமானவை—யெகோவாவுக்குரிய புகழ்ச்சிகள்” அல்லது “பரிசுத்தமானவை—யெகோவாவைப் புகழ்வதற்காக.” இந்த எபிரெயச் சொற்றொடர் அரிதானது; பழங்களோடு செலுத்தப்பட்ட மகிழ்ச்சியான புகழ்ச்சியை இது வலியுறுத்தலாம்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַשָּׁנָה הָרְבִיעִת
  choice: ஆனால் நான்காம் ஆண்டில்
  rationale: ו இங்கு முந்தைய மூன்று ஆண்டுகளுடன் உள்ள வேறுபாட்டைக் காட்டுகிறது; ב காலத்தைக் குறிக்கிறது; הָרְבִיעִת என்பது ‘நான்காம்’ என்ற வரிசை எண்ணாகும்.
- source_word: יִהְיֶה
  choice: இருக்கும்
  rationale: சட்ட அறிவுறுத்தலின் எதிர்காலப் பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: כָּל פִּרְיוֹ
  choice: அதன் பழங்கள் அனைத்தும்
  rationale: மரத்தின் முழு விளைச்சலையும் குறிக்கிறது; தமிழில் கூட்டுப் பொருளை இயல்பாக வெளிப்படுத்தப் பன்மை பயன்படுத்தப்பட்டுள்ளது.
- source_word: קֹדֶשׁ
  choice: பரிசுத்தமானவையாக
  rationale: பழங்கள் கடவுளுக்கென்று பிரித்துவைக்கப்பட்ட புனித நிலையைச் சுட்டும் பயனிலைச் சொல்லாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: הִלּוּלִים
  choice: புகழ்வதற்காக
  rationale: அரிதாக வரும் இந்தப் பன்மைப் பெயர்ச்சொல் புகழ்ச்சி அல்லது கொண்டாட்டத்தைக் குறிக்கிறது; ‘காணிக்கை’ என்ற மூலத்தில் இல்லாத குறிப்பிட்ட கருத்தைச் சேர்க்காமல் நோக்கத்தை இயல்பாகத் தருகிறது.
- source_word: לַיהוָה
  choice: யெகோவாவைப்
  rationale: ל அர்ப்பணிப்பு அல்லது நோக்கத்தைச் சுட்டுகிறது; יהוה என்ற உடன்படிக்கைப் பெயர் தமிழில் பரவலாக அறியப்படும் ‘யெகோவா’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: קֹדֶשׁ הִלּוּלִים என்ற அரிய வழிபாட்டுச் சொற்றொடரின் பொருள்
  choice: யெகோவாவைப் புகழ்வதற்காகப் பரிசுத்தமானவையாக
  alternative: ‘பரிசுத்தமானவை—யெகோவாவுக்குரிய புகழ்ச்சிகள்’ அல்லது ‘யெகோவாவுக்குப் புகழ்ச்சி செலுத்துவதற்காகப் பரிசுத்தமானவை’
  rationale: மூலத்தின் ‘பரிசுத்தம்’ மற்றும் ‘புகழ்ச்சி/கொண்டாட்டம்’ ஆகிய இரு கூறுகளையும் வைத்துக்கொண்டு, அது முறையாக ஒரு ‘காணிக்கை’ என்று தீர்மானிக்காமல் அரிய சொற்றொடரின் தெளிவின்மையை அடிக்குறிப்பில் பாதுகாக்கிறது.
- issue: יהוה என்ற இறைப் பெயர்
  choice: யெகோவா
  alternative: கர்த்தர்; யாவே
  rationale: மூலத்தில் நேரடியாக வரும் தனிப்பெயரை பொதுப்பட்டமாக மாற்றாமல், தமிழ் வாசகர்களுக்குப் பரவலாக அறிமுகமான வடிவில் தருகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சட்ட உரைக்கு ஏற்ற கண்ணியமான எளிய நடை பயன்படுத்தப்பட்டுள்ளது. அரிய வழிபாட்டுச் சொற்றொடரின் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
