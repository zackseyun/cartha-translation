id: LEV.19.5
reference: Leviticus 19:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/כִ֧י תִזְבְּח֛וּ זֶ֥בַח שְׁלָמִ֖ים לַ/יהוָ֑ה לִֽ/רְצֹנְ/כֶ֖ם תִּזְבָּחֻֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/005.yaml
  text: And when you sacrifice a peace offering to Yahweh[a], you shall sacrifice it so that you may be accepted.
translation:
  language: ta
  text: நீங்கள் யாவேவுக்குச் சமாதானப் பலியைச் செலுத்தும்போது, நீங்கள் ஏற்றுக்கொள்ளப்படும்படி அதைச் செலுத்த வேண்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/כִי
  choice: நீங்கள் ... பலியிடும்போது
  rationale: சட்டவழக்கில் வரும் நிபந்தனை–காலச் சூழலை இயல்பான தமிழில் ‘...போது’ என்று தருகிறது; செயலை வெறும் கற்பனையான நிபந்தனையாக மாற்றுவதில்லை.
- source_word: תִזְבְּחוּ
  choice: பலியிடும்போது
  rationale: זבח என்பது இச்சடங்குச் சூழலில் பலியாகக் கொல்லுதல் அல்லது செலுத்துதல். ‘பலியிடு’ அதன் வழிபாட்டுச் சிறப்பையும் தமிழின் இயல்பையும் காக்கிறது.
- source_word: זֶבַח שְׁלָמִים
  choice: சமாதானப் பலி
  rationale: இது அறியப்பட்ட பலிவகையின் மரபான, வெளிப்படையான தமிழ்ப் பெயர். ‘உறவுப் பலி’ போன்ற சொற்கள் அதன் ஒரு விளக்கத்தை மட்டும் முன்னிறுத்தக்கூடும்.
- source_word: לַ/יהוָה
  choice: யாவேவுக்கு
  rationale: ל அர்ப்பணிப்பின் நோக்கைச் சுட்டுகிறது; יהוה என்ற உடன்படிக்கைப் பெயர் பட்டப்பெயராக மாற்றப்படாமல் ‘யாவே’ என ஒலிபெயர்க்கப்படுகிறது.
- source_word: לִ/רְצֹנְ/כֶם
  choice: நீங்கள் ஏற்றுக்கொள்ளப்படும்படி
  rationale: பலிச்சட்டச் சூழலில் רָצוֹן வழிபடுகிறவர்கள் கடவுளால் ஏற்றுக்கொள்ளப்படுவதைக் குறிக்கிறது. ‘உங்கள் விருப்பப்படி’ என்பது இங்கு தவறான கருத்தைத் தரும்.
- source_word: תִּזְבָּחֻהוּ
  choice: அதைப் பலியிட வேண்டும்
  rationale: ஆண்பால் ஒருமை பின்னொட்டு முன் கூறிய பலியைக் குறிக்கிறது. வினையின் மறுபயன்பாட்டையும் சட்டக் கட்டளையின் வலிமையையும் தமிழில் காக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: யெகோவா; கர்த்தர்
  rationale: எபிரெய மூலத்தில் நான்கெழுத்து இறைப்பெயர் நேரடியாக உள்ளது. அதைப் பட்டப்பெயராக மாற்றாமல் ‘Yahweh’ என்பதற்குரிய தமிழ் ஒலிபெயர்ப்பாக ‘யாவே’ பயன்படுத்தப்படுகிறது.
- issue: לִרְצֹנְכֶם என்பதன் பலிச்சட்டப் பொருள்
  choice: நீங்கள் ஏற்றுக்கொள்ளப்படும்படி
  alternative: உங்கள் ஏற்றுக்கொள்ளுதலுக்காக; உங்கள் விருப்பப்படி
  rationale: இது பலியைச் செலுத்துகிறவர்கள் கடவுளுக்கு ஏற்றவர்களாக இருப்பதைக் குறிக்கும் வழிபாட்டுச் சொல்லாட்சி. எபிரெயத்தின் சுருக்கமான அமைப்பு கொண்டுள்ள நுட்பத்தை அடிக்குறிப்பு பதிவு செய்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான சட்ட–வழிபாட்டு நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் ஒரே வேர் வினை இருமுறை வருவதால் ‘பலியிடு’ என்பதும் இருமுறை வைக்கப்பட்டுள்ளது; ‘சமாதானப் பலி’ என்ற பரவலாக அறியப்பட்ட பலிவகைப் பெயர் காக்கப்பட்டுள்ளது.
