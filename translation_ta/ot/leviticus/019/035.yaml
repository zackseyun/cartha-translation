source:
  edition: WLC
  text: לֹא תַעֲשׂ֥וּ עָ֖וֶל בַּ/מִּשְׁפָּ֑ט בַּ/מִּדָּ֕ה בַּ/מִּשְׁקָ֖ל וּ/בַ/מְּשׂוּרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/035.yaml
  text: You shall not commit injustice in judgment[a], in measures of length, weight, or volume.
translation:
  language: ta
  text: தீர்ப்பிலோ[a], நீளம் அளப்பதிலோ, எடை போடுவதிலோ, கொள்ளளவு அளப்பதிலோ நீங்கள் அநீதி செய்யக்கூடாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீதியிலோ, அளவிலோ, எடையிலோ, கொள்ளளவு அளவிலோ நீங்கள் அநியாயம் செய்யக்கூடாது.”
    reason: מִשְׁפָּט என்பதற்கு ‘தீர்ப்பு’ அல்லது ‘நீதி’ எனப் பொருள்கொள்ளலாம்; עָוֶל என்பதற்கு ‘அநீதி’ அல்லது ‘அநியாயம்’ என மொழிபெயர்க்கலாம். மாற்று வாசகம் எபிரெயச் சொற்களின் பரந்த பொருளையும் அமைப்பையும் நெருக்கமாகக் காக்கிறது.
lexical_decisions:
- source_word: לֹא תַעֲשׂוּ
  choice: நீங்கள் ... செய்யக்கூடாது
  rationale: இது இரண்டாம் நபர் பன்மைக்கான தடை. நவீனத் தமிழில் சட்டக் கட்டளையின் வலிமையையும் இயல்பான நடையையும் ‘செய்யக்கூடாது’ தெளிவாகத் தருகிறது.
- source_word: עָוֶל
  choice: அநீதி
  rationale: இச்சொல் தவறு, நேர்மையின்மை, அநியாயம் ஆகிய பொருள்களைக் கொண்டது. தீர்ப்பும் வணிக அளவீடுகளும் இடம்பெறும் சூழலில் ‘அநீதி’ பொருத்தமான விரிவைக் காக்கிறது.
- source_word: בַּמִּשְׁפָּט
  choice: தீர்ப்பு வழங்குவதில்
  rationale: מִשְׁפָּט என்பது தீர்ப்பு, நீதி, நீதிமுறை எனப் பொருள்படலாம். ‘தீர்ப்பு வழங்குவதில்’ மூலத்தின் நீதித்துறை சார்ந்த பொருளை இயல்பான தமிழில் தருகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: בַּמִּדָּה
  choice: நீளம் அளப்பதில்
  rationale: மִדָּה பொதுவாக அளவைக் குறிக்கிறது. எடையும் கொள்ளளவும் தனித்தனியாகத் தொடர்வதால், இங்கே நீளம் அல்லது பரிமாண அளவு என்ற வேறுபாட்டை ‘நீளம் அளப்பதில்’ தெளிவாக்குகிறது.
- source_word: בַּמִּשְׁקָל
  choice: எடை போடுவதில்
  rationale: מִשְׁקָל என்பது எடை அல்லது எடையிடுதலைக் குறிக்கிறது. ‘எடை போடுதல்’ வணிகச் சூழலில் பொதுமக்களுக்கு இயல்பாகப் புரியும் நடை.
- source_word: וּבַמְּשׂוּרָה
  choice: கொள்ளளவு அளப்பதில்
  rationale: מְשׂוּרָה என்பது குறிப்பாக ஒரு பாத்திரம் தாங்கும் அளவு அல்லது கொள்ளளவு அளவைக் குறிக்கிறது. ‘கொள்ளளவு’ திரவம், உலர் பொருள் இரண்டுக்கும் பொருந்தி, மூலத்தைத் தேவையின்றிக் குறுக்காது.
