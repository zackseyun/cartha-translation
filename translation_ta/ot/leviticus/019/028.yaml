base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/028.yaml
  text: You shall not make any cuts in your flesh for the dead[a], and you shall not put a tattoo mark on yourselves[b]. I am Yahweh.
translation:
  language: ta
  text: இறந்தவருக்காக[a] உங்கள் உடலில் வெட்டுக்காயங்களை உண்டாக்க வேண்டாம்; உங்கள் உடலில் பச்சைக் குறியைப் பதிக்க வேண்டாம்[b]. நான் யாவே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இறந்த ஒருவருக்காக.” இந்த எபிரெயச் சொற்றொடர் இறந்தவருக்காக மேற்கொள்ளப்படும் துக்கச்சடங்கைப் பொதுவாகக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “பொறிக்கப்பட்ட குறி” அல்லது “பச்சைக் குறி.” இந்த எபிரெயச் சொற்றொடர் அரிதானது; உடலில் நிலையாகப் பதிக்கப்படும் ஒரு குறியை இது குறித்திருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׂרֶט
  choice: வெட்டுக்காயங்கள்
  rationale: உடலில் ஏற்படுத்தப்படும் வெட்டு அல்லது கீறலைக் குறிக்கிறது. தமிழில் இயல்பாகவும், கருவி அல்லது காயத்தின் தீவிரத்தைத் தேவையின்றிக் குறிப்பாக்காமலும் உள்ளது.
- source_word: לָנֶפֶשׁ
  choice: இறந்தவருக்காக
  rationale: இந்தச் சட்ட மற்றும் துக்கச்சடங்கு சூழலில் נֶפֶשׁ என்பது இறந்த ஒருவரைக் குறிக்கும் மரபுத்தொடராக உள்ளது; ஒருமை வடிவத்தையும் தமிழ் இயல்பையும் காக்கிறது.
- source_word: בִּבְשַׂרְכֶם
  choice: உங்கள் உடலில்
  rationale: சொல்லாட்சியில் 'உங்கள் சதையில்' எனலாம்; ஆனால் உடலில் செய்யப்படும் செயலை நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் தெரிவிக்க 'உங்கள் உடலில்' தேர்ந்தெடுக்கப்பட்டது.
- source_word: כְתֹבֶת קַעֲקַע
  choice: பச்சைக் குறி
  rationale: அரிதான இந்த இணைச்சொல் உடலில் பொறிக்கப்படும் அல்லது நிலையாகப் பதிக்கப்படும் குறியைக் குறிப்பதாகத் தெரிகிறது. தமிழில் tattoo என்பதற்கான பொதுவான, புரியத்தக்க சொல் 'பச்சைக் குறி'; அரிதான மூலச்சொல்லின் நிச்சயமின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: לֹא תִתְּנוּ ... בָּכֶם
  choice: உங்கள் உடலில் ... பதிக்க வேண்டாம்
  rationale: נתן உடன் בְּ இங்கு உடல்மீது ஒரு குறியை இடுதல் அல்லது பதித்தலைக் குறிக்கிறது. 'பதிக்க வேண்டாம்' என்பது நேரடியான தடையை இயல்பான தமிழில் தருகிறது.
- source_word: אֲנִי יְהוָה
  choice: நான் யெகோவா
  rationale: தெய்வீகப் பெயரான יהוה என்பதை பொதுப்பட்டமான 'கர்த்தர்' என்று மாற்றாமல், தனிப்பெயராகத் தமிழில் 'யெகோவா' என்று ஒலிபெயர்த்து உடன்படிக்கைச் சுயஅடையாளத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: உடலில் குறியிடுதல் பற்றிய தடையின் வரம்பு
  choice: முதல் தடையை இறந்தவருக்கான வெட்டுக்காயங்களோடு வெளிப்படையாக இணைத்து, பச்சைக் குறி பற்றிய இரண்டாம் தடையைத் தனியாக மொழிபெயர்த்தல்
  alternative: இரு தடைகளையும் இறந்தோருக்கான துக்கச்சடங்குகளுக்கு மட்டும் வரையறுத்தல், அல்லது எல்லாக் காலங்களிலும் எல்லா வகையான நவீன பச்சைக் குத்துதல்களுக்கும் பொருந்தும் முழுமையான தடையாக விரிவாக்குதல்
  rationale: எபிரெய உரை לָנֶפֶשׁ என்பதை முதல் தடையோடு இணைக்கிறது; இரண்டாம் தடையில் அதை மீண்டும் கூறவில்லை. எனவே மொழிபெயர்ப்பு உரையின் அமைப்பை மட்டும் வெளிப்படுத்தி, அதன் பயன்பாட்டு வரம்பைச் சுருக்கவோ விரிவாக்கவோ கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில், நேரடியும் கண்ணியமுமான சட்டநடை பயன்படுத்தப்பட்டுள்ளது. 'சதை' என்ற மிகச் சொல்லாட்சி வடிவத்தைவிட 'உடல்' தெளிவுக்காகத் தேர்ந்தெடுக்கப்பட்டது. இரு அடிக்குறிப்பு அடையாளங்களும் தொடர்புடைய சொற்றொடர்களுக்குப் பின் முதன்மை உரையில் இடம்பெறுகின்றன.
