  yaml_path: translation/ot/leviticus/019/018.yaml
  text: You shall not take vengeance or bear a grudge against the sons of your people[a], but you shall love your neighbor as yourself; I am Yahweh.
translation:
  language: ta
  text: உன் சொந்த மக்களிடம்[a] பழிவாங்காதே; அவர்கள்மீது பகையை மனதில் வைத்திருக்காதே. உன் அயலானை உன்னைப் போலவே நேசி. நானே யாவே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்கு சொல்: “உன் மக்களின் மகன்களிடம்.” இச்சொற்றொடர் உன் சொந்த மக்களைச் சேர்ந்தவர்களைக் குறிக்கிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִקֹּם
  choice: பழிவாங்காதே
  rationale: נקם என்பது பதிலுக்குப் பதில் தீங்கு செய்வதையோ பழி தீர்ப்பதையோ குறிக்கிறது. “பழிவாங்காதே” என்பது அதன் செயற்பாட்டு வலிமையை இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: תִטֹּר
  choice: மனக்கசப்பை வைத்திருக்காதே
  rationale: נטר இச்சூழலில் கோபத்தையோ பகை உணர்வையோ தொடர்ந்து மனத்தில் வைத்திருப்பதைக் குறிக்கிறது. இத்தேர்வு அதன் நீடித்த மனநிலையைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: בְּנֵי עַמֶּךָ
  choice: உன் சொந்த மக்கள்
  rationale: சொல்லுக்கு சொல் “உன் மக்களின் மகன்கள்” என்றாலும், எபிரெயச் சொற்றொடர் ஒரே சமூகத்தைச் சேர்ந்தவர்களைக் குறிக்கும் வழக்குச் சொல்லாகும். இயல்பான தமிழுக்காக “உன் சொந்த மக்கள்” எனத் தரப்பட்டு, நேரடி வடிவம் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- source_word: וְאָהַבְתָּ
  choice: நேசி
  rationale: சட்டச் சூழலில் waw உடன் வரும் perfect வடிவம் கட்டளை வலிமை பெறுகிறது. “நேசி” அதை நேரடியான ஒருமை கட்டளையாகத் தருகிறது.
- source_word: לְרֵעֲךָ
  choice: உனக்கு அடுத்திருப்பவரை
  rationale: רֵעַ என்பது அருகிலுள்ளவர், உடனிருப்பவர், சகமனிதர் அல்லது தோழர் எனப் பொருள்படலாம். “உனக்கு அடுத்திருப்பவர்” என்பது உடனடி சமூகச் சூழலைக் காத்து, குடியிருப்பு அயலவர் என்ற பொருளுக்கு மட்டும் சொற்றொடரைச் சுருக்காது.
- source_word: כָּמוֹךָ
  choice: உன்னைப் போலவே
  rationale: ஒப்பீட்டுச் சொற்றொடரின் சுருக்கத்தையும், அன்பின் அளவுகோலாகத் தன்னையே முன்வைக்கும் பொருளையும் இயல்பாகக் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், எபிரெய நான்கெழுத்துப் பெயரின் வழக்கமான ஒலிபெயர்ப்பாகத் தமிழில் வழங்குகிறது.
theological_decisions:
- issue: கட்டளையின் பொருள் கொள்ளும் சமூக வட்டம்
  choice: בְּנֵי עַמֶּךָ என்பதைக் “உன் சொந்த மக்கள்” என்றும், רֵעַ என்பதைக் “உனக்கு அடுத்திருப்பவர்” என்றும் தனித்தனியாக வழங்குதல்
  alternative: இரண்டையும் வேறுபாடின்றி உலகளாவிய “அனைவரும்” என்ற மொழியில் விரிவாக்குதல் அல்லது ஆண்களை மட்டும் குறிக்கும் சொல்லாட்சியாகக் கட்டுப்படுத்துதல்
  rationale: எபிரெய உரையில் இரண்டு வேறுபட்ட சொற்றொடர்கள் உள்ளன. மொழிபெயர்ப்பு உடனடி உடன்படிக்கைச் சமூகச் சூழலைக் காக்கிறது; அதேவேளை பின்னாளைய விரிவாக்கத்தையோ குறுக்கத்தையோ வசனத்திற்குள் சேர்க்கவில்லை.
- issue: தெய்வீகப் பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர் அல்லது யெகோவா
  rationale: יְהוָה என்பதை பட்டமாக மாற்றாமல் தனிப்பெயராகக் காக்கிறது; எபிரெய உரைக்குச் சமீபமான பரவலான ஒலிப்பைத் தமிழில் தருகிறது.
