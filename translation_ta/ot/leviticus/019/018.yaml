  register: நவீனத் தரத் தமிழில் நேரடியான ஒருமைக் கட்டளைகள் பயன்படுத்தப்பட்டுள்ளன. மொழிநடை எளிமையாகவும் கண்ணியமாகவும் வைக்கப்பட்டுள்ளது; எபிரெயச் சட்ட மொழியின் கட்டளை வலிமை பாதுகாக்கப்பட்டுள்ளது.
