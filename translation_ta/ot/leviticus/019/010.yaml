- source_word: אֱלֹהֵיכֶם
  choice: உங்கள் கடவுள்
  rationale: உடன்படிக்கைச் சூத்திரத்தின் நேரடியான பொருளைப் பாதுகாக்கிறது; எபிரெயச் சொல்லின் பன்மை இரண்டாம் நபர் உருபும் தமிழில் ‘உங்கள்’ எனத் தெளிவாகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே
  rationale: பெயரை ‘ஆண்டவர்’ என்ற பட்டத்தால் மாற்றாமல் தனிப்பெயராகவே தருகிறது. எபிரெய உயிரொலிப்பு உறுதியற்றதால் ‘யாவே’ என்பதும் சாத்தியம்; நவீன தமிழ்க் கிறிஸ்தவப் பயன்பாட்டில் எளிதில் அறியப்படும் ‘யெகோவா’ இங்கு தேர்ந்தெடுக்கப்பட்டது.
- issue: கட்டளையின் ஒருமையும் இறுதி உடன்படிக்கைச் சூத்திரத்தின் பன்மையும்
  choice: ‘உன்/விட்டுவிடு’ என்ற ஒருமையையும் ‘உங்கள் கடவுள்’ என்ற பன்மையையும் அப்படியே பாதுகாத்தல்
  alternative: தமிழில் அனைத்தையும் ஒரே எண்ணாக ஒத்திசைத்தல்
  rationale: எபிரெய மூலத்தில் வயல் உரிமையாளருக்கான கட்டளைகள் ஒருமையிலும், இறுதிச் சூத்திரம் சமூகத்தை நோக்கிய பன்மையிலும் உள்ளன; இந்த மாற்றத்தைச் சீராக்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான சட்டநடை பயன்படுத்தப்பட்டுள்ளது. அறுவடைச் செயலை விளக்கத் தேவையான அளவுக்கு மட்டும் விரிவாக்கம் செய்யப்பட்டுள்ளது. எபிரெய மூலத்தின் ஒருமை–பன்மை மாறுபாடு பாதுகாக்கப்பட்டுள்ளது; எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
