  yaml_path: translation/ot/leviticus/019/010.yaml
  text: And you shall not strip your vineyard bare[a], nor shall you gather the fallen grapes of your vineyard; you shall leave them for the poor and for the sojourner[c][b]. I am Yahweh your God.
translation:
  language: ta
  text: உன் திராட்சைத்தோட்டத்தில் மீதமிருக்கும் திராட்சைகளை மீண்டும் பறிக்காதே[a]; உன் திராட்சைத்தோட்டத்தில் உதிர்ந்த திராட்சைகளைப் பொறுக்காதே[b]. அவற்றை ஏழைகளுக்கும் உங்களிடையே குடியிருக்கும் அயல்நாட்டவருக்கும்[c] விட்டுவிடு. நானே உங்கள் கடவுளாகிய யாவே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் திராட்சைத்தோட்டத்தை முழுமையாகப் பறிக்காதே.” எபிரெய வினை, முதன்மை அறுவடைக்குப் பிறகு கொடிகளில் மீதமிருப்பதை மீண்டும் சென்று எடுத்துக்கொள்வதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உன் திராட்சைத்தோட்டத்தின் அறுவடை மீதிகளைப் பொறுக்காதே.” எபிரெயச் சொல், அறுவடையின்போது உதிர்ந்தோ விடப்பட்டோ இருக்கும் திராட்சைகளைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “குடியிருக்கும் வெளிநாட்டவருக்கும்.” இங்குள்ள எபிரெயச் சொல், இஸ்ரவேலரிடையே வாழும் பூர்வீகமல்லாத குடியிருப்பாளரைக் குறிக்கிறது.
    reason: lexical_alternative
