revisions:
- from: ஆனால் மூன்றாம் நாளில் அது உண்ணப்பட்டால், அது அருவருப்பானதாகும்[a]; அது ஏற்றுக்கொள்ளப்படாது.
  to: ஆனால், மூன்றாம் நாளில் அது ஒருவேளை உண்ணப்பட்டால், அந்தப் பலியுணவு ஏற்கத்தகாததாகும்[a]; அது ஏற்றுக்கொள்ளப்படாது.
  rationale: The revision replaces the potentially overbroad அருவருப்பானதாகும் in the main text with a contextually precise statement of sacrificial unacceptability. It retains lexical alternatives in the footnote and adds a restrained Tamil equivalent for the Hebrew verbal emphasis. No disputed interpretation or denominational claim is introduced.
