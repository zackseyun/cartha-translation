source:
  edition: WLC
  text: וְ/אִ֛ם הֵאָכֹ֥ל יֵאָכֵ֖ל בַּ/יּ֣וֹם הַ/שְּׁלִישִׁ֑י פִּגּ֥וּל ה֖וּא לֹ֥א יֵרָצֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/007.yaml
  text: But if it is eaten at all on the third day[a], it is a defiled thing; it will not be accepted.
translation:
  language: ta
  text: ஆனால், மூன்றாம் நாளில் அது ஒருவேளை உண்ணப்பட்டால், அந்தப் பலியுணவு ஏற்கத்தகாததாகும்[a]; அது ஏற்றுக்கொள்ளப்படாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அருவருப்பானதாகும்,” “மாசுபட்டதாகும்,” அல்லது “கறைபட்டதாகும்.” எபிரெயச் சொல், அனுமதிக்கப்பட்ட காலத்திற்குப் பிறகு உண்ணப்படுவதால் ஏற்றுக்கொள்ளத்தகாததாகிவிட்ட பலியுணவைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: ஆனால் … உண்ணப்பட்டால்
  rationale: இணைப்புச்சொல்லின் எதிர்மறைத் திருப்பத்தையும் நிபந்தனைப் பொருளையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הֵאָכֹל יֵאָכֵל
  choice: உண்ணப்பட்டால்
  rationale: எபிரெயத்தில் வினைச்செயலை வலியுறுத்தும் infinitive absolute அமைப்பு உள்ளது. தமிழில் செயப்பாட்டு நிபந்தனை இயல்பாக உள்ளது; சூழலிலுள்ள கடுமையான எச்சரிக்கை வலியுறுத்தலைத் தாங்குகிறது.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: மூன்றாம் நாளில்
  rationale: காலக் குறிப்பை நேரடியாகவும் துல்லியமாகவும் தருகிறது.
- source_word: פִּגּוּל
  choice: அருவருப்பானதாகும்
  rationale: பலியுணவு அனுமதிக்கப்பட்ட காலத்தைக் கடந்ததால் வழிபாட்டுரீதியாக ஏற்கத்தகாத நிலையை அடைவதைச் சுட்டுகிறது. பொதுவான உடல் அழுகையையோ வேறு எபிரெயத் தடைவார்த்தைகளின் முழுப் பொருளையோ இதில் இறக்குமதி செய்யவில்லை.
- source_word: הוּא
  choice: அது … ஆகும்
  rationale: முன்னர் குறிப்பிடப்பட்ட பலியுணவையே சுட்டும் வலியுறுத்தலான பயனிலை அமைப்பைத் தமிழில் தெளிவாக்குகிறது.
- source_word: לֹא יֵרָצֶה
  choice: அது ஏற்றுக்கொள்ளப்படாது
  rationale: பலியிடுதல் சார்ந்த சூழலில் רצה என்பதன் நிபால் வடிவம் கடவுளால் ஏற்றுக்கொள்ளப்படுதலைக் குறிக்கிறது; தமிழ் மொழிபெயர்ப்பு அந்த வழிபாட்டுப் பொருளைத் தெளிவாகக் காக்கிறது.
theological_decisions:
- issue: மூன்றாம் நாளில் உண்ணப்பட்ட பலியுணவின் வழிபாட்டுரீதியான நிலை
  choice: அது வழிபாட்டுரீதியாக அருவருப்பானதும் ஏற்றுக்கொள்ளப்படாததும் என மொழிபெயர்க்கப்பட்டது.
  alternative: அது வெறுமனே கெட்டுப்போன அல்லது உடல்ரீதியாக அழுகிய இறைச்சி; அல்லது மற்ற கடுமையான தடைவார்த்தைகளுக்குச் சமமான முழுமையான ‘அருவருப்பு’.
  rationale: உடனடிச் சூழல் பலியின் ஏற்றுக்கொள்ளத்தக்க தன்மையைப் பற்றியது; இறுதிக் கூறான ‘ஏற்றுக்கொள்ளப்படாது’ என்பது פִּגּוּל என்பதற்கு வழிபாட்டு-பலியியல் வரம்பை அளிக்கிறது. ஆகவே அதன் தீவிரம் காக்கப்படுகிறது; ஆனால் தேவையற்ற விரிவான கோட்பாட்டுப் பொருள் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘பலியுணவு’ என்ற விளக்கத்தை முதன்மை உரையில் சேர்க்காமல், மூலத்தின் ‘அது’ என்ற சுட்டைத் தக்கவைத்து, தேவையான வழிபாட்டுச் சூழலை அடிக்குறிப்பில் தெளிவாக்குகிறது.
