  text: מֹ֧אזְנֵי צֶ֣דֶק אַבְנֵי צֶ֗דֶק אֵ֥יפַת צֶ֛דֶק וְ/הִ֥ין צֶ֖דֶק יִהְיֶ֣ה לָ/כֶ֑ם אֲנִי֙ יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם אֲשֶׁר הוֹצֵ֥אתִי אֶתְ/כֶ֖ם מֵ/אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/036.yaml
  text: You shall have honest scales[a], honest weights, an honest ephah, and an honest hin. I am Yahweh your God[c][b], who brought you out of the land of Egypt.
translation:
  language: ta
  text: நேர்மையான தராசுகளும்[a], நேர்மையான எடைக்கற்களும், நேர்மையான ஏப்பா அளவும்[b], நேர்மையான ஹின் அளவும்[c] உங்களிடம் இருக்க வேண்டும். எகிப்து நாட்டிலிருந்து உங்களை வெளியே கொண்டுவந்த உங்கள் கடவுளாகிய யாவே நானே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நீதியான தராசுகள், நீதியான எடைக்கற்கள்’ என்றும் மொழிபெயர்க்கலாம். இவ்வசனத்தில் நான்கு முறை வரும் צֶדֶק என்ற எபிரெயச் சொல் பொதுவாக ‘நீதி’ அல்லது ‘நேர்மை’ என்பதைக் குறிக்கிறது; இங்கு அது வணிக அளவைகளுக்குப் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: ஏப்பா என்பது உலர் பொருட்களை அளக்கப் பயன்படுத்தப்பட்ட பழங்கால அளவை.
    reason: cultural_note
  - marker: c
    text: ஹின் என்பது திரவங்களை அளக்கப் பயன்படுத்தப்பட்ட பழங்கால அளவை.
    reason: cultural_note
lexical_decisions:
- source_word: מֹאזְנֵי צֶדֶק
  choice: நேர்மையான தராசுகள்
  rationale: מֹאזְנַיִם என்பது வணிகத்தில் எடைபோடப் பயன்படும் தராசுகளைக் குறிக்கிறது. இங்கு צֶדֶק நேர்மையும் நியாயமும் உள்ள வணிக நடைமுறையை வலியுறுத்துவதால், இயல்பான நவீனத் தமிழில் ‘நேர்மையான’ என மொழிபெயர்க்கப்பட்டது.
- source_word: אַבְנֵי צֶדֶק
  choice: நேர்மையான எடைக்கற்கள்
  rationale: אַבְנֵי என்பதன் நேர்ப்பொருள் ‘கற்கள்’; இங்கு அவை வணிகத்தில் பயன்படுத்தப்பட்ட எடைக்கற்கள். பழங்காலப் பொருளையும் அதன் பயன்பாட்டையும் தெளிவாகக் காட்ட ‘எடைக்கற்கள்’ எனத் தரப்பட்டது.
- source_word: אֵיפַת צֶדֶק
  choice: நேர்மையான ஏப்பா அளவு
  rationale: אֵיפָה என்பது உலர் பொருட்களுக்கான பழங்கால அளவை. தவறான நவீன மாற்றளவைத் தராமல் மூலப் பண்பாட்டுச் சொல்லைப் பாதுகாக்க ‘ஏப்பா’ என ஒலிபெயர்த்து, தெளிவுக்காக ‘அளவு’ சேர்க்கப்பட்டது.
- source_word: וְהִין צֶדֶק
  choice: நேர்மையான ஹின் அளவு
  rationale: הִין என்பது திரவங்களுக்கான பழங்கால அளவை. குறிப்பிட்ட பழங்கால அலகைப் பாதுகாக்க ‘ஹின்’ என ஒலிபெயர்த்து, வாசகருக்குத் தெளிவாக ‘அளவு’ சேர்க்கப்பட்டது.
- source_word: יִהְיֶה לָכֶם
  choice: உங்களிடம் இருக்க வேண்டும்
  rationale: ‘உங்களுக்காக இருக்கட்டும்/இருக்க வேண்டும்’ என்ற எபிரெயக் கட்டமைப்பை, உடைமையையும் கட்டளையின் கடமையையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பாகத் தருகிறது.
- source_word: אֱלֹהֵיכֶם
  choice: உங்கள் கடவுள்
  rationale: யாவேயுடன் வரும் உடன்படிக்கைச் சூத்திரத்தில் இச்சொல் ஒருமைப் பொருளில் உள்ளது; எனவே ‘உங்கள் கடவுள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: הוֹצֵאתִי אֶתְכֶם מֵאֶרֶץ מִצְרַיִם
  choice: எகிப்து நாட்டிலிருந்து உங்களை வெளியே கொண்டுவந்த
  rationale: விடுதலை நிகழ்வைக் குறிக்கும் வழக்கமான எபிரெயச் சொற்றொடரின் பொருளை இயல்பான நவீனத் தமிழில் நேரடியாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: வணிகச் சட்டச் சூழலில் நான்கு முறை வரும் צֶדֶק என்பதன் மொழிபெயர்ப்பு
  choice: நேர்மையான
  alternative: நீதியான; நியாயமான; சரியான; துல்லியமான
  rationale: צֶדֶק என்பதற்கு ‘நீதி/நேர்மை’ என்ற பரந்த பொருள் உண்டு. தராசுகள், எடைக்கற்கள், அளவைகள் ஆகியவற்றை அது இங்கு வர்ணிப்பதால், வணிக நேர்மையை இயல்பாக வெளிப்படுத்தும் ‘நேர்மையான’ தேர்ந்தெடுக்கப்பட்டது. மூலத்தில் உள்ள மறுமொழி நான்கு இடங்களிலும் பாதுகாக்கப்பட்டது.
- issue: பழங்கால அளவைகளை வழங்கும் முறை
  choice: ஏப்பா, ஹின் என்ற மூல அலகுப் பெயர்களைத் தக்கவைத்து ‘அளவு’ என விளக்குதல்
  alternative: உலர் அளவு, திரவ அளவு என்று பொதுப்படுத்துதல்; நவீன அலகுகளாக தோராயமாக மாற்றுதல்
  rationale: குறிப்பிட்ட பழங்கால அலகுகளைப் பொதுவாக்காமலும், உறுதியற்ற நவீன மாற்றளவுகளை வசனத்துக்குள் புகுத்தாமலும் மூலப் பண்பாட்டுத் தன்மை பாதுகாக்கப்படுகிறது.
- issue: יְהוָה என்ற தெய்வீகப் பெயர்
  choice: யாவே
  alternative: கர்த்தர்; ஆண்டவர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட பெயர் இருப்பதால் அதை ஒரு பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்த்துள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான சட்டப்பாங்கு பயன்படுத்தப்பட்டுள்ளது. ‘உங்களிடம் இருக்க வேண்டும்’ என்பது கட்டளையின் வலிமையை இயல்பாகக் காட்டுகிறது. צֶדֶק என்ற சொல்லின் நான்கு முறை மறுமொழி தமிழிலும் திட்டமிட்டு பாதுகாக்கப்பட்டுள்ளது.
