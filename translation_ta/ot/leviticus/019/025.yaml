id: LEV.19.25
reference: Leviticus 19:25
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וּ/בַ/שָּׁנָ֣ה הַ/חֲמִישִׁ֗ת תֹּֽאכְלוּ֙ אֶת פִּרְי֔/וֹ לְ/הוֹסִ֥יף לָ/כֶ֖ם תְּבוּאָת֑/וֹ אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/025.yaml
  text: And in the fifth year you may eat its fruit, so that it may increase its produce for you. I am Yahweh your God.
translation:
  language: ta
  text: ஐந்தாம் ஆண்டில் அதன் கனியை நீங்கள் உண்ணலாம்; அதன் விளைச்சல் உங்களுக்குப் பெருகும்படி. நான் உங்கள் கடவுளாகிய யாவே.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבַשָּׁנָה הַחֲמִישִׁת
  choice: ஐந்தாம் ஆண்டிலோ
  rationale: முந்தைய ஆண்டுகளுக்கான தடையிலிருந்து ஐந்தாம் ஆண்டின் அனுமதிக்குச் செல்லும் தொடர்ச்சியையும் மென்மையான மாறுபாட்டையும் இயல்பான தமிழில் காட்டுகிறது.
- source_word: תֹּאכְלוּ
  choice: நீங்கள் உண்ணலாம்
  rationale: சட்டச் சூழலில் இந்த வினை, முந்தைய தடைக்குப் பின் வழங்கப்படும் அனுமதியைக் குறிக்கிறது.
- source_word: אֶת־פִּרְיוֹ
  choice: அதன் கனியை
  rationale: פְּרִי என்பது இங்கு மரத்தின் கனியை நேரடியாகக் குறிக்கிறது; ஆண்பால் ஒருமை பின்னொட்டு சூழலில் அதனைக் குறிக்கிறது.
- source_word: לְהוֹסִיף
  choice: பெருக்கும்படி
  rationale: לְ உடன் வரும் வினையெச்சம் நோக்கம் அல்லது எதிர்பார்க்கப்படும் விளைவைத் தெரிவிக்கிறது; தமிழ் வடிவம் இந்த நோக்குறவை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: תְּבוּאָתוֹ
  choice: தன் விளைச்சலை
  rationale: תְּבוּאָה என்பது விளைச்சல் அல்லது மகசூலைக் குறிக்கிறது; 'விளைச்சல்' சாதாரண வாசகருக்கு தெளிவாகவும் வேளாண்மைச் சூழலுக்கு ஏற்றதாகவும் உள்ளது.
- source_word: אֲנִי יְהוָה אֱלֹהֵיכֶם
  choice: நானே உங்கள் இறைவனாகிய யெகோவா
  rationale: எபிரேய உடன்படிக்கைச் சூத்திரத்தின் வலியுறுத்தலையும், தனிப்பெயரான יהוה என்பதையும் தமிழ் வாக்கிய அமைப்பில் காக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே
  rationale: எபிரேய மூலத்தில் இறைவனின் தனிப்பெயர் நேரடியாக உள்ளது. பொதுப்பட்டமான 'ஆண்டவர்' என்பதற்குப் பதிலாக தனிப்பெயரைத் தக்கவைத்தோம்; தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் வடிவம் 'யெகோவா'.
- issue: விளைச்சல் பெருகுவதற்கும் ஐந்தாம் ஆண்டில் கனியை உண்பதற்கும் உள்ள உறவு
  choice: நோக்கம்/எதிர்பார்க்கப்படும் விளைவைத் திறந்தவாறே வைத்தல்
  alternative: கீழ்ப்படிதலுக்கான உறுதியான பலன் என்று விளக்குதல்
  rationale: לְהוֹסִיף நோக்கம் அல்லது விளைவு என்ற இரு நுணுக்கங்களையும் தாங்கலாம்; மொழிபெயர்ப்பு இதை ஒரு குறிப்பிட்ட கோட்பாட்டுச் செயல்முறையாகத் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழ்; சட்டவிதியின் கண்ணியமான தொனியுடன் சாதாரண வாசகருக்கு எளிதில் புரியும் நடை. 'கனி' மற்றும் 'விளைச்சல்' மூலம் פְּרִי / תְּבוּאָה வேறுபாடு காக்கப்பட்டுள்ளது.
