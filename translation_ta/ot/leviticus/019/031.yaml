  yaml_path: translation/ot/leviticus/019/031.yaml
  text: Do not turn to mediums or to spiritists; do not seek them out[a], to become unclean by them. I am Yahweh your God.
translation:
  language: ta
  text: ஆவி ஊடகர்களிடமோ ஆவிகளுடன் தொடர்புகொள்வோரிடமோ திரும்பாதீர்கள்; அவர்களை நாடாதீர்கள்; அவர்களால் தீட்டுப்படாதீர்கள்.[a] நானே உங்கள் கடவுளாகிய யாவே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஆவி ஊடகர்கள்” என்பதற்கு “இறந்தோரின் ஆவிகளிடம் குறிகேட்போர்” என்றும், “ஆவிகளுடன் தொடர்புகொள்வோர்” என்பதற்கு “பரிச்சய ஆவிகளுடன் தொடர்புடையோர்” அல்லது “மந்திரவாதிகள்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொற்கள் ஆவிகளையோ இறந்தோரையோ அணுகிக் குறிகேட்பதுடன் தொடர்புடைய தடைசெய்யப்பட்ட நடைமுறையாளர்களைக் குறிக்கின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפְנוּ
  choice: திரும்பாதீர்கள்
  rationale: פנה என்பதன் அடிப்படைப் பொருளான ‘திரும்புதல்/நோக்கித் திரும்புதல்’ என்பதைக் காத்து, தடைசெய்யப்பட்டவர்களின் உதவியை நாடுவதையும் இயல்பாக உணர்த்துகிறது.
- source_word: הָאֹבֹת
  choice: குறிசொல்லும் ஆவிமத்தியஸ்தர்கள்
  rationale: אוֹב என்பது இறந்தோரின் ஆவிகளைக் கலந்தாலோசிப்பதுடன் தொடர்புடைய ஆவியையோ அதற்கான மத்தியஸ்தரையோ குறிக்கக்கூடும். சூழலில் மனித நடைமுறையாளர்களைக் குறிக்கும் பன்மையாக இருப்பதால் இவ்வாறு மொழிபெயர்க்கப்பட்டது; அடிப்படைச் சொல்லின் தெளிவின்மை அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: הַיִּדְּעֹנִים
  choice: ஆவிகளுடன் தொடர்புகொள்வோர்
  rationale: יִדְּעֹנִי தடைசெய்யப்பட்ட ஆவி சார்ந்த அறிவு அல்லது விசாரணையில் ஈடுபடுவோரைக் குறிக்கிறது. நவீன வாசகருக்குத் தவறான கற்பனைப் பொருள் தரக்கூடிய ‘மந்திரவாதிகள்’ என்பதைத் தவிர்த்து, இயல்பான விளக்கச் சொற்றொடர் பயன்படுத்தப்பட்டது.
- source_word: תְּבַקְשׁוּ
  choice: நாடி
  rationale: בקש என்பதன் ‘தேடுதல்/நாடுதல்’ என்ற பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது; ‘ஆலோசனை கேட்பது’ என்று அளவுக்கு மீறிக் குறிப்பாக்கவில்லை.
- source_word: לְטָמְאָה בָהֶם
  choice: அவர்களால் தீட்டுப்படாதீர்கள்
  rationale: טמא என்பதிலுள்ள தீட்டு/அசுத்தமாதல் என்ற விளைவைப் பாதுகாக்கிறது. அது சடங்கு சார்ந்ததா ஒழுக்கம் சார்ந்ததா என்பதை மொழிபெயர்ப்பு குறுக்கவில்லை.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநான்கெழுத்தான יהוה என்பதை ஒரு பட்டப்பெயரால் மாற்றாமல், தேவனுடைய தனிப்பெயராகத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אֱלֹהֵיכֶם
  choice: உங்கள் கடவுள்
  rationale: இரண்டாம் நபர் பன்மையிலுள்ள உடன்படிக்கை உறவை நேரடியாகக் காக்கிறது.
theological_decisions:
- issue: தீட்டின் தன்மை
  choice: ‘தீட்டுப்படாதீர்கள்’ என்று மட்டும் கூறி, சடங்கு மற்றும் ஒழுக்கத் தீட்டு ஆகிய இரண்டிற்குமான வாய்ப்பையும் திறந்துவைத்தல்
  alternative: ‘சடங்குப்படி தீட்டுப்படாதீர்கள்’ அல்லது ‘ஒழுக்கத்தில் கறைபடாதீர்கள்’ என்று குறிப்பாக்குதல்
  rationale: லேவியராகமத்தில் טמא என்ற சொல் சடங்கு மற்றும் ஒழுக்கப் பரிமாணங்களைக் கொண்டிருக்கக்கூடும். வசனம் அவற்றில் ஒன்றை மட்டும் இங்கு வெளிப்படையாக வரையறுக்காததால் அந்த இறையியல் பரப்பை மொழிபெயர்ப்பு காக்கிறது.
- issue: אוֹב மற்றும் יִדְּעֹנִי குறிக்கும் பொருள்
  choice: முதன்மை உரையில் தடைசெய்யப்பட்ட ஆவி சார்ந்த நடைமுறையாளர்களாக மொழிபெயர்த்து, சொற்கள் ஆவிகளையோ இறந்தோருடன் தொடர்புகொள்பவர்களையோ குறிக்கக்கூடிய தெளிவின்மையை அடிக்குறிப்பில் குறிப்பிடுதல்
  alternative: இரண்டையும் வெறும் ‘ஆவிகள்’ என்றோ இரண்டையும் ‘மந்திரவாதிகள்’ என்றோ ஒரே பொருளாகச் சுருக்குதல்
  rationale: எபிரெயச் சொற்களின் சரியான குறிப்பு விவாதத்திற்குரியது; ஆனால் இந்தச் சட்டச் சூழல் தடைசெய்யப்பட்ட ஆவி/இறந்தோர் ஆலோசனையைத் தெளிவாகச் சுட்டுகிறது. இரு சொற்களின் வேறுபாட்டை முற்றிலும் அழிக்காமல் வாசிக்கத்தக்க தமிழ் வழங்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான சட்டநடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆவிமத்தியஸ்தர்’ என்பது தொழில்நுட்பத் துல்லியத்திற்காகக் கூட்டுச்சொல்லாக அமைக்கப்பட்டது; அதற்கான மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன. ‘நானே’ என்பது אֲנִי என்ற வலியுறுத்தலை இயல்பாக வெளிப்படுத்துகிறது.
