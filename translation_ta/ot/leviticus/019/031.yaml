revisions:
- from: குறிசொல்லும் ஆவிமத்தியஸ்தர்களிடமோ ஆவிகளுடன் தொடர்புகொள்வோரிடமோ திரும்பாதீர்கள்; அவர்களை நாடி, அவர்களால் தீட்டுப்படாதீர்கள்.[a] நானே உங்கள் கடவுளாகிய யாவே.
  to: ஆவி ஊடகர்களிடமோ ஆவிகளுடன் தொடர்புகொள்வோரிடமோ திரும்பாதீர்கள்; அவர்களை நாடாதீர்கள்; அவர்களால் தீட்டுப்படாதீர்கள்.[a] நானே உங்கள் கடவுளாகிய யாவே.
  rationale: The revision keeps the source's two distinct terms and its unspecific concept of defilement, but replaces a compressed technical expression with clearer modern Tamil and makes the paired prohibitions syntactically direct. The footnote continues to flag lexical alternatives and uncertainty without imposing a narrow interpretation.
