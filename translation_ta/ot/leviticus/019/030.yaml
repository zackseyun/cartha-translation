source:
  edition: WLC
  text: אֶת שַׁבְּתֹתַ֣/י תִּשְׁמֹ֔רוּ וּ/מִקְדָּשִׁ֖/י תִּירָ֑אוּ אֲנִ֖י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/030.yaml
  text: You shall keep my Sabbaths and revere my sanctuary[a]; I am Yahweh.
translation:
  language: ta
  text: என் ஓய்வுநாட்களைக் கடைப்பிடியுங்கள்; என் பரிசுத்த இடத்தைப் பயபக்தியுடன் மதியுங்கள்.[a] நான் யாவே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “என் பரிசுத்த இடத்திற்குப் பயப்படுங்கள்.” எபிரெய வினைச்சொல் ‘பயப்படுதல்’ அல்லது ‘பயபக்தியுடன் மதித்தல்’ என்று பொருள்படலாம்; இங்கே யாவேயின் புனித இடத்திற்கு உரிய ஆழ்ந்த மதிப்பைக் காட்டுவதைக் குறிக்கிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁבְּתֹתַי
  choice: என் ஓய்வுநாட்கள்
  rationale: எபிரெயச் சொல் பன்மையில் இருப்பதைப் பேணுகிறது; யெகோவா நியமித்த ஓய்வுநாள் அனுசரிப்புகளைக் குறிக்கிறது.
- source_word: תִּשְׁמֹרוּ
  choice: கடைப்பிடியுங்கள்
  rationale: שׁמר என்பதன் ‘காத்தல், அனுசரித்தல், கடைப்பிடித்தல்’ என்ற சட்ட/உடன்படிக்கைச் சூழலுக்குப் பொருத்தமான, இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: מִקְדָּשִׁי
  choice: என் பரிசுத்த இடம்
  rationale: מִקְדָּשׁ என்பது கடவுளுக்கெனப் பிரித்துவைக்கப்பட்ட புனித இடத்தைக் குறிக்கிறது; கூடாரம் அல்லது ஆலயம் என்று தேவையின்றி குறிப்பாக்காமல் பொருளைப் பேணுகிறது.
- source_word: תִּירָאוּ
  choice: பயபக்தியுடன் மதியுங்கள்
  rationale: ירא என்பதில் உள்ள பயம் மற்றும் மரியாதை ஆகிய இரு நுணுக்கங்களையும் வழிபாட்டுச் சூழலில் இயல்பான தமிழில் இணைத்துத் தருகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: மூலத்தில் நேரடியாக வரும் நான்கெழுத்துத் தெய்வீகப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் பரவலாக அறியப்படும் பெயர்வடிவில் வழங்குகிறது.
- source_word: אֲנִי יְהוָה
  choice: நானே யெகோவா
  rationale: אֲנִיயின் வலியுறுத்தலையும் திரும்பத் திரும்ப வரும் உடன்படிக்கை சார்ந்த தெய்வீக சுயஅடையாளத்தையும் சுருக்கமாகப் பேணுகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூல உரை தெய்வீகப் பெயரையே பயன்படுத்துகிறது. பட்டப்பெயரான ‘கர்த்தர்’ என்பதற்குப் பதிலாகத் தனிப்பெயரைப் பேணுகிறது; ‘யெகோவா’ தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பு.
- issue: பரிசுத்த இடத்தை நோக்கிய ירא வினையின் வலிமை
  choice: பயபக்தியுடன் மதியுங்கள்
  alternative: என் பரிசுத்த இடத்திற்குப் பயப்படுங்கள்
  rationale: வினையின் ‘பயம்’ மற்றும் ‘பக்தியார்ந்த மரியாதை’ ஆகிய சாத்தியங்களை முற்றிலும் பிரித்துவிடாமல், புனித இடத்திற்குரிய ஆழ்ந்த மதிப்பைக் கூறுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சட்டக் கட்டளையின் நேர்மையையும் புனிதமான கண்ணியத்தையும் பேணும் தெளிவான நடை. பன்மை வடிவமும் தெய்வீகத் தனிப்பெயரும் வெளிப்படையாக வைக்கப்பட்டுள்ளன.
