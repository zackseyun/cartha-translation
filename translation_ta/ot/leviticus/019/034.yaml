  text: כְּ/אֶזְרָ֣ח מִ/כֶּם֩ יִהְיֶ֨ה לָ/כֶ֜ם הַ/גֵּ֣ר הַ/גָּ֣ר אִתְּ/כֶ֗ם וְ/אָהַבְתָּ֥ ל/וֹ֙ כָּמ֔וֹ/ךָ כִּֽי גֵרִ֥ים הֱיִיתֶ֖ם בְּ/אֶ֣רֶץ מִצְרָ֑יִם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/034.yaml
  text: The sojourner who sojourns with you shall be to you like a native among you[a], and you shall love him as yourself, for you were sojourners in the land of Egypt. I am Yahweh your God.
translation:
  language: ta
  text: உங்களோடு தங்கிவாழும் அந்நியரை, உங்களிடையே பிறந்தவரைப்போல் நீங்கள் கருத வேண்டும்[a]. உங்களைப்போலவே அவரையும் நேசியுங்கள்; ஏனெனில் எகிப்து நாட்டில் நீங்களும் அந்நியர்களாக இருந்தீர்கள். நான் உங்கள் கடவுளான யாவே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அந்நியர்’ என்பதற்கு ‘குடியேறிய பிறநாட்டவர்,’ ‘வேற்றுநாட்டவர்’ அல்லது ‘பரதேசி’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல், இஸ்ரவேலரிடையே வாழும் பூர்வகுடியல்லாத ஒருவரைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּאֶזְרָח
  choice: உங்களிடையே பிறந்த ஒருவரைப்போல்
  rationale: אֶזְרָח என்பது அந்த நாட்டில் பிறந்த பூர்வகுடி உறுப்பினரைக் குறிக்கிறது; כְּ குறிக்கும் ஒப்பீட்டையும் இந்தத் தெரிவு காக்கிறது.
- source_word: הַגֵּר הַגָּר אִתְּכֶם
  choice: உங்களிடையே குடியிருக்கும் அந்நியர்
  rationale: גֵּר என்பது வெறுமனே வழிப்போக்கரை அல்ல, இஸ்ரவேலரிடையே தங்கி வாழும் பிறநாட்டவரைக் குறிக்கிறது. பெயர்ச்சொல்–வினைச்சொல் எதிரொலியைத் தமிழில் இயல்பாக முழுமையாக மீட்டுரைக்க முடியாததால் ‘குடியிருக்கும் அந்நியர்’ என்று வழங்கப்படுகிறது.
- source_word: יִהְיֶה לָכֶם
  choice: உங்களுக்கு இருக்க வேண்டும்
  rationale: அவரை இஸ்ரவேலர் எவ்வாறு கருதி நடத்த வேண்டும் என்ற கட்டளைத் தன்மையைப் பாதுகாக்கிறது.
- source_word: וְאָהַבְתָּ לוֹ כָּמוֹךָ
  choice: உங்களைப்போலவே அவரையும் நேசியுங்கள்
  rationale: ஒற்றை ஆண்பால் முகவரியுள்ள எபிரெயக் கட்டளை, தமிழ் வாசகர்களை நோக்கிய மரியாதை/பன்மை கட்டளையாக இயல்பாக வழங்கப்படுகிறது; லேவியராகமம் 19:18 உடனான சொற்றொடர்பும் காக்கப்படுகிறது.
- source_word: כִּי גֵרִים הֱיִיתֶם
  choice: ஏனெனில் ... நீங்களும் அந்நியர்களாக இருந்தீர்கள்
  rationale: முன்னர் வந்த גֵּר என்ற சொல்லை ‘அந்நியர்’ என மீண்டும் வழங்கி, கட்டளைக்கும் இஸ்ரவேலரின் எகிப்திய அனுபவத்திற்கும் உள்ள சொல் சார்ந்த தொடர்பைக் காக்கிறது.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: எகிப்து நாட்டில்
  rationale: ‘எகிப்து நாடு’ என்ற முழு புவியியல் சொற்றொடரை இயல்பான தமிழில் வைத்திருக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநாமமான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֱלֹהֵיכֶם
  choice: உங்கள் கடவுள்
  rationale: உடன்படிக்கைச் சூத்திரத்தின் நேரடியான, இயல்பான தமிழ் வடிவம்.
theological_decisions:
- issue: சட்ட-அறநெறிச் சூழலில் גֵּר என்பதன் பொருள்
  choice: அந்நியர்
  alternative: குடியேறிய பிறநாட்டவர்; பரதேசி; வேற்றுநாட்டவர்
  rationale: இச்சொல் இஸ்ரவேலரிடையே தொடர்ந்து வசிக்கும், பூர்வகுடியல்லாத ஒருவரைக் குறிக்கிறது. ‘அந்நியர்’ இயல்பாகவும் சுருக்கமாகவும் உள்ளது; ‘குடியிருக்கும்’ என்ற தொடரால் நிரந்தர வசிப்பு சார்ந்த நுணுக்கம் தெளிவாக்கப்படுகிறது. நவீன குடிவரவு சட்டப் பிரிவுகளை வசனத்திற்குள் திணிக்காமல் மாற்றுச் சொற்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: யெகோவா; கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது. ஆகவே அதை ‘கர்த்தர்’ என்ற பட்டமாக மாற்றாமல் ஒலிபெயர்த்து, மூலத்தின் பெயர்–பட்டம் வேறுபாட்டைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன செந்தமிழுக்கு அண்மையான, dignified ஆனால் பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மூலத்தின் கட்டளைத் தன்மை, ‘அந்நியர்’ என்ற சொல்லின் மீளுரைத்தல், ‘உங்களைப்போலவே’ என்ற லேவியராகமம் 19:18 தொடர்பு, மற்றும் இறைப் பெயர் ஆகியவை பாதுகாக்கப்பட்டுள்ளன.
