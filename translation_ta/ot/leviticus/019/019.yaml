translation_notes:
  register: நவீன நிலையான தமிழில், சட்டக் கட்டளைக்குரிய கண்ணியமான நேரடி நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தில் தொடக்கக் கட்டளை பன்மையிலும் அதைத் தொடர்ந்து வரும் தடைகள் ஒருமையிலும் இருப்பதால், அந்த எண்ணிக்கை மாற்றம் ‘கடைப்பிடியுங்கள் / உன்’ எனப் பாதுகாக்கப்பட்டுள்ளது. ‘ஷாட்னேஸ்’ என்ற அரிய சொல்லின் தெளிவின்மை பிரதான உரையில் தீர்மானிக்கப்படாமல் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
