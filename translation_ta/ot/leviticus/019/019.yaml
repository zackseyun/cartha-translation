base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/019.yaml
  text: You shall keep my statutes. You shall not breed your livestock with two different kinds; you shall not sow your field with two kinds of seed; and a garment of mixed material[a], shaatnez, shall not come upon you.
translation:
  language: ta
  text: என் நியமங்களைக் கடைப்பிடியுங்கள். உன் கால்நடைகளை வேறுவகையோடு இனச்சேர்க்கை செய்யவிடாதே; உன் வயலில் வெவ்வேறு வகை விதைகளைக் கலந்து விதைக்காதே; கலப்புத் துணியாலான, ‘ஷாட்னேஸ்’[a] எனப்படும் ஆடையை நீ அணியக் கூடாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஷாட்னேஸ்’ என்பது தடைசெய்யப்பட்ட கலப்புத் துணியைக் குறிக்கும் எபிரெயத் தொழில்நுட்பச் சொல். இது பாரம்பரியமாக ஆட்டு மயிரும் ஆளி நாரும் கலந்த துணி என்று புரிந்துகொள்ளப்படுகிறது; உபாகமம் 22:11-ஐ ஒப்பிடுக.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֻקֹּתַי
  choice: என் நியமங்கள்
  rationale: சட்டரீதியாக நிர்ணயிக்கப்பட்ட கட்டளைகள் என்ற பொருளைத் தரும் இயல்பான, மரியாதையான நவீனத் தமிழ் சொல்.
- source_word: תִּשְׁמֹרוּ
  choice: கடைப்பிடியுங்கள்
  rationale: உடன்படிக்கை மற்றும் சட்டச் சூழலில் ‘கவனித்துக் காத்தல்/அனுசரித்தல்’ என்ற செயற்பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּהֶמְתְּךָ
  choice: உன் கால்நடைகள்
  rationale: மாடுகளை மட்டும் அல்லாமல் வளர்ப்பு விலங்குகளைப் பொதுவாகக் குறிக்கும் வேளாண்மைச் சூழலுக்கேற்ற சொல்.
- source_word: תַרְבִּיעַ כִּלְאַיִם
  choice: வேறு இனத்தோடு இனச்சேர்க்கை செய்யவிடாதே
  rationale: வேறுபட்ட வகைகளைச் சேர்ந்த விலங்குகளைப் புணரச் செய்வதைத் தடைசெய்யும் எபிரெய வினையின் காரணவினைப் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: שָׂדְךָ לֹא תִזְרַע כִּלְאָיִם
  choice: உன் வயலில் வெவ்வேறு வகை விதைகளைக் கலந்து விதைக்காதே
  rationale: வயலில் வேறுபட்ட வகைகளை ஒன்றாக விதைப்பதை இயல்பான தமிழில் தெரிவிக்கிறது; சூழலால் மறைந்துள்ள ‘விதைகள்’ என்பதை வெளிப்படுத்துகிறது.
- source_word: בֶגֶד כִּלְאַיִם
  choice: கலப்புப் பொருளால் செய்யப்பட்ட ஆடை
  rationale: ஆடையின் பொருட்கலவையைக் குறிக்கிறது; எந்த நூல்கள் கலந்தவை என்று மூலவசனம் நேரடியாகச் சொல்லாததால் பிரதான உரையில் அவற்றைக் குறிப்பாக நிர்ணயிக்கவில்லை.
- source_word: שַׁעַטְנֵז
  choice: ஷாட்னேஸ்
  rationale: அரிதான தொழில்நுட்பச் சொல்லின் தனித்தன்மையை ஒலிபெயர்ப்பால் காக்கிறது; அதன் பாரம்பரிய விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: יַעֲלֶה עָלֶיךָ
  choice: உன் உடல்மேல் அணியப்படக் கூடாது
  rationale: சொல்லுக்குச் சொல் ‘உன்மேல் ஏறக்கூடாது’ என்ற எபிரெய மரபுத்தொடரின் ஆடை அணிதல் சார்ந்த பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
