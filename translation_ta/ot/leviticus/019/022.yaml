base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/022.yaml
  text: And the priest shall make atonement for him before Yahweh with the ram of the guilt offering for the sin that he committed[a], and he shall be forgiven for the sin that he committed.
translation:
  language: ta
  text: அவன் செய்த பாவத்திற்காக, குற்றநிவாரணப் பலிக்குரிய செம்மறியாட்டுக் கடாவைக் கொண்டு[a], யாவே முன்னிலையில் ஆசாரியன் அவனுக்காகப் பாவநிவிர்த்தி செய்வார்; அவன் செய்த பாவம் அவனுக்கு மன்னிக்கப்படும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘குற்றப்பலிக்குரிய செம்மறியாட்டுக் கடா’ அல்லது ‘ஈடுசெய்யும் பலிக்குரிய செம்மறியாட்டுக் கடா’ என்றும் மொழிபெயர்க்கலாம். எபிரெய மொழியிலுள்ள אָשָׁם என்ற சொல் குற்றத்தையும், இந்தப் பலியின் ஈடுசெய்யும் அல்லது சீர்செய்யும் அம்சத்தையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִפֶּר
  choice: பாவநிவிர்த்தி செய்வார்
  rationale: ஆசாரியச் சடங்கின் சூழலில் כפר என்பது ஒருவருக்காகப் பாவநிவிர்த்தி செய்யும் செயலைக் குறிக்கிறது. தமிழில் நிலைபெற்ற பலியியல் சொல்லாட்சியையும் மூலத்தின் சடங்குசார் பொருளையும் இது காக்கிறது.
- source_word: עָלָיו
  choice: அவனுக்காக
  rationale: כפר என்பதுடன் வரும் על, பாவநிவிர்த்தியின் பயனைப் பெறும் நபரைக் குறிக்கிறது; ‘அவனுக்காக’ என்பது இயல்பான தமிழ்.
- source_word: הַכֹּהֵן
  choice: ஆசாரியன்
  rationale: பலியை நிறைவேற்றும் அதிகாரப்பூர்வ சமயப் பணியாளரைக் குறிக்கும் வழக்கமான தமிழ் வேதாகமச் சொல்; எபிரெய definite article-இன் குறிப்பிட்ட தன்மையும் சூழலால் வெளிப்படுகிறது.
- source_word: בְּאֵיל הָאָשָׁם
  choice: குற்றநிவாரணப் பலிக்குரிய செம்மறியாட்டுக் கடாவைக் கொண்டு
  rationale: אַיִל என்பது ஆண் செம்மறியாட்டைக் குறிக்கிறது; אָשָׁם குற்றத்தையும் அதற்கான ஈடு அல்லது நிவாரண அம்சத்தையும் உடைய பலியைக் குறிக்கிறது. ‘கொண்டு’ என்பது கருவிப்பொருளைக் குறிக்கும் בְּ-ஐ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לִפְנֵי יְהוָה
  choice: யாவே முன்னிலையில்
  rationale: לִפְנֵי என்பது சடங்கு நடைபெறும் தெய்வீக முன்னிலையைக் குறிக்கிறது; יהוה என்ற உடன்படிக்கைப் பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்படுகிறது.
- source_word: עַל חַטָּאתוֹ אֲשֶׁר חָטָא
  choice: அவன் செய்த பாவத்திற்காக
  rationale: எபிரெய மொழியின் ‘அவன் பாவஞ்செய்த பாவம்’ என்ற ஒரே வேர்ச்சொல் மீளுரையை, பொருளை இழக்காமல் இயல்பான தமிழில் வழங்குகிறது.
- source_word: וְנִסְלַח לוֹ
  choice: அவனுக்கு மன்னிக்கப்படும்
  rationale: סלח என்பதன் நிபால் வடிவம் செயப்படுபொருள் நிலையிலான மன்னிப்பைக் குறிக்கிறது. மன்னிப்பவராகிய தேவனை மூலத்தைப் போலவே வெளிப்படையாகச் சேர்க்கவில்லை.
- source_word: מֵחַטָּאתוֹ אֲשֶׁר חָטָא
  choice: அவன் செய்த பாவம்
  rationale: מן முன்னிடைச்சொல் மன்னிப்பு வாய்ப்பாட்டில் பாவத்திலிருந்து விடுவிக்கப்படுவதை உணர்த்துகிறது; தமிழில் ‘பாவம் அவனுக்கு மன்னிக்கப்படும்’ என்பது அந்தப் பொருளை இயல்பாகத் தருகிறது.
theological_decisions:
- issue: יהוה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் நான்கெழுத்துத் தெய்வீகப் பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டப்பெயராக மாற்றாமல் உடன்படிக்கைப் பெயராக ஒலிபெயர்ப்பது மூலத்தை வெளிப்படையாகப் பிரதிபலிக்கிறது.
- issue: וְנִסְלַח לוֹ என்பதில் மன்னிப்பவர் யார் என்பது
  choice: மன்னிப்பவரை வெளிப்படையாகச் சேர்க்காமல் ‘அவனுக்கு மன்னிக்கப்படும்’ என்று வழங்குதல்
  alternative: யாவே அவனை மன்னிப்பார்
  rationale: இறைவனே மன்னிப்பவர் என்பது சூழலில் உட்பொருளாக இருந்தாலும், எபிரெய உரை செய்பவரைப் பெயரிடவில்லை. அந்த இலக்கணத் திறப்பையும் இறையியல் நுட்பத்தையும் தமிழ் காக்கிறது.
- issue: אָשָׁם பலியின் தன்மை
  choice: குற்றநிவாரணப் பலி
  alternative: குற்றப்பலி / ஈடுசெய்யும் பலி
  rationale: இந்தச் சொல் குற்றநிலையையும் அதற்குரிய ஈடு அல்லது சீர்செய்தல் அம்சத்தையும் ஒருங்கே கொண்டுள்ளது. ‘குற்றநிவாரணப் பலி’ இரு அம்சங்களையும் முடிந்தவரை சுருக்கமாகக் காக்கிறது; மாற்று சொல்லாட்சி அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான பலியியல் நடை பயன்படுத்தப்பட்டுள்ளது. ‘செம்மறியாட்டுக் கடா’ விலங்கின் பாலினத்தைத் துல்லியமாகக் காட்டுகிறது; ‘ஆசாரியன்’, ‘பாவநிவிர்த்தி’ ஆகிய நிலைபெற்ற சொற்கள் தேவையற்ற பழமையாக்கமின்றி தக்கவைக்கப்பட்டுள்ளன.
