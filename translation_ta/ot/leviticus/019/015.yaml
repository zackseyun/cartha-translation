  text: לֹא תַעֲשׂ֥וּ עָ֨וֶל֙ בַּ/מִּשְׁפָּ֔ט לֹא תִשָּׂ֣א פְנֵי דָ֔ל וְ/לֹ֥א תֶהְדַּ֖ר פְּנֵ֣י גָד֑וֹל בְּ/צֶ֖דֶק תִּשְׁפֹּ֥ט עֲמִיתֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/015.yaml
  text: You shall not commit injustice in judgment. You shall not show partiality to the poor, nor honor the face of the great; with righteousness you shall judge your neighbor.
translation:
  language: ta
  text: நீங்கள் தீர்ப்பு வழங்கும்போது அநீதி செய்யாதீர்கள். ஏழையிடம் பாரபட்சம் காட்டாதீர்கள்; உயர்ந்த நிலையில் இருப்பவருக்கும் தனிச்சலுகை காட்டாதீர்கள்.[a] நீதியோடு[b] உங்கள் சக மனிதரை நியாயந்தீருங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஏழையின் முகத்தை உயர்த்தாதே; பெரியவரின் முகத்தை மதிக்காதே” என்பது எபிரெய மொழியின் சொற்படியான அமைப்பு. நீதித் தீர்ப்பில் ஏழைக்குச் சாதகமாகப் பாரபட்சம் காட்டுவதையோ, உயர்ந்த நிலையில் இருப்பவருக்கு மரியாதையின் பெயரில் தனிச்சலுகை அளிப்பதையோ இது குறிக்கிறது.
    reason: cultural_note
  - marker: b
    text: அல்லது, “நேர்மையோடு.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עָוֶל בַּמִּשְׁפָּט
  choice: தீர்ப்பு வழங்கும்போது அநீதி
  rationale: சட்டரீதியான தீர்ப்பு வழங்கும் சூழலில் நீதி பிறழ்வதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: תִשָּׂא פְנֵי דָל
  choice: ஏழையிடம் பாரபட்சம் காட்டாதீர்கள்
  rationale: ‘ஏழையின் முகத்தை உயர்த்துதல்’ என்ற எபிரெய மரபுத்தொடரின் நீதிமன்றச் சூழலிலான பொருள் பாரபட்சம் காட்டுவதாகும்.
- source_word: תֶהְדַּר פְּנֵי גָדוֹל
  choice: உயர்ந்த நிலையில் இருப்பவருக்கும் தனிச்சலுகை காட்டாதீர்கள்
  rationale: சமுதாய அந்தஸ்து அல்லது செல்வாக்குள்ளவருக்கு மதிப்பின் பெயரில் சாதகமாக நடந்துகொள்வதைத் தடைசெய்யும் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: בְּצֶדֶק
  choice: நீதியோடு
  rationale: צֶדֶק என்பதன் ஒழுக்க மற்றும் சட்ட பரிமாணங்களைத் தமிழில் சுருக்கமாகத் தாங்குகிறது; ‘நேர்மையோடு’ என்பதும் சாத்தியம்.
- source_word: תִּשְׁפֹּט עֲמִיתֶךָ
  choice: உங்கள் சக மனிதருக்குத் தீர்ப்பு வழங்குங்கள்
  rationale: עָמִית என்பது ஒருவருடைய சமூகத்தைச் சேர்ந்த சக நபரைக் குறிக்கிறது; வெறும் அருகில் வசிப்பவர் என்ற தவறான குறுக்கலைத் தவிர்க்கிறது.
theological_decisions:
- issue: சட்ட-ஒழுக்கச் சூழலில் צֶדֶק என்பதன் மொழிபெயர்ப்பு
  choice: நீதியோடு
  alternative: நேர்மையோடு
  rationale: மூலச்சொல் நீதியையும் ஒழுக்க நேர்மையையும் உள்ளடக்குகிறது. முதன்மை உரை நீதிமன்றச் சூழலை முன்னிறுத்துகிறது; அடிக்குறிப்பு அதன் ஒழுக்க நுணுக்கத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சட்ட அறிவுறுத்தலுக்கேற்ற கண்ணியமான நேரடி நடை பயன்படுத்தப்பட்டுள்ளது. ‘முகத்தை உயர்த்துதல்/மதித்தல்’ என்ற மூலமொழிப் படிமம் முதன்மை உரையில் இயல்பான தமிழாக மொழிபெயர்க்கப்பட்டு, அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
