base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/021.yaml
  text: 'And he shall bring his guilt offering to Yahweh[a], to the entrance of the tent of meeting: a ram as a guilt offering.'
translation:
  language: ta
  text: அவன் தனது குற்றநிவாரணப் பலியாக ஒரு செம்மறியாட்டுக் கடாவை யாவேக்கு, சந்திப்புக் கூடாரத்தின் நுழைவாயிலுக்குக் கொண்டுவர வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல்லை ‘குற்றப்பலி’ அல்லது ‘ஈடுசெய்யும் பலி’ என்றும் மொழிபெயர்க்கலாம். אָשָׁם என்ற சொல் குற்றத்தையும், அதற்குப் பரிகாரமாக அல்லது ஈடாகச் செலுத்தப்படும் பலியையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבִיא
  choice: கொண்டுவர வேண்டும்
  rationale: சட்டவிதி சூழலில் இந்த வினைவடிவம் கடமையைக் குறிக்கிறது; நவீன தமிழில் ‘வேண்டும்’ என்பது அந்தக் கட்டாயப் பொருளை இயல்பாகத் தெரிவிக்கிறது.
- source_word: אֲשָׁמוֹ
  choice: தனது குற்றநிவாரணப் பலியாக
  rationale: אָשָׁם என்பது குற்றத்தையும் அதற்கான நிவாரணப் பலியையும் குறிக்கலாம்; இங்கு பலியிடப்படும் விலங்கு குறிப்பிடப்படுவதால் பலியே நோக்கமாக உள்ளது.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: לְ முன்னொட்டு செலுத்தப்படும் நபரையோ அர்ப்பணிப்பின் இலக்கையோ குறிக்கிறது; יהוה என்ற இறைப்பெயர் ஒலிபெயர்க்கப்படுகிறது.
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரத்தின் நுழைவாயிலுக்கு
  rationale: פֶּתַח என்பது நுழைவாயில்; אֹהֶל מוֹעֵד என்பது தேவன் தமது மக்களைச் சந்திக்கும் திருத்தலக் கூடாரத்தின் நிலையான பெயர்.
- source_word: אֵיל אָשָׁם
  choice: குற்றநிவாரணப் பலியாக ஒரு செம்மறியாட்டுக் கடாவை
  rationale: אֵיל என்பது ஆண் செம்மறியாடு; אָשָׁם அதன் பலிவகையை விளக்குகிறது. தமிழில் பலிவகையை முன்வைப்பது இயல்பான ஒருங்கிணைந்த வாக்கியத்தை உருவாக்குகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் உடன்படிக்கையின் தனிப்பெயர் நேரடியாக உள்ளது; பட்டப்பெயராக மாற்றாமல் ‘யாவே’ என ஒலிபெயர்ப்பது அதைப் பாதுகாக்கிறது.
- issue: אָשָׁם என்பதிலுள்ள குற்றம்–நிவாரணம் சார்ந்த பொருள்
  choice: குற்றநிவாரணப் பலி
  alternative: குற்றப்பலி; ஈடுசெய்யும் பலி
  rationale: இச்சொல் குற்றத்தையும் அதற்காகச் செலுத்தப்படும் நிவாரணத்தையும் இணைக்கிறது. ‘குற்றநிவாரணப் பலி’ இரு கூறுகளையும் இயன்றவரை வெளிப்படுத்துகிறது; மாற்றுப் பெயர்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டவிதிக்குரிய கட்டாயத்தை ‘வேண்டும்’ மூலம் வெளிப்படுத்தி, வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘செம்மறியாட்டுக் கடா’ என்பது אֵיל குறிக்கும் ஆண் செம்மறியாட்டைத் தெளிவாக்குகிறது.
