source:
  edition: WLC
  text: אַל תִּפְנוּ֙ אֶל הָ֣/אֱלִילִ֔ים וֵֽ/אלֹהֵי֙ מַסֵּכָ֔ה לֹ֥א תַעֲשׂ֖וּ לָ/כֶ֑ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/004.yaml
  text: Do not turn to idols[a], and do not make cast-metal gods for yourselves[b]. I am Yahweh your God.
translation:
  language: ta
  text: விக்கிரகங்களின் பக்கம் திரும்பாதீர்கள்[a]. வார்க்கப்பட்ட உலோகத் தெய்வங்களை உங்களுக்காகச் செய்யாதீர்கள்[b]. நான் யாவே, உங்கள் கடவுள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பயனற்ற விக்கிரகங்கள்’ என்றும் மொழிபெயர்க்கலாம்; இங்கு பயன்படுத்தப்பட்டுள்ள எபிரெயச் சொல் இழிவான நுண்பொருளைக் கொண்டிருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘உருக்கி வார்க்கப்பட்ட தெய்வங்கள்’ அல்லது ‘உலோக விக்கிரகங்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפְנוּ
  choice: திரும்பாதீர்கள்
  rationale: פנה என்பதன் அடிப்படைப் பொருளான ‘திரும்புதல்/நோக்கித் திரும்புதல்’ என்பதைக் காக்கிறது. வழிபாடு என்று மட்டும் குறுக்காமல், கவனம், சார்பு, பற்றுறுதி ஆகியவற்றையும் உள்ளடக்கக்கூடிய மூலமொழியின் பரப்பைத் திறந்தவாறே வைக்கிறது.
- source_word: אֱלִילִים
  choice: விக்கிரகங்கள்
  rationale: தமிழ் வாசகர்களுக்கு தெளிவாகப் புரியும் வழிபாட்டுச் சிலைகளைக் குறிக்கும் சொல். எபிரெயச் சொல்லில் இருக்கக்கூடிய ‘பயனற்றவை’ என்ற இழிவுணர்வு அடிக்குறிப்பில் தரப்படுகிறது; முதன்மை உரையில் தேவையற்ற விளக்கவுரை சேர்க்கப்படவில்லை.
- source_word: אֱלֹהֵי מַסֵּכָה
  choice: வார்க்கப்பட்ட தெய்வங்கள்
  rationale: மூலத்தில் உள்ள பன்மையான ‘தெய்வங்கள்’ என்பதையும், உருக்கிய பொருளை அச்சில் ஊற்றி உருவாக்கும் மַסֵּכָה என்பதன் உற்பத்திப் பொருளையும் காக்கிறது.
- source_word: תַעֲשׂוּ לָכֶם
  choice: உங்களுக்காகச் செய்யாதீர்கள்
  rationale: לָכֶם காட்டும் தங்களுடைய பயன்பாடு அல்லது உடைமைக்காகச் செய்தல் என்ற பயனிலைப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தலைப்பால் மாற்றாமல், எபிரெய வேதாகமத்தின் நான்கெழுத்துத் தெய்வீகப் பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אֱלֹהֵיכֶם
  choice: உங்கள் கடவுள்
  rationale: வடிவத்தில் பன்மைத் தோற்றம் இருந்தாலும், இங்குள்ள உடன்படிக்கைச் சூத்திரத்தில் இஸ்ரவேலின் ஒரே கடவுளைக் குறிக்கும் ஒருமைப் பொருளை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர் / யெகோவா
  rationale: மூல உரை ஒரு பட்டத்தை அல்ல, தனிப்பட்ட தெய்வீகப் பெயரையே பயன்படுத்துகிறது. ‘யாவே’ என்பது அதனைத் தமிழில் நேரடியாக ஒலிபெயர்த்து, பெயருக்கும் பட்டத்துக்கும் உள்ள வேறுபாட்டைக் காக்கிறது.
- issue: விக்கிரகங்களிடம் திரும்புதல் வழிபாட்டையே குறிக்கிறதா
  choice: விக்கிரகங்களிடம் திரும்பாதீர்கள்
  alternative: விக்கிரகங்களை வழிபடாதீர்கள்
  rationale: פנה என்பது இங்கு நேரடியாக ‘வழிபடு’ என்று சொல்லாமல் ‘அவற்றிடம் திரும்பு’ என்கிறது. ஆகவே அதன் விரிவான, ஓரளவு திறந்த பொருளைச் சுருக்காமல் வைத்திருக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் தெளிவான, கண்ணியமான கட்டளை நடையைப் பயன்படுத்துகிறது. பன்மைச் சமூகத்தைக் குறிக்கும் வினைமுற்றுகள் காக்கப்பட்டுள்ளன. ‘வார்க்கப்பட்ட’ என்பது உலோகத்தை உருக்கி அச்சில் ஊற்றி உருவாக்கியதைக் குறிக்கும் இயல்பான தொழிற்சொல்; ‘யாவே’ தெய்வீகப் பெயராக ஒலிபெயர்க்கப்பட்டுள்ளது.
