base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/009.yaml
  text: And every grain offering that is baked in the oven[a], and everything prepared in a pan or on a griddle, shall belong to the priest who presents it.
translation:
  language: ta
  text: அடுப்பில் சுடப்பட்ட ஒவ்வொரு தானியக் காணிக்கையும், ஆழமான சட்டியில் தயாரிக்கப்பட்ட ஒவ்வொன்றும், தட்டையான சட்டியில் தயாரிக்கப்பட்ட ஒவ்வொன்றும், அவற்றைச் செலுத்தும் ஆசாரியனுக்குரியதாகும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஆழமான சட்டி,” “தட்டையான சட்டி” என்பவற்றுக்கான எபிரெயச் சொற்கள் இருவேறு வகையான சமையல் பாத்திரங்களைக் குறித்திருக்கலாம்; அவற்றின் துல்லியமான வடிவம் உறுதியாகத் தெரியவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָה
  choice: தானியக் காணிக்கை
  rationale: லேவியராகமத்தின் பலிசார் சூழலில் இது பொதுவான காணிக்கையை அல்ல, தானியத்தால் செய்யப்படும் காணிக்கையைக் குறிக்கிறது.
- source_word: תֵּאָפֶה בַּתַּנּוּר
  choice: அடுப்பில் சுடப்பட்ட
  rationale: நிபால் வினையின் செயப்பாட்டு பொருளை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: נַעֲשָׂה
  choice: தயாரிக்கப்பட்ட
  rationale: ‘செய்யப்பட்ட’ என்ற பொதுப் பொருளை உணவு தயாரிக்கும் இச்சூழலுக்கு இயல்பாக வழங்குகிறது; குறிப்பிட்ட சமையல் முறையைத் தேவையின்றி நிர்ணயிப்பதில்லை.
- source_word: מַרְחֶשֶׁת
  choice: ஆழமான சட்டி
  rationale: இச்சமையல் பாத்திரம் அடுத்த சொல்லால் குறிக்கப்படும் தட்டையான பாத்திரத்திலிருந்து வேறுபட்ட, ஆழமுள்ள சட்டியாக இருந்திருக்கலாம்.
- source_word: מַחֲבַת
  choice: தட்டையான சட்டி
  rationale: מַרְחֶשֶׁת என்பதைக் காட்டிலும் தட்டையான சமையல் பாத்திரம் என்ற சாத்தியமான வேறுபாட்டைப் பேணுகிறது.
- source_word: הַמַּקְרִיב
  choice: செலுத்துகிற
  rationale: பலிசார் சூழலில் காணிக்கையை அண்மையில் கொண்டுவருதல் அல்லது அர்ப்பணித்தல் என்ற பொருளை இயல்பான வழிபாட்டு தமிழில் தருகிறது.
- source_word: לוֹ תִהְיֶה
  choice: அவனுக்கே உரியதாகும்
  rationale: ஆசாரியனுக்கு அது ஒதுக்கப்பட்டு சொந்தமாகும் என்ற சட்டப்பூர்வ உடைமைப் பொருளையும் தனிப்பட்ட விநியோக வலியுறுத்தலையும் தெளிவாக்குகிறது.
