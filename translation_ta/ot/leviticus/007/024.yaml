translation_notes:
  register: நவீனத் தரத் தமிழில், சட்டக் கட்டளைக்குரிய கண்ணியமான ஆனால் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் அனுமதிக்கும் கூறும் வலியுறுத்தப்பட்ட தடையும் தெளிவாக வேறுபடுத்தப்பட்டுள்ளன.
