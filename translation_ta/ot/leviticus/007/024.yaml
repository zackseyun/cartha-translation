  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/חֵ֤לֶב נְבֵלָה֙ וְ/חֵ֣לֶב טְרֵפָ֔ה יֵעָשֶׂ֖ה לְ/כָל מְלָאכָ֑ה וְ/אָכֹ֖ל לֹ֥א תֹאכְלֻֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/024.yaml
  text: But the fat of an animal that dies naturally[a], and the fat of one torn by beasts, may be used for any work[b]; but you must certainly not eat it.
translation:
  language: ta
  text: தானாக இறந்த விலங்கின் கொழுப்பையும்[a], காட்டு விலங்குகளால் கிழிக்கப்பட்ட விலங்கின் கொழுப்பையும் எந்தப் பயன்பாட்டிற்கும் பயன்படுத்தலாம்; ஆனால் அதை நீங்கள் ஒருபோதும் உண்ணக் கூடாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல், முறைப்படி அறுக்கப்படாமல் இறந்த விலங்கைக் குறிக்கிறது; ‘செத்துக் கிடந்த விலங்கு’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵלֶב
  choice: கொழுப்பு
  rationale: பலியிடுதல் மற்றும் உணவுச் சட்டச் சூழலில் விலங்கின் கொழுப்பைக் குறிக்கும் இயல்பான, பொதுவாகப் புரியும் தமிழ் சொல்.
- source_word: נְבֵלָה
  choice: தானாகச் செத்த விலங்கு
  rationale: முறைப்படி அறுக்கப்படாமல் இறந்த விலங்கைச் சட்டச் சூழலில் இச்சொல் குறிக்கிறது; ‘பிணம்’ என்பதைவிட இத்தேர்வு பொருளைத் தெளிவாகக் கூறுகிறது.
- source_word: טְרֵפָה
  choice: காட்டு விலங்குகளால் கிழிக்கப்பட்ட விலங்கு
  rationale: வேட்டையாடும் விலங்கால் தாக்கிக் கிழிக்கப்பட்ட விலங்கைச் சுட்டும் மூலச்சொல்லின் பொருளையும் செய்பவரையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: יֵעָשֶׂה
  choice: பயன்படுத்தலாம்
  rationale: ஒரு பொருளை உருவாக்குதல் என்பதை மட்டும் அல்லாமல், உண்பதைத் தவிர பிற நோக்கங்களுக்குப் பயன்படுத்த அனுமதிப்பதே இங்குள்ள நிபால் வடிவத்தின் சூழல்சார் பொருள்.
- source_word: לְכָל מְלָאכָה
  choice: எந்தப் பயன்பாட்டிற்கும்
  rationale: கொழுப்பின் உணவல்லாத பல்வேறு நடைமுறைப் பயன்பாடுகளை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: וְאָכֹל לֹא תֹאכְלֻהוּ
  choice: ஆனால் அதை நீங்கள் ஒருபோதும் உண்ணக் கூடாது
  rationale: வினையெச்ச முழுவடிவத்துடன் வரும் வினைச்சொல் தடையை வலியுறுத்துகிறது; ‘ஒருபோதும் ... கூடாது’ அந்த அழுத்தத்தைத் தெளிவாகக் கடத்துகிறது.
