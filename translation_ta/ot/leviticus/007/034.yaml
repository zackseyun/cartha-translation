revisions:
- from: ஏனெனில், இஸ்ரவேலின் மக்களிடமிருந்து[a] அவர்களுடைய சமாதானப் பலிகளின் மார்பாகிய அசைவாட்டும் காணிக்கையையும், தொடையாகிய எடுத்துப்படைக்கும் காணிக்கையையும்[b][c] நான் எடுத்துக்கொண்டேன்; அவற்றை இஸ்ரவேலின் மக்களிடமிருந்து ஆரோன் என்னும் ஆசாரியனுக்கும் அவனுடைய மகன்களுக்கும் நிரந்தர நியமமாகக் கொடுத்திருக்கிறேன்.
  to: ஏனெனில், இஸ்ரவேல் மக்களிடமிருந்து[a] அவர்களுடைய சமாதானப் பலிகளிலிருந்து[c] அசைவாட்டும் காணிக்கையின் மார்புப்பகுதியையும், உயர்த்திப் படைக்கும் காணிக்கையின் தொடைப்பகுதியையும்[b] நான் எடுத்துக்கொண்டு, அவற்றை ஆரோன் ஆசாரியனுக்கும் அவன் மகன்களுக்கும் இஸ்ரவேல் மக்களிடமிருந்து பெறும் நிரந்தர உரிமையாகக் கொடுத்தேன்.
  rationale: 'The revision retains every major Hebrew element: the breast associated with the wave offering, the thigh associated with the contribution/raised offering, their origin in Israel’s peace offerings, and their permanent assignment to Aaron and his sons. It clarifies that the repeated reference to Israel identifies the source of their permanent priestly entitlement, and it relocates each footnote anchor to its corresponding term.'
