  text: כִּי֩ אֶת חֲזֵ֨ה הַ/תְּנוּפָ֜ה וְ/אֵ֣ת שׁ֣וֹק הַ/תְּרוּמָ֗ה לָקַ֨חְתִּי֙ מֵ/אֵ֣ת בְּנֵֽי יִשְׂרָאֵ֔ל מִ/זִּבְחֵ֖י שַׁלְמֵי/הֶ֑ם וָ/אֶתֵּ֣ן אֹ֠תָ/ם לְ/אַהֲרֹ֨ן הַ/כֹּהֵ֤ן וּ/לְ/בָנָי/ו֙ לְ/חָק עוֹלָ֔ם מֵ/אֵ֖ת בְּנֵ֥י יִשְׂרָאֵֽל־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/034.yaml
  text: For I have taken the breast of the wave offering and the thigh of the contribution from the sons of Israel[a], from their sacrifices of peace offerings[c][b], and I have given them to Aaron the priest and to his sons as a permanent statute from the sons of Israel.
translation:
  language: ta
  text: ஏனெனில், இஸ்ரவேல் மக்களிடமிருந்து[a] அவர்களுடைய சமாதானப் பலிகளிலிருந்து[c] அசைவாட்டும் காணிக்கையின் மார்புப்பகுதியையும், உயர்த்திப் படைக்கும் காணிக்கையின் தொடைப்பகுதியையும்[b] நான் எடுத்துக்கொண்டு, அவற்றை ஆரோன் ஆசாரியனுக்கும் அவன் மகன்களுக்கும் இஸ்ரவேல் மக்களிடமிருந்து பெறும் நிரந்தர உரிமையாகக் கொடுத்தேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில் சொல்லுக்குச் சொல், ‘இஸ்ரவேலின் மகன்கள்’; இது இஸ்ரவேல் மக்களைக் குறிக்கும் வழக்கமான உடன்படிக்கைப் பெயர்.
    reason: lexical_alternative
  - marker: b
    text: ‘உயர்த்திப் படைக்கும் காணிக்கை’ என்பது ஒதுக்கி எடுத்து அல்லது உயர்த்தி அர்ப்பணிக்கப்பட்ட பங்கைக் குறிக்கிறது; ‘எடுத்துப்படைக்கும் காணிக்கை’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: ‘சமாதானப் பலிகள்’ என்பதை ‘ஐக்கியப் பலிகள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲזֵה הַתְּנוּפָה
  choice: மார்பாகிய அசைவாட்டும் காணிக்கை
  rationale: חֲזֵה என்பது பலியிடப்பட்ட விலங்கின் மார்புப் பகுதியையும், תְּנוּפָה சடங்காக அசைவாட்டிப் படைக்கப்பட்ட காணிக்கையையும் குறிக்கிறது; இரண்டின் தொடர்பும் தமிழில் வெளிப்படையாக வைக்கப்பட்டது.
- source_word: שׁוֹק הַתְּרוּמָה
  choice: தொடையாகிய எடுத்துப்படைக்கும் காணிக்கை
  rationale: שׁוֹק இங்கு ஒதுக்கப்பட்ட மேல் கால் அல்லது தொடைப் பகுதி. תְּרוּמָה என்பது பிரித்தெடுத்து உயர்த்தி அர்ப்பணிக்கப்பட்ட பங்கைக் குறிக்கிறது; ‘எடுத்துப்படைக்கும் காணிக்கை’ அந்தச் சடங்குக் கருத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: לָקַחְתִּי
  choice: நான் எடுத்துக்கொண்டேன்
  rationale: எபிரெய நிறைவுற்ற வினை, தேவன் இந்தப் பகுதிகளைத் தமக்குரியவையாக ஒதுக்கிய நிறுவப்பட்ட செயலைக் குறிக்கிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மக்கள்
  rationale: சொல்லுக்குச் சொல் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இது முழு உடன்படிக்கைச் சமூகத்தைக் குறிக்கும் நிலையான இனப்பெயர்; நவீன தமிழில் ‘மக்கள்’ இயல்பாகவும் உள்ளடக்கமாகவும் பொருளைத் தருகிறது.
- source_word: זִבְחֵי שַׁלְמֵיהֶם
  choice: அவர்களுடைய சமாதானப் பலிகள்
  rationale: זֶבַח என்ற பலிக் கருத்தையும் שְׁלָמִים என்ற குறிப்பிட்ட பலிவகையையும் சுருக்கமாகக் காக்கிறது; ‘சமாதானப் பலிகள்’ மூலச்சொல்லுடனான தொடர்பைத் தக்கவைக்கிறது.
- source_word: וָאֶתֵּן אֹתָם
  choice: அவற்றைக் கொடுத்திருக்கிறேன்
  rationale: இந்தத் தெய்வீக ஒதுக்கீடு நிறுவப்பட்டு தொடரும் விளைவைக் கொண்டிருப்பதைத் தமிழின் நிறைவுநிலை வடிவம் வெளிப்படுத்துகிறது.
- source_word: לְחָק עוֹלָם
  choice: நிரந்தர நியமமாக
  rationale: நீடித்து நிலைக்கும் சட்டபூர்வ ஒழுங்கைத் தெளிவான, தற்போதைய தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל என்ற உடன்படிக்கைச் சமூகப் பெயர்
  choice: இஸ்ரவேலின் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரெய வடிவம் இலக்கண ரீதியாக ‘மகன்கள்’ என்றாலும், பயன்பாட்டில் இஸ்ரவேல் சமூகமெங்கையும் குறிக்கிறது. ‘மக்கள்’ என்பது தமிழில் பொருளைத் தவறாக ஆண் உறுப்பினர்களுக்கு மட்டும் சுருக்காமல் இயல்பாகத் தருகிறது; நேரடி வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: שְׁלָמִים என்ற பலிவகையின் பெயர்
  choice: சமாதானப் பலிகள்
  alternative: உறவுணர்வுப் பலிகள்
  rationale: மூலத்தின் சொற்பிணைப்பையும் தனித்த பலிவகையையும் காக்கிறது; விருந்து அல்லது ஐக்கியம் என்ற ஓர் விளக்கத்தை மட்டும் உரைக்குள் திணிக்கவில்லை.
- issue: תְּרוּמָה என்ற சடங்குச் சொல்
  choice: எடுத்துப்படைக்கும் காணிக்கை
  alternative: உயர்த்திப் படைக்கும் காணிக்கை
  rationale: ஒதுக்கி எடுத்து அர்ப்பணிக்கும் பொருளை முன்னிறுத்துகிறது; குறிப்பிட்ட உடல் அசைவு எவ்வாறு இருந்தது என்பது குறித்து மூலத்தில் உள்ள அளவை மீறி முடிவுசெய்யவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்ட-வழிபாட்டு சூழலுக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டது. ‘ஆசாரியன்’, ‘காணிக்கை’, ‘நியமம்’ போன்ற பரவலாக அறியப்பட்ட வேதாகமச் சொற்கள் தக்கவைக்கப்பட்டுள்ளன; அரிதான சடங்குச் சொற்களுக்கு அடிக்குறிப்புகள் வழங்கப்பட்டுள்ளன.
