  text: וְ/הִקְרִ֨יב מִמֶּ֤/נּוּ אֶחָד֙ מִ/כָּל קָרְבָּ֔ן תְּרוּמָ֖ה לַ/יהוָ֑ה לַ/כֹּהֵ֗ן הַ/זֹּרֵ֛ק אֶת דַּ֥ם הַ/שְּׁלָמִ֖ים ל֥/וֹ יִהְיֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/014.yaml
  text: And from it he shall present one from each offering as a contribution to Yahweh[c][b][a]; it shall belong to the priest who sprinkles the blood of the peace offerings.
translation:
  language: ta
  text: அதிலிருந்து ஒவ்வொரு காணிக்கையிலும் ஒன்றை ஆண்டவருக்கான பங்காக[a] அவன் செலுத்த வேண்டும்; சமாதானப் பலிகளின்[c] இரத்தத்தைத் தெளிக்கும்[b] ஆசாரியனுக்கே அது உரியதாகும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஆண்டவருக்கென்று பிரித்தெடுக்கப்பட்ட காணிக்கையாக.’ எபிரெயச் சொல் கடவுளுக்கென்று பிரிக்கப்பட்டு ஆசாரியனுக்கு ஒதுக்கப்படும் ஒரு பகுதியைக் குறிக்கிறது; மரபாக இது ‘உயர்த்திப் படைக்கும் காணிக்கை’ என்றும் மொழிபெயர்க்கப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘தெளிக்கும்’ என்பதற்கு ‘வீசியெறியும்’ அல்லது ‘தெறிக்கச் செய்யும்’ என்றும் மொழிபெயர்க்கலாம். இது பலியின் இரத்தத்தைச் செலுத்தும் சடங்கு நடவடிக்கையைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: ‘சமாதானப் பலிகள்’ என்பதை ‘உறவுணர்வுப் பலிகள்’ அல்லது ‘நல்வாழ்வுப் பலிகள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: அவன் செலுத்த வேண்டும்
  rationale: קרב என்பதன் ஹிஃபில் வடிவம் காணிக்கையாகக் கொண்டுவந்து சமர்ப்பிப்பதைக் குறிக்கிறது. இச்சூழலில் ‘செலுத்த வேண்டும்’ என்பது இயல்பான, மரியாதையான தமிழ்.
- source_word: מִמֶּנּוּ
  choice: அதிலிருந்து
  rationale: ஒருமை பின்னொட்டு முந்தைய வசனத்தில் விவரிக்கப்பட்ட நன்றிப் பலியின் முழுத் தொகுப்பை ஒரு அலகாகச் சுட்டுகிறது.
- source_word: אֶחָד מִכָּל קָרְבָּן
  choice: ஒவ்வொரு காணிக்கையிலும் ஒன்றை
  rationale: எபிரெயச் சொற்றொடரின் பகிர்ந்தளிக்கும் பொருளைத் தக்கவைத்து, முன்பு குறிப்பிடப்பட்ட ஒவ்வொரு வகையிலிருந்தும் ஒன்று எடுக்கப்பட வேண்டும் என்பதை இயல்பாகத் தெரிவிக்கிறது.
- source_word: תְּרוּמָה
  choice: பங்காக
  rationale: ஆண்டவருக்கென்று பிரித்தெடுக்கப்பட்டு ஆசாரியனுக்கு ஒதுக்கப்படும் பகுதியை இச்சொல் குறிக்கிறது. ‘பங்கு’ என்பது தொழில்நுட்பச் சொல்லால் ஏற்படும் தெளிவின்மையைத் தவிர்த்து உரிமையாக ஒதுக்கப்படுவதை வெளிப்படுத்துகிறது; மாற்று விளக்கம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: לַיהוָה
  choice: ஆண்டவருக்கான
  rationale: தெய்வீகப் பெயரான YHWH-ஐத் தமிழ் வேதாகம நடையில் மரியாதையுடனும் வழக்கத்துடனும் ‘ஆண்டவர்’ என்று வழங்குகிறது; לְ அர்ப்பணிப்பின் நோக்கைச் சுட்டுகிறது.
- source_word: הַזֹּרֵק
  choice: தெளிக்கும்
  rationale: זרק என்பது பலியின் இரத்தத்தை எறிந்து/வீசி இடும் சடங்கு நடவடிக்கையைக் குறிக்கிறது. ‘தெளிக்கும்’ என்பது தமிழில் இயல்பான பலியீட்டுச் சொல்லாக்கம்; செய்முறையின் வேறு சாத்தியமான நுணுக்கங்கள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.
- source_word: דַּם הַשְּׁלָמִים
  choice: சமாதானப் பலிகளின் இரத்தம்
  rationale: שְׁלָמִים என்ற நிறுவப்பட்ட பலிவகையை ‘சமாதானப் பலிகள்’ என வழங்குவது அதன் பாரம்பரிய அடையாளத்தைத் தக்கவைக்கிறது; மாற்றுப் பொருள் நுணுக்கங்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: לוֹ יִהְיֶה
  choice: ஆசாரியனுக்கே அது உரியதாகும்
  rationale: இந்த எபிரெய மரபுத்தொடர் உடைமை அல்லது சட்டபூர்வ ஒதுக்கீட்டைக் குறிக்கிறது. ‘உரியதாகும்’ என்பது அந்த ஆசாரியனுக்கான உரிமையைத் தெளிவாகக் கூறுகிறது; ‘-க்கே’ குறிப்பிட்ட ஆசாரியனை வலியுறுத்துகிறது.
theological_decisions:
- issue: יהוה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: ஆண்டவர்
  alternative: யாவே
  rationale: தமிழில் பரவலாக அறியப்படும் மரியாதைமிக்க தெய்வீகப் பெயர் வழக்கைப் பின்பற்றுகிறது; எபிரெய மூலத்தில் தனிப்பட்ட தெய்வீகப் பெயர் இருப்பது மொழிபெயர்ப்புத் தீர்மானத்தில் கருத்தில் கொள்ளப்பட்டுள்ளது.
- issue: שְׁלָמִים என்ற பலிவகையின் பொருள்
  choice: சமாதானப் பலிகள்
  alternative: உறவுணர்வுப் பலிகள் / நல்வாழ்வுப் பலிகள்
  rationale: ‘சமாதானப் பலிகள்’ நிறுவப்பட்ட பலியியல் வகையைப் பாதுகாக்கிறது; கூட்டுறவு அல்லது நல்வாழ்வு என்ற ஒரே பொருளுக்குள் சொல்லைச் சுருக்காமல் அதன் பொருள் விரிவை அடிக்குறிப்பில் வைத்திருக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் வகையிலும் பலியியல் சூழலுக்குரிய கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டுள்ளது. ‘ஆசாரியனுக்கே’ என்பது இரத்தச் சடங்கைச் செய்கிற குறிப்பிட்ட ஆசாரியனுக்கான ஒதுக்கீட்டை இயல்பாக வலியுறுத்துகிறது. தொழில்நுட்பச் சொற்களின் உண்மையான பொருள் விரிவு அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளது.
