  text: וְ/זֹ֥את תּוֹרַ֖ת זֶ֣בַח הַ/שְּׁלָמִ֑ים אֲשֶׁ֥ר יַקְרִ֖יב לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/011.yaml
  text: This is the law of the sacrifice of peace offerings that one shall present to Yahweh:[a]
translation:
  language: ta
  text: ஒருவர் யாவேக்குச் செலுத்தும் சமாதானப் பலிக்கான விதிமுறை இதுவே:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நலவாழ்வுப் பலி”; மரபாக, “சமாதானப் பலி.”
    reason: שְׁלָמִים என்ற தொழில்நுட்பச் சொல் சமாதானத்தோடு நல்வாழ்வு, முழுமை ஆகிய பொருள்சாயல்களையும் கொண்டுள்ளது.
lexical_decisions:
- source_word: וְ/זֹאת
  choice: இதுவே
  rationale: וְ புதிய உட்பகுதியைத் தொடங்குகிறது; தமிழில் தேவையற்ற காலச்சுட்டான ‘இப்போது’ என்பதைச் சேர்க்காமல், זֹאת என்பதன் சுட்டுப்பொருளையும் வலியுறுத்தலையும் ‘இதுவே’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: תּוֹרַת
  choice: விதிமுறை
  rationale: ஆசாரியச் சட்டச் சூழலில் תּוֹרָה என்பது ஒரு சடங்குக்கான நிர்ணயிக்கப்பட்ட ஒழுங்கு அல்லது விதியைக் குறிக்கிறது. ‘விதிமுறை’ என்பது இங்கு இயல்பான, சட்டப்பூர்வமான தமிழாக்கம்.
- source_word: זֶבַח הַשְּׁלָמִים
  choice: சமாதானப் பலி
  rationale: זֶבַח என்பது பலியிடுதலைக் குறிக்கிறது; שְׁלָמִים என்பது சமாதானம், முழுமை, நல்வாழ்வு ஆகிய பொருள்சாயல்களைக் கொண்ட தொழில்நுட்பப் பலிச்சொல். மரபாகவும் புரிந்துகொள்ளத்தக்கதாகவும் உள்ள ‘சமாதானப் பலி’ முதன்மை உரையில் வைக்கப்பட்டு, மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אֲשֶׁר יַקְרִיב
  choice: ஒருவர் … செலுத்தும்
  rationale: மூன்றாம் நபர் ஆண்பால் ஒருமை வடிவம் சட்ட மொழியில் பொதுவான நபரைக் குறிக்கிறது. ‘ஒருவர்’ அந்தப் பொதுப்பொருளைத் தமிழில் தெளிவாக்குகிறது; ‘செலுத்தும்’ என்பது கட்டாயம் அல்லது அனுமதி என்ற நுணுக்கத்தை மிகையாக நிர்ணயிக்காமல், பலியை இறைவனுக்குக் கொண்டுவந்து அர்ப்பணிக்கும் செயலை இயல்பாகக் குறிக்கிறது.
- source_word: לַ/יהוָה
  choice: யாவேக்கு
  rationale: לְ அர்ப்பணிப்பின் இலக்கைக் குறிக்கிறது. יהוה என்ற உடன்படிக்கைப் பெயர் பட்டப்பெயராக மாற்றப்படாமல் ‘யாவே’ என்று ஒலிபெயர்க்கப்படுகிறது; வேற்றுமை உருபுடன் ‘யாவேக்கு’ என வருகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூல உரையில் நான்கெழுத்து இறைப்பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டப்பெயரால் மாற்றாமல், உடன்படிக்கைப் பெயராக ‘யாவே’ என்று வழங்குவது மூலத்திற்குச் சமீபமானது.
- issue: שְׁלָמִים என்ற பலிச்சொல்லின் பொருள்
  choice: சமாதானப் பலி
  alternative: நலவாழ்வுப் பலி
  rationale: இச்சொல் சமாதானம் மட்டுமல்லாமல் முழுமை மற்றும் நல்வாழ்வையும் உணர்த்தக்கூடும். மரபான சொல்லை முதன்மை உரையில் வைத்தபடியே, அதன் விரிவான பொருள்சாயலை அடிக்குறிப்பு பாதுகாக்கிறது.
- issue: יַקְרִיב என்பதிலுள்ள சட்டப்பூர்வ வினை நுணுக்கம்
  choice: செலுத்தும்
  alternative: செலுத்த வேண்டிய / செலுத்துவான்
  rationale: எபிரெய வினை இங்கு பொதுவான சட்டச் சூழலில் வருகிறது; அது தனித்து கட்டாயம், அனுமதி, அல்லது எதிர்காலம் ஆகியவற்றில் ஒன்றைத் தெளிவாக நிர்ணயிப்பதில்லை. தமிழ் நிகழ்காலப் பொதுவினை அந்தத் திறந்த நுணுக்கத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத்தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. பலியியல் தொழில்நுட்பச் சொல்லுக்கு மரபான ‘சமாதானப் பலி’ பயன்படுத்தப்பட்டுள்ளது; செய்பவர் பொதுவானவர் என்பதை ‘ஒருவர்’ தெளிவாக்குகிறது. வசனம் அடுத்த விதிகளை அறிமுகப்படுத்துவதால் முடிவில் முக்காற்புள்ளி வைக்கப்பட்டுள்ளது.
