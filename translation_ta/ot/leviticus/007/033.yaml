base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/033.yaml
  text: The one from among the sons of Aaron who presents the blood of the peace offerings and the fat—to him the right thigh shall belong as his portion.
translation:
  language: ta
  text: ஆரோனின் மகன்களில் எவன் சமாதானப் பலிகளின்[a] இரத்தத்தையும் கொழுப்பையும் செலுத்துகிறானோ, அவனுக்கு வலது தொடை அவனுடைய பங்காக இருக்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஐக்கியப் பலிகள்.”
    reason: שְׁלָמִים என்ற பலிவகைக்கான பொருள் விளக்கும் மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: הַמַּקְרִיב
  choice: செலுத்துகிறானோ
  rationale: קרב என்பதன் ஹிஃபில் வினையெச்சம் பலியைச் சடங்குமுறைப்படி கொண்டுவந்து செலுத்துவதைக் குறிக்கிறது. ‘செலுத்துகிறான்’ என்பது இங்கு இயல்பாகவும் சடங்குச் சூழலுக்கு ஏற்றவாறும் உள்ளது; ‘எவன் ... செலுத்துகிறானோ’ என்ற அமைப்பு வினையெச்சத்தின் பெயர்ச்சொல் தன்மையைப் பேணுகிறது.
- source_word: דַּם
  choice: இரத்தம்
  rationale: பலிச் சட்டங்களுக்குரிய வழக்கமான நேரடி மொழிபெயர்ப்பு.
- source_word: הַשְּׁלָמִים
  choice: சமாதானப் பலிகள்
  rationale: שְׁלָמִים எனும் பலிவகையின் முழுமை/சமாதானம் சார்ந்த சொல்லியல் தொடர்பைப் பேணுகிறது. ‘உறவுப் பலிகள்’ என்பது விளக்கமளிக்கும் மாற்றாக அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: הַחֵלֶב
  choice: கொழுப்பு
  rationale: பலியிலிருந்து பிரித்தெடுக்கப்படும் குறிப்பிட்ட கொழுப்புப் பகுதிகளைச் சுட்டும் நேரடி மொழிபெயர்ப்பு.
- source_word: מִבְּנֵי אַהֲרֹן
  choice: ஆரோனின் மகன்களில்
  rationale: ஆசாரியக் குழுவுக்குள் ஒருவனைத் தேர்ந்து சுட்டும் מן அமைப்பையும், எபிரெய உரையின் ஆண்பால் குடும்பக் குறிப்பையும் இயல்பான தமிழில் பேணுகிறது.
- source_word: לוֹ תִהְיֶה
  choice: அவனுக்கு ... அவனுடைய ... இருக்கும்
  rationale: சட்டப்படி உரிய பங்கு அவனுக்குச் சொந்தமாகும் என்பதைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: שׁוֹק הַיָּמִין
  choice: வலது தொடை
  rationale: שׁוֹק பலியிடப்பட்ட விலங்கின் மேல் கால் அல்லது தொடைப் பகுதியைக் குறிக்கிறது; ‘தொடை’ என்பது பொதுவான ‘கால்’ என்பதைவிடத் துல்லியமானது.
- source_word: לְמָנָה
  choice: பங்காக
  rationale: ஒதுக்கப்பட்ட உரிமைப் பங்கு என்ற சட்டப்பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: ஆசாரியச் சட்டத்தில் בְּנֵי אַהֲרֹן என்பதன் மொழிபெயர்ப்பு
  choice: ஆரோனின் மகன்கள்
  alternative: ஆரோனின் சந்ததியினர்; ஆரோனின் குடும்பத்தினர்
  rationale: எபிரெயச் சொற்றொடர் வெளிப்படையாக ஆண்பால் பன்மையில் இருந்து, பலிப்பணியில் ஈடுபடும் ஆண் ஆசாரியர்களைக் குறிப்பாகச் சுட்டுகிறது. ஆகவே அதன் பாலின மற்றும் குடும்பக் குறிப்பை பொதுமைப்படுத்தாமல் பேணுகிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான சட்டநடை பயன்படுத்தப்பட்டுள்ளது. ‘எவன் ... செலுத்துகிறானோ, அவனுக்கு ...’ என்ற தொடர்பமைப்பு எபிரெய வாக்கியத்தின் வலியுறுத்தலையும் உரிமைப் பகிர்வையும் இயல்பாகப் பேணுகிறது.
