base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/002.yaml
  text: In the place where they slaughter the burnt offering[a], they shall slaughter the guilt offering, and he shall splash its blood against the altar all around.
translation:
  language: ta
  text: எரிபலியை அவர்கள் அறுக்கும் இடத்தில் குற்றநிவாரணப் பலியையும்[a] அவர்கள் அறுக்க வேண்டும். அதன் இரத்தத்தை அவன் பலிபீடத்தின் எல்லாப் பக்கங்களிலும் தெளிக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘குற்றப்பலி’ அல்லது ‘இழப்பீட்டுப் பலி’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் குற்றத்தையும் அதற்காக நிவாரணம் அல்லது ஈடுசெய்வதையும் வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּמְקוֹם אֲשֶׁר
  choice: அறுக்கும் இடத்திலேயே
  rationale: இடத்தைக் குறிக்கும் எபிரெயச் சொற்றொடரையும், இரு பலிகளும் ஒரே இடத்தில் அறுக்கப்பட வேண்டும் என்ற விதிமுறையின் வலியுறுத்தலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יִשְׁחֲטוּ
  choice: அவர்கள் அறுக்க வேண்டும்
  rationale: שׁחט பலியிடும் சூழலில் சடங்குமுறைப்படி விலங்கை அறுப்பதைக் குறிக்கிறது; ‘அறுக்க’ என்பது நவீன தமிழில் துல்லியமாகவும் இயல்பாகவும் உள்ளது.
- source_word: הָעֹלָה
  choice: எரிபலி
  rationale: முழுவதுமாக எரிக்கப்படும் பலிவகையைக் குறிக்கும் நிலைபெற்ற, சுருக்கமான தமிழ் வேதாகமச் சொல்.
- source_word: הָאָשָׁם
  choice: குற்றநிவாரணப் பலி
  rationale: אָשָׁם என்பதில் குற்றமும் அதற்கான நிவாரணம் அல்லது ஈடுசெய்தலும் இணைந்திருப்பதால், இரு நுணுக்கங்களையும் ஓரளவு தக்கவைக்கிறது.
- source_word: דָּמוֹ
  choice: அதன் இரத்தத்தை
  rationale: ஒருமை உருபு குற்றநிவாரணப் பலிக்குரிய விலங்கைக் குறிக்கிறது; தமிழ் உரை இதைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: יִזְרֹק
  choice: தெளிக்க வேண்டும்
  rationale: பலிபீடத்தின் மீது இரத்தத்தை வீசித் தெளிக்கும் சடங்குச் செயலை இயல்பான தமிழில் குறிக்கிறது; வெறும் மென்மையான துளிப்பை மட்டும் கட்டாயப்படுத்துவதில்லை.
- source_word: עַל הַמִּזְבֵּחַ סָבִיב
  choice: பலிபீடத்தின் மீது சுற்றிலும்
  rationale: இரத்தம் பலிபீடத்தைச் சுற்றியுள்ள எல்லாப் பக்கங்களிலும் செலுத்தப்படுவதைத் தெரிவிக்கிறது.
theological_decisions:
- issue: אָשָׁם என்ற பலிவகையின் பெயர்
  choice: குற்றநிவாரணப் பலி
  alternative: குற்றப்பலி; இழப்பீட்டுப் பலி
  rationale: இது வெறும் குற்ற உணர்வை மட்டுமல்லாமல், குற்றத்திற்கான நிவாரணம் மற்றும் ஈடுசெய்தல் சார்ந்த அம்சத்தையும் கொண்ட பலிவகை. முதன்மைத் தேர்வு இரண்டையும் சமநிலையுடன் தக்கவைக்கிறது; மாற்றுப் பெயர்கள் அடிக்குறிப்பில் வழங்கப்படுகின்றன.
- issue: יִשְׁחֲטוּ என்ற பன்மையிலிருந்து יִזְרֹק என்ற ஒருமைக்கான மாற்றம்
  choice: ‘அவர்கள் … அறுக்க வேண்டும்; அவன் … தெளிக்க வேண்டும்’ என்று இலக்கண மாற்றத்தைப் பாதுகாத்தல்
  alternative: ‘ஆசாரியன் … தெளிக்க வேண்டும்’ என்று மறைந்துள்ள செய்பவரை வெளிப்படுத்தல்
  rationale: எபிரெய உரை ஆசாரியனை இவ்வசனத்தில் வெளிப்படையாகப் பெயரிடாததால், அதன் இலக்கண மாற்றத்தையும் உண்மையான மறைமுகத்தன்மையையும் மொழிபெயர்ப்பு காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளக்கூடிய மதிப்புமிக்க நடை பயன்படுத்தப்பட்டுள்ளது. பலிச் சட்டத்தின் தொழில்நுட்பத் துல்லியம் காக்கப்பட்டுள்ளதோடு, எபிரெய உரையிலுள்ள பன்மை–ஒருமை செய்பவர் மாற்றமும் தீர்மானித்து விளக்கப்படாமல் பாதுகாக்கப்பட்டுள்ளது.
