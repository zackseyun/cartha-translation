  to: எரிபலியை அவர்கள் அறுக்கும் இடத்தில் குற்றநிவாரணப் பலியையும்[a] அவர்கள் அறுக்க வேண்டும். அதன் இரத்தத்தை அவன் பலிபீடத்தின் எல்லாப் பக்கங்களிலும் தெளிக்க வேண்டும்.
