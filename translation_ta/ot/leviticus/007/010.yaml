base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/010.yaml
  text: And every grain offering mixed with oil[a], or dry, shall belong to all the sons of Aaron, each alike with his brother.
translation:
  language: ta
  text: எண்ணெயுடன் பிசையப்பட்டதோ உலர்ந்ததோ ஆன ஒவ்வொரு தானியக் காணிக்கையும் ஆரோனின் மகன்கள் அனைவருக்கும், ஒவ்வொருவருக்கும் தன் சகோதரரைப்போல, உரியதாக இருக்கும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִנְחָה
  choice: தானியக் காணிக்கை
  rationale: லேவியராகமத்தின் பலிச் சடங்குச் சூழலில் இது பொதுவான காணிக்கையை அல்ல, தானியத்தால் செய்யப்படும் குறிப்பிட்ட காணிக்கையைக் குறிக்கிறது.
- source_word: בְלוּלָה בַשֶּׁמֶן
  choice: எண்ணெயுடன் பிசையப்பட்ட
  rationale: எண்ணெய் சேர்த்து நன்கு கலந்த தயாரிப்பு முறையை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: חֲרֵבָה
  choice: உலர்ந்த
  rationale: எண்ணெயுடன் பிசையப்பட்ட காணிக்கைக்கு எதிர்மாறான எபிரெயச் சொல்லின் சுருக்கமான நேரடிப் பொருளைப் பாதுகாக்கிறது; ‘எண்ணெய் இல்லாத’ என்ற விளக்கத்தை உரைக்குள் சேர்க்கவில்லை.
- source_word: לְכָל בְּנֵי אַהֲרֹן תִּהְיֶה
  choice: ஆரோனின் மகன்கள் அனைவருக்கும் உரியதாக இருக்கும்
  rationale: லாமேத் முன்னிடைச்சொல்லுடன் வரும் היה உடைமை அல்லது ஒதுக்கீட்டைக் காட்டுவதால், சட்டச் சூழலுக்கு ஏற்ற தெளிவான தமிழாக்கம்.
- source_word: אִישׁ כְּאָחִיו
  choice: ஒவ்வொருவருக்கும் அவரவர் சகோதரருக்குக் கிடைப்பதுபோலவே கிடைக்கும்
  rationale: ஒவ்வொரு ஆண் ஆசாரியருக்கும் மற்ற சகோதரருக்கு ஒப்பாகப் பங்கு கிடைக்க வேண்டும் என்ற பகிர்வுக் கருத்தை வெளிப்படுத்துகிறது; ‘சமமாக’ என்பதை நேரடியாகச் சேர்க்காமல் எபிரெய ஒப்புமை அமைப்பைப் பாதுகாக்கிறது.
theological_decisions:
- issue: ஆசாரியர்களைக் குறிக்கும் பாலினச் சொற்கள்
  choice: ஆரோனின் மகன்கள் ... அவரவர் சகோதரர்
  alternative: ஆரோனின் பிள்ளைகள் ... ஒவ்வொருவரும்
  rationale: ஆண் ஆசாரியர்களைக் குறிக்கும் எபிரெய மூலத்தின் בְּנֵי மற்றும் אָחִיו ஆகிய ஆண்பால் உறவுமுறைச் சொற்களைப் பொதுப்பாலாக்காமல் பாதுகாக்கிறது.
- issue: אִישׁ כְּאָחִיו என்பதிலுள்ள சமப் பகிர்வு
  choice: அவரவர் சகோதரருக்குக் கிடைப்பதுபோலவே
  alternative: அவரவர் சகோதரருடன் சமமாக
  rationale: சூழல் சமப் பகிர்வைக் குறித்தாலும், மூலத்தில் உள்ள ஒப்புமை வடிவத்தை உரையில் வைத்திருப்பதால் அதன் மொழியியல் அமைப்பையும் மறைபொருளையும் பாதுகாக்க முடிகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பலிச் சட்டத்திற்கேற்ற கண்ணியமான நடை. ‘தானியக் காணிக்கை’ தொழில்நுட்பச் சொல்லாகத் தெளிவாக வைக்கப்பட்டது; ஆண்பால் ஆசாரிய உறவுமுறைச் சொற்கள் மூலத்தின்படி பாதுகாக்கப்பட்டன.
