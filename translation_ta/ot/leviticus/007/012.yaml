base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/012.yaml
  text: If he offers it as a thanksgiving offering[a], then with the sacrifice of thanksgiving he shall offer unleavened loaves mixed with oil, unleavened wafers anointed with oil[c][b], and cakes of fine flour well mixed with oil.
translation:
  language: ta
  text: அவன் அதை நன்றி செலுத்தும் பலியாகச் செலுத்தினால்[a], அந்த நன்றி செலுத்தும் பலியுடன் எண்ணெய் கலந்த புளிப்பில்லாத அப்பங்களையும், எண்ணெய் பூசப்பட்ட புளிப்பில்லாத மெல்லிய அடைகளையும்[b], நன்கு கலக்கப்பட்ட[c] நுண்ணிய மாவினால் செய்யப்பட்ட, எண்ணெய் கலந்த அடைகளையும் செலுத்த வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நன்றிப் பலி’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் நன்றி செலுத்துவதற்காகக் கொண்டுவரப்பட்ட பலியைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: இங்கு ‘எண்ணெய் பூசப்பட்ட’ என்பது உணவு தயாரிப்பின்போது மெல்லிய அடைகளின் மேல் எண்ணெய் தடவப்பட்டதைக் குறிக்கிறது; ஆட்களையோ பொருட்களையோ சடங்குமுறையில் அபிஷேகம் செய்வதை அல்ல.
    reason: cultural_note
  - marker: c
    text: இங்கு பயன்படுத்தப்பட்ட எபிரெயச் சொல் குறிக்கும் துல்லியமான தயாரிப்பு முறை உறுதியில்லை; நுண்ணிய மாவு நன்கு கலக்கப்பட்டதையோ, பிசையப்பட்டதையோ, வேறொரு முறையில் தயாரிக்கப்பட்டதையோ அது குறிக்கலாம்.
    reason: textual_or_lexical_uncertainty
lexical_decisions:
- source_word: תּוֹדָה
  choice: நன்றியறிதல் பலி
  rationale: இந்தப் பலியிடும் சூழலில், நன்றி செலுத்துவதற்காகக் கொண்டுவரப்படும் சமாதானப் பலியின் ஒரு வகையை இச்சொல் குறிக்கிறது. ‘நன்றியறிதல் பலி’ என்பது அதன் நோக்கத்தைத் தெளிவாகவும் இயல்பான நவீன தமிழிலும் தெரிவிக்கிறது.
- source_word: יַקְרִיבֶנּוּ
  choice: அதை ... பலியாகச் செலுத்தினால்
  rationale: பலியிடும் சூழலில் קרב என்பதன் ஹிஃபில் வடிவம் ஒரு பலியைச் செலுத்துதல் அல்லது முன்வைத்தல் எனப் பொருள்படும்; தமிழில் ‘பலியாகச் செலுத்துதல்’ இயல்பாக உள்ளது.
- source_word: זֶבַח הַתּוֹדָה
  choice: அந்த நன்றியறிதல் பலியுடன்
  rationale: זֶבַח மற்றும் תּוֹדָה ஆகியவற்றின் தொடர்பை, முன் குறிப்பிடப்பட்ட பலியையே சுட்டும் வகையில் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: חַלּוֹת מַצּוֹת
  choice: புளிப்பில்லாத அப்பங்கள்
  rationale: חַלּוֹת என்பது அப்பம் அல்லது அடை வடிவ உணவுப் பொருட்களையும், מַצּוֹת என்பது புளிக்கவைக்கப்படாத தன்மையையும் குறிக்கிறது. முதல் வகைக்கு ‘அப்பங்கள்’ தெளிவான பொதுச் சொல்.
- source_word: בְּלוּלֹת בַּשֶּׁמֶן
  choice: எண்ணெய் கலந்த
  rationale: בלל என்பது பொருட்களை ஒன்றாகக் கலப்பதைக் குறிக்கிறது; ‘எண்ணெய் கலந்த’ என்பது சுருக்கமான, இயல்பான சமையல் வழக்குச் சொற்றொடர்.
- source_word: רְקִיקֵי מַצּוֹת
  choice: புளிப்பில்லாத மெல்லிய அடைகள்
  rationale: רְקִיקִים மெல்லிய அப்பங்கள் அல்லது அடைகளைக் குறிக்கிறது. ‘மெல்லிய அடைகள்’ அதன் வடிவத்தைத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: מְשֻׁחִים בַּשָּׁמֶן
  choice: எண்ணெய் பூசப்பட்ட
  rationale: משׁח என்பதன் அடிப்படைப் பொருள் பூசுதல் அல்லது அபிஷேகம் செய்தல். இங்கு உணவு தயாரிப்பு சூழல் என்பதால் ‘எண்ணெய் பூசப்பட்ட’ என்பது சடங்கு சார்ந்த தேவையற்ற பொருளைச் சேர்க்காமல் செயலைத் துல்லியமாகக் காட்டுகிறது.
- source_word: סֹלֶת
  choice: மெல்லிய மாவு
  rationale: סֹלֶת பலிகளில் பயன்படுத்தப்படும் நன்றாக அரைக்கப்பட்ட தரமான மாவைக் குறிக்கிறது. ‘மெல்லிய மாவு’ அதன் நுண்மையை நேரடியாகத் தெரிவிக்கிறது.
- source_word: מֻרְבֶּכֶת
  choice: பிசைந்து தயாரிக்கப்பட்ட
  rationale: இச்சொல்லின் துல்லியமான பழங்கால சமையல் நுட்பம் உறுதியில்லை; கலத்தல், பிசைதல் அல்லது ஊறவைத்தல் போன்ற செயலாக இருக்கலாம். சூழலுக்கேற்ற பொதுவான மொழிபெயர்ப்பாக இது தேர்ந்தெடுக்கப்பட்டுள்ளது; ஐயம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: חַלֹּת
  choice: அடைகள்
  rationale: மூன்றாவது மாவுப் பொருளை முதல் வகை அப்பங்களிலிருந்து வேறுபடுத்தவும், சிறிய தயாரிக்கப்பட்ட அப்ப வகையைச் சுட்டவும் ‘அடைகள்’ பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: תּוֹדָה என்ற பலிவகையின் பொருள்
  choice: நன்றியறிதல் பலி
  alternative: துதிப் பலி
  rationale: இங்கு நன்றி செலுத்தும் நோக்கம் முதன்மையானது. ‘துதிப் பலி’ என்பது பொருளைச் சுருக்கவோ வழிபாட்டு நுணுக்கத்தை அதிகமாக முன்வைக்கவோ கூடும்; எனவே மூலத்தின் பரந்த நன்றியுணர்வை ‘நன்றியறிதல் பலி’ பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் வகையிலும் பலிச்சட்ட உரைக்கேற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. பழங்கால உணவுவகைகளின் வேறுபாட்டைக் காட்ட ‘அப்பங்கள்’ மற்றும் ‘மெல்லிய அடைகள்’ பயன்படுத்தப்பட்டுள்ளன. உறுதியற்ற சமையல் நுட்பம் அடிக்குறிப்பில் வெளிப்படையாக வைக்கப்பட்டுள்ளது.
