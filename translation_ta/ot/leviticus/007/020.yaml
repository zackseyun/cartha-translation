revisions:
- from: ஆனால், யெகோவாவுக்குச் சொந்தமான சமாதானப் பலியின் இறைச்சியைத் தன் தீட்டு தன்மேல் இருக்கும்போது உண்கிறவர், தம் மக்களிடமிருந்து அறுத்துப்போடப்பட வேண்டும்[a].
  to: யாவேக்கு உரிய சமாதானப் பலியின் இறைச்சியைத் தம்மேல் தீட்டு இருக்கும்போது உண்பவர் எவராயினும், அந்த நபர் தம் மக்களிடமிருந்து துண்டிக்கப்பட வேண்டும்[a].
  rationale: The revision improves modern Tamil idiom and aligns the divine name with the Hebrew source and English audit trail. It retains the sacrificial terminology, the ritual-impurity condition, the generic legal subject, and the deliberate ambiguity of the ‘cut off’ penalty.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T09:12:36Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately conveys the legal condition: a person who eats the meat of a peace offering belonging to YHWH while ritually unclean incurs the penalty of being cut off from his or her people. The penalty remains appropriately unresolved, and the footnote preserves the source''s ambiguity. A revision is needed because the Tamil rendering of the penalty is not idiomatic enough for modern standard Tamil, and the divine name should correspond more closely to the stated Hebrew and English audit trail.'
  naturalness: ‘தன் தீட்டு தன்மேல் இருக்கும்போது’ is understandable but repetitive and less natural than ‘தம்மேல் தீட்டு இருக்கும்போது.’ ‘அறுத்துப்போடப்பட வேண்டும்’ is an awkward Tamil calque in this legal context. ‘துண்டிக்கப்பட வேண்டும்’ retains the formal metaphor of cutting off while reading more naturally.
  terminology: ‘சமாதானப் பலி,’ ‘இறைச்சி,’ and ‘தீட்டு’ are suitable modern, dignified cultic/legal terms. ‘யாவேக்கு உரிய’ better reflects יהוה/Yahweh than ‘யெகோவாவுக்குச் சொந்தமான,’ while ‘உரிய’ naturally expresses consecrated belonging.
  issues:
  - severity: medium
    issue: The rendering ‘அறுத்துப்போடப்பட வேண்டும்’ is stylistically awkward for the Hebrew penalty formula.
    rationale: It is overly literal in a way that sounds unnatural in modern Tamil. ‘துண்டிக்கப்பட வேண்டும்’ preserves the formal metaphor without specifying whether the penalty is expulsion or death.
  - severity: low
    issue: The phrase ‘தன் தீட்டு தன்மேல் இருக்கும்போது’ is repetitive.
    rationale: ‘தம்மேல் தீட்டு இருக்கும்போது’ is clearer and idiomatic while preserving the Hebrew image of impurity being upon the person.
  - severity: low
    issue: The main text uses ‘யெகோவா,’ though the supplied Hebrew source and English audit trail use YHWH/Yahweh.
    rationale: ‘யாவே’ more directly represents the source name and avoids importing a distinct traditional vocalization.
  revised_text: யாவேக்கு உரிய சமாதானப் பலியின் இறைச்சியைத் தம்மேல் தீட்டு இருக்கும்போது உண்பவர் எவராயினும், அந்த நபர் தம் மக்களிடமிருந்து துண்டிக்கப்பட வேண்டும்[a].
  revised_footnotes:
