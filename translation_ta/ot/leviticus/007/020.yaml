source:
  edition: WLC
  text: וְ/הַ/נֶּ֜פֶשׁ אֲשֶׁר תֹּאכַ֣ל בָּשָׂ֗ר מִ/זֶּ֤בַח הַ/שְּׁלָמִים֙ אֲשֶׁ֣ר לַ/יהוָ֔ה וְ/טֻמְאָת֖/וֹ עָלָ֑י/ו וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מֵ/עַמֶּֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/020.yaml
  text: But the person who eats meat from the sacrifice of peace offerings that belongs to Yahweh while his uncleanness is on him—that person shall be cut off from his people[a].
translation:
  language: ta
  text: யாவேக்கு உரிய சமாதானப் பலியின் இறைச்சியைத் தம்மேல் தீட்டு இருக்கும்போது உண்பவர் எவராயினும், அந்த நபர் தம் மக்களிடமிருந்து துண்டிக்கப்பட வேண்டும்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தம் மக்களிடமிருந்து விலக்கப்பட வேண்டும்.’ ‘துண்டிக்கப்பட வேண்டும்’ என்ற சொற்றொடர் வெளியேற்றத்தையோ மரணத்தையோ குறிக்கலாம்; ஆனால் அது எவ்வாறு நிறைவேற்றப்படும் என்பதை எபிரெய உரை இங்கு குறிப்பிடவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: הַנֶּפֶשׁ
  choice: உண்கிறவர்
  rationale: சட்டப்பின்னணியில் נֶפֶשׁ என்பது உடலற்ற ‘ஆத்துமா’வை அல்ல, தனிநபரைக் குறிக்கிறது. தமிழில் தொடர்புச் சொல்லுடன் ‘உண்கிறவர்’ என்பது இயல்பாகவும் அனைவருக்கும் பொருந்தும் வகையிலும் உள்ளது.
- source_word: תֹּאכַל
  choice: உண்கிறவர்
  rationale: இங்கு எபிரெய imperfect பொதுவான சட்டநிபந்தனையைக் குறிக்கிறது; தமிழ் நிகழ்காலத் தொடர்புவினை அதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בָּשָׂר
  choice: இறைச்சி
  rationale: பலியுணவு சூழலில் ‘சதை’ என்பதைக் காட்டிலும் ‘இறைச்சி’ தெளிவான நவீனத் தமிழ்.
- source_word: מִזֶּבַח הַשְּׁלָמִים
  choice: சமாதானப் பலியின்
  rationale: இது குறிப்பிட்ட பலிவகையைக் குறிக்கிறது. ‘சமாதானப் பலி’ வழக்கமான வேதாகமச் சொல்லாட்சியைத் தக்கவைத்து, மூலத்தின் பெயரிடலைப் பாதுகாக்கிறது.
- source_word: אֲשֶׁר לַיהוָה
  choice: யெகோவாவுக்குச் சொந்தமான
  rationale: לַיהוָה இங்கு பலி யெகோவாவுக்கு உரியதாக அர்ப்பணிக்கப்பட்டிருப்பதைக் காட்டுகிறது; ‘சொந்தமான’ என்பது அந்தப் புனித உரிமையைத் தெளிவாகக் கூறுகிறது.
- source_word: טֻמְאָתוֹ עָלָיו
  choice: தன் தீட்டு தன்மேல் இருக்கும்போது
  rationale: ‘அவனுடைய தீட்டு அவன்மேல்’ என்ற எபிரெய உருவகத்தையும் சடங்குசார் சட்டப் பொருளையும் இயல்பான தமிழில் காக்கிறது.
- source_word: וְנִכְרְתָה
  choice: அறுத்துப்போடப்பட வேண்டும்
  rationale: כרת என்ற வினையின் ‘துண்டித்தல்/அறுத்தல்’ உருவகத்தைப் பாதுகாக்கிறது; தண்டனையின் துல்லியமான நடைமுறையைத் தீர்மானிக்காமல் கடுமையான நீக்கத்தைக் குறிக்கிறது.
- source_word: מֵעַמֶּיהָ
  choice: தம் மக்களிடமிருந்து
  rationale: נֶפֶשׁ இலக்கணப் பெண்பாலாக இருப்பதால் வந்த பின்னொட்டு உயிரியல் பாலைக் குறிக்கவில்லை. ‘தம்’ என்பது நவீனத் தமிழில் பாலினம் குறிப்பிடாத மரியாதையான ஒருமைச் சுட்டாக இயல்பாக அமைகிறது.
theological_decisions:
- issue: וְנִכְרְתָה ... מֵעַמֶּיהָ என்ற தண்டனை வாய்பாட்டின் பொருள்
  choice: தம் மக்களிடமிருந்து அறுத்துப்போடப்பட வேண்டும்
  alternative: தம் மக்களிடமிருந்து விலக்கப்பட வேண்டும்; அல்லது இறக்க வேண்டும்/கொல்லப்பட வேண்டும்
  rationale: எபிரெய வாய்பாடு உடன்படிக்கைச் சமூகத்திலிருந்து கடுமையாக அகற்றப்படுவதைக் குறிக்கிறது; ஆனால் இங்கு அது வெளியேற்றமா அல்லது மரணமா என்பதை உரை குறிப்பிடவில்லை. எனவே முதன்மை உரை மூல உருவகத்தையும் பொருள் மயக்கத்தையும் காக்கிறது; சாத்தியமான விளக்கங்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீன, கண்ணியமான, பொதுவாகப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. சடங்குசார் ‘தீட்டு’ மற்றும் பலிவகைப் பெயரான ‘சமாதானப் பலி’ துல்லியத்திற்காகத் தக்கவைக்கப்பட்டுள்ளன. பாலினம் குறிப்பிடாத ‘தம்’ மூலம் சட்டம் பொதுவான நபருக்குப் பொருந்துவது வெளிப்படுத்தப்பட்டுள்ளது.
