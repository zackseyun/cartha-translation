base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/036.yaml
  text: which Yahweh commanded to be given to them from the sons of Israel on the day he anointed them—an everlasting statute throughout their generations[a][b].
translation:
  language: ta
  text: யாவே அவர்களை அபிஷேகம் செய்த நாளில், இஸ்ரவேல் மக்களிடமிருந்து[a] அவர்களுக்குக் கொடுக்கும்படி கட்டளையிட்ட இந்தப் பங்கு, அவர்களுடைய தலைமுறைகள்தோறும் நிலைத்திருக்கும் விதிமுறையாகும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்படியாக, ‘இஸ்ரவேலின் மகன்களிடமிருந்து.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘நிரந்தரச் சட்டம்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: பங்கு இதுவே
  rationale: இது முந்தைய வசனத்தில் கூறப்பட்ட ஆசாரியர்களுக்குரிய பங்குகளைச் சுட்டும் தொடர்புச்சொல். தனி வசனமாகத் தமிழில் இயல்பாகவும் தெளிவாகவும் அமைய, முன்வரும் பொருள் வெளிப்படுத்தப்பட்டது.
- source_word: צִוָּה
  choice: கட்டளையிட்ட
  rationale: இறைவனின் அதிகாரமுள்ள சட்டக் கட்டளையைத் தெளிவாகக் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெயத் தெய்வீகப் பெயரான יהוה என்பதை ஒரு பட்டப்பெயரால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: לָתֵת לָהֶם
  choice: அவர்களுக்குக் கொடுக்கப்பட வேண்டும்
  rationale: எபிரெயத்தில் சொற்படியாக ‘அவர்களுக்குக் கொடுக்க’ என்றாலும், கட்டளையின் நோக்கத்தையும் பெறுநர்களையும் தமிழில் தெளிவாகச் சொல்ல செயப்பாட்டு வடிவம் பயன்படுத்தப்பட்டது.
- source_word: בְּיוֹם מָשְׁחוֹ אֹתָם
  choice: அவர்களை அபிஷேகம் செய்த நாளில்
  rationale: משׁח என்பதன் குறிப்பான ‘அபிஷேகம் செய்’ என்ற பொருளைக் காக்கிறது; மூன்றாம் ஆண்பால் ஒருமை வினைமுற்றின் எழுவாய் யாவே என்பது சூழலால் விளங்குகிறது.
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மக்களிடமிருந்து
  rationale: ‘இஸ்ரவேலின் மகன்கள்’ என்ற சொற்படியான வடிவத்தின் சமூகமுழுதையும் குறிக்கும் பொருளை நவீனத் தமிழில் பாலினத்தைத் தேவையின்றிக் குறுக்காமல் வழங்குகிறது.
- source_word: חֻקַּת עוֹלָם
  choice: நிரந்தரச் சட்டம்
  rationale: ஆசாரியச் சட்டச் சூழலின் சட்டபூர்வ வலிமையையும் தொடரும் இயல்பையும் காக்கிறது; עוֹלָם என்பதற்கு தத்துவார்த்தமான முடிவிலாமையை வற்புறுத்தவில்லை.
- source_word: לְדֹרֹתָם
  choice: தலைமுறைதோறும் கடைப்பிடிக்க வேண்டிய
  rationale: அடுத்தடுத்த தலைமுறைகளில் தொடர்ந்து பொருந்தும் கடமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் வரும் உடன்படிக்கைப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்த்து, அதன் தனிப்பெயர் இயல்பைக் காக்கிறது.
- issue: עוֹלָם என்பதன் சட்டச் சூழலிலான வலிமை
  choice: நிரந்தரச் சட்டம்
  alternative: என்றென்றைக்கும் உரிய சட்டம் / இடையறாத சட்டம்
  rationale: இஸ்ரவேலின் தலைமுறைகளில் தொடரும் சட்டபூர்வக் கடமையைப் பாதுகாக்கிறது; பிற்காலத் தத்துவ அல்லது சமய முடிவுகளை வசனத்திற்குள் புகுத்துவதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; சட்ட மற்றும் வழிபாட்டு மரியாதைத் தொனி காக்கப்பட்டது. ‘அபிஷேகம்’ என்பது இச்சூழலில் பரவலாகப் புரிந்துகொள்ளப்படும் குறிப்பான வழிபாட்டுச் சொல். முந்தைய வசனத்தைச் சார்ந்த אֲשֶׁר தொடர்புத் தொடரை தனி வசன வாசிப்பில் தெளிவாக்க ‘பங்கு இதுவே’ சேர்க்கப்பட்டது.
