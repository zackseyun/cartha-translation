base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/018.yaml
  text: But if any of the flesh of his peace offering is eaten on the third day[a], it will not be accepted; it will not be credited to the one who offers it. It will be an abhorrent thing[b], and the person who eats from it will bear his guilt.
translation:
  language: ta
  text: ஆனால் மூன்றாம் நாளில் அவனுடைய சமாதானப் பலியின் இறைச்சியில் ஏதேனும் உண்ணப்பட்டால், அது ஏற்றுக்கொள்ளப்படாது; அதைப் பலியிடுகிறவனுடைய கணக்கில் அது சேர்க்கப்படாது. அது அருவருப்பான ஒன்றாகும்[a]; அதிலிருந்து உண்கிறவர் தமது குற்றத்தைச் சுமப்பார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அருவருப்பான ஒன்று” என்பது பலியொன்று ஏற்கத்தகாததாகவும் வெறுக்கத்தக்கதாகவும் ஆகிவிட்ட நிலையைக் குறிக்கும் எபிரேய பலிசார் தொழில்நுட்பச் சொல்; “கெட்டுப்போன பலியிறைச்சி” அல்லது “வெறுக்கத்தக்கது” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: ஆனால் ... உண்ணப்பட்டால்
  rationale: முந்தைய விதிக்கு மாறான நிபந்தனையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הֵאָכֹל יֵאָכֵל מִבְּשַׂר
  choice: இறைச்சியில் ஏதாவது ... உண்ணப்பட்டால்
  rationale: מִן என்பதன் பகுதியைக் குறிக்கும் பொருளை ‘ஏதாவது’ வெளிப்படுத்துகிறது; வினைச்சொல் அமைப்பின் வலியுறுத்தலைத் தமிழில் செயற்கையாக இரட்டிக்காமல் நிபந்தனையின் உறுதியால் உணர்த்துகிறது.
- source_word: זֶבַח שְׁלָמָיו
  choice: அவனுடைய சமாதானப் பலி
  rationale: குறிப்பிட்ட பலிவகையைக் குறிக்கிறது; שְׁלָמִים என்பதிலுள்ள சமாதானம்/நலமுழுமை சார்ந்த பொருளையும் பாரம்பரிய அடையாளத்தையும் காக்கிறது.
- source_word: לֹא יֵרָצֶה
  choice: அது ஏற்றுக்கொள்ளப்படாது
  rationale: பலிசார் சூழலில் தேவனால் ஏற்கப்படுதல் என்ற பொருளைச் சுருக்கமாகவும் தெளிவாகவும் தருகிறது.
- source_word: לֹא יֵחָשֵׁב לוֹ
  choice: அவனுடைய கணக்கில் அது சேர்க்கப்படாது
  rationale: חשב + ל என்பதிலுள்ள கணக்கிடுதல் அல்லது ஒருவருக்குச் சேர்த்துக் கருதுதல் என்ற நுணுக்கத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: פִּגּוּל
  choice: அருவருப்பான ஒன்று
  rationale: ஏற்கத்தகாததாகி வெறுக்கத்தக்கதான பலியைச் சுட்டும் அரிய தொழில்நுட்பச் சொல்லின் மதிப்பீட்டுப் பொருளை வெளிப்படுத்துகிறது; அதன் சிறப்புப் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: וְהַנֶּפֶשׁ הָאֹכֶלֶת מִמֶּנּוּ
  choice: அதிலிருந்து உண்கிறவர்
  rationale: נפש என்பதை உடலிலிருந்து வேறான ‘ஆத்துமா’ என்று அல்லாமல் சட்டவழக்கில் தனிநபரைக் குறிக்கும் சொல்லாக மொழிபெயர்க்கிறது.
- source_word: עֲוֺנָהּ תִּשָּׂא
  choice: தமது குற்றத்தைச் சுமப்பார்
  rationale: குற்றத்தையும் அதனால் வரும் பொறுப்பையும் சுமத்தலைக் குறிக்கும் எபிரேய மரபுத்தொடரின் திட்டமிட்ட இருபொருள் நுணுக்கத்தைத் தக்கவைக்கிறது.
theological_decisions:
- issue: זֶבַח שְׁלָמִים என்ற பலிவகையின் பெயர்
  choice: சமாதானப் பலி
  alternative: ஐக்கியப் பலி; நல்வாழ்வுப் பலி
  rationale: ‘சமாதானப் பலி’ என்பது சுருக்கமானதும் அடையாளம் காணத்தக்கதும்; மூலச்சொல்லின் சமாதானம்/முழுநலம் சார்ந்த பொருளுக்கு அண்மையானதும் ஆகும். மற்ற மொழிபெயர்ப்புகள் அதன் ஐக்கிய அல்லது நல்வாழ்வு அம்சங்களை வலியுறுத்துகின்றன.
- issue: עֲוֺנָהּ תִּשָּׂא என்பதில் குற்றமா தண்டனையா
  choice: தமது குற்றத்தைச் சுமப்பார்
  alternative: தமது குற்றத்திற்கான தண்டனையைச் சுமப்பார்
  rationale: மூலமொழி குற்றத்தையும் அதற்கான தண்டனைப் பொறுப்பையும் உள்ளடக்கக்கூடும். முதன்மை உரையில் ‘குற்றம்’ என வைத்திருப்பது அந்தத் தெய்வவியல் மற்றும் சட்டவழக்குத் திணறலை முன்கூட்டியே தீர்க்காமல் காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தரத் தமிழ்; சட்ட மற்றும் பலிசார் கண்ணியமான நடை. ‘தமது’ என்பது பாலினத்தைத் திணிக்காமல் ஒருமை நபரைக் குறிக்கிறது. எல்லா அடிக்குறிப்பு குறியீடுகளும் உரையில் இணைக்கப்பட்டுள்ளன.
