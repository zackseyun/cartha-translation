base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/029.yaml
  text: 'Speak to the sons of Israel[b][a], saying: The one who presents his peace sacrifice to Yahweh shall bring his offering to Yahweh from his peace sacrifice.'
translation:
  language: ta
  text: '“இஸ்ரவேலின் மகன்களிடம்[a] சொல்: ‘ஆண்டவருக்குத் தன் சமாதானப் பலியை[b] சமர்ப்பிக்கிறவன், தன் சமாதானப் பலியிலிருந்து ஆண்டவருக்கான தன் காணிக்கையைக் கொண்டுவர வேண்டும்.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்ரவேல் மக்கள்” அல்லது “இஸ்ரவேலர்.” எபிரேயத்தில் சொல்லுக்கு சொல், “இஸ்ரவேலின் மகன்கள்.”
    reason: lexical_alternative
  - marker: b
    text: பாரம்பரியமாக “சமாதானப் பலி”; “நல்வாழ்வுப் பலி” அல்லது “உறவுப் பலி” என்றும் மொழிபெயர்க்கலாம். இங்குள்ள எபிரேயத் தொழில்நுட்பச் சொல் பன்மை வடிவில் உள்ளது.
    reason: lexical_alternative
