theological_decisions:
- issue: יהוה என்பதன் மொழிபெயர்ப்பு
  choice: ஆண்டவர்
  alternative: யாவே
  rationale: தெய்வீக உடன்படிக்கைப் பெயரை மரியாதை மரபின்படி ‘ஆண்டவர்’ என வழங்குகிறது; தனிப்பெயரின் ஒலிபெயர்ப்பை முதன்மை உரையில் கட்டாயப்படுத்தவில்லை.
- issue: שְׁלָמִים பலிவகையின் பெயர்
  choice: சமாதானப் பலி
  alternative: நல்வாழ்வுப் பலி; உறவுறவுப் பலி
  rationale: שׁלם வேருடன் உள்ள சமாதானம்/முழுநலம் சார்ந்த தொடர்பையும் זֶבַח என்பதன் வெளிப்படையான பலிப்பொருளையும் பேணுகிறது; ‘உறவுறவுப் பலி’ என்பது சாத்தியமானாலும் அதிக விளக்கவுரையாகும்.
- issue: உடன்படிக்கை மக்களுக்கான ஆண்பால் அழைப்பு
  choice: இஸ்ரவேலின் மகன்கள்
  alternative: இஸ்ரவேல் மக்கள்; இஸ்ரவேலர்
  rationale: மூலத்தின் வெளிப்படையான ஆண்பால் பன்மையை முதன்மை உரையில் பேணுகிறது; அதன் கூட்டுப்பொருள் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டவழிபாட்டுப் பகுதியுக்கேற்ற கண்ணியமான நேரடி நடை பயன்படுத்தப்பட்டுள்ளது. ‘வேண்டும்’ கட்டளையின் கடமைப்பொருளைக் காட்டுகிறது; ‘சமர்ப்பிக்கிறவன்’ மற்றும் ‘கொண்டுவர வேண்டும்’ என்பவை மூலத்தில் வரும் வேறுபட்ட வினைச்செயல்களைத் தனித்தனியாகப் பேணுகின்றன.
