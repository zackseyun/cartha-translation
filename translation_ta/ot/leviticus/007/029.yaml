- source_word: יָבִיא
  choice: கொண்டுவர வேண்டும்
  rationale: சட்டப்பகுதியில் இந்த வினை கொண்டுள்ள கடமை/கட்டளைப் பொருளை நவீன தமிழில் தெளிவாகத் தெரிவிக்கிறது.
- source_word: קָרְבָּנוֹ
  choice: தன் காணிக்கை
