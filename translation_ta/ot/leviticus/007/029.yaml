- source_word: הַמַּקְרִיב
  choice: சமர்ப்பிக்கிறவன்
  rationale: קרב என்பதன் ஹிஃபில் வடிவம் பலியை இறைவனிடம் கொண்டுவந்து முன்வைப்பதைக் குறிக்கிறது; ‘சமர்ப்பிக்கிறவன்’ என்பது அந்த வழிபாட்டுச் செயலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: זֶבַח שְׁלָמָיו
  choice: தன் சமாதானப் பலி
  rationale: זֶבַח என்பதன் ‘பலி’ என்ற பொருளையும் שְׁלָמִים என்பதிலுள்ள சமாதானம்/நலன் சார்ந்த கருத்தையும் சுருக்கமாகப் பேணுகிறது. தொழில்நுட்பப் பெயரின் எபிரேய வடிவம் பன்மையாக இருந்தாலும், இங்கு ஒரே பலியைச் சுட்டும் தமிழ்ச் சொற்றொடர் இயல்பானது.
- source_word: לַיהוָה
  choice: ஆண்டவருக்கு
