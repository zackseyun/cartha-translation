base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/023.yaml
  text: 'Speak to the sons of Israel[a], saying: You shall not eat any fat of an ox, a sheep, or a goat.'
translation:
  language: ta
  text: '“இஸ்ரவேல் மக்களிடம்[a] பேசிச் சொல்: மாடு, செம்மறியாடு, வெள்ளாடு ஆகியவற்றின் கொழுப்பு எதையும் நீங்கள் உண்ணக் கூடாது.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேய மொழியில் சொல்லுக்குச் சொல், “இஸ்ரவேலின் மகன்கள்”; இங்கு அது இஸ்ரவேல் மக்களை ஒட்டுமொத்தமாகக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר ... לֵאמֹר
  choice: பேசிச் சொல்
  rationale: எபிரேய சட்ட உரைகளில் வரும் கட்டளை மற்றும் உரை அறிமுகச் சூத்திரத்தின் இரு கூறுகளையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: சொல்லுக்குச் சொல் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு உடன்படிக்கை மக்களை ஒட்டுமொத்தமாகக் குறிக்கிறது; ‘இஸ்ரவேல் மக்கள்’ என்பது நவீன தமிழில் இயல்பாகவும் உள்ளடங்கிய பொருளுக்கு உண்மையாகவும் உள்ளது. நேரடி வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: כָּל חֵלֶב
  choice: கொழுப்பு எதையும்
  rationale: தடையுடன் வரும் כָּל என்பதன் முழுமையான பரப்பை ‘எதையும்’ தெளிவாக வெளிப்படுத்துகிறது; חֵלֶב பலியிடும் சூழலில் குறிப்பாக ஒதுக்கப்பட்ட கொழுப்புப் பகுதிகளைக் குறிக்கக்கூடியபோதும், இவ்வசனத்தில் பொதுவான ‘கொழுப்பு’ என்பதே பொருத்தமானது.
- source_word: שׁוֹר
  choice: மாடு
  rationale: பசுவின வகையைப் பொதுவாகக் குறிக்கிறது; ‘எருது’ அல்லது ‘காளை’ என மொழிபெயர்ப்பது மூலத்தில் இங்கு தேவைப்படாத பாலின அல்லது பயன்பாட்டு குறிப்பைச் சேர்க்கும்.
- source_word: כֶשֶׂב
  choice: செம்மறியாடு
  rationale: ஆட்டுமந்தையில் உள்ள sheep வகையைத் தமிழில் வெள்ளாட்டிலிருந்து தெளிவாக வேறுபடுத்தும் இயல்பான பொதுப்பெயர்.
- source_word: עֵז
  choice: வெள்ளாடு
  rationale: Goat வகைக்கான வழக்கமான தமிழ்ப் பெயர்; இலக்கணப் பெண்பாலை உயிரியல் பெண்பாலாக மிகைப்படுத்தாமல் பொதுவாக மொழிபெயர்க்கிறது.
- source_word: לֹא תֹאכֵלוּ
  choice: நீங்கள் உண்ணக் கூடாது
  rationale: பன்மை இரண்டாம் நபருக்கான சட்டத் தடையை நவீன, கண்ணியமான தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
