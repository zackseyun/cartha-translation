  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/022.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ta
  text: யாவே மோசேயிடம் இவ்வாறு கூறினார்:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில்: “YHWH”; மரபாக “கர்த்தர்” என்று மொழிபெயர்க்கப்படுகிறது.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பேசி
  rationale: דבר என்பதன் ‘பேசினார்’ என்ற பொருளைப் பாதுகாக்கிறது; அடுத்த வசனத்தில் தொடரும் நேரடிப் பேச்சுடன் இயல்பாக இணைவதற்காகத் தமிழ் வினையெச்ச வடிவம் பயன்படுத்தப்பட்டது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: எபிரெயத் திருப்பெயரான YHWH-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட பெயர்வடிவில் தருகிறது.
- source_word: אֶל
  choice: -இடம்
  rationale: பேச்சு யாரை நோக்கிச் சொல்லப்பட்டது என்பதைக் குறிக்கும் எபிரெய முன்னிடைச்சொல்லுக்கு இயல்பான தமிழ்ச் சொல்லுருபு.
- source_word: מֹשֶׁה
  choice: மோசே
  rationale: மֹשֶׁה என்ற ஆள்பெயரின் நிலைபெற்ற தமிழாக்கம்.
- source_word: לֵאמֹר
  choice: '[தொடரும் உரையால் வெளிப்படுத்தப்பட்டது]'
  rationale: ‘சொல்லி/இவ்வாறு’ என்ற அறிமுகச் சூத்திரத்தின் பணி அடுத்த வசனத்தில் தொடங்கும் உரையால் தமிழில் தெளிவாகிறது; ‘பேசி, சொல்லியதாவது’ என்ற தேவையற்ற இரட்டிப்பைத் தவிர்க்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட இறைப்பெயர் நேரடியாக உள்ளது. ஆகவே ‘கர்த்தர்’ என்ற பட்டப்பெயரால் மாற்றாமல் பெயராகவே வழங்கப்பட்டது; உச்சரிப்பு முழுமையாக உறுதியற்றதால் மாற்றுவடிவம் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் சுருக்கமான, கண்ணியமான சட்டவுரை அறிமுகம். அடுத்த வசனத்தில் உரை தொடர்வதால் வாக்கியம் தமிழ் வினையெச்சத்துடன் திறந்த நிலையில் வைக்கப்பட்டுள்ளது.
