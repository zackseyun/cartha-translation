  yaml_path: translation/ot/leviticus/007/004.yaml
  text: and the two kidneys[a], and the fat that is on them, which is on the loins, and the appendage on the liver, which he shall remove with the kidneys.
translation:
  language: ta
  text: இரண்டு சிறுநீரகங்களையும், அவற்றின்மேல் இடுப்புப் பகுதியில் இருக்கும் கொழுப்பையும், கல்லீரலின்மேல் இருக்கும் நீட்சிப் பகுதியையும்[a], சிறுநீரகங்களோடு சேர்த்து, அவன் அகற்ற வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கல்லீரலின் மடல்.” இந்த உடற்கூற்றுப் பகுதிக்கான எபிரெயச் சொல் ஒரு தொழில்நுட்பச் சொல்; அது துல்லியமாக எதைக் குறிக்கிறது என்பது விவாதத்திற்குரியது.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: இரண்டு சிறுநீரகங்கள்
  rationale: பலியிடும் விலங்கின் உடற்கூறியலில் இச்சொல் தெளிவாகச் சிறுநீரகங்களைக் குறிக்கிறது; நவீனத் தமிழில் இதுவே இயல்பான, துல்லியமான சொல்.
- source_word: הַחֵלֶב
  choice: கொழுப்பு
  rationale: லேவியராகமத்தின் பலிச் சூழலில் பலிக்கென ஒதுக்கப்படும் கொழுப்புப் பகுதிகளை இது குறிக்கிறது; ‘கொழுப்பு’ என்பது பொதுவாசகருக்குத் தெளிவான சொல்.
- source_word: אֲשֶׁר עֲלֵיהֶן
  choice: அவற்றின்மேல் இருக்கும்
  rationale: עַל என்பதன் நேரடியான இடப்பொருளைப் பேணுகிறது; ‘அவற்றை மூடியிருக்கும்’ என்று உரையில் இல்லாத விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: הַכְּסָלִים
  choice: இடுப்புப் பகுதி
  rationale: சிறுநீரகங்களுக்கு அருகிலுள்ள இடுப்பு அல்லது பக்கவாட்டுப் பகுதியை இச்சொல் குறிக்கிறது; நவீனத் தமிழில் ‘இடுப்புப் பகுதி’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: הַיֹּתֶרֶת
  choice: இணைப்புப் பகுதி
  rationale: இது பலிச் சட்டங்களில் வரும் தொழில்நுட்ப உடற்கூற்றுச் சொல்; துல்லியமாக எந்த உறுப்புப் பகுதியைக் குறிக்கிறது என்பது விவாதத்திற்குரியதால், அளவுக்கு மீறிய உடற்கூற்றுத் துல்லியத்தைத் தவிர்க்கும் வகையில் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: עַל הַכָּבֵד
  choice: கல்லீரலின்மேல் இருக்கும்
  rationale: עַל என்பதன் அடிப்படைப் பொருளான ‘மேல்’ என்பதைப் பேணுகிறது; ‘கல்லீரலுடன் ஒட்டியுள்ள’ என்ற விளக்கத்தைத் தேவையின்றி சேர்க்கவில்லை.
- source_word: עַל הַכְּלָיֹת
  choice: சிறுநீரகங்களோடு சேர்த்து
  rationale: இப்பலிச் செய்முறைச் சூழலில் கல்லீரல் பகுதி சிறுநீரகங்களுடன் அகற்றப்படுவதைக் குறிக்கும் தொடர்பை இயல்பான தமிழில் தெரிவிக்கிறது; எபிரெயச் சொல்லின் இடப்பொருள் சாத்தியத்தை முற்றிலும் மிகைப்படுத்தாமல் செயல்முறைப் பொருளைப் பேணுகிறது.
- source_word: יְסִירֶנָּה
  choice: அவன் அகற்ற வேண்டும்
  rationale: הפעיל வடிவம் பலிச் செய்முறையில் அந்தப் பகுதியைப் பிரித்து அகற்றும் கட்டளையைக் குறிக்கிறது; ‘வேண்டும்’ சட்டவிதியின் கட்டாயத் தன்மையை நவீனத் தமிழில் இயல்பாகத் தருகிறது.
