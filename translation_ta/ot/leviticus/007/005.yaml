source:
  edition: WLC
  text: וְ/הִקְטִ֨יר אֹתָ֤/ם הַ/כֹּהֵן֙ הַ/מִּזְבֵּ֔חָ/ה אִשֶּׁ֖ה לַ/יהוָ֑ה אָשָׁ֖ם הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/005.yaml
  text: The priest shall burn them on the altar as a food offering to Yahweh[b][a]; it is a guilt offering.
translation:
  language: ta
  text: ஆசாரியன் அவற்றைப் பலிபீடத்தின்மேல் யாவேக்கு நெருப்புப் பலியாக[a] எரித்துப் புகையெழச் செய்ய வேண்டும்; அது குற்றப்பலி[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நெருப்பினால் செலுத்தப்படும் பலி’ என்றும் மொழிபெயர்க்கலாம். எபிரேயச் சொல் நெருப்பின் மூலம் செலுத்தப்படும் பலியைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘குற்றநிவாரணப் பலி’ அல்லது ‘ஈடுசெய்யும் பலி’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְטִיר
  choice: எரித்துப் புகையெழச் செய்ய வேண்டும்
  rationale: கִטר் என்பதன் ஹிப்ஈல் வடிவம் பலியிடும் சூழலில், பலிபீடத்தில் எரித்து புகையாக மேலெழச் செய்வதைக் குறிக்கிறது. தமிழில் செயலும் அதன் பலியியல் நுணுக்கமும் இரண்டும் தெளிவாகத் தெரிவதற்காக இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: אֹתָם
  choice: அவற்றை
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட பலியின் கொழுப்புப் பகுதிகளைச் சுட்டும் பன்மை நேரடி வேற்றுமைப் பெயர்ப்பதிலி.
- source_word: הַכֹּהֵן
  choice: ஆசாரியன்
  rationale: பலியியல் சட்டங்களில் வரும் definite singular noun; நவீனத் தமிழில் வழக்கமான வேதாகமப் பதம்.
- source_word: הַמִּזְבֵּחָה
  choice: பலிபீடத்தின்மேல்
  rationale: எபிரேய திசைச்சுட்டு வடிவத்தைச் சொற்படியாக ‘பலிபீடத்துக்கு’ என மொழிபெயர்க்கலாம்; ஆனால் பலியின் பகுதிகள் அங்கே எரிக்கப்படுவதைக் காட்ட ‘பலிபீடத்தின்மேல்’ என்பது இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: אִשֶּׁה
  choice: நெருப்புப் பலி
  rationale: நெருப்பின் மூலம் செலுத்தப்படும் பலிக்கான தொழில்நுட்ப பலியியல் சொல். ‘உணவுப் படையல்’ என்பது சாத்தியமான சூழல்சார் விளக்கம் என்றாலும், இந்தச் சொல்லில் வெளிப்படையாக உள்ள நெருப்பு சார்ந்த கருத்தை ‘நெருப்புப் பலி’ நேரடியாகப் பாதுகாக்கிறது.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: לְ என்ற முன்னொட்டு அர்ப்பணிப்பின் இலக்கைச் சுட்டுகிறது; יהוה என்ற உடன்படிக்கைப் பெயர் பட்டப்பெயராக மாற்றப்படாமல் ‘யாவே’ என ஒலிபெயர்க்கப்படுகிறது.
- source_word: אָשָׁם
  choice: குற்றப்பலி
  rationale: லேவியராகமத்தில் இது ஒரு குறிப்பிட்ட பலிவகைக்கான தொழில்நுட்பச் சொல். ‘குற்றப்பலி’ சுருக்கமாகவும் புரிந்துகொள்ளத்தக்கதாகவும் இருந்து, குற்றம் மற்றும் அதற்கான ஈடுசெய்தல் ஆகிய தொடர்புடைய அர்த்தங்களை விளக்கக் குறிப்புக்கு திறந்தவையாக வைக்கிறது.
- source_word: הוּא
  choice: அது
  rationale: முன்னர் கூறப்பட்ட பலியை ஒரு வகையாக அடையாளப்படுத்தும் எபிரேயப் பெயர்ச்சொல் வாக்கியத்தை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் நான்கெழுத்து இறைப்பெயர் நேரடியாக வருகிறது. உடன்படிக்கைப் பெயரின் தனித்தன்மையைப் பாதுகாக்க ‘யாவே’ என ஒலிபெயர்க்கப்பட்டது.
- issue: אָשָׁם என்ற பலியியல் வகை
  choice: குற்றப்பலி
  alternative: குற்றநிவாரணப் பலி; ஈடுசெய்யும் பலி
  rationale: இது ஒரு முறையான பலிவகையின் பெயர். ‘குற்றப்பலி’ அதன் குற்றம் சார்ந்த மையத்தைக் காக்கிறது; ‘ஈடுசெய்தல்’ என்ற ஒரு அம்சத்தை மட்டும் முதன்மைப்படுத்தி அர்த்தத்தைச் சுருக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான பலியியல் நடையில் அமைக்கப்பட்டது. ‘எரித்துப் புகையெழச் செய்ய’ என்பது மூல வினையின் பலியியல் நுணுக்கத்தைத் தக்கவைக்கிறது; தொழில்நுட்பப் பதங்களின் மாற்று அர்த்தங்கள் அடிக்குறிப்புகளில் தரப்பட்டுள்ளன.
