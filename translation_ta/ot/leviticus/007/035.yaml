reference: Leviticus 7:35
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: זֹ֣את מִשְׁחַ֤ת אַהֲרֹן֙ וּ/מִשְׁחַ֣ת בָּנָ֔י/ו מֵ/אִשֵּׁ֖י יְהוָ֑ה בְּ/יוֹם֙ הִקְרִ֣יב אֹתָ֔/ם לְ/כַהֵ֖ן לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/035.yaml
  text: This is the anointed portion of Aaron and the anointed portion of his sons from the food offerings of Yahweh[b][a], on the day when he presented them to serve as priests to Yahweh.
translation:
  language: ta
  text: யாவேக்குச் செலுத்தப்படும் நெருப்புப் பலிகளிலிருந்து, யாவேக்கு ஆசாரியர்களாகப் பணியாற்றும்படி அவர் அவர்களை முன்நிறுத்திய நாளில், ஆரோனுக்குரிய அபிஷேகப் பங்கும்[a] அவன் மகன்களுக்குரிய அபிஷேகப் பங்கும் இதுவே. [b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அபிஷேகப் பங்கு” என்பதற்கு “அபிஷேகத்தோடு தொடர்புடைய ஒதுக்கப்பட்ட பங்கு” என்றும் பொருள் கொள்ளலாம். எபிரெயச் சொல் அபிஷேகத்துடன் தொடர்புடையது; இச்சூழலில் அது ஆசாரியர்களுக்குரிய பங்கைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் சொற்சொல்லாக, “யாவேயின் நெருப்பினால் செலுத்தப்படும் பலிகள்.” சில மொழிபெயர்ப்புகள் “உணவுக் காணிக்கைகள்” என்று வழங்குகின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁחַת
  choice: அபிஷேகப் பங்கு
  rationale: இந்தச் சொல் அபிஷேகத்துடன் சொற்பிறப்பியல் தொடர்புடையது; இச்சூழலில் ஆசாரியத் திருநிலைப்படுத்தலோடு தொடர்புடைய ஒதுக்கப்பட்ட பங்கைக் குறிக்கிறது. ‘அபிஷேகப் பங்கு’ இரு கூறுகளையும் காக்கிறது.
- source_word: מִשְׁחַת אַהֲרֹן וּמִשְׁחַת בָּנָיו
  choice: ஆரோனுக்கும் அவன் மகன்களுக்கும் உரிய அபிஷேகப் பங்கு
  rationale: எபிரெயத்தில் பெயர்ச்சொல் இருமுறை வந்தாலும், இயல்பான தமிழில் ஒரே பெயர்ச்சொல்லின் கீழ் இரு பெறுநர்களும் தெளிவாகக் குறிப்பிடப்படுகின்றனர்.
- source_word: מֵאִשֵּׁי יְהוָה
  choice: யாவேக்குச் செலுத்தப்படும் நெருப்புப் பலிகளிலிருந்து
  rationale: אִשֶּׁה என்பது நெருப்பில் செலுத்தப்படும் பலி அல்லது காணிக்கையைக் குறிக்கும். ‘நெருப்புப் பலிகள்’ பாரம்பரியப் பொருளைத் தெளிவாகக் காக்கிறது; ‘-இலிருந்து’ மூலத்தின் உறவையும் தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருப்பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: בְּיוֹם
  choice: நாளில்
  rationale: குறிப்பிட்ட நிகழ்வு நடந்த காலத்தை இயல்பான தமிழில் குறிக்கிறது.
- source_word: הִקְרִיב אֹתָם
  choice: அவர் அவர்களை முன்நிறுத்திய
  rationale: קרב என்பதன் ஹிஃபில் வடிவம் ‘அருகில் கொண்டுவருதல்/முன்நிறுத்துதல்’ என்பதைக் குறிக்கிறது. மனிதர்கள் இங்கு இலக்காக இருப்பதால் ‘பலியிட்டார்’ என்ற தவறான எண்ணத்தைத் தவிர்க்கிறது.
- source_word: לְכַהֵן לַיהוָה
  choice: யாவேக்கு ஆசாரியர்களாகப் பணியாற்றும்படி
  rationale: כהן என்ற வினையின் ஆசாரியப் பணிச் சார்ந்த பொருளையும், לַיהוָה என்பதிலுள்ள யாவேக்கான சேவை உறவையும் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ஆசாரியச் சட்டத்தில் מִשְׁחַת என்பதன் பொருள்
  choice: அபிஷேகத்துடன் தொடர்புடைய ஒதுக்கப்பட்ட பங்கு
  alternative: வெறும் ‘அபிஷேகம்’ அல்லது ‘பங்கு’
  rationale: உடனடியான சூழல் யாவேக்குச் செலுத்தப்படும் பலிகளிலிருந்து ஆசாரியர்களுக்குக் கிடைக்கும் உரிமைப் பங்கைப் பற்றியது. அதேவேளை, சொல்லின் அபிஷேகத் தொடர்பை முற்றிலும் நீக்காமல் ‘அபிஷேகப் பங்கு’ என்று மொழிபெயர்க்கப்படுகிறது.
- issue: הִקְרִיב என்பதன் செய்பவர்
  choice: ‘அவர்’ என்று மூலத்தின் ஒருமை ஆண்பால் வினையெழுவாயைத் திறந்தவாறே வைத்தல்
  alternative: மோசே என்று வெளிப்படையாகச் சேர்த்தல்
  rationale: சூழலில் மோசே எனப் புரிந்துகொள்ள வாய்ப்பிருந்தாலும், இவ்வசனத்தில் பெயர் வெளிப்படையாக இல்லை. ஆகவே மூலத்தின் இலக்கணத் தெளிவின்மையைத் தீர்மானித்து விடாமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆசாரியர்’, ‘அபிஷேகம்’, ‘யாவே’ ஆகிய வேதாகமச் சூழலுக்கு ஏற்ற சொற்கள் தக்கவைக்கப்பட்டுள்ளன; மூலத்தில் வெளிப்படையாக இல்லாத ‘மோசே’ சேர்க்கப்படவில்லை.
