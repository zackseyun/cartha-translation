revisions:
- from: இது ஆரோனுக்கும் அவன் மகன்களுக்கும் உரிய அபிஷேகப் பங்கு[a]. யாவேக்கு ஆசாரியர்களாகப் பணியாற்றும்படி அவர் அவர்களை முன்நிறுத்திய நாளில், யாவேக்குச் செலுத்தப்படும் நெருப்புப் பலிகளிலிருந்து[b] இது அவர்களுக்கு வழங்கப்பட்டது.
  to: யாவேக்குச் செலுத்தப்படும் நெருப்புப் பலிகளிலிருந்து, யாவேக்கு ஆசாரியர்களாகப் பணியாற்றும்படி அவர் அவர்களை முன்நிறுத்திய நாளில், ஆரோனுக்குரிய அபிஷேகப் பங்கும்[a] அவன் மகன்களுக்குரிய அபிஷேகப் பங்கும் இதுவே. [b]
  rationale: The revision removes the unsupported passive “was given,” preserves the repeated Hebrew expression for Aaron’s and his sons’ respective portions, and retains the source’s ambiguity concerning the unnamed singular subject. Footnote b is tightened to describe the traditional lexical sense of אִשֵּׁי while retaining the English audit trail’s “food offerings” alternative.
