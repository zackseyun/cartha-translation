  yaml_path: translation/ot/leviticus/007/031.yaml
  text: The priest shall burn the fat on the altar[a], and the breast shall belong to Aaron and to his sons.
translation:
  language: ta
  text: ஆசாரியன் கொழுப்பைப் பலிபீடத்தின்மேல் எரிக்க வேண்டும்[a]; மார்புப்பகுதி ஆரோனுக்கும் அவன் மகன்களுக்கும் உரியதாக இருக்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கொழுப்பைப் பலிபீடத்தின்மேல் எரித்துப் புகையாக எழும்பச் செய்ய வேண்டும்.’
    reason: וְהִקְטִיר என்ற பலிச் சடங்குச் சொல்லில் எரிப்பதோடு புகையாக மேலெழச் செய்வது என்ற நுண்பொருளும் உள்ளது.
lexical_decisions:
- source_word: וְהִקְטִיר
  choice: எரிக்க வேண்டும்
  rationale: பலிச் சடங்கின் சூழலில் קטר என்பதன் ஹிஃபில் வடிவம், பலிபீடத்தில் எரித்துப் புகையாக எழும்பச் செய்வதைக் குறிக்கிறது. இயல்பான நவீன தமிழில் ‘எரிக்க வேண்டும்’ என்பது செயலைத் தெளிவாகத் தெரிவிக்கிறது; புகை குறித்த நுண்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: הַכֹּהֵן
  choice: ஆசாரியன்
  rationale: லேவியராகமத்தின் பலிச் சடங்குச் சூழலில் כֹּהֵן என்பதற்குரிய வழக்கமான தமிழ் சொல்; எபிரெய ஒருமையும் காக்கப்படுகிறது.
- source_word: הַחֵלֶב
  choice: கொழுப்பு
  rationale: இங்கு חֵלֶב என்பது பலிபீடத்தில் எரிப்பதற்காக ஒதுக்கப்பட்ட விலங்கின் கொழுப்புப் பகுதிகளைக் குறிக்கிறது.
- source_word: הַמִּזְבֵּחָה
  choice: பலிபீடத்தின்மேல்
  rationale: திசையைக் குறிக்கும் வடிவம் சொற்படி ‘பலிபீடத்தை நோக்கி’ எனத் தரப்படலாம்; ஆனால் பலிச் சடங்கில் கொழுப்பு பலிபீடத்தின் மேல் எரிக்கப்படுவதே இயல்பான பொருள்.
- source_word: וְהָיָה
  choice: உரியதாக இருக்கும்
  rationale: சொற்படி ‘இருக்கும்’ என்றாலும், இச்சட்டச் சூழலில் ஒரு பகுதி யாருக்கு ஒதுக்கப்படுகிறது அல்லது சொந்தமாகிறது என்பதை இந்த வடிவம் குறிக்கிறது.
- source_word: הֶחָזֶה
  choice: மார்புப்பகுதி
  rationale: பலிச் சட்டங்களில் חָזֶה என்பது ஆசாரியர்களுக்கு வழங்கப்படும் விலங்கின் குறிப்பிட்ட மார்புப் பகுதியைக் குறிக்கிறது; ‘மார்புப்பகுதி’ என்பது தமிழில் தெளிவாக உள்ளது.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: ஆரோனுக்கும் அவன் மகன்களுக்கும்
  rationale: לְ இங்கு உரிமை அல்லது ஒதுக்கீட்டைக் குறிக்கிறது; தமிழ் வேற்றுமை உருபு அந்த உறவை இயல்பாக வெளிப்படுத்துகிறது.
