base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/003.yaml
  text: 'And from it he shall present all its fat: the fat tail and the fat that covers the entrails[a][b].'
translation:
  language: ta
  text: அதிலிருந்து அதன் கொழுப்பு முழுவதையும் அவன் சமர்ப்பிப்பான்:[a] கொழுப்பு நிறைந்த வாலையும்,[b] உள்ளுறுப்புகளை மூடியிருக்கும் கொழுப்பையும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பலியாகப் படைப்பான்.” எபிரெய வினைச்சொல் பலிக்குரிய ஒரு பகுதியைச் சமர்ப்பிப்பதையோ பலியாகப் படைப்பதையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, செம்மறியாட்டின் கொழுப்பு நிறைந்த வால்; இது பலியாகச் சமர்ப்பிக்கப்பட வேண்டிய ஒரு குறிப்பிட்ட கொழுப்புப் பகுதி.
    reason: cultural_note
lexical_decisions:
- source_word: חֶלְבּוֹ / הַחֵלֶב
  choice: அதன் கொழுப்பு / கொழுப்பு
  rationale: பலிச் சடங்கின் சூழலில் חֵלֶב என்பது படைக்கப்படுவதற்காகக் குறிக்கப்பட்ட கொழுப்புப் பகுதிகளைக் குறிக்கிறது. ‘கொழுப்பு’ என்பது நேரடியான, இயல்பான தமிழ் சொல்.
- source_word: יַקְרִיב
  choice: படைப்பான்
  rationale: קרב என்பதன் ஹிஃபில் வடிவம் பலிச் சட்டங்களில் ஒரு பகுதியைக் கடவுளிடம் சமர்ப்பிப்பதையோ பலியாகப் படைப்பதையோ குறிக்கும். ‘படைப்பான்’ சடங்குசார் பொருளை இயல்பாகத் தருகிறது; ‘சமர்ப்பிப்பான்’ என்பதும் சாத்தியம்.
- source_word: מִמֶּנּוּ
  choice: அதிலிருந்து
  rationale: பின்னொட்டு வழிபடுபவரை அல்ல, சூழலில் உள்ள பலி விலங்கையே இயல்பாகக் குறிக்கிறது.
- source_word: הָאַלְיָה
  choice: கொழுப்பு நிறைந்த வால்
  rationale: אַלְיָה என்பது செம்மறியாட்டின் தனிப்பட்ட கொழுப்பு நிறைந்த வாலைக் குறிக்கிறது; வெறுமனே ‘வால்’ என்பதைவிட இது உடற்கூறு மற்றும் பலிச் சூழலைத் தெளிவாகக் காட்டுகிறது.
- source_word: הַמְכַסֶּה אֶת־הַקֶּרֶב
  choice: குடல்களை மூடியிருக்கும்
  rationale: இங்கு קֶרֶב விலங்கின் உள்ளுறுப்புகள் அல்லது குடற்பகுதியைக் குறிக்கிறது. சாதாரண வாசகருக்குப் புரியக்கூடிய வகையில் ‘குடல்கள்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: כָּל
  choice: முழுவதையும்
  rationale: குறிக்கப்பட்ட கொழுப்புப் பகுதிகள் அனைத்தையும் எடுத்துரைக்கும் முழுமையை இது வெளிப்படுத்துகிறது.
