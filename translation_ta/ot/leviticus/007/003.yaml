revisions:
- from: அதிலிருந்து அதன் கொழுப்பு முழுவதையும் அவன் படைப்பான்:[a] கொழுப்பு நிறைந்த வாலையும்[b] குடல்களை மூடியிருக்கும் கொழுப்பையும் படைப்பான்.
  to: அதிலிருந்து அதன் கொழுப்பு முழுவதையும் அவன் சமர்ப்பிப்பான்:[a] கொழுப்பு நிறைந்த வாலையும்,[b] உள்ளுறுப்புகளை மூடியிருக்கும் கொழுப்பையும்.
  rationale: The revision uses a single governing verb to mirror the Hebrew construction, replaces the overly narrow ‘குடல்கள்’ with ‘உள்ளுறுப்புகள்’, and adopts the clearer modern-standard ritual term ‘சமர்ப்பிப்பான்’. Footnote a preserves the viable sacrificial alternative, and footnote b remains anchored to the fatty-tail expression.
