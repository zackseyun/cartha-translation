id: LEV.7.1
reference: Leviticus 7:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/זֹ֥את תּוֹרַ֖ת הָ/אָשָׁ֑ם קֹ֥דֶשׁ קָֽדָשִׁ֖ים הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/001.yaml
  text: 'This is the law of the guilt offering: it is most holy[a].'
translation:
  language: ta
  text: 'குற்றநிவாரணப் பலிக்கான[a] விதிமுறை இதுவே: அது மகா பரிசுத்தமானது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘குற்றப்பரிகாரப் பலி’ அல்லது ‘ஈட்டுப்பலி’ என்றும் மொழிபெயர்க்கலாம். எபிரேயச் சொல்லான אָשָׁם (ஆஷாம்), குற்றத்துடனும் அதற்கான ஈடு அல்லது நிவாரணத்துடனும் தொடர்புடைய ஒரு பலியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/זֹאת
  choice: இதுவே
  rationale: וְ இங்கு புதிய அறிவுறுத்தலை அறிமுகப்படுத்தும் இணைப்பாக உள்ளது; தமிழில் தேவையற்ற காலச்சுட்டுச் சொல்லைச் சேர்க்காமல், זֹאת என்பதையும் அதன் அறிமுக வலியுறுத்தலையும் இயல்பாக வெளிப்படுத்த ‘இதுவே’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: תּוֹרַת
  choice: விதிமுறை
  rationale: இந்தப் பலியைப் பற்றிய நிர்ணயிக்கப்பட்ட சடங்கு ஒழுங்கை תּוֹרָה குறிக்கிறது. ‘விதிமுறை’ என்பது நவீன தமிழில் தெளிவாகவும் இயல்பாகவும் இருந்து, வெறும் சட்டக் கோட்பாடு என்ற தவறான எண்ணத்தைத் தவிர்க்கிறது.
- source_word: הָ/אָשָׁם
  choice: குற்றநிவாரணப் பலி
  rationale: אָשָׁם என்பது குற்றத்துடனும் அதற்கான ஈடு அல்லது நிவாரணத்துடனும் தொடர்புடைய குறிப்பிட்ட லேவியப் பலிவகை. ‘குற்றநிவாரணப் பலி’ அதன் குற்றப் பரிமாணத்தையும் நிவாரண நோக்கையும் சுருக்கமாகத் தக்கவைக்கிறது.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: மகா பரிசுத்தமானது
  rationale: எபிரேய அடுக்குத்தொடர் மிக உயர்ந்த பரிசுத்த நிலையை உணர்த்துகிறது. ‘மகா பரிசுத்தமானது’ பலிகளின் பரிசுத்த வகைப்பாட்டைத் தெளிவாகக் கூறுகிறது; பரிசுத்த ஸ்தலத்தின் ஓர் அறையைக் குறிக்கும் சொல்லாகத் தவறாகப் புரிந்துகொள்ளப்படுவதையும் தவிர்க்கிறது.
- source_word: הוּא
  choice: அது
  rationale: இந்த ஆண்பால் ஒருமைப் பெயர்ப்பதிலி, முன்கூறிய பலியைச் சுட்டி அதனை ‘மகா பரிசுத்தமானது’ என்று வகைப்படுத்துகிறது; தமிழில் ‘அது’ இயல்பான சுட்டாகும்.
theological_decisions:
- issue: אָשָׁם என்ற பலிச் சொல்லின் மொழிபெயர்ப்பு
  choice: குற்றநிவாரணப் பலி
  alternative: குற்றப்பரிகாரப் பலி; ஈட்டுப்பலி
  rationale: இந்த வசனம் ஒரு குறிப்பிட்ட பலிவகையை வகைப்படுத்துகிறது. ‘குற்றநிவாரணப் பலி’ என்பது குற்றம் மற்றும் நிவாரணம் ஆகிய இரு தொடர்புகளையும் தக்கவைக்கிறது; ‘பரிகாரம்’ என்ற சொல் குறிப்பிட்ட கோட்பாட்டு விளக்கத்தை அதிகமாக உணர்த்தக்கூடும், ‘ஈட்டுப்பலி’ மட்டும் குற்றத்தின் பரிமாணத்தை மறைக்கக்கூடும். மாற்று நுணுக்கங்கள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘பிரமாணம்’ போன்ற பழமையான சொல்லுக்குப் பதிலாக ‘விதிமுறை’ பயன்படுத்தப்பட்டுள்ளது; பலிவகையின் தொழில்நுட்பத் தன்மையும் பரிசுத்த வகைப்பாடும் தக்கவைக்கப்பட்டுள்ளன.
