  terminology: ‘குற்றநிவாரணப் பலி’ is a defensible rendering of אָשָׁם that retains both guilt and remedial/reparative associations without imposing a doctrinal interpretation. ‘விதிமுறை’ appropriately conveys the procedural sense of תּוֹרַת in context. The footnote preserves viable lexical alternatives and is correctly anchored to the sacrificial term.
