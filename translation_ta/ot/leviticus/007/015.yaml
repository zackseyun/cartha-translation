base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/015.yaml
  text: And the flesh of the sacrifice of his thanksgiving peace offering shall be eaten on the day of his offering[b][a]; he shall not leave any of it until morning.
translation:
  language: ta
  text: அவனுடைய நன்றிக்கான சமாதானப் பலியின்[a][b] இறைச்சி, அவன் அதைப் பலியிடும் நாளிலேயே உண்ணப்பட வேண்டும்; அதில் எதையும் காலைவரை அவன் மீதியாக வைக்கக் கூடாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நன்றி செலுத்துவதற்கான அவனுடைய உறவுப் பலி.”
    reason: שְׁלָמִים என்பதற்கு ‘உறவுப் பலி’ என்ற விளக்கமளிக்கும் மாற்று மொழிபெயர்ப்பு உண்டு.
  - marker: b
    text: அல்லது, “நன்றிக்கான அவனுடைய சமாதானப் பலிகளின் பலி.”
    reason: זֶבַח תּוֹדַת שְׁלָמָיו என்ற எபிரெய் தொடரின் அமைப்பை இன்னும் நேரடியாகப் பிரதிபலிக்கும் மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: וּבְשַׂר
  choice: இறைச்சி
  rationale: בשר என்பது இங்கு பலியிடப்பட்ட விலங்கின் உண்ணத்தக்க சதையைக் குறிக்கிறது; நவீன தமிழில் ‘இறைச்சி’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: זֶבַח
  choice: பலி
  rationale: זבח என்பது கொன்று செலுத்தப்படும் விலங்குப் பலியைக் குறிக்கிறது; லேவியராகமத்தின் சடங்கியல் சூழலில் ‘பலி’ தெளிவான நிலையான சொல்.
- source_word: תּוֹדַת
  choice: நன்றிக்கான
  rationale: תודה இங்கு நன்றி செலுத்துவதை அல்லது நன்றிப் பலியைச் சுட்டுகிறது. சமாதானப் பலியின் நோக்கத்தை இயல்பான தமிழில் காட்ட ‘நன்றிக்கான’ என மொழிபெயர்க்கப்பட்டது.
- source_word: שְׁלָמָיו
  choice: அவனுடைய சமாதானப் பலி
  rationale: שלמים ஒரு குறிப்பிட்ட பலிவகையின் பெயர். ‘சமாதானப் பலி’ என்ற நேரடியான சடங்கியல் சொல்லாட்சி, ‘உறவுப் பலி’ போன்ற விளக்கமளிக்கும் மொழிபெயர்ப்பைவிட மூலத்தின் திறந்த பொருளை நன்றாகப் பேணுகிறது. எபிரெயில் பன்மை வடிவம் இவ்வகைப் பலியை வகைப்பெயராகக் குறிக்க முடிவதால் தமிழில் ஒருமை இயல்பாக உள்ளது.
- source_word: בְּיוֹם קָרְבָּנוֹ
  choice: அவன் அதைப் பலியிடும் நாளிலேயே
  rationale: சொற்றொடர் நேரடியாக ‘அவனுடைய பலி/செலுத்துதலின் நாளில்’ எனப் பொருள்படும். தமிழில் செயப்பாட்டு உறவைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்க வினைச்சொல் வடிவம் பயன்படுத்தப்பட்டது; ‘-லேயே’ அதே நாளில் உண்ண வேண்டும் என்ற கால வரம்பை வலியுறுத்துகிறது.
- source_word: יֵאָכֵל
  choice: உண்ணப்பட வேண்டும்
  rationale: நிஃபால் வினை வடிவத்தின் செயப்பாட்டு குரலையும் கட்டளையின் கடமையுணர்வையும் தமிழில் இயல்பாகப் பேணுகிறது.
- source_word: לֹא יַנִּיחַ
  choice: அவன் மீதியாக வைக்கக் கூடாது
  rationale: הניח இங்கு எஞ்சவிடுதல் அல்லது வைத்திருத்தல் என்று பொருள். எபிரெயிலின் ஒருமை எழுவாயான ‘அவன்’ வெளிப்படையாகப் பேணப்பட்டுள்ளது.
- source_word: מִמֶּנּוּ עַד בֹּקֶר
  choice: அதில் எதையும் காலைவரை
  rationale: சொல்லுக்குச் சொல் ‘அதிலிருந்து காலைவரை’ என்பதன் தடைச்சூழல் பொருள், எந்தப் பகுதியும் காலைவரை எஞ்சக்கூடாது என்பதாகும்; தமிழில் ‘அதில் எதையும் காலைவரை’ என்பது தெளிவாக உள்ளது.
theological_decisions:
- issue: שְׁלָמִים என்ற பலிவகையின் மொழிபெயர்ப்பு
  choice: சமாதானப் பலி
  alternative: உறவுப் பலி
  rationale: இது ஒரு குறிப்பிட்ட சடங்கியல் பலிவகையின் பெயர். ‘சமாதானப் பலி’ மூலச்சொல்லுடன் நெருக்கத்தையும் லேவியராகமம் முழுவதுமான சொல் ஒருமைப்பாட்டையும் காக்கிறது; பலியின் இறையியல் நோக்கத்தை மொழிபெயர்ப்பிலேயே தீர்மானிப்பதில்லை.
- issue: זֶבַח תּוֹדַת שְׁלָמָיו என்ற அடர்த்தியான தொடர்
  choice: அவனுடைய நன்றிக்கான சமாதானப் பலி
  alternative: நன்றிக்கான அவனுடைய சமாதானப் பலிகளின் பலி
  rationale: முதன்மை உரை இதை நன்றி செலுத்துவதற்கான சமாதானப் பலி என்ற துணைவகையாக இயல்பாக வெளிப்படுத்துகிறது. எபிரெய் தொடரின் மாற்று கட்டமைப்பு புரிதல்கள் அடிக்குறிப்புகளில் வைக்கப்பட்டுள்ளன; இதனால் தேவையற்ற கோட்பாட்டு முடிவு திணிக்கப்படவில்லை.
