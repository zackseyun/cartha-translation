revisions:
- from: எந்த இரத்தத்தையாவது உண்ணுகிற ஒவ்வொருவரும்[a]—அந்த நபர் தம் மக்களிடமிருந்து அறுப்புண்டுபோவார்[b].
  to: எவ்வகை இரத்தத்தையும் உண்ணும் ஒவ்வொருவரும்[a]—அந்த நபர் தம் மக்களிடமிருந்து அறுப்புண்டு போவார்[b].
  rationale: The revision retains the source’s legal generalization and the ambiguity of the Niphal ‘cut off’ formula. It replaces an awkward expression for ‘any blood,’ aligns the lexical footnote with the audit trail, and makes the formal sanction idiom more readable without interpreting it as execution, exclusion, or divine destruction.
