  text: כָּל נֶ֖פֶשׁ אֲשֶׁר תֹּאכַ֣ל כָּל דָּ֑ם וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מֵֽ/עַמֶּֽי/הָ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/027.yaml
  text: Every person who eats any blood—that person shall be cut off from his people[a][b].
translation:
  language: ta
  text: எவ்வகை இரத்தத்தையும் உண்ணும் ஒவ்வொருவரும்[a]—அந்த நபர் தம் மக்களிடமிருந்து அறுப்புண்டு போவார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஒவ்வோர் ஆத்துமாவும்.’ இங்குள்ள எபிரெய நெஃபெஷ் என்ற சொல் தனிப்பட்ட நபரைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘அறுப்புண்டு போவார்’ என்பது உடன்படிக்கைத் தண்டனையைக் குறிக்கும் வழக்கமான சொற்றொடர். அது சமூகத்திலிருந்து அகற்றப்படுவதையோ தெய்வீகத் தீர்ப்பையோ குறிக்கலாம்; அது எவ்வாறு நிறைவேற்றப்படும் என்பதை எபிரெய வாசகம் இங்கு குறிப்பிடவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: நபர்
  rationale: சட்டச் சூழலில் נֶפֶשׁ என்பது உடலற்ற ‘ஆத்துமா’ என்பதைவிட தனிப்பட்ட மனிதரைக் குறிக்கிறது. நவீனத் தமிழில் ‘நபர்’ இதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: תֹּאכַל
  choice: உண்ணுகிற
  rationale: உறவுப்பெயர் வாக்கியத்திலுள்ள எபிரெய முற்றுப்பெறாத வினை பொதுவாக நிகழக்கூடிய சட்டநிலையைச் சுட்டுகிறது; ‘உண்ணுகிற’ அந்தப் பொதுவிதிப் பொருளை இயல்பாக வழங்குகிறது.
- source_word: כָּל דָּם
  choice: எந்த இரத்தத்தையாவது
  rationale: எண்ணப்படாத பெயருடன் வரும் כָּל இங்கு பகிர்ந்தளிக்கும் பொருளில் ‘எவ்வகை இரத்தமாயினும்’ என்பதைக் குறிக்கிறது; ‘எந்த இரத்தத்தையாவது’ அதைத் தெளிவாகச் சொல்கிறது.
- source_word: וְנִכְרְתָה
  choice: அறுப்புண்டுபோவார்
  rationale: כרת என்பதன் நிபால் வடிவம் உடன்படிக்கை சார்ந்த தண்டனைச் சூத்திரமாக உள்ளது. ‘அறுப்புண்டுபோவார்’ மூல உருவகத்தையும் தண்டனையின் சரியான நடைமுறை குறிப்பிடப்படாத நிலையையும் காக்கிறது.
- source_word: הַנֶּפֶשׁ הַהִוא
  choice: அந்த நபர்
  rationale: பெயர்ச்சொல்லின் மறுபயன்பாடும் சுட்டுப்பெயரும் குற்றம் செய்தவரை வலியுறுத்தி மீண்டும் சுட்டுகின்றன; ‘அந்த நபர்’ இதைப் பாதுகாக்கிறது.
- source_word: מֵעַמֶּיהָ
  choice: தம் மக்களிடமிருந்து
  rationale: எபிரெயப் பெண்பால் பின்னொட்டு נֶפֶשׁ என்ற சொல்லின் இலக்கணப் பாலால் வந்தது; விதி பெண்களுக்கு மட்டும் அல்ல. ‘தம்’ பாலினப் பொதுமையையும், ‘மக்களிடமிருந்து’ சமூகத்திலிருந்து நீக்கப்படுதல் என்ற உறவையும் தெரிவிக்கிறது.
theological_decisions:
- issue: ‘அறுப்புண்டுபோதல்’ என்ற உடன்படிக்கைத் தண்டனையின் பொருள்
  choice: மரணம், சமூக விலக்கம், அல்லது நேரடியான தெய்வீகத் தீர்ப்பு என்று குறிப்பாக்காமல் ‘அறுப்புண்டுபோவார்’ என மூல உருவகத்தைத் தக்கவைத்தல்.
  alternative: ‘கொல்லப்படுவார்’, ‘சமூகத்திலிருந்து விலக்கப்படுவார்’, அல்லது ‘கடவுளால் அழிக்கப்படுவார்’ என்று பொருளைத் தீர்மானித்தல்.
  rationale: எபிரெயச் சூத்திரம் சுருக்கமாக உள்ளது; தண்டனை நிறைவேறும் முறையை இவ்வசனம் குறிப்பிடவில்லை. ஆகவே விவாதிக்கப்படும் இறையியல் அல்லது சட்ட விளக்கங்களில் ஒன்றை மொழிபெயர்ப்பே தேர்ந்தெடுக்கக் கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான சட்டநடை பயன்படுத்தப்பட்டுள்ளது. ‘அறுப்புண்டுபோவார்’ சற்றே மரபுத்தன்மையுடையதாயினும், மூலத்தின் உருவகத்தையும் திட்டமிட்ட தெளிவின்மையையும் காக்கிறது; அதன் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
