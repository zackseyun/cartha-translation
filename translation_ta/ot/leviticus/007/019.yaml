  text: וְ/הַ/בָּשָׂ֞ר אֲשֶׁר יִגַּ֤ע בְּ/כָל טָמֵא֙ לֹ֣א יֵֽאָכֵ֔ל בָּ/אֵ֖שׁ יִשָּׂרֵ֑ף וְ/הַ֨/בָּשָׂ֔ר כָּל טָה֖וֹר יֹאכַ֥ל בָּשָֽׂר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/019.yaml
  text: But the meat that touches anything unclean must not be eaten; it must be burned in the fire. And as for the meat, anyone who is clean may eat meat.
translation:
  language: ta
  text: ஆனால், தீட்டான எதையாவது[a] தொடும் இறைச்சியைச் சாப்பிடக் கூடாது; அதை நெருப்பில் எரிக்க வேண்டும். அந்த இறைச்சியைத் தீட்டில்லாத எவரும் சாப்பிடலாம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தீட்டான எதனுடனாவது தொடர்புகொள்ளும்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொற்றொடர் பரந்த பொருளுடையது; இது சடங்குமுறைத் தீட்டைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַבָּשָׂר
  choice: ஆனால் ... இறைச்சியை
  rationale: בָּשָׂר இங்கு பலியிடப்பட்ட மாமிசத்தைக் குறிக்கிறது; நவீன தமிழில் உணவுச் சூழலுக்கு இயல்பான ‘இறைச்சி’ பயன்படுத்தப்பட்டது. தொடக்க வாவ் சூழலிலுள்ள முரண்பாட்டைக் காட்ட ‘ஆனால்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: אֲשֶׁר יִגַּע בְּכָל טָמֵא
  choice: தீட்டான எதையாவது தொடும்
  rationale: יִגַּע நேரடியான தொடர்பைக் குறிக்கிறது. כָּל טָמֵא என்பதன் பரந்த சடங்குசார் பொருளை அளவுக்கு மீறிக் குறிப்பாக்காமல் ‘தீட்டான எதையாவது’ என வழங்குகிறது.
- source_word: לֹא יֵאָכֵל
  choice: சாப்பிடக் கூடாது
  rationale: நிபால் வடிவிலுள்ள தடை நவீன தமிழில் தெளிவான சட்டப்பாங்குடன் இயல்பாக வெளிப்படுகிறது.
- source_word: בָּאֵשׁ יִשָּׂרֵף
  choice: அதை நெருப்பில் எரிக்க வேண்டும்
  rationale: தீட்டுப்பட்ட பலியிறைச்சியை அழிக்க வேண்டிய கட்டாயத்தைத் தெளிவாகவும் மூலத்தின் நெருப்பு உருவகத்தைப் பேணியும் வழங்குகிறது.
- source_word: וְהַבָּשָׂר
  choice: மற்ற இறைச்சியையோ
  rationale: மீண்டும் வரும் பெயர்ச்சொல் தீட்டுப்பட்ட இறைச்சியிலிருந்து உண்ணத்தக்க இறைச்சிக்கான மாறுபாட்டைக் குறிக்கிறது; தமிழில் ‘மற்ற ... -யோ’ அந்த எதிர்மறை ஒப்புமையை இயல்பாகக் காட்டுகிறது.
- source_word: כָּל טָהוֹר
  choice: தீட்டில்லாத எவரும்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் பெயரடை, சடங்குமுறைப்படி தீட்டில்லாத நபர்கள் அனைவரையும் உள்ளடக்குகிறது.
- source_word: יֹאכַל בָּשָׂר
  choice: சாப்பிடலாம்
  rationale: இது கட்டளையைவிட அனுமதியைத் தெரிவிக்கிறது. பொருளாகிய இறைச்சி முன்னரே குறிப்பிடப்பட்டதால் தமிழில் அதை மீண்டும் கூறாமல் இருப்பது இயல்பானது.
theological_decisions:
- issue: טָמֵא / טָהוֹר என்பவற்றின் சடங்குசார் நிலை
  choice: ‘தீட்டான’ / ‘தீட்டில்லாத’ என்று சடங்குமுறை நிலையைக் குறிக்கும் வகையில் மொழிபெயர்த்தல்
  alternative: ‘அசுத்தமான’ / ‘சுத்தமான’ அல்லது ‘தூய்மையற்ற’ / ‘தூய்மையான’
  rationale: லேவியராகமத்தின் பலிச்சட்டங்களில் இச்சொற்கள் முதன்மையாகச் சடங்குமுறை நிலையைக் குறிக்கின்றன; ஒழுக்கக்கேடு அல்லது பாவநிலையைத் தாமாகவே குறிக்கவில்லை. ‘தீட்டு’ என்ற சொல் இந்த வேறுபாட்டைத் தமிழில் தெளிவாகப் பேணுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் சட்டப்பகுதிக்கேற்ற கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘சாப்பிடக் கூடாது / எரிக்க வேண்டும் / சாப்பிடலாம்’ என்ற அமைப்பு தடை, கட்டாயம், அனுமதி ஆகியவற்றை வேறுபடுத்துகிறது. அடிக்குறிப்பு குறியீடு வசன முடிவில் இடப்பட்டுள்ளது.
