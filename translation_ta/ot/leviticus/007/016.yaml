base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/016.yaml
  text: But if the sacrifice of his offering is a vow or a freewill offering[a], it shall be eaten on the day he presents his sacrifice, and on the next day what remains of it may be eaten.
translation:
  language: ta
  text: ஆனால், அவனுடைய காணிக்கையாகிய பலி ஒரு நேர்ச்சைப் பலியாகவோ தன்னார்வக் காணிக்கையாகவோ இருந்தால்[a], அவன் தன் பலியைச் செலுத்தும் நாளில் அது உண்ணப்பட வேண்டும்; மறுநாளில் அதில் மீதமுள்ளதை உண்ணலாம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நேர்ச்சைப் பலி’ என்பதற்கு மாற்றாக, ‘நேர்ச்சை’ என்றும் மொழிபெயர்க்கலாம். எபிரெயம், ஒரு நேர்ச்சையுடன் தொடர்புடைய பலியையும் மனமுவந்து செலுத்தப்படும் தன்னார்வக் காணிக்கையையும் வேறுபடுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶדֶר
  choice: நேர்ச்சைப் பலி
  rationale: இச்சூழலில் இந்தச் சொல் ஒரு நேர்ச்சையையோ அதை நிறைவேற்றுவதற்காகச் செலுத்தப்படும் பலியையோ குறிக்கிறது. ‘நேர்ச்சைப் பலி’ என்பது அடுத்துள்ள தன்னார்வக் காணிக்கையிலிருந்து இந்த வகையைத் தெளிவாக வேறுபடுத்துகிறது.
- source_word: נְדָבָה
  choice: தன்னார்வக் காணிக்கை
  rationale: கட்டாயத்தால் அல்லாமல் மனமுவந்து செலுத்தப்படும் காணிக்கையை இது குறிக்கிறது; நவீனத் தமிழில் ‘தன்னார்வக் காணிக்கை’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: זֶבַח קָרְבָּנוֹ
  choice: அவனுடைய காணிக்கையாகிய பலி
  rationale: זֶבַח என்பதன் ‘பலி’ என்ற பொருளையும் קָרְבָּן என்பதன் ‘காணிக்கை’ என்ற பொருளையும் ஒன்றாகத் தக்கவைத்து, தமிழில் புரியக்கூடிய உறவாக அமைக்கிறது.
- source_word: בְּיוֹם הַקְרִיבוֹ
  choice: அவன் தன் பலியைச் செலுத்தும் நாளில்
  rationale: קרב என்பதன் இச்சடங்கியல் பயன்பாடு பலியைக் கொண்டுவந்து சமர்ப்பிப்பதைக் குறிக்கிறது; ‘செலுத்தும்’ என்பது தமிழில் பலி அல்லது காணிக்கையுடன் இயல்பாகப் பயன்படுகிறது.
- source_word: יֵאָכֵל
  choice: அது உண்ணப்பட வேண்டும்
  rationale: முதல் பயன்பாட்டில் சட்டரீதியான கட்டளையின் தொனியைத் தக்கவைக்கச் செயப்பாட்டு வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: וּמִמָּחֳרָת
  choice: மறுநாளில்
  rationale: அடுத்த நாளைக் குறிக்கும் எளிய, இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: וְהַנּוֹתָר מִמֶּנּוּ
  choice: அதில் மீதியானதையும்
  rationale: பலியில் உண்ணப்படாமல் எஞ்சிய பகுதியைச் சுருக்கமாகவும் தெளிவாகவும் குறிக்கிறது.
- source_word: יֵאָכֵל
  choice: உண்ணலாம்
  rationale: அதே எபிரெய வடிவம் மீண்டும் வந்தாலும், இங்கு மறுநாளில் மீதியை உண்பதற்கான அனுமதியே சூழலின் மையம்; அதனால் தமிழில் அனுமதிப் பொருள் வெளிப்படையாகக் கொடுக்கப்பட்டுள்ளது.
