  terminology: ‘காணிக்கையாகிய பலி,’ ‘நேர்ச்சைப் பலி,’ and ‘தன்னார்வக் காணிக்கை’ appropriately preserve the sacrificial/register distinctions. The footnote accurately explains the lexical distinction without imposing an interpretation.
