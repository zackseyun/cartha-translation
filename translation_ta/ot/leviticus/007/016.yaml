translation_notes:
  register: நவீனத் தரத் தமிழில், சடங்கியல் சட்டத்தின் கண்ணியமான தொனியைத் தக்கவைத்துள்ளோம். முதல் יֵאָכֵל கட்டளையாகவும், இரண்டாவது அதே வடிவம் சூழலுக்கேற்ப அனுமதியாகவும் மொழிபெயர்க்கப்பட்டுள்ளது.
