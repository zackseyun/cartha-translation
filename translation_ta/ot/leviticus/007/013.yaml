revisions:
- from: புளிப்பூட்டப்பட்ட அப்பங்களோடு, நன்றிசெலுத்தும் தன் சமாதானப் பலியுடன்[a] அவன் தன் காணிக்கையைச் செலுத்த வேண்டும்.
  to: புளிப்பூட்டப்பட்ட அப்பங்களோடு, தன் சமாதானப் பலிகளின் நன்றிப் பலியுடன் அவன் தன் காணிக்கையைச் செலுத்த வேண்டும்.
  rationale: The revision preserves the source’s construct relationship by rendering the offering as a thanksgiving sacrifice associated with his peace offerings, rather than treating thanksgiving only as a descriptive modifier. The footnote is retained and adjusted to match the plural main-text term.
