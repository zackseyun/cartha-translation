reference: Leviticus 7:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: עַל חַלֹּת֙ לֶ֣חֶם חָמֵ֔ץ יַקְרִ֖יב קָרְבָּנ֑/וֹ עַל זֶ֖בַח תּוֹדַ֥ת שְׁלָמָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/013.yaml
  text: Along with cakes of leavened bread[a], he shall present his offering with the sacrifice of his peace offerings of thanksgiving.
translation:
  language: ta
  text: புளிப்பூட்டப்பட்ட அப்பங்களோடு, தன் சமாதானப் பலிகளின் நன்றிப் பலியுடன் அவன் தன் காணிக்கையைச் செலுத்த வேண்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַל
  choice: …ஓடு / …உடன்
  rationale: இவ்வசனத்தில் עַל இடத்தைக் குறிக்காமல், ஒன்றுடன் மற்றொன்றும் சேர்த்துச் செலுத்தப்படுவதைக் குறிக்கிறது.
- source_word: חַלֹּת לֶחֶם
  choice: அப்பங்கள்
  rationale: חַלּוֹת என்பது இங்கு பலிக்குரிய அப்பங்களைக் குறிக்கிறது; இயல்பான நவீனத் தமிழில் ‘அப்பங்கள்’ தெளிவாக உள்ளது.
- source_word: חָמֵץ
  choice: புளிப்பூட்டப்பட்ட
  rationale: புளிப்பில்லாத உணவுப் பொருட்களிலிருந்து வேறுபடுத்தும் சடங்கியல் பொருளை இது துல்லியமாக வெளிப்படுத்துகிறது.
- source_word: יַקְרִיב
  choice: செலுத்த வேண்டும்
  rationale: பலியிடும் சூழலில் ஹிஃபில் வினை காணிக்கையை இறைவனிடம் கொண்டுவந்து படைப்பதைக் குறிக்கிறது; ‘செலுத்த வேண்டும்’ என்பது கட்டளைத் தன்மையையும் இயல்பான தமிழையும் காக்கிறது.
- source_word: קָרְבָּנוֹ
  choice: தன் காணிக்கை
  rationale: קָרְבָּן என்பது இறைவனிடம் கொண்டுவரப்படும் பொதுவகைக் காணிக்கையைக் குறிக்கிறது.
- source_word: זֶבַח
  choice: பலி
  rationale: பலியிடுவதற்காக அறுக்கப்படும் சடங்கியல் காணிக்கைக்கான இயல்பான, நிலைபெற்ற தமிழ் சொல்.
- source_word: תּוֹדַת
  choice: நன்றிசெலுத்தும்
  rationale: தொடரமைப்பில் இந்தப் பலியின் நன்றியறிதல் தன்மையை இது சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: שְׁלָמָיו
  choice: தன் சமாதானப் பலி
  rationale: שְׁלָמִים என்ற தொழில்நுட்பப் பலிச்சொல்லின் சமாதானம்/முழுமை சார்ந்த சொற்பொருள் தொடர்பைக் காக்கிறது; எபிரெய வடிவம் இலக்கணப் பன்மையாக இருந்தாலும், பலிவகைப் பெயராகத் தமிழில் ஒருமை இயல்பாக உள்ளது.
theological_decisions:
- issue: שְׁלָמִים என்ற பலிவகைப் பெயரின் மொழிபெயர்ப்பு
  choice: சமாதானப் பலி
  alternative: நல்லுறவுப் பலி; நலவாழ்வுப் பலி
  rationale: இந்த எபிரெயச் சொல் சமாதானம், முழுமை, பகிரப்பட்ட உறவு ஆகிய பொருள் நிழல்களைக் கொண்ட பலிவகையைக் குறிக்கிறது. முதன்மை உரையில் நிலைபெற்ற ‘சமாதானப் பலி’ வைக்கப்பட்டு, பிற நியாயமான புரிதல்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் வகையில் இயல்பாகவும், லேவியராகமத்தின் சடங்கியல் மொழிக்கேற்ற கண்ணியத்துடனும் அமைக்கப்பட்டுள்ளது.
