revisions:
- from: ஏனெனில், ஆண்டவருக்குத் தீயில் செலுத்தப்படும் காணிக்கை[a] எந்த மிருகத்திலிருந்து படைக்கப்படுகிறதோ, அந்த மிருகத்தின் கொழுப்பைச் சாப்பிடுகிற எவரும் தம் மக்களிடமிருந்து அறுப்புண்டுபோவார்[b].
  to: ஏனெனில், யெகோவாவுக்குத் தீயில் செலுத்தப்படும் காணிக்கையை[a] எந்தக் கால்நடையிலிருந்து செலுத்துகிறார்களோ, அந்தக் கால்நடையின் கொழுப்பை உண்கிற எவரும் தம் மக்களிடமிருந்து அறுத்து நீக்கப்படுவார்[b].
  rationale: திருத்தம் யெகோவா திருநாமத்தைத் தக்கவைத்து, பலிக்குத் தகுந்த கால்நடையையும் காணிக்கையைச் செலுத்தும் செயலையும் தெளிவாகக் காட்டுகிறது. தண்டனைக்கான எபிரெய உருவகம் ‘அறுத்து நீக்கப்படுவார்’ என வழங்கப்பட்டு, அதன் நடைமுறை விளைவை உரையிலேயே தீர்மானிக்காமல் அடிக்குறிப்பில் விவாதத்திற்குரியதாக விடுகிறது. அடிக்குறிப்பு அடையாளங்கள் தத்தம் சொல்/சூத்திரங்களோடு சரியாக இணைக்கப்பட்டுள்ளன.
