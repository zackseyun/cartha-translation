  text: כִּ֚י כָּל אֹכֵ֣ל חֵ֔לֶב מִן הַ֨/בְּהֵמָ֔ה אֲשֶׁ֨ר יַקְרִ֥יב מִמֶּ֛/נָּה אִשֶּׁ֖ה לַ/יהוָ֑ה וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הָ/אֹכֶ֖לֶת מֵֽ/עַמֶּֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/025.yaml
  text: For anyone who eats fat from an animal from which an offering made by fire is presented to Yahweh[b][a], the person who eats it shall be cut off from his people.
translation:
  language: ta
  text: ஏனெனில், யெகோவாவுக்குத் தீயில் செலுத்தப்படும் காணிக்கையை[a] எந்தக் கால்நடையிலிருந்து செலுத்துகிறார்களோ, அந்தக் கால்நடையின் கொழுப்பை உண்கிற எவரும் தம் மக்களிடமிருந்து அறுத்து நீக்கப்படுவார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உணவுக் காணிக்கை.” இங்கு வரும் எபிரெயச் சொல் பலிபீட நெருப்பில் எரிக்கப்பட்டு புகையாக எழுப்பப்படும் காணிக்கையைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “அறுத்து நீக்கப்படுவார்” என்பது எபிரெயச் சட்டச் சூத்திரத்தின் உருவகத்தைப் பாதுகாக்கிறது. இதன் துல்லியமான தண்டனை சமூகத்திலிருந்து விலக்கப்படுதல், மரணம், அல்லது இறைத் தீர்ப்பு ஆகியவற்றில் எதைக் குறிக்கிறது என்பது விவாதத்திற்குரியது.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய தடைக்கான காரணத்தை அறிமுகப்படுத்துவதால், உரையோட்டத்தை இயல்பாக இணைக்கிறது.
- source_word: כָּל אֹכֵל
  choice: சாப்பிடுகிற எவரும்
  rationale: குறிப்பிடப்படாத அனைவருக்கும் பொருந்தும் பொதுவிதியை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: חֵלֶב
  choice: கொழுப்பு
  rationale: பலிச் சட்டங்களில் ஒதுக்கப்பட்ட மிருகக் கொழுப்புப் பகுதிகளைக் குறிக்கும் எளிய, நேரடியான சொல்.
- source_word: מִן הַבְּהֵמָה
  choice: எந்த மிருகத்திலிருந்து
  rationale: பலியாகச் செலுத்தத்தக்க கால்நடையைச் சூழலுக்கேற்ற பொதுச்சொல்லால் குறிக்கிறது.
- source_word: אֲשֶׁר יַקְרִיב מִמֶּנָּה
  choice: படைக்கப்படுகிறதோ
  rationale: எபிரெய செய்பாட்டு ஒருமையின் குறிப்பிடப்படாத செய்பவரைத் தமிழில் இயல்பான செயப்பாட்டால் வெளிப்படுத்துகிறது.
- source_word: אִשֶּׁה
  choice: தீயில் செலுத்தப்படும் காணிக்கை
  rationale: பலிபீட நெருப்பில் எரிக்கப்பட்டு புகையாக எழுப்பப்படும் காணிக்கையை விளக்கமாகக் குறிக்கிறது; உணவுக் காணிக்கை என மட்டும் குறுக்கவில்லை.
- source_word: לַיהוָה
  choice: ஆண்டவருக்கு
  rationale: திருநாமத்தை மரியாதைமிக்க, வழக்கமான தமிழ் வேதாகம நடையில் வழங்குகிறது.
- source_word: וְנִכְרְתָה
  choice: அறுப்புண்டுபோவார்
  rationale: உடன்படிக்கைச் சட்டத்தின் 'வெட்டுண்டு நீக்கப்படுதல்' என்ற உருவகத்தையும் அதன் திட்டமிட்ட தெளிவின்மையையும் காக்கிறது.
- source_word: הַנֶּפֶשׁ הָאֹכֶלֶת
  choice: சாப்பிடுகிற எவரும்
  rationale: נֶפֶשׁ இங்கு உயிர் அல்லது ஆன்மா என்பதைவிட சட்டத்திற்குட்பட்ட நபரைக் குறிக்கிறது.
- source_word: מֵעַמֶּיהָ
  choice: தம் மக்களிடமிருந்து
  rationale: பெண்பால் இலக்கண ஒத்திசைவை குற்றவாளியின் இயற்கைப் பாலாகப் புரியாமல், பொதுவான ஒருமை நபரைக் கண்ணியமாகக் குறிக்கிறது.
theological_decisions:
- issue: וְנִכְרְתָה ... מֵעַמֶּיהָ என்ற உடன்படிக்கைத் தண்டனைச் சூத்திரம்
  choice: தம் மக்களிடமிருந்து அறுப்புண்டுபோவார்
  alternative: தம் மக்களிடமிருந்து விலக்கப்படுவார்; கொல்லப்படுவார்
  rationale: இந்தத் தண்டனை சமூக விலக்கல், மரணம், அல்லது இறைத் தீர்ப்பு ஆகியவற்றில் எதைத் துல்லியமாகக் குறிக்கிறது என்பது விவாதத்திற்குரியது. மொழிபெயர்ப்பு மூலத்தின் உருவகத்தையும் இறையியல் பதற்றத்தையும் தீர்மானிக்காமல் காக்கிறது.
- issue: சட்ட மொழியில் குற்றவாளியின் பாலினம்
  choice: எவரும் ... தம் மக்கள்
  alternative: அவன் ... அவன் மக்கள்; அவள் ... அவள் மக்கள்
  rationale: נֶפֶשׁ என்பதுடன் இணைந்த பின்னொட்டு இலக்கணரீதியாகப் பெண்பாலில் இருந்தாலும், விதி எந்த நபருக்கும் பொதுவானது; தமிழ் தற்சுட்டுப் பெயர் தேவையற்ற பாலினக் குறிப்பைத் தவிர்த்து ஒருமை உணர்வைக் காக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், சட்ட உரைக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘படைக்கப்படுகிறதோ’ மற்றும் ‘அறுப்புண்டுபோவார்’ ஆகியவை வேதாகமத் தொனியைக் காக்கின்றன; அடிக்குறிப்புகள் அரிதான பலிச்சொல் மற்றும் திட்டமிட்டு விடப்பட்ட தண்டனைத் தெளிவின்மையை விளக்குகின்றன.
