  source_fidelity: திருத்தம் தேவை. מִן־הַבְּהֵמָה என்பது பலிக்குத் தகுந்த வீட்டுக் கால்நடையைக் குறிக்கும் சூழலில் உள்ளது; ‘கால்நடை’ என்பது ‘மிருகம்’ என்பதைக் காட்டிலும் துல்லியமானது. மேலும், லֶיהוָה என்ற தனிப்பட்ட திருநாமத்தை ‘ஆண்டவர்’ எனப் பொதுப்படுத்தாமல் ‘யெகோவா’ எனக் கொடுப்பது பெயரின் வேறுபாட்டைக் காக்கிறது. வினைச்சொல் தொடரும் தண்டனைச் சூத்திரமும் இயல்பாகவும் மூலத்தின் தெளிவின்மையைப் பாதுகாக்குமாறும் திருத்தப்பட்டுள்ளது.
  naturalness: ‘படைக்கப்படுகிறதோ’ இச்சூழலில் இயல்பான பலிச்சொல் அல்ல; ‘செலுத்துகிறார்களோ’ தெளிவான நவீனத் தமிழாகும். ‘அறுப்புண்டுபோவார்’ புரிந்துகொள்ளத்தக்கதாக இருந்தாலும் இயல்பற்றது; ‘அறுத்து நீக்கப்படுவார்’ சட்டச் சூத்திரத்தின் உருவகத்தையும் சட்டநடையையும் காக்கிறது.
  terminology: ‘தீயில் செலுத்தப்படும் காணிக்கை’ אִשֶּׁה-க்கான விளக்கமான மொழிபெயர்ப்பாகத் தக்கது. ‘யெகோவா’ யெகோவா திருநாமத்தைத் தெளிவாகக் காட்டுகிறது. ‘அறுத்து நீக்கப்படுவார்’ என்பது כרת என்ற தண்டனைச் சூத்திரத்தை மரணம் அல்லது சமூக விலக்கம் என்று முன்கூட்டியே தீர்மானிக்காமல் வழங்குகிறது.
