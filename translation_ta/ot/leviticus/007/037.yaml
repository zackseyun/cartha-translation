    rationale: “குருத்துவ” denotes priesthood as an institution or state, whereas the Hebrew plural refers to priestly installation/ordination rites. “ஆசாரியர் நியமனச் சடங்குகள்” is both more precise and more idiomatic in modern standard Tamil.
