base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/037.yaml
  text: This is the law for the burnt offering[a], the grain offering, the sin offering, the guilt offering, the ordination offering[d][c][b], and the sacrifice of peace offerings.
translation:
  language: ta
  text: தகனப் பலி, தானியப் பலி, பாவநிவாரணப் பலி[a], குற்றநிவாரணப் பலி[b], ஆசாரியர் நியமனச் சடங்குகள்[c], சமாதானப் பலி[d] ஆகியவற்றைக் குறித்த சட்டம் இதுவே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தூய்மைப்படுத்தும் பலி’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் பாவத்தைக் கையாளுவதோடு தீட்டை அகற்றுவதையும் வலியுறுத்தக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: ‘ஈடுசெய்யும் பலி’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் குற்றப்பொறுப்பையும் தேவைப்படும் ஈடுசெய்தலையும் வலியுறுத்தக்கூடும்.
    reason: lexical_alternative
  - marker: c
    text: எபிரெய மொழியில் இச்சொல் பன்மையில் உள்ளது; இது ஆசாரியர்களைப் பணியில் நியமிக்கும் சடங்குகளையோ, அவற்றுடன் தொடர்புடைய பலியையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: d
    text: ‘உறவுறவுப் பலி’ அல்லது ‘நல்வாழ்வுப் பலி’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் சமாதானம், பகிர்ந்துறவு, முழுநலம் ஆகிய நுணுக்கங்களை உடையது.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת הַתּוֹרָה
  choice: சட்டம் இதுவே
  rationale: இது பலிவகைகளை ஒழுங்குபடுத்தும் விதிமுறையைச் சுட்டுகிறது. ‘போதனை’ என்பதும் சாத்தியம்; இச்சட்டச் சூழலில் ‘சட்டம்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: לָעֹלָה
  choice: தகனபலி
  rationale: עֹלָה முழுவதும் எரித்துச் செலுத்தப்படும் பலியைக் குறிக்கிறது; ‘தகனபலி’ அதன் தன்மையைச் சுருக்கமாகக் காட்டுகிறது.
- source_word: לַמִּנְחָה
  choice: தானியபலி
  rationale: லேவியராகமத்தின் பலிச்சூழலில் מִנְחָה தானியத்தால் செலுத்தப்படும் காணிக்கையைக் குறிக்கிறது.
- source_word: וְלַחַטָּאת
  choice: பாவநிவாரணப் பலி
  rationale: חַטָּאת பாவத்தைக் கையாளும் பலியையும், சில சூழல்களில் தீட்டுநீக்கத்தையும் குறிக்கலாம். பரிச்சயமான பொருளைத் தக்கவைத்து ‘நிவாரணம்’ என்ற சொல் அதன் செயற்பாட்டை வெளிப்படுத்துகிறது.
- source_word: וְלָאָשָׁם
  choice: குற்றநிவாரணப் பலி
  rationale: אָשָׁם குற்றப்பொறுப்பு மற்றும் அதற்குரிய நிவர்த்தி அல்லது ஈடு ஆகிய நுணுக்கங்களை உடையது.
- source_word: וְלַמִּלּוּאִים
  choice: குருத்துவ அர்ப்பணிப்புச் சடங்குகள்
  rationale: מִלּוּאִים பன்மையில் இருந்து, குருக்களைப் பணியில் நிறுவும் அர்ப்பணிப்பு நடைமுறைகளைக் குறிக்கிறது; ஒரே ஒரு பலியாக மட்டும் சுருக்காமல் சடங்குகளின் பரப்பைத் தக்கவைக்கிறது.
- source_word: וּלְזֶבַח הַשְּׁלָמִים
  choice: சமாதானப் பலி
  rationale: זֶבַח הַשְּׁלָמִים என்பது சமாதானம், நல்வாழ்வு, உறவுறவு ஆகிய கருத்துகளைத் தாங்கும் பலிவகை. இயல்பான தமிழுக்காகச் சொற்சொல்லான மறுபடிவத்தைத் தவிர்த்து ‘சமாதானப் பலி’ பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: חַטָּאת என்பதன் பாவம்–தூய்மைப்படுத்துதல் சார்ந்த பொருள் பரப்பு
  choice: முதன்மை உரையில் ‘பாவநிவாரணப் பலி’
  alternative: ‘தூய்மைப்படுத்தும் பலி’
  rationale: பாரம்பரியமாக அறியப்பட்ட பாவம் சார்ந்த பொருளை முதன்மை உரை தக்கவைக்கிறது; சடங்குத் தீட்டுநீக்க நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: אָשָׁם என்பதன் குற்றப்பொறுப்பு–ஈடுசெய்தல் சார்ந்த பொருள் பரப்பு
  choice: முதன்மை உரையில் ‘குற்றநிவாரணப் பலி’
  alternative: ‘ஈடுசெய்யும் பலி’
  rationale: குற்றப்பொறுப்பை முதன்மைப்படுத்தியபோதும், ஈடு செலுத்தும் அம்சத்தை அடிக்குறிப்பு வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வழிபாட்டு உரைக்கு ஏற்ற கண்ணியத்துடனும் அமைக்கப்பட்டது. பட்டியல் இயல்பாக ஓடுவதற்காக இறுதியில் ‘ஆகியவற்றைக் குறித்த சட்டம் இதுவே’ என வாக்கியம் கட்டமைக்கப்பட்டது; எபிரெயச் சொல்லின் முக்கிய மாற்றுப் பொருள்கள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
