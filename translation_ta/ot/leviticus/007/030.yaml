source:
  edition: WLC
  text: יָדָ֣י/ו תְּבִיאֶ֔ינָה אֵ֖ת אִשֵּׁ֣י יְהוָ֑ה אֶת הַ/חֵ֤לֶב עַל הֶֽ/חָזֶה֙ יְבִיאֶ֔/נּוּ אֵ֣ת הֶ/חָזֶ֗ה לְ/הָנִ֥יף אֹת֛/וֹ תְּנוּפָ֖ה לִ/פְנֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/030.yaml
  text: 'His own hands shall bring the food offerings of the LORD: he shall bring the fat with the breast, to wave the breast as a wave offering before the LORD.'
translation:
  language: ta
  text: அவனுடைய சொந்தக் கைகளால் யெகோவாவுக்கான நெருப்பில் செலுத்தப்படும் காணிக்கைகளை அவன் கொண்டுவர வேண்டும். கொழுப்புடன் மார்புப் பகுதியையும் அவன் கொண்டுவர வேண்டும்; யெகோவாவின் முன்னிலையில் மார்புப் பகுதியை அசைவாட்டுக் காணிக்கையாக அசைப்பதற்காக.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָדָיו
  choice: அவனுடைய சொந்தக் கைகளே
  rationale: பலியிடுபவன் தானே காணிக்கையைக் கொண்டுவர வேண்டும் என்ற வலியுறுத்தலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אִשֵּׁי יְהוָה
  choice: யெகோவாவுக்குரிய நெருப்புப் பலிகள்
  rationale: אִשֶּׁה என்பது நெருப்பில் செலுத்தப்படும் பலி/காணிக்கையைக் குறிக்கிறது; பொதுவான ‘உணவுக் காணிக்கைகள்’ என்பதைக் காட்டிலும் மூலச்சொல்லின் பலியிடும் சூழலைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: הַחֵלֶב עַל־הֶחָזֶה
  choice: கொழுப்புடன் மார்புப் பகுதியையும்
  rationale: עַל இங்கு பொருட்கள் ஒன்றாகக் கொண்டுவரப்படுவதைச் சுட்டுகிறது; தமிழில் இயல்பாக ‘உடன்’ என வழங்கப்பட்டது.
- source_word: לְהָנִיף אֹתוֹ תְּנוּפָה
  choice: அசைவாட்டும் காணிக்கையாக அசைவாட்டுவதற்காக
  rationale: வினைச்சொல் மற்றும் அதனுடன் தொடர்புடைய பெயர்ச்சொல் ஆகிய இரண்டையும் காத்து, சடங்குச் செயலும் காணிக்கையின் வகையும் வெளிப்படச் செய்கிறது.
- source_word: לִפְנֵי יְהוָה
  choice: யெகோவாவின் முன்னிலையில்
  rationale: இறைநாமத்தையும் ‘முன்னிலையில்’ என்ற இட/வழிபாட்டு உறவையும் நேரடியாகப் பிரதிபலிக்கிறது.
theological_decisions:
- issue: אִשֵּׁי என்பதன் பொருள்
  choice: நெருப்புப் பலிகள்
  alternative: உணவுக் காணிக்கைகள்
  rationale: இச்சொல் யெகோவாவுக்கு நெருப்பில் செலுத்தப்படும் காணிக்கைகளைக் குறிக்கிறது. ‘உணவு’ என்ற உருவகத்தை மட்டும் முன்னிறுத்தாமல் பலிச்சடங்கின் தன்மையைப் பாதுகாக்கிறது.
- issue: יהוה என்ற இறைநாமத்தின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: கர்த்தர்
  rationale: மூலத்தில் உள்ள தனிப்பட்ட இறைநாமத்தைப் பட்டப்பெயராக மாற்றாமல் தமிழில் பரவலாக அறியப்பட்ட வடிவில் வழங்குகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; லேவியராகமத்தின் சடங்கு மொழிக்கேற்ற கண்ணியமான நடை. ‘மார்புப் பகுதி’ என்பது உடற்கூற்றைத் தெளிவாகக் குறிக்கிறது; தேவையற்ற விளக்கவுரை சேர்க்கப்படவில்லை.
