- from: ஆசாரியர்களில் ஆண்கள் அனைவரும் அதை உண்ணலாம்[a]. அது ஒரு பரிசுத்தமான இடத்தில் உண்ணப்பட வேண்டும். அது மகா பரிசுத்தமானது[b].
