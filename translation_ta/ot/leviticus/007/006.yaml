  text: Every male among the priests may eat it[a]; it shall be eaten in a holy place[b]. It is most holy.
translation:
  language: ta
  text: ஆசாரியர்களில் உள்ள ஒவ்வொரு ஆணும் அதை உண்ணலாம்[a]. அது ஒரு பரிசுத்தமான இடத்தில் உண்ணப்பட வேண்டும். அது மிகப் பரிசுத்தமானது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆசாரியர்களில் உள்ள ஒவ்வொரு ஆணும் அதை உண்ண வேண்டும்.” எபிரெய வினைவடிவத்தை இவ்வாறு கட்டளையாகவும் மொழிபெயர்க்கலாம்; இச்சூழலில் ஆசாரியக் குழுவைச் சேர்ந்த எந்த ஆணுக்கும் அதை உண்பதற்கான அனுமதி உண்டு என்பதே கருத்து.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “பரிசுத்தங்களின் பரிசுத்தம்”; இது மிக உயர்ந்த பரிசுத்த நிலையைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל זָכָר בַּכֹּהֲנִים
  choice: ஆசாரியர்களில் ஆண்கள் அனைவரும்
  rationale: כָּל என்பது தகுதியுள்ள ஒவ்வொருவரையும் உள்ளடக்கும்; זָכָר வயதுவந்த மனிதன் என்பதைக் காட்டாமல் பாலினத்தைத் துல்லியமாகக் குறிக்கிறது; בַּכֹּהֲנִים ஆசாரியக் குழுவுக்குள் உள்ளவர்களைக் குறிக்கிறது.
- source_word: יֹאכְלֶנּוּ
  choice: அதை உண்ணலாம்
  rationale: இந்தப் பலிச் சட்டச் சூழலில் imperfect வடிவம் அனுமதிக்கப்பட்ட உரிமையை வெளிப்படுத்துகிறது; கட்டாயத்தை மட்டும் உணர்த்தும் ‘உண்ண வேண்டும்’ என்பதைவிட ‘உண்ணலாம்’ பொருத்தமானது.
- source_word: בְּמָקוֹם קָדוֹשׁ
  choice: ஒரு பரிசுத்தமான இடத்தில்
  rationale: ‘இடம்’ என்பதற்கு எபிரெயத்தில் சுட்டுருபு இல்லாததால், குறிப்பிட்ட ஒரே பரிசுத்த இடத்தைக் குறிக்காமல் ‘ஒரு பரிசுத்தமான இடம்’ என்று மொழிபெயர்க்கப்படுகிறது.
- source_word: יֵאָכֵל
  choice: உண்ணப்பட வேண்டும்
  rationale: Niphal செயப்பாட்டு வடிவமும் சட்ட அறிவுறுத்தலும், உண்ணும் இடத்தைப் பற்றிய கட்டாயத்தை இயல்பான தமிழில் தெரிவிக்கின்றன.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: மகா பரிசுத்தமானது
  rationale: சொல்லுக்குச் சொல் ‘பரிசுத்தங்களின் பரிசுத்தம்’ என்ற எபிரெய மரபுத்தொடர் மிக உயர்ந்த பரிசுத்த நிலையைச் சுட்டுகிறது; பலிப்பொருளின் வகைப்பாட்டைத் தெளிவாகக் காட்ட ‘மகா பரிசுத்தமானது’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: הוּא
  choice: அது
  rationale: முந்தைய சூழலில் பேசப்படும் பலிப்பொருளைச் சுட்டும் எளிய ஒருமைச் சுட்டுப்பெயர்.
theological_decisions:
- issue: உண்ணும் உரிமை ஆசாரியர்களில் உள்ள ஆண்களுக்கு வரையறுக்கப்படுதல்
  choice: ஆசாரியர்களில் ஆண்கள் அனைவரும் அதை உண்ணலாம்
  alternative: ஆசாரியர்கள் அனைவரும் அதை உண்ணலாம்
  rationale: எபிரெய மூலத்தில் זָכָר (‘ஆண்’) வெளிப்படையாக இருப்பதால், பாலினக் கட்டுப்பாட்டை பொதுமைப்படுத்தாமல் அப்படியே பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டவிதியின் கண்ணியமான தொனியைப் பேணும் எளிய நடை பயன்படுத்தப்பட்டுள்ளது. ‘உண்ணலாம்’ அனுமதியையும், ‘உண்ணப்பட வேண்டும்’ இடம் குறித்த கட்டாயத்தையும் வேறுபடுத்துகிறது. அனைத்து அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் சேர்க்கப்பட்டுள்ளன.
