source:
  edition: WLC
  text: וְ/נֶ֜פֶשׁ כִּֽי תִגַּ֣ע בְּ/כָל טָמֵ֗א בְּ/טֻמְאַ֤ת אָדָם֙ א֣וֹ בִּ/בְהֵמָ֣ה טְמֵאָ֗ה א֚וֹ בְּ/כָל שֶׁ֣קֶץ טָמֵ֔א וְ/אָכַ֛ל מִ/בְּשַׂר זֶ֥בַח הַ/שְּׁלָמִ֖ים אֲשֶׁ֣ר לַ/יהוָ֑ה וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מֵ/עַמֶּֽי/הָ־־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/021.yaml
  text: And if a person touches anything unclean—whether human uncleanness[a], or an unclean animal, or any unclean detestable thing—and eats some of the flesh of the sacrifice of peace offerings that belongs to Yahweh[b], that person shall be cut off from his people.
translation:
  language: ta
  text: ஒருவர் அசுத்தமான எதையாவது—மனித அசுத்தமாகவோ, அசுத்தமான விலங்காகவோ, அசுத்தமான அருவருப்புக்குரிய எதுவாகவோ—தொட்டு, யாவேவுக்குரிய[a] சமாதானப் பலியின் இறைச்சியைச் சிறிதளவு உண்டால், அந்த நபர் தம் மக்களிடமிருந்து அறுத்து நீக்கப்படுவார்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில் இங்கு கடவுளுடைய தனிப்பெயரான יהוה (YHWH) உள்ளது; பல மொழிபெயர்ப்புகள் இதை ‘ஆண்டவர்’ அல்லது ‘கர்த்தர்’ என்று வழங்குகின்றன.
    reason: divine_name
  - marker: b
    text: ‘அறுத்து நீக்கப்படுவார்’ என்பது உடன்படிக்கைத் தண்டனையைக் குறிக்கும் எபிரெயச் சூத்திரம். அது சமூகத்திலிருந்து விலக்கப்படுவதையா, மரணத்தையா, நேரடியான தெய்வீகத் தீர்ப்பையா குறிக்கிறது என்பதை இவ்வசனம் குறிப்பாகச் சொல்லவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: ஒருவர் / அந்த நபர்
  rationale: சட்டப் பின்னணியில் נֶפֶשׁ என்பது உடலற்ற ‘ஆத்துமா’ என்பதை விட ஒரு தனிநபரைக் குறிக்கிறது. நவீன தமிழில் ‘ஒருவர்’ என்றும் பின்னர் ‘அந்த நபர்’ என்றும் வழங்குவது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: תִגַּע
  choice: தொட்டுவிட்டு
  rationale: נגע என்பதன் அடிப்படைப் பொருளான ‘தொடுதல்’ பாதுகாக்கப்படுகிறது; அடுத்து வரும் உண்பதற்கு முன் நிகழும் சடங்குசார் தொடர்பையும் ‘தொட்டுவிட்டு’ இயல்பாகக் காட்டுகிறது.
- source_word: בְּכָל טָמֵא
  choice: அசுத்தமான எதையாவது
  rationale: எபிரெயச் சொற்றொடரின் விரிவான, வரையறுக்கப்படாத பொருளை இது இயல்பான தமிழில் எடுத்துரைக்கிறது.
- source_word: טֻמְאַת אָדָם
  choice: மனிதரால் ஏற்படும் அசுத்தம்
  rationale: இது ஒரு மனிதருடன் தொடர்புடைய சடங்குசார் அசுத்தத்தைக் குறிக்கிறது. ‘மனித அசுத்தம்’ என்பதைவிட இத்தொடர் சாதாரண வாசகருக்குத் தெளிவாக உள்ளது; அசுத்தத்தின் குறிப்பிட்ட வகையை வசனம் விவரிக்காததால் அதையும் விரிவாக்கவில்லை.
- source_word: בִּבְהֵמָה טְמֵאָה
  choice: அசுத்தமான விலங்கு
  rationale: בְּהֵמָה இங்கு பரந்த பொருளில் விலங்கைக் குறிக்கிறது; ‘விலங்கு’ தெளிவான நவீனத் தமிழ் இணைச்சொல்.
- source_word: שֶׁקֶץ טָמֵא
  choice: அசுத்தமான அருவருப்பான எதுவாகவோ
  rationale: שֶׁקֶץ என்பதில் உள்ள சடங்குசார் அருவருப்பு உணர்வையும், குறிப்பிட்ட உயிரினமாக மட்டும் சுருக்காமல் அதன் பொதுவான தன்மையையும் இவ்வாக்கியம் பாதுகாக்கிறது.
- source_word: וְאָכַל מִבְּשַׂר
  choice: இறைச்சியில் கொஞ்சம் சாப்பிட்டால்
  rationale: מִן என்பதன் பகுதிப்பொருளை ‘கொஞ்சம்’ வெளிப்படுத்துகிறது. பலியுணவின் சூழலில் בשר என்பதற்கு ‘இறைச்சி’ இயல்பான நவீனத் தமிழ்.
- source_word: זֶבַח הַשְּׁלָמִים
  choice: சமாதானப் பலி
  rationale: שלמים என்பதற்கான மரபான பலியியல் பெயரைப் பாதுகாக்கிறது; ‘ஐக்கியப் பலி’ போன்ற விளக்கமளிக்கும் மொழிபெயர்ப்பு மூலத்தின் பொருளை ஒரே விளக்கத்துக்குள் கட்டுப்படுத்தக்கூடும்.
- source_word: אֲשֶׁר לַיהוָה
  choice: யாவேவுக்குரிய
  rationale: לַיהוָה பலி யாவேவுக்குச் சொந்தமானது அல்லது அவருக்கென ஒதுக்கப்பட்டது என்பதைக் குறிக்கிறது; ‘-க்குரிய’ இந்த உறவைச் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: יהוה
  choice: யாவே
  rationale: இது எபிரெய மூலத்திலுள்ள தனிப்பெயரான יהוה என்பதை வாசகருக்குத் தெளிவாகக் காட்டும் ஒலிபெயர்ப்பு; பொதுப்பட்டமான ‘ஆண்டவர்’ என்று மாற்றவில்லை.
- source_word: וְנִכְרְתָה ... מֵעַמֶּיהָ
  choice: தம் மக்களிடமிருந்து அறுத்துப்போடப்பட வேண்டும்
  rationale: כרת என்பதன் வலிமையான உடன்படிக்கைத் தண்டனை உருவகத்தைப் பாதுகாத்து, அது சமூக விலக்கா, மரணமா, அல்லது நேரடியான தெய்வீகத் தீர்ப்பா என்பதைத் தமிழாக்கம் தீர்மானிக்காமல் விடுகிறது. ‘தம்’ என்பது பாலினத்தைத் தனியாகக் குறிப்பிடாமல் நபரின் மக்களைக் குறிக்கிறது.
theological_decisions:
- issue: וְנִכְרְתָה ... מֵעַמֶּיהָ என்ற தண்டனைச் சூத்திரத்தின் சரியான நடைமுறைப் பொருள்
  choice: ‘தம் மக்களிடமிருந்து அறுத்துப்போடப்பட வேண்டும்’ என்ற முறையான உருவகத்தைத் தக்கவைத்தல்
  alternative: ‘தம் மக்களிடமிருந்து விலக்கப்பட வேண்டும்’ அல்லது ‘கொல்லப்பட வேண்டும்’
  rationale: இங்கு எபிரெய உரை தண்டனை எவ்வாறு நிறைவேற்றப்படுகிறது என்று குறிப்பிடவில்லை. சமூக விலக்கு, மரணம், அல்லது தெய்வீகத் தீர்ப்பு என ஒன்றை மட்டும் தேர்ந்தெடுப்பது மூலத்தில் நிலவும் இறையியல் அழுத்தத்தையும் தெளிவின்மையையும் தேவையின்றித் தீர்த்துவிடும்.
- issue: יהוה என்ற இறைப் பெயரின் வெளிப்பாடு
  choice: ‘யாவே’ என்று தனிப்பெயராக வழங்குதல்
  alternative: ‘ஆண்டவர்’ அல்லது ‘கர்த்தர்’
  rationale: மூல உரையில் பொதுப்பட்டம் அல்ல, நான்கு எழுத்துகளைக் கொண்ட இறைப் பெயரே உள்ளது. தனிப்பெயரை வழங்குவது இந்த வேறுபாட்டைப் பாதுகாக்கிறது; அடிக்குறிப்பு மரபான மாற்றீட்டைச் சுட்டுகிறது.
translation_notes:
  register: நடை நவீனத் தரத் தமிழில், சாதாரண வாசகருக்குப் புரியும் வகையிலும் லேவியராகமத்தின் சட்ட மற்றும் பலியியல் கண்ணியத்தைத் தக்கவைக்கும் வகையிலும் அமைக்கப்பட்டுள்ளது. நீண்ட எபிரெயப் பட்டியல் கோடுகளால் பிரிக்கப்பட்டு வாசிப்புத் தெளிவு மேம்படுத்தப்பட்டுள்ளது; சடங்குசார் ‘அசுத்தம்’ என்ற சொல் முழுவதும் ஒருமையாகப் பயன்படுத்தப்பட்டுள்ளது.
