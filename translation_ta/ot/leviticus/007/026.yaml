  text: And you shall not eat any blood in any of your dwellings[b][a], whether from bird or from animal.
translation:
  language: ta
  text: மேலும், நீங்கள் குடியிருக்கும் எல்லா இடங்களிலும் பறவை அல்லது விலங்கின் எந்த இரத்தத்தையும் உண்ணக்கூடாது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/כָל דָּם֙ לֹ֣א תֹאכְל֔וּ
  choice: எந்த இரத்தத்தையும் சாப்பிடக் கூடாது
  rationale: எதிர்மறை வினையுடன் வரும் כָּל தமிழில் இயல்பாக ‘எந்த ... ஐயும் ... கூடாது’ என்று வழங்கப்படுகிறது. சட்டத் தடையின் வலிமையை ‘சாப்பிடக் கூடாது’ தெளிவாகக் காட்டுகிறது.
- source_word: בְּ/כֹ֖ל מוֹשְׁבֹתֵי/כֶ֑ם
  choice: நீங்கள் குடியிருக்கும் எல்லா இடங்களிலும்
  rationale: מוֹשָׁב என்பது குடியிருப்பு அல்லது வாழும் இடத்தைக் குறிக்கிறது; இந்தத் தடை இஸ்ரவேலர் வாழும் எல்லா இடங்களிலும் பொருந்தும் என்பதை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: לָ/ע֖וֹף וְ/לַ/בְּהֵמָֽה
  choice: பறவையின் இரத்தத்தையோ விலங்கின் இரத்தத்தையோ
  rationale: எபிரெய முன்னொட்டு לְ இங்கு இரத்தம் எந்த உயிரின வகையைச் சேர்ந்தது என்பதைக் காட்டுகிறது. ‘பறவையின் ... விலங்கின் ...’ என்பது அந்த உறவைத் தமிழில் நேரடியாகவும் தெளிவாகவும் வெளிப்படுத்துகிறது; ‘-யோ ... -யோ’ இரு வகைகளையும் உள்ளடக்கும் தடையை இயல்பாகக் கூறுகிறது.
theological_decisions:
- issue: இரத்தத் தடையின் வரம்பு
  choice: பறவைகள் மற்றும் விலங்குகள் ஆகிய இரு வகைகளின் இரத்தத்தையும், இஸ்ரவேலர் குடியிருக்கும் எல்லா இடங்களிலும் உண்ணத் தடை விதிக்கப்படுகிறது.
  alternative: இறுதித் தொடரை எபிரெய வடிவுக்கு மிக நெருக்கமாக ‘பறவைக்கும் விலங்குக்கும்’ என்று வழங்கலாம்.
  rationale: לָעוֹף וְלַבְּהֵמָה என்ற சொற்றொடர் தடைசெய்யப்பட்ட இரத்தம் சார்ந்த உயிரின வகைகளை இயல்பாகக் குறிக்கிறது. மொழிபெயர்ப்பு இதற்கு மேலான பிற்கால இறையியல் விளக்கத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுமக்களுக்கு புரியும், மரியாதையான சட்ட மொழிநடை. எபிரெய வசனத் தொடக்க இணைப்பான וְ தனியாக ‘மேலும்’ என்று மொழிபெயர்க்கப்படாமல், தொடர்ச்சியான சட்டச் சூழலில் தமிழின் இயல்பான வாக்கிய ஓட்டத்தில் விடப்பட்டுள்ளது.
