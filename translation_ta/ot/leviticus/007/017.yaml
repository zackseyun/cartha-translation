  yaml_path: translation/ot/leviticus/007/017.yaml
  text: But what remains of the meat of the sacrifice on the third day shall be burned in the fire[a].
translation:
  language: ta
  text: ஆனால் பலியின் இறைச்சியில் மீந்திருப்பது மூன்றாம் நாளில் நெருப்பில் எரிக்கப்பட வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பலியின் சதையில்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנּוֹתָר
  choice: ஆனால் ... மீந்திருப்பது
  rationale: இணைப்புச்சொல்லும் பெயர்ச்சொல்லாகப் பயன்படும் செயப்பாட்டு எச்சமும் முந்தைய வசனத்தின் விதியைத் தொடர்ந்து, மீதியான பகுதியைக் குறிக்கின்றன. ‘மீந்திருப்பது’ என்பது இதை இயல்பான நவீனத் தமிழில் தருகிறது; ‘ஆனால்’ மூன்றாம் நாளில் அதற்கான மாறுபட்ட நடவடிக்கையை வெளிப்படுத்துகிறது.
- source_word: מִבְּשַׂר
  choice: இறைச்சியில்
  rationale: בָּשָׂר என்பதன் அடிப்படைப் பொருள் ‘சதை’; இங்கு பலியுணவு சூழலில் ‘இறைச்சி’ தெளிவாகவும் இயல்பாகவும் உள்ளது. מן பகுதி/மொத்த உறவைச் சுட்டுவதால் ‘இறைச்சியில் ... மீந்திருப்பது’ என மொழிபெயர்க்கப்பட்டது.
- source_word: הַזָּבַח
  choice: பலியின்
  rationale: זֶבַח பலியிடப்பட்ட மிருகத்தையோ பலிச் செயலையோ குறிக்கலாம். இச்சூழலில் ‘பலி’ நேரடியான, சமயப் பிரிவுசார்பற்ற தெரிவாகும்.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: மூன்றாம் நாள்வரை
  rationale: சொல்லுக்கு நேர் வடிவம் ‘மூன்றாம் நாளில்’ என்றாலும், முந்தைய வசனத்தில் இரண்டாம் நாளில் உண்ண அனுமதிக்கப்பட்டதைத் தொடர்ந்து, மூன்றாம் நாளில் எஞ்சியிருக்கும் இறைச்சி குறிக்கப்படுகிறது. தமிழில் ‘மூன்றாம் நாள்வரை மீந்திருப்பது’ அந்தக் கால உறவைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: בָּאֵשׁ
  choice: நெருப்பில்
  rationale: בְּ + אֵשׁ இங்கு எரித்து அகற்றும் வழிமுறையைச் சுட்டுகிறது; ‘நெருப்பில்’ எபிரெய வடிவத்தையும் இயல்பான தமிழையும் பேணுகிறது.
- source_word: יִשָּׂרֵף
  choice: எரிக்கப்பட வேண்டும்
  rationale: நிஃபால் முற்றாத வினை இங்கு சட்டவிதி/கட்டளையாகச் செயல்படுகிறது. ‘எரிக்கப்பட வேண்டும்’ செயப்பாட்டு வடிவத்தையும் கட்டாயத் தன்மையையும் தெளிவாகப் பேணுகிறது.
