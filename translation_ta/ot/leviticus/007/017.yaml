review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the sacrificial flesh that remains and the required burning. However, “மூன்றாம் நாள்வரை மீந்திருப்பது” shifts the Hebrew temporal phrase (“on the third day”) into a duration ending on that day. The source specifies the day on which the remainder is to be burned, not that it remains until then.
  naturalness: The wording is generally clear and suitably formal. “மூன்றாம் நாளில்” is both natural modern Tamil and more precise in this legal instruction.
  terminology: “பலியின் இறைச்சி,” “நெருப்பில்,” and “எரிக்கப்பட வேண்டும்” are appropriate. The footnote’s “சதை” preserves the lexical alternative for בשר without imposing a theological interpretation.
  issues:
  - severity: medium
    issue: Temporal expression rendered as “மூன்றாம் நாள்வரை” rather than “மூன்றாம் நாளில்.”
    rationale: בַּיּוֹם הַשְּׁלִישִׁי means “on the third day.” Although the preceding context concerns permitted consumption on earlier days, the present verse directly prescribes burning the remainder on day three. “வரை” introduces an unwarranted endpoint/durative nuance.
  revised_text: ஆனால் பலியின் இறைச்சியில் மீந்திருப்பது மூன்றாம் நாளில் நெருப்பில் எரிக்கப்பட வேண்டும்.[a]
  revised_footnotes:
