  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ta
  text: 'யாவே[a] மோசேயிடம் கூறினார்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில்: ‘YHWH’ (יהוה); மரபாக ‘கர்த்தர்’ என்று மொழிபெயர்க்கப்படுகிறது.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பேசிச் சொன்னது
  rationale: வாவ் தொடர்ச்சியுடன் வரும் דּבר அடுத்த உரைப்பகுதியை அறிமுகப்படுத்துகிறது. தமிழில் ‘பேசிச் சொன்னது’ என்பது דּבר என்பதையும், தொடர்ந்து வரும் לאמר என்ற உரை அறிமுக வாய்பாட்டையும் இயல்பாக இணைக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: எபிரெய மெய்யெழுத்துப் பெயரான יהוה-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் நீண்டகாலமாக அறியப்பட்ட தனிப்பெயர் வடிவில் வழங்குகிறது; எபிரெய உச்சரிப்பு உறுதியாகத் தெரியாததால் அடிக்குறிப்பில் விளக்கம் தரப்படுகிறது.
- source_word: אֶל
  choice: மோசேயிடம்
  rationale: பேச்சு செலுத்தப்படும் நபரைச் சுட்டும் אֶל, தமிழில் இயல்பான ‘-இடம்’ வேற்றுமை வடிவால் மொழிபெயர்க்கப்படுகிறது.
- source_word: מֹשֶׁה
  choice: மோசே
  rationale: தனிப்பெயரின் நவீனத் தமிழில் நிலைபெற்ற வடிவம்.
- source_word: לֵאמֹר
  choice: 'சொன்னது:'
  rationale: நேரடி உரையை அறிமுகப்படுத்தும் எபிரெய வாய்பாடு. அடுத்த வசனத்தில் வரும் உரைக்குத் தமிழில் இயல்பாக வழிவகுக்க ‘சொன்னது:’ என வழங்கப்படுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் ஒரு தனிப்பெயர் இருப்பதைப் பட்டப்பெயரால் மறைக்காமல் காக்கிறது. அதன் பழைய உச்சரிப்பு குறித்து உறுதியின்மை இருப்பதால், பிரதான உரையில் தமிழில் பரவலாக அறியப்பட்ட ‘யெகோவா’ வடிவம் வைக்கப்பட்டு, ‘யாவே’ என்ற மாற்று ஒலிப்பும் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன, கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ். அடுத்த வசனத்தில் தொடங்கும் நேரடி உரையைச் சுட்ட இரட்டைப்புள்ளி பயன்படுத்தப்பட்டுள்ளது; அடிக்குறிப்பு குறியீடு பிரதான உரையில் சேர்க்கப்பட்டுள்ளது.
