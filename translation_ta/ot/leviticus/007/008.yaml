base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/008.yaml
  text: And the priest who presents a man's burnt offering shall have for himself the skin of the burnt offering that he has presented[a][b].
translation:
  language: ta
  text: ஒரு மனிதனின் தகனபலியைச் செலுத்துகிற ஆசாரியனுக்கு, அவன் செலுத்திய அந்தத் தகனபலியின் தோல்[a] உரியதாகும்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘விலங்குத் தோல்.’
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் ‘ஒரு மனிதனின் தகனபலி’; மூலத்தின் ஒருமை ஆண்பால் வடிவம் பொதுப்பாலாக்கப்படாமல் பாதுகாக்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּהֵן
  choice: ஆசாரியன்
  rationale: பலியிடுதல் தொடர்பான லேவியராகமச் சட்டங்களில் כֹּהֵן என்பதற்கான இயல்பான, நிலைபெற்ற தமிழ் சொல்; எபிரெய definite article சூழலில் குறிப்பிட்ட பணியைச் செய்யும் ஆசாரியனைச் சுட்டுகிறது.
- source_word: הַמַּקְרִיב / הִקְרִיב
  choice: செலுத்துகிற / செலுத்திய
  rationale: קרב என்பதன் Hiphil வடிவம் இங்கு பலியைச் சடங்குமுறையில் சமர்ப்பிப்பதைக் குறிக்கிறது. ‘செலுத்து’ என்பது தமிழ் வேதாகம மற்றும் வழக்குப் பயன்பாட்டில் பலியுடன் இயல்பாக இணைகிறது; பின்னுள்ள perfect முடிந்த செயலைக் காட்ட ‘செலுத்திய’ என வழங்கப்பட்டது.
- source_word: עֹלַת אִישׁ
  choice: ஒரு மனிதனின் தகனபலி
  rationale: עֹלָה முழுவதும் எரிக்கப்படும் பலிவகையைக் குறிக்கிறது; אִישׁ ஒருமை ஆண்பால் வடிவத்தை மறைக்காமல் ‘ஒரு மனிதன்’ எனப் பாதுகாக்கிறது.
- source_word: עֹור
  choice: தோல்
  rationale: பலியிடப்பட்ட விலங்கின் skin/hide என்பதைக் குறிக்கும் பொதுவான, தெளிவான நவீன தமிழ் சொல்.
- source_word: הָעֹלָה
  choice: தகனபலி
  rationale: லேவியராகமத்தின் பலிச்சட்டங்களில் עֹלָה என்பதற்கான தெளிவான மற்றும் மரபில் நிலைபெற்ற தமிழ் சடங்கியல் பெயர்.
- source_word: אֲשֶׁר הִקְרִיב
  choice: அவன் செலுத்திய
  rationale: உறவுப்பெயர் வாக்கியம் குறிப்பிட்ட தகனபலியை அடையாளப்படுத்துகிறது; ஆசாரியன் செய்து முடித்த செயலை இயல்பான தமிழில் எடுத்துரைக்கிறது.
- source_word: לַכֹּהֵן לוֹ יִהְיֶה
  choice: ஆசாரியனுக்கு ... உரியதாகும்
  rationale: ‘ஆசாரியனுக்கு, அவனுக்கே அது இருக்கும்’ என்ற எபிரெய உரிமைக் கட்டமைப்பை இயல்பான தமிழில் உரிமை/பங்கு எனத் தெளிவாக வெளிப்படுத்துகிறது; ‘அவனுக்கே’ என்ற வலியுறுத்தலை தேவையின்றி மிகைப்படுத்தவில்லை.
theological_decisions:
- issue: אִישׁ என்பதன் பாலினக் குறிப்பு
  choice: ஒரு மனிதனின் தகனபலி
  alternative: ஒருவரின் தகனபலி
  rationale: மூலத்தில் உள்ள ஒருமை ஆண்பால் אִישׁ என்பதைக் பொதுப்பாலாக்காமல் பாதுகாக்கிறது; அதேவேளை நவீன தரமான தமிழில் ‘மனிதன்’ இயல்பாக உள்ளது.
- issue: עֹלָה என்ற பலிவகையின் பெயர்
  choice: தகனபலி
  alternative: மேலேறும் பலி
  rationale: சொற்பிறப்பின் ‘மேலேறுதல்’ கருத்தைத் தீர்மானமாக முன்னிறுத்தாமல், இச்சட்டச் சூழலில் முழுவதும் எரிக்கப்படும் அங்கீகரிக்கப்பட்ட பலிவகையை வாசகருக்குத் தெளிவாகக் குறிக்கிறது.
- issue: தோல் யாருக்கு உரியது
  choice: பலியைச் செலுத்துகிற ஆசாரியனுக்கு உரியது
  alternative: பொதுவாக ஆசாரியருக்கு உரியது
  rationale: הַמַּקְרִיב என்ற participle மற்றும் לַכֹּהֵן לוֹ என்ற அமைப்பு, அந்தக் குறிப்பிட்ட பலியைச் செலுத்திய ஆசாரியனையே உரிமையாளராகச் சுட்டுகிறது.
translation_notes:
  register: நவீன தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ். பலிச்சட்டத்திற்குரிய ‘ஆசாரியன்’, ‘தகனபலி’ ஆகிய நிலைபெற்ற சொற்கள் பயன்படுத்தப்பட்டுள்ளன. மூலத்தின் நீளமான தொடர்பமைப்பு தமிழில் தெளிவாக இருக்கச் சொல் வரிசை இயல்பாக்கப்பட்டுள்ளது; ஆனால் பலியைச் செலுத்திய ஆசாரியனுக்கே தோல் உரியது என்ற உறவு காக்கப்பட்டுள்ளது.
