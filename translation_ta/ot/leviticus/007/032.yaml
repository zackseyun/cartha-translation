review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the right thigh, the singular recipient (the priest), the source relationship ('from your peace offerings'), and the directive force. However, 'பங்காக' ('as a share/portion') underrepresents תְּרוּמָה, which denotes a portion set apart and given as a contribution/offering.
  naturalness: The sentence is broadly natural modern Tamil, but 'வலது தொடையைப் பங்காக ஆசாரியனுக்குக்' is less idiomatic and can momentarily sound like an unspecified share rather than a designated offering. 'ஆசாரியனுக்குப் பிரித்தளிக்கும் காணிக்கையாக' is clearer and natural in this legal-sacrificial context.
  terminology: '''தொடை,'' ''ஆசாரியன்,'' and ''சமாதானப் பலிகள்'' are appropriate. Rendering תְּרוּמָה as ''பிரித்தளிக்கும் காணிக்கை'' better conveys the set-apart contribution without relying on the opaque traditional technical expression.'
  issues:
  - severity: medium
    issue: The rendering 'பங்காக' for תְּרוּמָה is semantically too general.
    rationale: Although the right thigh is a priestly portion, the Hebrew noun specifically identifies it as a contribution set apart for presentation. A wording with 'காணிக்கை' preserves that ritual and giving sense more faithfully.
  revised_text: உங்கள் சமாதானப் பலிகளிலிருந்து வலது தொடையை ஆசாரியனுக்குப் பிரித்தளிக்கும் காணிக்கையாகக் கொடுக்க வேண்டும்.[a][b]
