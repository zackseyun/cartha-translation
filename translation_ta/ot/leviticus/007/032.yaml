source:
  edition: WLC
  text: וְ/אֵת֙ שׁ֣וֹק הַ/יָּמִ֔ין תִּתְּנ֥וּ תְרוּמָ֖ה לַ/כֹּהֵ֑ן מִ/זִּבְחֵ֖י שַׁלְמֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/032.yaml
  text: And you shall give the right thigh as a contribution to the priest from your sacrifices of peace offerings[a][b][c].
translation:
  language: ta
  text: உங்கள் சமாதானப் பலிகளிலிருந்து வலது தொடையை ஆசாரியனுக்குப் பிரித்தளிக்கும் காணிக்கையாகக் கொடுக்க வேண்டும்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பிரித்தளிக்கப்படும் காணிக்கையாக.” மரபாக, “உயர்த்தப்படும் காணிக்கையாக.”
    reason: lexical_alternative
  - marker: b
    text: “சமாதானப் பலிகள்” என்பதற்கு மாற்றாக, “உறவுப் பலிகள்” அல்லது “நல்வாழ்வுப் பலிகள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹק
  choice: தொடை
  rationale: பலியிடப்படும் விலங்கின் காலின் மேற்பகுதியைக் குறிக்கும் சொல்லாக இருப்பதால், பொதுவான ‘கால்’ என்பதைவிட ‘தொடை’ துல்லியமானது.
- source_word: הַיָּמִין
  choice: வலது
  rationale: பலியில் ஒதுக்கப்பட்ட குறிப்பிட்ட பகுதி வலப்புறத் தொடை என்பதைக் கூறுவதால் இதை வெளிப்படையாகத் தக்கவைக்கிறது.
- source_word: תִּתְּנוּ
  choice: கொடுக்க வேண்டும்
  rationale: இரண்டாம் நபர் பன்மைக்கான சட்டக் கட்டளையின் வலிமையை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: תְרוּמָה
  choice: பங்காக
  rationale: ஆசாரியனுக்கெனப் பிரித்து அளிக்கப்படும் உரிய பகுதி என்ற சூழல்சார் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது; ‘உயர்த்திப் படைக்கும் காணிக்கை’ போன்ற மரபுச் சொற்றொடர் மூலச்சொல்லின் பொருளை அளவுக்கு மீறிக் குறிப்பாக்கலாம்.
- source_word: לַכֹּהֵן
  choice: ஆசாரியனுக்கு
  rationale: பெறுபவரைக் குறிக்கும் எபிரேய ஒருமையை நேரடியாகப் பாதுகாக்கிறது.
- source_word: מִזִּבְחֵי שַׁלְמֵיכֶם
  choice: உங்கள் சமாதானப் பலிகளிலிருந்து
  rationale: מִן குறிக்கும் மூலத்தையும் இரண்டாம் நபர் பன்மை உடைமைப் பின்னொட்டையும் காக்கிறது; שְׁלָמִים என்பதற்கு அடையாளம் காணக்கூடிய பலியியல் பெயராக ‘சமாதானப் பலிகள்’ பயன்படுத்தப்படுகிறது.
- source_word: וְאֵת
  choice: (தமிழில் தனியே மொழிபெயர்க்கப்படவில்லை)
  rationale: וְ இங்கு முந்தைய கட்டளையோடு இணைக்கிறது; ஆனால் தனி வசனமாக இயல்பான தமிழில் தொடக்க ‘மேலும்’ அவசியமில்லை. אֵת என்பது நேரடி செயப்படுபொருள் குறியீடு; அதற்குத் தமிழில் தனிச் சொல் தேவையில்லை.
theological_decisions:
- issue: שְׁלָמִים என்ற பலியின் பெயர்
  choice: சமாதானப் பலிகள்
  alternative: உறவுப் பலிகள் / நல்வாழ்வுப் பலிகள்
  rationale: மூலச்சொல் சமாதானம், நல்வாழ்வு, முழுமை, உறவு ஆகிய பொருள் வளங்களைக் கொண்டிருக்கலாம். முதன்மை உரையில் அறியப்பட்ட ‘சமாதானப் பலிகள்’ வைக்கப்பட்டு, மற்ற சாத்தியங்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன தரத் தமிழ்; சட்டக் கட்டளையின் வலிமைக்காக ‘கொடுக்க வேண்டும்’ பயன்படுத்தப்பட்டுள்ளது. பலியியல் சூழலில் துல்லியத்துக்காக ‘தொடை’ என்றும், ஆசாரியனுக்கென ஒதுக்கப்படும் பகுதியை இயல்பாகச் சொல்ல ‘பங்காக’ என்றும் மொழிபெயர்க்கப்பட்டுள்ளது. அனைத்து அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெறுகின்றன.
