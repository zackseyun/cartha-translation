revisions:
- from: உங்கள் சமாதானப் பலிகளிலிருந்து வலது தொடையைப் பங்காக ஆசாரியனுக்குக் கொடுக்க வேண்டும்.[a][b]
  to: உங்கள் சமாதானப் பலிகளிலிருந்து வலது தொடையை ஆசாரியனுக்குப் பிரித்தளிக்கும் காணிக்கையாகக் கொடுக்க வேண்டும்.[a][b]
