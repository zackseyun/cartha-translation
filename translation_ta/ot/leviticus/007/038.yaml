revisions:
- from: யெகோவா சீனாய் மலையில் மோசேக்குக் கட்டளையிட்டவையும், சீனாய் வனாந்தரத்தில் இஸ்ரவேல் மக்களைத் தங்கள் காணிக்கைகளை யெகோவாவுக்குச் செலுத்தும்படி அவர் கட்டளையிட்ட நாளில் கொடுத்தவையும் இவையே.
  to: சீனாய் மலையில், சீனாய் வனாந்தரத்தில் இஸ்ரவேல் மக்களைத் தங்கள் காணிக்கைகளை யாவேக்கு அர்ப்பணிக்கும்படி கட்டளையிட்ட நாளில், யாவே மோசேக்குக் கட்டளையிட்டவை இவையே.
  rationale: The revision removes the unsupported notion of ‘giving,’ restores Yahweh as the subject of both commands, and makes the day clause modify his command concerning Israel’s offerings. It retains the verse’s backward-looking summary with ‘இவையே’ and uses natural modern Tamil word order.
