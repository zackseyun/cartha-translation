source:
  edition: WLC
  text: אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֶת מֹשֶׁ֖ה בְּ/הַ֣ר סִינָ֑י בְּ/י֨וֹם צַוֺּת֜/וֹ אֶת בְּנֵ֣י יִשְׂרָאֵ֗ל לְ/הַקְרִ֧יב אֶת קָרְבְּנֵי/הֶ֛ם לַ/יהוָ֖ה בְּ/מִדְבַּ֥ר סִינָֽי־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/038.yaml
  text: which Yahweh commanded Moses on Mount Sinai[a], on the day when he commanded the sons of Israel to present their offerings to Yahweh in the wilderness of Sinai.
translation:
  language: ta
  text: சீனாய் மலையில், சீனாய் வனாந்தரத்தில் இஸ்ரவேல் மக்களைத் தங்கள் காணிக்கைகளை யாவேக்கு அர்ப்பணிக்கும்படி கட்டளையிட்ட நாளில், யாவே மோசேக்குக் கட்டளையிட்டவை இவையே.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲשֶׁר
  choice: கட்டளையிட்டவையும்… கொடுத்தவையும் இவையே
  rationale: இது முந்தைய வசனத்தில் தொகுத்துக் கூறப்பட்ட பலிகளுக்கான சட்டங்களோடு தொடர்புடைய சார்புத்தொடர். தனியாகப் படிக்கப்படும் தமிழில் தொடர்பைத் தெளிவாகவும் இயல்பாகவும் காட்ட வாக்கியம் இவ்வாறு அமைக்கப்பட்டது.
- source_word: צִוָּה
  choice: கட்டளையிட்ட
  rationale: சட்ட மற்றும் வழிபாட்டுச் சூழலில் வினைச்சொல்லின் அதிகாரப்பூர்வ வலிமையைப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: திருப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் பரவலாக அறியப்படும் பெயர்வடிவத்தில் தருகிறது.
- source_word: בְּהַר סִינָי
  choice: சீனாய் மலையில்
  rationale: இடத்தைக் குறிக்கும் எபிரெய முன்னிடைச்சொல்லை இயல்பான தமிழில் தருகிறது.
- source_word: בְּיוֹם
  choice: நாளில்
  rationale: மூலத்தில் உள்ள வெளிப்படையான காலக் குறிப்பைப் பாதுகாக்கிறது.
- source_word: צַוֹּתוֹ
  choice: அவர் கட்டளையிட்ட
  rationale: பெயரெச்ச வினைவடிவத்தையும் மூன்றாம் நபர் உரிமை விகுதியையும் வாசிக்க எளிதான தமிழ் வினைத்தொடராக அளிக்கிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: சொல்லளவில் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு உடன்படிக்கைச் சமூகத்தைக் குறிக்கும் வழக்குச் சொற்றொடர்; நவீன தமிழில் உள்ளடக்கத்தை இயல்பாகத் தெரிவிக்கிறது.
- source_word: לְהַקְרִיב
  choice: செலுத்தும்படி
  rationale: பலியைக் கடவுளின் முன்னிலையில் கொண்டுவந்து அர்ப்பணிக்கும் வழிபாட்டுச் செயலைத் தமிழில் இயல்பாகக் குறிக்கிறது.
- source_word: קָרְבְּנֵיהֶם
  choice: தங்கள் காணிக்கைகளை
  rationale: இவ்வசனம் பல வகையான பலிகளையும் காணிக்கைகளையும் தொகுத்துக் கூறுவதால், பரந்த பொருளுடைய தமிழ்ச் சொல் தேர்ந்தெடுக்கப்பட்டது.
- source_word: בְּמִדְבַּר סִינָי
  choice: சீனாய் வனாந்தரத்தில்
  rationale: מדבר என்பதன் குடியிருப்பற்ற வறண்ட நிலப்பகுதி என்ற புவியியல் பொருளை மரியாதையான, பரிச்சயமான தமிழில் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலம் தனிப்பட்ட திருப்பெயரைப் பயன்படுத்துவதால் பட்டப்பெயராக மாற்றப்படவில்லை. ‘யெகோவா’ நவீன தமிழ் வேதாகம வாசகர்களிடையே பரவலாக அறியப்படும் பெயர்வடிவம்.
- issue: בְּנֵי יִשְׂרָאֵל என்பதன் குறிப்பு
  choice: இஸ்ரவேல் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்; இஸ்ரவேலர்
  rationale: எபிரெயச் சொற்றொடரின் குடும்ப உருவகத்தைச் சொற்சொல்லாகக் காட்டுவதைக் காட்டிலும், இங்கு குறிப்பிடப்படும் முழு உடன்படிக்கைச் சமூகத்தைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- issue: சீனாய் மலைக்கும் வனாந்தரத்துக்கும் தொடர்பான கட்டளையின் தொடரமைப்பு
  choice: மலையில் கட்டளையிட்டவையும்… நாளில் கொடுத்தவையும்
  alternative: சீனாய் மலையில் மோசேக்குக் கட்டளையிட்டது; அன்றே மக்களுக்கும் கட்டளையிட்டார்
  rationale: மோசே பெற்ற கட்டளைகளையும் இஸ்ரவேல் மக்களுக்குக் கொடுக்கப்பட்ட கட்டளையையும் மூலத்தின் ஒரே சார்புத்தொடருக்குள் வைத்துப் பாதுகாக்கிறது; இரு தனித்த நிகழ்வுகளாகக் கடுமையாகப் பிரிக்கவில்லை.
translation_notes:
  register: நவீன தரநிலைத் தமிழ்; எளிதில் புரியும் மரியாதையான வேதாகம நடை. தனித்த வசனமாக வாசிக்கும்போது முந்தைய சட்டத் தொகுப்போடு உள்ள தொடர்பு தெளிவாக இருக்க ‘இவையே’ என முடிக்கப்பட்டுள்ளது. மூலத்தில் தனி வாசகக் குறிப்பு தேவைப்படும் குறிப்பிடத்தக்க உரைமாற்று இல்லை.
