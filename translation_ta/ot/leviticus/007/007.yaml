base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/007.yaml
  text: 'Like the sin offering[a], so the guilt offering: there is one law for them[c][b]. The priest who makes atonement with it shall have it.'
translation:
  language: ta
  text: பாவநிவாரணப் பலியைப் போலவே குற்றநிவாரணப் பலியும்; அவை இரண்டுக்கும் ஒரே விதிமுறை உண்டு[a]. அதைக் கொண்டு பாவநிவிர்த்தி செய்யும் ஆசாரியனுக்கு அது உரியது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘விதிமுறை’ என்பதற்கான எபிரெயச் சொல் தோரா; இதை ‘அறிவுறுத்தல்’ அல்லது ‘சட்டம்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּחַטָּאת
  choice: பாவநிவாரணப் பலியைப் போலவே
  rationale: כְּ ஒப்புமையைக் குறிக்கிறது. பலி சார்ந்த சூழலில் חַטָּאת வெறும் ‘பாவம்’ அல்ல, பாவத்திற்கான நிவாரணப் பலியைக் குறிக்கிறது.
- source_word: כָּאָשָׁם
  choice: குற்றநிவாரணப் பலியும் இருக்கிறது
  rationale: אָשָׁם இங்கு குற்றத்திற்கான பரிகார அல்லது ஈட்டுப் பலியைக் குறிக்கிறது. இணையான ஒப்புமை அமைப்பு இயல்பான தமிழில் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: תּוֹרָה אַחַת לָהֶם
  choice: அவை இரண்டுக்கும் ஒரே விதிமுறை
  rationale: תּוֹרָה இச்சடங்கு-சட்டச் சூழலில் நடைமுறை விதிமுறையைக் குறிக்கிறது; לָהֶם முன் கூறிய இரண்டு பலிகளையும் சுட்டுகிறது.
- source_word: הַכֹּהֵן אֲשֶׁר יְכַפֵּר בּוֹ
  choice: அதைக் கொண்டு பாவநிவிர்த்தி செய்கிற ஆசாரியன்
  rationale: כפר என்பதன் பலி சார்ந்த இறையியல் வலிமையை ‘பாவநிவிர்த்தி செய்’ தக்கவைக்கிறது. בּוֹ பலியைச் சாதனமாகக் குறிப்பதால் ‘அதைக் கொண்டு’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: לוֹ יִהְיֶה
  choice: அவனுக்கே அது உரியதாகும்
  rationale: இந்த எபிரெய மரபுத்தொடர் உடைமை அல்லது பங்குரிமையைக் குறிக்கிறது; பணிபுரியும் ஆசாரியனுக்கே பலி உரியது என்பதைக் தெளிவாகவும் சட்டத் தொனியுடனும் கூறுகிறது.
theological_decisions:
- issue: பலிச் சட்டத்தில் כפר என்பதன் பொருள்
  choice: பாவநிவிர்த்தி செய்கிற
  alternative: பரிகாரம் செய்கிற; தூய்மைப்படுத்துகிற
  rationale: ஒரு குறிப்பிட்ட பாவநிவர்த்திக் கோட்பாட்டைத் திணிக்காமல், ஆசாரிய பலிச் செயலின் இறையியல் வலிமையைப் பாதுகாக்க ‘பாவநிவிர்த்தி’ தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; எளிதில் புரியும் ஆனால் பலிச் சட்டத்திற்கேற்ற கண்ணியமான நடை. ‘ஆசாரியன்’, ‘பாவநிவிர்த்தி’ போன்ற பரவலாக அறியப்பட்ட வேதாகமச் சொற்கள் தக்கவைக்கப்பட்டுள்ளன. எபிரெய வசனத்தில் உள்ள ஒப்புமை, ஒரே விதிமுறை, பணிபுரியும் ஆசாரியனின் உரிமை ஆகியவை வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளன.
