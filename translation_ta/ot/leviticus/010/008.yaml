  text: וַ/יְדַבֵּ֣ר יְהוָ֔ה אֶֽל אַהֲרֹ֖ן לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/008.yaml
  text: And Yahweh spoke to Aaron[a], saying,
translation:
  language: ta
  text: யாவே ஆரோனிடம் கூறினார்:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மூலத்தில் YHWH; ‘யெகோவா’ என்றும் ஒலிபெயர்க்கப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பேசிச் சொன்னதாவது
  rationale: וַיְדַבֵּר கதையோட்டத்தை முன்னெடுத்து, தொடர்ந்து வரும் לֵאמֹר உடன் சேர்ந்து தெய்வீக உரையை அறிமுகப்படுத்தும் வழக்கமான எபிரெயச் சொற்றொடரை உருவாக்குகிறது. தமிழில் ‘பேசிச் சொன்னதாவது’ என்பது அதன் வடிவத்தையும் இயல்பான உரைநடையையும் காக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: நான்கு எழுத்துத் தெய்வீகப் பெயரை ஒரு பட்டமாக மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட பெயர்வடிவமான ‘யெகோவா’ என்று ஒலிபெயர்க்கிறது; ‘யாவே’ என்பதும் மாற்று ஒலிபெயர்ப்பு.
- source_word: אֶל
  choice: ஆரோனிடம்
  rationale: பேச்சின் இலக்கைச் சுட்டும் אֶל என்பதற்கு, தமிழில் நபரிடம் பேசுவதைக் குறிக்கும் இயல்பான வேற்றுமை வடிவம் ‘-ிடம்’ ஆகும்.
- source_word: אַהֲרֹן
  choice: ஆரோன்
  rationale: எபிரெயத் தனிப்பெயரின் நிலைபெற்ற தமிழ் ஒலிபெயர்ப்பு.
- source_word: לֵאמֹר
  choice: சொன்னதாவது
  rationale: அடுத்து வரும் உரையின் உள்ளடக்கத்தை அறிமுகப்படுத்தும் எபிரெய வினையெச்ச வடிவத்தை, தமிழில் வேதாகம உரைநடைக்கு ஏற்ற தெளிவான அறிமுகச் சொல்லால் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே
  rationale: மூலத்தில் தெய்வீகப் பெயர் நேரடியாக உள்ளது. அதை ‘கர்த்தர்’ போன்ற பட்டத்தால் மாற்றாமல் பெயராகவே வழங்க வேண்டும். உயிரெழுத்தாக்கம் உறுதியாக இல்லாததால், மற்றொரு ஏற்ற ஒலிபெயர்ப்பை அடிக்குறிப்பு பதிவு செய்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சுருக்கமானதும் கண்ணியமானதும் வாய்விட்டு வாசிக்க இயல்பானதுமான உரை. எபிரெய தெய்வீக உரை அறிமுகச் சூத்திரம் தேவையற்ற கடினத்தன்மையின்றி பாதுகாக்கப்பட்டுள்ளது.
