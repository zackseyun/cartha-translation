  text: וַ/יְדַבֵּ֨ר מֹשֶׁ֜ה אֶֽל אַהֲרֹ֗ן וְ/אֶ֣ל אֶ֠לְעָזָר וְ/אֶל אִ֨יתָמָ֥ר בָּנָי/ו֮ הַ/נּֽוֹתָרִים֒ קְח֣וּ אֶת הַ/מִּנְחָ֗ה הַ/נּוֹתֶ֨רֶת֙ מֵ/אִשֵּׁ֣י יְהוָ֔ה וְ/אִכְל֥וּ/הָ מַצּ֖וֹת אֵ֣צֶל הַ/מִּזְבֵּ֑חַ כִּ֛י קֹ֥דֶשׁ קָֽדָשִׁ֖ים הִֽוא־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/012.yaml
  text: 'Then Moses spoke to Aaron and to Eleazar and to Ithamar[a], his remaining sons: “Take the grain offering that remains from the food offerings of Yahweh, and eat it unleavened beside the altar, because it is most holy.”'
translation:
  language: ta
  text: 'பின்னர் மோசே ஆரோனிடமும், எஞ்சியிருந்த அவனுடைய மகன்களான எலெயாசார், இத்தாமார் ஆகியோரிடமும் கூறினார்: “யாவேக்குச் செலுத்தப்படும் நெருப்புக் காணிக்கைகளில்[a] மீதமுள்ள தானியக் காணிக்கையை எடுத்து, அதை பலிபீடத்தின் அருகே புளிப்பில்லாத அப்பங்களாக உண்ணுங்கள்; ஏனெனில் அது மிகப் பரிசுத்தமானது.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேக்குச் செலுத்தப்படும் உணவுக் காணிக்கைகளில்.”
    reason: אִשֵּׁי என்பதற்கு முறையாக “நெருப்பில் செலுத்தப்படும் காணிக்கைகள்” என்ற பொருள் உண்டு; பலியியல் சூழலில் “உணவுக் காணிக்கைகள்” என்ற செயல்பாட்டு மொழிபெயர்ப்பும் சாத்தியம்.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பின்னர் ... கூறினார்
  rationale: வாவ் தொடர்வினை கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது; ‘பின்னர்’ இயல்பான தமிழில் நிகழ்வின் வரிசையைத் தெளிவுபடுத்துகிறது.
- source_word: הַנּוֹתָרִים
  choice: எஞ்சியிருந்த
  rationale: நாதாப், அபீகூ இறந்த பின் ஆரோனுக்கு மீதியிருந்த மகன்களை இச்சொல் குறிக்கிறது; ‘உயிர்தப்பிய’ என்று விளக்கமாக்காமல் மூலத்தின் அடக்கமான சொல்லாட்சியைப் பேணுகிறது.
- source_word: הַמִּנְחָה
  choice: தானியக் காணிக்கை
  rationale: லேவியராகமத்தின் பலியியல் சூழலில் இது பொதுவான காணிக்கையை அல்ல, தானியத்தால் செலுத்தப்படும் காணிக்கையைக் குறிக்கிறது.
- source_word: הַנּוֹתֶרֶת
  choice: மீதியாக இருக்கும்
  rationale: யாவேக்குரிய பகுதி செலுத்தப்பட்ட பின் எஞ்சிய காணிக்கைப் பகுதியைக் குறிக்கும் பெண்பால் வினையெச்சத்தின் பொருளைப் பேணுகிறது.
- source_word: מֵאִשֵּׁי יְהוָה
  choice: யாவேக்குச் செலுத்தப்பட்ட நெருப்புக் காணிக்கைகளில்
  rationale: אִשֶּׁה என்ற பலியியல் சொல் நெருப்பில் செலுத்தப்படும் காணிக்கைகளைக் குறிக்கிறது. நெருப்பு உருவகத்தை முதன்மை உரையில் பேணி, ‘உணவுக் காணிக்கைகள்’ என்ற சாத்தியமான செயல்பாட்டு மொழிபெயர்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், அதன் பரவலான தமிழ் ஒலிபெயர்ப்பான ‘யாவே’ என்று வழங்குகிறது.
- source_word: וְאִכְלֻהָ מַצּוֹת
  choice: புளிப்பில்லாமல் உண்ணுங்கள்
  rationale: מַצּוֹת இங்கு உணவை எவ்வாறு உண்ண வேண்டும் என்பதைக் காட்டுகிறது; தமிழ் வினையடை அமைப்பு இயல்பாகவும் மூலத்திற்கு நெருக்கமாகவும் உள்ளது.
- source_word: אֵצֶל הַמִּזְבֵּחַ
  choice: பலிபீடத்தின் அருகே
  rationale: אֵצֶל குறிக்கும் அண்மையை இயல்பான தமிழில் தெரிவிக்கிறது; பலிபீடத்தைத் தொடும் அளவிலான நெருக்கத்தைத் தேவையின்றி உணர்த்துவதில்லை.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: மிகப் பரிசுத்தமானது
  rationale: எபிரெயச் சிறப்புநிலை மரபுத்தொடர் மிக உயர்ந்த பரிசுத்தத்தைக் குறிக்கிறது; ‘பரிசுத்த ஸ்தலத்தின் மகா பரிசுத்தம்’ போன்ற இடவியல் பொருள் ஏற்படாமல் தெளிவாக வழங்கப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது. அதை பொதுப் பட்டமான ‘கர்த்தர்’ என்று மாற்றாமலும், ‘Jehovah’ மரபு வடிவத்தைப் பின்பற்றாமலும் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
- issue: אִשֵּׁי என்ற பலியியல் சொல்லின் நுண்பொருள்
  choice: நெருப்புக் காணிக்கைகள்
  alternative: உணவுக் காணிக்கைகள்
  rationale: சொல்லின் நெருப்புடன் தொடர்புடைய வடிவத்தை முதன்மை உரை பாதுகாக்கிறது; பலிகள் கடவுளுக்குச் செலுத்தப்படும் ‘உணவு’ எனப் புரிந்துகொள்ளப்படும் செயல்பாட்டு மாற்று அடிக்குறிப்பில் தரப்பட்டு சொல்லின் நுண்பொருள் திறந்தவண்ணம் வைக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், வழிபாட்டு உரைக்கு ஏற்ற கண்ணியமான நடையும் பொதுவாசகர்களுக்குப் புரியும் சொற்களும் பயன்படுத்தப்பட்டுள்ளன. ‘தானியக் காணிக்கை’, ‘பலிபீடம்’, ‘பரிசுத்தம்’ ஆகிய நிலைபெற்ற வேதாகமப் பலியியல் சொற்கள் தெளிவிற்காகத் தக்கவைக்கப்பட்டுள்ளன.
