revisions:
- from: அப்போது யெகோவாவின் சந்நிதியிலிருந்து நெருப்பு புறப்பட்டு வந்து அவர்களை எரித்து அழித்தது[a]; அவர்கள் யெகோவாவின் சந்நிதியில் இறந்தார்கள்.
  to: யெகோவாவின் முன்னிலையிலிருந்து நெருப்பு புறப்பட்டது; அது அவர்களை எரித்து அழித்தது[a]; அவர்கள் யெகோவாவின் முன்னிலையில் இறந்தார்கள்.
  rationale: The revision removes the unsupported temporal addition and redundant motion wording. It renders מִלִּפְנֵי יְהוָה and לִפְנֵי יְהוָה consistently as 'யெகோவாவின் முன்னிலையிலிருந்து' and 'யெகோவாவின் முன்னிலையில்,' preserving both the Hebrew repetition and the first phrase's directional 'from.' The semicolon keeps the second finite clause clearly connected without adding causal interpretation.
