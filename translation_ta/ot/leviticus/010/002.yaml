base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/002.yaml
  text: And fire came out from before Yahweh and consumed them[a], and they died before Yahweh.
translation:
  language: ta
  text: யெகோவாவின் முன்னிலையிலிருந்து நெருப்பு புறப்பட்டது; அது அவர்களை எரித்து அழித்தது[a]; அவர்கள் யெகோவாவின் முன்னிலையில் இறந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “யெகோவாவின் முன்னிலையிலிருந்து”; அல்லது, “யெகோவாவின் பிரசன்னத்திலிருந்து.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּצֵא
  choice: புறப்பட்டு வந்தது
  rationale: יצא என்பதன் திசை சார்ந்த பொருளையும் தொடர் நிகழ்வைக் குறிக்கும் wayyiqtol வடிவையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֵשׁ
  choice: நெருப்பு
  rationale: இங்கு உடனடியான நியாயத்தீர்ப்பை நிறைவேற்றும் நேரடியான நெருப்பைக் குறிக்கிறது.
- source_word: מִלִּפְנֵי יְהוָה
  choice: யெகோவாவின் சந்நிதியிலிருந்து
  rationale: ‘யெகோவாவின் முகம்/முன்னிலையிலிருந்து’ என்ற எபிரெய மொழிநடையை, அதன் இடம் மற்றும் பிரசன்னம் சார்ந்த பொருளைத் தக்கவைத்து இயல்பான தமிழில் வழங்குகிறது.
- source_word: וַתֹּאכַל
  choice: எரித்து அழித்தது
  rationale: אכל என்பதன் அடிப்படைப் பொருள் ‘தின்றது’ என்றாலும், நெருப்பை எழுவாயாகக் கொண்ட இச்சூழலில் முழுமையான அழிவை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: אֹתָם
  choice: அவர்களை
  rationale: முந்தைய சூழலில் வரும் நாதாபையும் அபிகூவையும் குறிக்கும் நேரடி செயப்படுபொருள் சுட்டுப்பெயர்.
- source_word: וַיָּמֻתוּ
  choice: அவர்கள் இறந்தார்கள்
  rationale: எபிரெயத்தில் உள்ள செயப்பாட்டு அல்லாத எளிய நிகழ்வை அப்படியே தக்கவைக்கிறது; ‘கொல்லப்பட்டார்கள்’ என்ற கூடுதல் காரணவிளக்கத்தைச் சேர்க்கவில்லை.
- source_word: לִפְנֵי יְהוָה
  choice: யெகோவாவின் சந்நிதியில்
  rationale: தெய்வீக முன்னிலையைக் குறிக்கும் முக்கியமான சொற்றொடரின் மீளுரைப்பையும் வசனத்தின் கனத்த தொனியையும் தக்கவைக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் நேரடியாக வரும் உடன்படிக்கைப் பெயரை பொதுப் பட்டப்பெயராக மாற்றாமல் தமிழில் பரவலாக அறியப்படும் பெயர்வடிவத்தில் தருகிறது.
- issue: וַיָּמֻתוּ என்பதை காரணச் செயப்பாட்டாக மொழிபெயர்ப்பதா
  choice: அவர்கள் இறந்தார்கள்
  alternative: அவர்கள் கொல்லப்பட்டார்கள்
  rationale: எபிரெய வினை செயப்பாட்டு அல்லாத வடிவில் ‘அவர்கள் இறந்தார்கள்’ என்றே கூறுகிறது; முந்தைய கூறு காரணத்தை ஏற்கெனவே தெரிவிப்பதால் கூடுதல் விளக்கம் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்குரிய கண்ணியமான தொனியுடனும் அமைக்கப்பட்டது. ‘சந்நிதி’ என்ற பரவலாக அறியப்படும் சொல் לפני என்பதன் இடம் மற்றும் பிரசன்னம் சார்ந்த இரு நுணுக்கங்களையும் இயன்றவரை தக்கவைக்கிறது.
