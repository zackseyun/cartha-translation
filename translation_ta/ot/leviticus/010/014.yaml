  text: וְ/אֵת֩ חֲזֵ֨ה הַ/תְּנוּפָ֜ה וְ/אֵ֣ת שׁ֣וֹק הַ/תְּרוּמָ֗ה תֹּֽאכְלוּ֙ בְּ/מָק֣וֹם טָה֔וֹר אַתָּ֕ה וּ/בָנֶ֥י/ךָ וּ/בְנֹתֶ֖י/ךָ אִתָּ֑/ךְ כִּֽי חָקְ/ךָ֤ וְ/חָק בָּנֶ֨י/ךָ֙ נִתְּנ֔וּ מִ/זִּבְחֵ֥י שַׁלְמֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/014.yaml
  text: And you[a], and your sons and your daughters with you, shall eat the breast of the wave offering and the thigh of the contribution in a clean place[c][b], because they have been given as your portion and your sons’ portion from the sacrifices of the peace offerings of the sons of Israel.
translation:
  language: ta
  text: அசைவாட்டுக் காணிக்கையின் மார்புப் பகுதியையும்[a], உயர்த்தப்பட்ட காணிக்கையின் தொடைப் பகுதியையும்[b], நீயும் உன்னோடு உன் மகன்களும் மகள்களும் தூய்மையான இடத்தில் உண்ண வேண்டும். ஏனெனில், அவை இஸ்ரவேல் மக்களின் சமாதானப் பலிகளிலிருந்து[c] உனக்கும் உன் மகன்களுக்கும் உரிய பங்காகக் கொடுக்கப்பட்டுள்ளன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அசைவாட்டுக் காணிக்கை” என்பது ஆண்டவரின் முன்னிலையில் சடங்காக அசைத்துப் படைக்கப்பட்ட காணிக்கையைக் குறிக்கிறது; “சமர்ப்பிப்புக் காணிக்கை” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “உயர்த்தப்பட்ட காணிக்கை” என்பதற்குப் பதிலாக “உயர்த்திப் படைக்கப்பட்ட காணிக்கை” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் உயர்த்தப்பட்ட அல்லது ஆசாரியருக்குரிய பங்காகப் பிரித்தளிக்கப்பட்ட ஒன்றைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: “சமாதானப் பலிகள்” என்பதிலுள்ள எபிரெயச் சொல் சமாதானம், முழுமை, அல்லது நல்வாழ்வு ஆகிய பரந்த கருத்துகளை உணர்த்தலாம்; “உறவுப் பலிகள்” என்றும் மொழிபெயர்க்கப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲזֵה הַתְּנוּפָה
  choice: அசைவாட்டுப் பலியின் மார்புப் பகுதி
  rationale: חֲזֶה என்பது விலங்கின் மார்பு அல்லது நெஞ்சுப் பகுதியைக் குறிக்கிறது; תְּנוּפָה ஆண்டவரின் முன்னிலையில் சடங்காக அசைத்துப் படைக்கப்பட்ட பகுதியைக் குறிக்கிறது. நிறுவப்பட்ட பலியியல் சொல்லாட்சியைத் தெளிவாகப் பேணுகிறது.
- source_word: שׁוֹק הַתְּרוּמָה
  choice: காணிக்கையாக உயர்த்தப்பட்ட தொடைப் பகுதி
  rationale: שׁוֹק கால் அல்லது தொடைப் பகுதியையும், תְּרוּמָה உயர்த்தப்பட்ட அல்லது பிரித்தளிக்கப்பட்ட காணிக்கையையும் குறிக்கிறது. தமிழில் பொருளும் சடங்குச் செயலும் இயல்பாகத் தெளிவாகின்றன.
- source_word: תֹּאכְלוּ
  choice: சாப்பிட வேண்டும்
  rationale: இங்குள்ள imperfect சட்டவழி அறிவுறுத்தலாகச் செயல்படுகிறது; 'வேண்டும்' அதன் கட்டளைத் தன்மையை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְּמָקוֹם טָהוֹר
  choice: தூய்மையான ஓர் இடத்தில்
  rationale: லேவியராகமச் சூழலில் טָהוֹר சடங்குத் தூய்மையைச் சுட்டுகிறது. முதன்மை உரையில் தேவையின்றி விளக்கத்தைச் சேர்க்காமல் இதைச் சுருக்கமாகக் கூறுகிறது.
- source_word: אַתָּה וּבָנֶיךָ וּבְנֹתֶיךָ אִתָּךְ
  choice: நீயும் உன்னோடு உன் மகன்களும் மகள்களும்
  rationale: மூலத்தில் மகன்களும் மகள்களும் தனித்தனியாகக் குறிப்பிடப்படுவதையும் 'உன்னோடு' என்பதையும் பேணுகிறது.
- source_word: חָקְךָ וְחָק בָּנֶיךָ
  choice: உனக்கும் உன் மகன்களுக்கும் உரிய பங்கு
  rationale: חֹק இச்சூழலில் சட்டக்கட்டளையைவிட நியமிக்கப்பட்ட ஆசாரியப் பங்கைக் குறிக்கிறது; 'உரிய பங்கு' அந்தப் பொருளைத் தெளிவாக்குகிறது.
- source_word: נִתְּנוּ
  choice: கொடுக்கப்பட்டுள்ளன
  rationale: passive perfect நிறுவப்பட்ட கொடையின் தற்போதைய விளைவைச் சுட்டுகிறது; தமிழில் நிறைவு நிலையைக் காட்டும் வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: מִזִּבְחֵי שַׁלְמֵי
  choice: சமாதானப் பலிகளிலிருந்து
  rationale: זִבְחֵי שַׁלְמֵי என்பதன் பலியியல் வகையை இயல்பான தமிழில் தருகிறது. שְׁלָמִים என்பதிலுள்ள சமாதானம், முழுமை, நல்வாழ்வு ஆகிய பரந்த பொருள் வெளியை 'சமாதானப் பலிகள்' பேணுகிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: இது இஸ்ரவேல் சமூகத்தைக் குறிக்கும் வழக்கமான எபிரெயக் கூட்டுப்பெயர். தமிழில் 'இஸ்ரவேலின் மகன்கள்' எனச் சொல்வது தனிப்பட்ட ஆண் சந்ததியினரை மட்டும் குறிக்கும் தவறான எண்ணத்தைத் தரக்கூடும்; 'இஸ்ரவேல் மக்கள்' அதன் கூட்டுப்பொருளை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל என்ற உடன்படிக்கைச் சமூகப் பெயர்
  choice: இஸ்ரவேல் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரெய மொழியில் ஆண்பால் பன்மை வடிவம் இருந்தாலும், இச்சொற்றொடர் முழு இஸ்ரவேல் சமூகத்தையும் குறிக்கும் மரபுச் சொல். நவீன தமிழில் அதன் கூட்டுப்பொருளைத் தவறின்றி வழங்குவது முன்னுரிமை பெறுகிறது.
- issue: שְׁלָמִים என்பதன் மொழிபெயர்ப்பு
  choice: சமாதானப் பலிகள்
  alternative: உறவுப் பலிகள்
  rationale: '''சமாதானப் பலிகள்'' என்பது சமாதானம், முழுமை, நல்வாழ்வு ஆகிய பரந்த பொருளைத் திறந்துவைக்கிறது; ''உறவுப் பலிகள்'' பொருளை ஐக்கியம் அல்லது தோழமைக்கு மட்டும் சுருக்கக்கூடும்.'
translation_notes:
  register: நவீன தரநிலைத் தமிழில், பலியியல் சூழலுக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. சட்டவழி அறிவுறுத்தலுக்கு 'சாப்பிட வேண்டும்' பயன்படுத்தப்பட்டுள்ளது. மூன்று அடிக்குறிப்பு குறிகளும் தொடர்புடைய சொற்றொடர்களுக்கு உடனடியாக அல்லாமல் வசன முடிவில் சேர்க்கப்பட்டுள்ளன; பதிப்பில் வாசகர் எளிதில் இணைக்குமாறு அவற்றை உரிய சொற்களுக்குப் பின்னர் அமைக்கலாம்.
