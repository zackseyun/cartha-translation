source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶֽל אַהֲרֹ֗ן הוּא֩ אֲשֶׁר דִּבֶּ֨ר יְהוָ֤ה לֵ/אמֹר֙ בִּ/קְרֹבַ֣/י אֶקָּדֵ֔שׁ וְ/עַל פְּנֵ֥י כָל הָ/עָ֖ם אֶכָּבֵ֑ד וַ/יִּדֹּ֖ם אַהֲרֹֽן־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/003.yaml
  text: 'Then Moses said to Aaron[a], “This is what Yahweh spoke, saying: ‘Among those who come near me I will be sanctified[b], and before all the people I will be glorified.’” And Aaron was silent.'
translation:
  language: ta
  text: 'அப்போது மோசே ஆரோனிடம், “யாவே கூறியது இதுதான்: ‘என்னிடம் நெருங்கிவருகிறவர்களிடையே நான் பரிசுத்தராக வெளிப்படுவேன்[a]; மக்கள் அனைவரின் முன்னிலையிலும் நான் மகிமைப்படுத்தப்படுவேன்[b]’” என்றார். ஆரோனோ மௌனமாக இருந்தார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என்னிடம் நெருங்கிவருகிறவர்களால் நான் பரிசுத்தராகக் கருதப்படுவேன்.” தேவனுடைய பரிசுத்தம் வெளிப்படுதல் அல்லது அவரை அணுகுகிறவர்கள் அவரைப் பரிசுத்தராக மதித்தல் ஆகிய இரு நுணுக்கங்களையும் எபிரெய மொழி தரக்கூடும்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “நான் கௌரவிக்கப்படுவேன்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைவனுடைய தனிப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், எபிரெய நான்கெழுத்துப் பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: הוּא אֲשֶׁר דִּבֶּר יְהוָה
  choice: யாவே கூறியது இதுதான்
  rationale: அடையாளப்படுத்தும் எபிரெய வாக்கியத்தை இயல்பான நவீனத் தமிழில் நெருக்கமாக வெளிப்படுத்துகிறது.
- source_word: בִּקְרֹבַי
  choice: என்னிடம் நெருங்கிவருகிறவர்களிடையே
  rationale: ‘எனக்கு அருகிலுள்ளவர்களில்/என்னிடம் அணுகுகிறவர்களிடையே’ என்ற பொருளைத் தருகிறது; ஆசாரியர்கள் என்று வரம்புபடுத்தாமல் வழிபாட்டு அணுகுதலையும் உணர்த்துகிறது.
- source_word: אֶקָּדֵשׁ
  choice: நான் பரிசுத்தர் என்று விளங்கச் செய்வேன்
  rationale: நிஃபால் வடிவிலுள்ள வெளிப்படுத்தப்படுதல் அல்லது பரிசுத்தராக ஏற்றுக்கொள்ளப்படுதல் என்ற இரு நுணுக்கங்களையும் இயன்றவரை திறந்துவைக்கிறது.
- source_word: וְעַל פְּנֵי כָל הָעָם
  choice: மக்கள் அனைவரின் முன்னிலையிலும்
  rationale: பொதுமக்கள் முன்னே நிகழும் வெளிப்பாட்டை இயல்பான தமிழில் காக்கிறது.
- source_word: אֶכָּבֵד
  choice: நான் மகிமைப்படுத்தப்படுவேன்
  rationale: தேவனுக்குக் கிடைக்கும் பொது மகிமை அல்லது கனம் என்ற நிஃபால் பொருளைத் தக்கவைக்கிறது.
- source_word: וַיִּדֹּם
  choice: மௌனமாக இருந்தார்
  rationale: ஆரோனின் பதிலற்ற, ஆழ்ந்த அமைதியைச் சுருக்கமாகவும் கண்ணியமாகவும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: தேவனை அணுகுகிறவர்களிடையே அவர் பரிசுத்தராக வெளிப்படும் விதம்
  choice: என்னிடம் நெருங்கிவருகிறவர்களிடையே நான் பரிசுத்தர் என்று விளங்கச் செய்வேன்
  alternative: என்னிடம் நெருங்கிவருகிறவர்களால் நான் பரிசுத்தராகக் கருதப்படுவேன்
  rationale: எபிரெயம் தேவனுடைய பரிசுத்தம் வெளிப்படுவதையும் அவரை அணுகுகிறவர்கள் அவரைப் பரிசுத்தராக மதிப்பதையும் குறிக்கக்கூடும். முதன்மை வாசகம் தேவ செயல்பாட்டை முன்னிறுத்துகிறது; அடிக்குறிப்பு மனித அங்கீகார நுணுக்கத்தைப் பாதுகாக்கிறது.
- issue: אֶכָּבֵד என்பதிலுள்ள மகிமை மற்றும் கனம்
  choice: நான் மகிமைப்படுத்தப்படுவேன்
  alternative: நான் கனம் பெறுவேன்
  rationale: இரண்டும் சாத்தியம்; ‘மகிமைப்படுத்தப்படுவேன்’ என்பது தேவனைப் பற்றிய சொல்லின் இறையியல் செறிவையும் பொது வெளிப்பாட்டையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான வேதாகம நடையுடன் மொழிபெயர்க்கப்பட்டது. ‘பரிசுத்தர்’, ‘மகிமைப்படுத்தப்படுவேன்’ போன்ற பரிச்சயமான இறையியல் சொற்கள் பயன்படுத்தப்பட்டாலும் வாக்கிய அமைப்பு சாதாரண வாசகர்களுக்குப் புரியும் வகையில் வைக்கப்பட்டுள்ளது.
