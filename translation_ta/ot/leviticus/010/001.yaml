source:
  edition: WLC
  text: וַ/יִּקְח֣וּ בְנֵֽי אַ֠הֲרֹן נָדָ֨ב וַ/אֲבִיה֜וּא אִ֣ישׁ מַחְתָּת֗/וֹ וַ/יִּתְּנ֤וּ בָ/הֵן֙ אֵ֔שׁ וַ/יָּשִׂ֥ימוּ עָלֶ֖י/הָ קְטֹ֑רֶת וַ/יַּקְרִ֜בוּ לִ/פְנֵ֤י יְהוָה֙ אֵ֣שׁ זָרָ֔ה אֲשֶׁ֧ר לֹ֦א צִוָּ֖ה אֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/001.yaml
  text: Then Nadab and Abihu[a], Aaron’s sons, each took his firepan, put fire in it, placed incense on it, and presented unauthorized fire before Yahweh, which he had not commanded them.
translation:
  language: ta
  text: பின்பு ஆரோனின் மகன்களான நாதாபும் அபீகூவும் தத்தம் நெருப்புத்தட்டுகளை எடுத்து, அவற்றில் நெருப்பைப் போட்டு, ஒவ்வொரு தட்டின்மேலும் தூபப்பொருளை வைத்து, யாவே அவர்களுக்குக் கட்டளையிடாத அங்கீகரிக்கப்படாத நெருப்பை[a] யாவேக்கு முன்பாகச் செலுத்தினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்நிய நெருப்பு” அல்லது “முறையற்ற நெருப்பு.” யாவே கட்டளையிடாத நெருப்பு என்பதே இச்சொற்றொடரின் சூழல்சார் பொருள் என்பதை அடுத்த உட்பிரிவு விளக்குகிறது.
    reason: אֵשׁ זָרָה என்பதற்கான நேரடி மாற்றுகளையும், அடுத்த உட்பிரிவால் விளக்கப்படும் அங்கீகாரமின்மையின் சூழல்சார் பொருளையும் பாதுகாக்கிறது.
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: எடுத்து
  rationale: לקח என்ற பொதுவான தொடர் நிகழ்வு வினையை இயல்பான தமிழ் நடையில் வழங்குகிறது.
- source_word: בְנֵי אַהֲרֹן נָדָב וַאֲבִיהוּא
  choice: ஆரோனின் மகன்களான நாதாபும் அபீகூவும்
  rationale: உறவுமுறையையும் இரு தனிப்பெயர்களையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: אִישׁ מַחְתָּתוֹ
  choice: தத்தம் நெருப்புத்தட்டுகளை
  rationale: אִישׁ என்பதன் பகிர்நிலைப் பொருளை ‘தத்தம்’ என்றும், மַחְתָּה என்பதைக் கனல் அல்லது நெருப்பு ஏந்தும் தட்டு என்றும் இயல்பாக வழங்குகிறது.
- source_word: וַיִּתְּנוּ בָהֵן אֵשׁ
  choice: அவற்றில் நெருப்பைப் போட்டு
  rationale: பெண்பால் பன்மை பின்னொட்டு நெருப்புத்தட்டுகளைக் குறிக்கிறது; தமிழ் எண்ணொற்றுமையும் காக்கப்படுகிறது.
- source_word: וַיָּשִׂימוּ עָלֶיהָ קְטֹרֶת
  choice: அதன்மேல் தூபப்பொருளை வைத்து
  rationale: எபிரெயச் சொல்லின் ஒருமை வடிவத்தைப் பாதுகாக்கும் வகையில் ஒவ்வொருவரின் தட்டையும் பகிர்நிலையில் குறிக்கிறது; קְטֹרֶת எரிக்கப்படும் நறுமணப் பொருளைக் குறிக்கிறது.
- source_word: וַיַּקְרִבוּ
  choice: செலுத்தினார்கள்
  rationale: பலிசார் சூழலில் ‘முன்வைத்தல்/காணிக்கையாகக் கொண்டுவருதல்’ என்ற ஹிப்ஹில் பொருளைத் தமிழில் வழிபாட்டுச் செயலாக இயல்பாக உணர்த்துகிறது.
- source_word: לִפְנֵי יְהוָה
  choice: யாவே ... முன்னிலையில்
  rationale: לִפְנֵי என்பதன் முன்னிலை அல்லது சந்நிதிப் பொருளையும், יהוה என்ற உடன்படிக்கைப் பெயரையும் நேரடியாக வழங்குகிறது.
- source_word: אֵשׁ זָרָה
  choice: அங்கீகரிக்கப்படாத நெருப்பு
  rationale: זָרָה என்பதன் அந்நிய/முறையற்ற நுணுக்கத்தை அடுத்துள்ள ‘கட்டளையிடாத’ விளக்கத்தின் அடிப்படையில் சட்ட-வழிபாட்டுச் சூழலுக்கேற்றவாறு வழங்குகிறது; மாற்று நேரடி பொருள்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: אֲשֶׁר לֹא צִוָּה אֹתָם
  choice: தங்களுக்குக் கட்டளையிடாத
  rationale: ‘அவர்களுக்கு அவர் கட்டளையிடாத’ என்ற தொடர்பு வாக்கியத்தைத் தமிழில் சுருக்கமாகவும் தெளிவாகவும் தருகிறது; אֹתָם என்ற வெளிப்படையான பன்மைச் செயப்படுபொருள் காக்கப்படுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் உள்ள நான்கெழுத்து இறைப்பெயரை ஒரு பட்டப்பெயராக மாற்றாமல், தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பால் வழங்குகிறது.
- issue: אֵשׁ זָרָה என்பதன் விளக்கம்
  choice: அங்கீகரிக்கப்படாத நெருப்பு
  alternative: அந்நிய நெருப்பு / வழக்கத்திற்கு மாறான நெருப்பு
  rationale: குற்றம் நெருப்பின் விசித்திர இயல்பு மட்டுமல்ல, கடவுள் கட்டளையிடாத வழிபாட்டுச் செயல் என்பதைக் தொடர்ந்து வரும் உட்பிரிவு விளக்குகிறது. இருப்பினும் எபிரெயச் சொல்லின் நேரடி மாற்றுகளை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியும் ஆனால் வழிபாட்டு நிகழ்வின் கண்ணியத்தைத் தக்கவைக்கும் நடை. ‘தத்தம்’ என்ற பகிர்நிலை வடிவம் ஒவ்வொருவரும் தனித்தனி நெருப்புத்தட்டை எடுத்ததைத் தெளிவாக்குகிறது. அனைத்து அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
