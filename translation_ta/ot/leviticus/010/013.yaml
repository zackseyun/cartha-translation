  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/אֲכַלְתֶּ֤ם אֹתָ/הּ֙ בְּ/מָק֣וֹם קָדֹ֔שׁ כִּ֣י חָקְ/ךָ֤ וְ/חָק בָּנֶ֨י/ךָ֙ הִ֔וא מֵ/אִשֵּׁ֖י יְהוָ֑ה כִּי כֵ֖ן צֻוֵּֽיתִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/013.yaml
  text: You shall eat it in a holy place[a], because it is your portion and the portion of your sons from the food offerings of Yahweh, for so I have been commanded.
translation:
  language: ta
  text: அதைப் பரிசுத்தமான இடத்தில் உண்ணுங்கள்; ஏனெனில் அது யாவேக்குரிய நெருப்புப் பலிகளிலிருந்து உனக்கும் உன் மகன்களுக்கும் உரிய பங்காகும்; இவ்வாறே எனக்குக் கட்டளையிடப்பட்டது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேக்குரிய உணவுப் படையல்களிலிருந்து.”
    reason: אִשֵּׁי என்ற பலிசார் சொல்லுக்கு ‘நெருப்புப் பலிகள்’ என்பது நேரடியான மொழிபெயர்ப்பு; சூழலுக்கு ஏற்ற ‘உணவுப் படையல்கள்’ என்ற மாற்று புரிதலும் சாத்தியம்.
lexical_decisions:
- source_word: וַאֲכַלְתֶּם אֹתָהּ
  choice: அதைச் சாப்பிடுங்கள்
  rationale: பன்மை ஆண்பால் முன்னிலையிலுள்ள அறிவுறுத்தலை நவீன தமிழில் இயல்பான மரியாதை/பன்மை கட்டளை வடிவில் தருகிறது; பெண்பால் ஒருமை செயப்படுபொருள் முன்னர் குறிப்பிடப்பட்ட காணிக்கைப் பங்கைக் குறிக்கிறது.
- source_word: בְּמָקוֹם קָדֹשׁ
  choice: பரிசுத்தமான ஓர் இடத்தில்
  rationale: எபிரெயில் குறிப்புச் சுட்டு இல்லாததால் ஒரு குறிப்பிட்ட அறையைக் குறுக்கமாக நிர்ணயிக்காமல் ‘ஓர் இடத்தில்’ என மொழிபெயர்க்கப்படுகிறது; ‘பரிசுத்தமான’ என்பது ஆசாரச் சூழலின் தன்மையைப் பாதுகாக்கிறது.
- source_word: חָקְךָ וְחָק בָּנֶיךָ
  choice: உனக்கும் உன் மகன்களுக்கும் உரிய பங்கு
  rationale: ஆசாரியச் சூழலில் חֹק என்பது பொதுவாகச் சட்ட விதியைக் காட்டிலும் ஒதுக்கப்பட்ட உரிமைப் பங்கைக் குறிக்கிறது. ஒருமை ‘உன்’ மற்றும் ‘மகன்கள்’ ஆகியவை மூலத்தின் எண்ணையும் பாலினக் குறிப்பையும் பாதுகாக்கின்றன.
- source_word: מֵאִשֵּׁי יְהוָה
  choice: யாவேக்கு நெருப்பில் செலுத்தப்படும் காணிக்கைகளிலிருந்து
  rationale: אִשֶּׁה என்பதன் நெருப்போடு தொடர்புடைய பலிசார் பொருளைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது; காணிக்கை முழுவதும் எரிக்கப்பட்டது என்று தேவையின்றி உணர்த்தாத வகையில் வினைச்சொல் அமைக்கப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தேவனுடைய தனிப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: כִּי כֵן צֻוֵּיתִי
  choice: இவ்வாறே எனக்குக் கட்டளையிடப்பட்டது
  rationale: மோசே பெற்ற கட்டளையைச் சுட்டும் எபிரெய் செயல்பாட்டு வினையின் செயப்பாட்டு வடிவத்தையும் விளக்கத் தொடர்பையும் பாதுகாக்கிறது.
theological_decisions:
- issue: ஆசாரியருக்குரிய חֹק என்பதன் பொருள்
  choice: உரிய பங்கு
  alternative: உரிமை; ஒதுக்கீடு; நியமம்
  rationale: இங்கு பலியிலிருந்து ஆசாரியருக்கு ஒதுக்கப்பட்ட உறுதியான பங்கே பேசப்படுகிறது; ‘நியமம்’ என்பது சூழலின் நேரடியான பொருளை மறைக்கலாம்.
- issue: אִשֵּׁי יְהוָה என்பதன் பலிசார் வகைப்பாடு
  choice: யாவேக்கு நெருப்பில் செலுத்தப்படும் காணிக்கைகள்
  alternative: யாவேக்குரிய உணவுப் படையல்கள்
  rationale: முதன்மை உரை நெருப்புடன் உள்ள மூலச்சொல்லின் தொடர்பைப் பாதுகாக்கிறது; பலிசார் ‘உணவு’ என்ற சாத்தியமான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: ‘உன் மகன்கள்’ என்பதன் குறிப்பு
  choice: உன் மகன்கள்
  alternative: உன் பிள்ளைகள்
  rationale: மூலம் ஆரோனின் ஆண் வழியினரையும் ஆசாரியப் பணியின் குறிப்பிட்ட சூழலையும் வெளிப்படையாகக் குறிப்பிடுவதால் பாலினப் பொதுமைப்படுத்தல் தவிர்க்கப்படுகிறது.
- issue: முன்னிலை எண்ணில் ஏற்படும் மாற்றம்
  choice: ‘சாப்பிடுங்கள்’ என்ற பன்மையையும் ‘உன்’ என்ற ஒருமையையும் பாதுகாத்தல்
  alternative: இரண்டையும் பன்மையாக ஒருமைப்படுத்துதல்
  rationale: எபிரெய் உரை கட்டளையில் பன்மையிலிருந்து ஆரோனை நோக்கிய ஒருமை உடைமை வடிவுக்கு மாறுகிறது; இந்த உண்மையான இலக்கணப் பதற்றம் அமைதியாகச் சமப்படுத்தப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிதாகப் புரியும், ஆனால் ஆசாரச் சூழலுக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் உள்ள பன்மை கட்டளையிலிருந்து ஒருமை உடைமைக்கான மாற்றம் திட்டமிட்டு பாதுகாக்கப்பட்டுள்ளது; தெய்வீகப் பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
