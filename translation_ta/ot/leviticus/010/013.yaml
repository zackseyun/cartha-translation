revisions:
- from: அதைப் பரிசுத்தமான ஓர் இடத்தில் சாப்பிடுங்கள். ஏனெனில், யாவேக்கு நெருப்பில் செலுத்தப்படும் காணிக்கைகளிலிருந்து அது உனக்கும் உன் மகன்களுக்கும் உரிய பங்கு.[a] இவ்வாறே எனக்குக் கட்டளையிடப்பட்டது.
  to: அதைப் பரிசுத்தமான இடத்தில் உண்ணுங்கள்; ஏனெனில் அது யாவேக்குரிய நெருப்புப் பலிகளிலிருந்து உனக்கும் உன் மகன்களுக்கும் உரிய பங்காகும்; இவ்வாறே எனக்குக் கட்டளையிடப்பட்டது.[a]
