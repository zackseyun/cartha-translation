revisions:
- from: ஆரோன் மோசேயிடம், “இதோ, இன்று அவர்கள் தங்களுடைய பாவநிவாரணப் பலியையும்[a] தங்களுடைய தகனபலியையும் யெகோவாவின் முன்னிலையில் செலுத்தினார்கள். ஆனால் இப்படிப்பட்டவை எனக்கு நேரிட்டுள்ளன.[b] இன்று நான் பாவநிவாரணப் பலியைச் சாப்பிட்டிருந்தால், அது யெகோவாவின் பார்வையில் நன்றாயிருந்திருக்குமா?[c]” என்றான்.
  to: ஆரோன் மோசேயிடம், “இதோ, இன்று அவர்கள் தங்களுடைய பாவநிவாரணப் பலியையும்[a] தங்களுடைய தகனபலியையும் யெகோவாவின் முன்னிலையில் செலுத்தினார்கள்; இத்தகைய சம்பவங்கள் எனக்கு நேரிட்டுள்ளன.[b] இன்று நான் பாவநிவாரணப் பலியை உண்டிருந்தால், அது யெகோவாவின் பார்வையில் நல்லதாயிருந்திருக்குமா?[c]” என்றான்.
  rationale: The revision removes the unwarranted adversative «ஆனால்», makes the Hebrew reference to the day’s events explicit in idiomatic Tamil without specifying the precise ritual or emotional implication, and uses a formal verb for eating the offering. It retains the source ambiguity concerning why Aaron judges eating the offering inappropriate and preserves all footnote anchors and meanings.
