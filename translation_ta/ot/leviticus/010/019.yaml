base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/019.yaml
  text: And Aaron said to Moses[a], “Look, today they presented their sin offering and their burnt offering before Yahweh, and things like these have happened to me. If I had eaten the sin offering today[c][b], would it have been good in the sight of Yahweh?”
translation:
  language: ta
  text: ஆரோன் மோசேயிடம், “இதோ, இன்று அவர்கள் தங்களுடைய பாவநிவாரணப் பலியையும்[a] தங்களுடைய தகனபலியையும் யெகோவாவின் முன்னிலையில் செலுத்தினார்கள்; இத்தகைய சம்பவங்கள் எனக்கு நேரிட்டுள்ளன.[b] இன்று நான் பாவநிவாரணப் பலியை உண்டிருந்தால், அது யெகோவாவின் பார்வையில் நல்லதாயிருந்திருக்குமா?[c]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பாவநிவாரணப் பலி’ என்பதற்குப் பதிலாக, இரண்டு இடங்களிலும் ‘தூய்மைப்படுத்தும் பலி’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் חַטָּאת பாவத்தையோ, பாவம் அல்லது அசுத்தத்திலிருந்து தூய்மைப்படுத்துவதோடு தொடர்புடைய பலியையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: 'நேரடி பொருள்: ‘இவற்றைப் போன்றவை எனக்கு நேரிட்டன.’ அன்றைக்கு நிகழ்ந்த பேரிடர்களை, குறிப்பாகத் தன் மகன்களின் மரணத்தை, ஆரோன் குறிப்பிடுகிறான்.'
    reason: cultural_note
  - marker: c
    text: அல்லது, ‘அது யெகோவாவுக்குப் பிரியமாயிருந்திருக்குமா?’
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: இதோ
  rationale: ஆரோன் தன் விளக்கத்திற்குக் கவனம் ஈர்க்கப் பயன்படுத்தும் இடைச்சொல்லின் வலிமையை இயல்பான, கண்ணியமான தமிழில் தக்கவைக்கிறது.
- source_word: הִקְרִיבוּ
  choice: செலுத்தினார்கள்
  rationale: ஹிஃபில் வடிவில் வரும் பலிசார் பொருளைத் தமிழில் வழக்கமான ‘பலியைச் செலுத்துதல்’ என்ற சொல்லாட்சியால் தெரிவிக்கிறது.
- source_word: חַטָּאתָם / חַטָּאת
  choice: தங்களுடைய பாவநிவாரணப் பலி / பாவநிவாரணப் பலி
  rationale: லேவியராகமத்தின் பலிசார் சூழலில் இது வெறும் ‘பாவம்’ அல்ல, பாவம் அல்லது அசுத்தத்திற்கான நிவாரணத்தோடு தொடர்புடைய பலியைக் குறிக்கிறது. ‘பாவநிவாரணப் பலி’ தெளிவான வழக்குச் சொல்லாகும்; ‘தூய்மைப்படுத்தும் பலி’ மாற்றாகக் குறிப்பில் தரப்படுகிறது.
- source_word: עֹלָתָם
  choice: தங்களுடைய தகனபலி
  rationale: முழுவதுமாக எரிக்கப்படும் பலிவகைக்கான நிலைபெற்ற, சுருக்கமான தமிழ்ச் சொல்.
- source_word: לִפְנֵי יְהוָה
  choice: யெகோவாவின் முன்னிலையில்
  rationale: பலியைத் தெய்வீக முன்னிலையில் செலுத்துவதைச் சுட்டும் எபிரெயச் சொல்லாட்சியை இயல்பாகத் தெரிவிக்கிறது.
- source_word: וַתִּקְרֶאנָה אֹתִי כָּאֵלֶּה
  choice: இப்படிப்பட்டவை எனக்கு நேரிட்டுள்ளன
  rationale: அன்றைய துயர நிகழ்வுகளை, குறிப்பாக ஆரோனின் மகன்களுடைய மரணத்தை, உரை நேரடியாக அளிப்பதைக் காட்டிலும் அதிகமாக விளக்காமல் நிகழ்வுசார் தமிழில் தருகிறது.
- source_word: וְאָכַלְתִּי
  choice: நான் ... சாப்பிட்டிருந்தால்
  rationale: வடிவில் waw + qatal என்றாலும், தொடர்ந்து வரும் வினாவோடு இணைந்து எதிர்நிலை நிபந்தனைப் பொருளைத் தருகிறது; தமிழில் இந்த வடிவம் இயல்பானது.
- source_word: הַיִּיטַב בְּעֵינֵי יְהוָה
  choice: அது யெகோவாவின் பார்வையில் நன்றாயிருந்திருக்குமா?
  rationale: தெய்வீக அங்கீகாரத்தைப் பற்றிய சொல்லாட்சியை ‘யெகோவாவுக்குப் பிரியமாயிருந்திருக்குமா?’ என்று விளக்கிச் சுருக்காமல், எபிரெய உருவகத்தைத் தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தெய்வீகப் பெயரைப் பெயராகவே தமிழில் ஒலிபெயர்க்கிறது.
theological_decisions:
- issue: அந்தப் பலியை உண்ணாததற்கான ஆரோனின் வாதத்தின் தன்மை
  choice: அன்று தனக்கு நேரிட்ட துயரச் சம்பவங்களின் நிலையில் பாவநிவாரணப் பலியை உண்பது யெகோவாவின் பார்வையில் நல்லதாக இருந்திருக்குமா என்று ஆரோன் கேட்கிறான்.
  alternative: ஆரோன் தனிப்பட்ட துயரத்தை மட்டும் வெளிப்படுத்துகிறான்; அல்லது தன் அப்போதைய சடங்குசார் நிலையில் பலியை முறையாக உண்ண முடியுமா என்று குறிப்பாகக் கேட்கிறான்.
  rationale: எபிரெய உரை அன்றைய சம்பவங்களையும் தெய்வீக அங்கீகாரத்தைப் பற்றிய மறைமுக மறுப்புக் கேள்வியையும் இணைக்கிறது. ஆனால் பிரச்சினை சடங்குத் தூய்மையா, துக்கமா, அல்லது பரந்த முறைத்தகுதியா என்பதைத் திட்டவட்டமாகத் தீர்மானிப்பதில்லை; மொழிபெயர்ப்பு அந்த இறையியல் பதற்றத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான பலிசார் நடையைக் கடைப்பிடிக்கிறது. எபிரெயச் சொல்லாட்சியின் இயல்பான கடினத்தன்மையும் ஆரோனின் மறைமுக மறுப்புக் கேள்வியும் அளவுக்கு மீறி விளக்கப்படாமல் பாதுகாக்கப்பட்டுள்ளன.
