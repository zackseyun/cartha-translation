base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/004.yaml
  text: Then Moses called Mishael and Elzaphan[a], the sons of Uzziel, Aaron’s uncle, and said to them, “Come near[b]; carry your brothers away from before the sanctuary to outside the camp.”
translation:
  language: ta
  text: பின்னர் மோசே, ஆரோனுடைய தந்தையின் சகோதரனான ஊசியேலின் மகன்கள் மீசாயேலையும் எல்சாபானையும் அழைத்து, அவர்களிடம், “அருகே வாருங்கள்; பரிசுத்த இடத்தின் முன்புறத்திலிருந்து[b] உங்கள் சகோதரர்களை[a] முகாமுக்கு வெளியே எடுத்துச் செல்லுங்கள்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சகோதரர்கள்” என்பதற்கான எபிரெயச் சொல் நெருங்கிய ஆண் உறவினர்களையும் குறிக்கலாம்; இங்கு அது மீசாயேலுக்கும் எல்சாபானுக்கும் ஒன்றுவிட்ட சகோதரர்களான நாதாபையும் அபிகூவையும் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “பரிசுத்த இடத்தின் முன்னிலையிலிருந்து.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: அழைத்து
  rationale: கרא என்பது இந்நிகழ்வில் ஒருவரை அழைப்பதைக் குறிக்கிறது; ‘அழைத்து’ என்பது இயல்பான தமிழ் கதைநடை.
- source_word: בְּנֵי עֻזִּיאֵל
  choice: ஊசியேலின் மகன்கள்
  rationale: இந்த இணைப்புச் சொற்றொடர் மீசாயேலும் எல்சாபானும் ஊசியேலின் நேரடி மகன்கள் எனக் குறிப்பிடுகிறது.
- source_word: דֹּד אַהֲרֹן
  choice: ஆரோனுடைய தந்தையின் சகோதரன்
  rationale: דּוֹד இங்கு ஆரோனின் தந்தைவழி மாமனைக் குறிக்கிறது. வயதில் மூத்தவரா இளையவரா என்பதை எபிரெயச் சொல் தனியே குறிப்பிடாததால், ‘பெரியப்பா’ அல்லது ‘சித்தப்பா’ என்று குறுக்காமல் உறவுமுறையைத் தெளிவாக மொழிபெயர்க்கிறது.
- source_word: קִרְבוּ
  choice: அருகே வாருங்கள்
  rationale: இந்தக் கட்டளை வினை அணுகி வருவதைக் குறிக்கிறது; இடம்சார்ந்த பொருளையும் சூழலின் மரியாதையான தொனியையும் காக்கிறது.
- source_word: שְׂאוּ
  choice: தூக்கிக்கொண்டு
  rationale: נשא என்பதன் அடிப்படைப் பொருள் தூக்குதல் அல்லது சுமத்தல். இங்கு உடல்களை அப்புறப்படுத்தும் செயலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: אֲחֵיכֶם
  choice: உங்கள் சகோதரர்கள்
  rationale: ஆח் என்பது உடன்பிறந்த சகோதரரை மட்டுமல்லாமல் நெருங்கிய ஆண் உறவினரையும் குறிக்கலாம். மூலத்தின் உறவுச் சொல்லைக் காத்து, விரிந்த பொருளை அடிக்குறிப்பு விளக்குகிறது.
- source_word: מֵאֵת פְּנֵי הַקֹּדֶשׁ
  choice: பரிசுத்த இடத்தின் முன்னிலையிலிருந்து
  rationale: פְּנֵי என்பதிலுள்ள ‘முன்/முன்னிலை’ என்ற இடம்சார்ந்த பொருளையும், הַקֹּדֶשׁ என்பதிலுள்ள புனித வளாகக் குறிப்பையும் காக்கிறது.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: முகாமுக்கு வெளியே செல்லுங்கள்
  rationale: אֶל காட்டும் இயக்கத் திசையை ‘செல்லுங்கள்’ மூலம் தெளிவாக்கி, இலக்கிடம் முகாமுக்கு வெளியே என்பதைக் கூறுகிறது.
theological_decisions:
- issue: இறந்தவர்களுடனான உறவைச் சொல்லும் אֲחֵיכֶם என்பதன் விரிவு
  choice: உங்கள் சகோதரர்கள்
  alternative: உங்கள் உறவினர்கள்
  rationale: அவர்கள் உண்மையில் உறவுமுறைப்படி ஒன்றுவிட்ட சகோதரர்கள் என்றாலும், மூல எபிரெயம் விரிந்த பொருளுடைய ‘சகோதரர்கள்’ என்ற சொல்லையே பயன்படுத்துகிறது. அந்தக் குடும்ப நெருக்கத்தை மொழிபெயர்ப்பில் காத்து, அடிக்குறிப்பில் விளக்குவது பொருத்தமானது.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆரோனுடைய தந்தையின் சகோதரன்’ என்பது தமிழில் சற்றே விரிவானதாக இருந்தாலும், எபிரெயச் சொல் குறிப்பிடாத வயது வேறுபாட்டை ‘பெரியப்பா/சித்தப்பா’ எனச் சேர்ப்பதைத் தவிர்க்கிறது. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்றொடர்களுக்குப் பின்னரே வைக்கப்பட்டுள்ளன.
