  revision_rationale: The revision aligns the divine name with the project’s Yahweh policy and replaces an awkward purposive phrase with a coordinated obligation that reflects the Hebrew infinitive’s continuation of the preceding verse. The Mosaic-mediation idiom and its alternative rendering are retained.
