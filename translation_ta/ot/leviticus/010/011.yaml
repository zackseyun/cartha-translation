revisions:
- from: இஸ்ரவேலின் மக்களுக்கு, மோசேயின் கையால்[a] யெகோவா அவர்களிடம் உரைத்த எல்லாச் சட்டங்களையும் கற்பிப்பதற்காகவும் வேண்டும்.
  to: இஸ்ரவேல் மக்களுக்கு, யாவே மோசேயின் கையால் அவர்களிடம் உரைத்த எல்லாச் சட்டங்களையும் கற்பிக்கவும் வேண்டும்.
  rationale: The revision aligns the divine name with the project’s Yahweh policy and replaces an awkward purposive phrase with a coordinated obligation that reflects the Hebrew infinitive’s continuation of the preceding verse. The Mosaic-mediation idiom and its alternative rendering are retained.
