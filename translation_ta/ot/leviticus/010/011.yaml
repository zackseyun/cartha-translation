  yaml_path: translation/ot/leviticus/010/011.yaml
  text: and to teach the sons of Israel all the statutes that Yahweh has spoken to them by the hand of Moses[a].
translation:
  language: ta
  text: இஸ்ரவேல் மக்களுக்கு, யாவே மோசேயின் கையால் அவர்களிடம் உரைத்த எல்லாச் சட்டங்களையும் கற்பிக்கவும் வேண்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/לְ/הוֹרֹת
  choice: கற்பிப்பதற்காகவும் வேண்டும்
  rationale: வாவ் இணைப்பும் לְ முன்னொட்டுடன் வந்த ஹிஃபில் வினையெச்சமும் முந்தைய வசனத்தில் கூறப்பட்ட ஆசாரியக் கடமையைத் தொடர்கின்றன. தமிழ் வாக்கியத் தொடரில் கடமைப் பொருளை இயல்பாக வெளிப்படுத்த ‘கற்பிப்பதற்காகவும் வேண்டும்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மக்களுக்கு
  rationale: எபிரெயச் சொற்றொடர் சொல்லர்த்தமாக ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு உடன்படிக்கை மக்களைக் கூட்டாகக் குறிக்கிறது. நவீன தமிழில் ஆண் பாலினத்தவருக்கு மட்டும் உரியது என்ற தவறான எண்ணத்தைத் தவிர்த்து, குடும்பத் தொடர்பையும் கூட்டுப் பொருளையும் காக்க ‘இஸ்ரவேலின் மக்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: כָּל הַחֻקִּים
  choice: எல்லாச் சட்டங்களையும்
  rationale: חֻקִּים என்பது நிர்ணயிக்கப்பட்ட சட்டங்களையோ கட்டளைகளையோ குறிக்கிறது. சட்டச் சூழலுக்குப் பொருத்தமானதும் பொதுவாசகர்களுக்குத் தெளிவானதுமான ‘சட்டங்கள்’ பயன்படுத்தப்பட்டது.
- source_word: אֲשֶׁר דִּבֶּר יְהוָה אֲלֵיהֶם
  choice: யெகோவா அவர்களிடம் உரைத்த
  rationale: உறவுப்பெயர் தொடர் ‘சட்டங்கள்’ என்பதைக் குறிப்பிட்டு, அவை யெகோவா இஸ்ரவேல் மக்களிடம் உரைத்தவை எனச் சொல்கிறது. דִּבֶּר என்பதன் நிறைவுற்ற செயலைத் தமிழில் இயல்பான ‘உரைத்த’ வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: நான்கெழுத்துத் தெய்வீகப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் பரவலாக அறியப்படும் பெயர்வடிவமான ‘யெகோவா’ என வழங்கப்பட்டது.
- source_word: בְּיַד מֹשֶׁה
  choice: மோசேயின் கையால்
  rationale: எபிரெய மொழியின் ‘ஒருவரின் கையால்’ என்ற இடைநிலையாளர் வழிமுறையைக் குறிக்கும் மரபுத்தொடர் மூலத்தின் உருவகத் தன்மையைப் பாதுகாக்க நேரடியாக வைக்கப்பட்டது; அதன் இயல்பான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற உடன்படிக்கைப் பெயரின் மொழியாக்கம்
  choice: யெகோவா
  alternative: கர்த்தர் / யாவே
  rationale: மூலத்தில் தனிப்பட்ட தெய்வீகப் பெயர் நேரடியாக இருப்பதால், அதை ‘கர்த்தர்’ என்ற பட்டப்பெயரால் மாற்றவில்லை. தமிழில் அறிமுகமான ஒலிபெயர்ப்பான ‘யெகோவா’ பயன்படுத்தப்பட்டது; இது குறிப்பிட்ட சமயவிளக்கத்தை வசனத்தில் புகுத்துவதற்காக அல்ல.
- issue: בְּנֵי יִשְׂרָאֵל என்ற கூட்டுச் சொற்றொடர்
  choice: இஸ்ரவேலின் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: இச்சூழலில் ஆண்பாலின நபர்களை மட்டும் தனிப்படுத்தாமல், உடன்படிக்கைச் சமூகத்தை மொத்தமாகக் குறிக்கிறது. ஆகவே நவீன தமிழில் அதன் கூட்டுப் பொருளைத் தெளிவாகத் தரும் வடிவம் தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்ட மற்றும் உடன்படிக்கைச் சூழலுக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டது. இவ்வசனம் முந்தைய வசனத்தின் வாக்கியத்தையும் ஆசாரியக் கடமைகளின் பட்டியலையும் தொடர்வதால், ‘...வும் வேண்டும்’ என்ற தொடரமைப்பு காக்கப்பட்டது.
