  text: So they came near and carried them in their tunics to outside the camp[a], just as Moses had said.
translation:
  language: ta
  text: மோசே சொன்னபடியே, அவர்கள் அருகே வந்து, அவர்களை அவர்களுடைய அங்கிகளோடு[a] முகாமுக்கு வெளியே தூக்கிச் சென்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவர்களுடைய அங்கிகளால்.’ எபிரெய முன்னிடைச்சொல் கருவிப் பொருளையும் குறிக்கக்கூடும்; எனவே, அங்கிகளைப் பிடித்தோ பயன்படுத்தியோ உடல்களைத் தூக்கிச் சென்றார்கள் என்றும் பொருளாகலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְבוּ
  choice: அவர்கள் அருகே வந்து
  rationale: קרב என்பதன் கால் தொடர்வினை வடிவம் உடல்களிடம் நெருங்கிச் சென்றதைச் சுட்டுகிறது; ‘அருகே வந்து’ என்பது திசைநோக்கை இயல்பான தமிழில் காக்கிறது.
- source_word: וַיִּשָּׂאֻם
  choice: அவர்களை ... தூக்கிச் சென்றார்கள்
  rationale: נשׂא உடன் வரும் மூன்றாம் நபர் பன்மை பொருள் விகுதி நாதாபையும் அபீகூவையும் குறிக்கிறது. இச்சூழலில் உடல்களை எடுத்துச் சென்ற தொடர்ச்சியான செயலை ‘தூக்கிச் சென்றார்கள்’ தெளிவாகக் கூறுகிறது.
- source_word: בְּכֻתֳּנֹתָם
  choice: அவர்களுடைய அங்கிகளோடு
  rationale: כֻּתֹּנֶת என்பது உடலை மூடும் நீண்ட உடையைக் குறிக்கிறது. בְּ என்பது அவர்கள் அந்த உடைகளை அணிந்திருந்த நிலையையோ, அந்த உடைகளைப் பிடித்தோ பயன்படுத்தியோ சுமந்த முறையையோ குறிக்கலாம்; ‘அங்கிகளோடு’ முதன்மை உரையில் இவ்விரு சாத்தியங்களையும் ஓரளவு திறந்தவையாக வைக்கிறது.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: முகாமுக்கு வெளியே
  rationale: אֶל உடன் அமைந்த சொற்றொடர் முகாமுக்கு வெளியிலுள்ள இடத்தை நோக்கிய இயக்கத்தைக் குறிக்கிறது; தமிழில் ‘முகாமுக்கு வெளியே தூக்கிச் சென்றார்கள்’ அந்த இயக்கத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כַּאֲשֶׁר דִּבֶּר מֹשֶׁה
  choice: மோசே சொன்னபடியே செய்தார்கள்
  rationale: முந்தைய வசனத்தில் மோசே கொடுத்த கட்டளைக்கேற்ப அவர்கள் நடந்ததை இக்கூற்று சுட்டுகிறது. எபிரெய உரையில் ‘செய்தார்கள்’ வெளிப்படையாக இல்லாவிட்டாலும், தமிழில் வாக்கியத் தொடர்பை இயல்பாக்க அது சேர்க்கப்பட்டுள்ளது.
