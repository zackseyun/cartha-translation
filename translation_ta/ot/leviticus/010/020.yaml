  yaml_path: translation/ot/leviticus/010/020.yaml
  text: And Moses heard[a], and it was good in his eyes.
translation:
  language: ta
  text: மோசே அதைக் கேட்டார்[a]; அது அவர் பார்வையில் நல்லதாக இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “மோசே கேட்டார்; அது அவர் கண்களில் நல்லதாக இருந்தது” என்று உள்ளது. இந்த மரபுத்தொடர், அது அவருக்கு உகந்ததாக அல்லது ஏற்கத்தக்கதாக இருந்தது என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: அதைக் கேட்டார்
  rationale: שׁמע என்பதன் அடிப்படைப் பொருள் ‘கேள்.’ முந்தைய வசனத்தில் ஆரோன் கூறிய விளக்கத்தை மோசே கேட்டார் என்பதே சூழல். தமிழில் இயல்பாக இருக்க, மூலத்தில் வெளிப்படையாக இல்லாவிட்டாலும் சூழலால் தெளிவாகும் ‘அதை’ சேர்க்கப்பட்டுள்ளது; ‘புரிந்துகொண்டார்’ அல்லது ‘செவிகொடுத்தார்’ என்று மொழிபெயர்த்து அவரது எதிர்வினையை மிகையாக விளக்கவில்லை.
- source_word: מֹשֶׁה
  choice: மோசே
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள பெயர் வடிவம்.
- source_word: וַיִּיטַב
  choice: நல்லதாக இருந்தது
  rationale: qal வடிவிலுள்ள יטב ‘நல்லதாக இரு, மனதிற்கு உகந்ததாக இரு’ என்று பொருள்படும். தொடரும் எபிரெய மரபுத்தொடருடன் சேர்ந்து, அந்த விளக்கம் மோசேக்கு ஏற்றதாகத் தோன்றியதை இது குறிக்கிறது; எனினும் ‘அவர் ஒப்புக்கொண்டார்’ என்று பொருளை முழுமையாகத் தீர்மானிக்காமல் மூலத்தின் வடிவத்தைப் பாதுகாக்கிறது.
- source_word: בְּעֵינָיו
  choice: அவருடைய பார்வையில்
  rationale: எழுத்துப்படியான ‘அவருடைய கண்களில்’ என்பது நவீன தமிழில் இச்சூழலில் இயல்பற்றது. ‘அவருடைய பார்வையில்’ என்பது கண் சார்ந்த எபிரெய உருவகத்தை ஓரளவு காத்துக்கொண்டு, மதிப்பீடு அல்லது ஏற்பு என்ற மரபுத்தொடரின் பொருளையும் இயல்பாகத் தெரிவிக்கிறது.
