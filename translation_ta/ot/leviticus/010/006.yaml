  source_fidelity: 'மூல எபிரெயத்தின் முக்கிய கூறுகள் துல்லியமாகப் பாதுகாக்கப்பட்டுள்ளன: துக்கத்தின் அடையாளமாக தலைமுடியை அவிழவிடுதல், உடைகளைக் கிழித்தல், மரண எச்சரிக்கை, சபைமீது வரக்கூடிய யாவேயின் கோபம், இஸ்ரவேல் வீடு முழுவதும் அழுதல், யாவே ஏற்படுத்திய எரிப்பு ஆகியவை அனைத்தும் இடம்பெற்றுள்ளன. יִקְצֹף-இன் வெளிப்படையற்ற ஒருமை எழுவாயை ‘அவர்’ எனக் கொடுத்திருப்பது சூழலுக்கு ஏற்றது; அடிக்குறிப்பு அதன் இலக்கண மறைமுகத்தன்மையையும் மாற்றுவழியையும் முறையாகக் காக்கிறது.'
  naturalness: நடை நவீன நிலையான தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது. ‘தலைமுடியை அவிழ்ந்த நிலையில் விடாதீர்கள்,’ ‘உடைகளைக் கிழிக்காதீர்கள்,’ மற்றும் ‘எரிப்புக்காக அழட்டும்’ ஆகியவை இயல்பாக வாசிக்கப்படுகின்றன. நிறுத்தற்குறிகளும் மேற்கோள் அமைப்பும் சரியாக உள்ளன.
