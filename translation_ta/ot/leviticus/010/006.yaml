base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/006.yaml
  text: And Moses said to Aaron and to Eleazar and Ithamar his sons[a], “Do not let your heads hang loose, and do not tear your garments, so that you do not die and he become angry with all the congregation. But your brothers, the whole house of Israel[b], shall weep for the burning that Yahweh has kindled.”
translation:
  language: ta
  text: மோசே ஆரோனிடமும், அவனுடைய மகன்களான எலெயாசார், இத்தாமார் ஆகியோரிடமும், “உங்கள் தலைமுடியை அவிழ்ந்த நிலையில் விடாதீர்கள்[a]; உங்கள் உடைகளைக் கிழிக்காதீர்கள். அப்படிச் செய்தால் நீங்கள் சாவீர்கள்; இஸ்ரவேல் சபை முழுவதின்மீதும் அவர் கோபங்கொள்வார்[c]. ஆனால் உங்கள் சகோதரர்களாகிய இஸ்ரவேல் குடும்பத்தார் அனைவரும், யாவே மூட்டிய எரிப்புக்காக[b] அழட்டும்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்கள் தலைகளை மூடாமல் விடாதீர்கள்,” அல்லது “உங்கள் தலைமுடியைச் சீர்குலைந்த நிலையில் விடாதீர்கள்.” எபிரெயச் சொற்றொடர் தலை அல்லது தலைமுடியுடன் தொடர்புடைய ஒரு துக்க அடையாளத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்கு நெருக்கமாக, “யாவே எரித்த எரிப்பு.” இயல்பான தமிழுக்காக “மூட்டிய எரிப்பு” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: c
    text: “கோபங்கொள்வார்” என்பதன் எழுவாய் எபிரெயில் வெளிப்படையாகக் கூறப்படவில்லை; சூழலில் அது யாவேயைக் குறிக்கிறது. மாற்றாக, “சபை முழுவதின்மீதும் கோபம் வரும்.”
    reason: theological_ambiguity
lexical_decisions:
- source_word: רָאשֵׁיכֶם אַל תִּפְרָעוּ
  choice: உங்கள் தலைமுடியை அவிழ்ந்த நிலையில் விடாதீர்கள்
  rationale: פרע இங்கு தலை அல்லது தலைமுடியை ஒழுங்குபடுத்தாமல் அவிழ விட்டிருப்பதைக் குறிக்கிறது; இது துக்கத்தின் அடையாளம். ‘தலையை மூடாமல் விடாதீர்கள்’ என்று மொழிபெயர்த்து தலைமூடியை உரையில் சேர்ப்பதைத் தவிர்த்து, எபிரெயச் சொல்லின் தலைமுடி சார்ந்த பொருள் இயல்பான தமிழில் தரப்படுகிறது.
- source_word: וּבִגְדֵיכֶם לֹא תִפְרֹמוּ
  choice: உங்கள் உடைகளைக் கிழிக்காதீர்கள்
  rationale: פרם என்பது குறிப்பாகத் துக்கத்தின் அடையாளமாக உடைகளைக் கிழிப்பதைக் குறிக்கிறது; நவீனத் தமிழில் இது தெளிவாகவும் நேரடியாகவும் உள்ளது.
- source_word: וְלֹא תָמֻתוּ
  choice: அப்படிச் செய்தால் நீங்கள் சாவீர்கள்
  rationale: தடைகளைத் தொடர்ந்து வரும் மரண எச்சரிக்கையின் விளைவு சார்ந்த வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְעַל כָּל הָעֵדָה יִקְצֹף
  choice: இஸ்ரவேல் சபை முழுவதின்மீதும் அவர் கோபங்கொள்வார்
  rationale: קצף வினை ஒருமையில் உள்ளது; அதன் எழுவாய் உரையில் வெளிப்படையாகக் கூறப்படவில்லை. சூழலில் யாவே குறிக்கப்படுகிறார். ‘கோபம் வரும்’ என்று தன்மையற்றதாக்காமல், எபிரெயின் தனிப்பட்ட செயல்பாட்டை ‘அவர்’ எனப் பாதுகாக்கிறது.
- source_word: וַאֲחֵיכֶם כָּל בֵּית יִשְׂרָאֵל
  choice: உங்கள் சகோதரர்களாகிய இஸ்ரவேல் குடும்பத்தார் அனைவரும்
  rationale: ‘உங்கள் சகோதரர்கள்’ என்ற ஆண்பால் பன்மையைப் பாதுகாத்து, அதனைத் தொடர்ந்து வரும் ‘இஸ்ரவேல் வீடு முழுவதும்’ என்ற தேசியக் கூட்டுப்பெயரை இயல்பான தமிழில் விளக்குகிறது.
- source_word: יִבְכּוּ אֶת הַשְּׂרֵפָה
  choice: எரிப்புக்காக அழட்டும்
  rationale: שׂרפה என்பது தெய்வீக நெருப்பால் நிகழ்ந்த எரிப்பைச் சுட்டுகிறது. ‘தீர்ப்பு’ அல்லது ‘பேரழிவு’ என்று விளக்கிப் பொருள் சேர்க்காமல், மூலத்தின் நேரடியான நெருப்பு உருவகத்தைப் பாதுகாக்கிறது.
- source_word: אֲשֶׁר שָׂרַף יְהוָה
  choice: யாவே மூட்டிய
  rationale: எபிரெயில் ‘யாவே எரித்த எரிப்பு’ என்ற ஒரே வேர்ச்சொல் மீண்டும் வருகிறது. தமிழில் இயல்பற்ற மறுபடியுரையைத் தவிர்க்க ‘மூட்டிய எரிப்பு’ எனத் தரப்படுகிறது; அதேவேளை நிகழ்வின் காரணராக யாவே நேரடியாகக் குறிப்பிடப்படுகிறார்.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநாமத்தின் மெய்யெழுத்துகளான יהוה-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் ‘யாவே’ என்று ஒலிபெயர்க்கிறது.
theological_decisions:
- issue: יִקְצֹף என்பதன் வெளிப்படையாகக் கூறப்படாத எழுவாய்
  choice: அவர் கோபங்கொள்வார்
  alternative: கோபம் சபை முழுவதின்மீதும் வரும்
  rationale: எபிரெயில் எழுவாய் தனியே பெயரிடப்படவில்லை; சூழல் யாவேயைக் குறிக்கிறது. ‘அவர்’ என்பது தனிப்பட்ட தெய்வீகச் செயல்பாட்டைப் பாதுகாக்கிறது; அடிக்குறிப்பு மூலத்தின் இலக்கண மறைமுகத்தன்மையைத் தெரிவிக்கிறது.
- issue: יהוה என்ற திருநாமத்தின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பட்டப்பெயர் அல்ல, உடன்படிக்கைத் திருநாமமே வருகிறது; எனவே அதை ஒலிபெயர்ப்பாகத் தருவது மூல வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: ஆசாரியர்களின் துக்கச் சின்னங்களுக்கான தடை
  choice: தலைமுடியை அவிழ்ந்த நிலையில் விடாதீர்கள்; உடைகளைக் கிழிக்காதீர்கள்
  alternative: தலையை மூடாமல் விடாதீர்கள்; உடைகளைக் கிழிக்காதீர்கள்
  rationale: முதல் சொற்றொடர் தலைமுடி அல்லது தலையின் துக்கத் தோற்றத்தைக் குறிக்கலாம்; குறிப்பிட்ட தலைமூடி வழக்கத்தை உரைக்குள் கொண்டு வராமல் உண்மையான சொற்பொருள் நிச்சயமின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைக் கடைப்பிடிக்கிறது. ‘சபை’, ‘உடைகள்’, ‘தலைமுடி’, ‘எரிப்பு’ போன்ற சொற்கள் சடங்கு மற்றும் நிகழ்வின் உறுதியான படிமங்களைப் பாதுகாக்கின்றன. திருநாமம் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
