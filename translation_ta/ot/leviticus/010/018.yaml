  text: Look, its blood was not brought into the sanctuary, inside. You certainly should have eaten it in the holy place, as I commanded.
translation:
  language: ta
  text: இதோ, அதன் இரத்தம் பரிசுத்த ஸ்தலத்தின் உட்பகுதிக்குள் கொண்டுவரப்படவில்லை.[a] நான் கட்டளையிட்டபடி, அதை நீங்கள் பரிசுத்த இடத்தில் நிச்சயமாக உண்டிருக்க வேண்டியிருந்தது.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பரிசுத்த இடத்திற்குள், உள்ளே.” எபிரெயத்தில் புனிதப் பகுதியைக் குறிக்கும் சொல்லுடன் “உட்புறம்” என்பதும் சேர்ந்து, அதன் உள்ளார்ந்த பகுதி வலியுறுத்தப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் வினை வலியுறுத்தும் வகையில் மீண்டும் வருகிறது; இதன் பொருள், “நீங்கள் நிச்சயமாக உண்டிருக்க வேண்டியிருந்தது” என்பதாகும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: இதோ
  rationale: கூறப்படவிருக்கும் முக்கியக் கருத்தின்மீது கவனத்தைத் திருப்பும் எபிரெயச் சொல்லின் வலியுறுத்தலை, இயல்பான கண்ணியமுள்ள தமிழில் வெளிப்படுத்துகிறது.
- source_word: הוּבָא
  choice: கொண்டுவரப்படவில்லை
  rationale: בוא என்பதன் ஹொஃபால் வடிவத்திலுள்ள செயல்பாட்டு வாய்ப்பாட்டைத் தக்கவைத்து, இரத்தம் உள்ளே கொண்டுவரப்படாததை நேரடியாகக் கூறுகிறது.
- source_word: דָּמָהּ
  choice: அதன் இரத்தம்
  rationale: பெண்பால் ஒருமை விகுதி பாவநிவாரணப் பலியைக் குறிக்கிறது; தமிழில் உயிரினம் அல்லது பலியை இயல்பாகச் சுட்டும் வடிவம் இது.
- source_word: אֶל־הַקֹּדֶשׁ פְּנִימָה
  choice: பரிசுத்த ஸ்தலத்தின் உட்பகுதிக்குள்
  rationale: புனிதப் பகுதிக்குள் செல்லும் திசையையும் פְּנִימָה தரும் ‘உட்புறம்’ என்ற வலியுறுத்தலையும் காக்கிறது; திரைச்சீலைக்கு அப்பால் என்று மூலத்தில் இல்லாத விவரத்தைச் சேர்க்கவில்லை.
- source_word: אָכוֹל תֹּאכְלוּ
  choice: கண்டிப்பாக உண்டிருக்க வேண்டும்
  rationale: வினையெச்ச முழுவடிவத்துடன் வரும் வினைச்சொல்லின் வலியுறுத்தலை ‘கண்டிப்பாக’ என்பதன் மூலம் காட்டுகிறது; சூழலில் ஏற்கெனவே செய்யத் தவறிய கட்டளையை மோசே சுட்டுவதால் ‘உண்டிருக்க வேண்டும்’ பொருத்தமானது.
- source_word: אֹתָהּ
  choice: அதை
  rationale: பெண்பால் ஒருமை நேரடிப் பொருள் சுட்டுப்பெயர் முன்சூழலிலுள்ள பலியைக் குறிக்கிறது.
- source_word: בַּקֹּדֶשׁ
  choice: பரிசுத்த இடத்தில்
  rationale: ஆசாரியர்கள் பலியை உண்ண வேண்டிய நியமிக்கப்பட்ட புனித இடத்தைக் குறிக்கிறது; முன்வரும் உட்பகுதிக்குள் கொண்டுசெல்லும் சொற்றொடரிலிருந்து சடங்கியல் வேறுபாட்டைத் தெளிவாக வைத்திருக்கிறது.
- source_word: כַּאֲשֶׁר צִוֵּיתִי
  choice: நான் கட்டளையிட்டபடி
  rationale: மோசே முன்பு கொடுத்த கட்டளையுடன் ஒப்பிட்டு உரைக்கும் உட்பிரிவைச் சுருக்கமாகவும் நேரடியாகவும் தருகிறது.
theological_decisions:
- issue: வழிபாட்டுச் சடங்குக்குரிய இடவியல் சொற்கள்
  choice: இரத்தம் கொண்டுவரப்படாத இடத்தை ‘பரிசுத்த ஸ்தலத்தின் உட்பகுதிக்குள்’ என்றும், ஆசாரியர்கள் உண்ண வேண்டிய இடத்தை ‘பரிசுத்த இடத்தில்’ என்றும் வேறுபடுத்திக் கூறுதல்
  alternative: இரண்டையும் ‘பரிசுத்த இடத்தில்/இடத்திற்குள்’ என்று ஒரேவிதமாக மொழிபெயர்த்தல்; அல்லது முதல் சொற்றொடரை ‘திரைச்சீலைக்கு அப்பால்’ எனக் குறிப்பாக்குதல்
  rationale: முதல் எபிரெயச் சொற்றொடரில் உள்ளே நோக்கிய இயக்கத்துடன் פְּנִימָה இடம்பெறுகிறது; இரண்டாவது உண்ண வேண்டிய புனித இடத்தை மட்டும் குறிக்கிறது. இந்த வேறுபாடு சடங்கின் தர்க்கத்தைப் பாதுகாக்கிறது; அதேவேளை மூலத்தில் இல்லாத இடவியல் குறிப்பைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் புரியக்கூடிய, ஆனால் லேவியராகமத்தின் சடங்கியல் சூழலுக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பரிசுத்த ஸ்தலம்’ மற்றும் ‘பரிசுத்த இடம்’ என்ற தொடர்புடைய சொற்கள், முதல் சொற்றொடரின் உட்புற இயக்கத்தையும் இரண்டாவது சொற்றொடரின் உண்ணும் இடத்தையும் வேறுபடுத்துகின்றன.
