  text: מַדּ֗וּעַ לֹֽא אֲכַלְתֶּ֤ם אֶת הַֽ/חַטָּאת֙ בִּ/מְק֣וֹם הַ/קֹּ֔דֶשׁ כִּ֛י קֹ֥דֶשׁ קָֽדָשִׁ֖ים הִ֑וא וְ/אֹתָ֣/הּ נָתַ֣ן לָ/כֶ֗ם לָ/שֵׂאת֙ אֶת עֲוֺ֣ן הָ/עֵדָ֔ה לְ/כַפֵּ֥ר עֲלֵי/הֶ֖ם לִ/פְנֵ֥י יְהוָֽה־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/017.yaml
  text: Why did you not eat the sin offering in the holy place? For it is most holy[a], and he has given it to you to bear the iniquity of the congregation, to make atonement for them before Yahweh.
translation:
  language: ta
  text: “பாவநிவாரணப் பலியை[a] நீங்கள் ஏன் பரிசுத்த இடத்தில் சாப்பிடவில்லை? அது மிகப் பரிசுத்தமானது. சபையின் அக்கிரமத்தைச் சுமப்பதற்கும், யாவேயின் முன்னிலையில் அவர்களுக்காகப் பாவநிவிர்த்தி செய்வதற்கும் அவர் அதை உங்களுக்குக் கொடுத்திருக்கிறார்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தூய்மைப்படுத்தும் பலி.” எபிரெயச் சொல் חַטָּאת பாவத்தைச் சார்ந்த பலியையும், சடங்கு அசுத்தத்தை நீக்கும் பலியையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַדּוּעַ לֹא אֲכַלְתֶּם
  choice: ஏன் சாப்பிடவில்லை?
  rationale: கண்டனச் சூழலில் காரணத்தைக் கேட்கும் நேரடியான வினாவாக இயல்பான நவீனத் தமிழில் தரப்பட்டுள்ளது; பன்மை மரியாதை/எண்ணை வினைமுற்றே காட்டுகிறது.
- source_word: הַחַטָּאת
  choice: பாவநிவாரணப் பலி
  rationale: இங்கு சொல் பாவத்தை மட்டும் அல்ல, ஆசாரியர்கள் உண்ண வேண்டிய பலியைக் குறிக்கிறது. ‘பாவநிவாரணப் பலி’ என்பது பலியின் தன்மையையும் நோக்கத்தையும் தெளிவாகக் காட்டுகிறது; தூய்மைப்படுத்தும் பலி என்ற பொருள்சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: בִּמְקוֹם הַקֹּדֶשׁ
  choice: பரிசுத்த இடத்தில்
  rationale: ஆசாரியர்கள் பலியை உண்ண நியமிக்கப்பட்ட புனிதப் பகுதியைக் குறிக்கும் எளிய, நேரடியான மொழிபெயர்ப்பு.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: மகா பரிசுத்தமானது
  rationale: எபிரெயச் சொற்றொடரின் உயர்நிலைப் பொருளைத் தமிழில் இயல்பாகத் தெரிவிக்கிறது; உள்ளரங்கமான ‘மகா பரிசுத்த ஸ்தலம்’ என்பதோடு குழப்பம் ஏற்படாமல் இருக்க பெயரடைப் பயன்பாடு தேர்ந்தெடுக்கப்பட்டது.
- source_word: וְאֹתָהּ נָתַן לָכֶם
  choice: அவர் அதை உங்களுக்குக் கொடுத்திருக்கிறார்
  rationale: வெளிப்படையாகச் சொல்லப்படாத ஒருமை ஆண்பால் எழுவாய் சூழலில் கடவுளைக் குறிக்கிறது. அதை ‘அவர்’ என்று வைத்திருப்பது எபிரெய வினை வடிவத்தையும் சூழலையும் காக்கிறது.
- source_word: לָשֵׂאת אֶת עֲוֺן הָעֵדָה
  choice: சபையாரின் அக்கிரமத்தைச் சுமந்து
  rationale: נשא עון என்பதிலுள்ள ‘சுமத்தல்/சுமத்திக்கொள்ளுதல்’ என்ற பிரதிநிதித்துவ மற்றும் வழிபாட்டு நெருக்கடியைத் தீர்க்காமல் காக்கிறது. עָוֹן என்பதற்கு ‘அக்கிரமம்’ என்பது குற்றநிலை சார்ந்த வலிமையைப் பாதுகாக்கிறது.
- source_word: הָעֵדָה
  choice: சபையார்
  rationale: உடன்படிக்கைச் சமூகமாகக் கூடிய இஸ்ரவேல் மக்களைக் குறிக்கும் கூட்டுப்பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: לְכַפֵּר עֲלֵיהֶם
  choice: அவர்களுக்காகப் பாவநிவிர்த்தி செய்வதற்காக
  rationale: பலியிடும் சூழலில் כפר என்பதன் நிறுவப்பட்ட வழிபாட்டு அர்த்தத்தைப் பாதுகாக்கிறது; அதன் செயல்முறையைத் தேவையின்றி குறிப்பாக்கவில்லை.
- source_word: לִפְנֵי יְהוָה
  choice: யெகோவாவின் முன்னிலையில்
  rationale: தெய்வீகப் பெயரை ஒலிபெயர்த்து, கடவுளுடைய சந்நிதியில் நடைபெறும் வழிபாட்டு செயலை இயல்பான தமிழில் காட்டுகிறது.
theological_decisions:
- issue: חַטָּאת என்ற பலிச்சொல்லின் மொழிபெயர்ப்பு
  choice: பாவநிவாரணப் பலி
  alternative: தூய்மைப்படுத்தும் பலி
  rationale: சூழலில் இது ஒரு பலியைக் குறிக்கிறது என்பது தெளிவு. பாவத்தைச் சார்ந்த பொருளும் தூய்மைப்படுத்தும் செயல்பாடும் இரண்டும் சொல் வரம்பில் உள்ளதால், வழக்கில் புரியக்கூடிய வடிவம் முதன்மை உரையிலும் மாற்றுப் பொருள் அடிக்குறிப்பிலும் தரப்பட்டுள்ளது.
- issue: נָתַן என்பதன் மறைமுக எழுவாய்
  choice: ‘அவர்’ என்று வெளிப்படுத்தி, கடவுளைக் குறிப்பதாக வைத்தல்
  alternative: ‘அது உங்களுக்குக் கொடுக்கப்பட்டது’ என்ற செயப்பாட்டு வடிவம்
  rationale: எபிரெயத்தில் மூன்றாம் நபர் ஒருமை வினை உள்ளது; சூழலில் இந்த ஆசாரியப் பங்கை அளித்தவர் கடவுள். ‘அவர்’ என்பது இந்த இயல்பான தொடர்பைப் பாதுகாக்கிறது.
- issue: ஆசாரியர்கள் சபையாரின் அக்கிரமத்தைச் ‘சுமத்தல்’
  choice: சுமந்து
  alternative: அக்கிரமத்தின் தண்டனையை ஏற்று
  rationale: மூலத்தின் לשאת עון சொற்றொடர் குற்றம், குற்றப்பொறுப்பு அல்லது அதன் விளைவைச் சுமத்தல் எனப் பரந்த நெருக்கடியைக் கொண்டுள்ளது. ‘சுமந்து’ என்பது குறிப்பிட்ட பரிகாரக் கோட்பாட்டை இறக்குமதி செய்யாமல் அந்தத் தெய்வவியல் அழுத்தத்தைத் திறந்தே வைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமான ஆனால் பொதுவாசகர்கள் புரிந்துகொள்ளக்கூடிய நடை பயன்படுத்தப்பட்டுள்ளது. ‘மகா பரிசுத்தமானது,’ ‘அக்கிரமத்தைச் சுமந்து,’ ‘பாவநிவிர்த்தி’ போன்ற சொற்கள் மூலத்தின் வழிபாட்டு மற்றும் தெய்வவியல் செறிவைக் காக்கின்றன.
