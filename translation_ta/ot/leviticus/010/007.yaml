id: LEV.10.7
reference: Leviticus 10:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וּ/מִ/פֶּתַח֩ אֹ֨הֶל מוֹעֵ֜ד לֹ֤א תֵֽצְאוּ֙ פֶּן תָּמֻ֔תוּ כִּי שֶׁ֛מֶן מִשְׁחַ֥ת יְהוָ֖ה עֲלֵי/כֶ֑ם וַֽ/יַּעֲשׂ֖וּ כִּ/דְבַ֥ר מֹשֶֽׁה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/007.yaml
  text: And you shall not go out from the entrance of the tent of meeting, lest you die, because the anointing oil of Yahweh is on you.” And they did according to the word of Moses.
translation:
  language: ta
  text: “சந்திப்புக் கூடாரத்தின் நுழைவாயிலைவிட்டு வெளியேற வேண்டாம்; இல்லையெனில் நீங்கள் இறந்துபோவீர்கள். ஏனெனில் யாவேயின் அபிஷேக எண்ணெய் உங்கள் மேல் இருக்கிறது.” அவர்கள் மோசேயின் வார்த்தையின்படியே செய்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִפֶּתַח
  choice: நுழைவாயிலிலிருந்து
  rationale: פֶּתַח என்பது இங்கு கூடாரத்தின் நுழைவிடத்தைக் குறிக்கிறது; ‘நுழைவாயில்’ நவீன தமிழில் இயல்பாகவும் துல்லியமாகவும் உள்ளது. מִן என்பதன் ‘இலிருந்து’ பொருளும் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
- source_word: אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரம்
  rationale: இது பரிசுத்த இடத்தைக் குறிக்கும் நிலையான வழிபாட்டுச் சொற்றொடர். ‘சந்திப்புக் கூடாரம்’ என்பது தேவன் தமது மக்களைச் சந்திக்கும் இடம் என்ற தொடர்பைத் தெளிவாகக் காக்கிறது.
- source_word: לֹא תֵצְאוּ
  choice: நீங்கள் வெளியே செல்ல வேண்டாம்
  rationale: எதிர்மறை வினை வடிவம் இங்கு கட்டளையான தடையைத் தெரிவிக்கிறது. இந்தத் தமிழ் வடிவம் மரியாதையுடனும் தெளிவான கட்டளை வலிமையுடனும் உள்ளது.
- source_word: פֶּן תָּמֻתוּ
  choice: சென்றால் இறந்துபோவீர்கள்
  rationale: פֶּן எச்சரிக்கப்படும் விளைவை அறிமுகப்படுத்துகிறது. தமிழில் ‘சென்றால்’ எனத் தடைக்கப்பட்ட செயலை வெளிப்படையாக்குவது இயல்பாக இருந்து, மரணம் என்ற தீவிர விளைவையும் காக்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: இங்கு כִּי தடைக்கான காரணத்தைக் கொடுக்கிறது; ‘ஏனெனில்’ இந்த காரணத் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: שֶׁמֶן מִשְׁחַת יְהוָה
  choice: யாவேயின் அபிஷேக எண்ணெய்
  rationale: கட்டமைப்புத் தொடர் யாவேக்கு உரிய அல்லது அவரால் நியமிக்கப்பட்ட திருநிலைப்படுத்தும் எண்ணெயைக் குறிக்கிறது. ‘அபிஷேக எண்ணெய்’ என்பது வழிபாட்டுச் சூழலில் பரவலாகப் புரியப்படும் சொல்.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான நான்கெழுத்துத் திருப்பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: עֲלֵיכֶם
  choice: உங்கள்மேல் இருக்கிறது
  rationale: எண்ணெய் அவர்கள்மேல் இருப்பதையும் அதனால் அவர்களுடைய அர்ப்பணிக்கப்பட்ட ஆசாரிய நிலை தொடர்வதையும் எளிய, நேரடியான தமிழில் தெரிவிக்கிறது.
- source_word: וַיַּעֲשׂוּ
  choice: அவர்கள் ... செய்தார்கள்
  rationale: வாவ் தொடர்வினை கதையை முன்னெடுக்கிறது; தமிழில் தனியே ‘மேலும்’ சேர்க்காமல் அடுத்த வாக்கியமாக அமைப்பது இயல்பான தொடர்ச்சியை அளிக்கிறது.
- source_word: כִּדְבַר מֹשֶׁה
  choice: மோசேயின் வார்த்தையின்படியே
  rationale: כְּ என்பது இணக்கத்தையும் דְבַר என்பது மோசே கூறிய கட்டளையையும் குறிக்கிறது. ‘வார்த்தையின்படியே’ மூலத்தின் வடிவத்தை காத்து முழுமையான கீழ்ப்படிதலையும் தெரிவிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் பட்டம் அல்ல, தனிப்பட்ட உடன்படிக்கைப் பெயரான יהוה நேரடியாக உள்ளது. அதனை ‘யாவே’ என ஒலிபெயர்ப்பது பெயருக்கும் பட்டத்துக்கும் உள்ள வேறுபாட்டைக் காக்கிறது.
- issue: அபிஷேக எண்ணெய் ‘உங்கள்மேல்’ இருப்பதன் பொருள்
  choice: உங்கள்மேல் இருக்கிறது என்ற மூல உருவகத்தை அப்படியே காத்தல்
  alternative: நீங்கள் அபிஷேகம் செய்யப்பட்டிருக்கிறீர்கள் என்று விளக்கமாக மொழிபெயர்த்தல்
  rationale: எண்ணெய் அவர்கள்மேல் உள்ளது என்ற மூலத்தின் தெளிவான உடல் மற்றும் திருநிலைப்படுத்தல் உருவகத்தை விளக்கவுரையால் மாற்றாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமான நடை. கட்டளையின் தீவிரமும் எச்சரிக்கையின் நேரடித்தன்மையும் காக்கப்பட்டுள்ளன. தேவையற்ற பழமையான வினைமுற்றுகளும் சமயப்பிரிவு சார்ந்த விளக்கங்களும் தவிர்க்கப்பட்டுள்ளன.
