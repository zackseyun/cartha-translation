revisions:
- from: “சந்திப்புக் கூடாரத்தின் நுழைவாயிலிலிருந்து நீங்கள் வெளியே செல்ல வேண்டாம்; சென்றால் இறந்துபோவீர்கள். ஏனெனில் யாவேயின் அபிஷேக எண்ணெய் உங்கள்மேல் இருக்கிறது.” அவர்கள் மோசேயின் வார்த்தையின்படியே செய்தார்கள்.
