  text: to distinguish between the holy and the common[a], and between the unclean and the clean[b],
translation:
  language: ta
  text: புனிதமானதையும் சாதாரணமானதையும்[a], தீட்டானதையும் தூய்மையானதையும்[b] வேறுபடுத்துவதற்காக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘புனிதமானதையும் புனிதமற்றதையும்.’ எபிரெயச் சொற்கள் புனிதமாகப் பிரித்து வைக்கப்பட்டதையும் அவ்வாறு பிரித்து வைக்கப்படாததையும் வேறுபடுத்துகின்றன; இங்கு ‘சாதாரணமானது’ என்பது அவமதிப்பு அல்லது தெய்வநிந்தை என்ற பொருளைக் குறிப்பதில்லை.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, சடங்குமுறைப்படி தீட்டானதையும் சடங்குமுறைப்படி தூய்மையானதையும்.
    reason: cultural_note
lexical_decisions:
- source_word: וּלֲהַבְדִּיל
  choice: வேறுபடுத்துவதற்காக
  rationale: முந்தைய வசனத்துடன் தொடரும் நோக்கத்தை எபிரெய முன்னொட்டுடன் கூடிய வினையெச்ச வடிவம் தெரிவிக்கிறது. ‘வேறுபடுத்துவதற்காக’ என்பது பிரிவுகளைப் பகுத்தறியும் ஆசாரியப் பொறுப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בֵּין
  choice: இடையில்
  rationale: மீண்டும் வரும் இந்த முன்னிடைச்சொல், இணையாகக் கொடுக்கப்பட்ட இரு வகைகளுக்கு இடையிலான வேறுபாட்டைக் குறிக்கிறது.
- source_word: הַקֹּדֶשׁ
  choice: புனிதமானது
  rationale: குறிப்பிட்ட ஒரு பொருளை மட்டும் அல்லாமல், கடவுளுக்கெனப் பிரித்து வைக்கப்பட்டவற்றின் வகையை இச்சொல் குறிக்கிறது.
- source_word: הַחֹל
  choice: சாதாரணமானது
  rationale: இது புனிதமாகப் பிரித்து வைக்கப்படாத வகையைக் குறிக்கிறது; அவமதிப்பு அல்லது தீமை என்ற பொருளை அவசியமாகக் கொண்டதல்ல. ‘சாதாரணமானது’ அந்த வேறுபாட்டைத் தெளிவாகக் காட்டுகிறது.
- source_word: הַטָּמֵא
  choice: தீட்டானது
  rationale: லேவியராகமத்தின் சூழலில் இது முதன்மையாகச் சடங்குமுறைத் தீட்டின் நிலையைக் குறிக்கிறது; தமிழில் நிலைபெற்ற வேதாகமச் சொல்லாட்சியான ‘தீட்டானது’ அந்தச் சூழலைப் பாதுகாக்கிறது.
- source_word: הַטָּהוֹר
  choice: தூய்மையானது
  rationale: ‘தீட்டானது’ என்பதற்கு இணையான எதிர்ச்சொல்லாக இது சடங்குமுறைத் தூய்மை நிலையைக் குறிக்கிறது.
theological_decisions:
- issue: קֹדֶשׁ என்பதற்கும் חֹל என்பதற்கும் இடையிலான ஆசாரியப் புனித வகைப்பாடு
  choice: புனிதமானது / சாதாரணமானது
  alternative: புனிதமானது / புனிதமற்றது
  rationale: חֹל என்பது இங்கு தீயதையோ அவமதிப்பையோ அல்ல, புனிதமாகப் பிரித்து வைக்கப்படாத சாதாரண வகையையே குறிக்கிறது. ஆகவே நவீன வாசகர்கள் தவறான அறநெறிப் பொருளைக் கொள்ளாதவாறு ‘சாதாரணமானது’ தேர்ந்தெடுக்கப்பட்டது.
- issue: טָמֵא / טָהוֹר ஆகியவற்றின் இயல்பு
  choice: சடங்குமுறை நிலைகளாகத் தீட்டானது / தூய்மையானது
  alternative: அசுத்தமானது / சுத்தமானது
  rationale: லேவியராகமத்தின் ஆசாரியச் சட்டச் சூழலில் இவை முதன்மையாகச் சடங்குமுறை நிலைகளைக் குறிக்கின்றன; ஒவ்வொரு தீட்டு நிலையையும் ஒழுக்கக் குற்றமாக மாற்றிப் புரிந்துகொள்வதை மொழிபெயர்ப்பு தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. வசனம் முந்தைய வாக்கியத்துடன் இலக்கண ரீதியாகத் தொடர்வதால் இறுதியில் ‘வேறுபடுத்துவதற்காக’ என நோக்கவினை வடிவம் வைக்கப்பட்டுள்ளது. எபிரெய மூலத்தின் இரட்டை இணை அமைப்பைப் பாதுகாக்க ‘இடையிலும் ... இடையிலும்’ பயன்படுத்தப்பட்டுள்ளது.
