  text: שׁ֣וֹק הַ/תְּרוּמָ֞ה וַ/חֲזֵ֣ה הַ/תְּנוּפָ֗ה עַ֣ל אִשֵּׁ֤י הַ/חֲלָבִים֙ יָבִ֔יאוּ לְ/הָנִ֥יף תְּנוּפָ֖ה לִ/פְנֵ֣י יְהוָ֑ה וְ/הָיָ֨ה לְ/ךָ֜ וּ/לְ/בָנֶ֤י/ךָ אִתְּ/ךָ֙ לְ/חָק עוֹלָ֔ם כַּ/אֲשֶׁ֖ר צִוָּ֥ה יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/015.yaml
  text: They shall bring the thigh of the contribution and the breast of the wave offering[a], along with the food offerings of the fat portions, to wave as a wave offering before Yahweh; and it shall be for you and for your sons with you as a permanent statute[d][c][b], just as Yahweh commanded.
translation:
  language: ta
  text: காணிக்கையாக ஒதுக்கப்பட்ட தொடையையும்[a] அசைவாட்டுக் காணிக்கையின் மார்புப் பகுதியையும், கொழுப்புப் பகுதிகளை நெருப்பில் செலுத்தும் காணிக்கைகளுடன் கொண்டுவந்து, யாவேக்கு[c] முன்பாக அசைவாட்டுக் காணிக்கையாக அசைவாட்ட வேண்டும்; யாவே கட்டளையிட்டபடியே, அது உனக்கும் உன்னோடு இருக்கும் உன் மகன்களுக்கும் நிரந்தர உரிமையாக இருக்கும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தொடை” என்பதை “மேல்கால் பகுதி” என்றும் மொழிபெயர்க்கலாம். “அசைவாட்டுக் காணிக்கை” என்பது யாவேக்கு முன்பாகச் சடங்குமுறையில் அசைத்துக் காட்டிச் சமர்ப்பிக்கப்படும் காணிக்கையைக் குறிக்கிறது.
    reason: lexical_and_cultural_note
  - marker: b
    text: “நிரந்தர உரிமை” என்பதை “நிரந்தர நியமம்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: “யாவே” என்பது எபிரெய மூலத்தில் உள்ள YHWH என்ற இறைப் பெயரைக் குறிக்கிறது.
    reason: divine_name_note
lexical_decisions:
- source_word: שׁוֹק הַתְּרוּמָה
  choice: காணிக்கையாக ஒதுக்கப்பட்ட தொடை
  rationale: שׁוֹק என்பது பலியிடப்பட்ட விலங்கின் தொடை அல்லது மேல்கால் பகுதியைக் குறிக்கிறது; תְּרוּמָה அந்தப் பகுதி காணிக்கையாகப் பிரித்தெடுக்கப்பட்டதைத் தெரிவிக்கிறது.
- source_word: חֲזֵה הַתְּנוּפָה
  choice: அசைவாட்டுக் காணிக்கையின் மார்புப் பகுதி
  rationale: חָזֶה என்பது பலிச்சடங்கில் மார்புப் பகுதியையும், תְּנוּפָה யாவேக்கு முன் சடங்குமுறையில் அசைத்துக் காட்டப்படும் காணிக்கையையும் குறிக்கிறது.
- source_word: עַל אִשֵּׁי הַחֲלָבִים
  choice: கொழுப்புப் பகுதிகளாகிய நெருப்புக் காணிக்கைகளுடன்
  rationale: עַל இங்கு உடன் அல்லது அதனோடு என்ற இணைப்பு பொருளைத் தருகிறது; אִשֵּׁי என்பது நெருப்பில் செலுத்தப்படும் காணிக்கைகளையும் הַחֲלָבִים பலிக்குரிய கொழுப்புப் பகுதிகளையும் குறிக்கிறது.
- source_word: לְהָנִיף תְּנוּפָה
  choice: அசைவாட்டுக் காணிக்கையாக அசைவாட்ட
  rationale: வினைச்சொல்லும் அதே வேரிலான பெயர்ச்சொல்லும் சேர்ந்துள்ள எபிரெய அமைப்பை, சடங்குச் செயலும் காணிக்கை வகையும் தெளிவாகத் தெரியுமாறு பாதுகாக்கிறது.
- source_word: לִפְנֵי יְהוָה
  choice: யாவேக்கு முன்பாக
  rationale: לִפְנֵי என்பது முன்னிலையில் அல்லது முன்பாக என்பதையும், יהוה இறைப் பெயரையும் குறிக்கிறது.
- source_word: לְחָק עוֹלָם
  choice: நிரந்தர உரிமையாக
  rationale: חֹק என்பது சூழல்படி நிர்ணயிக்கப்பட்ட பங்கு அல்லது உரிமையைக் குறிக்க முடியும்; இங்கு ஆசாரியர்களுக்குக் கிடைக்கும் பலிப்பங்கைக் குறித்திருப்பதால் 'உரிமை' இயல்பாகவும் துல்லியமாகவும் உள்ளது. עוֹלָם அதன் தொடர்ந்த நிலையைச் சுட்டுகிறது.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה
  choice: யாவே கட்டளையிட்டபடியே
  rationale: ஒப்புமைத் தொடர்பையும் முந்தைய இறைக் கட்டளைக்கு ஏற்ப நிகழ்வதையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பொதுப்பட்டம் அல்ல, தனிப்பட்ட உடன்படிக்கைப் பெயரான יהוה உள்ளது; அதனைத் தமிழில் ஒலிபெயர்த்து வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: לְחָק עוֹלָם என்பதன் பொருள்
  choice: நிரந்தர உரிமை
  alternative: நிரந்தர நியமம்
  rationale: இந்தச் சூழலில் தொடையும் மார்புப் பகுதியும் ஆரோனுக்கும் அவன் மகன்களுக்கும் உரிய பங்காக இருப்பதே மையம். 'நியமம்' சட்டத்தன்மையை வலியுறுத்தினாலும், 'உரிமை' பெறப்படும் பங்கின் பொருளைத் தெளிவாக்குகிறது; மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- issue: תְּנוּפָה சடங்குச் சொல்லின் மொழிபெயர்ப்பு
  choice: அசைவாட்டுக் காணிக்கை
  alternative: சமர்ப்பணக் காணிக்கை
  rationale: மூலத்தில் அதே வேரைச் சேர்ந்த 'அசைத்தல்' என்ற வினையும் காணிக்கையின் பெயரும் இணைந்துள்ளதால், சடங்கு அசைவைக் காட்டும் சொல்லைத் தக்கவைத்துள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சட்ட மற்றும் பலிச்சடங்கு சூழலுக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. நீண்ட எபிரெய வாக்கியம் வாசிப்புத் தெளிவுக்காக மூன்று தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது; ஒருமை உரிமையாளர் 'உனக்கும்' என்பதும் பன்மைச் செய்பவர் குறித்த மறைமுக எழுவாயும் பாதுகாக்கப்பட்டுள்ளன.
