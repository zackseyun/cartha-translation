revisions:
- from: காணிக்கையாக ஒதுக்கப்பட்ட தொடையையும் அசைவாட்டுக் காணிக்கையின் மார்புப் பகுதியையும்[a], கொழுப்புப் பகுதிகளாகிய நெருப்புக் காணிக்கைகளுடன் கொண்டுவர வேண்டும். அவற்றை யாவேக்கு முன்பாக அசைவாட்டுக் காணிக்கையாக அசைவாட்ட வேண்டும். யாவே கட்டளையிட்டபடியே, அது உனக்கும் உன்னோடு இருக்கும் உன் மகன்களுக்கும் நிரந்தர உரிமையாக இருக்கும்[b][c].
  to: காணிக்கையாக ஒதுக்கப்பட்ட தொடையையும்[a] அசைவாட்டுக் காணிக்கையின் மார்புப் பகுதியையும், கொழுப்புப் பகுதிகளை நெருப்பில் செலுத்தும் காணிக்கைகளுடன் கொண்டுவந்து, யாவேக்கு[c] முன்பாக அசைவாட்டுக் காணிக்கையாக அசைவாட்ட வேண்டும்; யாவே கட்டளையிட்டபடியே, அது உனக்கும் உன்னோடு இருக்கும் உன் மகன்களுக்கும் நிரந்தர உரிமையாக இருக்கும்[b].
  rationale: The revision clarifies that the fat portions are the portions offered by fire, rather than defining the fire offerings as fat portions. It also restores the close syntactic connection between bringing and ritual waving, and relocates the divine-name footnote to its explicit referent. No theological interpretation has been added.
