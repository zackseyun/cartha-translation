source:
  edition: WLC
  text: יַ֣יִן וְ/שֵׁכָ֞ר אַל תֵּ֣שְׁתְּ אַתָּ֣ה וּ/בָנֶ֣י/ךָ אִתָּ֗/ךְ בְּ/בֹאֲ/כֶ֛ם אֶל אֹ֥הֶל מוֹעֵ֖ד וְ/לֹ֣א תָמֻ֑תוּ חֻקַּ֥ת עוֹלָ֖ם לְ/דֹרֹתֵי/כֶֽם־׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/009.yaml
  text: You and your sons with you shall not drink wine or strong drink when you enter the tent of meeting[a], lest you die[c][b]. It is a permanent statute throughout your generations.
translation:
  language: ta
  text: நீங்கள் சாகாதபடி,[a] நீயும் உன்னோடிருக்கும் உன் மகன்களும் சந்திப்புக் கூடாரத்துக்குள் நுழையும்போது திராட்சை மதுவையோ வேறு போதை தரும் பானத்தையோ குடிக்கக் கூடாது. இது உங்கள் தலைமுறைகள்தோறும் நிரந்தரமான விதிமுறை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தை, “இல்லையெனில் நீங்கள் சாவீர்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: יַיִן
  choice: திராட்சை மது
  rationale: திராட்சையிலிருந்து தயாரிக்கப்படும் மதுவைக் குறிக்கும் வழக்கமான எபிரேயச் சொல்; அடுத்துள்ள שֵׁכָר என்பதிலிருந்து இதன் வேறுபாட்டைத் தெளிவாக்குகிறது.
- source_word: שֵׁכָר
  choice: வேறு போதை மதுபானம்
  rationale: திராட்சை மது அல்லாத, போதையூட்டும் மதுவகைகளைப் பரவலாகக் குறிக்கிறது. ‘பீர்’ என்பது பொருளைத் தேவையின்றிக் குறுக்கிவிடும்.
- source_word: אַל תֵּשְׁתְּ
  choice: குடிக்கக் கூடாது
  rationale: אַ֫ל உடன் வரும் வினை வடிவம் நேரடியான தடையைத் தெரிவிக்கிறது; நவீனத் தமிழில் இயல்பான சட்டக் கட்டளையாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: אַתָּה וּבָנֶיךָ אִתָּךְ
  choice: நீயும் உன்னோடு உன் மகன்களும்
  rationale: ஆரோனையும் அவனோடிருக்கும் மகன்களையும் வெளிப்படையாக உள்ளடக்கும் மூலமொழியின் வலியுறுத்தலைப் பேணுகிறது.
- source_word: בְּבֹאֲכֶם אֶל אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரத்துக்குள் நுழையும்போது
  rationale: தடை எந்தச் சூழலில் பொருந்துகிறது என்பதைச் சுட்டும் காலநிலைத் தொடரைத் துல்லியமாகக் காட்டுகிறது.
- source_word: חֻקַּת עוֹלָם לְדֹרֹתֵיכֶם
  choice: தலைமுறைதோறும் உங்களுக்குரிய நிரந்தரச் சட்டம்
  rationale: தொடர்ந்து வரும் தலைமுறைகளுக்கும் பொருந்தும் நிலையான சட்டம் என்ற உடன்படிக்கைச் சட்டநடையை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: மரண எச்சரிக்கையின் இலக்கண வலிமை
  choice: இல்லையெனில் நீங்கள் சாவீர்கள்
  alternative: நீங்கள் சாகாதபடி
  rationale: וְלֹא תָמֻתוּ என்ற தொடர் தடையை மீறுவதால் நேரக்கூடிய மரணத்தை எச்சரிக்கிறது. முதன்மை உரை தமிழில் அதன் விளைவு சார்ந்த வலிமையைத் தெளிவாக்குகிறது; நோக்கம் அல்லது தடுப்பு நுணுக்கமுள்ள மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- issue: தடையின் வரம்பு
  choice: சந்திப்புக் கூடாரத்துக்குள் நுழையும் சூழலுக்கே மொழிபெயர்ப்பில் தடை இணைக்கப்பட்டுள்ளது
  alternative: ஆசாரியர்கள் எல்லாச் சூழல்களிலும் மதுபானம் அருந்துவதற்கான முழுமையான தடை
  rationale: בְּבֹאֲכֶם என்ற காலநிலைத் தொடர் கட்டளையின் சூழலை வரையறுக்கிறது. மூலத்தில் இல்லாத பொதுவான மதுவிலக்குக் கோட்பாடு சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டக் கட்டளைக்கேற்ற கண்ணியமான ஆனால் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘சந்திப்புக் கூடாரம்’ வழிபாட்டிடத்தின் பெயராக இயல்பாகவும் நிலைத்தும் தரப்பட்டுள்ளது; தடையின் சூழல் தேவையின்றி விரிவுபடுத்தப்படவில்லை.
