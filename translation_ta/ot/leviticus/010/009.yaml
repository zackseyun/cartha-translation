revisions:
- from: நீயும் உன்னோடு உன் மகன்களும் சந்திப்புக் கூடாரத்துக்குள் நுழையும்போது, திராட்சை மதுவையோ வேறு போதை மதுபானத்தையோ குடிக்கக் கூடாது; இல்லையெனில் நீங்கள் சாவீர்கள்.[a] இது தலைமுறைதோறும் உங்களுக்குரிய நிரந்தரச் சட்டம்.
  to: நீங்கள் சாகாதபடி,[a] நீயும் உன்னோடிருக்கும் உன் மகன்களும் சந்திப்புக் கூடாரத்துக்குள் நுழையும்போது திராட்சை மதுவையோ வேறு போதை தரும் பானத்தையோ குடிக்கக் கூடாது. இது உங்கள் தலைமுறைகள்தோறும் நிரந்தரமான விதிமுறை.
  rationale: The revision follows the Hebrew clause order only insofar as natural Tamil permits, placing the purpose/preventative death clause before the prohibition. It preserves the command's contextual limit—entry into the tent of meeting—and retains a non-doctrinal alternative consequence-oriented rendering in the footnote.
