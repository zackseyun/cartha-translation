base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/016.yaml
  text: Moses diligently searched for the goat of the sin offering[a], and behold, it had been burned up. So he was angry with Eleazar and with Ithamar, Aaron’s remaining sons, saying[c][b],
translation:
  language: ta
  text: 'மோசே பாவநிவாரணப் பலிக்கான வெள்ளாட்டுக்கடாவைக் கவனமாகத் தேடினார்[a]. இதோ, அது எரிக்கப்பட்டிருந்தது[b]. ஆகவே அவர் ஆரோனின் எஞ்சிய மகன்களான[c] எலெயாசார்மீதும் இத்தாமார்மீதும் கோபமடைந்து, சொன்னார்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வெள்ளாட்டுக்கடாவைத் தேடித் தேடிப் பார்த்தார்.’ செயலை வலியுறுத்த எபிரெயத்தில் வினைச்சொல் இரு தொடர்புடைய வடிவங்களில் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அது முற்றிலும் எரிக்கப்பட்டிருந்தது.’ மோசே அதைக் கண்டபோது அது எரிக்கப்பட்ட நிலையில் இருந்ததாக எபிரெய வடிவம் குறிப்பிடுகிறது.
    reason: lexical_alternative
  - marker: c
    text: ‘ஆரோனின் எஞ்சிய மகன்கள்’ என்பது நாதாபும் அபிகூவும் இறந்தபின் எஞ்சிய எலெயாசாரையும் இத்தாமாரையும் குறிக்கிறது (லேவியராகமம் 10:1–2, 12).
    reason: cross_reference
lexical_decisions:
- source_word: שְׂעִיר הַחַטָּאת
  choice: பாவநிவாரணப் பலிக்கான வெள்ளாட்டுக்கடா
  rationale: שְׂעִיר என்பது ஆண் வெள்ளாட்டைக் குறிக்கிறது; הַחַטָּאת இங்கு பலிவகையைக் குறிக்கிறது. இயல்பான நவீனத் தமிழில் இரண்டையும் தெளிவாகக் காட்ட இந்தச் சொற்றொடர் தேர்ந்தெடுக்கப்பட்டது.
- source_word: דָּרֹשׁ דָּרַשׁ
  choice: கவனமாகத் தேடினார்
  rationale: வினையெச்ச மூலவடிவமும் வரையறுக்கப்பட்ட வினையும் சேர்ந்த இந்த எபிரெய அமைப்பு செயலை வலியுறுத்துகிறது. சொற்களை இயந்திரமாக இரட்டிப்பதற்குப் பதிலாக, அதன் வலியுறுத்தலை இயல்பான தமிழில் ‘கவனமாக’ என்பதால் வெளிப்படுத்துகிறது.
- source_word: וְהִנֵּה
  choice: ஆனால் இதோ
  rationale: הִנֵּה திடீர் கண்டுபிடிப்பை வாசகரின் கவனத்திற்குக் கொண்டுவருகிறது. ‘இதோ’ அந்தக் கதைநடை வலியுறுத்தலைத் தக்கவைக்கிறது; சூழலிலுள்ள எதிர்பாராத நிலையை ‘ஆனால்’ இயல்பாக இணைக்கிறது.
- source_word: שֹׂרָף
  choice: அது எரிக்கப்பட்டிருந்தது
  rationale: செயப்பாட்டு வினையெச்ச வடிவம், மோசே கண்டபோது வெள்ளாட்டுக்கடா எரிக்கப்பட்ட நிலையில் இருந்ததைக் குறிக்கிறது. முழுமையாக எரிக்கப்பட்டதா என்ற சாத்தியத்தை அடிக்குறிப்பில் வைத்துப் பிரதான உரை மூலத்தின் அளவான சொல்லாட்சியைப் பாதுகாக்கிறது.
- source_word: וַיִּקְצֹף
  choice: கோபமடைந்து
  rationale: இந்த வினை கோபத்தைக் குறிக்கிறது. ‘கோபமடைந்து’ என்பது தீவிரத்தை மிகைப்படுத்தாமல் அடுத்த பேச்சுவினையுடன் இயல்பாக இணைகிறது.
- source_word: הַנּוֹתָרִם
  choice: எஞ்சிய
  rationale: நாதாபும் அபிகூவும் இறந்தபின் மீந்திருந்த ஆரோனின் மகன்களை இந்தப் பெயரெச்சம் அடையாளப்படுத்துகிறது. ‘எஞ்சிய’ என்பது சுருக்கமானதும் சூழலுக்கு ஏற்றதுமாகும்.
- source_word: לֵאמֹר
  choice: 'சொன்னார்:'
  rationale: அடுத்த வசனத்தில் வரும் நேரடிப் பேச்சை அறிமுகப்படுத்தும் எபிரெயச் சொல்லைத் தமிழில் இயல்பான பேச்சு அறிமுகமாக வழங்குகிறது.
