    text: அதாவது, முந்தைய வசனங்களில் கூறப்பட்ட பெண்ணின் தீட்டுடன் தொடர்புடைய பொருட்கள்—அவள் படுக்கும் படுக்கை அல்லது அவள் அமரும் பொருள் போன்றவை.
    reason: cross_reference
