source:
  edition: WLC
  text: וְ/כָל הַ/נּוֹגֵ֥עַ בָּ֖/ם יִטְמָ֑א וְ/כִבֶּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/027.yaml
  text: And everyone who touches them shall be unclean[a], and he shall wash his clothes and bathe in water, and be unclean until the evening.
translation:
  language: ta
  text: அவற்றைத் தொடுகிற எவரும் தீட்டுப்படுவார்.[a] அவர் தம் உடைகளைத் துவைத்து, தண்ணீரில் குளிக்க வேண்டும்; மாலைவரை தீட்டுப்பட்டவராக இருப்பார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, முந்தைய வசனங்களில் கூறப்பட்ட பெண்ணின் தீட்டுடன் தொடர்புடைய பொருட்கள்—அவள் படுக்கும் படுக்கை அல்லது அவள் அமரும் பொருள் போன்றவை.
    reason: cross_reference
lexical_decisions:
- source_word: וְ/כָל הַ/נּוֹגֵעַ
  choice: அவற்றைத் தொடுகிற எவரும்
  rationale: כָּל என்பதும் பெயர்ச்சொல்லாகச் செயல்படும் נגע வினையெச்சமும் சேர்ந்து, விதிவிலக்கில்லாத பொதுப்பொருளைத் தருகின்றன; நவீனத் தமிழில் ‘எவரும்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: בָּם
  choice: அவற்றை
  rationale: முந்தைய சூழலில் பெண்ணின் தீட்டுடன் தொடர்புடைய படுக்கும் அல்லது அமரும் பொருட்களைச் சுட்டும் ஆண்பால் பன்மைச் சுட்டுப்பெயர். மூலத்தின் சுட்டுப் பொருள் தெளிவின்மையை முதன்மை உரையில் காக்க ‘அவற்றை’ என மொழிபெயர்க்கப்படுகிறது.
- source_word: יִטְמָא
  choice: தீட்டுப்பட்டவர் ஆவார்
  rationale: லேவியராகமத்தின் இச்சூழலில் טמא சடங்குமுறைத் தீட்டைக் குறிக்கிறது; ஒழுக்கப் பாவத்தையோ அழுக்கையையோ அல்ல. ‘தீட்டுப்பட்டவர் ஆவார்’ என்பது நிலைமாற்றத்தையும் சடங்குமுறைப் பொருளையும் வெளிப்படுத்துகிறது.
- source_word: וְ/כִבֶּס בְּגָדָיו
  choice: அவர் தம் உடைகளைத் துவைத்து
  rationale: כבס ஆடைகளைத் துவைப்பதைக் குறிக்கிறது. ‘உடைகள்’ என்பது நவீனத் தமிழில் இயல்பானது; ‘தம்’ என்பது எழுவாயுடன் உடைமையைத் தெளிவாக இணைக்கிறது.
- source_word: וְ/רָחַץ בַּמַּיִם
  choice: தண்ணீரில் குளிக்க வேண்டும்
  rationale: רחץ இச்சடங்குமுறைச் சூழலில் உடலை நீரால் கழுவுவதைக் குறிக்கிறது. ‘குளிக்க’ என்பது பொதுவாசகருக்கு இயல்பாக அந்த உடல் கழுவுதலை உணர்த்துகிறது.
- source_word: וְ/טָמֵא עַד הָ/עָרֶב
  choice: மாலைவரை தீட்டுப்பட்டவராக இருப்பார்
  rationale: இந்தச் சொற்றொடர் சடங்குமுறைத் தீட்டு நீடிக்கும் கால எல்லையைச் சொல்கிறது. ‘மாலைவரை’ என்பது עַד הָעָרֶב என்பதற்கான இயல்பான தமிழ் வடிவம்.
theological_decisions:
- issue: லேவியராகமத்தில் தீட்டு மொழியின் இயல்பு
  choice: טמא என்பதை சடங்குமுறைத் தூய்மை/தீட்டு வகைப்பாட்டில் ‘தீட்டுப்பட்டவர்’ என வழங்குதல்
  alternative: ‘அசுத்தமானவர்’ அல்லது ‘களங்கப்பட்டவர்’
  rationale: இச்சூழல் வழிபாட்டுச் சடங்குமுறைத் தீட்டைப் பற்றியது. ‘தீட்டு’ என்பது தொடர்பையே ஒழுக்கப் பாவமாக்காமல், உரையின் சடங்குமுறை வகைப்பாட்டைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டவிதிக்குரிய கண்ணியமான ஆனால் எளிதில் புரியும் நடையில் வடிவமைக்கப்பட்டது. எபிரெய மொழியின் ஆண்பால் ஒருமை இலக்கண வடிவத்தைத் தமிழில் பாலினம் வலியுறுத்தாத மரியாதை ஒருமையாக வழங்கியுள்ளது; சுட்டுப்பெயரின் குறிப்புப் பொருள் முதன்மை உரையில் விரிவாக்கப்படாமல் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
