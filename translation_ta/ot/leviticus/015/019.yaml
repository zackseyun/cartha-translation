  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/אִשָּׁה֙ כִּֽי תִהְיֶ֣ה זָבָ֔ה דָּ֛ם יִהְיֶ֥ה זֹבָ֖/הּ בִּ/בְשָׂרָ֑/הּ שִׁבְעַ֤ת יָמִים֙ תִּהְיֶ֣ה בְ/נִדָּתָ֔/הּ וְ/כָל הַ/נֹּגֵ֥עַ בָּ֖/הּ יִטְמָ֥א עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/019.yaml
  text: When a woman has a discharge[a], and her discharge in her body is blood, she shall remain in her menstrual impurity seven days[b], and everyone who touches her shall be unclean until evening.
translation:
  language: ta
  text: ஒரு பெண்ணுக்கு ஒழுக்கு ஏற்பட்டு, அவளுடைய உடலில் ஏற்படும் அந்த ஒழுக்கு இரத்தமாக இருந்தால், அவள் மாதவிடாய்த் தீட்டில்[b] ஏழு நாட்கள் இருப்பாள். அவளைத் தொடுகிற எவரும் மாலைவரை சடங்குசார் தீட்டுக்குள்ளாவார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “மாதவிடாய்த் தீட்டு” என்பது லேவியராகமச் சட்டத்தில் சடங்குசார் தீட்டு நிலையைக் குறிக்கிறது; அது ஒழுக்கத் தவறு அல்லது பாவம் என்று அவசியமாகப் பொருள்படாது.
    reason: cultural_note
lexical_decisions:
- source_word: זָבָה / זֹבָהּ
  choice: ஒழுக்கு ஏற்பட்டு / அந்த ஒழுக்கு
  rationale: זוּב என்பது உடலிலிருந்து ஏற்படும் ஓட்டம் அல்லது வெளியேற்றத்தைக் குறிக்கிறது. “ஒழுக்கு” என்பது இரத்தம் என்று அடுத்ததாகக் குறிப்பிடப்படும் வரை மூலத்தின் பொதுவான சொல்லாட்சியைத் தக்கவைக்கிறது.
- source_word: דָּם
  choice: இரத்தம்
  rationale: மூலச்சொல்லின் நேரடியான, இயல்பான தமிழ் இணை.
- source_word: בִּבְשָׂרָהּ
  choice: அவளுடைய உடலில்
  rationale: בשר என்பதன் அடிப்படைப் பொருள் “சதை”; இச்சூழலில் அது பெண்ணின் உடலைக் குறிக்கிறது. ב என்ற முன்னிடைச்சொல்லின் “இல்” பொருளையும் முதன்மை உரை பாதுகாக்கிறது.
- source_word: שִׁבְעַת יָמִים
  choice: ஏழு நாட்கள்
  rationale: எண்ணிக்கையை நேரடியாகவும் இயல்பாகவும் மொழிபெயர்க்கிறது.
- source_word: בְנִדָּתָהּ
  choice: மாதவிடாய்த் தீட்டில்
  rationale: லேவியராகமத்தின் தூய்மைச் சட்டங்களில் נִדָּה என்பது மாதவிடாயோடு தொடர்புடைய சடங்குசார் தீட்டு நிலையைக் குறிக்கிறது; வெறும் உடலியல் நிகழ்வை மட்டும் குறிக்கவில்லை.
- source_word: הַנֹּגֵעַ בָּהּ
  choice: அவளைத் தொடுகிற எவரும்
  rationale: כל உடன் வரும் எபிரெயப் பங்கேற்பு வடிவத்தின் பொதுவான, வரையறையற்ற பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: יִטְמָא
  choice: தீட்டுள்ளவராக இருப்பார்
  rationale: טמא என்பதன் சடங்குசார் அசுத்த நிலையைத் தெரிவிக்கிறது; ஒழுக்கக் குற்றம் அல்லது தனிப்பட்ட பாவம் என்ற கருத்தைச் சேர்க்கவில்லை.
- source_word: עַד הָעָרֶב
  choice: மாலைவரை
  rationale: குறிப்பிட்ட கால எல்லையைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: சடங்குசார் தீட்டை ஒழுக்கக் குற்றமாகத் தோன்றாமல் மொழிபெயர்த்தல்
  choice: “மாதவிடாய்த் தீட்டு” மற்றும் “தீட்டுள்ளவர்” என்ற சடங்குசார் நிலைச் சொற்களைப் பயன்படுத்துதல்
  alternative: “அசுத்தம்” அல்லது “மாசு” என்று மொழிபெயர்த்தல்
  rationale: லேவியராகமம் 15-ன் சூழல் சடங்குசார் தூய்மை மற்றும் தீட்டு பற்றியது; இந்த வசனம் பெண்ணின் மாதவிடாயை ஒழுக்கத் தவறாகவோ பாவமாகவோ கூறவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டப்பகுதிக்கேற்ற கண்ணியமான ஆனால் சாதாரண வாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டது. “ஒழுக்கு” என்ற சொல் உடலியல் வெளியேற்றத்தை மறைமுகமின்றியும் தேவையற்ற மருத்துவத் தொழில்சொல் இன்றியும் தெரிவிக்கிறது; “தீட்டு” என்பது இங்கு சடங்குசார் நிலையாக அடிக்குறிப்பில் தெளிவுபடுத்தப்பட்டுள்ளது.
