revisions:
- from: ஒரு பெண்ணுக்கு ஒழுக்கு ஏற்பட்டு, அவளுடைய உடலில்[a] அந்த ஒழுக்கு இரத்தமாக இருந்தால், அவள் மாதவிடாய்த் தீட்டில்[b] ஏழு நாட்கள் இருப்பாள். அவளைத் தொடுகிற எவரும் மாலைவரை தீட்டுள்ளவராக இருப்பார்.
  to: ஒரு பெண்ணுக்கு ஒழுக்கு ஏற்பட்டு, அவளுடைய உடலில் ஏற்படும் அந்த ஒழுக்கு இரத்தமாக இருந்தால், அவள் மாதவிடாய்த் தீட்டில்[b] ஏழு நாட்கள் இருப்பாள். அவளைத் தொடுகிற எவரும் மாலைவரை சடங்குசார் தீட்டுக்குள்ளாவார்.
  rationale: 'The revision improves Tamil syntax while retaining the source sequence: a woman has a flow, and that bodily flow is blood. It also makes the contact consequence explicitly a ritual status acquired through touching. Footnote a is retained as the appropriate lexical alternative, but its Tamil is normalized. Since the footnote anchor a belongs to ‘உடலில்,’ it is retained in the complete text.'
