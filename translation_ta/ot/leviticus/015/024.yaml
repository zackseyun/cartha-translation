revisions:
- from: ஒருவன் அவளோடு உடலுறவு கொண்டால்[a], அவளுடைய மாதவிடாய்த் தீட்டு அவன்மேல் வரும்; அவன் ஏழு நாட்கள் தீட்டுள்ளவனாக இருப்பான். அவன் படுக்கும் ஒவ்வொரு படுக்கையும் தீட்டுப்படும்.
