base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/024.yaml
  text: If a man indeed lies with her[a], and her menstrual impurity comes upon him, he shall be unclean seven days, and every bed on which he lies shall be unclean.
translation:
  language: ta
  text: ஒருவன் அவளோடு உடலுறவு கொண்டு, அவளுடைய மாதவிடாய்த் தீட்டு அவன்மேல் பட்டால்[a], அவன் ஏழு நாட்கள் தீட்டானவனாக இருப்பான்; அவன் படுக்கும் எந்தப் படுக்கையும் தீட்டுப்படும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேர்ச்சொல்லாக, “ஒருவன் நிச்சயமாக அவளோடு படுத்தால்.” எபிரேயத்தில் வலியுறுத்தலுக்கான வினையெச்சமும் வினையும் சேர்ந்து வருகின்றன; இங்கு “படுத்தல்” என்பது பாலுறவைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁכֹב יִשְׁכַּב
  choice: உடலுறவு கொண்டால்
  rationale: இது பெண்ணை நேரடிப் பொருளாகக் கொண்ட எபிரேய மரபுத்தொடர்; பாலுறவைக் குறிக்கிறது. வினையெச்ச முழுமையும் முற்றுவினையும் சேர்ந்த அமைப்பு வலியுறுத்தலைக் கொண்டிருந்தாலும், இயல்பான நவீனத் தமிழில் தனியான வலியுறுத்தல் சொல் சேர்ப்பது மிகையாகத் தோன்றும்; அடிக்குறிப்பில் நேர்சொல் அமைப்பு சுட்டப்படுகிறது.
- source_word: אִישׁ
  choice: ஒருவன்
  rationale: ஒரு வயது வந்த ஆணைக் குறிக்கும் ஒருமை ஆண்பால் பெயர்ச்சொல்லை இயல்பாகவும் பாலினத் துல்லியத்துடனும் தருகிறது.
- source_word: אֹתָהּ
  choice: அவளோடு
  rationale: சூழலில் முன்பு குறிப்பிடப்பட்ட பெண்ணைக் குறிக்கிறது; தமிழில் பாலுறவைக் குறிக்கும் வினைத்தொடருடன் இணக்கமாக உடனிகழ்ச்சி வேற்றுமையில் தரப்பட்டுள்ளது.
- source_word: נִדָּתָהּ
  choice: அவளுடைய மாதவிடாய்த் தீட்டு
  rationale: உயிரியல் நிகழ்வை மட்டும் அல்லாமல் லேவியராகமத்தின் சடங்குத் தூய்மைச் சூழலில் அதனுடன் தொடர்புடைய தீட்டு நிலையையும் தெளிவாகக் காட்டுகிறது.
- source_word: וּתְהִי ... עָלָיו
  choice: அவன்மேல் வரும்
  rationale: ‘அவன்மேல் இருக்கும்/வரும்’ என்ற மூல உருவகத்தை இயல்பான தமிழில் காத்து, அந்தத் தீட்டு அவனுக்கும் ஏற்படுவதை வெளிப்படுத்துகிறது.
- source_word: וְטָמֵא
  choice: தீட்டுள்ளவனாக இருப்பான்
  rationale: நிபந்தனையின் விளைவாக ஏற்படும் சடங்குத் தீட்டு நிலையைத் தருகிறது; ஒழுக்கக் குற்றம் என்ற பொருளைச் சேர்க்கவில்லை.
- source_word: שִׁבְעַת יָמִים
  choice: ஏழு நாட்கள்
  rationale: எண்ணிக்கையையும் கால அளவையும் நேரடியாகத் தருகிறது.
- source_word: הַמִּשְׁכָּב
  choice: படுக்கை
  rationale: படுத்துக்கொள்ளும் இடத்தைக் குறிக்கும் பெயர்ச்சொல்லுக்கு இச்சூழலில் இயல்பான பொதுத்தமிழ்ச் சொல்.
- source_word: אֲשֶׁר יִשְׁכַּב עָלָיו
  choice: அவன் படுக்கும்
  rationale: ‘அதன்மேல் அவன் படுப்பது’ என்ற தொடர்புச் சொல்லமைப்பைச் சுருக்கமான இயல்பான தமிழில் தருகிறது.
- source_word: יִטְמָא
  choice: தீட்டுப்படும்
  rationale: சட்ட விளைவாக அந்தப் படுக்கையும் சடங்குரீதியில் தீட்டடைவதை இயல்பான தமிழில் குறிக்கிறது.
theological_decisions:
- issue: சடங்குத் தீட்டை ஒழுக்கக் குற்றமாகப் பொருள்படுத்தாமல் மொழிபெயர்த்தல்
  choice: ‘தீட்டு’, ‘மாதவிடாய்த் தீட்டு’ என்ற சடங்குத் தூய்மைச் சொற்களைப் பயன்படுத்துதல்
  alternative: ‘அசுத்தம்’, ‘களங்கம்’, அல்லது ஒழுக்கரீதியான மாசு எனத் தருதல்
  rationale: லேவியராகமம் 15 இங்கு சடங்கு அல்லது வழிபாட்டுத் தூய்மை நிலையைக் கையாளுகிறது; இந்த வசனம் தானாகவே தனிப்பட்ட ஒழுக்கக் குற்றத்தை அறிவிப்பதில்லை. ‘தீட்டு’ அந்தச் சட்டச் சூழலைத் தெளிவாகக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான சட்டநடை பயன்படுத்தப்பட்டுள்ளது. ‘உடலுறவு’ என்பது வெளிப்படையானதாயினும் மருத்துவச் சொல் போல மிகக் கடினமல்ல; ‘தீட்டு’ சடங்குத் தூய்மைச் சூழலைக் காக்கிறது.
