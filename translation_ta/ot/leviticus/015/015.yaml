  text: וְ/עָשָׂ֤ה אֹתָ/ם֙ הַ/כֹּהֵ֔ן אֶחָ֣ד חַטָּ֔את וְ/הָ/אֶחָ֖ד עֹלָ֑ה וְ/כִפֶּ֨ר עָלָ֧י/ו הַ/כֹּהֵ֛ן לִ/פְנֵ֥י יְהוָ֖ה מִ/זּוֹבֽ/וֹ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/015.yaml
  text: The priest shall offer them[a], one as a sin offering and the other as a burnt offering, and the priest shall make atonement for him before Yahweh because of his discharge.
translation:
  language: ta
  text: ஆசாரியன் அவற்றில் ஒன்றைப் பாவப்பரிகாரப் பலியாகவும்[a], மற்றொன்றைத் தகனபலியாகவும் செலுத்த வேண்டும். அவனுடைய உடல் கசிவினால், ஆசாரியன் யாவேவின் முன்னிலையில் அவனுக்காகப் பரிகாரம் செய்ய வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தூய்மைப்படுத்தும் பலியாக.’ எபிரெயச் சொல் חַטָּאת, ஒழுக்கநெறி சார்ந்த பாவத்திற்கான பலியை மட்டுமல்லாமல், சடங்கு அசுத்தத்தை அகற்றுவதற்கான பலியையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשָׂה אֹתָם
  choice: அவற்றை ... செலுத்த வேண்டும்
  rationale: பலிகளைச் சுட்டும் பொருளுடன் עשה வருவதால், வெறுமனே ‘செய்ய வேண்டும்’ என்பதற்குப் பதிலாக பலியிடும் சடங்குச் செயலை இயல்பாகக் குறிக்கும் ‘செலுத்த வேண்டும்’ பயன்படுத்தப்பட்டது.
- source_word: הַכֹּהֵן
  choice: ஆசாரியன்
  rationale: லேவியராகமத்தின் வழிபாட்டுச் சட்டச் சூழலில் כהן என்பதற்கான பரவலாக அறியப்பட்ட தமிழ் வழக்குச் சொல்.
- source_word: אֶחָד חַטָּאת
  choice: ஒன்றைப் பாவப்பரிகாரப் பலியாக
  rationale: חטאת என்பது இங்கு ஒரு பலிவகையின் பெயர். வழக்கில் அறியப்பட்ட பொருளை முதன்மை உரையில் வைத்தபோதும், சடங்குத் தூய்மையை மீட்டெடுக்கும் அதன் நுட்பம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: וְהָאֶחָד עֹלָה
  choice: மற்றொன்றைத் தகனபலியாக
  rationale: עלה என்பது முழுவதும் எரித்துச் செலுத்தப்படும் பலியைக் குறிக்கும் நிலையான வழிபாட்டுச் சொல்; ‘மற்றொன்று’ எபிரெய வடிவின் எதிரிணையைத் தெளிவாகக் காட்டுகிறது.
- source_word: וְכִפֶּר עָלָיו
  choice: அவனுக்காகப் பரிகாரம் செய்ய வேண்டும்
  rationale: כפר என்பதன் வழிபாட்டு-இறையியல் வலிமையைத் தக்கவைத்தும், அதன் செயல்முறையை ஒரு குறிப்பிட்ட கோட்பாட்டுக்குள் சுருக்காமலும் ‘பரிகாரம் செய்ய’ மொழிபெயர்க்கப்பட்டது.
- source_word: לִפְנֵי יְהוָה
  choice: யாவேக்கு முன்பாக
  rationale: לִפְנֵי என்பதன் முன்னிலை அல்லது சந்நிதி சார்ந்த பொருளை இயல்பான தமிழில் தருகிறது; יהוה என்ற இறைப் பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டது.
- source_word: מִזּוֹבוֹ
  choice: அவனுடைய உடல் கசிவின் காரணமாக
  rationale: זוב குறிக்கும் உடலிலிருந்து வெளியேறும் கசிவை நவீன வாசகருக்குத் தெளிவாகச் சொல்கிறது; מן இங்கு பரிகாரம் தேவைப்படும் காரணத்தைச் சுட்டுவதால் ‘காரணமாக’ என வழங்கப்பட்டது.
theological_decisions:
- issue: சடங்குத் தூய்மைச் சூழலில் חַטָּאת என்பதன் பொருள்
  choice: பாவப்பரிகாரப் பலி
  alternative: தூய்மைப்படுத்தும் பலி
  rationale: חטאת பாவத்தோடு தொடர்புடைய பலியையும் சடங்கு அசுத்தத்தை அகற்றும் பலியையும் குறிக்கக்கூடும். அறியப்பட்ட பலிப்பெயர் முதன்மை உரையில் வைக்கப்பட்டு, இச்சூழலின் தூய்மைப்படுத்தும் நுட்பம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- issue: כפר என்பதன் மொழிபெயர்ப்பு
  choice: பரிகாரம் செய்ய வேண்டும்
  alternative: பாவநிவிர்த்தி செய்ய வேண்டும்
  rationale: இவ்வசனம் ஒழுக்கக்கேட்டைக் காட்டிலும் உடல் கசிவால் உண்டான சடங்கு அசுத்தத்தைப் பற்றியது. ஆகவே ‘பாவ’ என்ற கருத்தைத் தேவையின்றிச் சேர்க்காமல், כפר என்பதன் வழிபாட்டு மற்றும் இறையியல் விரிவை ‘பரிகாரம்’ தக்கவைக்கிறது.
translation_notes:
  register: நவீன, கண்ணியமான, பொதுவாசகருக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. பழமையான மருத்துவச் சொல்லைத் தவிர்த்து ‘உடல் கசிவு’ எனத் தெளிவுபடுத்தப்பட்டுள்ளது. பலி மற்றும் வழிபாட்டு மொழியில் பரிச்சயமான ‘ஆசாரியன்’, ‘தகனபலி’, ‘பரிகாரம்’ ஆகிய சொற்கள் பயன்படுத்தப்பட்டுள்ளன.
