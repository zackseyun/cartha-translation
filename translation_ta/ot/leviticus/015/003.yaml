base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/003.yaml
  text: 'And this shall be his uncleanness in his discharge: whether his body runs with his discharge[a], or his body is stopped up from his discharge, it is his uncleanness.'
translation:
  language: ta
  text: 'அவனுடைய ஒழுக்கினால் உண்டாகும் தீட்டு இதுவே: அவனுடைய உடலிலிருந்து ஒழுக்கு வடிந்துகொண்டிருந்தாலும்[a], அல்லது ஒழுக்கு வெளியேறாமல் அவனுடைய உடலில் அடைபட்டிருந்தாலும், அது அவனுடைய தீட்டே.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேரடியாக, “அவனுடைய சதை அவனுடைய ஒழுக்கை வெளியேற்றினாலும் … அவனுடைய சதை அவனுடைய ஒழுக்கிலிருந்து அடைக்கப்பட்டிருந்தாலும்.” எபிரெயத்தில் “சதை” என்ற சொல் வருகிறது; இங்கு அது ஒழுக்குடன் தொடர்புடைய உடல் அல்லது உடற்பகுதியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: טֻמְאָתוֹ
  choice: அவனுடைய தீட்டு
  rationale: லேவியராகமத்தின் சடங்குத் தூய்மைச் சட்டச் சூழலில் இது சடங்குரீதியான தீட்டைக் குறிக்கிறது; நவீனத் தமிழில் ‘தீட்டு’ அந்தச் சட்டப்பிரிவைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: זוֹב
  choice: ஒழுக்கு
  rationale: இங்கு அசாதாரணமான உடல்/பாலுறுப்பு சுரப்பு அல்லது வடிதலைக் குறிக்கிறது. ‘ஒழுக்கு’ மருத்துவத் தன்மையுடன் தெளிவாகவும் அளவுக்கு மீறிய விளக்கமின்றியும் உள்ளது.
- source_word: רָר
  choice: வடிந்துகொண்டிருந்தாலும்
  rationale: வெளியேறிக்கொண்டிருக்கும் செயற்பாட்டைத் தெரிவித்து, அடுத்து வரும் அடைப்புநிலையுடன் தெளிவான எதிர்மறை இணையை உருவாக்குகிறது.
- source_word: בְּשָׂרוֹ
  choice: அவனுடைய உடல் / அவனுடைய உடலிலிருந்து
  rationale: எபிரெயச் சொல் நேரடியாக ‘சதை’ என்றாலும், இச்சூழலில் ஒழுக்குடன் தொடர்புடைய உடல் அல்லது உடற்பகுதியைக் குறிக்கிறது. இயல்பான தமிழுக்காக ‘உடல்’ பயன்படுத்தப்பட்டது; வடியும் நிலையைத் தெளிவாக்க முதல் கூறில் ‘உடலிலிருந்து’ என அமைக்கப்பட்டது.
- source_word: הֶחְתִּים
  choice: அடைபட்டிருந்தாலும்
  rationale: ஒழுக்கு தடையின்றி வெளியேறுவதற்கு மாறாக, உடல் அடைக்கப்பட்ட அல்லது தடுக்கப்பட்ட நிலையைக் குறிக்கிறது.
- source_word: מִזּוֹבוֹ
  choice: ஒழுக்கு வெளியேறாமல்
  rationale: எபிரெயக் கட்டமைப்பின் பிரிவு/தடைப் பொருளை இயல்பான தமிழில் வெளிப்படுத்தி, முதல் நிலையான வடிதலோடு உள்ள வேறுபாட்டைக் காக்கிறது.
- source_word: וְזֹאת תִּהְיֶה
  choice: இதுவே
  rationale: சட்ட வரையறையை அறிமுகப்படுத்தும் எபிரெயச் சூத்திரத்தைச் சுருக்கமான, dignified நவீனத் தமிழில் தருகிறது.
- source_word: אוֹ
  choice: …இருந்தாலும் …இருந்தாலும்
  rationale: இரண்டு மாற்று உடல்நிலைகளுக்கும் ஒரே தீட்டு விதி பொருந்துவதைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
