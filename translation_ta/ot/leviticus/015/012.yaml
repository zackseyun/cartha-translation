  yaml_path: translation/ot/leviticus/015/012.yaml
  text: And an earthen vessel that the one with the discharge touches shall be broken[c][b][a], and every wooden vessel shall be rinsed with water.
translation:
  language: ta
  text: உடலிலிருந்து ஒழுக்கு ஏற்படுகிறவர் தொடும் மண்பாண்டம் உடைக்கப்பட வேண்டும்; மரத்தால் செய்யப்பட்ட ஒவ்வொரு பாத்திரமும் தண்ணீரால் கழுவப்பட வேண்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְלִי חֶרֶשׂ
  choice: மண்பாண்டம்
  rationale: כְלִי חֶרֶשׂ என்பது சுடுமண்ணால் செய்யப்பட்ட பாத்திரத்தைக் குறிக்கிறது. தூய்மைச் சட்டத்தில் முக்கியமான பொருள் வேறுபாட்டை இயல்பான தமிழில் ‘மண்பாண்டம்’ தெளிவாகக் காட்டுகிறது.
- source_word: אֲשֶׁר יִגַּע בּוֹ
  choice: தொடும்
  rationale: נגע என்பதன் நேரடியான பொருள் ‘தொடு’; எபிரெய உறவுத்தொடரின் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: הַזָּב
  choice: ஒழுக்கு உள்ளவர்
  rationale: இது உடல் ஒழுக்கால் பாதிக்கப்பட்ட நபரைக் குறிக்கும் தூய்மைச் சட்டத்தின் தொழில்நுட்பச் சொல். ‘ஒழுக்கு உள்ளவர்’ என்பது நிலையை மையப்படுத்தி, தேவையற்ற விளக்கச் சேர்க்கையின்றி தமிழில் புரியுமாறு சொல்கிறது.
- source_word: יִשָּׁבֵר
  choice: உடைக்கப்பட வேண்டும்
  rationale: நிபால் வடிவத்தின் செயப்பாட்டு பொருளையும் சட்டக் கட்டளையின் வலிமையையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: כָל כְּלִי עֵץ
  choice: மரத்தால் செய்யப்பட்ட ஒவ்வொரு பாத்திரமும்
  rationale: மரத்தால் ஆன எந்தப் பாத்திரத்தையும் குறிக்கும் தொடரைத் தெளிவாகக் காட்டி, மண்பாண்டத்துடனான இணை அமைப்பையும் காக்கிறது.
- source_word: יִשָּׁטֵף בַּמָּיִם
  choice: தண்ணீரால் கழுவப்பட வேண்டும்
  rationale: שטף இச்சூழலில் நீரால் அலசுதல் அல்லது கழுவுதலைக் குறிக்கிறது. ‘தண்ணீரால் கழுவப்பட வேண்டும்’ என்பது பாத்திரத்தைப் பற்றிய தமிழ்ச் சொல்லாக்கத்தில் இயல்பானதும் மூலத்தின் சடங்குச் செயலைப் போதுமான அளவு துல்லியமாகக் காட்டுவதுமாகும்.
