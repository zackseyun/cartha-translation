revisions:
- from: வடியொழுக்கு உள்ள ஆண் படுக்கும் ஒவ்வொரு படுக்கையும் தீட்டாகும்; அவன் உட்காரும் ஒவ்வொரு பொருளும்[a] தீட்டாகும்.
  to: உடலிலிருந்து வடியொழுக்கு உள்ள ஆண் படுக்கும் ஒவ்வொரு படுக்கையும் தீட்டாகும்; அவன் உட்காரும் ஒவ்வொரு பொருளும்[a] தீட்டாகும்.
  rationale: The revision improves modern Tamil clarity by specifying that the discharge is from the body and by making the legal relative clause readily intelligible. It preserves the Hebrew’s masculine singular referent, the broad sense of כְּלִי, and ritual—not moral—impurity. No doctrinal or medical interpretation has been added.
  reviewer_model: gpt-5.6-terra
