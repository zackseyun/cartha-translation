  text: כָּל הַ/מִּשְׁכָּ֗ב אֲשֶׁ֨ר יִשְׁכַּ֥ב עָלָ֛י/ו הַ/זָּ֖ב יִטְמָ֑א וְ/כָֽל הַ/כְּלִ֛י אֲשֶׁר יֵשֵׁ֥ב עָלָ֖י/ו יִטְמָֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/004.yaml
  text: Every bed on which the man with the discharge lies shall be unclean[a], and every vessel on which he sits shall be unclean.
translation:
  language: ta
  text: உடலிலிருந்து வடியொழுக்கு உள்ள ஆண் படுக்கும் ஒவ்வொரு படுக்கையும் தீட்டாகும்; அவன் உட்காரும் ஒவ்வொரு பொருளும்[a] தீட்டாகும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பாத்திரம்,’ ‘உபகரணம்,’ அல்லது ‘பயன்பாட்டுப் பொருள்’ என்றும் மொழிபெயர்க்கலாம். இதற்கான எபிரெயச் சொல் பலவகையான பொருட்களைக் குறிக்கும் பரந்த சொல்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּשְׁכָּב
  choice: படுக்கை
  rationale: מִשְׁכָּב என்பது படுப்பதற்கான இடத்தைக் குறிக்கிறது. இச்சூழலில் ‘படுக்கை’ இயல்பானதும் தெளிவானதும் ஆகும்.
- source_word: הַזָּב
  choice: வடியொழுக்கு உள்ள ஆண்
  rationale: זָב என்பது இச்சூழலில் உடலிலிருந்து வடியொழுக்கு ஏற்படும் ஆணைக் குறிக்கும் ஆண்பால் ஒருமைச் சொல். பாலினத்தையும் உடல் நிலையையும் தெளிவாகப் பாதுகாக்க இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: יִשְׁכַּב עָלָיו
  choice: படுக்கும்
  rationale: ‘அதன்மேல் படுக்கிறான்’ என்ற எபிரெயச் சொற்றொடரின் பொருளை, பொதுவான சட்ட விதிக்கு ஏற்ற இயல்பான தமிழில் தருகிறது.
- source_word: יִטְמָא
  choice: தீட்டாகும்
  rationale: இங்கு טמא அறநெறிக் குற்றத்தை அல்ல, லேவியத் தூய்மைச் சட்டத்தின்படியான தீட்டு நிலையைச் சுட்டுகிறது. ‘தீட்டாகும்’ அந்தச் சடங்கு சார்ந்த சட்டப் பொருளைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: הַכְּלִי
  choice: பொருள்
  rationale: כְּלִי என்பது பாத்திரம், கருவி, பயன்பாட்டுப் பொருள் போன்றவற்றைக் குறிக்கக்கூடிய பரந்த சொல். ஒருவர் உட்காரக்கூடிய ஒன்றை இங்கு குறிக்கும் என்பதால், ‘பொருள்’ இயல்பாகவும் தேவையற்ற குறுக்கமின்றியும் உள்ளது.
- source_word: יֵשֵׁב עָלָיו
  choice: உட்காரும்
  rationale: ‘அதன்மேல் உட்காருகிறான்’ என்ற பொருளை பொதுவான சட்டக் கூற்றுக்கு ஏற்ற சுருக்கமான தமிழில் வழங்குகிறது.
theological_decisions:
- issue: தீட்டு மொழியின் தன்மை
  choice: ‘தீட்டாகும்’ என்று சடங்கு சார்ந்த தூய்மை நிலையாக மொழிபெயர்த்தல்
  alternative: ‘அசுத்தமாகும்’ அல்லது ‘சடங்கின்படி தீட்டாகும்’
  rationale: மூலவசனம் அறநெறிக் குற்றத்தை அவசியமாகக் குறிப்பிடாமல் லேவியத் தூய்மை நிலையைக் கூறுகிறது. ‘சடங்கின்படி’ என்பது விளக்கச் சேர்க்கை; ‘அசுத்தம்’ உடல் அழுக்கு என்ற பொருளையும் தரக்கூடும். ஆகவே ‘தீட்டு’ பொருத்தமானது.
- issue: குறிப்பிடப்படும் நபரின் பாலினம்
  choice: ‘வடியொழுக்கு உள்ள ஆண்’ என்று ஆண்பாலை வெளிப்படையாக வைத்தல்
  alternative: ‘வடியொழுக்கு உள்ளவர்’ என்று பாலினப் பொதுமைப்படுத்தல்
  rationale: எபிரெய உரையும் உடனடிச் சூழலும் ஆண்பால் ஒருமையைக் குறிக்கின்றன; எனவே அதை நடுநிலைப்படுத்தாமல் பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீன தரத் தமிழில், சட்டக் கூற்றின் சுருக்கத்தையும் கண்ணியத்தையும் காக்கும் நடை பயன்படுத்தப்பட்டுள்ளது. பழமையான மருத்துவச் சொல்லாடலைத் தவிர்த்து ‘வடியொழுக்கு’ தேர்ந்தெடுக்கப்பட்டது; ‘தீட்டு’ என்பது இங்கு சடங்கு சார்ந்த நிலையைச் சுட்டுகிறது.
