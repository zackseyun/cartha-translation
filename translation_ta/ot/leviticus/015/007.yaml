reference: Leviticus 15:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/הַ/נֹּגֵ֖עַ בִּ/בְשַׂ֣ר הַ/זָּ֑ב יְכַבֵּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/007.yaml
  text: Whoever touches the flesh of the man with the discharge shall wash his clothes and bathe in water[a], and he shall be unclean until the evening.
translation:
  language: ta
  text: உடல் ஒழுக்கு உள்ள மனிதனின் சதையைத்[a] தொடுகிறவன் தன் உடைகளைக் கழுவி, தண்ணீரில் குளிக்க வேண்டும்; அவன் மாலைவரை தீட்டானவனாக இருப்பான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உடல் ஒழுக்கு உள்ள மனிதனின் உடலை.’ எபிரெய மொழியில் நேரடியாக, ‘ஒழுக்கு உள்ளவனின் சதை’ என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנֹּגֵעַ
  choice: தொடுகிறவன்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் எபிரெயப் பங்கேற்புவினை பொதுவான சட்ட நிபந்தனையைச் சுட்டுகிறது; தமிழில் ‘தொடுகிறவன்’ இயல்பாகவும் சுருக்கமாகவும் உள்ளது.
- source_word: בִּבְשַׂר
  choice: சதையை
  rationale: בָּשָׂר என்பதன் நேரடியான பொருள் ‘சதை’; இங்கு அது மனிதனுடைய உடலையும் குறிக்கக்கூடும். மூலத்தின் சொல்வடிவத்தை முதன்மை உரையில் காத்து, மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: הַזָּב
  choice: ஒழுக்குள்ள அந்த மனிதன்
  rationale: זוּב வேரிலிருந்து வரும் இச்சொல், இச்சூழலில் அசாதாரண உடல் ஒழுக்கு உள்ள ஆண்பாலரைக் குறிக்கிறது. முந்தைய சூழலுடன் இணையும் வகையில் ‘அந்த மனிதன்’ எனத் தெளிவுபடுத்தப்பட்டுள்ளது.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: தன் உடைகளைக் கழுவி
  rationale: כִּבֵּס என்பது இங்கு ஆடைகளைத் துவைப்பதைக் குறிக்கிறது; ‘தன் உடைகள்’ உடைமையுறவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְרָחַץ בַּמַּיִם
  choice: தண்ணீரில் குளிக்க வேண்டும்
  rationale: רָחַץ இங்கு உடலை நீரால் கழுவுதல் அல்லது குளித்தலைக் குறிக்கிறது. ‘தண்ணீரில் குளிக்க வேண்டும்’ நவீன தமிழில் இயல்பாகவும் சட்டக் கட்டளையைத் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: וְטָמֵא
  choice: தீட்டுள்ளவனாக இருப்பான்
  rationale: טָמֵא இங்கு அறநெறிக் குற்றத்தை அல்ல, சடங்குசார் தூய்மையின்மையைச் சுட்டுகிறது. லேவியராகமத் தூய்மைச் சட்டங்களுக்கு ‘தீட்டு’ பொருத்தமான மரபுவழி தமிழ் சொல்.
- source_word: עַד הָעָרֶב
  choice: மாலைவரை
  rationale: தீட்டு நீடிக்கும் கால எல்லையை இயல்பான தமிழில் துல்லியமாகக் குறிக்கிறது.
theological_decisions:
- issue: தீட்டு மொழியின் தன்மை
  choice: טָמֵא என்பதைச் சடங்குசார் ‘தீட்டு’ என மொழிபெயர்த்தல்
  alternative: அசுத்தம் / களங்கம்
  rationale: லேவியராகமம் 15-இல் இது ஒழுக்கக்கேடு அல்லது தனிப்பட்ட பாவத்தீர்ப்பை அல்ல, இஸ்ரவேலின் தூய்மை முறைக்குள் உள்ள சடங்குசார் நிலையைக் குறிக்கிறது. ‘தீட்டு’ அந்த வேறுபாட்டைச் சுருக்கமாகக் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுமக்களுக்கு எளிதில் புரியும் கண்ணியமான சட்டநடை பயன்படுத்தப்பட்டுள்ளது. ‘ஒழுக்கு’ என்பது இச்சூழலில் உடலிலிருந்து வரும் அசாதாரண வெளியேற்றத்தைக் குறிக்கிறது; வசனத்தின் உடனடி சூழல் காரணமாக கூடுதல் விளக்கம் முதன்மை உரையில் சேர்க்கப்படவில்லை.
