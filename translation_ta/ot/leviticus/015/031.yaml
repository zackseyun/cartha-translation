source:
  edition: WLC
  text: וְ/הִזַּרְתֶּ֥ם אֶת בְּנֵי יִשְׂרָאֵ֖ל מִ/טֻּמְאָתָ֑/ם וְ/לֹ֤א יָמֻ֨תוּ֙ בְּ/טֻמְאָתָ֔/ם בְּ/טַמְּאָ֥/ם אֶת מִשְׁכָּנִ֖/י אֲשֶׁ֥ר בְּ/תוֹכָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/031.yaml
  text: Thus you shall warn the sons of Israel about their uncleanness[a], so that they may not die in their uncleanness by defiling my tabernacle, which is among them.
translation:
  language: ta
  text: “இஸ்ரவேல் மக்களை[a] அவர்களுடைய தீட்டைக் குறித்து எச்சரியுங்கள்; அவர்கள் தங்கள் தீட்டுநிலையில், அவர்கள் நடுவில் இருக்கும் என் திருக்கூடாரத்தைத் தீட்டுப்படுத்தி இறந்துபோகாதபடிக்கு.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'நேரடியாக: ‘இஸ்ரவேலின் மகன்கள்.’'
    reason: எபிரெயக் கூட்டுப்பெயரின் நேரடி வடிவத்தைப் பதிவு செய்யும் சொற்பொருள் மாற்று.
lexical_decisions:
- source_word: וְהִזַּרְתֶּם
  choice: விலக்கி வையுங்கள்
  rationale: இவ்வடிவம் נזר என்பதன் ஹிஃபில் வினையாகப் புரிந்துகொள்ளப்பட்டு, தீட்டிலிருந்து பிரித்து அல்லது விலக்கி வைக்கும் பொருளைத் தருகிறது. இது மூல எபிரெய வடிவத்துக்கும் இச்சட்டச் சூழலுக்கும் ‘எச்சரியுங்கள்’ என்பதைக் காட்டிலும் நேரடியாகப் பொருந்துகிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: நேரடிப் பொருள் ‘இஸ்ரவேலின் மகன்கள்.’ நவீனத் தமிழில் முழு உடன்படிக்கைச் சமூகத்தையும் இயல்பாகக் குறிக்க ‘இஸ்ரவேல் மக்கள்’ பயன்படுத்தப்பட்டுள்ளது; நேரடி வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: מִטֻּמְאָתָם / בְּטֻמְאָתָם
  choice: அவர்களுடைய தீட்டிலிருந்து / தங்கள் தீட்டிலேயே
  rationale: טֻמְאָה இங்கு ஒழுக்கப் பாவத்தைப் பொதுவாகக் குறிக்காமல், லேவியராகமத்தின் சடங்குசார் தீட்டு நிலையைக் குறிக்கிறது. מִן பிரிவைக் குறிக்கும் ‘இருந்து’ என்றும், ב நிலை அல்லது சூழலைக் குறிக்கும் ‘இலேயே’ என்றும் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: בְּטַמְּאָם
  choice: தீட்டுப்படுத்துவதால்
  rationale: ב உடன் வரும் טמא வினையெச்ச வடிவம், மரண அபாயம் எவ்வாறு ஏற்படுகிறது என்பதை—திருக்கூடாரத்தைத் தீட்டுப்படுத்துவதன் மூலம்—காட்டுகிறது.
- source_word: מִשְׁכָּנִי
  choice: என் திருக்கூடாரம்
  rationale: מִשְׁכָּן இங்கு இஸ்ரவேலர் நடுவே அமைந்திருந்த இறை வாசஸ்தலமாகிய கூடாரத்தைக் குறிப்பதால், அதன் உறுதியான வழிபாட்டுச் சூழலை ‘திருக்கூடாரம்’ தெளிவாகக் காக்கிறது.
- source_word: אֲשֶׁר בְּתוֹכָם
  choice: அவர்கள் நடுவில் இருக்கும்
  rationale: இறைவனுடைய வாசஸ்தலம் இஸ்ரவேல் சமூகத்தின் நடுவில் இருப்பதை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: சடங்குசார் தீட்டுக்கும் ஒழுக்கப் பாவத்துக்கும் இடையிலான வேறுபாடு
  choice: טֻמְאָה என்பதற்கு ‘தீட்டு’
  alternative: அசுத்தம்; பாவமாசு
  rationale: இந்த வசனம் சடங்குசார் நிலை இறை வாசஸ்தலத்தைப் பாதிக்கும் அபாயத்தைப் பற்றியது; அதைத் தானாகவே ஒழுக்கக் குற்றமாக மாற்றாமல் ‘தீட்டு’ என்ற லேவியராகமச் சொல்லாட்சி காக்கப்படுகிறது.
- issue: וְהִזַּרְתֶּם என்பதன் பொருள்
  choice: தீட்டிலிருந்து விலக்கி வைத்தல்
  alternative: தீட்டைக் குறித்து எச்சரித்தல்
  rationale: மசோரா உரையின் மெய்யெழுத்து மற்றும் உயிர்க்குறி வடிவம் נזר என்ற வேர்ச்சொல்லின் ஹிஃபிலைச் சுட்டுகிறது; ஆகவே பிரித்தல் அல்லது விலக்குதல் முதன்மைப் பொருளாக வைக்கப்பட்டுள்ளது. தொடர்ந்து வரும் மரண அபாயம் அதன் நோக்கத்தை விளக்குகிறது.
- issue: மரணத்திற்கும் திருக்கூடாரத் தீட்டுப்பாட்டிற்கும் உள்ள தொடர்பு
  choice: ‘இல்லையெனில்’ என்று விளைவுறவைத் தெளிவாக்குதல்
  alternative: ‘அவர்கள் இறக்காதபடி’ என்ற நோக்கவாக்கியம்
  rationale: וְלֹא יָמֻתוּ தடுப்பு அல்லது எதிர்மறை விளைவை வெளிப்படுத்துகிறது. ‘இல்லையெனில்’ என்பது தீட்டிலிருந்து விலக்கி வைக்காதபோது ஏற்படும் உயிராபத்தைத் தெளிவாகக் கூறுகிறது; காரணத் தொடர்பை அளவுக்கு மீறி விளக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பாகவும், லேவியராகமத்தின் வழிபாட்டு மற்றும் சடங்குசார் கண்ணியத்தைப் பேணும் வகையிலும் அமைக்கப்பட்டுள்ளது. ‘திருக்கூடாரம்’ மற்றும் ‘தீட்டு’ ஆகியவை இச்சூழலின் தனித்துவமான வழிபாட்டுப் பொருளைத் தக்கவைக்கின்றன.
