id: LEV.15.21
reference: Leviticus 15:21
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/כָל הַ/נֹּגֵ֖עַ בְּ/מִשְׁכָּבָ֑/הּ יְכַבֵּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/021.yaml
  text: And everyone who touches her bed shall wash his clothes and bathe in water[a], and he shall be unclean until the evening.
translation:
  language: ta
  text: அவளுடைய படுக்கையை[a] தொடுகிற எவரும் தன் உடைகளைத் துவைத்துத் தண்ணீரில் குளிக்க வேண்டும்; அவர் மாலைவரை தீட்டானவராக இருப்பார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “படுக்கை” என்பதற்கு “அவள் படுக்கும் இடம்” அல்லது “அவளுடைய படுக்கை விரிப்பு” என்றும் பொருள் கொள்ளலாம். எபிரேயச் சொல் அவள் படுக்கும் இடத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל הַנֹּגֵעַ
  choice: தொடுகிற யாராயினும்
  rationale: இணைப்புடன் வரும் כָּל மற்றும் பெயர்ச்சொல்லாகச் செயல்படும் நிகழ்காலப் பங்கேற்புவினை ஆகியவை பொதுவான, அனைவருக்கும் பொருந்தும் விதியைச் சுட்டுகின்றன. ‘யாராயினும்’ என்பது இயல்பான நவீனத் தமிழில் அதன் பொதுப்படையான வரம்பைப் பாதுகாக்கிறது.
- source_word: בְּמִשְׁכָּבָהּ
  choice: அவளுடைய படுக்கையை
  rationale: מִשְׁכָּב என்பது படுக்கும் இடம் அல்லது படுக்கையைக் குறிக்கும். இச்சூழலில் ‘படுக்கை’ தெளிவாகவும் இயல்பாகவும் உள்ளது; சொலின் பரந்த பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: தன் உடைகளைத் துவைத்து
  rationale: כבס குறிப்பாக ஆடைகளைத் துவைப்பதைக் குறிக்கிறது. ஒரே செய்பவரை இயல்பாகத் தொடர ‘தன்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: וְרָחַץ בַּמַּיִם
  choice: தண்ணீரில் குளிக்க வேண்டும்
  rationale: רחץ இங்கு உடலைத் தண்ணீரால் கழுவுவதைக் குறிக்கிறது. ‘குளிக்க வேண்டும்’ என்பது ஆடைகளைத் துவைப்பதிலிருந்து இதைத் தெளிவாக வேறுபடுத்தி, சட்டவிதியின் கட்டாயத் தன்மையையும் தெரிவிக்கிறது.
- source_word: וְטָמֵא
  choice: தீட்டுள்ளவராக இருப்பார்
  rationale: טמא இங்கு ஒழுக்கக் குற்றத்தை அல்ல, சடங்குசார் தீட்டு நிலையைக் குறிக்கிறது. லேவியராகமத்தின் தூய்மைச் சட்டச் சொல்லாட்சியை ‘தீட்டு’ பாதுகாக்கிறது.
- source_word: עַד הָעָרֶב
  choice: மாலைவரை
  rationale: தீட்டு நிலை நீடிக்கும் கால எல்லையைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: தீட்டின் இயல்பு
  choice: טמא என்பதைச் சடங்குசார் ‘தீட்டு’ என மொழிபெயர்த்தல்
  alternative: அசுத்தம் அல்லது கறைபடுதல்
  rationale: லேவியராகமம் 15-ன் சூழல் சடங்குசார் தூய்மை விதிகளைப் பற்றியது. ‘தீட்டு’ என்பது ஒழுக்கக் குற்றம் அல்லது தனிப்பட்ட பாவம் என்ற கருத்தைச் சேர்க்காமல் அந்தச் சட்டப்பிரிவைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுமக்கள் எளிதில் புரிந்துகொள்ளும் மரியாதையான சட்டவிதி நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. பாலினப் பொதுமையை இயல்பாக வெளிப்படுத்த ‘யாராயினும்’ மற்றும் மரியாதை ஒருமை வினைமுற்றுகள் பயன்படுத்தப்பட்டுள்ளன.
