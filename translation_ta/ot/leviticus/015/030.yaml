source:
  edition: WLC
  text: וְ/עָשָׂ֤ה הַ/כֹּהֵן֙ אֶת הָ/אֶחָ֣ד חַטָּ֔את וְ/אֶת הָ/אֶחָ֖ד עֹלָ֑ה וְ/כִפֶּ֨ר עָלֶ֤י/הָ הַ/כֹּהֵן֙ לִ/פְנֵ֣י יְהוָ֔ה מִ/זּ֖וֹב טֻמְאָתָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/030.yaml
  text: Then the priest shall offer one as a sin offering and the other as a burnt offering, and the priest shall make atonement for her before Yahweh because of her unclean discharge.
translation:
  language: ta
  text: பின்பு ஆசாரியன் ஒன்றைப் பாவநிவாரணப் பலியாகவும்[a], மற்றொன்றைத் தகனப் பலியாகவும் செலுத்த வேண்டும். அவளுடைய தீட்டான உடலொழுக்கின் காரணமாக ஆசாரியன் யாவேயின் முன்னிலையில் அவளுக்காகப் பாவநிவிர்த்தி செய்ய வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பாவநிவாரணப் பலி’ என்பதற்குப் பதிலாக ‘தூய்மைப்படுத்தும் பலி’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் חַטָּאת லேவியச் சடங்கில் பலியின் தூய்மைப்படுத்தும் செயலையும் வலியுறுத்தலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשָׂה
  choice: செலுத்த வேண்டும்
  rationale: வினைச்சொல் அடிப்படையில் ‘செய்’ என்று பொருள்பட்டாலும், பலிகளைக் குறிக்கும் இச்சூழலில் ‘பலியாகச் செலுத்து’ என்பது இயல்பான தமிழாக்கம்.
- source_word: הַכֹּהֵן
  choice: ஆசாரியன்
  rationale: லேவிய வழிபாட்டுச் சடங்கில் பணியாற்றும் כֹּהֵן என்பதற்கான மரபாகவும் தெளிவாகவும் உள்ள தமிழ் சொல்.
- source_word: הָאֶחָד חַטָּאת
  choice: ஒன்றைப் பாவநிவாரணப் பலியாக
  rationale: חַטָּאת இங்கு பலிவகையைக் குறிக்கிறது. ‘பாவநிவாரணப் பலி’ அதன் பாவம் சார்ந்த பெயரையும் சடங்கின் நிவாரண நோக்கையும் புரிந்துகொள்ளக்கூடிய தமிழில் தெரிவிக்கிறது; தூய்மைப்படுத்தும் செயல்பாடு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְאֶת־הָאֶחָד עֹלָה
  choice: மற்றொன்றைத் தகனப் பலியாக
  rationale: மீண்டும் வரும் ‘ஒன்று’ என்ற எபிரெயச் சொற்றொடர் தமிழில் இயல்பாக ‘மற்றொன்று’ என வழங்கப்படுகிறது; עֹלָה என்பது முழுவதும் எரிக்கப்படும் பலிவகை.
- source_word: וְכִפֶּר עָלֶיהָ
  choice: அவளுக்காகப் பாவநிவிர்த்தி செய்ய வேண்டும்
  rationale: כפר என்பதன் ஆசாரியச் சடங்கு மற்றும் இறையியல் வலிமையை ‘பாவநிவிர்த்தி செய்’ காக்கிறது; עָלֶיהָ இச்சூழலில் ‘அவளுக்காக’ என இயல்பாக அமைகிறது.
- source_word: לִפְנֵי יְהוָה
  choice: யெகோவாவின் முன்னிலையில்
  rationale: לִפְנֵי என்பது வழிபாட்டுச் சூழலில் ‘முன்னிலையில்’; יהוה என்பது வெளிப்படுத்தப்பட்ட தனிப்பெயராக ‘யெகோவா’ என ஒலிபெயர்க்கப்படுகிறது.
- source_word: מִזּוֹב טֻמְאָתָהּ
  choice: அவளுடைய தீட்டான ஒழுக்கின் காரணமாக
  rationale: זוֹב என்பது உடலிலிருந்து வரும் ஒழுக்கு; טֻמְאָה அதன் சடங்குசார் தீட்டைச் சுட்டுகிறது. מן இங்கு காரண உறவைத் தருவதால், தமிழில் இவ்வாறு தெளிவாக வழங்கப்படுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் தமிழாக்கம்
  choice: யெகோவா
  alternative: யாவே
  rationale: மூலத்தில் வரும் நான்கு எழுத்து இறைப்பெயரை பொதுப்பட்டமான ‘கர்த்தர்’ என்று மாற்றாமல் தனிப்பெயராகப் பாதுகாக்கிறது. நவீனத் தமிழ்க் கிறிஸ்தவ வாசகர்களிடையே அறியப்பட்ட ‘யெகோவா’ வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- issue: חַטָּאת என்ற பலிவகை
  choice: பாவநிவாரணப் பலி
  alternative: தூய்மைப்படுத்தும் பலி
  rationale: சொல் பாவத்தையும் சடங்குசார் தூய்மைப்படுத்துதலையும் இணைக்கும் பலிவகையைக் குறிக்கலாம். முதன்மை உரையில் வழக்கமான பாவம் சார்ந்த பெயர் வைக்கப்பட்டு, தூய்மைப்படுத்தும் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: பெண்ணின் ஒழுக்கும் பாவநிவிர்த்தியும் இடையிலான உறவு
  choice: தீட்டான ஒழுக்கின் காரணமாக அவளுக்காகப் பாவநிவிர்த்தி
  alternative: அவளுடைய தீட்டிலிருந்து அவளைத் தூய்மைப்படுத்துதல்
  rationale: மூலத்தின் מן முன்னிடைச்சொல் காரணம் அல்லது விடுதலைப் பொருளைத் தரக்கூடும். உரை உடலியல் நிலையை தனிப்பட்ட ஒழுக்கப்பாவம் என்று தீர்மானிப்பதில்லை; சடங்குசார் தீட்டும் பாவநிவிர்த்திச் செயலும் உள்ள பதற்றம் காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், லேவியச் சடங்குக்கேற்ற கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘தீட்டு’ என்பது ஒழுக்கக் குற்றத்தை அல்ல, இச்சூழலின் சடங்குசார் அசுத்தநிலையைச் சுட்டுகிறது. அனைத்து அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
