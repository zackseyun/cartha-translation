base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/011.yaml
  text: And everyone whom the man with the discharge touches[a], without having washed his hands in water, shall wash his clothes and bathe in water, and be unclean until the evening.
translation:
  language: ta
  text: உடலிலிருந்து ஒழுக்கு உள்ள ஆண் தன் கைகளைத் தண்ணீரில் கழுவாமல் யாரைத் தொடுகிறானோ[a], அந்த நபர் தன் உடைகளைத் துவைத்து, தண்ணீரில் குளித்து, மாலைவரை தீட்டுள்ளவராக இருப்பார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத் தொடரை, “அவன் தன் கைகளைத் தண்ணீரில் கழுவவில்லை என்றால்” என்றும் வாசிக்கலாம். கைகளை அவர் கழுவாதிருப்பதே, அவரது தொடுதலால் தீட்டு பரவும் நிபந்தனை எனப் புரிந்துகொள்ளப்படலாம்.
    reason: எபிரெயத் தொடரமைப்பிலுள்ள நிபந்தனைப் பொருளைத் தெளிவுபடுத்துதல்
lexical_decisions:
- source_word: הַזָּב
  choice: ஒழுக்கு உள்ள ஆண்
  rationale: זוּב என்பதிலிருந்து வந்த இச்சொல், இந்தத் தூய்மைச் சட்டச் சூழலில் உடலிலிருந்து ஒழுக்கு ஏற்படும் ஆண் ஒருவரைக் குறிக்கிறது. எபிரெயத்தில் வெளிப்படும் ஆண்பால் குறிப்பைத் தமிழிலும் தெளிவாக வைத்திருக்கிறது.
- source_word: יִגַּע בּוֹ
  choice: யாரைத் தொடுகிறானோ
  rationale: נגע என்பதுடன் ב வருவது உடல் தொடர்பைக் குறிக்கிறது. தமிழில் இயல்பான தொடர்பியல் வாக்கியமாக இது அமைக்கப்பட்டுள்ளது.
- source_word: וְיָדָיו לֹא שָׁטַף בַּמָּיִם
  choice: தன் கைகளைத் தண்ணீரில் அலசாமல்
  rationale: שטף என்பது அலசுதல் அல்லது நீரால் கழுவிவிடுதல் என்ற பொருளுடையது. பின்னர் வரும் உடல் குளித்தலையும் உடை துவைத்தலையும் விட இதைச் சொற்தேர்வில் வேறுபடுத்துகிறது. இயல்பான வாசிப்பில் கைகள் ஒழுக்கு உள்ள ஆணுடையவை.
- source_word: וְכִבֶּס בְּגָדָיו
  choice: தன் உடைகளைத் துவைத்து
  rationale: כּבס குறிப்பாக உடைகளைத் துவைப்பதைக் குறிக்கிறது; நவீனத் தமிழில் ‘உடைகள்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: וְרָחַץ בַּמַּיִם
  choice: தண்ணீரில் குளிக்க வேண்டும்
  rationale: רחץ இங்கு உடலைத் தண்ணீரால் கழுவுவதைக் குறிக்கிறது. ‘குளிக்க’ என்பது உடை துவைத்தலிலிருந்தும் கை அலசுதலிலிருந்தும் செயலைத் தெளிவாக வேறுபடுத்துகிறது.
- source_word: וְטָמֵא עַד הָעָרֶב
  choice: மாலைவரை அவர் தீட்டுள்ளவராக இருப்பார்
  rationale: טמא இங்கு ஒழுக்கியல் குற்றத்தைக் குறிக்காமல் சடங்குசார் தூய்மையின்மையைக் குறிக்கிறது. லேவியராகமத் தூய்மைச் சட்டங்களுக்கேற்ற தமிழ்ச் சொல்லாக ‘தீட்டு’ பயன்படுத்தப்படுகிறது.
- source_word: כֹל אֲשֶׁר
  choice: யாரை ... அவரோ
  rationale: இது ஒவ்வொரு நபருக்கும் பொருந்தும் பகிர்ந்தளிக்கும் பொருளை இயல்பான தமிழ்த் தொடர்பியல் அமைப்பில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: லேவியராகமத் தூய்மைச் சட்டத்தில் טמא என்பதன் தன்மை
  choice: ‘தீட்டுள்ளவர்’ என்று சடங்குசார் தூய்மையின்மையாக மொழிபெயர்த்தல்
  alternative: ‘அசுத்தமானவர்’ அல்லது ஒழுக்கரீதியாகக் கறைப்பட்டவர் எனப் புரிந்துகொள்ளுதல்
  rationale: உடல் ஒழுக்கினால் ஏற்படும் தொடர்பு, கழுவுதல், மாலைவரையிலான காலவரம்பு ஆகியவை சடங்குசார் நிலையைச் சுட்டுகின்றன; இங்கு ஒழுக்கியல் குற்றம் கூறப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியக்கூடியதாயும் லேவியராகமச் சட்டநடைக்கேற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘அலசுதல்’, ‘துவைத்தல்’, ‘குளித்தல்’ என்ற மூன்று வேறுபட்ட செயல்கள் மூலமொழியின் சொல்வேறுபாட்டை இயன்றவரைத் தக்கவைக்கின்றன.
