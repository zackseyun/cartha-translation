  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וּ/בַ/יּ֣וֹם הַ/שְּׁמִינִ֗י יִֽקַּֽח ל/וֹ֙ שְׁתֵּ֣י תֹרִ֔ים א֥וֹ שְׁנֵ֖י בְּנֵ֣י יוֹנָ֑ה וּ/בָ֣א לִ/פְנֵ֣י יְהוָ֗ה אֶל פֶּ֨תַח֙ אֹ֣הֶל מוֹעֵ֔ד וּ/נְתָנָ֖/ם אֶל הַ/כֹּהֵֽן־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/014.yaml
  text: And on the eighth day he shall take for himself two turtledoves or two young pigeons[a], and he shall come before Yahweh at the entrance of the tent of meeting and give them to the priest.
translation:
  language: ta
  text: எட்டாம் நாளில் அவன் தனக்காக இரண்டு காட்டுப்புறாக்களையோ இரண்டு இளம் புறாக்களையோ எடுத்துக்கொள்ள வேண்டும். பின்பு அவன் யாவேயின்[a] முன்னிலையில், சந்திப்புக் கூடாரத்தின் நுழைவாயிலுக்கு வந்து, அவற்றை ஆசாரியனிடம் கொடுக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரேயத்தில்: YHWH; இது வழக்கமாக “கர்த்தர்” என்றும், ஒலிபெயர்ப்பாக “யாவே” என்றும் வழங்கப்படுகிறது.'
    reason: தெய்வீகப் பெயரின் மூல வடிவத்தையும் பாரம்பரிய மாற்று மொழிபெயர்ப்பையும் தெரிவிக்கிறது.
lexical_decisions:
- source_word: וּבַיּוֹם הַשְּׁמִינִי
  choice: எட்டாம் நாளில்
  rationale: சட்டமுறை நிகழ்வுகளின் தொடர்ச்சியைத் தமிழில் இயல்பாகக் காட்டுகிறது; வாக்கியத் தொடக்கத்தில் உள்ள וּ-வைத் தனியே ‘மேலும்’ என்று மொழிபெயர்க்க வேண்டிய அவசியமில்லை.
- source_word: יִקַּח לוֹ
  choice: அவன் தனக்காக ... எடுத்துக்கொள்ள வேண்டும்
  rationale: לוֹ என்பதிலுள்ள தனிப்பட்ட தொடர்பை ‘தனக்காக’ தக்கவைக்கிறது; சட்ட அறிவுறுத்தலுக்குரிய கட்டாயப் பொருளை ‘வேண்டும்’ வெளிப்படுத்துகிறது.
- source_word: שְׁתֵּי תֹרִים
  choice: இரண்டு காட்டுப்புறாக்கள்
  rationale: תֹרִים என்பது பலிக்குப் பயன்படுத்தப்பட்ட turtledoves எனப்படும் புறா வகையைக் குறிக்கிறது; ‘காட்டுப்புறா’ என்பது புரிந்துகொள்ள எளிய நவீனத் தமிழ் இணைச்சொல்.
- source_word: אוֹ שְׁנֵי בְּנֵי יוֹנָה
  choice: அல்லது இரண்டு புறாக்குஞ்சுகள்
  rationale: ‘புறாவின் மகன்கள்’ என்ற எபிரேய மரபுத்தொடர் இளம் புறாக்களைக் குறிக்கிறது; தமிழில் ‘புறாக்குஞ்சுகள்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: וּבָא לִפְנֵי יְהוָה
  choice: பின்பு அவன் யாவே முன்னிலையில் ... வந்து
  rationale: சட்டமுறைத் தொடர்ச்சியை ‘பின்பு’ தெளிவாக்குகிறது; לִפְנֵי என்பதன் நேரடியான ‘முன்னிலையில்’ என்ற பொருளையும் தெய்வீகப் பெயரையும் தக்கவைக்கிறது.
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரத்தின் நுழைவாயிலுக்கு
  rationale: אֶל என்பதன் திசைநோக்குப் பொருளை ‘-க்கு’ தக்கவைக்கிறது; אֹהֶל מוֹעֵד என்பதற்கு வெளிப்படையான ‘சந்திப்புக் கூடாரம்’ பயன்படுத்தப்படுகிறது.
- source_word: וּנְתָנָם אֶל הַכֹּהֵן
  choice: அவற்றை ஆசாரியனிடம் கொடுக்க வேண்டும்
  rationale: נתן என்பதன் நேரடியான கொடுத்தல் அல்லது ஒப்படைத்தல் பொருளை எளிய தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் வரும் நான்கு எழுத்துத் தெய்வீகப் பெயரை ஒரு பொதுப் பட்டமாக மாற்றாமல், அதன் வழக்கமான அறிவார்ந்த ஒலிபெயர்ப்பைத் தமிழில் தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் லேவியராகமச் சட்ட அறிவுறுத்தலுக்கேற்ற கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. நீண்ட எபிரேய வாக்கியம் வாசிப்புத் தெளிவுக்காக இரண்டு தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது.
