  text: וְ/אִ֨ם עַֽל הַ/מִּשְׁכָּ֜ב ה֗וּא א֧וֹ עַֽל הַ/כְּלִ֛י אֲשֶׁר הִ֥וא יֹשֶֽׁבֶת עָלָ֖י/ו בְּ/נָגְע/וֹ ב֑/וֹ יִטְמָ֖א עַד הָ/עָֽרֶב־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/023.yaml
  text: And if it is on the bed or on the item on which she sits[a], when he touches it he shall be unclean until the evening.
translation:
  language: ta
  text: அது படுக்கையின்மேலோ, அவள் உட்காரும் பொருளின்மேலோ[a] இருந்தால், ஒருவன் அதைத் தொடும்போது மாலைவரை தீட்டாகிவிடுவான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பொருள்’ என்பதற்குப் பதிலாக ‘பாத்திரம்’ அல்லது ‘கருவி’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் כְּלִי என்பது பொருள், கருவி, பாத்திரம் ஆகியவற்றைக் குறிக்கக்கூடிய விரிவான சொல்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: இருந்தால்
  rationale: நிபந்தனைப் பொருளை இயல்பான தமிழ் வாக்கிய அமைப்பில் தருகிறது; எபிரெயச் சொற்றொடரின் இணைப்புணர்வு தொடரும் சட்டச் சூழலால் தெளிவாகிறது.
- source_word: עַל הַמִּשְׁכָּב
  choice: படுக்கையின்மேல்
  rationale: מִשְׁכָּב என்பது படுக்கை அல்லது படுக்கும் இடத்தைக் குறிக்கிறது; இச்சூழலில் ‘படுக்கை’ தெளிவான நவீனத் தமிழ்.
- source_word: הוּא
  choice: அது ... இருந்தால்
  rationale: ஆண்பால் ஒருமைச் சுட்டுப்பெயர் சூழலில் மறைமுகமாகக் குறிப்பிடப்பட்ட ஒன்றைச் சுட்டுகிறது; தமிழில் உயிரற்ற பொருளுக்குரிய ‘அது’ இயல்பானது.
- source_word: אוֹ
  choice: -ஓ ... -ஓ
  rationale: மாற்றுத் தேர்வை இயல்பான தமிழ் இணை அமைப்பால் வெளிப்படுத்துகிறது.
- source_word: עַל הַכְּלִי
  choice: பொருளின்மேல்
  rationale: כְּלִי என்பது பாத்திரம், கருவி, பொருள் ஆகியவற்றைக் குறிக்கக்கூடிய விரிவான சொல்; ‘பொருள்’ அதன் பரப்பை இச்சூழலில் நன்றாகப் பாதுகாக்கிறது.
- source_word: אֲשֶׁר הִוא יֹשֶׁבֶת עָלָיו
  choice: அவள் உட்காரும்
  rationale: எபிரெயப் பங்கேற்பு வடிவத்தின் தொடர்ச்சியான/வழக்கமான செயற்பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: בְּנָגְעוֹ בוֹ
  choice: ஒருவன் அதைத் தொடும்போது
  rationale: ב prefixed infinitive construct காலப்பொருளைத் தருகிறது. மூன்றாம் ஆண்பால் ஒருமையைத் தமிழில் பொதுவான சட்டச் சூழலுக்கேற்ற ‘ஒருவன்’ என வழங்குகிறது.
- source_word: יִטְמָא
  choice: தீட்டுப்பட்டிருப்பான்
  rationale: லேவியராகமத் தூய்மைச் சட்டங்களில் טמא குறிக்கும் சடங்குசார் அசுத்த நிலையை ‘தீட்டு’ இயல்பாக வெளிப்படுத்துகிறது; முடிவுறும் நிலையை ‘பட்டிருப்பான்’ காட்டுகிறது.
- source_word: עַד הָעָרֶב
  choice: மாலைவரை
  rationale: மாலை நேரம் வரையிலான கால எல்லையைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: லேவியராகமத் தூய்மைச் சட்டத்தில் טָמֵא என்பதன் இயல்பு
  choice: ‘தீட்டுப்பட்டிருப்பான்’ என்று சடங்குசார் அசுத்த நிலையைக் குறித்தல்
  alternative: ‘சடங்குப்படி அசுத்தமாயிருப்பான்’ அல்லது ‘அசுத்தமாயிருப்பான்’
  rationale: இவ்வசனம் ஒழுக்கக் குற்றத்தை அவசியம் குறிக்காமல் தூய்மைச் சட்டத்திற்குரிய நிலையைக் குறிப்பிடுகிறது. ‘தீட்டு’ தமிழில் அந்தச் சடங்குசார் பொருளைச் சுருக்கமாகக் காக்கிறது; விளக்கச் சொற்களை மூலவாக்கியத்தில் சேர்ப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சட்ட உரைக்கேற்ற கண்ணியமான, தெளிவான நடை. ‘தீட்டுப்பட்டிருப்பான்’ என்பது ஒழுக்கக் குற்றத்தைச் சேர்க்காமல் சடங்குசார் நிலையை வெளிப்படுத்துகிறது.
