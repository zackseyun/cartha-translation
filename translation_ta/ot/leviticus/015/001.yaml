revisions:
- from: பின்பு யாவே மோசேயிடமும் ஆரோனிடமும் பேசிக் கூறியது:[a]
  to: பின்பு யாவே மோசேயிடமும் ஆரோனிடமும் கூறினார்:[a]
  rationale: The revision retains the sequential sense of וַיְדַבֵּר through ‘பின்பு,’ preserves the repeated addressee relationship in ‘மோசேயிடமும் ஆரோனிடமும்,’ and uses the respectful personal verb ‘கூறினார்.’ The colon continues to introduce the direct speech signaled by לֵאמֹר without adding content not present in the Hebrew.
