  yaml_path: translation/ot/leviticus/015/001.yaml
  text: Then Yahweh spoke to Moses and to Aaron[a], saying,
translation:
  language: ta
  text: பின்பு யாவே மோசேயிடமும் ஆரோனிடமும் கூறினார்:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரேயத்தில்: ‘YHWH’; மரபாக ‘கர்த்தர்’ என்று மொழிபெயர்க்கப்படுகிறது.'
    reason: இறைப்பெயரின் எபிரேய வடிவத்தையும் மரபுவழி மாற்றீட்டையும் குறிப்பிடுதல்.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பின்பு ... பேசிக் கூறியது
  rationale: வய்யிக்தோல் வடிவம் உரையாடல் நிகழ்வை முன்னோக்கிக் கொண்டு செல்கிறது. ‘பின்பு’ அதன் தொடர்ச்சி உணர்வை இயல்பான தமிழில் வெளிப்படுத்துகிறது; דּבר மற்றும் தொடர்ந்து வரும் לֵאמֹר ஆகிய இரண்டின் வேறுபாட்டையும் ‘பேசிக் கூறியது’ தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரேய நான்கெழுத்து இறைப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரிந்துகொள்ளக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: மோசேயிடமும் ஆரோனிடமும்
  rationale: இருவருக்கும் முன் אֶל மீண்டும் வருவதைக் ‘-இடமும் ... -இடமும்’ என்ற இணை அமைப்பு இயல்பான தமிழில் பிரதிபலிக்கிறது.
- source_word: לֵאמֹר
  choice: 'கூறியது:'
  rationale: அடுத்து வரும் நேரடிக் கூற்றை அறிமுகப்படுத்தும் எபிரேய சூத்திரத்தைத் தமிழ் உரைநடையில் இயல்பாகக் காட்டுகிறது; முற்றுப்புள்ளிக்குப் பதிலாக முக்காற்புள்ளி அடுத்த வசனத்தில் சொற்கள் தொடர்வதை உணர்த்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட இறைப்பெயர் நேரடியாக உள்ளது. அதை பொதுப் பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் தன்மையைப் பாதுகாக்கிறது; மாற்று மரபுவழி வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. அடுத்த வசனத்தில் வரும் நேரடிக் கூற்றை அறிமுகப்படுத்தும் வகையில் வாக்கியம் அமைக்கப்பட்டுள்ளது.
