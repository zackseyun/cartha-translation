base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/033.yaml
  text: and for the woman who is sick in her menstrual impurity, and for the one who has a discharge, whether male or female, and for a man who lies with an unclean woman.
translation:
  language: ta
  text: மாதவிடாய்த் தீட்டில் இருக்கும் நலிவுற்ற பெண்ணுக்கும்[a], உடலிலிருந்து ஒழுக்கு ஏற்படுகிறவருக்கும்—ஆணாக இருந்தாலும் பெண்ணாக இருந்தாலும்—தீட்டான[b] பெண்ணுடன் படுக்கும் ஆணுக்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நலிவுற்ற பெண்” என்பதற்கு “மாதவிடாயில் இருக்கும் பெண்” என்றும் மொழிபெயர்க்கலாம். இங்கு எபிரேயச் சொல் மாதவிடாய் நிலையுடன் தொடர்புடைய நலிவு நிலையைச் சுட்டுகிறது.
    reason: lexical_alternative
  - marker: b
    text: இவ்வசனத்தில் “தீட்டான” என்பது லேவியச் சட்டத்தின்படியான சடங்குத் தீட்டைக் குறிக்கிறது; ஒழுக்கக்கேட்டையோ மனித மதிப்புக் குறைவையோ குறிக்கவில்லை.
    reason: cultural_note
lexical_decisions:
- source_word: הַדָּוָה בְּנִדָּתָהּ
  choice: மாதவிடாய்த் தீட்டில் இருக்கும் நலிவுற்ற பெண்
  rationale: הַדָּוָה என்பதிலுள்ள நலிவு அல்லது உடல்நலக் குறைவு சார்ந்த நுண்பொருளையும், בְּנִדָּתָהּ குறிக்கும் மாதவிடாய் காரணமான சடங்குத் தீட்டு நிலையையும் வேறுபடுத்திப் பாதுகாக்கிறது.
- source_word: הַזָּב אֶת זוֹבוֹ
  choice: ஒழுக்கு உடையவர்
  rationale: ஒருவருக்கு உடலிலிருந்து ஏற்படும் ஒழுக்கைக் குறிக்கும் எபிரேயச் சொற்றொடரை இயல்பான தமிழில் தருகிறது; அடுத்துவரும் ஆண்–பெண் இருவரையும் உள்ளடக்கும் குறிப்புக்கும் பொருந்துகிறது.
- source_word: לַזָּכָר וְלַנְּקֵבָה
  choice: அவர் ஆணாக இருந்தாலும் பெண்ணாக இருந்தாலும்
  rationale: முந்தைய ஒழுக்கு பற்றிய வகை ஆண், பெண் இருவருக்கும் பொருந்துவதைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר יִשְׁכַּב עִם
  choice: உடன் படுக்கும்
  rationale: பாலுறவைக் குறிக்கும் எபிரேய மரியாதைமிகு மறைமுகச் சொல்லாட்சியைத் தமிழிலும் வெளிப்படையாக விரிக்காமல் பாதுகாக்கிறது.
- source_word: טְמֵאָה
  choice: தீட்டான பெண்
  rationale: லேவியராகமத்தின் சடங்குத் தூய்மைச் சூழலில் உள்ள சொல்லை ஒழுக்கநெறி சார்ந்த குற்றமாக மாற்றாமல் தருகிறது.
theological_decisions:
- issue: சடங்குத் தீட்டு பற்றிய சொற்கள்
  choice: மாதவிடாய்த் தீட்டு; தீட்டான பெண்
  alternative: அசுத்தமான பெண்; ஒழுக்கரீதியாகக் களங்கப்பட்ட பெண்
  rationale: இவ்வசனம் லேவியச் சட்டத்தின் சடங்குத் தூய்மை நிலைகளைப் பற்றியது; பெண்ணின் ஒழுக்கத் தன்மையையோ மனித மதிப்பையையோ குறை கூறுவதில்லை.
- issue: הַדָּוָה என்பதிலுள்ள நலிவு சார்ந்த நுண்பொருள்
  choice: நலிவுற்ற பெண்
  alternative: மாதவிடாயில் இருக்கும் பெண்
  rationale: மாதவிடாய் நிலையை மட்டும் கூறுவது அடுத்த சொல்லுடன் பொருளை ஒன்றாக்கிவிடும்; ‘நலிவுற்ற’ என்பது முதல் சொல்லின் தனிப்பட்ட நுண்பொருளைப் பாதுகாக்கிறது, ஆனால் தனியான நோயைத் திட்டவட்டமாகச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், சட்டத் தொகுப்பின் முடிவுரைத் தன்மையை வெளிப்படுத்த “உரிய சட்டம் இதுவே” என வாக்கியம் நிறைவு செய்யப்பட்டுள்ளது. பாலுறவைக் குறிக்கும் மூலத்தின் மறைமுக நடை “உடன் படுக்கும்” என்று பாதுகாக்கப்பட்டுள்ளது; சடங்குத் தூய்மைச் சொற்கள் மரியாதையுடனும் பொதுவாசகர்களுக்குப் புரியும் வகையிலும் தரப்பட்டுள்ளன.
