  text: And if a man has an emission of semen[b][a], he shall wash all his flesh in water and be unclean until the evening.
translation:
  language: ta
  text: ஒரு ஆணிடமிருந்து விந்து வெளியேறினால்[a], அவன் தன் உடல் முழுவதையும் தண்ணீரில் கழுவ வேண்டும்; அவன் மாலைவரை தீட்டுப்பட்டவனாக இருப்பான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “விந்து வெளியேற்றம் ஏற்பட்டால்”; இன்னும் நேரடியாக, “விதையின் வெளியேற்றம்.”
    reason: lexical_alternative
  - marker: b
    text: இங்கு “தீட்டு” என்பது லேவியத் தூய்மைச் சட்டங்களின் சூழலில் சடங்குமுறைத் தீட்டைக் குறிக்கிறது; அது அவசியமாக ஒழுக்கரீதியான குற்றத்தைக் குறிப்பதில்லை.
    reason: cultural_note
lexical_decisions:
- source_word: אִישׁ
  choice: ஒரு ஆண்
  rationale: இந்தச் சட்டம் ஆணின் உடலிலிருந்து விந்து வெளியேறுவதைப் பற்றியது; ஆகவே பாலினத்தைக் குறிப்பாகக் காட்டும் இயல்பான தமிழ்ச் சொல் தேர்ந்தெடுக்கப்பட்டது.
- source_word: כִּי
  choice: வெளியேறினால்
  rationale: நிபந்தனை வடிவிலான சட்டச் சூழலில் כִּי என்பதன் பொருள் தமிழில் ‘-ஆல்’ என்ற நிபந்தனை விகுதியால் இயல்பாக வெளிப்படுகிறது.
- source_word: תֵצֵא מִמֶּנּוּ
  choice: அவனிடமிருந்து ... வெளியேறினால்
  rationale: ‘அவனிடமிருந்து வெளியே போனால்’ என்ற எபிரெய நேரடிப் பொருளை, உடல் வெளியேற்றத்தைக் குறிக்கும் தெளிவான நவீன தமிழில் வழங்குகிறது.
- source_word: שִׁכְבַת זָרַע
  choice: விந்து
  rationale: இச்சொற்றொடர் விந்து வெளியேற்றத்தைக் குறிக்கிறது. ‘விந்து’ என்பது இன்றைய தமிழில் தெளிவானதும் மருத்துவ அல்லது தேவையற்ற மறைமொழி இல்லாததும் ஆகும்; சொற்றொடரின் நேரடியான ‘விதை வெளியேற்றம்’ என்ற வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְרָחַץ
  choice: கழுவ வேண்டும்
  rationale: சட்டத்தின் தொடர்ச்சியில் இது செய்ய வேண்டிய செயலைக் குறிக்கிறது; ‘வேண்டும்’ நவீன தமிழில் அந்தக் கட்டளையை இயல்பாகத் தெரிவிக்கிறது.
- source_word: בַּמַּיִם
  choice: தண்ணீரில்
  rationale: בְ முன்னிடைச்சொல்லின் இங்குள்ள குளித்தல் அல்லது கழுவுதல் சார்ந்த பொருளை ‘தண்ணீரில்’ நெருக்கமாகப் பாதுகாக்கிறது.
- source_word: אֶת כָּל בְּשָׂרוֹ
  choice: தன் உடல் முழுவதையும்
  rationale: ‘தன் மாம்சம் முழுவதையும்’ என்பது சொற்சொல்லானாலும் நவீன தமிழில் இயல்பற்றது; சூழலில் முழு உடலையே குறிப்பதால் தெளிவான இயல்பான வடிவம் பயன்படுத்தப்பட்டது.
- source_word: וְטָמֵא
  choice: தீட்டுள்ளவனாக இருப்பான்
  rationale: லேவியராகமத் தூய்மைச் சட்டங்களுக்குரிய நிலையை ‘தீட்டு’ துல்லியமாகக் குறிக்கிறது. இது தானாகவே அறநெறிக் குற்றத்தைச் சுமத்தாது என்பதை அடிக்குறிப்பு விளக்குகிறது.
- source_word: עַד הָעָרֶב
  choice: மாலைவரை
  rationale: குறிப்பிட்ட கால எல்லையைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: தூய்மைச் சட்டங்களில் טָמֵא என்பதன் தன்மை
  choice: தீட்டுள்ளவனாக
  alternative: ஒழுக்கரீதியாக அசுத்தமானவனாக / சடங்குமுறைப்படி அசுத்தமானவனாக
  rationale: இச்சூழல் உடல் வெளியேற்றம் தொடர்பான லேவியத் தூய்மைச் சட்டம். எனவே அறநெறிக் குற்றத்தை உரையில் சேர்க்காமல் பாரம்பரியமான ‘தீட்டு’ என்ற சொல்லை முதன்மை உரையில் வைத்துக் கொண்டு, அதன் சடங்குமுறைச் சூழலை அடிக்குறிப்பில் தெளிவுபடுத்துகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், கண்ணியமான சட்டநடை பயன்படுத்தப்பட்டுள்ளது. உடலியல் விஷயம் மறைமொழியின்றித் தெளிவாகச் சொல்லப்பட்டாலும், சொற்கள் மருத்துவமயமாகவோ கொச்சையாகவோ அமையவில்லை. எபிரெய மொழியின் முழு உடல் கழுவுதல், மாலைவரையிலான தீட்டு ஆகிய கருத்துகள் பாதுகாக்கப்பட்டுள்ளன.
