source:
  edition: WLC
  text: וְ/כָל הַ/מֶּרְכָּ֗ב אֲשֶׁ֨ר יִרְכַּ֥ב עָלָ֛י/ו הַ/זָּ֖ב יִטְמָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/009.yaml
  text: And every saddle on which the man with the discharge rides shall be unclean[a].
translation:
  language: ta
  text: மேலும், உடலிலிருந்து ஒழுக்கு உள்ளவன் சவாரி செய்யும் ஒவ்வொரு சேணமும் தீட்டாகும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சவாரி செய்யப்படும் ஒவ்வொரு பொருளும்”; எபிரெயச் சொல் குறுகிய பொருளில் சேணத்தை மட்டும் அல்லாமல், சவாரி செய்யப்படும் எதையும் பரந்த வகையில் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל
  choice: ஒவ்வொன்றும்
  rationale: וְ முந்தைய விதியுடன் இதை இணைக்கிறது; தமிழில் வாக்கியத் தொடர்ச்சியால் அந்த இணைப்பு இயல்பாக வெளிப்படுகிறது. כָּל என்பதன் பகிர்வுப் பொருளை ‘ஒவ்வொன்றும்’ தெளிவாகக் காக்கிறது.
- source_word: הַ/מֶּרְכָּב
  choice: சேணம்
  rationale: מֶרְכָּב என்பது சவாரி செய்யப் பயன்படும் அல்லது சவாரி செய்யப்படுகிற பொருளைக் குறிக்கும். இச்சூழலில் ‘சேணம்’ இயல்பான குறிப்பிட்ட பொருள்; எபிரெயச் சொல்லின் பரந்த சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אֲשֶׁר יִרְכַּב עָלָיו
  choice: எதன்மேல் சவாரி செய்கிறானோ
  rationale: உறவுத்தொடரையும் עַל என்பதன் ‘மேல்’ என்ற இடப்பொருளையும் இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: הַ/זָּב
  choice: ஒழுக்கு உள்ளவன்
  rationale: זָב என்பது இவ்வதிகாரத்தில் உடல்/பாலுறுப்பு ஒழுக்கு உள்ள ஆணைக் குறிக்கும் பெயராக்கப்பட்ட ஆண்பால் வினையெச்சம். ‘ஒழுக்கு உள்ளவன்’ சுருக்கமாகவும் தெளிவாகவும் ஆண்பால் குறிப்பைக் காக்கிறது.
- source_word: יִטְמָא
  choice: தீட்டாகும்
  rationale: இது சடங்கு மற்றும் சட்டம் சார்ந்த அசுத்த நிலையைச் சுட்டுகிறது. ‘தீட்டாகும்’ தமிழ்வேதாகமச் சூழலில் புரிந்துகொள்ளத்தக்கது; அறநெறிக் குற்றத்தைத் தேவையின்றி புகுத்தாது.
theological_decisions:
- issue: லேவியராகமத்தில் தீட்டு மொழியின் இயல்பு
  choice: טמא என்பதை அறநெறிக் குற்றமாக அல்லாமல் சடங்கு/சட்டத் தீட்டு நிலையைக் குறிக்கும் ‘தீட்டாகும்’ என்று மொழிபெயர்த்தல்
  alternative: அசுத்தமாகும்; மாசுபடும்
  rationale: இந்த வசனம் உடல் ஒழுக்கினால் ஏற்படும் சடங்குத் தீட்டைப் பற்றியது; தனிப்பட்ட பாவத்தையோ அறநெறிச் சீர்கேட்டையோ கூறுவதில்லை. ‘தீட்டு’ அந்த வேறுபாட்டைத் தெளிவாகப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டவிதிக்கேற்ற கண்ணியமான மற்றும் எளிதில் புரியும் நடை. ‘சவாரி’ பொதுவழக்கில் தெளிவானது; ‘சேணம்’ குறிப்பிட்ட பொருளை வழங்குகிறது. அடிக்குறிப்பு மூலச்சொல்லின் உண்மையான பொருள் அகலத்தைப் பாதுகாக்கிறது.
