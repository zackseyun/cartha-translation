  source_fidelity: திருத்தம் தேவை. வரைவில் אִישׁ (‘ஒருவன்/ஆண்’) வெளிப்படையாக மொழிபெயர்க்கப்படவில்லை; மேலும் ‘அவனுடைய படுக்கையைத் தொடுகிறவன்’ என்பது தனித்து வாசிக்கும்போது உடைமையைக் குறிக்கும் முன்னிலைத் தொடர்பைத் தெளிவின்றி விடுகிறது. இவ்வசனத்தின் தொடர்ச் சூழலில் ‘அவனுடைய’ என்பது முன் கூறப்பட்ட நபரைக் குறிக்கிறது. சட்டவிதி வடிவிலான நிபந்தனை வாக்கியம் எபிரெய மூலத்தின் பொருளை இயல்பாகத் தருகிறது.
