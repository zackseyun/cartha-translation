base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/005.yaml
  text: And a man who touches his bed shall wash his clothes and bathe in water[b][a], and he shall be unclean until the evening.
translation:
  language: ta
  text: ஒருவன் அவனுடைய படுக்கையைத் தொட்டால்[b], தன் உடைகளைக் கழுவி, தண்ணீரில் குளிக்க வேண்டும்; அவன் மாலைவரை தீட்டுள்ளவனாக இருப்பான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, தூய்மை தொடர்பான விதிகளின்படி சடங்குசார் தீட்டுள்ளவன்; இது ஒழுக்கக் குற்றத்தைக் குறிப்பதல்ல.
    reason: cultural_note
  - marker: b
    text: ‘படுக்கை’ என்பதற்கான எபிரெயச் சொல், கட்டிலைக் மட்டும் அல்லாமல் அவன் படுத்திருந்த இடத்தையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אִישׁ אֲשֶׁר
  choice: தொடுகிறவன்
  rationale: אִישׁ என்பது ஆண்பால் ஒருமை ‘மனிதன்/ஆண்’; இச்சட்டச் சூழலில் தொடர்புடைய நபரை இயல்பான தமிழில் ‘-கிறவன்’ எனக் குறிப்பது மூலத்தின் ஆண்பால் ஒருமையைத் தக்கவைக்கிறது.
- source_word: יִגַּע
  choice: தொடுகிற
  rationale: נגע என்பதன் நேரடியான பொருள் ‘தொடு’; சடங்குசார் தொடர்பை தேவையின்றி விரித்துரைக்காமல் தெளிவாகக் காட்டுகிறது.
- source_word: בְּ/מִשְׁכָּב/וֹ
  choice: அவனுடைய படுக்கையை
  rationale: מִשְׁכָּב என்பது படுக்கும் இடம் அல்லது படுக்கையைக் குறிக்கலாம். முதன்மை உரையில் இயல்பான ‘படுக்கை’ பயன்படுத்தப்பட்டு, பரந்த பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: יְכַבֵּס בְּגָדָי/ו
  choice: தன் உடைகளைக் கழுவி
  rationale: כבס என்பது குறிப்பாகத் துணிகளைத் துவைப்பதைக் குறிக்கிறது; בגדים என்பதற்கு நவீனத் தமிழில் இயல்பான ‘உடைகள்’ தேர்ந்தெடுக்கப்பட்டது. ஒரே செய்பவரைத் தெளிவுபடுத்த ‘தன்’ பயன்படுத்தப்பட்டது.
- source_word: וְ/רָחַץ בַּ/מַּיִם
  choice: தண்ணீரில் குளிக்க வேண்டும்
  rationale: רחץ இங்கு உடலைக் கழுவுவதைக் குறிக்கிறது. தண்ணீரில் குளித்தல் என்ற தமிழ் நடை செயலைத் தெளிவாகவும் சட்டக் கட்டளையின் வலிமையை ‘வேண்டும்’ என்பதாலும் தெரிவிக்கிறது.
- source_word: וְ/טָמֵא
  choice: அவன் தீட்டுள்ளவனாக இருப்பான்
  rationale: טמא இங்கு ஒழுக்கக் குற்றத்தையல்ல, லேவியத் தூய்மை விதிகளுக்குட்பட்ட சடங்குசார் நிலையைக் குறிக்கிறது. ‘தீட்டு’ என்பது தமிழ் வேதாகம மற்றும் பண்பாட்டு வழக்கில் புரியக்கூடிய சொல்; அதன் வரையறை அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
- source_word: עַד הָ/עָרֶב
  choice: மாலைவரை
  rationale: தீட்டு நிலை நீடிக்கும் கால எல்லையைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது.
theological_decisions:
- issue: லேவியத் தூய்மைச் சட்டத்தில் ‘தீட்டு’ என்பதன் தன்மை
  choice: முதன்மை உரையில் ‘தீட்டுள்ளவனாக’ என்று வைத்து, அது சடங்குசார் நிலை என்பதை அடிக்குறிப்பில் விளக்குதல்
  alternative: ‘சடங்குமுறைப்படி தூய்மையற்றவன்’ என்று முதன்மை உரையிலேயே விரித்துரைத்தல்
  rationale: טָמֵא என்ற மூலச் சொல்லின் சட்ட மற்றும் வழிபாட்டுச் சார்ந்த வகைப்பாட்டைப் பாதுகாக்க வேண்டும்; அதனை ஒழுக்கப்பாவம் அல்லது குற்றவுணர்வு என்று மாற்றக் கூடாது. சுருக்கமான மூல வடிவம் முதன்மை உரையில் தக்கவைக்கப்பட்டு, தேவையான பண்பாட்டு விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. சட்டக் கட்டளையை இயல்பாக வெளிப்படுத்த ‘வேண்டும்’ என்பதும், நிலையை அறிவிக்க ‘இருப்பான்’ என்பதும் பயன்படுத்தப்பட்டன. மூலத்தின் ஆண்பால் ஒருமை தக்கவைக்கப்பட்டது; சடங்குசார் தீட்டு ஒழுக்கத் தீமையாகப் புரிந்துகொள்ளப்படாதபடி அடிக்குறிப்பு இணைக்கப்பட்டது.
