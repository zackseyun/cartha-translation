source:
  edition: WLC
  text: וְ/הַ/יֹּשֵׁב֙ עַֽל הַ/כְּלִ֔י אֲשֶׁר יֵשֵׁ֥ב עָלָ֖י/ו הַ/זָּ֑ב יְכַבֵּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/006.yaml
  text: Whoever sits on the object on which the man with the discharge sat shall wash his clothes and bathe in water[a], and he shall be unclean until the evening.
translation:
  language: ta
  text: உடல் ஒழுக்கு உள்ளவன் உட்கார்ந்திருந்த பொருளின்மேல்[a] உட்காருபவர் தம் ஆடைகளைத் துவைத்து, தண்ணீரில் குளிக்க வேண்டும்; அவர் மாலைவரை தீட்டானவராக இருப்பார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பாத்திரம்’ அல்லது ‘பயன்பாட்டுப் பொருள்’ என்றும் மொழிபெயர்க்கலாம்; இதற்கான எபிரெயச் சொல் பலவகைப் பொருட்களைக் குறிக்கும் பரந்த சொல்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַיֹּשֵׁב
  choice: உட்காருகிறவர்
  rationale: எபிரெயச் சொல்லமைப்பு, ‘உட்காருகிற ஒருவர்’ என்ற பொதுவான சட்டவிதிப் பொருளைக் கொண்ட பெயரெச்சத் தொடர். நவீனத் தமிழில் மரியாதை ஒருமையுடன் இயல்பாக வழங்கப்பட்டுள்ளது.
- source_word: הַכְּלִי
  choice: பொருள்
  rationale: כְּלִי என்பது பாத்திரம், கருவி, உபகரணம், பொருள் எனப் பலவகையான உடைமைகளைச் சுட்டும் பரந்த சொல். இங்கு உட்காரக்கூடிய எதையும் குறிக்கக்கூடும் என்பதால் ‘பொருள்’ அதன் பரப்பைத் தக்கவைக்கிறது.
- source_word: אֲשֶׁר יֵשֵׁב עָלָיו
  choice: உட்கார்ந்திருந்த
  rationale: அந்தப் பொருள்மீது உடல் ஒழுக்கு உள்ளவன் ஏற்கெனவே உட்கார்ந்ததைக் குறிக்கும் சார்புத்தொடர்; தமிழில் ‘உட்கார்ந்திருந்த’ என்பது காலத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַזָּב
  choice: உடல் ஒழுக்கு உள்ளவன்
  rationale: זָב என்பது இப்பகுதியில் உடலிலிருந்து, குறிப்பாக ஆண் இனப்பெருக்க உறுப்பிலிருந்து, ஒழுக்கு உள்ள ஆணைக் குறிக்கிறது. ‘உடல் ஒழுக்கு’ என்பது மருத்துவ விவரத்தை அளவுக்கு அதிகமாகக் குறிப்பாக்காமல் நிலையைத் தெளிவுபடுத்துகிறது.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: தம் ஆடைகளைத் துவைத்து
  rationale: כִּבֵּס ஆடைகளைத் துவைப்பதைக் குறிப்பாகக் குறிக்கிறது. ‘தம்’ என்பது உட்கார்ந்த அந்த ஒருவரையே திரும்பச் சுட்டுகிறது.
- source_word: וְרָחַץ בַּמַּיִם
  choice: தண்ணீரில் குளிக்க வேண்டும்
  rationale: தூய்மைச் சட்டச் சூழலில் רָחַץ உடலைத் தண்ணீரால் கழுவுவதைக் குறிக்கிறது; ‘குளிக்க வேண்டும்’ என்பது நவீனத் தமிழில் தெளிவான இயல்பான கட்டளை வடிவம்.
- source_word: וְטָמֵא עַד הָעָרֶב
  choice: அவர் மாலைவரை தீட்டுள்ளவராக இருப்பார்
  rationale: טָמֵא இங்கு சடங்குசார் தீட்டு நிலையைக் குறிக்கிறது; ‘மாலைவரை’ அதன் கால எல்லையை நேரடியாகத் தக்கவைக்கிறது.
theological_decisions:
- issue: טָמֵא குறிக்கும் தீட்டின் இயல்பு
  choice: தீட்டுள்ளவர்
  alternative: அசுத்தமானவர்; சடங்குப்படி அசுத்தமானவர்
  rationale: சூழல் ஒழுக்கக் குற்றத்தையோ தனிப்பட்ட பாவத்தையோ அல்ல, லேவியத் தூய்மைச் சட்டத்தின்படியான நிலையையே குறிக்கிறது. ‘தீட்டு’ அதைச் சுருக்கமாகத் தெரிவிக்கிறது; ‘சடங்குப்படி’ என்று மூலத்தில் இல்லாத விளக்கத்தை வசனத்துக்குள் சேர்க்கவில்லை.
- issue: הַזָּב என்பவரின் பாலினமும், பின்னர் வரும் ஒருமைச் சுட்டுகளும்
  choice: ‘உடல் ஒழுக்கு உள்ளவன்’ என்று ஆண் பாலைக் குறிப்பிட்டு, தொடர்பால் தீட்டடையும் நபருக்கு மரியாதை ஒருமை பயன்படுத்தப்பட்டுள்ளது
  alternative: ஒழுக்கு உள்ளவர்; அவர்/அவர்கள்
  rationale: இந்தப் பகுதி ஆணின் உடல் ஒழுக்கைப் பற்றியது; ஆகவே முதல் நபரின் ஆண் பால் தெளிவாக வைக்கப்பட்டுள்ளது. அவருடன் தொடர்புகொள்ளும் நபருக்கான எபிரெய வடிவம் இலக்கண ரீதியாக ஆண்பால் ஒருமையாக இருந்தாலும், விதியின் பொதுப் பயன்பாட்டை இயல்பான தமிழில் ‘உட்காருகிறவர்’ என வழங்குவது பொருளை மாற்றாது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. சட்டவிதியின் கட்டாயத் தன்மை ‘வேண்டும்’ என்பதால் வெளிப்படுத்தப்பட்டுள்ளது. ‘தீட்டு’ என்பது உடல்நலமின்மை அல்லது ஒழுக்கக் குற்றம் எனப் பொருள் சேர்க்காமல், இச்சூழலின் சடங்குசார் நிலையைத் தக்கவைக்கிறது. அடிக்குறிப்பு குறியீடு அது விளக்கும் ‘பொருள்’ என்பதற்குப் பின்பே வைக்கப்பட்டுள்ளது.
