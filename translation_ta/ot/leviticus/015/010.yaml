source:
  edition: WLC
  text: וְ/כָל הַ/נֹּגֵ֗עַ בְּ/כֹל֙ אֲשֶׁ֣ר יִהְיֶ֣ה תַחְתָּ֔י/ו יִטְמָ֖א עַד הָ/עָ֑רֶב וְ/הַ/נּוֹשֵׂ֣א אוֹתָ֔/ם יְכַבֵּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/010.yaml
  text: And everyone who touches anything that was under him shall be unclean until the evening[a], and whoever carries them shall wash his clothes and bathe in water[b], and be unclean until the evening.
translation:
  language: ta
  text: அவனுக்குக் கீழே இருந்த எதையாவது தொடுகிற ஒவ்வொருவரும் மாலைவரை தீட்டுள்ளவராக இருப்பார்.[a] அவற்றைச் சுமக்கிறவர் தம் உடைகளைக் கழுவி, தண்ணீரில் குளிக்க வேண்டும்;[b] அவர் மாலைவரை தீட்டுள்ளவராக இருப்பார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவனுக்குக் கீழே இருக்கிற எதையாவது.’ எபிரெயத்தை நிகழ்காலத்தில் இன்னும் சொல்லுக்கு நெருக்கமாக மொழிபெயர்க்கலாம்; ஆனால் பாதிக்கப்பட்டவன் முன்பு பயன்படுத்திய பொருட்களைப் பற்றிய நடைமுறைச் சூழலுக்கு இறந்தகாலம் பொருந்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘அவற்றை’ என்பது அவனுக்குக் கீழே இருந்ததால் தீட்டுப்பட்ட பொருட்களைத் தொகுப்பாகச் சுட்டுகிறது.
    reason: cross_reference
lexical_decisions:
- source_word: הַנֹּגֵעַ
  choice: தொடுகிற
  rationale: נגע என்ற வினையின் பங்கேற்புவடிவம் இங்கு நேரடியான உடல் தொடர்பைக் குறிக்கிறது; ‘தொடுகிற’ என்பது இயல்பான, தெளிவான தமிழ்.
- source_word: בְּכֹל אֲשֶׁר יִהְיֶה תַחְתָּיו
  choice: அவனுக்குக் கீழே இருந்த எதையாவது
  rationale: תחתיו என்பது ‘அவனுக்குக் கீழே’ என்ற இடவுறவைக் குறிக்கிறது. எபிரெயத்தில் நிகழ்கால வடிவம் இருந்தாலும், முன்பு அவனுக்குக் கீழே இருந்த பொருட்களைச் சுட்டும் நடைமுறைச் சூழலுக்கேற்ப தமிழில் இறந்தகாலம் இயல்பாக உள்ளது; மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: יִטְמָא
  choice: தீட்டுள்ளவராக இருப்பார்
  rationale: லேவியராகமத்தின் சடங்குசார் தூய்மைச் சூழலில் טמא என்பதை ‘தீட்டு’ என்ற வழக்கமான தமிழ் வேதாகமச் சொல்லால் மொழிபெயர்ப்பது, ஒழுக்கக்கேட்டை அல்ல சடங்குசார் நிலையைச் சுட்டுகிறது.
- source_word: עַד הָעָרֶב
  choice: மாலைவரை
  rationale: எபிரெயத்தின் கால எல்லையைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: הַנּוֹשֵׂא אֹתָם
  choice: அவற்றைச் சுமக்கிறவர்
  rationale: נשא இங்கு பொருட்களைத் தூக்கிச் செல்லுதல் அல்லது சுமத்தலைக் குறிக்கிறது. ஆண்பால் பன்மைச் சுட்டுப்பெயரை, முன்னர் குறிப்பிடப்பட்ட பொருட்களைத் தொகுப்பாகச் சுட்டும் ‘அவற்றை’ என்று வழங்கப்பட்டுள்ளது.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: தம் உடைகளைக் கழுவி
  rationale: בגדים என்பதற்கு நவீன பொதுத் தமிழில் ‘உடைகள்’ தெளிவானது. ‘தம்’ என்பது சட்டவிதியின் பொதுப்பொருள் கொண்ட எழுவாயுடன் இயல்பாக ஒத்துவருகிறது.
- source_word: וְרָחַץ בַּמַּיִם
  choice: தண்ணீரில் குளிக்க வேண்டும்
  rationale: רחץ இந்தத் தூய்மைப்படுத்தும் சூத்திரத்தில் உடலைத் தண்ணீரால் கழுவுவதைக் குறிக்கிறது; ‘குளிக்க வேண்டும்’ என்பது தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: וְטָמֵא עַד הָעָרֶב
  choice: அவர் மாலைவரை தீட்டுள்ளவராக இருப்பார்
  rationale: கழுவுதல், குளித்தல் ஆகியவற்றுக்குப் பிறகும் மாலைவரை நீடிக்கும் சடங்குசார் நிலையைத் தெளிவுபடுத்த எழுவாய் மீண்டும் வெளிப்படையாகக் கூறப்பட்டுள்ளது.
theological_decisions:
- issue: טמא என்பதன் சடங்குசார் பொருள்
  choice: தீட்டுள்ளவர்
  alternative: அசுத்தமானவர்
  rationale: இச்சூழலில் சொல்லப்படுவது ஒழுக்க அல்லது உடல்சார் அழுக்கு அல்ல; மோசேயின் சட்டத்திலுள்ள சடங்குசார் நிலை. ‘தீட்டு’ அந்த வேறுபாட்டைத் துல்லியமாகப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான சட்டநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மூலத்தின் தொடுதல், சுமத்தல், கழுவுதல், குளித்தல், மாலைவரை நீடிக்கும் தீட்டு ஆகிய படிநிலைகள் காக்கப்பட்டுள்ளன.
