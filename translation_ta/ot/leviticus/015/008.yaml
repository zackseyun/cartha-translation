review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the conditional case, the person with the discharge, spitting on a ritually clean person, washing garments, bathing in water, and ritual uncleanness lasting until evening. The required actions and resulting status belong to the person who was spat on; this should be made explicit in Tamil.
  naturalness: ‘ஒழுக்கு உள்ளவன்’ and repeated ‘சடங்குமுறைப்படி’ are understandable but somewhat awkward and heavy in modern standard Tamil. ‘உடல் ஒழுக்கு உள்ளவன்,’ ‘சடங்குரீதியாகத் தூய்மையான ஒருவர்மேல்,’ and an explicit resumed subject (‘அந்த நபர்’) are clearer and more natural.
  terminology: ‘தூய்மையான’ and ‘தீட்டுப்பட்ட’ suitably convey the ritual clean/unclean contrast when qualified as ritual. ‘தீட்டுப்பட்டவராக இருப்பார்’ is more idiomatic than ‘தீட்டுள்ளவராக இருப்பார்’ and does not imply moral fault.
  issues:
  - severity: medium
    issue: The referent of ‘அவர்’ after the conditional clause is potentially unclear.
    rationale: The Hebrew grammar makes the clean person—the one spat on—the subject of washing, bathing, and becoming unclean. Repeating that referent in Tamil removes a possible ambiguity with the man who has the discharge.
  - severity: low
    issue: Some wording is less idiomatic than necessary in modern Tamil.
    rationale: ‘ஒழுக்கு உள்ளவன்’ is elliptical, and repeated ‘சடங்குமுறைப்படி’ makes the legal sentence cumbersome. Small adjustments preserve the source sense while improving readability.
