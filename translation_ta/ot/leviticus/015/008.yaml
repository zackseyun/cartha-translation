base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/008.yaml
  text: And if the man with the discharge spits on a clean person[a], he shall wash his clothes and bathe in water[b], and he shall be unclean until the evening.
translation:
  language: ta
  text: உடல் ஒழுக்கு உள்ளவன் சடங்குரீதியாகத் தூய்மையான ஒருவர்மேல்[a] துப்பினால், அந்த நபர் தம் உடைகளைக் கழுவி, தண்ணீரில் குளிக்க வேண்டும்; அவர் மாலைவரை சடங்குரீதியாகத் தீட்டுப்பட்டவராக இருப்பார்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “தூய்மையானவர்மேல்”; இது சடங்குரீதியாகத் தூய்மை நிலையில் இருக்கும் ஒருவரைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: இது ஒழுக்கரீதியான குற்றத்தைக் குறிக்காமல், மாலைவரை நீடிக்கும் சடங்குசார் தீட்டு நிலையைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/כִֽי
  choice: …னால்
  rationale: வாவ் இணைப்புடன் வரும் כִּי இங்கு சட்ட நிபந்தனையை அறிமுகப்படுத்துகிறது; தமிழில் இயல்பான நிபந்தனை விகுதி பயன்படுத்தப்பட்டது.
- source_word: יָרֹק
  choice: துப்பினால்
  rationale: வினைச்சொல்லின் நேரடிப் பொருள் ‘துப்பு’; ஒருவர்மேல் நிகழ்வதைத் தமிழில் ‘மேல்’ தெளிவாக்குகிறது.
- source_word: הַזָּב
  choice: ஒழுக்கு உள்ளவன்
  rationale: உடலிலிருந்து ஒழுக்கு உள்ள ஆண்பால் நபரைச் சுட்டும் எபிரெயச் சொல்லின் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: בַּ/טָּהוֹר
  choice: சடங்குமுறைப்படி தூய்மையான ஒருவர்மேல்
  rationale: பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்ட טָהוֹר ஒரு நபரையும், இச்சூழலில் சடங்குசார் தூய்மை நிலையையும் குறிக்கிறது.
- source_word: וְ/כִבֶּס בְּגָדָי/ו
  choice: அவர் தம் உடைகளைக் கழுவி
  rationale: כִּבֶּס ஆடைகளைக் கழுவுவதைக் குறிக்கிறது; ‘அவர்’ என்பது துப்பப்பட்ட தூய்மையான நபரையே இயல்பாகச் சுட்டுகிறது.
- source_word: וְ/רָחַץ בַּ/מַּיִם
  choice: தண்ணீரில் குளிக்க வேண்டும்
  rationale: இச்சடங்குச் சூழலில் רָחַץ உடலை நீரில் கழுவுதல் அல்லது குளித்தலைக் குறிக்கிறது.
- source_word: וְ/טָמֵא
  choice: சடங்குமுறைப்படி தீட்டுள்ளவராக இருப்பார்
  rationale: இது ஒழுக்கக் குற்றத்தை அல்ல, சடங்குசார் தீட்டு நிலையைச் சுட்டுகிறது; தமிழில் அந்த வேறுபாடு வெளிப்படையாகக் காட்டப்பட்டது.
- source_word: עַד הָ/עָרֶב
  choice: மாலைவரை
  rationale: லேவியராகமத்தில் சடங்குசார் தீட்டு நீடிக்கும் காலத்தைக் குறிக்கும் வழக்கமான காலச் சொற்றொடர்.
theological_decisions:
- issue: தூய்மை மற்றும் தீட்டு குறித்த சொற்கள்
  choice: טָהוֹר / טָמֵא என்பவற்றை ‘சடங்குமுறைப்படி தூய்மையான’ / ‘சடங்குமுறைப்படி தீட்டுள்ள’ என மொழிபெயர்த்தல்
  alternative: ‘சுத்தமான’ / ‘அசுத்தமான’ அல்லது ‘தூய்மையான’ / ‘தீட்டான’
  rationale: லேவியராகமம் 15-இல் இச்சொற்கள் முதன்மையாக இஸ்ரவேலின் சடங்குசார் நிலையைச் சுட்டுகின்றன; உடல் அழுக்கையோ ஒழுக்கக் குற்றத்தையோ அவசியம் குறிக்கவில்லை.
translation_notes:
  register: நவீன தரத்தமிழில், சட்ட உரைக்கு ஏற்ற கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டது. ‘சடங்குமுறைப்படி’ என்பதன் மூலம் தூய்மை/தீட்டு என்பது உடல் அழுக்கு அல்லது ஒழுக்கக் குற்றம் என்று தவறாகப் புரிந்துகொள்ளப்படுவது தவிர்க்கப்பட்டது; மூலத்தின் ஆண்பால் ஒருமை ‘ஒழுக்கு உள்ளவன்’ என்பதில் பாதுகாக்கப்பட்டது.
