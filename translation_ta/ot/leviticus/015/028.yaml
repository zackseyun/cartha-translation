base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/028.yaml
  text: But if she is cleansed from her discharge[a], then she shall count seven days for herself, and after that she shall be clean.
translation:
  language: ta
  text: ஆனால் அவள் தன் வடிதலிலிருந்து சுத்தமானால்[a], அவள் தனக்காக ஏழு நாட்களை எண்ண வேண்டும்; அதற்குப் பிறகு அவள் சுத்தமாவாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவள் தன் வடிதலிலிருந்து சுத்தமடைந்தால் ... அதற்குப் பிறகு அவள் சுத்தமாவாள்.” எபிரெயத்தில் இரு இடங்களிலும் ஒரே வேர்ச்சொல் பயன்படுத்தப்பட்டுள்ளது; முதல் இடத்தில் அது அவளுடைய வடிதலிலிருந்து சுத்தமாவதைக் குறிக்கிறது; பின்னர், ஏழு நாட்களுக்குப் பின் கிடைக்கும் சடங்குசார் சுத்த நிலையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: ஆனால் ... ஆனால்
  rationale: முந்தைய நிலைக்கு மாறான நிபந்தனையை இயல்பான நவீனத் தமிழில் அறிமுகப்படுத்துகிறது; வாக்கிய அமைப்பில் நிபந்தனை முடிவில் வரும் காரணத்தால் ‘ஆனால்’ தொடக்கத்திலும் ‘-ஆனால்’ வினையிலும் வெளிப்படுகிறது.
- source_word: טָהֲרָה מִזּוֹבָהּ
  choice: அவளுடைய வடிதல் நின்று அவள் சுத்தமானால்
  rationale: எபிரெய வினை வடிதலிலிருந்து விடுபட்டு சுத்த நிலைக்கு மாறுவதைக் குறிக்கிறது. ‘வடிதல் நின்று’ என்பது உடல் வெளியேற்றம் முடிவதைத் தெளிவாக்குகிறது; ‘சுத்தமானால்’ טהר என்ற மூலத்தின் சொற்பிணைப்பைப் பாதுகாக்கிறது.
- source_word: וְסָפְרָה לָּהּ
  choice: அவள் தனக்காக ... எண்ண வேண்டும்
  rationale: לָּהּ என்பதைக் ‘தனக்காக’ என்று வெளிப்படையாகக் காத்து, சட்டவழிமுறையின் கட்டாயப் பொருளை ‘வேண்டும்’ மூலம் இயல்பாகத் தருகிறது.
- source_word: שִׁבְעַת יָמִים
  choice: ஏழு நாட்களை
  rationale: எண்ணுதல் வினையின் நேரடி செயப்படுபொருளாகத் தமிழில் இயல்பாக அமைக்கப்பட்டுள்ளது.
- source_word: וְאַחַר
  choice: அதற்குப் பிறகு
  rationale: ஏழு நாள் கணக்கைத் தொடர்ந்து வரும் அடுத்த கட்டத்தைத் தெளிவாகக் குறிக்கிறது.
- source_word: תִּטְהָר
  choice: அவள் சுத்தமாவாள்
  rationale: ஏழு நாட்களுக்குப் பின் அடையும் சடங்குசார் சுத்த நிலையைக் குறிக்கிறது; முதல் உட்பிரிவிலுள்ள அதே טהר மூலத்துடனான தொடர்பும் தமிழில் ‘சுத்தம்’ மூலம் காக்கப்படுகிறது.
theological_decisions:
- issue: சடங்குசார் சுத்தம்
  choice: ‘சுத்தம்/சுத்தமாதல்’ என்ற சொற்களைச் சடங்குசார் நிலையாகப் பயன்படுத்துதல்
  alternative: ‘தூய்மை/தூய்மையாதல்’ அல்லது ஒழுக்கரீதியான தூய்மை எனப் புரியவைக்கும் மொழி
  rationale: லேவியராகமம் 15 உடல் வடிதலுடன் தொடர்புடைய சடங்குசார் நிலையைப் பற்றியது; இது ஒழுக்கக் குற்றத்தையோ பாவத்தையோ கூறுவதில்லை.
- issue: טהר என்பதன் இருமுறை பயன்பாடு
  choice: முதல் இடத்தில் வடிதல் நின்றதையும் அதனால் ஏற்பட்ட சுத்த நிலையையும், இறுதியில் ஏழு நாட்களுக்குப் பிந்தைய சடங்குசார் சுத்த நிலையையும் வேறுபடுத்திக் காட்டுதல்
  alternative: இரு இடங்களையும் எந்த விளக்க வேறுபாடுமின்றி ஒரே விதமாக மொழிபெயர்த்தல்
  rationale: எபிரெயம் ஒரே மூலச்சொல்லைப் பயன்படுத்தினாலும், சூழலில் முதலில் வடிதல் முடிவதும் பின்னர் கணக்குக் காலத்துக்குப் பின் கிடைக்கும் சடங்குசார் நிலையுமே முன்னிலைப்படுகின்றன; அடிக்குறிப்பு இந்த உண்மையான நுணுக்கத்தைப் பாதுகாக்கிறது.
