revisions:
- from: ஆனால் அவளுடைய வடிதல் நின்று அவள் சுத்தமானால்[a], அவள் தனக்காக ஏழு நாட்களை எண்ண வேண்டும்; அதற்குப் பிறகு அவள் சுத்தமாவாள்.
  to: ஆனால் அவள் தன் வடிதலிலிருந்து சுத்தமானால்[a], அவள் தனக்காக ஏழு நாட்களை எண்ண வேண்டும்; அதற்குப் பிறகு அவள் சுத்தமாவாள்.
  rationale: The revision removes the unsupported explicit assertion that the discharge has stopped and translates the Hebrew prepositional phrase directly. It preserves the conditional legal instruction, “for herself,” the seven-day interval, and the repeated ritual-clean terminology. The revised footnote accurately notes the same Hebrew root in both clauses while distinguishing their contextual functions without treating cessation as explicit wording.
