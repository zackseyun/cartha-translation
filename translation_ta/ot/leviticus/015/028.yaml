  register: நவீன தரநிலைத் தமிழ்; சட்டவழிமுறைக்கேற்ற கண்ணியமான, தெளிவான நடை. ‘வடிதல்’ உடல் வெளியேற்றத்தைக் குறிக்கும் மருத்துவநடைக்கு அருகான சொல்; ‘சுத்தம்’ இங்கு ஒழுக்கநிலையல்ல, சடங்குசார் நிலையைக் குறிக்கிறது.
