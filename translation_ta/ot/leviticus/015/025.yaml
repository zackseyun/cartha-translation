  source_fidelity: 'The draft accurately represents both alternatives in the Hebrew: an extended blood discharge outside the time of menstrual impurity, or a discharge continuing beyond it. It also correctly preserves the concluding comparison and the ritual-status sense of טְמֵאָה. The second clause''s ‘தாண்டி’ is a sound contextual rendering of עַל.'
