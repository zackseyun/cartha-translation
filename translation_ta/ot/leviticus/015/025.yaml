  text: וְ/אִשָּׁ֡ה כִּֽי יָזוּב֩ ז֨וֹב דָּמָ֜/הּ יָמִ֣ים רַבִּ֗ים בְּ/לֹא֙ עֶת נִדָּתָ֔/הּ א֥וֹ כִֽי תָז֖וּב עַל נִדָּתָ֑/הּ כָּל יְמֵ֞י ז֣וֹב טֻמְאָתָ֗/הּ כִּ/ימֵ֧י נִדָּתָ֛/הּ תִּהְיֶ֖ה טְמֵאָ֥ה הִֽוא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/025.yaml
  text: If a woman has a discharge of blood for many days[a], not at the time of her menstrual impurity, or if she has a discharge beyond her menstrual impurity, all the days of her unclean discharge she shall be unclean[b], as in the days of her menstrual impurity.
translation:
  language: ta
  text: ஒரு பெண்ணுக்கு அவளுடைய மாதவிடாய்த் தீட்டுக்குரிய காலத்தில் அல்லாமல் பல நாட்கள் இரத்தப்போக்கு இருந்தாலோ[a], அல்லது அவளுடைய மாதவிடாய்த் தீட்டுக் காலத்தையும் தாண்டி இரத்தப்போக்கு நீடித்தாலோ[b], அவளுடைய தீட்டான இரத்தப்போக்கு நீடிக்கும் எல்லா நாட்களிலும், மாதவிடாய்த் தீட்டின் நாட்களைப் போலவே அவள் தீட்டுள்ளவளாக இருப்பாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவளுடைய மாதவிடாய்க் காலத்துக்கு வெளியே.’ இங்கு வரும் எபிரெயச் சொல் மாதவிடாய் இரத்தப்போக்கை மட்டும் அல்லாமல், அதனுடன் தொடர்புடைய சடங்குசார் தீட்டு நிலையையும் உள்ளடக்குகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அவளுடைய மாதவிடாய்த் தீட்டுடன் கூடுதலாக இரத்தப்போக்கு இருந்தாலோ’; அதாவது, வழக்கமான மாதவிடாய்க் காலத்துக்கு அப்பாலும் அது நீடித்தால்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָזוּב / תָזוּב + זוֹב
  choice: இரத்தப்போக்கு இருந்தாலோ / இரத்தப்போக்கு நீடித்தாலோ
  rationale: זוּב என்னும் வினை–பெயர்ச்சொல் சேர்க்கை இயல்புக்கு மாறான உடல் திரவப்போக்கைக் குறிக்கிறது. தமிழில் ‘இரத்தப்போக்கு’ என்பது இயல்பானதும் தெளிவானதும்; இரண்டாம் கூறில் ‘நீடித்தாலோ’ என்பது עַל குறிக்கும் காலநீட்சியை வெளிப்படுத்துகிறது.
- source_word: דָּמָהּ
  choice: இரத்தப்போக்கு
  rationale: சொல்லுக்கு நேரடியாக ‘அவளுடைய இரத்தம்’ என்ற பொருள் இருந்தாலும், זוֹב உடன் சேரும்போது தமிழில் ‘இரத்தப்போக்கு’ என வழங்குவது இயல்பாக உள்ளது.
- source_word: יָמִים רַבִּים
  choice: பல நாட்கள்
  rationale: காலத்தின் நீளத்தை மூலத்துக்கு நெருக்கமாகவும் இயல்பான தமிழிலும் தெரிவிக்கிறது.
- source_word: בְּלֹא עֶת נִדָּתָהּ
  choice: அவளுடைய மாதவிடாய்த் தீட்டுக்குரிய காலத்தில் அல்லாமல்
  rationale: עֵת என்பதன் ‘காலம்’ என்ற கருத்தையும், נִדָּה என்பதில் மாதவிடாயுடன் தொடர்புடைய சடங்குசார் தீட்டு நிலை அடங்குவதையும் காக்கிறது.
- source_word: נִדָּה
  choice: மாதவிடாய்த் தீட்டு
  rationale: இந்த லேவியராகமச் சட்டச் சூழலில் இது உயிரியல் நிகழ்வை மட்டும் அல்லாமல் அதனுடன் தொடர்புடைய சடங்குசார் தீட்டு நிலையையும் குறிக்கிறது.
- source_word: עַל נִדָּתָהּ
  choice: அவளுடைய மாதவிடாய்த் தீட்டுக் காலத்தையும் தாண்டி
  rationale: עַל இங்கு வழக்கமான மாதவிடாய்க் காலத்துக்கு அப்பாலும் இரத்தப்போக்கு தொடர்வதைக் குறிக்கலாம். ‘தாண்டி’ அந்த காலநீட்சியைத் தெளிவாக வழங்குகிறது.
- source_word: כָּל יְמֵי זֹב טֻמְאָתָהּ
  choice: அவளுடைய தீட்டான இரத்தப்போக்கு இருக்கும் எல்லா நாட்களிலும்
  rationale: திரவப்போக்கையும் அதனால் ஏற்படும் சடங்குசார் தீட்டு நிலையையும் தமிழில் தெளிவாக இணைக்கிறது.
- source_word: טְמֵאָה
  choice: தீட்டுள்ளவளாக
  rationale: இது ஒழுக்கக் குற்றத்தைக் காட்டாமல் லேவியராகமத்தின் சடங்குசார் தூய்மை–தீட்டு வகைப்பாட்டைக் குறிக்கிறது.
- source_word: כִּימֵי נִדָּתָהּ
  choice: மாதவிடாய்த் தீட்டு இருக்கும் நாட்களில் இருப்பதுபோலவே
  rationale: இயல்புக்கு மாறான இரத்தப்போக்குக் காலத்திலுள்ள அவளது நிலை, மாதவிடாய்த் தீட்டுக் காலத்திலுள்ள நிலைக்கு ஒப்பானது என்பதை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: சடங்குசார் தீட்டு மொழியை ஒழுக்கக் குற்றமாகப் புரிந்துகொள்ளாதவாறு வழங்குதல்
  choice: ‘தீட்டு’, ‘மாதவிடாய்த் தீட்டு’, ‘தீட்டுள்ளவள்’ என்ற சடங்குசார் நிலைமொழியைப் பயன்படுத்துதல்
  alternative: ‘அசுத்தம்’ என்று முழுவதும் வழங்குதல் அல்லது தீட்டு நிலையை வெளிப்படுத்தாமல் ‘மாதவிடாய்’ என்று மட்டும் வழங்குதல்
  rationale: இந்த வசனம் தனிப்பட்ட பாவம் அல்லது ஒழுக்கத் தவறு பற்றி அல்ல; லேவியராகமச் சட்டத்தில் உள்ள சடங்குசார் தூய்மை நிலையைக் குறிக்கிறது. தேர்ந்த சொற்கள் அந்த வேறுபாட்டைக் காக்கின்றன.
translation_notes:
  register: நவீன தரத் தமிழில், சட்டவாக்கியத்தின் நிபந்தனை அமைப்பை ‘இருந்தாலோ … நீடித்தாலோ’ என இயல்பாக வைத்துள்ளோம். ‘தீட்டு’ என்பது இங்கு இழிவுபடுத்தும் அல்லது ஒழுக்கத் தீர்ப்பளிக்கும் சொல் அல்ல; சடங்குசார் நிலையைத் துல்லியமாகக் குறிக்கிறது. மூலத்தின் நீண்ட வாக்கிய அமைப்பும் இரு மாற்று நிலைகளும் பாதுகாக்கப்பட்டுள்ளன.
