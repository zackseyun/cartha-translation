  terminology: ‘மாதவிடாய்த் தீட்டு,’ ‘தீட்டான இரத்தப்போக்கு,’ and ‘தீட்டுள்ளவளாக’ consistently convey the Levitical ritual category without making a moral judgment. The footnotes appropriately explain the broader ritual sense of נִדָּה and the extension/addition sense in the second condition.
