  yaml_path: translation/ot/leviticus/015/002.yaml
  text: 'Speak to the sons of Israel and say to them: When any man has a discharge from his body[b][a], his discharge is unclean.'
translation:
  language: ta
  text: '“இஸ்ரவேல் மக்களிடம்[a] பேசி, அவர்களிடம் சொல்லுங்கள்: ‘எந்த ஆணுக்காவது அவனுடைய உடலிலிருந்து[b] கசிவு ஏற்பட்டால், அவனுடைய கசிவு தீட்டானது.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்கு சொல், ‘இஸ்ரவேலின் மகன்கள்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது ‘அவனுடைய சதையிலிருந்து.’
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבְּרוּ
  choice: பேசி
  rationale: பன்மை ஏவல் வடிவத்தையும், மோசே மற்றும் ஆரோனுக்குக் கொடுக்கப்படும் முறையான கட்டளையின் தொனியையும் காக்கிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: சொல்லுக்கு சொல் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், முழு உடன்படிக்கைச் சமூகத்தைக் குறிக்கும் இச்சொற்றொடரை நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் ‘இஸ்ரவேல் மக்கள்’ என வழங்குகிறது; நேரடி வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וַאֲמַרְתֶּם אֲלֵהֶם
  choice: அவர்களிடம் சொல்லுங்கள்
  rationale: எபிரெயச் சட்ட உரையின் தொடர்ச்சியான கட்டளைச் சூத்திரத்தையும் பன்மையையும் தெளிவாகப் பேணுகிறது.
- source_word: אִישׁ אִישׁ
  choice: எந்த ஆணுக்காவது
  rationale: இரட்டிக்கப்பட்ட אִישׁ பகிர்ந்தளிக்கும் பொருளில் ‘எந்த ஆணாக இருந்தாலும்’ என்பதைக் குறிக்கிறது; இச்சூழல் ஆணின் உடல் கசிவைப் பற்றியது என்பதால் பாலினக் குறிப்பைத் தக்கவைக்கிறது.
- source_word: זָב
  choice: கசிவு ஏற்பட்டால்
  rationale: உடலிலிருந்து வெளியேறும் கசிவு என்ற சட்ட-மருத்துவச் சூழலை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; כִּי அறிமுகப்படுத்தும் நிகழ்வுசார் வழக்கை ‘ஏற்பட்டால்’ காட்டுகிறது.
- source_word: מִבְּשָׂרוֹ
  choice: அவனுடைய உடலிலிருந்து
  rationale: בָּשָׂר என்பதன் நேரடிப் பொருள் ‘சதை’; இத்தூய்மைச் சட்டச் சூழலில் ‘உடல்’ தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது. நேரடி மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: זוֹבוֹ
  choice: அவனுடைய கசிவு
  rationale: זָב என்பதுடன் ஒரே சொல்லியல் வேரைச் சேர்ந்த பெயர்ச்சொல்லுக்கு ‘கசிவு’ என்பதைத் தொடர்ந்து பயன்படுத்தி சட்ட உரையின் சொல் ஒற்றுமையைப் பேணுகிறது.
- source_word: טָמֵא הוּא
  choice: தீட்டானது
  rationale: லேவியத் தூய்மைச் சட்டங்களில் טָמֵא குறிக்கும் சடங்குசார் அசுத்த நிலையை, ஒழுக்கப் பாவம் என்று தவறாக உணர்த்தாமல், தமிழில் நிலைபெற்ற ‘தீட்டு’ சொல்லால் தெரிவிக்கிறது; הוּא கசிவைக் குறிக்கும் வாசிப்பையும் பேணுகிறது.
theological_decisions:
- issue: சடங்குசார் அசுத்தத்தைக் குறிக்கும் טָמֵא சொல்லின் மொழிபெயர்ப்பு
  choice: தீட்டானது
  alternative: அசுத்தமானது
  rationale: இங்கு சொல்லப்படுவது ஒழுக்கக் குற்றமல்ல, லேவியச் சட்டத்தின்படியான சடங்குசார் நிலை. ‘தீட்டானது’ அந்த வேறுபாட்டைத் தெளிவாகவும் வழக்கமான தமிழிலும் காட்டுகிறது.
- issue: טָמֵא הוּא என்பதில் தீட்டு எதற்குச் சொல்லப்படுகிறது
  choice: அவனுடைய கசிவு தீட்டானது
  alternative: அவன் தீட்டானவன்
  rationale: அருகிலுள்ள זוֹבוֹ (‘அவனுடைய கசிவு’) ஆண்பால் பெயர்ச்சொல் என்பதால் הוּא அதைக் குறிக்க இயலும்; வாக்கிய அமைப்பும் ‘கசிவு தீட்டானது’ என்ற வாசிப்பை நேரடியாக ஆதரிக்கிறது. மனிதனுக்கே நேரடியாக ஒழுக்கத் தீர்ப்பு வழங்குவது போன்ற தவறான எண்ணத்தையும் இது தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்ட உரைக்கேற்ற கண்ணியமான நேரடி நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘கசிவு’ மருத்துவச் சூழலைத் தெளிவாகச் சொன்னாலும் தேவையற்ற உடற்கூறு விளக்கத்தைச் சேர்க்காது. மேற்கோள் அமைப்பு இது மக்களிடம் சொல்லப்பட வேண்டிய நேரடி அறிவுரை என்பதை வெளிப்படுத்துகிறது.
