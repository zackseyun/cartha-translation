base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/026.yaml
  text: Every bed on which she lies during all the days of her discharge shall be to her like the bed of her menstruation[a], and every vessel on which she sits shall be unclean[b], like the uncleanness of her menstruation.
translation:
  language: ta
  text: அவளுக்கு இரத்தப்போக்கு இருக்கும் எல்லா நாட்களிலும், அவள் படுக்கும் ஒவ்வொரு படுக்கையும் அவளுடைய மாதவிடாய்க் காலப் படுக்கையைப் போலத் தீட்டானதாக இருக்கும்[a]. அவள் உட்காரும் ஒவ்வொரு பொருளும்[b], அவளுடைய மாதவிடாயின் தீட்டைப் போலத் தீட்டானதாக இருக்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவளுடைய மாதவிடாய்த் தீட்டுக்குரிய படுக்கையைப் போல” என்றும் மொழிபெயர்க்கலாம். நித்தா (נִדָּה) என்ற எபிரேயச் சொல் மாதவிடாய் நிலையையும் அதனுடன் தொடர்புடைய சடங்கியல் விலக்குநிலையையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இங்கு “பொருள்” என்பது பாத்திரத்தை மட்டும் குறிக்காமல், அவள் உட்காரக்கூடிய சாமான் அல்லது பயன்பாட்டுப் பொருள் எதையும் குறிக்கக்கூடிய பரந்த சொல்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִּשְׁכָּב
  choice: படுக்கை
  rationale: படுத்துக்கொள்ளும் இடத்தைக் குறிக்கிறது; இச்சூழலில் இயல்பானதும் தெளிவானதும் ‘படுக்கை’.
- source_word: כָּל יְמֵי זוֹבָהּ
  choice: அவளுக்கு இரத்தப்போக்கு இருக்கும் எல்லா நாட்களிலும்
  rationale: இவ்வதிகாரத்தின் சூழலில் זוֹבָהּ மாதவிடாய் காலத்துக்கு அப்பாற்பட்ட நீடித்த இரத்தப்போக்கைக் குறிக்கிறது; தமிழில் அதன் உடலியல் தன்மையைத் தெளிவுபடுத்த ‘இரத்தப்போக்கு’ பயன்படுத்தப்பட்டது.
- source_word: נִדָּתָהּ
  choice: அவளுடைய மாதவிடாய்
  rationale: இங்கு மாதவிடாய் நிலையே ஒப்பீட்டின் நேரடியான பொருள்; கூடுதல் விளக்கத்தை முதன்மை உரையில் திணிக்காமல் தெளிவாக மொழிபெயர்க்கிறது.
- source_word: יִהְיֶה לָּהּ
  choice: தீட்டானதாக இருக்கும்
  rationale: எபிரேயக் கட்டமைப்பு அவளைச் சார்ந்த சடங்கியல் நிலையை வகைப்படுத்துகிறது; தமிழில் தேவையான நிலைப்பொருள் சூழலிலிருந்து வெளிப்படையாகக் கூறப்படுகிறது.
- source_word: כְּלִי
  choice: பொருள்
  rationale: כְּלִי என்பது பாத்திரம் மட்டுமல்லாமல் கருவி, சாமான் அல்லது பயன்பாட்டுப் பொருள் எனப் பரந்த பொருளுடையது; ஒருவர் உட்காரக்கூடிய எந்தப் பொருளையும் உள்ளடக்க ‘பொருள்’ பொருத்தமானது.
- source_word: טָמֵא / טֻמְאָה
  choice: தீட்டான / தீட்டு
  rationale: லேவியராகமத்தின் சடங்கியல் தூய்மைச் சட்டங்களில் வழக்கமான தமிழ்ச் சொல்லாட்சி; ஒழுக்கக் குற்றத்தை அல்ல, சடங்கியல் நிலையைக் குறிக்கிறது.
theological_decisions:
- issue: טָמֵא / טֻמְאָה என்பவற்றின் தன்மை
  choice: சடங்கியல் நிலையைக் குறிக்கும் ‘தீட்டான / தீட்டு’
  alternative: அசுத்தமான / அசுத்தம்
  rationale: வசனம் தனிப்பட்ட பாவத்தையோ ஒழுக்கக் குற்றத்தையோ கூறாமல், இஸ்ரவேலின் தூய்மைச் சட்டத்திற்குள் உள்ள சடங்கியல் நிலையை விவரிக்கிறது.
- issue: נִדָּה என்பதன் மொழிபெயர்ப்பு
  choice: மாதவிடாய்
  alternative: மாதவிடாய்த் தீட்டு அல்லது விலக்குநிலை
  rationale: உடனடிச் சூழலில் உடலியல் நிலையையே குறிக்கிறது; ‘மாதவிடாய்’ என்பது தெளிவாக இருந்து, சொல் தாங்கக்கூடிய சடங்கியல் விலக்குநிலை நுணுக்கத்தை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. உடலியல் விவரத்தை மறைக்காமல் ‘இரத்தப்போக்கு’, ‘மாதவிடாய்’ என்ற தெளிவான சொற்களும், சடங்கியல் சட்டச் சூழலைக் காட்ட ‘தீட்டு’ என்ற நிலையான வேதாகமத் தமிழ்ச் சொல்லும் பயன்படுத்தப்பட்டுள்ளன.
