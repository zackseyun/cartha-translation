  source_fidelity: The draft correctly identifies זוֹבָהּ as the abnormal discharge addressed in this context, renders מִשְׁכָּב and כְּלִי broadly and naturally, and consistently conveys ritual rather than moral impurity with ‘தீட்டான/தீட்டு.’ However, ‘அவளுடைய மாதவிடாயின்போது பயன்படுத்தும் படுக்கை’ adds the idea of a bed she uses during menstruation. The Hebrew says ‘the bed of her menstrual state,’ a ritual comparison rather than a statement about use.
