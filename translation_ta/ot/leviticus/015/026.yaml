  terminology: ‘தீட்டு’ is retained as the established Tamil ritual-status term and should not be understood as moral fault. ‘பொருள்’ suitably preserves the breadth of כְּלִי, with the footnote clarifying that it includes an item on which she may sit. ‘மாதவிடாய்க் காலப் படுக்கை’ accurately expresses the comparison involving נִדָּה without importing a denominational interpretation.
