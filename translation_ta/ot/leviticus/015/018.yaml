base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/018.yaml
  text: If a man lies with a woman and has an emission of semen[b][a], both of them shall wash in water and be unclean until the evening.
translation:
  language: ta
  text: ஒரு ஆண் ஒரு பெண்ணுடன் உடலுறவு கொண்டு விந்து வெளியேறினால், அவர்கள் இருவரும் தண்ணீரில் கழுவிக்கொள்ள வேண்டும்; மாலைவரை தீட்டானவர்களாக[a] இருப்பார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு “தீட்டு” என்பது ஒழுக்கக் குற்றத்தைக் குறிக்காமல், மாலைவரை நீடிக்கும் சடங்குசார் தூய்மையின்மையைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וְאִשָּׁה אֲשֶׁר יִשְׁכַּב אִישׁ אֹתָהּ
  choice: ஒரு ஆண் ஒரு பெண்ணுடன் உடலுறவுகொண்டு
  rationale: எபிரெய சட்டச் சூழலில் உள்ள நிபந்தனைத் தன்மையையும், שׁכב என்ற பாலுறவைக் குறிக்கும் மரபுத்தொடரின் பொருளையும் இயல்பான நவீனத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: שִׁכְבַת זָרַע
  choice: விந்து வெளியேறினால்
  rationale: இந்தக் கூட்டுச்சொல் இச்சூழலில் குறிப்பாக விந்து வெளியேற்றத்தைக் குறிக்கிறது; சொல்லுக்குச் சொல் அமைப்பைத் திணிக்காமல் உடல்சார் பொருளைத் துல்லியமாகத் தருகிறது.
- source_word: וְרָחֲצוּ בַמַּיִם
  choice: அவர்கள் இருவரும் தண்ணீரில் கழுவிக்கொள்ள வேண்டும்
  rationale: பன்மை வினை இரு பங்கேற்பாளர்களையும் குறிக்கிறது. 'இருவரும்' என்பதை வெளிப்படையாக்கி, சட்டக் கட்டளையின் வலிமையை 'வேண்டும்' என்பதால் தருகிறது.
- source_word: וְטָמְאוּ
  choice: தீட்டுள்ளவர்களாக இருப்பார்கள்
  rationale: லேவியராகமத்தின் தூய்மைச் சட்டச் சூழலுக்குப் பொருத்தமான 'தீட்டு' என்ற சொல்லைப் பயன்படுத்தி, ஒழுக்கக் குற்றம் அல்லது பாவம் என்ற கருத்தைச் சேர்க்காமல் இருக்கிறது.
- source_word: עַד הָעָרֶב
  choice: மாலைவரை
  rationale: எபிரெய மூலத்தின் கால எல்லையைச் சுருக்கமாகவும் இயல்பாகவும் பாதுகாக்கிறது; 'சூரியன் மறையும் வரை' என்று அதிகமாக விளக்கவில்லை.
theological_decisions:
- issue: லேவிய தூய்மைச் சட்டத்தில் தீட்டின் தன்மை
  choice: மூல உரையில் உள்ளபடி 'தீட்டுள்ளவர்களாக' என்று மொழிபெயர்த்து, இது சடங்குசார் நிலை என்பதை அடிக்குறிப்பில் தெளிவுபடுத்துதல்
  alternative: '''சடங்குமுறைப்படி தீட்டுள்ளவர்களாக'' என்று முதன்மை உரையிலேயே விரிவாக்குதல்'
  rationale: இந்த வசனம் தற்காலிகமான சடங்குசார் தூய்மையின்மையைப் பற்றியது; ஒழுக்கக் குற்றத்தையோ பாவத்தையோ கூறவில்லை. அதேவேளையில், 'சடங்குமுறைப்படி' என்பது மூலத்தில் வெளிப்படையாக இல்லாததால் அடிக்குறிப்பில் வைக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதைமிக்க ஆனால் பொதுவாசகருக்குத் தெளிவான சட்டநடை பயன்படுத்தப்பட்டுள்ளது. பாலுறவும் விந்து வெளியேற்றமும் மறைமுகமாக்கப்படாமல் மருத்துவத் தெளிவுடன் கூறப்பட்டுள்ளன; தேவையற்ற கொச்சைத்தன்மையும் பழமையான சொற்களும் தவிர்க்கப்பட்டுள்ளன.
