source:
  edition: WLC
  text: זֹ֥את תּוֹרַ֖ת הַ/זָּ֑ב וַ/אֲשֶׁ֨ר תֵּצֵ֥א מִמֶּ֛/נּוּ שִׁכְבַת זֶ֖רַע לְ/טָמְאָה בָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/032.yaml
  text: 'This is the law for the one with a discharge[a], and for him from whom an emission of semen goes out, making him unclean by it:'
translation:
  language: ta
  text: 'உடலிலிருந்து ஒழுக்கு ஏற்படுகிறவருக்கானதும், விந்து வெளியேறுகிறவருக்கானதும் சட்டம் இதுவே; அவனால் அவர் சடங்குமுறையில் தீட்டானவர் ஆகிறார்:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זֹאת תּוֹרַת
  choice: உரிய சட்டம் இதுவே
  rationale: லேவியராகமத்தின் சுருக்கச் சட்டச் சூத்திரத்தை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; זֹאת என்பதன் சுட்டுப்பொருளையும் תּוֹרַת என்பதன் சட்ட அறிவுறுத்தல் பொருளையும் காக்கிறது.
- source_word: הַזָּב
  choice: ஒழுக்கு உள்ளவர்
  rationale: உடலிலிருந்து ஏற்படும் நோய்சார் ஒழுக்கைக் குறிக்கும் எபிரெயப் பங்கேற்புப் பெயரை, பாலினத்தைத் தேவையின்றி சேர்க்காமல் தெளிவாக வழங்குகிறது.
- source_word: וַאֲשֶׁר תֵּצֵא מִמֶּנּוּ שִׁכְבַת זֶרַע
  choice: விந்து அவரிடமிருந்து வெளியேறி
  rationale: ‘அவரிடமிருந்து வெளியேறும் விந்து’ என்ற மூலத்தின் நேரடியான உருவகத்தை இயல்பான தமிழில் காக்கிறது; சூழல் இது ஆணைக் குறிக்கிறது.
- source_word: לְטָמְאָה בָהּ
  choice: அதனால் தீட்டுப்பட்டவர்
  rationale: விந்து வெளியேறியதன் விளைவாகச் சடங்குசார் தீட்டு ஏற்படுவதைத் தெளிவாகக் கூறுகிறது; בָהּ என்பதன் கருவிப் பொருள் ‘அதனால்’ எனப் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: טמא என்பதன் பொருள்
  choice: தீட்டுப்பட்டவர்
  alternative: அசுத்தமானவர்
  rationale: இங்கு கருத்து பொதுவான அழுக்கு அல்லது ஒழுக்கக்கேடு அல்ல; லேவியராகமத்தின் சடங்குசார் நிலை. ‘தீட்டு’ அந்த வேறுபாட்டைத் தெளிவாகக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சட்டச் சுருக்கத்திற்கு ஏற்ற கண்ணியமான நடை. ‘விந்து’ என்பது தெளிவான, வழக்கிலுள்ள மருத்துவச் சொல்; ‘தீட்டு’ சடங்குசார் அசுத்தநிலையை ஒழுக்கக் குற்றத்திலிருந்து வேறுபடுத்துகிறது.
