- from: 'ஒழுக்கு உள்ளவருக்கும்[a], விந்து அவரிடமிருந்து வெளியேறி அதனால் தீட்டுப்பட்டவருக்கும் உரிய சட்டம் இதுவே:'
  to: 'உடலிலிருந்து ஒழுக்கு ஏற்படுகிறவருக்கானதும், விந்து வெளியேறுகிறவருக்கானதும் சட்டம் இதுவே; அவனால் அவர் சடங்குமுறையில் தீட்டானவர் ஆகிறார்:'
  rationale: The revision clarifies the bodily-discharge sense of הַזָּב, preserves the Hebrew coordination (‘the law of … and of …’), and expresses the result/means in לְטָמְאָה בָּהּ as ritual uncleanness incurred through the seminal emission. The footnote is retained as a genuinely more formal alternative, but its syntax is corrected. Because the revised text does not use a footnote marker in the verse, the unattached footnote is removed from the presented passage.
