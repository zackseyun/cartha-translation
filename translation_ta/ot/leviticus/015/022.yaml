  text: וְ/כָל הַ/נֹּגֵ֔עַ בְּ/כָל כְּלִ֖י אֲשֶׁר תֵּשֵׁ֣ב עָלָ֑י/ו יְכַבֵּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/022.yaml
  text: And everyone who touches any object on which she sits shall wash his clothes and bathe in water[a], and he shall be unclean until the evening.
translation:
  language: ta
  text: அவள் உட்காரும் எந்தப் பொருளையும் தொடுபவன் தன் உடைகளைக் கழுவி, தண்ணீரில் குளிக்க வேண்டும்; அவன் மாலைவரை தீட்டுள்ளவனாக இருப்பான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பொருள்” என்பதற்கு “பாத்திரம்,” “கருவி” அல்லது “உபயோகப் பொருள்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் כְּלִי பரந்த பொருளுடையது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל הַנֹּגֵעַ
  choice: தொடுகிற எவரும்
  rationale: இணைப்புடன் வரும் כָל மற்றும் பெயர்ச்சொல்லாகச் செயல்படும் பங்கேற்புவினை, விதி பொருந்தும் அனைவரையும் பொதுவாகக் குறிக்கின்றன; இத்தமிழாக்கம் அந்த முழுமையான வரம்பை இயல்பாகத் தருகிறது.
- source_word: בְּכָל כְּלִי
  choice: எந்தப் பொருளை
  rationale: כְּלִי என்பது பாத்திரம், கருவி, பொருள் உள்ளிட்ட பரந்த பொருளுடைய சொல். இச்சூழலில் ‘பொருள்’ என்பது தேவையற்ற குறுக்கமின்றி இயல்பாக உள்ளது.
- source_word: אֲשֶׁר תֵּשֵׁב עָלָיו
  choice: அவள் உட்காரும்
  rationale: இச்சார்புவாக்கியம் முந்தைய சூழலில் குறிப்பிடப்பட்ட பெண்ணையும், அவள் உட்காரும் பொருளையும் குறிக்கிறது; தமிழில் இடத்தொடர்பு வினையிலேயே தெளிவாக வெளிப்படுகிறது.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: தன் உடைகளைக் கழுவி
  rationale: כִּבֵּס என்பது ஆடைகளைத் துவைப்பது அல்லது கழுவுவதைக் குறிக்கிறது. ஒரே நபரைக் குறிக்கும் இயல்பான தமிழ்ச் சுட்டாக ‘தன்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: וְרָחַץ בַּמַּיִם
  choice: தண்ணீரில் குளிக்க வேண்டும்
  rationale: தூய்மைச் சட்டச் சூழலில் רָחַץ உடலை நீரில் கழுவுவதைக் குறிக்கிறது; ‘குளிக்க வேண்டும்’ அதன் உடல் சார்ந்த செயலையும் கட்டளை வலிமையையும் தெளிவாக்குகிறது.
- source_word: וְטָמֵא
  choice: தீட்டுள்ளவராக இருப்பார்
  rationale: טָמֵא இங்கு அறச்சார்ந்த குற்றத்தை அல்ல, சடங்குசார் அசுத்த நிலையைச் சுட்டுகிறது. லேவியராகமத் தூய்மைச் சட்ட மொழியில் ‘தீட்டு’ இந்தப் பிரிவைச் சுருக்கமாகக் காட்டுகிறது.
- source_word: עַד הָעָרֶב
  choice: மாலைவரை
  rationale: தீட்டு நிலையின் கால எல்லையைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: லேவியராகமத் தூய்மைச் சட்டத்தில் טָמֵא என்பதன் இயல்பு
  choice: சடங்குசார் நிலையை உணர்த்தும் ‘தீட்டுள்ளவர்’
  alternative: அசுத்தமானவர்; மாசுபட்டவர்
  rationale: இவ்வசனம் தொடுதலால் ஏற்படும் சடங்குசார் நிலையைப் பற்றியது; தனிப்பட்ட பாவத்தையோ அறக்குற்றத்தையோ கூறுவதில்லை. ஆகவே அறநெறிக் குற்றவுணர்வைச் சேர்க்காத சொல்லாக்கம் தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ். சட்டவாக்கியத்தின் கட்டளைத் தன்மைக்காக ‘வேண்டும்’ பயன்படுத்தப்பட்டுள்ளது; ‘தீட்டு’ என்பது அறக்குற்றம் அல்லாமல் சடங்குசார் நிலையைச் சுட்டும் வகையில் அமைந்துள்ளது.
