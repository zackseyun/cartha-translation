  text: And everything on which she lies during her menstrual impurity shall be unclean[a], and everything on which she sits shall be unclean.
translation:
  language: ta
  text: அவளுடைய மாதவிடாய்த் தீட்டின்போது அவள் எதன்மேல் படுத்துக்கொள்கிறாளோ, அது தீட்டுப்பட்டதாகும்[a]; அவள் எதன்மேல் உட்காருகிறாளோ, அதுவும் தீட்டுப்பட்டதாகும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவளுடைய மாதவிடாயின்போது.” எபிரெயச் சொல் மாதவிடாய் நிகழ்வை மட்டுமல்லாமல், அதனுடன் தொடர்புடைய சடங்குத் தீட்டு நிலையையும் உள்ளடக்குகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִדָּה
  choice: மாதவிடாய்த் தீட்டு
  rationale: மாதவிடாய் என்ற உடலியல் நிகழ்வை மட்டுமல்லாமல், லேவியராகமத்தின் சடங்குத் தூய்மைச் சட்டங்களில் அதனுடன் தொடர்புடைய தீட்டு நிலையையும் குறிக்கிறது.
- source_word: תִּשְׁכַּב
  choice: படுத்துக்கொள்கிறாள்
  rationale: இங்கு தூங்குவதை அவசியமாகக் குறிக்காமல், ஓர் பொருளின்மேல் படுத்திருப்பதைக் குறிக்கிறது.
- source_word: תֵּשֵׁב
  choice: உட்காருகிறாள்
  rationale: ஓர் பொருளின்மேல் அமர்வதை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: עָלָיו
  choice: எதன்மேல்
  rationale: அவளுக்குக் கீழுள்ள பொருளுடனான இடவுறவைத் தமிழ் சார்புத் தொடர் வடிவில் இயல்பாகக் காட்டுகிறது.
- source_word: יִטְמָא
  choice: தீட்டுப்பட்டதாகும்
  rationale: சட்டச் சூழலில் ஒரு பொருள் சடங்குத் தூய்மையற்ற நிலையை அடைவதைக் குறிக்கிறது; ஒழுக்கக் குற்றத்தை உணர்த்தாது.
- source_word: וְכֹל אֲשֶׁר
  choice: எதன்மேல் ... அது
  rationale: எல்லாவற்றையும் உள்ளடக்கும் எபிரெய உறவுத்தொடரை இயல்பான நவீனத் தமிழில் முழுமையாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: லேவியத் தூய்மைச் சட்டத்தில் ‘தீட்டு’ என்பதன் இயல்பு
  choice: טמא மற்றும் נִדָּה ஆகியவற்றைச் சடங்குத் தூய்மை சார்ந்த சொற்களால் மொழிபெயர்த்தல்
  alternative: மாதவிடாயை ஒழுக்கக் குற்றம் அல்லது பாவம் என உணர்த்தக்கூடிய சொற்களைப் பயன்படுத்துதல்
  rationale: இந்த வசனம் இஸ்ரவேலின் சடங்குத் தூய்மை முறைக்குரிய நிலையைப் பற்றியது; மாதவிடாய் ஓர் ஒழுக்கத் தவறு என்று மூலவசனம் கூறவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் சட்டவுரைக்கேற்ற கண்ணியமான நடையிலும் அமைக்கப்பட்டது. ‘தீட்டு’ என்பது இங்கு ஒழுக்கக் குற்றத்தையல்ல, சடங்குத் தூய்மையற்ற நிலையையே குறிக்கிறது.
