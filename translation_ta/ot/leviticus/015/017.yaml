source:
  edition: WLC
  text: וְ/כָל בֶּ֣גֶד וְ/כָל ע֔וֹר אֲשֶׁר יִהְיֶ֥ה עָלָ֖י/ו שִׁכְבַת זָ֑רַע וְ/כֻבַּ֥ס בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/017.yaml
  text: And every garment and every skin on which there is an emission of semen shall be washed with water and be unclean until the evening[a][b].
translation:
  language: ta
  text: விந்துச் சுரப்பு இருக்கும் ஒவ்வொரு ஆடையும் ஒவ்வொரு தோலும்[a][b] தண்ணீரில் கழுவப்பட வேண்டும்; அவை மாலைவரை தீட்டாயிருக்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “விந்து வெளியேற்றம்.”
    reason: lexical_alternative
  - marker: b
    text: “தோல்” என்பது விலங்குத் தோலால் செய்யப்பட்ட ஒரு பொருளைக் குறிக்கக்கூடும்; “தோல்பொருள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּגֶד
  choice: ஆடை
  rationale: ஆடை அல்லது உடுப்பைக் குறிக்கும் பொதுவான சொல்லாகவும், நவீனத் தமிழில் இயல்பாகவும் உள்ளது.
- source_word: עוֹר
  choice: தோல்
  rationale: எபிரெயச் சொல்லின் நேரடிப் பொருளைப் பாதுகாக்கிறது; இச்சூழலில் விலங்குத் தோலால் செய்யப்பட்ட பொருளைக் குறிக்கக்கூடும்.
- source_word: אֲשֶׁר יִהְיֶה עָלָיו
  choice: பட்ட
  rationale: ஒரு பொருளின் மேல் விந்துச்சுரப்பு இருப்பதைக் குறிக்கும் இடப்பொருளை இயல்பான தமிழில் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: שִׁכְבַת זָרַע
  choice: விந்துச்சுரப்பு
  rationale: வெறும் ‘வித்து’ என்பதைக் காட்டிலும் வெளியேறிய விந்தைக் குறிக்கும் எபிரெய மரபுத்தொடரின் பொருளைத் தெளிவாகவும் கண்ணியமாகவும் தருகிறது.
- source_word: וְכֻבַּס
  choice: கழுவப்பட வேண்டும்
  rationale: சட்டவிதியின் செயப்பாட்டு வடிவத்தையும் கட்டாயத் தன்மையையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: בַּמַּיִם
  choice: தண்ணீரில்
  rationale: கழுவுதல் நடைபெறும் ஊடகத்தை இயல்பான தமிழில் குறிக்கிறது.
- source_word: וְטָמֵא
  choice: தீட்டாயிருக்கும்
  rationale: லேவியராகமத் தூய்மைச் சட்டங்களில் உள்ள சடங்குமுறைத் தீட்டு என்ற வகைப்பாட்டை, ஒழுக்கக் குற்றமாக மாற்றாமல் பாதுகாக்கிறது.
- source_word: עַד הָעָרֶב
  choice: மாலைவரை
  rationale: கால எல்லையைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: லேவியத் தூய்மைச் சட்டத்தில் טָמֵא என்பதன் தன்மை
  choice: ‘தீட்டாயிருக்கும்’ என்று சடங்குமுறைத் தீட்டைக் குறிக்கும் வகையில் மொழிபெயர்த்தல்
  alternative: ‘அசுத்தமாயிருக்கும்’ அல்லது ‘தூய்மையற்றிருக்கும்’
  rationale: இந்த வசனம் ஒழுக்கக் குற்றத்தையோ தனிப்பட்ட பாவத்தையோ கூறாமல், சடங்குமுறைத் தூய்மை நிலையை வகைப்படுத்துகிறது. ‘தீட்டு’ அந்த வேறுபாட்டைத் தமிழில் சுருக்கமாகப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், சட்டவிதிக்கேற்ற கண்ணியமான நடையில் அமைக்கப்பட்டது. பாலியல் உடற்செயலுக்கான சொல் வெளிப்படையாக இருந்தாலும் மருத்துவத் தொழில்நுட்பச் சுமையின்றி தரப்பட்டுள்ளது; ‘தீட்டு’ என்பது இங்கு சடங்குமுறை நிலையை மட்டுமே குறிக்கிறது.
