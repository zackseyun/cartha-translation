  to: விந்துச் சுரப்பு இருக்கும் ஒவ்வொரு ஆடையும் ஒவ்வொரு தோலும்[a][b] தண்ணீரில் கழுவப்பட வேண்டும்; அவை மாலைவரை தீட்டாயிருக்கும்.
