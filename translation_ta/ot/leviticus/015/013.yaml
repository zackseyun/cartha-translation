base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/013.yaml
  text: And when the man with the discharge is cleansed from his discharge[a], then he shall count seven days for his cleansing, and wash his clothes and bathe his body in living water; then he shall be clean.
translation:
  language: ta
  text: உடல் ஒழுக்கு உள்ள ஆண் தன் ஒழுக்கிலிருந்து சுத்தமடைந்தபோது, அவன் தன் சுத்திகரிப்புக்காக ஏழு நாட்களைக் கணக்கிட வேண்டும். பின்பு அவன் தன் உடைகளைக் கழுவி, தன் உடலை உயிருள்ள நீரில்[a] கழுவ வேண்டும்; அப்போது அவன் சுத்தமாவான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லர்த்தமாக, “உயிருள்ள நீர்”; அதாவது, புதிய அல்லது ஓடும் நீர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַזָּב
  choice: ஒழுக்கு உள்ளவன்
  rationale: זוּב என்ற வேரிலிருந்து வந்த இச்சொல், இவ்வதிகாரத்தில் விவரிக்கப்படும் உடல் ஒழுக்கு உள்ள ஆணைக் குறிக்கிறது. தமிழில் இயல்பாகவும் சூழலின் ஆண்பால் குறிப்பைத் தக்கவைத்தும் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: יִטְהַר מִזּוֹבוֹ
  choice: தன் ஒழுக்கிலிருந்து சுத்தமானபோது
  rationale: இங்கு טהר என்பது சடங்குசார் அசுத்த நிலையிலிருந்து சுத்த நிலைக்கு வருவதைக் குறிக்கிறது; ஒழுக்கு நின்றுவிட்டதையும் அதனால் தொடங்கும் சுத்திகரிப்பு நடைமுறையையும் இத்தொடர் வெளிப்படுத்துகிறது.
- source_word: וְסָפַר לוֹ שִׁבְעַת יָמִים
  choice: அவன் ... ஏழு நாட்களை எண்ண வேண்டும்
  rationale: சடங்கு நடைமுறையின் அடுத்த கட்டமாக வழங்கப்படும் கட்டளையின் வலிமையை நவீனத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: לְטָהֳרָתוֹ
  choice: தன் சுத்திகரிப்புக்காக
  rationale: தனிப்பட்ட ஒழுக்கக் குற்றத்தைக் குறிக்காமல், சடங்குசார் சுத்த நிலையை அடையும் நடைமுறையைக் குறிக்கிறது.
- source_word: וְכִבֶּס בְּגָדָיו
  choice: தன் உடைகளைக் கழுவி
  rationale: כבס என்பது குறிப்பாக உடைகளைத் துவைப்பதைக் குறிக்கிறது; ‘கழுவி’ என்பது தெளிவான இயல்பான தமிழ்.
- source_word: וְרָחַץ בְּשָׂרוֹ
  choice: தன் உடலை ... குளிப்பாட்ட வேண்டும்
  rationale: בשר என்பதன் நேர்ப்பொருள் ‘சதை’ என்றாலும், முழு உடலை நீரால் கழுவும் இச்சூழலில் ‘உடல்’ இயல்பான சமமான சொல்.
- source_word: בְּמַיִם חַיִּים
  choice: உயிருள்ள தண்ணீரில்
  rationale: எபிரெயச் சொல்லாட்சியின் ‘living water’ என்ற உருவகத்தை முதன்மை உரையில் தக்கவைத்து, அதன் நடைமுறைப் பொருளான புதிய அல்லது ஓடும் தண்ணீரை அடிக்குறிப்பில் விளக்குகிறது.
- source_word: וְטָהֵר
  choice: அப்போது அவன் சுத்தமாவான்
  rationale: குறிப்பிட்ட செயல்முறையின் விளைவாக அவன் சடங்குசார் சுத்த நிலையை அடைவதை வரிசைமுறையுடன் காட்டுகிறது.
theological_decisions:
- issue: சடங்குசார் சுத்தத்தை ஒழுக்கக் குற்றமாகப் பொருள்படுத்தாமல் மொழிபெயர்த்தல்
  choice: ‘சுத்தமான’, ‘சுத்திகரிப்பு’, ‘சுத்தமாவான்’ என்ற சொற்களைச் சடங்குசார் பொருளில் பயன்படுத்துதல்
  alternative: ‘தூய்மையான’, ‘தூய்மைப்படுத்துதல்’, ‘தூய்மையாவான்’
  rationale: லேவியராகமம் 15 உடல் ஒழுக்கினால் ஏற்படும் சடங்குசார் அசுத்தத்தைப் பற்றியது; தனிப்பட்ட பாவம் அல்லது ஒழுக்கக் குற்றத்தை இவ்வசனம் கூறவில்லை. ஆகவே மூலத்தின் சடங்கு வகைப்பாட்டை மட்டும் மொழிபெயர்ப்பு தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், திருச்சட்ட உரைக்கு ஏற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஒழுக்கு’ என்பது மருத்துவ ரீதியில் நடுநிலையான சொல்லாகத் தேர்ந்தெடுக்கப்பட்டது. ‘உயிருள்ள தண்ணீர்’ என்ற மூல உருவகம் உரையில் தக்கவைக்கப்பட்டு, அதன் வழக்குப் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
