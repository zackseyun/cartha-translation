base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/029.yaml
  text: And on the eighth day she shall take for herself two turtledoves or two young pigeons[a], and bring them to the priest at the entrance of the tent of meeting.
translation:
  language: ta
  text: எட்டாம் நாளில் அவள் தனக்காக இரண்டு காட்டுப்புறாக்களையோ அல்லது இரண்டு புறாக்குஞ்சுகளையோ எடுத்துக்கொள்ள வேண்டும்; அவற்றை ஆசாரியரிடம், சந்திப்புக் கூடாரத்தின் நுழைவாயிலுக்குக் கொண்டுவர வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘ஆசாரியரிடம்’ என்பதற்கும் ‘சந்திப்புக் கூடாரத்தின் நுழைவாயிலுக்கு’ என்பதற்கும் திசைப் பொருளுடைய சொல் தனித்தனியாக வருகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַיּוֹם הַשְּׁמִינִי
  choice: எட்டாம் நாளில்
  rationale: வாவ் இணைப்பின் தொடர்ச்சிப் பொருள் தமிழில் வசனச் சூழலால் தெளிவாக இருப்பதால் தனியாக ‘மேலும்’ என்று சேர்க்காமல், காலக் குறிப்பை இயல்பாக மொழிபெயர்க்கிறது.
- source_word: תִּקַּח לָהּ
  choice: அவள் தனக்காக ... எடுத்துக்கொண்டு
  rationale: לָהּ என்பதிலுள்ள பயனாளி/தற்சுட்டுப் பொருளை ‘தனக்காக’ காக்கிறது; சட்ட அறிவுறுத்தலின் வலிமை வாக்கிய முடிவிலுள்ள ‘வேண்டும்’ என்பதில் வெளிப்படுகிறது.
- source_word: שְׁתֵּי תֹרִים
  choice: இரண்டு காட்டுப்புறாக்கள்
  rationale: תֹרִים என்பது பலியிடப் பயன்படுத்தப்பட்ட turtledoves-ஐக் குறிக்கிறது; சாதாரண நவீன தமிழில் புரியக்கூடிய வகையில் ‘காட்டுப்புறாக்கள்’ என வழங்கப்படுகிறது.
- source_word: שְׁנֵי בְּנֵי יוֹנָה
  choice: இரண்டு புறாக்குஞ்சுகள்
  rationale: ‘புறாவின் குஞ்சுகள்’ என்ற எபிரெயக் கட்டமைப்பை இயல்பான தமிழில் இளம் புறாக்களைக் குறிக்கும் ‘புறாக்குஞ்சுகள்’ என வழங்குகிறது.
- source_word: וְהֵבִיאָה אֹתָם
  choice: அவற்றை ... கொண்டுவர வேண்டும்
  rationale: சட்டத் தொடரில் வரும் வினையின் கட்டளைத் தன்மையை ‘வேண்டும்’ தெளிவாகக் காட்டுகிறது; אֹתָם என்பதற்கு ‘அவற்றை’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: אֶל הַכֹּהֵן
  choice: ஆசாரியரிடம்
  rationale: குறிப்பிட்ட சடங்கை நடத்தும் הכהן-ஐ மரியாதையுடனும் வழக்கமான வேதாகமத் தமிழிலும் குறிக்கிறது.
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரத்தின் நுழைவாயிலில் இருக்கும்
  rationale: இரண்டாவது אֶל சொற்றொடரை ஆசாரியர் இருக்கும் இடத்தைக் குறிப்பிடுவதாக இயல்பான தமிழில் அமைக்கிறது; ‘சந்திப்புக் கூடாரம்’ אֹהֶל מוֹעֵד என்பதன் துல்லியமான பொருளைத் தருகிறது.
