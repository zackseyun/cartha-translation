  register: நவீன பொதுத்தமிழில், சட்ட அறிவுறுத்தலுக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. பலியிடப்படும் பறவைகளுக்கிடையிலான மாற்றுத் தேர்வு ‘-களையோ ... -களையோ’ என்ற இயல்பான தமிழ் இணைப்பால் பாதுகாக்கப்பட்டுள்ளது.
