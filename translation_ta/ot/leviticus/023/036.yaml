  rationale: இச்சொல் சிறப்பாகக் கடைப்பிடிக்கப்படும் கூடுகையைக் குறிக்கிறது; ‘நிறைவு’ அல்லது ‘கட்டுப்பாடு’ என்ற நுண்பொருள்களில் ஒன்றை மட்டும் உறுதியாக்காமல் மூலத்தின் தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், ஆனால் திருச்சட்டத்திற்கு ஏற்ற கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. தொழில்நுட்பமான பலிச் சொல்லுக்கு வாசிக்க எளிய விளக்கத் தொடர் பயன்படுத்தப்பட்டு, மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறிகளும் உரிய சொற்களுக்குப் பின்னர் முதன்மை உரையில் இடம் பெற்றுள்ளன.
