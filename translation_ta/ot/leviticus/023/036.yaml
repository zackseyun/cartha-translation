base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/036.yaml
  text: For seven days you shall present a food offering to Yahweh. On the eighth day you shall have a holy convocation[a], and you shall present a food offering to Yahweh. It is a solemn assembly; you shall do no ordinary work.
translation:
  language: ta
  text: ஏழு நாட்கள் யாவேக்கு நெருப்பில் செலுத்தும் காணிக்கையை[a] அளிக்க வேண்டும். எட்டாம் நாளில் உங்களுக்குப் புனிதக் கூட்டம் இருக்க வேண்டும்; யாவேக்கு நெருப்பில் செலுத்தும் காணிக்கையை அளிக்க வேண்டும். அது ஒரு சடங்குமிக்க கூட்டம்[b]; எந்த வழக்கமான வேலையும் செய்யக் கூடாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேய அִשֶּׁה என்பது நெருப்பின் மூலம் செலுத்தப்படும் பலிக்கான வழக்கமான ஆசாரியச் சொல். ‘நெருப்புக் காணிக்கை’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரேய עֲצֶרֶת என்பது சிறப்பாகக் கடைப்பிடிக்கப்படும் விழாக்கூட்டத்தைக் குறிக்கிறது. ‘புனிதக் கூட்டம்’ அல்லது, இச்சூழலில், ‘விழா நிறைவுக் கூட்டம்’ என்றும் புரிந்துகொள்ளலாம்.
    reason: preserve_ambiguity
lexical_decisions:
- source_word: שִׁבְעַת יָמִים
  choice: ஏழு நாட்களும்
  rationale: காணிக்கை செலுத்த வேண்டிய கால அளவை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: תַּקְרִיבוּ / וְהִקְרַבְתֶּם
  choice: செலுத்த வேண்டும்
  rationale: קרב என்பதன் Hiphil வடிவம் இங்கு பலிக்காணிக்கையை முன்வைத்தல் அல்லது செலுத்துதல் என்ற வழிபாட்டுச் சூழல் பொருளைக் கொண்டது; ‘செலுத்துதல்’ தமிழில் இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: אִשֶּׁה
  choice: நெருப்பில் செலுத்தும் காணிக்கை
  rationale: ஆசாரியச் சட்டங்களில் இது நெருப்பின் மூலம் செலுத்தப்படும் பலிக்காணிக்கைக்கான மரபுச் சொல். ‘நெருப்புக் காணிக்கை’ என்பதைவிட இத்தொடர் நெருப்பே காணிக்கையின் பொருள் என்ற தவறான எண்ணத்தைத் தவிர்க்கிறது.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: ל அர்ப்பணிப்பின் இலக்கைக் குறிக்கிறது; יהוה என்ற உடன்படிக்கைப் பெயர் பட்டப்பெயராக மாற்றப்படாமல் ‘யாவே’ என ஒலிபெயர்க்கப்படுகிறது.
- source_word: מִקְרָא קֹדֶשׁ
  choice: புனிதக் கூடுகையாகக் கூட வேண்டும்
  rationale: அதிகாரபூர்வமாக அழைக்கப்பட்ட புனிதச் சந்திப்பைக் குறிக்கும் விழாக்காலச் சொற்றொடரை, தமிழில் செயற்பொருள் தெளிவாக இருக்குமாறு வழங்குகிறது.
- source_word: עֲצֶרֶת
  choice: சிறப்புக் கூடுகை
  rationale: விழாவின் தனிப்பட்ட, கட்டுப்பாட்டுடன் கடைப்பிடிக்கப்படும் கூடுகையைக் குறிக்கிறது; அதன் துல்லிய நுண்பொருள் விவாதத்திற்குரியதால் ‘நிறைவுக் கூடுகை’ என்பதை முதன்மை உரையில் கட்டாயப்படுத்தவில்லை.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: வழக்கமான எந்த வேலையையும்
  rationale: எல்லாச் செயல்களையும் அல்ல, வழக்கமான தொழில் அல்லது உழைப்பைத் தடைசெய்யும் விழாக்காலச் சட்டத்தின் வேறுபாட்டை நவீனத் தமிழில் தெளிவாக்குகிறது.
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: எட்டாம் நாளில்
  rationale: காலத்தைக் குறிக்கும் எளிய எபிரேயத் தொடரின் நேரான, இயல்பான தமிழ் வடிவம்.
- source_word: יִהְיֶה לָכֶם
  choice: நீங்கள் … கூட வேண்டும்
  rationale: היה + ל அமைப்பின் கட்டளை வலிமையை தமிழில் இயல்பான செயப்படிவமாக வெளிப்படுத்துகிறது.
theological_decisions:
