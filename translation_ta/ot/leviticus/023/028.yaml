source:
  edition: WLC
  text: וְ/כָל מְלָאכָה֙ לֹ֣א תַעֲשׂ֔וּ בְּ/עֶ֖צֶם הַ/יּ֣וֹם הַ/זֶּ֑ה כִּ֣י י֤וֹם כִּפֻּרִים֙ ה֔וּא לְ/כַפֵּ֣ר עֲלֵי/כֶ֔ם לִ/פְנֵ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/028.yaml
  text: You shall do no work on this very day[a], for it is a Day of Atonement, to make atonement for you before Yahweh your God.
translation:
  language: ta
  text: இதே நாளில் நீங்கள் எந்த வேலையும் செய்யக்கூடாது; ஏனெனில் இது உங்கள் கடவுளாகிய யாவே முன்னிலையில் உங்களுக்காகப் பாவநிவாரணம் செய்வதற்கான பாவநிவாரண நாள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெய மொழியில் சொல்லுக்குச் சொல்: “பாவநிவாரணங்களின் நாள்.” விழாவின் பெயர் தமிழில் பொதுவாக “பாவநிவாரண நாள்” என வழங்கப்படுகிறது.'
    reason: כִּפֻּרִים என்ற எபிரெயச் சொல் வடிவத்தில் பன்மையாக இருப்பதைப் பாதுகாத்து விளக்குவதற்காக.
lexical_decisions:
- source_word: וְ/כָל מְלָאכָה֙ לֹ֣א תַעֲשׂ֔וּ
  choice: நீங்கள் எந்த வேலையும் செய்யக்கூடாது
  rationale: מְלָאכָה என்பது ஓய்வுநாள் மற்றும் திருவிழா சட்டங்களில் பொதுவாக வேலை அல்லது தொழில்சார் உழைப்பைக் குறிக்கிறது. எதிர்மறைக் கட்டளையின் சட்ட வலிமையை இயல்பான நவீன தமிழில் இச்சொற்றொடர் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: בְּ/עֶ֖צֶם הַ/יּ֣וֹם הַ/זֶּ֑ה
  choice: இதே நாளில்
  rationale: இந்த எபிரெயச் சொற்றொடர் குறிப்பிட்ட அந்த நாளையே வலியுறுத்துகிறது. ‘இதே நாளில்’ என்பது அதன் கால வலியுறுத்தலைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: כִּ֣י
  choice: ஏனெனில்
  rationale: வேலை செய்யக்கூடாது என்ற கட்டளைக்கான காரணத்தை כִּי அறிமுகப்படுத்துவதால் ‘ஏனெனில்’ பொருத்தமானது.
- source_word: י֤וֹם כִּפֻּרִים֙
  choice: பாவநிவாரண நாள்
  rationale: כִּפֻּרִים என்பது ஆசாரச் சூழலில் பாவம் அல்லது அசுத்தத்தை நீக்கி உறவைச் சீர்செய்யும் நிவாரணச் செயலைக் குறிக்கிறது. விழாவின் பெயரை நவீன தமிழ் வாசகர்களுக்குப் புரியும் வகையில் ‘பாவநிவாரண நாள்’ என வழங்கி, எபிரெயப் பன்மை வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: לְ/כַפֵּ֣ר עֲלֵי/כֶ֔ם
  choice: உங்களுக்காகப் பாவநிவாரணம் செய்வதற்கான
  rationale: பீயேல் வினைவடிவம் ஆசார முறையில் பாவநிவாரணம் செய்வதைக் குறிக்கிறது; עַל அந்தச் செயல் யாருக்காக நடைபெறுகிறது என்பதைக் காட்டுகிறது. செய்பவர் யார் என்று மூலத்தில் சொல்லப்படாததை மொழிபெயர்ப்பும் தீர்மானிக்கவில்லை.
- source_word: לִ/פְנֵ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם
  choice: உங்கள் கடவுளாகிய யாவே முன்னிலையில்
  rationale: לִפְנֵי என்பது யாவேயின் முன்னிலையைக் குறிக்கிறது. יהוה தனிப்பட்ட இறைப்பெயராக ‘யாவே’ என ஒலிபெயர்க்கப்பட்டு, אֱלֹהֵיכֶם உடன்படிக்கை உறவை வெளிப்படுத்தும் ஒருமைப் பொருளில் ‘உங்கள் கடவுள்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல உரை יהוה என்ற தனிப்பட்ட உடன்படிக்கைப் பெயரை நேரடியாகப் பயன்படுத்துகிறது. அதை ஒரு பட்டத்தால் மாற்றாமல், நவீன தமிழில் அதன் ஏற்ற ஒலிபெயர்ப்பான ‘யாவே’ என வழங்குகிறது.
- issue: כפר / כִּפֻּרִים என்ற ஆசாரச் சொல்லின் பொருள்
  choice: பாவநிவாரணம் / பாவநிவாரண நாள்
  alternative: பரிகாரம்; தூய்மைப்படுத்துதல்; நிவாரணங்களின் நாள்
  rationale: சொல் ஆசார முறையில் பாவம் அல்லது அசுத்தம் தொடர்பான நிவாரணத்தையும் உறவுச் சீரமைப்பையும் தாங்குகிறது. ‘பாவநிவாரணம்’ அதன் வேதாகமச் சூழலைப் புரியத்தக்க வகையில் தெரிவிக்கிறது; ஆனால் அது எவ்வாறு செயல்படுகிறது என்ற பிற்காலக் கோட்பாட்டை உரைக்குள் சேர்ப்பதில்லை. பன்மை வடிவத்தின் நுட்பம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீன தரத் தமிழில், சட்டக் கட்டளையின் கண்ணியமும் வலிமையும் காக்கப்பட்டுள்ளன. ‘செய்யக்கூடாது’ என்பது இயல்பான தடை மொழியாகவும், ‘முன்னிலையில்’ என்பது ஆசாரச் சூழலுக்கு ஏற்ற உயர்நடையாகவும் பயன்படுத்தப்பட்டுள்ளன.
