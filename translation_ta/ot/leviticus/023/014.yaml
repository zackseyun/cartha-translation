base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/014.yaml
  text: And you shall not eat bread or roasted grain or fresh grain until this very day[a], until you have brought the offering of your God[c][b]. It is a permanent statute throughout your generations in all your dwelling places.
translation:
  language: ta
  text: அப்பத்தையோ, வறுத்த தானியத்தையோ[a], புதிய தானியத்தையோ[b], இந்தக் குறிப்பிட்ட நாள்வரை, அதாவது உங்கள் கடவுளுக்கான காணிக்கையை நீங்கள் கொண்டுவரும்வரை, உண்ணக் கூடாது. இது தலைமுறைதோறும், நீங்கள் குடியிருக்கும் எல்லா இடங்களிலும் நிலையான நியமம்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தீயில் வாட்டிய தானியம்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “புதிதாக முற்றிய தானியம்.”
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “நித்திய நியமம்” அல்லது “நிரந்தரமான நியமம்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם
  choice: அப்பம்
  rationale: அடிப்படைப் பொருள் சுடப்பட்ட தானிய உணவான ‘அப்பம்’; இங்குள்ள மூன்று தானிய வடிவங்களின் பட்டியலில் பொதுவான ‘உணவு’ என்பதைவிட இது துல்லியமானது.
- source_word: קָלִי
  choice: வறுத்த தானியம்
  rationale: வாட்டப்பட்ட அல்லது வறுக்கப்பட்ட தானியத்தைக் குறிக்கிறது; நவீன தமிழில் வேளாண்மைச் சூழலைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: כַרְמֶל
  choice: புதிய தானியம்
  rationale: இங்கு இடப்பெயரான கர்மேல் அல்ல; புதிதாக முற்றிய அல்லது அறுவடையான தானியத்தைக் குறிக்கிறது.
- source_word: לֹא תֹאכְלוּ
  choice: உண்ணக் கூடாது
  rationale: மறுப்புடன் வரும் வினைச்சொல் சட்டரீதியான தடையைத் தெரிவிக்கிறது; தமிழில் இயல்பானதும் உறுதியானதுமான கட்டளைநடை.
- source_word: עַד עֶצֶם הַיּוֹם הַזֶּה ... עַד הֲבִיאֲכֶם
  choice: இந்த நாளிலேயே ... நீங்கள் கொண்டுவரும்வரை
  rationale: עֶצֶם தரும் ‘அந்தத் துல்லியமான நாளில்’ என்ற வலியுறுத்தலையும், காணிக்கை கொண்டுவரப்படுதல் தடையின் முடிவாக இருப்பதையும் ஒன்றாகப் பாதுகாக்கிறது.
- source_word: קָרְבַּן אֱלֹהֵיכֶם
  choice: உங்கள் கடவுளுக்கான காணிக்கை
  rationale: קָרְבָּן என்பது கடவுளிடம் கொண்டுவரப்படும் காணிக்கைக்கான பொதுச்சொல்; பலியின் வகையை தேவையின்றி குறிப்பாக்காமல் இயல்பான தமிழில் இலக்கைத் தெரிவிக்கிறது.
- source_word: חֻקַּת עוֹלָם
  choice: நிலையான நியமம்
  rationale: தொடர்ந்து கட்டுப்படுத்தும் சட்ட ஒழுங்கைத் தெரிவிக்கிறது; பிற்கால உடன்படிக்கைச் செயல்பாடு குறித்த முடிவை மொழிபெயர்ப்பில் திணிக்கவில்லை.
- source_word: לְדֹרֹתֵיכֶם
  choice: தலைமுறைதோறும்
  rationale: அடுத்தடுத்த தலைமுறைகளில் தொடர்வதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: בְּכֹל מֹשְׁבֹתֵיכֶם
  choice: நீங்கள் குடியிருக்கும் எல்லா இடங்களிலும்
  rationale: இஸ்ரவேலர் வாழும் எல்லா குடியிருப்புகளையும் குறிக்கும் சொற்றொடரை சாதாரண வாசகருக்குத் தெளிவாக வழங்குகிறது.
theological_decisions:
- issue: மோசேயின் சட்டத்தில் חֻקַּת עוֹלָם என்பதன் காலவலிமை
  choice: நிலையான நியமம்
  alternative: என்றென்றைக்கும் உரிய நியமம் / நிரந்தர நியமம்
  rationale: எபிரேயச் சொற்றொடரின் நீடித்த உடன்படிக்கைச் சட்ட வலிமையைப் பாதுகாக்கிறது; அதேவேளையில் மோசேயின் சடங்குச் சட்டம் பிற்காலத்தில் எவ்வாறு பொருந்துகிறது என்ற இறையியல் விவாதத்தைத் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டப்பகுதிக்கேற்ற கண்ணியமான ஆனால் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘உண்ணக் கூடாது’ தடைச்சட்டத்தின் வலிமையைத் தக்கவைக்கிறது; ‘கடைப்பிடிக்க வேண்டிய’ என்பது பெயர்ச்சொல் வாக்கியத்தைத் தமிழில் இயல்பாக்குகிறது.
