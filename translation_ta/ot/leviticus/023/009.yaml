lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பேசி
  rationale: וַיְדַבֵּר ஒரு புதிய உரைநிகழ்வை அறிமுகப்படுத்துகிறது. அடுத்த வசனத்தில் தொடரும் நேரடிப் பேச்சை இயல்பாக இணைக்க, לֵאמֹר உடன் சேர்ந்த முழுச் சூத்திரம் தமிழில் ‘பேசி’ என வழங்கப்படுகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: எபிரெய மெய்யெழுத்துப் பெயரான YHWH-ஐ ஒரு பொதுப் பட்டமாக மாற்றாமல், தமிழில் நீண்டகாலமாக அறியப்பட்ட தனிப்பெயர் வடிவமான ‘யெகோவா’ என வழங்குகிறது.
- source_word: אֶל־מֹשֶׁה
  choice: மோசேயிடம்
  rationale: பேச்சு யாரை நோக்கிச் சொல்லப்பட்டது என்பதை நவீனத் தமிழில் இயல்பாகக் குறிக்கும் வடிவம்.
- source_word: לֵאמֹר
  choice: பேசி என்ற இணைப்பில் வெளிப்படுத்தப்பட்டது
  rationale: இந்த எபிரெய உரைஅறிமுகச் சூத்திரம் அடுத்த வசனத்தின் மேற்கோளைத் தொடங்குகிறது. ‘சொல்லும்படி’ என்பது இங்கு நோக்கத்தைக் குறிப்பதுபோல் தவறாகப் புரியக்கூடும்; எனவே தமிழில் இயல்பான தொடர்வாக்கிய அமைப்பில் உள்ளடக்கப்பட்டது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை வழங்குதல்
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் ஒரு தனிப்பெயர் உள்ளது. அதை ‘கர்த்தர்’ என்ற பட்டமாக மாற்றாமல் தனிப்பெயராகவே வைத்திருக்கிறது. உயிரெழுத்திடல் உறுதியற்றதால் மாற்று ஒலிபெயர்ப்பு அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீன, எளிதில் புரியும், மரியாதைமிக்க தமிழ். இது அடுத்த வசனத்தில் தொடரும் உரைஅறிமுகம் என்பதால் முடிவில் இரட்டைப்புள்ளி அல்லது முழுப்புள்ளி சேர்க்காமல் காற்புள்ளி வைக்கப்பட்டுள்ளது.
