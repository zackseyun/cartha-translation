base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/015.yaml
  text: 'And you shall count for yourselves from the day after the Sabbath[a], from the day you bring the sheaf of the wave offering: seven complete Sabbaths shall there be.'
translation:
  language: ta
  text: ஓய்வுநாளுக்கு அடுத்த நாளிலிருந்து, அசைவாட்டுக் காணிக்கையின் கதிர்க்கட்டையை நீங்கள் கொண்டுவரும் நாளிலிருந்து, உங்களுக்காக எண்ணுங்கள்; ஏழு முழுமையான ஓய்வுநாட்கள்[a] இருக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஏழு முழுமையான வாரங்கள்.” எபிரெய மொழியில் சொல்லுக்கு சொல், “ஏழு முழுமையான ஓய்வுநாட்கள்” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּסְפַרְתֶּם
  choice: எண்ணத் தொடங்குங்கள்
  rationale: சட்ட அறிவுறுத்தலின் கட்டளை வலிமையை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது; தொடக்கப் புள்ளியிலிருந்து தொடரும் எண்ணிக்கையையும் சூழலுக்கேற்ப தெளிவாக்குகிறது.
- source_word: לָכֶם
  choice: உங்களுக்காக
  rationale: எண்ணுதல் அவர்களே மேற்கொள்ள வேண்டிய பொறுப்பு என்பதைக் காட்டும் தத்துவப் பொருளைத் தக்கவைக்கிறது.
- source_word: מִמָּחֳרַת הַשַּׁבָּת
  choice: ஓய்வுநாளுக்கு அடுத்த நாளிலிருந்து
  rationale: מָחֳרַת என்பதன் மறுநாள் என்ற காலத் தொடர்பையும், שַׁבָּת என்பதன் வழிபாட்டு சார்ந்த குறிப்பிட்ட சொல்லையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: מִיּוֹם הֲבִיאֲכֶם
  choice: நீங்கள் கொண்டுவரும் நாளிலிருந்து
  rationale: எண்ணிக்கையின் தொடக்க நாளைத் தெளிவாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: עֹמֶר
  choice: கதிர்க்கட்டை
  rationale: இச்சூழலில் உலர் அளவைக் காட்டிலும் காணிக்கையாகக் கொண்டுவரப்படும் அறுவடைக் கதிர்களின் கட்டையே குறிக்கப்படுகிறது.
- source_word: הַתְּנוּפָה
  choice: அசைவாட்டுக் காணிக்கை
  rationale: கர்த்தர்முன் சடங்குமுறையில் அசைத்துப் படைக்கப்படும் காணிக்கையின் தனித்தன்மையைப் பாதுகாக்கும் வழிபாட்டுச் சொல்.
- source_word: שֶׁבַע שַׁבָּתוֹת
  choice: ஏழு ஓய்வுநாட்கள்
  rationale: எபிரெய உரை சாதாரணமாக ‘வாரங்கள்’ என்று சொல்லாமல் שַׁבָּתוֹת என்று கூறுவதால், அதன் நேரடிப் பொருளையும் விளக்கத் திறந்த தன்மையையும் முதன்மை உரையில் காக்கிறது.
- source_word: תְּמִימֹת
  choice: முழுமையான
  rationale: காலக் கணக்கில் குறைவில்லாத முழுச் சுற்றுகளைக் குறிக்கிறது; ஒழுக்க அல்லது சடங்கு குற்றமின்மையை இங்கு சுமத்தவில்லை.
- source_word: תִּהְיֶינָה
  choice: இருக்க வேண்டும்
  rationale: சட்ட அறிவுறுத்தலுக்குள் வரும் இருப்பு/நிலை வாக்கியத்தை இயல்பான தமிழில் கட்டளை வலிமையுடன் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: நாட்காட்டி அறிவுறுத்தலில் שַׁבָּת / שַׁבָּתוֹת என்பதன் விளக்கம்
  choice: முதன்மை உரையில் ‘ஓய்வுநாள் / ஓய்வுநாட்கள்’ என்று தக்கவைத்தல்
  alternative: ‘வாரம் / வாரங்கள்’ என்று மொழிபெயர்த்தல்
  rationale: மூல எபிரெயம் ஓய்வுநாளைக் குறிக்கும் சொல்லையே பயன்படுத்துகிறது. எண்ணிக்கை எந்த நாளில் தொடங்குகிறது, ‘ஓய்வுநாட்கள்’ என்பது ஏழுநாள் காலப்பகுதிகளாகிய ‘வாரங்கள்’ என்று பொருள்படுகிறதா என்ற விவாதங்களை முதன்மை உரையில் முடிவுசெய்யாமல், பொதுவான மாற்றுப் புரிதலை அடிக்குறிப்பில் தருகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், வழிபாட்டு மற்றும் சட்டச் சூழலுக்கேற்ற கண்ணியமான நடையைக் கொண்டுள்ளது. ‘அதாவது’ என்பது ஒரே தொடக்க நாளைக் குறிப்பிடும் இரண்டு எபிரெய சொற்றொடர்களின் தொடர்பை இயல்பாகக் காட்டுகிறது; மூலத்தின் நாட்காட்டி சார்ந்த தெளிவின்மை அடிக்குறிப்பின் மூலம் பாதுகாக்கப்பட்டுள்ளது.
