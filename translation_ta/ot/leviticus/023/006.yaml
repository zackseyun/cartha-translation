  text: וּ/בַ/חֲמִשָּׁ֨ה עָשָׂ֥ר יוֹם֙ לַ/חֹ֣דֶשׁ הַ/זֶּ֔ה חַ֥ג הַ/מַּצּ֖וֹת לַ/יהוָ֑ה שִׁבְעַ֥ת יָמִ֖ים מַצּ֥וֹת תֹּאכֵֽלוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/006.yaml
  text: And on the fifteenth day of this month is the Feast of Unleavened Bread to Yahweh[a]; for seven days you shall eat unleavened bread.
translation:
  language: ta
  text: இந்த மாதத்தின் பதினைந்தாம் நாளில் யாவேக்குரிய[a] புளிப்பில்லா அப்பப் பண்டிகை உள்ளது; ஏழு நாட்கள் நீங்கள் புளிப்பில்லா அப்பம் சாப்பிட வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேக்காக.” எபிரேய முன்னிடைச்சொல் அர்ப்பணிப்பையோ சார்பையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַחֲמִשָּׁה עָשָׂר יוֹם לַחֹדֶשׁ הַזֶּה
  choice: இந்த மாதத்தின் பதினைந்தாம் நாளில்
  rationale: எபிரேய நாள்காட்டிக் கூறுமுறையை இயல்பான நவீனத் தமிழில் துல்லியமாக வெளிப்படுத்துகிறது.
- source_word: חַג הַמַּצּוֹת
  choice: புளிப்பில்லா அப்பப் பண்டிகை
  rationale: חַג என்பதன் சமயப் பண்டிகைப் பொருளையும், מַצּוֹת என்பதன் புளிக்கவைக்கப்படாத அப்பம் என்ற பொருளையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: לַיהוָה
  choice: யாவேக்குரிய
  rationale: לְ முன்னொட்டு அர்ப்பணிப்பு அல்லது உரிமைச் சார்பைக் குறிக்கக்கூடும்; ‘யாவேக்குரிய’ என்பது அந்த உறவைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: שִׁבְעַת יָמִים
  choice: ஏழு நாட்கள்
  rationale: செயல் நீடிக்கும் கால அளவைத் தமிழில் இயல்பாகக் குறிக்கிறது.
- source_word: מַצּוֹת תֹּאכֵלוּ
  choice: நீங்கள் புளிப்பில்லா அப்பம் சாப்பிட வேண்டும்
  rationale: வினையின் சட்டவிதிசார் கட்டளை வலிமையை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் வரும் உடன்படிக்கைப் பெயரைப் பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்த்து வழங்குகிறது.
- issue: לַיהוָה என்பதில் לְ முன்னொட்டின் உறவு
  choice: யாவேக்குரிய
  alternative: யாவேக்காக
  rationale: இது பண்டிகையின் அர்ப்பணிப்பையோ உரிமைச் சார்பையோ குறிக்கலாம்; முதன்மை உரை ‘உரிய’ என வழங்கி, மற்ற சாத்தியத்தை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் சமயச் சட்ட உரைக்கு ஏற்ற கண்ணியத்துடனும் அமைக்கப்பட்டது. ‘புளிப்பில்லா அப்பப் பண்டிகை’ என்பது பெயரிடப்பட்ட விழாவைத் தெளிவாகக் காட்டுகிறது; கட்டளைக்கு ‘சாப்பிட வேண்டும்’ பயன்படுத்தப்பட்டுள்ளது.
