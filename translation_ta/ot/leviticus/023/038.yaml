  language: en
  yaml_path: translation/ot/leviticus/023/038.yaml
  text: besides the Sabbaths of Yahweh[a], and besides your gifts, and besides all your vows, and besides all your freewill offerings[b], which you give to Yahweh.
translation:
  language: ta
  text: யாவேயின் ஓய்வுநாட்களைத் தவிரவும், உங்கள் அன்பளிப்புகளைத் தவிரவும், உங்கள் நேர்த்திக்கடன்கள் அனைத்தையும் தவிரவும், நீங்கள் யாவேக்கு அளிக்கும் உங்கள் விருப்பக் காணிக்கைகள் அனைத்தையும் தவிரவும்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தவிரவும்’ என்பதற்குப் பதிலாக, எபிரெயச் சொற்றொடரை ‘கூடுதலாகவும்’ அல்லது ‘இவற்றிலிருந்து தனியாகவும்’ என்றும் மொழிபெயர்க்கலாம்; மூலத்தில் அது பட்டியலின் ஒவ்வொரு உறுப்புக்கும் முன் திரும்பத் திரும்ப வருகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘யாவேயின் ஓய்வுநாட்கள்’ என்பதை ‘யாவேக்குரிய ஓய்வுநாட்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלְּבַד
  choice: கூடுதலானவை
  rationale: இச்சொற்றொடர் முன்னர் கூறப்பட்ட பண்டிகை அனுசரிப்புகளுடன் இப்பட்டியலிலுள்ள நாட்களும் கொடைகளும் சேர்க்கப்படுகின்றன என்பதைக் குறிக்கிறது. ‘கூடுதலானவை’ என்பது சூழலுக்கு இயல்பானது; ‘தவிர’ என்ற மாற்றுப் பொருளும் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: שַׁבְּתֹת יְהוָה
  choice: யாவேயின் ஓய்வுநாட்கள்
  rationale: எபிரெயப் பன்மையை ‘ஓய்வுநாட்கள்’ என்று பிரதிபலித்து, யாவே என்ற இறைப்பெயருடனான உடைமைத் தொடர்பையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கெழுத்து இறைப்பெயரை பொதுப்பட்டத்தால் மாற்றாமல், அதன் வழக்கமான தமிழ் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: מַתְּנוֹתֵיכֶם
  choice: உங்கள் அன்பளிப்புகள்
  rationale: கடவுளுக்கு அளிக்கப்படும் கொடைகளைச் சுட்டும் பரந்த சொல்லாகவும், இன்றைய தமிழில் இயல்பாகவும் உள்ளது.
- source_word: כָּל נִדְרֵיכֶם
  choice: உங்கள் நேர்த்திக்கடன்கள் அனைத்தும்
  rationale: נֶדֶר என்பது செய்த நேர்த்தியையும் அதன்படி செலுத்தப்படுவதையும் குறிக்கலாம். பலியிடும் சூழலில் ‘நேர்த்திக்கடன்’ இந்த இரு தொடர்புகளையும் இயல்பாகத் தக்கவைக்கிறது.
- source_word: כָּל נִדְבֹתֵיכֶם
  choice: உங்கள் விருப்பக் காணிக்கைகள் அனைத்தும்
  rationale: பலியிடும் சூழலில் நְדָבָה என்பது கட்டாயமின்றி மனமுவந்து செலுத்தப்படும் காணிக்கையைக் குறிக்கிறது.
- source_word: אֲשֶׁר תִּתְּנוּ לַיהוָה
  choice: நீங்கள் யாவேக்கு அளிக்கும்
  rationale: נתן என்பதன் எளிய பொருளான ‘அளி’ பயன்படுத்தப்பட்டுள்ளது. தமிழில் தெளிவாக இருக்க, இத்தொடர் அன்பளிப்புகள், நேர்த்திக்கடன்கள், விருப்பக் காணிக்கைகள் ஆகிய ஒருங்கிணைந்த பட்டியலுக்கு முன்னால் வைக்கப்பட்டுள்ளது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது. அதனை ஒரு பொதுப்பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: מִלְּבַד என்பதன் சேர்த்தல் அல்லது விலக்கல் நுணுக்கம்
  choice: கூடுதலானவை
  alternative: தவிர / இவற்றிலிருந்து தனியாக
  rationale: இச்சூழலில் முன்பு கட்டளையிடப்பட்ட பண்டிகை அனுசரிப்புகள் வழக்கமான ஓய்வுநாட்களையும் பலவகைக் கொடைகளையும் நீக்குவதில்லை; அவற்றோடு சேர்கின்றன. இருப்பினும் எபிரெயச் சொல்லின் விலக்கல் நுணுக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் மரியாதையும் தெளிவும் காக்கப்பட்டுள்ளன. வசனம் முந்தைய வசனத்தின் தொடராக இருப்பதால், தமிழில் முழுமையான வாக்கியமாக வாசிக்க ‘இவை … கூடுதலானவை’ என்ற அமைப்பு பயன்படுத்தப்பட்டுள்ளது. எபிரெயத்தில் திரும்ப வரும் מִלְּבַד தமிழில் கனமாக ஒலிக்காமல் ஒருமுறை வாக்கிய முடிவில் தொகுக்கப்பட்டுள்ளது; அதன் மறுமொழி அடிக்குறிப்பில் குறிப்பிடப்பட்டுள்ளது.
