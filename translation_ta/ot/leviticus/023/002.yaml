revisions:
- from: '“இஸ்ரவேலின் மகன்களிடம் பேசி, அவர்களிடம் சொல்: யாவேக்குரிய குறிக்கப்பட்ட காலங்கள்[a]—நீங்கள் பரிசுத்தக் கூடுகைகளாக[b] அறிவிக்க வேண்டியவை—இவையே எனக்குரிய குறிக்கப்பட்ட காலங்கள்.”'
  to: '“இஸ்ரவேலின் மகன்களிடம் பேசி, அவர்களிடம் சொல்: யாவேக்குரிய நியமிக்கப்பட்ட காலங்கள்[a]—நீங்கள் பரிசுத்தக் கூட்டங்களாக[b] அறிவிக்க வேண்டியவை—இவையே என் நியமிக்கப்பட்ட காலங்கள்.”'
  rationale: திருத்தம் முֹעֲדֵי / מוֹעֲדָי என்ற இரு இடங்களிலும் ஒரே சொல்லாட்சியைப் பயன்படுத்தி, அவற்றின் ‘appointed’ பொருளை ‘நியமிக்கப்பட்ட’ எனத் துல்லியமாக வெளிப்படுத்துகிறது. வாக்கியத்தின் தொடர்புச்சொல் அமைப்பு, பொதுப் பிரகடனத்தின் கருத்து, பரிசுத்தக் கூட்டங்களின் பண்பு, மற்றும் இறுதியிலுள்ள வலியுறுத்தலான ‘இவையே என் ... காலங்கள்’ ஆகியவை பாதுகாக்கப்பட்டுள்ளன. அடிக்குறிப்புகள் மூலத்தின் சொற்பொருள் மாற்றுகளைத் தருகின்றன; எந்தச் சபை அல்லது பிரிவுசார் விளக்கத்தையும் சேர்ப்பதில்லை.
