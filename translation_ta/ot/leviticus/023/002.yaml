source:
  edition: WLC
  text: דַּבֵּ֞ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם מוֹעֲדֵ֣י יְהוָ֔ה אֲשֶׁר תִּקְרְא֥וּ אֹתָ֖/ם מִקְרָאֵ֣י קֹ֑דֶשׁ אֵ֥לֶּה הֵ֖ם מוֹעֲדָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/002.yaml
  text: 'Speak to the sons of Israel and say to them: The appointed times of Yahweh[c][b][a], which you shall proclaim as holy convocations—these are my appointed times.'
translation:
  language: ta
  text: '“இஸ்ரவேலின் மகன்களிடம் பேசி, அவர்களிடம் சொல்: யாவேக்குரிய நியமிக்கப்பட்ட காலங்கள்[a]—நீங்கள் பரிசுத்தக் கூட்டங்களாக[b] அறிவிக்க வேண்டியவை—இவையே என் நியமிக்கப்பட்ட காலங்கள்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நியமிக்கப்பட்ட பண்டிகைகள்” அல்லது “திருவிழாக்கள்”; எபிரெயச் சொல் விருந்துப் பண்டிகைகளை மட்டும் அல்லாமல், நியமிக்கப்பட்ட புனித நிகழ்வுகளையும் பொதுவாகக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “புனிதக் கூட்டங்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: பேசி
  rationale: பியேல் கட்டளை வடிவத்தின் நேரடியான உரையாற்றும் கட்டளையை, அடுத்து வரும் ‘சொல்’ என்பதுடன் இயல்பான தமிழில் இணைக்கிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்கள்
  rationale: ‘இஸ்ரவேலின் மகன்கள்’ என்ற எபிரெய ஆண்பால் உடன்படிக்கைச் சொல்லாட்சியைத் தக்கவைக்கிறது; அது கூட்டாக இஸ்ரவேல் மக்களைக் குறிக்கிறது.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: அவர்களிடம் சொல்
  rationale: எபிரெயத்தின் கட்டளைத் தொடரையும் நேரடியான அறிமுகத்தையும் தெளிவாகக் காட்டுகிறது.
- source_word: מוֹעֲדֵי
  choice: குறிக்கப்பட்ட காலங்கள்
  rationale: מוֹעֵד என்பது நியமிக்கப்பட்ட நேரம் அல்லது சந்திப்பு நிகழ்வைக் குறிக்கலாம்; இவ்வதிகாரத்தில் ஓய்வுநாளும் அடங்குவதால் ‘பண்டிகைகள்’ என்பதைவிட இது விரிவானது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אֲשֶׁר תִּקְרְאוּ אֹתָם
  choice: நீங்கள் ... அறிவிக்க வேண்டியவை
  rationale: இச்சூழலில் קרא என்பது பொதுவாகப் பிரகடனம் செய்வதை அல்லது அதிகாரபூர்வமாக அறிவிப்பதைச் சுட்டுகிறது.
- source_word: מִקְרָאֵי קֹדֶשׁ
  choice: பரிசுத்தக் கூடுகைகள்
  rationale: அழைக்கப்பட்ட புனிதக் கூட்டங்களைக் குறிக்கும் வழிபாட்டுச் சொல்லாட்சியை இயல்பான தமிழில் தருகிறது.
- source_word: אֵלֶּה הֵם
  choice: இவையே
  rationale: சுட்டுப்பெயர் மற்றும் பெயர்ப்பதிலியின் வலியுறுத்தும் அடையாளப்படுத்தலைச் சுருக்கமாகத் தக்கவைக்கிறது.
- source_word: מוֹעֲדָי
  choice: எனக்குரிய குறிக்கப்பட்ட காலங்கள்
  rationale: முதலாம் நபர் ஒருமை உரிமை விகுதியை வெளிப்படையாகக் காட்டி, முந்தைய சொல்லாட்சியுடனும் ஒற்றுமையைப் பேணுகிறது.
theological_decisions:
- issue: יְהוָה என்ற உடன்படிக்கைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: தனிப்பட்ட தெய்வீகப் பெயரைப் பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் தன்மையைப் பாதுகாக்கிறது.
- issue: מוֹעֲדֵי என்பதைப் பண்டிகைகள் என்று குறுக்கலாமா
  choice: குறிக்கப்பட்ட காலங்கள்
  alternative: குறிக்கப்பட்ட பண்டிகைகள்; திருவிழாக்கள்
  rationale: அடுத்த வசனத்தில் ஓய்வுநாளும் இப்பட்டியலில் வருவதால், எபிரெயச் சொல்லின் விரிவான கால/நிகழ்வு பொருளைப் பாதுகாக்கிறது.
- issue: בְּנֵי יִשְׂרָאֵל என்பதிலுள்ள ஆண்பால் வடிவம்
  choice: இஸ்ரவேலின் மகன்கள்
  alternative: இஸ்ரவேல் மக்கள்; இஸ்ரவேலர்
  rationale: மூலத்தின் வழக்கமான உடன்படிக்கை ஆண்பால் சொல்லாட்சியைத் தக்கவைக்கிறது; சூழலில் இது இஸ்ரவேல் மக்களை கூட்டாகக் குறிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்ட/வழிபாட்டு உரைக்கேற்ற கண்ணியமான நடையைப் பயன்படுத்துகிறது. எபிரெய வாக்கிய வரிசையும் இறுதி வலியுறுத்தலும் பாதுகாக்கப்பட்டுள்ளன; அரிதான ‘சபைகூடுதல்’ போன்ற சொற்களுக்கு மாறாக பொதுவாகப் புரியும் ‘கூடுகை’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
