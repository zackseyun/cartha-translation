base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/018.yaml
  text: And with the bread you shall present seven male lambs a year old[a], without blemish, and one bull from the herd, and two rams. They shall be a burnt offering to Yahweh, with their grain offering and their drink offerings, a food offering[b], a pleasing aroma to Yahweh.
translation:
  language: ta
  text: அப்பத்தோடு[a] பழுதற்ற, ஓராண்டான ஆண் ஆட்டுக்குட்டிகள் ஏழையும், மாட்டினத்தைச் சேர்ந்த ஒரு காளையையும், செம்மறியாட்டுக் கடாக்கள் இரண்டையும் நீங்கள் செலுத்த வேண்டும். இவை யாவேக்கு தகனபலியாகவும், அவற்றின் தானியக் காணிக்கையுடனும் பானக் காணிக்கைகளுடனும் சேர்ந்து, யாவேக்கு இன்பமான நறுமணமுள்ள நெருப்புக் காணிக்கையாகவும் இருக்க வேண்டும்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அப்பத்துக்குப் பக்கத்தில்’ அல்லது ‘அப்பத்துடன் கூடுதலாக’ என்றும் மொழிபெயர்க்கலாம். எபிரேய முன்னிடைச்சொல், பொருட்களை அப்பத்தின் மேல் வைப்பதை அல்லாமல், இப்பலிகள் அப்பத்துடன் செலுத்தப்படுவதைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘உணவுக் காணிக்கை’ என்றும் மொழிபெயர்க்கலாம். எபிரேயச் சொல் நெருப்பின் மூலம் செலுத்தப்படும் காணிக்கையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  choice: நீங்கள் படைக்க வேண்டும்
  rationale: הקריב என்பதன் ஹிஃபில் வடிவம் பலிச் சூழலில் காணிக்கையை அணுகச் செய்தல் அல்லது சமர்ப்பித்தல் எனப் பொருள்படும்; ‘படைக்க வேண்டும்’ என்பது தமிழில் இயல்பான பலிவழிபாட்டுச் சொல்லாகும்.
- source_word: עַל הַלֶּחֶם
  choice: அப்பத்தோடு
  rationale: עַל இங்கு பொருட்களை அப்பத்தின் மேல் வைப்பதைக் காட்டாமல், முன் குறிப்பிடப்பட்ட அப்பக் காணிக்கையுடன் இப்பலிகளும் செலுத்தப்படுவதைக் காட்டுகிறது; மூலத்தில் உள்ள பொருள் வரம்பை அடிக்குறிப்பு பாதுகாக்கிறது.
- source_word: שִׁבְעַת כְּבָשִׂים תְּמִימִם בְּנֵי שָׁנָה
  choice: பழுதற்ற, ஓராண்டான ஆட்டுக்குட்டிகள் ஏழு
  rationale: כֶּבֶשׂ இளம் செம்மறியாட்டைக் குறிக்கிறது; תָּמִים பலிக்குரிய உடற்குறை இல்லாமையைச் சுட்டுகிறது; בֶּן־שָׁנָה அதன் வயதைத் தெரிவிக்கிறது.
- source_word: וּפַר בֶּן בָּקָר אֶחָד
  choice: மாட்டினத்தைச் சேர்ந்த காளை ஒன்று
  rationale: פַר בֶּן־בָּקָר என்பது மாட்டினத்தைச் சேர்ந்த ஆண் விலங்கைக் குறிக்கும்; மூலத்தில் உறுதியாக இல்லாத துல்லியமான வயதைத் தமிழில் கூடுதலாக நிர்ணயிக்காமல் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְאֵילִם שְׁנָיִם
  choice: செம்மறியாட்டுக் கடாக்கள் இரண்டு
  rationale: אַיִל என்பது வயதுவந்த ஆண் செம்மறியாட்டைக் குறிக்கும்; ‘கடா’ பாலின வேறுபாட்டைத் தெளிவாகக் காட்டுகிறது.
- source_word: עֹלָה
  choice: தகனபலி
  rationale: முழுவதுமாக எரித்துச் செலுத்தப்படும் பலிக்கான வழிபாட்டுக் கலைச்சொல்; நவீனத் தமிழில் சுருக்கமாகவும் துல்லியமாகவும் உள்ளது.
- source_word: וּמִנְחָתָם
  choice: அவற்றுக்குரிய தானியக் காணிக்கை
  rationale: லேவியராகமப் பலிமுறையில் מִנְחָה தானியத்தால் செய்யப்படும் உடன்சேரும் காணிக்கையைக் குறிக்கிறது.
- source_word: וְנִסְכֵּיהֶם
  choice: பானக் காணிக்கைகள்
  rationale: נֶסֶךְ ஊற்றிச் செலுத்தப்படும் திரவக் காணிக்கை; ‘பானக் காணிக்கை’ பொதுவாசகருக்குத் தெளிவான தமிழாக்கம்.
- source_word: אִשֵּׁה
  choice: நெருப்புக் காணிக்கை
  rationale: இந்தச் சொல் நெருப்பின் மூலம் செலுத்தப்படும் பலிவகையைச் சுட்டுகிறது; ‘உணவுக் காணிக்கை’ என்ற மாற்றுப் புரிதலைவிட மூலச்சொல்லின் வெளிப்படையான நெருப்புத் தொடர்பை இது பாதுகாக்கிறது.
- source_word: רֵיחַ נִיחֹחַ
  choice: இனிய நறுமணம் தரும்
  rationale: வழிபாட்டுச் சூழலில் ஏற்றுக்கொள்ளத்தக்க அல்லது மகிழ்வூட்டும் மணத்தைக் குறிக்கும் எபிரேயச் சொற்றொடரை இயல்பான தமிழில் தருகிறது.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: יהוה என்ற உடன்படிக்கைப் பெயரை பொதுப்பட்டமாக மாற்றாமல், தமிழில் ஒலிபெயர்த்து வழங்குகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரை தனிப்பட்ட இறைப்பெயரான יהוה-ஐ நேரடியாகப் பயன்படுத்துகிறது. ‘யாவே’ என்ற ஒலிபெயர்ப்பு பெயருக்கும் பட்டத்திற்கும் உள்ள வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: אִשֵּׁה என்பதன் பொருள்
  choice: நெருப்புக் காணிக்கை
  alternative: உணவுக் காணிக்கை
  rationale: இச்சொல்லின் துல்லியமான சொற்பிறப்பும் நுண்பொருளும் விவாதிக்கப்பட்டாலும், பலிச் சூழலில் நெருப்பின் மூலம் செலுத்தப்படும் காணிக்கையை அது குறிக்கிறது. ஆகவே நெருப்புத் தொடர்பை முதன்மை உரையில் வைத்துக் கொண்டு மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டிற்குரிய கண்ணியமான ஆனால் பொதுவாசகருக்குப் புரியக்கூடிய நடை பயன்படுத்தப்பட்டுள்ளது. ‘தகனபலி’, ‘தானியக் காணிக்கை’, ‘பானக் காணிக்கை’ ஆகியவை இப்பகுதியின் பலிவகை வேறுபாடுகளைத் தெளிவாக வைத்திருக்கின்றன; அரிதான மாற்றுப் பொருள்கள் அடிக்குறிப்புகளில் தரப்பட்டுள்ளன.
