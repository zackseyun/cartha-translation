  text: דַּבֵּ֞ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם כִּֽי תָבֹ֣אוּ אֶל הָ/אָ֗רֶץ אֲשֶׁ֤ר אֲנִי֙ נֹתֵ֣ן לָ/כֶ֔ם וּ/קְצַרְתֶּ֖ם אֶת קְצִירָ֑/הּ וַ/הֲבֵאתֶ֥ם אֶת עֹ֛מֶר רֵאשִׁ֥ית קְצִירְ/כֶ֖ם אֶל הַ/כֹּהֵֽן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/010.yaml
  text: 'Speak to the sons of Israel and say to them: When you come into the land that I am giving to you[a], and reap its harvest[b], then you shall bring the sheaf of the firstfruits of your harvest to the priest.'
translation:
  language: ta
  text: '“இஸ்ரவேலின் மக்களிடம் பேசி, அவர்களிடம் சொல்: ‘நான் உங்களுக்குக் கொடுக்கிற நாட்டிற்குள் நீங்கள் வந்து, அதன் பயிரை அறுவடை செய்யும்போது, உங்கள் அறுவடையின் முதற்பலனான கதிர்க்கட்டையை[a] ஆசாரியனிடம் கொண்டுவர வேண்டும்.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்கள் அறுவடையின் முதற்பலனான ஓமெரை.” ‘ஓமெர்’ என்ற எபிரெயச் சொல் இங்கு ஒரு கதிர்க்கட்டையைக் குறிக்கலாம்; அது ஓர் அளவின் தொழில்நுட்பப் பெயராகவும் பயன்படுத்தப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மக்கள்
  rationale: எபிரெய மொழிவடிவம் சொற்சொல்லாக ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், முழு உடன்படிக்கைச் சமூகத்தையும் குறிக்கும் இயல்பான நவீனத் தமிழாக ‘இஸ்ரவேலின் மக்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: כִּי תָבֹאוּ
  choice: நீங்கள் ... வந்து ... அறுக்கும்போது
  rationale: כִּי இங்கு கட்டளை பொருந்தும் காலச்சூழலை அறிமுகப்படுத்துவதால் தமிழில் ‘-ும்போது’ அமைப்பு இயல்பாகப் பொருளைத் தருகிறது.
- source_word: הָאָרֶץ
  choice: நாடு
  rationale: இஸ்ரவேலர் நுழையவிருந்த குறிப்பிட்ட நிலப்பரப்பைக் குறிக்கும் சூழலுக்கு ‘நாடு’ தெளிவானதும் இயல்பானதும் ஆகும்.
- source_word: נֹתֵן
  choice: கொடுக்கிற
  rationale: எபிரெய நிகழ்காலப் பங்கேற்புவினையின் தொடரும் அல்லது அண்மைய செயற்பாட்டுணர்வை ‘கொடுக்கிற’ காக்கிறது.
- source_word: וּקְצַרְתֶּם אֶת קְצִירָהּ
  choice: அதன் அறுவடையை அறுக்கும்போது
  rationale: வினை–பெயர் சொற்பிறப்புத் தொடர்பை ‘அறுவடையை அறு’ என்ற தமிழ்ச் சேர்க்கை ஓரளவு காக்கிறது.
- source_word: עֹמֶר
  choice: ஒரு கதிர்க்கட்டை
  rationale: இச்சடங்குச் சூழலில் ஆசாரியனிடம் கொண்டுவரப்படும் அறுத்த தானியக்கதிர்களின் கட்டு முதன்மைப் பொருள்; தொழில்நுட்பப் பெயரான ‘ஓமெர்’ அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: רֵאשִׁית קְצִירְכֶם
  choice: உங்கள் அறுவடையின் முதற்பலனாகிய
  rationale: רֵאשִׁית அறுவடையின் முதற்பகுதியையும் காணிக்கைக்குரிய தன்மையையும் குறிக்கிறது; ‘முதற்பலன்’ இரண்டையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: הַכֹּהֵן
  choice: ஆசாரியன்
  rationale: லேவியராகமத்தின் வழிபாட்டுச் சட்டச் சூழலில் כֹּהֵן என்பதற்கான மரபாக நிலைபெற்ற, தெளிவான தமிழ்ச் சொல்.
theological_decisions:
- issue: உடன்படிக்கைச் சமூகத்திற்கான பாலின வடிவமுள்ள அழைப்பு
  choice: இஸ்ரவேலின் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: בְּנֵי יִשְׂרָאֵל இலக்கணத்தில் ஆண்பால் பன்மையாக இருந்தாலும், இங்கு இஸ்ரவேல் சமூகத்தை வழக்கமான கூட்டுப் பெயராகக் குறிக்கிறது. தமிழில் ‘மகன்கள்’ என்பது ஆண்களை மட்டும் குறிக்கும் தவறான எண்ணத்தை உண்டாக்கக்கூடும்; ஆகவே சமூகமுழுவதையும் குறிக்கும் பொருள் மொழிபெயர்க்கப்பட்டது.
- issue: עֹמֶר என்ற வழிபாட்டுச் சொல்
  choice: ஒரு கதிர்க்கட்டை
  alternative: ஒரு ஓமெர்
  rationale: இவ்வசனம் அறுவடையிலிருந்து ஆசாரியனிடம் கொண்டுவரப்படும் பொருளை விவரிப்பதால் கண்முன் நிற்கும் வேளாண் பொருள் முதன்மை உரையில் தரப்பட்டது. அளவையையோ தொழில்நுட்பச் சடங்குச் சொல்லையோ குறிக்கும் சாத்தியம் அடிக்குறிப்பில் வைக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டக் கட்டளைக்கேற்ற கண்ணியமான நேரடி நடை பயன்படுத்தப்பட்டது. மேற்கோள் அமைப்பு பேச்சுக் கட்டளையின் அடுக்கைத் தெளிவாக்குகிறது; தேவையற்ற தொன்மையான வினைமுற்றுகள் தவிர்க்கப்பட்டன.
