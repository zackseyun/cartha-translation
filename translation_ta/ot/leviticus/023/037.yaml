revisions:
- from: 'நீங்கள் பரிசுத்தக் கூடுகைகளாக அறிவிக்க வேண்டிய ஆண்டவரின் நியமிக்கப்பட்ட காலங்கள் இவையே. அவற்றில் ஆண்டவருக்கு உணவுப் படையலைச் செலுத்த வேண்டும்: தகனப் பலி, தானியப் படையல், பலி, பானப் படையல்கள் ஆகியவற்றை அந்தந்த நாளுக்கு உரியபடி செலுத்த வேண்டும்.'
  to: 'ஆண்டவரின் நியமிக்கப்பட்ட காலங்கள் இவையே; அவற்றை நீங்கள் பரிசுத்தக் கூடுகைகளாக அறிவித்து, ஆண்டவருக்கு உணவுப் படையலைச் செலுத்த வேண்டும்: தகனப் பலி, தானியப் படையல், பலி, பானப் படையல்கள்; ஒவ்வொரு நாளுக்கும் உரியவற்றை அந்தந்த நாளில் செலுத்த வேண்டும்.'
  rationale: The revision removes the unsupported locative nuance, retains the Hebrew purpose connection between proclamation and presentation of offerings, preserves the four-part offering list, and states explicitly that each day’s prescribed offerings are to be presented on that day. No footnote is necessary because the selected rendering of אִשֶּׁה follows the supplied English POB audit trail and no textual variant is involved.
  reviewer_model: gpt-5.6-terra
