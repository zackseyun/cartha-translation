source:
  edition: WLC
  text: אֵ֚לֶּה מוֹעֲדֵ֣י יְהוָ֔ה אֲשֶׁר תִּקְרְא֥וּ אֹתָ֖/ם מִקְרָאֵ֣י קֹ֑דֶשׁ לְ/הַקְרִ֨יב אִשֶּׁ֜ה לַ/יהוָ֗ה עֹלָ֧ה וּ/מִנְחָ֛ה זֶ֥בַח וּ/נְסָכִ֖ים דְּבַר י֥וֹם בְּ/יוֹמֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/037.yaml
  text: 'These are the appointed times of the LORD, which you shall proclaim as holy convocations, to present a food offering to the LORD: a burnt offering and a grain offering, a sacrifice and drink offerings, each day''s matter on its day.'
translation:
  language: ta
  text: 'ஆண்டவரின் நியமிக்கப்பட்ட காலங்கள் இவையே; அவற்றை நீங்கள் பரிசுத்தக் கூடுகைகளாக அறிவித்து, ஆண்டவருக்கு உணவுப் படையலைச் செலுத்த வேண்டும்: தகனப் பலி, தானியப் படையல், பலி, பானப் படையல்கள்; ஒவ்வொரு நாளுக்கும் உரியவற்றை அந்தந்த நாளில் செலுத்த வேண்டும்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מוֹעֲדֵי
  choice: நியமிக்கப்பட்ட காலங்கள்
  rationale: குறித்த நேரம் அல்லது நியமிக்கப்பட்ட பண்டிகைக் காலம் என்ற எபிரேயச் சொல்லின் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: יְהוָה
  choice: ஆண்டவர்
  rationale: தமிழ் வேதாகம மரபில் தேவனுடைய திருப்பெயரைக் குறிக்கும் மரியாதையான வழக்கமான வடிவம்.
- source_word: מִקְרָאֵי קֹדֶשׁ
  choice: பரிசுத்தக் கூடுகைகள்
  rationale: அழைக்கப்பட்ட புனிதச் சபைக்கூடுகைகள் என்ற கருத்தைச் சுருக்கமாகவும் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: אִשֶּׁה
  choice: உணவுப் படையல்
  rationale: இச்சொல் நெருப்பில் செலுத்தப்படும் படையலைக் குறிக்கலாம்; பலியுணவு சார்ந்த சூழலை முன்னிறுத்தும் WLC-அடிப்படையிலான சாத்தியமான பொருளையும் ஆங்கில ஆலோசனை உரையையும் பின்பற்றுகிறது.
- source_word: עֹלָה
  choice: தகனப் பலி
  rationale: முழுவதுமாக மேலே எழும்பும்படி எரிக்கப்படும் பலிக்கான நிலைபெற்ற தமிழ் சொல்.
- source_word: מִנְחָה
  choice: தானியப் படையல்
  rationale: லேவியராகமச் சூழலில் பொதுவான காணிக்கையைவிட தானியத்தால் செய்யப்படும் படையலைக் குறிப்பாகக் காட்டுகிறது.
- source_word: נְסָכִים
  choice: பானப் படையல்கள்
  rationale: ஊற்றிச் செலுத்தப்படும் திரவப் படையல்களைக் குறிக்கும் பன்மையைப் பாதுகாக்கிறது.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: அந்தந்த நாளுக்கு உரியபடி
  rationale: ஒவ்வொரு நாளுக்குரிய கடமையை அதே நாளில் நிறைவேற்ற வேண்டும் என்ற எபிரேய மொழிப்பாங்கை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: אִשֶּׁה என்பதன் மொழிபெயர்ப்பு
  choice: உணவுப் படையல்
  alternative: நெருப்புப் படையல்
  rationale: பலிகளைக் கர்த்தருக்கான உணவு எனக் கூறும் ஆசாரியச் சூழலை வெளிப்படுத்துகிறது; இருப்பினும் நெருப்பில் செலுத்தப்படுதல் என்ற சொல்லின் தொடர்பு உண்மையான மாற்று வாசிப்பாக உள்ளது.
- issue: יהוה என்ற திருப்பெயரின் வெளிப்பாடு
  choice: ஆண்டவர்
  alternative: யாவே
  rationale: மூலத்தில் தனிப்பட்ட திருப்பெயர் இருப்பதை உணர்ந்தபடியே, நவீனத் தமிழ் வேதாகம வாசிப்பில் பரவலாகப் புரியும் மரியாதை வடிவம் தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டு உரைக்கு ஏற்ற கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டது. மூலத்தின் பட்டியல் அமைப்பு பாதுகாக்கப்பட்டாலும், கடைசி சொற்றொடர் சாதாரண வாசகருக்குத் தெளிவாக இயல்பாக்கப்பட்டது.
