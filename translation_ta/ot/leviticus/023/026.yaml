lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பேசினார்
  rationale: דבר என்பதன் தொடர்வினை வடிவம் ஒரு புதிய உரை நிகழ்வை அறிமுகப்படுத்துகிறது; அதைத் தொடர்ந்து לֵאמֹר வருவதால், ‘சொன்னார்’ என்பதை மட்டும் பயன்படுத்துவதைவிட ‘பேசினார்’ மூலத்தின் சூத்திர அமைப்பைத் தெளிவாகக் காக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: நான்கெழுத்துத் தெய்வீகப் பெயரான יהוה-ஐ ஒரு பட்டமாக மாற்றாமல், தமிழில் பரவலாக அறியப்படும் பெயர்வடிவமாக ஒலிபெயர்க்கிறது.
- source_word: אֶל
  choice: -ிடம்
  rationale: தெய்வீக உரையின் பெறுநரைக் குறிக்கும் எபிரெய முன்னிடைச்சொல்லை இயல்பான நவீனத் தமிழில் வேற்றுமை உருபாக வழங்குகிறது.
- source_word: מֹשֶׁה
  choice: மோசே
  rationale: משה என்ற தனிப்பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: לֵאמֹר
  choice: சொன்னார்
  rationale: முந்தைய ‘பேசினார்’ என்பதுடன் இணைந்து, அடுத்து வரும் உரையின் உள்ளடக்கத்தை அறிமுகப்படுத்தும் எபிரெயச் சூத்திரத்தை ‘பேசிச் சொன்னார்’ என இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יהוה என்ற தெய்வீகப் பெயரை வழங்குதல்
  choice: யெகோவா
  alternative: யாவே
  rationale: மூலத்தில் ஒரு பொதுப்பட்டம் அல்ல, நான்கெழுத்துத் தெய்வீகப் பெயரே உள்ளது. எனவே ‘கர்த்தர்’ போன்ற பட்டத்தால் மாற்றாமல் பெயராகவே வழங்கப்பட்டுள்ளது; அதன் உச்சரிப்பு உறுதியாகத் தெரியாததால் மாற்று ஒலிபெயர்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ். மூலத்தின் வழக்கமான உரை அறிமுகச் சூத்திரத்தைத் தமிழில் இயல்பான ‘பேசிச் சொன்னார்’ என்ற அமைப்பால் காக்கிறது; அடுத்த வசனத்தில் நேரடி உரை தொடர்வதை உணர்த்த முக்காற்புள்ளி பயன்படுத்தப்பட்டுள்ளது.
