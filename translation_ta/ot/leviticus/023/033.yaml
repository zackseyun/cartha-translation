lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பேசி
  rationale: וַיְדַבֵּר ஒரு புதிய உரை நிகழ்வைத் தொடங்குகிறது. அடுத்த வசனத்தில் அதன் உள்ளடக்கம் தொடர்வதால், தமிழில் இயல்பான தொடரமைப்பான ‘பேசி’ பயன்படுத்தப்பட்டது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: எபிரெய மெய்யெழுத்துப் பெயரான יהוה-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் பரவலாக அறியப்படும் பெயர்வடிவமாக வழங்குகிறது; அதன் உச்சரிப்பு குறித்த உறுதியின்மையை அடிக்குறிப்பு தெரிவிக்கிறது.
- source_word: אֶל
  choice: -இடம்
  rationale: பேச்சு யாரை நோக்கிச் சொல்லப்பட்டது என்பதை இயல்பான நவீனத் தமிழில் குறிக்கிறது.
- source_word: מֹשֶׁה
  choice: மோசே
  rationale: מֹשֶׁה என்ற தனிப்பெயரின் தமிழில் நிலைபெற்ற வடிவம்.
- source_word: לֵאמֹר
  choice: பேசி,
  rationale: இது தொடர்ந்து வரும் நேரடி உரையை அறிமுகப்படுத்தும் எபிரெய மரபுச் சூத்திரம். ‘பேசி’ என்பதுடன் முடிவிலுள்ள காற்புள்ளி, அடுத்த வசனத்தில் செய்தி தொடர்வதை இயல்பாகக் காட்டுகிறது; தனியே ‘சொன்னார்’ என மீளுரைப்பதைத் தவிர்க்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட இறைப் பெயர் நேரடியாக உள்ளது. அதைப் ‘கர்த்தர்’ என்ற பட்டப்பெயராக மாற்றாமல் பெயராகவே தரப்பட்டுள்ளது. எபிரெய எழுத்துகள் மெய்யெழுத்துகளை மட்டுமே உறுதிப்படுத்துவதால், ‘யாவே’ என்ற மாற்று உச்சரிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன, எளிய, மரியாதையான தமிழ். எபிரெய உரை அறிமுகச் சூத்திரத்தைத் தமிழின் இயல்பான தொடர்வினை அமைப்பில் வழங்கி, அடுத்த வசனத்துடன் உள்ள தொடர்ச்சியைப் பாதுகாக்கிறது.
