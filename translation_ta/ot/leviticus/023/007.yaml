revisions:
- from: முதலாம் நாளில் உங்களுக்குப் பரிசுத்த ஒன்றுகூடல்[a] நடைபெற வேண்டும்; வழக்கமான உழைப்புக்குரிய எந்த வேலையையும்[b] நீங்கள் செய்யக் கூடாது.
  to: முதல் நாளில் உங்களுக்குப் பரிசுத்தக் கூட்டம் இருக்க வேண்டும்; வழக்கமான வேலையொன்றையும் நீங்கள் செய்யக் கூடாது.
  rationale: The revision improves modern Tamil idiom and aligns the existential force of יִהְיֶה לָכֶם more closely with ‘இருக்க வேண்டும்.’ It retains the source’s formal cultic register and the narrower-than-absolute scope of מְלֶאכֶת עֲבֹדָה. Footnote alternatives are made natural and free of unintended institutional connotations.
  reviewer_model: gpt-5.6-terra
