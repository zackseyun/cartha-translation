source:
  edition: WLC
  text: בַּ/יּוֹם֙ הָֽ/רִאשׁ֔וֹן מִקְרָא קֹ֖דֶשׁ יִהְיֶ֣ה לָ/כֶ֑ם כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֥א תַעֲשֽׂוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/007.yaml
  text: On the first day there shall be a holy convocation for you[b][a]; you shall do no laborious work.
translation:
  language: ta
  text: முதல் நாளில் உங்களுக்குப் பரிசுத்தக் கூட்டம் இருக்க வேண்டும்; வழக்கமான வேலையொன்றையும் நீங்கள் செய்யக் கூடாது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּיּוֹם הָרִאשׁוֹן
  choice: முதலாம் நாளில்
  rationale: בְּ என்ற காலப் பொருள் தரும் முன்னொட்டையும், குறிப்பிட்ட முதலாம் நாளைக் குறிக்கும் பெயர்ச்சொல் தொடரையும் இயல்பான நவீனத் தமிழில் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: מִקְרָא קֹדֶשׁ
  choice: பரிசுத்த ஒன்றுகூடல்
  rationale: מִקְרָא என்பதில் ஒன்றுகூடுவதற்கான அழைப்பு அல்லது கூட்டம் என்ற வழிபாட்டுச் சூழல் பொருள் உள்ளது; קֹדֶשׁ அதைத் தனியே அர்ப்பணிக்கப்பட்ட பரிசுத்த நிகழ்வாகக் குறிக்கிறது. ‘ஒன்றுகூடல்’ என்பது ‘கூட்டம்’ என்பதைவிட அழைக்கப்பட்டு ஒன்றுசேரும் நுண்பொருளை ஓரளவு காக்கிறது.
- source_word: יִהְיֶה לָכֶם
  choice: உங்களுக்குப் ... நடைபெற வேண்டும்
  rationale: மக்களுக்காக அந்த நாளில் இத்தகைய பரிசுத்த ஒன்றுகூடல் இருக்க வேண்டும் என்ற சட்டக் கட்டளையின் வலிமையை இயல்பான தமிழில் தருகிறது.
- source_word: כָּל ... לֹא
  choice: எந்த ... வேலையையும் ... செய்யக் கூடாது
  rationale: எபிரெயச் சொல்லமைப்பில் உள்ள முழுமையான மறுப்பைத் தமிழில் இயல்பாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: מְלֶאכֶת עֲבֹדָה
  choice: வழக்கமான உழைப்புக்குரிய ... வேலை
  rationale: ‘வேலை/தொழில் சார்ந்த உழைப்பு’ என்ற இணைச்சொல்லின் பொருளை வெளிப்படுத்தி, எல்லா வகையான செயல்களும் முற்றிலும் தடைசெய்யப்படுகின்றன என்ற மிகைப்படுத்தலைத் தவிர்க்கிறது.
- source_word: לֹא תַעֲשׂוּ
  choice: நீங்கள் செய்யக் கூடாது
  rationale: சட்டப் பகுதியில் வரும் தடைக் கட்டளையை நவீனத் தமிழில் இயல்பாகவும் அதிகாரபூர்வமாகவும் வழங்குகிறது.
theological_decisions:
- issue: מְלֶאכֶת עֲבֹדָה என்பதில் விழா நாளுக்கான தடையின் எல்லை
  choice: வழக்கமான உழைப்பு அல்லது தொழிலுக்குரிய வேலை தடைசெய்யப்படுகிறது.
  alternative: எவ்வித வேலையும் செயல்பாடும் விதிவிலக்கின்றித் தடைசெய்யப்படுகிறது.
  rationale: מְלֶאכֶת עֲבֹדָה என்ற குறிப்பிட்ட இணைச்சொல் வெறும் ‘எல்லா வேலையும்’ என்பதைக் காட்டிலும் குறுகியதாக இருந்து, வழக்கமான உழைப்பு/சேவை சார்ந்த வேலையைக் குறிக்கிறது. ஆகவே வசனம் கூறுவதைவிடத் தடையை விரிவாக்காமல் அந்த நுண்பொருள் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், லேவியராகமத்தின் சட்ட மற்றும் வழிபாட்டு நடைக்கு ஏற்ற கண்ணியமான மொழிநடை பயன்படுத்தப்பட்டுள்ளது. ‘பரிசுத்த ஒன்றுகூடல்’ வழிபாட்டுக்காக அழைக்கப்பட்ட கூட்டத்தின் நுண்பொருளையும், ‘வழக்கமான உழைப்புக்குரிய வேலை’ தடை எல்லையின் குறிப்புத்தன்மையையும் காக்கின்றன.
