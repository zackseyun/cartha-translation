id: LEV.23.39
reference: Leviticus 23:39
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: אַ֡ךְ בַּ/חֲמִשָּׁה֩ עָשָׂ֨ר י֜וֹם לַ/חֹ֣דֶשׁ הַ/שְּׁבִיעִ֗י בְּ/אָסְפְּ/כֶם֙ אֶת תְּבוּאַ֣ת הָ/אָ֔רֶץ תָּחֹ֥גּוּ אֶת חַג יְהוָ֖ה שִׁבְעַ֣ת יָמִ֑ים בַּ/יּ֤וֹם הָֽ/רִאשׁוֹן֙ שַׁבָּת֔וֹן וּ/בַ/יּ֥וֹם הַ/שְּׁמִינִ֖י שַׁבָּתֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/039.yaml
  text: However[a], on the fifteenth day of the seventh month, when you have gathered in the produce of the land, you shall celebrate the feast of Yahweh for seven days. On the first day there shall be a solemn rest[b], and on the eighth day a solemn rest.
translation:
  language: ta
  text: ஆயினும்[a], ஏழாம் மாதத்தின் பதினைந்தாம் நாளில், நிலத்தின் விளைச்சலை நீங்கள் சேகரித்த பின்பு, ஏழு நாட்கள் யாவேவின் விழாவைக் கொண்டாட வேண்டும். முதல் நாளில் சிறப்பு ஓய்வு[b] இருக்க வேண்டும்; எட்டாம் நாளிலும் சிறப்பு ஓய்வு இருக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஆயினும்” என்பதற்கு “குறிப்பாக” அல்லது “நிச்சயமாக” என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது “முழுமையான ஓய்வு,” “ஓய்வுநாள் போன்ற ஓய்வு.” இது புனித அனுசரிப்புடன் தொடர்புடைய சிறப்பு ஓய்வைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: ஆயினும்
  rationale: முந்தைய கட்டளைகளிலிருந்து இவ்விழாவின் காலத்தையும் அனுசரிப்பையும் குறித்த குறிப்பிட்ட அறிவுறுத்தலுக்கு மாறுவதைக் காட்டுகிறது; வலியுறுத்தல் அல்லது வரையறை என்ற நிழற்பொருளும் எபிரெயச் சொல்லில் உள்ளது.
- source_word: בְּאָסְפְּכֶם אֶת תְּבוּאַת הָאָרֶץ
  choice: நிலத்தின் விளைச்சலை நீங்கள் சேகரித்த பின்பு
  rationale: ב prefixed infinitive temporal circumstance-ஐக் குறிக்கிறது; அறுவடை விளைச்சல் சேர்த்துக்கொள்ளப்பட்ட பின்னணியை இயல்பான தமிழில் தெரிவிக்கிறது. תְּבוּאָה தானியத்தை மட்டும் அல்லாமல் நிலத்தின் விளைச்சலைப் பரந்த பொருளில் குறிக்கிறது.
- source_word: תָּחֹגּוּ אֶת חַג יְהוָה
  choice: யாவேவின் விழாவைக் கொண்டாட வேண்டும்
  rationale: חגג மற்றும் חַג ஆகியவை பண்டிகைக் கொண்டாட்டத்தை, பல சூழல்களில் யாத்திரை விழாவையும், குறிக்கின்றன. 'விழா' என்பது நவீனத் தமிழில் இயல்பாகவும் பரந்த பொருளுடனும் உள்ளது; יְהוָה தனிப்பெயராக 'யாவே' என்று ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: שַׁבָּתוֹן
  choice: சிறப்பு ஓய்வு
  rationale: வழக்கமான வேலையிலிருந்து விலகியிருக்கும் புனித விழா ஓய்வை இச்சொல் குறிக்கிறது. 'சிறப்பு ஓய்வு' அதன் விழாசார் தன்மையைத் தெரிவிக்கிறது; இதை வாராந்தர ஓய்வுநாளோடு தவறாக ஒன்றுபடுத்துவதில்லை.
- source_word: שִׁבְעַת יָמִים
  choice: ஏழு நாட்கள்
  rationale: விழா கொண்டாடப்பட வேண்டிய கால அளவை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: எபிரெய மூலத்தில் இறைவனின் நான்கெழுத்துத் தனிப்பெயர் நேரடியாக வருகிறது. பட்டப்பெயராக மாற்றாமல், அதன் பரவலாக ஏற்றுக்கொள்ளப்படும் ஒலிப்பைத் தமிழில் தருகிறது.
- issue: விழாச் சட்டத்தில் שַׁבָּתוֹן என்பதன் பொருள்
  choice: சிறப்பு ஓய்வு
  alternative: ஓய்வுநாள்; முழுமையான ஓய்வு
  rationale: இது புனித அனுசரிப்புடன் தொடர்புடைய வேலைநிறுத்தத்தைக் குறிக்கிறது. வாராந்தர ஓய்வுநாளாக அவசியம் அடையாளப்படுத்தாமல் அதன் சிறப்புத் தன்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்குப் புரியும் கண்ணியமான சட்டநடை பயன்படுத்தப்பட்டுள்ளது. ஒருமை/பன்மை வேறுபாட்டைத் தமிழில் இயல்பாக வெளிப்படுத்த பன்மை மரியாதை வடிவம் பயன்படுத்தப்பட்டது. முதல் மற்றும் எட்டாம் நாட்களின் இணையான அமைப்பு பாதுகாக்கப்பட்டுள்ளது.
