  text: כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֣א תַעֲשׂ֑וּ וְ/הִקְרַבְתֶּ֥ם אִשֶּׁ֖ה לַ/יהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/025.yaml
  text: You shall do no laborious work[a], and you shall present a food offering to Yahweh.
translation:
  language: ta
  text: நீங்கள் உழைப்பான எந்த வேலையும் செய்யக்கூடாது; யாவேக்கு உணவுக் காணிக்கையைச் செலுத்த வேண்டும்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நெருப்பில் செலுத்தும் காணிக்கை” அல்லது “தீக்காணிக்கை.”
    reason: אִשֶּׁה என்பதற்கான பாரம்பரியமான மாற்று மொழிபெயர்ப்புகளைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: כָּל ... לֹא תַעֲשׂוּ
  choice: எதையும் செய்யக் கூடாது
  rationale: எபிரேயத் தடையின் முழுமையான வலிமையை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: מְלֶאכֶת עֲבֹדָה
  choice: உழைப்புத் தொழில்
  rationale: எல்லா செயல்களையும் அல்லாமல், சாதாரண உழைப்பு அல்லது பணிசார்ந்த வேலையைக் குறிக்கும் இச்சொற்றொடரின் பொருளைப் பாதுகாக்கிறது.
- source_word: וְהִקְרַבְתֶּם
  choice: செலுத்த வேண்டும்
  rationale: பலியிடும் சூழலில் ‘அருகில் கொண்டுவருதல்’ என்பது காணிக்கையாகப் படைத்தல் அல்லது செலுத்துதல் என்ற பொருளைக் கொண்டது; ‘செலுத்துதல்’ நவீன தமிழில் இயல்பாக உள்ளது.
- source_word: אִשֶּׁה
  choice: உணவுக் காணிக்கை
  rationale: ஆசாரிய வழிபாட்டு மொழியில் நெருப்பின்மூலம் கடவுளுக்குச் செலுத்தப்படும் காணிக்கை வகையைக் குறிக்கிறது. பாரம்பரியமான ‘தீக்காணிக்கை’ என்ற புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: மூலத்தில் நேரடியாக வரும் உடன்படிக்கைப் பெயரான יהוה என்பதை பொதுப்பட்டப் பெயராக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல உரையில் உள்ள தனிப்பட்ட உடன்படிக்கைப் பெயரைத் தக்கவைத்து, தமிழில் பரவலாகப் புரிந்துகொள்ளக்கூடிய ஒலிபெயர்ப்பைப் பயன்படுத்துகிறது.
- issue: אִשֶּׁה என்ற பலிச்சொல்லின் பொருள்
  choice: உணவுக் காணிக்கை
  alternative: நெருப்பில் செலுத்தும் காணிக்கை; தீக்காணிக்கை
  rationale: இச்சொல் பலியாகக் கடவுளுக்குச் செலுத்தப்படும் காணிக்கையைச் சுட்டுகிறது; அது நெருப்புடன் தொடர்புடையது என்ற மாற்றுப் புரிதலை அடிக்குறிப்பு வெளிப்படையாகத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன, தெளிவான, சட்டவழிகாட்டல் தொனியுள்ள மரியாதையான தமிழ் பயன்படுத்தப்பட்டுள்ளது. இரண்டாம் நபர் பன்மை ‘நீங்கள்’ என்று வெளிப்படையாகக் காட்டப்பட்டுள்ளது; பலிச்சொல்லின் உண்மையான பொருள் சிக்கல் அடிக்குறிப்பில் தக்கவைக்கப்பட்டுள்ளது.
