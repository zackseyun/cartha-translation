base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/003.yaml
  text: For six days work may be done[a], but on the seventh day is a Sabbath of complete rest, a holy convocation. You shall do no work[b]; it is a Sabbath to Yahweh in all your dwellings.
translation:
  language: ta
  text: ஆறு நாட்கள் வேலை செய்யலாம்; ஆனால் ஏழாம் நாள் முழு ஓய்வின் ஓய்வுநாள்[a], பரிசுத்தக் கூட்டம். நீங்கள் எந்த வேலையும் செய்யக்கூடாது. நீங்கள் குடியிருக்கும் எல்லா இடங்களிலும் அது யாவேக்கான ஓய்வுநாள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “முற்றிலும் ஓய்ந்திருக்க வேண்டிய ஓய்வுநாள்.” எபிரெயச் சொற்றொடர் ஓய்வுநாளின் முழுமையான ஓய்வை வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உங்கள் குடியேற்றங்கள் அனைத்திலும்.” எபிரெயச் சொல் குடியிருக்கும் இடங்களையோ குடியேறிய சமூகங்களையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּעָשֶׂה מְלָאכָה
  choice: வேலை செய்யலாம்
  rationale: எபிரெய வினைச்சொல் வடிவில் செயப்பாட்டு பொருள் இருந்தாலும், இச்சட்டச் சூழலில் அனுமதி அல்லது பொதுநியதியை இயல்பான நவீனத் தமிழில் தெளிவாகத் தெரிவிக்கிறது.
- source_word: שַׁבַּת שַׁבָּתוֹן
  choice: முழு ஓய்வுக்குரிய ஓய்வுநாள்
  rationale: இரு தொடர்புடைய சொற்களின் வலியுறுத்தலைப் பாதுகாத்து, சாதாரண ஓய்வு அல்லாமல் முழுமையான வேலைநிறுத்தத்தைத் தெரிவிக்கிறது.
- source_word: מִקְרָא קֹדֶשׁ
  choice: பரிசுத்தக் கூடுகைக்கான நாள்
  rationale: מִקְרָא என்பதில் உள்ள அழைக்கப்பட்ட கூடுகை என்ற கருத்தையும் קֹדֶשׁ என்பதன் பரிசுத்தத் தன்மையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: כָּל מְלָאכָה לֹא תַעֲשׂוּ
  choice: நீங்கள் எந்த வேலையும் செய்யக்கூடாது
  rationale: இரண்டாம் நபர் பன்மையில் உள்ள நேரடியான தடையைத் தெளிவான நவீனத் தமிழில் தருகிறது.
- source_word: שַׁבָּת הִוא לַיהוָה
  choice: அது யாவேக்கான ஓய்வுநாள்
  rationale: அந்த நாள் யாவேக்கு உரியதாகவும் அவரை நோக்கியதாகவும் இருப்பதைக் காட்டும் לַ முன்னொட்டின் பொருளை அளவுக்கு மீறி விளக்காமல் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் வரும் இறைத் திருப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், அதன் பரவலாக ஏற்றுக்கொள்ளப்பட்ட உச்சரிப்பைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: בְּכֹל מוֹשְׁבֹתֵיכֶם
  choice: நீங்கள் குடியிருக்கும் எல்லா இடங்களிலும்
  rationale: ‘குடியிருப்புகள்’ அல்லது ‘குடியேற்றங்கள்’ எனப் பொருள்படக்கூடிய சொல்லைச் சட்டத்தின் பரப்பைத் தெளிவாகக் காட்டும் இயல்பான தமிழில் வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: யெகோவா; ஆண்டவர்
  rationale: மூலத்தில் தனிப்பட்ட திருப்பெயர் நேரடியாக இருப்பதால், பட்டப்பெயராக மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டது.
- issue: שַׁבַּת שַׁבָּתוֹן என்பதன் வலிமை
  choice: முழு ஓய்வுக்குரிய ஓய்வுநாள்
  alternative: மிகுந்த ஓய்வின் நாள்; முற்றிலும் ஓய்ந்திருக்க வேண்டிய ஓய்வுநாள்
  rationale: இச்சொற்றொடர் ஓய்வை வலியுறுத்துகிறது; பிற்காலக் கோட்பாட்டு விளக்கங்களைச் சேர்க்காமல் முழுமையான வேலைநிறுத்தத்தின் கருத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டநடையின் கண்ணியத்தையும் நேரடித்தன்மையையும் காக்கும் வகையில் மொழிபெயர்க்கப்பட்டது. ‘பரிசுத்தம்’, ‘ஓய்வுநாள்’ போன்ற பரவலாக அறியப்பட்ட வேதாகமச் சொற்கள் தக்கவைக்கப்பட்டுள்ளன; தேவையற்ற சமயப்பிரிவு சார்ந்த விளக்கங்கள் தவிர்க்கப்பட்டுள்ளன.
