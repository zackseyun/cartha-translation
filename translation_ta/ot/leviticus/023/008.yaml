base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/008.yaml
  text: And you shall present a food offering to Yahweh for seven days[a]. On the seventh day there shall be a holy convocation; you shall do no laborious work.
translation:
  language: ta
  text: ஏழு நாட்களும் யாவேக்கு நெருப்பில் செலுத்தும் காணிக்கையைப் படைக்க வேண்டும்.[a] ஏழாம் நாளில் புனிதக் கூடுகை நடைபெற வேண்டும்; வழக்கமான உழைப்புக்குரிய வேலை எதையும் செய்யக் கூடாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, “உணவுக் காணிக்கை”; இன்னொரு மொழிபெயர்ப்பு: “நெருப்புக் காணிக்கை.”'
    reason: אִשֶּׁה என்பதற்கு நெருப்பின் மூலம் செலுத்தப்படும் காணிக்கை என்ற வடிவசார் பொருளும், இறைவனுக்கான உணவுக் காணிக்கை என்ற கருத்துசார் மொழிபெயர்ப்பும் பயன்பாட்டில் உள்ளதால் உண்மையான சொற்பொருள் வேறுபாட்டைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  choice: படைக்க வேண்டும்
  rationale: காரணவினை வடிவிலுள்ள קרב, பலியிடும் சூழலில் ஒரு காணிக்கையைக் கொண்டுவந்து கடவுள்முன் செலுத்துவதைக் குறிக்கிறது. ‘படைக்க வேண்டும்’ என்பது தமிழில் இயல்பான பலிச்சொல்லாக இருந்து அந்த வழிபாட்டுச் செயலைத் தெளிவாகத் தருகிறது.
- source_word: אִשֶּׁה
  choice: நெருப்பில் செலுத்தும் காணிக்கை
  rationale: ஆசாரிய வழிபாட்டு மொழியில் இச்சொல் நெருப்பின் மூலம் செலுத்தப்படும் காணிக்கையைக் குறிக்கிறது. அதன் வடிவத்தையும் பலியிடும் முறையையும் தெளிவாகக் காட்டும் இம்மொழிபெயர்ப்பு முதன்மை உரையில் வைக்கப்பட்டுள்ளது; ‘உணவுக் காணிக்கை’ என்ற கருத்துசார் மொழிபெயர்ப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: לְ முன்னொட்டு காணிக்கை யாருக்குச் செலுத்தப்படுகிறது என்பதைக் காட்டுகிறது. יהוה என்பது பட்டப்பெயர் அல்ல, இறைப்பெயர் என்பதால் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: שִׁבְעַת יָמִים
  choice: ஏழு நாட்களும்
  rationale: காணிக்கை செலுத்துதல் ஏழு நாள்களிலும் தொடர்வதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: מִקְרָא קֹדֶשׁ
  choice: புனிதக் கூடுகை
  rationale: திருவிழாவுக்காக அதிகாரப்பூர்வமாக அழைக்கப்பட்ட புனிதச் சேர்க்கையைச் சுருக்கமாகவும் தற்போதைய தமிழில் புரியுமாறும் குறிக்கிறது.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: வழக்கமான உழைப்புக்குரிய வேலை எதையும்
  rationale: இச்சொற்றொடர் எல்லா வகைச் செயலையும் அல்லாமல், வழக்கமான தொழில் அல்லது உழைப்பு வேலையைக் குறிக்கிறது. மொழிபெயர்ப்பு தடையை மிகைப்படுத்தாமல் அந்த வரம்பைப் பேணுகிறது.
- source_word: לֹא תַעֲשׂוּ
  choice: செய்யக் கூடாது
  rationale: எபிரெயத் தடையை நவீனத் தமிழில் நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல உரை יהוה என்ற தனிப்பட்ட இறைப்பெயரையே பயன்படுத்துகிறது. அதை ஒரு பட்டப்பெயரால் மாற்றாமல், பரவலாக ஏற்கப்படும் ஒலிப்புக்கு ஏற்ப ‘யாவே’ என வழங்குவது மூலத்தின் தன்மையைப் பேணுகிறது.
- issue: אִשֶּׁה என்பதன் பலியியல் பொருள்
  choice: நெருப்பில் செலுத்தும் காணிக்கை
  alternative: உணவுக் காணிக்கை
  rationale: இச்சொல் நெருப்போடு தொடர்புடைய பலிக்காணிக்கையைக் குறிக்கிறது; சில சூழல்களில் அது யாவேக்கான ‘உணவு’ எனக் கருத்துருவில் விளக்கப்படுகிறது. முதன்மை உரை பலியிடும் முறையை வெளிப்படுத்துகிறது; மாற்று கருத்துசார் மொழிபெயர்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
