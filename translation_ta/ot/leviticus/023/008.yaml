  register: நடை நவீன, பொதுத்தரத் தமிழாகவும் வழிபாட்டு உரைக்கு ஏற்ற கண்ணியத்துடனும் வைக்கப்பட்டுள்ளது. ‘புனிதக் கூடுகை’ போன்ற சொற்கள் புரிதலையும் ஆசாரியச் சூழலின் முறையான தொனியையும் சமநிலைப்படுத்துகின்றன.
