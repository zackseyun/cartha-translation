base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/027.yaml
  text: But on the tenth day of this seventh month[a], it is the Day of Atonement. It shall be a holy convocation for you[c][b], and you shall afflict yourselves and present a food offering to Yahweh.
translation:
  language: ta
  text: ஆனால், இந்த ஏழாம் மாதத்தின் பத்தாம் நாள் பாவநிவிர்த்தி நாள்[a]. அது உங்களுக்குப் பரிசுத்தக் கூட்டமாக இருக்க வேண்டும். நீங்கள் உங்களை வருத்திக்கொள்ள வேண்டும்[b]; யாவேக்கு நெருப்பினால் செலுத்தும் காணிக்கையைச் செலுத்த வேண்டும்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேய மொழியில் சொல்லுக்குச் சொல், “பாவநிவிர்த்திகளின் நாள்.”
    reason: alternative_reading
  - marker: b
    text: அல்லது, “உங்களைத் தாழ்த்திக்கொள்ள வேண்டும்” அல்லது “சுய மறுப்பைக் கடைப்பிடிக்க வேண்டும்.”
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “உணவுப் படையல்.” இச்சொல் பாரம்பரியமாக “நெருப்புப் பலி” என்றும் மொழிபெயர்க்கப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: ஆனால்
  rationale: முந்தைய பண்டிகை அறிவுறுத்தல்களிலிருந்து வலியுறுத்தலுடன் வேறுபடுத்தும் இடைமாற்றத்தை இயல்பான தமிழில் காட்டுகிறது.
- source_word: בֶּעָשׂוֹר לַחֹדֶשׁ הַשְּׁבִיעִי הַזֶּה
  choice: இந்த ஏழாம் மாதத்தின் பத்தாம் நாள்
  rationale: எபிரேய காலக் குறிப்பைத் தெளிவாகவும் இயல்பாகவும் வழங்கி, ‘இந்த’ என்ற சுட்டையும் காக்கிறது.
- source_word: יוֹם הַכִּפֻּרִים
  choice: பாவநிவிர்த்தி நாள்
  rationale: தமிழில் அறியப்பட்ட பண்டிகைப் பெயரைப் பயன்படுத்துகிறது; எபிரேயப் பன்மை வடிவம் அடிக்குறிப்பில் வெளிப்படுத்தப்படுகிறது.
- source_word: מִקְרָא קֹדֶשׁ
  choice: பரிசுத்தக் கூடுகை
  rationale: அதிகாரப்பூர்வமாக அழைக்கப்பட்ட வழிபாட்டுக் கூட்டம் என்ற சடங்குசார் பொருளைச் சுருக்கமாகவும் மரியாதையான நடையிலும் தெரிவிக்கிறது.
- source_word: וְעִנִּיתֶם אֶת נַפְשֹׁתֵיכֶם
  choice: நீங்கள் உங்களை வருத்திக்கொண்டு
  rationale: இந்த நாளுக்குரிய சுய ஒடுக்கத்தைக் குறிக்கும் எபிரேய மரபுத்தொடரின் பரந்த பொருளைக் காக்கிறது; அதை நோன்பு என்று மட்டும் குறுக்கவில்லை.
- source_word: וְהִקְרַבְתֶּם
  choice: செலுத்த வேண்டும்
  rationale: பலிசார் சூழலில் ஒன்றைப் பலியாகக் கொண்டுவந்து சமர்ப்பிப்பதை இயல்பான தமிழில் குறிக்கிறது.
- source_word: אִשֶּׁה
  choice: நெருப்பில் செலுத்தும் பலி
  rationale: நெருப்பின்மூலம் அர்ப்பணிக்கப்படும் பலி என்ற ஆசாரிய மொழிநடையை வெளிப்படையாகக் காட்டுகிறது; ‘உணவுப் படையல்’ என்ற சாத்தியமான புரிதல் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לַיהוָה
  choice: யெகோவாவுக்கு
  rationale: தெய்வீகப் பெயரான יהוה என்பதை பொதுவாக அறியப்படும் தமிழ்த் திருப்பெயர்ப்பாக நேரடியாக வழங்குகிறது.
theological_decisions:
- issue: כִּפֻּרִים என்ற பன்மை வடிவத்துக்கும் தமிழில் வழக்கமான பண்டிகைப் பெயருக்கும் இடையிலான வேறுபாடு
  choice: பாவநிவிர்த்தி நாள்
  alternative: பாவநிவிர்த்திகளின் நாள்
  rationale: தமிழில் இயல்பாகவும் அறியப்பட்டதாகவும் உள்ள ஒருமைத் தலைப்பை முதன்மை உரையில் வைத்து, மூலத்தின் உண்மையான இலக்கணப் பன்மையை அடிக்குறிப்பில் காக்கிறது.
- issue: தம்மை வருத்திக்கொள்ளுதல் என்பதன் சடங்கு மற்றும் மனந்திரும்புதல் சார்ந்த பரப்பு
  choice: உங்களை வருத்திக்கொண்டு
  alternative: உங்களைத் தாழ்த்திக்கொண்டு; சுய மறுப்பைக் கடைப்பிடித்து
  rationale: கட்டளையை நோன்பாக மட்டும் வரையறுக்காமலும், வெறும் உள்ளார்ந்த தாழ்மையாக மென்மைப்படுத்தாமலும் எபிரேய மரபுத்தொடரின் பொருள் அகலத்தைக் காக்கிறது.
- issue: אִשֶּׁה என்பதன் பலிசார் பொருள்
  choice: நெருப்பில் செலுத்தும் பலி
  alternative: உணவுப் படையல்
  rationale: சொல் நெருப்புடன் தொடர்புடைய பலியைக் குறிக்கிறது என்பது உரையில் வெளிப்படையாக இருக்கிறது; அது கடவுளுக்கான உணவுப் படையலாகச் செயல்படும் ஆசாரிய உருவகம் மாற்று விளக்கமாகக் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்குப் புரியும் மரியாதையான வேதாகம நடையைப் பயன்படுத்துகிறது. ‘பரிசுத்தக் கூடுகை’, ‘பாவநிவிர்த்தி நாள்’ போன்ற சொற்கள் லேவியராகமத்தின் சடங்குசார் தன்மையைத் தக்கவைக்கின்றன; சிக்கலான எபிரேய வடிவங்கள் அடிக்குறிப்புகளில் விளக்கப்படுகின்றன.
