  text: מִ/מּוֹשְׁבֹ֨תֵי/כֶ֜ם תָּבִ֣יאּוּ לֶ֣חֶם תְּנוּפָ֗ה שְׁ֚תַּיִם שְׁנֵ֣י עֶשְׂרֹנִ֔ים סֹ֣לֶת תִּהְיֶ֔ינָה חָמֵ֖ץ תֵּאָפֶ֑ינָה בִּכּוּרִ֖ים לַֽ/יהוָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/017.yaml
  text: From your dwellings you shall bring two loaves of bread for a wave offering[a]; they shall be of two-tenths of an ephah of fine flour, baked with leaven[b], as firstfruits to Yahweh.
translation:
  language: ta
  text: 'நீங்கள் குடியிருக்கும் இடங்களிலிருந்து அசைவாட்டுக் காணிக்கைக்காக இரண்டு அப்பங்களைக் கொண்டுவர வேண்டும். ஒவ்வொன்றும் ஓர் எப்பாவில் பத்தில் இரண்டு பங்கு அளவுள்ள நன்றாக அரைக்கப்பட்ட மாவால் செய்யப்பட்டிருக்க வேண்டும்[a]. அவை புளிப்பூட்டிச் சுடப்பட வேண்டும்[b]. அவை யாவேக்கு முதற்கனிக் காணிக்கையாகும்.


    [a] எபிரெயத்தில், “பத்தில் இரண்டு பங்கு.” ஆசாரிய அளவுமுறையில் இது ஓர் எப்பாவில் பத்தில் இரண்டு பங்கைக் குறிக்கிறது.


    [b] அல்லது, “புளித்த அப்பங்களாகச் சுடப்பட வேண்டும்.” இந்த முதற்கனி அப்பங்கள் புளிப்பூட்டப்பட்டவை என்பதை எபிரெயம் வெளிப்படையாகக் குறிப்பிடுகிறது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “பத்தில் இரண்டு பங்கு.” ஆசாரிய அளவுமுறையில் இது ஓர் எப்பாவில் பத்தில் இரண்டு பங்கைக் குறிக்கிறது.
    reason: cultural_note
  - marker: b
    text: அல்லது, “புளித்த அப்பங்களாகச் சுடப்பட வேண்டும்.” இந்த முதற்கனி அப்பங்கள் புளிப்பூட்டப்பட்டவை என்பதை எபிரெயம் வெளிப்படையாகக் குறிப்பிடுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמּוֹשְׁבֹתֵיכֶם
  choice: நீங்கள் குடியிருக்கும் இடங்களிலிருந்து
  rationale: מוֹשָׁב என்பது குடியிருக்கும் இடம் அல்லது குடியேற்றத்தைக் குறிக்கிறது. இச்சொற்றொடர் மூலத்தின் இடம் சார்ந்த கருத்தை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: תָּבִיאוּ
  choice: கொண்டுவர வேண்டும்
  rationale: בוא என்பதன் ஹிஃபில் வடிவம் இங்கு வழிபாட்டு நியமமாக உள்ளது; தமிழில் கட்டளையின் வலிமையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לֶחֶם תְּנוּפָה
  choice: அசைவாட்டுக் காணிக்கையாக ... அப்பங்கள்
  rationale: לֶחֶם ஒருமை வடிவில் இருந்தாலும் שְׁתַּיִם காரணமாக இரண்டு அப்பங்களைக் குறிக்கிறது. תְּנוּפָה வழிபாட்டில் அசைத்து அர்ப்பணிக்கப்படும் தொழில்நுட்பக் காணிக்கை வகையைக் குறிக்கிறது.
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: ஓர் எப்பாவில் பத்தில் இரண்டு பங்கு அளவு
  rationale: மூலத்தில் நேரடியாக ‘பத்தில் இரண்டு பங்கு’ என்று உள்ளது; ஆசாரிய அளவுமுறையில் அது எப்பாவின் பத்தில் இரண்டு பங்காகப் புரிந்துகொள்ளப்படுகிறது. வாசகருக்குத் தெளிவாக ‘எப்பா’ உரையில் சேர்க்கப்பட்டு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
- source_word: סֹלֶת
  choice: நைசான மாவு
  rationale: தானியக் காணிக்கைகளில் பயன்படுத்தப்பட்ட நன்றாகச் சலிக்கப்பட்ட உயர்தர மாவைக் குறிக்கும் வழக்கமான, சுருக்கமான தமிழ் சொற்றொடர்.
- source_word: חָמֵץ תֵּאָפֶינָה
  choice: புளிப்பூட்டிச் சுட வேண்டும்
  rationale: חָמֵץ அப்பங்கள் புளித்த நிலையில் இருப்பதையும், תֵּאָפֶינָה அவை சுடப்படுவதையும் குறிக்கிறது. தமிழ் வினைத்தொடர் இரு கருத்துகளையும் தெளிவாகக் காக்கிறது.
- source_word: בִּכּוּרִים
  choice: முதற்கனிக் காணிக்கை
  rationale: முதலில் கிடைக்கும் விளைச்சலைக் கடவுளுக்கு அர்ப்பணிக்கும் வழிபாட்டுச் செயல்பாட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: மூலத்தில் வரும் உடன்படிக்கைப் பெயரான יהוה ஒலிபெயர்த்து வழங்கப்படுகிறது; ל அர்ப்பணிப்பின் இலக்கைக் குறிக்க நான்காம் வேற்றுமையாக மொழிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் நான்கு எழுத்து இறைப் பெயர் நேரடியாக உள்ளது. பொதுப்பட்டப் பெயராக மாற்றாமல் உடன்படிக்கைப் பெயரை ஒலிபெயர்ப்பது மூலத்தின் தனித்தன்மையைப் பாதுகாக்கிறது.
- issue: תְּנוּפָה என்ற வழிபாட்டுச் சொல்
  choice: அசைவாட்டுக் காணிக்கை
  alternative: அசைத்து அர்ப்பணிக்கும் காணிக்கை
  rationale: இது இஸ்ரவேலின் பலிமுறையில் குறிப்பிட்ட சடங்கு வகையைக் குறிக்கிறது. தொழில்நுட்பமான காணிக்கைப் பெயரை வைத்திருப்பதால் மேலதிக விளக்கவுரையை உரைக்குள் புகுத்தாமல் அதன் சடங்குப் பொருள் பாதுகாக்கப்படுகிறது.
- issue: புளிப்பூட்டப்பட்ட முதற்கனி அப்பங்கள்
  choice: அவற்றைப் புளிப்பூட்டிச் சுட வேண்டும்
  alternative: புளித்த அப்பங்களாகச் சுட வேண்டும்
  rationale: மற்ற காணிக்கை விதிகளோடு தோன்றக்கூடிய இறையியல் பதற்றத்தைத் தீர்க்க முயலாமல், இவ்வசனம் புளிப்பை வெளிப்படையாகக் கட்டளையிடுவதை அப்படியே காக்கிறது.
