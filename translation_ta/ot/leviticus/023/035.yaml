  text: בַּ/יּ֥וֹם הָ/רִאשׁ֖וֹן מִקְרָא קֹ֑דֶשׁ כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֥א תַעֲשֽׂוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/035.yaml
  text: On the first day there shall be a holy convocation[b][a]; you shall do no laborious work.
translation:
  language: ta
  text: முதல் நாளில் பரிசுத்தக் கூடுகை இருக்க வேண்டும்[a]. தொழில் சார்ந்த வேலை எதையும் நீங்கள் செய்யக்கூடாது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “புனிதச் சபைக்கூட்டம்.” எபிரெயச் சொற்றொடர், பரிசுத்த நோக்கத்திற்காக அழைத்துக் கூட்டப்படும் முறையான கூடுகையைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “வழக்கமான வேலை” அல்லது “கடின உழைப்புக்குரிய வேலை.” இச்சொற்றொடர் பொதுவாகச் சேவை அல்லது தொழிலுடன் தொடர்புடைய அன்றாட உழைப்பைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הָרִאשׁוֹן
  choice: முதல் நாளில்
  rationale: בְּ முன்னிடைச்சொல்லும் ‘முதல்’ என்ற வரிசை எண்ணும் சேர்ந்த காலக் குறிப்பை இயல்பான நவீனத் தமிழில் இவ்வாறு தருகிறது.
- source_word: מִקְרָא קֹדֶשׁ
  choice: பரிசுத்தக் கூடுகை
  rationale: இது வழிபாட்டுக்காக அதிகாரப்பூர்வமாக அழைத்துக் கூட்டப்படும் புனிதச் சபையைக் குறிக்கும் நிலையான சொற்றொடர். ‘பரிசுத்தக் கூடுகை’ அதன் சமயச் சிறப்பையும் கூட்டத்தின் தன்மையையும் இயல்பாகத் தக்கவைக்கிறது.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: தொழில் சார்ந்த வேலை எதையும்
  rationale: இந்தச் சொற்றொடர் எல்லா செயல்களையும் அல்லாமல், சேவை அல்லது வாழ்வாதாரத் தொழிலுடன் தொடர்புடைய வழக்கமான வேலையைக் குறிக்கிறது. ‘தொழில் சார்ந்த வேலை’ அந்த வரம்பைத் தேவையின்றி மிகைப்படுத்தாமல் தெரிவிக்கிறது.
- source_word: לֹא תַעֲשׂוּ
  choice: நீங்கள் செய்யக்கூடாது
  rationale: இரண்டாம் நபர் பன்மை சட்டக் கட்டளையைத் தெளிவான, இயல்பான தமிழில் தடைவிதிக்கும் வடிவில் தருகிறது.
