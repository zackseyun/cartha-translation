  register: நவீன நிலையான தமிழில், பொதுமக்களுக்கு எளிதில் புரியும் மரியாதைமிக்க சட்டநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் சுருக்கமான கட்டளைத் தன்மை காக்கப்பட்டுள்ளது; ‘பரிசுத்தம்’ என்பது லேவியராகமத்தின் வழிபாட்டுச் சூழலுக்கு ஏற்ற நிலையான சொல்.
