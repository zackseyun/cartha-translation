revisions:
- from: ஏனெனில், இந்த நாளிலேயே தம்மைத் தாழ்த்திக்கொள்ளாத எவரும் தம் மக்களிடமிருந்து துண்டிக்கப்படுவார்[a].
  to: ஏனெனில், இந்த நாளிலேயே தம்மை வருத்திக்கொள்ளாத எவரும் தம் மக்களிடமிருந்து அறுக்கப்படுவார்[a].
  rationale: The revision makes the main text more faithful to the Hebrew self-affliction idiom while retaining the interpretive alternative of self-humbling in the footnote. It also uses a more idiomatic formal Tamil equivalent for the traditional, intentionally undefined legal formula "be cut off." No interpretation of the penalty’s mechanism has been added.
