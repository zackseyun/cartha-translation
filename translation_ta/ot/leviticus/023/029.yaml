source:
  edition: WLC
  text: כִּ֤י כָל הַ/נֶּ֨פֶשׁ֙ אֲשֶׁ֣ר לֹֽא תְעֻנֶּ֔ה בְּ/עֶ֖צֶם הַ/יּ֣וֹם הַ/זֶּ֑ה וְ/נִכְרְתָ֖ה מֵֽ/עַמֶּֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/029.yaml
  text: For every person who does not humble himself on this very day shall be cut off from his people[a].
translation:
  language: ta
  text: ஏனெனில், இந்த நாளிலேயே தம்மை வருத்திக்கொள்ளாத எவரும் தம் மக்களிடமிருந்து அறுக்கப்படுவார்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தம்மைத் தாழ்த்திக்கொள்ளாத.” இந்த எபிரெயச் சொற்றொடர் தன்னொறுப்பு அல்லது தன்னை வருத்திக்கொள்ளுதலைக் குறிக்கிறது; மரபில் இது உபவாசத்தோடு தொடர்புபடுத்தப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கட்டளைக்கான காரணத்தையோ விளக்கத்தையோ அறிமுகப்படுத்தும் சட்டநடை இணைப்பாக உள்ளது.
- source_word: כָל הַנֶּפֶשׁ
  choice: எவரும்
  rationale: נֶפֶשׁ இங்கு உடலிலிருந்து வேறுபட்ட ‘ஆத்துமா’ என்ற தொழில்நுட்பக் கருத்தைக் குறிக்காமல், எந்த ஒரு நபரையும் குறிக்கிறது. ‘எவரும்’ என்பது தமிழில் இயல்பான பொதுமை ஒருமை வடிவம்.
- source_word: אֲשֶׁר לֹא תְעֻנֶּה
  choice: தம்மைத் தாழ்த்திக்கொள்ளாத
  rationale: பாவநிவாரண நாளின் சூழலில் ענה என்பது தன்னடக்கம், தன்னொறுப்பு, மனத்தாழ்மை ஆகியவற்றை உள்ளடக்கிய தன்னை வருத்தும் செயலைக் குறிக்கிறது. ‘தம்மைத் தாழ்த்திக்கொள்ளாத’ என்பது மனந்திரும்புதலுக்குரிய உடன்படிக்கை மனப்பாங்கை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது; மேலும் நேரடியான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: இந்த நாளிலேயே
  rationale: עֶצֶם காலக் குறிப்பை வலியுறுத்துகிறது. ‘இந்த நாளிலேயே’ அந்தத் துல்லியத்தையும் வலியுறுத்தலையும் இயல்பாகப் பாதுகாக்கிறது.
- source_word: וְנִכְרְתָה
  choice: துண்டிக்கப்படுவார்
  rationale: כרת என்ற உடன்படிக்கைச் சட்டச் சொல்லின் உருவக வலிமையைப் பாதுகாக்கிறது; அது மரணம், வெளியேற்றம் அல்லது தெய்வீகத் தீர்ப்பு ஆகியவற்றில் எதைச் சுட்டுகிறது என்று வசனத்தைத் தாண்டி வரையறுப்பதில்லை.
- source_word: מֵעַמֶּיהָ
  choice: தம் மக்களிடமிருந்து
  rationale: எபிரெயச் சொல்லின் பெண்பால் பின்னொட்டு, பெண்பால் பெயர்ச்சொல்லான נֶפֶשׁ உடன் இலக்கண ஒத்திசைவால் வந்தது; குறிப்பிடப்படுபவர் எந்த நபரும் ஆவார். மரியாதை மற்றும் பாலினப் பொதுமையைத் தரும் ‘தம்’ இதைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: பாவநிவாரண நாளில் தன்னை ‘வருத்துதல்/தாழ்த்துதல்’ என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘தம்மைத் தாழ்த்திக்கொள்ளாத’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘தம்மை வருத்திக்கொள்ளாத’ அல்லது ‘தன்னொறுப்பைக் கடைப்பிடிக்காத’
  rationale: லேவியராகமம் 16:29; 23:27, 29, 32 ஆகியவற்றில் இச்சொற்றொடர் மனத்தாழ்மை மற்றும் தன்னொறுப்பைக் குறிக்கிறது; மரபில் இது உபவாசத்தோடு தொடர்புபடுத்தப்படுகிறது. உடல் வேதனையை மட்டும் உணர்த்தாமல் அதன் மனந்திரும்புதல் சார்ந்த வலிமையை முதன்மை உரை தருகிறது; நேரடியான மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: ‘துண்டிக்கப்படுதல்’ என்ற தண்டனையின் இயல்பு
  choice: தண்டனையின் செயல்முறையை விளக்காமல் ‘துண்டிக்கப்படுவார்’ என்ற சட்ட உருவகம் தக்கவைக்கப்பட்டது.
  alternative: ‘விலக்கப்படுவார்’ அல்லது ‘நீக்கப்படுவார்’
  rationale: இது மனிதர்களால் நிறைவேற்றப்படும் மரணதண்டனையா, சமூக வெளியேற்றமா, சந்ததியின்மையா அல்லது நேரடியான தெய்வீகத் தீர்ப்பா என்பதை எபிரெய உரை இங்கு குறிப்பிடவில்லை. ஆகவே அதன் திட்டமிட்ட தெளிவின்மை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டநடைக்கேற்ற கண்ணியமான தொனி பயன்படுத்தப்பட்டுள்ளது. ‘தம்/தம்மை’ என்ற வடிவங்கள் ஒருமை பொதுப்பொருளையும் பாலினச் சார்பின்மையையும் இயல்பாகக் காக்கின்றன; ‘துண்டிக்கப்படுவார்’ மூலத்தின் உடன்படிக்கைச் சட்ட உருவகத்தையும் அதன் தீர்க்கப்படாத தண்டனைப் பொருளையும் பாதுகாக்கிறது.
