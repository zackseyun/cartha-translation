base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/022.yaml
  text: And when you reap the harvest of your land[a], you shall not completely reap the edge of your field, and you shall not gather the gleanings of your harvest; you shall leave them for the poor and for the sojourner[b]. I am Yahweh your God.
translation:
  language: ta
  text: நீங்கள் உங்கள் நிலத்தின் விளைச்சலை அறுவடை செய்யும்போது, உன் வயலின் ஓரத்தை[a] முழுவதுமாக அறுவடை செய்யாதே; உன் அறுவடையின் மீதிகளைப் பொறுக்காதே. அவற்றை ஏழைக்கும் குடியிருக்கும் அந்நியனுக்கும்[b] விட்டுவிடு. நான் உங்களுடைய கடவுளான யாவே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உன் வயலின் மூலையை.’ எபிரெயச் சொல் ஓரம், பக்கம் அல்லது மூலை என்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘குடியிருக்கும் பிறநாட்டவனுக்கும்.’ இச்சொல் இஸ்ரவேலரிடையே வாழ்ந்து அவர்களுடைய சமூகப் பாதுகாப்பைப் பெற்ற இஸ்ரவேலரல்லாத ஒருவரைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְקֻצְרְכֶם אֶת קְצִיר אַרְצְכֶם
  choice: நீங்கள் உங்கள் நிலத்தின் விளைச்சலை அறுவடை செய்யும்போது
  rationale: கצר என்பதன் காலச்சூழலை இயல்பான தமிழில் தெரிவிக்கிறது; קְצִיר என்பதற்கு இங்கு வேளாண் விளைச்சல் என்ற பொருள் பொருந்துகிறது.
- source_word: לֹא תְכַלֶּה פְּאַת שָׂדְךָ
  choice: உன் வயலின் ஓரத்தை முழுவதுமாக அறுத்துவிடாதே
  rationale: כלה என்பதன் ‘முழுமையாக முடித்துவிடுதல்’ என்ற வலிமையையும், פאה என்பதன் ஓரம்/எல்லை/மூலை என்ற பரப்பையும் காக்கிறது.
- source_word: וְלֶקֶט קְצִירְךָ לֹא תְלַקֵּט
  choice: உன் அறுவடையில் சிதறிக் கிடப்பவற்றையும் பொறுக்காதே
  rationale: לקט என்பது அறுவடைக்குப் பின் சிதறிக் கிடந்து பொறுக்கப்படக்கூடிய மீதிகளைச் சுட்டுகிறது; ‘பொறுக்காதே’ என்பது வினைச்சொல்லின் வேளாண் சூழலைத் தெளிவாக்குகிறது.
- source_word: לֶעָנִי
  choice: ஏழைக்கு
  rationale: பொருளாதார ரீதியில் வறியவரைச் சுட்டும் עני என்பதற்கான நேரடியான, பொதுவாகப் புரியும் தமிழ்.
- source_word: וְלַגֵּר
  choice: குடியிருக்கும் அந்நியனுக்கு
  rationale: גר என்பது வெறும் வழிப்போக்கரை அல்ல, இஸ்ரவேலரிடையே வாழும் பிறநாட்டவரைக் குறிக்கிறது; நவீன அரசியல் அல்லது குடியேற்றச் சட்டப் பிரிவுகளைத் திணிக்காமல் அந்தச் சமூக நிலையைத் தெரிவிக்கிறது.
- source_word: תַּעֲזֹב אֹתָם
  choice: அவற்றை ... விட்டுவிடு
  rationale: עזב இங்கு கைவிடுதல் என்ற உணர்ச்சிப்பொருளில் அல்லாமல், பிறர் எடுத்துக்கொள்ளும்படி அறுவடை மீதிகளை விட்டுவைப்பதைக் குறிக்கிறது.
- source_word: אֲנִי יְהוָה אֱלֹהֵיכֶם
  choice: நான் உங்கள் கடவுளாகிய யாவே
  rationale: יהוה என்ற உடன்படிக்கைப் பெயரை ஒலிபெயர்த்து, நிறைவு வாய்ப்பாட்டின் எடையைப் பேணுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் தனிப்பட்ட இறைப்பெயர் நேரடியாக இருப்பதால், பட்டப்பெயராக மாற்றாமல் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- issue: גר என்பவரின் சமூக நிலை
  choice: குடியிருக்கும் அந்நியன்
  alternative: பரதேசி
  rationale: இச்சொல் நாட்டினரல்லாதபோதும் அங்கே குடியிருந்து சமூகப் பாதுகாப்பைப் பெறுபவரைக் குறிக்கிறது; ‘பரதேசி’ என்பது வழிப்போக்கர் அல்லது தற்காலிகத் தங்கியவர் என்ற தவறான எண்ணத்தைத் தரக்கூடும்.
- issue: எண்ணிக்கை மாற்றம்
  choice: தொடக்கத்திலும் முடிவிலும் பன்மை; நடுக்கட்டளைகளில் ஒருமை
  alternative: முழுவதும் பன்மையாக ஒருமைப்படுத்துதல்
  rationale: எபிரெய மூலத்தில் כֶם என்ற பன்மையிலிருந்து ךָ என்ற ஒருமைக்கும், இறுதியில் மீண்டும் כֶם என்ற பன்மைக்கும் மாறும் அமைப்பைத் தமிழிலும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சட்டக் கட்டளைக்குரிய கண்ணியமும் நேரடித்தன்மையும் காக்கப்பட்டுள்ளன. மூலத்தின் பன்மை–ஒருமை–பன்மை மாற்றம் திட்டமிட்டே விடப்படவில்லை. ‘சிதறிக் கிடப்பவை’ மற்றும் ‘பொறுக்குதல்’ ஆகியவை சாதாரண வாசகருக்குப் புரியும் வகையில் அறுவடைச் சூழலை வெளிப்படுத்துகின்றன.
