  edition: WLC
  text: אֵ֚לֶּה מוֹעֲדֵ֣י יְהוָ֔ה מִקְרָאֵ֖י קֹ֑דֶשׁ אֲשֶׁר תִּקְרְא֥וּ אֹתָ֖/ם בְּ/מוֹעֲדָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/004.yaml
  text: These are the appointed times of Yahweh[a], holy convocations[b], which you shall proclaim at their appointed times.
translation:
  language: ta
  text: 'இவையே யாவேவின் நியமிக்கப்பட்ட காலங்கள்[a]: அவற்றுக்குரிய காலங்களில் நீங்கள் அறிவிக்க வேண்டிய புனிதக் கூட்டங்கள்[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘குறித்த காலங்கள்’ அல்லது ‘குறித்த பண்டிகைகள்.’ எபிரேயச் சொல் பண்டிகைகளை மட்டும் அல்லாமல், யாவேவால் நியமிக்கப்பட்ட புனித காலங்கள் அனைத்தையும் உள்ளடக்கும் விரிவான பொருளுடையது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘புனிதச் சபைக் கூட்டங்கள்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: இவையே
  rationale: பின்வரும் பட்டியலைச் சுட்டும் பன்மை வடிவம்; வாக்கியத்தின் அறிமுக வலியுறுத்தலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מוֹעֲדֵי
  choice: குறித்த காலங்கள்
  rationale: מוֹעֵד என்பது நியமிக்கப்பட்ட நேரம் அல்லது சந்திப்பு நேரத்தைக் குறிக்கும். இவ்வதிகாரத்தில் ஓய்வுநாளும் சேர்வதால், ‘பண்டிகைகள்’ என்பதைவிட ‘குறித்த காலங்கள்’ என்பது பொருளின் பரப்பையும் காலம் சார்ந்த வலியுறுத்தலையும் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரேய மூலத்தில் வரும் தேவனுடைய தனிப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், நவீனத் தமிழில் பரவலாகப் புரிந்துகொள்ளக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: מִקְרָאֵי קֹדֶשׁ
  choice: புனிதக் கூடுகைகள்
  rationale: புனித நோக்கத்திற்காக அழைத்துக் கூட்டப்படும் சபைகளைக் குறிக்கும் இணைச்சொற்றொடர்; அழைப்பு மற்றும் ஒன்றுகூடல் ஆகிய கருத்துகளை இயல்பான தமிழில் தருகிறது.
- source_word: תִּקְרְאוּ
  choice: அறிவிக்க வேண்டிய
  rationale: இச்சூழலில் קרא என்பது வெறுமனே பெயரிடுதலை அல்ல, குறிப்பிட்ட புனித அனுசரிப்புகளைப் பொதுவாக அறிவித்தலைக் குறிக்கிறது.
- source_word: בְּמוֹעֲדָם
  choice: அவற்றுக்குரிய காலங்களில்
  rationale: ஒவ்வொரு அனுசரிப்பிற்கும் உரிய நியமிக்கப்பட்ட நேரத்தைக் குறிக்கிறது; வசனத்தின் தொடக்கத்தில் உள்ள מוֹעֵד என்ற சொல்லுடனான கருத்து மறுபதிப்பையும் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல உரை இறைவனுடைய நான்கெழுத்துத் தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. அதனைப் பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் தனிப்பெயர் பயன்பாட்டைக் காக்கிறது; ‘யாவே’ என்பது அதன் பொதுவாக ஏற்கப்படும் ஒலிப்பை நவீனத் தமிழில் தருகிறது.
translation_notes:
  register: நவீனத் தரநிலைத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. மூலத்தின் காலம் சார்ந்த சொல் மீளுருவாக்கம் இயன்றவரை காக்கப்பட்டுள்ளது; நீண்ட தொடர்புச் சொற்றொடரைத் தமிழில் இயல்பாக்க நீள்கோடு பயன்படுத்தப்பட்டுள்ளது.
