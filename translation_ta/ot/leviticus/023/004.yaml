revisions:
- from: இவையே யாவே குறித்த காலங்கள்[a]—நீங்கள் அவற்றுக்குரிய காலங்களில் அறிவிக்க வேண்டிய புனிதக் கூடுகைகள்[b].
  to: 'இவையே யாவேவின் நியமிக்கப்பட்ட காலங்கள்[a]: அவற்றுக்குரிய காலங்களில் நீங்கள் அறிவிக்க வேண்டிய புனிதக் கூட்டங்கள்[b].'
  rationale: The revision makes the Hebrew construct with Yahweh explicit, uses the precise and natural expression “நியமிக்கப்பட்ட காலங்கள்,” and retains the source order and future-obligatory force through “நீங்கள் அறிவிக்க வேண்டிய.” The revised wording preserves the repeated appointed-time terminology and improves the naturalness of the lexical-alternative footnotes.
