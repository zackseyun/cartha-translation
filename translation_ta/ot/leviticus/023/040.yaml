language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וּ/לְקַחְתֶּ֨ם לָ/כֶ֜ם בַּ/יּ֣וֹם הָ/רִאשׁ֗וֹן פְּרִ֨י עֵ֤ץ הָדָר֙ כַּפֹּ֣ת תְּמָרִ֔ים וַ/עֲנַ֥ף עֵץ עָבֹ֖ת וְ/עַרְבֵי נָ֑חַל וּ/שְׂמַחְתֶּ֗ם לִ/פְנֵ֛י יְהוָ֥ה אֱלֹהֵי/כֶ֖ם שִׁבְעַ֥ת יָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/040.yaml
  text: And on the first day you shall take for yourselves the fruit of majestic trees[a], branches of palm trees, boughs of leafy trees, and willows of the brook, and you shall rejoice before Yahweh your God for seven days.
translation:
  language: ta
  text: முதல் நாளில், அழகுமிக்க மரத்தின் கனியை[a], பேரீச்ச மரங்களின் ஓலைகளையும், அடர்ந்த தழையுள்ள மரங்களின் கிளைகளையும், நீரோடையின் வில்லோ கிளைகளையும் உங்களுக்காக எடுத்துக்கொள்ள வேண்டும். உங்கள் கடவுளாகிய யாவேயின் முன்னிலையில் ஏழு நாட்கள் மகிழ்ச்சியாயிருக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, பிற்கால யூத மரபின்படி, “எத்ரோக் எனப்படும் சிட்ரன் கனி.” எபிரெயத்தில் சொல்லுக்குச் சொல், “அழகு/சிறப்புடைய மரத்தின் கனி” என்று உள்ளது.
    reason: எபிரெயச் சொற்றொடரின் பொதுவான பொருளையும் பிற்கால யூத மரபின் குறிப்பான தாவர அடையாளத்தையும் வேறுபடுத்திக் காட்டுவதற்கு.
lexical_decisions:
- source_word: וּלְקַחְתֶּם לָכֶם
  choice: உங்களுக்காக எடுத்துக்கொள்ள வேண்டும்
  rationale: சட்ட அறிவுறுத்தலுக்குரிய கட்டளை வலிமையையும் לָכֶם என்பதன் ‘உங்களுக்காக’ என்ற பொருளையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: בַּיּוֹם הָרִאשׁוֹן
  choice: முதல் நாளில்
  rationale: வசனத்தில் வெளிப்படையாக இல்லாத ‘பண்டிகையின்’ என்பதைச் சேர்க்காமல் காலக் குறிப்பை நேரடியாக மொழிபெயர்க்கிறது.
- source_word: פְּרִי עֵץ הָדָר
  choice: சிறப்புமிக்க மரங்களின் கனிகள்
  rationale: הָדָר என்பதன் அழகு, சிறப்பு, மேன்மை ஆகிய பொருள் எல்லையைப் பேணுகிறது; பிற்கால மரபின் குறிப்பான எத்ரோக் அடையாளத்தை மூலவாசகத்துக்குள் திணிக்கவில்லை.
- source_word: כַּפֹּת תְּמָרִים
  choice: பேரீச்ச மரங்களின் ஓலைகள்
  rationale: כַּפֹּת என்பது இங்கு பேரீச்சையின் விரிந்த இலை அல்லது ஓலையைக் குறிக்கிறது; தமிழில் ‘ஓலைகள்’ என்பது தாவரவியல் பொருளை இயல்பாகத் தெரிவிக்கிறது.
- source_word: וַעֲנַף עֵץ עָבֹת
  choice: அடர்ந்த இலைகளுள்ள மரங்களின் கிளைகள்
  rationale: עָבֹת குறிக்கும் அடர்த்தியை, குறிப்பாக அடர்ந்த தழையைக், தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וְעַרְבֵי נָחַל
  choice: நீரோடையோரத்து அலரிக் கிளைகள்
  rationale: עֲרָבָה என்பது நீர்நிலையோரம் வளரும் willow வகை மரம்; தமிழ் வேதாகம நடையில் அறியப்பட்ட ‘அலரி’ என்பதுடன் கிளைகள் என்ற மறைந்த கூறை இயல்பாக நிறைவு செய்கிறது.
- source_word: וּשְׂמַחְתֶּם
  choice: மகிழ்ந்திருக்க வேண்டும்
  rationale: ஏழு நாட்கள் நீடிக்கும் மகிழ்ச்சியை இயல்பான தமிழில் வெளிப்படுத்தி, அறிவுறுத்தலின் வலிமையையும் பேணுகிறது.
- source_word: לִפְנֵי יְהוָה אֱלֹהֵיכֶם
  choice: உங்கள் கடவுளாகிய யெகோவாவின் முன்னிலையில்
  rationale: לִפְנֵי என்பதைக் ‘முன்னிலையில்’ எனவும், יהוה என்ற உடன்படிக்கைப் பெயரை ஒலிபெயர்ப்பாக ‘யெகோவா’ எனவும் வழங்குகிறது.
- source_word: שִׁבְעַת יָמִים
  choice: ஏழு நாட்கள்
  rationale: கால நீட்சியைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் நேரடியாக உள்ள நான்கெழுத்து இறைப்பெயரை பொதுப்பட்டமாக மாற்றாமல் பெயராகவே வழங்குகிறது. தமிழில் பரவலாக அறியப்பட்ட ஒலிவடிவம் தேர்ந்தெடுக்கப்பட்டது; எபிரெய உச்சரிப்பு உறுதியாக அறியப்படாததால் மாற்று ஒலிபெயர்ப்புகள் சாத்தியம்.
- issue: פְּרִי עֵץ הָדָר என்பதன் அடையாளம்
  choice: பொதுவான ‘சிறப்புமிக்க மரங்களின் கனிகள்’
  alternative: எத்ரோக் எனப்படும் நாரத்தைக் கனி
  rationale: எபிரெயச் சொற்றொடர் குறிப்பிட்ட தாவரத்தைத் தெளிவாகப் பெயரிடவில்லை. ஆகவே பிற்கால யூத மரபின் எத்ரோக் அடையாளம் அடிக்குறிப்பில் மட்டும் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுமக்களுக்கு புரியும் கண்ணியமான சட்ட-வழிபாட்டு நடை. பட்டியலின் இணை அமைப்பு பேணப்பட்டுள்ளது. ‘ஓலைகள்’ மற்றும் ‘கிளைகள்’ இயற்கையான தமிழ் தாவரச் சொற்களாகப் பயன்படுத்தப்பட்டுள்ளன.
