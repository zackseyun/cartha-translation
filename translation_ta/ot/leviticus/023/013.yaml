  text: וּ/מִנְחָת/וֹ֩ שְׁנֵ֨י עֶשְׂרֹנִ֜ים סֹ֣לֶת בְּלוּלָ֥ה בַ/שֶּׁ֛מֶן אִשֶּׁ֥ה לַ/יהוָ֖ה רֵ֣יחַ נִיחֹ֑חַ וְ/נִסְכֹּ֥/ה יַ֖יִן רְבִיעִ֥ת הַ/הִֽין׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/013.yaml
  text: Its grain offering shall be two-tenths of an ephah of fine flour mixed with oil[a], a food offering to Yahweh, a pleasing aroma; and its drink offering shall be wine, a fourth of a hin.
translation:
  language: ta
  text: 'அதற்குரிய தானியக் காணிக்கை: எண்ணெயுடன் கலந்த நுண்ணிய மாவு, ஒரு எப்பாவின் பத்தில் இரண்டு பங்கு; யாவேக்குச் செலுத்தும் நெருப்புக் காணிக்கை[a], இனிய நறுமணம். அதற்குரிய பானக் காணிக்கை: ஒரு ஹின்னில் நான்கில் ஒரு பங்கு திராட்சை மது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேக்கான உணவுக் காணிக்கை.”
    reason: אִשֶּׁה என்பதற்கான சொல்லியல் மாற்றைச் சுட்டுகிறது; முதன்மை உரையில் அதன் வழக்கமான சடங்குசார் பொருளான ‘நெருப்புக் காணிக்கை’ தக்கவைக்கப்படுகிறது.
lexical_decisions:
- source_word: וּמִנְחָתוֹ
  choice: அதற்குரிய தானியக் காணிக்கையாக
  rationale: பலியிடப்படும் ஆட்டுக்குட்டியுடன் தொடர்புடைய காணிக்கையை 3ஆம் ஆண்பால் ஒருமை பின்னொட்டு குறிக்கிறது; பலிச் சூழலில் מִנְחָה என்பது தானியக் காணிக்கையைக் குறிக்கிறது.
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: ஓர் எப்பாவில் பத்தில் இரண்டு பங்கு
  rationale: எபிரெயச் சொற்றொடர் நேரடியாக ‘இரண்டு பத்தாம் பங்குகள்’ எனக் கூறுகிறது; ஆசாரியச் சட்டங்களில் குறிக்கப்படும் எப்பா அளவைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: סֹלֶת
  choice: மெல்லிய மாவு
  rationale: காணிக்கைகளுக்குப் பயன்படுத்தப்பட்ட நன்கு சலிக்கப்பட்ட தரமான மாவைக் குறிக்கும் வழிபாட்டுச் சொல்.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: எண்ணெயுடன் கலந்த
  rationale: செயப்பாட்டு வினையெச்சத்தின் பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: אִשֶּׁה לַיהוָה
  choice: யாவேக்கு ... நெருப்புக் காணிக்கையாக
  rationale: אִשֶּׁה என்பது நெருப்பில் செலுத்தப்படும் காணிக்கைக்கான தொழில்நுட்பச் சொல்; தெய்வீகப் பெயர் יהוה ஒலிபெயர்ப்பாக ‘யாவே’ என வழங்கப்படுகிறது.
- source_word: רֵיחַ נִיחֹחַ
  choice: இனிய மணம் தரும்
  rationale: காணிக்கை கடவுளுக்கு ஏற்றதாக இருப்பதை மணத்தின் உருவகத்தால் சொல்லும் நிலையான பலிசார் சொற்றொடரைப் பாதுகாக்கிறது.
- source_word: וְנִסְכֹּה
  choice: அதற்குரிய பானக் காணிக்கையாக
  rationale: נֶסֶךְ என்பது பலியுடன் ஊற்றிச் செலுத்தப்படும் திரவக் காணிக்கை; பின்னொட்டு முந்தைய ஆட்டுக்குட்டியைச் சுட்டுகிறது.
- source_word: יַיִן
  choice: திராட்சைரசம்
  rationale: இச்சூழலில் திராட்சையிலிருந்து உண்டாக்கப்பட்ட மதுவைக் குறிக்கும்; பொதுவாசகர்களுக்குத் தெளிவான தமிழ்ச் சொல்.
- source_word: רְבִיעִת הַהִין
  choice: ஓர் ஹின்னில் நான்கில் ஒரு பங்கு
  rationale: பண்டைய திரவ அளவான ‘ஹின்’ என்பதையும் அதன் நான்கில் ஒரு பங்கு என்ற விகிதத்தையும் பாதுகாக்கிறது.
theological_decisions:
- issue: יהוה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரையில் உடன்படிக்கைப் பெயரான יהוה நேரடியாக உள்ளது; அதனை பொதுப் பட்டப்பெயராக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- issue: אִשֶּׁה என்பதன் பலிசார் பொருள்
  choice: நெருப்புக் காணிக்கை
  alternative: உணவுக் காணிக்கை
  rationale: நெருப்பின் மூலம் செலுத்தப்படும் காணிக்கை என்ற சொல்லின் சடங்குசார் வடிவத்தை முதன்மை உரை பாதுகாக்கிறது; உணவாகக் கருதப்படும் காணிக்கை என்ற மாற்றுப் புரிதல் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. பண்டைய அளவுப் பெயர்கள் ‘எப்பா’, ‘ஹின்’ எனத் தக்கவைக்கப்பட்டு, பின்னங்கள் தமிழில் வெளிப்படையாகக் கூறப்பட்டுள்ளன.
