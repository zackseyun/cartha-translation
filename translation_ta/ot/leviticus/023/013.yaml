revisions:
- from: அதற்குரிய தானியக் காணிக்கையாக, எண்ணெயுடன் கலந்த மெல்லிய மாவை ஓர் எப்பாவில் பத்தில் இரண்டு பங்கு செலுத்த வேண்டும். அது யாவேக்கு இனிய மணம் தரும் நெருப்புக் காணிக்கையாக[a] இருக்கும். அதற்குரிய பானக் காணிக்கையாக, ஓர் ஹின்னில் நான்கில் ஒரு பங்கு திராட்சைரசத்தைச் செலுத்த வேண்டும்.
  to: 'அதற்குரிய தானியக் காணிக்கை: எண்ணெயுடன் கலந்த நுண்ணிய மாவு, ஒரு எப்பாவின் பத்தில் இரண்டு பங்கு; யாவேக்குச் செலுத்தும் நெருப்புக் காணிக்கை[a], இனிய நறுமணம். அதற்குரிய பானக் காணிக்கை: ஒரு ஹின்னில் நான்கில் ஒரு பங்கு திராட்சை மது.'
  rationale: திருத்தம் யாவே என்ற தெய்வீகப் பெயரையும், பலிசார் தொழில்நுட்பச் சொற்களையும், பண்டைய அளவுப் பெயர்களையும் தக்கவைக்கிறது. அதேவேளை יַיִן-ஐத் தெளிவாக ‘திராட்சை மது’ என வழங்கி, மூலத்தில் வெளிப்படையாக இல்லாத கட்டளை வினைகளை நீக்கி, எபிரெயத்தின் அளவு-பட்டியல் வடிவத்தைத் தமிழில் இயல்பாக மீட்டுள்ளது.
