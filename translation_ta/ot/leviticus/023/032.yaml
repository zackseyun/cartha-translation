base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/032.yaml
  text: It is a Sabbath of complete rest for you[a], and you shall afflict yourselves. On the ninth day of the month, in the evening, from evening to evening[b], you shall keep your Sabbath.
translation:
  language: ta
  text: அது உங்களுக்கு முழுமையான ஓய்வுநாளாக இருக்கும்; நீங்கள் உங்களையே வருத்திக்கொள்ள வேண்டும்.[a] மாதத்தின் ஒன்பதாம் நாளின் மாலையில், மாலை முதல் மாலை வரை[b] உங்கள் ஓய்வுநாளை அனுசரிக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்களைத் தாழ்த்திக்கொள்ள வேண்டும்” அல்லது “உங்களையே துன்புறுத்திக்கொள்ள வேண்டும்.” இந்த எபிரெய மரபுத்தொடர் மனந்திரும்புதலுடன் தொடர்புடைய தன்னை வருத்திக்கொள்ளுதலைக் குறிக்கிறது; மரபுவழியாக இது நோன்புடன் தொடர்புபடுத்தப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், “மாலை முதல் மாலை வரை.” இது இஸ்ரவேலரின் நாள் கணக்கீட்டின்படி அனுசரிப்பின் காலத்தைச் சுட்டுகிறது.
    reason: cultural_note
lexical_decisions:
- source_word: שַׁבַּת שַׁבָּתוֹן
  choice: முழுமையான ஓய்வின் ஓய்வுநாள்
  rationale: இணைந்து வரும் பெயர்ச்சொற்கள் ஓய்வையும் செயல்நிறுத்தத்தையும் வலுப்படுத்துகின்றன. இந்தத் தமிழ் வடிவம் அதன் தீவிரப் பொருளைப் பாதுகாத்து, ‘ஆசாரமான’ போன்ற மூலத்தில் வெளிப்படையாக இல்லாத கருத்தைச் சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: וְעִנִּיתֶם אֶת נַפְשֹׁתֵיכֶם
  choice: நீங்கள் உங்களை வருத்திக்கொள்ள வேண்டும்
  rationale: ענה என்ற வினை இந்தச் சடங்குச் சூழலில் தன்னைத்தானே வருத்துதல் அல்லது தாழ்த்துதல் என்பதைக் குறிக்கிறது; நோன்பு அதில் அடங்கியிருக்கலாம் என்றாலும், மூலவசனம் அதை நேரடியாகக் குறிப்பிடவில்லை.
- source_word: נַפְשֹׁתֵיכֶם
  choice: உங்களை
  rationale: இந்த மரபுத்தொடரில் נֶפֶשׁ தன்னிலைப் பொருளில் வருகிறது. ‘உங்கள் ஆத்துமாக்களை’ என்பது இயல்பற்றதோடு, தேவையற்ற உடல்–ஆத்தும இருமையை உணர்த்தக்கூடும்.
- source_word: בְּתִשְׁעָה לַחֹדֶשׁ בָּעֶרֶב
  choice: மாதத்தின் ஒன்பதாம் நாள் மாலையில் தொடங்கி
  rationale: ஒன்பதாம் நாளின் மாலையில் அனுசரிப்பு தொடங்குவதைத் தெளிவுபடுத்துகிறது. ‘தொடங்கி’ என்பது அடுத்து வரும் ‘மாலை முதல் மாலை வரை’ என்ற காலவரம்பிலிருந்து இயல்பாக வெளிப்படும் பொருள்.
- source_word: מֵעֶרֶב עַד עֶרֶב
  choice: மாலை முதல் மாலை வரை
  rationale: எபிரெயச் சொற்றொடரின் வடிவத்தையும் இஸ்ரவேலரின் நாள் கணக்கீட்டையும் நேரடியாகப் பாதுகாக்கிறது; ‘சூரிய அஸ்தமனம் முதல்’ என்று மிகத் துல்லியமாக்கவில்லை.
- source_word: תִּשְׁבְּתוּ שַׁבַּתְּכֶם
  choice: உங்கள் ஓய்வுநாளைக் கடைப்பிடிக்க வேண்டும்
  rationale: சொல்லுக்குச் சொல் ‘உங்கள் ஓய்வை ஓயுங்கள்’ என்பதற்குப் பதிலாக, שבת என்ற வினையின் செயல்நிறுத்தம்/ஓய்வு கருத்தையும் ஓய்வுநாள் அனுசரிப்பையும் இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: பாவநிவாரண நாளின் சூழலில் தன்னை வருத்துவதன் பொருள்
  choice: முதன்மை உரையில் ‘உங்களை வருத்திக்கொள்ள வேண்டும்’ என்று பரந்த கட்டளையைத் தக்கவைத்தல்
  alternative: ‘நீங்கள் நோன்பிருக்க வேண்டும்’ அல்லது ‘உங்களைத் தாழ்த்திக்கொள்ள வேண்டும்’
  rationale: இந்த வசனம் நோன்பை நேரடியாகக் கட்டளையிடவில்லை; அது மரபுவழி அனுசரிப்பில் அடங்கியிருந்தாலும், ‘நோன்பு’ என்று மொழிபெயர்ப்பது எபிரெயச் சொல்லின் பரந்த பொருளைச் சுருக்கும். ‘தாழ்த்திக்கொள்ளுதல்’ சாத்தியமான பொருள் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘ஓய்வுநாள்’ என்ற பரவலாக அறியப்பட்ட சொல்லைத் தக்கவைத்து, ‘முழுமையான ஓய்வு’ மூலம் שַׁבַּת שַׁבָּתוֹן என்பதன் வலுப்படுத்தப்பட்ட பொருள் வெளிப்படுத்தப்பட்டுள்ளது. மூலத்தில் இல்லாத ‘நோன்பு’ முதன்மை உரையில் சேர்க்கப்படவில்லை.
