id: LEV.23.16
reference: Leviticus 23:16
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: עַ֣ד מִֽ/מָּחֳרַ֤ת הַ/שַּׁבָּת֙ הַ/שְּׁבִיעִ֔ת תִּסְפְּר֖וּ חֲמִשִּׁ֣ים י֑וֹם וְ/הִקְרַבְתֶּ֛ם מִנְחָ֥ה חֲדָשָׁ֖ה לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/016.yaml
  text: You shall count fifty days[a], up to the day after the seventh Sabbath; then you shall present a new grain offering to Yahweh.
translation:
  language: ta
  text: ஏழாவது சபாத்துக்கு அடுத்த நாள் வரை நீங்கள் ஐம்பது நாட்களைக் கணக்கிடுங்கள்[a]. அதன்பின் யாவேக்குப் புதிய தானியக் காணிக்கையைச் செலுத்துங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஏழாவது வாரத்துக்கு அடுத்த நாள் வரை.” எபிரெய உரை சொற்பட “ஏழாவது சபாத்துக்கு அடுத்த நாள்” என்று கூறுகிறது; பண்டிகைக்கான இந்தக் கணக்கை நாள்காட்டி அடிப்படையில் எவ்வாறு புரிந்துகொள்வது என்பதில் விளக்கங்கள் வேறுபடுகின்றன.
    reason: alternative_reading
lexical_decisions:
- source_word: עַד
  choice: வரையிலும்
  rationale: எண்ணும் காலத்தின் எல்லையை இயல்பான தமிழில் குறிக்கிறது.
- source_word: מִמָּחֳרַת
  choice: அடுத்த நாள்
  rationale: ‘மறுநாள்’ அல்லது ‘அதற்குப் பிந்திய நாள்’ என்ற பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: הַשַּׁבָּת הַשְּׁבִיעִת
  choice: ஏழாவது ஓய்வுநாள்
  rationale: எபிரெய உரையில் உள்ள ‘ஏழாவது சபத்’ என்ற சொற்றொடரைப் பாதுகாத்து, அதை ‘வாரம்’ என்று விளக்கமாக மாற்றவில்லை.
- source_word: תִּסְפְּרוּ
  choice: நீங்கள் எண்ண வேண்டும்
  rationale: சட்ட அறிவுறுத்தலின் கட்டாயத் தன்மையை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: חֲמִשִּׁים יוֹם
  choice: ஐம்பது நாட்களை
  rationale: எண்ணிக்கையையும் கால அலகையும் நேரடியாக வழங்குகிறது.
- source_word: וְהִקְרַבְתֶּם
  choice: பின்பு ... செலுத்த வேண்டும்
  rationale: பலிசார் சூழலில் காணிக்கையை முன்வைத்தல்/செலுத்துதல் என்ற பொருளையும் செயல்களின் தொடர்ச்சியையும் காட்டுகிறது.
- source_word: מִנְחָה
  choice: தானியக் காணிக்கை
  rationale: லேவியராகமத்தின் பலிசார் பயன்பாட்டில் இது பொதுவாக தானியத்தால் ஆன காணிக்கையைக் குறிக்கிறது.
- source_word: חֲדָשָׁה
  choice: புதிய
  rationale: பெயரடை தரும் நேரடியான பொருளைப் பாதுகாக்கிறது.
- source_word: לַיהוָה
  choice: யெகோவாவுக்கு
  rationale: திருப்பெயரான יהוה என்பதைப் பெயராகவே ஒலிபெயர்த்து, காணிக்கை செலுத்தப்படும் இலக்கை வேற்றுமை உருபுடன் காட்டுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: நான்கு எழுத்துத் திருப்பெயரைப் பொதுப்பட்டப் பெயராக மாற்றாமல் தனிப்பெயராகத் தக்கவைக்கிறது; தமிழில் பரவலாக அறியப்பட்ட வடிவம் பயன்படுத்தப்பட்டது.
- issue: הַשַּׁבָּת הַשְּׁבִיעִת என்பதைக் காலண்டர் மொழியில் விளக்குவதா
  choice: ஏழாவது ஓய்வுநாள்
  alternative: ஏழாவது வாரம்
  rationale: மூலத்தில் வழக்கமான ‘வாரம்’ என்ற சொல் இல்லாமல் שַׁבָּת இருப்பதால், காலண்டர் விவாதத்தை உரைக்குள்ளேயே தீர்மானிக்காமல் மூலச் சொல்லைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்ட அறிவுறுத்தலுக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘ஓய்வுநாள்’ மூலச் சொல்லைத் தெளிவாக வைத்திருக்கிறது; அடிக்குறி மாற்று நாள்காட்டி புரிதலைப் பதிவு செய்கிறது.
