  to: ஏழாவது சபாத்துக்கு அடுத்த நாள் வரை நீங்கள் ஐம்பது நாட்களைக் கணக்கிடுங்கள்[a]. அதன்பின் யாவேக்குப் புதிய தானியக் காணிக்கையைச் செலுத்துங்கள்.
