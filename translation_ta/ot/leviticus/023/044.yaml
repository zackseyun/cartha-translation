base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/044.yaml
  text: So Moses declared the appointed times of Yahweh to the sons of Israel[a].
translation:
  language: ta
  text: மோசே யாவேவின் நியமிக்கப்பட்ட காலங்களை இஸ்ரவேலின் மகன்களுக்கு[a] அறிவித்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இஸ்ரவேலருக்கு’; மரபாக, ‘இஸ்ரவேலின் பிள்ளைகளுக்கு.’ எபிரெய மூலத்தில், ‘இஸ்ரவேலின் மகன்களுக்கு’ என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: அறிவித்தார்
  rationale: பியேல் வடிவிலுள்ள דבר பொதுவாக ‘பேசுதல்’ என்று பொருள்படும். இங்கு திருநாட்கள் பற்றிய பட்டியலின் முடிவில், நேரடி செயப்படுபொருளோடு வருவதால், அவற்றை மக்களுக்குத் தெரியப்படுத்தியதை ‘அறிவித்தார்’ இயல்பாகவும் மிகைப்படுத்தாமலும் வெளிப்படுத்துகிறது.
- source_word: מֹעֲדֵי
  choice: நியமித்த காலங்கள்
  rationale: מוֹעֵד என்பது நிர்ணயிக்கப்பட்ட நேரம் அல்லது கூடுகையைக் குறிக்கலாம். லேவியராகமம் 23-ல் ஓய்வுநாளும் உள்ளதால், ‘பண்டிகைகள்’ என்பதைவிட ‘நியமித்த காலங்கள்’ என்பதே சொல்லின் பரந்த பொருளைப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது இறைவனின் தனிப்பெயரான நான்கெழுத்துப் பெயர்; ஒரு பட்டமாக மாற்றாமல், தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பாக ‘யாவே’ வழங்கப்படுகிறது.
- source_word: אֶל
  choice: -க்கு
  rationale: மோசே யாரிடம் அறிவித்தார் என்பதைக் குறிக்கும் இயல்பான தமிழ் வேற்றுமை உருபு.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரெயச் சொற்றொடரின் நேரடியான ஆண்பால் பிரதிநிதித்துவ வடிவத்தை முதன்மை உரையில் பாதுகாக்கிறது; இயல்பான பொதுமக்கள் குறிப்பு ‘இஸ்ரவேலர்’ என்பது அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற உடன்படிக்கைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் இறைவனின் தனிப்பெயர் நேரடியாக உள்ளது. அதைப் பட்டமான ‘கர்த்தர்’ என்று மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் தன்மையைப் பாதுகாக்கிறது; ‘யாவே’ என்பது நவீன தமிழில் தெளிவான ஒலிபெயர்ப்பு.
translation_notes:
  register: நவீன, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ். ‘இவ்வாறு’ என்பது நிறைவு/சுருக்க வாக்கியத்தின் தொடர்ச்சிச் செயல்பாட்டைக் காட்டுகிறது. ‘யாவே நியமித்த காலங்கள்’ என்ற அமைப்பு தமிழில் இயல்பாக இருந்து, அவை யாவேக்குரிய நியமிக்கப்பட்ட காலங்கள் என்ற எபிரெயச் சார்பை வெளிப்படுத்துகிறது.
