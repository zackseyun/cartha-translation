id: LEV.23.1
reference: Leviticus 23:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ta
  text: 'யாவே[a] மோசேயிடம் பேசிச் சொன்னார்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரேயத்தில்: “YHWH”; மரபாக “ஆண்டவர்” என்று மொழிபெயர்க்கப்படுகிறது.'
    reason: இறைப்பெயரின் எபிரேய வடிவத்தையும் மரபுவழி மாற்று மொழிபெயர்ப்பையும் தெரிவிக்கிறது.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பேசி
  rationale: דבר என்ற வினை இறைவாக்கின் தொடர்ச்சியான உரையாடல் அறிமுகத்தைச் சுட்டுகிறது. அடுத்து வரும் לֵאמֹר உடன் இணைந்து இயல்பான தமிழில் ‘பேசிச் சொன்னார்’ என வழங்கப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எழுத்துகளைக் கொண்ட இறைப்பெயரான יהוה, ஒரு பட்டத்தால் மாற்றப்படாமல் தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பான ‘யாவே’ என்று வழங்கப்பட்டுள்ளது.
- source_word: אֶל
  choice: -இடம்
  rationale: பேச்சு யாரை நோக்கி உரைக்கப்பட்டது என்பதைக் குறிக்கும் முன்னிடைச்சொல்; நவீன தமிழில் இயல்பாக ‘மோசேயிடம்’ என அமைக்கப்பட்டுள்ளது.
- source_word: מֹשֶׁה
  choice: மோசே
  rationale: எபிரேயப் பெயர் தமிழில் நிலைபெற்றுள்ள வழக்கமான வடிவில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: לֵאמֹר
  choice: சொன்னார்
  rationale: தொடர்ந்து வரும் நேரடி உரையை அறிமுகப்படுத்தும் எபிரேய வாய்பாடு. வַיְדַבֵּר உடன் அதன் வேறுபாட்டை முற்றிலும் நீக்காமல், இயல்பான தமிழில் ‘பேசிச் சொன்னார்’ என வழங்கப்பட்டுள்ளது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை வழங்குதல்
  choice: யாவே
  alternative: யெகோவா; ஆண்டவர்
  rationale: மூல எபிரேய உரையில் தனிப்பட்ட இறைப்பெயர் நேரடியாக உள்ளது. ஆகவே அதை ‘ஆண்டவர்’ என்ற பட்டத்தால் மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்ப்பது மூலத்தின் தன்மையைப் பாதுகாக்கிறது; மாற்று வாசிப்பு அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் மரியாதைமிக்கதாகவும் அமைக்கப்பட்டுள்ளது. எபிரேயத்தின் இரட்டை பேச்சு வாய்பாட்டை ‘பேசிச் சொன்னார்’ எனச் சுருக்கமாகப் பாதுகாத்து, அடுத்த வசனத்தில் வரும் நேரடி உரைக்கு முக்காற்புள்ளி இடப்பட்டுள்ளது.
