  text: וְ/כָל הַ/נֶּ֗פֶשׁ אֲשֶׁ֤ר תַּעֲשֶׂה֙ כָּל מְלָאכָ֔ה בְּ/עֶ֖צֶם הַ/יּ֣וֹם הַ/זֶּ֑ה וְ/הַֽאֲבַדְתִּ֛י אֶת הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מִ/קֶּ֥רֶב עַמָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/030.yaml
  text: And every person who does any work on this very day—I will destroy that person from among his people[a].
translation:
  language: ta
  text: இந்த நாளிலேயே எந்த வேலையையும் செய்கிற ஒவ்வொருவரையும் அவரவருடைய மக்களின் நடுவிலிருந்து அழித்துவிடுவேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்த நபரைத் தன் மக்களிடமிருந்து விலக்கிவிடுவேன்.” இங்குள்ள எபிரெய வினை “அழித்தல்/அழியச் செய்தல்” என்று பொருள்படுகிறது; வழக்கமாக “அறுத்து நீக்குதல்” என்று மொழிபெயர்க்கப்படும் வினை இதுவல்ல. எனினும், தீர்ப்பினால் ஒருவரை சமூகத்திலிருந்து நீக்குதல் என்ற பொருள் இதனுடன் நெருங்கிய தொடர்புடையது.
    reason: alternative_reading
lexical_decisions:
- source_word: הַנֶּפֶשׁ
  choice: ஒவ்வொருவர் / அவர்களை
  rationale: சட்ட மற்றும் உடன்படிக்கை உரைநடையில் נֶפֶשׁ என்பது உடலற்ற ‘ஆத்துமா’ என்பதைவிட ஒரு தனிநபரைக் குறிக்கிறது. தமிழில் பாலினத்தைச் சுட்டாத மனிதக் குறிப்பாக இச்சொற்கள் இயல்பாக உள்ளன.
- source_word: תַּעֲשֶׂה
  choice: செய்கிற
  rationale: עשה என்பது ‘செய்/உருவாக்கு’ என்ற பரந்த பொருளுடைய வினை; מְלָאכָה என்பதுடன் ‘வேலையைச் செய்’ என்பது இயல்பான தமிழ்ச் சேர்க்கை.
- source_word: כָּל מְלָאכָה
  choice: எந்த வேலையையும்
  rationale: כָּל என்பதன் முழுமையான தடையுணர்வை ‘எந்த ... ஐயும்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: இந்த நாளிலேயே
  rationale: עֶצֶם הַיּוֹם என்ற மரபுத்தொடரின் கால வலியுறுத்தலை ‘-லேயே’ தெளிவாகக் காட்டுகிறது.
- source_word: וְהַאֲבַדְתִּי
  choice: அழித்துவிடுவேன்
  rationale: אבד என்பதன் ஹிஃபில் வடிவம் ‘அழியச் செய்/அழித்துவிடு’ என்று பொருள்படும். மூலத்தில் כרת இல்லாததால், முதன்மை உரையில் ‘அறுத்துப்போடுவேன்’ போன்ற தொழில்நுட்பச் சொல்லைத் தவிர்க்கிறது.
- source_word: מִקֶּרֶב עַמָּהּ
  choice: அவர்களுடைய மக்களின் நடுவிலிருந்து
  rationale: இது சமூகத்தின் மத்தியிலிருந்து தீர்ப்பினால் நீக்கப்படுவதைக் குறிக்கும் வழக்குச் சொற்றொடர். נֶפֶשׁ உடன் இலக்கண ஒத்திசைவால் எபிரெயத்தில் பெண்பால் பின்னொட்டு வந்தாலும், தமிழ் மொழிபெயர்ப்பு பாலினம் சுட்டாத ஒருமை மரியாதை வடிவைப் பயன்படுத்துகிறது.
theological_decisions:
- issue: וְהַאֲבַדְתִּי ... מִקֶּרֶב עַמָּהּ கூறும் தண்டனையின் இயல்பு
  choice: அவர்களுடைய மக்களின் நடுவிலிருந்து அழித்துவிடுவேன்
  alternative: அவர்களுடைய மக்களின் நடுவிலிருந்து அகற்றிவிடுவேன்
  rationale: இங்கு எபிரெயம் ‘அழியச் செய்/அழி’ என்ற אבד வினையைப் பயன்படுத்துகிறது; ‘அறுத்துப்போடு’ என்று பொதுவாக மொழிபெயர்க்கப்படும் כרת வினையை அல்ல. ஆகவே அழிவின் வலிமையை முதன்மை உரை காக்கிறது; சமூகத்திலிருந்து நீக்குதல் என்ற சூழல்சார் புரிதல் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுமக்கள் எளிதில் புரிந்துகொள்ளக்கூடிய கண்ணியமான சட்டநடை பயன்படுத்தப்பட்டுள்ளது. ‘ஒவ்வொருவரையும் ... அவர்களுடைய’ என்ற பாலினம் சுட்டாத மரியாதை ஒருமை நடை இயல்பான தமிழுக்காகத் தேர்ந்தெடுக்கப்பட்டது; மூலத்தின் வலியுறுத்தல் ‘இந்த நாளிலேயே’ என்பதில் பாதுகாக்கப்பட்டுள்ளது.
