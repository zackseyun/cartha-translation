  source_fidelity: 'முதன்மை மொழிபெயர்ப்பு எபிரெய வாக்கியத்தின் அனைத்துக் கூறுகளையும் சரியாகக் கொண்டுள்ளது: எந்த வேலையையும் செய்வது, ‘இந்த நாளிலேயே’ என்ற வலியுறுத்தல், அழித்தல், மக்களுடைய நடுவிலிருந்து நீக்குதல். ஆனால் ‘ஒவ்வொருவரையும்’ என்பதற்குப் பின்னர் வரும் ‘அவர்களுடைய’ என்பது எண்ணிக்கையில் ஒத்திசைவற்றது; பகிர்நிலை உடைமை வடிவம் தேவைப்படுகிறது.'
