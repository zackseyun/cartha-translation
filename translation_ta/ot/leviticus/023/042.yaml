source:
  edition: WLC
  text: בַּ/סֻּכֹּ֥ת תֵּשְׁב֖וּ שִׁבְעַ֣ת יָמִ֑ים כָּל הָֽ/אֶזְרָח֙ בְּ/יִשְׂרָאֵ֔ל יֵשְׁב֖וּ בַּ/סֻּכֹּֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/042.yaml
  text: You shall dwell in booths for seven days[a]; every native-born person in Israel shall dwell in booths.
translation:
  language: ta
  text: ஏழு நாட்கள் நீங்கள் கூடாரங்களில்[a] குடியிருக்க வேண்டும்; இஸ்ரவேலில் பிறந்த ஒவ்வொருவரும் கூடாரங்களில் குடியிருக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தங்குமிடங்களில்’ அல்லது ‘தற்காலிகத் தங்குமிடங்களில்’; இங்குள்ள எபிரேயச் சொல் பண்டிகைக்காக அமைக்கப்படும் தற்காலிகக் கூடாரங்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּסֻּכֹּת
  choice: கூடாரங்களில்
  rationale: סֻכּוֹת என்பது இப்பண்டிகைக்காக அமைக்கப்படும் தற்காலிகத் தங்குமிடங்களைக் குறிக்கிறது. ‘கூடாரங்கள்’ என்பது தமிழில் இயல்பாகவும் தெளிவாகவும் இருந்து, மூலத்தின் கண்முன் நிற்கும் உருவகத்தையும் காக்கிறது; அதன் தற்காலிக இயல்பு அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: תֵּשְׁבוּ / יֵשְׁבוּ
  choice: குடியிருக்க வேண்டும்
  rationale: ישׁב என்பதன் அடிப்படைப் பொருள் ‘உட்கார்’ என்றாலும், இங்கு தங்கியிருத்தல் அல்லது வசித்தல் என்ற பொருளில் வருகிறது. ‘குடியிருக்க வேண்டும்’ என்பது ஏழு நாள் பண்டிகைக் காலத் தங்குதலை இயல்பான, கண்ணியமான தமிழில் தெரிவிக்கிறது; இரு இடங்களிலும் ஒரே வினைச்சொல் பயன்படுத்தப்பட்டுள்ளது.
- source_word: שִׁבְעַת יָמִים
  choice: ஏழு நாட்கள்
  rationale: கால அளவைக் குறிக்கும் எபிரேயச் சொற்றொடரைத் தமிழில் இயல்பாக நேரடியாகத் தருகிறது.
- source_word: כָּל הָאֶזְרָח
  choice: பிறந்த ஒவ்வொருவரும்
  rationale: אֶזְרָח என்பது அந்நியராகத் தங்கியிருப்பவருக்கு மாறாக, சமூகத்தில் இயல்பாகப் பிறந்து சேர்ந்தவரைக் குறிக்கிறது. ‘இஸ்ரவேலில் பிறந்த ஒவ்வொருவரும்’ என்பது பிற்கால அரசியல் ‘குடிமகன்’ என்ற கருத்தை இறக்குமதி செய்யாமல் பொதுவான நோக்கத்தைத் தெரிவிக்கிறது.
- source_word: בְּיִשְׂרָאֵל
  choice: இஸ்ரவேலில்
  rationale: கட்டளை பொருந்தும் இஸ்ரவேல் சமூகத்தை நேரடியாகக் குறிக்கிறது.
theological_decisions:
- issue: הָאֶזְרָח என்பதன் இலக்கண ஆண்பாலைத் தமிழில் எவ்வாறு பிரதிபலிப்பது
  choice: இஸ்ரவேலில் பிறந்த ஒவ்வொருவரும்
  alternative: இஸ்ரவேலில் பிறந்த ஒவ்வொரு ஆணும்
  rationale: எபிரேயச் சொல் இலக்கண ரீதியில் ஆண்பால் ஒருமையாக இருந்தாலும், இங்கு பிரதிநிதித்துவமான பொதுப் பொருளைக் கொண்டுள்ளது. ‘ஒவ்வொருவரும்’ என்பது தேவையற்ற ஆண்-மட்டும் என்ற வரம்பைச் சேர்க்காமல் மூலத்தின் பொதுவான நோக்கத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கட்டளை நடையைப் பயன்படுத்துகிறது. ‘குடியிருக்க வேண்டும்’ என்பது ישׁב என்பதன் இச்சூழலிலான வசித்தல்/தங்குதல் பொருளைத் தருகிறது. அடிக்குறிப்பு குறியீடு தொடர்புடைய முதல் ‘கூடாரங்களில்’ என்பதற்குப் பின்னர் வைக்கப்பட்டுள்ளது.
