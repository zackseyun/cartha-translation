source:
  edition: WLC
  text: בַּ/חֹ֣דֶשׁ הָ/רִאשׁ֗וֹן בְּ/אַרְבָּעָ֥ה עָשָׂ֛ר לַ/חֹ֖דֶשׁ בֵּ֣ין הָ/עַרְבָּ֑יִם פֶּ֖סַח לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/005.yaml
  text: In the first month[a], on the fourteenth day of the month, at twilight[b], is the Passover to Yahweh.
translation:
  language: ta
  text: முதலாம் மாதத்தில், மாதத்தின் பதினான்காம் நாளில், அந்தி வேளையில்[a], யாவேக்குரிய பஸ்கா ஆகும்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், “இரு மாலைகளுக்கு இடையில்”; இது சூரிய மறைவை ஒட்டிய அந்திப் பொழுதைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது “பஸ்காப் பலி” / “பஸ்காப் பலிப்பொருள்.”
    reason: alternative_reading
lexical_decisions:
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן
  choice: முதலாம் மாதத்தின்
  rationale: வழிபாட்டு ஆண்டின் முதல் மாதத்தைக் குறிக்கும் எபிரெய நாட்காட்டிச் சொற்றொடர்; நவீனத் தமிழில் இயல்பாகவும் துல்லியமாகவும் தரப்பட்டுள்ளது.
- source_word: בְּאַרְבָּעָה עָשָׂר לַחֹדֶשׁ
  choice: பதினான்காம் நாளில்
  rationale: மாதத்திற்குள் ஒரு தேதியைக் குறிக்கும் வழக்கமான எபிரெய அமைப்பு; தமிழில் ‘நாள்’ என்பதை வெளிப்படையாகச் சேர்ப்பது இயல்பானது.
- source_word: בֵּין הָעַרְבָּיִם
  choice: அந்தி சாயும் வேளையில்
  rationale: சொல்லுக்குச் சொல் ‘மாலைகளுக்கு இடையில்’ எனும் மரபுத்தொடர், சூரிய மறைவை ஒட்டிய அந்திப் பொழுதைக் குறிக்கிறது; நேரம் குறித்த மூலத்தின் நெகிழ்வை அடிக்குறிப்பு காக்கிறது.
- source_word: פֶּסַח
  choice: பஸ்கா
  rationale: இச்சொல் பண்டிகை அனுசரிப்பையும் பலி அல்லது பலிப்பொருளையும் குறிக்கக்கூடும். பரவலாக அறியப்பட்ட ‘பஸ்கா’ என்ற பெயர் மூலத்தின் பரந்த பொருளை மிகையாகக் குறுக்காமல் காக்கிறது.
- source_word: לַיהוָה
  choice: யாவேக்குரிய
  rationale: לְ முன்னொட்டு அர்ப்பணிப்பு அல்லது உரிமைத் தொடர்பைக் குறிக்கிறது; ‘யாவேக்குரிய’ என்பது ‘யாவேக்கு/யாவேக்காக’ என்ற சாத்தியங்களை இயல்பான தமிழில் உள்ளடக்குகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: யெகோவா
  rationale: மூலத்தில் உடன்படிக்கைக்குரிய தனிப்பெயரான நான்கு எழுத்து இறைப்பெயர் நேரடியாக உள்ளது; அதை பொதுப்பட்டமான ‘ஆண்டவர்’ என்று மாற்றாமல், ஏற்றுக்கொள்ளப்பட்ட ஒலிப்புமுறையான ‘யாவே’ எனத் தருகிறது.
- issue: வழிபாட்டுச் சூழலில் פֶּסַח என்பதன் பொருள்
  choice: பஸ்கா
  alternative: பஸ்காப் பலி / பஸ்காப் பலிப்பொருள்
  rationale: இந்தச் சொல் பண்டிகையையோ பலிச் சடங்கு அல்லது பலிப்பொருளையோ குறிக்கலாம். நியமிக்கப்பட்ட காலங்களின் பட்டியல் என்ற சூழலில் பிரதான உரை பரந்த பெயரை வைத்துக்கொண்டு, பலி சார்ந்த சாத்தியத்தை அடிக்குறிப்பில் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘அந்தி சாயும் வேளை’ பொதுவாசகருக்குப் புரியும் இயல்பான நேரக் குறிப்பு. ‘பஸ்கா’ என்ற மரபாக அறியப்பட்ட பெயர் பயன்படுத்தப்பட்டாலும், அதன் பலி சார்ந்த பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
