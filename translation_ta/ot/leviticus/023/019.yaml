id: LEV.23.19
reference: Leviticus 23:19
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/עֲשִׂיתֶ֛ם שְׂעִיר עִזִּ֥ים אֶחָ֖ד לְ/חַטָּ֑את וּ/שְׁנֵ֧י כְבָשִׂ֛ים בְּנֵ֥י שָׁנָ֖ה לְ/זֶ֥בַח שְׁלָמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/019.yaml
  text: And you shall offer one male goat for a sin offering[b][a], and two male lambs a year old for a sacrifice of peace offerings.
translation:
  language: ta
  text: நீங்கள் பாவநிவாரணப் பலியாக[a] ஒரு வெள்ளாட்டுக் கடாவையும், சமாதானப் பலியாக[b] ஒரு வயதுடைய இரண்டு செம்மறியாட்டுக் கடாக்களையும் செலுத்த வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தூய்மைப்படுத்தும் பலியாக.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “ஐக்கியப் பலியாக.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשִׂיתֶם
  choice: செலுத்த வேண்டும்
  rationale: வினைச்சொல்லின் அடிப்படைப் பொருள் ‘செய்தல்’ என்றாலும், பலிகளைப் பற்றிய இச்சூழலில் ‘பலியாகச் செலுத்துதல்’ என்பதே இயல்பான நவீனத் தமிழ்.
- source_word: שְׂעִיר עִזִּים אֶחָד
  choice: ஒரு வெள்ளாட்டுக் கடா
  rationale: ஆண் வெள்ளாடு என்ற பாலினக் குறிப்பையும் ‘ஒன்று’ என்ற எண்ணையும் தெளிவாகத் தக்கவைக்கிறது.
- source_word: לְחַטָּאת
  choice: பாவநிவாரணப் பலியாக
  rationale: லேவியராகமப் பலிச்சட்டங்களில் இது ஒரு குறிப்பிட்ட பலிவகையைக் குறிக்கிறது. தமிழில் மரபாகப் புரிந்துகொள்ளப்படும் சொல்லாட்சி பயன்படுத்தப்பட்டு, தூய்மைப்படுத்தும் செயல்பாட்டை வலியுறுத்தும் மாற்று மொழிபெயர்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וּשְׁנֵי כְבָשִׂים
  choice: இரண்டு செம்மறியாட்டுக் கடாக்கள்
  rationale: எண்ணிக்கையையும், இச்சூழலில் குறிக்கப்படும் ஆண் செம்மறியாடுகளையும் வெளிப்படையாகக் காட்டுகிறது.
- source_word: בְּנֵי שָׁנָה
  choice: ஒரு வயதான
  rationale: விலங்குகள் ஒரு வயதுடையவை என்பதைக் குறிக்கும் எபிரேய மரபுத்தொடரை இயல்பான தமிழில் வழங்குகிறது.
- source_word: לְזֶבַח שְׁלָמִים
  choice: சமாதானப் பலிகளாக
  rationale: שְׁלָמִים என்பதன் பன்மையைத் தக்கவைத்தபடி, பலிவகையின் பெயரை மூலச்சொல்லுக்கு நெருக்கமாக வழங்குகிறது.
theological_decisions:
- issue: חטאת என்ற பலிவகையின் மொழிபெயர்ப்பு
  choice: பாவநிவாரணப் பலி
  alternative: தூய்மைப்படுத்தும் பலி
  rationale: முதன்மைத் தெரிவு தமிழில் அறியப்பட்ட பலிவகைப் பெயராக உள்ளது; இதன் தூய்மைப்படுத்தும் செயல்பாட்டை முன்னிறுத்தும் ஆய்வுசார் மாற்றை அடிக்குறிப்பு பாதுகாக்கிறது.
- issue: שְׁלָמִים என்ற பலிவகையின் மொழிபெயர்ப்பு
  choice: சமாதானப் பலிகள்
  alternative: உறவுறவுப் பலிகள்
  rationale: ‘சமாதானம்’ என்பது மூலச்சொல்லுக்கு நெருக்கமாகவும் பரவலாக அறியப்பட்டதாகவும் உள்ளது. ‘உறவுறவு’ என்பது பலியில் பங்குபெறும் ஐக்கியத்தை விளக்கும் பொருளாக்கம் என்பதால் மாற்றாகக் குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டவிதிக்குரிய கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. பலிவகைகளுக்கான பரிச்சயமான சொற்கள் முதன்மை உரையில் வைக்கப்பட்டு, உண்மையான சொற்பொருள் மற்றும் இறையியல் மாற்றுகள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
