base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/021.yaml
  text: And on that very day you shall proclaim a holy convocation[a]; you shall do no laborious work[c][b]. It is a permanent statute throughout your dwellings for your generations.
translation:
  language: ta
  text: அந்த நாளிலேயே நீங்கள் ஒரு பரிசுத்தக் கூட்டத்தை[a] அறிவிக்க வேண்டும். உழைப்புக்குரிய எந்த வேலையையும் செய்யக் கூடாது[b]. நீங்கள் குடியிருக்கும் இடங்களிலெல்லாம், தலைமுறைதோறும் இது நிலையான நியமமாக இருக்க வேண்டும்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஒரு புனிதக் கூட்டம்’ அல்லது ‘ஒரு பரிசுத்தச் சபைக்கூடல்.’
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், ‘உழைப்பு/பணிக்குரிய எந்த வேலையும்’; அதாவது, வழக்கமான உழைப்பு அல்லது பணிசார் வேலை.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘என்றென்றும் நிலைக்கும் நியமம்’ அல்லது ‘தொடர்ந்து கடைப்பிடிக்க வேண்டிய நியமம்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וּקְרָאתֶם
  choice: நீங்கள் ... அறிவிக்க வேண்டும்
  rationale: קרא என்பது இச்சடங்குச் சூழலில் ஒரு நாளையோ கூடுகையையோ அதிகாரப்பூர்வமாக அறிவிப்பதைக் குறிக்கிறது; வெறுமனே ‘அழைப்பது’ என்பதைவிட ‘அறிவிப்பது’ பொதுமக்களுக்கு இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: அந்த நாளிலேயே
  rationale: עֶצֶם அந்தக் குறிப்பிட்ட நாளையே வலியுறுத்துகிறது. ‘-இலேயே’ என்ற வடிவம் அந்தத் துல்லியமான கால வலியுறுத்தலை இயல்பான தமிழில் காக்கிறது.
- source_word: מִקְרָא קֹדֶשׁ
  choice: ஒரு பரிசுத்தக் கூடுகை
  rationale: இது முறையாக அழைத்துக் கூட்டப்படும் புனிதக் கூட்டத்தைக் குறிக்கும் நிலையான வழிபாட்டுச் சொற்றொடர். ‘பரிசுத்தக் கூடுகை’ அதன் சமயச் சிறப்பையும் கூட்டத்தின் தன்மையையும் காக்கிறது.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: உழைப்புக்குரிய எந்த வேலையும்
  rationale: இந்த எபிரெயச் சொற்றொடர் எந்தச் செயலையும் முற்றாகத் தடை செய்வதைவிட வழக்கமான உழைப்பு அல்லது பணிசார் வேலையைச் சுட்டுகிறது. தமிழ் வடிவம் அந்த வரம்பைக் காக்கிறது.
- source_word: חֻקַּת עוֹלָם
  choice: நிலையான நியமம்
  rationale: சட்டச் சூத்திரத்தில் עוֹלָם நீடித்து நிலைக்கும் தன்மையைச் சொல்கிறது. ‘நிலையான’ என்பது தேவையற்ற தத்துவ விளக்கமின்றி அந்தச் சட்டப் பொருளைத் தருகிறது.
- source_word: בְּכָל מוֹשְׁבֹתֵיכֶם לְדֹרֹתֵיכֶם
  choice: நீங்கள் குடியிருக்கும் இடங்களிலெல்லாம், தலைமுறைதோறும்
  rationale: முதல் சொற்றொடர் எல்லாக் குடியிருப்பிடங்களையும், இரண்டாவது தொடர்ச்சியான தலைமுறைகளையும் குறிக்கிறது; தேர்ந்த தமிழ் வடிவம் இடம் மற்றும் காலம் ஆகிய இரு பரப்புகளையும் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: விழா நாளில் வேலைத் தடையின் வரம்பு
  choice: ‘உழைப்புக்குரிய எந்த வேலையையும் செய்யக் கூடாது’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘எந்த வேலையையும் செய்யக் கூடாது’
  rationale: כָּל מְלֶאכֶת עֲבֹדָה என்பது பொதுவாக வழக்கமான அல்லது பணிசார் உழைப்பைக் குறிக்கிறது. ‘எந்த வேலையும்’ என்று மட்டும் கூறினால் மூலத்தில் உள்ளதைவிட விரிவான, ஓய்வுநாள் போன்ற முழுத் தடையை வாசகர் புரிந்துகொள்ளக்கூடும்.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் dignified சட்ட-வழிபாட்டு நடையைப் பயன்படுத்துகிறது. ‘பரிசுத்தம்’ மற்றும் ‘நியமம்’ போன்ற பழக்கமான வேதாகமச் சொற்கள் தக்கவைக்கப்பட்டாலும், வாக்கிய அமைப்பு இயல்பான தற்போதைய தமிழில் உள்ளது.
