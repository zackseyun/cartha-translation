  text: You shall do no work[b][a]. It is a permanent statute throughout your generations in all your dwelling places.
translation:
  language: ta
  text: நீங்கள் எந்த வேலையும் செய்யக்கூடாது. இது உங்கள் தலைமுறைகள்தோறும், நீங்கள் வாழும் எல்லா இடங்களிலும்[b] நிலையான சட்டமாகும்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘என்றென்றும் உள்ள சட்டம்’ / ‘நிரந்தரமான சட்டம்.’ எபிரெய மொழியிலுள்ள חֻקַּת עוֹלָם என்ற சொற்றொடர் நீடித்த அல்லது இடையறாத காலத்தைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘உங்கள் குடியிருப்புகள் அனைத்திலும்’ / ‘நீங்கள் எங்கு வாழ்ந்தாலும்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל מְלָאכָה לֹא תַעֲשׂוּ
  choice: நீங்கள் எந்த வேலையும் செய்யக்கூடாது
  rationale: כָּל מְלָאכָה என்பதுடன் வரும் மறுப்பு, எல்லா வகையான வேலையையும் விலக்கும் பொருளைத் தருகிறது. ‘எந்த வேலையும் செய்யக்கூடாது’ என்பது அந்த முழுமையான தடையை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; மூலத்தில் இல்லாத கூடுதல் வலியுறுத்தலைச் சேர்ப்பதில்லை.
- source_word: חֻקַּת עוֹלָם
  choice: நிலையான சட்டம்
  rationale: חֻקָּה என்பது கட்டுப்படுத்தும் சட்டம் அல்லது நியமம்; עוֹלָם நீடித்த அல்லது நிரந்தர காலத்தைக் குறிக்கலாம். ‘நிலையான சட்டம்’ சட்டத் தன்மையையும் நீடித்த செல்லுபடியையும் காக்கிறது; காலத்தின் துல்லிய எல்லையைத் தேவையின்றி முடிவுசெய்வதில்லை.
- source_word: לְדֹרֹתֵיכֶם
  choice: உங்கள் தலைமுறைகள்தோறும்
  rationale: அடுத்தடுத்து வரும் தலைமுறைகள் முழுவதிலும் தொடரும் பொருந்துதலைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: בְּכֹל מֹשְׁבֹתֵיכֶם
  choice: நீங்கள் குடியிருக்கும் எல்லா இடங்களிலும்
  rationale: מוֹשָׁב என்பது குடியிருக்கும் இடம் அல்லது குடியிருப்பு என்பதைக் குறிக்கிறது. இந்தத் தேர்வு இடவியல் பரப்பை தெளிவான நவீனத் தமிழில் தருகிறது.
theological_decisions:
- issue: வழிபாட்டுச் சட்டத்தில் עוֹלָם குறிக்கும் காலநீட்சி
  choice: நிலையான சட்டம்
  alternative: என்றென்றும் உள்ள சட்டம் / நிரந்தரமான சட்டம்
  rationale: எபிரெயச் சொல் நீடித்த, தொடர்ச்சியான அல்லது நிரந்தரமான செல்லுபடியைக் குறிக்கக்கூடும். ‘நிலையான’ என்பது அதன் சட்டரீதியான தீவிரத்தைத் தக்கவைத்தபடியே, அது தத்துவார்த்தமாக முடிவில்லாத காலத்தைக் கட்டாயம் குறிக்கிறது என்று மொழிபெயர்ப்பில் முன்கூட்டியே தீர்மானிப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. முதல் வாக்கியத்தில் சட்டத் தடையின் நேரடித்தன்மையும், இரண்டாவது வாக்கியத்தில் சட்டரீதியான பாங்கும் பாதுகாக்கப்பட்டுள்ளன. மூல எபிரெயத்தில் வினையில்லாத சட்டச் சொற்றொடர் தமிழில் இயல்பாக இருக்க ‘கடைப்பிடிக்க வேண்டிய’ என வெளிப்படுத்தப்பட்டுள்ளது.
