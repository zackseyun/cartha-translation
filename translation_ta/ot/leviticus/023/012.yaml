source:
  edition: WLC
  text: וַ/עֲשִׂיתֶ֕ם בְּ/י֥וֹם הֲנִֽיפְ/כֶ֖ם אֶת הָ/עֹ֑מֶר כֶּ֣בֶשׂ תָּמִ֧ים בֶּן שְׁנָת֛/וֹ לְ/עֹלָ֖ה לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/012.yaml
  text: On the day you wave the sheaf[a], you shall offer a male lamb without blemish, a year old, as a burnt offering to Yahweh.
translation:
  language: ta
  text: நீங்கள் அந்தக் கதிர்க்கட்டையை[a] அசைத்துக் காண்பிக்கும் நாளில், குறைபாடற்ற, ஒரு வயதான ஆண் ஆட்டுக்குட்டியை யாவேக்கு எரிபலியாகச் செலுத்த வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கதிர்க்கட்டை” என்பதற்கு மாற்றாக, “ஓமெர்” என்றும் மொழிபெயர்க்கலாம். இங்கு இச்சொல் வெறும் உலர் அளவையல்லாமல், காணிக்கைச் சடங்கில் அசைத்துக் காண்பிக்கப்படும் கதிர்க்கட்டைக் குறிக்க வாய்ப்பு அதிகம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשִׂיתֶם
  choice: செலுத்த வேண்டும்
  rationale: עשה என்பது பொதுவாக ‘செய்/உருவாக்கு’ என்று பொருள்படும்; பலியிடும் சூழலில் பலியைச் செலுத்துவதைக் குறிக்கும் மரபுத்தொடராகப் பயன்படுவதால், தமிழில் இயல்பாக ‘செலுத்த வேண்டும்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: בְּיוֹם
  choice: நாளில்
  rationale: குறிப்பிட்ட சடங்கு நடைபெறும் நாளையே காலக் குறிப்பாக இயல்பாகச் சுட்டுகிறது.
- source_word: הֲנִיפְכֶם
  choice: அசைத்துக் காண்பிக்கும்
  rationale: נוף என்பதன் ஹிஃபில் வடிவம் யாவே முன்னிலையில் செய்யப்படும் சடங்கான அசைத்தலைக் குறிக்கிறது. வெறும் உடல் அசைவு எனப் புரியாமல், காணிக்கையாகக் காட்டும் சடங்குச் செயலைத் தெளிவுபடுத்துகிறது.
- source_word: הָעֹמֶר
  choice: அந்தக் கதிர்க்கட்டை
  rationale: அறுவடைச் சூழலில் עֹמֶר என்பது வெறும் உலர் அளவையல்ல, சடங்கில் கொண்டுவரப்படும் கதிர்க்கட்டைக் குறிக்கிறது; குறிப்பிட்ட முன்னைய சடங்குப் பொருளைச் சுட்டுவதால் ‘அந்த’ சேர்க்கப்பட்டது.
- source_word: כֶּבֶשׂ
  choice: ஓர் ஆட்டுக்குட்டி
  rationale: כֶּבֶשׂ ஓர் இளம் ஆட்டைக் குறிக்கிறது; எபிரெயச் சொல்லின் இலக்கணப் பாலையும் பலிச்சூழலையும் தமிழில் தனியாக ‘ஆண்’ என்று சேர்க்காமல் இயல்பாகக் கூறலாம்.
- source_word: תָּמִים
  choice: பழுதற்ற
  rationale: பலிக்கான விலங்கு எந்த உடற்குறையோ பழுதோ இல்லாததாக இருக்க வேண்டும் என்பதே இச்சூழலில் תמים என்பதன் துல்லியமான பொருள்.
- source_word: בֶּן שְׁנָתוֹ
  choice: ஓராண்டான
  rationale: விலங்கின் வயதைக் குறிக்கும் எபிரெய மரபுத்தொடரைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது; இது ‘முதல் ஆண்டில் உள்ளது’ என்றும் புரிந்துகொள்ளப்படலாம்.
- source_word: לְעֹלָה
  choice: எரிபலியாக
  rationale: עֹלָה என்பது முழுவதும் எரிக்கப்படும் பலியின் தொழில்நுட்பப் பெயர்; ‘எரிபலி’ தமிழில் தெளிவான சடங்குச் சொல்.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: יהוה என்ற உடன்படிக்கைப் பெயர் மறைக்கப்படாமல் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டது; לְ முன்னொட்டு பலி அவருக்குச் செலுத்தப்படுவதைச் சுட்டுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர் / யெகோவா
  rationale: மூலத்தில் நான்கு எழுத்து இறைப்பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டப்பெயராக மாற்றாமல், பரவலாக ஏற்கப்படும் ஒலிப்பைத் தமிழில் ‘யாவே’ எனத் தருவது உடன்படிக்கைப் பெயரைப் பாதுகாக்கிறது.
- issue: עֹמֶר என்பது கட்டா அல்லது அளவையா
  choice: கதிர்க்கட்டு
  alternative: ஓமெர் / அளவை
  rationale: இப்பகுதியின் அறுவடை மற்றும் அசைத்துக் காண்பிக்கும் சடங்குச் சூழல், அளவைக் காட்டிலும் கதிர்க்கட்டையே முதன்மையாகக் குறிக்கிறது; சொல்லின் மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டக் கட்டளையின் கண்ணியமான தொனியைப் பேணும் வகையில் எழுதப்பட்டது. ‘அசைத்துக் காண்பிக்கும்’ என்பது சடங்குச் செயலை சாதாரண வாசகருக்குத் தெளிவாக்குகிறது; ‘எரிபலி’ தொழில்நுட்பச் சொல்லாகப் பாதுகாக்கப்பட்டுள்ளது.
