  text: וְ/חַגֹּתֶ֤ם אֹת/וֹ֙ חַ֣ג לַֽ/יהוָ֔ה שִׁבְעַ֥ת יָמִ֖ים בַּ/שָּׁנָ֑ה חֻקַּ֤ת עוֹלָם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם בַּ/חֹ֥דֶשׁ הַ/שְּׁבִיעִ֖י תָּחֹ֥גּוּ אֹתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/041.yaml
  text: You shall celebrate it as a feast to Yahweh for seven days in the year[a]. It is a permanent statute throughout your generations[b]; in the seventh month you shall celebrate it.
translation:
  language: ta
  text: ஆண்டுதோறும் ஏழு நாட்கள் அதை யாவேவுக்காகப் பண்டிகையாகக் கொண்டாடுங்கள். இது உங்களுக்குத் தலைமுறைதோறும் நிலையான நியமம்[a]. ஏழாம் மாதத்தில் அதைக் கொண்டாடுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘என்றென்றைக்குமான நியமம்’ அல்லது ‘நிரந்தரமான நியமம்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחַגֹּתֶם / תָּחֹגּוּ
  choice: கொண்டாடுங்கள்
  rationale: חָגַג என்பது ஒரு பண்டிகையை, குறிப்பாக யாத்திரைப் பண்டிகையை, அனுசரித்துக் கொண்டாடுவதைக் குறிக்கிறது. இரு இடங்களிலும் ஒரே இயல்பான தமிழ் வினைச்சொல் பயன்படுத்தப்பட்டுள்ளது.
- source_word: אֹתוֹ
  choice: அதை / அதைக்
  rationale: இந்தச் சுட்டுப்பெயர் முன்சூழலில் கூறப்பட்ட பண்டிகையைக் குறிக்கிறது; மூலத்தில் இல்லாத பெயர்ச்சொல்லைச் சேர்க்காமல் தமிழ் இயல்புக்கு ஏற்றவாறு மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: חַג
  choice: பண்டிகை
  rationale: இச்சொல் சமய விழாவை அல்லது யாத்திரை விழாவைக் குறிக்கிறது. நவீனத் தமிழில் ‘பண்டிகை’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: לַיהוָה
  choice: யெகோவாவுக்குரிய
  rationale: לְ இங்கு அர்ப்பணிப்பு அல்லது மரியாதைக்குரிய நோக்கத்தைக் குறிக்கிறது. ‘யெகோவாவுக்குரிய பண்டிகை’ என்பது அந்தப் பண்டிகை அவருக்காகவும் அவரை மகிமைப்படுத்தும் விதமாகவும் கொண்டாடப்படுவதை இயல்பாகத் தெரிவிக்கிறது.
- source_word: שִׁבְעַת יָמִים בַּשָּׁנָה
  choice: ஆண்டுதோறும் ஏழு நாட்கள்
  rationale: சொல்லுக்கு சொல் ‘ஆண்டில் ஏழு நாட்கள்’ என்றாலும், ஆண்டுதோறும் நடைபெறும் அனுசரிப்பே சூழலின் பொருள். தமிழில் ‘ஆண்டுதோறும்’ அதனைத் தெளிவாகச் சொல்கிறது.
- source_word: חֻקַּת עוֹלָם
  choice: நிலையான நியமம்
  rationale: חֻקָּה கட்டளையிடப்பட்ட நியமத்தையும் עוֹלָם தொடர்ந்த நிலைப்பையும் குறிக்கின்றன. ‘நிலையான’ என்பது முழுமையான காலமற்ற தன்மையைத் தேவையின்றி வரையறுக்காமல் தொடரும் கட்டுப்பாட்டைத் தக்கவைக்கிறது.
- source_word: לְדֹרֹתֵיכֶם
  choice: தலைமுறைதோறும் உங்களுக்கு
  rationale: அடுத்தடுத்த தலைமுறைகளுக்கும் இந்த நியமம் பொருந்துவதை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי
  choice: ஏழாம் மாதத்தில்
  rationale: பண்டிகை அனுசரிக்கப்பட வேண்டிய காலத்தை நேரடியாகக் குறிப்பிடும் சொற்றொடர்.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: யாவே
  rationale: எபிரேய மூலத்தில் நான்கு எழுத்துகளைக் கொண்ட இறைப் பெயர் நேரடியாக வருகிறது. தமிழ்க் கிறிஸ்தவப் பயன்பாட்டில் பரவலாக அறியப்பட்ட தனிப்பெயர் வடிவமான ‘யெகோவா’ பயன்படுத்தப்பட்டுள்ளது; பொதுப்பட்டமான ‘கர்த்தர்’ என்று மாற்றப்படவில்லை.
- issue: עוֹלָם என்பதன் வலிமை
  choice: நிலையான
  alternative: என்றென்றைக்குமான / நிரந்தரமான
  rationale: வழிபாட்டு நியமச் சூழலில் இச்சொல் தலைமுறைகளைக் கடந்து தொடரும் கட்டுப்பாட்டைக் குறிக்கிறது; தத்துவ ரீதியான முடிவில்லா காலத்தைத் தமிழில் அதிகமாக வலியுறுத்தாமல் மூலத்தின் பரப்பைத் தக்கவைக்க ‘நிலையான’ தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கட்டளைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரேய வசனத்தின் தொடக்கமும் முடிவும் கொண்டுள்ள ‘கொண்டாடுதல்’ என்ற மீளுரைத்தல் தக்கவைக்கப்பட்டுள்ளது.
