  text: דַּבֵּ֛ר אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר בַּ/חֹ֨דֶשׁ הַ/שְּׁבִיעִ֜י בְּ/אֶחָ֣ד לַ/חֹ֗דֶשׁ יִהְיֶ֤ה לָ/כֶם֙ שַׁבָּת֔וֹן זִכְר֥וֹן תְּרוּעָ֖ה מִקְרָא קֹֽדֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/024.yaml
  text: 'Speak to the sons of Israel[a], saying: In the seventh month, on the first day of the month, there shall be for you a solemn rest, a memorial of trumpet blasts, a holy convocation.'
translation:
  language: ta
  text: '“இஸ்ரவேலின் மக்களிடம்[a] நீ சொல்ல வேண்டியது: ‘ஏழாம் மாதத்தில், மாதத்தின் முதல் நாளில், உங்களுக்கு ஒரு சிறப்பான ஓய்வாகவும், பேரொலியின்[b] நினைவாகவும், பரிசுத்தக் கூட்டமாகவும் இருக்க வேண்டும்.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லர்த்தமாக, “இஸ்ரவேலின் மகன்கள்”; இத்தொடர் இங்கு இஸ்ரவேல் உடன்படிக்கைச் சமூகத்தைக் கூட்டாகக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரேயச் சொல் உயர்த்தப்படும் உரத்த ஒலியைக் குறிக்கும்; அது ஆரவாரம், போர்க்குரல், அல்லது கொம்பு/எக்காள முழக்கத்தையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மக்கள்
  rationale: எபிரேய மரபுத்தொடர் சொல்லர்த்தமாக ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், உடன்படிக்கைச் சமூகமெங்கையும் கூட்டாகக் குறிக்கிறது; நவீனத் தமிழில் ‘இஸ்ரவேலின் மக்கள்’ இயல்பாகவும் உள்ளடக்கமாகவும் உள்ளது.
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי
  choice: ஏழாம் மாதத்தில்
  rationale: காலத்தைக் குறிக்கும் எபிரேய முன்னிடைச்சொல்லையும் வரிசை எண்ணையும் நேரடியாகக் காட்டுகிறது.
- source_word: בְּאֶחָד לַחֹדֶשׁ
  choice: அந்த மாதத்தின் முதல் நாளில்
  rationale: சொல்லர்த்தமாக ‘மாதத்தின் ஒன்றில்’ எனும் எபிரேய நாள்காட்டி மரபுத்தொடரின் இயல்பான தமிழாக்கம்.
- source_word: יִהְיֶה לָכֶם
  choice: உங்களுக்கு ... இருக்க வேண்டும்
  rationale: எதிர்கால/விதிப்பொருளையும் ‘உங்களுக்காக’ என்ற உறவையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: שַׁבָּתוֹן
  choice: ஓய்வுநாள்
  rationale: வழக்கமான வேலையை நிறுத்திக் கடைப்பிடிக்கும் சிறப்பு ஓய்வைக் குறிக்கிறது; சூழலில் ஒரு நாளைக் குறிப்பதால் தமிழில் தெளிவாக உள்ளது.
- source_word: זִכְרוֹן תְּרוּעָה
  choice: பேரொலி எழுப்பி நினைவுகூரும் நாள்
  rationale: இணைப்பின் துல்லிய உறவு தெளிவில்லாததையும் תְּרוּעָה என்பது கூச்சல், ஆரவாரம் அல்லது கொம்பு/எக்காள முழக்கம் ஆகக்கூடிய பரந்த சொல்லாக இருப்பதையும் தேவையின்றி சுருக்காமல் வைத்திருக்கிறது.
- source_word: מִקְרָא קֹדֶשׁ
  choice: பரிசுத்தக் கூடுகை
  rationale: பரிசுத்தமாக அறிவிக்கப்பட்டு அழைக்கப்படும் வழிபாட்டுக் கூட்டத்தைக் குறிக்கும் நிலையான திருவழிபாட்டு தொடராகப் பொருந்துகிறது.
theological_decisions:
- issue: תְּרוּעָה என்பதன் ஒலி வகை
  choice: பேரொலி
  alternative: எக்காள முழக்கம் / கொம்பு முழக்கம் / ஆரவாரம்
  rationale: மூலச்சொல் ஒரு குறிப்பிட்ட இசைக்கருவியை வெளிப்படையாகச் சொல்லவில்லை. ஆகவே பொதுவான ஒலிப்பொருளை முதன்மை உரையில் வைத்து, சாத்தியமான வகைகளை அடிக்குறிப்பில் தருவது உண்மையான சொற்பொருள் தெளிவின்மையைப் பாதுகாக்கிறது.
- issue: זִכְרוֹן תְּרוּעָה என்ற தொடரின் உறவு
  choice: பேரொலி எழுப்பி நினைவுகூரும் நாள்
  alternative: பேரொலியின் நினைவுச்சின்னம் / நினைவூட்டும் பேரொலி
  rationale: பெயர்ச்சொல் இணைப்பு பலவாறு புரிந்துகொள்ளப்படலாம். தமிழில் வாசிக்கத்தக்க வடிவம் தேர்ந்தெடுக்கப்பட்டாலும், அது கடவுளை நினைவூட்டுகிறதா, மக்கள் நினைவுகூருகிறார்களா, அல்லது நினைவுநாள் என்பதா என்பதை உரை நிர்ணயிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டமும் திருவழிபாடும் சார்ந்த கண்ணியமான நடையைப் பயன்படுத்துகிறது. ஆனால் அடிக்குறிப்பு [b] முதன்மை உரையில் குறிக்கப்படாததால், வெளியீட்டுக்கு முன் ‘பேரொலி[b]’ எனச் சீர்செய்ய வேண்டும்.
