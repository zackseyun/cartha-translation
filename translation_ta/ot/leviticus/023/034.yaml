source:
  edition: WLC
  text: דַּבֵּ֛ר אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר בַּ/חֲמִשָּׁ֨ה עָשָׂ֜ר י֗וֹם לַ/חֹ֤דֶשׁ הַ/שְּׁבִיעִי֙ הַ/זֶּ֔ה חַ֧ג הַ/סֻּכּ֛וֹת שִׁבְעַ֥ת יָמִ֖ים לַ/יהֹוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/034.yaml
  text: 'Speak to the sons of Israel[a], saying: On the fifteenth day of this seventh month is the Feast of Booths for seven days to Yahweh.'
translation:
  language: ta
  text: '“இஸ்ரவேல் மக்களிடம் இப்படிச் சொல்: ‘இந்த ஏழாம் மாதத்தின் பதினைந்தாம் நாளில் யாவேவுக்கான குடில்களின் பண்டிகை ஏழு நாட்கள் நடைபெறும்.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דַּבֵּר אֶל־בְּנֵי יִשְׂרָאֵל לֵאמֹר
  choice: இஸ்ரவேல் மக்களிடம் நீ பேசிச் சொல்
  rationale: எபிரெய மொழியின் கட்டளைத் தொனியையும் மேற்கோளை அறிமுகப்படுத்தும் அமைப்பையும் காக்கிறது. בְּנֵי יִשְׂרָאֵל என்பதன் சொற்பொருள் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு உடன்படிக்கை மக்களை ஒட்டுமொத்தமாகக் குறிக்கிறது; நவீன தமிழில் இயல்பாகவும் துல்லியமாகவும் ‘இஸ்ரவேல் மக்கள்’ என வழங்கப்பட்டது.
- source_word: בַּחֲמִשָּׁה עָשָׂר יוֹם לַחֹדֶשׁ הַשְּׁבִיעִי הַזֶּה
  choice: இந்த ஏழாம் மாதத்தின் பதினைந்தாம் நாளில்
  rationale: எபிரெய நாள்காட்டிக் குறிப்பின் முழுத் துல்லியத்தையும் ‘இந்த’ என்ற சுட்டையும் இயல்பான தமிழ் சொல் வரிசையில் காக்கிறது.
- source_word: חַג הַסֻּכּוֹת
  choice: குடில்களின் பண்டிகை
  rationale: סֻכּוֹת என்பது தற்காலிகமாக அமைக்கப்படும் குடில்களைக் குறிக்கிறது. ‘குடில்கள்’ அதன் நேரடியான பொருளை நவீன வாசகர்களுக்குத் தெளிவாக்குகிறது; மரபான பெயர் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: שִׁבְעַת יָמִים
  choice: ஏழு நாட்கள்
  rationale: பண்டிகையின் கால அளவை எளிமையாகவும் நேரடியாகவும் தெரிவிக்கிறது.
- source_word: לַיהוָה
  choice: யாவேவுக்காக
  rationale: לְ என்ற முன்னொட்டு இங்கு பண்டிகை யாவேவுக்கு அர்ப்பணிக்கப்பட்டது அல்லது அவருக்காகக் கொண்டாடப்பட்டது என்பதைக் குறிக்கிறது. ‘யாவேவுக்காக’ என்பது தமிழில் இயல்பாக அந்த உறவை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் உடன்படிக்கைப் பெயரான நான்கெழுத்து இறைப் பெயர் நேரடியாக உள்ளது. அதை பொதுப்பட்டமாக மாற்றாமல், தமிழில் அறியப்பட்ட ஒலிபெயர்ப்பான ‘யாவே’ என வழங்குவது மூலத்தின் தனிப்பெயர் தன்மையைப் பாதுகாக்கிறது.
- issue: סֻכּוֹת பண்டிகையின் பெயர்
  choice: குடில்களின் பண்டிகை
  alternative: கூடாரப் பண்டிகை
  rationale: மூலச் சொல் தற்காலிகக் குடில்கள் அல்லது தங்குமிடங்களைக் குறிக்கிறது. முக்கிய உரை அதன் வெளிப்படையான பொருளைக் காட்டுகிறது; வாசகர்களுக்குப் பழக்கமான மரபுப் பெயர் அடிக்குறிப்பில் வைக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க தமிழ் பயன்படுத்தப்பட்டுள்ளது. சட்டவிதி அறிவிப்பின் கட்டளைத் தொனி காக்கப்பட்டாலும், சொல் வரிசை சாதாரண வாசகர்களுக்குப் புரியும் வகையில் இயல்பாக்கப்பட்டுள்ளது.
