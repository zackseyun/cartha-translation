lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பேசிச் சொன்னார்
  rationale: דבר என்ற வினை புதிய உரைநிகழ்வை அறிமுகப்படுத்துகிறது. அதைத் தொடர்ந்து வரும் לֵאמֹר என்பதையும் இயல்பான தமிழில் இணைத்துக் காட்டுவதற்காக இச்சொற்றொடர் தேர்ந்தெடுக்கப்பட்டது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மெய்யெழுத்துப் பெயரான YHWH-ஐ ஒரு பட்டத்தால் மாற்றாமல், பொதுவாக ஏற்கப்படும் உச்சரிப்பு வடிவில் தனிப்பெயராக வழங்குகிறது.
- source_word: אֶל
  choice: -யிடம்
  rationale: பேச்சு யாரை நோக்கிச் சொல்லப்பட்டது என்பதைக் குறிக்கும் எபிரெய முன்னிடைச்சொல்லுக்கு இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: מֹשֶׁה
  choice: மோசே
  rationale: משה என்ற பெயரின் தமிழில் நிலைபெற்ற வடிவம்.
- source_word: לֵאמֹר
  choice: சொன்னார்
  rationale: அடுத்து வரும் உரையின் உள்ளடக்கத்தை அறிமுகப்படுத்தும் எபிரெய வாய்பாட்டை, דבר உடன் இணைத்து வாசிக்க இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: யெகோவா
  rationale: மூலவசனம் YHWH என்ற தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. ஆகவே அதை ‘ஆண்டவர்’ போன்ற பட்டமாக மாற்றாமல் தனிப்பெயராகவே வைத்துள்ளோம்; பாரம்பரிய மாற்று வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன, மரியாதைமிக்க, எளிதில் புரியும் தமிழ். எபிரெய உரைஅறிமுக வாய்பாட்டின் இரு கூறுகளையும் காக்கும் வகையில் ‘பேசிச் சொன்னார்’ என இயல்பாக இணைக்கப்பட்டுள்ளது.
