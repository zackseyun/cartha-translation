base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/043.yaml
  text: so that your generations may know that I made the sons of Israel dwell in booths when I brought them out of the land of Egypt[b][a]. I am Yahweh your God.
translation:
  language: ta
  text: உங்கள் தலைமுறையினர், நான் இஸ்ரவேல் மக்களை[a] எகிப்து நாட்டிலிருந்து வெளியே கொண்டுவந்தபோது அவர்களைக் குடில்களில்[b] குடியிருக்கச் செய்தேன் என்பதை அறியும்படியாக. நான் உங்கள் கடவுளாகிய யாவே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லர்த்தமாக, ‘இஸ்ரவேலின் மகன்களை’; இங்கு இந்தச் சொற்றொடர் இஸ்ரவேல் மக்களை மொத்தமாகக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘தற்காலிகத் தங்குமிடங்களில்.’ எபிரெயச் சொல்லான சுக்கோத் தற்காலிகக் குடில்கள் அல்லது நிழற்பந்தல்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן יֵדְעוּ
  choice: அறிந்துகொள்வதற்காகவே
  rationale: לְמַעַן அறிமுகப்படுத்தும் நோக்கத்தையும், அதைத் தொடர்ந்து வரும் வினைச்சொல்லின் எதிர்பார்க்கப்பட்ட விளைவையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: דֹרֹתֵיכֶם
  choice: உங்கள் தலைமுறையினர்
  rationale: பல தலைமுறைகளாகத் தொடரும் உடன்படிக்கைச் சூழலைக் காக்கிறது; ‘உங்கள் சந்ததியினர்’ என்பதைவிட எபிரெயச் சொல்லின் தலைமுறை சார்ந்த பொருளுக்கு நெருக்கமானது.
- source_word: כִּי
  choice: என்பதை
  rationale: அவர்கள் அறியவேண்டிய செய்தியின் உள்ளடக்கத்தை அறிமுகப்படுத்தும் இணைப்பாக இங்கு செயல்படுகிறது.
- source_word: בַסֻּכּוֹת
  choice: குடில்களில்
  rationale: סֻכּוֹת குறிக்கும் தற்காலிகத் தங்குமிடங்களைத் தெளிவாகவும் விழாவின் பெயருடனான சொற்பொருள் தொடர்பை இயன்றவரை காத்தும் தருகிறது; ‘கூடாரங்கள்’ என்பது துணியால் செய்யப்பட்ட tents எனத் தவறாகப் புரியப்படலாம்.
- source_word: הוֹשַׁבְתִּי
  choice: குடியிருக்கச் செய்தேன்
  rationale: ישׁב என்பதன் ஹிஃபீல் காரணவினைப் பொருளைத் தெளிவாகக் காக்கிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்களை
  rationale: சொல்லுக்கு சொல் வடிவம் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு முழு உடன்படிக்கை மக்களையும் கூட்டாகக் குறிக்கிறது; நவீனத் தமிழில் ‘இஸ்ரவேல் மக்கள்’ இயல்பாகவும் பொருள் துல்லியமாகவும் உள்ளது.
- source_word: בְּהוֹצִיאִי
  choice: நான் ... வெளியே கொண்டுவந்தபோது
  rationale: בְּ உடன் வரும் infinitive construct இங்குக் குறிக்கும் காலச்சூழலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: எகிப்து நாட்டிலிருந்து
  rationale: எபிரெய மூலத்தில் உள்ள ‘நாடு’ என்ற பெயர்ச்சொல்லையும் வெளியேற்ற நிகழ்வின் திசையையும் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரிந்துகொள்ளக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֱלֹהֵיכֶם
  choice: உங்கள் கடவுள்
  rationale: உடன்படிக்கை உறவைச் சுட்டும் இரண்டாம் நபர் பன்மை உடைமை வடிவத்தை நேரடியாகக் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூல உரை ஒரு பொதுப் பட்டத்தை அல்ல, நான்கெழுத்துத் தெய்வீகப் பெயரையே பயன்படுத்துகிறது. ஆகவே பெயரின் தன்மையை மறைக்காமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
- issue: בְּנֵי יִשְׂרָאֵל என்பதன் கூட்டுப்பொருள்
  choice: இஸ்ரவேல் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரெய வடிவம் சொல்லர்த்தமாக ஆண்பால் பன்மையாக இருந்தாலும், இங்கு அது இஸ்ரவேல் சமூகத்தைக் கூட்டாகக் குறிக்கிறது. இயல்பான தமிழில் பாலினம் குறித்த தேவையற்ற தவறான எண்ணத்தைத் தவிர்க்க ‘மக்கள்’ பயன்படுத்தப்பட்டு, சொல்லர்த்த வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- issue: הוֹשַׁבְתִּי என்பதன் காரணவினை வலிமை
  choice: குடியிருக்கச் செய்தேன்
  alternative: குடியமர்த்தினேன் / தங்கவைத்தேன்
  rationale: தேவன் அவர்களை அங்கு வாழச் செய்தார் என்ற காரணவினைப் பொருளைத் தளர்த்தாமல் காக்கிறது; அவர்கள் நிரந்தரமாகக் குடியேற்றப்பட்டனர் என்ற எண்ணத்தையும் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. காரணவினை, பல தலைமுறை நோக்கம், வெளியேற்ற நிகழ்வு, தெய்வீகப் பெயர் ஆகியவை வெளிப்படையாகக் காக்கப்பட்டுள்ளன.
