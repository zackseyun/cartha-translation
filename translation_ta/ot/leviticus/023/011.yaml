revisions:
- from: அவன் அந்தக் கதிர்க்கட்டை யாவேக்கு முன்பாக, நீங்கள் ஏற்றுக்கொள்ளப்படுவதற்காக[a] அசைவாட்ட வேண்டும்; ஓய்வுநாளுக்கு மறுநாளில் ஆசாரியன் அதை அசைவாட்ட வேண்டும்.
  to: அவன் அந்தக் கதிர்க்கட்டை யாவேக்கு முன்பாக, நீங்கள் ஏற்றுக்கொள்ளப்படுவதற்காக[a] அசைவாட்டுவான்; ஓய்வுநாளின் மறுநாளில் ஆசாரியன் அதை அசைவாட்டுவான்.
