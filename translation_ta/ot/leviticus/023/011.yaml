source:
  edition: WLC
  text: וְ/הֵנִ֧יף אֶת הָ/עֹ֛מֶר לִ/פְנֵ֥י יְהוָ֖ה לִֽ/רְצֹנְ/כֶ֑ם מִֽ/מָּחֳרַת֙ הַ/שַּׁבָּ֔ת יְנִיפֶ֖/נּוּ הַ/כֹּהֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/011.yaml
  text: And he shall wave the sheaf before Yahweh for your acceptance[a]; on the day after the Sabbath the priest shall wave it.
translation:
  language: ta
  text: அவன் அந்தக் கதிர்க்கட்டை யாவேக்கு முன்பாக, நீங்கள் ஏற்றுக்கொள்ளப்படுவதற்காக[a] அசைவாட்டுவான்; ஓய்வுநாளின் மறுநாளில் ஆசாரியன் அதை அசைவாட்டுவான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அது உங்கள் சார்பாக ஏற்றுக்கொள்ளப்படும்படி.” எபிரெயச் சொற்றொடர் காணிக்கை ஏற்றுக்கொள்ளப்படுவதையோ, அதன் வழியாக வழிபடுவோர் ஏற்றுக்கொள்ளப்படுவதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵנִיף
  choice: அசைவாட்ட வேண்டும்
  rationale: נוּף என்பதன் ஹிஃபில் வடிவம் காணிக்கையைச் சடங்குமுறையில் அசைவாட்டி முன்வைப்பதைக் குறிக்கிறது. ‘அசைவாட்ட’ என்பது அந்தச் செயலை மிகைப்படுத்தாமல் தெளிவாகக் காட்டுகிறது.
- source_word: הָעֹמֶר
  choice: அந்தக் கதிர்க்கட்டை
  rationale: இச்சூழலில் עֹמֶר என்பது வெறும் தானிய அளவையல்ல, முதற்பலனாகக் கொண்டுவரப்படும் கதிர்க்கட்டைக் குறிக்கிறது.
- source_word: לִפְנֵי יְהוָה
  choice: யாவேக்கு முன்பாக
  rationale: வழிபாட்டுச் சூழலில் கடவுளுடைய முன்னிலையில் காணிக்கையை முன்வைப்பதைச் சுட்டும் இயல்பான எபிரெயச் சொற்றொடர். יהוה தனிப்பெயராக ‘யாவே’ என்று ஒலிபெயர்க்கப்படுகிறது.
- source_word: לִרְצֹנְכֶם
  choice: நீங்கள் ஏற்றுக்கொள்ளப்படுவதற்காக
  rationale: இந்தச் சொற்றொடர் காணிக்கையின் வழியாக வழிபடுவோர் கடவுளால் ஏற்றுக்கொள்ளப்படுவதைச் சுட்டலாம். தமிழ் மொழியில் நோக்கத்தையும் நபர்களின் ஏற்பையும் இயல்பாக வெளிப்படுத்தும் வடிவம் இது.
- source_word: מִמָּחֳרַת הַשַּׁבָּת
  choice: ஓய்வுநாளுக்கு மறுநாளில்
  rationale: ஓய்வுநாளைத் தொடர்ந்து வரும் குறிப்பிட்ட நாளைத் தெளிவான நவீன தமிழில் குறிக்கிறது.
- source_word: יְנִיפֶנּוּ
  choice: அதை அசைவாட்ட வேண்டும்
  rationale: முன்பு வந்த அதே சடங்கு வினை மீண்டும் வருகிறது; ஆண்பால் ஒருமை பின்னொட்டு கதிர்க்கட்டைக் குறிக்கும் ‘அதை’ என வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: הַכֹּהֵן
  choice: ஆசாரியன்
  rationale: இஸ்ரவேலின் வழிபாட்டு சட்டச் சூழலில் כֹּהֵן என்பதற்கான வழக்கமான, புரிந்துகொள்ளத்தக்க தமிழ் பதம்.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் இறைவனின் தனிப்பெயர் நேரடியாக உள்ளது; அதை ஒரு பட்டப்பெயரால் மாற்றாமல் தமிழில் ஒலிபெயர்ப்பது மூல வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: לִרְצֹנְכֶם என்பதன் பலியியல் பொருள்
  choice: நீங்கள் ஏற்றுக்கொள்ளப்படுவதற்காக
  alternative: உங்கள் ஏற்புக்காக
  rationale: இந்த எபிரெயச் சொற்றொடர் காணிக்கை ஏற்கப்படுவதையோ, அதன் மூலம் வழிபடுவோர் ஏற்றுக்கொள்ளப்படுவதையோ குறிக்கக்கூடும். முதன்மை உரை நபர்களின் ஏற்பை இயல்பான தமிழில் தருகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சட்டவழிபாட்டு உரைக்கு ஏற்ற கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. ‘அசைவாட்ட’ என்ற சடங்குச் சொல் இரு முறை வரும் மூலத்தின் மீளுரைப்பைப் பாதுகாக்கிறது.
