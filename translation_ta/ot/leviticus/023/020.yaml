  text: וְ/הֵנִ֣יף הַ/כֹּהֵ֣ן אֹתָ֡/ם עַל֩ לֶ֨חֶם הַ/בִּכּוּרִ֤ים תְּנוּפָה֙ לִ/פְנֵ֣י יְהוָ֔ה עַל שְׁנֵ֖י כְּבָשִׂ֑ים קֹ֛דֶשׁ יִהְי֥וּ לַ/יהוָ֖ה לַ/כֹּהֵֽן׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/020.yaml
  text: The priest shall wave them with the bread of the firstfruits as a wave offering before Yahweh[a], with the two lambs. They shall be holy to Yahweh for the priest.
translation:
  language: ta
  text: ஆசாரியன் அவற்றை முதற்பலன்களின் அப்பத்தோடும் இரண்டு செம்மறியாட்டுக் குட்டிகளோடும் சேர்த்து, யாவேக்கு முன்பாக அசைவாட்டுக் காணிக்கையாக அசைவாட்ட வேண்டும்.[a] அவை யாவேக்குப் பரிசுத்தமானவையாகவும் ஆசாரியனுக்குரியவையாகவும் இருக்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “முதற்பலன்களின் அப்பத்தின்மேலும் இரண்டு செம்மறியாட்டுக் குட்டிகளின்மேலும்” என்றும் மொழிபெயர்க்கலாம். எபிரேய முன்னிடைச்சொல் இடஞ்சார்ந்த பொருளைக் கொள்ளக்கூடும்; இங்கே அது பொருட்கள் ஒன்றாகச் சடங்குமுறையில் சமர்ப்பிக்கப்படுவதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵנִיף ... תְּנוּפָה
  choice: அசைவாட்டும் காணிக்கையாக அசைவாட்ட வேண்டும்
  rationale: נוּף என்பதன் ஹிபீல் வடிவமும் תְּנוּפָה என்னும் பலியியல் சொல்லும், கடவுளுக்கு முன்பாகச் செய்யப்படும் சடங்குமுறை அசைவாட்டுதலைக் குறிக்கின்றன; வினையும் தொழில்நுட்பப் பெயரும் தமிழில் தக்கவைக்கப்பட்டன.
- source_word: אֹתָם
  choice: அவற்றை
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட பொருட்களைச் சுட்டும் பன்மை நேரடிச் செயப்படுபொருள் பெயர்ப்பதிலியை, தேவையின்றி விரிவுபடுத்தாமல் பாதுகாக்கிறது.
- source_word: עַל לֶחֶם הַבִּכּוּרִים
  choice: முதற்பலன் அப்பத்தோடும் ... சேர்த்து
  rationale: இந்தச் சடங்குச் சூழலில் עַל உடனிணைந்த சமர்ப்பிப்பைக் குறிக்கலாம். பொருட்கள் ஒன்றன்மேல் ஒன்று வைக்கப்பட்டதாகத் தேவையின்றி முடிவுசெய்யாமல் இயல்பான தமிழில் தரப்பட்டுள்ளது.
- source_word: לֶחֶם הַבִּכּוּרִים
  choice: முதற்பலன் அப்பம்
  rationale: בִּכּוּרִים என்பதன் முதல் விளைச்சல்/முதற்பலன் கருத்தையும், לֶחֶם என்பதன் அப்பம் என்ற பொருளையும் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: עַל שְׁנֵי כְּבָשִׂים
  choice: இரண்டு செம்மறியாட்டுக் குட்டிகளோடும் சேர்த்து
  rationale: עַל இங்கே தொடர்புடைய சடங்கு சமர்ப்பிப்பைக் குறிக்கும் என எடுத்துக்கொள்ளப்பட்டுள்ளது; כְּבָשִׂים பலியிடப்படும் இளம் செம்மறியாடுகளைக் குறிக்கிறது.
- source_word: לִפְנֵי יְהוָה
  choice: யாவேக்கு முன்பாக
  rationale: கடவுளின் முன்னிலையில் நிகழும் சடங்கு நடவடிக்கையைக் குறிக்கும் எபிரேய மரபுத்தொடரை இயல்பாக வழங்குகிறது; திருப்பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: קֹדֶשׁ יִהְיוּ
  choice: பரிசுத்தமானவையாக ... இருக்கும்
  rationale: היה உடன் வரும் קֹדֶשׁ, இவை பரிசுத்த நிலை அல்லது வகையைச் சேர்ந்தவை என்பதைச் சொல்கிறது; பொருட்களைச் சுட்டுவதால் பன்மை அஃறிணை வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: לַיהוָה לַכֹּהֵן
  choice: யாவேக்குப் பரிசுத்தமானவையாக, ஆசாரியனுக்குரியவையாக
  rationale: யாவேக்கு அர்ப்பணிக்கப்பட்ட பரிசுத்த நிலையும் அதேவேளை ஆசாரியனுக்கான உரிமைப் பங்கும் உள்ள சுருக்கமான எபிரேய அமைப்பின் இரு உறவுகளையும் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரேய நான்கெழுத்துத் திருப்பெயரை பொதுவாக ஏற்றுக்கொள்ளப்பட்ட தமிழ்ச் சத்துருவில் நேரடியாக வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்னும் திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் திருப்பெயர் நேரடியாக இருப்பதால் அதை பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்ப்பது உடன்படிக்கைப் பெயரின் தனித்தன்மையைப் பாதுகாக்கிறது.
- issue: யாவேக்குப் பரிசுத்தமானவை ஆசாரியனுக்குரியவையாக இருப்பதன் உறவு
  choice: இரு கூற்றுகளையும் இணையாகத் தக்கவைத்தல்
  alternative: யாவே சார்பாக ஆசாரியனுக்குக் கொடுக்கப்பட்டவை என்று விளக்கமாக விரித்தல்
  rationale: மூலம் அர்ப்பணிப்புக்கும் ஆசாரிய உரிமைக்கும் இடையிலான உறவை விளக்காமல் சுருக்கமாக வைக்கிறது; மொழிபெயர்ப்பு அந்த இறையியல்-சட்டத் திண்மையைத் தீர்மானித்து விடவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான சட்ட-வழிபாட்டு நடையைப் பயன்படுத்துகிறது. ‘ஆசாரியன்’, ‘முதற்பலன்’, ‘பரிசுத்தம்’, ‘அசைவாட்டும் காணிக்கை’ ஆகியவை லேவியராகமச் சடங்கு சூழலுக்கேற்ற, புரிந்துகொள்ளத்தக்க மரபுசார் சொற்களாகத் தக்கவைக்கப்பட்டன.
