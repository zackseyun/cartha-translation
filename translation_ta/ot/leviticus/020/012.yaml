id: LEV.20.12
reference: Leviticus 20:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/אִ֗ישׁ אֲשֶׁ֤ר יִשְׁכַּב֙ אֶת כַּלָּת֔/וֹ מ֥וֹת יוּמְת֖וּ שְׁנֵי/הֶ֑ם תֶּ֥בֶל עָשׂ֖וּ דְּמֵי/הֶ֥ם בָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/012.yaml
  text: If a man lies with his daughter-in-law[a], both of them shall surely be put to death. They have committed perversion[b]; their blood is upon them.
translation:
  language: ta
  text: ஒருவன் தன் மருமகளோடு உடலுறவு கொண்டால், அவர்கள் இருவரும் நிச்சயமாகக் கொல்லப்பட வேண்டும். அவர்கள் சீர்கெட்ட செயலைச் செய்தார்கள்[a]; அவர்களுடைய இரத்தம் அவர்கள்மேலேயே இருக்கிறது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘குழப்பமான செயல்,’ ‘அருவருப்பான செயல்,’ அல்லது ‘இழிவான செயல்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் תֶּבֶל, இந்தச் சட்டச் சூழலில் அறநெறி ஒழுங்கைச் சீர்குலைக்கும் செயலைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, ‘அவர்களுடைய இரத்தப்பழி அவர்கள்மேல் இருக்கிறது’ அல்லது ‘தங்கள் மரணத்திற்குத் தாங்களே பொறுப்பு.’ இந்த எபிரெய மரபுத்தொடர், அவர்களுடைய மரணத்திற்கான பொறுப்பை அவர்கள்மீதே சுமத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ אֲשֶׁר
  choice: ஒருவன் … கொண்டால்
  rationale: எபிரெய சட்ட நடையில் இது ஒரு நிபந்தனை வழக்கை அறிமுகப்படுத்துகிறது. தமிழில் ‘ஒருவன் … கொண்டால்’ என்பது ஆண் சட்டப் பொருளையும் நிபந்தனைத் தன்மையையும் இயல்பாகக் காட்டுகிறது.
- source_word: יִשְׁכַּב אֶת
  choice: உடலுறவு கொண்டால்
  rationale: இச்சூழலில் שׁכב என்பது பாலுறவைக் குறிக்கும் நிலையான மரபுத்தொடர். ‘உடலுறவு கொண்டால்’ என்பது தெளிவானதும் கண்ணியமானதும்; வெறும் ‘படுத்தால்’ என்ற தெளிவின்மையைத் தவிர்க்கிறது.
- source_word: כַּלָּתוֹ
  choice: தன் மருமகளோடு
  rationale: כַּלָּה இங்கு மகனின் மனைவியைக் குறிக்கிறது; தமிழில் ‘மருமகள்’ அதற்குரிய இயல்பான உறவுமுறைச் சொல்.
- source_word: מוֹת יוּמְתוּ
  choice: நிச்சயமாகக் கொல்லப்பட வேண்டும்
  rationale: வினையெச்ச முழுவடிவமும் இறந்துபோகச் செய்யும் வினையும் சேர்ந்த எபிரெய அமைப்பு மரணத் தண்டனையை வலியுறுத்துகிறது. ‘நிச்சயமாக’ அந்த வலியுறுத்தலைத் தக்கவைக்கிறது; ‘கொல்லப்பட வேண்டும்’ சட்டக் கட்டளையின் வலிமையை வெளிப்படுத்துகிறது.
- source_word: שְׁנֵיהֶם
  choice: அவர்கள் இருவரும்
  rationale: குற்றச்செயலில் ஈடுபட்ட இருவரையும் வெளிப்படையாக உள்ளடக்கும் மூலச்சொல்லை நேராகவும் இயல்பாகவும் மொழிபெயர்க்கிறது.
- source_word: תֶּבֶל
  choice: சீர்கெட்ட செயல்
  rationale: இந்தச் சட்டச் சூழலில் இச்சொல் ஒழுங்கு மீறிய, கடுமையாகக் கண்டிக்கப்படும் பாலியல் செயலைக் குறிக்கிறது. ‘சீர்கெட்ட செயல்’ அதன் அறநெறிசார் வலிமையைத் தக்கவைக்கிறது; தமிழில் இயல்பாகவும் புரியத்தக்கதாகவும் உள்ளது.
- source_word: עָשׂוּ
  choice: செய்தார்கள்
  rationale: எபிரெய வினையின் எளிய பொருளான ‘செய்தார்கள்’ தமிழிலும் ‘சீர்கெட்ட செயல்’ என்பதோடு இயல்பாக அமைகிறது.
- source_word: דְּמֵיהֶם בָּם
  choice: அவர்களுடைய இரத்தம் அவர்கள்மேலேயே இருக்கிறது
  rationale: அவர்களின் மரணத்திற்கான பொறுப்பு அவர்களுக்கே உரியது எனக் கூறும் எபிரெய சட்ட மரபுத்தொடரை விளக்கமாக மாற்றாமல் தக்கவைக்கிறது. ‘மேலேயே’ என்பது בָּם தரும் பொறுப்புச் சுமத்தலை வலியுறுத்துகிறது.
theological_decisions:
- issue: சட்டத்தின் ஆண்பால் பொருள்
  choice: ‘ஒருவன்’ என்று ஆண்பால் ஒருமையில் மொழிபெயர்க்கப்பட்டது.
  alternative: ‘ஒருவர்’ அல்லது ‘யாராவது’
  rationale: אִישׁ ஆண்பால் ஒருமை; இச்சட்டத்தில் ஆண் குற்றவாளியே குறிப்பாகச் சொல்லப்படுகிறார். பாலினத்தைப் பொதுமைப்படுத்தாமல் மூலத்தின் துல்லியம் காக்கப்பட்டது.
- issue: תֶּבֶל என்பதன் அறநெறிசார் மதிப்பீடு
  choice: ‘சீர்கெட்ட செயல்’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘குழப்பம்’, ‘அருவருப்பான செயல்’, அல்லது ‘இழிவான செயல்’
  rationale: மூலவசனமே அந்தச் செயலை அறநெறிசார்ந்து கண்டிக்கிறது. ‘சீர்கெட்ட செயல்’ அந்தக் கண்டனத்தை வெளிப்படுத்தினாலும், குறிப்பிட்ட கோட்பாட்டு விளக்கத்தைத் திணிக்காது.
- issue: דְּמֵיהֶם בָּם என்ற இரத்த மரபுத்தொடர்
  choice: ‘அவர்களுடைய இரத்தம் அவர்கள்மேலேயே இருக்கிறது’ என்ற உருவகம் தக்கவைக்கப்பட்டது.
  alternative: ‘தங்கள் மரணத்திற்குத் தாங்களே பொறுப்பு’ அல்லது ‘அவர்களுடைய இரத்தப்பழி அவர்கள்மேல் இருக்கிறது’
  rationale: மூலத்தின் இரத்த உருவகத்தையும் அதன் சட்ட-இறையியல் பதற்றத்தையும் காக்கிறது. அடிக்குறிப்பு அதன் பொறுப்புச் சுட்டலைத் தெளிவுபடுத்துகிறது; முதன்மை உரை அதை விளக்கவுரையாக மாற்றவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், சட்டவசனத்திற்கேற்ற கண்ணியமானவும் நேரடியானவும் உள்ள நடை பயன்படுத்தப்பட்டது. பாலுறவைக் குறிக்கும் இடத்தில் தெளிவற்ற சொற்களைத் தவிர்த்து ‘உடலுறவு’ பயன்படுத்தப்பட்டது. மரணத் தண்டனைச் சூத்திரத்தின் வலிமையும் இறுதி இரத்த உருவகமும் தக்கவைக்கப்பட்டுள்ளன. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்றொடர்களின் பின்னரே இடப்பட்டுள்ளன.
