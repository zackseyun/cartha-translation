base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/019.yaml
  text: You shall not uncover the nakedness of your mother's sister or of your father's sister[a], for he has laid bare his own flesh[b]; they shall bear their iniquity.
translation:
  language: ta
  text: உன் தாயின் சகோதரியின் நிர்வாணத்தையோ உன் தந்தையின் சகோதரியின் நிர்வாணத்தையோ நீ வெளிப்படுத்தக்கூடாது. ஏனெனில், அவன் தனக்கு இரத்த உறவானவரை வெளிப்படுத்தியிருக்கிறான்[a]. அவர்கள் தங்கள் அக்கிரமத்தைச் சுமப்பார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தனக்கு இரத்த உறவானவர்’ என்பதற்கு ‘தன் நெருங்கிய உறவினர்’ என்றும் மொழிபெயர்க்கலாம். எபிரேயத்தில் உள்ள சொல் சொல்லர்த்தமாக ‘அவனுடைய மாம்சம்’ என இருந்தாலும், இச்சூழலில் இரத்த உறவினரைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘தங்கள் அக்கிரமத்தைச் சுமப்பார்கள்’ என்பது ‘தங்கள் குற்றப்பழியைச் சுமப்பார்கள்’ அல்லது ‘தங்கள் அக்கிரமத்திற்கான தண்டனையை அனுபவிப்பார்கள்’ என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת ... לֹא תְגַלֵּה
  choice: நிர்வாணத்தை ... வெளிப்படுத்தக் கூடாது
  rationale: லேவியராகமத்தின் பாலுறவுத் தடைகளில் வரும் நிலையான எபிரேயச் சட்ட மரபுத்தொடரைத் தக்கவைக்கிறது. அதை நேரடியாக ‘பாலுறவு கொள்ளக் கூடாது’ என்று விரித்துரைக்காமல், மூலத்தின் உருவகத்தையும் சூழலுடனான சொற்றொடர்பையும் பாதுகாக்கிறது.
- source_word: אֲחוֹת אִמְּךָ
  choice: உன் தாயின் சகோதரி
  rationale: ‘தாய்வழி அத்தை’ என்று உறவுப்பெயரால் சுருக்காமல், எபிரேய உறவுமுறைக் கட்டமைப்பைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: וַאֲחוֹת אָבִיךָ
  choice: உன் தந்தையின் சகோதரி
  rationale: முந்தைய உறவுச் சொல்லுக்கு இணையான வடிவத்தைக் காத்து, மூலத்தின் சட்டநடை இணைப்பை வெளிப்படுத்துகிறது.
- source_word: שְׁאֵרוֹ
  choice: தன் சொந்த மாம்சம்
  rationale: இந்தச் சொல் நெருங்கிய இரத்த உறவைக் குறிக்கக்கூடியபோதிலும், அதன் ‘மாம்சம்’ என்ற உறவுமுறை உருவகத்தை முதன்மை உரையில் காக்கிறது; விளக்கமான மாற்றுகள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: הֶעֱרָה
  choice: நிர்வாணமாக்கியிருக்கிறான்
  rationale: ‘வெறுமையாக்குதல்/வெளிப்படுத்துதல்’ என்ற வினையின் பாலியல்-சட்டப் பொருளைத் தக்கவைத்து, முதல் கட்டளையில் வந்த ‘வெளிப்படுத்து’ என்ற சொல்லை அப்படியே மீண்டும் கூறுவதைத் தவிர்க்கிறது.
- source_word: עֲוֺנָם יִשָּׂאוּ
  choice: அவர்கள் தங்கள் அக்கிரமத்தைச் சுமப்பார்கள்
  rationale: குற்றம், குற்றப்பொறுப்பு, அதன் விளைவு ஆகியவற்றை உள்ளடக்கக்கூடிய எபிரேய மரபுத்தொடரின் சுருக்கத்தையும் திட்டமிட்ட பொருள் அகலத்தையும் காக்கிறது.
theological_decisions:
- issue: விளக்கக் கூறிலுள்ள ஒருமையிலிருந்து தண்டனைக் கூறிலுள்ள பன்மைக்கு மாறுதல்
  choice: ‘அவன் ... நிர்வாணமாக்கியிருக்கிறான்; அவர்கள் ... சுமப்பார்கள்’ என்று ஒருமை–பன்மை மாற்றத்தை வெளிப்படையாகக் காத்தல்
  alternative: ‘அவர்கள் தங்கள் சொந்த மாம்சத்தை நிர்வாணமாக்கியிருக்கிறார்கள்; அவர்கள்...’ என்று முழுவதையும் பன்மையாக்குதல்
  rationale: שְׁאֵרוֹ / הֶעֱרָה என்பவற்றின் ஒருமையிலிருந்து עֲוֺנָם יִשָּׂאוּ என்பவற்றின் பன்மைக்கு மூல எபிரேயம் மாறுகிறது. அதைச் சீராக்காமல் காப்பது உரையின் சட்டநடையையும் இரு பங்கேற்பாளர்கள்மீது வரும் பொறுப்பையும் வெளிப்படையாக வைத்திருக்கிறது.
- issue: பாலியல் மரபுத்தொடரை முதன்மை உரையில் வெளிப்படையான பொருளுரையாக மாற்ற வேண்டுமா என்பது
  choice: ‘நிர்வாணத்தை வெளிப்படுத்துதல்’ என்ற மரபுத்தொடரைத் தக்கவைத்தல்
  alternative: ‘பாலுறவு கொள்ளுதல்’ என்று நேரடியாக மொழிபெயர்த்தல்
  rationale: மூலத்தின் சட்ட மொழிநடைக்கும் லேவியராகமத்தின் சுற்றியுள்ள தடைகளுடனான சொற்றொடர்புக்கும் இந்த மரபுத்தொடர் முக்கியமானது. சூழல் அதன் பாலியல் பொருளைத் தெளிவாக்குவதால் அதை விரித்துரைக்கத் தேவையில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான சட்டநடை பயன்படுத்தப்பட்டுள்ளது. ‘நிர்வாணத்தை வெளிப்படுத்துதல்’, ‘சொந்த மாம்சம்’, ‘அக்கிரமத்தைச் சுமத்தல்’ ஆகிய மூல உருவகங்கள் சற்றே உயர்ந்த நடையில் இருந்தாலும், வசனத்தின் சட்ட-இறையியல் சுருக்கத்தையும் உண்மையான பொருள் அகலத்தையும் காப்பதற்காகத் தக்கவைக்கப்பட்டுள்ளன. எல்லா அடிக்குறிப்பு குறிகளும் உரிய சொற்றொடர்களுக்குப் பின் முதன்மை உரையில் இடம்பெற்றுள்ளன.
