revisions:
- from: உன் தாயின் சகோதரியுடைய நிர்வாணத்தையோ, உன் தந்தையின் சகோதரியுடைய நிர்வாணத்தையோ நீ வெளிப்படுத்தக் கூடாது. ஏனெனில், அவன் தன் சொந்த மாம்சத்தையே நிர்வாணமாக்கியிருக்கிறான்[a]. அவர்கள் தங்கள் அக்கிரமத்தைச் சுமப்பார்கள்[b].
  to: உன் தாயின் சகோதரியின் நிர்வாணத்தையோ உன் தந்தையின் சகோதரியின் நிர்வாணத்தையோ நீ வெளிப்படுத்தக்கூடாது. ஏனெனில், அவன் தனக்கு இரத்த உறவானவரை வெளிப்படுத்தியிருக்கிறான்[a]. அவர்கள் தங்கள் அக்கிரமத்தைச் சுமப்பார்கள்[b].
  rationale: The revision resolves the misleading self-body sense in the rationale clause by rendering שְׁאֵרוֹ as a blood relative, while retaining the singular male referent there and the plural liability clause. It also preserves the Hebrew legal euphemism ‘uncover nakedness’ and leaves the precise nature of the penalty unstated in the main text.
