base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/026.yaml
  text: You shall be holy to me[a], because I, Yahweh, am holy, and I have separated you from the peoples to be mine.
translation:
  language: ta
  text: நீங்கள் எனக்குப் பரிசுத்தமானவர்களாக இருக்க வேண்டும்; ஏனெனில் யாவேவாகிய நான் பரிசுத்தர்; மேலும், நீங்கள் எனக்குச் சொந்தமானவர்களாய் இருப்பதற்காக உங்களை மக்களினங்களிலிருந்து[a] பிரித்தெடுத்தேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நாடுகளிலிருந்து.” எபிரெயச் சொல் עַמִּים என்பது “மக்களினங்கள்” என்றும், சில சூழல்களில் “நாடுகள்” என்றும் பொருள்படும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וִהְיִיתֶם לִי קְדֹשִׁים
  choice: நீங்கள் எனக்குப் பரிசுத்தமானவர்களாக இருக்க வேண்டும்
  rationale: இச்சட்ட அறிவுரைச் சூழலில் வினைவடிவம் எதிர்கால/விளைவு சார்ந்த கட்டளையுணர்வைத் தருகிறது. இயல்பான நவீன தமிழில் ‘இருக்க வேண்டும்’ அந்தக் கடப்பாட்டைத் தெளிவாகக் காட்டுகிறது. קְדֹשִׁים என்பதில் அறநெறித் தூய்மையும் வழிபாட்டுக்குரிய தனிப்படுத்துதலும் இணைந்திருப்பதால் ‘பரிசுத்தமானவர்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: כִּי קָדוֹשׁ אֲנִי יְהוָה
  choice: ஏனெனில் யாவேவாகிய நான் பரிசுத்தர்
  rationale: כִּי என்பதன் காரணப்பொருளை ‘ஏனெனில்’ வெளிப்படுத்துகிறது. மனிதர்களிடம் பயன்படுத்திய அதே பரிசுத்தச் சொல்லை இறைவனிடமும் பயன்படுத்துவதால் மூலத்தின் இறையியல் தொடர்பு காக்கப்படுகிறது. יהוה தனிப்பெயராக ‘யாவே’ என ஒலிபெயர்க்கப்பட்டது.
- source_word: וָאַבְדִּל אֶתְכֶם
  choice: உங்களைப் பிரித்தெடுத்தேன்
  rationale: בדל என்பது பிரித்தல் அல்லது தனியே வேறுபடுத்துதல். ‘பிரித்தெடுத்தேன்’ நிறைவேற்றப்பட்ட இறைச் செயலையும் நோக்கமுள்ள தனிப்படுத்துதலையும் காட்டுகிறது; קדש என்பதற்கான ‘பரிசுத்தம்’ என்ற சொல்லோடு இதைக் கலக்கவில்லை.
- source_word: מִן הָעַמִּים
  choice: மக்களினங்களிலிருந்து
  rationale: עַמִּים என்பது பன்மையில் மக்கள் குழுக்களையோ நாடுகளையோ குறிக்கலாம். ‘மக்களினங்கள்’ அதன் பரந்த கூட்டுப் பொருளைப் பாதுகாக்கிறது; ‘பிற’ என்பது மூலத்தில் வெளிப்படையாக இல்லாததால் சேர்க்கப்படவில்லை.
- source_word: לִהְיוֹת לִי
  choice: நீங்கள் எனக்குச் சொந்தமானவர்களாய் இருப்பதற்காக
  rationale: இறுதியில் வரும் infinitive + לִי அமைப்பு பிரித்தெடுத்ததன் நோக்கம் அல்லது விளைவை உணர்த்துகிறது. தமிழில் எழுவாயை மீண்டும் வெளிப்படுத்துவது வாக்கியத்தைத் தெளிவாக்குகிறது; ‘எனக்குச் சொந்தமானவர்கள்’ உடன்படிக்கை சார்ந்த உரிமை/உறவு மொழியை இயல்பாகத் தருகிறது.
theological_decisions:
- issue: இஸ்ரவேலின் உடன்படிக்கைப் பரிசுத்தத்தை அறநெறித் தூய்மையாக மட்டும் அல்லது சடங்குசார் தனிப்படுத்துதலாக மட்டும் சுருக்காமல் மொழிபெயர்த்தல்
  choice: קדש என்பதற்கு ‘பரிசுத்தம்’ என்றும் בדל என்பதற்கு ‘பிரித்தெடுத்தல்’ என்றும் வேறுபடுத்தி வழங்குதல்
  alternative: קדש மற்றும் בדל இரண்டையும் ‘தனியே பிரித்துவைத்தல்’ என்ற ஒரே கருத்தால் மொழிபெயர்த்தல்
  rationale: மூல வசனம் மக்களின் பரிசுத்தத்தை யாவேயின் பரிசுத்தத்தில் நிலைநிறுத்தி, பின்னர் மக்களினங்களிலிருந்து பிரித்தெடுத்ததை வேறு வினைச்சொல்லால் கூறுகிறது. இரு சொற்களையும் வேறுபடுத்துவது மூலத்தின் கருத்தழுத்தத்தையும் இறையியல் பதற்றத்தையும் காக்கிறது.
- issue: יהוה என்ற இறைப் பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் பட்டம் அல்ல, நான்கு எழுத்துகளுள்ள இறைத் தனிப்பெயர் நேரடியாக உள்ளது. ‘யாவே’ அதைத் தமிழில் ஒலிபெயர்த்து, உடன்படிக்கைப் பெயர் என்பதைக் காக்கிறது.
- issue: לִהְיוֹת לִי என்பதில் உள்ள உடன்படிக்கைச் சொந்த உறவு
  choice: எனக்குச் சொந்தமானவர்களாய் இருப்பதற்காக
  alternative: எனக்காக இருப்பதற்காக
  rationale: לִי உறவையும் உரிமையையும் குறிக்கக்கூடும். இச்சூழலில் பிரித்தெடுத்ததன் நோக்கமாக ‘எனக்குச் சொந்தமானவர்கள்’ என்பது இயல்பான தமிழில் அந்த உறவைத் தெளிவாக வெளிப்படுத்துகிறது; வெறும் பயன்பாட்டு நோக்கமாகச் சுருக்குவதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் வகையில் மரியாதையும் வேதாகமத்திற்குரிய கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டது. ‘பரிசுத்தம்’ என்ற நிலைபெற்ற இறையியல் சொல் தக்கவைக்கப்பட்டு, மற்ற வாக்கிய அமைப்பு இயல்பான தமிழில் வழங்கப்பட்டது. அடிக்குறிப்பு குறி அது விளக்கும் ‘மக்களினங்களிலிருந்து’ என்ற சொல்லுக்குப் பின்னர் வைக்கப்பட்டது.
