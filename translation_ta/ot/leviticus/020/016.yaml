source:
  edition: WLC
  text: וְ/אִשָּׁ֗ה אֲשֶׁ֨ר תִּקְרַ֤ב אֶל כָּל בְּהֵמָה֙ לְ/רִבְעָ֣ה אֹתָ֔/הּ וְ/הָרַגְתָּ֥ אֶת הָ/אִשָּׁ֖ה וְ/אֶת הַ/בְּהֵמָ֑ה מ֥וֹת יוּמָ֖תוּ דְּמֵי/הֶ֥ם בָּֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/016.yaml
  text: If a woman approaches any animal to mate with it[a], you shall kill the woman and the animal. They shall surely be put to death[b]; their blood is on them.
translation:
  language: ta
  text: ஒரு பெண், எந்த விலங்கையும் அதனுடன் பாலுறவு கொள்வதற்காக அணுகினால்[a], நீ அந்தப் பெண்ணையும் அந்த விலங்கையும் கொல்ல வேண்டும். அவை இரண்டும் நிச்சயமாகக் கொல்லப்பட வேண்டும்; அவற்றின் இரத்தம் அவற்றின்மேலேயே இருக்கும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அதனுடன் படுப்பதற்காக.’ இங்குள்ள எபிரெய வினைச்சொல், ஏறிப் புணர்வதை அடிப்படையாகக் கொண்ட பாலுறவைக் குறிப்பாகக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, ‘அவற்றின் இரத்தப்பழி அவற்றின்மேலேயே இருக்கும்.’ அவற்றின் மரணத்திற்கான பொறுப்பு அவற்றுக்கே உரியது என்பது இந்த எபிரெய மொழிமரபின் பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּקְרַב
  choice: அணுகினால்
  rationale: קרב என்பதன் அடிப்படைப் பொருளான ‘அருகில் வருதல்/அணுகுதல்’ என்பதைக் காக்கிறது; பாலியல் நோக்கம் அடுத்த சொற்றொடரில் தனியாகத் தெளிவுபடுத்தப்படுகிறது.
- source_word: בְּהֵמָה
  choice: விலங்கு
  rationale: בְּהֵמָה இங்கு பொதுவாக ஒரு மிருகத்தைக் குறிக்கிறது. ‘விலங்கு’ என்பது நவீனத் தமிழில் தெளிவான, இயல்பான பொதுப்பெயர்; כָּל உடன் சேர்ந்துள்ள பரந்த பொருளையும் தக்கவைக்கிறது.
- source_word: לְרִבְעָה אֹתָהּ
  choice: ஒரு விலங்கு அவளுடன் உடலுறவு கொள்ளும்படி
  rationale: רבע இச்சூழலில் விலங்கு பெண்ணைப் புணரும் பாலியல் செயலைக் குறிக்கிறது. எபிரெயச் சொற்றொடரில் உள்ள பெண்பால் ஒருமை செயப்படுபொருள் பின்னொட்டு பெண்ணைக் குறிக்கிறது; ஆகவே செயல்வழியைத் தமிழில் வெளிப்படையாகக் காட்டுகிறது.
- source_word: וְהָרַגְתָּ
  choice: நீ ... கொல்ல வேண்டும்
  rationale: இரண்டாம் நபர் ஒருமைச் சட்டக் கட்டளையின் வலிமையை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מוֹת יוּמָתוּ
  choice: அவை இரண்டும் நிச்சயமாகக் கொல்லப்பட வேண்டும்
  rationale: முற்றுப்பெயர் மற்றும் வினைச்சொல் இணைப்பின் வலியுறுத்தலை ‘நிச்சயமாக’ என்பதன் மூலம் காக்கிறது; பெண்ணும் விலங்கும் ஆகிய இரண்டையும் குறிக்கும் வகையில் ‘இரண்டும்’ சேர்க்கப்பட்டுள்ளது.
- source_word: דְּמֵיהֶם בָּם
  choice: அவற்றின் இரத்தம் அவற்றின்மேலேயே இருக்கும்
  rationale: மரணத்திற்கான பொறுப்பு குற்றம் செய்தவர்கள்மேலேயே உள்ளது என்னும் எபிரெய மொழிமரபை நேரடியாகத் தக்கவைக்கிறது; அதன் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
theological_decisions:
- issue: விலங்குடன் பாலுறவு கொள்வதையும் அதற்கான கடுமையான சட்டத் தண்டனையையும் மொழிபெயர்த்தல்
  choice: பாலியல் செயலும் மரணத் தண்டனையும் மறைமுகமாக்காமல் தெளிவாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘படுத்துக்கொள்ளும்படி’ போன்ற மறைபொருள் கொண்ட சொல்லைப் பயன்படுத்துதல் அல்லது செயலை விரிவான விளக்கமாக மாற்றுதல்.
  rationale: மூலவசனம் சட்ட மற்றும் தண்டனை மொழியில் நேரடியாக உள்ளது. அதன் கடுமையையும் தெளிவையும் காக்க வேண்டும்; அதேவேளையில் மூலத்தில் இல்லாத ஒழுக்கவியல் அல்லது சமயவியல் விளக்கத்தைச் சேர்க்கக் கூடாது.
- issue: דְּמֵיהֶם בָּם என்ற இரத்த மொழிமரபின் பொருள்
  choice: முதன்மை உரையில் ‘அவற்றின் இரத்தம் அவற்றின்மேலேயே இருக்கும்’ என்று உருவகத்தைத் தக்கவைத்து, பொருளை அடிக்குறிப்பில் விளக்குதல்.
  alternative: முதன்மை உரையிலேயே ‘அவற்றின் சாவுக்கான பொறுப்பு அவற்றின்மேலேயே உள்ளது’ என்று விளக்கமாக மொழிபெயர்த்தல்.
  rationale: உருவகம் சட்ட-இறையியல் பதற்றத்தையும் மூலத்தின் சொல் வடிவத்தையும் காக்கிறது; அடிக்குறிப்பு அதன் பொறுப்பு சார்ந்த பொருளை வாசகருக்குத் தெளிவாக்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்ட உரைக்கேற்ற கண்ணியமானதும் நேரடியானதும் ஆன நடை பயன்படுத்தப்பட்டுள்ளது. பாலியல் செயல் மறைமுகமாக்கப்படவில்லை; தேவையற்ற கொச்சைத்தனமும் தவிர்க்கப்பட்டுள்ளது. பெண்ணும் விலங்கும் சேர்ந்த கலப்புப் பன்மையை இயல்பாகக் குறிக்க ‘அவை இரண்டும்/அவற்றின்’ பயன்படுத்தப்பட்டுள்ளது.
