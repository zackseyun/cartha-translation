  yaml_path: translation/ot/leviticus/020/015.yaml
  text: If a man has sexual intercourse with an animal, he must surely be put to death, and you shall kill the animal.
translation:
  language: ta
  text: ஒரு ஆண் ஒரு மிருகத்துடன் பாலுறவு கொண்டால்[a], அவன் நிச்சயமாகக் கொல்லப்பட வேண்டும்; அந்த மிருகத்தையும் நீங்கள் கொல்ல வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “ஒரு மிருகத்துடன் தன் படுத்தலைக் கொடுத்தால்”; இது பாலுறவைக் குறிக்கும் எபிரெய மொழிவழக்கு.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: ஒரு ஆண்
  rationale: இது ஆண்பால் ஒருமைச் சொல்; அடுத்த வசனம் பெண்ணின் செயலைத் தனியாகக் குறிப்பிடுவதால், இங்கு ஆண் குற்றவாளியே குறிப்பாகச் சுட்டப்படுகிறார்.
- source_word: אֲשֶׁר
  choice: கொண்டால்
  rationale: முறையாக இது தொடர்புச்சொல் என்றாலும், நிபந்தனை வகைச் சட்ட நடையில் தமிழில் ‘கொண்டால்’ என்று மொழிபெயர்ப்பது இயல்பாக நிபந்தனைப் பொருளைத் தெரிவிக்கிறது.
- source_word: יִתֵּן שְׁכָבְתּוֹ
  choice: பாலுறவு கொண்டால்
  rationale: எபிரெய மொழிவழக்கின் சொற்பொருள் ‘தன் படுத்தலைக் கொடுத்தால்’ என்பதாகும்; பாலியல் செயலைத் தெளிவாகவும் நவீனத் தமிழில் இயல்பாகவும் தெரிவிக்க ‘பாலுறவு கொண்டால்’ பயன்படுத்தப்பட்டது.
- source_word: בִּבְהֵמָה
  choice: ஒரு மிருகத்துடன்
  rationale: בְּהֵמָה என்பது மிருகத்தைக் குறிக்கிறது; ‘மிருகம்’ என்பது இச்சட்டச் சூழலில் தெளிவான, பொதுவாகப் புரியும் தமிழ்ச் சொல்.
- source_word: מוֹת יוּמָת
  choice: நிச்சயமாகக் கொல்லப்பட வேண்டும்
  rationale: முற்றுவினை எச்சமும் வினையும் இணைந்த எபிரெய அமைப்பு மரணத் தண்டனையை வலியுறுத்துகிறது; ‘நிச்சயமாக’ அந்த வலியுறுத்தலையும் ‘வேண்டும்’ சட்டக் கட்டாயத்தையும் வெளிப்படுத்துகின்றன.
- source_word: וְאֶת־הַבְּהֵמָה תַּהֲרֹגוּ
  choice: அந்த மிருகத்தையும் நீங்கள் கொல்ல வேண்டும்
  rationale: இரண்டாம் நபர் பன்மை வினை சமூகத்தையோ நீதித் தீர்ப்பை நிறைவேற்றுவோரையோ நேரடியாகக் குறிக்கிறது. ‘அந்த மிருகத்தையும்’ என்பது முன்னர் கூறப்பட்ட மிருகத்தைக் குறித்தும் இணைத் தண்டனையையும் தெளிவாக்குகிறது.
theological_decisions:
- issue: குற்றவாளியின் பாலினக் குறிப்புத்தன்மை
  choice: ஆணைக் குறிப்பாகச் சுட்டும் ‘ஒரு ஆண்’
  alternative: பாலினப் பொதுமையான ‘ஒருவர்’
  rationale: மூலச்சொல் ஆண்பால் ஒருமையில் உள்ளது; அடுத்த வசனம் பெண்ணைப் பற்றிய இணையான வழக்கைத் தனியே கூறுகிறது. எனவே பாலினப் பொதுமைப்படுத்தல் சட்டப் பகுதியின் அமைப்பையும் குறிப்புத்தன்மையையும் மங்கச் செய்யும்.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்ட உரைக்கேற்ற தெளிவும் கண்ணியமும் பேணப்பட்டுள்ளன. பாலியல் செயல் மறைமுகமாகவோ அநாகரிகமாகவோ அல்லாமல் நேரடியாகக் கூறப்பட்டுள்ளது; மரணத் தண்டனையின் எபிரெய வலியுறுத்தலும் பாதுகாக்கப்பட்டுள்ளது.
