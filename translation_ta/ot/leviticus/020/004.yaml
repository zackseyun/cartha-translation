base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/004.yaml
  text: But if the people of the land deliberately close their eyes to that man when he gives some of his offspring to Molech[a], so as not to put him to death[c][b],
translation:
  language: ta
  text: ஆனால், அந்த மனிதன் தன் பிள்ளைகளில் ஒருவரை[b] மோலேக்குக்குக்[c] கொடுக்கும்போது, அந்த மனிதனை மரணதண்டனைக்கு உட்படுத்தாமல் இருப்பதற்காக நாட்டின் மக்கள் வேண்டுமென்றே அவனைக் கண்டும் காணாமல் இருந்தால்[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேய மரபுத்தொடரின் நேர்ப்பொருள், ‘அந்த மனிதனிடமிருந்து தங்கள் கண்களை முற்றிலும் மறைத்துக்கொண்டால்’ என்பதாகும்.
    reason: lexical_alternative
  - marker: b
    text: ‘பிள்ளைகள்’ என்பதற்கான எபிரேயச் சொல் நேர்ப்பொருளில் ‘விதை’; இங்கு அது அவருடைய பிள்ளைகளைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: ‘மோலேக்கு’ என்பது ஒரு தெய்வத்தையோ பிள்ளைப் பலியுடன் தொடர்புடைய ஒரு சடங்கு வகையையோ குறிக்கலாம்; மாற்று வாசிப்பாக, ‘அரசனுக்கு’ என்றும் கொள்ளப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: הַעְלֵם יַעְלִימוּ
  choice: வேண்டுமென்றே ... கண்டும் காணாமல் இருந்தால்
  rationale: வினையெச்சப் பெயர்ச்சொல்லும் அதே வேரிலான வினையும் சேர்ந்த அமைப்பு செயலை வலியுறுத்துகிறது. தமிழில் ‘வேண்டுமென்றே கண்டும் காணாமல் இருத்தல்’ என்பது அந்த வலியுறுத்தலையும் வேண்டுமென்ற புறக்கணிப்பையும் இயல்பாகத் தெரிவிக்கிறது.
- source_word: עַם הָאָרֶץ
  choice: நாட்டின் மக்கள்
  rationale: இந்தச் சட்டச் சூழலில் இது ஒரு குறிப்பிட்ட சமூக வர்க்கத்தை மட்டுமல்லாமல், நாட்டிலுள்ள மக்களைக் குறிக்கிறது.
- source_word: אֶת עֵינֵיהֶם מִן הָאִישׁ הַהוּא
  choice: அவனைக் கண்டும் காணாமல்
  rationale: ‘அந்த மனிதனிடமிருந்து தங்கள் கண்களை மறைத்தல்’ என்ற எபிரேய மரபுத்தொடர், அவனை அறிந்தும் நடவடிக்கை எடுக்காமல் புறக்கணிப்பதைக் குறிக்கிறது.
- source_word: בְּתִתּוֹ מִזַּרְעוֹ
  choice: தன் சந்ததியாரில் ஒருவரை ... கொடுக்கும்போது
  rationale: מִן பகுதியைக் குறிக்கும் பயன்பாடு; זֶרַע என்பதன் அடிப்படைப் பொருள் ‘விதை,’ ஆனால் இங்கு ஒருவருடைய பிள்ளை அல்லது சந்ததியைக் குறிக்கிறது.
- source_word: לַמֹּלֶךְ
  choice: மோலேக்குக்கு
  rationale: தடைசெய்யப்பட்ட வழிபாட்டுடன் தொடர்புடைய பெயர் அல்லது அடைமொழியை விளக்கமாக மாற்றாமல் ஒலிபெயர்க்கிறது.
- source_word: לְבִלְתִּי הָמִית אֹתוֹ
  choice: அவனைக் கொல்லாதபடி
  rationale: அந்த மனிதனைப் புறக்கணிப்பதன் நோக்கம் அல்லது விளைவாக, சட்டப்படி அவனுக்கு மரணதண்டனை நிறைவேற்றப்படாமல் போவதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: לַמֹּלֶךְ என்ற வழிபாட்டு பெறுநரின் அடையாளம்
  choice: மோலேக்கு
  alternative: அரசனுக்கு
  rationale: லேவியராகமம் 18:21 மற்றும் 20:2–5 ஆகியவற்றின் சூழல், தடைசெய்யப்பட்ட வழிபாட்டின் பெறுநருடைய பெயர் அல்லது அடைமொழி என்பதையே வலுவாக ஆதரிக்கிறது. ஒலிபெயர்ப்பு அந்த அடையாளத்தை விளக்கவுரையால் குறுக்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் புரியக்கூடிய, சட்டவிதிக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘கண்டும் காணாமல்’ என்பது வழக்கிலுள்ள இயல்பான மரபுத்தொடர்; ‘வேண்டுமென்றே’ என்பது எபிரேய வலியுறுத்தலை வெளிப்படுத்துகிறது. வசனம் அடுத்த வசனத்தில் தொடரும் நிபந்தனை வாக்கியம் என்பதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
