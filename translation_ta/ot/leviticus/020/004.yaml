- from: ஆனால், அந்த மனிதன் தன் சந்ததியாரில் ஒருவரை[b] மோலேக்குக்குக்[c] கொடுக்கும்போது, அவனைக் கொல்லாதபடி நாட்டின் மக்கள் வேண்டுமென்றே அவனைக் கண்டும் காணாமல் இருந்தால்[a],
