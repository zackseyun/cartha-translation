  text: וְ/אִ֗ישׁ אֲשֶׁ֤ר יִשְׁכַּב֙ אֶת דֹּ֣דָת֔/וֹ עֶרְוַ֥ת דֹּד֖/וֹ גִּלָּ֑ה חֶטְאָ֥/ם יִשָּׂ֖אוּ עֲרִירִ֥ים יָמֻֽתוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/020.yaml
  text: If a man lies with his aunt[a], he has uncovered his uncle’s nakedness. They shall bear their sin[b]; they shall die childless.
translation:
  language: ta
  text: ஒருவன் தன் தந்தையின் சகோதரரின் மனைவியுடன் உடலுறவு கொண்டால், அவன் தன் தந்தையின் சகோதரரின் நிர்வாணத்தை வெளிப்படுத்தினான்.[a] அவர்கள் தங்கள் பாவத்தைச் சுமப்பார்கள்[b]; பிள்ளைகளற்றவர்களாக இறப்பார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “தன் தந்தையின் சகோதரரின் நிர்வாணத்தை அவன் வெளிப்படுத்தினான்.” தந்தையின் சகோதரரின் மனைவியுடன் உடலுறவு கொண்டு, தடைசெய்யப்பட்ட உறவுப் பிணைப்பை மீறுவதைக் குறிக்கும் லேவியராகமத்தின் மொழிநடை இது.'
    reason: cultural_note
  - marker: b
    text: அல்லது, “அவர்கள் தங்கள் குற்றப்பழியைச் சுமப்பார்கள்.” இதற்கான எபிரெய மொழிநடை பாவத்தையோ, அதற்குரிய குற்றப்பொறுப்பையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ אֲשֶׁר
  choice: ஒருவன் … கொண்டால்
  rationale: இது மேலும் ஒரு சட்ட வழக்கை அறிமுகப்படுத்தும் நிபந்தனை அமைப்பு. ஆண்பால் ஒருமையைத் தக்கவைத்து, தமிழில் இயல்பாக ‘ஒருவன் … கொண்டால்’ என்று மொழிபெயர்க்கப்படுகிறது.
- source_word: יִשְׁכַּב אֶת
  choice: உடலுறவுகொண்டால்
  rationale: இச்சூழலில் שׁכב என்பது பாலுறவைக் குறிக்கும் வழக்குச்சொல். தமிழில் தவறான மெல்லுரையையோ வெறும் சேர்ந்து படுத்தலையோ உணர்த்தாமல் பொருளைத் தெளிவாகச் சொல்கிறது.
- source_word: דֹּדָתוֹ
  choice: தன் தந்தையின் சகோதரனுடைய மனைவி
  rationale: இங்கு குறிக்கப்படுவது தந்தையின் சகோதரனுடைய மனைவி. ‘அத்தை’, ‘சித்தி’, ‘பெரியம்மா’ போன்ற தமிழ்ச் சொற்கள் உறவின் வகையையோ வயது வரிசையையோ தேவையின்றி குறிப்பாக்கக்கூடும்; ஆகவே உறவை முழுமையாகச் சொல்வது துல்லியமானது.
- source_word: עֶרְוַת דֹּדוֹ גִּלָּה
  choice: தன் தந்தையின் சகோதரனுடைய நிர்வாணத்தை வெளிப்படுத்தியிருக்கிறான்
  rationale: தடைசெய்யப்பட்ட உறவுப் பிணைப்பை பாலுறவால் மீறுவதைக் குறிக்கும் லேவியராகமத்தின் நிலையான மொழிநடையை இது பாதுகாக்கிறது. செயல் அந்த மனைவியுடன் நிகழ்ந்தாலும், எபிரெய உரை அதை அவளுடைய கணவனின் நிர்வாணத்தை வெளிப்படுத்துதல் என்று கூறுகிறது.
- source_word: חֶטְאָם יִשָּׂאוּ
  choice: அவர்கள் தங்கள் பாவத்தைச் சுமப்பார்கள்
  rationale: பன்மை வடிவங்கள் இருவரையும் பொறுப்புக்குரியவர்களாகக் காட்டுகின்றன. ‘பாவத்தைச் சுமத்தல்’ என்ற எபிரெய மொழிநடையைத் தக்கவைக்கிறது; ‘குற்றப்பழியைச் சுமப்பார்கள்’ என்பதும் சாத்தியமான பொருள்.
- source_word: עֲרִירִים יָמֻתוּ
  choice: பிள்ளைகளற்றவர்களாக இறப்பார்கள்
  rationale: பிள்ளைகள் அல்லது சந்ததி இல்லாத நிலையும் மரணமும் ஆகிய இரு கூறுகளையும் சுருக்கமாகத் தக்கவைக்கிறது; தண்டனை எவ்வாறு நிறைவேறும் என்பதை உரைக்கு அப்பால் விளக்கவில்லை.
theological_decisions:
- issue: עֲרִירִים יָמֻתוּ என்ற தண்டனைத் தொடரின் பொருள்
  choice: பிள்ளைகளற்றவர்களாக இறப்பார்கள்
  alternative: பிள்ளைப்பேறற்றவர்களாக இறப்பார்கள் / உயிர்வாழும் சந்ததியின்றி இறப்பார்கள்
  rationale: எபிரெய உரை தண்டனையின் செயல்முறையை விளக்காமல் அதன் முடிவு அல்லது நிலையையே கூறுகிறது. தேர்ந்த மொழிபெயர்ப்பு அந்தச் சுருக்கத்தையும் தெளிவின்மையையும் பாதுகாக்கிறது.
- issue: חֶטְאָם என்பதிலுள்ள ‘பாவம்’ மற்றும் ‘குற்றப்பழி’ பொருள் நிழல்கள்
  choice: தங்கள் பாவத்தைச் சுமப்பார்கள்
  alternative: தங்கள் குற்றப்பழியைச் சுமப்பார்கள்
  rationale: חטא என்பது பாவத்தையோ அதனால் ஏற்படும் குற்றப்பொறுப்பையோ குறிக்கலாம். முதன்மை உரையில் நேரடியான ‘பாவம்’ வைக்கப்பட்டு, மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குத் தெளிவானதும் கண்ணியமானதும் ஆன சட்டநடை பயன்படுத்தப்பட்டுள்ளது. தமிழின் உறவுமுறைச் சொற்கள் தந்தையின் சகோதரனுடைய வயது வரிசையை தேவையின்றி குறிப்பாக்காதபடி, உறவு விளக்கமாக எழுதப்பட்டுள்ளது. எபிரெய மூலத்தின் ‘நிர்வாணத்தை வெளிப்படுத்துதல்’ என்ற முக்கிய உருவகம் பாதுகாக்கப்பட்டுள்ளது.
