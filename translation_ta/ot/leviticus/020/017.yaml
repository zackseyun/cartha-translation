revisions:
- from: ஒருவன் தன் சகோதரியை—தன் தகப்பனின் மகளையோ தன் தாயின் மகளையோ—தனக்கென்று எடுத்துக்கொண்டு, அவளுடைய நிர்வாணத்தை அவன் காணவும் அவனுடைய நிர்வாணத்தை அவள் காணவும் செய்தால், அது அவமானகரமான செயல்[a]. அவர்கள் தங்கள் மக்களின் கண்முன்னே அறுத்துப்போடப்படுவார்கள்[b]. அவன் தன் சகோதரியின் நிர்வாணத்தை வெளிப்படுத்தியிருக்கிறான்; அவன் தன் குற்றத்தைச் சுமப்பான்.
  to: ஒருவன் தன் சகோதரியை—தன் தந்தையின் மகளையோ தன் தாயின் மகளையோ—எடுத்துக்கொண்டு, அவளுடைய நிர்வாணத்தை அவன் காணவும் அவனுடைய நிர்வாணத்தை அவள் காணவும் செய்தால், அது வெட்கக்கேடான செயல்[a]. அவர்கள் தங்கள் இனத்தாரின் கண்முன்னே அறுத்து நீக்கப்படுவார்கள்[b]. அவன் தன் சகோதரியின் நிர்வாணத்தை வெளிப்படுத்தியிருக்கிறான்; அவன் தன் குற்றத்தைச் சுமப்பான்.
  rationale: The revision removes an added nuance from ‘takes,’ clarifies the Hebrew public-community expression, and uses more natural modern standard Tamil for the rare negative sense of חֶסֶד. It continues to preserve the source’s legal idioms, the singular final liability of the man, and the disputed exact force of the cut-off penalty.
