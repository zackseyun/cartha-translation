review_pass:
  verdict: revise
  source_fidelity: The draft follows the Hebrew legal sequence and preserves the deliberate ambiguity of ‘cut off.’ However, ‘தனக்கென்று எடுத்துக்கொண்டு’ adds an unnecessary possessive/self-directed nuance not expressed by יִקַּח, and ‘தங்கள் மக்களின் கண்முன்னே’ can naturally mean ‘before their own children,’ rather than the members/sons of their people.
  naturalness: The legal register is generally clear and modern. Replacing ‘தகப்பன்’ with ‘தந்தை’ and rendering the public-social phrase as ‘தங்கள் இனத்தாரின் கண்முன்னே’ gives more idiomatic modern standard Tamil without weakening the formal legal style.
  terminology: ‘நிர்வாணம்,’ ‘வெளிப்படுத்தியிருக்கிறான்,’ and ‘குற்றத்தைச் சுமப்பான்’ appropriately retain the legal-sexual idioms. ‘வெட்கக்கேடான செயல்’ is a more direct and natural rendering of the rare negative sense of חֶסֶד. ‘அறுத்து நீக்கப்படுவார்கள்’ retains the cut-off image while avoiding an implication of literal dismemberment.
  issues:
  - severity: medium
    issue: ‘தனக்கென்று எடுத்துக்கொண்டு’ adds nuance to יִקַּח.
    rationale: The Hebrew says simply ‘takes’; ‘தனக்கென்று’ can suggest taking for oneself in a way that is not required by the source.
  - severity: medium
    issue: ‘தங்கள் மக்களின் கண்முன்னே’ is ambiguous in Tamil.
    rationale: It may be understood as ‘in front of their children.’ The Hebrew refers to the social group, literally the sons of their people; ‘தங்கள் இனத்தாரின் கண்முன்னே’ conveys this naturally.
  - severity: low
    issue: ‘அவமானகரமான செயல்’ is less idiomatic and less forceful than needed.
    rationale: In this legal context, חֶסֶד denotes a shameful/reproachful act. ‘வெட்கக்கேடான செயல்’ is natural Tamil and preserves the negative sense.
  revised_text: ஒருவன் தன் சகோதரியை—தன் தந்தையின் மகளையோ தன் தாயின் மகளையோ—எடுத்துக்கொண்டு, அவளுடைய நிர்வாணத்தை அவன் காணவும் அவனுடைய நிர்வாணத்தை அவள் காணவும் செய்தால், அது வெட்கக்கேடான செயல்[a]. அவர்கள் தங்கள் இனத்தாரின் கண்முன்னே அறுத்து நீக்கப்படுவார்கள்[b]. அவன் தன் சகோதரியின் நிர்வாணத்தை வெளிப்படுத்தியிருக்கிறான்; அவன் தன் குற்றத்தைச் சுமப்பான்.
