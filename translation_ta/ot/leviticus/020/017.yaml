base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/017.yaml
  text: If a man takes his sister[a], his father's daughter or his mother's daughter, and sees her nakedness, and she sees his nakedness, it is a disgrace, and they shall be cut off in the sight of the sons of their people. He has uncovered his sister's nakedness[b]; he shall bear his guilt.
translation:
  language: ta
  text: ஒருவன் தன் சகோதரியை—தன் தந்தையின் மகளையோ தன் தாயின் மகளையோ—எடுத்துக்கொண்டு, அவளுடைய நிர்வாணத்தை அவன் காணவும் அவனுடைய நிர்வாணத்தை அவள் காணவும் செய்தால், அது வெட்கக்கேடான செயல்[a]. அவர்கள் தங்கள் இனத்தாரின் கண்முன்னே அறுத்து நீக்கப்படுவார்கள்[b]. அவன் தன் சகோதரியின் நிர்வாணத்தை வெளிப்படுத்தியிருக்கிறான்; அவன் தன் குற்றத்தைச் சுமப்பான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு வரும் எபிரெயச் சொல் חֶסֶד பொதுவாக ‘அன்பு’ அல்லது ‘உறுதியான அன்பு’ என்று பொருள்படும்; ஆனால் இவ்விடத்தில் அரிதான எதிர்மறைப் பொருளில் ‘வெட்கக்கேடான செயல்’ அல்லது ‘பழிக்குரிய செயல்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘அறுத்து நீக்கப்படுவார்கள்’ என்பது எபிரெயச் சட்டச் சூத்திரத்தைப் பாதுகாக்கிறது; அது மரணதண்டனையா, சமூகத்திலிருந்து விலக்கப்படுவதா, அல்லது வேறொரு வகையான அகற்றலா என்பதை இச்சொற்றொடர் மட்டும் தெளிவுபடுத்தவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ
  choice: ஒருவன்
  rationale: எபிரெய ஆண்பால் ஒருமையையும் சட்ட உரையின் நேரடியான வடிவத்தையும் இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: יִקַּח
  choice: தனக்கென்று எடுத்துக்கொண்டு
  rationale: ‘எடுத்துக்கொள்’ என்ற அடிப்படைப் பொருளைக் காக்கிறது; திருமணம் செய்துகொள்வது அல்லது பாலுறவு கொள்வது என்று உரையில் இருப்பதைவிடக் குறிப்பாக்காமல், இச்சூழலின் பாலியல் உட்பொருளையும் உணர்த்துகிறது.
- source_word: אֲחֹתוֹ בַּת אָבִיו אוֹ בַת אִמּוֹ
  choice: தன் சகோதரியை—தன் தகப்பனின் மகளையோ தன் தாயின் மகளையோ—
  rationale: தந்தைவழி அல்லது தாய்வழிச் சகோதரி இருவரும் இதில் அடங்குவர் என்ற எபிரெய விளக்கத்தைத் தெளிவாகக் காக்கிறது.
- source_word: וְרָאָה אֶת עֶרְוָתָהּ וְהִיא תִרְאֶה אֶת עֶרְוָתוֹ
  choice: அவளுடைய நிர்வாணத்தை அவன் காணவும் அவனுடைய நிர்வாணத்தை அவள் காணவும்
  rationale: முறைகேடான பாலியல் உறவைக் குறிக்கும் ‘நிர்வாணத்தைக் காணுதல்’ என்ற லேவியராகமச் சொல்லோவியத்தை விளக்கமாக மாற்றாமல் காக்கிறது.
- source_word: חֶסֶד
  choice: அவமானகரமான செயல்
  rationale: இங்கு வழக்கமான ‘அன்பு/உறுதியான அன்பு’ என்ற நேர்மறைப் பொருள் பொருந்தாது; அரிதான எதிர்மறைப் பயன்பாட்டில் வெட்கக்கேடான அல்லது அவமானமான செயலைக் குறிக்கிறது.
- source_word: וְנִכְרְתוּ
  choice: அறுத்துப்போடப்படுவார்கள்
  rationale: כרת என்ற சட்டத் தீர்ப்பு மொழியின் உருவகத்தைத் தக்கவைத்து, அது மரணதண்டனையா, சமூக விலக்கலா, வேறொரு அகற்றலா என்பதைத் தீர்மானிக்காமல் விடுகிறது.
- source_word: לְעֵינֵי בְּנֵי עַמָּם
  choice: தங்கள் மக்களின் கண்முன்னே
  rationale: ‘அவர்களுடைய மக்களின் பிள்ளைகளின் கண்களுக்கு முன்’ என்ற எபிரெய சமூகச் சொற்றொடரை இயல்பான தமிழில் நெருக்கமாக வழங்குகிறது.
- source_word: גִּלָּה
  choice: வெளிப்படுத்தியிருக்கிறான்
  rationale: ‘நிர்வாணத்தை வெளிப்படுத்துதல்’ என்ற சுற்றியுள்ள பாலியல் சட்டங்களின் முக்கிய சொல்லிணைப்பைப் பாதுகாக்கிறது.
- source_word: עֲוֺנוֹ יִשָּׂא
  choice: அவன் தன் குற்றத்தைச் சுமப்பான்
  rationale: குற்றத்தையும் அதன் விளைவையும் சுமத்தும் எபிரெய சட்ட-இறையியல் சூத்திரத்தின் இரட்டை நுணுக்கத்தையும் இயன்றவரை காக்கிறது.
theological_decisions:
- issue: חֶסֶד என்பதன் இவ்வசனப் பொருள்
  choice: அவமானகரமான செயல்
  alternative: அன்பு அல்லது உறுதியான அன்பு
  rationale: சொல்லின் வழக்கமான நேர்மறைப் பொருள் இத்தடை மற்றும் தண்டனைச் சூழலுக்குப் பொருந்தாது; இங்கு அதன் அரிதான எதிர்மறைப் பொருளே தேவைப்படுகிறது.
- issue: ‘அறுத்துப்போடப்படுவார்கள்’ என்ற தண்டனையின் தன்மை
  choice: தண்டனையின் முறையைக் குறிப்பிடாமல் எபிரெய சட்டச் சூத்திரத்தைப் பாதுகாத்தல்
  alternative: மரணதண்டனை அல்லது சமூகத்திலிருந்து வெளியேற்றம் என்று வெளிப்படையாகக் குறிப்பிடுதல்
  rationale: இவ்விடத்தில் எபிரெயச் சொற்றொடர் தண்டனை நிறைவேற்றப்படும் துல்லியமான முறையைத் தானாக வரையறுக்கவில்லை; ஆகவே உண்மையான தெளிவின்மை காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியக்கூடிய அதேவேளையில் சட்ட உரைக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டது. ‘நிர்வாணத்தைக் காணுதல்,’ ‘நிர்வாணத்தை வெளிப்படுத்துதல்,’ ‘அறுத்துப்போடப்படுதல்,’ ‘குற்றத்தைச் சுமத்தல்’ ஆகிய எபிரெய உருவகங்களும் சட்டச் சூத்திரங்களும் தேவையற்ற விளக்கவுரையின்றி பாதுகாக்கப்பட்டன.
