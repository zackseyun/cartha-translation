  yaml_path: translation/ot/leviticus/020/005.yaml
  text: then I myself will set my face against that man and against his family[a], and I will cut off him and all who prostitute themselves after him by prostituting themselves after Molech[b], from among their people.
translation:
  language: ta
  text: 'அப்போது நானே அந்த மனிதனுக்கும் அவனுடைய குடும்பத்துக்கும் எதிராக என் முகத்தைத் திருப்புவேன். அவனையும், அவனைப் பின்பற்றி வேசித்தனம் செய்து, மோளேக்கைப் பின்பற்றி வேசித்தனம் செய்கிற[a] அனைவரையும், அவர்களுடைய மக்களிடமிருந்து அறுத்துப்போடுவேன்.[b]


    [a] “வேசித்தனம் செய்கிற” என்பது இங்கு சிலைவழிபாட்டின் மூலம் உடன்படிக்கைக்குத் துரோகம் செய்வதைப் பாலியல் உண்மையின்மையின் உருவகத்தால் கூறுகிறது.


    [b] “அறுத்துப்போடுவேன்” என்பது உடன்படிக்கைத் தீர்ப்பைக் குறிக்கும் சொற்றொடர். இது மரணம், சமூகத்திலிருந்து விலக்கப்படுதல் அல்லது வேறொரு வகையான தெய்வீக அகற்றம் ஆகியவற்றில் எதைக் குறிக்கிறது என்பதை இவ்வசனம் குறிப்பாகச் சொல்லவில்லை.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “வேசித்தனம் செய்கிற” என்பது இங்கு சிலைவழிபாட்டின் மூலம் உடன்படிக்கைக்குத் துரோகம் செய்வதைப் பாலியல் உண்மையின்மையின் உருவகத்தால் கூறுகிறது.
    reason: lexical_alternative
  - marker: b
    text: “அறுத்துப்போடுவேன்” என்பது உடன்படிக்கைத் தீர்ப்பைக் குறிக்கும் சொற்றொடர். இது மரணம், சமூகத்திலிருந்து விலக்கப்படுதல் அல்லது வேறொரு வகையான தெய்வீக அகற்றம் ஆகியவற்றில் எதைக் குறிக்கிறது என்பதை இவ்வசனம் குறிப்பாகச் சொல்லவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי אֲנִי אֶת־פָּנַי
  choice: அப்போது நானே ... எதிராக என் முகத்தைத் திருப்புவேன்
  rationale: எதிர்ப்பையும் தீர்ப்பையும் குறிக்கும் எபிரெயச் சொற்றொடரைத் தெளிவான தமிழில் தக்கவைக்கிறது; אֲנִי தரும் வலியுறுத்தலை “நானே” காட்டுகிறது.
- source_word: בָּאִישׁ הַהוּא וּבְמִשְׁפַּחְתּוֹ
  choice: அந்த மனிதனுக்கும் அவனுடைய குடும்பத்துக்கும் எதிராக
  rationale: אִישׁ என்பதன் ஆண்பால் ஒருமையையும், מִשְׁפָּחָה என்பதன் குடும்பம்/விரிவான உறவுக்குழு சார்ந்த பொருள் பரப்பையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְהִכְרַתִּי אֹתוֹ
  choice: அவனை ... அறுத்துப்போடுவேன்
  rationale: உடன்படிக்கைத் தீர்ப்புக்குரிய כרת வினையின் உருவகத்தைப் பாதுகாக்கிறது; தண்டனையின் முறையைத் தேவையின்றி விளக்கித் தீர்மானிக்கவில்லை.
- source_word: וְאֵת כָּל־הַזֹּנִים אַחֲרָיו לִזְנוֹת אַחֲרֵי הַמֹּלֶךְ
  choice: அவனைப் பின்பற்றி வேசித்தனம் செய்து மோளேக்கைப் பின்பற்றி வேசித்தனம் செய்கிற அனைவரையும்
  rationale: זנה வினையின் பாலியல் உண்மையின்மை உருவகத்தையும், மூலத்தில் அது இருமுறை வருவதால் உண்டாகும் வலியுறுத்தலையும் தக்கவைக்கிறது; אַחֲרָיו மற்றும் אַחֲרֵי ஆகியவற்றை “பின்பற்றி” என இயல்பாகக் காட்டுகிறது.
- source_word: הַמֹּלֶךְ
  choice: மோளேக்
  rationale: இச்சூழலில் தெய்வத்தின் மரபான பெயராகப் புரிந்துகொள்ளப்படும் சொல்லைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: מִקֶּרֶב עַמָּם
  choice: அவர்களுடைய மக்களின் நடுவிலிருந்து
  rationale: עַמָּם என்பதிலுள்ள பன்மை உடைமைப் பின்னொட்டைத் தக்கவைத்து, சமூகத்தின் மத்தியிலிருந்து அகற்றப்படுதலை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: சிலைவழிபாட்டுக்கான பாலியல் உண்மையின்மை உருவகம்
  choice: “வேசித்தனம் செய்கிற” என்ற உருவகத்தை முதன்மை உரையில் தக்கவைத்தல்
  alternative: “உண்மையற்றவர்களாக இருக்கிற” அல்லது “சிலைவழிபாடு செய்கிற” என்று நேரடியாக்குதல்
  rationale: எபிரெய உரை சிலைவழிபாட்டை உடன்படிக்கை சார்ந்த பாலியல் துரோகமாகக் கடுமையாகச் சித்தரிக்கிறது. பொதுப்பொருளாக மாற்றுவது அதன் இறையியல் மற்றும் சொல்லாட்சிச் செறிவைக் குறைக்கும்.
- issue: உடன்படிக்கைத் தீர்ப்பில் ‘அறுத்துப்போடுதல்’ என்பதன் பொருள்
  choice: தண்டனையின் முறையைக் குறிப்பிடாமல் “அறுத்துப்போடுவேன்” என வைத்தல்
  alternative: “கொன்றுபோடுவேன்,” “சமூகத்திலிருந்து விலக்குவேன்,” அல்லது “அழிப்பேன்”
  rationale: இவ்விடத்தில் தீர்ப்பு தெய்வீகமானது என்பது தெளிவு; ஆனால் அது எவ்வாறு நிறைவேறும் என்பதை உரை வரையறுக்கவில்லை. ஆகவே அந்தத் தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகமச் சட்ட உரைக்கு ஏற்ற கண்ணியத்துடனும் மொழிபெயர்க்கப்பட்டது. மூலத்தின் கடுமையான உருவகமும் உடன்படிக்கைத் தீர்ப்பின் திட்டமிட்ட தெளிவின்மையும் பாதுகாக்கப்பட்டுள்ளன. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்றொடர்களுக்குப் பின் வசன முடிவில் இணைக்கப்பட்டுள்ளன.
