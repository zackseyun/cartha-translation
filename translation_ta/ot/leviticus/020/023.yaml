  text: וְ/לֹ֤א תֵֽלְכוּ֙ בְּ/חֻקֹּ֣ת הַ/גּ֔וֹי אֲשֶׁר אֲנִ֥י מְשַׁלֵּ֖חַ מִ/פְּנֵי/כֶ֑ם כִּ֤י אֶת כָּל אֵ֨לֶּה֙ עָשׂ֔וּ וָ/אָקֻ֖ץ בָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/023.yaml
  text: And you shall not walk in the statutes of the nation that I am driving out before you[a], because they did all these things[c][b], and I loathed them.
translation:
  language: ta
  text: உங்கள் முன்னிலையிலிருந்து நான் துரத்திவிடுகிற[b] அந்த இனத்தின் நியமங்களின்படி[a] நீங்கள் நடக்கக் கூடாது. ஏனெனில் அவர்கள் இவை அனைத்தையும் செய்தார்கள்; நான் அவர்களை அருவருத்தேன்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நியமங்கள்’ என்பதற்குப் பதிலாக ‘பழக்கவழக்கங்கள்’ அல்லது ‘நிர்ணயிக்கப்பட்ட நடைமுறைகள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘துரத்திவிடுகிற’ என்பது சொல்லுக்குச் சொல் ‘உங்கள் முன்னிலையிலிருந்து அனுப்புகிற’ என்று வரும்; இங்கு வெளியேற்றுவது பொருள்.
    reason: lexical_alternative
  - marker: c
    text: ‘அருவருத்தேன்’ என்பதற்குப் பதிலாக ‘கடும் வெறுப்புக்கொண்டேன்’ என்றும் மொழிபெயர்க்கலாம். ‘அவர்களை’ என்பது அந்தச் செயல்களைச் செய்த மக்களைச் சுட்டுகிறது; அவர்களுடைய செயல்களே இந்த அருவருப்புக்குக் காரணம்.
    reason: lexical_and_referential_clarification
lexical_decisions:
- source_word: תֵלְכוּ
  choice: நீங்கள் நடக்கக் கூடாது
  rationale: הלך என்பதன் அடிப்படைப் பொருளான ‘நடத்தல்’ என்ற உருவகத்தையும், ஒழுக்க நடத்தையைச் சுட்டும் உடன்படிக்கைச் சூழலையும் இயல்பான தமிழில் காக்கிறது.
- source_word: בְּחֻקֹּת
  choice: நியமங்களின்படி
  rationale: חֻקּוֹת என்பது நிர்ணயிக்கப்பட்ட விதிமுறைகள், பழக்கவழக்கங்கள் அல்லது கடைப்பிடிப்புகளைக் குறிக்கலாம். இங்கு சட்ட-ஒழுக்க வலிமையைத் தக்கவைத்தபடி நடத்தை சார்ந்த பொருளையும் தருகிறது.
- source_word: הַגּוֹי
  choice: அந்த இனத்தார்
  rationale: எபிரெயச் சொல் ஒருமையில் இருந்தாலும், அடுத்து வரும் பன்மை வினைச்சொற்கள் அதை ஒரு கூட்டு மக்களினமாகக் காட்டுகின்றன. ‘இனத்தார்’ என்பது அந்தக் கூட்டு எண்ணத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מְשַׁלֵּחַ מִפְּנֵיכֶם
  choice: உங்கள் முன்னிலையிலிருந்து நான் துரத்திவிடுகிற
  rationale: சொல்லுக்குச் சொல் ‘உங்கள் முன்னிலையிலிருந்து அனுப்புகிற’ என்றாலும், நிலத்திலிருந்து அகற்றும் இச்சூழலில் வெளியேற்றுதல் அல்லது துரத்துதல் என்பதே நோக்குப்பொருள்.
- source_word: כִּי אֶת כָּל אֵלֶּה עָשׂוּ
  choice: ஏனெனில் அவர்கள் இவை அனைத்தையும் செய்தார்கள்
  rationale: כִּי இங்கு காரணத்தை அறிமுகப்படுத்துகிறது; ‘இவை அனைத்தும்’ முந்தைய வசனங்களில் தடைசெய்யப்பட்ட செயல்களைச் சுட்டுகிறது.
- source_word: וָאָקֻץ בָּם
  choice: நான் அவர்களை அருவருத்தேன்
  rationale: קוץ கடும் வெறுப்பையும் ஒழுக்க ரீதியான அருவருப்பையும் குறிக்கிறது. בָּם குறிக்கும் பன்மை对象த்தைத் தீர்மானமாக மென்மைப்படுத்தாமல் ‘அவர்களை’ என வழங்குகிறது.
theological_decisions:
- issue: தேவனுடைய கடும் ஒழுக்க அருவருப்பை வெளிப்படுத்துதல்
  choice: நான் அவர்களை அருவருத்தேன்
  alternative: நான் அவர்களை வெறுத்தேன் / அவர்கள் எனக்கு அருவருப்பானார்கள்
  rationale: மூலச்சொல்லின் வலிமையான உணர்வை மென்மைப்படுத்தாமல் காக்கிறது; அதேவேளை வசனத்தைத் தாண்டிய மனித உணர்ச்சியியல் விளக்கத்தைச் சேர்க்கவில்லை.
- issue: בָּם என்பதன் சுட்டுப்பொருள்
  choice: அவர்களை
  alternative: அவற்றை / அவற்றின் காரணமாக
  rationale: இலக்கண வடிவம் பன்மையான சுட்டுப்பொருளைக் கொண்டுள்ளது; உடனடி சூழலில் செயல்களைச் செய்த மக்களைச் சுட்டுவது இயல்பானது. இருப்பினும் செயல்களுடன் உள்ள நெருங்கிய தொடர்பை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘நடக்க’ என்ற எபிரெய உருவகம் தமிழிலும் ஒழுக்க நடத்தையை இயல்பாகக் குறிக்கும் என்பதால் காக்கப்பட்டுள்ளது. ‘இனத்தார்’ கூட்டு ஒருமை மற்றும் தொடர்ந்து வரும் பன்மைச் செயல்களை இணைக்கிறது.
