id: LEV.20.21
reference: Leviticus 20:21
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/אִ֗ישׁ אֲשֶׁ֥ר יִקַּ֛ח אֶת אֵ֥שֶׁת אָחִ֖י/ו נִדָּ֣ה הִ֑וא עֶרְוַ֥ת אָחִ֛י/ו גִּלָּ֖ה עֲרִירִ֥ים יִהְיֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/021.yaml
  text: And if a man takes his brother’s wife[a], it is uncleanness; he has uncovered his brother’s nakedness[b]. They shall be childless.
translation:
  language: ta
  text: ஒருவன் தன் சகோதரனுடைய மனைவியை எடுத்துக்கொண்டால், அது தீட்டு[a]; அவன் தன் சகோதரனின் நிர்வாணத்தை வெளிப்படுத்தியிருக்கிறான். அவர்கள் பிள்ளையற்றவர்களாக இருப்பார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அது அசுத்தம்’ அல்லது ‘அது மாசுபடுத்தும் செயல்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் சடங்கு மற்றும் ஒழுக்கம் சார்ந்த தீட்டைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: ‘அவர்கள் பிள்ளையில்லாமல் இறப்பார்கள்’ என்றும் பொருள் கொள்ளப்படுகிறது. ஆனால் எபிரெய மூலத்தில் இன்னும் சொற்படையாக, ‘அவர்கள் பிள்ளையற்றவர்களாக இருப்பார்கள்’ என்றே உள்ளது; இந்தத் தீர்ப்பு எவ்வாறு நிறைவேறும் என்பது குறிப்பிடப்படவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִישׁ אֲשֶׁר
  choice: ஒருவன் ... எடுத்துக்கொண்டால்
  rationale: சுற்றியுள்ள வழக்குச் சட்டங்களுடன் இணையும் நிபந்தனை அமைப்பை இயல்பான நவீனத் தமிழில் காட்டுகிறது.
- source_word: יִקַּח
  choice: எடுத்துக்கொண்டால்
  rationale: לקח என்பதன் அடிப்படைப் பொருளான ‘எடுத்துக்கொள்’ என்பதைப் பேணுகிறது; திருமணச் சடங்கு நடந்ததாக மூலத்தைவிடக் கூடுதலாகக் குறிப்பிடுவதில்லை.
- source_word: אֵשֶׁת אָחִיו
  choice: தன் சகோதரனுடைய மனைவியை
  rationale: எபிரெயக் கூட்டு அமைப்பின் நேரடியான பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: נִדָּה הִוא
  choice: அது தீட்டு
  rationale: நִדָּה இங்கு அந்தப் பெண்ணைத் தனிப்பட்ட முறையில் அசுத்தமானவள் என்று அழைக்காமல், உறவு அல்லது செயலைச் சடங்கு-ஒழுக்கத் தீட்டாகக் குறிக்கிறது.
- source_word: עֶרְוַת אָחִיו גִּלָּה
  choice: அவன் தன் சகோதரனின் நிர்வாணத்தை வெளிப்படுத்தியிருக்கிறான்
  rationale: லேவியராகமத்தில் முறைகேடான பாலுறவைக் குறிக்கும் சட்ட மரபுத்தொடரின் உருவகத்தையும், பிற பகுதிகளுடனான சொல்லிணக்கத்தையும் பேணுகிறது.
- source_word: עֲרִירִים יִהְיוּ
  choice: அவர்கள் பிள்ளையற்றவர்களாக இருப்பார்கள்
  rationale: பன்மை வடிவத்தின்படி இருவரையும் குறிக்கிறது; தீர்ப்பு எவ்வாறு நிறைவேறும் என்று குறிப்பிடாமல், பிள்ளையின்மையை மட்டும் கூறும் எபிரெயச் சொல்லின் எல்லையைப் பேணுகிறது.
theological_decisions:
- issue: עֲרִירִים יִהְיוּ என்ற தண்டனைத் தொடரின் பொருள்
  choice: அவர்கள் பிள்ளையற்றவர்களாக இருப்பார்கள்
  alternative: அவர்கள் பிள்ளையில்லாமல் இறப்பார்கள்
  rationale: எபிரெயச் சொல் நேரடியாகப் பிள்ளையின்மையையே குறிக்கிறது; மரணத்தையோ தீர்ப்பு நிறைவேறும் முறையையோ வெளிப்படையாகக் கூறவில்லை. ஆகவே மூலத்தில் உள்ள இறையியல் பதற்றம் தீர்க்கப்படாமல் விடப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான சட்டநடை பயன்படுத்தப்பட்டுள்ளது. ‘தீட்டு’ என்பது நִדָּה சொல்லின் சடங்கு-ஒழுக்க நுண்ணுணர்வைச் சுருக்கமாகத் தருகிறது. பாலுறவுக்கான எபிரெய மரபுத்தொடர் விளக்கமாக மாற்றப்படாமல் உருவகத்துடன் பேணப்பட்டுள்ளது.
