  text: וְ/אִ֗ישׁ אֲשֶׁ֤ר יִשְׁכַּב֙ אֶת אֵ֣שֶׁת אָבִ֔י/ו עֶרְוַ֥ת אָבִ֖י/ו גִּלָּ֑ה מֽוֹת יוּמְת֥וּ שְׁנֵי/הֶ֖ם דְּמֵי/הֶ֥ם בָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/011.yaml
  text: If a man lies with his father's wife[a], he has uncovered his father's nakedness; both of them shall surely be put to death[b]; their blood is on them.
translation:
  language: ta
  text: ஒருவன் தன் தந்தையின் மனைவியோடு உடலுறவு கொண்டால், அவன் தன் தந்தையின் நிர்வாணத்தை வெளிப்படுத்தியிருக்கிறான்[a]. அவர்கள் இருவரும் நிச்சயமாகக் கொல்லப்பட வேண்டும்; அவர்களுடைய இரத்தம் அவர்கள்மேல் இருக்கிறது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “தன் தந்தையின் நிர்வாணத்தை வெளிப்படுத்தியிருக்கிறான்” என்று உள்ளது. இது தடைசெய்யப்பட்ட பாலுறவைக் குறிக்க லேவியராகமத்தில் பயன்படுத்தப்படும் நிலையான மரபுத்தொடர்; விளக்கமாக, “பாலியல் முறையில் தன் தந்தையை அவமதித்திருக்கிறான்” எனலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “அவர்களுடைய இரத்தம் அவர்கள்மேல் இருக்கிறது.” தங்கள் மரணத்திற்கான பொறுப்பு அவர்களுக்கே உரியது என்பதைக் குறிக்கும் சட்டச் சூத்திரம் இது.
    reason: cultural_note
lexical_decisions:
- source_word: וְאִישׁ אֲשֶׁר
  choice: ஒருவன் ... கொண்டால்
  rationale: எபிரெய சட்ட வழக்கில் வரும் நிபந்தனை அமைப்பை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; ஆண்பால் சட்டப் பொருளையும் காக்கிறது.
- source_word: יִשְׁכַּב אֶת
  choice: உடலுறவு கொண்டால்
  rationale: இங்கு வினைச்சொல் பாலுறவைக் குறிக்கிறது. தமிழில் ‘படுத்தால்’ என்பது தேவையற்ற மயக்கத்தை ஏற்படுத்தலாம்; ‘உடலுறவு கொண்டால்’ பொருளைத் தெளிவாகவும் கண்ணியமாகவும் தருகிறது.
- source_word: אֵשֶׁת אָבִיו
  choice: தன் தகப்பனுடைய மனைவி
  rationale: ‘மாற்றாந்தாய்’ எனக் குறுக்காமல், மூலத்தின் சட்டரீதியான ‘தகப்பனுடைய மனைவி’ என்ற சொல்லாக்கத்தைப் பாதுகாக்கிறது.
- source_word: עֶרְוַת אָבִיו גִּלָּה
  choice: தன் தகப்பனுடைய நிர்வாணத்தை வெளிப்படுத்தியிருக்கிறான்
  rationale: லேவியராகமம் 18 மற்றும் 20 அதிகாரங்களோடு உள்ள சொற்றொடர்பைப் பாதுகாக்கும் நிலையான பாலியல்-சட்ட மரபுத்தொடரை நேரடியாக வழங்குகிறது.
- source_word: מוֹת יוּמְתוּ שְׁנֵיהֶם
  choice: அவர்கள் இருவரும் நிச்சயமாகக் கொல்லப்பட வேண்டும்
  rationale: எபிரெய infinitive absolute தரும் வலியுறுத்தலையும், தண்டனை இருவருக்கும் பொருந்துவதையும் தெளிவாகக் காக்கிறது; கொல்லும் முறையைச் சேர்க்கவில்லை.
- source_word: דְּמֵיהֶם בָּם
  choice: அவர்களுடைய இரத்தப்பழி அவர்கள்மேலேயே இருக்கிறது
  rationale: அவர்களது மரணத்திற்கான பொறுப்பு அவர்களுக்கே உரியது எனக் காட்டும் சட்ட வழக்கை ‘இரத்தப்பழி’ மூலம் புரிந்துகொள்ளத்தக்க தமிழில் வழங்குகிறது.
theological_decisions:
- issue: தடைசெய்யப்பட்ட பாலுறவைக் குறிக்கும் லேவியராகமத்தின் மரபுத்தொடர்
  choice: தன் தகப்பனுடைய நிர்வாணத்தை வெளிப்படுத்தியிருக்கிறான்
  alternative: பாலியல் முறையில் தன் தகப்பனை அவமதித்திருக்கிறான்
  rationale: விளக்கவுரையாக மட்டுப்படுத்தாமல், மூலத்தின் திட்டமிட்ட உருவகத்தையும் மற்ற பரிசுத்தச் சட்டங்களுடனான தொடர்பையும் காக்கிறது.
- issue: சட்டத்தின் பாலினம் குறித்த பொருள்
  choice: ஒருவன்
  alternative: ஒருவர்
  rationale: எபிரெய உரை இங்கு குறிப்பாக ஓர் ஆண் குற்றவாளியைக் குறிக்கிறது; அதனால் பாலினத்தை நடுநிலைப்படுத்தவில்லை.
- issue: மரணத்திற்கான பொறுப்பைக் குறிக்கும் சட்டச் சூத்திரம்
  choice: அவர்களுடைய இரத்தப்பழி அவர்கள்மேலேயே இருக்கிறது
  alternative: அவர்களுடைய இரத்தம் அவர்கள்மேல் இருக்கிறது
  rationale: ‘இரத்தம்’ என்ற உருவகத்தை முற்றிலும் நீக்காமல், இச்சூத்திரம் உடல்மீது இரத்தம் இருப்பதை அல்ல, தங்கள் மரணத்திற்கான பொறுப்பைச் சுட்டுவதைத் தெளிவாக்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான சட்ட நடையில் மொழிபெயர்க்கப்பட்டது. ‘தகப்பன்’ என்பது உறவுச் சட்டத்தின் மரபுசார் தொனியைத் தக்கவைக்கிறது; ‘உடலுறவு’ பாலியல் பொருளைத் தெளிவாகக் கூறுகிறது. மூலத்தின் உருவக மரபுத்தொடர் முதன்மை உரையில் பாதுகாக்கப்பட்டு, அதன் விளக்கம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
