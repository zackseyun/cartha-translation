base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/010.yaml
  text: If a man commits adultery with another man's wife—if he commits adultery with his neighbor's wife—the adulterer and the adulteress shall surely be put to death[a].
translation:
  language: ta
  text: ஒருவன் மற்றொருவனுடைய மனைவியோடு விபசாரம் செய்தால்—அதாவது, தன் அயலானுடைய மனைவியோடு விபசாரம் செய்தால்—விபசாரம் செய்த அவனும் அவளும் நிச்சயமாகக் கொல்லப்பட வேண்டும்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “ஒரு மனிதனுடைய மனைவியோடு ... தன் அயலானுடைய மனைவியோடு” என்று உள்ளது. சட்ட மொழிநடையில் இந்த மறுபடியான கூறல் குற்றத்தை வலியுறுத்தித் தெளிவுபடுத்துகிறது. இங்கு “அயலான்” என்பது அருகில் வசிப்பவரை மட்டும் அல்லாமல் சக சமூக உறுப்பினரையும் குறிக்கலாம்.
    reason: மூலத்தின் சொல்லமைப்பு, மறுபடியான கூறல், மற்றும் רֵעַ என்பதன் பொருள் வரம்பை விளக்குதல்.
lexical_decisions:
- source_word: וְאִישׁ אֲשֶׁר
  choice: ஒருவன் ... செய்தால்
  rationale: இணைப்புச்சொல்லும் தொடர்புப்பெயரும் சேர்ந்து சட்டத்தில் ஒரு நிபந்தனை வழக்கை அறிமுகப்படுத்துகின்றன. நவீன தமிழில் ‘ஒருவன் ... செய்தால்’ என்பது அந்தச் சட்ட நிபந்தனையை இயல்பாகவும், மூலத்தின் ஆண்பால் ஒருமையையும் காத்தும் தெரிவிக்கிறது.
- source_word: יִנְאַף
  choice: விபசாரம் செய்தால்
  rationale: נאף பொதுவான பாலியல் ஒழுக்கக்கேட்டை அல்ல, குறிப்பாக மணவுறவை மீறிய விபசாரத்தைக் குறிக்கிறது. ‘விபசாரம் செய்தல்’ என்பது தெளிவான, வழக்கிலுள்ள தமிழ் இணைச்சொல்.
- source_word: אֶת אֵשֶׁת אִישׁ
  choice: மற்றொருவனுடைய மனைவியோடு
  rationale: சொல்லுக்குச் சொல் பொருள் ‘ஒரு மனிதனுடைய மனைவியோடு.’ குற்றஞ்செய்யும் ஆணைத் தவிர வேறொருவரின் மனைவி என்பதைக் ‘மற்றொருவனுடைய’ என்பது தமிழில் இயல்பாகத் தெளிவுபடுத்துகிறது.
- source_word: אֲשֶׁר יִנְאַף אֶת אֵשֶׁת רֵעֵהוּ
  choice: அதாவது, தன் அயலானுடைய மனைவியோடு விபசாரம் செய்தால்
  rationale: மூலம் குற்றத்தை மீண்டும் கூறி விளக்கி வலியுறுத்துகிறது. ‘அதாவது’ என்பது இரண்டாம் கூறு தனியான புதிய நிபந்தனை அல்ல, முந்தையதன் விளக்கம் என்பதைத் தெளிவாக்குகிறது; வினைச்சொல்லின் மறுபடியான கூறலும் காக்கப்படுகிறது.
- source_word: רֵעֵהוּ
  choice: தன் அயலானுடைய
  rationale: רֵעַ என்பது அருகில் குடியிருப்பவரை மட்டும் அல்லாமல் சக சமூக உறுப்பினர் அல்லது சக மனிதரையும் குறிக்கலாம். நிலைபெற்ற ‘அயலான்’ என்ற சொல் பயன்படுத்தப்பட்டு, அதன் பரந்த பொருள் அடிக்குறிப்பில் சுட்டப்படுகிறது.
- source_word: מוֹת יוּמַת
  choice: நிச்சயமாகக் கொல்லப்பட வேண்டும்
  rationale: முற்றுப்பெயரும் வினைமுற்றும் சேர்ந்த எபிரெயக் கட்டமைப்பு மரணத் தீர்ப்பை வலியுறுத்துகிறது. ‘நிச்சயமாக’ அந்த அழுத்தத்தையும், ‘கொல்லப்பட வேண்டும்’ அதன் செயப்பாட்டு சட்ட வடிவத்தையும் காக்கிறது; கொல்லும் முறை சேர்க்கப்படவில்லை.
- source_word: הַנֹּאֵף וְהַנֹּאָפֶת
  choice: விபசாரம் செய்த அவனும் அவளும்
  rationale: மூலம் குற்றவாளியான ஆணையும் பெண்ணையும் தனித்தனியாகவும் சமச்சீராகவும் குறிப்பிடுகிறது. பெயர்ச்சொல் வடிவங்களைவிட இவ்வுரை நவீன தமிழில் இயல்பாக இருந்து, பாலின வேறுபாட்டையும் வெளிப்படையாகக் காக்கிறது.
theological_decisions:
- issue: பாலினம் குறிக்கப்பட்ட சட்ட மொழி
  choice: வழக்கின் தொடக்கத்தில் ஆண்பால் ‘ஒருவன்’ என்றும், தண்டனையில் ‘அவனும் அவளும்’ என்றும் வெளிப்படையாகக் கூறப்பட்டது.
  alternative: ‘ஒருவர் விபசாரம் செய்தால் ... இருவரும் கொல்லப்பட வேண்டும்’ என்று பாலினப் பொதுமைப்படுத்துதல்.
  rationale: எபிரெய மூலம் வழக்கை ஆண்பாலில் அமைத்து, தண்டனைக்குரிய ஆண் மற்றும் பெண் ஆகிய இரு தரப்பினரையும் தனித்தனியாகக் குறிப்பிடுகிறது. அந்த வடிவத்தைப் பொதுமைப்படுத்தாமல் காப்பது மூலத்துக்கு நெருக்கமானது.
- issue: மரணத் தண்டனையின் வலியுறுத்தலும் முறையும்
  choice: ‘நிச்சயமாகக் கொல்லப்பட வேண்டும்’ என்று மொழிபெயர்த்து, கொல்லும் முறை எதையும் குறிப்பிடவில்லை.
  alternative: ‘மரண தண்டனை நிறைவேற்றப்பட வேண்டும்’ அல்லது ஒரு குறிப்பிட்ட கொலை முறையைச் சேர்த்தல்.
  rationale: מוֹת יוּמַת மரணத்தை வலியுறுத்தும் செயப்பாட்டு சட்டச் சூத்திரம். இவ்வசனம் தண்டனை முறையைக் குறிப்பிடாததால், பிற பகுதிகளிலிருந்தோ மரபுகளிலிருந்தோ அதைச் சேர்க்கவில்லை.
