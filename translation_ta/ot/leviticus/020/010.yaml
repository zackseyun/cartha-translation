  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான சட்ட மொழிநடை பயன்படுத்தப்பட்டுள்ளது. ‘விபசாரம்’ துல்லியமானதும் பரவலாக அறியப்பட்டதுமான சொல்; ‘அவனும் அவளும்’ என்பது கனமான அல்லது பழமையான குற்றவாளிப் பட்டப்பெயர்களைத் தவிர்த்து மூலத்தின் பாலினச் சமச்சீரைக் காக்கிறது.
