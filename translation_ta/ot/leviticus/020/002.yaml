source:
  edition: WLC
  text: וְ/אֶל בְּנֵ֣י יִשְׂרָאֵ֘ל תֹּאמַר֒ אִ֣ישׁ אִישׁ֩ מִ/בְּנֵ֨י יִשְׂרָאֵ֜ל וּ/מִן הַ/גֵּ֣ר הַ/גָּ֣ר בְּ/יִשְׂרָאֵ֗ל אֲשֶׁ֨ר יִתֵּ֧ן מִ/זַּרְע֛/וֹ לַ/מֹּ֖לֶךְ מ֣וֹת יוּמָ֑ת עַ֥ם הָ/אָ֖רֶץ יִרְגְּמֻ֥/הוּ בָ/אָֽבֶן־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/002.yaml
  text: 'And you shall say to the sons of Israel: Any man from the sons of Israel[a], or from the sojourner who sojourns in Israel, who gives any of his offspring to Molech shall surely be put to death[c][b]; the people of the land shall stone him with stones.'
translation:
  language: ta
  text: 'இஸ்ரவேல் மக்களிடம் நீ சொல்லவேண்டியது: இஸ்ரவேல் மக்களில் ஒருவனோ, இஸ்ரவேலில் குடியிருக்கும் அந்நியரில் ஒருவனோ, தன் பிள்ளைகளில் எவரையாவது மோலேகுக்குக் கொடுத்தால்[a], அவன் நிச்சயமாகக் கொல்லப்பட வேண்டும். நாட்டின் மக்கள் அவனைக் கல்லெறிந்து கொல்ல வேண்டும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மோலேகு” என்பது பொதுவாகப் பிள்ளைப் பலியுடன் தொடர்புபடுத்தப்படும் ஒரு தெய்வத்தின் பெயராகப் புரிந்துகொள்ளப்படுகிறது. சிலர் இந்தச் சொல் ஒரு குறிப்பிட்ட வகைக் காணிக்கையைக் குறிக்கிறது என்று கருதுகின்றனர்.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: எபிரெய மொழியின் சொற்பொருள் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு உடன்படிக்கைச் சமூகத்தைக் குறிக்கும் இயல்பான நவீனத் தமிழ் ‘இஸ்ரவேல் மக்கள்’ ஆகும்.
- source_word: אִישׁ אִישׁ
  choice: ஒருவனோ
  rationale: இரட்டிக்கப்பட்ட אִישׁ பகிர்ந்தளிக்கும் பொருளில் ‘எந்த ஒருவனும்’ என்பதைக் குறிக்கிறது; வாக்கியத்தின் இணை அமைப்பில் ‘ஒருவனோ’ இயல்பாக உள்ளது.
- source_word: הַגֵּר הַגָּר
  choice: குடியிருக்கும் அந்நியர்
  rationale: גֵּר என்பது தற்காலிகப் பயணியல்ல, சமூகத்தின் நடுவே வசிக்கும் அந்நிய நாட்டவரைக் குறிக்கிறது. பெயர்ச்சொல்–வினைச்சொல் ஒத்திசைவு தமிழில் இயல்பாகச் சுருக்கப்பட்டுள்ளது.
- source_word: יִתֵּן מִזַּרְעוֹ לַמֹּלֶךְ
  choice: தன் பிள்ளைகளில் ஒருவரை மோலேகுக்குக் கொடுத்தால்
  rationale: זֶרַע என்பதன் அடிப்படைப் பொருள் ‘விதை/சந்ததி’; இச்சூழலில் பிள்ளைகளைக் குறிக்கிறது. מִן பகுதியைக் குறிக்கலாம் என்பதால் ‘பிள்ளைகளில் ஒருவரை’ என மொழிபெயர்க்கப்பட்டது.
- source_word: לַמֹּלֶךְ
  choice: மோலேகுக்கு
  rationale: முக்கிய உரையில் பாரம்பரியமாகப் புரிந்துகொள்ளப்படும் தனிப்பெயர் வைக்கப்பட்டுள்ளது; காணிக்கையின் வகை என்ற மாற்றுக் கருத்து அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: מוֹת יוּמָת
  choice: நிச்சயமாகக் கொல்லப்பட வேண்டும்
  rationale: வினையெச்ச மூலவடிவமும் வரையறுக்கப்பட்ட வினையும் சேர்ந்த தீவிரப்படுத்தலை ‘நிச்சயமாக’ காட்டுகிறது; செயல்பாட்டு நீதித்தண்டனை என்பதைக் கருமவினை வடிவம் வெளிப்படுத்துகிறது.
- source_word: עַם הָאָרֶץ
  choice: நாட்டின் மக்கள்
  rationale: சொல்லமைப்பிற்கு நெருக்கமாகவும், தண்டனையை நிறைவேற்றும் உள்ளூர் மக்களைக் குறிக்கும் வகையிலும் மொழிபெயர்க்கப்பட்டது.
- source_word: יִרְגְּמֻהוּ בָאָבֶן
  choice: அவனைக் கற்களால் எறிந்து கொல்ல வேண்டும்
  rationale: தமிழில் ‘கல்லெறிய வேண்டும்’ என்பது மரணதண்டனையின் முடிவைத் தெளிவாகச் சொல்லாமல் இருக்கலாம்; எபிரெயச் சூழலில் நோக்கப்பட்ட தண்டனையை இயல்பாகவும் துல்லியமாகவும் இது தெரிவிக்கிறது.
theological_decisions:
- issue: மோலேகு தொடர்பான பிள்ளை அர்ப்பணிப்பின் பொருள்
  choice: மோலேகு என்ற பெயருடைய தெய்வத்துக்குப் பிள்ளையை ஒப்படைக்கும் கடுமையான வழிபாட்டுச் செயல் என முதன்மை உரை காட்டுகிறது.
  alternative: மֹלֶךְ என்பது ஒரு தெய்வத்தின் பெயரல்லாமல், ஒரு குறிப்பிட்ட வகைக் காணிக்கையைக் குறிக்கலாம்.
  rationale: இவ்வசனம் நெருப்பு அல்லது பலியிடும் முறை பற்றி வெளிப்படையாகச் சொல்லாததால் அவை முதன்மை உரையில் சேர்க்கப்படவில்லை; சொல் குறித்த உண்மையான ஆய்வுக் கருத்து வேறுபாடு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டவிதிக்குரிய கண்ணியமும் கடுமையும் காக்கப்பட்டுள்ளன. எபிரெய மொழியின் தேவையற்ற சொற்பிரதிகளைத் தவிர்த்து, அதன் தீவிரம், நீதித்தண்டனை, மற்றும் மோலேகு குறித்த பொருள் தெளிவின்மை பாதுகாக்கப்பட்டுள்ளன.
