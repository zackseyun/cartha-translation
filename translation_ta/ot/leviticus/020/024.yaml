  revised_text: ஆனால் நான் உங்களிடம், “நீங்கள் அவர்களுடைய நிலத்தைச் சொந்தமாக்கிக்கொள்வீர்கள்; அதைச் சொந்தமாக்கிக்கொள்ளும்படி நானே அதை உங்களுக்குக் கொடுப்பேன்” என்று சொன்னேன்.[a] அது பாலும் தேனும் ஓடுகிற நிலம்.[b] மக்களினங்களிலிருந்து உங்களைப் பிரித்துவைத்தவர்[d] உங்கள் கடவுளாகிய யாவே[c] நானே.
