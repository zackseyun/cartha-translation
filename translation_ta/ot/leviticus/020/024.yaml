  text: וָ/אֹמַ֣ר לָ/כֶ֗ם אַתֶּם֮ תִּֽירְשׁ֣וּ אֶת אַדְמָתָ/ם֒ וַ/אֲנִ֞י אֶתְּנֶ֤/נָּה לָ/כֶם֙ לָ/רֶ֣שֶׁת אֹתָ֔/הּ אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָ֑שׁ אֲנִי֙ יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם אֲשֶׁר הִבְדַּ֥לְתִּי אֶתְ/כֶ֖ם מִן הָֽ/עַמִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/024.yaml
  text: But I said to you[a], ‘You shall possess their land, and I myself will give it to you to possess’—a land flowing with milk and honey. I am Yahweh your God[d][c][b], who has separated you from the peoples.
translation:
  language: ta
  text: ஆனால் நான் உங்களிடம், “நீங்கள் அவர்களுடைய நிலத்தைச் சொந்தமாக்கிக்கொள்வீர்கள்; அதைச் சொந்தமாக்கிக்கொள்ளும்படி நானே அதை உங்களுக்குக் கொடுப்பேன்” என்று சொன்னேன்.[a] அது பாலும் தேனும் ஓடுகிற நிலம்.[b] மக்களினங்களிலிருந்து உங்களைப் பிரித்துவைத்தவர்[d] உங்கள் கடவுளாகிய யாவே[c] நானே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவர்களுடைய நிலத்தைச் சுதந்தரித்துக்கொள்வீர்கள் ... அதைச் சுதந்தரித்துக்கொள்ளும்படி’ என்றும் மொழிபெயர்க்கலாம். எபிரெய ירשׁ என்ற வினைச்சொல் சுதந்தரித்தல், உடைமையாக்கிக்கொள்ளுதல் ஆகிய இரு பொருள்களையும் தரக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: “பாலும் தேனும் ஓடுகிற நிலம்” என்பது மிகுந்த வளத்தையும் செழிப்பையும் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: cultural_note
  - marker: c
    text: எபிரெயத்தில் YHWH; பாரம்பரியமாக “கர்த்தர்” என்றும், சில மொழிபெயர்ப்புகளில் “யெகோவா” என்றும் வழங்கப்படுகிறது.
    reason: alternative_reading
  - marker: d
    text: “உங்களை மக்களினங்களிலிருந்து தனியே வைத்தவர்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: ஆனால் நான் ... சொன்னேன்
  rationale: ו־ உரையாடலைத் தொடர்கிறது; இச்சூழலில் முந்தைய எச்சரிக்கைகளுக்கும் இவ்வாக்குறுதிக்கும் இடையிலான வேறுபாட்டை இயல்பாகக் காட்ட ‘ஆனால்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: תִּירְשׁוּ / לָרֶשֶׁת
  choice: சொந்தமாக்கிக்கொள்வீர்கள் / சொந்தமாக்கிக்கொள்ளும்படி
  rationale: ירשׁ என்பதில் சுதந்தரித்தல், கைப்பற்றி உடைமையாக்குதல் ஆகிய இரு நுணுக்கங்களும் உள்ளன. ‘சொந்தமாக்கிக்கொள்’ நிலத்தைப் பெற்றுக்கொண்டு உரிமையுடன் வைத்திருக்கும் பொருளை இயல்பான தமிழில் தருகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: אַדְמָתָם
  choice: அவர்களுடைய நாடு
  rationale: சொல்லுக்கு அடிப்படையில் ‘நிலம்/மண்’ என்றாலும், இங்கு மக்கள் வாழும் பிரதேசத்தைக் குறிப்பதால் ‘நாடு’ என்பது சூழலுக்கேற்ற இயல்பான மொழிபெயர்ப்பு.
- source_word: וַאֲנִי
  choice: நானே
  rationale: தனி ஆளிடப்பெயர் தரும் வலியுறுத்தலை ‘நானே’ தெளிவாகப் பாதுகாக்கிறது.
- source_word: אֶתְּנֶנָּה
  choice: அதை உங்களுக்குக் கொடுப்பேன்
  rationale: நிலத்தைத் தெய்வீகக் கொடையாக அளிக்கும் வாக்குறுதியையும் பெண்பால் ஒருமை பின்னொட்டின் சுட்டையும் வெளிப்படுத்துகிறது.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: பாலும் தேனும் ஓடுகிற நாடு
  rationale: செழிப்பையும் வளத்தையும் குறிக்கும் எபிரெய மரபுத்தொடரின் உருவகத்தைக் காக்கும் நேரடியான, தமிழில் பரிச்சயமான வடிவம்.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய நான்கெழுத்துத் திருப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், அதன் ஏற்றுக்கொள்ளப்பட்ட ஒலிபெயர்ப்பை வழங்குகிறது.
- source_word: הִבְדַּלְתִּי
  choice: பிரித்துவைத்த
  rationale: בדל என்பதன் பிரித்தல்/தனியாக வைத்தல் என்ற நேரடிப் பொருளையும் இவ்வதிகாரத்தின் பரிசுத்த வேறுபாடு சார்ந்த கருப்பொருளையும் அளவுக்கு மீறி விளக்காமல் காக்கிறது.
- source_word: הָעַמִּים
  choice: மக்களினங்கள்
  rationale: அரசியல் நாடுகள் என்ற குறுகிய பொருளைத் தவிர்த்து, பல்வேறு மக்கள் குழுக்களைக் குறிக்கும் עמים என்பதைக் காட்டுகிறது.
theological_decisions:
- issue: יְהוָה என்ற திருப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் நேரடியாக வரும் உடன்படிக்கைப் பெயரைப் பட்டமாக மாற்றாமல் ஒலிபெயர்க்கிறது; வேறு பாரம்பரிய வடிவம் அடிக்குறிப்பில் குறிப்பிடப்பட்டுள்ளது.
- issue: இஸ்ரவேலை மற்ற மக்களினங்களிலிருந்து வேறுபடுத்துதல்
  choice: மக்களினங்களிலிருந்து உங்களைப் பிரித்துவைத்த
  alternative: மக்களினங்களிலிருந்து உங்களைத் தனியாகத் தேர்ந்துவைத்த
  rationale: மூலம் கூறும் பிரித்தல் என்ற செயலைப் பாதுகாக்கிறது; ‘தேர்ந்தெடுத்தல்’ போன்ற மேலதிக இறையியல் கருத்தைச் சேர்க்கவில்லை.
- issue: முதலாம் நபர் வலியுறுத்தல்
  choice: நானே ... கொடுப்பேன்; யாவே நானே
  alternative: நான் ... கொடுப்பேன்; நான் யாவே
  rationale: וַאֲנִי மற்றும் இறுதியில் வரும் אֲנִי ஆகியவற்றின் வலியுறுத்தலைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘நாடு’, ‘சொந்தமாக்கிக்கொள்’, ‘மக்களினங்கள்’ ஆகிய சொற்கள் மூலத்தின் நிலப்பரப்பு, உடைமை, மக்கள் குழுக்கள் என்ற வேறுபாடுகளை இயல்பாகக் காக்கின்றன. உருவக மொழியும் இறைத்திருப்பெயரும் நேரடியாகப் பாதுகாக்கப்பட்டுள்ளன.
