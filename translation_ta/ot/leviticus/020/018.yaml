  text: וְ֠/אִישׁ אֲשֶׁר יִשְׁכַּ֨ב אֶת אִשָּׁ֜ה דָּוָ֗ה וְ/גִלָּ֤ה אֶת עֶרְוָתָ/הּ֙ אֶת מְקֹרָ֣/הּ הֶֽעֱרָ֔ה וְ/הִ֕יא גִּלְּתָ֖ה אֶת מְק֣וֹר דָּמֶ֑י/הָ וְ/נִכְרְת֥וּ שְׁנֵי/הֶ֖ם מִ/קֶּ֥רֶב עַמָּֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/018.yaml
  text: If a man lies with a woman during her menstrual impurity and uncovers her nakedness—he has laid bare her flow[c][b][a], and she has uncovered the flow of her blood—both of them shall be cut off from among their people.
translation:
  language: ta
  text: ஒருவன் மாதவிடாய் தீட்டுநிலையில் இருக்கும் ஒரு பெண்ணுடன் உடலுறவுகொண்டு அவளுடைய நிர்வாணத்தை வெளிப்படுத்தினால்—அவன் அவளுடைய ஊற்றைத் திறந்திருக்கிறான்[a]; அவளும் தன் இரத்தத்தின் ஊற்றை வெளிப்படுத்தியிருக்கிறாள்—அவர்கள் இருவரும் தங்கள் மக்களிடமிருந்து அறுக்கப்பட வேண்டும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “அவன் அவளுடைய ஊற்றைத் திறந்திருக்கிறான்; அவளும் தன் இரத்தத்தின் ஊற்றை வெளிப்படுத்தியிருக்கிறாள்.” “ஊற்று” என்பது மாதவிடாய் இரத்தம் புறப்படும் மூலத்தைக் குறிக்கும் மறைமொழி.
    reason: lexical_alternative
  - marker: b
    text: “அறுக்கப்படுதல்” என்பது தோராவில் வழக்கமான சட்டச் சூத்திரம். அது எவ்வாறு நிறைவேற்றப்படும் என்பதை இந்த வசனம் குறிப்பிடவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ
  choice: ஒருவன்
  rationale: ஆண்பால் ஒருமையில் அமைந்த சட்டக் கூற்றையும், இப்பாலுறவுச் சூழலில் ஆண் பங்கேற்பாளரைத் தனிப்படக் குறிப்பிடுவதையும் துல்லியமாகத் தருகிறது.
- source_word: יִשְׁכַּב אֶת אִשָּׁה
  choice: ஒரு பெண்ணுடன் உடலுறவுகொண்டு
  rationale: எபிரெய மொழியில் பாலுறவைக் குறிக்கும் மரபுத்தொடரின் பொருளை நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் தருகிறது.
- source_word: דָּוָה
  choice: மாதவிடாயினால் தீட்டுள்ள
  rationale: இது வெறும் மாதவிடாய் நிகழ்வை மட்டுமல்லாமல் லேவியராகமத்தில் அதனுடன் தொடர்புடைய சடங்குசார் தீட்டு நிலையையும் குறிக்கிறது.
- source_word: גִלָּה אֶת עֶרְוָתָהּ
  choice: அவளுடைய நிர்வாணத்தை வெளிப்படுத்தினால்
  rationale: லேவியராகமத்தின் தடைசெய்யப்பட்ட பாலுறவுச் சட்டங்களில் வரும் முக்கிய மரபுத்தொடரின் உருவகத்தையும் நூலுக்குள் அதன் ஒத்திசைவையும் காக்கிறது.
- source_word: מְקֹרָהּ הֶעֱרָה
  choice: அவன் அவளுடைய இரத்தத்தின் ஊற்றைத் திறந்திருக்கிறான்
  rationale: மָקוֹר என்பதன் 'ஊற்று/மூலம்' என்ற உடல் சார்ந்த மறைமுகப் படிமத்தையும், הֶעֱרָה என்பதன் திறந்து வெளிப்படுத்தும் கருத்தையும் காக்கிறது; சூழலிலிருந்து இது மாதவிடாய் இரத்தத்தைக் குறிக்கிறது.
- source_word: וְהִיא גִּלְּתָה אֶת מְקוֹר דָּמֶיהָ
  choice: அவளும் தன் இரத்தத்தின் ஊற்றை வெளிப்படுத்தியிருக்கிறாள்
  rationale: பெண்ணின் பங்கேற்பைக் கூறும் இணைக் கூற்றைத் தக்கவைத்து, 'இரத்தத்தின் ஊற்று' என்ற மூலமொழிப் படிமத்தை வெளிப்படையாக மொழிபெயர்க்கிறது.
- source_word: וְנִכְרְתוּ
  choice: அறுப்புண்டுபோக வேண்டும்
  rationale: தோராவில் காணப்படும் உடன்படிக்கைச் சட்டச் சூத்திரத்தின் உருவக வலிமையைத் தக்கவைக்கிறது; அது எவ்வகையில் நிறைவேற்றப்படும் என்பதை வசனம் குறிப்பிடாததால் மொழிபெயர்ப்பும் அதைத் தீர்மானிக்கவில்லை.
- source_word: מִקֶּרֶב עַמָּם
  choice: தங்கள் மக்களிடமிருந்து
  rationale: தண்டனையின் சமூக மற்றும் உடன்படிக்கைச் சூழலை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: דָּוָה குறிக்கும் பெண்ணின் நிலை
  choice: மாதவிடாயினால் தீட்டுள்ள
  alternative: மாதவிடாய் ஏற்பட்டிருக்கிற
  rationale: லேவியராகமச் சூழலில் இது சாதாரண உடல்நிலையை மட்டும் அல்லாமல் மாதவிடாயுடன் இணைந்த சடங்குசார் தீட்டையும் குறிக்கிறது. 'தீட்டு' என்பது இங்கே ஒழுக்கக் குற்றத்தைக் குறிக்காமல் சடங்குசார் நிலையைச் சுட்டுகிறது.
- issue: וְנִכְרְתוּ என்ற தண்டனைச் சூத்திரத்தின் தன்மை
  choice: அறுப்புண்டுபோக வேண்டும்
  alternative: சமுதாயத்திலிருந்து விலக்கப்பட வேண்டும் / கொல்லப்பட வேண்டும்
  rationale: எபிரெயச் சூத்திரம் இவ்வசனத்தில் மரணம், சமூக விலக்கு அல்லது வேறொரு விளைவு என்று செயல்முறையைத் தெளிவுபடுத்தவில்லை. ஆகவே அதன் உண்மையான தெளிவின்மை பாதுகாக்கப்படுகிறது.
- issue: מָקוֹר என்ற உடற்கூறு மறைமொழி
  choice: இரத்தத்தின் ஊற்று
  alternative: இரத்தப்போக்கு / இரத்தம் பாயும் மூலம்
  rationale: மூலமொழியின் 'ஊற்று, மூலம்' என்ற உருவகத்தைத் தக்கவைத்தபடியே, இரத்தம் பற்றிய இரண்டாம் கூற்றுடன் அதன் தொடர்பை வாசகருக்குத் தெளிவாக்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான சட்டநடை பயன்படுத்தப்பட்டுள்ளது. பாலுறவு தெளிவாகச் சொல்லப்பட்டாலும் அசிங்கமான சொற்கள் தவிர்க்கப்பட்டுள்ளன. “நிர்வாணத்தை வெளிப்படுத்துதல்,” “இரத்தத்தின் ஊற்று,” “அறுப்புண்டுபோதல்” ஆகிய மூலமொழியின் முக்கிய உருவகங்கள் பாதுகாக்கப்பட்டு, தேவையான விளக்கம் அடிக்குறிப்புகளில் தரப்பட்டுள்ளது.
