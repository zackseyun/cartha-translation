  naturalness: ‘அருவருப்புக்குரியவர்களாக்கிக்கொள்ளாதீர்கள்’ இலக்கணப்படி புரிந்துகொள்ளக்கூடியதாக இருந்தாலும், நவீன நிலையான தமிழில் சற்றே நெருக்கடியான கூட்டு வடிவமாக உள்ளது. ‘அருவருப்புக்குரியவர்களாக ஆக்கிக்கொள்ளாதீர்கள்’ என்பது அதே பொருளையும் தற்செயலற்ற தன்வினை வலிமையையும் இயல்பாக வெளிப்படுத்தும்.
  terminology: ‘சுத்தமான/அசுத்தமான’ சடங்கு வகைப்பாட்டிற்கு ஏற்றவை. ‘மிருகம்,’ ‘பறவை,’ மற்றும் ‘தரையில் ஊர்ந்து செல்லும்’ ஆகியவை இயல்பானவை. ‘உங்களை’ என்பதும் இங்கு நֶפֶשׁ என்பதற்கான சரியான இடியமொழிபெயர்ப்பு.
