  text: וְ/הִבְדַּלְתֶּ֞ם בֵּֽין הַ/בְּהֵמָ֤ה הַ/טְּהֹרָה֙ לַ/טְּמֵאָ֔ה וּ/בֵין הָ/ע֥וֹף הַ/טָּמֵ֖א לַ/טָּהֹ֑ר וְ/לֹֽא תְשַׁקְּצ֨וּ אֶת נַפְשֹֽׁתֵי/כֶ֜ם בַּ/בְּהֵמָ֣ה וּ/בָ/ע֗וֹף וּ/בְ/כֹל֙ אֲשֶׁ֣ר תִּרְמֹ֣שׂ הָֽ/אֲדָמָ֔ה אֲשֶׁר הִבְדַּ֥לְתִּי לָ/כֶ֖ם לְ/טַמֵּֽא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/025.yaml
  text: So you shall distinguish between the clean animal and the unclean[a], and between the unclean bird and the clean; and you shall not make yourselves detestable by the animal or by the bird or by anything that creeps on the ground[b], which I have set apart for you as unclean.
translation:
  language: ta
  text: ஆகையால், சுத்தமான மிருகத்தையும் அசுத்தமான மிருகத்தையும், அசுத்தமான பறவையையும் சுத்தமான பறவையையும் நீங்கள் வேறுபடுத்த வேண்டும். மிருகத்தினாலோ பறவையினாலோ தரையில் ஊர்ந்து செல்லும் எதனாலோ உங்களை[a] அருவருப்புக்குரியவர்களாக ஆக்கிக்கொள்ளாதீர்கள்[b]. அவற்றை உங்களுக்காக அசுத்தமானவை என்று நான் தனியே பிரித்திருக்கிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் நேரடியாக ‘உங்கள் உயிர்களை’ அல்லது ‘உங்கள் நபர்களை’; இங்கு அது ‘உங்களை’ என்று பொருள்படும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: ‘உங்களை அருவருப்பானவர்களாக ஆக்கிக்கொள்ளாதீர்கள்’ என்றும் மொழிபெயர்க்கலாம். இங்குள்ள எபிரெய வினைச்சொல் ‘அருவருப்பானது’ அல்லது ‘வெறுக்கத்தக்கது’ என்ற பொருட்களுடன் தொடர்புடையது; ‘அசுத்தமாதல்’ என்பதற்கான வழக்கமான சொல் அல்ல.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִבְדַּלְתֶּם
  choice: நீங்கள் வேறுபடுத்த வேண்டும்
  rationale: בדל என்பதன் Hiphil வடிவம் வகைகளுக்கிடையே வேறுபாட்டை ஏற்படுத்தி அதைக் கடைப்பிடிப்பதைக் குறிக்கிறது; இச்சூழலில் ‘வேறுபடுத்த வேண்டும்’ இயல்பாகவும் கட்டளையின் வலிமையுடனும் உள்ளது.
- source_word: הַבְּהֵמָה
  choice: மிருகம்
  rationale: இங்கு நிலவாழ் விலங்குகளைக் குறிக்கும் பரந்த வகைப்பெயர்; ‘கால்நடை’ என்பது தேவையற்ற அளவு குறுகியது.
- source_word: הַטְּהֹרָה / הַטְּמֵא / הַטְּמֵאָה / הַטָּהֹר
  choice: சுத்தமான / அசுத்தமான
  rationale: லேவியராகமத்தின் சடங்கு மற்றும் உணவு வகைப்பாட்டைத் தெளிவாகக் காட்டும் வழக்கமான தமிழ் சொற்கள்; ஒழுக்கக் குற்றம் அல்லது உடல்நலக் கருத்தைத் தேவையின்றி சேர்க்கவில்லை.
- source_word: הָעוֹף
  choice: பறவை
  rationale: עוֹף இன்னும் பரந்த பொருளில் பறக்கும் உயிரினத்தைக் குறிக்கக்கூடியதாயினும், இந்த உணவுச் சட்டச் சூழலில் ‘பறவை’ இயல்பான தேர்வு.
- source_word: וְלֹא תְשַׁקְּצוּ
  choice: அருவருப்புக்குரியவர்களாக்கிக்கொள்ளாதீர்கள்
  rationale: שׁקץ வேரின் அருவருப்பு/வெறுக்கத்தக்க தன்மை என்ற பொருளையும், செயல் தங்களையே பாதிக்கிறது என்ற எபிரெயக் கட்டமைப்பையும் காக்கிறது; இதை ‘தீட்டுப்படுத்தாதீர்கள்’ என்று மொழிபெயர்த்தால் טמא என்ற தனிப்பட்ட வகைப்பாட்டுச் சொல்லுடன் கலந்துவிடும்.
- source_word: אֶת נַפְשֹׁתֵיכֶם
  choice: உங்களை
  rationale: נפשׁ இங்கு உடலிலிருந்து பிரிந்த ‘ஆத்துமா’ என்ற தொழில்நுட்பப் பொருளில் அல்லாமல் முழு நபர்களையே குறிக்கும் எபிரெய மரபுத்தொடர்.
- source_word: וּבְכֹל אֲשֶׁר תִּרְמֹשׂ הָאֲדָמָה
  choice: தரையில் ஊர்ந்து செல்லும் எதனாலோ
  rationale: רמשׂ தரைக்கு அருகே ஊர்ந்து அல்லது நகர்ந்து செல்வதைக் குறிக்கிறது; ‘எதனாலோ’ என்பது כֹל אֲשֶׁר என்ற பரந்த குறிப்பைப் பாதுகாக்கிறது.
- source_word: אֲשֶׁר הִבְדַּלְתִּי לָכֶם לְטַמֵּא
  choice: அவற்றை உங்களுக்காக அசுத்தமானவை என்று நான் தனியே பிரித்திருக்கிறேன்
  rationale: தெய்வீக வகைப்படுத்தலைக் காட்டும் בדל வேரை ‘தனியே பிரித்திருக்கிறேன்’ என்றும், לְטַמֵּא என்பதன் வகைப்பாட்டு விளைவை ‘அசுத்தமானவை என்று’ என்றும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: சடங்கு வகைப்பாட்டு மொழியா அல்லது ஒழுக்கம்/சுகாதாரம் சார்ந்த பொழிப்புரையா
  choice: ‘சுத்தமான / அசுத்தமான’ என்ற உடன்படிக்கைச் சடங்கு வகைப்பாடு
  alternative: ‘தூய / தூய்மையற்ற’ அல்லது ஒழுக்கரீதியான ‘கெட்ட’ வகைப்பாடு
  rationale: இவ்வசனம் இஸ்ரவேல் கடைப்பிடிக்க வேண்டிய உணவு மற்றும் பரிசுத்த வகைப்பாடுகளைப் பற்றியது; சுகாதார அல்லது பொதுவான ஒழுக்க விளக்கத்தை உரைக்குள் சேர்க்கக் கூடாது.
- issue: אֶת נַפְשֹׁתֵיכֶם என்பதில் נֶפֶשׁ என்பதன் பொருள்
  choice: முழு நபர்களைக் குறிக்கும் ‘உங்களை’
  alternative: ‘உங்கள் ஆத்துமாக்களை’
  rationale: இக்கட்டமைப்பில் נֶפֶשׁ நபர்களையே குறிக்கிறது; ‘ஆத்துமா’ என்பது எபிரெயம் கட்டாயப்படுத்தாத உடல்–ஆத்துமா இருமையை உணர்த்தக்கூடும்.
- issue: שׁקץ மற்றும் טמא ஆகியவற்றின் பொருள் வேறுபாடு
  choice: שׁקץ என்பதை ‘அருவருப்புக்குரியவர்களாக்கிக்கொள்ளுதல்’ என்றும் טמא என்பதை ‘அசுத்தம்’ என்றும் வேறுபடுத்துதல்
  alternative: இரண்டையும் ‘தீட்டுப்படுத்துதல்/அசுத்தப்படுத்துதல்’ என்று ஒரே சொல்லால் மொழிபெயர்த்தல்
  rationale: மூலத்தில் உள்ள அருவருப்பு சார்ந்த மொழிக்கும் சடங்கு அசுத்த வகைப்பாட்டுக்கும் இடையிலான உண்மையான சொற்பொருள் வேறுபாட்டைக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் மரியாதையும் கண்ணியமும் கொண்ட நடை. ‘வேறுபடுத்த வேண்டும்’ கட்டளையைத் தெளிவாகக் காட்டுகிறது; ‘மிருகம்’, ‘பறவை’, ‘தரையில் ஊர்ந்து செல்லும்’ ஆகியவை இயல்பான இன்றைய சொற்கள். நீண்ட எபிரெய வாக்கியம் வாசிப்புத் தெளிவுக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டாலும், கடைசி சார்புத் தொடரின் தெய்வீக வகைப்படுத்தல் கருத்து ‘அவற்றை’ என்பதன் மூலம் முன் கூறிய அனைத்து உயிரின வகைகளுடனும் இணைக்கப்பட்டுள்ளது.
