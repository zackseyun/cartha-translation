lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பேசி
  rationale: דבר என்பதன் பியேல் வடிவம் புதிய உரைப்பகுதியை அறிமுகப்படுத்துகிறது; ‘பேசி’ என்பது இச்சூத்திர அமைப்பை இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: எபிரேய இறைப் பெயரான YHWH-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் பரவலாக அறியப்படும் பெயர்வடிவில் தருகிறது; அடிக்குறிப்பு மூல வடிவத்தையும் மரபு மொழிபெயர்ப்பையும் விளக்குகிறது.
- source_word: אֶל
  choice: மோசேயிடம்
  rationale: பேச்சின் முகவரியைக் குறிக்கும் אֶל என்பதற்கு, ‘பேசு’ வினையுடன் இயல்பான தமிழ் வேற்றுமை வடிவமான ‘-இடம்’ பயன்படுத்தப்படுகிறது.
- source_word: מֹשֶׁה
  choice: மோசே
  rationale: מֹשֶׁה என்ற பெயரின் நிலைபெற்ற தமிழ் வடிவம்.
- source_word: לֵאמֹר
  choice: சொன்னது
  rationale: தொடர்ந்து வரும் நேரடிப் பேச்சை அறிமுகப்படுத்தும் எபிரேயச் சூத்திரத்தை தமிழில் தெளிவாகக் காட்டுகிறது; ‘என்று’ என மொழிபெயர்த்தால் அடுத்த வசனத்தின் நேரடிப் பேச்சுடன் இணைப்பது இயல்பாக இருந்தாலும், இங்கு மூலத்தின் ‘சொல்லும்படி/சொல்லி’ என்ற கூறு வெளிப்படையாக வைக்கப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழியாக்கம்
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் பட்டப்பெயர் அல்ல, நான்கு எழுத்துகளைக் கொண்ட தனிப்பெயர் உள்ளது. அதை ‘கர்த்தர்’ என்று மாற்றாமல் பெயராகவே வழங்குகிறோம். உச்சரிப்பு முழுமையாக உறுதியல்ல என்பதால் மூல வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன, கண்ணியமான பொதுத்தமிழ். எபிரேய உரை அறிமுகச் சூத்திரத்தின் தொடர்ச்சியைத் தக்கவைத்தபடி, அடுத்த வசனத்தில் வரும் நேரடிப் பேச்சை எதிர்நோக்கும் வகையில் அமைக்கப்பட்டது.
