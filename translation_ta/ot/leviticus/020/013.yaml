- from: ஒருவன் ஒரு பெண்ணோடு படுப்பதுபோல் ஓர் ஆணோடு படுத்தால்[a], அவர்கள் இருவரும் அருவருப்பான செயலைச் செய்திருக்கிறார்கள். அவர்கள் நிச்சயமாகக் கொல்லப்பட வேண்டும்; அவர்களுடைய இரத்தப்பழி அவர்கள்மேலேயே இருக்கும்[b].
