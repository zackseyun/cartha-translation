base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/013.yaml
  text: If a man lies with a male as one lies with a woman[a], both of them have done an abomination; they shall surely be put to death[b]; their blood is on them.
translation:
  language: ta
  text: ஒருவன் ஒரு பெண்ணுடன் பாலுறவு கொள்வதுபோல் ஒரு ஆணுடன் பாலுறவு கொண்டால்[a], அவர்கள் இருவரும் அருவருப்பான செயலைச் செய்திருக்கிறார்கள். அவர்கள் நிச்சயமாகக் கொல்லப்பட வேண்டும்; அவர்களுடைய இரத்தப்பழி அவர்கள்மேல் இருக்கும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்கு சொல், ‘ஒரு பெண்ணின் படுக்கைகளாக’; இது ஒரு பெண்ணுடன் கொள்ளும் பாலுறவைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அவர்களுடைய இரத்தம் அவர்கள்மேல் இருக்கும்.’ இது அவர்களது மரணத்திற்கான பொறுப்பு அவர்களிடமே இருப்பதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ אֲשֶׁר
  choice: ஒருவன் ... படுத்தால்
  rationale: எபிரெயச் சட்ட நிபந்தனை அமைப்பை இயல்பான நவீனத் தமிழில் ‘ஒருவன் ... படுத்தால்’ என வழங்குகிறது.
- source_word: יִשְׁכַּב אֶת
  choice: படுத்தால் / படுப்பதுபோல்
  rationale: இச்சூழலில் שׁכב பாலுறவைக் குறிக்கும் வழக்குச் சொல். மூலத்தின் உருவக அமைப்பைத் தக்கவைத்தபடி தமிழிலும் புரியுமாறு மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: זָכָר
  choice: ஓர் ஆண்
  rationale: זָכָר என்பது சமூகப் பங்கைக் காட்டும் ‘மனிதன்’ என்பதைக் காட்டிலும் பாலினத்தைக் குறிக்கும் ‘ஆண்’; אִישׁ என்பதிலிருந்து உள்ள சொல் வேறுபாட்டை ‘ஒருவன் / ஓர் ஆண்’ எனக் காக்கிறது.
- source_word: מִשְׁכְּבֵי אִשָּׁה
  choice: ஒரு பெண்ணோடு படுப்பதுபோல்
  rationale: சொல்லுக்கு சொல் ‘ஒரு பெண்ணின் படுக்கைகள்’ என்பது தமிழில் இயல்பற்றது; இந்த எபிரெய மரபுத்தொடரின் பாலுறவுக் கருத்தை மூலத்திற்கு நெருக்கமாக வெளிப்படுத்துகிறது.
- source_word: תּוֹעֵבָה
  choice: அருவருப்பான செயல்
  rationale: உடன்படிக்கை மற்றும் ஒழுக்கச் சூழலில் கடுமையான கண்டனத்தைக் குறிக்கும் சொல்லின் வலிமையை இயல்பான தமிழில் தருகிறது.
- source_word: עָשׂוּ שְׁנֵיהֶם
  choice: அவர்கள் இருவரும் ... செய்திருக்கிறார்கள்
  rationale: செயலில் இருவரையும் மூல உரை வெளிப்படையாகச் சேர்ப்பதைக் காக்கிறது.
- source_word: מוֹת יוּמָתוּ
  choice: அவர்கள் நிச்சயமாகக் கொல்லப்பட வேண்டும்
  rationale: எபிரெய infinitive absolute உடன் வரும் passive வடிவத்தின் உறுதியான வலியுறுத்தலையும் செயப்பாட்டு நிலையையும் வெளிப்படுத்துகிறது.
- source_word: דְּמֵיהֶם בָּם
  choice: அவர்களுடைய இரத்தப்பழி அவர்கள்மேலேயே இருக்கும்
  rationale: அவர்களது மரணத்திற்கான பொறுப்பு அவர்களிடமே இருப்பதைச் சுட்டும் சட்ட-ஒழுக்க மரபுத்தொடரை ‘இரத்தப்பழி’ மூலம் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: சமகாலத்தில் சர்ச்சைக்குரிய இந்தச் சட்டத் தடையை மென்மைப்படுத்தாமலும் விரிவுபடுத்தாமலும் மொழிபெயர்த்தல்
  choice: எபிரெய மூலத்தில் குறிப்பிடப்பட்ட குறிப்பிட்ட செயலையும் தண்டனையையும் நேரடியாக வழங்குதல்
  alternative: ‘ஓரினச்சேர்க்கைச் செயல்கள்’ போன்ற பரந்த வகைப்பாட்டையோ நவீன பாலியல் அடையாளச் சொற்களையோ பயன்படுத்துதல்
  rationale: மூல உரை நவீன அடையாள வகையை அல்ல, ஒரு குறிப்பிட்ட செயலைச் சட்ட மொழியில் விவரிக்கிறது; ஆகவே அதற்கு மேல் கருத்தைச் சேர்க்கவில்லை.
- issue: אִישׁ மற்றும் זָכָר ஆகிய பாலினச் சொற்களின் வேறுபாடு
  choice: ‘ஒருவன்’ மற்றும் ‘ஓர் ஆண்’ என்று வேறுபடுத்துதல்
  alternative: இரண்டையும் ‘ஆண்’ அல்லது ‘மனிதன்’ என ஒரே சொல்லால் வழங்குதல்
  rationale: மூலத்தின் சொற்பொருள் வேறுபாட்டை இயன்றவரைத் தக்கவைத்து, பாலினமற்ற பொதுச்சொற்களால் அதை மறைக்காமல் இருக்கிறது.
- issue: דְּמֵיהֶם בָּם என்பதன் பொருள்
  choice: ‘அவர்களுடைய இரத்தப்பழி அவர்கள்மேலேயே இருக்கும்’
  alternative: ‘அவர்களுடைய இரத்தம் அவர்கள்மேல் இருக்கும்’
  rationale: ‘இரத்தம்’ என்ற உருவகத்தையும் குற்றப் பொறுப்பு என்ற சட்டப் பொருளையும் தமிழில் புரியும் வகையில் ‘இரத்தப்பழி’ என வழங்குகிறது; மாற்று நேரடி வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் சட்ட உரையின் கண்ணியமும் கடுமையும் காக்கப்படும் வகையிலும் அமைக்கப்பட்டது. நவீன பாலியல் அடையாளச் சொற்கள் சேர்க்கப்படவில்லை; மூலத்தின் செயல்-மையச் சொற்றொடர் பாதுகாக்கப்பட்டது.
