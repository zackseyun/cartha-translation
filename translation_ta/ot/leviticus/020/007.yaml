  yaml_path: translation/ot/leviticus/020/007.yaml
  text: Consecrate yourselves[a], and be holy, because I am Yahweh your God.
translation:
  language: ta
  text: உங்களையே பரிசுத்தப்படுத்திக்கொள்ளுங்கள்[a]; பரிசுத்தராய் இருங்கள்; ஏனெனில் நான் உங்கள் கடவுளான யாவே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உங்களைப் பரிசுத்தப்படுத்துங்கள்’ அல்லது ‘உங்களைப் பரிசுத்தத்திற்கென அர்ப்பணியுங்கள்.’ எபிரெய வினை தற்சுட்டுப் பொருளுடையது; இஸ்ரவேலர் தங்களைச் செயல்முறையாகப் பரிசுத்தத்திற்கென அர்ப்பணிக்கும்படி அழைக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִתְקַדִּשְׁתֶּם
  choice: உங்களைப் பரிசுத்தப்படுத்திக்கொண்டு
  rationale: קדשׁ என்பதன் ஹித்பஅேல் வடிவம், இஸ்ரவேலர் தங்களைச் செயல்முறையாகப் பரிசுத்தத்திற்கென அர்ப்பணிக்க வேண்டும் என்ற தற்சுட்டுப் பொருளைத் தருகிறது. அடுத்துள்ள ‘பரிசுத்தராயிருங்கள்’ என்பதிலிருந்து வேறுபாட்டையும் இது காக்கிறது.
- source_word: וִהְיִיתֶם קְדֹשִׁים
  choice: பரிசுத்தராயிருங்கள்
  rationale: היה வினை முந்தைய கட்டளையைத் தொடர்ந்து கட்டளைப் பொருளில் வருகிறது; קְדֹשִׁים என்பதன் உடன்படிக்கை மற்றும் ஒழுக்கவியல் நிறையை ‘பரிசுத்தர்’ இயல்பாகக் காக்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கட்டளைகளுக்கான காரணத்தை அறிமுகப்படுத்தும் காரண இணைப்பைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரிந்துகொள்ளக்கூடிய ஒலிபெயர்ப்பாக அளிக்கிறது.
- source_word: אֱלֹהֵיכֶם
  choice: உங்கள் கடவுள்
  rationale: வடிவத்தில் பன்மைத் தோற்றமுடைய אֱלֹהִים இங்கு இஸ்ரவேலின் ஒரே கடவுளைக் குறிக்கிறது; இரண்டாம் நபர் பன்மை உடைமைப் பின்னொட்டும் காக்கப்பட்டுள்ளது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது. ஆகவே அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைக் காக்கிறது.
- issue: மனிதச் செயலும் பரிசுத்த நிலையும் இடையிலான தொடர்பு
  choice: ‘உங்களைப் பரிசுத்தப்படுத்திக்கொண்டு’ என்பதையும் ‘பரிசுத்தராயிருங்கள்’ என்பதையும் தனித்தனியாகக் காத்தல்
  alternative: இரண்டையும் ஒரே ‘பரிசுத்தராயிருங்கள்’ என்ற கட்டளையாகச் சுருக்குதல்
  rationale: முதல் வினையின் தற்சுட்டான, செயற்பாட்டுப் பொருளையும் அடுத்த கூற்றின் நிலை/வாழ்வுக்கான கட்டளையையும் ஒன்றாக்காமல், வசனத்தின் இறையியல் அழுத்தத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரநிலைத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. ‘பரிசுத்தம்’ என்ற சொல்லைத் தொடர்ந்து பயன்படுத்துவது קדשׁ/קָדוֹשׁ என்ற ஒரே சொற்குடும்பத்தின் தொடர்பைக் காக்கிறது; முதல் கூறின் தற்சுட்டுச் செயற்பாடு ‘-க்கொண்டு’ அமைப்பால் இயல்பாக வெளிப்படுகிறது.
