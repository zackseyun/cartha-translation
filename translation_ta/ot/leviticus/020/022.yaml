  text: וּ/שְׁמַרְתֶּ֤ם אֶת כָּל חֻקֹּתַ/י֙ וְ/אֶת כָּל מִשְׁפָּטַ֔/י וַ/עֲשִׂיתֶ֖ם אֹתָ֑/ם וְ/לֹא תָקִ֤יא אֶתְ/כֶם֙ הָ/אָ֔רֶץ אֲשֶׁ֨ר אֲנִ֜י מֵבִ֥יא אֶתְ/כֶ֛ם שָׁ֖מָּ/ה לָ/שֶׁ֥בֶת בָּֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/022.yaml
  text: So you shall keep all my statutes and all my judgments and do them[b][a], so that the land to which I am bringing you to dwell in it may not vomit you out.
translation:
  language: ta
  text: ஆகவே, நீங்கள் என் எல்லா நியமங்களையும் என் எல்லா நீதித் தீர்ப்புகளையும்[a] கடைப்பிடித்து, அவற்றின்படி நடக்க வேண்டும். அப்போது, நீங்கள் குடியிருப்பதற்காக நான் உங்களைக் கொண்டுவருகிற அந்த நாடு உங்களைக் கக்கி வெளியேற்றாது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நியமங்கள்’ மற்றும் ‘நீதித் தீர்ப்புகள்’ என்பதற்கு ‘விதிகள்’ மற்றும் ‘சட்டத் தீர்மானங்கள்’ என்றும் மொழிபெயர்க்கலாம். எபிரேயத்தில் இரண்டு வேறுபட்ட சட்டப் பதங்கள் பயன்படுத்தப்பட்டுள்ளன.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘வாந்தியெடுத்து வெளியேற்றாது.’ எபிரேய வினைச்சொல் நேரடியாக ‘வாந்தியெடு’ அல்லது ‘கக்கு’ என்று பொருள்படும்; தீட்டுப்பட்ட குடியிருப்பவர்களை நாடு வெளியேற்றுவதை இது வலுவான உருவகமாகச் சித்தரிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: ஆகவே, ... கடைப்பிடித்து
  rationale: שׁמר என்பதன் உடன்படிக்கைச் சட்டச் சூழலிலான ‘கவனமாகக் கைக்கொள்/கடைப்பிடி’ என்ற பொருளை இயல்பான நவீன தமிழில் தருகிறது. வாவ் முன்னிடைச்சொல் முந்தைய எச்சரிக்கையுடன் உள்ள முடிவுறு தொடர்பை உணர்த்த ‘ஆகவே’ என மொழிபெயர்க்கப்பட்டது.
- source_word: חֻקֹּתַי
  choice: என் ... நியமங்கள்
  rationale: חֻקָּה என்பது விதிக்கப்பட்ட சட்ட ஏற்பாடுகளைக் குறிக்கிறது; ‘நியமங்கள்’ அதன் சட்டத் தன்மையைப் பேணுகிறது.
- source_word: מִשְׁפָּטַי
  choice: என் ... நீதித் தீர்ப்புகள்
  rationale: מִשְׁפָּט என்பதன் நீதி, தீர்ப்பு, சட்டத் தீர்மானம் ஆகிய பொருள் வரம்பைப் பேணுவதோடு, חֻקּוֹת என்பதிலிருந்து வேறுபடுத்துகிறது.
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: அவற்றின்படி நடக்க வேண்டும்
  rationale: சட்டங்களைச் ‘செய்தல்’ என்னும் எபிரேய மரபுத்தொடரைத் தமிழில் இயல்பாகவும் நடைமுறைப்படுத்தும் கட்டளையாகவும் தருகிறது.
- source_word: וְלֹא תָקִיא אֶתְכֶם
  choice: உங்களைக் கக்கி வெளியேற்றாது
  rationale: קיא என்பதன் நேரடியான ‘வாந்தியெடு/கக்கு’ என்ற வலுவான உருவகத்தை மென்மைப்படுத்தாமல் பேணுகிறது; ‘வெளியேற்று’ என்பது உருவகத்தின் விளைவைத் தெளிவாக்குகிறது.
- source_word: הָאָרֶץ
  choice: அந்த நாடு
  rationale: இங்கு אֶרֶץ என்பது பொதுவான பூமியை அல்ல, இஸ்ரவேலர் குடியிருக்கக் கொண்டுவரப்படும் குறிப்பிட்ட நிலப்பகுதியைக் குறிக்கிறது; தமிழில் ‘நாடு’ இயல்பாக உள்ளது.
- source_word: אֲשֶׁר אֲנִי מֵבִיא אֶתְכֶם שָׁמָּה
  choice: நான் உங்களைக் கொண்டுவருகிற அந்த நாடு
  rationale: கடவுள் அவர்களை இலக்கிடத்துக்குக் கொண்டுவரும் நிகழ்நிலைச் செயலைப் பேணுகிறது; எபிரேயத்தின் ‘அங்கே’ என்பதைத் தமிழில் ‘அந்த நாடு’ இயல்பாக உள்ளடக்குகிறது.
- source_word: לָשֶׁבֶת בָּהּ
  choice: நீங்கள் குடியிருப்பதற்காக
  rationale: ישׁב என்பதன் இச்சூழலிலான நிலையாக வாழ்தல்/குடியேறுதல் பொருளையும், לְ முன்னொட்டின் நோக்கத்தையும் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: நாடு குடியிருப்பவர்களைக் கக்கி வெளியேற்றும் உடன்படிக்கை எச்சரிக்கை
  choice: நாட்டை மனித இயல்புடையதுபோல் சித்தரிக்கும் ‘கக்கி வெளியேற்றாது’ என்ற உருவகம் பேணப்பட்டது.
  alternative: ‘நாடு உங்களை நிராகரிக்காது’ அல்லது ‘நாடு உங்களை வெளியேற்றாது.’
  rationale: மூல எபிரேயம் தீட்டுப்பட்ட குடியிருப்பவர்களை நாடே வாந்தியெடுத்து வெளியேற்றுவது போன்ற அதிர்வூட்டும் உருவகத்தைப் பயன்படுத்துகிறது. அதை அப்படியே பேணுவது பரிசுத்தம் மற்றும் நாட்டிலிருந்து வெளியேற்றப்படுதல் குறித்த எச்சரிக்கையின் தீவிரத்தைத் தணிக்காமல் வைத்திருக்கிறது.
- issue: חֻקּוֹת மற்றும் מִשְׁפָּטִים ஆகிய இரு சட்டச் சொற்களின் வேறுபாடு
  choice: ‘நியமங்கள்’ மற்றும் ‘நீதித் தீர்ப்புகள்’ என்ற இரு வேறு சொற்கள் பயன்படுத்தப்பட்டன.
  alternative: ‘கட்டளைகள்’ மற்றும் ‘சட்டங்கள்’ அல்லது இரண்டையும் பொதுவாக ‘சட்டங்கள்’ என மொழிபெயர்த்தல்.
  rationale: மூலத்தில் இரு தனித்த சட்டப் பதங்கள் இருப்பதால், அவற்றை ஒரே பொதுச் சொல்லுக்குள் சுருக்காமல் சொற்பொருள் வேறுபாடு பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான சட்ட-உடன்படிக்கை நடை பயன்படுத்தப்பட்டுள்ளது. ‘நீதித் தீர்ப்புகள்’ சற்றே முறையான சொல் என்றாலும், மூலத்தின் இரட்டைச் சட்டச் சொற்களைப் பாதுகாக்கிறது. ‘கக்கி வெளியேற்றாது’ என்பது திட்டமிட்டே வலுவாக வைக்கப்பட்டுள்ளது; மூல உருவகம் மென்மைப்படுத்தப்படவில்லை.
