base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/009.yaml
  text: For any man who curses his father or his mother shall surely be put to death[a]; he has cursed his father and his mother[c][b]; his blood is on him.
translation:
  language: ta
  text: தன் தகப்பனையோ தாயையோ சபிக்கிற எவனும் நிச்சயமாகக் கொல்லப்பட வேண்டும். அவன் தன் தகப்பனையும் தாயையும் சபித்திருக்கிறான்[a]; அவனுடைய இரத்தப்பழி அவன்மேல் இருக்கும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவன் தன் தகப்பனையோ தாயையோ சபித்திருக்கிறான்.” எபிரெயத்தில் இங்கு “தகப்பனையும் தாயையும்” என்று உள்ளது; சட்டப் பொருளில் பெற்றோரில் யாரைச் சபித்தாலும் தண்டனை பொருந்தும்.
    reason: lexical_alternative
  - marker: b
    text: நேரடியாக, “அவனுடைய இரத்தங்கள் அவன்மேல்.” இந்த எபிரெய மரபுத்தொடர் அவனுடைய மரணத்திற்கான பொறுப்பு அவனிடமே இருப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אִישׁ
  choice: எவனும்
  rationale: இரட்டிக்கப்பட்ட பெயர்ச்சொல் பகிர்நிலைப் பொருளில் ‘எந்த மனிதனும்/எவனும்’ என்பதைக் குறிக்கிறது; சட்டவாக்கியத்தில் இயல்பான தமிழாக ‘எவனும்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: יְקַלֵּל / קִלֵּל
  choice: சபிக்கிற / சபித்திருக்கிறான்
  rationale: פיעל வடிவிலுள்ள קלל இங்கு வெறுமனே அவமதிப்பதை அல்ல, பெற்றோருக்கு எதிராகச் சாபம் கூறுவதைக் குறிக்கிறது.
- source_word: אָבִיו וְאֶת אִמּוֹ
  choice: தன் தகப்பனையோ தாயையோ
  rationale: எபிரெயத்தில் இணைப்புச் சொல் ‘மற்றும்’ என்றிருந்தாலும், பெற்றோரில் யாரைச் சபித்தாலும் தண்டனை பொருந்தும் சட்டப் பகிர்நிலையைத் தமிழில் ‘-யோ…-யோ’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: מוֹת יוּמָת
  choice: நிச்சயமாகக் கொல்லப்பட வேண்டும்
  rationale: வினையெச்சப் பெயருருவும் வரையறுக்கப்பட்ட வினையும் சேர்ந்த வலியுறுத்தலை ‘நிச்சயமாக’ என்பதும், நீதித்துறை சார்ந்த செயப்பாட்டு பொருளை ‘கொல்லப்பட வேண்டும்’ என்பதும் காக்கின்றன.
- source_word: דָּמָיו בּוֹ
  choice: அவனுடைய இரத்தப்பழி அவன்மேலேயே இருக்கும்
  rationale: அவனுடைய மரணத்திற்கான பொறுப்பு அவனிடமே இருப்பதைச் சுட்டும் சட்ட மரபுத்தொடரை, வெறும் ‘இரத்தம்’ என்பதால் ஏற்படக்கூடிய தெளிவின்மையைத் தவிர்த்து ‘இரத்தப்பழி’ என்று வழங்குகிறது.
theological_decisions:
- issue: பெற்றோரைக் குறிக்கும் இணைப்புச் சொல்
  choice: முதல் இடத்தில் ‘தகப்பனையோ தாயையோ’; காரணவிளக்கத்தில் ‘தகப்பனையும் தாயையும்’
  alternative: இரு இடங்களிலும் ‘தகப்பனையும் தாயையும்’
  rationale: முதல் கூற்றில் பெற்றோரில் யாரைச் சபித்தாலும் தண்டனை பொருந்தும் சட்டப் பொருள் வெளிப்படுகிறது; இரண்டாவது கூற்று எபிரெயத்தின் ‘மற்றும்’ அமைப்பைப் பாதுகாத்து குற்றத்தைச் சுருக்கிக் கூறுகிறது.
- issue: דָּמָיו בּוֹ என்ற பொறுப்புச் சூத்திரம்
  choice: அவனுடைய இரத்தப்பழி அவன்மேலேயே இருக்கும்
  alternative: அவனுடைய இரத்தம் அவன்மேல் இருக்கும்
  rationale: இது குற்றவாளி தனது மரணத்திற்குத் தானே பொறுப்பு என்பதைக் குறிக்கும் நீதித்துறைச் சூத்திரம்; பிற்காலப் பரிகாரக் கோட்பாடுகளையோ வேறு மறைபொருளையோ இதில் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான சட்டநடை பயன்படுத்தப்பட்டுள்ளது. ‘தகப்பன்’, ‘சபி’, ‘இரத்தப்பழி’ ஆகியவை வேதாகமச் சூழலுக்கேற்றவையாகவும் பொதுவாசகர்களுக்குப் புரியக்கூடியவையாகவும் உள்ளன; மூலத்தின் வலியுறுத்தலும் நீதித்துறைப் பொறுப்பும் பாதுகாக்கப்பட்டுள்ளன.
