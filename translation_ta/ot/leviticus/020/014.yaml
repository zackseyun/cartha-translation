  text: וְ/אִ֗ישׁ אֲשֶׁ֨ר יִקַּ֧ח אֶת אִשָּׁ֛ה וְ/אֶת אִמָּ֖/הּ זִמָּ֣ה הִ֑וא בָּ/אֵ֞שׁ יִשְׂרְפ֤וּ אֹת/וֹ֙ וְ/אֶתְ/הֶ֔ן וְ/לֹא תִהְיֶ֥ה זִמָּ֖ה בְּ/תוֹכְ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/014.yaml
  text: If a man takes a woman and her mother[a], it is depravity. They shall burn him and them with fire[c][b], so that there will not be depravity among you.
translation:
  language: ta
  text: ஒருவன் ஒரு பெண்ணையும் அவளுடைய தாயையும் எடுத்துக்கொண்டால்[a], அது கொடிய ஒழுக்கக்கேடு[c]. அவனையும் அந்த இரு பெண்களையும்[b] நெருப்பால் எரிக்க வேண்டும்; உங்கள் நடுவில் ஒழுக்கக்கேடு இருக்காதபடிக்கு.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஒரு பெண்ணையும் அவளுடைய தாயையும் மணந்துகொண்டால்.’ ‘எடுத்துக்கொள்’ என்பதற்கான எபிரெய வினைச்சொல் சட்டச் சூழல்களில் திருமணத்தைக் குறிக்கக்கூடும்; ஆனால் இங்கு திருமணம் வெளிப்படையாகக் குறிப்பிடப்படவில்லை.
    reason: lexical_alternative
  - marker: b
    text: ‘அந்த இரு பெண்கள்’ என்பது அந்தப் பெண்ணையும் அவளுடைய தாயையும் குறிக்கிறது.
    reason: referent_clarification
  - marker: c
    text: ‘கொடிய ஒழுக்கக்கேடு’ என்பதற்கான எபிரெயச் சொல்லை ‘தீய செயல்,’ ‘வக்கிரம்,’ அல்லது ‘அருவருப்பான செயல்’ என்றும் மொழிபெயர்க்கலாம்; இது மிகக் கடுமையான பாலியல் ஒழுக்க மீறலைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: ஒருவன்
  rationale: எபிரெயச் சொல் ஆண்பால் ஒருமையில் இருந்து, இச்சட்டத்தில் குற்றத்தில் ஈடுபடும் ஆணைக் குறிக்கிறது.
- source_word: יִקַּח
  choice: எடுத்துக்கொண்டால்
  rationale: לקח என்பதன் அடிப்படைப் பொருளான ‘எடுத்துக்கொள்’ என்பதைப் பாதுகாக்கிறது; சட்டச் சூழலில் இது திருமணம் அல்லது பாலுறவுச் சேர்க்கையைக் குறிக்கக்கூடும் என்றாலும், மூலவாக்கியம் திருமணத்தை வெளிப்படையாகக் குறிப்பிடவில்லை.
- source_word: אִשָּׁה
  choice: ஒரு பெண்
  rationale: אִשָּׁה என்பதற்கு ‘பெண்’ அல்லது ‘மனைவி’ என்று பொருள் வரலாம். திருமண நிலையைத் தீர்மானிக்காமல் மூலத்தின் பரந்த பொருளை ‘பெண்’ பாதுகாக்கிறது.
- source_word: אִמָּהּ
  choice: அவளுடைய தாய்
  rationale: முன்னர் குறிப்பிடப்பட்ட பெண்ணின் தாயை நேரடியாகக் குறிக்கும் உடைமைத் தொடர்.
- source_word: זִמָּה
  choice: கொடிய ஒழுக்கக்கேடு
  rationale: லேவியராகமத்தின் பாலியல் சட்டங்களில் இச்சொல் மிகக் கடுமையான ஒழுக்க மீறலைக் குறிக்கிறது. ‘கொடிய ஒழுக்கக்கேடு’ அதன் தீவிரத்தையும் பாலியல்-ஒழுக்கச் சூழலையும் இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: בָּאֵשׁ
  choice: நெருப்பால்
  rationale: இங்குள்ள முன்னொட்டு செயல் நிறைவேறும் கருவி அல்லது வழிமுறையைக் குறிக்கிறது.
- source_word: יִשְׂרְפוּ אֹתוֹ וְאֶתְהֶן
  choice: அவனையும் அந்த இரு பெண்களையும் நெருப்பால் எரிக்க வேண்டும்
  rationale: மூலத்தில் ஆணும் இரு பெண்களும் செயலின் பொருட்களாக உள்ளனர். தமிழின் சட்டநடைப் பயன்பாட்டில் இயல்பான ஆளற்ற கட்டளை வடிவம் பயன்படுத்தப்பட்டாலும், மூவரும் தெளிவாகக் குறிப்பிடப்படுகின்றனர்.
- source_word: וְלֹא תִהְיֶה זִמָּה בְּתוֹכְכֶם
  choice: அப்போது உங்கள் நடுவில் இப்படிப்பட்ட ஒழுக்கக்கேடு இருக்காது
  rationale: தண்டனையின் நோக்கம் அல்லது விளைவை இயல்பாகத் தெரிவிக்கிறது; ‘உங்கள் நடுவில்’ என்பது בְּתוֹכְכֶם என்பதற்கு நேரடியான இணை.
theological_decisions:
- issue: ‘ஒரு பெண்ணையும் அவளுடைய தாயையும் எடுத்துக்கொள்வது’ குறிக்கும் உறவின் தன்மை
  choice: திருமணம் என்று வெளிப்படையாக வரையறுக்காமல், ‘எடுத்துக்கொண்டால்’ என்று பரந்த முறையில் மொழிபெயர்க்கப்பட்டது.
  alternative: ‘ஒரு பெண்ணையும் அவளுடைய தாயையும் மணந்துகொண்டால்’
  rationale: לקח என்பது சட்டச் சூழலில் திருமணத்தைக் குறிக்கக்கூடும்; ஆனால் இவ்வசனத்தில் தனியான திருமணச் சொல் இல்லை. ஆகவே மூலத்தில் உள்ள தெளிவின்மையைத் தீர்த்துவிடாமல் பாதுகாக்கப்படுகிறது.
- issue: தண்டனை வாக்கியத்தின் இலக்கண வடிவம்
  choice: ‘அவனையும் அந்த இரு பெண்களையும் நெருப்பால் எரிக்க வேண்டும்’ என்ற தமிழ் சட்டக் கட்டளை வடிவம்.
  alternative: ‘அவர்கள் அவனையும் அவர்களையும் நெருப்பால் எரிக்க வேண்டும்’ அல்லது ‘அவனும் அவர்கள் இருவரும் நெருப்பால் எரிக்கப்பட வேண்டும்.’
  rationale: எபிரெயத்தில் வினை செயப்பாட்டு அல்ல, பலர்பால் செய்வினையாக உள்ளது; ஆனால் செய்பவர்கள் வெளிப்படையாகக் கூறப்படவில்லை. தமிழில் செய்பவர்களைச் சேர்க்காமல் சட்டக் கட்டளை வடிவைப் பயன்படுத்துவது தேவையற்ற விளக்கத்தைத் தவிர்த்து, தண்டனையின் பொருட்களைத் தெளிவாக்குகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதில் புரியும், கண்ணியமான சட்டநடை பயன்படுத்தப்பட்டுள்ளது. ‘எடுத்துக்கொண்டால்’ என்பது தமிழில் சற்று சொற்பொருள் சார்ந்திருந்தாலும், திருமணம் என்று தேவையின்றி குறுக்காமல் மூலத்தின் ambiguity-ஐ பாதுகாக்கிறது. ‘நெருப்பால் எரிக்க வேண்டும்’ என்பது மரணத்தைத் தனியாகச் சேர்க்காமல் மூலத்தின் தண்டனைச் சொல்லாட்சியைத் தக்கவைக்கிறது.
