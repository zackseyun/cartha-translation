base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/027.yaml
  text: And a man or a woman[a], if there is in them a medium or a spiritist, shall surely be put to death; they shall stone them with stones[c][b]. Their blood is on them.
translation:
  language: ta
  text: ஒரு ஆணோ பெண்ணோ ஆவியுடன் தொடர்புகொள்ளும் ஊடகராக[a] அல்லது ஆவிகளிடம் குறிகேட்பவராக[b] இருந்தால், அவர்கள் நிச்சயமாகக் கொல்லப்பட வேண்டும். அவர்களைக் கல்லெறிந்து கொல்ல வேண்டும். அவர்களுடைய இரத்தம் அவர்கள்மேலேயே இருக்கிறது.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: אוֹב என்ற எபிரெயச் சொல், இறந்தோரிடம் குறிகேட்பதோடு தொடர்புடைய ஆவியையோ, விரிவான பொருளில் அந்த ஆவியுடன் தொடர்புகொள்ளும் ஊடகரையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: יִדְּעֹנִי என்பதற்கு ‘ஆவிகளிடமிருந்து மறைவான அறிவைப் பெற முயல்பவர்’ என்றும் பொருள் கொள்ளலாம். கற்பனை இலக்கியத்தை நினைவூட்டக்கூடிய பழைய சொற்களைத் தவிர்க்க இங்கு ‘ஆவிகளிடம் குறிகேட்பவர்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: c
    text: ‘அவர்களுடைய இரத்தம் அவர்கள்மேலேயே இருக்கிறது’ என்பது, தங்கள் மரணத்திற்கான சட்டவியல் பொறுப்பு அவர்களுக்கே உரியது என்பதைக் குறிக்கும் வாய்பாடு.
    reason: cultural_note
lexical_decisions:
- source_word: וְאִישׁ אֽוֹ אִשָּׁה
  choice: ஒரு ஆணோ பெண்ணோ
  rationale: எபிரெய மூலத்தில் ஆண், பெண் இருவரும் வெளிப்படையாகக் குறிப்பிடப்படுவதைக் காக்கிறது; தொடக்க இணைப்புச்சொல்லைத் தமிழில் இயல்புக்காகத் தனியே மொழிபெயர்க்கவில்லை.
- source_word: כִּי יִהְיֶה בָהֶם
  choice: …ஆக இருந்தால்
  rationale: ‘அவர்களில் இருந்தால்’ என்ற சொற்சொல் வடிவம் தமிழில் இயல்பற்றதாகவும் தவறாகப் புரியக்கூடியதாகவும் இருப்பதால், அந்த நபரிடம் இத்தகைய ஆவித் தொடர்பு அல்லது நடைமுறை இருப்பதைக் குறிக்கும் நிபந்தனையாக இயல்பாக வழங்கப்பட்டுள்ளது.
- source_word: אוֹב
  choice: இறந்தோரின் ஆவிகளுடன் தொடர்புகொள்ளும் ஊடகர்
  rationale: இச்சூழலில் இறந்தோரிடம் குறிகேட்கும் ஆவித் தொடர்பு நடைமுறையையோ அதில் ஈடுபடும் நபரையோ குறிக்கலாம். நவீன வாசகருக்குத் தெளிவாக இருக்க நடைமுறைசார்ந்த விளக்கத்துடன் ‘ஊடகர்’ பயன்படுத்தப்பட்டுள்ளது; மூலச்சொல்லின் வேறு சாத்தியம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: יִדְּעֹנִי
  choice: ஆவிகளிடம் குறிகேட்பவர்
  rationale: ஆவித் தொடர்பின் மூலம் மறைவான அறிவை நாடும் நபரை இயல்பான தமிழில் குறிக்கிறது; கற்பனைக் கதைகளோடு தொடர்புடைய சொற்களைத் தவிர்க்கிறது, அதேவேளையில் துல்லியமான பண்டைய வகைப்பாட்டைத் தீர்மானிப்பதில்லை.
- source_word: מוֹת יוּמָתוּ
  choice: கண்டிப்பாகக் கொல்லப்பட வேண்டும்
  rationale: வினையெச்ச முழுவடிவமும் வரையறுக்கப்பட்ட வினையும் சேர்ந்த எபிரெய வலியுறுத்தலை ‘கண்டிப்பாக’ என்பதன் மூலம் வெளிப்படுத்துகிறது.
- source_word: בָּאֶבֶן יִרְגְּמוּ אֹתָם
  choice: அவர்கள்மீது கற்களை எறிந்து அவர்களைக் கொல்ல வேண்டும்
  rationale: கல்லெறிதலே மரணதண்டனையை நிறைவேற்றும் முறை என்பதைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது; மூலத்தில் குறிப்பிடப்பட்ட கற்களையும் விடாமல் காக்கிறது.
- source_word: דְּמֵיהֶם בָּם
  choice: அவர்களுடைய இரத்தம் அவர்கள்மேலேயே இருக்கிறது
  rationale: மரணத்திற்கான பொறுப்பு குற்றவாளிகளுக்கே உரியது என்பதைக் குறிக்கும் சட்டவியல் உருவகத்தை விளக்கமாக மாற்றாமல் காக்கிறது; அதன் பொருள் அடிக்குறிப்பில் கூறப்படுகிறது.
theological_decisions:
- issue: אוֹב மற்றும் יִדְּעֹנִי என்னும் ஆவித் தொடர்புச் சொற்களின் அடையாளம்
  choice: முதன்மை உரையில் அவற்றை ‘இறந்தோரின் ஆவிகளுடன் தொடர்புகொள்ளும் ஊடகர்’ மற்றும் ‘ஆவிகளிடம் குறிகேட்பவர்’ என்று நடைமுறையோடு தொடர்புடைய நபர்களாக வழங்குதல்
  alternative: அவற்றை நபருக்குள் இருக்கும் ‘பழக்கமான ஆவி’ அல்லது குறிசொல்லும் ஆவி என்று வழங்குதல்
  rationale: இவ்வசனத்தின் சட்டச் சூழல் இத்தகைய நடைமுறையில் ஈடுபடும் ஆண் அல்லது பெண்ணுக்குத் தண்டனை விதிக்கிறது. ஆயினும் אוֹב குறிப்பாக ஆவியையா ஊடகரையா குறிக்கிறது என்ற சொற்பொருள் நெகிழ்வை அடிக்குறிப்பு காக்கிறது; மொழிபெயர்ப்பு ஆவிகளின் இயல்பைப் பற்றிய மேலதிக கோட்பாட்டைத் தீர்மானிப்பதில்லை.
- issue: ஆண் மற்றும் பெண் என்ற வெளிப்படையான இரட்டைக் குறிப்பு
  choice: ‘ஒரு ஆணோ பெண்ணோ’ என்பதைத் தக்கவைத்தல்
  alternative: பாலினப் பொதுச்சொல்லான ‘எவராவது’ என்று வழங்குதல்
  rationale: மூல எபிரெயம் இரு பாலினங்களையும் வெளிப்படையாகப் பெயரிடுவதால் அந்த வடிவம் மொழிபெயர்ப்பிலும் பாதுகாக்கப்படுகிறது.
- issue: דְּמֵיהֶם בָּם என்ற சட்டவியல் வாய்பாடு
  choice: ‘அவர்களுடைய இரத்தம் அவர்கள்மேலேயே இருக்கிறது’ என்ற உருவகத்தைத் தக்கவைத்தல்
  alternative: ‘தங்கள் மரணத்துக்கு அவர்களே பொறுப்பு’ என்று விளக்கமாக மொழிபெயர்த்தல்
  rationale: மூலத்தின் சட்டவியல் உருவகத்தையும் அதன் இறையியல் பதற்றத்தையும் பிரதான உரையில் காக்கிறது; விளக்கம் அடிக்குறிப்பில் மட்டும் வழங்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான சட்டநடை பயன்படுத்தப்பட்டுள்ளது. ‘ஊடகர்’ தனியாகத் தெளிவில்லாமல் போகாதபடி அதன் செயல்பாடு முன்னர் விளக்கப்பட்டுள்ளது. மரணதண்டனை குறித்த மூலத்தின் வலியுறுத்தலும், இறுதி இரத்த உருவகமும் மென்மைப்படுத்தப்படவில்லை.
