  naturalness: நடை பொதுவாக நவீன தரத் தமிழுக்கு ஏற்றது. ‘அவர்கள்மீது கற்களை எறிந்து அவர்களைக் கொல்ல வேண்டும்’ என்பதற்குப் பதிலாக ‘அவர்களைக் கல்லெறிந்து கொல்ல வேண்டும்’ என்பது சுருக்கமாகவும் இயல்பாகவும் உள்ளது; அதே நேரத்தில் மூலத்தின் நிறைவேற்றுமுறையையும் காக்கிறது.
  terminology: ‘ஊடகர்’ மற்றும் ‘ஆவிகளிடம் குறிகேட்பவர்’ ஆகியவை நவீன வாசகருக்குப் புரியக்கூடிய, மதப்பிரிவு சாரா சொற்கள். אוֹב-க்கு ‘ஆவியுடன் தொடர்புகொள்ளும் ஊடகர்’ என்று கூறுவது, ‘இறந்தோரின்’ என்ற தேவையற்ற குறிப்பை நீக்கி சொற்பொருள் நெகிழ்வைச் சிறப்பாகக் காக்கிறது. יִדְּעֹנִי-க்கான அடிக்குறிப்பு மாற்றுச் சொல்லைத் தெளிவுபடுத்துகிறது.
