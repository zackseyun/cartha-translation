  revised_text: ஒரு ஆணோ பெண்ணோ ஆவியுடன் தொடர்புகொள்ளும் ஊடகராக[a] அல்லது ஆவிகளிடம் குறிகேட்பவராக[b] இருந்தால், அவர்கள் நிச்சயமாகக் கொல்லப்பட வேண்டும். அவர்களைக் கல்லெறிந்து கொல்ல வேண்டும். அவர்களுடைய இரத்தம் அவர்கள்மேலேயே இருக்கிறது.[c]
