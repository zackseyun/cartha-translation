  text: וַ/אֲנִ֞י אֶתֵּ֤ן אֶת פָּנַ/י֙ בָּ/אִ֣ישׁ הַ/ה֔וּא וְ/הִכְרַתִּ֥י אֹת֖/וֹ מִ/קֶּ֣רֶב עַמּ֑/וֹ כִּ֤י מִ/זַּרְע/וֹ֙ נָתַ֣ן לַ/מֹּ֔לֶךְ לְמַ֗עַן טַמֵּא֙ אֶת מִקְדָּשִׁ֔/י וּ/לְ/חַלֵּ֖ל אֶת שֵׁ֥ם קָדְשִֽׁ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/003.yaml
  text: I myself will set my face against that man and cut him off from among his people[a], because he has given some of his offspring to Molech, so as to defile my sanctuary and to profane my holy name.
translation:
  language: ta
  text: நானே அந்த மனிதனுக்கு எதிராக என் முகத்தைத் திருப்பி, அவனை அவனுடைய மக்களின் நடுவிலிருந்து அகற்றிவிடுவேன். ஏனெனில், அவன் தன் சந்ததியிலிருந்து சிலரை மோலேகுக்குக் கொடுத்து[a], என் பரிசுத்த இடத்தைத் தீட்டுப்படுத்தவும் என் பரிசுத்தப் பெயரைப் பரிசுத்தமற்றதாக்கவும் செய்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தன் பிள்ளைகளில் சிலரை மோலேகுக்குப் பலியிட்டதால்.” எபிரெயத்தில் சொல்லுக்குச் சொல், “தன் சந்ததியிலிருந்து சிலரை மோலேகுக்குக் கொடுத்தான்”; இது பலியிடுதலைக் குறிக்கிறது என்பது சுற்றியுள்ள சூழலிலிருந்து அறியப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: நானே
  rationale: தனிப் பிரதிப்பெயர் தரும் வலியுறுத்தலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֶתֵּן אֶת־פָּנַי בָּאִישׁ הַהוּא
  choice: அந்த மனிதனுக்கு எதிராக என் முகத்தைத் திருப்பி
  rationale: தேவனுடைய திட்டவட்டமான எதிர்ப்பைக் குறிக்கும் எபிரெய மரபுத்தொடரின் உருவகத்தைத் தக்கவைக்கிறது; ב இங்கு எதிர்நிலையை உணர்த்துகிறது.
- source_word: וְהִכְרַתִּי אֹתוֹ
  choice: அவனை ... அறுத்துப்போடுவேன்
  rationale: உடன்படிக்கை மற்றும் நீதித்தீர்ப்புச் சூழலில் כרת என்பதன் வலிமையான மரபுத்தொடரைத் தக்கவைத்து, தண்டனையின் முறையை அளவுக்கு மீறி விளக்கவில்லை.
- source_word: מִקֶּרֶב עַמּוֹ
  choice: அவனுடைய மக்களிடையிலிருந்து
  rationale: சமூகத்தின் நடுவிலிருந்து நீக்கப்படுவதை இயல்பான தமிழில் கூறுகிறது.
- source_word: מִזַּרְעוֹ
  choice: தன் சந்ததியினரில் ஒருவரை
  rationale: מן-இன் பகுதியைக் குறிக்கும் பொருளையும் זרע-இன் சந்ததி என்ற பொருளையும் வெளிப்படுத்துகிறது; எண்ணிக்கையைத் தேவையின்றி பன்மையாக்கவில்லை.
- source_word: נָתַן לַמֹּלֶךְ
  choice: மோலேகுக்குக் கொடுத்து
  rationale: נתן என்பதன் நேரடிப் பொருளான ‘கொடு’ என்பதைத் தக்கவைத்து, பலியிட்டான் என்ற சூழல்சார் விளக்கத்தை முதன்மை உரைக்குள் சேர்க்கவில்லை.
- source_word: טַמֵּא אֶת־מִקְדָּשִׁי
  choice: என் பரிசுத்த இடத்தைத் தீட்டுப்படுத்தி
  rationale: ஆசாரத் தூய்மைக்கேட்டைக் குறிக்கும் טמא-ஐ ‘தீட்டுப்படுத்து’ என்றும் מקדש-ஐ தெளிவான தமிழில் ‘பரிசுத்த இடம்’ என்றும் வழங்குகிறது.
- source_word: וּלְחַלֵּל אֶת־שֵׁם קָדְשִׁי
  choice: என் பரிசுத்தப் பெயரைக் களங்கப்படுத்தினான்
  rationale: தேவனுடைய பெயரைப் பரிசுத்தமற்றதாக நடத்தும் חלל என்பதன் கருத்தையும் அதன் இறையியல் கனத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: மோலேகுடன் தொடர்புடைய குற்றத்தின் தன்மை
  choice: முதன்மை உரையில் ‘தன் சந்ததியினரில் ஒருவரை மோலேகுக்குக் கொடுத்து’ என்று மொழிபெயர்த்தல்
  alternative: ‘தன் பிள்ளைகளில் ஒருவரை மோலேகுக்குப் பலியிட்டு’
  rationale: சுற்றியுள்ள சூழல் பிள்ளைப் பலியைக் குறிப்பதாக இருந்தாலும், இவ்வசனம் עצמו ‘கொடுத்தான்’ என்ற பொதுவான வினையையே பயன்படுத்துகிறது; ஆகவே அந்தத் தெளிவின்மை முதன்மை உரையில் பாதுகாக்கப்பட்டு, விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: தேவனுடைய தனிப்பட்ட தலையீடும் நீதித்தீர்ப்பும்
  choice: ‘நானே’ என்ற வலியுறுத்தலையும் ‘என் முகத்தைத் திருப்பி’ என்ற உருவகத்தையும் தக்கவைத்தல்
  alternative: ‘நான் அந்த மனிதனை எதிர்ப்பேன்’
  rationale: மூலத்தில் தேவனுடைய தனிப்பட்ட நீதிச்செயல் வலியுறுத்தப்படுகிறது; பொதுவான ‘எதிர்ப்பேன்’ என்பது அந்த வலியுறுத்தலையும் உருவகத்தையும் தட்டையாக்கும்.
- issue: למען தொடரின் நோக்கம் அல்லது விளைவு
  choice: தமிழில் இயல்பாக காரணத் தொடருடன் இணைத்து குற்றத்தின் தீட்டுப்படுத்தும் விளைவை வெளிப்படுத்தல்
  alternative: ‘...தீட்டுப்படுத்துவதற்காகவும் ...களங்கப்படுத்துவதற்காகவும்’
  rationale: למען நோக்கத்தையோ நோக்கமுற்ற விளைவையோ குறிக்கலாம். குற்றவாளி தேவனுடைய பரிசுத்த இடத்தைக் களங்கப்படுத்துவதே தனிப்பட்ட நோக்கம் என்று அளவுக்கு மீறி நிர்ணயிக்காமல், தமிழில் விளைவு தெளிவாகத் தோன்றும் அமைப்பு பயன்படுத்தப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டது. ‘நானே,’ ‘முகத்தைத் திருப்பி,’ ‘அறுத்துப்போடுவேன்’ ஆகியவை மூலத்தின் வலியுறுத்தலையும் நீதித்தீர்ப்பு உருவகங்களையும் தக்கவைக்கின்றன; அடிக்குறிப்பு முதன்மை உரையில் சேர்க்கப்படாத பலியிடுதல் என்ற சூழல்சார் பொருளை விளக்குகிறது.
