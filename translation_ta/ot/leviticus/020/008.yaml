  yaml_path: translation/ot/leviticus/020/008.yaml
  text: You shall keep my statutes and do them. I am Yahweh[a], who sanctifies you.
translation:
  language: ta
  text: என் நியமங்களைக் கைக்கொண்டு, அவற்றைச் செய்யுங்கள். உங்களைப் புனிதப்படுத்துகிற யாவே நானே.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்களைப் பரிசுத்தப்படுத்துகிறவர்.”
    reason: மְקַדִּשְׁכֶם என்பதற்கு ‘உங்களைப் புனிதப்படுத்துகிறவர்’ என்பது முதன்மை மொழிபெயர்ப்பு; ‘பரிசுத்தப்படுத்துகிறவர்’ என்பது அதே קדשׁ சொல்லின் மரபுவழி இறையியல் சொல்லாட்சியைப் பயன்படுத்தும் மாற்றாகும்.
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: கடைப்பிடித்து
  rationale: שׁמר என்பது சட்டங்களையும் உடன்படிக்கை கட்டளைகளையும் கவனமாகப் பேணி அனுசரிப்பதைக் குறிக்கிறது; ‘கடைப்பிடி’ நவீனத் தமிழில் இயல்பாக அந்தச் சட்ட நுணுக்கத்தைத் தருகிறது.
- source_word: חֻקֹּתַי
  choice: என் நியமங்கள்
  rationale: חֻקָּה என்பது நிர்ணயிக்கப்பட்ட சட்ட விதிகளைச் சுட்டுகிறது; ‘நியமங்கள்’ அதன் சட்டத் தன்மையைத் தெளிவாகக் காக்கிறது.
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: அவற்றின்படி நடக்க வேண்டும்
  rationale: சட்டங்களை ‘செய்தல்’ என்ற எபிரேய மரபுத்தொடர் அவற்றை நடைமுறையில் செயல்படுத்துவதைக் குறிக்கிறது; சொற்சொற் பெயர்ப்பான ‘அவற்றைச் செய்யுங்கள்’ என்பதைவிட இத்தொடர் தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் அறியத்தக்க ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: מְקַדִּשְׁכֶם
  choice: உங்களைப் புனிதமாக்குகிற
  rationale: קדשׁ வினையின் causative participle வடிவம் யாவே தொடர்ந்து அல்லது இயல்பாகச் செய்யும் புனிதப்படுத்தும் செயலைக் குறிக்கிறது; ‘புனிதமாக்குகிற’ என்பது சாதாரண வாசகருக்கும் புரியும்படி அந்தப் பரிசுத்த மொழிநடையைப் பேணுகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலவசனம் தனிப்பட்ட தெய்வீகப் பெயரையே பயன்படுத்துவதால், அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்த்துள்ளது.
- issue: מְקַדִּשְׁכֶם என்பதில் உள்ள புனிதப்படுத்தும் கருத்து
  choice: உங்களைப் புனிதமாக்குகிற
  alternative: உங்களைத் தனக்கென்று அர்ப்பணிக்கிற
  rationale: மூலச்சொல் புனிதமாக்குதல் அல்லது புனித நோக்கத்திற்காகப் பிரித்துவைத்தல் ஆகிய தொடர்புடைய கருத்துகளைத் தாங்கலாம். முதன்மை உரை பரந்த புனிதத்தன்மைக் கருத்தைப் பேணுகிறது; அடிக்குறிப்பு அர்ப்பணித்துப் பிரித்துவைக்கும் நுணுக்கத்தைக் காட்டுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டப்பகுதிக்கேற்ற கண்ணியமான ஆனால் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. இரண்டாம் நபர் பன்மை முழுவதும் பேணப்பட்டுள்ளது; எபிரேயத்தின் சட்டவழி கட்டளைத் தன்மை ‘வேண்டும்’ மூலம் இயல்பான தமிழில் வெளிப்படுத்தப்பட்டுள்ளது.
