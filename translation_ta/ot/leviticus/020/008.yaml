revisions:
- from: நீங்கள் என் நியமங்களைக் கடைப்பிடித்து, அவற்றின்படி நடக்க வேண்டும். உங்களைப் புனிதமாக்குகிற யாவே நானே.[a]
  to: என் நியமங்களைக் கைக்கொண்டு, அவற்றைச் செய்யுங்கள். உங்களைப் புனிதப்படுத்துகிற யாவே நானே.[a]
  rationale: 'The revision restores the source text’s coordinated commands: Israel is to keep Yahweh’s statutes and do them. It preserves the explicit divine-name clause and the ongoing/characteristic sense of the participle, while replacing an interpretively expanded footnote with a closer alternative.'
