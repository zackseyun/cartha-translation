base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/006.yaml
  text: And the person who turns to the mediums and to the spiritists[a], to prostitute himself after them[c][b], I will set my face against that person and cut him off from among his people.
translation:
  language: ta
  text: ஆவிகளை அழைப்பவர்களையும் குறிசொல்பவர்களையும்[a] எவராவது நாடி, அவர்களைப் பின்பற்றி விபசாரம் செய்தால்[b], நான் அந்த நபருக்கு எதிராக என் முகத்தை நிலைநிறுத்தி, அவரை அவருடைய மக்களின் நடுவிலிருந்து அறுத்துப்போடுவேன்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இரண்டு எபிரெயச் சொற்களும் ஆவிகளையோ இறந்தோரையோ நாடும் வெவ்வேறு வகையான பயிற்சியாளர்களைக் குறிக்கலாம்; அவற்றுக்கிடையிலான துல்லியமான வேறுபாடு உறுதியாகத் தெரியவில்லை.
    reason: lexical_alternative
  - marker: b
    text: நேரடியாக, “அவர்களைப் பின்பற்றி விபசாரம் செய்ய.” இது முறையற்ற ஆவியுலகப் பழக்கங்களால் ஏற்படும் உடன்படிக்கைத் துரோகத்தைக் குறிக்கும் உருவகம்.
    reason: lexical_alternative
  - marker: c
    text: “அறுத்துப்போடுதல்” என்பது சட்டத்தில் வரும் வழக்கமான கூற்று; தீர்ப்பு எவ்வாறு நிறைவேற்றப்படும் என்பதை இவ்வசனம் குறிப்பாகச் சொல்லவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: הַנֶּפֶשׁ
  choice: எவராவது / அந்த நபர்
  rationale: லேவியராகமத்தின் சட்டச் சூழலில் נֶפֶשׁ என்பது உடலிலிருந்து வேறான ‘ஆத்துமா’ என்பதைக் காட்டிலும் தனிநபரைக் குறிக்கிறது. பாலினத்தை முன்னிறுத்தாத இயல்பான நவீனத் தமிழுக்காக இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: תִּפְנֶה
  choice: நாடி
  rationale: פנה என்பதன் அடிப்படைப் பொருள் ‘திரும்புதல்’; இங்கு உதவி அல்லது ஆலோசனைக்காக அத்தகைய நபர்களை அணுகுவதைக் குறிக்கும். ‘நாடி’ என்பது அந்தச் சூழற்பொருளை இயல்பாகத் தருகிறது.
- source_word: הָאֹבֹת
  choice: இறந்தோரின் ஆவிகளிடம் குறி கேட்பவர்கள்
  rationale: אוֹב என்பது இறந்தோர் அல்லது ஆவிகளைக் கலந்தாலோசிப்பதோடு தொடர்புடைய ஊடகர்களைக் குறிக்கிறது. தெளிவற்ற ஒலிபெயர்ப்பை விட இச்செயல்முறை சார்ந்த மொழிபெயர்ப்பு நவீன வாசகருக்குப் புரியும்.
- source_word: הַיִּדְּעֹנִים
  choice: ஆவிகளுடன் தொடர்புகொள்பவர்கள்
  rationale: יִדְּעֹנִי என்பது மறைஞானம் அல்லது ஆவித் தொடர்புடன் சம்பந்தப்பட்ட ஒரு பயிற்சியாளரைக் குறிக்கிறது; பெரும்பாலும் אוֹב உடன் இணைந்து வருகிறது. முதல் சொல்லிலிருந்து ஓரளவு வேறுபடுத்தியபடியே அதன் ஆவியுலகச் சொற்புலத்தை இத்தேர்வு காக்கிறது.
- source_word: לִזְנוֹת אַחֲרֵיהֶם
  choice: அவர்களைப் பின்பற்றி விபசாரம் செய்தால்
  rationale: זנה என்ற பாலியல் துரோக உருவகம் மூலத்தில் வெளிப்படையாக உள்ளது. தமிழில் பொருள் விளங்கும் வகையில் நிபந்தனை வாக்கியமாக அமைத்தாலும் ‘விபசாரம்’ என்ற உருவகம் தக்கவைக்கப்பட்டது.
- source_word: וְנָתַתִּי אֶת־פָּנַי בַּנֶּפֶשׁ הַהִוא
  choice: நான் அந்த நபருக்கு எதிராக என் முகத்தைத் திருப்பி
  rationale: இது தீர்ப்பில் கடவுள் ஒருவருக்கு எதிராக நிற்பதைக் குறிக்கும் எபிரெய உருவகம். வெறும் ‘எதிர்ப்பேன்’ என்று தட்டையாக்காமல் முகம் பற்றிய படிமம் பாதுகாக்கப்பட்டது.
- source_word: וְהִכְרַתִּי אֹתוֹ
  choice: அவரை அறுத்துப்போடுவேன்
  rationale: כרת என்பது சட்ட மற்றும் உடன்படிக்கைச் சூழலில் வரும் வழக்கமான ‘அறுத்துப்போடுதல்’ கூற்று. தண்டனையின் சரியான நடைமுறையை மூலவாக்கியம் குறிப்பிடாததால், ‘கொல்வேன்’ அல்லது ‘வெளியேற்றுவேன்’ என்று குறிப்பாக்கப்படவில்லை.
- source_word: מִקֶּרֶב עַמּוֹ
  choice: அவருடைய மக்களின் நடுவிலிருந்து
  rationale: சமூகத்தின் மத்தியிலிருந்து நீக்கப்படும் கடுமையான தீர்ப்பைச் சுட்டும் வழக்கமான கூற்றை நேரடியாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: உடன்படிக்கைத் துரோகத்தைக் குறிக்கும் விபசார உருவகம்
  choice: அவர்களைப் பின்பற்றி விபசாரம் செய்தால்
  alternative: அவர்களைப் பின்பற்றித் துரோகம் செய்தால்
  rationale: மூலத்தின் זנה பாலியல் முறைகேட்டின் உருவகத்தைக் குறிப்பாகப் பயன்படுத்துகிறது. அதை பொதுவான ‘துரோகம்’ என்று மாற்றுவது சட்ட மற்றும் உடன்படிக்கை சார்ந்த வலிமையை இழக்கச் செய்யும்.
- issue: ‘அறுத்துப்போடுதல்’ என்ற தண்டனையின் தன்மை
  choice: அவரை அறுத்துப்போடுவேன்
  alternative: அவரைக் கொன்றுவிடுவேன் / அவரைச் சமூகத்திலிருந்து வெளியேற்றுவேன்
  rationale: இந்தச் சட்டக் கூற்று மரணம், நேரடியான தெய்வீகத் தீர்ப்பு அல்லது சமூகத்திலிருந்து நீக்கம் ஆகியவற்றில் எதைத் துல்லியமாகக் குறிக்கிறது என்பதை இவ்வசனம் தீர்மானிக்கவில்லை. ஆகவே அந்தத் திறந்தநிலை பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகருக்குப் புரியும் ஆனால் சட்ட உரைக்கேற்ற கண்ணியமான நடையில் அமைக்கப்பட்டது. மறைஞானப் பயிற்சியாளர்களைக் குறிக்கும் அரிதான எபிரெயச் சொற்கள் விளக்க மொழிபெயர்ப்பாகத் தரப்பட்டுள்ளன; அவற்றின் நிச்சயமின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது. பாலினக் குறிப்பைத் தேவையின்றி வலுப்படுத்தாமல் ‘எவராவது / அந்த நபர்’ பயன்படுத்தப்பட்டுள்ளது.
