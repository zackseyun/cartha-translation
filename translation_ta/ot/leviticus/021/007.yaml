base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/007.yaml
  text: They shall not take a woman who is a prostitute or defiled, and they shall not take a woman divorced from her husband, for he is holy to his God.
translation:
  language: ta
  text: விலைமகளாகவோ, புனிதநிலை கெடுக்கப்பட்டவளாகவோ இருக்கும் ஒரு பெண்ணை அவர்கள் திருமணம் செய்துகொள்ளக் கூடாது.[a] தன் கணவனால் விவாகரத்து செய்யப்பட்ட ஒரு பெண்ணையும் அவர்கள் திருமணம் செய்துகொள்ளக் கூடாது. ஏனெனில், அவன் தன் கடவுளுக்குப் புனிதமானவன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “புனிதநிலை கெடுக்கப்பட்டவள்” என்பதற்கான எபிரெயச் சொல், பொதுவான அசுத்தத்தை மட்டும் அல்லாமல், புனித நிலை அல்லது ஆசாரியத் திருமணத்துக்கான தகுதி கெடுக்கப்பட்ட பெண்ணையும் குறிக்கலாம்.
    reason: חֲלָלָה என்ற அரிதான சட்டச் சொல்லின் பொருள் பரப்பையும் ஆசாரியச் சூழலையும் தெரிவித்து, மொழிபெயர்ப்பு தேவையற்ற அளவில் ஒரே விளக்கத்தைத் தீர்மானிப்பதைத் தவிர்க்கிறது.
lexical_decisions:
- source_word: זֹנָה (zonah)
  choice: விலைமகள்
  rationale: பாலியல் தொழிலில் அல்லது விபசார வாழ்வில் ஈடுபடும் பெண்ணைக் குறிக்கும் சொல்லை, நவீனத் தமிழில் நேரடியாகவும் புரியத்தக்கவாறும் வழங்குகிறது.
- source_word: חֲלָלָה (chalalah)
  choice: தூய்மை கெடுக்கப்பட்டவள்
  rationale: ח־ל־ל என்ற வேரிலுள்ள ‘புனித நிலை கெடுதல்/இழத்தல்’ என்ற கருத்தைத் தக்கவைக்கிறது; இது சாதாரண உடல் அசுத்தத்தை மட்டும் குறிக்காமல், ஆசாரியத் திருமணச் சூழலில் உள்ள புனித அல்லது சமூகத் தகுதி நிலையையும் குறிக்கக்கூடும் என்பதால் அடிக்குறிப்பு சேர்க்கப்பட்டுள்ளது.
- source_word: יִקָּחוּ (yiqqachu)
  choice: திருமணம் செய்துகொள்ளக் கூடாது
  rationale: சொல்லுக்கு நேரடியாக ‘எடுத்துக்கொள்ளுதல்’ என்று பொருள் இருந்தாலும், இங்கு ஒரு பெண்ணை மனைவியாக ஏற்றுக்கொள்ளுதல் என்பதே சூழல்பொருள்; இயல்பான தமிழில் இதைத் தெளிவாக வழங்குகிறது.
- source_word: גְּרוּשָׁה מֵאִישָׁהּ (gerushah me'ishah)
  choice: தன் கணவனால் விவாகரத்து செய்யப்பட்ட
  rationale: எபிரெயச் சொற்றொடரின் செயப்படுபொருள் அமைப்பையும், கணவனிடமிருந்து அனுப்பிவிடப்பட்ட பெண் என்ற கருத்தையும் இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: קָדֹשׁ הוּא לֵאלֹהָיו (qadosh hu le'lohav)
  choice: அவன் தன் கடவுளுக்குப் புனிதமானவன்
  rationale: பன்மையில் தொடங்கிய கட்டளைக்குப் பின் எபிரெயத்தில் வரும் ஒருமையை மாற்றாமல் வைத்திருக்கிறது; ஒவ்வோர் ஆசாரியனையும் தனிப்படக் குறிக்கலாம் அல்லது ஆசாரிய வர்க்கத்தை ஒருமையாகக் கொள்ளலாம்.
theological_decisions:
- issue: חֲלָלָה என்பதன் ஆசாரியச் சட்டப் பொருள்
  choice: தூய்மை கெடுக்கப்பட்டவள்
  alternative: புனித நிலையை இழந்தவள் / தகுதியிழந்தவள்
  rationale: சொல்லின் புனிதத்தன்மை கெடுதல் என்ற வேர்ப்பொருளைத் தக்கவைத்து, குறிப்பிட்ட சட்டப் பிரிவை அளவுக்கு மீறி வரையறுக்காமல் அதன் உண்மையான பொருள் விரிவை அடிக்குறிப்பில் தெரிவிக்கிறது.
- issue: இறுதிக் காரணவாக்கியத்தின் ஒருமை
  choice: அவன் தன் கடவுளுக்குப் புனிதமானவன்
  alternative: அவர்கள் தங்கள் கடவுளுக்குப் புனிதமானவர்கள்
  rationale: மூலத்தில் கட்டளைகள் பன்மையில் இருந்தாலும் காரணவாக்கியம் ஒருமையில் உள்ளது. இந்த மாறுபாட்டைச் சீராக்காமல் பாதுகாப்பது மூலத்தின் அமைப்பையும் சாத்தியமான கூட்டொருமைப் பொருளையும் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சட்டக் கட்டளைக்கேற்ற கண்ணியமான, நேரடியான நடை. ‘எடுத்துக்கொள்ளுதல்’ என்ற சொற்படி வடிவத்துக்கு மாற்றாகத் திருமணச் சூழலைத் தெளிவாக்க ‘திருமணம் செய்துகொள்ளுதல்’ பயன்படுத்தப்பட்டது. மூலத்தின் பன்மை–ஒருமை மாறுபாடு நோக்கமுடன் பாதுகாக்கப்பட்டது.
