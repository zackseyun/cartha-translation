base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/009.yaml
  text: And the daughter of a priest[a], if she profanes herself by prostituting herself, profanes her father[b]; she shall be burned with fire.
translation:
  language: ta
  text: ஆசாரியனின் மகள், விலைமகளாக நடப்பதன் மூலம்[b] தன் பரிசுத்தத்தைக் குலைத்தால்[a], அவள் தன் தந்தையின் பரிசுத்தத்தைக் குலைக்கிறாள்; அவள் நெருப்பால் எரிக்கப்பட வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “விலைமகளாக நடக்கத் தொடங்கினால்.” இங்குள்ள எபிரெய வினை சில சூழல்களில் “தொடங்கு” என்று பொருள்படும்; ஆனால் இச்சூழலில் தன்னைப் புனிதக்கேடாக்குதல் அல்லது தன் பரிசுத்தத்தைக் குலைத்தல் என்பதே பொருத்தமான பொருள்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “விபசாரம் செய்வதன் மூலம்.” எபிரெயச் சொல் விலைமகளாக நடத்தல் அல்லது விபசாரத்தில் ஈடுபடுதல் என்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַת אִישׁ כֹּהֵן
  choice: ஆசாரியனான ஒருவனின் மகள்
  rationale: ‘ஒரு மனிதனின் மகள்—அவன் ஓர் ஆசாரியன்’ என்ற எபிரெயக் கட்டமைப்பை இயல்பான தமிழில் தருவதோடு, சட்ட உரையின் முறையான தொனியையும் காக்கிறது.
- source_word: כִּי
  choice: …கெடுத்தால்
  rationale: இந்தச் சட்டச் சூழலில் நிபந்தனை வழக்கை அறிமுகப்படுத்துவதால், ‘என்றால்/ஆனால்’ என்பதன் பொருளைத் தமிழ் நிபந்தனை விகுதி இயல்பாக வெளிப்படுத்துகிறது.
- source_word: תֵחֵל
  choice: தன் புனிதநிலையைக் கெடுத்தால்
  rationale: חלל என்பதன் நிபால் வடிவம் இங்கு ‘தீட்டுப்படுதல்/புனிதநிலையை இழத்தல்’ என்ற விளைவைக் குறிக்கிறது. ‘புனிதநிலையைக் கெடுத்தல்’ என்பது ஆசாரியப் பரிசுத்தச் சூழலைத் தெளிவாகத் தக்கவைக்கிறது; ‘தொடங்குதல்’ என்ற சாத்தியப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לִזְנוֹת
  choice: விலைமகளாக நடந்துகொள்வதன் மூலம்
  rationale: זנה என்பதன் குறிப்பான பாலியல் பொருளையும், ‘விலைமகளாக நட’ என்ற எபிரெய மொழிவழக்கையும் இது பரந்த ‘பாலியல் ஒழுக்கக்கேடு’ என்று பொதுமைப்படுத்தாமல் வெளிப்படுத்துகிறது.
- source_word: אֶת אָבִיהָ הִיא מְחַלֶּלֶת
  choice: அவள் தன் தகப்பனின் புனிதத்தைக் கெடுக்கிறாள்
  rationale: மூலத்தில் ‘தன் தகப்பனை அவள் புனிதக்கேடாக்குகிறாள்’ என்று உள்ளது. தமிழில் இயல்பாகவும், חלל என்பதன் ஆசாரியப் புனிதத்தன்மை சார்ந்த வலிமையைப் பாதுகாக்கவும் ‘தகப்பனின் புனிதத்தைக் கெடுக்கிறாள்’ என வழங்கப்படுகிறது.
- source_word: בָּאֵשׁ תִּשָּׂרֵף
  choice: அவள் நெருப்பால் எரிக்கப்பட வேண்டும்
  rationale: நிபால் வினையும் சட்டக் கட்டளையின் வலிமையும் செயப்பாட்டு வடிவில் தக்கவைக்கப்படுகின்றன; ‘வேண்டும்’ என்பது தமிழில் விதிக்கப்பட்ட தண்டனையை இயல்பாகக் குறிக்கிறது.
theological_decisions:
- issue: ஆசாரியப் பரிசுத்தச் சட்டத்தில் חלל என்ற சொல்லின் மொழிபெயர்ப்பு
  choice: இரு இடங்களிலும் ‘புனிதநிலையைக்/புனிதத்தைக் கெடுத்தல்’ என்ற ஒரே கருத்துத் தொடர்பைப் பேணுதல்
  alternative: ‘தீட்டுப்படுத்துதல்’ அல்லது ‘அவமதித்தல்’ என்று மொழிபெயர்த்தல்
  rationale: חלל என்ற ஒரே வேர் மகளின் நிலையையும் அவளுடைய ஆசாரியத் தகப்பனையும் இணைக்கிறது. ‘அவமதித்தல்’ வழிபாட்டு-பரிசுத்தப் பரிமாணத்தை வலுவிழக்கச் செய்யும்; ‘தீட்டுப்படுத்துதல்’ தமிழில் சடங்கு அசுத்தத்தை மட்டும் மிகுதியாக உணர்த்தக்கூடும். தேர்ந்த வடிவம் உரையின் புனிதக்கேடு சார்ந்த பதற்றத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சட்ட உரைக்கேற்ற கண்ணியமான மற்றும் நேரடியான நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆசாரியன்,’ ‘புனிதநிலை,’ ‘நெருப்பால் எரிக்கப்பட வேண்டும்’ ஆகிய சொற்கள் முறையான தொனியைப் பேணுகின்றன; மூலத்தின் கடுமையான தண்டனை மென்மைப்படுத்தப்படவில்லை.
