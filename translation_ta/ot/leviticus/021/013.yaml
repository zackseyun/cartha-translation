base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/013.yaml
  text: And he shall take a wife in her virginity[a].
translation:
  language: ta
  text: அவன் கன்னித்தன்மையில் இருக்கும் ஒரு பெண்ணை மனைவியாகக் கொள்ள வேண்டும்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கன்னியாக இருக்கும் ஒரு பெண்ணை.” எபிரெய மொழியில் நேரடியாக, “அவளுடைய கன்னித்தன்மையில்” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: அவன்
  rationale: இணைப்பிடைச்சொல்லுடன் வரும் தனிப்பட்ட பதிலிப்பெயர் முந்தைய சட்டவாக்கியத்தின் தொடர்ச்சியையும் தலைப்பான நபருக்கு மெலிதான அழுத்தத்தையும் தருகிறது. தமிழில் வாக்கியத் தொடர்ச்சியே இதை இயல்பாக வெளிப்படுத்துவதால், தேவையற்ற மிகையழுத்தமின்றி ‘அவன்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: אִשָּׁה
  choice: ஒரு பெண்ணை மனைவியாக
  rationale: לקח என்பதோடு சேர்ந்த திருமணச் சூழலில் אִשָּׁה என்பது பொதுவாக ‘பெண்’ என்பதைக் கடந்த ‘மனைவி’ என்ற பொருளைக் கொண்டுள்ளது. தமிழில் ‘மனைவியாகக் கொள்ளுதல்’ என்ற இயல்பான திருமண மரபுத்தொடர் அந்தப் பொருளைத் தெளிவாக்குகிறது.
- source_word: בִּבְתוּלֶיהָ
  choice: கன்னித்தன்மையில் இருக்கும்
  rationale: בְּתוּלִים என்ற வடிவம் இங்கு அவளுடைய கன்னித்தன்மை என்னும் நிலையைக் குறிக்கிறது. ‘கன்னித்தன்மையில் இருக்கும்’ என்பது எபிரெயக் கட்டமைப்பை ஓரளவு காத்தபடியே நவீனத் தமிழில் புரியுமாறு தருகிறது; ‘கன்னியாக’ என்ற இயல்பான மாற்று அடிக்குறிப்பில் வழங்கப்படுகிறது.
- source_word: יִקָּח
  choice: மனைவியாகக் கொள்ள வேண்டும்
  rationale: לקח என்பதன் அடிப்படைப் பொருள் ‘எடுத்துக்கொள்’; மனைவியைப் பற்றிய சூழலில் அது திருமணம் செய்துகொள்வதைக் குறிக்கும் மரபுத்தொடர். சட்டவிதியின் கட்டாயத் தன்மையைக் காக்க ‘வேண்டும்’ பயன்படுத்தப்பட்டது.
theological_decisions:
- issue: ஆசாரியர் திருமணம் குறித்த சட்டத்தில் வரும் திருமண மரபுத்தொடர்
  choice: ‘ஒரு பெண்ணை மனைவியாகக் கொள்ள வேண்டும்’ என்று மொழிபெயர்த்தல்
  alternative: ‘ஒரு கன்னிப் பெண்ணைத் திருமணம் செய்துகொள்ள வேண்டும்’
  rationale: மாற்று மொழிபெயர்ப்பு தமிழில் மிகவும் இயல்பானது; எனினும், மூலத்தின் ‘பெண்ணை எடுத்துக்கொள்ளுதல்’ என்ற சட்டரீதியான திருமண மரபுத்தொடரையும் ‘கன்னித்தன்மையில்’ என்ற நிலைக் குறிப்பையும் முதன்மை உரை பாதுகாக்கிறது. இதனால் எந்தக் கூடுதல் சமயப்பிரிவு சார்ந்த விளக்கமும் புகுத்தப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டவிதிக்கேற்ற கண்ணியமான நடையும் கட்டாயத்தை உணர்த்தும் ‘வேண்டும்’ வடிவமும் பயன்படுத்தப்பட்டுள்ளன. ‘கன்னித்தன்மையில் இருக்கும்’ சற்றே முறையான சொற்றொடராக இருந்தாலும், மூலத்தின் சொல்லமைப்பைத் தெளிவாகக் காக்கிறது.
