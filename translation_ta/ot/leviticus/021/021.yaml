revisions:
- from: ஆசாரியனாகிய ஆரோனின் சந்ததியில் உடற்குறை உள்ள எந்த ஆணும் யெகோவாவின் நெருப்புப் பலிகளைச் செலுத்த நெருங்கக் கூடாது.[a] அவனுக்கு உடற்குறை இருப்பதால், தன் கடவுளின் அப்பத்தைச் செலுத்த அவன் நெருங்கக் கூடாது.[b]
  to: ஆசாரியனான ஆரோனின் சந்ததியிலுள்ள உடற்குறை கொண்ட எந்த ஆணும் யாவேயின் நெருப்புப் பலிகளைப் பலியிட நெருங்கக் கூடாது.[a] அவனுக்கு உடற்குறை உள்ளது; தன் கடவுளின் அப்பத்தைப் பலியிட அவன் நெருங்கக் கூடாது.[b]
