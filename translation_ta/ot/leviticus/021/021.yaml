  text: כָּל אִ֞ישׁ אֲשֶׁר בּ֣/וֹ מ֗וּם מִ/זֶּ֨רַע֙ אַהֲרֹ֣ן הַ/כֹּהֵ֔ן לֹ֣א יִגַּ֔שׁ לְ/הַקְרִ֖יב אֶת אִשֵּׁ֣י יְהוָ֑ה מ֣וּם בּ֔/וֹ אֵ֚ת לֶ֣חֶם אֱלֹהָ֔י/ו לֹ֥א יִגַּ֖שׁ לְ/הַקְרִֽיב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/021.yaml
  text: No man from the offspring of Aaron the priest who has a defect shall come near to offer the food offerings of Yahweh[a]. A defect is in him[b]; he shall not come near to offer the bread of his God.
translation:
  language: ta
  text: ஆசாரியனான ஆரோனின் சந்ததியிலுள்ள உடற்குறை கொண்ட எந்த ஆணும் யாவேயின் நெருப்புப் பலிகளைப் பலியிட நெருங்கக் கூடாது.[a] அவனுக்கு உடற்குறை உள்ளது; தன் கடவுளின் அப்பத்தைப் பலியிட அவன் நெருங்கக் கூடாது.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேயின் உணவுக் காணிக்கைகளை.”
    reason: lexical_alternative
  - marker: b
    text: “தன் கடவுளின் அப்பம்” என்பது பலியாகக் கடவுளுக்குப் படைக்கப்படும் உணவைக் குறிக்கும் ஆசாரிய வழக்கு; “தன் கடவுளின் உணவு” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אִישׁ ... לֹא
  choice: எந்த ஆணும் ... கூடாது
  rationale: כָּל என்பதும் பின்னரும் வரும் மறுப்பும் சேர்ந்து அனைவருக்கும் பொருந்தும் தடையைத் தெரிவிக்கின்றன. ஆசாரியப் பணியின் ஆண் சூழலைத் துல்லியமாகக் காட்ட ‘ஆண்’ பயன்படுத்தப்பட்டது.
- source_word: מוּם
  choice: உடற்குறை
  rationale: இந்த ஆசாரியச் சட்டச் சூழலில், பலி செலுத்தும் பணிக்குத் தகுதியற்றதாக்கிய உடல்சார் குறையை இது குறிக்கிறது; நவீன தமிழில் தெளிவாக இருப்பதற்காக ‘உடற்குறை’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: מִזֶּרַע אַהֲרֹן
  choice: ஆரோனின் சந்ததியில்
  rationale: זֶרַע இங்கு வம்சாவளியைக் குறிக்கிறது; ‘சந்ததி’ அதன் மரபுவழிப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: הַכֹּהֵן
  choice: ஆசாரியனாகிய
  rationale: இது ஆரோனை விளக்கும் இணைப்புச் சொல்லாக உள்ளது; தமிழில் ‘ஆசாரியனாகிய ஆரோன்’ என்பது இயல்பான அமைப்பு.
- source_word: יִגַּשׁ
  choice: நெருங்கக் கூடாது
  rationale: பலியிடும் பணிக்காக தேவசந்நிதியை அணுகுவதைக் குறிக்கும் நגשׁ என்பதன் வழிபாட்டுச் சார்ந்த பொருளையும், வசனத்திலுள்ள மறுபயன்பாட்டையும் காக்கிறது.
- source_word: לְהַקְרִיב
  choice: செலுத்த
  rationale: பலியை இறைவனிடம் படைப்பதைக் குறிக்கும் הקריב என்பதற்கு ‘செலுத்த’ என்பது தமிழில் வழிபாட்டுச் சூழலுக்கு இயல்பான இணை.
- source_word: אִשֵּׁי יְהוָה
  choice: யெகோவாவின் நெருப்புப் பலிகள்
  rationale: אִשֶּׁה என்பது நெருப்புடன் தொடர்புடைய பலிகளுக்கான ஆசாரியத் தொழில்நுட்பச் சொல். அதன் வடிவத்தையும் உணவுப் படைப்புகள் என்ற மாற்றுப் புரிதலையும் குறிப்பில் காக்கும் வகையில் ‘நெருப்புப் பலிகள்’ பயன்படுத்தப்பட்டது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: எபிரெயத் தனிப்பெயரான יהוה என்பதை பொதுப்பட்டமான ‘கர்த்தர்’ என்று மாற்றாமல், தமிழில் நிலைபெற்ற பெயர்வடிவமான ‘யெகோவா’ என வழங்குகிறது.
- source_word: לֶחֶם אֱלֹהָיו
  choice: தன் கடவுளின் அப்பம்
  rationale: לֶחֶם என்பதன் நேரடிப் பொருளான ‘அப்பம்’ காக்கப்படுகிறது; ஆசாரிய மொழிநடையில் இது கடவுளுக்குப் பலியாகப் படைக்கப்படும் உணவைக் குறிக்கும் உருவகப் பயன்பாடு என்பதை அடிக்குறிப்பு விளக்குகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே
  rationale: மூலத்தில் வரும் தனிப்பட்ட உடன்படிக்கைப் பெயரை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்க்கிறது. நவீன தமிழ்க் கிறிஸ்தவ வாசகர்களிடையே பரவலாக அறியப்படும் ‘யெகோவா’ தேர்ந்தெடுக்கப்பட்டது; ‘யாவே’ என்பது எபிரெய உச்சரிப்பை மறுகட்டமைக்கும் மற்றொரு வடிவம்.
- issue: אִשֵּׁי என்பதன் பொருள்
  choice: நெருப்புப் பலிகள்
  alternative: உணவுப் படைப்புகள்
  rationale: சொல்லின் நெருப்புடன் தொடர்புடைய பாரம்பரிய ஆசாரியப் பொருளை முதன்மை உரையில் காக்கிறது; வசனத்தின் அடுத்த பகுதியிலுள்ள ‘அப்பம்’ என்ற உணவு உருவகத்தால் ஆதரிக்கப்படும் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: உடற்குறையுள்ள ஆசாரியனைப் பற்றிய சட்ட மொழி
  choice: மூலத்தின் சட்டத் தடையை நேரடியாகக் காத்தல்
  alternative: மென்மைப்படுத்திய அல்லது பொதுமைப்படுத்திய சொல்லாக்கம்
  rationale: வசனம் கூறும் வரலாற்று-ஆசாரியச் சட்டத்தை மறைக்காமலும், அந்த நபரின் மதிப்பு அல்லது கடவுளுடன் உள்ள உறவு குறித்து மூலத்தில் இல்லாத தீர்ப்பைச் சேர்க்காமலும் மொழிபெயர்க்கிறது.
translation_notes:
  register: நவீன, மரியாதையான, சட்டநடைத் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘உடற்குறை’ என்பது இன்றைய வாசகருக்குத் தெளிவாகவும், மூலத்தின் ஆசாரியச் சட்டச் சூழலை வரையறுத்தும் உள்ளது. ‘நெருங்கக் கூடாது’ என்ற மறுபயன்பாடு எபிரெய உரையின் வலியுறுத்தலைக் காக்கிறது; அடிக்குறிப்பு குறிகள் அனைத்தும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
