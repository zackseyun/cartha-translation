base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/017.yaml
  text: 'Speak to Aaron[b][a], saying: Any man from your offspring throughout their generations who has a defect shall not come near to offer the food of his God.'
translation:
  language: ta
  text: 'ஆரோனிடம் இவ்வாறு சொல்: “உன் சந்ததியினரில், தலைமுறைதோறும், குறைபாடு[a] உள்ள எந்த ஆணும் தன் தேவனின் உணவை[b] படைக்க நெருங்கக்கூடாது.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உடற்குறை’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் מוּם (மூம்), இந்த ஆசாரியச் சூழலில் இப்பணியைச் செய்வதிலிருந்து ஒருவரை விலக்கும் உடல்சார்ந்த குறையைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்கு சொல், ‘தன் தேவனின் அப்பம்.’ இந்த ஆசாரியச் சூழலில் ‘அப்பம்’ என்பது பலியாகப் படைக்கப்படும் உணவைக் குறிக்கும் பரந்த பொருளில் வருகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר אֶל־אַהֲרֹן לֵאמֹר
  choice: ஆரோனிடம் இவ்வாறு சொல்
  rationale: எபிரெய மொழியின் கட்டளை மற்றும் உரையறிமுகச் சூத்திரத்தை இயல்பான நவீனத் தமிழில் தருகிறது; தேவையற்ற மறுகூறலைத் தவிர்க்கிறது.
- source_word: אִישׁ
  choice: எந்த ஆணும்
  rationale: இங்கு ஆசாரியப் பணிக்குத் தகுதியுள்ள ஆரோனின் ஆண் சந்ததியினரைக் குறிக்கும் இலக்கண ஆண்பால் ஒருமையைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: מִזַּרְעֲךָ
  choice: உன் சந்ததியினரில்
  rationale: ஆரோனிடமிருந்து பிறக்கும் வழிமரபைக் குறிக்கும் זרע என்பதன் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: לְדֹרֹתָם
  choice: தலைமுறைதோறும்
  rationale: ஆரோனின் வழிவந்த அடுத்தடுத்த தலைமுறைகள் அனைத்துக்கும் இக்கட்டளை பொருந்துவதைச் சுருக்கமாகவும் தெளிவாகவும் கூறுகிறது.
- source_word: מוּם
  choice: உடற்குறை
  rationale: இந்த ஆசாரியச் சட்டச் சூழலில் குறிப்பிட்ட பணியிலிருந்து விலக்கும் உடல்சார்ந்த குறைபாட்டைத் தெளிவுபடுத்துகிறது; வெறும் வெளித்தோற்றக் கறை என்ற தவறான எண்ணத்தைத் தவிர்க்கிறது.
- source_word: לֹא יִקְרַב
  choice: நெருங்கக்கூடாது
  rationale: பரிசுத்த இடத்தில் ஆசாரிய முறையில் அணுகுவதைக் குறிக்கும் קרב என்பதையும் சட்டத் தடையின் வலிமையையும் பாதுகாக்கிறது.
- source_word: לְהַקְרִיב
  choice: படைக்க
  rationale: பலியை அல்லது காணிக்கையை தேவனுக்கு முன் கொண்டுவந்து செலுத்தும் ஆசாரியச் செயலை இயல்பான தமிழ் வழிபாட்டுச் சொல்லால் தெரிவிக்கிறது.
- source_word: לֶחֶם אֱלֹהָיו
  choice: தன் தேவனின் உணவு
  rationale: לֶחֶם என்பதன் அடிப்படைப் பொருள் ‘அப்பம்’ என்றாலும், இவ்வாசாரியச் சூழலில் பலியாகப் படைக்கப்படும் உணவைக் குறிக்கும் பரந்த பொருளை ‘உணவு’ தெளிவாகத் தருகிறது.
theological_decisions:
- issue: உடற்குறை உள்ள ஆசாரியரைப் பற்றிய வழிபாட்டுச் சட்டத் தடை
  choice: குறிப்பிட்ட ஆசாரியப் பணியாகிய பலியுணவைப் படைக்க நெருங்குவதற்கான தடையாக மட்டும் மொழிபெயர்க்கப்பட்டது.
  alternative: இதை ஒருவரின் ஒழுக்கக் குற்றம், மனித மதிப்பின்மை அல்லது உடன்படிக்கைச் சமூகத்திலிருந்து முழுமையான விலக்கம் என விரிவுபடுத்துதல்.
  rationale: மூலவசனம் குறிப்பிட்ட பரிசுத்த இடப் பணிக்கான தகுதியையே ஒழுங்குபடுத்துகிறது; ஒருவரின் தனிப்பட்ட மதிப்பு அல்லது ஒழுக்கநிலையைப் பற்றி அது கூறாத கருத்தை மொழிபெயர்ப்பில் சேர்க்கக்கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டப்பாங்கும் வழிபாட்டுச் சூழலும் காக்கப்பட்டுள்ளன. ‘உடற்குறை’ என்பது சூழலைத் தெளிவுபடுத்துகிறது; வசனம் கூறாத மனித மதிப்பு குறித்த தீர்ப்பைச் சேர்க்கவில்லை. ‘நெருங்கக்கூடாது’ என்பது பரிசுத்த இடத்தை அணுகும் தொழில்நுட்பப் பொருளையும் தடையின் வலிமையையும் தக்கவைக்கிறது.
