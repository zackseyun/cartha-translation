base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/005.yaml
  text: They shall not make a bald patch on their head[a], nor shave off the edge of their beard, nor make cuts in their flesh.
translation:
  language: ta
  text: அவர்கள் தங்கள் தலையில் வழுக்கையான பகுதியை ஏற்படுத்தக்கூடாது; தங்கள் தாடியின் ஓரத்தை மழிக்கக்கூடாது[a]; தங்கள் உடலில் கீறல்களை ஏற்படுத்தக்கூடாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தங்கள் தாடியின் மூலைகளை.” எபிரெயச் சொல் ஓரம், பக்கம் அல்லது மூலை என்பவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יקרחה ... קָרְחָה
  choice: வழுக்கைப் பகுதியை உண்டாக்கக்கூடாது
  rationale: வினைச்சொல்–பெயர்ச்சொல் இணைப்பு, இயற்கையாக முடி உதிர்வதைக் குறிக்காமல் வேண்டுமென்றே வழுக்கையான பகுதியை உருவாக்குவதை வலியுறுத்துகிறது. இந்தத் தமிழ் நடை செயலைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: בְּרֹאשָׁם
  choice: தங்கள் தலையில்
  rationale: எபிரெயத்தில் ஒருமை பெயர்ச்சொல்லுடன் பன்மை உடைமை விகுதி உள்ளது. ‘தங்கள் தலையில்’ என்பது அந்தப் பகிர்ந்தளிக்கும் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: פְאַת זְקָנָם
  choice: தங்கள் தாடியின் ஓரம்
  rationale: פאה என்பது ஓரம், பக்கம் அல்லது மூலை என்பவற்றைக் குறிக்கலாம். குறிப்பிட்ட சவர முறையை தேவையின்றி நிர்ணயிக்காமல், ‘ஓரம்’ அடிப்படை உருவகத்தைப் பாதுகாக்கிறது.
- source_word: יְגַלֵּחוּ
  choice: மழிக்கக்கூடாது
  rationale: இங்கு பியேல் வடிவம் முடியைச் சவரம் செய்து அகற்றும் செயலைக் குறிக்கிறது. ‘மழித்தல்’ என்பது இதற்கான தெளிவான, மரியாதைமிக்க நவீனத் தமிழ் சொல்.
- source_word: וּבִבְשָׂרָם
  choice: தங்கள் சதையில்
  rationale: בשר என்பதன் நேரடிப் பொருள் ‘சதை’. உடலில் தாமே காயம் ஏற்படுத்தும் செயலின் உடல்சார்ந்த தன்மையை இந்த மொழிபெயர்ப்பு காக்கிறது.
- source_word: יִשְׂרְטוּ שָׂרָטֶת
  choice: வெட்டுக் கீறல்களை ஏற்படுத்தக்கூடாது
  rationale: வினைச்சொல்–பெயர்ச்சொல் இணைப்பு உடலை வெட்டுதல் அல்லது கீறுதல் என்ற செயலைக் குறிக்கிறது. ‘வெட்டுக் கீறல்கள்’ என்பது மிக மருத்துவமயமாகவோ விளக்கவுரையாகவோ இல்லாமல் செயலை நேரடியாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: தடையின் தன்மை
  choice: சடங்கு அல்லது உடல் மாற்றம் சார்ந்த செயல்களைத் தெளிவாக மொழிபெயர்த்து, இந்த வசனத்தில் இல்லாத காரண விளக்கத்தைச் சேர்க்காமல் விடுதல்
  alternative: லேவியராகமம் 19:28 அல்லது உபாகமம் 14:1 அடிப்படையில் ‘இறந்தவர்களுக்காக’ அல்லது ‘துக்கத்திற்காக’ என்று முதன்மை உரையில் சேர்த்தல்
  rationale: இந்த வசனம் தடைசெய்யப்பட்ட செயல்களைக் கூறுகிறது; இணையான பிற பகுதிகளில் உள்ள விளக்கச் சொற்றொடர் இங்கு இல்லை. ஆகவே உள்ளதை மட்டும் மொழிபெயர்ப்பது மூலத்தின் எல்லையையும் அதன் சூழல்சார் திறந்த தன்மையையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் மரியாதைமிக்க நடையைப் பயன்படுத்துகிறது. மூன்று தடைகளின் இணையான வாக்கிய அமைப்பு பேணப்பட்டுள்ளது. அடிக்குறிப்பு குறி பொருத்தமான ‘தாடியின் ஓரம்’ என்ற சொற்றொடருக்குப் பின் வைக்கப்பட்டுள்ளது.
