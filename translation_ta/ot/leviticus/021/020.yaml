base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/020.yaml
  text: or hunchbacked[a], or dwarfed, or with a defect in his eye, or with an itch, or with scabs[d][c][b], or with crushed testicles.
translation:
  language: ta
  text: அல்லது கூனான முதுகுடையவனோ,[a] அல்லது வளர்ச்சி குன்றியவனோ,[b] அல்லது கண்ணில் குறைபாடு உள்ளவனோ,[c] அல்லது சொறி உள்ளவனோ, அல்லது படை உள்ளவனோ,[d] அல்லது நசுக்கப்பட்ட விரைகள் உடையவனோ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு மொழிபெயர்ப்பு: ‘வளைந்த முதுகுடையவன்.’'
    reason: lexical_alternative
  - marker: b
    text: ‘வளர்ச்சி குன்றியவன்’ என்று மொழிபெயர்க்கப்பட்டுள்ள எபிரேயச் சொல்லின் பொருள் உறுதியற்றது; உடல் வளர்ச்சி தடைப்பட்ட அல்லது உடல் மெலிந்து குன்றிய நிலையையும் இது பொதுவாகக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: 'வேறு மொழிபெயர்ப்பு: ‘கண்ணில் புள்ளி உள்ளவன்.’ குறிப்பிட்ட கண் குறைபாடு எது என்பது உறுதியற்றது.'
    reason: lexical_alternative
  - marker: d
    text: இங்குள்ள இரண்டு எபிரேயச் சொற்களும் வெவ்வேறு தோல் நோய்களைக் குறிக்கக்கூடும்; அவற்றின் துல்லியமான நவீன நோயறிதல்கள் உறுதியற்றவை.
    reason: cultural_note
lexical_decisions:
- source_word: גִבֵּן
  choice: கூனான முதுகுடையவன்
  rationale: முதுகு வளைந்த அல்லது கூனான உடல்நிலையை நேரடியாகவும் இன்றைய தமிழில் தெளிவாகவும் குறிக்கிறது.
- source_word: דַק
  choice: வளர்ச்சி குன்றியவன்
  rationale: சொல்லின் பொருள் உறுதியற்றது; வழக்கமாகக் கருதப்படும் சிறிய அல்லது குன்றிய உடல் வளர்ச்சியைப் பொதுவாகக் காட்டி, அளவுக்கு மீறிய மருத்துவத் துல்லியத்தைத் தவிர்க்கிறது.
- source_word: תְּבַלֻּל בְּעֵינוֹ
  choice: கண்ணில் குறைபாடு உள்ளவன்
  rationale: குறிப்பிட்ட கண் நோய் எது என்பது தெளிவில்லாததால், காணக்கூடிய கண் குறைபாட்டைத் துல்லியமற்ற பொதுச் சொல்லால் பாதுகாக்கிறது.
- source_word: גָרָב
  choice: சொறி உள்ளவன்
  rationale: தோல் அரிப்பு அல்லது தோல் நோயைக் குறிக்கும் சொல்லுக்கு இயல்பான தமிழ்ச் சொல்; நவீன நோயறிதலைத் திணிக்கவில்லை.
- source_word: יַלֶּפֶת
  choice: படை உள்ளவன்
  rationale: גָרָב என்பதிலிருந்து வேறான மற்றொரு தோல் பாதிப்பைக் குறிக்கிறது; அதன் சரியான நவீன நோயறிதல் உறுதியற்ற நிலையிலும் வேறுபாட்டைக் காக்கிறது.
- source_word: מְרוֹחַ אָשֶׁךְ
  choice: நசுக்கப்பட்ட விதைகள் உள்ளவன்
  rationale: விதைப்பைகள் நசுக்கப்பட்ட அல்லது கடுமையாகச் சேதமடைந்த நிலையைக் குறிக்கும் எபிரேய உடற்குறிப்பை மறைமுகமின்றி வெளிப்படுத்துகிறது.
- source_word: אוֹ
  choice: அல்லது / -வனோ
  rationale: ஒவ்வொரு நிலையும் மாற்றாகப் பட்டியலிடப்படுவதைத் தமிழின் இணைப்புச் சொல்லாலும் கேள்வியல்லாத பட்டியல் வடிவான -ஓ விகுதியாலும் இயல்பாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: ஆசாரியப் பரிசுத்தச் சட்டத்தில் உடற்குறைபாடுகளைக் குறிப்பிடும் மொழி
  choice: உடல் நிலைகளை நேரடியாகக் கூறி, அவற்றோடு ஒழுக்கக் குற்றத்தையோ பாவத்தையோ இணைக்காமல் மொழிபெயர்த்தல்
  alternative: கடுமையைத் தணிக்க மறைமுகச் சொற்களைப் பயன்படுத்துதல் அல்லது நவீன மருத்துவப் பெயர்களைத் திணித்தல்
  rationale: இவ்வசனம் பலிபீடப் பணிக்கான ஆசாரியத் தகுதியைச் சார்ந்த உடல் நிலைகளைப் பட்டியலிடுகிறது; அந்த நிலைகள் ஒழுக்கக் குற்றம் என்று கூறவில்லை. ஆகவே மூலத்தின் உடல் சார்ந்த நேர்மையைப் பாதுகாத்து, மதிப்பிழக்கச் செய்யும் கூடுதல் கருத்துகளைத் தவிர்க்க வேண்டும்.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டப் பட்டியலின் மீளுருவை இயல்பாகக் காக்கும் கண்ணியமான நேரடி நடை பயன்படுத்தப்பட்டது. ‘கூனன்’ போன்ற தனிநபரை முழுவதும் குறைபாட்டால் அடையாளப்படுத்தும் சுருக்கப் பெயருக்குப் பதிலாக ‘கூனான முதுகுடையவன்’ என விளக்கமாகக் கூறப்பட்டது. ஆயினும் மூலத்தின் உடல் சார்ந்த நேர்மை மறைக்கப்படவில்லை.
