  text: קְדֹשִׁ֤ים יִהְיוּ֙ לֵ/אלֹ֣הֵי/הֶ֔ם וְ/לֹ֣א יְחַלְּל֔וּ שֵׁ֖ם אֱלֹהֵי/הֶ֑ם כִּי֩ אֶת אִשֵּׁ֨י יְהוָ֜ה לֶ֧חֶם אֱלֹהֵי/הֶ֛ם הֵ֥ם מַקְרִיבִ֖ם וְ/הָ֥יוּ קֹֽדֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/006.yaml
  text: They shall be holy to their God and shall not profane the name of their God[a], because they present the food offerings of Yahweh, the food of their God; therefore they shall be holy.
translation:
  language: ta
  text: அவர்கள் தங்கள் கடவுளுக்குப் பரிசுத்தமானவர்களாக இருக்க வேண்டும்; தங்கள் கடவுளின் பெயரைப் பரிசுத்தக்கேடாக்கக் கூடாது. ஏனெனில், அவர்கள் யாவேயின் நெருப்புப் பலிகளை—தங்கள் கடவுளின் உணவை—செலுத்துகிறார்கள்[a]. அவர்கள் பரிசுத்தமானவர்களாக இருக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொல்லுக்குச் சொல் வடிவில்: “யாவேயின் நெருப்புப் பலிகளை, தங்கள் கடவுளின் அப்பத்தை.”'
    reason: לֶחֶם என்பதன் நேரடிப் பொருள் ‘அப்பம்’; אִשֵּׁי என்பது நெருப்பில் செலுத்தப்படும் பலிகளைக் குறிக்கும் தொழில்நுட்பச் சொல் என்பதைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: קְדֹשִׁים / קֹדֶשׁ
  choice: பரிசுத்தமானவர்கள்
  rationale: எபிரெயச் சொற்களின் ‘பரிசுத்தமான, தனியே பிரித்துவைக்கப்பட்ட’ என்ற கருத்தையும், வசனத்தின் தொடக்கத்திலும் முடிவிலும் உள்ள மறுபடியுரைத்தலையும் காக்கிறது.
- source_word: יִהְיוּ
  choice: இருக்க வேண்டும்
  rationale: சட்டக் கட்டளையின் சூழலில் imperfect வடிவம் கொண்டுள்ள கடமைப்பொருளை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: לֵאלֹהֵיהֶם
  choice: தங்கள் கடவுளுக்கு
  rationale: கடவுளோடு தொடர்புடைய அர்ப்பணிக்கப்பட்ட நிலையை ל முன்னிடைச்சொல்லுக்கு நெருக்கமாகத் தெரிவிக்கிறது.
- source_word: יְחַלְּלוּ
  choice: பரிசுத்தக்கேடு உண்டாக்கு
  rationale: חלל என்பதன் வழிபாட்டுச் சூழலிலான ‘புனிதமானதைப் புனிதமற்றதாக்குதல்’ என்ற கருத்தைத் தக்கவைத்து, பரிசுத்தம்–பொதுமை என்ற எதிர்மறையைப் பாதுகாக்கிறது.
- source_word: שֵׁם אֱלֹהֵיהֶם
  choice: தங்கள் கடவுளின் பெயர்
  rationale: எபிரெயக் கட்டமைப்பைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: אִשֵּׁי יְהוָה
  choice: யாவேயின் நெருப்புப் பலிகள்
  rationale: אִשֶּׁה என்ற தொழில்நுட்ப வழிபாட்டுச் சொல்லின் நெருப்போடு தொடர்புடைய பலியிடுதலை மறைக்காமல் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் நேரடியாக வரும் தேவப்பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: לֶחֶם אֱלֹהֵיהֶם
  choice: தங்கள் கடவுளின் உணவு
  rationale: לֶחֶם என்பதன் அடிப்படைப் பொருள் ‘அப்பம்’ என்றாலும், பலிச் சூழலில் அது உணவை விரிவாகக் குறிக்கலாம்; பிரதான உரையில் ‘உணவு’ சூழலுக்கேற்றது, நேரடியான வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: מַקְרִיבִם
  choice: செலுத்துகிறார்கள்
  rationale: קרב என்பதன் Hiphil வடிவம் குறிக்கும் ‘அருகில் கொண்டுவருதல்/பலியாகச் சமர்ப்பித்தல்’ என்பதை வழிபாட்டுச் சூழலில் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וְהָיוּ קֹדֶשׁ
  choice: எனவே, அவர்கள் பரிசுத்தமானவர்களாக இருக்க வேண்டும்
  rationale: இறுதி வாக்கியத்தின் இணைப்பை முந்தைய காரணத்திலிருந்து வரும் முடிவாக இயல்பாக வெளிப்படுத்துகிறது; பரிசுத்தக் கோரிக்கையின் மறுபடியுரைத்தலைக் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தேவப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரையில் தனிப்பட்ட உடன்படிக்கைப் பெயர் இருப்பதால், அதை ஒரு பொதுப் பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்துக்கு நெருக்கமானது.
- issue: אִשֵּׁי יְהוָה לֶחֶם אֱלֹהֵיהֶם என்ற பலி சார்ந்த சொற்றொடர்
  choice: யாவேயின் நெருப்புப் பலிகளை—தங்கள் கடவுளின் உணவை—
  alternative: யாவேயின் உணவுப் பலிகளை, தங்கள் கடவுளின் உணவை
  rationale: ‘நெருப்புப் பலிகள்’ என்ற தொழில்நுட்பப் பொருளையும், அதைத் தொடர்ந்து வரும் ‘கடவுளின் உணவு’ என்ற இறையியல் பதற்றமுள்ள உருவகத்தையும் ஒன்றை மற்றொன்றில் கரைத்துவிடாமல் காக்கிறது.
- issue: வசனத்தின் இறுதி וְ இணைப்பின் உறவு
  choice: எனவே
  alternative: மேலும் / மற்றும்
  rationale: முந்தைய כִּי காரணவாக்கியத்தோடு இயல்பான தர்க்கத் தொடர்பைக் காட்டுகிறது; இருப்பினும் எபிரெய וְ வெறும் இணைப்பாகவும் வாசிக்கப்படலாம்.
translation_notes:
  register: நவீன பொதுத்தரத் தமிழ்; வழிபாட்டு மற்றும் பரிசுத்தம் சார்ந்த சொல்லாட்சியில் கண்ணியமான வேதாகம நடையைப் பேணுகிறது. புரியாத பழமொழிநடையைத் தவிர்த்து, ‘பரிசுத்தம்’, ‘நெருப்புப் பலிகள்’, ‘செலுத்துதல்’ போன்ற நிலைபெற்ற சொற்களைப் பயன்படுத்துகிறது. அடிக்குறிப்பு குறியீடு தொடர்புடைய பலிச் சொற்றொடருக்குப் பின் வைக்கப்பட்டுள்ளது.
