source:
  edition: WLC
  text: וְ/עַ֛ל כָּל נַפְשֹׁ֥ת מֵ֖ת לֹ֣א יָבֹ֑א לְ/אָבִ֥י/ו וּ/לְ/אִמּ֖/וֹ לֹ֥א יִטַּמָּֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/011.yaml
  text: He shall not go near any dead body[a]; he shall not make himself unclean even for his father or for his mother.
translation:
  language: ta
  text: எந்த இறந்த உடலருகிலும் அவர் செல்லக்கூடாது[a]; தன் தந்தைக்காகவோ தாய்க்காகவோ கூட அவர் தன்னைத் தீட்டுப்படுத்திக்கொள்ளக்கூடாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘எந்தப் பிணத்தருகிலும்.’ சொல்லுக்குச் சொல், ‘இறந்தவர்களின் உயிர்கள்/நபர்கள்’; தூய்மைச் சட்டங்களில் இது இறந்த மனித உடலைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל ... לֹא יָבֹא
  choice: உடலருகிலும் அவர் செல்லக்கூடாது
  rationale: בוא + עַל என்பது இங்குள்ள ஆசாரத் தூய்மைச் சட்டச் சூழலில் வெறுமனே ‘வருதல்’ என்பதல்ல; இறந்த உடலை அணுகுவதைக் குறிக்கிறது. ‘உடலருகிலும் செல்லக்கூடாது’ என்பது அந்தத் தடையை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: כָּל
  choice: எவருடைய ... -லும்
  rationale: எதிர்மறை வாக்கியத்தில் כָּל கூறும் முழுமையான தடையைத் தமிழில் ‘எவருடைய ... -லும்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: נַפְשֹׁת מֵת
  choice: இறந்த எவருடைய உடல்
  rationale: சொல்லளவில் ‘இறந்தவரின் நபர்/உயிர்’ போன்ற வடிவமுடைய இச்சொற்றொடர், லேவியராகமத்தின் தீட்டுச் சட்டங்களில் மனிதரின் இறந்த உடலைக் குறிக்கும் மரபுத்தொடர். ‘உடல்’ என்பது ‘ஆத்துமா’ என்ற தவறான பொருள் ஏற்படாமல் தெளிவாக உள்ளது.
- source_word: לְאָבִיו וּלְאִמּוֹ
  choice: தன் தந்தைக்காகவோ தாய்க்காகவோகூட
  rationale: לְ இங்கு அவருடைய பெற்றோரின் மரணத்தை முன்னிட்டு அல்லது அவர்களுக்காக என்பதைக் குறிக்கிறது. பொதுத் தடைக்குப் பின் மிக நெருங்கிய உறவினர்களும் விதிவிலக்கல்ல என்ற வலியுறுத்தலை ‘கூட’ வெளிப்படுத்துகிறது.
- source_word: לֹא יִטַּמָּא
  choice: தன்னைத் தீட்டுப்படுத்திக்கொள்ளக்கூடாது
  rationale: טמא என்பதன் Hitpael வடிவம் தன்னிலைப் பொருளுடையது. ‘தன்னைத் தீட்டுப்படுத்திக்கொள்ளுதல்’ என்பது அறநெறிக் குற்றமாக மாற்றாமல் ஆசாரத் தீட்டைக் குறிக்கும் வேதாகமச் சொல்லாட்சியைப் பாதுகாக்கிறது.
theological_decisions:
- issue: ஆசாரத் தீட்டைக் குறிக்கும் சொல்
  choice: தன்னைத் தீட்டுப்படுத்திக்கொள்ளக்கூடாது
  alternative: அசுத்தமாகிக்கொள்ளக்கூடாது
  rationale: இவ்வசனம் இறந்த உடலால் ஆசார ரீதியில் ஏற்படும் தீட்டைப் பற்றியது. ‘தீட்டு’ என்பது இங்கு பாவம் அல்லது ஒழுக்கக்கேடு என்று பொருளைச் சுருக்காமல் லேவியராகமத்தின் தூய்மை வகைப்பாட்டைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், சட்டரீதியான தடையை ‘செல்லக்கூடாது’ என்றும் தன்னிலைச் செயலை ‘தன்னைத் தீட்டுப்படுத்திக்கொள்ளக்கூடாது’ என்றும் தெளிவாக வழங்குகிறது. மரியாதைமிக்க ஒருமைச் சுட்டாக ‘அவர்’ பயன்படுத்தப்பட்டுள்ளது.
