  text: וַ/יְדַבֵּ֣ר מֹשֶׁ֔ה אֶֽל אַהֲרֹ֖ן וְ/אֶל בָּנָ֑י/ו וְ/אֶֽל כָּל בְּנֵ֖י יִשְׂרָאֵֽל־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/024.yaml
  text: So Moses spoke to Aaron and to his sons and to all the sons of Israel[a].
translation:
  language: ta
  text: மோசே ஆரோனிடமும், அவருடைய மகன்களிடமும், இஸ்ரவேல் மக்கள் அனைவரிடமும் பேசினார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: அவ்வாறே ... பேசினார்
  rationale: வாவ் தொடர்வினை இங்கு முந்தைய கட்டளைகளைத் தொடர்ந்து பகுதியை முடிவுக்குக் கொண்டுவருகிறது. ‘அவ்வாறே’ என்பது மோசே அவற்றை அறிவித்தார் என்ற நிறைவு சார்ந்த தொடர்பை இயல்பான தமிழில் காட்டுகிறது.
- source_word: אֶל
  choice: -இடமும்
  rationale: பேச்சு யாரை நோக்கிச் சொல்லப்பட்டது என்பதைத் தமிழில் இயல்பாகக் குறிக்கிறது; மூன்று முகவரிக் குழுக்களையும் ‘-இடமும்’ என்ற இணை அமைப்பால் தொடர்கிறது.
- source_word: בָּנָיו
  choice: அவனுடைய மகன்கள்
  rationale: எபிரெயச் சொல் ஆண்பால் பன்மையிலும் மூன்றாம் நபர் ஆண்பால் ஒருமை உடைமை விகுதியுடனும் இருந்து, ஆரோனுடைய மகன்களைக் குறிப்பாகச் சுட்டுகிறது.
- source_word: כָּל
  choice: அனைவரும்
  rationale: பின்வரும் மக்கள் குழுவின் முழுமையையும் குறிக்கும் כָּל என்பதன் நேரடியான பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: சொல்லுக்குச் சொல் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இது இஸ்ரவேல் மக்களனைவரையும் குறிக்கும் வழக்கமான உடன்படிக்கைப் பெயர். ‘இஸ்ரவேல் மக்கள்’ என்பது அதன் கூட்டுப்பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: உடன்படிக்கை மக்களைக் குறிக்கும் בְּנֵי יִשְׂרָאֵל என்பதன் மொழிபெயர்ப்பு
  choice: இஸ்ரவேல் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள் / இஸ்ரவேலர்
  rationale: இந்தச் சொற்றொடர் வடிவத்தில் ஆண்பால் பன்மையாக இருந்தாலும், வழக்கில் முழு இஸ்ரவேல் சமூகத்தையும் குறிக்கிறது. தமிழில் ‘இஸ்ரவேலின் மகன்கள்’ என்பது உயிரியல் ஆண் சந்ததியினரையே குறிக்கும் தவறான எண்ணத்தை உண்டாக்கக்கூடும்; எனவே எந்தப் பிரிவுசார் விளக்கத்தையும் புகுத்தாமல் அதன் கூட்டான உடன்படிக்கைப் பொருள் மொழிபெயர்க்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையான வேதாகம நடையையும் பொதுவாசகருக்கான தெளிவையும் இணைக்கும் மொழிநடை. எபிரெயத்தின் மும்மடங்கு אֶל அமைப்பு ‘ஆரோனிடமும் ... மகன்களிடமும் ... மக்கள் அனைவரிடமும்’ எனப் பாதுகாக்கப்பட்டுள்ளது.
