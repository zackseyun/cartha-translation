source:
  edition: WLC
  text: לֹ֥א יִטַּמָּ֖א בַּ֣עַל בְּ/עַמָּ֑י/ו לְ/הֵ֖חַלּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/004.yaml
  text: He shall not defile himself as a husband among his people[a], and so profane himself.
translation:
  language: ta
  text: தன் மக்களிடையே கணவனான அவன், தன்னைப் பரிசுத்தக்கேடாக்கிக் கொள்ளத் தன்னைத் தீட்டுப்படுத்தக் கூடாது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தன் மக்களிடையே தலைவனான அவன், தன்னைப் பரிசுத்தக்கேடாக்கிக் கொள்ளத் தன்னைத் தீட்டுப்படுத்தக் கூடாது.” எபிரெயத் தொடர் பொருள் காணக் கடினமானது. இதைச் சிலர், ‘கணவன்’ என்ற குறிப்பிட்ட பொருளில் அல்லாமல், சமூகத்தில் முதன்மையான நிலையில் உள்ளவன் தன்னைத் தீட்டுப்படுத்தக் கூடாது என்ற பொதுவான தடையாகப் புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
lexical_decisions:
- source_word: יִטַּמָּא
  choice: தன்னைத் தீட்டுப்படுத்தி
  rationale: טמא என்பதன் ஹித்பயேல் வடிவம் இங்கு இறந்தவருடன் தொடர்புகொள்வதால் ஏற்படும் சடங்குத் தீட்டைக் குறிக்கிறது. ‘தன்னைத் தீட்டுப்படுத்துதல்’ என்பது ஆசாரியப் பரிசுத்தச் சூழலைத் தெளிவாகக் காக்கிறது.
- source_word: בַּעַל
  choice: கணவனாக
  rationale: சிக்கலான இத்தொடரில் בַּעַל என்பதன் பொதுவான உறவுமுறைப் பொருளான ‘கணவன்’ எடுத்துக்கொள்ளப்படுகிறது; நெருங்கிய உறவினருக்காக இறந்தவர் தீட்டைப் பெறுவது பற்றிய உடனடிச் சூழலுடன் இது பொருந்துகிறது.
- source_word: בְּעַמָּיו
  choice: தன் மக்களிடையே
  rationale: எபிரெயச் சொல்லின் நேரடிப் பொருளான ‘தன் மக்களிடையே’ காக்கப்படுகிறது; சூழலில் இது அவனுடைய மக்கள் அல்லது உறவினர் வட்டத்தைக் குறிக்கலாம்.
- source_word: לְהֵחַלּוֹ
  choice: தன்னைப் பரிசுத்தக்கேடாக்க
  rationale: חלל சார்ந்த இச்சொல் ஆசாரியனுக்குரிய பரிசுத்த நிலையைச் சாதாரணமாக்குதல் அல்லது கெடுத்தல் என்ற எண்ணத்தை வெளிப்படுத்துகிறது. ‘பரிசுத்தக்கேடாக்க’ என்பது பரிசுத்தம்–பரிசுத்தக்கேடு என்ற வேறுபாட்டைக் காக்கிறது.
theological_decisions:
- issue: בַּעַל בְּעַמָּיו என்ற சிக்கலான தொடரின் விளக்கம்
  choice: தன் மக்களிடையே ஒரு கணவனாக ஆசாரியன் தன்னைத் தீட்டுப்படுத்தக் கூடாது
  alternative: தன் மக்களிடையே ஒரு தலைவனாகத் தன்னைத் தீட்டுப்படுத்தக் கூடாது; அல்லது தன் மக்களிடையே தன்னைத் தீட்டுப்படுத்தி பரிசுத்தக்கேடாக்கக் கூடாது
  rationale: எபிரெயத் தொடர் இலக்கண ரீதியில் சுருக்கமாகவும் பொருள் தெளிவில்லாததாகவும் உள்ளது. בַּעַל என்பதன் வழக்கமான ‘கணவன்’ என்ற பொருள் சுற்றியுள்ள உறவுமுறை சார்ந்த மரணத் தீட்டு விதிகளுடன் பொருந்துவதால் முதன்மை வாசிப்பாக எடுக்கப்படுகிறது; உண்மையான மாற்று விளக்கங்கள் அடிக்குறிப்பில் காக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ஆசாரியச் சட்டச் சூழலுக்குரிய ‘தீட்டு’ மற்றும் ‘பரிசுத்தக்கேடு’ என்ற சொற்கள் காக்கப்பட்டுள்ளன; எபிரெய மூலத்தின் உண்மையான தெளிவின்மை அடிக்குறிப்பில் வெளிப்படையாகப் பதிவு செய்யப்பட்டுள்ளது.
