id: LEV.21.22
reference: Leviticus 21:22
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: לֶ֣חֶם אֱלֹהָ֔י/ו מִ/קָּדְשֵׁ֖י הַ/קֳּדָשִׁ֑ים וּ/מִן הַ/קֳּדָשִׁ֖ים יֹאכֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/022.yaml
  text: He may eat the food of his God[a], from the most holy things and from the holy things.
translation:
  language: ta
  text: அவன் தன் இறைவனுக்குரிய உணவை[a], மகா பரிசுத்தமானவற்றிலிருந்தும் பரிசுத்தமானவற்றிலிருந்தும் உண்ணலாம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தன் இறைவனுக்குரிய அப்பத்தை.” இங்கே “அப்பம்” என்பது ஆசாரியருக்குரிய உணவுப் பங்குகளைப் பொதுவாகக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם
  choice: உணவு
  rationale: இச்சொல்லின் நேரடிப் பொருள் ‘அப்பம்’ என்றாலும், பலி மற்றும் ஆசாரியச் சட்டச் சூழலில் ஆசாரியருக்குரிய உணவுப் பங்குகளை விரிவாகக் குறிக்கிறது. இருவகைப் பரிசுத்தப் பங்குகளும் இங்கு அடங்குவதால் ‘உணவு’ இயல்பாகப் பொருளைத் தருகிறது; ‘அப்பம்’ என்ற மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: אֱלֹהָיו
  choice: தன் இறைவனுக்குரிய
  rationale: எபிரேய உரையிலுள்ள மூன்றாம் நபர் ஆண்பால் ஒருமை உடைமைப் பின்னொட்டு ஆசாரியனைச் சுட்டுகிறது. தமிழில் எழுவாயோடு தெளிவாக இணைக்க ‘தன்’ பயன்படுத்தப்பட்டு, இந்த உணவு இறைவனுக்குரிய பலிப்பங்குகள் என்பதைக் காட்ட ‘இறைவனுக்குரிய’ என மொழிபெயர்க்கப்பட்டது.
- source_word: מִקָּדְשֵׁי הַקֳּדָשִׁים
  choice: மகா பரிசுத்தமானவற்றிலிருந்து
  rationale: இந்த இணைப்புச் சொற்றொடர் மிக உயர்ந்த பரிசுத்த வகையைச் சுட்டும் எபிரேய உச்சநிலைக் கட்டமைப்பு. ‘மகா பரிசுத்தமானவை’ அதன் சடங்கியல் வகைப்பாட்டைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: וּמִן הַקֳּדָשִׁים
  choice: பரிசுத்தமானவற்றிலிருந்து
  rationale: முந்தைய மிக உயர்ந்த பரிசுத்த வகையிலிருந்து வேறுபட்ட மற்றொரு பரிசுத்தப் பொருட்களின் வகையை இது குறிக்கிறது. ஒரே קדש வேர் சார்ந்த சொல் தொடர்பைப் பாதுகாக்க ‘பரிசுத்தமானவை’ பயன்படுத்தப்பட்டது.
- source_word: יֹאכֵל
  choice: உண்ணலாம்
  rationale: இந்தச் சட்டச் சூழலில் வினை வடிவம் எதிர்காலத்தை அல்லது கட்டாயத்தைவிட அனுமதியை வெளிப்படுத்துகிறது. குறைபாடுள்ள ஆசாரியன் பலிபீடத்தை அணுகக்கூடாதபோதும் பரிசுத்தப் பங்குகளை உண்ண அனுமதிக்கப்படுகிறான் என்ற வேறுபாட்டை ‘உண்ணலாம்’ தெளிவாக்குகிறது.
theological_decisions:
- issue: ஆசாரியச் சட்டத்தில் יֹאכֵל என்பதன் சட்ட வலிமை
  choice: அனுமதி — ‘உண்ணலாம்’
  alternative: ‘உண்பான்’ என்ற எளிய எதிர்காலம் அல்லது ‘உண்ண வேண்டும்’ என்ற கட்டாயம்
  rationale: சுற்றியுள்ள வசனங்கள், அவன் செய்யக்கூடாத செயல்களையும் அவனுக்கு தொடர்ந்து அனுமதிக்கப்பட்டுள்ள உணவு உரிமையையும் வேறுபடுத்துகின்றன. ஆகவே அனுமதிப் பொருள் சூழலுக்கு ஏற்றது; அது கட்டாயத்தைத் தேவையின்றி சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்ட உரைக்கு ஏற்ற கண்ணியமான மற்றும் எளிதில் புரியும் நடை. ‘மகா பரிசுத்தமானவை’ மற்றும் ‘பரிசுத்தமானவை’ என்ற இணைச் சொற்கள் மூலத்தின் சடங்கியல் வகை வேறுபாட்டையும் ஒரே சொல்ல்வேர் தொடர்பையும் காக்கின்றன. அடிக்குறிப்பு குறியீடு [a] முதன்மை உரையில் இடம்பெற்றுள்ளது.
