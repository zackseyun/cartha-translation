revisions:
- from: அல்லது கால் எலும்பு முறிந்தவனோ கை எலும்பு முறிந்தவனோ,[a]
  to: அல்லது பாதத்திலோ கையிலோ முறிவு உள்ள ஒரு மனிதன்,[a]
  rationale: The revision retains the list-continuing ‘அல்லது,’ the masculine-singular ‘ஒரு மனிதன்,’ and the Hebrew alternatives. It renders שֶׁבֶר as ‘முறிவு’ without supplying ‘bone,’ uses ‘பாதம்’ for the default sense of רָגֶל, and preserves the more literal possessive construction in the footnote.
