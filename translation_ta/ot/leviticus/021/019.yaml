  text: or a man who has a broken foot or a broken hand,[a]
translation:
  language: ta
  text: அல்லது பாதத்திலோ கையிலோ முறிவு உள்ள ஒரு மனிதன்,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்சொல்லாக, “தன்னில் பாதத்தின் முறிவோ கையின் முறிவோ உள்ள ஒரு மனிதன்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹ
  choice: அல்லது
  rationale: தகுதியிழக்கச் செய்யும் உடற்குறைபாடுகளின் பட்டியலைத் தொடரும் எளிய பிரிநிலை இணைப்புச்சொல்.
- source_word: אִישׁ אֲשֶׁר יִהְיֶה בוֹ
  choice: … முறிந்தவனோ
  rationale: எபிரெய மொழியின் சொற்சொல் அமைப்பு ‘எவனுக்குள் … இருக்கிறதோ’ என்பதாக இருந்தாலும், இந்த உடல் நிலையைக் கூற நவீனத் தமிழில் ‘முறிந்தவன்’ என்பது இயல்பாகவும் சுருக்கமாகவும் உள்ளது; ஆண்பால் ஒருமையும் காக்கப்படுகிறது.
- source_word: שֶׁבֶר
  choice: எலும்பு முறிந்த
  rationale: இப்பெயர்ச்சொல் முறிவு அல்லது எலும்பு உடைதலைக் குறிக்கிறது. தமிழில் ‘கால் முறிந்த’ என்பது உறுப்பே துண்டிக்கப்பட்டதுபோலவும் புரியக்கூடும் என்பதால் ‘எலும்பு’ சேர்க்கப்பட்டது.
- source_word: רָגֶל
  choice: கால்
  rationale: இச்சொல்லின் அடிப்படைப் பொருள் பாதம் என்றாலும் கால் என்ற விரிந்த பொருளும் உண்டு; ‘கால் எலும்பு முறிந்த’ என்பது நவீனத் தமிழில் இயல்பானதும் மூலத்தின் சாத்தியமான பொருள் விரிவை முற்றிலும் குறுக்காததுமாகும்.
- source_word: יָד
  choice: கை
  rationale: மூலச்சொல்லின் நேரடிப் பொருளான ‘கை’ பயன்படுத்தப்பட்டது; சூழல் கட்டாயப்படுத்தாததால் ‘முழங்கை/கை முழுவதும்’ என விரிவாக்கப்படவில்லை.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், ஆசாரியச் சட்டப் பட்டியலுக்கு ஏற்ற சுருக்கமான, கண்ணியமான நடை. ‘எலும்பு’ என்பது தமிழில் தவறான புரிதலைத் தவிர்க்கும் இயல்பான விளக்கச் சேர்க்கை. வசனம் முந்தைய பட்டியலின் தொடர்ச்சி என்பதால் தொடக்கத்தில் ‘அல்லது’ வைக்கப்பட்டுள்ளது.
