base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/023.yaml
  text: However[a], he shall not go in to the veil or come near the altar, because there is a defect in him, so that he may not profane my sanctuaries[c][b]; for I am Yahweh who sanctifies them.
translation:
  language: ta
  text: ஆனால், அவன் திரைச்சீலைக்குச் செல்லவோ, பலிபீடத்தை நெருங்கவோ கூடாது; ஏனெனில் அவனுக்கு உடற்குறை உள்ளது.[a] அவன் என் பரிசுத்த இடங்களின்[b] புனிதத்தைக் கெடுக்கக் கூடாது; ஏனெனில் அவற்றைப் பரிசுத்தப்படுத்துகிற யாவே நானே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘உடற்குறை’ என்பது இங்கு இந்த ஆசாரியப் பணிக்கான உடல்சார்ந்த தகுதித் தடையைக் குறிக்கிறது; ஒழுக்கக் குற்றத்தைக் குறிக்கவில்லை. வேறு மொழிபெயர்ப்பு: ‘அவனிடம் ஒரு குறை உள்ளது.’'
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் ‘என் பரிசுத்த இடங்கள்’ என்பது பன்மையில் உள்ளது; சில மொழிபெயர்ப்புகள் இதை ‘என் பரிசுத்த இடம்’ என்று ஒருமையில் வழங்குகின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: ஆனால்
  rationale: முந்தைய வசனத்தில் வழங்கப்பட்ட அனுமதிக்கு இங்கு ஒரு கட்டுப்பாடு விதிக்கப்படுவதால், எதிர்மறைத் திருப்பத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הַפָּרֹכֶת
  choice: திரைச்சீலை
  rationale: பரிசுத்த இடத்தைப் பிரித்த ஆலயத் திரையைக் குறிக்கிறது; நவீன தமிழில் தெளிவாகவும் வழிபாட்டுச் சூழலுக்கு ஏற்றவாறும் உள்ளது.
- source_word: יָבֹא אֶל־הַפָּרֹכֶת
  choice: திரைச்சீலை இருக்கும் இடத்திற்குச் செல்ல
  rationale: எபிரெயச் சொற்றொடரில் உள்ள ‘திரையிடம் வருதல்’ என்ற அணுகல் கருத்தை இயல்பான தமிழில் தருகிறது; ‘திரைக்குள்’ என்று மொழிபெயர்த்து மூலத்தில் வெளிப்படையாக இல்லாத ‘அப்பால்’ என்ற கருத்தைச் சேர்க்கவில்லை.
- source_word: הַמִּזְבֵּחַ
  choice: பலிபீடம்
  rationale: ஆசாரிய வழிபாட்டுச் சூழலில் altar என்பதற்கான தெளிவான, நிலைபெற்ற தமிழ் சொல்.
- source_word: יִגַּשׁ
  choice: நெருங்க
  rationale: வழிபாட்டுப் பணிக்காக பலிபீடத்தை அணுகுவதைக் குறிக்கும் எபிரெய வினையின் கருத்தை இயல்பாகத் தருகிறது.
- source_word: מוּם בּוֹ
  choice: அவனுக்கு உடற்குறை உள்ளது
  rationale: இது ஒழுக்கக் குற்றத்தையோ மனித மதிப்பின் குறைவையோ அல்ல, இந்த ஆசாரியப் பணிக்கான உடல்சார்ந்த தகுதித் தடையைக் குறிக்கிறது.
- source_word: יְחַלֵּל אֶת־מִקְדָּשַׁי
  choice: என் பரிசுத்த இடங்களின் புனிதத்தைக் கெடுக்க
  rationale: חלל என்ற வினையின் ‘பரிசுத்தமானதைப் புனிதமற்றதாக்குதல்’ என்ற கருத்தை வாசிக்க இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מִקְדָּשַׁי
  choice: என் பரிசுத்த இடங்கள்
  rationale: எபிரெய மூலத்தின் பன்மை வடிவத்தைத் தக்கவைக்கிறது; ஒருமையான ‘என் பரிசுத்த இடம்’ என்று சீராக்கவில்லை.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், எபிரெய நான்கெழுத்துப் பெயரின் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: מְקַדְּשָׁם
  choice: அவற்றைப் பரிசுத்தப்படுத்துகிற
  rationale: ஆண்பால் பன்மை பின்னொட்டை, அதற்கு மிக அருகிலுள்ள பன்மைப் பெயரான ‘என் பரிசுத்த இடங்கள்’ என்பதோடு இணைக்கிறது.
theological_decisions:
- issue: מוּם என்ற சொல்லின் பொருள்
  choice: ஆசாரிய அணுகலைத் தடுக்கும் உடற்குறை
  alternative: கறை அல்லது பொதுவான குறை
  rationale: இந்தச் சட்டச் சூழலில் அது ஒழுக்கத் தவறைக் குறிக்கவில்லை. ‘உடற்குறை’ என்பது சடங்குசார் பணித் தடையைத் தெளிவாக்குகிறது; மனிதரின் மதிப்பு குறைவானது என்ற கருத்தைச் சேர்க்கவில்லை.
- issue: מְקַדְּשָׁם என்பதிலுள்ள பன்மைச் சுட்டுப்பெயரின் முன்னிலை
  choice: ‘அவற்றை’ என்பது ‘என் பரிசுத்த இடங்களை’ குறிக்கிறது
  alternative: அது ஆசாரியர்களையோ மக்களையோ விரிவாகக் குறிக்கலாம்
  rationale: இலக்கண ரீதியாக மிக அருகிலுள்ள பன்மை முன்னிலை מִקְדָּשַׁי ஆகும்; பரிசுத்த இடங்களை அணுகுவது பற்றிய உடனடிச் சூழலும் இதற்கு ஆதரவளிக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் ஆசாரியச் சட்டத்தின் கண்ணியமான தொனியைத் தக்கவைத்தும் மொழிபெயர்க்கப்பட்டது. ‘உடற்குறை’ பற்றிய சொல் விளக்கக் குறிப்பால் அதன் சட்ட மற்றும் சடங்குசார் வரம்பு தெளிவாக்கப்பட்டது. மூலத்தின் பன்மை வடிவமும் தெய்வீகப் பெயரும் பாதுகாக்கப்பட்டன.
