base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/001.yaml
  text: 'And Yahweh said to Moses[a], “Speak to the priests, the sons of Aaron[b], and say to them: None shall make himself unclean for a dead person among his people,”'
translation:
  language: ta
  text: 'யாவே மோசேயிடம், “ஆரோனின் மகன்களான ஆசாரியர்களிடம் பேசி, அவர்களிடம் சொல்: ‘தன் மக்களிடையே இறந்த எவருக்காகவும்[a] எந்த ஆசாரியனும் தன்னைத் தீட்டுப்படுத்திக்கொள்ளக் கூடாது[b]’” என்றார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லர்த்தமாக, “ஒரு நெஃபெஷுக்காக.” இந்தத் தூய்மைச் சட்டச் சூழலில் அது இறந்த நபரையோ பிணத்தையோ குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “தீட்டுப்படக் கூடாது” அல்லது “தன்னை அசுத்தப்படுத்திக்கொள்ளக் கூடாது.” இது இறந்தவருடன் தொடர்பால் ஏற்படும் சடங்குத் தீட்டைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தேவனுடைய தனிப்பட்ட பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட பெயர்வடிவில் தருகிறது.
- source_word: אֱמֹר ... וְאָמַרְתָּ
  choice: பேசி ... சொல்
  rationale: மூலத்தில் אמר வினை இருமுறை வருவதை இயல்பான தமிழில் வேறுபடுத்திக் காட்டி, மறுபடியும் சொல்லும் அமைப்பையும் காக்கிறது.
- source_word: הַכֹּהֲנִים בְּנֵי אַהֲרֹן
  choice: ஆரோனின் மகன்களான ஆசாரியர்கள்
  rationale: ஆசாரியர்கள் யார் என்பதை விளக்கும் இணைப்புச் சொற்றொடராக உள்ள எபிரெய அமைப்பைத் தெளிவான தமிழில் தருகிறது; ‘மகன்கள்’ என்பது குடும்ப/உடன்படிக்கை அடையாளத்தைப் பாதுகாக்கிறது.
- source_word: לְנֶפֶשׁ
  choice: இறந்த ஒருவருக்காக
  rationale: சடங்குத் தூய்மைச் சட்டச் சூழலில் נֶפֶשׁ இறந்த நபர் அல்லது பிணத்தைக் குறிக்கும் மரபுத்தொடர்; ‘ஆத்துமா’ என்ற தவறான புரிதலைத் தவிர்க்கிறது.
- source_word: יִטַּמָּא
  choice: தன்னைத் தீட்டுப்படுத்திக்கொள்ளக் கூடாது
  rationale: இறந்தவருடன் தொடர்பால் ஏற்படும் சடங்குத் தீட்டையும் வினையின் தற்சார்பு நுணுக்கத்தையும் வெளிப்படுத்துகிறது; இது நேரடியாக ஒழுக்கக் குற்றத்தைக் குறிப்பதாக மாற்றப்படவில்லை.
- source_word: בְּעַמָּיו
  choice: தன் மக்களிடையே
  rationale: சொல்லுக்குச் சொல் பொருளான ‘தன் மக்களிடையே’ என்பதைக் காக்கிறது; அடுத்த வசனங்கள் நெருங்கிய உறவினருக்கான விதிவிலக்குகளை விளக்குகின்றன.
theological_decisions:
- issue: ஆசாரியச் சட்டத்தில் தீட்டின் இயல்பு
  choice: ‘தன்னைத் தீட்டுப்படுத்திக்கொள்ளக் கூடாது’ என்று சடங்குத் தூய்மையைக் குறிக்கும் மொழியில் மொழிபெயர்க்கப்பட்டது.
  alternative: ‘தன்னை அசுத்தமாக்கிக்கொள்ளக் கூடாது’ அல்லது ஒழுக்கக் களங்கத்தைக் குறிக்கும் சொல்
  rationale: இங்கு இறந்தவரால் ஏற்படும் சடங்குத் தீட்டே கருத்து; இதை ஒழுக்கத் தீமை பற்றிய நேரடி கூற்றாக மொழிபெயர்ப்பது பொருத்தமல்ல.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. ‘ஆசாரியர்’, ‘தீட்டு’ ஆகியவை லேவியராகமச் சடங்குச் சூழலைத் தெளிவாகக் காட்டும் பழக்கமான சொற்கள். எபிரெயப் பன்மை முகவரியை ‘அவர்களில் எவரும்’ எனத் துல்லியமாக வெளிப்படுத்துகிறது.
