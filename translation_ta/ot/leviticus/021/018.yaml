source:
  edition: WLC
  text: כִּ֥י כָל אִ֛ישׁ אֲשֶׁר בּ֥/וֹ מ֖וּם לֹ֣א יִקְרָ֑ב אִ֤ישׁ עִוֵּר֙ א֣וֹ פִסֵּ֔חַ א֥וֹ חָרֻ֖ם א֥וֹ שָׂרֽוּעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/018.yaml
  text: 'For no man who has a defect shall come near: a blind man[a], or a lame man, or one with a disfigured face[d][c][b], or one with a limb too long.'
translation:
  language: ta
  text: ஏனெனில், உடல் குறைபாடு உள்ள எந்த ஆணும் நெருங்கி வரக்கூடாது:[a] பார்வையற்றவரோ, நொண்டியானவரோ, முகம் உருக்குலைந்தவரோ,[b] அளவுக்கு மீறி நீண்ட உடலுறுப்பு உள்ளவரோ[c] இருக்கக்கூடாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு “நெருங்கி வருதல்” என்பது ஆசாரியப் பணியைச் செய்வதற்காக அணுகுவதைக் குறிக்கிறது.
    reason: cultural_note
  - marker: b
    text: “முகம் உருக்குலைந்த” என மொழிபெயர்க்கப்பட்ட எபிரெயச் சொல் அரிதானது; அது இன்னும் குறிப்பாகச் சேதமடைந்த அல்லது வடிவக்குறைவான மூக்கைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “நீண்டுபோன அல்லது வடிவக்குறைவான உடலுறுப்பு உள்ளவர்.” எபிரெயச் சொல் விகிதமற்ற ஓர் உடல் உறுப்பைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய தடைக்கான காரணத்தை அல்லது விளக்கத்தை அறிமுகப்படுத்துகிறது.
- source_word: כָל אִישׁ אֲשֶׁר בּוֹ מוּם
  choice: உடற்குறை உள்ள எந்த ஆணும்
  rationale: தொடரும் மறுப்புடன் சேர்ந்து ‘எந்த ஆணும் ... கூடாது’ என்ற பொருள் தருகிறது; சூழல் ஆரோனிய ஆண் ஆசாரியர்களைக் குறிக்கிறது. מוּם இங்கு ஆசாரியப் பணிக்காக நெருங்குவதைத் தகுதியற்றதாக்கும் உடல் குறையைக் குறிக்கிறது.
- source_word: לֹא יִקְרָב
  choice: நெருங்கி வரக்கூடாது
  rationale: ஆசாரியச் சூழலில் பலி செலுத்தும் பணிக்காக அணுகுவதைக் குறிக்கிறது; அந்தச் சூழலை அடிக்குறிப்பு தெளிவாக்குகிறது.
- source_word: אִישׁ עִוֵּר
  choice: பார்வையற்ற ஆண்
  rationale: நவீனத் தமிழில் இயல்பான, மரியாதையான விளக்கச் சொற்றொடர்.
- source_word: פִסֵּחַ
  choice: நடக்க இயலாத ஆண்
  rationale: நடப்பதில் உடல்சார் இயலாமையைக் குறிக்கும் எபிரெயச் சொல்லை இழிவுபடுத்தாத நவீன மொழியில் தருகிறது.
- source_word: חָרֻם
  choice: முகம் உருக்குலைந்த ஒருவன்
  rationale: அரிதான இச்சொல் முகத்தை, குறிப்பாக மூக்கைச் சார்ந்த சேதம் அல்லது வடிவக்குறைவைச் சுட்டலாம்; உறுதியற்ற துல்லியத்தைத் தவிர்க்கும் பரந்த மொழிபெயர்ப்பு.
- source_word: שָׂרוּעַ
  choice: அளவுக்கு மீறி நீண்ட உடலுறுப்பு உள்ள ஒருவன்
  rationale: நீண்ட, மிகையாக வளர்ந்த, அல்லது விகிதமற்ற உடலுறுப்பைக் குறிக்கும் சாத்தியமான பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: ஆசாரியச் சட்டத்திலுள்ள தடையின் இயல்பு
  choice: இதை ஆசாரியப் பணிக்காக நெருங்குவதற்குரிய சடங்குசார் தகுதி விதியாக மொழிபெயர்த்தல்
  alternative: பொதுவான சமூக விலக்காக அல்லது ஒருவரின் ஒழுக்க/மனித மதிப்பைப் பற்றிய தீர்ப்பாகப் புரிந்துகொள்ளுதல்
  rationale: எபிரெய உரை உடற்குறைகளை ஆசாரியப் பணிக்காக ‘நெருங்கி வருதல்’ என்பதுடன் தொடர்புபடுத்துகிறது; தனிப்பட்ட மதிப்பு அல்லது பாவநிலை பற்றி வசனம் கூறாத கருத்துகளை மொழிபெயர்ப்பு சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. அரிதான חָרֻם மற்றும் שָׂרוּעַ சொற்களின் உண்மையான பொருள் நிச்சயமின்மை அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளது; சூழல் ஆண் ஆசாரியர்களைப் பற்றியதால் பாலினக் குறிப்பு தக்கவைக்கப்பட்டுள்ளது.
