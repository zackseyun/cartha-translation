source:
  edition: WLC
  text: וּ/מִן הַ/מִּקְדָּשׁ֙ לֹ֣א יֵצֵ֔א וְ/לֹ֣א יְחַלֵּ֔ל אֵ֖ת מִקְדַּ֣שׁ אֱלֹהָ֑י/ו כִּ֡י נֵ֠זֶר שֶׁ֣מֶן מִשְׁחַ֧ת אֱלֹהָ֛י/ו עָלָ֖י/ו אֲנִ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/012.yaml
  text: And he shall not go out from the sanctuary[a], nor shall he profane the sanctuary of his God, because the consecration of the anointing oil of his God is upon him. I am Yahweh.
translation:
  language: ta
  text: அவர் திருத்தலத்தைவிட்டு வெளியே செல்லக் கூடாது; தன் தேவனுடைய திருத்தலத்தின் பரிசுத்தத்தைக் குலைக்கவும் கூடாது. ஏனெனில், தன் தேவனுடைய அபிஷேக எண்ணெயினால் உண்டான அர்ப்பணிப்பு அவர்மேல் உள்ளது. நானே யெகோவா.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִן הַמִּקְדָּשׁ
  choice: பரிசுத்த இடத்திலிருந்து
  rationale: מִקְדָּשׁ என்பது பரிசுத்தமாகப் பிரித்துவைக்கப்பட்ட இடம் அல்லது திருத்தலத்தைக் குறிக்கிறது. ஆசாரியச் சட்டத்தின் சூழலில் சாதாரண வாசகருக்குத் தெளிவாக இருக்க ‘பரிசுத்த இடம்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: לֹא יֵצֵא
  choice: வெளியே செல்லக் கூடாது
  rationale: יָצָא என்பதன் நேரடியான ‘வெளியே செல்’ என்ற பொருளையும், சட்ட விதியின் தடைத் தன்மையையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְלֹא יְחַלֵּל
  choice: பரிசுத்தமற்றதாக்கவும் கூடாது
  rationale: פיעל வடிவிலுள்ள חלל, பரிசுத்தமான ஒன்றின் பரிசுத்தத் தன்மையைக் குலைப்பதை அல்லது அதை அவமதிப்பதைச் சுட்டுகிறது. ‘தீட்டுப்படுத்து’ என்பது சடங்குத் தீட்டையே மட்டும் உணர்த்தக்கூடும் என்பதால், பரிசுத்தம்–பரிசுத்தமின்மை என்ற எபிரெய எதிர்மறையைத் தக்கவைக்கும் இச்சொற்றொடர் தேர்ந்தெடுக்கப்பட்டது.
- source_word: אֵת מִקְדַּשׁ אֱלֹהָיו
  choice: தன் தேவனின் பரிசுத்த இடத்தை
  rationale: எபிரெய மூலத்திலுள்ள מִקְדָּשׁ என்ற சொல்லின் மறுபயன்பாட்டையும், மூன்றாம் நபர் உடைமைத் தொடர்பையும் தக்கவைக்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய தடைகளுக்கான காரணத்தை அறிமுகப்படுத்தும் காரணவியல் இணைப்பாக உள்ளது.
- source_word: נֵזֶר
  choice: அர்ப்பணிப்பு
  rationale: נֵזֶר என்பதற்கு ‘மகுடம்/தலைக்கிரீடம்’ என்றும் ‘அர்ப்பணிக்கப்பட்ட நிலை’ என்றும் பொருள் அமையலாம். இங்கு அபிஷேக எண்ணெயுடன் இணைந்து தலைமை ஆசாரியரின் அர்ப்பணிக்கப்பட்ட நிலையைக் குறிக்கிறது; உண்மையான சொற்பொருள் வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- source_word: שֶׁמֶן מִשְׁחַת אֱלֹהָיו
  choice: தன் தேவனுடைய அபிஷேக எண்ணெயால் பெற்ற
  rationale: எண்ணெயும் அபிஷேகமும் தேவனுடனான உடைமைத் தொடர்பும் வெளிப்படுகின்றன. தமிழில் காரணம் அல்லது வழிமுறையை இயல்பாகக் காட்ட ‘எண்ணெயால் பெற்ற’ என அமைக்கப்பட்டது.
- source_word: עָלָיו
  choice: அவர்மேல் இருக்கிறது
  rationale: அர்ப்பணிக்கப்பட்ட நிலை தொடர்ந்து அவர்மேல் இருப்பதைச் சுட்டும் எபிரெய இடைச்சொல் அமைப்பை நெருக்கமாகத் தக்கவைக்கிறது.
- source_word: אֲנִי יְהוָה
  choice: நானே யெகோவா
  rationale: திருப்பெயரான יהוה-ஐ பொதுப்பட்டமான ‘ஆண்டவர்’ என்பதாக மாற்றாமல், பெயராகத் தெளிவாகக் காட்டுகிறது; ‘நானே’ என்பது உறுதிப்படுத்தும் தெய்வீக வாய்பாட்டின் வலிமையை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: தலைமை ஆசாரியரின் நிலையை விளக்கும் נֵזֶר என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘அர்ப்பணிப்பு’
  alternative: ‘தன் தேவனுடைய அபிஷேக எண்ணெயின் மகுடம் அவர்மேல் இருக்கிறது’
  rationale: சூழலில் அபிஷேக எண்ணெயால் குறிக்கப்படும் அர்ப்பணிக்கப்பட்ட நிலையே தடைகளுக்குக் காரணமாகிறது. எனினும் נֵזֶר என்பதன் ‘மகுடம்’ என்ற உருவக அல்லது நேரடிப் பொருள் உண்மையான மொழியியல் வாய்ப்பு என்பதால் அதை அடிக்குறிப்பில் தக்கவைத்துள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்ட உரைக்கேற்ற கண்ணியமானதும் தெளிவானதுமான நடை பயன்படுத்தப்பட்டது. மூலத்தின் சொல் மறுபயன்பாடு பாதுகாக்கப்பட்டது; נֵזֶר என்பதிலுள்ள உண்மையான ambiguity அடிக்குறிப்பில் வெளிப்படையாக வைக்கப்பட்டது.
