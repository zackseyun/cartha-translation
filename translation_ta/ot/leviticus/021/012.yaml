revisions:
- from: அவர் பரிசுத்த இடத்திலிருந்து வெளியே செல்லக் கூடாது; தன் தேவனின் பரிசுத்த இடத்தைப் பரிசுத்தமற்றதாக்கவும் கூடாது. ஏனெனில் தன் தேவனுடைய அபிஷேக எண்ணெயால் பெற்ற அர்ப்பணிப்பு[a] அவர்மேல் இருக்கிறது. நானே யெகோவா.
