  text: 'except for his close relative who is nearest to him: for his mother[a], for his father, for his son, for his daughter, and for his brother—'
translation:
  language: ta
  text: தனக்கு மிக நெருக்கமான உறவினருக்காக மட்டுமே—தன் தாய்க்காகவும்[a], தன் தந்தைக்காகவும், தன் மகனுக்காகவும், தன் மகளுக்காகவும், தன் சகோதரனுக்காகவும்—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: שְׁאֵר (ஷெர்) என்ற எபிரெயச் சொல் சொல்லாட்சிப்படி ‘சதை’ அல்லது ‘உறவினர்’ என்ற பொருளுடையது. ஆகவே, ‘மிக நெருக்கமான உறவினர்’ என்பதை ‘நெருங்கிய இரத்த உறவினர்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: ஆனால் ... மட்டும்
  rationale: முந்தைய வசனத்திலுள்ள தடைக்கு விதிவிலக்கை அறிமுகப்படுத்தும் எபிரெயச் சொற்றொடரின் கட்டுப்படுத்தும் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: שְׁאֵרוֹ
  choice: தன் ... உறவினர்
  rationale: שְׁאֵר என்பதன் அடிப்படைப் பொருள் ‘சதை’; இங்கு அது நெருங்கிய இரத்த உறவைக் குறிக்கிறது. ‘உறவினர்’ என்பது நவீன தமிழில் தெளிவானதும் இயல்பானதும் ஆகும்.
- source_word: הַקָּרֹב אֵלָיו
  choice: தனக்கு மிக நெருங்கிய
  rationale: உறவுமுறையில் உள்ள அண்மையை வலியுறுத்துகிறது; ‘மிக நெருங்கிய’ என்பது அந்த வலிமையைத் தமிழில் பாதுகாக்கிறது.
- source_word: לְאִמּוֹ וּלְאָבִיו וְלִבְנוֹ וּלְבִתּוֹ וּלְאָחִיו
  choice: தன் தாய்க்காகவும், தன் தந்தைக்காகவும், தன் மகனுக்காகவும், தன் மகளுக்காகவும், தன் சகோதரனுக்காகவும்
  rationale: ஒவ்வொரு குடும்ப உறுப்பினருக்கும் முன் திரும்பத் திரும்ப வரும் לְ முன்னொட்டின் ‘-க்காக’ என்ற தொடர்பைத் தெளிவாகப் பாதுகாத்து, சட்டப் பட்டியலின் அமைப்பையும் நிலைநிறுத்துகிறது.
