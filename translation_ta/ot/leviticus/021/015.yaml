base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/015.yaml
  text: He shall not profane his offspring among his people[c][b][a], for I am Yahweh who sanctifies him.
translation:
  language: ta
  text: அவன் தன் சந்ததியைப் புனிதமற்றதாக்கக்கூடாது[a] தன் மக்களிடையே[b]; ஏனெனில், அவனைப் புனிதப்படுத்துகிற யாவே நானே[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தன் சந்ததியைத் தீட்டுப்படுத்தக்கூடாது” அல்லது “தன் சந்ததியின் புனிதத்தைக் கெடுக்கக்கூடாது.” எபிரெய வினைச்சொல், புனிதமாக இருக்க வேண்டியதைப் புனிதமற்றதாக்கும் பொருளைக் கொண்டது.
    reason: lexical_alternative
  - marker: b
    text: இச்சூழல் திருமணம் குறித்த கட்டுப்பாடுகளைப் பற்றியது. அவற்றை மீறுவது உடன்படிக்கைச் சமூகத்திற்குள் அவனுடைய சந்ததியைப் புனிதமற்றதாக்குவதாகக் குறிக்கலாம்.
    reason: cultural_note
  - marker: c
    text: அல்லது, “அவனைப் புனிதமாக்குகிற” அல்லது “அவனைப் புனிதப் பணிக்கென அர்ப்பணிக்கிற.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְחַלֵּל
  choice: தீட்டுப்படுத்த
  rationale: חלל என்பதன் பியேல் வடிவம், புனிதமாக இருக்க வேண்டிய ஒன்றைப் புனிதமற்றதாக்குதல் என்ற ஆசாரியப் பரிசுத்தச் சூழலுக்குரிய பொருளைத் தருகிறது. நவீனத் தமிழில் ‘தீட்டுப்படுத்த’ என்பது அந்த வலுவை இயல்பாக வெளிப்படுத்துகிறது; மாற்றாக ‘புனிதத்தைக் கெடுக்க’ என்றும் மொழிபெயர்க்கலாம்.
- source_word: זַרְעוֹ
  choice: தன் சந்ததி
  rationale: זֶרַע என்பதற்கு விதை, பிள்ளைப்பேறு, சந்ததி ஆகிய பொருள்கள் உண்டு. திருமணமும் ஆசாரிய மரபும் பற்றிய இச்சூழலில் ‘தன் சந்ததி’ என்பது இயல்பாகவும் வம்சத் தொடர்பைப் பாதுகாக்கும் வகையிலும் உள்ளது.
- source_word: בְּעַמָּיו
  choice: தன் மக்களிடையே
  rationale: בְּ + עַם மற்றும் மூன்றாம் நபர் ஒருமை ஆண்பால் பின்னொட்டு ஆகியவை நேரடியாக ‘தன் மக்களிடையே’ என்று பொருள்படுகின்றன; இது சமூக மற்றும் உடன்படிக்கைச் சூழலைத் தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தேவனுடைய தனிப்பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் அறியப்பட்ட ஒலிபெயர்ப்பான ‘யாவே’ என்று வழங்குகிறது.
- source_word: מְקַדְּשׁוֹ
  choice: அவனைப் புனிதப்படுத்துகிற
  rationale: קדשׁ என்பதன் பங்கேற்பு வடிவம் ஒருவரைப் புனிதமாக்குதல் அல்லது புனிதப் பணிக்கெனப் பிரித்துவைத்தல் என்பதைக் குறிக்கிறது. ‘புனிதப்படுத்துகிற’ என்பது மூலத்தின் தொடர்ச்சியான செயற்பாட்டு வடிவத்தையும் பரிசுத்தக் கருத்தையும் பாதுகாக்கிறது.
theological_decisions:
- issue: தடை யாரையும் எதையும் குறிக்கிறது; புனிதப்படுத்தும் காரணவாக்கியத்தின் தொடர்பு
  choice: ஆசாரியன் தன் மக்களிடையே தன் சந்ததியைப் புனிதமற்றதாக்கக் கூடாது; ஏனெனில் யாவே அவனைப் புனிதப்படுத்துகிறார்.
  alternative: தடைசெய்யப்பட்ட பெண்ணை மணப்பதன் மூலம் தலைமை ஆசாரியன் தன் வம்சத்தாரை ஆசாரியத் தகுதியற்றவர்களாக்கக் கூடாது என்று இதை இன்னும் குறிப்பாக விளக்கலாம்.
  rationale: உடனடிச் சூழல் ஆசாரியருக்கான திருமணக் கட்டுப்பாடுகளைப் பற்றியது. எனினும், எபிரெய உரை ஆசாரியப் பதவித் தகுதியிழப்பை வெளிப்படையாகச் சொல்லாமல் ‘சந்ததியைத் தீட்டுப்படுத்துதல்’ என்ற பரந்த சொல்லாட்சியைப் பயன்படுத்துகிறது. ஆகவே விளக்கத்தை முதன்மை உரைக்குள் சேர்க்காமல், மூலத்தின் இறையியல் அழுத்தத்தையும் தெளிவின்மையையும் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியக்கூடிய ஆனால் கண்ணியமான வேதாகம நடையில் வடிவமைக்கப்பட்டது. ‘சந்ததி,’ ‘புனிதப்படுத்துகிற’ போன்ற சொற்கள் லேவியராகமத்தின் ஆசாரியப் பரிசுத்தச் சொல்லாட்சியைப் பாதுகாக்கின்றன. அடிக்குறிப்பு குறிகள் உரையில் அவை விளக்கும் சொற்றொடர்களுக்குப் பின் வரிசையாக அமைக்கப்பட்டுள்ளன.
