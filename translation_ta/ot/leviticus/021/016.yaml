base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/016.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ta
  text: 'யாவே[a] மோசேயிடம் பேசியதாவது:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில்: “YHWH”; மரபாக “ஆண்டவர்” என்று மொழிபெயர்க்கப்படுகிறது.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பேசியதாவது
  rationale: வாவ்-தொடருடன் வரும் דבר புதிய உரையாடல் நிகழ்வை அறிமுகப்படுத்துகிறது. அடுத்த வசனத்தில் உரை தொடர்வதைக் காட்ட, לֵאמֹר என்பதையும் இணைத்து இயல்பான தமிழ் அறிமுகச் சொற்றொடராக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைவனின் தனிப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டமாக மாற்றாமல், தமிழில் பொதுவாக அறியப்படும் ஒலிபெயர்ப்பில் தருகிறது.
- source_word: אֶל
  choice: -இடம்
  rationale: பேச்சின் நோக்குநரைச் சுட்டும் எபிரெய முன்னிடைச்சொல்லுக்கு இயல்பான நவீனத் தமிழ் வேற்றுமை வடிவம்.
- source_word: מֹשֶׁה
  choice: மோசே
  rationale: מֹשֶׁה என்ற ஆள்பெயரின் நிலைபெற்ற தமிழ் வடிவம்.
- source_word: לֵאמֹר
  choice: -யதாவது
  rationale: தொடர்ந்து வரவிருக்கும் உரையை அறிமுகப்படுத்தும் எபிரெய வாய்பாட்டை, இயல்பான மற்றும் கண்ணியமான தமிழ் நடையில் குறிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலவசனம் ஒரு பட்டத்தை அல்ல, YHWH என்ற தனிப்பெயரையே பயன்படுத்துகிறது. ஆகவே பெயர் ஒலிபெயர்க்கப்பட்டு, மரபுவழி மாற்றீடு அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடன் அமைக்கப்பட்டுள்ளது. அடுத்த வசனத்தில் வரும் நேரடி உரையை எதிர்நோக்கும் வகையில் இறுதியில் முக்காற்புள்ளி பயன்படுத்தப்பட்டுள்ளது.
