language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: אַלְמָנָ֤ה וּ/גְרוּשָׁה֙ וַ/חֲלָלָ֣ה זֹנָ֔ה אֶת אֵ֖לֶּה לֹ֣א יִקָּ֑ח כִּ֛י אִם בְּתוּלָ֥ה מֵ/עַמָּ֖י/ו יִקַּ֥ח אִשָּֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/014.yaml
  text: 'He shall not take these as wife: a widow[a], or a divorced woman, or a defiled woman, or a prostitute. Rather, he shall take a virgin from his own people as wife.'
translation:
  language: ta
  text: விதவையையோ, மணவிலக்குப் பெற்றவளையையோ, புனிதநிலை குலைந்தவளையோ[a], விலைமகளையோ அவன் மனைவியாக ஏற்கக் கூடாது. மாறாக, தன் மக்களுள் ஒரு கன்னிப்பெண்ணையே அவன் மனைவியாக ஏற்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தீட்டுப்பட்டவள்’ அல்லது ‘பரிசுத்தக்கேடானவள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல், ஆசாரியப் பரிசுத்தச் சட்டத்தின்படி திருமணத்திற்குத் தகாததாகக் கருதப்பட்ட நிலையிலுள்ள பெண்ணைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלְמָנָה
  choice: விதவை
  rationale: எபிரெயச் சொல்லின் வழக்கமான பொருளைத் தெளிவான நவீன தமிழில் தருகிறது.
- source_word: גְרוּשָׁה
  choice: மணவிலக்குப் பெற்றவள்
  rationale: கணவனால் அனுப்பிவிடப்பட்ட, அதாவது திருமண உறவு முறிக்கப்பட்ட பெண்ணைக் குறிக்கும் செயப்பாட்டு வடிவத்தை இயல்பான சட்ட-திருமண மொழியில் வெளிப்படுத்துகிறது.
- source_word: חֲלָלָה
  choice: புனிதநிலை குலைந்தவள்
  rationale: ஆசாரியப் பரிசுத்தச் சட்டத்தில் திருமணத்திற்குத் தகாததாகக் கருதப்படும் நிலையைச் சுட்டுகிறது. பொதுவான சடங்குத் தீட்டை மட்டும் குறிப்பதாகத் தோன்றாமல், மூலச்சொல்லின் ‘புனிதத்தன்மை குலைக்கப்படுதல்’ என்ற கருத்தைப் பாதுகாக்கிறது.
- source_word: זֹנָה
  choice: விலைமகள்
  rationale: நவீன தமிழில் நேரடியும் புரிந்துகொள்ளத்தக்கதுமான இணைச்சொல்; பழமையான அல்லது இழிவூட்டும் தேவையற்ற சொல்லாட்சியைத் தவிர்க்கிறது.
- source_word: אֶת אֵלֶּה לֹא יִקָּח
  choice: இவர்களை அவன் மனைவியாக ஏற்கக் கூடாது
  rationale: ‘எடுத்துக்கொள்ளுதல்’ என்ற எபிரெயத் திருமண மரபுத்தொடரின் பொருளைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; பட்டியலமைப்புக்கேற்ப ஒவ்வொரு பெயருடனும் ‘-ஐயோ’ இணைக்கப்பட்டுள்ளது.
- source_word: כִּי אִם
  choice: மாறாக … மட்டுமே
  rationale: தடைக்குப் பின் அனுமதிக்கப்பட்ட ஒரே மாற்றை வலியுறுத்தும் எதிர்மறை-விதிவிலக்கு அமைப்பைப் பாதுகாக்கிறது.
- source_word: בְּתוּלָה
  choice: கன்னிப்பெண்
  rationale: இந்தத் திருமணச் சட்டச் சூழலில் பாலுறவு கொள்ளாத பெண்ணைக் குறிக்கும் சொல்லின் நேரடியான, புரிந்துகொள்ளத்தக்க தமிழ் வடிவம்.
- source_word: מֵעַמָּיו
  choice: தன் மக்களுள்
  rationale: அவனுடைய சொந்த மக்கள் சமூகத்திலிருந்து என்ற மூலத்தின் உறவையும் தோற்றத்தையும் இயல்பாகத் தருகிறது; தேவையின்றி ‘இனம்’ என்ற குறுகிய பொருளைச் சேர்ப்பதில்லை.
- source_word: אִשָּׁה
  choice: மனைவியாக
  rationale: இங்கு பொதுவாக ‘பெண்’ என்பதல்ல, திருமணத் துணையாக ஏற்றுக்கொள்வதே கருத்து என்பதைத் தமிழில் தெளிவாக்குகிறது.
theological_decisions:
- issue: ஆசாரியப் பரிசுத்தச் சட்டத்தில் חֲלָלָה என்ற சொல்லின் பொருள்
  choice: புனிதநிலை குலைந்தவள்
  alternative: தீட்டுப்பட்டவள்; பரிசுத்தக்கேடானவள்
  rationale: இச்சொல் சாதாரண உடல் அல்லது சடங்குத் தீட்டை மட்டும் குறிக்காமல், ஆசாரியப் பரிசுத்த ஒழுங்கில் ஒருவருடைய நிலை புனிதத்தன்மைக்கு ஒவ்வாததாகக் கருதப்படுவதைச் சுட்டலாம். மூலத்தின் நிலைசார் கருத்தையும் அதன் தெளிவின்மையையும் காக்கும் வகையில் முதன்மை மொழிபெயர்ப்பும் அடிக்குறிப்பும் அமைக்கப்பட்டுள்ளன.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டப்பாங்கின் கண்ணியத்தைக் காத்தபடி எளிதில் புரியும் சொற்கள் பயன்படுத்தப்பட்டுள்ளன. எபிரெய மொழியின் ‘மனைவியாக எடுத்துக்கொள்’ என்ற மரபுத்தொடர் தமிழில் இயல்பான ‘மனைவியாக ஏற்க’ என வழங்கப்பட்டுள்ளது. அடிக்குறிப்பு குறியீடு அதற்குரிய חֲלָלָה சொல்லின் மொழிபெயர்ப்புக்குப் பின்னரே இடப்பட்டுள்ளது.
