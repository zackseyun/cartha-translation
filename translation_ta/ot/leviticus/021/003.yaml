base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/003.yaml
  text: and for his virgin sister who is near to him[a], who has not belonged to a man, he may make himself unclean.
translation:
  language: ta
  text: அவனுக்கு நெருக்கமான, கன்னியான, ஆணுக்குரியவளாகாத தன் சகோதரிக்காகவும்[a] அவன் தன்னைத் தீட்டுப்படுத்திக்கொள்ளலாம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஆணுக்குரியவளாகாத” என்பதற்கு, “கணவன் இல்லாத” அல்லது “ஆணுடன் கூடாத” என்றும் மொழிபெயர்க்கலாம். எபிரெய மொழிவழக்கு, ஓர் ஆணுடன் திருமண அல்லது பாலுறவு ஒன்றிப்பில் சேராத சகோதரியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלַאֲחֹתוֹ
  choice: தன் சகோதரிக்காகவும்
  rationale: இணைப்பிடைச்சொல், முன்னிடைச்சொல், உடைமைப் பின்னொட்டு ஆகியவற்றை இயல்பான தமிழில் கொண்டு வந்து, அனுமதிக்கப்பட்ட அடுத்த உறவுமுறையைத் தொடர்ச்சியாகக் காட்டுகிறது.
- source_word: הַבְּתוּלָה
  choice: கன்னியாகிய
  rationale: பாலுறவு கொள்ளாத நிலையை நேரடியாகக் குறிக்கும் எபிரெயச் சொல்லின் பொருளைத் தக்கவைக்கிறது.
- source_word: הַקְּרוֹבָה אֵלָיו
  choice: தனக்கு நெருங்கிய உறவினளான
  rationale: இங்கு உடல் அல்லது உணர்ச்சி நெருக்கத்தை மட்டும் அல்லாமல் நெருங்கிய குடும்ப உறவைக் குறிக்கிறது; ஆகவே தமிழில் பொருள் தெளிவாக வெளிப்படுத்தப்படுகிறது.
- source_word: אֲשֶׁר לֹא הָיְתָה לְאִישׁ
  choice: ஆணோடு உறவு கொள்ளாத
  rationale: எபிரெய மொழிவழக்கு திருமண அல்லது பாலுறவு ஒன்றிப்பைச் சுட்டக்கூடும். தமிழில் இயல்பாக இருக்கும்படியும் அந்தப் பொருள் பரப்பை அளவுக்கு மீறிக் குறுக்காமலும் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: יִטַּמָּא
  choice: அவன் தன்னைத் தீட்டுப்படுத்திக்கொள்ளலாம்
  rationale: பிணத்துடன் தொடர்பு கொள்வதால் ஏற்படும் சடங்குசார் தீட்டையே குறிக்கிறது; வினை வடிவத்தின் அனுமதிப் பொருளையும் தற்குறிப்பு உணர்வையும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ஆசாரியச் சட்டத்தில் தீட்டின் இயல்பு
  choice: சடங்குசார் தீட்டைக் குறிக்கும் வகையில் ‘தன்னைத் தீட்டுப்படுத்திக்கொள்ளலாம்’
  alternative: தன்னைக் கறைப்படுத்திக்கொள்ளலாம்
  rationale: இச்சூழல் ஒழுக்கக் குற்றத்தை அல்ல, இறந்தவருடன் தொடர்பு கொள்வதால் உண்டாகும் சடங்குசார் அசுத்த நிலையைக் குறிக்கிறது.
- issue: ‘ஆணுக்கு ஆகாதவள்’ என்ற எபிரெய மொழிவழக்கின் பொருள்
  choice: மண அல்லது பாலுறவு ஒன்றிப்பை உள்ளடக்கக்கூடிய ‘ஆணோடு உறவு கொள்ளாத’
  alternative: கணவன் இல்லாதவள் / ஆணுடன் கூடாதவள்
  rationale: மூலத்தின் மொழிவழக்கு ஒரே விளக்கத்துக்கு முற்றிலும் கட்டுப்படாததால், அதன் உண்மையான பொருள் நெகிழ்வை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. ‘தீட்டு’ என்பது லேவியராகமச் சூழலில் சடங்குசார் அசுத்த நிலையைக் குறிக்கிறது; ஒழுக்கக் களங்கத்தை அல்ல. அடிக்குறிப்பு குறியீடு தொடர்புடைய சொல்லொடருக்குப் பின் வைக்கப்பட்டுள்ளது.
