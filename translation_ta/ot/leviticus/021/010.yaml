base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/010.yaml
  text: And the high priest, who is greater than his brothers[a], on whose head the anointing oil has been poured and whose hand has been filled to wear the garments, shall not let his head hang loose[b], nor shall he tear his garments.
translation:
  language: ta
  text: தன் சகோதரர்களைவிட உயர்ந்த பதவியிலுள்ள தலைமை ஆசாரியர்—அவரது தலையில் அபிஷேக எண்ணெய் ஊற்றப்பட்டு, உடைகளை அணிவதற்காக அவரது கை நிரப்பப்பட்டிருக்கிறது[a]—தன் தலைமுடியைச் சீர்குலைந்த நிலையில் விடக்கூடாது[b]; தன் உடைகளைக் கிழிக்கவும் கூடாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “அவரது கை நிரப்பப்பட்டிருக்கிறது.” இது ஒருவரைக் குருத்துவப் பணியில் நியமித்து நிறுவுவதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: தலைமுடியைப் பராமரிக்காமல் சீர்குலைந்த நிலையில் விடுவதும் உடைகளைக் கிழிப்பதும் அக்காலத்தில் வழக்கமான துக்க அடையாளங்களாக இருந்தன.
    reason: cultural_note
lexical_decisions:
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: தலைமைக் குரு
  rationale: இது இஸ்ரவேலின் உயர்ந்த குருத்துவப் பதவியைக் குறிக்கும் நிலைபெற்ற, இயல்பான நவீனத் தமிழ் சொல்.
- source_word: מֵאֶחָיו
  choice: தன் சகோதரர்களைவிட உயர்ந்தவரான
  rationale: இங்குள்ள מִן ஒப்பீட்டுப் பொருளைக் கொண்டிருப்பதால், மற்ற குருக்களைவிட அவருக்குள்ள உயர்ந்த நிலையைக் காட்டுகிறது; ஆண் குருக்களே சூழலில் குறிக்கப்படுவதால் ‘சகோதரர்கள்’ தக்கவைக்கப்பட்டுள்ளது.
- source_word: יוּצַק עַל רֹאשׁוֹ שֶׁמֶן הַמִּשְׁחָה
  choice: அவரது தலையில் அபிஷேக எண்ணெய் ஊற்றப்பட்டு
  rationale: எண்ணெயைத் தலையில் ஊற்றும் சடங்கின் தெளிவான உருவகத்தையும் எபிரெயச் செயலின் செயப்பாட்டு வடிவத்தையும் காக்கிறது.
- source_word: וּמִלֵּא אֶת יָדוֹ
  choice: அவரது கை நிரப்பப்பட்டிருக்கிறது
  rationale: குருத்துவப் பணியில் நிறுவப்படுவதைக் குறிக்கும் எபிரெயச் சடங்கு மரபுத்தொடரை முதன்மை உரையில் பாதுகாக்கிறது; அதன் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: לִלְבֹּשׁ אֶת הַבְּגָדִים
  choice: உடைகளை அணிவதற்காக
  rationale: குறிப்பிட்ட குருத்துவ உடைகள் சூழலால் தெளிவாக இருப்பதால், மூலத்தில் இல்லாத விளக்கச் சொல்லைச் சேர்க்காமல் இயல்பாக மொழிபெயர்க்கிறது.
- source_word: אֶת רֹאשׁוֹ לֹא יִפְרָע
  choice: தன் தலைமுடியைச் சீர்குலைந்த நிலையில் விடக்கூடாது
  rationale: மூலத்தில் ‘தலை’ என்று இருந்தாலும், פָּרַע இங்கு துக்கத்தில் தலைமுடியை அவிழ்ந்த அல்லது பராமரிக்காத நிலையில் விடுவதைக் குறிக்கிறது. ‘தலையைத் திறக்கக்கூடாது’ என்ற தெளிவற்ற மொழிபெயர்ப்பைத் தவிர்க்கிறது.
- source_word: וּבְגָדָיו לֹא יִפְרֹם
  choice: தன் உடைகளைக் கிழிக்கவும் கூடாது
  rationale: துக்கத்தைக் காட்டும் வழக்கமான செயலைத் தெளிவான நவீனத் தமிழில் நேரடியாகத் தருகிறது.
theological_decisions:
- issue: מִלֵּא אֶת יָדוֹ என்ற குருத்துவ நிறுவுதல் மரபுத்தொடர்
  choice: முதன்மை உரையில் ‘அவரது கை நிரப்பப்பட்டிருக்கிறது’ என்று மரபுத்தொடரைப் பாதுகாத்து, அடிக்குறிப்பில் அதன் பொருளை விளக்குதல்
  alternative: ‘குருத்துவப் பணியில் நியமிக்கப்பட்டிருக்கிறார்’ என்று பொருளை மட்டும் நேரடியாகத் தருதல்
  rationale: இந்தச் சடங்கு மொழி லேவியராகமத்தின் குருத்துவ நிறுவுதல் கருத்துக்கு முக்கியமானது; அடிக்குறிப்பு வாசகருக்குத் தேவையான விளக்கத்தை அளிக்கிறது.
- issue: מֵאֶחָיו என்பதன் உறவு மற்றும் ஒப்பீட்டுப் பொருள்
  choice: தன் சகோதரர்களைவிட உயர்ந்தவரான
  alternative: தன் சகோதரர்களிலிருந்து தேர்ந்தெடுக்கப்பட்ட
  rationale: இங்குள்ள מִן வெறும் தோற்றுவாயைக் காட்டுவதற்குப் பதிலாக ஒப்பீட்டையும் பதவிசார் மேன்மையையும் காட்டுகிறது; அதேவேளை ‘சகோதரர்கள்’ என்ற குடும்ப/குழும மொழி பாதுகாக்கப்படுகிறது.
- issue: לֹא יִפְרָע என்ற துக்கச் செய்கையின் பொருள்
  choice: தலைமுடியைச் சீர்குலைந்த நிலையில் விடக்கூடாது
  alternative: தலையைத் திறக்கக்கூடாது
  rationale: சொல் ‘தலை’ என்பதைக் கொண்டிருந்தாலும் செயல் தலைமுடியை அவிழ்த்து அல்லது பராமரிக்காமல் விடுவதைக் குறிக்கலாம். மொழிபெயர்ப்பு சூழல்சார் பொருளைத் தருகிறது; கலாசாரப் பின்னணி அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் மரியாதையும் தெளிவும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆசாரியன்’ போன்ற சில மரபுசார் அல்லது பிரிவுசார் பயன்பாடுகளுக்குப் பதிலாக பொதுவாகப் புரியும் ‘குரு’ பயன்படுத்தப்பட்டுள்ளது. எபிரெயச் சடங்கு மரபுத்தொடர் மட்டும் அதன் வேதாகமச் சிறப்பைக் காக்க நோக்கத்துடன் நேரடியாக வைக்கப்பட்டு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
