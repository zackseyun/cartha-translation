source:
  edition: WLC
  text: וְ/קִדַּשְׁתּ֔/וֹ כִּֽי אֶת לֶ֥חֶם אֱלֹהֶ֖י/ךָ ה֣וּא מַקְרִ֑יב קָדֹשׁ֙ יִֽהְיֶה לָּ֔/ךְ כִּ֣י קָד֔וֹשׁ אֲנִ֥י יְהוָ֖ה מְקַדִּשְׁ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/008.yaml
  text: You shall treat him as holy[a], because he offers the food of your God. He shall be holy to you, for I, Yahweh who sanctify you, am holy.
translation:
  language: ta
  text: நீ அவனைப் புனிதமானவனாகக் கருத வேண்டும்; ஏனெனில், அவன் உன் கடவுளின் உணவை[a] அர்ப்பணிக்கிறான். அவன் உனக்குப் புனிதமானவனாக இருப்பான்; ஏனெனில், உங்களைப் புனிதப்படுத்துகிற யாவே ஆகிய நான் புனிதமானவர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உன் கடவுளின் அப்பத்தை.’ இங்கு ‘அப்பம்’ என்பது கடவுளுக்கு அர்ப்பணிக்கப்படும் உணவுப் படையல்களை விரிவாகக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקִדַּשְׁתּוֹ
  choice: நீ அவனைப் புனிதமானவனாகக் கருத வேண்டும்
  rationale: קדשׁ என்பதன் பியேல் வடிவம் ஒருவரைப் புனிதராகப் பிரித்துவைப்பதையோ அப்படிப்பட்டவராக மதித்து நடத்துவதையோ குறிக்கிறது. இங்கு மக்களிடம் ஆசாரியனைப் பற்றிக் கூறப்படுவதால், இயல்பான நவீனத் தமிழில் ‘புனிதமானவனாகக் கருத வேண்டும்’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: לֶחֶם אֱלֹהֶיךָ
  choice: உன் கடவுளின் உணவு
  rationale: לֶחֶם என்பதன் அடிப்படைப் பொருள் ‘அப்பம்’; ஆனால் ஆசாரியப் பலிச் சூழலில் இது கடவுளுக்கு அர்ப்பணிக்கப்படும் உணவுப் படையல்களை விரிவாகக் குறிக்கலாம். எனவே முதன்மை உரையில் ‘உணவு’ என்றும், நேரடிப் பொருள் அடிக்குறிப்பிலும் தரப்பட்டது.
- source_word: מַקְרִיב
  choice: அர்ப்பணிக்கிறான்
  rationale: קרב என்பதன் ஹிஃபில் வினையெச்சம் பலி அல்லது படையலைக் கடவுளிடம் கொண்டுவந்து செலுத்துவதைக் குறிக்கிறது. ‘அர்ப்பணிக்கிறான்’ என்பது இச்சடங்குச் சூழலைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: קָדֹשׁ יִהְיֶה לָּךְ
  choice: அவன் உனக்குப் புனிதமானவனாக இருக்க வேண்டும்
  rationale: לְ குறிக்கும் மக்களுடனான தொடர்பை ‘உனக்கு’ என்பதால் காத்து, வசனம் முழுவதும் திரும்ப வரும் קדשׁ சொல்லின் புனிதத்தன்மை கருத்தும் ஒரே சொல்லால் பேணப்பட்டது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான יהוה ஒரு பட்டப்பெயரால் மாற்றப்படாமல், நவீனத் தமிழில் புரிந்துகொள்ளத்தக்க ஒலிபெயர்ப்பாக வழங்கப்பட்டது.
- source_word: מְקַדִּשְׁכֶם
  choice: உங்களைப் புனிதப்படுத்துகிற
  rationale: קדשׁ வேர் தொடக்கக் கட்டளையுடன் ஏற்படுத்தும் சொல்லிணைப்பைப் பேண ‘புனிதப்படுத்துகிற’ எனத் தரப்பட்டது. பின்னொட்டு பன்மையாதலால் ‘உங்களை’ பயன்படுத்தப்பட்டது.
theological_decisions:
- issue: לֶחֶם אֱלֹהֶיךָ என்ற பலிச்சடங்கு மொழிநடை
  choice: உன் கடவுளின் உணவு
  alternative: உன் கடவுளின் அப்பம்
  rationale: ஆசாரியன் செலுத்தும் பலிகளைக் குறிக்கும் சூழலில் לֶחֶם விரிவாக உணவுப் படையல்களைக் குறிக்கலாம். அதேவேளை அதன் நேரடிப் பொருளான ‘அப்பம்’ அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- issue: קדשׁ வேரின் மீளுரைத்தல்
  choice: புனிதமானவன் / புனிதப்படுத்துகிற / புனிதர்
  alternative: தூயவன் / தூய்மைப்படுத்துகிற / தூயவர்
  rationale: ஆசாரியனின் நிலை, யாவேயின் செயல், யாவேயின் இயல்பு ஆகியவற்றை ஒரே எபிரெய வேர் இணைக்கிறது. தமிழிலும் ‘புனித’ என்ற சொல்லை மீண்டும் பயன்படுத்துவதன் மூலம் அந்த இறையியல் மற்றும் இலக்கியத் தொடர்பு பேணப்பட்டது.
- issue: இரண்டாம் நபர் எண்ணில் ஏற்படும் மாற்றம்
  choice: ‘உன்’ மற்றும் ‘உனக்கு’ ஒருமை; ‘உங்களை’ பன்மை
  alternative: எல்லா இடங்களிலும் பன்மைப்படுத்துதல்
  rationale: எபிரெய உரை முதலில் ஒருமையில் இஸ்ரவேலை நேரடியாக அழைத்து, இறுதியில் பன்மை பின்னொட்டுக்கு மாறுகிறது. அந்த உரைநுட்ப மாற்றம் தமிழிலும் பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘புனித’ என்ற சொல் קדשׁ வேரின் மீளுரைத்தலைத் தெளிவாகக் காக்கிறது; ‘யாவே’ என்பது தெய்வீகப் பெயரின் ஒலிபெயர்ப்பு. எபிரெயில் உள்ள ஒருமையிலிருந்து பன்மைக்கு மாறும் அழைப்புமுறை திட்டமிட்டு அப்படியே வைக்கப்பட்டுள்ளது.
