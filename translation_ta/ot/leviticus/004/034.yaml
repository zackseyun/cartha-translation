  text: וְ/לָקַ֨ח הַ/כֹּהֵ֜ן מִ/דַּ֤ם הַֽ/חַטָּאת֙ בְּ/אֶצְבָּע֔/וֹ וְ/נָתַ֕ן עַל קַרְנֹ֖ת מִזְבַּ֣ח הָ/עֹלָ֑ה וְ/אֶת כָּל דָּמָ֣/הּ יִשְׁפֹּ֔ךְ אֶל יְס֖וֹד הַ/מִּזְבֵּֽחַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/034.yaml
  text: Then the priest shall take some of the blood of the sin offering with his finger and put it on the horns of the altar of burnt offering[a], and he shall pour out all its blood at the base of the altar.
translation:
  language: ta
  text: பின்பு ஆசாரியன் பாவப்பலியின் இரத்தத்தில் சிறிதைத் தன் விரலால் எடுத்து, தகனபலிபீடத்தின் கொம்புகள்மேல் பூச வேண்டும்[a]. அதன் இரத்தம் முழுவதையும் பலிபீடத்தின் அடிப்பகுதியில் ஊற்ற வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தூய்மைப்படுத்தும் பலி.” எபிரெயச் சொல் பாவம் மற்றும் சடங்குத் தூய்மைப்படுத்துதல் தொடர்பாகச் செலுத்தப்படும் பலியைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: பின்பு ... எடுத்து
  rationale: வாவ் + கத்தால் வடிவம் சடங்கின் அடுத்த செயலைத் தொடர்ச்சியாகக் குறிக்கிறது; நவீன தமிழில் ‘பின்பு’ படிநிலையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַכֹּהֵן
  choice: ஆசாரியன்
  rationale: சடங்கை நிறைவேற்றும் நியமிக்கப்பட்ட குருவைக் குறிக்கும் தமிழ் வேதாகம மரபிலும் பொதுப் பயன்பாட்டிலும் அறியப்பட்ட சொல்.
- source_word: מִדַּם הַחַטָּאת
  choice: பாவநிவாரணப் பலியின் இரத்தத்தில் சிறிதை
  rationale: מִן இங்கு பகுதியைக் குறிக்கிறது; பலியின் இரத்தத்தில் ஒரு பகுதி மட்டும் விரலால் எடுக்கப்படுகிறது. חַטָּאת என்பது இச்சூழலில் பாவம் என்ற கருத்தை அல்ல, அதனுடன் தொடர்புடைய பலியைக் குறிக்கிறது.
- source_word: בְּאֶצְבָּעוֹ
  choice: தன் விரலால்
  rationale: בְּ கருவிப்பொருளைக் குறிக்கிறது; ஆசாரியன் தனது விரலைப் பயன்படுத்துவதைத் தெளிவாகச் சொல்கிறது.
- source_word: וְנָתַן
  choice: பூச வேண்டும்
  rationale: נתן என்பதன் அடிப்படைப் பொருள் ‘வைத்தல்’; இங்கு இரத்தத்தைப் பலிபீடக் கொம்புகள்மேல் சடங்குமுறையில் தடவுவதைக் குறிக்கும் இயல்பான தமிழ் வினை ‘பூசு’.
- source_word: עַל קַרְנֹת מִזְבַּח הָעֹלָה
  choice: தகனபலிபீடத்தின் கொம்புகள்மேல்
  rationale: பலிபீடத்தின் நீட்டிப்புகளான ‘கொம்புகள்’ என்ற வழிபாட்டுச் சித்திரத்தைப் பாதுகாத்து, அது தகனபலிக்குரிய பலிபீடம் என்பதையும் சுருக்கமாகக் காட்டுகிறது.
- source_word: וְאֶת כָּל דָּמָהּ
  choice: அதன் இரத்தம் முழுவதையும்
  rationale: כָּל முழுமையைக் குறிக்கிறது. முன்பு சிறிது எடுக்கப்பட்டதால் நடைமுறையில் மீதியிரத்தம் உத்தேசிக்கப்பட்டாலும், எபிரெய உரையின் ‘முழுவதையும்’ என்ற சொல்லை மாற்றாமல் காக்கிறது.
- source_word: יִשְׁפֹּךְ
  choice: ஊற்ற வேண்டும்
  rationale: வேண்டுமென்றே செய்யப்படும் சடங்குச் செயலை இயல்பான தமிழில் தெரிவிக்கிறது; தற்செயலான சிந்துதலைக் குறிக்கவில்லை.
- source_word: אֶל יְסוֹד הַמִּזְבֵּחַ
  choice: பலிபீடத்தின் அடியில்
  rationale: יְסוֹד என்பது அடித்தளம் அல்லது அடி; சடங்கு நடைபெறும் இடத்தை நவீன தமிழில் தெளிவாகக் குறிக்கிறது.
theological_decisions:
- issue: பலிச்சட்டத்தில் חַטָּאת என்பதன் மொழிபெயர்ப்பு
  choice: பாவநிவாரணப் பலி
  alternative: தூய்மைப்படுத்தும் பலி
  rationale: இச்சூழலில் இச்சொல் ‘பாவம்’ என்னும் கருத்தை மட்டும் அல்லாமல், பாவம் மற்றும் சடங்குத் தூய்மையுடன் தொடர்புடைய பலியைக் குறிக்கிறது. ‘பாவநிவாரணப் பலி’ வாசகர்களுக்கு அறிமுகமானதும் பலியின் பாவத் தொடர்பைத் தெளிவாக்குவதுமாக உள்ளது; தூய்மைப்படுத்தும் செயல்பாட்டை வலியுறுத்தும் மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரமான, மரியாதைமிக்க தமிழ்நடை பயன்படுத்தப்பட்டுள்ளது. சடங்குச் சொற்களான ‘ஆசாரியன்,’ ‘தகனபலி,’ ‘பலிபீடம்,’ ‘கொம்புகள்’ தெளிவுக்காகத் தக்கவைக்கப்பட்டுள்ளன; கட்டளைச் செயல்முறை ‘வேண்டும்’ வடிவில் தொடர்ச்சியாக வழங்கப்பட்டுள்ளது.
