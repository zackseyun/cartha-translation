  text: And if one person from the common people sins unintentionally by doing one of Yahweh’s commandments that must not be done, and becomes guilty,
translation:
  language: ta
  text: பொதுமக்களில் ஒருவர்[a], யாவேயின் கட்டளைகளில் செய்யக்கூடாத ஒன்றைத் தற்செயலாகச் செய்து பாவம் புரிந்து, குற்றவாளியானால்[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்சொல்லாக, ‘நாட்டின் மக்களில் ஒருவர்.’ இங்கு இச்சொற்றொடர், சுற்றியுள்ள சட்டங்களில் குறிப்பிடப்படும் ஆசாரியர் அல்லது தலைவருக்கு மாறாக, சமூகத்தின் ஒரு சாதாரண உறுப்பினரைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘குற்றமுள்ளவரானால்’ / ‘குற்றத்தைச் சுமந்தால்.’ எபிரெய வினைச்சொல் ஒருவர் குற்றநிலையை அடைவதையோ குற்றத்தைச் சுமப்பதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ אַחַת
  choice: ஒருவர்
  rationale: சட்டச் சூழலில் נֶפֶשׁ என்பது ஓர் தனிநபரைக் குறிக்கிறது; ‘ஒருவர்’ என்பது ஒருமையையும் இயல்பான நவீன தமிழையும் காக்கிறது.
- source_word: מֵעַם הָאָרֶץ
  choice: பொதுமக்களில்
  rationale: சுற்றியுள்ள சட்டங்களில் ஆசாரியர் மற்றும் தலைவர் ஆகியோருக்கு மாறாக, சமூகத்தின் சாதாரண உறுப்பினரை இச்சொற்றொடர் குறிக்கிறது. சொற்சொல்லான ‘நாட்டின் மக்களில்’ இச்சூழலில் தவறான எண்ணத்தை ஏற்படுத்தலாம்.
- source_word: בִשְׁגָגָה
  choice: தற்செயலாக
  rationale: பலிச்சட்டச் சூழலில் அறிந்தே செய்யாத, உள்நோக்கமற்ற மீறுதலைக் குறிக்கிறது.
- source_word: תֶּחֱטָא
  choice: பாவம் புரிந்து
  rationale: חטא என்பதன் வழக்கமான பொருள் ‘பாவம் செய்தல்’; வாக்கியத்தின் தொடரமைப்புக்கு ‘பாவம் புரிந்து’ இயல்பாக அமைகிறது.
- source_word: בַּעֲשֹׂתָהּ אַחַת מִמִּצְוֺת יְהוָה אֲשֶׁר לֹא תֵעָשֶׂינָה
  choice: செய்யக்கூடாது என்று யெகோவா கட்டளையிட்டவற்றில் ஒன்றைச் செய்து
  rationale: எபிரெயப் பகுதி யெகோவாவின் கட்டளைகளில் தடைசெய்யப்பட்ட ஒன்றைச் செய்வதைக் குறிக்கிறது; தமிழில் தெளிவுக்காக உறவுப்பிரிவு இயல்பான வரிசையில் அமைக்கப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: இறைப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பொதுப்பட்டமாக மாற்றாமல், தமிழில் பரவலாக அறியப்படும் பெயர்வடிவில் தருகிறது.
- source_word: וְאָשֵׁם
  choice: குற்றவாளியானால்
  rationale: செயலின் விளைவாக ஒருவர் குற்றநிலையை அடைவதை வினைச்சொல் குறிக்கலாம்; நிபந்தனை வாக்கியத்தின் தொடர்ச்சியைத் தமிழில் இயல்பாகக் காக்கிறது.
theological_decisions:
- issue: מֵעַם הָאָרֶץ என்பதன் சமூக-சட்டப் பொருள்
  choice: பொதுமக்களில்
  alternative: நாட்டின் மக்களில்
  rationale: இங்கு ஆசாரியர், சபை, தலைவர் ஆகிய பிரிவுகளுடன் ஒப்பிடும்போது ஒரு சாதாரண சமூக உறுப்பினர் குறிக்கப்படுகிறார்; தேர்ந்தெடுக்கப்பட்ட சொல் அந்த வேறுபாட்டைத் தெளிவாக்குகிறது.
- issue: וְאָשֵׁם என்பதன் பொருள் வலிமை
  choice: குற்றவாளியானால்
  alternative: குற்றத்தைச் சுமந்தால் / குற்றமுள்ளவரானால்
  rationale: தடைசெய்யப்பட்ட செயலைத் தொடர்ந்து ஏற்படும் குற்றநிலையை மொழிபெயர்ப்பு காட்டுகிறது; வினைச்சொல்லின் ‘குற்றத்தை அடைதல்’ மற்றும் ‘குற்றமுள்ளவராதல்’ ஆகிய சாத்தியங்களை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், சட்ட மற்றும் வழிபாட்டு சூழலுக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய நிபந்தனை வாக்கியத்தின் முடிவிலுள்ள தொடர்ச்சியைச் சுட்டும் வகையில் வசனம் காற்புள்ளியுடன் முடிகிறது.
