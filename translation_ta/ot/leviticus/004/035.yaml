base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/035.yaml
  text: And he shall remove all its fat[a], just as the fat of the lamb is removed from the sacrifice of peace offerings, and the priest shall burn them on the altar, on the food offerings of Yahweh. Thus the priest shall make atonement for him concerning the sin that he committed, and he shall be forgiven.
translation:
  language: ta
  text: சமாதானப் பலியின் செம்மறியாட்டுக் குட்டியிலிருந்து கொழுப்பு அகற்றப்படுவதுபோலவே, அதன் கொழுப்பு முழுவதையும் அவன் அகற்ற வேண்டும். ஆசாரியன் அந்தக் கொழுப்புப் பகுதிகளைப் பலிபீடத்தின்மேல், யாவேக்குச் செலுத்தப்படும் நெருப்புப் பலிகளின்மேல்[a] எரிக்க வேண்டும். இவ்வாறு, அவன் செய்த பாவத்திற்காக ஆசாரியன் அவனுக்குப் பாவநிவிர்த்தி செய்வான்; அவன் மன்னிக்கப்படுவான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேக்குரிய உணவுப் படையல்களின்மேல்.” இங்குள்ள எபிரெயச் சொற்றொடர் நெருப்பில் செலுத்தப்படும் பலிகளைக் குறிக்கும் தொழில்நுட்பச் சடங்குச் சொல்.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶלְבָּהּ / חֵלֶב
  choice: கொழுப்பு / கொழுப்புப் பகுதிகள்
  rationale: பலிக்குரிய விலங்கிலிருந்து அகற்றி எரிக்கப்படும் கொழுப்பைக் குறிக்கிறது. முதல் இடத்தில் ஒருமையான மொத்தப் பொருளாகவும், אֹתָם என்ற பன்மைச் சுட்டுப்பெயரின் இடத்தில் தனித்தனி பகுதிகளாகவும் இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: יָסִיר / יוּסַר
  choice: அகற்ற வேண்டும் / அகற்றப்படுவது
  rationale: பலிச் சடங்கில் விலங்கிலிருந்து குறிப்பிட்ட கொழுப்பை நீக்கும் செயலைத் தெளிவாகக் காட்டுகிறது.
- source_word: הַכֶּשֶׂב
  choice: செம்மறியாட்டுக் குட்டி
  rationale: பலியிடும் சூழலில் כֶּשֶׂב குறிக்கும் இளம் செம்மறியாட்டை நவீனத் தமிழில் துல்லியமாகக் கூறுகிறது.
- source_word: זֶבַח הַשְּׁלָמִים
  choice: சமாதானப் பலி
  rationale: இது நிறுவப்பட்ட பலிவகையின் பெயரைப் பாதுகாக்கிறது; ‘நல்லுறவுப் பலி’ என்பதும் சாத்தியமான விளக்க மொழிபெயர்ப்பு.
- source_word: וְהִקְטִיר
  choice: எரிக்க வேண்டும்
  rationale: பலிபீடத்தில் கொழுப்பை எரித்துப் புகையாக்கும் சடங்குச் செயலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: אֹתָם
  choice: அந்தக் கொழுப்புப் பகுதிகளை
  rationale: எபிரெய மொழியின் ஆண்பால் பன்மைச் சுட்டுப்பெயரைத் தெளிவாக்கி, பல தனித்தனி கொழுப்புப் பகுதிகள் குறிக்கப்படுவதைப் பாதுகாக்கிறது.
- source_word: עַל אִשֵּׁי יְהוָה
  choice: யாவேக்குச் செலுத்தப்படும் நெருப்புப் பலிகளின்மேல்
  rationale: אִשֶּׁה என்ற தொழில்நுட்பப் பலிச்சொல்லை ‘நெருப்புப் பலி’ எனக் காட்டி, עַל என்பதன் ‘மேல்’ உறவையும் வெளிப்படையாக வைத்திருக்கிறது; மாற்று புரிதல் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பட்டமாக மாற்றாமல், எபிரெய நான்கெழுத்துத் திருப்பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: וְכִפֶּר עָלָיו
  choice: அவனுக்குப் பாவநிவிர்த்தி செய்வான்
  rationale: ஆசாரிய பலிச்சடங்கில் כפר என்பதன் பரந்த சடங்கு-இறையியல் பொருளைப் பாதுகாக்கிறது; ஒரு குறிப்பிட்ட பாவநிவிர்த்திக் கோட்பாட்டைத் திணிக்கவில்லை.
- source_word: עַל חַטָּאתוֹ אֲשֶׁר חָטָא
  choice: அவன் செய்த பாவத்திற்காக
  rationale: எபிரெயச் சொற்றொடரின் பொருளைத் தமிழில் இயல்பாகவும் தெளிவாகவும் வழங்குகிறது.
- source_word: וְנִסְלַח לוֹ
  choice: அவன் மன்னிக்கப்படுவான்
  rationale: மன்னிப்பு வழங்கப்படுவதைக் குறிக்கும் எபிரெயச் செயப்பாட்டு வடிவத்தைத் தமிழிலும் செயப்பாட்டில் பாதுகாக்கிறது.
theological_decisions:
- issue: பலிச் சடங்கின் כפר மொழியாக்கம்
  choice: பாவநிவிர்த்தி செய்வான்
  alternative: பாவப்பரிகாரம் செய்வான்
  rationale: ‘பாவநிவிர்த்தி’ சடங்கின் இறையியல் பரப்பைப் பாதுகாக்கிறது; அது எவ்வாறு செயல்படுகிறது என்ற பிற்காலக் கோட்பாட்டை வசனத்துக்குள் சேர்க்கவில்லை.
- issue: יְהוָה என்ற இறைப் பெயர்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் காணப்படும் தனிப்பட்ட உடன்படிக்கைப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: זֶבַח הַשְּׁלָמִים என்ற பலிவகை
  choice: சமாதானப் பலி
  alternative: நல்லுறவுப் பலி
  rationale: ‘சமாதானப் பலி’ பாரம்பரியமாக அறியப்படும் பலிவகைப் பெயரைப் பாதுகாக்கிறது; சொல்லின் உறவு/நலவாழ்வு நுணுக்கத்தை ஒரே பொருளாக மட்டும் நிர்ணயிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் தெளிவும் கொண்ட சடங்கு நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. நீண்ட எபிரெய வாக்கியம் வாசிப்புத் தெளிவுக்காகச் சிறு வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது; கட்டளையிடும் சடங்கு விதிகள் ‘வேண்டும்’ வடிவிலும், உறுதியான விளைவு எதிர்கால வடிவிலும் தரப்பட்டுள்ளது.
