  register: நவீன நிலையான தமிழ்; சட்ட-வழிபாட்டு சூழலுக்கேற்ற கண்ணியமான நடை. עֵדָה மற்றும் קהל ஆகிய சொற்களின் வேறுபாட்டை முறையே ‘சபை’, ‘மக்களின் கூட்டம்’ என்று முடிந்தவரை காக்கிறது. வசனம் அடுத்த வசனத்துடன் தொடர்வதால் இறுதியில் நிபந்தனைத் தொடரைக் குறிக்கும் காற்புள்ளி வைக்கப்பட்டுள்ளது.
