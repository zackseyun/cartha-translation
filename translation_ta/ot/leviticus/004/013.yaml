  text: וְ/אִ֨ם כָּל עֲדַ֤ת יִשְׂרָאֵל֙ יִשְׁגּ֔וּ וְ/נֶעְלַ֣ם דָּבָ֔ר מֵ/עֵינֵ֖י הַ/קָּהָ֑ל וְ֠/עָשׂוּ אַחַ֨ת מִ/כָּל מִצְוֺ֧ת יְהוָ֛ה אֲשֶׁ֥ר לֹא תֵעָשֶׂ֖ינָה וְ/אָשֵֽׁמוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/013.yaml
  text: And if the whole congregation of Israel sins unintentionally[a], and the matter is hidden from the eyes of the assembly, and they do one of all the things that Yahweh has commanded not to be done, and they become guilty[d][c][b],
translation:
  language: ta
  text: “இஸ்ரவேலின் முழுச் சபையினரும் அறியாமல் பாவம் செய்து[a], அந்தக் காரியம் சபையாரின் கண்களுக்கு மறைவாக இருந்து[b], யாவே செய்யக்கூடாது என்று கட்டளையிட்ட செயல்களில் ஏதேனும் ஒன்றைச் செய்து, குற்றப்பொறுப்புக்கு ஆளாகி இருந்தால்,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு பயன்படுத்தப்பட்டுள்ள எபிரெய வினைச்சொல், வேண்டுமென்றே எதிர்த்து செய்த பாவத்தை அல்ல, அறியாமையினாலோ தவறுதலாகவோ செய்த பாவத்தைக் குறிக்கிறது.
    reason: cultural_note
  - marker: b
    text: “சபையாரின் கண்களுக்கு மறைவாக” என்பது, அந்தக் காரியம் சமூகத்தின் கவனத்திற்கு வராமல் போனதைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲדַת יִשְׂרָאֵל
  choice: இஸ்ரவேலின் முழுச் சபை
  rationale: עֵדָה என்பது முழு உடன்படிக்கைச் சமூகத்தைக் குறிக்கிறது. வழிபாட்டு-சட்டச் சூழலுக்கு ‘சபை’ பொருத்தமானது; பின்னர் வரும் קהל என்பதிலிருந்து வேறுபாடும் காக்கப்படுகிறது.
- source_word: יִשְׁגּוּ
  choice: அறியாமல் பாவம் செய்து
  rationale: שׁגה இச்சட்டச் சூழலில் வேண்டுமென்ற எதிர்ப்பை அல்ல, தவறுதலாக அல்லது அறியாமல் செய்த பாவத்தைக் குறிக்கிறது.
- source_word: וְנֶעְלַם דָּבָר
  choice: அந்தக் காரியம் ... மறைவாக இருந்து
  rationale: குற்றத்துக்குரிய காரியம் சமூகத்தால் உணரப்படாமல் போனது என்ற செயலற்ற வடிவத்தையும் பொருளையும் காக்கிறது.
- source_word: מֵעֵינֵי הַקָּהָל
  choice: மக்களின் கூட்டத்தின் கண்களுக்கு
  rationale: எபிரெய மொழியின் ‘கண்களிலிருந்து மறைதல்’ என்ற உணர்தல் சார்ந்த உருவகத்தைத் தக்கவைக்கிறது; קהל என்பதற்கு இயல்பான தமிழில் ‘மக்களின் கூட்டம்’ பயன்படுத்தப்படுகிறது.
- source_word: וְעָשׂוּ אַחַת מִכָּל מִצְוֺת
  choice: கட்டளையிட்டுள்ள எல்லாவற்றிலும் ஒன்றை அவர்கள் செய்து
  rationale: தடைசெய்யப்பட்ட செயல்களின் மொத்தத் தொகுதியிலிருந்து ஏதேனும் ஒன்றைச் செய்தார்கள் என்ற சட்டப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருப்பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் தெளிவான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֲשֶׁר לֹא תֵעָשֶׂינָה
  choice: செய்யக்கூடாது என்று
  rationale: செயலற்ற எபிரெய வடிவத்தின் தடைப் பொருளை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: וְאָשֵׁמוּ
  choice: குற்றவாளிகளானால்
  rationale: அச்செயலின் விளைவாகக் குற்றப்பொறுப்புக்கு உட்படும் நிலையைச் சுட்டுகிறது; பரிகாரத்தை முன்கூட்டியே பொருளில் சேர்க்கவில்லை.
theological_decisions:
- issue: שׁגה குறிக்கும் பாவத்தின் தன்மை
  choice: அறியாமல் பாவம் செய்தல்
  alternative: தவறிப்போதல் / தவறு செய்தல்
  rationale: லேவியராகமம் 4-இன் பலிச் சட்டம் துணிந்து செய்யப்படும் கலகத்தை அல்ல, அறியாமையினாலோ தவறுதலாகவோ நிகழும் மீறுதலைக் குறிக்கிறது.
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக இருப்பதால், அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: וְאָשֵׁמוּ என்பதன் குற்றநிலை
  choice: குற்றவாளிகளானால்
  alternative: குற்றத்தை உணர்ந்தால்
  rationale: வினைச்சொல் முதன்மையாக குற்றப்பொறுப்புக்கு ஆளான நிலையைச் சொல்கிறது; குற்றத்தைப் பின்னர் உணர்வது அடுத்த வசனத்தில் தனியாக வருகிறது.
