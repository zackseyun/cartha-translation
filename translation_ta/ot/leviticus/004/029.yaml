  text: וְ/סָמַךְ֙ אֶת יָד֔/וֹ עַ֖ל רֹ֣אשׁ הַֽ/חַטָּ֑את וְ/שָׁחַט֙ אֶת הַ֣/חַטָּ֔את בִּ/מְק֖וֹם הָ/עֹלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/029.yaml
  text: And he shall lay his hand on the head of the sin offering and slaughter the sin offering in the place of the burnt offering[a].
translation:
  language: ta
  text: அவன் தன் கையைப் பாவப் பலியின் தலையின்மேல் வைத்து, தகனபலியை அறுக்கும் இடத்தில் பாவப் பலியை அறுக்க வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தூய்மைப்படுத்தும் பலி.” எபிரெயச் சொல் חטאת பாவத்துடனும் தூய்மைப்படுத்துதலுடனும் தொடர்புடைய பலியைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָמַךְ
  choice: வைத்து
  rationale: பலிச் சடங்கின் சூழலில் סמך என்பது பலியின் தலையின்மேல் கையை வைப்பதைக் குறிக்கிறது; தமிழில் ‘கையை ... வைத்து’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: יָדוֹ
  choice: தன் கையை
  rationale: எபிரெயச் சொல் ஒருமையில் மூன்றாம் ஆண்பால் ஒருமை உருபுடன் உள்ளது; ஆகவே பன்மையாக்காமல் ‘தன் கையை’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: עַל רֹאשׁ
  choice: தலையின்மேல்
  rationale: சடங்கு நடவடிக்கையின் இடத்தைத் துல்லியமாகக் காட்டும் இயல்பான நேரடி மொழிபெயர்ப்பு.
- source_word: הַחַטָּאת
  choice: பாவநிவாரணப் பலி
  rationale: חטאת இங்கு பாவத்துடன் தொடர்புடைய குறிப்பிட்ட பலியைக் குறிக்கும் தொழில்நுட்பச் சொல். ‘பாவநிவாரணப் பலி’ என்பது தமிழில் பலியின் நோக்கத்தையும் வகையையும் தெளிவாகத் தெரிவிக்கிறது; ‘தூய்மைப்படுத்தும் பலி’ என்ற பொருள் வாய்ப்பை அடிக்குறிப்பு பாதுகாக்கிறது.
- source_word: וְשָׁחַט
  choice: அறுக்க வேண்டும்
  rationale: שחט என்பது பலிக்குரிய விலங்கைச் சடங்குமுறையில் அறுப்பதற்கான தொழில்நுட்ப வினை; ‘அறுக்க’ என்பது தமிழில் அந்தச் செயலை இயல்பாகக் குறிக்கிறது. சட்டவழிமுறையின் கட்டளைத் தன்மை ‘வேண்டும்’ என்பதால் வெளிப்படுகிறது.
- source_word: בִּמְקוֹם
  choice: இடத்தில்
  rationale: செயல் நடைபெற வேண்டிய நிர்ணயிக்கப்பட்ட இடத்தைக் குறிக்கும் நேரடியான தமிழ் வடிவம்.
- source_word: הָעֹלָה
  choice: தகனபலி
  rationale: עלה என்ற பலிச்சொல்லுக்கு தமிழில் நிலைபெற்ற, புரிந்துகொள்ளத்தக்க இணை ‘தகனபலி’; பலி முழுவதும் எரிக்கப்படுவதை இது குறிக்கிறது.
theological_decisions:
- issue: பலிச் சட்டத்தில் חטאת என்பதன் மொழிபெயர்ப்பு
  choice: பாவநிவாரணப் பலி
  alternative: தூய்மைப்படுத்தும் பலி
  rationale: இச்சூழலில் இச்சொல் ஒரு குறிப்பிட்ட பலிவகையைச் சுட்டுகிறது. ‘பாவநிவாரணப் பலி’ வாசகர்களுக்கு பரிச்சயமானதும் பாவத்துடனான தொடர்பைத் தெளிவாகக் காட்டுவதுமாகும்; அதேவேளையில் தூய்மைப்படுத்தும் செயல்பாட்டை வலியுறுத்தும் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: சட்ட-சடங்கு சூழலில் எபிரெய வினைவடிவத்தின் தமிழ் வெளிப்பாடு
  choice: வைத்து ... அறுக்க வேண்டும்
  alternative: வைத்தான் ... அறுத்தான்
  rationale: வடிவம் தொடர்நிகழ்ச்சிக் கதைநடையை ஒத்திருந்தாலும், இங்கு பலிச் சடங்குக்கான வழிமுறை அளிக்கப்படுகிறது. தமிழில் ‘வேண்டும்’ என்ற வடிவம் அதன் விதிமுறைத் தன்மையை இயல்பாக வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் dignified சட்ட-சடங்கு நடையில் மொழிபெயர்க்கப்பட்டது. தொழில்நுட்ப பலிச்சொற்கள் சுருக்கமாகவும் ஒரேவிதமாகவும் வைக்கப்பட்டுள்ளன; எபிரெய ஒருமையும் வழிமுறையின் கட்டளைத் தன்மையும் பாதுகாக்கப்பட்டுள்ளன.
