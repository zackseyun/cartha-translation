base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/028.yaml
  text: Or if the sin that he has committed is made known to him[b][a], then he shall bring as his offering for the sin that he has committed a female goat without blemish.
translation:
  language: ta
  text: அல்லது, அவன் செய்த பாவம் அவனுக்குத் தெரிவிக்கப்பட்டால்[a], அவன் தான் செய்த பாவத்திற்காகக் குறைபாடில்லாத ஒரு பெண் வெள்ளாட்டைத் தன் காணிக்கையாகக் கொண்டுவர வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அது அவனுக்குத் தெரியவந்தால்.’ எபிரெயச் செயப்பாட்டு வடிவம், அவன் தானாக அறிந்துகொள்வதையோ அவனுடைய பாவம் அவனுக்குத் தெரிவிக்கப்படுவதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: א֚וֹ
  choice: அல்லது
  rationale: முந்தைய சட்ட நிகழ்வுக்கு மாற்றான ஒரு சூழலை அறிமுகப்படுத்துகிறது; அடுத்து வரும் நிபந்தனை வாக்கியம் அதன் பொருளைத் தெளிவாக்குகிறது.
- source_word: הוֹדַע אֵלָיו
  choice: அவனுக்குத் தெரிவிக்கப்பட்டால்
  rationale: 'ידע என்பதன் ஹொஃபால் வடிவிலுள்ள செயப்பாட்டு/காரணச் செயப்பாட்டுப் பொருளைப் பாதுகாக்கிறது: பாவம் அவனுடைய அறிவுக்குக் கொண்டுவரப்படுகிறது.'
- source_word: חַטָּאתוֹ
  choice: அவன் செய்த பாவம்
  rationale: இங்கு חטאת என்பது பலியைக் குறிக்காமல், அவன் செய்த பாவச் செயலையே குறிக்கிறது.
- source_word: אֲשֶׁר חָטָא
  choice: அவன் செய்த
  rationale: ‘பாவம் செய்தல்’ என்ற இயல்பான தமிழ்ப் பயன்பாட்டில் எபிரெய வினைத்தொடரின் பொருளைத் தருகிறது.
- source_word: וְהֵבִיא
  choice: கொண்டுவர வேண்டும்
  rationale: சட்ட அறிவுறுத்தலில் தொடரும் கட்டாயச் செயலை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: קָרְבָּנוֹ
  choice: தன் காணிக்கையாக
  rationale: அர்ப்பணிப்பதற்காகக் கொண்டுவரப்படும் பொருள் என்ற קרבן சொல்லின் பலியிடல் சார்ந்த பொருளைத் தெளிவாகத் தருகிறது.
- source_word: שְׂעִירַת עִזִּים ... נְקֵבָה
  choice: ஒரு பெண் வெள்ளாடு
  rationale: விலங்கின் இனத்தையும் பெண்பாலையும் நவீன தமிழில் தெளிவாகக் குறிப்பிடுகிறது; மூலத்தில் பெண்பால் இருமுறை உறுதிப்படுத்தப்படுவது தமிழில் ஒருமுறை இயல்பாகச் சொல்லப்படுகிறது.
- source_word: תְּמִימָה
  choice: குறைபாடில்லாத
  rationale: பலிக்குரிய விலங்கு உடற்குறையின்றி இருக்க வேண்டும் என்ற வழிபாட்டுச் சூழலின் நிலையான பொருளை வழங்குகிறது.
- source_word: עַל חַטָּאתוֹ אֲשֶׁר חָטָא
  choice: தான் செய்த பாவத்திற்காக
  rationale: עַל இங்கு காணிக்கைக்கும் பாவத்திற்கும் உள்ள காரண/நோக்க உறவைச் சுட்டுகிறது; ‘பாவத்திற்காக’ என்பது அதை மிகையாக விளக்காமல் இயல்பாகத் தருகிறது.
theological_decisions:
- issue: சட்ட-தூய்மைப்படுத்தல் சூழலில் חַטָּאתוֹ என்பதன் பொருள்
  choice: இரு இடங்களிலும் ‘பாவம்’ என்று மொழிபெயர்த்தல்
  alternative: பின்னைய இடத்தில் ‘பாவநிவாரண பலி’ என்று மொழிபெயர்த்தல்
  rationale: இந்த வசனத்தில் காணிக்கையே קָרְבָּנוֹ என்றும், அது பெண் வெள்ளாடு என்றும் தனியாக அடையாளப்படுத்தப்படுகிறது. ஆகவே மீண்டும் வரும் חַטָּאתוֹ, காணிக்கையைக் குறிக்காமல் அது கொண்டுவரப்படுவதற்குக் காரணமான பாவத்தைக் குறிக்கிறது.
- issue: הוֹדַע אֵלָיו குறிக்கும் அறிவடைதலின் முறை
  choice: ‘அவனுக்குத் தெரிவிக்கப்பட்டால்’ என்று செயப்பாட்டு வடிவைப் பாதுகாத்தல்
  alternative: ‘அவன் உணர்ந்துகொண்டால்’ அல்லது ‘அவனுக்குத் தெரியவந்தால்’
  rationale: மூலம் அவன் தனிப்பட்ட முறையில் உணர்ந்தானா அல்லது வேறொருவர் அவனுக்குத் தெரிவித்தாரா என்பதை முற்றிலும் தீர்மானிக்கவில்லை. முதன்மை உரை செயப்பாட்டுப் பொருளைத் தக்கவைத்து, அடிக்குறிப்பு மற்ற சாத்தியத்தைச் சுட்டுகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘குறைபாடில்லாத’, ‘காணிக்கை’ ஆகிய சொற்கள் லேவியராகமத்தின் பலியிடல் சூழலைத் தக்கவைக்கின்றன; எபிரெயத்தின் நீண்ட மீளுரைப்பும் தமிழில் பொருள் இழக்காமல் இயல்பாக அமைக்கப்பட்டுள்ளது.
