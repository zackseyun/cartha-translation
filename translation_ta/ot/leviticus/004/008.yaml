  text: וְ/אֶת כָּל חֵ֛לֶב פַּ֥ר הַֽ/חַטָּ֖את יָרִ֣ים מִמֶּ֑/נּוּ אֶת הַ/חֵ֨לֶב֙ הַֽ/מְכַסֶּ֣ה עַל הַ/קֶּ֔רֶב וְ/אֵת֙ כָּל הַ/חֵ֔לֶב אֲשֶׁ֖ר עַל הַ/קֶּֽרֶב־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/008.yaml
  text: 'And he shall remove from it all the fat of the sin offering bull: the fat that covers the entrails and all the fat that is on the entrails,[a]'
translation:
  language: ta
  text: 'பாவநிவாரணப் பலிக்குரிய காளையின் கொழுப்பு முழுவதையும் அவன் அதிலிருந்து பிரித்தெடுக்க வேண்டும்: உள்ளுறுப்புகளை மூடியிருக்கும் கொழுப்பையும், உள்ளுறுப்புகளின் மேல் இருக்கும் கொழுப்பு முழுவதையும்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தூய்மைப்படுத்தும் பலிக்குரிய காளை.” எபிரெயச் சொல் חַטָּאת என்பது “பாவம்” என்பதையும், பாவத்தையோ தீட்டையோ நீக்குவதோடு தொடர்புடைய பலியையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: முழுவதையும்
  rationale: எபிரெயச் சொல்லின் முழுமையைக் குறிக்கும் வலிமையைத் தக்கவைக்கிறது.
- source_word: חֵלֶב
  choice: கொழுப்பு
  rationale: பலியிடும் சடங்கில் குறிப்பிட்ட கொழுப்புப் பகுதிகளைக் குறிக்கிறது; தொடரும் உடற்கூறு விளக்கங்கள் அதன் பொருளைத் தெளிவாக்குகின்றன.
- source_word: פַּר הַחַטָּאת
  choice: பாவநிவாரணப் பலிக்குரிய காளை
  rationale: காளை இந்தப் பலிக்காக நியமிக்கப்பட்டது என்ற இணைப்பை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: יָרִים
  choice: பிரித்தெடுக்க வேண்டும்
  rationale: அடிப்படைப் பொருள் ‘உயர்த்துதல்’ என்றாலும், இப்பலிச் சடங்கில் உடலிலிருந்து குறிப்பிட்ட பகுதிகளை அகற்றிப் பிரிக்கும் செயலைக் குறிக்கிறது.
- source_word: מִמֶּנּוּ
  choice: அதிலிருந்து
  rationale: இங்கு சடங்கிற்காக அறுக்கப்பட்ட காளையைக் குறிக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: הַמְכַסֶּה
  choice: மூடியிருக்கும்
  rationale: கொழுப்பின் அமைவிடத்தையும் செயலையும் விவரிக்கும் எபிரெயப் பெயரெச்சத்தின் பொருளை இயல்பாகக் கொடுக்கிறது.
- source_word: קֶּרֶב
  choice: குடல்கள்
  rationale: பலிக்குரிய உடற்கூறு சூழலில் உள்ளுறுப்புகளின் குடல் பகுதியை வாசகருக்குப் புரியும் தெளிவான தமிழில் குறிக்கிறது.
- source_word: אֲשֶׁר עַל הַקֶּרֶב
  choice: குடல்களின்மேல் இருக்கும்
  rationale: עַל என்பதன் இடத்தொடர்பைத் தக்கவைத்து, குடல்களை மூடும் கொழுப்பிலிருந்து குடல்களின்மேல் அமைந்துள்ள கொழுப்பை வேறுபடுத்துகிறது.
theological_decisions:
- issue: பலிச் சூழலில் חַטָּאת என்பதன் மொழிபெயர்ப்பு
  choice: பாவநிவாரணப் பலி
  alternative: தூய்மைப்படுத்தும் பலி
  rationale: חַטָּאת என்பது ‘பாவம்’ என்பதையும், பாவம் அல்லது தீட்டுடன் தொடர்புடைய நிலையை நீக்கும் பலியையும் குறிக்கலாம். வழக்கில் புரியத்தக்க ‘பாவநிவாரணப் பலி’ முதன்மை உரையில் வைக்கப்பட்டு, சடங்கின் தூய்மைப்படுத்தும் நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சடங்கு வழிமுறைக்கேற்ற கண்ணியமான கட்டளைநடை பயன்படுத்தப்பட்டுள்ளது. ‘பிரித்தெடுக்க வேண்டும்’ என்பது செயலைத் தெளிவுபடுத்துகிறது; இரண்டாம் கூறிலும் அதை மீண்டும் வழங்குவது தமிழில் வாக்கியத்தை முழுமையாக்குகிறது.
