source:
  edition: WLC
  text: וְ/נָתַן֩ הַ/כֹּהֵ֨ן מִן הַ/דָּ֜ם עַל קַ֠רְנוֹת מִזְבַּ֨ח קְטֹ֤רֶת הַ/סַּמִּים֙ לִ/פְנֵ֣י יְהוָ֔ה אֲשֶׁ֖ר בְּ/אֹ֣הֶל מוֹעֵ֑ד וְ/אֵ֣ת כָּל דַּ֣ם הַ/פָּ֗ר יִשְׁפֹּךְ֙ אֶל יְסוֹד֙ מִזְבַּ֣ח הָ/עֹלָ֔ה אֲשֶׁר פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/007.yaml
  text: And the priest shall put some of the blood on the horns of the altar of fragrant incense before Yahweh[a], which is in the tent of meeting, and he shall pour out all the bull’s blood at the base of the altar of burnt offering[b], which is at the entrance of the tent of meeting.
translation:
  language: ta
  text: ஆசாரியன் இரத்தத்தில் சிறிதைச் சந்திப்புக்கூடாரத்தில் யாவேயின் முன்னிலையில் இருக்கும் நறுமணத் தூபப் பலிபீடத்தின் கொம்புகளின்மேல் பூச வேண்டும். காளையின் இரத்தம் முழுவதையும்[a] அவன் சந்திப்புக்கூடாரத்தின் நுழைவாயிலில் இருக்கும் தகனபலிக்கான பலிபீடத்தின் அடிப்பகுதியில் ஊற்ற வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்கு சொல், “காளையின் இரத்தம் அனைத்தையும்.” பலிபீடத்தின் கொம்புகள்மேல் ஏற்கெனவே சிறிது இரத்தம் பூசப்பட்டிருப்பதால், இங்கு மீதமுள்ள இரத்தம் அனைத்தும் கருத்தில் கொள்ளப்படுகிறது.
    reason: contextual_clarification
lexical_decisions:
- source_word: וְנָתַן
  choice: பூச வேண்டும்
  rationale: נתן என்பதன் அடிப்படைப் பொருள் ‘வைக்க/இட’; ஆனால் இரத்தத்தைப் பலிபீடத்தின் கொம்புகள்மேல் இடும் இந்தச் சடங்குச் சூழலில் ‘பூச வேண்டும்’ என்பது செயலை இயல்பாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: מִן הַדָּם
  choice: இரத்தத்தில் சிறிதை
  rationale: מן இங்கு பகுதியைக் குறிக்கிறது; முழு இரத்தத்திலிருந்து ஒரு பகுதி பயன்படுத்தப்படுவதை இச்சொற்றொடர் தெளிவாக்குகிறது.
- source_word: קַרְנוֹת
  choice: கொம்புகள்
  rationale: பலிபீடத்தின் மேலெழுந்த மூலைப்பகுதிகளுக்கான எபிரெய வழிபாட்டுச் சொல்லை நேரடியாகப் பாதுகாக்கிறது.
- source_word: מִזְבַּח קְטֹרֶת הַסַּמִּים
  choice: நறுமணத் தூபப் பலிபீடம்
  rationale: קְטֹרֶת என்பது தூபத்தையும் הַסַּמִּים என்பது நறுமணப் பொருட்களையும் சுட்டுகிறது; தமிழில் சுருக்கமாகவும் விளக்கமாகவும் உள்ளது.
- source_word: לִפְנֵי יְהוָה
  choice: யாவேக்கு முன்பாக
  rationale: இடம்சார்ந்த வழிபாட்டுப் பொருளைப் பாதுகாத்து, יהוה என்ற தனிப்பெயரை ‘யாவே’ என ஒலிபெயர்க்கிறது.
- source_word: אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரம்
  rationale: இஸ்ரவேலின் வழிபாட்டில் தேவன் சந்திக்கும் கூடாரத்தைக் குறிக்கும் நிலையான, புரிந்துகொள்ளத்தக்க தமிழ் வடிவம்.
- source_word: כָּל דַּם הַפָּר
  choice: காளையின் இரத்தம் முழுவதையும்
  rationale: எபிரெய உரையின் ‘காளையின் இரத்தம் அனைத்தையும்’ என்ற வெளிப்பாட்டை நேரடியாகப் பாதுகாக்கிறது; முன்பு சிறிது பயன்படுத்தப்பட்டதால் எழும் சூழல்சார் விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: יִשְׁפֹּךְ
  choice: ஊற்ற வேண்டும்
  rationale: שׁפך குறிக்கும் திரவத்தை ஊற்றும் செயலை இயல்பான தமிழில் துல்லியமாகத் தெரிவிக்கிறது.
- source_word: אֶל יְסוֹד
  choice: அடிப்பகுதியில்
  rationale: יְסוֹד என்பது பலிபீடத்தின் அடித்தளம் அல்லது அடிப்பகுதியைக் குறிக்கிறது; இரத்தம் ஊற்றப்படும் இடத்தை இயல்பாகச் சொல்கிறது.
- source_word: מִזְבַּח הָעֹלָה
  choice: தகனபலிப் பலிபீடம்
  rationale: முழுவதுமாக எரிக்கப்படும் עֹלָה பலிக்குரிய பலிபீடம் என்பதை வழிபாட்டுச் சொல்லாக்கத்துடன் துல்லியமாகக் காட்டுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைபெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரையில் பட்டப்பெயர் அல்ல, יהוה என்ற தனிப்பெயரே உள்ளது; அதனால் அதைத் தமிழ் ஒலியமைப்பில் ‘யாவே’ எனப் பாதுகாக்கிறது.
- issue: முன்னர் சிறிது இரத்தம் பயன்படுத்தப்பட்ட பின் כָּל דַּם הַפָּר என்பதன் பொருள்
  choice: காளையின் இரத்தம் முழுவதையும்
  alternative: காளையின் மீதமுள்ள இரத்தம் முழுவதையும்
  rationale: ‘மீதமுள்ள’ என்பது சூழலால் உணரப்பட்டாலும் எபிரெய உரையில் வெளிப்படையாக இல்லை. ஆகவே மூலத்தின் வடிவம் பிரதான உரையில் பாதுகாக்கப்பட்டு, சூழல்சார் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘பலிபீடத்தின் கொம்புகள்’, ‘தகனபலி’ போன்ற மூலப் பண்பாட்டுச் சொற்கள் தக்கவைக்கப்பட்டுள்ளன; தேவையற்ற சமயப்பிரிவு சார்ந்த சொல்லாக்கம் தவிர்க்கப்பட்டுள்ளது.
