base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/020.yaml
  text: He shall do with the bull just as he did with the bull of the sin offering; so he shall do with it. And the priest shall make atonement for them[a], and they shall be forgiven.
translation:
  language: ta
  text: பாவநிவாரணப் பலிக்கான[a] காளைக்கு அவன் செய்தது போலவே இந்தக் காளைக்கும் செய்ய வேண்டும்; இதற்கும் அவன் அப்படியே செய்ய வேண்டும். ஆசாரியன் அவர்களுக்காகப் பாவநிவிர்த்தி செய்வான்; அவர்கள் மன்னிக்கப்படுவார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தூய்மைப்படுத்தும் பலி.” இதற்கான எபிரெயச் சொல், பாவத்தால் ஏற்பட்ட மாசை நீக்கித் தூய்மைப்படுத்தும் பலியைக் குறிக்கவும் முடியும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשָׂה לַפָּר
  choice: இந்தக் காளைக்கும் செய்ய வேண்டும்
  rationale: עשה உடன் வரும் ל இங்கு காளையின் மீது செய்யப்படும் சடங்கு நடவடிக்கையைக் குறிக்கிறது. தமிழில் ‘காளைக்கும் செய்ய வேண்டும்’ என்பது இயல்பாகவும் நடைமுறை அறிவுறுத்தலின் வலிமையுடனும் அமைகிறது.
- source_word: כַּאֲשֶׁר עָשָׂה
  choice: அவன் செய்தது போலவே
  rationale: כַּאֲשֶׁר வெளிப்படையான ஒப்புமையைக் குறிக்கிறது; ‘போலவே’ முந்தைய சடங்கு முறையோடு உள்ள துல்லியமான ஒற்றுமையைப் பேணுகிறது.
- source_word: לְפַר הַחַטָּאת
  choice: பாவநிவாரணப் பலிக்கான காளைக்கு
  rationale: இது முன்பு விவரிக்கப்பட்ட பலிக்குரிய காளையை அடையாளப்படுத்துகிறது. ‘பாவநிவாரணப் பலி’ என்பது பாவத்தைக் கையாளும் பலி என்ற பொருளைத் தெளிவாகவும் தமிழில் வழக்கமான சமயச் சொல்லாட்சியுடனும் தருகிறது.
- source_word: הַחַטָּאת
  choice: பாவநிவாரணப் பலி
  rationale: חטאת என்பது பாவத்தையும், பாவத்தால் ஏற்பட்ட மாசை நீக்கும் பலியையும் குறிக்கக்கூடும். பிரதான உரையில் பரவலாகப் புரிந்துகொள்ளப்படும் ‘பாவநிவாரணப் பலி’ வைக்கப்பட்டு, ‘தூய்மைப்படுத்தும் பலி’ என்ற பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: כֵּן יַעֲשֶׂה לּוֹ
  choice: இதற்கும் அவன் அப்படியே செய்ய வேண்டும்
  rationale: כֵּן ஒத்த முறையைக் குறிக்கிறது. எபிரெய உரையின் வலியுறுத்தும் மறுபடியுரைத்தலை நீக்காமல், தமிழில் தெளிவாகப் பேணுகிறது.
- source_word: וְכִפֶּר עֲלֵהֶם הַכֹּהֵן
  choice: ஆசாரியன் அவர்களுக்காகப் பாவநிவிர்த்தி செய்வான்
  rationale: כפר என்ற முக்கிய பலிசார் சொல்லுக்கு ‘பாவநிவிர்த்தி செய்வான்’ என வழங்கப்பட்டுள்ளது; עליהם பயன் பெறுபவர்களைக் குறிப்பதால் ‘அவர்களுக்காக’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְנִסְלַח לָהֶם
  choice: அவர்கள் மன்னிக்கப்படுவார்கள்
  rationale: סלח என்பதன் நிபால் வடிவம் மன்னிப்பு வழங்கப்படும் விளைவை வெளிப்படுத்துகிறது. தமிழ் தனிப்பட்ட செயப்பாட்டு வடிவம் இதைத் தெளிவாகத் தருகிறது.
theological_decisions:
- issue: பலிசார் சட்டத்தில் חטאת என்பதன் மொழிபெயர்ப்பு
  choice: பாவநிவாரணப் பலி
  alternative: தூய்மைப்படுத்தும் பலி
  rationale: இச்சொல் தீர்க்கப்படும் பாவத்தையும் நிகழ்த்தப்படும் தூய்மைப்படுத்தலையும் சுட்டலாம். எந்த ஓர் அம்சத்தையும் முற்றிலும் ஒழிக்காமல், பொதுவாகப் புரிந்துகொள்ளப்படும் வாசகம் பிரதான உரையிலும் உண்மையான மாற்றுப் பொருள் அடிக்குறிப்பிலும் வைக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பான, கண்ணியமான பலிசார் மொழிநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய உரையிலுள்ள செய்முறை மறுபடியுரைத்தல் சுருக்கப்படாமல் பேணப்பட்டுள்ளது; ‘செய்ய வேண்டும்’ என்பது சட்ட அறிவுறுத்தலின் வலிமையை இயல்பாக வெளிப்படுத்துகிறது.
