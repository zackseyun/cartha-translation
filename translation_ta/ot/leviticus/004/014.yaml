source:
  edition: WLC
  text: וְ/נֽוֹדְעָה֙ הַֽ/חַטָּ֔את אֲשֶׁ֥ר חָטְא֖וּ עָלֶ֑י/הָ וְ/הִקְרִ֨יבוּ הַ/קָּהָ֜ל פַּ֤ר בֶּן בָּקָר֙ לְ/חַטָּ֔את וְ/הֵבִ֣יאוּ אֹת֔/וֹ לִ/פְנֵ֖י אֹ֥הֶל מוֹעֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/014.yaml
  text: and the sin that they committed becomes known[a], then the assembly shall present a bull, a son of the herd, as a sin offering and bring it before the tent of meeting.
translation:
  language: ta
  text: அவர்கள் செய்த பாவம் தெரியவந்தால்[a], சபை பாவப்பலியாக மாட்டினத்தைச் சேர்ந்த ஒரு காளையைச் செலுத்தி, அதைச் சந்திப்புக் கூடாரத்தின் முன்னிலையில் கொண்டுவர வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில் חַטָּאת (ḥaṭṭāʾt) என்ற ஒரே சொல் இவ்வசனத்தில் இருமுறை வருகிறது: முதலில் ‘பாவம்’ என்றும், பின்னர் ‘பாவப்பலி’ என்றும் பொருள்படுகிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנֽוֹדְעָה
  choice: தெரியவந்தால்
  rationale: ידע என்பதன் நிஃபால் வடிவம் இங்கு பாவம் அறியப்படுவதையோ வெளிச்சத்துக்கு வருவதையோ குறிக்கிறது; அதை நிகழ்த்தும் நபரைச் சுட்டாமல் இயல்பான தமிழில் கூறுகிறது.
- source_word: הַחַטָּאת
  choice: பாவம்
  rationale: ‘அவர்கள் செய்த’ என்ற தொடர்புரை இதை பலியாக அல்ல, அவர்கள் செய்த பாவமாக அடையாளப்படுத்துகிறது.
- source_word: אֲשֶׁר חָטְאוּ עָלֶיהָ
  choice: அவர்கள் செய்த
  rationale: எந்தப் பாவம் தெரியவந்தது என்பதை இயல்பான தமிழில் தெளிவுபடுத்துகிறது; על என்னும் முன்னிடைச்சொல்லை செயற்கையாகத் தனியே மொழிபெயர்க்கவில்லை.
- source_word: הַקָּהָל
  choice: சபையார்
  rationale: கூட்டாகப் பொறுப்பேற்கும் இஸ்ரவேல் மக்களின் சபையைச் சுருக்கமாகவும் மரியாதையாகவும் குறிக்கிறது; திருச்சபை என்ற பிற்காலச் சிறப்புப் பொருளைச் சேர்க்கவில்லை.
- source_word: וְהִקְרִיבוּ
  choice: செலுத்தி
  rationale: קרב என்பதன் ஹிஃபில் வடிவம் பலிசார் சூழலில் பலியை முன்வைத்துச் செலுத்துவதைக் குறிக்கிறது; அடுத்து வரும் ‘கொண்டுவர’ என்பதுடன் தேவையற்ற மறுபடிவைத் தவிர்க்கிறது.
- source_word: פַּר בֶּן בָּקָר
  choice: மாட்டு மந்தையிலிருந்து ஒரு காளை
  rationale: ‘காளை, மாட்டினத்தின் மகன்’ என்ற எபிரெயச் சொற்றொடரின் கால்நடை வகையையும் ஆண் விலங்கையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לְחַטָּאת
  choice: பாவநிவாரணப் பலியாக
  rationale: இரண்டாம் חטאת இங்கு பலிவகையைக் குறிக்கிறது. ‘பாவநிவாரணப் பலி’ என்பது முதல் ‘பாவம்’ என்பதிலிருந்து இதைத் தெளிவாக வேறுபடுத்தும் வழக்கமான தமிழ்ச் சொல்.
- source_word: וְהֵבִיאוּ אֹתוֹ
  choice: அதைக் கொண்டுவர வேண்டும்
  rationale: בוא என்பதன் ஹிஃபில் வடிவம் காளையை குறிப்பிட்ட இடத்திற்குக் கொண்டுவருவதை நேரடியாகக் குறிக்கிறது.
- source_word: לִפְנֵי אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரத்தின் முன்னிலையில்
  rationale: אהל מועד என்பதன் சொற்பொருளான சந்திப்பு/நியமிக்கப்பட்ட சந்திப்பின் கூடாரம் என்பதையும், לפני என்பதன் வழிபாட்டிட நிலைப்பொருளையும் காக்கிறது.
theological_decisions:
- issue: חטאת என்ற ஒரே எபிரெயச் சொல் இவ்வசனத்தில் இரு பொருள்களில் வருதல்
  choice: முதல் இடத்தில் ‘பாவம்’; இரண்டாம் இடத்தில் ‘பாவநிவாரணப் பலி’
  alternative: இரண்டையும் ஒரே சொல்லால் ‘பாவம்’ அல்லது ‘பாவப்பலி’ என மொழிபெயர்த்தல்
  rationale: முதல் சொல்லுடன் வரும் ‘அவர்கள் செய்த’ என்ற தொடர்புரை குற்றச் செயலைக் குறிக்கிறது; לְחַטָּאת என்பது பலியின் நோக்கம் அல்லது வகையைச் சுட்டுகிறது. சூழல் நிர்ணயிக்கும் இவ்விரு பொருள்களையும் வேறுபடுத்துவது வசனத்தைத் தெளிவாக்குகிறது; ஒரே மூலச்சொல் பயன்படுத்தப்பட்டதை அடிக்குறிப்பு தெரிவிக்கிறது.
- issue: וְנֽוֹדְעָה என்பதில் அறியச் செய்தவர் குறிப்பிடப்படாமை
  choice: ‘தெரியவந்தால்’ என்று முகவரற்ற வடிவில் மொழிபெயர்த்தல்
  alternative: ‘அது அவர்களுக்குத் தெரிவிக்கப்பட்டால்’ என்று தெரிவிப்பவரையோ பெறுபவரையோ வெளிப்படையாகச் சேர்த்தல்
  rationale: எபிரெய நிஃபால் வடிவம் பாவம் அறியப்படுவதை மட்டும் கூறுகிறது; அதை யார் அறிவித்தார் அல்லது முதலில் யாருக்குத் தெரிந்தது என்பதைத் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், வழிபாட்டுச் சட்டத்துக்குரிய கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டது. ‘சந்திப்புக் கூடாரம்’ மூலச்சொல்லின் உருவகத்தைத் தக்கவைக்கிறது; ‘பாவநிவாரணப் பலி’ பலிவகையைச் சாதாரண வாசகனுக்குத் தெளிவாக்குகிறது. அடிக்குறிப்பு குறியீடு முதற்பொருள் வேறுபாடு வெளிப்படும் இடத்தில் இணைக்கப்பட்டுள்ளது.
