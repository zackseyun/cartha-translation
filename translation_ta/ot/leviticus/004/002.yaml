base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/002.yaml
  text: 'Speak to the sons of Israel[a], saying: If a person sins unintentionally in regard to any of the commandments of Yahweh concerning things that should not be done, and does one of them[b],'
translation:
  language: ta
  text: '“இஸ்ரவேல் மக்களிடம்[a] சொல்: ‘யாவே செய்யக்கூடாது என்று கட்டளையிட்டுள்ள காரியங்களில் ஏதேனும் ஒன்றை ஒருவர் அறியாமல்[b] செய்து பாவம் செய்தால்,’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “இஸ்ரவேலின் பிள்ளைகளிடம்” அல்லது “இஸ்ரவேலர்களிடம்”; எபிரேயத்தில் சொல்லுக்குச் சொல், “இஸ்ரவேலின் மகன்களிடம்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது “தவறுதலாக” அல்லது “பிழையாக”; எபிரேயச் சொல், வேண்டுமென்றோ துணிகரமாகவோ அல்லாமல் கவனக்குறைவால் அல்லது தவறுதலால் செய்யப்பட்ட பாவத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: நீ சொல்
  rationale: நேரடியான இறைக் கட்டளையைக் குறிக்கும் வினைமுற்று; நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: சொல்லுக்குச் சொல் பொருள் ‘இஸ்ரவேலின் மகன்கள்’; இங்கு முழு உடன்படிக்கைச் சமூகத்தையும் குறிக்கும் என்பதால் இயல்பான தமிழில் ‘இஸ்ரவேல் மக்கள்’ என வழங்கி, நேரடிப் பொருளை அடிக்குறிப்பில் தக்கவைத்துள்ளது.
- source_word: נֶפֶשׁ
  choice: ஒருவர்
  rationale: இச்சட்டச் சூழலில் נֶפֶשׁ உடலற்ற ‘ஆத்துமா’ என்பதை வலியுறுத்தாமல், ஒரு தனிநபரைக் குறிக்கிறது.
- source_word: תֶחֱטָא
  choice: மீறி
  rationale: பாவம் செய்வதைத் தொடர்ந்து வரும் கட்டளைகளின் மீறலோடு இணைத்து, தமிழில் ஒரே இயல்பான நிபந்தனை வாக்கியமாக வழங்குகிறது.
- source_word: בִשְׁגָגָה
  choice: அறியாமல்
  rationale: வேண்டுமென்றோ துணிகரமாகவோ அல்லாமல், கவனக்குறைவு அல்லது தவறுதலால் நிகழ்ந்த மீறலைக் குறிக்கிறது.
- source_word: מִכֹּל מִצְוֺת יְהוָה
  choice: யாவேயின் கட்டளைகளில் எதையேனும்
  rationale: מן அமைப்பு இங்கு கட்டளைகளில் ஏதேனும் ஒன்றைப் பொறுத்தவரை நிகழும் மீறலைக் குறிக்கிறது; ‘எதையேனும்’ அதன் பரந்த சட்டப் பொருளைத் தக்கவைக்கிறது.
- source_word: אֲשֶׁר לֹא תֵעָשֶׂינָה
  choice: செய்யக்கூடாதவை பற்றிய
  rationale: தடைசெய்யப்பட்ட செயல்களைப் பற்றிய கட்டளைகள் என்பதைக் கூறும் எபிரேயச் சார்பு வாக்கியத்தின் செயப்படுபொருளற்ற வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְעָשָׂה מֵאַחַת מֵהֵנָּה
  choice: அவற்றில் ஒன்றைச் செய்தால்
  rationale: முன்னர் கூறப்பட்ட தடைசெய்யப்பட்ட காரியங்களில் ஒன்றை நபர் உண்மையில் செய்வதைச் சுருக்கமாகவும் தெளிவாகவும் குறிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் உடன்படிக்கைப் பெயரான நான்கெழுத்து இறைப் பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டப்பெயராக மாற்றாமல், ‘Yahweh’ என்பதற்குரிய நவீன தமிழ் ஒலிபெயர்ப்பான ‘யாவே’ என வழங்குகிறது.
- issue: அறியாமல் செய்யப்பட்ட பாவத்தின் தன்மை
  choice: வேண்டுமென்றே செய்யாத, தவறுதலான மீறல்
  alternative: எந்தவித அறியாமையும் குற்றப்பொறுப்பை முற்றிலும் நீக்குகிறது
  rationale: בִשְׁגָגָה துணிகரமான அல்லது எதிர்ப்புணர்வுள்ள பாவத்துக்கு மாறாகத் தவறுதலான பாவத்தைக் குறிக்கிறது; இருப்பினும் இவ்வசனம் அதைப் பாவமாகவே கருதுவதால் அதன் இறையியல் அழுத்தம் தக்கவைக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சட்டவிதிக்குரிய கண்ணியத்தையும் தொடரும் நிபந்தனை வாக்கியத்தின் திறந்த முடிவையும் தக்கவைத்துள்ளது. ‘நீ சொல்’ நேரடியான இறைக் கட்டளையை வெளிப்படுத்துகிறது; வசன முடிவிலுள்ள காற்புள்ளி அடுத்த வசனத்தில் நிபந்தனை தொடர்வதைக் காட்டுகிறது.
