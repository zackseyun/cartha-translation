source:
  edition: WLC
  text: וְ/אֵ֥ת כָּל חֶלְבּ֖/וֹ יָרִ֣ים מִמֶּ֑/נּוּ וְ/הִקְטִ֖יר הַ/מִּזְבֵּֽחָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/019.yaml
  text: And he shall remove all its fat from it and burn it on the altar[a].
translation:
  language: ta
  text: அதன் கொழுப்பு முழுவதையும் அதிலிருந்து எடுத்து, அதை பலிபீடத்தின்மேல் புகையாக்க வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “பலிபீடத்தின்மேல் அதை எரிக்க வேண்டும்.” எபிரெய வினைச்சொல், பலிச் சூழலில் ஒரு காணிக்கையைப் புகையாக எழும்பச் செய்வதைச் சிறப்பாகக் குறிக்கிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵת
  choice: மேலும் தனியே மொழிபெயர்க்காமல் தொடர்ச்சியாக இணைத்தல்
  rationale: இந்த இணைப்புச்சொல் முந்தைய சடங்கு நடவடிக்கையுடன் இச்செயலைத் தொடர்ச்சியாக இணைக்கிறது; தமிழில் வாக்கிய ஓட்டமே அந்தத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כָּל
  choice: முழுவதையும்
  rationale: குறிப்பிடப்பட்ட கொழுப்பில் ஒரு பகுதியை மட்டும் அல்ல, அதன் முழுமையையும் எடுக்க வேண்டும் என்ற பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: חֶלְבּוֹ
  choice: அதன் கொழுப்பு
  rationale: ஆண்பால் ஒருமை பின்னொட்டு பலியிடப்படும் விலங்கைக் குறிக்கிறது; தமிழில் உயிரற்ற அல்லது விலங்கு சார்ந்த இந்தக் குறிப்புக்கு ‘அதன்’ இயல்பானது. ‘கொழுப்பு’ லேவியராகமத்தின் பலிச் சூழலுக்குரிய வழக்கமான சொல்.
- source_word: יָרִים
  choice: எடுத்து
  rationale: רוּם என்பதன் ஹிஃபில் வடிவம் உயர்த்துதல் அல்லது அகற்றுதல் என்ற அடிப்படையை உடையது; இங்கு விலங்கிலிருந்து கொழுப்பை எடுத்துப் பிரிக்கும் சடங்கு நடவடிக்கையை ‘எடுத்து’ இயல்பாகத் தெரிவிக்கிறது.
- source_word: מִמֶּנּוּ
  choice: அதிலிருந்து
  rationale: பலியிடப்படும் விலங்கிலிருந்து கொழுப்பு பிரிக்கப்படுவதைத் துல்லியமாகக் காட்டுகிறது.
- source_word: וְהִקְטִיר
  choice: புகையாக எழும்பச் செய்ய வேண்டும்
  rationale: הקטיר என்பது சாதாரணமாக எரிப்பதை மட்டும் அல்லாமல், பலிப்பொருளை பலிபீடத்தில் புகையாக எழும்பச் செய்வதைக் குறிக்கும் ஆசாரியச் சொல். இந்தத் தமிழ் வடிவம் அதன் பலிசார் நுட்பத்தைப் பாதுகாக்கிறது.
- source_word: הַמִּזְבֵּחָה
  choice: பலிபீடத்தின்மேல்
  rationale: திசை நோக்கைக் குறிக்கும் முடிவு இருந்தாலும், הקטיר உடன் இங்கு பலிப்பொருள் புகையாக்கப்படும் இடமாகப் பலிபீடம் குறிக்கப்படுகிறது; தமிழில் ‘பலிபீடத்தின்மேல்’ இயல்பும் துல்லியமும் உடையது.
