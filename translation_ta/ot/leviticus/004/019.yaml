translation_notes:
  register: நவீன தரநிலைத் தமிழில், சடங்கு சார்ந்த கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டது. ‘புகையாக எழும்பச் செய்ய வேண்டும்’ என்பது சற்றே முறையானதாக இருந்தாலும் எபிரெய வினையின் பலிசார் சிறப்புப் பொருளைப் பாதுகாக்கிறது; பொதுவான ‘எரிக்க வேண்டும்’ என்பது அடிக்குறிப்பில் மாற்றாக வழங்கப்பட்டுள்ளது.
