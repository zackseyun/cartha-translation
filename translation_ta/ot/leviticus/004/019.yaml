revisions:
- from: அதன் கொழுப்பு முழுவதையும் அதிலிருந்து எடுத்து, பலிபீடத்தின்மேல் புகையாக எழும்பச் செய்ய வேண்டும்.[a]
  to: அதன் கொழுப்பு முழுவதையும் அதிலிருந்து எடுத்து, அதை பலிபீடத்தின்மேல் புகையாக்க வேண்டும்.[a]
  rationale: The revision retains the Hebrew sequence, totality, and explicit removal from the animal, while using the more idiomatic Tamil sacrificial verb «புகையாக்க வேண்டும்» for הִקְטִיר. The footnote preserves the ordinary alternative “burn” and explains the Hebrew verb’s cultic nuance.
  reviewer_model: gpt-5.6-terra
