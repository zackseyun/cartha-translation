base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/018.yaml
  text: And from the blood he shall put some on the horns of the altar that is before Yahweh[a], which is in the tent of meeting, and all the blood he shall pour out at the base of the altar of burnt offering, which is at the entrance of the tent of meeting.
translation:
  language: ta
  text: அவன் இரத்தத்தில் சிறிதை, சந்திப்புக் கூடாரத்தில் யாவேக்கு முன்பாக இருக்கும் பலிபீடத்தின் கொம்புகளின் மேல் வைக்க வேண்டும்; இரத்தம் முழுவதையும் சந்திப்புக் கூடாரத்தின் நுழைவிடத்தில் இருக்கும் தகனபலிப் பலிபீடத்தின் அடிப்பகுதியில் ஊற்ற வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இரத்தத்தில் சிறிதை’ என்பது எபிரெயத்தில் சொல்லர்த்தமாக ‘இரத்தத்திலிருந்து அவன் வைக்க வேண்டும்’ என்று உள்ளது. வசனத்தின் பிற்பகுதியில் வரும் ‘இரத்தம் முழுவதையும்’ என்பதற்கு மாறாக, பகுதியைக் குறிக்கும் பொருளைத் தமிழில் வெளிப்படையாக்க ‘சிறிதை’ சேர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן הַדָּם
  choice: அந்த இரத்தத்தில் சிறிதை
  rationale: எபிரெயச் சொற்றொடர் சொல்லர்த்தமாக ‘இரத்தத்திலிருந்து’ எனத் தொடங்குகிறது. பின்னர் வரும் ‘இரத்தம் முழுவதையும்’ என்பதற்கு மாறாக, அதன் ஒரு பகுதி மட்டும் கொம்புகளின்மேல் பூசப்படுவதை இயல்பான தமிழில் தெளிவாக்க ‘சிறிதை’ சேர்க்கப்பட்டது.
- source_word: יִתֵּן
  choice: பூச வேண்டும்
  rationale: נתן என்பதன் அடிப்படைப் பொருள் ‘வைக்க/கொடுக்க’ என்பதாக இருந்தாலும், பலிபீடத்தின் கொம்புகளின்மேல் இரத்தத்தை இடும் சடங்குச் செயலைத் தமிழில் இயல்பாகக் குறிக்க ‘பூச’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: קַרְנֹת הַמִּזְבֵּחַ
  choice: பலிபீடத்தின் கொம்புகள்
  rationale: קרנות என்பதன் நேரடிப் பொருளான ‘கொம்புகள்’ பாதுகாக்கப்படுகிறது; இது பலிபீடத்தின் முனைப்புகளைக் குறிக்கும் நிலையான வழிபாட்டுச் சொல்.
- source_word: אֲשֶׁר לִפְנֵי יְהוָה
  choice: யாவேக்கு முன்பாக இருக்கும்
  rationale: לִפְנֵי என்பதிலுள்ள இடம்சார் ‘முன்பாக/சந்நிதியில்’ என்ற பொருள் பாதுகாக்கப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநான்கெழுத்துப் பெயர் ஒரு பட்டத்தால் மாற்றப்படாமல், தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பாக வழங்கப்படுகிறது.
- source_word: אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரம்
  rationale: இறைவன் தம் மக்களைச் சந்திக்கும் திருக்கூடாரத்தைக் குறிக்கும் பெயரின் வெளிப்படையான பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: וְאֵת כָּל הַדָּם
  choice: இரத்தம் முழுவதையும்
  rationale: முன்பு ஒரு பகுதி பயன்படுத்தப்பட்டிருந்தாலும், மூலத்தில் உள்ள ‘எல்லா இரத்தமும்’ என்ற சொல்லாட்சியே பாதுகாக்கப்படுகிறது; அதை ‘மீதமுள்ள இரத்தம்’ என்று விளக்கி மாற்றவில்லை.
- source_word: יִשְׁפֹּךְ
  choice: ஊற்ற வேண்டும்
  rationale: שׁפך என்பதன் சடங்குச் சூழலுக்கேற்ற இயல்பான தமிழ் இணைச்சொல்.
- source_word: אֶל יְסוֹד
  choice: அடிப்பாகத்தில்
  rationale: יְסוֹד என்பது பலிபீடத்தின் அடித்தளம் அல்லது அடிப்பகுதியைக் குறிக்கிறது; ‘அடிப்பாகம்’ தெளிவான நவீன தமிழ்.
- source_word: מִזְבַּח הָעֹלָה
  choice: தகனபலிப் பலிபீடம்
  rationale: עֹלָה என்பது முழுமையாக எரிக்கப்படும் பலியைக் குறிக்கிறது; ‘தகனபலி’ அதன் வழிபாட்டுச் சிறப்பைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: אֲשֶׁר פֶּתַח אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரத்தின் நுழைவிடத்தில் இருக்கும்
  rationale: פֶּתַח என்பதன் இடம்சார் பொருளை இயல்பான தமிழில் ‘நுழைவிடம்’ என வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரை இறைவனின் தனிப்பெயரை நேரடியாகப் பயன்படுத்துவதால், அதை ஒரு பட்டமாக மாற்றாமல் தமிழில் ஒலிபெயர்த்துள்ளது.
- issue: כָּל הַדָּם என்பதில் முன்பு பயன்படுத்தப்பட்ட பகுதியுடனான தோற்ற முரண்பாடு
  choice: இரத்தம் முழுவதையும்
  alternative: மீதமுள்ள இரத்தம் முழுவதையும்
  rationale: சூழலில் மீதமுள்ள இரத்தமே குறிக்கப்பட்டாலும், மூலத்தின் ‘எல்லா/முழு இரத்தம்’ என்ற வடிவத்தைப் பாதுகாத்து, விளக்கத்தை உரைக்குள் சேர்க்காமல் அடிக்குறிப்பில் குறிப்பிட்டுள்ளது.
