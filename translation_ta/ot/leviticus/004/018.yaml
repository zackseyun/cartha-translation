  naturalness: ‘சந்திப்புக் கூடாரம்’ மற்றும் ‘தகனபலிப் பலிபீடம்’ நவீன நிலையான தமிழில் புரியக்கூடிய, கண்ணியமான வழிபாட்டுப் பதிவைக் காக்கின்றன. ‘பலிபீடத்தின் கொம்புகளின் மேல்’ என இடைவெளியுடன் எழுதுவது வாசிப்புக்கு இயல்பானது. முதல் தொடரை ‘அவன் இரத்தத்தில் சிறிதை ... வைக்க வேண்டும்’ என அமைத்தால் தமிழ் ஓட்டமும் மூலத்தின் வினைத் தெரிவும் மேம்படும்.
