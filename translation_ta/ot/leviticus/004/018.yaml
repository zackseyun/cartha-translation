  register: நவீன நிலையான தமிழில், வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘பலிபீடத்தின் கொம்புகள்’, ‘தகனபலி’, ‘சந்திப்புக் கூடாரம்’ போன்ற மூலப் பண்பாட்டுச் சொற்கள் எளிமைப்படுத்தி அழிக்கப்படாமல் பாதுகாக்கப்பட்டுள்ளன.
