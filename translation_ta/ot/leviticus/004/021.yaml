- from: அவன் அந்தக் காளையை முகாமுக்கு வெளியே கொண்டுபோய், முதல் காளையை எரித்ததுபோல அதையும் எரிக்க வேண்டும். அது சபைக்கான பாவநிவாரணப் பலி[a].
  to: அவன் அந்தக் காளையை முகாமுக்கு வெளியே கொண்டுபோய், முதல் காளையை எரித்ததுபோல அதையும் எரிக்க வேண்டும். அது சமூகத்தினருக்கான பாவப்பலி[a].
