base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/021.yaml
  text: He shall bring the bull outside the camp and burn it[a], just as he burned the first bull. It is the sin offering for the assembly.
translation:
  language: ta
  text: அவன் அந்தக் காளையை முகாமுக்கு வெளியே கொண்டுபோய், முதல் காளையை எரித்ததுபோல அதையும் எரிக்க வேண்டும். அது சமூகத்தினருக்கான பாவப்பலி[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தூய்மைப்படுத்தும் பலி.” எபிரேயச் சொல் பாவத்தோடு தொடர்புடைய இந்தப் பலி அசுத்தத்தை அகற்றும் பணியையும் வலியுறுத்தக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹצִיא
  choice: கொண்டுபோய்
  rationale: יצא என்பதன் ஹிஃபில் வடிவம் ஒன்றை வெளியே கொண்டுபோவதைக் குறிக்கிறது; தமிழில் இலக்கைத் தொடர்ந்து வரும் ‘கொண்டுபோய்’ இயல்பானது.
- source_word: הַפָּר
  choice: அந்தக் காளையை
  rationale: פַּר என்பது பலிக்குரிய காளை அல்லது இளங்காளையைக் குறிக்கும்; சூழலில் ஏற்கெனவே குறிப்பிடப்பட்ட விலங்காக இருப்பதால் ‘அந்தக் காளை’ பொருத்தமானது.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: முகாமுக்கு வெளியே
  rationale: இந்த முன்னிடைச்சொல் தொடர் முகாமின் எல்லைக்கு அப்பாலுள்ள இடத்தை நோக்கிய நகர்வைக் குறிக்கிறது.
- source_word: וְשָׂרַף אֹתוֹ
  choice: அதையும் எரிக்க வேண்டும்
  rationale: שׂרף என்பதன் நேரடியான பொருள் ‘எரி’; எபிரேய வாக்கியத்தின் கட்டளைத் தன்மையை ‘வேண்டும்’ வெளிப்படுத்துகிறது. ‘அதையும்’ என்பது முந்தைய காளையோடு உள்ள ஒப்புமையை இயல்பாக இணைக்கிறது.
- source_word: כַּאֲשֶׁר שָׂרַף
  choice: எரித்ததுபோல
  rationale: כַּאֲשֶׁר இங்கு முந்தைய செயல்முறையோடு ஒப்புமையைக் குறிக்கிறது.
- source_word: הַפָּר הָרִאשׁוֹן
  choice: முதல் காளையை
  rationale: רִאשׁוֹן முன்பு விவரிக்கப்பட்ட காளையைச் சுட்டுகிறது; ‘முதல் காளை’ நேரடியான மொழிபெயர்ப்பு.
- source_word: חַטַּאת
  choice: பாவநிவாரணப் பலி
  rationale: பலிச்சட்டச் சூழலில் חַטָּאת பாவத்துடன் தொடர்புடைய பலியைக் குறிக்கிறது. ‘பாவநிவாரணப் பலி’ என்பது தமிழில் அதன் சடங்குசார் செயலையும் பலி என்ற குறிப்பையும் தெளிவாகக் காட்டுகிறது; மாற்றான ‘தூய்மைப்படுத்தும் பலி’ அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: הַקָּהָל
  choice: சபை
  rationale: קָהָל கூடியுள்ள உடன்படிக்கைச் சமூகத்தைக் குறிக்கிறது. ‘சபை’ சுருக்கமாகவும் தமிழில் பரவலாகப் புரிந்துகொள்ளத்தக்கதாகவும் உள்ளது; இங்கு ஒரு குறிப்பிட்ட திருச்சபைப் பிரிவைக் குறிக்கவில்லை.
- source_word: הוּא
  choice: அது
  rationale: இந்தச் சுட்டுப்பெயர் காளையைச் சபைக்கான பலியாக அடையாளப்படுத்தும் பயனிலையாகச் செயல்படுகிறது.
theological_decisions:
- issue: பலிச்சட்டத்தில் חַטַּאת என்பதன் மொழிபெயர்ப்பு
  choice: பாவநிவாரணப் பலி
  alternative: தூய்மைப்படுத்தும் பலி
  rationale: இச்சொல் பாவத்தையும் அசுத்தத்தை அகற்றும் பலியின் செயலையும் உள்ளடக்கக்கூடும். இங்கு பலியாகும் விலங்கே குறிப்பிடப்படுவதால், பொதுவாகப் புரியக்கூடிய ‘பாவநிவாரணப் பலி’ முதன்மை உரையில் வைக்கப்பட்டு, உண்மையான சொற்பொருள் மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரேய வாக்கியத்தின் ஒப்புமை, கட்டளைத் தன்மை, சபை முழுவதையும் சார்ந்த பலி என்ற கருத்து ஆகியவை பாதுகாக்கப்பட்டுள்ளன.
