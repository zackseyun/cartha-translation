revisions:
- from: ஒரு தலைவர்[a] பாவம் செய்து, தன் கடவுளாகிய யாவே செய்யக்கூடாது என்று கொடுத்த கட்டளைகளில் ஏதேனும் ஒன்றைத் தற்செயலாக[b] செய்து குற்றவாளியாகும்போது,
  to: ஒரு தலைவர்[a] பாவம் செய்து, தன் கடவுளாகிய யாவே செய்யக்கூடாது என்று கட்டளையிட்ட காரியங்களில் ஏதேனும் ஒன்றைத் தற்செயலாக[b] செய்து, குற்றவாளியாகும்போது,
  rationale: The revision clarifies that the leader commits one prohibited act among the matters Yahweh has commanded not to be done. It retains the source’s conditional syntax, its ambiguity-free but noninterpretive statement of inadvertence, the resulting state of guilt, and the verse’s continuing comma. Footnote a is corrected so that it gives actual lexical alternatives rather than repeating the selected term.
