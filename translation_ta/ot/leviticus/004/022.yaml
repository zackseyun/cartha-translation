source:
  edition: WLC
  text: אֲשֶׁ֥ר נָשִׂ֖יא יֶֽחֱטָ֑א וְ/עָשָׂ֡ה אַחַ֣ת מִ/כָּל מִצְוֺת֩ יְהוָ֨ה אֱלֹהָ֜י/ו אֲשֶׁ֧ר לֹא תֵעָשֶׂ֛ינָה בִּ/שְׁגָגָ֖ה וְ/אָשֵֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/022.yaml
  text: When a leader sins and unintentionally does one of any of the things that Yahweh his God has commanded not to be done[a], and becomes guilty[b],
translation:
  language: ta
  text: ஒரு தலைவர்[a] பாவம் செய்து, தன் கடவுளாகிய யாவே செய்யக்கூடாது என்று கட்டளையிட்ட காரியங்களில் ஏதேனும் ஒன்றைத் தற்செயலாக[b] செய்து, குற்றவாளியாகும்போது,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது ‘ஆட்சியாளர்,’ ‘குலத்தலைவர்’; எபிரெயச் சொல் נָשִׂיא அங்கீகரிக்கப்பட்ட தலைவர் அல்லது முதன்மையானவரைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது ‘தவறுதலாக,’ ‘வேண்டுமென்றே அல்லாமல்’; எபிரெயச் சொல் நோக்கமின்றிச் செய்யப்பட்ட மீறலைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשִׂיא
  choice: தலைவர்
  rationale: இந்த எபிரெயச் சொல் அங்கீகரிக்கப்பட்ட சமூக, குல அல்லது குடிமைத் தலைவரைக் குறிக்கிறது; அரசகுமாரனை மட்டும் குறிக்காததால், நவீனத் தமிழில் பொதுவாகவும் தெளிவாகவும் உள்ள ‘தலைவர்’ பொருத்தமானது.
- source_word: יֶחֱטָא
  choice: பாவம் செய்து
  rationale: חטא என்பதன் நேரடியான, வழக்கமான இறையியல் பொருளைத் தமிழில் இயல்பாகத் தருகிறது.
- source_word: וְעָשָׂה אַחַת מִכָּל
  choice: கட்டளைகளில் ஏதேனும் ஒன்றை ... செய்து
  rationale: பல கட்டளைகளுள் தடைசெய்யப்பட்ட ஏதேனும் ஒரு செயலைச் செய்வது என்ற பகுதிப்பொருளைப் பாதுகாக்கிறது.
- source_word: מִצְוֺת יְהוָה אֱלֹהָיו
  choice: தன் கடவுளாகிய யாவே ... கொடுத்த கட்டளைகள்
  rationale: கட்டளைகள் யாவேயிடமிருந்து வந்தவை என்பதையும், אֱלֹהָיו என்பதிலுள்ள ‘அவனுடைய கடவுள்’ என்ற உறவுப்பொருளையும் ‘தன் கடவுளாகிய’ என்பதன் மூலம் காக்கிறது.
- source_word: אֲשֶׁר לֹא תֵעָשֶׂינָה
  choice: செய்யக்கூடாது என்று
  rationale: செய்யப்படக் கூடாத செயல்கள் என்ற எபிரெயத் தடைப்பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בִּשְׁגָגָה
  choice: தற்செயலாக
  rationale: வேண்டுமென்றே செய்யாமல், கவனக்குறைவாலோ தவறுதலாலோ நிகழ்ந்த குற்றம் என்ற லேவியராகமச் சட்டச் சூழலைச் சுருக்கமாகத் தருகிறது.
- source_word: וְאָשֵׁם
  choice: குற்றவாளியாகும்போது
  rationale: செயலின் விளைவாகக் குற்றநிலை ஏற்படுவதைப் பாதுகாக்கிறது; தொடரும் வசனங்களோடு இணையும் நிபந்தனை வாக்கிய அமைப்பையும் இயல்பாக வைத்திருக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் வரும் தனிப்பட்ட உடன்படிக்கைப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் ஒலிபெயர்த்துத் தருகிறது.
- issue: தற்செயலான மீறலும் குற்றநிலையும் இடையிலான தொடர்பு
  choice: தற்செயலாகச் செய்தாலும் ‘குற்றவாளியாகும்போது’ என்று கூறுதல்
  alternative: அறியாமல் செய்ததால் குற்றமற்றவன் எனப் பொருள்படுத்துதல்
  rationale: בִּשְׁגָגָה வேண்டுமென்றே செய்யாத தன்மையைச் சுட்டினாலும், וְאָשֵׁם அதனால் உருவாகும் குற்றநிலையைத் தெளிவாகக் கூறுகிறது; இந்த இறையியல் பதற்றம் தீர்த்துவிடப்படாமல் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் சட்ட மற்றும் வழிபாட்டுச் சூழலுக்குரிய கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. வசனம் அடுத்த பகுதியோடு தொடர்வதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
