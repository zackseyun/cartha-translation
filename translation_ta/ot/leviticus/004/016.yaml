  text: וְ/הֵבִ֛יא הַ/כֹּהֵ֥ן הַ/מָּשִׁ֖יחַ מִ/דַּ֣ם הַ/פָּ֑ר אֶל אֹ֖הֶל מוֹעֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/016.yaml
  text: Then the anointed priest shall bring some of the bull's blood into the tent of meeting[a][b].
translation:
  language: ta
  text: பின்பு, அபிஷேகம் செய்யப்பட்ட ஆசாரியன் காளையின் இரத்தத்திலிருந்து சிறிதைச் சந்திப்புக் கூடாரத்திற்குள் கொண்டுவர வேண்டும்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொற்சொல்லாக, “காளையின் இரத்தத்திலிருந்து.” எபிரெயச் சொற்றொடர் பெரும்பாலும் பகுதியைக் குறிக்கிறது; இரத்தம் முழுவதுமல்ல, அதில் சிறிதே உள்ளே கொண்டுவரப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: “சந்திப்புக் கூடாரம்” என்பதற்கு மரபுவழித் தமிழில் “ஆசரிப்புக் கூடாரம்” என்றும் வழங்கப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הֵבִיא
  choice: பின்பு ... கொண்டுவர வேண்டும்
  rationale: இணைப்புடன் வந்துள்ள ஹிஃபில் வினைவடிவு சடங்குமுறைச் செயல்களின் தொடர்ச்சியைச் சுட்டுகிறது. நவீன தமிழில் ‘பின்பு ... வேண்டும்’ என்பது அந்த வரிசையையும் விதிமுறையின் கட்டாயத்தையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַ/כֹּהֵן
  choice: ஆசாரியன்
  rationale: பலியிடும் வழிபாட்டுச் சூழலில் כֹּהֵן என்பதற்கான நிலையான, புரிந்துகொள்ளத்தக்க தமிழ் வழக்கு.
- source_word: הַ/מָּשִׁיחַ
  choice: அபிஷேகம் செய்யப்பட்ட
  rationale: இங்கு இது பதவிக்காக எண்ணெயால் அபிஷேகம் செய்யப்பட்ட ஆசாரியனை விவரிக்கிறது; ‘மேசியா’ என்ற பட்டமாகச் செயல்படவில்லை.
- source_word: מִ/דַּם
  choice: இரத்தத்தில் சிறிதை
  rationale: מִן இங்கு பகுதியைக் குறிக்கும் பொருளில் உள்ளது; காளையின் இரத்தம் முழுவதுமல்ல, அதில் ஒரு பகுதியே உள்ளே கொண்டுவரப்படுகிறது.
- source_word: הַ/פָּר
  choice: காளையின்
  rationale: פַּר பலிச்சடங்குச் சூழலில் காளையைக் குறிக்கிறது; வயதைத் தனியே குறிப்பதற்கான அவசியம் இவ்வசனத்தில் இல்லை.
- source_word: אֶל
  choice: '...க்குள்'
  rationale: இலக்கை மட்டும் அல்லாமல் புனிதக் கூடாரத்தினுள் நுழைவதையும் சடங்கின் சூழல் உணர்த்துவதால் ‘உள்ளே/க்குள்’ பொருத்தமானது.
- source_word: אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரம்
  rationale: இறைவன் தம் மக்களைச் சந்திக்கும் இடத்தைக் குறிக்கும் எபிரெயப் பெயரின் பொருளைத் தெளிவாகவும் இயல்பாகவும் தக்கவைக்கிறது.
theological_decisions:
- issue: ஆசாரியச் சூழலில் הַמָּשִׁיחַ என்பதன் மொழிபெயர்ப்பு
  choice: அபிஷேகம் செய்யப்பட்ட
  alternative: மேசியா; அர்ப்பணிக்கப்பட்ட
  rationale: இந்தச் சொல் இங்கு கிறிஸ்துவியல் பட்டமல்ல; அபிஷேகத்தின் மூலம் பதவியில் அமர்த்தப்பட்ட ஆசாரியனை விவரிக்கிறது. எனவே மூலச்சொல்லின் செயற்பொருளைத் தக்கவைக்கும் மொழிபெயர்ப்பு தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், சடங்குமுறை விதியின் கண்ணியமான தொனியைத் தக்கவைத்து மொழிபெயர்க்கப்பட்டது. ‘ஆசாரியன்,’ ‘அபிஷேகம்,’ ‘சந்திப்புக் கூடாரம்’ ஆகிய பரவலாக அறியப்படும் வேதாகமச் சொற்கள் பயன்படுத்தப்பட்டுள்ளன; இருப்பினும் வாக்கிய அமைப்பு இயல்பான நவீன தமிழாக வைக்கப்பட்டுள்ளது.
