  text: And the anointed priest shall take some of the bull's blood and bring it into the tent of meeting[a][b].
translation:
  language: ta
  text: 'அபிஷேகம் செய்யப்பட்ட ஆசாரியன் காளையின் இரத்தத்தில் சிறிதளவை எடுத்து, அதைச் சந்திப்புக் கூடாரத்திற்குள் கொண்டுவர வேண்டும்[a][b].


    [a] இன்னும் சொற்சொல்லான மொழிபெயர்ப்பு: “காளையின் இரத்தத்திலிருந்து.” இங்கு எபிரெயச் சொற்றொடர் இரத்தத்தின் ஒரு பகுதியைக் குறிக்கலாம்.


    [b] எபிரெயத்தில், “சந்திப்புக் கூடாரத்திற்கு.” தொடர்ந்து வரும் சடங்குகள் கூடாரத்தின் உள்ளே நடைபெறுவதால், இங்கு “கூடாரத்திற்குள்” என்று மொழிபெயர்க்கப்பட்டுள்ளது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொற்சொல்லான மொழிபெயர்ப்பு: “காளையின் இரத்தத்திலிருந்து.” இங்கு எபிரெயச் சொற்றொடர் இரத்தத்தின் ஒரு பகுதியைக் குறிக்கலாம்.'
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “சந்திப்புக் கூடாரத்திற்கு.” தொடர்ந்து வரும் சடங்குகள் கூடாரத்தின் உள்ளே நடைபெறுவதால், இங்கு “கூடாரத்திற்குள்” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: எடுத்துக்கொண்டு ... கொண்டுவர வேண்டும்
  rationale: பலிச்சடங்கு நடைமுறையை வரிசையாக அறிவுறுத்தும் வாவ் + கத்தால் அமைப்பைத் தமிழில் இயல்பான கட்டளை/கடமை வடிவில் வழங்குகிறது.
- source_word: הַכֹּהֵן הַמָּשִׁיחַ
  choice: அபிஷேகம் செய்யப்பட்ட ஆசாரியன்
  rationale: மָשִׁיחַ என்பதன் அடிப்படைப் பொருளான ‘அபிஷேகம் செய்யப்பட்ட’ என்பதைப் பாதுகாத்து, ‘தலைமை ஆசாரியன்’ என்ற விளக்கத் தலைப்பை மூலச்சொல்லுக்குப் பதிலாக இடவில்லை.
- source_word: מִדַּם הַפָּר
  choice: காளையின் இரத்தத்தில் சிறிதை
  rationale: מִן இங்கு பகுதியைக் குறிக்கும் வாய்ப்புள்ளதால், இரத்தம் முழுவதையும் அல்லாமல் அதில் ஒரு பகுதியை எடுத்தலை இயல்பான தமிழில் வெளிப்படுத்துகிறது; சொற்சொல்லான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: וְהֵבִיא אֹתוֹ
  choice: அதை ... கொண்டுவர வேண்டும்
  rationale: ஒருமை பொருள் பின்னொட்டு முன் குறிப்பிடப்பட்ட இரத்தத்தைக் குறிக்கிறது; நடைமுறை அறிவுறுத்தலின் வலிமை ‘வேண்டும்’ என்பதால் தொடர்கிறது.
- source_word: אֶל אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரத்திற்குள்
  rationale: אֶל அடிப்படையில் ‘நோக்கி/இடம் நோக்கி’ எனப் பொருள்படலாம்; ஆனால் தொடர்ந்து வரும் செயல்கள் பரிசுத்த இடத்தின் உள்ளே நடைபெறுவதால் ‘உள்ளே’ என்பது சூழலுக்கு ஏற்றது. மூலத்தின் திசைசார் வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
theological_decisions:
- issue: הַכֹּהֵן הַמָּשִׁיחַ என்ற ஆசாரியப் பதவிச் சொல்லை மொழிபெயர்த்தல்
  choice: அபிஷேகம் செய்யப்பட்ட ஆசாரியன்
  alternative: தலைமை ஆசாரியன்; அர்ப்பணிக்கப்பட்ட ஆசாரியன்
  rationale: மூலத்தின் ‘அபிஷேகம் செய்யப்பட்ட’ என்ற நேரடிப் பொருளைப் பாதுகாக்கிறது. பிற்கால கிறிஸ்தவ மெசியா சார்ந்த பொருளை இவ்வசனத்தில் புகுத்தாமலும், மூலத்தில் வெளிப்படையாக இல்லாத ‘தலைமை’ என்ற பதவிப்பெயரால் மாற்றாமலும் உள்ளது.
- issue: אֶל என்பதில் உள்ள திசை/உட்புகுதல் தெளிவின்மை
  choice: முதன்மை உரையில் ‘கூடாரத்திற்குள்’; அடிக்குறிப்பில் ‘நோக்கி/இடம் நோக்கி’
  alternative: சந்திப்புக் கூடாரத்திடம்
  rationale: சடங்குச் சூழல் உட்புகுதலை வலுவாகக் காட்டினாலும், எபிரெய முன்னிடைச்சொல் தனியாக அதை கட்டாயப்படுத்தாது. ஆகவே இயல்பான சூழல்சார் வாசகம் முதன்மை உரையிலும் உண்மையான மொழியியல் மாற்று அடிக்குறிப்பிலும் வைக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘ஆசாரியன்,’ ‘அபிஷேகம்,’ ‘சந்திப்புக் கூடாரம்’ ஆகியவை பரவலாக அறியப்படும் வேதாகமச் சொற்களாக இருப்பதால் தக்கவைக்கப்பட்டுள்ளன; வாக்கிய அமைப்பு சாதாரண வாசகருக்கும் தெளிவாக இருக்குமாறு எளிமைப்படுத்தப்பட்டுள்ளது.
