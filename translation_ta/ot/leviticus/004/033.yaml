base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/033.yaml
  text: And he shall lay his hand on the head of the sin offering and slaughter it for a sin offering in the place where the burnt offering is slaughtered[a].
translation:
  language: ta
  text: அவன் தன் கையைப் பாவநிவாரணப் பலியின் தலையின்மேல் வைத்து, தகனபலியை அறுக்கும் இடத்தில் அதைப் பாவநிவாரணப் பலியாக அறுக்க வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பாவநிவாரணப் பலி’ என்று வரும் இரு இடங்களிலும் ‘தூய்மைப்படுத்தும் பலி’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் பாவத்தையும் சடங்கு அசுத்தத்தையும் நீக்குவதோடு தொடர்புடைய பலியைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָמַךְ
  choice: வைத்து
  rationale: பலியிடும் சடங்கின் சூழலில் סמך என்பது கையை வைப்பதை அல்லது அழுத்தி வைப்பதைக் குறிக்கிறது; தமிழில் ‘கையை ... வைத்து’ என்பது இயல்பாகவும் பொருளுக்கு நெருக்கமாகவும் உள்ளது.
- source_word: יָדוֹ
  choice: தன் கையை
  rationale: எபிரெயச் சொல் ஒருமையில் மூன்றாம் ஆண்பால் ஒருமை உருபுடன் இருப்பதால், பன்மையாக்காமல் ‘தன் கையை’ என வழங்கப்பட்டுள்ளது.
- source_word: עַל רֹאשׁ
  choice: தலையின்மேல்
  rationale: முன்னிடைச்சொல் மற்றும் பெயர்ச்சொல் தொடரின் நேரான, இயல்பான தமிழ் வடிவம்.
- source_word: הַחַטָּאת / לְחַטָּאת
  choice: பாவநிவாரணப் பலி / பாவநிவாரணப் பலியாக
  rationale: லேவியராகமத்தின் பலிச்சட்டங்களில் חטאת பாவத்தோடும் சடங்குத் தூய்மைப்படுத்துதலோடும் தொடர்புடைய பலியைக் குறிக்கிறது. ‘பாவநிவாரணப் பலி’ தமிழில் அறியப்பட்டதும், அதன் செயல்பாட்டைத் தெளிவாக உணர்த்துவதுமாகும்; ‘தூய்மைப்படுத்தும் பலி’ என்ற மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וְשָׁחַט
  choice: அறுக்க வேண்டும்
  rationale: שׁחט என்பது பலிக்குரிய விலங்கைச் சடங்குமுறையில் அறுப்பதற்கான தொழில்நுட்ப வினை; ‘கொல்ல வேண்டும்’ என்பதைவிட ‘அறுக்க வேண்டும்’ துல்லியமானது.
- source_word: אֹתָהּ
  choice: அதை
  rationale: பெண்பால் ஒருமைச் சுட்டுப்பெயர் முன் குறிப்பிடப்பட்ட பலி விலங்கைக் குறிக்கிறது; தமிழில் ‘அதை’ இயல்பானது.
- source_word: בִּמְקוֹם אֲשֶׁר יִשְׁחַט
  choice: அறுக்கும் இடத்தில்
  rationale: குறிப்பிட்ட பலியிடும் இடத்தைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது; எபிரெய வினையின் பொது சடங்கு நடைமுறை உணர்வு தக்கவைக்கப்படுகிறது.
- source_word: הָעֹלָה
  choice: தகனபலி
  rationale: עֹלָה என்பதற்கான வழக்கமான பலியியல் சொல்; பலி முழுவதும் எரிக்கப்படுவதை உணர்த்தும் நிலைபெற்ற தமிழ் பயன்பாடு.
theological_decisions:
- issue: பலிச்சட்டங்களில் חטאת என்பதன் மொழிபெயர்ப்பு
  choice: பாவநிவாரணப் பலி
  alternative: தூய்மைப்படுத்தும் பலி
  rationale: இந்தச் சொல் பாவத்திற்கான பலியையும் சடங்குத் தூய்மைப்படுத்தும் செயலையும் குறிக்கக்கூடும். முதன்மை உரையில் பரவலாகப் புரியக்கூடிய ‘பாவநிவாரணப் பலி’ பயன்படுத்தப்பட்டு, உண்மையான சொற்பொருள் மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டவழிமுறைக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய மூலத்திலுள்ள ஒருமை ‘கை’ தக்கவைக்கப்பட்டுள்ளது; பலியியல் தொழில்நுட்பச் சொற்களுக்கு தெளிவான, வழக்கில் உள்ள தமிழ் வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன.
