base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/012.yaml
  text: He shall bring out the whole bull to a clean place[a] outside the camp, to the ash dump, and burn it on wood in the fire[b]; it shall be burned at the ash dump.
translation:
  language: ta
  text: அவன் அந்தக் காளை முழுவதையும் பாளயத்திற்கு வெளியே உள்ள தூய்மையான ஓர் இடத்திற்கு[a], அதாவது சாம்பல் கொட்டப்படும் இடத்திற்கு[b] கொண்டுபோய், அதை விறகுகளின்மேல் வைத்து நெருப்பில் எரிக்க வேண்டும்; சாம்பல் கொட்டப்படும் இடத்திலேயே அது எரிக்கப்பட வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, சடங்குமுறைப்படி தூய்மையான ஓர் இடம் என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெய மொழியில், ‘சாம்பல் கொட்டப்படும் இடம்’; அதாவது, பலிபீடச் சாம்பலை அகற்றுவதற்கென நியமிக்கப்பட்ட இடம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹצִיא
  choice: கொண்டுபோய்
  rationale: יצא என்பதன் ஹிஃபில் வடிவம் ‘வெளியே கொண்டுபோ’ என்ற காரணவினைப் பொருளைக் கொண்டது. ‘பாளயத்திற்கு வெளியே’ என்பதுடன் சேர்ந்து, தமிழில் ‘கொண்டுபோய்’ என்பது இயல்பாக அந்தத் திசைநோக்கிய செயலைத் தெரிவிக்கிறது.
- source_word: כָּל הַפָּר
  choice: அந்தக் காளை முழுவதையும்
  rationale: כָּל என்பது காளையின் ஒரு பகுதியை அல்ல, முழு விலங்கையும் குறிக்கிறது. ‘முழுவதையும்’ இந்த வலியுறுத்தலைத் தெளிவாகக் காக்கிறது.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: பாளயத்திற்கு வெளியே
  rationale: இது பாளய எல்லைக்கு அப்பாலுள்ள இடத்தைக் குறிக்கும் தெளிவான இடவியல் சொற்றொடர்.
- source_word: מָקוֹם טָהוֹר
  choice: தூய்மையான ஓர் இடம்
  rationale: טָהוֹר என்பது லேவியராகமச் சூழலில் சடங்குமுறைத் தூய்மையைக் குறிக்கக்கூடும். முதன்மை உரையில் இயல்பான ‘தூய்மையான’ பயன்படுத்தப்பட்டு, அதன் சடங்குமுறை நுணுக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: שֶׁפֶךְ הַדֶּשֶׁן
  choice: சாம்பல் கொட்டப்படும் இடம்
  rationale: שֶׁפֶךְ என்பது கொட்டுதல் அல்லது ஊற்றுதல் நடைபெறும் இடத்தையும், הַדֶּשֶׁן இங்கு பலிபீடச் சாம்பலையும் குறிக்கிறது. எனவே இது சாதாரண சாம்பல் குவியலைவிட நியமிக்கப்பட்ட அகற்றுமிடத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: וְשָׂרַף אֹתוֹ
  choice: அதை ... எரிக்க வேண்டும்
  rationale: שׂרף என்பதன் நேரடியான பொருள் ‘எரி’. சட்டவிதி நடைக்கு ஏற்றவாறு ‘வேண்டும்’ வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: עַל עֵצִים בָּאֵשׁ
  choice: விறகுகளின்மேல் வைத்து நெருப்பில்
  rationale: எபிரெய உரை எரிபொருளான மரத்தையும் நெருப்பையும் தனித்தனியாகக் குறிப்பிடுகிறது. தமிழ் இயல்புக்காக ‘வைத்து’ சேர்க்கப்பட்டாலும், இரு கூறுகளும் காக்கப்பட்டுள்ளன.
- source_word: עַל שֶׁפֶךְ הַדֶּשֶׁן יִשָּׂרֵף
  choice: சாம்பல் கொட்டப்படும் இடத்திலேயே அது எரிக்கப்பட வேண்டும்
  rationale: இறுதிக் கூற்று நியமிக்கப்பட்ட இடத்தை மீண்டும் வலியுறுத்துகிறது. ‘இடத்திலேயே’ அந்த இடவியல் வலியுறுத்தலையும் சட்டவிதியின் மறுபடியுரைத்தலையும் காக்கிறது.
theological_decisions:
- issue: טָהוֹר என்பதிலுள்ள சடங்குமுறைத் தூய்மை நுணுக்கம்
  choice: தூய்மையான ஓர் இடம்
  alternative: சடங்குமுறைப்படி தூய்மையான ஓர் இடம்
  rationale: பலியிடல் சார்ந்த சூழலில் சடங்குமுறைத் தூய்மை கருத்தில் இருக்கலாம். ஆயினும் மூலச்சொல்லைவிட வெளிப்படையாக விளக்காமல், முதன்மை உரையில் ‘தூய்மையான’ என்றும் அடிக்குறிப்பில் சாத்தியமான குறிப்பிட்ட பொருளும் தரப்படுகின்றன.
- issue: שֶׁפֶךְ הַדֶּשֶׁן குறிக்கும் பலிபீடச் சாம்பல் அகற்றுமிடம்
  choice: சாம்பல் கொட்டப்படும் இடம்
  alternative: சாம்பல் குவியல்
  rationale: இச்சொற்றொடர் ஏதோ ஒரு சாம்பல் குவியலை அல்ல, சாம்பலைக் கொட்டுவதற்கென நியமிக்கப்பட்ட இடத்தைக் குறிக்கிறது. செயல்பாட்டை வெளிப்படுத்தும் மொழிபெயர்ப்பு இந்த வேறுபாட்டைக் காக்கிறது.
translation_notes:
  register: நவீன தரமான தமிழில், சட்டவிதிக்குரிய கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. ‘வேண்டும்’ என்பது எபிரெய விதிப்பாங்கை இயல்பாகக் காட்டுகிறது. மூலத்தில் நியமிக்கப்பட்ட சாம்பல் அகற்றுமிடம் இருமுறை வருவதால், அந்த மறுபடியுரைத்தல் தமிழிலும் காக்கப்பட்டுள்ளது.
