base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/003.yaml
  text: If the anointed priest sins[a], bringing guilt on the people, then he shall present for the sin that he has committed a bull, a son of the herd, without blemish[b], to Yahweh as a sin offering.
translation:
  language: ta
  text: அபிஷேகம் செய்யப்பட்ட ஆசாரியர் பாவம் செய்து மக்களுக்குக் குற்றப்பழி உண்டாகும்படி செய்தால்[a], அவர் தான் செய்த பாவத்திற்காக மாட்டினத்தைச் சேர்ந்த பழுதற்ற ஒரு காளையை யாவேக்குப் பாவப்பலியாகச் சமர்ப்பிக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அபிஷேகம் செய்யப்பட்ட தலைமை ஆசாரியர் பாவம் செய்து, மக்களுக்குக் குற்றப்பழி உண்டாகும்படி செய்தால்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயத்தில் இச்சொற்றொடர் சுருக்கமாக உள்ளது; ஆசாரியரின் பாவம் மக்களுக்குக் குற்றப்பழி உண்டாக்கும் விளைவை இது வலியுறுத்தலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: הַכֹּהֵן הַמָּשִׁיחַ
  choice: அபிஷேகம் செய்யப்பட்ட ஆசாரியர்
  rationale: எபிரெயச் சொற்றொடரின் நேரடிப் பொருள் ‘அபிஷேகம் செய்யப்பட்ட ஆசாரியர்.’ இங்கு ‘தலைமை ஆசாரியர்’ என்பது சூழல்சார்ந்த விளக்கமாக இருந்தாலும், மூலத்தில் ‘தலைமை’ என்பதற்கான தனிச்சொல் இல்லை.
- source_word: יֶחֱטָא
  choice: பாவம் செய்து
  rationale: אִם உடன் வரும் நிபந்தனை வினையை இயல்பான தமிழில் அடுத்த விளைவுச் சொற்றொடருடன் இணைக்கிறது.
- source_word: לְאַשְׁמַת הָעָם
  choice: மக்கள்மேல் குற்றப்பழி வரச் செய்தால்
  rationale: இந்தச் சுருக்கமான எபிரெயச் சொற்றொடர் ஆசாரியரின் பாவத்தால் மக்களுக்கும் குற்றப்பொறுப்பு அல்லது குற்றநிலை ஏற்படும் விளைவைச் சுட்டுகிறது; அதன் செயல்முறையை அளவுக்கு மீறி விளக்காமல் அந்தத் தெளிவின்மையைத் தக்கவைக்கிறது.
- source_word: וְהִקְרִיב
  choice: கொண்டுவர வேண்டும்
  rationale: பலிசார் சூழலில் הקריב என்பது பலிக்குரியதை அணுகக் கொண்டுவருதல் அல்லது சமர்ப்பித்தலைக் குறிக்கிறது. ‘கொண்டுவர வேண்டும்’ என்பது சட்டவிதியின் கடமையையும் சடங்குச் செயலையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עַל חַטָּאתוֹ אֲשֶׁר חָטָא
  choice: தான் செய்த பாவத்திற்காக
  rationale: எபிரெயத்தில் உள்ள சொல் மீளுரையை இயல்பான தமிழில் சுருக்கி, பலி எந்தப் பாவத்திற்காக என்பதைத் தெளிவாகக் காட்டுகிறது.
- source_word: פַּר בֶּן בָּקָר
  choice: மாட்டுக் கூட்டத்திலிருந்து ஒரு காளை
  rationale: சொற்றொடர் மாட்டினத்தைச் சேர்ந்த ஆண் விலங்கைக் குறிக்கிறது. வயதைத் தேவையின்றி நிர்ணயிக்காமல் அதன் இனவகையைத் தக்கவைக்கிறது.
- source_word: תָּמִים
  choice: பழுதற்ற
  rationale: பலிக்குரிய விலங்கின் உடற்குறை இல்லாத ஏற்ற நிலையைக் குறிக்கும் வழக்கமான பலிசார் சொல்.
- source_word: לַיהוָה
  choice: யெகோவாவிடம்
  rationale: יהוה என்ற தனிப்பெயரை தமிழில் பரவலாக அறியப்படும் ‘யெகோவா’ என ஒலிபெயர்த்து, பலியை அவரிடம் கொண்டுவரும் திசை/பெறுநர் கருத்தை வெளிப்படுத்துகிறது.
- source_word: לְחַטָּאת
  choice: பாவநிவாரணப் பலியாக
  rationale: பலிச் சட்டச் சூழலில் חַטָּאת பாவத்தை மட்டும் அல்ல, பாவத்திற்காகச் செலுத்தப்படும் பலியையும் குறிக்கிறது. ‘பாவநிவாரணப் பலி’ என்பது அதன் சடங்குச் செயல்பாட்டைத் தெளிவாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: הַכֹּהֵן הַמָּשִׁיחַ என்பதை ‘அபிஷேகம் செய்யப்பட்ட ஆசாரியர்’ என்றா, ‘தலைமை ஆசாரியர்’ என்றா மொழிபெயர்ப்பது
  choice: அபிஷேகம் செய்யப்பட்ட ஆசாரியர்
  alternative: அபிஷேகம் செய்யப்பட்ட தலைமை ஆசாரியர்
  rationale: சூழலில் தலைமை ஆசாரியர் குறிக்கப்படலாம்; எனினும் மூலச் சொற்றொடர் நேரடியாக ‘அபிஷேகம் செய்யப்பட்ட ஆசாரியர்’ என்கிறது. பதவிப் பெயரை விளக்கமாகச் சேர்க்காமல் மூலத்தின் வடிவம் பாதுகாக்கப்படுகிறது.
- issue: לְאַשְׁמַת הָעָם என்பதில் ஆசாரியரின் பாவத்துக்கும் மக்களின் குற்றநிலைக்கும் உள்ள உறவு
  choice: மக்கள்மேல் குற்றப்பழி வரச் செய்தால்
  alternative: மக்களின் குற்றப்பழிக்காக
  rationale: ஆசாரியரின் பாவம் மக்களைப் பாதிக்கும் கூட்டுப்பொறுப்பு விளைவை வசனம் உணர்த்துகிறது; ஆனால் அதன் துல்லியமான செயல்முறையை வரையறுப்பதில்லை. தேர்ந்த மொழியாக்கம் அந்த விளைவையும் மூலத்தின் இறையியல் இறுக்கத்தையும் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘ஆசாரியர்,’ ‘அபிஷேகம்,’ ‘பாவநிவாரணப் பலி’ ஆகியவை லேவியராகமத்தின் பலிசார் சூழலுக்கேற்ற பரவலாக அறியப்பட்ட சொற்கள். மூலத்தின் சட்டவிதி அமைப்பு இயல்பான தமிழில் வழங்கப்பட்டு, சமூகக் குற்றப்பொறுப்பு குறித்த தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
