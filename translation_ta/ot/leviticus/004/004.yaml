revisions:
- from: அவன் அந்தக் காளையைச் சந்திப்புக் கூடாரத்தின் நுழைவாயிலுக்கு, யாவே முன்னிலையில்[a] கொண்டுவந்து, தன் கையைக் காளையின் தலையின்மேல் வைத்து, யாவே முன்னிலையில் அதைக் கொல்ல வேண்டும்.
  to: அவன் அந்தக் காளையைச் சந்திப்புக் கூடாரத்தின் நுழைவாயிலுக்குக் யாவேக்கு முன்பாக[a] கொண்டுவர வேண்டும்; தன் கையை அந்தக் காளையின் தலையின்மேல் வைக்க வேண்டும்; யாவேக்கு முன்பாக அந்தக் காளையை அறுக்க வேண்டும்.
  rationale: The revision keeps every stated ritual action and both instances of ‘before Yahweh,’ while using idiomatic Tamil and a more source-specific verb for sacrificial slaughter. It does not explain the significance of hand-laying or introduce any theological interpretation.
