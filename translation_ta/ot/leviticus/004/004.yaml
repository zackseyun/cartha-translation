source:
  edition: WLC
  text: וְ/הֵבִ֣יא אֶת הַ/פָּ֗ר אֶל פֶּ֛תַח אֹ֥הֶל מוֹעֵ֖ד לִ/פְנֵ֣י יְהוָ֑ה וְ/סָמַ֤ךְ אֶת יָד/וֹ֙ עַל רֹ֣אשׁ הַ/פָּ֔ר וְ/שָׁחַ֥ט אֶת הַ/פָּ֖ר לִ/פְנֵ֥י יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/004.yaml
  text: He shall bring the bull to the entrance of the tent of meeting before Yahweh[b][a], and he shall lay his hand on the head of the bull and slaughter the bull before Yahweh.
translation:
  language: ta
  text: அவன் அந்தக் காளையைச் சந்திப்புக் கூடாரத்தின் நுழைவாயிலுக்குக் யாவேக்கு முன்பாக[a] கொண்டுவர வேண்டும்; தன் கையை அந்தக் காளையின் தலையின்மேல் வைக்க வேண்டும்; யாவேக்கு முன்பாக அந்தக் காளையை அறுக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், ‘யாவேக்கு முன்பாக’ என்று உள்ளது; இது யாவேயின் சந்நிதியில் என்பதைக் குறிக்கும் வழிபாட்டுச் சொற்றொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבִיא
  choice: கொண்டுவந்து
  rationale: בוא என்பதன் ஹிஃபில் வடிவம் மிருகத்தைக் கொண்டுவரும் கட்டளையைக் குறிக்கிறது; தொடரும் கட்டளை அமைப்புடன் இயல்பாக இணைக்கப்பட்டது.
- source_word: הַפָּר
  choice: அந்தக் காளை
  rationale: פַּר பலிக்குரிய காளையைக் குறிக்கிறது; இவ்வசனத்தில் அதன் இளமை வெளிப்படையாகச் சொல்லப்படாததால் ‘இளங்காளை’ என்று சேர்க்கப்படவில்லை.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரத்தின் நுழைவாயில்
  rationale: פֶּתַח என்பது திறப்பு அல்லது நுழைவாயில்; אֹהֶל מוֹעֵד என்பதற்கு தெளிவான, நிலையான ஆலயச் சொல்லாக்கமாக ‘சந்திப்புக் கூடாரம்’ பயன்படுத்தப்பட்டது.
- source_word: לִפְנֵי יְהוָה
  choice: யாவே முன்னிலையில்
  rationale: לִפְנֵי என்பது ‘முன்பாக/முன்னிலையில்’ என்று பொருள்படும்; இங்கு யாவேயின் சந்நிதியில் நிகழும் வழிபாட்டுச் செயலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெயத் தெய்வீகப் பெயரான יהוה ஒரு பட்டத்தால் மாற்றப்படாமல் தனிப்பெயராக ஒலிபெயர்க்கப்பட்டது.
- source_word: וְסָמַךְ אֶת יָדוֹ עַל רֹאשׁ הַפָּר
  choice: தன் கையைக் காளையின் தலையின்மேல் வைத்து
  rationale: סמך பலிச்சடங்கில் கையை வைப்பது அல்லது அழுத்தி வைப்பதைக் குறிக்கிறது; அதன் குறியீட்டுப் பொருளை வசனத்தில் சேர்க்காமல் உடல் செயல் மட்டும் மொழிபெயர்க்கப்பட்டது.
- source_word: וְשָׁחַט
  choice: கொல்ல வேண்டும்
  rationale: שׁחט என்பது பலிக்குரிய மிருகத்தை அறுத்துக் கொல்வதற்கான தொழில்நுட்ப வினை; நவீனத் தமிழில் இயல்பும் தெளிவும் கருதி ‘கொல்ல வேண்டும்’ என வழங்கப்பட்டது, பலிச்சூழல் அதன் குறிப்பிட்ட பொருளைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக இருப்பதால், பட்டப்பெயரைப் பதிலிடாமல் உடன்படிக்கையின் இறைப் பெயர் ஒலிபெயர்க்கப்பட்டது.
- issue: கையைத் தலையின்மேல் வைப்பதன் இறையியல் பொருள்
  choice: உடல் செயலை மட்டும் வெளிப்படையாக மொழிபெயர்த்தல்
  alternative: குற்றம் மாற்றப்படுதல் அல்லது அடையாளப்படுத்தப்படுதல் என்று விளக்கிச் சேர்த்தல்
  rationale: இந்த வசனம் செயலைக் கூறுகிறது; அதன் முழு அடையாளப் பொருளை விளக்கவில்லை. ஆகவே குறிப்பிட்ட கோட்பாட்டு விளக்கம் உரைக்குள் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்குப் புரியும் கண்ணியமான கட்டளைநடை பயன்படுத்தப்பட்டது. ‘சந்திப்புக் கூடாரம்’ என்ற சொல்லாக்கம் வழிபாட்டு இடத்தின் பெயராக நிலைத்தன்மையுடன் வைக்கப்பட்டது; சடங்கின் இறையியல் பொருள் விரித்துரைக்கப்படவில்லை.
