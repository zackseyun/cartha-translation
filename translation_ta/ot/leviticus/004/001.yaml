  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ta
  text: 'யாவே[a] மோசேயிடம் கூறினார்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில்: YHWH; இதை ‘யெகோவா’ என்றும் ஒலிபெயர்க்கலாம்.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பேசி
  rationale: דבר என்பதன் தெய்வீக உரை அறிமுகச் சூத்திரத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது; அடுத்த வசனத்தில் வரும் உரையுடன் தொடர்வதற்காக வினையெச்ச வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: நான்கு எழுத்துகளைக் கொண்ட எபிரெய இறைப்பெயரை ஒரு பட்டமாக மாற்றாமல், தமிழில் நிலைபெற்றுள்ள பெயரெழுத்துப்பெயர்ப்பாக வழங்குகிறது.
- source_word: אֶל מֹשֶׁה
  choice: மோசேயிடம்
  rationale: பேச்சின் பெறுநரை நவீனத் தமிழில் இயல்பாகக் குறிக்கிறது.
- source_word: לֵאמֹר
  choice: ':'
  rationale: அடுத்து நேரடி உரை வருவதைத் தமிழில் முக்காற்புள்ளி இயல்பாகச் சுட்டுகிறது; ‘சொல்லி’ எனத் தனியே மொழிபெயர்த்தால் ‘பேசி’ என்பதுடன் தேவையற்ற மீளுரை ஏற்படும்.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே
  rationale: மூலத்தில் உள்ள தனிப்பட்ட இறைப்பெயரை ‘கர்த்தர்’ போன்ற பட்டத்தால் மாற்றாமல் பாதுகாக்கிறது. அதன் உச்சரிப்பு உறுதியாகத் தெரியாததால் மாற்று வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன, மரியாதையான, வாசிக்க எளிய தமிழ். இது அடுத்த வசனத்தில் தொடங்கும் நேரடி உரைக்கான அறிமுகம் என்பதால், ‘לֵאמֹר’ முக்காற்புள்ளியால் வெளிப்படுத்தப்பட்டுள்ளது.
