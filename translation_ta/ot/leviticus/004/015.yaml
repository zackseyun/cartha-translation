  text: וְ֠/סָמְכוּ זִקְנֵ֨י הָ/עֵדָ֧ה אֶת יְדֵי/הֶ֛ם עַל רֹ֥אשׁ הַ/פָּ֖ר לִ/פְנֵ֣י יְהוָ֑ה וְ/שָׁחַ֥ט אֶת הַ/פָּ֖ר לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/015.yaml
  text: And the elders of the congregation shall lay their hands on the head of the bull before Yahweh[a], and the bull shall be slaughtered before Yahweh.
translation:
  language: ta
  text: சபையின் மூப்பர்கள் யாவே முன்னிலையில் அந்தக் காளையின் தலையின்மேல் தங்கள் கைகளை வைக்க வேண்டும்; பின்னர் ஒருவர் அந்தக் காளையை யாவே முன்னிலையில் அறுக்க வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘மூப்பர்கள்’ என்ற பன்மைக்குப் பின் வினைச்சொல் மூன்றாம் நபர் ஆண்பால் ஒருமைக்கு மாறுகிறது. அல்லது, ‘பின்னர் அந்தக் காளை யாவே முன்னிலையில் அறுக்கப்பட வேண்டும்.’
    reason: alternative_reading
lexical_decisions:
- source_word: וְסָמְכוּ
  choice: வைக்க வேண்டும்
  rationale: பலியிடும் சடங்கில் கைகளைப் பலியின் தலையின்மேல் வைத்து அழுத்தும் செயலைக் குறிக்கிறது; இயல்பான தமிழில் ‘வைக்க வேண்டும்’ தெளிவாக உள்ளது.
- source_word: זִקְנֵי הָעֵדָה
  choice: சபையின் மூப்பர்கள்
  rationale: עֵדָה என்பது ஒன்றுகூடிய உடன்படிக்கைச் சமூகத்தைக் குறிக்கிறது; ‘சபை’ அதன் முறையான சமூகப் பொருளைப் பேணுகிறது.
- source_word: אֶת יְדֵיהֶם
  choice: தங்கள் கைகளை
  rationale: எபிரெய மூலத்தில் உள்ள பன்மையையும், செய்பவர்களைக் குறிக்கும் உரிமைத் தொடர்பையும் நேரடியாகப் பேணுகிறது.
- source_word: עַל רֹאשׁ הַפָּר
  choice: அந்தக் காளையின் தலையின்மேல்
  rationale: சடங்குச் செயலில் உள்ள இடத்தொடர்பைத் துல்லியமாகக் காட்டுகிறது; פַּר என்பதற்கு ‘காளை’ இயல்பான பொருத்தம்.
- source_word: לִפְנֵי יְהוָה
  choice: யாவே முன்னிலையில்
  rationale: לִפְנֵי என்பதன் ‘முன்னிலையில்/சந்நிதியில்’ என்ற பொருளை இயல்பான நவீன தமிழில் தருகிறது; தெய்வீகப் பெயரைத் தலைப்பாக மாற்றவில்லை.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: וְשָׁחַט
  choice: பின்னர் அவன் … அறுத்துப் பலியிட வேண்டும்
  rationale: எபிரெயத்தில் முந்தைய பன்மை எழுவாயிலிருந்து மூன்றாம் நபர் ஆண்பால் ஒருமை வினைக்கு ஏற்படும் மாற்றத்தைப் பேணுகிறது. பலிச் சூழலில் ‘அறுத்துப் பலியிடுதல்’ என்பது வெறும் கொலையைவிடத் துல்லியம்.
- source_word: הַפָּר
  choice: அந்தக் காளையை
  rationale: குறிப்பிட்ட பலிமிருகத்தைச் சுட்டுகிறது; வயது குறித்த தேவையற்ற நுணுக்கத்தைச் சேர்க்கவில்லை.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை எவ்வாறு வழங்குவது
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது; அதை ஒரு பட்டத்தால் மாற்றாமல் ஒலிபெயர்ப்பது மூல வடிவைப் பேணுகிறது.
- issue: וְשָׁחַט என்ற ஒருமை வினையைப் பன்மையாகச் சீராக்கலாமா
  choice: ‘அவன் … அறுத்துப் பலியிட வேண்டும்’ என்று ஒருமையைப் பேணுதல்
  alternative: ‘அவர்கள் அறுத்துப் பலியிட வேண்டும்’ அல்லது ‘காளை அறுத்துப் பலியிடப்பட வேண்டும்’
  rationale: ‘மூப்பர்கள்’ என்ற பன்மைக்குப் பின் எபிரெயம் ஒருமை வினைக்கு மாறுகிறது. பிரதிநிதி ஒருவர் செய்கிறாரா என்பதைத் தெளிவுபடுத்தாமல், அந்த இலக்கணப் பதற்றத்தை மொழிபெயர்ப்பு பேணுகிறது.
translation_notes:
  register: நவீன தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. சட்டவிதியின் கட்டளைத்தன்மைக்காக ‘வேண்டும்’ அமைப்பு வைக்கப்பட்டுள்ளது. ‘அறுத்துப் பலியிட’ என்பது பலிச் சூழலைத் தெளிவாக்கினாலும், எபிரெய வினையின் சடங்குசார் பொருளை மீறவில்லை.
