  source_fidelity: மூல எபிரெயத்தில் ஆசாரியன் விரலை இரத்தத்தில் தோய்த்து, இரத்தத்திலிருந்து எடுத்து, யாவேக்கு முன்பாகவும் பரிசுத்த இடத்தின் திரைச்சீலையின் முன்புறம் நோக்கியும் ஏழுமுறை தெளிக்க வேண்டும். வரைவு இந்தச் சடங்கு வரிசையையும் ‘யாவே’ என்ற இறைப் பெயரையும் சரியாகக் காக்கிறது. ஆனால் מִן־הַדָּם என்பதற்கான ‘அந்த இரத்தத்தில் சிறிதை’ என்பது தமிழில் ‘இரத்தத்தில் உள்ள சிறிது’ எனத் தவறாகப் புரியலாம்; ‘இரத்தத்திலிருந்து சிறிதை’ என்பது பகுதி/மூலப் பொருளைத் துல்லியமாகக் காட்டும்.
  naturalness: ‘ஆசாரியன்,’ ‘தன் விரலை,’ ‘தோய்த்து,’ ‘ஏழுமுறை தெளிக்க வேண்டும்’ ஆகியவை நவீனத் தரத் தமிழில் இயல்பாகவும் சடங்குச் சூழலுக்கேற்றவையாகவும் உள்ளன. இடச்சுட்டுச் சொற்றொடர்களுக்கிடையே காற்புள்ளிகள் இடப்படுவதால் பொருள் தெளிவாகும். அடிக்குறிப்பு அடையாளம் திரைச்சீலைச் சொற்றொடருடன் இணைக்கப்பட வேண்டும்; அது ‘யாவேக்கு முன்பாக’ என்பதன் மாற்றாகத் தோன்றக் கூடாது.
  terminology: ‘யாவே,’ ‘ஆசாரியன்,’ ‘பரிசுத்த இடம்,’ ‘திரைச்சீலை’ ஆகிய சொல் தேர்வுகள் பொருத்தமானவை. פָּרֹכֶת என்பதற்கு ‘திரைச்சீலைக்கு முன்பாக’ என்பது ‘எதிரே’ என்பதைக் காட்டிலும் மூலத்தின் ‘திரைச்சீலையின் முகப்பு/முன்புறம் நோக்கி’ என்ற திசைச் சாயலை நேரடியாக வெளிப்படுத்துகிறது.
