  text: וְ/טָבַ֧ל הַ/כֹּהֵ֛ן אֶת אֶצְבָּע֖/וֹ בַּ/דָּ֑ם וְ/הִזָּ֨ה מִן הַ/דָּ֜ם שֶׁ֤בַע פְּעָמִים֙ לִ/פְנֵ֣י יְהוָ֔ה אֶת פְּנֵ֖י פָּרֹ֥כֶת הַ/קֹּֽדֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/006.yaml
  text: The priest shall dip his finger in the blood and sprinkle some of the blood seven times before Yahweh[a], in front of the curtain of the sanctuary.
translation:
  language: ta
  text: ஆசாரியன் தன் விரலை இரத்தத்தில் தோய்த்து, இரத்தத்திலிருந்து சிறிதை யாவேக்கு முன்பாக, பரிசுத்த இடத்தின் திரைச்சீலைக்கு முன்பாக[a] ஏழுமுறை தெளிக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பரிசுத்த இடத்தின் திரைச்சீலையின் முன்புறம் நோக்கி.”
    reason: אֶת־פְּנֵי פָּרֹכֶת הַקֹּדֶשׁ என்பதில் ‘திரைச்சீலைக்கு முன்பாக’ என்பதன் இடப்பொருளை ‘திரைச்சீலையின் முன்புறம் நோக்கி’ என்றும் மொழிபெயர்க்கலாம். அடிக்குறிப்பு திரைச்சீலைச் சொற்றொடரிலேயே இணைக்கப்பட்டுள்ளது.
lexical_decisions:
- source_word: וְטָבַל
  choice: தோய்த்து
  rationale: சடங்கு வழிமுறையின் தொடர்ச்சியை இயல்பான தமிழில் காட்டுகிறது; טבל என்பதன் அடிப்படைப் பொருள் ஒரு பொருளில் அமிழ்த்தித் தோய்த்தல்.
- source_word: הַכֹּהֵן
  choice: ஆசாரியன்
  rationale: இந்தப் பலிச்சடங்கை நடத்தும் குறிப்பிட்ட ஆசாரியனைக் குறிக்கும் definite singular பெயர்ச்சொல்.
- source_word: אֶצְבָּעוֹ
  choice: தன் விரலை
  rationale: மூன்றாம் ஆண்பால் ஒருமை உடைமை விகுதியைத் தமிழில் இயல்பாகத் தற்சுட்டு வடிவமான ‘தன்’ கொண்டு வெளிப்படுத்துகிறது.
- source_word: בַּדָּם
  choice: இரத்தத்தில்
  rationale: விரல் தோய்க்கப்படும் பொருளை ב குறிக்கிறது.
- source_word: וְהִזָּה
  choice: தெளிக்க வேண்டும்
  rationale: ஆசாரியச் சடங்குகளில் נזה என்பதன் Hiphil வடிவம் சடங்கு முறையில் தெளித்தலைக் குறிக்கிறது; கட்டளைத் தொடரின் force-ஐ ‘வேண்டும்’ வெளிப்படுத்துகிறது.
- source_word: מִן־הַדָּם
  choice: அந்த இரத்தத்தில் சிறிதை
  rationale: מן இங்கு பகுதி சார்ந்த பொருளில் உள்ளது; இரத்தத்தின் ஒரு பகுதி தெளிக்கப்படுவதைத் தெளிவாகக் காட்டுகிறது.
- source_word: שֶׁבַע פְּעָמִים
  choice: ஏழுமுறை
  rationale: எண்ணிக்கையைக் குறிக்கும் இயல்பான தமிழ் வினையடை வடிவம்.
- source_word: לִפְנֵי יְהוָה
  choice: யாவேக்கு முன்பாக
  rationale: לִפְנֵי குறிக்கும் இட/சடங்கு சார்ந்த ‘முன்னிலை’ பொருளையும், יהוה என்ற தனிப்பெயரையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: אֶת־פְּנֵי פָּרֹכֶת הַקֹּדֶשׁ
  choice: பரிசுத்த இடத்தின் திரைச்சீலைக்கு எதிரே
  rationale: פני என்பது இங்கு திரைச்சீலையின் முன்புறத்தை நோக்கிய நிலையைச் சுட்டுகிறது; פָּרֹכֶת என்பது உட்புறத் திரைச்சீலை, הַקֹּדֶשׁ அதன் பரிசுத்த இடத் தொடர்பைக் குறிக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: எபிரெய மூலத்தில் நான்கெழுத்து இறைப் பெயர் நேரடியாக உள்ளது; அதை ஒரு பட்டப்பெயராக மாற்றாமல் தமிழில் ஒலிபெயர்த்துள்ளது.
- issue: פָּרֹכֶת הַקֹּדֶשׁ என்ற வழிபாட்டிடச் சொற்றொடர்
  choice: பரிசுத்த இடத்தின் திரைச்சீலை
  alternative: பரிசுத்த ஸ்தலத்தின் முக்காடு
  rationale: ‘திரைச்சீலை’ என்பது இன்றைய வாசகருக்குத் தெளிவான சொல்; ‘பரிசுத்த இடம்’ என்பது தேவையற்ற கட்டடவியல் நுண்வரையறையைத் திணிக்காமல் sacred area-வைச் சொல்கிறது.
- issue: לִפְנֵי יְהוָה மற்றும் திரைச்சீலைச் சொற்றொடரின் தொடர்பு
  choice: யாவேக்கு முன்பாக, பரிசுத்த இடத்தின் திரைச்சீலைக்கு எதிரே
  alternative: பரிசுத்த இடத்தின் திரைச்சீலைக்கு முன்பாக
  rationale: முதன்மை உரை எபிரெயச் சொல் வரிசையையும் இரு இடச்சுட்டுகளையும் காக்கிறது; மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்பட்டு, உண்மையான தொடரியல்/விளக்க வாய்ப்பு மறைக்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமான ஆனால் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆசாரியன்,’ ‘பரிசுத்த இடம்,’ ‘திரைச்சீலை’ ஆகியவை வாசகருக்கு அறிமுகமான சொற்களாகத் தேர்ந்தெடுக்கப்பட்டுள்ளன; மிகப் பழமையான ‘ஸ்தலம்,’ ‘முக்காடு’ போன்ற வடிவங்கள் தவிர்க்கப்பட்டுள்ளன.
