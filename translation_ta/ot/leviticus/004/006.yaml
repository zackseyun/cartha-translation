  to: ஆசாரியன் தன் விரலை இரத்தத்தில் தோய்த்து, இரத்தத்திலிருந்து சிறிதை யாவேக்கு முன்பாக, பரிசுத்த இடத்தின் திரைச்சீலைக்கு முன்பாக[a] ஏழுமுறை தெளிக்க வேண்டும்.
