  text: or if the sin that he has committed is made known to him[a], then he shall bring as his offering a male goat without blemish.
translation:
  language: ta
  text: அல்லது, தான் செய்த பாவம் அவனுக்குத் தெரிவிக்கப்பட்டால்[a], அவன் பழுதற்ற ஓர் ஆண் வெள்ளாட்டைத் தன் காணிக்கையாகக் கொண்டுவர வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அதிக முறையான வடிவில்: “அவன் செய்த அவனுடைய பாவம் அவனுக்குத் தெரிவிக்கப்பட்டால்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֽוֹ
  choice: அல்லது
  rationale: முந்தைய வசனத்தில் தொடங்கிய சட்ட நிகழ்வின் மாற்றுச் சூழலை அறிமுகப்படுத்தும் எளிய பிரிநிலை இணைப்புச்சொல்.
- source_word: הוֹדַע אֵלָיו
  choice: அவனுக்குத் தெரிவிக்கப்பட்டால்
  rationale: ידע என்பதன் ஹொஃபால் வடிவம் செயப்பாட்டு/காரணச் செயப்பாட்டுப் பொருளுடையது; அவன் தானாக உணர்ந்துகொள்வதைவிட, பாவம் பற்றிய அறிவு அவனுக்குத் தெரிவிக்கப்படுவதை இது காக்கிறது.
- source_word: חַטָּאתוֹ
  choice: தான் செய்த பாவம்
  rationale: இங்கே חטאת என்பது பாவநிவாரணப் பலியைக் குறிக்காமல் குற்றமாகிய பாவத்தைக் குறிக்கிறது; தொடரும் உறவுச்சொற்றொடர் இதைத் தெளிவுபடுத்துகிறது. இயல்பான தமிழுக்காக அடுத்த சொற்றொடருடன் ஒருங்கிணைக்கப்பட்டுள்ளது.
- source_word: אֲשֶׁר חָטָא בָּהּ
  choice: தான் செய்த
  rationale: குறிப்பிட்ட பாவத்தை அடையாளப்படுத்துகிறது. בָּהּ என்ற முன்னிடைச்சொல் חטא உடன் எபிரெயத்தில் மரபுத்தொடராக வருவதால் தமிழில் தனியே மொழிபெயர்க்காமல் இயல்பாக வழங்கப்பட்டுள்ளது.
- source_word: וְהֵבִיא
  choice: கொண்டுவர வேண்டும்
  rationale: சட்ட உரையில் waw உடன் வரும் நிறைவுவினை, முன் கூறிய நிபந்தனைக்கான கட்டாய விளைவைச் சுட்டுகிறது; நவீன தமிழில் ‘வேண்டும்’ இதைத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: קָרְבָּנוֹ
  choice: தன் காணிக்கையாக
  rationale: கடவுளிடம் அணுகக் கொண்டுவரப்படும் அர்ப்பணிப்பைக் குறிக்கிறது; ‘காணிக்கை’ பொதுவாகப் புரியக்கூடிய பலியிடல் சார்ந்த சொல், மேலும் ‘கொண்டுவர’ என்பதுடன் இயல்பாக அமைகிறது.
- source_word: שְׂעִיר עִזִּים
  choice: வெள்ளாடு
  rationale: இச்சொற்றொடர் வெள்ளாட்டினத்தைச் சேர்ந்த ஆட்டைக் குறிக்கிறது; பாலினம் அடுத்த சொல்லால் வெளிப்படையாகக் காக்கப்படுகிறது.
- source_word: זָכָר
  choice: ஆண்
  rationale: பலியிடப்படும் விலங்கின் பாலினத்தை மூல உரை வெளிப்படையாகக் குறிப்பிடுவதால் அது அப்படியே காக்கப்பட்டுள்ளது.
- source_word: תָּמִים
  choice: பழுதற்ற
  rationale: உடற்குறை அல்லது குறைபாடு இல்லாத பலி விலங்கைக் குறிக்கும் வழக்கமான பலியிடல் சொல்; ‘பழுதற்ற’ என்பது சுருக்கமாகவும் தெளிவாகவும் உள்ளது.
theological_decisions:
- issue: இவ்வசனத்தில் חַטָּאת என்பதன் பொருள்
  choice: பாவம்/குற்றம்
  alternative: பாவநிவாரணப் பலி
  rationale: லேவியராகமச் சூழலில் חטאת இரு பொருள்களையும் கொள்ள முடிந்தாலும், ‘தான் செய்த’ என்ற உறவுச்சொற்றொடர் இங்கே அது செய்த குற்றத்தையே குறிக்கிறது எனக் காட்டுகிறது; காணிக்கை பின்னர் קרבנו என்று தனியே குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்ட உரைக்குரிய கண்ணியமான ஆனால் எளிதில் புரியும் நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. செயப்பாட்டு வடிவமும், விலங்கின் பாலினமும், குறையற்ற தன்மையும் காக்கப்பட்டுள்ளன.
