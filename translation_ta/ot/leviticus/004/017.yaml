base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/017.yaml
  text: Then the priest shall dip his finger in some of the blood and sprinkle some of the blood seven times before Yahweh[a], in front of the curtain.
translation:
  language: ta
  text: பின்பு ஆசாரியன் இரத்தத்தில் தன் விரலைத் தோய்த்து, யாவேக்கு முன்பாகத் திரைச்சீலைக்கு முன்னால் இரத்தத்தை ஏழு முறை தெளிக்க வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “திரைச்சீலை” என்பதை “மறைப்புத் திரை” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் பரிசுத்தமான இடங்களைப் பிரிக்கும் வழிபாட்டிடத் திரையைக் குறிக்கிறது.
    reason: פָּרֹכֶת என்பதற்கான சொல்லியல் மாற்றையும் அதன் வழிபாட்டிடச் சிறப்புப் பொருளையும் தெரிவிக்கிறது.
lexical_decisions:
- source_word: וְטָבַל
  choice: பின்பு ... தோய்த்து
  rationale: טבל என்பது ‘தோய்த்தல், அமிழ்த்துதல்’ என்று பொருள்படும். தொடர் சடங்கு நடவடிக்கையை வாவ் வடிவம் காட்டுவதால் ‘பின்பு’ பயன்படுத்தப்பட்டுள்ளது; தமிழில் அடுத்த முதன்மை வினையுடன் இயல்பாக இணைக்க ‘தோய்த்து’ என அமைக்கப்பட்டுள்ளது.
- source_word: הַכֹּהֵן
  choice: ஆசாரியன்
  rationale: லேவியராகமத்தின் பலிச் சட்டச் சூழலில் כהן என்பதற்கான வழக்கமான, புரிந்துகொள்ளத்தக்க தமிழ்ச் சொல்.
- source_word: אֶצְבָּעוֹ
  choice: தன் விரலை
  rationale: ஒருமையையும் வாக்கியத்தின் எழுவாயைச் சுட்டும் உடைமையையும் இயல்பான தமிழில் காக்கிறது.
- source_word: מִן הַדָּם
  choice: அந்த இரத்தத்தில்
  rationale: טבל உடன் வரும் מן, இரத்தத்திலிருந்து ஒரு பகுதியைத் தொட்டுத் தோய்ப்பதைக் குறிக்கிறது. தமிழில் ‘இரத்தத்தில் விரலைத் தோய்த்து’ என்பது கை முழுவதையும் அமிழ்த்துவதாகக் கூறாமல் இயல்பாக அந்தச் செயலை வெளிப்படுத்துகிறது; அடுத்த வினையில் ‘அந்த இரத்தத்தில் சிறிதை’ என்று பகுதி உணர்வு வெளிப்படையாகத் தரப்படுகிறது.
- source_word: וְהִזָּה
  choice: தெளிக்க வேண்டும்
  rationale: הזה என்பது ஆசாரியச் சடங்குகளில் இரத்தம் போன்ற திரவத்தைத் தெளிப்பதைக் குறிக்கிறது. சட்ட அறிவுறுத்தலின் நடைமுறை வலிமையை ‘வேண்டும்’ வெளிப்படுத்துகிறது.
- source_word: שֶׁבַע פְּעָמִים
  choice: ஏழு முறை
  rationale: எண்ணையும் நிகழ்வுகளின் எண்ணிக்கையையும் நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: לִפְנֵי יְהוָה
  choice: யாவேக்கு முன்பாக
  rationale: לִפְנֵי என்பதன் ‘முன்பாக/சந்நிதியில்’ என்ற இடவியல் மற்றும் முன்னிலை உணர்வைக் காக்கிறது; தேவனுடைய தனிப்பெயர் யாவே என ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: אֵת פְּנֵי הַפָּרֹכֶת
  choice: திரைச்சீலைக்கு எதிரே
  rationale: சொல்லடிப்படையில் ‘திரையின் முகப்பு/முன்பக்கம்’ என்ற திசைநோக்கை உடைய இத்தொடரை இயல்பான தமிழில் ‘திரைச்சீலைக்கு எதிரே’ எனத் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பட்டப்பெயர் அல்ல, நான்கெழுத்து இறைப் பெயரே உள்ளது. எனவே தனிப்பெயரை மறைக்காமல் தமிழில் வழக்கமான ஒலிபெயர்ப்பாக ‘யாவே’ பயன்படுத்தப்பட்டுள்ளது.
- issue: פָּרֹכֶת என்பதன் வழிபாட்டிடப் பொருள்
  choice: திரைச்சீலை
  alternative: மறைப்புத் திரை
  rationale: இது பரிசுத்த இடங்களைப் பிரித்த ஆலயக்கூடாரத் திரையைக் குறிக்கிறது. ‘திரைச்சீலை’ சாதாரண வாசகருக்கு இயல்பாக உள்ளது; அதன் பிரிக்கும்/மறைக்கும் பணியை ‘மறைப்புத் திரை’ என்ற மாற்று தெளிவுபடுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சடங்குச் சட்டத்திற்கு ஏற்ற கண்ணியமான அறிவுறுத்தல் நடை பயன்படுத்தப்பட்டுள்ளது. வாக்கியம் இயல்பாக ஓடும்படி சார்பு வினை வடிவமும் ‘வேண்டும்’ முடிவும் பயன்படுத்தப்பட்டுள்ளன; தேவையற்ற சமயப்பிரிவு சார்ந்த சொற்கள் தவிர்க்கப்பட்டுள்ளன.
