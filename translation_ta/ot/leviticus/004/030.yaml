base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/030.yaml
  text: And the priest shall take some of its blood with his finger and put it on the horns of the altar of burnt offering[c][b][a], and he shall pour out all its blood at the base of the altar.
translation:
  language: ta
  text: ஆசாரியன் அதன் இரத்தத்தில் சிறிதைத் தன் விரலால் எடுத்து, தகனபலிக்கான பலிபீடத்தின் கொம்புகளின்மேல் பூச வேண்டும்[a][b]. அதன் இரத்தம் முழுவதையும் பலிபீடத்தின் அடிப்பகுதியில் ஊற்ற வேண்டும்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில் நேரடியாக, “அதன் இரத்தத்திலிருந்து.” இங்கு இரத்தத்தின் ஒரு பகுதியை எடுத்தல் என்ற பொருள் இருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “பலிபீடத்தின் கொம்புகள்” என்பது அதன் மூலைகளிலிருந்த கொம்புபோன்ற நீட்சிகளைக் குறிக்கிறது.
    reason: cultural_note
  - marker: c
    text: “அதன் இரத்தம் முழுவதையும்” என்று மூலவுரை கூறுகிறது. ஆனால் சிறிது இரத்தம் ஏற்கெனவே பூசப்பட்டிருப்பதால், நடைமுறையில் மீதமுள்ள இரத்தம் முழுவதும் ஊற்றப்படுவதே குறிப்பு.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח הַכֹּהֵן
  choice: ஆசாரியன் ... எடுத்து ... வேண்டும்
  rationale: பலிச்சடங்கு குறித்த விதிமுறையின் தொடர்ச்சியாக இருப்பதால், எபிரெய வினை வடிவம் கடந்தகால நிகழ்வாக அல்லாமல் செய்ய வேண்டிய செயலாகத் தமிழில் இயல்பாக வழங்கப்பட்டது.
- source_word: מִדָּמָהּ
  choice: அதன் இரத்தத்தில் சிறிதை
  rationale: מִן இங்கு பகுதியைக் குறிக்கும் இயல்புடையது; அடுத்த செயலில் மீதமுள்ள இரத்தம் ஊற்றப்படுவதால், இரத்தத்தின் ஒரு பகுதி எடுக்கப்படுவதே பொருள்.
- source_word: בְּאֶצְבָּעוֹ
  choice: தன் விரலால்
  rationale: בְּ கருவிப் பொருளில் வருகிறது; ஆசாரியன் இரத்தத்தை எடுக்கும் மற்றும் பூசும் முறையை இது குறிக்கிறது.
- source_word: וְנָתַן עַל
  choice: மேல் பூச வேண்டும்
  rationale: נתן என்பதன் அடிப்படைப் பொருள் ‘வைத்தல்/இடுதல்’; இரத்தத்தை விரலால் பலிபீடக் கொம்புகளில் இடும் சடங்குச் சூழலில் ‘பூசுதல்’ என்பது இயல்பான, அளவுக்கு மீறாத தமிழ்.
- source_word: קַרְנֹת מִזְבַּח הָעֹלָה
  choice: தகனபலிப் பலிபீடத்தின் கொம்புகள்
  rationale: קֶרֶן என்பதன் நேரடியான சடங்கியல் உருவகத்தை ‘கொம்புகள்’ என்று காக்கிறது; מִזְבַּח הָעֹלָה என்பது தகனபலிக்குரிய பலிபீடத்தைக் குறிக்கிறது.
- source_word: וְאֶת כָּל דָּמָהּ
  choice: அதன் இரத்தம் முழுவதையும்
  rationale: כָּל என்பதன் முழுமைப் பொருள் பிரதான உரையில் காக்கப்பட்டது; முன்பே சிறிது பயன்படுத்தப்பட்டதால் நடைமுறையில் மீதமுள்ள இரத்தமே குறிக்கப்படுகிறது என்பதை அடிக்குறிப்பு விளக்குகிறது.
- source_word: יִשְׁפֹּךְ
  choice: ஊற்ற வேண்டும்
  rationale: שׁפך பலிச்சடங்கு சூழலில் இரத்தத்தை ஊற்றுவதைக் குறிக்கும் தெளிவான சொல்.
- source_word: אֶל יְסוֹד הַמִּזְבֵּחַ
  choice: பலிபீடத்தின் அடிப்பகுதியில்
  rationale: יְסוֹד என்பது அடித்தளம் அல்லது அடிப்பகுதி; பலிபீடச் சூழலில் ‘அடிப்பகுதி’ நவீன தமிழில் தெளிவாக உள்ளது.
theological_decisions:
- issue: பலிச்சடங்கு விதிமுறையின் வினைநிலை
  choice: ‘எடுத்து ... பூச வேண்டும் ... ஊற்ற வேண்டும்’ எனக் கட்டளையுருவில் மொழிபெயர்த்தல்
  alternative: ‘எடுத்தான் ... பூசினான் ... ஊற்றினான்’ எனக் கடந்தகால நிகழ்வாக மொழிபெயர்த்தல்
  rationale: இது ஒருமுறை நிகழ்ந்த வரலாற்றுக் கதை அல்ல; தொடர்ச்சியான சட்ட-சடங்கு அறிவுறுத்தல். ஆகவே கடமையைக் குறிக்கும் தமிழ் வடிவம் வகையைப் பாதுகாக்கிறது.
- issue: பலிபீடத்தின் சடங்கியல் உறுப்புக்கான சொல்
  choice: ‘கொம்புகள்’ என்ற நேரடிச் சொல்லைக் காத்தல்
  alternative: ‘மூலைகள்’ அல்லது ‘கொம்புபோன்ற நீட்சிகள்’ என்று பிரதான உரையிலேயே விளக்குதல்
  rationale: எபிரெயச் சடங்கியல் படிமம் குறிப்பிட்டதும் பொருளுள்ளதுமானதால் அதைச் சுருக்காமல் வைத்துக் கொண்டு, வடிவத்தை அடிக்குறிப்பில் விளக்குவது ஏற்றது.
- issue: ‘முழுவதும்’ என்பதற்கும் முன்பு எடுக்கப்பட்ட சிறு பகுதிக்கும் இடையிலான பதற்றம்
  choice: பிரதான உரையில் ‘இரத்தம் முழுவதையும்’ என எபிரெயை அப்படியே காத்தல்
  alternative: ‘மீதமுள்ள இரத்தம் முழுவதையும்’ என வெளிப்படையாகத் தெளிவுபடுத்தல்
  rationale: சூழல் மீதமுள்ள இரத்தத்தைக் குறித்தாலும், மூலத்தில் ‘மீதமுள்ள’ என்ற சொல் இல்லை. ஆகவே உண்மையான மொழிசார் பதற்றத்தை பிரதான உரையில் காத்து அடிக்குறிப்பில் விளக்குகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் பலிச்சடங்கின் கண்ணியமான சொற்தொனியையும் காக்கும் வகையிலும் மொழிபெயர்க்கப்பட்டது. ‘ஆசாரியன்,’ ‘தகனபலி,’ ‘பலிபீடம்,’ ‘கொம்புகள்’ ஆகிய நிலைபெற்ற வேதாகமச் சொற்கள் பயன்படுத்தப்பட்டன; தேவையற்ற சமயப் பிரிவுசார் விளக்கங்கள் சேர்க்கப்படவில்லை.
