  terminology: “ஆசாரியன்,” “பாவநிவாரணப் பலி,” “எரிபலிப் பீடம்,” and “கொம்புகள்” are consistent, comprehensible biblical-register terms. The footnote preserves the lexical range of חַטָּאת without imposing a doctrinal interpretation.
