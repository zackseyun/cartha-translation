source:
  edition: WLC
  text: וְ/לָקַ֨ח הַ/כֹּהֵ֜ן מִ/דַּ֤ם הַֽ/חַטָּאת֙ בְּ/אֶצְבָּע֔/וֹ וְ/נָתַ֕ן עַל קַרְנֹ֖ת מִזְבַּ֣ח הָ/עֹלָ֑ה וְ/אֶת דָּמ֣/וֹ יִשְׁפֹּ֔ךְ אֶל יְס֖וֹד מִזְבַּ֥ח הָ/עֹלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/025.yaml
  text: Then the priest shall take some of the blood of the sin offering with his finger and put it on the horns of the altar of burnt offering[a], and he shall pour out the rest of its blood at the base of the altar of burnt offering.
translation:
  language: ta
  text: பின்பு ஆசாரியன் பாவநிவாரணப் பலியின்[a] இரத்தத்தில் கொஞ்சத்தைத் தன் விரலால் எடுத்து, எரிபலிப் பீடத்தின் கொம்புகளின்மேல் பூச வேண்டும். மீதமுள்ள இரத்தத்தை எரிபலிப் பீடத்தின் அடிப்பகுதியில் ஊற்ற வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தூய்மையாக்கும் பலி.” எபிரெயச் சொல் பாவத்தை நீக்குவதோடு, சடங்கு அசுத்தத்தை அகற்றுவதுடன் தொடர்புடைய பலியையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: பின்பு ... எடுத்து
  rationale: வாவ் + கத்தால் வடிவம் சடங்கின் அடுத்த செயலைத் தொடர்கிறது; நவீன தமிழில் படிநிலையை இயல்பாகக் காட்டுகிறது.
- source_word: מִדַּם
  choice: இரத்தத்தில் கொஞ்சத்தை
  rationale: מִן இங்கு பகுதியைக் குறிக்கிறது; இரத்தம் முழுவதும் அல்ல, அதில் ஒரு பகுதியே விரலால் எடுக்கப்படுகிறது.
- source_word: הַחַטָּאת
  choice: பாவநிவாரணப் பலி
  rationale: இச்சடங்குச் சூழலில் இச்சொல் வெறும் ‘பாவம்’ என்பதை அல்ல, பாவத்தோடும் தூய்மையாக்கத்தோடும் தொடர்புடைய பலியைக் குறிக்கிறது. தமிழில் ‘பாவநிவாரணப் பலி’ என்பது வழிபாட்டுச் செயலின் நோக்கைத் தெளிவாகத் தெரிவிக்கிறது; மாற்று அர்த்தம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בְּאֶצְבָּעוֹ
  choice: தன் விரலால்
  rationale: בְּ இங்கு கருவிப் பொருளைக் குறிக்கிறது; ஆசாரியன் தன் விரலைப் பயன்படுத்துகிறான்.
- source_word: וְנָתַן עַל
  choice: மேல் பூச வேண்டும்
  rationale: இரத்தத்தைப் பலிபீடக் கொம்புகளின்மேல் இடும் சடங்கு நடவடிக்கையை இயல்பான தமிழில் ‘பூச’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: קַרְנוֹת
  choice: கொம்புகள்
  rationale: பலிபீடத்தின் கொம்புபோன்ற நீட்சிகளுக்கான வழக்கமான, நேரடியான சொல்.
- source_word: מִזְבַּח הָעֹלָה
  choice: எரிபலிப் பீடம்
  rationale: எரிபலியுடன் தொடர்புடைய வெளிப்புறப் பலிபீடத்தைக் குறிக்கும் சுருக்கமான, இயல்பான தமிழ் வடிவம்.
- source_word: וְאֶת דָּמוֹ יִשְׁפֹּךְ
  choice: மீதமுள்ள இரத்தத்தை ... ஊற்ற வேண்டும்
  rationale: முன்பு இரத்தத்தில் கொஞ்சம் எடுக்கப்பட்டதால், இங்கு ஊற்றப்படுவது எஞ்சிய இரத்தம் என்பது தொடரிலிருந்து தெளிவாகிறது; ‘மீதமுள்ள’ என்பது அந்த உட்குறிப்பை வெளிப்படுத்துகிறது.
- source_word: אֶל יְסוֹד
  choice: அடியில்
  rationale: יְסוֹד பலிபீடத்தின் அடிப்பகுதி அல்லது அஸ்திவாரப் பகுதியைக் குறிக்கிறது; ‘அடியில்’ என்பது செயல் நிகழும் இடத்தை இயல்பாகத் தருகிறது.
theological_decisions:
- issue: பலிச் சட்டங்களில் חַטָּאת என்பதன் மொழிபெயர்ப்பு
  choice: பாவநிவாரணப் பலி
  alternative: தூய்மையாக்கும் பலி
  rationale: எபிரெயச் சொல் பாவத்தையும் அசுத்தத்தை அகற்றும் சடங்கையும் சார்ந்த பலியைக் குறிக்க முடியும். ‘பாவநிவாரணப் பலி’ பாரம்பரிய பலிவகையை வாசகருக்குத் தெளிவாக்குகிறது; தூய்மையாக்கத்தை வலியுறுத்தும் மாற்று மொழிபெயர்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சடங்குச் சட்டத்திற்கேற்ற கண்ணியமான கட்டளைநடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆசாரியன்’, ‘எரிபலி’, ‘பலிபீடம்’, ‘கொம்புகள்’ ஆகியவை பொதுவாகப் புரிந்துகொள்ளக்கூடிய வேதாகம வழிபாட்டுச் சொற்களாக வைக்கப்பட்டுள்ளன.
