theological_decisions:
- issue: பலிச் சட்டத்தில் חַטָּאת என்பதன் மொழிபெயர்ப்பு
  choice: பாவநிவாரணப் பலி
  alternative: சுத்திகரிப்புப் பலி
  rationale: חַטָּאת பாவத்தைக் கையாளும் பலிவகையைக் குறிக்கும் அதேவேளையில், சடங்குசார் அசுத்தத்திலிருந்து சுத்திகரிப்பையும் வலியுறுத்தக்கூடும். முதன்மை உரையில் பரவலாகப் புரியும் பெயர் வைக்கப்பட்டு, உண்மையான சொற்பொருள் நுட்பம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், பலிச் சட்டத்திற்கேற்ற கண்ணியமான அறிவுறுத்தல் நடை பயன்படுத்தப்பட்டுள்ளது. ‘செம்மறியாட்டுக் குட்டி’ என்பது விலங்கின் வகையைத் தெளிவாக்குகிறது; ‘பெண் குட்டியையே’ என்பது எபிரெய மூலத்தின் பெண்பால் வலியுறுத்தலை இயல்பாகத் தக்கவைக்கிறது.
