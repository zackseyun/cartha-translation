  text: וְ/אֶת ע֤וֹר הַ/פָּר֙ וְ/אֶת כָּל בְּשָׂר֔/וֹ עַל רֹאשׁ֖/וֹ וְ/עַל כְּרָעָ֑י/ו וְ/קִרְבּ֖/וֹ וּ/פִרְשֽׁ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/011.yaml
  text: But the hide of the bull[a], and all its flesh[c][b], with its head and with its legs and its entrails and its dung—
translation:
  language: ta
  text: ஆனால் காளையின் தோலையும், அதன் இறைச்சி முழுவதையும், அதன் தலையோடும் கால்களோடும், அதன் உள்ளுறுப்புகளையும் சாணத்தையும்—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עוֹר
  choice: தோல்
  rationale: பலியிடப்பட்ட விலங்கின் உடலிலிருந்து உரிக்கப்பட்ட தோலைக் குறிக்கும் இயல்பான, நேரடியான தமிழ் சொல்.
- source_word: הַפָּר
  choice: காளை
  rationale: פַּר என்பது காளை அல்லது இளம் காளையைக் குறிக்கலாம்; இங்கு வயதைக் குறிப்பாக வலியுறுத்தாததால் ‘காளை’ போதுமானது.
- source_word: כָּל בְּשָׂרוֹ
  choice: அதன் இறைச்சி முழுவதையும்
  rationale: בָּשָׂר என்பதன் உடல்சார்ந்த பொருளை பலியிடும் சூழலில் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: עַל רֹאשׁוֹ וְעַל כְּרָעָיו
  choice: அதன் தலையோடும் கால்களோடும்
  rationale: இந்தப் பட்டியலில் עַל என்பது உறுப்புகளையும் சேர்த்து எடுத்துச் செல்வதைக் குறிக்கிறது; சொற்படியான ‘மேல்’ என்பதைக் காட்டிலும் ‘-ஓடும்’ இயல்பாகவும் பொருத்தமாகவும் உள்ளது.
- source_word: וְקִרְבּוֹ
  choice: அதன் குடல்களையும்
  rationale: பலியிடும் உடற்கூறு சூழலில் קֶרֶב குறிக்கும் உள்ளுறுப்புகளைக் குறிப்பாகவும் பொதுமக்களுக்கு புரியுமாறும் தெரிவிக்கிறது.
- source_word: וּפִרְשׁוֹ
  choice: சாணத்தையும்
  rationale: פֶּרֶשׁ என்பது விலங்கின் கழிவு அல்லது சாணத்தைக் குறிப்பாகக் குறிக்கிறது; குடல்களிலிருந்து இதைத் தெளிவாக வேறுபடுத்துகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், பலிச்சடங்கின் உடற்கூறு விவரங்களை நேரடியாகவும் கண்ணியமாகவும் வழங்கப்பட்டுள்ளது. முந்தைய வசனத்திலிருந்து தொடரும் வாக்கிய அமைப்பைக் காட்ட இறுதியில் நீண்ட கோடு வைக்கப்பட்டுள்ளது.
