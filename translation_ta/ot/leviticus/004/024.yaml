revisions:
- from: அவன் அந்த ஆட்டுக்கடாவின் தலையின்மேல் தன் கையை வைத்து, யெகோவாவின் முன்னிலையில் தகனபலியை அறுக்கும் இடத்தில் அதை அறுக்க வேண்டும். அது பாவநிவாரணப் பலி.[a]
  to: அவன் ஆட்டுக்கடாவின் தலையின்மேல் தன் கையை வைத்து, யெகோவாவின் முன்னிலையில் தகனபலியை அறுக்கும் இடத்தில் அதை அறுக்க வேண்டும். அது பாவப்பலி.[a]
