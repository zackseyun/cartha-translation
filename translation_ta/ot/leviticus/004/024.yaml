base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/024.yaml
  text: And he shall lay his hand on the head of the goat and slaughter it in the place where they slaughter the burnt offering before Yahweh[a]. It is a sin offering.
translation:
  language: ta
  text: அவன் ஆட்டுக்கடாவின் தலையின்மேல் தன் கையை வைத்து, யெகோவாவின் முன்னிலையில் தகனபலியை அறுக்கும் இடத்தில் அதை அறுக்க வேண்டும். அது பாவப்பலி.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அது தூய்மைப்படுத்தும் பலி.” எபிரெயச் சொல் חַטָּאת, “பாவம்” என்பதையும் பாவம் அல்லது தீட்டை அகற்றுவதோடு தொடர்புடைய பலியையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָמַךְ יָדוֹ
  choice: தன் கையை வைத்து
  rationale: பலியிடும் சடங்கில் விலங்கின் தலையின்மேல் கையை வைக்கும் செயலை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; எபிரெயில் உள்ள ஒருமையையும் காக்கிறது.
- source_word: עַל רֹאשׁ הַשָּׂעִיר
  choice: அந்த ஆட்டுக்கடாவின் தலையின்மேல்
  rationale: שָׂעִיר இச்சூழலில் ஆண் வெள்ளாட்டைக் குறிக்கிறது; ‘ஆட்டுக்கடா’ அதைச் சுருக்கமாகவும் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: וְשָׁחַט אֹתוֹ
  choice: அதை அறுக்க வேண்டும்
  rationale: שׁחט என்பது பலிச்சடங்குக்குரிய அறுத்தலைக் குறிக்கும்; பொதுவான ‘கொல்லுதல்’ என்பதைவிட ‘அறுத்தல்’ இச்சூழலுக்கு துல்லியமானது.
- source_word: בִּמְקוֹם אֲשֶׁר יִשְׁחַט אֶת הָעֹלָה
  choice: தகனபலியை அறுக்கும் இடத்தில்
  rationale: எபிரெய செயப்பாட்டு வினையின் செயல்நிலைத் தன்மையை தமிழில் இயல்பாகத் தெரிவிக்கிறது; עֹלָה என்பதற்கான நிலைபெற்ற தமிழ் பலிச்சொல் ‘தகனபலி’.
- source_word: לִפְנֵי יְהוָה
  choice: யெகோவாவின் முன்னிலையில்
  rationale: לִפְנֵי என்பதன் முன்னிலை/சந்நிதி பொருளைத் தெளிவாகக் காக்கிறது; יהוה என்ற உடன்படிக்கைப் பெயர் தமிழில் பரவலாக அறியப்படும் ‘யெகோவா’ என ஒலிபெயர்க்கப்படுகிறது.
- source_word: חַטָּאת הוּא
  choice: அது பாவநிவாரணப் பலி
  rationale: இங்கு חַטָּאת அந்த விலங்கு அல்லது சடங்கை ஒரு குறிப்பிட்ட பலிவகையாக அடையாளப்படுத்துகிறது. ‘பாவநிவாரணப் பலி’ நிலைபெற்ற தமிழ்ச் சொல்லாகும்; தூய்மைப்படுத்தும் பலி என்ற சாத்தியமான நுண்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே
  rationale: மூலத்தில் வரும் தனிப்பட்ட உடன்படிக்கைப் பெயரைப் பொதுப் பட்டமான ‘கர்த்தர்’ என்று மாற்றாமல் ஒலிபெயர்க்கிறது. தமிழ் வாசகர்களிடையே நிலைபெற்ற வடிவமாக ‘யெகோவா’ தேர்ந்தெடுக்கப்பட்டது; ‘யாவே’ என்பது மாற்று ஒலிபெயர்ப்பு.
- issue: חַטָּאת என்பதன் பலிச்சடங்கு சார்ந்த பொருள்
  choice: பாவநிவாரணப் பலி
  alternative: தூய்மைப்படுத்தும் பலி
  rationale: இச்சொல் பாவத்தையும், பாவம் அல்லது தீட்டுடன் தொடர்புடைய பலியையும் குறிக்கலாம். பிரதான உரையில் மரபாகத் தெளிவான பலிவகைப் பெயர் பயன்படுத்தப்பட்டு, தூய்மைப்படுத்துதல் சார்ந்த நுண்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பலிச்சட்டத்திற்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கட்டளையைக் குறிக்க ‘வேண்டும்’ அமைப்பும், பலிச்சடங்குச் சொற்களாக ‘அறுக்க’, ‘தகனபலி’, ‘பாவநிவாரணப் பலி’ என்பவையும் பயன்படுத்தப்பட்டுள்ளன.
