  text: וְ/אֶת כָּל חֶלְבּ/וֹ֙ יַקְטִ֣יר הַ/מִּזְבֵּ֔חָ/ה כְּ/חֵ֖לֶב זֶ֣בַח הַ/שְּׁלָמִ֑ים וְ/כִפֶּ֨ר עָלָ֧י/ו הַ/כֹּהֵ֛ן מֵ/חַטָּאת֖/וֹ וְ/נִסְלַ֥ח לֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/026.yaml
  text: And he shall burn all its fat on the altar[a], like the fat of the sacrifice of peace offerings. Thus the priest shall make atonement for him for his sin[b], and he shall be forgiven.
translation:
  language: ta
  text: அதன் கொழுப்பு முழுவதையும், சமாதானப் பலியின்[a] கொழுப்பைப் புகையாக்குவதுபோல, பலிபீடத்தின் மேல் எரித்துப் புகையாக்குவான். இவ்வாறு ஆசாரியன் அவனுடைய பாவத்திற்காக[b] அவனுக்குப் பாவநிவிர்த்தி செய்வான்; அவனுக்கு மன்னிக்கப்படும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சமாதானப் பலி’ என்பதை ‘உறவுப் பலி’ அல்லது ‘நல்வாழ்வுப் பலி’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயச் சொல் חַטָּאת என்பது ‘பாவம்’ அல்லது ‘பாவநிவாரணப் பலி’ எனப் பொருள்படலாம்; இங்கு அது பெரும்பாலும் அவனுடைய பாவத்தையே குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶלְבּוֹ
  choice: அதன் கொழுப்பு
  rationale: பலியிடப்படும் விலங்கிலிருந்து பலிபீடத்தில் எரிக்க ஒதுக்கப்பட்ட கொழுப்புப் பகுதிகளை חֵלֶב குறிக்கிறது. உடைமைப் பின்னொட்டை ‘அதன்’ என வெளிப்படுத்துவது இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: יַקְטִיר
  choice: எரித்துப் புகையாக்க வேண்டும்
  rationale: பலியிடும் சூழலில் קטר என்பதன் ஹிபில் வடிவம் பலிபீடத்தில் எரித்துப் புகையெழச் செய்வதைக் குறிக்கிறது. ‘எரித்துப் புகையாக்க’ என்பது செயலும் அதன் சடங்குசார் நுட்பமும் இரண்டையும் காக்கிறது.
- source_word: הַמִּזְבֵּחָה
  choice: பலிபீடத்தின் மேல்
  rationale: எபிரெயச் சொல்லின் திசைநோக்குப் பொருள் பலிபீடத்தை நோக்கிய செயலைக் காட்டினாலும், தமிழில் பலியைக் கொழுப்பை எரிக்கும் இடமாக இயல்பாகக் குறிப்பிடுவது ‘பலிபீடத்தின் மேல்’ என்பதாகும்.
- source_word: כְּחֵלֶב זֶבַח הַשְּׁלָמִים
  choice: சமாதானப் பலியின் கொழுப்பை எரிப்பதுபோல
  rationale: இச்சொற்றொடர் இந்தக் கொழுப்பைக் கையாளும் முறையை שְׁלָמִים பலியின் வழக்கமான முறையுடன் ஒப்பிடுகிறது. ‘சமாதானப் பலி’ என்பது அறியப்பட்ட பலிவகைப் பெயராக இருப்பதுடன், மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: וְכִפֶּר עָלָיו
  choice: அவனுக்குப் பாவநிவிர்த்தி செய்வார்
  rationale: ஆசாரிய பலிச் சூழலில் כפר என்பது குற்றத்தின் விளைவை நீக்கி ஒருவருக்காக நிவிர்த்தி செய்வதைக் குறிக்கிறது. ‘பாவநிவிர்த்தி’ என்பது குறிப்பிட்ட ஓர் மீட்புக் கோட்பாட்டைத் திணிக்காமல் சடங்குசார் பொருளைக் காக்கிறது.
- source_word: מֵחַטָּאתוֹ
  choice: அவனுடைய பாவத்திற்காக
  rationale: חַטָּאת என்பது ‘பாவம்’ அல்லது ‘பாவநிவாரணப் பலி’ என இருபொருள் கொள்ளக்கூடியது. இங்கு ஒருவனுக்காக நிவிர்த்தி செய்யப்பட்டு அவனுக்கு மன்னிப்பு கிடைப்பதால், குற்றத்தையே குறிக்கும் ‘பாவம்’ என்பது சூழலுக்கு மிகவும் பொருத்தமானது.
- source_word: וְנִסְלַח לוֹ
  choice: அவனுக்கு மன்னிப்பு அளிக்கப்படும்
  rationale: סלח என்பதன் நிபால் வடிவமும் לֹו என்பதும் மன்னிப்பைப் பெறும் நபரைச் சுட்டுகின்றன. எழுவாய் குறிப்பிடப்படாத இறைச் செயலைத் தீர்மானித்து வெளிப்படுத்தாமல், தமிழில் இயல்பான செயப்பாட்டு வடிவம் பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: שְׁלָמִים என்ற பலிச் சொல்லின் மொழிபெயர்ப்பு
  choice: சமாதானப் பலி
  alternative: உறவுப் பலி; நல்வாழ்வுப் பலி
  rationale: இச்சொல் முழுமை, நல்வாழ்வு, சமாதானம், உறவுணர்வு ஆகிய பொருள் நிழல்களைக் கொண்டது. அறியப்பட்ட பலிவகைப் பெயராக ‘சமாதானப் பலி’ முதன்மை உரையில் வைக்கப்பட்டு, அதன் பரந்த பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: מֵחַטָּאתוֹ என்பதில் חַטָּאת-இன் பொருள்
  choice: அவனுடைய பாவத்திற்காக
  alternative: அவனுடைய பாவநிவாரணப் பலியிலிருந்து / அவனுடைய பாவநிவாரணப் பலிக்காக
  rationale: லேவியராகமத்தில் חַטָּאת குற்றத்தையும் அதற்கான பலியையும் குறிக்கலாம். ஆனால் இங்கு ஆசாரியர் அந்த நபருக்காக நிவிர்த்தி செய்வதும், தொடர்ந்து அவனுக்கு மன்னிப்பு அளிக்கப்படுவதும் ‘பாவம்’ என்ற பொருளையே வலுப்படுத்துகின்றன; இருப்பினும் சொல்வழி இருபொருள் வாய்ப்பு அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ஆசாரியச் சடங்கின் தொழில்நுட்பப் பொருளைக் காக்க ‘பலிபீடம்’, ‘பாவநிவிர்த்தி’ போன்ற நிலையான சொற்கள் பயன்படுத்தப்பட்டுள்ளன. இறைச் செயலை வெளிப்படையாகப் பெயரிடாத எபிரெயச் செயப்பாட்டு அமைப்பு ‘மன்னிப்பு அளிக்கப்படும்’ எனப் பாதுகாக்கப்பட்டுள்ளது.
