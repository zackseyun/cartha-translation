base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/009.yaml
  text: and the two kidneys[a], and the fat that is on them, which is on the loins, and the appendage on the liver, along with the kidneys, he shall remove it.
translation:
  language: ta
  text: இரண்டு சிறுநீரகங்களையும், அவற்றின்மேலும் விலாப்புறங்களின்மேலும் இருக்கும் கொழுப்பையும், சிறுநீரகங்களோடு சேர்த்து கல்லீரலின்மேல் இருக்கும் இணைப்புப் பகுதியையும்[a] அவன் அகற்ற வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கல்லீரலின் மடல்.” இந்த உடற்கூறியல் பகுதியைக் குறிக்கும் எபிரெயச் சொல்லின் துல்லியமான பொருள் உறுதியற்றது; “இணைப்புப் பகுதி” என்பது எச்சரிக்கையான மொழிபெயர்ப்பு.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: இரண்டு சிறுநீரகங்கள்
  rationale: எபிரெயச் சொற்றொடர் இரண்டு உறுப்புகளையும் வெளிப்படையாக எண்ணிக் குறிப்பிடுகிறது; நவீன தமிழில் இது தெளிவான உடற்கூறியல் குறிப்பு.
- source_word: הַחֵלֶב
  choice: கொழுப்பு
  rationale: லேவியராகமத்தின் பலிச் சடங்கு சூழலில் பலிக்காக ஒதுக்கப்பட்ட கொழுப்புப் பகுதிகளைக் குறிக்கிறது; ‘கொழுப்பு’ பொதுவாகப் புரியும் இயல்பான சொல்.
- source_word: אֲשֶׁר עֲלֵיהֶן
  choice: அவற்றின்மேல் இருக்கும்
  rationale: உறவுப்பெயர் வாக்கியம் சிறுநீரகங்களைக் குறிப்பிட்டு, கொழுப்பின் இருப்பிடத்தை நேரடியாகச் சொல்கிறது.
- source_word: הַכְּסָלִים
  choice: இடுப்புப் பகுதிகள்
  rationale: இச்சடங்கு சார்ந்த உடற்கூறியல் சூழலில் இடுப்பு அல்லது விலாப்புறப் பகுதிகளைக் குறிக்கிறது; ‘இடுப்புப் பகுதிகள்’ மிகையாகத் துல்லியப்படுத்தாமல் இயல்பான தமிழை வழங்குகிறது.
- source_word: הַיֹּתֶרֶת עַל הַכָּבֵד
  choice: கல்லீரலின்மேல் இருக்கும் இணைப்புப் பகுதி
  rationale: יוֹתֶרֶת குறிக்கும் துல்லியமான உடற்கூறியல் பகுதி உறுதியற்றது. ‘இணைப்புப் பகுதி’ அந்த நிச்சயமின்மையைப் பேணுகிறது; ‘கல்லீரலின்மேல்’ என்பது עַל என்ற முன்னிடைச்சொல்லை வெளிப்படுத்துகிறது.
- source_word: עַל הַכְּלָיוֹת
  choice: சிறுநீரகங்களோடு சேர்த்து
  rationale: மீண்டும் வரும் பலிச் சடங்கு வாய்பாட்டில், கல்லீரல் சார்ந்த பகுதி சிறுநீரகங்களுடன் அகற்றப்படுவதைக் குறிக்கிறது; தமிழில் சடங்குச் செயலின் கூட்டிணைப்பைத் தெளிவாக்குகிறது.
- source_word: יְסִירֶנָּה
  choice: அவன் அகற்ற வேண்டும்
  rationale: Hiphil வடிவம் குறிப்பிட்ட பகுதிகளை நீக்குவதைக் குறிக்கிறது. ‘வேண்டும்’ என்பது நடைமுறைச் சட்டத்தின் கட்டாயத் தன்மையை இயல்பான நவீன தமிழில் தருகிறது; பட்டியலிடப்பட்ட பல பகுதிகளைத் தமிழ் வாக்கிய அமைப்பில் ஒருங்கிணைக்கிறது.
