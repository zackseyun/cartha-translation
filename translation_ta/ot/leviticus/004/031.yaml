source:
  edition: WLC
  text: וְ/אֶת כָּל חֶלְבָּ֣/הּ יָסִ֗יר כַּ/אֲשֶׁ֨ר הוּסַ֣ר חֵלֶב֮ מֵ/עַ֣ל זֶ֣בַח הַ/שְּׁלָמִים֒ וְ/הִקְטִ֤יר הַ/כֹּהֵן֙ הַ/מִּזְבֵּ֔חָ/ה לְ/רֵ֥יחַ נִיחֹ֖חַ לַ/יהוָ֑ה וְ/כִפֶּ֥ר עָלָ֛י/ו הַ/כֹּהֵ֖ן וְ/נִסְלַ֥ח לֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/031.yaml
  text: And he shall remove all its fat[a], just as the fat is removed from the sacrifice of peace offerings, and the priest shall burn it on the altar as a pleasing aroma to Yahweh. And the priest shall make atonement for him[b], and he will be forgiven.
translation:
  language: ta
  text: அதன் கொழுப்பு முழுவதையும், சமாதானப் பலியின்[a] கொழுப்பு நீக்கப்படுவதுபோல, அவன் நீக்க வேண்டும். யெகோவாவுக்கு இனிய நறுமணமாக[b] ஆசாரியர் அதை பலிபீடத்தின்மேல் எரிக்க வேண்டும். ஆசாரியர் அவனுக்காகப் பாவநிவிர்த்தி செய்வார்; அவன் மன்னிக்கப்படுவான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நல்லுறவுப் பலி.’
    reason: lexical_alternative
  - marker: b
    text: ‘இனிய நறுமணம்’ என்பது யெகோவாவால் ஏற்றுக்கொள்ளப்படும் காணிக்கையைக் குறிக்கும் நிலையான பலிமுறைச் சொற்றொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: חֶלְבָּהּ / חֵלֶב
  choice: கொழுப்பு
  rationale: பலியிலிருந்து நீக்கி எரிக்கப்படும் கொழுப்பைக் குறிக்கிறது. ‘கொழுப்புப் பகுதிகள்’ என்பது சாத்தியமான விளக்கமாயினும், எபிரெயச் சொல்லைவிடக் கூடுதல் குறிப்பைச் சேர்க்கும்.
- source_word: יָסִיר
  choice: நீக்க வேண்டும்
  rationale: சட்டவழிமுறையின் கட்டாயத் தன்மையை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: כַּאֲשֶׁר הוּסַר
  choice: நீக்கப்படுவதுபோல
  rationale: சமாதானப் பலிக்குரிய ஏற்கெனவே நிலைபெற்ற நடைமுறையுடன் செய்யப்படும் ஒப்பீட்டைப் பாதுகாக்கிறது.
- source_word: זֶבַח הַשְּׁלָמִים
  choice: சமாதானப் பலி
  rationale: லேவியராகமத்தின் பலிவகையை நேரடியாகவும் மரபாகவும் குறிக்கிறது; ‘நல்லுறவுப் பலி’ என்ற பொருள் மாற்றை அடிக்குறிப்பில் தருகிறது.
- source_word: וְהִקְטִיר
  choice: எரிக்க வேண்டும்
  rationale: பலிபீடச் சூழலில் பலிப்பொருளை எரிப்பதைக் குறிக்கும் வினையைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: הַמִּזְבֵּחָה
  choice: பலிபீடத்தின்மேல்
  rationale: பலிச் சூழலுக்குரிய திசை/இடப் பொருளைத் துல்லியமாகத் தருகிறது.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: இனிய நறுமணமாக
  rationale: கடவுளால் ஏற்றுக்கொள்ளப்படும் பலியைக் குறிக்கும் நிலையான பலிமுறை உருவகத்தைத் தீர்வுரை செய்யாமல் பாதுகாக்கிறது.
- source_word: לַיהוָה
  choice: யெகோவாவுக்கு
  rationale: மூலத்தில் உள்ள தெய்வீகப் பெயரை பட்டப்பெயராக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: וְכִפֶּר עָלָיו
  choice: ஆசாரியர் அவனுக்காகப் பாவநிவிர்த்தி செய்வார்
  rationale: ஆசாரியரின் பலிசார் செயலைக் குறிக்கும் நிலையான மொழியைப் பயன்படுத்தி, அது குற்றவாளியின் சார்பாகச் செய்யப்படுவதைத் தெளிவாக்குகிறது.
- source_word: וְנִסְלַח לוֹ
  choice: அவன் மன்னிக்கப்படுவான்
  rationale: மன்னிப்பு அவனுக்கு வழங்கப்படும் விளைவை எபிரெயத்தின் செயப்பாட்டு வடிவுக்கு இணையாக இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: וְכִפֶּר עָלָיו ... וְנִסְלַח לוֹ என்ற பலிசார் சூத்திரத்தின் மொழிபெயர்ப்பு
  choice: ஆசாரியர் அவனுக்காகப் பாவநிவிர்த்தி செய்வார்; அவன் மன்னிக்கப்படுவான்.
  alternative: ஆசாரியர் அவன் சார்பாகப் பரிகாரம் செய்வார்; அவனுக்கு மன்னிப்பு வழங்கப்படும்.
  rationale: ஆசாரியரின் பாவநிவிர்த்திச் செயலைத் தொடர்ந்து மன்னிப்பு கிடைப்பதாக மூலவசனம் கூறுகிறது. அது எவ்வாறு செயல்படுகிறது என்ற பிற்காலக் கோட்பாட்டு விளக்கத்தைச் சேர்க்காமல், பலிசார் மற்றும் உடன்படிக்கைசார் பதற்றத்தைப் பாதுகாக்கிறது.
- issue: יהוה என்ற தெய்வீகப் பெயர்
  choice: யெகோவா
  alternative: ஆண்டவர்
  rationale: மூலத்தில் பெயர் நிற்கும் இடத்தில் தமிழிலும் தனிப்பெயரைப் பாதுகாக்கிறது; இதனால் ‘ஆண்டவர்’ என்ற பட்டப்பெயரை மூலத்துக்குள் இறக்குமதி செய்வது தவிர்க்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், வாசிக்க எளிதானதும் வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமுடையதுமான நடை பயன்படுத்தப்பட்டுள்ளது. சட்டவழிமுறையின் கட்டாயத் தன்மை ‘வேண்டும்’ மூலம் வெளிப்படுத்தப்பட்டுள்ளது. மரியாதை ஒருமை காரணமாக ‘ஆசாரியர்’ பயன்படுத்தப்பட்டாலும், மூலத்தின் ஒருமைத் தன்மை காக்கப்பட்டுள்ளது. வழங்கப்பட்ட ஆங்கில அடிக்குறிப்பு அடையாளங்கள் பொருந்தாத இடங்களில் இருந்ததால், பொருளுக்கு ஏற்ற இடங்களில் [a], [b] என மறுவரிசைப்படுத்தப்பட்டுள்ளன.
