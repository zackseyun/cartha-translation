  source_fidelity: 'மூல எபிரெயத்தின் செயல்வரிசையும் பொருளும் துல்லியமாகப் பாதுகாக்கப்பட்டுள்ளன: பலியின் எல்லாக் கொழுப்பையும் நீக்குதல், சமாதானப் பலியின் நடைமுறையுடனான ஒப்புமை, ஆசாரியர் பலிபீடத்தில் எரித்தல், பாவநிவிர்த்தி, அதைத் தொடரும் மன்னிப்பு ஆகியவை அனைத்தும் இடம்பெற்றுள்ளன. ‘அவனுக்காக’ என்பது עָלָיו என்பதற்கும், ‘அவன் மன்னிக்கப்படுவான்’ என்பது וְנִסְלַח לוֹ என்பதற்கும் பொருத்தமானது.'
