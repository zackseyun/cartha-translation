  source_fidelity: மூல எபிரெயத்தின் ஒப்பீட்டு அமைப்பு (כַּאֲשֶׁר), செயலற்ற வினை (יוּרַם), சமாதானப் பலியின் காளை, மற்றும் ஆசாரியன் கொழுப்புப் பகுதிகளைப் பலிபீடத்தில் எரிக்கும் செயல் ஆகியவை துல்லியமாகப் பிரதிபலிக்கப்படுகின்றன. ‘கொழுப்பு’ என்பது முந்தைய வசனத்தில் வெளிப்படையாகக் குறிப்பிடப்பட்டு இவ்வசனத்தில் சுட்டிக்காட்டப்படும் பொருளைத் தமிழில் இயல்பாகத் தெளிவாக்குகிறது. ‘அவற்றை’ என்பது மூலத்தில் உள்ள பன்மைச் சுட்டுப்பின்னொட்டுக்குப் பொருந்துகிறது.
