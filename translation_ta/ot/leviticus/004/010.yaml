  text: כַּ/אֲשֶׁ֣ר יוּרַ֔ם מִ/שּׁ֖וֹר זֶ֣בַח הַ/שְּׁלָמִ֑ים וְ/הִקְטִירָ/ם֙ הַ/כֹּהֵ֔ן עַ֖ל מִזְבַּ֥ח הָ/עֹלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/010.yaml
  text: just as it is removed from the ox of the sacrifice of peace offerings[a], and the priest shall burn them on the altar of burnt offering.
translation:
  language: ta
  text: சமாதானப் பலிக்கான காளையிலிருந்து கொழுப்பு எடுக்கப்படுவதுபோலவே[a], ஆசாரியன் அவற்றைத் தகனபலிக்கான பலிபீடத்தின்மேல் எரிக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இன்னும் சொற்சொல்லாக, ‘சமாதானப் பலிக்கான காளையிலிருந்து கொழுப்பு உயர்த்தி எடுக்கப்படுவதுபோலவே.’ எபிரெய வினைச்சொல், பலியிடப்பட வேண்டிய பகுதிகள் அகற்றப்படுவதையும் உயர்த்தப்படுவதையும் நினைவூட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: எடுக்கப்படுவதுபோலவே
  rationale: முந்தைய சமாதானப் பலி நடைமுறையுடன் இச்செயலை ஒப்பிடுவதை இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: יוּרַם
  choice: எடுக்கப்படுவது
  rationale: רום என்பதன் அடிப்படைப் பொருள் ‘உயர்த்தப்படுதல்’ என்றாலும், இப்பலிச்சடங்குச் சூழலில் காளையிலிருந்து கொழுப்புப் பகுதிகள் பிரித்து எடுக்கப்படுவதைக் குறிக்கிறது; அடிப்படை உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: מִשּׁוֹר
  choice: காளையிலிருந்து
  rationale: שׁוֹר மாட்டினத்தைக் குறிக்கும்; உடனடிச் சூழலில் பலியிடப்படும் ஆண் மாடு என்பதால் ‘காளை’ துல்லியமாகவும் இயல்பாகவும் உள்ளது.
- source_word: זֶבַח הַשְּׁלָמִים
  choice: சமாதானப் பலி
  rationale: שְׁלָמִים என்பதுடனான அமைதி/நலவாழ்வு சார்ந்த சொல்லுறவைப் பாதுகாக்கும் நிலையான பலிச்சடங்குச் சொல்; ‘ஐக்கியப் பலி’ போன்ற விளக்கவுரையைத் திணிக்கவில்லை.
- source_word: וְהִקְטִירָם
  choice: அவற்றை ... எரிக்க வேண்டும்
  rationale: קטר என்பதன் பலிச்சடங்குப் பயன்பாடு பலிபீடத்தில் எரிப்பதைக் குறிக்கிறது. பன்மை விகுதி முந்தைய வசனத்தில் குறிப்பிடப்பட்ட கொழுப்புப் பகுதிகளைச் சுட்டுவதால் ‘அவற்றை’ பயன்படுத்தப்பட்டது.
- source_word: הַכֹּהֵן
  choice: ஆசாரியன்
  rationale: பலிச்சடங்கை நிறைவேற்றும் அதிகாரப்பூர்வ பணியாளருக்கான வழக்கமான, புரியக்கூடிய தமிழ் சொல்.
- source_word: עַל מִזְבַּח הָעֹלָה
  choice: தகனபலிக்கான பலிபீடத்தின்மேல்
  rationale: עֹלָה முழுமையாக எரிக்கப்படும் பலியைக் குறிக்கிறது; ‘தகனபலி’ அந்தச் சடங்குப் பொருளைச் சுருக்கமாகத் தக்கவைக்கிறது.
