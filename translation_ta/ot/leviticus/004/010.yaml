translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான பலிச்சடங்கு நடையில் மொழிபெயர்க்கப்பட்டது. ‘கொழுப்பு’ என்பது முந்தைய வசனத்திலிருந்து தொடரும் மறைபொருளைத் தெளிவாக்குகிறது; பின்னர் வரும் ‘அவற்றை’ மூலத்தின் பன்மைச் சுட்டைத் தக்கவைக்கிறது.
