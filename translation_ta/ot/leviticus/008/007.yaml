base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/007.yaml
  text: And he put the tunic on him[a], and fastened him with the sash, and clothed him with the robe, and put the ephod on him, and fastened it on him with the skillfully woven band of the ephod[b], and tied the ephod to him with it.
translation:
  language: ta
  text: மோசே ஆரோனுக்கு அங்கியை அணிவித்து, அவருக்கு இடைக்கச்சையைக் கட்டி, மேலங்கியை உடுத்தி, ஏபோத்தை அவர்மேல் அணிவித்தார். பின்பு ஏபோத்தின் திறம்பட நெய்யப்பட்ட பட்டையை அவரைச் சுற்றிக் கட்டி[a], அதைக் கொண்டே ஏபோத்தை அவர்மேல் உறுதியாகப் பொருத்தினார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஏபோத்தின் அலங்காரப் பட்டை” அல்லது “ஏபோத்தின் இடுப்புப்பட்டை” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இங்குள்ள அரிய எபிரெய வினை, ஏபோத்தை அதன் நெய்யப்பட்ட பட்டையால் ஆரோனின் உடலில் உறுதிப்படுத்தியதைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: כֻּתֹּנֶת
  choice: அங்கி
  rationale: உடலுக்கு அருகில் அணியப்பட்ட அடிப்படை ஆசாரிய உடையைக் குறிக்கிறது. நவீன தமிழில் இயல்பாகவும் மரியாதையான நடையிலும் இருப்பதால் ‘அங்கி’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: אַבְנֵט
  choice: இடைக்கச்சை
  rationale: இடுப்பைச் சுற்றிக் கட்டப்படும் துணிப்பட்டையைக் குறிக்கிறது; பொதுவான ‘பெல்ட்’ என்பதைக் காட்டிலும் ஆசாரிய உடையின் சூழலுக்கு ‘இடைக்கச்சை’ பொருத்தமானது.
- source_word: מְעִיל
  choice: மேலங்கி
  rationale: அங்கியின் மேல் அணியப்படும் வெளிப்புற உடையைக் குறிக்கிறது; உடைகளின் அடுக்கையும் செயலையும் தெளிவாகக் காட்டுகிறது.
- source_word: אֵפֹד
  choice: ஏபோத்
  rationale: துல்லியமான தமிழ் இணைச்சொல் இல்லாத தனிப்பட்ட ஆசாரிய உடை என்பதால், வழிபாட்டு நுட்பச்சொல் ஒலிபெயர்க்கப்பட்டது.
- source_word: חֵשֶׁב הָאֵפֹד
  choice: ஏபோத்தின் திறம்பட நெய்யப்பட்ட பட்டை
  rationale: ஏபோத்துடன் இணைந்த, அதை உடலில் நிலைநிறுத்தும் கைவினை நயமுள்ள பட்டையை இச்சொற்றொடர் குறிக்கிறது. பொருளையும் பயன்பாட்டையும் ஒருங்கே வெளிப்படுத்தும் மொழிபெயர்ப்பு இது.
- source_word: וַיֶּאְפֹּד לוֹ בּוֹ
  choice: அந்தப் பட்டையைக் கொண்டே ஏபோத்தை அவரோடு பொருத்தினார்
  rationale: אֵפֹד என்பதிலிருந்து உருவான அரிய வினை, ஏபோத்தை அதன் பட்டையால் உடலில் நிலைநிறுத்திய செயலைக் குறிக்கிறது. தமிழ் வாக்கியம் கருவியையும் செயலையும் வெளிப்படையாகச் சொல்கிறது; அரிய எபிரெய வினையின் துல்லியமான செயல்வகை குறித்த நிச்சயமின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וַיִּתֵּן עָלָיו / וַיַּלְבֵּשׁ אֹתוֹ
  choice: அணிவித்து / உடுத்தி
  rationale: ஒருவருக்கு உடையைப் போடுதல் என்ற தொடர்ச்சியான செயலை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது; ஒரே வினையைத் தேவையின்றி மீண்டும் மீண்டும் பயன்படுத்தாமல் எபிரெயச் செயல்தொடரைப் பேணுகிறது.
theological_decisions:
- issue: ஆசாரிய உடைகளுக்குரிய நுட்பச்சொற்களை மொழிபெயர்த்தல்
  choice: பொதுவான உடைப்பெயர்களைத் தமிழில் மொழிபெயர்த்து, ‘ஏபோத்’ என்ற தனித்துவமான வழிபாட்டு உடைப்பெயரை ஒலிபெயர்த்தல்
  alternative: ‘ஏபோத்’ என்பதை ‘முன்புற அங்கி போன்ற ஆசாரிய உடை’ என விளக்கமாக மொழிபெயர்த்தல்
  rationale: இவ்வசனம் முதன்மையாக உடை அணிவிக்கும் நிகழ்வை விவரிக்கிறது. ‘ஏபோத்’ என்பதற்கு உறுதியான ஒரே வடிவ விளக்கம் இல்லாததால், விளக்க மொழிபெயர்ப்பு மூலத்தில் இல்லாத குறிப்பைச் சேர்க்கக்கூடும்; ஒலிபெயர்ப்பு அதன் வழிபாட்டு தனித்தன்மையைப் பாதுகாக்கிறது.
- issue: וַיֶּאְפֹּד לוֹ בּוֹ என்ற அரிய வினையின் பொருள்
  choice: ஏபோத்தை அந்தப் பட்டையால் ஆரோனின் உடலில் பொருத்தியதாக மொழிபெயர்த்தல்
  alternative: ‘அதனால் அவரை ஏபோத் அணிந்தவராக்கினார்’ அல்லது ‘அதனால் அவரைக் கட்டினார்’
  rationale: இறுதியிலுள்ள בּוֹ பட்டையைக் கருவியாகச் சுட்டுகிறது என்று சூழல் வலுவாகக் காட்டுகிறது. ஆயினும் வினையின் அரிதான தன்மையால் செயல் முறையை மிகத் துல்லியமாக நிர்ணயிக்காமல் ‘பொருத்தினார்’ என வழங்கி, நிச்சயமின்மையை அடிக்குறிப்பில் குறிப்பிடுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதையான உரைநடை பயன்படுத்தப்பட்டுள்ளது. தொடர்ச்சியான ஆறு எபிரெய வினைச்செயல்கள் இரண்டு இயல்பான தமிழ் வாக்கியங்களாக அமைக்கப்பட்டுள்ளன. வசனத்தின் முன்சூழலில் தெளிவாக உள்ள மோசே, ஆரோன் ஆகிய பெயர்கள் தமிழ் மொழியில் ஏற்படும் ‘அவர் அவருக்கு’ என்ற குழப்பத்தைத் தவிர்க்க வெளிப்படையாகக் கூறப்பட்டுள்ளன.
