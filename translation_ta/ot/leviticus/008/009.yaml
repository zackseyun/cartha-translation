  text: And he put the turban on his head[a], and on the front of the turban he placed the gold plate, the holy crown, just as Yahweh had commanded Moses.
translation:
  language: ta
  text: மோசே ஆரோனின் தலையில் தலைப்பாகையை வைத்தார்; தலைப்பாகையின் முன்புறத்தில் பரிசுத்த மகுடமான பொன் தகட்டைப் பொருத்தினார். யாவே மோசேக்குக் கட்டளையிட்டபடியே அவர் செய்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִצְנֶפֶת
  choice: தலைப்பாகை
  rationale: தலைமை ஆசாரியருக்குரிய சுற்றிக் கட்டப்படும் தலையணியை இயல்பாகவும் தெளிவாகவும் குறிக்கிறது.
- source_word: אֶל מוּל פָּנָיו
  choice: முன்புறத்தில்
  rationale: தகடு ஆரோனுக்கு எதிரே தனியாக வைக்கப்பட்டது என்பதல்ல, தலைப்பாகையின் முகத்தை நோக்கிய முன்பகுதியில் பொருத்தப்பட்டது என்பதைக் காட்டுகிறது.
- source_word: צִיץ
  choice: பொன் தகடு
  rationale: இச்சூழலில் மலர் அல்லது அலங்காரம் என்ற பொதுப்பொருளைவிட, தலைப்பாகையில் பொருத்தப்பட்ட பொன் அணிகலன் தகட்டையே குறிக்கிறது.
- source_word: נֵזֶר הַקֹּדֶשׁ
  choice: பரிசுத்த மகுடம்
  rationale: பொன் தகட்டை மேலும் அடையாளப்படுத்தும் உடன்பாட்டு சொல்லாகவும், ஆசாரியப் பரிசுத்தத்தைக் குறிக்கும் மகுடமாகவும் மூலச்சொற்றொடரை நெருக்கமாக வழங்குகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தலைப்பால் மாற்றாமல், எபிரெயத் திருமறையில் வரும் இறைநாமத்தைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: וַיָּשֶׂם ... וַיָּשֶׂם
  choice: வைத்து ... பொருத்தினார்
  rationale: ஒரே எபிரெய வினை இருமுறை வந்தாலும், முதலில் தலைப்பாகையை அணிவித்ததும் பின்னர் அதில் தகட்டை இணைத்ததும் தமிழில் இயல்பாக வேறுபடுத்தப்படுகிறது.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: யாவே மோசேக்குக் கட்டளையிட்டபடியே
  rationale: செயல் இறைக் கட்டளைக்கு முழுமையாக இணங்க நடந்ததை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைநாமத்தை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் நேரடியாக இடம்பெறும் உடன்படிக்கைப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் பாதுகாக்கிறது.
- issue: נֵזֶר הַקֹּדֶשׁ என்பதன் பொருள்
  choice: பரிசுத்த மகுடம்
  alternative: பரிசுத்த முடிப்பட்டம்
  rationale: இது பொன் தகட்டை விளக்கும் பெயர்ச்சொற்றொடர். ‘மகுடம்’ மூலத்தின் அரச மற்றும் அர்ப்பணிப்பு சார்ந்த நிழற்பொருளை எளிய தமிழில் தக்கவைக்கிறது; ‘முடிப்பட்டம்’ என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘பரிசுத்தம்’ என்ற வழக்கமான வேதாகமச் சொல் தக்கவைக்கப்பட்டு, தேவையற்ற சமயப்பிரிவு சார்ந்த சொற்கள் தவிர்க்கப்பட்டுள்ளன.
