  source_fidelity: 'மையப் பொருள் சரியாக உள்ளது: தலைப்பாகை ஆரோனின் தலையில் வைக்கப்பட்டதும், அதன் முன்புறத்தில் பொன் தகடாகிய பரிசுத்த மகுடம் பொருத்தப்பட்டதும், இது யாவே மோசேக்குக் கட்டளையிட்டபடியே நடந்ததும் தெரிவிக்கப்பட்டுள்ளது. ஆனால் மூலத்தில் உள்ள செயலாற்றுபவர் சூழலின்படி மோசே; வரைவில் ‘அவர்’ மற்றும் ‘அவன்’ என மாறுபட்ட சுட்டுப்பெயர்கள் வருவதால் செய்பவரும் தலைப்பாகையை அணிந்தவரும் தேவையற்றவகையில் தெளிவிழக்கின்றனர். இறுதியில் சேர்க்கப்பட்ட ‘அவர் செய்தார்’ மூலத்தின் வெளிப்படையான சொற்களல்ல; தமிழில் வாக்கியத்தை நிறைவு செய்யலாம், ஆனால் மோசேவைத் தெளிவாகக் குறிப்பிடுவது சிறந்தது.'
