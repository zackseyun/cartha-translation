  yaml_path: translation/ot/leviticus/008/016.yaml
  text: He took all the fat that was on the entrails[a], the lobe of the liver, the two kidneys and their fat[b], and Moses burned them on the altar.
translation:
  language: ta
  text: மோசே உள்ளுறுப்புகளின்மேல் இருந்த கொழுப்பு முழுவதையும், கல்லீரலின் நீட்சிப் பகுதியையும்[a], இரண்டு சிறுநீரகங்களையும் அவற்றின் கொழுப்பையும் எடுத்தார். அவர் அவற்றைப் பலிபீடத்தின்மேல் எரித்துப் புகையாக்கினார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கல்லீரலின் மடல்’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் பலிக்காக ஆயத்தப்படுத்தும்போது அகற்றப்பட்ட கல்லீரலுடன் தொடர்புடைய ஒரு குறிப்பிட்ட பகுதியைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: இதற்கான எபிரெய வினை, பலிச்சடங்குச் சூழலில் இன்னும் குறிப்பாக ‘புகையாக ஏறச்செய்தார்’ அல்லது ‘புகையாகப் பலியிட்டார்’ எனப் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: அவர் ... எடுத்தார்
  rationale: לקח என்பதன் தொடர்கதை வடிவம் கடந்தகால நிகழ்வைச் சுட்டுகிறது. தொடக்க இணைப்புச் சொல்லைத் தமிழில் வெளிப்படையாகச் சேர்க்காமல் இயல்பான கதைநடையில் தரப்பட்டுள்ளது.
- source_word: כָּל הַחֵלֶב
  choice: கொழுப்பு முழுவதையும்
  rationale: பலிச்சடங்குச் சூழலில் חֵלֶב பலியிடப்பட வேண்டிய கொழுப்புப் பகுதிகளைக் குறிக்கிறது; இங்கு பட்டியலிடப்படும் உடற்பகுதிகளுடன் இயல்பாகப் பொருந்தும் நேரடியான சொல் ‘கொழுப்பு’.
- source_word: אֲשֶׁר עַל הַקֶּרֶב
  choice: உள்ளுறுப்புகளின்மேல் இருந்த
  rationale: קֶרֶב இங்கு விலங்கின் உடலுக்குள் உள்ள உறுப்புகளைக் குறிக்கிறது. ‘உள்ளுறுப்புகள்’ என்பது நவீனத் தமிழில் தெளிவானதும் தேவையற்ற தொழில்நுட்பத் தன்மை இல்லாததும் ஆகும்.
- source_word: יֹתֶרֶת הַכָּבֵד
  choice: கல்லீரலின் நீட்சிப் பகுதி
  rationale: பலிச்சடங்கு விதிகளில் இந்த எபிரெயச் சொற்றொடர் கல்லீரலோடு தொடர்புடைய, அகற்றப்படும் ஒரு குறிப்பிட்ட பகுதியைக் குறிக்கிறது. அதன் துல்லியமான உடற்கூறியல் அடையாளம் உறுதியற்றிருப்பதால் ‘நீட்சிப் பகுதி’ அந்தத் தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: இரண்டு சிறுநீரகங்களையும்
  rationale: இது இருமை எண்ணில் உள்ள நேரடியான உடற்கூறியல் குறிப்பு.
- source_word: חֶלְבְּהֶן
  choice: அவற்றின் கொழுப்பையும்
  rationale: பன்மை உரிமைப் பின்னொட்டு முன் குறிப்பிடப்பட்ட இரண்டு சிறுநீரகங்களைக் குறிக்கிறது; தமிழ் வடிவம் அந்தத் தொடர்பைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: וַיַּקְטֵר
  choice: எரித்துப் புகையாக்கினார்
  rationale: קטר பலிச்சடங்குச் சூழலில் பலிபீடத்தில் எரித்துப் புகையாக ஏறச்செய்வதைக் குறிக்கிறது. ‘எரித்துப் புகையாக்கினார்’ என்பது வெறும் எரித்தல் என்பதைவிட மூலவினையின் பலிச்சடங்கு நுணுக்கத்தைத் தெளிவாகத் தருகிறது.
- source_word: הַמִּזְבֵּחָה
  choice: பலிபீடத்தின்மேல்
  rationale: இடம் அல்லது திசையைக் காட்டும் வடிவம் எரித்தல் பலிபீடத்தின்மேல் நிகழ்ந்ததைக் குறிக்கிறது.
