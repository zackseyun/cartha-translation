revisions:
- from: அவன் அதைப் பலியிடுவதற்காக அறுத்தான். மோசே இரத்தத்தை எடுத்து, தன் விரலால் பலிபீடத்தின் கொம்புகள் அனைத்தின்மேலும் பூசி, பலிபீடத்தைத் தூய்மைப்படுத்தினான்.[a] மீதமிருந்த இரத்தத்தைப் பலிபீடத்தின் அடிப்பகுதியில் ஊற்றினான். இவ்வாறு அதற்காகப் பாவநிவிர்த்தி செய்து, அதைத் திருப்புனிதமாக்கினான்.[b]
  to: அவன் அதை அறுத்தான். மோசே இரத்தத்தை எடுத்து, தன் விரலால் பலிபீடத்தின் கொம்புகளின்மேல் சுற்றிலும் பூசினான்; அவன் பலிபீடத்தைத் தூய்மைப்படுத்தினான்.[a] இரத்தத்தைப் பலிபீடத்தின் அடிப்பகுதியில் ஊற்றினான்; அதற்காகப் பாவநிவிர்த்தி செய்யும்படி அதைத் திருப்புனிதப்படுத்தினான்.[b]
  rationale: The revision removes an unsupported specification, restores the Hebrew clause order and purpose relationship, and retains clear modern Tamil ritual terminology. Footnote anchors remain attached to the two Hebrew terms requiring lexical clarification.
  reviewer_model: gpt-5.6-terra
