base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/015.yaml
  text: And he slaughtered it, and Moses took the blood and put it on the horns of the altar all around with his finger, and he purified the altar, and he poured out the blood at the base of the altar and consecrated it to make atonement for it.
translation:
  language: ta
  text: அவன் அதை அறுத்தான். மோசே இரத்தத்தை எடுத்து, தன் விரலால் பலிபீடத்தின் கொம்புகளின்மேல் சுற்றிலும் பூசினான்; அவன் பலிபீடத்தைத் தூய்மைப்படுத்தினான்.[a] இரத்தத்தைப் பலிபீடத்தின் அடிப்பகுதியில் ஊற்றினான்; அதற்காகப் பாவநிவிர்த்தி செய்யும்படி அதைத் திருப்புனிதப்படுத்தினான்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பலிபீடத்தைச் சுத்திகரித்தான்.” இச்சடங்குச் சூழலில் எபிரெய வினைச்சொல், பாவம் செய்யச் செய்தல் என்பதை அல்ல, சடங்குரீதியான மாசை அகற்றித் தூய்மைப்படுத்துதல் என்பதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “அதற்காகப் பாவநிவிர்த்தி செய்யும்படி” என்பதை “அதற்காகப் பரிகாரச் சடங்கு செய்யும்படி” அல்லது “அதை மாசகற்றும்படி” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் இங்கு பலிச் சடங்கின் பாவநிவிர்த்தி மற்றும் தூய்மைப்படுத்தல் ஆகிய பொருள் நிழல்களைக் கொண்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחָט
  choice: அவன் அதைப் பலியிடுவதற்காக அறுத்தான்
  rationale: שׁחט என்பது பலிச் சடங்கின் சூழலில் பொதுவாகக் கொல்வதை அல்ல, சடங்குமுறைப்படி அறுப்பதைக் குறிக்கிறது. முன்சூழலிலுள்ள காளை தமிழில் இயல்பாக ‘அது’ எனச் சுட்டப்படுகிறது.
- source_word: קַרְנוֹת הַמִּזְבֵּחַ סָבִיב
  choice: பலிபீடத்தின் கொம்புகள் அனைத்தின்மேலும்
  rationale: ‘கொம்புகள்’ என்பது பலிபீடத்தின் கொம்புபோன்ற நீட்சிகளைக் குறிக்கும் சடங்குசார் சொல்; סָבִיב என்பதன் சுற்றிலுமுள்ள எல்லாக் கொம்புகளிலும் என்ற பகிர்வுப் பொருள் இயல்பான தமிழில் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: בְּאֶצְבָּעוֹ
  choice: தன் விரலால்
  rationale: எபிரெயச் சொல் ஒருமையிலும் கருவிப்பொருளிலும் இருப்பதால், ‘தன் விரலால்’ என்பது துல்லியமும் இயல்பும் உடையது.
- source_word: וַיְחַטֵּא אֶת־הַמִּזְבֵּחַ
  choice: பலிபீடத்தைத் தூய்மைப்படுத்தினான்
  rationale: ஆசாரியச் சடங்குச் சூழலில் חטא என்பதன் பியெல் வடிவம் ‘பாவம் செய்யச் செய்தான்’ என்று அல்லாமல், சடங்குரீதியான மாசிலிருந்து தூய்மைப்படுத்தினான் என்று பொருள்படும்.
- source_word: יָצַק אֶל־יְסוֹד הַמִּזְבֵּחַ
  choice: மீதமிருந்த இரத்தத்தைப் பலிபீடத்தின் அடிப்பகுதியில் ஊற்றினான்
  rationale: יְסוֹד இங்கு பலிபீடத்தின் அடித்தளம் அல்லது அடிப்பகுதியைக் குறிக்கிறது. ‘மீதமிருந்த’ என்பது எபிரெயில் இரத்தம் இரண்டாவது முறையாக முன்னிலைப்படுத்தப்படுவதையும், ஏற்கெனவே ஒரு பகுதி பூசப்பட்டிருப்பதையும் தமிழில் தெளிவாக்கும் சூழல்சார் நிறைவு.
- source_word: וַיְקַדְּשֵׁהוּ
  choice: அதைத் திருப்புனிதமாக்கினான்
  rationale: קדשׁ இங்கு பலிபீடத்தைப் புனிதப் பயன்பாட்டிற்கென ஒதுக்கி அர்ப்பணிப்பதைக் குறிக்கிறது. ‘திருப்புனிதமாக்குதல்’ சடங்குசார் பொருளைச் சுருக்கமாகத் தருகிறது.
- source_word: לְכַפֵּר עָלָיו
  choice: அதற்காகப் பாவநிவிர்த்தி செய்து
  rationale: כפר என்பது பலிச் சடங்கில் நிவிர்த்தி, கழுவாய் அல்லது மாசகற்றல் சார்ந்த செறிவான சொல்லாகும். עַל இங்கு பலிபீடத்தையே சடங்கின் பொருளாகக் காட்டுவதால் ‘அதற்காக’ எனத் தரப்பட்டுள்ளது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: ஆசாரியச் சடங்குச் சூழலில் חטא என்பதன் பொருள்
  choice: பலிபீடத்தைத் தூய்மைப்படுத்தினான்
  alternative: பலிபீடத்தைச் சுத்திகரித்தான்
  rationale: பலிபீடம் பாவம் செய்தது என்ற எண்ணத்தை உருவாக்காமல், இரத்தச் சடங்கினால் அது சடங்குரீதியாகத் தூய்மையாக்கப்பட்டதை வெளிப்படுத்துகிறது.
- issue: பலிச் சூழலில் כפר மற்றும் עַל என்பவற்றின் மொழிபெயர்ப்பு
  choice: அதற்காகப் பாவநிவிர்த்தி செய்து
  alternative: அதன்மேல் நிவிர்த்திச் சடங்கு செய்து; அதை மாசகற்றி
  rationale: ‘பாவநிவிர்த்தி’ எபிரெயச் சொல்லின் வழிபாட்டியல் கனத்தைப் பாதுகாக்கிறது. அதேவேளை, பலிபீடமே சடங்கின் பொருள் என்பதால் இங்கு மாசகற்றல் அல்லது பரிகாரச் சடங்கு என்ற நிழற்பொருளும் இருக்கலாம்; அதனை அடிக்குறிப்பு வெளிப்படுத்துகிறது.
- issue: וַיְקַדְּשֵׁהוּ மற்றும் לְכַפֵּר עָלָיו ஆகியவற்றின் தொடர்பு
  choice: இவ்வாறு அதற்காகப் பாவநிவிர்த்தி செய்து, அதைத் திருப்புனிதமாக்கினான்
  alternative: அதைத் திருப்புனிதமாக்கி, அதன்மேல் பாவநிவிர்த்தி செய்தான்
  rationale: எபிரெய வாக்கியத்தில் திருப்புனிதமாக்குதல் முதலில் வந்து, அதற்கான நோக்கம் infinitive வடிவில் தொடர்கிறது. தமிழில் செயல்-விளைவு தொடர்பை இயல்பாக்க ‘இவ்வாறு’ கொண்டு அமைக்கப்பட்டுள்ளது; நோக்கம் அல்லது விளைவு என்ற உறவிலுள்ள சிறு தெளிவின்மை அடிக்குறிப்பில் சுட்டப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமான ஆனால் பொதுவாசகருக்கு எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. நீளமான எபிரெய தொடர்வாக்கியம் வாசிப்புத் தெளிவுக்காக மூன்று தமிழ்வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது. ‘பலிபீடம்’, ‘பாவநிவிர்த்தி’, ‘திருப்புனிதமாக்குதல்’ ஆகிய நிலையான வேதாகமச் சடங்குசார் சொற்கள் பயன்படுத்தப்பட்டுள்ளன.
