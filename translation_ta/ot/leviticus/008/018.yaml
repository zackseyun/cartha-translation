  source_fidelity: 'The Tamil accurately represents the Hebrew sequence and participants: Moses (implicit in அவர்) brought forward the ram designated for the burnt offering, and Aaron with his sons placed their hands on its head. It retains the plural “hands” and does not add an interpretation to the ritual gesture.'
  naturalness: The wording is clear, dignified, and natural in modern standard Tamil. “செம்மறியாட்டுக் கடா” precisely and understandably identifies a ram, and “தலையின்மேல் தங்கள் கைகளை வைத்தார்கள்” is idiomatic for the stated action.
  terminology: “தகனபலி” appropriately renders עֹלָה, while “தகனபலிக்கான” naturally expresses the ram’s designation. The rendering of סמך as “வைத்தார்கள்” is suitably neutral; the footnote offers “ஊன்றினார்கள்” as a lexical alternative without imposing a theological explanation. Footnote markers are correctly anchored to their relevant expressions.
