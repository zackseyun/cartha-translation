id: LEV.8.18
reference: Leviticus 8:18
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יַּקְרֵ֕ב אֵ֖ת אֵ֣יל הָ/עֹלָ֑ה וַֽ/יִּסְמְכ֞וּ אַהֲרֹ֧ן וּ/בָנָ֛י/ו אֶת יְדֵי/הֶ֖ם עַל רֹ֥אשׁ הָ/אָֽיִל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/018.yaml
  text: Then he brought near the ram of the burnt offering[b][a], and Aaron and his sons laid their hands on the head of the ram.
translation:
  language: ta
  text: பின்பு அவர் தகனபலிக்கான செம்மறியாட்டுக் கடாவை அருகே கொண்டுவந்தார்[a]. ஆரோனும் அவன் மகன்களும் அந்தக் கடாவின் தலையின்மேல் தங்கள் கைகளை வைத்தார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சமர்ப்பித்தார்’ அல்லது ‘முன்னே கொண்டுவந்தார்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இதற்கான எபிரெய வினைச்சொல் ‘கைகளை ஊன்றினார்கள்’ என்றும் மொழிபெயர்க்கப்படலாம்; பலிவிலங்கின்மேல் செய்யப்படும் சடங்குச் செயலை இது குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: அருகே கொண்டுவந்தார்
  rationale: קרב என்பதன் ஹிஃபில் வடிவம் ‘அருகே கொண்டுவருதல்’ அல்லது ‘சமர்ப்பித்தல்’ எனப் பொருள்படும். ‘அருகே கொண்டுவந்தார்’ என்பது எபிரெயச் சொல்லின் இயக்கத்தையும் பலிச்சடங்கு சார்ந்த பொருளையும் காக்கிறது; முந்தைய சூழலின்படி எழுவாய் மோசே.
- source_word: אֵיל
  choice: செம்மறியாட்டுக் கடா
  rationale: இது ஆண் செம்மறியாட்டைக் குறிக்கிறது. ‘செம்மறியாட்டுக் கடா’ என்பது பலிக்குரிய விலங்கைத் தெளிவாக அடையாளப்படுத்தும் இயல்பான தமிழ்.
- source_word: הָעֹלָה
  choice: தகனபலிக்கான
  rationale: עֹלָה என்பது முழுமையாக எரிக்கப்படும் பலிக்கான வழக்கமான எபிரெயச் சொல். ‘தகனபலி’ அதன் பலிச்சடங்கு சார்ந்த பொருளைக் காக்கிறது; ‘-க்கான’ என்பது இந்தக் கடா அந்தப் பலிக்காக நியமிக்கப்பட்டதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וַיִּסְמְכוּ
  choice: வைத்தார்கள்
  rationale: סמך என்பது இச்சூழலில் பலிவிலங்கின் தலையின்மேல் கைகளை வைக்கும் சடங்குச் செயலைக் குறிக்கிறது. ‘வைத்தார்கள்’ இயல்பாகவும் தெளிவாகவும் உள்ளது; ‘ஊன்றினார்கள்’ என்ற அழுத்தத்தை உணர்த்தும் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: יְדֵיהֶם
  choice: தங்கள் கைகளை
  rationale: எபிரெயில் உள்ள பன்மையைத் தக்கவைக்கிறது; செய்பவர்களையே மீண்டும் சுட்டும் தமிழ் தற்சுட்டுப் பெயரடை இயல்பாகப் பயன்படுத்தப்பட்டுள்ளது.
- source_word: עַל רֹאשׁ הָאָיִל
  choice: அந்தக் கடாவின் தலையின்மேல்
  rationale: முன்னரே குறிப்பிடப்பட்ட கடாவைச் சுட்டி, எபிரெய முன்னிடைத் தொடரைத் தெளிவான நவீன தமிழில் வழங்குகிறது.
theological_decisions:
- issue: பலிச்சடங்கில் விலங்கின்மேல் கைகளை வைக்கும் செயல்
  choice: அந்தக் கடாவின் தலையின்மேல் தங்கள் கைகளை வைத்தார்கள்
  alternative: அந்தக் கடாவின் தலையின்மேல் தங்கள் கைகளை ஊன்றினார்கள்
  rationale: வசனம் கூறும் சடங்குச் செயலை மட்டும் மொழிபெயர்க்கிறது. குற்றம் மாற்றப்படுதல் அல்லது விலங்கோடு அடையாளப்படுத்திக்கொள்ளுதல் போன்ற இறையியல் விளக்கங்களை வசனத்திற்குள் சேர்க்காமல், அதன் பொருளைச் சூழல் தீர்மானிக்க விடுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘தகனபலி’ என்ற நிலைபெற்ற பலிச்சொல் தக்கவைக்கப்பட்டு, ‘செம்மறியாட்டுக் கடா’ மூலம் விலங்கின் வகையும் பாலினமும் தெளிவாக்கப்பட்டுள்ளன.
