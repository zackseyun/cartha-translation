base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/025.yaml
  text: Then he took the fat[a], and the fat tail, and all the fat that was on the entrails, and the lobe of the liver, and the two kidneys with their fat, and the right thigh.
translation:
  language: ta
  text: பின்னர் அவர் கொழுப்பையும், கொழுப்பு நிறைந்த வாலையும், உள்ளுறுப்புகளின் மேல் இருந்த கொழுப்பு முழுவதையும், கல்லீரலின் மடலையும்[a], இரண்டு சிறுநீரகங்களையும் அவற்றின் கொழுப்பையும், வலது தொடையையும் எடுத்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கல்லீரலின் துணைப்பகுதி.” எபிரெயச் சொல் பலிச் சடங்கின்போது அகற்றப்பட்ட கல்லீரலின் ஒரு குறிப்பிட்ட பகுதியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: பின்னர் அவர் … எடுத்தார்
  rationale: வாவ் தொடர் வடிவம் நிகழ்வை அடுத்த கட்டத்துக்கு நகர்த்துகிறது; ‘பின்னர்’ என்பது அதன் தொடர்ச்சிப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: הַחֵלֶב
  choice: கொழுப்பு
  rationale: பலிச் சடங்கில் தனியாகப் பிரித்து அர்ப்பணிக்கப்படும் கொழுப்புப் பகுதிகளைக் குறிக்கும் வழக்கமான சொல்.
- source_word: הָאַלְיָה
  choice: கொழுத்த வால்
  rationale: செம்மறியாட்டின் கொழுப்பு நிறைந்த அகன்ற வாலைச் சுட்டுகிறது; வெறும் ‘வால்’ என்பதைவிட உடற்கூறு சார்ந்த பொருளைத் தெளிவாகத் தருகிறது.
- source_word: כָּל הַחֵלֶב אֲשֶׁר עַל הַקֶּרֶב
  choice: உள்ளுறுப்புகளின்மேல் இருந்த கொழுப்பு முழுவதும்
  rationale: קֶרֶב இங்கு வயிற்றினுள் உள்ள உறுப்புகள் அல்லது குடற்பகுதியைக் குறிக்கிறது; ‘உள்ளுறுப்புகள்’ நவீன தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது.
- source_word: יֹתֶרֶת הַכָּבֵד
  choice: கல்லீரலின் மடல்
  rationale: பலிச் சடங்கில் அகற்றப்பட்ட கல்லீரலின் குறிப்பிட்ட பகுதியைக் குறிக்கிறது; துல்லியமான உடற்கூறு அடையாளம் உறுதியற்றதால் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: இரண்டு சிறுநீரகங்கள்
  rationale: எபிரெயச் சொல்லின் உடற்கூறு பொருளையும் இருமை எண்ணையும் நேரடியாகத் தருகிறது.
- source_word: חֶלְבְּהֶן
  choice: அவற்றின் கொழுப்பு
  rationale: சிறுநீரகங்களோடு தொடர்புடைய கொழுப்பைக் குறிக்கும் உடைமைத் தொடர்பைப் பாதுகாக்கிறது.
- source_word: שׁוֹק הַיָּמִין
  choice: வலது தொடை
  rationale: பலிக்காகப் பிரிக்கப்பட்ட வலப்பக்கக் கால் பகுதியைக் குறிக்கிறது; ‘தொடை’ என்பது இச்சூழலில் இயல்பான, உடற்கூறு சார்ந்த தமிழ் இணை.
