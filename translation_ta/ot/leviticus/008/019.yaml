  text: And he slaughtered it[a], and Moses threw the blood against the altar all around.
translation:
  language: ta
  text: அவர் அதை அறுத்தார்; மோசே இரத்தத்தைப் பலிபீடத்தின் மேல் சுற்றிலும் வீசினார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பலிபீடத்தைச் சுற்றியெல்லாம் இரத்தத்தைத் தெறிக்கச் செய்தார்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல் பலியின் இரத்தத்தை வலுவாகப் பலிபீடத்தின் மீது செலுத்துவதைக் குறிக்கிறது; மெதுவாகத் தூவுவதையோ சில துளிகளாகத் தெளிப்பதையோ அல்ல.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחָט
  choice: அவர் அதை அறுத்தார்
  rationale: שׁחט என்பது பலியிடும் சூழலில் ஒரு விலங்கைச் சடங்குமுறைப்படி அறுப்பதைக் குறிக்கிறது. தமிழில் இயல்பாக அமைய, முந்தைய வசனத்தில் குறிப்பிடப்பட்ட பலியிடும் விலங்கைக் குறிக்கும் ‘அதை’ சேர்க்கப்பட்டுள்ளது.
- source_word: וַיִּזְרֹק
  choice: பீய்ச்சினார்
  rationale: זרק இங்கு பலியின் இரத்தத்தைப் பலிபீடத்தின் மீது வலுவாகச் செலுத்துவதைக் குறிக்கிறது. ‘பீய்ச்சினார்’ என்பது மெதுவாகத் துளித்துளியாகத் தெளிப்பதைக் காட்டாமல், அந்த வலுவான சடங்குச் செயலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הַדָּם
  choice: அந்த இரத்தத்தை
  rationale: முந்தைய சூழலில் அறுக்கப்பட்ட விலங்கின் குறிப்பிட்ட இரத்தம் என்பதால், எபிரெய மொழியின் திட்டவட்டச் சுட்டைத் தமிழில் ‘அந்த’ என வெளிப்படுத்துகிறது.
- source_word: הַמִּזְבֵּחַ
  choice: பலிபீடம்
  rationale: பலியிடும் சூழலில் מִזְבֵּחַ என்பதற்கான தெளிவான, வழக்கமான நவீனத் தமிழ் சொல்.
- source_word: סָבִיב
  choice: எல்லாப் பக்கங்களின் மேலும்
  rationale: இரத்தம் பலிபீடத்தின் ஒரு பக்கத்தில் மட்டும் அல்லாமல் அதைச் சுற்றியுள்ள பக்கங்களின் மீது செலுத்தப்பட்டதை இந்தச் சொற்றொடர் தெளிவுபடுத்துகிறது.
- source_word: מֹשֶׁה
  choice: மோசே
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற பெயர் வடிவம்.
