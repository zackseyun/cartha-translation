revisions:
- from: பின்பு அவர் அபிஷேக எண்ணெயில் சிறிதை ஆரோனின் தலையின்மேல் ஊற்றி, அவரைப் பரிசுத்தப் பணிக்கென அர்ப்பணிப்பதற்காக அவருக்கு அபிஷேகம் செய்தார்.
  to: பின்பு அவர் அபிஷேக எண்ணெயிலிருந்து சிறிதை ஆரோனின் தலையின்மேல் ஊற்றி, அவரைப் பரிசுத்தப்படுத்துவதற்காக அவருக்கு அபிஷேகம் செய்தார்.
  rationale: The revision makes the partitive sense of מִן explicit in idiomatic Tamil and removes an unstated contextual expansion. It preserves the Hebrew narrative sequence and the ritual terminology of anointing and consecration.
