  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יִּצֹק֙ מִ/שֶּׁ֣מֶן הַ/מִּשְׁחָ֔ה עַ֖ל רֹ֣אשׁ אַהֲרֹ֑ן וַ/יִּמְשַׁ֥ח אֹת֖/וֹ לְ/קַדְּשֽׁ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/012.yaml
  text: Then he poured some of the anointing oil on Aaron’s head and anointed him to consecrate him.
translation:
  language: ta
  text: பின்பு அவர் அபிஷேக எண்ணெயிலிருந்து சிறிதை ஆரோனின் தலையின்மேல் ஊற்றி, அவரைப் பரிசுத்தப்படுத்துவதற்காக அவருக்கு அபிஷேகம் செய்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּצֹק
  choice: ஊற்றி
  rationale: יצק என்பது திரவத்தை ஊற்றுவதைக் குறிக்கிறது; நவீன தமிழில் இயல்பான வினையெச்சத் தொடர்.
- source_word: מִשֶּׁמֶן הַמִּשְׁחָה
  choice: அபிஷேக எண்ணெயில் சிறிதை
  rationale: מִן என்பதன் பகுதியைக் குறிக்கும் பொருளை ‘சிறிதை’ வெளிப்படுத்துகிறது; שֶׁמֶן הַמִּשְׁחָה என்பதன் சடங்குசார் பொருளை ‘அபிஷேக எண்ணெய்’ தக்கவைக்கிறது.
- source_word: עַל רֹאשׁ אַהֲרֹן
  choice: ஆரோனின் தலையின்மேல்
  rationale: இடத்தைக் குறிக்கும் எளிய, நேரடியான மொழிபெயர்ப்பு.
- source_word: וַיִּמְשַׁח
  choice: அவருக்கு அபிஷேகம் செய்தார்
  rationale: משׁח என்பதன் ஆசாரிய அர்ப்பணிப்புச் சூழலிலான சடங்கு மற்றும் இறையியல் பொருளைப் பாதுகாக்கும் வழக்கமான தமிழ் சொற்றொடர்.
- source_word: לְקַדְּשׁוֹ
  choice: அவரைப் பரிசுத்தப் பணிக்கென அர்ப்பணிப்பதற்காக
  rationale: קדשׁ இங்கு ஆரோனை புனித சேவைக்காகத் தனியே பிரித்து நியமிப்பதைக் குறிக்கிறது; ‘பரிசுத்தப் பணிக்கென அர்ப்பணித்தல்’ என்பது அந்தச் சடங்கு மற்றும் பணிசார் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: וַ
  choice: பின்பு
  rationale: வாவ் தொடர்வினை நிகழ்ச்சிகளின் வரிசையை முன்னெடுக்கிறது; ‘பின்பு’ இயல்பான தமிழ் கதைநடையை வழங்குகிறது.
theological_decisions:
- issue: ஆசாரிய நியமனச் சூழலில் קדשׁ என்பதன் மொழிபெயர்ப்பு
  choice: பரிசுத்தப் பணிக்கென அர்ப்பணிப்பதற்காக
  alternative: அவரைப் பரிசுத்தப்படுத்துவதற்காக; அவரைப் புனிதமாக்குவதற்காக
  rationale: இவ்வசனம் ஆரோன் ஆசாரிய சேவைக்காகச் சடங்குமுறையில் தனியே பிரித்து நியமிக்கப்படுவதை விவரிக்கிறது. தேர்ந்த சொற்றொடர், பின்னாளைய குறிப்பிட்ட கோட்பாட்டு நுட்பங்களைச் சேர்க்காமல், புனிதத்தன்மையையும் பணிக்கான அர்ப்பணிப்பையும் இணைத்துக் காட்டுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியக்கூடிய, கண்ணியமான நடை. எபிரெயச் செயல்வரிசை தமிழில் இயல்பான வினையெச்சத் தொடராக அமைக்கப்பட்டுள்ளது. ‘அபிஷேகம்’ என்ற நிலைபெற்ற சடங்குசார் சொல்லுடன், קדשׁ என்பதன் நோக்கம் தெளிவாக விரித்துரைக்கப்பட்டுள்ளது.
