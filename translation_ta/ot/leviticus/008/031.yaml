base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/031.yaml
  text: And Moses said to Aaron and to his sons[a], “Boil the meat at the entrance of the tent of meeting, and there eat it and the bread that is in the basket of ordination offerings, just as I commanded, saying, ‘Aaron and his sons shall eat it.’”
translation:
  language: ta
  text: மோசே ஆரோனிடமும் அவன் மகன்களிடமும், “சந்திப்புக் கூடாரத்தின் நுழைவாயிலில் இறைச்சியை வேகவையுங்கள். அங்கே அதையும் குருத்துவப் பணியில் அமர்த்தும் சடங்குக்கான கூடையில்[a] உள்ள அப்பத்தையும் உண்ணுங்கள். ‘ஆரோனும் அவன் மகன்களும் அதை உண்ண வேண்டும்’ என்று நான் கட்டளையிட்டபடியே உண்ணுங்கள்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அர்ப்பணிப்புச் சடங்கின் கூடை.” எபிரெயச் சொல் குருக்கள் தங்கள் பணியில் அமர்த்தப்படும் சடங்கோடு தொடர்புடையவற்றைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּשְּׁלוּ
  choice: வேகவையுங்கள்
  rationale: பலியுணவுச் சூழலில் இந்த வினை கொதிக்கவைத்து அல்லது நன்றாகச் சமைப்பதைக் குறிக்கிறது. நவீனத் தமிழில் இயல்பாகவும் தேவையற்ற சமையல் விவரத்தைச் சேர்க்காமலும் இருக்க ‘வேகவையுங்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: הַבָּשָׂר
  choice: இறைச்சி
  rationale: உண்ணத்தக்க பலியிடப்பட்ட விலங்கின் தசைப்பகுதியை இங்கு குறிக்கிறது; ‘மாம்சம்’ என்பதைக் காட்டிலும் ‘இறைச்சி’ நவீனத் தமிழில் இயல்பானது.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரத்தின் நுழைவாயிலில்
  rationale: சடங்கு நடைபெறும் இடத்தைத் தெளிவாகக் காட்டுவதோடு எபிரெயச் சொற்றொடரின் இடக்குறிப்பையும் நேரடியாகப் பேணுகிறது.
- source_word: וְשָׁם תֹּאכְלוּ אֹתוֹ
  choice: அங்கே அதையும் … உண்ணுங்கள்
  rationale: שָׁם என்பதன் இடவலியுறுத்தலை ‘அங்கே’ என முன்வைத்துப் பேணுகிறது; தொடரும் அப்பத்தையும் ஒரே இயல்பான தமிழ் வாக்கியத்தில் இணைக்கிறது.
- source_word: הַלֶּחֶם
  choice: அப்பம்
  rationale: அமர்த்தும் சடங்கில் கூடையில் வைக்கப்பட்டிருந்த அப்பத்தையே குறிப்பதால் வழக்கமான வேதாகமத் தமிழ்ச் சொல்லான ‘அப்பம்’ பொருத்தமானது.
- source_word: סַל הַמִּלֻּאִים
  choice: குருத்துவப் பணியில் அமர்த்தும் சடங்குக்கான கூடை
  rationale: מִלֻּאִים என்பது ஆரோனையும் அவன் மகன்களையும் குருத்துவப் பணியில் நிறுவும் சடங்கைச் சுட்டுகிறது. பிற்காலச் சபை அலுவல் அமைப்பை இறக்குமதி செய்யாமல் அதன் சூழல்சார் பொருளை விளக்குகிறது.
- source_word: כַּאֲשֶׁר צִוֵּיתִי לֵאמֹר
  choice: ‘…’ என்று நான் கட்டளையிட்டபடியே செய்யுங்கள்
  rationale: எபிரெயத்தில் உள்ள மேற்கோள் அறிமுகத்தைப் பேணியபடி, தமிழில் முழுமையானதும் இயல்பானதுமான கட்டளை வாக்கியமாக வழங்குகிறது.
- source_word: יֹאכְלֻהוּ
  choice: அதை உண்ண வேண்டும்
  rationale: இங்கு வினை எதிர்காலத்தை மட்டும் அல்லாமல் கட்டளையின் கடப்பாட்டையும் தெரிவிப்பதால் ‘வேண்டும்’ என வழங்கப்பட்டது.
theological_decisions:
- issue: מִלֻּאִים என்ற சொல்லின் குருத்துவ நிறுவுகைச் சூழல்
  choice: குருத்துவப் பணியில் அமர்த்தும் சடங்கு
  alternative: அர்ப்பணிப்புச் சடங்கு
  rationale: இந்தச் சொல் ஆரோனும் அவன் மகன்களும் குருத்துவப் பணியில் அமர்த்தப்படுவதுடன் தொடர்புடையது. தேர்ந்தெடுத்த மொழிபெயர்ப்பு அந்தக் குறிப்பிட்ட சூழலைத் தெளிவாக்குகிறது; ‘அர்ப்பணிப்பு’ என்ற மாற்று சாத்தியத்தையும் அடிக்குறிப்பு பேணுகிறது.
translation_notes:
  register: நவீன, கண்ணியமான பொதுத்தமிழ் பயன்படுத்தப்பட்டுள்ளது. சடங்கு சார்ந்த பொருள் தெளிவாக இருக்கிறது; அதேவேளை பிற்கால மதப்பிரிவு சார்ந்த கலைச்சொற்கள் தவிர்க்கப்பட்டுள்ளன. அடிக்குறிப்பு குறி அது விளக்கும் சொற்றொடருக்குப் பின் வைக்கப்பட்டுள்ளது.
