  text: Then he brought Aaron’s sons near, and Moses put some of the blood on the lobe of their right ear, on the thumb of their right hand, and on the big toe of their right foot. Then Moses threw the blood against the altar all around.
translation:
  language: ta
  text: பின்பு அவர் ஆரோனின் மகன்களை அருகே வரச்செய்தார். மோசே அந்த இரத்தத்தில் சிறிதை அவர்களுடைய வலது காதின் மடலிலும், வலது கையின் பெருவிரலிலும், வலது காலின் பெருவிரலிலும் பூசினார். பின்னர் மோசே அந்த இரத்தத்தைப் பலிபீடத்தின் மேல் சுற்றிலும் வீசினார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: அருகே வரச்செய்தார்
  rationale: ஹிப்ரு hiphil வடிவின் காரணவினைப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது; சூழலில் மோசே அவர்களைச் சடங்கிற்காக முன்னே கொண்டுவருகிறார்.
- source_word: תְּנוּךְ אָזְנָם הַיְמָנִית
  choice: அவர்களுடைய வலது காதின் மடல்
  rationale: תנוך என்பது காதின் மடல் அல்லது வெளிப்புறக் காதின் நுனிப்பகுதியைக் குறிக்கிறது; இங்கு பொதுவாகப் புரியும் ‘காதின் மடல்’ பொருத்தமானது.
- source_word: בֹּהֶן יָדָם הַיְמָנִית
  choice: வலது கையின் பெருவிரல்
  rationale: יד உடன் வரும் בֹּהֶן கையின் பெருவிரலைக் குறிக்கிறது.
- source_word: בֹּהֶן רַגְלָם הַיְמָנִית
  choice: வலது காலின் பெருவிரல்
  rationale: רגל உடன் வரும் בֹּהֶן காலின் பெருவிரலைக் குறிக்கிறது.
- source_word: וַיִּזְרֹק
  choice: தெளித்தார்
  rationale: זרק என்பது பலியிடும் சடங்கில் இரத்தத்தைப் பலிபீடத்தின் மீது அல்லது அதற்கு எதிராக வீசித் தெளிப்பதைக் குறிக்கிறது; ‘தெளித்தார்’ தமிழில் அந்தச் சடங்குச் செயலை இயல்பாகத் தெரிவிக்கிறது.
- source_word: סָבִיב
  choice: எல்லாப் பக்கங்களிலும்
  rationale: பலிபீடத்தைச் சுற்றிலும் இரத்தம் செலுத்தப்பட்டதைக் குறிக்கும் இயல்பான தமிழ் வெளிப்பாடு.
theological_decisions:
- issue: ஆரோனின் மகன்களை அருகே கொண்டுவரும் செயலில் மறைந்த எழுவாய்
  choice: ‘அவர்’ என்று மறைந்த எழுவாயைப் பாதுகாத்தல்
  alternative: ‘மோசே’ என்று வெளிப்படையாகக் குறிப்பிடுதல்
  rationale: ஹிப்ரு முதல் வாக்கியத்தில் பெயரைச் சொல்லாமல் ஆண்பால் ஒருமை எழுவாயைக் கொண்டுள்ளது; அடுத்த உட்பிரிவில்தான் ‘மோசே’ வெளிப்படையாக வருகிறது. ஆகவே உரையின் அமைப்பைத் தேவையின்றி விளக்கமாக்கவில்லை.
- issue: இரத்தத்தைப் பலிபீடத்தில் செலுத்திய முறை
  choice: ‘தெளித்தார்’
  alternative: ‘எறிந்தார்’ அல்லது ‘வீசினார்’
  rationale: மூல வினையின் வலிமையை முற்றிலும் மென்மையாக்காமல், பலிச் சடங்குக்குரிய செயலை நவீன தமிழில் தவறான காட்சியின்றி தெரிவிக்கிறது; எந்தக் கோட்பாட்டு விளக்கமும் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ். சடங்கியல் சொற்கள் தெளிவாக வைக்கப்பட்டுள்ளன; தேவையற்ற சமயக்குழு சார்ந்த விளக்கங்கள் சேர்க்கப்படவில்லை.
