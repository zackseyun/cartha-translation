  yaml_path: translation/ot/leviticus/008/004.yaml
  text: And Moses did as Yahweh commanded him[a], and the congregation assembled at the entrance to the tent of meeting.
translation:
  language: ta
  text: யாவே அவருக்குக் கட்டளையிட்டபடியே மோசே செய்தார். சபை சந்திப்புக் கூடாரத்தின் நுழைவாயிலில் ஒன்றுகூடியது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சபை கூடிவந்தது’ அல்லது ‘சபை கூட்டப்பட்டது’ என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல்லைச் சற்றே வேறுபட்ட தமிழ் நடைகளில் தர முடியும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: செய்தார்
  rationale: עשה என்பது ‘செய்/உருவாக்கு’ எனப் பரந்த பொருளுடையது; இங்கு கட்டளைக்குக் கீழ்ப்படிந்து செயல்படுவதை இயல்பாகக் குறிக்க ‘செய்தார்’ பொருத்தமானது.
- source_word: כַּאֲשֶׁר צִוָּה
  choice: கட்டளையிட்டபடியே
  rationale: כַּאֲשֶׁר குறிக்கும் ஒத்திசைவு அல்லது இணக்கத்தையும், צוה குறிக்கும் அதிகாரமுள்ள கட்டளையையும் ஒரே இயல்பான தமிழ்த் தொடரில் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֹתוֹ
  choice: தனக்கு
  rationale: எபிரெய நேரடிச் செயப்படுபொருள் மோசேயைக் குறிக்கிறது; ‘யாவே தனக்குக் கட்டளையிட்டபடியே மோசே செய்தார்’ என்பது தமிழில் இயல்பாகவும் குறிப்பு தெளிவாகவும் உள்ளது.
- source_word: וַתִּקָּהֵל
  choice: ஒன்றுகூடியது
  rationale: Niphal வடிவம் சபை ஒன்றாகக் கூடிவந்த நிகழ்வைக் குறிக்கிறது. தமிழில் தன்னிலைச் செயலாக ‘ஒன்றுகூடியது’ இயல்பானது; செயப்பாட்டு நிழலும் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: הָעֵדָה
  choice: சபை
  rationale: இஸ்ரவேலின் கூடிய உடன்படிக்கைச் சமூகத்தைக் குறிக்கும் கூட்டுப்பெயரைச் சுருக்கமாகவும் மதிப்புடனும் தருகிறது.
- source_word: אֶל פֶּתַח
  choice: நுழைவாயிலில்
  rationale: אֶל இலக்கை நோக்கிய இயக்கத்தைக் குறித்தாலும், கூடிவந்ததன் முடிவிடத்தைத் தமிழில் இடவேற்றுமையுடன் கூறுவது இயல்பானது.
- source_word: אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரம்
  rationale: கூடாரமாகிய அமைப்பையும் சந்திப்பிற்கான அதன் பணியையும் தெளிவாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட தெய்வீகப் பெயர் நேரடியாக உள்ளது. அதைப் பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் தன்மையைப் பாதுகாக்கிறது; ‘யாவே’ என்பது ஏற்றுக்கொள்ளப்பட்ட நவீன தமிழ் ஒலிவடிவம்.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையானதாயினும் மதிப்புடைய நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆசரிப்புக் கூடாரம்’ போன்ற பழைய அல்லது மரபுசார் சொல்லுக்குப் பதிலாக, אֹהֶל מוֹעֵד என்பதன் பொருளை நேரடியாக வெளிப்படுத்தும் ‘சந்திப்புக் கூடாரம்’ தேர்ந்தெடுக்கப்பட்டது.
