base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/010.yaml
  text: Then Moses took the anointing oil and anointed the tabernacle and all that was in it[a], and consecrated them.
translation:
  language: ta
  text: பின்பு மோசே அபிஷேக எண்ணெயை எடுத்து, திருக்கூடாரத்தையும் அதிலிருந்த அனைத்தையும் அபிஷேகம் செய்து, அவற்றைப் புனிதமாக்கினார்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “அவற்றைப் புனிதப் பயன்பாட்டிற்காகப் பிரித்துவைத்தார்” அல்லது “அவற்றைப் பரிசுத்தமாக்கினார்.”
    reason: קדשׁ என்ற சொல்லின் சடங்கு சார்ந்த பொருளை “புனிதமாக்குதல்,” “பிரித்துவைத்தல்,” “பரிசுத்தமாக்குதல்” எனத் தமிழில் வெளிப்படுத்த முடியும்.
lexical_decisions:
- source_word: וַיִּקַּח
  choice: பின்பு மோசே ... எடுத்து
  rationale: வழக்கமான எபிரெயக் கதைத் தொடரில் வரும் wayyiqtol வடிவம் நிகழ்வின் அடுத்த கட்டத்தை முன்னெடுக்கிறது; “பின்பு” என்பது அதன் தொடர்ச்சியை இயல்பான நவீனத் தமிழில் காட்டுகிறது.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: அபிஷேக எண்ணெய்
  rationale: அபிஷேகம் செய்வதற்குப் பயன்படுத்தப்படும் எண்ணெயைக் குறிக்கும் இணைப்புச் சொற்றொடர். மூலத்தில் வெளிப்படையாக இல்லாத “புனித” என்ற அடைமொழி சேர்க்கப்படவில்லை.
- source_word: וַיִּמְשַׁח
  choice: அபிஷேகம் செய்து
  rationale: எண்ணெயைப் பூசி புனிதப் பணிக்காகப் பிரித்துவைக்கும் சடங்குச் செயலைக் குறிக்கும் வழக்கமான சொல்; வெறுமனே “பூசினார்” என்பதைக் காட்டிலும் சடங்கு சார்ந்த பொருளைப் பாதுகாக்கிறது.
- source_word: הַמִּשְׁכָּן
  choice: திருக்கூடாரம்
  rationale: யாத்திராகமம்–லேவியராகமம் சூழலில் இஸ்ரவேலரின் எடுத்துச் செல்லக்கூடிய வழிபாட்டுத் தலத்தைக் குறிக்கும் தெளிவான, வழக்கிலுள்ள தமிழ்ச் சொல்.
- source_word: כָּל אֲשֶׁר בּוֹ
  choice: அதிலிருந்த அனைத்தையும்
  rationale: திருக்கூடாரத்திற்குள் இருந்த பொருட்கள் அனைத்தையும் உள்ளடக்கமாகக் குறிக்கிறது; சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: וַיְקַדֵּשׁ אֹתָם
  choice: அவற்றைப் புனிதமாக்கினார்
  rationale: குருத்துவச் சடங்கு சூழலில், திருக்கூடாரத்தையும் அதன் உள்ளடக்கங்களையும் புனிதமானவையாகப் பிரித்துவைப்பதைத் தெரிவிக்கிறது. பன்மைச் சுட்டுப்பெயர் இரண்டையும் ஒருங்கே குறிக்கிறது.
theological_decisions:
- issue: குருத்துவச் சடங்கு சூழலில் קדשׁ என்பதன் மொழிபெயர்ப்பு
  choice: புனிதமாக்கினார்
  alternative: புனிதப் பயன்பாட்டிற்காகப் பிரித்துவைத்தார்
  rationale: இவ்வசனம் திருக்கூடாரத்தையும் அதன் பொருட்களையும் கடவுளுக்குரிய புனித நிலைக்காக ஒதுக்கும் சடங்கை விவரிக்கிறது. “புனிதமாக்கினார்” என்பது அந்தச் சடங்கு மற்றும் இறையியல் அழுத்தத்தைத் தக்கவைத்தபடியே, குறிப்பிட்ட சமயப் பிரிவின் கோட்பாட்டைச் சேர்க்காமல் இயல்பான தமிழில் வழங்குகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. “திருக்கூடாரம்” மற்றும் “அபிஷேகம்” ஆகியவை இச்சடங்கு சூழலில் தெளிவைத் தரும் நிலைபெற்ற சொற்களாக வைக்கப்பட்டுள்ளன; தேவையற்ற பழமையான வாக்கிய அமைப்பு தவிர்க்கப்பட்டுள்ளது.
