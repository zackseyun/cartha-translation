  text: וַ/יָּ֥שֶׂם עָלָ֖י/ו אֶת הַ/חֹ֑שֶׁן וַ/יִּתֵּן֙ אֶל הַ/חֹ֔שֶׁן אֶת הָ/אוּרִ֖ים וְ/אֶת הַ/תֻּמִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/008.yaml
  text: And he placed the breastpiece on him[b][a], and he put the Urim and the Thummim into the breastpiece.
translation:
  language: ta
  text: அவன் ஆரோன்மேல் மார்ப்பதக்கத்தை அணிவித்து,[a] அந்த மார்ப்பதக்கத்திற்குள் ஊரீமையும் தும்மீமையும் வைத்தான்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மார்ப்பதக்கம்’ என்பது தலைமைக் குரு மார்பில் அணிந்த חֹשֶׁן என்னும் சிறப்புப் பொருளைக் குறிக்கிறது; இதை ‘மார்புக்கவசம்’ என்றும் மொழிபெயர்க்கலாம். ஆனால் அது போர்க் கவசம் அல்ல.
    reason: lexical_alternative
  - marker: b
    text: ‘ஊரீம்,’ ‘தும்மீம்’ என்பவை எபிரெயச் சடங்குக் கலைச்சொற்கள். அவற்றின் துல்லியமான வடிவமும் பயன்படுத்தப்பட்ட முறையும் உறுதியாகத் தெரியவில்லை.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּשֶׂם עָלָיו
  choice: அவன் ஆரோன்மேல் … அணிவித்து
  rationale: שׂוּם என்பது ‘வை, அமை’ எனப் பொருள்படும்; ஆசாரிய உடை அணிவிக்கும் சூழலில் ‘அணிவித்து’ என்பது செயலை இயல்பாகவும் துல்லியமாகவும் தெரிவிக்கிறது. முந்தைய வசனங்களின் சூழலிலிருந்து ‘அவன்’ மோசேயையும் ‘ஆரோன்மேல்’ என்பது ஆரோனையும் குறிக்கிறது.
- source_word: הַחֹשֶׁן
  choice: மார்ப்பதக்கம்
  rationale: חֹשֶׁן என்பது தலைமைக் குருவின் மார்பில் அணியப்பட்ட சடங்குப் பொருளைக் குறிக்கிறது. ‘மார்ப்பதக்கம்’ அது போர்க் கவசம் என்ற தவறான எண்ணத்தைத் தவிர்த்து, மார்பில் அணியும் சிறப்புப் பொருள் என்பதைத் தெரிவிக்கிறது; இரு இடங்களிலும் ஒரே சொல் பயன்படுத்தப்பட்டுள்ளது.
- source_word: וַיִּתֵּן אֶל־הַחֹשֶׁן
  choice: மார்ப்பதக்கத்திற்குள் … வைத்தான்
  rationale: נתן இங்கு ‘வைத்தான்’ என்றும், אֶל சூழலின்படி பொருளை மார்ப்பதக்கத்தின் உள்ளே இடுவதைக் குறிக்கிறது. ஆகவே ‘க்குள்’ என்பது இலக்கு மற்றும் உட்புற அமைவைக் இயல்பான தமிழில் காட்டுகிறது.
- source_word: הָאוּרִים
  choice: ஊரீம்
  rationale: இது தெய்வீகத் தீர்மானத்தை அறிதலோடு தொடர்புடைய எபிரெயச் சடங்குக் கலைச்சொல். அதன் துல்லியமான வடிவமும் பயன்பாட்டு முறையும் உறுதியற்றதால் பொருள் மொழிபெயர்க்காமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: הַתֻּמִּים
  choice: தும்மீம்
  rationale: ஊரீமுடன் இணைந்து வரும் எபிரெயச் சடங்குக் கலைச்சொல். ‘நிறைவுகள்’ போன்ற ஊகப் பொருளைத் திணிக்காமல் அதன் தனிப்பெயர்ச் சிறப்பை ஒலிபெயர்ப்பு பாதுகாக்கிறது.
theological_decisions:
- issue: אוּרִים וְתֻּמִּים என்னும் ஆசாரியப் பொருட்களின் மொழியாக்கம்
  choice: ‘ஊரீம், தும்மீம்’ என்று ஒலிபெயர்த்தல்
  alternative: ‘ஒளிகள், நிறைவுகள்’ அல்லது ‘திருவுளச் சீட்டுகள்’ என்று பொருள் மொழிபெயர்த்தல்
  rationale: இவற்றின் சரியான வடிவமும் செயல்முறையும் உறுதியாகத் தெரியவில்லை. ஒலிபெயர்ப்பு மூலத்தின் குறிப்புத்தன்மையைப் பாதுகாத்து, சர்ச்சைக்குரிய விளக்கத்தை வசனத்துக்குள் புகுத்தாமல் உண்மையான தெளிவின்மையை நிலைநிறுத்துகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘அணிவித்து’ ஆசாரிய உடையணிவிக்கும் சூழலை இயல்பாக்குகிறது; ‘மார்ப்பதக்கம்’ போர்க் கவசம் என்ற எண்ணத்தைத் தவிர்க்கிறது. தொழில்நுட்பச் சடங்குப் பெயர்கள் தமிழில் நிலையான நீளொலியுடன் ஒலிபெயர்க்கப்பட்டுள்ளன.
