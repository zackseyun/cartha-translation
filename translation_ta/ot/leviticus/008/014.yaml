  text: וַ/יַּגֵּ֕שׁ אֵ֖ת פַּ֣ר הַֽ/חַטָּ֑את וַ/יִּסְמֹ֨ךְ אַהֲרֹ֤ן וּ/בָנָי/ו֙ אֶת יְדֵי/הֶ֔ם עַל רֹ֖אשׁ פַּ֥ר הַֽ/חַטָּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/014.yaml
  text: Then he brought near the bull of the sin offering[a], and Aaron and his sons laid their hands on the head of the bull of the sin offering.
translation:
  language: ta
  text: பின்பு அவர் பாவநிவாரணப் பலிக்கான காளையை அருகில் கொண்டுவந்தார்[a]. ஆரோனும் அவருடைய மகன்களும் பாவநிவாரணப் பலிக்கான காளையின் தலையின்மேல் தங்கள் கைகளை வைத்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “முன்வைத்தார்” அல்லது “முன்னால் கொண்டுவந்தார்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֵּשׁ
  choice: அருகே கொண்டுவந்தார்
  rationale: הגשׁ என்பதன் ஹிஃபில் வடிவம் ‘அருகே கொண்டுவருதல்’ அல்லது சடங்குமுறையில் ‘முன்வைத்தல்’ என்று பொருள்படும். ‘அருகே கொண்டுவந்தார்’ என்பது மூலத்தின் அணுகுதல் சார்ந்த நுணுக்கத்தைத் தக்கவைக்கிறது.
- source_word: פַּר
  choice: காளை
  rationale: பலிச் சூழலில் פַּר ஒரு ஆண் மாட்டைக் குறிக்கிறது. இவ்வசனம் அதன் வயதைத் தனியாகக் குறிப்பிடாததால் ‘காளை’ என்பது இயல்பானதும் துல்லியமானதும் ஆகும்.
- source_word: הַחַטָּאת
  choice: பாவநிவாரணப் பலி
  rationale: חַטָּאת என்பது ‘பாவம்’ என்றும், பலிச் சட்டச் சூழலில் பாவத்திற்காகச் செலுத்தப்படும் பலி என்றும் பொருள்படலாம். இங்கு விலங்கைக் குறிக்கும் பலிச் சூழல் தெளிவாக இருப்பதால் ‘பாவநிவாரணப் பலி’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: וַיִּסְמֹךְ
  choice: வைத்தார்கள்
  rationale: סמך என்பது பலிச் சடங்கில் கையை விலங்கின்மேல் வைக்கும் அல்லது ஊன்றும் செயலைக் குறிக்கிறது. அழுத்தத்தின் அளவை மிகைப்படுத்தாமல் செயலை இயல்பாகச் சொல்ல ‘வைத்தார்கள்’ பயன்படுத்தப்பட்டது.
- source_word: יְדֵיהֶם
  choice: தங்கள் கைகளை
  rationale: எபிரெய மூலத்தில் ‘கைகள்’ என்பது பன்மையில் உள்ளது. ‘தங்கள் கைகளை’ என்பது அந்தப் பன்மையையும் செயலில் பங்கேற்றவர்களையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: עַל רֹאשׁ
  choice: தலையின்மேல்
  rationale: சடங்குச் சூழலிலுள்ள நேரடியான இடவுறவை நவீனத் தமிழில் தெளிவாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: பலியின்மேல் கைகளை வைக்கும் செயலின் பொருள்
  choice: செயலை மட்டும் விளக்கமின்றி விவரித்தல்
  alternative: அது பலியோடு அடையாளப்படுத்துதல், குற்றத்தை மாற்றுதல் அல்லது பலிக்காக விலங்கை நியமித்தல் என்று மொழிபெயர்ப்பிலேயே விளக்குதல்
  rationale: இவ்வசனம் சடங்குச் செயலைக் கூறுகிறது; அதன் இறையியல் செயல்முறையை விளக்கவில்லை. ஆகவே மூலத்தில் வெளிப்படையாக இல்லாத ஒரு குறிப்பிட்ட விளக்கத்தை மொழிபெயர்ப்புக்குள் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரநிலைத் தமிழில், வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமான ஆனால் பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ஆரோனைப் பற்றிய தொடரில் இயல்பான தமிழ் ஒருமையைப் பின்பற்றி ‘அவன் மகன்கள்’ என வழங்கப்பட்டுள்ளது.
