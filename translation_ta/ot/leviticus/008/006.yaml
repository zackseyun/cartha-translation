  yaml_path: translation/ot/leviticus/008/006.yaml
  text: Then Moses brought Aaron and his sons near and washed them with water.
translation:
  language: ta
  text: பின்பு மோசே ஆரோனையும் அவனுடைய மகன்களையும் அருகே கொண்டுவந்து, அவர்களைத் தண்ணீரால் கழுவினார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: அருகே அழைத்துவந்து
  rationale: קרב என்பதன் ஹிஃபில் வடிவம் ‘அருகே கொண்டுவருதல்’ என்று பொருள்படும். திருநிலைப்படுத்தும் சடங்கின் இடத்திற்கு அவர்களை அழைத்துவரும் செயலை இயல்பான தமிழில் இது தெளிவாகக் காட்டுகிறது.
- source_word: מֹשֶׁה
  choice: மோசே
  rationale: தமிழ் வேதாகம மரபில் நிலைபெற்றுள்ள பெயர் வடிவம்.
- source_word: אַהֲרֹן
  choice: ஆரோன்
  rationale: தமிழ் வேதாகம மரபில் நிலைபெற்றுள்ள பெயர் வடிவம்.
- source_word: בָּנָיו
  choice: அவனுடைய மகன்கள்
  rationale: இங்கு בנים என்பது ஆசாரியர்களாகத் திருநிலைப்படுத்தப்படும் ஆரோனின் ஆண் பிள்ளைகளைக் குறிப்பதால் ‘மகன்கள்’ என்பது துல்லியமானது.
- source_word: וַיִּרְחַץ
  choice: கழுவினார்
  rationale: רחץ என்பது கழுவுதல் அல்லது குளிப்பாட்டுதல் எனப் பொருள்படலாம். செயல் முழு உடலையா ஒரு பகுதியையா சார்ந்தது என்பதை மூலவசனம் குறிப்பிடாததால், ‘கழுவினார்’ அந்தத் தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: אֹתָם
  choice: அவர்களை
  rationale: ஆரோனையும் அவனுடைய மகன்களையும் ஒன்றாகக் குறிக்கும் நேரடிச் செயப்படுபொருள் சுட்டுப்பெயர்.
- source_word: בַּמָּיִם
  choice: தண்ணீரால்
  rationale: ב முன்னிடைச்சொல் இங்கு கழுவுவதற்குப் பயன்படுத்தப்பட்ட சாதனத்தைச் சுட்டுகிறது; ‘தண்ணீரால்’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: וַ
  choice: பின்பு
  rationale: தொடர்ச்சியான நிகழ்வை முன்னெடுக்கும் வாவ் வடிவத்தின் வரிசைத் தன்மையை இயல்பான தமிழில் காட்டுகிறது.
