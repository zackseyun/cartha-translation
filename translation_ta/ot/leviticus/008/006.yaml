review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys Moses as subject, Aaron and his sons as the joint object, washing, and water as the means. However, «அழைத்துவந்து» adds the idea of calling/summoning, which is not expressed by the Hiphil of קרב here; the source simply says that Moses brought them near.
  naturalness: The sentence is fluent modern standard Tamil. Replacing «அழைத்துவந்து» with «கொண்டுவந்து» is equally natural and more exact.
  terminology: «மோசே», «ஆரோன்», «மகன்கள்», and «தண்ணீரால் கழுவினார்» are appropriate established and comprehensible choices. No theological terminology requires adjustment.
  issues:
  - severity: low
    issue: «அருகே அழைத்துவந்து» contains an added summons nuance.
    rationale: וַיַּקְרֵב means ‘brought near’/‘brought forward’; it does not state that Moses called them. «அருகே கொண்டுவந்து» preserves the concrete movement without adding an action.
  revised_text: பின்பு மோசே ஆரோனையும் அவனுடைய மகன்களையும் அருகே கொண்டுவந்து, அவர்களைத் தண்ணீரால் கழுவினார்.
  revised_footnotes: []
  revision_rationale: A minimal lexical revision removes the unexpressed notion of summoning while retaining the narrative sequence, ritual context without overinterpreting it, and the source’s stated means of washing.
