translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘சமர்ப்பித்தார்’ போன்ற கூடுதல் சடங்கியல் விளக்கத்தைத் தவிர்த்து, மூலத்தின் நேரடியான இயக்கத்தை ‘அருகே அழைத்துவந்து’ எனப் பாதுகாக்கிறது.
