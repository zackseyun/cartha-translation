  register: நவீனத் தரத் தமிழில், வழிபாட்டு மரியாதையையும் மூலத்தின் செயல்வரிசையையும் காக்கும் நடை பயன்படுத்தப்பட்டுள்ளது. முதல் வாக்கியக் கூறின் மறைமுக எழுவாய் ‘அவர்’ எனவும், இரண்டாம் கூறில் மூலத்தில் வெளிப்படையாக வரும் மோசேயின் பெயர் அப்படியே வைக்கப்பட்டும் உள்ளது.
