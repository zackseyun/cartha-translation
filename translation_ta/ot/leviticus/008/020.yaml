  yaml_path: translation/ot/leviticus/008/020.yaml
  text: Then he cut the ram into its pieces[a], and Moses burned the head, the pieces, and the suet in smoke.
translation:
  language: ta
  text: அந்த ஆட்டுக்கடா துண்டுகளாக வெட்டப்பட்டது; மோசே தலையையும் துண்டுகளையும் கொழுப்பையும்[a] புகையாக எழும்பும்படி எரித்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல் பலிக்குரிய விலங்கின் கொழுப்பான பகுதியைக் குறிக்கிறது; இதை ‘கொழுப்பு’ அல்லது ‘சூயெட்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאַיִל
  choice: ஆட்டுக்கடா
  rationale: பலிச் சூழலில் אַיִל என்பது வளர்ந்த ஆண் செம்மறியாட்டைக் குறிக்கிறது; நவீனத் தமிழில் ‘ஆட்டுக்கடா’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: נִתַּח לִנְתָחָיו
  choice: துண்டுகளாக வெட்டினார்
  rationale: ஒரே வேரிலிருந்து வந்த வினைச்சொல்–பெயர்ச்சொல் இணைப்பு, விலங்கை அதன் பகுதிகளாக வெட்டிப் பிரித்த செயலைக் குறிக்கிறது.
- source_word: וַיַּקְטֵר
  choice: புகையாக எழும்பும்படி எரித்தார்
  rationale: பலியிடும் சூழலில் קטר என்பதன் ஹிஃபில் வடிவம், ஒன்றை எரித்து புகையாக மேலெழச் செய்வதைக் குறிக்கிறது; வெறுமனே ‘எரித்தார்’ என்பதைக் காட்டிலும் இந்தச் சிறப்புப் பொருளை இவ்வாக்கியம் காக்கிறது.
- source_word: הָרֹאשׁ
  choice: தலை
  rationale: இது விலங்கின் தலையைக் குறிக்கும் நேரடியான உடற்கூற்றுச் சொல்.
- source_word: הַנְּתָחִים
  choice: துண்டுகள்
  rationale: முந்தைய வினைச்சொல்லோடு ஒரே வேரைப் பகிரும் இச்சொல், வெட்டிப் பிரிக்கப்பட்ட பகுதிகளைக் குறிக்கிறது; ‘துண்டுகள்’ என்பது இயல்பான தொடர்ச்சி.
- source_word: הַפָּדֶר
  choice: கொழுப்புப் பகுதி
  rationale: פָּדֶר பலிக்குரிய விலங்கின் குறிப்பிட்ட கொழுப்பான பகுதியைக் குறிக்கிறது. அதன் துல்லியமான உடற்கூற்றுச் சுட்டு உறுதியில்லாததால், ‘கொழுப்பு வால்’ என்று மிகக் குறிப்பாகத் தீர்மானிக்காமல் ‘கொழுப்புப் பகுதி’ என மொழிபெயர்க்கப்பட்டுள்ளது.
