source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר מֹשֶׁ֖ה אֶל הָ/עֵדָ֑ה זֶ֣ה הַ/דָּבָ֔ר אֲשֶׁר צִוָּ֥ה יְהוָ֖ה לַ/עֲשֽׂוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/005.yaml
  text: And Moses said to the congregation[a], “This is the thing that Yahweh has commanded to be done.”
translation:
  language: ta
  text: மோசே சபையாரிடம், “யாவே செய்யக் கட்டளையிட்ட காரியம் இதுதான்[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “யாவே செய்யப்பட வேண்டும் என்று கட்டளையிட்ட காரியம் இதுதான்” என்றும் மொழிபெயர்க்கலாம். எபிரேயத்தில் “செய்ய” என்பது செய்வினை வடிவில் இருந்தாலும், இங்கு செய்பவர் குறிப்பிடப்படாத பொதுப்பொருளில் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: என்றார்
  rationale: வாவ் தொடர்வினை கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது. தமிழில் மேற்கோளுக்குப் பின் வரும் “என்றார்” இயல்பாக அந்தத் தொடர்ச்சியை வெளிப்படுத்துகிறது; தனியாக “அப்போது” அல்லது “மேலும்” சேர்க்க வேண்டியதில்லை.
- source_word: מֹשֶׁה
  choice: மோசே
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள பெயர்வடிவம்.
- source_word: אֶל־הָעֵדָה
  choice: சபையாரிடம்
  rationale: עֵדָה இங்கு ஒன்றுகூடிய இஸ்ரவேல் மக்களைக் குறிக்கிறது. “சபையார்” வழிபாட்டுச் சூழலிலுள்ள கூடிய சமூகத்தைக் குறிக்கும் இயல்பான, மரியாதையான நவீனத் தமிழ் சொல்.
- source_word: זֶה הַדָּבָר
  choice: காரியம் இதுதான்
  rationale: சுட்டுப்பெயர் மற்றும் பெயர்ச்சொல் ஆகிய இரண்டையும் வெளிப்படையாகக் காக்கிறது; “இதைத்தான்” என்பதைக் காட்டிலும் எபிரேய அமைப்புக்கு நெருக்கமாகவும் தமிழில் இயல்பாகவும் உள்ளது.
- source_word: צִוָּה
  choice: கட்டளையிட்ட
  rationale: முன்னரே கொடுக்கப்பட்ட கட்டளை இப்போது நிறைவேற்றப்படுவதைச் சுட்டும் நிறைவேற்ற வினை. தமிழின் பெயரெச்ச வடிவம் இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது இறைவனுடைய தனிப்பெயரான நான்கெழுத்துப் பெயர்; பட்டப்பெயரால் மாற்றாமல், நவீனத் தமிழில் பொதுவாகப் புரியக்கூடிய ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: לַעֲשׂוֹת
  choice: செய்ய
  rationale: எபிரேயத்தில் வினையெச்சம் இலக்கணப்படி செயப்பாட்டு அல்ல, செய்வினை வடிவில் உள்ளது. செய்பவர் வெளிப்படையாகக் குறிப்பிடப்படாத தமிழின் “செய்யக் கட்டளையிட்ட” அமைப்பு மூலத்தின் வடிவத்தையும் சூழலின் பொதுப்பொருளையும் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் தனிப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரையில் பட்டப்பெயர் அல்ல, இறைவனுடைய தனிப்பெயரே நேரடியாக உள்ளது. எனவே தனிப்பெயரை மறைக்காமல் ஒலிபெயர்ப்பாக வழங்கப்பட்டுள்ளது.
- issue: לַעֲשׂוֹת என்பதன் செய்பவர் குறிப்பிடப்படாத தன்மை
  choice: செய்யக் கட்டளையிட்ட
  alternative: செய்யப்பட வேண்டும் என்று கட்டளையிட்ட
  rationale: மூல எபிரேய வினையெச்சம் வடிவில் செய்வினையாக இருந்தாலும், செய்பவர் குறிப்பிடப்படவில்லை. முதன்மை உரை அந்த இலக்கண வடிவத்தையும் தெளிவின்மையையும் காக்கிறது; சூழலுக்கு ஏற்ற செயப்பாட்டு புரிதல் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமான ஆனால் சாதாரண வாசகர்களுக்கும் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. நேரடி உரையின் சுருக்கமும் எபிரேய வாக்கியத்தின் வலியுறுத்தலும் காக்கப்பட்டுள்ளன.
