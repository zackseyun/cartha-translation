    issue: “அருட்பணி நிறுவுதல்” is semantically broad and stylistically unnatural for מִלֻּאִים in this priestly-installation context.
    rationale: The Hebrew expression is a technical priestly term for the installation rite. “அருட்பணி” may be understood as any religious service and does not explicitly convey ordination to priestly office. “ஆசாரியப் பணியில் அமர்த்துதல்” is clearer, natural modern Tamil, and faithful to the immediate context.
