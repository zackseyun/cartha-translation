base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/022.yaml
  text: Then he brought near the second ram[a], the ram of ordination, and Aaron and his sons laid their hands on the head of the ram.
translation:
  language: ta
  text: பின்பு அவர் இரண்டாவது செம்மறியாட்டுக் கடாவை, அதாவது ஆசாரியப் பணியில் அமர்த்துவதற்கான கடாவை[a], அருகே கொண்டுவந்தார். ஆரோனும் அவனுடைய மகன்களும் அந்தக் கடாவின் தலையின்மேல் தங்கள் கைகளை வைத்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அர்ப்பணிப்புக்கான கடா’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொற்றொடர், ஆசாரியரைப் பதவியில் அமர்த்தும் சடங்கைக் குறிக்கும் தொழில்நுட்பச் சொல்லாகும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: பின்பு அவர் ... அருகே கொண்டுவந்தார்
  rationale: קרב என்பதன் Hiphil வடிவம் சடங்கிற்காக அருகே கொண்டுவருதல் அல்லது முன்வைத்தல் எனப் பொருள்படும். ‘அருகே கொண்டுவந்தார்’ என்பது எபிரெயச் சொல்லின் சடங்கு நுணுக்கத்தையும் தொடர்கதை வாவையும் காக்கிறது.
- source_word: הָאַיִל הַשֵּׁנִי
  choice: இரண்டாவது செம்மறியாட்டுக் கடாவை
  rationale: אַיִל என்பது ஆண் செம்மறியாட்டைக் குறிக்கிறது; הַשֵּׁנִי தெளிவாக ‘இரண்டாவது’ எனும் வரிசை எண்ணாகும். தமிழில் ‘கடா’ மட்டும் தெளிவில்லாததால் விலங்கு வகையும் பாலினமும் வெளிப்படுமாறு மொழிபெயர்க்கப்பட்டது.
- source_word: אֵיל הַמִּלֻּאִים
  choice: அருட்பணி நிறுவுதலுக்கான கடாவை
  rationale: מִלֻּאִים என்பதன் அடிப்படை எண்ணம் ‘நிரப்புதல்’; ஆசாரியச் சூழலில் அது ஒருவரை ஆசாரியப் பணியில் நிறுவும் சடங்கைக் குறிக்கும் தொழில்நுட்பச் சொல். ‘அருட்பணி நிறுவுதல்’ என்பது பதவியில் அமர்த்தும் பொருளை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: וַיִּסְמְכוּ ... אֶת יְדֵיהֶם
  choice: தங்கள் கைகளை வைத்தார்கள்
  rationale: סמך பலிச் சடங்குகளில் கையை வைத்தல் அல்லது அழுத்துதல் என்ற பொருளுடையது. மூலத்தின் பன்மையான ‘கைகள்’ தமிழிலும் காக்கப்பட்டுள்ளது.
- source_word: עַל רֹאשׁ הָאָיִל
  choice: அந்தக் கடாவின் தலையின்மேல்
  rationale: மூலத்தின் முன்னிடைச்சொல் அமைப்பையும் சடங்குச் செயலின் இலக்கையும் தெளிவாகக் காட்டும் நேரடியான மொழியாக்கம்.
- source_word: אַהֲרֹן וּבָנָיו
  choice: ஆரோனும் அவனுடைய மகன்களும்
  rationale: בָנָיו இச்சூழலில் ஆசாரியப் பணிக்கு நிறுவப்படும் ஆரோனின் ஆண் சந்ததியினரைக் குறிக்கிறது; ஆகவே ‘மகன்கள்’ பாலினத்திலும் சூழலிலும் துல்லியமானது.
theological_decisions:
- issue: ஆசாரியச் சடங்கின் தொழில்நுட்பச் சொல்லான מִלֻּאִים-ஐ மொழிபெயர்த்தல்
  choice: அருட்பணி நிறுவுதல்
  alternative: அர்ப்பணித்தல்; திருநிலைப்படுத்துதல்; கைகளை நிரப்புதல்
  rationale: லேவியராகமம் 8-இல் ஆரோனும் அவன் மகன்களும் ஆசாரியப் பொறுப்பில் அமர்த்தப்படுவதே மையம். ‘அருட்பணி நிறுவுதல்’ அந்தப் பதவி நிறுவுதலைத் தெளிவாக்குகிறது; அதேவேளை ‘அர்ப்பணித்தல்’ என்ற மாற்று பொருளும் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது. சொல்லின் நேரடி உருவகமான ‘கைகளை நிரப்புதல்’ பிரதான உரையில் பொருளை மறைத்துவிடும்.
translation_notes:
  register: நவீன பொதுத்தமிழில், சடங்கின் கண்ணியமான தொனியைப் பேணும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘செம்மறியாட்டுக் கடா’ விலங்கு வகையையும் ஆண் பாலினத்தையும் தெளிவாக்குகிறது. அடிக்குறி [a] பிரதான உரையில் உரிய சொல்லுக்குப் பின் இடம்பெற்றுள்ளது.
