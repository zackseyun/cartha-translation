base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/036.yaml
  text: And Aaron and his sons did all the things that Yahweh had commanded through Moses[a].
translation:
  language: ta
  text: யாவே மோசே வழியாகக் கட்டளையிட்ட எல்லாவற்றையும் ஆரோனும் அவருடைய மகன்களும் செய்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “மோசேயின் கையால்”; இது “மோசே வழியாக” அல்லது “மோசேயை இடைநிலையாளராகக் கொண்டு” என்று பொருள்படும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: செய்தார்கள்
  rationale: עָשָׂה இங்கு கட்டளைகளுக்குக் கீழ்ப்படிந்து செயல்பட்டதை எளிய கதைநடையில் தொகுத்துக் கூறுகிறது; ‘செய்தார்கள்’ என்பது இயல்பான, நேரடியான தமிழ் வடிவம்.
- source_word: אַהֲרֹן וּבָנָיו
  choice: ஆரோனும் அவருடைய மகன்களும்
  rationale: בָּנָיו என்பது இந்த ஆசாரியச் சூழலில் ஆரோனின் ஆண் பிள்ளைகளைக் குறிக்கிறது; ஆகவே ‘மகன்கள்’ என்பது துல்லியமானது.
- source_word: אֵת כָּל הַדְּבָרִים
  choice: எல்லாவற்றையும்
  rationale: דְּבָרִים என்பதற்கு ‘வார்த்தைகள்,’ ‘காரியங்கள்’ போன்ற பொருள்கள் இருக்கலாம். இங்கு சடங்கு சார்ந்த கட்டளைகள் அனைத்தும் நிறைவேற்றப்பட்டதைக் குறிக்க, ‘எல்லாவற்றையும்’ இயல்பாகப் பொருந்துகிறது.
- source_word: צִוָּה
  choice: கட்டளையிட்ட
  rationale: முன்னரே கொடுக்கப்பட்ட கட்டளைகளைக் குறிக்கும் தொடர்பெயரெச்ச வடிவம்; தமிழ் வாக்கியத்தில் காலவரிசை இயல்பாகத் தெளிவாகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது இறைவனின் தனிப்பெயரான நான்கெழுத்துப் பெயர்; ஒரு பட்டமாக மாற்றாமல் தமிழில் வழக்கமான ஒலிபெயர்ப்பான ‘யாவே’ என்று தரப்பட்டுள்ளது.
- source_word: בְּיַד מֹשֶׁה
  choice: மோசே வழியாக
  rationale: ‘மோசேயின் கையால்’ என்ற எபிரெய மரபுத்தொடர் இங்கு கருவி அல்லது இடைநிலையைச் சுட்டுகிறது; ‘மோசே வழியாக’ என்பது அதன் பொருளை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக இருப்பதால், அதை ஒரு பொதுப் பட்டமான ‘ஆண்டவர்’ என்று மாற்றாமல் ஒலிபெயர்த்து, உடன்படிக்கைப் பெயரின் தன்மையைப் பாதுகாக்கிறது.
- issue: בְּיַד מֹשֶׁה என்பதில் மோசேயின் பங்கு
  choice: மோசே வழியாக
  alternative: மோசேயின் கையால்
  rationale: இச்சொற்றொடர் மோசேயை கட்டளையின் மூலாதாரமாக அல்ல, யாவேயின் கட்டளை சென்றடைந்த இடைநிலையாளராகக் காட்டுகிறது; அதையே விளக்கமின்றி மிகைப்படுத்தாமல் ‘வழியாக’ வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘கட்டளையிட்ட எல்லாவற்றையும்’ என்பது மூலத்தின் பொருளைத் தெளிவாக வைத்துக்கொண்டு தமிழில் இயல்பாக ஒலிக்கிறது; அரிதான ‘கையால்’ மரபுத்தொடரின் சொற்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
