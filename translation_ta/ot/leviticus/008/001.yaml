lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பின்பு ... கூறினார்
  rationale: வாவ் தொடர்ச்சியுடன் வரும் דּבר கதைநிகழ்வை அடுத்த கட்டத்துக்கு நகர்த்துகிறது. நவீன தமிழில் “பின்பு” அதன் தொடர்ச்சியைக் காட்டுகிறது; வசனத்தின் முடிவிலுள்ள לֵאמֹר உடன் இயல்பாக அமைய “கூறினார்” பயன்படுத்தப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: எபிரேய மெய்யெழுத்துப் பெயரான YHWH-ஐ ஒரு பட்டப்பெயராக மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட பெயர்வடிவமான “யெகோவா” என்று ஒலிபெயர்க்கிறது.
- source_word: אֶל
  choice: -இடம்
  rationale: பேச்சு யாரை நோக்கி உரைக்கப்பட்டது என்பதைக் குறிக்கும் எபிரேய முன்னிடைச்சொல்லுக்கு இயல்பான தமிழ் வேற்றுமை வடிவம்.
- source_word: מֹשֶׁה
  choice: மோசே
  rationale: தனிப்பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: לֵאמֹר
  choice: 'கூறினார்:'
  rationale: இந்த எபிரேய வாய்பாடு அடுத்து வரும் நேரடி உரையை அறிமுகப்படுத்துகிறது. தமிழில் இருமுறை “கூறி, கூறினார்” எனச் செயற்கையாக அமைக்காமல், இரட்டைப்புள்ளியுடன் அடுத்த உரையைத் திறப்பது இயல்பான சமமதிப்பை வழங்குகிறது.
theological_decisions:
- issue: இறைப் பெயரான יְהוָה-வை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் பட்டப்பெயர் அல்ல, நான்கு மெய்யெழுத்துகளைக் கொண்ட தனிப்பெயர் நேரடியாக உள்ளது. அதை “கர்த்தர்” என மாற்றாமல் பெயராகவே காக்கப்பட்டுள்ளது. பண்டைய உச்சரிப்பு முழுமையாக உறுதிப்படுத்தப்படாததால் மாற்று ஒலிபெயர்ப்புகள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில் சுருக்கமான, கண்ணியமான உரை. அடுத்த வசனத்தில் தொடங்கும் நேரடி உரையை இயல்பாக அறிமுகப்படுத்த இரட்டைப்புள்ளி பயன்படுத்தப்பட்டுள்ளது; அடிக்குறி இறைப் பெயருடன் நேரடியாக இணைக்கப்பட்டுள்ளது.
