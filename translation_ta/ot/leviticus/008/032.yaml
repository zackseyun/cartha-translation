base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/032.yaml
  text: And what remains of the meat and of the bread you shall burn with fire[a].
translation:
  language: ta
  text: இறைச்சியிலும்[a] அப்பத்திலும் மீதமிருப்பதை நெருப்பில் எரித்துவிடுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சதையிலும்.” எபிரெயச் சொல் நேரடியாக “சதை” என்று பொருள்படும்; இங்கு அது பலியிடப்பட்ட விலங்கின் உணவுக்குரிய இறைச்சியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנּוֹתָר
  choice: மீதமிருப்பதை
  rationale: נותר என்பதன் பெயரெச்சப் பொருளான ‘எஞ்சியிருப்பது’ என்பதை இயல்பான நவீனத் தமிழில் பொருள்படுத்துகிறது.
- source_word: בַּבָּשָׂר
  choice: இறைச்சியிலும்
  rationale: בָּשָׂר என்பதன் அடிப்படைப் பொருள் ‘சதை’; ஆனால் இங்கு பலியிடப்பட்ட விலங்கின் உணவுக்குரிய பகுதியைக் குறிப்பதால் ‘இறைச்சி’ சூழலுக்கு இயல்பாக உள்ளது. מילת היחס ב־-ஐ அப்பத்துடன் இணையான ‘-இலும்’ அமைப்பில் வழங்குகிறது.
- source_word: וּבַלָּחֶם
  choice: அப்பத்திலும்
  rationale: לֶחֶם என்பதற்கு வழக்கமான தமிழ் வேதாகம மற்றும் பொதுப் பயன்பாட்டுச் சொல் ‘அப்பம்’; இணைப்பையும் இணையான அமைப்பையும் ‘-த்திலும்’ வெளிப்படுத்துகிறது.
- source_word: בָּאֵשׁ
  choice: நெருப்பில்
  rationale: இங்குள்ள ב־ எரித்தல் நடைபெறும் ஊடகம் அல்லது சூழலைக் குறிக்கிறது; ‘நெருப்பில்’ என்பது நேரடியான, இயல்பான தமிழ்.
- source_word: תִּשְׂרֹפוּ
  choice: எரித்துவிடுங்கள்
  rationale: இரண்டாம் நபர் ஆண்பால் பன்மை imperfect இங்கு கட்டளை வலிமையுடையது. ‘எரித்துவிடுங்கள்’ பன்மை முகவரியையும் செயலை முழுமையாகச் செய்வதற்கான அறிவுறுத்தலையும் இயல்பாக வெளிப்படுத்துகிறது.
