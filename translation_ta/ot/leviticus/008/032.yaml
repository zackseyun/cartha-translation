  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான கட்டளை நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் பன்மை முகவரி வினைமுற்றில் தக்கவைக்கப்பட்டுள்ளது.
