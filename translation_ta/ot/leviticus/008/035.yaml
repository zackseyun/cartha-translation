  text: וּ/פֶתַח֩ אֹ֨הֶל מוֹעֵ֜ד תֵּשְׁב֨וּ יוֹמָ֤ם וָ/לַ֨יְלָה֙ שִׁבְעַ֣ת יָמִ֔ים וּ/שְׁמַרְתֶּ֛ם אֶת מִשְׁמֶ֥רֶת יְהוָ֖ה וְ/לֹ֣א תָמ֑וּתוּ כִּי כֵ֖ן צֻוֵּֽיתִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/035.yaml
  text: And you shall stay at the entrance of the tent of meeting day and night for seven days[a], and keep the charge of Yahweh, so that you may not die; for so I have been commanded.
translation:
  language: ta
  text: சந்திப்புக் கூடாரத்தின் வாசலில் ஏழு நாட்கள் பகலும் இரவும் தங்கியிருந்து, யாவே விதித்த காவற்கடமையைக் கடைப்பிடியுங்கள்; நீங்கள் சாகாதபடிக்கு.[a] ஏனெனில் இப்படித்தான் எனக்குக் கட்டளையிடப்பட்டது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீங்கள் சாகமாட்டீர்கள்”; வேறொரு முறையில், “நீங்கள் சாகாதபடிக்கு.”
    reason: וְלֹא תָמֻתוּ என்பதை இணைநிலை விளைவாகவோ, தவிர்க்க வேண்டிய அபாயத்தைச் சுட்டும் எச்சரிக்கையாகவோ புரிந்துகொள்ளலாம்.
lexical_decisions:
- source_word: וּפֶתַח אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரத்தின் வாசலில்
  rationale: פֶתַח என்பது நுழைவிடம் அல்லது வாசலைக் குறிக்கிறது; אֹהֶל מוֹעֵד என்ற வழிபாட்டுத்தலப் பெயரை இயல்பாகவும் நேரடியாகவும் ‘சந்திப்புக் கூடாரம்’ என வழங்குகிறது.
- source_word: תֵּשְׁבוּ
  choice: தங்கியிருந்து
  rationale: ישב என்பதற்கு ‘உட்காருதல், குடியிருத்தல், நிலைத்திருத்தல்’ ஆகிய பொருள்கள் உள்ளன. இச்சடங்குச் சூழலில் ஏழு நாட்களும் அந்த இடத்தைவிட்டு நீங்காமல் இருப்பதே கருத்து.
- source_word: יוֹמָם וָלַיְלָה שִׁבְעַת יָמִים
  choice: ஏழு நாட்கள், பகலும் இரவும்
  rationale: முழுக் காலத்தையும் தொடர்ச்சியாகக் குறிக்கும் எபிரெயச் சொற்றொடரைத் தமிழில் இயல்பான வரிசையிலும் தெளிவான காலக் குறிப்புடனும் வழங்குகிறது.
- source_word: וּשְׁמַרְתֶּם אֶת מִשְׁמֶרֶת יְהוָה
  choice: யாவே விதித்த காவற்கடமையைக் கடைப்பிடியுங்கள்
  rationale: שמר + משמרת என்பது ஒப்படைக்கப்பட்ட காவல் அல்லது விதிக்கப்பட்ட கடமையை முறையாகக் கடைப்பிடிப்பதைக் குறிக்கிறது. ‘காவற்கடமை’ சடங்கு சார்ந்த பொறுப்பின் நுண்ணுணர்வைத் தக்கவைக்கிறது; ‘விதித்த’ என்பது தமிழில் உடைமைத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் வரும் இறைநாமத்தை ஒரு பொதுப்பட்டமாக மாற்றாமல், தமிழில் அதன் பரவலான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: וְלֹא תָמֻתוּ
  choice: அப்போது நீங்கள் சாகமாட்டீர்கள்
  rationale: முந்தைய கட்டளையைக் கடைப்பிடிப்பதால் தவிர்க்கப்படும் விளைவைத் தமிழில் தெளிவாகக் காட்டுகிறது; எபிரெய இணைப்பின் இலக்கண இருமையை அடிக்குறிப்பு பதிவு செய்கிறது.
- source_word: כִּי כֵן צֻוֵּיתִי
  choice: ஏனெனில் இப்படித்தான் எனக்குக் கட்டளையிடப்பட்டது
  rationale: செயப்பாட்டு வடிவத்தையும், மோசே தனக்குக் கிடைத்த கட்டளையை அறிவிக்கிறார் என்பதையும் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைநாமத்தின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூல உரை ஒரு பட்டத்தை அல்ல, இறைநாமத்தையே பயன்படுத்துவதால் அதனை ஒலிபெயர்த்து வழங்குவது மூலத்துக்கு நெருக்கமானது.
- issue: וְלֹא תָמֻתוּ என்ற மரண எச்சரிக்கையின் இலக்கண வலிமை
  choice: கீழ்ப்படிதலால் தவிர்க்கப்படும் விளைவாக ‘அப்போது நீங்கள் சாகமாட்டீர்கள்’
  alternative: ‘இல்லையெனில் நீங்கள் சாவீர்கள்’ அல்லது இணைநிலை வாக்கியமாக ‘நீங்கள் சாகமாட்டீர்கள்’
  rationale: கட்டளையைத் தொடர்ந்து வரும் இச்சொற்றொடர், கீழ்ப்படிதலுடன் தொடர்புடைய விளைவைக் குறிக்க முடியும். எந்த ஒரு வாசிப்பையும் மறைக்காமல் மாற்று வலிமைகள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
translation_notes:
  register: நவீனத் தரத் தமிழில், வழிபாட்டு மற்றும் ஆசாரியச் சூழலுக்கேற்ற கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. ‘காவற்கடமை’ என்ற சொல் அன்றாட ‘வேலை’ என்பதைக் காட்டிலும் மூலத்தின் சடங்கு சார்ந்த பொறுப்பைத் தக்கவைக்கிறது.
