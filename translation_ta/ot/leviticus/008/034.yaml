  yaml_path: translation/ot/leviticus/008/034.yaml
  text: Just as has been done on this day[a], Yahweh has commanded to be done, to make atonement for you.
translation:
  language: ta
  text: இன்று செய்யப்பட்டபடியே, உங்களுக்காகப் பாவநிவிர்த்தி செய்யும்படி இதைச் செய்ய யாவே கட்டளையிட்டார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “இன்று செய்யப்பட்டது போல, உங்களுக்காகப் பாவநிவிர்த்தி செய்வதற்காக இதைச் செய்ய யாவே கட்டளையிட்டார்.”'
    reason: எபிரெய வாக்கியத்தில் ஒப்பீட்டுத் தொடர் ‘செய்ய’ என்னும் கட்டளையிடப்பட்ட செயலுடன் எவ்வாறு தொடர்புபடுகிறது என்பதற்கான இயல்பான தொடரியல் மாற்றை வெளிப்படுத்துகிறது.
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: செய்யப்பட்டதுபோலவே
  rationale: முன்னர் நடைபெற்ற சடங்குச் செயல்களுடன் ஒப்பிடும் பொருளை இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: עָשָׂה
  choice: செய்யப்பட்டது
  rationale: எபிரெயத்தில் வினை 3ஆம் நபர் ஆண்பால் ஒருமையாக இருந்தாலும், இங்கு செய்பவர் குறிப்பிடப்படாமல் அன்று நடந்த சடங்கைச் சுட்டுகிறது; தமிழ் செயப்பாட்டு வடிவம் தேவையற்ற எழுவாயைச் சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: בַּיּוֹם הַזֶּה
  choice: இன்று
  rationale: தற்போதைய சடங்கு நாளைத் தெளிவாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: צִוָּה
  choice: கட்டளையிட்டார்
  rationale: நிறைவேற்றப்பட்ட கட்டளையைத் தமிழில் இயல்பாகத் தெரிவிக்கும் இறந்தகால வடிவம்.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தெய்வீகப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட ஒலிபெயர்ப்பு வடிவத்தில் காக்கிறது.
- source_word: לַעֲשֹׂת
  choice: இவற்றைச் செய்ய
  rationale: முன்னர் கூறப்பட்ட சடங்கு நடவடிக்கைகளையே குறிக்கும் பொருளைத் தமிழில் தெளிவாக்குகிறது; ‘இவற்றை’ என்பது சூழலிலிருந்து பெறப்படும் குறிப்பு.
- source_word: לְכַפֵּר
  choice: பாவநிவிர்த்தி செய்யும்படி
  rationale: ஆசாரியச் சடங்குச் சூழலில் כפר என்பதன் வழக்கமான பலியியல் பொருளைக் காக்கும், வாசகர்களுக்குப் புரியும் தமிழ் சொற்றொடர்.
- source_word: עֲלֵיכֶם
  choice: உங்களுக்காக
  rationale: כפר உடன் வரும் על இங்கு ‘உங்கள் சார்பாக/உங்களுக்காக’ என்ற பொருளைக் கொடுக்கிறது.
theological_decisions:
- issue: பலியியல் சூழலில் כפר என்பதன் மொழிபெயர்ப்பு
  choice: உங்களுக்காகப் பாவநிவிர்த்தி செய்யும்படி
  alternative: உங்களுக்காகப் பரிகாரம் செய்யும்படி
  rationale: ‘பாவநிவிர்த்தி’ சடங்கின் பாவத்துடன் தொடர்புடைய நோக்கத்தைக் காக்கிறது. ‘பரிகாரம்’ பொதுத் தமிழில் வேறு மதச் சடங்குகளையும் அல்லது ஒரு குறையை ஈடுசெய்வதையும் நினைவூட்டக்கூடும்; அதேவேளை மூலச்சொல் எவ்வாறு நிவிர்த்தி செய்கிறது என்பதை இங்கு மேலதிகமாக வரையறுக்காததால், குறுகிய கோட்பாட்டுச் சொல்லைச் சேர்க்கவில்லை.
- issue: יְהוָה என்ற தெய்வீகப் பெயர்
  choice: யெகோவா
  alternative: கர்த்தர்
  rationale: மூலத்தில் உள்ள தனிப்பெயரை பட்டப்பெயராக மாற்றாமல் வைத்திருக்கிறது; தமிழ் வேதாகம வாசகர்களுக்கு அறிமுகமான ஒலிபெயர்ப்பைத் தேர்ந்தெடுக்கிறது.
