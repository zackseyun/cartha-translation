base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/033.yaml
  text: And you shall not go out from the entrance of the tent of meeting for seven days[a], until the day the days of your ordination are completed, for he will ordain you for seven days.
translation:
  language: ta
  text: சந்திப்புக் கூடாரத்தின் நுழைவாயிலிலிருந்து ஏழு நாட்களுக்கு நீங்கள் வெளியே செல்லக் கூடாது; உங்கள் ஆசாரிய நியமன நாட்கள் நிறைவடையும் நாள்வரை வெளியே செல்லக் கூடாது; ஏனெனில், ஏழு நாட்களுக்கு அவர் உங்கள் கையை நிரப்புவார்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உங்கள் கையை நிரப்புவார்” என்பது சொல்லுக்குச் சொல் மொழிபெயர்ப்பு. ஒருவரை ஆசாரியப் பணியில் நியமித்து அமர்த்துவதைக் குறிக்கும் எபிரெய மரபுத்தொடர் இது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִפֶּתַח
  choice: நுழைவாயிலிலிருந்து
  rationale: פֶּתַח என்பது திறப்பு அல்லது நுழைவிடம். இங்கு கூடாரத்தின் குறிப்பிட்ட நுழைவிடத்தைக் குறிக்க இயல்பான நவீனத் தமிழ் சொல் தேர்ந்தெடுக்கப்பட்டது.
- source_word: אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரம்
  rationale: இறைவன் தம் மக்களைச் சந்திக்கும் புனிதக் கூடாரத்தைக் குறிக்கும் எபிரெயப் பெயரைத் தெளிவாகவும் சொல்லமைப்புக்கு நெருக்கமாகவும் வழங்குகிறது.
- source_word: לֹא תֵצְאוּ
  choice: நீங்கள் வெளியே செல்லக் கூடாது
  rationale: எதிர்மறை வினைமுற்றின் கட்டளைத் தன்மையை நவீனத் தமிழில் இயல்பாகவும் உறுதியாகவும் வெளிப்படுத்துகிறது.
- source_word: שִׁבְעַת יָמִים
  choice: ஏழு நாட்களுக்கு
  rationale: வெளியே செல்லக்கூடாத கால அளவைத் தமிழில் இயல்பாகக் குறிக்கிறது.
- source_word: עַד יוֹם מְלֹאת יְמֵי מִלֻּאֵיכֶם
  choice: உங்கள் ஆசாரிய நியமன நாட்கள் நிறைவடையும் நாள்வரை
  rationale: מִלֻּאִים என்ற ஆசாரியப் பணி நியமனத்துக்குரிய தொழில்நுட்பச் சொல்லையும், מלא என்ற நிறைவு கருத்தையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: ஏழு நாள் தடைக்கான காரணத்தை அறிமுகப்படுத்தும் இணைப்பாகச் செயல்படுகிறது.
- source_word: יְמַלֵּא אֶת יֶדְכֶם
  choice: அவர் உங்கள் கைகளை நிரப்புவார்
  rationale: சொல்லுக்கு சொல் பொருளான எபிரெய ஆசாரிய நியமன மரபுத்தொடரை முதன்மை உரையில் பாதுகாக்கிறது; அதன் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
theological_decisions:
- issue: מלא את־יד என்ற ஆசாரிய நியமன மரபுத்தொடரை மொழிபெயர்த்தல்
  choice: “உங்கள் கைகளை நிரப்புவார்” என்று மரபுத்தொடரை முதன்மை உரையில் பாதுகாத்தல்
  alternative: “உங்களை ஆசாரியப் பணியில் நியமிப்பார்”
  rationale: இந்தச் சொற்றொடர் ஆசாரியரைப் பணியில் அமர்த்துவதற்கான தொழில்நுட்ப எபிரெய வழக்கு. அதை நேரடியாக வைத்திருப்பது மִלֻּאִים என்ற முந்தைய சொல்லுடனான சொல் தொடர்பைப் பாதுகாக்கிறது; அடிக்குறிப்பு வாசகருக்கு அதன் வழக்குப் பொருளைத் தெளிவுபடுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய மூலத்தின் நீண்ட காலவாக்கியம் தமிழில் தெளிவுக்காக இரண்டு வாக்கியங்களாக அமைக்கப்பட்டு, வெளிப்படையாகச் சொல்லப்படாத “அங்கேயே இருங்கள்” என்பது வெளியே செல்லக்கூடாது என்ற கட்டளையின் இயல்பான எதிர்மறை விளக்கமாகச் சேர்க்கப்பட்டது. ஆசாரிய நியமன மரபுத்தொடரின் திட்டமிட்ட அந்நியத் தன்மை அடிக்குறிப்புடன் பாதுகாக்கப்பட்டது.
