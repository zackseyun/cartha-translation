id: LEV.8.26
reference: Leviticus 8:26
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וּ/מִ/סַּ֨ל הַ/מַּצּ֜וֹת אֲשֶׁ֣ר לִ/פְנֵ֣י יְהוָ֗ה לָ֠קַח חַלַּ֨ת מַצָּ֤ה אַחַת֙ וְֽ/חַלַּ֨ת לֶ֥חֶם שֶׁ֛מֶן אַחַ֖ת וְ/רָקִ֣יק אֶחָ֑ד וַ/יָּ֨שֶׂם֙ עַל הַ֣/חֲלָבִ֔ים וְ/עַ֖ל שׁ֥וֹק הַ/יָּמִֽין׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/026.yaml
  text: And from the basket of unleavened bread that was before Yahweh[a], he took one unleavened cake, one cake of bread with oil, and one wafer, and put them on the fat portions and on the right thigh.
translation:
  language: ta
  text: யாவேக்கு முன்பாக இருந்த புளிப்பில்லாத அப்பங்களின் கூடையிலிருந்து, புளிப்பில்லாத ஓர் அப்பத்தையும், எண்ணெய் சேர்த்த ஓர் அப்பத்தையும்[a], மெல்லிய ஓர் அப்பத்தையும் எடுத்து, அவற்றைக் கொழுப்புப் பகுதிகளின்மேலும் வலது தொடையின்மேலும் வைத்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எண்ணெய் கலந்து செய்யப்பட்ட ஓர் அப்பம்.” அப்பம் எண்ணெயுடன் தயாரிக்கப்பட்டதை எபிரெயச் சொற்றொடர் குறிக்கலாம்; ஆனால் அது எவ்வாறு தயாரிக்கப்பட்டது என்பதைத் தெளிவாகச் சொல்லவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִסַּל הַמַּצּוֹת
  choice: புளிப்பில்லாத அப்பங்களின் கூடையிலிருந்து
  rationale: מִן மூலத்தைக் குறிக்கிறது; סַל என்பது கூடை. மַצּוֹת இச்சடங்குச் சூழலில் புளிப்பில்லாத அப்ப வகைகளைக் குறிக்கிறது.
- source_word: לִפְנֵי יְהוָה
  choice: யாவேக்கு முன்பாக
  rationale: לִפְנֵי என்பது ஒருவரின் முன்னிலையில் வைக்கப்பட்டிருப்பதைக் குறிக்கிறது; יְהוָה என்ற உடன்படிக்கைப் பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டது.
- source_word: חַלַּת מַצָּה אַחַת
  choice: புளிப்பில்லாத ஓர் அப்பம்
  rationale: חַלָּה ஓர் அப்பம் அல்லது அப்ப வடிவிலான படையல் பொருளைக் குறிக்கிறது; மַצָּה அதன் புளிப்பில்லாத தன்மையைத் தெளிவுபடுத்துகிறது.
- source_word: חַלַּת לֶחֶם שֶׁמֶן אַחַת
  choice: எண்ணெய் சேர்த்த ஓர் அப்பம்
  rationale: இந்த எபிரெயச் சொற்றொடர் அப்பத்துக்கும் எண்ணெய்க்கும் உள்ள தொடர்பைக் காட்டுகிறது; எண்ணெய் எவ்வாறு பயன்படுத்தப்பட்டது என்பதை மிகத் துல்லியமாக வரையறுக்காமல் இயல்பான தமிழில் தருகிறது.
- source_word: רָקִיק אֶחָד
  choice: மெல்லிய ஓர் அப்பம்
  rationale: רָקִיק என்பது மெல்லிய, தட்டையான அப்ப வகையைக் குறிக்கிறது. ‘மெல்லிய அப்பம்’ நவீன தமிழில் எளிதில் புரியும்.
- source_word: הַחֲלָבִים
  choice: கொழுப்புப் பகுதிகள்
  rationale: பலவின வடிவம் பலிக்காகப் பிரித்தெடுக்கப்பட்ட குறிப்பிட்ட கொழுப்புத் துண்டுகளைக் குறிக்கிறது; பொதுவான கொழுப்பை மட்டும் குறிக்கவில்லை.
- source_word: שׁוֹק הַיָּמִין
  choice: வலது தொடை
  rationale: பலிச் சடங்கின் உடற்கூறு சூழலில் שׁוֹק என்பது கால் அல்லது தொடைப் பகுதியைக் குறிக்கிறது; ‘வலது தொடை’ இங்கு துல்லியமான இயல்பான மொழிபெயர்ப்பு.
- source_word: וַיָּשֶׂם
  choice: அவற்றை … வைத்தான்
  rationale: எபிரெய வினை ஒருமையில் இருந்தாலும், முன் குறிப்பிடப்பட்ட மூன்று அப்பப் பொருட்களையும் தமிழில் இயல்பாக ‘அவற்றை’ என்று சுட்டுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரையில் நான்கெழுத்து இறைப் பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டப்பெயராக மாற்றாமல், உடன்படிக்கைப் பெயராக ஒலிபெயர்ப்பது மூலத்தின் தனித்தன்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சடங்கின் கண்ணியத்தையும் பொருட்களின் வரிசையையும் காக்கும் நடை பயன்படுத்தப்பட்டுள்ளது. மூன்று அப்ப வகைகளுக்கிடையேயான வேறுபாடு ‘புளிப்பில்லாத’, ‘எண்ணெய் சேர்த்த’, ‘மெல்லிய’ என்ற இயல்பான அடைமொழிகளால் வெளிப்படுத்தப்பட்டுள்ளது. எண்ணெய் தொடர்பான அடிக்குறிப்பு அதற்குரிய சொற்றொடருக்குப் பின்னரே வைக்கப்பட்டுள்ளது.
