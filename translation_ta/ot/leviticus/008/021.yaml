base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/021.yaml
  text: He washed the entrails and the legs with water[a], and Moses burned the whole ram on the altar. It was a burnt offering for a pleasing aroma, a food offering to Yahweh, just as Yahweh had commanded Moses.
translation:
  language: ta
  text: அவர் உள்ளுறுப்புகளையும் கால்களையும் தண்ணீரால் கழுவினார். மோசே செம்மறியாட்டுக் கடா முழுவதையும் பலிபீடத்தின்மேல் எரித்துப் புகையெழச் செய்தார். அது யாவேக்கு இனிய நறுமணமுள்ள தகனபலி, நெருப்பினால் செலுத்தப்படும் பலி[a]. யாவே மோசேக்குக் கட்டளையிட்டபடியே மோசே செய்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேக்கான உணவுப்பலி.”
    reason: אִשֶּׁה என்பதற்கு நேரடியான “நெருப்பினால் செலுத்தப்படும் பலி” என்ற பொருளோடு, பலிபீடத்தில் இறைவனுக்குச் செலுத்தப்படும் உணவாகப் புரிந்துகொள்ளும் சூழல்சார் விளக்கமும் உள்ளது.
lexical_decisions:
- source_word: הַקֶּרֶב
  choice: குடல்கள்
  rationale: பலியிடப்படும் விலங்கின் உட்பகுதிகளை, குறிப்பாக உள்ளுறுப்புகளை, குறிக்கும் சொல்லைச் சடங்குச் சூழலில் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: הַכְּרָעַיִם
  choice: கால்கள்
  rationale: இச்சூழலில் விலங்கின் கால்களை, குறிப்பாகக் கீழ்க்கால் பகுதிகளை, குறிக்கிறது; பொதுவாசகருக்குத் தெளிவான சொல்.
- source_word: רָחַץ בַּמָּיִם
  choice: தண்ணீரால் கழுவினார்
  rationale: எபிரெய உரையில் வெளிப்படையாக உள்ள ‘தண்ணீரால்’ என்பதையும் சடங்கின் நடைமுறைத் தன்மையையும் காக்கிறது.
- source_word: וַיַּקְטֵר
  choice: எரித்துப் புகையெழச் செய்தார்
  rationale: பலிபீடத்தில் பலியை வெறுமனே எரிப்பதைவிட, அதைப் புகையாக மேலெழச் செய்யும் ஆசாரச் செயலைக் குறிப்பாக வெளிப்படுத்துகிறது.
- source_word: כָּל הָאַיִל
  choice: செம்மறியாட்டுக் கடா முழுவதையும்
  rationale: אַיִל என்பது ஆண் செம்மறியாட்டைக் குறிக்கிறது; כָּל அதன் முழுமையையும் வலியுறுத்துகிறது.
- source_word: עֹלָה
  choice: தகனபலி
  rationale: முழுவதும் பலிபீடத்தில் எரிக்கப்படும் இஸ்ரவேலரின் குறிப்பிட்ட பலிவகைக்கான நிலைபெற்ற தமிழ் சொல்.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: இனிய நறுமணமுள்ள
  rationale: பலியின் ஏற்றுக்கொள்ளத்தக்க தன்மையை உணர்வுப்படிமத்துடன் தெரிவிக்கும் எபிரெய வழக்கை இயல்பான தமிழில் காக்கிறது.
- source_word: אִשֶּׁה
  choice: நெருப்பினால் செலுத்தப்படும் பலி
  rationale: சொல்லின் நெருப்பு சார்ந்த பலியிடும் பொருளை நேரடியாகக் காக்கிறது; ‘உணவுப்பலி’ என்று பொருளைத் தீர்மானிப்பதைத் தவிர்க்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: எபிரெய மெய்யெழுத்துப் பெயரான יהוה-ஐ ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட தனிப்பெயர் வடிவில் வழங்குகிறது.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: யெகோவா மோசேக்குக் கட்டளையிட்டபடியே
  rationale: தெய்வீகக் கட்டளைக்கும் செய்யப்பட்ட செயலுக்கும் உள்ள துல்லியமான ஒத்திசைவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: யாவே
  rationale: தலைப்புச் சொல்லால் மாற்றாமல் தனிப்பெயராகவே வைக்கப்பட்டது. உயிரெழுத்தாக்கம் உறுதியற்றிருப்பதால் ‘யாவே’ என்பதும் சாத்தியம்; தமிழ் வாசகர்களிடையே பரவலாக அறியப்பட்ட ‘யெகோவா’ தேர்ந்தெடுக்கப்பட்டது.
- issue: אִשֶּׁה என்பதன் பலியியல் பொருள்
  choice: நெருப்பினால் செலுத்தப்படும் பலி
  alternative: உணவுப்பலி
  rationale: இச்சொல் நெருப்போடு தொடர்புடைய பலியைக் குறிக்கிறது. ‘உணவுப்பலி’ என்பது பலிபீட உணவு என்ற கருத்தை முன்னிறுத்தும் சாத்தியமான சூழல்சார் விளக்கம்; முதன்மை உரை அதிகம் நேரடியான பொருளை வைத்திருக்கிறது.
- issue: לְרֵיחַ נִיחֹחַ என்ற வழக்குச் சொற்றொடர்
  choice: இனிய நறுமணமுள்ள
  alternative: மனநிறைவளிக்கும் நறுமணமுள்ள
  rationale: இறைவன் பலியை ஏற்றுக்கொள்வதைக் குறிக்கும் உணர்வுப்படிமத்தை அழிக்காமலும், அதை வெறும் கோட்பாட்டு விளக்கமாக மாற்றாமலும் வைத்திருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மதிப்பும் வாசிப்புத் தெளிவும் கொண்ட நடை. பலியியல் சொற்களில் ‘தகனபலி’, ‘பலிபீடம்’ போன்ற நிலைபெற்ற சொற்கள் பயன்படுத்தப்பட்டுள்ளன. முதல் வாக்கியத்தின் கர்த்தா எபிரெயில் மறைமுகமாக இருப்பதால் தமிழிலும் ‘அவர்’ எனப் பாலின ஒருமை மட்டும் காக்கப்பட்டது; அடுத்த வாக்கியத்தில் ‘மோசே’ வெளிப்படையாகத் தரப்பட்டுள்ளது.
