revisions:
- from: அவர் குடல்களையும் கால்களையும் தண்ணீரால் கழுவினார். மோசே செம்மறியாட்டுக் கடா முழுவதையும் பலிபீடத்தின்மேல் எரித்துப் புகையெழச் செய்தார். அது யெகோவாவுக்கு இனிய நறுமணமுள்ள தகனபலி, நெருப்பினால் செலுத்தப்படும் பலி[a]; யெகோவா மோசேக்குக் கட்டளையிட்டபடியே அது செய்யப்பட்டது.
