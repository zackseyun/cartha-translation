base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/029.yaml
  text: Then Moses took the breast and waved it as a wave offering before Yahweh. It was Moses' portion from the ram of ordination[a], just as Yahweh had commanded Moses.
translation:
  language: ta
  text: பின்பு மோசே மார்புப் பகுதியை எடுத்து, யாவேவின் முன்னிலையில் அதை அசைவுக் காணிக்கையாக அசைத்தார். ஆசாரிய நியமனத்திற்கான ஆட்டுக்கடாவிலிருந்து கிடைத்த அது மோசேக்குரிய பங்காக இருந்தது[a]. யாவே மோசேக்குக் கட்டளையிட்டபடியே மோசே இதைச் செய்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆசாரிய அர்ப்பணிப்பிற்கான ஆட்டுக்கடாவிலிருந்து.”
    reason: מִלֻּאִים என்பது ஆசாரியப் பணியில் நியமித்தல் அல்லது அதற்காக அர்ப்பணித்தல் ஆகிய நெருங்கிய கருத்துகளைத் தரலாம்.
lexical_decisions:
- source_word: וַיִּקַּח
  choice: பின்பு மோசே ... எடுத்து
  rationale: வழக்கமான எபிரெயக் கதைத் தொடரை இயல்பான தமிழில் முன்னெடுத்து, ‘எடுத்தார்’ என்ற அடிப்படைப் பொருளையும் காக்கிறது.
- source_word: הֶחָזֶה
  choice: மார்புப் பகுதி
  rationale: பலிச் சடங்கில் விலங்கின் குறிப்பிட்ட மார்புப் பங்கைக் குறிக்கிறது; நவீன வாசகருக்குத் தெளிவாக இருக்க ‘பகுதி’ சேர்க்கப்பட்டுள்ளது.
- source_word: וַיְנִיפֵהוּ תְנוּפָה
  choice: அதை அசைவாட்டுக் காணிக்கையாக அசைத்துக் காட்டினார்
  rationale: வினைச்சொல் மற்றும் அதனோடு தொடர்புடைய தொழில்நுட்பப் பெயர்ச்சொல் இரண்டையும் வெளிப்படுத்தி, சடங்கின் அசைவு/சமர்ப்பிப்பு தன்மையைப் பாதுகாக்கிறது.
- source_word: לִפְנֵי יְהוָה
  choice: யாவே முன்னிலையில்
  rationale: காணிக்கை யாவேவின் சந்நிதியில் சமர்ப்பிக்கப்படுவதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் உள்ள இறைப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்க்கிறது.
- source_word: מֵאֵיל הַמִּלֻּאִים
  choice: குருத்துவ நியமனத்திற்கான ஆட்டுக்கடாவிலிருந்து
  rationale: מִלֻּאִים என்பது இச்சூழலில் ஆரோனையும் அவரது மகன்களையும் குருத்துவப் பணியில் நிறுவும் சடங்கைக் குறிக்கிறது; ‘குருத்துவ நியமனம்’ சூழலைத் தெளிவாக்குகிறது, மாற்றுச் சாத்தியம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: לְמֹשֶׁה הָיָה לְמָנָה
  choice: அது மோசேக்குரிய பங்காக இருந்தது
  rationale: מָנָה என்பதன் ஒதுக்கப்பட்ட பங்கு என்ற பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: யாவே மோசேக்குக் கட்டளையிட்டபடியே இது நடந்தது
  rationale: முன்னர் கொடுக்கப்பட்ட கட்டளைக்கேற்ப மோசே செயல்பட்டார் என்ற நிறைவேற்றக் கூற்றைத் தமிழில் தெளிவுபடுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல வசனம் தனிப்பட்ட இறைப் பெயரை நேரடியாகப் பயன்படுத்துவதால், பட்டப்பெயரைப் பதிலிடாமல் அதன் பரவலான தமிழ் ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
- issue: מִלֻּאִים என்ற குருத்துவச் சடங்குச் சொல்
  choice: குருத்துவ நியமனம்
  alternative: குருத்துவ அர்ப்பணிப்பு
  rationale: லேவியராகமம் 8-இன் சூழலில் இது ஆசாரியர்களைப் பணியில் நிறுவுவதைக் குறிக்கிறது. ‘அர்ப்பணிப்பு’ என்பதும் பொருத்தமான சாத்தியம் என்பதால் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. பலிச் சடங்கின் தொழில்நுட்பத் தன்மையைப் பாதுகாக்க ‘அசைவாட்டுக் காணிக்கை’ பயன்படுத்தப்பட்டு, அதன் செயல் ‘அசைத்துக் காட்டினார்’ என இயல்பாக்கப்பட்டுள்ளது.
