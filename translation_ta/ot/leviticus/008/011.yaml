base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/011.yaml
  text: He sprinkled some of it on the altar seven times[a], and he anointed the altar and all its utensils, and the basin and its stand[b], to consecrate them.
translation:
  language: ta
  text: அவர் அதிலிருந்து பலிபீடத்தின்மேல் ஏழு முறை தெளித்தார்[a]. பலிபீடத்தையும் அதன் எல்லாக் கருவிகளையும், கழுவும் தொட்டியையும் அதன் தாங்கியையும் பரிசுத்தப்படுத்துவதற்காக அவற்றின் மேல் எண்ணெய் பூசினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்சொல்லாக, “அதிலிருந்து.” சூழலில் இது அபிஷேக எண்ணெயைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּז מִמֶּנּוּ
  choice: அதிலிருந்து ... தெளித்தார்
  rationale: נזה என்பதன் ஹிஃபில் வடிவம் சடங்குச் சூழலில் திரவத்தைத் தெளிப்பதைக் குறிக்கிறது. מן உடன் வரும் பதிலிப்பெயர் பின்னொட்டு சொற்சொல்லாக ‘அதிலிருந்து’ என்பதால், சூழலில் முன்பு குறிப்பிடப்பட்ட அபிஷேக எண்ணெயைச் சுட்டும் இயல்பான தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: הַמִּזְבֵּחַ
  choice: பலிபீடம்
  rationale: பலிச் சடங்குச் சூழலில் מִזְבֵּחַ என்பதற்கான நிலையான, எளிதில் புரியும் தமிழ் சொல்.
- source_word: שֶׁבַע פְּעָמִים
  choice: ஏழு முறை
  rationale: மீண்டும் செய்யப்பட்ட சடங்குச் செயலைக் குறிக்கும் நேரடியான எண்ணிக்கை சார்ந்த வினையடைத் தொடர்.
- source_word: וַיִּמְשַׁח
  choice: எண்ணெய் பூசினார்
  rationale: משׁח இங்கு அர்ப்பணிப்புச் சடங்கில் எண்ணெயைப் பூசுவதைக் குறிக்கிறது. ‘அபிஷேகம் செய்தார்’ என்பதைக் காட்டிலும் இந்தத் தேர்வு சாதாரண வாசகருக்கு செயலைத் தெளிவாகக் காட்டுகிறது; பின்னைய சமயப் பொருளைத் தேவையின்றி இறக்குமதி செய்யாது.
- source_word: כָּל כֵּלָיו
  choice: அதன் எல்லாக் கருவிகளையும்
  rationale: כְּלִי என்பது பாத்திரங்கள், உபகரணங்கள் உள்ளிட்ட விரிந்த பொருளுடைய சொல்; ‘கருவிகள்’ இங்கு இயல்பாகவும் பொதுவாகவும் உள்ளது.
- source_word: הַכִּיֹּר
  choice: கழுவும் தொட்டி
  rationale: כִּיּוֹר கூடார முற்றத்திலிருந்த கழுவுவதற்கான பெரிய பாத்திரத்தைக் குறிக்கிறது. ‘தொட்டி’ மட்டும் என்பதைக் காட்டிலும் இதன் பயன்பாட்டைத் தெளிவுபடுத்துகிறது; பழமையான தொழில்நுட்பச் சொல்லைத் தவிர்க்கிறது.
- source_word: כַּנּוֹ
  choice: அதன் தாங்கி
  rationale: כֵּן இங்கு தொட்டியைத் தாங்கும் அமைப்பைக் குறிக்கிறது. ‘தாங்கி’ என்பது ‘அடித்தளம்’ என்ற சாத்தியமான பொருளையும் முற்றிலும் மறுக்காமல் அதன் செயல்பாட்டை இயல்பாகத் தெரிவிக்கிறது.
- source_word: לְקַדְּשָׁם
  choice: அர்ப்பணித்துப் புனிதப்படுத்துவதற்காக
  rationale: קדשׁ என்பதன் பியேல் வினையெச்சம் இப்பொருட்களைப் புனிதப் பயன்பாட்டுக்காக வேறுபடுத்துவதைச் சுட்டுகிறது. ‘அர்ப்பணித்துப் புனிதப்படுத்துதல்’ சடங்கு சார்ந்த நோக்கத்தையும் பரிசுத்த நிலைக்கு ஒதுக்கப்படுவதையும் இணைத்துத் தருகிறது.
theological_decisions:
- issue: புனிதப் பொருட்கள் மற்றும் செயல்களுக்கான சடங்குச் சொற்கள்
  choice: ‘எண்ணெய் பூசினார்’, ‘அர்ப்பணித்துப் புனிதப்படுத்த’ என்ற வாசிக்க எளிய சடங்குச் சொற்களைப் பயன்படுத்துதல்
  alternative: ‘அபிஷேகம் செய்தார்’, ‘பரிசுத்தப்படுத்த’ போன்ற மரபுவழிச் சொற்களைப் பயன்படுத்துதல்
  rationale: வசனம் கூடார வழிபாட்டுப் பொருட்களின் அர்ப்பணிப்புச் சடங்கை விவரிக்கிறது. தேர்ந்த சொற்கள் புனிதப் பயன்பாட்டுக்காக ஒதுக்கும் பொருளைப் பாதுகாத்தபடியே, பின்னைய பிரிவுசார் அல்லது கோட்பாட்டுச் சிறப்புப் பொருளைச் சேர்க்காமல் நவீன வாசகருக்குப் புரியும்படி செய்கின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்கு எளிதில் புரியும் அதேவேளையில் திருக்கூடாரச் சடங்கின் கண்ணியமான நடையைப் பேணும் மொழி பயன்படுத்தப்பட்டுள்ளது. ‘கழுவும் தொட்டி’ மற்றும் ‘தாங்கி’ என்பவை பழமையான தொழில்நுட்பச் சொற்களைத் தவிர்க்கின்றன.
