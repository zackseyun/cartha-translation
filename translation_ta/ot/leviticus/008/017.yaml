  text: But the bull[a], along with its hide, its flesh, and its dung, he burned with fire outside the camp[b], just as Yahweh had commanded Moses.
translation:
  language: ta
  text: ஆனால், அந்தக் காளையையும் அதன் தோலையும் அதன் இறைச்சியையும் அதன் சாணத்தையும் அவன் முகாமுக்கு வெளியே நெருப்பில் எரித்தான். யாவே மோசேக்குக் கட்டளையிட்டபடியே அவன் அவற்றை எரித்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַפָּר
  choice: அந்தக் காளை
  rationale: פַּר என்பது காளை அல்லது இளம் காளையைக் குறிக்கலாம். இவ்வசனத்தில் வயதைத் தேவையின்றிக் குறிப்பாக்காமல், இயல்பான பொதுப்பொருளாக ‘காளை’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: עֹרוֹ
  choice: அதன் தோல்
  rationale: עוֹר என்பதன் நேரடியான பொருள் தோல். தமிழில் ‘தோல்’ என்பது விலங்கின் skin/hide இரண்டையும் இயல்பாகக் குறிக்கிறது.
- source_word: בְּשָׂרוֹ
  choice: அதன் இறைச்சி
  rationale: בָּשָׂר இங்கு விலங்கின் சதையைச் சுட்டுகிறது. பலியிடப்பட்ட விலங்கின் உடற்பகுதியைக் குறிக்க நவீன தமிழில் ‘இறைச்சி’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: פִּרְשׁוֹ
  choice: அதன் சாணம்
  rationale: פֶּרֶשׁ பொதுவான கழிவை அல்ல, குறிப்பாக விலங்கின் மலத்தைக் குறிக்கிறது. ‘சாணம்’ அந்தக் கருத்தைத் துல்லியமாகத் தருகிறது.
- source_word: שָׂרַף בָּאֵשׁ
  choice: நெருப்பில் எரித்தான்
  rationale: எபிரெயச் சொற்றொடரின் பொருளை இயல்பான தமிழில் நேரடியாகத் தருகிறது; ‘தீயால் எரித்தான்’ என்பதைக் காட்டிலும் இச்சூழலில் ‘நெருப்பில்’ வழக்கமானது.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: முகாமுக்கு வெளியே
  rationale: இஸ்ரவேலரின் பாளயத்துக்கு வெளியேயுள்ள இடத்தைத் தெளிவாகவும் நவீன தமிழிலும் குறிக்கிறது.
- source_word: כַּאֲשֶׁר צִוָּה
  choice: கட்டளையிட்டபடியே
  rationale: செயல் கட்டளைக்கு முற்றிலும் ஏற்ப நடந்தது என்ற ஒப்புமை மற்றும் இணக்கத்தைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் அறியப்பட்ட ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: וְאֶת ... וְאֶת ... וְאֶת ... וְאֶת
  choice: காளையையும் அதன் தோலையும் இறைச்சியையும் சாணத்தையும்
  rationale: திரும்பத் திரும்ப வரும் இணைப்புகளின் சேர்த்துக் கூறும் வலிமையைத் தமிழ் ‘-யும்’ பட்டியல் அமைப்பு இயல்பாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைபெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரை ஒரு பொதுப் பட்டத்தை அல்ல, இறைவனின் தனிப்பட்ட பெயரையே பயன்படுத்துகிறது. ஆகவே அந்த வேறுபாட்டைப் பாதுகாக்க ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் வகையிலும் பலிச்சடங்கு சார்ந்த உரையின் கண்ணியத்தைப் பேணும் வகையிலும் மொழிநடை அமைக்கப்பட்டுள்ளது. எபிரெயப் பட்டியலின் தொடர்ச்சி ‘-யும்’ விகுதிகளால் காக்கப்பட்டுள்ளது. முதல் வாக்கியத்தின் மறைந்த எழுவாய் ‘அவன்’ என வெளிப்படுத்தப்பட்டு, அடுத்த வாக்கியத்தில் கட்டளைக்குக் கீழ்ப்படிந்த செயல் இயல்பாகத் தெளிவாக்கப்பட்டுள்ளது.
