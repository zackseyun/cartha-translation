  text: וַ/יִּקַּ֨ח מֹשֶׁ֜ה מִ/שֶּׁ֣מֶן הַ/מִּשְׁחָ֗ה וּ/מִן הַ/דָּם֮ אֲשֶׁ֣ר עַל הַ/מִּזְבֵּחַ֒ וַ/יַּ֤ז עַֽל אַהֲרֹן֙ עַל בְּגָדָ֔י/ו וְ/עַל בָּנָ֛י/ו וְ/עַל בִּגְדֵ֥י בָנָ֖י/ו אִתּ֑/וֹ וַ/יְקַדֵּ֤שׁ אֶֽת אַהֲרֹן֙ אֶת בְּגָדָ֔י/ו וְ/אֶת בָּנָ֛י/ו וְ/אֶת בִּגְדֵ֥י בָנָ֖י/ו אִתּֽ/וֹ־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/030.yaml
  text: Then Moses took some of the anointing oil and some of the blood that was on the altar[a], and sprinkled it on Aaron, on his garments, on his sons, and on the garments of his sons with him; so he consecrated Aaron, his garments, his sons, and the garments of his sons with him.
translation:
  language: ta
  text: பின்பு மோசே அபிஷேக எண்ணெயில் சிறிதளவையும், பலிபீடத்தின் மேல் இருந்த இரத்தத்தில் சிறிதளவையும் எடுத்து, ஆரோன் மீதும், அவனுடைய ஆடைகள் மீதும், அவனுடைய மகன்கள் மீதும், அவனுடன் சேர்த்து அவனுடைய மகன்களின் ஆடைகள் மீதும் தெளித்தார். இவ்வாறு அவர் ஆரோனையும், அவனுடைய ஆடைகளையும், அவனுடைய மகன்களையும், அவனுடன் சேர்த்து அவனுடைய மகன்களின் ஆடைகளையும் புனிதப்படுத்தினார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பரிசுத்தப்படுத்தினார்.’
    reason: וַיְקַדֵּשׁ என்பது அடிப்படையில் புனிதமாக்குதல்/பரிசுத்தப்படுத்துதலைக் குறிக்கிறது; இச்சடங்குசார் சூழலில் ‘புனிதப்படுத்தினார்’ என்பது அர்ப்பணித்து புனிதப் பயன்பாட்டிற்காக ஒதுக்குதல் என்ற பொருளையும் கொண்டுள்ளது.
lexical_decisions:
- source_word: וַיִּקַּח ... מִשֶּׁמֶן ... וּמִן הַדָּם
  choice: அபிஷேக எண்ணெயில் கொஞ்சத்தையும் ... இரத்தத்தில் கொஞ்சத்தையும் எடுத்து
  rationale: לקח என்பது ‘எடுத்தார்’ என்றும், இருமுறை வரும் מִן முழுவதையும் அல்லாமல் அவற்றிலிருந்து ஒரு பகுதியை எடுத்ததைக் குறிக்கிறது; இயல்பான தமிழில் ‘கொஞ்சத்தையும்’ என்று வெளிப்படுத்தப்பட்டது.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: அபிஷேக எண்ணெய்
  rationale: ஆசாரச் சூழலில் பயன்படுத்தப்படும் பூசுதல்/அபிஷேகம் செய்வதற்கான எண்ணெயைத் தெளிவாகவும் மரபான தமிழிலும் குறிக்கிறது.
- source_word: הַדָּם אֲשֶׁר עַל הַמִּזְבֵּחַ
  choice: பலிபீடத்தின்மேல் இருந்த இரத்தம்
  rationale: אֲשֶׁר சார்பு வாக்கியத்தையும் עַל இடப்பொருளையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: וַיַּז
  choice: தெளித்தார்
  rationale: நזה என்பதன் ஹிபீல் வடிவம் ஆசாரச் சூழலில் திரவத்தைத் தெளிப்பதைக் குறிக்கிறது; தமிழில் ‘தெளித்தார்’ இயல்பான சடங்குசார் சொல்.
- source_word: בְּגָדָיו
  choice: அவனுடைய ஆடைகள்
  rationale: בֶּגֶד என்பதன் பொதுவான பொருளான ‘ஆடை’ பாதுகாக்கப்படுகிறது; குறிப்பாக ஆசாரிய உடைகள் என்று மூலத்தில் இல்லாத விளக்கம் சேர்க்கப்படவில்லை.
- source_word: בָּנָיו
  choice: அவனுடைய மகன்கள்
  rationale: எபிரெயச் சொல் ஆண்பால் பன்மை; இங்கு ஆரோனின் ஆசாரியப் பணியில் சேர்க்கப்படும் மகன்களையே குறிக்கிறது.
- source_word: בִּגְדֵי בָנָיו אִתּוֹ
  choice: அவனோடு இருந்த அவனுடைய மகன்களின் ஆடைகள்
  rationale: ‘அவனோடு’ என்பது பொருளடிப்படையில் மகன்களைக் குறிப்பதாக இயல்பான தமிழில் வெளிப்படுத்தப்பட்டது; ஆடைகளும் பட்டியலில் தனிப் பொருளாகப் பாதுகாக்கப்பட்டுள்ளன.
- source_word: וַיְקַדֵּשׁ
  choice: புனிதப்படுத்தினார்
  rationale: קדשׁ என்பதன் அடிப்படைப் புனிதமாக்குதல்/புனிதப் பயன்பாட்டிற்காக ஒதுக்குதல் என்ற பொருளைச் சுருக்கமாகக் காக்கிறது; ஆசாரிய நியமனச் சூழலும் தொடர்ந்து தெளிவாக உள்ளது.
theological_decisions:
- issue: ஆசாரிய நியமனச் சூழலில் קדשׁ என்பதன் மொழிபெயர்ப்பு
  choice: புனிதப்படுத்தினார்
  alternative: திருப்பணிக்காகத் தனியே ஒதுக்கினார்
  rationale: முதன்மை மொழிபெயர்ப்பு புனிதத் தன்மையை நேரடியாகப் பாதுகாக்கிறது. மாற்று மொழியாக்கம் இச்சூழலில் உள்ள அர்ப்பணிப்பு/ஒதுக்குதல் நுண்பொருளை விளக்குகிறது; பின்னாளைய குறிப்பிட்ட சமயக் கோட்பாட்டைச் சேர்க்கவில்லை.
- issue: ஆரோனின் சந்ததியரைக் குறிக்கும் பாலினச் சொல்
  choice: அவனுடைய மகன்கள்
  alternative: அவனுடைய பிள்ளைகள்
  rationale: בָּנָיו ஆண்பால் பன்மை என்பதாலும் இங்கு பங்கேற்பவர்கள் ஆரோனின் மகன்கள் என்பதாலும் பாலினத் துல்லியம் பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய மூலத்தின் மீளுரைப்பும் பட்டியல் அமைப்பும் பெரும்பாலும் காக்கப்பட்டுள்ளன; மரியாதை வினைமுற்று மோசேயைக் குறிக்கப் பயன்படுத்தப்பட்டுள்ளது.
