base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/023.yaml
  text: And he slaughtered it[a], and Moses took some of its blood and put it on the lobe of Aaron’s right ear, and on the thumb of his right hand, and on the big toe of his right foot.
translation:
  language: ta
  text: அதை அவன் பலியிட்டான். மோசே அதன் இரத்தத்தில் சிறிது எடுத்து, ஆரோனுடைய வலது காது மடலில்[a], அவருடைய வலது கையின் கட்டைவிரலில், அவருடைய வலது காலின் பெருவிரலில் வைத்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வலது காதின் நுனியில்.’
    reason: תְּנוּךְ אֹזֶן என்பது காது மடல் அல்லது காதின் வெளிப்புற நுனியைக் குறிக்கக்கூடும் என்பதால் சொல்லியல் மாற்று தரப்படுகிறது.
lexical_decisions:
- source_word: וַיִּשְׁחָט
  choice: அதை அவன் பலியிட்டான்
  rationale: பலிச் சடங்கின் சூழலில் இவ்வினைச்சொல் சடங்குமுறைப்படி விலங்கைக் கொல்வதைக் குறிக்கிறது. ‘கொன்றான்’ என்பதைவிட ‘பலியிட்டான்’ இயல்பாகவும் சூழலுக்குத் துல்லியமாகவும் உள்ளது; ‘அதை’ என்பது முந்தைய சூழலிலிருந்து நிரப்பப்படுகிறது.
- source_word: מִדָּמוֹ
  choice: அதன் இரத்தத்தில் சிறிதை
  rationale: מִן இங்கு மொத்த இரத்தத்திலிருந்து ஒரு பகுதியை எடுத்ததைக் காட்டுகிறது; தமிழ் வழக்கில் ‘இரத்தத்தில் சிறிதை’ என்பது இதைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: תְּנוּךְ אֹזֶן
  choice: காதின் மடல்
  rationale: இச்சொற்றொடர் காதின் வெளிப்புற நுனி அல்லது மடலைக் குறிக்கிறது. ‘காது மடல்’ நவீனத் தமிழில் தெளிவான உடற்கூற்றுச் சொல்; ‘காதின் நுனி’ என்பது பொருத்தமான மாற்று.
- source_word: הַיְמָנִית
  choice: வலது
  rationale: காது, கை, கால் ஆகியவை உடலின் வலப்பக்கத்தைச் சேர்ந்தவை என்பதைத் தமிழ் இயல்புப்படி ‘வலது’ எனக் குறிப்பிடுகிறது.
- source_word: בֹּהֶן יָדוֹ
  choice: அவருடைய வலது கையின் கட்டைவிரல்
  rationale: கையைக் குறிக்கும் போது בֹּהֶן என்பது கட்டைவிரலைத் துல்லியமாகக் குறிக்கிறது.
- source_word: בֹּהֶן רַגְלוֹ
  choice: வலது காலின் பெருவிரல்
  rationale: காலைக் குறிக்கும் போது בֹּהֶן என்பது குறிப்பாகப் பெருவிரலைக் குறிக்கிறது.
- source_word: וַיִּתֵּן עַל
  choice: பூசினார்
  rationale: இரத்தத்தை உடல் உறுப்புகள்மேல் வைக்கும் சடங்குச் செயலை நவீனத் தமிழில் ‘பூசினார்’ இயல்பாக வெளிப்படுத்துகிறது; இது குறியீட்டு விளக்கத்தைச் சேர்க்காமல் செயலை மட்டும் விவரிக்கிறது.
theological_decisions:
- issue: பலியின் இரத்தத்தை ஆரோனுடைய உடல் உறுப்புகளில் பூசுதல்
  choice: சடங்குச் செயலை விளக்கவுரை சேர்க்காமல் நேரடியாக விவரித்தல்
  alternative: அர்ப்பணிப்பு அல்லது ஆசாரியத் திருநிலைப்படுத்தலின் குறியீட்டை முதன்மை உரையிலேயே விளக்குதல்
  rationale: எபிரெய உரை நிகழ்ந்த செயலை மட்டுமே விவரிக்கிறது. அதன் இறையியல் முக்கியத்துவத்தை மொழிபெயர்ப்புக்குள் சேர்ப்பது மூலத்தில் இல்லாத விளக்கத்தை இறக்குமதி செய்யும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. தொடக்கத்தில் முந்தைய வசனத்தின் பொருளைத் தொடர ‘அதை’ சேர்க்கப்பட்டுள்ளது. மோசேக்கு மரியாதைப் பன்மை வினைமுற்றும், பெயரிடப்படாத பலியிடுபவருக்கு ஒருமை வினைமுற்றும் பயன்படுத்தப்பட்டுள்ளன.
