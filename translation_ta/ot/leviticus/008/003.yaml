translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் கட்டளையின் சுருக்கமும் காக்கப்பட்டுள்ளன. ‘சபையார்’ என்பது மக்களைக் குறிக்கும் கூட்டுப்பெயராகவும், ‘சந்திப்புக் கூடாரம்’ என்பது அடுத்தடுத்த வசனங்களில் ஒரேபடியாகப் பயன்படுத்தத்தக்க பெயராகவும் தேர்ந்தெடுக்கப்பட்டது.
