source:
  edition: WLC
  text: וְ/אֵ֥ת כָּל הָ/עֵדָ֖ה הַקְהֵ֑ל אֶל פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/003.yaml
  text: And assemble all the congregation at the entrance of the tent of meeting[a].
translation:
  language: ta
  text: சபை முழுவதையும் சந்திப்புக் கூடாரத்தின் நுழைவாயிலில் ஒன்றுகூட்டு.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சபையினர் அனைவரையும் ஒன்றுகூட்டு.’ எபிரெயச் சொல் עֵדָה சூழலுக்கேற்ப ‘சபை,’ ‘கூட்டம்,’ அல்லது ‘சமூகம்’ என மொழிபெயர்க்கப்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֵת
  choice: '[தனி இணைப்புச்சொல் இன்றி]'
  rationale: וְ அடுத்த கட்டளையை முந்தையதுடன் இணைக்கிறது; אֵת நேர்செயப்படுபொருள் குறியீடு. தனி வசனமாக இயல்பான தமிழில் இவை வெளிப்படையாக மொழிபெயர்க்கப்பட வேண்டியதில்லை.
- source_word: כָּל הָעֵדָה
  choice: சபையார் அனைவரையும்
  rationale: כָּל முழுமையை வலியுறுத்துகிறது; עֵדָה இங்கு இஸ்ரவேலின் ஒன்றுகூடிய உடன்படிக்கைச் சமூகத்தைக் குறிக்கிறது. ‘சபையார் அனைவரையும்’ என்பது கூட்டுத்தன்மையையும் முழுமையையும் இயல்பான தமிழில் தருகிறது.
- source_word: הַקְהֵל
  choice: ஒன்றுகூட்டு
  rationale: קהל என்பதன் ஹிஃபில் கட்டளை வடிவம், பிறரை ஒன்றாகக் கூடச் செய்வதைக் குறிக்கிறது. ஒருமை கட்டளை வடிவம் மோசேயிடம் கூறப்படுவதைத் தக்கவைக்கிறது.
- source_word: אֶל פֶּתַח
  choice: நுழைவிடத்தில்
  rationale: אֶל பொதுவாக ‘நோக்கி/இடத்திற்கு’ எனினும், פֶּתַח உடன் இங்கு கூட வேண்டிய இடத்தைச் சுட்டுகிறது; ‘நுழைவிடத்தில்’ நவீன தமிழில் இயல்பான இடவியல் பொருளைத் தருகிறது.
- source_word: אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரம்
  rationale: இந்த நிலையான எபிரெயப் பெயர் தேவன் நியமித்த சந்திப்பு நடைபெறும் கூடாரத்தைக் குறிக்கிறது. ‘சந்திப்புக் கூடாரம்’ அதன் செயல்பாட்டையும் கூடார வடிவத்தையும் தெளிவாகப் பாதுகாக்கிறது.
