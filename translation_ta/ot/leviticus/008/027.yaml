  text: וַ/יִּתֵּ֣ן אֶת הַ/כֹּ֔ל עַ֚ל כַּפֵּ֣י אַהֲרֹ֔ן וְ/עַ֖ל כַּפֵּ֣י בָנָ֑י/ו וַ/יָּ֧נֶף אֹתָ֛/ם תְּנוּפָ֖ה לִ/פְנֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/027.yaml
  text: He put all of it into the palms of Aaron and into the palms of his sons[a], and he waved them as a wave offering before Yahweh.
translation:
  language: ta
  text: அவர் அவை அனைத்தையும் ஆரோனின் உள்ளங்கைகளிலும் அவருடைய மகன்களின் உள்ளங்கைகளிலும் வைத்தார்[a]. பின்பு அவற்றை யாவேக்கு முன்பாக அசைவாட்டுக் காணிக்கையாக அசைவாட்டினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆரோனின் உள்ளங்கைகளின்மேலும் அவருடைய மகன்களின் உள்ளங்கைகளின்மேலும் வைத்தார்.” எபிரெய முன்னிடைச்சொல்லின் நேரடிப் பொருள் “மேல்” என்பதாகும்; இங்கு காணிக்கைப் பகுதிகள் குவித்த உள்ளங்கைகளில் வைக்கப்படுவது கருத்தாகும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: வைத்தார்
  rationale: נתן என்பதற்கு ‘கொடுத்தார்’ என்றும் பொருள் இருக்கலாம்; இங்கு காணிக்கையின் பகுதிகளைக் கைகளில் வைக்கும் சடங்குச் செயலைக் குறிப்பதால் ‘வைத்தார்’ என்பது பொருத்தமானது.
- source_word: אֶת הַכֹּל
  choice: அவை அனைத்தையும்
  rationale: முந்தைய வசனத்தில் திரட்டப்பட்ட காணிக்கைப் பகுதிகள் அனைத்தையும் இது சுட்டுகிறது; பன்மைப் பொருட்களைக் குறிக்கும் வகையில் இயல்பான தமிழில் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: עַל כַּפֵּי
  choice: உள்ளங்கைகளிலும்
  rationale: כַּף இங்கு உள்ளங்கையைக் குறிக்கிறது. עַל என்பதன் அடிப்படைப் பொருள் ‘மேல்’ என்றாலும், பொருட்களை ஏந்திய உள்ளங்கைகளில் வைப்பதைத் தமிழில் இயல்பாக வெளிப்படுத்த ‘உள்ளங்கைகளில்’ எனத் தரப்பட்டுள்ளது; சொல்லுக்குச் சொல் மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: אַהֲרֹן
  choice: ஆரோன்
  rationale: இப்பெயருக்கான வழக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: וְעַל כַּפֵּי בָנָיו
  choice: அவன் மகன்களின் உள்ளங்கைகளிலும்
  rationale: எபிரெய உரையின் மீளுருவாக்கத்தையும், ஆண் சந்ததியினரைக் குறிப்பாகச் சுட்டும் בָּנִים என்ற சொல்லின் பாலினத் துல்லியத்தையும் காக்கிறது.
- source_word: וַיָּנֶף
  choice: அசைவாட்டினார்
  rationale: பலிச் சடங்குச் சூழலில் נוף என்பதன் Hiphil வடிவம் காணிக்கையை அசைத்து முன்வைக்கும் சடங்குச் செயலைக் குறிக்கிறது.
- source_word: אֹתָם
  choice: அவற்றை
  rationale: இந்தப் பிரதிப்பெயர் ஆரோனையும் அவன் மகன்களையும் அல்ல, அவர்களுடைய உள்ளங்கைகளில் வைக்கப்பட்ட பொருட்களையே சுட்டுகிறது.
- source_word: תְּנוּפָה
  choice: அசைவாட்டும் காணிக்கையாக
  rationale: அசைத்து முன்வைக்கப்படும் பலிச் சடங்கைக் குறிக்கும் தொழில்நுட்பச் சொல்; அதனுடன் தொடர்புடைய வினைச்சொல்லையும் தமிழில் பிரதிபலிக்கிறது.
- source_word: לִפְנֵי יְהוָה
  choice: யாவேக்கு முன்பாக
  rationale: சடங்கு யாவேயின் முன்னிலையில் செய்யப்படுவதைத் தெரிவிக்கும் உடன்படிக்கைச் சொற்றொடரை இயல்பாகவும் நேரடியாகவும் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: யெகோவா; கர்த்தர்
  rationale: எபிரெய மெய்யெழுத்துப் பெயரான YHWH-ஐ ஒரு பொதுப்பட்டமாக மாற்றாமல், திட்டத்தின் நடைமுறைக்கேற்ப தனிப்பெயராகத் தெளிவாக ஒலிபெயர்க்கிறது.
- issue: בָנָיו என்ற பாலினம் குறிக்கப்பட்ட உறவுச்சொல்
  choice: அவன் மகன்கள்
  alternative: அவன் பிள்ளைகள்
  rationale: ஆசாரிய நியமனச் சடங்கில் ஆரோனின் ஆண் சந்ததியினரை உரை குறிப்பாகச் சுட்டுவதால், பாலினத் துல்லியம் காக்கப்படுகிறது.
- issue: அசைவாட்டப்பட்டவற்றின் குறிப்பு
  choice: அவற்றை
  alternative: அவர்களை
  rationale: אֹתָם இலக்கண ரீதியாகப் பல பொருட்களையோ ஆட்களையோ குறிக்கக்கூடியதாக இருந்தாலும், உடனடி சூழலில் உள்ளங்கைகளில் வைக்கப்பட்ட காணிக்கைப் பகுதிகளே அதன் இயல்பான முன்னோடியாக உள்ளன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘அசைவாட்டும் காணிக்கை’ என்ற சடங்குச் சொல், தொடர்புடைய எபிரெயப் பெயர்ச்சொல் மற்றும் வினைச்சொல்லின் மீளுருவாக்கத்தைத் தக்கவைக்கிறது. முதல் வாக்கியத்தின் ‘அவர்’ சூழலில் மோசேயைக் குறிக்கிறது; மூல வசனத்தில் பெயர் மீண்டும் சொல்லப்படாததால் தமிழிலும் சேர்க்கப்படவில்லை.
