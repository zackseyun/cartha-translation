base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/028.yaml
  text: Then Moses took them from their palms and burned them on the altar[a], on top of the burnt offering. They were an ordination offering for a pleasing aroma[b], a food offering to Yahweh.
translation:
  language: ta
  text: பின்பு மோசே அவற்றை அவர்களுடைய உள்ளங்கைகளிலிருந்து எடுத்து, பலிபீடத்தில், தகனபலியின் மேல் எரித்துப் புகையெழச் செய்தான். அவை நியமனப் பலி[a]; இனிய நறுமணமாகிய யெகோவாவுக்கான நெருப்புப் பலி[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நிறுவற்பலி.’ எபிரெயச் சொல் ஆசாரியர்களை அவர்களுடைய பணிக்காக நியமிக்கும் சடங்கில் செலுத்தப்படும் பலியைக் குறிக்கும் தொழில்நுட்பச் சொல்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘உணவுப் படையல்.’ எபிரெயச் சொல் நெருப்பின் மூலம் செலுத்தப்படும் பலியைக் குறிக்கும் பலியியல் சொல்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: எடுத்து
  rationale: לקח என்பதன் இயல்பான கதைநடைப் பொருள் ‘எடுத்தான்’; சடங்கின் தொடர்ச்சியான செயலைத் தெளிவாகக் காட்டுகிறது.
- source_word: מֵעַל כַּפֵּיהֶם
  choice: அவர்களுடைய உள்ளங்கைகளிலிருந்து
  rationale: כַּפִּים என்பது இங்கு கைகள் என்பதைக் காட்டிலும் குறிப்பாக உள்ளங்கைகளைக் குறிக்கிறது; முந்தைய வசனத்தின் சடங்குச் செயலைத் துல்லியமாகத் தொடர்கிறது.
- source_word: וַיַּקְטֵר
  choice: எரித்துப் புகையெழச் செய்தான்
  rationale: பலிச்சூழலில் קטר என்பதன் ஹிஃபில் வடிவம் பலியைப் புகையாக மேலெழச் செய்வதைக் குறிக்கிறது; ‘எரித்தான்’ என்பதைக் காட்டிலும் எபிரெயச் சடங்குச் செயலைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: הַמִּזְבֵּחָה
  choice: பலிபீடத்தின் மேல்
  rationale: திசைச்சுட்டும் வடிவம் இங்கு பலி எரிக்கப்படும் இடத்தைக் குறிக்கிறது; தமிழில் ‘பலிபீடத்தின் மேல்’ இயல்பான இடவுரை.
- source_word: עַל הָעֹלָה
  choice: தகனபலியின்மீது
  rationale: עַל என்பதன் நேரடியான பொருள் ‘மேல்/மீது’; ஏற்கெனவே வைக்கப்பட்ட தகனபலியின் மீது இப்பகுதிகள் எரிக்கப்படுவதைச் சொல்கிறது.
- source_word: מִלֻּאִים
  choice: அர்ப்பணிப்புப் பலி
  rationale: ஆசாரியர்களைத் திருப்பணிக்காக நிறுவும் சடங்குக்குரிய தொழில்நுட்பச் சொல். ‘அர்ப்பணிப்பு’ என்பது பிற்காலத் திருச்சபைப் பதவியமைப்பை இறக்குமதி செய்யாமல் இச்சடங்கின் பொருளைத் தெரிவிக்கிறது.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: இனிய நறுமணத்திற்கான
  rationale: ஏற்றுக்கொள்ளப்படுதலை உணர்த்தும் வழக்கமான பலியியல் சொற்றொடரை இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: אִשֶּׁה
  choice: நெருப்புப் பலி
  rationale: אִשֶּׁה என்பது நெருப்பின் மூலம் செலுத்தப்படும் பலிக்கான தொழில்நுட்பப் பெயர்; ‘நெருப்புப் பலி’ அதன் வடிவத்தையும் சடங்குத் தன்மையையும் நேரடியாகக் காக்கிறது.
- source_word: לַיהוָה
  choice: யெகோவாவுக்கு
  rationale: எபிரெய மூலத்தில் உள்ள தனிப்பெயர் יהוה என்பதை பொதுப்பட்டமாக மாற்றாமல் தமிழில் பரவலாக அறியப்படும் ‘யெகோவா’ என ஒலிபெயர்க்கிறது.
theological_decisions:
- issue: מִלֻּאִים என்ற ஆசாரிய நிறுவல் சடங்குச் சொல்லின் மொழிபெயர்ப்பு
  choice: அர்ப்பணிப்புப் பலி
  alternative: நிறுவற்பலி / கைகளை நிரப்பும் பலி
  rationale: ‘கைகளை நிரப்புதல்’ என்பது எபிரெயச் சொல்லின் பின்னணியானாலும் தமிழில் தனியாகத் தெளிவில்லை. ‘அர்ப்பணிப்புப் பலி’ உடனடிச் சூழலின் ஆசாரிய அர்ப்பணிப்பை வாசகருக்குப் புரியவைக்கிறது; மாற்று விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: אִשֶּׁה என்ற பலியியல் சொல்லின் மொழிபெயர்ப்பு
  choice: நெருப்புப் பலி
  alternative: உணவுப் படையல்
  rationale: இச்சொல்லின் சரியான சொற்பிறப்பும் நுண்பொருளும் விவாதத்திற்குரியவை. ‘நெருப்புப் பலி’ நெருப்பால் செலுத்தப்படுவதைத் தெளிவாகக் காட்டி, தேவனுக்கான உணவு என்ற கருத்தை தேவையின்றி முன்னிறுத்தாது; மாற்றுப் புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: יהוה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: கர்த்தர் / யாவே
  rationale: மூலத்தில் பொதுப்பட்டம் அல்ல, தனிப்பெயர் உள்ளது. தமிழ்ச் சூழலில் அறியத்தக்க ஒலிபெயர்ப்பாக ‘யெகோவா’ பயன்படுத்தப்பட்டு, மூலத்தின் தனிப்பெயர்த் தன்மை காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரநிலைத் தமிழில் இயல்பான, கண்ணியமான வழிபாட்டு நடை பயன்படுத்தப்பட்டுள்ளது. ‘உள்ளங்கைகள்’, ‘எரித்துப் புகையெழச் செய்தான்’ ஆகியவை மூலத்தின் உடல் மற்றும் சடங்கு விவரங்களைத் தெளிவாகக் காக்கின்றன; அரிதான தொழில்நுட்ப மாற்றுகள் அடிக்குறிப்புகளில் விளக்கப்பட்டுள்ளன.
