- from: பின்பு மோசே அவற்றை அவர்களுடைய உள்ளங்கைகளிலிருந்து எடுத்து, பலிபீடத்தின் மேல், தகனபலியின்மீது எரித்துப் புகையெழச் செய்தான். அவை இனிய நறுமணத்திற்கான அர்ப்பணிப்புப் பலி[a]; அது யெகோவாவுக்குச் செலுத்தப்படும் நெருப்புப் பலி[b].
