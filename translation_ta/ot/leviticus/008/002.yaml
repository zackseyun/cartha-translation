id: LEV.8.2
reference: Leviticus 8:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: קַ֤ח אֶֽת אַהֲרֹן֙ וְ/אֶת בָּנָ֣י/ו אִתּ֔/וֹ וְ/אֵת֙ הַ/בְּגָדִ֔ים וְ/אֵ֖ת שֶׁ֣מֶן הַ/מִּשְׁחָ֑ה וְ/אֵ֣ת פַּ֣ר הַֽ/חַטָּ֗את וְ/אֵת֙ שְׁנֵ֣י הָֽ/אֵילִ֔ים וְ/אֵ֖ת סַ֥ל הַ/מַּצּֽוֹת־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/002.yaml
  text: Take Aaron and his sons with him[a], and the garments, and the anointing oil, and the bull of the sin offering, and the two rams, and the basket of unleavened bread.
translation:
  language: ta
  text: ஆரோனையும், அவனோடு அவன் மகன்களையும், ஆடைகளையும், அபிஷேக எண்ணெயையும், பாவப்பலிக்கான காளையையும்[a], இரண்டு செம்மறியாட்டுக் கடாக்களையும், புளிப்பில்லாத அப்பங்களின் கூடையையும் எடுத்துக்கொள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தூய்மைப்படுத்தும் பலிக்கான காளை.” எபிரெயச் சொல் பாவத்தோடும் சடங்குத் தூய்மைப்படுத்துதலோடும் தொடர்புடைய பலியைக் குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: קַח
  choice: எடுத்துக்கொள்
  rationale: לקח என்பதன் ஆண்பால் ஒருமை முன்னிலை ஏவல்வடிவம். மனிதர்களையும் சடங்குப் பொருட்களையும் ஒரே கட்டளையின் கீழ் சேர்த்துக் குறிப்பிடும் எபிரெய அமைப்பை மிகையாக இயக்கவினையாக மாற்றாமல் காக்கிறது.
- source_word: אַהֲרֹן
  choice: ஆரோன்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள பெயரெழுத்தாக்கம்.
- source_word: בָּנָיו אִתּוֹ
  choice: அவனோடு அவன் மகன்களையும்
  rationale: ‘அவன் மகன்கள்’ என்பதையும் ‘அவனோடு’ என்பதையும் வெளிப்படையாகக் காத்து, אִתּוֹ என்பதை விடாமல் மொழிபெயர்க்கிறது.
- source_word: הַבְּגָדִים
  choice: ஆடைகள்
  rationale: பொதுவான ‘ஆடைகள்’ என்ற பொருளைத் தருகிறது; இங்கு ஆசாரிய ஆடைகள் குறிக்கப்பட்டாலும் மூலத்தில் இல்லாத கூடுதல் தொழில்நுட்பச் சொல்லைச் சேர்ப்பதில்லை.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: அபிஷேக எண்ணெய்
  rationale: ‘அபிஷேகத்திற்கான எண்ணெய்’ என்ற சடங்குப் பொருளை இயல்பான, பரவலாக அறியப்படும் தமிழில் தருகிறது.
- source_word: פַּר הַחַטָּאת
  choice: பாவநிவாரணப் பலிக்கான காளை
  rationale: פַּר என்பதை ‘காளை’ என்றும், பலிச் சூழலில் חַטָּאת என்பதை பலிவகையாகவும் காட்டுகிறது. ‘-க்கான’ என்பது அந்தப் பலிக்குப் பயன்படுத்தப்படும் விலங்கைத் தெளிவுபடுத்துகிறது.
- source_word: שְׁנֵי הָאֵילִים
  choice: இரண்டு செம்மறியாட்டுக் கடாக்கள்
  rationale: אֵילִים என்பது பலிக்குரிய ஆண் செம்மறியாடுகளைக் குறிக்கும்; ‘கடாக்கள்’ பாலினத்தையும் ‘செம்மறியாட்டு’ விலங்கு வகையையும் தெளிவாக்குகிறது.
- source_word: סַל הַמַּצּוֹת
  choice: புளிப்பில்லாத அப்பங்கள் அடங்கிய கூடை
  rationale: מַצּוֹת என்பதன் பன்மை உணர்வைக் காத்து, கூடை மற்றும் அதிலுள்ள புளிப்பில்லாத அப்பங்களின் உறவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: பலிச் சூழலில் חַטָּאת என்பதன் மொழிபெயர்ப்பு
  choice: பாவநிவாரணப் பலி
  alternative: தூய்மைப்படுத்தும் பலி
  rationale: இச்சொல் பாவத்தோடு தொடர்புடைய பலியையும் சடங்குத் தூய்மைப்படுத்துதலையும் குறிக்கக்கூடும். முதன்மை உரையில் பரவலாகப் புரியக்கூடிய ‘பாவநிவாரணப் பலி’ வைக்கப்பட்டு, சடங்குத் தூய்மைப்படுத்தும் பரிமாணம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் லேவியராகமச் சடங்குச் சூழலுக்கேற்ற கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. பட்டியலின் தொடரமைப்பும் ‘அவனோடு’ என்ற மூலத்தின் வெளிப்படையான கூறும் காக்கப்பட்டுள்ளன.
