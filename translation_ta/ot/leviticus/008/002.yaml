- from: ஆரோனையும் அவனோடு அவன் மகன்களையும், ஆடைகளையும், அபிஷேக எண்ணெயையும், பாவநிவாரணப் பலிக்கான காளையையும்[a], இரண்டு செம்மறியாட்டுக் கடாக்களையும், புளிப்பில்லாத அப்பங்கள் அடங்கிய கூடையையும் எடுத்துக்கொள்.
