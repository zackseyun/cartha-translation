base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/013.yaml
  text: Then Moses brought Aaron’s sons near[a], and clothed them with tunics, and girded them with sashes, and bound caps on them[c][b], just as Yahweh had commanded Moses.
translation:
  language: ta
  text: பின்னர் மோசே ஆரோனின் மகன்களை அருகே கொண்டுவந்து[a], அவர்களுக்கு அங்கிகளை அணிவித்து, அவர்கள் ஒவ்வொருவருக்கும் ஓர் இடைக்கச்சையைக் கட்டி[b], அவர்களுடைய தலைகளில் குல்லாய்களைக் கட்டினார். யாவே மோசேக்குக் கட்டளையிட்டபடியே மோசே செய்தார்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆரோனின் மகன்களை முன்னிறுத்தி.” எபிரெய வினைச்சொல் “அருகே கொண்டுவருதல்” என்றும், சடங்குச் சூழலில் “முன்னிறுத்துதல்” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயில் “இடைக்கச்சை” ஒருமையில் உள்ளது; இங்கு ஒவ்வொரு மகனுக்கும் தனித்தனி ஆசாரிய இடைக்கச்சை கட்டப்பட்டதாகப் பகிர்நிலையில் பொருள்படுகிறது.
    reason: lexical_alternative
  - marker: c
    text: எபிரெயில் உள்ள தெய்வீகப் பெயர் YHWH; இது பாரம்பரியமாக “ஆண்டவர்” என்று வழங்கப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: அருகே கொண்டுவந்து
  rationale: הקריב என்பதன் இறப்பியல் வடிவம் ‘அருகே கொண்டுவருதல்’ அல்லது சடங்கு முறையில் ‘முன்னிறுத்துதல்’ எனப் பொருள்படலாம். தமிழில் ‘அருகே கொண்டுவந்து’ என்பது அதன் அடிப்படை இயக்கத்தையும் சடங்குச் சூழலின் நுட்பத்தையும் அளவுக்கு மீறித் தீர்மானிக்காமல் காக்கிறது.
- source_word: בְּנֵי אַהֲרֹן
  choice: ஆரோனின் மகன்கள்
  rationale: எபிரெயக் கட்டமைப்பின் நேரடியான, இயல்பான தமிழ் வடிவம்.
- source_word: וַיַּלְבִּשֵׁם כֻּתֳּנֹת
  choice: அவர்களுக்கு அங்கிகளை அணிவித்து
  rationale: הלביש என்பது ஒருவருக்கு ஆடை அணிவித்தலைக் குறிக்கிறது; כֻּתֹּנֶת என்பது சட்டை போன்ற அடிப்படை ஆசாரிய ஆடை. ‘அங்கி’ தமிழில் இயல்பாகவும் மரியாதையான நடையிலும் இதைத் தெரிவிக்கிறது.
- source_word: וַיַּחְגֹּר אֹתָם אַבְנֵט
  choice: அவர்கள் ஒவ்வொருவருக்கும் ஓர் இடைக்கச்சையைக் கட்டி
  rationale: חגר என்பது இடையைச் சுற்றிக் கட்டுதல்; אַבְנֵט என்பது துணியாலான ஆசாரிய இடைக்கச்சை. எபிரெயில் பெயர்ச்சொல் ஒருமையில் இருந்தாலும் பன்மை மனிதர்களோடு பகிர்நிலைப் பொருளில் வந்து, ஒவ்வொருவருக்கும் ஒன்று என்பதைக் குறிக்கிறது.
- source_word: וַיַּחֲבֹשׁ לָהֶם מִגְבָּעוֹת
  choice: அவர்களுடைய தலைகளில் குல்லாய்களைக் கட்டினார்
  rationale: חבשׁ என்பது இங்கு தலை ஆடையைக் கட்டுவதைக் குறிக்கிறது. מִגְבָּעוֹת சாதாரண ஆசாரியர்களின் தனிப்பட்ட தலை ஆடைகள்; அவை ஆரோனின் தலைப்பாகையிலிருந்து வேறுபட்டவை. ‘குல்லாய்கள்’ இந்த வேறுபாட்டைக் காக்கிறது.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: யாவே மோசேக்குக் கட்டளையிட்டபடியே அவர் செய்தார்
  rationale: திரும்பத் திரும்ப வரும் கீழ்ப்படிதல் வாய்ப்பாட்டை இயல்பான தமிழில் வெளிப்படுத்தி, செயல்கள் கட்டளைக்கு முழுமையாக ஒத்திருந்ததைத் தெரிவிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெயின் நான்கெழுத்துத் தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரிந்துகொள்ளத்தக்க ஒலிபெயர்ப்பாக வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூல உரையில் ஒரு பொதுப் பட்டம் அல்ல, YHWH என்ற தனிப்பெயரே உள்ளது. எனவே தனிப்பெயரைத் தக்கவைக்க ‘யாவே’ பயன்படுத்தப்பட்டுள்ளது; பாரம்பரிய மாற்றீடு அடிக்குறிப்பில் தரப்படுகிறது.
- issue: וַיַּקְרֵב என்பதன் சடங்குசார் நுட்பம்
  choice: அருகே கொண்டுவந்து
  alternative: முன்னிறுத்தி
  rationale: வினைச்சொல் சாதாரணமாக ‘அருகே கொண்டுவருதல்’ என்றும் சடங்குச் சூழலில் ‘முன்னிறுத்துதல்’ என்றும் அமையலாம். சடங்குசார் தொழில்நுட்பப் பொருளை உறுதியாக்காமல் உண்மையான பொருள் விரிவைத் தக்கவைக்க நேரடியான வடிவம் முதன்மை உரையில் வைக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் சடங்குச் சூழலுக்கேற்ற கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘அணிவித்து’, ‘இடைக்கச்சை’, ‘குல்லாய்’ ஆகிய சொற்கள் ஆசாரிய உடைகளின் வேறுபாட்டைத் தெளிவாக வைத்திருக்கின்றன; தேவையற்ற பழமையான வாக்கிய அமைப்புகள் தவிர்க்கப்பட்டுள்ளன.
