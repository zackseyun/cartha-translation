- from: '“ஆரோனிடமும் அவன் மகன்களிடமும் இஸ்ரவேலர் அனைவரிடமும்[a] பேசி, அவர்களிடம் சொல்: ‘யாவே கட்டளையிட்ட காரியம் இதுவே[b]:’”'
  to: 'ஆரோனிடமும், அவன் மகன்களிடமும், இஸ்ரவேலர் அனைவரிடமும்[a] பேசு; அவர்களிடம், ‘யாவே கட்டளையிட்ட காரியம் இதுவே[b]:'
  rationale: பேசி is revised to பேசு to retain the independent force of the first Hebrew imperative. Punctuation is revised so that the quotation introduced by ‘அவர்களிடம்’ and the colon remains open for the command content in the following verse, corresponding to לֵאמֹר. No change is made to the established renderings of the divine name, בני ישראל, or הַדָּבָר.
