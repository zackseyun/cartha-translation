base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/002.yaml
  text: Speak to Aaron and to his sons and to all the sons of Israel[a], and say to them, ‘This is the thing that Yahweh has commanded[b], saying,’
translation:
  language: ta
  text: 'ஆரோனிடமும், அவன் மகன்களிடமும், இஸ்ரவேலர் அனைவரிடமும்[a] பேசு; அவர்களிடம், ‘யாவே கட்டளையிட்ட காரியம் இதுவே[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “இஸ்ரவேலின் மகன்கள் அனைவரிடமும்”; “இஸ்ரவேல் மக்கள் அனைவரிடமும்” என்றும் மொழிபெயர்க்கலாம்.'
    reason: lexical_alternative
  - marker: b
    text: “இந்த வார்த்தையே” அல்லது “இந்த விஷயமே” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: பேசி
  rationale: பியேல் கட்டளை வடிவத்தின் நேரடியான ஆணையைத் தொடர்ந்து வரும் இணை கட்டளையுடன் இயல்பான தமிழில் இணைக்கிறது.
- source_word: בָּנָיו
  choice: அவன் மகன்கள்
  rationale: ஆரோனின் ஆண் பிள்ளைகளையே குறிப்பாகச் சுட்டும் எபிரெய ஆண்பால் பன்மையைத் துல்லியமாகப் பேணுகிறது.
- source_word: כָּל בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலர் அனைவரும்
  rationale: சொல்லுக்குச் சொல் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இது முழு இஸ்ரவேல் சமூகத்தைக் குறிக்கும் நிலையான இனக்குழுப் பெயர்; நவீனத் தமிழில் ‘இஸ்ரவேலர் அனைவரும்’ இயல்பாகவும் உள்ளடக்கத் துல்லியத்துடனும் உள்ளது.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: அவர்களிடம் சொல்
  rationale: முதல் கட்டளையைத் தொடரும் இரண்டாவது நேரடி ஆணையின் வலிமையையும் எபிரெய இணைப்பையும் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: זֶה הַדָּבָר
  choice: காரியம் இதுவே
  rationale: דָּבָר என்பதன் ‘சொல்/காரியம்/விஷயம்’ என்ற பொருள் வீச்சில், தொடர்ந்து வரும் கட்டளையின் உள்ளடக்கத்தை அறிமுகப்படுத்தும் இச்சூழலில் ‘காரியம்’ இயல்பானது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: צִוָּה
  choice: கட்டளையிட்ட
  rationale: செய்துமுடித்த வினை வடிவத்தையும், இப்போது அறிவிக்கப்படவிருக்கும் தெய்வீகக் கட்டளையையும் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநாமத்தை ஒரு பட்டத்தால் மாற்றாமல், எபிரெய மெய்யெழுத்துப் பெயரின் வழக்கமான தமிழாக்க ஒலிபெயர்ப்பால் வழங்குகிறது.
- source_word: לֵאמֹר
  choice: என்று சொல்லியிருப்பது
  rationale: அடுத்த வசனத்தில் வரும் கட்டளையின் நேரடி உள்ளடக்கத்தை அறிமுகப்படுத்தும் எபிரெய infinitive-இன் செயல்பாட்டைத் தமிழில் வெளிப்படுத்துகிறது; பிரதான உரையில் முக்காற்புள்ளி இந்தத் தொடர்ச்சியை இயல்பாகக் காட்டுகிறது.
theological_decisions:
- issue: יְהוָה என்ற உடன்படிக்கைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக இருப்பதால், அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூலத் தன்மையைப் பேணுகிறது.
- issue: בני ישראל என்ற குடும்பவழி இனக்குழுச் சொல்லின் வடிவம்
  choice: இஸ்ரவேலர் அனைவரும்
  alternative: இஸ்ரவேலின் மகன்கள் அனைவரும்
  rationale: இங்கு மரபுவழிப் பன்மைச் சொற்றொடர் முழு உடன்படிக்கைச் சமூகத்தைக் குறிக்கும் இனப்பெயராகச் செயல்படுகிறது. ‘இஸ்ரவேலர் அனைவரும்’ அதன் குறிப்பு எல்லையைத் தெளிவாகவும் இயல்பாகவும் தருகிறது; சொற்சார்ந்த வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: זה הדבר என்பதில் דָּבָר-இன் பொருள்
  choice: காரியம் இதுவே
  alternative: வார்த்தை இதுவே
  rationale: தொடர்ந்து அறிவிக்கப்படும் கட்டளை அல்லது விஷயத்தை அறிமுகப்படுத்தும் சூத்திரத்தில் ‘காரியம்’ பொருத்தமானது; ‘வார்த்தை’ என்ற உண்மையான மாற்றுப் பொருளும் அடிக்குறிப்பில் வைக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கட்டளைநடை பயன்படுத்தப்பட்டுள்ளது. மேற்கோள் அடுத்த வசனத்தில் தொடர்வதை முக்காற்புள்ளி காட்டுகிறது; அனைத்து அடிக்குறிப்பு குறிகளும் பிரதான உரையில் இடம்பெற்றுள்ளன.
