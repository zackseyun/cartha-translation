  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ta
  text: 'யாவே[a] மோசேயிடம் இவ்வாறு பேசினார்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில்: ‘YHWH’; மரபாக ‘கர்த்தர்’ என்று மொழிபெயர்க்கப்படுகிறது.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பேசினார்
  rationale: דבר என்பதன் தொடர்கதை வடிவம் ஒரு புதிய உரையாடல் நிகழ்வை அறிமுகப்படுத்துகிறது; நவீனத் தமிழில் ‘பேசினார்’ என்பது இயல்பானதும் மரியாதையானதும் ஆகும்.
- source_word: יְהוָה
  choice: யாவே
  rationale: יהוה என்ற இறைப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், அதன் பரவலான ஒலிபெயர்ப்பான ‘யாவே’ என்று வழங்குகிறது.
- source_word: אֶל
  choice: -இடம்
  rationale: பேச்சு யாரை நோக்கியது என்பதைச் சுட்டும் எபிரெய முன்னிலைக்கு ‘மோசேயிடம்’ என்பது இயல்பான நவீனத் தமிழ் அமைப்பு.
- source_word: מֹשֶׁה
  choice: மோசே
  rationale: מֹשֶׁה என்ற நபர்பெயரின் தமிழில் நிலைபெற்ற வடிவம்.
- source_word: לֵאמֹר
  choice: இவ்வாறு
  rationale: அடுத்து வரும் உரையின் உள்ளடக்கத்தை அறிமுகப்படுத்தும் எபிரெயச் சொற்றொடரை, ‘பேசினார்’ என்பதுடன் தேவையற்ற மறுபடிவம் இல்லாமல் இயல்பான தமிழில் ‘இவ்வாறு பேசினார்:’ என்று வழங்குகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல உரையில் தனிப்பட்ட இறைப் பெயரான יהוה நேரடியாக உள்ளது. ஆகவே அதை ஒரு பட்டமாக மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது; மரபு வழக்கை அடிக்குறிப்பு தெரிவிக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையான, கண்ணியமான உரை. எபிரெயத்தின் ‘பேசி, சொல்லி’ என்ற சொற்றொடரைச் சொற்சொல்லாக மீளுரைக்காமல், அடுத்துவரும் நேரடி உரையை இயல்பாக அறிமுகப்படுத்த ‘இவ்வாறு பேசினார்:’ என வழங்கப்பட்டுள்ளது.
