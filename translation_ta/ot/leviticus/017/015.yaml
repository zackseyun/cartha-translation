source:
  edition: WLC
  text: וְ/כָל נֶ֗פֶשׁ אֲשֶׁ֨ר תֹּאכַ֤ל נְבֵלָה֙ וּ/טְרֵפָ֔ה בָּ/אֶזְרָ֖ח וּ/בַ/גֵּ֑ר וְ/כִבֶּ֨ס בְּגָדָ֜י/ו וְ/רָחַ֥ץ בַּ/מַּ֛יִם וְ/טָמֵ֥א עַד הָ/עֶ֖רֶב וְ/טָהֵֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/015.yaml
  text: And every person who eats an animal found dead or one torn by beasts[a], whether native or sojourner, shall wash his clothes and bathe in water, and he shall be unclean until the evening[b]; then he shall be clean.
translation:
  language: ta
  text: தானாகச் செத்த விலங்கையோ காட்டு விலங்குகளால் கிழிக்கப்பட்ட விலங்கையோ சாப்பிடுகிற எவரும்—அவர் நாட்டில் பிறந்தவராக இருந்தாலும் குடியேறிய அந்நியராக இருந்தாலும்[a]—தம் உடைகளைக் கழுவி, தண்ணீரில் குளிக்க வேண்டும். மாலைவரை அவர் தீட்டுள்ளவராக இருப்பார்; அதன்பின் தீட்டு நீங்கியவராவார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “குடியேறிய அந்நியர்” என்பது இஸ்ரவேலரிடையே தங்கி வாழும் அயல்நாட்டவரைக் குறிக்கிறது; “அந்நியக் குடியிருப்பாளர்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: எவரும்
  rationale: சட்டச் சூழலில் தனிநபரைக் குறிக்கிறது; தமிழில் நிபந்தனை வாக்கியத்திற்கு இயல்பான பொதுப்படுத்தப்பட்ட வடிவம்.
- source_word: נְבֵלָה
  choice: தானாகச் செத்த விலங்கு
  rationale: முறைப்படி அறுக்கப்படாமல் தானாக இறந்த விலங்கின் உடலைக் குறிக்கும் சடங்குசார் வகையைத் தெளிவுபடுத்துகிறது.
- source_word: טְרֵפָה
  choice: காட்டு விலங்கால் கிழிக்கப்பட்டது
  rationale: வேட்டை விலங்கால் கிழிக்கப்பட்ட விலங்கைச் சுட்டும் எபிரெயச் சொல்லின் காரணப் பொருளைப் பாதுகாக்கிறது.
- source_word: אֶזְרָח
  choice: நாட்டினர்
  rationale: இஸ்ரவேல் சமூகத்தின் பூர்வகுடி உறுப்பினரைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: גֵּר
  choice: குடியேறிய அந்நியர்
  rationale: வழிப்போக்கர் அல்லாமல் நாட்டில் தங்கி வாழும் அயல்நாட்டவரைக் குறிக்கும் சட்டப்பொருளைப் பாதுகாக்கிறது.
- source_word: וְכִבֶּס בְּגָדָיו
  choice: தம் உடைகளைக் கழுவி
  rationale: தேவையான சடங்குச் செயலை நவீன தமிழில் இயல்பாகத் தருகிறது.
- source_word: וְרָחַץ בַּמַּיִם
  choice: தண்ணீரில் குளிக்க வேண்டும்
  rationale: உடலைத் தண்ணீரால் கழுவும் செயலைத் தெளிவாகக் குறிக்கிறது.
- source_word: וְטָמֵא עַד הָעֶרֶב
  choice: மாலைவரை அவர் தீட்டுள்ளவராக இருப்பார்
  rationale: ஒழுக்கக் குற்றத்தை அல்ல, தற்காலிக சடங்குசார் அசுத்த நிலையைத் தமிழில் நிலைபெற்ற சொற்களால் குறிக்கிறது.
- source_word: וְטָהֵר
  choice: அதன்பின் தீட்டு நீங்கியவராவார்
  rationale: கழுவுதலும் குறிப்பிட்ட காலமும் முடிந்த பின் சடங்குசார் நிலை மாறுவதைத் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: லேவியராகமத் தூய்மைச் சட்டத்தில் טָמֵא/טָהֵר என்பவற்றின் இயல்பு
  choice: “தீட்டுள்ளவர்/தீட்டு நீங்கியவர்” என்று சடங்குசார் நிலையைக் குறிக்கும் வகையில் மொழிபெயர்த்தல்
  alternative: “அசுத்தமானவர்/சுத்தமானவர்” அல்லது ஒழுக்கக் களங்கத்தை உணர்த்தக்கூடிய சொற்கள்
  rationale: இவ்வசனம் தனிநபரின் ஒழுக்கச் சீர்கேட்டைக் காட்டிலும், உணவினால் ஏற்படும் தற்காலிக சடங்குசார் நிலையைப் பற்றியது; ஆகவே தேவையற்ற ஒழுக்கத் தீர்ப்பைச் சேர்க்காமல் வேறுபாட்டைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சட்டவிதியின் கண்ணியமான தொனி காக்கப்பட்டுள்ளது. பாலினத்தை தேவையின்றி முன்னிறுத்தாத “எவரும்/அவர்/தம்” வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. “தீட்டு” என்பது இங்கு ஒழுக்கக் குற்றமல்ல, சடங்குசார் நிலை.
