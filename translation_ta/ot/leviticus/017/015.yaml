revisions:
- from: தானாகச் செத்த விலங்கையோ காட்டு விலங்கால் கிழிக்கப்பட்டதையோ சாப்பிடுகிற எவரும்—அவர் நாட்டினராக இருந்தாலும் குடியேறிய அந்நியராக இருந்தாலும்[a]—தம் உடைகளைக் கழுவி, தண்ணீரில் குளிக்க வேண்டும். மாலைவரை அவர் தீட்டுள்ளவராக இருப்பார்; அதன்பின் தீட்டு நீங்கியவராவார்.
  to: தானாகச் செத்த விலங்கையோ காட்டு விலங்குகளால் கிழிக்கப்பட்ட விலங்கையோ சாப்பிடுகிற எவரும்—அவர் நாட்டில் பிறந்தவராக இருந்தாலும் குடியேறிய அந்நியராக இருந்தாலும்[a]—தம் உடைகளைக் கழுவி, தண்ணீரில் குளிக்க வேண்டும். மாலைவரை அவர் தீட்டுள்ளவராக இருப்பார்; அதன்பின் தீட்டு நீங்கியவராவார்.
  rationale: The revision makes the two animal categories syntactically and semantically parallel, clarifies the native-born/legal-community contrast, and otherwise retains the draft’s accurate rendering of the ritual washing and temporary ritual impurity.
