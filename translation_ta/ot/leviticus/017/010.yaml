  text: וְ/אִ֨ישׁ אִ֜ישׁ מִ/בֵּ֣ית יִשְׂרָאֵ֗ל וּ/מִן הַ/גֵּר֙ הַ/גָּ֣ר בְּ/תוֹכָ֔/ם אֲשֶׁ֥ר יֹאכַ֖ל כָּל דָּ֑ם וְ/נָתַתִּ֣י פָנַ֗/י בַּ/נֶּ֨פֶשׁ֙ הָ/אֹכֶ֣לֶת אֶת הַ/דָּ֔ם וְ/הִכְרַתִּ֥י אֹתָ֖/הּ מִ/קֶּ֥רֶב עַמָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/010.yaml
  text: And any man from the house of Israel[a], or from the sojourner who sojourns among them, who eats any blood—I will set my face against the person who eats the blood[c][b], and I will cut him off from among his people.
translation:
  language: ta
  text: “இஸ்ரயேல் வீட்டாரில் எவனாயினும், அவர்களிடையே குடியிருக்கும் அந்நியரில் எவனாயினும், எந்த இரத்தத்தையும் உண்டால், இரத்தத்தை உண்கிற அந்த நபருக்கு எதிராக என் முகத்தைத் திருப்புவேன்; அவனை அவன் மக்களின் நடுவிலிருந்து அறுத்துப்போடுவேன்[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அறுத்துப்போடுவேன்” என்பது உடன்படிக்கைத் தண்டனையைக் குறிக்கும் சொல்லாட்சி. இது மரணம், சமூகத்திலிருந்து வெளியேற்றம் அல்லது வேறொரு தெய்வீகத் தீர்ப்பு ஆகியவற்றில் எதைக் குறிக்கிறது என்பதை இந்த வசனம் குறிப்பிடவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִישׁ אִישׁ
  choice: ஒருவனோ
  rationale: இரட்டிக்கப்பட்ட אִישׁ பகிர்வுப்பொருளில் ‘எவனாயினும்/ஒருவன்’ எனும் சட்ட மொழிநடையைக் காட்டுகிறது. அடுத்த இணைச்சொற்றொடருடன் இயல்பாக அமைய ‘ஒருவனோ’ பயன்படுத்தப்பட்டது.
- source_word: מִבֵּית יִשְׂרָאֵל
  choice: இஸ்ரயேல் வீட்டாரில்
  rationale: ‘இஸ்ரயேலின் வீடு’ என்ற எபிரெய உடன்படிக்கைச் சொல்லாட்சியின் கூட்டுமக்கள் பொருளை, தமிழில் இயல்பான ‘இஸ்ரயேல் வீட்டார்’ என்பதால் தக்கவைக்கிறது.
- source_word: וּמִן הַגֵּר הַגָּר בְּתוֹכָם
  choice: அவர்களிடையே குடியிருக்கும் அந்நியரில் ஒருவனோ
  rationale: גֵּר என்பது வழிப்போக்கனை அல்ல, இஸ்ரயேல் சமூகத்துக்குள் வாழும் பூர்வீகமற்ற குடியிருப்பாளரைக் குறிக்கிறது. பெயர்ச்சொல்–வினையெச்ச எதிரொலி தமிழில் இயல்பாக வெளிப்படுத்தப்பட்டது.
- source_word: אֲשֶׁר יֹאכַל כָּל דָּם
  choice: எந்த இரத்தத்தையாவது உண்டால்
  rationale: כָּל דָּם தடையின் முழுமையை, ‘எந்த இரத்தத்தையாவது’ தெளிவாகத் தெரிவிக்கிறது; יֹאכַל என்பதற்கு நேரான ‘உண்’ வினை வைக்கப்பட்டது.
- source_word: וְנָתַתִּי פָנַי
  choice: நான் என் முகத்தைத் திருப்பி ... எதிராக
  rationale: தேவனுடைய உறுதியான எதிர்ப்பையும் நியாயத்தீர்ப்பையும் குறிக்கும் உருவகத்தைப் பராமரிக்கிறது. தமிழில் ‘ஒருவருக்கு எதிராக முகத்தைத் திருப்பு’ என்பது இயல்பான அமைப்பு.
- source_word: בַּנֶּפֶשׁ הָאֹכֶלֶת
  choice: இரத்தத்தை உண்கிற அந்த நபருக்கு எதிராக
  rationale: נֶפֶשׁ இங்கு தனிப்பட்ட குற்றவாளியைக் குறிக்கிறது; ‘ஆத்துமா’ என மொழிபெயர்த்து தேவையற்ற மெய்யியல் பொருளை வரவழைக்காமல் ‘நபர்’ பயன்படுத்தப்பட்டது.
- source_word: וְהִכְרַתִּי אֹתָהּ מִקֶּרֶב עַמָּהּ
  choice: அவனை அவன் மக்களின் நடுவிலிருந்து அறுத்துப்போடுவேன்
  rationale: כרת என்ற உடன்படிக்கைத் தண்டனைச் சொல்லாட்சியை அதன் சரியான நடைமுறை என்னவென்று தீர்மானிக்காமல், தமிழிலும் உருவகமாகத் தக்கவைக்கிறது.
theological_decisions:
- issue: ‘அறுத்துப்போடுவேன்’ என்ற தண்டனைச் சொல்லாட்சியின் பொருள்
  choice: தண்டனையின் முறையை வரையறுக்காமல் உருவகச் சொல்லாட்சியைத் தக்கவைத்தல்
  alternative: கொன்றுபோடுவேன்; சமூகத்திலிருந்து வெளியேற்றுவேன்; தெய்வீகத் தீர்ப்பினால் அகற்றுவேன்
  rationale: இந்த வசனம் கடுமையான உடன்படிக்கைத் தீர்ப்பை அறிவிக்கிறது; ஆனால் அது மரணமா, வெளியேற்றமா, வேறொரு தெய்வீகத் தீர்ப்பா என்பதை இங்கே குறிப்பிடவில்லை. ஆகவே மூலத்தின் பொருள் நெருக்கடியும் தெளிவின்மையும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன, கண்ணியமான சட்ட மொழிநடை பயன்படுத்தப்பட்டுள்ளது. ‘இஸ்ரயேல் வீட்டார்’ உடன்படிக்கைச் சொற்றொடரை இயல்பாகக் காக்கிறது; ‘குடியிருக்கும் அந்நியர்’ גֵּר என்பதன் சமூக-சட்ட நுணுக்கத்தைத் தெரிவிக்கிறது. தேவையற்ற சமயப் பிரிவு சார்ந்த விளக்கங்கள் தவிர்க்கப்பட்டுள்ளன.
