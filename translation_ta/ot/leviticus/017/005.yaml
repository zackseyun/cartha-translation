source:
  edition: WLC
  text: לְמַעַן֩ אֲשֶׁ֨ר יָבִ֜יאוּ בְּנֵ֣י יִשְׂרָאֵ֗ל אֶֽת זִבְחֵי/הֶם֮ אֲשֶׁ֣ר הֵ֣ם זֹבְחִים֮ עַל פְּנֵ֣י הַ/שָּׂדֶה֒ וֶֽ/הֱבִיאֻ֣/ם לַֽ/יהוָ֗ה אֶל פֶּ֛תַח אֹ֥הֶל מוֹעֵ֖ד אֶל הַ/כֹּהֵ֑ן וְ/זָ֨בְח֜וּ זִבְחֵ֧י שְׁלָמִ֛ים לַֽ/יהוָ֖ה אוֹתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/005.yaml
  text: so that the sons of Israel may bring their sacrifices that they are sacrificing in the open field[a], and bring them to Yahweh at the entrance of the tent of meeting, to the priest[b], and sacrifice them as peace offerings to Yahweh.
translation:
  language: ta
  text: இஸ்ரவேலின் மகன்கள்[a] வயல்வெளியில் தாங்கள் பலியிடுகிற தங்கள் பலிகளை யாவேவுக்காகச் சந்திப்புக் கூடாரத்தின் நுழைவாயிலில் ஆசாரியனிடம் கொண்டு வந்து, அவற்றை யாவேவுக்குச் சமாதானப் பலிகளாக[b] பலியிடும்படி.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்ரவேல் மக்கள்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “கூட்டுறவுப் பலிகள்” அல்லது “நல்வாழ்வுப் பலிகள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן אֲשֶׁר
  choice: வேண்டும் என்பதற்காகவே இது
  rationale: முந்தைய கட்டளையின் நோக்கத்தை அறிமுகப்படுத்தும் எபிரெய நோக்கத் தொடரை இயல்பான தமிழில் வெளிப்படுத்துகிறது; தனித்து நிற்கும் வசனத்திலும் தொடர்பு தெளிவாக இருக்க ‘இது’ சேர்க்கப்பட்டுள்ளது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரெய மூலத்தின் குடும்பவழிச் சொல்லாட்சியையும் ஆண்பால் பன்மை வடிவத்தையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: זִבְחֵיהֶם אֲשֶׁר הֵם זֹבְחִים
  choice: தாங்கள் ... பலியிட்டு வரும் பலிகளை
  rationale: ஒரே வேர்ச்சொல்லின் பெயர்ச்சொல்–வினைச்சொல் தொடர்பைப் பாதுகாப்பதோடு, பங்கேற்பு வடிவம் குறிக்கும் தொடர்ச்சியான அல்லது வழக்கமான செயலை ‘வரும்’ எனக் காட்டுகிறது.
- source_word: עַל פְּנֵי הַשָּׂדֶה
  choice: திறந்த வெளியில்
  rationale: வயல் அல்லது நாட்டுப்புற வெளியில், பரிசுத்த இடத்துக்கு வெளியே நிகழும் செயலைக் குறிக்கும் எபிரெய மரபுத்தொடரின் இயல்பான தமிழ் வடிவம்.
- source_word: לַיהוָה
  choice: யாவேவிடம் / யாவேவுக்கு
  rationale: יהוה என்ற உடன்படிக்கைப் பெயரை பட்டப்பெயராக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது; வாக்கியத்திற்கேற்ப வேற்றுமை உருபுகள் இணைக்கப்பட்டுள்ளன.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரத்தின் நுழைவாயில்
  rationale: குறிப்பிட்ட பரிசுத்த இடத்தையும் அதன் நுழைவு நிலையையும் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: אֶל הַכֹּהֵן
  choice: ஆசாரியனிடம்
  rationale: எபிரெயில் உள்ள குறிப்புச் சுட்டை மதித்து, அங்கு பணிபுரியும் குறிப்பிட்ட ஆசாரியனைச் சுட்டுகிறது.
- source_word: זִבְחֵי שְׁלָמִים
  choice: சமாதானப் பலிகள்
  rationale: குறிப்பிட்ட பலிவகையைப் பாரம்பரியமாகவும் புரிந்துகொள்ளத்தக்க வகையிலும் காட்டுகிறது; நல்லுறவு, முழுமை, நல்வாழ்வு ஆகிய பொருள் நிழல்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் வரும் தனிப்பட்ட உடன்படிக்கைப் பெயரைப் பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்க்கிறது; ஒரு குறிப்பிட்ட சமய மரபின் வழக்கைத் திணிப்பதையும் தவிர்க்கிறது.
- issue: בְּנֵי יִשְׂרָאֵל என்ற உடன்படிக்கை மக்களுக்கான குறிப்பு
  choice: இஸ்ரவேலின் மகன்கள்
  alternative: இஸ்ரவேல் மக்கள்
  rationale: மூலத்தின் குடும்பவழி உருவகத்தையும் இலக்கண ஆண்பால் வடிவத்தையும் முதன்மை உரையில் வைத்திருக்கிறது; இயல்பான பொதுப்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: זִבְחֵי שְׁלָמִים என்ற பலிவகையின் பொருள்
  choice: சமாதானப் பலிகள்
  alternative: ஐக்கியப் பலிகள்; நல்வாழ்வுப் பலிகள்
  rationale: ‘சமாதானம்’ என்ற சொல்லுடன் உள்ள தொடர்பை வைத்துக்கொண்டே, அந்தப் பலி நல்லுறவு அல்லது நல்வாழ்வையும் குறிக்கலாம் என்ற பொருள் விரிவை அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் நோக்கத் தொடர்பு தமிழில் முழு வாக்கியமாகத் தெளிவுபடுத்தப்பட்டுள்ளது; பலியிடுதலைக் குறிக்கும் வேர்ச்சொல் மீளுருவாக்கமும், பரிசுத்த இடத்துக்கு வெளியே நடந்துவரும் செயலின் தொடர்ச்சியான தன்மையும் பாதுகாக்கப்பட்டுள்ளன.
