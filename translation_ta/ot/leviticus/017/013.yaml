base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/013.yaml
  text: And any man from the sons of Israel[a], or from the sojourner who sojourns among them, who hunts game—whether wild animal or bird—that may be eaten[b], shall pour out its blood and cover it with earth.
translation:
  language: ta
  text: இஸ்ரவேலின் மக்களில் ஒருவனோ, அவர்கள் நடுவில் குடியிருக்கும் அந்நியனோ, உண்ணத்தக்க காட்டு விலங்கையோ பறவையையோ வேட்டையாடிப் பிடித்தால், அதன் இரத்தத்தை ஊற்றி, அதை மண்ணால் மூட வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அதை” என்பது மிக இயல்பாக அதன் இரத்தத்தையே குறிக்கிறது; எபிரெயச் சொல்லை “புழுதி” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אִישׁ
  choice: ஒருவனோ
  rationale: எபிரெய இரட்டிப்பு ஒவ்வொருவருக்கும் பொருந்தும் பகிர்ந்தளிப்பு உணர்வைத் தருகிறது; சட்டவாக்கியத்தின் இயல்பான தமிழில் நிபந்தனை அமைப்புடன் ‘ஒருவனோ’ என வழங்கப்பட்டது.
- source_word: מִבְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மக்களில்
  rationale: בני ישראל என்பதன் குடும்ப மற்றும் உடன்படிக்கைச் சொல்லாட்சியை இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: הַגֵּר הַגָּר בְּתוֹכָם
  choice: அவர்கள் நடுவில் குடியிருக்கும் அந்நியன்
  rationale: גר என்பது சமூகத்துக்குள் வாழும் இஸ்ரவேலரல்லாத குடியிருப்பாளரைக் குறிக்கிறது; எபிரெயப் பெயர்-வினை மீளுரையைத் தமிழில் செயற்கையாக மீட்டுரைக்காமல் அதன் பொருள் தெளிவாக வழங்கப்படுகிறது.
- source_word: יָצוּד צֵיד
  choice: வேட்டையாடிப் பிடித்தால்
  rationale: ஒரே வேரிலிருந்து வந்த வினை-பெயர் அமைப்பு வெற்றிகரமாக வேட்டையாடிப் பிடிப்பதைச் சுட்டுகிறது; தமிழில் இச்சொற்றொடர் சூழலை இயல்பாகத் தெரிவிக்கிறது.
- source_word: חַיָּה אוֹ עוֹף
  choice: காட்டு விலங்கையோ பறவையையோ
  rationale: வேட்டையாடும் சூழலில் חיה பொதுவான விலங்கை அல்ல, காட்டு விலங்கைச் சுட்டுகிறது; עוף என்பதற்கு ‘பறவை’ இயல்பான இணை.
- source_word: אֲשֶׁר יֵאָכֵל
  choice: உண்ணத்தக்க
  rationale: நிஃபால் வடிவம் இச்சூழலில் உணவாக அனுமதிக்கப்பட்ட அல்லது தகுந்த விலங்கு/பறவையைக் குறிக்கிறது; ‘உண்ணத்தக்க’ இந்தத் திறன்-அனுமதி நுட்பத்தைச் சுருக்கமாகக் காக்கிறது.
- source_word: וְשָׁפַךְ אֶת דָּמוֹ
  choice: அதன் இரத்தத்தை ஊற்றி
  rationale: சட்டச் சூழலில் கட்டளையைக் குறிக்கும் வடிவம்; ‘அதன்’ என்பது பிடிக்கப்பட்ட விலங்கு அல்லது பறவையைச் சுட்டுகிறது, ‘ஊற்றி’ என்பது இரத்தத்தை வெளியேற்றும் செயலைக் காக்கிறது.
- source_word: וְכִסָּהוּ בֶּעָפָר
  choice: அதை மண்ணால் மூட வேண்டும்
  rationale: עפר இங்கு தளர்ந்த மண்/புழுதியைக் குறிக்கிறது; செயல் நடைபெறும் சூழலில் ‘மண்’ இயல்பான தமிழ். அண்மைய முன்னிலையான இரத்தமே ‘அதை’ என்பதன் மிக இயல்பான சுட்டுப்பொருள்.
theological_decisions:
- issue: וְכִסָּהוּ என்பதிலுள்ள ஒருமை ஆண்பால் பின்னொட்டின் சுட்டுப்பொருள்
  choice: இரத்தத்தை மண்ணால் மூடுதல்
  alternative: விலங்கு அல்லது அதன் உடலை மூடுதல்/புதைத்தல்
  rationale: ‘அதன் இரத்தத்தை’ என்பதே உடனடியான முன்னிலை; லேவியராகமம் 17-இன் இரத்தம் குறித்த சூழலும் இதை ஆதரிக்கிறது. எனினும் தமிழ் மூலவாக்கியத்தில் ‘அதை’ என்று சுட்டுப்பெயரைத் தக்கவைத்து, எபிரெய வடிவத்தின் சுருக்கத்தையும் ஓரளவு காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டவாக்கியத்திற்கேற்ற கண்ணியமான ஆனால் பொதுவாசகர்களுக்கு எளிய நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெயத்தின் நீண்ட தொடர்பெயர் அமைப்பு இயல்பான தமிழ் நிபந்தனை வாக்கியமாக மாற்றப்பட்டது; கட்டளையின் வலிமை ‘வேண்டும்’ என்பதால் வெளிப்படுத்தப்பட்டது.
