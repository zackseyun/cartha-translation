  terminology: “இஸ்ரவேலின் மக்களில்,” “அவர்கள் நடுவில் குடியிருக்கும் அந்நியன்,” “காட்டு விலங்கு,” and “உண்ணத்தக்க” are appropriate, source-sensitive choices. “அந்நியன்” is adequately qualified by “குடியிருக்கும்,” avoiding an implication of a mere transient outsider.
