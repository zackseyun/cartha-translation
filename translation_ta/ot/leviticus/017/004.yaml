  text: וְ/אֶל פֶּ֜תַח אֹ֣הֶל מוֹעֵד֮ לֹ֣א הֱבִיא/וֹ֒ לְ/הַקְרִ֤יב קָרְבָּן֙ לַֽ/יהוָ֔ה לִ/פְנֵ֖י מִשְׁכַּ֣ן יְהוָ֑ה דָּ֣ם יֵחָשֵׁ֞ב לָ/אִ֤ישׁ הַ/הוּא֙ דָּ֣ם שָׁפָ֔ךְ וְ/נִכְרַ֛ת הָ/אִ֥ישׁ הַ/ה֖וּא מִ/קֶּ֥רֶב עַמּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/004.yaml
  text: 'and has not brought it to the entrance of the tent of meeting to present it as an offering to Yahweh before the tabernacle of Yahweh[a], blood shall be imputed to that man: he has shed blood[c][b], and that man shall be cut off from among his people.'
translation:
  language: ta
  text: அதைச் சந்திப்புக் கூடாரத்தின் நுழைவாயிலுக்குக் கொண்டுவந்து, யெகோவாவின் வாசஸ்தலத்தின் முன்பாக யெகோவாவுக்குக் காணிக்கையாகச் செலுத்தாதிருந்தால், அந்த மனிதனுக்கு இரத்தப்பழி சுமத்தப்படும்[a]; அவன் இரத்தம் சிந்தினான். அந்த மனிதன் தன் மக்களின் நடுவிலிருந்து அகற்றப்பட வேண்டும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்பட, “அந்த மனிதனுக்கு இரத்தம் கணக்கிடப்படும்”; இது இரத்தச்சிந்துதலுக்கான குற்றப்பொறுப்பைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “அகற்றப்பட வேண்டும்” என்பது இங்கு மரணம், வெளியேற்றம் அல்லது வேறொரு வகையான உடன்படிக்கைச் சமூக நீக்கம் ஆகியவற்றில் எதைக் குறிக்கிறது என்பதை வசனம் குறிப்பிடவில்லை.
    reason: cultural_note
lexical_decisions:
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரத்தின் நுழைவாயில்
  rationale: פֶּתַח என்பது ‘நுழைவாயில்’; אֹהֶל מוֹעֵד என்பது தேவன் தம் மக்களைச் சந்திக்கும் பரிசுத்த கூடாரத்திற்கான நிலையான பெயர். ‘சந்திப்புக் கூடாரம்’ நவீனத் தமிழில் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: הֱבִיאוֹ
  choice: அதைக் கொண்டுவந்து
  rationale: ஹிஃபில் வடிவிலுள்ள בוא என்பதற்கு ‘கொண்டுவருதல்’ என்று பொருள்; ‘அது’ முந்தைய வசனத்தில் கொல்லப்பட்ட விலங்கைக் குறிக்கிறது.
- source_word: לְהַקְרִיב קָרְבָּן
  choice: காணிக்கையாகச் செலுத்த
  rationale: הקריב என்பது பலியிடும் சூழலில் அணுகக் கொண்டுவருதல் அல்லது சமர்ப்பித்தல்; קָרְבָּן என்பது காணிக்கை. இயல்பான தமிழில் இரண்டின் பலியிடும் கருத்தையும் இச்சொற்றொடர் தருகிறது.
- source_word: לַיהוָה / יְהוָה
  choice: யெகோவாவுக்கு / யெகோவாவின்
  rationale: தெய்வீகப் பெயரான יהוה மொழிபெயர்க்கப்படாமல், தமிழில் பரவலாக அறியப்படும் ‘யெகோவா’ என ஒலிபெயர்க்கப்படுகிறது.
- source_word: לִפְנֵי מִשְׁכַּן יְהוָה
  choice: யெகோவாவின் திருவாசஸ்தலத்தின் முன்பாக
  rationale: מִשְׁכָּן என்பது ‘வாசஸ்தலம்’ அல்லது ‘திருக்கூடாரம்’; பரிசுத்த இடத்தைக் குறிக்கும் இயல்பான, கண்ணியமான தமிழாக ‘திருவாசஸ்தலம்’ தேர்ந்தெடுக்கப்பட்டது. לִפְנֵי என்பதன் இடஞ்சார்ந்த பொருள் ‘முன்பாக’.
- source_word: דָּם יֵחָשֵׁב לָאִישׁ הַהוּא
  choice: அந்த மனிதனுக்கு இரத்தப்பழி சுமத்தப்படும்
  rationale: எபிரெயத்தில் சொற்பட ‘அந்த மனிதனுக்கு இரத்தம் கணக்கிடப்படும்.’ சட்டப் பொருளான இரத்தச்சிந்துதலுக்கான குற்றப்பொறுப்பைத் தமிழில் ‘இரத்தப்பழி சுமத்தப்படும்’ இயல்பாக வெளிப்படுத்துகிறது; சொற்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: דָּם שָׁפָךְ
  choice: அவன் இரத்தம் சிந்தியிருக்கிறான்
  rationale: இது இரத்தச்சிந்துதலைக் குறிக்கும் நேரடியான எபிரெய மரபுத்தொடர்; தமிழிலும் ‘இரத்தம் சிந்துதல்’ அதே சட்ட-அறநெறி வலிமையைத் தக்கவைக்கிறது.
- source_word: וְנִכְרַת ... מִקֶּרֶב עַמּוֹ
  choice: தன் மக்களின் நடுவிலிருந்து அகற்றப்பட வேண்டும்
  rationale: כרת என்ற நிஃபால் வடிவம் உடன்படிக்கைச் சட்டச் சூழலில் ஒரு சமூகத்திலிருந்து நீக்கப்படுவதைக் குறிக்கிறது. தண்டனையின் துல்லிய முறை இங்கு கூறப்படாததால் ‘அகற்றப்பட வேண்டும்’ அந்தத் தெளிவின்மையைத் தக்கவைக்கிறது.
theological_decisions:
- issue: דָּם יֵחָשֵׁב என்ற சட்ட மரபுத்தொடரின் பொருள்
  choice: இரத்தப்பழி சுமத்தப்படும்
  alternative: இரத்தம் கணக்கிடப்படும்
  rationale: அங்கீகரிக்கப்படாத கொலையால் ஏற்படும் இரத்தச்சிந்துதல் குற்றப்பொறுப்பை வசனம் அறிவிக்கிறது. ‘இரத்தப்பழி’ அந்தச் சட்டப் பொருளைத் தெளிவாக்குகிறது; அதற்கடுத்த ‘அவன் இரத்தம் சிந்தியிருக்கிறான்’ என்ற கூற்று இதை உறுதிப்படுத்துகிறது. சொற்படியான வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: וְנִכְרַת எனும் தண்டனையின் தன்மை
  choice: அகற்றப்பட வேண்டும்
  alternative: கொல்லப்பட வேண்டும் / சமூகத்திலிருந்து விலக்கப்பட வேண்டும்
  rationale: இந்த வசனம் அகற்றப்படுதல் மரணதண்டனையா, வெளியேற்றமா, வேறொரு உடன்படிக்கைத் தண்டனையா என்பதைத் தீர்மானிக்கவில்லை. ஆகவே எந்த ஒரு குறிப்பிட்ட முறையையும் மொழிபெயர்ப்பு திணிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டக் கூற்றுக்குரிய கண்ணியமான நடை பயன்படுத்தப்பட்டது. முந்தைய வசனோடு தொடரும் வாக்கிய அமைப்பு காக்கப்பட்டுள்ளது. ‘இரத்தப்பழி’ இயல்பான சட்ட-அறநெறிச் சொல்; ‘அகற்றப்பட வேண்டும்’ மூலத்தின் திட்டமிட்ட தெளிவின்மையைப் பாதுகாக்கிறது.
