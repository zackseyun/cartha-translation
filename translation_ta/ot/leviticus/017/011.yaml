  text: כִּ֣י נֶ֣פֶשׁ הַ/בָּשָׂר֮ בַּ/דָּ֣ם הִוא֒ וַ/אֲנִ֞י נְתַתִּ֤י/ו לָ/כֶם֙ עַל הַ/מִּזְבֵּ֔חַ לְ/כַפֵּ֖ר עַל נַפְשֹׁתֵי/כֶ֑ם כִּֽי הַ/דָּ֥ם ה֖וּא בַּ/נֶּ֥פֶשׁ יְכַפֵּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/011.yaml
  text: For the life of the flesh is in the blood[a], and I have given it to you on the altar to make atonement for your lives[b], for it is the blood that makes atonement by the life.
translation:
  language: ta
  text: ஏனெனில், மாம்சத்தின் உயிர் இரத்தத்தில் இருக்கிறது; உங்கள் உயிர்களுக்காகப் பாவநிவிர்த்தி செய்யும்படி அதை பலிபீடத்தின்மேல் உங்களுக்குக் கொடுத்திருக்கிறேன். ஏனெனில், உயிரினால் பாவநிவிர்த்தி செய்வது இரத்தமே.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இரத்தம் அதிலுள்ள உயிரின் வாயிலாகப் பாவநிவிர்த்தி செய்கிறது.”
    reason: alternative_reading
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: உயிர்
  rationale: இச்சூழலில் நெஃபெஷ் என்பது உடலிலிருந்து பிரிந்த ஓர் ஆன்மாவைக் குறிப்பதல்ல; இரத்தத்துடன் தொடர்புடைய உயிரையே குறிக்கிறது. வசனத்தில் வரும் எல்லா இடங்களிலும் ‘உயிர்’ என்பது பலியின் தர்க்கத்தையும் சொல்லிணைப்பையும் காக்கிறது.
- source_word: הַבָּשָׂר
  choice: மாம்சம்
  rationale: பாசார் என்பதற்கான நேரடியான, வழக்கமான வேதாகமத் தமிழ் இணை இது; இங்கு உயிருள்ள படைப்பின் மாம்சத்தைக் குறிக்கிறது.
- source_word: בַּדָּם
  choice: இரத்தத்தில்
  rationale: ב முன்னொட்டு இடத்தையோ தளத்தையோ சுட்டுவதால், ‘இரத்தத்தில்’ என்பது எபிரெயச் சொற்றொடரின் இயல்பான பொருளைத் தருகிறது.
- source_word: נְתַתִּיו לָכֶם
  choice: அதை ... உங்களுக்குக் கொடுத்திருக்கிறேன்
  rationale: எபிரெய நிறைவுவினையின் தற்போதைய பொருத்தத்தை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; ‘அதை’ என்பது இரத்தத்தைக் குறிக்கிறது.
- source_word: עַל הַמִּזְבֵּחַ
  choice: பலிபீடத்தின்மேல்
  rationale: பலியிடுதல் சார்ந்த இடத்தையும் עַל என்பதன் ‘மேல்’ என்ற உறவையும் தெளிவாகக் காக்கிறது.
- source_word: לְכַפֵּר / יְכַפֵּר
  choice: பாவநிவிர்த்தி செய்ய / பாவநிவிர்த்தி செய்வது
  rationale: லேவியராகமப் பலிச்சூழலில் כפר என்பதன் வழிபாட்டுச் சார்ந்த நிவிர்த்திப் பொருளைத் தெரிவிக்கிறது; பாவநிவிர்த்தி எவ்வாறு நிகழ்கிறது என்ற குறிப்பிட்ட கோட்பாட்டைத் திணிக்கவில்லை.
- source_word: עַל נַפְשֹׁתֵיכֶם
  choice: உங்கள் உயிர்களுக்காக
  rationale: עַל என்பதன் பயன்நோக்குப் பொருளையும் נֶפֶשׁ என்பதன் ‘உயிர்’ என்ற பொருளையும் காக்கிறது.
- source_word: בַּנֶּפֶשׁ
  choice: உயிரினால்
  rationale: சுருக்கமான, பொருள் விவாதத்திற்குரிய இச்சொற்றொடரில் ב கருவிப்பொருளில் எடுத்துக்கொள்ளப்படுகிறது. இரத்தம் அதனுடன் இணைந்த உயிரின் வாயிலாகப் பாவநிவிர்த்தி செய்கிறது என்ற தொடர்பை, அளவுக்கு மீறி விளக்காமல் காக்கிறது.
theological_decisions:
- issue: பலிச்சட்டச் சூழலில் נֶפֶשׁ என்பதன் பொருள்
  choice: வசனம் முழுவதும் ‘உயிர்’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ஆத்துமா; தன்னுயிர்; நபர்
  rationale: இரத்தத்தின் பலிசார் செயல்திறனை அதனோடு தொடர்புடைய உயிரில் வசனம் நிலைநிறுத்துகிறது. ‘ஆத்துமா’ என்பது எபிரெய உரை கட்டாயப்படுத்தாத உடல்–ஆத்துமா இருமையை உணர்த்தக்கூடும்.
- issue: இறுதிக் கூறிலுள்ள בַּנֶּפֶשׁ என்பதன் இலக்கண வலிமை
  choice: ‘உயிரினால்’ என்று கருவிப்பொருளில், சற்றே குறியிடப்பட்ட சொற்றொடராக வைக்கப்பட்டது.
  alternative: உயிரின் காரணமாக; உயிரில்; அதிலுள்ள உயிரின் வாயிலாக
  rationale: எபிரெயம் சுருக்கமாகவும் பொருள் விவாதத்திற்குரியதாகவும் உள்ளது. இரத்தத்துக்கும் உயிருக்கும் இடையிலான பலிசார் தொடர்பைத் தீர்மானமாக மிகைவிளக்கம் செய்யாமல் முதன்மை உரை காக்கிறது; விரிவான மாற்றுப் புரிதல் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; சாதாரண வாசகர்களுக்குப் புரியுமாறு இயல்பாகவும், பலிச்சட்டச் சூழலுக்கேற்ற கண்ணியமான நடையிலும் அமைக்கப்பட்டது. ‘மாம்சம்’, ‘பலிபீடம்’, ‘பாவநிவிர்த்தி’ ஆகியவை துல்லியமான வழிபாட்டுச் சொற்களாகத் தக்கவைக்கப்பட்டன. அடிக்குறிப்பு குறியீடு [a] முதன்மை உரையில் இடம்பெற்றுள்ளது.
