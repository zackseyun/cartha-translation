  source_fidelity: மூல எபிரெய உரையின் சொல்லிணைப்பும் கருத்தோட்டமும் துல்லியமாகக் காக்கப்பட்டுள்ளன. נֶפֶשׁ மூன்று இடங்களிலும் சூழலுக்கேற்றவாறு ‘உயிர்’ என மொழிபெயர்க்கப்பட்டுள்ளது. இறுதிக் கூறிலுள்ள விவாதத்திற்குரிய בַּנֶּפֶשׁ, ‘உயிரினால்’ எனக் குறியிடப்பட்ட, கருவிப்பொருள் சார்ந்த நடையில் தரப்பட்டுள்ளது; அதன் மாற்றுப் புரிதலை அடிக்குறிப்பு உரியவாறு வழங்குகிறது.
  naturalness: நடை நவீனத் தரத் தமிழிலும் வேதாகமச் சட்டப்பகுதிக்கேற்ற கண்ணியமான பதிவிலும் உள்ளது. ‘மாம்சம்,’ ‘பலிபீடம்,’ ‘பாவநிவிர்த்தி’ ஆகியவை இச்சூழலில் நிலைபெற்ற, இயல்பான சொற்கள். இறுதியில் ‘பாவநிவிர்த்தி செய்வது இரத்தமே’ என்ற வலியுறுத்தல் எபிரெயத்தின் ஹூ’ (הוּא) வலிமையை நன்றாக வெளிப்படுத்துகிறது.
  terminology: பலிச்சடங்கு சார்ந்த כפר இரு இடங்களிலும் ஒரேவகையில் ‘பாவநிவிர்த்தி’ என மொழிபெயர்க்கப்பட்டுள்ளது. ‘உயிர்’ என்பதன் தொடர்ச்சியான பயன்பாடு, பின்னாளைய உடல்–ஆத்துமா இருமையை உரையில் திணிக்காமல், இரத்தம் மற்றும் உயிர் பற்றிய வசனத்தின் தொடர்பைத் தக்கவைக்கிறது.
