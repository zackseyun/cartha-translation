base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/007.yaml
  text: They shall no longer sacrifice their sacrifices to the goat-demons, after which they prostitute themselves. This shall be a permanent statute for them throughout their generations.
translation:
  language: ta
  text: அவர்கள் இனி தங்கள் பலிகளை வெள்ளாட்டுப் பேய்களுக்குப்[a] பலியிடக் கூடாது; அவற்றைப் பின்பற்றி அவர்கள் வேசித்தனம் செய்கிறார்கள்.[b] இது தலைமுறைதோறும் அவர்களுக்கு நிலையான நியமமாக[c] இருக்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வெள்ளாட்டு உருவச் சிலைகளுக்கு’ அல்லது ‘வெள்ளாட்டைப் போன்ற அமானுஷ்ய உயிரிகளுக்கு’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் சொற்பொருளில் வெள்ளாடுகள் அல்லது மயிருள்ளவற்றைக் குறிக்கும்; இவ்வழிபாட்டுச் சூழலில் அது வெள்ளாட்டுத் தோற்றமுள்ள அமானுஷ்ய உயிரிகளையோ, அவற்றோடு தொடர்புடைய வழிபாட்டுப் பொருள்களையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், ‘அவற்றின் பின்னால் வேசித்தனம் செய்கிறார்கள்.’ இது கடவுளுக்கு உண்மையற்றுப் பிற வழிபாடுகளை நாடுவதைச் சுட்டும் உருவகம்.
    reason: cultural_note
  - marker: c
    text: ‘என்றென்றைக்குமான நியமம்’ அல்லது ‘நிரந்தர நியமம்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִזְבְּחוּ
  choice: பலியிடக் கூடாது
  rationale: சட்ட மொழியில் மறுப்புடன் வரும் எபிரெய வினை இங்கு தடையைத் தெரிவிக்கிறது. அடுத்துள்ள அதே வேர்ச்சொல்லான ‘பலிகள்’ என்பதுடன் உள்ள சொல்லிணைப்பையும் இது காக்கிறது.
- source_word: עוֹד
  choice: இனி
  rationale: முன்பு அல்லது தொடர்ந்து நடந்துவந்த செயல் இனிமேல் நடைபெறக் கூடாது என்ற பொருளை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: זִבְחֵיהֶם
  choice: தங்கள் பலிகளை
  rationale: வழிபாட்டுக்குரிய பலிகளைக் குறிக்கும் நேரடியான மொழிபெயர்ப்பு; வினையுடன் எபிரெயத்தில் உள்ள மறுபடியுரைத்தலையும் காக்கிறது.
- source_word: לַשְּׂעִירִם
  choice: வெள்ளாட்டுப் பேய்களுக்கு
  rationale: சொல் நேரடியாக ‘மயிருள்ளவை/வெள்ளாடுகள்’ எனக் குறிக்கக்கூடியதாயினும், இவ்வழிபாட்டுச் சூழலில் வெள்ளாட்டுடன் தொடர்புடைய அமானுஷ்ய வழிபாட்டுப் பொருட்களைக் குறிக்கிறது. ‘வெள்ளாட்டுப் பேய்கள்’ என்பது கிரேக்க-ரோமப் புராணக் கருத்தை இறக்குமதி செய்யாமல் சாத்தியமான பொருளைத் தெளிவாக்குகிறது.
- source_word: זֹנִים אַחֲרֵיהֶם
  choice: அவற்றைப் பின்பற்றி அவர்கள் வேசித்தனம் செய்கிறார்கள்
  rationale: தவறான வழிபாட்டை பாலியல் துரோக உருவகத்தால் கூறும் எபிரெய மொழியின் வலிமையைத் தணிக்காமல் காக்கிறது. தமிழில் ‘அவற்றைப் பின்பற்றி’ என்பது אַחֲרֵיהֶם என்பதன் வழிபாட்டுப் பற்றுதலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: חֻקַּת עוֹלָם
  choice: நிலையான நியமம்
  rationale: உடன்படிக்கைச் சட்டச் சூழலில் தொடர்ந்து செல்லுபடியாகும் விதியை நவீன, dignified தமிழில் தெரிவிக்கிறது; கால அளவைத் தேவையின்றி மிகைப்படுத்துவதில்லை.
- source_word: לְדֹרֹתָם
  choice: தலைமுறைதோறும்
  rationale: அடுத்தடுத்த தலைமுறைகளிலும் தொடரும் பொருந்துதலைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: שְּׂעִירִם என்பதன் வழிபாட்டுச் சூழலிலான குறிப்பு
  choice: வெள்ளாட்டுப் பேய்கள்
  alternative: வெள்ளாடுகள்; வெள்ளாட்டு உருவச் சிலைகள்; சாட்டிர்கள்
  rationale: தவறான பலிவழிபாடும் அதைத் தொடரும் வேசித்தன உருவகமும் சாதாரண வெள்ளாடுகளைவிட அமானுஷ்ய அல்லது விக்கிரக வழிபாட்டுச் சார்ந்த குறிப்பை ஆதரிக்கின்றன. இருப்பினும் சொல்லின் மாற்றுச் சாத்தியங்கள் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளன.
- issue: זֹנִים என்பதிலுள்ள சமயத் துரோக உருவகம்
  choice: வேசித்தனம் செய்கிறார்கள் என்ற வெளிப்படையான உருவகத்தைத் தக்கவைத்தல்
  alternative: உண்மையற்றவர்களாகிறார்கள்; விக்கிரக வழிபாடு செய்கிறார்கள்
  rationale: எபிரெயம் பாலியல் ஒழுக்கக்கேட்டின் மொழியால் வழிபாட்டுத் துரோகத்தைக் கூறுகிறது. அதை வெறும் விளக்கக் கருத்தாக மாற்றாமல் மூலத்தின் இறையியல் பதற்றத்தையும் கடுமையையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சட்டத்திற்குரிய கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. ‘பலிகளை … பலியிட’ என்ற மீளுரைத்தல் எபிரெய மூலத்தின் சொல் தொடர்பைக் காக்கிறது. ‘வேசித்தனம்’ என்ற கடுமையான உருவகம் மென்மையாக்கப்படாமல் வைக்கப்பட்டுள்ளது; அதன் சமயப் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
