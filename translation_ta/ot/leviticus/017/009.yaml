source:
  edition: WLC
  text: וְ/אֶל פֶּ֜תַח אֹ֤הֶל מוֹעֵד֙ לֹ֣א יְבִיאֶ֔/נּוּ לַ/עֲשׂ֥וֹת אֹת֖/וֹ לַ/יהוָ֑ה וְ/נִכְרַ֛ת הָ/אִ֥ישׁ הַ/ה֖וּא מֵ/עַמָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/009.yaml
  text: and does not bring it to the entrance of the tent of meeting to offer it to Yahweh[b][a], that man shall be cut off from his people.
translation:
  language: ta
  text: அதை யாவேக்குப் பலியாகச் செலுத்துவதற்காக[a] சந்திப்புக் கூடாரத்தின் நுழைவாயிலுக்குக் கொண்டுவராவிட்டால், அந்த மனிதன் தன் மக்களிடமிருந்து அகற்றப்படுவான்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொல்லுக்குச் சொல் மொழிபெயர்த்தால், “அதை யாவேக்காகச் செய்வதற்கு.” இங்கு இந்த எபிரெய மரபுத்தொடர் பலியைச் செலுத்துவதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “அகற்றப்படுவான்” என்பது எபிரெயச் சட்ட வாய்ப்பாட்டை மொழிபெயர்க்கிறது. இங்கு தண்டனை துல்லியமாகக் குறிப்பிடப்படவில்லை; அது உடன்படிக்கைச் சமூகத்திலிருந்து அகற்றப்படுவதையோ, கடவுளின் நேரடித் தீர்ப்பையோ குறிக்கக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: פֶּתַח
  choice: நுழைவிடம்
  rationale: கூடாரத்துக்குள் செல்லும் திறப்பையோ நுழையும் இடத்தையோ குறிக்கிறது; ஆலயச் சூழலில் இயல்பான நவீனத் தமிழ் சொல்.
- source_word: אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரம்
  rationale: வனாந்தரப் பரிசுத்த இடத்துக்கான நிலையான பெயரைத் தெளிவாகவும் மூலத்தின் கூறுகளைப் பேணியும் தருகிறது.
- source_word: יְבִיאֶנּוּ
  choice: அதைக் கொண்டுவராவிட்டால்
  rationale: பின்னொட்டு முந்தைய சூழலில் குறிப்பிடப்பட்ட பலிக்குரிய விலங்கைக் குறிக்கிறது; செயலை நேரடியாகப் பேணுகிறது.
- source_word: לַעֲשׂוֹת אֹתוֹ לַיהוָה
  choice: அதை யாவேக்குப் பலியாகச் செலுத்துவதற்காக
  rationale: சொல்லுக்குச் சொல் பொருள் ‘அதை யாவேக்காகச் செய்ய’ என்பதாக இருந்தாலும், இப்பலிச் சூழலில் பலியைச் செலுத்துவதைக் குறிக்கும் எபிரெய மரபுத்தொடர்; ‘பலியாகச் செலுத்த’ என்பது தமிழில் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகத் தனிப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், எபிரெய நான்கெழுத்துப் பெயரின் பரவலான தமிழ் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: וְנִכְרַת
  choice: துண்டிக்கப்படுவான்
  rationale: சட்ட மொழியில் உள்ள ‘துண்டிக்கப்படுதல்’ என்ற உருவகத்தைப் பேணுகிறது; தண்டனை மரணமா, சமூக விலக்கா, அல்லது நேரடியான தெய்வீகத் தீர்ப்பா என்பதைத் தேவையின்றி முடிவுசெய்யவில்லை.
- source_word: הָאִישׁ הַהוּא
  choice: அந்த மனிதன்
  rationale: எபிரெயின் ஆண்பால் ஒருமைச் சட்டச் சொல்லாட்சியைத் துல்லியமாகப் பேணுகிறது.
- source_word: מֵעַמָּיו
  choice: தன் மக்களிடமிருந்து
  rationale: குற்றம் செய்தவன் தனது மக்களாகிய சமூகத்திலிருந்து பிரிக்கப்படுவதைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: ‘துண்டிக்கப்படுவான்’ என்ற தண்டனையின் பொருள்
  choice: தண்டனையின் முறையைக் குறிப்பாக்காமல் ‘தன் மக்களிடமிருந்து துண்டிக்கப்படுவான்’ என்ற சட்ட உருவகத்தைப் பேணுதல்
  alternative: கொல்லப்படுவான்; சமூகத்திலிருந்து விலக்கப்படுவான்; அழிக்கப்படுவான்
  rationale: இங்கு எபிரெயச் சட்ட வாய்ப்பாடு தண்டனை எவ்வாறு நிறைவேறும் என்பதைத் திட்டவட்டமாகக் கூறவில்லை. உருவகத்தைப் பேணுவது உரையின் சட்ட மற்றும் இறையியல் தெளிவின்மையை மதிக்கிறது.
- issue: הָאִישׁ என்பதன் பாலினக் குறிப்பு
  choice: அந்த மனிதன்
  alternative: அந்த நபர்; அப்படிச் செய்கிறவர்
  rationale: மூல உரை ஆண்பால் ஒருமையைப் பயன்படுத்துவதால், அதை பாலினப் பொதுமைப்படுத்தல் இன்றிப் பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், இயல்பான ஆனால் மதிப்பும் சட்டத் தீவிரமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. பலிச் செயலைத் தெளிவாக்கும் வகையில் பொருள் சார்ந்த மொழிபெயர்ப்பு தரப்பட்டாலும், தண்டனைக்கான எபிரெய உருவகம் திட்டமிட்டு பாதுகாக்கப்பட்டுள்ளது.
