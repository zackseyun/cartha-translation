revisions:
- from: ஏனெனில், ஒவ்வோர் உயிரினத்தின் உயிரும் அதன் இரத்தமே; அந்த இரத்தம் அதன் உயிரோடு உள்ளது[a]. ஆகவே நான் இஸ்ரவேல் மக்களிடம்[b], ‘நீங்கள் எந்த உயிரினத்தின் இரத்தத்தையும் உண்ணக் கூடாது; ஏனெனில், ஒவ்வோர் உயிரினத்தின் உயிரும் அதன் இரத்தமே’ என்று சொன்னேன். அதை உண்கிற ஒவ்வொருவரும் அறுத்தகற்றப்படுவார்[c].
  to: ஏனெனில், ஒவ்வோர் உயிரினத்தின் உயிரும் அதன் இரத்தமே; அதன் இரத்தம் அதன் உயிரில் உள்ளது[a]. ஆகவே நான் இஸ்ரவேல் மக்களிடம்[b], ‘நீங்கள் எந்த உயிரினத்தின் இரத்தத்தையும் உண்ணக் கூடாது; ஏனெனில், ஒவ்வோர் உயிரினத்தின் உயிரும் அதன் இரத்தமே’ என்று சொன்னேன். அதை உண்கிற ஒவ்வொருவரும் அறுத்து அகற்றப்படுவார்[c].
  rationale: The revision changes the first clause’s second assertion from ‘with its life’ to ‘in its life,’ more closely reflecting בְּנַפְשׁוֹ while retaining the source’s compressed life–blood formulation. It also makes the final sanction idiom more readable in modern Tamil without specifying whether it entails death, exclusion, or another form of judgment. Footnote a now appropriately presents ‘உயிரோடு’ as an alternative rather than as the primary rendering.
