  text: כִּֽי נֶ֣פֶשׁ כָּל בָּשָׂ֗ר דָּמ֣/וֹ בְ/נַפְשׁ/וֹ֮ הוּא֒ וָֽ/אֹמַר֙ לִ/בְנֵ֣י יִשְׂרָאֵ֔ל דַּ֥ם כָּל בָּשָׂ֖ר לֹ֣א תֹאכֵ֑לוּ כִּ֣י נֶ֤פֶשׁ כָּל בָּשָׂר֙ דָּמ֣/וֹ הִ֔וא כָּל אֹכְלָ֖י/ו יִכָּרֵֽת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/014.yaml
  text: For the life of all flesh is its blood[a]; in its life it is. So I said to the sons of Israel, ‘You shall not eat the blood of any flesh[b], for the life of all flesh is its blood.’ Everyone who eats it shall be cut off.
translation:
  language: ta
  text: ஏனெனில், ஒவ்வோர் உயிரினத்தின் உயிரும் அதன் இரத்தமே; அதன் இரத்தம் அதன் உயிரில் உள்ளது[a]. ஆகவே நான் இஸ்ரவேல் மக்களிடம்[b], ‘நீங்கள் எந்த உயிரினத்தின் இரத்தத்தையும் உண்ணக் கூடாது; ஏனெனில், ஒவ்வோர் உயிரினத்தின் உயிரும் அதன் இரத்தமே’ என்று சொன்னேன். அதை உண்கிற ஒவ்வொருவரும் அறுத்து அகற்றப்படுவார்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய வாசகம் சுருக்கமானதும் பலவாறு புரிந்துகொள்ளக்கூடியதுமாக உள்ளது. இதை ‘அதன் இரத்தம் அதன் உயிரோடு உள்ளது’ அல்லது கருத்தைச் சற்றுத் தெளிவாக்கி ‘அதன் இரத்தமே அதன் உயிர்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெய மொழியில், ‘இஸ்ரவேலின் மகன்களிடம்’; அதாவது, இஸ்ரவேல் மக்களிடம்.
    reason: lexical_alternative
  - marker: c
    text: ‘அறுத்து அகற்றப்படுவார்’ என்பது எபிரெய உடன்படிக்கைத் தண்டனை மரபுத்தொடர். அது எவ்வாறு நிறைவேற்றப்படும் என்பதை இவ்வசனம் குறிப்பாகத் தீர்மானிக்கவில்லை.
    reason: theological_ambiguity
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: உயிர்
  rationale: இந்த உணவு மற்றும் பலியிடுதல் சார்ந்த சூழலில், இச்சொல் உடலற்ற ‘ஆன்மா’ என்பதைக் காட்டிலும் உயிரினத்தை உயிரோடிருக்கச் செய்யும் உயிரைக் குறிக்கிறது.
- source_word: בָּשָׂר
  choice: உயிரினம்
  rationale: ‘மாம்சம்’ என்பது வடிவ ஒற்றுமையைத் தந்தாலும், இவ்விடத்தில் இரத்தமுள்ள உயிருள்ள படைப்பைக் குறிக்கும் எபிரெயக் கூட்டுச் சொல்லை நவீன தமிழில் ‘உயிரினம்’ இயல்பாகத் தெரிவிக்கிறது.
- source_word: דָּם / דָּמוֹ
  choice: இரத்தம் / அதன் இரத்தம்
  rationale: வசனத்தின் காரணவாதத்துக்கும் தடைக்கும் மையமான சொல்லை நேரடியாக மொழிபெயர்க்கிறது.
- source_word: בְנַפְשׁוֹ
  choice: அதன் உயிரோடு
  rationale: בְ முன்னிடைச்சொல்லின் சுருக்கமான, தெளிவற்ற உறவை முழுமையாகத் தீர்மானிக்காமல், இரத்தமும் உயிரும் பிரிக்க முடியாத தொடர்பில் இருப்பதைத் தெரிவிக்கிறது.
- source_word: וָאֹמַר
  choice: ஆகவே நான் ... சொன்னேன்
  rationale: முன் கூறிய உயிர்–இரத்தத் தொடர்பிலிருந்து கட்டளைக்குச் செல்லும் காரணத் தொடர்ச்சியை வெளிப்படுத்துகிறது.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்களிடம்
  rationale: எபிரெய மொழியின் சொற்பொருள் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு முழு இஸ்ரவேல் சமூகத்தையும் குறிக்கும் வழக்குச் சொற்றொடரை நவீன தமிழில் இயல்பாக வழங்குகிறது; நேரடி வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לֹא תֹאכֵלוּ
  choice: உண்ணக் கூடாது
  rationale: உடன்படிக்கைச் சட்டத்தில் வரும் நேரடித் தடையை இயல்பான, உறுதியான தமிழில் தெரிவிக்கிறது.
- source_word: אֹכְלָיו
  choice: அதை உண்கிற ஒவ்வொருவரும்
  rationale: எவராயினும் இரத்தத்தை உண்பவரைத் தனித்தனியாக உள்ளடக்கும் எபிரெயப் பங்கேற்புவினையின் பகிர்வுப் பொருளை வெளிப்படுத்துகிறது.
- source_word: יִכָּרֵת
  choice: அறுத்தகற்றப்படுவார்
  rationale: மரணம், சமூக விலக்கு, அல்லது இறைத் தீர்ப்பு ஆகியவற்றில் ஒன்றாக மட்டும் பொருளைக் குறுக்காமல், எபிரெய உடன்படிக்கைத் தண்டனை மரபுத்தொடரின் உருவகத்தையும் தீவிரத்தையும் காக்கிறது.
theological_decisions:
- issue: இரத்தத்துக்கும் נֶפֶשׁ என்பதற்கும் உள்ள உறவு
  choice: נֶפֶשׁ என்பது ‘உயிர்’ என்று மொழிபெயர்க்கப்பட்டு, உயிரினத்தின் உயிரும் இரத்தமும் நெருங்கிய தொடர்புடையவை என உரை வழங்கப்படுகிறது.
  alternative: நֶפֶשׁ என்பதை உடலற்ற பொருளில் ‘ஆன்மா’ என மொழிபெயர்த்தல்.
  rationale: இந்த வசனம் இரத்தத்தைத் தடைசெய்வதற்கான அடிப்படையாக உயிர்–இரத்தத் தொடர்பைக் கூறுகிறது; பின்னாளைய மானிடவியல் கோட்பாட்டை இதில் புகுத்தவில்லை.
- issue: יִכָּרֵת என்ற தண்டனையின் துல்லியமான நடைமுறை
  choice: ‘அறுத்தகற்றப்படுவார்’ என்ற எபிரெய உருவகத்திற்கு நெருக்கமான மொழி பயன்படுத்தப்படுகிறது.
  alternative: ‘கொல்லப்படுவார்’ அல்லது ‘சமூகத்திலிருந்து விலக்கப்படுவார்’ என்று குறிப்பாக விளக்குதல்.
  rationale: இச்சொற்றொடர் பல சூழல்களில் மரணம், சமூக விலக்கு, அல்லது இறைத் தீர்ப்பு குறித்த விவாதத்திற்குரியது; இவ்வசனம் கூறுவதைவிட மொழிபெயர்ப்பு அதிகமாகத் தீர்மானிக்கக் கூடாது.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் வாசிக்கும்படி ‘எல்லா மாம்சம்’ என்பதற்குப் பதிலாக ‘ஒவ்வோர் உயிரினம்’ பயன்படுத்தப்பட்டது. சட்டத் தடைக்கு ‘உண்ணக் கூடாது’ என்ற தெளிவான நடை தேர்ந்தெடுக்கப்பட்டது. முதல் வாக்கியத்தின் எபிரெயச் சுருக்கமும் மீளுரையும் முற்றிலும் சீராக்கப்படாமல், முதன்மை உரையிலும் அடிக்குறிப்பிலும் உயிர்–இரத்தத் தொடர்பின் உண்மையான தெளிவின்மை பாதுகாக்கப்பட்டுள்ளது.
