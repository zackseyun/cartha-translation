  yaml_path: translation/ot/leviticus/017/003.yaml
  text: Any man from the house of Israel who slaughters an ox or a sheep or a goat in the camp[a], or who slaughters it outside the camp—
translation:
  language: ta
  text: இஸ்ரவேல் வீட்டாரைச் சேர்ந்த எவராவது[a] முகாமுக்குள் ஒரு மாட்டையோ, செம்மறியாட்டையோ, வெள்ளாட்டையோ அறுத்தால், அல்லது அதை முகாமுக்கு வெளியே அறுத்தால்—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “மனிதன், மனிதன்” என்று உள்ளது. இவ்வாறு இருமுறை வரும் சொல் பகிர்வுப் பொருளில் அமைந்து, இஸ்ரவேல் சமூகத்தைச் சேர்ந்த எவரையும் பொதுவாகக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אִישׁ
  choice: எவராவது
  rationale: இரட்டிக்கப்பட்ட பெயர்ச்சொல் பகிர்வுப் பொருளில் ‘யாராயிருந்தாலும்’ என்பதைக் குறிக்கிறது. எபிரெயச் சொற்றொடர் இலக்கண ரீதியாக ஆண்பாலில் இருந்தாலும், இங்கு இஸ்ரவேல் சமூகத்தின் எந்த உறுப்பினரையும் பொதுவாகக் குறிக்கிறது; ‘எவராவது’ என்பது அந்தப் பொதுப்பொருளை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: מִבֵּית יִשְׂרָאֵל
  choice: இஸ்ரவேல் வீட்டாரைச் சேர்ந்த
  rationale: ‘இஸ்ரவேலின் வீடு’ என்ற உடன்படிக்கைச் சமூகத்தைச் சுட்டும் மரபுத்தொடரை ‘வீட்டார்’ என்பதன் மூலம் காத்து, தமிழில் இயல்பாக அமைக்கிறது.
- source_word: יִשְׁחַט
  choice: அறுத்தால்
  rationale: שָׁחַט என்பது விலங்கைக் கொல்லுதல், குறிப்பாகப் பலிக்காக அல்லது உணவுக்காக அறுத்தல் என்பதைக் குறிக்கிறது. ‘அறுத்தல்’ தமிழில் இந்தச் சூழலுக்குரிய துல்லியமான, இயல்பான வினைச்சொல்.
- source_word: שׁוֹר
  choice: மாடு
  rationale: இந்தச் சட்டப் பட்டியலில் இச்சொல் மாட்டினத்தைச் சேர்ந்த ஒரு விலங்கைக் குறிக்கிறது; ‘காளை’ என்று மொழிபெயர்ப்பது மூலத்தில் உறுதியாக இல்லாத ஆண்பால் குறிப்பைச் சேர்க்கக்கூடும்.
- source_word: כֶשֶׂב
  choice: செம்மறியாடு
  rationale: இச்சொல் குட்டியை மட்டும் அல்லாமல் செம்மறியாட்டை பொதுவாகக் குறிக்கலாம். தமிழில் வெள்ளாட்டிலிருந்து தெளிவாக வேறுபடுத்தும் வழக்கமான சொல் இது.
- source_word: עֵז
  choice: வெள்ளாடு
  rationale: பலியிடத்தக்க கால்நடைகளின் பட்டியலில் வரும் ஆட்டினத்திற்கான வழக்கமான தமிழ்ச் சொல்.
- source_word: בַּמַּחֲנֶה
  choice: முகாமுக்குள்
  rationale: முகாமின் எல்லைக்குள் நடைபெறும் செயலைத் தெளிவாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: முகாமுக்கு வெளியே
  rationale: முகாமின் எல்லைக்கு அப்பாலுள்ள இடத்தை நேரடியாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: אֲשֶׁר ... אֲשֶׁר
  choice: அறுத்தால், அல்லது ... அறுத்தால்
  rationale: மீண்டும் வரும் தொடர்புச் சொல்லின் இணையான சட்ட அமைப்பைத் தமிழில் இரு நிபந்தனைத் தொடர்களாகப் பாதுகாக்கிறது.
- source_word: '[implicit object after second יִשְׁחַט]'
  choice: அதை ... அறுத்தால்
  rationale: இரண்டாம் வினைக்குப் பின்னால் மூலத்தில் விடுபட்டுள்ள பொருள் முன் பட்டியலிடப்பட்ட விலங்கையே குறிக்கிறது; ‘அதை’ என்பது புதிய தகவல் சேர்க்காமல் தமிழில் தெளிவை வழங்குகிறது.
