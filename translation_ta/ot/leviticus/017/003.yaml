  source_fidelity: மூல எபிரெயத்தின் பகிர்வுத் தொடர் אִישׁ אִישׁ, ‘இஸ்ரவேல் வீட்டார்’ என்னும் சமூக/வம்சச் சொற்றொடர், மூன்று விலங்குகளின் பட்டியல், முகாமுக்குள்ளும் முகாமுக்கு வெளியேயும் அறுப்பதைக் குறிக்கும் இணை அமைப்பு ஆகியவை துல்லியமாகப் பிரதிபலிக்கப்படுகின்றன. இரண்டாம் இடத்தில் ‘அதை’ சேர்ப்பது மூலத்தில் மறைந்திருக்கும் பொருளை மட்டுமே தெளிவுபடுத்துகிறது; பொருளை மாற்றவில்லை. இறுதியிலுள்ள நீண்ட கோடு அடுத்த வசனத்தில் தொடரும் சட்டவாக்கியத்தைச் சரியாகக் காட்டுகிறது.
  naturalness: நவீனத் தரத் தமிழில் உரை தெளிவாகவும் சட்டநடைக்கேற்றவாறும் உள்ளது. ‘எவராவது,’ ‘முகாமுக்குள்,’ ‘முகாமுக்கு வெளியே,’ ‘அறுத்தால்’ ஆகியவை இயல்பான பயன்பாடுகள். விலங்குப் பட்டியலின் வேற்றுமை உருபுகளும் வாக்கிய ஓட்டமும் சரியாக உள்ளன.
  terminology: ‘இஸ்ரவேல் வீட்டாரைச் சேர்ந்த’ என்பது בֵּית יִשְׂרָאֵל என்பதன் மரபுத் தன்மையை இயல்பாகக் காக்கிறது. שָׁחַט என்பதற்கு ‘அறுத்தால்’ பொருத்தமானது. ‘மாடு,’ ‘செம்மறியாடு,’ ‘வெள்ளாடு’ என்பவை முறையே שׁוֹר, כֶשֶׂב, עֵז ஆகிய பொதுவான விலங்குக் குறிப்புகளுக்கு ஏற்றவை; மூலத்தில் இல்லாத வயது அல்லது பாலினக் குறிப்பைச் சேர்ப்பதில்லை. அடிக்குறிப்பு எபிரெய இரட்டிப்பின் பகிர்வுப் பொருளைத் துல்லியமாக விளக்குகிறது.
