source:
  edition: WLC
  text: וְ/אִם֙ לֹ֣א יְכַבֵּ֔ס וּ/בְשָׂר֖/וֹ לֹ֣א יִרְחָ֑ץ וְ/נָשָׂ֖א עֲוֺנֽ/וֹ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/016.yaml
  text: But if he does not wash his clothes and does not bathe his body[b][a], then he shall bear his guilt.
translation:
  language: ta
  text: ஆனால் அவன் தன் உடைகளைக் கழுவாமலும் தன் உடலைக் கழுவாமலும் இருந்தால், அவன் தன் குற்றத்தைச் சுமப்பான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தன் அக்கிரமத்தைச் சுமப்பான்,” அல்லது “தன் அக்கிரமத்திற்கான தண்டனையைச் சுமப்பான்.” இந்த எபிரெய சட்டவழக்கு குற்றப்பொறுப்பையும் அதன் விளைவையும் உள்ளடக்கக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִם
  choice: ஆனால் ... இருந்தால்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட தூய்மைப்படுத்தும் முறைக்கு மாறான நிலையை இந்த நிபந்தனை அறிமுகப்படுத்துவதால், சூழலில் உள்ள எதிர்மறைத் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יְכַבֵּס
  choice: தன் உடைகளைக் கழுவாமல்
  rationale: כּבס என்பதன் பியேல் வடிவம் பொதுவாக உடைகளைத் துவைப்பதைக் குறிக்கிறது. எபிரெய உரையில் செயப்படுபொருள் விடுபட்டிருந்தாலும், முந்தைய வசனமும் வழக்கமான சட்ட மொழிநடையும் உடைகளையே குறிக்கின்றன; தமிழில் ‘கழுவு’ இயல்பாக உள்ளது.
- source_word: וּבְשָׂרוֹ
  choice: தன் உடலை
  rationale: בשר என்பதன் சொற்பொருள் ‘சதை’ என்றாலும், சடங்குமுறை சார்ந்த கழுவுதலின் சூழலில் அது ஒருவரின் உடலைக் குறிக்கிறது.
- source_word: יִרְחָץ
  choice: குளிப்பாட்டாமல்
  rationale: רחץ இங்கு உடலை நீரால் கழுவுவதைக் குறிக்கிறது. ‘குளிப்பாட்டு’ என்பது உடைகளைக் கழுவும் முந்தைய செயலிலிருந்து இதைத் தெளிவாக வேறுபடுத்துகிறது.
- source_word: וְנָשָׂא
  choice: சுமப்பான்
  rationale: இங்கு வாவ் + வினை வடிவம் நிபந்தனையை நிறைவேற்றத் தவறுவதன் விளைவைக் காட்டுகிறது; தமிழ் நிபந்தனை அமைப்பில் ‘சுமப்பான்’ அந்த விளைவை இயல்பாகத் தெரிவிக்கிறது.
- source_word: עֲוֹנוֹ
  choice: தன் குற்றத்தை
  rationale: עון என்பது அக்கிரமம், குற்றப்பொறுப்பு அல்லது அதற்கான விளைவு ஆகியவற்றைக் குறிக்கக்கூடும். ‘குற்றத்தைச் சுமப்பான்’ என்ற சட்டவழக்கு இவ்விரிவைத் தேவையின்றி சுருக்காமல் பாதுகாக்கிறது.
theological_decisions:
- issue: ‘தன் עון-ஐச் சுமத்தல்’ என்ற எபிரெய சட்டவழக்கின் பொருள்
  choice: ‘தன் குற்றத்தைச் சுமப்பான்’ என்று மொழிபெயர்த்து, தண்டனையின் சரியான வடிவத்தைத் தனியாகக் குறிப்பிடவில்லை.
  alternative: ‘தன் அக்கிரமத்தைச் சுமப்பான்’ அல்லது ‘தன் குற்றத்திற்கான தண்டனையைச் சுமப்பான்.’
  rationale: இந்த எபிரெய சட்டவழக்கு குற்றப்பொறுப்பையும் அதன் விளைவையும் உள்ளடக்கக்கூடும். குற்றத்தை மட்டும் அல்லது தண்டனையை மட்டும் தீர்மானமாக்காமல் மூலத்தின் பொருள் இழுவையை மொழிபெயர்ப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிதில் புரியக்கூடியதாயும் சட்ட-சடங்கு சூழலுக்கேற்ற கண்ணியமான நடையாயும் அமைக்கப்பட்டுள்ளது. ‘உடல்’ என்பது சொற்பொருளான ‘சதை’ என்பதற்குப் பதிலாக இச்சூழலின் இயல்பான பொருளைத் தருகிறது; தனி அடிக்குறிப்பு தேவையில்லை.
