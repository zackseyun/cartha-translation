revisions:
- from: ஆனால் அவன் தன் உடைகளைக் கழுவாமலும், தன் உடலைக் குளிப்பாட்டாமலும் இருந்தால், அவன் தன் குற்றத்தைச் சுமப்பான்.[a]
  to: ஆனால் அவன் தன் உடைகளைக் கழுவாமலும் தன் உடலைக் கழுவாமலும் இருந்தால், அவன் தன் குற்றத்தைச் சுமப்பான்.[a]
  rationale: The only necessary revision corrects an unintended Tamil causative construction while retaining the source's two required washings and the ambiguity of the legal expression “bear his iniquity/guilt.”
