review_pass:
  verdict: revise
  source_fidelity: The conditional construction, the sacrificial terminology, and the continuation dash correctly reflect the Hebrew. However, ‘வேறொரு பலி’ adds the notion ‘another/different,’ which is not expressed by אוֹ זָבַח. The distributive force of אִישׁ אִישׁ is better represented by ‘எந்த ஆணும்’ in this conditional legal sentence.
  naturalness: ‘நீ அவர்களிடம் சொல்ல வேண்டும்’ is more direct and idiomatic modern standard Tamil than the nominal construction ‘நீ அவர்களிடம் சொல்ல வேண்டியது.’ The revised paired conditional subjects are also more grammatically balanced.
  terminology: ‘தகனபலி’ is an appropriate established rendering of עֹלָה. ‘அந்நியன்’ with the explanatory footnote adequately conveys גֵּר here, while avoiding anachronistic legal terminology. ‘பலி’ accurately renders זָבַח without importing the added distinction ‘another.’
  issues:
  - severity: medium
    issue: ‘வேறொரு பலி’ renders אוֹ זָבַח as ‘or another sacrifice.’
    rationale: The Hebrew coordinates ‘a burnt offering’ and ‘a sacrifice’; it does not explicitly qualify the second offering as ‘another’ or ‘different.’ The addition is unnecessary and may over-specify the contrast.
  - severity: low
    issue: The opening directive and distributive conditional wording are somewhat awkward in Tamil.
    rationale: ‘நீ அவர்களிடம் சொல்ல வேண்டும்’ and ‘எந்த ஆணும் ... அந்நியனும்’ provide a more natural legal-register construction while retaining the source’s masculine distributive expression.
