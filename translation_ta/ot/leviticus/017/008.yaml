base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/008.yaml
  text: 'And you shall say to them: Any man from the house of Israel[a], or from the sojourner who sojourns among them[b], who offers up a burnt offering or a sacrifice—'
translation:
  language: ta
  text: '“நீ அவர்களிடம் சொல்ல வேண்டும்: இஸ்ரவேல் வீட்டாரில் எந்த ஆணும்[a], அல்லது அவர்கள் நடுவில் குடியிருக்கும் அந்நியனும்[b], தகனபலியையோ அல்லது பலியையோ செலுத்தினால்—”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேய மொழியில் ‘ஆண், ஆண்’ என்று இருமுறை வரும் சொற்றொடர், ஒவ்வொரு தனிநபர் வழக்கையும் குறிக்கும் சட்ட மரபுத்தொடராகும்.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, இஸ்ரவேலரல்லாதவராக இருந்தும் அவர்கள் நடுவில் குடியிருப்பவர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲלֵהֶם תֹּאמַר
  choice: நீ அவர்களிடம் சொல்ல வேண்டியது
  rationale: இணைப்புச் சொல்லின் தொடர்ச்சியையும் மோசேக்கு வழங்கப்படும் கட்டளையின் வலிமையையும் இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: אִישׁ אִישׁ
  choice: எந்த ஆணாவது
  rationale: இருமுறை வரும் ஆண்பால் ஒருமைச் சொல் ஒவ்வொரு தனிநபர் வழக்கையும் குறிக்கும் எபிரேயச் சட்ட மரபுத்தொடர்; அதன் ஆண்பால் வடிவமும் பகிர்வுப் பொருளும் காக்கப்படுகின்றன.
- source_word: מִבֵּית יִשְׂרָאֵל
  choice: இஸ்ரவேல் வீட்டாரில்
  rationale: ‘இஸ்ரவேலின் வீடு’ என்ற உடன்படிக்கைச் சமூகக் கருத்தைத் தமிழில் இயல்பாக ‘இஸ்ரவேல் வீட்டார்’ எனக் காக்கிறது; מִן இன் ‘இல்/மத்தியில் இருந்து’ பொருளும் வெளிப்படுகிறது.
- source_word: וּמִן הַגֵּר אֲשֶׁר יָגוּר בְּתוֹכָם
  choice: அல்லது அவர்கள் நடுவில் குடியிருக்கும் அந்நியரில் எவனாவது
  rationale: גֵּר என்பது இஸ்ரவேலரிடையே வசிக்கும் இஸ்ரவேலரல்லாத குடியிருப்பாளரைக் குறிக்கிறது. ‘குடியிருக்கும் அந்நியர்’ என்பது பெயர்ச்சொல்லுக்கும் גּוּר வினைக்கும் உள்ள தொடர்பைத் தெளிவாக்குகிறது.
- source_word: אֲשֶׁר יַעֲלֶה
  choice: செலுத்தினால்
  rationale: பலியுடன் வரும் עלה என்பதன் ஹிஃபில் வடிவம் பலியாக அர்ப்பணிப்பதைக் குறிக்கிறது; தமிழ் நிபந்தனை அமைப்பு தொடங்கி அடுத்த வசனத்திற்குச் செல்லும் சட்ட வாக்கியத்தை இயல்பாகக் காக்கிறது.
- source_word: עֹלָה
  choice: தகனபலி
  rationale: முழுவதும் பலிபீடத்தில் எரிக்கப்படும் பலிவகைக்கான நிறுவப்பட்ட, சுருக்கமான தமிழ் வேதாகமச் சொல்.
- source_word: אוֹ זָבַח
  choice: அல்லது வேறொரு பலி
  rationale: זֶבַח இங்கு தகனபலியிலிருந்து வேறுபட்ட, அறுத்துச் செலுத்தப்படும் பலியைப் பொதுவாகக் குறிக்கிறது. தமிழில் ‘பலியையோ பலியையோ’ என்ற குழப்பத்தைத் தவிர்க்க ‘வேறொரு’ என்பது எதிர்மறையல்லாத வகைப்பாட்டு வேறுபாட்டை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: אִישׁ אִישׁ என்ற ஆண்பால் பகிர்வு மரபுத்தொடர்
  choice: எந்த ஆணாவது
  alternative: எவராவது / எந்த நபராவது
  rationale: மூலத்தின் இலக்கண ஆண்பாலையும், ஒவ்வொரு ஆணின் தனிப்பட்ட வழக்கையும் குறிக்கும் சட்டப் பயன்பாட்டையும் பிரதான உரையில் காக்கிறது; பொதுப்பாலாக அமைதியாக மாற்றவில்லை.
- issue: גֵּר என்பதன் சமூக-சட்ட வகை
  choice: குடியிருக்கும் அந்நியர்
  alternative: பரதேசி / அயல்நாட்டுக் குடியிருப்பாளர்
  rationale: இச்சொல் வெறுமனே அறிமுகமற்ற ஒருவரை அல்ல, இஸ்ரவேலரிடையே வசித்து அவர்களது வழிபாட்டுச் சட்டத்துக்குட்பட்ட இஸ்ரவேலரல்லாதவரைக் குறிக்கிறது. நவீன அரசியல் அல்லது குடியேற்றச் சட்டப் பிரிவுகளைத் திணிக்காமல் இந்த வேறுபாட்டைக் காட்டுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுமக்கள் புரிந்துகொள்ளும் கண்ணியமான சட்ட-வழிபாட்டு நடை பயன்படுத்தப்பட்டுள்ளது. வசனம் அடுத்த வசனத்தில் நிறைவடையும் நிபந்தனை வாக்கியம் என்பதால் இறுதியில் நீள்கோடு வைக்கப்பட்டுள்ளது. ‘தகனபலி’ போன்ற நிலைபெற்ற வழிபாட்டுச் சொல் காக்கப்பட்டாலும், அரிதான பழைய சொற்கள் தவிர்க்கப்பட்டுள்ளன.
