base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/012.yaml
  text: Therefore I said to the sons of Israel[a], ‘No person among you shall eat blood[b], and the sojourner who sojourns among you shall not eat blood.’
translation:
  language: ta
  text: ஆகையால் நான் இஸ்ரவேலின் மக்களிடம்[a], ‘உங்களில் எவரும் இரத்தத்தை உண்ணக் கூடாது; உங்களிடையே குடியிருக்கும் அந்நியக் குடியிருப்பாளரும்[b] இரத்தத்தை உண்ணக் கூடாது’ என்று சொன்னேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் நேரடியாக, “இஸ்ரவேலின் மகன்களிடம்”; இதை “இஸ்ரவேலரிடம்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “அந்நியக் குடியிருப்பாளர்” என்பது இஸ்ரவேலரல்லாதவராக இருந்தும் இஸ்ரவேலரிடையே தங்கி, அந்தச் சமூகத்தின் சட்டங்களுக்கு உட்பட்டு வாழ்ந்தவரைக் குறிக்கிறது. இதை “குடியேறிய அந்நியர்” என்றும் மொழிபெயர்க்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: עַל כֵּן
  choice: ஆகையால்
  rationale: முந்தைய வசனத்தில் இரத்தத்தில் உயிர் இருப்பதாகக் கூறப்பட்ட காரணத்திலிருந்து வரும் முடிவை இயல்பாகவும் சுருக்கமாகவும் குறிக்கிறது.
- source_word: אָמַרְתִּי
  choice: நான் ... சொன்னேன்
  rationale: எபிரெய வினையின் எளிய இறந்தகாலப் பொருளையும் சட்ட உரையின் சூழலையும் நேரடியாகக் காக்கிறது.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மக்களிடம்
  rationale: சொல்லுக்கு நெருக்கமான ‘இஸ்ரவேலின் மகன்கள்’ என்பது தமிழில் ஆண் பிள்ளைகளை மட்டும் குறிக்கும் வாய்ப்புள்ளதால், முழு உடன்படிக்கைச் சமூகத்தையும் குறிக்கும் மரபுத்தொடரின் பொருளை ‘மக்கள்’ இயல்பாக வெளிப்படுத்துகிறது; அடிக்குறிப்பு நேரடி வடிவத்தைத் தருகிறது.
- source_word: כָּל נֶפֶשׁ מִכֶּם
  choice: உங்களில் எவரும்
  rationale: נֶפֶשׁ இங்கு ‘ஆத்துமா’ என்ற தனிப் பொருளில் அல்லாமல் ஒவ்வொரு நபரையும் குறிக்கும் மரபுவழக்காக உள்ளது; எதிர்மறை சட்டக் கட்டளையின் பகிர்ந்தளிக்கும் வலிமையைத் தெளிவாகக் காட்டுகிறது.
- source_word: לֹא תֹאכַל דָּם
  choice: இரத்தத்தை உண்ணக் கூடாது
  rationale: இரத்தத்தை உண்ணுதல் என்ற மூலப்படிமத்தைத் தக்கவைத்தபடி, தமிழில் சட்டத் தடையை இயல்பாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: הַגֵּר
  choice: அந்நியக் குடியிருப்பாளர்
  rationale: இஸ்ரவேலரல்லாதவராக இருந்தும் அவர்களிடையே தங்கி சமூகச் சட்டங்களுக்கு உட்பட்டு வாழ்ந்த நபரைக் குறிக்கும் גֵּר என்பதன் சட்ட-சமூக நுட்பத்தை வெளிப்படுத்துகிறது.
- source_word: הַגָּר בְּתוֹכְכֶם
  choice: உங்களிடையே குடியிருக்கும்
  rationale: גֵּר மற்றும் גּוּר ஆகியவற்றின் சொல்வேர்த் தொடர்பை ‘குடியிருப்பாளர்/குடியிருக்கும்’ எனத் தமிழிலும் இயன்றவரை எதிரொலிக்கச் செய்கிறது.
- source_word: לֹא יֹאכַל דָּם
  choice: இரத்தத்தை உண்ணக் கூடாது
  rationale: குடியிருக்கும் அந்நியருக்கும் அதே தடை பொருந்துவதை முதல் தடைக்குச் சமமான மொழிநடையில் காட்டுகிறது.
theological_decisions:
- issue: לִבְנֵי יִשְׂרָאֵל என்ற பாலின வடிவமுள்ள உடன்படிக்கைச் சமூகப் பெயர்
  choice: இஸ்ரவேலின் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள் / இஸ்ரவேலர்
  rationale: எபிரெய மொழியில் ‘மகன்கள்’ என்ற ஆண்பால் பன்மை முழு இஸ்ரவேல் சமூகத்திற்கான நிலையான கூட்டுப்பெயராகச் செயல்படுகிறது. தமிழில் ‘மகன்கள்’ ஆண்களை மட்டும் குறிக்கும் தவறான சுருக்கத்தை ஏற்படுத்தக்கூடும்; ஆகவே சமூகத்தின் முழுப் பரப்பை ‘மக்கள்’ தெரிவிக்கிறது, அதேவேளை நேரடி வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில் தெளிவான, கண்ணியமான சட்ட மொழிநடை பயன்படுத்தப்பட்டுள்ளது. ‘கூடாது’ என்பது எபிரெயத் தடைக் கட்டளையை இயல்பான தமிழில் தருகிறது. ‘குடியிருப்பாளர்/குடியிருக்கும்’ என்ற மீளுரை மூலத்தின் பெயர்–வினை எதிரொலியை இயன்றவரைத் தக்கவைக்கிறது.
