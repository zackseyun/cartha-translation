source:
  edition: WLC
  text: וְ/זָרַ֨ק הַ/כֹּהֵ֤ן אֶת הַ/דָּם֙ עַל מִזְבַּ֣ח יְהוָ֔ה פֶּ֖תַח אֹ֣הֶל מוֹעֵ֑ד וְ/הִקְטִ֣יר הַ/חֵ֔לֶב לְ/רֵ֥יחַ נִיחֹ֖חַ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/006.yaml
  text: And the priest shall throw the blood against the altar of Yahweh at the entrance of the tent of meeting[b][a], and shall burn the fat as a pleasing aroma to Yahweh.
translation:
  language: ta
  text: ஆசாரியன் அந்த இரத்தத்தைச் சந்திப்புக் கூடாரத்தின் நுழைவிடத்திலுள்ள யாவேயின் பலிபீடத்தின்மீது வீச வேண்டும்[a]. கொழுப்பை யாவேக்கு இனிய நறுமணமாக எரிக்க வேண்டும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வீசித் தெளிக்க வேண்டும்’ அல்லது ‘தெளிக்க வேண்டும்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய வினை, ஆசாரியன் இரத்தத்தைப் பலிபீடத்தின் மீது சடங்குமுறையில் செலுத்துவதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் ‘மனநிறைவளிக்கும் நறுமணமாக’ என்றும் பொருள் கொள்ளத்தக்க நிலையான பலியியல் சொற்றொடர்; மரபாக ‘சுகந்த வாசனையாக’ என்றும் மொழிபெயர்க்கப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָרַק
  choice: வீச வேண்டும்
  rationale: பலியிடும் சடங்கில் ஆசாரியன் இரத்தத்தைப் பலிபீடத்தின் மீது வலுவாகப் பயன்படுத்துவதைக் குறிக்கும் வினை. வெறும் மென்மையான ‘தெளித்தல்’ என்பதைக் காட்டிலும் ‘வீசுதல்’ மூலத்தின் இயக்க வலிமையைப் பாதுகாக்கிறது.
- source_word: הַכֹּהֵן
  choice: ஆசாரியன்
  rationale: כֹּהֵן என்பதற்கான வழக்கமான, இயல்பான தமிழ் இணை; எபிரெய definite article-இன் குறிப்புத்தன்மையும் காக்கப்படுகிறது.
- source_word: הַדָּם
  choice: அந்த இரத்தத்தை
  rationale: அருகிலுள்ள சூழலில் குறிப்பிடப்பட்ட பலியிடப்பட்ட விலங்கின் இரத்தத்தைக் குறிக்கும் நேரடி செயப்படுபொருள்.
- source_word: עַל מִזְבַּח יְהוָה
  choice: யாவேயின் பலிபீடத்தின்மீது
  rationale: עַל இங்கு இரத்தம் பலிபீடத்தின் மேற்பரப்பில்/அதன்மீது வீசப்படுவதைக் குறிக்கிறது; יהוה தனிப்பெயராக ‘யாவே’ என்று ஒலிபெயர்க்கப்படுகிறது.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரத்தின் நுழைவிடத்தில்
  rationale: פֶּתַח என்பது நுழைவிடம்; אֹהֶל מוֹעֵד என்பதற்கு தெளிவான நவீனத் தமிழ் ‘சந்திப்புக் கூடாரம்’.
- source_word: וְהִקְטִיר
  choice: எரிக்க வேண்டும்
  rationale: ஆசாரிய மொழிநடையில் பலியிடும் பொருளை பலிபீடத்தில் எரித்துப் புகையாக எழச் செய்வதைக் குறிக்கிறது; ‘எரிக்க’ என்பது இயல்பாகவும் சுருக்கமாகவும் உள்ளது.
- source_word: הַחֵלֶב
  choice: கொழுப்பை
  rationale: பலியிடுவதற்காக ஒதுக்கப்பட்ட விலங்கின் கொழுப்புப் பகுதிகளைக் குறிக்கும் வழக்கமான நேரடி மொழிபெயர்ப்பு.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: இனிய நறுமணமாக
  rationale: தேவனுக்கு ஏற்றுக்கொள்ளத்தக்க, மகிழ்வூட்டும் நறுமணத்தைக் குறிக்கும் நிலையான பலியியல் சொற்றொடரை இயல்பான தமிழில் தருகிறது.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: பலியின் நறுமணம் யாவேக்கு நோக்கிச் செலுத்தப்படுவதை לְ முன்னிடைச்சொல் காட்டுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் வரும் நான்கெழுத்து இறைப் பெயரை ஒரு பொதுப்பட்டமாக மாற்றாமல், தனிப்பெயராகத் தமிழில் ஒலிபெயர்க்கிறது.
- issue: רֵיחַ נִיחֹחַ என்பதன் ஏற்றுக்கொள்ளப்படுதல் சார்ந்த நுண்பொருள்
  choice: இனிய நறுமணம்
  alternative: மனநிறைவளிக்கும் நறுமணம் / சுகந்த வாசனை
  rationale: சொற்றொடரின் பலியியல் மற்றும் தேவனுக்கு ஏற்புடையது என்ற உட்பொருளைக் காக்கிறது; தேவனுடைய உணர்ச்சி அல்லது இயல்பைப் பற்றி மூலத்தைவிட அதிகமாக விளக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் வேதாகமச் சூழலுக்கேற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘வீச வேண்டும்’ என்பது சடங்கு நடவடிக்கையின் வலிமையைப் பாதுகாக்கிறது; மாற்று வழக்குகள் அடிக்குறிப்பில் தரப்பட்டுள்ளன. வாக்கிய அமைப்பு தமிழில் இயல்பாக இருக்கும்படி இடக்குறிப்பு ‘பலிபீடம்’ என்பதோடு இணைக்கப்பட்டுள்ளது.
