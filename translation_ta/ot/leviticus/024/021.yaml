id: LEV.24.21
reference: Leviticus 24:21
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וּ/מַכֵּ֥ה בְהֵמָ֖ה יְשַׁלְּמֶ֑/נָּה וּ/מַכֵּ֥ה אָדָ֖ם יוּמָֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/021.yaml
  text: And whoever strikes down an animal shall make restitution for it[a], but whoever strikes down a man shall be put to death.
translation:
  language: ta
  text: விலங்கைக் கொன்றவன் அதற்கான இழப்பீட்டைச் செலுத்த வேண்டும்; மனிதனைக் கொன்றவனோ கொல்லப்பட வேண்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַכֵּה
  choice: கொன்றவன்
  rationale: נכה என்பதன் ஹிஃபில் வினையெச்ச வடிவம் அடிப்பதைக் குறித்தாலும், விலங்குக்கு இழப்பீடும் மனிதனைக் கொன்றவருக்கு மரணத் தண்டனையும் விதிக்கப்படும் இச்சூழலில் அடி மரணத்தை விளைவித்தது என்பது தெளிவு. இயல்பான நவீனத் தமிழில் ‘கொன்றவன்’ இந்த உயிரிழப்பு சார்ந்த பொருளைத் துல்லியமாகத் தெரிவிக்கிறது.
- source_word: בְהֵמָה
  choice: விலங்கு
  rationale: இச்சொல் பொதுவாக வீட்டுவிலங்கு அல்லது மிருகத்தைக் குறிக்கலாம். ‘விலங்கு’ என்பது பொருளை தேவையின்றிக் குறுக்காமல் நவீனத் தமிழில் தெளிவாக உள்ளது.
- source_word: יְשַׁלְּמֶנָּה
  choice: அதற்கான இழப்பீட்டைச் செலுத்த வேண்டும்
  rationale: שלם என்பதன் பியேல் வடிவம் ஈடுசெய்தல் அல்லது இழப்பீடு வழங்குதல் எனப் பொருள்படும்; பெண்பால் ஒருமை பின்னொட்டு விலங்கைக் குறிக்கிறது. சட்டச் சூழலை ‘இழப்பீட்டைச் செலுத்த வேண்டும்’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: אָדָם
  choice: மனிதன்
  rationale: விலங்குடன் செய்யப்படும் எதிரெதிர் ஒப்பீட்டில் אָדָם என்பது மனித இனத்தைச் சேர்ந்த தனிநபரைக் குறிக்கிறது. தமிழில் ‘மனிதன்’ இங்கு பிரதிநிதித்துவ ஒருமைச் சட்ட வடிவாக இயல்பாக அமைகிறது.
- source_word: יוּמָת
  choice: கொல்லப்பட வேண்டும்
  rationale: ஹொஃபால் வடிவம் பிறரால் மரணத்துக்குள்ளாக்கப்படும் செயப்பாட்டு பொருளைக் கொண்டது. ‘கொல்லப்பட வேண்டும்’ மூலத்தின் சட்டரீதியான செயப்பாட்டு வடிவைப் பாதுகாக்கிறது.
theological_decisions:
- issue: சட்டச் சூழலில் אָדָם என்பதன் பொருள்
  choice: மனிதன்
  alternative: மனித நபர்
  rationale: இங்கு விலங்குக்கு மாறாக ஒரு தனிப்பட்ட மனித உயிர் குறிக்கப்படுகிறது. ‘மனிதன்’ என்பது எபிரெய மொழியின் ஒருமைச் சட்ட வடிவைத் தக்கவைத்தபடியே தமிழில் மனிதரைப் பொதுவாகக் குறிக்க முடியும்; பொருளை ஆண் பாலினத்தவருக்கு மட்டும் கட்டுப்படுத்தவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் சுருக்கமான, கண்ணியமான சட்டநடை பயன்படுத்தப்பட்டுள்ளது. இணையான இரு விதிகளின் அமைப்பைத் தெளிவாக்க ‘-வனோ’ என்ற எதிர்மறை இணைப்பு பயன்படுத்தப்பட்டுள்ளது; மூலத்தில் இல்லாத விளக்கக் குறிப்புகள் சேர்க்கப்படவில்லை.
