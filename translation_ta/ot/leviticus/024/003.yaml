base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/003.yaml
  text: Outside the veil of the testimony[a], in the tent of meeting, Aaron shall arrange it from evening until morning before Yahweh continually[c][b]. It is a permanent statute throughout your generations.
translation:
  language: ta
  text: சாட்சியின் திரைக்கு வெளியே[a], சந்திப்புக் கூடாரத்தில், ஆரோன் அதை மாலை தொடங்கி காலை வரை யாவே முன்னிலையில் தொடர்ந்து ஒழுங்குபடுத்த வேண்டும். இது உங்கள் தலைமுறைகள்தோறும் கடைப்பிடிக்க வேண்டிய நிரந்தர நியமம்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சாட்சித் திரைக்கு வெளியே.”
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “என்றென்றைக்குமான நியமம்”; “எப்போதும் நிலைக்கும் நியமம்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִחוּץ לְפָרֹכֶת הָעֵדֻת
  choice: சாட்சித் திரைக்கு வெளியே
  rationale: மִחוּץ என்பது இடத்தைக் குறிக்கும் ‘வெளியே’; פָרֹכֶת என்பது பரிசுத்த இடங்களைப் பிரிக்கும் திரை; הָעֵדֻת என்பதன் வழிபாட்டுச் சூழலிலான ‘சாட்சி’ என்ற சொல்லை கூடுதல் விளக்கமின்றிப் பாதுகாக்கிறது.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரத்தில்
  rationale: இது இஸ்ரவேலின் வழிபாட்டுக் கூடாரத்துக்கான நிலையான பெயர்; நவீன தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: יַעֲרֹךְ אֹתוֹ
  choice: அதை ... ஒழுங்குபடுத்த வேண்டும்
  rationale: ערך என்பதன் அடிப்படைப் பொருளான ஒழுங்கமைத்தல் அல்லது ஒழுங்கில் வைத்தல் என்பதைக் காக்கிறது; אֹתוֹ என்ற ஒருமைச் சுட்டுப்பெயரை முந்தைய வசனத்தின் சூழலுக்கே விட்டுவைத்து ‘அதை’ என மொழிபெயர்க்கிறது.
- source_word: מֵעֶרֶב עַד בֹּקֶר
  choice: மாலை தொடங்கி காலைவரை
  rationale: செயல் நடைபெறும் இரவுக் கால எல்லையை இயல்பான நவீன தமிழில் துல்லியமாகக் குறிக்கிறது.
- source_word: לִפְנֵי יְהוָה
  choice: யாவே முன்னிலையில்
  rationale: לִפְנֵי என்பதன் வழிபாட்டுச் சூழலிலான ‘முன்னிலையில்’ என்ற பொருளையும், יהוה என்ற உடன்படிக்கைப் பெயரையும் தனிப்பெயராகவும் காக்கிறது.
- source_word: תָּמִיד
  choice: தொடர்ந்து
  rationale: ஒவ்வொரு கணமும் இடையறாது என்பதைக் கட்டாயப்படுத்தாமல், மாலை முதல் காலைவரை மீண்டும் மீண்டும் கடைப்பிடிக்கப்படும் ஒழுங்கைச் சுருக்கமாகத் தெரிவிக்கிறது.
- source_word: חֻקַּת עוֹלָם
  choice: கடைப்பிடிக்க வேண்டிய நிரந்தர நியமம்
  rationale: חֻקָּה என்பது விதிக்கப்பட்ட நியமம்; עוֹלָם அதன் நீடித்த கட்டுப்பாட்டைச் சுட்டுகிறது. ‘கடைப்பிடிக்க வேண்டிய’ என்பது தமிழில் வாக்கியத்தின் சட்டப்பூர்வ வலிமையைத் தெளிவாக்குகிறது.
- source_word: לְדֹרֹתֵיכֶם
  choice: உங்கள் தலைமுறைகள்தோறும்
  rationale: அடுத்தடுத்து வரும் தலைமுறைகள் அனைத்திற்கும் பொருந்தும் என்ற எபிரெய மரபுத்தொடரை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: எபிரெய மூலத்தில் பொதுப் பட்டமல்ல, நான்கு எழுத்துகளைக் கொண்ட தனிப்பெயர் நேரடியாக உள்ளது; ஆகவே அதைத் தலைப்பால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- issue: תָּמִיד என்பதன் காலவியல் வலிமை
  choice: தொடர்ந்து
  alternative: இடையறாமல்
  rationale: வசனமே ‘மாலை தொடங்கி காலைவரை’ என்று கால எல்லையைக் குறிப்பிடுவதால், இது ஒவ்வொரு கணமும் முடிவின்றி எரிதலைவிட ஒழுங்காகத் தொடரும் வழிபாட்டு அனுசரிப்பைக் குறிக்கலாம். மொழிபெயர்ப்பும் குறிப்பும் இந்த நுணுக்கத்தைப் பாதுகாக்கின்றன.
- issue: חֻקַּת עוֹלָם என்பதன் நீடிப்பு
  choice: நிரந்தர நியமம்
  alternative: என்றென்றைக்குமான நியமம்
  rationale: עוֹלָם நீண்டகால அல்லது நிலையான உடன்படிக்கை ஒழுங்கைக் குறிக்கக்கூடும்; ‘நிரந்தர’ என்பது காலவரம்பைத் தேவையின்றி துல்லியப்படுத்தாமல் அதன் நீடித்த வலிமையைத் தருகிறது.
translation_notes:
  register: நவீன தரத்தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதையான சட்ட-வழிபாட்டு நடையில் வடிவமைக்கப்பட்டது. ‘சாட்சி’, ‘திரை’, ‘சந்திப்புக் கூடாரம்’, ‘நியமம்’ ஆகியவை லேவியராகமத்தின் வழிபாட்டுச் சொற்களஞ்சியத்தைப் பாதுகாக்கின்றன; தேவையற்ற சமயப்பிரிவு சார்ந்த விளக்கங்கள் தவிர்க்கப்பட்டுள்ளன.
