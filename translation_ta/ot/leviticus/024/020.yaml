  text: fracture for fracture[a], eye for eye, tooth for tooth; as he inflicts an injury on a person[b], so it shall be inflicted on him.
translation:
  language: ta
  text: முறிவுக்கு முறிவு,[a] கண்ணுக்குக் கண், பல்லுக்குப் பல்; ஒருவருக்கு[b] அவன் எவ்வாறு உடற்குறைவை ஏற்படுத்துகிறானோ, அவ்வாறே அவனுக்கும் அது ஏற்படுத்தப்பட வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘முறிவு’ என்பதற்கு உடற்காயச் சூழலில் ‘எலும்பு முறிவு’ என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் ‘ஒரு மனிதனில்/ஒரு மனிதருக்கு’ என்று உள்ளது. வழக்குச் சட்டத்தில் இது எந்த மனிதரையும் குறிக்கும் பொதுமை ஒருமை.
    reason: cultural_note
lexical_decisions:
- source_word: שֶׁבֶר
  choice: எலும்பு முறிவு
  rationale: இந்த உடற்காயச் சட்டச் சூழலில் உடலின், குறிப்பாக எலும்பின், முறிவைக் குறிக்கிறது; பொதுவான ‘முறிவு’ என்பதைவிட ‘எலும்பு முறிவு’ நவீன தமிழில் தெளிவானது.
- source_word: תַּחַת
  choice: -க்கு / -க்குப்
  rationale: பதிலீடு அல்லது சமமான மறுசெயலைக் குறிக்கும் சட்டச் சூத்திரத்தில், ‘கண்ணுக்குக் கண், பல்லுக்குப் பல்’ என்ற இயல்பான தமிழ் அமைப்பு எபிரெயச் சமச்சீரைப் பாதுகாக்கிறது.
- source_word: עַיִן
  choice: கண்
  rationale: நேரடியான உடலுறுப்புப் பெயர்; சட்டச் சூத்திரத்தில் சொல்லுக்கு நெருக்கமாக வைக்கப்பட்டுள்ளது.
- source_word: שֵׁן
  choice: பல்
  rationale: நேரடியான உடலுறுப்புப் பெயர்; சட்டச் சூத்திரத்தில் சொல்லுக்கு நெருக்கமாக வைக்கப்பட்டுள்ளது.
- source_word: כַּאֲשֶׁר
  choice: எவ்வாறு ... அவ்வாறே
  rationale: செயலுக்கும் அதற்குரிய விளைவுக்கும் இடையிலான ஒப்புமையையும் சட்டரீதியான சமச்சீரையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יִתֵּן
  choice: ஏற்படுத்துகிறான்
  rationale: சொல்லடியாக ‘கொடுக்கிறான்’ என்றாலும், מוּם உடன் வரும் எபிரெய மரபுத்தொடர் ஒருவரிடம் உடற்குறைவு உண்டாக்குவதைச் சுட்டுகிறது; தமிழில் ‘ஏற்படுத்துகிறான்’ இயல்பானது.
- source_word: מוּם
  choice: உடற்குறைவு
  rationale: உடல் குறை, ஊனம், சிதைவு ஆகியவற்றை உள்ளடக்கக்கூடிய சொல். ‘காயம்’ மட்டும் என்று குறுக்காமல், மூலச்சொல்லின் நீடித்த குறை அல்லது உருக்குலைவு சார்ந்த நிழற்பொருளைக் காக்கிறது.
- source_word: אָדָם
  choice: ஒருவர்
  rationale: இந்த வழக்குச் சட்டத்தில் தனிப்பட்ட ஒரு மனிதரைப் பொதுப்படையாகக் குறிக்கிறது; நவீன தமிழில் பாலின வரையறையின்றி இயல்பாக உள்ளது.
- source_word: כֵּן
  choice: அவ்வாறே
  rationale: முன்னைய செயலும் பின்னைய விளைவும் ஒத்திருக்க வேண்டும் என்ற சமச்சீரைக் குறிக்கிறது.
- source_word: יִנָּתֶן בּוֹ
  choice: அவனுக்கும் ஏற்படுத்தப்பட வேண்டும்
  rationale: נתן என்பதன் செயல்பாட்டு வேற்றுமையையும் בּוֹ என்பதன் ‘அவனில்/அவனுக்கு’ பொருளையும் தமிழில் தெளிவான செயப்பாட்டு வாக்கியமாகக் கொடுக்கிறது; சட்ட விதியின் கட்டாயத்தன்மையால் ‘வேண்டும்’ பயன்படுத்தப்பட்டது.
theological_decisions:
- issue: பதிலளவுச் சட்டச் சூத்திரத்தின் தன்மை
  choice: ‘எலும்பு முறிவுக்கு எலும்பு முறிவு, கண்ணுக்குக் கண், பல்லுக்குப் பல்’ என்று திடமான உடல் சார்ந்த சூத்திரத்தைத் தக்கவைத்தல்
  alternative: ‘காயத்திற்கு நிகரான இழப்பீடு’ என்று கருத்துருவாக்குதல்
  rationale: மூல எபிரெயம் கண்கூடான ஈடுசெய் சூத்திரத்தையே தருகிறது. அதை இழப்பீடு பற்றிய ஒரு குறிப்பிட்ட சட்ட விளக்கமாக மொழிபெயர்ப்பது உரையில் இல்லாத விளக்கத்தைச் சேர்த்துவிடும்.
- issue: מוּם என்பதன் பரப்பு
  choice: உடற்குறைவு
  alternative: காயம் / ஊனம் / உருக்குலைவு
  rationale: இந்தச் சொல் சாதாரண காயத்தைவிட உடலில் உண்டாகும் குறை அல்லது சிதைவையும் குறிக்கலாம். ஒரே குறுகிய விளக்கத்தில் இறையியல் அல்லது சட்டப் பொருளை முடிவுசெய்யாமல் அதன் பரப்பைக் காக்கிறது.
- issue: செயப்பாட்டு இறுதி வாக்கியத்தின் செய்பவர்
  choice: செய்பவரைக் குறிப்பிடாமல் ‘ஏற்படுத்தப்பட வேண்டும்’ என்று மொழிபெயர்த்தல்
  alternative: சமூகம் அல்லது நீதிபதிகள் அதை அவனுக்குச் செய்ய வேண்டும் என்று வெளிப்படுத்துதல்
  rationale: எபிரெய செயப்பாட்டு வடிவம் செய்பவரை வெளிப்படையாகக் குறிப்பிடவில்லை. மொழிபெயர்ப்பு அந்தத் தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன, தெளிவான, கண்ணியமான சட்டநடை பயன்படுத்தப்பட்டுள்ளது. புகழ்பெற்ற ‘கண்ணுக்குக் கண், பல்லுக்குப் பல்’ அமைப்பு இயல்பான தமிழில் தக்கவைக்கப்பட்டுள்ளது. ‘ஒருவர்’ பொதுவான மனிதரைக் குறிக்கிறது; பின்னர் வரும் ‘அவன்’ வழக்குச் சட்டத்தின் ஒருமைச் செய்பவரைத் தொடர்கிறது.
