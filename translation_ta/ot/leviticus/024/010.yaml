base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/010.yaml
  text: The son of an Israelite woman[a], and he was the son of an Egyptian man, went out among the sons of Israel[b]; and in the camp the son of the Israelite woman and an Israelite man fought.
translation:
  language: ta
  text: இஸ்ரவேலியப் பெண்ணொருத்தியின் மகன்—அவனுடைய தந்தை ஓர் எகிப்தியன்—இஸ்ரவேலின் மகன்கள்[a] நடுவே புறப்பட்டான். முகாமில் அந்த இஸ்ரவேலியப் பெண்ணின் மகனும் இஸ்ரவேலிய ஆண் ஒருவனும் சண்டையிட்டார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்ரவேல் மக்கள் நடுவே.” எபிரெயச் சொற்றொடரின் நேரடி வடிவம் “இஸ்ரவேலின் மகன்கள்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “வாக்குவாதம் செய்தார்கள்.” இங்கு வரும் வினை வாய்த்தகராறையோ சண்டையையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: புறப்பட்டு ... சென்றான்
  rationale: יצא என்பது வெளியே செல்லுதல் அல்லது புறப்படுதல் என்ற இயக்கத்தைக் குறிக்கிறது. அவன் எங்கிருந்து புறப்பட்டான் என்பதை எபிரெயம் சொல்லாததால், தமிழிலும் அதைச் சேர்க்காமல் இயல்பான கதைநடையில் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: בֶּן אִשָּׁה יִשְׂרְאֵלִית
  choice: இஸ்ரவேலியப் பெண் ஒருத்தியின் மகன்
  rationale: தாய்வழி அடையாளத்தைத் தெளிவாகவும் இயல்பான நவீனத் தமிழிலும் வெளிப்படுத்துகிறது.
- source_word: וְהוּא בֶּן אִישׁ מִצְרִי
  choice: அவனுடைய தந்தை ஓர் எகிப்தியன்
  rationale: சொல்லுக்குச் சொல் அமைப்பு ‘அவன் ஓர் எகிப்திய ஆணின் மகன்’ என்பதாக இருந்தாலும், அதே உறவைத் தமிழில் தெளிவாகவும் சுருக்கமாகவும் கூறுகிறது; புதிய தகவலைச் சேர்ப்பதில்லை.
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்கள் நடுவே
  rationale: בְּתוֹךְ என்பதன் ‘நடுவே’ என்ற பொருளையும், בְּנֵי יִשְׂרָאֵל என்ற மரபான உடன்படிக்கைச் சொல்லாக்கத்தின் வடிவத்தையும் பாதுகாக்கிறது.
- source_word: וַיִּנָּצוּ
  choice: சண்டையிட்டார்கள்
  rationale: נצה வினையின் நிபால் வடிவம் வாய்த்தகராறையோ உடல் மோதலையோ குறிக்கக்கூடும். தொடரும் நிகழ்வின் தீவிரத்துக்கு ‘சண்டையிட்டார்கள்’ பொருந்துகிறது; விரிவான சாத்தியம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: בַּמַּחֲנֶה
  choice: முகாமில்
  rationale: இஸ்ரவேல் மக்கள் தங்கியிருந்த முகாமை நேரடியான இடக்குறிப்பாக வழங்குகிறது.
- source_word: בֶּן הַיִּשְׂרְאֵלִית
  choice: அந்த இஸ்ரவேலியப் பெண்ணின் மகன்
  rationale: முன்னர் அறிமுகப்படுத்தப்பட்ட அதே நபரை எபிரெயம் மீண்டும் தாய்வழி அடையாளத்தால் குறிப்பிடுவதைக் காக்கிறது.
- source_word: וְאִישׁ הַיִּשְׂרְאֵלִי
  choice: இஸ்ரவேலிய ஆண் ஒருவன்
  rationale: மற்றொரு நபரை இஸ்ரவேலிய ஆணாக அறிமுகப்படுத்தும் வேறுபாட்டை இயல்பான தமிழில் காட்டுகிறது.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל என்ற பாலினக் குறியீடுள்ள தேசியப் பெயர்
  choice: இஸ்ரவேலின் மகன்கள்
  alternative: இஸ்ரவேல் மக்கள்
  rationale: இங்கு இச்சொற்றொடர் தேசத்தாரைக் கூட்டாகக் குறித்தாலும், மூலத்தின் மரபான உடன்படிக்கைச் சொல்லாக்கத்தை முதன்மை உரையில் பாதுகாக்கிறது. இயல்பான கூட்டுப்பெயர் அடிக்குறிப்பில் மாற்றாக வழங்கப்படுகிறது.
- issue: וַיִּנָּצוּ குறிக்கும் மோதலின் தன்மை
  choice: சண்டையிட்டார்கள்
  alternative: வாக்குவாதம் செய்தார்கள்
  rationale: வினை வாய்த்தகராறிலிருந்து சண்டைவரை உள்ள பொருள்வெளியைக் கொண்டுள்ளது. அடுத்தடுத்த நிகழ்வுகளின் தீவிரம் ‘சண்டை’ என்பதை ஆதரித்தாலும், வாக்குவாதம் என்ற குறுகிய வாசிப்பை முற்றிலும் நீக்காமல் அடிக்குறிப்பில் தருகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. தந்தையைப் பற்றிய இடைச்சொல் கோடுகளுக்குள் அமைக்கப்பட்டதால் நீண்ட எபிரெய வாக்கியத்தின் தொடர்புகள் தெளிவாகின்றன. மூலத்தின் மீளுரையும் இன அடையாள வேறுபாடும் பாதுகாக்கப்பட்டுள்ளன. வழங்கப்பட்ட ஆங்கில ஆலோசனை உரையில் அடிக்குறிப்பு குறிகள் இடம் மாறியிருந்ததால், மூலச்சொற்களுக்கேற்ப [a] தேசியப் பெயருக்குப் பின்னும் [b] மோதல் வினைக்குப் பின்னும் சரியாக வைக்கப்பட்டுள்ளன.
