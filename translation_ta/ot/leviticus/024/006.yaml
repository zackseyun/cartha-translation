id: LEV.24.6
reference: Leviticus 24:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/שַׂמְתָּ֥ אוֹתָ֛/ם שְׁתַּ֥יִם מַֽעֲרָכ֖וֹת שֵׁ֣שׁ הַֽ/מַּעֲרָ֑כֶת עַ֛ל הַ/שֻּׁלְחָ֥ן הַ/טָּהֹ֖ר לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/006.yaml
  text: And you shall place them in two rows[a], six in each row[b], on the pure table before Yahweh.
translation:
  language: ta
  text: அவற்றை இரண்டு வரிசைகளாக[a], ஒவ்வொரு வரிசையிலும் ஆறு வீதம், தூய மேசையின்மேல்[b] யாவே முன்னிலையில் வைக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இரண்டு அமைப்புகளாக’ அல்லது ‘இரண்டு அடுக்குகளாக’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் அப்பங்கள் ஒழுங்காக அமைக்கப்பட்டிருப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘சுத்தமான மேசை’ என்றும் மொழிபெயர்க்கலாம்; இங்கு ‘தூய’ என்பது வெறும் வெளிப்புறச் சுத்தத்தைவிட சடங்குமுறைத் தூய்மையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתָּ
  choice: வைக்க வேண்டும்
  rationale: שׂוּם என்பது ‘வை, அமை’ என்று பொருள்படும். எபிரெய மொழியின் இரண்டாம் நபர் ஒருமை கட்டளைத் தன்மையை, தமிழில் சட்டவிதி நடைக்கு இயல்பான ‘வைக்க வேண்டும்’ என்பதன் மூலம் வெளிப்படுத்துகிறது.
- source_word: אוֹתָם
  choice: அவற்றை
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட பன்னிரண்டு அப்பங்களைக் குறிக்கும் நேரடிப் பொருள் பன்மைப் பெயர்ப்பதிலி.
- source_word: שְׁתַּיִם מַעֲרָכוֹת
  choice: இரண்டு வரிசைகளாக
  rationale: מַעֲרָכָה என்பது ஒழுங்காக அமைக்கப்பட்ட தொகுதி அல்லது அமைப்பைக் குறிக்கும். மேசையின்மேல் அப்பங்களை அமைக்கும் இச்சூழலில் ‘வரிசைகள்’ இயல்பாகவும் தெளிவாகவும் உள்ளது; ‘அடுக்குகள்’ என்பதும் சாத்தியம்.
- source_word: שֵׁשׁ הַמַּעֲרָכֶת
  choice: ஒவ்வொரு வரிசையிலும் ஆறு வீதம்
  rationale: எபிரெயச் சொற்றொடர் சொற்படியாக ‘ஆறு, அந்த வரிசை’ என இருந்தாலும், பகிர்ந்தளிக்கும் பொருளில் ஒவ்வொரு அமைப்பிலும் ஆறு இருப்பதைக் குறிக்கிறது. தமிழில் இதைத் தெளிவாக வெளிப்படுத்த ‘ஒவ்வொரு ... ஆறு வீதம்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: עַל הַשֻּׁלְחָן
  choice: மேசையின்மேல்
  rationale: עַל என்பதன் வழக்கமான இடப்பொருளான ‘மேல்’ என்பதைக் குறிக்கிறது.
- source_word: הַטָּהֹר
  choice: தூய
  rationale: טָהוֹר இங்கு சரணாலயச் சடங்குச் சூழலில் தூய்மை அல்லது சடங்குமுறைத் தூய நிலையைக் குறிக்கிறது. ‘தூய’ என்பது வெறும் வெளிப்புறச் சுத்தத்தைவிட அந்தப் பொருளை நன்கு காக்கிறது.
- source_word: לִפְנֵי יְהוָה
  choice: யாவே முன்னிலையில்
  rationale: לִפְנֵי என்பது ‘முன்பாக, முன்னிலையில்’ என்று பொருள்படும். ‘முன்னிலையில்’ என்பது தேவசந்நிதியில் வைக்கப்படுவதை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; יהוה என்ற திருப்பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் நான்கெழுத்துத் திருப்பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டப்பெயராக மாற்றாமல், உடன்படிக்கையின் இறைப்பெயராக ‘யாவே’ என ஒலிபெயர்ப்பது மூலத்தின் தனித்துவத்தைப் பாதுகாக்கிறது.
- issue: הַטָּהֹר என்ற சடங்குசார் பெயரடை
  choice: தூய மேசை
  alternative: சுத்தமான மேசை
  rationale: இது பரிசுத்த இடத்தின் பொருட்கள் குறித்த சூழல். ‘தூய’ என்பது உடலளவிலான சுத்தத்தை மட்டும் அல்லாமல் சடங்குமுறைத் தூய்மையையும் உணர்த்துகிறது; அதற்கு மேல் எந்தப் பிற்காலக் கோட்பாட்டுப் பொருளையும் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், லேவியராகமச் சட்டவிதிகளுக்கேற்ற கண்ணியமான அறிவுறுத்தல் நடை பயன்படுத்தப்பட்டுள்ளது. தேவையற்ற விளக்கச் சொற்கள் சேர்க்கப்படவில்லை; பகிர்ந்தளிக்கும் எபிரெயக் கட்டமைப்பு மட்டும் தமிழில் தெளிவாக்கப்பட்டுள்ளது. அடிக்குறிப்பு [b] அது விளக்கும் ‘தூய மேசை’ என்பதற்குப் பின்னர் வைக்கப்பட்டுள்ளது.
