  yaml_path: translation/ot/leviticus/024/015.yaml
  text: And you shall speak to the sons of Israel, saying, ‘If any man curses his God, then he shall bear his sin.
translation:
  language: ta
  text: 'நீ இஸ்ரவேல் மக்களிடம்[a] இவ்வாறு சொல்ல வேண்டும்: “எவனாவது[b] தன் கடவுளைச் சபித்தால், அவன் தன் பாவத்தைச் சுமப்பான்[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் நேரடியாக, “இஸ்ரவேலின் மகன்கள்.” இச்சொற்றொடர் இங்கே இஸ்ரவேல் மக்களை ஒட்டுமொத்தமாகக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “எவர் ஒருவரும்.” பகிர்வுணர்வை வலியுறுத்த எபிரெயம் “மனிதன், மனிதன்” என்று சொல்லை இருமுறை பயன்படுத்துகிறது.
    reason: lexical_alternative
  - marker: c
    text: “தன் பாவத்தைச் சுமப்பான்” என்பது அந்தக் குற்றத்திற்கான குற்றப்பழியையோ சட்டப் பொறுப்பையோ அவனே ஏற்க வேண்டும் என்பதைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: எபிரெயச் சொற்றொடரின் நேர்ப்பொருள் ‘இஸ்ரவேலின் மகன்கள்.’ ஆனால் இங்கு அது உடன்படிக்கை மக்களை ஒட்டுமொத்தமாகக் குறிக்கிறது; இயல்பான நவீன தமிழில் ‘இஸ்ரவேல் மக்கள்’ என்று மொழிபெயர்க்கப்பட்டு, நேர்ப்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: תְּדַבֵּר לֵאמֹר
  choice: பேசிச் சொல்ல வேண்டியது
  rationale: மோசேக்கு வழங்கப்படும் சட்ட வழிகாட்டலின் கட்டளைத் தன்மையையும், தொடர்ந்து வரும் மேற்கோளை அறிமுகப்படுத்தும் எபிரெயச் சொல்லமைப்பையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אִישׁ אִישׁ
  choice: எவனாவது
  rationale: ‘மனிதன், மனிதன்’ என்ற மீட்சி ஒவ்வொருவருக்கும் பொருந்தும் பகிர்வுணர்வைத் தருகிறது. ‘எவனாவது’ என்பது ஆண்பால் ஒருமையை வைத்துக்கொண்டே அந்தப் பொருளை இயல்பாகத் தெரிவிக்கிறது.
- source_word: כִּי יְקַלֵּל
  choice: சபித்தால்
  rationale: சட்ட நிபந்தனையை כִּי அறிமுகப்படுத்துவதால் ‘-த்தால்’ என வழங்கப்படுகிறது. קלל என்பதன் பியேல் வடிவத்திற்கு இங்கு ‘சபி’ என்பது நேரடியான பொருள்; அடுத்த வசனத்தின் குறிப்பிட்ட இறைப்பழிப்பு குற்றத்தை முன்கூட்டியே இங்கே புகுத்தவில்லை.
- source_word: אֱלֹהָיו
  choice: தன் கடவுளை
  rationale: மூன்றாம் நபர் ஆண்பால் உடைமைப் பின்னொட்டைத் தமிழில் இயல்பாக ‘தன்’ வெளிப்படுத்துகிறது. எபிரெயம் இவ்வசனத்தில் ‘யெகோவா’ என்று குறிப்பிடாததால் அதனைச் சேர்க்கவில்லை.
- source_word: וְנָשָׂא חֶטְאוֹ
  choice: அவன் தன் பாவத்தைச் சுமப்பான்
  rationale: குற்றத்திற்கான பொறுப்பையோ குற்றப்பழியையோ சுமத்தலைக் குறிக்கும் எபிரெய மரபுத்தொடரை முதன்மை உரையில் பாதுகாக்கிறது; அதன் சட்டநுட்பம் அடிக்குறிப்பில் விளக்கப்படுகிறது.
theological_decisions:
- issue: אֱלֹהָיו என்பதன் வரம்பும் இஸ்ரவேலின் கடவுளுடனான தொடர்பும்
  choice: தன் கடவுளை
  alternative: கடவுளை; யெகோவாவை
  rationale: எபிரெய மூலத்தின் உடைமை வடிவத்தைப் பாதுகாத்து, அடுத்த வசனத்தில் வரும் குறிப்பிட்ட திருப்பெயர் குற்றத்துடன் இவ்வசனத்தை அமைதியாக ஒன்றாக்காமல் அதன் பொருள் அழுத்தத்தை நிலைநிறுத்துகிறது.
- issue: சட்டப் பொருளின் பாலின வடிவம்
  choice: எவனாவது
  alternative: யாராவது; எவர் ஒருவரும்
  rationale: אִישׁ אִישׁ என்பது இலக்கணரீதியாக ஆண்பால் ஒருமை வடிவில் பகிர்வுணர்வுடன் வருகிறது. ‘எவனாவது’ அந்த வடிவத்தையும் ‘யாராயிருந்தாலும்’ என்ற செயல்பாட்டையும் ஒன்றாகக் காக்கிறது.
- issue: ‘பாவத்தைச் சுமத்தல்’ என்ற மரபுத்தொடரின் பொருள்
  choice: மரபுத்தொடரை முதன்மை உரையில் வைத்தல்
  alternative: தன் குற்றப்பழியைச் சுமப்பான்; தன் பாவத்திற்கான தண்டனையை அனுபவிப்பான்
  rationale: חטא என்பது ‘பாவம்,’ ‘குற்றப்பழி,’ அல்லது அதனால் வரும் பொறுப்பு ஆகிய நிழற்பொருள்களைக் கொண்டிருக்கலாம். ‘தண்டனை’ என்று விரிவாக்குவது மூலத்தில் உள்ள உண்மையான பொருள் பரப்பைச் சுருக்கக்கூடும்; ஆகவே விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டவுரைக்கேற்ற கண்ணியமான ஆனால் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘பேசிச் சொல்ல வேண்டியது’ கட்டளைத் தொனியை இயல்பாகக் காட்டுகிறது; ‘சபித்தால்’ மற்றும் ‘பாவத்தைச் சுமப்பான்’ மூலத்தின் சொற்பொருளையும் அதன் திறந்த நுட்பத்தையும் பாதுகாக்கின்றன.
