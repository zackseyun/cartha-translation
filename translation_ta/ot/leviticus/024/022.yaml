  yaml_path: translation/ot/leviticus/024/022.yaml
  text: There shall be one standard of judgment for you, for the sojourner as for the native, for I am the LORD your God.
translation:
  language: ta
  text: உங்களுக்கு ஒரே சட்டநெறி இருக்க வேண்டும்; அந்நியராகக் குடியிருப்பவருக்கும் நாட்டில் பிறந்தவருக்கும் அது ஒரே மாதிரியாக இருக்க வேண்டும். ஏனெனில், நான் உங்கள் கடவுளாகிய யெகோவா.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשְׁפָּט אֶחָד
  choice: ஒரே நீதி நியமம்
  rationale: מִשְׁפָּט இங்கு தனிப்பட்ட தீர்ப்பை மட்டுமல்லாமல் அனைவருக்கும் பொருந்தும் சட்டநீதித் தரத்தைக் குறிக்கிறது; אֶחָד அதன் ஒருமைப்பாட்டை வலியுறுத்துகிறது.
- source_word: גֵּר
  choice: அந்நியராகக் குடியிருப்பவர்
  rationale: இஸ்ரவேலரிடையே நிலையாக வசிக்கும், ஆனால் நாட்டில் பிறந்தவர் அல்லாத குடியிருப்பாளரை இயல்பான நவீன தமிழில் குறிக்கிறது.
- source_word: אֶזְרָח
  choice: நாட்டில் பிறந்தவர்
  rationale: குடியிருக்கும் அந்நியருக்கு எதிர்நிலையில் உள்ள பூர்வகுடி அல்லது நாட்டைச் சேர்ந்தவரைக் குறிக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: மூலத்தில் உள்ள தனிப்பட்ட இறைப் பெயரை பொதுப்பட்டமான ‘ஆண்டவர்’ என்று மாற்றாமல் பெயராகவே வழங்குகிறது.
theological_decisions:
- issue: அந்நியக் குடியிருப்பவருக்கும் நாட்டில் பிறந்தவருக்கும் ஒரே நீதித் தரம்
  choice: இரு குழுக்களுக்கும் அது ஒன்றாகவே இருக்க வேண்டும் என்று வெளிப்படையாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘உங்களுக்கு ஒரே தீர்ப்பு இருக்கும்’ என்று மட்டும் சொல்லுதல்.
  rationale: כַּגֵּר כָּאֶזְרָח என்ற ஒப்புமை சட்டத்தின் சமமான பயன்பாட்டை வலியுறுத்துகிறது; எந்தக் குழுவின் நிலையும் மறைக்கப்படவில்லை.
- issue: இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: ஆண்டவர்
  rationale: יהוה என்பது மூலத்தில் தனிப்பட்ட இறைப் பெயர்; அதை வெளிப்படையாகப் பெயராகத் தருவது மூலவடிவ வேறுபாட்டைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், சட்டநீதியின் கண்ணியமான தொனியைக் காக்கும் எளிய வாக்கிய அமைப்பு பயன்படுத்தப்பட்டது. ‘அந்நியராகக் குடியிருப்பவர்’ என்பது ‘பரதேசி’ போன்ற பழைய அல்லது தெளிவற்ற சொல்லைத் தவிர்க்கிறது.
