base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/014.yaml
  text: Bring the one who cursed outside the camp[a], and let all who heard lay their hands on his head[b], and let all the congregation stone him.
translation:
  language: ta
  text: சபித்தவனை முகாமுக்கு வெளியே கொண்டுபோங்கள்[a]. கேட்ட அனைவரும் தங்கள் கைகளை அவன் தலையின்மேல் வைக்கட்டும்[b]. சபையினர் அனைவரும் அவனைக் கல்லெறிந்து கொல்லட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தேவதூஷணம் செய்தவனை.” எபிரெயில் நேரடியாக, “சபித்தவனை.”
    reason: alternative_reading
  - marker: b
    text: இங்கு கைகளை வைப்பது, குற்றவாளியைச் சாட்சிகள் முறையாக அடையாளப்படுத்துவதைக் குறிக்கலாம்; சிலர் இதற்குக் குறியீட்டுப் பொருளும் இருப்பதாகப் புரிந்துகொள்கிறார்கள்.
    reason: cultural_note
lexical_decisions:
- source_word: הוֹצֵא
  choice: கொண்டுபோங்கள்
  rationale: ஹிஃபில் கட்டளை வடிவம் ஒருவனை வெளியே செல்லச் செய்வதைக் குறிக்கிறது; இலக்கிடமான ‘முகாமுக்கு வெளியே’ என்பதுடன் ‘கொண்டுபோங்கள்’ இயல்பாக அமைகிறது.
- source_word: הַמְקַלֵּל
  choice: சபித்தவனை
  rationale: קלל வேரின் பெயரெச்ச வடிவத்தை நேரடியாகப் பாதுகாக்கிறது; சூழல் இறைப் பெயரைச் சபித்ததைக் குறித்தாலும், ‘தேவதூஷணம் செய்தவன்’ என்ற விளக்கவுரையை முதன்மை உரையில் புகுத்தவில்லை.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: முகாமுக்கு வெளியே
  rationale: சமூகத்தின் குடியிருப்பு எல்லைக்கு வெளியிலுள்ள இடத்தைக் குறிக்கும் வழக்கமான இடவியல் சொற்றொடர்.
- source_word: וְסָמְכוּ ... אֶת יְדֵיהֶם עַל רֹאשׁוֹ
  choice: தங்கள் கைகளை அவன் தலையின்மேல் வைக்கட்டும்
  rationale: செயலை அதன் குறியீட்டுப் பொருளைத் தீர்மானிக்காமல் நேரடியாகத் தருகிறது; எபிரெயிலுள்ள பன்மை ‘கைகளை’ பாதுகாக்கப்படுகிறது.
- source_word: כָל הַשֹּׁמְעִים
  choice: கேட்ட அனைவரும்
  rationale: பெயரெச்ச வடிவம் குற்றச்சொல்லைக் கேட்ட சாட்சிகளைக் குறிக்கிறது. எபிரெயில் வெளிப்படையாக இல்லாத செயப்படுபொருளைச் சேர்க்காமல் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְרָגְמוּ אֹתוֹ
  choice: அவனைக் கல்லெறிந்து கொல்லட்டும்
  rationale: רגם இங்கு கல்லெறிதல் வழியான மரணதண்டனையைக் குறிக்கிறது; ‘கொல்லட்டும்’ என்பது தமிழில் செயல் விளைவைத் தெளிவுபடுத்துகிறது.
- source_word: כָל הָעֵדָה
  choice: சபையார் அனைவரும்
  rationale: עֵדָה உடன்படிக்கைச் சமூகமாகக் கூடிய மக்களைச் சுட்டுகிறது; ‘சபையார்’ அதன் முறையான சமூகப் பொருளை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: குற்றவாளியை ‘சபித்தவன்’ எனவா, ‘தேவதூஷணம் செய்தவன்’ எனவா குறிப்பிடுவது
  choice: சபித்தவன்
  alternative: தேவதூஷணம் செய்தவன்
  rationale: உடனடி எபிரெயுச் சொல் קלל, ‘சபி’ என்பதிலிருந்து வந்தது. சூழலில் சபிக்கப்பட்டது இறைப் பெயர் என்றாலும், அந்த விளக்கத்தை முதன்மை உரையில் நிலைநிறுத்தாமல் மாற்று வாசிப்பாக அடிக்குறிப்பில் தரப்படுகிறது.
- issue: கைகளைத் தலையின்மேல் வைப்பதன் பொருள்
  choice: செயலை மட்டும் நேரடியாக மொழிபெயர்த்தல்
  alternative: சாட்சிகள் குற்றவாளியை முறையாக அடையாளப்படுத்துதல் அல்லது குற்றத்தை அடையாளரீதியாக மாற்றுதல் என விளக்குதல்
  rationale: இவ்வசனம் செயலின் குறியீட்டுப் பொருளை வெளிப்படையாக விளக்கவில்லை; ஆகவே எந்த ஒரு இறையியல் விளக்கத்தையும் முதன்மை உரையில் புகுத்தவில்லை.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க, பொதுமக்களுக்கு எளிதில் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. கட்டளைகளின் தொடரை ‘கொண்டுபோங்கள் ... வைக்கட்டும் ... கொல்லட்டும்’ என இயல்பாகக் கொடுத்து, மூலத்தின் நீதித்துறைச் சூழலும் தீவிரமும் பாதுகாக்கப்பட்டுள்ளன.
