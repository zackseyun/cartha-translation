  text: Command the sons of Israel that they bring to you pure oil of beaten olives for the light[b][a], to keep a lamp burning continually.
translation:
  language: ta
  text: 'இஸ்ரவேலின் மகன்களுக்கு[a] கட்டளையிடு: விளக்கொளிக்காக இடித்தெடுத்த தூய ஒலிவ எண்ணெயை[b] அவர்கள் உன்னிடம் கொண்டுவரட்டும்; தொடர்ந்து எரிய ஒரு விளக்கை ஏற்றுவதற்காக.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இஸ்ரவேல் மக்களுக்கு’ / ‘இஸ்ரவேலர்களுக்கு.’ எபிரெய மொழியில் சொல்லுக்குச் சொல் ‘இஸ்ரவேலின் மகன்களுக்கு’; இது இஸ்ரவேல் மக்களைக் குறிக்கும் மரபான உடன்படிக்கைசார் பெயர்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘தூய, இடித்தெடுக்கப்பட்ட ஒலிவ எண்ணெயை.’ எபிரெய உரை, ஒலிவப் பழங்களிலிருந்து பெறப்பட்ட எண்ணெய் தூயதாகவும் இடித்தெடுக்கப்பட்டதாகவும் இருப்பதைக் குறிப்பிடுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: צַו
  choice: கட்டளையிடு
  rationale: நேரடியான அதிகாரப்பூர்வ ஏவலைக் குறிக்கும் கட்டளை வடிவத்தை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரெய மொழியின் ‘இஸ்ரவேலின் மகன்கள்’ என்ற உடன்படிக்கைசார் வழக்குப் பெயரை முறையாகப் பாதுகாக்கிறது; அதன் இயல்பான தமிழ்ப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְיִקְחוּ אֵלֶיךָ
  choice: அவர்கள் உன்னிடம் கொண்டுவரட்டும்
  rationale: לקח என்பதன் அடிப்படைப் பொருள் ‘எடு’ என்றாலும், ‘உன்னிடம்’ என்பதுடன் இங்கு நோக்கப்பட்ட செயல் கொண்டுவருதல் ஆகும்.
- source_word: שֶׁמֶן זַיִת זָךְ כָּתִית
  choice: இடித்தெடுத்த தூய ஒலிவ எண்ணெய்
  rationale: எண்ணெயின் மூலப்பொருள், தூய்மை, இடித்தல் மூலம் அது எடுக்கப்பட்ட முறை ஆகிய மூன்றையும் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: לַמָּאוֹר
  choice: விளக்கொளிக்காக
  rationale: ஒளி அல்லது ஒளியூட்டுதல் என்ற பொருளைச் சூழலுக்கு ஏற்ற சுருக்கமான தமிழில் தருகிறது; ‘விளக்குத்தண்டுக்காக’ என்று குறிப்பாக விளக்கவில்லை.
- source_word: לְהַעֲלֹת נֵר
  choice: விளக்கு எரிந்துகொண்டிருக்கும்படி செய்ய
  rationale: சொல்லுக்குச் சொல் ‘விளக்கை மேலெழச் செய்ய’ என்ற எபிரெய மரபுத்தொடர், விளக்கை ஏற்றி எரியவைத்தல் அல்லது எரிந்துகொண்டிருக்கச் செய்தல் என்பதைக் குறிக்கிறது.
- source_word: תָּמִיד
  choice: தொடர்ந்து
  rationale: ஆசாரச் சூழலில் நிலையான அல்லது முறைப்படி தொடரும் செயலைக் குறிக்கக்கூடிய சொல்லை தேவையற்ற அளவு முழுமைப்படுத்தாமல் மொழிபெயர்க்கிறது.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל என்ற பாலினம் குறிக்கப்பட்ட உடன்படிக்கைசார் பெயர்
  choice: இஸ்ரவேலின் மகன்கள்
  alternative: இஸ்ரவேல் மக்கள் / இஸ்ரவேலர்கள்
  rationale: மூலத்தில் உள்ள ஆண்பால் பன்மை வடிவத்தை முதன்மை உரையில் பாதுகாக்கிறது; இது மொத்த இஸ்ரவேல் சமூகத்தைக் குறிக்கும் வழக்குப் பெயர் என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- issue: תָּמִיד குறிக்கும் தொடர்ச்சியின் தன்மை
  choice: தொடர்ந்து
  alternative: எப்போதும் / முறைப்படி
  rationale: இந்த ஆசாரச் சொல் இடைவிடாத தொடர்ச்சியையோ ஒழுங்கான தொடர்ச்சியையோ குறிக்கக்கூடியதால், ‘தொடர்ந்து’ என்பது அந்த பொருள் அகலத்தைச் சுருக்காமல் வைத்திருக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘இஸ்ரவேலின் மகன்கள்’ என்ற முறையான மூலவடிவம் பாதுகாக்கப்பட்டாலும், அதன் வழக்குப் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது. ஆலயச் சூழலுக்குரிய செயலைத் தெளிவுபடுத்த ‘விளக்கொளி’ மற்றும் ‘எரிந்துகொண்டிருக்கும்படி’ பயன்படுத்தப்பட்டுள்ளன.
