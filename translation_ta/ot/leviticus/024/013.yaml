lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பின்பு ... பேசினார்
  rationale: வாவ் தொடரமைப்பு நிகழ்வை அடுத்த கட்டத்துக்கு நகர்த்துகிறது; ‘பின்பு’ வரிசையை இயல்பான தமிழில் காட்டுகிறது. דִּבֵּר என்பதற்கு ‘பேசினார்’ பொருத்தமானது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: நான்கெழுத்து இறைப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֶל־מֹשֶׁה
  choice: மோசேயிடம்
  rationale: பேச்சு யாரை நோக்கியது என்பதை நவீன தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: לֵאמֹר
  choice: ':'
  rationale: அடுத்த வசனத்தில் நேரடிப் பேச்சு தொடங்குவதைக் காட்டும் எபிரேய அறிமுகச் சூத்திரத்தின் செயல்பாட்டை தமிழில் முக்காற்புள்ளி இயல்பாக நிறைவேற்றுகிறது; தேவையற்ற ‘சொல்லி’ என்ற தொங்கும் வடிவத்தைத் தவிர்க்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: கர்த்தர்; யாவே
  rationale: மூலத்தில் தனிப்பட்ட இறைப்பெயர் நேரடியாக உள்ளது. அதை பொதுப் பட்டமாக மாற்றாமல் தமிழ் வாசகர்களிடையே நிலைபெற்ற ‘யெகோவா’ என ஒலிபெயர்க்கப்பட்டுள்ளது; எபிரேய உச்சரிப்பை மீட்டமைக்கும் ‘யாவே’ என்பதும் சாத்தியமான மாற்று.
translation_notes:
  register: நவீன செந்தமிழ் நடையில் சுருக்கமாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. அடுத்த வசனத்தில் வரும் உரையை அறிமுகப்படுத்த முக்காற்புள்ளி பயன்படுத்தப்பட்டது.
