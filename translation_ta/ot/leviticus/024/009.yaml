base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/009.yaml
  text: It shall belong to Aaron and to his sons[a], and they shall eat it in a holy place, because it is most holy to him from the food offerings of Yahweh, a permanent statute.
translation:
  language: ta
  text: அது ஆரோனுக்கும் அவன் மகன்களுக்கும் உரியதாக இருக்கும். அவர்கள் அதை ஒரு பரிசுத்தமான இடத்தில் உண்ண வேண்டும். ஏனெனில், யாவேயின் நெருப்பில் செலுத்தப்படும் படையல்களிலிருந்து அது அவனுக்கு மகா பரிசுத்தமானது. இது என்றென்றும் நிலைக்கும் நியமம்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיְתָה לְאַהֲרֹן וּלְבָנָיו
  choice: அது ஆரோனுக்கும் அவன் மகன்களுக்கும் உரியதாக இருக்கும்
  rationale: היה உடன் לְ பெறுநரைக் குறிக்கும்போது இங்கு உடைமை அல்லது ஒதுக்கீட்டைக் காட்டுகிறது. எனவே வெறும் ‘இருக்கும்’ என்பதற்குப் பதிலாகச் சட்டரீதியான பொருளைத் தெளிவுபடுத்தும் ‘உரியதாக இருக்கும்’ பயன்படுத்தப்பட்டது.
- source_word: וַאֲכָלֻהוּ
  choice: அவர்கள் அதைச் சாப்பிட வேண்டும்
  rationale: இந்த வினை சட்ட அறிவுறுத்தலைத் தொடர்கிறது. நவீன தமிழில் அதன் கட்டளைத் தன்மையை இயல்பாக வெளிப்படுத்த ‘சாப்பிட வேண்டும்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: בְּמָקוֹם קָדֹשׁ
  choice: ஒரு பரிசுத்தமான இடத்தில்
  rationale: எபிரெயத்தில் இரு சொற்களுக்கும் குறிப்புச் சுட்டு இல்லை. ஆகவே ஒரு குறிப்பிட்ட பரிசுத்த அறையென மிகைப்படுத்தாமல் ‘ஒரு பரிசுத்தமான இடத்தில்’ என வழங்கப்பட்டது.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: மகா பரிசுத்தமானது
  rationale: இந்த எபிரெய மரபுத்தொடர் மிக உயர்ந்த அளவிலான பரிசுத்தத்தைக் குறிக்கிறது. இடப்பெயரான ‘மகா பரிசுத்த ஸ்தலம்’ என்பதோடு குழப்பாமல் பொருளின் தன்மையைக் கூறும் வகையில் மொழிபெயர்க்கப்பட்டது.
- source_word: מֵאִשֵּׁי יְהוָה
  choice: யாவேக்கு நெருப்பில் செலுத்தப்படும் படையல்களிலிருந்து
  rationale: אִשֶּׁה என்பது பலிபீட நெருப்பின் மூலம் செலுத்தப்படும் படையல்களைக் குறிக்கும் மரபுச் சொல்லாகும். ‘நெருப்பில் செலுத்தப்படும் படையல்கள்’ என்பது அந்தச் சடங்கு சார்ந்த கருத்தைத் தெளிவாகத் தருகிறது; ‘உணவு’ என்ற எண்ணத்தை தேவையின்றி முன்வைப்பதில்லை.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைநாமத்தை ஒரு பட்டத்தால் மாற்றாமல், அதன் பொதுவாக ஏற்கப்பட்ட தமிழ்ப் பெயரெழுத்தாக்கமான ‘யாவே’ பயன்படுத்தப்பட்டது.
- source_word: חָק עוֹלָם
  choice: என்றென்றும் நிலைக்கும் நியமம்
  rationale: இது தொடர்ந்து அமலில் இருக்கும் சட்ட ஒழுங்கைக் குறிக்கிறது. நவீன, கண்ணியமான தமிழில் அதன் நீடித்த தன்மையை இச்சொற்றொடர் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ஆரோனையும் அவன் மகன்களையும் குறிப்பிட்ட பின் வரும் ஒருமை לֹו என்பதன் சுட்டுப்பொருள்
  choice: ‘அவனுக்கு’ என்று ஒருமையாகவே வைக்கப்பட்டது; இது ஆசாரியக் குடும்பத்தின் பிரதிநிதித் தலைவனாக ஆரோனைச் சுட்டுகிறது.
  alternative: சூழலில் பல ஆசாரியர்கள் உள்ளதால் ‘அவர்களுக்கு’ என்று பன்மையாக்குதல்.
  rationale: எபிரெய மூலத்தில் ஒருமை இருப்பதால் அதைச் சீராக்கிப் பன்மையாக்காமல் பாதுகாக்கப்பட்டது. அதே நேரத்தில் முந்தைய வாக்கியம் ஆரோனின் மகன்களும் பெறுநர்கள் என்பதைத் தெளிவாகக் காட்டுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான சட்டநடை பயன்படுத்தப்பட்டது. ‘மகன்கள்’ எனப் பாலினத் துல்லியம் காக்கப்பட்டது; மூலத்தின் ஒருமை ‘அவனுக்கு’ என்பதும் மாற்றப்படவில்லை.
