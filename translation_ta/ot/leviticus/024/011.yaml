  edition: WLC
  text: וַ֠/יִּקֹּב בֶּן הָֽ/אִשָּׁ֨ה הַ/יִּשְׂרְאֵלִ֤ית אֶת הַ/שֵּׁם֙ וַ/יְקַלֵּ֔ל וַ/יָּבִ֥יאוּ אֹת֖/וֹ אֶל מֹשֶׁ֑ה וְ/שֵׁ֥ם אִמּ֛/וֹ שְׁלֹמִ֥ית בַּת דִּבְרִ֖י לְ/מַטֵּה דָֽן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/011.yaml
  text: The son of the Israelite woman blasphemed the Name and cursed[a], and they brought him to Moses. Now his mother's name was Shelomith daughter of Dibri, of the tribe of Dan.
translation:
  language: ta
  text: இஸ்ரயேலியப் பெண்ணின் மகன் திருநாமத்தைத் தெளிவாக உச்சரித்துச் சபித்தான்[a]; அவர்கள் அவனை மோசேயிடம் கொண்டுவந்தார்கள். அவனுடைய தாயின் பெயர் திப்ரியின் மகளான செலோமித்; அவள் தாண் கோத்திரத்தைச் சேர்ந்தவள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “திருநாமத்தைத் தூஷித்துச் சபித்தான்.” இங்குள்ள எபிரெய வினைச்சொல் ‘தெளிவாக உச்சரித்தல்’ என்றும், இந்தச் சூழலில் ‘தூஷித்தல்’ என்றும் புரிந்துகொள்ளப்படலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקֹּב
  choice: தெளிவாக உச்சரித்தான்
  rationale: נקב என்பதற்கு ‘குறிப்பிடுதல்/தெளிவாகச் சொல்லுதல்’ என்ற பொருள் உண்டு. அடுத்து தனியாக வரும் וַיְקַלֵּל (‘சபித்தான்’) என்பதையும் வேறுபடுத்திக் காட்டுவதற்காக இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: בֶּן הָאִשָּׁה הַיִּשְׂרְאֵלִית
  choice: இஸ்ரயேல் பெண்ணின் மகன்
  rationale: எபிரெயக் கட்டமைப்பை இயல்பான நவீன தமிழில் நேரடியாகக் காட்டுகிறது.
- source_word: אֶת הַשֵּׁם
  choice: திருப்பெயரை
  rationale: குறிப்பிட்ட இறைப் பெயரை மரியாதையுடன் சுட்டும் ‘அந்தப் பெயர்’ என்ற எபிரெயப் பயன்பாட்டை இயல்பான தமிழில் ‘திருப்பெயர்’ என வழங்குகிறது; குறிப்பிட்ட பெயரை உரையில் சேர்க்கவில்லை.
- source_word: וַיְקַלֵּל
  choice: சபித்தான்
  rationale: קלל என்பதன் பியேல் வடிவத்திற்குரிய நேரடியான பொருளை வழங்குகிறது; முந்தைய வினையுடன் இதை ஒன்றாக்கவில்லை.
- source_word: וַיָּבִיאוּ אֹתוֹ אֶל מֹשֶׁה
  choice: அவர்கள் அவனை மோசேயிடம் கொண்டுவந்தார்கள்
  rationale: எபிரெயத்தில் செய்பவர் குறிப்பிடப்படாத மூன்றாம் நபர் பன்மை வடிவத்தைத் தமிழிலும் ‘அவர்கள்’ என்று தக்கவைக்கிறது.
- source_word: וְשֵׁם אִמּוֹ
  choice: அவனுடைய தாயின் பெயர்
  rationale: பின்னணித் தகவலை அறிமுகப்படுத்தும் இயல்பான தமிழ் அமைப்பு.
- source_word: שְׁלֹמִית בַּת דִּבְרִי
  choice: திப்ரியின் மகளான செலோமித்
  rationale: தனிப்பெயர்களைத் தமிழில் ஒலிபெயர்த்து, தந்தை–மகள் உறவைத் தெளிவாகக் காட்டுகிறது.
- source_word: לְמַטֵּה דָן
  choice: தாண் கோத்திரத்தைச் சேர்ந்தவள்
  rationale: கோத்திரச் சார்பைக் குறிக்கும் எபிரெய மரபுத்தொடரின் தெளிவான தமிழ் இணை.
theological_decisions:
- issue: נקב என்ற வினைச்சொல் ‘திருப்பெயர்’ என்பதுடன் வரும் இடத்தில் தரும் பொருள்
  choice: திருப்பெயரைத் தெளிவாக உச்சரித்தான்; பின்னர் சபித்தான் என்ற இரு செயல்களாக மொழிபெயர்த்தல்
  alternative: ‘திருப்பெயரைத் தூஷித்தான், சபித்தான்’ என்று முதல் வினையையே தூஷித்தல் எனப் புரிந்துகொள்ளுதல்
  rationale: எபிரெயத்தில் נקב, קלל என்ற இரு வினைகள் தனித்தனியாக வருகின்றன. இரண்டையும் தனித்த செயல்களாகத் தக்கவைப்பது மூலத்தின் சொற்பொருள் வாய்ப்பையும் அதன் தெளிவின்மையையும் பாதுகாக்கிறது; மாற்றுப் புரிதல் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘திருப்பெயர்’ என்பது இறைப் பெயருக்கான மரியாதையான குறிப்பு. ‘கோத்திரம்’ வேதாகமச் சமூக அமைப்பைக் குறிக்கும் பரவலாக அறியப்பட்ட சொல்லாகத் தக்கவைக்கப்பட்டது.
