revisions:
- from: இஸ்ரயேல் பெண்ணின் மகன் திருப்பெயரைத் தெளிவாக உச்சரித்துச் சபித்தான்[a]. ஆகவே, அவர்கள் அவனை மோசேயிடம் கொண்டுவந்தார்கள். அவனுடைய தாயின் பெயர் திப்ரியின் மகளான செலோமித்; அவள் தாண் கோத்திரத்தைச் சேர்ந்தவள்.
  to: இஸ்ரயேலியப் பெண்ணின் மகன் திருநாமத்தைத் தெளிவாக உச்சரித்துச் சபித்தான்[a]; அவர்கள் அவனை மோசேயிடம் கொண்டுவந்தார்கள். அவனுடைய தாயின் பெயர் திப்ரியின் மகளான செலோமித்; அவள் தாண் கோத்திரத்தைச் சேர்ந்தவள்.
  rationale: The revision removes the added causal sense, improves idiomatic identification of the woman as Israelite, and uses established Tamil biblical terminology for the reverential reference to the divine Name. It retains the main reading that distinguishes explicit utterance from cursing, while preserving the alternative ‘blasphemed’ sense in the anchored footnote.
