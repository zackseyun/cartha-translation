  text: וַ/יַּנִּיחֻ֖/הוּ בַּ/מִּשְׁמָ֑ר לִ/פְרֹ֥שׁ לָ/הֶ֖ם עַל פִּ֥י יְהוָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/012.yaml
  text: So they put him in custody[a], to clarify for them according to the word of Yahweh.
translation:
  language: ta
  text: யாவேயின் வார்த்தையின்படி அவர்களுக்குத் தெளிவுபடுத்துவதற்காக[a], அவர்கள் அவனைக் காவலில் வைத்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுக்கு விளக்கிக் கூறுவதற்காக” அல்லது “அவர்களுக்குத் திட்டவட்டமாக அறிவிப்பதற்காக.” எபிரெய வினைச்சொல் ஒரு காரியத்தை வெளிப்படையாகத் தெளிவாக்குவதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּנִּיחֻהוּ
  choice: அவர்கள் அவனைக் … வைத்தார்கள்
  rationale: הניח என்பதன் காரணவினைப் பொருளான ‘வை, இடு’ என்பதையும், தொடர் நிகழ்வைக் குறிக்கும் வாவையும் இயல்பான தமிழ் கதைநடையில் வெளிப்படுத்துகிறது.
- source_word: בַּמִּשְׁמָר
  choice: காவலில்
  rationale: מִשְׁמָר இங்கு வெறுமனே கண்காணிப்பை அல்ல, சட்டச் சூழலில் பாதுகாப்புடன் அடைத்து வைத்திருப்பதைக் குறிக்கிறது; ‘காவலில்’ என்பது தெளிவான நவீனத் தமிழ்.
- source_word: לִפְרֹשׁ
  choice: தெளிவுபடுத்துவதற்காக
  rationale: פרשׁ என்பதன் ‘தெளிவாக்கு, விளக்கிக் கூறு, திட்டவட்டமாக அறிவி’ என்ற பொருளை, வெளிப்படையாகக் குறிப்பிடப்படாத ‘தீர்ப்பு’ போன்ற செயப்படுபொருளைச் சேர்க்காமல் காக்கிறது.
- source_word: לָהֶם
  choice: அவர்களுக்கு
  rationale: தெளிவைப் பெறக் காத்திருந்த சமூகத்தார் அல்லது பொறுப்பாளர்களைக் குறிக்கும் பன்மை மறைமுகச் செயப்படுபொருளை நேரடியாகப் பிரதிபலிக்கிறது.
- source_word: עַל־פִּי
  choice: வார்த்தையின்படி
  rationale: சொல்லர்த்தமாக ‘வாயின்படி’ என்றாலும், அதிகாரமுள்ள உரைக்கு இணங்க என்பதே இங்குள்ள எபிரெய மரபுத்தொடரின் பொருள்; ‘வார்த்தையின்படி’ அதன் வாய்மொழி மற்றும் அதிகார நுணுக்கங்களைப் பேணுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தேவனுடைய தனிப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரை ஒரு பட்டத்தை அல்ல, நான்கெழுத்து இறைப் பெயரையே பயன்படுத்துகிறது; ஆகவே தனிப்பெயர் ஒலிபெயர்க்கப்பட்டது.
- issue: לִפְרֹשׁ என்பதன் வெளிப்படையாகக் கூறப்படாத செயப்படுபொருள்
  choice: அவர்களுக்குத் தெளிவுபடுத்துவதற்காக
  alternative: தீர்ப்பை அவர்களுக்குத் தெளிவுபடுத்துவதற்காக
  rationale: சட்டச் சூழல் ஒரு தீர்ப்பைக் குறிப்பதாக இருக்கலாம்; எனினும் ‘தீர்ப்பு’ என்பது எபிரெய உரையில் வெளிப்படையாக இல்லை. எனவே மூலத்தின் சுருக்கத்தையும் திறந்த தன்மையையும் காக்க அது சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. நோக்கத்தைக் குறிக்கும் சொற்றொடர் தமிழில் தெளிவாக அமைய முன்வைக்கப்பட்டுள்ளது; மூலத்தில் இல்லாத ‘தீர்ப்பு’ அல்லது ‘வரை’ சேர்க்கப்படவில்லை.
