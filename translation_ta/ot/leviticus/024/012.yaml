  source_fidelity: மூல எபிரெயத்தின் நிகழ்வுத் தொடரான ‘அவர்கள் அவனை வைத்தார்கள்,’ காவல்/தடுப்புக் காவல் என்ற מִשְׁמָר-இன் சட்டச் சூழல், அவர்களுக்காக ஒரு விஷயத்தைத் தெளிவுபடுத்தும் நோக்கம், மற்றும் யாவேயின் அதிகாரமிக்க வார்த்தையின்படி என்பவை அனைத்தும் துல்லியமாகப் பிரதிபலிக்கப்படுகின்றன. மூலத்தில் வெளிப்படையாக இல்லாத ‘தீர்ப்பு’ போன்ற செயப்படுபொருள் சேர்க்கப்படவில்லை.
  naturalness: ‘யாவேயின் வார்த்தையின்படி அவர்களுக்குத் தெளிவுபடுத்துவதற்காக, அவர்கள் அவனைக் காவலில் வைத்தார்கள்’ என்பது நவீன நிலையான தமிழில் தெளிவாகவும் கண்ணியமான வேதாகம நடையிலும் உள்ளது. நோக்கச் சொற்றொடரை முன்னிலைப்படுத்துவது சற்றே முறையான நடை என்றாலும் இயல்பானதும் பொருள் தெளிவானதும் ஆகும்.
