  text: וּ/מַכֵּ֥ה נֶֽפֶשׁ בְּהֵמָ֖ה יְשַׁלְּמֶ֑/נָּה נֶ֖פֶשׁ תַּ֥חַת נָֽפֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/018.yaml
  text: 'And whoever strikes down an animal shall make restitution for it: life for life[a].'
translation:
  language: ta
  text: 'ஒரு விலங்கைக் கொல்கிறவன் அதற்காக ஈடுசெய்ய வேண்டும்: உயிருக்கு உயிர்[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில்: “உயிருக்கு உயிர்.” விலங்கைக் கொன்றதற்கான இழப்பீட்டுச் சூழலில், இச்சொற்றொடர் சமமான ஈட்டைக் குறிக்கிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַכֵּה נֶפֶשׁ בְּהֵמָה
  choice: ஒரு மிருகத்தைக் கொல்கிறவன்
  rationale: נכה என்பதன் ஹிஃபில் வினையெச்சம் பொதுவான சட்டநிலையைச் சுட்டுகிறது. அதன் நேரடிப் பொருள் ‘அடிக்கிறவன்’ என்றாலும், ‘மிருகத்தின் உயிரை’ பொருளாகக் கொண்டதால் இங்கு மரணத்தை விளைவிக்கும் செயல் குறிக்கப்படுகிறது; இயல்பான தமிழில் ‘கொல்கிறவன்’ இதைத் தெளிவாகத் தருகிறது.
- source_word: נֶפֶשׁ
  choice: உயிர்
  rationale: இங்கு נֶפֶשׁ என்பது உடலிலிருந்து பிரிந்த ‘ஆத்துமா’ என்ற கருத்தை அல்ல, மிருகத்தின் உயிரையே குறிக்கிறது.
- source_word: בְּהֵמָה
  choice: மிருகம்
  rationale: בְּהֵמָה என்பது பொதுவாக மிருகத்தைக் குறிக்கிறது. சூழலில் உடைமையான கால்நடையாக இருக்கக்கூடும்; ஆனாலும் மூலச்சொல்லின் பொதுவான பரப்பை ‘மிருகம்’ காக்கிறது.
- source_word: יְשַׁלְּמֶנָּה
  choice: அதற்காக ஈடுசெய்ய வேண்டும்
  rationale: שלם என்பதன் பியேல் வடிவம் இழப்பீடு அல்லது ஈடு செய்தலைக் குறிக்கிறது. பெண்பால் ஒருமை பின்னொட்டு முன்னுள்ள בְּהֵמָה-வைச் சுட்டுவதால் ‘அதற்காக’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: נֶפֶשׁ תַּחַת נָפֶשׁ
  choice: உயிருக்கு உயிர்
  rationale: எபிரெயச் சட்ட வாய்பாட்டின் சுருக்கத்தையும் இணைநிலையையும் காக்கிறது. இச்சூழலில் இது கொல்லப்பட்ட மிருகத்திற்குச் சமமான ஈட்டை வலியுறுத்துகிறது; ஈட்டின் துல்லியமான முறையை மொழிபெயர்ப்பு கூடுதலாக நிர்ணயிக்கவில்லை.
theological_decisions:
- issue: மிருகம் கொல்லப்பட்ட சூழலில் ‘உயிருக்கு உயிர்’ என்ற ஈட்டு வாய்பாட்டின் பொருள்
  choice: கொல்லப்பட்ட மிருகத்திற்குச் சமமான ஈடு செய்ய வேண்டும் என்ற கட்டளை; ‘உயிருக்கு உயிர்’ என்ற மூல வாய்பாடு அப்படியே பாதுகாக்கப்படுகிறது.
  alternative: இதனை, மாற்றாக இன்னொரு மிருகத்தையே கட்டாயம் கொடுக்க வேண்டும் என்று மிக நேரடியாகப் புரிந்துகொள்ளலாம்; அல்லது பொருள்/பண இழப்பீட்டைக் குறிக்கும் சட்ட வாய்பாடாகப் புரிந்துகொள்ளலாம்.
  rationale: ‘ஈடுசெய்ய வேண்டும்’ என்ற வினைச்சொல் இறுதி வாய்பாட்டை வழிநடத்துகிறது. ஆகவே சமமான ஈடு என்ற பொருள் தெளிவாகிறது; ஆனால் மூலவசனம் குறிப்பிடாத குறிப்பிட்ட ஈட்டுமுறையை மொழிபெயர்ப்பு சேர்க்கவில்லை.
translation_notes:
  register: நவீன பொதுத் தமிழில் இயல்பாகவும் சட்டவாக்கியத்துக்கேற்ற கண்ணியத்துடனும் அமைக்கப்பட்டது. ‘ஆத்துமா’ தவிர்க்கப்பட்டு, נֶפֶשׁ என்பதன் சூழல்சார் பொருளான ‘உயிர்’ பயன்படுத்தப்பட்டது; ‘ஈடுசெய்ய வேண்டும்’ என்பது கட்டளையின் சட்டத் தன்மையைத் தெளிவாக்குகிறது.
