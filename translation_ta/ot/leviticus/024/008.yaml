revisions:
- from: ஒவ்வொரு ஓய்வுநாளிலும்[a] அவன் அதை[b] யாவேக்கு முன்பாகத் தொடர்ந்து ஒழுங்குபடுத்தி வைக்க வேண்டும்; அது இஸ்ரவேல் மக்களிடமிருந்து வரும் நிரந்தர உடன்படிக்கையாகும்.[c]
  to: ஒவ்வொரு ஓய்வுநாளிலும்[a] அவன் அதை[b] யாவேக்கு முன்பாகத் தொடர்ந்து ஒழுங்காக அமைக்க வேண்டும். இது இஸ்ரவேல் மக்களிடமிருந்து வரும் நிரந்தர உடன்படிக்கைச் சார்ந்த ஏற்பாடாகும்.[c]
