base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/008.yaml
  text: Every Sabbath day he shall arrange it before Yahweh continually[c][b][a], from the sons of Israel as an everlasting covenant.
translation:
  language: ta
  text: ஒவ்வொரு ஓய்வுநாளிலும்[a] அவன் அதை[b] யாவேக்கு முன்பாகத் தொடர்ந்து ஒழுங்காக அமைக்க வேண்டும். இது இஸ்ரவேல் மக்களிடமிருந்து வரும் நிரந்தர உடன்படிக்கைச் சார்ந்த ஏற்பாடாகும்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “ஓய்வுநாளில், ஓய்வுநாளில்”; அதாவது, ஒவ்வொரு ஓய்வுநாளிலும் அல்லது ஓய்வுநாள்தோறும்.
    reason: lexical_alternative
  - marker: b
    text: “அதை” என்பது அப்பங்களின் முழு அடுக்கையும் ஒரே தொகுதியாகக் குறிக்கிறது. இதை “அதை வரிசையாக அமைக்க வேண்டும்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: எபிரெயத்தில், “நிரந்தர உடன்படிக்கை”; “என்றென்றைக்கும் நிலைக்கும் உடன்படிக்கை” என்றும் மொழிபெயர்க்கலாம். இச்சொற்றொடர் இஸ்ரவேல் மக்களிடமிருந்து வரும் இந்த ஆசார ஏற்பாட்டின் நீடித்த உடன்படிக்கைத் தன்மையைக் குறிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּיוֹם הַשַּׁבָּת בְּיוֹם הַשַּׁבָּת
  choice: ஒவ்வொரு ஓய்வுநாளிலும்
  rationale: எபிரெயச் சொல்லாட்சி ‘ஓய்வுநாளில், ஓய்வுநாளில்’ எனத் திரும்ப வருகிறது; இங்கு அது ஒவ்வொரு ஓய்வுநாளிலும் நிகழும் முறையான தொடர்ச்சியைக் குறிக்கிறது.
- source_word: יַעַרְכֶנּוּ
  choice: அவன் அதை ஒழுங்குபடுத்தி வைக்க வேண்டும்
  rationale: ערך என்பது சடங்குப் பொருட்களை வரிசைப்படுத்துதல் அல்லது ஒழுங்காக அமைத்தல் என்பதைக் குறிக்கிறது. ஒருமை பின்னொட்டு அப்பங்களின் முழு அமைப்பையும் ஒரு தொகுதியாகச் சுட்டுகிறது.
- source_word: לִפְנֵי יְהוָה
  choice: யாவேக்கு முன்பாக
  rationale: இது யாவேயின் முன்னிலையில் படைக்கப்படுவதைக் குறிக்கும் வழக்கமான ஆசாரச் சொல்லாட்சி; יהוה என்ற தனிப்பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: תָּמִיד
  choice: தொடர்ந்து
  rationale: இங்கு இடைவிடாத செயலைவிட ஒவ்வொரு வாரமும் முறையாகத் தொடரும் ஆசார அனுசரிப்பே நோக்கமாக உள்ளது.
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்களிடமிருந்து வரும்
  rationale: מֵאֵת மூலத்தையோ தோற்றத்தையோ குறிக்கிறது. בְּנֵי יִשְׂרָאֵל என்ற ஆண்பால் வடிவம் இங்கு மொத்த சமூகத்தைக் குறிக்கும் வழக்குச் சொல்லாக இருப்பதால் இயல்பான தமிழில் ‘இஸ்ரவேல் மக்கள்’ என வழங்கப்பட்டுள்ளது.
- source_word: בְּרִית עוֹלָם
  choice: நிரந்தர உடன்படிக்கை
  rationale: சொல்லாட்சியின் உடன்படிக்கைத் தன்மையையும் நீடித்த நிலைப்பையும் நேரடியாகப் பாதுகாக்கிறது; ‘கடமை’ போன்ற விளக்கச் சொல்லை மூலத்தில் இல்லாமல் சேர்க்கவில்லை.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் நான்கு எழுத்துகளைக் கொண்ட இறைத் தனிப்பெயர் நேரடியாக இருப்பதால், பட்டப்பெயராக மாற்றாமல் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- issue: בְּנֵי יִשְׂרָאֵל என்ற சமூகக் குறிப்பு
  choice: இஸ்ரவேல் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரெய ஆண்பால் பன்மை இங்கு ஆண் உறுப்பினர்களை மட்டும் கட்டுப்படுத்தாமல் உடன்படிக்கைச் சமூகத்தை மொத்தமாகக் குறிக்கிறது; ‘மக்கள்’ என்பது அந்தக் கூட்டு அர்த்தத்தைத் தெளிவாக வழங்குகிறது.
- issue: בְּרִית עוֹלָם என்பதன் ஆசாரச் சூழல்
  choice: நிரந்தர உடன்படிக்கை
  alternative: நிரந்தர உடன்படிக்கைக் கடமை
  rationale: சட்ட-ஆசாரப் பின்னணி கடமையை உணர்த்தினாலும், மூலத்தின் உடன்படிக்கை மொழியை விளக்க விரிவாக்கமின்றிப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, மரியாதைமிக்க ஆசார மொழிநடை பயன்படுத்தப்பட்டுள்ளது. ‘ஓய்வுநாள்’, ‘உடன்படிக்கை’ போன்ற பரவலாக அறியப்பட்ட வேதாகமச் சொற்கள் தக்கவைக்கப்பட்டுள்ளன; மூலத்தின் வாராந்திரத் தொடர்ச்சியும் இறுதிச் சொற்றொடரின் இலக்கணத் திறந்தநிலையும் அடிக்குறிப்புகளில் பதிவு செய்யப்பட்டுள்ளன.
