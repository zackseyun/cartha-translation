  text: וְ/אִ֕ישׁ כִּ֥י יַכֶּ֖ה כָּל נֶ֣פֶשׁ אָדָ֑ם מ֖וֹת יוּמָֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/017.yaml
  text: And if a man strikes down any human being[b][a], he shall surely be put to death.
translation:
  language: ta
  text: மேலும், ஒருவன் எந்த மனிதரையும்[a] அடித்துக் கொன்றால்[b], அவன் நிச்சயமாகக் கொல்லப்பட வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்சொல்லாக, ‘எந்த மனித உயிரையும்.’ இங்கு ‘உயிர்’ என்பது உடலற்ற ஓர் ‘ஆத்துமாவை’த் தனியாகக் குறிக்காமல், ஒரு மனித நபரையோ மனித உயிரையோ குறிக்கிறது. ‘எந்த மனித உயிரையும்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘எந்த மனிதரையும் கொன்றால்.’ எபிரெய வினைச்சொல் சொற்சொல்லாக ‘அடித்தால்’ எனப் பொருள்படும்; இச்சூழலில் அது உயிரைப் பறிக்கும் அடியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אִישׁ
  choice: மேலும், ஒருவன்
  rationale: וְ முந்தைய சட்டத்துடன் உள்ள தொடர்பைத் தொடர்கிறது; אִישׁ ஆண்பால் ஒருமை என்பதால், அதன் வடிவை மறைக்காமல் இயல்பான தமிழில் ‘ஒருவன்’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: כִּי
  choice: -ஆல்
  rationale: நிபந்தனைச் சட்ட வாக்கியத்தில் כִּי ‘என்றால்/ஆல்’ என்ற பொருளில் வருகிறது; தமிழில் வினையெச்ச நிபந்தனை இயல்பாகப் பயன்படுத்தப்பட்டது.
- source_word: יַכֶּה
  choice: அடித்துக் கொன்றால்
  rationale: נכה என்பதன் அடிப்படைப் பொருள் ‘அடி’; இங்கு அதன் விளைவு மரணம் என்பது பொருளாலும் அடுத்து வரும் மரணத் தண்டனையாலும் தெளிவாகிறது. ‘அடித்துக் கொல்’ செயற்பாட்டின் உருவகத்தையும் உயிரிழப்பையும் ஒருங்கே தெரிவிக்கிறது.
- source_word: כָּל נֶפֶשׁ אָדָם
  choice: எந்த மனிதரையும்
  rationale: נֶפֶשׁ இங்கு உடலற்ற ‘ஆத்துமா’ என்பதல்ல; மனித நபரையோ மனித உயிரையோ குறிக்கிறது. முதன்மை உரையில் ‘எந்த மனிதரையும்’ என்பது இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: מוֹת יוּמָת
  choice: நிச்சயமாகக் கொல்லப்பட வேண்டும்
  rationale: வினையெச்ச முழுவடிவமும் செயல்பாட்டு வினையும் சேர்ந்த எபிரெய தீவிரப்படுத்தும் அமைப்பு தண்டனையின் உறுதியை வலியுறுத்துகிறது; செயப்பாட்டு வடிவமும் காக்கப்பட்டுள்ளது.
theological_decisions:
- issue: נֶפֶשׁ אָדָם என்பதன் பொருள்
  choice: மனிதர்
  alternative: மனித உயிர் / ஆத்துமா
  rationale: இச்சட்டச் சூழலில் இச்சொற்றொடர் கொல்லப்பட்ட மனித நபரைக் குறிக்கிறது; மனித உடலிலிருந்து பிரிந்த ஓர் ‘ஆத்துமா’ என்ற பிற்கால கருத்தை உரைக்குள் புகுத்தவில்லை. ‘மனித உயிர்’ என்பதும் சாத்தியமான நெருக்கமான மொழிபெயர்ப்பு என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: אִישׁ என்பதிலுள்ள ஆண்பால் வடிவம்
  choice: ஒருவன்
  alternative: எவர் / ஒருவர்
  rationale: மூலத்தில் ஆண்பால் ஒருமை வெளிப்படையாக இருப்பதால் அதை முதன்மை உரையில் தக்கவைத்துள்ளோம்; சட்டத்தின் பயன்பாட்டு எல்லையை இதன்மூலம் கூடுதலாக வரையறுக்கவில்லை.
- issue: மரணத் தண்டனைச் சூத்திரம்
  choice: நிச்சயமாகக் கொல்லப்பட வேண்டும்
  alternative: மரணதண்டனை விதிக்கப்பட வேண்டும்
  rationale: மூலத்தின் செயப்பாட்டு சட்டச் சூத்திரத்தையும் அதன் வலியுறுத்தலையும் காக்கிறது; ‘மரணதண்டனை’ என்ற சுருக்கமான நிர்வாகச் சொல்லால் மூலத்தின் சொல்வடிவம் மாற்றப்படவில்லை.
translation_notes:
  register: நவீன தரநிலைத் தமிழில் சுருக்கமான, கண்ணியமான சட்ட நடையைப் பயன்படுத்தியுள்ளோம். ‘ஒருவன்’ மூலத்தின் ஆண்பால் ஒருமையைத் தக்கவைக்கிறது; ‘எந்த மனிதரையும்’ பாதிக்கப்பட்டவரை பாலினம் சாராமல் தெளிவாகக் குறிக்கிறது. ‘நிச்சயமாக’ எபிரெய தீவிரப்படுத்தலை வெளிப்படுத்துகிறது.
