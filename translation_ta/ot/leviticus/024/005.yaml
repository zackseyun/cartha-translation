  text: וְ/לָקַחְתָּ֣ סֹ֔לֶת וְ/אָפִיתָ֣ אֹתָ֔/הּ שְׁתֵּ֥ים עֶשְׂרֵ֖ה חַלּ֑וֹת שְׁנֵי֙ עֶשְׂרֹנִ֔ים יִהְיֶ֖ה הַֽ/חַלָּ֥ה הָ/אֶחָֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/005.yaml
  text: And you shall take fine flour and bake it into twelve loaves[b][a]; each loaf shall be of two-tenths of an ephah.
translation:
  language: ta
  text: நீ நுண்ணிய மாவை எடுத்து, அதிலிருந்து பன்னிரண்டு அப்பங்களைச்[a] சுட வேண்டும். ஒவ்வொரு அப்பத்திற்கும் ஓர் எப்பாவில் பத்தில் இரு பங்கு மாவு இருக்க வேண்டும்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பன்னிரண்டு சுட்ட மாவுப் பண்டங்களாக.’ எபிரேயச் சொல் வழிபாட்டில் பயன்படுத்தப்பட்ட தனித்தனி சுட்ட அப்ப வகைகளைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரேயத்தில் சொற்பட, ‘இரண்டு பத்துப் பங்குகள்.’ ஆசாரிய அளவீட்டு வழக்கில் இது ஒவ்வோர் அப்பத்திற்கும் ஓர் எப்பாவில் பத்தில் இரு பங்கு என்பதைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: நீ ... எடுத்து
  rationale: அறிவுறுத்தல் தொடரில் உள்ள வாவ் இணைந்த நிறைவுவினை கட்டளையின் வலிமையைக் கொண்டுள்ளது; தமிழில் அடுத்த வினையுடன் இணைத்து இயல்பாக வழங்கப்பட்டுள்ளது.
- source_word: סֹלֶת
  choice: மெல்லிய மாவு
  rationale: பலியிடுதல் மற்றும் பரிசுத்த அப்பம் சார்ந்த சூழல்களில் பயன்படுத்தப்படும் நன்றாக அரைக்கப்பட்ட மாவைக் குறிக்கும் வழிபாட்டுச் சொல்; எந்தத் தானியம் என்று எபிரேயம் குறிப்பிடாததால் அதைச் சேர்க்கவில்லை.
- source_word: וְאָפִיתָ אֹתָהּ
  choice: அதைப் ... சுட வேண்டும்
  rationale: பெண்பால் ஒருமை சுட்டுப்பெயர் முன் கூறிய மாவைக் குறிக்கிறது; தமிழில் மாவை அப்பங்களாகச் சுடுதல் என்ற விளைவைக் காட்டும் இயல்பான தொடராக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: שְׁתֵּים עֶשְׂרֵה חַלּוֹת
  choice: பன்னிரண்டு அப்பங்கள்
  rationale: חַלּוֹת என்பது வழிபாட்டுச் சூழலில் சுடப்பட்ட தனித்தனி அப்பங்களைக் குறிக்கிறது; நவீன தமிழில் ‘அப்பங்கள்’ தெளிவானதும் இயல்பானதும் ஆகும்.
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: ஓர் எப்பாவில் பத்தில் இரண்டு பங்கு
  rationale: எபிரேயத்தில் சொற்பட ‘இரண்டு பத்துப் பங்குகள்’ என்று உள்ளது; ஆசாரிய அளவீட்டு மொழியில் எப்பா என்னும் நிலையான அளவு மறைமுகமாக இருப்பதால் வாசகருக்குத் தெளிவாக வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: יִהְיֶה הַחַלָּה הָאֶחָת
  choice: ஒவ்வோர் அப்பமும் ... அளவுள்ளதாக இருக்க வேண்டும்
  rationale: சொற்பட ‘அந்த ஓர் அப்பம் இருக்கும்’ என்றாலும், அளவு ஒவ்வொரு அப்பத்திற்கும் தனித்தனியாகப் பொருந்துவதைத் தமிழில் பகிர்ந்தளிக்கும் பொருளுடன் இயல்பாகத் தெரிவிக்கிறது.
