  to: நீ நுண்ணிய மாவை எடுத்து, அதிலிருந்து பன்னிரண்டு அப்பங்களைச்[a] சுட வேண்டும். ஒவ்வொரு அப்பத்திற்கும் ஓர் எப்பாவில் பத்தில் இரு பங்கு மாவு இருக்க வேண்டும்.[b]
