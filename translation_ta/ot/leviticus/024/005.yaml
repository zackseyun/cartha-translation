translation_notes:
  register: நவீன தரத் தமிழில், நடைமுறை அறிவுறுத்தலுக்கேற்ற தெளிவான மற்றும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. எபிரேய வாக்கியத்தின் கட்டளைத் தொடரும் ஒவ்வோர் அப்பத்திற்குமான அளவும் காக்கப்பட்டுள்ளன; மூலத்தில் இல்லாத தானிய வகை சேர்க்கப்படவில்லை.
