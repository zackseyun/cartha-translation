  terminology: ‘யாவே’ என்பது யְהוָה என்ற தனிப்பெயரைப் பட்டமாக மாற்றாமல் காக்கும் நிலையான ஒலிபெயர்ப்பாகும். ‘மோசே’ நவீனத் தமிழ் வேதாகமப் பயன்பாட்டில் அறியப்பட்ட வடிவம். அடிக்குறிப்பு மூல எபிரெய வடிவத்தையும் மரபுவழி ‘ஆண்டவர்’ மாற்றீட்டையும் பொருத்தமாகத் தெரிவிக்கிறது.
