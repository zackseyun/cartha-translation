  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/001.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: ta
  text: 'பின்பு யாவே[a] மோசேயிடம் இவ்வாறு கூறினார்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில்: “YHWH”; மரபாக “ஆண்டவர்” என்று மொழிபெயர்க்கப்படுகிறது.'
    reason: இறைப்பெயரின் மூலவடிவத்தையும் மரபுவழி மாற்றீட்டையும் தெரிவிக்கிறது.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பின்பு ... கூறினார்
  rationale: வாவ் தொடர்வினையுடன் வரும் இந்த வினை கதைநிகழ்வை அடுத்த கட்டத்துக்கு நகர்த்துகிறது. நவீன தமிழில் ‘பின்பு’ அதன் தொடர்ச்சியைக் காட்டுகிறது; ‘கூறினார்’ என்பது அடுத்து வரும் நேரடிப் பேச்சை இயல்பாக அறிமுகப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது தேவனுடைய தனிப்பெயரான நான்கு எபிரெய மெய்யெழுத்துப் பெயர் (YHWH). அதை ஒரு பட்டத்தால் மாற்றாமல், பொதுவாக ஏற்றுக்கொள்ளப்படும் உச்சரிப்பின் தமிழ் ஒலிபெயர்ப்பாக ‘யாவே’ என்று வழங்கப்பட்டுள்ளது.
- source_word: אֶל
  choice: -இடம்
  rationale: பேச்சு யாரை நோக்கிச் சொல்லப்பட்டது என்பதைக் குறிக்கும் எபிரெய முன்னிடைச்சொல்லுக்கு இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: מֹשֶׁה
  choice: மோசே
  rationale: מֹשֶׁה என்ற ஆள்பெயரின் தமிழில் நிலைபெற்ற வடிவம்.
- source_word: לֵאמֹר
  choice: 'இவ்வாறு கூறினார்:'
  rationale: இந்த வினையெச்ச வடிவம் தொடர்ந்து வரும் நேரடிப் பேச்சை அறிமுகப்படுத்துகிறது. எபிரெயச் சொல்லமைப்பைச் செயற்கையாக நகலெடுக்காமல், அதன் உரையாடல் செயல்பாட்டை ‘இவ்வாறு ...:’ என்ற இயல்பான தமிழ் அமைப்பு வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலவசனம் YHWH என்ற தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. இறைப்பெயரைப் பட்டமாக மாற்றாமல் காக்க ‘யாவே’ பயன்படுத்தப்பட்டுள்ளது; மரபுவழி மாற்றீடு அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீன, தெளிவான, மரியாதைமிக்க நடை. அடுத்து வரும் நேரடிப் பேச்சை இயல்பாக அறிமுகப்படுத்த முக்காற்புள்ளி பயன்படுத்தப்பட்டுள்ளது.
