  source_fidelity: மொத்தத்தில் மூலத்தின் சட்டப்பூர்வமான மரணதண்டனை வடிவம், கல்லெறிதல், மற்றும் குடியேறிய அந்நியர்/நாட்டில் பிறந்தவர் என்ற இணைநிலை நன்றாகக் காக்கப்பட்டுள்ளன. ஆனால் וְנֹקֵב மற்றும் בְּנָקְבוֹ ஆகிய இரண்டின் இலக்கணப் பங்கேற்பு ஆண்பால் ஒருமையில் இருப்பதால், தமிழில் ‘யாராவது’ எனப் பால்சார்பற்ற பொதுமைப்படுத்தாமல் ‘அவன்’ எனத் தொடர்வது மூலத்தின் வடிவத்திற்கு நெருக்கமானது. மேலும் ‘கல்லெறிந்து கொல்ல வேண்டும்’ என்பது பொருளில் சரியானதே; ஆயினும் ரָגוֹם יִרְגְּמוּ בוֹ என்பதன் நேரடி தண்டனை முறையை ‘கல்லெறிந்து அவனைக் கொல்ல வேண்டும்’ எனச் சொல்வது தெளிவான சொல்வரிசை அளிக்கும்.
  naturalness: ‘சபை முழுவதும்’ இக்காலத் தமிழில் தேவாலயச் சபையைக் குறிப்பதாகப் புரிய வாய்ப்புள்ளது. இஸ்ரவேலின் முழு சட்டச் சமூகத்தைக் குறிக்கும் עֵדָה-க்கு ‘முழுச் சமூகத்தினரும்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது. ‘குடியேறிய அந்நியன்’ மற்றும் ‘நாட்டில் பிறந்தவன்’ வாசிக்கத் தகுந்தவை.
  terminology: ‘யாவே’ என்பது யְהוָה-வின் ஏற்ற நவீனத் தமிழ் ஒலிபெயர்ப்பு. ‘தூஷித்தல்’ சட்ட/இறையியல் நடையில் நிலைபெற்ற சொல்; ஆனால் נקב-இன் விவாதத்திற்குரிய ‘பெயரைத் தெளிவாக உச்சரித்தல்’ மற்றும் ‘சபித்தல்’ என்ற மாற்றுவாய்ப்புகள் அடிக்குறிப்பில் தெளிவாகத் தங்க வேண்டும். இரண்டாம் ‘பெயர்’ முன்வந்த யாவேயின் பெயரையே சுட்டும் மரியாதைமிக்க பயன்பாடாகக் குறிக்கப்படுவது பொருத்தமானது.
