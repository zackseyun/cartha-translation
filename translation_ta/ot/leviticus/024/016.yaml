source:
  edition: WLC
  text: וְ/נֹקֵ֤ב שֵׁם יְהוָה֙ מ֣וֹת יוּמָ֔ת רָג֥וֹם יִרְגְּמוּ ב֖/וֹ כָּל הָ/עֵדָ֑ה כַּ/גֵּר֙ כָּֽ/אֶזְרָ֔ח בְּ/נָקְב/וֹ שֵׁ֖ם יוּמָֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/016.yaml
  text: Whoever blasphemes the name of Yahweh shall surely be put to death[a]; all the congregation shall certainly stone him[b]. The sojourner as well as the native-born—when he blasphemes the Name—shall be put to death.
translation:
  language: ta
  text: யாவேயின் பெயரைத் தூஷிக்கிறவன்[a] நிச்சயமாகக் கொல்லப்பட வேண்டும்; முழுச் சமூகத்தினரும் அவனைக் கல்லெறிந்து கொல்ல வேண்டும். குடியேறிய அந்நியனானாலும் நாட்டில் பிறந்தவனானாலும், அவன் அந்தப் பெயரைத்[b] தூஷிக்கும்போது கொல்லப்பட வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு ‘தூஷிக்கிறவன்’ என மொழிபெயர்க்கப்பட்ட எபிரெய வினைச்சொல், ‘பெயரைத் தெளிவாக உச்சரிக்கிறவன்’ அல்லது ‘பெயரைச் சபிக்கிறவன்’ என்றும் பொருள்படக்கூடும். இந்தச் சூழலில் இறைப்பெயரை இழிவுபடுத்துதல் என்ற பொருள் முதன்மையாக எடுக்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் இங்கு ‘பெயர்’ என்று மட்டும் உள்ளது; முன்பு குறிப்பிடப்பட்ட யாவேயின் பெயரைக் குறிக்கும் மரியாதைமிக்க மாற்றுப் பெயராக அது செயல்படுகிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וְנֹקֵב / בְּנָקְבוֹ
  choice: தூஷிக்கிறவன் / தூஷிக்கும்போது
  rationale: נקב என்பதற்கு ‘தெளிவாக உச்சரித்தல்/குறிப்பிடுதல்’ என்ற அடிப்படைப் பொருளும், இந்தச் சட்டச் சூழலில் இறைப்பெயரை இழிவுபடுத்துதல் என்ற பொருளும் இருக்கலாம். மரணதண்டனைக்குரிய குற்றத்தின் இயல்பை இயல்பான தமிழில் தெரிவிக்க ‘தூஷித்தல்’ தேர்ந்தெடுக்கப்பட்டது; வேறு சாத்தியங்கள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டன.
- source_word: שֵׁם יְהוָה
  choice: யாவேயின் பெயர்
  rationale: שֵׁם என்பது ‘பெயர்’; יהוה என்பது உடன்படிக்கையின் இறைப்பெயர். அதை பொதுப்பட்டமான ‘கர்த்தர்’ என்று மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்ப்பது மூலத்தின் தனிப்பெயரைப் பாதுகாக்கிறது.
- source_word: מוֹת יוּמָת
  choice: நிச்சயமாகக் கொல்லப்பட வேண்டும்
  rationale: வினையெச்சப் பெயர்ச்சொல் மற்றும் வரையறுக்கப்பட்ட வினை இணைந்து மரணதண்டனையின் உறுதியையும் சட்டக் கட்டாயத்தையும் வலியுறுத்துகின்றன. செயப்பாட்டுவினை வடிவமும் பாதுகாக்கப்பட்டது.
- source_word: רָגוֹם יִרְגְּמוּ בוֹ
  choice: அவனைக் கல்லெறிந்து கொல்ல வேண்டும்
  rationale: எபிரெய வலியுறுத்தல் அமைப்பு தண்டனையின் கட்டாயத்தைக் காட்டுகிறது. தமிழில் ‘கல்லெறிதல்’ மட்டும் காயப்படுத்துதலாகவும் புரியக்கூடும் என்பதால், இங்கு மரணதண்டனை நிறைவேற்றப்படுவதைத் தெளிவாகச் சொல்ல ‘கல்லெறிந்து கொல்ல’ என வழங்கப்பட்டது.
- source_word: כָּל הָעֵדָה
  choice: சபை முழுவதும்
  rationale: עֵדָה என்பது ஒன்றுகூடிய உடன்படிக்கைச் சமூகத்தைச் சுட்டுகிறது. ‘சபை முழுவதும்’ என்பது அதன் கூட்டு மற்றும் சட்டப்பூர்வப் பங்கைச் சுருக்கமாகக் காட்டுகிறது.
- source_word: כַּגֵּר
  choice: குடியேறிய அந்நியன்
  rationale: גֵּר என்பது இஸ்ரவேலரிடையே வசிக்கும் பிறநாட்டவரைக் குறிக்கிறது; வெறுமனே வழிப்போக்கனை அல்ல. ‘குடியேறிய அந்நியன்’ அந்த நிலையைத் தெளிவாக்குகிறது.
- source_word: כָּאֶזְרָח
  choice: நாட்டில் பிறந்தவன்
  rationale: אֶזְרָח என்பது குடியேறிய அந்நியனுக்கு மாறாக நாட்டைச் சேர்ந்த பூர்வீக நபரைக் குறிக்கிறது.
- source_word: בְּנָקְבוֹ שֵׁם
  choice: அந்தப் பெயரைத் தூஷிக்கும்போது
  rationale: 'בְּ + வினையெச்சப் பெயர்ச்சொல் இங்கு காலம் அல்லது சூழ்நிலையைக் குறிக்கிறது: ‘அவன் ... செய்யும்போது.’ தனித்து வரும் שֵׁם முன்பு குறிப்பிடப்பட்ட இறைப்பெயரைச் சுட்டுவதால் ‘அந்தப் பெயர்’ என வழங்கப்பட்டது.'
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் நான்கெழுத்து இறைப்பெயர் நேரடியாக உள்ளது. பொதுப்பட்டத்தைப் பதிலிடாமல் தனிப்பெயரை ஒலிபெயர்ப்பது மூலச் சான்றைத் தெளிவாகப் பாதுகாக்கிறது.
- issue: נקב என்ற வினைச்சொல் இறைப்பெயருடன் வரும் இடத்தின் பொருள்
  choice: தூஷித்தல்
  alternative: பெயரை உச்சரித்தல் / பெயரைச் சபித்தல்
  rationale: சூழல் இறைப்பெயரை அவமதிக்கும் கடுமையான குற்றத்தைக் காட்டுகிறது; வெறும் பெயர் உச்சரிப்பே குற்றம் என்று தீர்மானிப்பதை ‘தூஷித்தல்’ தவிர்க்கிறது. இருப்பினும் எபிரெயச் சொல்லின் உண்மையான சொற்பொருள் ஐயம் அடிக்குறிப்பில் வெளிப்படையாக வைக்கப்பட்டுள்ளது.
- issue: குடியேறிய அந்நியனுக்கும் நாட்டில் பிறந்தவனுக்கும் ஒரே சட்டம்
  choice: இருவரும் ஒரே தண்டனைக்கு உட்படுவர்
  alternative: இஸ்ரவேலருக்கு மட்டும் இச்சட்டம் பொருந்தும்
  rationale: כַּגֵּר כָּאֶזְרָח என்ற நேரடி ஒப்புமை பிறப்பிட வேறுபாடின்றி இத்தண்டனை பொருந்துவதைத் தெளிவாகக் கூறுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சட்ட உரைக்கேற்ற கண்ணியமான மற்றும் நேரடியான நடை பயன்படுத்தப்பட்டுள்ளது. ‘சபை முழுவதும்,’ ‘கொல்லப்பட வேண்டும்’ போன்ற சொற்றொடர்கள் மூலத்தின் பொதுச் சமூகப் பொறுப்பையும் செயப்பாட்டு சட்ட வடிவையும் காக்கின்றன; נקב என்பதிலுள்ள சொற்பொருள் ஐயம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
