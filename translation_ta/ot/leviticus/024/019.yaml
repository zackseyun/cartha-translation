source:
  edition: WLC
  text: וְ/אִ֕ישׁ כִּֽי יִתֵּ֥ן מ֖וּם בַּ/עֲמִית֑/וֹ כַּ/אֲשֶׁ֣ר עָשָׂ֔ה כֵּ֖ן יֵעָ֥שֶׂה לּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/019.yaml
  text: And if a man inflicts an injury on his fellow[a], just as he has done[b], so it shall be done to him.
translation:
  language: ta
  text: ஒருவன் தன் சகமனிதனுக்கு உடற்காயம் ஏற்படுத்தினால்[a], அவன் செய்தபடியே அவனுக்கும் செய்யப்பட வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: ‘தன் சகமனிதனுக்கு ஒரு குறை அல்லது ஊனத்தை ஏற்படுத்தினால்.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ כִּי
  choice: ஒருவன் ... ஏற்படுத்தினால்
  rationale: சட்ட நிபந்தனையை அறிமுகப்படுத்தும் כִּי என்பதையும், אִישׁ என்பதன் ஒருமை ஆண்பால் வடிவத்தையும் இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: יִתֵּן מוּם
  choice: உடற்காயம் ஏற்படுத்தினால்
  rationale: சொல்லுக்குச் சொல் பொருள் ‘குறை/ஊனம் உண்டாக்குதல்.’ இங்கு உடலுக்குத் தீங்கு விளைவிப்பது பற்றிய சட்டச் சூழலில், ‘உடற்காயம் ஏற்படுத்துதல்’ தெளிவாகவும் இயல்பாகவும் உள்ளது; மூலத்தின் நேரடிப் படிமம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: בַּעֲמִיתוֹ
  choice: தன் சக மனிதனுக்கு
  rationale: עָמִית என்பது சமூகத்திலுள்ள உடனிருப்பவர், சக மனிதர் அல்லது அயலார் என்பதைக் குறிக்கலாம். ‘சக மனிதன்’ பரஸ்பர சமூக உறவைத் தெளிவாகக் காட்டுகிறது.
- source_word: כַּאֲשֶׁר עָשָׂה
  choice: அவன் செய்தபடியே
  rationale: செயலுக்கும் அதற்குரிய பதிலீட்டுக்கும் இடையிலான நேரான அளவொப்புமையைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: כֵּן יֵעָשֶׂה לּוֹ
  choice: அவனுக்கும் செய்யப்பட வேண்டும்
  rationale: எபிரெய வினையின் செயப்பாட்டு வடிவத்தையும் சட்ட விதியின் கட்டாயத் தன்மையையும் காக்கிறது; செய்பவர் யார் என்பதை மூலத்தைவிடக் குறிப்பாக வரையறுப்பதில்லை.
theological_decisions:
- issue: அளவொத்த பதிலீட்டின் சட்டக் கோட்பாடு
  choice: தனிப்பட்ட பழிவாங்கலைக் கூறாமல், செய்யப்பட்ட தீங்கிற்கு அளவொத்த சட்டப் பதிலீடாக மொழிபெயர்க்கப்பட்டது.
  alternative: தனிநபர் நேரடியாகப் பழிவாங்க வேண்டும் என்று விளங்கக்கூடிய செய்பாட்டு மொழிபெயர்ப்பு.
  rationale: மூலத்தில் ‘அவனுக்குச் செய்யப்படும்’ என்ற செயப்பாட்டு அமைப்பு உள்ளது. அது நீதித்துறைச் சூழலைத் திறந்தவாறே வைத்திருப்பதால், செய்பவரையோ நடைமுறையையோ மொழிபெயர்ப்பு கூடுதலாக நிர்ணயிக்கவில்லை.
translation_notes:
  register: நவீன, தெளிவான, கண்ணியமிக்க சட்டநடை பயன்படுத்தப்பட்டுள்ளது. ‘செய்யப்பட வேண்டும்’ என்பது செயப்பாட்டு வடிவத்தையும் விதியின் கட்டாயத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
