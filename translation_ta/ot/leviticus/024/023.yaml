  text: וַ/יְדַבֵּ֣ר מֹשֶׁה֮ אֶל בְּנֵ֣י יִשְׂרָאֵל֒ וַ/יּוֹצִ֣יאוּ אֶת הַֽ/מְקַלֵּ֗ל אֶל מִ/חוּץ֙ לַֽ/מַּחֲנֶ֔ה וַ/יִּרְגְּמ֥וּ אֹת֖/וֹ אָ֑בֶן וּ/בְנֵֽי יִשְׂרָאֵ֣ל עָשׂ֔וּ כַּֽ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/023.yaml
  text: So Moses spoke to the sons of Israel[a], and they brought the one who had cursed outside the camp and stoned him with stones. Thus the sons of Israel did as Yahweh had commanded Moses.
translation:
  language: ta
  text: மோசே இஸ்ரவேல் மக்களிடம் பேசினார்; அவர்கள் சபித்தவனை[a] முகாமுக்கு வெளியே கொண்டுபோய், அவனைக் கற்களால் கல்லெறிந்து கொன்றார்கள். இவ்வாறு யாவே மோசேக்குக் கட்டளையிட்டபடியே இஸ்ரவேல் மக்கள் செய்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தேவதூஷணம் செய்தவன்.” எபிரேயப் பெயரெச்சம் சொல்லுக்குச் சொல் “சபித்தவன்” என்று பொருள்படும்; முந்தைய சூழலில் இறைவனுடைய பெயரைச் சபித்த மனிதனை இது குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பேசினார்
  rationale: பியேல் வடிவிலுள்ள דבר என்பதன் இயல்பான பொருள் ‘பேசுதல்’; மோசே மக்களிடம் உரைத்ததை நவீன தமிழில் நேரடியாகக் கூறுகிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: சொல்லுக்குச் சொல் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு சமூகமெங்கையும் குறிக்கும் இயல்பான நவீனத் தமிழ் வடிவம் இது.
- source_word: וַיּוֹצִיאוּ
  choice: வெளியே கொண்டுபோய்
  rationale: יצא என்பதன் ஹிஃபில் வடிவம் ‘வெளியே செல்லச் செய்தல்/கொண்டுபோதல்’ என்பதைக் குறிக்கிறது; சூழலின் நகர்வைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: הַמְקַלֵּל
  choice: சபித்தவனை
  rationale: קלל என்ற வினையின் பங்கேற்புப் பெயர் முந்தைய சூழலில் இறைப் பெயரைச் சபித்த மனிதனைச் சுட்டுகிறது; ‘தேவதூஷணம் செய்தவன்’ என்ற விளக்கச் சொல்லை முதன்மை உரையில் புகுத்தாமல் நேரடிப் பொருளைப் பாதுகாக்கிறது.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: முகாமுக்கு வெளியே
  rationale: இலக்கு அல்லது திசையைக் குறிக்கும் எபிரேய அமைப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וַיִּרְגְּמוּ אֹתוֹ אָבֶן
  choice: அவன்மேல் கற்களை எறிந்து அவனைக் கொன்றார்கள்
  rationale: רגם என்பது தண்டனையாகக் கல்லெறிந்து கொல்வதைக் குறிக்கிறது. ‘கற்களால் கல்லெறிந்தார்கள்’ என்ற செயற்கையான மறுபடிவத்தைத் தவிர்த்து, செயலும் அதன் நீதித்தீர்ப்பு விளைவும் தெளிவாக வழங்கப்படுகின்றன.
- source_word: עָשׂוּ כַּאֲשֶׁר צִוָּה
  choice: கட்டளையிட்டபடியே ... செய்தார்கள்
  rationale: முன்னர் கொடுக்கப்பட்ட கட்டளைக்கு அவர்கள் கீழ்ப்படிந்ததைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: நான்கு எழுத்து இறைப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் நீண்டகாலமாக அறியப்பட்ட தனிப்பெயர் வடிவில் தருகிறது.
theological_decisions:
- issue: הַמְקַלֵּל என்பதை விளக்கமிக்க ‘தேவதூஷணம் செய்தவன்’ என்று மொழிபெயர்ப்பதா
  choice: சபித்தவன்
  alternative: தேவதூஷணம் செய்தவன்
  rationale: முந்தைய வசனங்கள் இறைப் பெயரைச் சபித்ததைக் காட்டினாலும், இவ்வசனத்தின் எபிரேயச் சொல் நேரடியாக ‘சபித்தவன்’ என்றே கூறுகிறது. அந்தச் சொற்பொருளையும் சூழலுடனான இறையியல் அழுத்தத்தையும் முதன்மை உரை தீர்த்துவிடாமல் பாதுகாக்கிறது.
- issue: וַיִּרְגְּמוּ אֹתוֹ אָבֶן என்பதில் மரண விளைவை வெளிப்படையாகக் கூறுவதா
  choice: அவன்மேல் கற்களை எறிந்து அவனைக் கொன்றார்கள்
  alternative: அவன்மேல் கற்களை எறிந்தார்கள்
  rationale: சட்டத் தண்டனையின் சூழலில் רגם என்பது சாதாரணமாகக் கற்களை வீசுவதை மட்டும் அல்லாமல் கல்லெறிந்து கொல்வதைக் குறிக்கிறது; தமிழ் வாசகருக்கு செயலைத் தவறாக மென்மைப்படுத்தாமல் தெரிவிக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘இஸ்ரவேல் மக்கள்’ என்பது இயல்பான சமூகக் குறிப்பு; ‘சபித்தவன்’ என்ற நேரடி சொல் மூலத்தின் தெளிவையும் சூழலின் இறையியல் அழுத்தத்தையும் பாதுகாக்கிறது.
