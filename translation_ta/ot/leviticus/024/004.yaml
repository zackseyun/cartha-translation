  text: עַ֚ל הַ/מְּנֹרָ֣ה הַ/טְּהֹרָ֔ה יַעֲרֹ֖ךְ אֶת הַ/נֵּר֑וֹת לִ/פְנֵ֥י יְהוָ֖ה תָּמִֽיד־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/004.yaml
  text: On the pure lampstand he shall arrange the lamps before Yahweh continually[a].
translation:
  language: ta
  text: தூய விளக்குத்தண்டின்மேல் விளக்குகளை யாவேக்கு முன்பாக அவன் எப்போதும் ஒழுங்காக அமைக்க வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “எப்போதும்” என்பது இங்கு “தவறாமல்” அல்லது “தொடர்ந்து ஒரு வழக்கமான சடங்காக” என்றும் பொருள்படலாம். எபிரெய மூலத்தில் யாவே (YHWH) என்ற இறைப் பெயர் உள்ளது.
    reason: மூலச்சொல்லின் காலத் தொடர்ச்சி சார்ந்த பொருள் பரப்பையும் இறைப் பெயர் நேரடியாக இடம்பெறுவதையும் தெளிவுபடுத்துதல்.
lexical_decisions:
- source_word: עַל הַמְּנֹרָה הַטְּהֹרָה
  choice: தூய விளக்குத்தண்டின்மேல்
  rationale: עַל என்பது இங்கு பொருளின் மேற்புற நிலையைச் சுட்டுவதால் ‘-மேல்’ என மொழிபெயர்க்கப்பட்டது. מְנוֹרָה என்பது வழிபாட்டுக்குரிய விளக்குத்தண்டைக் குறிக்கிறது; טְהֹרָה அதன் தூய தன்மையைச் சுட்டுகிறது.
- source_word: יַעֲרֹךְ
  choice: ஒழுங்குபடுத்தி வைக்க வேண்டும்
  rationale: ערך என்பது வரிசையாக அல்லது ஒழுங்காக அமைத்துவைப்பதைக் குறிக்கிறது. எபிரெய வினை வடிவத்தின் கட்டளை/கடமை சார்ந்த பொருளை இயல்பான தமிழில் ‘வேண்டும்’ வெளிப்படுத்துகிறது.
- source_word: אֶת הַנֵּרוֹת
  choice: விளக்குகளை
  rationale: נֵרוֹת என்பது விளக்குத்தண்டில் வைக்கப்படும் தனித்தனி விளக்குகளைக் குறிக்கிறது; ஆகவே நேரடியாக ‘விளக்குகள்’ என வழங்கப்பட்டது.
- source_word: לִפְנֵי יְהוָה
  choice: யாவேக்கு முன்பாக
  rationale: לִפְנֵי என்பது வழிபாட்டுச் சூழலில் ‘முன்பாக/சந்நிதியில்’ என்று பொருள்படும். יהוה என்பது பட்டப்பெயராக மாற்றப்படாமல் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டது.
- source_word: תָּמִיד
  choice: எப்போதும்
  rationale: תָּמִיד இங்கு தொடர்ச்சியாக அல்லது தவறாமல் நடைபெறும் வழிபாட்டு ஒழுங்கைக் குறிக்கிறது; ‘எப்போதும்’ அதன் சுருக்கமான இயல்பான தமிழ் இணை.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் இறைவனின் தனிப்பெயரான நான்கெழுத்துப் பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டப்பெயரால் மாற்றாமல், பரவலாக ஏற்கப்பட்ட உச்சரிப்பை நவீனத் தமிழில் ‘யாவே’ என வழங்குவது மூலத்தின் தனிப்பெயர் தன்மையைப் பாதுகாக்கிறது.
- issue: תָּמִיד குறிக்கும் காலத் தொடர்ச்சி
  choice: எப்போதும்
  alternative: தவறாமல் / தொடர்ந்து
  rationale: இந்தச் சொல் இடையறாத தொடர்ச்சியையோ முறையாக மீண்டும் நடைபெறும் வழிபாட்டு நடைமுறையையோ குறிக்கக்கூடும். முதன்மை உரையில் ‘எப்போதும்’ வைக்கப்பட்டு, அதன் சூழல்சார் பரப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், வழிபாட்டு உரைக்கு ஏற்ற கண்ணியமான ஆனால் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டது. ‘விளக்குத்தண்டு’ என்பது பொதுவாசகனுக்குப் புரியும் வகையில் வழிபாட்டுப் பொருளின் வடிவத்தைத் தெளிவாகக் குறிக்கிறது.
