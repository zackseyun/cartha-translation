  source_fidelity: திருத்தம் தேவை. לְבֹנָה என்பது குறிப்பாக frankincense (ஒலிபானம்/குங்கிலியம்); ‘சாம்பிராணி’ பொதுவாக வேறுபட்ட நறுமணப் பிசினைக் குறிக்கக்கூடும். மேலும் יהוה-வை ‘யெகோவா’ என வழங்குவது வழங்கப்பட்ட POB முடிவான ‘Yahweh’ உடன் ஒத்துப்போகவில்லை. אִשֶּׁה-வின் நெருப்பில் செலுத்தப்படும் காணிக்கை என்ற சடங்குசார் பொருளைத் தெளிவாகக் காட்டுதல் நல்லது.
  naturalness: திருத்திய உரை நவீன தரநிலைத் தமிழில் இயல்பாகவும் சடங்கு அறிவுறுத்தலுக்கேற்ற கண்ணியமான நடையிலும் உள்ளது. ‘ஒவ்வொரு வரிசையின்மேலும்’ என்பது முந்தைய வசனத்தின் இரண்டு அப்ப வரிசைகள்/அடுக்குகள் என்ற சூழலைத் தெளிவாக வெளிப்படுத்துகிறது.
  terminology: ‘தூய குங்கிலியம்’ frankincense-க்கு துல்லியமானது. ‘நினைவுப்பகுதி’ לְאַזְכָּרָה-வின் தொழில்நுட்பச் சடங்குப் பொருளைப் பாதுகாக்கிறது. ‘நெருப்பில் செலுத்தப்படும் காணிக்கை’ אִשֶּׁה-வின் சொற்பொருளை ‘பலિ’ என்ற கூடுதல் குறிப்பிட்ட சொல்லின்றி வழங்குகிறது. பெயர் ‘யாவே’ எனத் திருத்தப்பட்டுள்ளது.
