  text: וְ/נָתַתָּ֥ עַל הַֽ/מַּעֲרֶ֖כֶת לְבֹנָ֣ה זַכָּ֑ה וְ/הָיְתָ֤ה לַ/לֶּ֨חֶם֙ לְ/אַזְכָּרָ֔ה אִשֶּׁ֖ה לַֽ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/007.yaml
  text: And you shall put pure frankincense on each row[a], and it shall be for the bread as a memorial portion[b], a food offering to Yahweh.
translation:
  language: ta
  text: ஒவ்வொரு வரிசையின்மேலும்[a] தூய குங்கிலியத்தை வைக்க வேண்டும். அது அப்பத்திற்கான நினைவுப்பகுதியாகவும், யாவேவுக்கான நெருப்பில் செலுத்தப்படும் காணிக்கையாகவும் இருக்கும்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒழுங்கமைப்பின்மேல்”; இச்சூழலில் இது ஒழுங்காக அடுக்கப்பட்ட அப்ப வரிசைகளைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயச் சொல் “நெருப்புக் காணிக்கை” என்றும் மொழிபெயர்க்கப்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּ
  choice: வைக்க வேண்டும்
  rationale: வாவுடன் வந்த இறந்தகால வடிவம் இச்சடங்கு அறிவுறுத்தலில் கட்டளையைத் தெரிவிக்கிறது; நவீன தமிழில் இயல்பாகப் பொருளை அளிக்கிறது.
- source_word: הַמַּעֲרֶכֶת
  choice: ஒவ்வொரு வரிசை
  rationale: எபிரெயச் சொல் ஒருமையில் இருந்தாலும், முந்தைய வசனத்திலுள்ள இரண்டு ஒழுங்குபடுத்தப்பட்ட அப்ப வரிசைகளைக் குறிக்கும் பகிர்நிலைப் பொருள் இங்கு உள்ளது.
- source_word: לְבֹנָה זַכָּה
  choice: தூய சாம்பிராணி
  rationale: לְבֹנָה என்பது நறுமணப் பிசினான frankincense; זַכָּה அதன் சடங்குசார் தூய்மையைத் தெரிவிக்கிறது.
- source_word: לַלֶּחֶם
  choice: அப்பத்திற்கான
  rationale: ஒருமை வடிவம் இங்கு சமுகத்தப்பங்களைத் தொகுப்பாகக் குறிக்கிறது; தமிழில் தொகுப்புப் பொருளை இயல்பாகப் பாதுகாக்கிறது.
- source_word: לְאַזְכָּרָה
  choice: நினைவுப்பகுதி
  rationale: பலியின் சார்பாகச் செலுத்தப்பட்டு கடவுளின் முன்னிலையில் நினைவுகூரச் செய்யும் பிரதிநிதிப் பகுதியைக் குறிக்கும் ஆசாரச் சொல்லாகும்.
- source_word: אִשֶּׁה
  choice: நெருப்புப் பலி
  rationale: ஆசார மொழியில் நெருப்பில் செலுத்தப்படும் காணிக்கை அல்லது பலியைக் குறிக்கிறது; மூலச்சொல்லின் நெருப்புச் சார்பை வெளிப்படையாகப் பாதுகாக்கிறது.
- source_word: לַיהוָה
  choice: யெகோவாவுக்குச்
  rationale: יהוה என்ற உடன்படிக்கைப் பெயரைப் பொதுவான பட்டப்பெயராக மாற்றாமல் தனிப்பெயராக வழங்குகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே
  rationale: எபிரெய மூலத்தில் நான்கெழுத்து இறைப் பெயர் நேரடியாக உள்ளது. தமிழில் பரவலாக அறியப்படும் தனிப்பெயர் வடிவமான ‘யெகோவா’ பயன்படுத்தப்பட்டு, ‘கர்த்தர்’ போன்ற பட்டப்பெயரால் மாற்றப்படவில்லை.
- issue: לְאַזְכָּרָה என்பதன் சடங்குசார் பொருள்
  choice: நினைவுப்பகுதி
  alternative: நினைவூட்டும் காணிக்கை
  rationale: இது முழு அப்பத் தொகுப்புக்கு மாற்றாகச் செலுத்தப்படும் பிரதிநிதிப் பகுதியைக் குறிக்கலாம்; ‘நினைவுப்பகுதி’ அந்தச் சடங்குசார் செயல்பாட்டைச் சுருக்கமாகப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், ஆசாரச் சூழலுக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘சாம்பிராணி’, ‘நினைவுப்பகுதி’, ‘நெருப்புப் பலி’ ஆகியவை பொதுவாசகர்களுக்குப் புரியுமாறும் மூலத்தின் சடங்குசார் நுணுக்கத்தைப் பாதுகாக்குமாறும் தேர்ந்தெடுக்கப்பட்டன.
