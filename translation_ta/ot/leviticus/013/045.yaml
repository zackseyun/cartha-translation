revisions:
- from: 'அந்தத் தோல் நோய்ப் பாதிப்பு உள்ளவர் தன் உடைகளைக் கிழித்துக்கொள்ள வேண்டும்; தன் தலைமுடியைச் சீர்செய்யாமல் விட்டுவிட வேண்டும்; தன் மேல் உதட்டுப் பகுதியை மூடிக்கொண்டு[a], “தீட்டு! தீட்டு!” என்று உரக்கக் கூவ வேண்டும்.


    [a] அல்லது, “மீசைப் பகுதியை மூடிக்கொண்டு.” எபிரெயச் சொல் மேல் உதடு அல்லது மீசை இருக்கும் பகுதியைக் குறிக்கலாம்.'
  to: தோல் நோயால் பாதிக்கப்பட்டவருக்கு அந்தப் பாதிப்பு இருந்தால், அவருடைய உடைகள் கிழிந்தவையாக இருக்க வேண்டும்; அவருடைய தலைமுடி சீர்செய்யப்படாமல் இருக்க வேண்டும்; அவர் தம் மேல் உதட்டைப் மூடிக்கொள்ள வேண்டும்[a]; “தீட்டு! தீட்டு!” என்று உரக்கக் கூவ வேண்டும்.
  rationale: The revision preserves the source’s distinction between the affected person and the affliction, avoids specifying that he himself must tear the garments, and changes the upper-lip clause from a participial sequence to a coordinated legal requirement. The lexical ambiguity concerning שָׂפָם remains anchored by footnote a.
  reviewer_model: gpt-5.6-terra
