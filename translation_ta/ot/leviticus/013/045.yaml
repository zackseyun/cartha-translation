  edition: WLC
  text: וְ/הַ/צָּר֜וּעַ אֲשֶׁר בּ֣/וֹ הַ/נֶּ֗גַע בְּגָדָ֞י/ו יִהְי֤וּ פְרֻמִים֙ וְ/רֹאשׁ/וֹ֙ יִהְיֶ֣ה פָר֔וּעַ וְ/עַל שָׂפָ֖ם יַעְטֶ֑ה וְ/טָמֵ֥א טָמֵ֖א יִקְרָֽא־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/045.yaml
  text: As for the one with the skin disease[a], in whom the infection is, his clothes shall be torn, his head shall be left unkempt, he shall cover his mustache, and he shall cry out, ‘Unclean, unclean!’
translation:
  language: ta
  text: தோல் நோயால் பாதிக்கப்பட்டவருக்கு அந்தப் பாதிப்பு இருந்தால், அவருடைய உடைகள் கிழிந்தவையாக இருக்க வேண்டும்; அவருடைய தலைமுடி சீர்செய்யப்படாமல் இருக்க வேண்டும்; அவர் தம் மேல் உதட்டைப் மூடிக்கொள்ள வேண்டும்[a]; “தீட்டு! தீட்டு!” என்று உரக்கக் கூவ வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மீசைப் பகுதியை மூடிக்கொள்ள வேண்டும்.” எபிரெயச் சொல் மேல் உதடு அல்லது மீசை இருக்கும் பகுதியைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצָּרוּעַ אֲשֶׁר בּוֹ הַנֶּגַע
  choice: அந்தத் தோல் நோய்ப் பாதிப்பு உள்ளவர்
  rationale: צָרוּעַ என்பது ஹான்சன் நோயை மட்டும் குறிக்கும் பெயராக அல்லாமல், லேவியராகமம் 13-இல் விவரிக்கப்படும் பரந்த தோல் நோய்நிலையைக் குறிக்கிறது. נֶגַע என்பதையும் நவீன கிருமித் தொற்றாகக் குறுக்காமல் ‘பாதிப்பு’ என மொழிபெயர்க்கிறது.
- source_word: בְּגָדָיו יִהְיוּ פְרֻמִים
  choice: தன் உடைகளைக் கிழித்துக்கொள்ள வேண்டும்
  rationale: கிழிக்கப்பட்ட உடைகளை அணிந்திருக்க வேண்டும் என்ற எபிரெயக் கட்டளையின் பொருளையும், துயரம் மற்றும் பொது எச்சரிக்கையின் வெளிப்புற அடையாளத்தையும் இயல்பான தமிழில் தருகிறது.
- source_word: וְרֹאשׁוֹ יִהְיֶה פָרוּעַ
  choice: தன் தலைமுடியைச் சீர்செய்யாமல் விட்டுவிட வேண்டும்
  rationale: פָרוּעַ என்பது தலை மொட்டையாக அல்லது வெறுமையாக இருப்பதைவிட, தலைமுடி அவிழ்ந்தோ பராமரிக்கப்படாமலோ இருப்பதைக் குறிக்கிறது.
- source_word: וְעַל שָׂפָם יַעְטֶה
  choice: தன் மேல் உதட்டுப் பகுதியை மூடிக்கொண்டு
  rationale: שָׂפָם மேல் உதடு அல்லது மீசை இருக்கும் பகுதியைக் குறிக்கலாம். முதன்மை உரை உடற்பகுதியைத் தெளிவாகக் கூறுகிறது; ‘மீசைப் பகுதி’ என்ற மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וְטָמֵא טָמֵא יִקְרָא
  choice: “தீட்டு! தீட்டு!” என்று உரக்கக் கூவ வேண்டும்
  rationale: இருமுறை வரும் טָמֵא என்பதைப் பொது எச்சரிக்கையான வலியுறுத்தலுடன் தருகிறது. ‘உரக்கக் கூவ’ என்பது கேட்கும்படி அறிவிக்கும் செயல்பாட்டை வெளிப்படுத்துகிறது; மூலத்தில் இல்லாத ‘நான்’ என்பதைச் சேர்ப்பதில்லை.
theological_decisions:
- issue: லேவியராகமம் 13-இல் טָמֵא என்பதன் தன்மை
  choice: தீட்டு
  alternative: அசுத்தம்; தீட்டுப்பட்டவன்
  rationale: இங்கு சொல் முதன்மையாக சடங்குசார் மற்றும் சமூக நிலையை அறிவிக்கிறது; தனிப்பட்ட பாவக்குற்றத்தையோ நவீன மருத்துவ வகைப்பாட்டையோ அதில் சேர்க்கவில்லை. பெயரடைத் தன்மையைத் தமிழில் முழுமையாகப் பிரதிபலிப்பது கடினமாதலால், சுருக்கமான பொது எச்சரிக்கையாக ‘தீட்டு!’ பயன்படுத்தப்பட்டுள்ளது.
translation_notes:
  register: நவீன செந்தமிழ் நடை; சட்டக் கட்டளைக்கேற்ற கண்ணியமான ‘வேண்டும்’ அமைப்பு பயன்படுத்தப்பட்டுள்ளது. ‘குஷ்டரோகம்’ தவிர்க்கப்பட்டுள்ளது, ஏனெனில் அது மூலச் சொல்லை ஹான்சன் நோயாகத் தேவையின்றிக் குறுக்கிவிடலாம். சடங்குசார் நிலையும் நவீன மருத்துவ நோயறிதலும் ஒன்றாக்கப்படவில்லை.
