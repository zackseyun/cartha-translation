  terminology: ‘பளிச்சென்ற தழும்பு’ בַּהֶרֶת-ஐ முந்தைய வசனத்தின் வீக்கத்திலிருந்து வேறுபடுத்துகிறது. ‘ஆசாரியன்,’ ‘பாதிக்கப்பட்ட பகுதி,’ ‘தனிமைப்படுத்த’ ஆகியவை உரிய பதிவிலும் பொருளிலும் அமைந்துள்ளன. அடிக்குறிப்பு a-வின் மாற்றுச் சொற்களும், b-வின் நடைமுறை விளக்கமும் சரியாக உள்ளன.
