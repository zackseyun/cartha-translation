source:
  edition: WLC
  text: וְ/אִם בַּהֶרֶת֩ לְבָנָ֨ה הִ֜וא בְּ/ע֣וֹר בְּשָׂר֗/וֹ וְ/עָמֹק֙ אֵין מַרְאֶ֣/הָ מִן הָ/ע֔וֹר וּ/שְׂעָרָ֖/ה לֹא הָפַ֣ךְ לָבָ֑ן וְ/הִסְגִּ֧יר הַ/כֹּהֵ֛ן אֶת הַ/נֶּ֖גַע שִׁבְעַ֥ת יָמִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/004.yaml
  text: But if the bright spot is white in the skin of his flesh[a], and its appearance is not deeper than the skin, and its hair has not turned white[c][b], then the priest shall isolate the affected area for seven days.
translation:
  language: ta
  text: ஆனால், அவனுடைய உடலின் தோலில் உள்ள பளிச்சென்ற தழும்பு வெண்மையாக இருந்து,[a] அது தோலைவிட ஆழமாகத் தோன்றாமலும், அதிலுள்ள முடி வெண்மையாக மாறாமலும் இருந்தால், ஆசாரியன் பாதிக்கப்பட்ட பகுதியை ஏழு நாட்களுக்குத் தனிமைப்படுத்த வேண்டும்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பளிச்சென்ற பகுதி” அல்லது “ஒளிரும் தழும்பு” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயச் சொல், பரிசோதித்துக் கவனிப்பதற்காகத் தற்காலிகமாகத் தனியே வைத்திருப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּהֶרֶת
  choice: பளிச்சென்ற தழும்பு
  rationale: தோலில் காணப்படும் வெண்மையான அல்லது ஒளிரும் குறியை இது சுட்டுகிறது. முந்தைய வசனத்தில் வரும் வீக்கத்திலிருந்து வேறுபடுத்தவும், நவீன தமிழில் இயல்பாகப் புரியவும் இச்சொற்றொடர் ஏற்றது.
- source_word: לְבָנָה
  choice: வெண்மையாக
  rationale: குறியின் நிறத்தை நேரடியாகக் குறிப்பிடும் எளிய பொருள்.
- source_word: בְּעוֹר בְּשָׂרוֹ
  choice: அவனுடைய உடலின் தோலில்
  rationale: எபிரெய மொழியின் உடற்கூறு சார்ந்த குறிப்பை இயல்பான நவீன தமிழில் தருகிறது; இங்கு בשר என்பது உடலைக் குறிக்கிறது.
- source_word: וְעָמֹק אֵין מַרְאֶהָ מִן הָעוֹר
  choice: அது தோலைவிட ஆழமாகத் தோன்றாமலும்
  rationale: சுற்றியுள்ள தோலுடன் ஒப்பிடப்படும் காட்சிப்பூர்வமான ஆழத்தையே இச்சொற்றொடர் குறிக்கிறது.
- source_word: וּשְׂעָרָהּ לֹא הָפַךְ לָבָן
  choice: அதிலுள்ள முடி வெண்மையாக மாறாமலும்
  rationale: குறியுடன் தொடர்புடைய முடியின் நிறமாற்றத்தைத் தெளிவாகவும் இயல்பாகவும் கூறுகிறது.
- source_word: וְהִסְגִּיר
  choice: தனிமைப்படுத்த வேண்டும்
  rationale: கவனிப்புக்காகத் தற்காலிகமாகப் பிரித்து வைக்கும் நடைமுறையை இது குறிக்கிறது; பழமையான அல்லது தண்டனை சார்ந்த சொற்களைத் தவிர்க்கிறது.
- source_word: אֶת־הַנֶּגַע
  choice: பாதிக்கப்பட்ட பகுதியை
  rationale: இன்னும் உறுதியாக நோயென்று தீர்மானிக்கப்படாத, ஆசாரியன் பரிசோதிக்கும் தோல் பகுதியைக் குறிக்கிறது.
- source_word: שִׁבְעַת יָמִים
  choice: ஏழு நாட்களுக்கு
  rationale: தனிமைப்படுத்தலின் கால அளவை இயல்பான தமிழில் தெரிவிக்கிறது.
