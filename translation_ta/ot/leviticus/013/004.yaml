translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. நோய் உறுதிசெய்யப்பட்டதாகக் காட்டாமல், பரிசோதனையில் உள்ள தோல் குறி மற்றும் தற்காலிகத் தனிமைப்படுத்தல் என்ற மூலமொழியின் மருத்துவ-சடங்கு சார்ந்த தெளிவின்மை பாதுகாக்கப்பட்டுள்ளது.
