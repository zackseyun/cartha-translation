  source_fidelity: 'மூல எபிரெயத்தின் எல்லா முக்கிய கூறுகளும் துல்லியமாக உள்ளன: வெண்மையான பளிச்சென்ற தழும்பு, தோலைவிட ஆழமில்லாத தோற்றம், அதனுடன் உள்ள முடி வெண்மையாகாத நிலை, ஏழு நாள் தனிமைப்படுத்தல். אֶת־הַנֶּגַע என்பதற்கு ‘பாதிக்கப்பட்ட பகுதி’ என்பது நோய் உறுதிசெய்யப்படாத நிலையைக் காக்கும் பாதுகாப்பான தெரிவாகும்.'
