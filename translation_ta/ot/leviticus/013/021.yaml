  text: וְ/אִ֣ם יִרְאֶ֣/נָּה הַ/כֹּהֵ֗ן וְ/הִנֵּ֤ה אֵֽין בָּ/הּ֙ שֵׂעָ֣ר לָבָ֔ן וּ/שְׁפָלָ֥ה אֵינֶ֛/נָּה מִן הָ/ע֖וֹר וְ/הִ֣יא כֵהָ֑ה וְ/הִסְגִּיר֥/וֹ הַ/כֹּהֵ֖ן שִׁבְעַ֥ת יָמִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/021.yaml
  text: But if the priest examines it[a], and behold, there is no white hair in it, and it is not deeper than the skin, but it is dim, then the priest shall isolate him for seven days.
translation:
  language: ta
  text: ஆனால் ஆசாரியர் அதை ஆராய்ந்து பார்க்கும்போது, இதோ, அதில் வெள்ளை முடி இல்லாமலும், அது தோலைவிடப் பள்ளமாக இல்லாமலும், மங்கலாகவும் இருந்தால், ஆசாரியர் அந்த நபரை ஏழு நாட்களுக்குத் தனிமைப்படுத்தி வைக்க வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அந்த நபரை ஏழு நாட்களுக்கு அடைத்து வைக்க வேண்டும்.’ எபிரெய வினைச்சொல், கண்காணிப்புக்காக ஒருவரைத் தனியே வைப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: ஆனால் ... இருந்தால்
  rationale: முந்தைய நோயறிதல் நிலைக்கு மாறான நிபந்தனையை இயல்பான தமிழில் அறிமுகப்படுத்துகிறது.
- source_word: יִרְאֶנָּה
  choice: அதை ஆராய்ந்து பார்க்கும்போது
  rationale: அடிப்படைப் பொருள் ‘பார்த்தல்’ என்றாலும், இங்கு ஆசாரியர் மேற்கொள்ளும் நோயறிதல் ஆய்வைக் குறிக்கிறது.
- source_word: הַכֹּהֵן
  choice: ஆசாரியர்
  rationale: லேவியராகமத்தின் வழிபாட்டு மற்றும் பரிசோதனைச் சூழலில் பணியாற்றும் priest என்பதற்கான நிலையான, மரியாதையான தமிழ் சொல்.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: பரிசோதனையில் கண்டறியப்பட்ட நிலைக்கு கவனத்தை ஈர்க்கும் எபிரெயக் குறிப்புச் சூத்திரத்தைப் பாதுகாக்கிறது.
- source_word: אֵין בָּהּ שֵׂעָר לָבָן
  choice: அதில் வெள்ளை முடி இல்லாமல்
  rationale: பாதிக்கப்பட்ட இடத்தில் வெள்ளை முடி இல்லை என்ற நோயறிதல் அளவுகோலை நேரடியாகத் தருகிறது.
- source_word: וּשְׁפָלָה אֵינֶנָּה מִן הָעוֹר
  choice: அது தோலைவிடப் பள்ளமாக இல்லாமல்
  rationale: שָׁפָל என்பதன் ‘தாழ்ந்த/பள்ளமான’ காட்சிப் பொருளை, தோலின் மேற்பரப்புடன் செய்யப்படும் ஒப்பீடாகத் தெளிவாகக் காட்டுகிறது.
- source_word: וְהִיא כֵהָה
  choice: மங்கலாகவும்
  rationale: குறியின் தெளிவு அல்லது நிறத்தீவிரம் குறைந்திருப்பதைக் குறிக்கும் כֵהָה என்பதற்கு இயல்பான தமிழ் இணை.
- source_word: וְהִסְגִּירוֹ
  choice: அந்த நபரை ... தனிமைப்படுத்தி வைக்க வேண்டும்
  rationale: ஆண்பால் ஒருமை பின்னொட்டு பாதிக்கப்பட்ட இடத்தையல்ல, பரிசோதிக்கப்படும் நபரைக் குறிக்கிறது; வினைச்சொல் கண்காணிப்புக்காக அவரைத் தனியே அடைத்து வைப்பதைக் குறிக்கிறது.
- source_word: שִׁבְעַת יָמִים
  choice: ஏழு நாட்களுக்கு
  rationale: குறிப்பிட்ட கால அளவை நேரடியாகவும் இயல்பாகவும் மொழிபெயர்க்கிறது.
