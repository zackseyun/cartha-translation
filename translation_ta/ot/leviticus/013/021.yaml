translation_notes:
  register: நவீன நிலையான தமிழில், சட்டவிதி மற்றும் ஆசாரியப் பரிசோதனைச் சூழலுக்கேற்ற மரியாதையான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘இதோ’ என்பது மூலத்தின் கவன ஈர்ப்பு வடிவத்தைப் பாதுகாக்கிறது; ‘தோலைவிடப் பள்ளமாக’ என்பது காட்சிப்பூர்வமான நோயறிதல் அளவுகோலைத் தெளிவாக வைத்திருக்கிறது.
