  yaml_path: translation/ot/leviticus/013/008.yaml
  text: And the priest shall examine him[a], and behold, if the scaly eruption has spread on the skin, the priest shall pronounce him unclean; it is leprosy.
translation:
  language: ta
  text: ஆசாரியன் அவனைப் பரிசோதிக்க வேண்டும். இதோ, செதில்போன்ற தோல் சொறி தோலில் பரவியிருந்தால், ஆசாரியன் அவனைத் தீட்டானவன் என்று அறிவிக்க வேண்டும்; அது சாராத் ஆகும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘சாராத்’. இது பாரம்பரியமாக ‘தொழுநோய்’ என்று மொழிபெயர்க்கப்பட்டாலும், லேவியராகமத்தில் இச்சொல் நவீன தொழுநோயை மட்டும் அல்லாமல் பலவகையான தோல் பாதிப்புகளையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: பரிசோதிக்க வேண்டும்
  rationale: ஆசாரியரின் முறையான ஆய்வையும் மதிப்பீட்டையும் குறிக்கும் சூழல்சார் பொருள்.
- source_word: הַכֹּהֵן
  choice: ஆசாரியன்
  rationale: லேவியராகமத்தின் சட்டப் பின்னணியில் அங்கீகரிக்கப்பட்ட பரிசோதகரையும் நிலையை அறிவிப்பவரையும் குறிக்கிறது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: எபிரெய மூலத்தின் கவன ஈர்ப்புச் சொல்லை வெளிப்படையாகப் பாதுகாக்கிறது; அடுத்த ‘-இருந்தால்’ அமைப்பு அதன் நிபந்தனைச் செயல்பாட்டையும் தருகிறது.
- source_word: פָּשְׂתָה
  choice: பரவியிருந்தால்
  rationale: நோய்நிலையைத் தீர்மானிக்கும் முக்கிய அறிகுறியான விரிவடைதலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: הַמִּסְפַּחַת
  choice: செதில்போன்ற தோல் வெடிப்பு
  rationale: வெறும் ‘பொருக்கு’ என்பதைவிட மேலோட்டமான, செதில்தன்மையுள்ள தோல் பாதிப்பைத் தெளிவாகக் குறிக்கிறது.
- source_word: בָּעוֹר
  choice: தோலில்
  rationale: பாதிப்பு பரவும் இடத்தை இயல்பான தமிழில் குறிக்கிறது.
- source_word: וְטִמְּאוֹ
  choice: அவனைத் தீட்டுள்ளவன் என்று அறிவிக்க வேண்டும்
  rationale: ஆசாரியன் தீட்டை உண்டாக்குகிறார் என்பதல்ல; சடங்குசார் நிலையை அதிகாரபூர்வமாக அறிவிக்கிறார் என்பதைக் காட்டுகிறது.
- source_word: צָרַעַת
  choice: சாராத்
  rationale: நவீன தொழுநோயோடு தவறாக நேரடியாக ஒப்பிடாமல், எபிரெயச் சொல்லின் பரந்த மற்றும் துல்லியமாக அடையாளமிட முடியாத பொருளை பாதுகாக்கிறது.
- source_word: הִוא
  choice: அது
  rationale: பெண்பால் ஒருமைச் சுட்டுப்பெயர் முன் குறிப்பிடப்பட்ட தோல் பாதிப்பையே அடையாளப்படுத்துகிறது.
theological_decisions:
- issue: லேவியராகமத் தூய்மைச் சட்டத்தில் צָרַעַת என்பதன் மொழிபெயர்ப்பு
  choice: சாராத்
  alternative: தொழுநோய்; தோல் நோய்; தீட்டுண்டாக்கும் தோல் நோய்
  rationale: צָרַעַת என்பது நவீன ஹான்சன் நோயை மட்டும் குறிப்பதில்லை; லேவியராகமத்தில் அது தோல், ஆடை, வீடு ஆகியவற்றிலும் காணப்படும் வகைப்பாடு. ஒலிபெயர்ப்பு மூலத்தின் பரப்பையும் தெளிவின்மையையும் காக்கிறது; அடிக்குறிப்பு வாசகருக்குத் தேவையான விளக்கத்தை அளிக்கிறது.
translation_notes:
  register: நவீன, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ். சட்டவழக்குச் சூழலைக் காட்ட ‘பரிசோதிக்க வேண்டும்’, ‘அறிவிக்க வேண்டும்’ பயன்படுத்தப்பட்டுள்ளன. ‘தீட்டுள்ளவன்’ என்பது மருத்துவத் தீர்ப்பை அல்ல, லேவியராகமத்தின் சடங்குசார் நிலையை குறிக்கிறது.
