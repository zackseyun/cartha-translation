revisions:
- from: ஆனால் குரு அதைப் பரிசோதிக்கும்போது, கழுவப்பட்ட பின்பு அந்தப் பாதிப்பு மங்கியிருப்பதைக் கண்டால், அதை அந்த ஆடையிலிருந்தோ தோலிலிருந்தோ பாவு நூலிலிருந்தோ ஊடை நூலிலிருந்தோ கிழித்து அகற்ற வேண்டும்.
  to: ஆனால், ஆசாரியன் அதைப் பரிசோதித்துப் பார்த்து, கழுவப்பட்ட பின்பு அந்தப் பாதிப்பு மங்கியிருப்பதைக் கண்டால், அந்தப் பாதிக்கப்பட்ட பகுதியை ஆடையிலிருந்தோ, தோலிலிருந்தோ, பாவு நூலிலிருந்தோ, ஊடை நூலிலிருந்தோ கிழித்து அகற்ற வேண்டும்.
  rationale: 'The revision corrects the office title for הכהן and streamlines the conditional inspection clause. “அந்தப் பாதிக்கப்பட்ட பகுதி” makes explicit that the portion bearing the mark—not necessarily the entire garment, leather article, or woven material—is to be torn out, consistent with the source construction and the procedural context. No footnote is necessary: the paired Tamil textile terms adequately preserve the warp/weft distinction.'
