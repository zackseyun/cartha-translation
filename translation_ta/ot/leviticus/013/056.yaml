  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/אִם֮ רָאָ֣ה הַ/כֹּהֵן֒ וְ/הִנֵּה֙ כֵּהָ֣ה הַ/נֶּ֔גַע אַחֲרֵ֖י הֻכַּבֵּ֣ס אֹת֑/וֹ וְ/קָרַ֣ע אֹת֗/וֹ מִן הַ/בֶּ֨גֶד֙ א֣וֹ מִן הָ/ע֔וֹר א֥וֹ מִן הַ/שְּׁתִ֖י א֥וֹ מִן הָ/עֵֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/056.yaml
  text: But if the priest examines it[a], and behold, the spot has faded after it was washed, then he shall tear it out of the garment, or out of the leather, or out of the warp, or out of the woof.
translation:
  language: ta
  text: ஆனால், ஆசாரியன் அதைப் பரிசோதித்துப் பார்த்து, கழுவப்பட்ட பின்பு அந்தப் பாதிப்பு மங்கியிருப்பதைக் கண்டால், அந்தப் பாதிக்கப்பட்ட பகுதியை ஆடையிலிருந்தோ, தோலிலிருந்தோ, பாவு நூலிலிருந்தோ, ஊடை நூலிலிருந்தோ கிழித்து அகற்ற வேண்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: ஆனால் ... கண்டால்
  rationale: முந்தைய நடைமுறையின் தொடர்ச்சியாக வரும் நிபந்தனையையும் அதன் மாறுபட்ட முடிவையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: רָאָה הַכֹּהֵן
  choice: குரு அதைப் பரிசோதிக்கும்போது ... கண்டால்
  rationale: רָאָה என்பதன் அடிப்படைப் பொருள் ‘கண்டான்’; இச்சட்ட நடைமுறைச் சூழலில் அது மதிப்பீட்டுக்குரிய பரிசோதனையைச் சுட்டுவதால், காணுதல் மற்றும் பரிசோதித்தல் ஆகிய இரு கூறுகளும் தமிழில் இயல்பாக இணைக்கப்பட்டுள்ளன.
- source_word: וְהִנֵּה
  choice: '... இருப்பதைக் கண்டால்'
  rationale: கவனத்தை ஈர்க்கும் எபிரெயச் சொல்லின் வலியுறுத்தலைத் தமிழில் செயற்கையான ‘இதோ’ என்பதற்குப் பதிலாக கண்டறியப்பட்ட நிலையாக இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כֵּהָה
  choice: மங்கியிருப்பது
  rationale: பாதிப்பின் தோற்றம் அல்லது நிறத் தீவிரம் குறைந்திருப்பதைத் துல்லியமாகக் குறிக்கிறது.
- source_word: הַנֶּגַע
  choice: அந்தப் பாதிப்பு
  rationale: துணி அல்லது தோலில் காணப்படும் பாதிக்கப்பட்ட பகுதியைக் குறிக்கிறது; நவீன தமிழில் ‘வாதை’ அல்லது ‘கொள்ளைநோய்’ என மிகைப்படுத்தாமல் பொருள் தருகிறது.
- source_word: אַחֲרֵי הֻכַּבֵּס אֹתוֹ
  choice: கழுவப்பட்ட பின்பு
  rationale: எபிரெயிலுள்ள செயல்பாட்டு ஏவற்பாட்டு வடிவத்தைத் தக்கவைத்து, குறித்த பொருள் கழுவப்பட்ட பின்னான நிலையைக் காட்டுகிறது.
- source_word: וְקָרַע אֹתוֹ
  choice: அதை ... கிழித்து அகற்ற வேண்டும்
  rationale: முழுப் பொருளையும் அழிப்பதை அல்ல, பாதிக்கப்பட்ட பகுதியை அதிலிருந்து கிழித்து நீக்குவதைத் தெளிவுபடுத்துகிறது.
- source_word: מִן הַבֶּגֶד
  choice: அந்த ஆடையிலிருந்து
  rationale: בגד என்பதற்கான பரந்த, இயல்பான தமிழ்ச் சொல்.
- source_word: מִן הָעוֹר
  choice: தோலிலிருந்து
  rationale: இங்கு மனிதத் தோலை அல்ல, பொருளாகப் பயன்படும் தோல் அல்லது பதனிடப்பட்ட தோலைக் குறிக்கிறது; தமிழில் ‘தோல்’ இரண்டையும் இயல்பாக உள்ளடக்கும்.
- source_word: מִן הַשְּׁתִי
  choice: பாவு நூலிலிருந்து
  rationale: நெசவில் நீளவாக்கில் அமைக்கப்படும் warp நூல்களுக்கான தமிழ் தொழில்நுட்பச் சொல்.
- source_word: מִן הָעֵרֶב
  choice: ஊடை நூலிலிருந்து
  rationale: பாவு நூல்களின் குறுக்கே செல்லும் weft நூல்களுக்கான தமிழ் தொழில்நுட்பச் சொல்.
