translation_notes:
  register: நவீன நிலையான தமிழில், சட்ட நடைமுறைக்கேற்ற கண்ணியமான மற்றும் தெளிவான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பாவு நூல்’, ‘ஊடை நூல்’ ஆகிய நெசவுத் தொழில்நுட்பச் சொற்கள் மூலத்தின் பொருள் வேறுபாட்டைத் தக்கவைக்கின்றன. அடிக்குறிப்பு தேவைப்படாததால் பிரதான உரையில் அடிக்குறிப்புக் குறியீடு சேர்க்கப்படவில்லை.
