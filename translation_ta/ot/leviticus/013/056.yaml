review_pass:
  verdict: revise
  source_fidelity: The conditional procedure, washing, fading of the affected area, and removal from garment, leather, warp, or weft are conveyed accurately. However, “குரு” ordinarily means a teacher/spiritual master in modern Tamil and is not an appropriate rendering of the Israelite cultic/legal officer הכהן; “ஆசாரியன்” is required.
  naturalness: The draft is generally clear, but “குரு அதைப் பரிசோதிக்கும்போது ... கண்டால்” is syntactically heavier than needed. A direct conditional construction is more natural and retains the procedural register.
  terminology: Replace “குரு” with “ஆசாரியன்.” “பாவு நூல்” and “ஊடை நூல்” appropriately distinguish warp and weft in Tamil textile terminology. “பாதிப்பு” suitably renders the affected mark without importing a modern medical diagnosis.
  issues:
  - severity: high
    issue: “குரு” for הכהן
    rationale: In modern standard Tamil, “குரு” does not normally designate a priest serving in the biblical sanctuary and can misidentify the role. “ஆசாரியன்” is the established, accurate term.
  - severity: low
    issue: Awkward conditional phrasing
    rationale: “பரிசோதிக்கும்போது ... கண்டால்” redundantly combines a temporal clause with a conditional. “பரிசோதித்துப் பார்த்து ... கண்டால்” is idiomatic and preserves the inspection sense.
  revised_text: ஆனால், ஆசாரியன் அதைப் பரிசோதித்துப் பார்த்து, கழுவப்பட்ட பின்பு அந்தப் பாதிப்பு மங்கியிருப்பதைக் கண்டால், அந்தப் பாதிக்கப்பட்ட பகுதியை ஆடையிலிருந்தோ, தோலிலிருந்தோ, பாவு நூலிலிருந்தோ, ஊடை நூலிலிருந்தோ கிழித்து அகற்ற வேண்டும்.
  revised_footnotes: []
  revision_rationale: 'The revision corrects the office title for הכהן and streamlines the conditional inspection clause. “அந்தப் பாதிக்கப்பட்ட பகுதி” makes explicit that the portion bearing the mark—not necessarily the entire garment, leather article, or woven material—is to be torn out, consistent with the source construction and the procedural context. No footnote is necessary: the paired Tamil textile terms adequately preserve the warp/weft distinction.'
