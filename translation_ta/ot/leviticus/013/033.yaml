translation_notes:
  register: நவீன நிலையான தமிழில், சட்ட நடைமுறைக்கேற்ற கண்ணியமான மற்றும் தெளிவான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் நேரடிப் பொருள் முதன்மை உரையில் பாதுகாக்கப்பட்டு, நடைமுறை சார்ந்த சாத்திய விளக்கம் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
