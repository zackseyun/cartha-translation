base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/033.yaml
  text: then he shall shave himself[a], but he shall not shave the scaly spot[b]; and the priest shall isolate the scaly spot for seven days a second time.
translation:
  language: ta
  text: பின்பு அவர் தம்மைச் சவரம் செய்துகொள்ள வேண்டும்; ஆனால் அந்த முடி உதிர்ந்துள்ள பாதிப்புப் பகுதியைச் சவரம் செய்யக்கூடாது.[a] அந்தப் பாதிப்பை உடையவரை ஆசாரியன் இரண்டாவது முறையாக ஏழு நாட்களுக்குத் தனிமைப்படுத்தி வைக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் இது தலை அல்லது தாடிப் பகுதியில் முடி உதிர்வுடன் காணப்படும் ஒரு குறிப்பிட்ட தோல் பாதிப்பைக் குறிக்கிறது. எபிரெய உரை, “அந்தப் பாதிப்புப் பகுதியைச் சவரம் செய்யக்கூடாது” என்று கூறுகிறது; பின்னர் ஆசாரியன் தெளிவாகப் பரிசோதிப்பதற்காக, அந்த இடத்தைச் சுற்றியுள்ள முடியைச் சவரம் செய்து, பாதிப்புள்ள இடத்தை மட்டும் சவரம் செய்யாமல் விட்டிருக்கலாம்.
    reason: lexical_alternative; cultural_note
lexical_decisions:
- source_word: וְהִתְגַּלָּח
  choice: பின்பு அவர் தன்னைச் சவரம் செய்துகொள்ள வேண்டும்
  rationale: גלח என்பதன் ஹித்பவேல் வடிவம் தற்சுட்டுப் பொருளுடையது; பாதிக்கப்பட்டவர் தாமே சவரம் செய்வதையோ செய்துகொள்வதையோ குறிக்கிறது. தொடர் நடைமுறையைக் காட்டும் וְ என்பதற்கு ‘பின்பு’ இயல்பானது.
- source_word: הַנֶּתֶק
  choice: பாதிக்கப்பட்ட பொட்டை
  rationale: נֶתֶק என்பது தலை அல்லது தாடிப் பகுதியில் முடி உதிர்வுடன் காணப்படும் குறிப்பிட்ட பாதிப்பைக் குறிக்கிறது; சாதாரண அரிப்பைக் குறிக்காது. ‘பாதிக்கப்பட்ட பொட்டை’ என்பது நோயின் தன்மையை அளவுக்கு மீறி நிர்ணயிக்காமல், முடி உதிர்ந்த தனிப்பகுதியைக் குறிக்கிறது.
- source_word: לֹא יְגַלֵּחַ
  choice: சவரம் செய்யக் கூடாது
  rationale: மறுப்புடன் வரும் நிறைவுறா வினைச்சொல் சட்ட அறிவுறுத்தலில் தடையைக் குறிக்கிறது; நவீனத் தமிழில் ‘கூடாது’ தெளிவான சட்டநடை.
- source_word: וְאֶת הַנֶּתֶק לֹא יְגַלֵּחַ
  choice: ஆனால் பாதிக்கப்பட்ட பொட்டையைச் சவரம் செய்யக் கூடாது
  rationale: நேரடிச் செயப்படுபொருள் குறியீடு பாதிக்கப்பட்ட இடத்தையே சவரம் செய்யக்கூடாது எனக் காட்டுகிறது. அதைச் சுற்றிய பகுதி என்று உரையில் சேர்க்காமல் எபிரெயச் சொல்லமைப்பு பாதுகாக்கப்படுகிறது.
- source_word: וְהִסְגִּיר
  choice: தனிமைப்படுத்தி வைக்க வேண்டும்
  rationale: லேவியராகமம் 13-இல் இது மீளாய்வுக்காகத் தற்காலிகமாகப் பிரித்து வைப்பதைக் குறிக்கிறது. ‘தனிமைப்படுத்தி வைக்க’ என்பது நவீனமும் தெளிவுமான நடை; தேவையற்ற மருத்துவக் கருத்தைச் சேர்ப்பதில்லை.
- source_word: הַכֹּהֵן
  choice: ஆசாரியன்
  rationale: லேவியச் சட்டச் சூழலில் כֹּהֵן என்பதற்கான நிலையான, புரிந்துகொள்ளத்தக்க தமிழ் இணை.
- source_word: שִׁבְעַת יָמִים
  choice: ஏழு நாட்களுக்கு
  rationale: கால அளவை இயல்பான தமிழில் நேரடியாக வழங்குகிறது.
- source_word: שֵׁנִית
  choice: இரண்டாவது முறையாக
  rationale: முன்னர் நடைபெற்ற ஏழுநாள் தனிமைப்படுத்தலை மீண்டும் செய்வதை வெளிப்படையாகக் காட்டுகிறது.
