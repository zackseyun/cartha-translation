  to: பின்பு அவர் தம்மைச் சவரம் செய்துகொள்ள வேண்டும்; ஆனால் அந்த முடி உதிர்ந்துள்ள பாதிப்புப் பகுதியைச் சவரம் செய்யக்கூடாது.[a] அந்தப் பாதிப்பை உடையவரை ஆசாரியன் இரண்டாவது முறையாக ஏழு நாட்களுக்குத் தனிமைப்படுத்தி வைக்க வேண்டும்.
  rationale: The revision replaces an awkward and potentially pejorative term with a clear, non-diagnostic expression that reflects the lexical context of נֶתֶק. It retains the direct prohibition in the main text and confines the practical explanation to a footnote. The final clause makes explicit in idiomatic Tamil the person who is temporarily separated for observation, while retaining the condition as the basis for that action.
