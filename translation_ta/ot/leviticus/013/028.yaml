  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. லேவியராகமத்தின் சடங்கு சார்ந்த பரிசோதனைச் சூழலைத் தெளிவாக்க ‘தூயவன் என்று அறிவிக்க வேண்டும்’ என வழங்கப்பட்டுள்ளது; மருத்துவ ரீதியாக அளவுக்கு மீறிய துல்லியத்தைத் திணிக்காமல் மூலத்தின் தோல் அடையாளச் சொற்கள் பாதுகாக்கப்பட்டுள்ளன.
