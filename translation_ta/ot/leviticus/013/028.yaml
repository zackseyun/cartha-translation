  yaml_path: translation/ot/leviticus/013/028.yaml
  text: But if the bright spot remains in its place and has not spread in the skin[a], and it is faded, it is the swelling from the burn, and the priest shall pronounce him clean, for it is the scar of the burn.
translation:
  language: ta
  text: ஆனால் அந்தப் பளிச்சிடும் தழும்பு இருந்த இடத்திலேயே நிலைத்திருந்து, தோலில் பரவாமல், மங்கியிருந்தால், அது தீக்காயத்தால் ஏற்பட்ட வீக்கம். ஆசாரியன் அவனைச் சுத்தமானவன் என்று அறிவிக்க வேண்டும்; ஏனெனில் அது தீக்காயத்தின் வடு.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תַּחְתֶּיהָ תַעֲמֹד
  choice: இருந்த இடத்திலேயே நிலைத்திருந்து
  rationale: சொல்லுக்குச் சொல் பொருள் ‘அதன் கீழே நிற்கும்’ என்றாலும், பரவாமல் அதே இடத்தில் நிலைத்திருப்பதே சூழலிலுள்ள நோயறிதல் சார்ந்த பொருள்.
- source_word: הַבַּהֶרֶת
  choice: பளிச்சிடும் தழும்பு
  rationale: தோலில் காணப்படும் ஒளிர்ந்த நிறமாற்றத்தைக் குறிக்கிறது; ‘தழும்பு’ இயல்பான தமிழில் தோல் அடையாளத்தைத் தெரிவிக்கிறது.
- source_word: פָשְׂתָה בָעוֹר
  choice: தோலில் பரவாமல்
  rationale: தோல் பாதிப்பு விரிவடைவதைக் குறிக்கும் நோயறிதல் சொற்றொடரைத் தெளிவாகக் கொடுக்கிறது.
- source_word: כֵהָה
  choice: மங்கியிருந்தால்
  rationale: தழும்பின் பளிச்சிடும் தன்மை அல்லது தீவிரம் குறைந்திருப்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: שְׂאֵת הַמִּכְוָה
  choice: தீக்காயத்தால் ஏற்பட்ட வீக்கம்
  rationale: שְׂאֵת என்பது தோலில் உயர்ந்து காணப்படும் வீக்கத்தையும், הַמִּכְוָה தீக்காயத்தையும் குறிக்கின்றன.
- source_word: וְטִהֲרוֹ הַכֹּהֵן
  choice: ஆசாரியன் அவனைத் தூயவன் என்று அறிவிக்க வேண்டும்
  rationale: இங்கு வினை நேரடியாகத் தூய்மைப்படுத்துவதை அல்ல, ஆசாரியரின் பரிசோதனைக்குப் பிந்தைய தூய்மை அறிவிப்பைக் குறிக்கிறது.
- source_word: צָרֶבֶת הַמִּכְוָה
  choice: தீக்காயத்தின் வடு
  rationale: தீக்காயத்துக்குப் பின் எஞ்சும் அடையாளம் அல்லது தழும்பைக் குறிக்கும் சொல்லுக்கு ‘வடு’ சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
