  text: or in the warp or in the woof of the linen or of the wool[a], or in leather[c][b], or in any article made of leather—
translation:
  language: ta
  text: அல்லது லினன்[a] அல்லது கம்பளித் துணியின் பாவு நூலிலோ ஊடை நூலிலோ[b], அல்லது தோலிலோ, அல்லது தோலால் செய்யப்பட்ட எந்தப் பொருளிலோ—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “லினன்” என்பதற்கான எபிரெயச் சொல் இன்னும் நேரடியாக “ஆளி நார்” என்றும் பொருள்படலாம்; இங்கு அந்த நாரால் செய்யப்பட்ட நெசவுப் பொருள் குறிக்கப்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: “பாவு நூல்” என்பது நெசவின் நீளவாக்கு நூல்; “ஊடை நூல்” என்பது அதன் குறுக்கே நெய்யப்படும் நூல்.
    reason: technical_term
lexical_decisions:
- source_word: שְׁתִי
  choice: பாவு நூல்
  rationale: நெசவில் நீளவாக்கில் அமைக்கப்படும் warp நூல்களைக் குறிக்கும் வழக்கமான தமிழ்க் கலைச்சொல்.
- source_word: עֵרֶב
  choice: ஊடை நூல்
  rationale: பாவு நூல்களின் குறுக்கே நெய்யப்படும் weft நூல்களைக் குறிக்கும் தமிழ்க் கலைச்சொல்.
- source_word: לַפִּשְׁתִּים
  choice: லினன்
  rationale: இச்சொல் அடிப்படையில் ஆளி நாரைக் குறிக்கலாம்; இங்கு நெசவுப் பொருள் பேசப்படுவதால், ஆளி நாரால் செய்யப்பட்ட லினன் பொருளைக் குறிப்பது இயல்பானது.
- source_word: וְלַצָּמֶר
  choice: அல்லது கம்பளி
  rationale: צֶמֶר என்பது கம்பளி மயிர் அல்லது அதிலிருந்து செய்யப்பட்ட கம்பளிப் பொருளைக் குறிக்கிறது; இங்கு நெசவின் மூலப்பொருள் வகையாக வருகிறது.
- source_word: עוֹר
  choice: தோல்
  rationale: இச்சூழலில் பயன்படுத்தக்கூடிய பொருளாகப் பதப்படுத்தப்பட்ட விலங்குத் தோலைக் குறிக்கிறது; தமிழில் ‘தோல்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: בְּכָל מְלֶאכֶת עוֹר
  choice: தோலால் செய்யப்பட்ட எந்தப் பொருளிலும்
  rationale: מְלָאכָה இங்கு உழைப்பை அல்ல, செய்யப்பட்ட பொருளைச் சுட்டுகிறது; எனவே இயல்பான தமிழில் பொருளை வெளிப்படையாகக் கூறுகிறது.
- source_word: אוֹ ... אוֹ
  choice: அல்லது ... அல்லது / -லோ ... -லோ
  rationale: மாற்று இடங்களையும் பொருள் வகைகளையும் வரிசைப்படுத்தும் எபிரெய அமைப்பைத் தமிழின் இணைமாற்று வடிவங்களால் காக்கிறது.
