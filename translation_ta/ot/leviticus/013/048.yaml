translation_notes:
  register: நவீனத் தரத் தமிழில் தெளிவான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயத்தில் பொருள் வகைகள் பின்னர் வருவதால் உருவாகும் குழப்பத்தைத் தவிர்க்க, தமிழில் ‘லினன் அல்லது கம்பளி நெசவின்’ என்பது பாவு/ஊடை நூல்களுக்கு முன் வைக்கப்பட்டுள்ளது. இறுதி நீள்கோடு அடுத்த வசனத்துடன் தொடரும் வாக்கிய அமைப்பைக் காட்டுகிறது.
