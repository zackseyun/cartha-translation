base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/027.yaml
  text: And the priest shall examine him on the seventh day. If it has indeed spread in the skin, the priest shall pronounce him unclean; it is an infection of skin disease.
translation:
  language: ta
  text: ஏழாம் நாளில் ஆசாரியர் அவனைப் பரிசோதிக்க வேண்டும். அது தோலில் மேலும் பரவியிருந்தால், ஆசாரியர் அவனைத் தீட்டானவன் என்று அறிவிக்க வேண்டும்; அது தோல் நோய்ப் பாதிப்பாகும்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: பாரம்பரியமாக “தொழுநோய்” என்று மொழிபெயர்க்கப்படுகிறது. எபிரெயச் சொல், இஸ்ரவேலின் தூய்மைச் சட்டங்களில் பலவகையான கடுமையான தோல் நிலைகளைக் குறிக்கிறது; அது நவீன தொழுநோயை (ஹான்சன் நோயை) மட்டும் குறிப்பதில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָהוּ
  choice: அவனைப் பரிசோதிக்க வேண்டும்
  rationale: רָאָה என்பதன் அடிப்படைப் பொருள் ‘பார்த்தல்’ என்றாலும், இங்குள்ள ஆசாரிய நோயறிதல் நடைமுறையில் ‘பரிசோதித்தல்’ என்பதே சூழலுக்கேற்ற இயல்பான தமிழ்.
- source_word: הַכֹּהֵן
  choice: ஆசாரியர்
  rationale: லேவியராகமத்தின் சடங்கு மற்றும் தூய்மைச் சட்டச் சூழலில் כֹּהֵן என்பதற்கான நிலையான, மரியாதையான தமிழ் மொழிபெயர்ப்பு.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: ஏழாம் நாளில்
  rationale: எபிரெய காலக் குறிப்பைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: אִם פָּשֹׂה תִפְשֶׂה
  choice: நன்றாகப் பரவியிருந்தால்
  rationale: வினையெச்ச முழுமையும் வினைமுற்றும் சேர்ந்துள்ள எபிரெய வலியுறுத்தலை ‘நன்றாக’ என்பதன் மூலம் தமிழில் வெளிப்படுத்துகிறது; ஏழாம் நாள் பரிசோதனைக்குள் ஏற்பட்ட நிலையை ‘பரவியிருந்தால்’ காட்டுகிறது.
- source_word: בָּעוֹר
  choice: தோலில்
  rationale: עוֹר என்பதன் நேரடிப் பொருள் ‘தோல்’; நோய்க்குறி தோலில் பரவுவதை இயல்பான தமிழில் குறிக்கிறது.
- source_word: וְטִמֵּא ... אֹתוֹ
  choice: அவனைத் தீட்டுள்ளவன் என்று அறிவிக்க வேண்டும்
  rationale: ஆசாரியர் அவனைத் தீட்டாக்குகிறார் என்பதல்ல, அவனுடைய சடங்குசார் நிலையை அதிகாரபூர்வமாக அறிவிக்கிறார் என்பதைக் காட்டுகிறது.
- source_word: נֶגַע
  choice: பாதிப்பு
  rationale: נֶגַע என்பது இங்கு காணக்கூடிய நோய்ப்பாதிப்பு அல்லது புண்ணைக் குறிக்கிறது. ‘பாதிப்பு’ நவீன மருத்துவத் துல்லியத்தைத் தவறாகச் சுமத்தாமல் பரந்த பொருளைப் பாதுகாக்கிறது.
- source_word: צָרַעַת
  choice: தோல் நோய்
  rationale: இந்த எபிரெயச் சொல் நவீன ஹான்சன் நோயை மட்டும் குறிக்காது; லேவியராகமத்தின் தூய்மைச் சட்டங்களில் பலவகை கடுமையான தோல் நிலைகளை உள்ளடக்கும் பரந்த சொல்லாக உள்ளது.
- source_word: הִוא
  choice: அது
  rationale: முன்னர் விவரிக்கப்பட்ட பாதிப்பை அடையாளப்படுத்தும் பெண்பால் ஒருமைச் சுட்டுப்பெயரை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: צָרַעַת என்ற சொல்லைச் சடங்குசார் தூய்மைச் சட்டத்தில் மொழிபெயர்த்தல்
  choice: தோல் நோய்
  alternative: தொழுநோய்
  rationale: צָרַעַת என்பதை நவீன தொழுநோய் அல்லது ஹான்சன் நோயுடன் மட்டும் ஒப்பிடுவது காலப்பொருத்தமற்ற மருத்துவத் துல்லியத்தை இறக்குமதி செய்யும். ஆகவே முதன்மை உரை அதன் பரந்த பொருளைத் தக்கவைக்கிறது; பாரம்பரிய மொழிபெயர்ப்பு அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- issue: טִמֵּא என்பதில் ஆசாரியரின் பங்கு
  choice: தீட்டுள்ளவன் என்று அறிவிக்க வேண்டும்
  alternative: அவனைத் தீட்டாக்க வேண்டும்
  rationale: இச்சட்டச் சூழலில் ஆசாரியர் தீட்டை உண்டாக்குபவராக அல்லாமல், சடங்குசார் நிலையைத் தீர்மானித்து அறிவிப்பவராகச் செயல்படுகிறார்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான சட்டநடை பயன்படுத்தப்பட்டுள்ளது. ‘தீட்டுள்ளவன்’ என்பது மருத்துவ அசுத்தத்தைக் காட்டாமல் லேவியராகமத்தின் சடங்குசார் தூய்மை நிலையைத் தெரிவிக்கிறது. அடிக்குறிப்பு குறியீடு தொடர்புடைய ‘தோல் நோய்’ என்ற தொடருக்குப் பின் வைக்கப்பட்டுள்ளது.
