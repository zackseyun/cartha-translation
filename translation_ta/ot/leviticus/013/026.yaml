base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/026.yaml
  text: But if the priest examines it[a], and behold, there is no white hair in the bright spot, and it is not deeper than the skin, but it is faded[b], then the priest shall isolate him seven days.
translation:
  language: ta
  text: ஆனால் ஆசாரியர் அதை ஆராய்ந்து பார்க்கும்போது, அந்த ஒளிரும் புள்ளியில் வெள்ளை முடி இல்லாமல், அது தோலைவிட ஆழமாகத் தோன்றாமலும்[a] மங்கியதாகவும் இருந்தால், ஆசாரியர் அவனை ஏழு நாட்கள் தனிமைப்படுத்த வேண்டும்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அது தோலைவிடத் தாழ்வாக இல்லை”; அதாவது, சுற்றியுள்ள தோலின் மட்டத்திற்குக் கீழே பள்ளமாகத் தோன்றவில்லை.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவனைத் தனியே அடைத்து வைக்க வேண்டும்” அல்லது “அவனைத் தனியே வைத்திருக்க வேண்டும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאֶנָּה
  choice: அதை ஆராய்ந்து பார்க்கும்போது
  rationale: எபிரெய வினைச்சொல்லின் அடிப்படைப் பொருள் ‘பார்’ என்பதாக இருந்தாலும், இங்கு ஆசாரியர் மேற்கொள்ளும் முறையான தோல் பரிசோதனையைச் சூழல் குறிக்கிறது.
- source_word: בַּבֶּהֶרֶת
  choice: அந்தப் பளிச்சிடும் தழும்பில்
  rationale: בַּהֶרֶת என்பது ஒளிர்வான அல்லது வெளிறிய தோல் அடையாளத்தைக் குறிக்கிறது; குறிப்பிட்ட மருத்துவ நோயாக முன்கூட்டியே அடையாளப்படுத்தாமல் அதன் காட்சி இயல்பை இச்சொற்றொடர் காக்கிறது.
- source_word: שֵׂעָר לָבָן
  choice: வெள்ளை முடி
  rationale: எபிரெய ஒருமை வடிவம் கூட்டுப் பொருளில் வருவதால், தமிழில் இயல்பான பொதுப்பெயராக ‘வெள்ளை முடி’ பயன்படுத்தப்படுகிறது.
- source_word: וּשְׁפָלָה אֵינֶנָּה מִן הָעוֹר
  choice: அது தோலைவிட ஆழமாகத் தோன்றாமல்
  rationale: சொல்லடிப்படையில் ‘தோலைவிடத் தாழ்வாக இல்லை’ என்பதைக் குறிக்கிறது. தோலைச் சுற்றியுள்ள பகுதியைவிடப் பள்ளமாகத் தெரியவில்லை என்ற பரிசோதனைக் குறிப்பை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: כֵהָה
  choice: மங்கியதாக
  rationale: அடையாளம் தெளிவாகவோ தீவிரமாகவோ இல்லாமல் மந்தமாகத் தெரிவதை ‘மங்கிய’ இயல்பாகக் கூறுகிறது.
- source_word: וְהִסְגִּירוֹ
  choice: அவனைத் தனிமைப்படுத்த வேண்டும்
  rationale: கவனிப்புக்காக ஒருவரை அடைத்து அல்லது பிறரிடமிருந்து பிரித்து வைப்பதே இவ்வினைச்சொல்லின் சூழல்சார் பொருள். நவீன பொதுச் சுகாதார நடைமுறையை அளவுக்கு மீறி ஏற்றாமல் இதைத் தெளிவாகச் சொல்கிறது.
- source_word: שִׁבְעַת יָמִים
  choice: ஏழு நாட்கள்
  rationale: கால அளவை நேரடியாகவும் இயல்பாகவும் மொழிபெயர்க்கிறது.
