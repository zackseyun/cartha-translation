translation_notes:
  register: நவீனத் தரமான, dignified தமிழில் ஆசாரியப் பரிசோதனையின் நடைமுறைத் தன்மை தெளிவாக வைக்கப்பட்டுள்ளது. எபிரெய உரையில் உள்ள காட்சி அடையாளங்கள் மருத்துவ நோயறிதலாக மிகைப்படுத்தப்படவில்லை. ஆலோசனை ஆங்கில உரையில் அடிக்குறிப்பு குறிகள் கருத்துக்குரிய சொற்களுடன் பொருந்தாமல் இருந்ததால், [a] ஆழம்/தாழ்வு குறிக்கும் தொடருக்குப் பின்னும் [b] தனிமைப்படுத்தும் செயலுக்குப் பின்னும் பொருத்தமாக வைக்கப்பட்டுள்ளன.
