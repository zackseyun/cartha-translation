id: LEV.13.14
reference: Leviticus 13:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וּ/בְ/י֨וֹם הֵרָא֥וֹת בּ֛/וֹ בָּשָׂ֥ר חַ֖י יִטְמָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/014.yaml
  text: But on the day living flesh appears in it, he shall be unclean.
translation:
  language: ta
  text: ஆனால் உயிருள்ள சதை அவனில் காணப்படும் நாளில், அவன் தீட்டுள்ளவனாவான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּשָׂר חַי
  choice: உயிருள்ள சதை
  rationale: எபிரேயச் சொற்றொடரின் நேரடியான பொருளையும், நோய்ப்பட்ட தோலிடையே தோன்றும் இயல்பான உயிர்த்திசு என்ற சூழல்சார் கருத்தையும் தக்கவைக்கிறது.
- source_word: הֵרָאוֹת
  choice: காணப்படும்
  rationale: நிஃபால் வினையெச்சத்தின் ‘தோன்றுதல்/காணப்படுதல்’ என்ற பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בּוֹ
  choice: அதில்
  rationale: உடனடியான சூழலில் விவரிக்கப்படும் பாதிக்கப்பட்ட நிலை அல்லது புண்ணைக் குறிக்கும் ஆங்கில ஆலோசனை உரையின் புரிதலைப் பின்பற்றுகிறது; எபிரேய ஆண்பால் ஒருமைச் சுட்டுப்பெயரின் சாத்தியமான குறிப்பில் உள்ள தெளிவின்மையை முற்றிலும் தனிப்பட்ட விளக்கமாக மாற்றவில்லை.
- source_word: יִטְמָא
  choice: அவன் தீட்டுள்ளவனாவான்
  rationale: சடங்குசார் அசுத்தநிலையை குறிக்கும் எபிரேயச் சொல்லை ‘தீட்டு’ என்ற வேதாகமத் தமிழ்ச் சொல்லால் வெளிப்படுத்துகிறது; எதிர்கால/தீர்ப்புரைப் பயன்பாட்டையும் காக்கிறது.
theological_decisions:
- issue: טמא என்பதன் சடங்குசார் பொருள்
  choice: தீட்டுள்ளவனாவான்
  alternative: அசுத்தமாவான்
  rationale: இது ஒழுக்கக் குற்றமோ சாதாரண அழுக்கோ அல்ல, லேவியராகமச் சட்டத்தில் வரையறுக்கப்படும் சடங்குசார் நிலை என்பதை ‘தீட்டு’ தெளிவாகக் காட்டுகிறது.
- issue: בּוֹ என்ற சுட்டுப்பெயரின் குறிப்பு
  choice: அதில்
  alternative: அவனில்
  rationale: வசனச் சூழலில் உயிருள்ள சதை பாதிக்கப்பட்ட பகுதி/நிலையில் தெரிவதை முன்னிறுத்துகிறது; கொடுக்கப்பட்ட ஆங்கில POB திருத்தத்துடனும் ஒத்துள்ளது. எபிரேய வடிவம் இலக்கண ரீதியாக ஆண்பால் ஒருமையாக இருந்தாலும், தமிழில் ‘அதில்’ என்பது இங்கு இயல்பான சூழல்சார் குறிப்பு.
translation_notes:
  register: நவீனத் தரத் தமிழில் சுருக்கமான சட்டவாக்கிய நடை. ‘ஆனால்’ எதிர்மறை மாற்றத்தை வெளிப்படுத்துகிறது; ‘தீட்டுள்ளவனாவான்’ சடங்குசார் அர்த்தத்தை dignified biblical register-இல் தக்கவைக்கிறது.
