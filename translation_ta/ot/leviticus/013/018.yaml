base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/018.yaml
  text: And when the body has a boil in its skin[a], and it heals[c][b],
translation:
  language: ta
  text: ஒருவருடைய உடலின் தோலில் ஒரு புண் உண்டாகி, அது குணமடைந்தால்,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבָשָׂר
  choice: ஒருவருடைய உடல்
  rationale: בָשָׂר என்பதன் அடிப்படைப் பொருள் ‘சதை’; இச்சட்டவழக்குச் சூழலில் மனிதரின் உடலைக் குறிப்பதால், நவீனத் தமிழில் ‘ஒருவருடைய உடல்’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: כִּי
  choice: உண்டாகி ... ஆனால்
  rationale: כִּי இங்கு ஒரு வழக்கின் நிபந்தனையை அறிமுகப்படுத்துகிறது. தமிழில் ‘-ஆல்’ அமைப்பு அதனை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יִהְיֶה
  choice: உண்டாகி
  rationale: எபிரெய வினைச்சொல்லின் நேரடிப் பொருள் ‘இருத்தல்’; தோல் பாதிப்பைக் குறிக்கும் இச்சூழலில் ‘உண்டாகுதல்’ இயல்பான தமிழ் வழக்கு.
- source_word: בּוֹ בְעֹרוֹ
  choice: உடலின் தோலில்
  rationale: இரட்டை இடக்குறிப்பைச் சொற்சொல்லாகப் பின்பற்றாமல், அதன் பொருளைத் தெளிவான தமிழ் உடைமை-இட அமைப்பில் வழங்குகிறது.
- source_word: שְׁחִין
  choice: ஒரு கொப்புளம்
  rationale: שְׁחִין என்பது வீக்கமும் அழற்சியும் கொண்ட boil போன்ற தோல் புண்ணைக் குறிக்கிறது; ‘கொப்புளம்’ பொதுவாகப் புரியும் சுருக்கமான தமிழ் மருத்துவச் சொல்.
- source_word: וְנִרְפָּא
  choice: அது குணமானால்
  rationale: ரפא என்பதன் நிஃபால் வடிவம் இங்கு புண் குணமடைந்த நிலையைக் குறிக்கிறது; ‘குணமானால்’ நிபந்தனைச் சட்டவாக்கியத்துடன் இயல்பாக இணைகிறது.
