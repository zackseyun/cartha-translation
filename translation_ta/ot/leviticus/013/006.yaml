base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/006.yaml
  text: Then the priest shall examine him again on the seventh day[a], and if the infection has faded and the infection has not spread in the skin, the priest shall pronounce him clean; it is a scaly eruption. He shall wash his clothes and be clean.
translation:
  language: ta
  text: ஏழாம் நாளில் ஆசாரியன் அவனை மீண்டும் பரிசோதிக்க வேண்டும். அந்தப் பாதிப்பு மங்கியிருப்பதையும் தோலில் பரவாமல் இருப்பதையும் அவர் கண்டால், ஆசாரியன் அவனைத் தூயவன் என்று அறிவிக்க வேண்டும். அது செதில்களுள்ள தோல் சொறி[a]. அவன் தன் உடைகளைக் கழுவ வேண்டும்; அப்போது அவன் தூயவனாவான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தோல் சொறி.” இந்த எபிரெயச் சொல், தீவிரமாகப் பரவும் பாதிப்புக்கு மாறாக, ஒப்பீட்டளவில் சிறிய தோல் பாதிப்பைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: பரிசோதிக்க வேண்டும்
  rationale: ஆசாரியரின் அதிகாரப்பூர்வமான தோல் பரிசோதனையைச் சூழல் குறிக்கிறது; வெறுமனே ‘பார்ப்பது’ என்பதைவிட இது தெளிவானது.
- source_word: שֵׁנִית
  choice: மீண்டும்
  rationale: பரிசோதனை மறுபடியும் நடைபெறுவதை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: כֵּהָה
  choice: மங்கியிருப்பது
  rationale: பாதிப்பின் நிறமோ தென்படும் தீவிரமோ குறைந்திருப்பதைக் குறிக்கும் எபிரெயச் சொல்லின் பார்வைசார் பொருளைப் பாதுகாக்கிறது.
- source_word: הַנֶּגַע
  choice: அந்தப் பாதிப்பு
  rationale: காணக்கூடிய தோல் பாதிப்பை பொதுவாகக் குறிக்கிறது; ‘தொற்று’ என்று மொழிபெயர்த்து நவீன மருத்துவக் காரணத்தை தேவையின்றி ஊகிப்பதைத் தவிர்க்கிறது.
- source_word: פָשָׂה
  choice: பரவாமல் இருப்பது
  rationale: தோலில் பாதிப்பு விரிவடையவில்லை என்பதே இச்சூழலில் சொல்லின் நேரடியான பொருள்.
- source_word: בָּעוֹר
  choice: தோலில்
  rationale: עוֹר என்பதன் பொருள் ‘தோல்’; இங்கு தமிழ் வழக்கில் ‘தோலில்’ இயல்பாக உள்ளது.
- source_word: וְטִהֲרוֹ הַכֹּהֵן
  choice: ஆசாரியன் அவனைத் தூயவன் என்று அறிவிக்க வேண்டும்
  rationale: ஆசாரியன் உடல் நோயை நீக்குகிறார் என்று அல்லாமல், சடங்குசார் தூய்மை நிலையை அதிகாரப்பூர்வமாகத் தீர்மானிக்கிறார் என்பதைத் தெளிவாக்குகிறது.
- source_word: מִסְפַּחַת
  choice: செதிலுள்ள ஒரு தோல் சொறி
  rationale: தீவிரமாகப் பரவும் பாதிப்பிலிருந்து வேறுபட்ட, ஒப்பீட்டளவில் சிறிய தோல் வெடிப்பு அல்லது சொறியைத் தெரிவிக்கிறது; சொல்லின் துல்லிய வரம்பு உறுதியற்றதால் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְכִבֶּס בְּגָדָיו
  choice: அவன் தன் உடைகளைக் கழுவ வேண்டும்
  rationale: ஆடைகளைத் துவைக்கும் கட்டளையை இயல்பான நவீன தமிழில் வழங்குகிறது.
- source_word: וְטָהֵר
  choice: அப்போது அவன் தூயவனாவான்
  rationale: உடைகளைக் கழுவிய பின் ஏற்படும் சடங்குசார் தூய்மை நிலையை விளைவாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: சடங்குசார் தூய்மைத் தீர்ப்பு அல்லது உடல் குணமடைதல்
  choice: ஆசாரியன் ‘தூயவன் என்று அறிவிக்க வேண்டும்’ என்றும், உடைகளைக் கழுவிய பின் அவன் ‘தூயவனாவான்’ என்றும் மொழிபெயர்க்கப்பட்டது.
  alternative: ஆசாரியன் அவனைத் தூய்மைப்படுத்துவார்; அவன் குணமடைந்தான்.
  rationale: இவ்வசனம் ஆசாரியரின் சடங்கு மற்றும் சட்டத் தீர்ப்பைப் பற்றியது; உடல் நோயை ஆசாரியர் குணப்படுத்துகிறார் என்றோ முழுமையான மருத்துவக் குணமடைதல் நிகழ்ந்தது என்றோ மூலவசனம் கூறவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்ட-சடங்குச் சூழலுக்கேற்ற கண்ணியமான நடையும் பொதுவாசகர்கள் புரிந்துகொள்ளும் சொற்களும் பயன்படுத்தப்பட்டுள்ளன. ‘ஆசாரியன்’ மற்றும் ‘தூயவன்’ ஆகியவை லேவியராகமத்தின் சடங்குசார் சொல்வழக்கைத் தொடர்கின்றன; மருத்துவ ரீதியாகத் தேவையற்ற ‘தொற்று’ என்ற ஊகம் தவிர்க்கப்பட்டுள்ளது.
