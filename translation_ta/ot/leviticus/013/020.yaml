  edition: WLC
  text: וְ/רָאָ֣ה הַ/כֹּהֵ֗ן וְ/הִנֵּ֤ה מַרְאֶ֨/הָ֙ שָׁפָ֣ל מִן הָ/ע֔וֹר וּ/שְׂעָרָ֖/הּ הָפַ֣ךְ לָבָ֑ן וְ/טִמְּא֧/וֹ הַ/כֹּהֵ֛ן נֶֽגַע צָרַ֥עַת הִ֖וא בַּ/שְּׁחִ֥ין פָּרָֽחָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/020.yaml
  text: And the priest shall examine it[a], and behold, its appearance is deeper than the skin, and its hair has turned white; then the priest shall pronounce him unclean. It is an outbreak of leprosy; it has broken out in the boil.
translation:
  language: ta
  text: ஆசாரியன் அதைப் பரிசோதிக்க வேண்டும். இதோ, அது தோலின் மட்டத்திற்குக் கீழே அமிழ்ந்ததுபோல் தோன்றுகிறது; அதிலுள்ள முடி வெண்மையாக மாறியிருக்கிறது. அப்போது ஆசாரியன் அவனைத் தீட்டுள்ளவன் என்று அறிவிக்க வேண்டும். அது ஒரு தோல் நோய்ப் பாதிப்பு[a]; அது அந்தப் புண்ணில் தோன்றியுள்ளது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் צָרַעַת (ட்சரஅத்); பாரம்பரியமாக ‘தொழுநோய்’ என்று மொழிபெயர்க்கப்படுகிறது. ஆனால் லேவியராகமத்தில் இச்சொல் இன்றைய ஹான்சன் நோயை மட்டும் அல்லாமல், பலவகையான கடுமையான தோல் பாதிப்புகளையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: பரிசோதிக்க வேண்டும்
  rationale: ஆசாரியரின் நோயறிதல் சார்ந்த ஆய்வைக் குறிக்கும் சூழலில், வெறுமனே ‘பார்த்தல்’ என்பதைக் காட்டிலும் ‘பரிசோதித்தல்’ பொருத்தமானது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: கவனத்தை நோயறிகுறிகளின் பக்கம் திருப்பும் எபிரெய உரையாடல் குறியீட்டின் வலிமையைப் பாதுகாக்கிறது.
- source_word: מַרְאֶהָ שָׁפָל מִן הָעוֹר
  choice: அது தோலைவிடப் பள்ளமாகத் தோன்றுகிறது
  rationale: பாதிக்கப்பட்ட இடம் சுற்றியுள்ள தோலின் மட்டத்திற்குக் கீழே அமிழ்ந்திருப்பதுபோல் தோன்றுவதை இயல்பான தமிழில் தெரிவிக்கிறது; இது தோற்றத்தைப் பற்றிய கூற்று என்ற நுட்பத்தையும் காக்கிறது.
- source_word: וּשְׂעָרָהּ הָפַךְ לָבָן
  choice: அதிலுள்ள முடி வெண்மையாக மாறியிருக்கிறது
  rationale: பெண்பால் பின்னொட்டு பாதிக்கப்பட்ட இடத்தைக் குறிப்பதால், அப்பகுதியிலுள்ள முடியைத் தெளிவாகக் குறிப்பிடுகிறது.
- source_word: וְטִמְּאוֹ
  choice: அவனைத் தீட்டுள்ளவன் என்று அறிவிக்க வேண்டும்
  rationale: ஆசாரியன் அந்த மனிதனைத் தீட்டாக்குவதில்லை; சடங்குசார் தூய்மைச் சட்டத்தின்படி அவனுடைய நிலையை அதிகாரபூர்வமாக அறிவிக்கிறார்.
- source_word: נֶגַע צָרַעַת
  choice: தொழுநோய் பாதிப்பு
  rationale: צָרַעַת என்பதற்கான பாரம்பரியத் தமிழ்ச் சொல்லை முதன்மை உரையில் வைத்துக்கொண்டு, அதன் பொருள் நவீன ஹான்சன் நோயை விட விரிவானதாக இருக்கலாம் என்பதை அடிக்குறிப்பில் விளக்குகிறது. נֶגַע இங்கு நோய்ப்பாதிப்பைக் குறிக்கிறது.
- source_word: בַּשְּׁחִין
  choice: கொப்புளத்தில்
  rationale: שְׁחִין என்பது வீக்கமுற்ற கொப்புளம் அல்லது புண்ணைக் குறிக்கிறது; இச்சூழலில் ‘கொப்புளம்’ தெளிவான பொதுநடைச் சொல்.
- source_word: פָּרָחָה
  choice: வெடித்தெழுந்துள்ளது
  rationale: வினைச்சொல்லின் ‘முளைத்தல்/வெளிப்படுதல்’ என்ற படிமத்தை நோய்ப்பாதிப்பு கொப்புளத்தில் தோன்றியதைக் குறிக்கும் இயல்பான தமிழில் தருகிறது; உடல் முழுவதும் பரவியது என்று தேவையின்றி சொல்லவில்லை.
theological_decisions:
- issue: லேவியராகமத்தின் தூய்மைச் சட்டத்தில் צָרַעַת என்பதன் மொழிபெயர்ப்பு
  choice: தொழுநோய்[a]
  alternative: கடுமையான தோல் நோய்
  rationale: பாரம்பரியமாக அறியப்பட்ட சொல்லை உரையில் காக்கிறது; ஆனால் அதை இன்றைய ஹான்சன் நோயோடு மட்டும் ஒப்பிடும் காலப்பொருத்தமற்ற மருத்துவத் துல்லியத்தை அடிக்குறிப்பு தவிர்க்கிறது. இவ்வாறு எபிரெயச் சொல்லின் பரந்த, முழுமையாக உறுதிசெய்ய முடியாத நோயியல் வரம்பு பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. சட்டநடைத் தன்மைக்காக ‘வேண்டும்’ அமைப்பு காக்கப்பட்டுள்ளது; ‘தீட்டுள்ளவன்’ என்பது மருத்துவ நிலையல்ல, லேவியராகமத்தின் சடங்குசார் தூய்மை நிலை என்பதைச் சூழல் வெளிப்படுத்துகிறது.
