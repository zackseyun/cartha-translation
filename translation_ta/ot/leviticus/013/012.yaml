base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/012.yaml
  text: And if the skin disease breaks out all over the skin[a], and the skin disease covers all the skin of the affected person from his head to his feet, as far as the priest can see[b],
translation:
  language: ta
  text: தோல் நோய் தோல் முழுவதும் பரவிப் பெருகி[a], பாதிக்கப்பட்ட நபரின் தலை முதல் கால்கள் வரை, ஆசாரியரின் கண்களுக்குத் தெரியும் அளவுக்கு, அவரது தோல் முழுவதையும்[b] மூடியிருந்தால்,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு “தோல் நோய்” என்று மொழிபெயர்க்கப்பட்டுள்ள צָרַעַת (ட்சராஅத்) என்பது லேவியராகமத்தில் சடங்குத் தூய்மை தொடர்பான பலவகைத் தோல் பாதிப்புகளைக் குறிக்கிறது; இதை நவீன தொழுநோய் (ஹான்சன் நோய்) என்று மட்டும் கருதக்கூடாது.
    reason: cultural_note
  - marker: b
    text: இன்னும் சொல்லுக்கு நெருக்கமாக, “பாதிப்பின் தோல் முழுவதையும்.” இந்த எபிரெயச் சொற்றொடர் நோயால் பாதிக்கப்பட்ட நபரின் தோலைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּרוֹחַ תִּפְרַח
  choice: மிகுதியாகப் பரவி
  rationale: வினையெச்சத்தின் முழுவடிவமும் வினைமுற்றும் சேர்ந்த எபிரெய அமைப்பு பரவுதலின் தீவிரத்தையும் விரிவையும் வலியுறுத்துகிறது; நவீன தமிழில் இயல்பாக இதைத் தெரிவிக்கிறது.
- source_word: הַצָּרַעַת
  choice: தோல் நோய்
  rationale: லேவியராகமத்தில் צָרַעַת பலவகையான சடங்குத் தூய்மை சார்ந்த தோல் பாதிப்புகளைக் குறிக்கிறது; அதை நவீன தொழுநோயுடன் மட்டும் ஒப்பிடாமல், வாசகருக்கு புரியும் பொதுவான சொல்லாக இது அமைகிறது.
- source_word: בָּעוֹר
  choice: தோல் முழுவதும்
  rationale: בְּ முன்னிடைச்சொல் தோலில் அல்லது தோல்மேல் ஏற்பட்ட பரவலைக் குறிக்கிறது; சூழலில் பரவலின் முழுமையை அடுத்த சொற்றொடர் உறுதிப்படுத்துவதால் தமிழில் இவ்வாறு இயல்பாக அமைகிறது.
- source_word: וְכִסְּתָה
  choice: மூடியிருந்தால்
  rationale: நிபந்தனை வாக்கியத் தொடரில் வரும் வினை, நோய் தோலை மூடியிருக்கும் நிலையைச் சுட்டுகிறது; தமிழில் நிபந்தனை அமைப்புடன் இணைக்கப்பட்டது.
- source_word: אֵת כָּל עוֹר הַנֶּגַע
  choice: பாதிக்கப்பட்டவரின் ... தோல் முழுவதையும்
  rationale: சொல்லுக்கு சொல் பொருள் ‘பாதிப்பின் தோல் முழுவதையும்’ என்றாலும், இங்கு நோயால் பாதிக்கப்பட்ட நபரின் தோல் குறிக்கப்படுகிறது; அடிக்குறிப்பில் நேரடியான மாற்று பாதுகாக்கப்படுகிறது.
- source_word: מֵרֹאשׁוֹ וְעַד רַגְלָיו
  choice: தலை முதல் கால்வரை
  rationale: உடல் முழுவதையும் குறிக்கும் எபிரெய இருமுனைச் சொல்லாட்சியைச் சுருக்கமாகவும் இயல்பாகவும் காக்கிறது.
- source_word: לְכָל מַרְאֵה עֵינֵי הַכֹּהֵן
  choice: ஆசாரியரின் கண்களுக்குத் தெரியும் அளவுக்கு
  rationale: ஆசாரியர் ஆய்வு செய்யும்போது காணக்கூடிய முழு எல்லையையும் குறிக்கும் மூலமொழிச் சொல்லாட்சியைத் தமிழில் தெளிவாகத் தருகிறது.
