  text: 'யாவே[a] மோசேக்கும் ஆரோனுக்கும் கூறியதாவது:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரேய மொழியில்: ‘YHWH’ (יהוה). இங்கு அது ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது; பல மொழிபெயர்ப்புகளில் மரபாக ‘ஆண்டவர்’ என்று வழங்கப்படுகிறது.'
    reason: இறைப் பெயரின் மூல வடிவத்தையும் மரபான மாற்று வழங்கலையும் தெரிவிக்கிறது.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பேசிக்
  rationale: וַיְדַבֵּר ஒரு புதிய தெய்வீக உரையைத் தொடங்குகிறது. தொடரும் לֵאמֹר என்பதுடன் இயல்பாக இணைவதற்காக ‘பேசிக்’ என வழங்கப்பட்டது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எழுத்துகளைக் கொண்ட இறைப் பெயரான יהוה-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், நவீன தமிழில் அதன் பொதுவான ஒலிபெயர்ப்பாக ‘யாவே’ என வழங்குகிறது.
- source_word: אֶל מֹשֶׁה
  choice: மோசேயிடம்
  rationale: אֶל இங்கு உரை யாரை நோக்கிச் சொல்லப்பட்டது என்பதைக் குறிக்கிறது; நவீன தமிழில் ‘மோசேயிடம்’ இயல்பான இணை.
- source_word: וְאֶל אַהֲרֹן
  choice: ஆரோனிடமும்
  rationale: וְאֶל இரண்டாவது பெறுநரையும் தனியே இணைக்கிறது. ‘-இடமும்’ என்பது மோசே, ஆரோன் இருவரும் உரையின் பெறுநர்கள் என்பதைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: לֵאמֹר
  choice: 'கூறியதாவது:'
  rationale: இந்த வினையெச்ச வடிவம் அடுத்து வரும் நேரடி உரையை அறிமுகப்படுத்துகிறது. ‘கூறியதாவது:’ அந்தத் தொடர்பை இயல்பான, கண்ணியமான தமிழில் காட்டுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை வழங்குதல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூல எபிரெய உரையில் ஒரு பட்டப்பெயர் அல்ல, יהוה என்ற தனிப்பட்ட இறைப் பெயரே உள்ளது. ஆகவே பெயரைப் பாதுகாக்க ‘யாவே’ பயன்படுத்தப்பட்டது; மரபான ‘ஆண்டவர்’ என்பது அடிக்குறிப்பில் தெரிவிக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டு உரைக்கேற்ற கண்ணியத்துடன் அமைக்கப்பட்டது. ‘பேசிக் கூறியதாவது’ என்பது எபிரெய மொழியின் דבר + לאמר உரைத் தொடக்கச் சூத்திரத்தின் இரு கூறுகளையும் பாதுகாத்து, அடுத்த வசனத்துடன் தொடரும் வாக்கியமாக இயல்பாகச் செயல்படுகிறது.
