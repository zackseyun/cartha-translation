  text: וְ/שָׂרַ֨ף אֶת הַ/בֶּ֜גֶד א֥וֹ אֶֽת הַ/שְּׁתִ֣י א֣וֹ אֶת הָ/עֵ֗רֶב בַּ/צֶּ֨מֶר֙ א֣וֹ בַ/פִּשְׁתִּ֔ים א֚וֹ אֶת כָּל כְּלִ֣י הָ/ע֔וֹר אֲשֶׁר יִהְיֶ֥ה ב֖/וֹ הַ/נָּ֑גַע כִּֽי צָרַ֤עַת מַמְאֶ֨רֶת֙ הִ֔וא בָּ/אֵ֖שׁ תִּשָּׂרֵֽף־־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/052.yaml
  text: He shall burn the garment[a], or the warp or the woof in wool or in linen, or any article of leather in which the infection is, for it is a destructive skin disease[b]; it shall be burned in the fire.
translation:
  language: ta
  text: அந்த ஆடையையோ[a], கம்பளியிலோ லினனிலோ உள்ள நீள்நூலையோ குறுக்குநூலையோ, அல்லது பாதிப்பு உள்ள தோல்ப் பொருள் எதையுமோ அவர் எரிக்க வேண்டும். ஏனெனில் அது அழிவுண்டாக்கும் சாராஅத் பாதிப்பு[b]; அது நெருப்பில் எரிக்கப்பட வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நீள்நூல்’ என்பது நெசவின் நிமிர்வான நூல்கள் (பாவை); ‘குறுக்குநூல்’ என்பது அவற்றினூடே செல்லும் நூல்கள் (ஊடை).
    reason: lexical_alternative
  - marker: b
    text: ‘சாராஅத்’ (எபிரெயம் צָרַעַת; மரபாக ‘தொழுநோய்’) நவீன தொழுநோயை மட்டும் குறிக்காது. லேவியராகமத்தில் அது மனிதத் தோல், ஆடை, வீடு ஆகியவற்றில் தோன்றி சடங்குசார் தீட்டை உண்டாக்கும் பலவகைப் பாதிப்புகளைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וְשָׂרַף
  choice: அவர் எரித்துவிட வேண்டும்
  rationale: சட்ட நடைமுறையைத் தொடரும் கட்டளையாக உள்ளதால், தமிழில் கடமையைக் குறிக்கும் இயல்பான வடிவம் பயன்படுத்தப்பட்டது.
- source_word: הַבֶּגֶד
  choice: அந்த ஆடை
  rationale: בגד என்பதன் பொதுவான பொருள் ஆடை; சூழலில் முன் குறிப்பிடப்பட்ட பொருளைக் காட்ட ‘அந்த’ சேர்க்கப்பட்டது.
- source_word: הַשְּׁתִי ... הָעֵרֶב
  choice: பாவை ... ஊடை
  rationale: நெசவின் நீள்நூல் மற்றும் குறுக்குநூலைக் குறிக்கும் இணைத் தொழில்நுட்பச் சொற்களாகத் தமிழில் வழங்கப்பட்டன.
- source_word: בַּצֶּמֶר א֣וֹ בַפִּשְׁתִּים
  choice: கம்பளி அல்லது நார்ப்பட்டுத் துணியின்
  rationale: צמר என்பது கம்பளியையும், פשתים என்பது ஆளி நாரால் செய்யப்பட்ட லினன் துணியையும் குறிக்கிறது; சாதாரண வாசகருக்குப் புரியும் பொருள் சார்ந்த வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- source_word: כָּל כְּלִי הָעוֹר
  choice: தோலால் செய்யப்பட்ட எந்தப் பொருள்
  rationale: כלי இங்கு பாத்திரம் மட்டும் அல்லாமல் எந்தப் பயன்பாட்டுப் பொருளையும் குறிக்கும்; அதனால் பரந்த சொல் பயன்படுத்தப்பட்டது.
- source_word: הַנָּגַע
  choice: அந்தப் பாதிப்பு
  rationale: இது காணப்படும் கறை/தாக்கம்/பாதிப்பைக் குறிக்கிறது; நவீன மருத்துவத் தொற்று என்று மிகத் துல்லியப்படுத்தாமல் ‘பாதிப்பு’ என வழங்கப்பட்டது.
- source_word: צָרַעַת מַמְאֶרֶת
  choice: அழிவுண்டாக்கும் தொழுநோய்ப் பாதிப்பு
  rationale: மரபுச் சொல்லான ‘தொழுநோய்’ மூலம் எபிரெயச் சட்டவகையின் தொடர்பு காக்கப்படுகிறது; பொருட்களுக்கும் வீடுகளுக்கும் பொருந்தும் பரந்த பொருளை ‘பாதிப்பு’ மற்றும் அடிக்குறிப்பு தெளிவுபடுத்துகின்றன. מַמְאֶרֶת என்பதன் அழிக்கும்/கடும் தன்மை ‘அழிவுண்டாக்கும்’ எனக் கொடுக்கப்பட்டது.
- source_word: בָּאֵשׁ תִּשָּׂרֵף
  choice: அது நெருப்பில் எரிக்கப்பட வேண்டும்
  rationale: நிபால் வினையின் செயப்பாட்டு வடிவமும் சட்டக் கட்டாயமும் நேரடியாகக் காக்கப்பட்டன.
theological_decisions:
- issue: צָרַעַת என்ற லேவியத் தூய்மைச்சட்டச் சொல்லின் மொழிபெயர்ப்பு
  choice: தொழுநோய்ப் பாதிப்பு
  alternative: தோல் நோய்; தீட்டுப்படுத்தும் பாதிப்பு; சாராஅத்
  rationale: இந்த எபிரெயச் சொல் நவீன ஹான்சன் நோயோடு மட்டும் ஒத்ததல்ல; ஆடை மற்றும் வீட்டுப் பாதிப்புகளுக்கும் பயன்படுகிறது. ‘தொழுநோய்’ என்ற அறிமுகமான மரபுச் சொல்லை வைத்துக்கொண்டு, ‘பாதிப்பு’ மற்றும் அடிக்குறிப்பின் மூலம் அதன் பரந்த சடங்குசார் வகை வெளிப்படுத்தப்பட்டது.
translation_notes:
  register: நவீன தரத் தமிழில், சட்ட உரைக்கு ஏற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. நெசவுத் தொழில்நுட்பச் சொற்கள் பிரதான உரையில் சுருக்கமாக வைக்கப்பட்டு அடிக்குறிப்பில் விளக்கப்பட்டன; மருத்துவ ரீதியாகத் தவறான ஒரே பொருள் அடையாளப்படுத்தல் தவிர்க்கப்பட்டது.
