base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/051.yaml
  text: On the seventh day he shall examine the infection[a], and if the infection has spread in the garment, or in the warp, or in the woof, or in the leather, in anything for which leather is made for work, the infection is a destructive skin disease[c][b]; it is unclean.
translation:
  language: ta
  text: ஏழாம் நாளில் அவன் அந்தப் பாதிப்பை ஆராய வேண்டும். அந்தப் பாதிப்பு ஆடையிலோ, பாவிலோ[b], ஊடையிலோ[b], தோலிலோ, தோலால் செய்யப்பட்ட எந்தப் பயன்பாட்டுப் பொருளிலோ பரவியிருந்தால், அது அழிவுண்டாக்கும் சாராத்[a] பாதிப்பு; அது தீட்டானது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சாராத்” என்பது எபிரெயச் சொல். இது மரபாக “தொழுநோய்” என்று மொழிபெயர்க்கப்பட்டாலும், லேவியராகமத்தில் பலவகையான தீட்டுப் பாதிப்புகளைக் குறிக்கிறது; ஆடை மற்றும் தோலுக்கும் இச்சொல் பயன்படுத்தப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: “பாவு” என்பது நெசவின் நீளவாக்கு நூல்; “ஊடை” என்பது அதன் குறுக்கே செல்லும் நூல்.
    reason: technical_term
lexical_decisions:
- source_word: וְרָאָה
  choice: ஆராய வேண்டும்
  rationale: ஆசாரியர் மேற்கொள்ளும் முறைப்படியான பரிசோதனையைச் சூழல் குறிப்பதால், வெறுமனே ‘பார்க்க வேண்டும்’ என்பதைக் காட்டிலும் ‘ஆராய வேண்டும்’ பொருத்தமானது.
- source_word: הַנֶּגַע
  choice: பாதிப்பு
  rationale: ஆடை மற்றும் தோல் போன்றவற்றிலும் காணப்படும் கறை, புள்ளி அல்லது பரவும் கேட்டை உள்ளடக்கும் வகையில், மருத்துவத் தொற்று என்று மிகக் குறுகலாகக் கூறாமல் மொழிபெயர்க்கிறது.
- source_word: פָשָׂה
  choice: பரவியிருந்தால்
  rationale: பாதிப்பு விரிவடைந்திருப்பதைக் குறிக்கும் எபிரெய வினையின் இயல்பான தமிழ் வடிவம்.
- source_word: בֶּגֶד
  choice: ஆடை
  rationale: சட்டவழக்குச் சூழலிலும் பொதுவாசகருக்கும் இயல்பாகப் புரியும் சொல்.
- source_word: שְׁתִי
  choice: பாவு
  rationale: நெசவில் நீளவாக்கில் அமைந்த நூல்களைக் குறிக்கும் நிலையான தமிழ்த் தொழில்நுட்பச் சொல்.
- source_word: עֵרֶב
  choice: ஊடை
  rationale: பாவின் குறுக்கே செலுத்தப்படும் நூல்களைக் குறிக்கும் நிலையான தமிழ்த் தொழில்நுட்பச் சொல்.
- source_word: עוֹר
  choice: தோல்
  rationale: பயன்பாட்டுப் பொருட்களாகச் செய்யப்படும் பதப்படுத்தப்பட்ட தோலைச் சூழல் குறிக்கிறது; தமிழில் ‘தோல்’ இதனை இயல்பாக உள்ளடக்குகிறது.
- source_word: לְכֹל אֲשֶׁר יֵעָשֶׂה הָעוֹר לִמְלָאכָה
  choice: தோலால் செய்யப்பட்ட எந்த வேலைப்பாட்டுப் பொருளிலோ
  rationale: எபிரெயச் சொற்றொடரின் விரிவான சட்டநோக்கைப் பாதுகாத்தபடி, தோலால் உருவாக்கப்பட்ட எந்தப் பயன்பாட்டுப் பொருளையும் இயல்பான தமிழில் குறிக்கிறது.
- source_word: צָרַעַת
  choice: சாராத்
  rationale: இச்சொல் நவீன தொழுநோயுடன் நேரடியாக ஒப்பாகாது; மேலும் இங்கு உயிரற்ற பொருட்களுக்கும் பயன்படுத்தப்படுகிறது. ஒலிபெயர்ப்பு மூலச்சொல்லின் தனித்த தூய்மைச் சட்டப் பொருளைப் பாதுகாக்கிறது.
- source_word: מַמְאֶרֶת
  choice: அரித்தழிக்கும்
  rationale: தீங்கு விளைவித்து பொருளைக் கெடுக்கும் அல்லது அழிக்கும் தன்மையை வெளிப்படுத்துகிறது; தேவையற்ற மருத்துவப் பொருளைத் திணிப்பதில்லை.
- source_word: טָמֵא הוּא
  choice: அது தீட்டானது
  rationale: லேவியராகமத்தின் சடங்குத் தூய்மைச் சூழலில் טמא குறிக்கும் நிலையைச் சுருக்கமாகவும் மரபோடு தொடர்ச்சியாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: צָרַעַת என்ற தூய்மைச் சட்டச் சொல்லின் மொழிபெயர்ப்பு
  choice: சாராத்
  alternative: தொழுநோய்; தோல் நோய்; தீட்டுண்டாக்கும் பாதிப்பு
  rationale: இந்த அதிகாரத்தில் மனித உடலை மட்டுமல்லாமல் ஆடை மற்றும் தோலையும் இச்சொல் குறிக்கிறது. ஆகவே ‘தொழுநோய்’ அல்லது ‘தோல் நோய்’ என ஒரு நவீன மருத்துவ வகைக்குள் அடக்காமல், ஒலிபெயர்ப்புடன் விளக்கக் குறிப்பை வழங்குவது மூலத்தின் பரப்பையும் தெளிவின்மையையும் காக்கிறது.
- issue: מַמְאֶרֶת என்பதன் தீவிரத் தன்மை
  choice: அரித்தழிக்கும்
  alternative: அழிவுண்டாக்கும்; கொடிய; நீடித்த
  rationale: ஆடை மற்றும் தோல் பற்றிய சூழலில் கேடு விளைவித்துக் கெடுக்கும் தன்மையை ‘அரித்தழிக்கும்’ தெளிவாகக் காட்டுகிறது; ‘கொடிய’ என்ற மருத்துவச் சாயலைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், லேவியத் தூய்மைச் சட்டத்திற்கேற்ற கண்ணியமான சட்டநடை பயன்படுத்தப்பட்டுள்ளது. அரிதான நெசவுச் சொற்களுக்கு அடிக்குறிப்பு தரப்பட்டுள்ளது. ‘சாராத்’ ஒலிபெயர்க்கப்பட்டதால் நவீன மருத்துவ நோயைத் தவறாக அடையாளப்படுத்துவது தவிர்க்கப்படுகிறது; ‘தீட்டு’ சடங்குத் தூய்மையின்மையைக் குறிக்கிறது.
