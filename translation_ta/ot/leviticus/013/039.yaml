base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/039.yaml
  text: and the priest examines, and behold, on the skin of their flesh there are dull white spots, it is a harmless rash that has broken out on the skin; he is clean.
translation:
  language: ta
  text: ஆசாரியர் ஆராய்ந்து பார்க்கையில், இதோ, அவர்களுடைய உடலின் தோலில் மங்கலான வெள்ளைப் புள்ளிகள் இருக்கின்றன; அது தோலில் தோன்றிய ஒரு தோல் வெடிப்பு[a]; அவர் தீட்டற்றவர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயச் சொல்லை ‘தோல் வெளிப்பாடு’ அல்லது ‘புள்ளிகளுள்ள தோல் நிலை’ என்றும் மொழிபெயர்க்கலாம். இது இவ்வதிகாரத்தில் கூறப்படும் தீட்டுண்டாக்கும் கடுமையான தோல் நிலையிலிருந்து வேறுபட்ட, தீட்டுண்டாக்காத ஒரு தோல் நிலையைக் குறிக்கிறது.
    reason: அரிதான בֹּהַק என்ற சொல்லின் பொருளும் அதன் துல்லியமான மருத்துவ அடையாளமும் உறுதியற்றவை; மொழிபெயர்ப்பு மாற்றுகளையும் சூழல்சார் வேறுபாட்டையும் தெரிவிக்கிறது.
lexical_decisions:
- source_word: וְרָאָה
  choice: ஆராய்ந்து பார்க்கும்போது
  rationale: லேவியராகமம் 13-இன் ஆசாரிய ஆய்வுச் சூழலில் ראה என்பது வெறுமனே பார்ப்பதைவிட ஆராய்ந்து பார்ப்பதைக் குறிக்கிறது.
- source_word: הַכֹּהֵן
  choice: ஆசாரியர்
  rationale: ஆசாரியப் பணியாளரைக் குறிக்கும் כֹּהֵן என்பதற்கான இயல்பான, நிலைபெற்ற தமிழ் சொல்.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: ஆய்வில் வெளிப்படும் நிலையைக் கவனத்திற்கு கொண்டுவரும் எபிரேயச் சுட்டுச் சொல்லின் வலிமையைப் பேணுகிறது.
- source_word: בְעוֹר בְּשָׂרָם
  choice: அவர்களுடைய உடலின் தோலில்
  rationale: மூன்றாம் நபர் ஆண்பால் பன்மை விகுதியை ‘அவர்களுடைய’ எனப் பேணுவதோடு, தமிழில் இயல்பாகப் புரியும் வகையில் ‘உடலின் தோல்’ என மொழிபெயர்க்கிறது.
- source_word: בֶּהָרֹת כֵּהוֹת לְבָנֹת
  choice: மங்கலான வெள்ளைப் புள்ளிகள்
  rationale: புள்ளிகள் அல்லது திட்டுகள் தெளிவான வெண்மையின்றி மங்கலாக இருப்பதைக் குறிக்கும் சேர்க்கையை நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: בֹּהַק
  choice: ஒருவகைப் படலம்
  rationale: அரிதான இச்சொல்லின் துல்லியமான மருத்துவ அடையாளம் உறுதியல்ல. ‘படலம்’ என்பது அதிகப்படியான மருத்துவத் துல்லியத்தையோ ‘தீங்கற்றது’ என்ற மூலத்தில் இல்லாத பண்பையோ சேர்க்காமல், தோலில் தென்படும் நிலையைக் குறிக்கிறது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: פָּרַח בָּעוֹר
  choice: தோலில் தோன்றிய
  rationale: தோல் நிலை வெளிப்பட்டு உருவாவதைக் குறிக்கும் פרח என்பதன் சூழல்சார் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: טָהוֹר הוּא
  choice: அவர் தீட்டற்றவர்
  rationale: இது ஒழுக்கத் தூய்மையையோ மருத்துவக் குணமடைவையோ அல்ல, ஆசாரியச் சட்டத்தின் தீட்டு நிலையையே குறிக்கிறது; ‘தீட்டற்றவர்’ அந்த எதிர்மறைச் சட்ட வகையைத் தெளிவாகப் பேணுகிறது.
theological_decisions:
- issue: ஆசாரியரின் தீர்ப்பின் தன்மை
  choice: அவர் தீட்டற்றவர்
  alternative: அவர் தூயவர் / அவர் சுத்தமானவர்
  rationale: טָהוֹר என்பது இங்கு ஒழுக்கரீதியான பரிசுத்தத்தையோ நோய் குணமானதையோ குறிக்கவில்லை; லேவியச் சட்டத்தின்படி அந்த நபர் தீட்டுள்ளவராகக் கருதப்பட வேண்டியதில்லை என்பதே பொருள்.
- issue: בֹּהַק என்பதன் தன்மை
  choice: ஒருவகைப் படலம்
  alternative: தோல் வெடிப்பு / தேமல் / தீங்கற்ற தோல் தடிப்பு
  rationale: எபிரேயச் சொல்லின் மருத்துவச் சமன்பாடு உறுதியற்றதால் ஒரு குறிப்பிட்ட நவீன நோய்ப் பெயரையோ ‘தீங்கற்றது’ என்ற விளக்கத்தையோ முதன்மை உரையில் சேர்க்காமல், அதன் தெளிவின்மையைப் பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் மரியாதைமிக்க சட்டநடை பயன்படுத்தப்பட்டுள்ளது. ‘இதோ’ என்பது மூலத்தின் கவன ஈர்ப்பைத் தக்கவைக்கிறது. தொடக்கத்தில் உள்ள பன்மைச் சுட்டு (‘அவர்களுடைய’) மற்றும் இறுதியில் வரும் ஒருமைத் தீர்ப்பு (‘அவர்’) ஆகிய மூல உரையின் எண்ணியல் மாறுபாடு சீராக்கப்படாமல் பேணப்பட்டுள்ளது.
