source:
  edition: WLC
  text: וְ/אִם֙ מִ/פְּאַ֣ת פָּנָ֔י/ו יִמָּרֵ֖ט רֹאשׁ֑/וֹ גִּבֵּ֥חַ ה֖וּא טָה֥וֹר הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/041.yaml
  text: And if the front of his head becomes bald[a], he is bald on the forehead; he is clean.
translation:
  language: ta
  text: ஒருவனுடைய தலையின் முன்பகுதியில் முடி உதிர்ந்து வழுக்கையானால்[a], அவன் முன்புற வழுக்கையுள்ளவன்; அவன் சுத்தமானவன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நெற்றிப்புறம் வழுக்கையானால்.” இங்கு வரும் எபிரெயச் சொல், முந்தைய வசனத்தில் கூறப்பட்ட தலையின் பின்புற அல்லது உச்சிப் பகுதி வழுக்கையிலிருந்து முன்புற வழுக்கையை வேறுபடுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִפְּאַת פָּנָיו
  choice: தலையின் முன்பகுதியில்
  rationale: இச்சொற்றொடர் சொல்லுக்குச் சொல் ‘அவனுடைய முகத்தின் ஓரத்திலிருந்து’ என இருந்தாலும், தலைமுடி உதிர்வைப் பற்றிய இச்சூழலில் தலையின் முன்புறத்தைக் குறிக்கிறது.
- source_word: יִמָּרֵט
  choice: முடி உதிர்ந்து வழுக்கையானால்
  rationale: நிஃபால் வடிவம் முடி அகன்று அந்தப் பகுதி வெறுமையாவதைக் குறிக்கிறது; தமிழில் இயல்பாகவும் தெளிவாகவும் இதை வெளிப்படுத்துகிறது.
- source_word: רֹאשׁוֹ
  choice: அவனுடைய தலை
  rationale: உடற்கூறு சார்ந்த இச்சூழலில் நேரடியான பொருள்.
- source_word: גִּבֵּחַ
  choice: முன்வழுக்கை
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்படும் தலையின் பின்புற அல்லது உச்சிப் பகுதி வழுக்கையிலிருந்து வேறுபட்ட, முன்புற வழுக்கையை இச்சொல் குறிக்கிறது.
- source_word: טָהוֹר
  choice: சுத்தமானவன்
  rationale: லேவியராகமம் 13-இல் இது அறநெறித் தூய்மையை அல்ல, சடங்குசார் சுத்த நிலையைக் குறிக்கிறது.
theological_decisions:
- issue: தூய்மைச் சட்டங்களில் சடங்குசார் நிலைக்கான சொல்
  choice: சுத்தமானவன்
  alternative: தூய்மையானவன்
  rationale: இவ்வசனம் ஒழுக்கத் தூய்மையைப் பற்றியதல்ல; உடல் நிலையைக் குறித்த ஆசாரியத் தீர்ப்பின்படி ஒருவனின் சடங்குசார் நிலையைப் பற்றியது. ‘சுத்தமானவன்’ அந்த வேறுபாட்டைத் தெளிவாகப் பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியக்கூடிய அதேவேளையில் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘முன்வழுக்கை’ என்பது சூழலுக்குத் தேவையான உடற்கூறு வேறுபாட்டைச் சுருக்கமாகப் பேணுகிறது.
