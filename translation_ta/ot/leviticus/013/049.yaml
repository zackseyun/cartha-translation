  text: וְ/הָיָ֨ה הַ/נֶּ֜גַע יְרַקְרַ֣ק א֣וֹ אֲדַמְדָּ֗ם בַּ/בֶּגֶד֩ א֨וֹ בָ/ע֜וֹר אֽוֹ בַ/שְּׁתִ֤י אוֹ בָ/עֵ֨רֶב֙ א֣וֹ בְ/כָל כְּלִי ע֔וֹר נֶ֥גַע צָרַ֖עַת ה֑וּא וְ/הָרְאָ֖ה אֶת הַ/כֹּהֵֽן׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/049.yaml
  text: And if the spot is greenish or reddish in the garment[a], or in the leather, or in the warp or in the woof, or in any article of leather, it is a diseased spot of skin disease[b], and it shall be shown to the priest.
translation:
  language: ta
  text: ஆடையிலோ தோலிலோ பாவு நூலிலோ ஊடை நூலிலோ[a] தோலால் செய்யப்பட்ட எந்தப் பொருளிலோ அந்தப் பாதிப்பு பச்சைச் சாயலாகவோ சிவப்புச் சாயலாகவோ இருந்தால், அது சராஅத் எனப்படும் பாதிப்பாகும்[b]; அது ஆசாரியருக்குக் காட்டப்பட வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: பாவு நூல் என்பது நெசவில் நீளவாக்கில் அமைந்த நூல்; ஊடை நூல் என்பது அதற்குக் குறுக்கே நெய்யப்படும் நூல்.
    reason: technical_clarification
  - marker: b
    text: பாரம்பரியமாக, ‘தொழுநோய்ப் பாதிப்பு’ என்று மொழிபெயர்க்கப்படுகிறது. ஆனால் எபிரேயச் சொல் மனிதத் தோலை மட்டுமல்லாமல் ஆடை மற்றும் தோல் பொருட்களிலும் தோன்றக்கூடிய, லேவியராகமத்தில் விவரிக்கப்படும் விரிவான ஆசாரிய வகைப்பாட்டைக் குறிக்கிறது; அது நவீன தொழுநோயை மட்டும் குறிப்பதல்ல.
    reason: alternative_reading
lexical_decisions:
- source_word: נֶגַע
  choice: பாதிப்பு
  rationale: ஆடை, தோல் போன்ற உயிரற்ற பொருட்களிலும் காணப்படும் பாதிக்கப்பட்ட பகுதியைக் குறிக்கிறது. ‘நோய்’ என்று மட்டும் கூறுவதைவிட ‘பாதிப்பு’ இச்சூழலுக்கு இயல்பாகப் பொருந்துகிறது.
- source_word: יְרַקְרַק
  choice: பச்சைச் சாயலாக
  rationale: முழுமையான பச்சை நிறம் என்று மிகைப்படுத்தாமல், எபிரேயச் சொல்லின் தோராயமான நிறத்தன்மையை வெளிப்படுத்துகிறது.
- source_word: אֲדַמְדָּם
  choice: சிவப்புச் சாயலாக
  rationale: தூய சிவப்பு நிறத்தைவிட சிவப்பு கலந்த தோற்றத்தைச் சுட்டும் எபிரேய வடிவத்தைப் பிரதிபலிக்கிறது.
- source_word: בֶּגֶד
  choice: ஆடை
  rationale: இச்சூழலில் துணியால் செய்யப்பட்ட அணிபொருளைக் குறிக்கும் இயல்பான நவீனத் தமிழ்ச் சொல்.
- source_word: עוֹר
  choice: தோல்
  rationale: இங்கு உயிருள்ள உடலின் தோல் அல்ல, பொருட்கள் செய்யப் பயன்படும் பதப்படுத்தப்பட்ட விலங்குத் தோல் குறிக்கப்படுகிறது; தமிழில் ‘தோல்’ இரண்டிற்கும் இயல்பாகப் பயன்படுகிறது.
- source_word: שְׁתִי
  choice: பாவு நூல்
  rationale: நெசவில் நீளவாக்கில் அமைந்த நூல்களைக் குறிக்கும் வழக்கமான தமிழ்க் கலைச்சொல்.
- source_word: עֵרֶב
  choice: ஊடை நூல்
  rationale: பாவு நூல்களின் குறுக்கே நெய்யப்படும் நூல்களைக் குறிக்கும் தமிழ்க் கலைச்சொல்; அடிக்குறிப்பு அதன் பொருளைத் தெளிவுபடுத்துகிறது.
- source_word: כְּלִי עוֹר
  choice: தோலால் செய்யப்பட்ட எந்தப் பொருள்
  rationale: தோலால் செய்யப்பட்ட பலவகை உபகரணங்களையும் பொருட்களையும் உள்ளடக்கும் எபிரேயப் பொதுப்படையான சொல்லை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: נֶגַע צָרַעַת
  choice: சராஅத் பாதிப்பு
  rationale: צָרַעַת மனிதத் தோலை மட்டுமல்லாமல் ஆடை மற்றும் தோலையும் பாதிக்கும் லேவியராகமத்துக்குரிய தனிப்பட்ட வகைப்பாடு. நவீன ‘தொழுநோய்’ என்ற மருத்துவ நோயோடு தவறாக ஒப்பிடாமல் இருக்க எபிரேயப் பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְהָרְאָה אֶת־הַכֹּהֵן
  choice: அது ஆசாரியரிடம் காட்டப்பட வேண்டும்
  rationale: எபிரேய வினையின் செயப்பாட்டு வடிவத்தையும், காட்டுபவர் யார் என்பதை உரை குறிப்பிடாமல் விடுவதையும் காக்கிறது.
theological_decisions:
- issue: צָרַעַת என்ற ஆசாரியச் சட்ட வகைப்பாட்டின் மொழிபெயர்ப்பு
  choice: சராஅத்
  alternative: தொழுநோய்
  rationale: இந்த நிலை மனிதர்களோடு மட்டுமல்லாமல் ஆடை மற்றும் தோல் பொருட்களிலும் காணப்படுவதாக உரை கூறுகிறது. ஆகவே அதை நவீன ஹான்சன் நோயாக வரையறுப்பது தவறாகும்; ஒலிபெயர்ப்பு மூல உரையின் தனித்த வகைப்பாட்டையும் அதன் தெளிவின்மையையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பாகவும் மரியாதைமிக்க நடையிலும் வடிவமைக்கப்பட்டது. ‘பாவு நூல்/ஊடை நூல்’ என்ற துல்லியமான நெசவுக் கலைச்சொற்கள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளன. ‘சராஅத்’ ஒலிபெயர்ப்பு மருத்துவ ரீதியாகத் தவறான அடையாளப்படுத்தலைத் தவிர்த்து, மூலத்தின் ஆசாரிய வகைப்பாட்டைத் திறந்த நிலையில் வைக்கிறது.
