base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/042.yaml
  text: But if there is on the bald head or on the bald forehead a white-reddish diseased spot[b][a], it is a spreading skin disease on his bald head or on his bald forehead.
translation:
  language: ta
  text: ஆனால், தலையின் பின்புற வழுக்கைப் பகுதியிலோ நெற்றிப்புற வழுக்கைப் பகுதியிலோ[b] வெண்மையும் சிவப்பும் கலந்த நோய்ப்புள்ளி இருந்தால், அது அவனுடைய பின்புற வழுக்கைப் பகுதியிலோ நெற்றிப்புற வழுக்கைப் பகுதியிலோ பரவிவரும் தோல் நோயாகும்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: பாரம்பரியமாக, “தொழுநோய்.” எபிரெயச் சொல் பலவகையான தோல் நோய்களையோ தோல் பாதிப்புகளையோ விரிவாகக் குறிக்கிறது; அதை நவீன ஹான்சன் நோயுடன் மட்டும் ஒப்பிடக் கூடாது.
    reason: lexical_alternative
  - marker: b
    text: இங்குள்ள இரண்டு எபிரெயச் சொற்கள் தலையின் பின்புற வழுக்கையையும் முன்புற அல்லது நெற்றிப்புற வழுக்கையையும் வேறுபடுத்திக் காட்டுகின்றன.
    reason: cultural_note
lexical_decisions:
- source_word: וְכִי
  choice: ஆனால், … இருந்தால்
  rationale: முந்தைய வழக்கிலிருந்து மாறுபடும் நிபந்தனையை இயல்பான தமிழ் சட்டநடை மூலம் வெளிப்படுத்துகிறது.
- source_word: בַקָּרַחַת
  choice: தலையின் பின்புற வழுக்கைப் பகுதியில்
  rationale: கָרַחַת என்பது இணைச்சொல்லான גַּבַּחַת என்பதிலிருந்து வேறுபட்டு, பொதுவாகத் தலையின் பின்புற வழுக்கையைக் குறிக்கிறது.
- source_word: בַגַּבַּחַת
  choice: நெற்றிப்புற வழுக்கைப் பகுதியில்
  rationale: தலையின் முன்புறத்தில் அல்லது நெற்றிப்புறத்தில் உள்ள வழுக்கையைத் தெளிவாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: נֶגַע
  choice: நோய்ப்புள்ளி
  rationale: ஆசாரியன் ஆய்வு செய்யும், கண்ணுக்குத் தெரியும் பாதிப்பைக் குறிக்கிறது; நவீன மருத்துவ நோயறிதலைத் திணிக்காமல் சூழலுக்கேற்ற பொருளை அளிக்கிறது.
- source_word: לָבָן אֲדַמְדָּם
  choice: வெண்மையும் சிவப்பும் கலந்த
  rationale: வெள்ளை மற்றும் சிவப்புச் சாயல் சேர்ந்த நிறவிவரத்தை இயல்பான தமிழில் தருகிறது; துல்லியமான நிறத்தை அளவுக்கு மீறி வரையறுக்கவில்லை.
- source_word: צָרַעַת
  choice: தோல் நோய்
  rationale: எபிரெயச் சொல் நவீன ஹான்சன் நோயை மட்டும் குறிப்பதில்லை; பலவகைத் தோல் பாதிப்புகளை உள்ளடக்கக்கூடும் என்பதால் பரந்த, புரிந்துகொள்ளத்தக்க சொல் தேர்ந்தெடுக்கப்பட்டது.
- source_word: פֹּרַחַת
  choice: பரவிவரும்
  rationale: פרח என்ற வேர்ச்சொல் இச்சூழலில் வெடித்துத் தோன்றுதல் அல்லது பரவுதல் என்ற இயக்கத்தைக் குறிக்கிறது; 'பரவிவரும்' என்பது நடுநிலையான, இயல்பான தமிழ்.
- source_word: בְּקָרַחְתּוֹ אוֹ בְגַבַּחְתּוֹ
  choice: அவனுடைய பின்புற வழுக்கைப் பகுதியிலோ நெற்றிப்புற வழுக்கைப் பகுதியிலோ
  rationale: உடைமைப் பின்னொட்டைத் தக்கவைத்து, முன்னர் கூறப்பட்ட இரு வழுக்கைப் பகுதிகளின் வேறுபாட்டையும் மீண்டும் தெளிவுபடுத்துகிறது.
theological_decisions:
- issue: צָרַעַת என்பதன் நோயியல் அடையாளம்
  choice: தோல் நோய்
  alternative: தொழுநோய்
  rationale: இச்சொல்லை நவீன ஹான்சன் நோயுடன் மட்டும் ஒப்பிடுவது மூலச்சொல்லின் பரந்த பயன்பாட்டைக் குறுக்கிவிடும். பாரம்பரிய மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், சட்டவிதிக்குரிய கண்ணியமான ஆனால் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. தொழில்நுட்பமான உடற்பகுதி வேறுபாடு முதன்மை உரையிலும் அடிக்குறிப்பிலும் பாதுகாக்கப்பட்டுள்ளது; நவீன மருத்துவத் துல்லியம் மூலத்தில் இல்லாத இடத்தில் சேர்க்கப்படவில்லை.
