base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/032.yaml
  text: And the priest shall examine the diseased area on the seventh day[a], and behold, if the scaly infection has not spread, and there is no yellow hair in it, and the appearance of the scaly infection is not deeper than the skin,
translation:
  language: ta
  text: ஏழாம் நாளில் ஆசாரியன் அந்தப் பாதிக்கப்பட்ட இடத்தை ஆராய வேண்டும்; இதோ, அந்தச் செதில் படிந்த பாதிப்பு[a] பரவியிருக்காமலும், அதில் மஞ்சள் நிற முடி இல்லாமலும், அந்தப் பாதிப்பின் தோற்றம் தோலைவிட ஆழமாக இல்லாமலும் இருந்தால்,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயச் சொல் נֶתֶק, இப்பகுதியில் விவரிக்கப்படும் தலைத்தோல் அல்லது தாடிப் பகுதியில் ஏற்படும் ஒரு குறிப்பிட்ட செதில் படிந்த பாதிப்பைக் குறிக்கிறது; இதை “அரிப்புள்ள பாதிப்பு” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: ஆராய வேண்டும்
  rationale: ஆசாரியரின் முறையான நோயறிதல் சூழலில், வெறுமனே பார்ப்பதைக் காட்டிலும் கவனமாகப் பரிசோதிப்பதைக் குறிக்கிறது.
- source_word: הַכֹּהֵן
  choice: ஆசாரியன்
  rationale: லேவியராகமத்தின் தூய்மைச் சட்டங்களில் அதிகாரப்பூர்வமாகப் பரிசோதிப்பவரைக் குறிக்கும் வழக்கமான தமிழ் சொல்.
- source_word: הַנֶּגַע
  choice: பாதிக்கப்பட்ட இடம்
  rationale: நவீன மருத்துவ நோய்ப்பெயரைத் திணிக்காமல், பாதிப்புக்குள்ளான உடற்பகுதியை இயல்பாகக் குறிக்கிறது.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: ஏழாம் நாளில்
  rationale: மறுபரிசோதனை நடைபெற வேண்டிய காலத்தைக் குறிப்பாகத் தருகிறது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: ஆசாரியன் கண்டறியும் நிலையை அறிமுகப்படுத்தும் எபிரேய உரையாடல் குறியைப் பாதுகாக்கிறது.
- source_word: לֹא פָשָׂה
  choice: பரவாமல்
  rationale: தோல் பாதிப்பு விரிவடையாத நிலையைத் தெளிவாகக் குறிக்கிறது.
- source_word: הַנֶּתֶק
  choice: செதிலுள்ள பாதிப்பு
  rationale: தலைத்தோல் அல்லது தாடிப் பகுதியில் ஏற்படும் தனிப்பட்ட பாதிப்பை, பழமையான அல்லது அளவுக்கு மீறிய நவீன மருத்துவப் பெயரின்றி எடுத்துரைக்கிறது.
- source_word: וְלֹא הָיָה בוֹ שֵׂעָר צָהֹב
  choice: அதில் மஞ்சள் நிற முடி இல்லாமல்
  rationale: பாதிக்கப்பட்ட பகுதியில் இந்த நோயறிதல் அடையாளம் இல்லை என்ற இடத்தொடர்பைத் தக்கவைக்கிறது.
- source_word: וּמַרְאֵה הַנֶּתֶק אֵין עָמֹק מִן הָעוֹר
  choice: அந்தச் செதிலுள்ள பாதிப்பு தோலைவிட ஆழமாகத் தோன்றாமல்
  rationale: מַרְאֵה என்பதன் காணக்கூடிய தோற்றம் என்ற நுணுக்கத்தையும், சுற்றியுள்ள தோலோடு ஒப்பிடும் நோயறிதல் அளவுகோலையும் வெளிப்படுத்துகிறது.
