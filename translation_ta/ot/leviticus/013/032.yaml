translation_notes:
  register: நவீன நிலையான தமிழில், சட்டவிதிக்கேற்ற கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டது. நவீன மருத்துவ நோயறிதலை மூலத்தில் திணிக்காமல், பரிசோதனைக் கூறுகள் தெளிவாக வைக்கப்பட்டுள்ளன. எபிரேய வசனம் நிபந்தனைத் தொடரின் நடுவில் முடிவதால், தமிழிலும் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
