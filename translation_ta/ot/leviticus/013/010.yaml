id: LEV.13.10
reference: Leviticus 13:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/רָאָ֣ה הַ/כֹּהֵ֗ן וְ/הִנֵּ֤ה שְׂאֵת לְבָנָה֙ בָּ/ע֔וֹר וְ/הִ֕יא הָפְכָ֖ה שֵׂעָ֣ר לָבָ֑ן וּ/מִֽחְיַ֛ת בָּשָׂ֥ר חַ֖י בַּ/שְׂאֵֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/010.yaml
  text: and the priest examines him[a], and behold, there is a white swelling in the skin, and it has turned the hair white, and there is raw flesh in the swelling[b],
translation:
  language: ta
  text: ஆசாரியர் பரிசோதிப்பார். இதோ, தோலில் வெண்ணிறமான வீக்கம்[a] இருக்கும்; அது முடியை வெண்மையாக்கியிருக்கும்; அந்த வீக்கத்திற்குள் பச்சைச் சதையும்[b] இருக்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வீக்கம்’ என்பதற்குப் பதிலாக ‘உயர்ந்த தழும்பு’ என்றும் மொழிபெயர்க்கலாம். எபிரெயத்தில் שְׂאֵת; இவ்வதிகாரத்தில் தோலில் உயர்ந்து காணப்படும் பாதிப்பைக் குறிக்கும் தொழில்நுட்பச் சொல்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லர்த்தமாக, ‘உயிருள்ள சதை’; பாதிப்புக்குள் வெளிப்பட்டிருக்கும் பச்சையான, உயிருள்ள சதைத் திசுவை இச்சொற்றொடர் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: பரிசோதிப்பார்
  rationale: தோல் பாதிப்பை மதிப்பிட்டு அறியும் சட்டப்பூர்வமான ஆய்வை இச்சூழல் குறிக்கிறது; வெறுமனே ‘பார்ப்பார்’ என்பதைக் காட்டிலும் ‘பரிசோதிப்பார்’ தெளிவானது.
- source_word: הַכֹּהֵן
  choice: ஆசாரியர்
  rationale: லேவியத் தூய்மைச் சட்டங்களில் அதிகாரப்பூர்வமாக ஆய்வு செய்பவரைக் குறிக்கும் כֹּהֵן என்பதற்கான இயல்பான தமிழ் சொல்.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: ஆசாரியர் கவனித்த அடையாளங்களின் பக்கம் வாசகரின் கவனத்தைத் திருப்பும் எபிரெயச் சொல்லின் சுட்டிக்காட்டும் வலிமையைப் பேணுகிறது.
- source_word: שְׂאֵת לְבָנָה
  choice: வெண்ணிறமான வீக்கம்
  rationale: שְׂאֵת என்பது இவ்வதிகாரத்தில் தோலில் உயர்ந்து காணப்படும் பாதிப்பைக் குறிக்கும் தொழில்நுட்பச் சொல்; ‘வீக்கம்’ நவீனத் தமிழில் தெளிவாக உள்ளது.
- source_word: בָּעוֹר
  choice: தோலில்
  rationale: עוֹר என்பதன் நேரடிப் பொருள் ‘தோல்’; பாதிப்பு தோலில் இருப்பதைக் குறிக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: וְהִיא הָפְכָה שֵׂעָר לָבָן
  choice: அது முடியை வெண்மையாக்கியிருக்கும்
  rationale: பெண்பால் ஒருமைச் சுட்டுப்பெயர் வீக்கத்தைச் சுட்டுகிறது; பாதிப்பால் முடி வெண்மையானது என்ற காரணவிளைவைத் தமிழில் இயல்பாகத் தருகிறது.
- source_word: וּמִחְיַת בָּשָׂר חַי
  choice: பச்சைச் சதை
  rationale: பாதிப்புக்குள் வெளிப்படும் உயிருள்ள, ஆறாத சதைத் திசுவைக் குறிக்கும் மருத்துவத் தன்மையுள்ள அடையாளத்தை சாதாரண வாசகருக்குப் புரியும் நடையில் தெரிவிக்கிறது; சொற்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: בַּשְׂאֵת
  choice: அந்த வீக்கத்திற்குள்
  rationale: சதைத் திசு வீக்கத்தின் உள்ளே காணப்படுவதைத் தெளிவாகக் காட்டுகிறது; שְׂאֵת என்பதற்கு ஒரே சொல் தொடர்ந்து பயன்படுத்தப்படுகிறது.
