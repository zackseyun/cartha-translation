translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்கு விளங்கும் வகையிலும் லேவியத் தூய்மைச் சட்டத்தின் முறையான நடையைப் பேணும் வகையிலும் மொழிபெயர்க்கப்பட்டது. ‘இதோ’ என்பது எபிரெய மூலத்தின் கவன ஈர்ப்பு வலிமையைப் பாதுகாக்கிறது; தொடரின் நோயறிதல் அமைப்பைச் சீராக்க அரைப்புள்ளிகள் பயன்படுத்தப்பட்டுள்ளன.
