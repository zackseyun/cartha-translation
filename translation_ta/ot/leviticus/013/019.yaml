source:
  edition: WLC
  text: וְ/הָיָ֞ה בִּ/מְק֤וֹם הַ/שְּׁחִין֙ שְׂאֵ֣ת לְבָנָ֔ה א֥וֹ בַהֶ֖רֶת לְבָנָ֣ה אֲדַמְדָּ֑מֶת וְ/נִרְאָ֖ה אֶל הַ/כֹּהֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/019.yaml
  text: and in the place of the boil there develops a white swelling or a reddish-white bright spot[a], then it shall be shown to the priest.
translation:
  language: ta
  text: கொப்புளம் இருந்த இடத்தில் வெள்ளையான வீக்கமோ சிவப்புக் கலந்த வெள்ளையான பளிச்சென்ற தழும்போ தோன்றினால், அது ஆசாரியனிடம் காட்டப்பட வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அது ஆசாரியனுக்குத் தென்பட வேண்டும்.” எபிரெய மொழியை இன்னும் சொற்படியாக “காணப்பட வேண்டும்” அல்லது “தோன்ற வேண்டும்” என்று மொழிபெயர்க்கலாம்; இங்கு ஆசாரியரின் பரிசோதனைக்காகக் காட்டப்படுவதையே இது பெரும்பாலும் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: தோன்றினால்
  rationale: முன்பு கொப்புளம் இருந்த இடத்தில் ஒரு புதிய தோல் அறிகுறி உருவாவதை இயல்பான நிபந்தனை வாக்கியமாக வெளிப்படுத்துகிறது.
- source_word: בִּמְקוֹם הַשְּׁחִין
  choice: கொப்புளம் இருந்த இடத்தில்
  rationale: שְׁחִין என்பதன் அழற்சியுற்ற கொப்புளம் அல்லது புண் என்ற பொருளையும், בִּמְקוֹם என்பதன் இடப்பொருளையும் தெளிவாகக் கொடுக்கிறது.
- source_word: שְׂאֵת לְבָנָה
  choice: வெள்ளையான வீக்கம்
  rationale: שְׂאֵת என்பது தோலில் உயர்ந்து காணப்படும் வீக்கத்தைக் குறிக்கிறது; לְבָנָה அதன் வெள்ளை நிறத்தைக் குறிப்பிடுகிறது.
- source_word: בַהֶרֶת לְבָנָה אֲדַמְדָּמֶת
  choice: சிவப்புக் கலந்த வெள்ளையான பளபளப்பான தழும்பு
  rationale: בַהֶרֶת என்பதன் ஒளிரும் அல்லது தெளிவாகத் தெரியும் தோல் தழும்பு என்ற தனிப்பொருளையும், வெள்ளை நிறத்தில் சிவப்புக் கலந்திருப்பதையும் பாதுகாக்கிறது.
- source_word: וְנִרְאָה אֶל הַכֹּהֵן
  choice: அது ஆசாரியனிடம் காட்டப்பட வேண்டும்
  rationale: ஆசாரியரின் பரிசோதனைக்காக அந்த நிலை முன்வைக்கப்பட வேண்டும் என்ற சட்டநடைப் பொருளைத் தெளிவாகத் தருகிறது; எபிரெயச் சொல்லின் சொற்படியான ‘காணப்படுதல்/தோன்றுதல்’ என்ற சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் மருத்துவ-சட்ட நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘வீக்கம்’ மற்றும் ‘பளபளப்பான தழும்பு’ ஆகியவை மூலத்தின் இரு வேறு தோல் அறிகுறிகளுக்கிடையிலான சொல்வேறுபாட்டைப் பாதுகாக்கின்றன.
