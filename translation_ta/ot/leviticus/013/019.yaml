- from: கொப்புளம் இருந்த இடத்தில் வெள்ளையான வீக்கமோ சிவப்புக் கலந்த வெள்ளையான பளபளப்பான தழும்போ தோன்றினால், அது ஆசாரியனிடம் காட்டப்பட வேண்டும்.[a]
