  source_fidelity: 'வரி எபிரெய மூலத்தின் நிபந்தனை அமைப்பையும் பொருளையும் துல்லியமாகப் பேணுகிறது: தழும்பு அதே இடத்தில் நிலைத்திருத்தல், பரவாமை, கொப்புளத்தின் வடு எனத் தீர்மானித்தல், பின்னர் ஆசாரியன் தூய்மை நிலையை அறிவித்தல் ஆகிய அனைத்தும் உள்ளன. ‘அவனைத் தூயவன் என்று அறிவிக்க வேண்டும்’ என்பது וְטִהֲרוֹ என்பதன் சடங்குசார் தீர்ப்புப் பொருளைச் சரியாகத் தருகிறது; மருத்துவக் குணமாக்குதலைக் குறிக்கவில்லை.'
