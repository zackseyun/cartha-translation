source:
  edition: WLC
  text: וְ/אִם תַּחְתֶּ֜י/הָ תַּעֲמֹ֤ד הַ/בַּהֶ֨רֶת֙ לֹ֣א פָשָׂ֔תָה צָרֶ֥בֶת הַ/שְּׁחִ֖ין הִ֑וא וְ/טִהֲר֖/וֹ הַ/כֹּהֵֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/023.yaml
  text: But if the bright spot remains in its place and has not spread[a], it is the scar of the boil, and the priest shall pronounce him clean.
translation:
  language: ta
  text: ஆனால், ஒளிரும் தழும்பு இருந்த இடத்திலேயே நிலைத்து, பரவாமல் இருந்தால்[a], அது கொப்புளத்தால் ஏற்பட்ட வடு. ஆசாரியன் அவனைத் தூயவன் என்று அறிவிக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லடியாக, ‘அதன் கீழே’; ஒளிரும் தழும்பு பரவாமல் இருந்த இடத்திலேயே இருப்பதை இந்த எபிரெய மரபுத்தொடர் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: ஆனால் ... இருந்தால்
  rationale: முந்தைய நிலைக்கு மாறான நிபந்தனையை இயல்பான தமிழில் காட்டுகிறது.
- source_word: תַּחְתֶּיהָ תַּעֲמֹד
  choice: இருந்த இடத்திலேயே நிலைத்து
  rationale: சொல்லடியாக ‘அதன் கீழே நிற்கும்’ என்றாலும், இச்சூழலில் தழும்பு பரவாமல் அதே இடத்தில் இருப்பதைக் குறிக்கும் எபிரெய மரபுத்தொடரின் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: הַבַּהֶרֶת
  choice: ஒளிரும் தழும்பு
  rationale: தோலில் காணப்படும் பிரகாசமான அல்லது வெளிறிய அடையாளத்தைக் குறிக்கிறது; குறிப்பிட்ட மருத்துவ நோயறிதலை மொழிபெயர்ப்பில் சேர்க்காமல், பார்வைக்குத் தெரியும் தன்மையைப் பேணுகிறது.
- source_word: לֹא פָשָׂתָה
  choice: பரவாமல் இருந்தால்
  rationale: லேவியராகமம் 13 முழுவதும் தோல் பாதிப்பு விரிவடைவதைக் குறிக்கும் வினையை இயல்பான தமிழில் வழங்குகிறது.
- source_word: צָרֶבֶת הַשְּׁחִין
  choice: கொப்புளத்தால் ஏற்பட்ட வடு
  rationale: கொப்புளம் அல்லது அழற்சி ஆறிய பின் எஞ்சும் அடையாளத்தைச் சுருக்கமாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: וְטִהֲרוֹ הַכֹּהֵן
  choice: ஆசாரியன் அவனைத் தூயவன் என்று அறிவிக்க வேண்டும்
  rationale: ஆசாரியன் அவனை உடலளவில் குணப்படுத்துகிறான் என்பதல்லாமல், சடங்குசார் தூய நிலையைத் தீர்மானித்து அறிவிக்கிறான் என்ற பொருளைப் பேணுகிறது.
theological_decisions:
- issue: சடங்குசார் தூய்மை அல்லது மருத்துவக் குணமாக்குதல்
  choice: ‘தூயவன் என்று அறிவிக்க வேண்டும்’ என அறிவிப்புச் சார்ந்த சடங்கு மொழியில் வழங்கப்பட்டது.
  alternative: ‘அவனைத் தூய்மைப்படுத்த வேண்டும்’
  rationale: טהר என்ற வினை இங்கு ஆசாரியன் ஒருவரின் தூய்மை நிலையைத் தீர்மானித்து அறிவிப்பதைக் குறிக்கிறது; ஆசாரியன் நோயைக் குணப்படுத்துவதாகவோ நேரடியாகத் தூய்மையாக்குவதாகவோ பொருள்படாது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘ஒளிரும் தழும்பு,’ ‘கொப்புளம்,’ ‘வடு’ ஆகியவை தேவையற்ற நவீன மருத்துவ நோயறிதலைத் தவிர்த்து, காணக்கூடிய அறிகுறிகளையே எடுத்துரைக்கின்றன.
