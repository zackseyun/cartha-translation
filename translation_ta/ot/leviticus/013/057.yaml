base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/057.yaml
  text: But if it appears again in the garment[a], or in the warp, or in the woof, or in any article of leather, it is a spreading outbreak[b]; you shall burn in the fire whatever has the infection in it.
translation:
  language: ta
  text: ஆனால், அந்த ஆடையிலோ, பாவு நூலிலோ, ஊடை நூலிலோ[a], தோலால் செய்யப்பட்ட எந்தப் பொருளிலோ அது மீண்டும் காணப்பட்டால், அது பரவும் பாதிப்பாகும்[b]. பாதிப்பு உள்ள பொருளை நெருப்பில் எரிக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஊடை நூல்” என்பது நெய்யும்போது பாவு நூல்களின் குறுக்கே செலுத்தப்படும் நூல்.
    reason: lexical_alternative
  - marker: b
    text: “பாதிப்பு” என்பதற்கான எபிரேயச் சொல் நெகா (נֶגַע). லேவியராகமத்தில் இது பாதிக்கப்பட்ட அல்லது மாசுற்ற இடத்தைக் குறிக்கும் தொழில்நுட்பச் சொல்; மரபாக “வாதை” அல்லது “நோய்க்குறி” என்றும் மொழிபெயர்க்கப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּרָאֶה עוֹד
  choice: மீண்டும் காணப்பட்டால்
  rationale: נפעל வடிவின் காணப்படுதல் என்ற ஆய்வுசார் பொருளையும், עוֹד என்பதன் மறுதோற்றத்தையும் இயல்பான தமிழில் தருகிறது.
- source_word: בֶּגֶד
  choice: ஆடை
  rationale: லேவியராகமம் 13-இல் ஆடை அல்லது துணிப் பொருளைக் குறிக்கும் வழக்கமான சொல்லுக்கு தெளிவான நவீனத் தமிழ்.
- source_word: שְׁתִי
  choice: பாவு நூல்
  rationale: நெசவில் நீளவாக்கில் அமைக்கப்படும் warp நூல்களுக்கான தமிழ் தொழில்சொல்.
- source_word: עֵרֶב
  choice: ஊடை நூல்
  rationale: பாவு நூல்களின் குறுக்கே செலுத்தப்படும் weft நூலுக்கான தமிழ் தொழில்சொல்; வாசகருக்காக அடிக்குறிப்பில் விளக்கம் தரப்படுகிறது.
- source_word: כְּלִי עוֹר
  choice: தோலால் செய்யப்பட்ட எந்தப் பொருள்
  rationale: தோலால் ஆன கருவி, பாத்திரம் அல்லது பிற பொருள் எனப் பரந்த பொருளை தேவையின்றிக் குறுக்காமல் காக்கிறது.
- source_word: פֹּרַחַת הִוא
  choice: அது பரவிவரும் பாதிப்பு
  rationale: פרח என்பதன் முளைத்தல்/படர்தல் உருவகத்தை இச்சூழலில் செயலில் பரவும் பாதிப்பாக இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בָּאֵשׁ תִּשְׂרְפֶנּוּ
  choice: நெருப்பில் எரித்துவிட வேண்டும்
  rationale: சட்டவிதியின் கட்டாயத் தன்மையை நவீனத் தமிழில் தெளிவாகத் தருகிறது; எரிக்கப்பட வேண்டிய முழுப் பொருள் அடுத்த தொடரால் அடையாளப்படுத்தப்படுகிறது.
- source_word: הַנָּגַע
  choice: பாதிப்பு
  rationale: லேவியராகமம் 13-இன் தொழில்நுட்பச் சொல்லான נגע-ஐ நவீன நோயறிதலாகத் தீர்மானிக்காமல், பாதிக்கப்பட்ட அல்லது மாசுற்ற இடம்/நிலையைக் குறிக்கும் பரந்த சொல்லாக வழங்குகிறது.
theological_decisions:
- issue: הַנָּגַע என்பதைக் குறிப்பிட்ட நவீன நோயாக அடையாளப்படுத்துதல்
  choice: பாதிப்பு
  alternative: தொற்று / கொள்ளைநோய் / நோய்க்குறி
  rationale: எபிரேயச் சொல் இங்கு துணி அல்லது தோலில் காணப்படும் பாதிக்கப்பட்ட/மாசுற்ற குறிக்கான சடங்கு-ஆய்வுத் தொழில்சொல்; குறிப்பிட்ட மருத்துவ நோயையோ உயிரியல் தொற்றையோ உரை உறுதிப்படுத்தாததால் அவ்வாறு தீர்மானிக்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டவிதிக்குரிய கண்ணியமான தொனி காக்கப்பட்டுள்ளது. நெசவுத் தொழில்சொற்களான “பாவு நூல்”, “ஊடை நூல்” பயன்படுத்தப்பட்டுள்ளன; அரிதாக இருக்கக்கூடிய இரண்டாவது சொல்லுக்கு அடிக்குறிப்பு தரப்பட்டுள்ளது. נגע குறிப்பிட்ட மருத்துவத் தொற்று என மிகைப்படுத்தப்படாமல் “பாதிப்பு” என மொழிபெயர்க்கப்பட்டுள்ளது.
