  text: Or if the raw flesh turns back and becomes white[a], then he shall come to the priest.
translation:
  language: ta
  text: அல்லது பச்சைச் சதை மீண்டும் வெண்மையாக மாறினால்[a], அவன் ஆசாரியரிடம் வர வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்கு சொல், “உயிருள்ள சதை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹ כִּי
  choice: அல்லது … மாறினால்
  rationale: אוֹ மாற்று நிகழ்வை அறிமுகப்படுத்துகிறது; כִּי நிபந்தனையைக் குறிக்கிறது. தமிழில் ‘அல்லது … மாறினால்’ என்பது இரண்டையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יָשׁוּב
  choice: மீண்டும்
  rationale: שׁוב இங்கு முந்தைய நிலையுக்குத் திரும்புவதைக் குறிக்கிறது; அடுத்துள்ள ‘மாறினால்’ என்பதுடன் ‘மீண்டும்’ இயல்பாக இணைகிறது.
- source_word: הַבָּשָׂר הַחַי
  choice: பச்சைச் சதை
  rationale: சொல்லுக்கு சொல் ‘உயிருள்ள சதை.’ தோல் நோயின் நடுவே தெரியும் உயிருள்ள, ஆறாத சதைப்பகுதியைச் சூழலில் குறிக்கும் ‘பச்சைச் சதை’ நவீன தமிழில் தெளிவாக உள்ளது; நேரடி பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְנֶהְפַּךְ לְלָבָן
  choice: வெண்மையாக மாறினால்
  rationale: Niphal வடிவம் நிலைமாற்றத்தைக் குறிக்கிறது; ‘வெண்மையாக மாறுதல்’ தமிழில் இயல்பாகவும் காட்சிப்பூர்வமாகவும் உள்ளது.
- source_word: וּבָא אֶל־הַכֹּהֵן
  choice: அவன் ஆசாரியரிடம் வர வேண்டும்
  rationale: சட்டரீதியான பரிசோதனை நடைமுறையின் அடுத்த படியைத் தெளிவாகக் காட்டுகிறது. ‘ஆசாரியரிடம்’ என்பது இயக்கத்தையும் அணுகுதலையும் இயல்பாக வெளிப்படுத்துகிறது.
