  source_fidelity: மூல எபிரேயத்தின் மாற்றுநிலை நிபந்தனை (אוֹ כִּי), ‘திரும்புதல்’ (יָשׁוּב), உயிருள்ள/பச்சையான சதை வெண்மையாக மாறுதல், மற்றும் ஆசாரியரிடம் வருதல் ஆகிய நடைமுறை வரிசைகள் துல்லியமாகப் பிரதிபலிக்கப்படுகின்றன. ‘மீண்டும் வெண்மையாக மாறினால்’ என்பது முந்தைய நிலையிலான திரும்புதலை இயல்பாகக் காட்டுகிறது.
