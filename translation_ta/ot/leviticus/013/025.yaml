  text: וְ/רָאָ֣ה אֹתָ֣/הּ הַ/כֹּהֵ֡ן וְ/הִנֵּ֣ה נֶהְפַּךְ֩ שֵׂעָ֨ר לָבָ֜ן בַּ/בַּהֶ֗רֶת וּ/מַרְאֶ֨/הָ֙ עָמֹ֣ק מִן הָ/ע֔וֹר צָרַ֣עַת הִ֔וא בַּ/מִּכְוָ֖ה פָּרָ֑חָה וְ/טִמֵּ֤א אֹת/וֹ֙ הַ/כֹּהֵ֔ן נֶ֥גַע צָרַ֖עַת הִֽוא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/025.yaml
  text: And the priest shall examine it[a], and behold, the hair in the bright spot has turned white and its appearance is deeper than the skin, it is a skin disease that has broken out in the burn scar; and the priest shall pronounce him unclean. It is an infection of skin disease.
translation:
  language: ta
  text: ஆசாரியன் அதை ஆராய்ந்து பார்க்க வேண்டும். இதோ, அந்தப் பளிச்சிடும் புள்ளியில் உள்ள முடி வெண்மையாக மாறியிருக்கிறது; அதன் தோற்றம் தோலைவிடப் பள்ளமாக இருக்கிறது. அது தீக்காயத் தழும்பில் வெளிப்பட்ட தோல் நோய்[a]. ஆசாரியன் அவனைத் தீட்டானவன் என்று அறிவிக்க வேண்டும்; அது தோல் நோயின் பாதிப்பு.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘சராஅத்’ (tsaraʿat); கடுமையான பலவகைத் தோல் பாதிப்புகளைக் குறிக்கும் பரந்த சொல். மரபாக இது ‘தொழுநோய்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאָה
  choice: ஆராய்ந்து பார்க்க வேண்டும்
  rationale: ஆசாரியரின் முறையான நோயறிதல் பரிசோதனையைச் சுட்டுவதால், வெறும் ‘பார்க்க’ என்பதைக் காட்டிலும் இச்சொற்றொடர் சூழலுக்கு ஏற்றது.
- source_word: בַּהֶרֶת
  choice: பளிச்சிடும் புள்ளி
  rationale: தோலில் காணப்படும் ஒளிர்ந்த அல்லது வெளிறிய தெளிவான குறியை நவீன மருத்துவப் பெயரைத் திணிக்காமல் குறிக்கிறது.
- source_word: נֶהְפַּךְ שֵׂעָר לָבָן
  choice: முடி வெண்மையாக மாறியிருந்து
  rationale: முடியின் நிறமாற்றத்தை எபிரெய வினை வடிவத்துக்கு இணங்கத் தெரிவிக்கிறது.
- source_word: מַרְאֶהָ עָמֹק מִן־הָעוֹר
  choice: அது தோலைவிடப் பள்ளமாகத் தோன்றினால்
  rationale: பாதிப்பு தோலின் மேற்பரப்பைவிட ஆழமாக அல்லது தாழ்வாகக் காட்சியளிக்கும் நோயறிதல் அடையாளத்தை இயல்பான தமிழில் தருகிறது.
- source_word: צָרַעַת
  choice: தோல் நோய்
  rationale: இது நவீன ஹான்சன் நோயை மட்டும் குறிக்காத பரந்த சடங்கியல்-தோல்நோய் வகை; ஆகவே தவறான மருத்துவத் துல்லியத்தைத் தவிர்க்கிறது.
- source_word: מִכְוָה
  choice: தீக்காயத் தழும்பு
  rationale: தீக்காயம் ஏற்பட்ட இடம் அல்லது அதன் எஞ்சிய தழும்பு என்ற சூழல்சார் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: פָּרָחָה
  choice: வெடித்தெழுந்த
  rationale: தோலில் நோய் வெளிப்படுதல் அல்லது கிளர்ந்தெழுதல் என்ற உருவகத்தை இயல்பாகக் கொண்டுவருகிறது.
- source_word: טִמֵּא אֹתוֹ
  choice: அவனைத் தீட்டுள்ளவன் என்று அறிவிக்க வேண்டும்
  rationale: ஆசாரியன் தீட்டை உண்டாக்குகிறார் என்பதல்ல, அதிகாரபூர்வமான சடங்கியல் தீர்ப்பை அறிவிக்கிறார் என்பதைப் பாதுகாக்கிறது.
- source_word: נֶגַע צָרַעַת
  choice: தோல் நோயின் பாதிப்பு
  rationale: נגע என்பதன் பாதிப்பு/புண்/குறி சார்ந்த பரந்த பொருளைத் தக்கவைத்து, நவீன தொற்றியல் கருத்தைத் தேவையின்றி சேர்க்கவில்லை.
theological_decisions:
- issue: லேவியராகமத் தூய்மைச் சட்டத்தில் צָרַעַת என்பதன் மொழிபெயர்ப்பு
  choice: தோல் நோய்
  alternative: தொழுநோய்; தீட்டுண்டாக்கும் தோல் நோய்
  rationale: எபிரெயச் சொல் நவீன தொழுநோயைவிடப் பரந்த வகையைச் சுட்டுகிறது. ‘தோல் நோய்’ என்பது காலத்திற்குப் பிந்திய மருத்துவ அடையாளத்தைத் திணிக்காமல் உரையின் சடங்கியல் சூழலைத் திறந்தவாறு வைக்கிறது.
- issue: וְהִנֵּה என்பதன் உரையாடல் வலிமை
  choice: இதோ
  alternative: அப்போது; பார்த்தபோது
  rationale: மூலத்தில் உள்ள கவன ஈர்ப்பு மற்றும் நேரடி கண்டறிதல் உணர்வைப் பாதுகாக்கிறது; அதை வெறும் நிபந்தனைச் சொல்லாக மாற்றவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சடங்கியல் சட்ட உரைக்கு ஏற்ற கண்ணியமான மற்றும் பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டது. ‘தீட்டுள்ளவன்’ என்பது மருத்துவ அசுத்தத்தை அல்ல, லேவியராகமத்தின் சடங்கியல் நிலையைச் சுட்டுகிறது.
