source:
  edition: WLC
  text: אָדָ֗ם כִּֽי יִהְיֶ֤ה בְ/עוֹר בְּשָׂר/וֹ֙ שְׂאֵ֤ת אֽוֹ סַפַּ֨חַת֙ א֣וֹ בַהֶ֔רֶת וְ/הָיָ֥ה בְ/עוֹר בְּשָׂר֖/וֹ לְ/נֶ֣גַע צָרָ֑עַת וְ/הוּבָא֙ אֶל אַהֲרֹ֣ן הַ/כֹּהֵ֔ן א֛וֹ אֶל אַחַ֥ד מִ/בָּנָ֖י/ו הַ/כֹּהֲנִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/002.yaml
  text: When a man has on the skin of his body a swelling[a], or a scab, or a bright spot, and it becomes on the skin of his body an infection of skin disease, then he shall be brought to Aaron the priest, or to one of his sons the priests.
translation:
  language: ta
  text: ஒருவனுடைய உடலின் தோலில் வீக்கமோ, பொருக்கோ, பளிச்சிடும் புள்ளியோ தோன்றி, அது அவனுடைய உடலின் தோலில் தோல் நோய்க்குரிய பாதிப்பாக மாறினால்,[a] அவனை ஆசாரியனாகிய ஆரோனிடமோ, ஆசாரியர்களான அவனுடைய மகன்களில் ஒருவனிடமோ கொண்டுவர வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மரபாக, “தொழுநோயின் பாதிப்பு” அல்லது “தொழுநோய்” என்று மொழிபெயர்க்கப்படுகிறது. ஆனால் எபிரெயச் சொல் צָרָעַת (சாராத்) பலவகையான தோல் பாதிப்புகளைக் குறிக்கிறது; அதை நவீன ஹான்சன் நோயுடன் தானாகவே ஒப்பிடக் கூடாது.
    reason: alternative_reading
lexical_decisions:
- source_word: אָדָם
  choice: ஒருவன்
  rationale: தனிநபரைப் பற்றிய பொதுவான சட்ட நிகழ்வை அறிமுகப்படுத்தும் எபிரெய ஒருமையை இயல்பான தமிழ் சட்டநடையில் தருகிறது.
- source_word: בְּעוֹר בְּשָׂרוֹ
  choice: அவனுடைய உடலின் தோலில்
  rationale: எபிரெய மூலத்தின் உடற்கூறு சார்ந்த மீளுரையைத் தக்கவைத்தபடி, நவீன தமிழில் இயல்பாக உள்ளது.
- source_word: שְׂאֵת
  choice: வீக்கம்
  rationale: தோலில் உயர்ந்து காணப்படும் பகுதியைக் குறிக்கும் சொல்லுக்கு தெளிவான, மருத்துவ நோயறிதலை மிகைப்படுத்தாத இணை.
- source_word: סַפַּחַת
  choice: பொருக்கு
  rationale: குறிப்பிட்ட தோல் மாற்றத்தின் துல்லிய இயல்பு உறுதியற்றதால், காய்ந்து படியும் தோல் படலத்தைக் குறிக்கும் பொதுவான சொல்லைத் தேர்ந்தெடுக்கிறது.
- source_word: בַּהֶרֶת
  choice: பளிச்சிடும் புள்ளி
  rationale: வெண்மை என்ற குறுகிய பொருளைத் திணிக்காமல், பிரகாசமான அல்லது வெளிறிய தோல் அடையாளம் என்ற பரந்த பொருளைப் பாதுகாக்கிறது.
- source_word: לְנֶגַע צָרָעַת
  choice: தோல் நோயின் பாதிப்பு
  rationale: நֶגַע என்பதன் பாதிப்பு/புண் சார்ந்த கருத்தையும், צָרָעַת என்பது நவீன ஹான்சன் நோயுடன் தானாக ஒப்பிட முடியாத பரந்த வேதாகமத் தோல் பாதிப்பு வகை என்பதையும் வெளிப்படுத்துகிறது.
- source_word: וְהוּבָא
  choice: அவனைக் ... கொண்டுவர வேண்டும்
  rationale: எபிரெய செயலப்பாட்டு வடிவத்தின் நடைமுறை கட்டளையை இயல்பான தமிழ் சட்டநடையில் காக்கிறது.
- source_word: אַהֲרֹן הַכֹּהֵן
  choice: ஆசாரியனாகிய ஆரோன்
  rationale: பெயரையும் ஆசாரியப் பதவியையும் தெளிவாக இணைக்கிறது.
- source_word: אַחַד מִבָּנָיו הַכֹּהֲנִים
  choice: ஆசாரியர்களான அவனுடைய மகன்களில் ஒருவன்
  rationale: குடும்ப உறவையும் ஆசாரிய அடையாளத்தையும் இயல்பான தமிழில் தக்கவைக்கிறது.
theological_decisions:
- issue: צָרָעַת என்பதன் மொழிபெயர்ப்பு
  choice: தோல் நோய்
  alternative: தொழுநோய்; தீட்டுப்படுத்தும் தோல் நோய்; சாராத்
  rationale: இச்சொல் நவீன ஹான்சன் நோயை மட்டும் குறிக்காமல், வேதாகமச் சட்டத்தில் கண்டறியப்படும் பரந்த தோல் பாதிப்பு வகையைக் குறிக்கிறது. ஆகவே தவறான குறிப்பிட்ட மருத்துவ நோயறிதலைத் தவிர்த்து, மரபு மொழிபெயர்ப்பை அடிக்குறிப்பில் தெரிவிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமானதும் சாதாரண வாசகர்களுக்குப் புரியக்கூடியதுமான சட்டநடை பயன்படுத்தப்பட்டுள்ளது. மருத்துவ ரீதியாக மிகத் துல்லியமாகத் தோன்றும் சொற்கள் தவிர்க்கப்பட்டு, மூலத்தின் மீளுரையும் நோய்வகை குறித்த தெளிவின்மையும் பாதுகாக்கப்பட்டுள்ளன.
