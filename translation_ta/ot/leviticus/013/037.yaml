base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/037.yaml
  text: But if in his sight the scaly eruption has remained unchanged[a], and black hair has grown in it, the scaly eruption is healed; he is clean, and the priest shall pronounce him clean.
translation:
  language: ta
  text: ஆனால் ஆசாரியனின் பார்வையில் அந்தச் செதில் படர்ந்த தோல் பாதிப்பு மாறாமல் இருந்து, அதில் கருப்பு முடி வளர்ந்திருந்தால், அந்தத் தோல் பாதிப்பு குணமாகிவிட்டது; அவன் தூய்மையானவன்; ஆசாரியன் அவனைத் தூய்மையானவன் என்று அறிவிக்க வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆசாரியன் அவனைத் தூய்மைப்படுத்த வேண்டும்.” எபிரெய வினைச்சொல்லை இவ்வாறு நேரடியாக மொழிபெயர்க்கலாம்; ஆனால் இங்கு பாதிப்பு குணமான பின் ஆசாரியன் வழங்கும் அதிகாரப்பூர்வத் தீர்ப்பையே அது குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֵינָיו
  choice: ஆசாரியனின் பார்வையில்
  rationale: எபிரெய மொழியின் ‘அவனுடைய கண்களில்’ என்ற சொல்லாட்சி, பரிசோதிக்கும் ஆசாரியனின் பார்வையில் நிலை எப்படி தோன்றுகிறது என்பதைக் குறிக்கிறது. சூழலில் சுட்டுப்பெயரின் பொருளைத் தெளிவாக்குகிறது.
- source_word: עָמַד
  choice: மாறாமல் இருந்து
  rationale: இங்கு பாதிப்பு பரவாமலும் நிலை மாறாமலும் இருந்ததைக் குறிக்கிறது; சொற்சொல்லான ‘நின்றது’ என்பதைவிட நோயறிதல் சூழலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַנֶּתֶק
  choice: செதில் படர்ந்த தோல் பாதிப்பு
  rationale: தலை அல்லது தாடிப் பகுதியில் ஏற்படும் குறிப்பிட்ட பாதிப்பைக் குறிக்கும் சொல்லை, பழமையான அல்லது வெறும் அரிப்பை மட்டும் உணர்த்தும் தமிழ்ச் சொல்லால் குறுக்காமல் விளக்கமாக மொழிபெயர்க்கிறது.
- source_word: שֵׂעָר שָׁחֹר
  choice: கருமையான முடி
  rationale: எபிரெயச் சொற்றொடரின் நேரடியான பொருளையும் இப்பகுதியின் நோயறிதல் சார்ந்த நிற வேறுபாட்டையும் காக்கிறது.
- source_word: צָמַח בּוֹ
  choice: அதில் ... வளர்ந்திருந்தால்
  rationale: பாதிக்கப்பட்ட இடத்திற்குள் முடி வளர்ந்திருப்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: נִרְפָּא
  choice: குணமாகிவிட்டது
  rationale: பாதிப்பு ஏற்கெனவே குணமடைந்த நிலையைப் passive/resultative பொருளுடன் தெளிவாகக் காட்டுகிறது.
- source_word: טָהוֹר הוּא
  choice: அவன் தூய்மையானவன்
  rationale: இலக்கணத்திலும் சடங்குசார் சூழலிலும் தூய்மையானவன் எனத் தீர்மானிக்கப்படுவது பரிசோதிக்கப்பட்ட நபரே; தோல் பாதிப்பு மட்டும் அல்ல.
- source_word: וְטִהֲרוֹ הַכֹּהֵן
  choice: ஆசாரியன் அவனைத் தூய்மையானவன் என்று அறிவிக்க வேண்டும்
  rationale: குணப்படுத்துதல் ஏற்கெனவே நிகழ்ந்ததாக முந்தைய கூற்று சொல்வதால், இங்கு ஆசாரியனின் செயல் அதிகாரப்பூர்வமான தூய்மைத் தீர்ப்பாகும்.
theological_decisions:
- issue: சடங்குசார் தூய்மையைப் பற்றிய ஆசாரியனின் செயல்
  choice: தூய்மையானவன் என்று அறிவிக்க வேண்டும்
  alternative: அவனைத் தூய்மைப்படுத்த வேண்டும்
  rationale: பாதிப்பு குணமாகிவிட்டது என்பதையும் அதன் பின் ஆசாரியன் தீர்ப்பளிப்பதையும் வசனம் வேறுபடுத்துகிறது. எனவே ஆசாரியன் உடல் நோயைக் குணப்படுத்துகிறார் அல்லது தூய்மையை உண்டாக்குகிறார் என்று தேவையின்றி உணர்த்தாமல், அதிகாரப்பூர்வ அறிவிப்பை மொழிபெயர்ப்பு வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் கண்ணியமான, இயல்பான நடை பயன்படுத்தப்பட்டுள்ளது. தொழில்நுட்பமான הַנֶּתֶק என்பதற்கு ஒரே சொல் மூலம் தவறான மருத்துவ அடையாளம் தராமல் விளக்கச் சொற்றொடர் பயன்படுத்தப்பட்டுள்ளது. அடிக்குறிப்பு குறியீடு அது விளக்கும் இறுதி வினைத்தொடருக்குப் பின் வைக்கப்பட்டுள்ளது.
