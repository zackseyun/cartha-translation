source:
  edition: WLC
  text: נֶ֣גַע צָרַ֔עַת כִּ֥י תִהְיֶ֖ה בְּ/אָדָ֑ם וְ/הוּבָ֖א אֶל הַ/כֹּהֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/009.yaml
  text: When an infection of leprosy is in a person[a], then he shall be brought to the priest.
translation:
  language: ta
  text: ஒருவருக்கு தொழுநோய்க்குரிய பாதிப்பு ஏற்பட்டால்[a], அவர் ஆசாரியனிடம் கொண்டுவரப்பட வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தொழுநோய்’ என்று மரபாக மொழிபெயர்க்கப்படும் எபிரெயச் சொல் צָרַעַת. இது நவீன தொழுநோயை (ஹான்சன் நோயை) மட்டும் அல்லாமல், பலவகையான கடுமையான தோல் பாதிப்புகளையும் குறித்திருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶגַע
  choice: பாதிப்பு
  rationale: லேவியராகமம் 13-ன் பரிசோதனைச் சூழலில் காணக்கூடிய நோய்நிலையைச் சுட்டுகிறது. ‘பாதிப்பு’ என்பது ‘கொள்ளைநோய்’ போன்ற மிகைப்படுத்தலைத் தவிர்த்து இயல்பான தமிழில் பொருளைத் தருகிறது.
- source_word: צָרַעַת
  choice: தொழுநோய்க்குரிய
  rationale: மரபுவழி ‘தொழுநோய்’ என்ற சொல்லுடன் தொடர்பைத் தக்கவைத்தபடியே, எபிரெயச் சொல் நவீன ஹான்சன் நோயை மட்டும் குறிக்காது என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- source_word: כִּי
  choice: ஏற்பட்டால்
  rationale: இது சட்ட வழக்கிற்கான நிபந்தனையை அறிமுகப்படுத்துகிறது; தமிழில் ‘-ஆல்’ அமைப்பு இயல்பாக உள்ளது.
- source_word: תִהְיֶה
  choice: ஏற்பட்டால்
  rationale: ‘இருத்தல்/உண்டாதல்’ என்ற வினைப் பொருள் தமிழின் நோய்நிலைச் சொல்லாடலில் ‘ஏற்படுதல்’ என இயல்பாக வெளிப்படுகிறது; தனியே ‘தோன்றினால்’ என்று கூறி மூலத்தில் இல்லாத காண்பியல் நுணுக்கம் சேர்க்கப்படவில்லை.
- source_word: בְּאָדָם
  choice: ஒருவருக்கு
  rationale: אָדָם இங்கு குறிப்பிட்ட பாலினத்தை வலியுறுத்தாமல் ஒரு மனிதரைப் பொதுவாகக் குறிக்கிறது. தமிழில் நோய் அல்லது பாதிப்பு ஒருவரிடம் இருப்பதை ‘ஒருவருக்கு’ எனக் கூறுவது இயல்பானது.
- source_word: וְהוּבָא
  choice: அவர் ... கொண்டுவரப்பட வேண்டும்
  rationale: எபிரெயச் செயலப்பாட்டு வடிவத்தையும் அடுத்த கட்ட சட்ட நடைமுறையையும் தக்கவைக்கிறது.
- source_word: אֶל הַכֹּהֵן
  choice: ஆசாரியனிடம்
  rationale: திட்டவட்ட உருபுடன் வரும் பரிசோதனை செய்யும் ஆசாரியனைக் குறிக்கிறது; தமிழில் நபரிடம் கொண்டுவருதலை ‘-ிடம்’ இயல்பாகக் காட்டுகிறது.
theological_decisions:
- issue: אָדָם என்பதன் பொதுமை மற்றும் பாலின வெளிப்பாடு
  choice: ஒருவர்
  alternative: மனிதன் / ஓர் ஆண்
  rationale: இச்சட்டச் சூழலில் אָדָם மனித நபரைப் பொதுவாகக் குறிக்கிறது; எபிரெயச் சொல்லே ஆணைக் குறிப்பாகக் குறிக்கும் אִישׁ அல்ல. ஆகவே நவீன தமிழில் இயல்பான ‘ஒருவர்’ பொருளைச் சுருக்காமல் தருகிறது.
- issue: צָרַעַת என்பதன் மருத்துவ அடையாளம்
  choice: தொழுநோய்க்குரிய பாதிப்பு, விளக்க அடிக்குறிப்புடன்
  alternative: தோல் நோய் / தொழுநோய்
  rationale: மரபு மொழிபெயர்ப்புடனான தொடர்பைத் தக்கவைத்தாலும், இதை நவீன ஹான்சன் நோயோடு மட்டும் ஒப்பிடும் தவறை அடிக்குறிப்பு தடுக்கிறது; ‘தோல் நோய்’ மட்டும் மூலச்சொல்லின் தனித்துவத்தை மங்கச் செய்யலாம்.
translation_notes:
  register: நவீன, கண்ணியமான பொதுத் தமிழ். சட்ட நடைமுறையின் நிபந்தனை மற்றும் செயலப்பாட்டு கட்டளை தெளிவாக வைக்கப்பட்டுள்ளன; ‘ஆசாரியன்’ வேதாகம வழக்குச் சொல்லாகத் தக்கவைக்கப்பட்டுள்ளது.
