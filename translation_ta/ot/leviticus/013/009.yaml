  source_fidelity: மூல எபிரெயத்தின் נֶגַע צָרַעַת (‘சராஅத்-தொடர்பான பாதிப்பு’), நிபந்தனை அமைப்பு, பொதுமையான בְּאָדָם, மற்றும் செயலப்பாட்டு நடைமுறை வினை ஆகியவை பொருளுக்கு உண்மையாகத் தரப்பட்டுள்ளன. ‘ஏற்பட்டால்’ சட்ட-நிபந்தனைச் சூழலில் இயல்பானது; ‘கொண்டுவரப்பட வேண்டும்’ וְהוּבָא-வின் செயலப்பாட்டையும் நடைமுறை வலிமையையும் காக்கிறது.
  naturalness: ‘ஒருவருக்கு … ஏற்பட்டால், அவர் ஆசாரியனிடம் கொண்டுவரப்பட வேண்டும்’ என்பது நவீன, கண்ணியமான பொதுத் தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது. ‘தொழுநோய்க்குரிய பாதிப்பு’ சிறிது முறையான சொல்லமைப்பாக இருந்தாலும், வேதாகமச் சட்டப் பதிவின் பதிவுநிலைக்கு ஏற்றது.
  terminology: ‘ஆசாரியன்’ நிலையான வேதாகமத் தமிழ்ச் சொல். ‘தொழுநோய்’ மரபுவழி இணைப்பைத் தக்கவைக்கிறது; அடிக்குறிப்பு צָרַעַת நவீன ஹான்சன் நோய்க்கு மட்டுமே இணையானதல்ல என்பதைத் துல்லியமாகவும் தேவையான அளவிலும் விளக்குகிறது. அடிக்குறிப்பு குறியீடு [a] சரியான இடத்தில் உள்ளது.
