- source_word: נָגַע
  choice: பாதிப்பு
  rationale: இந்தச் சொல் ஆசாரியர் பரிசோதிக்கும் காணக்கூடிய புண், நோய்க்குறி அல்லது தோல் வெடிப்பைக் குறிக்கும் பரந்த சொல்; குறிப்பிட்ட நவீன மருத்துவ நோயாக வரையறுக்காமல் இருக்க ‘பாதிப்பு’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: בְּרֹאשׁ
