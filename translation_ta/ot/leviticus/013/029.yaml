  verdict: revise
  source_fidelity: The conditional case formula, explicit reference to both man and woman, broad sense of נֶגַע, and the two locations are conveyed accurately. However, ‘தாடிப் பகுதி’ means the beard area and can extend beyond the beard itself; בְזָקָן more directly denotes ‘in/on the beard.’
  naturalness: The draft is clear and suitably formal for a legal-ritual instruction. ‘தாடியிலோ’ is both more natural and more precise than ‘தாடிப் பகுதியிலோ.’
  terminology: ‘பாதிப்பு’ appropriately retains the broad, non-diagnostic force of נֶגַע. The explanatory note correctly preserves its visible-lesion context without identifying a modern disease. ‘காணக்கூடிய தோல் பாதிப்பு அல்லது வெடிப்பு’ is smoother Tamil than the existing final phrase.
