  text: וְ/רָאָ֧ה הַ/כֹּהֵ֛ן אֶת הַ/בָּשָׂ֥ר הַ/חַ֖י וְ/טִמְּא֑/וֹ הַ/בָּשָׂ֥ר הַ/חַ֛י טָמֵ֥א ה֖וּא צָרַ֥עַת הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/015.yaml
  text: When the priest sees the raw flesh[a], he shall pronounce him unclean. The raw flesh is unclean[c][b]; it is a skin disease.
translation:
  language: ta
  text: ஆசாரியர் பச்சைச் சதையைக்[a] காணும்போது, அவனைத் தீட்டானவன் என்று அறிவிக்க வேண்டும்.[b] அந்தப் பச்சைச் சதை தீட்டானது; அது ஒரு தோல் நோய்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘உயிருள்ள சதை’; மரபாக ‘பச்சைச் சதை’ என மொழிபெயர்க்கப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது ‘அவனைத் தீட்டானவன் எனத் தீர்ப்பளிக்க வேண்டும்.’ ஆசாரியர் இங்கு தூய்மை தொடர்பான அதிகாரப்பூர்வத் தீர்ப்பை வழங்குகிறார்.
    reason: lexical_alternative
  - marker: c
    text: மரபாக ‘தொழுநோய்.’ ஆனால் எபிரெயச் சொல் நவீன தொழுநோயை மட்டும் அல்லாமல், பரந்த வகையான தோல் நோய் அல்லது தோல் பாதிப்பைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: காணும்போது
  rationale: சட்ட நடைமுறையின் தொடர்ச்சியைச் சுட்டும் waw + qatal அமைப்பை, இயல்பான தமிழில் காலத்தைக் குறிக்கும் துணைவாக்கியமாக வழங்குகிறது.
- source_word: הַכֹּהֵן
  choice: ஆசாரியர்
  rationale: லேவியராகமத்தில் பரிசோதித்து தூய்மை அல்லது தீட்டு குறித்த அதிகாரப்பூர்வத் தீர்ப்பை வழங்கும் כֹּהֵן என்பவருக்கான வழக்கமான, மரியாதையான தமிழ் சொல்.
- source_word: הַבָּשָׂר הַחַי
  choice: பச்சைச் சதை
  rationale: சொல்லுக்குச் சொல் ‘உயிருள்ள சதை’ என்றாலும், இச்சூழலில் தெரியும் உயிர்த்திசு அல்லது ஆறாத பச்சைச் சதையை இயல்பாகக் குறிக்கிறது; ‘ஆரோக்கியமான சதை’ என்று தவறாகப் புரிந்துகொள்வதையும் தவிர்க்கிறது.
- source_word: וְטִמְּאוֹ
  choice: அவனைத் தீட்டானவன் என்று அறிவிக்க வேண்டும்
  rationale: Piel வடிவம் அந்த நபரைத் தீட்டாக்குவதைவிட, ஆசாரியர் அவருடைய சடங்குசார் நிலையை அதிகாரப்பூர்வமாக அறிவிப்பதைக் குறிக்கிறது.
- source_word: טָמֵא הוּא
  choice: தீட்டானது
  rationale: லேவியராகமத்தின் சடங்குசார் தூய்மை வகைப்பாட்டை ‘அசுத்தம்’ போன்ற பொதுவான சொல்லைவிட ‘தீட்டு’ தெளிவாகத் தக்கவைக்கிறது.
- source_word: צָרַעַת
  choice: ஒரு தோல் நோய்
  rationale: צָרַעַת என்பது நவீன ஹான்சன் நோயை மட்டும் துல்லியமாகக் குறிப்பதில்லை; பரந்த தோல் பாதிப்பு வகையைச் சுட்டுவதால் மருத்துவ ரீதியாக மிகைப்படுத்தாத சொற்றொடர் தேர்ந்தெடுக்கப்பட்டது.
theological_decisions:
- issue: லேவியராகமத்தின் தூய்மைச் சட்டத்தில் צָרַעַת என்பதன் பொருள்
  choice: ஒரு தோல் நோய்
  alternative: தொழுநோய்; தீட்டுண்டாக்கும் தோல் நோய்
  rationale: பிற்கால அல்லது நவீன மருத்துவ அடையாளத்தை வசனத்திற்குள் புகுத்தாமல், எபிரெயச் சொல்லின் பரந்த சடங்கு-சட்ட வகைப்பாட்டைத் தக்கவைக்கிறது.
- issue: ஆசாரியரின் செயல் தீட்டை உண்டாக்குகிறதா அல்லது நிலையை அறிவிக்கிறதா
  choice: தீட்டானவன் என்று அறிவிக்க வேண்டும்
  alternative: அவனைத் தீட்டாக்க வேண்டும்
  rationale: இங்கு ஆசாரியர் பரிசோதனையின் அடிப்படையில் அதிகாரப்பூர்வமான தூய்மைத் தீர்ப்பை வழங்குகிறார்; அவர் தீட்டை உண்டாக்குகிறார் என்று மொழிபெயர்ப்பது தவறாக வழிநடத்தக்கூடும்.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் லேவியராகமத்தின் சடங்கு-சட்டத் தொனியைத் தக்கவைக்கும் வகையிலும் மொழிபெயர்க்கப்பட்டது. ‘ஆசாரியர்’ மரியாதையான பணிப்பெயராகவும், ‘தீட்டு’ சடங்குசார் வகைப்பாட்டுக்கான தொடர்ச்சியான சொல்லாகவும் பயன்படுத்தப்பட்டுள்ளது.
