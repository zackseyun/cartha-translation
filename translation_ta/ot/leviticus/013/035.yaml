base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/035.yaml
  text: But if the scaly eruption does spread in the skin after his cleansing,[a]
translation:
  language: ta
  text: ஆனால், அவன் தூய்மையடைந்த பிறகு அந்தச் செதில்படர்ந்த பாதிப்பு தோலில் மேலும் பரவினால்,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘செதில்படர்ந்த பாதிப்பு’ என்பதற்கான எபிரெயச் சொல் இந்த அதிகாரத்தில் விவரிக்கப்படும் ஒரு குறிப்பிட்ட தோல் பாதிப்பைக் குறிக்கிறது. இதை ‘அரிப்பு’ அல்லது பழைய மொழிநடையில் ‘சொறி’ என்றும் மொழிபெயர்க்கலாம்; ஆனால் இந்தப் பாதிப்பில் செதில்களும் முடி உதிர்வும் தொடர்புடையதாகத் தெரிகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: ஆனால், ... பரவினால்
  rationale: இந்த நிபந்தனை முந்தைய பரிசோதனை முடிவுக்கு மாறான அடுத்த நிலையை அறிமுகப்படுத்துகிறது; ‘ஆனால்’ அந்த நடைமுறைசார் மாறுபாட்டை இயல்பான தமிழில் காட்டுகிறது.
- source_word: פָּשֹׂה יִפְשֶׂה
  choice: மேலும் பரவினால்
  rationale: முற்றிலும்வினையெச்சத்துடன் வரும் வினைச்சொல் பரவுதலை வலியுறுத்துகிறது. சூழலில் ‘மேலும் பரவினால்’ என்பது அந்த வலியுறுத்தலையும் தொடர்ந்து நிகழும் பரவலையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַנֶּתֶק
  choice: செதில்படர்ந்த அந்தத் தோல் பாதிப்பு
  rationale: இந்தச் சொல் லேவியராகமம் 13-ல் தலைமுடி அல்லது தாடிப் பகுதியில் முடி பாதிப்புடன் காணப்படும் ஒரு குறிப்பிட்ட தோல் பாதிப்பைக் குறிக்கிறது. ஒரு குறிப்பிட்ட நவீன நோயறிதலைத் திணிக்காமல், காணக்கூடிய செதில் தன்மையை இந்த மொழிபெயர்ப்பு தெளிவாக்குகிறது.
- source_word: בָּעוֹר
  choice: தோலில்
  rationale: עוֹר என்பதன் நேர்ப்பொருள் ‘தோல்’; தமிழில் பாதிப்பு பரவும் இடத்தை ‘தோலில்’ என்பது இயல்பாகக் குறிக்கிறது.
- source_word: אַחֲרֵי
  choice: பிறகு
  rationale: கால வரிசையைக் குறிக்கும் எளிய, நேரான தமிழ் இணைச்சொல்.
- source_word: טָהֳרָתוֹ
  choice: அவன் தூய்மையடைந்த பிறகு
  rationale: சடங்குசார் தூய்மை நிலையைச் சுட்டுகிறது. ‘தூய்மையடைந்த’ என்பது அறநெறிசார் பாவநீக்கத்தைத் திணிக்காமல், தூய்மையான நிலைக்கு வந்ததையோ அப்படித் தீர்மானிக்கப்பட்டதையோ தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: טָהֳרָתוֹ குறிக்கும் தூய்மையின் தன்மை
  choice: சடங்குசார் தூய்மை நிலையாக ‘தூய்மையடைந்த’ என்று மொழிபெயர்த்தல்
  alternative: ‘தூய்மையானவன் என்று அறிவிக்கப்பட்ட பிறகு’
  rationale: முந்தைய வசனச் சூழலில் ஆசாரியரின் அறிவிப்பு இருப்பினும், எபிரெயப் பெயர்ச்சொல் அறிவிப்பை மட்டும் வெளிப்படையாகக் கூறுவதில்லை. எனவே சூழலை மதித்தபடியே மூலத்தின் பரந்த பொருளைத் திறந்துவைக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையில் எழுதப்பட்டுள்ளது. மருத்துவ ரீதியாகத் துல்லியமற்ற தனிப்பட்ட நோய்ப்பெயரைத் தவிர்த்து, எபிரெயச் சொல்லின் காணக்கூடிய அம்சம் விளக்கப்பட்டுள்ளது; சடங்குசார் தூய்மை அறநெறிசார் தூய்மையாக மாற்றப்படவில்லை.
