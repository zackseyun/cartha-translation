  text: כָּל יְמֵ֞י אֲשֶׁ֨ר הַ/נֶּ֥גַע בּ֛/וֹ יִטְמָ֖א טָמֵ֣א ה֑וּא בָּדָ֣ד יֵשֵׁ֔ב מִ/ח֥וּץ לַֽ/מַּחֲנֶ֖ה מוֹשָׁבֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/046.yaml
  text: All the days that the disease is in him[a], he shall be unclean. He is unclean. He shall live alone[b]; his dwelling shall be outside the camp.
translation:
  language: ta
  text: அந்தப் பாதிப்பு[a] அவனிடம் இருக்கும் நாட்களெல்லாம் அவன் தீட்டுப்பட்டவனாக இருப்பான். அவன் தீட்டுப்பட்டவன்.[b] அவன் தனியாகக் குடியிருக்க வேண்டும்; அவனுடைய குடியிருப்பு முகாமுக்கு வெளியே இருக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பாதிப்பு’ என்பதற்குப் பதிலாக ‘வாதை’ அல்லது ‘நோய்ப்பாதிப்பு’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் பரந்த பொருளுடையது; இங்கு இந்த அதிகாரத்தில் ஆய்ந்து தீர்மானிக்கப்படும் நிலையைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: இங்கு ‘தீட்டுப்பட்டவன்’ என்பது சட்டத்தில் கூறப்படும் லேவியத் தூய்மையின்மை நிலையைக் குறிக்கிறது; அது அவசியமாக ஒழுக்கக் குற்றத்தைக் குறிக்காது.
    reason: cultural_note
lexical_decisions:
- source_word: הַנֶּגַע
  choice: அந்தப் பாதிப்பு
  rationale: נֶגַע என்பது தாக்குதல், வாதை, நோய்நிலை போன்ற பரந்த பொருளுடைய சொல். லேவியராகமம் 13-இல் ஆய்வு செய்து தீர்மானிக்கப்பட்ட உடல் பாதிப்பைக் குறிப்பதால், குறிப்பிட்ட ஒரே நோயாகச் சுருக்காமல் ‘பாதிப்பு’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: בּוֹ
  choice: அவனிடம்
  rationale: எபிரெய முன்னிடைச்சொல் ‘அவனில்/அவன்மேல்’ என்ற இரு நிழற்பொருள்களையும் தரக்கூடும். தமிழில் ஒரு பாதிப்பு ஒருவரிடம் இருப்பதாகக் கூறுவது இயல்பாகவும், மூலத்தின் இடவியல் தெளிவின்மையை அளவுக்கு மீறித் தீர்க்காமலும் உள்ளது.
- source_word: יִטְמָא
  choice: தீட்டுள்ளவனாக இருப்பான்
  rationale: Qal imperfect இங்கு சட்ட விதியின் தொடரும் நிலையைச் சுட்டுகிறது. ‘இருப்பான்’ சட்டப்பூர்வ வலிமையைக் காக்கிறது; ‘தீட்டு’ லேவியத் தூய்மைச் சூழலின் வகைப்பாட்டை வெளிப்படுத்துகிறது.
- source_word: טָמֵא הוּא
  choice: அவன் தீட்டுள்ளவன்
  rationale: வினையில்லா எபிரெய வாக்கியம் அந்த நிலையை வலியுறுத்தி மீண்டும் கூறுகிறது. தனி வாக்கியமாக வைத்ததால் மூலத்தின் மீளுரையும் வலியுறுத்தலும் பாதுகாக்கப்படுகின்றன.
- source_word: בָּדָד
  choice: தனியாக
  rationale: בָּדָד பிரிக்கப்பட்ட அல்லது தனித்த நிலையைச் சுட்டுகிறது. ‘தனியாக’ என்பது நேரடியான, இயல்பான தமிழ்; மருத்துவச் சொல்லாடலான ‘தனிமைப்படுத்தப்பட்டு’ என்ற கூடுதல் விளக்கத்தைத் தவிர்க்கிறது.
- source_word: יֵשֵׁב
  choice: குடியிருக்க வேண்டும்
  rationale: ישב உட்காருதல், தங்குதல், குடியிருத்தல் ஆகிய பொருள்களைக் கொண்டது. வசிப்பிடம் மற்றும் சமூகத்துக்கு வெளியேயிருத்தல் பற்றிய இச்சட்டச் சூழலில் ‘குடியிருக்க வேண்டும்’ இயல்பாகப் பொருளைத் தருகிறது.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: முகாமுக்கு வெளியே
  rationale: வனாந்தர முகாமின் எல்லைக்கு வெளியிலான இடத்தை நேரடியாகவும் தெளிவாகவும் குறிக்கிறது.
- source_word: מוֹשָׁבוֹ
  choice: அவனுடைய குடியிருப்பு
  rationale: מוֹשָׁב வசிக்கும் இடத்தைக் குறிக்கிறது. ‘குடியிருப்பு’ அதன் concrete residential sense-ஐ சுருக்கமாகக் காக்கிறது.
theological_decisions:
- issue: லேவியராகமம் 13-இல் தீட்டின் இயல்பு
  choice: טמא என்பதை முதன்மை உரையில் ‘தீட்டுள்ளவன்’ என்று, கூடுதல் அடைமொழியின்றி மொழிபெயர்த்தல்
  alternative: ‘சடங்குமுறைப்படி தீட்டுள்ளவன்’ அல்லது ‘ஆசாரத் தீட்டுள்ளவன்’
  rationale: இவ்வசனம் லேவியத் தூய்மை நிலையைப் பற்றியது; தனிப்பட்ட ஒழுக்கக் குற்றத்தை அவசியம் குறிக்கவில்லை. அதேவேளை எபிரெய உரையில் ‘சடங்குமுறைப்படி’ என்ற அடைமொழி இல்லை. எனவே முதன்மை உரை வேதாகமத்தின் ‘தீட்டு’ என்ற வகைப்பாட்டையே காக்கிறது; குறிப்பு அதன் சூழலை விளக்குகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் வகையிலும் சட்ட உரைக்கேற்ற கண்ணியமான தொனியிலும் வடிவமைக்கப்பட்டது. மூலத்தின் வலியுறுத்தும் மீளுரை தனி வாக்கியமாகப் பாதுகாக்கப்பட்டது; ‘தனிமைப்படுத்துதல்’ போன்ற மருத்துவ நிர்வாகச் சொல்லாடல் சேர்க்கப்படவில்லை.
