base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/005.yaml
  text: And the priest shall examine him on the seventh day[a], and behold, if the spot has remained unchanged in his sight and the spot has not spread in the skin[c][b], then the priest shall isolate him for seven days a second time.
translation:
  language: ta
  text: ஏழாம் நாளில் ஆசாரியன் அவனைப் பரிசோதிக்க வேண்டும். இதோ, அந்தப் பாதிப்பு[a] ஆசாரியனின் பார்வையில் மாறாமல் இருந்து[b], தோலில் பரவாமல் இருந்தால், ஆசாரியன் அவனை இரண்டாம் முறையாக ஏழு நாட்களுக்குத் தனிமைப்படுத்த வேண்டும்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பாதிப்பு’ என்பதற்குப் பதிலாக ‘பாதிப்புக் குறி’ அல்லது ‘புண்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் נגע (நெகா); இது ஆசாரியர் பரிசோதித்த காணக்கூடிய தோல் மாற்றத்தைக் குறிக்கிறது, நவீன மருத்துவத்தில் வரையறுக்கப்பட்ட ஒரு நோயை அவசியம் குறிக்காது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், ‘அந்தப் பாதிப்பு அவனுடைய கண்களில் நின்றது’; அதாவது, ஆசாரியர் பார்த்தபோது அது மாறாமல் தோன்றியது.
    reason: lexical_alternative
  - marker: c
    text: ‘தனிமைப்படுத்த வேண்டும்’ என்பதற்குப் பதிலாக ‘அடைத்துவைக்க வேண்டும்’ அல்லது ‘ஒதுக்கிவைக்க வேண்டும்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָהוּ
  choice: அவனைப் பரிசோதிக்க வேண்டும்
  rationale: ראה என்பதன் அடிப்படைப் பொருள் ‘பார்த்தல்’ என்றாலும், இங்கு ஆசாரியர் மேற்கொள்ளும் சடங்குமுறை ஆய்வைக் குறிக்கிறது; ஆகவே ‘பரிசோதிக்க’ என்பது சூழலுக்கேற்ற இயல்பான சொல்.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: ஏழாம் நாளில்
  rationale: குறிப்பிட்ட தொடர் காலத்தைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: பரிசோதனையில் காணப்படும் முடிவின்மீது கவனத்தை ஈர்க்கும் எபிரெய உரைநடைக் குறியைப் பாதுகாக்கிறது.
- source_word: הַנֶּגַע
  choice: அந்தப் பாதிப்பு
  rationale: נגע என்பது காணக்கூடிய தோல் பாதிப்பு அல்லது குறியைக் குறிக்கிறது; நவீன மருத்துவத்தில் வரையறுக்கப்பட்ட ஒரு குறிப்பிட்ட நோயாக இதை மாற்றாமல் ‘பாதிப்பு’ என வழங்கப்படுகிறது.
- source_word: עָמַד בְּעֵינָיו
  choice: ஆசாரியனின் பார்வையில் மாறாமல் இருந்து
  rationale: சொல்லுக்குச் சொல் ‘அவனுடைய கண்களில் நின்றது’ என்ற மொழிமரபின் பொருள், ஆசாரியர் பார்த்தபோது அதன் தோற்றம் மாறாமல் இருந்தது என்பதாகும். பார்வை யாருடையது என்பதும் தமிழில் தெளிவாக்கப்பட்டுள்ளது.
- source_word: לֹא פָשָׂה
  choice: பரவாமல் இருந்தால்
  rationale: இந்த ஆய்வுச் சூழலில் פשׂה என்பது பாதிப்பு விரிவடைவதைக் குறிக்கிறது; ‘பரவாமல்’ என்பது அதன் இயல்பான தமிழ் இணை.
- source_word: בָּעוֹר
  choice: தோலில்
  rationale: עור என்பதன் நேரடியான பொருளான ‘தோல்’ பாதுகாக்கப்படுகிறது.
- source_word: וְהִסְגִּירוֹ
  choice: அவனைத் தனிமைப்படுத்த வேண்டும்
  rationale: இந்த வினை ‘அடைத்துவைத்தல்/ஒதுக்கிவைத்தல்’ என்பதைக் குறிக்கிறது. நவீன மருத்துவத் துல்லியத்தைத் தேவையின்றி புகுத்தும் ‘தொற்றுத்தடுப்புக் காவல்’ போன்ற சொல்லைவிட, சடங்குமுறைப் பிரித்துவைப்பை ‘தனிமைப்படுத்த’ தெளிவாகச் சொல்கிறது.
- source_word: שִׁבְעַת יָמִים
  choice: ஏழு நாட்களுக்கு
  rationale: கால அளவை இயல்பான தமிழில் நேரடியாகத் தெரிவிக்கிறது.
- source_word: שֵׁנִית
  choice: இரண்டாம் முறையாக
  rationale: முந்தைய ஏழு நாள் தனிமைப்படுத்தல் மீண்டும் செய்யப்படுவதை வெளிப்படையாகக் காட்டுகிறது.
