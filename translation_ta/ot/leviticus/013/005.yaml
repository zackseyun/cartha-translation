translation_notes:
  register: நவீன பொதுத்தமிழில், சட்ட-சடங்கு சூழலுக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆசாரியன்’ என்பது லேவியராகமச் சூழலில் பரவலாக அறியப்படும் சொல்லாக வைக்கப்பட்டுள்ளது. எபிரெய மொழிமரபின் பொருள் இயல்பான தமிழில் தரப்பட்டு, அதன் சொல்லுக்குச் சொல் வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
