source:
  edition: WLC
  text: אִישׁ צָר֥וּעַ ה֖וּא טָמֵ֣א ה֑וּא טַמֵּ֧א יְטַמְּאֶ֛/נּוּ הַ/כֹּהֵ֖ן בְּ/רֹאשׁ֥/וֹ נִגְעֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/044.yaml
  text: He is a leprous man; he is unclean[a]. The priest shall surely pronounce him unclean; his disease is on his head.
translation:
  language: ta
  text: அவன் தோல் நோயால் பாதிக்கப்பட்ட மனிதன்; அவன் தீட்டுள்ளவன். ஆசாரியன் அவனைத் தீட்டுள்ளவன் என்று உறுதியாக அறிவிக்க வேண்டும்; அவனுடைய பாதிப்பு அவன் தலையில் உள்ளது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִישׁ
  choice: மனிதன்
  rationale: எபிரெயச் சொல் ஒருமை ஆண்பாலில், சட்டவிதியில் பரிசோதிக்கப்படும் ஓர் ஆணைக் குறிக்கிறது; நவீனத் தமிழில் இயல்பாகவும் துல்லியமாகவும் ‘மனிதன்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: צָרוּעַ
  choice: தோல் நோயால் பாதிக்கப்பட்ட
  rationale: צרע என்ற வேரிலிருந்து வரும் இச்சொல் இவ்வதிகாரத்தில் விவாதிக்கப்படும் தோல் பாதிப்பைக் குறிக்கிறது; இது நவீன ஹான்சன் நோயுடன் அவசியம் ஒன்றல்ல. எனவே தவறான மருத்துவத் துல்லியத்தைத் தவிர்க்க இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: טָמֵא הוּא
  choice: அவன் தீட்டுள்ளவன்
  rationale: லேவியராகமத்தில் טָמֵא முதன்மையாகச் சடங்குமுறைத் தீட்டுநிலையைக் குறிக்கிறது; ‘தீட்டுள்ளவன்’ அந்த நிலையைத் தெளிவாக எடுத்துரைக்கிறது.
- source_word: טַמֵּא יְטַמְּאֶנּוּ
  choice: அவனைத் தீட்டுள்ளவன் என்று உறுதியாக அறிவிக்க வேண்டும்
  rationale: வினையெச்ச முற்றுருவும் நிறைவுறா வினையும் சேர்ந்த அமைப்பு வலியுறுத்தலைக் காட்டுகிறது. ஆசாரியன் தீட்டை உண்டாக்கவில்லை; அதிகாரபூர்வமாக அந்த நிலையை அறிவிக்கிறார்.
- source_word: הַכֹּהֵן
  choice: ஆசாரியன்
  rationale: பரிசோதித்து நிலையை அறிவிக்கும் வழிபாட்டுப் பணியாளருக்கான நிலையான தமிழ் வேதாகமச் சொல்.
- source_word: בְּרֹאשׁוֹ
  choice: அவன் தலையில்
  rationale: எபிரெயச் சொற்றொடர் பாதிப்பின் இருப்பிடத்தை நேரடியாக ‘அவன் தலையில்’ எனக் குறிப்பிடுகிறது; ‘உச்சந்தலையில்’ என்று தேவையின்றிக் குறுக்கப்படவில்லை.
- source_word: נִגְעוֹ
  choice: அவனுடைய பாதிப்பு
  rationale: லேவியராகமம் 13-இல் נגע என்பது நோயாகக் கருதப்படும் பாதிப்பு அல்லது புண்ணைக் குறிக்கலாம். ‘பாதிப்பு’ மூலத்தின் பரப்பைத் தக்கவைத்து மிகையான மருத்துவத் தீர்மானத்தைத் தவிர்க்கிறது.
theological_decisions:
- issue: טָמֵא என்பதன் பொருள்
  choice: சடங்குமுறைத் தீட்டுநிலையை உணர்த்தும் ‘தீட்டுள்ளவன்’
  alternative: அசுத்தமானவன்
  rationale: இங்கு சொல்லப்படுவது பொதுவான உடல் அழுக்கு அல்லது ஒழுக்கக் குற்றம் அல்ல; லேவியராகமச் சட்டத்திலுள்ள சடங்குமுறை நிலை.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் சட்டவிதிக்குரிய உறுதியும் கொண்ட நடை பயன்படுத்தப்பட்டது. மருத்துவ ரீதியாக ‘தொழுநோய்’ என்று அடையாளப்படுத்தாமல், மூலத்தின் பொதுவான தோல் பாதிப்பு கருத்து காக்கப்பட்டது.
