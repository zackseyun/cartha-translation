base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/055.yaml
  text: Then the priest shall examine it after the diseased area has been washed[a], and if the diseased area has not changed its appearance and the diseased area has not spread, it is unclean. You shall burn it in the fire; it is a corrosive spot[c][b], whether on its worn side or on its bare side.
translation:
  language: ta
  text: நோய்ப்பட்ட பகுதி கழுவப்பட்ட பிறகு, ஆசாரியன் அதைப் பரிசோதிக்க வேண்டும். நோய்ப்பட்ட பகுதியின் தோற்றம்[a] மாறாமலும் அது பரவாமலும் இருந்தால், அது தீட்டானது. அதை நெருப்பில் எரித்துவிட வேண்டும். அது அரித்தழிக்கும் பாதிப்பு[b]; அது அதன் ஒரு பக்கத்திலோ மறுபக்கத்திலோ இருந்தாலும் சரி.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தோற்றம்’ என்பதற்குப் பதிலாக ‘நிறம்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய மொழிவழக்கு சொற்சொல்லாக ‘தன் கண்ணை மாற்றவில்லை’ என்று கூறுகிறது; இது கண்ணுக்குத் தெரியும் தோற்றத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘அரிக்கும் சிதைவு’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் பொருளை அழிவுறச் செய்யும் சேதத்தைக் குறிக்கிறது; அதன் துல்லியமான தன்மை உறுதியல்ல.
    reason: lexical_alternative
  - marker: c
    text: இறுதிச் சொற்றொடர் பொருள் தெளிவற்றது. சொற்சொல்லாக அது ‘அதன் வழுக்கையிலோ அதன் நெற்றி வழுக்கையிலோ’ என்கிறது. இச்சூழலில் இது பாதிக்கப்பட்ட துணி அல்லது தோலின் இரு பக்கங்கள் அல்லது இரு வேறுபட்ட மேற்பரப்பு நிலைகளைக் குறிக்கலாம்.
    reason: textual_or_semantic_ambiguity
lexical_decisions:
- source_word: וְרָאָה
  choice: பரிசோதிக்க வேண்டும்
  rationale: ஆசாரியர் நோய்க்குறியை ஆய்வு செய்து தீர்மானிக்கும் சட்டச் சூழலில் ראה வெறுமனே ‘பார்த்தல்’ என்பதைக் காட்டிலும் ‘பரிசோதித்தல்’ என்ற பொருளைத் தருகிறது.
- source_word: הַנֶּגַע
  choice: நோய்ப்பட்ட பகுதி / பாதிப்பு
  rationale: נגע என்பது இங்கு நவீன மருத்துவ நோயறிதலைக் குறிக்காமல், துணி அல்லது தோலில் காணப்படும் பாதிக்கப்பட்ட இடத்தைக் குறிக்கிறது.
- source_word: לֹא הָפַךְ ... אֶת עֵינוֹ
  choice: தோற்றம் மாறாமல்
  rationale: எபிரெய மொழிவழக்கில் சொற்சொல்லாக ‘தன் கண்ணை மாற்றவில்லை’ என்பது கண்ணுக்குத் தெரியும் தோற்றம், ஒருவேளை நிறம், மாறவில்லை என்பதைக் குறிக்கிறது.
- source_word: לֹא פָשָׂה
  choice: பரவாமல்
  rationale: பாதிப்பு மேலும் விரிவடையாத நிலையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: טָמֵא הוּא
  choice: அது தீட்டுள்ளது
  rationale: லேவியராகமத் தூய்மைச் சட்டச் சூழலில் טמא சடங்குசார் அசுத்த நிலையைக் குறிக்கிறது; ‘தீட்டுள்ளது’ என்பது தமிழில் நிலைபெற்ற, புரிந்துகொள்ளக்கூடிய இணைச்சொல்.
- source_word: בָּאֵשׁ תִּשְׂרְפֶנּוּ
  choice: அதை நெருப்பில் எரித்துவிட வேண்டும்
  rationale: இரண்டாம் நபர் ஆண்பால் ஒருமை கட்டளையின் கடமையுணர்வையும் பொருளை முற்றிலும் அழிக்கும் செயலையும் இயல்பான சட்டத் தமிழில் தருகிறது.
- source_word: פְּחֶתֶת
  choice: அரித்தழிக்கும் பாதிப்பு
  rationale: இந்த அரிதான பெயர்ச்சொல் பொருளைச் சிதைக்கும் அல்லது அரிக்கும் தன்மையுள்ள சேதத்தைக் குறிக்கிறது; குறிப்பிட்ட நவீன பூஞ்சை நோயை ஊகிக்காமல் பொருளைத் தெரிவிக்கிறது.
- source_word: בְּקָרַחְתּוֹ אוֹ בְגַבַּחְתּוֹ
  choice: பொருளின் தேய்ந்த மேற்பரப்பிலோ அதன் வெளிப்புற மேற்பரப்பிலோ
  rationale: சொற்கள் வழுக்கைத்தலின் வேறுபட்ட பகுதிகளைச் சொற்சொல்லாகக் குறித்தாலும், துணி அல்லது தோல் சூழலில் அவை பொருளின் இரு மேற்பரப்புகள் அல்லது நிலைகளுக்கான உருவகப் பயன்பாடாகத் தெரிகின்றன. துல்லியமான வேறுபாடு உறுதியற்றதால் அடிக்குறிப்பில் ambiguity பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: טמא என்பதன் சடங்குசார் பொருள்
  choice: தீட்டுள்ளது
  alternative: அசுத்தமானது
  rationale: இவ்வசனம் ஒழுக்கக் குற்றத்தையோ மருத்துவத் தொற்றையோ நேரடியாக அறிவிப்பதில்லை; லேவியராகமச் சட்டத்தில் வகுக்கப்படும் சடங்குசார் நிலையைத் தெரிவிக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சட்டவிதிக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘நோய்ப்பட்ட பகுதி’, ‘பரிசோதிக்க வேண்டும்’, ‘தீட்டுள்ளது’ ஆகியவை பொதுவாசகர்களுக்குப் புரியும் வகையில் தேர்ந்தெடுக்கப்பட்டன. அரிதான பொருட்சேதச் சொற்களும் இறுதி உருவகச் சொற்றொடரும் மிகத் துல்லியமாகத் தீர்மானிக்கப்படாமல், அவற்றின் உண்மையான தெளிவின்மை அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளது.
