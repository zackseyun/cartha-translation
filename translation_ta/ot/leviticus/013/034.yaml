base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/034.yaml
  text: Then the priest shall examine the scaly infection on the seventh day[a], and if the scaly infection has not spread in the skin and its appearance is not deeper than the skin, the priest shall pronounce him clean[c][b]. He shall wash his clothes and be clean.
translation:
  language: ta
  text: ஏழாம் நாளில் ஆசாரியன் அந்தத் தோல் பாதிப்பைப் பரிசோதிக்க வேண்டும்.[a] அது தோலில் பரவவில்லை என்றும், அதன் தோற்றம் தோலைவிட ஆழமாக இல்லை என்றும் கண்டால்,[b] ஆசாரியன் அவரைத் தூய்மையானவர் என்று அறிவிக்க வேண்டும்.[c] அவர் தம் உடைகளைக் கழுவ வேண்டும்; அவர் தூய்மையானவராவார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய நெதெக் என்பது இச்சூழலில் தலை அல்லது தாடிப் பகுதியில் ஏற்படும் ஒரு குறிப்பிட்ட தோல் பாதிப்பைக் குறிக்கிறது. இதற்குச் சரியான நவீன மருத்துவப் பெயர் உறுதியாகத் தெரியவில்லை.
    reason: lexical_alternative
  - marker: b
    text: சொல்லர்த்தமாக, “தோலைவிட ஆழமாக இல்லை.” பாதிக்கப்பட்ட பகுதி சுற்றியுள்ள தோல் மட்டத்திற்குக் கீழே தாழ்ந்திருப்பதுபோல் தெரியவில்லை என்பதே ஆசாரிய ஆய்வுக்கான இந்த அளவுகோலின் பொருள்.
    reason: cultural_note
  - marker: c
    text: “தூய்மையானவர் என்று அறிவிக்க வேண்டும்” என்பது ஆசாரியன் அந்த நபரின் சடங்குசார் தூய்மை நிலையை அதிகாரபூர்வமாக அறிவிப்பதைக் குறிக்கிறது; அவர் அந்தத் தோல் பாதிப்பைக் குணப்படுத்துகிறார் என்று பொருளல்ல.
    reason: alternative_reading
lexical_decisions:
- source_word: נֶתֶק
  choice: தலையிலோ தாடியிலோ உண்டான தோல் பாதிப்பு
  rationale: இந்த எபிரெயச் சொல் லேவியராகமம் 13-இல் தலை அல்லது தாடிப் பகுதியில் ஆசாரியர் பரிசோதிக்கும் குறிப்பிட்ட தோல் பாதிப்பைக் குறிக்கிறது. துல்லியமான நவீன மருத்துவ நோயறிதலைப் புகுத்தாமல், சூழலைத் தெளிவுபடுத்த இந்தச் சொற்றொடர் பயன்படுத்தப்பட்டது.
- source_word: פָשָׂה
  choice: பரவாமல்
  rationale: இந்த நோயறிதல் சூழலில், பாதிப்பு தோலில் மேலும் விரிவடையாததைக் குறிக்கிறது.
- source_word: בָּעוֹר
  choice: தோலில்
  rationale: பாதிப்பு தோல் பகுதியில் பரவுவதை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: מַרְאֵהוּ
  choice: அதன் தோற்றம்
  rationale: பாதிக்கப்பட்ட பகுதியின் கண்ணுக்குத் தெரியும் நிலையைக் குறிக்கிறது.
- source_word: עָמֹק מִן הָעוֹר
  choice: தோலைவிட ஆழமாக
  rationale: சுற்றியுள்ள தோல் மட்டத்திற்குக் கீழே தாழ்ந்திருப்பதுபோல் தோன்றுகிறதா என்பதைச் சுட்டும் ஆசாரிய ஆய்வுக் கோவையை நெருக்கமாகப் பேணுகிறது.
- source_word: וְטִהַר אֹתוֹ הַכֹּהֵן
  choice: ஆசாரியன் அவரைத் தூயவர் என்று அறிவிக்க வேண்டும்
  rationale: ஆசாரியன் நோயைக் குணப்படுத்துகிறார் என்பதல்ல; சடங்குசார் தூய்மை நிலையை அதிகாரபூர்வமாகத் தீர்மானித்து அறிவிக்கிறார் என்பதைத் தெளிவாக்குகிறது.
- source_word: וְכִבֶּס בְּגָדָיו
  choice: அவர் தம் உடைகளைக் கழுவ வேண்டும்
  rationale: சடங்கில் செய்ய வேண்டிய செயலை நவீன, இயல்பான தமிழில் நேரடியாகக் கூறுகிறது.
- source_word: וְטָהֵר
  choice: அப்போது அவர் தூயவராவார்
  rationale: உடைகளைக் கழுவிய பின் ஏற்படும் தூய்மை நிலையை வெளிப்படுத்துகிறது; முன் வரும் அதிகாரபூர்வ அறிவிப்புக்கும் இதற்கும் உள்ள உரைநிலை வேறுபாட்டைப் பேணுகிறது.
- source_word: וְהִנֵּה
  choice: இருந்தால்
  rationale: சொல்லர்த்தத்தில் ‘இதோ’ என்றாலும், ஆய்வின்போது கண்டறியப்படும் நிபந்தனையை இங்கு அறிமுகப்படுத்துவதால் தமிழில் நிபந்தனை அமைப்பாக இயல்பாக மொழிபெயர்க்கப்பட்டது.
- source_word: וְרָאָה
  choice: பரிசோதிக்க வேண்டும்
  rationale: வெறுமனே பார்ப்பதைவிட அதிகாரபூர்வமான ஆசாரிய ஆய்வைச் சூழல் குறிக்கிறது.
theological_decisions:
- issue: தூய்மைச் சட்டத்தில் ஆசாரியரின் செயலின் தன்மை
  choice: ஆசாரியன் அவரைத் தூயவர் என்று அதிகாரபூர்வமாக அறிவிக்கிறார்.
  alternative: ஆசாரியன் அவரைத் தூய்மைப்படுத்துகிறார்.
  rationale: இந்தச் சட்டச் சூழலில் טהר என்பது மருத்துவக் குணப்படுத்தலையோ ஆசாரியரால் நிகழ்த்தப்படும் உள்ளார்ந்த மாற்றத்தையோ அல்ல, சடங்குசார் நிலை குறித்த தீர்ப்பைச் சுட்டுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், சட்டவிதிக்கேற்ற கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டது. நவீன மருத்துவ நோயறிதல் எதையும் உரைக்குள் திணிக்காமல், נתק என்பதன் தலை/தாடி சார்ந்த சூழல் தெளிவாக்கப்பட்டது. மரியாதை ஒருமையான ‘அவர்’ பயன்படுத்தப்பட்டுள்ளது; ‘தூயவர்’ என்பது இங்கு சடங்குசார் நிலையைச் சுட்டுகிறது.
