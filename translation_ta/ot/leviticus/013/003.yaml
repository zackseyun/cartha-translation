base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/003.yaml
  text: And the priest shall examine the diseased spot on the skin of the body[a], and if the hair in the spot has turned white and the appearance of the spot is deeper than the skin of his body, it is a diseased spot of skin disease; when the priest has examined him, he shall pronounce him unclean.
translation:
  language: ta
  text: ஆசாரியன் உடலின் தோலில் உள்ள பாதிப்பைப் பரிசோதிக்க வேண்டும். அந்தப் பாதிப்பிலுள்ள முடி வெண்மையாக மாறியிருந்தால், மேலும் அந்தப் பாதிப்பு உடலின் தோலைவிடப் பள்ளமாகத் தோன்றினால், அது சாராஅத் எனப்படும் தோல் பாதிப்பாகும்[a]. ஆசாரியன் அவரைப் பரிசோதித்தபின், அவரைத் தீட்டானவர் என்று அறிவிக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சாராஅத்” என்பது எபிரெயச் சொல். இது நவீன தொழுநோயை மட்டும் குறிக்காமல், தோல் பாதிப்புகளை உள்ளடக்கிய விரிவான பண்டைய வகையைக் குறிக்கிறது. மரபுவழியாக இது “தொழுநோய்” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶגַע
  choice: பாதிக்கப்பட்ட இடம்
  rationale: ஆசாரியன் பார்வையிட்டு ஆராயும் தோலின் குறிப்பிட்ட பாதிக்கப்பட்ட பகுதியைக் குறிக்கிறது; நோயின் தன்மையை அளவுக்கு மீறி மருத்துவ ரீதியாகத் தீர்மானிக்காமல் இயல்பான தமிழில் கூறுகிறது.
- source_word: בְּעוֹר הַבָּשָׂר
  choice: உடலின் தோலில்
  rationale: עוֹר என்பதன் ‘தோல்’ என்ற பொருளையும் בָּשָׂר என்பதன் உடல் சார்ந்த பொருளையும் நவீனத் தமிழில் இயல்பாகக் காக்கிறது.
- source_word: שֵׂעָר
  choice: முடி
  rationale: தோலில் வளரும் முடியைக் குறிக்கும் நேரடியான, இயல்பான தமிழ் இணைச்சொல்.
- source_word: הָפַךְ לָבָן
  choice: வெண்மையாக மாறியிருந்தால்
  rationale: ஆய்வின்போது காணப்படும் மாற்றத்தின் விளைவுநிலையைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: מַרְאֵה הַנֶּגַע עָמֹק מֵעוֹר בְּשָׂרוֹ
  choice: பாதிக்கப்பட்ட இடம் உடலின் தோலைவிடப் பள்ளமாகத் தோன்றினால்
  rationale: מַרְאֵה-யின் தோற்றம் சார்ந்த நுணுக்கத்தையும், சுற்றியுள்ள தோல் மட்டத்திற்குக் கீழாகத் தோன்றும் நிலையைச் சுட்டும் ஒப்பீட்டையும் இயல்பாகக் காக்கிறது.
- source_word: נֶגַע צָרַעַת
  choice: சாராஅத் எனப்படும் தோல் பாதிப்பு
  rationale: צָרַעַת-ஐ நவீன தொழுநோயோடு தவறாக ஒப்பிடாமல் எபிரெயச் சொல்லின் தனித்துவத்தைப் பாதுகாக்கிறது; נֶגַע-ஐ ‘தோல் பாதிப்பு’ என்று சூழலுக்கேற்ப வெளிப்படுத்துகிறது.
- source_word: וְרָאָהוּ
  choice: ஆசாரியன் அவரை ஆராய்ந்த பின்பு
  rationale: சூழலில் பின்னொட்டு ஆராயப்படுகிற நபரைக் குறிக்கிறது; பார்வையிடுதலைவிட நோக்கமுள்ள ஆய்வை ‘ஆராய்ந்த’ என்பது தெளிவாகச் சொல்கிறது.
- source_word: וְטִמֵּא אֹתוֹ
  choice: அவரைத் தீட்டுள்ளவர் என்று அறிவிக்க வேண்டும்
  rationale: ஆசாரியன் தீட்டை உண்டாக்குகிறார் என்று கூறாமல், சடங்கு சார்ந்த நிலையை அதிகாரபூர்வமாக அறிவிக்கிறார் என்பதைக் காட்டுகிறது.
theological_decisions:
- issue: லேவியத் தூய்மைச் சட்டத்தில் צָרַעַת என்பதன் பொருள்
  choice: சாராஅத் எனப்படும் தோல் பாதிப்பு
  alternative: தொழுநோய்; தோல் நோய்
  rationale: இந்த எபிரெயச் சொல் நவீன ஹான்சன் நோயைவிட விரிவான பண்டைய சடங்கு வகைப்பாட்டைக் குறிக்கிறது. ஒலிபெயர்ப்புடன் விளக்கச் சொல் சேர்ப்பது தவறான மருத்துவத் துல்லியத்தைத் தவிர்த்து மூலத்தின் தனித்துவத்தைப் பாதுகாக்கிறது.
- issue: וְטִמֵּא אֹתוֹ என்பதில் ஆசாரியனின் செயலின் தன்மை
  choice: தீட்டுள்ளவர் என்று அறிவிக்க வேண்டும்
  alternative: தீட்டுள்ளவராக்க வேண்டும்; தீட்டுள்ளவர் என்று தீர்ப்பளிக்க வேண்டும்
  rationale: ஆசாரியன் அந்த நபருக்குத் தீட்டை ஏற்படுத்துவதாக அல்லாமல், ஆய்வின் அடிப்படையில் அவரது சடங்கு நிலையை அறிவிப்பதாக உரை காட்டுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்ட மற்றும் ஆசாரிய ஆய்வுச் சூழலுக்கேற்ற கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘தீட்டு’ என்பது உடல் அழுக்கையல்ல, லேவியச் சட்டத்தின் சடங்கு நிலையைச் சுட்டுகிறது. மூலத்தின் நிபந்தனை அமைப்பு தமிழில் தெளிவாகப் பிரிக்கப்பட்டுள்ளது.
