revisions:
- from: ஆசாரியன் அவனைப் பரிசோதிக்க வேண்டும். இதோ, அவனுடைய பின்தலை வழுக்கையிலோ முன்தலை வழுக்கையிலோ[a] நோய்ப்புண்ணின் வீக்கம் சிவப்பு கலந்த வெண்மையாக இருந்து, உடலின் தோலில் தோன்றும் தோல் நோயைப்[b] போலக் காணப்பட்டால்,
