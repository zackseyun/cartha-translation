base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/043.yaml
  text: and the priest examines him, and behold, the swelling of the disease is whitish-red on his bald head or on his bald forehead, like the appearance of a skin disease on the flesh,
translation:
  language: ta
  text: ஆசாரியன் அவனைப் பரிசோதிக்கும்போது, இதோ, பாதிப்பின் வீக்கம் சிவப்பு கலந்த வெண்மையாக, அவனுடைய தலையின் பின்புற வழுக்கையிலோ அல்லது முன்புற வழுக்கையிலோ[a], உடலின் தோலில் ஏற்படும் தோல் நோயின்[b] தோற்றத்தைப் போல இருந்தால்,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு பயன்படுத்தப்பட்டுள்ள இரு எபிரெயச் சொற்களும் தலையின் பின்புற வழுக்கையையும் முன்புற வழுக்கையையும் வேறுபடுத்திக் காட்டுவதாகத் தெரிகிறது.
    reason: cultural_note
  - marker: b
    text: இங்கு ‘தோல் நோய்’ என மொழிபெயர்க்கப்பட்டுள்ள எபிரெயச் சொல் צָרַעַת (ட்சாராஅத்) பாரம்பரியமாக ‘தொழுநோய்’ என வழங்கப்படுகிறது. ஆனால் லேவியராகமத்தில் அது ஹான்சன் நோயை மட்டும் அல்லாமல் பலவகையான கடுமையான தோல் பாதிப்புகளைக் குறிக்கும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה אֹתוֹ הַכֹּהֵן
  choice: ஆசாரியன் அவனைப் பரிசோதிக்க வேண்டும்
  rationale: ראה என்பதன் அடிப்படைப் பொருள் ‘பார்’ என்றாலும், லேவியராகமம் 13-இன் ஆசாரிய ஆய்வுச் சூழலில் ‘பரிசோதித்தல்’ என்பதே செயல்பாட்டைத் தெளிவாகக் காட்டுகிறது. எபிரெய சட்டநடையின் விதிமுறைத் தன்மையை ‘வேண்டும்’ வெளிப்படுத்துகிறது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: ஆசாரியன் கண்டறியும் நிலையைச் சுட்டிக்காட்டும் எபிரெய இடைச்சொல்லின் கவன ஈர்ப்பு வலிமையைப் பாதுகாக்கிறது.
- source_word: שְׂאֵת הַנֶּגַע
  choice: நோய்ப்புண்ணின் வீக்கம்
  rationale: שְׂאֵת என்பது உயர்ந்த வீக்கம் அல்லது புடைப்பைக் குறிக்கிறது; נֶגַע இங்கு பரிசோதிக்கப்படும் பாதிப்பு அல்லது நோய்ப்புண்ணைக் குறிக்கிறது. ‘நோய்ப்புண்ணின் வீக்கம்’ இயல்பாகவும் மருத்துவத் தீர்மானத்தை மிகைப்படுத்தாமலும் உள்ளது.
- source_word: לְבָנָה אֲדַמְדֶּמֶת
  choice: சிவப்பு கலந்த வெண்மையாக
  rationale: לְבָנָה முதன்மையாக வெண்மையையும் אֲדַמְדֶּמֶת சிவப்புத் தோற்றத்தையும் குறிக்கின்றன. இரு நிறக்கூறுகளையும் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: בְּקָרַחְתּוֹ אוֹ בְגַבַּחְתּוֹ
  choice: அவனுடைய பின்தலை வழுக்கையிலோ முன்தலை வழுக்கையிலோ
  rationale: இரு எபிரெயச் சொற்களும் முறையே தலையின் பின்புற மற்றும் முன்புற வழுக்கைப் பகுதிகளைக் குறிக்கும் சாத்தியமுள்ள வேறுபாட்டைப் பாதுகாக்கின்றன.
- source_word: כְּמַרְאֵה צָרַעַת עוֹר בָּשָׂר
  choice: உடலின் தோலில் தோன்றும் தோல் நோயைப் போலக் காணப்பட்டால்
  rationale: כְּמַרְאֵה என்பதன் ஒப்பீட்டு, தோற்றம் சார்ந்த தன்மையை ‘போலக் காணப்பட்டால்’ காக்கிறது. צָרַעַת என்பதை நவீன ஹான்சன் நோயாக மட்டும் சுருக்காமல் ‘தோல் நோய்’ என வழங்குகிறது; עוֹר בָּשָׂר என்பதன் உடல்-தோல் குறிப்பும் வெளிப்படுகிறது.
theological_decisions:
- issue: צָרַעַת என்ற சொல்லின் நோய் அடையாளம்
  choice: தோல் நோய்
  alternative: தொழுநோய்
  rationale: லேவியராகமத்தில் צָרַעַת என்பது ஹான்சன் நோயை மட்டும் குறிக்காமல் பலவகையான கடுமையான தோல் பாதிப்புகளை உள்ளடக்கும் விரிவான வகைப்பாடு. ஆகவே குறிப்பிட்ட நவீன நோயறிதலை உரையில் திணிக்கவில்லை.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், சட்டவிதி மற்றும் ஆசாரிய ஆய்வு ஆகியவற்றுக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. வசனம் அடுத்த வசனத்தில் முடியும் நிபந்தனை வாக்கியத்தின் பகுதியாக இருப்பதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது. ‘பின்தலை வழுக்கை/முன்தலை வழுக்கை’ என்ற இணைச்சொற்கள் மூலத்தின் வேறுபாட்டை சாதாரண வாசகருக்குப் புரியும் வகையில் காக்கின்றன.
