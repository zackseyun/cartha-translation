  yaml_path: translation/ot/leviticus/013/011.yaml
  text: it is a chronic skin disease in the skin of his body[a], and the priest shall pronounce him unclean; he shall not isolate him, for he is unclean.
translation:
  language: ta
  text: அது அவனுடைய உடலின் தோலில் உள்ள நாட்பட்ட தோல் நோய்[a]. ஆசாரியன் அவனைத் தீட்டானவன் என்று அறிவிக்க வேண்டும். ஆசாரியன் அவனைத் தனிமைப்படுத்தக் கூடாது; ஏனெனில் அவன் தீட்டானவன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீண்டகாலமாக இருக்கும் தோல் நோய்.” பாரம்பரிய மொழிபெயர்ப்புகள் צָרַעַת என்ற சொல்லை அடிக்கடி “தொழுநோய்” என்று மொழிபெயர்க்கின்றன. ஆனால் லேவியராகமத்தில் இச்சொல் நவீன தொழுநோயைவிடப் பரந்த பலவகையான தோல் பாதிப்புகளைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: צָרַעַת
  choice: தோல் நோய்
  rationale: லேவியராகமத்தில் இச்சொல் நவீன மருத்துவத்தில் ‘தொழுநோய்’ எனப்படும் ஹான்சன் நோயை மட்டும் குறிக்காமல், பலவகையான கடுமையான தோல் பாதிப்புகளை உள்ளடக்குகிறது. ஆகவே தேவையற்ற மருத்துவத் துல்லியத்தைத் தவிர்த்து இயல்பான பொதுப்பெயர் பயன்படுத்தப்பட்டுள்ளது.
- source_word: נוֹשֶׁנֶת
  choice: நீண்டகாலமாக இருக்கும்
  rationale: இது பழையதாக அல்லது நெடுங்காலமாக நிலைத்திருக்கும் பாதிப்பைக் குறிக்கிறது. ‘நாட்பட்ட’ என்பதும் சாத்தியம்; ஆனால் இத்தொடர் சாதாரண வாசகர்களுக்கு இன்னும் நேரடியாகப் புரியும்.
- source_word: בְּעוֹר בְּשָׂרוֹ
  choice: அவனுடைய உடலின் தோலில்
  rationale: ‘அவனுடைய சதையின் தோலில்’ என்ற சொற்சொல் வடிவத்தைவிட, உடல் சார்ந்த இச்சூழலில் இது இயல்பான நவீனத் தமிழாகவும் எபிரெயச் சொல்லமைப்புக்கு நெருக்கமாகவும் உள்ளது.
- source_word: וְטִמְּאוֹ
  choice: அவனைத் தீட்டுள்ளவன் என்று அறிவிக்க வேண்டும்
  rationale: ஆசாரியன் அவனைத் தீட்டுள்ளவனாக ஆக்குவதில்லை; சடங்கு-சட்ட நிலையைக் கண்டறிந்து அதிகாரபூர்வமாக அறிவிக்கிறார். அதனால் ‘அறிவிக்க வேண்டும்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: הַכֹּהֵן
  choice: ஆசாரியன்
  rationale: இஸ்ரவேலின் வழிபாட்டு அலுவலைக் குறிக்கும் வழக்கமான, தெளிவான தமிழ்ச் சொல்.
- source_word: לֹא יַסְגִּרֶנּוּ
  choice: அவனைத் தனிமைப்படுத்த வேண்டாம்
  rationale: கவனிப்புக்காக ஒருவரைத் தனியே வைப்பதைக் குறிக்கிறது. ‘அடைத்துவைக்க’ என்பதைவிட இது இயல்பானது; ‘தனிமைப்படுத்தல்’ நவீன மருத்துவ நடைமுறையை அளவுக்கு மீறி இறக்குமதி செய்யாமல் செயலின் பொருளைத் தெரிவிக்கிறது.
- source_word: כִּי טָמֵא הוּא
  choice: ஏனெனில் அவன் தீட்டுள்ளவன்
  rationale: மேலும் தனிமைப்படுத்தி ஆராய வேண்டியதில்லை என்பதற்கான காரணத்தை நேரடியாகக் கூறும் வாக்கியம்.
theological_decisions:
- issue: சடங்கு சார்ந்த טמא என்ற சொல்லின் மொழிபெயர்ப்பு
  choice: தீட்டுள்ளவன்
  alternative: அசுத்தமானவன்
  rationale: இங்கு தனிப்பட்ட ஒழுக்கக் குற்றம் சாட்டப்படவில்லை; சடங்கு-சட்ட நிலையே குறிக்கப்படுகிறது. ‘தீட்டுள்ளவன்’ என்பது வேதாகமத் தமிழில் அறியப்பட்ட சொல்லாக இருந்து அந்த வேறுபாட்டைப் பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் dignified நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. சடங்கு சார்ந்த சட்ட மொழிக்காக ‘ஆசாரியன்’, ‘தீட்டுள்ளவன்’ ஆகிய நிலையான சொற்கள் பேணப்பட்டுள்ளன; நோயின் தன்மையை நவீன மருத்துவ நோயறிதலாகக் குறுக்காமல் மூலத்தின் பரப்பும் தெளிவின்மையும் காக்கப்பட்டுள்ளன.
