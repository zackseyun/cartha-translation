revisions:
- from: அது அவனுடைய உடலின் தோலில் நீண்டகாலமாக இருக்கும் தோல் நோய்[a]. ஆசாரியன் அவனைத் தீட்டுள்ளவன் என்று அறிவிக்க வேண்டும். அவனைத் தனிமைப்படுத்த வேண்டாம்; ஏனெனில் அவன் தீட்டுள்ளவன்.
  to: அது அவனுடைய உடலின் தோலில் உள்ள நாட்பட்ட தோல் நோய்[a]. ஆசாரியன் அவனைத் தீட்டானவன் என்று அறிவிக்க வேண்டும். ஆசாரியன் அவனைத் தனிமைப்படுத்தக் கூடாது; ஏனெனில் அவன் தீட்டானவன்.
