base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/007.yaml
  text: But if the scaly eruption indeed spreads on the skin after he has shown himself to the priest for his cleansing[c][b][a], then he shall appear before the priest a second time.
translation:
  language: ta
  text: ஆனால், தன் தூய்மைக்காக அவர் ஆசாரியரிடம் தம்மைக் காட்டிய பிறகு அந்தத் தோல் பாதிப்பு[a] தோலில் நிச்சயமாகப் பரவினால்,[b] அவர் இரண்டாவது முறையாக ஆசாரியரிடம் ஆஜராக வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தோல் பாதிப்பு’ என்பதற்கு ‘சொறி,’ ‘தடிப்பு’ அல்லது மரபாக ‘பொருக்கு’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் பரிசோதனைக்கு உட்படுத்தப்படும் மேலோட்டமான தோல் நிலையைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: 'எபிரெய மொழியில் வினைச்சொல் வலியுறுத்தப்பட்டுள்ளது: ‘நிச்சயமாகப் பரவினால்.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּשֹׂה תִפְשֶׂה
  choice: நிச்சயமாகப் பரவினால்
  rationale: வினையெச்ச மூலவடிவமும் முற்றுப்பெறா வினையும் இணைந்து பரவுதலை வலியுறுத்துகின்றன; ‘நிச்சயமாக’ அந்த வலியுறுத்தலை இயல்பான தமிழில் காக்கிறது.
- source_word: הַמִּסְפַּחַת
  choice: அந்தத் தோல் வெடிப்பு
  rationale: இச்சொல் ஆசாரியர் பரிசோதிக்கும் மேலோட்டமான தோல் பாதிப்பைக் குறிக்கிறது. நவீன தமிழில் ‘தோல் வெடிப்பு’ பொதுவாகப் புரியக்கூடியது; ‘பொருக்கு’ என்பது ஆறிவரும் காயத்தைக் குறிக்கும் தவறான எண்ணத்தைத் தரலாம்.
- source_word: בָּעוֹר
  choice: தோலில்
  rationale: எபிரெயச் சொற்றொடர் பாதிப்பு இருக்கும் இடத்தைக் குறிக்கிறது; வெளிப்படையான உடைமைச் சுட்டு இல்லாததால் ‘அவருடைய தோலில்’ என விரிவாக்கப்படவில்லை.
- source_word: אַחֲרֵי הֵרָאֹתוֹ
  choice: அவர் தம்மை ... காட்டிய பிறகு
  rationale: ஆசாரியப் பரிசோதனைக்காக ஒருவர் தம்மை முன்வைப்பதை இச்சூழலில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: אֶל הַכֹּהֵן
  choice: ஆசாரியரிடம்
  rationale: பரிசோதிக்கும் ஆசாரியரிடம் சென்று தம்மை முன்வைப்பதை இயல்பான தமிழில் குறிக்கிறது.
- source_word: לְטָהֳרָתוֹ
  choice: தம்மைத் தூயவர் என்று அறிவிக்கும்படி
  rationale: லேவியராகமம் 13-இன் சூழலில் இது வெறுமனே சுத்தப்படுத்தும் செயலைவிட, பரிசோதனையின் மூலம் சடங்குமுறைத் தூய்மை உடையவர் என அறிவிக்கப்படுவதை நோக்கமாகக் கொண்டுள்ளது.
- source_word: וְנִרְאָה שֵׁנִית
  choice: அவர் இரண்டாவது முறையாக ... ஆஜராக வேண்டும்
  rationale: சட்டவிதிச் சூழலில் மறுபடியும் பரிசோதனைக்கு முன்வர வேண்டிய கட்டாயத்தைத் தெளிவாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: לְטָהֳרָתוֹ என்பதன் சடங்குமுறைப் பொருள்
  choice: தம்மைத் தூயவர் என்று அறிவிக்கும்படி
  alternative: தம்மைத் தூய்மைப்படுத்திக்கொள்ளும்படி
  rationale: இப்பகுதியில் ஆசாரியர் நோயைக் குணப்படுத்துவதோ ஒழுக்கத் தூய்மையை அளிப்பதோ அல்ல; பரிசோதித்து சடங்குமுறைப்படி தூயவர் என அறிவிக்கிறார். ஆகவே அறிவிப்புச் சார்ந்த பொருள் வெளிப்படுத்தப்பட்டது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், சட்டவிதிக்குரிய கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘ஆசாரியர்,’ ‘தூயவர்’ ஆகியவை லேவியராகமத்தின் சடங்குமுறைச் சூழலைத் தெளிவாக வைத்திருக்கின்றன; மருத்துவ அல்லது ஒழுக்கத் தீர்ப்பை தேவையின்றி சேர்க்கவில்லை.
