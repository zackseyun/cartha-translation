  text: அல்லது, ஒருவருடைய உடலின் தோலில் நெருப்பால் ஏற்பட்ட தீக்காயம் இருந்து, அந்தத் தீக்காயத்தின் பச்சைச் சதை வெண்மையோடு சிவப்பு கலந்த அல்லது வெண்மையான ஒளிரும் புள்ளியாக மாறினால்,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பச்சைச் சதை’ என்பது தீக்காயப் பகுதியில் காணப்படும் உயிருள்ள சதையையோ வெளிப்பட்ட உயிருள்ள திசுவையோ குறிக்கும் எபிரெயச் சொற்றொடரின் மொழிபெயர்ப்பு.
