lexical_decisions:
- source_word: אוֹ
  choice: அல்லது
  rationale: சட்ட அறிவுறுத்தலில் மற்றொரு நிலையை அறிமுகப்படுத்தும் பிரிநிலைச் சொல்லாக உள்ளது; தமிழில் ‘அல்லது’ இயல்பாக இதைப் பேணுகிறது.
- source_word: בָשָׂר
  choice: ஒருவருடைய உடல்
  rationale: அடிப்படைப் பொருள் ‘சதை’ என்றாலும், இங்கு தோலில் ஏற்பட்ட பாதிப்புக்குரிய மனித உடலைக் குறிக்கிறது; நவீனத் தமிழில் ‘ஒருவருடைய உடல்’ தெளிவானது.
- source_word: בְּעֹרוֹ
  choice: தோலில்
  rationale: பாதிக்கப்பட்ட நபரின் தோலில் ஏற்படும் நிலையை இயல்பான தமிழில் குறிக்கிறது.
- source_word: מִכְוַת אֵשׁ
  choice: நெருப்பினால் ஏற்பட்ட தீக்காயம்
  rationale: நெருப்பால் உண்டான தீக்காயம் என்ற காரணப் பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: מִחְיַת הַמִּכְוָה
  choice: அந்தத் தீக்காயத்தின் பச்சைச் சதை
  rationale: தீக்காயப் பகுதியில் காணப்படும் உயிருள்ள அல்லது ஆறாத வெளிப்பட்ட திசுவைக் குறிக்கும் எபிரெய வெளிப்பாட்டை, பொதுவாகப் புரியும் மருத்துவச் சூழல் சொல்லால் தருகிறது.
- source_word: בַּהֶרֶת
  choice: பளபளப்பான தழும்பு
  rationale: தோலில் தெளிவாகத் தெரியும் ஒளிர்ந்த நிறப்பகுதியைக் குறிக்கிறது; ‘தழும்பு’ இச்சூழலில் இயல்பான தமிழ்.
- source_word: לְבָנָה אֲדַמְדֶּמֶת
  choice: சிவப்புகலந்த வெண்ணிறமான
  rationale: வெண்மையோடு சிவப்பு கலந்த நிறத்தை, நிறங்களின் கலப்பைத் தீர்மானிக்காமல் இயல்பாகக் காட்டுகிறது.
- source_word: אוֹ לְבָנָה
  choice: அல்லது வெண்ணிறமான
  rationale: மாற்று நிற விவரிப்பை அப்படியே பேணுகிறது.
