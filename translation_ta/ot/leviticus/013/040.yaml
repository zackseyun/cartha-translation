source:
  edition: WLC
  text: וְ/אִ֕ישׁ כִּ֥י יִמָּרֵ֖ט רֹאשׁ֑/וֹ קֵרֵ֥חַ ה֖וּא טָה֥וֹר הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/040.yaml
  text: If a man loses the hair of his head[a], he is bald; he is clean.
translation:
  language: ta
  text: ஒரு மனிதனின் தலைமுடி உதிர்ந்தால்[a], அவன் வழுக்கைத் தலையுள்ளவன்; அவன் சுத்தமானவன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒரு மனிதனின் தலை வழுக்கையானால்.” எபிரெய வினை முடி நீங்கி தலை வெறுமையாவதைக் குறிக்கலாம்; முதன்மை உரை, அடுத்து வரும் “வழுக்கைத் தலையுள்ளவன்” என்பதிலிருந்து வினைச்சொல்லின் கருத்தை வேறுபடுத்திக் காட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ
  choice: ஒரு மனிதன்
  rationale: ஆண்பால் ஒருமைச் சொல்லையும், உடல்நிலை குறித்த இந்த வழக்கின் இயல்பான குறிப்பையும் துல்லியமாகப் பிரதிபலிக்கிறது.
- source_word: כִּי
  choice: -ஆல்
  rationale: சட்ட/ஆய்வுச் சூழலில் நிபந்தனையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: יִמָּרֵט רֹאשׁוֹ
  choice: அவனின் தலைமுடி உதிர்ந்துவிட்டால்
  rationale: முடி நீங்கி தலை வெறுமையாதல் என்ற வினைக் கருத்தைத் தெரிவிக்கிறது; அதற்கான காரணத்தை தேவையின்றி குறிப்பதில்லை. அடுத்து வரும் ‘வழுக்கைத்தலையன்’ என்ற நிலைப்பெயரையும் தனியே வைத்திருக்கிறது.
- source_word: קֵרֵחַ
  choice: வழுக்கைத்தலையன்
  rationale: முடி உதிர்ந்ததன் விளைவான நிலையைத் தெளிவாகவும் இயல்பாகவும் கூறுகிறது.
- source_word: טָהוֹר
  choice: தூய்மையானவன்
  rationale: லேவியராகமம் 13-இன் சடங்குசார் ஆய்வுச் சூழலில் தீட்டற்ற நிலையைச் சுட்டுகிறது; ஒழுக்கக் குற்றமின்மையை அல்ல.
- source_word: הוּא ... הוּא
  choice: அவன் ... அவன் ...
  rationale: 'எபிரெய மொழியின் இரு தனித்த வலியுறுத்தல் கூற்றுகளையும் தமிழில் காக்கிறது: அவன் வழுக்கைத்தலையன்; அவன் தூய்மையானவன்.'
theological_decisions:
- issue: லேவியராகமத்தின் தீட்டு விதிகளில் טָהוֹר என்பதன் சடங்குசார் நிலை
  choice: தூய்மையானவன்
  alternative: சுத்தமானவன் / தீட்டற்றவன்
  rationale: இது தோல் நோய் ஆய்வின் அடிப்படையில் நிர்ணயிக்கப்படும் சடங்குசார் நிலை; ஒழுக்கத் தூய்மையைப் பற்றிய தீர்ப்பு அல்ல. ‘தூய்மையானவன்’ முக்கிய சொல்லின் தொடர்ச்சியைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சட்டவிதியின் சுருக்கத்தையும் கண்ணியமான தொனியையும் காக்கும் நடை. ‘தலைமுடி உதிர்தல்’ இயல்பான தமிழாகவும், காரணத்தை மிகைப்படுத்தாமல் எபிரெய வினையின் பரப்பைத் தக்கவைக்கும் வகையிலும் உள்ளது.
