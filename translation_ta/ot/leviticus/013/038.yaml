  register: நவீன நிலையான தமிழில், லேவியராகமத்தின் வழக்கு/நோயறிதல் நடைக்கு ஏற்ற கண்ணியமான நிபந்தனை வாக்கியமாக வடிவமைக்கப்பட்டது. மூல உரையின் ‘புள்ளிகள் ... புள்ளிகள்’ என்ற மீளுரைத்தல் திட்டமிட்டுப் பாதுகாக்கப்பட்டது.
