  text: וְ/אִישׁ֙ אֽוֹ אִשָּׁ֔ה כִּֽי יִהְיֶ֥ה בְ/עוֹר בְּשָׂרָ֖/ם בֶּהָרֹ֑ת בֶּהָרֹ֖ת לְבָנֹֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/038.yaml
  text: And if a man or a woman has bright spots on the skin of the body[a], white bright spots,
translation:
  language: ta
  text: ஒரு ஆணுக்கோ பெண்ணுக்கோ உடலின் தோலில் வெளிர்ந்த புள்ளிகள், வெள்ளையான வெளிர்ந்த புள்ளிகள் இருந்தால்,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אִישׁ ... אִשָּׁה
  choice: ஒரு ஆணுக்கோ பெண்ணுக்கோ
  rationale: இரு பாலினங்களையும் மூல உரை வெளிப்படையாகக் குறிப்பிடுகிறது; ‘-க்கோ ... -க்கோ’ என்பது மாற்று நிலையை இயல்பான நவீனத் தமிழில் காட்டுகிறது.
- source_word: כִּי יִהְיֶה
  choice: இருந்தால்
  rationale: சட்ட/நோயறிதல் சூழலில் כִּי நிபந்தனையை அறிமுகப்படுத்துகிறது; தமிழில் ‘இருந்தால்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: בְּעוֹר בְּשָׂרָם
  choice: உடலின் தோலில்
  rationale: עוֹר என்பதன் பொருள் ‘தோல்’; இங்கு בָּשָׂר என்பது உடலைக் குறிக்கிறது. இந்தச் சொற்றொடர் உடல்சார்ந்த குறிப்பைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: בֶּהָרֹת
  choice: பளிச்சிடும் புள்ளிகள்
  rationale: நோயறிதல் சூழலில் தோலில் காணப்படும் ஒளிர்ந்த அல்லது வெளிர்ந்த அடையாளங்களை இச்சொல் குறிக்கிறது; ‘பளிச்சிடும் புள்ளிகள்’ அதன் காட்சித் தன்மையைப் பாதுகாக்கிறது.
- source_word: בֶּהָרֹת לְבָנֹת
  choice: வெண்மையான பளிச்சிடும் புள்ளிகள்
  rationale: לְבָנֹת அந்தப் புள்ளிகள் வெள்ளை நிறமுடையவை எனக் குறிப்பிடுகிறது; பெயர்ச்சொல் மீண்டும் வருவதைப் பாதுகாப்பதால் எபிரெய உரையின் வலியுறுத்தலும் நோயறிதல் துல்லியமும் நிலைக்கின்றன.
