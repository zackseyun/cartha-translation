  text: And if the priest examines the diseased area of the scaly outbreak[a], and indeed its appearance is not deeper than the skin and there is no black hair in it, then the priest shall isolate the diseased area of the scaly outbreak for seven days.
translation:
  language: ta
  text: ஆசாரியன் செதில் படர்வு[a] உள்ள பாதிக்கப்பட்ட பகுதியை ஆராயும்போது, அதன் தோற்றம் தோலைவிடப் பள்ளமாக இல்லாமலும் அதில் கருப்பு முடி இல்லாமலும் இருந்தால், ஆசாரியன் செதில் படர்வு உள்ள அந்தப் பாதிக்கப்பட்ட பகுதியை ஏழு நாட்களுக்குத் தனிமைப்படுத்த வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “செதில் படர்வு” என்பதற்கான எபிரெயச் சொல் נֶתֶק, இவ்வதிகாரத்தில் தலை அல்லது தாடிப் பகுதியில் முடி உதிர்வுடன் தொடர்புடைய ஒரு குறிப்பிட்ட தோல் நிலையைக் குறிக்கிறது. இதை “அரிப்பு” அல்லது “பொடுகு போன்ற படர்வு” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶגַע
  choice: பாதிக்கப்பட்ட பகுதி
  rationale: இச்சூழலில் காணக்கூடிய நோய்க்குறி உள்ள இடத்தைக் குறிக்கிறது; நவீன தமிழில் நடுநிலையாகவும் தெளிவாகவும் உள்ளது.
- source_word: נֶתֶק
  choice: பொடுகுப் படர்வு
  rationale: முடி உதிர்வுடன் தொடர்புடைய தலை அல்லது தாடிப் பகுதியில் ஏற்படும் தனிப்பட்ட தோல் நிலையை வாசகருக்குப் புரியுமாறு குறிக்கிறது; எபிரெயச் சொல்லின் துல்லியமான மருத்துவ அடையாளம் உறுதியற்றதால் மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: מַרְאֵהוּ עָמֹק מִן־הָעוֹר
  choice: அது தோலைவிடப் பள்ளமாகத் தோன்றாமலும்
  rationale: காயத்தின் தோற்றம் தோல் மட்டத்திற்குக் கீழே இருப்பதுபோல் காணப்படுகிறதா என்ற ஒப்பீட்டை இயல்பான தமிழில் காக்கிறது.
- source_word: שֵׂעָר שָׁחֹר
  choice: கருமையான முடி
  rationale: ஆய்வுக்குரிய அடையாளமாகக் கூறப்படும் முடியின் கருநிறத்தை நேரடியாக வெளிப்படுத்துகிறது.
- source_word: וְהִסְגִּיר
  choice: தனிமைப்படுத்த வேண்டும்
  rationale: கவனிப்புக்காகத் தற்காலிகமாகப் பிரித்து வைக்கும் சட்டச் செயலைத் தெளிவாகக் குறிக்கிறது; நவீன தொற்றுநோய் சார்ந்த மிகக் குறுகிய பொருளைத் தவிர்க்கிறது.
- source_word: שִׁבְעַת יָמִים
  choice: ஏழு நாட்களுக்கு
  rationale: தனிமைப்படுத்தும் கால அளவை இயல்பான தமிழில் தருகிறது.
- source_word: וְכִי יִרְאֶה
  choice: ஆசாரியன் ... ஆராயும்போது
  rationale: எபிரெயத்தின் தொடர்ச்சியான நிபந்தனைச் சட்ட அமைப்பை தமிழில் இயல்பான கால-நிபந்தனை வாக்கியமாக வழங்குகிறது; 'பார்த்தல்' இங்கு முறைப்படியான ஆய்வைக் குறிக்கிறது.
