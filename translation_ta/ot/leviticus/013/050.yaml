revisions:
- from: ஆசாரியன் பாதிக்கப்பட்ட பகுதியை ஆராய்ந்து பார்த்து, அந்தப் பகுதியை ஏழு நாட்களுக்குத் தனிமைப்படுத்தி வைக்க வேண்டும்.[a]
  to: ஆசாரியன் அந்தப் பாதிப்புள்ள பொருளை ஆராய்வான்; அதை ஏழு நாட்களுக்குத் தனியே அடைத்து வைப்பான்.[a]
  rationale: The revision makes explicit the contextually implied affected article, avoiding the misleading notion that an abstract 'area' itself is isolated. It retains the source’s deliberate lack of a modern diagnostic label, preserves the seven-day duration, and uses coordinated Tamil finite verbs to reflect the Hebrew procedural sequence.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T09:16:04Z'
review_pass:
  verdict: revise
  source_fidelity: 'The Hebrew uses the same term, נגע, twice: the priest examines the affected mark/condition and then places the affected item under temporary confinement for seven days. In this immediate garment context, rendering the object merely as an isolated ''area'' is potentially misleading, since what is set aside is the affected article/item, not a physical portion detached from it.'
  naturalness: 'The draft is generally clear modern Tamil, but ''அந்தப் பகுதியை ... தனிமைப்படுத்தி வைக்க'' is unnatural and conceptually imprecise: a ''part/area'' is not ordinarily placed in isolation. A finite legal-procedural construction is smoother than the subordinate ''ஆராய்ந்து பார்த்து ... வைக்க வேண்டும்.'''
  terminology: '''ஆசாரியன்'' is appropriate. ''பாதிப்புள்ள பொருள்'' faithfully avoids assigning a modern disease category while fitting the garment-setting of Leviticus 13:47–59. ''தனியே அடைத்து வைப்பான்'' conveys the temporary confinement denoted by the Hiphil of סגר without importing a specific modern medical classification.'
  issues:
  - severity: medium
    issue: The draft says the priest isolates 'that area' (அந்தப் பகுதியை).
    rationale: The Hebrew technically repeats 'the affected mark/condition,' but in this context the priest confines the affected garment/article for observation. Tamil 'பகுதியைத் தனிமைப்படுத்தி வைக்க' both sounds unnatural and may imply that only a section is physically separated.
  - severity: low
    issue: The first verbal action is subordinated in 'ஆராய்ந்து பார்த்து,' whereas the Hebrew presents two coordinated procedural actions.
    rationale: This does not materially alter meaning, but two finite verbs better preserve the legal sequence and produce a more direct translation.
  revised_text: ஆசாரியன் அந்தப் பாதிப்புள்ள பொருளை ஆராய்வான்; அதை ஏழு நாட்களுக்குத் தனியே அடைத்து வைப்பான்.[a]
  revised_footnotes:
  - marker: a
    text: “தனிமைப்படுத்தி வைப்பான்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல், கண்காணிப்பதற்காகப் பாதிப்புள்ள பொருளைத் தற்காலிகமாகத் தனியே வைத்தலைக் குறிக்கிறது.
    reason: lexical_alternative
  revision_rationale: The revision makes explicit the contextually implied affected article, avoiding the misleading notion that an abstract 'area' itself is isolated. It retains the source’s deliberate lack of a modern diagnostic label, preserves the seven-day duration, and uses coordinated Tamil finite verbs to reflect the Hebrew procedural sequence.
