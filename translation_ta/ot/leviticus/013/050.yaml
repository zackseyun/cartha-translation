base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/050.yaml
  text: And the priest shall examine the diseased area[b][a], and he shall isolate the diseased area for seven days.
translation:
  language: ta
  text: ஆசாரியன் அந்தப் பாதிப்புள்ள பொருளை ஆராய்வான்; அதை ஏழு நாட்களுக்குத் தனியே அடைத்து வைப்பான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தனிமைப்படுத்தி வைப்பான்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல், கண்காணிப்பதற்காகப் பாதிப்புள்ள பொருளைத் தற்காலிகமாகத் தனியே வைத்தலைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: ஆராய்ந்து பார்த்து
  rationale: רָאָה என்பதன் அடிப்படைப் பொருள் ‘பார்’; இங்கு ஆசாரியரின் முறையான ஆய்வைக் குறிக்கிறது. ‘ஆராய்ந்து பார்த்து’ என்பது செயற்பாட்டுச் சூழலையும் பார்வையிடுதலையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַכֹּהֵן
  choice: ஆசாரியன்
  rationale: லேவியராகமச் சூழலில் כֹּהֵן என்பதற்கான வழக்கமான, தெளிவான தமிழ் இணைச்சொல்.
- source_word: הַנָּגַע / הַנֶּגַע
  choice: பாதிக்கப்பட்ட பகுதி
  rationale: נֶגַע என்பது இங்கு ஒரு குறிப்பிட்ட நவீன நோய்ப்பெயரை அல்லாமல், ஆசாரியர் ஆய்வு செய்யும் பாதிப்புக் குறி அல்லது பகுதியைக் குறிக்கிறது. இரண்டு இடங்களிலும் ஒரே சொல்லாட்சி வைக்கப்பட்டுள்ளது.
- source_word: וְהִסְגִּיר
  choice: தனிமைப்படுத்தி வைக்க வேண்டும்
  rationale: סגר என்பதன் ஹிஃபில் வடிவம் இங்கு கண்காணிப்பதற்காக மூடி வைத்தல் அல்லது தனியே வைத்தலைக் குறிக்கிறது. நவீன தமிழில் இச்சொல்லாட்சி நோயைத் துல்லியமாக நிர்ணயிக்காமல் தற்காலிகப் பிரித்துவைப்பைத் தெரிவிக்கிறது.
- source_word: שִׁבְעַת יָמִים
  choice: ஏழு நாட்களுக்கு
  rationale: குறிப்பிட்ட கால அளவை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
