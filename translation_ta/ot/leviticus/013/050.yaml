translation_notes:
  register: நவீன தரத் தமிழில், சட்டநடைச் சூழலுக்கேற்ற கண்ணியமான மற்றும் பொதுமக்கள் எளிதில் புரிந்துகொள்ளும் சொல்லாட்சி பயன்படுத்தப்பட்டது. ‘கொள்ளைநோய்’ போன்ற மரபுவழிச் சொற்களால் நவீன மருத்துவ வகைப்பாட்டைத் திணிப்பது தவிர்க்கப்பட்டது.
