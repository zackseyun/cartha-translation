  text: But if it does spread in the skin[a], the priest shall pronounce him unclean[b]; it is an infection.
translation:
  language: ta
  text: ஆனால் அது தோலில் மேலும் பரவினால், ஆசாரியன் அவனைத் தீட்டானவன் என்று அறிவிக்க வேண்டும்[a]; அது ஒரு பாதிப்பாகும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்சொல்லாக, ‘ஆசாரியன் அவனைத் தீட்டானவனாக்க வேண்டும்’ என்றும் அமைக்கலாம். ஆனால் ஆசாரியச் சட்டச் சூழலில், அவனைத் தீட்டானவன் என்று அதிகாரபூர்வமாக அறிவிப்பதே பொருள்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது ‘நோய்,’ ‘வாதை,’ ‘பாதிக்கப்பட்ட இடம்.’ எபிரெயச் சொல் பரந்த பொருளுடையது; அது நவீன மருத்துவ வகை ஒன்றுடன் துல்லியமாகப் பொருந்துவதில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: ஆனால் … என்றால்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட நிலைக்கு மாறான நிபந்தனையை இயல்பான தமிழில் அறிமுகப்படுத்துகிறது.
- source_word: פָּשֹׂה תִפְשֶׂה
  choice: பரவினால்
  rationale: எபிரெய மொழியில் வினைச்சொல் வலியுறுத்தப்பட்டுள்ளது. தமிழில் ‘ஆனால்’ என்பதுடன் வரும் நிபந்தனைச் சூழல் அந்த எதிர்மறை வலியுறுத்தலை இயல்பாக வெளிப்படுத்துகிறது; ‘மிகவும் பரவினால்’ என்று அளவைச் சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: בָּעוֹר
  choice: தோலில்
  rationale: עוֹר என்பதன் வழக்கமான பொருள் ‘தோல்’; בְּ முன்னிடைச்சொல்லும் நோயறிதல் சூழலும் ‘தோலில்’ என்பதை ஆதரிக்கின்றன.
- source_word: וְטִמֵּא הַכֹּהֵן אֹתוֹ
  choice: ஆசாரியன் அவனைத் தீட்டுள்ளவன் என்று அறிவிக்க வேண்டும்
  rationale: ஆசாரியச் சட்டச் சூழலில் இது அந்த நபரின் சடங்குசார் தீட்டு நிலையை அதிகாரபூர்வமாக அறிவிப்பதைக் குறிக்கிறது; ஆசாரியன் அவனைத் தீட்டுள்ளவனாக உண்டாக்குகிறான் என்று பொருள்படுவதைத் தவிர்க்கிறது.
- source_word: נֶגַע
  choice: பாதிப்பு
  rationale: இந்தச் சொல் நோய், வாதை, பாதிக்கப்பட்ட இடம் போன்ற பரந்த பொருள் எல்லையைக் கொண்டது. ‘பாதிப்பு’ நவீன மருத்துவ நோயறிதல் ஒன்றைத் தேவையின்றித் திணிக்காமல் அந்தப் பரப்பை ஓரளவு காக்கிறது.
- source_word: הִוא
  choice: அது ஒரு
  rationale: முன்னர் விவரிக்கப்பட்ட நிலையை அடையாளப்படுத்தும் வினையற்ற எபிரெய வாக்கியத்தை இயல்பான தமிழில் வழங்குகிறது.
theological_decisions:
- issue: ஆசாரியன் அறிவிக்கும் தீட்டு நிலையின் இயல்பு
  choice: ஆசாரியன் அந்த நபரைத் தீட்டுள்ளவன் என்று அதிகாரபூர்வமாக அறிவிக்கிறான்.
  alternative: ஆசாரியன் அவனைத் தீட்டுள்ளவனாக ஆக்குகிறான்.
  rationale: லேவியராகமத்தின் நோயறிதல் மற்றும் ஆசாரியச் சட்டச் சூழல், ஆசாரியரின் செயல் தீட்டை உண்டாக்குவது அல்ல; ஏற்கெனவே காணப்பட்ட அறிகுறியின் அடிப்படையில் சடங்குசார் நிலையைத் தீர்மானித்து அறிவிப்பது என்பதைக் காட்டுகிறது.
- issue: נֶגַע என்பதன் மருத்துவ இயல்பு
  choice: குறிப்பிட்ட நவீன நோயாக வகைப்படுத்தாமல் ‘பாதிப்பு’ என்று பரந்த நிலையில் வைக்கப்படுகிறது.
  alternative: ‘தொற்று’ அல்லது ஒரு குறிப்பிட்ட தோல் நோய் என்று மொழிபெயர்ப்பது.
  rationale: எபிரெயச் சொல் நவீன மருத்துவ வகைப்பாட்டுடன் துல்லியமாக ஒத்துப்போகவில்லை; ஆகவே உரையில் இல்லாத மருத்துவத் துல்லியத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத்தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான சட்டநடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆசாரியன்,’ ‘தீட்டுள்ளவன்’ ஆகிய சொற்கள் லேவியராகமத்தின் சடங்குசார் சூழலைத் தெளிவாக வைத்திருக்கின்றன; ‘தொற்று’ போன்ற மிகத் துல்லியமான நவீன மருத்துவச் சொல்லைத் தவிர்க்கப்பட்டுள்ளது.
