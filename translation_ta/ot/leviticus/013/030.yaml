base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/030.yaml
  text: And the priest shall examine the diseased area[a], and behold, its appearance is deeper than the skin, and in it is thin yellow hair, then the priest shall pronounce him unclean; it is an itch[b], a skin disease of the head or of the beard.
translation:
  language: ta
  text: ஆசாரியன் அந்தப் பாதிக்கப்பட்ட இடத்தைப் பரிசோதிக்க வேண்டும். இதோ, அது தோலைவிட ஆழமாகத் தோன்றுகிறது; அதில் மெல்லிய மஞ்சள் நிற முடி இருக்கிறது. அப்போது ஆசாரியன் அவனைத் தீட்டானவன் என்று அறிவிக்க வேண்டும். அது நெத்தெக் என்னும் பாதிப்பு[a]; அது தலையில் அல்லது தாடியில் ஏற்படும் தோல் நோய்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் נֶתֶק (நெத்தெக்). இதற்குப் பாரம்பரியமாக ‘சிரங்கு’ என்று மொழிபெயர்க்கப்பட்டுள்ளது; இது தலை அல்லது தாடி தொடர்பான ஒரு குறிப்பிட்ட பாதிப்பைக் குறிக்கிறது, ஆனால் அதன் துல்லியமான நவீன மருத்துவ அடையாளம் உறுதியாகத் தெரியவில்லை.
    reason: lexical_alternative
  - marker: b
    text: எபிரெய צָרַעַת என்பது பலவகையான கடுமையான தோல் நோய்களைக் குறிக்கும் பரந்த சொல்; அது நவீன தொழுநோயை (ஹான்சன் நோயை) மட்டுமே குறிப்பதில்லை.
    reason: cultural_note
lexical_decisions:
- source_word: נֶגַע
  choice: பாதிக்கப்பட்ட இடம்
  rationale: இங்கு ஆசாரியன் பார்வையிட்டுப் பரிசோதிக்கும் உடலின் குறிப்பிட்ட பகுதியைக் குறிக்கிறது. ‘வாதை’ அல்லது ‘கொள்ளைநோய்’ போன்ற சொற்கள் தேவையற்ற பொருள்சாயலை ஏற்படுத்தும்.
- source_word: מַרְאֵהוּ עָמֹק מִן־הָעוֹר
  choice: அது தோலைவிட ஆழமாகத் தோன்றுகிறது
  rationale: நோய்ப்பகுதி உண்மையில் எவ்வளவு ஆழமானது என்று கூறாமல், அதன் காணப்படும் தோற்றத்தைப் பற்றிய எபிரெயக் கண்டறிதல் மொழியைப் பாதுகாக்கிறது.
- source_word: שֵׂעָר צָהֹב דַּק
  choice: மெல்லிய மஞ்சள் நிற முடி
  rationale: צָהֹב என்பதன் மஞ்சள் நிறத்தையும் דַּק என்பதன் மென்மை/மெல்லிய தன்மையையும் இயல்பான தமிழில் தருகிறது.
- source_word: וְטִמֵּא אֹתוֹ
  choice: அவனைத் தீட்டானவன் என்று அறிவிக்க வேண்டும்
  rationale: ஆசாரியன் ஒருவரைத் தீட்டுள்ளவராக ஆக்குகிறார் என்பதல்ல; சடங்குசார் நிலையைத் தீர்ப்பாக அறிவிக்கிறார் என்பதைக் காட்டுகிறது.
- source_word: נֶתֶק
  choice: முடி உதிரும் பாதிப்பு
  rationale: தலை அல்லது தாடியின் முடியுள்ள பகுதியில் ஏற்படும் குறிப்பிட்ட பாதிப்பை வாசகருக்குப் புரியும் வகையில் குறிக்கிறது. துல்லியமான நவீன மருத்துவ அடையாளம் உறுதியற்றதால் அது அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: צָרַעַת
  choice: தோல் நோய்
  rationale: இந்த எபிரெயச் சொல் நவீன தொழுநோயை மட்டும் குறிக்காமல் பலவகையான கடுமையான தோல் பாதிப்புகளைக் குறிக்கும் பரந்த சொல்; ஆகவே மருத்துவ ரீதியாக மிகக் குறிப்பான மொழி தவிர்க்கப்படுகிறது.
- source_word: הָרֹאשׁ אוֹ הַזָּקָן
  choice: தலையில் அல்லது தாடியில்
  rationale: பாதிப்பு ஏற்படும் இடங்களை நேரடியாகவும் இயல்பான தமிழிலும் குறிக்கிறது; ‘உச்சந்தலை’ போன்ற விளக்கச் சொல்லை தேவையின்றி சேர்க்கவில்லை.
theological_decisions:
- issue: ஆசாரியனின் தீர்ப்பும் சடங்குசார் தீட்டும்
  choice: ‘தீட்டானவன் என்று அறிவிக்க வேண்டும்’
  alternative: ‘அவனைத் தீட்டாக்க வேண்டும்’
  rationale: எபிரெய வினை வடிவத்தைச் சடங்குசார் தீர்ப்பாகப் புரிந்துகொள்வது இச்சட்டப்பகுதியின் சூழலுக்கு ஏற்றது; ஆசாரியன் நோயையோ தீட்டையோ உண்டாக்குகிறார் என்ற தவறான கருத்தைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகருக்குப் புரியும் இயல்பான சட்டநடை பயன்படுத்தப்பட்டுள்ளது. ‘இதோ’ என்பது וְהִנֵּה என்பதன் கவனஈர்ப்பு வலிமையைத் தக்கவைக்கிறது. ‘தீட்டு’ என்பது இங்கு சடங்குசார் நிலையைச் சுட்டுகிறது; ஒழுக்கக் குற்றத்தை அல்ல.
