source:
  edition: WLC
  text: וְ/הַ/בֶּ֕גֶד כִּֽי יִהְיֶ֥ה ב֖/וֹ נֶ֣גַע צָרָ֑עַת בְּ/בֶ֣גֶד צֶ֔מֶר א֖וֹ בְּ/בֶ֥גֶד פִּשְׁתִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/047.yaml
  text: And if a garment has in it an outbreak of leprosy[a], in a wool garment or in a linen garment,
translation:
  language: ta
  text: மேலும், ஓர் ஆடையில்—கம்பளி ஆடையிலோ லினன் ஆடையிலோ—தொழுநோயின் தாக்கம்[a] இருந்தால்,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சராஅத். மரபுவழியாக இது ‘தொழுநோய்’ என்று மொழிபெயர்க்கப்படுகிறது. ஆனால் இங்கு இச்சொல் ஆடைகளையும் பாதிக்கும் நோய் அல்லது மாசுபட்ட நிலை உள்ளிட்ட விரிவான ஒரு வகையைக் குறிக்கிறது; இது நவீன ஹான்சன் நோயை மட்டும் குறிப்பதல்ல.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַבֶּגֶד
  choice: மேலும், ஓர் ஆடையில்
  rationale: וְ தொடர்ச்சியைச் சுட்டுவதால் ‘மேலும்’ என மொழிபெயர்க்கப்பட்டது. எபிரெயத்தில் பெயர்ச்சொல்லுக்கு உருபு இருந்தாலும், சட்ட விதியில் பொதுவான ஒரு நிகழ்வை அறிமுகப்படுத்துவதால் தமிழில் ‘ஓர் ஆடை’ இயல்பாக உள்ளது.
- source_word: כִּי יִהְיֶה בוֹ
  choice: … இருந்தால்
  rationale: சட்ட வழக்கை அறிமுகப்படுத்தும் כִּי மற்றும் இருப்பைக் குறிக்கும் היה בוֹ ஆகியவை தமிழில் நிபந்தனை வடிவமான ‘இருந்தால்’ என்பதால் இயல்பாகவும் சுருக்கமாகவும் வெளிப்படுகின்றன.
- source_word: נֶגַע צָרָעַת
  choice: தொழுநோய்த் தாக்கம்[a]
  rationale: נֶגַע என்பது காணக்கூடிய தாக்கம் அல்லது பாதிப்பைக் குறிக்கிறது; צָרָעַת என்பதற்கான மரபுவழிப் பெயர் ‘தொழுநோய்’. ஆனால் இங்கு அது ஆடையிலும் தோன்றுவதால், நவீன ஹான்சன் நோயை மட்டும் குறிக்காது என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- source_word: בְּבֶגֶד צֶמֶר
  choice: கம்பளி ஆடையிலோ
  rationale: צֶמֶר என்பது கம்பளி அல்லது ஆட்டு மயிரால் செய்யப்பட்ட துணியைக் குறிக்கிறது. בְּ-இன் இடப்பொருள் ‘ஆடையில்’ என்ற வடிவில் காக்கப்பட்டுள்ளது.
- source_word: אוֹ בְּבֶגֶד פִּשְׁתִּים
  choice: சணல் ஆடையிலோ
  rationale: פִּשְׁתִּים என்பது சணல் நாரால் செய்யப்பட்ட லினன் துணியைக் குறிக்கிறது. אוֹ மற்றும் மீண்டும் வரும் בְּ ஆகியவை இணையான ‘…ஆடையிலோ’ அமைப்பில் வெளிப்படுத்தப்பட்டுள்ளன.
theological_decisions:
- issue: צָרָעַת என்பதன் நோயியல் வரம்பு
  choice: முதன்மை உரையில் மரபுவழியான ‘தொழுநோய்’ என்பதைக் காத்து, அதன் விரிவான பொருளை அடிக்குறிப்பில் விளக்குதல்
  alternative: ‘மாசுபடுத்தும் பாதிப்பு’ அல்லது ‘பூஞ்சைப் பாதிப்பு’ என்று குறிப்பாக்குதல்
  rationale: மூலச்சொல் தோல், ஆடை, வீடு ஆகியவற்றில் காணப்படும் பலவகைத் தாக்கங்களை உள்ளடக்குகிறது. அதை ஒரு குறிப்பிட்ட நவீன நோயாகவோ பூஞ்சையாகவோ தீர்மானிப்பது மூலத்தின் பரந்த, தெளிவுறாத வரம்பைச் சுருக்கிவிடும்.
translation_notes:
  register: நவீனத் தரத்தமிழில், சட்ட விதிக்கேற்ற நிபந்தனை நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. கம்பளி மற்றும் சணல் ஆடைகள் என்ற இரு இணையான இடப்பொருள் தொடர்களும் ‘…ஆடையிலோ’ எனக் காக்கப்பட்டுள்ளன; இடைச்செருகல் குறிகள் வாக்கியத்தின் இயல்பான ஓட்டத்தைப் பேணுகின்றன.
