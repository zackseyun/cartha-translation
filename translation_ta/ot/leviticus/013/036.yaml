base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/036.yaml
  text: And if the priest examines him[a], and behold, the scaly infection has spread in the skin, the priest need not look for the yellow hair; he is unclean.
translation:
  language: ta
  text: ஆசாரியன் அவனைப் பரிசோதிக்கும்போது, இதோ, செதில் நோய்[a] தோலில் பரவியிருப்பதைக் கண்டால், மஞ்சள் நிற முடி இருக்கிறதா என ஆசாரியன் பரிசோதிக்க வேண்டியதில்லை; அவன் தீட்டானவன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘செதில் நோய்’ என மொழிபெயர்க்கப்பட்ட எபிரெயச் சொல், குறிப்பாகத் தலை அல்லது தாடிப் பகுதியில் ஏற்படும் செதில்கள் படரும் தோல் பாதிப்பைக் குறிக்கிறது; இதை ‘அரிப்பு நோய்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָהוּ
  choice: ஆசாரியன் அவனைப் பரிசோதிக்கும்போது
  rationale: ראה என்பது இங்கே வெறுமனே பார்ப்பதைக் குறிக்காமல், ஆசாரியன் நோய்நிலையை முறையாக ஆராய்வதைக் குறிக்கிறது. தொடரின் நிபந்தனைச் சூழலைத் தமிழில் இயல்பாக வெளிப்படுத்த ‘பரிசோதிக்கும்போது’ என மொழிபெயர்க்கப்பட்டது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: பரிசோதனையில் கண்டறியப்படும் நிலையைச் சுட்டிக் காட்டும் எபிரெயச் சொல்லின் கவன ஈர்ப்பு வலிமை பாதுகாக்கப்படுகிறது.
- source_word: פָּשָׂה
  choice: பரவியிருந்தால்
  rationale: பாதிப்பு தோலில் விரிவடைந்துள்ளதைக் குறிக்கும் இயல்பான மருத்துவச் சூழல் மொழி; நிபந்தனை அமைப்பையும் தெளிவுபடுத்துகிறது.
- source_word: הַנֶּתֶק
  choice: செதில் நோய்
  rationale: தலை அல்லது தாடிப் பகுதியில் ஏற்பட்டு முடி மாற்றங்களோடு தொடர்புடைய குறிப்பிட்ட செதில் படரும் தோல் பாதிப்பை எளிய, தற்போதைய தமிழில் குறிக்கிறது; குறிப்பிட்ட நவீன நோயறிதலைத் திணிப்பதில்லை.
- source_word: בָּעוֹר
  choice: தோலில்
  rationale: எபிரெய முன்னிடைச்சொல்லின் பொருளை இயல்பான தமிழில் நேரடியாகக் கொடுக்கிறது.
- source_word: לֹא יְבַקֵּר
  choice: தேடிப் பார்க்க வேண்டியதில்லை
  rationale: பாதிப்பு பரவியிருப்பதே தீர்மானிக்கும் அறிகுறியாக இருப்பதால், மற்றொரு அறிகுறியை மேலும் ஆராயத் தேவையில்லை என்ற நடைமுறைப் பொருளை வெளிப்படுத்துகிறது.
- source_word: לַשֵּׂעָר הַצָּהֹב
  choice: மஞ்சள் நிற முடி இருக்கிறதா என்று
  rationale: முந்தைய வசனங்களில் சொல்லப்பட்ட நோயறிதல் அடையாளத்தைத் தெளிவாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: טָמֵא הוּא
  choice: அவன் தீட்டுப்பட்டவன்
  rationale: இலக்கண ரீதியாகப் பாதிக்கப்பட்ட நபரையே குறிக்கிறது; லேவியராகமத்தின் சடங்குத் தூய்மைச் சூழலுக்கேற்ற வழக்கமான தமிழ் சொல் பயன்படுத்தப்படுகிறது.
theological_decisions:
- issue: טָמֵא என்பதன் தன்மை
  choice: தீட்டுப்பட்டவன்
  alternative: அசுத்தமானவன்
  rationale: இது ஒழுக்கக் குற்றத்தையோ தனிப்பட்ட பாவத்தையோ அவசியம் குறிக்காமல், ஆசாரியச் சட்டத்தின்படியான சடங்கு நிலையைச் சுட்டுகிறது. ‘தீட்டுப்பட்டவன்’ என்பது அந்தச் சட்டச் சூழலைத் தெளிவாகப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், ஆசாரியச் சட்டத்தின் முறையான தொனியைப் பேணியபடி பொதுவாசகர்களுக்குப் புரியும் சொற்கள் பயன்படுத்தப்பட்டுள்ளன. நோயின் நவீன மருத்துவ அடையாளம் உறுதியற்றதால் குறிப்பிட்ட மருத்துவப் பெயர் தவிர்க்கப்பட்டது.
