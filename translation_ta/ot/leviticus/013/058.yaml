base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/058.yaml
  text: But the garment[a], or the warp, or the woof, or any article of leather that you wash, and the infection departs from them, shall be washed a second time and be clean.
translation:
  language: ta
  text: ஆடையோ, நெசவின் நீளநூலோ, குறுக்குநூலோ[a], தோலால் செய்யப்பட்ட எந்தப் பொருளோ—நீ கழுவியபின் அவற்றிலிருந்து பாதிப்பு நீங்கியிருந்தால், அது இரண்டாவது முறையாகக் கழுவப்பட வேண்டும்; அப்போது அது தூய்மையாகும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘குறுக்குநூல்’ என்பது நெசவில் நீளநூல்களின் குறுக்கே செல்லும் நூல்; இதற்கு ‘ஊடைநூல்’ என்றும் பெயர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבֶּגֶד
  choice: ஆடை
  rationale: בגד என்பது ஆடை அல்லது துணியைக் குறிக்கும் பொதுச்சொல்; இச்சூழலில் ‘ஆடை’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: הַשְּׁתִי
  choice: நெசவின் நீளநூல்
  rationale: நெசவில் நீளவாக்கில் அமைக்கப்படும் warp நூலை, பொதுவாசகரும் புரிந்துகொள்ளும் வகையில் விளக்கமாக மொழிபெயர்க்கிறது.
- source_word: הָעֵרֶב
  choice: குறுக்குநூல்[a]
  rationale: שׁתי என்பதுடன் இணையாக வரும் weft நூலைக் குறிக்கிறது; ‘குறுக்குநூல்’ அதன் திசையையும் பொருளையும் தெளிவாகத் தருகிறது.
- source_word: כָל כְּלִי הָעוֹר
  choice: தோலால் செய்யப்பட்ட எந்தப் பொருள்
  rationale: כְּלִי என்பது பாத்திரம் மட்டுமல்லாமல் பலவகைப் பொருட்களைக் குறிக்கக்கூடியதால், பரந்த பொருளைத் தக்கவைக்கிறது.
- source_word: תְּכַבֵּס
  choice: நீ கழுவியபின்
  rationale: כבס என்பதன் ஆடை அல்லது துணியைத் துவைக்கும் பொருளையும், இரண்டாம் நபர் ஒருமை அறிவுறுத்தல் நடையையும் தக்கவைக்கிறது; தொடரின் சூழலை இயல்பான தமிழில் காட்ட ‘பின்’ சேர்க்கப்பட்டுள்ளது.
- source_word: הַנָּגַע
  choice: பாதிப்பு
  rationale: இது பொருளில் காணப்படும் தீங்கான வெளிப்பாட்டைக் குறிக்கிறது; ‘பாதிப்பு’ நவீன மருத்துவ நோயறிதலைத் திணிக்காமல் எபிரேயச் சொல்லின் பரந்த பொருளைத் தக்கவைக்கிறது.
- source_word: וְסָר מֵהֶם
  choice: அவற்றிலிருந்து பாதிப்பு நீங்கியிருந்தால்
  rationale: אֲשֶׁר தொடரின் சூழ்நிலை சார்ந்த நிபந்தனைப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது; எபிரேயத்தில் உள்ள பன்மைச் சுட்டையும் தக்கவைக்கிறது.
- source_word: וְכֻבַּס שֵׁנִית
  choice: அது இரண்டாவது முறையாகக் கழுவப்பட வேண்டும்
  rationale: செயப்பாட்டு வடிவத்தையும் மறுமுறை கழுவ வேண்டிய நடைமுறை கட்டளையையும் தெளிவாகக் காட்டுகிறது.
- source_word: וְטָהֵר
  choice: அப்போது அது தூய்மையாகும்
  rationale: லேவியராகமத்தின் சடங்குசார் தூய்மை கருத்தை ‘தூய்மை’ என்ற சொல்லால் தக்கவைக்கிறது; வெறும் உடல் சுத்தம் எனக் குறுக்கவில்லை.
theological_decisions:
- issue: טהר என்பதன் சடங்குசார் பொருள்
  choice: தூய்மையாகும்
  alternative: சுத்தமாகும்
  rationale: இங்கு உடல் சுத்தம் மட்டுமல்ல, விதிமுறைப்படி தூய நிலை அடைவதும் குறிக்கப்படுவதால் ‘தூய்மை’ பொருத்தமானது.
- issue: וְסָר என்பதன் தொடர்பு
  choice: நீங்கியிருந்தால்
  alternative: நீங்கிவிட்டது
  rationale: கழுவிய பின் பாதிப்பு நீங்குவது, அடுத்த கட்டமான இரண்டாம் கழுவுதலுக்கான சூழ்நிலையாக உள்ளது. தமிழில் நிபந்தனை வடிவம் இத்தொடர்பைத் தெளிவாக்குகிறது; காரண-விளைவை மீறி விளக்கவில்லை.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘நீளநூல்/குறுக்குநூல்’ என்ற விளக்கமான நெசவுச் சொற்கள் பொதுவாசகருக்குப் புரியும் வகையில் தேர்ந்தெடுக்கப்பட்டுள்ளன; ஒருமை முகவரியான ‘நீ’ எபிரேய வினை வடிவத்தைப் பின்பற்றுகிறது.
