  source_fidelity: 'மூலத்தின் முக்கியப் பொருள் நன்றாகப் பேணப்பட்டுள்ளது: ஆசாரியரின் ஆய்வு, தோல் நோய் உடல் முழுவதையும் மூடிய நிலை, அறிவிக்கப்படும் தூய்மைத் தீர்ப்பு, முழுவதும் வெண்மையாக மாறுதல், இறுதித் தீர்ப்பு ஆகியவை உள்ளன. ஆனால் “பரிசோதித்துப் பார்க்கையில் … மூடியிருந்தால்” என்பது ஒரே சட்டநிபந்தனையை இரட்டிப்பாக்கி வாக்கிய அமைப்பைத் தடுமாறச் செய்கிறது. “பரிசோதித்து … மூடியிருப்பதைக் கண்டால்” என்பது וְרָאָה மற்றும் וְהִנֵּה ஆகியவற்றின் ஆய்வு-கண்டறிதல் தொடரைத் தெளிவாகக் காட்டும்.'
  naturalness: ‘ஆசாரியன்’, ‘தோல் நோய்’, ‘சுத்தமானவன் என்று அறிவிக்க வேண்டும்’ ஆகியவை நவீன நிலையான தமிழிலும் லேவியராகமத்தின் சட்டப்பதிவிலும் இயல்பாக உள்ளன. திருத்தப்பட்ட அமைப்பு நிபந்தனைத் தொடரைச் சீராக்குகிறது. அடிக்குறிப்பு b-யின் “சுத்தமானது என்று அறிவிக்கும் நேரடிச் செயப்படுபொருள்” என்ற தொடர் தெளிவற்றதாக இருந்தது; அது எபிரெயச் செயல்வினையின் நேரடிச் செயப்படுபொருளைப் பற்றியது எனத் தெளிவுபடுத்தப்பட்டுள்ளது.
  terminology: צָרַעַת என்பதற்கு ‘தோல் நோய்’ என்பது நவீன மருத்துவத் தொழுநோய் என்ற குறுகிய அடையாளத்தைத் தவிர்க்கும் பாதுகாப்பான தேர்வு. טִהַר என்பதற்கு ‘சுத்தமானவன் என்று அறிவிக்க வேண்டும்’ என்பது சுத்தப்படுத்தும் செயலல்ல, ஆசாரியரின் தூய்மைத் தீர்ப்பே என்பதைச் சரியாக வெளிப்படுத்துகிறது. נֶגַע-இன் சொற்சொல் பொருளும் தீர்ப்பு நபருக்குப் பொருந்தும் விதமும் அடிக்குறிப்பில் தக்கவாறு காக்கப்பட்டுள்ளன.
  issues:
