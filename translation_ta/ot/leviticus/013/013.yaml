    rationale: எபிரெய வினைச்சொல்லின் நேரடிச் செயப்படுபொருள் נֶגַע என்பதைத் தெளிவாகச் சொல்லாமல், ‘சுத்தமானது என்று அறிவிக்கும் நேரடிச் செயப்படுபொருள்’ எனக் கூறுவது குழப்பம் தரலாம்.
  revised_text: ஆசாரியன் அவனைப் பரிசோதித்து, இதோ, தோல் நோய்[a] அவனுடைய உடல் முழுவதையும் மூடியிருப்பதைக் கண்டால், பாதிக்கப்பட்டவனைச் சுத்தமானவன் என்று அவன் அறிவிக்க வேண்டும்[b]. அது முழுவதும் வெண்மையாக மாறிவிட்டது; அவன் சுத்தமானவன்.
