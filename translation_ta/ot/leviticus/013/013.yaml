    rationale: “ஆசாரியன் அவனைப் பரிசோதித்துப் பார்க்கையில் ... மூடியிருந்தால்” என்பதில் ‘பார்க்கையில்’ மற்றும் ‘இருந்தால்’ இரண்டும் ஒரே ஆய்வு-நிபந்தனையைப் போட்டியிடும் வகையில் அமைந்துள்ளன. மூலத்தின் ‘ஆசாரியன் பார்த்து, இதோ ... மூடியிருப்பதைக் கண்டால்’ என்ற தொடரைத் தமிழில் நேர்த்தியாகக் காட்ட வேண்டும்.
