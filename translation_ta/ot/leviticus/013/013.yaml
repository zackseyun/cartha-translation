  yaml_path: translation/ot/leviticus/013/013.yaml
  text: and the priest examines him[a], and behold, the skin disease has covered all his flesh, then he shall pronounce the affected person clean; all of it has turned white[b]; he is clean.
translation:
  language: ta
  text: ஆசாரியன் அவனைப் பரிசோதித்து, இதோ, தோல் நோய்[a] அவனுடைய உடல் முழுவதையும் மூடியிருப்பதைக் கண்டால், பாதிக்கப்பட்டவனைச் சுத்தமானவன் என்று அவன் அறிவிக்க வேண்டும்[b]. அது முழுவதும் வெண்மையாக மாறிவிட்டது; அவன் சுத்தமானவன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல் צָרַעַת (ட்சராஅத்) மரபாக ‘தொழுநோய்’ என்று மொழிபெயர்க்கப்படுகிறது. ஆனால் லேவியராகமத்தில் அது நவீன மருத்துவம் குறிப்பிடும் தொழுநோயை மட்டும் அல்லாமல், பலவகையான தோல் பாதிப்புகளைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெய மூலத்தில் ‘சுத்தமானது என்று அறிவிக்க வேண்டும்’ என்ற வினைச்சொல்லின் நேரடிச் செயப்படுபொருள் சொல்லுக்கு சொல் ‘பாதிப்பு’ அல்லது ‘குறி’ என்பதாகும். எனினும் அந்தத் தீர்ப்பு அந்தப் பாதிப்புள்ள நபருக்கே பொருந்துகிறது. ஆகவே, ‘அவனைச் சுத்தமானவன் என்று அறிவிக்க வேண்டும்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וְרָאָה
  choice: பரிசோதித்துப் பார்க்கையில்
  rationale: இச்சொல்லின் அடிப்படைப் பொருள் ‘பார்த்தல்’ என்றாலும், ஆசாரியர் மேற்கொள்ளும் ஆய்வுச் சூழலில் கவனமாகப் பரிசோதிப்பதைக் குறிக்கிறது. தொடரும் நிபந்தனைச் சட்ட நடைக்கு இயல்பாக அமைய இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: הַכֹּהֵן
  choice: ஆசாரியன்
  rationale: தூய்மைத் தீர்ப்பை வழங்கும் வழிபாட்டுப் பணியாளருக்கான வழக்கமான, தெளிவான தமிழ் சொல்.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: பரிசோதனையில் கண்ட நிலையைச் சுட்டிக்காட்டும் மூலமொழியின் கவனஈர்ப்பு வலிமையைப் பேணுகிறது.
- source_word: הַצָּרַעַת
  choice: தோல் நோய்
  rationale: צָרַעַת என்பது நவீன தொழுநோயோடு மட்டும் ஒப்பிட முடியாத விரிவான தோல் பாதிப்புகளைக் குறிக்கிறது. ‘தோல் நோய்’ புரிந்துகொள்ள எளிதாகவும் தவறான மருத்துவத் துல்லியத்தைத் தவிர்ப்பதாகவும் உள்ளது.
- source_word: אֶת כָּל בְּשָׂרוֹ
  choice: அவனுடைய உடல் முழுவதையும்
  rationale: சொல்லுக்கு சொல் ‘அவனுடைய சதை முழுவதையும்’ என்றாலும், இச்சூழலில் உடலின் முழுப் பரப்பே குறிக்கப்படுகிறது; நவீன தமிழில் ‘உடல் முழுவதையும்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: וְטִהַר
  choice: சுத்தமானவன் என்று அறிவிக்க வேண்டும்
  rationale: பீயேல் வடிவம் ஆசாரியன் ஒருவரைச் சுத்தப்படுத்துவதை அல்ல, சுத்தமானவர் எனத் தீர்ப்பளிப்பதைக் குறிக்கிறது. ‘அறிவிக்க வேண்டும்’ அதன் சட்டபூர்வமான அறிவிப்பு வலிமையை வெளிப்படுத்துகிறது.
- source_word: אֶת הַנָּגַע
  choice: பாதிக்கப்பட்டவனை
  rationale: נֶגַע என்பதன் நேரடிப் பொருள் ‘பாதிப்பு/குறி’. ஆயினும் தூய்மைத் தீர்ப்பு அந்தக் குறியை உடைய நபருக்குப் பொருந்துவதால், இயல்பான தமிழில் நபரைச் செயப்படுபொருளாகக் காட்டி, மூலத்தின் வடிவம் அடிக்குறிப்பில் தெரிவிக்கப்பட்டது.
- source_word: כֻּלּוֹ הָפַךְ לָבָן
  choice: அது முழுவதும் வெண்மையாக மாறிவிட்டது
  rationale: பாதிக்கப்பட்ட பகுதி முழுமையாக நிறம் மாறியிருப்பதைக் குறிக்கும் நிறைவுநிலையையும் முழுமை வலியுறுத்தலையும் பேணுகிறது.
- source_word: טָהוֹר הוּא
  choice: அவன் சுத்தமானவன்
  rationale: லேவியராகமத்தின் தூய்மைச் சட்டச் சூழலில் טָהוֹר என்பதற்கான நிலையான மொழிபெயர்ப்பு. ‘சடங்குப்படி’ போன்ற விளக்கச் சொல்லை மூலத்தில் இல்லாமல் சேர்க்கவில்லை.
theological_decisions:
- issue: லேவியராகமத் தூய்மைச் சட்டத்தில் צָרַעַת என்பதன் பொருள்
  choice: தோல் நோய்
  alternative: தொழுநோய்; தீட்டுண்டாக்கும் தோல் நோய்; ட்சராஅத்
  rationale: நவீன ஹான்சன் நோயை எபிரெய வகைப்பாட்டின் மீது திணிக்காமல், பலவகைத் தோல் பாதிப்புகளை உள்ளடக்கும் அதன் பரந்த பொருளைப் பேணுகிறது.
- issue: וְטִהַר என்பதில் ஆசாரியரின் செயல்
  choice: சுத்தமானவன் என்று அறிவிக்க வேண்டும்
  alternative: சுத்தமாக்க வேண்டும்; பாதிப்பைச் சுத்தமானது என்று அறிவிக்க வேண்டும்
  rationale: ஆசாரியன் மருத்துவமாகவோ சடங்காகவோ இங்கு சுத்தப்படுத்தவில்லை; ஆய்வின் அடிப்படையில் தூய்மைத் தீர்ப்பை அறிவிக்கிறார்.
- issue: אֶת הַנָּגַע என்பதன் இலக்கணப் பொருளும் தீர்ப்பைப் பெறுபவரும்
  choice: முதன்மை உரையில் பாதிக்கப்பட்ட நபர்; அடிக்குறிப்பில் ‘பாதிப்பு/குறி’ என்ற சொல்லுக்கு சொல் வடிவம்
  alternative: பாதிப்பைச் சுத்தமானது என்று அறிவிக்க வேண்டும்
  rationale: மூலத்தின் உண்மையான இலக்கணப் பதற்றத்தை மறைக்காமல் அடிக்குறிப்பில் பாதுகாத்தபடியே, தமிழில் தீர்ப்பு நபருக்குப் பொருந்துவதைத் தெளிவாகக் கூறுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான சட்டநடை பயன்படுத்தப்பட்டது. ‘ஆசாரியன்’, ‘சுத்தமானவன்’ ஆகியவை லேவியராகமத்தின் வழிபாட்டு மற்றும் தூய்மைச் சூழலைத் தாங்குகின்றன; ‘உடல் முழுவதையும்’ என்பது சொல்லுக்கு சொல் ‘சதை முழுவதையும்’ என்பதைக் காட்டிலும் சாதாரண வாசகருக்குத் தெளிவாக உள்ளது. மூலமொழியில் உள்ள ‘பாதிப்பு’ என்ற நேரடிச் செயப்படுபொருளுக்கும் நபருக்குரிய தீர்ப்புக்கும் இடையிலான பதற்றம் அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்பட்டது.
