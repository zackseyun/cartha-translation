base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/017.yaml
  text: And the priest shall examine it[a], and behold, the diseased spot has turned white; then the priest shall pronounce the spot clean[c][b]; it is clean.
translation:
  language: ta
  text: ஆசாரியன் அதைப் பரிசோதிப்பான்[a]. இதோ, பாதிக்கப்பட்ட இடம் வெண்மையாக மாறியிருக்கிறது; ஆசாரியன் அந்த இடம் தூய்மையானது என்று தீர்ப்பளிப்பான்[b]; அது தூய்மையானது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அந்தப் பாதிப்பைப் பரிசோதிப்பான்.’ எபிரெய נֶגַע என்பது நவீன மருத்துவ நோயறிதலைக் குறிப்பிடாமல், ஆசாரியன் பரிசோதிக்கும் கண்ணுக்குத் தெரியும் பாதிக்கப்பட்ட பகுதியைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அந்த இடத்தைத் தூய்மையானது என்று அறிவிப்பான்.’ ஆசாரியன் இங்கு பாதிப்பைக் குணமாக்கவில்லை; பரிசோதனைக்குப் பின் சடங்குத் தூய்மை குறித்த தீர்ப்பை அறிவிக்கிறான்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָהוּ
  choice: அதைப் பரிசோதிக்க வேண்டும்
  rationale: ראה என்பதன் அடிப்படைப் பொருள் ‘பார்’ என்றாலும், இங்குள்ள ஆசாரிய ஆய்வுச் சூழலில் கவனமாகப் பரிசோதிப்பதைக் குறிக்கிறது.
- source_word: הַכֹּהֵן
  choice: ஆசாரியன்
  rationale: லேவியராகமத்தின் சடங்குத் தூய்மைச் சட்டங்களில் כֹּהֵן என்பதற்கான இயல்பான, நிலையான தமிழ் சொல்.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: பரிசோதனையில் தெரியவரும் முடிவை நோக்கிக் கவனத்தை ஈர்க்கும் எபிரெய உரையாடல் குறியைப் பாதுகாக்கிறது.
- source_word: נֶהְפַּךְ
  choice: மாறியிருந்தால்
  rationale: Niphal வடிவம் நிலைமாற்றத்தைக் குறிக்கிறது; நிபந்தனைத் தொடருடன் இயல்பான தமிழில் வழங்கப்பட்டுள்ளது.
- source_word: הַנֶּגַע
  choice: பாதிக்கப்பட்ட இடம்
  rationale: נגע என்பது நவீன மருத்துவ நோயறிதலைத் திட்டவட்டமாகக் குறிப்பிடாமல், ஆசாரியன் ஆராயும் கண்ணுக்குத் தெரியும் பாதிப்புள்ள பகுதியைக் குறிக்கிறது.
- source_word: לְלָבָן
  choice: வெண்மையாக
  rationale: காணக்கூடிய நிறமாற்றத்தை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וְטִהַר
  choice: தூய்மையானது என்று அறிவிக்க வேண்டும்
  rationale: இங்கு ஆசாரியன் குணமாக்குவதோ கழுவித் தூய்மைப்படுத்துவதோ அல்ல; பரிசோதனைக்குப் பின் சடங்குத் தூய்மை நிலையை அதிகாரபூர்வமாக அறிவிக்கிறான்.
- source_word: טָהוֹר הוּא
  choice: அது தூய்மையானது
  rationale: எபிரெய மொழியின் நிறைவு தீர்ப்பைத் தனி வாக்கியமாகப் பாதுகாக்கிறது; ‘அது’ என்பது உடனடியாக முன்வரும் பாதிக்கப்பட்ட இடத்தைக் குறிக்கிறது.
theological_decisions:
- issue: தூய்மைச் சட்டத்தில் ஆசாரியனின் செயல்
  choice: ஆசாரியன் அந்த இடத்தைத் தூய்மையானது என்று அறிவிக்கிறான்.
  alternative: ஆசாரியன் அந்த இடத்தைத் தூய்மைப்படுத்துகிறான்.
  rationale: טהר என்பதற்கு சூழலின்படி ‘தூய்மைப்படுத்து’ அல்லது ‘தூய்மையானது என்று அறிவி’ எனப் பொருள் வரலாம். லேவியராகமம் 13-இல் ஆசாரியன் பரிசோதித்து சடங்குநிலையைத் தீர்மானிப்பவன்; அவன் அந்தப் பாதிப்பைக் குணமாக்குவதாக வசனம் கூறவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. எபிரெயத்தின் கவன ஈர்ப்புச் சொல்லான ‘இதோ’வும், இறுதியிலுள்ள தனித்த தூய்மைத் தீர்ப்பும் பாதுகாக்கப்பட்டுள்ளன. ‘பாதிக்கப்பட்ட இடம்’ என்பது தேவையற்ற நவீன மருத்துவத் துல்லியத்தைத் தவிர்க்கிறது.
