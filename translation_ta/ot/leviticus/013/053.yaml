translation_notes:
  register: நவீன, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. நெசவு சார்ந்த துல்லியத்திற்காக ‘பாவு நூல்’, ‘ஊடை நூல்’ என்ற தொழில்நுட்பச் சொற்கள் வைக்கப்பட்டுள்ளன. வசனம் அடுத்த வசனத்தில் நிறைவடையும் நிபந்தனை வாக்கியம் என்பதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
