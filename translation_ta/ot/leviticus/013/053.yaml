  text: וְ/אִם֮ יִרְאֶ֣ה הַ/כֹּהֵן֒ וְ/הִנֵּה֙ לֹא פָשָׂ֣ה הַ/נֶּ֔גַע בַּ/בֶּ֕גֶד א֥וֹ בַ/שְּׁתִ֖י א֣וֹ בָ/עֵ֑רֶב א֖וֹ בְּ/כָל כְּלִי עֽוֹר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/053.yaml
  text: But if the priest examines it[a], and behold, the infection has not spread in the garment, or in the warp, or in the woof, or in any article of leather,
translation:
  language: ta
  text: ஆனால் ஆசாரியன் அதைப் பரிசோதிக்கும்போது, இதோ, அந்தப் பாதிப்பு ஆடையிலோ, பாவு நூலிலோ, ஊடை நூலிலோ, தோலால் செய்யப்பட்ட எந்தப் பொருளிலோ பரவாமல் இருந்தால்,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: ஆனால் ... -போது ... இருந்தால்
  rationale: முந்தைய நடைமுறையிலிருந்து சிறு மாறுபாட்டைக் காட்டும் நிபந்தனைத் தொடர்ச்சியை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יִרְאֶה הַכֹּהֵן
  choice: ஆசாரியன் அதைப் பரிசோதிக்கும்போது
  rationale: מראה என்பதன் அடிப்படைப் பொருள் ‘பார்த்தல்’; இங்கு அதிகாரபூர்வ ஆய்வைக் குறிக்கும் சூழலில் ‘பரிசோதித்தல்’ பொருத்தமானது. தமிழின் நிபந்தனை வாக்கிய அமைப்புக்காக ‘-போது’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: பரிசோதனையின் முடிவுக்குக் கவனத்தை ஈர்க்கும் எபிரேய உரையாடல் குறியீட்டைப் பாதுகாக்கிறது.
- source_word: לֹא פָשָׂה הַנֶּגַע
  choice: அந்தப் பாதிப்பு ... பரவாமல் இருந்தால்
  rationale: פשה என்பது இச்சூழலில் பரவுதலைக் குறிக்கிறது. נגע-ஐ ‘பாதிப்பு’ என மொழிபெயர்ப்பது நவீன மருத்துவ நோயறிதலைத் தேவையின்றி திணிக்காமல், பொருளில் காணப்படும் பாதிக்கப்பட்ட நிலையையோ பகுதியையோ உள்ளடக்குகிறது.
- source_word: בַּבֶּגֶד
  choice: ஆடையிலோ
  rationale: בגד என்பதற்கான இயல்பான நவீனத் தமிழ் இணை; இணைக்கப்பட்ட மாற்றுகளின் வரிசையில் ‘-லோ’ வடிவம் தெளிவாக அமைகிறது.
- source_word: בַשְּׁתִי
  choice: பாவு நூலிலோ
  rationale: நெசவில் நீளவாக்கில் அமைந்துள்ள warp நூல்களைக் குறிக்கும் நிலையான தமிழ்த் தொழில்நுட்பச் சொல்.
- source_word: בָעֵרֶב
  choice: ஊடை நூலிலோ
  rationale: நெசவில் குறுக்காகச் செல்லும் weft நூல்களைக் குறிக்கும் தமிழ்த் தொழில்நுட்பச் சொல்; ‘பாவு நூல்’ என்பதோடு பொருத்தமான இணையாகிறது.
- source_word: בְּכָל כְּלִי עוֹר
  choice: தோலால் செய்யப்பட்ட எந்தப் பொருளிலோ
  rationale: כלי என்பதன் பரந்த பொருளான கருவி/பொருள் என்பதைக் காக்கிறது; உற்பத்திப் பொருளின் சூழலில் עור-ஐ இயல்பாக ‘தோல்’ என வழங்குகிறது.
