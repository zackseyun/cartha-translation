revisions:
- from: 'கம்பளி ஆடையிலோ சணல் ஆடையிலோ, நெசவின் நெடுக்குநூலிலோ குறுக்குநூலிலோ, தோலால் செய்யப்பட்ட எந்தப் பொருளிலோ காணப்படும் தொழுநோய் போன்ற பாதிப்பைக்[a] குறித்த விதிமுறை இதுவே: அது சுத்தமானது என்றோ தீட்டானது என்றோ அறிவிக்கப்பட வேண்டும்.'
  to: கம்பளி ஆடையிலோ லினன் ஆடையிலோ, நெடுக்குநூலிலோ குறுக்குநூலிலோ, அல்லது தோலால் செய்யப்பட்ட எந்தப் பொருளிலோ உள்ள தொழுநோய்போன்ற பாதிப்பைக் குறித்து, அதைச் சுத்தமானது அல்லது தீட்டானது எனத் தீர்மானிப்பதற்கான விதிமுறை இதுவே.
  rationale: The revision replaces the potentially inaccurate textile term ‘சணல்’ with ‘லினன்’ and reshapes the final clause to express the Hebrew’s juridical-purpose sense. It retains the draft’s careful non-clinical rendering of צָרַעַת and its useful footnote, while moving the note marker out of the running text because no specific anchor is needed in this one-verse translation.
