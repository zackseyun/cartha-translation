source:
  edition: WLC
  text: זֹ֠את תּוֹרַ֨ת נֶֽגַע צָרַ֜עַת בֶּ֥גֶד הַ/צֶּ֣מֶר א֣וֹ הַ/פִּשְׁתִּ֗ים א֤וֹ הַ/שְּׁתִי֙ א֣וֹ הָ/עֵ֔רֶב א֖וֹ כָּל כְּלִי ע֑וֹר לְ/טַהֲר֖/וֹ א֥וֹ לְ/טַמְּאֽ/וֹ־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/059.yaml
  text: This is the law for an outbreak of leprous disease in a wool garment or a linen garment[a], or in the warp or the woof, or in any leather article, for pronouncing it clean or pronouncing it unclean.
translation:
  language: ta
  text: கம்பளி ஆடையிலோ லினன் ஆடையிலோ, நெடுக்குநூலிலோ குறுக்குநூலிலோ, அல்லது தோலால் செய்யப்பட்ட எந்தப் பொருளிலோ உள்ள தொழுநோய்போன்ற பாதிப்பைக் குறித்து, அதைச் சுத்தமானது அல்லது தீட்டானது எனத் தீர்மானிப்பதற்கான விதிமுறை இதுவே.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תּוֹרַת
  choice: குறித்த விதிமுறை
  rationale: இங்கு תּוֹרָה முன்பு கூறப்பட்ட வழக்குகளுக்கு உரிய நடைமுறை விதியைச் சுருக்கமாகக் குறிக்கிறது; ‘விதிமுறை’ என்பது நவீனத் தமிழில் இயல்பாகவும் சட்டச் சூழலுக்கு ஏற்றதாகவும் உள்ளது.
- source_word: נֶגַע צָרַעַת
  choice: தொழுநோய் போன்ற பாதிப்பு
  rationale: נֶגַע என்பது காணக்கூடிய பாதிப்பைக் குறிக்கிறது; צָרַעַת நவீன ஹான்சன் நோயுடன் மட்டும் ஒப்பாகாது, மேலும் இங்கு ஆடை மற்றும் தோல் பொருள்களுக்கும் பயன்படுத்தப்படுகிறது. ‘போன்ற’ என்பது பழக்கமான பெயருடன் ஒற்றுமையை வைத்துக்கொண்டே தவறான மருத்துவத் துல்லியத்தைத் தவிர்க்கிறது.
- source_word: בֶּגֶד הַצֶּמֶר
  choice: கம்பளி ஆடை
  rationale: கம்பளி நூலால் செய்யப்பட்ட ஆடையை இயல்பான நவீனத் தமிழில் குறிக்கிறது.
- source_word: הַפִּשְׁתִּים
  choice: சணல் ஆடை
  rationale: פִּשְׁתִּים என்பது flax/linen-ஐக் குறிக்கிறது; இணையான முந்தைய தொடரால் ‘ஆடை’ என்பது பொருத்தமாக நிரப்பப்படுகிறது.
- source_word: הַשְּׁתִי ... הָעֵרֶב
  choice: நெசவின் நெடுக்குநூல் ... குறுக்குநூல்
  rationale: நெசவின் warp மற்றும் weft ஆகியவற்றைத் தொழில்நுட்பப் பொருள் கெடாமல் சாதாரண வாசகருக்கும் உடனடியாகப் புரியும் வகையில் கூறுகிறது.
- source_word: כָּל כְּלִי עוֹר
  choice: தோலால் செய்யப்பட்ட எந்தப் பொருள்
  rationale: כְּלִי என்பது பாத்திரம் மட்டுமல்லாமல் பலவகைப் பயன்பாட்டுப் பொருள்களைக் குறிக்கும்; இந்த விரிவை ‘எந்தப் பொருள்’ காக்கிறது.
- source_word: לְטַהֲרוֹ א֥וֹ לְטַמְּאוֹ
  choice: அது சுத்தமானது என்றோ தீட்டானது என்றோ அறிவிக்கப்பட வேண்டும்
  rationale: ஆசாரியரின் சடங்குசார் நிலைத் தீர்ப்பை வெளிப்படுத்துகிறது; உடலை அல்லது பொருளைத் தூய்மைப்படுத்தும் செயல் என்று தவறாகப் புரிந்துகொள்ளாமல் ‘அறிவிக்கப்பட’ என மொழிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: ஆடைகளுக்கும் தோல் பொருள்களுக்கும் பயன்படுத்தப்படும் צָרַעַת என்பதன் மொழிபெயர்ப்பு
  choice: தொழுநோய் போன்ற பாதிப்பு
  alternative: தொழுநோய்; தோல் நோய்; தீட்டுப்படுத்தும் பாதிப்பு
  rationale: இது நவீன மருத்துவத்தில் வரையறுக்கப்படும் தொழுநோயை மட்டும் குறிக்கவில்லை; மனிதத் தோலைப் பற்றிய வசனமும் அல்ல. எனவே பாரம்பரியத் தொடர்பை முற்றிலும் இழக்காமல், பொருள்களிலும் தோன்றக்கூடிய சடங்குசார் பாதிப்பு என்ற மூலத்தின் பரப்பை இந்தச் சொற்றொடர் காக்கிறது.
- issue: לְטַהֲרוֹ / לְטַמְּאוֹ என்பவை செயற்படுத்துதலா அல்லது நிலை அறிவிப்பா
  choice: சுத்தமானது அல்லது தீட்டானது என்று அறிவித்தல்
  alternative: சுத்தப்படுத்துதல் அல்லது தீட்டாக்குதல்
  rationale: லேவியராகமத்தின் ஆசாரியத் தீர்ப்பு சூழலில் இவை பொருளின் சடங்குசார் நிலையை நிர்ணயித்து அறிவிப்பதைக் குறிக்கின்றன; ஆசாரியர் அந்த நிலையை உடல்முறையில் உண்டாக்குகிறார் என்று உரை அவசியமாகச் சொல்லவில்லை.
translation_notes:
  register: நவீன, பொதுவாகப் புரியும், மரியாதைமிக்க தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘நெடுக்குநூல்/குறுக்குநூல்’ என்பவை அரிதான நெசவுத் தொழில்சொற்களுக்கு மாற்றாக விளக்கத் தெளிவை அளிக்கின்றன. ‘சுத்தம்/தீட்டு’ என்ற இணை சடங்குசார் நிலை வேறுபாட்டைத் தெளிவாக வைத்திருக்கிறது.
