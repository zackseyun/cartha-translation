source:
  edition: WLC
  text: וְ/צִוָּה֙ הַ/כֹּהֵ֔ן וְ/כִ֨בְּס֔וּ אֵ֥ת אֲשֶׁר בּ֖/וֹ הַ/נָּ֑גַע וְ/הִסְגִּיר֥/וֹ שִׁבְעַת יָמִ֖ים שֵׁנִֽית־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/054.yaml
  text: Then the priest shall command them to wash the thing in which the infection is[b][a], and he shall quarantine it for seven days a second time.
translation:
  language: ta
  text: பின்பு ஆசாரியன், பாதிப்பு காணப்படும் பொருளைக் கழுவும்படி கட்டளையிட வேண்டும்; அதை இரண்டாவது முறையாக ஏழு நாட்களுக்குத் தனியே அடைத்து வைக்க வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தனிமைப்படுத்தி வைக்க வேண்டும்” என்றும், இன்னும் சொற்சார்ந்த முறையில் “மூடி வைக்க வேண்டும்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִוָּה הַכֹּהֵן
  choice: பின்பு ஆசாரியன் ... கட்டளையிட்டு
  rationale: சட்டவழிமுறைத் தொடரில் வரும் வாவ் + நிறைவுவினை அடுத்த நடவடிக்கையைச் சுட்டுகிறது. ‘பின்பு’ நடைமுறை வரிசையை இயல்பாக வெளிப்படுத்துகிறது; ‘ஆசாரியன்’ என்பது הכהן என்பதற்கான நிலையான தமிழ் வழக்கு.
- source_word: וְכִבְּסוּ
  choice: கழுவும்படி
  rationale: மூன்றாம் நபர் பன்மை வினையின் செய்பவர்கள் குறிப்பிடப்படவில்லை. தமிழில் அவர்களைத் தேவையின்றிச் சேர்க்காமல், ஆசாரியனின் கட்டளைக்குரிய செயலை ‘கழுவும்படி’ என இயல்பாகக் கூறலாம்.
- source_word: אֵת אֲשֶׁר בּוֹ הַנָּגַע
  choice: பாதிப்பு உள்ள பொருளை
  rationale: எபிரெய உறவுத்தொடர் ஆய்வுக்குட்பட்ட உடை, தோல் அல்லது நெய்த பொருளைச் சூழலில் குறித்தாலும், குறிப்பிட்ட வகையை இங்கு சொல்லவில்லை. ‘பொருள்’ அந்தப் பரந்த குறிப்பைப் பாதுகாக்கிறது.
- source_word: הַנָּגַע
  choice: பாதிப்பு
  rationale: இந்தச் சூழலில் உயிரற்ற பொருளில் காணப்படும் தீவிரமான கறை/தொற்று போன்ற நிலையை இச்சொல் குறிக்கிறது. ‘பாதிப்பு’ மருத்துவத் தொற்றை மட்டும் உறுதிப்படுத்தாமல் எபிரெயச் சொல்லின் பரப்பைத் தக்கவைக்கிறது.
- source_word: וְהִסְגִּירוֹ
  choice: அதை ... தனியே அடைத்துவைக்க வேண்டும்
  rationale: סגר என்பது பரிசோதனைக்காக மூடி அல்லது தனிமைப்படுத்தி வைப்பதைக் குறிக்கிறது. பொருளைக் குறிக்கும் இச்சூழலில் ‘தனியே அடைத்துவைக்க’ என்பது ‘தனிமைப்படுத்து’ என்பதைவிட இயல்பாகவும், அடிப்படைச் சொல்லின் ‘shut up’ உணர்விற்கு நெருக்கமாகவும் உள்ளது.
- source_word: שִׁבְעַת יָמִים שֵׁנִית
  choice: மீண்டும் ஏழு நாட்கள்
  rationale: இது ஏழு நாள் அடைத்துவைப்பு இரண்டாவது முறையாக நடைபெறுவதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
