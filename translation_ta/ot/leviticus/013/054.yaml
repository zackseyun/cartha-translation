translation_notes:
  register: நவீன நிலையான தமிழில், லேவியராகமத்தின் சட்டவழிமுறைத் தொனியைத் தக்கவைத்து மொழிபெயர்க்கப்பட்டது. எபிரெயத்தில் செய்பவர்கள் குறிப்பிடப்படாத இடத்தில் தமிழிலும் அவர்களைச் சேர்க்கவில்லை; ஆய்வுக்குட்பட்ட பொருளின் வகையும் தேவையின்றிக் குறுக்கப்படவில்லை.
