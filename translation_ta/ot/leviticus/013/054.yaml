    text: “தனிமைப்படுத்தி வைக்க வேண்டும்” என்றும், இன்னும் சொற்சார்ந்த முறையில் “மூடி வைக்க வேண்டும்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  revision_rationale: The revision preserves the Hebrew’s broad reference to the affected item and its procedural legal style, while clarifying that the seven-day confinement is the second such period. The revised note now supplies real lexical alternatives for הִסְגִּירוֹ and remains anchored to the confinement expression.
