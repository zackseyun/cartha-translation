revisions:
- from: ஆனால் அவள் ஒரு பெண் குழந்தையைப் பெற்றெடுத்தால், மாதவிடாய்த் தீட்டின்போது இருப்பதுபோல இரண்டு வாரங்கள் தீட்டுள்ளவளாக இருப்பாள்[a]; மேலும், அறுபத்தாறு நாட்கள் தூய்மைப்படுத்துதலுக்குரிய இரத்தப்போக்கின் நிலையில் இருப்பாள்[b].
  to: ஆனால் அவள் பெண் குழந்தையைப் பெற்றெடுத்தால், தன் மாதவிடாய் காலத்தில் இருப்பதுபோல் இரண்டு வாரங்கள் தீட்டானவளாக இருப்பாள்[a]; மேலும் அறுபத்தாறு நாட்கள் தூய்மைப்படுத்துதலின் இரத்தக் காலத்தில் இருப்பாள்[b].
  rationale: The revision removes the unsupported specification of an active ‘blood flow’ while preserving the source’s blood-related ritual expression and its stated duration. It also improves the naturalness of the ritual-impurity wording. The notes retain the needed clarification that ritual impurity is not a statement of moral guilt.
