base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/005.yaml
  text: But if she gives birth to a female child[a], then she shall be unclean for two weeks, as in her menstruation[b]; and for sixty-six days she shall remain in the blood of purification.
translation:
  language: ta
  text: ஆனால் அவள் பெண் குழந்தையைப் பெற்றெடுத்தால், தன் மாதவிடாய் காலத்தில் இருப்பதுபோல் இரண்டு வாரங்கள் தீட்டானவளாக இருப்பாள்[a]; மேலும் அறுபத்தாறு நாட்கள் தூய்மைப்படுத்துதலின் இரத்தக் காலத்தில் இருப்பாள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு ‘தீட்டு’ என்பது திருச்சட்டத்தின்படியான சடங்குமுறை நிலையைக் குறிக்கிறது; ஒழுக்கக் குற்றத்தையோ தனிப்பட்ட பாவத்தையோ குறிக்கவில்லை. எபிரெயம் பிரசவத்துக்குப் பிந்தைய அவளுடைய நிலையை, அவளது மாதவிடாய் காலத்தோடு தொடர்புடைய தீட்டு நிலையுடன் ஒப்பிடுகிறது.
    reason: cultural_note
  - marker: b
    text: சொல்லுக்குச் சொல், ‘தூய்மைப்படுத்துதலின் இரத்தங்கள்.’ இது ஒழுக்கக் குற்றத்திலிருந்து தூய்மையாவதைக் குறிக்காமல், பிரசவத்துக்குப் பிந்தைய நிர்ணயிக்கப்பட்ட தூய்மைப்படுத்தும் காலத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: ஆனால் ... பெற்றெடுத்தால்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட ஆண் குழந்தைப் பிறப்பிலிருந்து மாறுபடும் நிலையை அறிமுகப்படுத்துகிறது; எபிரெய இணைப்புச் சொல்லின் சூழல்சார் மாறுபாட்டு வலிமையை ‘ஆனால்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: נְקֵבָה תֵלֵד
  choice: ஒரு பெண் குழந்தையைப் பெற்றெடுத்தால்
  rationale: נְקֵבָה என்பது இங்கு குழந்தையின் பாலினத்தைச் சுட்டும் ‘பெண்’; ילד வினை பிரசவச் சூழலில் ‘பெற்றெடு’ என்று இயல்பாக வழங்கப்படுகிறது.
- source_word: וְטָמְאָה
  choice: தீட்டுள்ளவளாக இருப்பாள்
  rationale: טמא இங்கு பாவத்தையோ ஒழுக்கக் குற்றத்தையோ அல்ல, திருச்சட்டத்தின்படியான சடங்குமுறை நிலையைக் குறிக்கிறது. ‘தீட்டு’ தமிழில் அந்தச் சட்டவகையைச் சுருக்கமாகக் காட்டுகிறது; அதன் பொருள் அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
- source_word: שְׁבֻעַיִם
  choice: இரண்டு வாரங்கள்
  rationale: இருமை வடிவம் இச்சூழலில் இரண்டு வாரங்களைக் குறிக்கிறது; எண்ணிக்கையை நவீன தமிழில் தெளிவாக வழங்குகிறது.
- source_word: כְּנִדָּתָהּ
  choice: மாதவிடாய்த் தீட்டின்போது இருப்பதுபோல
  rationale: נִדָּה என்பது மாதவிடாயுடன் தொடர்புடைய காலத்தையும் சடங்குமுறை நிலையையும் குறிக்கக்கூடும். ஒப்பீட்டையும் சடங்குமுறைப் பொருளையும் தமிழில் தெளிவாகப் பாதுகாக்கிறது.
- source_word: וְשִׁשִּׁים יוֹם וְשֵׁשֶׁת יָמִים
  choice: அறுபத்தாறு நாட்கள்
  rationale: ‘அறுபது நாட்களும் ஆறு நாட்களும்’ என்ற எபிரெய எண்ணமைப்பை இயல்பான தமிழ் எண்ணாக இணைக்கிறது; அளவு மாறாது.
- source_word: תֵּשֵׁב
  choice: இருப்பாள்
  rationale: சொல்லுக்குச் சொல் பொருள் ‘அமர்வாள்/தங்குவாள்’ என்றாலும், சட்டச் சூழலில் ஒரு குறிப்பிட்ட நிலையில் தொடர்ந்து இருப்பதைக் குறிக்கிறது.
- source_word: דְּמֵי טָהֳרָה
  choice: தூய்மைப்படுத்துதலுக்குரிய இரத்தப்போக்கு
  rationale: எபிரெயில் சொல்லுக்குச் சொல் ‘தூய்மைப்படுத்துதலின் இரத்தங்கள்’ எனும் பன்மை மரபுத்தொடர் உள்ளது. தமிழில் இயல்பாக இருக்கவும், இரத்தத்தைப் பற்றிய மூல உருவகத்தைப் பாதுகாக்கவும் இவ்வாறு வழங்கப்படுகிறது.
theological_decisions:
- issue: பிரசவத்துக்குப் பிந்தைய טמא என்ற தீட்டு நிலையின் இயல்பு
  choice: ‘தீட்டுள்ளவளாக’ என்று மொழிபெயர்த்து, இது சடங்குமுறை நிலை என்பதை அடிக்குறிப்பில் விளக்குதல்
  alternative: ‘சடங்குமுறைப்படி தூய்மையற்றவளாக’ என்று முதன்மை உரையிலேயே விரிவுபடுத்துதல்
  rationale: மூலத்தில் ‘சடங்குமுறைப்படி’ என்ற விளக்கச் சொல் இல்லை. இருப்பினும் இப்பகுதி ஒழுக்கக் குற்றத்தையோ தனிப்பட்ட பாவத்தையோ கூறவில்லை. ஆகவே மூலத்தின் சட்டச் சொல்லை உரையில் வைத்துப் பொருளை அடிக்குறிப்பில் தெளிவுபடுத்துகிறது.
- issue: דְּמֵי טָהֳרָה என்பது தொடர்ச்சியான இரத்தப்போக்கையா அல்லது நிர்ணயிக்கப்பட்ட தூய்மைப்படுத்தும் காலத்தையா குறிக்கிறது
  choice: மூலத்தின் ‘இரத்தம்’ சார்ந்த மொழியை முதன்மை உரையில் பாதுகாத்து, அது பிரசவத்துக்குப் பிந்தைய நிர்ணயிக்கப்பட்ட தூய்மைப்படுத்தும் காலத்தைக் குறிக்கிறது என்று அடிக்குறிப்பில் விளக்குதல்
  alternative: ‘தூய்மைப்படுத்தும் காலத்தில் இருப்பாள்’ என்று மட்டும் மொழிபெயர்த்தல்
  rationale: ‘காலம்’ என்று மட்டும் வழங்குவது வாசிப்பை எளிதாக்கினாலும், மூலத்தில் வெளிப்படையாக உள்ள இரத்தம் சார்ந்த சொல்லை நீக்கிவிடும். முதன்மை உரையும் அடிக்குறிப்பும் இணைந்து சொற்படிமத்தையும் சூழல்சார் பொருளையும் காக்கின்றன.
translation_notes:
  register: நவீன தரத் தமிழில், சட்டவாக்கியத்தின் கண்ணியமும் சுருக்கமும் காக்கப்பட்டுள்ளன. ‘தீட்டு’ என்ற சொல் தமிழ்ச் சமூகத்தில் வேறு தவறான தொடர்புகளை எழுப்பக்கூடும் என்பதால், அதன் லேவியராகமச் சடங்குமுறைப் பொருள் அடிக்குறிப்பில் கட்டுப்படுத்தப்பட்டுள்ளது. மூலத்தின் ‘இரத்தங்கள்’ என்ற மரபுத்தொடர் இயல்பான ஒருமைச் சார்ந்த தமிழாக வழங்கப்பட்டாலும், அதன் உருவகம் நீக்கப்படவில்லை.
