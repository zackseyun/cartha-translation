  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וּ/בַ/יּ֖וֹם הַ/שְּׁמִינִ֑י יִמּ֖וֹל בְּשַׂ֥ר עָרְלָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/003.yaml
  text: And on the eighth day the flesh of his foreskin shall be circumcised[a].
translation:
  language: ta
  text: எட்டாம் நாளில் அவனுடைய நுனித்தோலின் சதை விருத்தசேதனம் செய்யப்பட வேண்டும்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதை இன்னும் இயல்பான செயல்வடிவில், ‘எட்டாம் நாளில் அவனுக்கு விருத்தசேதனம் செய்ய வேண்டும்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய மொழியில் வினை செயப்பாட்டு வடிவில் இருப்பதால் முதன்மைப் பாடம் அந்த வடிவைக் காக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַ/יּוֹם
  choice: நாளில்
  rationale: וְ இணைப்புடன் வரும் בַּיּוֹם இங்கு காலத்தைக் குறிக்கிறது. தொடர்ச்சியான சட்ட அறிவுறுத்தலில் தமிழில் தனி இணைப்புச்சொல் சேர்க்காமல் ‘நாளில்’ என்று மொழிபெயர்ப்பது இயல்பாகவும் பொருள் துல்லியமாகவும் உள்ளது.
- source_word: הַ/שְּׁמִינִי
  choice: எட்டாம்
  rationale: ‘நாள்’ என்பதைத் தழுவி வரும் வரிசை எண்ணை நவீனத் தமிழில் நேரடியாகக் காட்டுகிறது.
- source_word: יִמּוֹל
  choice: விருத்தசேதனம் செய்யப்பட வேண்டும்
  rationale: மூல எபிரெய வினை நிஃபால் வடிவில் இருப்பதால் அதன் செயல்பாட்டு/செயப்பாட்டு வடிவையும் சட்டக் கட்டளையின் வலிமையையும் இம்மொழிபெயர்ப்பு காக்கிறது.
- source_word: בְּשַׂר
  choice: சதை
  rationale: இச்சொல்லின் அடிப்படைப் பொருள் ‘சதை’; அடுத்த பெயர்ச்சொல்லுடன் இணைந்துள்ள அமைப்பையும் மொழிபெயர்ப்பு காக்கிறது.
- source_word: עָרְלָתוֹ
  choice: அவனுடைய நுனித்தோலின்
  rationale: עָרְלָה என்பது ஆணுறுப்பின் நுனித்தோலைக் குறிக்கிறது; மூன்றாம் நபர் ஆண்பால் ஒருமை உடைமை விகுதி ‘அவனுடைய’ என்று வெளிப்படுத்தப்பட்டுள்ளது.
theological_decisions: []
translation_notes:
  register: நவீன தரத் தமிழில், சட்ட அறிவுறுத்தலுக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘விருத்தசேதனம்’ என்பது துல்லியமான மரபுப் பதமாக வைக்கப்பட்டுள்ளது; பழமையான ‘பண்ணப்படக்கடவது’ போன்ற நடைகள் தவிர்க்கப்பட்டுள்ளன.
