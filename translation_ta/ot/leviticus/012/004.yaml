base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/004.yaml
  text: Then she shall remain for thirty-three days in the blood of her purification. She shall not touch any holy thing[a], and she shall not come into the sanctuary, until the days of her purification are completed.
translation:
  language: ta
  text: பின்னர், அவள் முப்பத்து மூன்று நாட்கள் தனது தூய்மைப்படுத்துதலின் இரத்தத்தில் இருக்க வேண்டும்.[a] அவளுடைய தூய்மைப்படுத்துதலின் நாட்கள் நிறைவடையும்வரை, அவள் எந்தப் பரிசுத்தமான பொருளையும் தொடக்கூடாது; பரிசுத்த ஸ்தலத்திற்குள் வரவும் கூடாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத் தொடர் சொற்சொல்லாக, “தூய்மைப்படுத்துதலின் இரத்தத்தில்” என்று உள்ளது; ‘இரத்தம்’ பன்மையாகவும் புரிந்துகொள்ளப்படலாம். இது சடங்குசார் தூய்மைப்படுத்துதலோடு தொடர்புடைய பிரசவத்துக்குப் பிந்தைய காலத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׁלֹשִׁים יוֹם וּ/שְׁלֹשֶׁת יָמִים
  choice: முப்பத்து மூன்று நாட்கள்
  rationale: எபிரெய மொழியில் சொற்சொல்லாக ‘முப்பது நாட்களும் மூன்று நாட்களும்’ என்று எண்ணப்பட்டாலும், இயல்பான நவீன தமிழில் மொத்த எண்ணிக்கை இவ்வாறு கூறப்படுகிறது.
- source_word: תֵּשֵׁב
  choice: நிலைத்திருக்க வேண்டும்
  rationale: יָשַׁב என்பதன் அடிப்படைப் பொருள் ‘அமர்தல்/தங்குதல்/நிலைத்திருத்தல்.’ இச்சடங்குச் சட்டச் சூழலில் ஒரு குறிப்பிட்ட நிலையில் தொடர்ந்து இருப்பதைக் குறிக்கிறது.
- source_word: בִּ/דְמֵי טָהֳרָה
  choice: தனது தூய்மைப்படுத்துதலுக்குரிய இரத்தப்போக்கில்
  rationale: கடினமான இத்தொடரின் ‘இரத்தம்’ என்ற நேரடியான படிமத்தைப் பாதுகாத்து, பிரசவத்துக்குப் பிந்தைய காலத்தைக் குறிப்பது தமிழில் புரியும்படி ‘இரத்தப்போக்கு’ என வழங்கப்பட்டுள்ளது; טָהֳרָה சடங்குசார் தூய்மைநிலையைக் குறிக்கிறது.
- source_word: בְּ/כָל קֹדֶשׁ
  choice: பரிசுத்தமான எதையும்
  rationale: ‘எந்தப் பரிசுத்தமான பொருளையும்’ என்ற பரந்த பொருளை இயல்பான தமிழில் தருகிறது; குறிப்பிட்ட ஒரு பொருளாக தேவையின்றி வரையறுக்கவில்லை.
- source_word: לֹא תִגָּע
  choice: தொடக்கூடாது
  rationale: சட்டப்பூர்வமான தடையை நவீன தமிழில் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: וְ/אֶל הַ/מִּקְדָּשׁ לֹא תָבֹא
  choice: பரிசுத்த இடத்திற்குள் வரவும் கூடாது
  rationale: מִקְדָּשׁ என்பது பரிசுத்த இடம் அல்லது சரணாலயத்தைக் குறிக்கிறது. ‘உள்ளே’ என்ற இடவியல் கருத்தை ‘-க்குள்’ தெளிவாக்குகிறது; בוא என்பதன் ‘வருதல்’ பொருளும் காக்கப்படுகிறது.
- source_word: עַד מְלֹאת יְמֵי טָהֳרָהּ
  choice: அவளுடைய தூய்மைப்படுத்துதலின் நாட்கள் நிறைவடையும்வரை
  rationale: முழுமை அடைதல் என்ற מְלֹאת-இன் பொருளையும், பெண்பால் உடைமை விகுதியையும் வெளிப்படையாகக் காக்கிறது.
theological_decisions:
- issue: சடங்குசார் தூய்மைச் சொல்லை ஒழுக்கக் குற்றமாகப் பொருள்படாமல் மொழிபெயர்த்தல்
  choice: தூய்மைப்படுத்துதல்
  alternative: சுத்திகரிப்பு / தீட்டுநீக்கம்
  rationale: இவ்வசனம் பிரசவத்துக்குப் பிந்தைய சடங்குசார் நிலையைப் பற்றியது; தனிப்பட்ட ஒழுக்கப் பாவத்தைப் பற்றி அல்ல. ‘தூய்மைப்படுத்துதல்’ அந்த வழிபாட்டுச் சட்டக் கருத்தைப் பாதுகாத்து, உரை கூறாத குற்ற உணர்வைச் சேர்ப்பதைத் தவிர்க்கிறது.
- issue: בִּדְמֵי טָהֳרָה என்ற கடினமான தொடரின் தெளிவின்மை
  choice: தனது தூய்மைப்படுத்துதலுக்குரிய இரத்தப்போக்கில்
  alternative: தூய்மைப்படுத்துதலின் இரத்தத்தில்
  rationale: மூலத்தின் இரத்தப் படிமத்தையும் சடங்குசார் தொடர்பையும் காக்கிறது; ‘இரத்தப்போக்கு’ என்பது தமிழில் பிரசவத்துக்குப் பிந்தைய நிலையை வாசகர் புரிந்துகொள்ள உதவுகிறது. தொடரின் மொழியியல் கடினத்தன்மை அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், dignified சட்டநடை பேணப்பட்டுள்ளது. ‘பரிசுத்தம்’ மற்றும் ‘தூய்மைப்படுத்துதல்’ மூலம் קֹדֶשׁ மற்றும் טָהֳרָה ஆகிய வேறுபட்ட வழிபாட்டுச் சொற்களின் வேறுபாடு முடிந்தவரை காக்கப்பட்டுள்ளது. வாக்கிய அமைப்பு இயல்பாக்கப்பட்டாலும் காலவரம்பும் இரு தடைகளும் மூலத்துக்கு நெருக்கமாக வைக்கப்பட்டுள்ளன.
