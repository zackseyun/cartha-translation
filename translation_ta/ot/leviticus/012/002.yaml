source:
  edition: WLC
  text: דַּבֵּ֞ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ לֵ/אמֹ֔ר אִשָּׁה֙ כִּ֣י תַזְרִ֔יעַ וְ/יָלְדָ֖ה זָכָ֑ר וְ/טָֽמְאָה֙ שִׁבְעַ֣ת יָמִ֔ים כִּ/ימֵ֛י נִדַּ֥ת דְּוֺתָ֖/הּ תִּטְמָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/002.yaml
  text: 'Speak to the sons of Israel[a], saying: If a woman conceives and gives birth to a male child, then she shall be unclean seven days[c][b]; she shall be unclean as in the days of her menstrual impurity.'
translation:
  language: ta
  text: '“இஸ்ரவேல் மக்களிடம்[a] சொல்: ‘ஒரு பெண் கருவுற்று ஆண் குழந்தையைப் பெற்றால்[b], அவள் ஏழு நாட்கள் தீட்டுள்ளவளாக இருப்பாள்[c]. அவளுடைய மாதவிடாய்த் தீட்டின் நாட்களைப்போல அவள் தீட்டுள்ளவளாக இருப்பாள்.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்கு சொல், “இஸ்ரவேலின் மகன்கள்”; இங்கு இஸ்ரவேல் மக்கள் அனைவரையும் குறிக்கும் தேசியப் பெயர்.
    reason: lexical_alternative
  - marker: b
    text: “பெற்றால்” என்பதற்குப் பதிலாக “பெறும்போது” என்றும் மொழிபெயர்க்கலாம்; எபிரெயத் துகள் ஒரு சட்ட நிலையை அறிமுகப்படுத்துகிறது.
    reason: lexical_alternative
  - marker: c
    text: இங்கு “தீட்டு” என்பது அறநெறிக் குற்றத்தையோ மருத்துவத் தூய்மையின்மையையோ அல்ல, மாதவிடாயுடன் தொடர்புடைய சடங்கியல் தீட்டு நிலையைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: எபிரெயச் சொற்றொடர் சொல்லுக்கு சொல் ‘இஸ்ரவேலின் மகன்கள்’ எனப் பொருள்பட்டாலும், இங்கு அது உடன்படிக்கை மக்களைக் குறிக்கும் வழக்கமான தேசியப் பெயர். நவீனத் தமிழில் ‘இஸ்ரவேல் மக்கள்’ என்பது இயல்பாகவும் உள்ளடக்கத்தை மாற்றாமலும் அமைகிறது.
- source_word: אִשָּׁה
  choice: ஒரு பெண்
  rationale: இந்தச் சட்டச் சூழலில் பொதுவாக ஒரு பெண்ணைக் குறிக்கிறது; ‘மனைவி’ என்ற பொருளைச் சூழல் கட்டாயப்படுத்தவில்லை.
- source_word: כִּי
  choice: பெற்றால்
  rationale: இது ஒரு குறிப்பிட்ட நிலை ஏற்பட்டால் பொருந்தும் சட்டத்தை அறிமுகப்படுத்தும் நிபந்தனைத் துகள். தமிழில் வினையுடன் இணையும் ‘-ஆல்’ அமைப்பு இயல்பான சட்ட நிபந்தனையைத் தெரிவிக்கிறது; ‘பெறும்போது’ என்பதும் சாத்தியம்.
- source_word: תַזְרִיעַ
  choice: கருவுற்று
  rationale: வேர்ச்சொல் விதை அல்லது சந்ததி உருவாதலைச் சுட்டினாலும், பிரசவத்துடன் வரும் இந்த மரபுத்தொடரில் கருத்தரித்தலைக் குறிக்கிறது. ‘கருவுற்று’ என்பது தெளிவான நவீனத் தமிழ்.
- source_word: וְיָלְדָה זָכָר
  choice: ஆண் குழந்தையைப் பெற்றால்
  rationale: זָכָר என்பதன் ஆண்பால் குறிப்பு தெளிவாகப் பாதுகாக்கப்படுகிறது; ‘மகனைப் பெற்றால்’ என்பதைவிட மூலத்தின் பாலின வகைப்பாட்டுக்கு இது நெருக்கமானது.
- source_word: וְטָמְאָה / תִּטְמָא
  choice: தீட்டுள்ளவளாக இருப்பாள்
  rationale: லேவியராகமத் தூய்மைச் சட்டங்களில் טמא குறிக்கும் அசுத்த நிலையைத் தமிழில் வழக்கமான வேதாகமச் சொல்லால் தருகிறது. மூலத்தில் இல்லாத ‘சடங்குமுறைப்படி’ என்ற விளக்கத்தை முதன்மை உரையில் சேர்க்காமல், அடிக்குறிப்பில் அதன் சடங்கியல் பொருள் தெளிவுபடுத்தப்படுகிறது.
- source_word: שִׁבְעַת יָמִים
  choice: ஏழு நாட்கள்
  rationale: எண்ணிக்கையும் கால அளவும் நேரடியாகத் தரப்படுகின்றன.
- source_word: נִדַּת דְּוֺתָהּ
  choice: மாதவிடாயின்போது அவள் தீட்டுள்ளவளாக இருப்பது
  rationale: நִדָּה மற்றும் דְּוֺתָהּ இணைந்து மாதவிடாயுடன் தொடர்புடைய தீட்டு நிலையைச் சுட்டுகின்றன. நோய் என்று தவறாகப் புரியவைக்காமல், நவீன வாசகருக்கு இயல்பாகப் பொருள் தெரிவிக்கப்படுகிறது.
- source_word: כִּימֵי
  choice: இருப்பதுபோலவே
  rationale: மாதவிடாயுடன் தொடர்புடைய தீட்டு நாட்களை ஒப்பீட்டின் அளவுகோலாக வைக்கும் எபிரெய அமைப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: טמא என்பதன் இயல்பு
  choice: தீட்டுள்ளவள்
  alternative: சடங்குமுறைப்படி தீட்டுள்ளவள்
  rationale: இச்சூழல் சடங்கியல் தூய்மை நிலையைப் பற்றியது. எனினும், எபிரெய வினை தானாகவே ‘சடங்குமுறைப்படி’ என்ற விளக்கச் சொல்லைக் கொண்டிருக்கவில்லை. ஆகவே முதன்மை உரை சுருக்கமாக வைக்கப்பட்டு, தவறான அறநெறி அல்லது மருத்துவப் பொருள் எழாமல் அடிக்குறிப்பில் விளக்கம் தரப்படுகிறது.
- issue: בְּנֵי יִשְׂרָאֵל என்பதன் பாலினமும் தேசியப் பொருளும்
  choice: இஸ்ரவேல் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரெய வடிவம் இலக்கணப்படி ஆண்பால் பன்மை என்றாலும், இங்கு அது முழு உடன்படிக்கை மக்களுக்கான நிலையான தேசியப் பெயர். தமிழில் சொல்லுக்கு சொல் வடிவம் ஆண்களை மட்டும் குறிக்கும் தவறான எண்ணத்தைத் தரலாம்; ‘இஸ்ரவேல் மக்கள்’ செயல்பாட்டு பொருளைத் துல்லியமாகப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான சட்டநடை பயன்படுத்தப்பட்டுள்ளது. ‘தீட்டு’ என்ற மரபான சொல்லின் சமூக அல்லது அறநெறிசார் தவறான வாசிப்பைத் தவிர்க்க அடிக்குறிப்பு சேர்க்கப்பட்டுள்ளது. மூலத்தின் நிபந்தனைத் தன்மையும் இறுதியில் தீட்டு நிலையை மீண்டும் கூறும் வலியுறுத்தலும் பாதுகாக்கப்பட்டுள்ளன.
