  yaml_path: translation/ot/leviticus/012/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ta
  text: 'யாவே மோசேயிடம் உரைத்தார்:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: உரைத்தார்
  rationale: דבר என்ற வினைச்சொல் தெய்வீக உரையை அறிமுகப்படுத்துகிறது. நவீனத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைய, எழுவாயுடன் சேர்த்து ‘உரைத்தார்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: எபிரெய மெய்யெழுத்துப் பெயரான יהוה என்பதை ஒரு பொதுப் பட்டமாக மாற்றாமல், தமிழில் நீண்டகாலமாக அறியப்பட்ட தனிப்பெயர் வடிவமான ‘யெகோவா’ என வழங்குகிறது.
- source_word: אֶל
  choice: -இடம்
  rationale: பேச்சின் பெறுநரைக் குறிக்கும் எபிரெய முன்னிடைச்சொல், தமிழின் இயல்பான வேற்றுமை வடிவமான ‘மோசேயிடம்’ என்பதில் வெளிப்படுத்தப்பட்டது.
- source_word: מֹשֶׁה
  choice: மோசே
  rationale: מֹשֶׁה என்ற தனிப்பெயரின் வழக்கமான தமிழ் வடிவம்.
- source_word: לֵאמֹר
  choice: உரைத்ததாவது
  rationale: தொடர்ந்து வரும் நேரடி உரையின் உள்ளடக்கத்தை அறிமுகப்படுத்தும் எபிரெய infinitive construct-ஐ, தமிழ் வேதாகம நடையில் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: யாவே
  rationale: மூலத்தில் பொதுப் பட்டமான ‘ஆண்டவர்’ அல்ல, நான்கு மெய்யெழுத்துகளைக் கொண்ட இறைத் தனிப்பெயரே உள்ளது. அதன் பெயர்த் தன்மையைப் பாதுகாத்து, தமிழில் பரவலாக அறியப்பட்ட ‘யெகோவா’ வடிவம் முதன்மை உரையில் பயன்படுத்தப்பட்டது; மாற்று ஒலிபெயர்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் சுருக்கமான, கண்ணியமான தெய்வீக உரை அறிமுகம். மூலத்தின் இணைப்புச் ‘וַ’ தமிழில் தனியாக ‘மேலும்’ என இடப்படாமல், தொடர்ச்சியான உரைநடையின் இயல்பில் உட்பொருளாக்கப்பட்டுள்ளது.
