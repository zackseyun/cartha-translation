base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/007.yaml
  text: And he shall present it before Yahweh and make atonement for her[a], and she shall be cleansed from the source of her blood. This is the law for the woman who gives birth, whether to a male or to a female.
translation:
  language: ta
  text: அவன் அதை யாவே முன்னிலையில் செலுத்தி, அவளுக்காகப் பரிகாரம் செய்வான்; அப்போது அவள் தன் இரத்தத்தின் ஊற்றிலிருந்து[a] தூய்மையாவாள். ஆண் குழந்தையையோ பெண் குழந்தையையோ பெற்றெடுக்கும் பெண்ணுக்கான சட்டம் இதுவே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தன் இரத்தப்போக்கிலிருந்து.’ எபிரெய மொழியில் சொல்லுக்குச் சொல், ‘தன் இரத்தத்தின் ஊற்றிலிருந்து’ என்று உள்ளது.
    reason: மָקוֹר என்ற சொல்லின் நேர்ப்பொருளான ‘ஊற்று/தோற்றுவாய்’ என்ற உருவகத்தையும், இச்சூழலில் சாத்தியமான ‘இரத்தப்போக்கு’ என்ற பொருளையும் ஒருங்கே காட்டுகிறது.
lexical_decisions:
- source_word: וְהִקְרִיבוֹ
  choice: அவன் அதைச் செலுத்துவான்
  rationale: קרב என்பதன் ஹிஃபில் வடிவம், முந்தைய வசனத்தில் கூறப்பட்ட பலியை ஆசாரியன் யாவே முன்னிலையில் கொண்டுவந்து செலுத்துவதைக் குறிக்கிறது. ‘செலுத்துவான்’ என்பது பலிசார் சூழலை இயல்பாகத் தெரிவிக்கிறது.
- source_word: לִפְנֵי יְהוָה
  choice: யாவே முன்னிலையில்
  rationale: לִפְנֵי என்பது ‘முன்னிலையில்’ அல்லது ‘சந்நிதியில்’ எனப் பொருள்படும். יהוה என்ற உடன்படிக்கைப் பெயர் ஒலிபெயர்ப்பாக ‘யாவே’ என வழங்கப்படுகிறது.
- source_word: וְכִפֶּר עָלֶיהָ
  choice: அவளுக்காகப் பரிகாரம் செய்வான்
  rationale: ஆசாரிய பலிசார் சூழலில் כפר என்பது பரிகாரம் செய்து தூய்மை நிலையை ஏற்படுத்துவதைக் குறிக்கிறது. ‘பரிகாரம்’ என்பது ஒரு குறிப்பிட்ட பாவநிவிர்த்திக் கோட்பாட்டைத் திணிக்காமல் சடங்குசார் பொருளைப் பேணுகிறது.
- source_word: וְטָהֲרָה
  choice: அவள் தூய்மையாவாள்
  rationale: தொடர்வினைப் பொருள் தரும் இந்த வினை, ஆசாரியச் செயலின் விளைவாக அவள் சடங்குமுறைப்படி தூய நிலையை அடைவதைக் குறிக்கிறது. ‘தூய்மையாவாள்’ என்பது Qal வடிவத்தின் விளைவுநிலையை இயல்பாகத் தருகிறது.
- source_word: מִמְּקֹר דָּמֶיהָ
  choice: தன் இரத்தத்தின் ஊற்றிலிருந்து
  rationale: מָקוֹר என்பதன் அடிப்படைப் பொருள் ‘ஊற்று, தோற்றுவாய்’. எபிரெய உருவகத்தை முதன்மை உரையில் பேணி, சூழலுக்குரிய ‘இரத்தப்போக்கு’ என்ற பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: זֹאת תּוֹרַת
  choice: சட்டம் இதுவே
  rationale: இங்கு תּוֹרָה குறிப்பிட்ட சடங்குமுறை விதியை அல்லது நியமத்தைக் குறிக்கிறது; லேவியராகமச் சூழலில் ‘சட்டம்’ தெளிவானதும் மரபானதும் ஆகும்.
- source_word: הַיֹּלֶדֶת
  choice: பெற்றெடுக்கும் பெண்
  rationale: பெண்பால் வினையெச்சம் குழந்தை பெற்றெடுக்கும் பெண்ணை நேரடியாகக் குறிக்கிறது; ‘தாய்’ என்பதைவிட மூலத்தின் செயற்பொருளை இது நெருக்கமாகப் பேணுகிறது.
- source_word: לַזָּכָר אֹו לַנְּקֵבָה
  choice: ஆண் குழந்தையையோ பெண் குழந்தையையையோ
  rationale: זָכָר மற்றும் נְקֵבָה ஆகியவை ‘ஆண், பெண்’ என்ற பாலினச் சொற்கள். தமிழில் பிறப்புச் சூழலைத் தெளிவாக்க ‘குழந்தை’ சேர்க்கப்படுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூல உரையில் நான்கெழுத்து உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது. அதனை பொதுப்பட்டமாக மாற்றாமல், ஏற்ற ஒலிபெயர்ப்பான ‘யாவே’ என வழங்குவது பெயரின் தனித்தன்மையைப் பேணுகிறது.
- issue: כפר என்பதன் பலிசார் பொருள்
  choice: பரிகாரம் செய்வான்
  alternative: பாவநிவிர்த்தி செய்வான்
  rationale: இந்தச் சூழல் பிரசவத்துக்குப் பிந்தைய சடங்குத் தூய்மையைப் பற்றியது. ‘பரிகாரம்’ மூலச் சொல்லின் பலிசார் செயல்பாட்டைத் தெரிவிக்கிறது; பிரசவம் தானே ஒழுக்கப் பாவம் என்று தவறாக உணர்த்துவதைத் தவிர்க்கிறது.
- issue: טהר குறிக்கும் தூய்மை
  choice: தூய்மையாவாள்
  alternative: சுத்திகரிக்கப்படுவாள்
  rationale: இங்கு பேசப்படுவது லேவியராகமச் சடங்குமுறைத் தூய்மை. Qal வினை வடிவத்தின் நிலைமாற்றத்தையும் மூலத்தின் இறையியல் பதற்றத்தையும் பேண ‘தூய்மையாவாள்’ பயன்படுத்தப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. லேவியராகமத்தின் சடங்குமுறைச் சொற்கள் தெளிவாக வைக்கப்பட்டுள்ளன; பிரசவத்தை ஒழுக்கக் குற்றமாகக் காட்டும் மொழி தவிர்க்கப்பட்டுள்ளது. மூல எபிரெயத்தின் ‘இரத்தத்தின் ஊற்று’ என்ற உருவகம் முதன்மை உரையில் பாதுகாக்கப்பட்டு, இயல்பான மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
