base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/006.yaml
  text: And when the days of her purification are completed[a], whether for a son or for a daughter, she shall bring a year-old lamb for a burnt offering, and a young pigeon or a turtledove for a sin offering, to the priest at the entrance of the tent of meeting.
translation:
  language: ta
  text: அவளுடைய தூய்மைப்படுத்தலுக்குரிய நாட்கள்—மகனைப் பெற்றதற்கானவையோ மகளைப் பெற்றதற்கானவையோ—முடிவடைந்ததும், ஓராண்டு வயதுள்ள ஒரு செம்மறியாட்டுக்குட்டியைத் தகனபலியாகவும், ஒரு புறாக்குஞ்சை அல்லது ஒரு காட்டுப்புறாவைப் பாவநிவாரணப் பலியாகவும்[a] சந்திப்புக் கூடாரத்தின் நுழைவாயிலில் உள்ள ஆசாரியனிடம் அவள் கொண்டுவர வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தூய்மைப்படுத்தும் பலியாகவும்.” எபிரெயச் சொல் ஒழுக்கப்பாவத்திற்கான பலியை மட்டும் அல்லாமல், சடங்குசார் தீட்டை நீக்குவதற்கான பலியையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בִ/מְלֹאת יְמֵי טָהֳרָהּ
  choice: அவளுடைய தூய்மைப்படுத்தலின் நாட்கள் ... நிறைவடைந்ததும்
  rationale: מלא உடன் வரும் காலக் கட்டமைப்பு ஒரு காலப்பகுதி முடிவடைவதைச் சுட்டுகிறது; טָהֳרָה இங்கு சடங்குசார் தூய்மைப்படுத்தலைக் குறிக்கிறது.
- source_word: לְבֵן אוֹ לְבַת
  choice: மகனைப் பெற்றதற்கானவையோ மகளைப் பெற்றதற்கானவையோ
  rationale: இரு பிரசவ நிலைகளுக்கும் விதி பொருந்துகிறது என்பதைத் தமிழில் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: תָּבִיא
  choice: அவள் கொண்டுவர வேண்டும்
  rationale: சட்டப்பகுதியில் உள்ள கட்டளைத் தன்மையை நவீனத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: כֶּבֶשׂ בֶּן שְׁנָתוֹ
  choice: ஓராண்டு வயதுள்ள ஓர் ஆட்டுக்குட்டி
  rationale: எபிரெயச் சொற்றொடரின் வயதுக் குறிப்பை நேரடியாகவும் தெளிவாகவும் தருகிறது.
- source_word: לְעֹלָה
  choice: தகனபலி
  rationale: עֹלָה என்பதற்கான நிலைபெற்ற பலியியல் சொல்; பலி முழுவதும் எரிக்கப்படுவதைக் குறிக்கிறது.
- source_word: וּבֶן יוֹנָה אוֹ תֹר
  choice: ஒரு புறாக்குஞ்சு அல்லது ஒரு காட்டுப்புறா
  rationale: בֶּן־יוֹנָה இளம் புறாவையும் תֹר குறிப்பிட்ட வகை புறாவான turtledove-ஐயும் வேறுபடுத்துகிறது.
- source_word: לְחַטָּאת
  choice: பாவநிவாரணப் பலி
  rationale: חַטָּאת என்பதற்கான மரபான பலியியல் பெயரைப் பிரதான உரையில் வைத்திருக்கிறது; இச்சூழலில் உள்ள சடங்குசார் தூய்மைப்படுத்தல் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד אֶל הַכֹּהֵן
  choice: ஆசரிப்புக் கூடாரத்தின் நுழைவிடத்திலுள்ள ஆசாரியனிடம்
  rationale: பலிகள் ஆசரிப்புக் கூடார நுழைவிடத்தில் இருக்கும் ஆசாரியனிடம் கொண்டுவரப்படுவதை எபிரெயச் சொல்வரிசையின் உறவுடன் இயல்பான தமிழில் காட்டுகிறது.
theological_decisions:
- issue: பிரசவத்திற்குப் பிந்தைய சூழலில் חַטָּאת என்பதன் பொருள்
  choice: பாவநிவாரணப் பலி
  alternative: தூய்மைப்படுத்தும் பலி
  rationale: இது லேவியராகமத்தில் நிலைபெற்ற தொழில்நுட்பப் பலிப்பெயர். ஆனால் இங்கு பிரசவம் ஒழுக்கப்பாவம் என்று கூறப்படவில்லை; சடங்குசார் தீட்டிலிருந்து மீளுதலே சூழல். ஆகவே மரபான பெயர் பிரதான உரையிலும், சூழலுக்கேற்ற மாற்றுப் பொருள் அடிக்குறிப்பிலும் வைக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான சட்ட-வழிபாட்டு நடை பயன்படுத்தப்பட்டுள்ளது. ‘தகனபலி’, ‘ஆசரிப்புக் கூடாரம்’, ‘ஆசாரியன்’ ஆகிய நிலைபெற்ற வேதாகமச் சொற்கள் துல்லியத்திற்காகத் தக்கவைக்கப்பட்டுள்ளன; வாக்கிய அமைப்பு பொதுவாசகருக்குப் புரியும்படி இயல்பாக்கப்பட்டுள்ளது.
