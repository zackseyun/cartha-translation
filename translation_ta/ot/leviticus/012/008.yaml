  text: וְ/אִם לֹ֨א תִמְצָ֣א יָדָ/הּ֮ דֵּ֣י שֶׂה֒ וְ/לָקְחָ֣ה שְׁתֵּֽי תֹרִ֗ים א֤וֹ שְׁנֵי֙ בְּנֵ֣י יוֹנָ֔ה אֶחָ֥ד לְ/עֹלָ֖ה וְ/אֶחָ֣ד לְ/חַטָּ֑את וְ/כִפֶּ֥ר עָלֶ֛י/הָ הַ/כֹּהֵ֖ן וְ/טָהֵֽרָה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/008.yaml
  text: But if she cannot afford a lamb[a], then she shall take two turtledoves or two young pigeons, one for a burnt offering and one for a sin offering; and the priest shall make atonement for her, and she shall be clean.
translation:
  language: ta
  text: ஆனால் ஓர் ஆட்டுக்குட்டியைச் செலுத்த அவளுக்கு வசதி இல்லையென்றால், இரண்டு காட்டுப்புறாக்களையோ இரண்டு புறாக்குஞ்சுகளையோ அவள் கொண்டுவர வேண்டும்; அவற்றில் ஒன்று தகனபலியாகவும் மற்றொன்று பாவநிவாரணப் பலியாகவும்[a] இருக்கும். ஆசாரியன் அவளுக்காகப் பாவநிவிர்த்தி செய்வான்; அப்போது அவள் தூய்மையாவாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தூய்மைப்படுத்தும் பலி.” இச்சூழலில் இந்தப் பலி குழந்தைப்பேற்றுக்குப் பிந்தைய சடங்குமுறைத் தீட்டை நீக்குவதற்குரியது.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִמְצָא יָדָהּ דֵּי שֶׂה
  choice: ஓர் ஆட்டுக்குட்டியைச் செலுத்த அவளுக்கு வசதி இல்லையென்றால்
  rationale: எபிரெய மொழியின் சொற்பொருள் ‘அவளுடைய கை ஓர் ஆட்டுக்குட்டிக்குப் போதுமானதைக் காணவில்லை’ என்பதாகும்; இது பொருளாதார வசதி அல்லது செலுத்தும் திறன் இல்லாமையைக் குறிக்கும் மரபுத்தொடர். இயல்பான நவீன தமிழில் அதன் கருத்தைத் தெளிவாகத் தருகிறது.
- source_word: שֶׂה
  choice: ஆட்டுக்குட்டி
  rationale: முந்தைய வசனத்தின் பலிச் சூழலில் இச்சொல் செம்மறியாட்டுக் குட்டியைக் குறிக்கிறது; தமிழில் இயல்பாகவும் தெளிவாகவும் ‘ஆட்டுக்குட்டி’ என வழங்கப்பட்டுள்ளது.
- source_word: שְׁתֵּי תֹרִים
  choice: இரண்டு காட்டுப்புறாக்கள்
  rationale: תֹרִים என்பது பொதுவான புறாக்களை அல்ல, turtledoves எனப்படும் காட்டுப்புறா வகையைச் சிறப்பாகக் குறிக்கிறது.
- source_word: שְׁנֵי בְּנֵי יוֹנָה
  choice: இரண்டு புறாக்குஞ்சுகள்
  rationale: ‘புறாவின் குஞ்சுகள்’ என்ற எபிரெய மரபுத்தொடரின் இயல்பான தமிழ் இணை; இளம் புறாக்களைக் குறிக்கிறது.
- source_word: עֹלָה
  choice: தகனபலி
  rationale: முழுவதும் எரிக்கப்படும் பலியைக் குறிக்கும் நிலைபெற்ற வேதாகமத் தமிழ் சொல்; மூலத்தின் பலியியல் பொருளைப் பேணுகிறது.
- source_word: חַטָּאת
  choice: பாவநிவாரணப் பலி
  rationale: חַטָּאת என்பதற்கான வழக்கமான பலியியல் பெயரைத் தொடர்கிறது. குழந்தைப்பேற்றுக்குப் பிந்தைய சடங்குத் தூய்மையே இங்கு சூழல் என்பதால் ‘தூய்மைப்படுத்தும் பலி’ என்ற மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְכִפֶּר עָלֶיהָ
  choice: ஆசாரியன் அவளுக்காகப் பாவநிவிர்த்தி செய்வான்
  rationale: כפר என்ற ஆசாரிய-பலியியல் வினையின் இறையியல் வலிமையைத் தக்கவைத்து, அதன் செயன்முறையைத் தேவையின்றி மிகத் துல்லியமாக வரையறுக்காமல் வழங்குகிறது.
- source_word: וְטָהֵרָה
  choice: அவள் தூய்மையாவாள்
  rationale: சடங்குமுறைத் தூய்மை மீண்டும் பெறப்படுவதைக் குறிக்கும் வினையைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: குழந்தைப்பேற்றுக்குப் பிந்தைய தூய்மைப்படுத்தல் சூழலில் חַטָּאת என்பதன் மொழிபெயர்ப்பு
  choice: பாவநிவாரணப் பலி
  alternative: தூய்மைப்படுத்தும் பலி
  rationale: இங்கு ஒழுக்கக்குற்றத்தைக் காட்டிலும் சடங்குமுறைத் தீட்டிலிருந்து தூய்மைப்படுத்தப்படுவதே சூழல். எனினும் חַטָּאת என்ற முக்கிய பலியியல் சொல்லின் வழக்கமான இணைப்பை முதன்மை உரையில் பேணி, சூழலுக்கு ஏற்ற மாற்றுப் பொருளை அடிக்குறிப்பில் தருவது மூலத்திலுள்ள இறையியல் இழுவிசையைத் தீர்த்துவிடாமல் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் பலியியல் சொற்களின் கண்ணியமான வேதாகம நடையைப் பேணியும் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் ஒரே நீண்ட வாக்கியம் தெளிவுக்காகத் தமிழில் மூன்று வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது; கட்டளையின் பொருளும் தொடர்ச்சியும் பேணப்பட்டுள்ளன.
