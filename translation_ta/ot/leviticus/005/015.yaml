revisions:
- from: ஒருவர் யாவேவுக்குரிய பரிசுத்தப் பொருட்கள் தொடர்பாக நம்பிக்கைத் துரோகம் செய்து, அறியாமல் பாவம் செய்தால், அவர் யாவேவுக்கு இழப்பீட்டுப் பலியாக[a] மந்தையிலிருந்து குறைபாடற்ற ஒரு செம்மறியாட்டுக் கடாவைக் கொண்டுவர வேண்டும். அதன் மதிப்பு, நீ மதிப்பிடுகிறபடி, பரிசுத்த இடத்தின் சேக்கல் கணக்கில்[b] வெள்ளிச் சேக்கல்களாக இருக்க வேண்டும். அது இழப்பீட்டுப் பலி.
  to: ஒருவர் யாவேவுக்குரிய பரிசுத்தப் பொருட்கள் தொடர்பாக நம்பிக்கைத் துரோகம் செய்து, அறியாமல் பாவம் செய்தால், அவர் யாவேவுக்குத் தனது இழப்பீட்டுப் பலியாக[a], உமது மதிப்பீட்டின்படி பரிசுத்த சேக்கல் கணக்கில் வெள்ளிச் சேக்கல்களுக்கு மதிப்பிடப்பட்ட, மந்தையிலிருந்து எடுக்கப்பட்ட குறைபாடற்ற ஒரு கடாவைக் கொண்டு வர வேண்டும்.
