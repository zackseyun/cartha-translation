base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/015.yaml
  text: 'If a person acts unfaithfully and sins unintentionally in regard to the holy things of Yahweh[a], he shall bring his compensation offering to Yahweh: an unblemished ram from the flock, according to your valuation in silver shekels, by the sanctuary shekel[b], for a guilt offering.'
translation:
  language: ta
  text: ஒருவர் யாவேவுக்குரிய பரிசுத்தப் பொருட்கள் தொடர்பாக நம்பிக்கைத் துரோகம் செய்து, அறியாமல் பாவம் செய்தால், அவர் யாவேவுக்குத் தனது இழப்பீட்டுப் பலியாக[a], உமது மதிப்பீட்டின்படி பரிசுத்த சேக்கல் கணக்கில் வெள்ளிச் சேக்கல்களுக்கு மதிப்பிடப்பட்ட, மந்தையிலிருந்து எடுக்கப்பட்ட குறைபாடற்ற ஒரு கடாவைக் கொண்டு வர வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல் אָשָׁם என்பதற்கு ‘குற்றநிவாரணப் பலி’ அல்லது ‘குற்றப்பலி’ என்றும் பொருள் கொள்ளலாம். அது குற்றத்தினால் உண்டாகும் பொறுப்பையும், அதற்கு ஈடுசெய்யும் பலியையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: ஒருவர்
  rationale: சட்ட உரையில் இந்தச் சொல் தனிநபரைக் குறிக்கிறது; ‘ஒருவர்’ என்பது இயல்பான பொதுமை ஒருமையைத் தக்கவைக்கிறது.
- source_word: תִמְעֹל מַעַל
  choice: நம்பிக்கைத் துரோகம் செய்து
  rationale: வினைச்சொல்–பெயர்ச்சொல் இணைப்பு, குறிப்பாகப் பரிசுத்தக் கடமைக்கு எதிரான விசுவாசமற்ற மீறலை வலியுறுத்துகிறது.
- source_word: וְחָטְאָה בִשְׁגָגָה
  choice: அறியாமல் பாவம் செய்தால்
  rationale: בִשְׁגָגָה வேண்டுமென்றே செய்யப்படாத, கவனக்குறைவான அல்லது அறியாமையிலான பாவத்தைக் குறிக்கிறது.
- source_word: מִקָּדְשֵׁי יְהוָה
  choice: யாவேவுக்குரிய பரிசுத்தப் பொருட்கள் தொடர்பாக
  rationale: மின் முன்னிடைச்சொல் இங்கு பாதிக்கப்பட்ட துறையையோ பொருளையோ குறிக்கிறது; ‘தொடர்பாக’ என்பது அதனைத் தேவையின்றிக் குறுக்காமல் காட்டுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், எபிரெய தனிப்பெயரின் தமிழாக்கமாக வழங்குகிறது.
- source_word: אֲשָׁמוֹ / לְאָשָׁם
  choice: இழப்பீட்டுப் பலி
  rationale: אָשָׁם குற்றப்பொறுப்பையும் அதற்கான நிவாரணம் அல்லது ஈடுசெய்யும் பலியையும் குறிக்கலாம்; பரிசுத்தப் பொருட்களில் ஏற்பட்ட இழப்பை மதிப்பிடும் இச்சூழலில் ஈடுசெய்யும் அம்சம் முன்னிலையில் உள்ளது.
- source_word: אַיִל תָּמִים
  choice: குறைபாடற்ற ஒரு செம்மறியாட்டுக் கடா
  rationale: பலிச் சூழலில் תָּמִים உடற்குறை அல்லது பழுது இல்லாததைக் குறிக்கிறது; אַיִל ஆண் செம்மறியாட்டைக் குறிக்கிறது.
- source_word: מִן הַצֹּאן
  choice: மந்தையிலிருந்து
  rationale: צֹאן சிறுகால்நடை மந்தையைக் குறிக்கிறது; אַיִל ஏற்கெனவே விலங்கைத் தெளிவுபடுத்துகிறது.
- source_word: בְּעֶרְכְּךָ כֶּסֶף שְׁקָלִים
  choice: அதன் மதிப்பு, நீ மதிப்பிடுகிறபடி, ... வெள்ளிச் சேக்கல்களாக இருக்க வேண்டும்
  rationale: இரண்டாம் நபர் ஒருமையில் உள்ள மதிப்பீட்டு மொழியைத் தக்கவைத்து, தமிழில் தெளிவான சட்டநடை வாக்கியமாக்குகிறது.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: பரிசுத்த இடத்தின் சேக்கல் கணக்கில்
  rationale: வழிபாட்டிட மதிப்பீடுகளுக்குப் பயன்படுத்தப்பட்ட அதிகாரப்பூர்வ எடைத் தரத்தைக் குறிக்கிறது.
theological_decisions:
- issue: אָשָׁם என்ற பலிவகையின் பொருள்
  choice: இழப்பீட்டுப் பலி
  alternative: குற்றநிவாரணப் பலி; குற்றப்பலி
  rationale: இச்சொல் குற்றநிலையையும் அதற்கான பலி வழி நிவாரணத்தையும் உள்ளடக்குகிறது. வெள்ளியில் மதிப்பிடப்படும் பரிசுத்த இழப்பு இங்கு ஈடுசெய்யும் அம்சத்தை முன்னிறுத்துவதால் ‘இழப்பீட்டுப் பலி’ தேர்ந்தெடுக்கப்பட்டது; மற்ற பொருள்கள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.
- issue: சட்ட உரையின் ஒருமை subject
  choice: ஒருவர் ... அவர்
  alternative: யாராவது ... அவர்கள்
  rationale: எபிரெய உரையின் பிரதிநிதித்துவ ஒருமையைத் தமிழில் இயல்பாகவும் தெளிவாகவும் தக்கவைக்கிறது.
- issue: מִקָּדְשֵׁי יְהוָה என்பதன் எல்லை
  choice: யாவேவுக்குரிய பரிசுத்தப் பொருட்கள் தொடர்பாக
  alternative: யாவேவின் பரிசுத்தப் பொருட்களுக்கு எதிராக; யாவேவின் பரிசுத்தப் பொருட்களிலிருந்து
  rationale: மீறல் காணிக்கை, புனித உடைமை அல்லது செலுத்தவேண்டிய பரிசுத்த பங்கு ஆகியவற்றில் எதனைச் சரியாகக் குறிக்கிறது என்பதை உரை மேலும் வரையறுக்காததால், அந்தத் திறந்த தன்மை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான சட்டநடை பயன்படுத்தப்பட்டுள்ளது. ‘பரிசுத்தப் பொருட்கள்’, ‘மதிப்பிடுகிறபடி’, ‘சேக்கல் கணக்கில்’ ஆகியவை ஆசாரச் சூழலைத் தக்கவைக்கின்றன; வாக்கியம் வாசிப்புத் தெளிவுக்காக இரண்டாகப் பிரிக்கப்பட்டுள்ளது.
