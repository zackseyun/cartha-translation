base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/004.yaml
  text: Or if a person swears rashly with his lips to do evil or to do good—whatever a man may utter in an oath—and it is hidden from him[a], and then he comes to know it and becomes guilty in one of these matters[b],
translation:
  language: ta
  text: அல்லது, ஒருவர் தன் உதடுகளால் அவசரமாகச் சத்தியம் செய்து, தீமை செய்யவோ நன்மை செய்யவோ என்று கூறினால்[a]—ஒரு மனிதன் சத்தியத்தில் வாயால் கூறும் எதைக் குறித்தும்—அது அவருக்குத் தெரியாமல் இருந்து[b], பின்னர் அவர் அதை அறிந்து, இவற்றில் ஒன்றில் குற்றவாளியாகினால்,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவசரமாக” என்பதற்கான எபிரெயச் சொல்லுக்கு அடிப்படையில் “வாயால் கூறுதல்” என்றும் பொருள் இருக்கலாம். ஆனால் இச்சூழலில் அது யோசனையற்ற அல்லது அவசரமான சத்தியத்தைக் குறிப்பதாகப் புரிந்துகொள்ளப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: நேரடியாக, “அது அவரிடமிருந்து மறைந்திருந்து.” சத்தியமோ, அதன் கடமையோ விளைவோ, அல்லது அதை மீறிய உண்மையோ அவரது கவனத்திலிருந்து மறைந்திருந்ததா என்பதை எபிரெய உரை வெளிப்படையாகக் கூறவில்லை.
    reason: source_ambiguity
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: ஒருவர்
  rationale: லேவியராகமத்தின் சட்டச் சூழலில் இது உடலிலிருந்து வேறான ‘ஆத்துமா’வைக் குறிக்காமல் ஒரு தனிநபரைக் குறிக்கிறது.
- source_word: תִשָּׁבַע / שְׁבֻעָה
  choice: சத்தியம் செய்தால் / சத்தியம் செய்து
  rationale: இங்கு வினையும் பெயரும் சத்தியம் அல்லது உறுதிமொழி செய்வதைக் குறிக்கின்றன; நவீன தமிழில் ‘சத்தியம் செய்தல்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: לְבַטֵּא בִשְׂפָתַיִם
  choice: தன் உதடுகளால் அவசரப்பட்டு
  rationale: בּטא என்பதன் அடிப்படைப் பொருள் வாயால் வெளிப்படையாகச் சொல்வது; இந்தச் சட்டச் சூழல் யோசனையற்ற அல்லது அவசரமான சத்தியத்தைக் குறிப்பதால் இரு கூறுகளும் மொழிபெயர்ப்பில் தக்கவைக்கப்பட்டன.
- source_word: לְהָרַע אוֹ לְהֵיטִיב
  choice: தீமை செய்யவோ நன்மை செய்யவோ
  rationale: எபிரெயச் சொற்றொடரின் எதிர்மறை–நேர்மறை இணைவை நெருக்கமாகத் தக்கவைத்து, சத்தியத்தின் உள்ளடக்கத்தைக் பரந்த வகையில் காட்டுகிறது.
- source_word: לְכֹל אֲשֶׁר יְבַטֵּא הָאָדָם בִּשְׁבֻעָה
  choice: ஒரு மனிதன் சத்தியம் செய்து வாயால் சொல்லக்கூடிய எதைக் குறித்தும்
  rationale: முந்தைய எடுத்துக்காட்டுகளைப் பொதுமைப்படுத்தும் சொற்றொடர்; הָאָדָם என்பதன் பொதுப்படையான மனிதக் குறிப்பையும், בּטא என்பதன் வாய்மொழிக் கூறையும் தக்கவைக்கிறது.
- source_word: וְנֶעְלַם מִמֶּנּוּ
  choice: அது அவருக்கு மறைந்திருந்து
  rationale: எபிரெயத்தின் செயப்பாட்டு வடிவையும், எது மறைந்திருந்தது என்பதில் உள்ள இயல்பான தெளிவின்மையையும் தீர்த்துவிடாமல் பாதுகாக்கிறது.
- source_word: וְהוּא יָדַע
  choice: பின்னர் அவர் அதை அறிந்து
  rationale: முன்னைய அறியாமைக்குப் பின் ஏற்படும் உணர்தலை நிகழ்வுகளின் தொடரில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְאָשֵׁם לְאַחַת מֵאֵלֶּה
  choice: இவற்றில் ஒன்றைக் குறித்து குற்றமுள்ளவரானால்
  rationale: முந்தைய சட்ட வழக்குகளில் ஏதாவது ஒன்றினால் ஏற்பட்ட குற்றப்பொறுப்பைக் குறிக்கிறது; அடுத்த வசனத்துடன் இணையும் நிபந்தனை அமைப்பும் தக்கவைக்கப்பட்டுள்ளது.
theological_decisions:
- issue: சட்டத்தின் பொதுப்படையான மனிதக் குறிப்பு
  choice: נֶפֶשׁ என்பதற்கு ‘ஒருவர்’ என்றும் הָאָדָם என்பதற்கு ‘ஒரு மனிதன்’ என்றும் மொழிபெயர்த்தல்
  alternative: இரண்டிற்கும் ‘ஒருவர்’ என்று மொழிபெயர்த்தல்
  rationale: மூலத்தில் உள்ள இரு வேறு சொற்களையும் ஓரளவு பிரதிபலிக்கிறது; ‘ஒரு மனிதன்’ இங்கு பெண்களை விலக்கும் குறிப்பு அல்ல, எந்த மனிதரையும் பிரதிநிதித்துவப்படுத்தும் பொதுப்படையான ஒருமை.
- issue: மறைந்திருந்ததன் சரியான குறிப்பு
  choice: ‘அது அவருக்கு மறைந்திருந்து’ என்று தெளிவின்மையைத் தக்கவைத்தல்
  alternative: ‘தான் செய்த சத்தியத்தை அவர் மறந்திருந்து’ அல்லது ‘அதன் விளைவை அவர் அறியாமல் இருந்து’
  rationale: மூலம் சத்தியமா, அதன் கடமையா, அல்லது அதை மீறியதா மறைந்திருந்தது என்பதை வெளிப்படையாகத் தீர்மானிக்கவில்லை; ஆகவே எந்த ஓர் விளக்கத்தையும் பிரதான உரையில் கட்டாயப்படுத்தவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், சட்டப்பகுதிக்கேற்ற கண்ணியமான ஆனால் எளிதில் புரியும் நடையில் வடிவமைக்கப்பட்டது. ‘ஆணையிடுதல்’ நவீன தமிழில் கட்டளையிடுதல் எனத் தவறாகப் புரியக்கூடும் என்பதால் ‘சத்தியம் செய்தல்’ பயன்படுத்தப்பட்டது. வசனம் அடுத்த வசனத்துடன் தொடர்வதால் இறுதியில் நிபந்தனைத் தொடர் மற்றும் காற்புள்ளி வைக்கப்பட்டுள்ளன.
