  source_fidelity: 'வரைவு எபிரெயச் சட்டநடை அமைப்பையும் முக்கியப் பொருள்களையும் பெரும்பாலும் சரியாகக் காக்கிறது: நபர், உதடுகளால் கூறப்படும் அவசரச் சத்தியம், தீமை/நன்மை, பின்னைய அறிதல், மற்றும் முன்சூழலின் வழக்குகளில் ஒன்றில் குற்றப்பொறுப்பு. ஆனால் “சத்தியம் செய்து வாயால் சொல்லக்கூடிய எதைக் குறித்தும்” என்பது மூலத்தின் பொதுமைப்படுத்தும் இடைச்சொற்றொடரைத் தமிழில் இயல்பாக வெளிப்படுத்தவில்லை; அது ‘எதைக் குறித்துச் சத்தியம் செய்கிறான்’ என்ற பொருளுக்கு நகரலாம். “அது அவருக்கு மறைந்திருந்து” என்பதும் நவீனத் தமிழில் இயல்பற்றது.'
