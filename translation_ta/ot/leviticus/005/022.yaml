  source_fidelity: மூலத்தின் முக்கிய கூறுகளான தொலைந்த பொருளைக் கண்டடைதல், அதைக் குறித்த மறுத்தல்/பொய், பொய்ச் சத்தியம், மற்றும் பொதுமைப்படுத்தும் முடிவுறாத தொடரமைப்பு ஆகியவை வரைவில் உள்ளன. ஆனால் “மனிதன் செய்து ... செயல்களில் ஏதேனும் ஒன்றைச் செய்தால்” என்பது எபிரெய வாக்கியத்தின் பொதுமைப்படுத்தலைத் தேவையற்றவாறு மீண்டும் நிபந்தனையாக்கி, தமிழில் பொருள் மங்கச் செய்கிறது. כִּחֵשׁ בָּהּ-இல் உள்ள மறுத்தல் நுணுக்கமும் வெளிப்பட வேண்டும்.
  naturalness: “காணாமற்போன ஒரு பொருளைக்” என்பதற்குப் பதில் “தொலைந்துபோன ஒரு பொருளைக்” நவீன நிலையான தமிழில் சற்றே இயல்பானது. “அதைப் பற்றி மறுத்துப் பொய் சொல்லி” என்பது சட்டவியல் சூழலிலும் தெளிவாகவும் இயல்பாகவும் உள்ளது. திருத்திய வாக்கியம் அடுத்த வசனத்தோடு இணையும் முடிவுறாத நீண்ட கோட்டைத் தக்கவைக்கிறது.
  terminology: “பொய்யாகச் சத்தியம் செய்தால்” என்பது וְנִשְׁבַּע עַל־שָׁקֶר என்பதற்கு இயல்பானதும் துல்லியமானதும். הָאָדָם-இன் பொதுப்பொருளை “மனிதன்” தக்கவைக்கிறது; இதை பாலினக் குறிப்பாகக் குறுக்கவில்லை. “பாவம் செய்வதற்காகச் செய்யும்” என்பது לַחֲטֹא בָהֵנָּה-வின் நோக்கு/தொடர்பு அமைப்பை மிகையாக விளக்காமல் தருகிறது.
