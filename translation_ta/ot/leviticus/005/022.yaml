  text: or he finds lost property and lies about it and swears falsely—about any one of all the things that a man may do to sin by them—
translation:
  language: ta
  text: அல்லது, தொலைந்துபோன ஒரு பொருளைக் கண்டெடுத்து, அதைப் பற்றி மறுத்துப் பொய் சொல்லி, பொய்யாகச் சத்தியம் செய்தால்—மனிதன் பாவம் செய்வதற்காகச் செய்யும் எல்லாச் செயல்களிலும் ஏதேனும் ஒன்றைப் பற்றி—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲבֵדָה
  choice: காணாமற்போன ஒரு பொருள்
  rationale: இழந்து போன அல்லது தொலைந்த உடைமையைக் குறிக்கும் பெயர்ச்சொல்லை நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் வழங்குகிறது.
- source_word: וְכִחֶשׁ בָּהּ
  choice: அதைக் குறித்து பொய் சொல்லி
  rationale: בָּהּ என்பது கண்டெடுத்த பொருளையே சுட்டுகிறது; மறுத்தல்/பொய் கூறுதல் என்ற பொருள் சூழலுக்கு ஏற்றவாறு வெளிப்படுகிறது.
- source_word: וְנִשְׁבַּע עַל שָׁקֶר
  choice: பொய்யாக ஆணையிட்டால்
  rationale: சத்தியம் செய்தல் என்ற கருத்தை மரியாதையான பொதுத் தமிழில் தருகிறது; பொய்யான உறுதிமொழியைத் தெளிவாக்குகிறது.
- source_word: הָאָדָם
  choice: மனிதன்
  rationale: எபிரெயச் சொல்லின் பொதுவான மனிதக் குறிப்பை ஒருமை வடிவில் பாதுகாக்கிறது; இங்கு குறிப்பிட்ட ஆணை மட்டும் குறிக்கவில்லை.
- source_word: לַחֲטֹא בָהֵנָּה
  choice: அவற்றால் பாவம் செய்யக்கூடிய
  rationale: בָהֵנָּה-வின் கருவி/தொடர்பு சார்ந்த தெளிவின்மையை மிகையாகத் தீர்க்காமல், செயல்கள் வழியாகப் பாவம் செய்வதைக் காட்டுகிறது.
theological_decisions:
- issue: הָאָדָם என்பதன் பாலின மற்றும் பொதுமைப் பொருள்
  choice: மனிதன்
  alternative: ஒருவர்
  rationale: மூலத்தின் ஒருமை பொதுப்பெயரை நெருக்கமாகப் பாதுகாக்கிறது; இதனை ஆண்களுக்கு மட்டுமே உரிய கட்டளையாகக் குறுக்கவில்லை.
- issue: בָהֵנָּה என்பதன் தொடர்பு
  choice: அவற்றால் பாவம் செய்யக்கூடிய
  alternative: அவற்றில் பாவம் செய்யக்கூடிய
  rationale: எபிரெய முன்சொல்லின் நெகிழ்வை ஏற்றுக்கொண்டு, செயல்களே பாவத்திற்கு வழியாக இருப்பதைச் சொல்கிறது; குறிப்பிட்ட இறையியல் விளக்கத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; சட்டவிதியின் தொடர்ச்சியான வாக்கிய அமைப்பையும், அடுத்த வசனத்துடன் இணையும் முடிவுறாத ஓட்டத்தையும் இறுதி நீண்ட கோடு மூலம் பாதுகாக்கிறது. சொற்கள் dignified ஆனாலும் சாதாரண வாசகருக்குப் புரியும் வகையில் அமைக்கப்பட்டுள்ளன.
