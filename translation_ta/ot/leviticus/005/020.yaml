- from: 'யெகோவா மோசேயிடம் பேசிச் சொன்னது:'
  to: 'யெகோவா மோசேயிடம் கூறினார்:'
  rationale: The revision corrects the inconsistent neuter verb and uses a concise, dignified modern Tamil speech formula. It retains the established personal-name rendering “யெகோவா,” the standard name “மோசே,” and the open colon required by לֵאמֹר to introduce the divine speech in the following verse.
