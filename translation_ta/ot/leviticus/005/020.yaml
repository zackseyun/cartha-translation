  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ta
  text: 'யெகோவா மோசேயிடம் கூறினார்:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பேசினார்
  rationale: דבר என்ற வினைச்சொல் புதிய இறைஉரைப் பகுதியைத் தொடங்கும் வழக்கமான கதைநடை வடிவில் உள்ளது; தமிழில் ‘பேசினார்’ இயல்பாகவும் முறையாகவும் அமைகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: இது יהוה என்ற இறைப் பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு; ‘கர்த்தர்’ போன்ற பட்டப்பெயராக மாற்றாமல் தனிப்பெயராகப் பாதுகாக்கிறது.
- source_word: אֶל
  choice: -இடம்
  rationale: பேச்சின் மறைமுகச் செயப்படுபொருளைக் குறிக்கும் எபிரெய முன்னிடைச்சொல்; ‘மோசேயிடம்’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: מֹשֶׁה
  choice: மோசே
  rationale: எபிரெய தனிப்பெயருக்கான தமிழில் பரவலாக அறியப்பட்ட வடிவம்.
- source_word: לֵאמֹר
  choice: சொன்னது
  rationale: தொடர்ந்து வரும் நேரடி இறைஉரையை அறிமுகப்படுத்தும் எபிரெய வாய்பாட்டைத் தமிழின் வழக்கமான ‘பேசிச் சொன்னது’ என்ற சூத்திரம் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் பட்டப்பெயர் அல்ல, நான்கெழுத்து இறைப் பெயரே நேரடியாக உள்ளது. தமிழில் பரவலாக நிலைபெற்ற தனிப்பெயர் வடிவமான ‘யெகோவா’ அதைத் தலைப்புச் சொல்லால் மாற்றாமல் பாதுகாக்கிறது; துல்லிய உச்சரிப்பு குறித்து உறுதியின்மை இருப்பதால் ‘யாவே’ மாற்றாகக் கருதப்படலாம்.
translation_notes:
  register: நவீன, கண்ணியமான, பொதுவாசகருக்குப் புரியும் தமிழ். அடுத்த வசனத்தில் தொடரும் நேரடி உரையைச் சுட்ட ‘பேசிச் சொன்னது:’ என்ற தமிழ் வேதாகம நடைக்கேற்ற அறிமுகம் பயன்படுத்தப்பட்டுள்ளது.
