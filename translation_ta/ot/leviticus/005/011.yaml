review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the poverty-condition idiom, the two bird alternatives, the tenth-ephah quantity, and the prohibitions on oil and frankincense. However, ‘சாம்பிராணி’ normally denotes benzoin in modern Tamil and is not a reliable equivalent for Hebrew לְבֹנָה (frankincense). ‘பாவநிவாரணக் காணிக்கை’ also interprets the cultic term more expansively than necessary; ‘பாவக் காணிக்கை’ retains the source category with less theological specification.
  naturalness: The legal register is generally clear, but ‘நைசான மாவு’ is colloquial/nonstandard in this context. ‘நுண்ணிய மாவு’ is natural modern standard Tamil for fine flour. The opening is made smoother by explicitly linking the lack of means to bringing the birds.
  terminology: Use ‘குங்கிலியம்’ for frankincense, rather than ‘சாம்பிராணி.’ Use ‘பாவக் காணிக்கை’ consistently for חַטָּאת. Retain ‘எப்பா’ as the ancient dry measure and ‘காட்டுப்புறாக்கள்’ / ‘புறாக்குஞ்சுகள்’ for the bird terms.
  issues:
  - severity: high
    issue: ‘சாம்பிராணி’ is used for לְבֹנָה.
    rationale: In Tamil usage, சாம்பிராணி commonly refers to benzoin, whereas לְבֹנָה is frankincense. ‘குங்கிலியம்’ is the more accurate Tamil biblical term.
  - severity: medium
    issue: ‘பாவநிவாரணக் காணிக்கை’ over-specifies חַטָּאת.
    rationale: The Hebrew denotes the ritual category ‘sin offering.’ ‘பாவக் காணிக்கை’ is concise, idiomatic, and avoids adding an interpretive account of the offering’s effect.
  - severity: medium
    issue: ‘நைசான மாவு’ is unsuitable for formal modern standard Tamil.
    rationale: It is colloquial and less precise in a legal-ritual register. ‘நுண்ணிய மாவு’ clearly expresses finely milled flour.
