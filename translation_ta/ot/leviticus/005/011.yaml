base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/011.yaml
  text: But if his means are not sufficient for two turtledoves or two young pigeons[a], then he shall bring as his offering for the sin that he has committed a tenth of an ephah of fine flour for a sin offering. He shall put no oil on it and place no frankincense on it, because it is a sin offering.
translation:
  language: ta
  text: ஆனால், இரண்டு காட்டுப்புறாக்களையோ இரண்டு புறாக்குஞ்சுகளையோ கொண்டுவர அவருக்கு வசதி இல்லாவிட்டால்[a], அவர் செய்த பாவத்திற்காகத் தமது காணிக்கையாக நுண்ணிய மாவில் ஒரு எப்பாவின் பத்தில் ஒரு பங்கைக் பாவக் காணிக்கையாகக் கொண்டுவர வேண்டும். அதன்மேல் எண்ணெய் ஊற்றவோ குங்கிலியம் வைக்கவோ கூடாது; ஏனெனில் அது பாவக் காணிக்கை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேரடியாக, ‘அவருடைய கை எட்டாவிட்டால்’—போதிய பொருளாதார வசதி இல்லாததைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַשִּׂיג יָדוֹ
  choice: அவருக்கு வசதி இல்லாவிட்டால்
  rationale: எபிரெய மொழியில் நேரடியாக ‘அவருடைய கை எட்டாவிட்டால்’ என்று வரும் பொருளாதார இயலாமையைக் குறிக்கும் மரபுத்தொடரை, இயல்பான நவீன தமிழில் தெளிவாகத் தருகிறது.
- source_word: תֹרִים
  choice: காட்டுப்புறாக்கள்
  rationale: பலியிடுதல் சார்ந்த சூழலில் குறிப்பிட்ட turtledove வகையைக் குறிக்கிறது; பொதுவான ‘புறாக்கள்’ என்பதைவிடத் துல்லியமானது.
- source_word: בְנֵי יוֹנָה
  choice: புறாக்குஞ்சுகள்
  rationale: சொல்லாட்சிப்படி ‘புறாவின் குஞ்சுகள்’; இளம் புறாக்களைக் குறிக்கும் இயல்பான தமிழ்ச் சொல்.
- source_word: קָרְבָּנוֹ
  choice: தன் காணிக்கையாக
  rationale: கடவுளிடம் கொண்டுவரப்படும் பொருளைக் குறிக்கும் பரந்த பலிச்சொல்; இங்கு மாவும் காணிக்கையாக இருப்பதால் ‘பலி’ என்பதைவிட ‘காணிக்கை’ பொருத்தமானது.
- source_word: אֲשֶׁר חָטָא
  choice: அவர் செய்த பாவத்திற்காக
  rationale: காணிக்கைக்கும் செய்யப்பட்ட குற்றத்திற்கும் உள்ள தொடர்பைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: עֲשִׂירִת הָאֵפָה
  choice: ஒரு எப்பாவில் பத்தில் ஒரு பங்கு
  rationale: பண்டைய அளவலகான ‘எப்பா’வை ஊகமான நவீன அளவாக மாற்றாமல் பாதுகாக்கிறது.
- source_word: סֹלֶת
  choice: நைசான மாவு
  rationale: காணிக்கைகளுக்குப் பயன்படுத்தப்பட்ட நன்றாக அரைக்கப்பட்ட மாவைக் குறிக்கும் இயல்பான தமிழ்.
- source_word: לְחַטָּאת
  choice: பாவநிவாரணக் காணிக்கையாக
  rationale: இச்சட்டச் சூழலில் חַטָּאת பாவத்தை அல்ல, அதற்காகச் செலுத்தப்படும் சடங்குக் காணிக்கையைக் குறிக்கிறது.
- source_word: לֹא יָשִׂים עָלֶיהָ שֶׁמֶן
  choice: அதன்மேல் எண்ணெய் ஊற்றவோ ... கூடாது
  rationale: மாவின் மேல் எண்ணெய் சேர்ப்பதற்கான நேரடியான தடையை இயல்பான தமிழில் தருகிறது.
- source_word: וְלֹא יִתֵּן עָלֶיהָ לְבֹנָה
  choice: சாம்பிராணி வைக்கவோ கூடாது
  rationale: לְבֹנָה என்பது காணிக்கைகளில் பயன்படுத்தப்பட்ட மணமுள்ள frankincense பிசின்; தமிழில் பரவலாகப் புரியும் ‘சாம்பிராணி’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: כִּי חַטָּאת הִיא
  choice: ஏனெனில் அது பாவநிவாரணக் காணிக்கை
  rationale: எண்ணெயும் சாம்பிராணியும் சேர்க்கப்படாததற்கான காரணத்தையும் காணிக்கையின் சடங்கு வகையையும் பாதுகாக்கிறது.
theological_decisions:
- issue: பலிச் சூழலில் חַטָּאת என்பதன் பொருள்
  choice: பாவநிவாரணக் காணிக்கை
  alternative: பாவக் காணிக்கை; பாவம்
  rationale: இந்தச் சொல் பாவத்தையோ அதற்குரிய காணிக்கையையோ குறிக்கலாம். இங்கு கொண்டுவரப்படும் மாவும் அதற்கான சடங்கு விதிகளுமே பேசப்படுவதால் காணிக்கை என்ற பொருள் தேவை; ‘பாவநிவாரண’ என்பது அதன் நோக்கத்தைத் தமிழில் தெளிவாக்குகிறது, ஆனால் பின்னாளைய கோட்பாட்டு விவரங்களைச் சேர்ப்பதில்லை.
- issue: வறுமையைக் குறிக்கும் எபிரெய மரபுத்தொடர்
  choice: அவருக்கு வசதி இல்லாவிட்டால்
  alternative: அவருடைய கை எட்டாவிட்டால்; அவரால் வாங்க முடியாவிட்டால்
  rationale: சட்டத்தில் வழங்கப்படும் பொருளாதாரச் சலுகையைத் தெளிவாகச் சொல்கிறது; சொல்லுக்குச் சொல் மொழிபெயர்ப்பின் தெளிவின்மையையும் மிகப் பேச்சுவழக்கான நடையையும் தவிர்க்கிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், சட்டவிதிக்குரிய கண்ணியமான கட்டளைநடை பயன்படுத்தப்பட்டுள்ளது. பண்டைய அளவலகான ‘எப்பா’ அப்படியே வைக்கப்பட்டு, பொருளாதார இயலாமையைக் குறிக்கும் மரபுத்தொடர் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
