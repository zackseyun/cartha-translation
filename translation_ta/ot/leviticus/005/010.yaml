base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/010.yaml
  text: And he shall prepare the second as a burnt offering according to the ordinance[a], and the priest shall make atonement for him for the sin that he committed[b], and he shall be forgiven.
translation:
  language: ta
  text: ஆசாரியன் இரண்டாவதையும் நியமத்தின்படி[a] தகனபலியாகச் செலுத்துவான்; அவன் செய்த பாவத்திற்காக அந்த ஆசாரியன் அவனுக்காகப் பாவநிவிர்த்தி செய்வான்; அவன் மன்னிக்கப்படுவான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “விதிக்கப்பட்ட நடைமுறையின்படி.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “அவனுக்கு அது மன்னிக்கப்படும்”; மன்னிப்பை வழங்குபவரை வெளிப்படையாகக் குறிப்பிடாத செயப்பாட்டு வாய்பாடு.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֵּׁנִי
  choice: இரண்டாவதை
  rationale: முந்தைய சூழலில் குறிப்பிடப்பட்ட இரண்டாவது பறவையைக் குறிக்கும் வரிசை எண்ணை நேரடியாகவும், தமிழில் தேவையற்ற சொல்லைச் சேர்க்காமலும் தருகிறது.
- source_word: יַעֲשֶׂה
  choice: செலுத்த வேண்டும்
  rationale: עשה என்பது பொதுவாக ‘செய்/உருவாக்கு’ என்று பொருள்படும்; பலிச் சடங்குச் சூழலில் ‘பலியாகச் செலுத்து’ என்பது செயலை இயல்பாக வெளிப்படுத்துகிறது, ஆனால் சடங்கின் விவரங்களை மிகைப்படுத்துவதில்லை.
- source_word: עֹלָה
  choice: தகனபலி
  rationale: லேவியராகமத்தின் பலியியல் சொற்பயன்பாட்டில் עֹלָה என்பதற்கான நிலைபெற்ற, எளிதில் புரியும் தமிழ் இணைச்சொல்.
- source_word: כַּמִּשְׁפָּט
  choice: நியமத்தின்படி
  rationale: இங்கு מִשְׁפָּט என்பது அந்தப் பலிக்காக நிறுவப்பட்ட விதி அல்லது நடைமுறையைக் குறிக்கிறது; ‘நியமத்தின்படி’ சட்டபூர்வமான மற்றும் சடங்குசார் நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: וְכִפֶּר עָלָיו
  choice: அவனுக்காகப் பாவநிவிர்த்தி செய்வான்
  rationale: ஆசாரிய பலிச் சூழலில் כפר குறிக்கும் நிவிர்த்திச் செயலைப் பாதுகாக்கும் வழக்கமான தமிழ் மொழிபெயர்ப்பு; עָלָיו என்பதை ‘அவனுக்காக’ என இயல்பாகத் தருகிறது.
- source_word: מֵחַטָּאתוֹ אֲשֶׁר חָטָא
  choice: அவன் செய்த பாவத்திற்காக
  rationale: எபிரெய வாக்கியத்தில் நிவிர்த்திக்குரிய குற்றத்தைச் சுட்டும் அமைப்பை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: וְנִסְלַח לוֹ
  choice: அவன் மன்னிக்கப்படுவான்
  rationale: மன்னிப்பை வழங்குபவரை வெளிப்படையாகப் பெயரிடாத எபிரெயச் செயப்பாட்டு வாய்பாட்டை இயல்பான தமிழில் பாதுகாக்கிறது.
theological_decisions:
- issue: பிற்காலக் கோட்பாட்டு வரையறைகளைச் சேர்க்காமல் ஆசாரிய நிவிர்த்தி மொழியை மொழிபெயர்த்தல்
  choice: அவனுக்காகப் பாவநிவிர்த்தி செய்வான்
  alternative: அவனைத் தூய்மைப்படுத்துவான்; அவனுக்கு மன்னிப்பைப் பெற்றுத் தருவான்
  rationale: כפר என்பது இங்கு பலியுடன் தொடர்புடைய ஆசாரிய நிவிர்த்திச் செயலைக் குறிக்கிறது. ‘பாவநிவிர்த்தி’ அந்தச் சடங்கியல்-இறையியல் கருத்தைத் தக்கவைக்கிறது; அதை வெறும் தூய்மைப்படுத்தலாகவோ மன்னிப்பைப் பெற்றுத்தருவதாகவோ குறுக்குவதில்லை.
- issue: மன்னிப்பை வழங்குபவரை மறைமுகமாக வைக்கும் செயப்பாட்டு வாய்பாட்டைப் பாதுகாத்தல்
  choice: அவன் மன்னிக்கப்படுவான்
  alternative: கர்த்தர் அவனை மன்னிப்பார்; அவனுக்கு அது மன்னிக்கப்படும்
  rationale: எபிரெயம் மன்னிப்பின் செய்பவரை வெளிப்படையாகக் கூறாமல் விடுகிறது. தமிழிலும் இறைச் செய்பவரைச் சேர்க்காமல் அந்த இறையியல் கட்டுப்பாட்டைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதாகம நடையில் வடிவமைக்கப்பட்டது. ‘ஆசாரியன்’, ‘தகனபலி’, ‘பாவநிவிர்த்தி’ ஆகிய நிலைபெற்ற பலியியல் சொற்கள் பயன்படுத்தப்பட்டுள்ளன; மூலத்தில் மறைமுகமாக உள்ள இறைச் செய்பவர் வெளிப்படையாகச் சேர்க்கப்படவில்லை.
