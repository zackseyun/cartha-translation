  rationale: முதல் வாக்கியத்தில் இருந்த சொற்சொல் சார்ந்த ஆனால் இயல்பற்ற அமைப்பு, மூலத்தின் சட்டச் சூழலை உண்மையாகவும் தெளிவாகவும் தரும் வகையில் திருத்தப்பட்டது. மூலத்தில் வெளிப்படையாகக் கூறப்படாத ‘பரிசுத்த ஸ்தலம்’ அல்லது குறிப்பிட்ட வகைப் பொருள் சேர்க்கப்படவில்லை. பலியின் பெயர் நிலையான “குற்றப்பலி” எனச் சீராக்கப்பட்டு, மாற்று விளக்கம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
