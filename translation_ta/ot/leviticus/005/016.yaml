  text: וְ/אֵ֣ת אֲשֶׁר֩ חָטָ֨א מִן הַ/קֹּ֜דֶשׁ יְשַׁלֵּ֗ם וְ/אֶת חֲמִֽישִׁת/וֹ֙ יוֹסֵ֣ף עָלָ֔י/ו וְ/נָתַ֥ן אֹת֖/וֹ לַ/כֹּהֵ֑ן וְ/הַ/כֹּהֵ֗ן יְכַפֵּ֥ר עָלָ֛י/ו בְּ/אֵ֥יל הָ/אָשָׁ֖ם וְ/נִסְלַ֥ח לֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/016.yaml
  text: He shall make restitution for what he sinned against from the holy thing[a], and he shall add a fifth to it and give it to the priest. Then the priest shall make atonement for him with the ram of the guilt offering[b], and he shall be forgiven.
translation:
  language: ta
  text: பரிசுத்தமானவற்றுக்குச் செய்த தவறுக்காக அவன் இழப்பீடு செலுத்த வேண்டும்[a]. அதோடு அதன் ஐந்தில் ஒரு பங்கையும் சேர்த்து ஆசாரியனுக்குக் கொடுக்க வேண்டும். குற்றப்பலிக்கான செம்மறியாட்டுக் கடாவைக் கொண்டு[b] ஆசாரியன் அவனுக்காகப் பாவநிவிர்த்தி செய்வான்; அவன் மன்னிக்கப்படுவான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பரிசுத்தமானவற்றிலிருந்து அவன் தவறாக எடுத்துக்கொண்டதற்காக அல்லது கொடுக்காமல் வைத்துக்கொண்டதற்காக அவன் இழப்பீடு செலுத்த வேண்டும்.” எபிரெயம் பரிசுத்தமான பொருள் அல்லது காணிக்கை தொடர்பான குற்றத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “குற்றப்பலிக்கான செம்மறியாட்டுக் கடாவைக் கொண்டு”; “இழப்பீட்டுப் பலிக்கான செம்மறியாட்டுக் கடாவைக் கொண்டு” என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: חָטָא מִן הַקֹּדֶשׁ
  choice: பரிசுத்தமானவற்றிலிருந்து எதைப் பொறுத்து அவன் பாவம் செய்தானோ
  rationale: எபிரெயச் சொற்றொடர் பரிசுத்தமான பொருள் அல்லது காணிக்கை தொடர்பான குற்றத்தைக் குறிக்கிறது; மூலத்தில் இல்லாத ‘பரிசுத்த ஸ்தலம்’ என்பதைச் சேர்க்காமல் அதன் தெளிவின்மையைப் பேணுகிறது.
- source_word: יְשַׁלֵּם
  choice: இழப்பீடு செலுத்த வேண்டும்
  rationale: இந்தச் சட்டச் சூழலில் வெறும் பணம் செலுத்துவதை அல்ல, குறைவுபட்டதை ஈடுசெய்வதை குறிக்கிறது.
- source_word: חֲמִישִׁתוֹ
  choice: அதன் ஐந்தில் ஒரு பங்கு
  rationale: மூலத்தின் அளவைக் கச்சிதமாகவும் இயல்பான நவீன தமிழிலும் தெரிவிக்கிறது.
- source_word: יוֹסֵף עָלָיו
  choice: அத்துடன் ... சேர்த்து
  rationale: முதன்மை இழப்பீட்டின் மேல் கூடுதல் தொகை சேர்க்கப்படுவதைத் தெளிவாகக் காட்டுகிறது.
- source_word: לַכֹּהֵן
  choice: ஆசாரியனிடம்
  rationale: வேதாகமப் பலிச்சூழலில் כֹּהֵן என்பதற்கான புரிந்துகொள்ளத்தக்க நிலையான தமிழ் சொல்.
- source_word: יְכַפֵּר עָלָיו
  choice: அவனுக்காகப் பாவநிவிர்த்தி செய்வான்
  rationale: பலிச் சூழலிலுள்ள כפר என்பதன் நிவிர்த்தி/பரிகாரச் செயலை நிலையான தமிழ் வழக்கில் தருகிறது.
- source_word: בְּאֵיל הָאָשָׁם
  choice: குற்றநிவாரணப் பலிக்கான செம்மறியாட்டுக் கடாவைக் கொண்டு
  rationale: אָשָׁם என்பதில் குற்றமும் அதற்கான ஈடுசெய்தலும் இணைந்துள்ளதால் ‘குற்றநிவாரணப் பலி’ இரு அம்சங்களையும் சுருக்கமாகப் பாதுகாக்கிறது; construct-ஐ இயல்பான தமிழில் நோக்குறவாக வழங்குகிறது.
- source_word: וְנִסְלַח לוֹ
  choice: அப்போது அவன் மன்னிக்கப்படுவான்
  rationale: Niphal வடிவின் மன்னிப்பு பெறுதல் என்ற பொருளை இயல்பாகத் தருகிறது; ‘அப்போது’ விளைவுத் தொடர்பைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: אָשָׁם என்ற பலிச் சொல்லின் மொழிபெயர்ப்பு
  choice: குற்றநிவாரணப் பலி
  alternative: குற்றப்பலி; இழப்பீட்டுப் பலி
  rationale: இச்சொல் குற்றத்தையும் ஈடுசெய்தலையும் வலியுறுத்தக்கூடும். வசனத்தில் இழப்பீடு தனியே குறிப்பிடப்படுவதால், ‘குற்றநிவாரணப் பலி’ பலியின் பெயரையும் நோக்கையும் சமநிலையாக வெளிப்படுத்துகிறது.
- issue: כפר என்பதன் பலிசார் பொருள்
  choice: பாவநிவிர்த்தி செய்வான்
  alternative: பரிகாரம் செய்வான்
  rationale: மூலம் பலியின் மூலம் ஆசாரியன் செய்கிற நிவிர்த்திச் செயலைக் கூறுகிறது; அது எவ்வாறு செயல்படுகிறது என்ற குறிப்பிட்ட கோட்பாட்டை மொழிபெயர்ப்பில் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; சட்ட மற்றும் பலிசார் கண்ணியமான நடை. ‘ஆசாரியன்’, ‘பாவநிவிர்த்தி’ போன்ற பரவலாக அறியப்பட்ட வேதாகமச் சொற்கள் வாசிப்புத் தெளிவுக்காகப் பயன்படுத்தப்பட்டுள்ளன. மூலத்திலுள்ள பரிசுத்தப் பொருள் தொடர்பான குற்றத்தின் சுருக்கமும் தெளிவின்மையும் அடிக்குறிப்புடன் பேணப்பட்டுள்ளன.
