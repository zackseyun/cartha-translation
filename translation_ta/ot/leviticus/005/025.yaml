  text: וְ/אֶת אֲשָׁמ֥/וֹ יָבִ֖יא לַ/יהוָ֑ה אַ֣יִל תָּמִ֧ים מִן הַ/צֹּ֛אן בְּ/עֶרְכְּ/ךָ֥ לְ/אָשָׁ֖ם אֶל הַ/כֹּהֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/025.yaml
  text: 'And he shall bring his guilt offering to Yahweh: a flawless ram from the flock[a], according to your valuation, as a guilt offering[b], to the priest.'
translation:
  language: ta
  text: 'அவன் தனது குற்றநிவாரணப் பலியை[a] யாவேவுக்குக் கொண்டுவர வேண்டும்: மந்தையிலிருந்து குறைபாடற்ற[b] ஓர் ஆட்டுக்கடாவை, உன் மதிப்பீட்டின்படி, குற்றநிவாரணப் பலியாக ஆசாரியனிடம்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘குற்றநிவாரணம்’ அல்லது ‘ஈடுசெய்தல்’ என்றும் பொருள்படலாம். எபிரெயச் சொல் אָשָׁם குற்றநிலையையும், அதற்கான நிவாரணம் அல்லது குறிப்பிட்ட பலியையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: மரபுவழியாக, ‘ஊனமில்லாத’ என்று மொழிபெயர்க்கப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשָׁמוֹ
  choice: தனது குற்றநிவாரணப் பலியை
  rationale: אָשָׁם என்பது குற்றத்தையும் அதற்கான நிவாரணம் அல்லது பலியையும் குறிக்கலாம். இங்கு தொடர்ந்து ஆட்டுக்கடா குறிப்பிடப்படுவதால் பலியைக் குறிக்கும் மொழிபெயர்ப்பு இயல்பானது; இருப்பினும் மூலச்சொல்லின் பரந்த பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: יָבִיא
  choice: கொண்டுவர வேண்டும்
  rationale: சட்டக் கட்டளையில் வரும் ஹிஃபில் முற்றாத வினையின் கட்டாயத் தன்மையை நவீனத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: לַיהוָה
  choice: யாவேவுக்கு
  rationale: יהוה என்ற உடன்படிக்கைப் பெயரைப் பெயரெழுத்தாக்கி நேரடியாக வழங்குகிறது.
- source_word: אַיִל
  choice: ஓர் ஆட்டுக்கடாவை
  rationale: பலிக்குரிய வளர்ந்த ஆண் செம்மறியாட்டைக் குறிக்கும் துல்லியமான, பொதுவாகப் புரியும் தமிழ்ச்சொல்.
- source_word: תָּמִים
  choice: குறைபாடற்ற
  rationale: பலிக்கான உடல் முழுமையையும் ஏற்றுக்கொள்ளத்தக்க நிலையையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: מִן הַצֹּאן
  choice: மந்தையிலிருந்து
  rationale: צֹאן சிறுகால்நடை மந்தையைக் குறிக்கும்; אַיִל ஏற்கெனவே விலங்கை ஆட்டுக்கடா என்று வரையறுப்பதால் இச்சுருக்கமான மொழிபெயர்ப்பு போதுமானது.
- source_word: בְּעֶרְכְּךָ
  choice: உன் மதிப்பீட்டின்படி
  rationale: இரண்டாம் நபர் ஒருமை பின்னொட்டையும் சட்டரீதியான மதிப்பீட்டுக் கருத்தையும் பாதுகாக்கிறது.
- source_word: לְאָשָׁם
  choice: குற்றநிவாரணப் பலியாக
  rationale: இங்கு לְאָשָׁם ஆட்டுக்கடாவின் பலிவகையையோ நோக்கத்தையோ குறிப்பிடுகிறது; அதனால் வழிபாட்டு வகைப்பாட்டைத் தெளிவாகத் தருகிறது.
- source_word: אֶל הַכֹּהֵן
  choice: ஆசாரியனிடம்
  rationale: பலியை அலுவலாற்றும் ஆசாரியனிடம் சமர்ப்பிக்க வேண்டிய திசையை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் நேரடியாக உள்ள நான்கெழுத்து உடன்படிக்கைப் பெயரை பொதுப்பட்டமாக மாற்றாமல் பெயராகவே வழங்குகிறது.
- issue: ஒரே வசனத்தில் இருமுறை வரும் אָשָׁם என்பதன் பொருள்
  choice: இரு இடங்களிலும் ‘குற்றநிவாரணப் பலி’; முதல் இடத்தின் பரந்த பொருள் அடிக்குறிப்பில்
  alternative: முதல் இடத்தில் ‘ஈடுசெய்தல்’, இரண்டாம் இடத்தில் ‘குற்றநிவாரணப் பலி’
  rationale: இரு நிகழ்வுகளின் சொல்லியல் தொடர்பையும் வசனத்தின் நோக்கமுள்ள மீளுரையையும் பாதுகாக்கிறது; அதேவேளை முதல் நிகழ்வில் உள்ள குற்றம்/ஈடுசெய்தல் சார்ந்த உண்மையான பொருள் நிழலை அடிக்குறிப்பு வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சட்டக் கட்டளைக்கேற்ற கண்ணியமான நடையும் தெளிவும் பேணப்பட்டுள்ளன. மூலத்தில் இருமுறை வரும் אָשָׁם தமிழிலும் இருமுறை தரப்பட்டுள்ளது; செயற்கையாகத் தோன்றக்கூடிய மீளுரையும் மூலத்தின் சட்ட-வழிபாட்டு வலியுறுத்தலாகப் பாதுகாக்கப்பட்டுள்ளது.
