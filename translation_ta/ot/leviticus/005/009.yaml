base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/009.yaml
  text: And he shall sprinkle some of the blood of the sin offering on the side of the altar[a], and the rest of the blood shall be drained out at the base of the altar; it is a sin offering.
translation:
  language: ta
  text: அவன் பாவநிவாரணப் பலியின் இரத்தத்தில் சிறிதை பலிபீடத்தின் பக்கச் சுவரில் தெளிக்க வேண்டும்[a]. மீதமுள்ள இரத்தத்தைப் பலிபீடத்தின் அடிப்பகுதியில் பிழிந்துவிட வேண்டும். அது பாவநிவாரணப் பலியாகும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இவ்வசனத்தில் வரும் ‘பாவநிவாரணப் பலி’ என்ற இரு இடங்களையும் ‘தூய்மைப்படுத்தும் பலி’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் חַטָּאת, பாவத்துக்கான பலியைக் குறிக்கும்போது அதன் தூய்மைப்படுத்தும் செயல்பாட்டையும் வலியுறுத்தலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִזָּה
  choice: தெளிக்க வேண்டும்
  rationale: נזה என்பதன் ஹிபீல் வடிவம் பலியிடும் சடங்கில் இரத்தத்தைத் தெளித்துப் பூசுவதைக் குறிக்கிறது; நவீன தமிழில் ‘தெளிக்க’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: מִדַּם
  choice: இரத்தத்தில் சிறிதை
  rationale: מִן இங்கு பகுதியைக் குறிக்கிறது; இந்தக் கட்டத்தில் இரத்தத்தின் ஒரு பகுதியே பயன்படுத்தப்படுவதை வெளிப்படுத்துகிறது.
- source_word: הַחַטָּאת
  choice: பாவநிவாரணப் பலி
  rationale: חַטָּאת இங்கு பாவத்துக்காகச் செலுத்தப்படும் பலிவகையைக் குறிக்கிறது. ‘பாவநிவாரணப் பலி’ என்பது தமிழில் அதன் பாவம் சார்ந்த நோக்கைத் தெளிவாகத் தெரிவிக்கிறது; தூய்மைப்படுத்தும் செயல்பாடு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: עַל קִיר הַמִּזְבֵּחַ
  choice: பலிபீடத்தின் பக்கத்தில்
  rationale: קִיר என்பதன் அடிப்படைப் பொருள் ‘சுவர்’; பலிபீடத்தைப் பற்றிய தமிழ்ச் சொல்லாக்கத்தில் ‘பக்கம்’ என்பது அந்த வெளிப்புற மேற்பரப்பை இயல்பாகக் குறிக்கிறது.
- source_word: וְהַנִּשְׁאָר בַּדָּם
  choice: இரத்தத்தில் மீதமிருப்பது
  rationale: שׁאר என்பதன் நிபால் எச்சவடிவம் ‘மீதமிருப்பது’ என்ற பெயர்ச்சொல் செயல்பாட்டைக் கொண்டுள்ளது; எபிரெய வாக்கிய அமைப்பையும் இயல்பான தமிழையும் காக்கிறது.
- source_word: יִמָּצֶה
  choice: வடித்துவிடப்பட வேண்டும்
  rationale: מצה என்பதன் நிபால் வடிவம் மீதமுள்ள இரத்தத்தை அழுத்தி அல்லது முழுமையாக வடியச் செய்வதைக் குறிக்கிறது; வெறுமனே ‘ஊற்றுதல்’ என்பதைக் காட்டிலும் ‘வடித்துவிடுதல்’ துல்லியமானது.
- source_word: אֶל יְסוֹד הַמִּזְבֵּחַ
  choice: பலிபீடத்தின் அடியில்
  rationale: יְסוֹד என்பது அடித்தளம் அல்லது அடிப்பகுதியைக் குறிக்கிறது; ‘பலிபீடத்தின் அடியில்’ என்பது சடங்கு நிகழும் இடத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: חַטָּאת הוּא
  choice: அது பாவநிவாரணப் பலி
  rationale: இந்த இறுதி வாக்கியம் பலியை அதன் வகையால் அடையாளப்படுத்துகிறது; முதல் நிகழ்வுடன் ஒரே சொல்லாக்கம் பேணப்படுகிறது.
theological_decisions:
- issue: பலிச்சட்டங்களில் חַטָּאת என்பதன் மொழிபெயர்ப்பு
  choice: பாவநிவாரணப் பலி
  alternative: தூய்மைப்படுத்தும் பலி
  rationale: எபிரெயச் சொல் பாவத்துடனான தொடர்பையும் சடங்கின் தூய்மைப்படுத்தும் செயல்பாட்டையும் தாங்க முடியும். முதன்மை உரையில் பரவலாகப் புரிந்துகொள்ளத்தக்க ‘பாவநிவாரணப் பலி’ பயன்படுத்தப்பட்டு, உண்மையான மாற்றுப் பொருள் அடிக்குறிப்பில் வைக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் சடங்குச் சூழலுக்குரிய செறிவும் காக்கப்பட்டுள்ளன. செயற்பாடுகள் தெளிவாக இருக்க வேண்டி இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளன; எபிரெய மூலத்தின் கட்டளைத் தன்மை ‘வேண்டும்’ மூலம் பேணப்பட்டுள்ளது.
