  text: וְ/אִם לֹ֨א תַגִּ֣יע יָד/וֹ֮ דֵּ֣י שֶׂה֒ וְ/הֵבִ֨יא אֶת אֲשָׁמ֜/וֹ אֲשֶׁ֣ר חָטָ֗א שְׁתֵּ֥י תֹרִ֛ים אֽוֹ שְׁנֵ֥י בְנֵֽי יוֹנָ֖ה לַֽ/יהוָ֑ה אֶחָ֥ד לְ/חַטָּ֖את וְ/אֶחָ֥ד לְ/עֹלָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/007.yaml
  text: But if his means do not suffice for a sheep[a], then he shall bring as his guilt offering for the sin that he committed two turtledoves or two young pigeons to Yahweh, one for a sin offering and one for a burnt offering.
translation:
  language: ta
  text: ஆனால், ஓர் ஆட்டைச் செலுத்தும் அளவுக்கு அவனிடம் வசதி இல்லையென்றால்[a], தான் செய்த பாவத்திற்கான குற்றநிவாரணப் பலியாக இரண்டு காட்டுப்புறாக்களையோ இரண்டு புறாக்குஞ்சுகளையோ யாவேக்குக் கொண்டுவர வேண்டும். அவற்றில் ஒன்றைப் பாவநிவாரணப் பலியாகவும்[b], மற்றொன்றைத் தகனபலியாகவும் செலுத்த வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஒரு செம்மறியாட்டைச் செலுத்தும் அளவுக்கு.’ எபிரெயச் சொல் செம்மறியாட்டையோ வெள்ளாட்டையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘தூய்மைப்படுத்தும் பலியாகவும்.’ எபிரெயச் சொல் பாவத்திற்கான பலியையும், பாவம் அல்லது தீட்டிலிருந்து தூய்மைப்படுத்தும் பலியையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַגִּיע יָדוֹ דֵּי שֶׂה
  choice: ஓர் ஆட்டைச் செலுத்தும் அளவுக்கு அவனிடம் வசதி இல்லையென்றால்
  rationale: ‘அவனுடைய கை எட்டவில்லை’ என்ற எபிரெய மரபுத்தொடர் பொருளாதார வசதி போதாமையைக் குறிக்கிறது. தமிழில் இயல்பாகவும், வெறுமனே ‘வாங்க முடியவில்லை’ என்று மிகையாக விளக்காமலும் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: שֶׂה
  choice: ஓர் ஆடு
  rationale: இந்தச் சொல் மந்தையிலுள்ள ஒரு செம்மறியாட்டையோ வெள்ளாட்டையோ குறிக்கலாம். மூலத்திலுள்ள பொதுத்தன்மையைத் தக்கவைக்க ‘ஆடு’ பயன்படுத்தப்பட்டு, வகைமாற்று அடிக்குறிப்பில் தரப்பட்டது.
- source_word: אֲשָׁמוֹ
  choice: குற்றநிவாரணப் பலி
  rationale: இங்கு אָשָׁם குற்றத்தையும் அதனுடன் தொடர்புடைய பலியையும் குறிக்கிறது. அடுத்து அந்தப் பலி பாவநிவாரணப் பலி மற்றும் தகனபலி என இரண்டாக அமைகிறது; ஆகவே பலியைக் குறிக்கும் மரபான சொல்லாக்கம் பயன்படுத்தப்பட்டது.
- source_word: אֲשֶׁר חָטָא
  choice: தான் செய்த பாவத்திற்கான
  rationale: கொண்டுவரப்படும் பலிக்கும் செய்த பாவத்திற்கும் உள்ள தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: שְׁתֵּי תֹרִים
  choice: இரண்டு காட்டுப்புறாக்கள்
  rationale: תֹרִים என்பதற்கான வழக்கமான பறவையியல் மற்றும் பலிச்சட்டச் சூழல் பொருள் ‘காட்டுப்புறாக்கள்’ ஆகும்.
- source_word: שְׁנֵי בְנֵי יוֹנָה
  choice: இரண்டு புறாக்குஞ்சுகள்
  rationale: சொல்லுக்கு சொல் ‘புறாவின் மகன்கள்’ என்ற எபிரெய மரபுத்தொடர் இளம் புறாக்களைக் குறிக்கிறது; தமிழில் ‘புறாக்குஞ்சுகள்’ இயல்பானது.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: தனிப்பெயரான יהוה என்பதை பொதுப்பட்டமாக மாற்றாமல், தமிழில் அறியப்பட்ட ஒலிபெயர்ப்பான ‘யாவே’ மூலம் தருகிறது.
- source_word: לְחַטָּאת
  choice: பாவநிவாரணப் பலி
  rationale: பலிச்சட்டச் சூழலில் חַטָּאת பாவத்தோடு தொடர்புடைய பலியைக் குறிக்கிறது. அதன் தூய்மைப்படுத்தும் செயல்பாட்டை வலியுறுத்தும் மாற்றுப் பெயர் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- source_word: לְעֹלָה
  choice: தகனபலி
  rationale: עֹלָה முழுவதுமாக எரிக்கப்படும் பலியைக் குறிக்கிறது; ‘தகனபலி’ என்பது சுருக்கமான, புரிந்துகொள்ளத்தக்க தமிழ் பலிச்சொல்.
theological_decisions:
- issue: חַטָּאת என்ற பலிச்சொல்லின் பொருள்
  choice: பாவநிவாரணப் பலி
  alternative: தூய்மைப்படுத்தும் பலி
  rationale: இச்சொல் பாவத்திற்கான பலி என்றும், சடங்குத் தூய்மையை ஏற்படுத்தும் பலி என்றும் புரிந்துகொள்ளப்படலாம். தகனபலியுடன் இணைந்து வரும் சட்டச் சூழலில் மரபான ‘பாவநிவாரணப் பலி’ முதன்மை உரையில் வைக்கப்பட்டு, பலியின் செயல்பாட்டை வலியுறுத்தும் மாற்று அடிக்குறிப்பில் தரப்பட்டது.
- issue: אָשָׁם என்பதன் பலியியல் பயன்பாடு
  choice: குற்றநிவாரணப் பலி
  alternative: குற்றத்திற்கான காணிக்கை
  rationale: இச்சொல் ‘குற்றம்’ அல்லது அதற்காகக் கொண்டுவரப்படும் பலி ஆகிய இரண்டையும் குறிக்கக்கூடும். ‘கொண்டுவர வேண்டும்’ என்ற வினையும் தொடர்ந்து குறிப்பிடப்படும் இரண்டு பலிகளும் இங்கு காணிக்கையையே முன்னிறுத்துகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டப்பூர்வமான கட்டளையின் கண்ணியத்தையும் தெளிவையும் காக்கும் நடை பயன்படுத்தப்பட்டது. பொருளாதார இயலாமையைக் குறிக்கும் எபிரெய மரபுத்தொடர் இயல்பான தமிழாக்கமாகத் தரப்பட்டுள்ளது; பலிச்சொற்கள் சீராகவும் பொதுவாசகர்கள் புரிந்துகொள்ளும் வகையிலும் அமைக்கப்பட்டுள்ளன.
