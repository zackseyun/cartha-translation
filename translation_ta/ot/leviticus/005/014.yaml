base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/014.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ta
  text: 'யாவே[a] மோசேயிடம் பின்வருமாறு கூறினார்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில்: יהוה (YHWH); “யெகோவா” என்றும் ஒலிபெயர்க்கப்படுகிறது.'
    reason: இறைப்பெயரின் எபிரெய வடிவத்தையும் மாற்று ஒலிபெயர்ப்பையும் தெரிவிக்கிறது.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பேசி
  rationale: וַיְדַבֵּר ஒரு புதிய தெய்வீக உரையாடல் நிகழ்வைத் தொடங்குகிறது. அடுத்த வசனத்தில் வரும் நேரடிக் கூற்றுடன் இயல்பாக இணைவதற்காக, தமிழ் வாக்கிய அமைப்பில் ‘பேசி’ என மொழிபெயர்க்கப்பட்டது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: எபிரெய தனிப்பெயரான יהוה-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பான ‘யெகோவா’ என வழங்குகிறது; உச்சரிப்பு உறுதியற்றிருப்பதை அடிக்குறிப்பு சுட்டுகிறது.
- source_word: אֶל
  choice: -யிடம்
  rationale: பேச்சு நோக்கிச் செலுத்தப்பட்ட நபரைத் தமிழில் இயல்பாகக் குறிக்கும் வேற்றுமை வடிவம்.
- source_word: מֹשֶׁה
  choice: மோசே
  rationale: משה என்ற தனிப்பெயரின் தமிழில் நிலைபெற்ற வடிவம்.
- source_word: לֵאמֹר
  choice: (அடுத்துவரும் கூற்றை அறிமுகப்படுத்தும் அமைப்பில் உட்பொருளாக்கப்பட்டது)
  rationale: לֵאמֹר அடுத்த வசனத்தின் நேரடிக் கூற்றை அறிமுகப்படுத்தும் வழக்குச் சூத்திரம். ‘பேசி’ என்பதற்குப் பின் நிறுத்தற்குறி இடுவது தமிழில் அதன் பணியை இயல்பாக வெளிப்படுத்துகிறது; ‘சொல்லி’ என்று மீண்டும் மொழிபெயர்ப்பது செயற்கையாக இருக்கும்.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை வழங்குதல்
  choice: யெகோவா
  alternative: யாவே
  rationale: மூலத்தில் ஒரு தனிப்பெயர் இருப்பதால் ‘கர்த்தர்’ போன்ற பட்டப்பெயரைப் பயன்படுத்தவில்லை. அதன் பழங்கால உச்சரிப்பு முழுமையாக உறுதிப்படுத்தப்படாததால், தமிழில் நிலைபெற்ற ‘யெகோவா’ என்பதை முதன்மை உரையில் வைத்து, ‘யாவே’ என்ற மாற்று ஒலிபெயர்ப்பை அடிக்குறிப்பில் தருகிறது.
translation_notes:
  register: நவீன, கண்ணியமான பொதுத்தமிழ். இது அடுத்த வசனத்தில் தொடரும் உரைக்கான அறிமுகச் சூத்திரம் என்பதால் வாக்கியம் காற்புள்ளியுடன் முடிகிறது; அடிக்குறி அது விளக்கும் இறைப்பெயருக்குப் பின் வைக்கப்பட்டுள்ளது.
