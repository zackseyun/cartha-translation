source:
  edition: WLC
  text: וְ/הֵבִ֣יא אֶת אֲשָׁמ֣/וֹ לַ/יהוָ֡ה עַ֣ל חַטָּאת/וֹ֩ אֲשֶׁ֨ר חָטָ֜א נְקֵבָ֨ה מִן הַ/צֹּ֥אן כִּשְׂבָּ֛ה אֽוֹ שְׂעִירַ֥ת עִזִּ֖ים לְ/חַטָּ֑את וְ/כִפֶּ֥ר עָלָ֛י/ו הַ/כֹּהֵ֖ן מֵ/חַטָּאתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/006.yaml
  text: 'and he shall bring his guilt offering to Yahweh for his sin that he has committed: a female from the flock[a], a lamb or a female goat, for a sin offering[b]; and the priest shall make atonement for him for his sin.'
translation:
  language: ta
  text: 'அவன் செய்த பாவத்திற்காக, அவன் யாவேக்குத் தன் குற்றக்காணிக்கையை[a] கொண்டுவர வேண்டும்: மந்தையிலிருந்து ஒரு பெண் விலங்கை—பெண் செம்மறியாட்டுக்குட்டியையோ பெண் வெள்ளாட்டையையோ—பாவநிவாரணக் காணிக்கையாக. ஆசாரியர் அவனுடைய பாவத்துக்காக அவனுக்குப் பாவநிவிர்த்தி செய்வார்.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தன் குற்றத்துக்கான காணிக்கை’ அல்லது ‘தன் ஈடுசெய்யும் காணிக்கை’ என்றும் மொழிபெயர்க்கலாம். இங்கு வரும் எபிரெயச் சொல் (אָשָׁם) குற்றம் அல்லது குற்றத்திற்கான ஈடுசெய்தலுடன் தொடர்புடையது; ஆனால் பின்னர் அந்த விலங்கு ‘பாவநிவாரணக் காணிக்கையாக’ அளிக்கப்பட வேண்டும் என்று வசனம் கூறுகிறது.
    reason: lexical_alternative
  - marker: b
    text: இறுதிச் சொற்றொடரை இன்னும் நேரடியாக, ‘ஆசாரியர் அவனுடைய பாவத்திலிருந்து அவனுக்காகப் பாவநிவிர்த்தி செய்வார்’ என மொழிபெயர்க்கலாம். இது பாவத்திலிருந்து விடுவிக்கப்படுதல் அல்லது பாவம் நீக்கப்படுதல் என்ற விளைவை வலியுறுத்தக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבִיא
  choice: கொண்டுவர வேண்டும்
  rationale: சட்ட விதியின் கட்டாயத் தன்மையை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֲשָׁמוֹ
  choice: தன் குற்றநிவாரணக் காணிக்கை
  rationale: אשם என்பதிலுள்ள குற்றம்/குற்றத்திற்கான பரிகாரம் சார்ந்த பொருளைத் தக்கவைத்து, பின்னர் வரும் חטאת என்ற வேறு பலிச்சொல்லுடன் ஒன்றாக்காமல் காட்டுகிறது.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: יהוה என்ற இறைப்பெயரை ‘யாவே’ என ஒலிபெயர்த்து வழங்குகிறது.
- source_word: עַל חַטָּאתוֹ אֲשֶׁר חָטָא
  choice: தான் செய்த பாவத்திற்காக
  rationale: எபிரெயக் கூற்றின் காரண/அடிப்படை உறவைச் சுருக்காமல் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: נְקֵבָה מִן הַצֹּאן
  choice: மந்தையிலிருந்து ஒரு பெண் விலங்கு
  rationale: צאן என்பது செம்மறியாடுகளும் வெள்ளாடுகளும் அடங்கிய சிறுகால்நடை மந்தையைக் குறிக்கிறது; அடுத்து வரும் இரு தெரிவுகள் இதைத் தெளிவாக்குகின்றன.
- source_word: כִשְׂבָּה
  choice: பெண் செம்மறியாட்டுக்குட்டி
  rationale: விலங்கின் இனத்தையும் பெண்பாலையும் வெளிப்படையாகத் தக்கவைக்கிறது.
- source_word: אוֹ שְׂעִירַת עִזִּים
  choice: அல்லது பெண் வெள்ளாடு
  rationale: மூலத்தில் தெளிவாகக் குறிப்பிடப்பட்ட பெண்பாலை நவீனத் தமிழில் நேரடியாக வழங்குகிறது.
- source_word: לְחַטָּאת
  choice: பாவநிவாரணக் காணிக்கையாக
  rationale: ஆசாரிய பலிச்சூழலில் חטאת குறிக்கும் sin/purification offering என்ற தொழில்நுட்பப் பொருளை வாசகருக்குப் புரியும் வகையில் வழங்குகிறது.
- source_word: וְכִפֶּר עָלָיו
  choice: அவன் சார்பில் பாவநிவிர்த்தி செய்வார்
  rationale: כפר என்பதன் ஆசாரியச் சடங்கு சார்ந்த பொருளைத் தக்கவைத்து, ஒரு குறிப்பிட்ட பிற்காலப் பாவநிவிர்த்திக் கோட்பாட்டைத் திணிக்கவில்லை.
- source_word: מֵחַטָּאתוֹ
  choice: அவனுடைய பாவத்துக்காக
  rationale: தமிழில் இயல்பான தொடர்பைக் காட்டுகிறது; מן என்பதிலுள்ள ‘பாவத்திலிருந்து’ என்ற நீக்க நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: ஒரே வசனத்தில் אשם மற்றும் חטאת ஆகிய இரு பலிச்சொற்கள் வருதல்
  choice: אשם என்பதை ‘குற்றநிவாரணக் காணிக்கை’ என்றும் חטאת என்பதை ‘பாவநிவாரணக் காணிக்கை’ என்றும் வேறுபடுத்தி மொழிபெயர்த்தல்
  alternative: இரண்டையும் பொதுவாக ‘பாவத்திற்கான காணிக்கை’ என ஒரே சொல்லால் வழங்குதல்; அல்லது חטאת என்பதை ‘தூய்மைப்படுத்தும் காணிக்கை’ என வழங்குதல்
  rationale: மூல எபிரெயம் இரு சொற்களையும் அருகருகே பயன்படுத்துவதால், அவற்றுக்கிடையிலான உண்மையான சொற்பொருள் வேறுபாட்டையும் பதற்றத்தையும் மொழிபெயர்ப்பு மறைக்கக்கூடாது.
- issue: יהוה என்ற இறைப்பெயர்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் உள்ள தனிப்பட்ட இறைப்பெயரை மறைக்காமல், அதன் பொதுவாக ஏற்றுக்கொள்ளப்பட்ட ஒலிப்புக்கு நெருக்கமாக வழங்குகிறது.
- issue: מן உடன் வரும் இறுதி பாவநிவிர்த்திக் கூற்று
  choice: ‘அவனுடைய பாவத்துக்காக’ என்று முதன்மை உரையில் இயல்பாக வழங்கி, ‘பாவத்திலிருந்து’ என்ற நேரடி வடிவத்தை அடிக்குறிப்பில் குறிப்பிடுதல்
  alternative: ‘அவனுடைய பாவத்திலிருந்து அவனுக்காகப் பாவநிவிர்த்தி செய்வார்’ என்று சொற்சொல்லாக வழங்குதல்
  rationale: מן காரணம்/தொடர்பு அல்லது விடுவித்தல்/நீக்கம் ஆகிய நுணுக்கங்களைத் தரக்கூடும். இயல்பான தமிழையும் மூலத்தின் தெளிவின்மையையும் இரண்டையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் சட்டவிதிக்குரிய தெளிவும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆசாரியர்’ என்ற மரியாதை ஒருமை வடிவமும், ‘கொண்டுவர வேண்டும்’ என்ற விதிப்பாங்கும் வாசிப்பை இயல்பாக்குகின்றன. பலிச்சொற்களின் வேறுபாடு திட்டமிட்டு பாதுகாக்கப்பட்டுள்ளது.
