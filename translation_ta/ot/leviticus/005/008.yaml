- from: அவற்றை ஆசாரியனிடம் கொண்டுவர வேண்டும். ஆசாரியன் பாவநிவாரணப் பலிக்குரிய பறவையை[a] முதலில் படைத்து, அதன் கழுத்தருகே அதன் தலையைக் கிள்ளி முறிக்க வேண்டும்[b]; ஆனால் தலையை முழுவதுமாகப் பிரித்துவிடக் கூடாது[c].
  to: அவற்றை ஆசாரியனிடம் கொண்டுவர வேண்டும். ஆசாரியன் பாவப்பலிக்கான பறவையை[a] முதலில் செலுத்த வேண்டும்; அதன் பிடரிக்கு எதிர்ப்புறத்தில் அதன் தலையைக் கிள்ள வேண்டும்[b]. ஆனால் அதை முழுவதுமாகப் பிரித்துவிடக் கூடாது[c].
  rationale: மூலத்தின் பலிப்பெயருக்கு நெருக்கமான ‘பாவப்பலி’ தேர்ந்தெடுக்கப்பட்டது; அதன் ‘தூய்மைப்படுத்தும்’ நுட்பத்தை அடிக்குறிப்பு பாதுகாக்கிறது. சடங்கு வினை முழுமையாகத் துண்டிப்பதாக ஒலிக்காதபடி ‘கிள்ள வேண்டும்’ என மாற்றப்பட்டுள்ளது. கடினமான מִמּוּל עָרְפּוֹ சொற்றொடரின் திசை உறவு உரையில் வைக்கப்பட்டு, அதன் துல்லிய உடற்கூறு விளக்கம் அடிக்குறிப்பில் எச்சரிக்கையுடன் குறிப்பிடப்பட்டுள்ளது.
