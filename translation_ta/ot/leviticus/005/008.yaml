base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/008.yaml
  text: And he shall bring them to the priest[a], and he shall present first the one for the sin offering, and he shall pinch off its head from the front of its neck[c][b], but he shall not sever it.
translation:
  language: ta
  text: அவற்றை ஆசாரியனிடம் கொண்டுவர வேண்டும். ஆசாரியன் பாவப்பலிக்கான பறவையை[a] முதலில் செலுத்த வேண்டும்; அதன் பிடரிக்கு எதிர்ப்புறத்தில் அதன் தலையைக் கிள்ள வேண்டும்[b]. ஆனால் அதை முழுவதுமாகப் பிரித்துவிடக் கூடாது[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல் חַטָּאת என்பதை லேவியராகமத்தின் பலிச்சூழலில் இன்னும் குறிப்பாக ‘தூய்மைப்படுத்தும் பலி’ என்றும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: இந்த வினைச்சொல் பறவைப் பலியை ஆசாரியன் கையால் சடங்குமுறையில் கையாளுவதைக் குறிக்கிறது; பாரம்பரிய மொழிபெயர்ப்புகள் இதை ‘தலையை முறுக்குதல்’ அல்லது ‘முறித்தல்’ எனவும் மொழிபெயர்க்கின்றன. ‘பிடரிக்கு எதிர்ப்புறத்தில்’ என்பதன் துல்லியமான உடற்கூறு இடம் விவாதத்துக்குரியது.
    reason: lexical_alternative
  - marker: c
    text: அதாவது, தலை உடலிலிருந்து முற்றிலும் துண்டிக்கப்படக் கூடாது.
    reason: cultural_note
lexical_decisions:
- source_word: וְהֵבִיא אֹתָם אֶל הַכֹּהֵן
  choice: அவற்றை ஆசாரியனிடம் கொண்டுவர வேண்டும்
  rationale: முந்தைய வசனத்தில் சொல்லப்பட்ட இரண்டு பறவைகளைக் குறிக்கும் பன்மையான אֹתָם என்பதைக் காக்கிறது. சட்டவிதியின் கட்டாயத்தைக் காட்ட ‘வேண்டும்’ இயல்பான நவீனத் தமிழில் பயன்படுத்தப்பட்டுள்ளது.
- source_word: וְהִקְרִיב
  choice: ஆசாரியன் ... படைத்து
  rationale: பலியிடும் சூழலில் קרב என்பதன் ஹிஃபில் வடிவம் பலியை முன்வைத்தல் அல்லது படைத்தலைக் குறிக்கிறது. பறவைகளைக் கொண்டுவரும் செயலில் இருந்து சடங்கு செயலை வேறுபடுத்த ‘படைத்து’ தேர்ந்தெடுக்கப்பட்டுள்ளது; சூழலில் செய்பவர் ஆசாரியன் என்பதையும் தமிழில் தெளிவுபடுத்துகிறது.
- source_word: אֶת אֲשֶׁר לַחַטָּאת רִאשׁוֹנָה
  choice: பாவநிவாரணப் பலிக்குரிய பறவையை முதலில்
  rationale: இரண்டு பறவைகளில் חַטָּאת பலிக்காக ஒதுக்கப்பட்ட ஒன்றையும், רִאשׁוֹנָה குறிக்கும் வரிசையையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: חַטָּאת
  choice: பாவநிவாரணப் பலி
  rationale: லேவியராகமத்தின் பலிச்சட்டச் சூழலில் இது பாவத்துக்காகச் செலுத்தப்படும் பலியைக் குறிக்கிறது. ‘பாவநிவாரணப் பலி’ பொதுவாகப் புரியக்கூடிய மரியாதையான வழக்கு; ‘தூய்மைப்படுத்தும் பலி’ என்ற சாத்தியமான நுட்பப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: וּמָלַק
  choice: தலையைக் கிள்ளி முறிக்க வேண்டும்
  rationale: מלק என்பது பறவைப் பலியில் ஆசாரியன் கையால் செய்யும் குறிப்பிட்ட சடங்குச் செயலைக் குறிக்கும் தொழில்நுட்ப வினை. ‘கிள்ளி முறிக்க’ என்பது செயலைத் தெளிவாக்குகிறது; முழுமையாகத் துண்டிப்பதாகப் பொருள்படாதபடி அடுத்த கட்டளை வரம்பிடுகிறது.
- source_word: מִמּוּל עָרְפּוֹ
  choice: கழுத்தருகே
  rationale: מול மற்றும் ערף சேர்ந்த இச்சொற்றொடரின் துல்லியமான உடற்கூறு இடம் விவாதத்துக்குரியது; ‘கழுத்தருகே’ இயல்பான தமிழில் இடத்தைக் குறிப்பிடுவதோடு, ‘முன்புறம்’ அல்லது ‘பிடரி’ என்று தேவையற்ற முறையில் ambiguity-ஐத் தீர்மானிப்பதைத் தவிர்க்கிறது.
- source_word: וְלֹא יַבְדִּיל
  choice: தலையை முழுவதுமாகப் பிரித்துவிடக் கூடாது
  rationale: בדל என்பதன் ‘பிரித்தல்’ என்ற பொருளையும், இங்கு தலை உடலிலிருந்து முற்றிலும் துண்டிக்கப்படக் கூடாது என்ற நடைமுறைப் பொருளையும் தெளிவாகக் கூறுகிறது.
theological_decisions:
- issue: חַטָּאת என்ற பலிப்பெயரின் பொருள்
  choice: பாவநிவாரணப் பலி
  alternative: தூய்மைப்படுத்தும் பலி
  rationale: முதன்மை உரை வாசகர்களுக்குப் பரிச்சயமான பலிப்பெயரைப் பயன்படுத்துகிறது; எனினும் லேவியராகமச் சூழலில் உள்ள தூய்மைப்படுத்தும் பரிமாணத்தை அடிக்குறிப்பில் வைத்திருப்பதால் ஒரு குறிப்பிட்ட கோட்பாட்டு விளக்கத்தை மட்டும் திணிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டவிதிக்குரிய கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. ‘வேண்டும்/கூடாது’ கட்டமைப்பு எபிரெயச் சட்ட உத்தரவின் வலிமையை இயல்பாகத் தருகிறது. கொண்டுவருபவரும் சடங்கை நிறைவேற்றும் ஆசாரியனும் குழப்பமடையாதபடி இரண்டாம் வாக்கியத்தில் ‘ஆசாரியன்’ வெளிப்படையாக மீண்டும் சொல்லப்பட்டுள்ளது.
