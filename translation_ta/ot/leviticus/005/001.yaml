revisions:
- from: ஒருவர் பாவம் செய்தால்—சாட்சி சொல்லும்படி ஆணையிட்டு அழைக்கும் குரலை அவர் கேட்டிருந்தும், தான் கண்டதையோ அறிந்ததையோ பற்றிச் சாட்சியாக இருந்தும், அதைத் தெரிவிக்காவிட்டால்—அவர் தமது குற்றத்தைச் சுமப்பார்.[a]
  to: ஒருவர் பாவம் செய்து, சாட்சியம் அளிக்கும்படி விடுக்கப்பட்ட சத்திய ஆணையைக் கேட்டும்,[a] சாட்சியாக இருந்து, ஒரு காரியத்தைக் கண்டிருந்தாலோ அதைப் பற்றி அறிந்திருந்தாலோ, அதைத் தெரிவிக்காமல் இருந்தால், அவர் தம் குற்றத்தைச் சுமப்பார்.[b]
  rationale: The revision resolves the unclear witness clause by stating that the person is a witness and may have gained knowledge either by seeing or otherwise knowing. It replaces the cumbersome ‘குரலை ... கேட்டிருந்தும்’ expansion with a natural formal Tamil rendering of the solemn adjuration, while a lexical footnote preserves the literal ‘voice of an oath’ wording and its interpretive range. The final liability idiom and its explanatory note are retained with a correctly corresponding anchor.
