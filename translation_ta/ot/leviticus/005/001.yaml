  text: וְ/נֶ֣פֶשׁ כִּֽי תֶחֱטָ֗א וְ/שָֽׁמְעָה֙ ק֣וֹל אָלָ֔ה וְ/ה֣וּא עֵ֔ד א֥וֹ רָאָ֖ה א֣וֹ יָדָ֑ע אִם ל֥וֹא יַגִּ֖יד וְ/נָשָׂ֥א עֲוֺנֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/001.yaml
  text: If a person sins[a] because he hears a public adjuration and he is a witness—whether he has seen or otherwise knows—and he does not report it[b], then he shall bear his guilt.
translation:
  language: ta
  text: ஒருவர் பாவம் செய்து, சாட்சியம் அளிக்கும்படி விடுக்கப்பட்ட சத்திய ஆணையைக் கேட்டும்,[a] சாட்சியாக இருந்து, ஒரு காரியத்தைக் கண்டிருந்தாலோ அதைப் பற்றி அறிந்திருந்தாலோ, அதைத் தெரிவிக்காமல் இருந்தால், அவர் தம் குற்றத்தைச் சுமப்பார்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆணையின் குரலைக் கேட்டும்.” எபிரெயச் சொற்றொடர் சாட்சியம் கோரும் ஒரு முறையான சத்திய ஆணை அல்லது ஆணையிட்ட அழைப்பைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “தம் அக்கிரமத்தைச் சுமப்பார்.” சாட்சியத்தைத் தெரிவிக்காமல் விட்டதற்கான குற்றப்பொறுப்பும் அதன் விளைவுகளும் அவர்மேல் இருக்கும் என்பதை இந்த எபிரெயச் சொற்றொடர் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: ஒருவர்
  rationale: சட்டப் பகுதியில் נֶפֶשׁ என்பது முழு மனித நபரைக் குறிக்கிறது; ‘ஒருவர்’ இயல்பான நவீனத் தமிழாகும்.
- source_word: תֶחֱטָא
  choice: பாவம் செய்தால்
  rationale: חטא இங்கு ஒழுக்க மற்றும் சட்டக் குற்றப்பொறுப்பை உணர்த்துகிறது; ‘பாவம் செய்தால்’ அந்த இரு பரிமாணங்களையும் காக்கிறது.
- source_word: וְשָׁמְעָה קוֹל אָלָה
  choice: சாட்சி சொல்லும்படி ஆணையிட்டு அழைக்கும் குரலை அவர் கேட்டிருந்தும்
  rationale: קוֹל אָלָה என்பதன் சொற்பொருள் ‘ஆணையின் குரல்’; இச்சட்டச் சூழலில் அது தெரிந்ததைச் சொல்லுமாறு ஆணையிட்டு அழைப்பதைக் குறிக்கிறது. தமிழில் செயற்பாட்டைத் தெளிவாகக் கூறியபோதும் ‘குரல்’ என்ற மூல உருவகம் காக்கப்படுகிறது.
- source_word: וְהוּא עֵד
  choice: சாட்சியாக இருந்தும்
  rationale: அந்த விவகாரத்தைப் பற்றிய நபரின் சட்ட நிலையைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: אוֹ רָאָה אוֹ יָדָע
  choice: தான் கண்டதையோ அறிந்ததையோ பற்றி
  rationale: நேரில் கண்ட அறிவையும் வேறு வழியில் பெற்ற அறிவையும் மூலத்தின் இணைச்சொற்கள் தனித்தனியே வைத்துள்ளன; தமிழ் மொழிபெயர்ப்பும் அந்த விரிவைத் தீர்மானிக்காமல் காக்கிறது.
- source_word: אִם לֹא יַגִּיד
  choice: அதைத் தெரிவிக்காவிட்டால்
  rationale: נגד என்பதன் ஹிஃபில் வடிவம் தெரியப்படுத்துதல் அல்லது அறிவித்தலைக் குறிக்கிறது; ‘தெரிவிக்காவிட்டால்’ நீதிமன்றச் சாட்சியமாக மட்டும் பொருளைக் குறுக்காமல் சட்டச் சூழலுக்கு ஏற்றதாக உள்ளது.
- source_word: וְנָשָׂא עֲוֺנוֹ
  choice: அவர் தமது குற்றத்தைச் சுமப்பார்
  rationale: குற்றமும் அதனால் வரும் பொறுப்பும் அந்த நபர்மேல் நிலைத்திருப்பதை எபிரெயச் சொற்றொடர் உணர்த்துகிறது; ‘குற்றத்தைச் சுமப்பார்’ அதன் உருவகத்தையும் இறையியல் எடையையும் காக்கிறது.
theological_decisions:
- issue: சட்ட வழக்கில் பாலினக் குறிப்பு
  choice: பாலினம் குறிப்பிடாத ஒருமை வடிவமான ‘ஒருவர் ... அவர்’ பயன்படுத்தப்பட்டது.
  alternative: ஆண்பால் குறிக்கும் ‘ஒருவன் ... அவன்’ பயன்படுத்துதல்.
  rationale: נֶפֶשׁ என்பது இங்கு பாலினம் வரையறுக்காத ‘நபர்’; பின்னுள்ள எபிரெய இலக்கண வடிவங்களின் பாலினத்தைத் தமிழில் உயிரியல் பாலினமாக மாற்ற வேண்டியதில்லை.
- issue: קוֹל אָלָה என்பதன் சட்டப் பொருள்
  choice: சாட்சி சொல்லும்படி ஆணையிட்டு அழைக்கும் குரல்
  alternative: சாபத்தின் குரல் / சத்தியத்தின் குரல்
  rationale: אָלָה என்பது சாபம், சத்திய ஆணை, ஆணையிட்ட அழைப்பு ஆகிய பொருள் வரம்பைக் கொண்டது. இங்கு சாட்சியாக இருப்பவர் தெரிவிக்காத சூழல், சாட்சி கோரும் பொது ஆணையைக் குறிக்கிறது; இருந்தாலும் ‘குரல்’ என்ற மூலச் சொல்லுரு காக்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சட்டப் பகுதியின் கண்ணியமான தொனியைப் பேணியுள்ளோம். நீண்ட எபிரெய நிபந்தனை வாக்கியத்தின் தொடர்புகள் கோடுகளால் தெளிவாக்கப்பட்டுள்ளன; தேவையற்ற சமயமரபுச் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
