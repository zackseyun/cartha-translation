  edition: WLC
  text: וֶ/הֱבִיאָ/הּ֮ אֶל הַ/כֹּהֵן֒ וְ/קָמַ֣ץ הַ/כֹּהֵ֣ן מִ֠מֶּ/נָּה מְל֨וֹא קֻמְצ֜/וֹ אֶת אַזְכָּרָתָ/ה֙ וְ/הִקְטִ֣יר הַ/מִּזְבֵּ֔חָ/ה עַ֖ל אִשֵּׁ֣י יְהוָ֑ה חַטָּ֖את הִֽוא־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/012.yaml
  text: Then he shall bring it to the priest[a], and the priest shall take from it a handful as its memorial portion and burn it on the altar, in addition to the food offerings of Yahweh[b]. It is a sin offering.
translation:
  language: ta
  text: பின்பு அவன் அதை ஆசாரியனிடம் கொண்டுவர வேண்டும். ஆசாரியன் அதிலிருந்து அதன் நினைவுப்பகுதியாகத் தன் கைநிறைய எடுத்து, அதை யாவேக்குச் செலுத்தப்படும் நெருப்புப் பலிகளின்மேல் பலிபீடத்தில் எரிக்க வேண்டும். இது பாவநிவாரணப் பலி.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இது தூய்மைப்படுத்தும் பலி’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல், பாவத்தால் ஏற்பட்ட அசுத்தத்தை நீக்கும் பலியைக் குறிக்கக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: וֶהֱבִיאָהּ
  choice: பின்பு அவன் அதை ... கொண்டுவர வேண்டும்
  rationale: தொடர்நிகழ்வைக் குறிக்கும் waw-ஐ இயல்பான தமிழில் ‘பின்பு’ எனவும், Hiphil வினையையும் பெண்பால் ஒருமை பின்னொட்டையும் முந்தைய சூழலிலுள்ள மாவுப் படையலைக் குறிக்கும் ‘அதை’ எனவும் வழங்குகிறது.
- source_word: וְקָמַץ ... מְלֹא קֻמְצוֹ
  choice: தன் கை நிறைய எடுத்து
  rationale: பலிச்சடங்கில் ஆசாரியன் எடுக்கும் அளவைச் சுட்டும் தொழில்நுட்பச் சொற்றொடர்; சொல்லுக்குச் சொல் அமைப்பின் செயற்கைத்தன்மையைத் தவிர்த்து அளவையும் செயலையும் தெளிவாகக் கூறுகிறது.
- source_word: אֶת אַזְכָּרָתָהּ
  choice: அதன் நினைவுப்பகுதியாக
  rationale: பலிபீடத்தில் எரிக்கப்படும் தானியப் படையலின் பிரதிநிதிப் பகுதியைக் குறிக்கும் சடங்குசார் பொருளை ‘நினைவுப்பகுதி’ காக்கிறது.
- source_word: וְהִקְטִיר הַמִּזְבֵּחָה
  choice: பலிபீடத்தில் எரிக்க வேண்டும்
  rationale: קטר என்பதன் பலிச்சடங்குச் சூழலிலான பொருளையும், திசைச்சுட்டு வடிவம் இங்கு தரும் இடப்பொருளையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: עַל אִשֵּׁי יְהוָה
  choice: யாவேக்குச் செலுத்தப்படும் நெருப்புப் பலிகளின்மேல்
  rationale: על என்பதன் அடிப்படை ‘மேல்’ பொருளைப் பாதுகாத்து, אִשִּׁים என்ற சடங்குசார் சொல்லைத் தெளிவான ‘நெருப்புப் பலிகள்’ என வழங்குகிறது; ‘உணவுப் பலிகள்’ என்பது இவ்விடத்தில் எபிரெயச் சொல்லைவிட விளக்கமளிக்கும் மொழிபெயர்ப்பாகிவிடும்.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: חַטָּאת הִוא
  choice: இது பாவநிவாரணப் பலி
  rationale: חטאת இங்கு பலியின் வகைப்பெயராக வருகிறது. ‘பாவநிவாரணப் பலி’ என்பது பாவத்தைக் கையாளும் பலி என்ற வழக்கமான பொருளைத் தருகிறது; தூய்மைப்படுத்தும் செயல்பாட்டை வலியுறுத்தும் மாற்று மொழிபெயர்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: ஆசாரியச் சட்டத்தில் חַטָּאת என்பதன் பொருள்
  choice: பாவநிவாரணப் பலி
  alternative: தூய்மைப்படுத்தும் பலி
  rationale: இவ்வசனத்தின் உடனடிச் சூழலில் இது பலியின் வகைப்பெயர். எனினும், எபிரெயச் சொல் பாவத்தையும் அதனால் ஏற்பட்ட அசுத்தத்தை நீக்கும் சடங்கையும் இணைத்துக் குறிக்கக்கூடும்; ஆகவே முக்கிய மாற்று அடிக்குறிப்பில் காக்கப்படுகிறது.
- issue: עַל אִשֵּׁי יְהוָה என்பதில் עַל-இன் உறவு
  choice: யாவேக்குச் செலுத்தப்படும் நெருப்புப் பலிகளின்மேல்
  alternative: யாவேக்குச் செலுத்தப்படும் நெருப்புப் பலிகளோடு சேர்த்து
  rationale: עַל என்பதன் நேரடிப் பொருளான ‘மேல்’ என்பதை முதன்மை உரையில் காக்கிறது. இச்சடங்கு சூழலில் ‘அவற்றோடு சேர்த்து’ என்ற தொடர்புப் பொருளும் சாத்தியம்; ஆனால் அதைத் தேர்ந்தெடுப்பது மூலத்தின் இடவியல் நுணுக்கத்தைத் தீர்மானமாக மாற்றிவிடும்.
translation_notes:
  register: நவீன, பொதுவாகப் புரியும், மரியாதைமிக்க தமிழ் பயன்படுத்தப்பட்டுள்ளது. ஆசாரியன், பலிபீடம், நெருப்புப் பலி, நினைவுப்பகுதி போன்ற சடங்குசார் முக்கிய சொற்கள் ஒருமைப்பாட்டுடன் காக்கப்பட்டுள்ளன. அடிக்குறிப்பு குறியீடு முதன்மை உரையில் இடம்பெற்றுள்ளது.
