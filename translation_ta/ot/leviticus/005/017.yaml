base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/017.yaml
  text: And if a person sins and does any one of all the things that by Yahweh’s commandments must not be done[a], though he did not know it[b], then he is guilty and shall bear his iniquity.
translation:
  language: ta
  text: ஒருவர் பாவம் செய்து, யாவேயின் கட்டளைகளில் செய்யக்கூடாதவையாகக் கூறப்பட்ட செயல்களில் ஏதேனும் ஒன்றைச் செய்தால், அதை அவர் அறியாதிருந்தாலும், அவர் குற்றப்பொறுப்புக்கு ஆளாகிறார்[a]; அவர் தமது அக்கிரமத்தைச் சுமப்பார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘குற்றவாளியாகிறார்’ அல்லது ‘குற்றப்பொறுப்பை ஏற்கிறார்.’ எபிரெயச் சொல், அந்தச் செயலின் விளைவாக ஒருவர் குற்றப்பொறுப்புக்கு ஆளாவதைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘தமது குற்றப்பொறுப்பைச் சுமப்பார்.’ ‘அக்கிரமத்தைச் சுமப்பது’ என்ற எபிரெய மரபுத்தொடர், தவறுக்கான பொறுப்பையோ அதன் விளைவையோ சுமப்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: ஒருவர்
  rationale: இங்கு נֶפֶשׁ என்பது உடலிலிருந்து வேறான ‘ஆத்துமா’ என்பதை வலியுறுத்தாமல், சட்டத்திற்கு உட்பட்ட ஒரு தனிநபரைக் குறிக்கிறது. ‘ஒருவர்’ என்பது நவீனத் தமிழில் இயல்பான பொதுப்பால் பயன்பாடு.
- source_word: תֶחֱטָא
  choice: பாவம் செய்து
  rationale: ஆசாரியச் சட்டச் சூழலில் חטא நேரடியாகப் பாவம் செய்வதைக் குறிக்கிறது.
- source_word: וְעָשְׂתָה אַחַת מִכָּל
  choice: செயல்கள் அனைத்திலும் ஏதாவது ஒன்றைச் செய்தால்
  rationale: தடைசெய்யப்பட்ட மொத்தச் செயல்களிலிருந்து ஒரு செயலைச் செய்வது என்ற எபிரெயப் பகிர்வு உணர்வைப் பாதுகாக்கிறது.
- source_word: מִצְוֺת יְהוָה
  choice: யாவேயின் கட்டளைகள்
  rationale: מִצְוֺת என்பது உடன்படிக்கை மற்றும் சட்டச் சூழலில் ‘கட்டளைகள்’ என இயல்பாக மொழிபெயர்க்கப்படுகிறது; יהוה என்ற திருப்பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்படுகிறது.
- source_word: אֲשֶׁר לֹא תֵעָשֶׂינָה
  choice: செய்யக்கூடாத செயல்கள்
  rationale: எபிரெயச் சொற்றொடரின் சட்டபூர்வமான தடையைத் தெளிவான, இயற்கையான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: וְלֹא יָדַע
  choice: அதை அவர் அறியாதிருந்தாலும்
  rationale: குற்றமான செயல் அறியாமையில் செய்யப்பட்டதைக் காட்டுகிறது; ‘அதை’ என்பது தமிழில் தேவையான தொடர்பைத் தெளிவாக்குகிறது.
- source_word: וְאָשֵׁם
  choice: அவர் குற்றவாளி
  rationale: செயலின் விளைவாக ஏற்படும் குற்றநிலையையோ குற்றப்பொறுப்பையோ אָשֵׁם குறிக்கக்கூடும்; ‘குற்றவாளி’ சுருக்கமாகவும் சட்டச் சூழலுக்கு ஏற்றதாகவும் உள்ளது.
- source_word: וְנָשָׂא עֲוֺנוֹ
  choice: அவர் தமது அக்கிரமத்தைச் சுமப்பார்
  rationale: ‘அக்கிரமத்தைச் சுமத்தல்’ என்ற எபிரெயச் சட்ட/உடன்படிக்கை மரபுத்தொடரின் கனத்தையும், குற்றப்பொறுப்பு அல்லது அதன் விளைவு என்ற விரிவையும் பாதுகாக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் நான்கெழுத்துத் திருப்பெயர் நேரடியாக இடம்பெறுவதால், உடன்படிக்கையின் தனிப்பெயரைப் பொதுப் பட்டமாக மாற்றாமல் ‘யாவே’ என்று வழங்குகிறது.
- issue: அறியாமையில் செய்யப்பட்ட மீறலுக்கும் குற்றப்பொறுப்புக்கும் உள்ள தொடர்பு
  choice: அதை அவர் அறியாதிருந்தாலும், அவர் குற்றவாளி
  alternative: அறிந்தபின் அவர் குற்றவாளியாகிறார்
  rationale: மூலம் அறியாமையைச் சொல்லியபோதும் குற்றநிலையை உறுதிப்படுத்துகிறது; குற்றப்பொறுப்பு எப்போது உணரப்படுகிறது என்பதைக் குறித்து வசனம் சொல்லாததை மொழிபெயர்ப்பு கூடுதலாகத் தீர்மானிக்கவில்லை.
- issue: נשא עון என்ற மரபுத்தொடரின் பொருள்
  choice: அக்கிரமத்தைச் சுமப்பார்
  alternative: குற்றப்பொறுப்பைச் சுமப்பார்
  rationale: மரபுத்தொடர் குற்றம், அதற்கான பொறுப்பு, அல்லது அதன் விளைவு ஆகியவற்றை உள்ளடக்கக்கூடும். முதன்மை உரை அந்த இறையியல் மற்றும் சட்டப் பரப்பைத் திறந்தவாறே வைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் லேவியராகமத்தின் சட்டநடைக்கு ஏற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘ஒருவர்/அவர்’ என்ற பொதுப்பால் ஒருமைப் பயன்பாடு தனிநபருக்கான சட்ட விதியை இயல்பாக எடுத்துரைக்கிறது. அடிக்குறிப்பு குறியீடுகள் அவை விளக்கும் சொற்றொடர்களுக்குப் பின்னரே வைக்கப்பட்டுள்ளன.
