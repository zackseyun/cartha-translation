base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/018.yaml
  text: He shall bring to the priest a ram without blemish from the flock[a], according to your valuation, for a guilt offering; and the priest shall make atonement for him concerning the error that he committed unintentionally, though he did not know it[b], and he shall be forgiven.
translation:
  language: ta
  text: அவன் மந்தையிலிருந்து குறைபாடற்ற ஒரு செம்மறியாட்டுக் கடாவை, உன் மதிப்பீட்டின்படி, குற்றநிவாரணப் பலியாக[a] ஆசாரியனிடம் கொண்டுவர வேண்டும். அவன் அறியாமல் செய்த தவறுக்காக[b] ஆசாரியன் அவனுக்காகப் பாவநிவிர்த்தி செய்வார்; அப்போது அவனுக்கு மன்னிப்பு கிடைக்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘குற்றப்பலியாக’ என்றும் மொழிபெயர்க்கலாம்; ‘ஈடுசெய்யும் பலி’ என்பதும் சாத்தியம். எபிரேய אָשָׁם ஒரு குறிப்பிட்ட பலிவகையின் பெயர்.
    reason: lexical_alternative
  - marker: b
    text: ‘அவன் அறியாமல் செய்த பாவத்துக்காக’ என்றும் மொழிபெயர்க்கலாம். எபிரேயச் சொற்கள் வேண்டுமென்றே செய்யப்படாத தவற்றை வலியுறுத்துகின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבִיא
  choice: கொண்டுவர வேண்டும்
  rationale: சட்ட அறிவுறுத்தலில் இவ்வினை கட்டாயக் கடமையைக் குறிக்கிறது; நவீன தமிழில் ‘வேண்டும்’ அந்த விதிப்பாங்கை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אַיִל תָּמִים
  choice: பழுதற்ற ஒரு செம்மறியாட்டுக் கடா
  rationale: אַיִל என்பது வளர்ந்த ஆண் செம்மறியாடு; பலிக்கான சூழலில் תָּמִים உடற்குறை அல்லது பழுது இல்லாத நிலையைக் குறிக்கிறது.
- source_word: מִן הַצֹּאן
  choice: மந்தையிலிருந்து
  rationale: צֹאן சிறிய கால்நடைகளின் மந்தையைக் குறிக்கிறது; אַיִל ஏற்கெனவே செம்மறியாட்டுக் கடாவைத் தெளிவுபடுத்துவதால் இச்சொல் இயல்பாகவும் சுருக்கமாகவும் உள்ளது.
- source_word: בְּעֶרְכְּךָ
  choice: உன் மதிப்பீட்டின்படி
  rationale: எபிரேய இரண்டாம் நபர் ஒருமை வடிவையும் பலிக்குரிய மதிப்பிடுதல் என்ற சட்டநடைமுறையையும் விளக்கம் சேர்க்காமல் காக்கிறது.
- source_word: לְאָשָׁם
  choice: குற்றநிவாரணப் பலியாக
  rationale: אָשָׁם லேவியராகமத்தில் ஒரு குறிப்பிட்ட பலிவகையின் பெயர். ‘குற்றநிவாரணம்’ குற்றத்தையும் அதற்கான ஈடுசெய்யும் அம்சத்தையும் ஒருங்கே உணர்த்துகிறது.
- source_word: וְכִפֶּר עָלָיו
  choice: ஆசாரியன் அவனுக்காகப் பாவநிவிர்த்தி செய்வார்
  rationale: ஆசாரிய பலிச்சூழலில் כפר குறிக்கும் நிவிர்த்திச் செயலைத் தமிழில் அறியப்பட்ட, கண்ணியமான நடையில் தெரிவிக்கிறது; עָלָיו என்பதன் பயனாளியையும் ‘அவனுக்காக’ காக்கிறது.
- source_word: עַל שִׁגְגָתוֹ אֲשֶׁר שָׁגָג
  choice: தவறிழைத்த அந்தத் தவறுக்காக
  rationale: பெயர்ச்சொல் மற்றும் அதனுடன் தொடர்புடைய வினைச்சொல்லின் மீளுருவை இயன்றவரை காத்து, திட்டமிடாத தவறைச் சுட்டுகிறது.
- source_word: וְהוּא לֹא יָדַע
  choice: தான் அறியாமலே
  rationale: அந்தச் செயல் அறிவின்றி நிகழ்ந்தது என்பதைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: וְנִסְלַח לוֹ
  choice: அவனுக்கு மன்னிப்பு கிடைக்கும்
  rationale: எபிரேய மறைமுகச் செயப்பாட்டு வடிவில் செய்பவர் குறிப்பிடப்படாத தன்மையைத் தொடர்ந்து காத்து, முடிவாகக் கிடைக்கும் மன்னிப்பைத் தெளிவாகச் சொல்கிறது.
theological_decisions:
- issue: אָשָׁם என்ற பலிவகையின் பெயர்
  choice: குற்றநிவாரணப் பலி
  alternative: குற்றப்பலி; ஈடுசெய்யும் பலி
  rationale: இது பொதுவான ‘பாவம்’ என்ற கருத்தை மட்டும் அல்லாமல் குறிப்பிட்ட ஆசாரிய பலிவகையைக் குறிக்கிறது. ‘குற்றநிவாரணப் பலி’ குற்றத்தையும் நிவாரண/ஈடுசெய்தல் சார்ந்த நுணுக்கத்தையும் காக்கிறது.
- issue: כפר என்பதன் மொழிபெயர்ப்பு
  choice: பாவநிவிர்த்தி செய்வார்
  alternative: பரிகாரம் செய்வார்; தூய்மைப்படுத்துவார்
  rationale: இவ்வசனத்தில் ஆசாரியரின் பலிச் செயலும் அதன் விளைவான மன்னிப்பும் இணைந்துள்ளன. ‘பாவநிவிர்த்தி’ அதன் இறையியல் கனத்தைத் தக்கவைத்தபடியே பொதுவாசகருக்குப் புரியும் சொல்லாக உள்ளது.
- issue: மன்னிப்பை வழங்கும் செய்பவர் குறிப்பிடப்படாமை
  choice: அவனுக்கு மன்னிப்பு கிடைக்கும்
  alternative: அவன் மன்னிக்கப்படுவான்
  rationale: וְנִסְלַח לוֹ செய்பவரைப் பெயரிடாத இறைச் செயப்பாட்டை உடையது. மொழிபெயர்ப்பு இறைவனை மறுப்பதுமில்லை, மூலத்தில் வெளிப்படையாக இல்லாத செய்பவரைச் சேர்ப்பதுமில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், சட்ட அறிவுறுத்தலுக்கேற்ற கண்ணியமான நடையும் பொதுவாசகருக்குப் புரியும் சொற்களும் பயன்படுத்தப்பட்டுள்ளன. ‘ஆசாரியன்’, ‘பலி’, ‘பாவநிவிர்த்தி’ போன்ற நிலைபெற்ற வேதாகமச் சொற்கள் தேவையான இடங்களில் தக்கவைக்கப்பட்டுள்ளன; மூலத்தின் அறியாமை, தவறு, மன்னிப்பு ஆகிய தொடர்புகள் மிகைவிளக்கமின்றி பாதுகாக்கப்பட்டுள்ளன.
