  text: And it shall be[a], when he sins and becomes guilty, that he shall restore what he took by robbery, or what he extorted, or the deposit that was entrusted to him, or the lost thing that he found[c][b],
translation:
  language: ta
  text: அவன் பாவம் செய்து குற்றப்பொறுப்புக்கு ஆளாகும்போது[a], கொள்ளையடித்துப் பறித்ததையோ, ஒடுக்கிப் பெற்றதையோ[b], தன்னிடம் ஒப்படைக்கப்பட்ட பொருளையோ, தான் கண்டெடுத்த காணாமற்போன பொருளையோ[c] திருப்பிக் கொடுக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவன் பாவம் செய்து குற்றப்பொறுப்புக்கு ஆளானால்.” எபிரெய சட்டச் சூத்திரத்தை “போது” அல்லது “என்றால்” என்று மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “ஒடுக்குதலால் கைப்பற்றியதையோ,” “மோசடியாகப் பெற்றதையோ.” எபிரெயச் சொல் ஒடுக்குதல், சுரண்டுதல் அல்லது பிறருடைய சொத்தை மோசடியாகப் பிடித்துவைத்தல் ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “தான் கண்டெடுத்த இழந்த சொத்தையோ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: …போது
  rationale: எபிரெய சட்ட வழக்கில் ஒரு நிகழ்வை அறிமுகப்படுத்தும் சூத்திரத்தை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது; ‘என்றால்’ என்பதும் சாத்தியம்.
- source_word: יֶחֱטָא וְאָשֵׁם
  choice: பாவம் செய்து குற்றவாளியாகும்போது
  rationale: חטא என்பதன் பாவம் என்ற உடன்படிக்கைசார் ஒழுக்கப் பொருளையும், אשם என்பதன் குற்றப்பொறுப்பு நிலைக்கு ஆளாகும் பொருளையும் காக்கிறது.
- source_word: וְהֵשִׁיב
  choice: திருப்பிக் கொடுக்க வேண்டும்
  rationale: சட்டரீதியான மீட்டளிப்புக் கடமையைத் தெளிவான தமிழில் தெரிவிக்கிறது.
- source_word: הַגְּזֵלָה אֲשֶׁר גָּזָל
  choice: கொள்ளையடித்துப் பறித்ததை
  rationale: பெயர்–வினை ஒத்திசைவைச் சொற்குச் சொல் மீளுரையாக்காமல், வலுக்கட்டாயமான அல்லது சட்டவிரோதமான பறிப்பை வெளிப்படுத்துகிறது.
- source_word: הָעֹשֶׁק אֲשֶׁר עָשָׁק
  choice: ஒடுக்கிப் பெற்றதை
  rationale: עשק குறிக்கும் ஒடுக்குதல், சுரண்டுதல், மோசடியாகப் பிடித்துவைத்தல் ஆகிய பரப்பை மிகக் குறுகலாக்காமல் சொத்து சார்ந்த சூழலில் தருகிறது.
- source_word: הַפִּקָּדוֹן אֲשֶׁר הָפְקַד אִתּוֹ
  choice: தன்னிடம் ஒப்படைக்கப்பட்ட பொருளை
  rationale: ஒருவரின் பாதுகாப்புப் பொறுப்பில் வைக்கப்பட்ட சொத்தை இயல்பாகவும் சட்டத் தெளிவுடனும் குறிக்கிறது.
- source_word: הָאֲבֵדָה אֲשֶׁר מָצָא
  choice: தான் கண்டெடுத்த காணாமற்போன பொருளை
  rationale: கண்டெடுக்கப்பட்ட இழந்த சொத்து என்பதைக் கூடுதல் விளக்கமின்றித் தெளிவாகக் கூறுகிறது.
theological_decisions:
- issue: וְאָשֵׁם என்பதன் பொருள்
  choice: குற்றவாளியாகும்போது
  alternative: தன் குற்றத்தை உணரும்போது
  rationale: மூல வினை குற்றப்பொறுப்புக்கு ஆளாகுதலைக் குறிக்க முடியும்; மனதளவிலான குற்றவுணர்வை மட்டும் உரையில் சேர்க்காமல் சட்ட மற்றும் இறையியல் பதற்றத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சட்டக் கட்டளையின் வலிமையை ‘வேண்டும்’ மூலம் காக்கும் dignified, பொதுவாசகர்களுக்குப் புரியும் நடை. பட்டியலின் இணை அமைப்பு பாதுகாக்கப்பட்டுள்ளது.
