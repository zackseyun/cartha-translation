base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/005.yaml
  text: And it shall be[a], when he becomes guilty in one of these matters[b], that he shall confess what he has sinned in regard to it.
translation:
  language: ta
  text: இவற்றில் ஏதாவது ஒன்றில் ஒருவன் குற்றப்பொறுப்புக்கு ஆளானால்[a], தான் அதில் செய்த பாவத்தை அவன் ஒப்புக்கொள்ள வேண்டும்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “குற்றநிலைக்கு ஆளானால்” அல்லது “குற்றமுடையவனானால்.” எபிரெய வினைச்சொல், தவறு செய்ததை உள்ளத்தில் உணர்வதை மட்டும் அல்லாமல், குற்றத்திற்குரிய சட்டப்பொறுப்பு ஏற்பட்டிருப்பதை வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: நேரடி வடிவில், “அவன் அதைக் குறித்து பாவம் செய்ததை.” “அதில்” என்பது முன்பு பட்டியலிடப்பட்ட நிகழ்வுகளில் ஒன்றைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: …ஆகும்போது
  rationale: சட்டவிதியில் அடுத்து நிகழ வேண்டிய சூழலை அறிமுகப்படுத்தும் எபிரெயச் சூத்திரத்தை இயல்பான நவீன தமிழில் காலநிலைத் தொடராக வழங்குகிறது.
- source_word: יֶאְשַׁם
  choice: குற்றவாளியாகும்போது
  rationale: அகம் சார்ந்த குற்றவுணர்வை மட்டுமல்லாமல், குற்றத்திற்குரிய சட்டப்பொறுப்பு ஏற்பட்ட நிலையைச் சுட்டுகிறது.
- source_word: לְאַחַת מֵאֵלֶּה
  choice: இவற்றில் ஏதாவது ஒன்றில்
  rationale: முன்பு பட்டியலிடப்பட்ட நிகழ்வுகளில் ஒன்றைத் தெளிவாகச் சுட்டி, மூலத்தின் ஒருமைத் தன்மையைப் பேணுகிறது.
- source_word: וְהִתְוַדָּה
  choice: அறிக்கையிட வேண்டும்
  rationale: Hitpael வடிவின் ‘ஒப்புக்கொள்/அறிக்கையிடு’ என்ற பொருளையும் சட்டவிதியின் கட்டாயத்தையும் இயல்பான தமிழில் தருகிறது.
- source_word: אֲשֶׁר חָטָא עָלֶיהָ
  choice: தான் அதில் செய்த பாவத்தை
  rationale: பாவத்தின் உள்ளடக்கத்தையும், பெண்பால் ஒருமை பின்னொட்டு முன் கூறிய ஒரு நிகழ்வைச் சுட்டுவதையும் காக்கிறது.
theological_decisions:
- issue: יֶאְשַׁם என்பது குற்றத்தை உணர்வதா அல்லது குற்றப்பொறுப்புக்கு ஆளாவதா
  choice: குற்றவாளியாகும்போது
  alternative: தன் குற்றத்தை உணரும்போது
  rationale: மூல வினைச்சொல் சட்டரீதியான குற்றநிலையையோ பொறுப்பையோ முன்னிறுத்துகிறது; உள்ளார்ந்த உணர்தலை மட்டும் உரையில் சேர்ப்பது தேவையற்ற விளக்கமாகும்.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டவிதிக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘அறிக்கையிட வேண்டும்’ என்பது கட்டாயத்தைத் தெளிவாக்குகிறது; ‘குற்றவாளியாகும்போது’ என்பது உளவியல் உணர்வைச் சேர்க்காமல் சட்டரீதியான குற்றநிலையைப் பேணுகிறது. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடப்பட்டுள்ளன.
