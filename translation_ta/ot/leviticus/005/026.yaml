  text: וְ/כִפֶּ֨ר עָלָ֧י/ו הַ/כֹּהֵ֛ן לִ/פְנֵ֥י יְהוָ֖ה וְ/נִסְלַ֣ח ל֑/וֹ עַל אַחַ֛ת מִ/כֹּ֥ל אֲשֶֽׁר יַעֲשֶׂ֖ה לְ/אַשְׁמָ֥ה בָֽ/הּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/026.yaml
  text: And the priest shall make atonement for him before Yahweh[a], and he will be forgiven for any one of all the things by which one may incur guilt.
translation:
  language: ta
  text: ஆசாரியன் அவனுக்காக யாவேவின் முன்னிலையில் பாவநிவிர்த்தி செய்வான்; அவன் செய்து குற்றத்துக்கு ஆளாகக்கூடிய எல்லாச் செயல்களிலும் ஏதேனும் ஒன்றிற்காக அவன் மன்னிக்கப்படுவான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'நெருக்கமான மாற்று: “அவன் குற்றத்துக்கு ஆளாகும்படி செய்யக்கூடிய எல்லாவற்றிலும் ஒன்றிற்காக.”'
    reason: எபிரெயத்தின் ‘எல்லாவற்றிலும் ஒன்றிற்காக’ என்ற கட்டமைப்பைச் சற்றுக் கூடுதலாக வெளிப்படுத்துகிறது.
lexical_decisions:
- source_word: וְכִפֶּר עָלָיו
  choice: அவனுக்காகப் பாவநிவிர்த்தி செய்வான்
  rationale: כפר என்பதன் பியேல் வடிவம் பலிசார் சூழலில் ஒருவருக்காகப் பாவநிவிர்த்தி செய்வதைக் குறிக்கிறது; על பயனாளியைக் குறிக்கிறது.
- source_word: הַכֹּהֵן
  choice: ஆசாரியன்
  rationale: பலிசார் சூழலில் உள்ள குறிப்பிட்ட பணியாளரைக் குறிக்கும் இயல்பான தமிழ் வேதாகமச் சொல்.
- source_word: לִפְנֵי יְהוָה
  choice: யாவேக்கு முன்பாக
  rationale: லִפְנֵי என்பது சந்நிதி அல்லது முன்னிலை உணர்வைக் கொண்டது; יהוה உடன்படிக்கைப் பெயராக ஒலிபெயர்க்கப்படுகிறது.
- source_word: וְנִסְלַח לוֹ
  choice: அவன் மன்னிக்கப்படுவான்
  rationale: סלח என்பதன் நிஃபால் வடிவத்தின் செயப்பாட்டு விளைவைப் பாதுகாக்கிறது; மன்னிப்பவர் யார் என்பதை உரை வெளிப்படையாகச் சொல்லாததால் அதையும் சேர்க்கவில்லை.
- source_word: עַל אַחַת מִכֹּל
  choice: இவற்றுள் எதன் ... அதற்காக
  rationale: மொத்த வகையிலுள்ள எந்த ஒரு தனிப்பட்ட குற்றத்திற்கும் பொருந்தும் பகிர்வுணர்வை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר יַעֲשֶׂה לְאַשְׁמָה בָהּ
  choice: எதன் மூலம் ஒருவன் குற்றத்துக்கு ஆளாகக்கூடுமோ
  rationale: செயலின் மூலம் குற்றநிலை ஏற்படுவதைக் காட்டும் எபிரெயக் கட்டமைப்பைத் தெளிவாகவும், ‘குற்றநிவாரண பலி’ என்ற பொருளைத் தவறாகப் புகுத்தாமலும் தருகிறது.
theological_decisions:
- issue: יהוה என்ற இறைபெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் வரும் நான்கு எழுத்து உடன்படிக்கைப் பெயரைப் பொதுப்பட்டமாக மாற்றாமல் ஒலிபெயர்த்து வழங்குகிறது.
- issue: மன்னிப்பை வழங்குபவர்
  choice: செயப்பாட்டு வடிவில் மறைமுகமாக வைத்தல்
  alternative: தேவன் அவனை மன்னிப்பார்
  rationale: மூல எபிரெயம் மன்னிப்பவரை வெளிப்படையாகக் குறிப்பிடாமல் וְנִסְלַח לוֹ எனக் கூறுவதால் அந்த மறைமுகத்தன்மை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பலிசார் சொல்லாட்சிக்குத் தகுந்த கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘பாவநிவிர்த்தி’ என்பது כפר என்பதன் சடங்குசார் பொருளைத் தக்கவைக்கிறது; குறிப்பிட்ட பரிகாரக் கோட்பாடு எதையும் சேர்க்கவில்லை.
