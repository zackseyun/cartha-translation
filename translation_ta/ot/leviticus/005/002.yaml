  naturalness: நடை பொதுவாக நவீன நிலையான தமிழுக்கு இயல்பானது. ஆனால் “தீட்டுப்பட்டவராகி, குற்றப்பொறுப்புக்கு உள்ளாகிறார்” என்பதற்குப் பதிலாக இணைநிலையைத் தெளிவாகக் காட்டும் வடிவம் சட்ட உரையில் இயல்பாகவும் துல்லியமாகவும் இருக்கும். அடிக்குறிப்பு அ-வில் தொடக்கத்திலுள்ள “அல்லது” தேவையற்றது.
  terminology: ‘ஒருவர்,’ ‘தீட்டான,’ ‘காட்டு விலங்கு,’ ‘கால்நடை,’ மற்றும் ‘செத்த உடல்’ ஆகியவை பொருத்தமானவை. ‘ஊர்ந்து செல்லும் சிற்றுயிர்’ שֶׁרֶץ என்னும் பரந்த வகைக்குப் பயன்படுத்தத்தக்கது. ‘குற்றப்பொறுப்பு’ אָשֵׁם என்பதன் சட்டரீதியான பொறுப்புணர்வை, தீட்டு தன்னிலேயே ஒழுக்கப் பாவம் என்று ஆக்காமல் நன்றாக வெளிப்படுத்துகிறது.
