  text: א֣וֹ נֶ֗פֶשׁ אֲשֶׁ֣ר תִּגַּע֮ בְּ/כָל דָּבָ֣ר טָמֵא֒ אוֹ֩ בְ/נִבְלַ֨ת חַיָּ֜ה טְמֵאָ֗ה א֤וֹ בְּ/נִבְלַת֙ בְּהֵמָ֣ה טְמֵאָ֔ה א֕וֹ בְּ/נִבְלַ֖ת שֶׁ֣רֶץ טָמֵ֑א וְ/נֶעְלַ֣ם מִמֶּ֔/נּוּ וְ/ה֥וּא טָמֵ֖א וְ/אָשֵֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/002.yaml
  text: Or if a person touches any unclean thing—whether the carcass of an unclean wild animal[a], or the carcass of unclean livestock, or the carcass of an unclean swarming creature—and it is hidden from him, and he is unclean and becomes guilty[b],
translation:
  language: ta
  text: அல்லது, ஒருவர் தீட்டான எதையாவது—தீட்டான காட்டு விலங்கின் செத்த உடலையோ, தீட்டான கால்நடையின் செத்த உடலையோ, தீட்டான ஊர்ந்து செல்லும் சிற்றுயிரின் செத்த உடலையோ—தொட்டு, அது அவருக்குத் தெரியாமல் போயிருந்தால்[a], அவர் தீட்டுப்பட்டவராகவும் குற்றப்பொறுப்புக்கு உட்பட்டவராகவும் இருப்பார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவர் அதை அறியாமல் இருந்தால்”; சொல்லர்த்தமாக, “அது அவரிடமிருந்து மறைந்திருந்தால்.”
    reason: lexical_alternative
  - marker: b
    text: அதாவது, அந்தத் தீட்டு அவருக்குப் பொருந்துவதால் அவர் அதற்கான பொறுப்புக்கு உட்படுகிறார். விலங்கின் செத்த உடலைத் தொடுவது, நோக்கத்துடன் செய்யப்படும் பாவத்தைப் போலவே தன்னிலேயே ஓர் ஒழுக்கத் தீமை என்று இது அவசியமாகக் கூறவில்லை.
    reason: cultural_note
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: ஒருவர்
  rationale: சட்டப் பின்னணியில் இந்தச் சொல் உடலற்ற ‘ஆத்துமா’ என்பதைக் குறிக்காமல், ஒரு தனிநபரைக் குறிக்கிறது. ‘ஒருவர்’ என்பது பொதுவான நபரை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: תִּגַּע בְּ
  choice: தொட்டு
  rationale: ב உடன் வரும் נגע உடல்ரீதியான தொடர்பைக் குறிக்கிறது; ‘தொட்டு’ என்பது நேரடியான, தெளிவான மொழிபெயர்ப்பு.
- source_word: כָל דָּבָר טָמֵא
  choice: தீட்டான எதையாவது
  rationale: דָּבָר இங்கு பின்வரும் எடுத்துக்காட்டுகளை உள்ளடக்கும் பரந்த வகையைக் குறிக்கிறது. ‘எதையாவது’ அந்தப் பொதுவான வரம்பை இயல்பாகக் காக்கிறது.
- source_word: נִבְלַת
  choice: செத்த உடல்
  rationale: லேவியராகமத்தின் தூய்மைச் சட்டங்களில் נְבֵלָה என்பது விலங்கின் சடலத்தைக் குறிக்கிறது. ‘செத்த உடல்’ சாதாரண வாசகர்களுக்கு உடனடியாகப் புரியும்; மனித உடலை நினைவூட்டக்கூடிய ‘பிணம்’ என்பதையும் தவிர்க்கிறது.
- source_word: חַיָּה טְמֵאָה
  choice: தீட்டான காட்டு விலங்கு
  rationale: חַיָּה இங்கு בְּהֵמָה என்பதிலிருந்து வேறுபட்டு, வளர்ப்பு விலங்கல்லாத காட்டு விலங்கைக் குறிக்கிறது.
- source_word: בְּהֵמָה טְמֵאָה
  choice: தீட்டான கால்நடை
  rationale: בְּהֵמָה இங்கு வீட்டில் வளர்க்கப்படும் நாற்கால் விலங்குகளைக் குறிக்கிறது. ‘கால்நடை’ காட்டு விலங்குடன் உள்ள வேறுபாட்டைச் சுருக்கமாகக் காட்டுகிறது.
- source_word: שֶׁרֶץ טָמֵא
  choice: தீட்டான ஊர்ந்து செல்லும் சிற்றுயிர்
  rationale: שֶׁרֶץ சிறிய, தரையில் ஊரும் அல்லது திரளும் உயிரினங்களுக்கான பரந்த வகைப்பெயர். ‘ஊர்ந்து செல்லும் சிற்றுயிர்’ நவீன தமிழில் புரியக்கூடியதாக இருந்து, ஒரு குறிப்பிட்ட இனத்துக்கு பொருளைக் குறுக்குவதில்லை.
- source_word: וְנֶעְלַם מִמֶּנּוּ
  choice: அது அவருக்குத் தெரியாமல் போயிருந்தால்
  rationale: எபிரெய வடிவம் அந்த விவரம் நபரிடமிருந்து மறைந்திருந்தது என்ற நோக்கைத் தருகிறது; தமிழில் அதன் பொருளான அறியாமையை இயல்பாக இவ்வாறு தெரிவிக்கிறது. நேரடி உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וְהוּא טָמֵא
  choice: அவர் தீட்டுப்பட்டவராகி
  rationale: இந்தக் கூறு தொடுதலால் ஏற்படும் சடங்குசார் நிலையைச் சொல்கிறது. ‘தீட்டுப்பட்டவர்’ என்பது ஒழுக்கக்கேடு என்று தவறாக வலுப்படுத்தாமல் அந்த நிலையைத் தெரிவிக்கிறது.
- source_word: וְאָשֵׁם
  choice: குற்றப்பொறுப்புக்கு உள்ளாகிறார்
  rationale: אָשֵׁם இச்சட்டப் பின்னணியில் குற்றம் அல்லது அதற்கான பொறுப்பு ஏற்பட்ட நிலையைக் குறிக்கிறது. ‘குற்றப்பொறுப்பு’ என்பது இதை நோக்கமுள்ள ஒழுக்கத் தீமையுடன் தானாகச் சமப்படுத்தாமல் சட்டரீதியான பொறுப்பை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: தீட்டின் இயல்பு
  choice: טָמֵא/טְמֵאָה என்பவற்றை ‘தீட்டான/தீட்டுப்பட்ட’ என்று மொழிபெயர்த்தல்
  alternative: அசுத்தமான; கறைப்பட்ட; பாவமுள்ள
  rationale: வசனம் விலங்கின் செத்த உடலைத் தொடுவதால் வரும் சடங்குசார் தீட்டைக் குறிக்கிறது; அந்தத் தொடுதல் தன்னிலேயே ஒழுக்கரீதியான தீமை என்று கூறவில்லை.
- issue: אָשֵׁם என்பதிலுள்ள குற்றமும் பொறுப்பும்
  choice: ‘குற்றப்பொறுப்புக்கு உள்ளாகிறார்’
  alternative: ‘குற்றவாளியாகிறார்’; ‘குற்றமுள்ளவராகிறார்’
  rationale: மூலச்சொல்லில் உண்மையான குற்றநிலை அல்லது பொறுப்பு உள்ளது; அதேவேளையில், அதை நோக்கமுள்ள பாவம் என்ற ஒரே பொருளில் தீர்மானிக்கக் கூடாது. தேர்ந்த மொழிபெயர்ப்பு இந்தச் சட்ட மற்றும் இறையியல் பதற்றத்தைப் பாதுகாக்கிறது.
- issue: பொதுவான நபரைக் குறிக்கும் இலக்கணம்
  choice: נֶפֶשׁ என்பதற்கு ‘ஒருவர்’; தொடர்ச்சியில் மரியாதை ஒருமையான ‘அவர்’
  alternative: ‘ஒரு ஆத்துமா’; ‘ஒருவன்/அவன்’
  rationale: எபிரெயச் சட்டத்தின் வரம்பு பொதுவான தனிநபர். நவீனத் தமிழில் ‘ஒருவர்/அவர்’ பாலினத்தைத் தேவையின்றி முன்வைக்காமல், dignified singular reference-ஐ வழங்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்ட உரைக்கு ஏற்ற கண்ணியமான ஆனால் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘தீட்டு’ என்ற சொல் லேவியராகமத்தின் சடங்குசார் தூய்மை வகையைத் தெளிவாகக் காக்கிறது. நீண்ட எபிரெயப் பட்டியல் தமிழில் கோடுகளாலும் ‘-ஓ’ இணைப்பாலும் வாசிக்க எளிதாக்கப்பட்டுள்ளது; மூலத்தின் மூன்று விலங்கு வகைகளும் தனித்தனியாகப் பாதுகாக்கப்பட்டுள்ளன.
