  revised_text: அல்லது, ஒருவர் தீட்டான எதையாவது—தீட்டான காட்டு விலங்கின் செத்த உடலையோ, தீட்டான கால்நடையின் செத்த உடலையோ, தீட்டான ஊர்ந்து செல்லும் சிற்றுயிரின் செத்த உடலையோ—தொட்டு, அது அவருக்குத் தெரியாமல் போயிருந்தால்[a], அவர் தீட்டுப்பட்டவராகவும் குற்றப்பொறுப்புக்கு உட்பட்டவராகவும் இருப்பார்[b].
