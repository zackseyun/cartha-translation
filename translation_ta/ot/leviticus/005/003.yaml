revisions:
- from: அல்லது, ஒருவன் மனிதத் தீட்டில்[a]—ஒருவரைத் தீட்டுப்படுத்தும் எந்தத் தீட்டிலாவது—தொட்டு, அது அவனுக்கு மறைந்திருந்து[b], பின்னர் அவன் அதை அறியவந்தால், அவன் குற்றவாளியாகிறான்.
  to: அல்லது, ஒருவன் மனிதத் தீட்டில்[a]—ஒருவரைத் தீட்டுப்படுத்துகிற எந்தத் தீட்டாக இருந்தாலும்—தொடுகிறானோ, அது அவனுக்குத் தெரியாமல் இருந்து, பின்னர் அவன் அதை அறிந்தால், அவன் குற்றப்பொறுப்புடையவனாகிறான்.
  rationale: The revision keeps the source’s conditional legal formulation, the generic force of אדם, and the ritual character of impurity. It improves Tamil syntax and clarifies the final legal liability without resolving it into a doctrinal claim about moral sin. Footnote b is retained as an audit aid with idiomatic Tamil wording; its anchor belongs after ‘அது அவனுக்குத் தெரியாமல் இருந்து’.
