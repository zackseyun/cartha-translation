base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/003.yaml
  text: Or if he touches human uncleanness—any uncleanness by which one becomes unclean—and it is hidden from him, and then he comes to know it, he is guilty.
translation:
  language: ta
  text: அல்லது, ஒருவன் மனிதத் தீட்டில்[a]—ஒருவரைத் தீட்டுப்படுத்துகிற எந்தத் தீட்டாக இருந்தாலும்—தொடுகிறானோ, அது அவனுக்குத் தெரியாமல் இருந்து, பின்னர் அவன் அதை அறிந்தால், அவன் குற்றப்பொறுப்புடையவனாகிறான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மனித அசுத்தம்.’ இச்சட்டச் சூழலில் எபிரெயச் சொல் சடங்குசார் தீட்டைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִגַּע בְּ
  choice: தொட்டு
  rationale: בְ உடன் வரும் נגע உடல்ரீதியான தொடர்பைக் குறிக்கிறது; தமிழில் ‘தொடு’ என்பது நேரடியான, இயல்பான தெரிவு.
- source_word: טֻמְאַת אָדָם
  choice: மனிதத் தீட்டு
  rationale: லேவியராகமத்தின் சட்டச் சூழலில் טֻמְאָה சடங்குசார் அசுத்தநிலையைக் குறிக்கிறது; אָדָם இங்கு பாலினத்தைச் சுட்டாமல் மனித மூலத்தைக் குறிக்கிறது.
- source_word: לְכֹל טֻמְאָתוֹ
  choice: எந்தத் தீட்டிலாவது
  rationale: மனிதருடன் தொடர்புடைய எல்லா வகையான தீட்டையும் உள்ளடக்கும் பொதுமைப்படுத்தும் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: אֲשֶׁר יִטְמָא בָּהּ
  choice: ஒருவரைத் தீட்டுப்படுத்தும்
  rationale: அந்தத் தீட்டினால் ஒருவர் சடங்குசார் தீட்டுள்ளவராகும் விளைவைப் பொதுப்படையாகக் காட்டுகிறது.
- source_word: וְנֶעְלַם מִמֶּנּוּ
  choice: அது அவனுக்கு மறைந்திருந்து
  rationale: עלם என்பதன் நிபால் வடிவிலுள்ள செயப்பாட்டு நுணுக்கத்தையும், அப்போது அவன் அதை அறியாதிருந்ததையும் பாதுகாக்கிறது.
- source_word: וְהוּא יָדַע
  choice: பின்னர் அவன் அதை அறியவந்தால்
  rationale: முன்னிருந்த அறியாமைக்குப் பின் ஏற்பட்ட உணர்தலை வசனத்தின் தொடர்ச்சிக்கேற்ப வெளிப்படுத்துகிறது.
- source_word: וְאָשֵׁם
  choice: அவன் குற்றவாளியாகிறான்
  rationale: சட்ட-பலிசார் சூழலில் ஏற்பட்ட குற்றநிலை அல்லது பொறுப்பைச் சுருக்கமாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: லேவியச் சட்டத்தில் טֻמְאָה என்பதன் இயல்பு
  choice: தீட்டு
  alternative: அசுத்தம்
  rationale: இங்கு உடல்தொடர்பால் ஏற்படும் சடங்குசார் நிலையே பேசப்படுகிறது; ஒழுக்கக்கேடு அல்லது பாவத்தன்மை எனப் பொருளேற்றப்படவில்லை.
- issue: אָדָם என்பதன் பொருள்
  choice: மனித
  alternative: மனிதன்
  rationale: இச்சொல் இங்கு ஆணை மட்டும் குறிக்காமல், மனிதரிடமிருந்து வரும் தீட்டை பொதுவாகக் குறிக்கிறது.
- issue: וְאָשֵׁם குறிக்கும் சட்டநிலை
  choice: குற்றவாளியாகிறான்
  alternative: குற்றப்பொறுப்பு உடையவனாகிறான்
  rationale: அறியாமையால் ஏற்பட்ட தீட்டும் பின்னர் அறியப்படும்போது குற்றப்பொறுப்பை உண்டாக்குகிறது என்ற உரையின் பதற்றத்தைத் தீர்த்துவிடாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், லேவியச் சட்டத்திற்குரிய கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டது. ‘தீட்டு’ சடங்குசார் அசுத்தநிலையைத் தெளிவாகக் காட்டுகிறது; ‘ஒருவன்/அவன்’ என்பது மூலத்தின் ஒருமைச் சட்ட வடிவத்தைப் பேணுகிறது.
