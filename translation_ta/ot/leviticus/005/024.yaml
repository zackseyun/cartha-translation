base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/024.yaml
  text: or anything about which he swore falsely—he shall repay it in full[a], and shall add a fifth to it. He shall give it to the one to whom it belongs on the day of his guilt offering.
translation:
  language: ta
  text: அல்லது எதைப்பற்றிப் பொய்யாக ஆணையிட்டானோ, அதை முழுமையாகத் திருப்பிக் கொடுத்து, அதனுடன் ஐந்தில் ஒரு பங்கையும் சேர்க்க வேண்டும். அது யாருக்குச் சொந்தமானதோ அவருக்கு, தன் குற்றநிவாரணப் பலியைச் செலுத்தும் நாளில்[a] அதைக் கொடுக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனுடைய குற்றத்தின் நாளில்.” மூல எபிரெயச் சொல் குற்றநிலையையோ குற்றநிவாரணப் பலியையோ குறிக்கலாம்; இங்கே முதன்மை உரை பலிச் சூழலைப் பின்பற்றுகிறது.
    reason: மூல எபிரெயத் தொடரில் உள்ள உண்மையான பொருள் இருமையை, கூடுதல் விளக்கக் கருத்துகளைச் சேர்க்காமல் பாதுகாக்கிறது.
lexical_decisions:
- source_word: א֠וֹ מִכֹּל אֲשֶׁר
  choice: அல்லது எதைப்பற்றி
  rationale: முந்தைய வசனத்தின் பட்டியலைத் தொடரும் பிரிநிலை இணைப்பையும், எந்தப் பொருள் அல்லது விவகாரத்தையும் உள்ளடக்கும் எபிரெய விரிவையும் இயல்பான தமிழில் தருகிறது.
- source_word: יִשָּׁבַע עָלָיו לַשֶּׁקֶר
  choice: பொய்யாக ஆணையிட்டானோ
  rationale: ஒரு பொருள் அல்லது விவகாரம் குறித்து பொய்யாணை செய்ததைக் குறிக்கும் சட்டப் பொருளைச் சுருக்கமாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: וְשִׁלַּם אֹתוֹ בְּרֹאשׁוֹ
  choice: அதை முழுமையாகத் திருப்பிக் கொடுத்து
  rationale: சொல்லுக்குச் சொல் ‘அதன் தலையுடன்’ என்பது அசல் முதல்தொகை அல்லது முழு மதிப்பை ஈடுசெய்வதைக் குறிக்கும் எபிரெய சட்ட மரபுத்தொடர்; ‘முழுமையாகத் திருப்பிக் கொடுத்து’ என்பது அதன் செயற்பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: וַחֲמִשִׁתָיו יֹסֵף עָלָיו
  choice: அதனுடன் ஐந்தில் ஒரு பங்கையும் சேர்க்க வேண்டும்
  rationale: அசல் மதிப்பிற்கு மேலாக இருபது விழுக்காடு சேர்க்கப்பட வேண்டும் என்ற சட்ட விதியைத் துல்லியமாக வெளிப்படுத்துகிறது.
- source_word: לַאֲשֶׁר הוּא לוֹ
  choice: அது யாருக்குச் சொந்தமானதோ அவருக்கு
  rationale: சொல்லுக்குச் சொல் வடிவின் உரிமை சார்ந்த சட்டப் பொருளைத் தெளிவான நவீன தமிழில் பாதுகாக்கிறது.
- source_word: יִתְּנֶנּוּ
  choice: அதைக் கொடுக்க வேண்டும்
  rationale: נתן என்பதன் பொதுவான ‘கொடு’ என்ற பொருளையும், உரியவரிடம் ஈட்டுத்தொகையை ஒப்படைக்கும் இச்சூழலையும் நேரடியாகத் தருகிறது.
- source_word: בְּיוֹם אַשְׁמָתוֹ
  choice: தன் குற்றநிவாரணப் பலியைச் செலுத்தும் நாளில்
  rationale: אַשְׁמָה/אָשָׁם குடும்பச் சொற்கள் குற்றநிலையையோ அதனுடன் தொடர்புடைய குற்றநிவாரணப் பலியையோ குறிக்கலாம். அடுத்துவரும் பலிச் சட்டச் சூழலை முன்னிட்டு முதன்மை உரை பலியைக் குறிக்கும் வாசிப்பைப் பின்பற்றுகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: בְּיוֹם אַשְׁמָתוֹ என்பதில் குற்றநிலையா, குற்றநிவாரணப் பலியா?
  choice: தன் குற்றநிவாரணப் பலியைச் செலுத்தும் நாளில்
  alternative: தன் குற்றம் வெளிப்படும் நாளில் / தான் குற்றவாளியென்று உணரும் நாளில்
  rationale: மூலச்சொல் குற்றத்தையும் குற்றத்துக்கான பலியையும் சுட்டக்கூடியது. லேவியராகமத்தின் உடனடி பலிச் சூழல் காரணமாக முதன்மை உரையில் பலி சார்ந்த வாசிப்பு ஏற்கப்படுகிறது; ஆயினும் மூலத்தின் உண்மையான பொருள் இருமை அடிக்குறிப்பில் வெளிப்படையாக வைக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; சட்ட உரைக்குரிய தெளிவும் வேதாகம உரைக்குரிய கண்ணியமும் பேணப்பட்டுள்ளன. ‘ஆணையிட்டான்,’ ‘முழுமையாகத் திருப்பிக் கொடுத்து,’ ‘ஐந்தில் ஒரு பங்கு’ போன்ற சொற்றொடர்கள் சாதாரண வாசகர்களுக்குப் புரியுமாறு தேர்ந்தெடுக்கப்பட்டன. அடிக்குறி [a] அது விளக்கும் இறுதிக் காலத் தொடருக்குப் பின்னரே வைக்கப்பட்டுள்ளது.
