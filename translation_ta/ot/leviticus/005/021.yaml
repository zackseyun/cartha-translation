- from: 'ஒருவர் பாவம் செய்து, யாவேக்கு எதிராக நம்பிக்கைத் துரோகம் செய்து, தன்னிடம் பாதுகாப்புக்காக ஒப்படைக்கப்பட்ட பொருளைப் பற்றியோ, தன் கையில் ஒப்படைக்கப்பட்ட ஒன்றைப் பற்றியோ[a], கொள்ளையைப் பற்றியோ தன் சக மனிதரிடம் பொய் சொன்னால், அல்லது தன் சக மனிதரை ஒடுக்கினால்,


