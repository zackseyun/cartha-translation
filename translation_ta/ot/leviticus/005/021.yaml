  text: נֶ֚פֶשׁ כִּ֣י תֶחֱטָ֔א וּ/מָעֲלָ֥ה מַ֖עַל בַּ/יהוָ֑ה וְ/כִחֵ֨שׁ בַּ/עֲמִית֜/וֹ בְּ/פִקָּד֗וֹן אֽוֹ בִ/תְשׂ֤וּמֶת יָד֙ א֣וֹ בְ/גָזֵ֔ל א֖וֹ עָשַׁ֥ק אֶת עֲמִיתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/021.yaml
  text: If a person sins and commits a breach of faith against Yahweh by deceiving his neighbor about a security entrusted to him[a], or a pledge, or through robbery, or if he has oppressed his neighbor,
translation:
  language: ta
  text: 'ஒருவர் பாவம் செய்து, யாவேக்கு எதிராகத் துரோகமாக நடந்து, தன்னிடம் பாதுகாப்பாக ஒப்படைக்கப்பட்ட பொருளைக் குறித்தோ, தன் கையில் வைக்கப்பட்ட ஒன்றைக் குறித்தோ[a], கொள்ளையைக் குறித்தோ தன் அயலானிடம் பொய் கூறினால், அல்லது தன் அயலானை ஒடுக்கினால்,


    [a] அல்லது, “அடமானமாகக் கொடுக்கப்பட்ட ஒன்றைக் குறித்தோ.” எபிரெயச் சொற்றொடரின் நேரடிப் பொருள் “கையில் வைக்கப்பட்ட ஒன்று” என்பதாகும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அடமானமாகக் கொடுக்கப்பட்ட ஒன்றைக் குறித்தோ.” எபிரெயச் சொற்றொடரின் நேரடிப் பொருள் “கையில் வைக்கப்பட்ட ஒன்று” என்பதாகும்.
    reason: תְשׂוּמֶת יָד என்ற அரிதான சட்டச் சொற்றொடர் ஒப்படைக்கப்பட்ட பொருள், அடமானம் அல்லது கையில் வைக்கப்பட்ட ஒன்று என்று புரிந்துகொள்ளப்படலாம்; உண்மையான சொற்பொருள் ஐயம் காக்கப்படுகிறது.
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: ஒருவர்
  rationale: சட்ட உரையில் இந்தச் சொல் உள்ளார்ந்த ‘ஆத்துமா’வைக் குறிக்காமல் தனிநபரைக் குறிக்கிறது; ‘ஒருவர்’ என்பது இயல்பான, பாலினப் பொதுமையான தமிழ்.
- source_word: כִּי תֶחֱטָא
  choice: பாவம் செய்து
  rationale: כִּי இங்கு ஒரு நிபந்தனைச் சட்ட வாக்கியத்தைத் தொடங்குகிறது; வாக்கியத்தின் இறுதியில் வரும் ‘சொன்னால்/ஒடுக்கினால்’ என்பதுடன் இணைத்து தமிழில் இயல்பாக அமைக்கப்பட்டது.
- source_word: וּמָעֲלָה מַעַל
  choice: நம்பிக்கைத் துரோகம் செய்து
  rationale: ஒரே வேர்ச்சொல்லின் வினை–பெயர் இணைப்பு வலியுறுத்தும் விசுவாசமின்மை மற்றும் துரோகத்தின் உறவுசார் வலிமையை இது எடுத்துரைக்கிறது.
- source_word: בַּיהוָה
  choice: யாவேக்கு எதிராக
  rationale: தெய்வீகப் பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது; சக மனிதருக்கு இழைக்கப்படும் குற்றம் யாவேக்கு எதிரான துரோகமாகவும் உரை வெளிப்படையாகக் கூறுவதைக் காக்கிறது.
- source_word: וְכִחֵשׁ
  choice: பொய் சொன்னால்
  rationale: இந்தச் சூழலில் வினை மறுத்துப் பொய் கூறுதல் அல்லது வஞ்சகமாக நடத்தல் என்பதைக் குறிக்கலாம்; பொருட்களைப் பற்றிய சட்டத் தகராறில் ‘பொய் சொன்னால்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: בַּעֲמִיתוֹ
  choice: தன் சக மனிதரிடம்
  rationale: עָמִית சமூகத்திலுள்ள மற்றொரு நபரைச் சுட்டுகிறது; ‘சக மனிதர்’ அதன் உறவுசார் பொருளைக் காக்கிறது.
- source_word: בְּפִקָּדוֹן
  choice: தன்னிடம் பாதுகாப்புக்காக ஒப்படைக்கப்பட்ட பொருளைப் பற்றி
  rationale: பாதுகாத்து வைத்திருக்க ஒருவரிடம் ஒப்படைக்கப்பட்ட உடைமையை இச்சொல் குறிக்கிறது; தமிழ் வடிவம் சட்டப் பொருளைத் தெளிவாக்குகிறது.
- source_word: בִתְשׂוּמֶת יָד
  choice: தன் கையில் ஒப்படைக்கப்பட்ட ஒன்றைப் பற்றி
  rationale: ‘கையில் வைக்கப்பட்டது’ என்ற நேரடிப் படிமத்தையும் ஒப்படைப்பு சார்ந்த பொருளையும் காக்கிறது; ‘அடமானம்’ என்ற சாத்தியமான பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: בְגָזֵל
  choice: கொள்ளையைப் பற்றி
  rationale: வலுக்கட்டாயமாகப் பறித்தல் அல்லது அப்படிப் பறிக்கப்பட்ட பொருள் என்ற இரு சாத்தியங்களையும் தேவையின்றி குறுக்காமல், பட்டியலின் சட்டச் சூழலுக்கு ஏற்ற பரந்த வடிவம்.
- source_word: עָשַׁק אֶת עֲמִיתוֹ
  choice: தன் சக மனிதரை ஒடுக்கினால்
  rationale: சுரண்டுதல், அநியாயமாகப் பிடித்துவைத்தல், வற்புறுத்திப் பறித்தல் ஆகிய பொருள்களை உள்ளடக்கக்கூடிய எபிரெய வினையின் பரப்பை ‘ஒடுக்குதல்’ காக்கிறது.
theological_decisions:
- issue: சமூக அல்லது பொருளாதாரக் குற்றம் கடவுளுக்கு எதிரான துரோகமாகவும் கூறப்படுவது
  choice: யாவேக்கு எதிராக நம்பிக்கைத் துரோகம் செய்து
  alternative: யாவே தொடர்பாக விசுவாசமின்றி நடந்து
  rationale: அண்டை மனிதருக்கு எதிரான வஞ்சகத்தை உரை நேரடியாக யாவேக்கு எதிரான துரோகமாகச் சித்தரிக்கிறது; அந்த இறையியல் பதற்றம் விளக்கிச் சமப்படுத்தப்படாமல் காக்கப்பட்டுள்ளது.
- issue: יהוה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் உள்ள தனிப்பெயரைத் தமிழில் ஒலிபெயர்த்து, பொதுப்பட்டமாக மாற்றாமல் வைத்துள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சட்ட உரைக்கு ஏற்ற கண்ணியமான ஆனால் பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. தொடர் நிபந்தனை வாக்கியம் அடுத்த வசனத்தில் நிறைவடைவதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது; மூலத்தின் தொடர்ச்சி காக்கப்படுகிறது.
