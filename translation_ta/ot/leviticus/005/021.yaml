  to: 'ஒருவர் பாவம் செய்து, யாவேக்கு எதிராகத் துரோகமாக நடந்து, தன்னிடம் பாதுகாப்பாக ஒப்படைக்கப்பட்ட பொருளைக் குறித்தோ, தன் கையில் வைக்கப்பட்ட ஒன்றைக் குறித்தோ[a], கொள்ளையைக் குறித்தோ தன் அயலானிடம் பொய் கூறினால், அல்லது தன் அயலானை ஒடுக்கினால்,


    [a] அல்லது, “அடமானமாகக் கொடுக்கப்பட்ட ஒன்றைக் குறித்தோ.” எபிரெயச் சொற்றொடரின் நேரடிப் பொருள் “கையில் வைக்கப்பட்ட ஒன்று” என்பதாகும்.'
