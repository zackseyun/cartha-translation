  text: וְ/כִפֶּר֩ עָלָ֨י/ו הַ/כֹּהֵ֜ן עַל חַטָּאת֧/וֹ אֲשֶׁר חָטָ֛א מֵֽ/אַחַ֥ת מֵ/אֵ֖לֶּה וְ/נִסְלַ֣ח ל֑/וֹ וְ/הָיְתָ֥ה לַ/כֹּהֵ֖ן כַּ/מִּנְחָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/013.yaml
  text: Thus the priest shall make atonement for him for his sin that he committed in any one of these matters[a], and he shall be forgiven. And it shall belong to the priest, like the grain offering.
translation:
  language: ta
  text: இவ்வாறு, இவற்றில் ஏதாவது ஒன்றில் அவன் செய்த பாவத்திற்காக ஆசாரியன் அவனுக்காகப் பாவநிவிர்த்தி செய்வான்; அவன் மன்னிக்கப்படுவான்.[a] அந்தக் காணிக்கை தானியக் காணிக்கையைப் போல ஆசாரியனுக்குச் சேரும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனுக்கு அது மன்னிக்கப்படும்.” எபிரெய மொழியில் இவ்வாக்கியம் செயப்பாட்டு வடிவில் உள்ளது; மன்னிப்பவர் யார் என்று வெளிப்படையாகக் குறிப்பிடப்படவில்லை.
    reason: மூலமொழியின் மாற்று இலக்கண வாசிப்பையும், மன்னிப்பவரைப் பெயரிடாத அதன் அமைப்பையும் காட்டுகிறது.
lexical_decisions:
- source_word: וְכִפֶּר
  choice: பாவநிவிர்த்தி செய்வான்
  rationale: ஆசாரியச் சடங்கின் மூலம் பாவத்திற்கான நிவிர்த்தியை ஏற்படுத்துவதை כפר குறிக்கிறது. எந்த ஒரு குறிப்பிட்ட பிராயச்சித்தக் கோட்பாட்டையும் திணிக்காமல், லேவியராகமத்தின் பலிசார் பொருளை இந்தச் சொற்றொடர் தெளிவாகக் காக்கிறது.
- source_word: עָלָיו
  choice: அவனுக்காக
  rationale: כפר என்பதுடன் வரும் עַל, குற்றம் செய்தவனின் சார்பாக ஆசாரியன் செயல்படுவதை இங்கு குறிக்கிறது.
- source_word: הַכֹּהֵן
  choice: ஆசாரியன்
  rationale: லேவியராகமத்தின் வழிபாட்டுச் சட்டச் சூழலில் כֹּהֵן என்பதற்கான இயல்பான, நிலைபெற்ற தமிழ் சொல்.
- source_word: עַל חַטָּאתוֹ אֲשֶׁר חָטָא
  choice: அவன் செய்த பாவத்திற்காக
  rationale: חַטָּאת என்பது ‘பாவம்’ அல்லது ‘பாவநிவாரணக் காணிக்கை’ எனப் பொருள்படலாம். ஆனால் ‘அவன் செய்த’ என்ற தொடர்புச் சொற்றொடர் இங்கு காணிக்கையை அல்ல, அவன் செய்த பாவத்தையே சுட்டுகிறது.
- source_word: מֵאַחַת מֵאֵלֶּה
  choice: இவற்றில் ஏதாவது ஒன்றில்
  rationale: முந்தைய வசனங்களில் பட்டியலிடப்பட்ட நிகழ்வுகளில் ஒன்றைச் சுட்டும் பகுதிப்பொருளை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְנִסְלַח לוֹ
  choice: அவன் மன்னிக்கப்படுவான்
  rationale: எபிரெய வினை செயல்பாட்டாளரைப் பெயரிடாத செயப்பாட்டு வடிவில் உள்ளது. இந்த மொழிபெயர்ப்பு மன்னிப்பவரை வெளிப்படையாகச் சேர்க்காமல் அந்தக் கட்டுப்பாட்டைக் காக்கிறது.
- source_word: וְהָיְתָה לַכֹּהֵן
  choice: அந்தக் காணிக்கை ஆசாரியனுக்குச் சேரும்
  rationale: பெண்பால் வினை முன்னுள்ள மாவுக் காணிக்கையைச் சுட்டுகிறது. தமிழில் சுட்டுப்பொருள் தெளிவாக இருக்க ‘அந்தக் காணிக்கை’ என வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: כַּמִּנְחָה
  choice: தானியக் காணிக்கையைப் போல
  rationale: லேவியராகமத்தின் இந்த வழிபாட்டுச் சூழலில் מִנְחָה குறிப்பாகத் தானியக் காணிக்கையைக் குறிக்கிறது.
theological_decisions:
- issue: பலிச் சடங்கைத் தொடர்ந்து வரும் மன்னிப்பு வாய்பாட்டின் மொழிபெயர்ப்பு
  choice: அவன் மன்னிக்கப்படுவான்
  alternative: அவனுக்கு அது மன்னிக்கப்படும்
  rationale: மூல எபிரெயம் மன்னிப்பவரை வெளிப்படையாகப் பெயரிடாமல் செயப்பாட்டு வடிவைப் பயன்படுத்துகிறது. தேர்ந்தெடுக்கப்பட்ட வாசகம் தமிழில் இயல்பாக இருந்து, அந்த இறையியல் கட்டுப்பாட்டையும் காக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வழிபாட்டுச் சட்டத்திற்கேற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘பாவநிவிர்த்தி’, ‘ஆசாரியன்’, ‘தானியக் காணிக்கை’ ஆகிய நிலைபெற்ற வேதாகமச் சொற்கள் பயன்படுத்தப்பட்டாலும் வாக்கிய அமைப்பு எளிமையாக வைக்கப்பட்டுள்ளது.
