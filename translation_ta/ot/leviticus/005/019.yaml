  text: It is a guilt offering[a]; he has indeed incurred guilt against Yahweh.
translation:
  language: ta
  text: இது குற்றநிவாரணப் பலி[a]; அவன் யெகோவாவுக்கு எதிராக உண்மையிலேயே குற்றவாளியாகியிருக்கிறான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இது குற்றநிவாரணப் பலி; அவன் யெகோவாவுக்கு முன்பாக நிச்சயமாகக் குற்றவாளி.” எபிரெயத்தில் “குற்றம் / குற்றவாளியாகுதல்” என்ற ஒரே சொல்வேர் வலியுறுத்தலுக்காக மீண்டும் மீண்டும் வருகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָשָׁם
  choice: குற்றநிவாரணப் பலி
  rationale: பலியிடுதல் சார்ந்த இச்சூழலில், אָשָׁם என்பது குற்றத்தால் ஏற்பட்ட பொறுப்பை நிவர்த்திசெய்யும் குறிப்பிட்ட பலியைக் குறிக்கிறது. ‘குற்றநிவாரணப் பலி’ அதன் குற்றம் மற்றும் நிவர்த்தி ஆகிய இரு கூறுகளையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הוּא
  choice: இது
  rationale: முன்னர் குறிப்பிடப்பட்ட பலியை அடையாளப்படுத்தும் பயனிலைச் சுட்டுப்பெயராக உள்ளது; தமிழில் ‘இது’ இயல்பாக அமைகிறது.
- source_word: אָשֹׁם אָשַׁם
  choice: உண்மையிலேயே குற்றவாளியாகியிருக்கிறான்
  rationale: ஒரே வேரின் வினையெச்ச வடிவமும் முற்றுவினையும் இணைந்து வினையின் உறுதியை வலியுறுத்துகின்றன. ‘உண்மையிலேயே’ அந்த அழுத்தத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: לַיהוָה
  choice: யெகோவாவுக்கு எதிராக
  rationale: אָשַׁם என்பதுடன் வரும் לְ இங்கு யெகோவாவுடனான உறவில் ஏற்பட்ட குற்றப்பொறுப்பைக் குறிக்கிறது. ‘எதிராக’ என்பது அந்தக் குற்றத்தின் திசையைத் தெளிவாக்குகிறது; இருப்பினும் ‘யெகோவாவுக்கு முன்பாக’ என்பதும் சாத்தியம்.
- source_word: יהוה
  choice: யெகோவா
  rationale: எபிரெயத் தனிப்பெயரை பொதுப்பட்டமான ‘கர்த்தர்’ என்பதற்குப் பதிலாக, தமிழில் பரவலாக அறியப்பட்ட ‘யெகோவா’ என்று வழங்குவது மூலத்தில் உள்ள இறைபெயரின் தனித்தன்மையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: אָשָׁם என்ற சொல்லின் பெயர்ச்சொல் மற்றும் வினைச்சொல் தொடர்பு
  choice: முதலில் பலியின் வகையையும், பின்னர் அந்த நபரின் உண்மையான குற்றநிலையையும் கூறுதல்
  alternative: இரு இடங்களிலும் பொதுவாக ‘குற்றம்’ என்றே கூறுதல்
  rationale: ஒரே எபிரெய வேரின் மீளுருவாக்கம் பலிக்கும் குற்றநிலைக்கும் இடையிலான தொடர்பை உருவாக்குகிறது. தமிழில் முழுமையான சொல்விளையாட்டைப் பாதுகாக்க இயலாவிட்டாலும், ‘குற்றநிவாரணப் பலி’ மற்றும் ‘குற்றவாளி’ என்பவை அந்தத் தொடர்பைத் தக்கவைக்கின்றன.
- issue: לַיהוָה என்பதன் பொருள்
  choice: அவன் யெகோவாவுக்கு எதிராகக் குற்றவாளியாகியிருக்கிறான்
  alternative: அவன் யெகோவாவுக்கு முன்பாகக் குற்றவாளியாகியிருக்கிறான்; அல்லது இது யெகோவாவுக்கான குற்றநிவாரணப் பலி
  rationale: சொற்றொடரின் இயல்பான இலக்கண இணைப்பு இறுதி வினைச்சொல்லுடனே உள்ளது; ஆகவே அது யெகோவாவைச் சார்ந்த குற்றப்பொறுப்பைக் கூறுகிறது. ‘எதிராக’ என்பதை முதன்மை உரையில் வைத்தாலும், ‘முன்பாக’ என்ற நீதிமன்ற/பொறுப்புணர்வு நிழற்பொருளை அடிக்குறிப்பு பாதுகாக்கிறது.
