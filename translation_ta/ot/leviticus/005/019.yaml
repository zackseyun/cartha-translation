  register: நவீனத் தரத் தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் வகையில் சுருக்கமாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. சட்ட-பலியியல் தன்மையைத் தக்கவைக்க ‘குற்றநிவாரணப் பலி’ பயன்படுத்தப்பட்டது; எபிரெய வலியுறுத்தல் ‘உண்மையிலேயே’ மூலம் வெளிப்படுத்தப்பட்டது.
