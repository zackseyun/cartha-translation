source:
  edition: WLC
  text: וְ/אִ֗ישׁ כִּֽי יַקְרִ֤יב זֶֽבַח שְׁלָמִים֙ לַ/יהוָ֔ה לְ/פַלֵּא נֶ֨דֶר֙ א֣וֹ לִ/נְדָבָ֔ה בַּ/בָּקָ֖ר א֣וֹ בַ/צֹּ֑אן תָּמִ֤ים יִֽהְיֶה֙ לְ/רָצ֔וֹן כָּל מ֖וּם לֹ֥א יִהְיֶה בּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/021.yaml
  text: And if a man presents a sacrifice of peace offerings to Yahweh[a], to fulfill a vow or as a freewill offering, from the herd or from the flock, it shall be without blemish to be accepted[b]; there shall be no defect in it.
translation:
  language: ta
  text: ஒருவன் யாக்வேக்குச் சமாதானப் பலியை, நேர்த்திக்கடனை நிறைவேற்றுவதற்காகவோ தன்னார்வக் காணிக்கையாகவோ, மாடுகளிலிருந்தோ ஆடுகளிலிருந்தோ செலுத்தினால், அது ஏற்றுக்கொள்ளப்படுவதற்காக[a] குறையற்றதாக இருக்க வேண்டும்; அதில் எந்தக் குறையும் இருக்கக் கூடாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஏற்கத்தக்கதாக.”
    reason: לְרָצוֹן என்பது ஏற்றுக்கொள்ளப்படுதல் என்ற நோக்கத்தையும் ஏற்கத்தக்க நிலை என்ற பொருளையும் குறிக்கலாம்.
lexical_decisions:
- source_word: וְאִישׁ כִּי יַקְרִיב
  choice: ஒருவன் ... செலுத்தும்போது
  rationale: சட்டவிதிக்குரிய பொதுவான நிகழ்வை இயல்பான தமிழில் கூறுகிறது; אִישׁ என்பதின் ஆண்பால் ஒருமையையும் காக்கிறது.
- source_word: זֶבַח שְׁלָמִים
  choice: சமாதானப் பலி
  rationale: பலிவகையின் மரபான பெயரைச் சுருக்கமாகக் கூறி, שׁלם என்பதுடனான சமாதானம்/முழுமை சார்ந்த சொற்பிணைப்பை ஓரளவு காக்கிறது.
- source_word: לַיהוָה
  choice: யெகோவாவுக்கு
  rationale: திருநாமமான יהוה என்பதை பொதுப்பட்டமாக மாற்றாமல் பெயராக ஒலிபெயர்க்கிறது.
- source_word: לְפַלֵּא נֶדֶר
  choice: ஒரு நேர்த்திக்கடனை நிறைவேற்றுவதற்காக
  rationale: இங்கு פלא என்பது செய்த நேர்த்திக்கடனை நடைமுறைப்படுத்தி நிறைவேற்றுவதைக் குறிக்கிறது.
- source_word: אוֹ לִנְדָבָה
  choice: தன்னார்வக் காணிக்கையாக
  rationale: கட்டாயமின்றி மனமுவந்து செலுத்தும் பலிவகையைத் தெளிவாக வேறுபடுத்துகிறது.
- source_word: בַּבָּקָר אוֹ בַצֹּאן
  choice: மாட்டு மந்தையிலிருந்தோ ஆட்டு மந்தையிலிருந்தோ
  rationale: בקר மற்றும் צאן குறிக்கும் இரு பரந்த கால்நடை வகுப்புகளையும் இயல்பான தமிழில் வழங்குகிறது; ஆட்டு மந்தை என்பது செம்மறியாடுகளையும் வெள்ளாடுகளையும் உள்ளடக்கலாம்.
- source_word: תָּמִים
  choice: குறையற்றதாக
  rationale: பலிக்குரிய விலங்கு உடற்குறை இல்லாததாக இருக்க வேண்டும் என்ற சடங்குச் சட்டப் பொருளைத் தருகிறது.
- source_word: לְרָצוֹן
  choice: ஏற்றுக்கொள்ளப்படுவதற்காக
  rationale: பலியானது இறைவனால் ஏற்கத்தக்கதாக இருப்பதைக் குறிக்கும் நோக்கம்/விளைவு சார்ந்த பொருளை வெளிப்படுத்துகிறது.
- source_word: כָּל מוּם לֹא יִהְיֶה בּוֹ
  choice: அதில் எந்தக் குறையும் இருக்கக் கூடாது
  rationale: מוּם என்பதின் உடற்குறை அல்லது தகுதிநீக்கும் பழுது என்ற சட்டப் பொருளை நேரடியாகக் கூறுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைநாமத்தின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாக்வே
  rationale: எபிரெய மூலத்தில் பொதுப்பட்டம் அல்ல, நான்கு எழுத்துத் திருநாமமே உள்ளது. தமிழில் பரவலாக அறியப்பட்ட பெயருருவமான ‘யெகோவா’ பயன்படுத்தப்பட்டது; ‘யாக்வே’ என்பது மூல உச்சரிப்பை மீட்டுருவாக்கும் மாற்று.
- issue: אִישׁ என்ற சட்டவிதிப் பொருளின் பாலினம்
  choice: ஒருவன்
  alternative: ஒருவர்
  rationale: மூலத்தின் ஆண்பால் ஒருமையைப் பாதுகாக்கிறது; இதை பாலினச்சார்பற்ற வடிவமாக அமைதியாக மாற்றவில்லை.
- issue: לְרָצוֹן என்பதின் திசை
  choice: ஏற்றுக்கொள்ளப்படுவதற்காக
  alternative: ஏற்கத்தக்கதாக
  rationale: இறைவனிடத்தில் பலி ஏற்றுக்கொள்ளப்பட வேண்டும் என்ற சடங்கு நோக்கத்தைப் பாதுகாக்கிறது; ஏற்றுக்கொள்ளப்படும் என்பதைக் கட்டாய விளைவாகக் கூறவில்லை.
translation_notes:
  register: நவீன செந்தமிழ் நடை; சாதாரண வாசகருக்கு விளங்கும் சொற்களுடன் சடங்குச் சட்டத்தின் கண்ணியமான, துல்லியமான தொனி காக்கப்பட்டுள்ளது. வாக்கியத்தின் நீளத்தை கட்டுப்படுத்த இடைக்கோடுகள் பயன்படுத்தப்பட்டுள்ளன.
