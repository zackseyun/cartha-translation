- from: ஒருவன் யெகோவாவுக்குச் சமாதானப் பலியைச் செலுத்தும்போது—அது ஒரு நேர்த்திக்கடனை நிறைவேற்றுவதற்காகவோ, தன்னார்வக் காணிக்கையாகவோ, மாட்டு மந்தையிலிருந்தோ ஆட்டு மந்தையிலிருந்தோ செலுத்தப்பட்டால்—அது ஏற்றுக்கொள்ளப்படுவதற்காக[a] குறையற்றதாக இருக்க வேண்டும்; அதில் எந்தக் குறையும் இருக்கக் கூடாது.
