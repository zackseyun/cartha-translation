revisions:
- from: அல்லது, தீட்டுப்படுத்தும் ஊர்ந்து செல்லும் சிறு உயிரினங்களில் எதையாவது தொடுகிற ஒரு மனிதன்[a], அல்லது எந்த வகையான தீட்டாக இருந்தாலும் அதனால் தீட்டுப்பட்டிருக்கும் ஒருவரைத் தொடுகிற ஒரு மனிதன்.
  to: அல்லது, தன்னைத் தீட்டுப்படுத்துகிற எந்த ஊர்ந்து செல்லும் சிறு உயிரினத்தையாவது தொடுகிற ஒரு மனிதன்[a]; அல்லது, தன்னைத் தீட்டுப்படுத்துகிற ஒருவரை—அவருடைய தீட்டு எதுவாயிருந்தாலும்—தொடுகிற ஒரு மனிதன்.
  rationale: 'The revision preserves the Hebrew legal syntax more closely: in each alternative, a man touches a source that makes him ritually unclean. The final phrase is rendered as a brief parenthetical qualification of the contacted person''s uncleanness, avoiding both ambiguity and unnecessary interpretation.'
