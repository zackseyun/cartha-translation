  text: אוֹ אִישׁ֙ אֲשֶׁ֣ר יִגַּ֔ע בְּ/כָל שֶׁ֖רֶץ אֲשֶׁ֣ר יִטְמָא ל֑/וֹ א֤וֹ בְ/אָדָם֙ אֲשֶׁ֣ר יִטְמָא ל֔/וֹ לְ/כֹ֖ל טֻמְאָתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/005.yaml
  text: or a man who touches any swarming thing by which he becomes unclean[a], or a person by whom he becomes unclean[b], whatever his uncleanness.
translation:
  language: ta
  text: அல்லது, தன்னைத் தீட்டுப்படுத்துகிற எந்த ஊர்ந்து செல்லும் சிறு உயிரினத்தையாவது தொடுகிற ஒரு மனிதன்[a]; அல்லது, தன்னைத் தீட்டுப்படுத்துகிற ஒருவரை—அவருடைய தீட்டு எதுவாயிருந்தாலும்—தொடுகிற ஒரு மனிதன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கூட்டமாக இயங்கும் சிறு உயிரினங்களில் எதையாவது’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் கூட்டமாக இயங்குகிற அல்லது நிலத்துக்கு அருகில் நகர்கிற சிறு உயிரினங்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹ
  choice: அல்லது
  rationale: முந்தைய வசனத்தில் தொடங்கிய பட்டியலைத் தொடரும் எளிய மாற்று இணைப்புச்சொல்.
- source_word: אִישׁ
  choice: ஒரு மனிதன்
  rationale: எபிரெய ஆண்பால் ஒருமையைப் பிரதிபலிக்கிறது; இச்சட்டச் சூழலில் இது பொதுப்பொருளில் பயன்படுத்தப்படுகிறது.
- source_word: יִגַּע
  choice: தொடுகிற
  rationale: தூய்மைச் சட்டங்களில் נגע என்பதன் இயல்பான, நேரடியான பொருள் ‘தொடுதல்’.
- source_word: בְּכָל שֶׁרֶץ
  choice: ஊர்ந்து செல்லும் சிறு உயிரினங்களில் எதையாவது
  rationale: שֶׁרֶץ என்பது கூட்டமாக இயங்கும் அல்லது நிலத்துக்கு அருகில் நகரும் சிறு உயிரினங்களைக் குறிக்கும் விரிவான வகைப்பாடு; தமிழில் இயல்பாகப் புரிய இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: אֲשֶׁר יִטְמָא לוֹ
  choice: தீட்டுப்படுத்தும்
  rationale: அந்த உயிரினத்தைத் தொடுவதால் மனிதன் சடங்குசார் தீட்டுக்கு உள்ளாவதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: בְאָדָם
  choice: ஒருவரை
  rationale: אָדָם இங்கு தீட்டைப் பரப்பக்கூடிய மனித நபரைப் பொதுப்பொருளில் குறிக்கிறது.
- source_word: אֲשֶׁר יִטְמָא לוֹ לְכֹל טֻמְאָתוֹ
  choice: எந்த வகையான தீட்டாக இருந்தாலும் அதனால் தீட்டுப்பட்டிருக்கும் ஒருவரைத் தொடுகிற
  rationale: எபிரெயச் சொற்றொடரின் சுருக்கத்தையும் சிறு தெளிவின்மையையும் கருத்தில் கொண்டு, அந்த நபருடைய எந்தவகைத் தீட்டும் தொடுபவரைத் தீட்டுப்படுத்தும் என்ற பொருளை மிகைப்படுத்தாமல் இயல்பான தமிழில் தருகிறது.
- source_word: טֻמְאָה
  choice: தீட்டு
  rationale: ஆசாரச் சட்டச் சூழலில் இது ஒழுக்கக் குற்றத்தைக் காட்டிலும் சடங்குசார் அசுத்த நிலையைக் குறிக்கிறது; ‘தீட்டு’ அந்த வேறுபாட்டைத் தமிழில் தெளிவாகக் காக்கிறது.
theological_decisions:
- issue: லேவியராகமத் தூய்மைச் சட்டங்களில் טמא / טֻמְאָה என்பவற்றின் தன்மை
  choice: ‘தீட்டுப்படுதல் / தீட்டு’ என்று சடங்குசார் நிலையைக் குறிக்கும் வகையில் மொழிபெயர்த்தல்
  alternative: ‘அசுத்தமாதல் / அசுத்தம்’
  rationale: இச்சூழல் கட்டாயமாக ஒழுக்கக் குற்றத்தையோ பாவத்தையோ குறிக்காமல், ஆசார ரீதியான தூய்மை நிலையைப் பற்றியது. ‘தீட்டு’ அதை ஒழுக்கரீதியாக மாற்றாமல் காக்கிறது.
- issue: לְכֹל טֻמְאָתוֹ என்பதில் உள்ள உடைமைச் சுட்டின் தொடர்பு
  choice: தொடப்படும் நபருக்கு உள்ள எந்தவகைத் தீட்டாக இருந்தாலும் என்று வெளிப்படுத்தல்
  alternative: ‘அவனுடைய தீட்டு எதுவாயிருந்தாலும்’ என்று மூலத்தின் சுருக்கமான அமைப்பை அப்படியே வைத்தல்
  rationale: எபிரெயம் சுருக்கமாக இருந்தாலும், சூழலில் மனித நபரின் தீட்டு தொடுதலால் கடத்தப்படுவது நோக்கமாகத் தெரிகிறது. தமிழ் வாசிப்பில் சுட்டுப்பெயர் குழப்பத்தைத் தவிர்த்து, வேறு கோட்பாட்டு விளக்கத்தைச் சேர்க்காமல் பொருள் தெரிவிக்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான சட்டநடை பயன்படுத்தப்பட்டது. ‘தீட்டு’ என்ற சொல் சடங்குசார் தூய்மை நிலையைச் சுட்டுகிறது; ஒழுக்கக் குற்றமாகப் பொருள்மாற்றம் செய்யப்படவில்லை. மூலத்தில் வசனம் முந்தைய பட்டியலின் தொடர்ச்சியாக இருப்பதால் ‘அல்லது’ தொடக்கத்தில் வைக்கப்பட்டது.
