source:
  edition: WLC
  text: נֶ֚פֶשׁ אֲשֶׁ֣ר תִּגַּע בּ֔/וֹ וְ/טָמְאָ֖ה עַד הָ/עָ֑רֶב וְ/לֹ֤א יֹאכַל֙ מִן הַ/קֳּדָשִׁ֔ים כִּ֛י אִם רָחַ֥ץ בְּשָׂר֖/וֹ בַּ/מָּֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/006.yaml
  text: The person who touches it shall be unclean until the evening[b][a], and shall not eat any of the holy things unless he has washed his body with water.
translation:
  language: ta
  text: அதைத் தொடுகிறவர் மாலைவரை தீட்டடைந்திருப்பார்; அவர் தம் உடலைத் தண்ணீரில் கழுவும் வரை, பரிசுத்தமானவற்றில் எதையும் உண்ணக் கூடாது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பரிசுத்தமானவை” என்பதை “புனிதப் படையல்கள்” அல்லது “அர்ப்பணிக்கப்பட்டவை” என்றும் மொழிபெயர்க்கலாம். “உடல்” என்பதற்கான எபிரெயச் சொல் நேரடியாக “சதை” என்று பொருள்படும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: தொடுகிறவர்
  rationale: சட்டப்பகுதியில் נֶפֶשׁ என்பது தனிநபரைக் குறிக்கிறது. தமிழில் தொடர்பு வாக்கியத்துடன் ‘அதைத் தொடுகிறவர்’ என இயல்பாகக் கூறுவது ஒருமை சட்டப் பொருளைத் தக்கவைக்கிறது.
- source_word: אֲשֶׁר תִּגַּע בּוֹ
  choice: அதைத் தொடுகிறவர்
  rationale: பெண்பால் வினைச்சொல் இலக்கணப் பெண்பாலான נֶפֶשׁ உடன் இயைகிறது; அது உயிரியல் பாலைக் குறிக்கவில்லை. பின்னணியில் உள்ள தீட்டின் மூலத்தைச் சுட்டுவதால் பாலினம் காட்டாத ‘அதை’ பொருத்தமானது.
- source_word: וְטָמְאָה עַד הָעָרֶב
  choice: மாலைவரை தீட்டுள்ளவராக இருப்பார்
  rationale: இது தொடுதலால் ஏற்படும் சடங்குசார் அசுத்த நிலையையும் அதன் காலவரம்பையும் குறிக்கிறது. ‘தீட்டு’ லேவியராகமச் சூழலில் இயல்பான தமிழ்ச் சொல்லாகும்.
- source_word: וְלֹא יֹאכַל
  choice: உண்ணக் கூடாது
  rationale: சட்டச் சூழலிலுள்ள தடைநிலையை நவீனத் தமிழில் தெளிவாகவும் கண்ணியமாகவும் வெளிப்படுத்துகிறது.
- source_word: מִן הַקֳּדָשִׁים
  choice: பரிசுத்தமானவற்றில் எதையும்
  rationale: பன்மையான הַקֳּדָשִׁים அர்ப்பணிக்கப்பட்ட பரிசுத்த உணவுகள் அல்லது பொருட்களைக் குறிக்கலாம். ‘எதையும்’ என்பது מִן என்பதன் பகுதி சார்ந்த வலிமையை வெளிப்படுத்துகிறது; பொதுவான சொற்றொடர் மூலத்தின் பரப்பை முன்கூட்டியே குறுக்கவில்லை.
- source_word: כִּי אִם
  choice: கழுவாதவரை
  rationale: உண்ணுவதற்கு முன் நிறைவேற்ற வேண்டிய நிபந்தனையைத் தமிழில் இயல்பான எதிர்மறை நிபந்தனை அமைப்பால் தெரிவிக்கிறது.
- source_word: רָחַץ בְּשָׂרוֹ בַּמָּיִם
  choice: தம் உடலைத் தண்ணீரால் கழுவி
  rationale: בָּשָׂר என்பதன் நேரடிப் பொருள் ‘சதை’ என்றாலும் இங்கு முழு உடலைக் குறிக்கும் வழக்குச் சொல். ‘உடலைத் தண்ணீரால் கழுவுதல்’ உடல்சார் செயலைத் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: தீட்டு மொழியின் தன்மை
  choice: சடங்குசார் தீட்டு
  alternative: ஒழுக்க அசுத்தம்
  rationale: தொடுதலால் ஏற்பட்ட நிலை, பரிசுத்தமானவற்றை உண்ணும் தகுதி, தண்ணீரால் கழுவுதல் ஆகியவையே சூழல். வசனம் கூறாத ஒழுக்கக் குற்றத்தை மொழிபெயர்ப்பு சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், லேவியராகமச் சட்டநடைக்கு ஏற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. பாலினம் தேவையின்றி சுமத்தப்படாமல் ‘அவர்/தம்’ அமைப்பு பயன்படுத்தப்பட்டுள்ளது; ‘தீட்டு’ சடங்குசார் நிலையைக் குறிக்கிறது. ஒரே அடிக்குறிப்பில் இரு தொடர்புடைய சொற்பொருள் மாற்றுகள் சுருக்கமாக வழங்கப்பட்டுள்ளன.
