  text: וְ/שָׁמְר֣וּ אֶת מִשְׁמַרְתִּ֗/י וְ/לֹֽא יִשְׂא֤וּ עָלָי/ו֙ חֵ֔טְא וּ/מֵ֥תוּ ב֖/וֹ כִּ֣י יְחַלְּלֻ֑/הוּ אֲנִ֥י יְהוָ֖ה מְקַדְּשָֽׁ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/009.yaml
  text: They shall keep my charge[a], so that they do not bear sin because of it and die by it when they profane it[d][c][b]. I am Yahweh who sanctifies them.
translation:
  language: ta
  text: அவர்கள் என் பொறுப்பாக ஒப்படைக்கப்பட்ட கடமையைக் கைக்கொள்ள வேண்டும்; அதைத் தீட்டுப்படுத்தும்போது அதன் காரணமாகப் பாவத்தை ஏற்றுக்கொண்டு, அதனால் இறந்துபோகாதபடிக்கு.[a][b][c] அவர்களைப் புனிதப்படுத்துகிற யாவே நானே.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதைப் பரிசுத்தமற்றதாக நடத்தும்போது” அல்லது “அதைச் சாதாரணமானதாகக் கருதும்போது.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அதன் காரணமாகக் குற்றப்பொறுப்புக்கு உள்ளாகி.” “பாவத்தை ஏற்றுக்கொள்வது” என்ற எபிரெய மரபுத்தொடர் குற்றப்பொறுப்புக்கு உள்ளாவதைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “அதன் காரணமாக இறந்துபோகாதபடிக்கு.”
    reason: lexical_alternative
  - marker: d
    text: அல்லது, “அவர்களைப் புனிதமாக்குகிற.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְרוּ
  choice: கடைப்பிடிக்க வேண்டும்
  rationale: சட்ட மற்றும் வழிபாட்டுச் சூழலில் שׁמר என்பது காத்தல், கடைப்பிடித்தல், அனுசரித்தல் ஆகிய பொருள்களைத் தருகிறது; நவீன தமிழில் கடமை உணர்வை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מִשְׁמַרְתִּי
  choice: என் பொறுப்புக் கட்டளை
  rationale: ஆசாரியர்களிடம் ஒப்படைக்கப்பட்ட காவல் அல்லது கடமையையும், தெய்வீகக் கட்டளையையும் ஒருங்கே உணர்த்துகிறது.
- source_word: יִשְׂאוּ עָלָיו חֵטְא
  choice: அதன் காரணமாகப் பாவத்தைச் சுமந்து
  rationale: ‘பாவத்தைச் சுமத்தல்’ என்ற எபிரெய மரபுத்தொடரின் உருவகத்தைப் பேணுகிறது; குற்றப்பொறுப்புக்கு உள்ளாதல் என்ற மாற்றுப் பொருளும் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וּמֵתוּ בוֹ
  choice: அதனால் சாகாதபடி
  rationale: בּוֹ காட்டும் காரண அல்லது தொடர்புப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יְחַלְּלֻהוּ
  choice: அதைத் தீட்டுப்படுத்துவதால்
  rationale: חלל என்பதன் பரிசுத்தமானதைப் பரிசுத்தமற்றதாக்குதல் அல்லது சாதாரணமாக நடத்துதல் என்ற வழிபாட்டுச் சார்ந்த எதிர்மறைப் பொருளைத் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கு எழுத்துப் பெயரைப் பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: מְקַדְּשָׁם
  choice: அவர்களைப் புனிதப்படுத்துகிற
  rationale: அவர்களைப் புனிதமாகப் பிரித்துவைப்பவர் யாவே என்ற தொடர்ச்சியான செயற்பாட்டுப் பொருளைப் பேணுகிறது.
theological_decisions:
- issue: ‘அதை / அதன் / அதனால்’ என்ற ஒருமைப் பிரதிப்பெயர்களின் குறிப்பு
  choice: குறிப்பிட்ட பெயர்ச்சொல்லைச் சேர்க்காமல் பிரதிப்பெயர்களாகவே வைக்கப்பட்டது.
  alternative: அவை பரிசுத்த உணவையோ, யாவேயின் பொறுப்புக் கட்டளையையோ குறிப்பதாகத் தெளிவுபடுத்துதல்.
  rationale: எபிரெய உரை ஒருமைப் பிரதிப்பெயர்களைப் பயன்படுத்தினாலும் அவற்றின் குறிப்பை மீண்டும் வெளிப்படையாகச் சொல்லவில்லை. உடனடிச் சூழல் பரிசுத்தப் பொருட்களைப் பற்றியது; வசனம் ‘என் பொறுப்புக் கட்டளை’ என்றும் கூறுகிறது. எனவே உண்மையான தெளிவின்மை தீர்க்கப்படாமல் பாதுகாக்கப்படுகிறது.
- issue: מְקַדְּשָׁם என்பதன் பொருள்
  choice: புனிதப்படுத்துகிற
  alternative: புனிதமாக்குகிற / புனிதமாகப் பிரித்துவைக்கிற
  rationale: யாவே அவர்களைப் புனிதத்திற்காகப் பிரித்துவைப்பவர் என்ற கருத்தைச் சுருக்கமாகவும் இறையியல் அழுத்தத்தை மாற்றாமலும் தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டுச் சட்டத்தின் கண்ணியமான தொனியைப் பேணும் வகையில் மொழிபெயர்க்கப்பட்டது. ‘பொறுப்புக் கட்டளை’ என்பது ஒப்படைக்கப்பட்ட ஆசாரியக் கடமையை உணர்த்துகிறது; பிரதிப்பெயர்களின் மூலமொழித் தெளிவின்மை திட்டமிட்டு பாதுகாக்கப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
