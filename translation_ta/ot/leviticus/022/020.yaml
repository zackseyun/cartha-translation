  text: You shall not present anything that has a blemish[b][a], for it will not be accepted for you.
translation:
  language: ta
  text: குறைபாடுள்ள[a] எதையும் நீங்கள் பலியாகச் செலுத்தக்கூடாது; ஏனெனில் அது உங்கள் சார்பாக ஏற்றுக்கொள்ளப்படாது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘குறை உள்ள.’ எபிரெயச் சொல் பலியிடத் தகுதியிழக்கச் செய்யும் உடல்சார்ந்த குறைபாட்டைக் குறிக்கும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அது உங்கள் சார்பாக ஏற்றுக்கொள்ளத்தக்கதாக இருக்காது.’
    reason: alternative_reading
lexical_decisions:
- source_word: כֹּל אֲשֶׁר בּוֹ מוּם
  choice: குறைபாடுள்ள எதையும்
  rationale: இந்த எபிரெயச் சொற்றொடர், குறைபாடு உள்ள அனைத்தையும் உள்ளடக்கும் பொதுவான தடையைக் குறிக்கிறது. தமிழில் இயல்பாகவும் முழுமையான தடையைத் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: מוּם
  choice: குறைபாடு
  rationale: பலியிடத் தகுதியிழக்கச் செய்யும் உடல்சார்ந்த பழுது அல்லது ஊனத்தைக் குறிக்கும் ஆசாரச் சூழலிலான சொல். ‘குறைபாடு’ என்பது நவீன தமிழில் தெளிவாகவும் நடுநிலையாகவும் உள்ளது.
- source_word: לֹא תַקְרִיבוּ
  choice: பலியாகச் செலுத்தக்கூடாது
  rationale: קרב என்பதன் ஹிஃபில் வடிவம் பலியாசாரச் சூழலில் கடவுள்முன் கொண்டுவந்து படைப்பதைக் குறிக்கிறது. ‘பலியாகச் செலுத்துதல்’ சூழலைத் தெளிவாக்கி, தமிழில் இயல்பாக அமைகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: தடைக்கான காரணத்தை அறிமுகப்படுத்தும் இணைப்புச் சொல்லாக இங்கு வருகிறது.
- source_word: לֹא לְרָצוֹן יִהְיֶה לָכֶם
  choice: அது உங்கள் சார்பாக ஏற்றுக்கொள்ளப்படாது
  rationale: לְרָצוֹן என்பது பலி கடவுளால் ஏற்புடையதாகக் கருதப்பட்டு ஏற்கப்படுவதைக் குறிக்கிறது; לָכֶם என்பதன் பயனாளி அல்லது பிரதிநிதித்துவ நுணுக்கத்தை ‘உங்கள் சார்பாக’ பாதுகாக்கிறது.
theological_decisions:
- issue: பலியின் ஆசார ஏற்புடைமை
  choice: உங்கள் சார்பாக ஏற்றுக்கொள்ளப்படாது
  alternative: உங்களுக்கு ஏற்புடையதாக இருக்காது
  rationale: இது வெறும் தரநிலைக்குப் பொருந்தாமையை மட்டும் அல்லாமல், செலுத்துபவர்களின் சார்பாகப் பலி ஏற்கப்படாது என்பதையும் குறிக்கலாம். கடவுளை வெளிப்படையான செயப்பாட்டாளராகச் சேர்க்காமல், எபிரெய உரையின் மறைமுக அமைப்பையும் பிரதிநிதித்துவ நுணுக்கத்தையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான சட்டநடை பயன்படுத்தப்பட்டுள்ளது. பலியாசாரச் சூழலைத் தெளிவாக்க ‘பலியாகச் செலுத்துதல்’ என்றும், לָכֶם என்பதன் பிரதிநிதித்துவ நுணுக்கத்தைக் காக்க ‘உங்கள் சார்பாக’ என்றும் மொழிபெயர்க்கப்பட்டுள்ளது.
