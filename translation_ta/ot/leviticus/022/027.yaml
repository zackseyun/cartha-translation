  text: שׁ֣וֹר אוֹ כֶ֤שֶׂב אוֹ עֵז֙ כִּ֣י יִוָּלֵ֔ד וְ/הָיָ֛ה שִׁבְעַ֥ת יָמִ֖ים תַּ֣חַת אִמּ֑/וֹ וּ/מִ/יּ֤וֹם הַ/שְּׁמִינִי֙ וָ/הָ֔לְאָה יֵרָצֶ֕ה לְ/קָרְבַּ֥ן אִשֶּׁ֖ה לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/027.yaml
  text: When an ox or a sheep or a goat is born[a], it shall remain seven days under its mother, and from the eighth day onward it shall be accepted as a food offering to Yahweh.
translation:
  language: ta
  text: ஒரு மாடோ செம்மறியாடோ வெள்ளாடோ பிறந்தால், அது ஏழு நாட்கள் தன் தாயுடன் இருக்க வேண்டும். எட்டாம் நாள் முதற்கொண்டு, அது யாவேக்கு நெருப்புக் காணிக்கையாக[a] ஏற்றுக்கொள்ளப்படும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேக்குச் செலுத்தப்படும் உணவுக் காணிக்கையாக.” எபிரெயச் சொல் நெருப்பில் செலுத்தப்படும் காணிக்கையைக் குறிக்கிறது.
    reason: אִשֶּׁה என்பதற்கு ‘நெருப்புக் காணிக்கை’ என்றும் ‘உணவுக் காணிக்கை’ என்றும் வழங்கப்படும் சொற்பொருள் மாற்றுகளைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: שׁוֹר
  choice: மாடு
  rationale: இங்கு ஆண் விலங்கை மட்டும் குறிக்கும் ‘காளை’ என்பதற்குப் பதிலாக, பலிக்குரிய மாட்டின வகையைப் பொதுவாகக் குறிக்க ‘மாடு’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: כֶשֶׂב
  choice: செம்மறியாடு
  rationale: இச்சொல் குட்டியை மட்டும் அல்லாமல் செம்மறியாட்டு இனத்தையே குறிக்கக்கூடும்; பட்டியலில் இனவகை குறிப்பிடப்படுவதால் பொதுப்பெயர் தேர்ந்தெடுக்கப்பட்டது.
- source_word: עֵז
  choice: வெள்ளாடு
  rationale: இங்கு பாலினத்தைச் சுட்டாமல் விலங்கின வகை குறிப்பிடப்படுவதால் ‘வெள்ளாடு’ இயல்பான பொதுப்பெயராக உள்ளது.
- source_word: כִּי יִוָּלֵד
  choice: பிறந்தால்
  rationale: சட்டவிதியில் நிகழக்கூடிய சூழலை அறிமுகப்படுத்தும் כִּי மற்றும் ילד என்பதன் செயல்பாட்டு வடிவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: תַּחַת אִמּוֹ
  choice: தன் தாயுடன்
  rationale: எபிரெய மொழியில் எழுத்துப்படி ‘தன் தாயின் கீழ்’ என்றாலும், புதிதாகப் பிறந்த விலங்கு தாயுடன் தங்கியிருப்பதையே இச்சூழல் குறிக்கிறது; இயல்பான தமிழுக்காக இடியோமப் பொருள் தரப்பட்டுள்ளது.
- source_word: וּמִיּוֹם הַשְּׁמִינִי וָהָלְאָה
  choice: எட்டாம் நாள் முதற்கொண்டு
  rationale: பலிக்குத் தகுதியாகும் காலத்தின் தொடக்கத்தையும் அதன் தொடர்ச்சியையும் தெளிவாகக் காட்டுகிறது.
- source_word: יֵרָצֶה
  choice: ஏற்றுக்கொள்ளப்படும்
  rationale: பலியாகச் செலுத்தப்படுவதற்கான வழிபாட்டு ஏற்புடைமையை வினைமுறையில் வெளிப்படுத்துகிறது.
- source_word: לְקָרְבַּן אִשֶּׁה
  choice: நெருப்புக் காணிக்கையாக
  rationale: קָרְבָּן என்பதன் ‘காணிக்கை’ என்ற பொருளையும் אִשֶּׁה என்பதன் நெருப்புடன் தொடர்புடைய பலிமுறையையும் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: மூலத்தில் உள்ள உடன்படிக்கைப் பெயரான יהוה-வை பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்த்து, לְ முன்னொட்டின் திசைப்பொருளையும் காட்டுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரை இறைவனுடைய தனிப்பெயரை நேரடியாகப் பயன்படுத்துவதால், அதை ஒரு பட்டப்பெயராக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- issue: אִשֶּׁה என்பதன் பலியியல் பொருள்
  choice: நெருப்புக் காணிக்கை
  alternative: உணவுக் காணிக்கை
  rationale: சொல்லின் நெருப்புடன் தொடர்புடைய அடிப்படை பலியியல் கருத்தைப் பிரதான உரையில் வைத்தபடியே, ‘உணவுக் காணிக்கை’ என்ற சாத்தியமான புரிதலை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சட்டவிதிக்கேற்ற கண்ணியமான மற்றும் நேரடியான நடை பயன்படுத்தப்பட்டுள்ளது. ‘தன் தாயுடன்’ என்பது எழுத்துப்படியான ‘தன் தாயின் கீழ்’ என்பதன் இயல்பான தமிழாக்கம். விலங்குகளின் பாலினத்தைத் தேவையின்றி வரையறுக்காமல் இனவகைகள் பொதுப்பெயர்களால் தரப்பட்டுள்ளன.
