base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/013.yaml
  text: But if a priest’s daughter becomes a widow or divorced[a], and has no offspring, and returns to her father’s house as in her youth, she may eat from her father’s food[b]; but no outsider may eat of it.
translation:
  language: ta
  text: ஆனால் ஒரு ஆசாரியனின் மகள் விதவையாகவோ மணவிலக்கு பெற்றவளாகவோ ஆகி, அவளுக்குச் சந்ததி இல்லாமல், தன் இளமைக்காலத்தில் இருந்ததுபோல் தன் தந்தையின் வீட்டிற்குத் திரும்பிவந்தால், அவள் தன் தந்தையின் உணவிலிருந்து[a] உண்ணலாம். ஆனால் உரிமையில்லாத எவரும்[b] அதிலிருந்து உண்ணக் கூடாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் சொற்சொல்லாக, ‘தன் தந்தையின் அப்பத்திலிருந்து.’ இங்கு ‘அப்பம்’ என்பது ஆசாரியக் குடும்பத்துக்குரிய உணவை விரிவாகக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘வெளியாள் எவரும்.’ எபிரெயச் சொல் இனத்தால் அந்நியரான ஒருவரை அவசியம் குறிக்காது; அனுமதிக்கப்பட்ட ஆசாரிய வட்டத்துக்கு வெளியே உள்ளவரைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַת כֹּהֵן
  choice: ஆனால் ஒரு ஆசாரியனின் மகள்
  rationale: முந்தைய வசனத்துடனான மாறுபாட்டையும், ஆசாரியக் குடும்ப உறவையும் இயல்பான தமிழில் காட்டுகிறது.
- source_word: כִּי תִהְיֶה אַלְמָנָה וּ/גְרוּשָׁה
  choice: விதவையாகவோ மணவிலக்கு பெற்றவளாகவோ ஆகி
  rationale: எபிரெய மொழியில் இணைப்புச்சொல் இருந்தாலும், இவை சட்டம் பொருந்தும் மாற்று நிலைகள்; தமிழின் ‘-ஆகவோ ... -ஆகவோ’ அமைப்பு அதைத் தெளிவாகத் தருகிறது.
- source_word: וְ/זֶרַע אֵין לָהּ
  choice: அவளுக்குச் சந்ததி இல்லாமல்
  rationale: זֶרַע என்பதன் அடிப்படைப் பொருள் ‘விதை’; இங்கு குழந்தையை மட்டும் அல்லாமல் வழித்தோன்றலையும் குறிக்கக்கூடியதால் ‘சந்ததி’ பயன்படுத்தப்பட்டது.
- source_word: וְ/שָׁבָה אֶל בֵּית אָבִיהָ כִּ/נְעוּרֶיהָ
  choice: தன் இளமைக்காலத்தில் இருந்ததுபோல் தன் தகப்பனின் வீட்டிற்குத் திரும்பிவந்தால்
  rationale: அவள் திருமணத்திற்கு முந்தைய குடும்ப நிலைக்குத் திரும்புவதை ஒப்பீட்டுடன் பாதுகாக்கிறது.
- source_word: מִ/לֶּחֶם אָבִיהָ תֹּאכֵל
  choice: அவள் தன் தகப்பனின் உணவிலிருந்து உண்ணலாம்
  rationale: לֶחֶם என்பதற்கு சொற்பொருளாக ‘அப்பம்’ என்றாலும், இச்சட்டச் சூழலில் ஆசாரியக் குடும்பத்துக்குரிய உணவு ஏற்பாடுகளை விரிவாகக் குறிக்கிறது; வினை சட்ட அனுமதியாக மொழிபெயர்க்கப்பட்டது.
- source_word: וְ/כָל זָר לֹא יֹאכַל בּוֹ
  choice: ஆனால் உரிமையில்லாத வேறு எவரும் அதிலிருந்து உண்ணக் கூடாது
  rationale: זָר என்பது இன அடிப்படையில் அந்நியரை அவசியம் குறிக்காமல், அனுமதிக்கப்பட்ட ஆசாரிய வட்டத்துக்கு வெளியே உள்ளவரைக் குறிக்கிறது; தடை இயல்பான தமிழில் கூறப்பட்டது.
theological_decisions:
- issue: ஆசாரியச் சட்டத்தில் ‘தகப்பனின் அப்பம்’ என்பதன் குறிப்பு
  choice: ‘உணவு’ என்று மொழிபெயர்த்து, ஆசாரியக் குடும்பத்துக்கு உரிய உணவு ஏற்பாடுகளைக் குறிக்கச் செய்தல்
  alternative: ‘அப்பம்’ என்று சொற்சொல்லாக மொழிபெயர்த்தல்
  rationale: லேவியராகமம் 22-ன் சூழல் பரிசுத்தப் பொருட்களை உண்ணும் தகுதியைப் பற்றியது. ‘உணவு’ என்பது பொருளை மிகையாகக் குறுக்காமலும், குறிப்பிட்ட ஓர் உணவாக மட்டுப்படுத்தாமலும் வழங்குகிறது.
- issue: זָר என்பவரின் அடையாளம்
  choice: ‘உரிமையில்லாத வேறு எவரும்’
  alternative: ‘அந்நியன்’ அல்லது ‘வெளிநாட்டவர்’
  rationale: இங்கு தடை இனத்தையோ நாட்டினத்தையோ முதன்மையாகச் சார்ந்ததல்ல; ஆசாரிய உணவை உண்ண அனுமதி இல்லாத நிலையைச் சார்ந்தது.
translation_notes:
  register: நவீன பொதுத்தமிழில் மரியாதையும் சட்டவிதியின் துல்லியமும் காக்கப்பட்டுள்ளன. ‘ஆசாரியன்’, ‘சந்ததி’, ‘தகப்பன்’ ஆகியவை வேதாகமச் சூழலுக்கு ஏற்ற, பொதுவாகப் புரியக்கூடிய சொற்களாகத் தேர்ந்தெடுக்கப்பட்டன; தேவையற்ற பழமையான நடை தவிர்க்கப்பட்டது.
