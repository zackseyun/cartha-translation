source:
  edition: WLC
  text: וְ/כֹהֵ֗ן כִּֽי יִקְנֶ֥ה נֶ֨פֶשׁ֙ קִנְיַ֣ן כַּסְפּ֔/וֹ ה֖וּא יֹ֣אכַל בּ֑/וֹ וִ/ילִ֣יד בֵּית֔/וֹ הֵ֖ם יֹאכְל֥וּ בְ/לַחְמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/011.yaml
  text: But if a priest buys a person as his property with his money[a], he may eat of it[b], and those born in his house may eat of his food.
translation:
  language: ta
  text: ஆனால் ஓர் ஆசாரியன் ஒருவரைத் தன் பணத்தால் தனக்குச் சொத்தாக வாங்கினால்[a], அந்த நபர் அதிலிருந்து உண்ணலாம்[b]; அந்த ஆசாரியனுடைய வீட்டில் பிறந்தவர்களும் அவருடைய உணவை உண்ணலாம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேரடியாக, “ஒரு நபரை, தன் பணத்தால் பெற்ற உடைமையாக”—அதாவது, தன் பணத்தால் வாங்கப்பட்ட ஒருவரை.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “ஆசாரியனுடைய அப்பத்திலிருந்து”; இங்கு “அப்பம்” என்பது ஆசாரியனுக்குப் பங்காகக் கிடைத்த உணவை விரிவாகக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כֹהֵן כִּֽי
  choice: ஆனால் ஓர் ஆசாரியன் ... வாங்கினால்
  rationale: முந்தைய சட்ட விதியுடன் உள்ள எதிர்மறைத் தொடர்பையும், כִּי அறிமுகப்படுத்தும் நிபந்தனைச் சூழலையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: יִקְנֶה נֶפֶשׁ
  choice: ஒருவரை ... வாங்கினால்
  rationale: נֶפֶשׁ இங்கு உடலற்ற ‘ஆத்துமா’ அல்ல, ஒரு மனித நபரைக் குறிக்கிறது; קנה பணம் கொடுத்து வாங்குதலைக் குறிக்கிறது.
- source_word: קִנְיַן כַּסְפּוֹ
  choice: தன் பணத்தால் தனக்குச் சொத்தாக
  rationale: பணத்தால் பெற்ற உடைமை என்ற எபிரெயச் சொற்றொடரின் சொத்துரிமைப் பரிமாணத்தை மென்மைப்படுத்தாமல் தெளிவாகப் பாதுகாக்கிறது.
- source_word: הוּא יֹאכַל בּוֹ
  choice: அந்த நபர் அதிலிருந்து உண்ணலாம்
  rationale: הוּא வாங்கப்பட்ட நபரையே சுட்டுகிறது; ‘அந்த நபர்’ என்பது தமிழ் வாசகத்தில் குழப்பத்தைத் தவிர்க்கிறது. சட்டச் சூழலில் வினை அனுமதியைத் தெரிவிக்கிறது.
- source_word: וִילִיד בֵּיתוֹ
  choice: அவனுடைய வீட்டில் பிறந்தவர்கள்
  rationale: வீட்டில் பிறந்த சார்புநிலையினரைச் சுட்டும் கூட்டுப்பொருளை, பின்வரும் பன்மை வினைக்கு ஏற்றவாறு அளிக்கிறது; மூலத்தில் இல்லாத கூடுதல் சமூக வகைப்பாட்டைத் திணிக்கவில்லை.
- source_word: בְלַחְמוֹ
  choice: அவனுடைய உணவை
  rationale: לֶחֶם என்பதன் நேரடிப் பொருள் ‘அப்பம்’; இங்கு ஆசாரியனுக்குரிய பரிசுத்த உணவை விரிவாகக் குறிக்கக்கூடும் என்பதால் முதன்மை உரையில் ‘உணவு’ பயன்படுத்தப்படுகிறது.
theological_decisions:
- issue: அடிமைத்தனம்/சொத்துரிமை சார்ந்த சட்டச் சொல்லை மொழிபெயர்த்தல்
  choice: தன் பணத்தால் தனக்குச் சொத்தாக வாங்கினால்
  alternative: தன் பணத்தால் வாங்கினால்
  rationale: קִנְיַן כַּסְפּוֹ என்பதில் உள்ள சொத்துரிமைப் பரிமாணத்தை மறைக்காமல் மொழிபெயர்க்கிறது; இது உரையின் சட்ட மொழியைத் தெளிவாகக் காட்டுவதே அன்றி அதற்கு ஒப்புதல் அளிப்பது அல்ல.
- issue: பரிசுத்த உணவில் பங்குபெறுவதற்கான வினைநிலை
  choice: உண்ணலாம்
  alternative: உண்பார்கள்
  rationale: இந்தச் சட்டச் சூழலில் imperfect வடிவம் எதிர்கால நிகழ்வை மட்டும் அல்லாமல் அனுமதிக்கப்பட்ட பங்குபெறுதலைத் தெரிவிக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான சட்ட நடையைப் பயன்படுத்துகிறது. மனிதரைச் சொத்தாகக் குறிப்பிடும் மூலத்தின் கடினமான சமூக உண்மையை மறைக்காமல், அதே நேரத்தில் விளக்கச் சேர்க்கையால் உரையை மீறாமல் தருகிறது.
