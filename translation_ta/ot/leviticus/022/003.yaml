  to: '“அவர்களிடம் சொல்: உங்கள் தலைமுறைதோறும், உங்கள் சந்ததியாரில் எவனாவது, இஸ்ரவேல் மக்கள் யாவேக்கென்று அர்ப்பணிக்கும் பரிசுத்தப் பொருள்களை அவனுடைய தீட்டு அவன்மேல் இருக்கையில் அணுகினால், அந்த நபர் என் முன்னிலையிலிருந்து அறுக்கப்பட்டு அகற்றப்படுவான்.[a] நான் யாவே.”'
  rationale: The revision improves modern Tamil idiom without narrowing the Hebrew. It makes the ritual-impurity clause fluent, keeps the male singular legal case, and renders the disputed penalty formula in a less redundant way while preserving its metaphor and ambiguity through the footnote.
