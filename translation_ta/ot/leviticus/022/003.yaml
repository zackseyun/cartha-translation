base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/003.yaml
  text: 'Say to them[a], throughout your generations: Any man from any of your offspring who comes near the holy things that the sons of Israel consecrate to Yahweh while his uncleanness is on him—that person shall be cut off from before me[c][b]. I am Yahweh.'
translation:
  language: ta
  text: '“அவர்களிடம் சொல்: உங்கள் தலைமுறைதோறும், உங்கள் சந்ததியாரில் எவனாவது, இஸ்ரவேல் மக்கள் யாவேக்கென்று அர்ப்பணிக்கும் பரிசுத்தப் பொருள்களை அவனுடைய தீட்டு அவன்மேல் இருக்கையில் அணுகினால், அந்த நபர் என் முன்னிலையிலிருந்து அறுக்கப்பட்டு அகற்றப்படுவான்.[a] நான் யாவே.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அறுக்கப்பட்டு அகற்றப்படுவான்” என்பது உடன்படிக்கைத் தண்டனையைக் குறிக்கும் வழக்கமான எபிரேயச் சூத்திரம். இது எவ்வாறு நிறைவேற்றப்படுகிறது—மரணத்தினாலா, சமூகத்திலிருந்து விலக்கப்படுவதாலா, அல்லது வேறு விதத்திலா—என்பது விவாதத்திற்குரியது.
    reason: alternative_reading
lexical_decisions:
- source_word: אֱמֹר אֲלֵהֶם
  choice: அவர்களிடம் சொல்
  rationale: மோசேயை நோக்கிய ஒருமை கட்டளை வடிவத்தையும் நேரடியான சட்ட நடையையும் காக்கிறது.
- source_word: לְדֹרֹתֵיכֶם
  choice: உங்கள் தலைமுறைதோறும்
  rationale: அடுத்தடுத்த தலைமுறைகள் அனைத்திற்கும் தொடர்ந்து பொருந்தும் உடன்படிக்கைச் சட்டச் சூத்திரத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: כָּל אִישׁ
  choice: எந்த ஆணாவது
  rationale: சூழலில் ஆரோனின் ஆண் சந்ததியினரைக் குறிக்கும் אִישׁ என்பதன் ஆண்பால் குறிப்பைத் தக்கவைக்கிறது.
- source_word: מִכָּל זַרְעֲכֶם
  choice: உங்கள் சந்ததியரில்
  rationale: வம்சவழிச் சந்ததியைக் குறிக்கும் זֶרַע என்பதன் பொருளை இயல்பாகத் தருகிறது.
- source_word: יִקְרַב
  choice: அணுகினால்
  rationale: ஆசாரியச் சூழலில் பரிசுத்தமானவற்றின் அருகே வருதல் அல்லது அவற்றை அணுகுதல் என்ற சடங்குசார் பொருளைத் தக்கவைக்கிறது.
- source_word: הַקֳּדָשִׁים
  choice: பரிசுத்தப் பொருள்கள்
  rationale: காணிக்கைகள் மட்டும் என்று குறுக்காமல், அர்ப்பணிக்கப்பட்ட பரிசுத்தமானவற்றைக் குறிக்கும் எபிரேயப் பன்மையின் விரிவை காக்கிறது.
- source_word: יַקְדִּישׁוּ
  choice: அர்ப்பணிக்கும்
  rationale: யாவேக்கென்று பரிசுத்தமாக ஒதுக்கிவைக்கும் செயலைத் தெளிவான நவீன தமிழில் தருகிறது.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: சொல்லுக்குச் சொல் ‘இஸ்ரவேலின் மகன்கள்’ என்பதற்குப் பதிலாக, இங்கு குறிக்கப்படும் இஸ்ரவேலரை இயல்பாகவும் உள்ளடக்கமாகவும் அடையாளப்படுத்துகிறது.
- source_word: לַיהוָה / יְהוָה
  choice: யாவே / யாவேக்கென்று
  rationale: நான்கெழுத்துத் தெய்வீகப் பெயரை பொதுப்பட்டமாக மாற்றாமல் உடன்படிக்கைப் பெயராக ஒலிபெயர்க்கிறது.
- source_word: וְטֻמְאָתוֹ עָלָיו
  choice: தன் தீட்டு தன்மேல் இருக்கும்போது
  rationale: வெறுமனே ‘தீட்டுள்ளவனாய்’ என்று சமப்படுத்தாமல், தீட்டு அவன்மேல் இருக்கிறது என்ற மூலமொழியின் சடங்குநிலை உருவகத்தைப் பாதுகாக்கிறது.
- source_word: וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא
  choice: அந்த நபர் ... அறுத்து அகற்றப்படுவான்
  rationale: נֶפֶשׁ என்பதை இச்சட்டச் சூழலில் ‘நபர்’ என்று இயல்பாகத் தருவதோடு, כרת தண்டனைச் சூத்திரத்தின் அறுத்தல் உருவகத்தையும் அதன் தீர்மானிக்கப்படாத தன்மையையும் காக்கிறது.
- source_word: מִלְּפָנַי
  choice: என் முன்னிலையிலிருந்து
  rationale: ‘என் முகத்திற்கு முன்பிருந்து’ என்ற எபிரேயச் சொற்றொடரின் பொருளை இயல்பாகக் கொடுத்து, தெய்வீக முன்னிலையிலிருந்து அகற்றப்படுதலை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: וְנִכְרְתָה என்ற தண்டனைச் சூத்திரத்தின் துல்லியமான பொருள்
  choice: அறுத்து அகற்றப்படுவான்
  alternative: கொல்லப்படுவான்; சமூகத்திலிருந்து விலக்கப்படுவான்; உடன்படிக்கை உறவிலிருந்து நீக்கப்படுவான்
  rationale: இந்தச் சூத்திரம் மரணம், சமூக விலக்கம் அல்லது தெய்வீக அகற்றல் ஆகியவற்றில் எதைக் குறிப்பாகக் குறிக்கிறது என்பது விவாதத்திற்குரியது. வசனம் அதன் நடைமுறையை விளக்காததால், எந்த ஓர் விளக்கத்தையும் இறுதியாக்காமல் மூலத்தின் உருவகமும் இறையியல் அழுத்தமும் காக்கப்படுகின்றன.
- issue: יְהוָה என்ற தெய்வீகப் பெயர்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் வரும் தனிப்பட்ட உடன்படிக்கைப் பெயரை ஒரு பொதுப்பட்டமாக மாற்றாமல் நேரடியாக ஒலிபெயர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையில் கண்ணியமான சட்ட மற்றும் வழிபாட்டு நடை பயன்படுத்தப்பட்டுள்ளது. ‘பரிசுத்தப் பொருள்கள்’, ‘தீட்டு’, ‘அறுத்து அகற்றப்படுவான்’ ஆகியவை லேவியராகமத்தின் சடங்குசார் சொற்தொகுதியையும் மூலத்தின் திட்டமிட்ட பரப்பையும் காக்கின்றன.
