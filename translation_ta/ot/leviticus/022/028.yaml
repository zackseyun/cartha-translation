base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/028.yaml
  text: Whether an ox or a sheep, you shall not slaughter it and its young on one day.
translation:
  language: ta
  text: மாடோ ஆடோ[a], அதையும் அதன் குட்டியையும்[b] ஒரே நாளில் நீங்கள் அறுக்கக் கூடாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல் செம்மறியாடு அல்லது வெள்ளாடு ஆகியவற்றில் ஒன்றைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “அதையும் அதன் மகனையும்.” இங்கு விலங்கும் அதன் குட்டியும் குறிக்கப்படுகின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹר
  choice: மாடு
  rationale: இச்சொல் மாட்டினத்தைச் சேர்ந்த கால்நடையைக் குறிக்கிறது. பாலினத்தைத் தேவையின்றி வரையறுக்காமல், நவீனத் தமிழில் இயல்பாக இருப்பதால் ‘மாடு’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: שֶׂה
  choice: ஆடு
  rationale: இச்சொல் செம்மறியாடு அல்லது வெள்ளாடு ஆகிய மந்தை விலங்குகளில் ஒன்றைக் குறிக்கக்கூடும். தமிழில் சுருக்கமாகவும் இயல்பாகவும் இருக்கும் ‘ஆடு’ முதன்மை உரையில் பயன்படுத்தப்பட்டு, மூலச்சொல்லின் பரப்பளவு அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: אֹתוֹ וְאֶת־בְּנוֹ
  choice: அதையும் அதன் குட்டியையும்
  rationale: எபிரெயச் சொற்றொடர் சொல்லுக்குச் சொல் ‘அதையும் அதன் மகனையும்’ என உள்ளது. விலங்கைக் குறிக்கும் இயல்பான தமிழில் ‘குட்டி’ என்பது பாலினத்தையும் தாய் விலங்கு என்ற ஊகத்தையும் தேவையின்றி சேர்க்காமல் பொருளைத் தருகிறது.
- source_word: תִשְׁחֲטוּ
  choice: நீங்கள் அறுக்கக் கூடாது
  rationale: שׁחט என்பது உணவுக்காக அல்லது பலிக்காக விலங்கைக் குறிப்பாக அறுப்பதைக் குறிக்கிறது. இரண்டாம் நபர் பன்மைத் தடையைத் தெளிவாகக் காட்ட ‘நீங்கள் ... அறுக்கக் கூடாது’ என மொழிபெயர்க்கப்பட்டது.
- source_word: בְּיוֹם אֶחָד
  choice: ஒரே நாளில்
  rationale: சொற்றொடர் நேரடியாக ‘ஒரு நாளில்’ எனினும், இரு விலங்குகளையும் அதே நாளில் அறுப்பதைத் தடைசெய்வதே இங்கு இயல்பான சட்டவியல் பொருள். ‘ஒரே நாளில்’ என்பது தமிழில் தெளிவாகவும் சுருக்கமாகவும் உள்ளது.
- source_word: וְ ... אוֹ
  choice: மாடோ ஆடோ
  rationale: தொடக்க இணைப்பும் ‘அல்லது’ என்ற பிரிப்பிடைச் சொல்லும் சேர்ந்து இரு வகை விலங்குகளுக்கும் பொருந்தும் சட்டநிபந்தனையை அமைக்கின்றன. தமிழின் ‘-ஓ ... -ஓ’ அமைப்பு இதை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘அதன் மகன்’ என்பது தாய் விலங்கின் குட்டியையே குறிப்பதாக வரையறுக்க வேண்டுமா?
  choice: பாலினம் அல்லது தாய் உறவைச் சேர்க்காமல் ‘அதன் குட்டி’ என்று மொழிபெயர்த்தல்
  alternative: ‘தாயையும் அதன் குட்டியையும்’ என்று மொழிபெயர்த்தல்
  rationale: இந்த வசனத்தின் எபிரெய உரை விலங்கை வெளிப்படையாகத் தாய் என்று அழைக்கவில்லை. ஆகவே பொதுவான சந்ததியுறவை மட்டும் தெரிவித்து, மூலத்தின் வரையறையின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் சுருக்கமான சட்டநடை பயன்படுத்தப்பட்டுள்ளது. ‘அறுக்கக் கூடாது’ என்பது பொதுவான ‘கொல்லக் கூடாது’ என்பதைக் காட்டிலும் மூல வினையின் கால்நடை அறுப்பு சார்ந்த குறிப்பான பொருளைப் பாதுகாக்கிறது.
