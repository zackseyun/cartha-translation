revisions:
- from: அதிகாரமில்லாத எவரும் பரிசுத்தமான உணவைச் சாப்பிடக் கூடாது[a]. ஆசாரியருடன் தங்கியிருப்பவரோ கூலித் தொழிலாளியோ பரிசுத்தமான உணவைச் சாப்பிடக் கூடாது[b].
  to: அனுமதியில்லாத எவரும் பரிசுத்த உணவை[a] சாப்பிடக் கூடாது. ஆசாரியரிடம் குடியிருப்பவரும்[b] கூலித் தொழிலாளியும் பரிசுத்த உணவைச் சாப்பிடக் கூடாது.
  rationale: The revision preserves the legal force and repeated reference to sacred food, while clarifying that the first group lacks permitted access and that the second is a resident/sojourner associated with a priest, not merely a person physically staying with one. Footnotes are retained and reanchored to the precise expressions they explain.
