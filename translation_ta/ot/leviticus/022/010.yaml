  text: וְ/כָל זָ֖ר לֹא יֹ֣אכַל קֹ֑דֶשׁ תּוֹשַׁ֥ב כֹּהֵ֛ן וְ/שָׂכִ֖יר לֹא יֹ֥אכַל קֹֽדֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/010.yaml
  text: No outsider may eat the holy thing[b][a]; a sojourner of a priest or a hired worker may not eat the holy thing.
translation:
  language: ta
  text: அனுமதியில்லாத எவரும் பரிசுத்த உணவை[a] சாப்பிடக் கூடாது. ஆசாரியரிடம் குடியிருப்பவரும்[b] கூலித் தொழிலாளியும் பரிசுத்த உணவைச் சாப்பிடக் கூடாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில், “பரிசுத்தமானது.” இங்கு இது ஆசாரியர்கள் உண்பதற்காக ஒதுக்கப்பட்ட பலிகளின் உணவுப் பகுதியைக் குறிக்கிறது; “பரிசுத்தப் பொருள்” அல்லது “பரிசுத்தப் பங்கு” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “ஆசாரியரிடம் குடியிருப்பவர்” என்பது ஆசாரியரின் குடும்ப உறுப்பினராக இல்லாமல், அவரது வீட்டோடு தொடர்புடைய குடியிருப்பாளர் அல்லது தற்காலிகக் குடியிருப்பாளரைக் குறிக்கலாம்; “ஆசாரியரின் குடியிருப்பாளர்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: זָר
  choice: அதிகாரமில்லாத எவரும்
  rationale: ஆசாரியர்களுக்குரிய பரிசுத்த உணவின் சூழலில், இச்சொல் இன அடிப்படையிலான அந்நியரைக் காட்டிலும் அதை உண்ண உரிமை அல்லது அதிகாரம் இல்லாதவரைக் குறிக்கிறது.
- source_word: קֹדֶשׁ
  choice: பரிசுத்தமான உணவு
  rationale: எபிரெயச் சொல் நேரடியாக ‘பரிசுத்தமானது’ என்ற ஒருமை வடிவில் இருந்தாலும், இங்கு ஆசாரியர்கள் உண்ண ஒதுக்கப்பட்ட பலியுணவைக் குறிக்கிறது; தமிழில் பொருள் தெளிவதற்காக ‘உணவு’ சேர்க்கப்பட்டுள்ளது.
- source_word: תּוֹשַׁב כֹּהֵן
  choice: ஆசாரியருடன் தங்கியிருப்பவர்
  rationale: ஆசாரியரின் குடும்ப உறுப்பினராக அல்லாமல் அவரது வீட்டோடு இணைந்து வசிக்கும் சார்புநிலை நபரை இயல்பான தமிழில் குறிக்கிறது; அவரை அவசியம் இன அடிப்படையிலான அந்நியராக வரையறுக்கவில்லை.
- source_word: שָׂכִיר
  choice: கூலித் தொழிலாளி
  rationale: ஊதியத்திற்காக வேலை செய்யும் நபரைத் தெளிவாகவும் நவீனமாகவும் குறிக்கிறது.
- source_word: לֹא יֹאכַל
  choice: சாப்பிடக் கூடாது
  rationale: எதிர்மறை வினை வடிவத்தின் சட்டரீதியான தடையை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְכָל
  choice: எவரும்
  rationale: தொடர்ந்து வரும் தடையுடன் சேர்த்து, ‘ஒருவரும் ... கூடாது’ என்ற பொதுத் தடைப் பொருளை தமிழில் இயல்பாக வழங்குகிறது.
theological_decisions:
- issue: זָר என்பதன் வரம்பு
  choice: பரிசுத்த உணவை உண்ண அதிகாரமில்லாதவர்
  alternative: அந்நியர் / ஆசாரியரல்லாதவர்
  rationale: சூழல் இன அடையாளத்தை மட்டும் அல்லது ஆசாரியப் பதவியை மட்டும் குறிக்காமல், ஆசாரியக் குடும்பத்திற்குரிய உணவில் பங்குபெற அனுமதிக்கப்படாதவரை மையப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சட்டப்பாங்கைத் தக்கவைத்தபடி சாதாரண வாசகருக்குத் தெளிவான, கண்ணியமான நடை. மூலத்தின் இரு தடைகளும் இணையான வாக்கிய அமைப்பில் வைக்கப்பட்டுள்ளன.
