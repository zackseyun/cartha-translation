source:
  edition: WLC
  text: דַּבֵּ֨ר אֶֽל אַהֲרֹ֜ן וְ/אֶל בָּנָ֗י/ו וְ/יִנָּֽזְרוּ֙ מִ/קָּדְשֵׁ֣י בְנֵֽי יִשְׂרָאֵ֔ל וְ/לֹ֥א יְחַלְּל֖וּ אֶת שֵׁ֣ם קָדְשִׁ֑/י אֲשֶׁ֨ר הֵ֧ם מַקְדִּשִׁ֛ים לִ֖/י אֲנִ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/002.yaml
  text: Speak to Aaron and to his sons[a], that they keep themselves from the holy things of the sons of Israel, and not profane my holy name, which they sanctify for me[c][b]. I am Yahweh.
translation:
  language: ta
  text: '“ஆரோனிடமும் அவன் மகன்களிடமும் சொல்: இஸ்ரவேல் மக்கள் எனக்கென்று அர்ப்பணிக்கும் பரிசுத்தப் பொருட்களிலிருந்து அவர்கள் விலகியிருக்க வேண்டும்[a]; மேலும், என் பரிசுத்தப் பெயரைப் புனிதமற்றதாக்கக் கூடாது[b]. நான் யாவே.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தங்களைப் பிரித்துக்கொள்ள வேண்டும்” அல்லது “தவிர்த்திருக்க வேண்டும்.”
    reason: lexical_alternative
  - marker: b
    text: ‘இஸ்ரவேல் மக்கள் எனக்கென்று அர்ப்பணிக்கும்’ என்பது பரிசுத்தப் பொருட்களைக் குறிக்கிறது.
    reason: referent_clarification
lexical_decisions:
- source_word: דַּבֵּר
  choice: சொல்
  rationale: பியேல் கட்டளை வடிவத்தின் நேரடியான, இயல்பான தமிழ் மொழிபெயர்ப்பு.
- source_word: וְיִנָּזְרוּ
  choice: விலகியிருக்க வேண்டும்
  rationale: நாசர் வேரின் நிபால் வடிவம் இங்கு பரிசுத்தப் பொருட்களைத் தவிர்த்து அல்லது அவற்றிலிருந்து தம்மைப் பிரித்து வைத்துக்கொள்வதைக் குறிக்கிறது.
- source_word: מִקָּדְשֵׁי בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள் ... அர்ப்பணிக்கும் பரிசுத்தப் பொருட்களிலிருந்து
  rationale: קָדְשֵׁי என்பதன் பரந்த வழிபாட்டுச் சார்ந்த பொருளை ‘பரிசுத்தப் பொருட்கள்’ காக்கிறது; உறவுச் சொற்றொடர் எதைக் குறிக்கிறது என்பதைத் தமிழில் தெளிவாக இணைக்கிறது.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: இது தேசத்தாரைக் குறிக்கும் நிலையான எபிரெயச் சொற்றொடர்; நவீன தமிழில் ‘இஸ்ரவேல் மக்கள்’ இயல்பாகவும் உள்ளடக்கமாகவும் உள்ளது.
- source_word: יְחַלְּלוּ
  choice: அவமதிக்க
  rationale: חלל என்பதன் பியேல் வடிவம் பரிசுத்தமானதைப் பரிசுத்தமற்றதாக நடத்துவதைக் குறிக்கிறது; ‘அவமதிக்க’ சாதாரண வாசகருக்குத் தெளிவாக அந்தச் செயலின் தீவிரத்தைத் தெரிவிக்கிறது.
- source_word: שֵׁם קָדְשִׁי
  choice: என் பரிசுத்தப் பெயர்
  rationale: எபிரெயக் கட்டமைப்பின் நேரடியான, இயல்பான தமிழ் வடிவம்.
- source_word: אֲשֶׁר הֵם מַקְדִּשִׁים לִי
  choice: எனக்கென்று அர்ப்பணிக்கும்
  rationale: இந்த உறவுச் சொற்றொடர் இஸ்ரவேலர் யாவேக்குப் பரிசுத்தமாக அர்ப்பணிக்கும் பொருட்களைக் குறிக்கிறது; தமிழில் சரியான பெயர்ச்சொல்லோடு இணைத்து தெளிவுபடுத்தப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், எபிரெயத் தனிப்பெயரின் தமிழ் ஒலிபெயர்ப்பாக வழங்குகிறது.
theological_decisions:
- issue: אֲשֶׁר הֵם מַקְדִּשִׁים לִי என்ற உறவுச் சொற்றொடரின் தொடர்பு
  choice: ‘இஸ்ரவேல் மக்கள் ... அர்ப்பணிக்கும்’ என்பது ‘பரிசுத்தப் பொருட்கள்’ என்பதோடு இணைக்கப்பட்டது.
  alternative: ஓட்டத்தில் இதை ‘என் பரிசுத்தப் பெயர்’ என்பதோடு தளர்வாக இணைத்துப் புரிந்துகொள்ளலாம்.
  rationale: இலக்கணமும் சூழலும் இஸ்ரவேலர் யாவேக்கென்று அர்ப்பணிக்கும் பரிசுத்தப் பொருட்களையே சுட்டுகின்றன; அவற்றை ஆசாரியர்கள் தவறாக நடத்துவது கடவுளின் பரிசுத்தப் பெயரை அவமதிக்கும்.
- issue: וְלֹא יְחַלְּלוּ என்பதன் தொடர்பு
  choice: தமிழின் இயல்புக்காக ‘இவ்வாறு ... கூடாது’ என்று விளைவுத் தொடர்புடன் மொழிபெயர்க்கப்பட்டது.
  alternative: ‘மேலும் என் பரிசுத்தப் பெயரை அவமதிக்கக் கூடாது’ என்று எபிரெய இணைப்பை முறையாகப் பின்பற்றலாம்.
  rationale: எபிரெய வாவ் எளிய இணைப்பாக இருந்தாலும், சூழலில் விலகியிருப்பதன் நோக்கம் அல்லது விளைவு பெயர் அவமதிக்கப்படாமல் இருப்பதே; ‘இவ்வாறு’ இதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘பரிசுத்தம்’, ‘அர்ப்பணித்தல்’ ஆகிய பரவலாகப் புரிந்துகொள்ளப்படும் சொற்கள் பயன்படுத்தப்பட்டுள்ளன; ‘இஸ்ரவேலின் மகன்கள்’ என்ற சொற்சொற் வடிவத்துக்குப் பதிலாக இயல்பான தேசியக் குறியீடான ‘இஸ்ரவேல் மக்கள்’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
