source:
  edition: WLC
  text: בַּ/יּ֤וֹם הַ/הוּא֙ יֵאָכֵ֔ל לֹֽא תוֹתִ֥ירוּ מִמֶּ֖/נּוּ עַד בֹּ֑קֶר אֲנִ֖י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/030.yaml
  text: It shall be eaten on that same day[a]; you shall leave none of it until morning[b]. I am Yahweh.
translation:
  language: ta
  text: அது அன்றே[a] உண்ணப்பட வேண்டும்; அதில் எதையும் காலைவரை மீதியாக வைக்காதீர்கள். நான் யாவே.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்த நாளில்.”
    reason: lexical_alternative
  - marker: b
    text: 'எபிரெயம்: “நான் யாவே.”'
    reason: alternative_reading
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: அன்றே
  rationale: சொல்லுக்கு நேரான பொருள் ‘அந்த நாளில்’. பலி செலுத்தப்பட்ட அதே நாளுக்குள் அதை உண்ண வேண்டும் என்ற உடனடியான கால வரம்பை இயல்பான தமிழில் ‘அன்றே’ தெளிவாகத் தெரிவிக்கிறது; நேரடியான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: יֵאָכֵל
  choice: உண்ணப்பட வேண்டும்
  rationale: אכל என்பதன் நிஃபால் வடிவம் இங்கு செயல்படுபவரைக் குறிப்பிடாத விதிமுறைப் பொருளுடைய செயப்பாட்டு வினையாக உள்ளது. ‘உண்ணப்பட வேண்டும்’ என்பது அதன் செயப்பாட்டு அமைப்பையும் கட்டாயத்தையும் இயல்பான சட்டநடைத் தமிழில் காக்கிறது.
- source_word: לֹא תוֹתִירוּ מִמֶּנּוּ
  choice: அதில் எதையும் ... மீதியாக வைக்கக் கூடாது
  rationale: יתר என்பதன் ஹிஃபில் வடிவம் ‘மீதியாக விட்டுவைத்தல்’ என்று பொருள்படும். இரண்டாம் நபர் பன்மைக்குரிய தடையை நவீன தமிழில் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: עַד בֹּקֶר
  choice: மறுநாள் காலைவரை
  rationale: எபிரெயச் சொற்றொடர் நேரடியாக ‘காலைவரை’ எனப் பொருள்படும். உணவை இரவு முழுவதும் வைத்திருக்கக் கூடாது என்ற சூழ்நிலைப் பொருளைத் தமிழில் தெளிவாக்க ‘மறுநாள்’ சேர்க்கப்பட்டுள்ளது.
- source_word: אֲנִי יְהוָה
  choice: நான் யாவே
  rationale: வினைச்சொல் இல்லாத எபிரெயத் தன்னடையாளச் சூத்திரத்தைச் சுருக்கமாகக் காக்கிறது; יהוה என்ற உடன்படிக்கைப் பெயர் பொதுப்பட்டத்தால் மாற்றப்படாமல் ‘யாவே’ என ஒலிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூல உரை பொதுப்பட்டத்தை அல்ல, நான்கு எழுத்துகளாலான இறைப்பெயரையே பயன்படுத்துகிறது. ஆகவே பெயரின் தனித்தன்மையைப் பாதுகாக்க ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
- issue: אֲנִי יְהוָה என்ற இறுதி தன்னடையாளச் சூத்திரம்
  choice: தனி வாக்கியமாக ‘நான் யாவே’
  alternative: முந்தைய தடையுடன் காரணவாக்கியமாக ‘ஏனெனில் நான் யாவே’
  rationale: மூலத்தில் காரணத்தைக் குறிக்கும் இணைப்புச்சொல் இல்லை. அதன் சுருக்கமான அதிகாரமிக்க வடிவத்தையும் இறையியல் அழுத்தத்தையும் தனி வாக்கியம் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான விதிமுறை நடை பயன்படுத்தப்பட்டுள்ளது. ‘அன்றே’ என்பது சூழ்நிலையின் உடனடி கால வரம்பை இயல்பாக வெளிப்படுத்துகிறது; ‘மீதியாக வைக்கக் கூடாது’ என்பது தடையின் வலிமையைத் தக்கவைக்கிறது. ஆங்கில ஆலோசனை உரையில் [b] குறி ‘காலை’ என்பதற்குப் பின் இருந்தாலும் அதன் அடிக்குறிப்பு இறுதி எபிரெயச் சூத்திரத்தைச் சுட்டுவதால், தமிழில் பொருத்தமான இடமான ‘நான் யாவே’ என்பதற்குப் பின் வைக்கப்பட்டுள்ளது.
