review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately represents the passive prescription, the prohibition against leaving any of the offering, and the divine self-identification. However, “மறுநாள்” (next day) is an explanatory addition: the Hebrew says only “until morning.” Although the next morning is contextually expected, the translation should retain the source wording without adding the explicit calendar designation.'
  naturalness: The register is clear, modern, and suitably formal for a sacrificial regulation. Recasting the prohibition as “வைக்காதீர்கள்” directly reflects the Hebrew second-person plural prohibition while remaining natural Tamil.
  terminology: “யாவே” appropriately represents יהוה and preserves the personal divine name. “உண்ணப்பட வேண்டும்” suitably renders the prescriptive passive. “மீதியாக வைக்காதீர்கள்” clearly conveys leaving something over.
  issues:
  - severity: low
    issue: “மறுநாள்” adds an explicit temporal specification not stated in the Hebrew.
    rationale: עַד־בֹּקֶר means “until morning.” The context naturally indicates the following morning, but the translation should not make that inference part of the wording.
  - severity: low
    issue: The prohibition is rendered impersonally (“வைக்கக் கூடாது”) rather than as a direct plural prohibition.
    rationale: The existing wording is intelligible, but “வைக்காதீர்கள்” better preserves the Hebrew לֹא תוֹתִירוּ, “you (plural) shall not leave over,” without making the Tamil unnatural.
  revised_text: அது அன்றே[a] உண்ணப்பட வேண்டும்; அதில் எதையும் காலைவரை மீதியாக வைக்காதீர்கள். நான் யாவே.[b]
