  text: נְבֵלָ֧ה וּ/טְרֵפָ֛ה לֹ֥א יֹאכַ֖ל לְ/טָמְאָה בָ֑/הּ אֲנִ֖י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/008.yaml
  text: He shall not eat an animal found dead or torn by beasts[a], making himself unclean by it. I am Yahweh.
translation:
  language: ta
  text: தானாக இறந்த விலங்கையோ, விலங்குகளால் கிழிக்கப்பட்ட விலங்கையோ[a] அவன் உண்ணக்கூடாது; அதை உண்பதால் அவன் தீட்டுப்படுவான். நான் யாவே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தானாக இறந்ததையோ, விலங்குகளால் கிழிக்கப்பட்டதையோ.”
    reason: நְבֵלָה மற்றும் טְרֵפָה ஆகிய சொற்களை முறையே ‘தானாக இறந்தது’ மற்றும் ‘விலங்குகளால் கிழிக்கப்பட்டது’ எனச் சுருக்கமாக மொழிபெயர்க்கலாம்.
lexical_decisions:
- source_word: נְבֵלָה
  choice: தானாகச் செத்த விலங்கு
  rationale: இந்தச் சொல் முறையாகக் கொல்லப்படாமல் தானாக இறந்த விலங்கின் உடலைக் குறிக்கிறது. உணவுச் சட்டத்தின் சூழலில் ‘தானாகச் செத்த விலங்கு’ என்பது இயல்பான, தெளிவான தமிழாக்கம்.
- source_word: וּטְרֵפָה
  choice: வேறொரு விலங்கால் கிழிக்கப்பட்ட விலங்கு
  rationale: טְרֵפָה என்பது பொதுவாக வேட்டையாடும் மற்றொரு விலங்கால் தாக்கப்பட்டுக் கிழிக்கப்பட்ட விலங்கைக் குறிக்கிறது. எபிரெயத்தில் மறைமுகமாக உள்ள செய்பவரைத் தமிழில் வெளிப்படுத்துவது பொருளைத் தெளிவாக்குகிறது.
- source_word: לֹא יֹאכַל
  choice: அவன் உண்ணக்கூடாது
  rationale: சட்ட உரையில் எதிர்மறை imperfect ஒரு தடையை வெளிப்படுத்துகிறது. ‘உண்ணக்கூடாது’ என்பது நவீனத் தமிழில் அதன் கட்டளை வலிமையை இயல்பாகத் தருகிறது.
- source_word: לְטָמְאָה בָהּ
  choice: அதை உண்பதால் அவன் தீட்டுப்படுவான்
  rationale: לְ உடன் வரும் infinitive இங்கு நோக்கம் அல்லது விளைவைக் குறிக்கலாம். தடைசெய்யப்பட்டதை உண்பது சடங்குசார் தீட்டை விளைவிக்கும் என்ற தொடர்பை இந்தத் தமிழாக்கம் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: אֲנִי יְהוָה
  choice: நான் யாவே
  rationale: எபிரெய மூலத்தில் தேவனுடைய தனிப்பெயரான יהוה நேரடியாக உள்ளது. அதை பொதுப்பட்டமாக மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்ப்பது உடன்படிக்கைப் பெயரைப் பாதுகாக்கிறது.
theological_decisions:
- issue: தீட்டு என்பது ஒழுக்கக்கேடா அல்லது சடங்குசார் அசுத்தமா
  choice: தீட்டுப்படுவான்
  alternative: தன்னை அசுத்தப்படுத்திக்கொள்வான்
  rationale: லேவியராகமத்தின் ஆசாரிய மற்றும் உணவுச் சட்டச் சூழலில் טמא முதன்மையாக சடங்குசார் அசுத்த நிலையைக் குறிக்கிறது. ‘தீட்டுப்படுவான்’ அதைக் குற்றவுணர்வு அல்லது ஒழுக்கத் தீமை என்று மாற்றாமல் பாதுகாக்கிறது.
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலவசனம் தனிப்பெயரையே பயன்படுத்துவதால், பட்டப்பெயரால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- issue: לְטָמְאָה என்பதிலுள்ள நோக்கம்/விளைவு தெளிவின்மை
  choice: 'விளைவாக மொழிபெயர்த்தல்: ‘அதை உண்பதால் அவன் தீட்டுப்படுவான்’'
  alternative: 'நோக்கத் தோற்றத்தை நெருக்கமாகப் பின்பற்றி: ‘அதனால் தீட்டுப்படும்படி அவன் உண்ணக்கூடாது’'
  rationale: எபிரெய இலக்கணம் நோக்கம் அல்லது விளைவு இரண்டிற்கும் இடமளிக்கிறது. இச்சூழலில் உண்பதால் ஏற்படும் விளைவைச் சொல்வது இயல்பான தமிழாகவும் தடையின் காரணத்தைத் தெளிவாகவும் தருகிறது; ஒழுக்க நோக்கத்தை தேவையின்றி சுமத்துவதையும் தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட சட்டநடை பயன்படுத்தப்பட்டுள்ளது. ‘உண்ணக்கூடாது’ தடையின் வலிமையை இயல்பாகத் தருகிறது; ‘தீட்டுப்படுவான்’ லேவியராகமத்தின் சடங்குசார் தூய்மைச் சொல்லாட்சியைப் பாதுகாக்கிறது. அடிக்குறிப்பு குறியீடு முதன்மை உரையில் [a] என இடம்பெற்றுள்ளது.
