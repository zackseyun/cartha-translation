  text: וּ/שְׁמַרְתֶּם֙ מִצְוֺתַ֔/י וַ/עֲשִׂיתֶ֖ם אֹתָ֑/ם אֲנִ֖י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/031.yaml
  text: So you shall keep my commandments and do them[a]; I am Yahweh.
translation:
  language: ta
  text: ஆகவே, நீங்கள் என் கட்டளைகளைக் கடைப்பிடித்து, அவற்றைச் செய்ய வேண்டும். நான் யாவே.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில்: יהוה (YHWH); மரபாக ‘கர்த்தர்’ என்று மொழிபெயர்க்கப்படுகிறது; ‘யெகோவா’ என்றும் ஒலிபெயர்க்கப்படுகிறது.'
    reason: இறைப்பெயரின் மரபுவழி மொழிபெயர்ப்பையும் மாற்று ஒலிபெயர்ப்பையும் தெரிவிக்கிறது.
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: ஆகவே, நீங்கள் ... கடைப்பிடித்து
  rationale: שׁמר என்பது உடன்படிக்கைச் சட்டச் சூழலில் கட்டளைகளைக் காத்தல் அல்லது கடைப்பிடித்தல் என்று பொருள்படும். முந்தைய சூழலுடனான தொடர்ச்சியை וּ குறிக்கிறது; தமிழில் இயல்பாக அதனை ‘ஆகவே’ என வெளிப்படுத்தியுள்ளோம்.
- source_word: מִצְוֺתַי
  choice: என் கட்டளைகளை
  rationale: מִצְוָה என்பதன் சட்டப்பூர்வமான பொருள் ‘கட்டளை’; பன்மையையும் முதலாம் நபர் உரிமையையும் இச்சொற்றொடர் நேராகப் பாதுகாக்கிறது.
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: அவற்றின்படி செய்ய வேண்டும்
  rationale: עשה என்பதன் அடிப்படைப் பொருளான ‘செய்’ என்பதைக் காத்து, கட்டளைகளை நடைமுறைப்படுத்துவதைக் குறிக்கும் இயல்பான தமிழுக்காக ‘அவற்றின்படி’ சேர்க்கப்பட்டுள்ளது. ‘கடைப்பிடித்தல்’ மற்றும் ‘செய்தல்’ என்ற இரு கூறுகளும் தனித்தனியாகத் தக்கவைக்கப்பட்டுள்ளன.
- source_word: אֲנִי יְהוָה
  choice: நான் யெகோவா
  rationale: எபிரெயச் சொற்றொடரின் வலியுறுத்தலான தெய்வீகத் தன்னடையாளத்தை நேரடியாகப் பாதுகாக்கிறது. יהוה என்ற நான்கெழுத்துத் திருப்பெயர் தமிழில் பரவலாக அறியப்படும் ‘யெகோவா’ என ஒலிபெயர்க்கப்பட்டுள்ளது; மாற்று உச்சரிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூல உரையில் பொதுப்பட்டப் பெயர் அல்ல, தனிப்பட்ட உடன்படிக்கைப் பெயரே உள்ளது. ஆகவே அதை ‘கர்த்தர்’ என்று மாற்றாமல் ஒலிபெயர்த்துள்ளோம். அதன் பண்டைய சரியான உச்சரிப்பு உறுதியாகத் தெரியாததால், பரவலான தமிழ் வடிவம் முதன்மை உரையிலும் ‘யாவே’ என்ற மாற்று வடிவம் அடிக்குறிப்பிலும் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட சட்ட/உடன்படிக்கை நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் ‘கடைப்பிடித்தல்—செய்தல்’ இணைப்பு பாதுகாக்கப்பட்டுள்ளது; கட்டளைகளை ‘செய்தல்’ என்ற எபிரெயப் பயன்பாடு தமிழில் தெளிவாக இருக்க ‘அவற்றின்படி’ சேர்க்கப்பட்டுள்ளது.
