  text: וְ/אִ֕ישׁ כִּֽי יֹאכַ֥ל קֹ֖דֶשׁ בִּ/שְׁגָגָ֑ה וְ/יָסַ֤ף חֲמִֽשִׁית/וֹ֙ עָלָ֔י/ו וְ/נָתַ֥ן לַ/כֹּהֵ֖ן אֶת הַ/קֹּֽדֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/014.yaml
  text: And if a man eats a holy thing unintentionally[d][c][b][a], then he shall add a fifth to it and give the holy thing to the priest.
translation:
  language: ta
  text: ஒருவன்[a] பரிசுத்தப் பொருளை[b] தவறுதலாக[c] சாப்பிட்டால், அவன் அதனுடன் ஐந்தில் ஒரு பங்கைச் சேர்த்து[d], அந்தப் பரிசுத்தப் பொருளை ஆசாரியனுக்குக் கொடுக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாராவது” / “ஒருவர்.” எபிரெயத்தில் ஆண்பால் ஒருமையான “ஒருவன்” (אִישׁ); சட்ட மொழியில் இது பொதுவாக எந்த நபரையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “பரிசுத்தப் பொருள்” என்பது ஆசாரியரின் பயன்பாட்டுக்காக ஒதுக்கப்பட்ட அர்ப்பணிக்கப்பட்ட உணவு அல்லது பொருளைக் குறிக்கிறது.
    reason: cultural_note
  - marker: c
    text: அல்லது, “அறியாமல்” / “தவறாக.”
    reason: lexical_alternative
  - marker: d
    text: 'இன்னும் சொல்லுக்குச் சொல்: “அதன் ஐந்தில் ஒரு பங்கை அதனுடன் சேர்த்து.”'
    reason: literal_rendering
lexical_decisions:
- source_word: וְאִישׁ
  choice: ஒருவன்
  rationale: אִישׁ என்பது ஆண்பால் ஒருமை சட்ட வடிவம். தமிழில் இயல்பான ‘ஒருவன்’ மூலத்தின் வடிவத்தைத் தக்கவைக்கிறது; சட்டச் சூழலில் இது பொதுவாக எந்த நபரையும் குறிக்கக்கூடும் என்பதை அடிக்குறிப்பு தெரிவிக்கிறது.
- source_word: כִּי
  choice: -ஆல் (சாப்பிட்டால்)
  rationale: சம்பவத்தை நிபந்தனையாக முன்வைக்கும் சட்ட வாக்கியத்தில் כִּי என்பதைக் தமிழின் இயல்பான நிபந்தனை விகுதியால் வெளிப்படுத்துகிறது.
- source_word: יֹאכַל
  choice: சாப்பிட்டால்
  rationale: இங்கு உணவாக உட்கொள்வதைக் குறிக்கும் வினை சட்ட நிபந்தனையில் வருகிறது; ‘சாப்பிட்டால்’ தெளிவான நவீனத் தமிழ்.
- source_word: קֹדֶשׁ
  choice: பரிசுத்தப் பொருள்
  rationale: ஆசாரியருக்கென ஒதுக்கப்பட்ட அர்ப்பணிக்கப்பட்ட உணவு அல்லது பொருளை இந்தச் சொல் குறிக்கலாம். ‘பொருள்’ என்பது ‘உணவு’ என்பதைவிட அகன்ற மூலப் பொருளைத் தக்கவைக்கிறது.
- source_word: בִּשְׁגָגָה
  choice: தவறுதலாக
  rationale: வேண்டுமென்றே செய்த மீறலை அல்ல, அறியாமலோ கவனக்குறைவாலோ நிகழ்ந்த தவறைக் குறிக்கிறது.
- source_word: וְיָסַף
  choice: சேர்த்து
  rationale: இழப்பீட்டில் முதன்மை அளவோடு கூடுதல் அளவை இணைக்க வேண்டிய கட்டாயத்தை அடுத்துள்ள ‘கொடுக்க வேண்டும்’ என்பதோடு இயல்பாக வெளிப்படுத்துகிறது.
- source_word: חֲמִשִׁיתוֹ עָלָיו
  choice: அதனுடன் ஐந்தில் ஒரு பங்கை
  rationale: உட்கொள்ளப்பட்ட பரிசுத்தப் பொருளின் மதிப்புக்கு ஐந்தில் ஒரு பங்கு கூடுதலாகச் சேர்ப்பதைத் தமிழில் சுருக்கமாகவும் இயல்பாகவும் கூறுகிறது.
- source_word: וְנָתַן
  choice: கொடுக்க வேண்டும்
  rationale: נתן என்பதன் அடிப்படைப் பொருள் ‘கொடு’; சட்டத்தின் கட்டாயத் தன்மையை ‘வேண்டும்’ தெளிவாக்குகிறது.
- source_word: לַכֹּהֵן
  choice: ஆசாரியனுக்கு
  rationale: குறிப்பிட்ட அல்லது உரிய ஆசாரியப் பெறுநரை எபிரெய முன்னொட்டு சுட்டுகிறது.
- source_word: אֶת הַקֹּדֶשׁ
  choice: அந்தப் பரிசுத்தப் பொருளை
  rationale: முன்பு குறிப்பிடப்பட்ட கֹדֶשׁ என்பதையே மீண்டும் குறிக்கும் சொல் தொடர்பை ‘அந்த’ தெளிவாக்குகிறது; பொருளின் தன்மையை தேவையின்றி குறுக்கவில்லை.
theological_decisions:
- issue: சட்ட மொழியிலுள்ள பொதுப்பொருள் கொள்ளக்கூடிய ஆண்பால் ஒருமை
  choice: முதன்மை உரையில் ‘ஒருவன்’ என்று வைத்தல்
  alternative: ‘யாராவது’ அல்லது ‘ஒருவர்’
  rationale: மூலத்தில் ஆண்பால் ஒருமையான אִישׁ உள்ளது. அதன் இலக்கண வடிவத்தை முதன்மை உரை காக்கிறது; அது சட்டச் சூழலில் பொதுப்பொருளில் செயல்படக்கூடும் என்பதையும் அடிக்குறிப்பு மறைக்கவில்லை.
- issue: ஈடுசெய்யப்படும் பரிசுத்தப் பொருளின் இயல்பு
  choice: இரு இடங்களிலும் ‘பரிசுத்தப் பொருள்’
  alternative: ‘பரிசுத்த உணவு’ அல்லது ‘பரிசுத்தப் பங்கு’
  rationale: கֹדֶשׁ என்பதைக் குறிப்பிட்ட உணவாகவோ பங்காகவோ மட்டும் சுருக்காமல், அர்ப்பணிக்கப்பட்ட பொருள் என்ற மூலத்தின் அகலத்தைத் தக்கவைக்கிறது.
- issue: ஐந்தில் ஒரு பங்கின் கணக்கீடு
  choice: ‘அதனுடன் ஐந்தில் ஒரு பங்கைச் சேர்த்து’
  alternative: ‘அதன் ஐந்தில் ஒரு பங்கை அதனுடன் சேர்த்து’
  rationale: எபிரெயச் சொற்றொடர் உட்கொள்ளப்பட்ட பொருளுக்குரிய அளவு அல்லது மதிப்பின் ஐந்தில் ஒரு பங்கை மேலாகச் சேர்ப்பதைக் குறிக்கிறது. இயல்பான தமிழ் சுருக்கமாகக் கூறினாலும் மாற்று நேரடி வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டக் கட்டளைக்குரிய கண்ணியமான ஆனால் எளிதில் புரியும் நடையில் மொழிபெயர்க்கப்பட்டது. ‘பரிசுத்தப் பொருள்’ என்ற சொற்றொடர் லேவியராகமத்தின் அர்ப்பணிப்பு சார்ந்த சொல்லாட்சியைத் தக்கவைக்கிறது; ‘கொடுக்க வேண்டும்’ கட்டாயத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
