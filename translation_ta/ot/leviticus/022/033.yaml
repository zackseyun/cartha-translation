revisions:
- from: உங்களுக்குக் கடவுளாக இருப்பதற்காக உங்களை எகிப்து நாட்டிலிருந்து வெளியே கொண்டுவந்தவர் நானே. நான் யாவே.[a]
  to: உங்களுக்குக் கடவுளாக இருக்கும்படி உங்களை எகிப்து நாட்டிலிருந்து வெளியே கொண்டுவந்தவர் நான், யாவே.[a]
  rationale: The revision removes unnecessary emphatic force, uses a more idiomatic Tamil expression for the covenant-purpose clause, and joins the participial description with the divine self-identification in a form that is both natural Tamil and faithful to the Hebrew syntax. The footnote is made linguistically precise without adding interpretive content.
