source:
  edition: WLC
  text: הַ/מּוֹצִ֤יא אֶתְ/כֶם֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם לִ/הְי֥וֹת לָ/כֶ֖ם לֵ/אלֹהִ֑ים אֲנִ֖י יְהוָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/033.yaml
  text: who brought you out of the land of Egypt to be your God[a]. I am Yahweh.
translation:
  language: ta
  text: உங்களுக்குக் கடவுளாக இருக்கும்படி உங்களை எகிப்து நாட்டிலிருந்து வெளியே கொண்டுவந்தவர் நான், யாவே.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெய மொழியில்: ‘יהוה’ (YHWH); பாரம்பரியமாக ‘கர்த்தர்’ என்று வழங்கப்படுகிறது; இங்கு ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டுள்ளது.'
    reason: இறைத்தனிப்பெயரின் எபிரெய மூலவடிவம், அதன் எழுத்துப்பெயர்ப்பு, மற்றும் பாரம்பரிய மாற்றீட்டை வாசகருக்குத் தெரிவிக்கிறது.
lexical_decisions:
- source_word: הַמּוֹצִיא
  choice: வெளியே கொண்டுவந்தவர்
  rationale: יצא என்பதன் ஹிஃபில் பங்கேற்புவினை வடிவம், முந்தைய வசனத்தின் தொடர்ச்சியாக யாவேயை ‘வெளியே கொண்டுவந்தவர்’ என்று விவரிக்கிறது. தமிழில் இவ்வடிவம் இயல்பாகவும் மூலத்தின் விளக்கத் தன்மையைப் பாதுகாப்பதாகவும் உள்ளது.
- source_word: אֶתְכֶם
  choice: உங்களை
  rationale: நேரடிச் செயப்படுபொருள் குறியுடன் சேர்ந்த இரண்டாம் நபர் ஆண்பால் பன்மை பின்னொட்டைத் தமிழில் இயல்பான பன்மை வடிவமான ‘உங்களை’ என மொழிபெயர்க்கிறது.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: எகிப்து நாட்டிலிருந்து
  rationale: ‘எகிப்து நாடு’ என்ற முழுமையான வெளியேற்ற உடன்படிக்கைச் சொல்லாட்சியைத் தக்கவைக்கிறது; מִן என்பதன் பிரிவிடப் பொருளை ‘இலிருந்து’ தெரிவிக்கிறது.
- source_word: לִהְיוֹת לָכֶם לֵאלֹהִים
  choice: உங்களுக்குக் கடவுளாக இருப்பதற்காக
  rationale: இது உடன்படிக்கை உறவைக் குறிக்கும் வழக்கமான எபிரெயச் சொல்லாட்சி. ‘உங்களுக்குக் கடவுளாக’ என்பது அதன் உறவுசார் வலிமையையும் நோக்கத்தையும் இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: אֲנִי יְהוָה
  choice: நான் யாவே
  rationale: வினைச்சொல் இல்லாத எபிரெய அடையாள வாக்கியத்தை இயல்பான தமிழில் தருகிறது; יהוה என்ற தனிப்பெயர் மொழிபெயர்க்கப்படாமல் ‘யாவே’ என ஒலிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் நான்கு எழுத்துகளாலான இறைத்தனிப்பெயர் நேரடியாக உள்ளது. ‘யாவே’ என்ற ஒலிபெயர்ப்பு உடன்படிக்கைப் பெயரைத் தனிப்பெயராகப் பாதுகாக்கிறது; ‘கர்த்தர்’ என்பது பாரம்பரிய மாற்றீடு என்பதை அடிக்குறிப்பு தெரிவிக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் வேதாகமச் செறிவும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. வசனம் தனியாக வாசிக்கப்படும்போதும் பொருள் நிறைவாக இருக்க, முந்தைய வசனத்திலிருந்து தொடரும் பங்கேற்புவினை அமைப்பு ‘வெளியே கொண்டுவந்தவர் நானே’ என்று இயல்பாக்கப்பட்டுள்ளது.
