source:
  edition: WLC
  text: עַוֶּרֶת֩ א֨וֹ שָׁב֜וּר אוֹ חָר֣וּץ אֽוֹ יַבֶּ֗לֶת א֤וֹ גָרָב֙ א֣וֹ יַלֶּ֔פֶת לֹא תַקְרִ֥יבוּ אֵ֖לֶּה לַ/יהוָ֑ה וְ/אִשֶּׁ֗ה לֹא תִתְּנ֥וּ מֵ/הֶ֛ם עַל הַ/מִּזְבֵּ֖חַ לַ/יהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/022.yaml
  text: Anything blind[a], broken, mutilated, or with a wart, scab, or skin disease, these you shall not present to Yahweh; and you shall not place any of them on the altar as a food offering to Yahweh.
translation:
  language: ta
  text: குருடான, எலும்பு முறிந்த, உறுப்பு சிதைந்த, அல்லது மரு, சிரங்கு, தோல் நோய் உள்ள விலங்குகளை யாவேக்குச் செலுத்தாதீர்கள்; அவற்றில் எதையும் யாவேக்காக நெருப்புப் பலியாக[a] பலிபீடத்தின் மேல் வைக்காதீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உணவுப் படையலாக.”
    reason: אִשֶּׁה என்பதற்கு முன்வைக்கப்படும் மாற்று விளக்க மொழிபெயர்ப்பைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: עַוֶּרֶת
  choice: குருடானது
  rationale: பலிக்குத் தகுதியற்ற விலங்கின் குறைபாட்டைக் குறிக்கும் பெண்பால் ஒருமை வடிவம்; தமிழில் சூழலால் விலங்கு என்பது தெளிவாக இருப்பதால் இயல்பான பெயரடைப் பயன்பாடு தேர்ந்தெடுக்கப்பட்டது.
- source_word: שָׁבוּר
  choice: எலும்பு முறிந்தது
  rationale: உடல் உறுப்பில் ஏற்பட்ட முறிவைக் குறிக்கும் செயப்பாட்டு வடிவம். வெறும் ‘உடைந்தது’ என்பதைவிட விலங்கின் உடற்குறைபாட்டைத் தெளிவாகச் சொல்கிறது.
- source_word: חָרוּץ
  choice: உறுப்பு சிதைக்கப்பட்டது
  rationale: வெட்டப்பட்ட அல்லது கடுமையாக ஊனப்படுத்தப்பட்ட உடற்குறைபாட்டைக் குறிக்கிறது; எந்தக் குறிப்பிட்ட உறுப்பையும் ஆதாரமின்றி நிர்ணயிக்கவில்லை.
- source_word: יַבֶּלֶת
  choice: மரு
  rationale: தோலில் தோன்றும் அசாதாரண வளர்ச்சிக்கான எளிய, தற்காலத் தமிழ் சொல்.
- source_word: גָרָב
  choice: சிரங்கு
  rationale: காணக்கூடிய தோல் பாதிப்பைக் குறிக்கும் பொதுவான தமிழ் சொல்; துல்லியமான நவீன நோயறிதலை உரைக்குள் திணிக்கவில்லை.
- source_word: יַלֶּפֶת
  choice: தோல் நோய்
  rationale: குறிப்பிட்ட தோல் பாதிப்பு உறுதியாகத் தெரியாததால் தவறான மருத்துவத் துல்லியத்தைத் தவிர்க்கும் பொதுவான மொழிபெயர்ப்பு.
- source_word: תַקְרִיבוּ
  choice: செலுத்தக் கூடாது
  rationale: ஹிபில் வடிவம் பலிச் சூழலில் கடவுளிடம் கொண்டுவந்து படைப்பதைக் குறிக்கிறது; ‘செலுத்துதல்’ தமிழில் வழிபாட்டு அர்த்தத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֵלֶּה
  choice: இவற்றை
  rationale: முன்னர் பட்டியலிடப்பட்ட குறைபாடுள்ள விலங்குகளைச் சுட்டும் பன்மைச் சுட்டுப்பெயர்.
- source_word: וְאִשֶּׁה
  choice: உணவுப் படையலாக
  rationale: ஆசாரிய மரபில் பலிபீடத்தில் நெருப்பால் செலுத்தப்படும் படையலைக் குறிக்கலாம். ‘படையல்’ பலிபீடச் சூழலுக்கு இயல்பானது; முக்கியமான ‘நெருப்புப் பலி’ மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: תִתְּנוּ מֵהֶם עַל הַמִּזְבֵּחַ
  choice: இவற்றில் எதையும் பலிபீடத்தின்மேல் வைக்கக் கூடாது
  rationale: מֵהֶם என்பதன் பகிர்வுப் பொருளையும், பலிபீடத்தின்மேல் வைக்கும் குறிப்பிட்ட வழிபாட்டுச் செயலையும் தெளிவாகக் காக்கிறது.
- source_word: לַיהוָה
  choice: யாவேக்கு / யாவேக்கான
  rationale: יהוה என்ற உடன்படிக்கைப் பெயரை ‘யாவே’ என ஒலிபெயர்த்து, ל முன்னிடைச்சொல்லைத் தமிழ் தொடரமைப்புக்கு ஏற்ப ‘-க்கு’ அல்லது ‘-க்கான’ என வழங்குகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் நான்கு எழுத்து இறைப்பெயர் நேரடியாக உள்ளது. பொதுப்பட்டத்தை மாற்றாக இடாமல் அந்தத் தனிப்பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- issue: אִשֶּׁה என்ற பலிசார் சொல்லின் பொருள்
  choice: உணவுப் படையல்
  alternative: நெருப்பினால் செலுத்தப்படும் பலி; நெருப்புப் பலி
  rationale: இச்சொல் நெருப்போடு தொடர்புடைய பலிபீடப் படையலைக் குறிக்கிறது; ஆசாரியச் சூழலில் ‘உணவுப் படையல்’ என்ற வாசிப்பை முதன்மைப்படுத்தினாலும், அதன் சொல்லியல் மற்றும் வழக்கமான மாற்று வாசிப்பை அடிக்குறிப்பில் வெளிப்படையாக வைத்திருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமான ஆனால் பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயச் சொற்றொடரின் குறைபாடுப் பட்டியல் வரிசையும் இரு தடை வாக்கியங்களும் காக்கப்பட்டுள்ளன; உறுதியற்ற தோல் நோய்களுக்கு அளவுக்கு மீறிய மருத்துவத் துல்லியம் தவிர்க்கப்பட்டுள்ளது.
