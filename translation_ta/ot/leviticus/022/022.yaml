  verdict: revise
  source_fidelity: திருத்தம் தேவை. வரைவு குறைபாடுகளின் பட்டியலையும் இரு தடைச் செயல்களையும் பெரும்பாலும் காக்கிறது. ஆனால் அப்பட்டியலைத் தமிழில் பெயர்ச்சொல் இன்றித் தருவது இயல்பற்றதாக உள்ளது. மேலும் אִשֶּׁה என்பதற்கான முதன்மை மொழிபெயர்ப்பாக ‘உணவுப் படையல்’ என்பதைத் தேர்வது சொல்லின் நெருப்பு/எரிப்புப் பலி சார்ந்த அடிப்படைப் பொருளைத் தேவையின்றி குறுக்குகிறது.
  naturalness: ‘குருடானதையோ, எலும்பு முறிந்ததையோ’ போன்ற தனித்தனி நடுநிலைப் பெயராக்கங்கள் தொடராக வருவது நவீனத் தமிழில் கனமாகவும் தெளிவற்றதாகவும் உள்ளது. ‘...உள்ள விலங்குகளை’ எனத் தொடரை முடிப்பது சூழலில் மறைந்திருக்கும் பலிவிலங்குக் குறிப்பை இயல்பாக வெளிப்படுத்துகிறது.
  terminology: யாவே என்பது பொருத்தமான ஒலிபெயர்ப்பு. ‘நெருப்புப் பலி’ என்பது אִשֶּׁה-க்கு மூலத்துக்கு நெருக்கமான, நிலையான வழிபாட்டுச் சொல். ‘உணவுப் படையல்’ என்பதை மாற்று வாசிப்பாக அடிக்குறிப்பில் வைப்பது, பொருள் விவாதத்தை வெளிப்படையாகப் பாதுகாக்கிறது.
  issues:
