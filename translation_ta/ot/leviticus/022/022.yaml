revisions:
- from: குருடானதையோ, எலும்பு முறிந்ததையோ, உறுப்பு சிதைக்கப்பட்டதையோ, மரு, சிரங்கு அல்லது தோல் நோய் உள்ளதையோ—இவற்றை யாவேக்குச் செலுத்தக் கூடாது; இவற்றில் எதையும் யாவேக்கான உணவுப் படையலாக[a] பலிபீடத்தின்மேல் வைக்கக் கூடாது.
  to: குருடான, எலும்பு முறிந்த, உறுப்பு சிதைந்த, அல்லது மரு, சிரங்கு, தோல் நோய் உள்ள விலங்குகளை யாவேக்குச் செலுத்தாதீர்கள்; அவற்றில் எதையும் யாவேக்காக நெருப்புப் பலியாக[a] பலிபீடத்தின் மேல் வைக்காதீர்கள்.
  rationale: குறைபாடுகள் கொண்ட பலிவிலங்குகள் என்ற சூழலால் உட்பொருளாக இருக்கும் பெயரைத் தமிழின் தொடரமைப்புக்காக வெளிப்படுத்தினேன். חָרוּץ என்பதன் துல்லியமான உடற்குறை உறுதியற்றதால் ‘உறுப்பு சிதைந்த’ எனப் பொதுவாக வைத்தேன். אִשֶּׁה-க்கு நெருப்பு சார்ந்த முதன்மைப் பொருளை ‘நெருப்புப் பலி’ எனத் தந்து, ‘உணவுப் படையல்’ என்ற மாற்று விளக்கத்தை அடிக்குறிப்பில் வைத்தேன். இரு யாவே-குறித்த திசை/நோக்கத் தொடர்களும், ‘அவற்றில் எதையும்’ என்ற பகிர்வுப் பொருளும் காக்கப்பட்டுள்ளன.
