  text: וְ/לֹ֣א יְחַלְּל֔וּ אֶת קָדְשֵׁ֖י בְּנֵ֣י יִשְׂרָאֵ֑ל אֵ֥ת אֲשֶׁר יָרִ֖ימוּ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/015.yaml
  text: They shall not profane the holy things of the sons of Israel[b][a], which they lift up to Yahweh.
translation:
  language: ta
  text: இஸ்ரவேல் மக்கள் யாவேவுக்கு உயர்த்திப் படைக்கும்[a] புனிதப் பொருட்களை[b] அவர்கள் தீட்டுப்படுத்தக் கூடாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சமர்ப்பிக்கும்” அல்லது “காணிக்கையாகப் படைக்கும்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “புனிதப் படையல்களை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְחַלְּלוּ
  choice: புனிதத்தைக் கெடுக்க
  rationale: חלל என்பதன் பியேல் வடிவம் வழிபாட்டுச் சூழலில் புனிதமான ஒன்றின் புனித நிலையை மீறுதல் அல்லது கெடுத்தல் என்று பொருள்படும். தமிழில் இயல்பாகவும் புனிதம்–சாதாரணம் என்ற எதிர்மறைத் தொடர்பைப் பாதுகாக்கவும் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: קָדְשֵׁי
  choice: புனிதப் பொருட்கள்
  rationale: இக்கட்டமைப்பு இஸ்ரவேல் மக்கள் அர்ப்பணித்த புனிதமானவற்றைக் குறிக்கிறது. ‘படையல்கள்’ என்று மட்டும் கூறுவது பொருளைச் சுருக்கக்கூடும் என்பதால் பொதுவான ‘புனிதப் பொருட்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: எபிரெய மொழியில் சொற்பட ‘இஸ்ரவேலின் புதல்வர்கள்’ என்றாலும், இது உடன்படிக்கை மக்களைக் குறிக்கும் வழக்கமான இனப்பெயர். நவீன தமிழில் ‘இஸ்ரவேல் மக்கள்’ இயல்பாகவும் உள்ளடக்கத்தைத் துல்லியமாகவும் தெரிவிக்கிறது.
- source_word: אֲשֶׁר יָרִימוּ
  choice: உயர்த்திப் படைக்கும்
  rationale: רום என்பதன் ஹிஃபில் வடிவம் நேரடியாக ‘உயர்த்துதல்’ என்ற உருவகத்தையும், வழிபாட்டுச் சூழலில் காணிக்கையாகச் சமர்ப்பித்தல் என்ற பொருளையும் கொண்டுள்ளது. இரு நுணுக்கங்களையும் தமிழில் காக்க இத்தொடர் தேர்ந்தெடுக்கப்பட்டது.
- source_word: לַיהוָה
  choice: யாவேவுக்கு
  rationale: மூலத்தில் உள்ள יהוה என்ற உடன்படிக்கைப் பெயர் பொதுப்பட்டமாக மாற்றப்படாமல், தமிழில் அதன் வழக்கமான ஒலிபெயர்ப்பான ‘யாவே’ என்று தரப்பட்டது.
- source_word: וְלֹא
  choice: கூடாது
  rationale: சட்ட உரையில் வரும் எதிர்மறை வினை வடிவம் தடையை வெளிப்படுத்துகிறது; நவீனத் தமிழில் ‘கூடாது’ அதனை இயல்பாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூல வசனம் உடன்படிக்கைப் பெயரான יהוה என்பதையே பயன்படுத்துகிறது. அதனை ஒரு பட்டமாக மாற்றாமல் பெயராகக் காப்பதற்காக ‘யாவே’ என ஒலிபெயர்க்கப்பட்டது.
- issue: புனிதமானவற்றின் பொருள் வரம்பு
  choice: புனிதப் பொருட்கள்
  alternative: புனிதப் படையல்கள்
  rationale: சூழல் காணிக்கைகளைச் சுட்டினாலும், קָדְשֵׁי என்ற சொல் பரந்த ‘புனிதமானவை’ என்ற பொருளைக் கொண்டுள்ளது. தேவையற்ற விளக்கச் சுருக்கத்தைத் தவிர்க்க பரந்த வாசகம் முதன்மை உரையில் வைக்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சட்ட உரைக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் வெளிப்படாத எழுவாய் ‘அவர்கள்’ எனவே வைக்கப்பட்டு, ‘குருக்கள்’ போன்ற சூழலால் ஊகிக்கப்படும் பெயர்ச்சொல் முதன்மை உரையில் சேர்க்கப்படவில்லை.
