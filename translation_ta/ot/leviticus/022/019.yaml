translation:
  language: ta
  text: உங்களுக்காக அது ஏற்றுக்கொள்ளப்படுவதற்கு, மாடுகளிலிருந்தோ, செம்மறியாடுகளிலிருந்தோ, வெள்ளாடுகளிலிருந்தோ எடுக்கப்பட்ட குறையற்ற ஆணாக இருக்க வேண்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִרְצֹנְכֶם
  choice: நீங்கள் ஏற்றுக்கொள்ளப்படும்படி
  rationale: பலியின் வழியாக அர்ப்பணிப்பவர் ஏற்றுக்கொள்ளப்படுதல் என்ற சூழல்சார் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘உங்கள் விருப்பத்தின்படி’ என்ற சாத்தியமான சொற்பொருளை இங்கு முன்னிலைப்படுத்தவில்லை.
- source_word: תָּמִים
  choice: குறையற்ற
  rationale: பலிக்குரிய விலங்கின் முழுமை அல்லது பழுதின்மையைக் குறிக்கும் வழிபாட்டுச் சூழலுக்கு ஏற்ற தெளிவான தமிழ்.
- source_word: זָכָר
  choice: ஆண்
  rationale: விலங்கின் பாலினத்தை நேரடியாகக் குறிக்கிறது.
- source_word: בַּבָּקָר בַּכְּשָׂבִים וּבָעִזִּים
  choice: மாடுகளிலோ செம்மறியாடுகளிலோ வெள்ளாடுகளிலோ
  rationale: மூன்று கால்நடை வகைகளையும் இயல்பான தமிழ்ப் பட்டியலாக வழங்குகிறது; כְּשָׂבִים என்பதை பொதுவான ‘ஆடுகள்’ என்பதிலிருந்து வேறுபடுத்தி ‘செம்மறியாடுகள்’ எனத் தெளிவாக்குகிறது.
theological_decisions:
- issue: לִרְצֹנְכֶם என்பதன் தொடர்பு
  choice: அர்ப்பணிப்பவர்கள் ஏற்றுக்கொள்ளப்படுதல்
  alternative: உங்கள் விருப்பத்தின்படி / உங்கள் சார்பாக ஏற்றுக்கொள்ளத்தக்கதாக
  rationale: லேவியராகமம் 22:18–21 சூழலில் பலி ஏற்றுக்கொள்ளப்படுவதன் விளைவு அர்ப்பணிப்பவரைச் சார்ந்ததாக உள்ளது. எந்தச் சிறப்புக் கோட்பாட்டையும் சேர்க்காமல் அந்தத் தொடர்பை தமிழ் வாக்கியத்தில் காக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழ்; சுருக்கமான சட்டவிதி நடை. ‘குறையற்ற’ என்பது வாசகர்களுக்கு இயல்பாகவும் பலி ஒழுங்கின் பொருளைத் துல்லியமாகவும் தருகிறது.
