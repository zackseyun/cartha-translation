base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/025.yaml
  text: And from the hand of a foreigner you shall not present any of these as the food of your God[a], because their corruption is in them; a defect is in them[b]. They shall not be accepted for you.
translation:
  language: ta
  text: மேலும், அந்நியரின் கையிலிருந்தும் இவற்றில் எதையும் உங்கள் கடவுளின் உணவாக[a] செலுத்தக்கூடாது. ஏனெனில், அவற்றில் சீர்கேடு உள்ளது; அவற்றில் குறைபாடு[b] உள்ளது. அவை உங்களுக்காக ஏற்றுக்கொள்ளப்படாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உங்கள் கடவுளின் அப்பமாக.’ இங்கு ‘அப்பம்’ என்பது கடவுளுக்குச் செலுத்தப்படும் உணவைக் குறிக்கும் எபிரேய பலிமுறை மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘ஊனம்.’ எபிரேயச் சொல், ஒரு விலங்கைப் பலிக்குத் தகுதியற்றதாக்கும் குறையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִיַּד
  choice: அந்நியனின் கையிலிருந்து
  rationale: מִיַּד என்பதன் ‘கையிலிருந்து’ என்ற மூல மொழி உருவகத்தைத் தக்கவைத்து, பொருள் வரும் வழியையோ கொடுப்பவரையோ குறிக்கிறது.
- source_word: בֶּן נֵכָר
  choice: அந்நியன்
  rationale: சொல்லுக்குச் சொல் ‘அந்நியனின் மகன்’ என்றாலும், இது இஸ்ரவேலர் அல்லாத வெளிநாட்டவரைக் குறிக்கும் எபிரேய மரபுத்தொடர்; ‘அந்நியன்’ இயல்பான நவீனத் தமிழ்.
- source_word: תַקְרִיבוּ
  choice: செலுத்தக்கூடாது
  rationale: קרב என்பதன் ஹிஃபில் வடிவம் பலிசார் சூழலில் கடவுளிடம் காணிக்கையைச் செலுத்துதல் அல்லது சமர்ப்பித்தலைக் குறிக்கிறது; ‘செலுத்துதல்’ இங்கு இயல்பாகவும் மரியாதைமிக்கதாகவும் உள்ளது.
- source_word: לֶחֶם אֱלֹהֵיכֶם
  choice: உங்கள் கடவுளுக்குரிய உணவு
  rationale: לֶחֶם என்பதன் அடிப்படைப் பொருள் ‘அப்பம்’; ஆனால் ஆசாரிய பலிமுறைச் சூழலில் கடவுளுக்குச் செலுத்தப்படும் உணவை விரிவாகக் குறிக்கிறது. ‘உணவு’ என்பது விலங்குப் பலிகள் பற்றிய இச்சூழலைத் தெளிவாக்குகிறது.
- source_word: מִכָּל אֵלֶּה
  choice: இவற்றில் எதையும்
  rationale: முன்னர் கூறப்பட்ட குறைபாடுள்ள விலங்குகளில் ஒன்றையும் செலுத்தக் கூடாது என்ற பகுதியெடுக்கும் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מָשְׁחָתָם
  choice: அவற்றில் சிதைவு உள்ளது
  rationale: மூலச் சொல் கெடுதல், சீரழிவு அல்லது உருக்குலைவை உணர்த்துகிறது. அடுத்து வரும் ‘குறைபாடு’ என்பதோடு ஒன்றாக்காமல், தனியான கூற்றாக ‘சிதைவு’ எனத் தக்கவைக்கப்பட்டது.
- source_word: מוּם
  choice: குறைபாடு
  rationale: லேவியராகமம் 21–22இல் பலிக்குத் தகுதியிழக்கச் செய்யும் உடல்சார் குறையை இச்சொல் குறிக்கிறது; ‘குறைபாடு’ தெளிவான பொதுநடைச் சொல்.
- source_word: לֹא יֵרָצוּ לָכֶם
  choice: அவை உங்களுக்காக ஏற்றுக்கொள்ளப்படாது
  rationale: רצה என்பதன் நிஃபால் வடிவம் பலி ஏற்றுக்கொள்ளப்படுவதைச் சுட்டுகிறது. לָכֶם என்பதன் ‘உங்களுக்காக/உங்கள் சார்பாக’ என்ற தொடர்பும் தக்கவைக்கப்பட்டுள்ளது.
theological_decisions:
- issue: பலிக்காணிக்கையைக் குறிக்கும் ஆசாரிய மரபுத்தொடர்
  choice: உங்கள் கடவுளுக்குரிய உணவு
  alternative: உங்கள் கடவுளின் அப்பம்
  rationale: இந்த வசனம் விலங்குப் பலிகளின் ஏற்புடைமையைப் பற்றியது. לֶחֶם என்பதை ‘உணவு’ என்று மொழிபெயர்ப்பது, அது நேரடியாக அப்பத்தை மட்டும் குறிக்கிறது என்ற தவறான எண்ணத்தைத் தவிர்த்து, ஆசாரிய மரபுத்தொடரின் பொருளை வெளிப்படுத்துகிறது.
- issue: מָשְׁחָתָם மற்றும் מוּם ஆகிய இரு சொல்லாக்கங்களின் தொடர்பு
  choice: ‘சிதைவு’ மற்றும் ‘குறைபாடு’ என இரு கூற்றுகளையும் தனித்தனியாகத் தக்கவைத்தல்
  alternative: இரண்டையும் ‘குறைபாடு’ என்ற ஒரே கருத்தாக இணைத்தல்
  rationale: மூல உரை இரண்டு நெருக்கமான ஆனால் தனித்த சொற்களை அடுத்தடுத்து வைக்கிறது. அவற்றின் வலியுறுத்தலையும் சாத்தியமான பொருள் வேறுபாட்டையும் மொழிபெயர்ப்பு அழிக்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் மரியாதைமிக்க வேதாகம நடையைப் பேணுகிறது. மூலத்தின் ‘கையிலிருந்து’ என்ற உருவகமும், ‘சிதைவு/குறைபாடு’ என்ற இரட்டைக் கூற்றும் பாதுகாக்கப்பட்டுள்ளன; தெளிவுக்காக வாக்கியம் மூன்று பகுதிகளாக அமைக்கப்பட்டுள்ளது.
