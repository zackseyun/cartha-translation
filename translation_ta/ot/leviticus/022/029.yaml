revisions:
- from: நீங்கள் யெகோவாவுக்கு நன்றிப் பலி[a] செலுத்தும்போது, அது உங்கள் சார்பாக ஏற்றுக்கொள்ளப்படும்படி அதைச் செலுத்துங்கள்.
  to: நீங்கள் யாவேக்கு நன்றிப் பலியைச் செலுத்தும்போது, அது உங்களுக்கு ஏற்கத்தக்கதாக இருக்கும்படி செலுத்துங்கள்.
  rationale: The revision aligns the rendering of יהוה with the project’s Yahweh policy, retains the specific sacrificial sense of זֶבַח תּוֹדָה and the Hebrew verb repetition, and renders לרצנכם as the offering’s acceptability for the offerers. The footnote retains legitimate lexical alternatives for the offering designation.
  reviewer_model: gpt-5.6-terra
