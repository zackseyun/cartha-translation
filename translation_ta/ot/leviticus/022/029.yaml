id: LEV.22.29
reference: Leviticus 22:29
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/כִֽי תִזְבְּח֥וּ זֶֽבַח תּוֹדָ֖ה לַ/יהוָ֑ה לִֽ/רְצֹנְ/כֶ֖ם תִּזְבָּֽחוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/029.yaml
  text: And when you sacrifice a thank offering to Yahweh[a], you shall sacrifice it for your acceptance.
translation:
  language: ta
  text: நீங்கள் யாவேக்கு நன்றிப் பலியைச் செலுத்தும்போது, அது உங்களுக்கு ஏற்கத்தக்கதாக இருக்கும்படி செலுத்துங்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/כִּי
  choice: நீங்கள் ... செலுத்தும்போது
  rationale: சட்டச் சூழலில் வரும் நிபந்தனை–காலத் தொடர்பை இயல்பான தமிழில் காட்டுகிறது; முந்தைய கட்டளைகளின் தொடர்ச்சியும் காக்கப்படுகிறது.
- source_word: תִזְבְּחוּ / תִּזְבָּחוּ
  choice: செலுத்தும்போது / அதைச் செலுத்துங்கள்
  rationale: זבח என்பதன் பலியிடுதல் சார்ந்த பொருளைத் தமிழின் வழக்கமான ‘பலி செலுத்து’ என்ற சொற்றொடர் வெளிப்படுத்துகிறது; எபிரெய மூலத்தில் வினைச்சொல் மீண்டும் வருவதையும் மொழிபெயர்ப்பு தக்கவைக்கிறது.
- source_word: זֶבַח תּוֹדָה
  choice: நன்றிப் பலி
  rationale: நன்றியறிதலால் வகைப்படுத்தப்படும் குறிப்பிட்ட பலிவகையைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது; விரிவான மாற்று மொழியாக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לַ/יהוָה
  choice: யெகோவாவுக்கு
  rationale: தெய்வீகப் பெயரான יהוה என்பதை பட்டப்பெயராக மாற்றாமல் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பால் வழங்குகிறது; ל அர்ப்பணிக்கப்படும் திசையை ‘-க்கு’ காட்டுகிறது.
- source_word: לִ/רְצֹנְ/כֶם
  choice: அது உங்கள் சார்பாக ஏற்றுக்கொள்ளப்படும்படி
  rationale: பலிச் சூழலில் רָצוֹן என்பது பலி செலுத்துவோரின் விருப்பத்தைவிட, அவர்களுக்காகப் பலி கடவுளால் ஏற்கப்படுவதைக் குறிக்கிறது. ‘உங்கள் சார்பாக’ என்பது לָכֶם சார்ந்த நலன்/பிரதிநிதித்துவ நுணுக்கத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יהוה என்ற தெய்வீகப் பெயரின் மொழியாக்கம்
  choice: யெகோவா
  alternative: யாவே
  rationale: மூலத்தில் உள்ள உடன்படிக்கைப் பெயரை ‘கர்த்தர்’ என்ற பட்டப்பெயரால் மாற்றாமல், தமிழ் வாசகர்களிடையே நிலைபெற்ற தனிப்பெயர் வடிவத்தில் வழங்குகிறது.
- issue: לִרְצֹנְכֶם என்பதன் பொருள்
  choice: அது உங்கள் சார்பாக ஏற்றுக்கொள்ளப்படும்படி
  alternative: உங்கள் விருப்பத்தின்படி
  rationale: லேவியராகமத்தின் பலி ஒழுங்குகளில் இச்சொல் வழிபடுவோரின் தனிப்பட்ட விருப்பத்தை அல்ல, அவர்களுக்காகப் பலி ஏற்கத்தக்கதாக இருப்பதைக் குறிக்கிறது; இருப்பினும் ஏற்றுக்கொள்ளப்படுதல் கடவுளிடமிருந்து வருகிறது என்பதைத் தேவையின்றி விரிவாக்காமல் கூறுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டு உரைக்கு ஏற்ற கண்ணியமான ஆனால் எளிதில் புரியும் நடையில் வடிவமைக்கப்பட்டது. ‘பலி செலுத்து’ என்ற இயல்பான சமயச் சொற்றொடர் பயன்படுத்தப்பட்டு, மூலத்தின் வினைச்சொல் மீளுருவாக்கமும் காக்கப்பட்டுள்ளது.
