base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/024.yaml
  text: You shall not present to Yahweh anything with bruised[a], crushed, torn, or cut testicles, and in your land you shall not do this.
translation:
  language: ta
  text: விரைகள்[a] அழுத்திக் காயப்படுத்தப்பட்ட, நொறுக்கப்பட்ட, பிய்த்தெடுக்கப்பட்ட, அல்லது வெட்டப்பட்ட எந்த மிருகத்தையும் யாவேக்கு அர்ப்பணிக்காதீர்கள்; உங்கள் நாட்டில் அப்படிச் செய்யாதீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேய மூலத்தில் ‘விரைகள்’ என்ற உறுப்பு வெளிப்படையாகக் கூறப்படவில்லை; ‘அழுத்திக் காயப்படுத்தப்பட்ட, நொறுக்கப்பட்ட, பிய்த்தெடுக்கப்பட்ட, அல்லது வெட்டப்பட்ட’ என நான்கு வகையான சேதங்கள் மட்டும் பட்டியலிடப்படுகின்றன. சூழல் பலிமிருகத்தின் ஆண் இனப்பெருக்க உறுப்புகளைக் குறிக்கிறது.
    reason: implicit_object
lexical_decisions:
- source_word: מָעוּךְ
  choice: அழுத்திக் காயப்படுத்தப்பட்ட
  rationale: அழுத்தத்தால் ஏற்பட்ட சேதத்தைக் குறிக்கும் இச்சொல்லை, அடுத்துள்ள ‘நொறுக்கப்பட்ட’ என்பதிலிருந்து வேறுபடுத்தி இயல்பான தமிழில் தருகிறது.
- source_word: כָתוּת
  choice: நொறுக்கப்பட்ட
  rationale: அடித்தல் அல்லது நசுக்குதல் மூலம் முற்றாகச் சேதப்படுத்தப்பட்ட நிலையைக் காட்சிப்படுத்துகிறது.
- source_word: נָתוּק
  choice: பிய்த்தெடுக்கப்பட்ட
  rationale: இழுத்துப் பிரித்தல் அல்லது பிடுங்கித் துண்டித்தல் என்ற மூலச்சொல்லின் வலிமையைத் தக்கவைக்கிறது.
- source_word: כָרוּת
  choice: வெட்டப்பட்ட
  rationale: வெட்டி அகற்றப்பட்ட அல்லது துண்டிக்கப்பட்ட நிலையைக் குறிக்கும் நேரடியான, இயல்பான தமிழாக்கம்.
- source_word: תַקְרִיבוּ
  choice: அர்ப்பணிக்காதீர்கள்
  rationale: பலிசார் சூழலில் தேவனிடம் கொண்டுவந்து செலுத்துவதைக் குறிக்கிறது; பலிபீடத்தில் எரிப்பதற்கு மட்டும் பொருளைக் குறுக்காமல் பரந்த செயலையே தெரிவிக்கிறது.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: திருப்பெயரான יהוה என்பதை ‘யாவே’ என்று ஒலிபெயர்த்து, இலக்கணத்திற்கேற்ப நான்காம் வேற்றுமை உருபுடன் வழங்குகிறது.
- source_word: בְאַרְצְכֶם
  choice: உங்கள் நாட்டில்
  rationale: இஸ்ரவேலருக்குரிய நிலப்பரப்பைக் குறிக்கும் சொற்றொடரை நவீன வாசகருக்கு இயல்பாகத் தருகிறது.
- source_word: תַעֲשׂוּ
  choice: அப்படிச் செய்யாதீர்கள்
  rationale: ‘செய்’ என்ற எபிரேய வினை இங்கு முன்சொன்ன செயலைச் சுட்டும் வகையில் விடுபட்ட பொருளுடன் வருகிறது; தமிழிலும் அதன் பரந்த, சற்றே தெளிவற்ற சுட்டுதலைப் பாதுகாக்கிறது.
- source_word: நான்கு பெயரெச்சங்களின் மறைபொருளான உறுப்பு
  choice: விதைகள்
  rationale: எபிரேயத்தில் உடல் உறுப்பு வெளிப்படையாகக் கூறப்படாவிட்டாலும், சூழல் பலிமிருகங்களின் ஆண் இனப்பெருக்க உறுப்புகளைக் குறிக்கிறது. ‘விதைகள்’ என்பது வழக்கில் புரியக்கூடிய, கண்ணியமான, உடற்கூறியல் சார்ந்த தமிழ்ச் சொல்.
theological_decisions:
- issue: יהוה என்ற திருப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: எபிரேய திருப்பெயரைப் பெயராகவே வெளிப்படுத்தி, மூலத்தில் உள்ள தனிப்பட்ட தெய்வப்பெயரைத் தக்கவைக்கிறது.
- issue: וּבְאַרְצְכֶם לֹא תַעֲשׂוּ என்ற இறுதித் தடையின் வரம்பு
  choice: உங்கள் நாட்டில் அப்படிச் செய்யாதீர்கள்
  alternative: உங்கள் நாட்டில் இப்படிப்பட்ட மிருகங்களைப் பலியிடாதீர்கள்
  rationale: ‘செய்யாதீர்கள்’ என்ற எபிரேய வினை பரந்ததும் விடுபட்ட பொருளைக் கொண்டதுமாக உள்ளது. அது முன்சொன்ன உறுப்புச் சிதைப்பைச் சுட்டுவது இயல்பாக இருந்தாலும், பலியிடுதல் மட்டுமே என்று குறுக்காமல் மூலத்தின் சுட்டுத் தெளிவின்மையை மொழிபெயர்ப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. நான்கு சேதநிலைகளின் வேறுபாடு இயன்றவரை பாதுகாக்கப்பட்டு, இறுதி தடையின் எபிரேயத் தெளிவின்மை மிகையாக விளக்கப்படாமல் விடப்பட்டுள்ளது.
