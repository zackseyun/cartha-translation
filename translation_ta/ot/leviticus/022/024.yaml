- from: விதைகள்[a] அழுத்திக் காயப்படுத்தப்பட்டோ, நொறுக்கப்பட்டோ, பிய்த்தெடுக்கப்பட்டோ, வெட்டப்பட்டோ உள்ள எந்த மிருகத்தையும் யாவேக்கு அர்ப்பணிக்காதீர்கள்; உங்கள் நாட்டில் அப்படிச் செய்யாதீர்கள்.
