  text: וּ/בָ֥א הַ/שֶּׁ֖מֶשׁ וְ/טָהֵ֑ר וְ/אַחַר֙ יֹאכַ֣ל מִן הַ/קֳּדָשִׁ֔ים כִּ֥י לַחְמ֖/וֹ הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/007.yaml
  text: When the sun has set, he will be clean; and afterward he may eat from the holy things, because they are his food.
translation:
  language: ta
  text: சூரியன் மறைந்ததும் அவன் சுத்தமாவான். அதன்பிறகு, பரிசுத்தமானவற்றிலிருந்து[a] அவன் உண்ணலாம்; ஏனெனில் அது அவனுடைய உணவு[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பரிசுத்த அர்ப்பணிப்புகளிலிருந்து.’
    reason: lexical_alternative
  - marker: b
    text: சொற்பட, ‘அது அவனுடைய அப்பம்.’ இங்கு ‘அப்பம்’ என்பது பரிசுத்தப் பங்குகளிலிருந்து அவனுக்குக் கிடைக்கும் உணவைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָא הַשֶּׁמֶשׁ
  choice: சூரியன் மறைந்ததும்
  rationale: எபிரெய மொழியில் சொற்பட ‘சூரியன் வந்ததும்’ என்றிருந்தாலும், இது சூரிய மறைவைக் குறிக்கும் மரபுத்தொடர். ‘மறைந்ததும்’ என்பது நேர வரிசையையும் இயல்பான தமிழிலும் தெளிவாகத் தருகிறது.
- source_word: וְטָהֵר
  choice: அவன் சுத்தமாவான்
  rationale: இங்கு טהר என்பது சடங்குமுறைத் தீட்டு நீங்கி மீண்டும் சுத்தநிலையை அடைவதைக் குறிக்கிறது. ‘சுத்தமாவான்’ என்பது ஒழுக்கத் தூய்மையைத் தேவையின்றி சேர்க்காமல், வசனச் சூழல் பொருளைத் தீர்மானிக்க விடுகிறது.
- source_word: וְאַחַר
  choice: அதன்பிறகு
  rationale: சுத்தநிலை மீண்டதைத் தொடர்ந்து நிகழும் அடுத்த கட்டத்தை இயல்பான நவீன தமிழில் குறிக்கிறது.
- source_word: יֹאכַל
  choice: அவன் உண்ணலாம்
  rationale: இந்தச் சட்டச் சூழலில் வினை, சுத்தநிலை அடைந்தபின் வழங்கப்படும் அனுமதியைச் சுட்டுகிறது; ஆகவே வெறும் எதிர்காலத்தைவிட ‘உண்ணலாம்’ பொருத்தமானது.
- source_word: מִן הַקֳּדָשִׁים
  choice: பரிசுத்தமானவற்றிலிருந்து
  rationale: קדשים என்ற பன்மைச் சொல் அர்ப்பணிக்கப்பட்ட பரிசுத்தப் பங்குகளைக் குறிக்கிறது. மூலத்தின் பொதுவான சொல்லாட்சியைத் தக்கவைத்து, ‘பலிகளிலிருந்து’ என்று தேவைக்கு மீறிக் குறிப்பாக்காமல் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: உண்ண அனுமதிக்கப்படுவதற்கான காரணத்தை அறிமுகப்படுத்தும் காரண இணைப்பைத் தெளிவாகத் தருகிறது.
- source_word: לַחְמוֹ הוּא
  choice: அது அவனுடைய உணவு
  rationale: மூலத்தில் ‘அது அவனுடைய அப்பம்’ என்று ஒருமையில் உள்ளது. இச்சூழலில் לֶחֶם வாழ்வாதார உணவைக் குறிக்கும்; ‘அது’ மூலத்தின் ஒருமையைப் பாதுகாக்கிறது, ‘உணவு’ இயல்பான சூழற்பொருளைத் தருகிறது.
theological_decisions:
- issue: சுத்தம் என்பதன் தன்மை
  choice: சடங்குமுறைச் சுத்தநிலையைச் சூழல் உணர்த்தும் வகையில் ‘சுத்தமாவான்’
  alternative: ஒழுக்க அல்லது ஆன்மிகத் தூய்மை
  rationale: லேவியராகமம் 22-இன் சூழல், தீட்டுக்குப் பின் ஆசாரியன் பரிசுத்த உணவை உண்ணும் தகுதியை மீண்டும் பெறுவதைப் பற்றியது. வசனத்தில் இல்லாத ஒழுக்கக் கருத்தைச் சேர்க்காமல் மொழிபெயர்ப்பு அமைக்கப்பட்டுள்ளது.
- issue: לַחְמוֹ הוּא என்பதிலுள்ள ஒருமையும் அதன் தொடர்பும்
  choice: ‘அது அவனுடைய உணவு’ என்று ஒருமையைத் தக்கவைத்தல்
  alternative: முன்னுள்ள பன்மையான ‘பரிசுத்தமானவை’ என்பதற்கேற்ப ‘அவை அவனுடைய உணவு’
  rationale: எபிரெய மூலத்தில் הוּא ஒருமையாகவும் לַחְמוֹ ‘அவனுடைய அப்பம்/உணவு’ என்றும் உள்ளது. தமிழில் புரிந்துகொள்ளத்தக்க வகையில் மூலத்தின் ஒருமை பாதுகாக்கப்பட்டது; அது பரிசுத்தப் பங்குகளை ஒட்டுமொத்த உணவாதாரமாகக் குறிப்பிடலாம்.
translation_notes:
  register: நவீன தரத் தமிழில், சட்டநெறியின் வரிசை தெளிவாகத் தெரியுமாறு சுருக்கமான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பரிசுத்தமானவை’ மூலத்தின் பரந்த சொல்லாட்சியைப் பாதுகாக்கிறது; அடிக்குறிப்பு சூழலுக்கேற்ற மாற்று வாசிப்பை வழங்குகிறது.
