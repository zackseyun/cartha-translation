base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/004.yaml
  text: Any man from the offspring of Aaron[a], if he is afflicted with a skin disease or has a discharge, shall not eat from the holy things until he becomes clean. And whoever touches anything unclean by a dead person, or a man from whom an emission of semen comes out[b],
translation:
  language: ta
  text: ஆரோனின் சந்ததியினரில் எவனாவது தீட்டுண்டாக்கும் தோல் நோயால் பாதிக்கப்பட்டிருந்தாலோ[a] உடலிலிருந்து கசிவு ஏற்படுகிறவனாக இருந்தாலோ, அவன் தூய்மையாகும்வரை பரிசுத்தப் பொருள்களை உண்ணக்கூடாது. பிணம் சார்ந்த தீட்டுள்ள எதையாவது தொடுகிறவனும்[b], விந்து வெளியேறிய ஒருவனும்,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மரபாக, “தொழுநோயால் பாதிக்கப்பட்டிருந்தாலோ” என மொழிபெயர்க்கப்படுகிறது. எபிரெயச் சொல் நவீன தொழுநோயை (ஹான்சன் நோயை) மட்டும் குறிக்காமல், சடங்குமுறைத் தீட்டை உண்டாக்கும் பலவகைத் தோல் நிலைகளைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “பிணத்தால் தீட்டுப்பட்ட ஒருவனைத் தொடுகிறவனும்.” எபிரெயச் சொற்றொடர் பிணம் சார்ந்த தீட்டைக் குறிக்கிறது; தீட்டுப்பட்ட பொருளா அல்லது நபரா என்பது தெளிவாக இல்லை.
    reason: textual_ambiguity
lexical_decisions:
- source_word: אִישׁ אִישׁ מִזֶּרַע אַהֲרֹן
  choice: ஆரோனின் சந்ததியினரில் எவனாவது
  rationale: இரட்டிக்கப்பட்ட אִישׁ பகிர்ந்தளிக்கும் சட்ட மொழியில் ‘எவனாவது’ எனப் பொருள்படும்; ஆரோனிய ஆண் ஆசாரியர்களைக் குறிக்கும் பாலினமும் வம்சக் கருத்தும் காக்கப்படுகின்றன.
- source_word: צָרוּעַ
  choice: தீட்டுண்டாக்கும் தோல் நோயால் பாதிக்கப்பட்டிருந்தால்
  rationale: இச்சொல் நவீன ஹான்சன் நோயை மட்டும் குறிக்காது; சடங்குமுறைத் தீட்டை உண்டாக்கும் பரந்த தோல் நிலையைச் சுட்டுகிறது.
- source_word: זָב
  choice: உடற்கசிவு உள்ளவன்
  rationale: சடங்குமுறைத் தீட்டை ஏற்படுத்தும் உடல் அல்லது பிறப்புறுப்புக் கசிவைக் குறிக்கும் சொல்; கண்ணியமான, தெளிவான நவீன தமிழில் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: בַּקֳּדָשִׁים לֹא יֹאכַל
  choice: பரிசுத்தப் பொருள்களை உண்ணக்கூடாது
  rationale: இவை ஆசாரியர் உண்ணக்கூடிய அர்ப்பணிக்கப்பட்ட உணவுப் பங்குகள்; தமிழ் சட்டத் தடையை இயல்பாக வெளிப்படுத்த ‘உண்ணக்கூடாது’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: עַד אֲשֶׁר יִטְהָר
  choice: அவன் தூய்மையாகும்வரை
  rationale: சடங்குமுறைத் தீட்டிலிருந்து தூய்மை நிலைக்கு மாறுவதை வினைச்சொல் குறிக்கிறது; மருத்துவ குணமடைதலாக மாற்றப்படவில்லை.
- source_word: וְהַנֹּגֵעַ בְּכָל טְמֵא נֶפֶשׁ
  choice: பிணத்தால் தீட்டுப்பட்ட எதையாவது தொடுகிறவனும்
  rationale: கடினமான எபிரெயச் சொற்றொடரின் பிணம் சார்ந்த தீட்டு கருத்தை முதன்மை உரையில் தெளிவாக்குகிறது; ‘தீட்டுப்பட்ட ஒருவனை’ என்ற இலக்கணச் சாத்தியம் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: אִישׁ אֲשֶׁר תֵּצֵא מִמֶּנּוּ שִׁכְבַת זָרַע
  choice: விந்து வெளியேறிய ஒருவனும்
  rationale: விந்தின் வெளியேற்றத்தை மறைமொழியின்றி, ஆனால் கண்ணியமாகவும் சுருக்கமாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: צָרוּעַ என்பதற்கு பிற்கால மருத்துவ நோயறிதலைச் சேர்க்காமல் மொழிபெயர்த்தல்
  choice: தீட்டுண்டாக்கும் தோல் நோய்
  alternative: தொழுநோய்
  rationale: இப்பகுதி மருத்துவ வகைப்பாட்டையோ ஒழுக்கக் குற்றத்தையோ அல்ல, ஆசாரியரின் சடங்குமுறைத் தகுதியைச் சார்ந்தது; ஆகவே குறிப்பிட்ட நவீன நோயுடன் தவறாக ஒப்பிடப்படவில்லை.
- issue: טְמֵא נֶפֶשׁ என்ற தெளிவற்ற பிணம் சார்ந்த தீட்டு மொழி
  choice: பிணத்தால் தீட்டுப்பட்ட எதையாவது
  alternative: பிணத்தால் தீட்டுப்பட்ட ஒருவனை
  rationale: முதன்மை வாசிப்பு பிணத்தால் தீட்டான ஒன்றைத் தொடுதலைக் குறிக்கிறது; மனிதரைச் சுட்டும் மாற்று வாசிப்பும் இலக்கண ரீதியாகச் சாத்தியமுள்ளதால் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: சட்ட உரையின் பாலினம் சார்ந்த பொருள்
  choice: ஆரோனின் சந்ததியினரில் எவனாவது
  alternative: ஆரோனின் சந்ததியினரில் எவராவது
  rationale: சூழலில் ஆண் ஆரோனிய ஆசாரியர்களே நேரடியாகக் குறிக்கப்படுவதால் மூலத்தின் ஆண்பால் குறிப்பு காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் கண்ணியமான சட்டநடை பயன்படுத்தப்பட்டுள்ளது. ‘தூய்மை’, ‘தீட்டு’, ‘பரிசுத்தப் பொருள்கள்’ ஆகியவை லேவியராகமத்தின் சடங்குமுறைச் சூழலைத் தெளிவாக வைத்திருக்கின்றன. எபிரெய வசனம் அடுத்த வசனத்திற்குத் தொடரும் பட்டியலின் நடுவில் முடிவதால் தமிழிலும் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
