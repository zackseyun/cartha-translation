  register: நவீன நிலையான தமிழில், எளிதில் புரியக்கூடியதாயும் கண்ணியமானதாயும் வடிவமைக்கப்பட்டது. ‘பரிசுத்தம்’ என்ற ஒரே சொல் குடும்பம் வசனத்தின் மூன்று קדשׁ தொடர்புகளிலும் இயன்றவரை தொடர்ச்சியாகப் பாதுகாக்கப்பட்டுள்ளது; எபிரெய இணைப்புகளின் உறவு வாக்கியப் பிரிப்பின் வழியாக இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது.
