  text: וְ/לֹ֤א תְחַלְּלוּ֙ אֶת שֵׁ֣ם קָדְשִׁ֔/י וְ/נִ֨קְדַּשְׁתִּ֔י בְּ/ת֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל אֲנִ֥י יְהוָ֖ה מְקַדִּשְׁ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/032.yaml
  text: And you shall not profane my holy name[a], and I will be sanctified among the sons of Israel. I am Yahweh[b], who sanctifies you.
translation:
  language: ta
  text: என் பரிசுத்தப் பெயரை நீங்கள் புனிதமற்றதாக்கக் கூடாது. இஸ்ரவேலின் மகன்களிடையே[b] நான் பரிசுத்தராக மதிக்கப்படுவேன்.[a] உங்களைப் பரிசுத்தமாக்குகிற யாவே நானே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் பரிசுத்தராக வெளிப்படுத்தப்படுவேன்” அல்லது “நான் பரிசுத்தராகக் கருதப்படுவேன்.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் “இஸ்ரவேலின் மகன்கள்”; இது இஸ்ரவேல் மக்களைக் குறிக்கும் வழக்கமான சொற்றொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְחַלְּלוּ
  choice: புனிதமற்றதாக்கக் கூடாது
  rationale: חלל என்பதன் பியேல் வடிவம், பரிசுத்தமான ஒன்றைச் சாதாரணமானதாக அல்லது புனிதமற்றதாக நடத்துவதைக் குறிக்கிறது. இந்தத் தேர்வு அதன் வழிபாட்டு மற்றும் இறையியல் வலிமையைப் பாதுகாக்கிறது.
- source_word: שֵׁם קָדְשִׁי
  choice: என் பரிசுத்தப் பெயர்
  rationale: எபிரெயக் கட்டமைப்பிலுள்ள ‘பெயர்’ மற்றும் ‘பரிசுத்தம்’ ஆகிய இரண்டையும் இயல்பான நவீனத் தமிழில் தக்கவைக்கிறது.
- source_word: וְנִקְדַּשְׁתִּי
  choice: நான் பரிசுத்தராக மதிக்கப்படுவேன்
  rationale: קדשׁ என்பதன் நிபால் வடிவம் இங்கு யாவே பரிசுத்தராக ஏற்றுக்கொள்ளப்படுதல் அல்லது நடத்தப்படுதல் என்ற பொருளைத் தருகிறது. தமிழில் இயல்பாக இருக்கவும் இறுதியில் வரும் ‘பரிசுத்தமாக்குகிற’ என்பதுடனான சொற்பொருள் தொடர்பைத் தக்கவைக்கவும் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: בְּתוֹךְ
  choice: இடையே
  rationale: உடன்படிக்கைச் சமூகத்தின் மத்தியில் நிகழ்வதைக் குறிக்கும் இடவியல் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரெய மொழியின் ஆண்பால் பன்மை வடிவத்தை வெளிப்படையாகப் பாதுகாக்கிறது; சூழலில் இது இஸ்ரவேல் சமூகத்தார் அனைவரையும் குறிக்கும் மரபுத்தொடர்.
- source_word: יְהוָה
  choice: யாவே
  rationale: தலைப்புப் பெயரை மாற்றாக இடாமல், எபிரெய வேதாகமத்திலுள்ள தேவனுடைய தனிப்பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: מְקַדִּשְׁכֶם
  choice: உங்களைப் பரிசுத்தமாக்குகிற
  rationale: தொடர்ச்சியான தெய்வீகச் செயலைக் காட்டும் பங்கேற்பு வடிவத்தின் பொருளைத் தக்கவைத்து, வசனத்திலுள்ள קדשׁ சொல் குடும்பத்தின் தொடர்பையும் பாதுகாக்கிறது.
theological_decisions:
- issue: וְנִקְדַּשְׁתִּי என்பதன் செயப்பாட்டு அல்லது தன்னிலை நுணுக்கம்
  choice: நான் பரிசுத்தராக மதிக்கப்படுவேன்
  alternative: நான் பரிசுத்தராக வெளிப்படுத்தப்படுவேன்; நான் பரிசுத்தராக நடத்தப்படுவேன்
  rationale: யாவே பரிசுத்தமாக்கப்பட வேண்டியவர் என்ற கருத்தை உருவாக்காமல், மக்களிடையே அவருடைய பரிசுத்தம் அங்கீகரிக்கப்பட்டு மதிக்கப்படுவது என்ற நுணுக்கத்தை வெளிப்படுத்துகிறது; மூலத்தின் சாத்தியமான செயப்பாட்டு நிழலையும் அடிக்குறிப்பு காக்கிறது.
- issue: בְּנֵי יִשְׂרָאֵל என்பதன் சமூகப் பிரதிநிதித்துவம்
  choice: இஸ்ரவேலின் மகன்கள்
  alternative: இஸ்ரவேல் மக்கள்; இஸ்ரவேலர்
  rationale: மூலத்தின் இலக்கண ஆண்பால் வடிவத்தைப் பாதுகாக்கிறது; அதேவேளையில் அது முழு உடன்படிக்கைச் சமூகத்தையும் குறிக்கும் மரபுத்தொடர் என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- issue: יְהוָה என்ற தேவனுடைய பெயர்
  choice: யாவே
  alternative: யெகோவா; கர்த்தர்
  rationale: மூலத்தில் நேரடியாக வரும் நான்கு எழுத்துத் தேவநாமத்தை ஒரு பட்டத்தால் மாற்றாமல் தனிப்பெயராக வழங்குகிறது.
