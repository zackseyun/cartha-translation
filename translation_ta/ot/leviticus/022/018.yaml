base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/018.yaml
  text: 'Speak to Aaron and to his sons and to all the sons of Israel[a], and say to them: Any man from the house of Israel, or from the sojourners in Israel, who presents his offering for any of their vows or any of their freewill offerings[c][b], which they present to Yahweh as a burnt offering—'
translation:
  language: ta
  text: '“ஆரோனிடமும் அவன் மகன்களிடமும் இஸ்ரவேல் மக்கள் அனைவரிடமும்[a] பேசி, அவர்களிடம் சொல்: இஸ்ரவேல் வீட்டாரில் ஒருவனோ, இஸ்ரவேலில் குடியிருக்கும் அந்நியரில் ஒருவனோ[b], தன் எந்த நேர்த்திக்கடனுக்காகவோ தன் எந்த விருப்பக் காணிக்கைக்காகவோ[c] யாவேக்கு எரிபலியாகத் தன் காணிக்கையைச் செலுத்தினால்—”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், “இஸ்ரவேலின் மகன்கள்”; இங்கு இந்த எபிரெய மரபுத்தொடர் இஸ்ரவேல் மக்கள் அனைவரையும் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “குடியிருக்கும் அந்நியர்” என்பது இஸ்ரவேலரல்லாதவராக இருந்தும் இஸ்ரவேல் சமூகத்தின் ஒழுங்குக்குள் வாழ்ந்தவரைக் குறிக்கிறது.
    reason: lexical_clarification
  - marker: c
    text: அல்லது, “அவர்களுடைய நேர்த்திக்கடன் காணிக்கைகள் அனைத்திற்காகவும், அவர்களுடைய விருப்பக் காணிக்கைகள் அனைத்திற்காகவும்.” நேர்த்திக்கடன்களோடு தொடர்புடைய காணிக்கைகளை எபிரெய வாசகம் இன்னும் குறிப்பாகக் குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: דַּבֵּר
  choice: பேசி
  rationale: பியேல் கட்டளை வடிவத்தின் அதிகாரப்பூர்வமான அறிவுறுத்தல் தொனியை இயல்பான தமிழில் தருகிறது.
- source_word: בָּנָיו
  choice: அவன் மகன்கள்
  rationale: எபிரெயச் சொல் ஆண்பால் பன்மையாக இருப்பதையும் ஆரோனின் ஆசாரிய மகன்களைக் குறிக்கும் சூழலையும் காக்கிறது.
- source_word: כָּל בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள் அனைவரும்
  rationale: சொல்லுக்குச் சொல் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், முழு சமூகத்தைக் குறிக்கும் எபிரெய மரபுத்தொடரை நவீனத் தமிழில் தெளிவாக வழங்குகிறது; மூல வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אִישׁ אִישׁ
  choice: ஒருவன்
  rationale: இரட்டிக்கப்பட்ட אִישׁ பகிர்வுப் பொருளில் ‘எவனாயினும்/ஒருவன்’ என்று பொருள்படும்; சட்ட உரையின் பிரதிநிதித்துவ ஆண்பால் வடிவத்தைச் சுருக்கமாகக் காக்கிறது.
- source_word: מִבֵּית יִשְׂרָאֵל
  choice: இஸ்ரவேல் வீட்டாரில்
  rationale: உடன்படிக்கைச் சமூகத்தைக் குறிக்கும் ‘இஸ்ரவேல் வீடு’ என்ற உருவகத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: הַגֵּר בְּיִשְׂרָאֵל
  choice: இஸ்ரவேலில் குடியிருக்கும் அந்நியர்
  rationale: גֵּר என்பது இஸ்ரவேல் சமூக ஒழுங்குக்குள் வாழும், இஸ்ரவேலரல்லாத குடியிருப்பாளரைக் குறிக்கிறது; வெறும் பயணி அல்லது அறிமுகமற்றவர் என்ற பொருளைத் தவிர்க்கிறது.
- source_word: יַקְרִיב קָרְבָּנוֹ
  choice: தன் காணிக்கையைச் செலுத்தினால்
  rationale: பலிச் சூழலில் קרב என்பதன் ஹிபில் வடிவம் காணிக்கையை இறைவனிடம் கொண்டுவந்து அளிப்பதைக் குறிக்கிறது; ‘செலுத்துதல்’ நேர்த்திக்கடன் மற்றும் பலி ஆகிய இரு சூழல்களுக்கும் இயல்பாக அமைகிறது.
- source_word: נִדְרֵיהֶם
  choice: தங்கள் நேர்த்திக்கடன்கள்
  rationale: נֶדֶר என்பது கடவுளிடம் செய்த உறுதி அல்லது நேர்த்திக்கடனைக் குறிக்கிறது; அதனோடு தொடர்புடைய காணிக்கையையும் சூழல் சுட்டலாம்.
- source_word: נִדְבוֹתָם
  choice: தங்கள் விருப்பக் காணிக்கைகள்
  rationale: கட்டாயமின்றித் தன்னார்வமாக அளிக்கப்படும் அங்கீகரிக்கப்பட்ட பலிவகையைத் தெளிவாகக் குறிக்கிறது.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: மூலத்தில் உள்ள உடன்படிக்கைப் பெயராகிய יהוה என்பதை பட்டப்பெயராக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: לְעֹלָה
  choice: எரிபலியாக
  rationale: עֹלָה என்பது முழுவதுமாக எரிக்கப்படும் பலிக்கான தொழில்நுட்பச் சொல்; ‘எரிபலி’ தமிழில் தெளிவான, சுருக்கமான பலியியல் பதம்.
theological_decisions:
- issue: சட்ட அறிவுறுத்தலில் உள்ள பிரதிநிதித்துவ ஆண்பால் மொழி
  choice: ஒருவன்
  alternative: ஒருவர் / எவராயினும்
  rationale: אִישׁ אִישׁ இலக்கண ரீதியாக ஆண்பாலும் பகிர்வுப் பொருளும் உடையது. அதனை பாலினநடுநிலையாக மாற்றாமல், தமிழில் இயல்பான பிரதிநிதித்துவ ஆண்பால் வடிவத்தில் தருகிறது.
- issue: יהוה என்ற இறைப்பெயர்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரை பொதுப்பட்டப்பெயரை அல்ல, நான்கெழுத்து உடன்படிக்கைப் பெயரையே பயன்படுத்துகிறது; அதனை வெளிப்படையாகக் காக்கிறது.
- issue: נדרים என்பதன் துல்லியச் சுட்டு
  choice: நேர்த்திக்கடன்கள்
  alternative: நேர்த்திக்கடன் காணிக்கைகள்
  rationale: எபிரெய வடிவம் நேரடியாக ‘நேர்த்திக்கடன்கள்’ என்கிறது; சூழலில் அவற்றுடன் தொடர்புடைய காணிக்கைகள் குறிக்கப்படலாம் என்ற சாத்தியத்தை முதன்மை உரை கட்டாயமாகத் தீர்மானிக்காமல் அடிக்குறிப்பில் வைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், லேவியராகமத்தின் சட்ட மற்றும் பலியியல் தொனியைத் தக்கவைக்கும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. வசனம் அடுத்த வசனத்தில் தொடரும் நிபந்தனை வாக்கியம் என்பதால் முடிவில் நீள்கோடு வைக்கப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறிகளும் தொடர்புடைய சொற்றொடர்களுக்குப் பின்னர் அமைக்கப்பட்டுள்ளன.
