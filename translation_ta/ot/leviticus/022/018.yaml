revisions:
- from: '“ஆரோனிடமும் அவன் மகன்களிடமும் இஸ்ரவேல் மக்கள் அனைவரிடமும்[a] பேசி, அவர்களிடம் சொல்: இஸ்ரவேல் வீட்டாரில் ஒருவனோ, இஸ்ரவேலில் குடியிருக்கும் அந்நியரில் ஒருவனோ[b], தங்கள் நேர்த்திக்கடன்கள் எதற்காகவும் தங்கள் விருப்பக் காணிக்கைகள் எதற்காகவும்[c] யாவேக்கு எரிபலியாகத் தன் காணிக்கையைச் செலுத்தினால்—”'
  to: '“ஆரோனிடமும் அவன் மகன்களிடமும் இஸ்ரவேல் மக்கள் அனைவரிடமும்[a] பேசி, அவர்களிடம் சொல்: இஸ்ரவேல் வீட்டாரில் ஒருவனோ, இஸ்ரவேலில் குடியிருக்கும் அந்நியரில் ஒருவனோ[b], தன் எந்த நேர்த்திக்கடனுக்காகவோ தன் எந்த விருப்பக் காணிக்கைக்காகவோ[c] யாவேக்கு எரிபலியாகத் தன் காணிக்கையைச் செலுத்தினால்—”'
  rationale: Only the rendering of לְכָל נִדְרֵיהֶם was adjusted. “தன் எந்த நேர்த்திக்கடனுக்காகவோ” preserves the legal-distributive force without implying that the vows themselves have unspecified purposes. The singular possessive agrees naturally with “ஒருவன்,” while the footnote preserves the source’s possible reference to vow offerings.
