revisions:
- from: ஆனால் ஒரு ஆசாரியனின் மகள் ஆசாரியக் குடும்பத்தைச் சேராத ஒருவனை மணந்தால்[a], பரிசுத்தப் பொருட்களிலிருந்து செலுத்தப்படும் காணிக்கையை[b] அவள் உண்ணக் கூடாது.
  to: ஆனால், ஒரு ஆசாரியனின் மகள் ஆசாரியக் குடும்பத்தைச் சேராத ஒருவனை மணந்தால்[a], பரிசுத்தப் பொருட்களிலிருந்து ஒதுக்கப்படும் காணிக்கையிலிருந்து அவள் உண்ணக் கூடாது.[b]
