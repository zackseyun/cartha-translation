review_pass:
  verdict: revise
  source_fidelity: The conditional marriage clause and the restriction on eating are accurately conveyed. However, ‘பரிசுத்தப் பொருட்களிலிருந்து செலுத்தப்படும் காணிக்கை’ can imply a contribution paid out from holy things and does not clearly express the Hebrew construct phrase ‘the contribution of the holy things.’ Recasting it as a portion set apart from the holy things better preserves the relation and the food context.
  naturalness: The sentence is otherwise clear, contemporary, and suitably legal in register. ‘ஒதுக்கப்படும்’ is more natural than ‘செலுத்தப்படும்’ for a sacred portion set apart.
  terminology: ‘ஆசாரியன்,’ ‘பரிசுத்தப் பொருட்கள்,’ and ‘காணிக்கை’ are appropriate. The contextual rendering of זָר as one outside the priestly family is defensible, while the note preserves the more literal wording.
  issues:
  - severity: medium
    issue: The phrase ‘பரிசுத்தப் பொருட்களிலிருந்து செலுத்தப்படும் காணிக்கை’ inadequately represents בִּתְרוּמַת הַקֳּדָשִׁים.
    rationale: ‘செலுத்தப்படும்’ normally describes paying or presenting a contribution; the Hebrew denotes the contribution/portion associated with the holy things. ‘பரிசுத்தப் பொருட்களிலிருந்து ஒதுக்கப்படும் காணிக்கை’ states that it is a set-apart portion and retains the food-related sense of ‘eat from.’
  revised_text: ஆனால், ஒரு ஆசாரியனின் மகள் ஆசாரியக் குடும்பத்தைச் சேராத ஒருவனை மணந்தால்[a], பரிசுத்தப் பொருட்களிலிருந்து ஒதுக்கப்படும் காணிக்கையிலிருந்து அவள் உண்ணக் கூடாது.[b]
