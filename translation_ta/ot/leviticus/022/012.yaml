base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/012.yaml
  text: But if a priest’s daughter becomes the wife of an outsider[b][a], she shall not eat from the contribution of the holy things.
translation:
  language: ta
  text: ஆனால், ஒரு ஆசாரியனின் மகள் ஆசாரியக் குடும்பத்தைச் சேராத ஒருவனை மணந்தால்[a], பரிசுத்தப் பொருட்களிலிருந்து ஒதுக்கப்படும் காணிக்கையிலிருந்து அவள் உண்ணக் கூடாது.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில் சொல்லுக்கு சொல்: ‘அந்நியமான ஒருவனுக்கு உரியவளானால்.’ இங்கு ஆசாரியக் குடும்பத்தைச் சேராத ஒருவனை மணப்பது பொருள்.'
    reason: lexical_alternative
  - marker: b
    text: ‘பரிசுத்தக் காணிக்கைகள்’ அல்லது ‘புனிதப் படையல்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַת כֹּהֵן
  choice: ஆனால் ஒரு ஆசாரியனின் மகள்
  rationale: முந்தைய விதியுடன் உள்ள மாறுபாட்டை וְ இங்கு காட்டுவதால் ‘ஆனால்’ என மொழிபெயர்க்கப்பட்டது; construct தொடர் ‘ஒரு ஆசாரியனின் மகள்’ என இயல்பாக வழங்கப்பட்டது.
- source_word: כִּי תִהְיֶה לְ/אִישׁ זָר
  choice: ஆசாரியக் குடும்பத்தைச் சேராத ஒருவனை மணந்தால்[a]
  rationale: இந்தச் சூழலில் זָר என்பது இனரீதியான அந்நியனை அல்ல, ஆசாரியக் குடும்பத்திற்கும் அதன் உணவு உரிமை வட்டத்திற்கும் வெளியிலிருப்பவனைக் குறிக்கிறது; תִהְיֶה לְאִישׁ என்பதன் திருமணப் பொருள் இயல்பான தமிழில் வெளிப்படுத்தப்பட்டது.
- source_word: הִוא
  choice: அவள்
  rationale: தனி சுட்டுப்பெயர் தரும் வலியுறுத்தலை மிகைப்படுத்தாமல், தமிழில் வெளிப்படையான எழுவாயாக வழங்குகிறது.
- source_word: בִּ/תְרוּמַת הַ/קֳּדָשִׁים
  choice: பரிசுத்தப் பொருட்களிலிருந்து செலுத்தப்படும் காணிக்கையை[b]
  rationale: תְּרוּמָה என்பது பிரித்தெடுத்துச் செலுத்தப்படும் காணிக்கை அல்லது பங்கு; הַקֳּדָשִׁים என்ற பன்மையின் பரந்த வழிபாட்டுச் சார்ந்த பொருளை ‘பரிசுத்தப் பொருட்கள்’ காக்கிறது.
- source_word: לֹא תֹאכֵל
  choice: உண்ணக் கூடாது
  rationale: சட்டப் பகுதியில் உள்ள தடை வலிமையை நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: ஆசாரியச் சட்டத்தில் זָר என்பதன் பொருள்
  choice: ஆசாரியக் குடும்பத்தைச் சேராதவன்
  alternative: அந்நியன்; வெளிநாட்டவன்; சாதாரணன்; ஆசாரியன் அல்லாதவன்
  rationale: லேவியராகமம் 22-ன் சூழல் பரிசுத்த உணவை உண்ணும் உரிமையை ஆசாரியக் குடும்பத்தோடு இணைக்கிறது. ஆகவே இன வேறுபாட்டைத் தேவையின்றி புகுத்தாமல், உரிமை வட்டத்திற்கு வெளியே இருப்பதையே மொழிபெயர்ப்பு காட்டுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் சட்டவிதியின் தெளிவும் காக்கப்பட்டுள்ளன. ‘ஆசாரியக் குடும்பத்தைச் சேராதவன்’ என்பது זָר என்பதன் சூழல்சார் பொருளைத் தெளிவாக்குகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
