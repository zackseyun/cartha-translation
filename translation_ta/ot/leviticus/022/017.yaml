lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பேசினார்
  rationale: דבר என்பதன் தொடர்கதை வினைவடிவம் ஒரு புதிய உரை நிகழ்வை அறிமுகப்படுத்துகிறது; வழக்கமான எபிரெயப் பேச்சுச் சூத்திரத்தை இயல்பான நவீன தமிழில் இது தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எழுத்துகளைக் கொண்ட இறைப்பெயரை ஒரு பட்டமாக மாற்றாமல், தமிழில் பரவலாகப் புரிந்துகொள்ளக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֶל
  choice: -இடம்
  rationale: பேச்சு யாரை நோக்கிச் சொல்லப்பட்டது என்பதைக் குறிக்கும் எபிரெய முன்னிடைச்சொல்லுக்கு இயல்பான தமிழ்ச் சமமான உருபு.
- source_word: מֹשֶׁה
  choice: மோசே
  rationale: தனிப்பெயர் தமிழின் நிலைபெற்ற வேதாகம வழக்கின்படி ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: לֵאמֹר
  choice: சொன்னார்
  rationale: அடுத்து வரும் நேரடிக் கூற்றை அறிமுகப்படுத்தும் எபிரெய இறந்தொழிற்பெயர் அமைப்பை, தமிழில் இயல்பான தொடர்வினைச் சூத்திரமாகத் தருகிறது.
theological_decisions:
- issue: இறைப்பெயரான יְהוָה-ஐ மொழிபெயர்த்தல்
  choice: யாவே
  alternative: யெகோவா
  rationale: மூலத்தில் இறைவனின் தனிப்பெயர் நேரடியாக உள்ளது. அதை ‘கர்த்தர்’ போன்ற பட்டத்தால் மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் தன்மையைப் பாதுகாக்கிறது; மாற்று மரபு ஒலிபெயர்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ். வசனத்தின் மரபான உரை அறிமுகச் சூத்திரம் இயல்பாகப் பாதுகாக்கப்பட்டுள்ளது; அடுத்த வசனத்தில் உரை தொடர்வதைச் சுட்ட இரட்டைப்புள்ளி பயன்படுத்தப்பட்டுள்ளது.
