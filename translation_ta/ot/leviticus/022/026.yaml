  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/026.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ta
  text: 'யாவே மோசேயிடம் பேசினார்[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரேயத்தில்: “YHWH”; மரபாக “கர்த்தர்” என்று மொழிபெயர்க்கப்படுகிறது.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பேசினார்
  rationale: דבר என்பதன் தொடர்கதை வடிவம் ஒரு புதிய உரையாடல் நிகழ்வை அறிமுகப்படுத்துகிறது; தெய்வீக உரைத் தொடக்கச் சூத்திரத்தில் “பேசினார்” என்பது இயல்பான, சற்றே முறைசார்ந்த தமிழ்.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எழுத்துகளைக் கொண்ட இறைப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், அதன் தனிப்பெயரைக் குறிக்கும் வழக்கமான தமிழ் ஒலிபெயர்ப்பாக “யாவே” பயன்படுத்தப்பட்டுள்ளது.
- source_word: אֶל
  choice: -இடம்
  rationale: பேச்சு யாரை நோக்கிச் சொல்லப்பட்டது என்பதைக் குறிக்கும் எபிரேய முன்னிடைச்சொல்லுக்கு இயல்பான தமிழ்ச் சொல்லுருபு.
- source_word: מֹשֶׁה
  choice: மோசே
  rationale: משה என்ற தனிப்பெயரின் தமிழில் நிலைபெற்ற வடிவம்.
- source_word: לֵאמֹר
  choice: பின்வரும் நேரடி உரையை அறிமுகப்படுத்தும் முக்காற்புள்ளி
  rationale: இந்த வினையெச்சம் அடுத்த வசனத்தில் வரும் நேரடி உரையை அறிமுகப்படுத்தும் சூத்திரம். தமிழில் “கூறியதாவது” எனச் சொற்பட மொழிபெயர்ப்பதைவிட முக்காற்புள்ளி இயல்பாக அதே பணியைச் செய்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரை ஒரு பட்டத்தை அல்ல, இறைவனின் தனிப்பெயரான יהוה என்பதை நேரடியாகப் பயன்படுத்துகிறது. எனவே தனிப்பெயரைத் தக்கவைக்கும் “யாவே” தேர்ந்தெடுக்கப்பட்டது; தமிழில் வழக்கமான பட்டமான “கர்த்தர்” அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. அடுத்த வசனத்தில் தொடரும் நேரடி உரையை இயல்பாக அறிமுகப்படுத்த முக்காற்புள்ளி பயன்படுத்தப்பட்டுள்ளது.
