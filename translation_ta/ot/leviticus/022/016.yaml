  source_fidelity: வரைவில் முந்தைய வசனத்திலிருந்து எதிர்மறைக் கட்டளைத் தொடரை எடுத்துக்கொள்வது நியாயமானது. ஆனால் ‘அவர்கள் தங்களுடைய பரிசுத்தப் பொருள்களைச் சாப்பிடுவதால்’ என்பது எபிரெயத்தில் உள்ள காரணவினை அமைப்பைத் தளர்த்தி, தடை விதிக்கப்படுகிறவர்களே சாப்பிடுவதாகக் காட்டுகிறது. மூலத்தில், முன்சூழலில் உள்ள செய்பவர்கள் மற்றவர்களை அவர்களுடைய பரிசுத்தப் பொருள்களை உண்ணுவதன் மூலம் குற்றப்பொறுப்பைச் சுமக்கும்படி செய்கிறார்கள்.
  naturalness: ‘அவர்களை … சுமக்கும்படி செய்யக்கூடாது’ என்ற அமைப்பு நவீன பொதுத்தமிழில் இயல்பாகவும், காரணவினை மற்றும் சுட்டுப்பெயர் வேறுபாட்டையும் தெளிவாகவும் வெளிப்படுத்தும். ‘சாப்பிடுவதன் மூலம்’ என்பது בְּ + infinitive-இன் வழிமுறை/சூழல் பொருளுக்கு ஏற்றது.
