base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/016.yaml
  text: and so cause them to bear guilt requiring restitution by eating their holy things[c][b][a], for I am Yahweh who sanctifies them.
translation:
  language: ta
  text: அவர்களுடைய பரிசுத்தப் பொருள்களை அவர்கள் சாப்பிடுவதன் மூலம், ஈடுசெய்ய வேண்டிய குற்றப்பொறுப்பை அவர்கள் சுமக்கும்படி செய்யக்கூடாது[a][b]. ஏனெனில், அவர்களைப் பரிசுத்தப்படுத்துகிற யாவே நானே[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவர்கள்மேல் குற்றப்பொறுப்பைக் கொண்டுவரக்கூடாது.’ எபிரெயச் சொற்றொடர் கடினமானது; குற்றத்துக்கான பொறுப்பை ஏற்படுத்துதலை இது வலியுறுத்தலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘அவர்களுடைய பரிசுத்தப் பொருள்கள்’ என்பது அர்ப்பணிக்கப்பட்ட பங்குகள் அல்லது காணிக்கைகளைக் குறிக்கிறது.
    reason: cultural_note
  - marker: c
    text: அல்லது, ‘அவர்களைப் பரிசுத்தமாக்குகிற’ அல்லது ‘அவர்களைப் பிரதிஷ்டை செய்கிற.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשִּׂיאוּ
  choice: சுமத்தக்கூடாது
  rationale: נשׂא என்பதன் ஹிஃபில் வடிவம் ஒருவர்மேல் ஒன்றைச் சுமத்துதல் அல்லது அவர் அதைச் சுமக்கும்படி செய்தல் என்ற காரணவினைப் பொருளைக் கொண்டுள்ளது. முந்தைய வசனத்தின் தடையோடு தொடர்வதால், தமிழில் எதிர்மறை கட்டளையாக இயல்பாக இணைக்கப்பட்டுள்ளது.
- source_word: אוֹתָם
  choice: அவர்கள்மேல்
  rationale: சூழலில் குற்றப்பழியைச் சுமக்க நேரிடும் மக்களைக் குறிக்கும் நேரடிச் சுட்டுப்பெயர்; தமிழ் வாக்கிய அமைப்புக்கு ஏற்ப ‘அவர்கள்மேல்’ என வழங்கப்பட்டுள்ளது.
- source_word: עֲוֺן אַשְׁמָה
  choice: ஈடுசெய்ய வேண்டிய குற்றப்பழி
  rationale: עָוֹן என்பது குற்றம்/குற்றப்பழியையும், אַשְׁמָה என்பது குற்றப்பொறுப்பு அல்லது ஈடுசெய்ய வேண்டிய குற்றத்தையும் குறிக்கிறது. இரண்டின் வழிபாட்டுச் சட்டப் பொருளையும் புரியத்தக்க தமிழில் இச்சொற்றொடர் வெளிப்படுத்துகிறது.
- source_word: בְּאָכְלָם
  choice: சாப்பிடுவதால்
  rationale: בְּ உடன் வரும் வினையெச்ச வடிவம் இங்கு காரணம் அல்லது வழிமுறையைக் குறிக்கிறது; ‘சாப்பிடுவதால்’ அந்தத் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: קָדְשֵׁיהֶם
  choice: தங்களுடைய பரிசுத்தப் பொருள்கள்
  rationale: எபிரெயச் சொற்றொடரின் நேர்ப்பொருள் ‘அவர்களுடைய பரிசுத்தமானவை’; லேவியராகமச் சூழலில் அர்ப்பணிக்கப்பட்ட பங்குகள் அல்லது காணிக்கைகளைக் குறித்தாலும், மூலத்தின் பொதுமையைக் காக்க ‘பரிசுத்தப் பொருள்கள்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது தேவனுடைய தனிப்பெயரான நான்கு எழுத்துப் பெயரின் தமிழ் ஒலிபெயர்ப்பு; ‘ஆண்டவர்’ என்ற பட்டத்தால் மாற்றப்படவில்லை.
- source_word: מְקַדְּשָׁם
  choice: அவர்களைப் பரிசுத்தப்படுத்துகிற
  rationale: קדשׁ என்பதன் பியேல் வினையெச்சம் ‘பரிசுத்தப்படுத்துதல்/அர்ப்பணித்தல்’ எனப் பொருள்படும். ‘பரிசுத்தப்படுத்துகிற’ என்பது லேவியராகமத்தின் வழிபாட்டு மற்றும் இறையியல் சொல்லாட்சியைத் தக்கவைக்கிறது.
theological_decisions:
- issue: இறுதி வாக்கியத்திலுள்ள ‘அவர்களை’ என்பதன் சுட்டுப்பொருள்
  choice: யாவே சூழலில் பேசப்படும் ஆசாரியர்களை அல்லது இஸ்ரவேலர்களைப் பரிசுத்தப்படுத்துகிறார்
  alternative: யாவே பரிசுத்தப் பொருள்களைப் பரிசுத்தப்படுத்துகிறார்
  rationale: எபிரெயப் பன்மை பின்னொட்டு சூழலில் பேசப்படும் மக்களைக் குறிப்பதே இயல்பானது. எனினும், எந்தக் குழுவைத் துல்லியமாகக் குறிக்கிறது என்பதை முதன்மை உரை விளக்கிச் சுருக்காமல், ‘அவர்களை’ என்ற மூலத்தின் சுட்டமைப்பை அப்படியே காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் லேவியராகமத்தின் வழிபாட்டுச் சட்டத் தொனியும் காக்கப்பட்டுள்ளன. ‘குற்றப்பழி’, ‘ஈடுசெய்ய’, ‘பரிசுத்தப்படுத்துகிற’ ஆகிய சொற்கள் சட்ட, வழிபாட்டு நுணுக்கங்களைச் சுமந்தாலும் சாதாரண வாசகருக்குப் புரியும் வகையில் அமைக்கப்பட்டுள்ளன. வசனம் முந்தைய தடையின் தொடர்ச்சியாக இருப்பதால் எதிர்மறை கட்டளைத் தொடர் தமிழில் இயல்பாக நிறைவு செய்யப்பட்டுள்ளது.
