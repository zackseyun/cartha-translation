lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பேசிச் சொன்னது
  rationale: דבר என்பதன் பேச்சை அறிமுகப்படுத்தும் வலிமையையும், தொடர்ந்து வரும் לֵאמֹר என்பதையும் இயல்பான தமிழில் ஒருங்கிணைக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: நான்கு எழுத்துகளைக் கொண்ட இறைப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட ஒலிபெயர்ப்பால் வழங்குகிறது; எபிரெய உச்சரிப்பு உறுதியற்றது என்பதை அடிக்குறிப்பு தெரிவிக்கிறது.
- source_word: אֶל מֹשֶׁה
  choice: மோசேயிடம்
  rationale: பேச்சு யாரை நோக்கிச் சொல்லப்பட்டது என்பதை நவீனத் தமிழில் இயல்பாகக் குறிக்கிறது.
- source_word: לֵאמֹר
  choice: சொன்னது
  rationale: அடுத்து வரும் உரையை அறிமுகப்படுத்தும் எபிரெய வாய்பாட்டைத் தமிழின் நேரடி உரை அறிமுக வடிவில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட இறைப் பெயர் இருப்பதால் அதை ‘கர்த்தர்’ என்ற பட்டமாக மாற்றவில்லை. அதன் பண்டைய சரியான உச்சரிப்பு உறுதியாகத் தெரியாததால் மாற்று ஒலிபெயர்ப்பை அடிக்குறிப்பில் தருகிறது.
translation_notes:
  register: நவீன, கண்ணியமான, பொதுவாசகருக்குப் புரியும் தமிழ். எபிரெய மொழியின் வழக்கமான பேச்சு அறிமுகத்தைச் சொற்சொல்லாகக் கடினப்படுத்தாமல், ‘பேசிச் சொன்னது’ என்ற இயல்பான வாய்பாட்டில் காக்கிறது.
