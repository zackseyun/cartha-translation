base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/023.yaml
  text: But an ox or a sheep that has a limb too long or too short—you may make it a freewill offering[a], but for a vow it will not be accepted.
translation:
  language: ta
  text: ஆனால், உறுப்பு ஒன்று அளவுக்கு அதிக நீளமோ குறைந்த நீளமோ உடைய காளையையோ ஆட்டையையோ மனமுவந்த காணிக்கையாகச் செலுத்தலாம்[a]; ஆனால், நேர்த்திக்கடனுக்காக அது ஏற்றுக்கொள்ளப்படாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, பொதுவாக, “உருக்குலைந்த அல்லது வளர்ச்சி குன்றிய.” எபிரெயச் சொற்கள் உடல் விகிதத்தில் காணப்படும் எதிரெதிரான இருவகை வேறுபாடுகளைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשׁוֹר
  choice: காளை
  rationale: שׁוֹר என்பது மாட்டின விலங்கைக் குறிக்கிறது; பலிச்சட்டத்தின் ஒருமைச் சூழலில் ‘காளை’ இயல்பான, தெளிவான மொழிபெயர்ப்பு.
- source_word: וָשֶׂה
  choice: ஆடு
  rationale: שֶׂה என்பது செம்மறியாடு அல்லது வெள்ளாடு ஆகிய மந்தை விலங்குகளில் ஒன்றைக் குறிக்கலாம். தமிழில் ‘ஆடு’ அதன் பொதுத்தன்மையை ஓரளவு காக்கிறது; வயதையும் இனவகையையும் தேவையின்றிக் குறிப்பதில்லை.
- source_word: שָׂרוּעַ וְקָלוּט
  choice: ஓர் உறுப்பின் நீளம் அளவுக்கு அதிகமாகவோ அளவுக்குக் குறைவாகவோ உள்ள
  rationale: இரு எபிரெயச் சொற்களும் எதிரெதிரான உடல் விகிதக் குறைபாடுகளைக் குறிக்க வாய்ப்புள்ளது. குறிப்பாக எந்த உறுப்பைக் குறிக்கின்றன என்பது உறுதியில்லாததால் ‘ஓர் உறுப்பு’ எனப் பொதுவாகவும், நீள வேறுபாட்டைத் தெளிவாகவும் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: נְדָבָה
  choice: மனமுவந்த காணிக்கை
  rationale: கட்டாய நேர்த்திக்கடனிலிருந்து வேறுபட்ட, ஒருவர் தாமாக முன்வந்து செலுத்தும் காணிக்கையை இயல்பான தமிழில் குறிக்கிறது.
- source_word: תַּעֲשֶׂה אֹתוֹ
  choice: செலுத்தலாம்
  rationale: சொல்லர்த்தம் ‘அதைச் செய்யலாம்/ஆக்கலாம்’ என்றாலும், பலி மற்றும் காணிக்கைச் சூழலில் ‘காணிக்கையாகச் செலுத்தலாம்’ என்பது இயல்பான தமிழும் சூழலுக்கேற்ற பொருளும் ஆகும்.
- source_word: וּלְנֵדֶר
  choice: ஆனால் நேர்த்திக்கடன் காணிக்கையாக
  rationale: נֵדֶר என்பது ஒருவர் செய்த நேர்த்தியால் ஏற்பட்ட கடமையைக் குறிக்கிறது; ‘நேர்த்திக்கடன் காணிக்கை’ அந்த வழிபாட்டுச் சூழலைத் தெளிவாக்குகிறது.
- source_word: לֹא יֵרָצֶה
  choice: அது ஏற்றுக்கொள்ளப்படாது
  rationale: பலிச்சூழலில் רצה என்பதன் நிபால் வடிவம் காணிக்கை சாதகமாக ஏற்றுக்கொள்ளப்படுவதைக் குறிக்கிறது; தமிழில் இவ்வாக்கியம் அந்த வழிபாட்டு ஏற்புடைமையைத் துல்லியமாகத் தருகிறது.
theological_decisions:
- issue: שָׂרוּעַ மற்றும் קָלוּט என்ற உடற்குறைச் சொற்களின் துல்லியமான பொருள்
  choice: ஓர் உறுப்பின் நீளம் அளவுக்கு அதிகமாகவோ அளவுக்குக் குறைவாகவோ உள்ள
  alternative: உருக்குலைந்த அல்லது வளர்ச்சி குன்றிய
  rationale: இவை எதிரெதிரான உடல் விகித வேறுபாடுகளைக் குறிப்பதாகத் தோன்றுவதால், அந்தக் குறிப்பான உருவகத்தை முதன்மை உரையில் காக்கப்பட்டுள்ளது. இருப்பினும் சொற்களின் துல்லியமான உடற்கூறு சார்ந்த பொருள் உறுதியற்றது என்பதால் விரிவான மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், வழிபாட்டுச் சட்டத்திற்கேற்ற கண்ணியமான ஆனால் சாதாரண வாசகர்களுக்கும் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘மனமுவந்த காணிக்கை’ மற்றும் ‘நேர்த்திக்கடன் காணிக்கை’ ஆகியவை இரு காணிக்கை வகைகளுக்கிடையிலான வேறுபாட்டைத் தெளிவாகக் காக்கின்றன.
