id: ECC.1.2
reference: Ecclesiastes 1:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: הֲבֵ֤ל הֲבָלִים֙ אָמַ֣ר קֹהֶ֔לֶת הֲבֵ֥ל הֲבָלִ֖ים הַ/כֹּ֥ל הָֽבֶל׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/002.yaml
  text: Breath of breaths[a], says Qoheleth[b]; breath of breaths, all is mere breath.
translation:
  language: ta
  text: 'மூச்சுகளின் மூச்சு[a] என்கிறார் கோஹெலெத்[b];

    மூச்சுகளின் மூச்சு—எல்லாமே வெறும் மூச்சுதான்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் הֶבֶל (ஹெவெல்) என்பதன் நேரடிப் பொருள் ‘மூச்சு’ அல்லது ‘நீராவி’. இந்நூலில் வரும் அதன் 38 பயன்பாடுகளிலும், மூச்சைப் போல உடனே மறையும் நிலையாமை, பிடிக்க முடியாத கைக்கெட்டாமை, எதிர்பார்த்ததற்கும் நிகழ்வதற்கும் இடையிலான முரண் ஆகிய தொடர்புடைய பொருள்களை அது ஒரே நேரத்தில் சுமக்கிறது. தமிழில் எந்த ஒரு கருத்தாக்கச் சொல்லும் இம்மூன்றையும் முழுமையாகக் கொண்டுவராது. ஆகவே இங்கு உருவகமே தக்கவைக்கப்படுகிறது. ‘மூச்சுகளின் மூச்சு’ என்பது ‘பாடல்களின் பாடல்’, ‘பரிசுத்தங்களின் பரிசுத்தம்’ போன்ற எபிரெய உச்சநிலைத் தொடர்.
    reason: lexical_choice
  - marker: b
    text: ‘கோஹெலெத்’ என்பது ‘போதகர்’, ‘பிரசங்கி’ அல்லது ‘ஆசிரியர்’ என்று மரபாக மொழிபெயர்க்கப்பட்டுள்ள எபிரெயப் பட்டப்பெயர் அல்லது பெயர். அவற்றில் ஒவ்வொன்றும் பொருள் வரம்பை வெவ்வேறு விதமாகக் குறுக்குவதால், இங்கு எபிரெய வடிவம் ஒலிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲבֵל / הָבֶל
  choice: மூச்சு / வெறும் மூச்சு
  rationale: எபிரெயச் சொல் நேரடியாக ‘மூச்சு’ அல்லது ‘ஆவி போல் மறையும் நீராவி’ என்பதைக் குறிக்கிறது. பிரசங்கி நூலில் அது நிலையாமை, கைக்கெட்டாமை, எதிர்பார்ப்புக்கும் நிகழ்வுக்கும் இடையிலான முரண் ஆகியவற்றை ஒரே உருவகத்தில் தாங்குகிறது. ‘வீண்’, ‘அர்த்தமற்றது’ போன்ற கருத்தாக்கச் சொற்கள் இந்தப் பன்முகத்தன்மையைச் சுருக்கிவிடும். இறுதிப் பயனிலைத் தொடரில் ‘வெறும்’ என்பது தீர்ப்பின் தாழ்த்தும் வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הֲבֵל הֲבָלִים
  choice: மூச்சுகளின் மூச்சு
  rationale: ‘பாடல்களின் பாடல்’, ‘பரிசுத்தங்களின் பரிசுத்தம்’ போன்ற எபிரெய உச்சநிலை அமைப்பைத் தமிழிலும் வடிவத்தோடு காக்கிறது; அதேவேளையில் மூலத்தின் உறுதியான ‘மூச்சு’ உருவகத்தையும் விடாமல் தக்கவைக்கிறது.
- source_word: אָמַר
  choice: என்கிறார்
  rationale: வடிவத்தில் இறந்தகால வினையாக இருந்தாலும், இத்தகைய இலக்கிய அறிவிப்புச் சூத்திரம் நிகழ்காலத் தீர்ப்பாகச் செயல்படுகிறது. ‘என்கிறார்’ என்பது நவீன தமிழில் இயல்பாகவும் உயிரோட்டமாகவும் உள்ளது.
- source_word: קֹהֶלֶת
  choice: கோஹெலெத்
  rationale: இச்சொல்லை ‘போதகர்’, ‘பிரசங்கி’, ‘ஆசிரியர்’ என்று மொழிபெயர்ப்பது அதன் பொருள் வரம்பை முன்கூட்டியே குறுக்கும். ஒலிபெயர்ப்பு மூலப் பட்டப்பெயர் அல்லது பெயரின் திறந்த தன்மையைப் பாதுகாக்கிறது.
- source_word: הַכֹּל
  choice: எல்லாமே
  rationale: மூலத்தின் அனைத்தையும் உள்ளடக்கும் வலியுறுத்தலை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: பிரசங்கி நூலை ஆளும் הֶבֶל உருவகத்தை எவ்வாறு மொழிபெயர்ப்பது
  choice: உச்சநிலை அமைப்பில் ‘மூச்சுகளின் மூச்சு’ என்றும், பயனிலைத் தீர்ப்பில் ‘வெறும் மூச்சு’ என்றும் உருவகத்தைத் தக்கவைத்தல்
  alternative: வீண்; மாயை; அர்த்தமற்றது; பயனற்றது; நிலையற்றது
  rationale: மூலச் சொல் நிலையாமை, கைக்கெட்டாமை, நிகழ்வுகளின் முரண்பாடு ஆகிய பல நிழற்பொருள்களை ஒன்றாக வைத்திருக்கிறது. ‘அர்த்தமற்றது’ என்பது நூல் வலியுறுத்தாத முழுமையான அர்த்தமின்மையைச் சேர்க்கக்கூடும்; ‘பயனற்றது’ இலக்கு தோல்வியை மட்டும் முன்னிறுத்தும்; ‘மாயை’ வேறு தத்துவ அல்லது சமயப் பொருள்களைத் தூண்டக்கூடும். ‘மூச்சு’ என்ற உறுதியான உருவகம் இந்த இறையியல் பதற்றத்தைத் தீர்த்துவிடாமல் பாதுகாக்கிறது.
translation_notes:
  register: நடை நவீன செந்தமிழும் பொதுமக்கள் எளிதில் புரிந்துகொள்ளும் இயல்பான தமிழும் சந்திக்கும் வகையில் அமைக்கப்பட்டுள்ளது. ‘மூச்சுகளின் மூச்சு’ அன்றாட வழக்கில் அரிதானதாக இருந்தாலும், மூலத்தின் கவிதைமிகு உச்சநிலை வடிவத்தையும் மைய உருவகத்தையும் நோக்கமுடன் பாதுகாக்கிறது. ‘எல்லாமே வெறும் மூச்சுதான்’ என்பது இறுதி தீர்ப்பின் வலிமையைத் தமிழில் இயல்பாக ஒலிக்கச் செய்கிறது.
