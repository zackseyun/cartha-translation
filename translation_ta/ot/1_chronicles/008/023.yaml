- source_word: וְ
  choice: பட்டியலின் இறுதியில் “ஆகியோரும்”
  rationale: எபிரெயத்தில் ஒவ்வொரு பெயருக்கும் முன் வரும் இணைப்புச் சொல்லைத் தமிழில் இயல்பாக ஒவ்வொரு முறையும் மீளுரைக்காமல், பட்டியலின் இறுதியில் “ஆகியோரும்” என்று தொகுத்து வழங்குகிறது; தொடர்ச்சிப் பட்டியல் அமைப்பும் காக்கப்படுகிறது.
- source_word: עַבְדּוֹן
  choice: அப்தோன்
  rationale: தனிப்பட்ட பெயர் என்பதால் மொழிபெயர்க்காமல், எபிரெய ஒலிப்புக்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: זִכְרִי
  choice: சிக்ரி
  rationale: எபிரெய மெய்யெழுத்துகளையும் உயிரொலியையும் பின்பற்றி ஒலிபெயர்க்கப்பட்ட தனிப்பட்ட பெயர்.
- source_word: חָנָן
  choice: ஆனான்
  rationale: எபிரெயச் சொல்லின் தொடக்க ח ஒலிக்குத் தமிழில் துல்லியமான இணை இல்லாததால், வாசிக்க இயல்பான “ஆனான்” என்ற ஒலிபெயர்ப்பு தேர்ந்தெடுக்கப்பட்டது.
