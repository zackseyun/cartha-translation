  text: These were heads of fathers’ houses according to their generations[a], chief men. These lived in Jerusalem.
translation:
  language: ta
  text: இவர்கள் தங்கள் தலைமுறைகளின்படி மூதாதையர் குடும்பங்களின் தலைவர்களாகிய தலைமைமிக்கவர்கள். இவர்கள் எருசலேமில் குடியிருந்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இவர்கள் தங்கள் தலைமுறைகளின்படி மூதாதையர் குடும்பங்களின் தலைவர்கள்—தலைவர்கள். இவர்கள் எருசலேமில் குடியிருந்தார்கள்.” எபிரெயத்தில் ‘தலைவர்’ என்பதற்கான ஒரே வேர் வலியுறுத்தலுக்காக மீண்டும் வருகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאשֵׁי אָבוֹת
  choice: மூதாதையர் குடும்பங்களின் தலைவர்கள்
  rationale: எபிரெயச் சொற்றொடர் குலம் அல்லது தந்தைவழிக் குடும்பப் பிரிவுகளின் தலைவர்களைக் குறிக்கும் மரபுத்தொடர். நவீன தமிழில் சமூக அமைப்பைத் தெளிவாகக் காட்ட இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: לְתֹלְדוֹתָם
  choice: தங்கள் தலைமுறைகளின்படி
  rationale: தலைமுறை அல்லது வம்சவழி என்ற முறையான பொருளைப் பேணுகிறது; எழுதப்பட்ட வம்சாவளிப் பதிவுகள் என்று மூலத்தைவிடக் கூடுதலாக விளக்கவில்லை.
- source_word: רָאשִׁים
  choice: முதன்மையானவர்கள்
  rationale: רֹאשׁ என்ற வேர் மீண்டும் வருவதால் தலைமை நிலையின்மீது வலியுறுத்தல் ஏற்படுகிறது. தமிழில் இயல்பில்லாத ஒரே சொல்லின் மறுபடியையும் தவிர்த்து அந்த வலியுறுத்தலைப் பேணுகிறது.
- source_word: יָשְׁבוּ
  choice: குடியிருந்தார்கள்
  rationale: இங்கு உட்கார்ந்தார்கள் என்பதல்ல, ஓர் இடத்தில் நிலையாக வாழ்ந்தார்கள் என்பதே பொருள்; வம்சவரலாற்றுச் சூழலுக்கு ‘குடியிருந்தார்கள்’ பொருத்தமானது.
- source_word: בִירוּשָׁלָם
  choice: எருசலேமில்
  rationale: இடப்பெயரையும் ‘இல்’ என்ற இடவெற்றுமையையும் நேரடியாகப் பேணும் வழக்கமான தமிழ் வடிவம்.
- source_word: אֵלֶּה ... אֵלֶּה
  choice: இவர்கள் ... இவர்கள்
  rationale: மூலத்தில் சுட்டுப்பெயர் இருமுறை வருவதால் உருவாகும் கட்டமைப்பு வலியுறுத்தலைத் தமிழிலும் பேணுகிறது.
