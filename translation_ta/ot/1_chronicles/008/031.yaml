lexical_decisions:
- source_word: וּגְדוֹר
  choice: கெதோரும்
  rationale: וּ என்ற இணைப்பைத் தமிழின் பட்டியல் நடைக்கு இயல்பான ‘-உம்’ விகுதியால் வெளிப்படுத்தி, גְדוֹר என்ற ஆட்பெயரை ‘கெதோர்’ என ஒலிபெயர்த்துள்ளது.
- source_word: וְאַחְיוֹ
  choice: அகியோவும்
  rationale: וְ என்ற இணைப்பை ‘-உம்’ விகுதியால் தக்கவைத்து, אַחְיוֹ என்ற ஆட்பெயரில் உள்ள எபிரெய ח ஒலியைத் தமிழில் அண்மையாக ‘க’ கொண்டு ‘அகியோ’ என ஒலிபெயர்த்துள்ளது.
- source_word: וָזָכֶר
  choice: சாகேரும்
  rationale: וָ என்ற இணைப்பை ‘-உம்’ விகுதியால் காட்டியுள்ளது. மசோரா உயிர்க்குறிகளின்படி זָכֶר என்பதன் முதல் உயிர் ‘ஆ’ என்பதால், பெயர் ‘சாகேர்’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
