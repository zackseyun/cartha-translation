  rationale: எபிரெய உச்சரிப்பை நேரடியாகப் பிரதிபலிக்கும் தமிழ் எழுத்துப்பெயர்ப்பு; சில மரபுகளில் காணப்படும் ‘ஹேபேர்’ என்பதைக் காட்டிலும் மூல வடிவத்துக்கு நெருக்கமானது.
- source_word: אֱלִיאֵל
  choice: எலியேல்
  rationale: இறைப்பெயர்க் கூறுகள் கொண்ட இந்தத் தனிப்பெயர், பொருள் மொழிபெயர்க்கப்படாமல் எபிரெய ஒலிப்பின்படி எழுத்துப்பெயர்க்கப்பட்டுள்ளது.
- source_word: וְ / וָ / וֶ
  choice: பட்டியலில் காற்புள்ளிகள்
  rationale: ஒவ்வொரு பெயருக்கும் முன் வரும் வாவ் இணைப்புச் சொல்; தமிழ்ப் பெயர்ப்பட்டியலில் தொடர்ச்சியான ‘மற்றும்’ என்பதற்குப் பதிலாகக் காற்புள்ளிகளால் இணைப்பது இயல்பான நடை.
