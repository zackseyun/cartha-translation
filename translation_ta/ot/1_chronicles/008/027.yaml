  source_fidelity: முதன்மை வாசகத்தில் בְּנֵי என்பதற்கு “மகன்கள்” என்பது துல்லியமானது; மூன்று ஆண் தனிப்பெயர்களுடன் வரும் இவ்வம்சாவளிச் சூழலில் இதுவே சிறந்த தேர்வு. ஆனால் יַעֲרֶשְׁיָה என்ற பெயரில் இறுதியிலுள்ள שְׁיָה ஒலிக்கூறு “ஷ்யா” எனத் தெளிவாக வர வேண்டும்; “யாரெஷியா” என்பது அந்த மெய்யிணைப்பைத் தளர்த்துகிறது. יְרֹחָם பெயரின் தொடக்க יְ ஒலியும் தமிழில் வெளிப்பட வேண்டும்.
  naturalness: “ஆகியோர் ... மகன்கள்” என்பது நவீன நிலையான தமிழில் சுருக்கமான வம்சாவளி நடைக்கு இயல்பாக உள்ளது. அடிக்குறிப்பு முதன்மை வாசகத்தைச் சுமையாக்காமல் மாற்றுப் பொருளைச் சுருக்கமாகக் கொடுக்கிறது.
