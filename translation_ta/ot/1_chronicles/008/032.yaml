base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/032.yaml
  text: Mikloth fathered Shimeah[a]. They too lived opposite their brothers in Jerusalem[b], with their brothers.
translation:
  language: ta
  text: மிக்லோத் சிமெயாவைப் பெற்றான். அவர்களும் தங்கள் சகோதரர்களுக்கு எதிரே[a], எருசலேமில் தங்கள் சகோதரர்களுடன்[b] குடியிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தங்கள் சகோதரர்களுக்கு அருகில்’. இதற்கான எபிரெயச் சொல் ஒருவருக்கு முன்பாக, எதிரே, அல்லது அருகில் உள்ள நிலையைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: இங்கு ‘சகோதரர்கள்’ என்பது உடன்பிறந்த சகோதரர்களை மட்டும் குறிக்காமல், பென்யமீன் வம்சத்தைச் சேர்ந்த ஒரே குலத்தார் அல்லது உறவினர்களையும் குறிக்கக்கூடும்.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִקְלוֹת
  choice: மிக்லோத்
  rationale: மִקְלוֹת என்ற ஆட்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டது. முந்தைய வம்சப்பட்டியல் தொடரிலேயே இணைப்பு தெளிவாக இருப்பதால், முன்னொட்டான וּ தனியே ‘மேலும்’ என்று மொழிபெயர்க்கப்படவில்லை.
- source_word: הוֹלִיד
  choice: பெற்றான்
  rationale: ஆண் வழி வம்சப்பட்டியலில் ‘ஒருவனுக்குத் தந்தையானான்/அவனைப் பெற்றான்’ என்பதைக் குறிக்கும் causative வினை. ‘பெற்றான்’ என்பது தமிழின் வேதாகம வம்சப்பட்டியல் நடையில் சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: אֶת שִׁמְאָה
  choice: சிமெயாவை
  rationale: אֶת என்பது நேரடி செயப்படுபொருள் குறியீடு; தமிழில் ‘-ஐ’ வேற்றுமை உருபால் வெளிப்படுத்தப்படுகிறது. שִׁמְאָה என்ற பெயர் ‘சிமெயா’ என ஒலிபெயர்க்கப்பட்டது.
- source_word: וְאַף הֵמָּה
  choice: அவர்களும்
  rationale: இந்தச் சொற்கூட்டு சேர்த்துக் கூறும் வலியுறுத்தலைக் கொண்டது. தமிழில் ‘அவர்களும்’ என்பது ‘அவர்களும்கூட’ என்ற பொருளை இயல்பாகத் தருகிறது.
- source_word: נֶגֶד
  choice: எதிரே
  rationale: இச்சொல் ‘முன்பாக/எதிரே’ என்ற இடவுறவைக் குறிக்கிறது. ‘எதிரே’ என்பது மூலத்தின் தெளிவான இடவியல் பொருளைப் பாதுகாக்கிறது; ‘அருகில்’ என்ற சாத்தியப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אֲחֵיהֶם
  choice: தங்கள் சகோதரர்கள்
  rationale: எபிரெயச் சொல் நேரடியாக ‘அவர்களுடைய சகோதரர்கள்’ என்று பொருள்படும். இவ்வம்சப்பட்டியல் சூழலில் அது ஒரே குலத்தைச் சேர்ந்த உறவினரையும் குறிக்கக்கூடும்; அந்த விரிவான பயன்பாடு அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: יָשְׁבוּ
  choice: குடியிருந்தார்கள்
  rationale: יָשַׁב என்பது இங்கு ஓர் இடத்தில் வசித்தல் அல்லது குடியிருத்தலைக் குறிக்கிறது. ‘குடியிருந்தார்கள்’ குடியிருப்பு பற்றிய இந்த அறிவிப்புக்கு இயல்பான நவீனத் தமிழ்.
- source_word: בִירוּשָׁלִַם
  choice: எருசலேமில்
  rationale: இடப்பெயர் வழக்கமான தமிழ்ப் பெயர்ப்பில் தரப்பட்டு, בְּ முன்னொட்டின் இடப்பொருள் ‘-இல்’ உருபால் வெளிப்படுத்தப்படுகிறது.
- source_word: עִם אֲחֵיהֶם
  choice: தங்கள் சகோதரர்களுடன்
  rationale: עִם என்பதன் நேரடிப் பொருள் ‘உடன்’. மூலத்தில் ‘சகோதரர்கள்’ மீண்டும் வருவது நீக்கப்படாமல் பாதுகாக்கப்பட்டுள்ளது.
