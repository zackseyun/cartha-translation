  naturalness: “யாக்கீம், சிக்ரி, சப்தி ஆகியோரும்.” என்பது நவீனத் தரத் தமிழில் வம்சவரலாற்றுப் பட்டியலுக்கு இயல்பான, சுருக்கமான நடை. இது முழுவாக்கியமாக அல்லாமல் பட்டியல்-தொடராக இருப்பதும் சூழலுக்கு ஏற்றது.
