translation_notes:
  register: நவீனத் தரத் தமிழ்; வம்சவரலாற்றுப் பட்டியலின் தொடர்ச்சியைச் சுருக்கமாகவும் கண்ணியமாகவும் காட்டும் நடை. மூலத்தில் ஒவ்வொரு பெயருக்கும் முன் உள்ள וְ தமிழில் சொற்சொல்லாக மீண்டும் மீண்டும் வராமல், இயல்பான ‘ஆகியோரும்’ என்ற பட்டியல் வடிவில் வழங்கப்பட்டது.
