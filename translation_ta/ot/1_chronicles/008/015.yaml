lexical_decisions:
- source_word: וּ/זְבַדְיָה
  choice: செபதியா
  rationale: எபிரெய முன்னொட்டு וּ பட்டியலின் தொடர்ச்சியைச் சுட்டுகிறது; முந்தைய வசனத்துடன் தொடரும் பெயர்ப்பட்டியலில் தமிழில் தனியாக ‘மற்றும்’ சேர்க்காமல் இயல்பாக வழங்கப்பட்டது. நபரின் பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: וַ/עֲרָד
  choice: ஆராத்
  rationale: நபரின் பெயர் எபிரெய உச்சரிப்பை அணுகும் வகையில் தமிழில் ஒலிபெயர்க்கப்பட்டது; இணைப்புச் சொல் பட்டியல் அமைப்பால் வெளிப்படுகிறது.
- source_word: וָ/עָדֶר
  choice: ஏதேர்
  rationale: எபிரெய உயிர்க்குறிகளின்படி பெயர் ‘ஏதேர்’ என ஒலிபெயர்க்கப்பட்டது. இறுதிப் பெயருக்கு முன் உள்ள இணைப்பைத் தமிழில் கட்டாயமாக மீண்டும் இடாமல், இயல்பான பெயர்ப்பட்டியலாக வழங்கப்பட்டது.
