  text: וּ/מֵ/חֻשִׁ֛ים הוֹלִ֥יד אֶת אֲבִיט֖וּב וְ/אֶת אֶלְפָּֽעַל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/011.yaml
  text: And by Hushim he fathered Abitub and Elpaal[a].
translation:
  language: ta
  text: ஹுஷீமினால் அவன் அபித்தூபையும் எல்பாலையும் பெற்றான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஹுஷீமிடமிருந்து.” எபிரெய முன்னொட்டை இவ்வாறு இன்னும் சொல்லுக்குச் சொல்லாக மொழிபெயர்க்கலாம்; வம்சவரலாற்றுச் சூழலில் “ஹுஷீமினால்” என்பது அவள் வழியாகப் பிறந்ததைக் காட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מֵ/חֻשִׁים
  choice: உசீம் மூலம்
  rationale: מִן என்னும் முன்னொட்டு மூலத்தை அல்லது உறவைச் சுட்டுகிறது. இவ்வம்சவரலாற்றுச் சூழலில், உசீம் வழியாக இப்பிள்ளைகள் பிறந்தார்கள் என்பதை இயல்பான தமிழில் தெரிவிக்க ‘மூலம்’ பயன்படுத்தப்பட்டுள்ளது; וּ இணைப்பின் தொடர்ச்சி தமிழ் வாக்கிய ஓட்டத்தில் தனியே மொழிபெயர்க்கப்படவில்லை.
- source_word: הוֹלִיד
  choice: அவன் ... பெற்றான்
  rationale: ילד என்பதன் ஹிஃபில் வடிவம் வம்சவரலாறுகளில் ‘பிள்ளைகளைப் பெறுதல்/தந்தையாகுதல்’ என்று பொருள்படும். ‘பெற்றான்’ என்பது நவீன தமிழில் இயல்பாகவும் ஆண் மரபுத் தொடர்பைச் சூழலால் தெளிவாகவும் காட்டுகிறது.
- source_word: אֶת
  choice: '[தனியாக மொழிபெயர்க்கப்படவில்லை]'
  rationale: இது நேரடிச் செயப்படுபொருளைக் குறிக்கும் எபிரெய இலக்கணக் குறி; தமிழில் தனிச்சொல் இணை இல்லை.
- source_word: אֲבִיטוּב
  choice: அபித்தூப்
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் நெருக்கமாக எழுத்துப்பெயர்த்த வடிவம்.
- source_word: וְ/אֶת
  choice: -ஐயும்
  rationale: וְ இணைப்பு ‘-உம்’ மூலம் தரப்பட்டுள்ளது; אֶת குறிக்கும் நேரடிச் செயப்படுபொருள் வேற்றுமை ‘-ஐ’ மூலம் இயல்பாக வெளிப்படுகிறது.
- source_word: אֶלְפָּעַל
  choice: எல்பால்
  rationale: எபிரெய தனிப்பெயரின் ஒலியை வாசிக்க எளிய தமிழில் எழுத்துப்பெயர்த்த வடிவம்.
