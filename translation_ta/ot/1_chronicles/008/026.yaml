lexical_decisions:
- source_word: שַׁמְשְׁרַי
  choice: சம்சிராய்
  rationale: வம்சவரலாற்றுப் பட்டியலில் வரும் தனிப்பட்ட பெயர் என்பதால் பொருள்பெயர்க்காமல் எபிரெய ஒலிவடிவத்தைத் தமிழில் இயல்பாக ஒலிபெயர்த்துள்ளது.
- source_word: שְׁחַרְיָה
  choice: செகரியா
  rationale: தனிப்பட்ட பெயரை எபிரெய வடிவத்தின் அடிப்படையில் ஒலிபெயர்த்துள்ளது; இறுதியிலுள்ள -யா கூறையும் தமிழில் வாசிக்க இயல்பான மரபுவடிவத்தையும் பேணுகிறது.
- source_word: עֲתַלְיָה
  choice: அத்தலியா
  rationale: தனிப்பட்ட பெயரை மொழிபெயர்க்காமல் எபிரெய ஒலியமைப்புக்கு நெருக்கமாகத் தமிழில் வழங்குகிறது.
- source_word: וְ / וּ / וַ
  choice: -உம்
  rationale: பெயர்களைப் பட்டியலாக இணைக்கும் எபிரெய வாவ் இணைப்பை, தமிழில் இயல்பான இணைப்பிடைச்சொல்லான ‘-உம்’ மூலம் ஒவ்வொரு பெயரிலும் வெளிப்படுத்துகிறது.
