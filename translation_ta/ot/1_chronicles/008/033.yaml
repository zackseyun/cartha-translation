source:
  edition: WLC
  text: וְ/נֵר֙ הוֹלִ֣יד אֶת קִ֔ישׁ וְ/קִ֖ישׁ הוֹלִ֣יד אֶת שָׁא֑וּל וְ/שָׁא֗וּל הוֹלִ֤יד אֶת יְהֽוֹנָתָן֙ וְ/אֶת מַלְכִּי שׁ֔וּעַ וְ/אֶת אֲבִֽינָדָ֖ב וְ/אֶת אֶשְׁבָּֽעַל־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/033.yaml
  text: Ner fathered Kish[a], and Kish fathered Saul, and Saul fathered Jonathan, Malchi-shua, Abinadab, and Eshbaal.
translation:
  language: ta
  text: நேர் கீசைப் பெற்றான்; கீஸ் சவுலைப் பெற்றான்; சவுல் யோனத்தான், மல்கிசூவா, அபினதாப், எஷ்பால்[a] ஆகியோரைப் பெற்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எஷ்பால் 2 சாமுவேலில் இஸ்போசேத் என்று அழைக்கப்படுகிறார்.
    reason: சாமுவேலில் காணப்படும் மாற்றுப் பெயர் வடிவத்தை வாசகர் அடையாளம் காண உதவுகிறது.
lexical_decisions:
- source_word: הוֹלִיד
  choice: பெற்றான்
  rationale: வம்சப்பட்டியல் சூழலில் ஆண் வழிப் பிறப்பை நேரடியாகக் குறிக்கும் எபிரெய வினையின் பொருளை இயல்பான, சுருக்கமான நவீனத் தமிழில் தருகிறது.
- source_word: נֵר
  choice: நேர்
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் எழுத்துப்பெயர்த்த வடிவம்.
- source_word: קִישׁ
  choice: கீஸ்
  rationale: எபிரெய தனிப்பெயரின் நீண்ட உயிரையும் இறுதி மெய்யொலியையும் பிரதிபலிக்கும் தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: שָׁאוּל
  choice: சவுல்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் பெயர் வடிவம்.
- source_word: יְהוֹנָתָן
  choice: யோனத்தான்
  rationale: சவுலின் மகனைக் குறிக்கும் பரவலாக அறியப்பட்ட தமிழ் பெயர் வடிவம்; இங்கு வரும் நீளமான எபிரெய வடிவத்தின் அதே நபர் அடையாளத்தைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: מַלְכִּי שׁוּעַ
  choice: மல்கிசூவா
  rationale: இரு கூறுகளைக் கொண்ட எபிரெய தனிப்பெயரை இயல்பான தமிழ் ஒலிப்பெயர்ப்பில் தருகிறது.
- source_word: אֲבִינָדָב
  choice: அபினதாப்
  rationale: எபிரெய தனிப்பெயரின் மரபான தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: אֶשְׁבָּעַל
  choice: எஷ்பாகால்
  rationale: நாளாகமத்தின் எபிரெய மூலத்தில் உள்ள பெயரையே நேரடியாக எழுத்துப்பெயர்க்கிறது; சாமுவேலில் காணப்படும் வேறு பெயர் வடிவத்துடன் முதன்மை உரையை ஒத்திசைக்கவில்லை.
theological_decisions:
- issue: சவுலின் கடைசி மகனுடைய பெயர் வடிவம்
  choice: முதன்மை உரையில் எஷ்பாகால்
  alternative: இஸ்போசேத்
  rationale: நாளாகமத்தின் எபிரெய உரை אֶשְׁבָּעַל என்று வெளிப்படையாகக் கூறுகிறது. ஆகவே அந்த மூல வடிவம் முதன்மை உரையில் பாதுகாக்கப்பட்டு, சாமுவேலில் அறியப்படும் மாற்றுப் பெயர் வாசகர் உதவிக்காக அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன, கண்ணியமான, எளிதில் புரியும் தமிழ். வம்சப்பட்டியலின் தொடர்ச்சியான அமைப்பு அரைப்புள்ளிகளால் தெளிவாக்கப்பட்டுள்ளது; பெயர்கள் மொழிபெயர்க்கப்படாமல் எபிரெய ஒலிக்கு ஏற்ப எழுத்துப்பெயர்க்கப்பட்டுள்ளன.
