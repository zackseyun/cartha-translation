translation_notes:
  register: நவீனத் தரத் தமிழில், வம்சவரலாற்றுப் பெயர்ப்பட்டியலுக்கேற்ற சுருக்கமானதும் கண்ணியமானதுமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயில் ஒவ்வொரு பெயருக்கும் முன் வரும் இணைப்புகள் தமிழில் செயற்கையாக மீளாமல், பட்டியலின் இறுதியில் ‘ஆகியோரும்’ என ஒருங்கிணைக்கப்பட்டுள்ளன.
