translation:
  language: ta
  text: அபிசூவா, நாமான், அகோவா ஆகியோரும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַ/אֲבִישׁוּעַ
  choice: அபிசூவா
  rationale: வம்சவரலாற்றுப் பட்டியலில் வரும் ஆள்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது; முன்னொட்டு וַ தொடர்ச்சியான இணைப்பைக் குறிக்கிறது, அது தமிழ்ப் பட்டியல் அமைப்பில் இறுதியிலுள்ள ‘ஆகியோரும்’ என்பதில் இயல்பாக வெளிப்படுகிறது.
- source_word: וְ/נַעֲמָן
  choice: நாமான்
  rationale: எபிரெய ஆள்பெயர் נַעֲמָן அதன் ஒலியை நெருங்கும் வகையில் ‘நாமான்’ என்று ஒலிபெயர்க்கப்பட்டுள்ளது; இணைப்புச்சொல் தனித்தனியாக மீண்டும் இடப்படாமல் தமிழ்ப் பட்டியல் நடையில் கையாளப்பட்டுள்ளது.
- source_word: וַ/אֲחוֹחַ
  choice: அகோவா
  rationale: אֲחוֹחַ என்ற ஆள்பெயர் எபிரெய உச்சரிப்பை நெருங்கும் வகையில் ‘அகோவா’ என்று ஒலிபெயர்க்கப்பட்டுள்ளது. இறுதி இணைப்பு, முந்தைய வசனத்திலிருந்து தொடரும் பட்டியலைக் காட்டும் ‘ஆகியோரும்’ என்பதால் வெளிப்படுத்தப்பட்டுள்ளது.
