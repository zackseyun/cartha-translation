translation:
  language: ta
  text: எலியேனாய், சில்லெதாய், எலியேல் ஆகியோரும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וֶ/אֱלִיעֵנַי
  choice: எலியேனாய்
  rationale: இணைப்பிடைச்சொல் வாவ், பெயர்ப்பட்டியலின் தொடர்ச்சியைத் தமிழில் இயல்பாகக் காட்ட இறுதியிலுள்ள “ஆகியோரும்” என்பதில் வெளிப்படுத்தப்பட்டுள்ளது. אֱלִיעֵנַי என்ற ஆள்பெயர் அதன் எபிரெய ஒலிப்பை அணுகும் வகையில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְ/צִלְּתַי
  choice: சில்லெத்தாய்
  rationale: צִלְּתַי என்ற ஆள்பெயர், லாமேத் மெய்யின் இரட்டிப்பையும் இறுதி -தை ஒலியையும் சாத்தியமான அளவு பிரதிபலிக்கும் வகையில் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது; இணைப்பிடைச்சொல் வாவ் இறுதி ஒருங்கிணைப்புச் சொல்லில் அடங்கியுள்ளது.
- source_word: וֶ/אֱלִיאֵל
  choice: எலியேல்
  rationale: אֱלִיאֵל என்ற ஆள்பெயர் மொழிபெயர்க்கப்படாமல் எபிரெய உச்சரிப்புக்கு அருகில் ஒலிபெயர்க்கப்பட்டுள்ளது. இதற்கு முன்னுள்ள வாவ், பட்டியலின் தொடர்ச்சியைக் குறிக்கும் “ஆகியோரும்” என்பதால் இயல்பாக வெளிப்படுகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், வம்சவரலாற்றுப் பெயர்ப்பட்டியலுக்கு ஏற்ற சுருக்கமான, கண்ணியமான நடை. மூன்று பெயர்களுக்கும் தனித்தனியாக “மற்றும்” சேர்ப்பதைவிட, இறுதியில் “ஆகியோரும்” என அமைப்பது எபிரெய இணைப்புகளின் கூட்டுப் பொருளை இயல்பான தமிழில் தருகிறது.
