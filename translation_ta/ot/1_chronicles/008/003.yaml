lexical_decisions:
- source_word: וַיִּהְיוּ בָנִים לְבָלַע
  choice: பேலாவுக்கு மகன்கள் இருந்தார்கள்
  rationale: எபிரேய மொழியில் ‘பேலாவுக்கு மகன்கள் இருந்தார்கள்’ என்ற மரபுவழிப் பட்டியல் அமைப்பை இயல்பான நவீனத் தமிழில் வழங்குகிறது; ‘மகன்கள்’ என்பது בָנִים என்பதன் பாலினத்தையும் பட்டியலின் உடனடிச் சூழலையும் துல்லியமாகக் காக்கிறது.
- source_word: אַדָּר
  choice: அத்தார்
  rationale: எபிரேய தனிப்பெயரின் ஒலியையும் דּ எழுத்தின் இரட்டிப்பையும் தமிழில் அண்மையாகக் காட்டும் ஒலிபெயர்ப்பு.
- source_word: וְגֵרָא
  choice: கேரா
  rationale: இணைப்புச் சொல்லான וְ தமிழில் பட்டியல் நிறுத்தக்குறியால் இயல்பாக வெளிப்படுகிறது; தனிப்பெயர் எபிரேய ஒலிக்கு அண்மையாக ஒலிபெயர்க்கப்படுகிறது.
- source_word: וַאֲבִיהוּד
  choice: அபிகூத்
  rationale: தனிப்பெயரை எபிரேய உச்சரிப்புக்கு அண்மையாகத் தமிழில் ஒலிபெயர்க்கிறது; தொடக்க וַ பட்டியலின் இறுதி இணைப்பாக நிறுத்தக்குறியால் வெளிப்படுகிறது.
