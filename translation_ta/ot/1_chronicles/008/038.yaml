base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/038.yaml
  text: 'Azel had six sons[a], and these were their names: Azrikam his firstborn, Ishmael, Sheariah, Obadiah, and Hanan. All these were the sons of Azel.'
translation:
  language: ta
  text: 'ஆசேலுக்கு ஆறு மகன்கள் இருந்தார்கள்[a]. அவர்களுடைய பெயர்கள் இவை: அஸ்ரிக்காம், அவனுடைய முதற்பேறானவன், இஸ்மவேல், ஷெயரியா, ஒபதியா, ஹானான்[b]. இவர்கள் அனைவரும் ஆசேலின் மகன்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல் மொழிபெயர்த்தால், “ஆசேலுக்கு ஆறு மகன்கள்.” இது எபிரெய மொழியில் வம்சவரலாற்று உடைமையைக் குறிக்கும் சொற்றொடர்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெய உரை “ஆறு மகன்கள்” என்று கூறினாலும், இங்கு ஐந்து பெயர்களை மட்டுமே பட்டியலிடுகிறது.
    reason: textual_tension
lexical_decisions:
- source_word: וּלְאָצֵל
  choice: ஆசேலுக்கு ... இருந்தார்கள்
  rationale: לְ உடன் வரும் எபிரெய வம்சவரலாற்று உடைமைச் சொற்றொடரை, அதன் பொருளையும் தமிழின் இயல்பான அமைப்பையும் காக்கும் வகையில் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: שִׁשָּׁה בָנִים
  choice: ஆறு மகன்கள்
  rationale: இந்த வம்சவரலாற்றுச் சூழலில் בָנִים ஆண் சந்ததியினரைக் குறிப்பதால் ‘மகன்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: וְאֵלֶּה שְׁמוֹתָם
  choice: அவர்களுடைய பெயர்கள்
  rationale: שְׁמוֹתָם என்பதிலுள்ள மூன்றாம் நபர் ஆண்பால் பன்மை பின்னொட்டைத் தெளிவாகப் பிரதிபலிக்கிறது.
- source_word: עַזְרִיקָם בֹּכְרוּ
  choice: அவனுடைய முதற்பேறான அஸ்ரிக்காம்
  rationale: בֹּכְרוּ அஸ்ரிக்காமை ஆசேலின் முதற்பேறாக அடையாளப்படுத்தும் இணைப்புச் சொல்லாக உள்ளது; தமிழில் உறவு தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்தப்பட்டது.
- source_word: יִשְׁמָעֵאל
  choice: இஸ்மவேல்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்பட்ட பெயர்வடிவம் பயன்படுத்தப்பட்டது.
- source_word: שְׁעַרְיָה
  choice: ஷெயரியா
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் நெருக்கமாகப் பெயர்த்தெழுதுகிறது.
- source_word: עֹבַדְיָה
  choice: ஒபதியா
  rationale: எபிரெய தனிப்பெயர் தமிழில் ஒலிப்பெயர்க்கப்பட்டது.
- source_word: חָנָן
  choice: ஆனான்
  rationale: தொடக்க எபிரெய ח ஒலியைத் தமிழ் வாசிப்புக்கு ஏற்ற மரபுவழி பெயர்வடிவத்தில் வழங்குகிறது.
- source_word: כָּל אֵלֶּה בְּנֵי אָצַל
  choice: இவர்கள் அனைவரும் ஆசேலின் மகன்கள்
  rationale: வசனத்தின் வம்சவரலாற்றுச் சுருக்கத்தைச் சுருக்கமாகவும் இயல்பான தமிழிலும் பிரதிபலிக்கிறது.
