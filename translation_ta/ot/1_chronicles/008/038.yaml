translation_notes:
  register: நவீனத் தரத் தமிழில், வம்சவரலாற்றுப் பதிவுக்கேற்ற சுருக்கமான மற்றும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. மூலத்தில் உள்ள ‘ஆறு’ என்ற எண்ணுக்கும் பட்டியலிடப்பட்ட ஐந்து பெயர்களுக்கும் இடையிலான பதற்றம் திருத்தப்படாமல் பாதுகாக்கப்பட்டு அடிக்குறிப்பில் சுட்டப்பட்டுள்ளது.
