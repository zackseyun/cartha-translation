translation_notes:
  register: நவீனத் தரத் தமிழில், வம்சவரலாற்றுக்கேற்ற சுருக்கமும் கண்ணியமும் பேணப்பட்டுள்ளன. ‘மோவாபின் வெளியில்/பிரதேசத்தில்’ என்ற சொற்சொல் மாற்றுகளுக்குப் பதிலாக இயல்பான ‘மோவாப் நாட்டில்’ பயன்படுத்தப்பட்டது. காலத் தொடரின் சற்றுக் கடினமான எபிரெய அமைப்பு இரண்டு தமிழ் கூறுகளாகத் தெளிவாக்கப்பட்டது.
