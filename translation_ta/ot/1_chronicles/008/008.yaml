source:
  edition: WLC
  text: וְ/שַׁחֲרַ֗יִם הוֹלִיד֙ בִּ/שְׂדֵ֣ה מוֹאָ֔ב מִן שִׁלְח֖/וֹ אֹתָ֑/ם חוּשִׁ֥ים וְ/אֶֽת בַּעֲרָ֖א נָשָֽׁי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/008.yaml
  text: And Shaharaim fathered children in the country of Moab after he sent away Hushim and Baara[b][a], his wives.
translation:
  language: ta
  text: தன் மனைவிகளான ஹூஷீமையும் பாராவையும் அனுப்பிவிட்ட பின்பு, ஷஹராயீம் மோவாப் நாட்டில் பிள்ளைகளுக்குத் தந்தையானான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அனுப்பிவிட்ட பின்பு” என்பது எபிரெயத்தில் சொற்சொல்லாக “அவன் அவர்களை அனுப்பிவிட்டதிலிருந்து” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/שַׁחֲרַיִם
  choice: சகராயிம்
  rationale: வம்சவரலாற்றுத் தொடர்ச்சியைத் தமிழில் இயல்பாக வெளிப்படுத்த பெயர் நேரடியாகத் தொடக்கத்தில் வைக்கப்பட்டது; எபிரெய தனிப்பெயர் ஒலிபெயர்க்கப்பட்டது.
- source_word: הוֹלִיד
  choice: பிள்ளைகளைப் பெற்றான்
  rationale: வம்சவரலாற்றுச் சூழலில் Hiphil வடிவம் ‘தந்தையானான்/பிள்ளைகளைப் பெற்றான்’ எனப் பொருள்படும். அடுத்த வசனத்தில் பெயர்கள் வருவதால் இங்கு குறிப்பிடப்படாத பிள்ளைகளின் விவரங்கள் சேர்க்கப்படவில்லை.
- source_word: בִּ/שְׂדֵה מוֹאָב
  choice: மோவாப் நாட்டில்
  rationale: שָׂדֶה என்பதன் அடிப்படைப் பொருள் ‘வெளி/வயல்’; இப்புவியியல் தொடரில் அது ‘நாடு/பிரதேசம்’ எனப் பொருள்படுகிறது. இயல்பான தமிழுக்காக ‘நாட்டில்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: מִן שִׁלְח/וֹ אֹתָם
  choice: இது அவன் ... அனுப்பிவிட்ட பின்பு நடந்தது
  rationale: מִן + infinitive construct இங்கு காலச் சூழலை, ‘அனுப்பிய பின்பு’ என்பதைச் சுட்டுகிறது. எபிரெய வாக்கியத்தின் தொடர்பைத் தெளிவான தமிழில் வைத்திருக்க வாக்கியப் பிரிப்பு பயன்படுத்தப்பட்டது.
- source_word: חוּשִׁים וְ/אֶת בַּעֲרָא
  choice: ஊசீமையும் பாராவையும்
  rationale: இவை இரண்டும் தனிப்பெயர்களாக ஒலிபெயர்க்கப்பட்டு, நேர்ச்செயப்படுபொருள் உறவு தமிழ் வேற்றுமை உருபால் காட்டப்பட்டது.
- source_word: נָשָׁיו
  choice: தன் மனைவிகளான
  rationale: சூழலில் אִשָּׁה என்பதன் பன்மை ‘மனைவிகள்’ என்று தெளிவாகப் பொருள்படுகிறது; பெயர்களுடனான விளக்க உறவு ‘மனைவிகளான’ என இயல்பாகக் காட்டப்பட்டது.
