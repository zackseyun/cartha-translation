translation_notes:
  register: நவீனத் தரத் தமிழில், வம்சவரலாற்றுப் பட்டியலுக்கு ஏற்ற சுருக்கமானதும் கண்ணியமானதும் இயல்பானதுமான நடை. ‘ஆகியோர்’ மூன்று பெயர்களையும் ஒரே உறவுக் குறிப்புடன் தெளிவாக இணைக்கிறது.
