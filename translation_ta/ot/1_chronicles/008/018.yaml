  text: Ishmerai[a], Izliah[b], and Jobab were the sons of Elpaal.
translation:
  language: ta
  text: யிஷ்மெராய், யிஸ்லியா, யோபாப் ஆகியோர் எல்பாலின் மகன்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִשְׁמְרַי
  choice: யிஷ்மெராய்
  rationale: எபிரெய தனிப்பெயரின் தொடக்க யோத் ஒலியையும் மெய்யெழுத்து அமைப்பையும் இயன்றவரை காக்கும் தமிழ் ஒலிபெயர்ப்பு.
- source_word: יִזְלִיאָה
  choice: யிஸ்லியா
  rationale: எபிரெய தனிப்பெயர் மொழிபெயர்க்கப்படாமல், அதன் தொடக்க யோத் உட்படத் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: יוֹבָב
  choice: யோபாப்
  rationale: எபிரெய தனிப்பெயரின் ஒலியமைப்பைப் பின்பற்றும் இயல்பான தமிழ் ஒலிபெயர்ப்பு.
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: இது ‘மகன்’ என்பதன் பன்மை இணைப்பு வடிவம். தமிழ் பெயர்ச் சொல் வாக்கியத்தில் தனி வினைச்சொல் தேவையில்லாததால் ‘இருந்தார்கள்’ போன்ற சொல் சேர்க்கப்படவில்லை.
- source_word: אֶלְפָּעַל
  choice: எல்பால்
  rationale: தனிப்பெயர் வாசிக்க எளிய நவீன தமிழ் வடிவில் ஒலிபெயர்க்கப்பட்டுள்ளது; இறுதிக்கு முந்திய ஆயின் தனியே குறிக்கப்படவில்லை.
