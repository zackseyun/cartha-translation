translation_notes:
  register: நவீன நிலையான தமிழ்; வம்சவரலாற்றுப் பின்னணிக்கேற்ற கண்ணியமான, தெளிவான நடை. இடப்பெயர்கள் தமிழ் வேதாகமப் பயன்பாட்டோடு இயைந்த ஒலிபெயர்ப்பில் தரப்பட்டுள்ளன. எபிரெயத்தின் வலியுறுத்தல் ‘இவர்களே’ என்பதால் பாதுகாக்கப்பட்டுள்ளது.
