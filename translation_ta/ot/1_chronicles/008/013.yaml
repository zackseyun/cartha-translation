source:
  edition: WLC
  text: וּ/בְרִעָ֣ה וָ/שֶׁ֔מַע הֵ֚מָּה רָאשֵׁ֣י הָ/אָב֔וֹת לְ/יוֹשְׁבֵ֖י אַיָּל֑וֹן הֵ֥מָּה הִבְרִ֖יחוּ אֶת י֥וֹשְׁבֵי גַֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/013.yaml
  text: And Beriah and Shema—they were heads of fathers’ houses among the inhabitants of Aijalon[b][a]; they were the ones who drove out the inhabitants of Gath.
translation:
  language: ta
  text: பெரியாவும் சேமாவும் அய்யாலோனில் குடியிருந்தவர்களிடையே தந்தைவழிக் குடும்பத் தலைவர்களாக இருந்தார்கள்.[a] காத் நகரில் குடியிருந்தவர்களைத் துரத்தியவர்கள் இவர்களே.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “தந்தையர் வீடுகளின் தலைவர்கள்”; இது தந்தைவழிக் குலங்கள் அல்லது விரிவான குடும்பங்களின் தலைவர்களைக் குறிக்கும் மரபுவழிச் சொற்றொடர்.
    reason: cultural_note
  - marker: b
    text: “துரத்தினர்” என்பதற்கு “தப்பியோடச் செய்தனர்” என்றும் மொழிபெயர்க்கலாம். எபிரெய வினை அவர்கள் காத் நகரவாசிகளை ஓடச் செய்ததை வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְרִעָה וָשֶׁמַע
  choice: பெரியாவும் சேமாவும்
  rationale: எபிரெய தனிப்பெயர்கள் நவீனத் தமிழில் இயல்பாக ஒலிபெயர்க்கப்பட்டுள்ளன; இணைப்புச் சொற்கள் ‘-வும் ... -வும்’ அமைப்பில் தரப்பட்டுள்ளன.
- source_word: הֵמָּה רָאשֵׁי הָאָבוֹת
  choice: தந்தைவழிக் குடும்பங்களுக்குத் தலைவர்களாக இருந்தார்கள்
  rationale: ‘தந்தையர்/மூதாதையர் வீடுகளின் தலைவர்கள்’ என்ற எபிரெயக் குலமரபு சார்ந்த பதவியைப் புரியக்கூடிய தமிழில் தருகிறது; தனிப்பிரதிப்பெயரின் வலியுறுத்தல் வாக்கிய அமைப்பில் இயல்பாக வெளிப்படுகிறது.
- source_word: לְיוֹשְׁבֵי אַיָּלוֹן
  choice: அய்யாலோனில் குடியிருந்தவர்களின்
  rationale: לְ என்பதன் உறவை இங்கு அய்யாலோன் மக்களிடையே அல்லது அவர்களுக்குரிய குலத் தலைமையாகப் புரிந்து, தமிழில் இயல்பான உரிமைத் தொடர்பால் வெளிப்படுத்துகிறது.
- source_word: הֵמָּה הִבְרִיחוּ
  choice: துரத்தியவர்கள் இவர்களே
  rationale: இரண்டாவது הֵמָּה தரும் வலியுறுத்தலை ‘இவர்களே’ தெளிவாகக் காட்டுகிறது; Hiphil வினையின் காரணவினைப் பொருள் ‘துரத்தினர்’ என்பதில் நிலைக்கிறது.
- source_word: אֶת יֹשְׁבֵי גַת
  choice: காத் நகரில் குடியிருந்தவர்களை
  rationale: இடப்பெயரை ஒலிபெயர்த்து, יֹשְׁבֵי என்பதற்கு முன் வந்த அதே கருத்தைத் தமிழில் இயல்பாகத் தருகிறது.
