- from: பெரியாவும் சேமாவும் அய்யாலோனில் குடியிருந்தவர்களின் தந்தைவழிக் குடும்பங்களுக்குத் தலைவர்களாக இருந்தார்கள்.[a] காத் நகரில் குடியிருந்தவர்களைத் துரத்தியவர்கள் இவர்களே.[b]
  to: பெரியாவும் சேமாவும் அய்யாலோனில் குடியிருந்தவர்களிடையே தந்தைவழிக் குடும்பத் தலைவர்களாக இருந்தார்கள்.[a] காத் நகரில் குடியிருந்தவர்களைத் துரத்தியவர்கள் இவர்களே.[b]
