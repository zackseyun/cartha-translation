base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/010.yaml
  text: and Jeuz[a], and Sachia, and Mirmah. These were his sons, heads of fathers’ houses.
translation:
  language: ta
  text: யெயூஸ், சக்கியா, மிர்மா ஆகியோரையும் பெற்றான். இவர்கள் அவனுடைய மகன்கள்; தந்தைவழிக் குடும்பங்களின் தலைவர்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְעוּץ
  choice: யெயூஸ்
  rationale: தனிப்பட்ட பெயர் என்பதால் பொருளாக்காமல் எபிரெய ஒலிப்புக்கு நெருக்கமாகத் தமிழில் எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: שָׂכְיָה
  choice: சக்கியா
  rationale: தனிப்பட்ட பெயர்; எபிரெய மெய் மற்றும் உயிரொலிகளை இயல்பான தமிழ் வடிவில் எழுத்துப்பெயர்க்கிறது.
- source_word: מִרְמָה
  choice: மிர்மா
  rationale: இதே வடிவம் பொதுப்பெயராக ‘வஞ்சகம்’ என்று பொருள்படக்கூடும்; ஆனால் இவ்வம்சவரலாற்றுச் சூழலில் இது ஆள்பெயர் என்பதால் பொருளாக்கப்படவில்லை.
- source_word: אֵלֶּה
  choice: இவர்கள்
  rationale: முன்னர் குறிப்பிடப்பட்ட ஆண் நபர்களைச் சுட்டுவதால் தமிழில் இயல்பான பன்மைச் சுட்டுப்பெயர் பயன்படுத்தப்பட்டது.
- source_word: בָנָיו
  choice: அவனுடைய மகன்கள்
  rationale: வம்சவரலாற்றுச் சூழலில் உள்ள ஆண்பால் பன்மையைத் துல்லியமாக வெளிப்படுத்துகிறது.
- source_word: רָאשֵׁי אָבוֹת
  choice: தந்தைவழிக் குடும்பங்களின் தலைவர்கள்
  rationale: ‘தந்தையரின் தலைவர்கள்’ என்ற சொற்படி வடிவம் தமிழில் தெளிவற்றது. இத்தொடரின் வம்ச/குடும்பக் குழு சார்ந்த மரபுப்பொருளை இயல்பாகவும் துல்லியமாகவும் தருகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், வம்சவரலாற்றுக்கு ஏற்ற கண்ணியமான மற்றும் எளிதில் புரியும் நடை. எபிரெய வசனம் முந்தைய வசனத்தின் வினைத்தொடரைத் தொடர்வதால், தமிழில் முழுமையான வாக்கியமாக அமைய ‘பெற்றான்’ சேர்க்கப்பட்டுள்ளது.
