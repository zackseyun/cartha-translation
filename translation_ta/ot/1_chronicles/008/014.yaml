lexical_decisions:
- source_word: וְ/אַחְיוֹ
  choice: அகியோ
  rationale: வம்சப்பட்டியலில் வரும் ஆட்பெயராக ஒலிபெயர்க்கப்பட்டது. தொடக்க וְ மற்ற பெயர்களையும் ஒரே தொகுப்பாக இணைக்கும் தமிழ் வாக்கிய அமைப்பில் இறுதியிலுள்ள ‘ஆகியோரும்’ என்பதில் இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: שָׁשָׁק
  choice: சாஷாக்
  rationale: எபிரெய ஒலியமைப்பைப் பின்பற்றி ஆட்பெயராக நேரடியாக ஒலிபெயர்க்கப்பட்டது.
- source_word: וִ/ירֵמוֹת
  choice: எரேமோத்[a]
  rationale: ஆட்பெயர் நவீனத் தமிழில் இயல்பாக ஒலிபெயர்க்கப்பட்டது; இதனுடன் சேர்ந்துள்ள וְ-இன் இணைப்புப் பொருள் பட்டியலை நிறைவு செய்யும் ‘ஆகியோரும்’ என்பதில் வெளிப்படுகிறது. தொடக்க ய் ஒலியை வெளிப்படுத்தும் மாற்று ஒலிபெயர்ப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
