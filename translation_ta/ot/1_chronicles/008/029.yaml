  yaml_path: translation/ot/1_chronicles/008/029.yaml
  text: In Gibeon lived the father of Gibeon[a], and his wife’s name was Maacah.
translation:
  language: ta
  text: கிபியோனில் கிபியோனின் தந்தை[a] குடியிருந்தார்; அவருடைய மனைவியின் பெயர் மாக்கா.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கிபியோனை நிறுவியவர்’ அல்லது ‘கிபியோனின் தலைவர்’; எபிரெயத்தில் சொல்லுக்குச் சொல், ‘கிபியோனின் தந்தை.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְ/גִבְעוֹן
  choice: கிபியோனில்
  rationale: வாவ் இணைப்பைத் தமிழில் வெளிப்படையாக மொழிபெயர்க்காமல், בְּ முன்னொட்டின் இடப்பொருளை இயல்பாகக் காட்டுகிறது.
- source_word: יָשְׁבוּ
  choice: குடியிருந்தார்
  rationale: ישׁב என்பதன் ‘வசித்தல்/குடியிருத்தல்’ என்ற பொருளை இவ்வம்சாவளி மற்றும் இடவியல் சூழலில் இயல்பான நவீனத் தமிழில் தருகிறது; எபிரெய வடிவம் பன்மையாக இருந்தாலும், வெளிப்படையான எழுவாய் ஒருமையாக இருப்பதால் தமிழில் மரியாதை ஒருமை பயன்படுத்தப்பட்டுள்ளது.
- source_word: אֲבִי גִבְעוֹן
  choice: கிபியோனின் தந்தை
  rationale: எபிரெயக் கட்டமைப்பின் நேரடியான பொருளைப் பாதுகாக்கிறது. இங்கு ‘தந்தை’ என்பது நகரை நிறுவியவர் அல்லது அதன் தலைவர் என்ற விரிவான பொருளையும் கொள்ளக்கூடும்; அவை அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: וְ/שֵׁם אִשְׁתּוֹ
  choice: அவருடைய மனைவியின் பெயர்
  rationale: ‘அவருடைய மனைவியின் பெயர்’ என்ற எபிரெய உறவைக் கருத்துத் திரிபின்றி, தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מַעֲכָה
  choice: மாகா
  rationale: எபிரெய தனிப்பெயரை நவீனத் தமிழ் ஒலிபெயர்ப்பு மரபுக்கு ஏற்றவாறு வழங்குகிறது.
