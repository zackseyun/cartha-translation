translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் ‘கிபியோனின் தந்தை’ என்ற திட்டமிட்ட தெளிவின்மை முதன்மை உரையில் பாதுகாக்கப்பட்டு, சூழலுக்குரிய மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
