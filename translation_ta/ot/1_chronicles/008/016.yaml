  yaml_path: translation/ot/1_chronicles/008/016.yaml
  text: and Michael, Ishpah, and Joha, the sons of Beriah.
translation:
  language: ta
  text: 'பெரியாவின் மகன்கள்: மிகாயேல், யிஷ்பா, யோஹா.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מִיכָאֵל
  choice: மிகாயேல்
  rationale: இணைப்பிடைச்சொல்லுடன் வரும் எபிரெய தனிப்பெயர். தமிழ் வேதாகம மரபிலும் மூல உச்சரிப்புக்கு அண்மையாகவும் உள்ள ‘மிகாயேல்’ பயன்படுத்தப்பட்டது; பட்டியலின் இணைப்பை இயல்பான தமிழ் வடிவமைப்பு காட்டுகிறது.
- source_word: וְ/יִשְׁפָּה
  choice: இஸ்பா
  rationale: எபிரெய தனிப்பெயரின் ஒலியை நவீன தமிழில் வாசிக்க ஏற்றவாறு எழுத்துப்பெயர்த்துள்ளது. பெயரின் தொடக்கத்திலுள்ள yod இங்கு மெய்யொலியாக வெளிப்படாமல் இருப்பதை இவ்வடிவம் பிரதிபலிக்கிறது.
- source_word: וְ/יוֹחָא
  choice: யோகா
  rationale: எபிரெய יוֹחָא என்ற தனிப்பெயரின் தொடக்க y ஒலியையும் நீண்ட o உயிரையும் தமிழ் எழுத்துப்பெயர்ப்பில் பிரதிபலிக்கிறது.
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: வம்சப்பட்டியல் சூழலில் நேரடியான ஆண் பிள்ளைகளைக் குறிக்கும் சொல்லாக ‘மகன்கள்’ துல்லியமானது.
- source_word: בְרִיעָה
  choice: பெரியா
  rationale: எபிரெய தனிப்பெயரான בְרִיעָה-வின் ஒலியமைப்பைத் தமிழில் இயல்பாக எழுத்துப்பெயர்க்கிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில் சுருக்கமான வம்சப்பட்டியல் நடையைப் பயன்படுத்துகிறது. எபிரெயில் பெயர்களைத் தொடர்ந்து உறவுமுறை வருவதை, தமிழில் தெளிவும் இயல்பும் பெற ‘பெரியாவின் மகன்கள்:’ என முன்வைத்துள்ளது; பொருள் மாறவில்லை.
