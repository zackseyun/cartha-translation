  text: Iphdeiah and Penuel were the sons of Shashak[a].
translation:
  language: ta
  text: இப்தெயாவும் பெனுவேலும் சாசாக்கின் மகன்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பெனியேல்.’ எபிரெயப் பெயரை வெவ்வேறு ஒலிபெயர்ப்பு முறைகளில் இவ்விரு வடிவங்களிலும் எழுதலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִפְדְיָה
  choice: இப்தெயா
  rationale: எபிரெய தனிப்பெயர் பொருளாக்கப்படாமல், தமிழில் இயல்பாக ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: פניאל
  choice: பெனியேல்
  rationale: மசோரா உயிர்க்குறிகளின்படி இப்பெயர் ‘பெனியேல்’ என ஒலிபெயர்க்கப்படுகிறது; ஆங்கிலத்தில் காணப்படும் Penuel/Peniel வேறுபாடு தமிழில் தனிக் குறிப்பைத் தேவைப்படுத்தாது.
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: இது ‘மகன்’ என்பதன் பன்மை இணைப்புவடிவம். எபிரெய வினையற்ற வம்சப்பட்டியல் வாக்கியம் தமிழில் இயல்பாக அமைய ‘மகன்கள்’ என்ற பயனிலை போதுமானது.
- source_word: שָׁשָׁק
  choice: சாசாக்
  rationale: எபிரெய தனிப்பெயர் தமிழில் அதன் ஒலிக்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டுள்ளது.
