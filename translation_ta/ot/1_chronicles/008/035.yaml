source:
  edition: WLC
  text: וּ/בְנֵ֖י מִיכָ֑ה פִּית֥וֹן וָ/מֶ֖לֶךְ וְ/תַאְרֵ֥עַ וְ/אָחָֽז׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/035.yaml
  text: 'And the sons of Micah: Pithon[a], Melech, Tarea, and Ahaz.'
translation:
  language: ta
  text: 'மீகாவின் மகன்கள்: பித்தோன், மெலேக், தாரேயா, ஆகாஸ்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי מִיכָה
  choice: மீகாவின் மகன்கள்
  rationale: בְנֵי என்பது இந்த வம்சவரலாற்றுச் சூழலில் நேரடியான மகன்களைக் குறிக்கிறது. தொடக்க ו இணைப்புச்சொல், இயல்பான நவீனத் தமிழில் தனியாக மொழிபெயர்க்கப்படாமல் வம்சப்பட்டியலின் தொடர்ச்சியால் உணர்த்தப்படுகிறது.
- source_word: פִּיתוֹן
  choice: பித்தோன்
  rationale: எபிரேயத் தனிப்பெயரின் ஒலியைத் தமிழில் இயன்றவரை நேரடியாக எழுத்துப்பெயர்த்தது.
- source_word: וָמֶלֶךְ
  choice: மெலேக்
  rationale: வம்சப்பட்டியல் சூழலால் מֶלֶךְ இங்கு ‘அரசன்’ என்ற பொதுப்பெயர் அல்ல, தனிப்பெயர். எபிரேய உச்சரிப்பை அணுகும் வகையில் எழுத்துப்பெயர்க்கப்பட்டுள்ளது.
- source_word: וְתַאְרֵעַ
  choice: தாரெயா
  rationale: எபிரேய மெய்யெழுத்துகளையும் மசோரா உயிர்க்குறிகளையும் அடிப்படையாகக் கொண்ட எழுத்துப்பெயர்ப்பு.
- source_word: וְאָחָז
  choice: ஆகாஸ்
  rationale: இது வினைச்சொல்லாக அல்ல, மீகாவின் மகனுடைய தனிப்பெயராகப் புரிந்துகொள்ளப்பட்டு தமிழில் எழுத்துப்பெயர்க்கப்பட்டுள்ளது.
theological_decisions: []
translation_notes:
  register: சுருக்கமான வம்சப்பட்டியல் நடையைப் பேணியபடி, நவீனத் தமிழில் இயல்பாக வாசிக்க பெயர்களுக்கிடையே காற்புள்ளிகள் பயன்படுத்தப்பட்டுள்ளன. எபிரேயத்தில் ஒவ்வொரு பெயருக்கும் முன் வரும் இணைப்புச்சொற்கள் தமிழில் பட்டியல் அமைப்பால் வெளிப்படுத்தப்பட்டுள்ளன. ஆங்கில ஆலோசனை உரையிலுள்ள [a] குறிப்பு பித்தோன் பெயருடன் பொருந்தாததாகத் தோன்றுவதால், மூல எபிரேயச் சான்றின் அடிப்படையில் அது சேர்க்கப்படவில்லை.
