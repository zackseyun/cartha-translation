  text: Adaiah[a], Beraiah, and Shimrath, the sons of Shimei.
translation:
  language: ta
  text: அதாயா, பெராயா[a], சிம்ராத் ஆகியோர் சிமெயியின் மகன்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் “பெராயா”; சில மொழிபெயர்ப்பு மரபுகளில் இப்பெயர் “பெரியா” எனச் சுருக்கப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲדָיָה
  choice: அதாயா
  rationale: எபிரெயத் தனிப்பெயரின் ஒலிவடிவத்தைத் தமிழில் இயல்பாக எழுத்துப்பெயர்த்துள்ளது.
- source_word: בְרָאיָה
  choice: பெராயா
  rationale: நடுவிலுள்ள எபிரெய அலெஃப் எழுத்தையும் பெயரின் முழு வடிவத்தையும் பிரதிபலிக்கும் எழுத்துப்பெயர்ப்பு.
- source_word: שִׁמְרָת
  choice: சிம்ராத்
  rationale: எபிரெயத் தனிப்பெயரை அதன் மெய்யொலி அமைப்புக்கு நெருக்கமாகத் தமிழில் எழுத்துப்பெயர்த்துள்ளது.
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: வம்சப்பட்டியலில் தந்தை–மகன் உறவைக் குறிக்கும் இந்தப் பன்மை இணைநிலை வடிவத்திற்கு இயல்பான தமிழ் சொல்.
- source_word: שִׁמְעִי
  choice: சிமெயி
  rationale: எபிரெயத் தனிப்பெயரின் இறுதி இரட்டை உயிரொலியைத் தெளிவாகக் காட்டும் தமிழ் எழுத்துப்பெயர்ப்பு.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், வம்சப்பட்டியலுக்கேற்ற சுருக்கமானதும் கண்ணியமானதுமான நடை பயன்படுத்தப்பட்டுள்ளது. மூன்று பெயர்களுக்கும் பொதுவான உறவை இயல்பாகக் காட்ட “ஆகியோர்” சேர்க்கப்பட்டுள்ளது; மூலத்தின் பொருள் மாற்றப்படவில்லை.
