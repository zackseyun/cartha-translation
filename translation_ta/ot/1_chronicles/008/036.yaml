translation_notes:
  register: நவீனத் தரத் தமிழில், வம்சப் பட்டியலுக்கேற்ற சுருக்கமான மற்றும் கண்ணியமான நடை. பெயர்கள் மூல எபிரெய வடிவத்திலிருந்து எழுத்துப்பெயர்க்கப்பட்டன. ‘பெற்றான்’ என்ற சொல் உயிரியல் மகப்பேற்றைத் தாய்க்கே மட்டும் வரையறுக்கும் பொருளில் அல்லாமல், தமிழ் வேதாகம வம்சப்பட்டியல் வழக்கில் ‘தந்தையானான்/வம்சத்தில் உண்டாக்கினான்’ என்ற பொருளில் பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் உள்ள இணைப்பு அமைப்பு தமிழின் இயல்புக்கேற்ப அரைப்புள்ளிகளாலும் பட்டியல் வடிவாலும் பேணப்பட்டுள்ளது.
