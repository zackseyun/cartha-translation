source:
  edition: WLC
  text: וְ/אָחָז֙ הוֹלִ֣יד אֶת יְהוֹעַדָּ֔ה וִ/יהֽוֹעַדָּ֗ה הוֹלִ֛יד אֶת עָלֶ֥מֶת וְ/אֶת עַזְמָ֖וֶת וְ/אֶת זִמְרִ֑י וְ/זִמְרִ֖י הוֹלִ֥יד אֶת מוֹצָֽא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/036.yaml
  text: Ahaz fathered Jehoaddah[a], and Jehoaddah fathered Alemeth, Azmaveth, and Zimri; and Zimri fathered Moza.
translation:
  language: ta
  text: ஆகாஸ் யெகோஅத்தாவுக்குத் தந்தையானான்; யெகோஅத்தா அலேமேத், அஸ்மாவேத், ஸிம்ரி ஆகியோருக்குத் தந்தையானான்; ஸிம்ரி மோசாவுக்குத் தந்தையானான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הוֹלִיד
  choice: பெற்றான்
  rationale: வம்சப் பட்டியல் சூழலில் ஹிஃபில் வடிவம் ஒருவருக்குத் தந்தையாகி வம்சத்தை உருவாக்கியதைக் குறிக்கிறது. தமிழில் ஆண் எழுவாயுடன் ‘பெற்றான்’ என்பது சுருக்கமாகவும் இயல்பாகவும் தொடர்ந்து வரும் வம்ச உறவைத் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: אֶת
  choice: '[தனியாக மொழிபெயர்க்கப்படவில்லை]'
  rationale: இது எபிரெய மொழியின் நேர்செயப்படுபொருள் குறியீடு; தமிழில் தனிச் சொல் இணை இல்லை. ‘-ஐ’ வேற்றுமை உருபிலும் இயல்பான வாக்கிய அமைப்பிலும் அதன் பணி வெளிப்படுகிறது.
- source_word: יְהוֹעַדָּה
  choice: யெகோஅத்தா
  rationale: கொடுக்கப்பட்ட எபிரெய மெய்யெழுத்து மற்றும் உயிர்க்குறிப்பு வடிவத்தை நெருக்கமாகப் பிரதிபலிக்கும் பெயரெழுத்துப்பெயர்ப்பு.
- source_word: עָלֶמֶת
  choice: அலேமேத்
  rationale: எபிரெயப் பெயரின் ஒலியமைப்பை நெருக்கமாகப் பேணும் தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: עַזְמָוֶת
  choice: அஸ்மாவேத்
  rationale: பெயரின் எபிரெய மெய்யொலிகளையும் உயிரொலிகளையும் இயன்றவரை பேணும் தமிழ் வடிவம்.
- source_word: זִמְרִי
  choice: சிம்ரி
  rationale: இரு இடங்களிலும் ஒரே சீரான தமிழ் எழுத்துப்பெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: מוֹצָא
  choice: மோசா
  rationale: எபிரெயப் பெயரின் ஒலிப்பை இயல்பான தமிழ் எழுத்துகளில் பிரதிபலிக்கிறது.
- source_word: וְ
  choice: ; / மற்றும் / [வாக்கிய இணைப்பு]
  rationale: எபிரெய இணைப்புச் சொல் வம்சத் தொடர்களையும் பெயர்ப் பட்டியலையும் இணைக்கிறது. தமிழில் பெயர்ப் பட்டியலில் ‘மற்றும்’ என்பதற்குப் பதிலாக இயல்பான பட்டியல் அமைப்பும் ‘ஆகியோரை’ என்பதும் பயன்படுத்தப்பட்டு, உட்பிரிவுகள் அரைப்புள்ளியால் இணைக்கப்பட்டுள்ளன.
