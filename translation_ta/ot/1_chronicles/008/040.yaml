  text: וַֽ/יִּהְי֣וּ בְנֵי א֠וּלָם אֲנָשִׁ֨ים גִּבֹּרֵי חַ֜יִל דֹּ֣רְכֵי קֶ֗שֶׁת וּ/מַרְבִּ֤ים בָּנִים֙ וּ/בְנֵ֣י בָנִ֔ים מֵאָ֖ה וַ/חֲמִשִּׁ֑ים כָּל אֵ֖לֶּה מִ/בְּנֵ֥י בִנְיָמִֽן־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/040.yaml
  text: The sons of Ulam were mighty men of valor[a], drawers of the bow, and had many sons and grandsons, one hundred and fifty[c][b]. All these were from the sons of Benjamin.
translation:
  language: ta
  text: உலாமின் மகன்கள் வலிமைமிக்க வீரர்களாகவும் வில்லாளர்களாகவும்[a] இருந்தார்கள். அவர்களுக்கு ஏராளமான மகன்களும் பேரன்களும் இருந்தார்கள்—மொத்தம் நூற்றைம்பது பேர்.[b] இவர்கள் அனைவரும் பென்யமீன் கோத்திரத்தின் வழித்தோன்றல்கள்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்கு சொல், “வில்லை மிதிப்பவர்கள்” அல்லது “வில்லை வளைப்பவர்கள்”; இது வில்லாளர்களைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “மகன்களும் மகன்களின் மகன்களும், நூற்றைம்பது” என்று சுருக்கமாக உள்ளது; இந்த எண்ணிக்கை இரு குழுக்களையும் சேர்த்த மொத்தத்தைக் குறிப்பதாகப் பொதுவாகப் புரிந்துகொள்ளப்படுகிறது.
    reason: source_ambiguity
  - marker: c
    text: சொல்லுக்கு சொல், “பென்யமீனின் மகன்களிலிருந்து வந்தவர்கள்”; அதாவது பென்யமீன் கோத்திரத்தைச் சேர்ந்த வழித்தோன்றல்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: இருந்தார்கள்
  rationale: உலாமின் மகன்களைப் பற்றிய விவரிப்பை அறிமுகப்படுத்தும் היה வினையின் இயல்பான இறந்தகால வடிவம்.
- source_word: בְנֵי אוּלָם
  choice: உலாமின் மகன்கள்
  rationale: வம்சவரலாற்றுச் சூழலில் உள்ள எபிரெயக் கட்டுச் சொல்லமைப்பை இயல்பான தமிழில் தருகிறது.
- source_word: אֲנָשִׁים גִּבֹּרֵי חַיִל
  choice: வீரமும் வல்லமையும் கொண்டவர்கள்
  rationale: உடல் வலிமை, துணிவு, போர்த் திறன் ஆகியவற்றைக் குறிக்கக்கூடிய மரபுத்தொடரின் பரந்த பொருளைத் தக்கவைக்கிறது.
- source_word: דֹּרְכֵי קֶשֶׁת
  choice: வில் எய்வதில் திறமையானவர்கள்
  rationale: சொல்லுக்கு சொல் ‘வில்லை மிதிப்பவர்கள்/வளைப்பவர்கள்’ என்ற உருவகத்தை, வில்லாளர்கள் எனப் புரிந்துகொள்ளத்தக்க இயல்பான தமிழில் தருகிறது; நேரடி உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וּמַרְבִּים בָּנִים וּבְנֵי בָנִים
  choice: அவர்களுக்கு ஏராளமான மகன்களும் பேரன்களும் இருந்தார்கள்
  rationale: רבה என்பதன் பெருக்கம் அல்லது மிகுதி என்ற கருத்தையும், ‘மகன்களின் மகன்கள்’ என்பதன் வம்சவழிப் பொருளான ‘பேரன்கள்’ என்பதையும் தெளிவாகத் தருகிறது.
- source_word: מֵאָה וַחֲמִשִּׁים
  choice: மொத்தம் 150 பேர்
  rationale: எண்ணை மகன்களும் பேரன்களும் சேர்ந்த தொகையாக வாசிக்க உதவும் இயல்பான தமிழ்; எபிரெயத்தின் சுருக்கமான அமைப்பு அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: כָּל אֵלֶּה
  choice: இவர்கள் அனைவரும்
  rationale: முந்தைய பட்டியலைச் சுருக்கிக் குறிப்பிடும் இயல்பான ஆள்சுட்டுத் தொடர்.
- source_word: מִבְּנֵי בִנְיָמִן
  choice: பென்யமீனின் வழித்தோன்றல்கள்
  rationale: מן + בני என்ற அமைப்பு இங்கு பென்யமீன் கோத்திர வம்சத்தைச் சுட்டுவதால், பொருளைத் தெளிவான நவீன தமிழில் தருகிறது.
