revisions:
- from: உலாமின் மகன்கள் வீரமும் வல்லமையும் கொண்டவர்களாகவும், வில் எய்வதில் திறமையானவர்களாகவும்[a] இருந்தார்கள். அவர்களுக்கு ஏராளமான மகன்களும் பேரன்களும் இருந்தார்கள்—மொத்தம் 150 பேர்.[b] இவர்கள் அனைவரும் பென்யமீனின் வழித்தோன்றல்கள்.[c]
  to: உலாமின் மகன்கள் வலிமைமிக்க வீரர்களாகவும் வில்லாளர்களாகவும்[a] இருந்தார்கள். அவர்களுக்கு ஏராளமான மகன்களும் பேரன்களும் இருந்தார்கள்—மொத்தம் நூற்றைம்பது பேர்.[b] இவர்கள் அனைவரும் பென்யமீன் கோத்திரத்தின் வழித்தோன்றல்கள்.[c]
