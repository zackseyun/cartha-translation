  text: וּ/מוֹצָ֖א הוֹלִ֣יד אֶת בִּנְעָ֑א רָפָ֥ה בְנ֛/וֹ אֶלְעָשָׂ֥ה בְנ֖/וֹ אָצֵ֥ל בְּנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/037.yaml
  text: And Moza fathered Binea; Rephah was his son, Eleasah his son, Azel his son.
translation:
  language: ta
  text: மோசா பினேயாவைப் பெற்றான்; ராப்பா அவன் மகன், எலெயாசா அவன் மகன், ஆட்சேல் அவன் மகன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מוֹצָא
  choice: மோசா
  rationale: வம்சவரலாற்றுத் தொடரின் இணைப்பைத் தமிழ் நிறுத்தக்குறியும் வாக்கிய ஓட்டமும் இயல்பாக உணர்த்துவதால் ו தனியாக மொழிபெயர்க்கப்படவில்லை; מוֹצָא ஒலிபெயர்க்கப்பட்டது.
- source_word: הוֹלִיד
  choice: பெற்றான்
  rationale: ஹிப்இல் வடிவம் வம்சவரலாற்றுச் சூழலில் ‘தந்தையானான்/பெற்றான்’ எனப் பொருள்படும்; ‘பெற்றான்’ சுருக்கமாகவும் வழக்கமான தமிழ் வேதாகம வம்சவரலாற்று நடைக்கு ஏற்றதாகவும் உள்ளது.
- source_word: אֶת
  choice: '[தனியாக மொழிபெயர்க்கப்படவில்லை]'
  rationale: நேரடிச் செயப்படுபொருளைக் குறிக்கும் எபிரெயச் சுட்டிக்கு தமிழில் தனிச் சொல் தேவையில்லை; ‘-ஐ’ வேற்றுமை உருபில் அது வெளிப்படுகிறது.
- source_word: בִּנְעָא
  choice: பினேயா
  rationale: எபிரெய உயிரொலிகளையும் இறுதி ע-வையும் வாசிக்கத்தக்க தமிழில் நெருக்கமாகக் காட்டும் ஒலிபெயர்ப்பு.
- source_word: רָפָה
  choice: ரெப்பா
  rationale: மசோரா உயிர்க்குறிப்பிலுள்ள முதல் குறில் a-ஒலிக்கும், פ-இன் உராயொலிக்கும் நெருக்கமான தமிழ் ஒலிபெயர்ப்பு; இயல்பான உச்சரிப்புக்காக ‘ப்ப’ பயன்படுத்தப்பட்டது.
- source_word: בְנ/וֹ
  choice: அவன் மகன்
  rationale: இச்சொற்றொடர் ‘அவனுடைய மகன்’ என்று நேரடியாகப் பொருள்பட்டு, அடுத்தடுத்த சந்ததியினரைச் சங்கிலியாகக் குறிக்கிறது; மூலத்தின் சுருக்கமான பெயர்ச்சொல் நடையைப் பாதுகாக்க இணைப்புவினை சேர்க்கப்படவில்லை.
- source_word: אֶלְעָשָׂה
  choice: எலெயாசா
  rationale: பெயரின் எபிரெய ஒலியமைப்பைத் தமிழில் தெளிவாக வேறுபடுத்திக் காட்டும் ஒலிபெயர்ப்பு.
- source_word: אָצֵל
  choice: ஆசேல்
  rationale: மசோரா உயிர்க்குறிப்புகளுக்கு நெருக்கமான தமிழ் ஒலிபெயர்ப்பு.
