translation_notes:
  register: நவீனத் தரத்தமிழில், வம்சவரலாற்றுக்குரிய சுருக்கமானதும் கண்ணியமானதுமான நடை. மூலத்தில் தொடர்ந்து வரும் ‘அவன் மகன்’ என்ற அமைப்பு, ஒவ்வொரு பெயரும் முந்தியவரின் மகன் என்பதைத் தெளிவாக வைத்திருக்க அப்படியே பாதுகாக்கப்பட்டது. ஆங்கில ஒலிபெயர்ப்பு மாற்றுகள் தமிழ்ச் சொற்பொருள் மாற்றுகள் அல்லாததால் அடிக்குறிப்புகள் சேர்க்கப்படவில்லை.
