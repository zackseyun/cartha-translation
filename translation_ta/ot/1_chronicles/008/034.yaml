base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/034.yaml
  text: And the son of Jehonathan was Merib-baal[a], and Merib-baal fathered Micah.
translation:
  language: ta
  text: மேலும், யெகோனத்தானின் மகன் மெரிப்-பாகால்; மெரிப்-பாகால் மீகாவைப் பெற்றான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இணையான வம்சவரலாற்றில், 2 சாமுவேல் 9:12 இந்த நபரின் பெயரை ‘மீகா’ எனக் குறிப்பிடுகிறது; அங்குள்ள எபிரேய எழுத்துவடிவு மִיכָא, இங்குள்ள மִיכָה-விலிருந்து சிறிது வேறுபடுகிறது.
    reason: cross_reference
lexical_decisions:
- source_word: וּ/בֶן
  choice: மகன்
  rationale: வம்சவரலாற்றின் தொடர்ச்சியை எபிரேய இணைப்புச் சொல் காட்டுகிறது. தமிழில் முந்தைய வசனத்தோடு இயல்பாகத் தொடரும் வகையில் உறவுமுறை நேரடியாகக் கொடுக்கப்பட்டுள்ளது.
- source_word: יְהוֹנָתָן
  choice: யெகோனத்தான்
  rationale: மூலத்தில் உள்ள முழு ‘யெகோனத்தான்’ வடிவத்தை, வழக்கமான குறுகிய ‘யோனத்தான்’ வடிவமாக மாற்றாமல் ஒலிபெயர்க்கிறது.
- source_word: מְרִיב בָּעַל / מְרִיב בַּעַל
  choice: மெரிப்-பாகால்
  rationale: எபிரேயத்தில் இரு கூறுகளாக எழுதப்பட்டுள்ள ஒரே நபரின் பெயர். தமிழில் அதை ஒரே பெயராக வாசிக்க இணைப்புக்கோடு பயன்படுத்தப்பட்டுள்ளது.
- source_word: הוֹלִיד
  choice: பெற்றான்
  rationale: வம்சவரலாற்றுச் சூழலில் ஹிஃபில் வடிவம் ‘தந்தையானான்/பெற்றான்’ என்ற பொருளைக் குறிக்கிறது; ‘பெற்றான்’ சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: אֶת מִיכָה
  choice: மீகாவை
  rationale: אֶת என்பது நேர்செயப்படுபொருள் குறியீடு; தமிழில் ‘-வை’ வேற்றுமை உருபால் வெளிப்படுகிறது. מִיכָה வழக்கமான தமிழ்ப் பெயர்வடிவில் ‘மீகா’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரமான, எளிதில் புரியும், கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. வம்சவரலாற்றுக்குரிய சுருக்கமான வாக்கிய அமைப்பும் பெயர்களின் மூலவடிவ வேறுபாடும் பாதுகாக்கப்பட்டுள்ளன. ஆங்கிலக் குறிப்பில் மெரிப்-பாகாலுக்குப் பின் இருந்த அடிக்குறியீடு, குறிப்பின் உண்மையான பொருளான ‘மீகா’வுக்குப் பின் வைக்கப்பட்டுள்ளது.
