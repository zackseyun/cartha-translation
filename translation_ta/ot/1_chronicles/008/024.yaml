- source_word: חֲנַנְיָה
  choice: அனனியா
  rationale: எபிரெயத் தனிப்பட்ட பெயரை அதன் ஒலிப்புக்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்த்துள்ளது.
- source_word: עֵילָם
  choice: ஏலாம்
  rationale: இங்கு வம்சப் பட்டியலில் வரும் தனிப்பட்ட பெயர்; இடப்பெயராகப் பொருள் மாற்றாமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: עַנְתֹתִיָּה
  choice: அந்தோத்தியா
  rationale: மசோரா உயிர்க்குறிகளுடன் உள்ள எபிரெய வடிவத்தை நேரடியாகத் தமிழில் ஒலிபெயர்க்கிறது; ‘அனதோத்தியா’ என்பது ஏற்றுக்கொள்ளத்தக்க மாற்று ஒலிபெயர்ப்பு.
- source_word: וְ
  choice: பட்டியல் நிறுத்தக்குறிகள்
  rationale: பெயர்களை இணைக்கும் வாவ் இடைச்சொல், இயல்பான தமிழ் பட்டியல் நடைக்கேற்ப காற்புள்ளிகளால் வெளிப்படுத்தப்பட்டுள்ளது; கடைசிப் பெயருக்கு முன் தனியே ‘மற்றும்’ சேர்ப்பது இச்சிறிய பெயர்ப்பட்டியலில் தேவையில்லை.
