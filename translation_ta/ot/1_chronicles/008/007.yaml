base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/007.yaml
  text: and Naaman[a], Ahijah[b], and Gera—he carried them into exile and fathered Uzza and Ahihud.
translation:
  language: ta
  text: நாமான், அகியா, கேரா ஆகியோர்; கேரா—இவனே அவர்களை நாடுகடத்தி, ஊசாவுக்கும் அகிகுத்துக்கும் தந்தையானான்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இவன்” என்பதற்கான எபிரெயச் சுட்டுப்பெயர் ஒருமையில் உள்ளது; அது மிக இயல்பாகக் கேராவைக் குறிக்கிறது. எனினும், இப்பகுதியிலுள்ள வம்சவரலாற்றின் மூலபாடமும் வாக்கிய அமைப்பும் சிக்கலானவை.
    reason: alternative_reading
  - marker: b
    text: “அவர்களை நாடுகடத்தினான்” அல்லது “அவர்களைக் குடிபெயரச் செய்தான்” என்றும் மொழிபெயர்க்கலாம். எபிரெய வினை காரணவினை வடிவில், “அவர்களை நாடுகடந்து போகச் செய்தான்” என்ற பொருளைத் தருகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעֲמָן
  choice: நாமான்
  rationale: எபிரெயத் தனிப்பெயரின் ஒலியை நவீனத் தமிழில் இயல்பாக எழுத்துப்பெயர்த்த வடிவம்.
- source_word: אֲחִיָּה
  choice: அகியா
  rationale: தனிப்பெயரை அதன் எபிரெய ஒலிக்கு நெருக்கமாகத் தமிழில் எழுத்துப்பெயர்த்துள்ளது.
- source_word: גֵרָא
  choice: கேரா
  rationale: மொழிபெயர்க்காமல் தனிப்பெயராக எழுத்துப்பெயர்க்கப்பட்டுள்ளது.
- source_word: הוּא
  choice: இவனே
  rationale: தனித்து வரும் ஒருமை ஆண்பால் சுட்டுப்பெயரின் வலியுறுத்தல்/மீள்சுட்டும் தன்மையை வெளிப்படுத்துகிறது; அருகிலுள்ள கேராவைச் சுட்டுவது இயல்பானது, ஆனால் தொடரின் சிக்கல் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: הֶגְלָם
  choice: அவர்களை நாடுகடத்தி
  rationale: גלה வினையின் ஹிஃபில் காரணவினை வடிவத்தையும், மூன்றாம் நபர் பன்மைச் செயப்படுபொருள் பின்னொட்டையும் தெளிவாகக் காட்டுகிறது.
- source_word: וְהוֹלִיד
  choice: பெற்றான்
  rationale: வம்சவரலாற்றுச் சூழலில் ஆண் ஒருவன் பிள்ளைகளுக்குத் தந்தையானதைக் குறிக்கும் ילד வினையின் ஹிஃபில் பயன்பாட்டுக்கு இயல்பான, சுருக்கமான நவீனத் தமிழ்.
- source_word: עֻזָּא
  choice: ஊசா
  rationale: எபிரெயத் தனிப்பெயரின் வழக்கமான தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: אֲחִיחֻד
  choice: அகிகூத்
  rationale: எபிரெயத் தனிப்பெயரின் ஒலியைத் தமிழில் இயல்பாகப் பிரதிபலிக்கும் எழுத்துப்பெயர்ப்பு.
