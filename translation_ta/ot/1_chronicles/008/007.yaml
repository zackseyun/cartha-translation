translation_notes:
  register: நவீன நிலையான தமிழில், வம்சவரலாற்றுக்கேற்ற சுருக்கமானவும் கண்ணியமானவும் உள்ள நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் ஒருமை எழுவாய் மற்றும் பன்மை செயப்படுபொருள் அப்படியே காக்கப்பட்டுள்ளன; மூலபாடத்தின் தொடரியல் சிக்கல் அடிக்குறிப்பில் வெளிப்படையாகக் குறிப்பிடப்பட்டுள்ளது.
