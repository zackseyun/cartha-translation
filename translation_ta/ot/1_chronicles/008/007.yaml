  source_fidelity: எபிரெய மூலத்தின் ஒருமைச் சுட்டுப்பெயர், பன்மைச் செயப்படுபொருள், நாடுகடத்தச் செய்தல் என்ற காரணவினைப் பொருள் ஆகியவை வரைவில் பெரும்பாலும் காக்கப்பட்டுள்ளன. ஆனால் ஆண் வம்சவரிசைச் சூழலில் “பெற்றான்” என்பது தாயாகப் பெற்றெடுத்தல் என்ற பொருளையும் தரக்கூடும்; הוֹלִיד இங்கே குறிக்கும் தந்தைத்துவத்தைத் தெளிவாகக் காட்ட வேண்டும். மேலும் אֲחִיחֻד என்ற பெயரில் உள்ள குறில் உகரத்தை நீளமாக்காமல் எழுதுவது மூல ஒலிக்கு நெருக்கமானது.
