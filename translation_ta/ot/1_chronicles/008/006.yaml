translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான வம்சவரலாற்று நடை பயன்படுத்தப்பட்டுள்ளது. ஏகூத், கேபா, மனாகாத் ஆகிய பெயர்கள் எபிரெய ஒலிவடிவத்துக்கு நெருக்கமாக எழுத்துப்பெயர்க்கப்பட்டுள்ளன. வசனத்தின் இறுதியில் அடுத்த பட்டியலுக்கான தொடர்பைக் காட்ட இரட்டைப்புள்ளி வைக்கப்பட்டுள்ளது.
