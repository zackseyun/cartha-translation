source:
  edition: WLC
  text: וְ/אֵ֖לֶּה בְּנֵ֣י אֵח֑וּד אֵ֣לֶּה הֵ֞ם רָאשֵׁ֤י אָבוֹת֙ לְ/י֣וֹשְׁבֵי גֶ֔בַע וַ/יַּגְל֖וּ/ם אֶל מָנָֽחַת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/006.yaml
  text: 'These were the sons of Ehud[a]. These were the heads of fathers’ houses for the inhabitants of Geba[b], and they carried them into exile to Manahath:'
translation:
  language: ta
  text: 'இவர்கள் ஏகூதின் மகன்கள். இவர்களே கேபாவில் குடியிருந்தவர்களின் மூதாதையர் குடும்பங்களின் தலைவர்கள்[a]. அவர்கள் அவர்களை மனாகாத்துக்கு நாடுகடத்தினார்கள்[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மூதாதையர் குடும்பங்களின் தலைவர்கள்” என்பது ஒரு குலத்தின் அல்லது மூதாதையர் வழிக் குடும்பங்களின் தலைவர்களைக் குறிக்கிறது.
    reason: cultural_note
  - marker: b
    text: “அவர்கள்” மற்றும் “அவர்களை” என்பது யாரைக் குறிக்கின்றன என்பது எபிரெய உரையில் தெளிவாக இல்லை.
    reason: textual_ambiguity
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: இவர்கள்
  rationale: புதிய வம்சவரலாற்றுக் குறிப்பை இயல்பான தமிழில் அறிமுகப்படுத்துகிறது; தொடக்க இணைப்புச்சொல்லைத் தனியே மொழிபெயர்க்காமல் அதன் உரையாடல் செயல்பாடு காக்கப்படுகிறது.
- source_word: בְּנֵי אֵחוּד
  choice: ஏகூதின் மகன்கள்
  rationale: வம்சவரலாற்றுச் சூழலில் בְּנֵי என்பதற்கான நேரடியும் வழக்கமானதுமான மொழிபெயர்ப்பு; அது விரிந்த பொருளில் வழித்தோன்றல்களையும் குறிக்கக்கூடும்.
- source_word: אֵלֶּה הֵם
  choice: இவர்களே
  rationale: எபிரெய வலியுறுத்தலைத் தமிழின் ‘-ஏ’ விகுதி இயல்பாக வெளிப்படுத்துகிறது.
- source_word: רָאשֵׁי אָבוֹת
  choice: மூதாதையர் குடும்பத் தலைவர்கள்
  rationale: குலம் அல்லது மூதாதையர் வழிக் குடும்ப அமைப்பின் தலைவர்களைக் குறிக்கும் சமூக-வம்சவரலாற்றுச் சொல்லை, சாதாரண வாசகருக்குப் புரியும் வகையிலும் அதன் தனித்தன்மை குறையாமலும் தருகிறது.
- source_word: לְיֹשְׁבֵי גֶבַע
  choice: கேபாவில் குடியிருந்தவர்களின்
  rationale: இத்தலைவர்கள் கேபாவின் குடியிருப்பாளர்களைச் சேர்ந்தவர்கள் அல்லது அவர்களோடு தொடர்புடையவர்கள் என்ற உறவை இயல்பான தமிழில் காட்டுகிறது.
- source_word: וַיַּגְלוּם
  choice: அவர்கள் அவர்களை … நாடுகடத்தினார்கள்
  rationale: Hiphil வடிவம் பிறரை இடம்பெயர்ந்து நாடுகடத்தச் செய்ததைக் குறிக்கிறது. எழுவாய் மற்றும் செயப்படுபொருளின் முன்னிலைத் தொடர்பு மூலத்தில் தெளிவாக இல்லாததால், பிரதிப்பெயர்களைத் தீர்மானிக்காமல் வைத்திருக்கிறது.
- source_word: אֶל מָנָחַת
  choice: மனாகாத்துக்கு
  rationale: இலக்கைச் சுட்டும் முன்னிடைச்சொல்லையும் இடப்பெயரையும் இயல்பான தமிழில் தருகிறது.
