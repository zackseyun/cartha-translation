translation_notes:
  register: நவீனத் தரத் தமிழில், குடும்பவழிப் பட்டியலுக்குரிய சுருக்கமான மற்றும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் தொடக்க இணைப்பும், ‘அவனுடைய’ என்ற சுட்டுப்பெயரின் சூழல்சார் தன்மையும் தக்கவைக்கப்பட்டுள்ளன.
