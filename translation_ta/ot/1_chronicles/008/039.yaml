source:
  edition: WLC
  text: וּ/בְנֵ֖י עֵ֣שֶׁק אָחִ֑י/ו אוּלָ֣ם בְּכֹר֔/וֹ יְעוּשׁ֙ הַ/שֵּׁנִ֔י וֶֽ/אֱלִיפֶ֖לֶט הַ/שְּׁלִשִֽׁי׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/039.yaml
  text: 'The sons of Eshek his brother: Ulam his firstborn[a], Jeush the second, and Eliphelet the third.'
translation:
  language: ta
  text: 'மேலும், அவனுடைய சகோதரனாகிய ஏஷேக்கின் மகன்கள்: அவனுடைய முதற்பேறானவன் ஊலாம், இரண்டாமவன் எயூஷ், மற்றும் மூன்றாமவன் எலிபெலேத்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: மேலும் ... மகன்கள்
  rationale: வாவ் இணைப்பை ‘மேலும்’ என்று வெளிப்படையாகத் தக்கவைத்து, בְּנֵי என்பதைக் குடும்பவழிப் பட்டியலுக்கேற்ற ‘மகன்கள்’ என மொழிபெயர்க்கிறது.
- source_word: עֵשֶׁק
  choice: ஏஷேக்
  rationale: எபிரேய தனிப்பெயரின் ஒலியைத் தமிழில் இயன்றவரை நெருக்கமாக எழுத்துப்பெயர்க்கிறது.
- source_word: אָחִיו
  choice: அவனுடைய சகோதரனான
  rationale: אָח என்பதன் இயல்பான பொருளான ‘சகோதரன்’ என்பதைக் காக்கிறது; ‘அவனுடைய’ என்பதன் முன்னிடைச் சுட்டு வசனச் சூழலிலேயே விடப்படுகிறது.
- source_word: אוּלָם
  choice: ஊலாம்
  rationale: தனிப்பெயரை எபிரேய உச்சரிப்புக்கு நெருக்கமாக எழுத்துப்பெயர்க்கிறது.
- source_word: בְּכֹרוֹ
  choice: அவனுடைய முதற்பேறான
  rationale: முதல் பிறந்த மகன் என்ற குடும்பவழித் துல்லியத்தைக் ‘முதற்பேறு’ காக்கிறது.
- source_word: יְעוּשׁ
  choice: எயூஷ்
  rationale: எபிரேய தனிப்பெயரைத் தமிழில் ஒலிப்பெயர்க்கிறது.
- source_word: הַשֵּׁנִי
  choice: இரண்டாவது
  rationale: மகன்களின் பிறப்பு வரிசையைக் குறிக்கும் வரிசை எண்ணை நேரடியாக வழங்குகிறது.
- source_word: וֶאֱלִיפֶלֶט
  choice: எலிபெலேத்
  rationale: இறுதிப் பெயரை எபிரேய ஒலிக்கு நெருக்கமாக எழுத்துப்பெயர்க்கிறது; பட்டியலின் இணைப்பு தமிழில் காற்புள்ளி அமைப்பால் இயல்பாகத் தெரிவிக்கப்படுகிறது.
- source_word: הַשְּׁלִשִׁי
  choice: மூன்றாவது
  rationale: மூன்றாம் பிறப்பு வரிசையை நேரடியாகக் குறிக்கிறது.
