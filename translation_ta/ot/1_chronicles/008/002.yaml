lexical_decisions:
- source_word: נוֹחָה
  choice: நோகா
  rationale: எபிரெய தனிப்பெயரின் ஒலிப்பைத் தமிழில் இயல்பாக எழுத்துப்பெயர்த்தது.
- source_word: הָרְבִיעִי
  choice: நான்காவது
  rationale: குடிவழிப் பட்டியலில் பிறப்பு அல்லது பட்டியல் வரிசையைக் குறிக்கும் வரிசை எண்ணாக மொழிபெயர்க்கப்பட்டது.
- source_word: וְ
  choice: ;
  rationale: எபிரெய இணைப்புச்சொல் அடுத்த பட்டியல் உறுப்பை இணைக்கிறது; சுருக்கமான தமிழ் பெயர்ப்பட்டியலில் அரைப்புள்ளி அதன் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: רָפָא
  choice: ராப்பா
  rationale: எபிரெய தனிப்பெயரின் நீண்ட முதல் உயிரையும் மெய்யொலியையும் பிரதிபலிக்கும் தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: הַחֲמִישִׁי
  choice: ஐந்தாவது
  rationale: முந்தைய வரிசை எண்ணுக்கு இணையாக, பட்டியலின் ஐந்தாம் நபரைக் குறிக்கிறது.
