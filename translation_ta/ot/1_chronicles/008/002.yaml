  naturalness: The concise genealogical style is appropriate. Using the additive enclitic -உம் gives a natural, modern Tamil coordination without adding interpretive material.
  terminology: 'னோகா is an acceptable Tamil transliteration of נוֹחָה. ராபா more closely reflects רָפָא than ராப்பா: the Hebrew spelling does not support a doubled /pp/ in the Tamil form. No theological terminology is involved.'
  issues:
