  source_fidelity: பெயர்ப்பட்டியலின் அமைப்பும், எபிரெயத்தில் ஒவ்வொரு பெயருக்கும் முன் வரும் இணைப்பும் இறுதியிலுள்ள «ஆகியோரும்» மூலம் போதுமான வகையில் வெளிப்படுகின்றன. ஆனால் חִזְקִי என்பதற்கு «இஸ்கி» என்பது தொடக்க ח-ஐ விடுத்து ז-ஐ சகரமாக்குகிறது; חָבֶר என்பதற்கு «ஏபேர்» என்பதும் தொடக்க ח-ஐ விடுத்துவிடுகிறது. இவை இரண்டும் மூலப்பெயர் வடிவத்தைத் துல்லியமாகக் காட்டவில்லை.
