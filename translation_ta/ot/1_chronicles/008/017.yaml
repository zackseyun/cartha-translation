translation:
  language: ta
  text: செபதியா, மெசுல்லாம், ஹிஸ்கி, ஹேபேர் ஆகியோரும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/זְבַדְיָה
  choice: செபதியா
  rationale: וּ என்பது பட்டியலைத் தொடரும் இணைப்புச்சொல்; தமிழில் இயல்பாக இறுதியில் ‘ஆகியோரும்’ என்பதன் மூலம் பட்டியல் தொடர்பு காட்டப்படுகிறது. זְבַדְיָה என்ற ஆள்பெயர் தமிழ் வேதாகமப் பெயர்மரபுக்கு ஏற்றவாறு ஒலிபெயர்க்கப்பட்டது.
- source_word: וּ/מְשֻׁלָּם
  choice: மெசுல்லாம்
  rationale: מְשֻׁלָּם என்ற ஆள்பெயர் மொழிபெயர்க்கப்படாமல் எபிரெய ஒலிக்கு நெருக்கமாகத் தமிழ் எழுத்தில் தரப்பட்டது; முன்சேர்க்கை וּ பட்டியல் அமைப்பில் வெளிப்படுகிறது.
- source_word: וְ/חִזְקִי
  choice: இஸ்கி
  rationale: חִזְקִי என்பது எசேக்கியா என்ற வேறொரு பரிச்சயமான பெயராக மாற்றப்படாமல், இங்குள்ள குறுகிய எபிரெய வடிவத்துக்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டது.
- source_word: וָ/חָבֶר
  choice: ஏபேர்
  rationale: חָבֶר என்ற ஆள்பெயர் எபிரெய உச்சரிப்பை அணுகும் வகையில் ‘ஏபேர்’ என்று ஒலிபெயர்க்கப்பட்டது; וָ என்பதன் பட்டியல் இணைப்பு ‘ஆகியோரும்’ என்பதில் வெளிப்படுகிறது.
