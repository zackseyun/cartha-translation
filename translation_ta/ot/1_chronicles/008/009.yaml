  yaml_path: translation/ot/1_chronicles/008/009.yaml
  text: And he fathered Jobab[a], Zibia, Mesha, and Malcam by Hodesh his wife.
translation:
  language: ta
  text: அவன் தன் மனைவி ஹோதேஷின் மூலம்[a] யோபாப், சிபியா, மேஷா, மல்காம் ஆகியோரைப் பெற்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தன் மனைவி ஹோதேஷிடமிருந்து.” இந்த வம்சப் பட்டியல் சொற்றொடரில் வரும் எபிரெய முன்னிடைச்சொல்லை இரு விதமாகவும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹלֶד
  choice: பெற்றான்
  rationale: வம்சப் பட்டியல் சூழலில் ஆண் தந்தையாகப் பிள்ளைகளைப் பெற்றதைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொல்; ‘பிறப்பித்தான்’ என்பதைவிட வழக்கானது.
- source_word: מִן
  choice: மூலம்
  rationale: இங்கு மனைவியைப் பிள்ளைகளின் தாய்வழி மூலமாகக் குறிக்கிறது. எபிரெயச் சொல்லுக்கு ‘இடமிருந்து’ என்ற நேரடியான பொருளும் இருக்கக்கூடும் என்பதால் மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: חֹדֶשׁ
  choice: ஓதேஷ்
  rationale: தனிப்பெயராக இருப்பதால் மொழிபெயர்க்காமல், எபிரெய உச்சரிப்பைத் தமிழில் ஒலிபெயர்த்துள்ளது.
- source_word: אִשְׁתּוֹ
  choice: தன் மனைவி
  rationale: சுட்டப்படும் ஆணின் துணைவியைக் குறிக்கிறது; தமிழில் இயல்பான பிரதிபெயர்ச்சிப் பயன்பாட்டுக்காக ‘தன்’ பயன்படுத்தப்பட்டது.
- source_word: אֶת ... וְאֶת ... וְאֶת ... וְאֶת
  choice: ஆகியோரை
  rationale: திரும்பத் திரும்ப வரும் எபிரெய நேரடிச் செயப்படுபொருள் குறிப்பானுக்கு தமிழில் தனி இணை இல்லை; பெயர்ப் பட்டியல் ‘ஆகியோரை’ என்பதால் இயல்பாக ஒருங்கிணைக்கப்படுகிறது.
- source_word: יוֹבָב
  choice: யோபாப்
  rationale: எபிரெய தனிப்பெயரின் தமிழ் ஒலிபெயர்ப்பு.
- source_word: צִבְיָא
  choice: சிபியா
  rationale: எபிரெய தனிப்பெயரின் தமிழ் ஒலிபெயர்ப்பு.
- source_word: מֵישָׁא
  choice: மேஷா
  rationale: எபிரெய தனிப்பெயரின் தமிழ் ஒலிபெயர்ப்பு.
- source_word: מַלְכָּם
  choice: மல்காம்
  rationale: வம்சப் பட்டியலில் தனிப்பெயராக வரும் எபிரெய வடிவத்தின் தமிழ் ஒலிபெயர்ப்பு.
