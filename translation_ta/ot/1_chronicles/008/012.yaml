source:
  edition: WLC
  text: וּ/בְנֵ֣י אֶלְפַּ֔עַל עֵ֥בֶר וּ/מִשְׁעָ֖ם וָ/שָׁ֑מֶד ה֚וּא בָּנָ֣ה אֶת אוֹנ֔וֹ וְ/אֶת לֹ֖ד וּ/בְנֹתֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/012.yaml
  text: 'The sons of Elpaal: Eber[a], Misham, and Shemed[b]; he built Ono and Lod and its villages.'
translation:
  language: ta
  text: 'எல்பாலின் மகன்கள்: ஏபேர், மிஷாம், ஷாமேத். அவன்[b] ஓனோவையும் லோத்தையும் அதன் துணை ஊர்களையும்[a] கட்டினான்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்கு சொல், ‘அதன் மகள்கள்’; இது ஒரு நகரத்தைச் சார்ந்த துணை ஊர்கள் அல்லது சுற்றியுள்ள குடியிருப்புகளைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: ‘அவன்’ என்பது மிக இயல்பாகக் கடைசியாகக் குறிப்பிடப்பட்ட ஷாமேத்தைக் குறிக்கிறது; சிலர் இதை அந்தக் குடும்பக் கிளையைப் பொதுவாகக் குறிப்பதாகப் புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵי אֶלְפַּעַל
  choice: எல்பாலின் மகன்கள்
  rationale: இது வம்சப் பட்டியலில் ஒரு புதிய பெயர்ப் பட்டியலை அறிமுகப்படுத்தும் இணைப்புநிலைப் பன்மைச் சொற்றொடர். தொடக்க וּ இயல்பான நவீனத் தமிழில் தனியே மொழிபெயர்க்கப்படவில்லை.
- source_word: עֵבֶר וּמִשְׁעָם וָשָׁמֶד
  choice: ஏபேர், மிஷாம், சேமேத்
  rationale: ஆள் பெயர்கள் எபிரெய ஒலிப்பை அணுகிய தமிழ் ஒலிபெயர்ப்பில் தரப்பட்டுள்ளன; பட்டியலின் இறுதி இணைப்புகள் தமிழ் நிறுத்தற்குறிகளால் இயல்பாக வெளிப்படுத்தப்பட்டுள்ளன.
- source_word: הוּא
  choice: அவன்
  rationale: மூன்றாம் நபர் ஆண்பால் ஒருமைச் சுட்டுப்பெயர் நேரடியாகப் பாதுகாக்கப்பட்டுள்ளது. மிக அருகிலுள்ள சேமேத்தை இது இயல்பாகச் சுட்டினாலும், எபிரெய உரையில் பெயர் மீண்டும் கூறப்படாததால் அந்தத் தொடர்பு மொழிபெயர்ப்பில் உறுதிப்படுத்தப்படவில்லை.
- source_word: בָּנָה
  choice: கட்டினான்
  rationale: בנה என்பதன் வழக்கமான பொருள் ‘கட்டு’. ‘நிறுவினான்’ அல்லது ‘மீண்டும் கட்டினான்’ என்பவை மூல வடிவம் கூறுவதைவிடக் கூடுதல் விளக்கம் சேர்க்கும்.
- source_word: אֶת אוֹנוֹ וְאֶת לֹד
  choice: ஓனோவையும் லோத்தையும்
  rationale: நேரடி வேற்றுமை உருபுகள் தமிழில் ‘-ஐ’ மூலம் வெளிப்படுத்தப்பட்டுள்ளன; இடப்பெயர்கள் எபிரெய வடிவத்திலிருந்து ஒலிபெயர்க்கப்பட்டுள்ளன.
- source_word: וּבְנֹתֶיהָ
  choice: அதன் துணைக் கிராமங்களையும்
  rationale: சொல்லுக்கு சொல் ‘அதன் மகள்களையும்’; நகரத்தைச் சார்ந்த குடியிருப்புகள் அல்லது கிராமங்களைக் குறிக்கும் எபிரெய மரபுத்தொடரின் பொருள் இயல்பான தமிழில் தரப்பட்டுள்ளது. பெண்பால் ஒருமை உடைமைப் பின்னொட்டு அருகிலுள்ள லோத்தைச் சுட்டுகிறது.
theological_decisions:
- issue: הוּא என்ற சுட்டுப்பெயர் யாரைக் குறிக்கிறது
  choice: ‘அவன்’ என்று பெயரை நிரப்பாமல் மொழிபெயர்த்து, சேமேத்தைக் குறிக்கும் இயல்பான வாசிப்பை அடிக்குறிப்பில் தெரிவித்தல்
  alternative: ‘சேமேத்’ அல்லது ‘சேமேத்தே’ என்று வெளிப்படையாக மொழிபெயர்த்தல்; அல்லது குடும்ப மரபைத் தளர்வாகக் குறிப்பதாக எடுத்துக்கொள்ளுதல்
  rationale: மூலத்தில் ஆண்பால் ஒருமைச் சுட்டுப்பெயர் மட்டுமே உள்ளது. அருகிலுள்ள கடைசிப் பெயரான சேமேத் இயல்பான முன்னிலை என்றாலும், மொழிபெயர்ப்பில் பெயரைச் சேர்ப்பது மூலத்தின் சிறிய தெளிவின்மையை நீக்கிவிடும்.
translation_notes:
  register: நவீனத் தரத் தமிழில் சுருக்கமான வம்சப் பட்டியல் நடையும் கண்ணியமான வேதாகம மொழிநடையும் பேணப்பட்டுள்ளன. ‘துணைக் கிராமங்கள்’ என்ற சொல் மரபுத்தொடரின் நிர்வாக/சார்பு உறவைத் தெளிவாகச் சொல்கிறது; அடிக்குறிப்பு அதன் சொற்சார்ந்த உருவகத்தைப் பாதுகாக்கிறது. எல்லா அடிக்குறிப்பு குறிகளும் அவை விளக்கும் சொற்றொடர்களின் அருகில் முதன்மை உரையில் இடம்பெற்றுள்ளன.
