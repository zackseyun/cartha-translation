lexical_decisions:
- source_word: וּבְנוֹ
  choice: அவருடைய ... மகன்
  rationale: וְ மரபுப்பட்டியலின் தொடர்ச்சியை இணைக்கிறது; தமிழில் தொடக்கத்தில் ‘மேலும்’ என்று இயந்திரமாகச் சேர்ப்பதைவிட இயல்பான வாக்கிய அமைப்பில் அதன் தொடர்ச்சிப் பொருள் வெளிப்படுகிறது. בְנוֹ என்பதிலுள்ள மூன்றாம் ஆண்பால் ஒருமை உடைமைப் பின்னொட்டு ‘அவருடைய மகன்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: הַבְּכוֹר
  choice: மூத்த
  rationale: பிறப்பு வரிசையில் முதலில் பிறந்த மகனைக் குறிக்கிறது. நவீனத் தமிழில் மரபுப்பட்டியலுக்குப் பொருத்தமான இயல்பான சொல்லாக ‘மூத்த மகன்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: עַבְדּוֹן
  choice: அப்தோன்
  rationale: தனிப்பட்ட நபரின் பெயர்; எபிரெய ஒலிப்பைத் தமிழில் நெருக்கமாக எழுத்துப்பெயர்த்துள்ளது.
- source_word: וְצוּר
  choice: அடுத்து சூர்
  rationale: צוּר என்பது நபர்பெயர். பெயர்ப்பட்டியலில் திரும்பத் திரும்ப வரும் וְ-ஐ தமிழில் இயல்பாகக் காட்ட ‘அடுத்து’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: וְקִישׁ
  choice: கீஷ்
  rationale: தனிப்பட்ட நபரின் பெயர்; எபிரெய ஒலிப்புக்கு ஏற்ப எழுத்துப்பெயர்க்கப்பட்டுள்ளது.
- source_word: וּבַעַל
  choice: பாகால்
  rationale: இங்கு இது மரபுப்பட்டியலில் வரும் நபர்பெயர்; தெய்வத்தைக் குறிக்கும் பட்டமாக மொழிபெயர்க்காமல் பெயராக எழுத்துப்பெயர்க்கப்பட்டுள்ளது.
- source_word: וְנָדָב
  choice: நாதாப்
  rationale: தனிப்பட்ட நபரின் பெயர்; எபிரெய ஒலிப்புக்கு ஏற்ப எழுத்துப்பெயர்க்கப்பட்டுள்ளது.
