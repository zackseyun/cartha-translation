base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/005.yaml
  text: And from among all my sons—for Yahweh has given me many sons—he chose Solomon my son to sit on the throne of the kingdom of Yahweh over Israel[a][b].
translation:
  language: ta
  text: என் எல்லா மகன்களிலிருந்தும்—யாவே எனக்குப் பல மகன்களைத் தந்திருக்கிறார்—அவர் என் மகனான சாலொமோனை இஸ்ரவேலின்மேல் யாவேயின் அரசாட்சியின் அரியணையில் அமரும்படி தேர்ந்தெடுத்தார்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘யாவே எனக்குப் பல மகன்களைத் தந்தார்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல் இச்சூழலில் கடந்தகாலமாகவும், தற்போதைய நிலையை உணர்த்தும் வகையிலும் மொழிபெயர்க்கப்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘யாவேயின் அரசாட்சியின் அரியணை’ என்ற சொற்றொடர், சாலொமோன் மனித அரசனாக இருந்தபோதிலும், இஸ்ரவேலின் அரசாட்சி இறுதியில் யாவேக்கு உரியது என்பதை வலியுறுத்துகிறது.
    reason: cross_reference
lexical_decisions:
- source_word: וּמִכָּל בָּנַי
  choice: என் மகன்கள் எல்லாரிலிருந்தும்
  rationale: וּמִן־כָּל என்பது ஒரு பெரிய குழுவிலிருந்து ஒருவரைத் தேர்ந்தெடுப்பதைக் குறிக்கிறது. בָּנַי ஆண்பால் பன்மையாகவும் அரச வாரிசுரிமைச் சூழலுக்குரியதாகவும் இருப்பதால் ‘மகன்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: כִּי רַבִּים בָּנִים נָתַן לִי יְהוָה
  choice: யாவே எனக்கு அநேக மகன்களைத் தந்திருக்கிறார்
  rationale: כִּי இங்கு காரணத்தைத் தீர்மானமாக வலியுறுத்தாமல் விளக்கக் குறிப்பை அறிமுகப்படுத்துகிறது; அதனால் இடைக்குறிக்குள் தரப்பட்டுள்ளது. נָתַן என்பதன் கடந்தகாலச் செயலும் அதன் தற்போதைய விளைவும் தமிழில் ‘தந்திருக்கிறார்’ என்பதால் இயல்பாக வெளிப்படுகின்றன.
- source_word: וַיִּבְחַר בִּשְׁלֹמֹה בְנִי
  choice: அவர் என் மகன் சாலொமோனை ... தேர்ந்தெடுத்தார்
  rationale: בחר உடன் வரும் ב தேர்ந்தெடுக்கப்பட்ட நபரைக் குறிக்கிறது. முந்தைய உட்பிரிவிலுள்ள யாவேதான் வினையின் எழுவாய் என்பதைக் ‘அவர்’ தெளிவாக்குகிறது.
- source_word: לָשֶׁבֶת עַל כִּסֵּא
  choice: அரியணையில் அமரும்படி
  rationale: அரசாட்சிச் சூழலில் ישב என்பது அரியணையில் அமர்ந்து ஆட்சி செய்வதைக் குறிக்கிறது. மூலத்தின் உருவகத்தைச் சுருக்காமல் ‘அமரும்படி’ எனப் பாதுகாக்கிறது.
- source_word: מַלְכוּת יְהוָה
  choice: யாவேயின் அரசாட்சி
  rationale: מַלְכוּת என்பது சூழலின்படி ராஜ்யத்தையோ அரசாட்சியையோ குறிக்கலாம். இங்கு அரியணை மற்றும் இஸ்ரவேலின்மேல் ஆட்சி செய்தல் பற்றியதால் ‘அரசாட்சி’ இயல்பாக உள்ளது; அது யாவேக்கு உரியது என்பதும் மாறாமல் காக்கப்படுகிறது.
- source_word: עַל יִשְׂרָאֵל
  choice: இஸ்ரவேலின்மேல்
  rationale: அரியணை மற்றும் அரசாட்சி மொழிநடையில் עַל ஆளுகையின் பரப்பைக் குறிக்கிறது; ‘இஸ்ரவேலின்மேல்’ அதனை நேரடியாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יהוה என்ற இறைபெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: எபிரெய இறைபெயரைப் பட்டப்பெயராக மாற்றாமல் அதன் தனிப்பெயர்ச் சிறப்பைப் பாதுகாக்க ‘யாவே’ பயன்படுத்தப்பட்டது.
- issue: כִּסֵּא מַלְכוּת יְהוָה என்ற தொடரின் பொருள்
  choice: யாவேயின் அரசாட்சியின் அரியணை
  alternative: இஸ்ரவேலின் அரச அரியணை
  rationale: மூலத்தில் அரசாட்சி வெளிப்படையாக யாவேக்கு உரியதாகக் கூறப்படுகிறது. சாலொமோன் மனித அரசன் என்றாலும், அந்த அரசாட்சியின் இறுதி உரிமை யாவேக்கு உரியது என்ற இறையியல் அழுத்தத்தை மொழிபெயர்ப்பு குறைக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. விளக்க உட்பிரிவு நீண்ட கோடுகளுக்குள் வைக்கப்பட்டு எபிரெய வாக்கியத்தின் ஓட்டம் காக்கப்பட்டுள்ளது. ‘அநேக’ என்பது வேதாகமச் சூழலுக்கேற்ற கண்ணியமான சொல்; ‘பல’ என்பதும் இயல்பான மாற்றாக இருக்கலாம்.
