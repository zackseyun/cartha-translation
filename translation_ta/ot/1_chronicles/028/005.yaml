  source_fidelity: The draft accurately represents the selection from among David's sons, Yahweh as the chooser, Solomon's filial relation, enthronement, and Yahweh's ownership of the kingdom. The revised wording retains the Hebrew's explanatory parenthesis and the purpose clause. ‘அரசாட்சியின் அரியணை’ is a defensible rendering of כִּסֵּא מַלְכוּת יְהוָה.
