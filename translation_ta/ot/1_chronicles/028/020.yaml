base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/020.yaml
  text: And David said to Solomon his son[a], “Be strong and courageous, and do it. Do not fear or be dismayed, for Yahweh God, my God, is with you. He will not fail you or forsake you until all the work for the service of the house of Yahweh is finished.”
translation:
  language: ta
  text: தாவீது தன் மகன் சாலொமோனிடம், “வலிமையாயிரு, துணிவாயிரு; செயல்படு. அஞ்சாதே; கலங்காதே. ஏனெனில் யாவே தேவன், என் தேவன், உன்னோடு இருக்கிறார். யாவேவின் ஆலயத்தின் சேவைக்கான எல்லாப் பணிகளும் முடிவடையும்வரை அவர் உன்னைக் கைவிடமாட்டார்[a]; உன்னை விட்டுவிடவும் மாட்டார்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர் உன்னைக் கைநெகிழ விடமாட்டார்.” எபிரெய வினை ஆதரவைத் தளர்த்தாமல் இருப்பது அல்லது பிடியை விட்டுவிடாமல் இருப்பது என்ற பொருளையும் தரலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲזַק וֶאֱמַץ
  choice: வலிமைகொண்டு துணிவாயிரு
  rationale: இணைந்துள்ள இரு கட்டளைகளும் உடல் வலிமையை மட்டும் அல்லாமல் மனவுறுதியையும் துணிவையும் கோருகின்றன; இயல்பான நவீனத் தமிழில் இணைச்சொற்றொடராக வழங்கப்பட்டது.
- source_word: וַעֲשֵׂה
  choice: செயல்படு
  rationale: சூழலில் ஆலயப் பணியை மேற்கொள்ளும்படியான நேரடிக் கட்டளை. ‘அதைச் செய்’ என்பதைக் காட்டிலும் தமிழ் நடையில் இயல்பாகவும், செயலில் இறங்கும் வலியுறுத்தலைக் காக்கவும் ‘செயல்படு’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: אַל תִּירָא וְאַל תֵּחָת
  choice: அஞ்சாதே, கலங்காதே
  rationale: முதல் வினை பயத்தையும், இரண்டாவது வினை மனம் தளர்ந்து நிலைகுலைவதையும் குறிக்கின்றன; இரு தனித்த தடைகளும் காக்கப்பட்டன.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: எபிரெய தனிப்பெயரான நான்கெழுத்துத் திருப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட பெயர்வடிவில் வழங்குகிறது.
- source_word: אֱלֹהִים אֱלֹהַי
  choice: இறைவன், என் இறைவன்
  rationale: எபிரெய மூலத்திலுள்ள பொதுப்பெயரும் தாவீதின் தனிப்பட்ட உறவைக் காட்டும் மறுபடியும் கூறலும் காக்கப்பட்டன.
- source_word: עִמָּךְ
  choice: உன்னோடு இருக்கிறார்
  rationale: மூலத்தில் வெளிப்படையான வினை இல்லாத பெயர்ச்சொல் வாக்கியத்தைத் தமிழில் இயல்பாக நிகழ்காலத்தில் நிறைவு செய்கிறது.
- source_word: לֹא יַרְפְּךָ
  choice: உன்னைக் கைவிடமாட்டார்
  rationale: ரפה என்பதன் ஹிபீல் வடிவம் பிடியைத் தளர்த்துதல் அல்லது ஆதரவை நிறுத்துதல் என்ற பொருளைக் கொண்டது. தமிழில் ‘கைவிடமாட்டார்’ இயல்பான உறுதிமொழி; நுண்ணிய மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: וְלֹא יַעַזְבֶךָּ
  choice: உன்னைவிட்டு விலகவும் மாட்டார்
  rationale: முந்தைய வினையிலிருந்து வேறுபாட்டைக் காக்க, עזב என்பதன் விட்டுச் செல்லுதல்/விலகுதல் பொருள் இவ்வாறு வழங்கப்பட்டது.
- source_word: עַד לִכְלוֹת כָּל מְלֶאכֶת עֲבוֹדַת בֵּית יְהוָה
  choice: யெகோவாவின் ஆலயப் பணிக்குரிய வேலைகள் அனைத்தும் முடிவடையும்வரை
  rationale: அடர்ந்த எபிரெய இணைப்புத் தொடரிலுள்ள ‘வேலை’, ‘பணி/சேவை’, ‘யெகோவாவின் வீடு’ ஆகிய கூறுகளை இயல்பான தமிழில் காக்கிறது; இங்கு ‘வீடு’ என்பது ஆலயத்தைக் குறிப்பதால் ‘ஆலயம்’ பயன்படுத்தப்பட்டது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே
  rationale: மூலத்தில் பட்டமல்ல, தனிப்பெயரே உள்ளது. தமிழில் பொதுவாக அறியப்பட்ட நேரடி பெயர்வடிவைத் தேர்ந்தெடுத்து, ‘கர்த்தர்’ போன்ற பட்டத்தால் பெயரை மாற்றவில்லை.
- issue: ‘உன்னோடு இருக்கிறார்’ என்பதற்கும் ‘முடிவடையும்வரை’ என்பதற்கும் இடையிலான உறவு
  choice: கடவுளின் தற்போதைய உடனிருப்பையும், பணி முடியும் வரை அவர் கைவிடாமலும் விலகாமலும் இருப்பதையும் தனித்தனியே கூறுதல்
  alternative: கடவுள் பணி முடியும் வரை மட்டுமே உடனிருப்பார் என முழு வாக்கியத்தையும் காலவரம்பாகப் புரிதல்
  rationale: எபிரெய உரையில் עִמָּךְ என்பது தனியான பெயர்ச்சொல் வாக்கியம்; עַד־לִכְלוֹת என்பது நேரடியாக முன்னுள்ள ‘கைவிடமாட்டார், விட்டுவிடமாட்டார்’ என்ற வினைகளுக்கான எல்லையாக அமைகிறது. இதைத் தாண்டிய இறையியல் முடிவு சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரமான, மரியாதையும் தெளிவும் கொண்ட தமிழ் பயன்படுத்தப்பட்டது. அரசவைக் காலச் சூழலுக்கேற்ற கண்ணியமான நடை காக்கப்பட்டாலும், வழக்கொழிந்த சொற்களும் அளவுக்கு மீறிய சமயச் சொல்லாட்சியும் தவிர்க்கப்பட்டன. வசனத்தின் கட்டளைத் தீவிரமும் உறுதிமொழியின் ஆறுதலும் காக்கப்பட்டன.
