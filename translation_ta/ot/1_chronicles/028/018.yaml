source:
  edition: WLC
  text: וּ/לְ/מִזְבַּ֧ח הַ/קְּטֹ֛רֶת זָהָ֥ב מְזֻקָּ֖ק בַּ/מִּשְׁקָ֑ל וּ/לְ/תַבְנִ֣ית הַ/מֶּרְכָּבָ֗ה הַ/כְּרֻבִ֤ים זָהָב֙ לְ/פֹ֣רְשִׂ֔ים וְ/סֹכְכִ֖ים עַל אֲר֥וֹן בְּרִית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/018.yaml
  text: and for the altar of incense[a], refined gold by weight; and for the pattern of the chariot[b], the cherubim of gold spreading out their wings and overshadowing the ark of the covenant of Yahweh.
translation:
  language: ta
  text: தூபப் பீடத்திற்காக, எடையின்படி சுத்திகரிக்கப்பட்ட தங்கத்தையும்; தேரின் வடிவமைப்பிற்காகவும்[a], தங்கள் சிறகுகளை விரித்து யாவேயின் உடன்படிக்கைப் பெட்டியின் மேல் மூடியிருக்கும் தங்கக் கேருபீன்களுக்காகவும் தங்கத்தைக் கொடுத்தான்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தேரின் வடிவமைப்பு” எனும் எபிரெயத் தொடர் பொருள் காணக் கடினமானது. இது உடன்படிக்கைப் பெட்டியோடு தொடர்புடைய கேருபீன்-அரியணை அமைப்பைக் குறிக்கக்கூடும்.
    reason: alternative_reading
  - marker: b
    text: “கொடுத்தான்” என்பது இவ்வசனத்தின் எபிரெய உரையில் வெளிப்படையாக இல்லை; முந்தைய வசனங்களிலிருந்து பொருள் நிறைவுக்காக இங்கே சேர்க்கப்பட்டுள்ளது.
    reason: supplied_word
lexical_decisions:
- source_word: מִזְבַּח הַקְּטֹרֶת
  choice: தூபபீடம்
  rationale: ஆலய வழிபாட்டில் தூபம் செலுத்தப்படும் பலிபீடத்தைக் குறிக்கும் வழக்கமான, தெளிவான தமிழ் சொல்.
- source_word: זָהָב מְזֻקָּק
  choice: சுத்திகரிக்கப்பட்ட தங்கம்
  rationale: மְזֻקָּק என்பதிலுள்ள உலோகத்தைப் புடமிட்டுத் தூய்மைப்படுத்திய பொருளை நேரடியாக வெளிப்படுத்துகிறது.
- source_word: בַּמִּשְׁקָל
  choice: எடையின்படி
  rationale: அளவிடப்பட்ட எடைக்கு ஏற்ப தங்கம் ஒதுக்கப்பட்டதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: תַבְנִית
  choice: வடிவமைப்பு
  rationale: இச்சூழலில் திட்டம், மாதிரி, அமைப்புரு ஆகிய அர்த்த வாய்ப்புகளை உள்ளடக்கி, ஆலய வடிவமைப்புச் சூழலோடு பொருந்துகிறது.
- source_word: הַמֶּרְכָּבָה
  choice: தேர்
  rationale: எபிரெயச் சொல்லின் சாதாரண பொருளைத் தக்கவைத்து, கடினமான இத்தொடரை ‘அரியணை’ என்று விளக்கமாகத் தீர்மானித்துவிடாமல் விடுகிறது.
- source_word: הַכְּרֻבִים
  choice: கேருபீன்கள்
  rationale: வேதாகமத்தில் காணப்படும் தனிப்பட்ட விண்ணுலக உயிரினங்களுக்கான தொழில்நுட்பப் பெயரை ஒலிபெயர்ப்பாகப் பாதுகாக்கிறது.
- source_word: לְפֹרְשִׂים
  choice: தங்கள் சிறகுகளை விரித்து
  rationale: ‘விரித்தல்’ என்ற வினையை நேரடியாகத் தருகிறது; சூழலால் தெளிவாகக் குறிக்கப்படும் ‘சிறகுகள்’ தமிழில் புரிதலுக்காக வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: וְסֹכְכִים
  choice: மூடி நிற்கும்
  rationale: சிறகுகள் பெட்டியின் மேல் பாதுகாப்பாகப் பரந்து மூடியிருக்கும் உருவகத்தை இயல்பான தமிழில் தருகிறது; ‘நிழலிடும்’ என்பதைக் காட்டிலும் உடல் அமைப்பைத் தெளிவாக்குகிறது.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: யாவேயின் உடன்படிக்கைப் பெட்டி
  rationale: முழுக் கட்டமைப்பையும் இயல்பான தமிழ் உடைமைத் தொடராகத் தருவதோடு, יהוה என்ற உடன்படிக்கைப் பெயரை ‘யாவே’ என்று வெளிப்படையாகக் காக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பொதுப்பட்டப் பெயர் அல்லாமல் நான்கெழுத்து உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது; ஆகவே அதனைத் தமிழில் ஒலிபெயர்த்து வழங்குவது மூல வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: ‘தேர்’ மற்றும் கேருபீன்களின் உறவு
  choice: ‘தங்கக் கேருபீன்களாகிய தேர்’ என்று இலக்கண உறவைத் திறந்த நிலையில் வைத்தல்
  alternative: ‘கேருபீன் அரியணை அமைப்பு’
  rationale: இத்தொடர் கேருபீன்களோடு தொடர்புடைய தேர் அல்லது அரியணை அமைப்பைக் குறிக்கலாம்; ஆனால் மூலத்தில் ‘அரியணை’ என்ற சொல் இல்லை. எனவே விளக்கத்தை அடிக்குறிப்பில் தருவதோடு, உரையில் ‘தேர்’ என்பதைக் காக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், ஆலயப் பொருட்களின் பட்டியல் நடையைத் தக்கவைத்துள்ளோம். ‘தூபபீடம்’, ‘உடன்படிக்கைப் பெட்டி’ போன்ற பரவலாகப் புரியும் வேதாகமச் சொற்கள் பயன்படுத்தப்பட்டுள்ளன. எபிரெயத்தில் வினைச்சொல் இல்லாத பட்டியல் கூறு தமிழில் தனிவசனமாக இயல்பாக நிறைவடைய ‘கொடுத்தான்’ சேர்க்கப்பட்டு அடிக்குறிப்பில் வெளிப்படுத்தப்பட்டுள்ளது.
