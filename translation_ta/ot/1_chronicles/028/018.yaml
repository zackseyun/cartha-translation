  to: தூபப் பீடத்திற்காக, எடையின்படி சுத்திகரிக்கப்பட்ட தங்கத்தையும்; தேரின் வடிவமைப்பிற்காகவும்[a], தங்கள் சிறகுகளை விரித்து யாவேயின் உடன்படிக்கைப் பெட்டியின் மேல் மூடியிருக்கும் தங்கக் கேருபீன்களுக்காகவும் தங்கத்தைக் கொடுத்தான்.[b]
