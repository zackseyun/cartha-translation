  text: וַ/יָּ֨קָם דָּוִ֤יד הַ/מֶּ֨לֶךְ֙ עַל רַגְלָ֔י/ו וַ/יֹּ֕אמֶר שְׁמָע֖וּ/נִי אַחַ֣/י וְ/עַמִּ֑/י אֲנִ֣י עִם לְבָבִ֡/י לִ/בְנוֹת֩ בֵּ֨ית מְנוּחָ֜ה לַ/אֲר֣וֹן בְּרִית יְהוָ֗ה וְ/לַ/הֲדֹם֙ רַגְלֵ֣י אֱלֹהֵ֔י/נוּ וַ/הֲכִינ֖וֹתִי לִ/בְנֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/002.yaml
  text: Then King David rose to his feet and said[a], “Hear me, my brothers and my people. It was in my heart to build a house of rest for the ark of the covenant of Yahweh, and for the footstool of our God[c][b], and I made preparations to build it.”
translation:
  language: ta
  text: 'அப்போது தாவீது அரசர் எழுந்து நின்று கூறினார்: “என் சகோதரர்களே[a], என் மக்களே, எனக்குச் செவிகொடுங்கள். யாவேவின் உடன்படிக்கைப் பெட்டிக்கும் நம் கடவுளின் கால்மணைக்கும்[c] ஓய்விடமாக ஒரு இல்லத்தைக்[b] கட்ட வேண்டும் என்பது என் உள்ளத்தில் இருந்தது. அதைக் கட்டுவதற்கான ஏற்பாடுகளையும் நான் செய்தேன்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “என் உறவினர்களே” என்றும் மொழிபெயர்க்கலாம். எபிரேய மூலத்தில் சொல்லுக்குச் சொல் “என் சகோதரர்களே” என்று உள்ளது; இது பொதுக்கூட்டத்தில் ஆண்பால் பன்மை வடிவில் சொல்லப்பட்ட அழைப்பு.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், “ஓய்வின் வீடு.” உடன்படிக்கைப் பெட்டி நிலையாகத் தங்கும் இடத்தை இது குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: உடன்படிக்கைப் பெட்டி இஸ்ரவேலின் கடவுளுடைய பிரசன்னத்துடன் தொடர்புடைய கால்மணையாக இங்கு வருணிக்கப்படுகிறது; சங்கீதம் 132:7-ஐ ஒப்பிடுக.
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּקָם ... עַל רַגְלָיו
  choice: எழுந்து நின்று
  rationale: எழுதல்/நிற்றல் என்ற எபிரேயச் சொற்றொடரின் செயலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: שְׁמָעוּנִי
  choice: எனக்குச் செவிகொடுங்கள்
  rationale: பொதுக்கூட்டத்தில் விடுக்கப்படும் கண்ணியமான, வலியுறுத்தப்பட்ட அழைப்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: אַחַי וְעַמִּי
  choice: என் சகோதரர்களே, என் மக்களே
  rationale: மூலத்தின் ஆண்பால் பன்மையான உறவுச் சொல்லையும் தேசிய அடையாளத்தையும் தனித்தனியாகப் பாதுகாக்கிறது.
- source_word: אֲנִי עִם לְבָבִי
  choice: என்பது என் உள்ளத்தில் இருந்தது
  rationale: உள்ளார்ந்த எண்ணம் அல்லது தீர்மானத்தைக் குறிக்கும் எபிரேய மரபுத்தொடரின் உருவகத்தை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: בֵּית מְנוּחָה
  choice: ஓய்விடமான ஓர் ஆலயம்
  rationale: பெட்டி நிலையாகத் தங்கும் ‘ஓய்வின் வீடு’ என்ற கருத்தையும் வழிபாட்டுக் கட்டடச் சூழலையும் இயல்பாகத் தருகிறது; சொற்பொருள் மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לַאֲרוֹן בְּרִית יְהוָה
  choice: யாவேவின் உடன்படிக்கைப் பெட்டிக்கு
  rationale: எபிரேய இணைப்புத் தொடரைத் தெளிவான தமிழில் தருவதோடு, தெய்வீகப் பெயரை ஒலிபெயர்க்கிறது.
- source_word: וְלַהֲדֹם רַגְלֵי אֱלֹהֵינוּ
  choice: நம் கடவுளின் கால்மணைக்கு
  rationale: ‘கால்மணை’ என்ற மூல உருவகத்தை விளக்கமாக மாற்றாமல் பாதுகாக்கிறது; பெட்டியுடனான தொடர்பு அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: וַהֲכִינוֹתִי לִבְנוֹת
  choice: அதைக் கட்டுவதற்கான ஏற்பாடுகளையும் நான் செய்திருந்தேன்
  rationale: கட்டுமானத்துக்காக முன்கூட்டியே ஆயத்தம் செய்த பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது; சூழலிலிருந்து புரியும் செயப்படுபொருளை ‘அதை’ என வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் நேரடியாக உள்ள நான்கு எழுத்துத் தெய்வீகப் பெயரை பொதுப்பட்டமாக மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: அரசர் பெட்டியை ‘நம் கடவுளின் கால்மணை’ என்று குறிப்பிடும் தொடர்பு
  choice: இணைப்புச் சொல்லான ‘மற்றும்’ என்பதைக் காத்து, தொடர்பை அடிக்குறிப்பில் விளக்குதல்
  alternative: ‘அதாவது, நம் கடவுளின் கால்மணை’ என்று வெளிப்படையான ஒத்திணைப்பாக மொழிபெயர்த்தல்
  rationale: எபிரேய வாவ் இணைப்பில் ஒத்திணைப்பு சாத்தியமானாலும் அது வெளிப்படையாகக் குறிக்கப்படவில்லை; ஆகவே மூலத்தின் இலக்கணத் தெளிவின்மையை முதன்மை உரையில் பாதுகாக்கிறது.
- issue: אַחַי என்ற ஆண்பால் பன்மை உறவுச்சொல்
  choice: என் சகோதரர்களே
  alternative: என் உறவினர்களே; சகோதர சகோதரிகளே
  rationale: மூலத்தின் ஆண்பால் வடிவத்தைப் பாதுகாக்கிறது; பொதுக்கூட்ட உரையில் அது விரிவான உறவுக் குழுவைக் குறிக்கக்கூடும் என்பதை அடிக்குறிப்பில் குறிப்பிடுகிறது.
translation_notes:
  register: நவீன பொதுத் தமிழில் கண்ணியமான அரசவைக் குரல் பேணப்பட்டுள்ளது. ‘உடன்படிக்கைப் பெட்டி’, ‘கால்மணை’, ‘ஆலயம்’ ஆகியவை வாசகருக்குப் புரியத்தக்கதாயும் மூலத்தின் வழிபாட்டுச் சூழலைத் தக்கவைக்கத்தக்கதாயும் தேர்ந்தெடுக்கப்பட்டன. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
