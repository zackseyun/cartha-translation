source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר לִ֔/י שְׁלֹמֹ֣ה בִנְ/ךָ֔ הֽוּא יִבְנֶ֥ה בֵיתִ֖/י וַ/חֲצֵרוֹתָ֑/י כִּי בָחַ֨רְתִּי ב֥/וֹ לִ/י֙ לְ/בֵ֔ן וַ/אֲנִ֖י אֶֽהְיֶה לּ֥/וֹ לְ/אָֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/006.yaml
  text: And he said to me[a], ‘Solomon your son—he will build my house and my courts, for I have chosen him for myself as a son, and I will be to him as a father.’
translation:
  language: ta
  text: அவர் என்னிடம், “உன் மகன் சாலொமோனே என் ஆலயத்தையும் என் முற்றங்களையும் கட்டுவான். ஏனெனில், அவனை எனக்கென மகனாகத் தேர்ந்தெடுத்தேன்; நான் அவனுக்குத் தந்தையாக இருப்பேன்” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר לִי
  choice: அவர் என்னிடம் … என்றார்
  rationale: אמר + לִי என்பதன் இயல்பான தமிழ் கதைநடை வடிவம்; நேரடிக் கூற்றைச் சுற்றி வரும் ‘என்றார்’ தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: שְׁלֹמֹה בִנְךָ הוּא
  choice: உன் மகன் சாலொமோனே
  rationale: הוּא தரும் வலியுறுத்தலை ‘-ஏ’ என்னும் தமிழ் வலியுறுத்தல் உருபு இயல்பாக வெளிப்படுத்துகிறது; பெயரும் உறவுமுறையும் தெளிவாகத் தக்கவைக்கப்படுகின்றன.
- source_word: יִבְנֶה בֵיתִי
  choice: என் ஆலயத்தைக் கட்டுவான்
  rationale: בֵּיתִי என்பதன் நேரடிப் பொருள் ‘என் வீடு’ என்றாலும், இச்சூழலில் அது கர்த்தரின் ஆலயத்தைக் குறிக்கிறது. தமிழில் ‘என் வீடு’ என்பது சாதாரண குடியிருப்பாகத் தவறாகப் புரியக்கூடும்; ஆகவே சூழல்சார் குறிப்பு தெளிவாக வழங்கப்படுகிறது.
- source_word: וַחֲצֵרוֹתָי
  choice: அதன் முற்றங்களையும்
  rationale: ஆலய வளாகத்தின் சூழப்பட்ட வெளிப்பகுதிகளைக் குறிக்கும் חָצֵר என்பதற்கு ‘முற்றங்கள்’ இயல்பான தமிழ் இணை. எபிரேயத்தில் ‘என் முற்றங்கள்’ என இருந்தாலும், தமிழில் ‘அதன்’ என்பது அவை ஆலயத்துக்குரியவை என்பதைத் தெளிவாக இணைக்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: சாலொமோன் கட்டுபவனாக இருப்பதற்கான காரணத்தை அறிமுகப்படுத்தும் இணைப்பாகத் தெளிவாகச் செயல்படுகிறது.
- source_word: בָחַרְתִּי בוֹ לִי לְבֵן
  choice: அவனை எனக்கென மகனாகத் தேர்ந்தெடுத்தேன்
  rationale: לִי לְבֵן என்ற இரட்டை לְ அமைப்பிலுள்ள ‘எனக்கென’ என்ற தனிப்பட்ட தேர்வையும் ‘மகனாக’ என்ற உடன்படிக்கை உறவையும் சுருக்காமல் காக்கிறது.
- source_word: וַאֲנִי אֶהְיֶה לוֹ לְאָב
  choice: நான் அவனுக்குத் தந்தையாக இருப்பேன்
  rationale: ‘அவனுக்கு ஒரு தந்தையாக இருப்பேன்’ என்ற எபிரேய உறவுமுறை வடிவத்தை இயல்பான தமிழில் நெருக்கமாகத் தக்கவைக்கிறது; வெறும் உவமை எனச் சுருக்காமல் தந்தை–மகன் உறவை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: தேவனுக்கும் சாலொமோனுக்கும் இடையிலான தந்தை–மகன் மொழி
  choice: “அவனை எனக்கென மகனாகத் தேர்ந்தெடுத்தேன்; நான் அவனுக்குத் தந்தையாக இருப்பேன்” என்று நேரடியாகத் தக்கவைத்தல்
  alternative: “அவனை என் மகனாகத் தேர்ந்தெடுத்தேன்; நான் அவனுடைய தந்தையாக இருப்பேன்”
  rationale: இது அரச உடன்படிக்கையின் உறவுமுறை மொழியை வலுவிழக்கச் செய்யாமல் காக்கிறது. அதேவேளை, உடனடியான சாலொமோன் சூழலைத் தாண்டிய பிற்கால இறையியல் முடிவுகளை மொழிபெயர்ப்புக்குள் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன தரத் தமிழ்; பொதுவாசகர்களுக்கு எளிதில் புரியும், அதேவேளை வேதாகமக் கண்ணியத்தைத் தக்கவைக்கும் நடை. வலியுறுத்தலுக்கு ‘சாலொமோனே’ பயன்படுத்தப்பட்டுள்ளது. அடிக்குறிப்பு தேவையில்லை; மாற்று இலக்கண வடிவங்கள் முதன்மை உரையிலேயே பொருள் இழப்பின்றி பிரதிபலிக்கப்படுகின்றன.
