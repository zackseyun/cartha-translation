  text: וַ/יִּבְחַ֡ר יְהוָ֣ה אֱלֹהֵי֩ יִשְׂרָאֵ֨ל בִּ֜/י מִ/כֹּ֣ל בֵּית אָבִ֗/י לִ/הְי֨וֹת לְ/מֶ֤לֶךְ עַל יִשְׂרָאֵל֙ לְ/עוֹלָ֔ם כִּ֤י בִֽ/יהוּדָה֙ בָּחַ֣ר לְ/נָגִ֔יד וּ/בְ/בֵ֥ית יְהוּדָ֖ה בֵּ֣ית אָבִ֑/י וּ/בִ/בְנֵ֣י אָבִ֔/י בִּ֣/י רָצָ֔ה לְ/הַמְלִ֖יךְ עַל כָּל יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/004.yaml
  text: Yet Yahweh[a], the God of Israel, chose me from all my father's house to be king over Israel forever; for he chose Judah as leader, and in the house of Judah, my father's house, and among my father's sons[b], he took pleasure in me to make me king over all Israel.
translation:
  language: ta
  text: ஆயினும், இஸ்ரவேலின் கடவுளாகிய யாவே, என் தந்தையின் குடும்பத்தார் அனைவரிலிருந்தும் என்னைத் தேர்ந்தெடுத்து, இஸ்ரவேலின்மேல் என்றென்றும் அரசனாக இருக்கச் செய்தார்[a]. ஏனெனில், அவர் யூதாவைத் தலைவனாகத் தேர்ந்தெடுத்தார்; யூதா வம்சத்திற்குள் என் தந்தையின் குடும்பத்தைத் தேர்ந்தெடுத்தார்; என் தந்தையின் மகன்களுள் என்னை விரும்பி, இஸ்ரவேல் முழுவதின்மேலும் என்னை அரசனாக்கினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “என்றென்றும்” என்பது நீடித்த அல்லது நிலையான காலத்தைக் குறிக்கப் பயன்படும் எபிரெயச் சொல்லின் மொழிபெயர்ப்பு; இங்கே அது தாவீதிய அரசாட்சியின் சூழலில் வருகிறது.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைவனின் தனிப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், எபிரெய ஒலிப்புக்கு ஏற்ற தமிழாக்கமாக வழங்குகிறது.
- source_word: וַיִּבְחַר / בָּחַר
  choice: தேர்ந்தெடுத்தார்
  rationale: இரு இடங்களிலும் வரும் ஒரே எபிரெய வினையின் மீளுரைப்பைத் தக்கவைக்கிறது.
- source_word: בִּי מִכֹּל בֵּית אָבִי
  choice: என் தந்தையின் குடும்பத்தார் அனைவரிலிருந்தும் என்னை
  rationale: தந்தைவழிக் குடும்பத்துக்குள் இருந்து தாவீது தேர்வு செய்யப்பட்டதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: לִהְיוֹת לְמֶלֶךְ
  choice: அரசனாக இருக்கச் செய்தார்
  rationale: நியமனத்தின் விளைவைத் தெளிவுபடுத்தும் இயல்பான தமிழ் அமைப்பு.
- source_word: לְעוֹלָם
  choice: என்றென்றும்
  rationale: தாவீதிய அரசாட்சியின் நீடித்த, உடன்படிக்கைசார் பரப்பை விளக்கிச் சுருக்காமல் பாதுகாக்கிறது.
- source_word: לְנָגִיד
  choice: தலைவனாக
  rationale: நாகீத் என்பதன் ஆட்சி மற்றும் தலைமை நுணுக்கத்தை, நவீன தமிழில் தேவையற்ற தொழில்நுட்ப வேறுபாடின்றி தெரிவிக்கிறது.
- source_word: וּבְבֵית יְהוּדָה בֵּית אָבִי
  choice: யூதாவின் குடும்பத்தில் என் தந்தையின் குடும்பத்தையும்
  rationale: யூதா முதல் தந்தையின் குடும்பம் வரை சுருங்கிவரும் தேர்வின் வரிசையையும் எபிரெய בְ முன்னிடைச்சொல்லையும் தக்கவைக்கிறது.
- source_word: וּבִבְנֵי אָבִי
  choice: என் தந்தையின் மக்களிடையே
  rationale: ‘சகோதரர்கள்’ என்று பொதுமைப்படுத்தாமல் ‘என் தந்தையின் மகன்கள்’ என்ற வம்சவழிச் சொல்லைத் தக்கவைக்கிறது.
- source_word: בִּי רָצָה
  choice: என்னையும் விரும்பி
  rationale: ராட்சா என்பதிலுள்ள சாதகமான விருப்பம் அல்லது பிரியம் என்ற நுணுக்கத்தை, ‘தேர்ந்தெடுத்தார்’ என்பதோடு ஒன்றாக்காமல் காட்டுகிறது.
- source_word: לְהַמְלִיךְ
  choice: அரசனாக்கினார்
  rationale: மாலக் வினையின் காரணவினைப் பொருளான ‘ஒருவரை அரசனாக்குதல்’ என்பதை நேராகத் தருகிறது.
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: இஸ்ரவேல் முழுவதற்கும்
  rationale: அதிகாரத்தின் முழு பரப்பையும் இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: לְעוֹלָם என்பதன் காலப் பொருள்
  choice: என்றென்றும்
  alternative: நெடுங்காலத்திற்கு
  rationale: இது தாவீதின் தனிப்பட்ட ஆயுளை மட்டும் குறிக்கிறதா அல்லது நீடித்த வம்ச அரசாட்சியை நோக்குகிறதா என்ற இறையியல் பதற்றத்தைச் சுருக்காமல், மூலத்தின் வலிமையைப் பாதுகாக்கிறது.
- issue: נָגִיד என்பதன் பதவிப் பொருள்
  choice: தலைவன்
  alternative: ஆளுநர்; அதிபதி; இளவரசன்
  rationale: அதிகாரப்பூர்வ தலைமைப் பொருளை வெளிப்படுத்துகிறது; ஆனால் ‘அரசன்’ என்பதுடன் மூலத்தில் இல்லாத துல்லியமான பதவி வேறுபாட்டைத் திணிப்பதில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘குடும்பம்’ என்பது בֵּית என்ற சொல்லின் வம்சவழிக் குடும்பப் பொருளில் பயன்படுத்தப்பட்டுள்ளது; ‘என் தந்தையின் மக்கள்’ என்பது சூழலில் அவரது தந்தையின் மகன்களைக் குறிக்கிறது.
