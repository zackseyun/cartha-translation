base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/007.yaml
  text: And I will establish his kingdom forever[a], if he is strong to do my commandments and my judgments[c][b], as at this day.
translation:
  language: ta
  text: அவன் இந்நாளில் செய்வதுபோல் என் கட்டளைகளையும் என் நீதிநியமங்களையும் செய்வதில் உறுதியாக இருந்தால்[b], அவனுடைய அரசாட்சியை என்றென்றும் நிலைநிறுத்துவேன்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனுடைய அரசாட்சியை உறுதிப்படுத்துவேன்” அல்லது “உறுதியாக்குவேன்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “என் கட்டளைகளையும் என் நீதிநியமங்களையும் செய்வதில் உறுதியாக நிலைத்திருந்தால்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲכִינוֹתִי
  choice: நிலைநிறுத்துவேன்
  rationale: כון என்பதன் ஹிஃபில் வடிவம் ஒன்றை உறுதியாக நிலைக்கச் செய்வதைக் குறிக்கிறது; அரசைப் பற்றிய சூழலில் ‘நிலைநிறுத்துவேன்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: מַלְכוּתוֹ
  choice: அவனுடைய அரசு
  rationale: מַלְכוּת என்பது அரசாட்சி, ஆட்சி, அரசு ஆகிய பொருள்களைத் தரலாம். வம்ச ஆட்சியின் நீடிப்பைச் சுட்டும் இச்சூழலில் ‘அரசு’ பரந்த பொருளைத் தக்கவைக்கிறது.
- source_word: עַד לְעוֹלָם
  choice: என்றென்றும்
  rationale: நீடித்த நிலைத்தன்மையைக் குறிக்கும் எபிரெயச் சொற்றொடரின் வலிமையை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: אִם
  choice: இருந்தால்
  rationale: வாக்குறுதியின் நிபந்தனைத் தன்மையைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: יֶחֱזַק
  choice: உறுதியாக இருந்தால்
  rationale: חזק இங்கு உடல் வலிமையைவிட கீழ்ப்படிவதில் உறுதியுடனும் திடமுடனும் இருப்பதைக் குறிக்கிறது.
- source_word: לַעֲשׂוֹת
  choice: செய்வதில்
  rationale: עשה என்பதன் நேரடிப் பொருளான ‘செய்’ என்பதைக் காக்கிறது; ‘கைக்கொள்’ என்று விளக்கமாக மாற்றவில்லை.
- source_word: מִצְוֺתַי
  choice: என் கட்டளைகள்
  rationale: உடன்படிக்கை மற்றும் சட்டச் சூழலுக்குரிய கட்டளைப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: וּמִשְׁפָּטַי
  choice: என் நீதிநியமங்கள்
  rationale: מִשְׁפָּטִים என்பதிலுள்ள நீதித்துறை மற்றும் விதிமுறை சார்ந்த இரு நிழற்பொருள்களையும் ‘நீதிநியமங்கள்’ சுருக்கமாகத் தக்கவைக்கிறது.
- source_word: כַּיּוֹם הַזֶּה
  choice: இந்நாளில் செய்வதுபோல்
  rationale: ‘இந்த நாளைப்போல்’ என்ற எபிரெய மரபுத்தொடர், தற்போது அவன் செய்வதைப்போல என்ற பொருளைக் கொண்டது; தமிழில் தெளிவிற்காக வினைச்செயல் வெளிப்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: சாலொமோனின் அரசு நிலைநிறுத்தப்படுவது குறித்த வாக்குறுதியின் நிபந்தனைத் தன்மை
  choice: ‘இருந்தால்’ என வெளிப்படையான நிபந்தனையாக மொழிபெயர்க்கப்பட்டது.
  alternative: நிபந்தனையைத் தளர்த்தி, சாலொமோனின் குணத்தை மட்டும் விவரிப்பதாக மொழிபெயர்த்தல்.
  rationale: אִם தெளிவாக நிபந்தனையை அறிமுகப்படுத்துகிறது. தாவீதுக்கான வாக்குறுதியின் நிபந்தனையற்ற அம்சங்களோடு இதை அமைதியாக ஒத்திசைக்காமல், மூலத்திலுள்ள இறையியல் பதற்றம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயச் சொல் வரிசை தமிழின் இயல்பான நிபந்தனை–முதன்மை வாக்கிய வரிசைக்கு மாற்றப்பட்டுள்ளது. ‘இந்நாளில்’ என்பது ‘இப்போது அவன் செய்வதுபோல்’ என்ற மூலமொழி மரபுப் பொருளோடு உரையிலேயே தெளிவாக்கப்பட்டுள்ளது; எனவே அதற்கென தனிக் குறிப்பு தேவையில்லை.
