id: 1CH.28.11
reference: 1 Chronicles 28:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יִּתֵּ֣ן דָּוִ֣יד לִ/שְׁלֹמֹ֣ה בְנ֡/וֹ אֶת תַּבְנִ֣ית הָ/אוּלָם֩ וְֽ/אֶת בָּ֨תָּ֜י/ו וְ/גַנְזַכָּ֧י/ו וַ/עֲלִיֹּתָ֛י/ו וַ/חֲדָרָ֥י/ו הַ/פְּנִימִ֖ים וּ/בֵ֥ית הַ/כַּפֹּֽרֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/011.yaml
  text: Then David gave to Solomon his son the plan of the portico[a], its houses, its treasuries, its upper rooms, its inner chambers, and the house of the mercy seat.
translation:
  language: ta
  text: பின்பு தாவீது தன் மகன் சாலொமோனிடம் முன்மண்டபம், அதன் கட்டடங்கள், அதன் கருவூலங்கள், அதன் மேலறைகள், அதன் உட்புற அறைகள், கிருபாசனத்தின் அறை[a] ஆகியவற்றுக்கான வரைபடத்தைக் கொடுத்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பாவநிவாரண மூடியின் அறை.” எபிரெயச் சொல் மகா பரிசுத்த இடத்திலிருந்த உடன்படிக்கைப் பெட்டியின் மூடியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּבְנִית
  choice: வரைபடம்
  rationale: ஆலயக் கட்டுமானச் சூழலில் இச்சொல் குறிப்பிட்ட வடிவமைப்பு அல்லது கட்டடத் திட்டத்தைக் குறிக்கிறது; நவீன தமிழில் ‘வரைபடம்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: הָאוּלָם
  choice: முன்மண்டபம்
  rationale: பெரிய கட்டடத்தின் நுழைவுப் பகுதியில் அமைந்த மண்டபத்தை இச்சொல் குறிக்கிறது; ஆலயக் கட்டடச் சூழலுக்கு ‘முன்மண்டபம்’ பொருத்தமானது.
- source_word: בָּתָּיו
  choice: அதன் கட்டடங்கள்
  rationale: எழுத்துப்பொருள் ‘அதன் வீடுகள்’ என்றாலும், இங்கு ஆலய வளாகத்தின் கட்டுமானப் பிரிவுகள் அல்லது இணைப்புக் கட்டடங்களைக் குறிப்பதால் ‘கட்டடங்கள்’ தெளிவானது.
- source_word: גַנְזַכָּיו
  choice: அதன் கருவூலங்கள்
  rationale: விலையுயர்ந்த அல்லது அர்ப்பணிக்கப்பட்ட பொருட்கள் வைக்கப்பட்ட சேமிப்பிடங்களை ஆலயச் சூழலில் ‘கருவூலங்கள்’ துல்லியமாகக் குறிக்கிறது.
- source_word: עֲלִיֹּתָיו
  choice: அதன் மேலறைகள்
  rationale: மேல்தளத்தில் அமைந்த அறைகளை நேரடியாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: חֲדָרָיו הַפְּנִימִים
  choice: அதன் உட்புற அறைகள்
  rationale: உள்ளே அமைந்த அறைகள் என்பதைக் காட்டுகிறது; எபிரெயத்தில் இல்லாத மிகையுயர்வு பொருளைச் சேர்க்கவில்லை.
- source_word: בֵית הַכַּפֹּרֶת
  choice: கிருபாசனத்தின் அறை
  rationale: சொல்லுக்குச் சொல் ‘கிருபாசனத்தின் வீடு’; இங்கு உடன்படிக்கைப் பெட்டியின் மூடி இருந்த பரிசுத்த இடத்தின் அறையைக் குறிப்பதால் நவீன தமிழில் ‘அறை’ தெளிவான கட்டடவியல் பொருளைத் தருகிறது.
- source_word: וַיִּתֵּן
  choice: பின்பு ... கொடுத்தார்
  rationale: தொடர்ச்சியான கதைநிகழ்வை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: כַּפֹּרֶת என்ற பரிசுத்த இடச் சொல்லின் மொழிபெயர்ப்பு
  choice: கிருபாசனம்
  alternative: பாவநிவாரண மூடி
  rationale: இச்சொல் மகா பரிசுத்த இடத்திலிருந்த உடன்படிக்கைப் பெட்டியின் மூடியைக் குறிக்கிறது. ‘கிருபாசனம்’ பழக்கமான திருவழிபாட்டுச் சொல்லைத் தக்கவைக்கிறது; ‘பாவநிவாரண மூடி’ அதன் செயல்சார்ந்த மாற்றுப் பொருளாக அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான கட்டடவியல் நடையில் மொழிபெயர்க்கப்பட்டது. பட்டியலின் உடைமைத் தொடர்புகள் தெளிவாக வைக்கப்பட்டுள்ளன; ஆலயத் தொழில்நுட்பச் சொல்லுக்கு அடிக்குறிப்பு வழங்கப்பட்டுள்ளது.
