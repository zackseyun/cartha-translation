translation_notes:
  register: நவீன, பொதுவாகப் புரியும், கண்ணியமான தமிழ் நடை பயன்படுத்தப்பட்டுள்ளது. இவ்வசனம் முந்தைய வாக்கியத் தொடரின் பட்டியல் அமைப்பில் இருப்பதால் ‘மேலும்’ மூலம் இணைக்கப்பட்டுள்ளது; தமிழில் வாக்கியத்தை நிறைவு செய்யச் சூழலிலிருந்து ‘கொடுத்தான்’ சேர்க்கப்பட்டுள்ளது. எபிரெய பகிர்வுநிலை மீளுரை பிரதான உரையில் இயல்பாக்கப்பட்டு, அதன் வடிவமும் வலியுறுத்தலும் அடிக்குறிப்பில் பதிவு செய்யப்பட்டுள்ளன.
