  text: and the forks, the basins, and the pitchers of pure gold; and for the golden bowls, by weight for each bowl and bowl; and for the silver bowls, by weight for each bowl and bowl.
translation:
  language: ta
  text: 'மேலும், தூய தங்கத்தாலான முள்கரண்டிகள், கலங்கள், ஊற்றுக் குடங்கள்[b]; தங்கக் கிண்ணங்கள் ஒவ்வொன்றுக்கும்[a] அதற்குரிய எடையும், வெள்ளிக் கிண்ணங்கள் ஒவ்வொன்றுக்கும் அதற்குரிய எடையும்.


    [a] எபிரெய மொழியில், “ஒவ்வொன்றுக்கும்” என்பதற்கு சொல்லுக்குச் சொல் “கிண்ணத்திற்கும் கிண்ணத்திற்கும்” என்று மீளுரையாக உள்ளது. ஒவ்வொரு கலனுக்கும் தனித்தனியாக எடை நிர்ணயிக்கப்பட்டிருந்ததை இது குறிக்கிறது.


    [b] அல்லது, “ஊற்றுக் கலன்கள்.” எபிரெயச் சொல் திரவத்தை ஊற்றப் பயன்படும் ஒரு கலனைக் குறிக்கிறது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில், “ஒவ்வொன்றுக்கும்” என்பதற்கு சொல்லுக்குச் சொல் “கிண்ணத்திற்கும் கிண்ணத்திற்கும்” என்று மீளுரையாக உள்ளது. ஒவ்வொரு கலனுக்கும் தனித்தனியாக எடை நிர்ணயிக்கப்பட்டிருந்ததை இது குறிக்கிறது.
    reason: lexical_alternative
