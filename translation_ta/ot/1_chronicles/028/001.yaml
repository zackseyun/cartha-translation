translation_notes:
  register: நவீனத் தரத் தமிழில், முறையான அரச மற்றும் இராணுவக் கூடுகைக்கு ஏற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. நீண்ட எபிரெயப் பட்டியல் தமிழில் வாசிக்கத் தெளிவாக இருக்க இறுதியில் ‘இதில் அடங்கினர்’ சேர்க்கப்பட்டுள்ளது; இது புதிய பங்கேற்பாளர்களைச் சேர்க்காமல் முன் பட்டியலின் தொடரமைப்பை நிறைவு செய்கிறது. ஆங்கில ஆலோசனை உரையில் அடிக்குறி ‘கோத்திரங்கள்’ என்பதற்குப் பின் தோன்றினாலும் அதன் உள்ளடக்கம் הַסָּרִיסִים என்பதைக் குறிப்பதால், தமிழில் ‘அரண்மனை அதிகாரிகள்’ என்பதற்குப் பின் சரியாக வைக்கப்பட்டுள்ளது.
