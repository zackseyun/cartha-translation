source:
  edition: WLC
  text: וַ/יַּקְהֵ֣ל דָּוִ֣יד אֶת כָּל שָׂרֵ֣י יִשְׂרָאֵ֡ל שָׂרֵ֣י הַ/שְּׁבָטִ֣ים וְ/שָׂרֵ֣י הַ/מַּחְלְק֣וֹת הַ/מְשָׁרְתִ֪ים אֶת הַ/מֶּ֟לֶךְ וְ/שָׂרֵ֣י הָ/אֲלָפִ֣ים וְ/שָׂרֵ֣י הַ/מֵּא֡וֹת וְ/שָׂרֵ֣י כָל רְכוּשׁ וּ/מִקְנֶה֩ לַ/מֶּ֨לֶךְ וּ/לְ/בָנָ֜י/ו עִם הַ/סָּרִיסִ֧ים וְ/הַ/גִּבּוֹרִ֛ים וּֽ/לְ/כָל גִּבּ֥וֹר חָ֖יִל אֶל יְרוּשָׁלִָֽם־־־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/001.yaml
  text: 'Then David assembled at Jerusalem all the leaders of Israel: the leaders of the tribes[a], the leaders of the divisions that served the king, the commanders of thousands and of hundreds, and the leaders over all the property and livestock belonging to the king and to his sons, together with the officials, the mighty men, and every mighty man of valor.'
translation:
  language: ta
  text: 'பின்பு தாவீது இஸ்ரயேலின் தலைவர்கள் அனைவரையும் எருசலேமில் ஒன்றுகூட்டினார்: கோத்திரங்களின் தலைவர்கள், அரசருக்குப் பணியாற்றும் பிரிவுகளின் தலைவர்கள், ஆயிரத்துக்குத் தலைவர்களும் நூற்றுக்குத் தலைவர்களும், அரசருக்கும் அவருடைய மகன்களுக்கும் சொந்தமான எல்லாச் சொத்துகள் மற்றும் கால்நடைகளின் மேற்பார்வையாளர்கள், அரண்மனை அதிகாரிகள்[a], வலிமைமிக்க வீரர்கள், பராக்கிரமமுள்ள ஒவ்வொரு வீரர் ஆகியோரையும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அண்ணகர்கள்.” எபிரெயச் சொல் நேரடியாக அண்ணகர்களையோ, பொதுவாக அரசவையில் பணியாற்றிய அதிகாரிகளையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְהֵל
  choice: ஒன்றுகூட்டினார்
  rationale: கהל என்பதன் ஹிஃபில் வடிவம் பிறரை ஒரு முறையான கூடுகைக்காகக் கூட்டுவதைக் குறிக்கிறது; தமிழில் ‘ஒன்றுகூட்டினார்’ அந்தச் செயப்படுபொருள் சார்ந்த பொருளை இயல்பாகத் தருகிறது.
- source_word: שָׂרֵי יִשְׂרָאֵל
  choice: இஸ்ரயேலின் தலைவர்கள்
  rationale: שַׂר என்பது சூழலுக்கேற்ப தலைவர், அதிகாரி, தளபதி எனப் பொருள்படும்; தொடர்ந்து பல நிர்வாக மற்றும் இராணுவப் பொறுப்புகள் பட்டியலிடப்படுவதால் ‘தலைவர்கள்’ பொருத்தமான பொதுச்சொல்.
- source_word: שָׂרֵי הַשְּׁבָטִים
  choice: கோத்திரங்களின் தலைவர்கள்
  rationale: எபிரெயக் கட்டமைப்பைத் தெளிவாகவும் இயல்பாகவும் பிரதிபலிக்கிறது; שַׂר என்பதற்கு முந்தைய பொதுவான மொழிபெயர்ப்பையும் தொடர்கிறது.
- source_word: שָׂרֵי הַמַּחְלְקוֹת הַמְשָׁרְתִים אֶת הַמֶּלֶךְ
  choice: அரசருக்குப் பணியாற்றிய பிரிவுகளின் தலைவர்கள்
  rationale: מַחְלְקוֹת என்பது ஒழுங்கமைக்கப்பட்ட பிரிவுகளையும் מְשָׁרְתִים என்பது பணியாற்றுவோரையும் குறிக்கிறது; பிரிவுகள் கட்டாயமாக இராணுவப் பிரிவுகள் என்று மிகையாகக் குறிப்பதை இம்மொழிபெயர்ப்பு தவிர்க்கிறது.
- source_word: שָׂרֵי הָאֲלָפִים וְשָׂרֵי הַמֵּאוֹת
  choice: ஆயிரத்துக்குத் தலைவர்களும் நூற்றுக்குத் தலைவர்களும்
  rationale: எபிரெயத்தில் உள்ள எண்ணியல் அல்லது அமைப்புரீதியான படையலகுப் பெயர்களைத் தீர்மானித்து விளக்காமல் அப்படியே காக்கிறது; இணையான அமைப்பையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: רְכוּשׁ
  choice: சொத்துகள்
  rationale: அசையும் உடைமைகள் அல்லது செல்வத்தைக் குறிக்கும் இச்சொல்லுக்கு, கால்நடைகளுடன் இணைந்து வரும்போது ‘சொத்துகள்’ விரிவானதும் இயல்பானதும் ஆகும்.
- source_word: מִקְנֶה
  choice: கால்நடைகள்
  rationale: மாடுகளை மட்டும் அல்லாமல் வளர்க்கப்படும் பலவகை விலங்குகளையும் குறிக்கும் பொதுப்பொருளைத் தக்கவைக்கிறது.
- source_word: לַמֶּלֶךְ וּלְבָנָיו
  choice: அரசருக்கும் அவருடைய மகன்களுக்கும் சொந்தமான
  rationale: இங்கு לְ உடைமை அல்லது தொடர்பைக் குறிக்கிறது; தமிழில் அந்த உறவைத் தெளிவாகச் சொல்கிறது.
- source_word: הַסָּרִיסִים
  choice: அரண்மனை அதிகாரிகள்
  rationale: סָרִיסִים என்பது அண்ணகர்களையோ, விரிவாக அரசவையில் பணியாற்றும் அதிகாரிகளையோ குறிக்கலாம். இந்நிர்வாகப் பட்டியலில் பதவிசார் பொருள் முதன்மையாக இருந்தாலும் மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: הַגִּבּוֹרִים
  choice: மாவீரர்கள்
  rationale: நாளாகமத்தில் இச்சொல் தாவீதின் புகழ்பெற்ற வலிமைமிக்க போர்வீரர்களைக் குறிக்க முடியும்; ‘மாவீரர்கள்’ சுருக்கமாகவும் கண்ணியமாகவும் அந்தப் பொருளைத் தருகிறது.
- source_word: כָל גִּבּוֹר חָיִל
  choice: பராக்கிரமமுள்ள வீரர்கள் அனைவரும்
  rationale: גִּבּוֹר மற்றும் חַיִל இணைந்து வலிமை, வீரம், போர்திறன் ஆகியவற்றை உணர்த்துகின்றன; முந்தைய הַגִּבּוֹרִים என்பதிலிருந்து சிறிய சொற்றொடர் வேறுபாட்டையும் இது காக்கிறது.
