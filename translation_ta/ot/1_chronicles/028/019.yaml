  text: הַ/כֹּ֥ל בִּ/כְתָ֛ב מִ/יַּ֥ד יְהוָ֖ה עָלַ֣/י הִשְׂכִּ֑יל כֹּ֖ל מַלְאֲכ֥וֹת הַ/תַּבְנִֽית׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/019.yaml
  text: All this he made clear to me in writing from the hand of Yahweh[b][a], all the works of the pattern.
translation:
  language: ta
  text: இந்த அனைத்தையும்—அந்த வடிவமைப்பின்[b] எல்லாப் பணிகளையும்—யாவேயின் கை என்மேல் இருந்தபோது, அவர் எழுத்தில் எனக்குப் புரியவைத்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “யாவேயின் கையால், அவர் எழுத்தில் அந்த வடிவமைப்பின் எல்லாப் பணிகளையும் எனக்குப் புரியவைத்தார்.”'
    reason: alternative_reading
  - marker: b
    text: “வடிவமைப்பு” என்பதை “திட்டம்” அல்லது “மாதிரி” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּל
  choice: இவை அனைத்தையும்
  rationale: முந்தைய வசனங்களில் விவரிக்கப்பட்ட ஆலயத் திட்டத்தின் முழுமையையும் சூழலுக்கேற்றவாறு சுட்டுகிறது.
- source_word: בִּכְתָב
  choice: எழுத்தின்மூலம்
  rationale: திட்டம் வாய்மொழியாக மட்டும் அல்லாமல் எழுத்து வடிவில் தெரிவிக்கப்பட்டது என்ற பொருளைக் காக்கிறது.
- source_word: מִיַּד יְהוָה
  choice: யாவேயின் கையிலிருந்து வந்த
  rationale: தெய்வீக நேரடி மூலத்தையும் செயலையும் குறிக்கும் எபிரேய உருவகத்தை இயன்றவரை காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரை பட்டப்பெயராக மாற்றாமல், தமிழில் இயல்பான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: עָלַי הִשְׂכִּיל
  choice: அவர் என்மேல் செயல்பட்டு எனக்குப் புரியவைத்தார்
  rationale: சுருக்கமான எபிரேய தொடரில் உள்ள ‘என்மேல்’ என்பதையும், புரிந்துகொள்ளச் செய்தார் என்ற causative பொருளையும் வெளிப்படுத்துகிறது; தொடரின் வேறு இலக்கணப் பிரிப்பை அடிக்குறிப்பில் தருகிறது.
- source_word: כֹּל מַלְאֲכוֹת
  choice: எல்லா வேலைகளையும்
  rationale: வடிவமைப்பை நிறைவேற்றுவதற்குரிய பல்வேறு பணிகள் அல்லது வேலைப்பாடுகள் அனைத்தையும் உள்ளடக்கும் பரந்த சொல்.
- source_word: הַתַּבְנִית
  choice: அந்த வடிவமைப்பு
  rationale: கட்டுமான மாதிரி, திட்டம், வடிவமைப்பு ஆகிய பொருள் வாய்ப்புகளில், இச்சூழலில் தெளிவாகவும் இயல்பாகவும் உள்ளது; மாற்றுச் சொற்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
theological_decisions:
- issue: עָלַי הִשְׂכִּיל என்ற சுருக்கமான தொடரின் இலக்கணப் பொருத்தம்
  choice: யாவே மறைமுக எழுவாயாக இருந்து தாவீதின்மேல் செயல்பட்டு அவருக்குப் புரியவைத்தார்
  alternative: “யாவேயின் கை என்மேல் இருந்தது; அந்த வடிவமைப்பின் எல்லா வேலைகளையும் அவர் எனக்குப் புரியவைத்தார்”
  rationale: எபிரேயத்தின் சுருக்கத்தையும் தெய்வீகச் செயலையும் காக்கும் அதேவேளையில், ‘என்மேல்’ என்பதை நீக்காமல் மொழிபெயர்க்கிறது. சாத்தியமான வேறு வாக்கியப் பிரிப்பை அடிக்குறிப்பில் வெளிப்படையாகத் தருகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு விளங்கும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. மூல எபிரேயத்தின் சுருக்கமான இலக்கண அமைப்பு முற்றிலும் மென்மையாக்கப்படாமல், அதன் உண்மையான பொருள் இருமை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
