  text: וְ֠/עַתָּה לְ/עֵינֵ֨י כָל יִשְׂרָאֵ֤ל קְהַל יְהוָה֙ וּ/בְ/אָזְנֵ֣י אֱלֹהֵ֔י/נוּ שִׁמְר֣וּ וְ/דִרְשׁ֔וּ כָּל מִצְוֺ֖ת יְהוָ֣ה אֱלֹהֵי/כֶ֑ם לְמַ֤עַן תִּֽירְשׁוּ֙ אֶת הָ/אָ֣רֶץ הַ/טּוֹבָ֔ה וְ/הִנְחַלְתֶּ֛ם לִ/בְנֵי/כֶ֥ם אַחֲרֵי/כֶ֖ם עַד עוֹלָֽם־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/008.yaml
  text: And now[a], in the sight of all Israel, the assembly of Yahweh, and in the hearing of our God, keep and seek all the commandments of Yahweh your God[b], so that you may possess the good land and leave it as an inheritance to your sons after you forever.
translation:
  language: ta
  text: இப்போது, யாவேவின் சபையாகிய இஸ்ரவேலர் அனைவரும் காணும்படியாகவும், நம் கடவுள் கேட்கும்படியாகவும், உங்கள் கடவுளாகிய யாவேவின் கட்டளைகள் அனைத்தையும் கடைப்பிடியுங்கள்; அவற்றை நாடுங்கள். அப்படிச் செய்தால், நீங்கள் நல்ல நாட்டை உரிமையாக்கிக்கொண்டு[a], அதை உங்களுக்குப் பின் உங்கள் மகன்களுக்கு[b] என்றென்றும் சுதந்தரமாக விட்டுச் செல்வீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நல்ல நாட்டைச் சுதந்தரித்துக்கொண்டு” என்றும் மொழிபெயர்க்கலாம். எபிரேய வினைச்சொல் சூழலுக்கேற்ப சுதந்தரித்தல் அல்லது உரிமையாக்கிக்கொள்ளுதல் என்ற பொருள்களைக் கொண்டிருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரேயத்தில் “மகன்கள்” என்று ஆண்பால் பன்மையில் உள்ளது; பொதுவான “பிள்ளைகள்” என்ற சொல் அல்ல.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: இப்போது
  rationale: முந்தைய உரையிலிருந்து அறிவுறுத்தலுக்குச் செல்லும் சொற்பொழிவு மாற்றத்தை இயல்பான நவீனத் தமிழில் குறிக்கிறது.
- source_word: לְעֵינֵי כָל יִשְׂרָאֵל
  choice: இஸ்ரவேலர் அனைவரின் கண்களுக்கு முன்பாக
  rationale: ‘கண்களுக்கு முன்பாக’ என்ற எபிரேய உருவகத்தையும், இந்த அறிவுரை பொதுமக்கள் முன்னிலையில் வழங்கப்படுவதையும் தக்கவைக்கிறது.
- source_word: קְהַל יְהוָה
  choice: யாவேவின் சபை
  rationale: கூடியிருக்கும் உடன்படிக்கைச் சமூகத்தை குறிக்கிறது; ‘சபை’ முறையானதாயும் இன்றைய வாசகர்களுக்குப் புரியத்தக்கதாயும் உள்ளது.
- source_word: וּבְאָזְנֵי אֱלֹהֵינוּ
  choice: நம் கடவுள் கேட்கும்படியாக
  rationale: சொல்லுக்குச் சொல் ‘நம் கடவுளின் செவிகளில்’ என்பதன் பொருளை இயல்பான தமிழில் தருகிறது; கடவுள் சாட்சியாகக் கேட்கிறார் என்ற கருத்தையும் காக்கிறது.
- source_word: שִׁמְרוּ
  choice: கடைப்பிடித்து
  rationale: கட்டளைகளுடன் வரும் போது, அவற்றுக்குக் கீழ்ப்படிந்து ஒழுகுதல் என்ற உடன்படிக்கை சார்ந்த பொருளைத் தெளிவாகத் தருகிறது.
- source_word: וְדִרְשׁוּ
  choice: அவற்றை நாடுங்கள்
  rationale: வெறும் அறிவார்ந்த ஆராய்ச்சியைக் காட்டிலும், கட்டளைகளை ஆர்வத்துடன் தேடி அவற்றின்படி வாழும் நோக்கத்தை வெளிப்படுத்துகிறது.
- source_word: כָּל מִצְוֺת
  choice: கட்டளைகள் அனைத்தையும்
  rationale: பன்மை அமைப்பையும் כָּל என்பதன் முழுமையையும் நேரடியாகப் பிரதிபலிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரேய நான்கெழுத்துத் திருப்பெயரை ஒரு பட்டப்பெயராக மாற்றாமல் தனிப்பெயராக ஒலிபெயர்க்கிறது.
- source_word: לְמַעַן
  choice: அப்போது
  rationale: கட்டளைகளைக் கடைப்பிடிப்பதன் நோக்கம் அல்லது விளைவாகத் தொடர்ந்து வரும் கருத்தை இயல்பான தமிழில் இணைக்கிறது.
- source_word: תִּירְשׁוּ
  choice: உரிமையாக்கிக்கொண்டு
  rationale: יָרַשׁ இங்கு நாட்டைச் சுதந்தரித்தல் அல்லது உடைமையாகக் கொண்டிருத்தல் ஆகிய இரு நெருங்கிய பொருள்களையும் ஏற்கக்கூடியது; சூழலில் ‘உரிமையாக்கிக்கொள்’ இயல்பாக உள்ளது.
- source_word: הָאָרֶץ הַטּוֹבָה
  choice: இந்த நல்ல நாடு
  rationale: வாக்குத்தத்த நாட்டைக் குறிக்கும் எளிய, நேரடியான உடன்படிக்கைச் சொல்லாட்சியைப் பாதுகாக்கிறது; தமிழில் சுட்டுப்பொருள் தெளிவுக்காக ‘இந்த’ சேர்க்கப்பட்டுள்ளது.
- source_word: וְהִנְחַלְתֶּם
  choice: உரிமைச்சொத்தாக விட்டுச் செல்வீர்கள்
  rationale: நחל என்பதன் காரணவினை வடிவமான ‘ஒருவரைச் சுதந்தரிக்கச் செய்தல்’ என்பதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לִבְנֵיכֶם
  choice: உங்கள் மகன்களுக்கு
  rationale: எபிரேயத்தில் உள்ள வெளிப்படையான ஆண்பால் பன்மையைப் பொதுமைப்படுத்தாமல் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூலத்தில் பட்டப்பெயர் அல்லாமல் உடன்படிக்கையின் தனிப்பெயர் நேரடியாக வருகிறது; ஆகவே அதை ‘யாவே’ என்று ஒலிபெயர்த்தல் மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: בנים என்ற சந்ததிச் சொல்லின் பாலினம்
  choice: மகன்கள்
  alternative: பிள்ளைகள்
  rationale: மூலச்சொல் ஆண்பால் பன்மையாக இருப்பதால், உரையில் இல்லாத பாலினப் பொதுமைப்படுத்தலைச் செய்யாமல் ‘மகன்கள்’ எனத் தரப்பட்டுள்ளது.
- issue: דרשׁ உடன் கட்டளைகளை நாடுதல்
  choice: அவற்றை நாடுங்கள்
  alternative: அவற்றை ஆராயுங்கள்
  rationale: இச்சொல் அறிவார்ந்த ஆய்வை மட்டும் அல்லாமல், கடவுளின் கட்டளைகளை மனமுவந்து தேடி அவற்றுக்குத் தன்னை ஒப்படைப்பதையும் குறிக்கலாம்; அந்த நோக்கத் தீவிரத்தை ‘நாடுங்கள்’ காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் பொது அறிவிப்புக்குரிய கண்ணியமான தொனியிலும் வடிவமைக்கப்பட்டுள்ளது. ‘கண்களுக்கு முன்பாக’ என்ற மூல உருவகம் பாதுகாக்கப்பட்டாலும், ‘கடவுளின் செவிகளில்’ என்ற தமிழில் இயல்பற்ற சொற்றொடர் ‘நம் கடவுள் கேட்கும்படியாக’ எனப் பொருள்சார் முறையில் தரப்பட்டுள்ளது. கட்டளையின் இரட்டை வலியுறுத்தலைக் காக்க ‘கடைப்பிடித்து, அவற்றை நாடுங்கள்’ என இரு வினைகளும் தனித்தனியாக வைக்கப்பட்டுள்ளன.
