  source_fidelity: திருத்தம் தேவை. வரைவில் மூலத்தில் இல்லாத “நான் கூறுவது” சேர்க்கப்பட்டுள்ளது. மேலும் לְמַעַן என்ற நோக்கத் தொடர்பு “அப்போது” என்பதால் வெறும் காலத் தொடர்ச்சியாகத் தளர்கிறது. இவற்றைத் தவிர, யாவே, மகன்கள், கட்டளைகளைக் கடைப்பிடித்தல்/நாடுதல், மற்றும் நாட்டை மகன்களுக்குச் சுதந்தரமாக விட்டுச் செல்லுதல் ஆகிய முக்கியக் கூறுகள் மூலத்திற்கு ஏற்ப உள்ளன.
  naturalness: “நம் கடவுள் கேட்கும்படியாக” இயல்பானது. ஆனால் “இஸ்ரவேலர் அனைவரின் கண்களுக்கு முன்பாகவும்” என்பதோடு “நான் கூறுவது” சேர்ப்பது வாக்கியத்தை தேவையின்றி மாற்றுகிறது. பொதுமக்கள் முன்னிலையையும் கடவுள் கேட்பதையும் முன்னுரையாக வைத்து, பின்னர் நேரடியான பன்மை ஏவல்களாக அமைப்பது நவீனத் தரத் தமிழில் தெளிவாகவும் இயல்பாகவும் அமையும்.
  terminology: “யாவே,” “சபை,” “கட்டளைகள்,” “மகன்கள்,” “சுதந்தரம்” ஆகியவை பொருத்தமானவை. הָאָרֶץ என்பதற்குத் “நல்ல நாடு” ஏற்றது. மூலத்தில் இல்லாத “இந்த” நீக்கப்படுகிறது. “அதை என்றென்றும் உரிமைச்சொத்தாக விட்டுச் செல்வீர்கள்” என்பதற்குப் பதிலாக “அதை உங்கள் மகன்களுக்கு என்றென்றும் சுதந்தரமாக விட்டுச் செல்வீர்கள்” என்பது நחל-ன் காரணவினைப் பொருளைத் தெளிவாகக் காட்டுகிறது.
