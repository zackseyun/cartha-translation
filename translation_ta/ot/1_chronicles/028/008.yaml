    rationale: הָאָרֶץ הַטּוֹבָה என்பது “அந்த/இந்த” எனும் சுட்டுப்பெயரின்றி “நல்ல நாடு” என்று உள்ளது. தமிழில் தெளிவுக்காகச் சேர்த்தாலும், இங்கு தேவையில்லை.
  revised_text: இப்போது, யாவேவின் சபையாகிய இஸ்ரவேலர் அனைவரும் காணும்படியாகவும், நம் கடவுள் கேட்கும்படியாகவும், உங்கள் கடவுளாகிய யாவேவின் கட்டளைகள் அனைத்தையும் கடைப்பிடியுங்கள்; அவற்றை நாடுங்கள். அப்படிச் செய்தால், நீங்கள் நல்ல நாட்டை உரிமையாக்கிக்கொண்டு[a], அதை உங்களுக்குப் பின் உங்கள் மகன்களுக்கு[b] என்றென்றும் சுதந்தரமாக விட்டுச் செல்வீர்கள்.
