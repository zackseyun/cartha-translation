  revision_rationale: மூலத்தில் இல்லாத பேசுபவர் அறிமுகத்தை நீக்கி, பொது மற்றும் இறைசாட்சிய முன்னிலையைப் பாதுகாத்துள்ளேன். இரு எபிரேய ஏவல்களையும் தனித்தனி ஏவல்களாகத் தந்துள்ளேன். லְמַעַן-ன் நோக்க/விளைவுத் தொடர்பு “அப்படிச் செய்தால்” எனத் தெளிவாக்கப்பட்டுள்ளது. “சுதந்தரமாக விட்டுச் செல்வீர்கள்” என்பது வினையின் காரணவினைத் தன்மையையும் நீடித்த மரபுரிமைக் கருத்தையும் இயல்பாகத் தருகிறது.
