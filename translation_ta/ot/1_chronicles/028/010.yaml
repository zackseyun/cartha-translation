source:
  edition: WLC
  text: רְאֵ֣ה עַתָּ֗ה כִּֽי יְהוָ֛ה בָּ֧חַר בְּ/ךָ֛ לִ/בְנֽוֹת בַּ֥יִת לַ/מִּקְדָּ֖שׁ חֲזַ֥ק וַ/עֲשֵֽׂה׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/010.yaml
  text: See now[a], for Yahweh has chosen you to build a house for the sanctuary. Be strong[b], and do it.
translation:
  language: ta
  text: இப்போது கவனித்துக்கொள்[a]; ஏனெனில் யாவே உன்னைப் பரிசுத்த இடத்திற்கான ஒரு வீட்டைக் கட்டத் தேர்ந்தெடுத்திருக்கிறார்[b]. உறுதியாயிரு; அதைச் செய்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இப்போது சிந்தித்துப் பார்’ அல்லது ‘இப்போது கவனமாக இரு’ என்றும் மொழிபெயர்க்கலாம். இந்தக் கட்டளை கண்களால் பார்ப்பதை மட்டும் அல்ல, கவனமாகச் சிந்திக்கும்படி அழைக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், ‘பரிசுத்த இடத்திற்கான ஒரு வீடு.’ இங்கு ‘வீடு’ என்பது பரிசுத்த ஆலயக் கட்டிடத்தைக் குறிக்கிறது; இச்சொற்றொடரை ‘பரிசுத்த இடமாக ஒரு வீடு’ என்றும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה עַתָּה
  choice: இப்போது கவனித்துக்கொள்
  rationale: רְאֵה என்பது இங்கு வெறுமனே கண்களால் பார்ப்பதைக் குறிக்காமல், சொல்லப்படுவதைக் கவனமாக உணர்ந்து ஏற்றுக்கொள்ளும்படி அழைக்கும் கட்டளை; עַתָּה அதன் உடனடித் தன்மையை வலியுறுத்துகிறது.
- source_word: כִּי
  choice: வாக்கியங்களுக்கிடையேயான காரணத் தொடர்பு
  rationale: கீழ்வரும் யாவேயின் தேர்ந்தெடுப்பு, தொடக்க அறிவுறுத்தலுக்கான அடிப்படையாக அமைகிறது. இயல்பான தமிழில் தனியே ‘ஏனெனில்’ சேர்க்காமல், இருபுள்ளிக்குப் பின் காரணத்தைத் தருவது அந்தத் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தேவனுடைய தனிப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டப்பெயராக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: בָּחַר בְּךָ
  choice: உன்னைத் தேர்ந்தெடுத்திருக்கிறார்
  rationale: ஒரு குறிப்பிட்ட பணிக்காகச் செய்யப்பட்ட தெய்வீகத் தேர்வையும், நிறைவேறிய அந்தத் தேர்வின் தற்போதைய பொருத்தத்தையும் வெளிப்படுத்துகிறது.
- source_word: לִבְנוֹת בַּיִת לַמִּקְדָּשׁ
  choice: பரிசுத்த இடத்திற்கான ஒரு வீட்டைக் கட்டுவதற்கு
  rationale: בַּיִת என்பதன் ‘வீடு’ என்ற உருவகத்தைத் தக்கவைத்து, לַמִּקְדָּשׁ என்பதன் பரிசுத்த இடம் சார்ந்த நோக்கத்தையும் வெளிப்படுத்துகிறது; முழுச் சொற்றொடரையும் வெறுமனே ‘ஆலயம்’ என்று சுருக்கவில்லை.
- source_word: חֲזַק
  choice: திடன்கொண்டு
  rationale: வலிமை, துணிவு, உறுதியான தீர்மானம் ஆகியவற்றை உள்ளடக்கும் கட்டளையை இயல்பான தமிழில் தருகிறது.
- source_word: וַעֲשֵׂה
  choice: அதைச் செய்
  rationale: சூழலில் குறிப்பது கட்டுமானப் பணியை நிறைவேற்றுவதாகும்; ‘அதை’ என்பது தமிழில் மறைபொருளை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் பட்டப்பெயர் அல்ல, தேவனுடைய தனிப்பெயரே உள்ளது; ஆகவே அதனைத் தமிழில் ஒலிபெயர்ப்பது மூலச் சான்றை நேரடியாகப் பாதுகாக்கிறது.
- issue: בַּיִת לַמִּקְדָּשׁ என்ற சொற்றொடரை எவ்வளவு விளக்கமாக மொழிபெயர்ப்பது
  choice: பரிசுத்த இடத்திற்கான ஒரு வீடு
  alternative: ஆலயம்; பரிசுத்த இடமாக ஒரு வீடு
  rationale: சூழலில் சாலொமோனின் ஆலயமே குறிக்கப்பட்டாலும், எபிரெயத்தின் இரண்டு பெயர்ச்சொற்களையும் அவற்றுக்கிடையிலான உறவிலுள்ள சிறிய பொருள் நெகிழ்வையும் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் நேரடியான அரச/ஆவிக்குரிய அறிவுறுத்தலின் கண்ணியமான தொனி காக்கப்பட்டுள்ளது. ‘வீடு’ என்ற மூல உருவகம் உரையிலேயே தக்கவைக்கப்பட்டு, வாசகருக்கு அதன் ஆலயச் சூழல் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
