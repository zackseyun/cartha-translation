  source_fidelity: 'மூலத்தின் முக்கியக் கூறுகள் நன்றாகக் காக்கப்பட்டுள்ளன: רְאֵה עַתָּה-வின் கவன அழைப்பு, யாவேயின் பெயர், தேர்ந்தெடுத்தல், ‘பரிசுத்த இடத்திற்கான ஒரு வீடு’ என்ற இரட்டைச் சொல்லமைப்பு, மற்றும் இறுதிக் கட்டளைகள் அனைத்தும் உள்ளன. ஆயினும் כִּי-யின் காரணத் தொடர்பை வெறும் இருபுள்ளியால் மட்டுமே குறிப்பது தமிழில் போதியளவு வெளிப்படையாக இல்லை.'
  naturalness: ‘பரிசுத்த இடத்திற்கான ஒரு வீட்டைக் கட்டுவதற்கு யாவே உன்னைத் தேர்ந்தெடுத்திருக்கிறார்’ என்ற சொல்வரிசை கனமாக உள்ளது. காரண இணைப்பையும் சொல்வரிசையையும் சீரமைத்தால் நவீன நிலையான தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமையும். ‘உறுதியாயிரு’ என்பது חֲזַק-க்கு நேரடியான இயல்பான கட்டளை வடிவம்.
