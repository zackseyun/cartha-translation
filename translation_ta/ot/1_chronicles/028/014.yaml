  text: לַ/זָּהָ֤ב בַּ/מִּשְׁקָל֙ לַ/זָּהָ֔ב לְ/כָל כְּלֵ֖י עֲבוֹדָ֣ה וַ/עֲבוֹדָ֑ה לְ/כֹ֨ל כְּלֵ֤י הַ/כֶּ֨סֶף֙ בְּ/מִשְׁקָ֔ל לְ/כָל כְּלֵ֖י עֲבוֹדָ֥ה וַ/עֲבוֹדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/014.yaml
  text: the weight of the gold for all the articles of every kind of service[a], and the weight of the silver for all the articles of every kind of service.
translation:
  language: ta
  text: ஒவ்வொரு வகையான பணிக்குமான எல்லாத் தங்கப் பொருட்களுக்கும் எடையின்படி தங்கத்தையும், ஒவ்வொரு வகையான பணிக்குமான எல்லா வெள்ளிப் பொருட்களுக்கும் எடையின்படி வெள்ளியையும் கொடுத்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘பணியும் பணியும்’ என்று மறுபதிப்பு வருகிறது; இது பகிர்ந்தளிக்கும் சொல்லமைப்பு. இதன் பொருள் ‘ஒவ்வொரு வகையான பணி’ அல்லது ‘ஒவ்வொரு பயன்பாடு’ என்பதாகும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: זָהָב
  choice: தங்கம்
  rationale: ஆலயப் பணிக்குரிய பொருட்களின் மூலப்பொருளைக் குறிக்கும் அடிப்படைப் பொருட்பெயர்.
- source_word: בַּמִּשְׁקָל
  choice: எடை
  rationale: ב முன்னொட்டுடன் வரும் מִשְׁקָל, அளவிடப்பட்ட எடையைக் குறிக்கிறது; பட்டியல் போன்ற இவ்வாக்கியத்தில் தமிழில் பெயர்ச்சொல் வடிவம் இயல்பாக உள்ளது.
- source_word: כְּלֵי
  choice: பொருட்கள்
  rationale: கலன்கள், கருவிகள் உள்ளிட்ட பலவகைப் பயன்பாட்டுப் பொருட்களையும் உள்ளடக்கும் பரந்த, இயல்பான தமிழ்ச்சொல்.
- source_word: עֲבוֹדָה
  choice: பணி
  rationale: ஆலயச் சூழலில் நடைபெறும் சேவை அல்லது வேலையைக் குறிக்கிறது; இங்கு ‘பணி’ தெளிவாகவும் பொதுவாகவும் உள்ளது.
- source_word: עֲבוֹדָה וַעֲבוֹדָה
  choice: ஒவ்வொரு வகையான பணி
  rationale: எபிரெய மறுபதிப்பு பகிர்ந்தளிக்கும் பொருளில் பல்வேறு பயன்பாட்டு வகைகளைக் குறிக்கிறது; சொல்லுக்குச் சொல் மறுபதிப்பை விட இவ்வடிவம் அதன் செயல்பாட்டை இயல்பான தமிழில் தருகிறது.
- source_word: כֶּסֶף
  choice: வெள்ளி
  rationale: தங்கத்துக்கு இணையாக ஆலயப் பொருட்களுக்காக ஒதுக்கப்பட்ட மூலப்பொருளைக் குறிக்கிறது.
- source_word: לְכָל / לְכֹל
  choice: எல்லாவற்றுக்கும் வேண்டிய
  rationale: לְ முன்னொட்டும் כֹּל என்பதும் நோக்கம் மற்றும் முழுமையான வரம்பைக் குறிக்கின்றன; தமிழ் வாக்கிய அமைப்பில் ‘எல்லாப் பொருட்களுக்கும் வேண்டிய’ என இயல்பாக வெளிப்படுகிறது.
theological_decisions:
- issue: மூலத்தில் வெளிப்படையான முதன்மை வினைச்சொல் இல்லாத பட்டியல்-துணுக்கு
  choice: முந்தைய வசனத்தின் சூழலைத் தொடர்ந்து ‘கொடுத்தார்’ என நிறைவு செய்தல்
  alternative: வினைச்சொல் இன்றி ‘...தங்கத்தின் எடை; ...வெள்ளியின் எடை’ என்று விடுதல்
  rationale: எபிரெய வசனம் முந்தைய வாக்கியத்தின் வினைச்செயலைச் சார்ந்த நீள்வாக்கியப் பட்டியலாக உள்ளது. தனித்து வாசிக்கத்தக்க நவீன தமிழுக்காக சூழலில் உள்ள செயலை வெளிப்படுத்துகிறது; புதிய இறையியல் கருத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், ஆலயப் பட்டியல் சூழலுக்கேற்ற கண்ணியமான ஆனால் எளிதில் புரியும் நடை. மூலத்தின் இணையான தங்கம்–வெள்ளி அமைப்பும், עֲבוֹדָה וַעֲבוֹדָה என்பதன் பகிர்ந்தளிக்கும் வலிமையும் காக்கப்பட்டுள்ளன.
