base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/013.yaml
  text: for the divisions of the priests and the Levites[a], and for all the work of the service of the house of Yahweh[b], and for all the vessels of service of the house of Yahweh.
translation:
  language: ta
  text: ஆசாரியர் மற்றும் லேவியரின் பிரிவுகளுக்காகவும்[a], யாவேயின் இல்லத்தின் சேவைக்குரிய எல்லா வேலைகளுக்காகவும், யாவேயின் இல்லத்தின் சேவைக்கான எல்லாப் பொருள்களுக்காகவும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ஆசாரியர் மற்றும் லேவியரின் ‘பணிப்பிரிவுகளுக்காகவும்’ அல்லது ‘பணிக்குழுக்களுக்காகவும்’.
    reason: lexical_alternative
  - marker: b
    text: ‘பொருள்கள்’ என்பதற்கு ‘கருவிகள்’, ‘உபகரணங்கள்’ அல்லது சூழலுக்கேற்ப ‘பாத்திரங்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַחְלְקוֹת
  choice: பிரிவுகள்
  rationale: ஆசாரியர்களும் லேவியர்களும் ஒழுங்கமைக்கப்பட்ட பணிக்குழுக்களாகப் பிரிக்கப்பட்டிருந்ததைக் குறிக்கிறது. ‘பிரிவுகள்’ நிர்வாக மற்றும் பணிமுறை சார்ந்த பொருளை இயல்பாகத் தருகிறது.
- source_word: הַכֹּהֲנִים
  choice: ஆசாரியர்கள்
  rationale: இஸ்ரவேலின் வழிபாட்டுப் பணிக்கென நியமிக்கப்பட்ட ஆசாரிய வகுப்பைக் குறிக்கும் வழக்கமான தமிழ் சொல்.
- source_word: הַלְוִיִּם
  choice: லேவியர்கள்
  rationale: லேவி கோத்திரத்தாருக்கான நிலைபெற்ற தமிழ்ப் பெயர்; அவர்களுடைய தனித்த சேவை அடையாளத்தைப் பாதுகாக்கிறது.
- source_word: מְלֶאכֶת עֲבוֹדַת
  choice: பணிக்குரிய எல்லா வேலைகள்
  rationale: מְלֶאכֶת என்பது வேலை அல்லது செயலைக் குறிக்கிறது; עֲבוֹדַת இங்கு ஆலயச் சேவை அல்லது ஒதுக்கப்பட்ட பணியைக் குறிக்கிறது. இரு சொற்களின் வேறுபாட்டையும் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: בֵּית יְהוָה
  choice: யாவேயின் இல்லம்
  rationale: ‘யாவேயின் வீடு/இல்லம்’ என்ற எபிரெய நேரடி உருவகத்தைப் பாதுகாக்கிறது; சூழலில் இது ஆலயத்தைக் குறிக்கிறது.
- source_word: כְּלֵי
  choice: பொருள்கள்
  rationale: ஆலயப் பணியில் பயன்படுத்தப்பட்ட பாத்திரங்கள், கருவிகள், உபகரணங்கள் ஆகிய அனைத்தையும் உள்ளடக்கக்கூடிய பரந்த சொல். இதை வெறும் கொள்கலன்களாகக் கட்டுப்படுத்தவில்லை.
- source_word: לְכָל
  choice: எல்லா ... களுக்காகவும்
  rationale: திட்டத்தில் அடங்கிய பல வகைகளைப் பட்டியலிடும் எபிரெய அமைப்பைத் தமிழில் தொடர்ச்சியாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் வரும் நான்கு எழுத்து உடன்படிக்கைப் பெயரை ஒரு பொதுப் பட்டப்பெயராக மாற்றாமல், தமிழில் ஒலிபெயர்த்துப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. வசனம் முந்தைய வாக்கியத்தைத் தொடரும் பட்டியல் கூறாக இருப்பதால், மூலத்தின் நிறைவுறாத தொடரமைப்பு பாதுகாக்கப்பட்டுள்ளது. இரண்டாவது அடிக்குறி அது விளக்கும் כְּלֵי என்ற சொல்லுக்குப் பிறகு வைக்கப்பட்டுள்ளது.
