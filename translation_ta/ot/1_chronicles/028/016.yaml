base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/016.yaml
  text: and the weight of the gold for the tables of the arrangement[a], for each table and table, and silver for the silver tables.
translation:
  language: ta
  text: மேலும், வரிசைப்படுத்தலுக்கான மேசைகளுக்கு[a], ஒவ்வொரு மேசைக்கும் வேண்டிய தங்கத்தின் எடையையும், வெள்ளி மேசைகளுக்கு வேண்டிய வெள்ளியையும் குறிப்பிட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், ‘வரிசைப்படுத்தலின் மேசைகள்.’ இங்கு வரிசையாக வைக்கப்பட்ட அப்பங்களுக்கான மேசைகள் குறிக்கப்படலாம்; மரபாக, ‘சமுகத்து அப்பங்களுக்கான மேசைகள்’ என்று கூறப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁקָל
  choice: எடை
  rationale: ஆலயப் பொருட்களுக்காக ஒதுக்கப்பட்ட உலோகத்தின் எடையைக் குறிக்கிறது; ‘எடை’ என்பது நேரடியானதும் இயல்பானதும் ஆகும்.
- source_word: שֻׁלְחֲנוֹת הַמַּעֲרֶכֶת
  choice: வரிசைப்படுத்தப்பட்ட அப்பங்களுக்கான மேசைகள்
  rationale: எபிரெயச் சொற்றொடர் நேரடியாக ‘வரிசைப்படுத்துதலின் மேசைகள்’ எனப் பொருள்படும். இச்சூழலில் ஆண்டவரின் முன்னிலையில் வரிசையாக வைக்கப்பட்ட அப்பங்கள் குறிக்கப்படுவதால், பொருளைத் தெளிவாக்க ‘அப்பங்கள்’ சேர்க்கப்பட்டு, அதன் விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לְשֻׁלְחָן וְשֻׁלְחָן
  choice: ஒவ்வொன்றுக்கும்
  rationale: பெயர்ச்சொல்லை இருமுறை கூறும் எபிரெய அமைப்பு பகிர்ந்தளிக்கும் பொருளில் ‘ஒவ்வொரு மேசைக்கும்’ என்பதைக் குறிக்கிறது. இயல்பான நவீன தமிழில் இது ‘ஒவ்வொன்றுக்கும்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: כֶּסֶף
  choice: வெள்ளி
  rationale: முதல் பகுதியில் உள்ள தங்கத்துக்கு மாறாக, இங்கு உலோகமான வெள்ளியே நேரடியாகக் குறிக்கப்படுகிறது.
- source_word: שֻׁלְחֲנוֹת הַכָּסֶף
  choice: வெள்ளி மேசைகள்
  rationale: வெள்ளியால் செய்யப்பட்ட அல்லது வெள்ளி மேசைகள் என வகைப்படுத்தப்பட்ட மேசைகளைக் குறிக்கும் இயல்பான சுருக்கமான மொழிபெயர்ப்பு.
