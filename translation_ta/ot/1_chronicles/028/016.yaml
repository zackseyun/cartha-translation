translation_notes:
  register: நவீன நிலையான தமிழில், ஆலயப் பொருட்களின் பட்டியல் சூழலுக்கு ஏற்ற கண்ணியமான, தெளிவான நடை பயன்படுத்தப்பட்டுள்ளது. முந்திய வசனத்திலிருந்து தொடரும் வாக்கியத் தன்மையை ‘மேலும்’ மற்றும் ‘குறிப்பிட்டார்’ என்பவை இயல்பாக வெளிப்படுத்துகின்றன.
