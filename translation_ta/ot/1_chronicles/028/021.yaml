base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/021.yaml
  text: And behold[a], the divisions of the priests and the Levites are for all the service of the house of God, and with you in all the work will be every willing man skilled in wisdom for every kind of service; the officials also, and all the people[b], will be wholly at your command.
translation:
  language: ta
  text: இதோ, கடவுளின் இல்லத்தில் நடைபெறும் எல்லாப் பணிகளுக்காகவும் ஆசாரியர்களும் லேவியர்களும் பிரிவுகளாக இருக்கிறார்கள். எல்லா வேலைகளிலும் உன்னோடு, ஒவ்வொரு சேவைக்கும் ஞானத்திறமை உடைய மனமுவந்த ஒவ்வொரு மனிதனும் இருப்பான்[a]. அதிகாரிகளும் மக்கள் அனைவரும் உன் எல்லா அறிவுறுத்தல்களையும்[b] நிறைவேற்றத் தயாராக இருப்பார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஞானத்திறமை உடைய ஒவ்வொரு தன்னார்வலரும்.” எபிரேயத்தில் சொல்லுக்குச் சொல், “ஒவ்வொரு சேவைக்கும், ஞானத்தில் மனமுவந்த ஒவ்வொருவனும்” என்று உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், “உன் எல்லா வார்த்தைகளுக்கும்”; அதாவது, உன் எல்லா அறிவுறுத்தல்களையும் அல்லது காரியங்களையும் நிறைவேற்றத் தயாராக இருப்பார்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் எபிரேய உரையாடல் குறிப்பின் வலியுறுத்தலை இயல்பான, சுருக்கமான தமிழில் தக்கவைக்கிறது.
- source_word: מַחְלְקוֹת
  choice: பிரிவுகள்
  rationale: ஆசாரியர்களும் லேவியர்களும் ஒழுங்குபடுத்தப்பட்ட குழுக்களாகப் பிரிக்கப்பட்டிருப்பதைக் குறிக்கிறது.
- source_word: הַכֹּהֲנִים וְהַלְוִיִּם
  choice: ஆசாரியர்களும் லேவியர்களும்
  rationale: ஆலயப் பணியுடன் தொடர்புடைய இரு குறிப்பிட்ட குழுக்களையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: לְכָל עֲבוֹדַת בֵּית הָאֱלֹהִים
  choice: கடவுளின் இல்லத்தில் நடைபெறும் எல்லாப் பணிகளுக்காகவும்
  rationale: ‘கடவுளின் இல்லம்’ என்ற மூலப்படிமத்தைத் தக்கவைத்து, பணியின் சூழலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וְעִמְּךָ בְכָל מְלָאכָה
  choice: எல்லா வேலைகளிலும் உன்னோடு
  rationale: சாலொமோனுக்கு அருகிருந்து உதவும் பொருளையும் பணியின் முழு வரம்பையும் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: לְכָל נָדִיב בַּחָכְמָה
  choice: ஞானத்திறமை பெற்ற, மனமுவந்து முன்வரும் ஒவ்வொரு மனிதனும்
  rationale: נָדִיב என்பதிலுள்ள மனமுவந்த முன்வருதலையும், חָכְמָה என்பதிலுள்ள நடைமுறை ஞானம் அல்லது திறமையையும் இணைத்துப் பாதுகாக்கிறது; ஆண்பால் ஒருமை வடிவமும் ‘மனிதன்’ என்பதால் வெளிப்படுகிறது.
- source_word: לְכָל עֲבוֹדָה
  choice: ஒவ்வொரு பணியையும் செய்வதற்கு
  rationale: அத்திறமை பலவகைச் சேவைகளுக்கும் பயன்படும் என்பதை இயல்பாகத் தெரிவிக்கிறது.
- source_word: וְהַשָּׂרִים
  choice: அதிகாரிகளும்
  rationale: அரசு மற்றும் நிர்வாகச் சூழலுக்குப் பொருத்தமான நவீன தமிழ்ச் சொல்லாகும்; மரபுரிமை இளவரசர்கள் என்ற தேவையற்ற எண்ணத்தைத் தவிர்க்கிறது.
- source_word: וְכָל הָעָם
  choice: மக்கள் அனைவரும்
  rationale: ஆதரவு முழு மக்களிடமிருந்தும் கிடைக்கும் என்ற விரிவைத் தக்கவைக்கிறது.
- source_word: לְכָל דְּבָרֶיךָ
  choice: உன் எல்லாக் கட்டளைகளையும் நிறைவேற்ற
  rationale: சொல்லுக்குச் சொல் ‘உன் எல்லா வார்த்தைகளுக்கும்’ என்றாலும், இச்சூழலில் சாலொமோனின் அறிவுறுத்தல்களைச் செயல்படுத்தத் தயாராயிருப்பதே பொருள்; அதனை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: נָדִיב என்ற ஆண்பால் ஒருமைக் குறிப்பை மொழிபெயர்த்தல்
  choice: மனமுவந்து முன்வரும் ஒவ்வொரு மனிதனும்
  alternative: மனமுவந்து முன்வரும் ஒவ்வொருவரும்
  rationale: மூலத்தின் ஆண்பால் ஒருமை வடிவத்தை மறைக்காமல் காக்கிறது; அதேவேளை இச்சொல் பணிக்குத் தன்னார்வமாக முன்வருபவரைக் குறிக்கிறது.
- issue: בֵּית הָאֱלֹהִים என்ற உருவகத்தை மொழிபெயர்த்தல்
  choice: கடவுளின் இல்லம்
  alternative: கடவுளின் ஆலயம்
  rationale: சூழலில் ஆலயம் குறிக்கப்பட்டாலும், மூலத்தின் ‘கடவுளின் வீடு/இல்லம்’ என்ற தெளிவான உருவகத்தைத் தக்கவைக்கிறது.
- issue: חָכְמָה என்பதன் ஞானம்–திறமை நுணுக்கம்
  choice: ஞானத்திறமை
  alternative: திறமை
  rationale: இங்கு நடைமுறைத் தொழில்திறமை முக்கியமானது; இருப்பினும் மூலச்சொல்லின் ‘ஞானம்’ சார்ந்த நுணுக்கத்தை முழுமையாக நீக்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘ஆசாரியர்கள்’, ‘லேவியர்கள்’ போன்ற நிறுவனம் சார்ந்த வேதாகமச் சொற்கள் தக்கவைக்கப்பட்டுள்ளன; நீண்ட எபிரேய வாக்கியம் வாசிப்புத் தெளிவுக்காக மூன்று தமிழ் வாக்கியங்களாக அமைக்கப்பட்டுள்ளது.
