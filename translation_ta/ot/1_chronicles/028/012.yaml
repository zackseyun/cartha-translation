reference: 1 Chronicles 28:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/תַבְנִ֗ית כֹּל֩ אֲשֶׁ֨ר הָיָ֤ה בָ/ר֨וּחַ֙ עִמּ֔/וֹ לְ/חַצְר֧וֹת בֵּית יְהוָ֛ה וּ/לְ/כָל הַ/לְּשָׁכ֖וֹת סָבִ֑יב לְ/אֹֽצְרוֹת֙ בֵּ֣ית הָ/אֱלֹהִ֔ים וּ/לְ/אֹצְר֖וֹת הַ/קֳּדָשִֽׁים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/012.yaml
  text: 'and the plan of all that was in the Spirit with him: for the courts of the house of Yahweh[a], for all the surrounding chambers, for the treasuries of the house of God, and for the treasuries of the holy things.'
translation:
  language: ta
  text: மேலும், ஆண்டவருடைய ஆலயத்தின் முற்றங்களுக்கும், சுற்றியுள்ள எல்லா அறைகளுக்கும், கடவுளுடைய ஆலயத்தின் கருவூலங்களுக்கும், பரிசுத்தப் பொருட்களின் கருவூலங்களுக்கும் உரிய, அவரோடு ஆவியில் இருந்த அனைத்திற்குமான திட்டத்தையும் அவர் கொடுத்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவருடைய உள்ளத்தில் இருந்த அனைத்திற்குமான திட்டம்.” அதாவது, தாவீதின் சொந்த மனத்தில் அல்லது இருதயத்தில் இருந்தது.
    reason: alternative_reading
lexical_decisions:
- source_word: תַבְנִית
  choice: திட்டம்
  rationale: ஆலயக் கட்டுமானச் சூழலில் கட்டட அமைப்புக்கான வடிவமைப்பு அல்லது மாதிரித் திட்டத்தைக் குறிக்கிறது; நவீனத் தமிழில் ‘திட்டம்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: כֹּל אֲשֶׁר
  choice: அனைத்தும்
  rationale: தாவீது கொடுத்த ஆலயத் திட்டத்தின் முழுமையைக் குறிக்கிறது.
- source_word: הָיָה בָרוּחַ עִמּוֹ
  choice: ஆவியால் அவருக்கு அருளப்பட்ட
  rationale: எபிரெயச் சொற்றொடர் அசாதாரணமானது. சூழலும் வசனம் 19-ம் தெய்வீக வெளிப்பாட்டைச் சுட்டுவதால் இறை ஆவியின் செயல்பாட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது; தாவீதின் சொந்த மனம் என்ற சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: לְחַצְרוֹת
  choice: முற்றங்கள்
  rationale: ஆலயத்தைச் சேர்ந்த திறந்த வெளிப் பகுதிகளைக் குறிக்கும் வழக்கமான, புரியத்தக்க தமிழ் சொல்.
- source_word: בֵּית יְהוָה
  choice: ஆண்டவருடைய ஆலயம்
  rationale: ‘யெகோவாவின் வீடு’ என்பதன் பொருளை இயல்பான ஆலயச் சூழலில் தருகிறது; יהוה என்பதற்கு மரியாதைமிக்க ‘ஆண்டவர்’ பயன்படுத்தப்படுகிறது.
- source_word: לְּשָׁכוֹת סָבִיב
  choice: அதைச் சுற்றியிருந்த எல்லா அறைகள்
  rationale: ஆலயத்தைச் சுற்றி அமைந்த துணை அறைகளைத் தெளிவாகக் குறிக்கிறது.
- source_word: אֹצְרוֹת
  choice: கருவூலங்கள்
  rationale: செல்வங்கள் அல்லது அர்ப்பணிக்கப்பட்ட பொருட்கள் பாதுகாக்கப்பட்ட சேமிப்பு அறைகளை ஆலயச் சூழலுக்கேற்ற வகையில் குறிக்கிறது.
- source_word: בֵּית הָאֱלֹהִים
  choice: கடவுளுடைய ஆலயம்
  rationale: ‘கடவுளின் வீடு’ என்ற எபிரெயப் பொருளை இயல்பான தமிழில் தருவதோடு ஆலயத்தைக் குறிக்கும் இணைப்பெயராக அமைகிறது.
- source_word: הַקֳּדָשִׁים
  choice: பரிசுத்தப் பொருட்கள்
  rationale: கடவுளுக்கென்று அர்ப்பணிக்கப்பட்டு ஆலயக் கருவூலங்களில் வைக்கப்பட்ட புனிதப் பொருட்களைக் குறிக்கும் நேரடியான மொழிபெயர்ப்பு.
theological_decisions:
- issue: בָרוּחַ עִמּוֹ என்பதன் பொருள்
  choice: இறை ஆவியால் தாவீதுக்கு அருளப்பட்டவை
  alternative: தாவீதின் உள்ளத்தில் அல்லது மனத்தில் இருந்தவை
  rationale: வசனம் 19 உட்பட விரிந்த சூழல் ஆலயத் திட்டம் கடவுளிடமிருந்து கிடைத்ததைக் காட்டுவதால் இறை ஆவியைக் குறிக்கும் வாசிப்பு முதன்மைப்படுத்தப்படுகிறது. எனினும், எபிரெயத்தில் ‘அவனுடைய ஆவியில்/உள்ளத்தில்’ என்ற மனித உள்ளத்தைக் குறிக்கும் வாசிப்பும் சாத்தியம் என்பதால் அது அடிக்குறிப்பில் வைக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான, கண்ணியமான தமிழ். கட்டடச் சொற்கள் சாதாரண வாசகர்களுக்குப் புரியும் வகையில் தரப்பட்டுள்ளன. வசனம் முந்தைய வினையைத் தொடர்வதால் தமிழில் நிறைவான வாக்கியமாக ‘கொடுத்தார்’ சேர்க்கப்பட்டுள்ளது.
