revisions:
- from: '“என் மகன் சாலொமோனே, நீ உன் தகப்பனின் கடவுளை அறிந்துகொண்டு, முழு இதயத்தோடும் மனமுவந்த உள்ளத்தோடும் அவருக்குச் சேவை செய். ஏனெனில், யாவே எல்லா இதயங்களையும் ஆராய்கிறார்; எண்ணங்களில் உருவாகும் ஒவ்வொரு நோக்கத்தையும் புரிந்துகொள்கிறார். நீ அவரைத் தேடினால், அவர் உனக்குத் தம்மைக் கண்டடையச் செய்வார்[a]. ஆனால் நீ அவரைக் கைவிட்டால், அவர் உன்னை என்றென்றும் ஒதுக்கிவிடுவார்[b].”


