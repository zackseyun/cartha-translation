  text: וְ/אַתָּ֣ה שְׁלֹמֹֽה בְנִ֡/י דַּע֩ אֶת אֱלֹהֵ֨י אָבִ֜י/ךָ וְ/עָבְדֵ֗/הוּ בְּ/לֵ֤ב שָׁלֵם֙ וּ/בְ/נֶ֣פֶשׁ חֲפֵצָ֔ה כִּ֤י כָל לְבָבוֹת֙ דּוֹרֵ֣שׁ יְהוָ֔ה וְ/כָל יֵ֥צֶר מַחֲשָׁב֖וֹת מֵבִ֑ין אִֽם תִּדְרְשֶׁ֨/נּוּ֙ יִמָּ֣צֵא לָ֔/ךְ וְ/אִם תַּֽעַזְבֶ֖/נּוּ יַזְנִיחֲ/ךָ֥ לָ/עַֽד־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/009.yaml
  text: And you[a], Solomon my son, know the God of your father and serve him with a whole heart and a willing soul, for Yahweh searches all hearts and understands every intention of the thoughts. If you seek him, he will let himself be found by you; but if you forsake him[b], he will cast you off forever.
translation:
  language: ta
  text: “என் மகன் சாலொமோனே, நீ உன் தகப்பனின் கடவுளை அறிந்துகொண்டு, முழு இதயத்தோடும் மனமுவந்த உள்ளத்தோடும் அவருக்குச் சேவை செய். ஏனெனில், யாவே எல்லா இதயங்களையும் ஆராய்கிறார்; எண்ணங்களில் உருவாகும் ஒவ்வொரு நோக்கத்தையும் புரிந்துகொள்கிறார். நீ அவரைத் தேடினால், அவர் உன்னால் கண்டடையப்படுவார்[a]. ஆனால் நீ அவரைக் கைவிட்டால், அவர் உன்னை என்றென்றும் ஒதுக்கிவிடுவார்[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீ அவரைக் கண்டடைவாய்.” எபிரெய வினைச்சொல் செயப்பாட்டு வடிவில் உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவர் உன்னை என்றென்றும் நிராகரிப்பார்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּע
  choice: அறிந்துகொண்டு
  rationale: இது வெறும் அறிவுசார் தெரிதலை மட்டுமல்லாமல், கடவுளைத் தனிப்பட்ட முறையில் அறிந்து ஏற்றுக்கொள்வதையும் குறிக்கிறது. தொடர்ந்துவரும் ‘சேவை செய்’ என்ற கட்டளையுடன் இயல்பாக இணைய வினையெச்ச வடிவம் பயன்படுத்தப்பட்டது.
- source_word: אֱלֹהֵי אָבִיךָ
  choice: உன் தகப்பனின் கடவுள்
  rationale: கட்டமைப்புத் தொடரின் இயல்பான பொருளையும், தாவீதிடமிருந்து சாலொமோனுக்குத் தொடரும் குடும்ப மற்றும் உடன்படிக்கை உறவையும் காக்கிறது.
- source_word: וְעָבְדֵהוּ
  choice: அவருக்குச் சேவை செய்
  rationale: עבד என்பது கடவுளை வழிபடுவதையும் அவருக்குக் கீழ்ப்படிந்து பணிசெய்வதையும் உள்ளடக்குகிறது; ‘சேவை செய்’ இந்த விரிவான பொருளைக் காக்கிறது.
- source_word: בְּלֵב שָׁלֵם
  choice: முழு இதயத்தோடு
  rationale: שָׁלֵם என்பதன் முழுமை, ஒருமைப்பாடு, நேர்மை ஆகிய நுணுக்கங்களைத் தருகிறது; ‘குறைபாடற்ற’ என்று கூறி பாவமின்மையைப் பொருளாக்குவதைத் தவிர்க்கிறது.
- source_word: וּבְנֶפֶשׁ חֲפֵצָה
  choice: மனமுவந்த உள்ளத்தோடு
  rationale: נֶפֶשׁ குறிக்கும் உள்ளான சுயத்தையும் חֲפֵצָה குறிக்கும் விருப்பம் மற்றும் மனப்பூர்வத்தையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: כִּי כָל לְבָבוֹת דּוֹרֵשׁ יְהוָה
  choice: ஏனெனில், யாவே எல்லா இதயங்களையும் ஆராய்கிறார்
  rationale: דרשׁ இங்கு கண்டுபிடிக்க முயல்வது அல்ல; ஆழமாகச் சோதித்து அறிவதைக் குறிக்கிறது. தெய்வீகப் பெயர் பட்டத்தால் மாற்றப்படாமல் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டது.
- source_word: וְכָל יֵצֶר מַחֲשָׁבוֹת מֵבִין
  choice: எண்ணங்களில் உருவாகும் ஒவ்வொரு நோக்கத்தையும் புரிந்துகொள்கிறார்
  rationale: יֵצֶר என்பதன் உருவாக்கம், மனச்சாய்வு, நோக்கம் ஆகிய பொருட்களை எண்ணங்களின் உள் உருவாக்கத்தோடு இணைத்து தெளிவாகக் காட்டுகிறது.
- source_word: אִם תִּדְרְשֶׁנּוּ
  choice: நீ அவரைத் தேடினால்
  rationale: இந்த உடன்படிக்கைச் சூழலில் கடவுளை அர்ப்பணிப்புடனும் சார்புடனும் நாடுவதைக் குறிக்கும் நேரடியான மொழிபெயர்ப்பு.
- source_word: יִמָּצֵא לָךְ
  choice: அவர் உனக்குத் தம்மைக் கண்டடையச் செய்வார்
  rationale: Niphal வடிவிலுள்ள செயப்பாட்டு/தன்மறிவினை நுணுக்கத்தையும், கடவுள் தம்மை அணுக அனுமதிக்கிறார் என்ற பதற்றத்தையும் காக்கிறது. நேரடியான செயப்பாட்டு மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: תַּעַזְבֶנּוּ
  choice: நீ அவரைக் கைவிட்டால்
  rationale: עזב இங்கு உறவையும் விசுவாசத்தையும் துறப்பதைக் குறிக்கிறது; ‘கைவிடு’ அதன் தீவிரத்தையும் இயல்பான தமிழையும் காக்கிறது.
- source_word: יַזְנִיחֲךָ לָעַד
  choice: அவர் உன்னை என்றென்றும் ஒதுக்கிவிடுவார்
  rationale: Hiphil வடிவம் நிராகரித்து அகற்றுவதைச் சுட்டுகிறது. ‘ஒதுக்கிவிடுவார்’ எச்சரிக்கையின் கடுமையை இயல்பான தமிழில் தருகிறது; ‘நிராகரிப்பார்’ மாற்றாக அடிக்குறிப்பில் உள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எழுத்துத் தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், அதன் பொதுவாக ஏற்கப்பட்ட ஒலிப்பைத் தமிழில் தருகிறது.
theological_decisions:
- issue: ‘இதயம்’ மற்றும் ‘உள்ளம்’ என்ற மனித இயல்பு சார்ந்த சொற்கள்
  choice: לֵב என்பதற்கு ‘இதயம்’, נֶפֶשׁ என்பதற்கு ‘உள்ளம்’ என வேறுபாடு காக்கப்பட்டது.
  alternative: இரண்டையும் ‘மனம்’ என்ற உளவியல் சொல்லால் மொழிபெயர்த்தல்.
  rationale: மூல எபிரெயம் இரு சொற்களைப் பயன்படுத்தி மனிதனின் முழுமையான உள்ளார்ந்த அர்ப்பணிப்பை வலியுறுத்துகிறது. அவற்றை ஒரே உளவியல் சொல்லாகச் சுருக்குவது இந்த வேறுபாட்டை மங்கச் செய்யும்.
- issue: יִמָּצֵא לָךְ என்பதில் கடவுள் கண்டடையப்படுதல்
  choice: ‘அவர் உனக்குத் தம்மைக் கண்டடையச் செய்வார்’ என்பது முதன்மைப் பாடமாக வைக்கப்பட்டது.
  alternative: ‘அவர் உன்னால் கண்டடையப்படுவார்’ அல்லது ‘நீ அவரைக் கண்டடைவாய்.’
  rationale: Niphal வடிவம் செயப்பாட்டு/தன்மறிவினைத் தன்மையுடையது. மனிதன் தேடுவதையும் கடவுள் தம்மைக் கண்டடைய அனுமதிப்பதையும் பற்றிய உரையின் நுணுக்கமான பதற்றத்தை, பிற்கால கோட்பாட்டால் தீர்மானிக்காமல் காக்கிறது.
- issue: உடன்படிக்கை எச்சரிக்கையின் கடுமை
  choice: ‘அவர் உன்னை என்றென்றும் ஒதுக்கிவிடுவார்’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘அவர் உன்னை என்றென்றும் நிராகரிப்பார்’ அல்லது ‘கைவிடுவார்.’
  rationale: தாவீது சாலொமோனுக்குக் கூறும் எச்சரிக்கை மிகக் கடுமையானது. பரந்த இறையியல் கேள்விகளைக் கொண்டு அதை மென்மையாக்காமலும் விளக்கித் தீர்க்காமலும் வசனம் கூறும் எச்சரிக்கை அப்படியே காக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் வகையில் மரியாதையும் வேதவாக்கியத்துக்குரிய கண்ணியமும் காக்கப்பட்டுள்ளன. தேவையற்ற சமயக்குழுச் சொற்கள் தவிர்க்கப்பட்டன. மூலத்தின் ‘இதயம்/נפשׁ’ வேறுபாட்டை அளவிற்கு இயல்பாக ‘இதயம்/உள்ளம்’ மூலம் காத்துள்ளோம்; தெய்வீகப் பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது. ஆங்கில ஆலோசனைப் பாடத்தில் அடிக்குறிப்பு குறிகள் இடம் மாறியிருந்ததால், தமிழில் [a] கண்டடையப்படுதல் தொடர்பான இடத்திலும் [b] ஒதுக்கப்படுதல் தொடர்பான இடத்திலும் சரியாக வைக்கப்பட்டுள்ளன.
