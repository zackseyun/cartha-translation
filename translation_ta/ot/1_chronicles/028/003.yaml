reference: 1 Chronicles 28:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/הָ/אֱלֹהִים֙ אָ֣מַר לִ֔/י לֹא תִבְנֶ֥ה בַ֖יִת לִ/שְׁמִ֑/י כִּ֣י אִ֧ישׁ מִלְחָמ֛וֹת אַ֖תָּה וְ/דָמִ֥ים שָׁפָֽכְתָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/003.yaml
  text: But God said to me[a], ‘You shall not build a house for my name[b], because you are a man of wars and have shed blood.’
translation:
  language: ta
  text: ஆனால் கடவுள் என்னிடம், “நீ என் பெயருக்காக ஒரு வீட்டைக்[a] கட்டக்கூடாது; ஏனெனில் நீ போர்கள் புரிந்தவன்[b], இரத்தம் சிந்தியிருக்கிறாய்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘என் பெயருக்காக ஒரு வீடு’ என்பது கடவுளின் பெயருடனும் பிரசன்னத்துடனும் தொடர்புடைய இடமாகிய ஆலயத்தைக் குறிக்கிறது.
    reason: cultural_note
  - marker: b
    text: அல்லது, ‘போர்வீரன்.’ எபிரேயத்தில் சொல்லர்த்தமாக, ‘போர்களின் மனிதன்’ என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאֱלֹהִים
  choice: ஆனால் கடவுள்
  rationale: וְ என்பது அடிப்படையில் ‘மற்றும்’ எனப் பொருள்பட்டாலும், தாவீது கட்ட விரும்பியதற்கும் கடவுள் அதைத் தடுத்ததற்கும் இடையிலுள்ள எதிர்மறைத் தொடர்பை இங்கு ‘ஆனால்’ இயல்பாக வெளிப்படுத்துகிறது. אֱלֹהִים இஸ்ரவேலின் கடவுளைக் குறிக்கிறது.
- source_word: אָמַר לִי
  choice: என்னிடம் … என்றார்
  rationale: எபிரேயச் சொல்லின் நேரடி உரை அறிமுக அமைப்பைப் பாதுகாத்து, தமிழில் மேற்கோள் உரையுடன் இயல்பாக அமைகிறது.
- source_word: לֹא תִבְנֶה
  choice: நீ … கட்டக்கூடாது
  rationale: לֹא உடன் வரும் வினை வடிவம் தடை அல்லது அனுமதி மறுப்பைக் குறிக்கிறது. ‘கட்டக்கூடாது’ என்பது நவீன தமிழில் தெளிவானதும், இது வெறும் எதிர்கால முன்னறிவிப்பு என்று மட்டும் பொருள் கொள்ளாமல் தடையின் வலிமையையும் காக்கிறதுமான வடிவம்.
- source_word: בַיִת
  choice: ஒரு வீடு
  rationale: בַיִת என்பதன் நேரடிப் பொருள் ‘வீடு.’ சூழலில் இது ஆலயத்தைக் குறித்தாலும், மூலத்தின் இறையியல் சொல்லாட்சியைப் பாதுகாக்க ‘ஆலயம்’ என்று விளக்கமாக மாற்றப்படவில்லை.
- source_word: לִשְׁמִי
  choice: என் பெயருக்காக
  rationale: கடவுளின் பெயருடனும் பிரசன்னத்துடனும் தொடர்புடைய பரிசுத்த இடத்தைக் குறிக்கும் வேதாகமச் சொல்லாட்சியை நேரடியாகவும் தமிழில் இயல்பாகவும் எடுத்துரைக்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: கடவுள் கூறிய தடைக்கான காரணத்தை அறிமுகப்படுத்தும் காரண இணைப்பைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: אִישׁ מִלְחָמוֹת
  choice: போர்கள் புரிந்தவன்
  rationale: எபிரேயத்தில் சொல்லர்த்தமாக ‘போர்களின் மனிதன்’ என்று பன்மையில் உள்ளது. தமிழில் இயல்பற்ற சொல்லர்த்த வடிவத்தைத் தவிர்த்து, தொடர்ச்சியான அல்லது பல்வேறு போர் ஈடுபாடுகளை ‘போர்கள் புரிந்தவன்’ பாதுகாக்கிறது; ‘போர்வீரன்’ என்பதைக் காட்டிலும் மூல வடிவத்துக்கு நெருக்கமானது.
- source_word: וְדָמִים שָׁפָכְתָּ
  choice: இரத்தம் சிந்தியிருக்கிறாய்
  rationale: דמים שפך என்பது ‘இரத்தம் சிந்து’ என்ற வன்முறைக் கொலையைக் குறிக்கக்கூடிய மரபுத்தொடர். எபிரேயத்தில் ‘இரத்தங்கள்’ எனப் பன்மை இருந்தாலும், தமிழில் ‘இரத்தம் சிந்து’ என்பதே இயல்பான மரபுத்தொடர்; நிறைவேறிய செயலின் தற்போதைய தொடர்பை ‘சிந்தியிருக்கிறாய்’ வெளிப்படுத்துகிறது.
theological_decisions:
- issue: தாவீது ஆலயத்தைக் கட்டத் தடைசெய்யப்பட்டதற்கான காரணம்
  choice: தாவீது போர்கள் புரிந்தவனாக இருந்ததும் இரத்தம் சிந்தியிருந்ததும், கடவுளின் பெயருக்கான வீட்டைக் கட்ட அவன் அனுமதிக்கப்படாததற்குக் கடவுள் கூறிய காரணங்களாகவே மொழிபெயர்க்கப்பட்டுள்ளன.
  alternative: அந்த இரத்தச்சிந்துதல் குறிப்பாக அறநெறிப்படி குற்றமான வன்முறை என்றும், அல்லது போர்கள் நியாயமானவையாக இருந்தபோதும் சடங்குசார் தகுதியின்மை மட்டுமே ஏற்பட்டது என்றும் வெளிப்படையாக விளக்கலாம்.
  rationale: இந்த வசனம் இரத்தச்சிந்துதல் பாவமா, சடங்குசார் தகுதியின்மையா, அல்லது ஆலயத்தைக் கட்டுபவரின் பங்கிற்குப் பொருத்தமற்றதா என்பதைத் தீர்மானிக்கவில்லை. ஆகவே மொழிபெயர்ப்பு அந்த இறையியல் பதற்றத்தைத் தீர்க்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘வீடு,’ ‘என் பெயருக்காக,’ ‘போர்கள்’ ஆகிய மூல உருவகங்களும் சொல்லாட்சியும் முடிந்தவரை பாதுகாக்கப்பட்டுள்ளன. ஆங்கில ஆலோசனை உரையில் அடிக்குறி [a] தவறான இடத்தில் இருந்ததால், தமிழ் முதன்மை உரையில் அடிக்குறிகள் அவை விளக்கும் சொற்றொடர்களோடு இணைக்கப்பட்டு வாசிப்பு வரிசைப்படி மறுவரிசைப்படுத்தப்பட்டுள்ளன.
