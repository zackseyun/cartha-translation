base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/015.yaml
  text: and the weight for the lampstands of gold and their lamps of gold[a], by the weight of each lampstand and its lamps; and for the lampstands of silver, by weight for each lampstand and its lamps, according to the service of each lampstand.
translation:
  language: ta
  text: தங்க விளக்குத்தண்டுகளுக்கும் அவற்றின் தங்க விளக்குகளுக்கும் உரிய எடையை, ஒவ்வொரு விளக்குத்தண்டுக்கும் அதன் விளக்குகளுக்கும் உரிய எடையின்படி; வெள்ளி விளக்குத்தண்டுகளுக்கும், ஒவ்வொரு விளக்குத்தண்டுக்கும் அதன் விளக்குகளுக்கும் உரிய எடையை, ஒவ்வொரு விளக்குத்தண்டின் பணிக்கேற்ப, கொடுத்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் எழுத்துப்படி, எடையைக் குறிக்கும் இடத்தில் “விளக்குத்தண்டும் விளக்குத்தண்டும்” என்றும், இறுதியில் “விளக்குத்தண்டின் பணி விளக்குத்தண்டின் பணி” என்றும் மறுபதிப்பு வருகிறது. இது ஒவ்வொரு விளக்குத்தண்டையும் தனித்தனியாகக் குறிக்கும் பகிர்வுச் சொல்லமைப்பு.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁקָל
  choice: உரிய எடை
  rationale: ஆலயப் பொருட்களுக்காக எடையிட்டு ஒதுக்கப்பட்ட உலோகத்தின் அளவை இச்சொல் குறிக்கிறது; தமிழில் இயல்பாக இருக்க ‘உரிய எடை’ என மொழிபெயர்க்கப்பட்டது.
- source_word: מְנֹרוֹת
  choice: குத்துவிளக்குகள்
  rationale: מְנוֹרָה என்பது அகல்களைத் தாங்கும் விளக்குத்தண்டைக் குறிக்கிறது. ‘குத்துவிளக்கு’ என்பது தனித்தனி அகல்களிலிருந்து இதை வேறுபடுத்தும், பொதுவாசகர்களுக்குப் புரியும் தமிழ்ச் சொல்.
- source_word: נֵרֹתֵיהֶם / נֵרֹתֶיהָ
  choice: அகல்கள்
  rationale: விளக்குத்தண்டில் பொருத்தப்படும் தனித்தனி எண்ணெய் விளக்குகளைக் குறிக்கிறது; குத்துவிளக்கிலிருந்து தெளிவாக வேறுபடுத்த ‘அகல்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: זָהָב
  choice: தங்கம் / தங்க
  rationale: நேரடியான பொருட்பெயர்; எபிரெயத்தில் குத்துவிளக்குகளுக்கும் அகல்களுக்கும் தங்கம் என்று கூறப்படுவதால் இரண்டிற்கும் வெளிப்படையாகத் தக்கவைக்கப்பட்டது.
- source_word: בְּמִשְׁקַל מְנוֹרָה וּמְנוֹרָה
  choice: ஒவ்வொரு குத்துவிளக்குக்கும் ... உரிய எடையின்படி
  rationale: ‘குத்துவிளக்கும் குத்துவிளக்கும்’ என்ற எபிரெய மறுபதிப்பு பகிர்வுப் பொருளில் ஒவ்வொன்றையும் தனித்தனியாகக் குறிக்கிறது; இயல்பான தமிழில் ‘ஒவ்வொரு’ என வழங்கப்பட்டது.
- source_word: וְלִמְנֹרוֹת הַכֶּסֶף
  choice: வெள்ளிக் குத்துவிளக்குகளுக்கும்
  rationale: தங்கக் குத்துவிளக்குகளுடன் உள்ள இணை அமைப்பைத் தக்கவைக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: כַּעֲבוֹדַת מְנוֹרָה וּמְנוֹרָה
  choice: ஒவ்வொரு குத்துவிளக்கும் செய்ய வேண்டிய பணிக்கு ஏற்ப
  rationale: עֲבוֹדָה இங்கு ஒவ்வொரு வெள்ளிக் குத்துவிளக்கின் நியமிக்கப்பட்ட ஆலயப் பணி அல்லது பயன்பாட்டைக் குறிக்கலாம். ‘செய்ய வேண்டிய பணி’ ஆலயச் சூழலைத் தக்கவைத்து தமிழில் தெளிவாக உள்ளது.
theological_decisions:
- issue: עֲבוֹדָה என்பதன் பொருள்
  choice: செய்ய வேண்டிய பணி
  alternative: பயன்பாடு / சேவை
  rationale: இச்சூழலில் அது வழிபாட்டுப் பணி அல்லது நடைமுறைப் பயன்பாடு என இருவகையில் நுணுக்கம் கொண்டிருக்கலாம். ஒரு குறிப்பிட்ட சடங்கியல் விளக்கத்தைத் திணிக்காமல் ‘பணி’ எனப் பொதுவாக வைக்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில், ஆலயப் பட்டியல் சூழலுக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. வசனம் முந்தைய வாக்கியத்துடன் தொடர்வதால், தமிழில் முழுமையான வாக்கியமாக வாசிக்க ‘கொடுத்தார்’ சேர்க்கப்பட்டுள்ளது; இது உடனடி இலக்கியச் சூழலில் உள்ள பிரதான வினையை வெளிப்படுத்துகிறது. நீண்ட பட்டியல் அமைப்பை வாசிக்க உதவ இடைக்கோடுகள் பயன்படுத்தப்பட்டன.
