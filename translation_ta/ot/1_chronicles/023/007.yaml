  text: 'For the Gershonites: Ladan and Shimei[a].'
translation:
  language: ta
  text: 'கேர்சோனியர் பிரிவில்: லாதானும் சிமேயியும்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לַגֵּרְשֻׁנִּי
  choice: கேர்சோனியர்களில்
  rationale: முன்னொட்டு ל இங்கு லேவியர்களுக்குள் அடுத்து பட்டியலிடப்படும் பிரிவைக் குறிக்கிறது. தமிழில் ‘கேர்சோனியர்களில்’ என்பது ‘கேர்சோனியர்களைச் சேர்ந்தவர்களில்’ என்ற தலைப்புப்போன்ற பொருளை இயல்பாகவும் சுருக்கமாகவும் தருகிறது.
- source_word: לַעְדָּן
  choice: லாதான்
  rationale: இது மொழிபெயர்க்கப்பட வேண்டிய பொதுப்பெயர் அல்ல, ஒலிபெயர்க்கப்பட வேண்டிய நபர்ப் பெயர். எபிரெய வடிவிலுள்ள நீண்ட உயிரொலியைத் தெளிவாகக் காட்ட ‘லாதான்’ பயன்படுத்தப்பட்டது.
- source_word: וְשִׁמְעִי
  choice: சிமேயியும்
  rationale: וְ என்பது பெயர்ப்பட்டியலின் இரண்டாம் பெயரை இணைக்கிறது. தமிழில் இணைப்பை இயல்பாகக் காட்ட ‘-உம்’ பயன்படுத்தப்பட்டு, שִׁמְעִי ‘சிமேயி’ என ஒலிபெயர்க்கப்பட்டது.
