  source_fidelity: 'மூல எபிரெயத்தில் உள்ள לַגֵּרְשֻׁנִּי என்பது பட்டியலின் பிரிவுத் தலைப்பாக ‘கேர்சோனியருக்கு/கேர்சோனியர் பிரிவில்’ என்ற பொருளைத் தருகிறது; லாதான், சிமேயி என்ற இரு பெயர்களும் சரியாக உள்ளன. ஆனால் தற்போதைய அடிக்குறிப்பு மூலத்திற்கோ ஆங்கில POB அடிக்குறிப்புக்கோ ஒத்ததல்ல: லிப்னி என்பது இவ்வசனத்தில் லாதானுக்கான மாற்றுப் பெயர் அல்ல.'
  naturalness: ‘கேர்சோனியர்களில்’ என்பது ‘அவர்களுக்குள்’ என்ற இடப்பொருளைத் தருவதால் பட்டியல் தலைப்பாகச் சற்றே இயல்பற்றது. ‘கேர்சோனியர் பிரிவில்’ என்பது நவீனத் தரத் தமிழில் பிரிவு-பட்டியல் அமைப்பைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
  terminology: கேர்சோனியர், லாதான், சிமேயி ஆகிய ஒலிபெயர்ப்புகள் ஏற்றவை. தவறான பெயர்-மாறுபாடு அடிக்குறிப்பு நீக்கப்பட வேண்டும். ஆங்கில audit trail-இல் உள்ள Laadan/Ladan எழுத்துவடிவக் குறிப்பு, தமிழில் பொருள்மிக்க வேறு பெயர் குறிப்பு ஒன்றைச் சேர்க்கக் காரணமல்ல.
