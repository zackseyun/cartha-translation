- from: 'ஏனெனில், யாவேயின் ஆலயப் பணியில் ஆரோனின் மக்களுக்கு உதவுவதே அவர்களுடைய கடமையாக இருந்தது: முற்றங்களையும் அறைகளையும் கவனிப்பதும், பரிசுத்தமான அனைத்தையும் தூய்மைப்படுத்துவதும், கடவுளின் ஆலயப் பணிக்குரிய வேலைகளைச் செய்வதும் அவர்களுடைய பொறுப்பாக இருந்தது.[a]'
  to: ஏனெனில், யாவேயின் ஆலயச் சேவையில் ஆரோனின் மகன்களுக்கு உதவுவதற்கும்,[b] முற்றங்கள் மற்றும் அறைகளைக் கவனிப்பதற்கும், பரிசுத்தமான அனைத்தையும் தூய்மைப்படுத்துவதற்கும்,[c] கடவுளின் ஆலயச் சேவையின் பணிகளைச் செய்வதற்கும் அவர்களுடைய நியமிக்கப்பட்ட பொறுப்பு இருந்தது.[a]
