base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/028.yaml
  text: For their duty was to assist the sons of Aaron in the service of the house of Yahweh, concerning the courts and the chambers, and the purification of all that is holy, and the work of the service of the house of God.
translation:
  language: ta
  text: ஏனெனில், யாவேயின் ஆலயச் சேவையில் ஆரோனின் மகன்களுக்கு உதவுவதற்கும்,[b] முற்றங்கள் மற்றும் அறைகளைக் கவனிப்பதற்கும், பரிசுத்தமான அனைத்தையும் தூய்மைப்படுத்துவதற்கும்,[c] கடவுளின் ஆலயச் சேவையின் பணிகளைச் செய்வதற்கும் அவர்களுடைய நியமிக்கப்பட்ட பொறுப்பு இருந்தது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவர்களுடைய நியமிக்கப்பட்ட பொறுப்பு” என்பதற்கு “அவர்களுடைய பணி நிலை” அல்லது “அவர்களுடைய சேவைப் பொறுப்பு” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லளவில், “ஆரோனின் மகன்களின் கையருகே” என்று உள்ளது; அதாவது, அவர்களுடன் இணைந்து அல்லது அவர்களுக்கு உதவிசெய்தல்.
    reason: lexical_alternative
  - marker: c
    text: “பரிசுத்தமான ஒவ்வொன்றின் தூய்மைப்படுத்துதல்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய சூழலில் லேவியர்களுக்கு அளிக்கப்பட்ட பணிநியமனத்தை விளக்கும் காரணத் தொடர்பை இயல்பான தமிழில் காட்டுகிறது.
- source_word: מַעֲמָדָם
  choice: அவர்களுடைய கடமை
  rationale: ஒதுக்கப்பட்ட நிலை, பொறுப்பு அல்லது சேவைப் பதவி என்ற பொருள்களில், இச்சூழலில் செயல்சார் நியமனத்தைத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: לְיַד בְּנֵי אַהֲרֹן
  choice: ஆரோனின் மக்களுக்கு உதவுவது
  rationale: சொல்லளவில் ‘ஆரோனின் மக்களின் கையருகே’ என இருந்தாலும், இங்கு ஆசாரியர்களுக்கு ஆதரவாகப் பணிபுரிவதைக் குறிக்கிறது; அதிகார அடுக்கை மிகைப்படுத்தாமல் உறவை வெளிப்படுத்துகிறது.
- source_word: לַעֲבֹדַת בֵּית יְהוָה
  choice: யாவேயின் ஆலயப் பணியில்
  rationale: עֲבֹדָה வழிபாட்டு அல்லது ஆலயச் சேவையைக் குறிக்கிறது; בֵּית என்பதற்கு இச்சூழலில் இயல்பான தமிழாக ‘ஆலயம்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய இறைபெயரான நான்கெழுத்துப் பெயரை ஒரு பொதுப்பட்டமாக மாற்றாமல் பெயராகவே வழங்குகிறது.
- source_word: עַל הַחֲצֵרוֹת וְעַל הַלְּשָׁכוֹת
  choice: முற்றங்களையும் அறைகளையும் கவனிப்பது
  rationale: עַל இங்கு வெறும் இடத்தைக் காட்டாமல் பொறுப்பின் துறைகளைச் சுட்டுகிறது; ‘கவனிப்பது’ அந்த நிர்வாகப் பொறுப்பை இயல்பான தமிழில் தருகிறது.
- source_word: וְעַל טָהֳרַת לְכָל קֹדֶשׁ
  choice: பரிசுத்தமான அனைத்தையும் தூய்மைப்படுத்துவது
  rationale: கூட்டுப்பொருளில் வரும் קֹדֶשׁ என்பதன் பரந்த வரம்பைத் தக்கவைத்து, சடங்குசார் தூய்மையை அளவுக்கு மீறி விளக்காமல் மொழிபெயர்க்கிறது.
- source_word: וּמַעֲשֵׂה עֲבֹדַת בֵּית הָאֱלֹהִים
  choice: கடவுளின் ஆலயப் பணிக்குரிய வேலைகளைச் செய்வது
  rationale: מַעֲשֵׂה மற்றும் עֲבֹדַת ஆகிய இரு செயற்பாட்டுச் சொற்களின் இணைந்த வலியுறுத்தலை வாசிக்க இயல்பான தமிழில் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைபெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பொதுப்பட்டம் அல்ல, தனிப்பட்ட உடன்படிக்கைப் பெயர் இடம்பெறுவதால் அதை ஒலிபெயர்த்து வழங்குவது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: לְיַד בְּנֵי אַהֲרֹן என்பதில் லேவியர்களுக்கும் ஆரோனிய ஆசாரியர்களுக்கும் உள்ள உறவு
  choice: ஆரோனின் மக்களுக்கு உதவுவது
  alternative: ஆரோனின் மக்களின் கீழ் பணியாற்றுவது
  rationale: எபிரெயச் சொற்றொடர் ஆதரவுப் பணியைத் தெரிவிக்கிறது; ஆனால் ‘கீழ்’ என்று கூறுவது உரையில் வெளிப்படையாக இல்லாத அதிகார உறவை வலுப்படுத்தக்கூடும்.
- issue: טָהֳרַת לְכָל קֹדֶשׁ என்பதன் பொருள் வரம்பு
  choice: பரிசுத்தமான அனைத்தையும் தூய்மைப்படுத்துவது
  alternative: ஒவ்வொரு பரிசுத்தப் பொருளையும் தூய்மைப்படுத்துவது
  rationale: קֹדֶשׁ கூட்டுப்பொருளில் பரந்ததாக இருக்கலாம்; அதை பொருட்களுக்கு மட்டுமே வரையறுக்காமல் மூலத்தின் பொதுமையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் எளிய புரிதலும் இணையும் ஆலய-நிர்வாக நடையில் வடிவமைக்கப்பட்டது. நீண்ட எபிரெயப் பட்டியல், தமிழில் தெளிவாக வாசிக்க இருபுள்ளிக்குப் பின் இணைச் செயற்பாடுகளாக அமைக்கப்பட்டுள்ளது; ‘பரிசுத்தம்’, ‘தூய்மைப்படுத்துதல்’ போன்ற நிலைபெற்ற சமயச் சொற்கள் பயன்படுத்தப்பட்டாலும் பிரிவுசார் விளக்கங்கள் தவிர்க்கப்பட்டுள்ளன.
