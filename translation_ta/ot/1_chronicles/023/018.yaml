lexical_decisions:
- source_word: בְּנֵי
  choice: மகன்களில்
  rationale: בֵּן என்பதன் பன்மை இணைப்பு வடிவம். இங்கு ஒரே பெயர் மட்டும் தொடர்ந்து வருவதால், தமிழில் இயல்பாகப் பட்டியல் உறவை வெளிப்படுத்த “மகன்களில்” என மொழிபெயர்க்கப்பட்டது; “வழித்தோன்றல்களில்” என்பது மூலச்சொல்லைவிட விரிவானது.
- source_word: יִצְהָר
  choice: இஸ்கார்
  rationale: தனிப்பட்ட நபரின் பெயர்; எபிரெய ஒலிப்புக்கு அண்மையாகத் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: שְׁלֹמִית
  choice: செலோமித்
  rationale: தனிப்பட்ட நபரின் பெயர்; எபிரெய ஒலிப்புக்கு அண்மையாகத் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: הָרֹאשׁ
  choice: தலைவன்
  rationale: உறுப்புடன் வரும் רֹאשׁ இவ்வம்ச/அமைப்புப் பட்டியலில் முதன்மை அல்லது தலைமை நிலையைக் குறிக்கிறது. “தலைவன்” என்பது நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், சுருக்கமான வம்சப்பட்டியல் நடையையும் மூலத்தின் பொருள் நெருக்கத்தையும் காக்கும் வகையில் மொழிபெயர்க்கப்பட்டது. הָרֹאשׁ என்பதிலுள்ள தலைமை/முதன்மை சார்ந்த பொருள் வேறுபாடு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
