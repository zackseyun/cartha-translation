  source_fidelity: The construct phrase בְּנֵי יִצְהָר means “the sons of Izhar,” introducing the line/list. The draft’s “இஸ்காரின் மகன்களில்” means “among Izhar’s sons” and wrongly makes the following name partitive. “தலைவன்” appropriately conveys הָרֹאשׁ as the principal/head member, while the note preserves viable lexical alternatives.
  naturalness: The revised colon-headed genealogical formulation is concise and natural in modern standard Tamil, and it matches the list-like style of the source.
  terminology: “இஸ்கார்” and “செலோமித்” retain established Tamil biblical name forms. “தலைவனான” clearly links Shelomith with the title without adding interpretive content.
