source:
  edition: WLC
  text: בְּנֵ֥י עַמְרָ֖ם אַהֲרֹ֣ן וּ/מֹשֶׁ֑ה וַ/יִּבָּדֵ֣ל אַהֲרֹ֡ן לְֽ/הַקְדִּישׁ/וֹ֩ קֹ֨דֶשׁ קָֽדָשִׁ֤ים הֽוּא וּ/בָנָי/ו֙ עַד עוֹלָ֔ם לְ/הַקְטִיר֩ לִ/פְנֵ֨י יְהוָ֧ה לְ/שָׁרְת֛/וֹ וּ/לְ/בָרֵ֥ךְ בִּ/שְׁמ֖/וֹ עַד עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/013.yaml
  text: 'The sons of Amram: Aaron and Moses. And Aaron was set apart[a], he and his sons forever, to sanctify him as most holy, to burn incense before Yahweh, to minister to him, and to bless in his name forever.'
translation:
  language: ta
  text: 'அம்ராமின் மகன்கள்: ஆரோனும் மோசேயும். ஆரோன் தனியே பிரித்துவைக்கப்பட்டான்—அவனை மிகப் பரிசுத்தமானவனாகப் பரிசுத்தப்படுத்தவும்,[a] அவனும் அவனுடைய மகன்களும் என்றென்றும் யெகோவாவின் முன்னிலையில் தூபம் செலுத்தவும், அவருக்குப் பணிவிடை செய்யவும், அவருடைய பெயரில் ஆசீர்வதிக்கவும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பரிசுத்தங்களின் பரிசுத்தம்.” எபிரெயச் சொற்றொடரின் நேரடிப் பொருள் “பரிசுத்தத்தின் பரிசுத்தங்கள்”; இது மிகைநிலையாக “மிகப் பரிசுத்தமான” என்ற பொருளைத் தருகிறது.
    reason: קֹדֶשׁ קָדָשִׁים என்ற எபிரெய மிகைநிலைச் சொற்றொடரின் நேரடிப் பொருளையும் இயல்பான மொழிபெயர்ப்பையும் வழங்குகிறது.
lexical_decisions:
- source_word: בְּנֵי עַמְרָם
  choice: அம்ராமின் மகன்கள்
  rationale: இங்கு உடனடியாக ஆரோனும் மோசேயும் பெயரிடப்படுவதால், בְּנֵי என்பதன் நேரடிப் பொருளான ‘மகன்கள்’ பொருத்தமானது.
- source_word: וַיִּבָּדֵל
  choice: தனியே பிரித்துவைக்கப்பட்டான்
  rationale: בדל என்பதன் நிஃபால் வடிவம் ஒரு சிறப்புப் பணிக்காக வேறுபடுத்தி வைப்பதைக் குறிக்கிறது; ‘பிரித்துவைக்கப்பட்டான்’ அர்ப்பணிப்பு சார்ந்த நுண்பொருளையும் தெளிவாகத் தருகிறது.
- source_word: לְהַקְדִּישׁוֹ
  choice: அவனை … அர்ப்பணிப்பதற்கு
  rationale: קדש என்பதன் ஹிஃபில் வடிவம் பரிசுத்தமாக்குதல் அல்லது பரிசுத்தப் பணிக்காக அர்ப்பணித்தல் எனப் பொருள்படும். ஆண்பால் ஒருமை பின்னொட்டு ஆரோனைக் குறிப்பதாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: மிகப் பரிசுத்தமானவனாக
  rationale: ‘பரிசுத்தங்களின் பரிசுத்தம்’ என்ற எபிரெய மிகைநிலைச் சொற்றொடர் இங்கு ஆரோனுடைய அர்ப்பணிக்கப்பட்ட நிலையைச் சுட்டுவதால், இயல்பான தமிழில் ‘மிகப் பரிசுத்தமானவனாக’ என வழங்கப்பட்டுள்ளது.
- source_word: הוּא וּבָנָיו
  choice: அவனும் அவனுடைய மகன்களும்
  rationale: ஆரோனையும் அவனுடைய மகன்களையும் வெளிப்படையாகக் குறிப்பிடும் எபிரெய அமைப்பு காக்கப்பட்டுள்ளது.
- source_word: עַד עוֹלָם
  choice: என்றென்றும்
  rationale: தொடர்ந்து நிலைக்கும் ஆசாரியப் பணியைச் சுருக்கமாகவும் கண்ணியமாகவும் வெளிப்படுத்துகிறது.
- source_word: לְהַקְטִיר
  choice: தூபம் காட்டி
  rationale: ஆசாரியச் சூழலில் קטר தூபத்தைப் புகைக்கச் செய்வதைக் குறிக்கிறது; ‘தூபம் காட்டுதல்’ நவீனத் தமிழில் இயல்பான சமயப் பயன்பாடு.
- source_word: לִפְנֵי יְהוָה
  choice: யெகோவாவின் முன்னிலையில்
  rationale: לִפְנֵי என்பது ஒருவரின் முன்னிலை அல்லது சந்நிதியைக் குறிக்கிறது; தெய்வீகப் பெயர் ஒலிபெயர்ப்பாக வழங்கப்பட்டுள்ளது.
- source_word: לְשָׁרְתוֹ
  choice: அவருக்குப் பணிவிடை செய்து
  rationale: שרת என்பதன் ஆசாரியச் சேவை நுண்பொருளை ‘பணிவிடை’ காக்கிறது; அருகிலுள்ள யெகோவாவே ஒருமைப் பின்னொட்டின் இயல்பான குறிப்பு.
- source_word: וּלְבָרֵךְ בִּשְׁמוֹ
  choice: அவருடைய பெயரில் ஆசீர்வதித்து
  rationale: ஆசீர்வாதம் யெகோவாவின் பெயராலும் அதிகாரத்தாலும் வழங்கப்படுவதைச் சொற்றொடர் குறிக்கிறது; ‘பெயரில்’ என்பது கருவி அல்லது அதிகாரம் என்ற நுண்மையான இருபொருள் வாய்ப்பைக் காக்கிறது.
theological_decisions:
- issue: לְהַקְדִּישׁוֹ மற்றும் לְשָׁרְתוֹ ஆகியவற்றிலுள்ள ஒருமைப் பின்னொட்டுகளின் குறிப்பு
  choice: ‘அவனை அர்ப்பணிப்பதற்கு’ என்பதில் ஆரோனும், ‘அவருக்குப் பணிவிடை செய்து’ என்பதில் யெகோவாவும் குறிக்கப்படுகின்றனர்.
  alternative: முதல் பின்னொட்டை ‘மிகப் பரிசுத்தமானவற்றைப் பரிசுத்தப்படுத்த’ என்றும், இரண்டாவதை ஆரோனுக்குச் செய்யும் சேவை என்றும் புரிந்துகொள்ளலாம்.
  rationale: ‘ஆரோன் பிரித்துவைக்கப்பட்டான்’ என்பதற்குப் பின் வரும் ஆண்பால் ஒருமை ஆரோனை இயல்பாகச் சுட்டுகிறது; ‘யெகோவாவின் முன்னிலையில்’ என்ற அண்மையான தெய்வீகக் குறிப்பு சேவை யெகோவாவுக்குரியது என்பதை ஆதரிக்கிறது. இருப்பினும் எபிரெயத் தொடரின் சுருக்கத்தால் உருவாகும் பதற்றம் அடிக்குறிப்பில் மறைக்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதாகம நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ஆரோனுக்கான ‘அவன்’ மற்றும் யெகோவாவுக்கான மரியாதைப் பன்மையான ‘அவர்’ ஆகியவை குறிப்புகளைத் தெளிவாக்குகின்றன. மூலத்தின் நீண்ட நோக்கத் தொடரை வாசிக்க எளிதாக்க நீண்ட கோடு பயன்படுத்தப்பட்டுள்ளது; வாக்கியத்தின் இறுதியில் முதன்மை வினை மீண்டும் சொல்லப்பட்டிருப்பது தமிழில் தொடரைத் தெளிவாக்குகிறது.
