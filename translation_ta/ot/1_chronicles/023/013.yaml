  source_fidelity: வரைவில் எபிரெய மூலத்தின் முக்கிய கூறுகள்—அம்ராமின் மகன்கள், ஆரோன் பிரித்துவைக்கப்பட்டமை, மிகைநிலைப் பரிசுத்தம், ஆரோனும் அவன் மகன்களும், யெகோவாவின் முன்னிலையில் தூபம் செலுத்துதல், சேவை, பெயரில் ஆசீர்வதித்தல்—பெரும்பாலும் காக்கப்பட்டுள்ளன. ஆனால் முதன்மை வினை இறுதியில் மீண்டும் வருவதால், நோக்கத் தொடர்கள் அனைத்தும் ‘பிரித்துவைக்கப்பட்டான்’ என்பதோடு இயல்பாக இணைவதில்லை. திருத்தம் எபிரெயத்தின் தொடர்ச்சியான நோக்க அமைப்பைத் தெளிவாகக் காட்டுகிறது.
  naturalness: ‘தூபம் காட்டி’ என்பதற்குப் பதிலாக ‘தூபம் செலுத்தவும்’ என்பது நவீன நிலையான தமிழில் ஆசாரியச் செயலை இன்னும் துல்லியமாகவும் இயல்பாகவும் தெரிவிக்கிறது. மீண்டும் வரும் ‘அவன் பிரித்துவைக்கப்பட்டான்’ நீக்கப்பட்டதால் வாக்கியம் செம்மையாகிறது.
  terminology: ‘தனியே பிரித்துவைக்கப்பட்டான்,’ ‘மிகப் பரிசுத்தமானவனாகப் பரிசுத்தப்படுத்த,’ ‘பணிவிடை செய்ய,’ ‘ஆசீர்வதிக்க’ ஆகியவை மூலத்தின் ஆசாரிய மற்றும் பரிசுத்த மொழிநடையைப் பாதுகாக்கின்றன. ‘யெகோவா’ என்ற பெயர்வடிவம் வரைவின் நடைமுறையோடு தொடர்கிறது.
