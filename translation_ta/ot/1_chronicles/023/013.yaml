revisions:
- from: 'அம்ராமின் மகன்கள்: ஆரோனும் மோசேயும். ஆரோன் தனியே பிரித்துவைக்கப்பட்டான்—அவனை மிகப் பரிசுத்தமானவனாக[a] அர்ப்பணிப்பதற்கும், அவனும் அவனுடைய மகன்களும் என்றென்றும் யெகோவாவின் முன்னிலையில் தூபம் காட்டி, அவருக்குப் பணிவிடை செய்து, அவருடைய பெயரில் ஆசீர்வதிப்பதற்கும் அவன் பிரித்துவைக்கப்பட்டான்.'
  to: 'அம்ராமின் மகன்கள்: ஆரோனும் மோசேயும். ஆரோன் தனியே பிரித்துவைக்கப்பட்டான்—அவனை மிகப் பரிசுத்தமானவனாகப் பரிசுத்தப்படுத்தவும்,[a] அவனும் அவனுடைய மகன்களும் என்றென்றும் யெகோவாவின் முன்னிலையில் தூபம் செலுத்தவும், அவருக்குப் பணிவிடை செய்யவும், அவருடைய பெயரில் ஆசீர்வதிக்கவும்.'
  rationale: திருத்தம் மூலத்தின் சொற்களஞ்சியத்தையும் தேர்ந்தெடுக்கப்பட்ட ஒருமைச் சுட்டுப்பொருள் வாசிப்பையும் காக்கிறது. அதே வேளையில், தமிழில் தேவையற்ற வினை மறுமொழியை நீக்கி, ஆரோனும் அவன் மகன்களும் செய்யும் தொடர்ச்சியான ஆசாரியப் பணிகளை இணையான நோக்கத் தொடர்களாக வழங்குகிறது. அடிக்குறிப்பு ஆதரிக்கப்படாத விரிவான மாற்று விளக்கத்தைச் சேர்க்காமல், சொற்றொடரின் உண்மையான சொற்பொருள் மாற்றை மட்டும் தருகிறது.
