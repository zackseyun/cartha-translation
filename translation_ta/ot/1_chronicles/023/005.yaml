  text: and four thousand gatekeepers[a], and four thousand praising Yahweh with the instruments that I made to praise him.
translation:
  language: ta
  text: வாயிற்காவலர்கள் நாலாயிரம் பேர்; யாவேவைப் புகழ்வதற்காக நான் செய்த கருவிகளைக் கொண்டு புகழ்பவர்கள் நாலாயிரம் பேர்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் இறுதி ‘புகழ’ என்பதன் செயப்படுபொருள் வெளிப்படையாக இல்லை; சூழலில் அது யாவேவைக் குறிக்கிறது. ‘கருவிகள்’ என்பவை சூழலின்படி இசைக்கருவிகளாக இருக்கலாம்.
    reason: இறுதி வினையெச்சத்தின் வெளிப்படாத செயப்படுபொருளையும் ‘கருவிகள்’ என்பதன் சூழல்சார் பொருளையும் விளக்குகிறது.
lexical_decisions:
- source_word: שֹׁעֲרִים
  choice: வாயிற்காவலர்கள்
  rationale: ஆலயத்தின் வாயில்களில் பணியமர்த்தப்பட்டவர்களைக் குறிக்கும் பெயர்ச்சொல்; ‘வாயிற்காவலர்கள்’ என்பது இச்சூழலில் துல்லியமும் இயல்பும் உடைய நவீனத் தமிழ் சொல்.
- source_word: מְהַלְלִים
  choice: புகழ்பவர்கள்
  rationale: தொடர்ச்சியான பணி அல்லது பொறுப்பைக் குறிக்கும் எபிரெயப் பங்கேற்புவினையின் பொருளைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לַיהוָה
  choice: யாவேவை
  rationale: יהוה என்ற தனிப்பெயரைப் பட்டப்பெயராக மாற்றாமல், தமிழில் ‘யாவே’ என்று ஒலிபெயர்த்துள்ளது.
- source_word: בַּכֵּלִים
  choice: கருவிகளைக் கொண்டு
  rationale: כֵּלִים என்பது பொதுவாகக் கருவிகள் அல்லது உபகரணங்களைக் குறிக்கும்; புகழ்ச்சி குறித்த சூழல் அவை இசைக்கருவிகள் என்பதை உணர்த்தினாலும், மூலத்தின் பொதுத்தன்மையை முதன்மை உரை காக்கிறது.
- source_word: אֲשֶׁר עָשִׂיתִי לְהַלֵּל
  choice: புகழ்வதற்காக நான் செய்த
  rationale: முதலாம் நபர் வினையையும் நோக்கத்தைக் குறிக்கும் வினையெச்சத்தையும் நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: וְאַרְבַּעַת אֲלָפִים ... וְאַרְבַּעַת אֲלָפִים
  choice: நாலாயிரம் பேர் ... நாலாயிரம் பேர்
  rationale: இரு தனித்த பணிக்குழுக்களையும் எபிரெய மூலத்தைப் போலத் தனித்தனியே எண்ணிக் காட்டுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர் / யெகோவா
  rationale: மூலத்தில் உள்ள உடன்படிக்கைத் தனிப்பெயரைப் பாதுகாக்க ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது; அதை ஒரு பட்டப்பெயராக மாற்றவோ ‘யெகோவா’ என்ற பிற்கால கலப்பு உச்சரிப்பைப் பயன்படுத்தவோ இல்லை.
- issue: לְהַלֵּל என்பதற்கான வெளிப்படாத செயப்படுபொருள்
  choice: முதற் கூறில் ‘யாவேவை’ என்றும் அடுத்த கூறில் இயல்புக்காக ‘அவரை’ என்றும் வெளிப்படுத்தப்பட்டது
  alternative: செயப்படுபொருளின்றி ‘புகழ்வதற்காக’ என்று மட்டும் விடுதல்
  rationale: இலக்கணரீதியாக இறுதிச் சொற்றொடரில் செயப்படுபொருள் வெளிப்படையாக இல்லை; ஆயினும் உடனுள்ள לַיהוָה அதன் இயல்பான குறிக்கோளைத் தெளிவாக்குகிறது. தமிழில் குழப்பத்தைத் தவிர்க்க ‘அவரை’ சேர்க்கப்பட்டுள்ளது; இதை அடிக்குறிப்பு தெரிவிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘வாயிற்காவலர்கள்’ ஆலய நிர்வாகச் சூழலைத் துல்லியமாகக் காட்டுகிறது; ‘கருவிகள்’ மூலச்சொல்லின் பரந்த பொருளைக் காக்கிறது.
