source:
  edition: WLC
  text: בְּנֵ֣י מוּשִׁ֗י מַחְלִ֥י וְ/עֵ֛דֶר וִ/ירֵמ֖וֹת שְׁלֹשָֽׁה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/023.yaml
  text: 'The sons of Mushi: Mahli[a], Eder, and Jeremoth—three.'
translation:
  language: ta
  text: 'மூஷியின் மகன்கள்: மக்லி, ஏதேர், யிரேமோத்—மூவர்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: இது ‘மகன்’ என்பதன் பன்மை இணைப்புநிலை வடிவம்; தொடர்ந்து மூன்று தனிநபர்களின் பெயர்கள் வருவதால் ‘மகன்கள்’ என்பது நேரடியான, இயல்பான மொழிபெயர்ப்பு.
- source_word: מוּשִׁי
  choice: மூசி
  rationale: தனிப்பட்ட நபரின் பெயர்; எபிரெய ஒலிப்பைத் தமிழில் இயன்றவரை இயல்பாக ஒலிபெயர்த்துள்ளது.
- source_word: מַחְלִי
  choice: மக்லி
  rationale: தனிப்பட்ட நபரின் பெயர்; மூல வடிவத்தின் மெய்யொலித் தொடரைத் தெளிவாகக் காக்கும் ஒலிபெயர்ப்பு.
- source_word: וְעֵדֶר
  choice: ஏதேர்
  rationale: இணைப்புச்சொல்லுடன் வரும் தனிப்பெயர். தமிழ்ப் பட்டியலில் இறுதிப் பெயருக்கு முன் மட்டும் ‘மற்றும்’ பயன்படுத்துவது இயல்பானதால், இங்கு பெயர் மட்டும் தரப்பட்டுள்ளது.
- source_word: וִירֵמוֹת
  choice: எரேமோத்
  rationale: இணைப்புச்சொல்லுடன் வரும் தனிப்பெயர்; எபிரெய உச்சரிப்பை அடிப்படையாகக் கொண்ட தமிழ் ஒலிபெயர்ப்பு. ஆங்கில மரபிலுள்ள Jeremoth/Jerimoth என்ற எழுத்துவேறுபாடு தமிழ்மூல மொழிபெயர்ப்பில் தனிக் குறிப்பைத் தேவைப்படுத்தாது.
- source_word: שְׁלֹשָׁה
  choice: மூவர்
  rationale: பட்டியலிடப்பட்ட மனிதர்களின் மொத்த எண்ணிக்கையைச் சுருக்கிக் கூறும் எண்; நபர்களைக் குறிக்கும் இயல்பான தமிழ் எண்ணுப்பெயராக ‘மூவர்’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், வம்சப்பட்டியல் நடைக்கு ஏற்ற சுருக்கமானதும் கண்ணியமானதும் ஆன வடிவம். மூலத்தின் பட்டியல்-முடிவுத் தொகை அமைப்பை நீள்கோடு காக்கிறது. மூலத்தில் ‘மற்றும்’ இரண்டாவது, மூன்றாவது பெயர்களுக்கு முன் வந்தாலும், தமிழில் இயல்பான பட்டியல் தொடருக்காக அது வெளிப்படையாகச் சேர்க்கப்படவில்லை.
