  variant: modern standard Tamil
source:
  edition: WLC
  text: וּ/מֹשֶׁ֖ה אִ֣ישׁ הָ/אֱלֹהִ֑ים בָּנָ֕י/ו יִקָּרְא֖וּ עַל שֵׁ֥בֶט הַ/לֵּוִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/014.yaml
  text: And as for Moses, the man of God, his sons were counted among the tribe of Levi.
translation:
  language: ta
  text: தேவனுடைய மனிதராகிய மோசேயின் மகன்கள் லேவி கோத்திரத்தாரோடு சேர்த்து எண்ணப்பட்டார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  choice: தேவனுடைய மனிதர்
  rationale: மோசேயுக்குரிய மரியாதைப்பட்டத்தை அதன் இயல்பான உடைமைத் தொடர்புடன் நேரடியாகவும் புரிந்துகொள்ளத்தக்க வகையிலும் வழங்குகிறது.
- source_word: יִקָּרְאוּ עַל
  choice: சேர்த்து எண்ணப்பட்டார்கள்
  rationale: சொல்லடியாக ‘பெயரிடப்பட்டார்கள்/அழைக்கப்பட்டார்கள்’ எனினும், வம்ச மற்றும் கோத்திரப் பதிவுச் சூழலில் ஒருவரோடு அல்லது ஒரு குழுவோடு இணைத்துப் பதிவு செய்யப்படுவதைக் குறிக்கிறது.
- source_word: שֵׁבֶט הַלֵּוִי
  choice: லேவி கோத்திரத்தார்
  rationale: இங்கு ‘கோத்திரம்’ என்பது நிலப்பகுதியைவிட லேவியர் எனும் மக்கள் குழுவைக் குறிப்பதால், தமிழில் இயல்பாகக் குழுவினருடன் சேர்த்து எண்ணப்பட்டார்கள் என அமைக்கப்பட்டது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில் சுருக்கமான, கண்ணியமான வரலாற்று நடையைக் கடைப்பிடிக்கிறது. ‘தேவனுடைய மனிதர்’ என்ற வேதாகம மரியாதைப்பட்டமும், மகன்கள் லேவி கோத்திரப் பதிவில் இணைக்கப்பட்டனர் என்ற பொருளும் பாதுகாக்கப்பட்டுள்ளன.
