base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/022.yaml
  text: Eleazar died and had no sons[a], but only daughters; and the sons of Kish, their brothers[b], married them.
translation:
  language: ta
  text: எலெயாசார் இறந்தார். அவருக்கு மகன்கள் இல்லை; மகள்கள் மட்டுமே இருந்தனர். அவர்களுடைய சகோதரர்களான கீசின் மகன்கள் அவர்களைத் திருமணம் செய்துகொண்டார்கள்[a].[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவர்களை மனைவிகளாக ஏற்றுக்கொண்டார்கள்.’
    reason: lexical_alternative
  - marker: b
    text: ‘அவர்களுடைய சகோதரர்கள்’ என்பது ஒரே தாய்க்குப் பிறந்த சகோதரர்களையே அவசியம் குறிக்காது; தொடர்புடைய குடும்பக் கிளையைச் சேர்ந்த நெருங்கிய உறவினர்களைக் குறிக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּמָת
  choice: இறந்தார்
  rationale: מות என்பதன் நேரடியான பொருள் ‘இறத்தல்’. இயல்பான, கண்ணியமான நவீனத் தமிழில் நேரடியாக மொழிபெயர்க்கப்பட்டது.
- source_word: אֶלְעָזָר
  choice: எலெயாசார்
  rationale: எபிரேயப் பெயரின் ஒலியமைப்பைப் பின்பற்றும் வழக்கமான தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: וְלֹא הָיוּ לוֹ בָּנִים
  choice: அவருக்கு மகன்கள் இல்லை
  rationale: அடுத்ததாக ‘மகள்கள்’ என வேறுபடுத்திக் கூறப்படுவதால் בָּנִים இங்கு பொதுவாக ‘பிள்ளைகள்’ என்பதல்ல, குறிப்பாக ‘மகன்கள்’ என்பதாகும்.
- source_word: כִּי אִם בָּנוֹת
  choice: மகள்கள் மட்டுமே இருந்தனர்
  rationale: כִּי אִם இங்கு விதிவிலக்கு மற்றும் எதிர்மறை வேறுபாட்டைக் காட்டி ‘மகள்கள் மட்டுமே’ எனப் பொருள்படுகிறது.
- source_word: וַיִּשָּׂאוּם
  choice: அவர்களை மனைவிகளாக ஏற்றுக்கொண்டார்கள்
  rationale: נשׂא என்ற வினை, பெண்களைச் செயப்படுபொருளாகக் கொள்ளும்போது திருமணத்தில் மனைவிகளாக ஏற்றுக்கொள்வதைக் குறிக்கிறது. இம்மொழிபெயர்ப்பு மூலத்தின் உருவகத்தைப் பாதுகாக்கிறது; ‘திருமணம் செய்துகொண்டார்கள்’ என்பதும் இயல்பான மாற்று.
- source_word: בְּנֵי קִישׁ
  choice: கீசின் மகன்கள்
  rationale: எபிரேய இணைப்புத் தொடரைத் தெளிவாகவும் நாளாகமத்தின் வம்சவரலாற்று நடைக்கு ஏற்றவாறும் மொழிபெயர்க்கிறது.
- source_word: אֲחֵיהֶם
  choice: அவர்களுடைய சகோதரர்கள்
  rationale: சொல்லின் நேரடிப் பொருள் ‘அவர்களுடைய சகோதரர்கள்’. சூழலில் இது அதே குடும்பக் கிளையைச் சேர்ந்த நெருங்கிய ஆண் உறவினர்களைக் குறிக்கக்கூடும் என்பதால் அந்த விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
