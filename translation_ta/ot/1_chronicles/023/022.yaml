translation_notes:
  register: நவீன நிலையான தமிழில், வம்சவரலாற்றுப் பகுதியின் கண்ணியமான நடையைப் பேணும் தெளிவான மொழிபெயர்ப்பு. எபிரேயத்தின் ‘மனைவிகளாக ஏற்றுக்கொண்டார்கள்’ என்ற வடிவம் முதன்மை உரையில் வைக்கப்பட்டு, இயல்பான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது. வழங்கப்பட்ட ஆங்கில ஆலோசனை உரையில் [a] குறியீடு ‘sons’ என்பதற்குப் பின் தவறாக இருந்ததாகத் தெரிவதால், அதன் அடிக்குறிப்பு உள்ளடக்கத்துக்கேற்ற திருமணச் சொல்லுக்குப் பின் வைக்கப்பட்டுள்ளது.
