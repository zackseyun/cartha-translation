  yaml_path: translation/ot/1_chronicles/023/015.yaml
  text: 'The sons of Moses: Gershom and Eliezer.'
translation:
  language: ta
  text: 'மோசேயின் மகன்கள்: கெர்சோம் மற்றும் எலியேசர்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: בֵּן என்பதன் பன்மை இணைப்புநிலை வடிவம்; இங்கு மோசேயின் நேரடி ஆண் பிள்ளைகளைப் பட்டியலிடுவதால், ‘வழித்தோன்றல்கள்’ என்பதைவிட ‘மகன்கள்’ துல்லியமானது.
- source_word: מֹשֶׁה
  choice: மோசே
  rationale: எபிரெய தனிப்பெயர்; தமிழில் நிலைபெற்ற வேதாகமப் பெயர்வடிவம் பயன்படுத்தப்பட்டது.
- source_word: גֵּרְשֹׁם
  choice: கெர்சோம்
  rationale: மோசேயின் மகனுடைய பெயரை எபிரெய வடிவத்துக்கு நெருக்கமாக ஒலிபெயர்க்கிறது; இதனை வேறொரு பெயரான கெர்சோனுடன் கலக்கவில்லை.
- source_word: וֶ/אֱלִיעֶזֶר
  choice: எலியேசர்
  rationale: אֱלִיעֶזֶר என்ற தனிப்பெயரின் தமிழ் ஒலிபெயர்ப்பு. எபிரெய வாவ் இணைப்பைத் தமிழ்ப் பட்டியலின் இயல்பான நிறுத்தற்குறி அமைப்பில் தனியே ‘மற்றும்’ என்று மொழிபெயர்க்காமல் வெளிப்படுத்தியது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், வம்சப்பட்டியலுக்கேற்ற சுருக்கமானவும் கண்ணியமானவும் உள்ள நடை. மூலத்தின் தலைப்புவகைச் சொற்றொடரும் பெயர்ப்பட்டியலும் இயல்பான தமிழ் நிறுத்தற்குறிகளுடன் பாதுகாக்கப்பட்டுள்ளன.
