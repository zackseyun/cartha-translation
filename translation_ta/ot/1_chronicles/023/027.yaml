source:
  edition: WLC
  text: כִּ֣י בְ/דִבְרֵ֤י דָוִיד֙ הָ/אַ֣חֲרֹנִ֔ים הֵ֖מָּה מִסְפַּ֣ר בְּנֵי לֵוִ֑י מִ/בֶּ֛ן עֶשְׂרִ֥ים שָׁנָ֖ה וּ/לְ/מָֽעְלָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/027.yaml
  text: For by the last words of David[a], the sons of Levi were numbered from twenty years old and upward.
translation:
  language: ta
  text: ஏனெனில், தாவீதின் இறுதி வார்த்தைகளின்படி[a], லேவியின் மகன்களில் இருபது வயதுமுதல் அதற்கு மேற்பட்டவர்கள் கணக்கிடப்பட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தாவீதின் இறுதி வார்த்தைகளால்.” கணக்கெடுப்பு தாவீதின் இறுதி அறிவுறுத்தலின் அடிப்படையில் அல்லது அதன் வாயிலாக மேற்கொள்ளப்பட்டது என்பதை எபிரெயச் சொற்றொடர் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான விளக்கத்தை அறிமுகப்படுத்தும் இணைப்பாக உள்ளது.
- source_word: בְּדִבְרֵי דָוִיד הָאַחֲרֹנִים
  choice: தாவீதின் இறுதி வார்த்தைகளின்படி
  rationale: בְּ இங்கு தாவீதின் இறுதி அறிவுறுத்தலைக் கணக்கெடுப்பின் அடிப்படையாகக் காட்டுகிறது; ‘இன்படி’ இயல்பான தமிழில் அந்த உறவைத் தெளிவாகக் கூறுகிறது.
- source_word: הָאַחֲרֹנִים
  choice: இறுதி
  rationale: வெறுமனே பிற்கால வார்த்தைகள் என்பதல்லாமல், தாவீதின் கடைசி அறிவுறுத்தல்களைக் குறிக்கிறது.
- source_word: הֵמָּה מִסְפַּר
  choice: கணக்கிடப்பட்டார்கள்
  rationale: எபிரெயச் சொற்றொடர் சுருக்கமானதும் இடைவிட்ட அமைப்புடையதும் ஆகும்; சூழலில் லேவியர்கள் கணக்கெடுப்பில் சேர்க்கப்பட்டார்கள் என்பதே பொருள்.
- source_word: בְּנֵי לֵוִי
  choice: லேவியின் மகன்களில்
  rationale: வம்சவழி சார்ந்த மூல மொழி வெளிப்பாட்டைப் பாதுகாக்கிறது; வயது வரம்பைக் குறிக்கும் தமிழ்ச் சொற்றொடருடன் இயல்பாக இணைய ‘மகன்களில்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וּלְמָעְלָה
  choice: இருபது வயதும் அதற்கு மேற்பட்ட வயதும் உடையவர்கள்
  rationale: இருபது வயதிலிருந்து தொடங்கி அதற்கு மேற்பட்ட அனைவரும் சேர்க்கப்படுவதைத் தெளிவான நவீன தமிழில் தெரிவிக்கிறது.
