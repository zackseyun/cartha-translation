translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வேதாகம உரைக்கேற்ற கண்ணியமும் கொண்ட நடை. மூலத்தின் காரண இணைப்பையும் வம்சவழிச் சொல்லாட்சியையும் காத்து, எபிரெய முன்னிடைச்சொல்லின் அடிப்படை/வழிமுறை சார்ந்த நுண்ணிய இருபொருள் வாய்ப்பை அடிக்குறிப்பில் பாதுகாக்கிறது.
