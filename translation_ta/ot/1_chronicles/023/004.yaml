base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/004.yaml
  text: Of these, twenty-four thousand were to oversee the work of the house of Yahweh, and six thousand were officers and judges.
translation:
  language: ta
  text: இவர்களில், யாவேயின் இல்லத்தின் பணியை மேற்பார்வையிட இருபத்து நான்காயிரம் பேர் இருந்தனர்; அதிகாரிகளும் நீதிபதிகளுமாக ஆறாயிரம் பேர் இருந்தனர்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֵאֵלֶּה
  choice: இவர்களில்
  rationale: முன்பு குறிப்பிடப்பட்ட லேவியர்களிலிருந்து ஒரு பகுதியைச் சுட்டும் பகுதிப்பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לְנַצֵּחַ
  choice: மேற்பார்வையிட
  rationale: இச்சூழலில் இசை வழிநடத்துதலை அல்ல, பணியை நிர்வகித்து மேற்பார்வை செய்வதைக் குறிக்கும் பியேல் வினையெச்சத்தின் பொருளைப் பாதுகாக்கிறது.
- source_word: עַל מְלֶאכֶת בֵּית יְהוָה
  choice: யாவேயின் இல்லத்துப் பணியை
  rationale: מְלָאכָה என்பதன் பரந்த ‘பணி’ என்ற பொருளையும், בֵּית יְהוָה என்பதன் நேரடியான ‘யாவேயின் இல்லம்’ என்ற உருவகத்தையும் காக்கிறது; ‘ஆலயம்’ என்று விளக்கமாகக் குறுக்கவில்லை.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: இருபத்துநான்காயிரம் பேர்
  rationale: எண்ணிக்கையை ஓடும் உரைக்கு ஏற்றவாறு சொற்களால் தருகிறது; மனிதர்களைக் குறிக்கும் ‘பேர்’ தமிழில் இயல்பை அளிக்கிறது.
- source_word: וְשֹׁטְרִים
  choice: அதிகாரிகளாக
  rationale: நிர்வாகப் பொறுப்புடைய அலுவலர்களைக் குறிக்கும் சொல்லின் பரந்த பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: וְשֹׁפְטִים
  choice: நீதிபதிகளாக
  rationale: நீதித் தீர்ப்பு வழங்கும் பொறுப்பை நேரடியாகவும் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: שֵׁשֶׁת אֲלָפִים
  choice: ஆறாயிரம் பேர்
  rationale: மூல எண்ணிக்கையைத் துல்லியமாகவும் முதல் எண்ணிக்கையுடன் ஒரே நடையிலும் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: எபிரேய மூலத்தில் நேரடியாக வரும் உடன்படிக்கைப் பெயரை பொதுப்பட்டமாக மாற்றாமல், தமிழில் ஒலிபெயர்த்து வழங்குகிறது.
- issue: எபிரேய வசனத்தில் வெளிப்படையான முதன்மை வினை இல்லாமை
  choice: நியமிக்கப்பட்டனர் என்று சூழலிலிருந்து நிறைவு செய்தல்
  alternative: வினையில்லாத பட்டியல் வடிவத்தை அப்படியே வைத்தல்
  rationale: இது முந்தைய வசனங்களில் தொடங்கிய லேவியர்களின் பணிப்பகிர்வைத் தொடர்கிறது. ‘நியமிக்கப்பட்டனர்’ என்பது அந்த நிர்வாகச் சூழலை இயல்பான தமிழில் வெளிப்படுத்துகிறது; பொறுப்பின் தன்மையை மாற்றுவதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் கண்ணியமும் வாசிப்புத் தெளிவும் பேணப்பட்டுள்ளன. ‘இல்லம்’ மூல உருவகத்தைப் பாதுகாக்கிறது; ‘பணி’ கடமைகளின் பரப்பை தேவையின்றி குறுக்கவில்லை.
