  source_fidelity: எண்ணிக்கைகள், ‘இவர்களில்’ என்ற பகுதிப்பொருள், யாவேயின் இல்லத்தோடு தொடர்புடைய பணி, மேற்பார்வைப் பொறுப்பு, அதிகாரிகள், நீதிபதிகள் ஆகியவை வரைவில் சரியாக உள்ளன. ஆனால் மூலத்தில் வெளிப்படையாக இல்லாத நிறைவுவினையான ‘நியமிக்கப்பட்டனர்’ ஒரு கடந்தகால நியமனக் கூற்றைச் சேர்க்கிறது. எபிரேயத்தின் பட்டியல்/பொறுப்புப் பகிர்வு வடிவத்தைத் தமிழில் ‘இருந்தனர்’ மூலம் குறைந்த விளக்கத்துடன் தரலாம்.
  naturalness: ‘யாவேயின் இல்லத்துப் பணி’ இலக்கணமாகச் சாத்தியமானது; இருப்பினும் அது பொதுவான ‘வீட்டுப்பணி’ என்ற பொருளை நினைவூட்டக்கூடும். ‘யாவேயின் இல்லத்தின் பணியை’ என்பது நவீன நிலையான தமிழில் தெளிவானதும் இயல்பானதும் ஆகும். எண்ணை ‘இருபத்து நான்காயிரம்’ என்று பிரித்து எழுதுவது வாசிப்புக்கு உதவுகிறது.
