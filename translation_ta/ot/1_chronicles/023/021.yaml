translation_notes:
  register: நவீன செந்தமிழ் சார்ந்த, எளிதில் புரியும் மரியாதையான நடை. எபிரேய வசனத்தின் இரு இணையான வம்சப்பட்டியல் வாக்கிய அமைப்பும் பாதுகாக்கப்பட்டுள்ளது; தேவையற்ற விளக்கச் சொற்கள் சேர்க்கப்படவில்லை.
