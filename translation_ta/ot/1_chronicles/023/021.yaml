source:
  edition: WLC
  text: בְּנֵ֤י מְרָרִי֙ מַחְלִ֣י וּ/מוּשִׁ֔י בְּנֵ֥י מַחְלִ֖י אֶלְעָזָ֥ר וְ/קִֽישׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/021.yaml
  text: 'The sons of Merari: Mahli and Mushi. The sons of Mahli: Eleazar and Kish.'
translation:
  language: ta
  text: 'மெராரியின் மகன்கள்: மக்லியும் மூஷியும். மக்லியின் மகன்கள்: எலெயாசாரும் கீஷும்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: ஆண்பால் பன்மை இணைப்புவடிவம்; இங்கு நேரடியான தந்தை–மகன் வம்சப்பட்டியலை அறிமுகப்படுத்துவதால், இயல்பான தமிழ் சொல்லான ‘மகன்கள்’ பொருத்தமானது.
- source_word: מְרָרִי
  choice: மெராரி
  rationale: எபிரேய தனிப்பெயரின் ஒலியைத் தமிழில் இயன்றவரை பிரதிபலிக்கும் எழுத்துப்பெயர்ப்பு.
- source_word: מַחְלִי
  choice: மக்லி
  rationale: எபிரேய தனிப்பெயரான மַחְלִי என்பதன் எழுத்துப்பெயர்ப்பு; வசனத்தில் இருமுறை ஒரே வடிவில் வழங்கப்படுகிறது.
- source_word: וּמוּשִׁי
  choice: மூசியும்
  rationale: இணைப்பிடைச்சொல்லையும் தனிப்பெயரையும் இயல்பான தமிழ் பட்டியல் அமைப்பில் ‘-உம்’ விகுதியால் வழங்குகிறது.
- source_word: בְּנֵי מַחְלִי
  choice: மக்லியின் மகன்கள்
  rationale: எபிரேய வம்சப்பட்டியல் தலைப்பின் அமைப்பைத் தெளிவாகவும் இயல்பாகவும் மீண்டும் வழங்குகிறது.
- source_word: אֶלְעָזָר
  choice: எலெயாசார்
  rationale: எபிரேய தனிப்பெயரின் உச்சரிப்பை அடிப்படையாகக் கொண்ட தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: וְקִישׁ
  choice: கீசும்
  rationale: இணைப்பிடைச்சொல்லுடன் வரும் தனிப்பெயரைத் தமிழ் பட்டியல் நடையில் ‘-உம்’ விகுதியோடு வழங்குகிறது.
