  source_fidelity: வசனத்தின் இரு வம்சப்பட்டியல் தலைப்புகளும் உறுப்பினர்களும் சரியாகப் பாதுகாக்கப்பட்டுள்ளன. ஆனால் மூஷி (מוּשִׁי) மற்றும் கீஷ் (קִישׁ) ஆகிய பெயர்களில் உள்ள שׁ ஒலி வரைவில் விடுபட்டுள்ளது; ‘மூசி’, ‘கீசு’ என்பவை மூல எபிரேயப் பெயர்களின் மெய்யெழுத்தைத் துல்லியமாகக் காட்டவில்லை.
  naturalness: ‘மெராரியின் மகன்கள் ... மக்லியின் மகன்கள் ...’ என்பது நவீனத் தரநிலைத் தமிழில் தெளிவான, சுருக்கமான வம்சப்பட்டியல் நடை. பட்டியலில் இணைப்பைக் காட்டும் ‘-உம்’ வடிவமும் இயல்பானது.
  terminology: ‘மகன்கள்’ என்பது בְּנֵי என்பதற்கான பொருத்தமான நேரடியான மொழிபெயர்ப்பு. தனிப்பெயர்களில் எபிரேய שׁ ஒலிக்கு ‘ஷ்’ பயன்படுத்தப்பட வேண்டும். எலெயாசார் என்பது Eleazar-க்கு நிலைபெற்ற, புரிந்துகொள்ளத்தக்க தமிழ் வடிவமாகத் தக்கவைக்கப்படுகிறது.
