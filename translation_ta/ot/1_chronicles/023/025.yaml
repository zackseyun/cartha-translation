  source_fidelity: மூல எபிரெயத்தின் காரண இணைப்பு, தாவீதின் உரை, யாவே என்ற தனிப்பெயர், இஸ்ரவேலின் கடவுள் என்ற இணைப்பு, மக்களுக்கு அளிக்கப்பட்ட ஓய்வு, எருசலேமில் நிலைத்த குடியிருப்பு, என்றென்றும் என்ற காலவலிமை ஆகியவை துல்லியமாகக் காக்கப்பட்டுள்ளன. “குடிகொண்டிருக்கிறார்” என்பது וַיִּשְׁכֹּן என்பதன் நிலைபெற்ற, தொடரும் வாசப் பொருளை இயல்பாக வெளிப்படுத்துகிறது; எதிர்கால வாசிப்பை அடிக்குறிப்பு உரியவாறு திறந்துவைக்கிறது.
