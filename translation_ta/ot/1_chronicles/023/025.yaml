id: 1CH.23.25
reference: 1 Chronicles 23:25
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: כִּ֚י אָמַ֣ר דָּוִ֔יד הֵנִ֛יחַ יְהוָ֥ה אֱלֹהֵֽי יִשְׂרָאֵ֖ל לְ/עַמּ֑/וֹ וַ/יִּשְׁכֹּ֥ן בִּ/ירוּשָׁלִַ֖ם עַד לְ/עוֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/025.yaml
  text: For David said[a], “Yahweh, the God of Israel, has given rest to his people, and he has dwelt in Jerusalem forever.”
translation:
  language: ta
  text: ஏனெனில் தாவீது, “இஸ்ரவேலின் கடவுளாகிய யாவே தமது மக்களுக்கு இளைப்பாறுதல் அளித்திருக்கிறார்; அவர் எருசலேமில் என்றென்றும் குடிகொண்டிருக்கிறார்[a]” என்று சொன்னார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவர் எருசலேமில் என்றென்றும் குடியிருப்பார்” என்றும் பொருள் கொள்ளலாம். எபிரெய வினைச்சொல், அங்கு யாவே நிலையாகவும் தொடர்ந்து குடியிருப்பதையும் குறிக்கக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய அறிவுறுத்தலுக்கான காரணத்தை அறிமுகப்படுத்துவதால், எபிரெயச் சொல்லின் விளக்கக் காரணப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אָמַר דָּוִיד
  choice: தாவீது ... சொன்னார்
  rationale: எளிய இறந்தகாலக் கூற்றாக இயல்பான தமிழ் வாக்கிய அமைப்பில் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: הֵנִיחַ
  choice: இளைப்பாறுதல் அளித்திருக்கிறார்
  rationale: נוּחַ என்பதன் ஹிஃபில் வடிவிலுள்ள ‘இளைப்பாறச் செய்தல்/இளைப்பாறுதல் அளித்தல்’ என்ற காரணவினைப் பொருளையும், அதன் தொடரும் விளைவையும் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பட்டத்தால் மாற்றாமல், எபிரெய மூலத்திலுள்ள இறைவனின் தனிப்பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கடவுளாகிய
  rationale: யாவே யார் என்பதை விளக்கும் எபிரெய இணைப்பை இயல்பான தமிழ் அடைமொழித் தொடராக வழங்குகிறது.
- source_word: לְעַמּוֹ
  choice: தமது மக்களுக்கு
  rationale: לְ குறிக்கும் பெறுநரைத் தெளிவாகக் காட்டுகிறது; உயர்திணை ஒருமை எழுவாய்க்கு இயல்பான ‘தமது’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: וַיִּשְׁכֹּן
  choice: குடிகொண்டிருக்கிறார்
  rationale: שׁכן என்பதிலுள்ள குடியிருத்தலையும், நிறுவப்பட்டு நீடிக்கும் வாசத்தையும் தமிழில் வெளிப்படுத்துகிறது; காலப் பொருளின் உண்மையான தெளிவின்மை அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: בִּירוּשָׁלַם
  choice: எருசலேமில்
  rationale: இடத்தைக் குறிக்கும் நேரடியான, வழக்கமான தமிழ் வடிவம்.
- source_word: עַד לְעוֹלָם
  choice: என்றென்றும்
  rationale: நீடித்த நிரந்தரத்தைக் குறிக்கும் எபிரெயச் சொற்றொடரின் இயல்பான நவீனத் தமிழ் இணை.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக இருப்பதால், அதை ஒரு பட்டத்தால் மாற்றாமல் ஒலிபெயர்த்துள்ளது.
- issue: எருசலேமில் யாவே குடியிருப்பதன் காலப் பொருள்
  choice: குடிகொண்டிருக்கிறார்
  alternative: குடியிருப்பார்
  rationale: வினைச்சொல் நிறுவப்பட்டு நீடிக்கும் இறைவாசத்தைக் குறிக்கலாம். தற்போதைய நிலையை முதன்மை உரை காட்டுகிறது; எதிர்கால வாசிப்பை அடிக்குறிப்பு திறந்துவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘இளைப்பாறுதல் அளித்திருக்கிறார்’ காரணவினை மற்றும் தொடரும் விளைவைப் பாதுகாக்கிறது; ‘குடிகொண்டிருக்கிறார்’ நிறுவப்பட்ட, நீடித்த வாசத்தை இயல்பாக வெளிப்படுத்துகிறது.
