source:
  edition: WLC
  text: וְ/גַ֖ם לַ/לְוִיִּ֑ם אֵין לָ/שֵׂ֧את אֶת הַ/מִּשְׁכָּ֛ן וְ/אֶת כָּל כֵּלָ֖י/ו לַ/עֲבֹדָתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/026.yaml
  text: And also[a], the Levites no longer need to carry the tabernacle and all its utensils for its service.
translation:
  language: ta
  text: மேலும்[a], லேவியர்கள் திருக்கூடாரத்தையும் அதன் சேவைக்கான எல்லாப் பொருட்களையும் இனி சுமக்க வேண்டியதில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மேலும், லேவியர்கள் திருக்கூடாரத்தையும் அதன் சேவைக்கான எல்லாப் பொருட்களையும் சுமக்க வேண்டிய தேவை இல்லை.”
    reason: எபிரெய மொழியின் ‘இல்லை’ என்னும் இருப்பின்மை அமைப்பை இன்னும் சொற்படியாக வழங்கும் மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: וְגַם
  choice: மேலும்
  rationale: இணைப்பையும் கூடுதல் கருத்தையும் இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: לַלְוִיִּם
  choice: லேவியர்கள்
  rationale: எபிரெயச் சொற்றொடர் சொற்படியாக ‘லேவியர்களுக்கு’ என்றாலும், தமிழில் கருத்தை இயல்பாகத் தெரிவிக்க எழுவாய் வடிவம் பொருத்தமானது.
- source_word: אֵין לָשֵׂאת
  choice: இனி சுமக்க வேண்டியதில்லை
  rationale: இது தடை அல்ல; முந்தைய சூழலில் நிலையான ஆலயம் காரணமாகச் சுமக்கும் கடமை இனி இல்லை என்பதைக் காட்டுகிறது.
- source_word: הַמִּשְׁכָּן
  choice: திருவாசஸ்தலம்
  rationale: மִשְׁכָּן என்பதன் ‘வாசஸ்தலம்’ என்ற அடிப்படைப் பொருளையும் இஸ்ரவேலின் வழிபாட்டு அமைப்பையும் சுருக்கமாகக் குறிக்கிறது.
- source_word: וְאֶת כָּל כֵּלָיו
  choice: அதன் பணிக்குரிய எல்லாப் பொருட்களையும்
  rationale: כֵּלִים என்பது பாத்திரங்கள் மட்டுமல்லாமல் கருவிகள், உபகரணங்கள் போன்ற பரந்த பொருளுடையது; ‘எல்லாப் பொருட்கள்’ அந்த விரிவைப் பாதுகாக்கிறது.
- source_word: לַעֲבֹדָתוֹ
  choice: அதன் பணிக்குரிய
  rationale: பின்னொட்டு திருவாசஸ்தலத்தைக் குறிக்கிறது; அந்தப் பொருட்கள் அதன் வழிபாட்டுப் பணியில் பயன்படுபவை என்ற உறவை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: אֵין לָשֵׂאת என்பது தடைதானா அல்லது இனி தேவையில்லாமையா
  choice: இனி சுமக்க வேண்டியதில்லை
  alternative: சுமக்கக்கூடாது
  rationale: சூழல் லேவியர்களுக்கான முந்தைய சுமக்கும் பணி இனி தேவையில்லை என்பதைக் குறிக்கிறது; ஒழுக்க அல்லது சடங்குத் தடையை விதிப்பதாக இல்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமும் எளிய வாசிப்புத்தன்மையும் பேணப்பட்டுள்ளன. ‘திருவாசஸ்தலம்’ வழிபாட்டுச் சூழலைத் தெளிவுபடுத்துகிறது; ‘பொருட்கள்’ என்பது כֵּלִים என்பதன் பரந்த பொருளை அளிக்கிறது.
