revisions:
- from: ஒவ்வொரு காலையிலும்[a] யெகோவாவுக்கு நன்றி செலுத்தவும் அவரைப் புகழவும் நிற்பதும், அதேபோல் மாலையிலும் நிற்பதும் அவர்களுடைய கடமையாக இருந்தது.
  to: காலைய்தோறும்[a] யாவேக்கு நன்றி செலுத்தவும் அவரைப் புகழவும் நிற்கவும், அவ்வாறே மாலையிலும்.
  rationale: The revision preserves the Hebrew infinitival construction and its dependence on the preceding context, expresses the distributive repetition as ‘காலைய்தோறும்,’ and allows ‘அவ்வாறே மாலையிலும்’ to carry forward both thanksgiving and praise (as well as standing) without adding a separate assertion. The divine name is aligned with the provided English POB audit trail.
