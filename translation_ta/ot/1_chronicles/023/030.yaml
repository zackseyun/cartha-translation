source:
  edition: WLC
  text: וְ/לַ/עֲמֹד֙ בַּ/בֹּ֣קֶר בַּ/בֹּ֔קֶר לְ/הֹד֥וֹת וּ/לְ/הַלֵּ֖ל לַ/יהוָ֑ה וְ/כֵ֖ן לָ/עָֽרֶב׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/030.yaml
  text: and to stand every morning to give thanks and to praise Yahweh[a], and likewise at evening,
translation:
  language: ta
  text: காலைய்தோறும்[a] யாவேக்கு நன்றி செலுத்தவும் அவரைப் புகழவும் நிற்கவும், அவ்வாறே மாலையிலும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “காலைய்தோறும் காலைய்தோறும்”; இது தவறாமல் செய்ய வேண்டிய அன்றாடக் கடமையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לַ/עֲמֹד
  choice: நிற்பதும்
  rationale: עמד என்பதன் உடல்சார்ந்த ‘நிற்றல்’ என்ற பொருளையும், முந்தைய சூழலில் கூறப்படும் நியமிக்கப்பட்ட வழிபாட்டுக் கடமையையும் காக்கிறது. இயல்பான தமிழுக்காக இறுதியில் ‘அவர்களுடைய கடமையாக இருந்தது’ சேர்க்கப்பட்டுள்ளது.
- source_word: בַּ/בֹּקֶר בַּ/בֹּקֶר
  choice: ஒவ்வொரு காலையிலும்
  rationale: எபிரெயச் சொல்லின் இரட்டிப்பு தினந்தோறும் தவறாமல் நிகழ்வதை விநியோகப் பொருளில் குறிக்கிறது; ‘ஒவ்வொரு காலையிலும்’ நவீன தமிழில் இயல்பாக அதைக் கூறுகிறது.
- source_word: לְ/הֹדֹות
  choice: நன்றி செலுத்தவும்
  rationale: வழிபாட்டுச் சூழலில் Hiphil வடிவிலுள்ள ידה நன்றி செலுத்துதலைக் குறிக்கிறது; உடன் வரும் ‘புகழவும்’ என்பதோடு இயல்பாக இணைகிறது.
- source_word: וּ/לְ/הַלֵּל
  choice: அவரைப் புகழவும்
  rationale: Piel வடிவிலுள்ள הלל நேரடியாகப் புகழ்வதைக் குறிக்கிறது. பாடுதல் என்ற வெளிப்படையாக இல்லாத கருத்தைச் சேர்க்கவில்லை.
- source_word: לַ/יהוָה
  choice: யெகோவாவுக்கு
  rationale: மூலத்தில் உள்ள יהוה என்ற தனிப்பட்ட இறைப் பெயரைப் பொதுப்பட்டமான ‘கர்த்தர்’ என்று மாற்றாமல் தமிழில் பரவலாக அறியப்படும் பெயர் வடிவில் தருகிறது.
- source_word: וְ/כֵן
  choice: அதேபோல்
  rationale: காலையில் செய்யப்படும் அதே வழிபாட்டுச் செயல் மாலையிலும் நடைபெறுவதைத் தெளிவாக இணைக்கிறது.
- source_word: לָ/עָרֶב
  choice: மாலையிலும்
  rationale: காலையுடன் இணையான மாலை நேரக் கடமையைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூல எபிரெய உரையில் வரும் நான்கெழுத்து இறைப் பெயரை மறைக்காமல் பெயராகவே வழங்குகிறது. ‘யெகோவா’ என்பது நவீன தமிழ்க் கிறிஸ்தவப் பயன்பாட்டில் சாதாரண வாசகர்களுக்கு நன்கு அறிமுகமான வடிவம்; ‘யாவே’ மூல உச்சரிப்புக்கான கல்வியியல் மறுவடிவமாக இருந்தாலும் தமிழில் குறைவாகப் பரவியுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமானதும் சாதாரண வாசகர்களுக்குப் புரியக்கூடியதுமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வாக்கியம் முந்தைய வசனத்தைச் சார்ந்த தொடராக இருப்பதால், தமிழில் தனி வசனமாகத் தெளிவுற ‘அவர்களுடைய கடமையாக இருந்தது’ சேர்க்கப்பட்டது; மாலையிலும் அதேபோல் ‘நிற்பது’ என்பதை வெளிப்படையாக மீட்டுரைத்துள்ளது.
