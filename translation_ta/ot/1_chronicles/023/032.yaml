source:
  edition: WLC
  text: וְ/שָׁמְר֞וּ אֶת מִשְׁמֶ֣רֶת אֹֽהֶל מוֹעֵ֗ד וְ/אֵת֙ מִשְׁמֶ֣רֶת הַ/קֹּ֔דֶשׁ וּ/מִשְׁמֶ֕רֶת בְּנֵ֥י אַהֲרֹ֖ן אֲחֵי/הֶ֑ם לַ/עֲבֹדַ֖ת בֵּ֥ית יְהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/032.yaml
  text: And they were to keep charge of the tent of meeting[a], the charge of the holy place, and the charge of the sons of Aaron their brothers, for the service of the house of Yahweh.
translation:
  language: ta
  text: யாவேயின் இல்லத்தின் சேவைக்காக, அவர்கள் சந்திப்புக் கூடாரத்தின் காவல் பொறுப்பையும், பரிசுத்த இடத்தின்[a] காவல் பொறுப்பையும், ஆரோனின் மகன்களாகிய தங்கள் சகோதரர்களின் காவல் பொறுப்பையும் காத்துக்கொள்ள வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘புனித வளாகம்.’ எபிரெயச் சொல் பரிசுத்த இடத்தையோ, பரந்த புனித வளாகத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמְרוּ
  choice: ஏற்று ... செய்ய வேண்டும்
  rationale: שׁמר என்பது காத்தல், கடைப்பிடித்தல், பொறுப்பேற்றல் ஆகிய பொருள்களைக் கொண்டது. இங்கு லேவியருக்கு நியமிக்கப்பட்ட கடமைகளைச் சுருக்கிக் கூறுவதால், ஒரு கடந்தகால நிகழ்வாக அல்லாமல் கடமையைக் குறிக்கும் வகையில் மொழிபெயர்க்கப்பட்டது.
- source_word: מִשְׁמֶרֶת
  choice: காவற்பொறுப்பு
  rationale: இச்சொல் ஒப்படைக்கப்பட்ட காவல், கடமை அல்லது பொறுப்பைக் குறிக்கிறது. எபிரெய மூலத்தில் மூன்று முறை வரும் அமைப்பைப் பாதுகாக்கத் தமிழிலும் ஒரே சொல் மூன்று முறை பயன்படுத்தப்பட்டது.
- source_word: אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரம்
  rationale: எபிரெயச் சொற்றொடரின் கூறுகளை நேரடியாகவும் நவீன வாசகருக்குப் புரியும் வகையிலும் வெளிப்படுத்துகிறது; மரபுவழிச் சொல்லான ‘ஆசரிப்புக் கூடாரம்’ என்பதைக் காட்டிலும் ‘சந்திப்பு’ என்பது מוֹעֵד என்பதன் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: הַקֹּדֶשׁ
  choice: பரிசுத்த இடம்
  rationale: வழிபாட்டுச் சூழலில் இச்சொல் பரிசுத்தமான இடத்தையோ, பரந்த புனித வளாகத்தையோ குறிக்கலாம். முதன்மை உரையில் இயல்பான ‘பரிசுத்த இடம்’ வைக்கப்பட்டு, பரந்த பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: בְּנֵי אַהֲרֹן אֲחֵיהֶם
  choice: தங்கள் சகோதரர்களான ஆரோனின் மகன்கள்
  rationale: ஆரோனிய ஆசாரியர்களுக்கும் லேவியர்களுக்கும் இடையிலான உறவை மூலத்தின் குடும்பச் சொல்லாட்சியுடன் பாதுகாக்கிறது. ‘சந்ததியினர்’ என்று விரிவாகப் பொருளுரைக்காமல் ‘மகன்கள்’ என வைக்கப்பட்டுள்ளது.
- source_word: לַעֲבֹדַת
  choice: பணியைச் செய்ய
  rationale: ஆலயச் சூழலில் עֲבֹדָה என்பது வழிபாடு சார்ந்த சேவை அல்லது பணியைக் குறிக்கிறது. தமிழில் இயல்பான வாக்கிய ஓட்டத்திற்காக வினை வடிவில் தரப்பட்டுள்ளது.
- source_word: בֵּית יְהוָה
  choice: யாவேயின் ஆலயம்
  rationale: בֵּית என்பதன் நேரடிப் பொருள் ‘வீடு/இல்லம்’ என்றாலும், இங்கு வழிபாட்டிடத்தைக் குறிப்பது தெளிவு. நவீன தமிழில் ‘ஆலயம்’ இயல்பாக உள்ளது; יהוה என்பது பொதுப்பட்டமாக அல்லாமல் ‘யாவே’ என்ற இறைப் பெயராகத் தரப்பட்டுள்ளது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் உடன்படிக்கைக்குரிய தனிப்பெயரான יהוה நேரடியாக உள்ளது. அதைப் பொதுப்பட்டமாக மாற்றாமல், தமிழில் உச்சரிக்க ஏற்ற ‘யாவே’ என்று பெயராகவே தருவது மூல வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: ஆரோனின் மகன்களுக்கான מִשְׁמֶרֶת என்பதன் உறவு
  choice: ஆரோனின் மகன்களுக்கான காவற்பொறுப்பு
  alternative: ஆரோனின் மகன்கள் ஒப்படைத்த பொறுப்பு / அவர்களுக்கு உதவும் கடமை
  rationale: எபிரெயத் தொடர் அவர்களுக்காகச் செய்யும் பொறுப்பா, அவர்கள் ஒப்படைத்த பொறுப்பா என்பதை வெளிப்படையாகத் தீர்மானிக்கவில்லை. ஆகவே அந்த உறவை விளக்கிச் சேர்க்காமல் தமிழ் உரையிலும் திறந்த நிலையில் வைக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன தரத் தமிழில், வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. எபிரெய மூலத்தின் மூன்று முறை வரும் ‘காவற்பொறுப்பு’ அமைப்பு திட்டமிட்டு பாதுகாக்கப்பட்டுள்ளது. அடிக்குறி அது விளக்கும் ‘பரிசுத்த இடம்’ என்பதற்குப் பின் வைக்கப்பட்டுள்ளது.
