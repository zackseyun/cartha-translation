base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/024.yaml
  text: These were the sons of Levi by their fathers’ houses[a], the heads of the fathers’ houses, according to those counted of them, by the number of names, head by head, doing the work for the service of the house of Yahweh, from twenty years old and upward.
translation:
  language: ta
  text: இவர்கள் லேவியின் மகன்கள்; தங்கள் தந்தைவழிக் குடும்பங்களின்படியான குடும்பத் தலைவர்கள். இவர்களுடைய கணக்கெடுப்பின்படி, பெயர்களின் எண்ணிக்கையின்படி ஒவ்வொருவராகக் கணக்கிடப்பட்ட இவர்கள், இருபது வயதுமுதல் அதற்கு மேற்பட்டவர்களாக, யாவேவின் ஆலயச் சேவைக்கான வேலையைச் செய்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லாட்சிப்படி, “அவர்களுடைய தலைகளின்படி”; ஒவ்வொரு தனிநபரும் தனித்தனியாக எண்ணப்பட்டதைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבֵית אֲבֹתֵיהֶם
  choice: தங்கள் தந்தைவழிக் குடும்பங்களின்படி
  rationale: இச்சொற்றொடர் லேவியர்களை மூதாதையர் வழிவந்த குடும்பப் பிரிவுகளின்படி வகைப்படுத்துவதைக் குறிக்கிறது. நவீன தமிழில் இயல்பாகவும் வரலாற்றுச் சமூக அமைப்பைத் தெளிவாகவும் காட்டுகிறது.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: தந்தைவழிக் குடும்பங்களின் தலைவர்கள்
  rationale: எபிரெயச் சொற்றொடரின் வடிவை அப்படியே ஒலிபெயர்க்காமல், குடும்பப் பிரிவுகளைப் பிரதிநிதித்துவப்படுத்திய தலைவர்களைக் குறிக்கும் அதன் சூழல்சார் பொருளைத் தருகிறது.
- source_word: לִפְקוּדֵיהֶם בְּמִסְפַּר שֵׁמוֹת
  choice: பெயர்ப்பட்டியலின்படி ... எண்ணப்பட்டவர்கள்
  rationale: பதிவுசெய்யப்பட்ட பெயர்களின் அடிப்படையில் நடத்தப்பட்ட கணக்கெடுப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது; மனிதர்களின் கணக்கெடுப்பு என்ற கருத்தையும் தக்கவைக்கிறது.
- source_word: לְגֻלְגְּלֹתָם
  choice: ஒவ்வொருவராக
  rationale: சொல்லாட்சிப்படி 'அவர்களுடைய மண்டையோடுகளின்படி/தலைகளின்படி'; இங்கு ஒவ்வொரு தனிநபரும் தனித்தனியாக எண்ணப்பட்டார் என்பதைக் குறிக்கும் மரபுத்தொடர். தமிழில் பொருளைத் தெளிவாகத் தருகிறது; மூல உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: עֹשֵׂה הַמְּלָאכָה
  choice: வேலைகளைச் செய்தார்கள்
  rationale: ஒருமை வடிவிலுள்ள பங்கேற்புப் பெயர் இங்கு எண்ணப்பட்ட லேவியர்களைத் தொகுப்பாகக் குறிக்கிறது. தமிழ் வாக்கியத்தில் பன்மை இயல்பானது.
- source_word: לַעֲבֹדַת בֵּית יְהוָה
  choice: யாவேவின் ஆலயப் பணிக்குரிய
  rationale: עֲבֹדָה என்பது வழிபாடு சார்ந்ததும் நடைமுறை சார்ந்ததுமான சேவையை உள்ளடக்குகிறது. בֵּית יְהוָה என்பதற்கு 'யாவேவின் ஆலயம்' என்பது சூழலில் இயல்பான தமிழ்; குறிப்பிட்ட பிற்காலத் திருச்சபைச் சொல்லாட்சியைத் தவிர்க்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמָעְלָה
  choice: இருபது வயதும் அதற்கு மேற்பட்ட வயதும் உடைய
  rationale: பணிக்கான குறைந்தபட்ச வயது இருபது என்பதைத் துல்லியமாகவும் இயல்பான தமிழிலும் தெரிவிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட இறைப்பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூல வேறுபாட்டைப் பாதுகாக்கிறது; 'யாவே' என்பது நவீனத் தமிழில் வாசிக்கத்தக்க வடிவம்.
- issue: עֲבֹדָה என்பதன் வழிபாடு மற்றும் உழைப்பு சார்ந்த பரப்பு
  choice: ஆலயப் பணி
  alternative: ஆராதனை ஊழியம்; ஆலயச் சேவை
  rationale: இச்சொல் சடங்குப் பணிகளை மட்டும் அல்லாமல் ஆலயத்தின் நடைமுறை வேலைகளையும் உள்ளடக்கலாம். 'ஆலயப் பணி' அந்தப் பரப்பை தேவையின்றிக் குறுக்காமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் எளிய வாசிப்புத்தன்மையும் இணையும் நடை பயன்படுத்தப்பட்டது. நீண்ட எபிரெயப் பட்டியல் அமைப்பு இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டது; உறவுமுறையும் கணக்கெடுப்பு வரிசையும் பாதுகாக்கப்பட்டுள்ளன. 'தந்தைவழிக் குடும்பம்' என்பது பழங்கால இஸ்ரவேலின் மூதாதையர் சார்ந்த குடும்பப் பிரிவைத் தெளிவுபடுத்துகிறது.
