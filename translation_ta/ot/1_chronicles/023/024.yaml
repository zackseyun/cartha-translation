revisions:
- from: இவர்கள் தங்கள் தந்தைவழிக் குடும்பங்களின்படி வகைப்படுத்தப்பட்ட லேவியின் மகன்கள்; தந்தைவழிக் குடும்பங்களின் தலைவர்களாகிய இவர்கள், பெயர்ப்பட்டியலின்படி ஒவ்வொருவராக[a] எண்ணப்பட்டவர்கள். இருபது வயதும் அதற்கு மேற்பட்ட வயதும் உடைய இவர்கள், யாவேவின் ஆலயப் பணிக்குரிய வேலைகளைச் செய்தார்கள்.
  to: இவர்கள் லேவியின் மகன்கள்; தங்கள் தந்தைவழிக் குடும்பங்களின்படியான குடும்பத் தலைவர்கள். இவர்களுடைய கணக்கெடுப்பின்படி, பெயர்களின் எண்ணிக்கையின்படி ஒவ்வொருவராகக் கணக்கிடப்பட்ட இவர்கள், இருபது வயதுமுதல் அதற்கு மேற்பட்டவர்களாக, யாவேவின் ஆலயச் சேவைக்கான வேலையைச் செய்தார்கள்.[a]
  rationale: மூலத்தின் தொடர்ச்சியான பெயரெண்ணிக்கை மற்றும் தனிநபர் கணக்கெடுப்பைத் தமிழில் தெளிவாக வெளிப்படுத்தி, தேவையற்ற “வகைப்படுத்தப்பட்ட” என்ற விளக்கச் சேர்க்கையை நீக்கியுள்ளோம். அடிக்குறிப்பு குறியீடு לְגֻלְגְּלֹתָם என்ற சொற்றொடரின் பொருளுடன் நேரடியாக இணைக்கப்பட்டுள்ளது. யாவே, ஆலயச் சேவை, மற்றும் இருபது வயதுமுதல் என்ற சொல் தேர்வுகள் மூலத்தின் பொருளையும் நவீன தமிழ் நடையையும் காக்கின்றன.
