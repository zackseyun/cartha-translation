  text: וַ/יֶּאֱסֹף֙ אֶת כָּל שָׂרֵ֣י יִשְׂרָאֵ֔ל וְ/הַ/כֹּהֲנִ֖ים וְ/הַ/לְוִיִּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/002.yaml
  text: And he gathered all the leaders of Israel[a], and the priests and the Levites.
translation:
  language: ta
  text: அவன் இஸ்ரவேலின் தலைவர்கள்[a] அனைவரையும், ஆசாரியர்களையும், லேவியர்களையும் ஒன்றுகூட்டினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இஸ்ரவேலின் பிரபுக்கள்,’ ‘இஸ்ரவேலின் அதிகாரிகள்,’ அல்லது ‘இஸ்ரவேலின் முதன்மையானவர்கள்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱסֹף
  choice: ஒன்றுகூட்டினான்
  rationale: אָסַף என்பதன் ‘கூட்டிச் சேர்த்தல்’ என்ற பொருளையும், தொடர் கதைநடையை முன்னெடுக்கும் வாவ் வடிவத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: כָּל
  choice: அனைவரையும்
  rationale: பின்வரும் மனிதக் குழுவின் முழுமையைக் குறிக்கும் அளவுச்சொல்லை இயல்பான தமிழில் காட்டுகிறது.
- source_word: שָׂרֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் தலைவர்கள்
  rationale: שָׂרִים என்பது தலைவர்கள், ஆட்சியாளர்கள், அதிகாரிகள் அல்லது பிரபுக்கள் எனப் பொருள்படலாம். இந்நிர்வாகச் சூழலில் ‘தலைவர்கள்’ என்பது குறிப்பிட்ட அரசகுமாரர் என்ற தேவையற்ற பொருளைச் சேர்க்காமல் பரந்த பொருளைத் தக்கவைக்கிறது.
- source_word: וְהַכֹּהֲנִים
  choice: ஆசாரியர்களையும்
  rationale: இணைப்பிடைச்சொல்லுடன் கூடிய குறிப்பிட்ட பன்மைப் பெயர்ச்சொல்லின் நேரடியான, வழக்கமான தமிழ் மொழிபெயர்ப்பு.
- source_word: וְהַלְוִיִּם
  choice: லேவியர்களையும்
  rationale: லேவி குலத்தாரைக் குறிக்கும் வழக்கமான தமிழ் வேதாகமப் பெயர்; பொருளுரைப்பதைவிட மூலத்தின் இனக்குழு அடையாளத்தைத் தக்கவைக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட நடை. எபிரெய உரையின் பட்டியல் அமைப்பு ‘-ஐயும்’ விகுதிகளால் இயல்பாகப் பாதுகாக்கப்பட்டுள்ளது; שָׂרִים என்ற சொல்லின் பொருள் வரம்பு அடிக்குறிப்பில் காட்டப்பட்டுள்ளது.
