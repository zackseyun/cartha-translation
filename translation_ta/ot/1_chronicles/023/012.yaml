  source_fidelity: 'மூல எபிரேயத்தின் வம்சப்பட்டியல் அமைப்பு துல்லியமாகப் பேணப்பட்டுள்ளது: ‘கோகாத்தின் மகன்கள்’ என்பதும், நான்கு தனிப்பெயர்களின் பட்டியலும், இறுதியிலுள்ள אַרְבָּעָה (‘நான்கு’) என்ற எண்ணிக்கைச் சுருக்கமும் அனைத்தும் இடம்பெற்றுள்ளன. ‘நான்கு பேர்’ என்பது மனிதர்களின் எண்ணிக்கைக்கான இயல்பான தமிழ் வடிவம்; பொருளைக் கூட்டவோ குறைக்கவோ செய்யவில்லை.'
  naturalness: '‘கோகாத்தின் மகன்கள்: … —நான்கு பேர்’ என்பது நவீனத் தரத் தமிழில் தெளிவான, சுருக்கமான வம்சப்பட்டியல் நடை. காற்புள்ளிப் பட்டியலும் நீண்ட கோட்டுக்குப் பிந்தைய மொத்த எண்ணிக்கையும் வாசிப்பிற்கு இயல்பாக உள்ளன.'
  terminology: ‘மகன்கள்’ என்பது בְּנֵי என்பதற்கான இச்சூழலின் நேரடியான மொழிபெயர்ப்பு. தனிப்பெயர்கள் ஒரே ஒலிப்பெயர்ப்பு அணுகுமுறையில் வழங்கப்பட்டுள்ளன; எப்ரோன் இங்கு இடப்பெயராக அல்லாமல் தனிப்பெயராகப் புரியத்தக்க வகையில் உள்ளது. இறையியல் சார்ந்த சிறப்புச் சொற்கள் எதுவும் இவ்வசனத்தில் இல்லை.
