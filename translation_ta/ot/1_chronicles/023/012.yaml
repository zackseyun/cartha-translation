  register: நவீனத் தரத் தமிழில் சுருக்கமான வம்சப்பட்டியல் நடையைப் பேணுகிறது. மூலத்தின் பெயர்ப்பட்டியல் அமைப்பும் இறுதி எண்ணிக்கைச் சுருக்கமும் நீண்ட கோட்டின் மூலம் தெளிவாக வைக்கப்பட்டுள்ளன.
