source:
  edition: WLC
  text: בְּנֵ֣י קְהָ֗ת עַמְרָ֥ם יִצְהָ֛ר חֶבְר֥וֹן וְ/עֻזִּיאֵ֖ל אַרְבָּעָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/012.yaml
  text: 'The sons of Kohath: Amram, Izhar, Hebron, and Uzziel—four.'
translation:
  language: ta
  text: 'கோகாத்தின் மகன்கள்: அம்ராம், இத்சார், எப்ரோன், உசியேல்—நான்கு பேர்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: בן என்பதன் பன்மை இணைப்புநிலை வடிவம்; உடனே நான்கு பெயர்கள் பட்டியலிடப்படுவதால், பரந்த பொருளுடைய ‘வழித்தோன்றல்கள்’ என்பதைவிட நேரடியான ‘மகன்கள்’ பொருத்தமானது.
- source_word: קְהָת
  choice: கோகாத்
  rationale: எபிரேய தனிப்பெயரின் ஒலியைத் தமிழில் இயல்பாகப் பெயர்த்தெழுதுகிறது.
- source_word: עַמְרָם
  choice: அம்ராம்
  rationale: எபிரேய தனிப்பெயரின் ஒலிப்பெயர்ப்பு.
- source_word: יִצְהָר
  choice: இத்சார்
  rationale: எபிரேய יִצְהָר என்பதிலுள்ள ṣ ஒலியை ‘த்ச’ மூலம் நெருக்கமாகக் காட்டும் ஒலிப்பெயர்ப்பு.
- source_word: חֶבְרוֹן
  choice: எப்ரோன்
  rationale: இங்கு இடப்பெயராக அல்ல, வம்சப்பட்டியலிலுள்ள ஒருவரின் பெயராக வருகிறது; எபிரேய பெயரொலிக்கு நெருக்கமாகப் பெயர்த்தெழுதப்பட்டுள்ளது.
- source_word: וְעֻזִּיאֵל
  choice: உசியேல்
  rationale: இணைப்புச் சொல் தமிழ்ப் பட்டியல் அமைப்பில் காற்புள்ளிகளால் இயல்பாக வெளிப்படுகிறது; தனிப்பெயர் எபிரேய ஒலிக்கு நெருக்கமாகப் பெயர்த்தெழுதப்பட்டுள்ளது.
- source_word: אַרְבָּעָה
  choice: நான்கு பேர்
  rationale: பட்டியலிடப்பட்ட நபர்களின் மொத்த எண்ணிக்கையைச் சுருக்குகிறது; மனிதர்களைக் குறிக்கும் இயல்பான தமிழ் எண்ணுமுறை பயன்படுத்தப்பட்டுள்ளது.
