  rationale: எபிரெயப் பெயரின் ஒலியமைப்பை நவீனத் தமிழில் வாசிக்க ஏற்றபடி எழுத்துப்பெயர்த்த வடிவம்.
- source_word: הַשְּׁלִישִׁי
