  yaml_path: translation/ot/1_chronicles/023/019.yaml
  text: 'The sons of Hebron: Jeriah the first[a], Amariah the second, Jahaziel the third, and Jekameam the fourth.'
translation:
  language: ta
  text: 'எப்ரோனின் மகன்கள்: யெரியா முதலாவது[a], அமரியா இரண்டாவது, யகசியேல் மூன்றாவது, யெக்காமெயாம் நான்காவது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘தலை’ அல்லது ‘தலைவன்’ என்று உள்ளது; ஆனால் ‘இரண்டாவது, மூன்றாவது, நான்காவது’ என்ற தொடருக்கு இணையாக இங்கு ‘முதலாவது’ என்ற பொருளில் செயல்படுகிறது.
    reason: lexical_alternative
