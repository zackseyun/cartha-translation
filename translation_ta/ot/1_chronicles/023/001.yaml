translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான வரலாற்றுக் கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மரபுத்தொடரின் இலக்கியச் சுவையைப் பாதுகாக்க ‘வாழ்நாட்கள் நிறைந்தவர்’ என வழங்கி, அதன் இயல்பான மாற்று வாசிப்பை அடிக்குறிப்பில் கொடுத்துள்ளோம்.
