source:
  edition: WLC
  text: וְ/דָוִ֥יד זָקֵ֖ן וְ/שָׂבַ֣ע יָמִ֑ים וַ/יַּמְלֵ֛ךְ אֶת שְׁלֹמֹ֥ה בְנ֖/וֹ עַל יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/001.yaml
  text: David was old and full of days[a], and he made his son Solomon king over Israel.
translation:
  language: ta
  text: தாவீது முதிர்ந்தவராகவும், வாழ்நாட்கள் நிறைந்தவராகவும் இருந்தபோது, தன் மகன் சாலொமோனை இஸ்ரவேலின்மேல் அரசனாக்கினார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זָקֵן
  choice: முதிர்வயதடைந்து
  rationale: தாவீது வயது முதிர்ந்திருந்தார் என்பதைக் கண்ணியமான, இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: וְשָׂבַע יָמִים
  choice: வாழ்நாட்கள் நிறைந்தவரானபோது
  rationale: ‘நாட்களால் நிறைந்தவர்’ என்ற எபிரெய மரபுத்தொடரின் இலக்கிய உருவகத்தைத் தக்கவைத்தபடியே, நீண்ட ஆயுளை அடைந்த நிலையைத் தமிழில் புரியுமாறு தருகிறது.
- source_word: וַיַּמְלֵךְ
  choice: அரசனாக்கினார்
  rationale: ஹிஃபில் வடிவத்தின் காரணவினைப் பொருளை நேரடியாகக் காட்டுகிறது; உரையில் சொல்லப்படாத முடிசூட்டு விழாவைச் சேர்ப்பதில்லை.
- source_word: אֶת שְׁלֹמֹה בְנוֹ
  choice: தன் மகன் சாலொமோனை
  rationale: மகன் என்ற உறவைத் தெளிவாகப் பாதுகாக்கும் இயல்பான தமிழ் சொல்வரிசை.
- source_word: עַל יִשְׂרָאֵל
  choice: இஸ்ரவேலின்மேல்
  rationale: ஒரு மக்களின்மேல் அரசாட்சி செய்வதைக் குறிக்கும் עַל என்பதன் பொருளைத் துல்லியமாக வழங்குகிறது; மூலத்தில் இல்லாத ‘இஸ்ரவேல் முழுவதற்கும்’ என்பதைச் சேர்க்கவில்லை.
- source_word: וְ
  choice: தனி இணைப்புச்சொல்லாக மொழிபெயர்க்கப்படவில்லை
  rationale: தொடக்க וְ கதைத் தொடர்ச்சியைக் குறிக்கிறது. தமிழில் செயற்கையாக ‘மேலும்’ அல்லது ‘இப்போது’ என்று தொடங்காமல், வாக்கிய அமைப்பே அந்தத் தொடர்ச்சியை இயல்பாக வெளிப்படுத்துகிறது.
