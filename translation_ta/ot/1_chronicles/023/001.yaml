revisions:
- from: தாவீது முதிர்வயதடைந்து, வாழ்நாட்கள் நிறைந்தவரானபோது[a], தன் மகன் சாலொமோனை இஸ்ரவேலின்மேல் அரசனாக்கினார்.
  to: தாவீது முதிர்ந்தவராகவும், வாழ்நாட்கள் நிறைந்தவராகவும் இருந்தபோது, தன் மகன் சாலொமோனை இஸ்ரவேலின்மேல் அரசனாக்கினார்.
  rationale: The revision replaces the change-of-state expression with a stative rendering that corresponds to the Hebrew description of David as old. It retains the source idiom ‘full of days,’ David’s causative installation of Solomon, and the existing footnote anchor and purpose.
