translation_notes:
  register: நவீன, மரியாதையான, வழிபாட்டுச் சூழலுக்கேற்ற தமிழ் பயன்படுத்தப்பட்டுள்ளது. இந்த வசனம் முந்தைய வசனத்தின் பொறுப்புப் பட்டியலைத் தொடர்வதால், தமிழில் முழுமையான வாக்கியமாக இயங்க “அவர்கள் பொறுப்பாயிருந்தார்கள்” சேர்க்கப்பட்டுள்ளது. מְשׂוּרָה மற்றும் מִדָּה ஆகிய நெருங்கிய அளவீட்டுச் சொற்களின் வேறுபாடு உறுதியற்றதால் “அளவைகள், அளவுகள்” என இணையாக வைக்கப்பட்டுள்ளது.
