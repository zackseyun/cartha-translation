source:
  edition: WLC
  text: וּ/לְ/לֶ֨חֶם הַֽ/מַּעֲרֶ֜כֶת וּ/לְ/סֹ֤לֶת לְ/מִנְחָה֙ וְ/לִ/רְקִיקֵ֣י הַ/מַּצּ֔וֹת וְ/לַֽ/מַּחֲבַ֖ת וְ/לַ/מֻּרְבָּ֑כֶת וּ/לְ/כָל מְשׂוּרָ֖ה וּ/מִדָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/029.yaml
  text: and for the bread of the arrangement[a], and for the fine flour for the grain offering, and for the wafers of unleavened bread, and for what is cooked on the griddle, and for what is well-mixed, and for every measure and size,
translation:
  language: ta
  text: அடுக்கிவைக்கப்பட்ட அப்பத்துக்கும்[a], தானியக் காணிக்கைக்கான நன்றாக அரைக்கப்பட்ட மாவுக்கும், புளிப்பில்லாத மெல்லிய அடைகளுக்கும், சுடுதட்டில் தயாரிக்கப்படுபவற்றுக்கும், நன்கு கலந்தவற்றுக்கும், எல்லா அளவைகளையும் பரிமாணங்களையும் கவனிப்பதற்கும் அவர்கள் பொறுப்பாயிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு மொழிபெயர்ப்புகள்: “சமுகத்து அப்பம்” அல்லது “படையல் அப்பம்.” எபிரெயத்தில் நேரடியாக, “அடுக்கிவைப்பின் அப்பம்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם הַמַּעֲרֶכֶת
  choice: அடுக்கிவைக்கப்படும் அப்பம்
  rationale: எபிரெயச் சொற்றொடர் நேரடியாக ‘அடுக்கின்/ஒழுங்கமைப்பின் அப்பம்’ என்று பொருள்படும். வழிபாட்டில் ஒழுங்காக அடுக்கிவைக்கப்படும் அப்பத்தை இயல்பான தமிழில் உணர்த்துகிறது; பாரம்பரிய மாற்றுப் பெயர்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: סֹלֶת
  choice: நைசான மாவு
  rationale: காணிக்கைகளுக்குப் பயன்படுத்தப்பட்ட நன்றாக அரைத்த, தரமான மாவைக் குறிக்கும் தெளிவான நவீனத் தமிழ்.
- source_word: מִנְחָה
  choice: தானியக் காணிக்கை
  rationale: இவ்வழிபாட்டுச் சூழலில் பொதுவான காணிக்கையையல்ல, மாவு அல்லது தானியத்தால் செலுத்தப்பட்ட காணிக்கையைக் குறிக்கிறது.
- source_word: רְקִיקֵי הַמַּצּוֹת
  choice: புளிப்பில்லாத மெல்லிய அடைகள்
  rationale: רְקִיקִים என்பதன் மெல்லிய அடை போன்ற வடிவத்தையும், מַצּוֹת என்பதன் புளிப்பில்லாத தன்மையையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מַּחֲבַת
  choice: தட்டில் சுடப்படுபவை
  rationale: இது காணிக்கை உணவைத் தயாரிக்கப் பயன்படுத்திய தட்டையான சுடுதட்டைக் குறிக்கும்; பட்டியலின் சூழலுக்கேற்ப பாத்திரத்தை மட்டும் அல்லாமல் அதில் தயாரிக்கப்பட்டவற்றைக் காட்டுகிறது.
- source_word: מֻּרְבָּכֶת
  choice: நன்கு கலக்கப்படுபவை
  rationale: செயப்பாட்டு வடிவத்தின் பொருளைப் பேணுகிறது; கலவையின் பொருட்கள் அல்லது துல்லியமான சமையல் முறையைத் தேவையின்றி வரையறுக்கவில்லை.
- source_word: מְשׂוּרָה
  choice: அளவை
  rationale: அளக்கப்படும் கொள்ளளவு அல்லது நிலையான அளவையைக் குறிக்கிறது.
- source_word: מִדָּה
  choice: அளவு
  rationale: முந்தைய சொல்லுடன் இணைந்து அளவீட்டு நியமங்களின் முழு வரம்பையும் குறிக்கிறது; எபிரெய இணைச்சொற்களின் நெருக்கத்தைச் செயற்கையாகப் பிரிக்காமல் பேணுகிறது.
