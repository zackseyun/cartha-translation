translation_notes:
  register: நவீன நிலையான தமிழில், வம்சப்பட்டியலுக்கேற்ற சுருக்கமானதும் கண்ணியமானதுமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘தலைவன்’ என்ற சொல் அமைப்புசார் முதன்மையைக் காட்டுகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது. மூலத்தில் உள்ள எண்ணிக்கைப் பெருக்கின் வலிமையை ‘மிக அதிகமாகப் பெருகினார்கள்’ எனத் தெளிவாகக் காத்துள்ளது.
