base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/017.yaml
  text: 'The sons of Eliezer: Rehabiah was the chief[a], and Eliezer had no other sons; but the sons of Rehabiah became very many.'
translation:
  language: ta
  text: 'எலியேசரின் மகன்கள்: ரெகபியா தலைவனாக இருந்தான்.[a] எலியேசருக்கு வேறு மகன்கள் இல்லை; ஆனால் ரெகபியாவின் மகன்கள் மிகவும் பெருகினர்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “முதன்மையானவனாக இருந்தான்.”
    reason: הָרֹאשׁ இங்கு குடும்ப அல்லது வம்ச அமைப்பில் தலைமை வகித்தவர், அல்லது முதன்மையானவர் எனப் பொருள்படலாம்.
lexical_decisions:
- source_word: וַיִּהְיוּ בְנֵי אֱלִיעֶזֶר
  choice: எலியேசரின் மகன்களில்
  rationale: வம்சப்பட்டியல் தொடக்கச் சூத்திரத்தை இயல்பான நவீனத் தமிழில் தருகிறது; அடுத்துவரும் ஒரே பெயருடன் இலக்கணத் தொடர்பையும் தெளிவாக்குகிறது.
- source_word: רְחַבְיָה
  choice: ரெகபியா
  rationale: எபிரெயத் தனிப்பெயரின் ஒலியைத் தமிழில் இயன்றவரை நெருக்கமாக எழுத்துப்பெயர்க்கிறது.
- source_word: הָרֹאשׁ
  choice: தலைவனாக இருந்தான்
  rationale: רֹאשׁ என்பதன் அடிப்படைப் பொருள் ‘தலை’; இங்கு குடும்ப அல்லது வம்ச அமைப்பில் முதன்மை வகித்தவர் அல்லது தலைவர் என்ற நிலையைக் குறிக்கிறது.
- source_word: וְלֹא הָיָה לֶאֱלִיעֶזֶר בָּנִים אֲחֵרִים
  choice: எலியேசருக்கு வேறு மகன்கள் இல்லை
  rationale: எபிரெய இருப்புச் சொற்றொடரைத் தெளிவான இயல்பான தமிழில் வழங்குகிறது; ரெகபியா எலியேசரின் ஒரே மகன் என்பதைக் காட்டுகிறது.
- source_word: וּבְנֵי רְחַבְיָה
  choice: ஆனால் ரெகபியாவின் மகன்கள்
  rationale: இணைப்புச் சொல் அடிப்படையில் ‘மற்றும்’ என வரலாம்; எலியேசருக்கு வேறு மகன்கள் இல்லாததற்கும் ரெகபியாவின் ஏராளமான சந்ததிக்கும் இடையிலுள்ள எதிர்மறை ஒப்புமையை ‘ஆனால்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: רָבוּ לְמָעְלָה
  choice: மிக அதிகமாகப் பெருகினார்கள்
  rationale: רָבוּ என்பது எண்ணிக்கையில் பெருகுதலைக் குறிக்கிறது; לְמָעְלָה இங்கு அதன் அளவை வலுப்படுத்தும் அரிய சொல்லாட்சியாகப் புரிந்துகொள்ளப்படுகிறது.
