  text: 'The sons of Ladan: Jehiel the head[a], and Zetham and Joel—three.'
translation:
  language: ta
  text: 'லாதானின் மகன்கள்: தலைவரான யெகியேல்[a], சேத்தாம், யோவேல்—மூவர்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “முதன்மையானவர்” அல்லது “தலைவர்”; எபிரெயச் சொல் யெகியேல் முன்னிலை வகித்தவராகவோ முதல் மகனாகவோ இருந்ததைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: இது ‘மகன்கள்’ என்பதன் இணைப்புநிலைப் பன்மை. இங்கு பெயரிடப்பட்ட மூவரின் பட்டியலை நேரடியாக அறிமுகப்படுத்துவதால் ‘மகன்கள்’ என்பது இயல்பான மொழிபெயர்ப்பு.
- source_word: לַעְדָּן
  choice: லாதான்
  rationale: எபிரெய மெய்யெழுத்துகளையும் உயிர்க்குறிகளையும் நெருக்கமாகப் பிரதிபலிக்கும் பெயரெழுத்தாக்கம்.
- source_word: הָרֹאשׁ
  choice: தலைவனான
  rationale: சொல்லின் அடிப்படைப் பொருள் ‘தலை/தலைவன்.’ இங்கு யெகியேல் குடும்பத்தில் முதன்மையானவர் அல்லது முன்னிலை வகித்தவர் எனக் குறிக்கலாம்; ‘முதற்பிறந்தவன்’ என்று தெளிவுபடுத்தாமல் மூலத்தின் பொருள் நெகிழ்வைத் தக்கவைக்கிறது.
- source_word: יְחִיאֵל
  choice: யெகியேல்
  rationale: எபிரெயப் பெயரின் தமிழ் ஒலிபெயர்ப்பு.
- source_word: וְזֵתָם
  choice: சேத்தாம்
  rationale: இணைப்பிடைச்சொல்லுடன் வரும் பெயர்; தமிழ்ப் பட்டியல் நடைக்கு ஏற்ப இணைப்பை தனியே மீண்டும் கூறாமல் பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְיוֹאֵל
  choice: யோவேல்
  rationale: எபிரெயப் பெயரின் தமிழ் ஒலிபெயர்ப்பு.
- source_word: שְׁלֹשָׁה
  choice: மூவர்
  rationale: பட்டியலிடப்பட்ட ஆண் நபர்களின் மொத்த எண்ணிக்கையைத் தெளிவுபடுத்தும் எண்ணுச் சொல்; மனிதர்களுக்குரிய இயல்பான தமிழ் வடிவம் பயன்படுத்தப்பட்டுள்ளது.
