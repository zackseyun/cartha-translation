translation_notes:
  register: நவீன நிலையான தமிழில் சுருக்கமான வம்சவரலாற்றுப் பட்டியல் நடையும் கண்ணியமான மொழிநடையும் பேணப்பட்டுள்ளன. הָרֹאשׁ என்பதிலுள்ள பதவி, முதன்மை, பிறப்பு வரிசை ஆகிய சாத்தியங்களில் ஒன்றை மட்டும் உறுதியாக்காமல் அடிக்குறிப்பில் உண்மையான தெளிவின்மை பாதுகாக்கப்பட்டுள்ளது.
