base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/009.yaml
  text: 'The sons of Shimei: Shelomoth[a], Haziel, and Haran—three. These were the heads of the fathers’ houses of Ladan.'
translation:
  language: ta
  text: 'சிமெயியின் மகன்கள்: ஷெலோமோத்[a], ஹசியேல், ஹாரான்—மூன்று பேர். இவர்கள் லாதானின் தந்தைவழிக் குடும்பத் தலைவர்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஷெலோமித்”; இப்பெயரின் வழக்கிலுள்ள மற்றொரு ஒலிபெயர்ப்பு.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי שִׁמְעִי
  choice: சிமெயியின் மகன்கள்
  rationale: இது வம்சப்பட்டியல் சூழலில் உடனடியாகப் பெயரிடப்படும் மூவரைக் குறிப்பதால், பொதுவான ‘வழித்தோன்றல்கள்’ என்பதைக் காட்டிலும் குறிப்பான ‘மகன்கள்’ இயல்பானது.
- source_word: שלמות
  choice: செலோமோத்
  rationale: இங்கு உயிர்க்குறியிடப்பட்டுள்ள எபிரெய வடிவத்துக்கு நெருக்கமான ஆண்பால் தனிப்பெயர் ஒலிபெயர்ப்பு.
- source_word: וַחֲזִיאֵל
  choice: அசியேல்
  rationale: חֲזִיאֵל என்ற பெயரைத் தமிழில் இயல்பாக ஒலிபெயர்க்கிறது; வேறிடங்களில் காணப்படும் தொடர்புடைய ‘யகசியேல்’ போன்ற பெயர்வடிவம் இங்கு புகுத்தப்படவில்லை.
- source_word: וְהָרָן
  choice: ஆரான்
  rationale: הָרָן என்ற தனிப்பெயரின் தமிழ் ஒலிபெயர்ப்பு.
- source_word: שְׁלֹשָׁה
  choice: மூன்று பேர்
  rationale: பெயரிடப்பட்ட மகன்களின் மொத்த எண்ணிக்கையை மூலமொழி வெளிப்படையாகக் குறிப்பிடுவதால் அதைத் தனியே தக்கவைக்கிறது.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: தந்தைவழிக் குடும்பங்களின் தலைவர்கள்
  rationale: நாளாகம வம்ச மற்றும் நிர்வாகச் சூழலில் தந்தைவழி அமைந்த குடும்பப் பிரிவுகளின் தலைமைப் பிரதிநிதிகளைச் சுட்டுகிறது; சொற்சொல்லான ஆனால் தமிழில் தெளிவற்ற ‘தந்தைகளின் தலைவர்கள்’ தவிர்க்கப்படுகிறது.
- source_word: לְלַעְדָּן
  choice: லாதானைச் சேர்ந்த
  rationale: לְ முன்னொட்டு இங்கு லாதானின் வம்சத்துடனான உறவு அல்லது சேர்ந்திருப்பதைக் குறிக்கிறது; ‘லாதானைச் சேர்ந்த’ என்பது தமிழில் அந்த உறவைத் தெளிவாகக் காட்டுகிறது.
