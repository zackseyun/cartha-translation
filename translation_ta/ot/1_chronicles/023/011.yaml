  text: וַֽ/יְהִי יַ֣חַת הָ/רֹ֔אשׁ וְ/זִיזָ֖ה הַ/שֵּׁנִ֑י וִ/יע֤וּשׁ וּ/בְרִיעָה֙ לֹֽא הִרְבּ֣וּ בָנִ֔ים וַ/יִּֽהְיוּ֙ לְ/בֵ֣ית אָ֔ב לִ/פְקֻדָּ֖ה אֶחָֽת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/011.yaml
  text: Jahath was the first and Zizah the second[a]; Jeush and Beriah did not have many sons[b], so they became one father’s house for one reckoning.
translation:
  language: ta
  text: யகாத் முதலாவனாகவும் சீசா இரண்டாவனாகவும் இருந்தனர். யெவூசுக்கும் பெரீயாவுக்கும் அதிகமான மகன்கள் இல்லை; ஆகவே அவர்கள் ஒரே கணக்கீட்டுக்காக ஒரே தந்தைவழிக் குடும்பமாக அமைந்தனர்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒரே கணக்கீட்டில் ஒரே தந்தைவழிக் குடும்பமாகக் கருதப்பட்டனர்.” இங்குள்ள எபிரெயச் சொல் எண்ணிக்கைப் பதிவு அல்லது கணக்கீட்டைக் குறிக்கலாம்; நிர்வாகப் பொறுப்பு அல்லது அலகு என்ற நிழற்பொருளும் இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי יַחַת הָרֹאשׁ
  choice: யகாத் முதல்வனாக இருந்தார்
  rationale: רֹאשׁ என்பதன் அடிப்படைப் பொருள் ‘தலைவன்/தலை’ என்றாலும், இங்கு ‘இரண்டாமவன்’ என்பதுடன் இணைந்து வரிசை அல்லது முதன்மை நிலையைக் குறிக்கிறது; ஆகவே ‘முதல்வன்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: וְזִיזָה הַשֵּׁנִי
  choice: சீசா இரண்டாமவனாக இருந்தார்
  rationale: הַשֵּׁנִי வரிசையில் இரண்டாவது இடத்தைக் குறிக்கிறது. זִיזָה என்ற பெயர் எபிரெய ஒலிப்புக்கு அண்மையாகத் தமிழில் ‘சீசா’ என எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: לֹא הִרְבּוּ בָנִים
  choice: அதிகமான மகன்கள் இல்லை
  rationale: சொல்லுக்கு சொல் ‘மகன்களைப் பெருகச் செய்யவில்லை’ என்றாலும், இச்சூழலில் இயல்பான தமிழ் நடையில் அவர்கள் அதிக மகன்களைப் பெறவில்லை என்பதே பொருள். בָנִים என்பதன் ஆண்பால் குறிப்பை ‘மகன்கள்’ பாதுகாக்கிறது.
- source_word: לְבֵית אָב
  choice: ஒரே தந்தைவழிக் குடும்பமாக
  rationale: בֵּית אָב என்பது ஒரு தந்தைவழி வம்சக் குடும்பம் அல்லது குல அலகைக் குறிக்கும் தொழில்நுட்ப உறவுமுறைச் சொல். ‘தந்தையின் வீடு’ என்ற சொற்படி மொழிபெயர்ப்பைவிட ‘தந்தைவழிக் குடும்பம்’ நவீன தமிழில் பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: לִפְקֻדָּה אֶחָת
  choice: ஒரே கணக்குப் பிரிவாக
  rationale: פְּקֻדָּה இங்கு எண்ணிக்கைப் பதிவு, நியமனம் அல்லது நிர்வாகப் பிரிவு என்ற தொடர்புடைய பொருள்களை ஏற்கக்கூடும். லேவியர்களின் அமைப்புச் சூழலில், இரு குடும்பங்களும் ஒரே அலகாகக் கணக்கிடப்பட்டதை ‘ஒரே கணக்குப் பிரிவாக’ இயல்பாக வெளிப்படுத்துகிறது.
