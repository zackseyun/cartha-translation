translation_notes:
  register: நவீனத் தரத் தமிழில், கண்ணியமானதும் பொதுவாசகர்களுக்குத் தெளிவானதுமான நடை பயன்படுத்தப்பட்டது. வம்சப் பட்டியல் சார்ந்த தொழில்நுட்பச் சொற்கள் தேவையற்ற சொற்படி இறுக்கமின்றி, அவற்றின் தந்தைவழி மற்றும் நிர்வாகப் பொருள்களைப் பாதுகாக்கும் வகையில் வழங்கப்பட்டன.
