lexical_decisions:
- source_word: בְּנֵי
  choice: மகன்களில்
  rationale: בְּנֵי என்பது ‘மகன்கள்’ என்ற நேரடிப் பொருளுடைய இணைநிலைப் பன்மை வடிவம். பட்டியலின் சுருக்கமான அமைப்பிலும் செபுவேலின் முதன்மை நிலையிலும் பொருந்தும்படி ‘மகன்களில்’ என வழங்கப்பட்டுள்ளது.
- source_word: גֵרְשׁוֹם
  choice: கெர்சோம்
  rationale: இங்கு உள்ள எபிரெயப் பெயர் גֵרְשׁוֹם (Gershom); גֵּרְשׁוֹן (Gershon) அல்ல. ஆகவே ஒலிபெயர்ப்பாக ‘கெர்சோம்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: שְׁבוּאֵל
  choice: செபுவேல்
  rationale: எபிரெயத் தனிப்பெயர் தமிழில் இயல்பாக வாசிக்கத்தக்க வகையில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: הָרֹאשׁ
  choice: தலைவன்
  rationale: ரֹאשׁ என்பதன் அடிப்படைப் பொருள் ‘தலை’; இங்கு குறிப்பிட்ட உறுப்பினர்களில் முதன்மை அல்லது தலைமை வகிப்பவரைக் குறிக்கும் பட்டமாகச் செயல்படுவதால் ‘தலைவன்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், வம்ச மற்றும் பணியமைப்புப் பட்டியலுக்கேற்ற சுருக்கமான, கண்ணியமான நடை. எபிரெய மூலத்தின் பெயர்களும் தலைமை குறிக்கும் சொல்லும் நேரடியாகப் பாதுகாக்கப்பட்டுள்ளன.
