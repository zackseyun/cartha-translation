base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/020.yaml
  text: 'The sons of Uzziel: Micah the first[b][a], and Isshiah the second.'
translation:
  language: ta
  text: 'உசியேலின் மகன்கள்: மீகா முதலாமவன்[a]; இஷ்ஷியா இரண்டாமவன்[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தலைவன்”; எபிரேயத்தில் சொல்லர்த்தமாக, “தலை.”
    reason: lexical_alternative
  - marker: b
    text: “இஷ்ஷியா” என்ற பெயர் வேறு மொழிபெயர்ப்பு மரபுகளில் “யெஷாயா” அல்லது “இஷியா” என்றும் எழுத்துப்பெயர்க்கப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: இது בֵּן என்பதன் இணைப்புநிலைப் பன்மை வடிவம்; இங்கு நேரடியான மகன்களைப் பட்டியலிடுவதால் ‘மகன்கள்’ என்பது இயல்பானதும் துல்லியமானதும் ஆகும்.
- source_word: עֻזִּיאֵל
  choice: ஊசியேல்
  rationale: எபிரேயத் தனிப்பெயரின் ஒலியைத் தமிழில் இயன்றவரை நெருக்கமாக எழுத்துப்பெயர்த்துள்ளது.
- source_word: מִיכָה
  choice: மீகா
  rationale: எபிரேயத் தனிப்பெயரான מִיכָה என்பதற்கான இயல்பான தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: הָרֹאשׁ
  choice: மூத்தவன்
  rationale: רֹאשׁ என்பதன் அடிப்படைப் பொருள் ‘தலை’; ஆனால் அடுத்தவர் ‘இரண்டாமவன்’ எனக் குறிப்பிடப்படுவதால், இங்கு வரிசை அல்லது முதன்மையைக் குறிக்கும் ‘மூத்தவன்’ என்பது இயல்பான தமிழாக்கம். ‘தலைவன்’ என்ற பொருளும் சாத்தியம் என்பதால் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: וְיִשִּׁיָּה
  choice: இஷ்ஷியா
  rationale: இணைப்புச் சொல்லுடன் வரும் எபிரேயத் தனிப்பெயரை, இரட்டித்த ஷ் ஒலியையும் பிரதிபலிக்கும் வகையில் எழுத்துப்பெயர்த்துள்ளது.
- source_word: הַשֵּׁנִי
  choice: இரண்டாமவன்
  rationale: பட்டியலில் இரண்டாவது மகனைக் குறிக்கும் வரிசை எண்ணை, ஆண்பால் மனிதருக்கேற்ற இயல்பான தமிழில் வழங்குகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், சுருக்கமான வம்சவரலாற்றுப் பட்டியல் நடையைப் பேணியுள்ளது. ‘மூத்தவன் … இரண்டாமவன்’ என்ற இணை அமைப்பு தமிழில் இயல்பாக இருந்து, மூலத்தின் வரிசைச் சுட்டுதலை வெளிப்படுத்துகிறது; அதேவேளை הָרֹאשׁ என்பதிலுள்ள ‘தலைவன்’ என்ற சாத்தியத்தை அடிக்குறிப்பு பாதுகாக்கிறது.
