    text: அல்லது, “தலைவன்”; எபிரேயத்தில் சொல்லர்த்தமாக, “தலை.”
    reason: lexical_alternative
  - marker: b
    text: “இஷ்ஷியா” என்ற பெயர் வேறு மொழிபெயர்ப்பு மரபுகளில் “யெஷாயா” அல்லது “இஷியா” என்றும் எழுத்துப்பெயர்க்கப்படுகிறது.
    reason: lexical_alternative
  revision_rationale: The revision corrects the ordinal sense in the immediate ‘first/second’ pairing, improves the source-close transliteration of Uzziel, and clarifies the name-variant footnote. It preserves the lexical ambiguity of הָרֹאשׁ in footnote a.
