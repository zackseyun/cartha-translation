  yaml_path: translation/ot/1_chronicles/023/006.yaml
  text: 'David divided them into divisions for the sons of Levi: Gershon[a], Kohath, and Merari.'
translation:
  language: ta
  text: 'தாவீது அவர்களை லேவியின் மகன்களுக்கான பிரிவுகளாகப் பிரித்தார்: கெர்சோன்[a], கேகாத், மெராரி.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, “தாவீது அவர்களை லேவியின் மகன்களுக்காகப் பிரிவுகளாகப் பிரித்தார்: கெர்சோனுக்காக, கேகாத்துக்காக, மெராரிக்காக.” இவ்வாறு வாசிக்கும்போது முதல் பெயருக்கு முன் வரும் முன்னொட்டு பட்டியலில் உள்ள ஒவ்வொரு பெயரையும் ஆளுவதை வெளிப்படையாகக் காட்டுகிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחָלְקֵם
  choice: அவர்களைப் பிரித்தார்
  rationale: חלק என்பதன் பியேல் வடிவம் ‘பிரித்தல், பங்கிடுதல்’ என்று பொருள்படும்; 3ஆம் நபர் ஆண்பால் பன்மை பின்னொட்டு வெளிப்படையான செயப்படுபொருளைக் கோருவதால் ‘அவர்களை’ தக்கவைக்கப்பட்டுள்ளது.
- source_word: מַחְלְקוֹת
  choice: பிரிவுகளாக
  rationale: இந்தப் பெயர்ச்சொல் ஒழுங்கமைக்கப்பட்ட பிரிவுகள் அல்லது பணிமுறைக் குழுக்களைக் குறிக்கிறது. வினையுடன் சேர்ந்து பிரித்ததன் விளைவைக் காட்ட ‘பிரிவுகளாக’ என்பது இயல்பாகவும் மூலத்திற்கு நெருக்கமாகவும் உள்ளது.
- source_word: לִבְנֵי לֵוִי
  choice: லேவியின் மகன்களாகிய
  rationale: எபிரெயின் மரபுவழிப் பின்னணியைத் தக்கவைத்து, தொடர்ந்து வரும் குலத் தலைவர்களின் பெயர்களுடன் இயல்பாக இணைக்கிறது.
- source_word: לְגֵרְשׁוֹן קְהָת וּמְרָרִי
  choice: கேர்சோன், கோகாத், மெராரி ஆகியோருக்கான
  rationale: முதல் பெயருக்கு முன் உள்ள ל முன்னொட்டு பட்டியல் முழுவதையும் ஆளுவதாகப் புரிந்துகொள்ளப்பட்டுள்ளது. இவை லேவியின் மூன்று முக்கிய வழிமரபுகளின் பெயர்கள்.
