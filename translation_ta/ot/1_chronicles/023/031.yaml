  text: וּ/לְ/כֹ֨ל הַעֲל֤וֹת עֹלוֹת֙ לַ/יהוָ֔ה לַ/שַּׁבָּת֔וֹת לֶ/חֳדָשִׁ֖ים וְ/לַ/מֹּעֲדִ֑ים בְּ/מִסְפָּ֨ר כְּ/מִשְׁפָּ֧ט עֲלֵי/הֶ֛ם תָּמִ֖יד לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/031.yaml
  text: and for all the burnt offerings offered to Yahweh on the Sabbaths[a], at the new moons, and at the appointed feasts, by number according to the ordinance concerning them, continually before Yahweh.
translation:
  language: ta
  text: ஓய்வுநாட்களிலும், அமாவாசைகளிலும், குறிக்கப்பட்ட பண்டிகைகளிலும் யாவேக்குத் தகனபலிகள் அனைத்தையும், அவற்றுக்குரிய விதிமுறைப்படி நிர்ணயிக்கப்பட்ட எண்ணிக்கையில், யாவேக்கு முன்பாகத் தொடர்ந்து செலுத்துவதற்காகவும் அவர்கள் நியமிக்கப்பட்டார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “யாவேக்குத் தகனபலிகளை ஏற்றிச் செலுத்தும் எல்லாச் செயல்களுக்காகவும்” என்றும் மொழிபெயர்க்கலாம். எபிரெயத்தில் ‘ஏற்றிச் செலுத்துதல்’ என்னும் முடிவிலா வினைவடிவத்துடன் ‘தகனபலிகள்’ என்ற பெயர்ச்சொல் சேர்ந்து பலியிடும் செயலை வெளிப்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְכֹל הַעֲלוֹת עֹלוֹת
  choice: தகனபலிகள் அனைத்தையும் செலுத்துவதற்கும்
  rationale: עלה என்ற வினையெச்சமும் עֹלוֹת என்ற பெயர்ச்சொல்லும் இணைந்து பலிகளை ஏற்றிச் செலுத்தும் செயலை வலியுறுத்துகின்றன. தமிழில் தேவையற்ற சொல் மடக்கைத் தவிர்த்து அந்தச் செயற்பொருள் இயல்பாகத் தரப்படுகிறது; மாற்று வடிவம் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: יהוה என்ற உடன்படிக்கைப் பெயர் ஒலிபெயர்ப்பாக ‘யாவே’ என்று தரப்பட்டு, பலி செலுத்தப்படும் இலக்கை ‘-க்கு’ வேற்றுமை காட்டுகிறது.
- source_word: לַשַּׁבָּתוֹת
  choice: ஓய்வுநாட்களிலும்
  rationale: பன்மையில் உள்ள சப்பாத்து நாட்களைக் குறிக்கிறது; நவீனத் தமிழில் புரியும்படி ‘ஓய்வுநாட்கள்’ என வழங்கப்படுகிறது.
- source_word: לֶחֳדָשִׁים
  choice: அமாவாசைகளிலும்
  rationale: வழிபாட்டுக் கால அட்டவணையில் חֳדָשִׁים என்பது வெறும் மாதங்களையல்ல, புதுநிலா அல்லது அமாவாசை அனுசரிப்புகளைக் குறிக்கிறது.
- source_word: וְלַמּוֹעֲדִים
  choice: குறிக்கப்பட்ட பண்டிகைகளிலும்
  rationale: מוֹעֲדִים என்பது நிர்ணயிக்கப்பட்ட புனித விழாக்காலங்களைக் குறிக்கிறது; ‘குறிக்கப்பட்ட பண்டிகைகள்’ காலநியமத்தையும் விழாத்தன்மையையும் காக்கிறது.
- source_word: בְּמִסְפָּר כְּמִשְׁפָּט עֲלֵיהֶם
  choice: அவற்றுக்குரிய முறைப்படி நிர்ணயிக்கப்பட்ட எண்ணிக்கையில்
  rationale: பலிகளின் எண்ணிக்கை அவற்றுக்கான விதிமுறையால் நிர்ணயிக்கப்பட்டது என்பதைத் தெளிவான தமிழ் சொற்றொடராக வெளிப்படுத்துகிறது; עֲלֵיהֶם என்பதன் சுட்டுப்பொருளை அளவுக்கு மீறி குறிப்பாக்கவில்லை.
- source_word: תָּמִיד לִפְנֵי יְהוָה
  choice: யாவேக்கு முன்பாகத் தொடர்ந்து
  rationale: வழிபாட்டுப் பணி ஒழுங்காக இடையறாது நடைபெறுவதையும் அது யாவேயின் சந்நிதியில் செய்யப்படுவதையும் காக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: எபிரெய மூலத்தில் நான்கு எழுத்து உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது. அதனைப் பொதுப்பட்டமாக மாற்றாமல், ஏற்றுக்கொள்ளப்பட்ட ஒலிப்புக்கு நெருக்கமாக ‘யாவே’ என்று வழங்குகிறது.
- issue: தொடர்ச்சியான சேவையின் பொருள்
  choice: தொடர்ந்து பணிசெய்வதற்கும்
  alternative: எப்போதும் யாவேக்கு முன்பாக
  rationale: תָּמִיד என்பது இச்சூழலில் வழிபாட்டுச் சேவையின் ஒழுங்கான தொடர்ச்சியைக் குறிக்கலாம். முந்தைய வசனத்திலிருந்து வரும் லேவியரின் கடமையுடன் வாக்கியத்தை இயல்பாக இணைத்தாலும், முடிவில்லாத காலம் என்ற கருத்தைத் தேவையின்றி திணிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமான நடை. இவ்வசனம் முந்தைய வசனங்களில் தொடங்கிய லேவியரின் கடமைப் பட்டியலின் தொடர்ச்சி என்பதால், தமிழில் முழுமையான வாக்கியமாக வாசிக்க ‘அவர்கள் நியமிக்கப்பட்டார்கள்’ மற்றும் ‘பணிசெய்வதற்கும்’ என்பவை சூழலிலிருந்து நிரப்பப்பட்டுள்ளன. அடிக்குறி [a] முதன்மை உரையில் இடம்பெற்றுள்ளது.
