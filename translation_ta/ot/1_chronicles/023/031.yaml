  to: ஓய்வுநாட்களிலும், அமாவாசைகளிலும், குறிக்கப்பட்ட பண்டிகைகளிலும் யாவேக்குத் தகனபலிகள் அனைத்தையும், அவற்றுக்குரிய விதிமுறைப்படி நிர்ணயிக்கப்பட்ட எண்ணிக்கையில், யாவேக்கு முன்பாகத் தொடர்ந்து செலுத்துவதற்காகவும் அவர்கள் நியமிக்கப்பட்டார்கள்.[a]
