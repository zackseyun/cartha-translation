base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/010.yaml
  text: 'And the sons of Shimei: Jahath[a], Zina, Jeush, and Beriah. These were the sons of Shimei—four.'
translation:
  language: ta
  text: 'சிமெயியின் மகன்கள்: யகாத், சீனா[a], யெவூஷ், பெரீயா. இவர்கள் சிமெயியின் மகன்கள்—மொத்தம் நான்கு பேர்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில மொழிபெயர்ப்புகளில் இரண்டாவது பெயர் “சீசா” என்று உள்ளது (1 நாளாகமம் 23:11-ஐ ஒப்பிடுக); இங்கே எபிரேய வாசகத்தில் “சீனா” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: மகன்கள்
  rationale: בְנֵי என்பது உடைமைத் தொடரில் வரும் ‘மகன்கள்’ என்பதாகும். தொடக்க ו முந்தைய பட்டியலுடன் இணைக்கும் எளிய இணைப்புச்சொல்; தமிழில் பட்டியல் தலைப்பின் இயல்பான நடைக்காகத் தனியே ‘மேலும்’ என்று சேர்க்கப்படவில்லை.
- source_word: שִׁמְעִי
  choice: சிமெயி
  rationale: எபிரேயத் தனிப்பெயரின் ஒலிப்பைத் தமிழில் இயல்பாக எழுத்துப்பெயர்த்த வடிவம்.
- source_word: יַחַת
  choice: யகாத்
  rationale: எபிரேயத் தனிப்பெயர் தமிழில் ஒலிப்புக்கு நெருக்கமாக எழுத்துப்பெயர்க்கப்பட்டுள்ளது.
- source_word: זִינָא
  choice: சீனா
  rationale: இவ்வசனத்தின் எபிரேய வாசகம் ‘சீனா’ என்ற பெயர் வடிவத்தை ஆதரிக்கிறது. தொடர்புடைய மாற்றுப் பெயர் வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: וִיעוּשׁ
  choice: யெவூஷ்
  rationale: தனிப்பெயர் எபிரேய ஒலிப்புக்கு நெருக்கமாக எழுத்துப்பெயர்க்கப்பட்டுள்ளது; முன் இணைப்புச்சொல் தமிழ்ப் பட்டியலின் நிறுத்தக்குறிகளில் இயல்பாக வெளிப்படுகிறது.
- source_word: וּבְרִיעָה
  choice: பெரீயா
  rationale: எபிரேயத் தனிப்பெயர் தமிழில் எழுத்துப்பெயர்க்கப்பட்டுள்ளது; பட்டியலின் இறுதிப் பெயராக இருப்பதால் இணைப்புச்சொல் தனியே மொழிபெயர்க்கப்படவில்லை.
- source_word: אֵלֶּה בְנֵי שִׁמְעִי
  choice: இவர்கள் சிமெயியின் மகன்கள்
  rationale: எபிரேயத்தின் மீள்குறிக்கும் சுருக்க நடையைத் தக்கவைத்து, தமிழில் தெளிவான முழு வாக்கியமாக வழங்கப்பட்டுள்ளது.
- source_word: אַרְבָּעָה
  choice: மொத்தம் நான்கு பேர்
  rationale: பட்டியலில் உள்ள ஆட்களின் எண்ணிக்கையைச் சுருக்கிக் கூறும் எபிரேயச் சொல்லை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
