base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/003.yaml
  text: The Levites were counted from thirty years old and upward[a], and their number by heads, man by man, was thirty-eight thousand.
translation:
  language: ta
  text: முப்பது வயது முதல் அதற்கு மேற்பட்ட லேவியர்கள் கணக்கிடப்பட்டார்கள். தலைவாரியாகக் கணக்கிடப்பட்ட[a] ஆண்களின் எண்ணிக்கை முப்பத்தெட்டாயிரம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லர்த்தமாக, “தங்கள் தலைகளின்படி, ஆண்களாக”; வயதுவந்த ஆண்கள் ஒவ்வொருவராகக் கணக்கிடப்பட்டதை இந்தச் சொற்றொடர் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסָּפְרוּ
  choice: கணக்கிடப்பட்டார்கள்
  rationale: நிஃபால் வினைவடிவத்தின் செயப்பாட்டு பொருளையும் மக்கள் தொகைக் கணக்கெடுப்பின் சூழலையும் இயல்பான நவீன தமிழில் தருகிறது.
- source_word: הַלְוִיִּם
  choice: லேவியர்கள்
  rationale: இஸ்ரவேலின் லேவி கோத்திரத்தாரைக் குறிக்கும் நிலையான தமிழ் பெயர்.
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמָעְלָה
  choice: முப்பது வயதும் அதற்கு மேற்பட்ட வயதும் உடைய
  rationale: கணக்கில் சேர்க்கப்பட்டவர்களுக்கான குறைந்தபட்ச வயது முப்பது என்பதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וַיְהִי מִסְפָּרָם
  choice: அவர்களுடைய எண்ணிக்கை ... முப்பத்தெட்டாயிரம்
  rationale: மொத்த எண்ணிக்கையை அறிமுகப்படுத்தும் எபிரெய வாக்கிய அமைப்பைத் தமிழில் தெளிவாகக் கொடுக்கிறது.
- source_word: לְגֻלְגְּלֹתָם
  choice: தலைவாரியாக
  rationale: ‘தலைகளின்படி’ என்ற மூல உருவகத்தையும் ஒவ்வொருவராக எண்ணப்பட்டதையும் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: לִגְבָרִים
  choice: ஆண்கள் ஒவ்வொருவராக
  rationale: கணக்கிடப்பட்டவர்கள் ஆண்கள் என்பதையும் தனிநபர் அடிப்படையிலான கணக்கெடுப்பையும் வெளிப்படுத்துகிறது.
- source_word: שְׁלֹשִׁים וּשְׁמוֹנָה אָלֶף
  choice: முப்பத்தெட்டாயிரம்
  rationale: மூலத்தின் மொத்த எண்ணிக்கையை நேரடியாகத் தருகிறது.
