translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘தலைவாரியாக’ என்ற சொல் மூலத்தின் உடலுறுப்பு உருவகத்தை இயல்பாகப் பேணுகிறது; அடிக்குறிப்பு அதன் சொல்லர்த்தத்தை விளக்குகிறது.
