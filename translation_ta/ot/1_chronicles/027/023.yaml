  text: וְ/לֹא נָשָׂ֤א דָוִיד֙ מִסְפָּרָ֔/ם לְ/מִ/בֶּ֛ן עֶשְׂרִ֥ים שָׁנָ֖ה וּ/לְ/מָ֑טָּה כִּ֚י אָמַ֣ר יְהוָ֔ה לְ/הַרְבּ֥וֹת אֶת יִשְׂרָאֵ֖ל כְּ/כוֹכְבֵ֥י הַ/שָּׁמָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/023.yaml
  text: But David did not count them from twenty years old and under[b][a], because Yahweh had said he would multiply Israel like the stars of the heavens.
translation:
  language: ta
  text: ஆனால், தாவீது இருபது வயதினரையும் அதற்குக் குறைந்த வயதினரையும் எண்ணவில்லை[a]; ஏனெனில், வானத்தின் நட்சத்திரங்களைப்போல்[b] இஸ்ரவேலைப் பெருகச் செய்வதாக யாவே சொல்லியிருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுடைய எண்ணிக்கையை எடுத்துக்கொள்ளவில்லை.” எபிரெய மரபுத்தொடர் சொல்லுக்குச் சொல் “அவர்களுடைய எண்ணிக்கையை உயர்த்தவில்லை” என வருகிறது; இங்கு அதன் பொருள் அவர்களை எண்ணவில்லை அல்லது கணக்கெடுக்கவில்லை என்பதாகும்.
    reason: lexical_alternative
  - marker: b
    text: “வானத்தின் நட்சத்திரங்களைப்போல்” என்பது இஸ்ரவேலை மிகுதியாகப் பெருகச் செய்வதாக யாவே கொடுத்த வாக்குறுதியை எதிரொலிக்கிறது.
    reason: cross_reference
lexical_decisions:
- source_word: וְלֹא
  choice: ஆனால் ... இல்லை
  rationale: முந்தைய மக்கள்தொகைக் கணக்கெடுப்புச் சூழலுடன் உள்ள முரண்பாட்டுத் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: נָשָׂא ... מִסְפָּרָם
  choice: அவர்களை எண்ணவில்லை
  rationale: சொல்லுக்குச் சொல் பொருள் ‘அவர்களுடைய எண்ணிக்கையை உயர்த்தவில்லை/எடுத்துக்கொள்ளவில்லை’ என்றாலும், இங்கு இது கணக்கெடுப்பைக் குறிக்கும் எபிரெய மரபுத்தொடர். ‘எண்ணவில்லை’ என்பது தெளிவான இயல்பான தமிழ்.
- source_word: לְמִבֶּן עֶשְׂרִים שָׁנָה וּלְמָטָּה
  choice: இருபது வயதும் அதற்குக் கீழும் உள்ளவர்களை
  rationale: இருபது வயதை உள்ளடக்கி, அதற்குக் குறைந்த வயதினரையும் குறிக்கும் எல்லையைத் தெளிவாகக் காட்டுகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: தாவீது அவர்களை எண்ணாததற்கான காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: אָמַר יְהוָה
  choice: யாவே ... சொல்லியிருந்தார்
  rationale: יהוה என்ற உடன்படிக்கைப் பெயரை ‘யாவே’ என ஒலிபெயர்க்கிறது; தாவீதின் செயலுக்கு முன்பே கூறப்பட்ட வாக்குறுதியை இறந்தகால நிறைவு வடிவம் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לְהַרְבּוֹת אֶת יִשְׂרָאֵל
  choice: இஸ்ரவேலை ... பெருகச் செய்வதாக
  rationale: இறைவாக்கின் உள்ளடக்கமாக இஸ்ரவேலை எண்ணிக்கையில் மிகுதியாக்குவதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: כְּכוֹכְבֵי הַשָּׁמָיִם
  choice: வானத்தின் நட்சத்திரங்களைப்போல்
  rationale: மூலத்தின் உவமையையும் முற்பிதாக்களுக்கு வழங்கப்பட்ட வாக்குறுதியின் எதிரொலியையும் காக்கும் கண்ணியமான தமிழ்.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பொதுப்பட்டப் பெயர் அல்ல, நான்கெழுத்து உடன்படிக்கைப் பெயரே நேரடியாக உள்ளது; ஆகவே தனிப்பெயரின் தன்மையைத் தக்கவைக்க ‘யாவே’ பயன்படுத்தப்பட்டுள்ளது.
- issue: இஸ்ரவேலை நட்சத்திரங்களைப்போல் பெருக்குவேன் என்ற கூற்று
  choice: யாவே இஸ்ரவேலைப் பெருகச் செய்வதாக முன்பே சொன்ன வாக்குறுதி
  alternative: தாவீதின் கணக்கெடுப்பைப் பற்றிய புதிய நேரடி கட்டளை
  rationale: மூலவாக்கியம் பெருக்குவதாகக் கூறிய இறைவாக்கை காரணமாகத் தருகிறது; அது குறிப்பாக புதிய கணக்கெடுப்புத் தடையுத்தரவு என்று உரையில் இல்லாததைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கேற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டுள்ளது. ‘கணக்கெடுக்கவில்லை’ என்பதற்குப் பதில் மூலத்தின் பொதுவான வினைநடையைத் தக்கவைக்க ‘எண்ணவில்லை’ முதன்மை உரையில் வைக்கப்பட்டு, கணக்கெடுப்பு சார்ந்த மரபுத்தொடர் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
