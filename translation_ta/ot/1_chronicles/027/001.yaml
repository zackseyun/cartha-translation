base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/001.yaml
  text: The sons of Israel according to their number—the heads of fathers’ houses[a], and the commanders of thousands and of hundreds[c][b], and their officers who served the king in every matter of the divisions that came in and went out month by month throughout all the months of the year—each division was twenty-four thousand.
translation:
  language: ta
  text: எண்ணிக்கையின்படியான இஸ்ரவேல் மக்கள்—தந்தைவழிக் குடும்பங்களின் தலைவர்கள்[a], ஆயிரம் பேர் மற்றும் நூறு பேர் கொண்ட பிரிவுகளின் தலைவர்கள்[b], அவர்களுடைய அதிகாரிகள்—ஆண்டு முழுவதும் மாதந்தோறும் பணிக்கு வந்து சென்ற படைப்பிரிவுகளின் எல்லாக் காரியங்களிலும் அரசனுக்குச் சேவை செய்தனர். ஒவ்வொரு படைப்பிரிவிலும் இருபத்துநான்காயிரம் பேர் இருந்தனர்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தந்தைவழிக் குடும்பங்கள்’ என்பது குல உறவின் அடிப்படையில் அமைந்த பண்டைய இஸ்ரவேலின் நிர்வாக அலகுகளைக் குறிக்கிறது.
    reason: cultural_note
  - marker: b
    text: அதாவது, ஆயிரம் பேர் மற்றும் நூறு பேர் கொண்ட படை அல்லது நிர்வாகக் குழுக்களுக்குத் தலைமை வகித்தவர்கள்.
    reason: cultural_note
  - marker: c
    text: இந்தப் படைப்பிரிவுகள் மாதந்தோறும் மாறிமாறி அரச சேவைக்கு வந்து சென்றன.
    reason: clarification
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: சொல்லாட்சிப்படி ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு முழு மக்களையும் குறிக்கும் வழக்கமான கூட்டுப்பெயர்; நவீன தமிழில் இயல்பாக ‘இஸ்ரவேல் மக்கள்’ என வழங்கப்படுகிறது.
- source_word: לְמִסְפָּרָם
  choice: அவர்களின் எண்ணிக்கையின்படி
  rationale: எண்ணிப் பதிவுசெய்யப்பட்ட நிர்வாக அல்லது படை அமைப்பைக் குறிக்கும் எபிரெயச் சொற்றொடரின் பொருளைப் பேணுகிறது.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: தந்தைவழிக் குடும்பங்களின் தலைவர்கள்
  rationale: பண்டைய இஸ்ரவேலின் தந்தைவழி உறவுமுறை சார்ந்த நிர்வாக அலகைக் குறிக்கும் தொழில்நுட்பச் சொல்லை தெளிவாகக் காட்டுகிறது.
- source_word: וְשָׂרֵי הָאֲלָפִים וְהַמֵּאוֹת
  choice: ஆயிரம்பேருக்கும் நூறுபேருக்கும் தலைவர்கள்
  rationale: எண்ணிக்கை அடிப்படையிலான படை அல்லது நிர்வாகப் பிரிவுகளுக்குத் தலைமை வகித்தவர்களைச் சுட்டுகிறது; ‘தளபதிகள்’ என்று மிகத் துல்லியப்படுத்தாமல் மூலத்தின் பரப்பைப் பேணுகிறது.
- source_word: וְשֹׁטְרֵיהֶם
  choice: அவர்களுடைய அதிகாரிகள்
  rationale: שֹׁטְרִים என்பது எழுத்தர் பணிகளும் நிர்வாகப் பொறுப்புகளும் கொண்ட அதிகாரிகளைக் குறிக்கலாம்; இச்சூழலில் ‘அதிகாரிகள்’ போதிய பரப்புள்ள தேர்வு.
- source_word: הַמְשָׁרְתִים אֶת הַמֶּלֶךְ
  choice: அரசனுக்குச் சேவை செய்த
  rationale: தொடர்ந்து நிகழ்ந்த அதிகாரப்பூர்வ சேவையைக் குறிக்கும் வினையெச்சத்தின் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: לְכֹל דְּבַר הַמַּחְלְקוֹת
  choice: படைப்பிரிவுகள் தொடர்பான எல்லாக் காரியங்களிலும்
  rationale: דבר என்பதன் ‘காரியம்/அலுவல்’ பொருளையும், מחלקות என்பதன் ஒழுங்கமைக்கப்பட்ட பிரிவுகள் என்ற பொருளையும் சூழலுக்கேற்ப வெளிப்படுத்துகிறது.
- source_word: הַבָּאָה וְהַיֹּצֵאת
  choice: பணிக்கு வந்து பணியிலிருந்து சென்ற
  rationale: மூலத்தில் உள்ள ‘வருதல்–செல்லுதல்’ என்ற உருவகத்தைப் பேணியபடியே, மாதாந்திர அரச சேவைச் சுழற்சி என்பதைத் தமிழில் தெளிவாக்குகிறது.
- source_word: חֹדֶשׁ בְּחֹדֶשׁ לְכֹל חָדְשֵׁי הַשָּׁנָה
  choice: ஆண்டு முழுவதும் மாதந்தோறும்
  rationale: ஒவ்வொரு மாதமும் மாறிமாறி நடந்த வருடாந்திரச் சுழற்சியைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: הַמַּחֲלֹקֶת הָאַחַת
  choice: ஒவ்வொரு படைப்பிரிவிலும்
  rationale: சொல்லாட்சிப்படி ‘அந்த ஒரு பிரிவு’ என்றாலும், சூழலில் பகிர்மானப் பொருளாக ஒவ்வொரு பிரிவையும் குறிக்கிறது.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: இருபத்துநான்காயிரம் பேர்
  rationale: எண்ணிக்கையை நேரடியாக வழங்கி, தமிழில் மனிதர்களைக் கணக்கிடும் ‘பேர்’ என்பதையும் சேர்த்து தெளிவாக்குகிறது.
