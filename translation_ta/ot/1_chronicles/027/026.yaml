language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/עַ֗ל עֹשֵׂי֙ מְלֶ֣אכֶת הַ/שָּׂדֶ֔ה לַ/עֲבֹדַ֖ת הָ/אֲדָמָ֑ה עֶזְרִ֖י בֶּן כְּלֽוּב־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/026.yaml
  text: And over those who did the work of the field for the cultivation of the ground was Ezri son of Chelub[a][b].
translation:
  language: ta
  text: நிலத்தைப் பயிரிடுவதற்காக வயல்வேலை செய்தவர்களுக்குப் பொறுப்பாளராகக் கெலூபின் மகன் எஸ்ரி இருந்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַל
  choice: பொறுப்பாளராக
  rationale: நிர்வாகப் பட்டியலின் சூழலில் עַל என்பது ஒரு பணித்துறையின் மேற்பார்வைப் பொறுப்பைச் சுட்டுகிறது. தமிழில் இயல்பான வாக்கிய அமைப்புக்காக அதன் இணைப்புப் பொருள் தனியே மொழிபெயர்க்கப்படவில்லை.
- source_word: עֹשֵׂי מְלֶאכֶת הַשָּׂדֶה
  choice: வயல்வேலை செய்தவர்கள்
  rationale: பங்கேற்புவினை வடிவம் அந்தப் பணியில் ஈடுபட்டவர்களைக் குறிக்கிறது; מְלֶאכֶת הַשָּׂדֶה என்பது வேளாண்மை சார்ந்த வயல்வேலையைச் சுட்டுவதால் இவ்வாறு சுருக்கமாகவும் இயல்பாகவும் மொழிபெயர்க்கப்பட்டது.
- source_word: לַעֲבֹדַת הָאֲדָמָה
  choice: நிலத்தைப் பயிரிடுவதற்காக
  rationale: עֲבֹדָה இங்கு אֲדָמָה என்பதோடு சேர்ந்து மண்ணை உழுதல் அல்லது பயிரிடுதல் என்ற வேளாண்மைப் பொருளைத் தருகிறது; நவீனத் தமிழில் நோக்கத்தைத் தெளிவாக வெளிப்படுத்தும் சொற்றொடர் தேர்ந்தெடுக்கப்பட்டது.
- source_word: עֶזְרִי בֶּן כְּלוּב
  choice: கெலூபின் மகன் எஸ்ரி
  rationale: எபிரேயப் பெயர்கள் தமிழில் ஒலிபெயர்க்கப்பட்டன; בֶּן என்பதன் உறவுப்பொருள் இயல்பான தமிழ் மரபுப்படி உரிமைத் தொடராக வழங்கப்பட்டது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், நிர்வாகப் பட்டியலுக்கேற்ற சுருக்கமான மற்றும் கண்ணியமான நடை. மூலத்தின் வேளாண்மைச் சூழலும் மேற்பார்வைப் பொருளும் தெளிவாகப் பாதுகாக்கப்பட்டுள்ளன.
