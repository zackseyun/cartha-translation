base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/016.yaml
  text: 'And over the tribes of Israel: for the Reubenites[a], Eliezer son of Zichri was leader; for the Simeonites, Shephatiah son of Maacah.'
translation:
  language: ta
  text: 'இஸ்ரவேலின் கோத்திரங்களுக்குப் பொறுப்பாக இருந்தவர்கள்: ரூபனியருக்கு சிக்ரியின் மகன் எலியேசர் தலைவர்[a]; சிமியோனியருக்கு மாக்காவின் மகன் செபத்தியா.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல்லை “முதல்வர்,” “அதிகாரி” அல்லது “ஆளுநர்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל שִׁבְטֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கோத்திரங்களுக்குப் பொறுப்பாக இருந்தவர்கள்
  rationale: וְעַל அறிமுகப்படுத்தும் நிர்வாகப் பொறுப்பு அல்லது மேற்பார்வை என்ற பொருளையும், அடுத்து வரும் பட்டியல் அமைப்பையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: לָרְאוּבֵנִי
  choice: ரூபனியருக்கு
  rationale: எபிரெய இனக்குழுப் பெயர் மூதாதையான ரூபனைத் தனிநபராக அல்ல, அவருடைய கோத்திரத்தாரைக் குறிக்கிறது.
- source_word: נָגִיד
  choice: தலைவர்
  rationale: அதிகாரப் பொறுப்பில் நியமிக்கப்பட்ட ஒருவரைக் குறிக்கும் பரந்த பொருளைத் தெளிவாகக் காட்டுகிறது; அரச மரபைத் தேவையின்றி உணர்த்தும் சொற்களைத் தவிர்க்கிறது.
- source_word: אֱלִיעֶזֶר בֶּן זִכְרִי
  choice: சிக்ரியின் மகன் எலியேசர்
  rationale: எபிரெய தந்தைவழி அடையாளத்தை இயல்பான தமிழ் சொல்வரிசையில் பாதுகாக்கிறது; பெயர்கள் வழக்கமான தமிழ் ஒலிபெயர்ப்பில் தரப்பட்டுள்ளன.
- source_word: לַשִּׁמְעוֹנִי
  choice: சிமியோனியருக்கு
  rationale: இனக்குழு வடிவம் சிமியோன் கோத்திரத்தாரைக் குறிக்கிறது; ரூபனியருக்கு என்ற முந்தைய தொடருக்கு இணையான அமைப்பு பேணப்படுகிறது.
- source_word: שְׁפַטְיָהוּ בֶּן מַעֲכָה
  choice: மாக்காவின் மகன் செபத்தியா
  rationale: தந்தைவழி அடையாளத்தைத் தெளிவாகவும் இயல்பான தமிழ் சொல்வரிசையிலும் தருகிறது; மாக்கா என்ற பெயருடையவரின் பாலினம் குறித்து மூலத்தில் இல்லாத விளக்கம் சேர்க்கப்படவில்லை.
