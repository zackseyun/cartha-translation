base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/007.yaml
  text: The fourth[a], for the fourth month, was Asahel the brother of Joab, and Zebadiah his son after him; and over his division were twenty-four thousand.
translation:
  language: ta
  text: நான்காம் மாதத்துக்கான நான்காவது தலைவர் யோவாபின் சகோதரனான ஆசகேல்; அவனுக்குப் பின் அவன் மகன் செபதியா[a] பொறுப்பேற்றான். அவனுடைய படைப்பிரிவில் இருபத்துநான்காயிரம் பேர் இருந்தனர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் நேரடியாக, “அவனுக்குப் பின் அவன் மகன் செபதியா” என்று உள்ளது; இங்கு அது செபதியா அவனுக்குப் பின் பொறுப்பேற்றதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרְבִיעִי לַחֹדֶשׁ הָרְבִיעִי
  choice: நான்காம் மாதத்துக்கான நான்காவது தலைவர்
  rationale: எபிரெய உரையில் ‘நான்காவது’ என்பது பெயர்ச்சொல் இல்லாமல் பயன்படுத்தப்பட்டாலும், இந்தப் பட்டியலின் சூழலில் மாதாந்திரப் படைப்பிரிவின் தலைவரைக் குறிக்கிறது. தமிழில் பொருள் தெளிவாக இருக்க ‘தலைவர்’ சேர்க்கப்பட்டது.
- source_word: עֲשָׂהאֵל אֲחִי יוֹאָב
  choice: யோவாபின் சகோதரனான ஆசகேல்
  rationale: உறவுமுறையை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; பெயர்கள் வழக்கமான தமிழ் வேதாகம ஒலிபெயர்ப்பில் தரப்பட்டுள்ளன.
- source_word: וּזְבַדְיָה בְנוֹ אַחֲרָיו
  choice: அவனுக்குப் பின் அவன் மகன் செபதியா பொறுப்பேற்றான்
  rationale: אַחֲרָיו என்பதன் நேரடிப் பொருள் ‘அவனுக்குப் பின்’; இங்கு அது பதவித் தொடர்ச்சியைக் குறிப்பதால் ‘பொறுப்பேற்றான்’ என்பது இயல்பாகச் சேர்க்கப்பட்டது. அடிச்சொல் வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: அவனுடைய படைப்பிரிவில்
  rationale: מַחֲלֻקָה இவ்வதிகாரத்தில் இராணுவப் படைப்பிரிவைக் குறிக்கிறது. ஆட்களின் எண்ணிக்கையைச் சொல்லும் தமிழ்ச் சொற்றொடரில் ‘படைப்பிரிவில்’ என்பது இயல்பானது.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: இருபத்துநான்காயிரம் பேர்
  rationale: எண்ணிக்கை நவீனத் தமிழில் இயல்பாகக் கொடுக்கப்பட்டுள்ளது; மனிதர்களின் எண்ணிக்கை என்பதால் ‘பேர்’ சேர்க்கப்பட்டுள்ளது.
