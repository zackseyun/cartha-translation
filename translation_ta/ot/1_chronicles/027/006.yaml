source:
  edition: WLC
  text: ה֧וּא בְנָיָ֛הוּ גִּבּ֥וֹר הַ/שְּׁלֹשִׁ֖ים וְ/עַל הַ/שְּׁלֹשִׁ֑ים וּ/מַ֣חֲלֻקְתּ֔/וֹ עַמִּיזָבָ֖ד בְּנֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/006.yaml
  text: This was Benaiah[a], a mighty man of the Thirty and over the Thirty; and his division was under Ammizabad his son.
translation:
  language: ta
  text: இவனே பெனாயா; முப்பதுபேரில் வலிமைமிக்க வீரனாகவும், அந்த முப்பதுபேருக்குத் தலைவனாகவும் இருந்தான். அவனுடைய படைப்பிரிவுக்குப் பொறுப்பாக அவன் மகன் அம்மிசாபாத் இருந்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הוּא בְנָיָהוּ
  choice: இவனே பெனாயா
  rationale: הוּא என்பது முந்தைய வசனத்தில் குறிப்பிடப்பட்ட நபரை மீண்டும் சுட்டி வலியுறுத்துகிறது; ‘இவனே’ அந்தத் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: גִּבּוֹר
  choice: வலிமைமிக்க வீரன்
  rationale: இச்சொல் இங்கு உடல் வலிமையை மட்டும் அல்லாமல் போரில் சிறந்த வீரனையும் குறிக்கிறது.
- source_word: הַשְּׁלֹשִׁים
  choice: முப்பதுபேர்
  rationale: இது தாவீதுடன் தொடர்புடைய, நன்கு அறியப்பட்ட சிறப்பு வீரர் குழுவைக் குறிக்கிறது; தமிழில் மனிதர்களைக் குறிக்கும் வகையில் ‘பேர்’ சேர்க்கப்பட்டுள்ளது.
- source_word: וְעַל הַשְּׁלֹשִׁים
  choice: அந்த முப்பதுபேருக்குத் தலைவனாக
  rationale: עַל இச்சூழலில் அந்தக் குழுவின்மேல் அதிகாரம் அல்லது தலைமை வகித்ததைக் குறிக்கிறது; வெறும் இடநிலைச் சொல்லாக்கத்தைவிட இது தமிழில் தெளிவாக உள்ளது.
- source_word: מַחֲלֻקְתּוֹ
  choice: அவனுடைய படைப்பிரிவு
  rationale: 1 நாளாகமம் 27-ன் சூழலில் இது முறைவைத்து பணியாற்றிய இராணுவப் பிரிவைக் குறிக்கிறது; ‘படைப்பிரிவு’ அதனைத் தெளிவாக்குகிறது.
- source_word: עַמִּיזָבָד בְּנוֹ
  choice: அவன் மகன் அம்மிசாபாத்
  rationale: பெயரும் உறவுமுறையும் இயல்பான நவீன தமிழ்ச் சொல் வரிசையில் தரப்பட்டுள்ளன.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வரலாற்று-இராணுவ நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய உரையின் சுருக்கமான அமைப்பு காக்கப்பட்டாலும், ‘படைப்பிரிவு’ மற்றும் ‘பொறுப்பாயிருந்தான்’ என்பவை அத்தியாயச் சூழலின் நிர்வாகப் பொருளை இயல்பான தமிழில் தெரிவிக்கின்றன.
