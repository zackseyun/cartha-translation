  terminology: ‘படைப்பிரிவு’ מַחֲלֻקָה என்பதற்குப் பொருத்தமான நவீன இராணுவ-நிர்வாகச் சொல். ‘ஊசாத்தியனான’ மற்றும் ‘சிபெக்காய்’ ஆகிய பெயரெழுத்துப்பெயர்ப்புகள் சீராக உள்ளன. சேராகியர் தொடர்பான ஒருமை இனப்பெயர்/குலச் சார்பு என்ற மூலத்தின் சாத்தியமான இருமுகத்தன்மையை அடிக்குறிப்பு போதுமானவாறு காக்கிறது.
