base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/011.yaml
  text: 'The eighth[a], for the eighth month: Sibbecai the Hushathite, of the Zerahites; and over his division were twenty-four thousand.'
translation:
  language: ta
  text: 'எட்டாவது மாதத்துக்குரிய எட்டாவது தலைவர்: ஊசாத்தியனான சிபெக்காய்; அவன் சேராகியர் குலத்தைச் சேர்ந்தவன்[a]. அவனுடைய படைப்பிரிவில் இருபத்துநான்காயிரம் பேர் இருந்தனர்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சேராகியன்.” எபிரேயச் சொற்றொடரை நேரடியாக ஒருமை இனப்பெயராகவும் கொள்ளலாம்; ஆனால் சூழலில் இது பெரும்பாலும் குலச் சார்பைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְּׁמִינִי
  choice: எட்டாவது தலைவர்
  rationale: படைப்பிரிவுகளின் பட்டியலில் வரிசை எண்ணாகத் தனித்து நிற்கும் சொல்லில் தலைமைப் பொறுப்பு உள்ளடங்கியுள்ளது. தமிழில் பொருள் தெளிவாக இருக்க ‘தலைவர்’ என்பது வெளிப்படையாகச் சேர்க்கப்பட்டது.
- source_word: לַחֹדֶשׁ הַשְּׁמִינִי
  choice: எட்டாவது மாதத்துக்குரிய
  rationale: ל முன்னொட்டு இங்கு அந்த மாதத்திற்கான பணிநியமனத்தைக் குறிக்கிறது; ‘மாதத்துக்குரிய’ என்பது இயல்பான நிர்வாகத் தொடர்பைத் தெரிவிக்கிறது.
- source_word: סִבְּכַי
  choice: சிபெக்காய்
  rationale: எபிரேயப் பெயரின் ஒலியமைப்பை நவீன தமிழில் தெளிவாக எழுத்துப்பெயர்க்கிறது.
- source_word: הַחֻשָׁתִי
  choice: ஊசாத்தியனான
  rationale: இனக்குழு அல்லது ஊர்சார் அடையாளத்தைக் குறிக்கும் எபிரேயப் பெயரடையைத் தமிழில் இயல்பான அடையாள வடிவில் தருகிறது.
- source_word: לַזַּרְחִי
  choice: சேராகியர் குலத்தைச் சேர்ந்தவன்
  rationale: ל இங்கு குலச் சார்பைக் குறிப்பதாகச் சூழல் காட்டுகிறது. பன்மைக் குல அடையாளத்தைத் தமிழில் தெளிவாக வெளிப்படுத்த இவ்வடிவம் தேர்ந்தெடுக்கப்பட்டது; ஒருமை இனப்பெயராகவும் வாசிக்க முடிவதால் அடிக்குறிப்பு தரப்பட்டது.
- source_word: מַחֲלֻקְתּוֹ
  choice: அவனுடைய படைப்பிரிவு
  rationale: இந்த அதிகாரத்தின் இராணுவ-நிர்வாகச் சூழலில் מַחֲלֻקָה என்பது ஒழுங்கமைக்கப்பட்ட படைப்பிரிவைக் குறிக்கிறது.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: இருபத்துநான்காயிரம் பேர்
  rationale: எண்ணிக்கையை நவீன தமிழின் இயல்பான கூட்டெண் வடிவில் தருகிறது; மனிதர்களின் எண்ணிக்கை என்பதைக் காட்ட ‘பேர்’ சேர்க்கப்பட்டது.
