  register: நவீன நிலையான தமிழில், இராணுவ-நிர்வாகச் சூழலைத் தெளிவுபடுத்தும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூல எபிரெயத்தின் சுருக்கத்தால் மிக்லோத்தின் பதவி குறித்து இருக்கும் உண்மையான தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
