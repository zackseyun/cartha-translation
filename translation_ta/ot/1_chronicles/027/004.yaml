  text: וְ/עַ֞ל מַחֲלֹ֣קֶת הַ/חֹ֣דֶשׁ הַ/שֵּׁנִ֗י דּוֹדַ֤י הָ/אֲחוֹחִי֙ וּ/מַ֣חֲלֻקְתּ֔/וֹ וּ/מִקְל֖וֹת הַ/נָּגִ֑יד וְ/עַל֙ מַחֲלֻקְתּ֔/וֹ עֶשְׂרִ֥ים וְ/אַרְבָּעָ֖ה אָֽלֶף׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/004.yaml
  text: Over the division for the second month was Dodai the Ahohite[a], and Mikloth was the leader over his division; and in his division were twenty-four thousand.
translation:
  language: ta
  text: இரண்டாம் மாதத்துக்குரிய படைப்பிரிவுக்குப் பொறுப்பானவர் அகோகியனான தோதாய்[a]; மிக்லோத் அவரது படைப்பிரிவின் தலைவராக இருந்தார். அவரது படைப்பிரிவில் இருபத்துநான்காயிரம் பேர் இருந்தனர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவரது படைப்பிரிவும் தலைவரான மிக்லோத்தும்.” எபிரெயச் சொற்றொடர் சுருக்கமாக உள்ளது. மிக்லோத் தோதாயின் படைப்பிரிவில் இரண்டாம் நிலைத் தலைவராகக் குறிப்பிடப்படுகிறாரா, அல்லது அந்தப் படைப்பிரிவுக்குப் பொறுப்பானவராகக் குறிப்பிடப்படுகிறாரா என்பது தெளிவாக இல்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: מַחֲלֹקֶת
  choice: படைப்பிரிவு
  rationale: மாதந்தோறும் முறைவைத்து சேவை செய்த இராணுவ நிர்வாகப் பிரிவை இச்சூழலில் குறிக்கிறது; பொதுவான ‘பிரிவு’ என்பதைவிட ‘படைப்பிரிவு’ சூழலைத் தெளிவாக்குகிறது.
- source_word: הַחֹדֶשׁ הַשֵּׁנִי
  choice: இரண்டாம் மாதம்
  rationale: மாதாந்திரப் பணிமுறையின் வரிசையைச் சுட்டும் நேரடியான எண்ணுமுறைச் சொற்றொடர்.
- source_word: דּוֹדַי
  choice: தோதாய்
  rationale: இவ்வசனத்தின் மெய்யெழுத்து வடிவத்துக்கு ஏற்ப பெயர் ஒலிபெயர்க்கப்படுகிறது; தொடர்புடைய வேறொரு பெயர் வடிவத்துடன் ஒருமைப்படுத்தப்படவில்லை.
- source_word: הָאֲחוֹחִי
  choice: அகோகியன்
  rationale: குலம் அல்லது ஊர்சார்பைக் குறிக்கும் அடைமொழியை இயல்பான தமிழ்ப் பெயர்ச்சொல் வடிவில் தருகிறது.
- source_word: וּמַחֲלֻקְתּוֹ
  choice: அவரது படைப்பிரிவு
  rationale: முன்னர் வந்த அதே பெயர்ச்சொல்லை மூன்றாம் நபர் ஒருமை உரிமை விகுதியுடன் தொடர்ச்சியாக மொழிபெயர்க்கிறது.
- source_word: וּמִקְלוֹת
  choice: மிக்லோத்
  rationale: எபிரெய தனிப்பெயரின் ஒலிபெயர்ப்பு.
- source_word: הַנָּגִיד
  choice: தலைவர்
  rationale: இச்சொல் தலைவர், ஆளுநர் அல்லது படைத்தலைவர் எனப் பொருள்படலாம்; குறிப்பிட்ட பதவிநிலையை அளவுக்கு மீறி வரையறுக்காமல் பொறுப்பைத் தெரிவிக்கிறது.
- source_word: וְעַל־מַחֲלֻקְתּוֹ
  choice: அவரது படைப்பிரிவின் தலைவராக
  rationale: עַל கூறும் மேற்பார்வை அல்லது அதிகார உறவை இயல்பான தமிழில் வெளிப்படுத்துகிறது; மிக்லோத்தின் துல்லியமான நிலை குறித்த மூலத்தின் சுருக்கத்தை அடிக்குறிப்பில் காக்கிறது.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: இருபத்துநான்காயிரம் பேர்
  rationale: படைப்பிரிவிலுள்ள மனிதர்களின் எண்ணிக்கையை இயல்பான தமிழில் தெளிவாகத் தருகிறது.
