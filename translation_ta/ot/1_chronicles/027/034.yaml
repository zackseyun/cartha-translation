base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/034.yaml
  text: After Ahithophel came Jehoiada son of Benaiah and Abiathar[a]; and Joab was commander of the army for the king.
translation:
  language: ta
  text: அகித்தோப்பேலுக்குப் பிறகு பெனாயாவின் மகன் யோயாதாவும் அபியத்தாரும் இருந்தனர்[a]. அரசனுக்குப் படைத்தளபதியாக யோவாப் இருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொற்சொல்லாக, “அகித்தோப்பேலுக்குப் பிறகு, பெனாயாவின் மகன் யோயாதாவும் அபியத்தாரும்.” எபிரெயத்தில் வினைச்சொல் வெளிப்படையாகக் கூறப்படவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַחֲרֵי
  choice: பிறகு ... ஆலோசகர்களாக இருந்தார்கள்
  rationale: אַחֲרֵי என்பது ‘பிறகு’ என்று பொருள்படும். எபிரெய உரையில் வினைச்சொல் வெளிப்படையாக இல்லை; சூழல் அரச ஆலோசகர்களின் பட்டியல் என்பதால், இயல்பான தமிழுக்காக பணியைச் சுட்டும் வினைத்தொடர் சேர்க்கப்பட்டது, ஆனால் அது அடிக்குறிப்பில் தெளிவுபடுத்தப்பட்டது.
- source_word: אֲחִיתֹפֶל
  choice: அகித்தோப்பேல்
  rationale: தனிப்பெயர்; நவீனத் தமிழ் ஒலிபெயர்ப்பு மரபுக்கு ஏற்ப வழங்கப்பட்டது.
- source_word: יְהוֹיָדָע
  choice: யோயாதா
  rationale: தனிப்பெயர்; எபிரெய உச்சரிப்பை அண்மித்த தமிழ் ஒலிபெயர்ப்பு.
- source_word: בֶּן בְּנָיָהוּ
  choice: பெனாயாவின் மகன்
  rationale: எபிரெய தந்தைவழிப் பெயரடையாளக் கட்டமைப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְ/אֶבְיָתָר
  choice: அபியத்தாரும்
  rationale: இணைப்பிடைச்சொல்லுடன் வரும் தனிப்பெயர்; யோயாதாவுடன் இணையான நபராகத் தொடரமைப்பு காக்கப்பட்டது.
- source_word: וְ/שַׂר צָבָא
  choice: படைத்தளபதியாக இருந்தான்
  rationale: שַׂר צָבָא என்பது படையின் தலைமை அதிகாரியைக் குறிக்கிறது. வினையற்ற எபிரெய வாக்கியத்தை முழுமையான தமிழாக்குவதற்காக ‘இருந்தான்’ சேர்க்கப்பட்டது.
- source_word: לַ/מֶּלֶךְ
  choice: அரசனுடைய
  rationale: לְ இங்கு அரசனுடன் தொடர்புடைய சேவைப் பொறுப்பைக் குறிக்கிறது; ‘அரசனுடைய படைத்தளபதி’ என்பது தமிழில் இயல்பான நிர்வாகச் சொல்லாக்கம்.
- source_word: יוֹאָב
  choice: யோவாப்
  rationale: தனிப்பெயர்; எபிரெய வடிவை அண்மித்த தமிழ் ஒலிபெயர்ப்பு.
theological_decisions:
- issue: யோயாதா மற்றும் அபியத்தாரின் மறைமுகப் பணி
  choice: முந்தைய வசனத்தின் சூழலை அடிப்படையாகக் கொண்டு ‘ஆலோசகர்களாக இருந்தார்கள்’ என்று முதன்மை உரையில் வெளிப்படுத்தப்பட்டது; வினை எபிரெயத்தில் மறைந்திருப்பது அடிக்குறிப்பில் குறிப்பிடப்பட்டது.
  alternative: ‘அகித்தோப்பேலுக்குப் பிறகு, பெனாயாவின் மகன் யோயாதாவும் அபியத்தாரும்’ என்ற வினையற்ற நேரடி வடிவம்.
  rationale: மூலத்தின் இலக்கணத் தெளிவின்மையை மறைக்காமல், சாதாரண தமிழ் வாசகருக்குப் பட்டியலின் பொருளை விளங்கச் செய்யும் சமநிலைத் தீர்வு.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டது. அரச நிர்வாகப் பட்டியலின் சூழல் தெளிவாகத் தெரிய ‘ஆலோசகர்களாக இருந்தார்கள்’ என வெளிப்படுத்தப்பட்டாலும், மூலத்தின் வினையற்ற அமைப்பும் அதன் தெளிவின்மையும் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.
