  yaml_path: translation/ot/1_chronicles/027/019.yaml
  text: for Zebulun, Ishmaiah son of Obadiah; for Naphtali, Jerimoth son of Azriel.
translation:
  language: ta
  text: செபுலோனுக்கு, ஒபதியாவின் மகன் இஸ்மாயா; நப்தலிக்கு, அஸ்ரியேலின் மகன் எரிமோத்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִזְבוּלֻן
  choice: செபுலோனுக்கு
  rationale: முன்னொட்டு ל இந்தக் கோத்திர நிர்வாகப் பட்டியலில் ஒதுக்கீடு அல்லது பிரதிநிதித்துவத்தைக் குறிக்கிறது; தமிழில் ‘செபுலோனுக்கு’ என்பது சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: יִשְׁמַעְיָהוּ
  choice: இஸ்மாயா
  rationale: எபிரேய தனிப்பெயரின் ஒலிவடிவம் நவீனத் தமிழில் வாசிக்க ஏற்றவாறு எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: בֶּן
  choice: மகன்
  rationale: இங்கு בֶּן நேரடியான தந்தை–மகன் உறவைக் காட்டும் அடையாளச் சூத்திரமாக வருகிறது.
- source_word: עֹבַדְיָהוּ
  choice: ஒபதியா
  rationale: எபிரேய தனிப்பெயரின் பரவலாக அறியப்படும் தமிழ் வேதாகம ஒலிவடிவம் பயன்படுத்தப்பட்டது.
- source_word: לְנַפְתָּלִי
  choice: நப்தலிக்கு
  rationale: முன்னொட்டு ל, அந்தக் கோத்திரத்துக்குரிய பொறுப்பு அல்லது பிரதிநிதித்துவத்தைச் சுட்டுகிறது.
- source_word: יְרִימוֹת
  choice: எரிமோத்
  rationale: எபிரேயப் பெயருக்கு நெருக்கமான, தமிழில் இயல்பாக வாசிக்கக்கூடிய எழுத்துப்பெயர்ப்பு.
- source_word: עַזְרִיאֵל
  choice: அஸ்ரியேல்
  rationale: எபிரேயப் பெயரின் ஒலியமைப்பைப் பாதுகாக்கும் தமிழ் எழுத்துப்பெயர்ப்பு.
theological_decisions: []
translation_notes:
  register: நிர்வாகப் பட்டியலின் சுருக்கமான இணை அமைப்பு பாதுகாக்கப்பட்டுள்ளது. மொழிநடை நவீன, தெளிவான, மரியாதைமிக்க தமிழில் உள்ளது; மூலத்தில் இல்லாத ‘கோத்திரம்’ அல்லது ‘அதிகாரி’ போன்ற விளக்கச் சொற்கள் உரைக்குள் சேர்க்கப்படவில்லை.
