translation_notes:
  register: நவீன தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. இரு எபிரேயப் பெயர்ச்சொல் வாக்கியங்களிலும் உள்ள ‘இருந்தார்’ என்ற மறைபொருள் தமிழில் வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது. மரியாதைப் பன்மை வினைமுற்று தனித்தனியாகப் பயன்படுத்தப்பட்டதால் இருவரின் பதவிகளும் தெளிவாக வேறுபடுகின்றன.
