base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/033.yaml
  text: And Ahithophel was counselor to the king[a], and Hushai the Archite was the king’s friend.
translation:
  language: ta
  text: அகித்தோப்பேல் அரசருக்கு ஆலோசகராக இருந்தார்; அர்க்கியனான ஊசாய் அரசரின் நண்பராக[a] இருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “தோழர்” அல்லது “உடனிருப்பவர்”; எபிரேயச் சொல் பொதுவாக ஒரு நண்பரைக் குறிக்கலாம். அரசவைச் சூழலில், அரசரின் நம்பிக்கைக்குரிய அரசவைத் தோழரையும் அது குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲחִיתֹפֶל
  choice: அகித்தோப்பேல்
  rationale: எபிரேயத் தனிப்பெயரின் ஒலியைத் தமிழில் இயல்பாக எழுத்துப்பெயர்த்த வடிவம்.
- source_word: יוֹעֵץ
  choice: ஆலோசகர்
  rationale: அறிவுரை அல்லது ஆலோசனை வழங்குபவரைக் குறிக்கும் சொல்; இங்கு அரசவைச் சூழலுக்கும் இயல்பாகப் பொருந்துகிறது.
- source_word: לַמֶּלֶךְ
  choice: அரசருக்கு
  rationale: ל முன்னிடைச்சொல் இங்கு அரசருடனான பணி அல்லது உறவைக் குறிக்கிறது; தமிழில் ‘அரசருக்கு ஆலோசகர்’ என்பது இயல்பான அமைப்பு.
- source_word: חוּשַׁי
  choice: ஊசாய்
  rationale: எபிரேயத் தனிப்பெயரின் தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: הָאַרְכִּי
  choice: அர்கியனான
  rationale: ஊசாயின் குலம் அல்லது ஊர்சார்பை அடையாளப்படுத்தும் பெயரடை; அதன் வடிவத்தை மொழிபெயர்க்காமல் எழுத்துப்பெயர்க்கிறது.
- source_word: רֵעַ
  choice: நண்பர்
  rationale: இச்சொல்லின் பொதுவான பொருள் ‘நண்பர்’; அரசவைச் சூழலில் நம்பிக்கைக்குரிய உடனிருப்பவரையும் குறிக்கக்கூடும் என்பதால் அந்த விரிவான சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: הַמֶּלֶךְ
  choice: அரசரின்
  rationale: எபிரேயத்தில் வெளிப்படும் உடைமை அல்லது உறவுநிலையை இயல்பான தமிழ் உடைமை வடிவில் தருகிறது.
- source_word: וַ / וְ
  choice: ;
  rationale: இரண்டு இணையான பதவிக் குறிப்புகளையும் தமிழில் தெளிவாக இணைக்க அரைப்புள்ளி பயன்படுத்தப்பட்டுள்ளது; எபிரேய இணைப்பின் பட்டியல் தன்மை பாதுகாக்கப்படுகிறது.
