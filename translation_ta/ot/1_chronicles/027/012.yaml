base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/012.yaml
  text: 'The ninth, for the ninth month: Abiezer the Anathothite, from Benjamin; and over his division were twenty-four thousand.'
translation:
  language: ta
  text: ஒன்பதாம் மாதத்துக்கான ஒன்பதாவது தலைவர் ஆனதோத்தைச் சேர்ந்த அபியேசர்; அவர் பென்யமீன் கோத்திரத்தைச் சேர்ந்தவர். அவருடைய படைப்பிரிவில் 24,000 பேர் இருந்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַתְּשִׁיעִי לַחֹדֶשׁ הַתְּשִׁיעִי
  choice: ஒன்பதாம் மாதத்துக்கான ஒன்பதாவது தலைவர்
  rationale: பட்டியலின் சூழலில் எபிரெயச் சொற்றொடரில் விடுபட்டுள்ள ‘தலைவர்’ என்பதைத் தமிழில் இயல்பாகவும் பொருள் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: הָעַנְּתֹתִי
  choice: ஆனதோத்தைச் சேர்ந்த
  rationale: இது ஆனதோத் ஊரைச் சேர்ந்தவரைக் குறிக்கும் குடிப்பெயர்; நவீனத் தமிழில் இயல்பாக இடத் தொடர்பாக மொழிபெயர்க்கப்பட்டது.
- source_word: ל/בנימיני
  choice: பென்யமீன் கோத்திரத்தைச் சேர்ந்தவர்
  rationale: WLC வடிவம் சிக்கலானதாக இருந்தாலும் மசோரா வாசிப்பும் சூழலும் பென்யமீன் சார்பைச் சுட்டுகின்றன; ‘from Benjamin’ என்பதன் பொருளைத் தமிழில் தெளிவுபடுத்துகிறது.
- source_word: מַחֲלֻקְתּוֹ
  choice: அவருடைய படைப்பிரிவில்
  rationale: இராணுவப் பட்டியல் சூழலில் ‘பிரிவு’ என்பது படைப்பிரிவைக் குறிக்கிறது; ‘அதன் மேல்’ என்ற எபிரெய நடை தமிழில் உறுப்பினர் எண்ணிக்கையாக இயல்பாக்கப்பட்டது.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: 24,000 பேர்
  rationale: மக்களின் எண்ணிக்கையைக் குறிக்கும் என்பதால் ‘பேர்’ சேர்க்கப்பட்டு எண் நவீன வாசிப்புக்கு ஏற்ற இலக்க வடிவில் தரப்பட்டது.
