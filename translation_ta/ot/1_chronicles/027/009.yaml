translation_notes:
  register: நவீன நிலையான தமிழில், வரலாற்று-நிர்வாகப் பட்டியலுக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய மூலத்தின் சுருக்கமான அமைப்பை மதித்தபடியே, தமிழில் தனியாகத் தெளிவில்லாத வரிசை எண்ணுக்கு ‘தலைவர்’ சேர்க்கப்பட்டுள்ளது.
