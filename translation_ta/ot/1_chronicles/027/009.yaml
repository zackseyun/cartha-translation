source:
  edition: WLC
  text: הַ/שִּׁשִּׁי֙ לַ/חֹ֣דֶשׁ הַ/שִּׁשִּׁ֔י עִירָ֥א בֶן עִקֵּ֖שׁ הַ/תְּקוֹעִ֑י וְ/עַל֙ מַחֲלֻקְתּ֔/וֹ עֶשְׂרִ֥ים וְ/אַרְבָּעָ֖ה אָֽלֶף־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/009.yaml
  text: 'The sixth, for the sixth month: Ira son of Ikkesh the Tekoite; and over his division were twenty-four thousand.'
translation:
  language: ta
  text: 'ஆறாவது மாதத்துக்கான ஆறாவது தலைவர்: தெக்கோவாவைச் சேர்ந்த இக்கேசின் மகன் ஈரா. அவருடைய படைப்பிரிவில் இருபத்து நான்காயிரம் பேர் இருந்தனர்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַשִּׁשִּׁי
  choice: ஆறாவது தலைவர்
  rationale: பட்டியல் சூழலில் வரிசை எண்ணாக மட்டும் நிற்கும் எபிரெயச் சொல், அந்த மாதத்துக்குரிய படைத்தலைவரைக் குறிக்கிறது. தமிழில் பொருள் தெளிவாக இருக்க ‘தலைவர்’ வெளிப்படையாகச் சேர்க்கப்பட்டது.
- source_word: לַחֹדֶשׁ הַשִּׁשִּׁי
  choice: ஆறாவது மாதத்துக்கான
  rationale: ל முன்னொட்டு இங்கு ஆறாவது மாதத்திற்குரிய பணிமுறை நியமனத்தைக் குறிக்கிறது; ‘மாதத்துக்கான’ என்பது இயல்பான நிர்வாகத் தமிழ்.
- source_word: עִירָא
  choice: ஈரா
  rationale: எபிரெயத் தனிப்பெயரின் ஒலிப்புக்கு அண்மையாகத் தமிழில் எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: בֶן עִקֵּשׁ
  choice: இக்கேசின் மகன்
  rationale: எபிரெய உறவுமுறைக் கட்டமைப்பு இயல்பான தமிழில் நேரடியாக மொழிபெயர்க்கப்பட்டது.
- source_word: הַתְּקוֹעִי
  choice: தெக்கோவாவைச் சேர்ந்த
  rationale: இந்த இன/இட அடைமொழி தெக்கோவா ஊரைச் சேர்ந்த ஒருவரைக் குறிக்கிறது; தமிழில் புரியும் வகையில் ஊருடனான தொடர்பு வெளிப்படுத்தப்பட்டது.
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: அவருடைய படைப்பிரிவில் ... பேர் இருந்தனர்
  rationale: מַחֲלֻקָה இவ்வதிகாரத்தில் சுழற்சி முறையில் பணியாற்றும் படைப்பிரிவைக் குறிக்கிறது. עַל உடன் வரும் எண்ணிக்கை அவர் பொறுப்பிலிருந்த பிரிவின் ஆள்பலத்தைக் குறிப்பிடுகிறது.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: இருபத்து நான்காயிரம்
  rationale: எண்ணிக்கை நவீனத் தமிழின் வழக்கமான வடிவில் கொடுக்கப்பட்டது.
