base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/010.yaml
  text: 'The seventh[a], for the seventh month: Helez the Pelonite, from the sons of Ephraim; and over his division were twenty-four thousand.'
translation:
  language: ta
  text: ஏழாம் மாதத்திற்கான ஏழாவது படைத்தலைவர், எப்ராயீமின் மக்களில் ஒருவனான பெலோனியனான[a] ஹெலேஸ். அவனுடைய படைப்பிரிவுக்குக் கீழ் இருபத்துநான்காயிரம் பேர் இருந்தனர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பல்தியன்” என்றும் வாசிக்கலாம்; ஹெலேஸின் குல அடையாளத்தைப் பற்றிய வேறொரு பாரம்பரியத்தை இது பிரதிபலிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: הַשְּׁבִיעִי
  choice: ஏழாவது படைத்தலைவர்
  rationale: இந்தப் படைத்துறைப் பட்டியலில் எண் வரிசை படைத்தலைவர்களைக் குறிக்கிறது. எபிரெய மொழியில் விடுபட்டுள்ள பெயர்ச்சொல், தமிழில் பொருள் தெளிவாகவும் இயல்பாகவும் இருக்கச் சூழலிலிருந்து நிரப்பப்பட்டது.
- source_word: לַחֹדֶשׁ הַשְּׁבִיעִי
  choice: ஏழாம் மாதத்திற்கான
  rationale: ל முன்னொட்டு இவ்வதிகாரத்தில் மாத வாரியான பணிநியமனத்தைக் குறிக்கிறது; இந்தத் தமிழ் வடிவம் அந்த நிர்வாகப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: חֶלֶץ
  choice: ஹெலேஸ்
  rationale: எபிரெய தனிப்பெயரான Ḥeleṣ என்பதன் ஒலியை நவீன தமிழில் அண்மையாக எழுத்துப்பெயர்த்த வடிவம்.
- source_word: הַפְּלוֹנִי
  choice: பெலோனியன்
  rationale: மசோரா மூலத்தின் மெய்யெழுத்து வடிவத்துக்கு ஏற்ப குலம் அல்லது ஊர்சார் அடையாளப் பெயராக எழுத்துப்பெயர்க்கப்பட்டது; வேறொரு பாரம்பரிய அடையாளம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: מִן בְּנֵי אֶפְרָיִם
  choice: எப்ராயீமின் மக்களில் ஒருவனான
  rationale: ‘எப்ராயீமின் மக்களிலிருந்து’ என்ற எபிரெயக் குலவழக்கைத் தெளிவான இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: அவனுடைய படைப்பிரிவில்
  rationale: מַחֲלֻקָה இங்கு மாத வாரியாகப் பணிபுரியும் படைப்பிரிவைக் குறிக்கிறது. עַל அதிகாரத் தொடர்பைக் கொண்டிருந்தாலும், அடுத்து வரும் எண்ணிக்கையுடன் தமிழில் இயல்பாக இணைய ‘படைப்பிரிவில்’ என வழங்கப்பட்டது.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: இருபத்துநான்காயிரம் பேர்
  rationale: எண்ணிக்கையைச் சொற்களால் வழங்கி, இது மனிதர்களின் எண்ணிக்கை என்பதைத் தமிழில் இயல்பாகத் தெளிவுபடுத்த ‘பேர்’ சேர்க்கப்பட்டது.
