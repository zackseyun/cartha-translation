  text: הָ/עֲשִׂירִי֙ לַ/חֹ֣דֶשׁ הָ/עֲשִׂירִ֔י מַהְרַ֥י הַ/נְּטֽוֹפָתִ֖י לַ/זַּרְחִ֑י וְ/עַל֙ מַֽחֲלֻקְתּ֔/וֹ עֶשְׂרִ֥ים וְ/אַרְבָּעָ֖ה אָֽלֶף׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/013.yaml
  text: 'The tenth[a], for the tenth month: Mahrai the Netophathite, of the Zerahites; and over his division were twenty-four thousand.'
translation:
  language: ta
  text: பத்தாம் மாதத்திற்கான பத்தாவது பொறுப்பாளர் நெத்தோபாவைச் சேர்ந்த சேராகியர் குலத்தைச் சேர்ந்த மகராய்[a]; அவருடைய படைப்பிரிவில் 24,000 பேர் இருந்தனர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சேராகியன்.”
    reason: לַזַּרְחִי என்பது சேராகியர் குலத்தைச் சேர்ந்தவர் என்ற கூட்டு உறவையோ, ‘சேராகியன்’ என்ற ஒருமை அடைமொழியையோ வெளிப்படுத்தலாம்.
lexical_decisions:
- source_word: הָעֲשִׂירִי
  choice: பத்தாவது படைப்பிரிவு
  rationale: வரிசைப் பட்டியலின் சூழலில் பெயர்ச்சொல்லாகப் பயன்படும் வரிசை எண்ணுக்குள் ‘படைப்பிரிவு’ என்பது மறைந்துள்ளது; தமிழில் பொருள் தெளிவாக இருக்க அதை வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: לַחֹדֶשׁ הָעֲשִׂירִי
  choice: பத்தாம் மாதத்திற்கான
  rationale: இந்த அதிகாரத்தில் ל முன்னிடைச்சொல் மாதாந்திரப் பணிமுறை ஒதுக்கீட்டைக் குறிக்கிறது; இயல்பான தமிழில் அதன் தொடர்பைச் சுருக்கமாகத் தெரிவிக்கிறது.
- source_word: מַהְרַי
  choice: மகராய்
  rationale: எபிரெய தனிப்பெயரின் ஒலிப்பைத் தமிழில் அண்மையாக எழுத்துப்பெயர்த்த வடிவம்.
- source_word: הַנְּטוֹפָתִי
  choice: நெத்தோபாவைச் சேர்ந்த
  rationale: இந்த இன/இட அடைமொழி நெத்தோபா என்ற ஊரைச் சேர்ந்தவர் என்பதைக் குறிக்கிறது; தமிழில் ஊர்த் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לַזַּרְחִי
  choice: சேராகியர் குலத்து
  rationale: ஒருமை வடிவிலுள்ள இனக்குழு அடைமொழி இங்கு சேராகின் வழிவந்த குலத்துடனான தொடர்பைக் குறிக்கிறது.
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: அவருடைய படைப்பிரிவில் ... பேர் இருந்தனர்
  rationale: மַחֲלֻקָה இந்த இராணுவப் பட்டியலில் பணிமுறைப் படைப்பிரிவைக் குறிக்கிறது; ஆட்களின் எண்ணிக்கையைத் தமிழில் இயல்பாக இணைக்க இவ்வாறு அமைக்கப்பட்டுள்ளது.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: 24,000 பேர்
  rationale: எண்ணிக்கையை நவீன தமிழ் நடைமுறைக்கு ஏற்ப இலக்கங்களால் கொடுத்து, அது ஆட்களைக் குறிக்கிறது என்பதை ‘பேர்’ தெளிவாக்குகிறது.
