translation_notes:
  register: நவீன தரநிலைத் தமிழில் இயல்பான, கண்ணியமான பட்டியல் நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய உரையில் மறைந்திருக்கும் படைப்பிரிவு மற்றும் பொறுப்பாளர் தொடர்பு, அதிகாரத்தின் இராணுவப் பட்டியல் சூழலை அடிப்படையாகக் கொண்டு தெளிவாக்கப்பட்டுள்ளது; குல அடைமொழியின் மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
