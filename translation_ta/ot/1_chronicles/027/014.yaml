base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/014.yaml
  text: For the twelfth month[a], Benaiah the Pirathonite, from the sons of Ephraim; and over his division were twenty-four thousand.
translation:
  language: ta
  text: பதினொன்றாவது மாதத்துக்கான பதினொன்றாவது படைப்பிரிவின் தலைவர் பிராத்தோன் ஊரைச் சேர்ந்த பெனாயா; அவர் எப்பிராயீமின் சந்ததியினரில் ஒருவர்[a]. அவருடைய படைப்பிரிவில் இருபத்துநான்காயிரம் பேர் இருந்தனர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேர்ச்சொல்லாக, “எப்பிராயீமின் மக்களிலிருந்து”; இது எப்பிராயீம் கோத்திரத்தைச் சேர்ந்த மரபுவழித் தொடர்பைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַשְׁתֵּי עָשָׂר לְעַשְׁתֵּי עָשָׂר הַחֹדֶשׁ
  choice: பதினொன்றாவது மாதத்துக்கான பதினொன்றாவது படைப்பிரிவு
  rationale: எபிரெயச் சொற்றொடரில் עַשְׁתֵּי עָשָׂר என்பது ‘பதினொன்று’ என்பதைக் குறிக்கிறது; ஆகவே ஆங்கில ஆலோசனைப் பிரதியிலுள்ள ‘twelfth’ என்பதற்குப் பதிலாக மூலமொழிக்கேற்ப ‘பதினொன்றாவது’ என மொழிபெயர்க்கப்பட்டது. அதிகாரத்தின் மீளும் நிர்வாக அமைப்பு, முதல் எண்ணிக்கை படைப்பிரிவைக் குறிக்கிறது என்பதைத் தெளிவாக்குகிறது.
- source_word: בְּנָיָה
  choice: பெனாயா
  rationale: எபிரெயத் தனிப்பெயரின் ஒலியைத் தமிழில் இயல்பாகப் பிரதிபலிக்கும் பெயர்ப்பு.
- source_word: הַפִּרְעָתוֹנִי
  choice: பிராத்தோன் ஊரைச் சேர்ந்தவர்
  rationale: இது பிராத்தோன் என்ற இடத்தோடு உள்ள தொடர்பைக் குறிக்கும் குடிப்பெயர்; தமிழில் இயல்பாகப் புரியுமாறு இடத்தைச் சேர்ந்தவர் என விரிக்கப்பட்டது.
- source_word: מִן בְּנֵי אֶפְרָיִם
  choice: எப்பிராயீமின் வழிவந்தவர்களில் ஒருவர்
  rationale: சொல்லுக்கு சொல் ‘எப்பிராயீமின் மக்களில் ஒருவர்’ என்றாலும், இங்கு உடனடி தந்தை–மகன் உறவல்லாமல் கோத்திர வழிவருதலே குறிக்கப்படுகிறது. அந்தப் பொருளைத் தெளிவாகவும் மூலத்தின் மரபுவழித் தொடர்பைத் தக்கவைத்தும் வழங்குகிறது.
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: அவருடைய படைப்பிரிவில் ... பேர் இருந்தனர்
  rationale: מַחֲלֻקָה இவ்வதிகாரச் சூழலில் மாதந்தோறும் பணியாற்றிய படைப்பிரிவைக் குறிக்கிறது. எபிரெய நிர்வாகக் கருத்தை இயல்பான தமிழில் வழங்குகிறது.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: 24,000 பேர்
  rationale: எண்ணிக்கையைத் தெளிவாகக் கொடுத்து, அது படைப்பிரிவிலுள்ள ஆட்களின் எண்ணிக்கை என்பதை ‘பேர்’ மூலம் வெளிப்படுத்துகிறது.
