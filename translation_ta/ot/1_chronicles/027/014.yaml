  register: நவீனத் தரத் தமிழில், வரலாற்று நிர்வாகப் பட்டியலுக்கேற்ற சுருக்கமான, கண்ணியமான நடை பயன்படுத்தப்பட்டது. மூல எபிரெயத்தில் இருமுறை வரும் ‘பதினொன்றாவது’ காக்கப்பட்டு, சூழலால் உணரப்படும் ‘படைப்பிரிவு’ மற்றும் ‘தலைவர்’ வெளிப்படையாகச் சொல்லப்பட்டுள்ளன.
