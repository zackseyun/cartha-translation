base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/032.yaml
  text: Jonathan[a], David’s uncle, was a counselor, a man of understanding, and a scribe[b]; and Jehiel son of Hachmoni was with the king’s sons.
translation:
  language: ta
  text: தாவீதின் உறவினரான[a] யோனத்தான் ஆலோசகராகவும், புரிந்துணர்வுள்ள மனிதராகவும், எழுத்தராகவும் இருந்தார். ஹக்மோனியின் மகன் யெகியேல் அரசனின் மகன்களுடன்[b] இருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தாவீதின் மாமன்.” எபிரெயச் சொல் மாமனையோ பிற நெருங்கிய உறவினரையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயில் சொல்லர்த்தமாக, “அரசனின் மகன்களுடன் இருந்தார்.” அவர் அவர்களுக்குப் பணியாற்றினார் அல்லது அவர்களைக் கண்காணித்தார் என்று சிலர் புரிந்துகொள்கின்றனர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: דּוֹד
  choice: மாமன்
  rationale: இந்த அரசவைச் சூழலில் இச்சொல் தாவீதுடனான குடும்ப உறவைக் குறிப்பதாக இயல்பாகப் புரிகிறது. தமிழில் உறவுமுறையை அளவுக்கு மீறித் துல்லியப்படுத்தாமல் ‘மாமன்’ என வழங்கப்பட்டுள்ளது.
- source_word: יוֹעֵץ
  choice: ஆலோசகர்
  rationale: அரசவையில் அதிகாரப்பூர்வமாக ஆலோசனை வழங்குபவரைக் குறிக்கும் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אִישׁ מֵבִין
  choice: விவேகமுள்ளவர்
  rationale: புரிந்துணரும் திறனும் பகுத்தறிவும் உடையவர் என்ற பாராட்டை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: סוֹפֵר
  choice: எழுத்தர்
  rationale: எழுத்துப் பணியையும் அரசவை நிர்வாகப் பணியையும் உள்ளடக்கக்கூடிய சொல்லாக இருந்து, ‘செயலர்’ என்று பொறுப்பை அளவுக்கு மீறிக் குறிப்பதைத் தவிர்க்கிறது.
- source_word: עִם
  choice: உடன் இருந்தார்
  rationale: எபிரெயச் சொல் நேரடியாக ‘உடன்’ என்று மட்டுமே கூறுகிறது; கண்காணிப்பு அல்லது பொறுப்பு என்ற கருத்தை உரைக்குள் சேர்க்காமல் மூலத்தின் கட்டுப்பாட்டைப் பாதுகாக்கிறது.
- source_word: בְּנֵי הַמֶּלֶךְ
  choice: அரசனின் மகன்கள்
  rationale: எபிரெய மூலத்தில் ‘அரசனின் மகன்கள்’ என்று வெளிப்படையாக இருப்பதால் அதையே பாலினத் துல்லியத்துடன் தருகிறது.
- source_word: חַכְמוֹנִי
  choice: அக்மோனி
  rationale: எபிரெயப் பெயரின் ஒலியைத் தமிழ் வேதாகமப் பெயரிடும் மரபுக்கு ஏற்றவாறு எழுத்துப்பெயர்க்கிறது.
