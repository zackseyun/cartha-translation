translation_notes:
  register: நவீன நிலையான தமிழில், அரசவைச் சூழலுக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தில் வெளிப்படையாகக் கூறப்படாத யெகியேலின் நிர்வாகப் பொறுப்பு உரையில் சேர்க்கப்படவில்லை; அதன் சாத்தியம் அடிக்குறிப்பில் மட்டும் தரப்பட்டுள்ளது.
