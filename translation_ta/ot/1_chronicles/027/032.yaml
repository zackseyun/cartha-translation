revisions:
- from: தாவீதின் மாமனான[a] யோனத்தான் ஆலோசகராகவும், விவேகமுள்ளவராகவும், எழுத்தராகவும் இருந்தார். அக்மோனியின் மகன் யெகியேல் அரசனின் மகன்களுடன்[b] இருந்தார்.
  to: தாவீதின் உறவினரான[a] யோனத்தான் ஆலோசகராகவும், புரிந்துணர்வுள்ள மனிதராகவும், எழுத்தராகவும் இருந்தார். ஹக்மோனியின் மகன் யெகியேல் அரசனின் மகன்களுடன்[b] இருந்தார்.
  rationale: The revision retains the source’s court offices, masculine reference to the king’s sons, and noncommittal statement that Jehiel was 'with' them. It replaces an overly specific Tamil kinship term with a source-compatible broader term, preserves 'uncle' as a footnoted alternative, and adjusts the transliteration of Hachmoni to reflect the Hebrew initial consonant.
