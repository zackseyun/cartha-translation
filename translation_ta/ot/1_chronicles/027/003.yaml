  text: מִן בְּנֵי פֶ֗רֶץ הָ/רֹ֛אשׁ לְ/כָל שָׂרֵ֥י הַ/צְּבָא֖וֹת לַ/חֹ֥דֶשׁ הָ/רִאשֽׁוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/003.yaml
  text: From the sons of Perez[b][a], the chief over all the commanders of the divisions for the first month.
translation:
  language: ta
  text: பேரேசின் வம்சத்திலிருந்து வந்த அவன்,[a] முதலாம் மாதத்திற்கான அனைத்துப் படைப்பிரிவுத் தலைவர்கள்மேல் தலைவனாக இருந்தான்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பேரேசின் மகன்களிலிருந்து.” எபிரெயத்தில் சொல்லெழுத்தாக “பேரேசின் மகன்களிலிருந்து” என்று உள்ளது; வம்சவரலாற்றுச் சூழலில் இது பேரேசின் வம்சத்தாரைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “படைப்பிரிவுகள்” என்பதற்கான எபிரெயச் சொல் “படைகள்” அல்லது “சேனைகள்” என்றும் மொழிபெயர்க்கப்படலாம். இந்த அதிகாரத்தில் அது மாதந்தோறும் பணியாற்றிய ஒழுங்கமைக்கப்பட்ட படைப்பிரிவுகளைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן בְּנֵי פֶרֶץ
  choice: பேரேசின் மகன்களில் ஒருவனான
  rationale: מִן வம்சத் தோற்றத்தைக் குறிக்கிறது; בְּנֵי פֶרֶץ என்பது சொல்லெழுத்தாக ‘பேரேசின் மகன்கள்’ என்றாலும், இங்கு அவரது வம்சத்தாரைக் குறிக்கும் மரபுவழிச் சொற்றொடர். முற்றுப்பெறாத எபிரெய வாக்கியத்தைத் தமிழில் இயல்பாக்க ‘ஒருவனான அவன்’ சேர்க்கப்பட்டது; முந்தைய வசனத்தில் குறிப்பிடப்பட்ட யஷொபெயாமையே இது சுட்டுகிறது.
- source_word: הָרֹאשׁ
  choice: தலைவனாக இருந்தான்
  rationale: רֹאשׁ இங்கு உயர்ந்த அதிகாரமுள்ள தலைவரைக் குறிக்கும் பதவிப்பெயர். தமிழ் வாக்கியம் இயல்பாகவும் முழுமையாகவும் இருக்க ‘இருந்தான்’ சேர்க்கப்பட்டது.
- source_word: לְכָל שָׂרֵי הַצְּבָאוֹת
  choice: அனைத்துப் படைப்பிரிவுகளின் தலைவர்களுக்கும்
  rationale: שָׂרֵי என்பது அதிகாரிகள் அல்லது தலைவர்கள்; צְבָאוֹת பொதுவாகப் படைகள் எனப் பொருள்படும். இவ்வதிகாரத்தின் மாதாந்திரப் பணி அமைப்பில் ‘படைப்பிரிவுகள்’ சூழலுக்கு ஏற்றது. לְ இங்கு மேலதிகார உறவை வெளிப்படுத்துகிறது.
- source_word: לַחֹדֶשׁ הָרִאשׁוֹן
  choice: முதலாம் மாதத்துக்குரிய
  rationale: இந்தச் சொற்றொடர் முதலாம் மாதத்திற்கான படைச் சுழற்சி அல்லது பணிக்காலத்தை அடையாளப்படுத்துகிறது; ‘முதலாம் மாதத்துக்குரிய’ என்பது அந்தத் தொடர்பைத் தமிழில் தெளிவாகத் தருகிறது.
