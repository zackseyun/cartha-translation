translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையானதும் சாதாரண வாசகர்களுக்குப் புரியக்கூடியதுமான நடை பயன்படுத்தப்பட்டது. மூல எபிரெயம் முந்தைய வசனத்தைத் தொடர்ந்து வரும் பெயரற்ற துண்டுச் சொற்றொடராக இருப்பதால், தமிழில் பொருள் முழுமை பெற ‘ஒருவனான அவன் ... இருந்தான்’ என வெளிப்படுத்தப்பட்டது. ‘மகன்கள்/வம்சத்தார்’ மற்றும் ‘படைகள்/படைப்பிரிவுகள்’ என்ற மூலத்தின் பொருள் விரிவுகள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
