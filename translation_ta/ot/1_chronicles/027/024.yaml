source:
  edition: WLC
  text: יוֹאָ֨ב בֶּן צְרוּיָ֜ה הֵחֵ֤ל לִ/מְנוֹת֙ וְ/לֹ֣א כִלָּ֔ה וַ/יְהִ֥י בָ/זֹ֛את קֶ֖צֶף עַל יִשְׂרָאֵ֑ל וְ/לֹ֤א עָלָה֙ הַ/מִּסְפָּ֔ר בְּ/מִסְפַּ֥ר דִּבְרֵֽי הַ/יָּמִ֖ים לַ/מֶּ֥לֶךְ דָּוִֽיד־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/024.yaml
  text: Joab son of Zeruiah began to count[a], but he did not finish; and because of this wrath came upon Israel[b]. And the number was not entered in the account of the chronicles of King David.
translation:
  language: ta
  text: செருயாவின் மகன் யோவாப் மக்களை எண்ணத் தொடங்கினார்; ஆனால் அதை முடிக்கவில்லை. இதனால் இஸ்ரவேலின்மேல் கடுங்கோபம் வந்தது. அந்த எண்ணிக்கை தாவீது அரசரின் நாளேட்டுப் பதிவில் சேர்க்கப்படவில்லை[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நாளேட்டுப் பதிவு’ என்பது தாவீது அரசருடன் தொடர்புடைய அரசவை ஆண்டுக் குறிப்புகள் அல்லது அதிகாரபூர்வ வரலாற்றுப் பதிவுகளைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: הֵחֵל לִמְנוֹת
  choice: மக்களை எண்ணத் தொடங்கினார்
  rationale: החל + מנה என்பது ‘எண்ணத் தொடங்கு’ என்று பொருள்படும். சூழலில் கணக்கிடப்பட்டது மக்களே என்பதால், தமிழில் இயல்பான தெளிவுக்காக ‘மக்களை’ சேர்க்கப்பட்டுள்ளது; ‘மக்கள்தொகைக் கணக்கெடுப்பு’ என்ற விரிவான சொல்லைத் திணிக்கவில்லை.
- source_word: וְלֹא כִלָּה
  choice: ஆனால் அதை முடிக்கவில்லை
  rationale: כלה இங்கு தொடங்கிய எண்ணும் பணியை நிறைவு செய்தல் அல்லது முடித்தல் எனப் பொருள்படும். ‘அதை’ என்பது தமிழில் தொடர்பைத் தெளிவாக்குகிறது.
- source_word: וַיְהִי בָזֹאת קֶצֶף עַל יִשְׂרָאֵל
  choice: இதனால் இஸ்ரவேலின்மேல் கடுங்கோபம் வந்தது
  rationale: בזאת காரணத் தொடர்பை உணர்த்துகிறது; קצף என்பது தீவிரமான கோபம் அல்லது சினத்தைக் குறிக்கிறது. எபிரெயத்தில் கோபத்தின் ஆற்றுநர் வெளிப்படையாகக் குறிப்பிடப்படாததால் தமிழிலும் குறிப்பிடப்படவில்லை.
- source_word: הַמִּסְפָּר
  choice: அந்த எண்ணிக்கை
  rationale: முன்பு செய்யப்பட்ட எண்ணுதலின் விளைவான மொத்த எண்ணைச் சுட்டுவதால் ‘அந்த எண்ணிக்கை’ நேரடியும் இயல்பானதும் ஆகும்.
- source_word: וְלֹא עָלָה
  choice: சேர்க்கப்படவில்லை
  rationale: עלה என்பதன் நேர்ப்பொருள் ‘மேலே போதல்’; இங்கு அதிகாரபூர்வ பதிவில் இடம்பெறுதல் என்ற நிர்வாகச் சொல்லாட்சியாக வருகிறது. தமிழில் ‘சேர்க்கப்படவில்லை’ இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּמִסְפַּר דִּבְרֵי הַיָּמִים לַמֶּלֶךְ דָּוִיד
  choice: தாவீது அரசரின் நாளேடுகளின் பதிவில்
  rationale: דברי הימים என்பது அரசவையின் நிகழ்வுப் பதிவுகள் அல்லது நாளேடுகளைக் குறிக்கிறது; מספר இங்கு பதிவு அல்லது கணக்குச் சுவடியைக் குறிக்கும். לַמֶּלֶךְ דָּוִיד உறவு/உடைமையை இயல்பாக ‘தாவீது அரசரின்’ என வழங்குகிறது.
theological_decisions:
- issue: கடுங்கோபத்தின் மூலத்தை வெளிப்படையாகக் கடவுள் என்று அடையாளப்படுத்த வேண்டுமா?
  choice: ஆற்றுநரை மறைமுகமாகவே வைத்து, ‘இஸ்ரவேலின்மேல் கடுங்கோபம் வந்தது’ என மொழிபெயர்த்தல்
  alternative: ‘ஆண்டவரின் கடுங்கோபம் இஸ்ரவேலின்மேல் வந்தது’ அல்லது ‘கடவுள் இஸ்ரவேல்மேல் கோபமடைந்தார்’
  rationale: விரிந்த கதைச்சூழல் இறைத் தீர்ப்பை வலுவாக உணர்த்தினாலும், இவ்வசனத்தின் எபிரெயச் சொற்றொடர் கடவுளை வெளிப்படையான எழுவாயாகக் குறிப்பிடவில்லை. ஆகவே மூலத்தின் மறைமுகத்தன்மையும் இறையியல் நெருக்கடியும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய இணைப்புகளின் தொடர்ச்சியைப் பேணியபோதும் தமிழின் இயல்பான வாக்கிய ஓட்டத்திற்காக தனித்த வாக்கியங்கள் பயன்படுத்தப்பட்டன. ‘கடுங்கோபம்’ என்பதன் ஆற்றுநர் மூலத்தைப் போலவே வெளிப்படுத்தப்படாமல் விடப்பட்டுள்ளது.
