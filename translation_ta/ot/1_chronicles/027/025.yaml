  text: וְ/עַל֙ אֹצְר֣וֹת הַ/מֶּ֔לֶךְ עַזְמָ֖וֶת בֶּן עֲדִיאֵ֑ל וְ/עַ֣ל הָֽ/אֹצָר֡וֹת בַּ/שָּׂדֶ֞ה בֶּ/עָרִ֤ים וּ/בַ/כְּפָרִים֙ וּ/בַ/מִּגְדָּל֔וֹת יְהוֹנָתָ֖ן בֶּן עֻזִּיָּֽהוּ־ס־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/025.yaml
  text: Over the king’s treasuries was Azmaveth son of Adiel[a], and over the treasuries in the countryside, in the cities, in the villages, and in the towers[b], was Jehonathan son of Uzziah.
translation:
  language: ta
  text: ராஜாவின் கருவூலங்களுக்குப் பொறுப்பாக அதியேலின் மகன் அஸ்மாவேத் இருந்தான். வயல்வெளிப் பகுதிகளிலும்[a] நகரங்களிலும் கிராமங்களிலும் கோபுரங்களிலும் இருந்த கருவூலங்களுக்குப் பொறுப்பாக உசியாவின் மகன் யெஹோனத்தான்[b] இருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், ‘வயலில்.’ இங்குள்ள எபிரெய ஒருமைச் சொல், நகரங்கள், கிராமங்கள், கோபுரங்கள் ஆகியவற்றிலிருந்து வேறுபட்ட ஊரகப் பகுதிகளைத் தொகுப்பாகக் குறிப்பதாகத் தெரிகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘யெஹோனத்தான்’ என்பது இங்குள்ள முழுமையான எபிரெயப் பெயர்வடிவத்தைப் பிரதிபலிக்கிறது; இதன் குறுகிய வடிவம் ‘யோனத்தான்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: …க்குப் பொறுப்பாக … இருந்தான்
  rationale: இந்த நிர்வாகப் பட்டியலில் עַל மேற்பார்வை அல்லது பொறுப்பைக் குறிக்கிறது. தமிழில் இயல்பாகவும் தெளிவாகவும் அதிகாரப் பொறுப்பைச் சொல்கிறது.
- source_word: אֹצְרוֹת / הָאֹצָרוֹת
  choice: கருவூலங்கள் / கருவூலங்கள்
  rationale: אֹצָר என்பது கருவூலம், களஞ்சியம் அல்லது சேமிக்கப்பட்ட பொருட்கள் எனப் பொருள்படலாம். அரச மற்றும் பிராந்திய நிர்வாகச் சூழலில் ‘கருவூலங்கள்’ பொருத்தமானது; இரு இடங்களிலும் ஒரே சொல்லைப் பயன்படுத்துவது மூலத்தின் சொல் ஒற்றுமையைப் பேணுகிறது.
- source_word: הַמֶּלֶךְ
  choice: ராஜாவின்
  rationale: אֹצְרוֹת הַמֶּלֶךְ என்ற இணைப்பை இயல்பான நவீன தமிழில் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: עַזְמָוֶת
  choice: அஸ்மாவேத்
  rationale: எபிரெயப் பெயரின் ஒலிவடிவத்தைத் தமிழில் அண்மையாகப் பேணும் எழுத்துப்பெயர்ப்பு.
- source_word: בֶּן עֲדִיאֵל
  choice: அதியேலின் மகன்
  rationale: வம்ச அடையாளத்தில் בֶּן என்பதன் நேரடியான, இயல்பான தமிழ் வடிவம்.
- source_word: בַּשָּׂדֶה
  choice: வயல்வெளிப் பகுதிகளில்
  rationale: மூலத்தில் ஒருமை ‘வயல்/வெளி’ என்றாலும், நகரங்கள், கிராமங்கள், கோபுரங்கள் ஆகியவற்றோடு வேறுபடுத்தப்பட்ட ஊரகப் பகுதிகளைத் தொகுப்பாகக் குறிப்பதாக இங்கு தோன்றுகிறது.
- source_word: בֶּעָרִים
  choice: நகரங்களில்
  rationale: கருவூலங்கள் அமைந்த இடங்களின் பட்டியலில் உள்ள நேரடியான இடவியல் பொருள்.
- source_word: וּבַכְּפָרִים
  choice: கிராமங்களிலும்
  rationale: כְּפָרִים என்பதற்கான தெளிவான, பொதுவாகப் புரியும் நவீன தமிழ் இணை.
- source_word: וּבַמִּגְדָּלוֹת
  choice: கோபுரங்களிலும்
  rationale: מִגְדָּלוֹת என்பது பொதுவாக ‘கோபுரங்கள்’ என்று பொருள். அவை காவல் அல்லது அரண் கோபுரங்கள் என்று மூலம் குறிப்பாகச் சொல்லாததால் அந்த விவரம் சேர்க்கப்படவில்லை.
- source_word: יְהוֹנָתָן
  choice: யெகோனத்தான்
  rationale: இங்குள்ள முழு எபிரெயப் பெயர்வடிவமான יְהוֹנָתָן-ஐ, குறுகிய יוֹנָתָן வடிவத்திலிருந்து வேறுபடுத்திப் பேணுகிறது.
- source_word: בֶּן עֻזִּיָּהוּ
  choice: உசியாவின் மகன்
  rationale: வம்ச அடையாளத்தை இயல்பான தமிழில் தருகிறது; עֻזִּיָּהוּ என்பதற்கு வழக்கமான தமிழ் எழுத்துப்பெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
