translation_notes:
  register: நவீன நிலையான தமிழில், நிர்வாகப் பட்டியலின் இணை அமைப்பைப் பேணியபடி இரண்டு தெளிவான வாக்கியங்களாக வழங்கப்பட்டுள்ளது. ‘பொறுப்பாக … இருந்தான்’ என்பது மூலத்தின் மேற்பார்வை உறவை இயல்பாக வெளிப்படுத்துகிறது. பெயர்கள் எபிரெய வடிவங்களுக்கு அண்மையாக எழுத்துப்பெயர்க்கப்பட்டுள்ளன. கொடுக்கப்பட்ட ஆங்கில ஆலோசனை உரையில் அடிக்குறிப்பு குறியீடுகள் பொருந்தாத சொற்களுக்குப் பின்னர் தோன்றினாலும், அவற்றின் உள்ளடக்கத்துக்கு உரிய இடங்களான ‘வயல்வெளிப் பகுதிகளில்’ மற்றும் ‘யெகோனத்தான்’ என்பவற்றுக்குப் பின்னர் இங்கு அமைக்கப்பட்டுள்ளன.
