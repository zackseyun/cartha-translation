  register: நவீனத் தரத் தமிழில், நிர்வாகப் பட்டியலுக்கேற்ற சுருக்கமான மற்றும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. அரைக்கோத்திரம் என்ற சொல் சூழலின் மறைபொருளைத் தெளிவாக்குகிறது; பெயர்கள் எபிரெய வடிவங்களுக்கு அண்மையாக ஒலிபெயர்க்கப்பட்டன.
