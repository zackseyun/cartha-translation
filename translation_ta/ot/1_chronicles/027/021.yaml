  text: 'for the half-tribe of Manasseh in Gilead: Iddo son of Zechariah[a]; for Benjamin: Jaasiel son of Abner.'
translation:
  language: ta
  text: 'கீலேயாத்திலுள்ள மனாசேயின் அரைக்கோத்திரத்துக்கு: சகரியாவின் மகன் இத்தோ; பென்யமீனுக்கு: அப்னேரின் மகன் யாசியேல்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யஷியேல்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לַ/חֲצִי הַֽ/מְנַשֶּׁה
  choice: மனாசேயின் அரைக்கோத்திரத்துக்கு
  rationale: நிர்வாகப் பட்டியலின் சூழலில், இது மனாசே கோத்திரத்தின் ஒரு பாதியைச் சுட்டுகிறது. தமிழில் பொருள் தெளிவாக இருக்க ‘கோத்திரம்’ சேர்க்கப்பட்டது.
- source_word: גִּלְעָדָ/ה
  choice: கீலேயாத்திலிருந்த
  rationale: இங்கு வடிவம் கீலேயாத் பிரதேசத்தோடு தொடர்புடைய மனாசேயின் அரைக்கோத்திரத்தை அடையாளப்படுத்துகிறது; பட்டியல் சூழலில் ‘கீலேயாத்திலிருந்த’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: יִדּוֹ
  choice: இத்தோ
  rationale: எபிரெய மெய்யொலி இரட்டிப்பையும் உயிரொலியையும் அணுகும் தமிழ் ஒலிபெயர்ப்பு.
- source_word: בֶּן זְכַרְיָהוּ
  choice: சகரியாவின் மகன்
  rationale: வம்ச உறவைக் குறிக்கும் வழக்கமான ‘மகன்’ அமைப்பு; பெயர் தமிழில் பரவலாக அறியப்படும் வடிவில் தரப்பட்டது.
- source_word: לְ/בִנְיָמִן
  choice: பென்யமீனுக்கு
  rationale: முன்னிலை ל இந்த அதிகாரி பிரதிநிதித்துவப்படுத்திய கோத்திரக் குழுவைக் குறிக்கிறது; பட்டியல் நடைக்கு ஏற்ற சுருக்கமான வடிவம்.
- source_word: יַעֲשִׂיאֵל
  choice: யாசியேல்
  rationale: மசோரா உயிர்க்குறிப்பான Yaʿaśiʾel என்பதைக் கிட்டத்தட்ட பிரதிபலிக்கும் தமிழ் ஒலிபெயர்ப்பு.
- source_word: בֶּן אַבְנֵר
  choice: அப்னேரின் மகன்
  rationale: வழக்கமான வம்சவழி அமைப்பு; எபிரெயப் பெயரின் ஒலிக்கு நெருக்கமான தமிழ் வடிவம்.
