base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/018.yaml
  text: For Judah[a], Elihu, one of David’s brothers; for Issachar, Omri son of Michael.
translation:
  language: ta
  text: யூதாவுக்கு, தாவீதின் சகோதரர்களில் ஒருவரான எலிகூ[a]; இசக்காருக்கு, மீகாவேலின் மகன் ஒம்ரி.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெய உரையில்: “எலிகூ.” சில பழமையான மொழிபெயர்ப்புகளும் உரைவிளக்க அறிஞர்களும் “எலியாப்” என்று வாசிக்கின்றனர்; வேறிடங்களில் தாவீதின் சகோதரருக்கு வழங்கப்பட்ட பெயருடன் ஒத்திசைத்ததால் இந்த வாசிப்பு தோன்றியிருக்கலாம்.'
    reason: alternative_reading
lexical_decisions:
- source_word: לִיהוּדָה
  choice: யூதாவுக்கு
  rationale: முன்னொட்டான לְ இந்த நிர்வாகப் பட்டியலில் கோத்திரத்துக்குரிய தலைப்பைக் குறிக்கிறது; பட்டியல் அமைப்பைப் பேணும் இயல்பான தமிழ் வடிவம்.
- source_word: אֱלִיהוּ
  choice: எலிகூ
  rationale: மசோரா எபிரெய உரை אֱלִיהוּ என்று வாசிக்கிறது; அதைத் தமிழில் எலிகூ என ஒலிபெயர்த்துள்ளது.
- source_word: מֵאֲחֵי דָוִיד
  choice: தாவீதின் சகோதரர்களில் ஒருவரான
  rationale: 'מִן முன்னிடைச்சொல் இங்கு பகுதியைக் குறிக்கிறது: தாவீதின் சகோதரர்களில் ஒருவர். பெயருடன் இயல்பாக இணைய தமிழில் பெயரெச்ச வடிவம் பயன்படுத்தப்பட்டது.'
- source_word: לְיִשָּׂשכָר
  choice: இசக்காருக்கு
  rationale: யூதாவைப் போலவே לְ கோத்திரத்துக்குரிய பிரதிநிதியை அறிமுகப்படுத்துகிறது.
- source_word: עָמְרִי
  choice: ஒம்ரி
  rationale: எபிரெய தனிப்பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: בֶּן מִיכָאֵל
  choice: மிகாவேலின் மகன்
  rationale: வழக்கமான எபிரெய தந்தைவழிப் பெயரடை அமைப்பை இயல்பான தமிழில் வழங்குகிறது.
