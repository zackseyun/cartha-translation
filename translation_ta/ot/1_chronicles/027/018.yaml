  register: நவீனத் தரத் தமிழில், நிர்வாகப் பட்டியலின் சுருக்கமான இணை அமைப்பைப் பேணும் கண்ணியமான நடை. கோத்திரப் பெயர்களுக்கு “-க்கு” பயன்படுத்தப்பட்டு, மூலத்தில் வெளிப்படையாக இல்லாத “கோத்திரம்” சேர்க்கப்படவில்லை.
