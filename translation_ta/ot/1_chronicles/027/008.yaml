base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/008.yaml
  text: The fifth[a], for the fifth month, was the commander Shamhuth the Izrahite; and over his division were twenty-four thousand.
translation:
  language: ta
  text: ஐந்தாம் மாதத்துக்கான ஐந்தாம் படைப்பிரிவின் தளபதி இஸ்ராகியரான சம்ஹூத்[a]; அவருடைய படைப்பிரிவில் இருபத்துநான்காயிரம் பேர் இருந்தனர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சேராகியரான சம்ஹூத்.” இங்குள்ள எபிரேயக் குடிப்பெயர் சில மொழிபெயர்ப்புகளில் மரபாக இவ்வாறு வழங்கப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֲמִישִׁי
  choice: ஐந்தாம் படைப்பிரிவு
  rationale: இந்த இராணுவப் பட்டியலில் தனித்து நிற்கும் வரிசை எண், தொடரில் ஐந்தாவது மாதாந்தரப் படைப்பிரிவைக் குறிக்கிறது; தமிழில் பொருளைத் தெளிவாக்க ‘படைப்பிரிவு’ சேர்க்கப்பட்டது.
- source_word: לַחֹדֶשׁ הַחֲמִישִׁי
  choice: ஐந்தாம் மாதத்துக்கான
  rationale: לְ இங்கு அந்த மாதத்திற்குரிய பணி ஒதுக்கீட்டைக் குறிக்கிறது; இயல்பான நவீனத் தமிழில் நிர்வாகப் பொருளை இது தருகிறது.
- source_word: הַשַּׂר
  choice: தளபதி
  rationale: שַׂר என்பது தலைவர் அல்லது அதிகாரி; இராணுவச் சூழலில் ‘தளபதி’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: שַׁמְהוּת
  choice: சம்ஹூத்
  rationale: எபிரேய மசோரா உயிர்க்குறிப்பை அடிப்படையாகக் கொண்ட பெயரெழுத்தாக்கம்.
- source_word: הַיִּזְרָח
  choice: இஸ்ராகியரான
  rationale: எபிரேய வடிவை நெருக்கமாகப் பெயரெழுத்தாக்குகிறது; ‘சேராகியர்’ என்ற மரபுவழி மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: அவருடைய படைப்பிரிவில் ... பேர் இருந்தனர்
  rationale: מַחֲלֻקָה இவ்வதிகாரத்தில் இராணுவப் பிரிவைக் குறிக்கிறது. தமிழில் ஆட்களின் எண்ணிக்கையை இயல்பாகச் சொல்ல இந்த அமைப்பு பயன்படுத்தப்பட்டது.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: இருபத்துநான்காயிரம்
  rationale: எபிரேய எண்ணியல் தொடரின் இயல்பான தமிழ் வடிவம்.
