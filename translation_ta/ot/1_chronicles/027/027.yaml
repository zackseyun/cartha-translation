translation_notes:
  register: நவீன நிலையான தமிழில், நிர்வாகப் பட்டியலின் சுருக்கமான அமைப்பைத் தக்கவைத்து மொழிபெயர்க்கப்பட்டுள்ளது. ‘இருந்தான்’ என்ற ஒருமை வினை இரு இணை வாக்கியங்களிலும் பயன்படுத்தப்பட்டதால் ஒவ்வொரு அதிகாரியின் தனிப்பட்ட பொறுப்பும் தெளிவாகிறது. இடத்தொடர்புக் குடிப்பெயர்கள் விளக்கி விரிவாக்கப்படாமல் தமிழில் எழுத்துப்பெயர்க்கப்பட்டுள்ளன.
