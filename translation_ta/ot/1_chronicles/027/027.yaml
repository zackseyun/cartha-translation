  naturalness: “திராட்சரசக் களஞ்சியங்களுக்காகத் திராட்சைத்தோட்டங்களில் இருந்த விளைச்சலுக்குப் பொறுப்பாக” என்பது நவீன நிலையான தமிழில் தெளிவானதும் இயல்பானதுமாக உள்ளது. ‘திராட்சைத்தோட்ட விளைச்சல்’ என்பதைக் காட்டிலும் ‘திராட்சைத்தோட்டங்களில் இருந்த விளைச்சல்’ அடிக்குறிப்பின் சொற்பொருளோடும் நேரடியாக இணைகிறது.
  terminology: ‘திராட்சைத்தோட்டம்,’ ‘திராட்சரசம்,’ மற்றும் ‘களஞ்சியம்’ பொருத்தமான நிர்வாக/வேளாண் சொற்கள். சிமேயி, ராமாத்தியன், சப்தி, சிப்மியன் ஆகிய பெயர் மற்றும் குடிப்பெயர் எழுத்துப்பெயர்ப்புகள் பாதுகாக்கப்பட்டுள்ளன. மாற்று வாசக அடிக்குறிப்பு களஞ்சியம்/சேமிப்பிடம் என்ற உண்மையான சொல்லியல் மாற்றைக் காட்டுமாறு திருத்தப்பட்டுள்ளது.
