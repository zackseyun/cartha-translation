base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/027.yaml
  text: Over the vineyards was Shimei the Ramathite[b][a]; and over the produce of the vineyards for the wine cellars was Zabdi the Shiphmite.
translation:
  language: ta
  text: திராட்சைத்தோட்டங்களுக்குப் பொறுப்பாக ராமாத்தியனான சிமேயி இருந்தான்; திராட்சரசக் களஞ்சியங்களுக்காக[b] திராட்சைத்தோட்டங்களில் இருந்த விளைச்சலுக்குப்[a] பொறுப்பாக சிப்மியனான சப்தி இருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “திராட்சைத்தோட்டங்களில் இருந்தவை” என்று சொற்பொருள்படுகிறது; சூழலில் இது திராட்சைத்தோட்டங்களின் விளைச்சலைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “திராட்சரசச் சேமிப்பிடங்களுக்காக.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: பொறுப்பாக
  rationale: நிர்வாகப் பொறுப்பாளர்களைப் பட்டியலிடும் இச்சூழலில் עַל என்பது மேற்பார்வை அல்லது பொறுப்பைக் குறிக்கிறது; இயல்பான நவீனத் தமிழில் ‘பொறுப்பாக’ என வழங்கப்பட்டது.
- source_word: הַכְּרָמִים
  choice: திராட்சைத்தோட்டங்கள்
  rationale: כֶּרֶם என்பதன் வழக்கமான பொருள் ‘திராட்சைத்தோட்டம்’; பன்மையும் குறிப்புத்தன்மையும் தமிழில் இயல்பாகப் பாதுகாக்கப்பட்டுள்ளன.
- source_word: שִׁמְעִי
  choice: சிமேயி
  rationale: எபிரெயத் தனிப்பெயரின் ஒலிப்பைத் தமிழில் அண்மையாக எழுத்துப்பெயர்த்தல்.
- source_word: הָרָמָתִי
  choice: ராமாத்தியன்
  rationale: ராமா என்ற இடத்தோடு தொடர்புடைய குடிப்பெயர் வடிவத்தை ஊக விளக்கமின்றி எழுத்துப்பெயர்த்துப் பாதுகாக்கிறது.
- source_word: שֶׁבַּכְּרָמִים
  choice: திராட்சைத்தோட்ட விளைச்சல்
  rationale: சொற்பொருளாக ‘திராட்சைத்தோட்டங்களில் இருந்தவை’; திராட்சரசக் களஞ்சியங்களைக் குறிக்கும் உடனடிச் சூழலில் விளைச்சலே நோக்கமெனத் தெளிவாகிறது. சொற்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: לְאֹצְרוֹת הַיַּיִן
  choice: திராட்சரசக் களஞ்சியங்களுக்குரிய
  rationale: אֹצָר என்பது களஞ்சியம் அல்லது சேமிப்பிடத்தைக் குறிக்கலாம்; יַיִן உடன் வருவதால் திராட்சரசம் வைக்கப்படும் களஞ்சியங்கள் என்பது இயல்பான பொருள். לְ தொடர்பை ‘உரிய’ எனச் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: זַבְדִּי
  choice: சப்தி
  rationale: எபிரெயத் தனிப்பெயரைத் தமிழில் மரபுக்கு ஏற்றவாறு எழுத்துப்பெயர்த்தல்.
- source_word: הַשִּׁפְמִי
  choice: சிப்மியன்
  rationale: துல்லியமான இட அடையாளம் உறுதியில்லாததால் ‘சிப்மிலிருந்து வந்தவன்’ என விரிவாக்காமல் குடிப்பெயர் வடிவம் பாதுகாக்கப்பட்டுள்ளது.
