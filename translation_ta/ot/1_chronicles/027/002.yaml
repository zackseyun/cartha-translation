translation_notes:
  register: நவீன, தரமான, மரியாதைமிக்க தமிழ் பயன்படுத்தப்பட்டுள்ளது. இராணுவச் சூழலைத் தெளிவாக்க ‘படைப்பிரிவு’ என்றும், עַל குறிக்கும் பொறுப்பை இயல்பாகச் சொல்ல ‘தலைவராக’ என்றும் வழங்கப்பட்டுள்ளது. பெயர்கள் மூல எபிரெய ஒலிக்கு அண்மையாக ஒலிபெயர்க்கப்பட்டுள்ளன.
