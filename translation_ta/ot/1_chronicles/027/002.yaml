- from: முதலாம் மாதத்துக்குரிய முதலாம் படைப்பிரிவுக்குத் தலைவராகச் சப்தியேலின் மகன் யசொபெயாம் இருந்தான்; அவனுடைய படைப்பிரிவில் இருபத்துநான்காயிரம் பேர் இருந்தனர்.[a]
