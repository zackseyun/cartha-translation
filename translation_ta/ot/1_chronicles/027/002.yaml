  text: עַ֞ל הַ/מַּחֲלֹ֤קֶת הָ/רִֽאשׁוֹנָה֙ לַ/חֹ֣דֶשׁ הָ/רִאשׁ֔וֹן יָֽשָׁבְעָ֖ם בֶּן זַבְדִּיאֵ֑ל וְ/עַל֙ מַֽחֲלֻקְתּ֔/וֹ עֶשְׂרִ֥ים וְ/אַרְבָּעָ֖ה אָֽלֶף־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/002.yaml
  text: Over the first division for the first month was Jashobeam son of Zabdiel[a], and in his division were twenty-four thousand.
translation:
  language: ta
  text: முதல் மாதத்திற்கான முதல் படைப்பிரிவின் தலைவராகச் சப்தியேலின் மகன் யாசொபெயாம் இருந்தான்; அவனுடைய படைப்பிரிவில் இருபத்துநான்காயிரம் பேர் இருந்தனர்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எழுத்துப்படி, “அவனுடைய படைப்பிரிவின்மேல் இருபத்துநான்காயிரம்.” எபிரெய வாக்கியம் சொல்லெச்சமாக இருப்பதால், அந்தப் பிரிவின் ஆள்பலத்தைத் தெளிவுபடுத்த “பேர் இருந்தனர்” என்பது சேர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל הַמַּחֲלֹקֶת
  choice: படைப்பிரிவுக்குத் தலைவராக
  rationale: நிர்வாகப் பட்டியலான இச்சூழலில் עַל என்பது ஒரு பிரிவின்மேல் அதிகாரம் அல்லது மேற்பார்வை வகிப்பதைக் குறிக்கிறது; முந்தைய வசனத்தின் படைச்சூழலை மַחֲלֹקֶת உடன் சேர்த்து இயல்பான தமிழில் இவ்வாறு வெளிப்படுத்துகிறது.
- source_word: הָרִאשׁוֹנָה
  choice: முதலாம்
  rationale: மாதந்தோறும் மாறும் வரிசையில் இது முதலாவது பிரிவைக் குறிக்கும் வரிசை எண்ணாக உள்ளது.
- source_word: לַחֹדֶשׁ הָרִאשׁוֹן
  choice: முதலாம் மாதத்துக்குரிய
  rationale: לְ முன்னொட்டு அந்தப் படைப்பிரிவு முதலாம் மாதத்திற்கென ஒதுக்கப்பட்டதைச் சுட்டுகிறது; வெறும் உடைமையுறவைவிட பணியொதுக்கீட்டை இச்சொல் தெளிவாகக் காட்டுகிறது.
- source_word: יָשָׁבְעָם
  choice: யசொபெயாம்
  rationale: எபிரெயப் பெயரின் ஒலியமைப்பை நவீனத் தமிழ் எழுத்துமுறையில் நெருக்கமாக ஒலிபெயர்க்கிறது.
- source_word: בֶּן זַבְדִּיאֵל
  choice: சப்தியேலின் மகன்
  rationale: בֶּן என்பதன் இயல்பான வம்ச அடையாளப் பொருள் ‘மகன்’; சப்தியேல் என்பது எபிரெயப் பெயரின் தமிழ் ஒலிபெயர்ப்பு.
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: அவனுடைய படைப்பிரிவில் ... பேர் இருந்தனர்
  rationale: எபிரெய வாக்கியம் சொல்லெச்சமாக ‘அவனுடைய பிரிவின்மேல்—இருபத்துநான்காயிரம்’ என உள்ளது. எண்ணிக்கை பிரிவின் ஆள்பலத்தைக் குறிப்பிடுவதால், தமிழில் தேவைப்படும் வினையும் மனிதர்களைக் குறிக்கும் ‘பேர்’ என்பதும் வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளன.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: இருபத்துநான்காயிரம்
  rationale: எபிரெய எண்ணின் நேரான, வாசிக்க எளிய தமிழ் வடிவம்.
