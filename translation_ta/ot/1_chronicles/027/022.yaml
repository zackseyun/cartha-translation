base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/022.yaml
  text: 'For Dan: Azarel son of Jeroham[a]. These were the leaders of the tribes of Israel.'
translation:
  language: ta
  text: 'தாணுக்காக: எரோஹாமின் மகன் அசரேல். இவர்களே இஸ்ரவேலின் கோத்திரங்களின் தலைவர்கள்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தலைவர்கள்’ என்பதற்குப் பதிலாக ‘முதன்மையானவர்கள்’ அல்லது ‘அதிகாரிகள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְ/דָן
  choice: தாணுக்கு
  rationale: לְ முன்னொட்டு நிர்வாகப் பட்டியலில் அந்தக் கோத்திரத்துக்கென நியமிக்கப்பட்டவரை அறிமுகப்படுத்துகிறது; ஆகவே தமிழில் இயல்பாக ‘தாணுக்கு’ என மொழிபெயர்க்கப்பட்டது.
- source_word: עֲזַרְאֵל
  choice: அசரேல்
  rationale: எபிரேயத் தனிப்பெயரின் ஒலியை நவீனத் தமிழ் எழுத்துமுறையில் நெருக்கமாகப் பெயர்த்த வடிவம்.
- source_word: בֶּן
  choice: மகன்
  rationale: தந்தை–மகன் உறவைக் குறிக்கும் எபிரேய இணைப்பு; தமிழில் இயல்பான மரபுவழிக் குறிப்பாக ‘மகன்’ பயன்படுத்தப்பட்டது.
- source_word: יְרֹחָם
  choice: எரோகாம்
  rationale: எபிரேயத் தனிப்பெயரின் ஒலிக்கு நெருக்கமான, தமிழில் வாசிக்க எளிய பெயர்ப்பு.
- source_word: אֵלֶּה
  choice: இவர்களே
  rationale: முன்னர் பட்டியலிடப்பட்ட மனிதர்களைச் சுட்டும் பன்மைச் சுட்டுப்பெயர்; சுருக்கவாக்கியத்தின் வலியுறுத்தலை ‘இவர்களே’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: שָׂרֵי
  choice: தலைவர்கள்
  rationale: שַׂר என்பது தலைமை, அதிகாரம் அல்லது நிர்வாகப் பொறுப்பு வகிப்பவரைக் குறிக்கலாம்; இங்குள்ள கோத்திர நிர்வாகச் சூழலில் ‘தலைவர்கள்’ தெளிவானதும் பரந்த பொருளைத் தக்கவைத்ததும் ஆகும்.
- source_word: שִׁבְטֵי
  choice: கோத்திரத்
  rationale: இஸ்ரவேலின் வம்ச அடிப்படையிலான பிரிவுகளைக் குறிக்கும் சொல்லுக்கு தமிழ் வேதாகம நடையில் அறியப்பட்டும் தெளிவாகவும் உள்ள ‘கோத்திரம்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: יִשְׂרָאֵל
  choice: இஸ்ரவேல்
  rationale: எபிரேய தேசியப் பெயருக்கான தமிழில் பரவலாக அறியப்பட்ட வேதாகமப் பெயர்ப்பு.
