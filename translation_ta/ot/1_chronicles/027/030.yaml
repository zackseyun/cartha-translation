revisions:
- from: ஒட்டகங்களுக்குப் பொறுப்பாக இஸ்மவேலியனான ஒபீலும், பெண் கழுதைகளுக்குப்[a] பொறுப்பாக மெரோனோத்தியனான யெக்தெயாவும் இருந்தார்கள்.
  to: ஒட்டகங்களுக்குப் பொறுப்பாளனாக இஸ்மவேலியனான ஓபில் இருந்தான்; பெண் கழுதைகளுக்குப்[a] பொறுப்பாளனாக மெரோனோத்தியனான யெக்தெயாகு இருந்தான்.
  rationale: The revision makes the two parallel administrative assignments explicit in idiomatic Tamil, retains the lexical specificity of “female donkeys,” keeps the footnote anchored to the word it explains, and transliterates both names more closely to their Hebrew forms. No interpretive claim is made about the precise nature of the gentilic identifiers.
