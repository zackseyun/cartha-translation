  text: וְ/עַל הַ֨/גְּמַלִּ֔ים אוֹבִ֖יל הַ/יִּשְׁמְעֵלִ֑י וְ/עַל הָ֣/אֲתֹנ֔וֹת יֶחְדְּיָ֖הוּ הַ/מֵּרֹנֹתִֽי־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/030.yaml
  text: Over the camels was Obil the Ishmaelite[a], and over the female donkeys was Jehdeiah the Meronothite.
translation:
  language: ta
  text: ஒட்டகங்களுக்குப் பொறுப்பாளனாக இஸ்மவேலியனான ஓபில் இருந்தான்; பெண் கழுதைகளுக்குப்[a] பொறுப்பாளனாக மெரோனோத்தியனான யெக்தெயாகு இருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல் குறிப்பாகப் பெண் கழுதைகளைக் குறிக்கிறது.
    reason: lexical_clarification
lexical_decisions:
- source_word: וְעַל
  choice: பொறுப்பாக
  rationale: இது அரச உடைமைகளைக் கண்காணிக்கும் நிர்வாகப் பட்டியல் என்பதால், עַל இங்கு மேலாண்மை அல்லது பொறுப்பைக் குறிக்கிறது. தமிழில் இயல்பாகவும் தெளிவாகவும் இருக்க ‘பொறுப்பாக’ என மொழிபெயர்க்கப்பட்டது.
- source_word: הַגְּמַלִּים
  choice: ஒட்டகங்கள்
  rationale: திட்டவட்டமான பன்மைப் பெயர்ச்சொல்லின் நேரான தமிழ் மொழிபெயர்ப்பு.
- source_word: אוֹבִיל
  choice: ஒபீல்
  rationale: தனிப்பட்ட பெயர் என்பதால் எபிரெய ஒலிப்புக்கு நெருக்கமாக எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: הַיִּשְׁמְעֵאלִי
  choice: இஸ்மவேலியன்
  rationale: ஒபீலின் இன அல்லது குலத் தொடர்பைக் குறிக்கும் அடைமொழி; தமிழில் சுருக்கமாகவும் இயல்பாகவும் வழங்கப்பட்டது.
- source_word: הָאֲתֹנוֹת
  choice: பெண் கழுதைகள்
  rationale: אָתוֹן என்பது பொதுவாகக் கழுதையை அல்ல, குறிப்பாகப் பெண் கழுதையைக் குறிக்கிறது; மூலச்சொல்லின் பாலினத் துல்லியம் காக்கப்பட்டது.
- source_word: יֶחְדְּיָהוּ
  choice: யெக்தெயா
  rationale: தனிப்பட்ட பெயர் தமிழில் வாசிக்க ஏற்றவாறு எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: הַמֵּרֹנֹתִי
  choice: மெரோனோத்தியன்
  rationale: மெரோனோத் என்ற இடத்துடனான தொடர்பைக் குறிக்கக்கூடிய குடிப்பெயர் அல்லது ஊரடையாளச் சொல்; எபிரெய வடிவம் காக்கப்பட்டது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், அரச நிர்வாகப் பட்டியலுக்கேற்ற சுருக்கமான மற்றும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வாக்கியத்தில் விடுபட்டுள்ள ‘இருந்தார்கள்’ என்னும் வினை, தமிழில் முழுமையான வாக்கியமாக இயங்கத் தெளிவுக்காகச் சேர்க்கப்பட்டுள்ளது. ஆங்கில ஆலோசனை உரையில் அடிக்குறி குறியீடு ‘இஸ்மவேலியன்’ என்பதற்குப் பின் இருந்தாலும், அதன் உள்ளடக்கம் הָאֲתֹנוֹת என்பதையே விளக்குவதால், மூலச்சொல்லுடன் பொருந்துமாறு ‘பெண் கழுதைகள்’ என்பதற்குப் பின் வைக்கப்பட்டுள்ளது.
