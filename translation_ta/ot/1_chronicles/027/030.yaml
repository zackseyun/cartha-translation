    text: எபிரெயச் சொல் குறிப்பாகப் பெண் கழுதைகளைக் குறிக்கிறது.
    reason: lexical_clarification
  revision_rationale: The revision makes the two parallel administrative assignments explicit in idiomatic Tamil, retains the lexical specificity of “female donkeys,” keeps the footnote anchored to the word it explains, and transliterates both names more closely to their Hebrew forms. No interpretive claim is made about the precise nature of the gentilic identifiers.
