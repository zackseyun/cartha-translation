  yaml_path: translation/ot/1_chronicles/027/029.yaml
  text: Over the herds grazing in Sharon was Shitrai the Sharonite[b][a], and over the herds in the valleys was Shaphat son of Adlai.
translation:
  language: ta
  text: சாரோனில் மேய்ந்துகொண்டிருந்த மாட்டுமந்தைகளுக்குப் பொறுப்பாகச் சாரோனைச் சேர்ந்த சித்ராய் இருந்தான்[a]; பள்ளத்தாக்குகளில் இருந்த மாட்டுமந்தைகளுக்குப் பொறுப்பாக அத்லாயின் மகன் சாபாத் இருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சாரோன் என்பது இஸ்ரவேலின் மத்திய தரைக்கடல் கரையோரச் சமவெளிப் பகுதி.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַל
  choice: பொறுப்பாக
  rationale: இந்த நிர்வாகப் பட்டியலில் עַל மேற்பார்வை அல்லது பொறுப்பைக் குறிக்கிறது; நவீன தமிழில் ‘பொறுப்பாக’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: הַבָּקָר
  choice: மாட்டுமந்தைகள்
  rationale: בקר என்பது மாடுகள் அல்லது அவற்றின் மந்தைகளைக் குறிக்கிறது; நிர்வாகச் சூழலில் பல இடங்களில் பராமரிக்கப்பட்ட தொகுதிகளை ‘மாட்டுமந்தைகள்’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: הָרֹעִים
  choice: மேய்ந்துகொண்டிருந்த
  rationale: רעה என்பதன் நிகழ்காலப் பங்கேற்பு வடிவம் மேய்ச்சலில் இருந்த மாடுகளை விவரிக்கிறது; தமிழ் தொடர்நிலை வடிவம் அந்தச் செயலை இயல்பாகத் தருகிறது.
- source_word: בַּשָּׁרוֹן
  choice: சாரோனில்
  rationale: சாரோன் என்பது இடப்பெயர்; எபிரெய உரையின் எளிய இடக்குறிப்பை நேரடியாகப் பேணுகிறது.
- source_word: שטרי
  choice: சித்ராய்
  rationale: எபிரெய தனிப்பெயரின் ஒலிப்பெயர்ப்பு.
- source_word: הַשָּׁרוֹנִי
  choice: சாரோனைச் சேர்ந்த
  rationale: இவ்வினப்பெயரடை சாரோன் பகுதியைச் சேர்ந்த ஒருவரைக் குறிக்கிறது; ‘சாரோனியன்’ என்பதைக் காட்டிலும் இச்சொற்றொடர் சாதாரண நவீன தமிழ் வாசகருக்குத் தெளிவானது.
- source_word: בָּעֲמָקִים
  choice: பள்ளத்தாக்குகளில்
  rationale: עֲמָקִים என்பதன் நேரடியான பன்மைப் பொருள் ‘பள்ளத்தாக்குகள்’; மூலத்தின் புவியியல் பொதுமையைப் பேணுகிறது.
- source_word: שָׁפָט
  choice: சாபாத்
  rationale: எபிரெய தனிப்பெயரின் தமிழ் ஒலிப்பெயர்ப்பு.
- source_word: בֶּן עַדְלָי
  choice: அத்லாயின் மகன்
  rationale: எபிரெய தந்தைவழி அடையாள அமைப்பை இயல்பான தமிழில் நேரடியாகத் தருகிறது.
