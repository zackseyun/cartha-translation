  source_fidelity: மூல எபிரெயத்தின் நிர்வாகப் பொறுப்புக் குறிக்கும் עַל அமைப்பு இரு பகுதிகளிலும் «பொறுப்பாக» என்று துல்லியமாகத் தரப்பட்டுள்ளது. «மேய்ந்துகொண்டிருந்த மாட்டுமந்தைகள்», «சாரோன்», «சாரோனைச் சேர்ந்த», «பள்ளத்தாக்குகள்», மற்றும் «அத்லாயின் மகன்» ஆகியவை முறையே மூலத்தின் பங்கேற்பு, இடப்பெயர், இன/பிரதேச அடையாளம், பன்மை இடக்குறிப்பு, தந்தைவழி அடையாளம் ஆகியவற்றைப் பேணுகின்றன.
