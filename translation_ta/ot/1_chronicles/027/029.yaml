translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. நிர்வாகப் பொறுப்பைக் காட்ட ‘பொறுப்பாக’ என்ற இயல்பான சொல் தேர்ந்தெடுக்கப்பட்டது. ‘மாட்டுமந்தைகள்’ என்பதே בקר என்பதன் கால்நடைப் பொருளை உரையிலேயே தெளிவாக்குவதால் தனி சொற்பொருள் அடிக்குறிப்பு சேர்க்கப்படவில்லை; இடவியல் பின்னணிக்காக மட்டும் [a] சேர்க்கப்பட்டுள்ளது.
