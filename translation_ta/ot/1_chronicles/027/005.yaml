source:
  edition: WLC
  text: שַׂ֣ר הַ/צָּבָ֤א הַ/שְּׁלִישִׁי֙ לַ/חֹ֣דֶשׁ הַ/שְּׁלִישִׁ֔י בְּנָיָ֧הוּ בֶן יְהוֹיָדָ֛ע הַ/כֹּהֵ֖ן רֹ֑אשׁ וְ/עַל֙ מַחֲלֻקְתּ֔/וֹ עֶשְׂרִ֥ים וְ/אַרְבָּעָ֖ה אָֽלֶף־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/005.yaml
  text: The commander of the third division for the third month was Benaiah son of Jehoiada the chief[a], and in his division were twenty-four thousand.
translation:
  language: ta
  text: மூன்றாம் மாதத்திற்கான மூன்றாம் படைப்பிரிவின் தளபதி, தலைவரான ஆசாரியன் யோய்தாவின் மகன் பெனாயா[a]; அவனுடைய படைப்பிரிவில் இருபத்துநான்காயிரம் பேர் இருந்தனர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத் தொடரை, “யோய்தாவின் மகன் பெனாயா—ஆசாரியனும் தலைவருமானவர்” என்றும் புரிந்துகொள்ளலாம்.
    reason: ‘ஆசாரியன், தலைவர்’ என்ற பட்டங்கள் யோய்தாவைக் குறிக்கின்றன என்பதே இயல்பான வாசிப்பு; எனினும் எபிரெயத் தொடரில் அவற்றை பெனாயாவுடன் இணைக்கும் மாற்று வாசிப்பும் சாத்தியமாக உள்ளது.
lexical_decisions:
- source_word: שַׂר הַצָּבָא
  choice: படைப்பிரிவின் தளபதி
  rationale: שַׂר என்பது அதிகாரி அல்லது தளபதியைக் குறிக்கிறது; இவ்வதிகாரத்தின் சூழலில் மாதாந்தரப் படைப்பிரிவை வழிநடத்துபவர் என்பதால் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: הַשְּׁלִישִׁי לַחֹדֶשׁ הַשְּׁלִישִׁי
  choice: மூன்றாம் மாதத்துக்கான மூன்றாம் படைப்பிரிவு
  rationale: முதலாவது ‘மூன்றாம்’ என்பது பட்டியலிலுள்ள படைப்பிரிவையும், இரண்டாவது ‘மூன்றாம்’ என்பது மாதத்தையும் குறிக்கிறது. எபிரெயத்தில் மறைந்துள்ள ‘படைப்பிரிவு’ தமிழில் தெளிவுக்காக வெளிப்படுத்தப்பட்டது.
- source_word: בְּנָיָהוּ בֶן יְהוֹיָדָע
  choice: யோய்தாவின் மகன் பெனாயா
  rationale: தனிப்பெயர்கள் தமிழ் வேதாகமப் பயன்பாட்டுக்கு ஏற்ற ஒலிபெயர்ப்பில் தரப்பட்டன.
- source_word: הַכֹּהֵן רֹאשׁ
  choice: தலைமை வகித்த குரு
  rationale: כֹּהֵן என்பது ‘குரு’; רֹאשׁ என்பது ‘தலைவர்/தலைமை வகிப்பவர்’. இயல்பான தமிழில் இரு சொற்களின் பொருளையும் பாதுகாக்க இவ்வாறு தரப்பட்டது.
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: அவனுடைய படைப்பிரிவில் ... பேர் இருந்தனர்
  rationale: מַחֲלֻקָה இங்கு இராணுவப் பிரிவைக் குறிக்கிறது. தொடர்ச்சியான பட்டியல் அமைப்பில் இச்சொற்றொடர் அந்தப் பிரிவின் எண்ணிக்கையை அறிமுகப்படுத்துகிறது.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: 24,000 பேர்
  rationale: எண்ணிக்கை நேரடியாகத் தரப்பட்டது; மனிதர்களின் எண்ணிக்கை என்பதை இயல்பாகக் காட்ட ‘பேர்’ சேர்க்கப்பட்டது.
theological_decisions:
- issue: הַכֹּהֵן רֹאשׁ என்ற பட்டம் யாரைக் குறிக்கிறது
  choice: முதன்மை உரையில் அது யோய்தாவைக் குறிப்பதாக அமைக்கப்பட்டது
  alternative: ‘குருவும் தலைவருமான பெனாயா’ என்று பெனாயாவைக் குறிக்கும் வாசிப்பு
  rationale: சொற்றொடரின் அமைப்பும் யோய்தா குருவாக அறியப்படும் பின்னணியும் இவ்வாசிப்பை ஆதரிக்கின்றன; இருப்பினும் எபிரெயத் தொடரின் இலக்கண அமைப்பு பட்டத்தை பெனாயாவோடு இணைக்கும் வாசிப்பையும் முற்றிலும் விலக்காது என்பதால் அடிக்குறிப்பில் தெரிவிக்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியக்கூடிய அதேவேளையில் கண்ணியமான வரலாற்றுப் பதிவு நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெயத்தில் உள்ள சுருக்கமான பட்டியல் அமைப்பு தமிழில் முழு வாக்கியங்களாக இயல்பாக்கப்பட்டது.
