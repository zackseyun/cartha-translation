  text: וְ/עַל הַ/זֵּיתִ֤ים וְ/הַ/שִּׁקְמִים֙ אֲשֶׁ֣ר בַּ/שְּׁפֵלָ֔ה בַּ֥עַל חָנָ֖ן הַ/גְּדֵרִ֑י וְ/עַל אֹצְר֥וֹת הַ/שֶּׁ֖מֶן יוֹעָֽשׁ־ס־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/028.yaml
  text: Over the olive trees and the sycamore trees in the Shephelah was Baal-hanan the Gederite[b][a]; and over the stores of oil was Joash.
translation:
  language: ta
  text: ஷெப்பேலாவில்[a] இருந்த ஒலிவ மரங்களுக்கும் சிக்கமோர் அத்தி மரங்களுக்கும் பாகால்-ஆனான், கெதேரைச் சேர்ந்தவன், பொறுப்பாக இருந்தான்; எண்ணெய்க் களஞ்சியங்களுக்கு யோவாஸ் பொறுப்பாக இருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தாழ்நிலத்தில்.” “ஷெப்பேலா” என்பது யூதாவின் மலை அடிவாரப் பகுதியைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַל
  choice: பொறுப்பாக இருந்தான்
  rationale: இது நிர்வாகப் பொறுப்பாளர்களின் பட்டியல் என்பதால், עַל என்பது ஒரு துறையை மேற்பார்வையிடும் பொறுப்பைக் குறிக்கிறது. இயல்பான நவீன தமிழில் இதைத் தெளிவாகக் காட்டுகிறது.
- source_word: הַזֵּיתִים
  choice: ஒலிவ மரங்கள்
  rationale: இந்த நில மேலாண்மைச் சூழலில் பன்மைப் பெயர்ச்சொல் ஒலிவப் பழங்களை அல்ல, மரங்களைக் குறிக்கிறது.
- source_word: וְהַשִּׁקְמִים
  choice: காட்டத்தி மரங்கள்
  rationale: שִׁקְמִים என்பது sycamore-fig வகை மரங்களைக் குறிக்கிறது. தமிழில் புரிந்துகொள்ளத்தக்க மரப்பெயராக ‘காட்டத்தி’ பயன்படுத்தப்பட்டு, மாற்று விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אֲשֶׁר בַּשְּׁפֵלָה
  choice: ஷெப்பேலாவில் இருந்த
  rationale: שְׁפֵלָה இங்கு யூதாவின் அடிவாரத் தாழ்நிலப் பிரதேசத்தைக் குறிக்கும் நிலப்பெயராகப் புரிந்துகொள்ளப்படுகிறது; அதன் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: בַּעַל חָנָן
  choice: பாகால்-ஆனான்
  rationale: எபிரெய தனிப்பெயரின் கூறுகளையும் உச்சரிப்பையும் இயன்றவரை பிரதிபலிக்கும் தமிழ் ஒலிபெயர்ப்பு.
- source_word: הַגְּדֵרִי
  choice: கெதேரைச் சேர்ந்த
  rationale: இது கெதேருடன் தொடர்புடைய ஊரினப் பெயரடை. செயற்கையான தமிழாக்கப் பட்டப்பெயரைவிட இந்த வடிவம் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: אֹצְרוֹת הַשֶּׁמֶן
  choice: எண்ணெய்க் களஞ்சியங்கள்
  rationale: இந்தத் தொடர் எண்ணெய் சேமிக்கப்பட்ட களஞ்சியங்களையோ சேமிப்பு வசதிகளையோ குறிக்கிறது; சூழலுக்கேற்ற தெளிவான தமிழ் வடிவம் இது.
- source_word: יוֹעָשׁ
  choice: யோவாஸ்
  rationale: எபிரெய தனிப்பெயருக்கான வழக்கமான தமிழ் ஒலிபெயர்ப்பு.
