base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/031.yaml
  text: Over the flocks was Jaziz the Hagrite[a]. All these were officers over the property that belonged to King David.
translation:
  language: ta
  text: மந்தைகளுக்குப் பொறுப்பாக ஆகிரியனான யாசீஸ் இருந்தான். இவர்கள் அனைவரும் தாவீது அரசனுக்குச் சொந்தமான உடைமைகளுக்குப் பொறுப்பான அதிகாரிகளாக இருந்தனர்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַל
  choice: பொறுப்பாக
  rationale: இந்த நிர்வாகப் பட்டியலில் עַל என்பது மேற்பார்வை அல்லது பொறுப்பைக் குறிக்கிறது; நவீன தமிழில் இயல்பாக அமைய இச்சொல் தேர்ந்தெடுக்கப்பட்டது.
- source_word: הַצֹּאן
  choice: மந்தைகள்
  rationale: צֹאן என்பது செம்மறியாடுகளை மட்டுமல்லாது ஆடுகள் உள்ளிட்ட சிறு கால்நடைகளையும் குறிக்கலாம்; அந்தப் பரந்த பொருளை அளவுக்கு மீறித் துல்லியப்படுத்தாமல் ‘மந்தைகள்’ தருகிறது.
- source_word: יָזִיז
  choice: யாசீஸ்
  rationale: எபிரெயத் தனிப்பெயரின் ஒலியைத் தமிழில் நெருக்கமாக எழுத்துப்பெயர்த்த வடிவம்.
- source_word: הַהַגְרִי
  choice: ஆகிரியனான
  rationale: இது ஓர் இனக்குழு அல்லது குல அடையாளத்தைக் குறிக்கும் பெயரடை; ஆகிரி இனத்தைச் சேர்ந்தவர் என்ற பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: כָּל אֵלֶּה
  choice: இவர்கள் அனைவரும்
  rationale: முன்னுள்ள அதிகாரிகளின் பட்டியலைத் தொகுத்துச் சுட்டும் நிறைவுச் சொற்றொடர்.
- source_word: שָׂרֵי
  choice: அதிகாரிகள்
  rationale: இச்சூழலில் שָׂרֵי என்பது அரச உடைமைகளை நிர்வகித்த அலுவலர்களைக் குறிக்கிறது; ‘அதிகாரிகள்’ நிர்வாகப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: הָרְכוּשׁ
  choice: உடைமைகள்
  rationale: רְכוּשׁ என்பது பொருட்கள், சொத்துகள் அல்லது செல்வவளங்களைக் குறிக்கும்; இங்கு அரசனுடைய பலவகை வளங்களை உள்ளடக்க ‘உடைமைகள்’ பொருத்தமானது.
- source_word: אֲשֶׁר לַמֶּלֶךְ דָּוִיד
  choice: தாவீது அரசனுக்குச் சொந்தமான
  rationale: எபிரெயச் சொற்றொடரிலுள்ள உடைமை உறவைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
