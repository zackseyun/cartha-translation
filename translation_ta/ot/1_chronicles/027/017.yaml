  text: לְ/לֵוִ֛י חֲשַׁבְיָ֥ה בֶן קְמוּאֵ֖ל לְ/אַהֲרֹ֥ן צָדֽוֹק־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/017.yaml
  text: for Levi[a], Hashabiah son of Kemuel; for Aaron, Zadok.
translation:
  language: ta
  text: லேவிக்கு, கெமுவேலின் மகன் அசபியா; ஆரோனுக்கு[a], சாதோக்கு.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஆரோனுக்கு” என்பது ஆரோனின் ஆசாரியக் குடும்பத்தை அல்லது ஆரோனியர்களைக் குறிக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: לְ/לֵוִי
  choice: லேவிக்கு
  rationale: நிர்வாகப் பட்டியலில் לְ முன்னொட்டு, பெயரிடப்பட்ட தலைவர் எந்தக் கோத்திரம் அல்லது குடும்பப் பிரிவுக்குப் பொறுப்பானவர் என்பதைக் காட்டுகிறது. எபிரெயத்தில் பன்மையான ‘லேவியர்’ என்பதற்குப் பதிலாக முன்னோரின் பெயரான ‘லேவி’ இருப்பதால், அதை அப்படியே வைத்திருக்கிறது.
- source_word: חֲשַׁבְיָה
  choice: அசபியா
  rationale: தனிநபரின் பெயர் தமிழில் வழக்கமான வேதாகமப் பெயரொலிப்பின்படி எழுத்துப்பெயர்க்கப்பட்டுள்ளது.
- source_word: בֶן
  choice: மகன்
  rationale: எபிரெய மரபுவழிப் பெயரமைப்பில் உள்ள உறவை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: קְמוּאֵל
  choice: கெமுவேல்
  rationale: தனிநபரின் பெயர் தமிழில் ஒலிப்புக்கு ஏற்றவாறு எழுத்துப்பெயர்க்கப்பட்டுள்ளது.
- source_word: לְ/אַהֲרֹן
  choice: ஆரோனுக்கு
  rationale: மூலத்தில் உள்ள முன்னோரின் பெயரையும், ‘லேவிக்கு’ என்பதோடு காணப்படும் இணையான பட்டியல் அமைப்பையும் காக்கிறது. இது ஆரோனின் ஆசாரியக் குடும்பத்தைக் குறிக்கக்கூடும் என்பதைக் குறிப்பில் விளக்குகிறது.
- source_word: צָדוֹק
  choice: சாதோக்கு
  rationale: தனிநபரின் பெயர் தமிழில் வழக்கமான வேதாகமப் பெயரொலிப்பின்படி எழுத்துப்பெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: ‘ஆரோன்’ என்பது ஆரோனிய ஆசாரியக் குடும்பத்தைக் குறிக்கிறது என்பதை மூலவசனத்திலேயே வெளிப்படையாக்க வேண்டுமா?
  choice: மூலத்தில் உள்ள முன்னோரின் பெயரைப் பின்பற்றி ‘ஆரோனுக்கு’ என்று முதன்மை உரையில் வைத்தல்
  alternative: ‘ஆரோனின் குடும்பத்துக்கு’ அல்லது ‘ஆரோனியர்களுக்கு’
  rationale: எபிரெய உரை ‘ஆரோனுக்கு’ என்றே கூறுகிறது. அது ஆரோனிய ஆசாரியக் குடும்பத்தைக் குறிக்கும் ஆகுபெயராக இருக்க வாய்ப்பிருந்தாலும், விளக்கத்தை முதன்மை உரைக்குள் சேர்க்காமல் குறிப்பில் தருவது மூலத்தின் வடிவத்தையும் பொருள் நுட்பத்தையும் காக்கிறது.
translation_notes:
  register: சுருக்கமான நிர்வாகப் பட்டியலின் இணை அமைப்பு காக்கப்பட்டுள்ளது. மொழிநடை நவீன, தெளிவான, மரியாதைக்குரிய பொதுத்தமிழில் உள்ளது; மூலத்தில் இல்லாத விளக்கச் சொற்கள் முதன்மை உரையில் சேர்க்கப்படவில்லை.
