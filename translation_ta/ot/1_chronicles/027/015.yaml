base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/015.yaml
  text: The twelfth[a], for the twelfth month, was Heldai the Netophathite, of Othniel[b]; and over his division were twenty-four thousand.
translation:
  language: ta
  text: பன்னிரண்டாம் மாதத்திற்கான பன்னிரண்டாவது தலைவர், ஒத்னியேலைச் சேர்ந்த[a] நெத்தோபாத்தியனான ஹெல்தாய்[b] இருந்தார். அவருடைய படைப்பிரிவில் இருபத்துநான்காயிரம் பேர் இருந்தனர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஒத்னியேலுக்குரியவர்’ அல்லது ‘ஒத்னியேலின் வழிவந்தவர்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயத் தொடர் பெரும்பாலும் குடும்ப அல்லது குலச் சார்பைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: இணையான சில மரபுகளில் இப்பெயர் ‘ஹெலேத்’ என்று காணப்படுகிறது.
    reason: cross_reference
lexical_decisions:
- source_word: הַשְּׁנֵים עָשָׂר
  choice: பன்னிரண்டாவது தலைவர்
  rationale: எண்ணிட்டு வரிசைப்படுத்தப்பட்ட படைப்பிரிவுகளின் சூழலில் இது வரிசை எண்ணைக் குறிக்கிறது. தமிழில் தனியே ‘பன்னிரண்டாவது’ என்று கூறுவதைவிட, சூழலால் உணரப்படும் ‘தலைவர்’ என்பதைச் சேர்ப்பது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: לִשְׁנֵים עָשָׂר הַחֹדֶשׁ
  choice: பன்னிரண்டாம் மாதத்துக்கான
  rationale: ל முன்னொட்டு அந்த மாதத்திற்கான பணி நியமனத்தைக் குறிக்கிறது; இத்தேர்வு மூலத்தின் நிர்வாக அமைப்பை இயல்பான தமிழில் தருகிறது.
- source_word: חֶלְדַּי
  choice: கெல்தாய்
  rationale: இவ்வசனத்தின் எபிரெய மெய்யெழுத்து வடிவத்தை அடிப்படையாகக் கொண்ட பெயரெழுத்தாக்கம்.
- source_word: הַנְּטוֹפָתִי
  choice: நெத்தோபாத்தியன்
  rationale: நெத்தோபா ஊரைச் சேர்ந்தவர் என்பதைக் குறிக்கும் குடிப்பெயரைச் சுருக்கமாகவும் மரபான வேதாகம நடையிலும் தருகிறது.
- source_word: לְעָתְנִיאֵל
  choice: ஒத்னியேலைச் சேர்ந்த
  rationale: இங்குள்ள ל குடும்பம் அல்லது குலம் சார்ந்த தொடர்பைக் குறிக்கக்கூடும். நேரடி சந்ததி அல்லது வேறு வகைச் சார்பைத் தீர்மானிக்காமல் மூலத்தின் நெகிழ்வைத் தக்கவைக்கிறது.
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: அவனுடைய படைப்பிரிவில் ... பேர் இருந்தனர்
  rationale: מַחֲלֻקָה இவ்வத்தியாயத்தில் முறைப்படி பணியாற்றும் படைப்பிரிவைக் குறிக்கிறது. எண்ணிக்கையுடன் இணையும் இயல்பான தமிழுக்காக ‘படைப்பிரிவில் ... பேர் இருந்தனர்’ என வழங்கப்பட்டுள்ளது.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: இருபத்துநான்காயிரம் பேர்
  rationale: படைப்பிரிவிலுள்ள ஆட்களின் எண்ணிக்கை என்பதால், தமிழில் மனிதர்களைக் குறிக்கும் ‘பேர்’ சேர்த்து எண்ணிக்கை சொற்களால் எழுதப்பட்டுள்ளது.
