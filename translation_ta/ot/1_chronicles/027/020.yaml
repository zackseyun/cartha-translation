base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/020.yaml
  text: 'For the sons of Ephraim: Hoshea son of Azaziah[a]; for the half-tribe of Manasseh: Joel son of Pedaiah.'
translation:
  language: ta
  text: எப்பிராயீமின் மகன்களுக்குப் பொறுப்பானவர் அசசியாவின் மகன் ஹோஷேயா[a]; மனாசேயின் பாதிக் கோத்திரத்துக்குப் பொறுப்பானவர் பெதாயாவின் மகன் யோவேல்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ஹோஷேயா என்பது ஓசேயா என்றும் எழுதப்படும் பெயர் வடிவமாகும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִ/בְנֵי אֶפְרַיִם
  choice: எப்பிராயீமின் மகன்களுக்குப் பொறுப்பானவர்
  rationale: לְ இங்கு நிர்வாகப் பொறுப்பைச் சுட்டுகிறது; בְנֵי என்பது கோத்திரத்தாரைக் குறிக்கும் வழக்கமான ‘மகன்கள்’ என்ற வடிவில் தக்கவைக்கப்பட்டுள்ளது. பட்டியலின் சூழலைத் தமிழில் தெளிவாக்க ‘பொறுப்பானவர்’ சேர்க்கப்பட்டுள்ளது.
- source_word: הוֹשֵׁעַ
  choice: ஓசேயா
  rationale: எபிரெயப் பெயரின் தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பு.
- source_word: בֶּן
  choice: மகன்
  rationale: வம்சத் தொடர்பைக் குறிக்கும் எபிரெயச் சொல்லின் இயல்பான தமிழ் இணை.
- source_word: עֲזַזְיָהוּ
  choice: அசசியா
  rationale: எபிரெயப் பெயருக்கு நெருக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: לַ/חֲצִי שֵׁבֶט מְנַשֶּׁה
  choice: மனாசேயின் பாதிக் கோத்திரத்துக்குப் பொறுப்பானவர்
  rationale: לְ நிர்வாக ஒதுக்கீட்டையும் חֲצִי שֵׁבֶט கோத்திரத்தின் ஒரு பாதியையும் குறிக்கின்றன; இயல்பான தமிழ்ச் சொற்றொடராக வழங்கப்பட்டுள்ளது.
- source_word: יוֹאֵל
  choice: யோவேல்
  rationale: எபிரெயப் பெயரின் மரபான தமிழ் ஒலிபெயர்ப்பு.
- source_word: פְּדָיָהוּ
  choice: பெதாயா
  rationale: எபிரெயப் பெயருக்கு நெருக்கமான, தமிழில் வாசிக்க இயல்பான ஒலிபெயர்ப்பு.
