  source_fidelity: முதல் வினாவும், தன்னார்வக் கொடையும், அனைத்தும் இறைவனிடமிருந்து வருவதும் சரியாகப் பிரதிபலிக்கப்படுகின்றன. ஆனால் «எங்களால் எப்படி முடிந்தது?» என்பது நிறைவுற்ற கடந்தகால நிகழ்வைக் குறிக்கிறது; எபிரேய வினாவோ இவ்வாறு கொடுக்கத் தகுதி/ஆற்றல் எவ்வாறு எங்களுக்கு உண்டு என்ற நிகழ்காலத் திறன் பற்றிய சொல்லாட்சியாகும். மேலும் «பெற்றதையே» என்பது ‘உமது கையிலிருந்து’ என்னும் மூலக் கருத்தில் அடங்கியதை விளக்கமாகச் சேர்க்கிறது; நேரடியான மொழிபெயர்ப்பில் அதைச் சேர்க்காமல் மூலத்தின் சுருக்கத்தைப் பாதுகாக்கலாம்.
  naturalness: «இவ்வாறு மனமுவந்து கொடுக்க எங்களால் எப்படி முடியும்?» என்பது நவீன தரநிலைத் தமிழில் இயல்பான தாழ்மையான சொல்லாட்சியாகவும், மூலத்தின் சொல்லாட்சி வினாவாகவும் அமைகிறது. «உமது கையிலிருந்தே உமக்குக் கொடுத்தோம்» இயல்பாகவும் தெளிவாகவும் உள்ளது.
  terminology: «மனமுவந்து கொடுக்க», «உம்மிடமிருந்தே», «உமது கையிலிருந்து» ஆகியவை மரியாதையான இறைமுகப்பையும் முக்கிய மூலப் படிமத்தையும் காக்கின்றன. «காணிக்கை» போன்ற கூடுதல் சொல்லைச் சேர்க்காமல், எபிரேயத்தின் பொதுவான ‘தன்னார்வமாகக் கொடுத்தல்’ என்ற சொல்லையே வைத்திருக்கிறது.
