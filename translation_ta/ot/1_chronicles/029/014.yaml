  edition: WLC
  text: וְ/כִ֨י מִ֤י אֲנִי֙ וּ/מִ֣י עַמִּ֔/י כִּֽי נַעְצֹ֣ר כֹּ֔חַ לְ/הִתְנַדֵּ֖ב כָּ/זֹ֑את כִּֽי מִמְּ/ךָ֣ הַ/כֹּ֔ל וּ/מִ/יָּדְ/ךָ֖ נָתַ֥נּוּ לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/014.yaml
  text: But who am I[a], and who are my people, that we should be able to offer willingly like this? For everything comes from you, and from your hand we have given to you.
translation:
  language: ta
  text: ஆனால் நான் யார், என் மக்கள் யார்? இவ்வாறு மனமுவந்து கொடுக்க எங்களால் எப்படி முடியும்?[a] ஏனெனில், எல்லாமே உம்மிடமிருந்தே வருகிறது; உமது கையிலிருந்தே உமக்குக் கொடுத்தோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொற்சார்பாக: ‘இவ்வாறு மனமுவந்து கொடுக்க வல்லமையைத் தக்கவைத்துக்கொள்ள.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: ஆனால்
  rationale: தாவீதின் தாழ்மையான வினாவை அறிமுகப்படுத்தும் கருத்துத் திருப்பை இயல்பான நவீன தமிழில் காட்டுகிறது.
- source_word: מִי אֲנִי וּמִי עַמִּי
  choice: நான் யார், என் மக்கள் யார்?
  rationale: מִי என்பதன் ‘யார்?’ என்ற நேரடிப் பொருளையும், இங்கு வெளிப்படும் தகுதியின்மை மற்றும் தாழ்மையையும் காக்கிறது.
- source_word: נַעְצֹר כֹּחַ
  choice: எங்களால் எப்படி முடிந்தது?
  rationale: ‘வலிமையைத் தக்கவைத்தல்/பெற்றிருத்தல்’ என்ற எபிரேய மரபுத்தொடர் இச்சூழலில் திறன் அல்லது வசதி பெற்றிருப்பதைக் குறிக்கிறது; தமிழில் இயல்பாக அதன் செயல்பாட்டுப் பொருள் தரப்பட்டுள்ளது.
- source_word: לְהִתְנַדֵּב
  choice: மனமுவந்து கொடுக்க
  rationale: கட்டாயமின்றி விருப்பத்துடன் காணிக்கை அளிக்கும் செயலைத் தெளிவாகக் கூறுகிறது; தேவையற்ற சடங்கியல் நுட்பச்சொல்லைத் தவிர்க்கிறது.
- source_word: כָּזֹאת
  choice: இவ்வாறு
  rationale: முன்பு விவரிக்கப்பட்ட அபரிமிதமான கொடையைச் சுட்டும் சுருக்கமான, இயல்பான தமிழ் வடிவம்.
- source_word: מִמְּךָ הַכֹּל
  choice: எல்லாம் உம்மிடமிருந்தே வருகிறது
  rationale: அனைத்திற்கும் தேவனே மூலமானவர் என்ற கூற்றைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: וּמִיָּדְךָ נָתַנּוּ לָךְ
  choice: உமது கையிலிருந்து பெற்றதையே உமக்குக் கொடுத்தோம்
  rationale: ‘உமது கையிலிருந்து’ என்ற மூலமொழிப் படிமத்தைப் பாதுகாக்கிறது; தமிழில் வாக்கியம் இயல்பாக அமைய ‘பெற்றதையே’ என்பது சூழலிலுள்ள உட்பொருளை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: தெய்வீக உரிமையும் மனிதரின் கொடையும்
  choice: மக்கள் கொடுப்பது முதலில் தேவனிடமிருந்து பெற்றதையே அவருக்குக் கொடுப்பதாக மொழிபெயர்க்கப்பட்டுள்ளது.
  alternative: ‘ஏற்கெனவே உமக்குச் சொந்தமானதையே திருப்பிக் கொடுக்கிறோம்’ என்று விரிவாகப் பொருள் விளக்கலாம்.
  rationale: எல்லாம் தேவனிடமிருந்து வருகிறது என்றும், அவரது கையிலிருந்து கிடைத்ததே அவருக்குக் கொடுக்கப்படுகிறது என்றும் எபிரேய உரை கூறுகிறது. பிற்கால இறையியல் சொற்றொடர்களைச் சேர்க்காமல் அந்தத் தத்துவ அழுத்தம் நேரடியாகப் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன செந்தமிழுக்கு நெருக்கமான, பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. தேவனை நோக்கிய ஒருமை மரியாதை வடிவமான ‘உமது/உமக்கு’ பயன்படுத்தப்பட்டுள்ளது; சொல்லுக்குச் சொல் மொழிபெயர்ப்பால் உண்டாகும் செயற்கைத்தன்மை தவிர்க்கப்பட்டாலும், ‘உமது கை’ என்ற மூலப் படிமம் காக்கப்பட்டுள்ளது.
