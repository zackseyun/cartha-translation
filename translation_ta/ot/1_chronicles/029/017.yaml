source:
  edition: WLC
  text: וְ/יָדַ֣עְתִּי אֱלֹהַ֔/י כִּ֤י אַתָּה֙ בֹּחֵ֣ן לֵבָ֔ב וּ/מֵישָׁרִ֖ים תִּרְצֶ֑ה אֲנִ֗י בְּ/יֹ֤שֶׁר לְבָבִ/י֙ הִתְנַדַּ֣בְתִּי כָל אֵ֔לֶּה וְ/עַתָּ֗ה עַמְּ/ךָ֙ הַ/נִּמְצְאוּ פֹ֔ה רָאִ֥יתִי בְ/שִׂמְחָ֖ה לְ/הִֽתְנַדֶּב לָֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/017.yaml
  text: And I know[a], my God, that you test the heart and take pleasure in uprightness. I, in the uprightness of my heart, have willingly offered all these things[b], and now I have seen your people who are present here willingly offer to you with joy.
translation:
  language: ta
  text: என் இறைவனே, நீர் உள்ளத்தைச் சோதித்து, நேர்மையில் மகிழ்கிறீர் என்பதை நான் அறிவேன். நான் என் உள்ளத்தின் நேர்மையோடு இவை அனைத்தையும் மனமுவந்து அளித்தேன். இப்போது இங்கே இருக்கிற உமது மக்கள் உமக்கு மகிழ்ச்சியோடு மனமுவந்து அளிப்பதை நான் கண்டேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இங்கே இருக்கிற” என்பதற்கான எபிரெயச் சொற்றொடரைச் சொற்படியாக “இங்கே காணப்படுகிற” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֹּחֵן לֵבָב
  choice: உள்ளத்தைச் சோதித்து
  rationale: בֹּחֵן என்பது ஆராய்ந்து மதிப்பிடுதல் அல்லது சோதித்தல் எனப் பொருள்படும்; לֵבָב மனிதனின் உள்ளார்ந்த எண்ணம், நோக்கம், மனவிருப்பம் ஆகியவற்றை உள்ளடக்கும் ‘உள்ளம்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: וּמֵישָׁרִים תִּרְצֶה
  choice: நேர்மையில் மகிழ்கிறீர்
  rationale: מֵישָׁרִים நேர்மை அல்லது செம்மையைக் குறிக்கிறது; תִּרְצֶה விரும்புதல், ஏற்றுக்கொள்ளுதல், மகிழ்தல் ஆகிய நுண்ணுணர்வுகளைக் கொண்டது. இங்கு இயல்பான தமிழில் இறைவனின் உவப்பை வெளிப்படுத்துகிறது.
- source_word: בְּיֹשֶׁר לְבָבִי
  choice: என் உள்ளத்தின் நேர்மையோடு
  rationale: எபிரெயச் சொற்றொடரின் வடிவத்தையும், தாவீது அளித்ததன் உள்ளார்ந்த ஒழுக்கத் தன்மையையும் காக்கிறது.
- source_word: הִתְנַדַּבְתִּי
  choice: மனமுவந்து அளித்தேன்
  rationale: נדב என்பதன் ஹித்பயேல் வடிவம் கட்டாயமின்றித் தன்னார்வத்தோடு காணிக்கை அளிப்பதைக் குறிக்கிறது; ‘மனமுவந்து அளித்தேன்’ என்பது இச்சூழலில் இயல்பான தமிழ்.
- source_word: כָל אֵלֶּה
  choice: இவை அனைத்தையும்
  rationale: முன்னர் குறிப்பிடப்பட்ட பொருட்கள் அல்லது காணிக்கைகளைக் குறிக்கும் சுட்டுப்பெயரின் பொதுத்தன்மையைப் பாதுகாக்கிறது.
- source_word: עַמְּךָ הַנִּמְצְאוּ פֹה
  choice: இங்கே கூடியிருக்கும் உமது மக்கள்
  rationale: நிபால் வடிவமான הַנִּמְצְאוּ சொற்படியாக ‘இங்கே காணப்படுகிற’ என்றும், சூழலில் ‘இங்கே இருப்பவர்கள்’ என்றும் பொருள்படலாம். கூட்டுச் சூழலை இயல்பாக வெளிப்படுத்த ‘கூடியிருக்கும்’ பயன்படுத்தப்பட்டது; சொற்படியான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: רָאִיתִי בְשִׂמְחָה
  choice: மகிழ்ச்சியோடு ... நான் கண்டேன்
  rationale: בְשִׂמְחָה தாவீது காணும் விதத்தை விவரிக்கிறது; தமிழ் சொல் வரிசையில் இயல்பாக அமைக்கப்பட்டது.
- source_word: לְהִתְנַדֶּב לָךְ
  choice: உமக்கு ... மனமுவந்து அளிப்பதை
  rationale: மக்கள் இறைவனுக்குத் தன்னார்வமாக அளிப்பதைத் தெளிவாகக் கூறி, முந்தைய נדב பயன்பாட்டுடன் சொல் ஒற்றுமையைக் காக்கிறது.
- source_word: אֱלֹהַי
  choice: என் இறைவனே
  rationale: நேரடி அழைப்பைத் தமிழில் இயல்பாக வெளிப்படுத்தும் மரியாதைமிக்க வடிவம்.
theological_decisions:
- issue: לֵבָב என்ற மனித இயல்பியல் சொல்
  choice: உள்ளம்—எண்ணம், நோக்கம், மனவிருப்பம் உட்பட்ட அகமனிதன்
  alternative: மனம்; அகநிலை
  rationale: எபிரெய மொழியில் ‘இதயம்/உள்ளம்’ என்பது உணர்ச்சியை மட்டும் அல்லாமல் சிந்தனை மற்றும் நோக்கத்தையும் குறிக்கும். ‘உள்ளம்’ அந்த விரிவான உருவகத்தையும் தமிழ் வேதாகம நடையையும் காக்கிறது.
- issue: תִּרְצֶה குறிக்கும் இறைவனின் உவப்பு
  choice: நேர்மையில் மகிழ்கிறீர்
  alternative: நேர்மையை ஏற்றுக்கொள்கிறீர்
  rationale: மூலச்சொல் மகிழ்தல் மற்றும் ஏற்றுக்கொள்ளுதல் ஆகிய இரு நுண்ணுணர்வுகளையும் கொண்டிருக்கலாம். சூழலில் ‘மகிழ்கிறீர்’ இயல்பானது; மாற்று வாசிப்பின் வாய்ப்பை விளக்கக் குறிப்பில் பதிவு செய்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் மரியாதைமிக்க இறைமுகப்பு நடை பயன்படுத்தப்பட்டுள்ளது. ‘மனமுவந்து அளித்தல்’ தன்னார்வக் காணிக்கையின் பொருளை இயல்பாகத் தருகிறது. மூலத்தின் ‘உள்ளம்/நேர்மை’ மீளுரைகள் கருத்து இணைப்பைத் தக்கவைக்கப் பாதுகாக்கப்பட்டுள்ளன.
