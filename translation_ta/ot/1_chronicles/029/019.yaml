  text: וְ/לִ/שְׁלֹמֹ֣ה בְנִ֗/י תֵּ֚ן לֵבָ֣ב שָׁלֵ֔ם לִ/שְׁמוֹר֙ מִצְוֺתֶ֔י/ךָ עֵדְוֺתֶ֖י/ךָ וְ/חֻקֶּ֑י/ךָ וְ/לַ/עֲשׂ֣וֹת הַ/כֹּ֔ל וְ/לִ/בְנ֖וֹת הַ/בִּירָ֥ה אֲשֶׁר הֲכִינֽוֹתִי־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/019.yaml
  text: And give to Solomon my son a whole heart to keep your commandments[a], your testimonies, and your statutes, and to do all of them, and to build the fortress that I have prepared.
translation:
  language: ta
  text: என் மகன் சாலொமோனுக்கு, உமது கட்டளைகளையும், உமது சாட்சியங்களையும், உமது சட்டங்களையும் கடைப்பிடித்து, அவை அனைத்தையும் நிறைவேற்றவும், நான் ஆயத்தம் செய்துள்ள கோட்டையைக்[a] கட்டவும் முழுமையான உள்ளத்தைத் தாரும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அரண்மனை” அல்லது வெறுமனே “ஆலயம்” என்றும் மொழிபெயர்க்கலாம். எபிரெயத்தில் உள்ள அரிதான சொல் பிரமாண்டமான அல்லது அரண் கொண்ட கட்டிடத்தைக் குறிக்கும்; இங்கு சாலொமோன் கட்டுவதற்காகத் தாவீது ஆயத்தம் செய்த பரிசுத்த இடத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִשְׁלֹמֹה בְנִי
  choice: என் மகன் சாலொமோனுக்கு
  rationale: வேண்டுதலின் மறைமுகப் பெறுநரை இயல்பான தமிழ்ச் சொல்வரிசையில் காட்டுகிறது; ‘என் மகன்’ என்பதையும் வெளிப்படையாகத் தக்கவைக்கிறது.
- source_word: תֵּן
  choice: தாரும்
  rationale: இறைவனை நோக்கிய வேண்டுதலுக்கு ஏற்ற, நவீனமும் கண்ணியமுமான மரியாதை வினைமுற்று.
- source_word: לֵבָב שָׁלֵם
  choice: முழுமையான உள்ளம்
  rationale: லேவாவ் குறிக்கும் மனம், விருப்பம், அகநிலை ஆகிய பரப்பையும் ஷாலேம் குறிக்கும் முழுமை மற்றும் நேர்மையையும் காக்கிறது; ‘பிளவுபடாத’ என்று விளக்கமாகச் சுருக்கவில்லை.
- source_word: לִשְׁמוֹר
  choice: கடைப்பிடித்து
  rationale: கட்டளைகள் தொடர்பில் ‘காத்தல்/பின்பற்றுதல்’ என்ற பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: מִצְוֺתֶיךָ
  choice: உமது கட்டளைகள்
  rationale: உடன்படிக்கைச் சூழலிலுள்ள கட்டளைகளை நேரடியாகக் குறிக்கிறது.
- source_word: עֵדְוֺתֶיךָ
  choice: உமது சாட்சிநெறிகள்
  rationale: ‘சாட்சி’ என்ற மூலச்சொல் நிழலைத் தக்கவைத்தபடி, இங்கு கடைப்பிடிக்க வேண்டிய தெய்வீக நெறிகள் என்ற சட்டப் பொருளையும் தெளிவாக்குகிறது.
- source_word: וְחֻקֶּיךָ
  choice: உமது சட்டங்கள்
  rationale: நிர்ணயிக்கப்பட்ட விதிமுறைகள் என்ற பொருளைத் தெளிவான தமிழில் வழங்கி, மற்ற இரு சட்டச் சொற்களிலிருந்து இயன்றவரை வேறுபடுத்துகிறது.
- source_word: וְלַעֲשׂוֹת הַכֹּל
  choice: அவை அனைத்தையும் நிறைவேற்றவும்
  rationale: முன்னர் குறிப்பிடப்பட்ட கட்டளைகள், சாட்சிநெறிகள், சட்டங்கள் அனைத்தையும் செயல்படுத்துதல் என்பதைக் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְלִבְנוֹת הַבִּירָה
  choice: அரண்மனையைக் கட்டவும்
  rationale: בירה என்பதன் அரண் கொண்ட பிரமாண்டக் கட்டிடம்/அரண்மனை என்ற குறியீட்டைத் தக்கவைக்கிறது; சூழலில் இது தாவீது ஆயத்தம் செய்த ஆலயக் கட்டிடத்தைக் குறிக்கிறது என்பதைக் குறிப்பில் விளக்குகிறது.
- source_word: אֲשֶׁר הֲכִינוֹתִי
  choice: நான் ஆயத்தம் செய்துள்ள
  rationale: ஹிப்இல் வினையின் ‘தயார் செய்தல்’ பொருளையும், நிறைவேறிய ஆயத்தத்தின் நிகழ்காலப் பொருத்தத்தையும் காட்டுகிறது.
theological_decisions:
- issue: בִּירָה என்ற சொல்லுக்கும் எருசலேம் பரிசுத்த இடத்துக்கும் உள்ள தொடர்பு
  choice: அரண்மனை
  alternative: கோட்டை; ஆலயம்; அரண் போன்ற ஆலயம்
  rationale: இந்த அரிதான சொல் அரண் கொண்ட அல்லது அரண்மனை போன்ற பிரமாண்டக் கட்டிடத்தைக் குறிக்கலாம். இச்சூழலில் அது அரசரின் குடியிருப்பை அல்ல, சாலொமோன் கட்டுவதற்காகத் தாவீது ஆயத்தம் செய்த பரிசுத்த இடத்தைக் குறிக்கிறது. முதன்மை உரை சொல்லின் கட்டிட நிழலைத் தக்கவைத்து, சூழல்சார் அடையாளத்தை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
translation_notes:
  register: நவீன தரத் தமிழ்; இறைவனை நோக்கிய வேண்டுதலுக்கு ‘உமது’, ‘தாரும்’ என்ற கண்ணியமான வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. மூன்று சட்டச் சொற்களின் வேறுபாடு இயன்றவரை காக்கப்பட்டுள்ளது; வாக்கியம் ஜெபத்தின் தொடர்ச்சியான வேண்டுகோள் அமைப்பைத் தக்கவைக்கிறது.
