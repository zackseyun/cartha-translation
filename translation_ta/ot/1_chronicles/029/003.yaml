source:
  edition: WLC
  text: וְ/ע֗וֹד בִּ/רְצוֹתִ/י֙ בְּ/בֵ֣ית אֱלֹהַ֔/י יֶשׁ לִ֥/י סְגֻלָּ֖ה זָהָ֣ב וָ/כָ֑סֶף נָתַ֤תִּי לְ/בֵית אֱלֹהַ/י֙ לְ/מַ֔עְלָ/ה מִ/כָּל הֲכִינ֖וֹתִי לְ/בֵ֥ית הַ/קֹּֽדֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/003.yaml
  text: Moreover[a], because of my delight in the house of my God, I have a personal treasure of gold and silver, and I have given it to the house of my God[c][b], over and above all that I have prepared for the holy house.
translation:
  language: ta
  text: மேலும், என் தேவனுடைய இல்லத்தின்மேல் எனக்குள்ள விருப்பத்தினால்[a], என்னிடம் பொன்னும் வெள்ளியும் அடங்கிய தனிப்பட்ட பொக்கிஷம் உள்ளது[b]; பரிசுத்த இல்லத்திற்காக[c] நான் ஆயத்தம் செய்த எல்லாவற்றுக்கும் மேலாக, அதை என் தேவனுடைய இல்லத்திற்குக் கொடுத்திருக்கிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “என் தேவனுடைய இல்லத்தின்மேல் நான் கொண்டுள்ள மகிழ்ச்சியினால்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “எனக்குச் சொந்தமான சிறப்புப் பொக்கிஷம்” அல்லது “எனக்குச் சொந்தமான மதிப்புமிக்க உடைமை” என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் ஒருவருக்குச் சொந்தமான மதிப்புமிக்க செல்வத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: “பரிசுத்த ஸ்தலத்திற்காக” என்றும் மொழிபெயர்க்கலாம்; எழுத்துப்படி, “பரிசுத்தத்தின் இல்லத்திற்காக.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעוֹד
  choice: மேலும்
  rationale: முந்தைய வசனத்தில் கூறிய ஆயத்தங்களோடு இன்னொரு முக்கியமான செய்தியைச் சேர்க்கும் இணைப்பாக இயல்பாக அமைகிறது.
- source_word: בִּרְצוֹתִי בְּבֵית אֱלֹהַי
  choice: என் தேவனுடைய இல்லத்தின்மேல் எனக்குள்ள விருப்பத்தினால்
  rationale: רצון என்பதன் விருப்பம் அல்லது மனமகிழ்ச்சி என்ற பொருளையும், ב முன்னிடைச்சொல் குறிக்கும் நோக்கம்/சார்பையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יֶשׁ לִי
  choice: என்னிடம் ... இருக்கிறது
  rationale: எபிரெய உரையின் இருப்பை அடிப்படையாகக் கொண்ட உடைமை அமைப்பைத் தமிழில் இயல்பாகப் பிரதிபலிக்கிறது.
- source_word: סְגֻלָּה
  choice: எனக்குச் சொந்தமான அருமைப் ... பொக்கிஷம்
  rationale: மதிப்புமிக்க தனிப்பட்ட உடைமை என்ற சூழ்நிலைப் பொருளைப் பாதுகாத்து, ஆலயத்திற்காக ஏற்கெனவே ஆயத்தம் செய்தவற்றிலிருந்து தாவீதின் சொந்தச் செல்வத்தை வேறுபடுத்துகிறது.
- source_word: זָהָב וָכָסֶף
  choice: பொன், வெள்ளி
  rationale: இரு உலோகப் பெயர்களையும் நேரடியாகவும் தெளிவாகவும் மொழிபெயர்க்கிறது.
- source_word: נָתַתִּי
  choice: கொடுத்திருக்கிறேன்
  rationale: முடிவுற்ற செயல் தற்போதைய உரைக்கு இன்னும் தொடர்புடையது என்பதைத் தமிழின் நிறைவுநிலை வடிவில் தெரிவிக்கிறது.
- source_word: לְמַעְלָה מִכָּל הֲכִינוֹתִי
  choice: நான் ஆயத்தம் செய்த எல்லாவற்றுக்கும் மேலாக
  rationale: முன்பு ஆயத்தம் செய்த முழுத் தொகைக்கு மேலதிகமாகத் தனிப்பட்ட செல்வத்தையும் கொடுத்தார் என்ற ஒப்பீட்டு மற்றும் கூடுதல் பொருளைப் பாதுகாக்கிறது.
- source_word: לְבֵית הַקֹּדֶשׁ
  choice: பரிசுத்த இல்லத்திற்காக
  rationale: בית என்பதற்கு வசனம் முழுவதும் ‘இல்லம்’ என்று ஒரே சொல்லைப் பயன்படுத்தி, ‘பரிசுத்தத்திற்குரிய இல்லம்’ என்ற மூல அமைப்பை நெருக்கமாகப் பிரதிபலிக்கிறது.
theological_decisions:
- issue: தாவீதின் உரையில் ஆலயத்தைக் குறிக்கும் בית என்ற சொல்லின் மொழிபெயர்ப்பு
  choice: இல்லம் / பரிசுத்த இல்லம்
  alternative: ஆலயம் / பரிசுத்த ஸ்தலம்
  rationale: மூலத்தில் மீண்டும் மீண்டும் வரும் ‘இல்லம்’ என்ற உருவகத்தையும் தேவனுடைய வாசஸ்தலம் என்ற ஒலிப்பையும் பாதுகாக்கிறது; ‘ஆலயம்’ என்பது சரியான சூழ்நிலை விளக்கமாக இருந்தாலும் மூலச் சொல்லைவிட விளக்கமானது.
- issue: தாவீது கொடுத்த தனிப்பட்ட செல்வத்தின் தன்மை
  choice: எனக்குச் சொந்தமான அருமைப் பொன், வெள்ளிப் பொக்கிஷம்
  alternative: சிறப்புப் பொக்கிஷம் / தனிப்பட்ட உடைமை
  rationale: סְגֻלָּה என்பது மதிப்புமிக்க சொந்த உடைமையைச் சுட்டுகிறது. அரசுக் கருவூலம் அல்லது குறிப்பிட்ட வழிபாட்டுக் காணிக்கை என்று உரை கூறாததால் அத்தகைய விளக்கங்கள் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘தேவனுடைய இல்லம்’ என்ற தொடர் மூலத்தின் மறுமொழியைப் பாதுகாக்கிறது. நீண்ட எபிரெய வாக்கியம் தமிழில் தெளிவாகப் படிக்க அரைப்புள்ளியால் பிரிக்கப்பட்டுள்ளது; மூலத்தில் இல்லாத ‘காணிக்கை’ போன்ற வழிபாட்டுச் சொற்கள் சேர்க்கப்படவில்லை.
