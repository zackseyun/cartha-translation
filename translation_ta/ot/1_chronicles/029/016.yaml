base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/016.yaml
  text: O Yahweh our God[a], all this abundance that we have prepared to build you a house for your holy name is from your hand[c][b], and all things are yours.
translation:
  language: ta
  text: யாவே, எங்கள் கடவுளே, உமது பரிசுத்தப் பெயருக்காக உமக்கு ஒரு வீட்டைக் கட்டுவதற்கு நாங்கள் ஆயத்தப்படுத்தியுள்ள இந்தப் பெருங்குவியல்[a] அனைத்தும் உமது கையிலிருந்தே வந்தது[b]; அனைத்தும் உமக்கே உரியது[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இந்தப் பெருஞ்செல்வம்’ அல்லது ‘இவ்வளவு பெரிய சேமிப்பு’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் ஆலயத்திற்காகத் திரட்டப்பட்ட பெருமளவான பொருட்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எழுத்துப்படி, ‘உமது கையிலிருந்து அது.’
    reason: lexical_alternative
  - marker: c
    text: ‘எல்லாமே உம்முடையது’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் நேரடியாக இடம்பெறும் உடன்படிக்கைப் பெயரை, அதன் வழக்கமான தமிழ் ஒலிபெயர்ப்பாகத் தருகிறது.
- source_word: אֱלֹהֵינוּ
  choice: எங்கள் கடவுளே
  rationale: யாவே என்ற ஒருமைத் தெய்வப்பெயருடன் வரும் இச்சொல் ‘எங்கள் கடவுள்’ என்ற பொருளுடையது; அழைப்புமுறை தமிழில் ‘கடவுளே’ என இயல்பாக அமைகிறது.
- source_word: כֹל הֶהָמוֹן הַזֶּה
  choice: இந்தப் பெருங்குவியல் அனைத்தும்
  rationale: הָמוֹן என்பது பெருமளவு அல்லது திரட்டிவைக்கப்பட்ட மிகுதியைக் குறிக்கலாம். ஆலயத்திற்காகச் சேகரிக்கப்பட்ட பொருட்கள் இங்கு நோக்கப்படுவதால் ‘பெருங்குவியல்’ பொருளையும் சூழலையும் தெளிவாகத் தருகிறது.
- source_word: הֲכִינֹנוּ
  choice: நாங்கள் ஆயத்தப்படுத்தியுள்ள
  rationale: முடிக்கப்பட்ட ஆயத்தப் பணியின் தற்போதைய விளைவைத் தெரிவிக்க, எபிரெய நிறைவுவினை தமிழில் இவ்வாறு இயல்பாகத் தரப்பட்டுள்ளது.
- source_word: לִבְנוֹת לְךָ בַיִת
  choice: உமக்கு ஒரு வீட்டைக் கட்டுவதற்கு
  rationale: בַיִת என்பதன் அடிப்படைப் பொருளான ‘வீடு’ தக்கவைக்கப்படுகிறது; அதை நேரடியாக ‘ஆலயம்’ என்று விளக்குவதால் மூலத்தின் வீடு–ஆலயம் உருவகம் மறையக்கூடும்.
- source_word: לְשֵׁם קָדְשֶׁךָ
  choice: உமது பரிசுத்தப் பெயருக்காக
  rationale: கடவுளின் பரிசுத்தப் பெயருக்கென அந்த வீடு அர்ப்பணிக்கப்படுவதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מִיָּדְךָ הִיא
  choice: உமது கையிலிருந்தே வந்தது
  rationale: ‘உமது கையிலிருந்து அது’ என்ற எபிரெய உருவகத்தைப் பேணியபடி, இவை கடவுளிடமிருந்து கிடைத்தவை என்ற மூலப்பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: וּלְךָ הַכֹּל
  choice: அனைத்தும் உமக்கே உரியது
  rationale: அனைத்தின்மேலும் கடவுளுக்குள்ள உரிமையைத் தெளிவாகவும் சுருக்கமாகவும் தெரிவிக்கிறது; ‘-க்கே’ எபிரெய வலியுறுத்தலை இயல்பாகக் காட்டுகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் நான்கெழுத்துத் தெய்வப்பெயர் நேரடியாக உள்ளது. பொதுப்பட்டமான ‘கர்த்தர்’ என்பதற்குப் பதிலாகத் தனிப்பெயரை ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: בַיִת என்பதைக் ‘வீடு’ அல்லது ‘ஆலயம்’ என வழங்குதல்
  choice: வீடு
  alternative: ஆலயம்
  rationale: சூழலில் சாலொமோனின் ஆலயம் குறிக்கப்பட்டாலும், எபிரெயம் ‘வீடு’ என்றே கூறுகிறது. அந்தச் சொல்லின் உருவக மற்றும் இறையியல் அழுத்தத்தை விளக்கமாக மாற்றாமல் தக்கவைக்கிறது.
- issue: מִיָּדְךָ என்ற ‘கை’ உருவகம்
  choice: உமது கையிலிருந்தே வந்தது
  alternative: உம்மிடமிருந்தே கிடைத்தது
  rationale: கடவுளே பொருட்களின் ஆதாரம் என்ற கருத்தைத் தெளிவாகக் கூறுவதோடு, மூலத்தின் ‘கை’ உருவகத்தையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், ஜெபத்திற்கேற்ற கண்ணியமான நடையும் ‘உமது/உமக்கு’ என்ற மரியாதை ஒருமையும் பயன்படுத்தப்பட்டுள்ளன. மூலத்தின் ‘வீடு’ மற்றும் ‘கை’ உருவகங்கள் பாதுகாக்கப்பட்டுள்ளன; அரிதான அல்லது சமயப் பிரிவுசார் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
