  text: וַ/יֵּ֣שֶׁב שְׁ֠לֹמֹה עַל כִּסֵּ֨א יְהוָ֧ה לְ/מֶ֛לֶךְ תַּֽחַת דָּוִ֥יד אָבִ֖י/ו וַ/יַּצְלַ֑ח וַ/יִּשְׁמְע֥וּ אֵלָ֖י/ו כָּל יִשְׂרָאֵֽל־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/023.yaml
  text: Then Solomon sat on the throne of Yahweh as king in place of David his father[a], and he prospered, and all Israel listened to him.
translation:
  language: ta
  text: பின்பு சாலொமோன் தன் தந்தை தாவீதுக்குப் பதிலாக அரசனாக யாவேயின் அரியணையில் அமர்ந்தான். அவன் வெற்றியடைந்தான்; இஸ்ரவேலர் அனைவரும் அவனுக்குச் செவிகொடுத்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனுக்குக் கீழ்ப்படிந்தார்கள்.” எபிரேயச் சொற்றொடர் கவனித்துக் கேட்டலைக் குறிக்கலாம்; இந்த அரசச் சூழலில் கீழ்ப்படிதல் என்ற பொருளையும் தாங்குகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: அமர்ந்தான்
  rationale: ישׁב என்பதன் நேரடிப் பொருள் ‘அமர்ந்தான்.’ அரியணை என்ற தொடருடன் வருவதால் அரசேற்றத்தின் பொருளும் இயல்பாக வெளிப்படுகிறது; ‘அரியணையேறினான்’ என்று விரித்துரைக்காமல் எபிரேய உருவகத்தைத் தக்கவைக்கிறது.
- source_word: כִּסֵּא יְהוָה
  choice: யாவேயின் அரியணை
  rationale: ‘யாவேயின் அரியணை’ என்ற உடைமைத் தொடரை முறையாகப் பேணி, தாவீதிய அரசாட்சி யாவேயின் ஆட்சிக்குட்பட்ட பிரதிநிதித்துவ ஆட்சி என்ற வசனத்தின் இறையியல் அழுத்தத்தை விளக்கவுரை இன்றி நிலைநிறுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது ஒரு பட்டப்பெயர் அல்ல, இஸ்ரவேலின் தேவனுடைய தனிப்பெயரைக் குறிக்கும் நான்கெழுத்துத் திருப்பெயர்; ஆகவே தமிழில் இயல்பான ஒலிபெயர்ப்பாக ‘யாவே’ பயன்படுத்தப்படுகிறது.
- source_word: לְמֶלֶךְ
  choice: அரசனாக
  rationale: לְ இங்கு பதவி அல்லது பங்கைக் குறிக்கிறது; ‘அரசனாக’ என்பது தமிழில் தெளிவான, இயல்பான இணை.
- source_word: תַּחַת דָּוִיד אָבִיו
  choice: தன் தந்தை தாவீதுக்குப் பதிலாக
  rationale: அரச மரபுரிமைச் சூழலில் תַּחַת வெறும் காலவரிசையான ‘பின்பு’ என்பதைக் காட்டிலும் ஒருவரின் இடத்தை மற்றொருவர் ஏற்றதைக் குறிக்கிறது.
- source_word: וַיַּצְלַח
  choice: வெற்றியடைந்தான்
  rationale: צלח இங்கு அவனுடைய ஆட்சி வெற்றிகரமாக அமைந்ததைக் குறிக்கிறது. ‘செழித்தான்’ என்பது பொருளாதாரச் செழிப்பாக மட்டும் புரிந்துகொள்ளப்படக்கூடும் என்பதால் ‘வெற்றியடைந்தான்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: וַיִּשְׁמְעוּ אֵלָיו
  choice: அவனுக்குச் செவிகொடுத்தார்கள்
  rationale: שׁמע אל என்பதில் கவனித்துக் கேட்டல் மற்றும் அதிகாரத்திற்குக் கீழ்ப்படிதல் ஆகிய இரு நிழற்பொருள்களும் உள்ளன. ‘செவிகொடுத்தார்கள்’ இரண்டுக்கும் இடமளித்து எபிரேய மொழியின் உண்மையான நெகிழ்வைத் தக்கவைக்கிறது.
- source_word: כָּל יִשְׂרָאֵל
  choice: இஸ்ரவேலர் அனைவரும்
  rationale: தேசம் முழுவதையும் குறிக்கும் கூட்டுச் சொற்றொடரை நவீன தமிழில் இயல்பாக வழங்குகிறது.
theological_decisions:
- issue: ‘யாவேயின் அரியணை’ என்பதற்கும் சாலொமோனின் அரசாட்சிக்கும் உள்ள உறவு
  choice: மூலத்தின் ‘யாவேயின் அரியணை’ என்ற சொற்றொடரை அப்படியே தக்கவைத்தல்
  alternative: அதை வெறும் சாலொமோனின் அரச அரியணை என்று பொதுமைப்படுத்துதல் அல்லது ‘யாவேக்குச் சொந்தமான அரியணை’ என்று விளக்கமாக விரித்தல்
  rationale: நாளாகம ஆசிரியர் தாவீதிய அரசாட்சியை யாவேயின் ஆட்சியின் கீழும் அவர் சார்பாகவும் நடைபெறும் அரசாட்சியாக முன்வைக்கிறார். மொழிபெயர்ப்பு அந்தக் கூற்றைப் பேணுகிறது; ஆனால் அதன் இயல்பை ஒரு குறிப்பிட்ட பிற்கால இறையியல் அமைப்பின்படி வரையறுக்கவில்லை.
- issue: 'இஸ்ரவேலின் பதில்: கேட்டலா அல்லது கீழ்ப்படிதலா'
  choice: ‘செவிகொடுத்தார்கள்’ என்று இரு பொருள் நிழல்களையும் திறந்துவைத்தல்
  alternative: ‘கீழ்ப்படிந்தார்கள்’ என்று அதிகாரத்திற்கான கீழ்ப்படிதலை மட்டும் வெளிப்படையாகக் கூறுதல்
  rationale: அரசச் சூழல் கீழ்ப்படிதலை வலியுறுத்தினாலும், எபிரேய வினை கவனித்துக் கேட்டல் என்ற அடிப்படைப் பொருளையும் கொண்டுள்ளது. மொழிபெயர்ப்பு அந்த இறுக்கத்தைத் தீர்த்துவிடாமல் பேணுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான, வாசிக்க எளிய நடையைக் கடைப்பிடிக்கிறது. நீண்ட எபிரேய இணைப்புத் தொடரை தமிழின் இயல்புக்கேற்ப இரண்டு வாக்கியங்களாகப் பிரித்தாலும் கருத்துகளின் வரிசை பேணப்பட்டுள்ளது. அடிக்குறிப்பு குறி அது விளக்கும் இறுதி வினைத்தொடருக்குப் பின் வைக்கப்பட்டுள்ளது.
