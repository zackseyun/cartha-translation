  text: וַ/יִּזְבְּח֣וּ לַ/יהוָ֣ה זְ֠בָחִים וַ/יַּעֲל֨וּ עֹל֜וֹת לַ/יהוָ֗ה לְֽ/מָחֳרַת֮ הַ/יּ֣וֹם הַ/הוּא֒ פָּרִ֨ים אֶ֜לֶף אֵילִ֥ים אֶ֛לֶף כְּבָשִׂ֥ים אֶ֖לֶף וְ/נִסְכֵּי/הֶ֑ם וּ/זְבָחִ֥ים לָ/רֹ֖ב לְ/כָל יִשְׂרָאֵֽל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/021.yaml
  text: 'They sacrificed sacrifices to Yahweh and offered up burnt offerings to Yahweh on the next day after that day: one thousand bulls[a], one thousand rams, one thousand lambs, and their drink offerings[c][b], and sacrifices in abundance for all Israel.'
translation:
  language: ta
  text: 'அவர்கள் அந்த நாளின் மறுநாளில்[a] யாவேக்குப் பலிகளைச் செலுத்தி, யாவேக்கு எரிபலிகளையும் அர்ப்பணித்தார்கள்: ஆயிரம் காளைகள், ஆயிரம் செம்மறியாட்டுக் கடாக்கள், ஆயிரம் செம்மறியாட்டுக் குட்டிகள், அவற்றுக்குரிய பானபலிகள்[b] ஆகியவற்றையும், இஸ்ரவேலர் அனைவருக்காகவும்[c] ஏராளமான பலிகளையும் செலுத்தினார்கள்.


    [a] எபிரெய மொழியில் சொல்லுக்கு சொல், “அந்த நாளின் மறுநாளில்”; இயல்பாக, “அடுத்த நாளில்” என்றும் மொழிபெயர்க்கலாம்.


    [b] “பானபலிகள்” என்பது விலங்குப் பலிகளுடன் சேர்த்து ஊற்றப்பட்ட திரவக் காணிக்கைகளைக் குறிக்கிறது.


    [c] அல்லது, “இஸ்ரவேலர் அனைவரின் சார்பாகவும்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் சொல்லுக்கு சொல், “அந்த நாளின் மறுநாளில்”; இயல்பாக, “அடுத்த நாளில்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “பானபலிகள்” என்பது விலங்குப் பலிகளுடன் சேர்த்து ஊற்றப்பட்ட திரவக் காணிக்கைகளைக் குறிக்கிறது.
    reason: cultural_note
  - marker: c
    text: அல்லது, “இஸ்ரவேலர் அனைவரின் சார்பாகவும்.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּזְבְּחוּ ... זְבָחִים
  choice: பலிகளைச் செலுத்தி
  rationale: வினைச்சொல்லும் அதே வேரிலான பெயர்ச்சொல்லும் பலியிடுதலை வலியுறுத்துகின்றன. தமிழில் இயல்பாகவும் வழிபாட்டுச் சூழலைத் தெளிவாகவும் காட்ட “பலிகளைச் செலுத்தி” என மொழிபெயர்க்கப்பட்டது.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: יהוה என்ற இறைப் பெயரை மறைக்காமல், நவீன தமிழில் அதன் ஒலிப்புக்கு ஏற்றவாறு “யாவே” என எழுத்துப்பெயர்த்துள்ளது; ל அர்ப்பணிப்பின் இலக்கைச் சுட்டுவதால் “யாவேக்கு” என வழங்கப்பட்டது.
- source_word: עֹלוֹת
  choice: எரிபலிகள்
  rationale: பலிபீடத்தில் முழுமையாக எரிக்கப்பட்ட காணிக்கைகளைக் குறிக்கும் வழிபாட்டுச் சொல். “எரிபலிகள்” சுருக்கமாகவும் தமிழில் புரியத்தக்கதாகவும் உள்ளது.
- source_word: לְמָחֳרַת הַיּוֹם הַהוּא
  choice: அந்த நாளுக்கு மறுநாளில்
  rationale: எபிரெய தொடரின் கால வரிசையையும் சற்றே வலியுறுத்தப்பட்ட அமைப்பையும் காக்கிறது; மென்மையான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: פָּרִים אֶלֶף
  choice: ஆயிரம் காளைகள்
  rationale: פָּרִים பலிக்குரிய வளர்ந்த ஆண் மாடுகளைக் குறிக்கிறது; “காளைகள்” துல்லியமான இயல்பான இணைச்சொல்.
- source_word: אֵילִים אֶלֶף
  choice: ஆயிரம் செம்மறியாட்டுக் கடாக்கள்
  rationale: אֵילִים பொதுவான ஆடுகளை அல்ல, ஆண் செம்மறியாடுகளைக் குறிப்பதால் பாலின வேறுபாடு காக்கப்பட்டுள்ளது.
- source_word: כְּבָשִׂים אֶלֶף
  choice: ஆயிரம் செம்மறியாட்டுக் குட்டிகள்
  rationale: பலிச் சூழலில் כְּבָשִׂים இளம் செம்மறியாடுகளைக் குறிக்கிறது; “குட்டிகள்” வயது வேறுபாட்டைத் தெளிவாக்குகிறது.
- source_word: וְנִסְכֵּיהֶם
  choice: அவற்றுக்குரிய பானபலிகள்
  rationale: இவை பட்டியலிடப்பட்ட விலங்குப் பலிகளோடு இணைந்த திரவக் காணிக்கைகள். “அவற்றுக்குரிய” என்ற சொல் எபிரெய உடைமைப் பின்னொட்டை வெளிப்படுத்துகிறது; பண்பாட்டு விளக்கம் அடிக்குறிப்பில் உள்ளது.
- source_word: וּזְבָחִים לָרֹב
  choice: ஏராளமான பலிகள்
  rationale: לָרֹב மிகுதியான எண்ணிக்கையைத் தெரிவிக்கிறது; முன்னர் எண்ணப்பட்ட எரிபலிகளுக்கு மேலான பலிகளை இத்தொடர் குறிக்கக்கூடும் என்பதால் பொதுவான சொல் காக்கப்பட்டுள்ளது.
- source_word: לְכָל יִשְׂרָאֵל
  choice: இஸ்ரவேல் அனைவருக்காகவும்
  rationale: ל என்ற முன்னிடைச்சொல் பயன் அல்லது சார்பு என்ற பரந்த பொருளை அனுமதிக்கிறது. “அனைவருக்காகவும்” என்ற மொழிபெயர்ப்பு பிரதிநிதித்துவப் பலியியல் கருத்தை அவசியமின்றி வலுப்படுத்தாது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல உரை உடன்படிக்கையின் தனிப்பெயரான יהוה என்பதை நேரடியாகப் பயன்படுத்துகிறது. அதை பொதுப் பட்டப்பெயராக மாற்றாமல் ஒலிப்பெயர்ப்பது மூலத்தின் வேறுபாட்டைக் காக்கிறது.
- issue: לְכָל יִשְׂרָאֵל என்பதன் பலியியல் சார்பு
  choice: இஸ்ரவேல் அனைவருக்காகவும்
  alternative: இஸ்ரவேல் அனைவரின் சார்பாகவும்
  rationale: எபிரெய ל பரந்த “ஆக/நிமித்தம்” பொருளைக் கொண்டிருக்கலாம். பிரதிநிதித்துவப் பரிகாரக் கருத்தை வசனம் வெளிப்படையாகச் சொல்வதைவிட வலுப்படுத்தாமல், மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன பொதுத்தமிழில், வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. “எரிபலி,” “பானபலி” போன்ற நிலையான சமயச் சொற்கள் துல்லியத்திற்காக வைக்கப்பட்டுள்ளன; அரிதாக இருக்கக்கூடிய “பானபலி” அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது. எபிரெய மூலத்தின் பட்டியல் அமைப்பும் எண்ணிக்கைகளும் தெளிவாகப் பாதுகாக்கப்பட்டுள்ளன.
