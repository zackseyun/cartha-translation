  to: 'அவர்கள் அந்த நாளின் மறுநாளில்[a] யாவேக்குப் பலிகளைச் செலுத்தி, யாவேக்கு எரிபலிகளையும் அர்ப்பணித்தார்கள்: ஆயிரம் காளைகள், ஆயிரம் செம்மறியாட்டுக் கடாக்கள், ஆயிரம் செம்மறியாட்டுக் குட்டிகள், அவற்றுக்குரிய பானபலிகள்[b] ஆகியவற்றையும், இஸ்ரவேலர் அனைவருக்காகவும்[c] ஏராளமான பலிகளையும் செலுத்தினார்கள்.


