  text: וּֽ/כְ/כָל כֹּחִ֞/י הֲכִינ֣וֹתִי לְ/בֵית אֱלֹהַ֗/י הַ/זָּהָ֣ב לַ֠/זָּהָב וְ/הַ/כֶּ֨סֶף לַ/כֶּ֜סֶף וְ/הַ/נְּחֹ֣שֶׁת לַ/נְּחֹ֗שֶׁת הַ/בַּרְזֶל֙ לַ/בַּרְזֶ֔ל וְ/הָ/עֵצִ֖ים לָ/עֵצִ֑ים אַבְנֵי שֹׁ֨הַם וּ/מִלּוּאִ֜ים אַבְנֵי פ֣וּךְ וְ/רִקְמָ֗ה וְ/כֹ֨ל אֶ֧בֶן יְקָרָ֛ה וְ/אַבְנֵי שַׁ֖יִשׁ לָ/רֹֽב־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/002.yaml
  text: 'And with all my strength I have prepared for the house of my God: the gold for the things of gold[a], and the silver for the things of silver, and the bronze for the things of bronze, the iron for the things of iron, and the wood for the things of wood; onyx stones, settings, stones of antimony, variegated stones, every precious stone[d][c][b], and marble stones in abundance.'
translation:
  language: ta
  text: 'என் முழு வலிமையுடன் என் தேவனுடைய இல்லத்திற்காக நான் ஆயத்தம் செய்திருக்கிறேன்: பொன்னால் செய்யப்பட வேண்டியவற்றுக்குப் பொன்னையும், வெள்ளியால் செய்யப்பட வேண்டியவற்றுக்கு வெள்ளியையும், வெண்கலத்தால் செய்யப்பட வேண்டியவற்றுக்கு வெண்கலத்தையும், இரும்பால் செய்யப்பட வேண்டியவற்றுக்கு இரும்பையும், மரத்தால் செய்யப்பட வேண்டியவற்றுக்கு மரத்தையும்; ஓனிக்ஸ் கற்களையும்[a], பதிப்பமைப்புகளையும்[b], அந்திமோனி கற்களையும்[c], பலவண்ணக் கற்களையும்[d], ஒவ்வொரு விலையுயர்ந்த கல்லையும், ஏராளமான பளிங்குக் கற்களையும்[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: שֹׁהַם மற்றும் שַׁיִשׁ என்ற கற்களின் துல்லிய அடையாளம் உறுதியில்லை. இங்கு முறையே ‘ஓனிக்ஸ்’ மற்றும் ‘பளிங்கு’ என்ற பொதுவான மரபுப் பெயர்கள் பயன்படுத்தப்பட்டுள்ளன; வேறு அடையாளங்களும் முன்மொழியப்பட்டுள்ளன.
    reason: lexical_alternative
  - marker: b
    text: மூலச்சொல் (מִלּוּאִים) ‘பிடிப்பமைப்புகள்,’ ‘பதிப்புகள்’ அல்லது ‘உள்ளிடும் அலங்கார வேலைப்பாடுகள்’ என்றும் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: c
    text: ‘அந்திமோனி கற்கள்’ என்று மொழிபெயர்க்கப்பட்ட தொடர் (אַבְנֵי פוּךְ) பொருள் காண்பதற்குக் கடினமானது. அது கருமையான நிறமியுடன் தொடர்புடைய கற்களையோ, அலங்காரப் பதிப்புப் பொருளையோ, வேறொரு அலங்காரத் தாதுவையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: d
    text: ‘பலவண்ணக் கற்கள்’ என்பது இங்குள்ள கற்கள் மற்றும் கட்டுமானப் பொருட்களின் பட்டியலைக் கருத்தில் கொண்டு רִקְמָה என்பதற்கு அளிக்கப்பட்ட மொழிபெயர்ப்பு. வேறு இடங்களில் இச்சொல் பூவேலைப்பாட்டையோ செறிவான வண்ண வேலைப்பாட்டையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְכָל כֹּחִי
  choice: என் முழு வலிமையோடும்
  rationale: כֹּחַ என்பது வலிமை, ஆற்றல், திறன் ஆகியவற்றைக் குறிக்கலாம். தாவீது தன்னால் இயன்ற அனைத்தையும் அர்ப்பணித்ததை இயல்பான தமிழில் இது வெளிப்படுத்துகிறது.
- source_word: הֲכִינוֹתִי
  choice: நான் ஆயத்தம் செய்திருக்கிறேன்
  rationale: முடிவுற்றிருந்தாலும் அப்போதைய உரைக்குத் தொடர்ந்த தொடர்புடைய செயலை எபிரெய நிறைவுவினை சுட்டுகிறது; தமிழ் நிகழ்கால நிறைவு வடிவம் இதை இயல்பாகத் தருகிறது.
- source_word: לְבֵית אֱלֹהַי
  choice: என் தேவனுடைய இல்லத்திற்காக
  rationale: בַּיִת என்பதன் அடிப்படை உருவகமான ‘இல்லம்’ என்பதைக் காத்து, இங்கு தேவாலயக் கட்டடம் குறிக்கப்படுவதைச் சூழல் தெளிவாக்க அனுமதிக்கிறது.
- source_word: הַזָּהָב לַזָּהָב ... וְהָעֵצִים לָעֵצִים
  choice: பொன்னால் செய்யப்பட வேண்டியவற்றுக்குப் பொன்னையும் … மரத்தால் செய்யப்பட வேண்டியவற்றுக்கு மரத்தையும்
  rationale: ஒரே பொருட்பெயர் ל முன்னொட்டுடன் மீண்டும் வரும் அமைப்பு, அந்தந்தப் பொருளால் செய்யப்படும் வேலைகளுக்காக அது ஒதுக்கப்பட்டதைக் குறிக்கிறது. தமிழில் தேவையான சொற்களைச் சேர்த்து இணைநடையைத் தெளிவாக வைத்திருக்கிறது.
- source_word: נְחֹשֶׁת
  choice: வெண்கலம்
  rationale: இந்தச் சொல் செம்பையோ வெண்கலத்தையோ குறிக்கலாம்; ஆலயப் பொருட்களின் சூழலில் ‘வெண்கலம்’ மரபானதும் பொருத்தமானதும் ஆகும்.
- source_word: אַבְנֵי שֹׁהַם
  choice: ஓனிக்ஸ் கற்கள்
  rationale: שֹׁהַם என்ற ரத்தினத்தின் துல்லிய அடையாளம் உறுதியில்லை. பொதுவான மரபுப் பெயரான ‘ஓனிக்ஸ்’ பயன்படுத்தப்பட்டு, ஐயம் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: וּמִלּוּאִים
  choice: கற்களைப் பதிப்பதற்கான அமைப்புகள்
  rationale: மூலச்சொல் நிரப்புதல்கள், பதிப்புகள் அல்லது கற்களுக்கான பிடிப்பமைப்புகளைக் குறிக்கக்கூடும். சூழலுக்கேற்ற செயல்பாட்டைத் தெளிவாகவும் அளவுக்கு மீறிய விளக்கமின்றியும் இத்தொடர் தருகிறது.
- source_word: אַבְנֵי פוּךְ
  choice: அந்திமோனி கற்கள்
  rationale: פּוּךְ பொதுவாகக் கருமையான ஒப்பனைத் தாதுவாகிய அந்திமோனியைக் குறிக்கிறது; முழுத் தொடரின் பொருள் கடினமானதால், ஊகமான விளக்கத்தை உரையில் புகுத்தாமல் மூலத்துக்கு நெருக்கமான பெயர் வைக்கப்பட்டுள்ளது.
- source_word: וְרִקְמָה
  choice: பலவண்ணக் கற்கள்
  rationale: רִקְמָה வேறு இடங்களில் வண்ண வேலைப்பாடு அல்லது பூவேலைப்பாட்டைக் குறிக்கலாம். இங்குள்ள கற்கள் மற்றும் கட்டுமானப் பொருட்களின் பட்டியலில் பலவண்ணக் கற்கள் அல்லது கல் வேலைப்பாடு என்பதே சூழலுக்கு ஏற்றது.
- source_word: וְאַבְנֵי שַׁיִשׁ לָרֹב
  choice: ஏராளமான பளிங்குக் கற்கள்
  rationale: שַׁיִשׁ மரபாகப் பளிங்கு எனப் புரிந்துகொள்ளப்படுகிறது; לָרֹב மிகுதியைக் குறிப்பதால் ‘ஏராளமான’ என மொழிபெயர்க்கப்பட்டுள்ளது.
