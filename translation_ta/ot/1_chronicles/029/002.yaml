- from: 'என் முழு வலிமையோடும் என் தேவனுடைய இல்லத்திற்காக நான் ஆயத்தம் செய்திருக்கிறேன்: பொன்னால் செய்யப்பட வேண்டியவற்றுக்குப் பொன்னையும், வெள்ளியால் செய்யப்பட வேண்டியவற்றுக்கு வெள்ளியையும், வெண்கலத்தால் செய்யப்பட வேண்டியவற்றுக்கு வெண்கலத்தையும், இரும்பால் செய்யப்பட வேண்டியவற்றுக்கு இரும்பையும், மரத்தால் செய்யப்பட வேண்டியவற்றுக்கு மரத்தையும் ஆயத்தம் செய்திருக்கிறேன். மேலும், ஓனிக்ஸ் கற்களையும்[a], கற்களைப் பதிப்பதற்கான அமைப்புகளையும்[b], அந்திமோனி கற்களையும்[c], பலவண்ணக் கற்களையும்[d], எல்லா வகையான விலையுயர்ந்த கற்களையும், ஏராளமான பளிங்குக் கற்களையும்[a] ஆயத்தம் செய்திருக்கிறேன்.'
  to: 'என் முழு வலிமையுடன் என் தேவனுடைய இல்லத்திற்காக நான் ஆயத்தம் செய்திருக்கிறேன்: பொன்னால் செய்யப்பட வேண்டியவற்றுக்குப் பொன்னையும், வெள்ளியால் செய்யப்பட வேண்டியவற்றுக்கு வெள்ளியையும், வெண்கலத்தால் செய்யப்பட வேண்டியவற்றுக்கு வெண்கலத்தையும், இரும்பால் செய்யப்பட வேண்டியவற்றுக்கு இரும்பையும், மரத்தால் செய்யப்பட வேண்டியவற்றுக்கு மரத்தையும்; ஓனிக்ஸ் கற்களையும்[a], பதிப்பமைப்புகளையும்[b], அந்திமோனி கற்களையும்[c], பலவண்ணக் கற்களையும்[d], ஒவ்வொரு விலையுயர்ந்த கல்லையும், ஏராளமான பளிங்குக் கற்களையும்[a].'
  rationale: 'சிறிய திருத்தங்கள் மட்டுமே செய்யப்பட்டுள்ளன: மூலத்தின் ஒருமை-விநியோகமான ‘ஒவ்வொரு விலையுயர்ந்த கல்’ காக்கப்பட்டது; ஒரே எபிரெய வினை ஆளும் தொடர்ச்சியான பட்டியல் அமைப்பு தமிழிலும் மீட்டெடுக்கப்பட்டது; மேலும் מִלּוּאִים-க்கு உரையில் சுருக்கமான ‘பதிப்பமைப்புகள்’ தேர்ந்தெடுக்கப்பட்டு, அதன் மாற்றுப்பொருள்கள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.'
