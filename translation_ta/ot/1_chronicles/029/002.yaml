translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. உலோகங்களையும் மரத்தையும் வரிசைப்படுத்தும் எபிரெய இணைநடை காக்கப்பட்டுள்ளது; தமிழில் வாக்கியம் மிக நீளமாவதைத் தவிர்க்க இறுதி பொருட்பட்டியல் தனி வாக்கியமாகத் தொடர்கிறது. அரிதான கற்களின் அடையாளம் உரையில் உறுதிப்படுத்தப்படாமல் அடிக்குறிப்புகளில் ஐயத்துடன் பாதுகாக்கப்பட்டுள்ளது.
