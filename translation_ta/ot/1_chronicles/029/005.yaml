source:
  edition: WLC
  text: לַ/זָּהָ֤ב לַ/זָּהָב֙ וְ/לַ/כֶּ֣סֶף לַ/כֶּ֔סֶף וּ/לְ/כָל מְלָאכָ֖ה בְּ/יַ֣ד חָרָשִׁ֑ים וּ/מִ֣י מִתְנַדֵּ֔ב לְ/מַלֹּ֥אות יָד֛/וֹ הַ/יּ֖וֹם לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/005.yaml
  text: gold for the things of gold[a], and silver for the things of silver, and for every kind of work by the hands of craftsmen. And who is willing to fill his hand today for Yahweh?
translation:
  language: ta
  text: பொன்னாலான பொருட்களுக்குப் பொன்னும், வெள்ளியாலான பொருட்களுக்கு வெள்ளியும், கைவினைஞர்கள் செய்யும் எல்லாவித வேலைகளுக்கும் தேவையான பொருட்களும். இன்று யாவேவுக்காகத் தன் கையை நிரப்ப[a] மனமுவந்து முன்வருகிறவன் யார்?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், “தன் கையை நிரப்ப.” இந்த எபிரெய வழக்குத்தொடர், தன்னை அர்ப்பணிப்பதையோ பரிசுத்தச் சேவைக்காகக் காணிக்கை அளிப்பதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַזָּהָב לַזָּהָב
  choice: பொன்னால் செய்யப்படுபவற்றுக்குப் பொன்னும்
  rationale: எபிரெயச் சொற்றொடரின் நீள்விடுபாட்டை இயல்பான தமிழில் தெளிவாக்குகிறது; பொன்னால் செய்யப்படும் பொருட்களுக்கென ஒதுக்கப்பட்ட பொன்னைக் குறிக்கிறது.
- source_word: וְלַכֶּסֶף לַכֶּסֶף
  choice: வெள்ளியால் செய்யப்படுபவற்றுக்கு வெள்ளியும்
  rationale: முந்தைய பொன் பற்றிய இணையான சொற்றொடரின் அமைப்பையும் பொருளையும் காக்கிறது.
- source_word: וּלְכָל מְלָאכָה בְּיַד חָרָשִׁים
  choice: கைவினைஞர்களின் கைகளால் செய்யப்படும் எல்லா வேலைகளுக்குத் தேவையானவற்றையும்
  rationale: ‘கை’ என்ற எபிரெயப் படிமத்தைக் காத்து, திறமையான கைவினைஞர்கள் மேற்கொள்ளும் எல்லா பணிகளுக்கான பொருட்கள் என்ற சூழல்சார் பொருளைத் தெளிவாக்குகிறது.
- source_word: וּמִי מִתְנַדֵּב
  choice: மனமுவந்து முன்வருகிறவன் யார்?
  rationale: נדב என்பதன் தன்னார்வமான, கட்டாயமற்ற முன்வருதலை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: לְמַלֹּאות יָדוֹ
  choice: தன் கையை நிரப்ப
  rationale: சொல்லிடையை விளக்கமாக ஒரு பொருளில் மட்டும் முடக்காமல், எபிரெய வழக்குத்தொடரின் உருவகத்தையும் அதன் அர்ப்பணிப்பு/காணிக்கை சார்ந்த தெளிவின்மையையும் காக்கிறது.
- source_word: הַיּוֹם
  choice: இன்று
  rationale: காலக் குறிப்பின் நேரடியான, இயல்பான தமிழாக்கம்.
- source_word: לַיהוָה
  choice: யாவேவுக்காக
  rationale: தேவனுடைய தனிப்பெயரைப் பெயராகவே வழங்கி, ל முன்னிடைச்சொல்லின் பயன்/அர்ப்பணிப்பு நோக்கை தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יהוה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் வரும் உடன்படிக்கைப் பெயரை பொதுப்பட்டமாக மாற்றாமல், தமிழில் ஒலிபெயர்த்துக் காக்கிறது.
- issue: לְמַלֹּאות יָדוֹ என்ற வழிபாட்டுச் சூழல் வழக்குத்தொடர்
  choice: தன் கையை நிரப்ப
  alternative: தன்னை அர்ப்பணிக்க / பரிசுத்தப் பணிக்குக் காணிக்கை அளிக்க
  rationale: இந்த இடத்தில் தன்னை அர்ப்பணித்தல், புனிதப் பணிக்கான காணிக்கை அளித்தல் ஆகிய பொருள் நிழல்கள் உள்ளன. முதன்மை உரை அவற்றில் ஒன்றை மட்டும் தீர்மானிக்காமல் எபிரெய உருவகத்தைக் காக்கிறது; அடிக்குறிப்பு அதன் சாத்தியமான பொருள்களை விளக்குகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. வசனம் முந்தைய பட்டியலின் தொடராக இருப்பதால் தொடக்க இணை அமைப்பு காக்கப்பட்டுள்ளது; இறுதி வினா தாவீதின் நேரடியான அழைப்பாக இயல்பாக அமைக்கப்பட்டுள்ளது.
