base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/007.yaml
  text: And they gave for the service of the house of God five thousand talents of gold and ten thousand darics[a], and ten thousand talents of silver, and eighteen thousand talents of bronze[c][b], and one hundred thousand talents of iron.
translation:
  language: ta
  text: அவர்கள் தேவனுடைய ஆலயப் பணிக்காக ஐயாயிரம் தாலந்து[a] தங்கத்தையும், பத்தாயிரம் தரீக்குகளையும்[b], பத்தாயிரம் தாலந்து வெள்ளியையும், பதினெட்டாயிரம்[d] தாலந்து வெண்கலத்தையும்[c], நூறாயிரம் தாலந்து இரும்பையும் கொடுத்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தாலந்து’ என்பது திறமையைக் குறிக்கும் இக்காலச் சொல் அல்ல; அது ஒரு பெரிய பண்டைய எடை அலகு.
    reason: cultural_note
  - marker: b
    text: ‘தரீக்கு’ என்பது ஒரு பாரசீகத் தங்க நாணயம்.
    reason: cultural_note
  - marker: c
    text: ‘வெண்கலம்’ என்பதற்கான எபிரெயச் சொல் ‘செம்பு’ என்றும் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: d
    text: எபிரெயில், ‘பத்தாயிரமும் எட்டாயிரமும் தாலந்து வெண்கலம்’ என்று உள்ளது; மொத்தம் பதினெட்டாயிரம்.
    reason: source_form
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: கொடுத்தார்கள்
  rationale: נתן என்பதன் நேரடியான பொருளையும், முடிவுற்ற நிகழ்வைச் சுட்டும் எபிரெயக் கதைநடையையும் இயல்பான தமிழில் தருகிறது; ‘நன்கொடையாக அளித்தார்கள்’ என்பது சூழலுக்குப் பொருந்தினாலும் மூலத்தில் இல்லாத விளக்கத்தைச் சேர்க்கும்.
- source_word: לַעֲבוֹדַת
  choice: பணிக்காக
  rationale: עֲבוֹדָה என்பது பணி, வேலை, சேவை ஆகிய பொருட்களைக் கொள்ளலாம். ஆலயம் தொடர்பான கட்டுமானப் பணியையும் சேவையையும் மிகையாகக் குறுக்காமல் ‘பணிக்காக’ இயல்பாகத் தருகிறது.
- source_word: בֵּית הָאֱלֹהִים
  choice: தேவனுடைய ஆலயம்
  rationale: சொல்லுக்கு சொல் ‘தேவனுடைய வீடு’ என்றாலும், இச்சூழலில் வழிபாட்டுக்குரிய கட்டிடத்தைக் குறிக்கும் பொருளை நவீன தமிழில் தெளிவாகவும் கண்ணியமாகவும் தெரிவிக்கிறது.
- source_word: כִּכָּרִים
  choice: தாலந்து
  rationale: இங்கு כִּכָּר என்பது பெரிய எடை அலகு. வரலாற்றுச் சிறப்புடைய வழக்கமான பெயர்ப்பை வைத்துக்கொண்டு அதன் பொருளை அடிக்குறிப்பில் தெளிவுபடுத்துகிறது.
- source_word: אֲדַרְכֹנִים
  choice: தரீக்குகள்
  rationale: பாரசீகத் தங்க நாணயத்தைக் குறிக்கும் வரலாற்றுப் பெயரை ஒலிபெயர்க்கிறது; பொதுவாக ‘தங்க நாணயங்கள்’ என்று மாற்றுவது அதன் தனிச்சிறப்பை இழக்கச் செய்யும்.
- source_word: נְחֹשֶׁת
  choice: வெண்கலம்
  rationale: נְחֹשֶׁת செம்பையோ வெண்கலத்தையோ குறிக்கக்கூடும். பண்டைய ஆலயப் பொருட்களின் சூழலில் வழக்கமான ‘வெண்கலம்’ முதன்மைப் பெயர்ப்பாகத் தேர்ந்தெடுக்கப்பட்டு, மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: רִבּוֹ וּשְׁמוֹנַת אֲלָפִים
  choice: பதினெட்டாயிரம்
  rationale: மூலத்தின் ‘பத்தாயிரமும் எட்டாயிரமும்’ என்ற கூட்டுத்தொகையை இயல்பான தமிழில் பதினெட்டாயிரம் என்று தருகிறது; எபிரெய வடிவம் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
