  text: וַ/יִּֽתְנַדְּבוּ֩ שָׂרֵ֨י הָ/אָב֜וֹת וְ/שָׂרֵ֣י שִׁבְטֵ֣י יִשְׂרָאֵ֗ל וְ/שָׂרֵ֤י הָ/אֲלָפִים֙ וְ/הַ/מֵּא֔וֹת וּ/לְ/שָׂרֵ֖י מְלֶ֥אכֶת הַ/מֶּֽלֶךְ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/006.yaml
  text: Then the leaders of the fathers’ houses[a], and the leaders of the tribes of Israel, and the commanders of the thousands and of the hundreds, and the overseers of the king’s work[c][b], gave willingly.
translation:
  language: ta
  text: அப்போது தந்தைவழிக் குடும்பங்களின் தலைவர்களும்[a], இஸ்ரவேலின் கோத்திரங்களின் தலைவர்களும், ஆயிரவர் மற்றும் நூறுவர் பிரிவுகளின் தலைவர்களும்[b], அரசனுடைய பணியை மேற்பார்வையிட்ட அதிகாரிகளும் மனமுவந்து கொடுத்தார்கள்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “தந்தையரின் வீடுகள்”; இது மூதாதையர் அல்லது குல அடிப்படையில் அமைந்த குடும்பப் பிரிவுகளைக் குறிக்கிறது.
    reason: cultural_note
  - marker: b
    text: “ஆயிரங்களும் நூறுகளும்” என்பது இராணுவ அல்லது நிர்வாகப் பிரிவுகளைக் குறிக்கலாம்; இங்கு அந்தப் பிரிவுகளின் தலைவர்கள் குறிப்பிடப்படுகிறார்கள்.
    reason: cultural_note
  - marker: c
    text: “மனமுவந்து காணிக்கை அளித்தார்கள்” அல்லது “தாமாக முன்வந்தார்கள்” என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல் கட்டாயமற்ற மனப்பூர்வமான செயலை வலியுறுத்துகிறது; இச்சூழலில் அது தன்னார்வமாகப் பொருள் கொடுத்ததைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְנַדְּבוּ
  choice: மனமுவந்து கொடுத்தார்கள்
  rationale: נדב என்பதன் ஹித்பயேல் வடிவம் கட்டாயமற்ற, தன்னார்வமான முன்வருதலைக் குறிக்கிறது. சுற்றியுள்ள வசனங்களில் பொருள் கொடுப்பதே சூழல் என்பதால், ‘மனமுவந்து கொடுத்தார்கள்’ என்பது தன்னார்வத்தையும் நன்கொடையையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: שָׂרֵי
  choice: தலைவர்கள்
  rationale: பல்வேறு சமூக, கோத்திர, நிர்வாகப் பிரிவுகளில் அதிகாரம் வகித்தவர்களைப் பொதுவாகவும் தெளிவாகவும் குறிக்கிறது; ‘அதிபதிகள்’ அல்லது ‘பிரபுக்கள்’ எனக் கூறி அரசகுலப் பொருளைத் தேவையின்றி சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: הָאָבוֹת
  choice: தந்தைவழிக் குடும்பங்கள்
  rationale: நாளாகமத்தில் இது மூதாதையர் வழியிலான குல அல்லது குடும்பப் பிரிவுகளைக் குறிக்கிறது. ‘தந்தைவழிக் குடும்பங்கள்’ அந்தச் சமூக அமைப்பை நவீனத் தமிழில் தெளிவாக எடுத்துரைக்கிறது.
- source_word: שִׁבְטֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கோத்திரங்கள்
  rationale: இஸ்ரவேலின் மரபுவழிக் கோத்திரப் பிரிவுகளை நேரடியாகக் குறிக்கும் வழக்கமான தமிழ் சொற்றொடர்.
- source_word: הָאֲלָפִים וְהַמֵּאוֹת
  choice: ஆயிரம்பேர் மற்றும் நூறுபேர் கொண்ட பிரிவுகள்
  rationale: இச்சொற்கள் எண்ணிக்கைகளை மட்டும் அல்லாமல் ஆயிரம் மற்றும் நூறு என்ற அளவில் அமைக்கப்பட்ட இராணுவ அல்லது நிர்வாகப் பிரிவுகளைக் குறிக்கலாம். ‘பிரிவுகள்’ என்பதை வெளிப்படுத்துவது தமிழில் தவறான புரிதலைத் தவிர்க்கிறது.
- source_word: שָׂרֵי מְלֶאכֶת הַמֶּלֶךְ
  choice: அரசனுடைய பணியை மேற்பார்வையிட்ட அதிகாரிகள்
  rationale: சொற்றொடர் அரசனின் வேலை அல்லது அலுவலைப் பொறுப்பேற்ற அதிகாரிகளைக் குறிக்கிறது. ‘மேற்பார்வையிட்ட அதிகாரிகள்’ என்பது அவர்களுடைய நிர்வாகப் பங்கைக் காட்டுகிறது; பணியின் துல்லியமான வகையை வரையறுக்காமல் விடுகிறது.
