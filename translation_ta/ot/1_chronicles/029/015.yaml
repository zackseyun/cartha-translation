base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/015.yaml
  text: For we are sojourners before you[a], and temporary residents, as all our fathers were. Our days on the earth are like a shadow[c][b], and there is no hope.
translation:
  language: ta
  text: ஏனெனில், எங்கள் முன்னோர் அனைவரையும் போலவே, நாங்களும் உமக்கு முன்பாக அந்நியர்களாகத் தங்கியிருப்பவர்களும்[a] தற்காலிகக் குடியிருப்பாளர்களுமாய்[b] இருக்கிறோம். பூமியில் எங்கள் நாட்கள் நிழலைப் போன்றவை; நம்பிக்கை ஏதுமில்லை.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அந்நியர்’ அல்லது ‘வேற்று நாட்டினர்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘தற்காலிகமாக வசிப்பவர்கள்’ அல்லது ‘குடியிருக்கும் அந்நியர்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: இங்கு வரும் ‘நம்பிக்கை ஏதுமில்லை’ என்பது பூமியில் மனித வாழ்வு விரைவில் கடந்துபோவதைச் சுட்டும் சூழலில் கூறப்படுகிறது; தேவன்மீது நம்பிக்கையே இல்லை என்று வசனம் வெளிப்படையாகக் கூறுவதில்லை.
    reason: contextual_clarification
lexical_decisions:
- source_word: גֵרִים
  choice: அந்நியக் குடியிருப்போர்
  rationale: இச்சொல் வெறுமனே வழிப்போக்கர்களை அல்ல, தமக்குச் சொந்தமல்லாத இடத்தில் அந்நியர் என்ற நிலையில் வாழ்பவர்களைக் குறிக்கிறது. ‘அந்நியக் குடியிருப்போர்’ அதன் சமூக நிலையையும் தங்கிவாழும் கருத்தையும் தக்கவைக்கிறது.
- source_word: לְפָנֶיךָ
  choice: உமக்கு முன்பாக
  rationale: ‘உமது முகத்திற்கு முன்பாக’ என்ற எபிரேயச் சொல்லமைப்பை இயல்பான, மரியாதையான நவீன தமிழில் தருகிறது; தேவனை நோக்கிய உரையாடலையும் காக்கிறது.
- source_word: תוֹשָׁבִים
  choice: தற்காலிகக் குடியிருப்பாளர்கள்
  rationale: ஒரு இடத்தில் வாழ்ந்தாலும் அங்கு நிரந்தர உரிமையோ பூர்வீக நிலையோ இல்லாதவரைக் குறிக்கும் சொல்லாகும். இணையான முதல் சொல்லுடன் சேர்ந்து மனித வாழ்வின் நிலையாமையை வெளிப்படுத்துகிறது.
- source_word: כְּכָל אֲבֹתֵינוּ
  choice: எங்கள் முன்னோர்கள் அனைவரையும் போலவே
  rationale: אֲבֹתֵינוּ என்பதன் நேரடி வடிவம் ‘எங்கள் தந்தையர்’ என்றாலும், இங்கு முந்தைய தலைமுறைகளைக் கூட்டாகக் குறிக்கிறது. ‘முன்னோர்கள்’ என்பது அந்த வரலாற்றுக் கருத்தை இயல்பான தமிழில் தெளிவாகத் தருகிறது.
- source_word: כַּצֵּל
  choice: நிழலைப் போன்றவை
  rationale: குறுகியதும் விரைவில் மறைவதுமான மனித வாழ்வுக்கான மூலமொழியின் உருவகத்தை மாற்றாமல் காக்கிறது.
- source_word: יָמֵינוּ עַל הָאָרֶץ
  choice: பூமியில் எங்கள் நாட்கள்
  rationale: காலத்தையும் இடத்தையும் குறிக்கும் எபிரேயச் சொற்றொடரைச் சுருக்கமோ விரிவாக்கமோ இன்றி இயல்பான தமிழ்ச் சொல் வரிசையில் தருகிறது.
- source_word: וְאֵין מִקְוֶה
  choice: நம்பிக்கை ஏதுமில்லை
  rationale: מִקְוֶה என்பதற்கு ‘நம்பிக்கை’ அல்லது ‘எதிர்பார்ப்பு’ என்ற பொருள் உண்டு. மூலத்தின் சுருக்கத்தையும் இறையியல் பதற்றத்தையும் தீர்த்துவிடாமல் ‘நம்பிக்கை’ என நேரடியாக மொழிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: וְאֵין מִקְוֶה என்பதன் பொருள்
  choice: ‘நம்பிக்கை ஏதுமில்லை’ என்று நேரடியாக மொழிபெயர்த்து, சூழலை அடிக்குறிப்பில் சுட்டிக்காட்டுதல்
  alternative: ‘நீடிக்கும் எதிர்பார்ப்பு ஏதுமில்லை’ அல்லது ‘நிலையான வாழ்வு இல்லை’
  rationale: வசனம் பூமிக்குரிய மனித வாழ்வின் நிலையாமையை வலியுறுத்துகிறது. ஆயினும், ‘நம்பிக்கை’ என்ற மூலச்சொல்லின் வலிமையையும் தோன்றும் இறையியல் பதற்றத்தையும் உட்பொருள் விளக்கத்தின் மூலம் முதன்மை உரையிலேயே நீக்கிவிடாமல் பாதுகாக்க வேண்டும்.
translation_notes:
  register: நவீன நிலையான தமிழில், ஜெபத்திற்குரிய மரியாதையையும் கவித்துவமான சுருக்கத்தையும் காக்கும் நடை பயன்படுத்தப்பட்டுள்ளது. தேவனை நோக்கும் ஒருமை மரியாதை வடிவமாக ‘உமக்கு’ தேர்ந்தெடுக்கப்பட்டுள்ளது. சட்டரீதியான அந்நியர் நிலையும் வாழ்வின் நிலையாமையும் சாதாரண வாசகருக்குப் புரியும் சொற்களில் தரப்பட்டுள்ளன.
