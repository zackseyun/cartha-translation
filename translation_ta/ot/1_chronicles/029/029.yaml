base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/029.yaml
  text: The acts of David the king[a], the former and the latter, are written in the records of Samuel the seer, and in the records of Nathan the prophet[c][b], and in the records of Gad the seer.
translation:
  language: ta
  text: தாவீது அரசனுடைய செயல்கள்[a]—முந்தினவையும் பிந்தினவையும்—காண்பவராகிய சாமுவேலின் பதிவுகளிலும், இறைவாக்கினரான நாத்தானின் பதிவுகளிலும், காண்பவராகிய காத்தின் பதிவுகளிலும் எழுதப்பட்டுள்ளன[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தாவீது அரசனுடைய சொற்கள்/காரியங்கள்’ என்றும் நேரடியாக மொழிபெயர்க்கலாம். இங்கு எபிரெயச் சொற்றொடர் அவரது வாழ்க்கை அல்லது ஆட்சியின் நிகழ்வுகளையும் செயல்களையும் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், ‘சாமுவேல்… நாத்தான்… காது ஆகியோரின் சொற்களின் மேல் எழுதப்பட்டுள்ளன’ என்று உள்ளது. எழுதப்பட்ட ஆதார ஆவணங்களைக் குறிக்க இங்கு ‘பதிவுகள்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: c
    text: சாமுவேலுக்கும் காதுக்கும் பயன்படுத்தப்பட்டுள்ள எபிரெயப் பட்டங்கள் (רֹאֶה, חֹזֶה) வெவ்வேறு சொற்கள்; இரண்டும் காணுதல் சார்ந்த இறைவாக்குப் பணியைக் குறிக்கும் பட்டங்களாகும். அவற்றின் துல்லியமான வேறுபாடு இவ்வசனத்தில் விளக்கப்படவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבְרֵי דָּוִיד הַמֶּלֶךְ
  choice: தாவீது அரசனுடைய செயல்கள்
  rationale: דִּבְרֵי என்பது அடிப்படையில் ‘சொற்கள்/காரியங்கள்’ எனப் பொருள்பட்டாலும், அரசனின் வாழ்வையும் ஆட்சியையும் தொகுத்துரைக்கும் இச்சூழலில் ‘செயல்கள்’ என்பது இயல்பான தமிழாகவும் பொருளுக்கு ஏற்றதாகவும் உள்ளது.
- source_word: הָרִאשֹׁנִים וְהָאֲחֲרֹנִים
  choice: முந்தினவையும் பிந்தினவையும்
  rationale: எபிரெயச் சொற்றொடரின் இரு கூறுகளையும் நெருக்கமாகக் காத்து, தாவீதின் முழு ஆட்சிக்காலச் செயல்களைக் குறிக்கும் விரிவையும் உணர்த்துகிறது.
- source_word: הִנָּם כְּתוּבִים
  choice: எழுதப்பட்டுள்ளன
  rationale: הִנָּם தரும் சுட்டல் அல்லது வலியுறுத்தலை தமிழில் தனியே ‘இதோ’ என்று சேர்ப்பது இயல்பில்லாததால், நிறைநிலை வினைவடிவத்திலேயே கருத்து தெளிவாக வழங்கப்படுகிறது.
- source_word: עַל דִּבְרֵי
  choice: பதிவுகளில்
  rationale: சொல்லுக்குச் சொல் ‘சொற்களின் மேல்’ என்பதற்குப் பதிலாக, இவை எழுதப்பட்ட ஆதார ஆவணங்கள் என்பதைத் தமிழில் இயல்பாகத் தெரிவிக்கிறது; குறிப்பிட்ட இலக்கிய வகையை ‘நாளாகமம்’ என மிகையாக நிர்ணயிப்பதையும் தவிர்க்கிறது.
- source_word: שְׁמוּאֵל הָרֹאֶה
  choice: இறைவாக்குக் காட்சியாளர் சாமுவேல்
  rationale: רֹאֶה என்பது காணுதல் சார்ந்த அதிகாரப்பெயர். ‘இறைவாக்குக் காட்சியாளர்’ என்பது அதன் தீர்க்கதரிசனச் சூழலையும் ‘காண்பவர்’ என்ற சொற்பொருளையும் தமிழில் தெளிவுபடுத்துகிறது.
- source_word: נָתָן הַנָּבִיא
  choice: இறைவாக்கினர் நாத்தான்
  rationale: נָבִיא என்பதற்கான இயல்பான, மதிப்புமிக்க நவீனத் தமிழ் இணை; சாமுவேல் மற்றும் காதுக்கு வழங்கப்பட்ட வேறு எபிரெயப் பட்டங்களிலிருந்து இதை வேறுபடுத்துகிறது.
- source_word: גָּד הַחֹזֶה
  choice: காட்சியாளர் காது
  rationale: חֹזֶה என்பதும் காணுதல் சார்ந்த தீர்க்கதரிசனப் பட்டம். வாசிக்க இயல்பாக ‘காட்சியாளர்’ என வழங்கி, רֹאֶה உடனான சொல் வேறுபாட்டை அடிக்குறிப்பில் பதிவு செய்கிறது.
theological_decisions:
- issue: רֹאֶה மற்றும் חֹזֶה என்ற இரு தீர்க்கதரிசனப் பட்டங்களின் மொழிபெயர்ப்பு
  choice: முதலாவதை ‘இறைவாக்குக் காட்சியாளர்’ என்றும் இரண்டாவதை ‘காட்சியாளர்’ என்றும் வழங்குதல்
  alternative: இரண்டையும் ஒரேபோல் ‘காட்சியாளர்’ என வழங்குதல்; அல்லது ஒன்றை ‘தரிசனக்காரர்’ என மொழிபெயர்த்தல்
  rationale: இரண்டும் காணுதல் சார்ந்த நெருங்கிய பட்டங்கள்; அவற்றுக்கிடையேயான துல்லியமான வரலாற்று வேறுபாடு இங்கு விளக்கப்படவில்லை. தமிழில் செயற்கையான doctrinal வேறுபாட்டை உருவாக்காமல், மூலத்தின் சொல் வேறுபாடு இருப்பதை அடிக்குறிப்பில் வெளிப்படையாகக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. அரச மரியாதையைத் தெரிவிக்க ‘அரசன்’ பயன்படுத்தப்பட்டது. ஆவணச் சூழலுக்கு ‘பதிவுகள்’ தேர்ந்தெடுக்கப்பட்டது. அடிக்குறிப்பு குறிகள் அனைத்தும் முதன்மை உரையில் இடம்பெறுகின்றன.
