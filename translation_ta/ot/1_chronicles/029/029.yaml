- from: தாவீது அரசனுடைய செயல்கள்[a]—முந்தினவையும் பிந்தினவையும்—இறைவாக்குக் காட்சியாளர் சாமுவேலின் பதிவுகளிலும், இறைவாக்கினர் நாத்தானின் பதிவுகளிலும், காட்சியாளர் காதின் பதிவுகளிலும் எழுதப்பட்டுள்ளன[b][c].
  to: தாவீது அரசனுடைய செயல்கள்[a]—முந்தினவையும் பிந்தினவையும்—காண்பவராகிய சாமுவேலின் பதிவுகளிலும், இறைவாக்கினரான நாத்தானின் பதிவுகளிலும், காண்பவராகிய காத்தின் பதிவுகளிலும் எழுதப்பட்டுள்ளன[b][c].
  rationale: காதின் பெயர் மூல எபிரெயப் பெயருக்கு ஏற்ப ‘காத்/காத்தின்’ எனச் சரிசெய்யப்பட்டது. இரு காணுதல் சார்ந்த பட்டங்களும் முதன்மை உரையில் ஒரே இயல்பான தமிழ்ச் சொல்லால் வழங்கப்பட்டன; அவற்றின் சொல்வேறுபாடு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது. மற்ற எல்லா கருத்துகளும், அடிக்குறிப்பு இடங்களும், ஆவணச் சூழலைக் குறிக்கும் ‘பதிவுகள்’ என்பதும் காக்கப்பட்டுள்ளன.
