base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/025.yaml
  text: And Yahweh made Solomon exceedingly great in the sight of all Israel[a], and gave him royal majesty such as had not been on any king before him over Israel.
translation:
  language: ta
  text: யாவே சாலொமோனை இஸ்ரவேலர் அனைவரின் பார்வையிலும் மிகவும் மேன்மைப்படுத்தினார்; சாலொமோனுக்கு முன் இஸ்ரவேலை ஆண்ட எந்த அரசனுக்கும் இல்லாத அரச மாட்சியை[a] அவருக்கு அளித்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அரசப் பொலிவு”; அல்லது, “அரசாட்சியின் மாட்சி.”
    reason: הוֹד מַלְכוּת என்ற சொற்றொடர் அரசருக்குரிய மாட்சி அல்லது பொலிவைக் குறிக்கிறது; மாற்று மொழிபெயர்ப்புகள் அதன் பொருள் வரம்பைக் காட்டுகின்றன.
lexical_decisions:
- source_word: וַיְגַדֵּל ... לְמַעְלָה
  choice: மிகவும் மேன்மைப்படுத்தினார்
  rationale: גדל என்பதன் ஹிஃபில் வடிவம் காரணவினைப் பொருளில் ‘மேன்மைப்படுத்தினார்’ என வருகிறது; לְמַעְלָה இங்கு அதை வலுப்படுத்துவதால் ‘மிகவும்’ என்று இயல்பாக மொழிபெயர்க்கப்பட்டது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டமாக மாற்றாமல், தமிழில் அதன் பரவலான ஒலிபெயர்ப்பான ‘யாவே’ என்று வழங்குகிறது.
- source_word: לְעֵינֵי כָּל יִשְׂרָאֵל
  choice: இஸ்ரவேல் அனைவரின் கண்களுக்கும் முன்பாக
  rationale: செயல் இஸ்ரவேல் மக்கள் அனைவருக்கும் வெளிப்படையாகவும் அவர்கள் அறியும்படியாகவும் நடந்ததைச் சுட்டும் எபிரெய மரபுத்தொடரின் உருவகத்தையும் பொருளையும் காக்கிறது.
- source_word: וַיִּתֵּן עָלָיו
  choice: அவருக்கு அளித்தார்
  rationale: சொல்லுக்குச் சொல் ‘அவர்மேல் கொடுத்தார்’ என்றாலும், ஒருவருக்கு சிறப்பை அருளுதல் அல்லது வழங்குதல் என்ற இயல்பான பொருளை ‘அளித்தார்’ தெளிவாகத் தருகிறது.
- source_word: הוֹד מַלְכוּת
  choice: அரச மாட்சி
  rationale: הוֹד என்பதன் மாட்சி, பொலிவு, பெருமை ஆகிய பொருள் வரம்பையும் מַלְכוּת குறிக்கும் அரசத் தன்மையையும் சுருக்கமாகவும் கண்ணியமாகவும் வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר לֹא הָיָה עַל כָּל מֶלֶךְ לְפָנָיו עַל יִשְׂרָאֵל
  choice: அவருக்கு முன்பு இஸ்ரவேலை ஆண்ட எந்த அரசனுக்கும் இருந்திராத
  rationale: לְפָנָיו என்பதை காலப்பொருளில் ‘அவருக்கு முன்பு’ என்றும், עַל יִשְׂרָאֵל என்பதை இஸ்ரவேல்மீதான ஆட்சியைக் குறிப்பதாகவும் எடுத்துரைக்கிறது; மாட்சி ஒருவர்மேல் இருப்பதாகக் கூறும் எபிரெய மரபுத்தொடர் தமிழில் இயல்பாக ‘இருந்திராத’ என வழங்கப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல உரை ஒரு பொதுப் பட்டத்தை அல்ல, இறைவனின் தனிப்பட்ட திருப்பெயரைப் பயன்படுத்துகிறது. எனவே பெயரின் தன்மையைப் பாதுகாக்கும் ஒலிபெயர்ப்பு தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன செந்தமிழ் நடை; பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் வகையில் கண்ணியமான சொற்கள் பயன்படுத்தப்பட்டுள்ளன. எபிரெய உரையின் பொதுமக்கள் முன்னிலையையும் ஒப்பீட்டின் வலிமையையும் காத்து, தமிழில் இயல்பான வாக்கிய அமைப்பு தேர்ந்தெடுக்கப்பட்டது. அடிக்குறிப்பு குறியீடு அது விளக்கும் ‘அரச மாட்சி’ என்பதற்குப் பின்னரே வைக்கப்பட்டது.
