source:
  edition: WLC
  text: וְ/הַ/נִּמְצָ֤א אִתּ/וֹ֙ אֲבָנִ֔ים נָתְנ֖וּ לְ/אוֹצַ֣ר בֵּית יְהוָ֑ה עַ֥ל יַד יְחִיאֵ֖ל הַ/גֵּרְשֻׁנִּֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/008.yaml
  text: Whoever had precious stones gave them to the treasury of the house of Yahweh, into the care of Jehiel the Gershonite.
translation:
  language: ta
  text: விலையுயர்ந்த கற்களை வைத்திருந்தவர்கள், அவற்றை கெர்சோனியனான யெகியேலின் பொறுப்பில் யாவேயின் ஆலயக் கருவூலத்திற்குக் கொடுத்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில், “கெர்சோனியனான யெகியேலின் கையின்கீழ்”; இது யெகியேலின் பொறுப்பில் அல்லது மேற்பார்வையில் என்பதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנִּמְצָא אִתּוֹ
  choice: வைத்திருந்தவர்கள்
  rationale: ‘ஒருவரிடம் காணப்பட்டது’ என்ற எபிரேய மரபுத்தொடர் உடைமையைக் குறிக்கிறது. பன்மை வினைச்சொல்லோடும் நன்கொடையாளர்களின் சூழலோடும் பொருந்துமாறு தமிழில் இயல்பாகப் பன்மையில் மொழிபெயர்க்கப்பட்டது.
- source_word: אֲבָנִים
  choice: விலையுயர்ந்த கற்கள்
  rationale: சொல்லின் நேரடிப் பொருள் ‘கற்கள்’ என்றாலும், ஆலயத்திற்கான மதிப்புமிக்க பொருட்களை நன்கொடையாக அளிக்கும் சூழலில் இது சாதாரணக் கற்களை அல்ல, மதிப்புள்ள கற்களைக் குறிக்கிறது.
- source_word: נָתְנוּ
  choice: கொடுத்து ... ஒப்படைத்தார்கள்
  rationale: נתן என்பது இங்கு நன்கொடையாகக் கொடுத்தலைக் குறிக்கிறது; அடுத்துள்ள பொறுப்பாளர் சொற்றொடருடன் இயல்பான தமிழில் இணைக்க ‘கொடுத்து ... ஒப்படைத்தார்கள்’ என வழங்கப்பட்டது.
- source_word: לְאוֹצַר בֵּית יְהוָה
  choice: யாவேயின் ஆலயக் கருவூலத்துக்கு
  rationale: אוֹצָר என்பது இச்சூழலில் மதிப்புள்ள பொருட்கள் வைக்கப்படும் கருவூலம். בֵּית יְהוָה என்பதன் சொற்பொருள் ‘யாவேயின் வீடு’; நவீன தமிழில் அதன் தெளிவான பொருள் ‘யாவேயின் ஆலயம்’.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பொதுவாக அறியத்தக்க ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: עַל יַד
  choice: பொறுப்பில்
  rationale: சொற்படியாக ‘கையின்மூலம்/கையின்கீழ்’ என்ற இந்த மரபுத்தொடர் இங்கு யெகியேலிடம் ஒப்படைக்கப்பட்ட காவல் அல்லது மேற்பார்வைப் பொறுப்பைக் குறிக்கிறது.
- source_word: יְחִיאֵל הַגֵּרְשֻׁנִּי
  choice: கெர்சோனியனான யெகியேல்
  rationale: தனிப்பெயரும் குல அடையாளமும் எபிரேய ஒலிகளுக்கு நெருக்கமான, தமிழில் வாசிக்கத்தக்க வடிவில் ஒலிபெயர்க்கப்பட்டன.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / ஆண்டவர்
  rationale: மூலத்தில் பட்டமல்ல, இறைவனின் தனிப்பெயரே உள்ளது; ஆகவே அந்த வேறுபாட்டைப் பாதுகாக்கப் பெயர் ஒலிபெயர்க்கப்பட்டது.
- issue: אֲבָנִים என்பது சாதாரணக் கற்களா மதிப்புள்ள கற்களா
  choice: விலையுயர்ந்த கற்கள்
  alternative: கற்கள்
  rationale: எபிரேயச் சொல் தனித்து ‘கற்கள்’ என்றாலும், ஆலயக் கருவூலத்துக்கான நன்கொடைகளின் உடனடிச் சூழல் மதிப்புமிக்க கற்களைக் குறிக்கிறது. குறிப்பிட்ட ரத்தின வகையைச் சேர்க்காமல் சூழற்பொருள் வெளிப்படுத்தப்பட்டது.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் உடைமை மரபுத்தொடரும் ஒருமையிலிருந்து பன்மைக்குச் செல்லும் இலக்கண அமைப்பும் இயல்பான தமிழில் பன்மையாக வழங்கப்பட்டுள்ளன.
