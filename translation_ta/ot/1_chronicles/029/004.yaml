translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமும் எளிய புரிதலும் இணையும் நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. வசனம் முந்தைய வாக்கியத்தின் தொடராக இருப்பதால், சூழலில் வெளிப்படும் “கொடுத்தேன்” என்பது தமிழில் முழுமையான வாக்கியத்திற்காக இறுதியில் சேர்க்கப்பட்டுள்ளது.
