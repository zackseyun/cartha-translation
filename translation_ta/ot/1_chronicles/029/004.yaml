  yaml_path: translation/ot/1_chronicles/029/004.yaml
  text: three thousand talents of gold[a], from the gold of Ophir, and seven thousand talents of refined silver, to overlay the walls of the buildings[b],
translation:
  language: ta
  text: ஓப்பீரின் தங்கத்திலிருந்து[a] மூவாயிரம் தாலந்து[b] தங்கத்தையும், கட்டிடங்களின் சுவர்களுக்குமேல் பதிப்பதற்காக ஏழாயிரம் தாலந்து சுத்திகரிக்கப்பட்ட வெள்ளியையும் கொடுத்தேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஓப்பீர் தங்கத்தில்.” எபிரெயத்தில் இது ஓப்பீரிலிருந்து கிடைத்த தங்கத்தைக் குறிக்கலாம்; அல்லது “ஓப்பீர் தங்கம்” என்ற விளக்கத் தொடராகவும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: “தாலந்து” என்பது திறமையைக் குறிக்காமல், பண்டைக்கால எடை அலகைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: שְׁלֹשֶׁת אֲלָפִים כִּכְּרֵי זָהָב
  choice: மூவாயிரம் தாலந்து தங்கம்
  rationale: எண்ணிக்கையையும் பண்டைய எடை அலகையும் நேரடியாகப் பாதுகாக்கிறது; தமிழில் இயல்பான அளவு-பொருள் வரிசை பயன்படுத்தப்பட்டுள்ளது.
- source_word: מִזְּהַב אוֹפִיר
  choice: ஓப்பீரிலிருந்து வந்த தங்கத்தில்
  rationale: מִן முன்னிடைச்சொல்லின் மூலாதாரப் பொருளை வெளிப்படையாகக் காட்டுகிறது; ஓப்பீர் இடப்பெயராக ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְשִׁבְעַת אֲלָפִים כִּכַּר כֶּסֶף מְזֻקָּק
  choice: ஏழாயிரம் தாலந்து சுத்திகரிக்கப்பட்ட வெள்ளி
  rationale: מְזֻקָּק என்பது உலோகம் சுத்திகரிக்கப்பட்டிருப்பதைக் குறிக்கும் செயப்பாட்டு வினையெச்சம்; அதனைத் துல்லியமாகக் காட்டுகிறது.
- source_word: לָטוּחַ
  choice: பூசுவதற்காக
  rationale: சுவர்களின் மேற்பரப்பை உலோகத்தால் மூடும் செயலை இயல்பான தமிழில் குறிக்கிறது; சாந்து பூசுதல் என்ற பொருளுக்கு மட்டும் கட்டுப்படுத்தவில்லை.
- source_word: קִירוֹת הַבָּתִּים
  choice: கட்டிடங்களின் சுவர்கள்
  rationale: בָּתִּים என்பதன் பன்மையைப் பாதுகாத்து, ஆலயக் கட்டுமானச் சூழலில் வீடுகள் என்று தவறாகப் புரிந்துகொள்ளப்படாமல் பரந்த கட்டடப் பொருளைக் கொடுக்கிறது.
