  register: நவீனச் செந்தமிழுக்கு ஏற்ற, எளிதில் புரியும் கண்ணியமான வரலாற்று உரைநடை. மரியாதைப் பன்மை வினைமுற்று தமிழ் வேதாகம நடையையும் இயல்பான அரசர் குறிப்பு முறையையும் பின்பற்றுகிறது.
