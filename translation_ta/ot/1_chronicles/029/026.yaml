translation:
  language: ta
  text: மேலும், ஈசாயின் மகன் தாவீது இஸ்ரவேல் முழுவதையும் அரசாண்டார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/דָוִיד
  choice: தாவீது
  rationale: வְ இங்கு முந்தைய விவரத்தைத் தொடர்ந்து வரும் உரையாடல் இணைப்பாக உள்ளது; தனித்த தமிழ் வசனத்தில் இயல்பான நடைக்காக வெளிப்படையாக மொழிபெயர்க்கப்படவில்லை. דָוִיד என்ற பெயர் தமிழில் வழக்கமான வடிவமான ‘தாவீது’ என வழங்கப்பட்டது.
- source_word: בֶּן יִשָׁי
  choice: ஈசாயின் மகன்
  rationale: எபிரெய கட்டுநிலைத் தொடரின் மரபுவழி அடையாளத்தைத் தெளிவாகவும் இயல்பான தமிழிலும் காக்கிறது.
- source_word: מָלַךְ
  choice: ஆட்சி செய்தார்
  rationale: Qal நிறைவுவினை இச்சூழலில் அரசாட்சியைச் செலுத்தியதைக் குறிக்கிறது; வெறுமனே அரசரான நிகழ்வை அல்ல. ‘ஆட்சி செய்தார்’ நவீனத் தமிழில் இயல்பான சமமான சொற்றொடர்.
- source_word: עַל
  choice: —ஐ
  rationale: מָלַךְ உடன் வரும் עַל ஆளப்பட்ட மக்களையோ ஆட்சிப் பரப்பையோ குறிக்கிறது. தமிழில் ‘ஆட்சி செய்’ என்பதன் நேரடி செயப்படுபொருள் வேற்றுமை இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כָּל יִשְׂרָאֵל
  choice: இஸ்ரவேல் முழுவதையும்
  rationale: כָּל என்பது இஸ்ரவேல் தேசம் முழுவதையும் உள்ளடக்கும் பொருளைத் தருகிறது; ‘முழுவதையும்’ அந்த முழுமையான வரம்பைக் காக்கிறது.
theological_decisions: []
