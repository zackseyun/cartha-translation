source:
  edition: WLC
  text: וַ/יָּ֨מָת֙ בְּ/שֵׂיבָ֣ה טוֹבָ֔ה שְׂבַ֥ע יָמִ֖ים עֹ֣שֶׁר וְ/כָב֑וֹד וַ/יִּמְלֹ֛ךְ שְׁלֹמֹ֥ה בְנ֖/וֹ תַּחְתָּֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/028.yaml
  text: And he died in a good old age[a], full of days, riches, and honor; and Solomon his son reigned in his place.
translation:
  language: ta
  text: அவர் நல்ல முதுமையில், வாழ்நாட்களும் செல்வமும் மதிப்பும் நிறைந்தவராக இறந்தார்; அவருடைய மகன் சாலொமோன் அவருக்குப் பதிலாக ஆட்சி செய்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָת
  choice: அவர் ... இறந்தார்
  rationale: தொடர்ந்து நிகழ்ந்த அடுத்த சம்பவத்தை எளிய கதைநடையில் தெரிவிக்கிறது; தமிழில் இயல்பான வாக்கிய அமைப்புக்காக வினைமுற்று இறுதியில் வைக்கப்பட்டது.
- source_word: בְּשֵׂיבָה טוֹבָה
  choice: நல்ல முதிர்வயதில்
  rationale: மரணத்தின்போது அவர் அடைந்திருந்த நிறைவான முதுமையை நேர்மறையாகக் குறிப்பிடும் எபிரெயச் சொற்றொடரை இயல்பான, கண்ணியமான தமிழில் தருகிறது.
- source_word: שְׂבַע יָמִים
  choice: வாழ்நாட்கள் ... நிறைந்தவராக
  rationale: ‘நாட்களால் நிறைந்தவர்’ என்ற எபிரெய உருவகத்தைத் தமிழில் புரியும்படி ‘வாழ்நாட்கள் நிறைந்தவர்’ எனப் பாதுகாக்கிறது; நீண்டதும் நிறைவானதுமான வாழ்வைச் சுட்டுகிறது.
- source_word: עֹשֶׁר וְכָבוֹד
  choice: செல்வமும் மதிப்பும்
  rationale: עֹשֶׁר பொருட்செல்வத்தையும், இச்சூழலில் כָבוֹד அரசருக்குரிய சமூக மதிப்பு மற்றும் கண்ணியத்தையும் குறிக்கின்றன.
- source_word: וַיִּמְלֹךְ
  choice: ஆட்சி செய்தார்
  rationale: מלך என்ற வினையின் ‘அரசாளுதல்’ என்ற பொருளை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: שְׁלֹמֹה בְנוֹ
  choice: அவருடைய மகன் சாலொமோன்
  rationale: எபிரெயத்தில் பெயர் முதலில் வந்தாலும், உறவையும் நபரையும் தெளிவாகக் காட்டும் இயல்பான தமிழ் வரிசை பயன்படுத்தப்பட்டது.
- source_word: תַּחְתָּיו
  choice: அவருக்குப் பதிலாக
  rationale: அரச வாரிசுரிமைச் சூழலில் ‘அவரது இடத்தில்’ என்ற பொருளைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
