id: 1CH.29.13
reference: 1 Chronicles 29:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/עַתָּ֣ה אֱלֹהֵ֔י/נוּ מוֹדִ֥ים אֲנַ֖חְנוּ לָ֑/ךְ וּֽ/מְהַֽלְלִ֖ים לְ/שֵׁ֥ם תִּפְאַרְתֶּֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/013.yaml
  text: And now[a], our God, we give thanks to you and praise the name of your glory.
translation:
  language: ta
  text: இப்பொழுது, எங்கள் கடவுளே, நாங்கள் உமக்கு நன்றி செலுத்துகிறோம்; உமது மகிமையின் பெயரைப் புகழ்கிறோம்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: இப்பொழுதும்
  rationale: וְ என்ற இணைப்பையும் עַתָּה என்ற காலக் குறியையும் சேர்த்துப் பாதுகாக்கிறது; ஜெபத்தின் முந்தைய ஓட்டத்திலிருந்து தற்போதைய நன்றியறிதலுக்குச் செல்லும் தொடர்பைக் காட்டுகிறது.
- source_word: אֱלֹהֵינוּ
  choice: எங்கள் கடவுளே
  rationale: முதல் நபர் பன்மை உரிமை விகுதியையும் நேரடி விளிப்பையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: מוֹדִים אֲנַחְנוּ לָךְ
  choice: நாங்கள் உமக்கு நன்றி செலுத்தி
  rationale: வழிபாட்டுச் சூழலில் ידה என்பதன் நன்றிசெலுத்துதல் என்ற பொருளை எடுத்துரைக்கிறது; வெளிப்படையான אֲנַחְנוּ என்பதற்கேற்ப ‘நாங்கள்’ தக்கவைக்கப்பட்டுள்ளது.
- source_word: וּמְהַלְלִים
  choice: புகழ்கிறோம்
  rationale: הלל என்ற பீயேல் பங்கேற்புச் சொல்லின் தொடர்ச்சியான புகழ்தல் கருத்தை இயல்பான தமிழ் வினைமுற்றில் தருகிறது.
- source_word: לְשֵׁם תִּפְאַרְתֶּךָ
  choice: உமது மகிமையின் பெயரை
  rationale: ‘உமது மகிமையின் பெயர்’ என்ற எபிரெயக் கட்டமைப்பைத் தமிழில் புரியத்தக்க வகையில் நெருக்கமாகப் பாதுகாக்கிறது; ‘மகிமையான பெயர்’ என்றும் இயல்பாக்காமல் மூலத்தின் பெயர்–மகிமை உறவைத் தக்கவைக்கிறது.
theological_decisions:
- issue: தெய்வத்தை நேரடியாக அழைக்கும் சொல்லாக்கம்
  choice: எங்கள் கடவுளே
  alternative: எங்கள் கடவுளாகிய உம்மை
  rationale: எபிரெயில் தனி விளிப்பிடைச் சொல் இல்லாவிட்டாலும், வாக்கிய அமைப்பு நேரடி அழைப்பாகும்; தமிழ் விளிவேற்றுமை இதை இயல்பாகவும் கூடுதல் வழிபாட்டு பழைமையின்றியும் காட்டுகிறது.
- issue: ‘மகிமையின் பெயர்’ என்ற இறையியல் முக்கியத்துவமுள்ள சொற்றொடர்
  choice: உமது மகிமையின் பெயரைப் புகழ்கிறோம்
  alternative: உமது மகிமையான பெயரைப் புகழ்கிறோம்
  rationale: தேவனுடைய ‘பெயர்’ குறித்த வேதாகம மொழியையும் תִּפְאַרְתֶּךָ என்ற பெயர்ச்சொல் கட்டமைப்பையும் தக்கவைக்கிறது; அதை வெறும் பண்புப்பெயராக மாற்றி மூலத்திலுள்ள உறவைத் தீர்மானிப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், ஜெபத்திற்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘உமக்கு/உமது’ மரியாதை ஒருமையைப் பேணுகிறது; தேவையற்ற தொன்மையான சொற்களும் சமயப்பிரிவு சார்ந்த சொல்லாக்கமும் தவிர்க்கப்பட்டுள்ளன.
