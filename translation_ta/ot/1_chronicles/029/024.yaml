  text: And all the officials[a], the mighty men, and also all the sons of King David pledged allegiance to King Solomon.
translation:
  language: ta
  text: அனைத்து அதிகாரிகளும், வலிமைமிக்க வீரர்களும், தாவீது அரசனின் மகன்கள் அனைவரும் கூட, சாலொமோன் அரசனுக்கு விசுவாச உறுதிமொழி அளித்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லர்த்தமாக, “சாலொமோன் அரசனுக்குக் கீழாகத் தங்கள் கையை அளித்தார்கள்.” இது ஒருவருக்குக் கீழ்ப்படிந்து, அவருக்கு விசுவாசமாக இருப்பதாக உறுதியளிப்பதைக் குறிக்கும் எபிரேய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָּׂרִים
  choice: அதிகாரிகள்
  rationale: அரசவையிலும் ஆட்சியிலும் உயர்நிலைப் பொறுப்பு வகித்தவர்களைக் குறிக்கும் பரந்த பொருளை நவீன தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: גִּבֹּרִים
  choice: வலிமைமிக்க வீரர்கள்
  rationale: உடல் அல்லது சமூக வலிமையோடு இராணுவ வீரத்தையும் உள்ளடக்கக்கூடிய எபிரேயச் சொல்லின் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: בְּנֵי הַמֶּלֶךְ דָּוִיד
  choice: தாவீது அரசனின் மகன்கள்
  rationale: தாவீதின் அரச பட்டத்தையும் வெளிப்படையான தந்தை–மகன் உறவையும் நெருக்கமாகப் பாதுகாக்கிறது.
- source_word: נָתְנוּ יָד תַּחַת
  choice: தங்கள் விசுவாசத்தை உறுதியளித்தார்கள்
  rationale: சொல்லர்த்தமாக ‘கீழே கையைக் கொடுத்தார்கள்’ எனும் எபிரேய மரபுத்தொடர், அரசனுக்குக் கீழ்ப்படிந்து உண்மையுடன் இருப்பதாக உறுதியளிப்பதைக் குறிக்கிறது; தேர்ந்த மொழிபெயர்ப்பு அதன் சூழல்சார் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: שְׁלֹמֹה הַמֶּלֶךְ
  choice: சாலொமோன் அரசனுக்கு
  rationale: எபிரேயத்தில் பெயருக்குப் பின் வரும் அரச பட்டத்தைப் பாதுகாத்து, தமிழ் வேற்றுமை அமைப்புக்கு இயல்பாகத் தருகிறது.
