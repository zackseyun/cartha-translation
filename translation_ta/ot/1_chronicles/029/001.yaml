  edition: WLC
  text: וַ/יֹּ֨אמֶר דָּוִ֤יד הַ/מֶּ֨לֶךְ֙ לְ/כָל הַ/קָּהָ֔ל שְׁלֹמֹ֨ה בְנִ֥/י אֶחָ֛ד בָּֽחַר בּ֥/וֹ אֱלֹהִ֖ים נַ֣עַר וָ/רָ֑ךְ וְ/הַ/מְּלָאכָ֣ה גְדוֹלָ֔ה כִּ֣י לֹ֤א לְ/אָדָם֙ הַ/בִּירָ֔ה כִּ֖י לַ/יהוָ֥ה אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/001.yaml
  text: Then King David said to all the assembly, “Solomon my son, the one God has chosen, is young and inexperienced, and the work is great; for the palace is not for man, but for the LORD God.”
translation:
  language: ta
  text: பின்பு தாவீது அரசர் முழுச் சபையிடமும், “கடவுள் தேர்ந்தெடுத்த ஒருவனான என் மகன் சாலொமோன் இளைஞனும் அனுபவமற்றவனுமாய் இருக்கிறான். இந்தப் பணியோ மிகப் பெரியது. ஏனெனில் இந்த அரண்மனை மனிதனுக்கானது அல்ல; கடவுளாகிய ஆண்டவருக்கானது” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קָהָל
  choice: சபையார்
  rationale: கூடியிருந்த மக்களின் ஒழுங்குபட்ட பொதுக்கூட்டத்தைக் குறிக்கும் இயல்பான, கண்ணியமான தமிழ் சொல்.
- source_word: נַעַר וָרָךְ
  choice: இளைஞனும் அனுபவமற்றவனுமாய்
  rationale: நேரடியாக ‘இளையவனும் மென்மையானவனும்’ என்று மொழிபெயர்ப்பதைவிட, சூழலில் உள்ள இளமையையும் பெரிய பொறுப்புக்கான அனுபவக் குறைவையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַמְּלָאכָה
  choice: இந்தப் பணி
  rationale: ஆலயத்தைக் கட்டும் பெரும் முயற்சியைச் சூழலுக்கேற்ற பொதுவான சொல்லால் குறிக்கிறது.
- source_word: הַבִּירָה
  choice: இந்த அரண்மனை
  rationale: இச்சொல் கோட்டை அல்லது அரண்மனை எனப் பொருள்படலாம்; இங்கு ஆண்டவருக்காக எழுப்பப்படும் பிரமாண்ட ஆலயக் கட்டிடத்தை அரச மாளிகை உருவகத்தில் குறிக்கிறது.
- source_word: יהוה אֱלֹהִים
  choice: கடவுளாகிய ஆண்டவர்
  rationale: יהוה என்ற உடன்படிக்கைப் பெயரை தமிழ் வேதாகம மரபுக்கேற்ப ‘ஆண்டவர்’ என்றும், אֱלֹהִים என்பதை ‘கடவுள்’ என்றும் இணைத்து வழங்குகிறது.
theological_decisions:
- issue: אֶחָד בָּחַר בּוֹ אֱלֹהִים என்பதில் ‘אחד’ என்பதன் தொடர்பு
  choice: கடவுள் தேர்ந்தெடுத்த என் மகன் சாலொமோன்
  alternative: கடவுள் தேர்ந்தெடுத்த ஒரே ஒருவனான என் மகன் சாலொமோன்
  rationale: எபிரெயச் சொல்லமைப்பில் ‘אחד’ சாலொமோனை ‘ஒருவன்/ஒரே ஒருவன்’ எனத் தனிப்படுத்துகிறது; ஆனால் தமிழில் ‘ஒரே ஒருவன்’ என்பது பிறரைத் தவிர்த்தார் என்ற வலுவான இறையியல் வலியுறுத்தலை உருவாக்கலாம். சூழலின் மையக் கருத்தான கடவுளின் தேர்வைத் தெளிவாக வைத்திருக்கிறது.
- issue: ஆலயத்தை הַבִּירָה என்று அழைத்தல்
  choice: அரண்மனை
  alternative: கோட்டை
  rationale: இது ஆண்டவரின் வாசஸ்தலத்தின் மகத்துவத்தை அரச மாளிகை மொழியில் காட்டுகிறது; ‘கோட்டை’ பாதுகாப்புக் கட்டமைப்பை முன்னிறுத்துவதால் இச்சூழலுக்கு குறைவாகப் பொருந்துகிறது.
translation_notes:
  register: நவீன பொதுத் தமிழில், பொதுவாசிப்புக்கு ஏற்ற கண்ணியமான நடை. எபிரெய வசனத்தின் காரணத் தொடர் மற்றும் மனிதன்/ஆண்டவர் எதிர்மறை ஒப்புமை பாதுகாக்கப்பட்டுள்ளன.
