source:
  edition: WLC
  text: וַ/יִּשְׂמְח֤וּ הָ/עָם֙ עַל הִֽתְנַדְּבָ֔/ם כִּ֚י בְּ/לֵ֣ב שָׁלֵ֔ם הִֽתְנַדְּב֖וּ לַ/יהוָ֑ה וְ/גַם֙ דָּוִ֣יד הַ/מֶּ֔לֶךְ שָׂמַ֖ח שִׂמְחָ֥ה גְדוֹלָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/009.yaml
  text: Then the people rejoiced because they had offered willingly[a], for with a whole heart they had offered willingly to Yahweh[b]; and David the king also rejoiced with great joy.
translation:
  language: ta
  text: அப்போது மக்கள் தாங்கள் மனமுவந்து காணிக்கை அளித்ததற்காக மகிழ்ந்தார்கள்[a]; ஏனெனில் அவர்கள் முழு இருதயத்தோடு[b] யாவேக்கு மனமுவந்து காணிக்கை அளித்தார்கள். தாவீது அரசனும் மிகுந்த மகிழ்ச்சியடைந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவர்களுடைய தன்னார்வக் காணிக்கையைக் குறித்து” என்றும் மொழிபெயர்க்கலாம்; இங்குள்ள எபிரெய வினைவேர் கட்டாயமின்றி விருப்பத்துடன் கொடுப்பதை வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: நேரடியாக, “முழு இருதயத்தோடு”; இது பிரிவுபடாத மனப்பான்மை, உண்மைநேர்மை அல்லது முழுமையான ஈடுபாட்டை உணர்த்துகிறது.
    reason: lexical_explanation
lexical_decisions:
- source_word: וַיִּשְׂמְחוּ הָעָם
  choice: அப்போது மக்கள் ... மகிழ்ந்தார்கள்
  rationale: எபிரெயக் கதைநடையின் தொடர்ச்சியை இயல்பான நவீனத் தமிழில் காட்டுவதற்காக ‘அப்போது’ பயன்படுத்தப்பட்டது; שׂמח என்பதற்கு நேரடியான ‘மகிழ்ந்தார்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: עַל הִתְנַדְּבָם
  choice: தாங்கள் மனமுவந்து காணிக்கை அளித்ததற்காக
  rationale: עַל இங்கு மகிழ்ச்சிக்கான காரணத்தைக் குறிக்கிறது. נדב என்பதன் Hitpael வடிவம் கட்டாயமின்றி விருப்பத்துடன் அளிப்பதை வலியுறுத்துவதால் ‘மனமுவந்து’ என மொழிபெயர்க்கப்பட்டது; ஆலயத்திற்கான பொருள் பங்களிப்பே சூழல் என்பதால் ‘காணிக்கை அளித்தல்’ இயல்பாக உள்ளது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான விளக்கக் காரணத்தைத் தெளிவாக இணைக்கிறது.
- source_word: בְּלֵב שָׁלֵם
  choice: முழு இருதயத்தோடு
  rationale: எபிரெய மொழியின் உருவகத்தைத் தக்கவைத்து, பிரிவுபடாத உண்மைநேர்மையையும் முழுமையான ஈடுபாட்டையும் உணர்த்துகிறது.
- source_word: הִתְנַדְּבוּ
  choice: மனமுவந்து காணிக்கை அளித்தார்கள்
  rationale: ஒரே எபிரெய வேர் வசனத்தில் இருமுறை வருவதால், மனமுவந்த கொடுத்தலை இரு இடங்களிலும் ஒரே விதமாக மொழிபெயர்த்து மறுபடியையும் வலியுறுத்தலையும் காக்கிறது.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: எபிரெய மூலத்தில் வரும் தேவனுடைய தனிப்பெயரான יהוה-ஐ பட்டப்பெயராக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: וְגַם דָּוִיד הַמֶּלֶךְ
  choice: தாவீது அரசனும்
  rationale: וְגַם என்பதன் சேர்க்கை வலியுறுத்தலை ‘உம்’ விகுதி இயல்பாக வெளிப்படுத்துகிறது; எபிரெயச் சொல் வரிசையும் பெரும்பாலும் காக்கப்படுகிறது.
- source_word: שָׂמַח שִׂמְחָה גְדוֹלָה
  choice: மிகுந்த மகிழ்ச்சியடைந்தான்
  rationale: எபிரெயில் ஒரே வேரை வினைச்சொல்லாகவும் பெயர்ச்சொல்லாகவும் பயன்படுத்தும் வலியுறுத்தலை, செயற்கையான மறுபடியைத் தவிர்த்து இயல்பான தமிழில் தீவிரமாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יהוה என்ற தேவனுடைய பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரை தேவனுடைய உடன்படிக்கைத் தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. அதை ஒரு பட்டப்பெயரால் மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்ப்பது மூலத்தின் தனித்தன்மையைப் பாதுகாக்கிறது.
- issue: בְּלֵב שָׁלֵם என்பதன் பொருள்
  choice: முழு இருதயத்தோடு
  alternative: முழு மனதுடன் / மனப்பூர்வமாக
  rationale: இது வெறும் உணர்ச்சி உற்சாகத்தை மட்டும் அல்லாமல் பிரிவுபடாத நேர்மையையும் முழுமையான பற்றுறுதியையும் குறிக்கக்கூடும். ஆகவே உருவகத்தைத் தக்கவைத்து, அதன் பொருள் பரப்பை அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘மனமுவந்து’ என்பது தன்னார்வத்தை இயல்பாகத் தெரிவிக்கிறது; ‘முழு இருதயத்தோடு’ என்பது மூல உருவகத்தையும் அதன் இறையியல் அழுத்தத்தையும் காக்கிறது. வசனத்தின் இரு காரணத் தொடர்களும், தாவீதின் கூடுதல் மகிழ்ச்சியும் தெளிவாகப் பிரிக்கப்பட்டுள்ளன.
