source:
  edition: WLC
  text: יְהוָ֗ה אֱ֠לֹהֵי אַבְרָהָ֞ם יִצְחָ֤ק וְ/יִשְׂרָאֵל֙ אֲבֹתֵ֔י/נוּ שֳׁמְרָ/ה זֹּ֣את לְ/עוֹלָ֔ם לְ/יֵ֥צֶר מַחְשְׁב֖וֹת לְבַ֣ב עַמֶּ֑/ךָ וְ/הָכֵ֥ן לְבָבָ֖/ם אֵלֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/018.yaml
  text: O Yahweh[a], God of Abraham, Isaac, and Israel, our fathers, keep this forever in the intentions of the thoughts of the heart of your people[d][c][b], and direct their heart toward you.
translation:
  language: ta
  text: யாவே, எங்கள் தந்தையரான ஆபிரகாம், ஈசாக்கு, இஸ்ரவேல்[a] ஆகியோரின் கடவுளே, இதை உமது மக்களின் இதயச் சிந்தனைகளின் மனச்சாய்வில் என்றென்றும் காத்தருளும்[b]; அவர்களுடைய இதயத்தை உம்மை நோக்கி நிலைநிறுத்தும்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மூலத்தில் இங்கு “இஸ்ரவேல்” என்றே உள்ளது; இந்த முற்பிதாக்களின் பெயர்த் தொடரில் சிலர் “யாக்கோபு” என்பதை எதிர்பார்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: 'வேறுவிதமாக: “இதை உமது மக்களின் இதயச் சிந்தனைகளின் மனச்சாய்வாக என்றென்றும் காத்தருளும்.”'
    reason: alternative_reading
  - marker: c
    text: 'வேறுவிதமாக: “அவர்களுடைய இதயத்தை உம்மை நோக்கி ஆயத்தப்படுத்தும்” அல்லது “உம்மை நோக்கித் திருப்பும்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: தேவனுடைய தனிப்பெயரான நான்கெழுத்துப் பெயரைப் பட்டப்பெயராக மாற்றாமல், தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பில் வழங்குகிறது.
- source_word: אֱלֹהֵי
  choice: கடவுளாகிய
  rationale: தொடர்ந்து வரும் முற்பிதாக்களின் பெயர்களோடு அமைந்த எபிரெயக் கட்டுச்சொல் உறவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אַבְרָהָם יִצְחָק וְיִשְׂרָאֵל אֲבֹתֵינוּ
  choice: எங்கள் தந்தையரான ஆபிரகாம், ஈசாக்கு, இஸ்ரவேல் ஆகியோர்
  rationale: மூலத்தில் உள்ள ஆண்பால் பன்மையையும் முற்பிதாக்களைக் குறிக்கும் குடும்ப உறவையும் காக்கிறது; ‘இஸ்ரவேல்’ என்பதை ‘யாக்கோபு’ என்று ஒத்திசைக்கவில்லை.
- source_word: שָׁמְרָה זֹּאת לְעוֹלָם
  choice: இதை ... என்றென்றும் காத்தருளும்
  rationale: வேண்டுதல் வடிவத்தையும், முன் நிகழ்ந்த மனமுவந்த அர்ப்பணிப்பை ஒருமையாகச் சுட்டும் זֹאת என்பதையும் காக்கிறது; ‘காத்தருளும்’ தமிழ்ச் செப மொழியில் இயல்பானது.
- source_word: לְיֵצֶר מַחְשְׁבוֹת לְבַב עַמֶּךָ
  choice: உமது மக்களின் இதய எண்ணங்களின் உள்ளார்ந்த நாட்டமாக
  rationale: יֵצֶר என்பதிலுள்ள உருவாக்கம், நாட்டம், உள்ளார்ந்த மனச்சாய்வு ஆகிய பொருள் எல்லைகளை ‘உள்ளார்ந்த நாட்டம்’ இயல்பாக எடுத்துரைக்கிறது; இதயத்தை மனம் என்று தட்டையாக்காமல் மூல உருவகத்தைப் பேணுகிறது.
- source_word: וְהָכֵן לְבָבָם אֵלֶיךָ
  choice: அவர்களுடைய இதயத்தை உம்மை நோக்கி நிலைநிறுத்தும்
  rationale: כון என்பதன் உறுதிப்படுத்துதல் அல்லது நிலைநிறுத்துதல் என்ற பொருளையும், אֵלֶיךָ காட்டும் தேவனை நோக்கிய திசையையும் காக்கிறது; எபிரெயிலுள்ள கூட்டு ஒருமையான ‘இதயம்’ என்பதையும் ஒருமையாகவே வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் தனிப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரை நேரடியாக இறைத் தனிப்பெயரைப் பயன்படுத்துவதால், அதை ஒரு பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: முற்பிதாவின் பெயர் יִשְׂרָאֵל
  choice: இஸ்ரவேல்
  alternative: யாக்கோபு
  rationale: இரு பெயர்களும் ஒரே முற்பிதாவைக் குறித்தாலும், இவ்வசனத்தின் எபிரெய உரை ‘இஸ்ரவேல்’ என்றே கூறுகிறது; பழக்கமான சூத்திரத்துக்கு ஒத்திசைக்கப்படவில்லை.
- issue: וְהָכֵן என்பதன் கருத்து
  choice: நிலைநிறுத்தும்
  alternative: திருப்பியருளும்
  rationale: தேவனை நோக்கிய திசை உரையில் தெளிவாக இருந்தாலும், வினைச்சொல் இதயத்தை ஆயத்தப்படுத்துதல் அல்லது உறுதிப்படுத்துதல் என்ற நுட்பத்தையும் கொண்டுள்ளது; ‘நிலைநிறுத்தும்’ அந்த இறையியல் நெருக்கடியைத் தீர்த்துவிடாமல் பேணுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளக்கூடிய கண்ணியமான செப நடையில் வடிவமைக்கப்பட்டது. ‘உமது/உம்மை’ என்ற மரியாதை ஒருமை இறைவனை நோக்கிய உரைக்கு பயன்படுத்தப்பட்டது. மூலத்தின் கூட்டு ஒருமையான ‘இதயம்’ பாதுகாக்கப்பட்டுள்ளது; அரிதான வடமொழிச் சொற்களும் பழமையான வினைமுற்றுகளும் தவிர்க்கப்பட்டுள்ளன.
