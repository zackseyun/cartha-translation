source:
  edition: WLC
  text: וְ/הַ/יָּמִ֗ים אֲשֶׁ֤ר מָלַךְ֙ עַל יִשְׂרָאֵ֔ל אַרְבָּעִ֖ים שָׁנָ֑ה בְּ/חֶבְר֤וֹן מָלַךְ֙ שֶׁ֣בַע שָׁנִ֔ים וּ/בִ/ירוּשָׁלִַ֥ם מָלַ֖ךְ שְׁלֹשִׁ֥ים וְ/שָׁלֽוֹשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/027.yaml
  text: The days that he reigned over Israel were forty years. In Hebron he reigned seven years, and in Jerusalem he reigned thirty-three years.
translation:
  language: ta
  text: அவர் இஸ்ரவேலை அரசாண்ட காலம் நாற்பது ஆண்டுகள். எப்ரோனில் அவர் ஏழு ஆண்டுகளும், மேலும் எருசலேமில் முப்பத்து மூன்று ஆண்டுகளும் அரசாண்டார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַיָּמִים אֲשֶׁר מָלַךְ
  choice: அவர் ... அரசாண்ட காலம்
  rationale: எபிரெய மொழியின் சொற்படியான ‘அவர் அரசாண்ட நாட்கள்’ என்பது தமிழில் இயல்பற்றதாக இருப்பதால், ஆட்சியின் கால அளவைக் குறிக்கும் இந்த மரபுத்தொடர் ‘அரசாண்ட காலம்’ என இயல்பாக மொழிபெயர்க்கப்பட்டது.
- source_word: עַל יִשְׂרָאֵל
  choice: இஸ்ரவேலின்மேல்
  rationale: עַל என்பதன் ஆட்சிசார் பொருளை ‘-ன்மேல்’ துல்லியமாகக் காட்டுகிறது; மூலத்தில் இல்லாத ‘முழு’ சேர்க்கப்படவில்லை.
- source_word: אַרְבָּעִים שָׁנָה
  choice: நாற்பது ஆண்டுகள்
  rationale: எண்ணிக்கையுடன் வரும் எபிரெய ஒருமை வடிவம் தமிழில் இயல்பான பன்மையாக வழங்கப்பட்டது.
- source_word: בְּחֶבְרוֹן
  choice: எப்ரோனில்
  rationale: בְּ இடத்தைக் குறிக்கிறது; நகரப் பெயர் நவீனத் தமிழில் பரவலாக அறியப்படும் வடிவில் தரப்பட்டது.
- source_word: מָלַךְ שֶׁבַע שָׁנִים
  choice: அவர் ஏழு ஆண்டுகளும் ... அரசாண்டார்
  rationale: מָלַךְ என்பதற்கு அரசரின் ஆட்சியைக் குறிக்கும் இயல்பான தமிழ் வினையான ‘அரசாண்டார்’ பயன்படுத்தப்பட்டது; இணை அமைப்பைத் தெளிவாகக் காக்க ‘-உம்’ சேர்க்கப்பட்டது.
- source_word: וּבִירוּשָׁלִַם
  choice: எருசலேமில்
  rationale: இணைப்பும் இடப்பொருளும் தமிழ் வாக்கியத்தின் இணை அமைப்பில் ‘எருசலேமில்’ மற்றும் ‘-உம்’ வழியாக இயல்பாக வெளிப்படுத்தப்பட்டன.
- source_word: שְׁלֹשִׁים וְשָׁלוֹשׁ
  choice: முப்பத்து மூன்று
  rationale: எபிரெய ‘முப்பதும் மூன்றும்’ என்ற அமைப்பு நவீனத் தமிழின் வழக்கமான கூட்டெண் வடிவில் வழங்கப்பட்டது.
