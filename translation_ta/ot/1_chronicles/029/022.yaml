base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/022.yaml
  text: And they ate and drank before Yahweh on that day with great joy[a], and they made Solomon son of David king a second time, and they anointed him for Yahweh as ruler[d][c][b], and Zadok as priest.
translation:
  language: ta
  text: அந்த நாளில் அவர்கள் யாவேவின் முன்னிலையில் மிகுந்த மகிழ்ச்சியோடு உண்டும் குடித்தும் இருந்தார்கள். தாவீதின் மகன் சாலொமோனை இரண்டாம் முறையாக அரசனாக்கினார்கள்; யாவேக்காக அவரைத் தலைவராகவும் சாதோக்கை ஆசாரியராகவும் அபிஷேகம் செய்தார்கள்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மீண்டும் அரசனாக்கினார்கள்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “யாவேவின் முன்னிலையில் அவரைத் தலைவராக அபிஷேகம் செய்தார்கள்.” எபிரெயச் சொற்றொடர் யாவேக்கான அர்ப்பணிப்பையோ, அவரது முன்னிலையில் செய்யப்பட்ட செயலையோ குறிக்கலாம். “தலைவர்” என்பதற்கான எபிரெயச் சொல் சில சூழல்களில் “இளவரசர்” அல்லது “ஆளுநர்” என்றும் மொழிபெயர்க்கப்படலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: לִפְנֵי יְהוָה
  choice: யாவே முன்னிலையில்
  rationale: இச்சொற்றொடர் யாவேயின் முன்னிலையிலோ சந்நிதியிலோ இருப்பதைக் குறிக்கிறது. இயல்பான நவீன தமிழில் ‘யாவே முன்னிலையில்’ என்பது அந்த வழிபாட்டுச் சூழலைத் தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெயத் திருப்பெயரான יהוה-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், அதன் தனிப்பெயர் தன்மையைத் தக்கவைக்கும் தமிழ் ஒலிபெயர்ப்பு.
- source_word: בְּשִׂמְחָה גְדוֹלָה
  choice: மிகுந்த மகிழ்ச்சியடைந்தார்கள்
  rationale: மூலத்தில் உள்ள விதத்தைக் குறிக்கும் சொற்றொடரின் கொண்டாட்ட உணர்வை இயல்பான தமிழில் வெளிப்படுத்துகிறது; அவர்கள் உண்டு குடித்த செயல் மிகுந்த மகிழ்ச்சியோடு நடந்தது.
- source_word: וַיַּמְלִיכוּ
  choice: அரசனாக்கி
  rationale: מלך என்பதன் ஹிஃபீல் வடிவம் ‘அரசனாக ஆக்குதல்’ என்பதைக் குறிக்கிறது. மூலத்தில் வெளிப்படையாக இல்லாத முடிசூட்டும் சடங்கைச் சேர்க்காமல் பொருளைத் துல்லியமாகக் காக்கிறது.
- source_word: שֵׁנִית
  choice: இரண்டாம் முறையாக
  rationale: மீண்டும் நிகழ்ந்ததைக் குறிப்பது மட்டுமல்லாமல் அது இரண்டாவது முறை என்பதையும் மூலத்தைப் போலத் தெளிவாகக் காட்டுகிறது.
- source_word: וַיִּמְשְׁחוּ
  choice: அபிஷேகம் செய்தார்கள்
  rationale: அரசர் மற்றும் ஆசாரியர் நிறுவுதலுக்குரிய சடங்கான எண்ணெய்பூசுதலைக் குறிக்கும் நிலைபெற்ற வேதாகமத் தமிழ் சொல்.
- source_word: לַיהוָה
  choice: யாவேக்காக
  rationale: லாமேத் முன்னொட்டு இங்கு யாவேயுடனான தொடர்பையோ அவருக்கான அர்ப்பணிப்பையோ குறிக்கலாம். ‘யாவேக்காக’ என்பது அந்த உறவைக் காக்கிறது; ஆனால் மாற்றுப் பொருளை அடிக்குறிப்பில் தருகிறது.
- source_word: לְנָגִיד
  choice: தலைவராக
  rationale: נָגִיד என்பது மக்கள்மேல் நியமிக்கப்பட்ட அதிகாரமுள்ள தலைவரைக் குறிக்கும். ‘தலைவர்’ நவீன தமிழில் இயல்பாகவும், ‘இளவரசர்’ என்ற தவறான வம்சநிலைப் பொருளைத் தவிர்ப்பதாகவும் உள்ளது.
- source_word: לְכֹהֵן
  choice: ஆசாரியராக
  rationale: כהן குறிக்கும் மதப்பணிப் பதவிக்கான தெளிவான, பரவலாக அறியப்பட்ட தமிழ் வேதாகமச் சொல்.
- source_word: בֶן דָּוִיד
  choice: தாவீதின் மகன்
  rationale: சாலொமோனின் வம்ச உறவை மூலத்தின்படி நேரடியாகத் தக்கவைக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல உரை திருப்பெயரை நேரடியாகப் பயன்படுத்துவதால், பட்டப்பெயரைப் பதிலிடாமல் தனிப்பெயரைத் தமிழ் ஒலிவடிவில் தருகிறது.
- issue: அபிஷேகப் பகுதியில் לַיהוָה என்பதன் பொருள்
  choice: யாவேக்காகத் தலைவராக
  alternative: யாவே முன்னிலையில் தலைவராக
  rationale: எபிரெய லாமேத் யாவேக்கான அர்ப்பணிப்பையோ அவருடைய அதிகாரத்தின்கீழான நியமனத்தையோ குறிக்கக்கூடும்; அது யாவே முன்னிலையில் செய்யப்பட்ட செயல் என்றும் புரிந்துகொள்ளப்படலாம். முதன்மை உரை அர்ப்பணிப்பு/தொடர்பு நுணுக்கத்தை வைத்துக்கொண்டு, உண்மையான மாற்றுப் பொருளை அடிக்குறிப்பில் தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘அபிஷேகம்’ மற்றும் ‘ஆசாரியர்’ ஆகியவை பரவலாக அறியப்பட்ட வேதாகமச் சொற்களாக இருப்பதால் தக்கவைக்கப்பட்டுள்ளன. தொடர்ச்சியான எபிரெய வாவ் அமைப்பை அப்படியே கடினமாகப் பின்பற்றாமல், தமிழின் இயல்பான வாக்கிய ஓட்டத்திற்காக ‘பின்பு’ பயன்படுத்தப்பட்டுள்ளது.
