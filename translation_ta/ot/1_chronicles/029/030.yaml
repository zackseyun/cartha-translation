translation_notes:
  register: நவீன நிலையான தமிழில், வரலாற்றுச் சுருக்கத்துக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. இது முந்தைய வசனத்தின் வாக்கியத்தைத் தொடரும் துணுக்காக இருப்பதால், பட்டியல் அமைப்பை ‘-உம்’ இணைப்புகளால் வைத்திருக்கிறது; எபிரெய மரபுத்தொடரின் அசாதாரண நேரடி உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
