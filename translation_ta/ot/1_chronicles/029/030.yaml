reference: 1 Chronicles 29:30
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: עִ֥ם כָּל מַלְכוּת֖/וֹ וּ/גְבוּרָת֑/וֹ וְ/הָ/עִתִּ֗ים אֲשֶׁ֨ר עָבְר֤וּ עָלָי/ו֙ וְ/עַל יִשְׂרָאֵ֔ל וְ/עַ֖ל כָּל מַמְלְכ֥וֹת הָ/אֲרָצֽוֹת־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/030.yaml
  text: along with all his reign and his might[b][a], and the times that passed over him and over Israel and over all the kingdoms of the lands.
translation:
  language: ta
  text: அவருடைய முழு ஆட்சிக்காலமும் அவருடைய வல்லமையும், அவருக்கும் இஸ்ரவேலுக்கும் எல்லா நாடுகளின் அரசுகளுக்கும்[b] நேரிட்ட காலங்களும்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடந்துபோன காலங்கள்.” எபிரெய மரபுத்தொடர் சொல்லுக்குச் சொல், “அவர்மேல் கடந்த காலங்கள்” என்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெய மூலத்தில் “நாடுகள்” என்பது பன்மையில் உள்ளது; இது சுற்றியுள்ள பிரதேசங்களையோ தேசங்களையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִם
  choice: -உம் (இணைப்புப் பொருள்)
  rationale: இது முந்தைய வசனத்திலுள்ள பதிவுகளுடன் இப்பட்டியலையும் இணைக்கிறது. வசனத் துணுக்கில் இயல்பான தமிழுக்காக இணைப்பு ‘-உம்’ விகுதிகளால் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: מַלְכוּתוֹ
  choice: அவருடைய முழு ஆட்சிக்காலம்
  rationale: தாவீதின் ஆட்சிப் பரப்பைவிட அவரது ஆட்சியின் காலத்தையும் தன்மையையும் சுருக்கமாகக் குறிப்பிடும் சூழல் இது; ‘முழு’ என்பது כָּל என்பதைக் காட்டுகிறது.
- source_word: גְבוּרָתוֹ
  choice: அவருடைய வல்லமை
  rationale: இந்தச் சொல் வலிமை, ஆற்றல் அல்லது வீரச் செயல்களைக் குறிக்கலாம். குறிப்பாகச் செயல்கள் என்று வரையறுக்காமல் அதன் பரந்த பொருளை ‘வல்லமை’ காக்கிறது.
- source_word: הָעִתִּים
  choice: காலங்கள்
  rationale: தாவீதுக்கும் மற்றவர்களுக்கும் ஏற்பட்ட காலச்சூழல்களையும் நிகழ்வுகளையும் குறிக்கும் பன்மையை நேரடியாகக் காக்கிறது.
- source_word: אֲשֶׁר עָבְרוּ עָלָיו
  choice: அவருக்கு நேரிட்ட
  rationale: ஒருவர்மேல் காலங்கள் ‘கடந்தன’ என்ற எபிரெய மரபுத்தொடரை நவீனத் தமிழில் இயல்பாகவும் பொருள் தெளிவாகவும் தருகிறது; நேரடி உருவகம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: וְעַל יִשְׂרָאֵל
  choice: இஸ்ரவேலுக்கும்
  rationale: ‘அவருக்கும் ... இஸ்ரவேலுக்கும் ... அரசுகளுக்கும்’ என்ற இணையான அமைப்பில் மீண்டும் வரும் עַל முன்னிடைச்சொல்லின் தொடர்பைக் காக்கிறது.
- source_word: כָּל מַמְלְכוֹת הָאֲרָצוֹת
  choice: எல்லா நாடுகளின் அரசுகள்
  rationale: מַמְלְכוֹת மற்றும் אֲרָצוֹת ஆகிய இரண்டும் பன்மையில் இருப்பதைக் காக்கிறது. சூழலில் சுற்றியுள்ள நாடுகள் அல்லது பிரதேசங்களின் அரசுகளைக் குறிக்கிறது.
