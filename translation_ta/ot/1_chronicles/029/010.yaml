id: 1CH.29.10
reference: 1 Chronicles 29:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יְבָ֤רֶךְ דָּוִיד֙ אֶת יְהוָ֔ה לְ/עֵינֵ֖י כָּל הַ/קָּהָ֑ל וַ/יֹּ֣אמֶר דָּוִ֗יד בָּר֨וּךְ אַתָּ֤ה יְהוָה֙ אֱלֹהֵי֙ יִשְׂרָאֵ֣ל אָבִ֔י/נוּ מֵ/עוֹלָ֖ם וְ/עַד עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/010.yaml
  text: Then David blessed Yahweh in the sight of all the assembly[a], and David said, “Blessed are you, Yahweh, the God of Israel our father, from everlasting to everlasting.”
translation:
  language: ta
  text: பின்பு தாவீது கூடியிருந்த மக்கள் அனைவரின் முன்னிலையில் யாவேவை வாழ்த்தினான். தாவீது, “எங்கள் தந்தையாகிய இஸ்ரவேலின் கடவுளான யாவே, அனாதிகாலமுதல் என்றென்றைக்கும் நீர் வாழ்த்தப்படுவீராக!” என்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְבָרֶךְ
  choice: வாழ்த்தினான்
  rationale: தேவனை நோக்கிப் புகழ்ந்து வாழ்த்துவதைக் குறிக்கும் பியேல் வினையின் வழிபாட்டுத் தொனியைத் தக்கவைக்கிறது; அடுத்து வரும் בָּרוּךְ என்பதுடனான சொல்லிணைப்பையும் ‘வாழ்த்தப்படுவீராக’ என்பதன் மூலம் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் தெளிவாக ஒலிபெயர்க்கிறது.
- source_word: לְעֵינֵי כָּל הַקָּהָל
  choice: கூடியிருந்த மக்கள் அனைவரின் முன்னிலையில்
  rationale: ‘சபை முழுவதின் கண்களுக்கு முன்பாக’ என்ற எபிரெயப் பொருளின் பொதுவான, வெளிப்படையான நிகழ்வு என்ற நுணுக்கத்தை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: בָּרוּךְ אַתָּה
  choice: நீர் வாழ்த்தப்படுவீராக
  rationale: நேரடி விளிப்பையும் வழிபாட்டு வாழ்த்துரையின் வலிமையையும் காக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: אֱלֹהֵי יִשְׂרָאֵל אָבִינוּ
  choice: எங்கள் தந்தையாகிய இஸ்ரவேலின் கடவுள்
  rationale: אָבִינוּ என்பதை இஸ்ரவேல்/யாக்கோபைக் குறிக்கும் இணைநிலையாக எடுத்துக்கொண்டு, மூலமொழியின் முதன்மையான தொடரமைப்பைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: מֵעוֹלָם וְעַד עוֹלָם
  choice: என்றென்றைக்கும்
  rationale: எல்லையற்ற காலநீட்சியைக் குறிக்கும் எபிரெய மரபுத்தொடரை இயல்பான, உயர்வான தமிழில் சுருக்கமாக வழங்குகிறது.
theological_decisions:
- issue: אָבִינוּ (‘எங்கள் தந்தை’) என்பதன் குறிப்பு
  choice: ‘எங்கள் தந்தை’ என்பது இஸ்ரவேல்/யாக்கோபைக் குறிக்கிறது
  alternative: ‘எங்கள் தந்தையே’ என்று கடவுளை நேரடியாக அழைப்பதாக வாசிக்கலாம்
  rationale: சொற்றொடரமைப்பில் אָבִינוּ என்பது ‘இஸ்ரவேல்’ என்பதற்கான இணைநிலையாக வருவது இயல்பான வாசிப்பு. எனினும் கடவுளை ‘எங்கள் தந்தை’ என்று நேரடியாக விளிக்கும் வாசிப்பும் இலக்கண ரீதியாக சாத்தியமுள்ளதால் அது அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் வகையிலும் வழிபாட்டுக்குரிய கண்ணியமான தொனியுடனும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘சபை’ என்ற சொல்லால் ஏற்படக்கூடிய பிற்கால சமயநிறுவனச் சாயலைத் தவிர்க்க ‘கூடியிருந்த மக்கள் அனைவரும்’ பயன்படுத்தப்பட்டுள்ளது; இறைப்பெயர் ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டுள்ளது.
