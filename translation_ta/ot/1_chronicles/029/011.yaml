id: 1CH.29.11
reference: 1 Chronicles 29:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: לְ/ךָ֣ יְ֠הוָה הַ/גְּדֻלָּ֨ה וְ/הַ/גְּבוּרָ֤ה וְ/הַ/תִּפְאֶ֨רֶת֙ וְ/הַ/נֵּ֣צַח וְ/הַ/ה֔וֹד כִּי כֹ֖ל בַּ/שָּׁמַ֣יִם וּ/בָ/אָ֑רֶץ לְ/ךָ֤ יְהוָה֙ הַ/מַּמְלָכָ֔ה וְ/הַ/מִּתְנַשֵּׂ֖א לְ/כֹ֥ל לְ/רֹֽאשׁ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/011.yaml
  text: Yours[a], O Yahweh, are the greatness and the power and the splendor and the victory and the majesty, for everything in the heavens and on the earth is yours. Yours, O Yahweh, is the kingdom, and you are exalted as head over all.
translation:
  language: ta
  text: யாவே, மகத்துவமும் வல்லமையும் மாட்சியும் வெற்றியும் மேன்மையும் உம்முடையவை[a]; ஏனெனில் வானங்களிலும் பூமியிலும் உள்ள அனைத்தும் உம்முடையவை. யாவே, அரசாட்சி உம்முடையது; அனைத்திற்கும் தலைவராக நீர் உயர்ந்திருக்கிறீர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “வெற்றி” என்பதற்குப் பதிலாக “நிலைத்தன்மை” அல்லது “மேலாதிக்கம்” என்றும் மொழிபெயர்க்கலாம்; இங்குள்ள எபிரெயச் சொல் נֵצַח வெற்றியுடன் நீடித்த முதன்மையையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் உள்ள இறைப் பெயரைப் பொதுப்பட்டப் பெயராக மாற்றாமல், தமிழில் அதன் ஒலிப்புக்கு நெருக்கமாக வழங்குகிறது.
- source_word: לְךָ
  choice: உம்முடையவை / உம்முடையது
  rationale: உடைமை அல்லது உரிமையைக் குறிக்கும் வடிவம். தொடக்கத்திலும் பின்னரும் வரும் வலியுறுத்தப்பட்ட மறுபடியுரைத்தலைத் தமிழில் இயல்பாகப் பேணுகிறது.
- source_word: הַגְּדֻלָּה
  choice: மகத்துவம்
  rationale: பெருமை, மேன்மை என்ற பொருளுடைய அருவப்பெயருக்கு நேரான, கண்ணியமான தமிழ் இணை.
- source_word: הַגְּבוּרָה
  choice: வல்லமை
  rationale: ஆற்றல், பலம் ஆகிய பொருள்களைத் தருகிறது; புகழ்ச்சித் தொடரின் உயர்ந்த நடைக்கு ஏற்றது.
- source_word: הַתִּפְאֶרֶת
  choice: மாட்சி
  rationale: அழகு, மகிமை, சிறப்பு ஆகிய பொருள் வட்டத்தைச் சுருக்கமாக வெளிப்படுத்துகிறது; அருகிலுள்ள மேன்மை என்ற சொல்லுடன் தேவையற்ற ஒற்றுமையைத் தவிர்க்கிறது.
- source_word: הַנֵּצַח
  choice: வெற்றி
  rationale: இச்சூழலின் அரசருக்குரிய புகழ்ச்சிப் பட்டியலில் வெற்றி அல்லது நீடித்த மேலாதிக்கத்தைக் குறிக்கலாம். முதன்மை உரையில் 'வெற்றி' என்றும் மாற்றுச் சாத்தியங்கள் அடிக்குறிப்பிலும் தரப்படுகின்றன.
- source_word: הַהוֹד
  choice: மேன்மை
  rationale: கம்பீரம், மாட்சிமை, பெருமை ஆகியவற்றை உள்ளடக்கும் இயல்பான தமிழ் சொல்; תפארת என்பதற்குத் தேர்ந்த 'மாட்சி' என்பதிலிருந்து வேறுபாட்டையும் பேணுகிறது.
- source_word: כִּי כֹל בַּשָּׁמַיִם וּבָאָרֶץ
  choice: ஏனெனில் வானங்களிலும் பூமியிலும் உள்ள அனைத்தும்
  rationale: כִּי என்பதன் காரணப் பொருளையும், כֹל என்பதன் அனைத்தையும் உள்ளடக்கும் பொருளையும், שׁמים என்பதன் பன்மை வடிவத்தையும் தெளிவாகப் பேணுகிறது.
- source_word: הַמַּמְלָכָה
  choice: அரசாட்சி
  rationale: இங்கு நிலப்பரப்பைக் காட்டிலும் அரசுரிமை, ஆட்சி, இறையாண்மை ஆகிய கருத்துகள் முன்னிலையில் உள்ளதால் 'அரசாட்சி' பொருத்தமானது.
- source_word: וְהַמִּתְנַשֵּׂא
  choice: உயர்ந்திருப்பவர் நீரே
  rationale: எபிரெயப் பங்கேற்பு வடிவத்தின் தொடரும் நிலையை வெளிப்படுத்தி, தமிழில் இயல்பான பயனிலை வாக்கியமாக அமைகிறது.
- source_word: לְכֹל לְרֹאשׁ
  choice: அனைத்திற்கும் தலைவராக
  rationale: எல்லாவற்றின்மீதும் உள்ள முதன்மை மற்றும் ஆளும் நிலையைச் சுட்டும் 'தலை' உருவகத்தைப் பேணுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: யெகோவா; ஆண்டவர்
  rationale: மூல உரையின் தனிப்பட்ட இறைப் பெயரைப் பொதுப்பட்டப் பெயரால் மறைக்காமல், பரவலாக அறியப்படும் தமிழ் ஒலிபெயர்ப்பில் தருகிறது.
- issue: נֵצַח என்பதன் பொருள்
  choice: வெற்றி
  alternative: நித்திய நிலை; மேலாதிக்கம்
  rationale: அரசருக்குரிய புகழ்ப்பண்புகளின் இத்தொடரில் 'வெற்றி' பொருத்தமாக உள்ளது. எனினும், இச்சொல் நீடித்த தன்மை அல்லது மேலோங்கிய முதன்மையையும் குறிக்கக்கூடியதால் அந்த உண்மையான பொருள் ஐயம் அடிக்குறிப்பில் பேணப்படுகிறது.
- issue: הַמַּמְלָכָה என்பதன் கருத்து
  choice: அரசாட்சி
  alternative: அரசு; அரசுரிமை
  rationale: இங்கு யாவேக்குரிய ஆளுகை மற்றும் இறையாண்மையை இயல்பாக வெளிப்படுத்துகிறது; ஒரு நிலப்பரப்பு மட்டுமே குறிக்கப்படுவதாகச் சுருக்கவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், வழிபாட்டு உரைக்கு ஏற்ற கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டது. இறைவனை நோக்கும் மரியாதைப் பன்மை வடிவங்களான 'உம்/நீர்' பயன்படுத்தப்பட்டுள்ளன. எபிரெயப் புகழ்ச்சிப் பட்டியலின் ஒத்திசைவும், 'உம்முடையவை/உம்முடையது' என்ற வலியுறுத்தப்பட்ட மறுபடியுரைத்தலும் பேணப்பட்டுள்ளன.
