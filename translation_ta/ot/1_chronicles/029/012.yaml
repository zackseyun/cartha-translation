id: 1CH.29.12
reference: 1 Chronicles 29:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/הָ/עֹ֤שֶׁר וְ/הַ/כָּבוֹד֙ מִ/לְּ/פָנֶ֔י/ךָ וְ/אַתָּה֙ מוֹשֵׁ֣ל בַּ/כֹּ֔ל וּ/בְ/יָדְ/ךָ֖ כֹּ֣חַ וּ/גְבוּרָ֑ה וּ/בְ/יָ֣דְ/ךָ֔ לְ/גַדֵּ֥ל וּ/לְ/חַזֵּ֖ק לַ/כֹּֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/012.yaml
  text: Both riches and honor come from before you[a], and you rule over all. In your hand are power and might[c][b], and in your hand it is to make great and to strengthen all.
translation:
  language: ta
  text: செல்வமும் மதிப்பும்[b] உமது முன்னிலையிலிருந்தே வருகின்றன[a]; நீரே அனைத்தையும் ஆளுகிறீர். உமது கையில் ஆற்றலும் வல்லமையும் உள்ளன; அனைத்தையும் மேன்மைப்படுத்தவும்[c] வலுப்படுத்தவும் உமது கையிலேயே உள்ளது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உம்மிடமிருந்து வருகின்றன’ அல்லது ‘உமது சந்நிதியிலிருந்து வருகின்றன’; எபிரெயத்தில் சொல்லுக்குச் சொல், ‘உமது முன்னிலையிலிருந்து.’
    reason: lexical_alternative
  - marker: b
    text: ‘மதிப்பு’ என்பதை ‘மகிமை’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: ‘மேன்மைப்படுத்த’ என்பதை ‘உயர்த்த’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֹשֶׁר
  choice: செல்வம்
  rationale: பொருளாதார வளத்தைக் குறிக்கும் பெயர்ச்சொல்லுக்கு இயல்பான, உயர்நடைக்கு ஏற்ற நவீனத் தமிழ்ச் சொல்.
- source_word: הַכָּבוֹד
  choice: மதிப்பு
  rationale: இங்கு செல்வத்துடன் இணைந்து வரும் சமூக மேன்மை அல்லது கனம் என்ற பொருளைத் தெளிவாகத் தருகிறது; ‘மகிமை’ என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: מִלְּפָנֶיךָ
  choice: உமது முன்னிலையிலிருந்தே வருகின்றன
  rationale: ‘உமது முகம்/முன்னிலையிலிருந்து’ என்ற எபிரெய உருவகத்தைத் தக்கவைத்தபடி, அது மூலத்தைக் குறிக்கிறது என்பதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מוֹשֵׁל בַּכֹּל
  choice: நீரே அனைத்தையும் ஆளுகிறீர்
  rationale: தொடர்ச்சியான இறையாட்சியை வெளிப்படுத்துகிறது; வலியுறுத்தும் ‘நீரே’ ஜெபநடைக்கு இயல்பாக உள்ளது.
- source_word: בְיָדְךָ
  choice: உமது கையில்
  rationale: உடைமை, ஆளுகை, செயலாற்றும் அதிகாரம் ஆகியவற்றைக் குறிக்கும் மூலத்தின் தெளிவான கை உருவகத்தைத் தக்கவைக்கிறது.
- source_word: כֹּחַ
  choice: ஆற்றல்
  rationale: செயலாற்றும் திறன் அல்லது சக்தியைச் சுட்டுகிறது; அடுத்து வரும் சொல்லிலிருந்து ஓரளவு வேறுபாட்டைக் காக்கிறது.
- source_word: גְבוּרָה
  choice: வல்லமை
  rationale: மிகுந்த பலத்தையும் ஆற்றல்மிக்க செயல்திறனையும் குறிக்கிறது; ‘ஆற்றலும் வல்லமையும்’ என்பது இயல்பான இணைச்சொல்.
- source_word: לְגַדֵּל
  choice: மேன்மைப்படுத்த
  rationale: ஒருவரையோ ஒன்றையோ பெரியதாக அல்லது உயர்ந்ததாக ஆக்குதல் என்ற causative பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: לְחַזֵּק
  choice: வலுப்படுத்த
  rationale: பலமடையச் செய்தல் என்ற வினையின் நேரடியான, நவீனத் தமிழாக்கம்.
- source_word: לַכֹּל
  choice: அனைத்தையும்
  rationale: மனிதர்கள் அல்லது பொருள்கள் என்று பொருளைச் சுருக்காமல், எபிரெயச் சொல்லின் விரிவான மற்றும் தெளிவுறாத எல்லையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: מִלְּפָנֶיךָ என்பதில் செல்வமும் மதிப்பும் கடவுளிடமிருந்து வருவதை எவ்வாறு வெளிப்படுத்துவது
  choice: உமது முன்னிலையிலிருந்தே வருகின்றன
  alternative: உம்மிடமிருந்து வருகின்றன / உமது சந்நிதியிலிருந்து வருகின்றன
  rationale: மூலத்தில் உள்ள ‘முன்னிலை/முகம்’ என்ற உருவகத்தை அழிக்காமல், கடவுளே அவற்றின் மூலம் என்ற கருத்தை வெளிப்படுத்துகிறது.
- issue: לַכֹּל என்பது அனைவரையா அனைத்தையுமா குறிக்கிறது
  choice: அனைத்தையும்
  alternative: அனைவரையும்
  rationale: சூழலில் மனிதர்களைக் குறிக்கும் வாய்ப்பு இருந்தாலும், மூலச்சொல் விரிவான பொருளைக் கொண்டிருப்பதால் அதன் தெளிவுறாமையையும் இறையாட்சியின் பரப்பையும் சுருக்காமல் வைத்துள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், ஜெபத்துக்குரிய கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. ‘நீர்/உமது’ வடிவங்கள் இறைவனை நேரடியாக விளிக்கும் உயர்நடையைப் பேணுகின்றன. மூலத்தின் ‘கை’ மற்றும் ‘முன்னிலை’ உருவகங்கள் பாதுகாக்கப்பட்டுள்ளன.
