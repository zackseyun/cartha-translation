  source_fidelity: 'மூல எபிரெயத்தின் இணை அமைப்பும் கருத்தோட்டமும் நன்றாகக் காக்கப்பட்டுள்ளன: செல்வமும் கனமும் கடவுளின் முன்னிலையிலிருந்து வருகின்றன; அவர் அனைத்தின்மேலும் ஆளுகிறார்; ஆற்றலும் வல்லமையும் அவரது கையில் உள்ளன; உயர்த்தவும் வலுப்படுத்தவும் அவருக்கே அதிகாரம் உள்ளது. מִלְּפָנֶיךָ என்பதன் ‘முன்னிலையிலிருந்து’ உருவகமும், בְיָדְךָ என்பதன் ‘கையில்’ உருவகமும் தக்கவைக்கப்பட்டுள்ளன. לַכֹּל என்பதன் விரிவான ‘all’ பொருளை ‘அனைத்தையும்’ எனத் திறந்த நிலையில் வைத்திருப்பதும் ஏற்கத்தக்கது.'
