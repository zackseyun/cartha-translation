base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/020.yaml
  text: Then David said to all the assembly, “Now bless Yahweh your God.” And all the assembly blessed Yahweh, the God of their fathers, and bowed their heads and prostrated themselves before Yahweh and before the king.
translation:
  language: ta
  text: பின்பு தாவீது கூடியிருந்த அனைவரிடமும், “இப்போது உங்கள் இறைவனாகிய யாவேவைப் போற்றுங்கள்[a]” என்றார். அனைவரும் தங்கள் மூதாதையரின் இறைவனாகிய யாவேவைப் போற்றி, தலை குனிந்து, யாவேவுக்கும் அரசனுக்கும் முன்பாக நெடுஞ்சாண்கிடையாக விழுந்தார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தயவுசெய்து ... போற்றுங்கள்” என்றும் மொழிபெயர்க்கலாம். נָא என்ற சொல் வேண்டுகோளையோ உடனடித் தூண்டுதலையோ சேர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெய உரை அவர்கள் “யாவேவுக்கும் அரசனுக்கும்” முன்பாக நெடுஞ்சாண்கிடையாக விழுந்ததாகக் கூறுகிறது. இது உடலால் காட்டப்பட்ட பணிவை விவரிக்கிறது; அரசனுக்குச் செய்த செயலைச் சில மொழிபெயர்ப்புகள் “மரியாதை செலுத்தினார்கள்” என்று தருகின்றன.
    reason: alternative_reading
lexical_decisions:
- source_word: בָּרְכוּ נָא
  choice: இப்போது ... போற்றுங்கள்
  rationale: ברך என்பதன் ஏவல் வடிவம் இங்கு இறைவனை வாழ்த்திப் புகழுமாறு அழைக்கிறது. נָא வேண்டுகோளையோ உடனடித் தூண்டுதலையோ குறிக்கலாம்; இயல்பான நவீன தமிழில் ‘இப்போது’ என்பது அந்தத் தூண்டுதலைத் தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: இறைத் திருப்பெயரை ஒரு பொதுப் பட்டமான ‘ஆண்டவர்’ என்று மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட தனிப்பெயர் வடிவமாக வழங்குகிறது.
- source_word: הַקָּהָל
  choice: சபையார் அனைவரும்
  rationale: கூடியிருந்த மக்கள் கூட்டத்தைக் குறிக்கும் קהל என்பதற்கு, வழிபாட்டுச் சூழலிலும் பொதுமக்களுக்கு இயல்பாகப் புரியும் கூட்டுப் பெயர்.
- source_word: אֱלֹהֵי אֲבֹתֵיהֶם
  choice: தங்கள் மூதாதையரின் இறைவன்
  rationale: முன்னோருடனான உடன்படிக்கைத் தொடர்ச்சியைச் சுட்டும் எபிரெயச் சொற்றொடரை, நவீன தமிழில் பாலினத்தால் தேவையின்றி வரையறுக்காத இயல்பான முறையில் தருகிறது.
- source_word: וַיִּקְּדוּ
  choice: தலைவணங்கி
  rationale: קדד குறிக்கும் குனிதலைச் சுருக்கமாகவும், அடுத்து வரும் முழு உடல் பணிவிலிருந்து வேறுபட்டதாகவும் தெரிவிக்கிறது.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: நெடுஞ்சாண்கிடையாக விழுந்தார்கள்
  rationale: השתחוה குறிக்கும் உடல் முழுவதுமான பணிவைத் தெளிவாகக் காட்டுகிறது; ‘வழிபட்டார்கள்’ என்று விளக்கமளித்து, அரசனுக்கும் அதே வகை தெய்வ வழிபாடு செலுத்தப்பட்டது என்ற முடிவை மொழிபெயர்ப்பே திணிப்பதைத் தவிர்க்கிறது.
- source_word: לַיהוָה וְלַמֶּלֶךְ
  choice: யெகோவாவுக்கும் அரசனுக்கும் முன்பாக
  rationale: இருவரையும் ஒரே எபிரெய வினைச்செயலின் இலக்குகளாக உரை குறிப்பிடுவதைத் தக்கவைத்தபடியே, உடல் பணிவின் இடவுறவை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: யெகோவாவுக்கும் அரசனுக்கும் காட்டப்பட்ட பணிவின் தன்மை
  choice: ஒரே உடல் செயலை இருவருக்கும் முன்பாகச் செய்ததாகத் தெளிவாக மொழிபெயர்த்தல்
  alternative: ‘யெகோவாவை வழிபட்டு, அரசனுக்கு மரியாதை செலுத்தினார்கள்’ என்று இரு செயல்களாக வேறுபடுத்துதல்
  rationale: எபிரெய உரை ஒரே உடல் பணிவு வினையை யெகோவாவுடனும் அரசனுடனும் இணைக்கிறது. மொழிபெயர்ப்பு அந்தச் சொற்றொடரைத் தக்கவைத்து, இருவருக்கும் ஒரே தெய்வீக மரியாதை கொடுக்கப்பட்டது என்றும், முற்றிலும் வேறு செயல்கள் நடந்தன என்றும் முன்கூட்டியே தீர்மானிக்காமல் அதன் இறையியல் இழுபறியைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன, பொதுவாகப் புரியும், வழிபாட்டுக்கேற்ற கண்ணியமான தமிழ். ‘இறைவன்’ என்பது אֱלֹהִים என்பதற்கும், ‘யெகோவா’ என்பது יהוה என்ற தனிப்பெயருக்கும் இடையிலான வேறுபாட்டைத் தக்கவைக்கிறது. ‘தலைவணங்கி’ மற்றும் ‘நெடுஞ்சாண்கிடையாக விழுந்தார்கள்’ என்ற இரட்டைச் சொற்பயன்பாடு மூலத்தின் தொடர்ச்சியான இரு உடல் செயல்களை வேறுபடுத்துகிறது.
