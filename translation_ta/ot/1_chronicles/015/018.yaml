base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/018.yaml
  text: 'And with them were their brothers of the second rank: Zechariah[a], Ben-Jaaziel, and Shemiramoth, and Jehiel, and Unni, Eliab, and Benaiah, and Maaseiah, and Mattithiah, and Eliphelehu, and Mikneiah, and Obed-edom, and Jeiel, the gatekeepers.'
translation:
  language: ta
  text: 'அவர்களுடன், இரண்டாம் நிலையைச் சேர்ந்த அவர்களுடைய சகோதரர்களும் இருந்தார்கள்: சகரியா, பென், யாசியேல், செமிராமோத், யெகியேல், உன்னி, எலியாப், பெனாயா, மாசெயா, மத்தித்தியா, எலிப்பெலேஹூ, மிக்னேயா, ஓபேத்-ஏதோம், யெயேல் ஆகியோர்; இவர்கள் வாயிற்காவலர்கள்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இரண்டாம் நிலையைச் சேர்ந்த அவர்களுடைய சகோதரர்கள்” என்பதற்கு, “இரண்டாம் குழுவைச் சேர்ந்த அவர்களுடைய சகோதரர்கள்” அல்லது “இரண்டாம் வரிசையிலிருந்த அவர்களுடைய சகோதரர்கள்” என்றும் பொருள் கொள்ளலாம். எபிரெயத் தொடர் லேவியர்கள் அல்லது இசைக்கலைஞர்களிடையே இருந்த இரண்டாம் நிலை, வரிசை அல்லது குழுவைச் சுட்டுவதாகத் தெரிகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעִמָּהֶם
  choice: அவர்களுடன் ... இருந்தார்கள்
  rationale: எபிரெய மொழியில் வினைச்சொல் வெளிப்படையாக இல்லாத உடனிருப்பைக் குறிக்கும் தொடரை இயல்பான தமிழில் கூற ‘இருந்தார்கள்’ சேர்க்கப்பட்டது.
- source_word: אֲחֵיהֶם
  choice: அவர்களுடைய சகோதரர்கள்
  rationale: சொல்லின் நேரடியான பொருளைத் தக்கவைக்கிறது; இச்சூழலில் இது உடன்பிறந்தவர்களை மட்டுமல்லாமல் சக லேவியர்களையும் குறிக்கக்கூடும்.
- source_word: הַמִּשְׁנִים
  choice: இரண்டாம் நிலையில் இருந்த
  rationale: ‘இரண்டாம்’ என்பதிலிருந்து வந்த இச்சொல், பட்டியலிடப்பட்டவர்களிடையே இரண்டாம் நிலை அல்லது வரிசையைச் சுட்டுவதாகத் தெரிகிறது; தெளிவில்லாத தன்மையை அடிக்குறிப்பு விளக்குகிறது.
- source_word: בֵּן וְיַעֲזִיאֵל
  choice: பென், யாசியேல்
  rationale: WLC உரையில் בֵּן என்பதற்குப் பின் இணைப்பிடைச்சொல்லுடன் יַעֲזִיאֵל வருவதால், அவற்றை இரண்டு ஒருங்கிணைக்கப்பட்ட பெயர்களாக மொழிபெயர்ப்பது உரையின் வெளிப்படையான வடிவத்தைப் பின்பற்றுகிறது; அவற்றை ‘பென்-யாசியேல்’ என்ற ஒரே பெயராக இணைக்கவில்லை.
- source_word: הַשֹּׁעֲרִים
  choice: வாயிற்காவலர்கள்
  rationale: வாயில்களைக் காக்கும் பொறுப்புடையவர்களைக் குறிக்கும் வழக்கமான பணிப்பெயர்.
