translation_notes:
  register: நவீனத் தரத் தமிழில், பட்டியல் நடையைத் தக்கவைத்தும் சாதாரண வாசகர்களுக்குப் புரியுமாறும் மொழிபெயர்க்கப்பட்டது. ஆண் நபர்களைக் குறிக்கும் אֲחֵיהֶם என்பதற்கு ‘சகோதரர்கள்’ பயன்படுத்தப்பட்டது. எபிரெய தனிப்பெயர்கள் தமிழில் ஒலிப்பெயர்க்கப்பட்டன; மூல உரையின் இணைப்பிடைச்சொல்லை மதித்து ‘பென்’ மற்றும் ‘யாசியேல்’ தனித்தனிப் பெயர்களாக வைக்கப்பட்டன.
