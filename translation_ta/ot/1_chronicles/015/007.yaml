translation_notes:
  register: நவீன நிலையான தமிழில், பட்டியல் நடையின் சுருக்கத்தைப் பேணும் கண்ணியமான மற்றும் எளிதில் புரியும் வடிவம். குடும்பத் தலைமை மற்றும் விரிந்த உறவுக்குழு என்ற சூழல் அடிக்குறிப்பால் தெளிவுபடுத்தப்பட்டுள்ளது.
