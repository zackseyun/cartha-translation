base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/007.yaml
  text: 'For the sons of Gershom: Joel the chief[b][a], and 130 of his brothers.'
translation:
  language: ta
  text: 'கெர்சோமின்[a] மகன்கள்: தலைவனாகிய யோவேலும், அவனுடைய சகோதரர்கள்[b] நூற்று முப்பது பேரும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கெர்சோன்” என்பது இந்தக் குலப்பெயரின் பரவலாக அறியப்பட்ட பாரம்பரிய வடிவம்; ஆனால் இங்குள்ள எபிரெய உரையில் “கெர்சோம்” என்று உள்ளது.
    reason: alternative_reading
  - marker: b
    text: இங்கு “சகோதரர்கள்” என்பது யோவேலுடன் அதே லேவியக் குடும்பப் பிரிவைச் சேர்ந்த ஆண்களைக் குறிக்கிறது; அவர்கள் அனைவரும் அவருடைய உடன்பிறந்தவர்களாக இருக்க வேண்டியதில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי
  choice: மகன்களில்
  rationale: ל prefixed to בני introduces this family group within a list. Tamil locative ‘மகன்களில்’ naturally presents those selected from the group while retaining the genealogical expression ‘sons.’
- source_word: גֵּרְשׁוֹם
  choice: கேர்சோம்
  rationale: The Masoretic form in this verse is Gershom; the Tamil transliteration reflects that form rather than silently substituting Gershon.
- source_word: יוֹאֵל
  choice: யோவேல்
  rationale: A standard Tamil transliteration of the Hebrew personal name יוֹאֵל.
- source_word: הַשַּׂר
  choice: தலைவனாகிய
  rationale: In this clan-based administrative list, שַׂר denotes the person who heads the group. ‘தலைவன்’ conveys this without suggesting royalty.
- source_word: וְאֶחָיו
  choice: அவனுடைய சகோதரர்கள்
  rationale: This preserves the primary kinship term, while a footnote clarifies that the context permits the broader sense of male members of the same Levitical family group.
- source_word: מֵאָה וּשְׁלֹשִׁים
  choice: 130 பேர்
  rationale: The cardinal number is rendered in digits for readability; ‘பேர்’ makes clear that people are being counted.
