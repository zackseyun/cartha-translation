- from: கேர்சோமின்[a] மகன்களில், தலைவனாகிய யோவேலும் அவனுடைய சகோதரர்கள்[b] 130 பேரும்.
  to: 'கெர்சோமின்[a] மகன்கள்: தலைவனாகிய யோவேலும், அவனுடைய சகோதரர்கள்[b] நூற்று முப்பது பேரும்.'
