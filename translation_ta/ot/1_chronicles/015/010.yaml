translation_notes:
  register: நவீன செந்தமிழ்ச் சார்ந்த, எளிதில் புரியும் பட்டியல் நடை பயன்படுத்தப்பட்டுள்ளது. வசனத்தின் சுருக்கமான அமைப்பும் குலவழிச் சொல்லாட்சியும் காக்கப்பட்டுள்ளன; [a] குறி உரையிலேயே இடம்பெற்றுள்ளது.
