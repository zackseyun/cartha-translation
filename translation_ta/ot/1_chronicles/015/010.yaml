  text: לִ/בְנֵ֖י עֻזִּיאֵ֑ל עַמִּינָדָ֣ב הַ/שָּׂ֔ר וְ/אֶחָ֕י/ו מֵאָ֖ה וּ/שְׁנֵ֥ים עָשָֽׂר׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/010.yaml
  text: 'For the sons of Uzziel: Amminadab the chief[a], and his brothers, one hundred and twelve.'
translation:
  language: ta
  text: உசியேலின் மகன்களில் அம்மினதாபு தலைவராக[a] இருந்தார்; அவருடைய சகோதரர்கள் நூற்றுப் பன்னிரண்டு பேர் இருந்தனர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தலைவர்’ என்பதற்கு ‘முதன்மையானவர்’ அல்லது ‘அதிபதி’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִ/בְנֵי
  choice: மகன்களில்
  rationale: לְ முன்னொட்டு இங்கு பட்டியலில் அடுத்த குலக்குழுவை அறிமுகப்படுத்துகிறது. தமிழில் ‘உசியேலின் மகன்களில்’ என்பது இயல்பாக அந்தக் குழுவிலிருந்து பெயரிடப்பட்ட தலைவரையும் எண்ணிக்கையையும் அறிமுகப்படுத்துகிறது; בנים என்பதன் வம்ச/குல மொழியையும் காக்கிறது.
- source_word: עֻזִּיאֵל
  choice: உசியேல்
  rationale: எபிரெய தனிப்பெயரின் ஒலிபெயர்ப்பு.
- source_word: עַמִּינָדָב
  choice: அம்மினதாபு
  rationale: எபிரெய தனிப்பெயரின் தமிழ் ஒலிபெயர்ப்பு; வேற்றுமை உருபு சேரும் அடிப்படை வடிவம் ‘அம்மினதாபு’.
- source_word: הַ/שָּׂר
  choice: தலைவர்
  rationale: שַׂר என்பது தலைவர், முதன்மையானவர், அதிகாரி அல்லது அதிபதி எனப் பொருள்படலாம். சுற்றியுள்ள லேவியக் குலத்தலைவர்களின் பட்டியல் சூழலில் ‘தலைவர்’ இயல்பானதும் பொருத்தமானதும்.
- source_word: וְ/אֶחָי/ו
  choice: அவருடைய சகோதரர்கள்
  rationale: אָח என்பது உடன்பிறந்த சகோதரர்களையோ விரிந்த ஆண் உறவினர்/குல உறுப்பினர்களையோ குறிக்கலாம். ‘சகோதரர்கள்’ மூலத்தின் குடும்பச் சொல்லாட்சியையும் அதன் சாத்தியமான விரிவையும் காக்கிறது.
- source_word: מֵאָה וּ/שְׁנֵים עָשָׂר
  choice: நூற்றுப் பன்னிரண்டு பேர்
  rationale: எண்ணிக்கையை இயல்பான நவீன தமிழில் தருகிறது; மனிதர்களைக் கணக்கிடுவதால் ‘பேர்’ சேர்க்கப்பட்டுள்ளது.
