- from: 'உசியேலின் மகன்களில்: தலைவரான அம்மினதாபும்[a] அவருடைய சகோதரர்கள் நூற்றுப் பன்னிரண்டு பேரும்.'
  to: உசியேலின் மகன்களில் அம்மினதாபு தலைவராக[a] இருந்தார்; அவருடைய சகோதரர்கள் நூற்றுப் பன்னிரண்டு பேர் இருந்தனர்.
