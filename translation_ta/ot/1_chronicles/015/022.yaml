  edition: WLC
  text: וּ/כְנַנְיָ֥הוּ שַֽׂר הַ/לְוִיִּ֖ם בְּ/מַשָּׂ֑א יָסֹר֙ בַּ/מַּשָּׂ֔א כִּ֥י מֵבִ֖ין הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/022.yaml
  text: And Chenaniah[a], chief of the Levites, directed the carrying[b], because he was skillful at it.
translation:
  language: ta
  text: லேவியர்களின் தலைவனான கெனனியா[a] சுமந்து செல்லும் பணியை வழிநடத்தினான்; ஏனெனில் அவன் அதில் தேர்ச்சி பெற்றிருந்தான்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “லேவியர்களின் தலைவனான கெனனியா பாடலை வழிநடத்தினான்; ஏனெனில் அவன் அதில் தேர்ச்சி பெற்றிருந்தான்.” מַשָּׂא என்ற எபிரேயச் சொல் பொதுவாக “சுமை” அல்லது “சுமந்து செல்லுதல்” என்று பொருள்படும்; ஆனால் சுற்றியுள்ள வசனங்களில் பாடகர்களும் இசைக்கருவி வாசிப்பவர்களும் குறிப்பிடப்படுவதால், சிலர் இங்கு அதை இசை சார்ந்த பொருளில் புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
  - marker: b
    text: எபிரேயத்தில் “சுமந்து செல்லும் பணியில் … சுமந்து செல்லும் பணியில்” என அதே பெயர்ச்சொல் மீண்டும் வருகிறது. தமிழில் இரண்டாவது இடத்தில் அது இயல்பாக “அதில்” என வழங்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְנַנְיָהוּ
  choice: கெனனியா
  rationale: எபிரேயத் தனிப்பெயரின் ஒலிப்பைத் தமிழில் இயல்பாகப் பெயர்த்தெழுதுகிறது.
- source_word: שַׂר הַלְוִיִּם
  choice: லேவியர்களின் தலைவன்
  rationale: வழிபாட்டு மற்றும் நிர்வாகச் சூழலில் தலைமைப் பொறுப்பை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: בְּמַשָּׂא
  choice: சுமக்கும் பணியை
  rationale: מַשָּׂא என்பதன் வழக்கமான ‘சுமை/சுமத்தல்’ என்ற பொருளையும், பேழையை எடுத்துச் செல்லும் உடனடிச் சூழலையும் பிரதிபலிக்கிறது.
- source_word: יָסֹר
  choice: மேற்பார்வையிட்டான்
  rationale: அறிவுறுத்துதல் அல்லது வழிநடத்துதல் உட்பட்ட பொறுப்பான கண்காணிப்பை இங்கு தெளிவாகத் தெரிவிக்கிறது.
- source_word: מֵבִין הוּא
  choice: அவன் அதில் திறமைபெற்றவனாக இருந்தான்
  rationale: வெறும் புரிதலைவிட, இப்பணியில் இருந்த நடைமுறைத் தேர்ச்சியைச் சுட்டுகிறது.
theological_decisions:
- issue: מַשָּׂא என்பதன் சூழல்சார் பொருள்
  choice: சுமக்கும் பணி
  alternative: பாடுதல் அல்லது இசைப்பணி
  rationale: இச்சொல்லின் இயல்பான எபிரேயப் பொருளும் பேழையை எடுத்துச் செல்லும் கதைச்சூழலும் ‘சுமக்கும் பணி’ என்பதை ஆதரிக்கின்றன; அருகிலுள்ள இசைச் சூழலால் தோன்றும் மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் கண்ணியமான, இயல்பான நடை. மூலத்தின் சொல்லியல் ஐயப்பாடு அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
