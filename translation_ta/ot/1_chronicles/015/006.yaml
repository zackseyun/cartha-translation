base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/006.yaml
  text: 'For the sons of Merari: Asaiah the chief[a], and 220 of his brothers.'
translation:
  language: ta
  text: மெராரியின் மகன்களில், தலைவனாகிய அசாயாவும், அவருடைய சகோதரர்கள்[a] 220 பேரும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆண் உறவினர்கள்.” எபிரெயச் சொல் ஒரே குலம் அல்லது குடும்பக் குழுவைச் சேர்ந்த ஆண்களையும் விரிவாகக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי מְרָרִי
  choice: மெராரியின் மகன்களில்
  rationale: לְ இங்கு பட்டியலின் அடுத்த குலக்குழுவை அறிமுகப்படுத்துகிறது. ‘மகன்களில்’ என்பது குலவழிக் குழுவைக் குறிக்கும் எபிரெயச் சொல்லமைப்பை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: עֲשָׂיָה
  choice: அசாயா
  rationale: எபிரெயத் தனிப்பெயரின் ஒலிப்பை நவீன தமிழில் இயல்பாக எழுத்துப்பெயர்த்த வடிவம்.
- source_word: הַשָּׂר
  choice: தலைவனாகிய
  rationale: שַׂר என்பது தலைவர், தலைவன், அதிகாரி போன்ற பொருள்களைக் கொள்ளலாம். இக்குலப்பட்டியல் சூழலில் அரச குடும்பப் பதவியை உணர்த்தாமல் குழுவின் அங்கீகரிக்கப்பட்ட தலைவரைக் குறிக்க ‘தலைவன்’ பொருத்தமானது.
- source_word: וְאֶחָיו
  choice: அவருடைய சகோதரர்கள்
  rationale: אָח என்ற சொல் நேரடியாக ‘சகோதரர்’ என்று பொருள்படும்; இச்சூழலில் அது ஒரே குலத்தைச் சேர்ந்த ஆண் உறவினர்களையும் விரிவாகக் குறிக்கக்கூடும். அந்த விரிவான சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: מָאתַיִם וְעֶשְׂרִים
  choice: 220 பேர்
  rationale: எண்ணை நவீன வாசிப்புக்கு ஏற்ற இலக்க வடிவில் கொடுத்து, மனிதர்களின் எண்ணிக்கை என்பதை ‘பேர்’ தெளிவுபடுத்துகிறது.
