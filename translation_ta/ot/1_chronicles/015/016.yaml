base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/016.yaml
  text: Then David told the leaders of the Levites to appoint their brothers, the singers, with musical instruments—harps, lyres, and cymbals—sounding aloud, to raise songs of joy.
translation:
  language: ta
  text: அப்போது தாவீது லேவியரின் தலைவர்களிடம், இசைக்கருவிகளான பேரியாழ்கள், யாழ்கள், கைத்தாளங்கள் ஆகியவற்றோடு உரத்த ஒலி எழுப்பி, மகிழ்ச்சியோடு குரலை உயர்த்துவதற்காகப் பாடகர்களான தங்கள் சகோதரர்களை[a] நியமிக்கும்படி கூறினார்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தங்கள் சகோதரர்கள்” என்பது அவர்களுடைய சக லேவியர்களைக் குறிக்கிறது.
    reason: cultural_note
  - marker: b
    text: எபிரெயச் சொற்றொடரை “மகிழ்ச்சிக்காகக் குரலை உயர்த்துவதற்கு” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது தாவீது ... கூறினார்
  rationale: தொடர்ச்சியான கதைநடையை וַ־ குறிக்கிறது; கட்டளையைத் தொடர்ந்து வரும் அமைப்பில் ‘கூறினார்’ இயல்பாகவும் மூலத்துக்கு நெருக்கமாகவும் உள்ளது.
- source_word: לְשָׂרֵי הַלְוִיִּם
  choice: லேவியரின் தலைவர்களிடம்
  rationale: שָׂרִים என்பதன் நிர்வாகச் சூழலுக்கேற்ற தெளிவான நவீனத் தமிழ் ‘தலைவர்கள்’.
- source_word: לְהַעֲמִיד
  choice: நியமித்து
  rationale: עמד என்பதன் ஹிஃபில் வடிவம் நிறுத்துதல், ஓர் இடத்தில் அமர்த்துதல், நியமித்தல் ஆகிய பொருள்களைத் தரலாம்; ஆலயப் பாடகர்களை ஒழுங்குபடுத்தும் இச்சூழலில் ‘நியமித்து’ பொருத்தமானது.
- source_word: אֶת אֲחֵיהֶם
  choice: தங்கள் சகோதரர்களை
  rationale: மூலத்தின் உறவுமுறைச் சொல்லைத் தக்கவைக்கிறது; இங்கு அது சக லேவியர்களைக் குறிக்கிறது.
- source_word: הַמְשֹׁרְרִים
  choice: பாடகர்களான
  rationale: שׁיר வேரிலிருந்து வந்த இச்சொல் பொதுவாக இசைக் கலைஞர்களை அல்ல, குறிப்பாகப் பாடகர்களைக் குறிக்கிறது.
- source_word: בִּכְלֵי שִׁיר
  choice: இசைக்கருவிகளாகிய
  rationale: ‘பாட்டின் கருவிகள்’ என்ற சொற்சொல் வடிவத்தை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: נְבָלִים
  choice: பேரியாழ்கள்
  rationale: பண்டைய நֶבֶל கருவியின் துல்லிய வடிவம் உறுதியல்ல; כִּנּוֹר இலிருந்து வேறுபடுத்திக் காட்டும் மரபான, புரிந்துகொள்ளத்தக்க தமிழ்ச் சொல் தேர்ந்தெடுக்கப்பட்டது.
- source_word: וְכִנֹּרוֹת
  choice: யாழ்கள்
  rationale: כִּנּוֹר பொதுவாக lyre வகைக் கம்பியிசைக் கருவியாக அடையாளப்படுத்தப்படுகிறது; தமிழில் ‘யாழ்’ நெருங்கிய, வாசகருக்குப் புரியும் இணைச்சொல்.
- source_word: וּמְצִלְתַּיִם
  choice: கைத்தாளங்கள்
  rationale: இணையாக மோதப்பட்டு ஒலி எழுப்பும் cymbals என்ற கருவியை நவீனத் தமிழில் தெளிவாகக் குறிக்கிறது.
- source_word: מַשְׁמִיעִים
  choice: உரத்த ஒலியெழுப்பி
  rationale: שׁמע என்பதன் ஹிஃபில் வடிவம் ‘கேட்கச் செய்தல்/ஒலிக்கச் செய்தல்’ என்பதைக் குறிக்கிறது; பொதுவெளியில் தெளிவாக ஒலிக்கச் செய்வதை இத்தொடர் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לְהָרִים בְּקוֹל לְשִׂמְחָה
  choice: மகிழ்ச்சியுடன் குரலை உயர்த்தும்படி
  rationale: ‘மகிழ்ச்சிக்காக/மகிழ்ச்சியுடன் குரலை உயர்த்துதல்’ என்ற எபிரெயச் சொல்லமைப்பை, ‘பாடல்களை’ என்று வெளிப்படையாகச் சேர்க்காமல் நெருக்கமாகப் பாதுகாக்கிறது.
