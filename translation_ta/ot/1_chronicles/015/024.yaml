base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/024.yaml
  text: And Shebaniah[a], Jehoshaphat, Nethanel, Amasai, Zechariah, Benaiah, and Eliezer the priests were blowing the trumpets before the ark of God[c][b], and Obed-edom and Jehiah were gatekeepers for the ark.
translation:
  language: ta
  text: ஆசாரியர்களான செபனியா, யோசபாத், நெதனேல், அமாசாய், சகரியா, பெனாயா, எலியேசர் ஆகியோர் தேவனுடைய பெட்டிக்கு முன்பாக எக்காளங்களை[b] ஊதிக்கொண்டிருந்தார்கள்[a]. ஓபேத்-ஏதோமும் யெகியாவும் அந்தப் பெட்டிக்கான வாயிற்காவலர்களாக[c] இருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எக்காளங்களை முழங்கிக்கொண்டிருந்தார்கள்.”
    reason: lexical_alternative
  - marker: b
    text: இங்கு பயன்படுத்தப்பட்டுள்ள எபிரெயச் சொல், வழிபாட்டில் ஆசாரியர்கள் பயன்படுத்திய நேரான சடங்கு எக்காளங்களைப் பொதுவாகக் குறிக்கிறது.
    reason: cultural_note
  - marker: c
    text: அல்லது, “அந்தப் பெட்டிக்கான கதவுகாப்பாளர்களாக.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּהֲנִים
  choice: ஆசாரியர்களான
  rationale: குறிப்பிட்ட ஏழு பேரும் ஆசாரியக் குழுவைச் சேர்ந்தவர்கள் என்பதை எபிரெய வரையறைச் சுட்டி காட்டுகிறது; தமிழில் பெயர்ப்பட்டியலோடு இயல்பாக இணைக்க இந்த வடிவம் பயன்படுத்தப்பட்டது.
- source_word: מחצצרים
  choice: ஊதிக்கொண்டிருந்தார்கள்
  rationale: எபிரெயப் பங்கேற்புவினை ஊர்வலத்தின்போது தொடர்ச்சியாக நடைபெற்ற செயலைக் குறிக்கிறது; இத்தமிழ் வடிவம் அந்த நீடித்த செயற்பாட்டை வெளிப்படுத்துகிறது.
- source_word: בַּחֲצֹצְרוֹת
  choice: எக்காளங்களை
  rationale: இச்சொல் பொதுவாக ஆசாரியர்கள் வழிபாட்டில் பயன்படுத்திய நேரான சடங்கு எக்காளங்களைக் குறிக்கிறது. இந்த வசனத்தில் வெள்ளி என்று வெளிப்படையாக இல்லாததால் அது சேர்க்கப்படவில்லை.
- source_word: לִפְנֵי
  choice: முன்பாக
  rationale: ஊர்வலத்தில் ஆசாரியர்கள் பெட்டிக்கு முன்னால் இருந்த இடநிலையை நேரடியாகக் குறிக்கிறது.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: தேவனுடைய பெட்டி
  rationale: எபிரெயக் கட்டமைப்பை நேரடியாகவும் இயல்பாகவும் தருகிறது; இவ்வசனத்தில் வெளிப்படையாக இல்லாத ‘உடன்படிக்கை’ என்ற சொல்லைச் சேர்க்கவில்லை.
- source_word: שֹׁעֲרִים
  choice: வாயிற்காவலர்கள்
  rationale: ஆலயம் அல்லது புனிதப் பொருள் சார்ந்த பொறுப்பில் நியமிக்கப்பட்ட வாயில்காப்பாளர்களைக் குறிக்கும் நிறுவனச் சார்புள்ள பொருளைப் பாதுகாக்கிறது.
- source_word: לָאָרוֹן
  choice: அந்தப் பெட்டிக்கான
  rationale: லாமேத் முன்னொட்டு இங்கு பெட்டி தொடர்பான பணி அல்லது பொறுப்பு ஒதுக்கப்பட்டிருந்ததைக் குறிக்கிறது.
- source_word: וְעֹבֵד אֱדֹם
  choice: ஓபேத்-ஏதோம்
  rationale: எபிரெயப் பெயரின் ஒலியமைப்பை நவீனத் தமிழில் தெளிவாக எழுத்துப்பெயர்க்கிறது.
- source_word: וִיחִיָּה
  choice: யெகியா
  rationale: எபிரெயப் பெயரான Yəḥiyyāh என்பதன் ஒலியைத் தமிழில் நெருக்கமாகக் காட்டுகிறது.
