translation_notes:
  register: நடை நவீன, மரியாதைமிக்க பொதுத்தமிழில் அமைக்கப்பட்டது. பெயர்கள் எபிரெய ஒலிக்கு நெருக்கமாக எழுத்துப்பெயர்க்கப்பட்டன. ‘உடன்படிக்கைப் பெட்டி’ என்ற பரிச்சயமான விரிவாக்கத்துக்குப் பதிலாக, மூலத்தில் உள்ள אֲרוֹן הָאֱלֹהִים என்பதைக் கருத்துச் சேர்க்கையின்றி ‘தேவனுடைய பெட்டி’ என மொழிபெயர்த்தோம். அனைத்து அடிக்குறிப்பு சுட்டிகளும் தொடர்புடைய சொற்றொடர்களுக்குப் பின்னர் வைக்கப்பட்டுள்ளன.
