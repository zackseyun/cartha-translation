  text: וַֽ/יְהִי֙ בֶּ/עְזֹ֣ר הָֽ/אֱלֹהִ֔ים אֶ֨ת הַ/לְוִיִּ֔ם נֹשְׂאֵ֖י אֲר֣וֹן בְּרִית יְהוָ֑ה וַ/יִּזְבְּח֥וּ שִׁבְעָֽה פָרִ֖ים וְ/שִׁבְעָ֥ה אֵילִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/026.yaml
  text: And when God helped the Levites who were carrying the ark of the covenant of Yahweh[a], they sacrificed seven bulls and seven rams.
translation:
  language: ta
  text: கடவுள் யாவேயின்[a] உடன்படிக்கைப் பெட்டியைச் சுமந்த லேவியர்களுக்கு உதவியபோது, அவர்கள் ஏழு காளைகளையும் ஏழு ஆட்டுக்கடாக்களையும் பலியிட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘யாவேயின் உடன்படிக்கைப் பெட்டி.’
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּעְזֹר
  choice: உதவியபோது
  rationale: ב prefixed infinitive construct, ויהי என்பதுடன் சேர்ந்து காலத்தைக் குறிக்கும் துணைவாக்கியமாக வருகிறது; நவீன தமிழில் ‘உதவியபோது’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: הָאֱלֹהִים
  choice: கடவுள்
  rationale: இங்கு இஸ்ரவேலின் கடவுளைக் குறிக்கிறது; தமிழில் இயல்பான தனிப்பெயர்சார் பயன்பாட்டிற்காக எபிரெயக் குறிப்புச் சுட்டின் வடிவம் தனியே மொழிபெயர்க்கப்படவில்லை.
- source_word: הַלְוִיִּם
  choice: லேவியர்கள்
  rationale: கோத்திர/குலப் பெயருக்கான வழக்கமான, தெளிவான தமிழாக்கம்.
- source_word: נֹשְׂאֵי
  choice: சுமந்த
  rationale: லேவியர்கள் அப்போது செய்துகொண்டிருந்த செயலைக் குறிக்கும் பங்கேற்புவினையின் தொடர்ச்சியான சூழலைச் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: யெகோவாவின் உடன்படிக்கைப் பெட்டி
  rationale: முழுக் கட்டமைப்பையும் இயல்பான தமிழில் உடைமைத் தொடர்புடன் வழங்குகிறது; ‘உடன்படிக்கைப் பெட்டி’ என்பது பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: இறைத் தனிப்பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் பரவலாக அறியப்பட்ட ஒலிபெயர்ப்பு வடிவில் வழங்குகிறது.
- source_word: וַיִּזְבְּחוּ
  choice: அவர்கள் ... பலியிட்டார்கள்
  rationale: זבח என்பதன் பலிச் சூழலையும் வினையின் மூன்றாம் நபர் ஆண்பால் பன்மையையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: שִׁבְעָה פָרִים
  choice: ஏழு காளைகள்
  rationale: பலிச் சூழலில் פָרִים என்பதற்கான நேரடியான, இயல்பான தமிழாக்கம்.
- source_word: וְשִׁבְעָה אֵילִים
  choice: ஏழு ஆட்டுக்கடாக்கள்
  rationale: אֵילִים என்பது ஆண் செம்மறியாடுகளைக் குறிக்கிறது; மீண்டும் வரும் எண்ணிக்கையும் பாதுகாக்கப்பட்டுள்ளது.
theological_decisions:
- issue: பலியிட்ட செயலின் எழுவாய்
  choice: அவர்கள் பலியிட்டார்கள்
  alternative: அவன் பலியிட்டான் / தாவீது பலியிட்டான்
  rationale: וַיִּזְבְּחוּ என்பது மூன்றாம் நபர் ஆண்பால் பன்மை வினை. ஆகவே எழுவாயை ஒருமையாகவோ தாவீது என்று குறிப்பிட்டோ மாற்றாமல், எபிரெய இலக்கணப் பன்மையைப் பாதுகாக்கிறது.
- issue: יהוה என்ற இறைத் தனிப்பெயரின் வழங்கல்
  choice: யெகோவா
  alternative: கர்த்தர்
  rationale: மூலத்தில் இருப்பது பட்டம் அல்ல, இறைத் தனிப்பெயர். எனவே பட்டத்தால் மாற்றாமல் ஒலிபெயர்க்கப்பட்டுள்ளது; மாற்று மரபுவழி வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டு நிகழ்வுக்கேற்ற கண்ணியமான ஆனால் பொதுவாசகர்களுக்குப் புரியும் நடை. எபிரெய வாக்கியத்தின் காலத் தொடர்பும் பன்மை எழுவாயும் பாதுகாக்கப்பட்டுள்ளன.
