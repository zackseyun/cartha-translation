base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/028.yaml
  text: And all Israel was bringing up the ark of the covenant of Yahweh with shouting[a], with the sound of a horn, with trumpets, and with cymbals[b], making music with harps and lyres.
translation:
  language: ta
  text: இஸ்ரவேலர் அனைவரும் ஆரவாரத்தோடும்[a], ஊதுகொம்பின் முழக்கத்தோடும்[b], எக்காளங்களோடும் கைத்தாளங்களோடும், சுரமண்டலங்களையும் யாழ்களையும் இசைத்துக்கொண்டு, யாவேயின் உடன்படிக்கைப் பெட்டியை மேலே கொண்டுவந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “முழக்கத்தோடு.” இங்கு வரும் எபிரெயச் சொல் கொண்டாட்டம் அல்லது வாழ்த்துதலின்போது எழுப்பப்படும் உரத்த கூக்குரலைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் “ஷோஃபார்”; இது பொதுவாக விலங்கின் கொம்பால் செய்யப்பட்ட ஊதுகருவி. அடுத்து குறிப்பிடப்படும் எக்காளங்களிலிருந்து இது வேறுபட்டது.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲלִים
  choice: மேலே கொண்டுவந்தார்கள்
  rationale: עלה என்பதன் ஹிஃபில் பன்மை வினையெச்சம் நடந்துகொண்டிருந்த ஊர்வலச் செயலைக் குறிக்கிறது. எருசலேமை நோக்கிப் பெட்டி மேலே கொண்டுவரப்பட்ட திசை உணர்வையும் ‘மேலே’ தக்கவைக்கிறது; தமிழில் பன்மைக் கூட்டுப் பொருளுக்கு இறந்தகால வினை இயல்பாக உள்ளது.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: யாவேயின் உடன்படிக்கைப் பெட்டி
  rationale: எபிரெயக் கட்டமைப்பின் உறவையும் ‘உடன்படிக்கை’ என்ற இறையியல் தனித்தன்மையையும் தெளிவாகத் தக்கவைக்கும் இயல்பான தமிழ் சொற்றொடர்.
- source_word: יְהוָה
  choice: யாவே
  rationale: தலைப்பாக மாற்றாமல், எபிரெய மூலத்திலுள்ள இறைத் திருப்பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: תְרוּעָה
  choice: ஆரவாரம்
  rationale: விழாக்காலத்தில் எழுப்பப்படும் உரத்த கூக்குரல் அல்லது வாழ்த்தொலியை இச்சூழலில் இயல்பாகக் குறிக்கிறது; சொல்லின் பரப்பை அடிக்குறிப்பு விளக்குகிறது.
- source_word: קוֹל שׁוֹפָר
  choice: ஊதுகொம்பின் முழக்கம்
  rationale: קוֹל என்பதன் ‘ஒலி’ கருத்தை ‘முழக்கம்’ வெளிப்படுத்துகிறது; שׁוֹפָר என்பதை அடுத்து வரும் நேரான எக்காளங்களிலிருந்து வேறுபடுத்த ‘ஊதுகொம்பு’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: חֲצֹצְרוֹת
  choice: எக்காளங்கள்
  rationale: שׁוֹפָר என்பதிலிருந்து வேறுபட்ட சடங்குப் பயன்பாட்டு ஊதுகருவிகளுக்கான தெளிவான தமிழ் இணைச்சொல்; மூலத்தில் சொல்லப்படாத ‘வெள்ளி’ சேர்க்கப்படவில்லை.
- source_word: מְצִלְתַּיִם
  choice: கைத்தாளங்கள்
  rationale: ஒன்றோடொன்று மோதிச் சத்தமிடும் உலோகத் தாளக் கருவியைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொல்.
- source_word: מַשְׁמִעִים
  choice: இசைத்துக்கொண்டு
  rationale: ஹிஃபில் வடிவின் ‘கேட்கும்படி ஒலிக்கச் செய்தல்’ என்ற கருத்தை இங்கு வரும் நரம்பிசைக் கருவிகளின் சூழலில் இயல்பாக வெளிப்படுத்துகிறது; ஒலியெழுப்புதல் கைத்தாளங்களுக்கு மட்டும் உரியது என்ற தவறான புரிதலைத் தவிர்க்கிறது.
- source_word: נְבָלִים
  choice: சுரமண்டலங்கள்
  rationale: பண்டைய நரம்பிசைக் கருவிக்கான துல்லியமான நவீன இணை இல்லை; כִנֹּרוֹת என்பதிலிருந்து வேறுபாட்டைத் தக்கவைக்க ‘சுரமண்டலங்கள்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: כִנֹּרוֹת
  choice: யாழ்கள்
  rationale: பண்டைய லயர் வகை நரம்பிசைக் கருவியை வாசகருக்குப் புரியும் வகையில் குறிக்கிறது; அருகிலுள்ள נְבָלִים என்பதற்குத் தனிச் சொல் பயன்படுத்தப்பட்டு இரண்டு கருவிகளும் வேறுபடுத்தப்பட்டுள்ளன.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல வசனம் இறைவனின் தனிப்பெயரான நான்கு எழுத்துப் பெயரை நேரடியாகப் பயன்படுத்துகிறது. அதனை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்ப்பது மூலத்தின் தன்மையைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் ஊர்வலத்தின் உற்சாகமும் தக்கவைக்கப்பட்டுள்ளன. ‘இஸ்ரவேலர் அனைவரும்’ என்பது கூட்டுப் பொருளை இயல்பான தமிழ் பன்மையாகக் காட்டுகிறது. கருவிப் பெயர்களின் பண்டைய வடிவங்களுக்கு துல்லியமான நவீன இணைகள் இல்லாததால், வாசிக்க எளிதாகவும் இரு நரம்பிசைக் கருவிகளின் வேறுபாடு நிலைக்கவும் ‘சுரமண்டலங்கள்’ மற்றும் ‘யாழ்கள்’ தேர்ந்தெடுக்கப்பட்டன. [b] குறி அது விளக்கும் ‘ஊதுகொம்பு’ என்பதற்குப் பின்னரே வைக்கப்பட்டுள்ளது.
