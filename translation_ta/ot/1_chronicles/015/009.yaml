id: 1CH.15.9
reference: 1 Chronicles 15:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: לִ/בְנֵ֖י חֶבְר֑וֹן אֱלִיאֵ֥ל הַ/שָּׂ֖ר וְ/אֶחָ֥י/ו שְׁמוֹנִֽים׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/009.yaml
  text: 'For the sons of Hebron: Eliel the chief[a], and eighty of his brothers.'
translation:
  language: ta
  text: 'எப்ரோன் குலத்தாரில்: தலைவரான எலியேலும், அவருடைய சகோதரர்கள் எண்பது பேரும்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சகோதரர்கள்’ என்பது ‘ஆண் குலத்தார்’ என்றும் பொருள்படலாம். எபிரேய மூலத்தில் நேரடியாக ‘அவருடைய சகோதரர்கள்’ என்று உள்ளது; இங்கு எலியேல் பிரதிநிதித்துவப்படுத்திய குலக் குழுவைச் சேர்ந்த ஆண் உறுப்பினர்கள் குறிக்கப்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי
  choice: மகன்களில்
  rationale: לְ முன்னொட்டு இப்பட்டியலில் ஒரு குலக் குழுவை அறிமுகப்படுத்துகிறது. இயல்பான தமிழுக்காக ‘மகன்களில்’ என வழங்கப்பட்டுள்ளது; ‘மகன்கள்’ என்ற எபிரெய உறவுமுறைச் சொல் தக்கவைக்கப்படுகிறது.
- source_word: חֶבְרוֹן
  choice: எப்ரோன்
  rationale: தனிநபர் அல்லது குலத்தின் பெயர் என்பதால் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: אֱלִיאֵל
  choice: எலியேல்
  rationale: தனிநபரின் பெயர் என்பதால் மொழிபெயர்க்காமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: הַשָּׂר
  choice: தலைவரான
  rationale: שַׂר என்பது தலைவர், அதிகாரி, முதன்மையானவர் ஆகிய பொருள்களைத் தரலாம். இக்குலப் பட்டியலின் சூழலில் அரச அல்லது இராணுவப் பொருளைத் தேவையின்றி புகுத்தாத ‘தலைவர்’ இயல்பானது.
- source_word: וְאֶחָיו
  choice: அவருடைய சகோதரர்கள்
  rationale: எபிரெயில் நேரடியாக ‘அவருடைய சகோதரர்கள்’ என்றுள்ளது. சூழலில் இது ஆண் குலத்தாரையோ உறவினர்களையோ குறிக்கக்கூடும்; அந்த விரிவான சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: שְׁמוֹנִים
  choice: எண்பது பேரும்
  rationale: எலியேலுடன் தொடர்புடைய ஆட்களின் எண்ணிக்கையைத் தரும் எண்ணுச் சொல்; மனிதர்களைக் குறிப்பிடுவதால் தமிழில் ‘பேர்’ சேர்க்கப்பட்டுள்ளது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், பட்டியல் நடையைச் சுருக்கமாகவும் கண்ணியமாகவும் வைத்துள்ளது. மூலத்தின் உறவுமுறைச் சொல்லும் அதன் சூழல்சார் பொருள் விரிவும் பாதுகாக்கப்பட்டுள்ளன.
