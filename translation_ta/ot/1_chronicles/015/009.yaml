revisions:
- from: 'எப்ரோனின் மகன்களில்: தலைவரான எலியேலும், அவருடைய சகோதரர்கள் எண்பது பேரும்.[a]'
  to: 'எப்ரோன் குலத்தாரில்: தலைவரான எலியேலும், அவருடைய சகோதரர்கள் எண்பது பேரும்.[a]'
  rationale: The revision replaces a potentially misleading literal kinship expression with a natural clan-list expression, while the footnote preserves the Hebrew’s literal wording and its contextual ambiguity. No theological interpretation has been added.
