  text: אָ֚ז אָמַ֣ר דָּוִ֔יד לֹ֤א לָ/שֵׂאת֙ אֶת אֲר֣וֹן הָֽ/אֱלֹהִ֔ים כִּ֖י אִם הַ/לְוִיִּ֑ם כִּי בָ֣/ם בָּחַ֣ר יְהוָ֗ה לָ/שֵׂ֞את אֶת אֲר֧וֹן יְהוָ֛ה וּֽ/לְ/שָׁרְת֖/וֹ עַד עוֹלָֽם־־־׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/002.yaml
  text: Then David said[a], “No one is to carry the ark of God except the Levites[b], for Yahweh has chosen them to carry the ark of Yahweh and to minister to him forever.”
translation:
  language: ta
  text: 'அப்போது தாவீது சொன்னார்: “லேவியர்களைத் தவிர வேறு யாரும் கடவுளின் பேழையைச் சுமக்கக் கூடாது[a]. ஏனெனில், யாவே தமது பேழையைச் சுமப்பதற்கும், என்றென்றும் அவருக்குப் புனிதப் பணி செய்வதற்கும் அவர்களையே தேர்ந்தெடுத்திருக்கிறார்[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில் இந்தத் தடை வாக்கியம் சுருக்கமாக உள்ளது; ‘யாரும்’ என்ற எழுவாய் வெளிப்படையாகக் கூறப்படவில்லை.
    reason: lexical_alternative
  - marker: b
    text: “அவருக்குப் புனிதப் பணி செய்வதற்கு” என்பதை “அவருக்குச் சேவை செய்வதற்கு” என்றும் மொழிபெயர்க்கலாம். இங்குள்ள சுட்டுப்பெயர் பொதுவாக யாவேயைக் குறிக்கிறது; சூழலைக் கொண்டு, பேழையின் முன்னிலையில் பணி செய்வதைக் குறிப்பதாகவும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: அப்போது
  rationale: முந்தைய நிகழ்வுகளைத் தொடர்ந்து தாவீதின் கூற்றை அறிமுகப்படுத்தும் இயல்பான காலச் சுட்டியாக உள்ளது.
- source_word: אָמַר דָּוִיד
  choice: தாவீது சொன்னார்
  rationale: எபிரேய உரையின் பொதுவான கதைசொல்லல் வினையை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: לֹא לָשֵׂאת אֶת אֲרוֹן הָאֱלֹהִים כִּי אִם הַלְוִיִּם
  choice: லேவியர்களைத் தவிர வேறு யாரும் கடவுளின் உடன்படிக்கைப் பெட்டியைச் சுமக்கக் கூடாது
  rationale: எபிரேய வாக்கியம் எழுவாய் வெளிப்படையாக இல்லாத சுருக்கமான அமைப்பில் உள்ளது; தமிழில் அதன் தடைப் பொருளை இயல்பாக வெளிப்படுத்த எழுவாய் நிரப்பப்பட்டுள்ளது.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: கடவுளின் உடன்படிக்கைப் பெட்டி
  rationale: இந்த வழிபாட்டுச் சூழலில் אָרוֹן என்பது உடன்படிக்கையோடு தொடர்புடைய புனிதப் பெட்டியைக் குறிக்கிறது; ‘உடன்படிக்கைப் பெட்டி’ என்பது சாதாரண வாசகருக்குத் தெளிவாகவும் வேதாகமப் பயன்பாட்டுக்கு ஏற்றதாகவும் உள்ளது.
- source_word: הַלְוִיִּם
  choice: லேவியர்கள்
  rationale: இஸ்ரவேலின் இந்தக் குலத்தாருக்கான நிலைபெற்ற தமிழ் வடிவம்.
- source_word: כִּי בָם בָּחַר יְהוָה
  choice: ஏனெனில், யாவே ... அவர்களையே தேர்ந்தெடுத்திருக்கிறார்
  rationale: כִּי காரணத்தை அறிமுகப்படுத்துகிறது; בָם என்பதிலுள்ள வலியுறுத்தலை ‘அவர்களையே’ வெளிப்படுத்துகிறது; முடிவின் தொடரும் பொருத்தத்தை நிறைவுக்கால வடிவம் காட்டுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: לָשֵׂאת
  choice: சுமப்பதற்கு
  rationale: இந்தச் சூழலில் נשׂא என்பது பெட்டியை உடலால் தூக்கிச் செல்வதைக் குறிக்கிறது; ‘சுமத்தல்’ தெளிவான நவீனத் தமிழ்.
- source_word: אֲרוֹן יְהוָה
  choice: தமது உடன்படிக்கைப் பெட்டி
  rationale: யாவே என்பவரோடு உள்ள உடைமை உறவை இயல்பான தமிழில் தருகிறது; ஒரே வாக்கியத்தில் பெயரைத் தேவையின்றி மீண்டும் கூறுவதைத் தவிர்த்தாலும் மூலப் பொருளைத் தக்கவைக்கிறது.
- source_word: וּלְשָׁרְתוֹ
  choice: தமக்குப் பணிவிடை செய்வதற்கு
  rationale: שרת என்பது லேவியரின் புனித அல்லது வழிபாட்டுச் சேவையைச் சுட்டுகிறது; ‘பணிவிடை செய்தல்’ அதன் சிறப்பு நுண்பொருளைத் தக்கவைக்கிறது.
- source_word: עַד עוֹלָם
  choice: என்றென்றும்
  rationale: நீடித்த நியமனத்தை இயல்பாகவும் கண்ணியமாகவும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: וּלְשָׁרְתוֹ என்பதிலுள்ள ஆண்பால் ஒருமைச் சுட்டுப்பெயரின் குறிப்பு
  choice: ‘தமக்குப் பணிவிடை செய்வதற்கு’ என்று யாவேயைக் குறிப்பதாக மொழிபெயர்க்கப்பட்டது.
  alternative: உடன்படிக்கைப் பெட்டியுடன் தொடர்புபடுத்தி, ‘அதற்கு முன்பாகப் பணிவிடை செய்வதற்கு’ என்று புரிந்துகொள்ளலாம்.
  rationale: யாவே என்பது அருகிலுள்ள தனிப்பட்ட முன்னிலையாக உள்ளது; லேவியரின் பணி வேறு இடங்களிலும் யாவேக்குச் செய்யும் புனிதப் பணியாக விவரிக்கப்படுகிறது. எனினும், பெட்டியுடன் தொடர்புபடுத்தும் சூழல்சார் வாசிப்பும் குறிப்பிடத்தக்க மாற்றாகும்.
- issue: אֲרוֹן என்பதன் மொழிபெயர்ப்பில் ‘உடன்படிக்கை’ என்ற விளக்கச்சொல்
  choice: ‘உடன்படிக்கைப் பெட்டி’
  alternative: ‘பெட்டி’ அல்லது ‘கடவுளின் பெட்டி’
  rationale: மூலச் சொல்லில் இவ்விடத்தில் ‘உடன்படிக்கை’ வெளிப்படையாக இல்லாவிட்டாலும், குறிக்கப்படும் குறிப்பிட்ட புனிதப் பொருளை நவீனத் தமிழ் வாசகருக்குத் தெளிவுபடுத்தும் நிலைபெற்ற பெயராக இது பயன்படுத்தப்பட்டுள்ளது; உரிமைத் தொடர்கள் தொடர்ந்து பாதுகாக்கப்பட்டுள்ளன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான வேதாகம நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. தெய்வீகப் பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது. எபிரேய மொழியின் சுருக்கமான முதற் கூற்றிலுள்ள மறை எழுவாய் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது; புனிதச் சேவையின் நுண்பொருளுக்காக ‘பணிவிடை’ பயன்படுத்தப்பட்டுள்ளது.
