source:
  edition: WLC
  text: וַ/יְהִ֥י דָוִ֛יד וְ/זִקְנֵ֥י יִשְׂרָאֵ֖ל וְ/שָׂרֵ֣י הָ/אֲלָפִ֑ים הַ/הֹֽלְכִ֗ים לְֽ/הַעֲל֞וֹת אֶת אֲר֧וֹן בְּרִית יְהוָ֛ה מִן בֵּ֥ית עֹבֵֽד אֱדֹ֖ם בְּ/שִׂמְחָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/025.yaml
  text: So David, and the elders of Israel, and the commanders of the thousands went to bring up the ark of the covenant of Yahweh from the house of Obed-edom with joy.
translation:
  language: ta
  text: தாவீதும், இஸ்ரவேலின் மூப்பர்களும், ஆயிரம்பேர் கொண்ட பிரிவுகளின் தலைவர்களும், யாவேவின் உடன்படிக்கைப் பெட்டியை ஓபேத்-ஏதோமின் வீட்டிலிருந்து மகிழ்ச்சியோடு மேலே கொண்டுவரச் சென்றார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי ... הַהֹלְכִים
  choice: சென்றார்கள்
  rationale: וַיְהִי இங்கு கதைநடையைத் தொடரும் அறிமுகமாகவும், הַהֹלְכִים குழுவின் செயலைக் குறிக்கும் வினையெச்சமாகவும் உள்ளன. இயல்பான நவீனத் தமிழில் இரண்டின் உரையாடல் பங்கையும் இறுதி வினையான ‘சென்றார்கள்’ தாங்குகிறது.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மூப்பர்கள்
  rationale: அங்கீகரிக்கப்பட்ட சமூகத் தலைவர்களைக் குறிக்கும் எபிரெயச் சொல்லுக்கு துல்லியமானதும் தமிழில் வழக்கமானதுமான மொழிபெயர்ப்பு.
- source_word: שָׂרֵי הָאֲלָפִים
  choice: ஆயிரம்பேர்ப் பிரிவுகளின் தலைவர்கள்
  rationale: שָׂרֵי என்பது தலைவர்கள் அல்லது அதிகாரிகள்; אֲלָפִים என்பது இங்கு ஆயிரம் பேர் கொண்ட இராணுவ அல்லது நிர்வாகப் பிரிவுகளைக் குறிக்கலாம். எண்ணிக்கையையும் அமைப்பையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: לְהַעֲלוֹת
  choice: கொண்டுவர
  rationale: அடிப்படையில் ‘மேலே கொண்டுவர’ என்ற பொருள் இருந்தாலும், இச்சூழலில் பெட்டியை அதன் இலக்குக்குக் கொண்டுவரும் செயலைக் குறிக்கிறது. தமிழில் தேவையற்ற திசைச் சுமையின்றி இயல்பாகக் கூறப்பட்டுள்ளது.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: யெகோவாவின் உடன்படிக்கைப் பெட்டி
  rationale: எபிரெயக் கட்டமைப்பின் உறவைக் காத்து, உடன்படிக்கையோடு தொடர்புடைய புனிதப் பெட்டியை இயல்பான தமிழ்ச் சொற்றொடரில் தருகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: திருப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் நீண்டகாலமாக அறியப்பட்ட நேரடி பெயர்வடிவமான ‘யெகோவா’ என்று வழங்குகிறது.
- source_word: מִן בֵּית עֹבֵד אֱדֹם
  choice: ஓபேத்-ஏதோமின் வீட்டிலிருந்து
  rationale: மூலத்தின் இடவுறவையும் நபரின் பெயரையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: בְּשִׂמְחָה
  choice: மகிழ்ச்சியுடன்
  rationale: செயல் நடைபெற்ற கொண்டாட்ட மனநிலையைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: யாவே
  rationale: மூலத்தில் ஒரு பொதுப் பட்டப்பெயர் அல்ல, நான்கு எழுத்துகளைக் கொண்ட தனிப்பட்ட இறைப்பெயர் உள்ளது. அதன் சரியான பண்டைய உச்சரிப்பு உறுதியாகத் தெரியாததால், தமிழில் பரவலாக அறியப்பட்ட பெயர்வடிவம் பிரதான உரையில் பயன்படுத்தப்படுகிறது; மாற்று ஒலிபெயர்ப்பைத் திணிக்கவில்லை.
- issue: לְהַעֲלוֹת என்பதிலுள்ள ‘மேலே’ என்ற திசைநயம்
  choice: கொண்டுவர
  alternative: மேலே கொண்டுவர
  rationale: வினைச்சொல்லில் மேல்நோக்கிய இயக்கம் உள்ளபோதிலும், தமிழில் ‘மேலே’ என்பது உடல் உயரத்தைத் தேவையற்ற வகையில் முன்னிறுத்தக்கூடும். சூழலின் முக்கிய கருத்தான உடன்படிக்கைப் பெட்டியை மாற்றிக் கொண்டுவருதல் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; கண்ணியமான கதைநடை. ‘ஆயிரம்பேர்ப் பிரிவுகள்’ என்பது மூலத்தின் எண்ணியல்-நிர்வாக அமைப்பை சாதாரண வாசகருக்குத் தெளிவுபடுத்துகிறது. பெயர்கள் தமிழ் வேதாகமப் பயன்பாட்டுக்கு ஏற்ற ஒலிவடிவில் தரப்பட்டுள்ளன.
