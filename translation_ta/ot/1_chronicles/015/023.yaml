  yaml_path: translation/ot/1_chronicles/015/023.yaml
  text: Berechiah and Elkanah were gatekeepers for the ark[a].
translation:
  language: ta
  text: பெரெக்கியாவும் எல்க்கானாவும் பெட்டகத்திற்கான வாயிற்காவலர்களாக இருந்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பெட்டகத்தருகே வாயிற்காவலர்களாக இருந்தார்கள்.” எபிரெய முன்னிடைச்சொல், பெட்டகம் தொடர்பான பணி நியமனத்தையோ பெட்டகத்தின் அருகிலுள்ள இடத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּרֶכְיָה
  choice: பெரெகியா
  rationale: எபிரெயத் தனிப்பெயரின் ஒலியை நவீனத் தமிழில் இயல்பாக எழுத்துப்பெயர்த்த வடிவம்.
- source_word: אֶלְקָנָה
  choice: எல்க்கானா
  rationale: எபிரெயத் தனிப்பெயரை அதன் மெய்யொலிப்பு வேறுபாட்டைக் காக்கும் வகையில் தமிழில் எழுத்துப்பெயர்த்தது.
- source_word: שֹׁעֲרִים
  choice: வாயிற்காவலர்கள்
  rationale: வாயில் அல்லது நுழைவிடத்தைக் காத்துப் பொறுப்பேற்றவர்களைக் குறிக்கும் சொல்லைத் துல்லியமாகவும் இயல்பாகவும் தெரிவிக்கிறது; பொதுவான ‘காவலர்கள்’ என்பது அதன் குறிப்பிட்ட பணியை மறைத்துவிடும்.
- source_word: לָאָרוֹן
  choice: பெட்டகத்திற்கான
  rationale: לְ முன்னிடைச்சொல் இங்கு பெட்டகம் தொடர்பான பணி நியமனத்தையோ, பெட்டகத்தின் அருகிலுள்ள பணியிடத்தையோ குறிக்கலாம். முதன்மை உரையில் பொறுப்பு/நியமனப் பொருளை இயல்பான தமிழில் தருகிறது; இடப்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וְ
  choice: -வும் … -வும்
  rationale: இரு நபர்களையும் இணைக்கும் எபிரெய இணைப்பைத் தமிழுக்குரிய இயல்பான இணைப்பு அமைப்பில் வழங்குகிறது.
theological_decisions:
- issue: לָאָרוֹן என்பதன் உறவு அல்லது இடப்பொருள்
  choice: பெட்டகத்திற்கான
  alternative: பெட்டகத்தருகே
  rationale: எபிரெய לְ பணி நியமனத்தையும் இடத்தையும் குறிக்கக்கூடும். முதன்மை உரை அவர்களுடைய பொறுப்பை முன்னிறுத்துகிறது; உண்மையான மாற்றுப் பொருள் அடிக்குறிப்பில் வெளிப்படையாக வைக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. எபிரெயத்தில் வெளிப்படையாக இல்லாத இணைப்புவினை, இயல்பான தமிழ் வாக்கியத்திற்காக ‘இருந்தார்கள்’ என வழங்கப்பட்டுள்ளது. ‘பெட்டகம்’ என்பது אָרוֹן என்பதற்கான தெளிவான பொதுச்சொல்லாகத் தேர்ந்தெடுக்கப்பட்டது; மூலத்தில் இல்லாத ‘உடன்படிக்கை’ போன்ற விளக்கச் சொல் சேர்க்கப்படவில்லை.
