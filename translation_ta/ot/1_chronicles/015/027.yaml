  text: וְ/דָוִ֞יד מְכֻרְבָּ֣ל בִּ/מְעִ֣יל בּ֗וּץ וְ/כָל הַ/לְוִיִּם֙ הַ/נֹּשְׂאִ֣ים אֶת הָ/אָר֔וֹן וְ/הַ/מְשֹׁ֣רְרִ֔ים וּ/כְנַנְיָ֛ה הַ/שַּׂ֥ר הַ/מַּשָּׂ֖א הַ/מְשֹֽׁרְרִ֑ים וְ/עַל דָּוִ֖יד אֵפ֥וֹד בָּֽד׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/027.yaml
  text: David was clothed with a robe of fine linen[a], as were all the Levites who were carrying the ark, and the singers, and Chenaniah, the leader of the singing of the singers; and on David was a linen ephod.
translation:
  language: ta
  text: தாவீது மெல்லிய நார்ப்பட்டினாலான மேலங்கியை அணிந்திருந்தார். பேழையைச் சுமந்துகொண்டிருந்த லேவியர்கள் அனைவரும், பாடகர்களும், சுமத்தலுக்குத் தலைவனான கெனனியாவும் அவ்வாறே அணிந்திருந்தார்கள்.[a] தாவீது நார்ப்பட்டு ஏபோத்தையும் அணிந்திருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சுமத்தலுக்குத் தலைவன்” என்று மொழிபெயர்க்கப்பட்ட எபிரெயத் தொடர் கடினமானது. இதை “பாடலுக்குத் தலைவன்” அல்லது “இசைக்குத் தலைவன்” என்றும் பொருள் கொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: מְכֻרְבָּל
  choice: அணிந்திருந்தார்
  rationale: ஆடை உடுத்தப்பட்ட நிலையில் இருப்பதைக் குறிக்கும் செயப்பாட்டு வடிவத்தை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: מְעִיל בּוּץ
  choice: மெல்லிய நார்ப்பட்டினாலான மேலங்கி
  rationale: מְעִיל என்பதன் தனித்த வெளிப்புற ஆடையையும், בּוּץ என்பதன் உயர்தர மெல்லிய நார்ப்பட்டுப் பொருளையும் தெளிவாகக் காக்கிறது.
- source_word: הַלְוִיִּם הַנֹּשְׂאִים אֶת הָאָרוֹן
  choice: பெட்டியைச் சுமந்த லேவியர்கள்
  rationale: ஊர்வலத்தில் பெட்டியைச் சுமந்துகொண்டிருந்த குழுவை இயல்பான தமிழில் குறிப்பிடுகிறது; הָאָרוֹן என்பதற்கு சூழலில் புரியும் ‘பெட்டி’ பயன்படுத்தப்படுகிறது.
- source_word: הַמְשֹׁרְרִים
  choice: பாடகர்கள்
  rationale: மூல வேர்ச்சொல் குறிப்பாகப் பாடுவோரைக் குறிக்கிறது; பொதுவான ‘இசைக்கலைஞர்கள்’ என்பதைவிடத் துல்லியமானது.
- source_word: כְנַנְיָה
  choice: கெனனியா
  rationale: எபிரெய மெய்யொலிகளுக்கு அண்மையான, தமிழில் வாசிக்க ஏற்ற பெயர்ப்பு.
- source_word: הַשַּׂר הַמַּשָּׂא הַמְשֹׁרְרִים
  choice: பாடகர்களின் சுமத்தலுக்குத் தலைவனான
  rationale: சிக்கலான மசோரா தொடரில் உள்ள ‘தலைவன்’, ‘சுமத்தல்/சுமை’, ‘பாடகர்கள்’ ஆகிய கூறுகளைத் தீர்மானமாக மாற்றாமல் பிரதான உரையில் காக்கிறது; மாற்றுப் புரிதல்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: אֵפוֹד בָּד
  choice: நார்ப்பட்டு ஏபோத்து
  rationale: குறிப்பிட்ட வழிபாட்டு ஆடையான ‘ஏபோத்து’ என்பதை விளக்கவுரையாக்காமல் வைத்தும், அதன் நார்ப்பட்டுப் பொருளைக் குறிப்பிட்டும் உள்ளது.
- source_word: וְעַל דָּוִיד
  choice: தாவீது ... அணிந்திருந்தார்
  rationale: சொல்லுக்கு சொல் ‘தாவீதின்மேல் இருந்தது’ என்பதற்குப் பதிலாக இயல்பான தமிழைப் பயன்படுத்துகிறது; அதேவேளை மேலங்கியோடு கூடுதலாக ஏபோத்தும் இருந்த வேறுபாட்டைக் காக்கிறது.
theological_decisions:
- issue: வழிபாட்டுச் சூழலில் தாவீதின் ஆடை
  choice: ‘ஏபோத்து’ என்ற குறிப்பிட்ட ஆடைப்பெயரை அப்படியே வைத்து, தாவீது ஆசாரியப் பதவியில் செயல்பட்டார் என்று கூறாமல் இருப்பது
  alternative: ‘ஆசாரிய உடை’ என்று விளக்குவது அல்லது தாவீது ஆசாரியராகச் செயல்பட்டார் என்று ஊகிப்பது
  rationale: வசனம் தாவீது அணிந்த ஆடையை மட்டுமே கூறுகிறது; அவருக்கு ஆசாரியப் பதவி இருந்ததாக வெளிப்படையாகக் கூறவில்லை.
- issue: הַשַּׂר הַמַּשָּׂא הַמְשֹׁרְרִים என்ற தொடரின் இலக்கணச் சிக்கல்
  choice: மூலச் சொற்கூறுகளைப் பிரதான உரையில் ‘பாடகர்களின் சுமத்தலுக்குத் தலைவன்’ என்று பாதுகாத்து, பிற சாத்தியங்களை அடிக்குறிப்பில் அளிப்பது
  alternative: ‘பாடலுக்குத் தலைவன்’, ‘இசைக்குத் தலைவன்’ அல்லது ‘பாடகர்களின் சுமையை/சுமத்தலை மேற்பார்வையிட்டவன்’
  rationale: மசோரா வாசகம் கடினமானதும் பலவாறு இணைத்துப் புரிந்துகொள்ளக்கூடியதும் ஆகும்; ஒரே பொருளை அமைதியாகத் தீர்மானிப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘நார்ப்பட்டு’ என்பது இங்கு ஆடம்பரமான பட்டு நாரைக் குறிக்காமல், மெல்லிய லினன் வகைப் பொருளைக் குறிக்கிறது. கடினமான எபிரெயத் தொடரின் அசௌகரியம் முற்றிலும் மறைக்கப்படாமல் அடிக்குறிப்பால் வெளிப்படுத்தப்பட்டுள்ளது.
