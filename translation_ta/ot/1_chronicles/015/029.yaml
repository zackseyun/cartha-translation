source:
  edition: WLC
  text: וַ/יְהִ֗י אֲרוֹן֙ בְּרִ֣ית יְהוָ֔ה בָּ֖א עַד עִ֣יר דָּוִ֑יד וּ/מִיכַ֨ל בַּת שָׁא֜וּל נִשְׁקְפָ֣ה בְּעַ֣ד הַ/חַלּ֗וֹן וַ/תֵּ֨רֶא אֶת הַ/מֶּ֤לֶךְ דָּוִיד֙ מְרַקֵּ֣ד וּ/מְשַׂחֵ֔ק וַ/תִּ֥בֶז ל֖/וֹ בְּ/לִבָּֽ/הּ־־׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/029.yaml
  text: And as the ark of the covenant of Yahweh came to the city of David[a], Michal the daughter of Saul looked out through the window and saw King David dancing and playing, and she despised him in her heart.
translation:
  language: ta
  text: யாவேயின் உடன்படிக்கைப் பெட்டி தாவீதின் நகரத்துக்கு வந்தபோது, சவுலின் மகளான மீகாள் சன்னல் வழியாக வெளியே பார்த்து, அரசனாகிய தாவீது நடனமாடி விளையாடுவதைக் கண்டாள்.[a] அவள் தன் உள்ளத்தில் அவரை இகழ்ந்தாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «விளையாடுவதை» என்பதற்கு «மகிழ்ந்து கொண்டாடுவதை» அல்லது «களித்திருப்பதை» என்றும் மொழிபெயர்க்கலாம்.
    reason: וּמְשַׂחֵק என்பது விளையாட்டுத்தனமான செயல், மகிழ்ச்சி, அல்லது விழாக்காலக் களிப்பு ஆகிய பொருள் வரம்புகளைக் கொள்ளலாம்.
lexical_decisions:
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: யெகோவாவின் உடன்படிக்கைப் பெட்டி
  rationale: எபிரெயக் கட்டமைப்பை இயல்பான தமிழில் உடைமைத் தொடர்பாக வழங்குகிறது; אֲרוֹן என்பதற்கு வேதாகமச் சூழலில் புரியக்கூடிய ‘பெட்டி’ பயன்படுத்தப்பட்டது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தலைப்பால் மாற்றாமல், நான்கெழுத்துத் தெய்வீகப் பெயரைத் தமிழில் பரவலாக அறியப்படும் பெயரொலிப்பாகப் பாதுகாக்கிறது.
- source_word: בָּא עַד עִיר דָּוִיד
  choice: தாவீதின் நகரத்துக்கு வந்தபோது
  rationale: בוא עם עַד குறிக்கும் இலக்கை அடைதலை இயல்பான காலத் துணைவாக்கியமாக வழங்குகிறது; ‘நகருக்குள் நுழைந்தது’ என்று மிகைப்படுத்தவில்லை.
- source_word: מִיכַל בַּת שָׁאוּל
  choice: சவுலின் மகள் மீகாள்
  rationale: சவுலுடனான அவளுடைய அடையாளத்தைப் பாதுகாத்து, தமிழின் இயல்பான சொல்வரிசையைப் பின்பற்றுகிறது.
- source_word: נִשְׁקְפָה בְּעַד הַחַלּוֹן
  choice: சன்னல் வழியாகப் பார்த்தாள்
  rationale: சன்னல் வழியே வெளியே அல்லது கீழே நோக்கிப் பார்ப்பதைக் குறிக்கும் வினையை, மூலத்தில் தீர்மானிக்கப்படாத திசையைச் சேர்க்காமல் வழங்குகிறது.
- source_word: הַמֶּלֶךְ דָּוִיד
  choice: தாவீது அரசர்
  rationale: பெயரும் பட்டமும் தமிழில் இயல்பாக இணைக்கப்பட்டுள்ளன.
- source_word: מְרַקֵּד
  choice: நடனமாடி
  rationale: உற்சாகமான ஆட்ட அசைவைக் குறிக்கும் வினையின் நேரடியான, இயல்பான தமிழ் இணை.
- source_word: וּמְשַׂחֵק
  choice: கொண்டாடுவதை
  rationale: விளையாடுதல், களித்தல், மகிழ்ந்து கொண்டாடுதல் ஆகிய பொருள் வரம்புகளில், ஊர்வலச் சூழலுக்கு ‘கொண்டாடுதல்’ இயல்பாகப் பொருந்துகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וַתִּבֶז לוֹ בְּלִבָּהּ
  choice: அவள் தன் உள்ளத்தில் அவரை இகழ்ந்தாள்
  rationale: அவமதிப்பின் தீவிரத்தையும் அது வெளிப்படாமல் உள்ளத்தில் நிகழ்ந்ததையும் நேரடியாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே
  rationale: மூலத்தில் வரும் தனிப்பட்ட தெய்வீகப் பெயரை ‘கர்த்தர்’ போன்ற பட்டத்தால் மாற்றாமல் பெயராகவே வழங்குகிறது. எபிரெய உயிரொலிப்பு முழுமையாக உறுதியற்றதால் ‘யாவே’ என்பதும் சாத்தியமான பெயரொலிப்பு.
translation_notes:
  register: நவீன செந்தமிழ் நடையில், பொதுவாசகர்களுக்குப் புரியும் வகையில் எழுதப்பட்டது. ‘சன்னல்’, ‘உள்ளத்தில்’, ‘இகழ்ந்தாள்’ ஆகியவை கண்ணியமானதும் இயல்பானதும் ஆகும்; மூலத்தின் நிகழ்வுவரிசை மற்றும் மீகாளின் உள்ளார்ந்த அவமதிப்பு பாதுகாக்கப்பட்டுள்ளன.
