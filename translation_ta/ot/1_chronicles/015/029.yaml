- from: யெகோவாவின் உடன்படிக்கைப் பெட்டி தாவீதின் நகரத்துக்கு வந்தபோது, சவுலின் மகள் மீகாள் சன்னல் வழியாகப் பார்த்தாள். தாவீது அரசர் நடனமாடிக் கொண்டாடுவதைக் கண்டு, அவள் தன் உள்ளத்தில் அவரை இகழ்ந்தாள்.[a]
  to: யாவேயின் உடன்படிக்கைப் பெட்டி தாவீதின் நகரத்துக்கு வந்தபோது, சவுலின் மகளான மீகாள் சன்னல் வழியாக வெளியே பார்த்து, அரசனாகிய தாவீது நடனமாடி விளையாடுவதைக் கண்டாள்.[a] அவள் தன் உள்ளத்தில் அவரை இகழ்ந்தாள்.
  rationale: யְהוָה-வின் பெயரொலிப்பை ஆங்கில POB audit trail-உடன் ஒத்த «யாவே» எனத் திருத்தினேன். மீகாள் சன்னல் வழியாகப் பார்த்ததும் தாவீதைக் கண்டதும் ஒரே வாக்கியத்தில் தெளிவாக இணைக்கப்பட்டது. מְשַׂחֵק-இன் நேரடி களிப்பான/விளையாட்டான சாயலை «விளையாடி» என முதன்மை உரையில் வைத்துக் கொண்டு, விழாக்கால மாற்றுப் பொருளை அடிக்குறிப்பில் பாதுகாத்தேன்.
