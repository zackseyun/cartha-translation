base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/011.yaml
  text: 'Then David called for Zadok and Abiathar the priests, and for the Levites: Uriel, Asaiah, Joel, Shemaiah, Eliel, and Amminadab.'
translation:
  language: ta
  text: அப்போது தாவீது ஆசாரியர்களான சாதோக்கையும் அபியத்தாரையும், லேவியர்களான ஊரியேல், அசாயா, யோவேல், செமாயா, எலியேல், அம்மினாதாப் ஆகியோரையும் அழைத்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: அழைத்தார்
  rationale: இச்சூழலில் குறிப்பிட்ட நபர்களைத் தம்மிடம் வருமாறு அழைப்பதைக் குறிக்கிறது; தமிழில் இயல்பாகவும் எபிரெய வினையின் பொருளுக்கு நெருக்கமாகவும் உள்ளது.
- source_word: לְצָדוֹק וּלְאֶבְיָתָר הַכֹּהֲנִים
  choice: ஆசாரியர்களான சாதோக்கையும் அபியத்தாரையும்
  rationale: הַכֹּהֲנִים என்பது சாதோக்கும் அபியத்தாரும் வகிக்கும் ஆசாரியப் பணியை அடையாளப்படுத்துகிறது; தமிழ் வாக்கியத்தில் ‘ஆசாரியர்களான’ என்பது அந்த உறவைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: וְלַלְוִיִּם
  choice: லேவியர்களான
  rationale: அடுத்து வரும் ஆறு பெயர்களும் அழைக்கப்பட்ட லேவியர்களை அடையாளப்படுத்துகின்றன; தமிழ் தொடரமைப்பில் இதை இயல்பாக இணைக்கிறது.
- source_word: דָוִיד
  choice: தாவீது
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் பெயர்வடிவம்.
- source_word: לְאוּרִיאֵל עֲשָׂיָה וְיוֹאֵל שְׁמַעְיָה וֶאֱלִיאֵל וְעַמִּינָדָב
  choice: ஊரியேல், அசாயா, யோவேல், செமாயா, எலியேல், அம்மினதாப்
  rationale: எபிரெய தனிப்பெயர்களை நவீன தமிழில் வாசிக்க ஏற்ற ஒலிபெயர்ப்பு வடிவங்களில் வழங்குகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் எளிய வாசிப்புத்தன்மையும் கொண்ட நடை. எபிரெயத்தில் மீண்டும் வரும் לְ முன்னிடைச்சொற்களைத் தமிழில் வேற்றுமை உருபுகளால் இயல்பாக வெளிப்படுத்தி, ஆசாரியர் மற்றும் லேவியர் என்ற இரு குழுக்களின் அடையாளத்தையும் காத்துள்ளது.
