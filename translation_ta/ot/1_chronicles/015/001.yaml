id: 1CH.15.1
reference: 1 Chronicles 15:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יַּֽעַשׂ ל֥/וֹ בָתִּ֖ים בְּ/עִ֣יר דָּוִ֑יד וַ/יָּ֤כֶן מָקוֹם֙ לַֽ/אֲר֣וֹן הָֽ/אֱלֹהִ֔ים וַ/יֶּט ל֖/וֹ אֹֽהֶל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/001.yaml
  text: And he made houses for himself in the city of David[a], and he prepared a place for the ark of God and pitched a tent for it.
translation:
  language: ta
  text: தாவீதின் நகரத்தில் தனக்காக வீடுகளைக் கட்டினான். கடவுளின் உடன்படிக்கைப் பெட்டிக்காக ஓர் இடத்தை ஆயத்தப்படுத்தி, அதற்காக ஒரு கூடாரத்தையும் அமைத்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தனக்காக ஒரு கூடாரத்தையும் அமைத்தான்.” எபிரெயப் பின்னொட்டு உடன்படிக்கைப் பெட்டியையோ தாவீதையோ குறிக்கக்கூடும்; உடனடிச் சூழல் உடன்படிக்கைப் பெட்டியைக் குறிப்பதற்கே அதிக ஆதரவளிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ ... בָתִּים
  choice: வீடுகளைக் கட்டினான்
  rationale: עָשָׂה என்பதன் அடிப்படைப் பொருள் ‘செய்/உருவாக்கு’ என்றாலும், வீடுகளைப் பற்றிய சூழலில் இயல்பான நவீனத் தமிழில் ‘கட்டினான்’ பொருத்தமானது; בָתִּים என்பதன் பன்மையையும் இது காக்கிறது.
- source_word: בְּעִיר דָּוִיד
  choice: தாவீது நகரத்தில்
  rationale: எபிரெய இடப்பொருள் தொடரை இயல்பான தமிழில் தருகிறது; ‘தாவீது நகரம்’ என்ற பெயர்ச்சொல் தன்மையையும் காக்கிறது.
- source_word: וַיָּכֶן מָקוֹם
  choice: ஓர் இடத்தை ஆயத்தப்படுத்தி
  rationale: Hiphil வடிவிலுள்ள כון இங்கு ‘தயார் செய்/ஆயத்தப்படுத்து’ என்று பொருள்படும்; מָקוֹם என்பது பொதுவாக ‘இடம்’.
- source_word: לַאֲרוֹן הָאֱלֹהִים
  choice: கடவுளின் உடன்படிக்கைப் பெட்டிக்காக
  rationale: אֲרוֹן என்பதன் நேரடிப் பொருள் ‘பெட்டி’; இச்சூழலில் அது பரிசுத்த உடன்படிக்கைப் பெட்டியைக் குறிக்கிறது. தமிழில் தனித்து ‘பெட்டி’ என்பது தெளிவற்றிருப்பதால், சூழலை வெளிப்படுத்தும் வழக்கமான ‘உடன்படிக்கைப் பெட்டி’ பயன்படுத்தப்பட்டது.
- source_word: וַיֶּט ... אֹהֶל
  choice: ஒரு கூடாரத்தையும் அமைத்தான்
  rationale: கூடாரத்துடன் வரும் נטה என்பது ‘விரி/நாட்டு/அமை’ என்று பொருள்படும். நவீனத் தமிழில் ‘கூடாரத்தை அமைத்தான்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது; எபிரெயில் குறிப்புச் சுட்டி இல்லாததால் ‘ஒரு’ எனத் தரப்பட்டது.
- source_word: לּוֹ
  choice: அதற்காக
  rationale: அருகிலுள்ள பொருத்தமான முன்னிலையான உடன்படிக்கைப் பெட்டியையே சுட்டுவதாக உடனடிச் சூழல் காட்டுகிறது. இருப்பினும் தாவீதைக் குறிக்கும் இலக்கண வாய்ப்பும் அடிக்குறிப்பில் காக்கப்பட்டுள்ளது.
theological_decisions:
- issue: וַיֶּט לוֹ אֹהֶל என்பதில் לּוֹ என்ற பின்னொட்டின் குறிப்பு
  choice: 'உடன்படிக்கைப் பெட்டியைக் குறிக்கும்: ‘அதற்காக ஒரு கூடாரத்தையும் அமைத்தான்’'
  alternative: 'தாவீதைக் குறிக்கும்: ‘தனக்காக ஒரு கூடாரத்தையும் அமைத்தான்’'
  rationale: முந்தைய உடனடித் தொடர் உடன்படிக்கைப் பெட்டிக்காக இடம் ஆயத்தப்படுத்துவதைப் பற்றியது; எனவே அதற்காகக் கூடாரம் அமைத்தான் என்பது தொடர்ச்சியான வாசிப்பு. ஆனால் எபிரெய ஆண்பால் ஒருமைப் பின்னொட்டு தாவீதையும் குறிக்கக்கூடும் என்பதால் அந்த உண்மையான தெளிவின்மை அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘வீடுகளைச் செய்தான்’ என்ற சொற்சொல் மொழிபெயர்ப்பைத் தவிர்த்து இயல்பான ‘வீடுகளைக் கட்டினான்’ எனவும், வழிபாட்டுச் சூழலைத் தெளிவாக்க ‘உடன்படிக்கைப் பெட்டி’ எனவும் வழங்கப்பட்டுள்ளது. மூலத்தின் சுட்டுப்பெயர் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
