  rationale: முதன்மைத் திருத்தம் மூலத்தில் இல்லாத ‘அங்கே’ என்ற இடக் குறிப்பை நீக்குகிறது. ‘அதை’ என்பது உடனடியான இலக்கியச் சூழலில் உள்ள உடன்படிக்கைப் பெட்டியைக் கொண்டுவரும் செயலை மட்டுமே சுட்டுகிறது; அதைச் சுமத்தல் போன்ற குறிப்பிட்ட செயலை முதன்மை உரையில் சேர்க்கவில்லை. மாற்று அடிக்குறிப்பு எபிரெயத்தின் விடுபட்ட, பலவாறு புரிந்துகொள்ளத்தக்க அமைப்பைத் தெளிவாகப் பாதுகாக்கிறது. இரண்டாவது திருத்தம் விதிக்கப்பட்ட நடைமுறை என்ற כַּמִּשְׁפָּט-ன் சூழல்சார் பொருளை இயல்பான தமிழில் வழங்குகிறது.
