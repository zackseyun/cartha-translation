source:
  edition: WLC
  text: כִּ֛י לְ/מַ בָּ/רִ֥אשׁוֹנָ֖ה לֹ֣א אַתֶּ֑ם פָּרַ֨ץ יְהוָ֤ה אֱלֹהֵ֨י/נוּ֙ בָּ֔/נוּ כִּי לֹ֥א דְרַשְׁנֻ֖/הוּ כַּ/מִּשְׁפָּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/013.yaml
  text: Because you were not there the first time[a], Yahweh our God broke out against us[b], because we did not seek him according to the ordinance.
translation:
  language: ta
  text: “முதல் முறையில் அதை நீங்கள் செய்யாததால்[a], நம் இறைவனாகிய யாவே நமக்கு எதிராகப் பாய்ந்தார்; ஏனெனில், நாம் அவரை விதிக்கப்பட்ட முறையின்படி நாடவில்லை[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “முதல் முறையில் நீங்கள் அல்லாததால், நம் இறைவனாகிய யாவே நமக்கு எதிராகப் பாய்ந்தார்.” எபிரெயத் தொடக்கம் சுருக்கமாக உள்ளது; உடன்படிக்கைப் பெட்டியைக் கொண்டுவருவதற்கான முதல் முயற்சியில் லேவியர்கள் ஈடுபடவில்லை என்பதையும் அது உணர்த்தலாம்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “விதிக்கப்பட்ட முறையின்படி அவரிடம் நாம் விசாரிக்கவில்லை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַ בָּרִאשׁוֹנָה לֹא אַתֶּם
  choice: முதல்முறை நீங்கள் அங்கே இல்லாததால்
  rationale: எபிரெயத் தொடர் சுருக்கமாக உள்ளது. சூழலில் முந்தைய முயற்சியில் லேவியர்கள் ஈடுபடாததை இது குறிக்கிறது; ‘அங்கே’ என்பது உரையில் உள்ள மறைபொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது, ஆனால் அவர்கள் செய்திருக்க வேண்டிய செயலை அளவுக்கு மீறிக் குறிப்பிடவில்லை.
- source_word: פָּרַץ
  choice: எதிராகப் பாய்ந்தார்
  rationale: திடீரென வெடித்தெழும் தெய்வீகத் தீர்ப்பின் வலிமையையும் בָּנוּ என்பதன் எதிர்மறை நோக்கையும் இது வெளிப்படுத்துகிறது; உசாவின் சம்பவத்தோடும் பேரெஸ்-உசா என்ற பெயருடனும் உள்ள சொல் தொடர்பை ஓரளவு தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது பட்டப்பெயரால் மாற்றப்படாமல், இஸ்ரவேலுக்கு வெளிப்படுத்தப்பட்ட இறைநாமத்தின் தமிழ் ஒலிபெயர்ப்பாக வழங்கப்படுகிறது.
- source_word: אֱלֹהֵינוּ
  choice: நம் இறைவன்
  rationale: முதல் நபர் பன்மை உடைமைப் பொருளை இயல்பான நவீனத் தமிழில் தக்கவைக்கிறது.
- source_word: בָּנוּ
  choice: நமக்கு எதிராக
  rationale: פָּרַץ உடன் வரும் தீர்ப்புச் சூழலில் வெறும் இடத்தைக் காட்டாமல், செயல் அவர்களைத் தாக்கியதைத் தெளிவாகக் காட்டுகிறது.
- source_word: דְרַשְׁנֻהוּ
  choice: நாம் அவரை நாடவில்லை
  rationale: דרשׁ என்பதன் ‘தேடுதல்/விசாரித்தல்/ஆலோசனை கேட்டல்’ என்ற பொருள் வீச்சில், வழிபாட்டில் இறைவனை முறையாக அணுகுதல் என்னும் பரந்த இறையியல் நயத்தை ‘நாடுதல்’ காக்கிறது.
- source_word: כַּמִּשְׁפָּט
  choice: நியமத்தின்படி
  rationale: உடன்படிக்கைப் பெட்டியை எடுத்துச் செல்வதற்கான விதிக்கப்பட்ட முறை அல்லது கட்டளையைச் சுருக்கமாகவும் கண்ணியமாகவும் குறிக்கிறது.
theological_decisions:
- issue: தொடக்கத் தொடரிலுள்ள விடுபட்ட கருத்து
  choice: முதல் முயற்சியில் லேவியர்கள் அங்கே இல்லாததாகப் பொருள் கொண்டு, ‘முதல்முறை நீங்கள் அங்கே இல்லாததால்’ என மொழிபெயர்த்தல்
  alternative: ‘முதல்முறையில், நீங்கள் அல்லாததால்’ அல்லது ‘முதல்முறை நீங்கள் அதைச் சுமக்காததால்’
  rationale: எபிரெயம் சுருக்கமானதும் இலக்கண ரீதியாகப் பலவாறு புரிந்துகொள்ளத்தக்கதும் ஆகும். 12–15ஆம் வசனங்களின் சூழல் லேவியர்களின் முந்தைய பங்கேற்பின்மையைக் காட்டுகிறது. முதன்மை உரை அந்த மறைபொருளை வெளிப்படுத்துகிறது; அடிக்குறிப்பு மாற்று வாசிப்பைப் பாதுகாக்கிறது.
- issue: פָּרַץ என்பதில் தெய்வீகச் செயலின் இயல்பு
  choice: யாவே திடீரெனத் தீர்ப்புடன் ‘நமக்கு எதிராகப் பாய்ந்தார்’
  alternative: ‘யாவே நம்மிடையே ஒரு பிளவை உண்டாக்கினார்’
  rationale: இது இறைவனுடைய பரிசுத்தத்தையும் தீர்ப்பின் தீவிரத்தையும் மங்கச் செய்யாமல், சம்பவத்தின் திடீர் தாக்கத்தை வாசிக்கத்தக்க தமிழில் வெளிப்படுத்துகிறது.
- issue: דרשׁ என்பதன் வழிபாட்டு மற்றும் விசாரணைப் பொருள்
  choice: ‘அவரை நாடவில்லை’
  alternative: ‘அவரிடம் விசாரிக்கவில்லை’
  rationale: முதன்மை வாசிப்பு இறைவனை முறையாக அணுகத் தவறிய பரந்த கருத்தைத் தக்கவைக்கிறது; குறிப்பான விசாரணைப் பொருள் அடிக்குறிப்பில் வழங்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியக்கூடிய, கண்ணியமான நடை. ‘யாவே’ என இறைநாமம் ஒலிபெயர்க்கப்பட்டுள்ளது. எபிரெயத் தொடக்கத்தின் உண்மையான சுருக்கமும் மாற்று வாசிப்பும் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.
