base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/014.yaml
  text: So the priests and the Levites consecrated themselves to bring up the ark of Yahweh[a], the God of Israel.
translation:
  language: ta
  text: ஆகவே, ஆசாரியர்களும் லேவியர்களும் இஸ்ரவேலின் கடவுளாகிய யாவேவின் பேழையை மேலே கொண்டுவருவதற்காகத் தங்களைப் புனிதப்படுத்திக் கொண்டார்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தங்களைத் தூய்மைப்படுத்திக் கொண்டார்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְקַדְּשׁוּ
  choice: தங்களைத் தூய்மைப்படுத்திக்கொண்டார்கள்
  rationale: קדשׁ என்பதன் ஹித்பயேல் வடிவம் புனிதப் பணிக்கான தன்னிலைச் சடங்கு ஆயத்தத்தைக் குறிக்கிறது. இத்தமிழாக்கம் அதன் தூய்மை மற்றும் அர்ப்பணிப்பு சார்ந்த பொருளை இயல்பாகத் தக்கவைக்கிறது.
- source_word: הַכֹּהֲנִים
  choice: ஆசாரியர்கள்
  rationale: இஸ்ரவேலின் வழிபாட்டுப் பணியாளர்களைக் குறிக்கும் כהנים என்பதற்கான நிலைபெற்ற, பொதுவாகப் புரிந்துகொள்ளப்படும் தமிழ் சொல்.
- source_word: וְהַלְוִיִּם
  choice: லேவியர்கள்
  rationale: லேவி கோத்திரத்தைச் சேர்ந்தவர்களைக் குறிக்கும் பெயரின் வழக்கமான தமிழ் வடிவம்.
- source_word: לְהַעֲלוֹת
  choice: மேலே கொண்டுவருவதற்காக
  rationale: עלה என்பதன் ஹிஃபில் வடிவம் ‘மேலே வரச் செய்தல்’ அல்லது ‘மேலே கொண்டுவருதல்’ எனப் பொருள்படும். எருசலேமுக்குப் பேழையைக் கொண்டுசெல்லும் சூழலில், போக்குவரத்து முறையைத் தேவையின்றி குறிப்பாக்காமல் திசைசார்ந்த பொருளைப் பேணுகிறது.
- source_word: אֶת אֲרוֹן
  choice: பேழையை
  rationale: இச்சூழலில் ארון உடன்படிக்கைப் பேழையைக் குறிக்கிறது; ‘பேழை’ என்பது தமிழில் நிலைபெற்ற வேதாகமச் சொல்.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான יהוה என்பதை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் இயல்பான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கடவுள்
  rationale: எபிரெய இணைப்புத் தொடரை நேரடியாகத் தருகிறது; இது யாவேவை இஸ்ரவேலின் கடவுளாக அடையாளப்படுத்துகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலவசனம் நான்கு எழுத்து இறைப் பெயரை நேரடியாகப் பயன்படுத்துவதால், அதை ஒரு பட்டமாக மாற்றாமல் தமிழில் ஒலிபெயர்த்து அதன் தனிப்பெயர்த் தன்மையைப் பேணுகிறது.
- issue: וַיִּתְקַדְּשׁוּ குறிக்கும் ஆயத்தத்தின் தன்மை
  choice: தங்களைத் தூய்மைப்படுத்திக்கொண்டார்கள்
  alternative: தங்களைப் புனிதப்படுத்திக்கொண்டார்கள்; தங்களை அர்ப்பணித்தார்கள்
  rationale: வினை புனிதப் பணிக்கான சடங்கு ஆயத்தத்தைக் குறிக்கிறது. மொழிபெயர்ப்பு அதை வெறும் உள்ளார்ந்த ஒழுக்கத் தூய்மையாகவோ முழுமையான அர்ப்பணிப்பாகவோ சுருக்காமல், மூலத்தின் பரந்த புனிதத்தன்மை சார்ந்த பொருளைப் பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் நோக்கத் தொடர் மற்றும் ‘மேலே கொண்டுவருதல்’ என்ற திசைசார்ந்த கூறு தக்கவைக்கப்பட்டுள்ளன.
