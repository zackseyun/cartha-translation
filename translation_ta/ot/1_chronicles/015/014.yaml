revisions:
- from: ஆகவே, இஸ்ரவேலின் கடவுளாகிய யாவேவின் பேழையை மேலே கொண்டுவருவதற்காக ஆசாரியர்களும் லேவியர்களும் தங்களைத் தூய்மைப்படுத்திக்கொண்டார்கள்[a].
  to: ஆகவே, ஆசாரியர்களும் லேவியர்களும் இஸ்ரவேலின் கடவுளாகிய யாவேவின் பேழையை மேலே கொண்டுவருவதற்காகத் தங்களைப் புனிதப்படுத்திக் கொண்டார்கள்[a].
  rationale: The revision makes ritual sanctification/consecration the primary Tamil sense of the reflexive קדשׁ verb, while retaining the cleansing-oriented wording as a legitimate lexical alternative. It preserves the source’s participants, purpose clause, upward movement, divine name, and appositional identification of Yahweh as Israel’s God.
