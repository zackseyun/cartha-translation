  yaml_path: translation/ot/1_chronicles/015/004.yaml
  text: And David gathered the sons of Aaron and the Levites.
translation:
  language: ta
  text: தாவீது ஆரோனின் மகன்களையும் லேவியர்களையும் ஒன்றுகூட்டினார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֶּאֱסֹף
  choice: ஒன்றுகூட்டினார்
  rationale: אסף என்பதன் தொடர்கதை வடிவம் மக்களை ஓரிடத்தில் திரட்டுவதைக் குறிக்கிறது. ‘ஒன்றுகூட்டினார்’ என்பது இயல்பான நவீனத் தமிழில் இச்செயலைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: דָּוִיד
  choice: தாவீது
  rationale: தமிழ் வேதாகம மரபில் நிலைபெற்றுள்ள பெயர் வடிவம்.
- source_word: בְּנֵי אַהֲרֹן
  choice: ஆரோனின் மகன்கள்
  rationale: எபிரெயச் சொற்றொடரின் நேரடிப் பொருள் ‘ஆரோனின் மகன்கள்.’ சூழலில் ஆரோனிய ஆசாரிய மரபினரைச் சுட்டக்கூடும் என்றாலும், மூலத்தின் வம்சவழிச் சொல்லாட்சியைத் தக்கவைக்கிறது.
- source_word: הַלְוִיִּם
  choice: லேவியர்கள்
  rationale: லேவியின் வழிவந்த வழிபாட்டுப் பணிக் குழுவைக் குறிக்கும் நிலைபெற்ற, இயல்பான தமிழ்ச் சொல்.
- source_word: אֵת ... וְאֵת
  choice: -ஐயும் ... -ஐயும்
  rationale: אֵת குறிக்கும் இரு வரையறுக்கப்பட்ட நேரடிச் செயப்படுபொருட்களையும் தமிழ் வேற்றுமை உருபும் இணை உம்மையும் கொண்டு இயல்பாகக் குறிக்கிறது.
