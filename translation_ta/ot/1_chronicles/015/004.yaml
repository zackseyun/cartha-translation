  source_fidelity: எபிரெய மூலத்தின் வாவ்-தொடர்கதை வினை ‘וַיֶּאֱסֹף’ என்பதற்கான ‘ஒன்றுகூட்டினார்’ பொருத்தமானது. தாவீது, ஆரோனின் மகன்கள், லேவியர்கள் என்ற இரு ஒருங்கிணைந்த நேரடிச் செயப்படுபொருட்களும் முழுமையாகவும் சரியான வரிசையிலும் தரப்பட்டுள்ளன.
  naturalness: ‘தாவீது ஆரோனின் மகன்களையும் லேவியர்களையும் ஒன்றுகூட்டினார்’ என்பது நவீன நிலையான தமிழில் இயல்பாகவும் கண்ணியமான வரலாற்று நடையிலும் உள்ளது. இரு பொருட்களிலும் வரும் ‘-ஐயும்’ இணைப்பு தெளிவானது.
  terminology: ‘தாவீது,’ ‘ஆரோன்,’ மற்றும் ‘லேவியர்கள்’ ஆகியவை நிலைபெற்ற தமிழ் வேதாகமப் பயன்பாட்டிற்கு ஏற்றவை. ‘மகன்கள்’ என்பது בְּנֵי என்ற மூலத்தின் வெளிப்படையான வம்சவழிச் சொல்லாட்சியைத் தக்கவைக்கிறது; சூழல்சார் விளக்கமான ‘ஆசாரியர்கள்’ என மாற்றப்படவில்லை.
