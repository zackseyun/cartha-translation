  text: לִ/בְנֵ֖י אֱלִֽיצָפָ֑ן שְׁמַֽעְיָ֥ה הַ/שָּׂ֖ר וְ/אֶחָ֥י/ו מָאתָֽיִם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/008.yaml
  text: 'For the sons of Elizaphan: Shemaiah the chief[a], and two hundred of his brothers.'
translation:
  language: ta
  text: 'எலிசாப்பானின் மகன்களில்: தலைவனாகிய செமாயாவும், அவனுடைய சகோதரர்கள்[a] இருநூறு பேரும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உறவினர்கள்.” இங்குள்ள எபிரெயச் சொல் உடன்பிறந்த சகோதரர்களை மட்டுமல்லாமல், குலப்பட்டியல் சூழலில் சககுலத்தவர்களையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי
  choice: மகன்களில்
  rationale: לְ இங்கு பெரிய பட்டியலுக்குள் ஒரு குலப்பிரிவை அறிமுகப்படுத்துகிறது; בְּנֵי என்பதன் நேரடிப் பொருளான ‘மகன்கள்’ குலவழிப் பெயராகத் தக்கவைக்கப்படுகிறது. தமிழ்ப் பட்டியல் நடையில் ‘மகன்களில்’ இயல்பாக அமைகிறது.
- source_word: אֱלִיצָפָן
  choice: எலிசாப்பான்
  rationale: எபிரெய ஒலியமைப்பை நவீனத் தமிழில் வாசிக்கத்தக்க வகையில் ஒலிபெயர்த்த தனிப்பெயர்.
- source_word: שְׁמַעְיָה
  choice: செமாயா
  rationale: எபிரெய தனிப்பெயரைத் தமிழில் இயல்பாக வாசிக்கத்தக்க முறையில் ஒலிபெயர்த்துள்ளது.
- source_word: הַשָּׂר
  choice: தலைவனாகிய
  rationale: שַׂר என்பது தலைவர், முதன்மையாளர், அதிகாரி போன்ற பொருள்களைக் கொள்ளும். இக்குலப்பட்டியல் சூழலில் அரச பதவியையோ குறிப்பிட்ட இராணுவப் பதவியையோ உணர்த்தாமல், குழுவுக்குத் தலைமை வகித்தவரைக் குறிக்க ‘தலைவன்’ பொருத்தமானது.
- source_word: וְאֶחָיו
  choice: அவனுடைய சகோதரர்கள்
  rationale: אָח என்பது உடன்பிறந்த சகோதரர்களையும் விரிந்த பொருளில் உறவினர்கள் அல்லது சககுலத்தவர்களையும் குறிக்கலாம். மூலத்தின் நேரடியான சொல்லை முதன்மை உரையில் தக்கவைத்து, சூழலுக்குரிய விரிந்த பொருளை அடிக்குறிப்பில் வழங்குகிறது.
- source_word: מָאתָיִם
  choice: இருநூறு பேர்
  rationale: எண்ணை நேரடியாக மொழிபெயர்த்து, மனிதர்களைக் கணக்கிடும் இயல்பான தமிழுக்காக ‘பேர்’ சேர்க்கப்பட்டுள்ளது.
