translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட நடையில் மொழிபெயர்க்கப்பட்டது. தனிப்பெயர்கள் எபிரெய வடிவிலிருந்து ஒலிப்பெயர்க்கப்பட்டன; உறுதியற்ற இசைச்சொல் விளக்கிக் கூறி முடிவுசெய்யப்படாமல் அப்படியே பாதுகாக்கப்பட்டது.
