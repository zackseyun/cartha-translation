base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/021.yaml
  text: and Mattithiah[a], Eliphelehu, Mikneiah, Obed-edom, Jeiel, and Azaziah were to lead with lyres according to the Sheminith.
translation:
  language: ta
  text: மத்தித்தியா, எலிப்பெலேஹு, மிக்னேயா, ஓபேத்-ஏதோம், யெயியேல், அசசியா ஆகியோர் யாழ்களுடன் ஷெமினீத் முறைப்படி வழிநடத்துபவர்களாக இருந்தனர்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எட்டாவதின்மேல்” அல்லது “தாழ்ந்த சுருதியில்.” “ஷெமினீத்” என்பது துல்லியமான பொருள் உறுதியாகத் தெரியாத ஓர் எபிரெய இசைச்சொல்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַתִּתְיָהוּ
  choice: மத்தித்தியா
  rationale: எபிரெயத் தனிப்பெயரின் ஒலிப்பெயர்ப்பு; இறுதியில் உள்ள தெய்வப்பெயர்ச் சுருக்கத்தைத் தமிழ் வாசிப்புக்கு இயல்பான வடிவில் பிரதிபலிக்கிறது.
- source_word: אֱלִיפְלֵהוּ
  choice: எலிப்பெலேகு
  rationale: இங்கு காணப்படும் முழுமையான எபிரெயப் பெயர் வடிவை ஒலிப்பெயர்த்துள்ளது.
- source_word: מִקְנֵיָהוּ
  choice: மிக்னேயா
  rationale: எபிரெய மெய்யெழுத்துகளையும் இறுதித் தெய்வப்பெயர்க் கூறையும் இயன்றவரை பிரதிபலிக்கும் தமிழ் ஒலிப்பெயர்ப்பு.
- source_word: עֹבֵד אֱדֹם
  choice: ஓபேத்-ஏதோம்
  rationale: கூட்டுத் தனிப்பெயரை வாசிப்புத் தெளிவுக்காக இடைக்கோட்டுடன் ஒலிப்பெயர்த்துள்ளது.
- source_word: יעִיאֵל
  choice: இயியேல்
  rationale: எபிரெயத் தனிப்பெயரின் ஒலியமைப்பை நெருக்கமாகப் பிரதிபலிக்கும் வடிவம்.
- source_word: עֲזַזְיָהוּ
  choice: அசசியா
  rationale: எபிரெயத் தனிப்பெயரை நவீனத் தமிழ் உச்சரிப்புக்கு ஏற்றவாறு ஒலிப்பெயர்த்துள்ளது.
- source_word: בְּכִנֹּרוֹת
  choice: யாழ்களை இசைத்து
  rationale: כִּנּוֹר என்பது ஒரு நரம்பிசைக் கருவி; ‘யாழ்’ என்பது தமிழில் புரிந்துகொள்ளத்தக்க நெருங்கிய கருவிப்பெயர். בְּ இங்கு கருவியைக் குறிக்கும் என்பதால் ‘இசைத்து’ என இயல்பாகத் தரப்பட்டுள்ளது.
- source_word: עַל הַשְּׁמִינִית
  choice: ஷெமினீத் முறைப்படி
  rationale: இது துல்லியமான பொருள் உறுதியாகத் தெரியாத தொழில்நுட்ப இசைச்சொல். ஆகவே பொருளை ஊகித்துத் தீர்மானிக்காமல் ஒலிப்பெயர்த்து, עַל என்பதைக் ‘முறைப்படி’ எனத் தந்துள்ளது.
- source_word: לְנַצֵּחַ
  choice: வழிநடத்தினார்கள்
  rationale: இசைச் சூழலில் נצח இசை நிகழ்வை மேற்பார்வையிடுதல், நடத்துதல் அல்லது முன்னின்று வழிநடத்துதல் எனக் குறிக்கலாம்; ‘வழிநடத்தினார்கள்’ இந்தச் செயல்பாட்டை மிகையாகக் குறிப்பாக்காமல் தெரிவிக்கிறது.
