  yaml_path: translation/ot/1_chronicles/015/019.yaml
  text: The singers were Heman[a], Asaph, and Ethan, with bronze cymbals to sound aloud.
translation:
  language: ta
  text: பாடகர்களான ஏமான், ஆசாப், ஏத்தான் ஆகியோர் வெண்கலக் கைத்தாளங்களை ஒலிக்கச் செய்வதற்காக நியமிக்கப்பட்டனர்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லர்த்தமாக, “கேட்கச் செய்வதற்காக.” எபிரெய வினை காரணவினை வடிவில் உள்ளது; “ஒலிக்கச் செய்வதற்காக” என்றும் மொழிபெயர்க்கலாம்.
    reason: לְהַשְׁמִיעַ என்ற எபிரெய காரணவினை வினையெச்சத்தின் சொற்பொருள் மாற்று.
lexical_decisions:
- source_word: וְהַמְשֹׁרְרִים
  choice: பாடகர்களான
  rationale: குறிப்பிட்டுப் பாடுகிறவர்களைக் குறிக்கும் பெயரெச்ச வடிவம். தொடரின் பட்டியல் அமைப்புக்கு இயல்பாகப் பொருந்துமாறு முன்னிலையிலுள்ள இணைப்புச்சொல் தனியே மொழிபெயர்க்கப்படவில்லை.
- source_word: הֵימָן אָסָף וְאֵיתָן
  choice: ஏமான், ஆசாப், ஏத்தான் ஆகியோர்
  rationale: தனிப்பட்ட பெயர்கள் தமிழில் வழக்கமான வேதாகம ஒலிபெயர்ப்பு வடிவங்களில் தரப்பட்டுள்ளன; இறுதி இணைப்பு இயல்பான பட்டியல் அமைப்பால் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: בִּמְצִלְתַּיִם
  choice: தாளங்களால்
  rationale: בְּ இங்கு கருவிப்பொருளைக் குறிக்கிறது. מְצִלְתַּיִם என்பது ஒன்றோடொன்று மோதிச் சத்தமிடும் தாளக் கருவிகளைக் குறிக்கிறது.
- source_word: נְחֹשֶׁת
  choice: வெண்கலத்
  rationale: பண்டைய உலோக இசைக்கருவிகளின் சூழலில் செம்பு அல்லது செம்புக் கலவையைக் குறிக்கும் சொல்லுக்கு ‘வெண்கலம்’ தெளிவான, வழக்கமான தேர்வு.
- source_word: לְהַשְׁמִיעַ
  choice: உரக்க ஒலி எழுப்பினார்கள்
  rationale: שׁמע என்பதன் ஹிஃபில் வினையெச்சம் சொல்லர்த்தமாக ‘கேட்கச் செய்ய’ என்பதாகும். இசைச் சூழலில் தாளங்களால் தெளிவாகக் கேட்கும் ஒலியை எழுப்புவதை இயல்பான தமிழில் தெரிவிக்கிறது; பட்டியல் சார்ந்த எபிரெய வாக்கியத் துணுக்கு தமிழில் முழு வாக்கியமாக்கப்பட்டுள்ளது.
