source:
  edition: WLC
  text: לִ/בְנֵ֖י קְהָ֑ת אוּרִיאֵ֣ל הַ/שָּׂ֔ר וְ/אֶחָ֖י/ו מֵאָ֥ה וְ/עֶשְׂרִֽים׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/005.yaml
  text: 'For the sons of Kohath: Uriel the chief[a], and 120 of his brothers.'
translation:
  language: ta
  text: 'கோகாத்தின் மகன்களில்: தலைவரான ஊரியேலும், அவனுடைய சகோதரர்கள் நூற்றிருபது பேரும்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சகோதரர்கள்’ என்பது இங்கே உடன்பிறந்தவர்களை மட்டும் குறிக்காமல், கோகாத்தியக் குலத்தைச் சேர்ந்த அவனுடைய உறவினர்களையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִ/בְנֵי קְהָת
  choice: கோகாத்தின் மகன்களில்
  rationale: லְ முன்னொட்டு இப்பட்டியலில் கோகாத்தியக் குலப்பிரிவை அறிமுகப்படுத்துகிறது. ‘மகன்களில்’ என்பது மூதாதையான கோகாத்தின் வழிவந்த குலத்தாரைக் குறிக்கும் எபிரெய வழக்கை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: אוּרִיאֵל
  choice: ஊரியேல்
  rationale: லேவியக் குலத்தலைவரின் இயற்பெயர்; எபிரெய உச்சரிப்பை அணுகும் வழக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: הַ/שָּׂר
  choice: தலைவரான
  rationale: שַׂר என்பதற்கு தலைவர், அதிகாரி, பிரபு ஆகிய பொருள்கள் உண்டு. இங்குள்ள குல மற்றும் வழிபாட்டுப் பணிப் பட்டியல் சூழலில் அரசகுலப் பொருளை உணர்த்தாமல் ‘தலைவர்’ என்பது பொருத்தமாக உள்ளது.
- source_word: וְ/אֶחָי/ו
  choice: அவனுடைய சகோதரர்கள்
  rationale: எபிரெயச் சொல்லின் நேரடிப் பொருள் ‘அவனுடைய சகோதரர்கள்’. சூழலில் இது உடன்பிறந்தவர்களை மட்டும் அல்லாமல் அதே கோகாத்தியக் குலத்தைச் சேர்ந்த ஆண்களையும் குறிக்கக்கூடும்; அந்த விரிவான சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: מֵאָה וְ/עֶשְׂרִים
  choice: நூற்றிருபது பேர்
  rationale: மனிதர்களின் எண்ணிக்கையைத் தெளிவாகக் காட்ட ‘பேர்’ சேர்க்கப்பட்டு, எண் இயல்பான தமிழ் சொல்வடிவில் வழங்கப்பட்டுள்ளது.
