translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதைமிக்கதும் பொதுவாசகர்களுக்கு எளிதில் புரியக்கூடியதுமான நடை பயன்படுத்தப்பட்டுள்ளது. நீளமான எபிரெய பட்டியல் அமைப்பு தமிழில் இயல்பாக அமைய, செயப்படுபொருட்கள் ‘-ஐ’ உருபுடன் வரிசைப்படுத்தப்பட்டு வினைச்சொல் இறுதியில் வைக்கப்பட்டுள்ளது. ‘மகன்’, ‘சகோதரர்கள்’ போன்ற குடும்ப உறவுச் சொற்கள் மூலத்தின் வம்ச மற்றும் குழு மொழிநடையைப் பாதுகாக்கின்றன.
