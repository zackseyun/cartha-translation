base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/017.yaml
  text: So the Levites appointed Heman son of Joel[a], and from his brothers Asaph son of Berechiah, and from the sons of Merari, their brothers[b], Ethan son of Kushaiah.
translation:
  language: ta
  text: ஆகவே, லேவியர்கள் யோவேலின் மகன் ஏமானையும், அவனுடைய சகோதரர்களில் பெரெகியாவின் மகன் ஆசாப்பையும், மெராரியின் மக்களாகிய அவர்களுடைய சகோதரர்களில் கூஷாயாவின் மகன் ஏத்தானையும் நியமித்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஒரு பொறுப்பில் நிறுத்தினார்கள்’ என்றும் மொழிபெயர்க்கலாம்; எபிரெய வினைச்சொல், ஒதுக்கப்பட்ட ஒரு பணியில் ஒருவரை நிற்கச் செய்வதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמִידוּ
  choice: நியமித்தார்கள்
  rationale: עמד என்பதன் ஹிஃபில் வடிவம், ஒருவரை ஒரு குறிப்பிட்ட பொறுப்பில் நிறுத்துவதைக் குறிக்கிறது. லேவிய இசைக்கலைஞர்களுக்குப் பொறுப்பளிக்கும் இச்சூழலில் ‘நியமித்தார்கள்’ என்பது இயல்பாகவும் துல்லியமாகவும் உள்ளது; ‘பணியில் நிறுத்தினார்கள்’ என்ற பொருளும் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: הַלְוִיִּם
  choice: லேவியர்கள்
  rationale: வரையறைச் சுட்டுடன் வரும் கோத்திரப் பெயருக்கான நவீனத் தமிழில் நிலைபெற்ற, இயல்பான வடிவம்.
- source_word: אֵת
  choice: தனியாக மொழிபெயர்க்கப்படவில்லை
  rationale: இது எபிரெய மொழியின் நேரடி செயப்படுபொருள் குறியீடு; தமிழில் ‘-ஐ’ உருபுகளால் அதன் இலக்கணப் பணி வெளிப்படுகிறது.
- source_word: הֵימָן
  choice: ஏமான்
  rationale: எபிரெய தனிப்பெயரின் தமிழாக்க ஒலிபெயர்ப்பு.
- source_word: בֶּן
  choice: மகன்
  rationale: வம்ச உறவைத் தெளிவாகக் குறிப்பிடும் சொல்லை நேரடியாகப் பாதுகாக்கிறது.
- source_word: יוֹאֵל
  choice: யோவேல்
  rationale: எபிரெய தனிப்பெயரின் தமிழில் பரவலாக அறியப்பட்ட ஒலிபெயர்ப்பு.
- source_word: וּמִן אֶחָיו
  choice: அவனுடைய சகோதரர்களில்
  rationale: מן ஒரு குழுவிலிருந்து ஒருவரைத் தேர்ந்தெடுப்பதைக் குறிக்கிறது. ‘சகோதரர்களில்’ என்பது அந்தப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אָסָף
  choice: ஆசாப்
  rationale: எபிரெய தனிப்பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: בֶּרֶכְיָהוּ
  choice: பெரெகியா
  rationale: எபிரெய தனிப்பெயரின் ஒலியமைப்பைத் தெளிவாகக் காட்டும் தமிழ் வடிவம்.
- source_word: וּמִן בְּנֵי מְרָרִי
  choice: மெராரியின் மக்களில்
  rationale: எபிரெய உரையின் ‘மெராரியின் மக்களிலிருந்து’ என்ற வம்சக்குழு மொழிநடையைப் பாதுகாக்கிறது; தமிழில் தேர்வைக் குறிக்க ‘மக்களில்’ என அமைக்கப்பட்டுள்ளது.
- source_word: אֲחֵיהֶם
  choice: அவர்களுடைய சகோதரர்களாகிய
  rationale: மூலத்தின் குடும்ப உறவுச் சொல்லையும் பன்மைச் சுட்டையும் பாதுகாக்கிறது; இங்கு தொடர்புடைய சக லேவியக் குழுவைக் குறிக்கிறது.
- source_word: אֵיתָן
  choice: ஏத்தான்
  rationale: எபிரெய தனிப்பெயரின் தமிழ் ஒலிபெயர்ப்பு.
- source_word: קֽוּשָׁיָהוּ
  choice: கூஷாயா
  rationale: எபிரெய தனிப்பெயரின் ஷ் ஒலியையும் இறுதி தெய்வப்பெயர் சார்ந்த கூறின் சுருக்கப்பட்ட ஒலியையும் பிரதிபலிக்கும் தமிழ் ஒலிபெயர்ப்பு.
