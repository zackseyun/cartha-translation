source:
  edition: WLC
  text: וַ/יַּקְהֵ֥ל דָּוִ֛יד אֶת כָּל יִשְׂרָאֵ֖ל אֶל יְרֽוּשָׁלִָ֑ם לְ/הַעֲלוֹת֙ אֶת אֲר֣וֹן יְהוָ֔ה אֶל מְקוֹמ֖/וֹ אֲשֶׁר הֵכִ֥ין לֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/003.yaml
  text: And David assembled all Israel at Jerusalem to bring up the ark of Yahweh to its place[b][a], which he had prepared for it.
translation:
  language: ta
  text: தாவீது இஸ்ரவேலர் அனைவரையும் எருசலேமுக்கு ஒன்று கூட்டினான்; யாவேவின் பேழையை, அவன் அதற்காக ஆயத்தம் செய்திருந்த இடத்திற்குக் கொண்டுவருவதற்காக.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவருக்காக அவன் ஆயத்தம் செய்திருந்த இடத்திற்குக்”; எபிரெயில் “அதற்காக” என்று மொழிபெயர்க்கப்பட்ட பின்னொட்டு ஆண்பால் ஒருமையில் உள்ளது. அது யாவேவைக் குறிக்கலாம்; ஆனால் சூழலில் அது பேழையைக் குறிப்பதாகப் புரிந்துகொள்வது இயல்பானது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְהֵל
  choice: கூட்டிவரச் செய்தான்
  rationale: קהל என்பதன் ஹிஃபில் வடிவம் மக்களை ஒன்றுகூடச் செய்வதைக் குறிக்கிறது. தமிழில் காரணவினைத் தன்மையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כָּל יִשְׂרָאֵל
  choice: இஸ்ரவேலர் அனைவரையும்
  rationale: தேசத்தினரையோ அவர்களின் பிரதிநிதிகளையோ ஒருங்கிணைத்துக் குறிக்கும் எபிரெயக் கூற்றை இயல்பான தமிழில் தருகிறது.
- source_word: אֶל יְרוּשָׁלִָם
  choice: எருசலேமுக்குக்
  rationale: אֶל என்பதன் திசைநோக்கிய பொருளான ‘எருசலேமுக்கு’ என்பதை நேரடியாகப் பாதுகாக்கிறது.
- source_word: לְהַעֲלוֹת
  choice: கொண்டுவருவதற்காக
  rationale: עלה என்பதில் ‘மேலே கொண்டுவருதல்’ என்ற நுண்பொருள் இருந்தாலும், தமிழில் இச்சூழலில் ‘கொண்டுவருதல்’ இயல்பாகவும் பொருள் தெளிவாகவும் உள்ளது; புவியியல் ஏற்றத்தை மிகைப்படுத்துவதில்லை.
- source_word: אֲרוֹן יְהוָה
  choice: யெகோவாவின் பெட்டியை
  rationale: אֲרוֹן என்பது இங்கு புனித உடன்படிக்கைப் பெட்டியைக் குறிக்கிறது. வசனத்தில் இல்லாத ‘உடன்படிக்கை’ என்ற சொல்லைச் சேர்க்காமல் ‘பெட்டி’ என மொழிபெயர்க்கப்படுகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: நான்கு எழுத்துத் தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாக அறியப்படும் பெயர்வடிவத்தில் தருகிறது.
- source_word: אֶל מְקוֹמוֹ
  choice: அதற்காக ... இடத்திற்குக்
  rationale: ‘அதன் இடம்’ என்ற எபிரெயத் தொடர்பைத் தமிழில் இயல்பாக, அடுத்துள்ள ஆயத்தப்படுத்தும் வாக்கியத்தோடு இணைத்துத் தருகிறது.
- source_word: אֲשֶׁר הֵכִין לוֹ
  choice: அதற்காக அவன் ஆயத்தம் செய்திருந்த
  rationale: הֵכִין என்பதன் முன்நிகழ்ந்த செயலை ‘செய்திருந்த’ என்பதும், לוֹ என்பதன் சூழல்சார் பெட்டியைக் குறிக்கும் வாசிப்பை ‘அதற்காக’ என்பதும் வெளிப்படுத்துகின்றன; இலக்கண மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட தெய்வீகப் பெயர் நேரடியாக இருப்பதால், அதை ‘கர்த்தர்’ என்ற பட்டமாக மாற்றாமல் பெயராகவே தருவது தேர்ந்தெடுக்கப்பட்டது. ‘யெகோவா’ தமிழில் பரவலாக அறியப்படும் வடிவம்; ‘யாவே’ மூல உச்சரிப்பை மீட்டமைக்க முயலும் மாற்று வடிவம்.
- issue: לוֹ என்ற ஆண்பால் ஒருமை பின்னொட்டின் சுட்டுப்பொருள்
  choice: பெட்டியைக் குறிக்கும் வகையில் ‘அதற்காக’
  alternative: ‘அவருக்காக’, அதாவது யெகோவாவுக்காக
  rationale: உடனடிச் சூழலில் தாவீது ஆயத்தம் செய்த இடம் பெட்டிக்குரிய இடமாகத் தெளிவாகத் தோன்றுகிறது. எனினும் எபிரெயில் பின்னொட்டு ஆண்பால் ஒருமையில் இருப்பதால் யெகோவாவைக் குறிக்கும் வாய்ப்பும் இலக்கண ரீதியாக உள்ளது; ஆகவே அது அடிக்குறிப்பில் வைக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட நடை. எபிரெயின் காரணவினைத் தன்மை மற்றும் எருசலேமை நோக்கிய திசை பாதுகாக்கப்பட்டுள்ளன. நீண்ட எபிரெய வாக்கியத்தின் நோக்கத்தைத் தமிழில் தெளிவாக்க இரண்டாம் பகுதியில் வினை மீண்டும் கூறப்பட்டுள்ளது; புதிய தகவல் சேர்க்கப்படவில்லை.
