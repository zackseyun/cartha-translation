base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/020.yaml
  text: and Zechariah[a], Aziel, Shemiramoth, Jehiel, Unni, Eliab, Maaseiah, and Benaiah, with harps according to Alamoth.
translation:
  language: ta
  text: செகரியா, அசியேல், செமிராமோத், யெகியேல், உன்னி, எலியாப், மாசெயா, பெனாயா ஆகியோர் யாழ்களை அலாமோத்[a] முறைப்படி இசைத்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அலாமோத்’ என்பது இளம்பெண்களோடு தொடர்புடைய ஓர் இசைக் குறிப்பாகவோ, உயர்ந்த சுருதியைக் குறிக்கும் சொல்லாகவோ இருக்கலாம்; அதன் துல்லியமான பொருள் உறுதியில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּנְבָלִים
  choice: யாழ்களை வாசித்தார்கள்
  rationale: נְבָלִים என்பது நரம்பிசைக் கருவிகளைக் குறிக்கிறது; இச்சூழலில் ‘யாழ்கள்’ என்பது இயல்பான தமிழ் பெயர். எபிரெய முன்னொட்டு ב கருவியைக் குறிப்பதால், தமிழில் வினையை வெளிப்படையாகச் சேர்த்து ‘யாழ்களை வாசித்தார்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: עַל
  choice: முறைப்படி
  rationale: இசைச் சூழலில் עַל என்பது அடுத்துவரும் தொழில்நுட்பச் சொல்லோடு தொடர்புடைய இசைமுறை, அமைப்பு அல்லது சுருதியைக் குறிக்கலாம். ‘முறைப்படி’ என்பது அதன் நெகிழ்வைத் தக்கவைத்து, பொருளை அளவுக்கு மீறி முடிவுசெய்யாமல் விடுகிறது.
- source_word: עֲלָמוֹת
  choice: அலாமோத்
  rationale: இது சொற்பிறப்பில் இளம்பெண்களோடு தொடர்புடையதாக இருந்தாலும், இங்கு ஒரு தொழில்நுட்ப இசைக்குறிப்பாக இருக்கலாம்; அதன் துல்லியமான பொருள் உறுதியற்றதால் ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டு, சாத்தியமான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וּ/זְכַרְיָה וַ/עֲזִיאֵל וּ/שְׁמִירָמוֹת וִֽ/יחִיאֵל וְ/עֻנִּי וֶֽ/אֱלִיאָב וּ/מַעֲשֵׂיָהוּ וּ/בְנָיָהוּ
  choice: செகரியா, அசியேல், செமிராமோத், யெகியேல், உன்னி, எலியாப், மாசெயா, பெனாயா ஆகியோர்
  rationale: தனிப்பெயர்கள் எபிரெய உச்சரிப்பை அடிப்படையாகக் கொண்டு தமிழில் ஒலிபெயர்க்கப்பட்டன. வசனம் முந்தைய பட்டியலின் தொடர்ச்சியாக இருந்தாலும், தமிழில் முழுமையான இயல்பான வாக்கியமாக அமைய ‘ஆகியோர்’ சேர்க்கப்பட்டது.
