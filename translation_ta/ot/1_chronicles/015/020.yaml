translation_notes:
  register: நவீனத் தரத் தமிழில், வாசிக்க எளிதானதும் மரியாதைமிக்கதுமான நடை பயன்படுத்தப்பட்டது. மூலத்தில் வினை வெளிப்படையாக இல்லாவிட்டாலும், பட்டியலின் இசைச் செயலைத் தமிழில் தெளிவாக்க ‘வாசித்தார்கள்’ சேர்க்கப்பட்டது; ‘அலாமோத்’ என்ற தெளிவற்ற இசைச்சொல் மொழிபெயர்த்து உறுதிப்படுத்தப்படாமல் தக்கவைக்கப்பட்டது.
