base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/015.yaml
  text: And the sons of the Levites carried the ark of God on their shoulders with the poles upon them[a], just as Moses had commanded according to the word of Yahweh.
translation:
  language: ta
  text: லேவியரின் மகன்கள், யாவேயின் வார்த்தையின்படி மோசே கட்டளையிட்டபடியே, கடவுளின் பெட்டியைத் தங்கள் தோள்களின்மேல் தண்டுகளை வைத்து சுமந்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׂאוּ
  choice: சுமந்தார்கள்
  rationale: இந்தச் சூழலில் נשא என்பது பெட்டியைத் தூக்கிச் செல்வதைக் குறிக்கிறது; ‘சுமந்தார்கள்’ என்பது தொடர்ந்த சுமத்தலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְנֵי הַלְוִיִּם
  choice: லேவியரின் மகன்கள்
  rationale: எபிரெய உரையிலுள்ள ‘லேவியரின் மகன்கள்’ என்ற குடும்ப/குலக் குறிப்பைச் சுருக்காமல் பாதுகாக்கிறது.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: கடவுளின் பெட்டி
  rationale: இங்கு உரை ‘கடவுளின் பெட்டி’ என்று மட்டுமே கூறுகிறது; ‘உடன்படிக்கைப் பெட்டி’ என்பதைச் சேர்க்கவில்லை.
- source_word: כַּאֲשֶׁר צִוָּה מֹשֶׁה
  choice: மோசே கட்டளையிட்டபடியே
  rationale: כַּאֲשֶׁר குறிக்கும் துல்லியமான ஒத்திசைவை ‘-படியே’ இயல்பாகத் தெரிவிக்கிறது.
- source_word: כִּדְבַר יְהוָה
  choice: யாவே கூறிய வார்த்தையின்படி
  rationale: דבר என்பதன் ‘வார்த்தை’ என்னும் பொருளையும், கட்டளை மோசேயின் சொந்த அதிகாரத்தால் அல்லாமல் யாவேயின் வார்த்தையின்படி வந்தது என்பதையும் பாதுகாக்கிறது.
- source_word: בִּכְתֵפָם
  choice: தங்கள் தோள்களில்
  rationale: சுமப்பதற்கான இடத்தையும் ஆதரவையும் தெளிவான நவீன தமிழில் குறிக்கிறது.
- source_word: בַּמֹּטוֹת עֲלֵיהֶם
  choice: தண்டுகள் அவர்கள்மேல் இருக்கும்படி
  rationale: தண்டுகள் சுமந்தவர்களின் தோள்கள்மேல் இருந்தன என்ற எபிரெயத் தொடரின் குறிப்பை விளக்கமாக்காமல் பாதுகாக்கிறது; இயல்பான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் உடன்படிக்கைப் பெயரான יהוה நேரடியாக உள்ளது; பொதுப்பட்டத்தை மாற்றாக இடாமல் அந்தத் தனிப்பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- issue: בְנֵי הַלְוִיִּם என்பதிலுள்ள பாலினமும் குல உறவும்
  choice: லேவியரின் மகன்கள்
  alternative: லேவியர்கள்
  rationale: மூலத்தின் ஆண்பால் பன்மை மகன்-உறவுச் சொல்லையும் குல வெளிப்பாட்டையும் பொதுவான கூட்டுப்பெயராக மாற்றாமல் வைத்திருக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பும் கண்ணியமும் பேணப்பட்டுள்ளன. ‘பெட்டி’ என்பது אָרוֹן என்பதற்கான நேரடியான சொல்; வசனத்தில் இல்லாத ‘உடன்படிக்கை’ சேர்க்கப்படவில்லை. ‘கூறிய வார்த்தையின்படி’ என்பது தமிழில் சிறிது செறிவானதாக இருந்தாலும், דְבַר என்பதையும் மோசேயின் கட்டளைக்கும் யாவேயின் வார்த்தைக்கும் உள்ள தொடர்பையும் பாதுகாக்கிறது.
