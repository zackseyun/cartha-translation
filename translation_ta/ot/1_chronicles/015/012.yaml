  text: וַ/יֹּ֣אמֶר לָ/הֶ֔ם אַתֶּ֛ם רָאשֵׁ֥י הָ/אָב֖וֹת לַ/לְוִיִּ֑ם הִֽתְקַדְּשׁוּ֙ אַתֶּ֣ם וַ/אֲחֵי/כֶ֔ם וְ/הַֽעֲלִיתֶ֗ם אֵ֣ת אֲר֤וֹן יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֶל הֲכִינ֖וֹתִי לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/012.yaml
  text: And he said to them[a], “You are the heads of the fathers’ houses of the Levites. Sanctify yourselves, you and your brothers, and bring up the ark of Yahweh, the God of Israel, to the place I have prepared for it.”
translation:
  language: ta
  text: அவர் அவர்களிடம், “நீங்கள் லேவியருடைய தந்தை வழிக் குடும்பங்களின் தலைவர்கள். நீங்களும் உங்கள் சகோதரர்களும் உங்களைத் தூய்மைப்படுத்திக்கொள்ளுங்கள்[a]. பின்பு இஸ்ரவேலின் கடவுளாகிய யாவேயின் பெட்டியை, அதற்கென நான் ஆயத்தம் செய்துள்ள இடத்துக்கு மேலே எடுத்துவருங்கள்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்களைப் புனிதப்படுத்திக்கொள்ளுங்கள்.” எபிரெய வினைச்சொல் வழிபாட்டுக்கான சடங்குசார் தூய்மைப்படுத்தலைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאשֵׁי הָאָבוֹת לַלְוִיִּם
  choice: லேவியரின் தந்தைவழிக் குடும்பத் தலைவர்கள்
  rationale: தந்தைவழி மரபின்படி அமைந்த லேவியக் குடும்பங்களின் தலைவர்களை இச்சொற்றொடர் குறிக்கிறது; எபிரெய சமூக அமைப்பின் தனித்தன்மையையும் இயல்பான தமிழையும் இவ்வடிவம் காக்கிறது.
- source_word: הִתְקַדְּשׁוּ
  choice: உங்களைத் தூய்மைப்படுத்திக்கொள்ளுங்கள்
  rationale: קדשׁ என்பதன் ஹித்பயேல் வடிவம் இங்கு வழிபாட்டுக்கான சடங்குசார் ஆயத்தத்தையும் தூய்மைப்படுத்தலையும் குறிக்கிறது. பொதுவாசகர்களுக்குப் புரியும் வகையில் ‘தூய்மைப்படுத்திக்கொள்ளுங்கள்’ பயன்படுத்தப்பட்டு, அதன் சடங்குசார் நுட்பம் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: וַאֲחֵיכֶם
  choice: உங்கள் சகோதரர்களும்
  rationale: மூலத்தின் ‘உங்கள் சகோதரர்கள்’ என்ற உறவுமுறைச் சொல்லை நேரடியாகக் காக்கிறது; சூழலில் இது சக லேவியர்களைக் குறிக்கிறது.
- source_word: וְהַעֲלִיתֶם
  choice: மேலே கொண்டுவாருங்கள்
  rationale: עלה என்பதன் காரணவினை வடிவிலுள்ள ‘மேலே கொண்டுவருதல்’ என்ற திசைநுட்பத்தைத் தக்கவைக்கிறது.
- source_word: אֲרוֹן יְהוָה אֱלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கடவுளாகிய யாவேயின் பெட்டி
  rationale: אֲרוֹן என்பதற்கு சூழலுக்கு ஏற்ற ‘பெட்டி’ பயன்படுத்தப்பட்டுள்ளது; மூலத்தில் இல்லாத ‘உடன்படிக்கை’ சேர்க்கப்படவில்லை. தெய்வீகப் பெயரும் அதை விளக்கும் ‘இஸ்ரவேலின் கடவுள்’ என்ற தொடரும் முழுமையாகக் காக்கப்பட்டுள்ளன.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய நான்கெழுத்துத் தெய்வீகப் பெயரின் வழக்கமான தமிழாக்க ஒலிபெயர்ப்பு; பொதுப்பட்டமான ‘ஆண்டவர்’ என்பதற்குப் பதிலாக மூலத்திலுள்ள தனிப்பெயரை வெளிப்படுத்துகிறது.
- source_word: אֶל הֲכִינוֹתִי לוֹ
  choice: அதற்காக நான் ஆயத்தம் செய்துள்ள இடத்துக்கு
  rationale: אֶל என்ற திசை முன்னிடைச்சொல்லும் கதைச் சூழலும் குறிக்கும் இலக்கிடத்தை இயல்பான தமிழுக்காக ‘இடம்’ என்று வெளிப்படையாக்குகிறது; அந்தச் சொல் எபிரெயத்தில் நேரடியாக இல்லை என்றாலும் பொருளில் தெளிவாக உட்பொதிந்துள்ளது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: வசனத்தில் நான்கெழுத்துத் தெய்வீகப் பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டப்பெயராக மாற்றாமல் தனிப்பெயராக ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைக் காக்கிறது.
- issue: הִתְקַדְּשׁוּ என்பதிலுள்ள வழிபாட்டுச் சடங்கு நுட்பம்
  choice: உங்களைத் தூய்மைப்படுத்திக்கொள்ளுங்கள்
  alternative: உங்களைப் புனிதப்படுத்திக்கொள்ளுங்கள்; உங்களை அர்ப்பணித்துக்கொள்ளுங்கள்
  rationale: இச்சூழலில் இது வெறும் ஒழுக்கத் தூய்மையையோ முழுமையான அர்ப்பணிப்பையோ மட்டும் குறிக்காமல், பெட்டியைச் சுமப்பதற்கு முன் செய்ய வேண்டிய சடங்குசார் தூய்மைப்படுத்தலைக் குறிக்கிறது. மொழிபெயர்ப்பு அந்தப் பொருளை இயல்பாகத் தருகிறது; அடிக்குறிப்பு அதன் நுட்பத்தைத் தெளிவுபடுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு விளங்கும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘தந்தைவழிக் குடும்பம்’ மூலச் சமூக அமைப்பைத் தெளிவுபடுத்துகிறது; ‘பெட்டி’ என்பது אֲרוֹן என்பதற்கான எளிய நேரடி சொல். வாக்கிய ஓட்டத்திற்காக கட்டளை இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது.
