translation_notes:
  register: நவீன நிலையான தமிழில், வேதாகம வம்சப் பட்டியலுக்கேற்ற சுருக்கமானதும் கண்ணியமானதுமான நடை பயன்படுத்தப்பட்டுள்ளது. ஆள்பெயர்கள் மொழிபெயர்க்கப்படாமல் எபிரேய ஒலிக்கு அணுக்கமாகத் தமிழாக்கப்பட்டுள்ளன.
