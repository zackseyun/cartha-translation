  language: ta
  text: நோகா[a], நெபெக், மற்றும் யாபியா.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரேய ஆள்பெயர்களின் ஒலிபெயர்ப்பு: ‘நோகா’ என்பதை ‘நோகாஹ்’ என்றும், ‘யாபியா’ என்பதை ‘யாஃபியா’ என்றும் ஒலிபெயர்க்கலாம்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹגַהּ
  choice: நோகா
  rationale: வம்சப் பட்டியலில் வரும் எபிரேய ஆள்பெயர்; அதன் பொருளை மொழிபெயர்க்காமல், நவீனத் தமிழில் இயல்பாக ஒலிபெயர்க்கப்பட்டுள்ளது. இறுதி הּ தனி மெய்யொலியாகத் தமிழில் காட்டப்படவில்லை.
- source_word: נֶפֶג
  choice: நேபெக்
  rationale: எபிரேய ஆள்பெயர் நேரடியாக ஒலிபெயர்க்கப்பட்டுள்ளது; சொல்லின் இறுதி ג இங்கு ‘க்’ எனக் குறிக்கப்பட்டுள்ளது.
- source_word: יָפִיעַ
  choice: யாப்பியா
  rationale: ஆள்பெயர் அதன் எபிரேய உச்சரிப்பை அணுகும் வகையில் ஒலிபெயர்க்கப்பட்டுள்ளது; தொடக்க י ‘ய’ எனவும், פ இச்சூழலில் ‘ப்ப’ எனவும் தரப்பட்டுள்ளது.
- source_word: וְ
  choice: பெயர்களைப் பிரிக்கும் காற்புள்ளிகள்
  rationale: எபிரேயத்தில் ஒவ்வொரு பெயருக்கும் முன் வரும் இணைப்புச் சொல், தமிழின் இயல்பான பட்டியல் நடைக்கேற்ப தனித்தனியாக மொழிபெயர்க்கப்படாமல் காற்புள்ளிகளால் வெளிப்படுத்தப்பட்டுள்ளது.
