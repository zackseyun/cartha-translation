  yaml_path: translation/ot/1_chronicles/003/010.yaml
  text: And the son of Solomon was Rehoboam; Abijah his son[a], Asa his son, Jehoshaphat his son.
translation:
  language: ta
  text: சாலொமோனின் மகன் ரெகொபெயாம்; அவனுடைய மகன் அபியா[a]; அவனுடைய மகன் ஆசா; அவனுடைய மகன் யோசபாத்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில்: “அபியா.” 1–2 அரசர்கள் நூல்களில் இதே அரசன் “அபியாம்” என்ற வேறுபட்ட பெயர் வடிவத்தாலும் குறிப்பிடப்படுகிறான்.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/בֶן שְׁלֹמֹה
  choice: சாலொமோனின் மகன்
  rationale: וּ genealogical continuation என்பதைச் சுட்டுகிறது; தனி வசனமாக இயல்பான தமிழில் தேவையற்ற தொடக்க ‘மேலும்’ இன்றி, construct phrase-ஐத் துல்லியமாக வழங்குகிறது.
- source_word: שְׁלֹמֹה
  choice: சாலொமோன்
  rationale: எபிரெய தனிப்பெயரின் தமிழில் பரவலாக அறியப்படும் வேதாகம வடிவம்.
- source_word: רְחַבְעָם
  choice: ரெகொபெயாம்
  rationale: எபிரெய தனிப்பெயருக்கு தமிழில் நிலைபெற்ற வேதாகம வடிவம்.
- source_word: אֲבִיָּה
  choice: அபியா
  rationale: இவ்வசனத்தில் உள்ள אֲבִיָּה என்ற வடிவத்தைப் பிரதிபலிக்கிறது; அரசர்கள் நூலில் காணப்படும் வேறுபட்ட அபியாம் வடிவத்தை முதன்மை உரையில் கலக்கவில்லை.
- source_word: בְנ/וֹ
  choice: அவனுடைய மகன்
  rationale: மூன்றாம் நபர் ஆண்பால் ஒருமை உடைமைப் பின்னொட்டை வெளிப்படையாகக் காட்டி, வம்சவரிசையின் மீளுரைக் கட்டமைப்பைப் பாதுகாக்கிறது.
- source_word: אָסָא
  choice: ஆசா
  rationale: எபிரெய தனிப்பெயரின் வழக்கமான தமிழ் வேதாகம வடிவம்.
- source_word: יְהוֹשָׁפָט
  choice: யோசபாத்
  rationale: எபிரெய தனிப்பெயரின் தமிழில் நிலைபெற்ற வேதாகம வடிவம்.
