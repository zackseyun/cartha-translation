  yaml_path: translation/ot/1_chronicles/003/017.yaml
  text: 'And the sons of Jeconiah: Assir[a], Shealtiel his son.'
translation:
  language: ta
  text: 'எகொனியாவின் மகன்கள்: அசீர்[a], செயல்த்தியேல் அவனுடைய மகன்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, “சிறைப்பட்டவனான எகொனியாவின் மகன்கள்: செயல்த்தியேல் அவனுடைய மகன்.” எபிரெயச் சொல்லான אַסִּר என்பதை ‘அசீர்’ என்ற தனிப்பெயராகவும், ‘சிறைப்பட்டவன்’ என்ற பொதுப்பெயராகவும் வாசிக்கலாம்.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: மகன்கள்
  rationale: ו genealogical sequence marker என்றாலும், தனி வசனமாக இயல்பான தமிழில் தொடக்க ‘மேலும்’ அவசியமில்லை; בְנֵי என்பதன் வழக்கமான வம்சவரலாற்றுப் பொருள் ‘மகன்கள்’ எனத் தரப்பட்டுள்ளது.
- source_word: יְכָנְיָה
  choice: எகொனியா
  rationale: எபிரெய தனிப்பெயரின் ஒலிப்பை நவீன தமிழில் இயல்பாக எழுத்துப்பெயர்த்த வடிவம்.
- source_word: אַסִּר
  choice: அசீர்
  rationale: மசோரா உயிர்க்குறிப்பும் வம்சப்பட்டியல் அமைப்பும் இதைத் தனிப்பெயராக வாசிக்க ஆதரிக்கின்றன; ‘சிறைப்பட்டவன்’ என்ற பொதுப்பெயர் வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: שְׁאַלְתִּיאֵל
  choice: செயல்த்தியேல்
  rationale: எபிரெயப் பெயரான שְׁאַלְתִּיאֵל என்பதற்கு மூலமொழி ஒலிப்பை அணுகும் தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: בְּנוֹ
  choice: அவனுடைய மகன்
  rationale: மூன்றாம் நபர் ஆண்பால் ஒருமை உடைமைப் பின்னொட்டை வெளிப்படையாகப் பாதுகாக்கிறது; இச்சொற்றொடரில் அது எகொனியாவைக் குறிப்பதாக எடுத்துக்கொள்ளப்படுகிறது.
theological_decisions:
- issue: אַסִּר என்பதைத் தனிப்பெயராகவா, ‘சிறைப்பட்டவன்’ என்ற பொதுப்பெயராகவா வாசிப்பது
  choice: முதன்மை உரையில் ‘அசீர்’ என்ற தனிப்பெயர்
  alternative: '‘சிறைப்பட்ட எகொனியாவின் மகன்கள்: அவனுடைய மகன் செயல்த்தியேல்.’'
  rationale: எபிரெய வடிவம் இரண்டு வாசிப்புகளுக்கும் இடமளிக்கிறது. வம்சப்பட்டியல் சூழலும் மசோரா உயிர்க்குறிப்பும் தனிப்பெயர் வாசிப்பை ஆதரித்தாலும், வரலாற்றுப் பொருளுள்ள மாற்று வாசிப்பை அடிக்குறிப்பில் வைத்துப் பொருள் மயக்கத்தைப் பாதுகாக்கிறோம்.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் எளிமையும் கொண்ட வம்சவரலாற்று நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் சுருக்கமான பட்டியல் அமைப்பும் אַסִּר என்பதிலுள்ள உண்மையான இருபொருள் வாய்ப்பும் பாதுகாக்கப்பட்டுள்ளன.
