  text: Six were born to him in Hebron, and he reigned there seven years and six months; and in Jerusalem he reigned thirty-three years.
translation:
  language: ta
  text: எப்ரோனில் அவருக்குப் பிறந்தவர்கள் ஆறு பேர். அவர் அங்கே ஏழு ஆண்டுகளும் ஆறு மாதங்களும் அரசாண்டார்; எருசலேமில் முப்பத்து மூன்று ஆண்டுகள் அரசாண்டார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁשָּׁה
  choice: அந்த ஆறு மகன்களும்
  rationale: முந்தைய வசனங்களில் பட்டியலிடப்பட்ட மகன்களையே இந்த எண்ணிக்கை சுருக்கிக் குறிப்பிடுகிறது. எபிரெயத்தில் ‘மகன்கள்’ மீண்டும் வெளிப்படையாக இல்லாவிட்டாலும், தமிழில் குறிப்பு தெளிவாகவும் இயல்பாகவும் இருக்கச் சூழலிலிருந்து சேர்க்கப்பட்டது.
- source_word: נוֹלַד לוֹ
  choice: அவருக்குப் பிறந்தவர்கள்
  rationale: ילד வினையின் செயல்பாட்டு வடிவத்தையும் ל + பதிலிடுபெயரின் பொருளையும் காத்து, ‘அவருக்குப் பிறந்தவர்கள்’ என மொழிபெயர்க்கப்பட்டது; ‘அவர் பெற்றெடுத்தார்’ போன்ற செயப்பாட்டு விளக்கம் தவிர்க்கப்பட்டது.
- source_word: בְחֶבְרוֹן
  choice: எப்ரோனில்
  rationale: இடத்தைக் குறிக்கும் בְ முன்னொட்டின் நேரான, இயல்பான தமிழ் வடிவம்.
- source_word: וַיִּמְלָךְ שָׁם
  choice: அவர் அங்கே ... அரசாண்டார்
  rationale: מלך இங்கு அரசாட்சியை நடத்துவதைக் குறிக்கிறது. ‘அரசரானார்’ என்பது பதவியேற்றதைக் குறிப்பதாக மாறக்கூடும்; ஆகவே ‘அரசாண்டார்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: שֶׁבַע שָׁנִים וְשִׁשָּׁה חֳדָשִׁים
  choice: ஏழு ஆண்டுகளும் ஆறு மாதங்களும்
  rationale: கால அளவை நவீனத் தமிழின் இயல்பான இணைப்பு முறையில் அளிக்கிறது.
- source_word: וּשְׁלֹשִׁים וְשָׁלוֹשׁ שָׁנָה
  choice: முப்பத்து மூன்று ஆண்டுகள்
  rationale: எபிரெய எண்ணமைப்பை இயல்பான நவீனத் தமிழில் வழங்குகிறது; கூட்டு எண்ணுக்குப் பின் வரும் ஒருமை வடிவத்தைத் தமிழில் பன்மையாக மொழிபெயர்ப்பது பொருத்தமானது.
- source_word: מָלַךְ בִּירוּשָׁלִָם
  choice: எருசலேமில் ... அரசாண்டார்
  rationale: எபிரெய உரையில் முன்னிலைப்படுத்தப்பட்ட புதிய இடத்தைத் தமிழிலும் வாக்கியத்தின் தொடக்கத்தில் வைத்துக் காக்கிறது.
