base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/021.yaml
  text: 'And the sons of Hananiah: Pelatiah and Jeshaiah; the sons of Rephaiah[a], the sons of Arnan, the sons of Obadiah, the sons of Shecaniah.'
translation:
  language: ta
  text: 'அனனியாவின் மகன்: பெலத்தியாவும் யெசாயாவும்; ரெபாயாவின் மகன்கள்[a], அர்னானின் மகன்கள், ஒபதியாவின் மகன்கள், செக்கனியாவின் மகன்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெய வாக்கிய அமைப்பு சுருக்கமாகவும் ஓரளவு கடினமாகவும் உள்ளது. சொல்லுக்குச் சொல் பார்த்தால், “அனனியாவின் மகன்: பெலத்தியாவும் யெசாயாவும்; ரெபாயாவின் மகன்கள், அர்னானின் மகன்கள், ஒபதியாவின் மகன்கள், செக்கனியாவின் மகன்கள்” என்று உள்ளது. இந்தத் தொடரின் ஒரு பகுதி உடனடி மகன்களைக் குறிக்காமல், விரிந்த வழித்தோன்றல் வரிசையைக் குறிக்கிறது என்றும் சிலர் புரிந்துகொள்கிறார்கள்.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּבֶן
  choice: மகன்கள்
  rationale: எபிரெயச் சொல் ஒருமையில் ‘மகன்’ என்று இருந்தாலும், அதைத் தொடர்ந்து பெலத்தியா, யெசாயா என்ற இரு பெயர்கள் வருவதால், இயல்பான தமிழ் நடைக்காகப் பன்மை பயன்படுத்தப்பட்டது; மூலத்தின் சிக்கல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: חֲנַנְיָה
  choice: அனனியா
  rationale: தனிப்பட்ட பெயர்; நவீனத் தமிழில் எளிதாக வாசிக்கக்கூடிய ஒலிபெயர்ப்பு.
- source_word: פְּלַטְיָה
  choice: பெலத்தியா
  rationale: தனிப்பட்ட பெயரின் தமிழ் ஒலிபெயர்ப்பு.
- source_word: וִישַׁעְיָה
  choice: யெசாயாவும்
  rationale: இணைப்புச் சொல்லுடன் வரும் தனிப்பட்ட பெயர்; தொடர்புடைய வேறு பெயர்களோடு தேவையின்றிக் கலக்காமல் எபிரெய வடிவை ஒட்டி ஒலிபெயர்க்கப்பட்டது.
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: வம்சப் பட்டியலில் அடிப்படையாக ‘மகன்கள்’ என்று பொருள்; சில இடங்களில் விரிவாக ‘வழித்தோன்றல்கள்’ என்றும் அமையலாம். துல்லியமான தலைமுறை இடைவெளியை ஊகிக்காமல் மீளும் அமைப்பு பாதுகாக்கப்பட்டது.
- source_word: רְפָיָה
  choice: ரெபாயா
  rationale: தனிப்பட்ட பெயரின் தமிழ் ஒலிபெயர்ப்பு.
- source_word: אַרְנָן
  choice: அர்னான்
  rationale: தனிப்பட்ட பெயரின் தமிழ் ஒலிபெயர்ப்பு.
- source_word: עֹבַדְיָה
  choice: ஒபதியா
  rationale: தனிப்பட்ட பெயரின் தமிழ் ஒலிபெயர்ப்பு.
- source_word: שְׁכַנְיָה
  choice: செக்கனியா
  rationale: தனிப்பட்ட பெயரின் தமிழ் ஒலிபெயர்ப்பு.
theological_decisions:
- issue: மீண்டும் மீண்டும் வரும் ‘மகன்கள்’ என்பதன் தலைமுறைப் பொருள்
  choice: ‘மகன்கள்’ என்ற நேரடி வம்சவழிச் சொல்லை வைத்திருத்தல்
  alternative: ‘வழித்தோன்றல்கள்’ என்று விரிவாக மொழிபெயர்த்தல்
  rationale: உடனடி மகன்களா அல்லது விரிந்த வழித்தோன்றல்களா என்பதை மூல இலக்கணம் உறுதியாகத் தீர்மானிக்கவில்லை; எனவே அந்தத் தெளிவின்மை அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீன, கண்ணியமான பொதுத்தமிழ் நடை பயன்படுத்தப்பட்டுள்ளது. வம்சப் பட்டியலின் மீளும் அமைப்பு காக்கப்பட்டு, மூலத்தின் ஒருமை–பன்மைச் சிக்கலும் தலைமுறைத் தெளிவின்மையும் அடிக்குறிப்பில் வெளிப்படையாகக் குறிப்பிடப்பட்டுள்ளன.
