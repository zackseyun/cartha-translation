    issue: The main text reverses the Hebrew genealogical order.
    rationale: “அவனுடைய மகன் அமத்சியா” means “Amaziah, his son” relative to an antecedent, whereas the source first names Amaziah and then identifies him as “his son.” Repeating this reversal produces a different lineage linkage.
  - severity: low
    issue: The footnote uses the less standard spelling “எபிரெய.”
    rationale: “எபிரேய உரை” is the conventional modern Tamil designation and improves polish without changing meaning.
  revised_text: அமத்சியா, அவனுடைய மகன்; அசரியா[a], அவனுடைய மகன்; யோதாம், அவனுடைய மகன்.
