id: 1CH.3.12
reference: 1 Chronicles 3:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: אֲמַצְיָ֧הוּ בְנ֛/וֹ עֲזַרְיָ֥ה בְנ֖/וֹ יוֹתָ֥ם בְּנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/012.yaml
  text: Amaziah his son[a], Azariah his son, Jotham his son.
translation:
  language: ta
  text: அமத்சியா, அவனுடைய மகன்; அசரியா[a], அவனுடைய மகன்; யோதாம், அவனுடைய மகன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேய உரையில் இங்கு “அசரியா” என்று உள்ளது; இந்த அரசன் மற்ற இடங்களில் “உசியா” என்றும் அழைக்கப்படுகிறார்.
    reason: மூலத்தில் உள்ள அசரியா என்ற பெயரைப் பாதுகாத்தபடியே, இதே அரசனுக்கான வேறு பெயரை விளக்குகிறது.
lexical_decisions:
- source_word: אֲמַצְיָהוּ
  choice: அமத்சியா
  rationale: தனிப்பட்ட பெயரைத் தமிழில் வழக்கமான வேதாகம ஒலிபெயர்ப்பு வடிவில் வழங்குகிறது.
- source_word: בְנוֹ
  choice: அவனுடைய மகன்
  rationale: בֵּן என்பதுடன் மூன்றாம் நபர் ஆண்பால் ஒருமை உடைமைப் பின்னொட்டு சேர்ந்துள்ளதால், நேரடியான உறவுமுறையான ‘அவனுடைய மகன்’ என்று மொழிபெயர்க்கப்பட்டது. வம்சப்பட்டியல்கள் சில நேரங்களில் தலைமுறைகளைச் சுருக்கினாலும், இங்கு ‘வழித்தோன்றல்’ என்று பொதுமைப்படுத்தத் தேவையில்லை.
- source_word: עֲזַרְיָה
  choice: அசரியா
  rationale: மூல எபிரெய வடிவையே ஒலிபெயர்க்கிறது; வேறு இடங்களில் காணப்படும் ‘உசியா’ என்ற மாற்றுப் பெயரால் இவ்வசனத்தை ஒத்திசைக்கவில்லை.
- source_word: יוֹתָם
  choice: யோதாம்
  rationale: தனிப்பட்ட பெயரைத் தமிழில் நிலைபெற்றுள்ள ஒலிபெயர்ப்பு வடிவில் வழங்குகிறது.
theological_decisions:
- issue: அரச வம்சப்பட்டியலில் வரும் மகன் என்ற உறவுமுறைச் சொல்
  choice: மூன்று இடங்களிலும் ‘அவனுடைய மகன்’ என்று வைத்தல்
  alternative: ‘அவனுடைய வழித்தோன்றல்’ என்று மொழிபெயர்த்தல்
  rationale: எபிரெய உரை בְנוֹ (‘அவனுடைய மகன்’) என்பதை வெளிப்படையாகத் திரும்பத் திரும்பப் பயன்படுத்துகிறது. தலைமுறைகள் விடுபட்டிருக்கக்கூடும் என்ற பொதுவான சாத்தியத்தை உரைக்குள் சேர்க்காமல், மூலத்தின் உறவுமுறைச் சொல்லைத் தக்கவைக்கிறது.
- issue: அசரியா/உசியா என்ற அரசப் பெயர் வேறுபாடு
  choice: மூல உரையில் உள்ள ‘அசரியா’ என்பதை முதன்மை உரையில் வைத்தல்
  alternative: வேறு இடங்களுடன் ஒத்திசைத்து ‘உசியா’ என்று வழங்குதல்
  rationale: இவ்வசனத்தின் எபிரெய வாசகம் עֲזַרְיָה என்று உள்ளது. ‘உசியா’ என்பது இதே அரசனுக்கான வேறொரு பெயர் என்பதை அடிக்குறிப்பில் தெரிவிப்பது, மூல வாசகத்தையும் பெயர் அடையாளத்தையும் இரண்டையும் வெளிப்படையாகப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், வம்சப்பட்டியலுக்கேற்ற சுருக்கமான மற்றும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. தமிழில் உறவுமுறை தெளிவாக அமைய, எபிரெய வரிசையின் பொருளைத் தக்கவைத்து ‘அவனுடைய மகன் + பெயர்’ என்ற இயல்பான சொல் வரிசை தேர்ந்தெடுக்கப்பட்டது. முதல் ‘அவன்’ முந்தைய வசனத்தில் குறிப்பிடப்பட்ட அரசனைச் சுட்டுகிறது.
