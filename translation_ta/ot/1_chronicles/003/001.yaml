source:
  edition: WLC
  text: וְ/אֵ֤לֶּה הָיוּ֙ בְּנֵ֣י דָויִ֔ד אֲשֶׁ֥ר נֽוֹלַד ל֖/וֹ בְּ/חֶבְר֑וֹן הַ/בְּכ֣וֹר אַמְנֹ֗ן לַ/אֲחִינֹ֨עַם֙ הַ/יִּזְרְעֵאלִ֔ית שֵׁנִי֙ דָּנִיֵּ֔אל לַ/אֲבִיגַ֖יִל הַֽ/כַּרְמְלִֽית־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/001.yaml
  text: 'These were David’s sons who were born to him in Hebron: the firstborn[a], Amnon, by Ahinoam the Jezreelite; the second, Daniel, by Abigail the Carmelite.'
translation:
  language: ta
  text: 'எப்ரோனில் தாவீதுக்குப் பிறந்த மகன்கள் இவர்களே: முதற்பேறான[a] அம்னோன், யெஸ்ரயேலைச் சேர்ந்த அகினோவாமுக்குப் பிறந்தவன்; இரண்டாவது தானியேல், கர்மேலைச் சேர்ந்த அபிகாயிலுக்குப் பிறந்தவன்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதற்கு இணையான 2 சாமுவேல் 3:3 பட்டியலில், இந்த மகன் தானியேல் என்பதற்குப் பதிலாக கிலேயாப் என்று அழைக்கப்படுகிறார்.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֵלֶּה הָיוּ
  choice: இவர்களே
  rationale: வம்சவரலாற்றின் புதிய பட்டியலை இயல்பாக அறிமுகப்படுத்துகிறது; וְ என்பதன் தொடர்ச்சித் தன்மையைத் தமிழில் தேவையற்ற ‘மேலும்’ என வலுக்கட்டாயமாக வெளிப்படுத்தாமல், demonstrative force-ஐக் காக்கிறது.
- source_word: בְּנֵי דָוִיד
  choice: தாவீதின் மகன்கள்
  rationale: ஆண் சந்ததியினரைக் குறிக்கும் எபிரெயக் கட்டமைப்பின் பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: אֲשֶׁר נוֹלַד לוֹ
  choice: தாவீதுக்குப் பிறந்த
  rationale: நפעל passive வடிவத்தையும் לוֹ என்ற தொடர்பையும் தமிழில் இயல்பான பிறப்பு மரபுத்தொடராகக் காக்கிறது.
- source_word: בְּחֶבְרוֹן
  choice: எப்ரோனில்
  rationale: நகரப்பெயருடன் வரும் இடவியல் בְ-ஐ நேரடியாக வெளிப்படுத்துகிறது.
- source_word: הַבְּכוֹר
  choice: மூத்தவன்
  rationale: பட்டியலில் முதல் மகனின் பிறப்பு வரிசையையும் முதற்பேறு நிலையின் கருத்தையும் வாசிக்க எளிய நவீன தமிழில் தெரிவிக்கிறது.
- source_word: לַאֲחִינֹעַם הַיִּזְרְעֵאלִית
  choice: யெஸ்ரயேலைச் சேர்ந்த அகினோவாமுக்குப் பிறந்த
  rationale: לְ இங்கு தாய்வழித் தொடர்பைக் குறிக்கிறது; பெண்பால் குடிப்பெயரைத் தமிழில் இயல்பாக ‘யெஸ்ரயேலைச் சேர்ந்த’ என்று தருகிறது.
- source_word: שֵׁנִי דָּנִיֵּאל
  choice: இரண்டாவது, தானியேல்
  rationale: வரிசை எண்ணையும் நாளாகம நூலின் மசோரா உரையில் உள்ள தனிப்பெயரையும் அப்படியே காக்கிறது.
- source_word: לַאֲבִיגַיִל הַכַּרְמְלִית
  choice: கர்மேலைச் சேர்ந்த அபிகாயிலுக்குப் பிறந்த
  rationale: தாய்வழித் தொடர்பையும் கர்மேல் ஊர்ச் சார்பையும் தெளிவான நவீன தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: இணையான பட்டியலில் இரண்டாவது மகனின் பெயர் வேறுபடுதல்
  choice: மசோரா உரையிலுள்ள ‘தானியேல்’ என்பதை முதன்மை உரையில் வைத்தல்
  alternative: 2 சாமுவேல் 3:3-இன்படி ‘கிலேயாப்’ என மாற்றுதல்
  rationale: இந்த வசனத்தின் எபிரெய மூல உரை דָּנִיֵּאל என்று தெளிவாக வாசிக்கிறது. இணை வசனத்தின் வேறுபாட்டை உரைக்குள் ஒற்றுமைப்படுத்தாமல் அடிக்குறிப்பில் பதிவு செய்வது உரைச் சான்றையும் உண்மையான வேறுபாட்டையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், வம்சவரலாற்றுக்கேற்ற சுருக்கமானதும் கண்ணியமானதும் ஆன நடை பயன்படுத்தப்பட்டுள்ளது. தாய்மார்களின் ஊர்ச் சார்பு ‘—ஐச் சேர்ந்த’ என்று இயல்பாகத் தரப்பட்டுள்ளது; பெயர் வேறுபாடு தீர்க்கப்படாமல் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
