  source_fidelity: மூல எபிரெயத்தின் பட்டியல் அமைப்பு, வரிசை எண்கள், அப்சலோம் மற்றும் அதோனியாவின் தாய்வழி அடையாளங்கள், மாக்காள் தல்மாயின் மகள் என்பதும், தல்மாய் கெசூரின் அரசன் என்பதும் துல்லியமாகக் காக்கப்பட்டுள்ளன. ‘மகன்’ மற்றும் ‘பிறந்த’ என்பவை முந்தைய வசனத்திலிருந்து தொடரும் வம்சப்பட்டியல் சூழலில் இயல்பான, பொருளை மாற்றாத நிரப்பல்கள்.
  naturalness: நவீனத் தரத் தமிழில் வாசகம் தெளிவாகவும் வம்சப்பட்டியலுக்கேற்ற சுருக்கத்துடனும் உள்ளது. ‘மாக்காளுக்குப் பிறந்த’ மற்றும் ‘ஆகித்துக்குப் பிறந்த’ என்ற அமைப்புகள் இயல்பானவை.
  terminology: 'பெயரொலிபெயர்ப்புகள் சீராக உள்ளன: அப்சலோம், மாக்காள், தல்மாய், கெசூர், அதோனியா, ஆகித்து. ‘கெசூரின் அரசன்’ மூலத்தின் மֶלֶךְ־גְּשׁוּר உறவைச் சரியாகத் தருகிறது. அடிக்குறிப்பு ‘மகள்’ என்பதற்கான சாத்தியமான விரிவான வம்சாவளிப் பயன்பாட்டைத் தகுந்த எச்சரிக்கையுடன் வழங்குகிறது.'
