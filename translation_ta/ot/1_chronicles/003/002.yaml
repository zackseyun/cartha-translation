base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/002.yaml
  text: the third[a], Absalom son of Maacah, daughter of Talmai king of Geshur; the fourth, Adonijah son of Haggith.
translation:
  language: ta
  text: மூன்றாவது மகன், கெசூரின் அரசன் தல்மாயின் மகளான மாக்காளுக்குப் பிறந்த அப்சலோம்[a]; நான்காவது மகன், ஆகித்துக்குப் பிறந்த அதோனியா.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தல்மாயின் பெண் வழித்தோன்றலான மாக்காள்.” வம்சாவளிச் சூழல்களில் “மகள்” என்பது சில நேரங்களில் பிற்காலப் பெண் வழித்தோன்றலையும் குறிக்கலாம்; எனினும், இங்குள்ள எபிரெய வாசகத்தின் மிக நேரடியான பொருள் “கெசூரின் அரசன் தல்மாயின் மகள்” என்பதே.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְּׁלִישִׁי
  choice: மூன்றாவது மகன்
  rationale: முந்தைய வசனத்திலிருந்து தொடரும் தாவீதின் மகன்களுடைய பட்டியலில் இது வரிசை எண்ணாக உள்ளது; தமிழில் சூழலைத் தெளிவாக்க ‘மகன்’ இயல்பாகச் சேர்க்கப்பட்டது.
- source_word: לְאַבְשָׁלוֹם
  choice: அப்சலோம்
  rationale: ஆள்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டது; לְ இங்கு பட்டியலில் தொடர்பைக் குறிக்கிறது.
- source_word: בֶּן מַעֲכָה
  choice: மாக்காளுக்குப் பிறந்த
  rationale: வம்சப்பட்டியல் உறவைக் குறிக்கும் בֶּן என்பதையும் தாயின் பெயரையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘மாக்காளின் மகன்’ என்பதும் சாத்தியம்.
- source_word: בַּת תַּלְמַי
  choice: தல்மாயின் மகளான
  rationale: בַּת என்பதன் நேரடியான பொருள் ‘மகள்’; விரிவான வம்சாவளிப் பொருள் சாத்தியமாதலால் அடிக்குறிப்பில் குறிப்பிடப்பட்டது.
- source_word: מֶלֶךְ גְּשׁוּר
  choice: கெசூரின் அரசன்
  rationale: தல்மாயின் அரச பதவியையும் அவர் ஆண்ட இடத்தையும் குறிக்கும் எபிரெய இணைப்பை இயல்பான தமிழில் தருகிறது.
- source_word: הָרְבִיעִי
  choice: நான்காவது மகன்
  rationale: பட்டியலின் அடுத்த வரிசை எண்ணைத் தெளிவாகக் காட்டுகிறது; தமிழில் சூழலுக்காக ‘மகன்’ சேர்க்கப்பட்டது.
- source_word: אֲדֹנִיָּה
  choice: அதோனியா
  rationale: ஆள்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: בֶן חַגִּית
  choice: ஆகித்துக்குப் பிறந்த
  rationale: தாய்–மகன் உறவை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
