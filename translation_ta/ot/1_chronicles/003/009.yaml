base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/009.yaml
  text: All these were David’s sons[a], besides the sons of the concubines; and Tamar was their sister.
translation:
  language: ta
  text: இவர்கள் அனைவரும் தாவீதின் மகன்கள், துணைமனைவியரின் மகன்களைத் தவிர[a]; தாமார் இவர்களுடைய சகோதரி.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “துணைமனைவியரின் மகன்களுக்கு அப்பாலும்.” எபிரெயச் சொற்றொடர், அந்த மகன்களை முந்தைய பட்டியலிலிருந்து விலக்குவதாகவோ, முக்கியப் பட்டியலுக்கு வெளியே கூடுதலாகக் குறிப்பிடுவதாகவோ புரிந்துகொள்ளப்படலாம்.
    reason: மִלְּבַד என்பதன் விலக்கு அல்லது கூடுதல் என்ற இரு சாத்தியமான பொருள்களையும் பாதுகாக்கிறது.
lexical_decisions:
- source_word: כֹּל בְּנֵי דָוִיד
  choice: இவர்கள் அனைவரும் தாவீதின் மகன்கள்
  rationale: כֹּל முன்னர் பட்டியலிடப்பட்டவர்களைத் தொகுத்துக் குறிப்பிடுகிறது; בְּנֵי ஆண்பால் பன்மை என்பதால் ‘மகன்கள்’ எனத் துல்லியமாக மொழிபெயர்க்கப்பட்டது.
- source_word: מִלְּבַד
  choice: இவர்களில் சேர்க்கப்படவில்லை
  rationale: இந்தச் சூழலில், மறுமனைவிகளின் மகன்கள் முன் கூறப்பட்ட பட்டியலுக்கு வெளியே இருப்பதை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; சேர்த்துக் கூறுதல் என்ற பொருளும் சாத்தியமாதலால் அடிக்குறிப்பில் அது பாதுகாக்கப்பட்டுள்ளது.
- source_word: בְּנֵי פִילַגְשִׁים
  choice: மறுமனைவிகளின் மகன்கள்
  rationale: பண்டைய அரச குடும்பத்தில் முழு மனைவி நிலையில்லாத துணைவியரைக் குறிக்கும் פִילֶגֶשׁ என்பதற்கு, சாதாரண வாசகருக்குப் புரியக்கூடியதும் சமூக நிலை வேறுபாட்டைக் காட்டுவதுமான ‘மறுமனைவி’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: וְתָמָר אֲחוֹתָם
  choice: தாமார் இவர்களுடைய சகோதரி
  rationale: எபிரெய உரையில் வினைச்சொல் இல்லாத அடையாள வாக்கியத்தைத் தமிழில் இயல்பாக அப்படியே வழங்க முடிகிறது; אֲחוֹתָם உறவுமுறையைத் தெளிவாகக் காட்டுகிறது.
