translation_notes:
  register: நவீன செந்தமிழ் நடையில், வம்சவரலாற்றுச் சுருக்கத்திற்கேற்ற கண்ணியமும் தெளிவும் பேணப்பட்டுள்ளன. ‘மறுமனைவி’ என்பது பண்டைய פִילֶגֶשׁ என்ற சமூகப் பிரிவின் எல்லா சட்ட மற்றும் சமூக நுணுக்கங்களையும் முழுமையாகச் சொல்லாதபோதும், ‘வைப்பாட்டி’ போன்ற இழிவுத்தொனி ஏற்படுத்தக்கூடிய சொல்லைத் தவிர்த்து வாசிப்புத் தெளிவை அளிக்கிறது.
