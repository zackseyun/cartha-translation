translation:
  language: ta
  text: யோராம், அவனுடைய மகன்[a]; அகசியா, அவனுடைய மகன்; யோவாஸ், அவனுடைய மகன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மகன்’ என்பதற்கான எபிரேயச் சொல் வம்சப்பட்டியல்களில் சில நேரங்களில் பிற்கால வழித்தோன்றலையும் குறிக்கலாம். ஆனால் இங்கு அரச மரபின் சுருக்கமான தொடர்வரிசை தரப்படுவதால் ‘மகன்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹרָם
  choice: யோராம்
  rationale: எபிரேயப் பெயரின் ஒலிப்பை நவீனத் தமிழ் எழுத்தில் இயல்பாகப் பிரதிபலிக்கிறது.
- source_word: בְּנוֹ
  choice: அவனுடைய மகன்
  rationale: בֵּן என்ற பெயர்ச்சொல்லும் மூன்றாம் நபர் ஆண்பால் ஒருமை உடைமைப் பின்னொட்டும் நேரடியாக ‘அவனுடைய மகன்’ என்று பொருள்படும். வம்சப்பட்டியல்களில் இது சில நேரங்களில் பிற்கால வழித்தோன்றலையும் குறிக்கலாம்; இங்கு அரச மரபின் சுருக்கமான தொடர்வரிசை என்பதால் நேரடிப் பொருள் தக்கவைக்கப்படுகிறது.
- source_word: אֲחַזְיָהוּ
  choice: அகசியா
  rationale: எபிரேயப் பெயரின் ஒலிப்பைத் தமிழில் தெளிவாகவும் வழக்கமான வேதாகமப் பெயர் வடிவத்துக்கு ஏற்றவாறும் தருகிறது.
- source_word: יוֹאָשׁ
  choice: யோவாஸ்
  rationale: எபிரேயப் பெயரின் ஒலிப்பைத் தமிழில் இயல்பாகப் பிரதிபலிக்கிறது.
