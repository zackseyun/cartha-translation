translation_notes:
  register: நவீன பொதுத்தமிழில் சுருக்கமான வம்சவரலாற்றுப் பட்டியல் நடை பயன்படுத்தப்பட்டுள்ளது. பெயர்கள் மொழிபெயர்க்கப்படாமல் எபிரெய ஒலிக்கு அண்மையாக எழுத்துப்பெயர்க்கப்பட்டுள்ளன; ‘மொத்தம் ஒன்பது பேர்’ என்பது தனித்து நிற்கும் எபிரெய எண்ணின் சூழல்சார் பொருளை இயல்பாகத் தெரிவிக்கிறது.
