lexical_decisions:
- source_word: אֱלִישָׁמָע
  choice: எலிஷாமா
  rationale: எபிரெயத் தனிப்பட்ட பெயர்; அதன் ஒலிவடிவத்தை நவீனத் தமிழுக்கு இயல்பாக எழுத்துப்பெயர்த்துள்ளது.
- source_word: אֶלְיָדָע
  choice: எலியாதா
  rationale: எபிரெயத் தனிப்பட்ட பெயர்; יָדָע கூறின் ஒலியைப் பிரதிபலிக்கும் வகையில் எழுத்துப்பெயர்க்கப்பட்டுள்ளது.
- source_word: אֱלִיפֶלֶט
  choice: எலிப்பெலேத்
  rationale: இவ்வசனத்திலுள்ள முழுமையான எபிரெய வடிவத்தைப் பிரதிபலிக்கும் எழுத்துப்பெயர்ப்பு; இரட்டைப் பகர மெய் தமிழில் உச்சரிப்பைத் தெளிவாக்குகிறது.
- source_word: וְ / וֶ
  choice: பட்டியல் நிறுத்தக்குறிகள்
  rationale: ஒவ்வொரு பெயருக்கும் முன் வரும் இணைப்பிடைச்சொல்லைத் தமிழில் மீண்டும் மீண்டும் ‘மற்றும்’ என்று கூறாமல், இயல்பான பட்டியல் அமைப்பால் வெளிப்படுத்துகிறது.
- source_word: תִּשְׁעָה
  choice: மொத்தம் ஒன்பது பேர்
  rationale: சொற்பொருள் ‘ஒன்பது’; சூழலில் 5–8ஆம் வசனங்களில் பட்டியலிடப்பட்ட மகன்களின் முடிவுத் தொகையைக் குறிப்பதால், தமிழில் அதன் சுருக்கப் பங்கைத் தெளிவுபடுத்த ‘மொத்தம்’ என்றும் நபர்களைக் குறிக்க ‘பேர்’ என்றும் சேர்க்கப்பட்டுள்ளது.
