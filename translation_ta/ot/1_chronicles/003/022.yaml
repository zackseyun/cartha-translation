  register: நவீன பொதுத்தமிழில் சுருக்கமான, கண்ணியமான வம்சப் பட்டியல் நடையைப் பயன்படுத்துகிறது. எபிரெய வாக்கிய அமைப்பின் இரு பகுதிகளும் தெளிவாகத் தக்கவைக்கப்பட்டுள்ளன; மூல உரையிலுள்ள ஐந்து பெயர்கள்/ஆறு பேர் என்ற முரண்பாடு அடிக்குறிப்புடன் பாதுகாக்கப்பட்டுள்ளது.
