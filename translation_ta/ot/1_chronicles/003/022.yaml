base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/022.yaml
  text: 'And the sons of Shecaniah: Shemaiah. And the sons of Shemaiah: Hattush[a], Igal, Bariah, Neariah, and Shaphat—six.'
translation:
  language: ta
  text: 'செக்கனியாவின் மகன்கள்: செமாயா. செமாயாவின் மகன்கள்: ஹத்தூஷ்[a], இகால், பாரியாக், நெயரியா, சாப்பாத்—ஆறு பேர்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மசோரெட்டிக் எபிரெய உரையில் இங்கே ஐந்து பெயர்கள் மட்டுமே பட்டியலிடப்பட்டுள்ளன; ஆனாலும் எண்ணிக்கை ‘ஆறு பேர்’ என்று உள்ளது. இது உரைப் பரம்பரையில் ஏற்பட்ட சிக்கலையோ, ஒரு பெயர் விடுபட்டதையோ பிரதிபலிக்கலாம்.
    reason: textual_variant
lexical_decisions:
- source_word: וּבְנֵי
  choice: மகன்கள்
  rationale: בְנֵי என்பதன் நேரடிப் பொருள் ‘மகன்கள்’. இங்கு வம்சப் பட்டியல் சூத்திரத்தில் பெயர்கள் உடனடியாகத் தரப்படுவதால், விரிவான ‘வழித்தோன்றல்கள்’ என்பதற்குப் பதிலாக ‘மகன்கள்’ பொருத்தமானது.
- source_word: שְׁכַנְיָה
  choice: செக்கனியா
  rationale: எபிரெய தனிப்பெயரின் ஒலிபெயர்ப்பு; தமிழில் இயல்பாக வாசிக்கத்தக்க வடிவம்.
- source_word: שְׁמַעְיָה
  choice: செமாயா
  rationale: எபிரெய தனிப்பெயரைத் தமிழில் ஒலிபெயர்த்த வடிவம்.
- source_word: חַטּוּשׁ
  choice: அத்தூஷ்
  rationale: எபிரெய பெயரின் ஒலியைத் தமிழில் நெருக்கமாகக் காட்டும் வடிவம்.
- source_word: יִגְאָל
  choice: இகால்
  rationale: எபிரெய தனிப்பெயரின் ஒலிபெயர்ப்பு; தொடக்க யோத் இங்கு தமிழில் ‘இ’ ஒலியால் வழங்கப்படுகிறது.
- source_word: בָרִיחַ
  choice: பாரியாக்
  rationale: மசோரெட்டிக் உரையின் בָרִיחַ வடிவத்தைப் பின்பற்றும் ஒலிபெயர்ப்பு; அதிகம் பரிச்சயமான வேறொரு பெயர் வடிவத்தை உரைக்குள் கொண்டு வரவில்லை. இறுதி ח மென்மையான தொண்டையொலியைத் தமிழில் ‘க்’ மூலம் தோராயமாகக் குறிக்கிறது.
- source_word: נְעַרְיָה
  choice: நெயரியா
  rationale: எபிரெய தனிப்பெயரின் ஒலிபெயர்ப்பு; உயிரெழுத்துத் தொடரை தமிழில் வாசிக்க ஏற்றவாறு வழங்குகிறது.
- source_word: שָׁפָט
  choice: சாப்பாத்
  rationale: எபிரெய தனிப்பெயரின் ஒலிபெயர்ப்பு.
- source_word: שִׁשָּׁה
  choice: ஆறு பேர்
  rationale: மூலத்தில் உள்ள எண்ணை மாற்றாமல் தருகிறது; பட்டியலில் ஐந்து பெயர்கள் மட்டுமே இருந்தாலும் உரையை அமைதியாக ஒத்திசைக்கவில்லை. மனிதர்களைக் குறிக்கும் இயல்பான தமிழுக்காக ‘பேர்’ சேர்க்கப்பட்டது.
