lexical_decisions:
- source_word: מַלְכִּירָם
  choice: மல்கிராம்
  rationale: வம்சவரலாற்றில் வரும் எபிரேய ஆட்பெயர்; அதன் மெய்யெழுத்துகளையும் உயிரொலிகளையும் இயன்றவரை நெருக்கமாகக் காட்டும் வகையில் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: פְדָיָה
  choice: பெதாயா
  rationale: எபிரேய ஆட்பெயர்; இறுதியிலுள்ள யָה கூறும் உட்பட மூல உச்சரிப்பை அணுகும் வகையில் ஒலிபெயர்க்கப்பட்டது.
- source_word: שֶׁנְאַצַּר
  choice: செனாச்சார்
  rationale: ஆட்பெயர்; சுட்டப்பட்ட இரட்டித்த צ ஒலியைத் தமிழில் இயல்பாகப் பிரதிபலிக்க ‘ச்சா’ பயன்படுத்தப்பட்டது.
- source_word: יְקַמְיָה
  choice: எக்கமியா
  rationale: ஆட்பெயர்; தொடக்க யோத் இங்கு மெய்யெழுத்தாக அல்லாமல் குறுஉயிரைத் தாங்கும் விதத்தில் ஒலிப்பதால் ‘எ’ எனவும், வலியுறும் ק ஒலியை ‘க்க’ எனவும் ஒலிபெயர்க்கப்பட்டது.
- source_word: הוֹשָׁמָע
  choice: ஓசாமா
  rationale: ஆட்பெயர்; எபிரேயத்தின் ஓ-ஷா-மா ஒலிவடிவத்தை நெருங்கி, தமிழில் தனியான /h/ அல்லது /ʃ/ எழுத்து இல்லாததால் இயல்பான தமிழ் ஒலிவடிவம் தேர்ந்தெடுக்கப்பட்டது.
- source_word: נְדַבְיָה
  choice: நெதபியா
  rationale: எபிரேய ஆட்பெயர்; மூல ஒலியமைப்பையும் இறுதி யָה கூறையும் நெருங்கும் தமிழ் ஒலிபெயர்ப்பு.
- source_word: וּ / וְ
  choice: பட்டியலில் காற்புள்ளிகள்
  rationale: பெயர்களை இணைக்கும் எபிரேய முன்னொட்டு வாவ் ஒவ்வொரு பெயருக்கும் முன் வருகிறது; இயல்பான தமிழ் வம்சவரலாற்றுப் பட்டியலில் இதை மீண்டும் மீண்டும் ‘மற்றும்’ என்று மொழிபெயர்க்காமல் காற்புள்ளிகளால் காட்டுவது பொருளையும் பட்டியல் அமைப்பையும் காக்கிறது.
