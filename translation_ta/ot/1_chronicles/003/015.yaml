base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/015.yaml
  text: 'And the sons of Josiah: the firstborn[a], Johanan; the second, Jehoiakim; the third, Zedekiah; the fourth, Shallum.'
translation:
  language: ta
  text: 'யோசியாவின் மகன்கள்: முதற்பேறானவன்[a] யோகனான்; இரண்டாவது யோயாக்கீம்; மூன்றாவது சிதேக்கியா; நான்காவது சல்லூம்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சல்லூம் என்பவர் 2 இராஜாக்கள் 23:30–34 மற்றும் எரேமியா 22:11 ஆகிய இடங்களில் வரும் யோவாகாசுடன் பொதுவாக அடையாளப்படுத்தப்படுகிறார்; ஆனால் இங்கு நாளாகம ஆசிரியர் யோசியாவின் வம்சவரலாற்றில் “சல்லூம்” என்ற பெயரையே பதிவு செய்கிறார்.
    reason: cross_reference
lexical_decisions:
- source_word: וּבְנֵי
  choice: மகன்கள்
  rationale: בְנֵי என்பதன் நேரடியான வம்சவரலாற்றுப் பொருள் ‘மகன்கள்’. தொடக்க ו பட்டியலின் தொடர்ச்சியைக் குறித்தாலும், இயல்பான நவீனத் தமிழில் இவ்வசனத் தொடக்கத்தில் தனியே ‘மேலும்’ சேர்க்காமல் தொடர்ச்சியைப் பேணலாம்.
- source_word: יֹאשִׁיָּהוּ
  choice: யோசியா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் பெயர் வடிவம்.
- source_word: הַבְּכוֹר
  choice: முதற்பேறானவன்
  rationale: பிறப்பு வரிசையையும் முதற்பேறு நிலையையும் குறிக்கும் בכור என்பதற்கான துல்லியமான, இயல்பான தமிழ் வடிவம்.
- source_word: יוֹחָנָן
  choice: யோகனான்
  rationale: எபிரெயப் பெயரின் ஒலிப்பைத் தமிழில் தெளிவாகப் பிரதிபலிக்கும் வடிவம்.
- source_word: הַשֵּׁנִי
  choice: இரண்டாவது
  rationale: பட்டியலிலுள்ள வரிசை எண்ணை நேரடியாகக் காட்டுகிறது.
- source_word: יְהוֹיָקִים
  choice: யோயாக்கீம்
  rationale: இங்கு உள்ள எபிரெயப் பெயர் யெகோயாக்கீம்; எலியாக்கீம் அல்ல. தமிழ் மரபில் அறியப்படும் வடிவம் பயன்படுத்தப்பட்டது.
- source_word: הַשְּׁלִשִׁי
  choice: மூன்றாவது
  rationale: பட்டியலிலுள்ள வரிசை எண்ணை நேரடியாகக் காட்டுகிறது.
- source_word: צִדְקִיָּהוּ
  choice: சிதேக்கியா
  rationale: எபிரெய அரசப் பெயருக்கான பரவலாக அறியப்படும் தமிழ் வடிவம்.
- source_word: הָרְבִיעִי
  choice: நான்காவது
  rationale: பட்டியலிலுள்ள வரிசை எண்ணை நேரடியாகக் காட்டுகிறது.
- source_word: שַׁלּוּם
  choice: சல்லூம்
  rationale: மூல உரையில் உள்ள தனிப்பெயரை மொழிபெயர்க்காமல் தமிழில் ஒலிபெயர்த்துள்ளது.
theological_decisions:
- issue: வம்சவரலாற்றுப் பிறப்பு வரிசையும் அரசாட்சி ஏற்ற வரிசையும்
  choice: எபிரெய உரையில் ஒவ்வொரு மகனுக்கும் கொடுக்கப்பட்டுள்ள வரிசைப் பெயர்களை அப்படியே வைத்து, யோசியாவின் மகன்களுடைய பட்டியலாக மொழிபெயர்த்தல்.
  alternative: யோசியாவுக்குப் பின் ஆட்சி செய்த அரசர்களின் வரிசைக்கு ஏற்ப பெயர்களை மாற்றியமைத்தல் அல்லது முதன்மை உரையிலேயே ஒத்திசைத்தல்.
  rationale: வசனம் பிறப்பு அல்லது குடும்ப வரிசைக் குறியீடுகளுடன் ஒரு வம்சவரலாற்றுப் பட்டியலைத் தருகிறது. அரசாட்சி வரலாற்றுடன் தோன்றும் பதற்றத்தை முதன்மை உரையை மாற்றித் தீர்க்காமல், அடிக்குறிப்பில் குறிப்பிடுவது மூலத்துக்கு உண்மையானது.
translation_notes:
  register: நவீன நிலையான தமிழில், சுருக்கமான வம்சவரலாற்றுப் பட்டியல் நடையில் வடிவமைக்கப்பட்டது. பெயர்களுக்கு தமிழ் வேதாகம வாசகர்களுக்கு பரிச்சயமான வடிவங்கள் தேர்ந்தெடுக்கப்பட்டன; நிறுத்தக்குறிகள் பெயர்–வரிசை அமைப்பைத் தெளிவாக்குகின்றன.
