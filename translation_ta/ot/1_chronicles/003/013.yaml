  text: Ahaz his son[a], Hezekiah his son, Manasseh his son.
translation:
  language: ta
  text: ஆகாசின் மகன்[a] எசேக்கியா; எசேக்கியாவின் மகன் மனாசே; மனாசேயின் மகன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: வம்சவரிசைகளில் எபிரெய மொழியின் ‘மகன்’ என்ற சொல் சில இடங்களில் வழித்தோன்றலையும் குறிக்கலாம்; ஆனால் இங்கு மூலஉரை வழக்கமான ‘அவனுடைய மகன்’ என்ற சொல்லமைப்பையே பயன்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָחָז
  choice: ஆகாஸ்
  rationale: எபிரெய தனிப்பெயரான אָחָז என்பதற்கு தமிழில் பரவலாக அறியப்படும் வேதாகமப் பெயர்வடிவம் பயன்படுத்தப்பட்டது; உரையில் உருபேற்று ‘ஆகாசின்’ என வருகிறது.
- source_word: בְּנוֹ
  choice: மகன்
  rationale: בן என்ற சொல்லுடன் மூன்றாம் நபர் ஆண்பால் ஒருமை உடைமை விகுதி சேர்ந்துள்ளதால் நேரடிப் பொருள் ‘அவனுடைய மகன்.’ இயல்பான தமிழில் முன்னுள்ள பெயருடன் ஆறாம் வேற்றுமைத் தொகையாக மொழிபெயர்க்கப்பட்டது.
- source_word: חִזְקִיָּהוּ
  choice: எசேக்கியா
  rationale: தமிழ் வாசகர்களிடையே நிலைபெற்ற, மூலப்பெயரை அடையாளப்படுத்தக்கூடிய வேதாகமப் பெயர்வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- source_word: בְנוֹ
  choice: மகன்
  rationale: மீண்டும் வரும் வம்சவரிசைச் சூத்திரத்தைத் தெளிவாகவும் ஒரே மாதிரியாகவும் காட்ட ‘மகன்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: מְנַשֶּׁה
  choice: மனாசே
  rationale: எபிரெய தனிப்பெயருக்கு தமிழில் வழக்கிலுள்ள வேதாகமப் பெயர்வடிவம் பயன்படுத்தப்பட்டது.
- source_word: בְנוֹ
  choice: மகன்
  rationale: மூலத்தில் மூன்றாவது முறையாக வரும் அதே வம்சவரிசைச் சொல்லமைப்பு தமிழிலும் ‘மகன்’ எனத் தொடர்ந்து காக்கப்பட்டது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில் சுருக்கமான வம்சவரிசை நடையும், மூலத்தின் மீளும் அமைப்பும் காக்கப்பட்டுள்ளன. ‘அவனுடைய மகன்’ என்பதை ஒவ்வொரு முறையும் பயன்படுத்தாமல், இயல்பான தமிழுக்கேற்ற பெயர் சார்ந்த உடைமைத் தொடராக அமைக்கப்பட்டுள்ளது.
