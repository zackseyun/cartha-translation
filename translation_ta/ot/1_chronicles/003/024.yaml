base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/024.yaml
  text: 'And the sons of Elyoenai: Hodaviah[a], Eliashib, Pelaiah, Akkub, Johanan, Delaiah, and Anani—seven.'
translation:
  language: ta
  text: 'எல்யோயேனாயின் மகன்கள்: ஹோதவியா[a], எலியாஷீப், பெலாயா, அக்கூப், யோகானான், தெலாயா, அனானி—மொத்தம் ஏழு பேர்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு முதல் பெயரின் எபிரெய எழுத்துவடிவு வழக்கத்திற்கு மாறானது. “ஹோதவியா” என்பது மிகச் சாத்தியமான மரபுவழி அடையாளத்தைப் பின்பற்றுகிறது; “ஹோதியா” அல்லது எபிரெய எழுத்தொலிக்கு இன்னும் நெருக்கமான “ஹோதேவாஹு” என்பவையும் சாத்தியமான வாசிப்புகள்.
    reason: textual_variant
lexical_decisions:
- source_word: וּבְנֵי
  choice: மகன்கள்
  rationale: בְּנֵי என்பது ‘மகன்கள்’ என்ற பொருளுடைய பன்மை இணைப்புநிலை வடிவம். வம்சப் பட்டியலில் இதுவே துல்லியமான இயல்பான தமிழாக்கம்; தொடக்க וּ தொடர்ச்சியைச் சுட்டினாலும், தனி வசனத் தமிழில் தேவையற்ற ‘மேலும்’ சேர்க்கப்படவில்லை.
- source_word: אֶלְיוֹעֵינַי
  choice: எல்யோயேனாய்
  rationale: எபிரெய உயிர்க்குறிப்பை நெருக்கமாகப் பிரதிபலிக்கும் வகையில் தனிப்பெயர் ஒலிபெயர்க்கப்பட்டது.
- source_word: הדיוהו
  choice: ஹோதவியா
  rationale: மெய்யெழுத்து வடிவம் வழக்கத்திற்கு மாறானது. பரவலாக அடையாளப்படுத்தப்படும் பெயர்வடிவம் முதன்மை உரையில் பயன்படுத்தப்பட்டு, உறுதியின்மை அடிக்குறிப்பில் காக்கப்பட்டது.
- source_word: וְאֶלְיָשִׁיב
  choice: எலியாசீப்
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் இயல்பாகப் பிரதிபலிக்கும் ஒலிபெயர்ப்பு.
- source_word: וּפְלָיָה
  choice: பெலாயா
  rationale: தனிப்பெயர்; இறுதியிலுள்ள -יָה ஒலிக்கூறு தமிழில் ‘-யா’ எனக் கொடுக்கப்பட்டது.
- source_word: וְעַקּוּב
  choice: அக்கூப்
  rationale: தனிப்பெயர்; வலியுறுத்தப்பட்ட க் ஒலியும் நீண்ட ஊ ஒலியும் பிரதிபலிக்கப்பட்டன.
- source_word: וְיוֹחָנָן
  choice: யோகானான்
  rationale: יוֹחָנָן என்ற எபிரெய வடிவத்தை நெருக்கமாகப் பிரதிபலிக்கும் தனிப்பெயர் ஒலிபெயர்ப்பு.
- source_word: וּדְלָיָה
  choice: தெலாயா
  rationale: எபிரெய தனிப்பெயரின் ஒலிப்புக்கு ஏற்ற தமிழ் வடிவம்.
- source_word: וַעֲנָנִי
  choice: அனானி
  rationale: தனிப்பெயர் ஒலிபெயர்க்கப்பட்டது; பட்டியலின் இணைப்புகள் தமிழில் நிறுத்தக்குறிகளால் இயல்பாக வெளிப்படுத்தப்பட்டன.
- source_word: שִׁבְעָה
  choice: மொத்தம் ஏழு பேர்
  rationale: பட்டியலில் சொல்லப்பட்ட மகன்களின் எண்ணிக்கையைச் சுருக்கிக் கூறும் எபிரெய எண்ணுச் சொல்; தமிழில் அதன் கணக்கிடும் பணியைத் தெளிவாக்க ‘மொத்தம்’ மற்றும் நபர்களைக் குறிக்கும் ‘பேர்’ சேர்க்கப்பட்டன.
