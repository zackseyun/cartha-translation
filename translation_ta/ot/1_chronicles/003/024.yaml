translation_notes:
  register: நவீன நிலையான தமிழில், வம்சப் பட்டியலுக்கேற்ற சுருக்கமானதும் கண்ணியமானதுமான நடை பயன்படுத்தப்பட்டுள்ளது. தனிப்பெயர்கள் எபிரெய ஒலிவடிவங்களை அடிப்படையாகக் கொண்டு தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளன; பட்டியலின் முடிவிலுள்ள எண்ணிக்கை இயல்பான தமிழுக்காக ‘மொத்தம் ஏழு பேர்’ என வழங்கப்பட்டுள்ளது.
