base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/005.yaml
  text: 'These were born to him in Jerusalem: Shimea[a], Shobab, Nathan[b], and Solomon—four by Bath-shua daughter of Ammiel.'
translation:
  language: ta
  text: 'எருசலேமில் அவருக்குப் பிறந்தவர்கள்: சிமெயா[b], சோபாப், நாத்தான், சாலொமோன்—அம்மியேலின் மகள் பத்சூவாவுக்கு[a] பிறந்த நால்வர்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 2 சாமுவேல் 5:14 மற்றும் தொடர்புடைய இணைப் பகுதிகளில் இவர் எலியாமின் மகள் பத்சேபா என்று அழைக்கப்படுகிறார்.
    reason: alternative_reading
  - marker: b
    text: எபிரெய மூலத்தில் ‘சிமெயா’; 2 சாமுவேல் 5:14 என்ற இணைப் பகுதியில் ‘சம்முவா’ என்று உள்ளது.
    reason: textual_variant
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: பிறந்தவர்கள்
  rationale: வம்சப் பட்டியலின் அடுத்த தொகுதியைத் தமிழில் இயல்பாக அறிமுகப்படுத்துகிறது; ‘இவர்கள்’ என்பது அடுத்த வாக்கியத்திலும் இடம்பெறுவதால் தேவையற்ற இரட்டிப்பைத் தவிர்க்கிறது.
- source_word: נוּלְּדוּ לוֹ
  choice: அவருக்குப் பிறந்தவர்கள்
  rationale: ילד என்பதன் நிஃபால் வடிவிலுள்ள செயப்பாட்டு பொருளையும், முந்தைய சூழலில் தாவீதைக் குறிக்கும் பதிற்பெயரையும் காக்கிறது.
- source_word: בִּירוּשָׁלָיִם
  choice: எருசலேமில்
  rationale: பிறந்த இடத்தைக் குறிக்கும் நேரடியான இடவெற்றுமை மொழிபெயர்ப்பு.
- source_word: שִׁמְעָא
  choice: சிமெயா
  rationale: நாளாகம எபிரெய மூலத்தில் உள்ள பெயர் வடிவத்தை ஒலிபெயர்க்கிறது; சாமுவேல் இணைப் பகுதியில் உள்ள ‘சம்முவா’ என்பதோடு ஒத்திசைக்கவில்லை.
- source_word: שׁוֹבָב
  choice: சோபாப்
  rationale: எபிரெய தனிப்பெயரின் இயல்பான தமிழ் ஒலிபெயர்ப்பு.
- source_word: נָתָן
  choice: நாத்தான்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் அறியப்பட்ட பெயர் வடிவம்.
- source_word: שְׁלֹמֹה
  choice: சாலொமோன்
  rationale: அறியப்பட்ட அரசரின் பெயருக்கான வழக்கமான தமிழ் வேதாகம வடிவத்தைப் பயன்படுத்துகிறது.
- source_word: אַרְבָּעָה
  choice: ஆகிய நால்வர்
  rationale: முன்னர் பட்டியலிடப்பட்ட நான்கு மகன்களையும் தொகுத்துக் கூறுகிறது; மனிதர்களைக் குறிக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: לְבַת שׁוּעַ
  choice: பத்சூவாவுக்குப் பிறந்தவர்கள்
  rationale: இச்சூழலில் לְ குறிக்கும் தாய்வழிப் பிறப்பைத் தமிழில் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: בַּת עַמִּיאֵל
  choice: அம்மியேலின் மகள்
  rationale: தந்தை–மகள் உறவைக் குறிக்கும் எபிரெய கட்டமைப்பின் நேரடியான தமிழ் வடிவம்.
theological_decisions:
- issue: நாளாகமத்திலுள்ள தாவீதின் மனைவியின் பெயர், சாமுவேல் இணைப் பகுதியிலுள்ள பெயரிலிருந்து மாறுபடுதல்
  choice: அம்மியேலின் மகள் பத்சூவா
  alternative: எலியாமின் மகள் பத்சேபா
  rationale: நாளாகமத்தின் எபிரெய மூலத்தில் உள்ள ‘பத்சூவா, அம்மியேலின் மகள்’ என்ற வடிவமே முதன்மை உரையில் வைக்கப்படுகிறது. இணைப் பகுதியோடு அமைதியாக ஒத்திசைக்காமல், அதன் மாறுபட்ட வடிவம் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதில் புரியும், ஆனால் வம்சப் பட்டியலுக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. நீண்ட எபிரெய வாக்கியம் வாசிப்புத் தெளிவுக்காக இரண்டு தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறிகள் அவை விளக்கும் பெயர்களுக்குப் பின்னரே வைக்கப்பட்டுள்ளன.
