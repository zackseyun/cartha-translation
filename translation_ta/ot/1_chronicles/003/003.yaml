base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/003.yaml
  text: the fifth[a], Shephatiah, by Abital; the sixth, Ithream[b], by Eglah his wife.
translation:
  language: ta
  text: ஐந்தாவது, அபித்தாளுக்குப் பிறந்த[a] செப்பத்தியா; ஆறாவது, தாவீதின் மனைவியான எக்லாளுக்குப்[b] பிறந்த இத்ரேயாம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அபித்தாளுக்கு’ என்றும் ‘எக்லாளுக்கு’ என்றும் நேரடியாக மொழிபெயர்க்கலாம்; அதாவது, முறையே ‘அபித்தாளுக்குப் பிறந்தவன்,’ ‘எக்லாளுக்குப் பிறந்தவன்’ என்று பொருள். இங்கு எபிரெய முன்னிடைச்சொல் வம்சவரலாற்றுச் சூழலுக்கேற்ப தமிழில் ‘பிறந்த’ என்று இயல்பாகத் தரப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: சில விளக்கவுரையாளர்கள் எக்லாளை மீகாளுடன் அடையாளப்படுத்துகின்றனர்; ஆனால் இவ்வுரை அதைச் சொல்வதில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: הַחֲמִישִׁי
  choice: ஐந்தாவது
  rationale: குறிப்பிட்ட வரிசை எண்ணைச் சுட்டும் பெயரடை; தாவீதின் மகன்களுடைய எண்ணிடப்பட்ட பட்டியலைத் தொடர்கிறது.
- source_word: שְׁפַטְיָה
  choice: செப்பத்தியா
  rationale: தனிப்பெயர் என்பதால் தமிழில் வழக்கமான ஒலிபெயர்ப்பு வடிவில் தரப்பட்டுள்ளது.
- source_word: לַאֲבִיטָל
  choice: அபித்தாளுக்குப் பிறந்த
  rationale: இந்த வம்சவரலாற்றுச் சூத்திரத்தில் ל தாய்வழிப் பிறப்புறவைக் குறிக்கிறது; தமிழில் ‘அபித்தாளுக்குப் பிறந்த’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: הַשִּׁשִּׁי
  choice: ஆறாவது
  rationale: முந்தைய வரிசை எண்ணுக்கு இணையாகப் பட்டியல் அமைப்பைப் பாதுகாக்கிறது.
- source_word: יִתְרְעָם
  choice: இத்ரேயாம்
  rationale: தனிப்பெயர் என்பதால் தமிழில் வழக்கமான ஒலிபெயர்ப்பு வடிவில் தரப்பட்டுள்ளது.
- source_word: לְעֶגְלָה
  choice: எக்லாளுக்குப் பிறந்த
  rationale: இங்கும் ל தாய்வழிப் பிறப்புறவைக் குறிக்கிறது; தமிழில் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אִשְׁתּוֹ
  choice: அவனுடைய மனைவியான
  rationale: மூலத்தின் ஆண்பால் ஒருமை உடைமைச் சுட்டையும் திருமண உறவையும் நேரடியாகப் பாதுகாக்கிறது; இச்சொற்றொடர் எக்லாளை விளக்குகிறது.
theological_decisions:
- issue: ‘அவனுடைய மனைவி’ என்ற சொற்றொடரின் குறிப்பு மற்றும் எக்லாளின் அடையாளம்
  choice: மூலத்தின் ‘அவனுடைய மனைவியான எக்லாள்’ என்ற எளிய வம்சவரலாற்றுக் குறிப்பை மட்டும் தக்கவைத்தல்
  alternative: எக்லாளுக்கு மற்ற மனைவிகளைவிடத் தனிச்சிறப்பு இருந்ததாகக் கொள்ளுதல் அல்லது அவளை மீகாளுடன் அடையாளப்படுத்துதல்
  rationale: எபிரெய உரை எக்லாளை ‘அவனுடைய மனைவி’ என்று மட்டுமே கூறுகிறது. ஏன் இவ்வாறு தனியாகக் குறிப்பிடப்படுகிறாள் என்பதையோ, அவள் மீகாள் என்பதையோ உரை கூறாததால், ஊகமான அடையாளத்தையோ நிலைப்பாட்டையோ மொழிபெயர்ப்பில் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரமான, மரியாதைக்குரிய தமிழ் நடை பயன்படுத்தப்பட்டுள்ளது. சுருக்கமான வம்சவரலாற்றுப் பட்டியல் அமைப்பு காக்கப்பட்டுள்ளது; ‘அவனுடைய’ என்பது மூலத்திலுள்ள உடைமைச் சுட்டைத் தக்கவைத்து, உரை கூறாத அடையாளத்தை வெளிப்படையாகச் சேர்ப்பதைத் தவிர்க்கிறது.
