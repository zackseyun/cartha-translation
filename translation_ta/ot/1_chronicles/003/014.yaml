lexical_decisions:
- source_word: אָמ֥וֹן
  choice: ஆமோன்
  rationale: யூதாவின் அரசனுடைய எபிரெயத் தனிப்பெயர்; நவீனத் தமிழ் வேதாகமப் பயன்பாட்டில் அறியப்பட்ட வடிவில் ஒலிபெயர்க்கப்பட்டது.
- source_word: בְּנ֖וֹ
  choice: அவனுடைய மகன்
  rationale: בֵּן என்ற பெயர்ச்சொல்லுடன் சேர்ந்த மூன்றாம் நபர் ஆண்பால் ஒருமை உடைமைப் பின்னொட்டு, சொற்பொருளாக ‘அவனுடைய மகன்’ எனப் பொருள்படும்; வம்சவரிசைத் தொடரைத் தெளிவாகக் காட்டுகிறது.
- source_word: יֹאשִׁיָּ֥הוּ
  choice: யோசியா
  rationale: எபிரெயத் தனிப்பெயரின் தமிழில் நிலைபெற்ற, வாசகர்களுக்கு அறிமுகமான வடிவம்.
- source_word: בְנֽוֹ
  choice: அவனுடைய மகன்
  rationale: மீண்டும் வரும் வம்சவரிசைச் சூத்திரத்தை ஒரேவிதமாக மொழிபெயர்த்து, அரச மரபின் தொடர்ச்சியைப் பாதுகாக்கிறது.
