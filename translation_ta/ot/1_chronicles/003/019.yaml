base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/019.yaml
  text: 'The sons of Pedaiah: Zerubbabel and Shimei[a]. And the sons of Zerubbabel: Meshullam and Hananiah; and Shelomith was their sister.'
translation:
  language: ta
  text: 'பெதாயாவின் மகன்கள்: செருபாபேலும் சிமேயியும். செருபாபேலின் மகன்கள்[a]: மெசுல்லாமும் அனனியாவும்; செலோமித் அவர்களுடைய சகோதரி.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மூலத்தில், “செருபாபேலின் மகன்” என்று ஒருமையில் உள்ளது. ஆனால் தொடர்ந்து மெசுல்லாம், அனனியா ஆகிய இருவரின் பெயர்கள் வருவதால், இதை எழுத்துப்பிரதிசார் ஒழுங்கின்மையாகவோ வம்சப் பட்டியலில் கூட்டுப் பொருளில் வந்த பயன்பாடாகவோ பலர் புரிந்துகொள்கிறார்கள்; எனவே முதன்மை உரையில் “மகன்கள்” என்று தரப்பட்டுள்ளது.
    reason: textual_variant
lexical_decisions:
- source_word: וּבְנֵי פְדָיָה
  choice: பெதாயாவின் மகன்கள்
  rationale: வம்சப் பட்டியல் சூழலில் בְנֵי என்பதன் இயல்பான பொருள் ‘மகன்கள்’. தொடக்க இணைப்புச் சொல்லான וּ தமிழில் தனியாக ‘மற்றும்’ என மொழிபெயர்க்கப்படாமல், பட்டியல் நடைக்கு ஏற்றவாறு விடப்பட்டுள்ளது.
- source_word: זְרֻבָּבֶל וְשִׁמְעִי
  choice: செருபாபேலும் சிமேயியும்
  rationale: இரு தனிப்பெயர்களும் தமிழில் ஒலிபெயர்க்கப்பட்டு, எபிரெய இணைப்பு இயல்பான தமிழ் இணைப்பும்மையால் காட்டப்பட்டுள்ளது.
- source_word: וּבֶן זְרֻבָּבֶל
  choice: செருபாபேலின் மகன்கள்[a]
  rationale: எபிரெய மூலத்தில் בֶן ஒருமையாக ‘மகன்’ என்று உள்ளது. ஆனால் தொடர்ந்து இரண்டு ஆண் பெயர்கள் வருவதால், வாக்கியத்தின் வெளிப்படையான வம்சப் பட்டியல் பொருளுக்கேற்ப பன்மை முதன்மை உரையில் தரப்பட்டு, மூலத்தின் ஒருமை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: מְשֻׁלָּם וַחֲנַנְיָה
  choice: மெசுல்லாமும் அனனியாவும்
  rationale: தனிப்பெயர்கள் தமிழில் ஒலிபெயர்க்கப்பட்டு, இணைப்பு இயல்பான தமிழ் பட்டியல் நடையில் தரப்பட்டுள்ளது.
- source_word: וּשְׁלֹמִית אֲחוֹתָם
  choice: செலோமித் அவர்களுடைய சகோதரி
  rationale: אֲחוֹתָם என்பதில் உள்ள பன்மை பின்னொட்டு ‘அவர்களுடைய’ என்று வெளிப்படுத்தப்பட்டு, எபிரெய வினையற்ற உடன்பாட்டு வாக்கியம் தமிழிலும் இயல்பாக வினையின்றி தரப்பட்டுள்ளது.
