lexical_decisions:
- source_word: יִבְחָר
  choice: இப்கார்
  rationale: வம்சப் பட்டியலில் வரும் எபிரெயத் தனிப்பெயர்; பொருள் மொழிபெயர்க்கப்படாமல், எபிரெய ஒலிப்புக்கு ஏற்றவாறு தமிழில் ஒலிபெயர்க்கப்பட்டது. தொடக்க யோத் இங்கு ‘இ’ என்றும், בְח சேர்க்கை ‘ப்க’ என்றும் பிரதிபலிக்கப்படுகிறது.
- source_word: אֱלִישָׁמָע
  choice: எலிசாமா
  rationale: எபிரெயத் தனிப்பெயர் தமிழில் இயல்பாக ஒலிபெயர்க்கப்பட்டது; இறுதி ע தனியே குறிக்கப்படாமல், பெயரின் இறுதி உயிரொலி ‘ஆ’ என வழங்கப்படுகிறது.
- source_word: אֱלִיפָלֶט
  choice: எலிபேலேத்
  rationale: எபிரெயத் தனிப்பெயர்; மூலத்தின் אֱלִיפָלֶט என்ற வடிவத்தையும் உயிரொலிகளையும் நெருக்கமாகப் பிரதிபலிக்கும் தமிழ் ஒலிபெயர்ப்பு.
- source_word: וְ
  choice: மற்றும் என்ற சொல் வெளிப்படையாகச் சேர்க்கப்படாத பட்டியல் இணைப்பு
  rationale: ஒவ்வொரு பெயருக்கும் முன் வரும் எபிரெய இணைப்புச்சொல் எளிய பட்டியல் ஒருங்கிணைப்பைக் குறிக்கிறது. தமிழில் பெயர்களைக் காற்புள்ளிகளால் வரிசைப்படுத்துவது இயல்பாகவும் மூலத்தின் பொருளுக்கு உண்மையாகவும் உள்ளது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், வம்சப் பட்டியலுக்கேற்ற சுருக்கமான மற்றும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. தனிப்பெயர்கள் ஆங்கில வடிவங்களிலிருந்து அல்லாமல் WLC எபிரெய உரையிலிருந்து நேரடியாக ஒலிபெயர்க்கப்பட்டுள்ளன; அடிக்குறிப்புக் குறியீடு முதன்மை உரையில் இடம்பெற்றுள்ளது.
