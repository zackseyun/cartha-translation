    text: 'எபிரெயப் பெயர்களின் ஒலிபெயர்ப்பு: «யிப்ஹார்» சில மொழிபெயர்ப்புகளில் «இபார்» அல்லது «ஜிபார்» என்றும், «எலிபாலேத்» மாற்று எழுத்துக்கூட்டல்களிலும் காணப்படலாம்.'
