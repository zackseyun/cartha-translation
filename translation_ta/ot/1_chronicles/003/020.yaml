translation_notes:
  register: நவீன நிலையான தமிழில், வம்சவரலாற்றுப் பட்டியலுக்குரிய சுருக்கமான, கண்ணியமான நடை. பெயர்கள் மூல எபிரெய ஒலிப்பை முன்னிறுத்தி ஒலிபெயர்க்கப்பட்டுள்ளன; பட்டியலின் தொடர்ச்சிக்கான இணைப்புச் சொல் முந்தைய வசனச் சூழலில் இயல்பாகப் புரியப்படுவதால் தனியே சேர்க்கப்படவில்லை.
