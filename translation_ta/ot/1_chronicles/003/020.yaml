  text: and Hashubah[a], Ohel, Berekiah, Hasadiah[b], and Jushab-hesed—five.
translation:
  language: ta
  text: ஹஷுபா, ஓஹேல், பெரெக்கியா, ஹசதியா, யூஷாப்-ஹெசெத்[a]—ஐந்து பேர்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இறுதிப் பெயர் எபிரெயத்தில் “யூஷாப் ஹெசெத்” என்று இரண்டு கூறுகளாக எழுதப்பட்டுள்ளது; ஆனால் அது ஒரே கூட்டுப் பெயராகப் புரிந்துகொள்ளப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் “ஐந்து” என்று மட்டும் உள்ளது; இங்கு தமிழின் இயல்புக்காக “பேர்” சேர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַ/חֲשֻׁבָה
  choice: அசூபா
  rationale: இது வாவ் இணைப்புடன் வரும் ஆள்பெயர். எபிரெய ஒலிப்பைத் தமிழில் இயல்பாகக் காட்டும் வகையில் ஒலிபெயர்க்கப்பட்டது; பட்டியலின் இணைப்பு தமிழில் இறுதியில் அமைக்கப்படுகிறது.
- source_word: וָ/אֹהֶל
  choice: ஓகேல்
  rationale: இங்கு אֹהֶל என்பது ‘கூடாரம்’ என்ற பொதுப்பெயர் அல்ல, ஆள்பெயர். எபிரெய guttural ஒலியை நெருங்கிக் காட்ட ‘கே’ பயன்படுத்தப்பட்டது.
- source_word: וּ/בֶרֶכְיָה
  choice: பெரெகியா
  rationale: ஆள்பெயர் என்பதால் மொழிபெயர்க்காமல் ஒலிபெயர்க்கப்பட்டது; כ ஒலி ‘க’ என்றும், இறுதி יה ‘யா’ என்றும் காட்டப்படுகிறது.
- source_word: וַֽ/חֲסַדְיָה
  choice: அசதியா
  rationale: எபிரெய ஆள்பெயரின் ஒலிப்பைத் தமிழில் நெருங்கிக் காட்டும் வடிவம்; இறுதி יה ‘யா’ என ஒலிபெயர்க்கப்பட்டது.
- source_word: י֥וּשַׁב חֶ֖סֶד
  choice: யூசாப்-கேசெத்
  rationale: எபிரெயத்தில் இரண்டு கூறுகளாக எழுதப்பட்டாலும் ஒரே கூட்டுப் பெயராகச் செயல்படுவதால் இடைக்கோடு பயன்படுத்தப்பட்டது. இறுதி ד ஒலி ‘த்’ எனவும் ח ஒலி ‘க’ மூலம் அண்மையாகவும் காட்டப்படுகிறது.
- source_word: חָמֵשׁ
  choice: ஐந்து பேர்
  rationale: முன் பட்டியலிடப்பட்ட ஆள்களைச் சுருக்கிக் கூறும் எண்ணாக இருப்பதால், தமிழில் இயல்பும் தெளிவும் பெற ‘பேர்’ சேர்க்கப்பட்டது; எபிரெயத்தின் சுருக்கமான நடை பாதுகாக்கப்படுகிறது.
