  text: וּ/בְנֵ֖י יְהוֹיָקִ֑ים יְכָנְיָ֥ה בְנ֖/וֹ צִדְקִיָּ֥ה בְנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/016.yaml
  text: 'And the sons of Jehoiakim: Jeconiah his son[a], Zedekiah his son.'
translation:
  language: ta
  text: 'யோயாக்கீமின் மகன்கள்: எகொனியா, அவன் மகன்; சிதேக்கியா, அவன் மகன்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய உரை சுருக்கமாக, “எகொனியா அவன் மகன், சிதேக்கியா அவன் மகன்” என்று கூறுகிறது. இதை ஒரு தொடர்ச்சியான வம்சவரிசையாக வாசிக்கலாம். எனினும், இருவரும் யோயாக்கீமின் மகன்களா, அல்லது இங்கு சொல்லப்பட்ட வரிசைப்படி சிதேக்கியா எகொனியாவின் மகனா என்பதில் கருத்து வேறுபாடு உள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: மகன்கள்
  rationale: בְּנֵי என்பது ‘மகன்கள்’ என்பதன் இணைப்பு வடிவம்; வம்சவரிசைப் பட்டியலை அறிமுகப்படுத்துகிறது. தமிழ் வசனத் தொடக்கத்தில் ו தனியாக ‘மற்றும்’ என மொழிபெயர்க்கப்படாமல், இயல்பான பட்டியல் தொடராக வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: יְהוֹיָקִים
  choice: யோயாக்கீம்
  rationale: எபிரெய தனிப்பெயரின் ஒலியை நவீனத் தமிழில் தெளிவாகக் குறிக்கும் எழுத்துப்பெயர்ப்பு.
- source_word: יְכָנְיָה
  choice: எகொனியா
  rationale: இவ்விடத்திலுள்ள יְכָנְיָה என்ற எபிரெய வடிவத்தை நேரடியாகப் பிரதிபலிக்கும் தமிழ் எழுத்துப்பெயர்ப்பு; வேறு இடங்களில் காணப்படும் சுருக்க அல்லது மாற்று வடிவங்கள் இங்கு புகுத்தப்படவில்லை.
- source_word: בְנ֖/וֹ
  choice: அவன் மகன்
  rationale: மூன்றாம் நபர் ஆண்பால் ஒருமை உடைமைப் பின்னொட்டுடன் உள்ள בנו என்பதன் சுருக்கமான நேரடி மொழிபெயர்ப்பு; சுட்டுப்பெயரின் தொடர்பைத் தீர்மானிக்காமல் பாதுகாக்கிறது.
- source_word: צִדְקִיָּה
  choice: சிதேக்கியா
  rationale: צִדְקִיָּה என்ற எபிரெய தனிப்பெயருக்கான தெளிவான தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: בְנֽ/וֹ
  choice: அவன் மகன்
  rationale: எபிரெய மூலத்தில் மீண்டும் வரும் வம்சவரிசைக் குறிப்பை நீக்காமல் அப்படியே வைத்திருப்பதால், அதன் தொடர்பிலுள்ள இயல்பான தெளிவின்மை பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: சுருக்கமான வம்சவரிசைத் தொடரில் உறவுமுறையை அடையாளம் காணுதல்
  choice: ‘அவன் மகன்’ என்ற சொற்றொடர் இரு பெயர்களுக்குப் பின்னும் மீண்டும் வழங்கப்பட்டு, எபிரெய தொடரமைப்பு பாதுகாக்கப்பட்டுள்ளது.
  alternative: எகொனியாவும் சிதேக்கியாவும் யோயாக்கீமின் மகன்கள் என்று வெளிப்படையாகப் பட்டியலிடுதல்; அல்லது சிதேக்கியா எகொனியாவின் மகன் என்று தெளிவுபடுத்துதல்.
  rationale: எபிரெய உரை ‘எகொனியா அவன் மகன், சிதேக்கியா அவன் மகன்’ என்று சுருக்கமாகக் கூறுகிறது. பிற வரலாற்றுப் பகுதிகளோடு ஒத்திசைக்க முயலாமல், சுட்டுப்பெயர் யாரைக் குறிக்கிறது என்பதை முதன்மை உரை தீர்மானிப்பதில்லை; அடிக்குறிப்பு இரு சாத்தியங்களையும் தெரிவிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், வம்சவரிசைக்கேற்ற சுருக்கமும் கண்ணியமும் பேணப்பட்டுள்ளன. ‘அவன் மகன்’ என்ற இயல்பான வடிவம் எபிரெய உரையின் மீளுரையையும் தெளிவின்மையையும் காக்கிறது; உறவுமுறை விளக்கமாக விரிவாக்கப்படவில்லை.
