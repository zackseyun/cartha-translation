source:
  edition: WLC
  text: וּ/בֶן נְעַרְיָ֗ה אֶלְיוֹעֵינַ֧י וְ/חִזְקִיָּ֛ה וְ/עַזְרִיקָ֖ם שְׁלֹשָֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/023.yaml
  text: 'The sons of Neariah: Elioenai[a], Hezekiah, and Azrikam—three.'
translation:
  language: ta
  text: 'நெயரியாவின் மகன்கள்[a]: எலியோனாய், எசேக்கியா, அஸ்ரிக்காம்—மூவர்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மூலத்தில் ‘நெயரியாவின் மகன்’ என்று ஒருமையில் உள்ளது. ஆனால் இந்த வம்சவரலாற்றுச் சூழலில் அது பல சந்ததியினரை அறிமுகப்படுத்தும் தலைப்பாகச் செயல்படுகிறது; ஆகவே ‘நெயரியாவின் மகன்கள்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֶן
  choice: மகன்கள்
  rationale: எபிரெய வடிவம் ஒருமையில் இருந்தாலும், தொடர்ந்து மூன்று பெயர்கள் வருவதும் இறுதியில் ‘மூவர்’ என்று தொகை குறிப்பிடப்படுவதும் இதை வம்சவரலாற்றுப் பட்டியலின் பன்மைத் தலைப்பாகப் புரிந்துகொள்ளச் செய்கின்றன.
- source_word: נְעַרְיָה
  choice: நெயரியா
  rationale: தனிப்பட்ட நபரின் பெயர்; எபிரெய ஒலிப்புக்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: אֶלְיוֹעֵינַי
  choice: எலியோனாய்
  rationale: தனிப்பட்ட நபரின் பெயர்; எபிரெய பெயரின் ஒலியமைப்பைப் பின்பற்றி ஒலிபெயர்க்கப்பட்டது.
- source_word: וְחִזְקִיָּה
  choice: எசேக்கியா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்பட்ட பெயர் வடிவம் பயன்படுத்தப்பட்டது.
- source_word: וְעַזְרִיקָם
  choice: அஸ்ரிக்காம்
  rationale: தனிப்பட்ட நபரின் பெயர்; எபிரெய ஒலிப்பை இயன்றவரை பிரதிபலிக்கும் வகையில் ஒலிபெயர்க்கப்பட்டது.
- source_word: שְׁלֹשָׁה
  choice: மூவர்
  rationale: குறிப்பிடப்படுபவர்கள் மனிதர்கள் என்பதால், மூலத்தில் உள்ள எண்ணிக்கையை இயல்பான தமிழ் உயர்திணை வடிவில் வெளிப்படுத்துகிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரமான, சுருக்கமான வம்சவரலாற்று நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. பெயர்கள் ஒலிபெயர்க்கப்பட்டுள்ளன; ‘மூவர்’ என்பது இயல்பான தமிழையும் மூலத்தின் தொகைக் குறிப்பையும் காக்கிறது.
