translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான வரலாற்று உரைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய இராணுவச் சூழல் இயல்பாக வெளிப்படும்படி ‘படைவீரர்கள்,’ ‘போரணி’ ஆகிய சொற்கள் தேர்ந்தெடுக்கப்பட்டுள்ளன; மரபுத்தொடரின் சொற்படிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
