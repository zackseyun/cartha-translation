source:
  edition: WLC
  text: וְ/אֵת֙ יֶ֣תֶר הָ/עָ֔ם נָתַ֕ן בְּ/יַ֖ד אַבְשַׁ֣י אָחִ֑י/ו וַ/יַּ֣עַרְכ֔וּ לִ/קְרַ֖את בְּנֵ֥י עַמּֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/011.yaml
  text: He put the rest of the troops under the command of Abishai his brother[a], and they drew up in battle formation to meet the Ammonites.
translation:
  language: ta
  text: மீதமிருந்த படைவீரர்களைத் தன் சகோதரன் அபிசாயின் பொறுப்பில் ஒப்படைத்தான்[a]. அவர்கள் அம்மோனியரை எதிர்கொள்ளப் போரணியில் நின்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்பொருளாக, “தன் சகோதரன் அபிசாயின் கையில் கொடுத்தான்”; இது அவனுடைய அதிகாரம் அல்லது பொறுப்பின்கீழ் ஒப்படைப்பதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶתֶר הָעָם
  choice: மீதமிருந்த படைவீரர்களை
  rationale: יֶתֶר என்பது ‘மீதமுள்ளவர்கள்’ என்பதையும், הָעָם என்பது சொற்பொருளில் ‘மக்கள்’ என்பதையும் குறிக்கின்றன. இங்கு போர் நிகழ்வின் சூழலில் யோவாபின் படையில் மீதமிருந்த வீரர்களே குறிக்கப்படுவதால், ‘மீதமிருந்த படைவீரர்கள்’ என்பது இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: נָתַן בְּיַד
  choice: பொறுப்பில் ஒப்படைத்தான்
  rationale: சொற்பொருளில் ‘கையில் கொடுத்தான்’ என்ற இந்த எபிரெய மரபுத்தொடர், ஒருவரின் அதிகாரம் அல்லது பொறுப்பின்கீழ் ஒப்படைப்பதைக் குறிக்கிறது. தமிழில் ‘பொறுப்பில் ஒப்படைத்தான்’ அதன் சூழல்சார்ந்த பொருளை இயல்பாகத் தெரிவிக்கிறது.
- source_word: אַבְשַׁי אָחִיו
  choice: தன் சகோதரன் அபிசாய்
  rationale: אָחִיו என்பது யோவாபைக் குறிக்கும் ‘அவனுடைய சகோதரன்.’ தமிழில் குறிப்புத் தெளிவாக இருக்க ‘தன் சகோதரன்’ பயன்படுத்தப்பட்டுள்ளது; பெயர் வழக்கமான தமிழ் ஒலிபெயர்ப்பில் ‘அபிசாய்’ என வழங்கப்பட்டுள்ளது.
- source_word: וַיַּעַרְכוּ
  choice: போரணியில் நின்றார்கள்
  rationale: ערך என்ற வினைச்சொல் இப்போர் சூழலில் படைகள் போருக்காக அணிவகுத்து நிற்பதைக் குறிக்கிறது. ‘போரணியில் நின்றார்கள்’ சுருக்கமாகவும் இயல்பாகவும் அந்த இராணுவப் பொருளைத் தருகிறது.
- source_word: לִקְרַאת
  choice: எதிர்கொள்ள
  rationale: לִקְרַאת என்பதற்கு ‘சந்திக்க/எதிர்கொள்ள’ என்ற பொருள் உண்டு. போர் சூழலில் ‘எதிர்கொள்ள’ என்பது பகைமுகமான சந்திப்பை மிகைப்படுத்தாமல் தெளிவுபடுத்துகிறது.
- source_word: בְּנֵי עַמּוֹן
  choice: அம்மோனியரை
  rationale: சொற்பொருளில் ‘அம்மோனின் மகன்கள்’ என்றாலும், இது ஓர் இனத்தைக் குறிக்கும் வழக்கமான எபிரெய சொல்லாட்சி. ஆகவே இயல்பான தமிழ் இனப்பெயரான ‘அம்மோனியர்’ பயன்படுத்தப்பட்டுள்ளது.
