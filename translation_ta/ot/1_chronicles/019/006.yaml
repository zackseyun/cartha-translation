source:
  edition: WLC
  text: וַ/יִּרְאוּ֙ בְּנֵ֣י עַמּ֔וֹן כִּ֥י הִֽתְבָּאֲשׁ֖וּ עִם דָּוִ֑יד וַ/יִּשְׁלַ֣ח חָ֠נוּן וּ/בְנֵ֨י עַמּ֜וֹן אֶ֣לֶף כִּכַּר כֶּ֗סֶף לִ/שְׂכֹּ֣ר לָ֠/הֶם מִן אֲרַ֨ם נַהֲרַ֜יִם וּ/מִן אֲרַ֤ם מַעֲכָה֙ וּ/מִ/צּוֹבָ֔ה רֶ֖כֶב וּ/פָרָשִֽׁים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/006.yaml
  text: When the Ammonites saw that they had become odious to David[a], Hanun and the Ammonites sent a thousand talents of silver to hire for themselves chariots and horsemen from Aram-naharaim, from Aram-maacah[b], and from Zobah.
translation:
  language: ta
  text: அம்மோனியர் தாங்கள் தாவீதுக்கு அருவருப்பானவர்களாகிவிட்டதைக் கண்டபோது[a], ஹானூனும் அம்மோனியரும் அராம்-நகராயிமிலிருந்தும்[b], அராம்-மாக்காவிலிருந்தும், சோபாவிலிருந்தும் தங்களுக்காகத் தேர்களையும் குதிரைவீரர்களையும் கூலிக்கு அமர்த்துவதற்காக ஆயிரம் தாலந்து வெள்ளியை அனுப்பினர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அருவருப்பானவர்களாகிவிட்டனர்” என்பதற்கான எபிரெயச் சொற்றொடர் நேரடியாக, “தாவீதுக்கு நாற்றமெடுப்பவர்களாகிவிட்டனர்” என்று பொருள்படும்; இது வெறுப்புக்குரியவர்களாக அல்லது மிகவும் அருவருப்பானவர்களாக ஆகிவிட்டதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: அராம்-நகராயிம் என்பது பாரம்பரியமாக “இரு நதிகளின் அராம்,” அதாவது மெசொப்பொத்தாமியா என்று புரிந்துகொள்ளப்படுகிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: கண்டபோது
  rationale: ראה என்பதன் அடிப்படைப் பொருளான ‘காணுதல்’ என்பதைக் காத்துக்கொண்டு, சூழலில் நிலைமையை உணர்ந்துகொண்டதையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּנֵי עַמּוֹן
  choice: அம்மோனியர்
  rationale: ‘அம்மோனின் புதல்வர்கள்’ என்ற சொல்லுக்குச் சொல் வடிவத்தைவிட, இங்கு மக்களினப் பெயரே நவீனத் தமிழில் இயல்பானது.
- source_word: הִתְבָּאֲשׁוּ עִם דָּוִיד
  choice: தாங்கள் தாவீதுக்கு அருவருப்பானவர்களாகிவிட்டதை
  rationale: באש என்பதிலுள்ள ‘நாற்றமெடுத்தல்’ உருவகத்தின் சூழல்சார் பொருள் ஒருவருக்கு அருவருப்பாக அல்லது வெறுப்புக்குரியவராக ஆகுதல். இயல்பான தமிழில் பொருள் தரப்பட்டு, நேரடியான உருவகம் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: וַיִּשְׁלַח
  choice: அனுப்பினர்
  rationale: שלח என்பதன் வழக்கமான பொருள்; இங்கு அனுப்பப்பட்ட பொருள் ஆயிரம் தாலந்து வெள்ளி.
- source_word: חָנוּן וּבְנֵי עַמּוֹן
  choice: ஹானூனும் அம்மோனியரும்
  rationale: எபிரெயத்தில் அரசனும் மக்களும் இணை எழுவாய்களாக இருப்பதைப் பாதுகாக்கிறது.
- source_word: אֶלֶף כִּכַּר כֶּסֶף
  choice: ஆயிரம் தாலந்து வெள்ளி
  rationale: כִּכָּר என்பது எடை அலகு; வேதாகமப் பயன்பாட்டில் அறியப்பட்ட ‘தாலந்து’ என்பதைக் கொண்டு, நவீன எடை அல்லது பண மதிப்பாக ஊகித்து மாற்றவில்லை.
- source_word: לִשְׂכֹּר לָהֶם
  choice: தங்களுக்காக ... கூலிக்கு அமர்த்துவதற்கு
  rationale: שׂכר என்பதன் ‘கூலிக்கு அமர்த்துதல்’ என்ற பொருளையும், לָהֶם காட்டும் அவர்களுக்கான பயன்/நோக்கத்தையும் வெளிப்படுத்துகிறது.
- source_word: אֲרַם נַהֲרַיִם
  choice: அராம்-நகராயிம்
  rationale: இடப்பெயரின் தன்மையையும் எபிரெய வடிவத்தையும் ஒலிபெயர்ப்பால் காக்கிறது; பாரம்பரிய புவியியல் விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אֲרַם מַעֲכָה
  choice: அராம்-மாக்கா
  rationale: கூட்டு வட்டாரப் பெயராக ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: מִצּוֹבָה
  choice: சோபாவிலிருந்து
  rationale: இடப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டு, מן முன்னிடைச்சொல் ‘-இலிருந்து’ என வெளிப்படுத்தப்படுகிறது.
- source_word: רֶכֶב
  choice: தேர்கள்
  rationale: ஒருமை வடிவம் கூட்டுப்பொருளில் இரதப்படையைக் குறிக்கிறது; தமிழில் பன்மை இயல்பானது.
- source_word: וּפָרָשִׁים
  choice: குதிரைவீரர்கள்
  rationale: பொருள் குதிரைமேல் போரிடும் வீரர்கள்; ‘குதிரைப்படை’ என்பதைவிட மனிதர்களையே குறிக்கும் எபிரெயப் பன்மையைத் தெளிவாகக் காக்கிறது.
