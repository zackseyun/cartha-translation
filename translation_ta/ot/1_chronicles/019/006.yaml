translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய இடப்பெயர்கள் ஒலிபெயர்க்கப்பட்டுள்ளன. வழங்கப்பட்ட ஆங்கில ஆலோசனை உரையில் அடிக்குறிப்புக் குறிகள் அவற்றின் உள்ளடக்கங்களோடு இடமாற்றமாக இருந்ததால், மூலச்சொற்றொடர்களுடன் பொருந்துமாறு [a] அருவருப்பு மரபுத்தொடருக்கும் [b] அராம்-நகராயிம் புவியியல் குறிப்புக்கும் இணைக்கப்பட்டுள்ளன.
