base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/003.yaml
  text: But the princes of the Ammonites said to Hanun[a], “Is David honoring your father in your sight because he has sent comforters to you? Have not his servants come to you in order to search out, to overthrow[b], and to spy out the land?”
translation:
  language: ta
  text: ஆனால் அம்மோனியரின் தலைவர்கள் ஆனூனிடம், “உனக்கு ஆறுதல் கூறுகிறவர்களை அனுப்பியிருப்பதால், உன் பார்வையில்[a] தாவீது உன் தந்தையை மதிக்கிறாரா? நாட்டை ஆராயவும், அதைக் கவிழ்க்கவும்[b], உளவு பார்க்கவும் அல்லவா அவருடைய பணியாளர்கள் உன்னிடம் வந்திருக்கிறார்கள்?” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் கண்களில்.” இந்த எபிரெய மரபுத்தொடர் ஆனூனின் பார்வை அல்லது மதிப்பீட்டைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அதைப் புரட்டிப்போடவும்.” இந்த எபிரெய வினைச்சொல் திருப்புதல் அல்லது கவிழ்த்தல் என்று பொருள்படலாம்; இங்கு பகைமையான சீர்குலைப்பு நோக்கத்தைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי
  choice: தலைவர்கள்
  rationale: அரசவையைச் சேர்ந்த உயர்நிலை ஆட்சியாளர்கள் அல்லது அதிகாரிகளைக் குறிக்கிறது; நவீனத் தமிழில் இயல்பாகவும் அரசியல் சூழலுக்கு ஏற்றதாகவும் ‘தலைவர்கள்’ உள்ளது.
- source_word: הַמְכַבֵּד
  choice: மதிக்கிறாரா
  rationale: כבד இங்கு ஒருவருக்கு மரியாதை செலுத்துதல் அல்லது மதிப்பளித்தல் என்ற பொருளில் வருகிறது.
- source_word: בְּעֵינֶיךָ
  choice: உன் பார்வையில்
  rationale: ‘உன் கண்களில்’ என்ற எபிரெய மரபுத்தொடரின் கருத்தான ஆனூனின் பார்வை அல்லது மதிப்பீட்டை இயல்பான தமிழில் தருகிறது.
- source_word: מְנַחֲמִים
  choice: ஆறுதல் கூறுகிறவர்கள்
  rationale: துக்கம் நேர்ந்தவருக்கு ஆறுதல் அளிக்க அனுப்பப்பட்டவர்களைச் சூழலுக்கு ஏற்றவாறு தெளிவாகக் குறிக்கிறது.
- source_word: לַחְקֹר
  choice: ஆராயவும்
  rationale: நாட்டைப் பற்றிய தகவல்களைத் தேடிக் கண்டறிதல் என்ற உளவுச் சூழலைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וְלַהֲפֹךְ
  choice: அதைக் கவிழ்க்கவும்
  rationale: הפך என்பதன் அடிப்படையான ‘திருப்புதல்/கவிழ்த்தல்’ என்ற பொருளையும் இங்குள்ள பகைமையான அரசியல் நோக்கையும் ஒருங்கே காக்கிறது.
- source_word: וּלְרַגֵּל
  choice: உளவு பார்க்கவும்
  rationale: ரகசியமாக நாட்டைக் கண்காணித்து தகவல் சேகரிப்பதை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: הָאָרֶץ
  choice: நாட்டை
  rationale: இங்கு அம்மோனின் ஆட்சிப்பகுதியைக் குறிப்பதால் ‘நாடு’ இயல்பான சூழல்சார் மொழிபெயர்ப்பு.
- source_word: עֲבָדָיו
  choice: அவருடைய பணியாளர்கள்
  rationale: அரசனுக்குப் பணிபுரியும் தூதர்களைக் குறிக்கிறது; அவர்களின் குறிப்பிட்ட பதவியை ஆதாரமின்றி வரையறுக்காமல் விடுகிறது.
