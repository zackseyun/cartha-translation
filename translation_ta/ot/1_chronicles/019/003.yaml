translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான வரலாற்று உரைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வசனத்தின் இரு வினாக்க்களும் குற்றஞ்சாட்டும் தொனியும் காக்கப்பட்டுள்ளன; וְלַהֲפֹךְ என்பதிலுள்ள பொருள் விரிவு அடிக்குறிப்பில் விடப்பட்டுள்ளது.
