  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான வரலாற்றுக் கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘போர்முனை’, ‘அணிவகுத்து நிறுத்தினான்’ ஆகியவை இராணுவச் சூழலைத் தெளிவாக்குகின்றன; மூலத்தின் முன்னும் பின்னும் என்ற அமைப்பு பாதுகாக்கப்பட்டுள்ளது.
