  text: וַ/יַּ֣רְא יוֹאָ֗ב כִּֽי הָיְתָ֧ה פְנֵי הַ/מִּלְחָמָ֛ה אֵלָ֖י/ו פָּנִ֣ים וְ/אָח֑וֹר וַ/יִּבְחַ֗ר מִ/כָּל בָּחוּר֙ בְּ/יִשְׂרָאֵ֔ל וַֽ/יַּעֲרֹ֖ךְ לִ/קְרַ֥את אֲרָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/010.yaml
  text: When Joab saw that the battle line was set against him in front and in the rear[b][a], he chose some of the best men from all Israel and arranged them to meet Aram.
translation:
  language: ta
  text: யோவாப், போர்முனை தனக்கு முன்னும் பின்னும் எதிராக அமைந்திருந்ததைக் கண்டபோது, இஸ்ரவேலிலுள்ள சிறந்த வீரர்களில் சிலரைத் தேர்ந்தெடுத்து[a], அராமை[b] எதிர்கொள்ள அவர்களை அணிவகுத்து நிறுத்தினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்ரவேல் முழுவதிலுமிருந்த தேர்ந்த போர்வீரர்களிலிருந்து.” எபிரெயச் சொற்றொடர் தேர்ந்த அல்லது சிறந்த போர்வீரர்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் “அராம்”; இங்கு அராமியப் படைகளைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּרְא
  choice: கண்டபோது
  rationale: ראה என்பதன் அடிப்படை காட்சியுணர்வு பொருளையும், இங்கு போர்ச் சூழலை உணர்ந்துகொண்டதையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: פְנֵי הַמִּלְחָמָה
  choice: போர்முனை
  rationale: சொல்லர்த்தமாக ‘போரின் முகம்/முன்பக்கம்’; இங்கு எதிரிப்படையின் போரணியைக் குறிக்கும் இயல்பான நவீனத் தமிழ்ச் சொல்.
- source_word: אֵלָיו פָּנִים וְאָחוֹר
  choice: தனக்கு முன்னும் பின்னும் ... அமைந்திருந்தது
  rationale: யோவாபின் படை இரு திசைகளிலிருந்தும் எதிர்ப்பைச் சந்தித்த போர்நிலையைத் தெளிவாகக் காட்டி, எபிரெய முன்னும் பின்னும் என்ற முரணிணையைப் பாதுகாக்கிறது.
- source_word: וַיִּבְחַר
  choice: தேர்ந்தெடுத்து
  rationale: בחר என்பதன் வழக்கமான கதைநடைப் பொருளை நேரடியாக வழங்குகிறது.
- source_word: מִכָּל בָּחוּר בְּיִשְׂרָאֵל
  choice: இஸ்ரவேலின் தேர்ந்த வீரர்களிலிருந்து சிலரை
  rationale: இந்த இராணுவச் சூழலில் בָּחוּר இளைஞர்களை மட்டும் அல்லாமல் தேர்ந்த அல்லது சிறந்த போர்வீரர்களைக் குறிக்கிறது; מִן கூறும் குழுவிலிருந்து எடுத்தல் என்ற பொருளை ‘சிலரை’ தெளிவாக்குகிறது.
- source_word: וַיַּעֲרֹךְ
  choice: அணிவகுத்து நிறுத்தினான்
  rationale: போர்ச் சூழலில் ערך படைவீரர்களை ஒழுங்கான போரணியில் நிறுத்துவதைக் குறிக்கிறது.
- source_word: לִקְרַאת אֲרָם
  choice: அராமை எதிர்கொள்ள
  rationale: לקראת என்பதன் சந்திக்க/எதிர்கொள்ள என்ற பொருள்களில், பகைமை நிறைந்த இராணுவச் சூழலுக்கு ‘எதிர்கொள்ள’ இயல்பாகப் பொருந்துகிறது.
- source_word: אֲרָם
  choice: அராம்
  rationale: பிற்கால புவியியல் பெயரைப் பயன்படுத்தாமல் எபிரெயப் பெயரை ஒலிபெயர்க்கிறது; இங்கு அந்த நாட்டின் படைகளைக் குறிக்கிறது.
