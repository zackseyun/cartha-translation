id: 1CH.19.13
reference: 1 Chronicles 19:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: חֲזַ֤ק וְ/נִֽתְחַזְּקָה֙ בְּעַד עַמֵּ֔/נוּ וּ/בְעַ֖ד עָרֵ֣י אֱלֹהֵ֑י/נוּ וַֽ/יהוָ֔ה הַ/טּ֥וֹב בְּ/עֵינָ֖י/ו יַעֲשֶֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/013.yaml
  text: Be strong[a], and let us be strong for our people and for the cities of our God[b], and may Yahweh do what is good in his eyes.
translation:
  language: ta
  text: உறுதியாயிரு[a]; நம் மக்களுக்காகவும் நம் கடவுளின் நகரங்களுக்காகவும் நாம் உறுதியுடன் நிற்போம். யாவே தம் பார்வையில் நல்லதைச் செய்வாராக[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “துணிவாயிரு.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “யாவே தம் பார்வையில் நல்லதைச் செய்வார்.” எபிரெய வினைவடிவத்தை இச்சூழலில் வேண்டுதலாகவோ எதிர்காலக் கூற்றாகவோ புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: חֲזַק
  choice: உறுதியாயிரு
  rationale: חזק என்பதன் ஆண்பால் ஒருமை கட்டளை வடிவம் வலிமையுடனும் துணிவுடனும் இருக்கும்படி அறிவுறுத்துகிறது. போர்ச் சூழலில் ‘உறுதியாயிரு’ என்பது வலிமை, துணிவு ஆகிய இரண்டையும் இயல்பாக உணர்த்துகிறது.
- source_word: וְנִתְחַזְּקָה
  choice: நாம் உறுதியுடன் நிற்போம்
  rationale: Hitpael தன்மை பன்மை விருப்ப வடிவம் தங்களைத் தாங்களே உறுதிப்படுத்திக்கொண்டு தீர்மானமாகச் செயல்படுவதைக் குறிக்கிறது. ‘உறுதியுடன் நிற்போம்’ என்பது அந்தச் சுயஈடுபாட்டையும் கூட்டுத் தீர்மானத்தையும் இயல்பான தமிழில் தருகிறது.
- source_word: בְּעַד
  choice: …க்காக
  rationale: இங்கு ஒருவர் அல்லது ஒன்றின் நலனுக்காகவும் பாதுகாப்புக்காகவும் செயல்படுதல் என்ற பொருள் உள்ளது; தமிழில் ‘…க்காக’ சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: עַמֵּנוּ
  choice: நம் மக்கள்
  rationale: עַם என்பது படையை மட்டும் அல்லாமல் மக்களைக் கூட்டாகக் குறிக்கிறது; ஆகவே ‘நம் மக்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: עָרֵי אֱלֹהֵינוּ
  choice: நம் கடவுளின் நகரங்கள்
  rationale: எபிரெய கட்டமைப்பைத் தெளிவாகப் பிரதிபலித்து, அந்த நகரங்கள் கடவுளுக்குரியவை என்ற கருத்தையும் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எழுத்துகளைக் கொண்ட கடவுளின் தனிப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், நவீன தமிழில் பரவலாகப் புரிந்துகொள்ளக்கூடிய ‘யாவே’ என ஒலிபெயர்க்கிறது.
- source_word: הַטּוֹב בְּעֵינָיו
  choice: தம் பார்வைக்கு நல்லதை
  rationale: ‘அவருடைய கண்களில் நல்லது’ என்ற எபிரெய மரபுத்தொடரின் பார்வை உருவகத்தை இயல்பான தமிழில் காத்து, அவருக்கு நன்றாகவும் சரியாகவும் தோன்றுவதை உணர்த்துகிறது.
- source_word: יַעֲשֶׂה
  choice: செய்வாராக
  rationale: சூழலில் இவ்வினை வடிவம் வேண்டுதலாகவும் எதிர்காலக் கூற்றாகவும் புரியக்கூடும். முதன்மை உரையில் ‘செய்வாராக’ என்பது போருக்கான மனிதத் தீர்மானத்தோடு கடவுளின் முடிவுக்கு பணிவுடன் ஒப்படைப்பதையும் காட்டுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூல உரை ஒரு பொதுப் பட்டத்தை அல்ல, கடவுளின் தனிப்பெயரையே பயன்படுத்துகிறது. அதனால் தனிப்பெயர் ஒலிபெயர்க்கப்பட்டு பாதுகாக்கப்படுகிறது.
- issue: இறுதி வாக்கியத்தின் விருப்ப அல்லது முன்னறிவிப்பு நுட்பம்
  choice: யாவே தம் பார்வைக்கு நல்லதைச் செய்வாராக
  alternative: யாவே தம் பார்வைக்கு நல்லதைச் செய்வார்
  rationale: יַעֲשֶׂה இச்சூழலில் வேண்டுதலாகவும் முன்னறிவிப்பாகவும் வாசிக்கப்படலாம். முதன்மை உரை விருப்பநிலையைத் தேர்ந்தெடுக்கிறது; மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்பட்டு உண்மையான தெளிவின்மை காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், போருக்கான ஊக்கத்தையும் கடவுளின் முடிவுக்கு ஒப்படைக்கும் பணிவையும் இணைக்கும் கண்ணியமான நடை. ‘உறுதியுடன் நிற்போம்’ என்பது சொற்சொற் பிரதிபலிப்பை விட இயல்பான தமிழில் Hitpael வடிவத்தின் தீர்மானமான, சுயஈடுபாட்டு நுட்பத்தை வெளிப்படுத்துகிறது. மரியாதை ஒருமைக்கேற்ப ‘தம்’ பயன்படுத்தப்பட்டது.
