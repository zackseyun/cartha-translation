review_pass:
  verdict: revise
  source_fidelity: 'The conditional comparison of military strength is conveyed accurately. However, the draft introduces ‘வந்து’ (“come”) in both reciprocal-help clauses, though no corresponding verb occurs in the Hebrew, and ‘வேண்டும்’ turns the future commitment into an obligation. The Hebrew has future forms: ‘you will be help/deliverance for me … I will save you.’'
  naturalness: The Tamil is generally clear and modern. ‘நீ எனக்குத் துணையாக வந்து என்னை மீட்க வேண்டும்’ is somewhat overexpanded and carries an unintended obligatory sense. ‘நீ எனக்கு உதவியாக இருப்பாய்’ is natural in this battlefield context while retaining the source’s future pledge.
  terminology: ‘அராம்’ appropriately preserves the ancient name, and ‘அம்மோன் மக்கள்’ naturally represents בני עמון. ‘உதவியாக இருப்பாய்’ conveys the idiomatic force of לִתְשׁוּעָה without importing theological overtones; ‘காப்பாற்றுவேன்’ is an idiomatic military-context rendering of the Hiphil of ישע.
  issues:
  - severity: medium
    issue: The translation adds ‘வந்து’ (“come”) to both help clauses.
    rationale: Neither וְהָיִיתָ (‘you will be’) nor וְהוֹשַׁעְתִּיךָ (‘I will save/deliver you’) explicitly includes motion. The addition is plausible contextually but unnecessary and reduces formal fidelity.
  - severity: medium
    issue: ‘மீட்க வேண்டும்’ renders a future assurance as a requirement.
    rationale: The Hebrew וְהָיִיתָ is a future form in this reciprocal contingency, not a command or statement of duty. Tamil ‘இருப்பாய்’ preserves the pledged future sense.
  revised_text: அவன், “அராம் என்னைவிட வலிமையானதாக இருந்தால்[a], நீ எனக்கு உதவியாக இருப்பாய்[b]; அம்மோன் மக்கள் உன்னைவிட வலிமையானவர்களாக இருந்தால், நான் உன்னைக் காப்பாற்றுவேன்” என்றான்.
