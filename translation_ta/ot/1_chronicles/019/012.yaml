base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/012.yaml
  text: And he said[a], “If Aram is too strong for me, then you shall be my salvation; but if the Ammonites are too strong for you[b], then I will save you.”
translation:
  language: ta
  text: அவன், “அராம் என்னைவிட வலிமையானதாக இருந்தால்[a], நீ எனக்கு உதவியாக இருப்பாய்[b]; அம்மோன் மக்கள் உன்னைவிட வலிமையானவர்களாக இருந்தால், நான் உன்னைக் காப்பாற்றுவேன்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், “அராம் என்னைவிட வலிமையாயிருந்தால்”; அதேபோல் பின்னர், “அம்மோன் மக்கள் உன்னைவிட வலிமையாயிருந்தால்.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “நீ எனக்கு மீட்பாக இருப்பாய்”; போரில் உதவி செய்து காப்பாற்றுவதைச் குறிக்கும் சொற்றொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֶּחֱזַק / יֶחֶזְקוּ (חזק)
  choice: வலிமைமிக்கதாக / வலிமைமிக்கவர்களாக இருந்தால்
  rationale: מן என்பதுடன் வரும் חזק இங்கு போரில் ஒப்பீட்டு வலிமையைக் குறிக்கிறது. ‘என்னைவிட/உன்னைவிட வலிமைமிக்க’ என்பது ‘மேற்கொண்டால்’ என்று முடிவை முன்கூட்டியே நிர்ணயிக்காமல் எபிரெயச் சொல்லின் நிபந்தனைத் தன்மையைப் பாதுகாக்கிறது.
- source_word: אֲרָם
  choice: அராம்
  rationale: மூலத்தில் உள்ள மக்கள் அல்லது அரசியல் அமைப்பின் பெயரைப் பிற்கால ‘சீரியா’ என்ற பெயரால் மாற்றாமல் ஒலிபெயர்க்கிறது. எபிரெயத்தில் ஒருமை வினை வந்திருப்பதால் தமிழிலும் ‘அராம்’ ஒருமையாகக் கொள்ளப்பட்டுள்ளது.
- source_word: וְהָיִיתָ לִּי לִתְשׁוּעָה
  choice: நீ எனக்குத் துணையாக வந்து என்னை மீட்க வேண்டும்
  rationale: சொல்லுக்குச் சொல் ‘நீ எனக்கு மீட்பாக இருப்பாய்’ என்றாலும், போர்ச் சூழலில் இது உதவிக்கு வந்து விடுவிப்பதைக் குறிக்கும் இயல்பான சொற்றொடர். தமிழ் வாசகருக்கு தெளிவாக இருக்கும்படி செயற்பாட்டு வடிவில் தரப்பட்டுள்ளது.
- source_word: בְּנֵי עַמּוֹן
  choice: அம்மோன் மக்கள்
  rationale: சொல்லுக்குச் சொல் ‘அம்மோனின் மகன்கள்’; இங்கு இனக்குழுவைக் குறிக்கும் வழக்குச் சொற்றொடராதலால் ‘அம்மோன் மக்கள்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: וְהוֹשַׁעְתִּיךָ (ישע)
  choice: நான் வந்து உன்னை மீட்பேன்
  rationale: ישע என்பதன் ஹிஃபில் வடிவம் காப்பாற்றுதல் அல்லது விடுவித்தலைக் குறிக்கிறது. இப்போர்ச் சூழலில் ‘மீட்பேன்’ பொருத்தமானது; பரஸ்பரம் உதவிக்கு வருதல் என்பதைக் காட்ட ‘வந்து’ இயல்பாகச் சேர்க்கப்பட்டுள்ளது.
- source_word: וַיֹּאמֶר
  choice: அவன் … என்றான்
  rationale: எபிரெயக் கதைநடையின் வழக்கமான உரையறிவிப்பை நவீனத் தமிழின் இயல்பான நேரடி உரை அமைப்பில் தருகிறது.
