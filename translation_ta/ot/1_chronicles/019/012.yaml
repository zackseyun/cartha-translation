translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமானதும் பொதுவாசகருக்கு எளிதில் புரியக்கூடியதுமான நடை. போர்ச் சூழலைத் தெளிவாக்கும் இயல்பான தமிழ் பயன்படுத்தப்பட்டாலும், ஒப்பீட்டு வலிமையையும் பரஸ்பர மீட்பு உறுதியையும் மூலத்தின்படி காக்கிறது.
