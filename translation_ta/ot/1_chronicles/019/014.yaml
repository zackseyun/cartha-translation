source:
  edition: WLC
  text: וַ/יִּגַּ֨שׁ יוֹאָ֜ב וְ/הָ/עָ֧ם אֲשֶׁר עִמּ֛/וֹ לִ/פְנֵ֥י אֲרָ֖ם לַ/מִּלְחָמָ֑ה וַ/יָּנ֖וּסוּ מִ/פָּנָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/014.yaml
  text: So Joab and the people who were with him advanced before Aram for battle[a], and they fled before him.
translation:
  language: ta
  text: ஆகவே, யோவாபும் அவனுடன் இருந்த மக்களும் ஆராமை எதிர்த்துப் போரிட முன்சென்றார்கள்[a]; ஆராமியர்கள் அவனுக்கு முன்பாக ஓடிப்போனார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆராமுக்கு முன்பாகப் போருக்காக நெருங்கிச் சென்றார்கள்.” எபிரெய உரை இயற்பெயரான “ஆராம்” என்பதுடன் “முன்பாக” என்ற இடஞ்சார்ந்த மரபுத்தொடரைப் பயன்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: முன்னேறினார்கள்
  rationale: נגשׁ என்பதன் அடிப்படைப் பொருள் ‘நெருங்குதல்/அணுகுதல்.’ போர்ச் சூழலில் படைகள் மோதலை நோக்கிச் செல்வதை இயல்பான நவீனத் தமிழில் ‘முன்னேறினார்கள்’ தெளிவாகக் காட்டுகிறது.
- source_word: וְהָעָם אֲשֶׁר עִמּוֹ
  choice: அவனுடன் இருந்த மக்களும்
  rationale: הָעָם என்பதன் நேரடிப் பொருளான ‘மக்கள்’ என்பதைக் காத்திருக்கிறது; இச்சூழலில் அவர்கள் போர்வீரர்கள் என்ற கருத்தை உரையில் தேவையின்றி வெளிப்படையாக்கவில்லை.
- source_word: לִפְנֵי אֲרָם
  choice: ஆராமை எதிர்த்து
  rationale: לִפְנֵי என்பதன் இடஞ்சார்ந்த அடிப்படை உணர்வு ‘முன்னே/முன்னிலையில்’ என்பதாக இருந்தாலும், போர்ச் சூழலில் ஆராமின் படையை எதிர்கொள்ளச் சென்றதை ‘ஆராமை எதிர்த்து’ என்பது இயல்பாகத் தெரிவிக்கிறது. மூலமொழியின் சொற்றொடர் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: אֲרָם
  choice: ஆராம்
  rationale: இது இடம் அல்லது மக்களைக் குறிக்கக்கூடிய இயற்பெயர். காலத்துக்கு ஒவ்வாத ‘சிரியா’ என்பதையும், உரையிலேயே ‘ஆராமியர்கள்’ என விளக்குவதையும் தவிர்த்து இயற்பெயர் ஒலிபெயர்க்கப்பட்டது.
- source_word: לַמִּלְחָמָה
  choice: போரிட
  rationale: இந்தச் சொற்றொடர் அணுகிச் சென்றதன் நோக்கத்தைச் சுட்டுகிறது. ‘போரிட’ என்பது சுருக்கமான, இயல்பான தமிழில் அந்த நோக்கத்தைத் தருகிறது.
- source_word: וַיָּנוּסוּ
  choice: தப்பியோடினார்கள்
  rationale: נוס என்பது ஆபத்திலிருந்து ஓடித் தப்புவதைக் குறிக்கிறது. ‘பின்வாங்கினார்கள்’ என்பதைவிட ‘தப்பியோடினார்கள்’ மூலத்தின் வலிமையைச் சிறப்பாகக் காக்கிறது.
- source_word: מִפָּנָיו
  choice: அவனிடமிருந்து
  rationale: எழுத்துப்படி ‘அவனுடைய முகம்/முன்னிலையிலிருந்து.’ தமிழில் ‘அவனிடமிருந்து தப்பியோடினார்கள்’ என்பது அதே போர்க்கள உறவை இயல்பாகத் தெரிவிக்கிறது; ஒருமைச் சுட்டுப்பெயர் யோவாபைக் குறிப்பதாகக் காக்கப்பட்டது.
