translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குத் தெளிவாகவும் கண்ணியமான வரலாற்று உரைநடையிலும் மொழிபெயர்க்கப்பட்டது. நீண்ட எபிரெய இணைப்பு வாக்கியம் தமிழில் மூன்று வாக்கியங்களாகப் பிரிக்கப்பட்டது. அடிக்குறிப்பு குறிகள் அவை விளக்கும் எண்ணிக்கை மற்றும் பெயருடன் நேரடியாக இணைக்கப்பட்டுள்ளன.
