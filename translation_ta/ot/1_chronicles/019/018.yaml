  text: וַ/יָּ֣נָס אֲרָם֮ מִ/לִּ/פְנֵ֣י יִשְׂרָאֵל֒ וַ/יַּהֲרֹ֨ג דָּוִ֜יד מֵ/אֲרָ֗ם שִׁבְעַ֤ת אֲלָפִים֙ רֶ֔כֶב וְ/אַרְבָּעִ֥ים אֶ֖לֶף אִ֣ישׁ רַגְלִ֑י וְ/אֵ֛ת שׁוֹפַ֥ךְ שַֽׂר הַ/צָּבָ֖א הֵמִֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/018.yaml
  text: And Aram fled before Israel[a], and David killed seven thousand chariot warriors from Aram and forty thousand foot soldiers[b], and he put Shophach the commander of the army to death.
translation:
  language: ta
  text: அராம் படை இஸ்ரவேலருக்கு முன்பாகத் தப்பியோடியது. தாவீது அராம் படையைச் சேர்ந்த தேர்ப்படை வீரர்கள் ஏழாயிரம் பேரையும் காலாட்படை வீரர்கள் நாற்பதாயிரம் பேரையும் கொன்றான்.[a] படைத்தளபதியான ஷோஃபாக்கையும்[b] அவன் கொன்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதற்கு இணையான 2 சாமுவேல் 10:18-ல், “எழுநூறு தேர்களையும் நாற்பதாயிரம் குதிரைப்படை வீரர்களையும்” என்று உள்ளது. இங்கு 1 நாளாகமம், “ஏழாயிரம் தேர்ப்படை வீரர்களையும் நாற்பதாயிரம் காலாட்படை வீரர்களையும்” என்று வாசிக்கிறது.
    reason: textual_variant
  - marker: b
    text: இணையான 2 சாமுவேல் 10:16, 18 பகுதிகளில் இந்தப் பெயர் “ஷோபாக்” (Shobach) என்ற வடிவில் உள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: אֲרָם
  choice: அராம் படை
  rationale: எபிரெயப் பெயரான ‘அராம்’ என்பதைக் காத்து, இச்சூழலில் அந்த நாட்டின் போர்ப்படையைக் குறிப்பது தெளிவாக இருக்க ‘படை’ சேர்க்கப்பட்டது.
- source_word: וַיָּנָס
  choice: தப்பியோடியது
  rationale: נוּס என்பதன் போர்ச் சூழலுக்குரிய நேரான பொருள் ‘தப்பியோடு’; இது சாதாரண நவீன தமிழிலும் இயல்பாக உள்ளது.
- source_word: מִלִּפְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலருக்கு முன்னால்
  rationale: ‘இஸ்ரவேலின் முகத்திற்கு முன்பிருந்து’ என்ற எபிரெய மரபுத்தொடர், போரில் எதிரியின் முன்னிலையிலிருந்து ஓடுவதைச் சுட்டுகிறது; தமிழில் ‘முன்னால்’ அந்த உறவை இயல்பாகத் தெரிவிக்கிறது.
- source_word: וַיַּהֲרֹג דָּוִיד
  choice: தாவீது ... கொன்றான்
  rationale: הרג என்பதன் அடிப்படைப் பொருளைத் தெளிவான, தற்போதைய தமிழில் நேரடியாக வழங்குகிறது.
- source_word: שִׁבְעַת אֲלָפִים רֶכֶב
  choice: தேர்ப்படை வீரர்கள் ஏழாயிரம் பேர்
  rationale: רֶכֶב என்பது சொற்படியாகத் தேர் அல்லது தேர்ப்படையைக் குறிக்கும். இங்கு எண்ணப்படுவது தேருடன் போரிடும் படைவீரர்கள் எனும் ஆகுபெயர்ப் பொருளில் எடுத்துக்கொள்ளப்பட்டது; ‘தேரோட்டிகள்’ என்று குறுக்காமல் ‘தேர்ப்படை வீரர்கள்’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: וְאַרְבָּעִים אֶלֶף אִישׁ רַגְלִי
  choice: காலாட்படை வீரர்கள் நாற்பதாயிரம் பேர்
  rationale: אִישׁ רַגְלִי என்பதன் ‘காலால் செல்லும் மனிதன்’ என்ற இராணுவப் பொருளை இயல்பான தமிழில் ‘காலாட்படை வீரர்’ என வழங்குகிறது.
- source_word: שׁוֹפַךְ
  choice: ஷோபக்
  rationale: நாளாகம நூலின் எபிரெய வடிவை ஒலிபெயர்த்து வழங்குகிறது; சாமுவேல் இணைப்பகுதியிலுள்ள வேறு பெயர் வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: שַׂר הַצָּבָא
  choice: படைத்தளபதி
  rationale: இராணுவத்தின் தலைமை அதிகாரியைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கும் நவீனத் தமிழ்ச் சொல்.
- source_word: הֵמִית
  choice: அவனைக் கொன்றான்
  rationale: Hiphil வடிவம் ‘சாகும்படி செய்தான்/கொன்றான்’ எனப் பொருள்படும். செயற்கையான சொற்றொடரைத் தவிர்த்து, சூழலில் இயல்பான ‘கொன்றான்’ பயன்படுத்தப்பட்டது.
