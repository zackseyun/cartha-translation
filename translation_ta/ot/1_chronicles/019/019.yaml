base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/019.yaml
  text: When the servants of Hadadezer saw that they had been defeated before Israel[a], they made peace with David and served him. And Aram was no longer willing to help the sons of Ammon.
translation:
  language: ta
  text: ஹததேசெரின் பணியாளர்கள் தாங்கள் இஸ்ரவேலால் தோற்கடிக்கப்பட்டதைக் கண்டபோது, தாவீதுடன் சமாதானம் செய்து, அவருக்குப் பணி செய்தார்கள். அராம் அம்மோனியருக்கு[a] இனி உதவ விரும்பவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் எழுத்துப்படி, ‘அம்மோனின் மகன்கள்’; இது அம்மோனியர்களைக் குறிக்கும் இனப்பெயர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדֵי
  choice: பணியாளர்கள்
  rationale: அரசு மற்றும் போர் சார்ந்த இச்சூழலில், இது ஹததேசெருக்குக் கீழ்ப்பட்ட அதிகாரிகள் அல்லது குடிமக்களைக் குறிக்கிறது; அடிமைநிலையைத் தேவையின்றி வலியுறுத்தாமல் கீழ்ப்படிதலைக் காட்டுகிறது.
- source_word: נִגְּפוּ
  choice: தோற்கடிக்கப்பட்டார்கள்
  rationale: இங்கு இந்த வினை போரில் தோல்வியடைந்ததைக் குறிக்கிறது; கொல்லப்பட்டதாக மிகைப்படுத்தாமல் இராணுவத் தோல்வியை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: לִפְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலால்
  rationale: எழுத்துப்படி ‘இஸ்ரவேலுக்கு முன்பாக’ என்றாலும், போர் சூழலில் இச்சொற்றொடர் இஸ்ரவேலின் கையால் ஏற்பட்ட தோல்வியைக் குறிக்கிறது; தமிழில் செய்பவரைத் தெளிவாகக் காட்டும் இயல்பான வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- source_word: וַיַּשְׁלִימוּ עִם דָּוִיד
  choice: தாவீதுடன் சமாதானம் செய்தார்கள்
  rationale: இந்த வினைச்சொல் அமைதி ஏற்படுத்துதல் அல்லது சமாதான உடன்பாடு செய்தல் என்னும் பொருளைத் தருகிறது.
- source_word: וַיַּעַבְדֻהוּ
  choice: அவருக்குப் பணிசெய்தார்கள்
  rationale: சமாதானத்துக்குப் பின் தாவீதுக்குக் கீழ்ப்பட்ட அரசியல் சேவையை இது குறிக்கிறது; எபிரெய வினையின் சுருக்கத்தையும் காக்கிறது.
- source_word: אָבָה
  choice: விரும்பவில்லை
  rationale: இந்த வினை விருப்பம் அல்லது சம்மதத்தைக் குறிக்கிறது; மறுப்புச் சொல்லுடனும் ‘இனி’ என்பதுடனும் சேர்ந்து தொடர்ந்து உதவ மனமில்லாத நிலையைத் தெரிவிக்கிறது.
- source_word: אֲרָם
  choice: அராம்
  rationale: எபிரெயப் பெயரை ‘சீரியா’ போன்ற பிற்கால அரசியல் பெயரால் மாற்றாமல் ஒலிபெயர்த்து, இங்கு கூட்டுப் பொருளில் உள்ளபடியே வைக்கிறது.
- source_word: לְהוֹשִׁיעַ
  choice: உதவ
  rationale: வினை பொதுவாகக் காப்பாற்றுதல் அல்லது விடுவித்தல் எனப் பொருள்படலாம்; இப்போர் கூட்டணி சூழலில் படை உதவி வழங்குதலே கருத்து.
- source_word: בְּנֵי עַמּוֹן
  choice: அம்மோனியர்
  rationale: எழுத்துப்படி ‘அம்மோனின் மகன்கள்’ என்றாலும், இது ஓர் இனக்குழுவைக் குறிக்கும் வழக்கமான எபிரெயப் பெயரமைப்பு; ‘அம்மோனியர்’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: עוֹד
  choice: இனி
  rationale: மறுப்புடன் சேர்ந்துள்ளதால், முன்புபோல் தொடர்ந்து உதவாத நிலையை ‘இனி’ இயல்பாக வெளிப்படுத்துகிறது.
