base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/004.yaml
  text: So Hanun took David’s servants[a], shaved them, cut their garments in half up to the hips[b], and sent them away.
translation:
  language: ta
  text: அப்போது ஆனூன் தாவீதின் பணியாளர்களைப் பிடித்து[a], அவர்களை மழித்து, அவர்களுடைய ஆடைகளைப் புட்டம் வரை இரண்டாக வெட்டி[b], அவர்களை அனுப்பிவிட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 2 சாமுவேல் 10:4-இல் உள்ள இணை விவரம், ஆனூன் அவர்களுடைய தாடிகளில் பாதியை மழித்தான் என்று குறிப்பிடுகிறது. ஆனால் நாளாகமம், அவன் ‘அவர்களை மழித்தான்’ என்று மட்டுமே கூறுகிறது.
    reason: cross_reference
  - marker: b
    text: அல்லது, ‘உடலின் பின்புறப் பகுதி வரை.’ எபிரெயச் சொல் புட்டம் அல்லது உடலின் பின்புறப் பகுதியைக் குறிக்கிறது; உடல் வெளிப்படும்படி செய்து அவர்களைப் பொதுவில் அவமானப்படுத்தியதை இது வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדֵי
  choice: பணியாளர்கள்
  rationale: இச்சொல் அடிமைகளையோ பணியாளர்களையோ குறிக்கலாம். இங்கு தாவீதின் சார்பில் வந்த அரசத் தூதர்களைக் குறிப்பதால், அவர்களுடைய சேவைப் பங்கை இயல்பாக வெளிப்படுத்தும் ‘பணியாளர்கள்’ பொருத்தமானது.
- source_word: וַיְגַלְּחֵם
  choice: அவர்களுக்கு மழித்து
  rationale: எபிரெய வினை பொதுவாக ‘மழித்தல்’ என்று பொருள்படும்; எதை மழித்தான் என்பதை நாளாகமம் குறிப்பிடவில்லை. எனவே இணை வசனத்திலுள்ள தாடி பற்றிய விவரத்தை முதன்மை உரைக்குள் சேர்க்காமல் மூலத்தின் சுருக்கம் காக்கப்படுகிறது.
- source_word: מַדְוֵיהֶם
  choice: அவர்களுடைய ஆடைகள்
  rationale: இச்சொல் உடைகள் அல்லது ஆடைகளைக் குறிக்கிறது. நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ள ‘ஆடைகள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: בַּחֵצִי
  choice: பாதியாக
  rationale: ஆடைகள் பாதியளவு வெட்டப்பட்டதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: עַד הַמִּפְשָׂעָה
  choice: பின்புறம் வரை
  rationale: எபிரெயச் சொல் புட்டம் அல்லது உடலின் பின்புறப் பகுதியைக் குறிக்கிறது. ‘பின்புறம் வரை’ பொதுவாசிப்புக்கு ஏற்ற மரியாதையான நடையில் அமைந்தாலும், துல்லியமான உடற்பகுதி அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וַיְשַׁלְּחֵם
  choice: அவர்களை அனுப்பிவிட்டான்
  rationale: அவமானப்படுத்திய பின் அவர்களை அங்கிருந்து அனுப்பிய செயலின் முடிவுத்தன்மையை இயல்பான தமிழில் காட்டுகிறது.
