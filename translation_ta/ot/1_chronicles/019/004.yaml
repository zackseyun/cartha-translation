revisions:
- from: ஆகவே ஆனூன் தாவீதின் பணியாளர்களைப் பிடித்து[a], அவர்களுக்கு மழித்து, அவர்களுடைய ஆடைகளைப் பின்புறம் வரை பாதியாக வெட்டி[b], அவர்களை அனுப்பிவிட்டான்.
  to: அப்போது ஆனூன் தாவீதின் பணியாளர்களைப் பிடித்து[a], அவர்களை மழித்து, அவர்களுடைய ஆடைகளைப் புட்டம் வரை இரண்டாக வெட்டி[b], அவர்களை அனுப்பிவிட்டான்.
