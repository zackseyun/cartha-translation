translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமானதும் பொதுவாசகர்களுக்கு எளிதில் புரியக்கூடியதுமான நடை பயன்படுத்தப்பட்டுள்ளது. நாளாகமத்தில் குறிப்பிடப்படாத ‘தாடி’ முதன்மை உரையில் சேர்க்கப்படவில்லை; இணை வசனத்தின் கூடுதல் விவரம் அடிக்குறிப்பில் மட்டும் தரப்பட்டுள்ளது. ‘மִפְשָׂעָה’ என்பதன் உடற்கூறு துல்லியமும் பொதுவாசிப்புக்கான மரியாதை நடையும் உரை–அடிக்குறிப்பு இணைப்பால் பேணப்பட்டுள்ளன.
