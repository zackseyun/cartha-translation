id: 1CH.19.1
reference: 1 Chronicles 19:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יְהִי֙ אַחֲרֵי כֵ֔ן וַ/יָּ֕מָת נָחָ֖שׁ מֶ֣לֶךְ בְּנֵי עַמּ֑וֹן וַ/יִּמְלֹ֥ךְ בְּנ֖/וֹ תַּחְתָּֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/001.yaml
  text: After this, Nahash king of the Ammonites died, and his son reigned in his place.
translation:
  language: ta
  text: இதற்குப் பிறகு, அம்மோனியரின் அரசனாகிய நாகாஸ் இறந்தான்; அவனுக்குப் பதிலாக அவன் மகன் அரசாண்டான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: இதற்குப் பிறகு
  rationale: எபிரெயக் கதைத் தொடரின் காலமாற்றத்தைக் காட்டும் சொற்றொடரை, அதன் பொருளைப் பாதுகாத்து இயல்பான நவீனத் தமிழில் வழங்குகிறது.
- source_word: וַיָּמָת
  choice: இறந்தான்
  rationale: מות என்ற வினையின் நேரடியான பொருளை மென்மைப்படுத்தாமல் தெளிவாகக் கூறுகிறது.
- source_word: נָחָשׁ
  choice: நாகாஸ்
  rationale: எபிரெயத் தனிப்பெயரின் ஒலியைத் தமிழில் இயன்றவரை பிரதிபலிக்கும் எழுத்துப்பெயர்ப்பு.
- source_word: מֶלֶךְ בְּנֵי עַמּוֹן
  choice: அம்மோனியரின் அரசனாகிய
  rationale: சொல்லுக்குச் சொல் 'அம்மோனின் மக்களின் அரசன்' என்ற கருத்தை, தமிழில் வழக்கமான இனமக்கள் குறிப்பு மூலம் தெளிவாக வழங்குகிறது.
- source_word: וַיִּמְלֹךְ
  choice: அரசாண்டான்
  rationale: מלך இங்கு அரச அதிகாரத்தை ஏற்று ஆட்சி செய்ததைக் குறிக்கிறது; 'அரசாண்டான்' சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: בְּנוֹ
  choice: அவன் மகன்
  rationale: ஆண்பால் ஒருமை உரிமைச் சுட்டு நாகாஸைக் குறிப்பதைத் தெளிவாகப் பிரதிபலிக்கிறது.
- source_word: תַּחְתָּיו
  choice: அவனுக்குப் பதிலாக
  rationale: அரசப் பதவியில் ஏற்பட்ட வாரிசுரிமை மாற்றத்தை இயல்பான தமிழில் துல்லியமாகத் தெரிவிக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிமையானதாயும் கண்ணியமானதாயும் உள்ள வரலாற்றுக் கதைநடை. தேவையற்ற பழமையான வடிவங்களும் விளக்கச் சேர்க்கைகளும் தவிர்க்கப்பட்டுள்ளன.
