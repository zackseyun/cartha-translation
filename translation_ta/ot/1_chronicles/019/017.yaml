  source_fidelity: 'மொத்தத்தில் எபிரேயக் கதைத்தொடர், ‘ஆராம்’ என்னும் பெயர், மற்றும் அணிவகுத்து எதிர்கொள்ளும் போர்ச் சூழல் நன்றாகப் பிரதிபலிக்கப்படுகின்றன. ஆனால் וַיִּלָּחֲמוּ עִמּוֹ என்பதன் இச்சூழல்சார் எதிர்மறைப் பொருளை முதன்மை உரையில் தெளிவாக்க வேண்டும்: ‘அவனோடு போரிட்டார்கள்’ என்பது நவீன தமிழில் தாவீதுடன் இணைந்து போரிட்டார்கள் என்றும் புரிந்துகொள்ளப்படலாம்.'
  naturalness: ‘படைகளை அணிவகுத்தான்’ என்பது இயல்பானது என்றாலும், மூலத்தில் வெளிப்படையாக இல்லாத உட்பொருளைச் சேர்க்கிறது. ‘எதிராக அணிவகுத்தான்’ என்பது சுருக்கமாகவும் மூலத்துக்கு நெருக்கமாகவும் உள்ளது. இரண்டாம் இடத்தில் ‘ஆராமை எதிர்கொள்ளப் போருக்காக அணிவகுத்தான்’ என்பது தெளிவான நவீன நடை.
