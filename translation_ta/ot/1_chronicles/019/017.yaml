  text: וַ/יֻּגַּ֣ד לְ/דָוִ֗יד וַ/יֶּאֱסֹ֤ף אֶת כָּל יִשְׂרָאֵל֙ וַ/יַּעֲבֹ֣ר הַ/יַּרְדֵּ֔ן וַ/יָּבֹ֣א אֲלֵ/הֶ֔ם וַֽ/יַּעֲרֹ֖ךְ אֲלֵ/הֶ֑ם וַ/יַּעֲרֹ֨ךְ דָּוִ֜יד לִ/קְרַ֤את אֲרָם֙ מִלְחָמָ֔ה וַ/יִּֽלָּחֲמ֖וּ עִמּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/017.yaml
  text: When it was reported to David[a], he gathered all Israel, crossed the Jordan, came against them, and drew up in battle formation against them. Then David drew up for battle to meet Aram, and they fought with him.
translation:
  language: ta
  text: அது தாவீதுக்கு அறிவிக்கப்பட்டபோது, அவன் இஸ்ரவேலர் அனைவரையும் ஒன்றுகூட்டி, யோர்தானைக் கடந்து, அவர்களிடம் வந்து, அவர்களுக்கு எதிராக அணிவகுத்தான். பின்னர் தாவீது ஆராமை எதிர்கொள்ளப் போருக்காக அணிவகுத்தான்; அவர்கள் அவனுக்கு எதிராகப் போரிட்டார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில் நேரடியாக, “அவர்கள் அவனோடு போரிட்டார்கள்” என்று உள்ளது. இச்சூழலில் அது தாவீதுக்கு எதிராகப் போரிட்டதைக் குறிக்கிறது.
    reason: எபிரேய முன்னிடைச்சொல்லின் சொற்சார்ந்த வடிவத்தையும், இப்போர்ச் சூழலில் தேவையான எதிர்மறைப் பொருளையும் காட்டுகிறது.
lexical_decisions:
- source_word: וַיֻּגַּד לְדָוִיד
  choice: அது தாவீதுக்கு அறிவிக்கப்பட்டபோது
  rationale: எபிரேய மறைசெயப்பாட்டு வடிவத்தில் அறிவித்தவர் குறிப்பிடப்படவில்லை. சூழலில் முந்தைய நிகழ்வு அறிவிக்கப்பட்டதைக் குறிக்க ‘அது’ பயன்படுத்தப்பட்டு, தொடரின் காலத் தொடர்பு ‘போது’ என்பதால் இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: וַיֶּאֱסֹף אֶת כָּל יִשְׂרָאֵל
  choice: அவன் இஸ்ரவேலர் அனைவரையும் ஒன்றுகூட்டி
  rationale: אָסַף என்பதன் ‘ஒன்றுகூட்டுதல்’ என்ற அடிப்படைப் பொருளையும், இங்கு உள்ள படைதிரட்டும் சூழலையும் அதிக விளக்கமின்றி தக்கவைக்கிறது.
- source_word: וַיַּעֲבֹר הַיַּרְדֵּן
  choice: யோர்தானைக் கடந்து
  rationale: עבר என்ற வினையின் நேரடியான, இயல்பான தமிழாக்கம்.
- source_word: וַיָּבֹא אֲלֵיהֶם
  choice: அவர்களிடம் வந்து
  rationale: בוא אל என்பதன் திசைசார்ந்த பொருளை நடுநிலையாகத் தக்கவைக்கிறது; பகைமை அடுத்த சொற்றொடரில் தெளிவாகிறது.
- source_word: וַיַּעֲרֹךְ אֲלֵיהֶם
  choice: அவர்களுக்கு எதிராகப் படைகளை அணிவகுத்தான்
  rationale: ערך என்பதன் போர்ச் சூழலிலான படைகளை ஒழுங்குபடுத்தும் பொருளைத் தெளிவான நவீன தமிழில் வெளிப்படுத்துகிறது. எபிரேயத்தில் வெளிப்படையாக இல்லாத ‘தன் படைகளை’ என்பதற்குப் பதிலாக பொதுவான ‘படைகளை’ பயன்படுத்துகிறது.
- source_word: וַיַּעֲרֹךְ דָּוִיד לִקְרַאת אֲרָם מִלְחָמָה
  choice: தாவீது ஆராமைச் சந்திக்கப் போருக்கு அணிவகுத்தான்
  rationale: மீண்டும் வரும் ערך என்பதற்கு ‘அணிவகுத்தான்’ என்று ஒரே சொல்லாட்சி வைக்கப்பட்டுள்ளது; לִקְרַאת என்பதன் ‘சந்திக்க/எதிர்கொள்ள’ என்ற இயக்கப் பொருளும் מִלְחָמָה என்பதன் போர்ச் சூழலும் தக்கவைக்கப்பட்டுள்ளன.
- source_word: אֲרָם
  choice: ஆராம்
  rationale: பிற்கால அரசியல் பெயரான ‘சிரியா’ என்பதைக் கொண்டுவராமல், எபிரேயப் பெயரை ஒலிபெயர்க்கிறது; ‘ஆராமியர்’ என்று கூட்டுப் பொருளைத் தீர்மானிப்பதையும் தவிர்க்கிறது.
- source_word: וַיִּלָּחֲמוּ עִמּוֹ
  choice: அவர்கள் அவனோடு போரிட்டார்கள்
  rationale: עִמּוֹ என்பதன் நேரடியான ‘அவனோடு’ வடிவத்தைத் தக்கவைக்கிறது. தமிழிலும் இச்சொற்றொடர் மோதலைக் குறிக்க இயலும்; இருப்பினும் ‘எதிராக’ என்ற சூழல்சார் வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
