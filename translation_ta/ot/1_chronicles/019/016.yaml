  text: וַ/יַּ֣רְא אֲרָ֗ם כִּ֣י נִגְּפוּ֮ לִ/פְנֵ֣י יִשְׂרָאֵל֒ וַֽ/יִּשְׁלְחוּ֙ מַלְאָכִ֔ים וַ/יּוֹצִ֣יאוּ אֶת אֲרָ֔ם אֲשֶׁ֖ר מֵ/עֵ֣בֶר הַ/נָּהָ֑ר וְ/שׁוֹפַ֛ךְ שַׂר צְבָ֥א הֲדַדְעֶ֖זֶר לִ/פְנֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/016.yaml
  text: When Aram saw that they had been defeated before Israel[a], they sent messengers and brought out the Arameans who were from beyond the River[b], with Shophach the commander of Hadadezer’s army before them.
translation:
  language: ta
  text: அராம்[a] தாங்கள் இஸ்ரவேலுக்கு முன்பாகத் தோற்கடிக்கப்பட்டதைக் கண்டபோது, தூதுவர்களை அனுப்பி, ஆற்றுக்கு அப்பாலிருந்த[b] அராமியர்களை வரவழைத்தது. அதாதேசரின் படைத்தளபதியான சோபாக் அவர்களுக்கு முன்பாக இருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மரபுவழியாக ‘சீரியா’ என்றும் மொழிபெயர்க்கப்படுகிறது; எபிரெயத்தில் ‘அராம்’ என்று உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, யூபிராத்து ஆற்றுக்கு அப்பாலிருந்தவர்கள் என இருக்கலாம்; எபிரெயத்தில் ‘ஆற்றுக்கு அப்பால்’ என்று மட்டுமே உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרָם
  choice: அராமியர்
  rationale: இங்கு இப்பெயர் முதலில் அராம் மக்களையும் பின்னர் வரவழைக்கப்பட்ட அராமியப் படையினரையும் குறிக்கிறது. நவீன தமிழில் கூட்டு மக்களைக் குறிக்கும் வகையில் ‘அராமியர்’ இயல்பாக உள்ளது; எபிரெயப் பெயரையும் காக்கிறது.
- source_word: נִגְּפוּ
  choice: தோற்கடிக்கப்பட்டது
  rationale: போர்ச் சூழலில் இவ்வினைச்சொல்லின் செயப்பாட்டு வடிவம் தோல்வியடைந்ததைக் குறிக்கிறது; முற்றிலும் அழிக்கப்பட்டதாக மிகைப்படுத்தாமல் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: לִפְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலுக்கு முன்பாக
  rationale: ‘இஸ்ரவேலின் முகத்திற்கு முன்பாக’ என்ற எபிரெய மரபுத்தொடரின் வடிவத்தை இயன்றவரை காக்கிறது; சூழலில் இஸ்ரவேலிடம் ஏற்பட்ட தோல்வி என்பது தெளிவாகிறது.
- source_word: מַלְאָכִים
  choice: தூதுவர்கள்
  rationale: இது அரசியல்-போர்ச் சூழல் என்பதால் மனிதத் தூதர்களையே குறிக்கிறது; தேவதூதர்களை அல்ல.
- source_word: וַיּוֹצִיאוּ אֶת אֲרָם
  choice: அராமியரை வரவழைத்தார்கள்
  rationale: ‘வெளியே வரச் செய்தார்கள்’ என்ற காரணவினையின் கருத்தை, கூடுதல் படையினரை அழைத்துவரும் இச்சூழலில் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: מֵעֵבֶר הַנָּהָר
  choice: ஆற்றுக்கு அப்பாலிருந்த
  rationale: எபிரெயம் ஆற்றின் பெயரைக் குறிப்பிடாமல் ‘ஆற்றுக்கு அப்பால்’ என்று மட்டுமே கூறுகிறது. அது யூபிராத்து ஆறாக இருக்கலாம் என்றாலும், மூலத்தின் பொதுவான சொல்லாட்சி முதன்மை உரையில் காக்கப்படுகிறது.
- source_word: שַׂר צְבָא הֲדַדְעֶזֶר
  choice: அதாதேசரின் படைத்தளபதி
  rationale: இது வழக்கமான இராணுவப் பதவி; நவீன தமிழில் அதன் நிலையும் பணியும் தெளிவாகத் தெரிவிக்கப்படுகிறது.
- source_word: לִפְנֵיהֶם
  choice: அவர்களுக்கு முன்பாக இருந்தான்
  rationale: ‘அவர்களுக்கு முன்பாக’ என்ற மூலத்தின் இடவியல் சொல்லாட்சியைப் பாதுகாக்கிறது; அவர் படையை வழிநடத்தினார் என்று விளக்கி மொழிபெயர்த்து தெளிவின்மையை நீக்கவில்லை.
