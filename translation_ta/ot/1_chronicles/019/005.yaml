base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/005.yaml
  text: They went and told David about the men[a], and he sent to meet them, because the men were greatly humiliated. And the king said, “Stay in Jericho until your beards have grown back[b], then return.”
translation:
  language: ta
  text: அவர்கள் போய், அந்த மனிதர்களைப் பற்றித் தாவீதிடம் தெரிவித்தார்கள். அவர் அவர்களைச் சந்திக்கும்படி அனுப்பினார்[a]; ஏனெனில் அந்த மனிதர்கள் கடும் அவமானத்துக்குள்ளாகியிருந்தார்கள்[b]. அரசர் அவர்களிடம், “உங்கள் தாடிகள் மீண்டும் வளரும் வரை எரிகோவில் தங்கியிருங்கள்; அதன்பின் திரும்பி வாருங்கள்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: யாரை அனுப்பினார் என்பதை எபிரெய மூலவாக்கியம் வெளிப்படையாகக் கூறவில்லை; அவர்களைச் சந்திக்க ஆட்களையோ தூதர்களையோ அனுப்பினார் என்பது இயல்பாகப் புரிந்துகொள்ளப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: “கடும் அவமானத்துக்குள்ளாகியிருந்தார்கள்” என்பதை “மிகவும் வெட்கமடைந்திருந்தார்கள்” அல்லது “முற்றிலும் இழிவுபடுத்தப்பட்டிருந்தார்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: அவர்கள் போய்
  rationale: הלך என்பதன் வழக்கமான தொடர்-இறந்தகால வடிவம் அடுத்த நிகழ்வை அறிமுகப்படுத்துகிறது; எளிய இயல்பான கதைநடைத் தமிழாக மொழிபெயர்க்கப்பட்டது.
- source_word: וַיַּגִּידוּ לְדָוִיד עַל הָאֲנָשִׁים
  choice: அந்த மனிதர்களைப் பற்றித் தாவீதிடம் தெரிவித்தார்கள்
  rationale: לְ என்பது செய்தி தெரிவிக்கப்பட்ட நபரையும், עַל என்பது செய்தியின் பொருளையும் குறிக்கிறது; இவ்விரு உறவுகளும் தமிழில் தெளிவாகப் பாதுகாக்கப்பட்டுள்ளன.
- source_word: וַיִּשְׁלַח לִקְרָאתָם
  choice: அவர் அவர்களைச் சந்திக்கும்படி அனுப்பினார்
  rationale: שׁלח வினையின் செயப்படுபொருள் எபிரெயத்தில் வெளிப்படையாக இல்லை. ‘ஆட்களை’ அல்லது ‘தூதர்களை’ என்று மூலத்தில் இல்லாத சொல்லை முதன்மைப் பிரதியில் சேர்க்காமல், தமிழிலும் அந்த மறைபொருள் நிலை காக்கப்பட்டுள்ளது.
- source_word: נִכְלָמִים מְאֹד
  choice: கடும் அவமானத்துக்குள்ளாகியிருந்தார்கள்
  rationale: כלם என்பதன் நிபால் வடிவம் அவமானம் அல்லது வெட்கக்கேட்டுக்கு உள்ளான நிலையைக் குறிக்கிறது; முந்தைய வசனத்தின் பொதுவான இழிவுபடுத்தல் சூழலில் ‘கடும் அவமானத்துக்குள்ளாகி’ என்பது சமூக இழிவையும் מְאֹד தரும் வலியுறுத்தலையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: שְׁבוּ
  choice: தங்கியிருங்கள்
  rationale: ישׁב இங்கு ‘உட்காருங்கள்’ என்பதைக் காட்டிலும் ஓரிடத்தில் இருந்து காத்திருங்கள் என்ற பொருளில் வருகிறது.
- source_word: בִירֵחוֹ
  choice: எரிகோவில்
  rationale: יְרֵחוֹ என்ற இடப்பெயரின் தமிழில் பரவலாக அறியப்படும் வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: עַד אֲשֶׁר יְצַמַּח זְקַנְכֶם
  choice: உங்கள் தாடிகள் மீண்டும் வளரும் வரை
  rationale: צמח என்பது ‘முளைத்தல், வளர்தல்’ என்று பொருள்படும். முந்தைய வசனத்தில் தாடிகள் வெட்டப்பட்டதால், ‘மீண்டும் வளரும்’ என்பது சூழல் உணர்த்தும் பொருளை இயல்பான தமிழில் தருகிறது; பலரின் தாடிகளைக் குறிக்கத் தமிழ் பன்மை பயன்படுத்தப்பட்டுள்ளது.
- source_word: וְשַׁבְתֶּם
  choice: அதன்பின் திரும்பி வாருங்கள்
  rationale: עד אשר தொடருக்குப் பின் வரும் இவ்வடிவம் அடுத்துச் செய்ய வேண்டிய செயலைக் குறிக்கிறது; அரசர் பேசுபவராக இருப்பதால் தமிழில் ‘திரும்பி வாருங்கள்’ இயல்பானது.
- source_word: הַמֶּלֶךְ
  choice: அரசர்
  rationale: மூலம் தாவீதின் பெயரை மீண்டும் சொல்லாமல் அவரது அரச பதவியைக் குறிப்பிடுகிறது; அதே வேறுபாடு காக்கப்பட்டுள்ளது.
