translation_notes:
  register: நவீன பொதுத்தரத் தமிழ்; எளிதில் புரியும் அதேவேளையில் கண்ணியமான வரலாற்றுக் கதைநடை. எபிரெயத்தில் வெளிப்படையாக இல்லாத அனுப்பப்பட்ட நபர்களை முதன்மைப் பிரதியில் நிரப்பாமல் உண்மையான இலக்கண மறைபொருள் பாதுகாக்கப்பட்டுள்ளது. உரையாடலில் மரியாதைப் பன்மை இயல்பாகப் பயன்படுத்தப்பட்டுள்ளது.
