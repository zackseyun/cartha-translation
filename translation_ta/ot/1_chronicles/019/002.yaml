base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/002.yaml
  text: And David said[a], “I will show kindness to Hanun son of Nahash, because his father showed kindness to me.” So David sent messengers to comfort him concerning his father. And David’s servants came to the land of the Ammonites, to Hanun, to comfort him.
translation:
  language: ta
  text: தாவீது, “நாகாசின் மகன் ஆனூனுக்கு நான் தயவு காட்டுவேன்; ஏனெனில், அவனுடைய தந்தை எனக்குத் தயவு காட்டினார்” என்றார். ஆகவே, அவனுடைய தந்தையைக் குறித்து ஆனூனுக்கு ஆறுதல் கூறும்படி தாவீது தூதர்களை அனுப்பினார்.[a] தாவீதின் பணியாளர்கள் ஆனூனுக்கு ஆறுதல் கூறுவதற்காக அம்மோனியரின் நாட்டிலுள்ள ஆனூனிடம் வந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில், “அவனுடைய தந்தையைக் குறித்து அவனுக்கு ஆறுதல் கூறும்படி.” தந்தையின் மரணத்தால் ஏற்பட்ட துயரத்திற்காக ஆறுதல் கூறுவதை இச்சொற்றொடர் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶסֶד
  choice: தயவு
  rationale: அரசியல் மற்றும் தனிப்பட்ட உறவின் இச்சூழலில், இந்தச் சொல் உடன்படிக்கை சார்ந்த நிலையான அன்பை முதன்மையாகக் குறிக்காமல், ஒருவர் மற்றொருவருக்குக் காட்டும் நன்மையையும் விசுவாசமான பரிவையும் குறிக்கிறது. இரண்டு இடங்களிலும் இயல்பாக அமைகிறது.
- source_word: עָשָׂה חֶסֶד עִם
  choice: தயவு காட்டுதல்
  rationale: எழுத்துப்படியான ‘ஒருவருடன் தயவு செய்தல்’ என்பதற்குப் பதிலாக, எபிரெயச் சொல்லிணையின் பொருளை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: מַלְאָכִים
  choice: தூதர்கள்
  rationale: இங்கு குறிப்பிடப்படுவது தாவீது அனுப்பிய மனிதப் பிரதிநிதிகள்; ஆகவே ‘தூதர்கள்’ தெளிவானதும் மூலச்சொல்லின் பொருள் வரம்புக்கு நெருக்கமானதும் ஆகும்.
- source_word: לְנַחֲמוֹ
  choice: அவனுக்கு ஆறுதல் கூறும்படி
  rationale: நחם என்ற வினை இங்கு துக்கத்தில் இருப்பவருக்கு ஆறுதல் அளிப்பதைக் குறிக்கிறது. ‘ஆறுதல் கூறுதல்’ இயல்பான நவீனத் தமிழ்.
- source_word: עַל אָבִיו
  choice: தந்தையை இழந்த
  rationale: தந்தையின் மரணத்தால் ஏற்பட்ட துயரமே ஆறுதலுக்கான காரணம் என்பதைச் சூழல் உணர்த்துகிறது. தமிழில் இயல்பாகப் புரியும்படி இதை முதன்மை உரையில் வெளிப்படுத்தி, எபிரெயின் நேரடியான வடிவத்தை அடிக்குறிப்பில் பதிவு செய்துள்ளோம்.
- source_word: אֶרֶץ בְּנֵי עַמּוֹן
  choice: அம்மோனியரின் நாடு
  rationale: בְּנֵי עַמּוֹן என்பதற்கான வழக்கமான தமிழினப் பெயர் ‘அம்மோனியர்’; אֶרֶץ என்பதன் நிலப்பரப்பு சார்ந்த பொருளை ‘நாடு’ தெளிவாகத் தருகிறது.
- source_word: עַבְדֵי דָוִיד
  choice: தாவீதின் பணியாளர்கள்
  rationale: இவர்கள் தாவீதின் சேவையில் இருந்து அனுப்பப்பட்ட மனிதர்கள். ‘பணியாளர்கள்’ என்பது நவீன வாசகர்களுக்குத் தெளிவாக இருப்பதுடன், சூழலில் உறுதிப்படுத்தப்படாத உயரதிகாரி என்ற நுணுக்கத்தையும் சேர்ப்பதில்லை.
- source_word: וַיֹּאמֶר ... וַיִּשְׁלַח ... וַיָּבֹאוּ
  choice: என்றார் ... ஆகவே ... அனுப்பினார் ... வந்தார்கள்
  rationale: எபிரெயக் கதைத் தொடரின் அடுத்தடுத்த செயல்களைத் தமிழில் இயல்பாக இணைக்கிறது; ‘ஆகவே’ தாவீதின் நோக்கத்துக்கும் தூதர்களை அனுப்பிய செயலுக்கும் உள்ள விளைவு உறவைத் தெளிவாக்குகிறது.
