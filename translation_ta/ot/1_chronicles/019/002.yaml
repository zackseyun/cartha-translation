translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மூலத்தில் மறைமுகமாக உள்ள தந்தையின் மரணச் சூழல், தமிழில் இயல்பான புரிதலுக்காக ‘தந்தையை இழந்த’ என்று வெளிப்படுத்தப்பட்டுள்ளது; நேரடியான வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது. பெயர்கள் வழக்கமான தமிழ் வேதாகம ஒலிபெயர்ப்புகளான தாவீது, நாகாஸ், ஆனூன் என வழங்கப்பட்டுள்ளன.
