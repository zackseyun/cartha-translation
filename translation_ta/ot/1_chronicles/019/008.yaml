lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: கேள்விப்பட்டபோது
  rationale: இச்சூழலில் שׁמע என்பது தாவீது செய்தியை அறிந்ததைக் குறிக்கிறது. ‘கேள்விப்பட்டபோது’ என்பது நேரடியான பொருளையும் செய்தி கிடைத்தது என்ற உட்பொருளையும் இயல்பாகத் தருகிறது.
- source_word: וַיִּשְׁלַח
  choice: அனுப்பினான்
  rationale: שלח என்பதற்கான தெளிவான, இயல்பான தமிழ் இணை; இராணுவச் சூழலிலும் தேவையற்ற கூடுதல் பொருளைச் சேர்க்காது.
- source_word: יוֹאָב
  choice: யோவாப்
  rationale: எபிரெய தனிப்பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு; வேற்றுமை உருபுடன் ‘யோவாபையும்’ என வருகிறது.
- source_word: כָּל
  choice: முழுவதையும்
  rationale: பின்வரும் படையைக் குறிக்கும் כָּל என்பதன் முழுமையைக் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: צָבָא
  choice: படை
  rationale: இராணுவச் சூழலில் ஒழுங்கமைந்த போர்ப்படையைக் குறிக்கும் இயல்பான நவீன தமிழ் சொல்.
- source_word: הַגִּבּוֹרִים
  choice: வலிமைமிக்க வீரர்கள்
  rationale: גִּבּוֹרִים என்பதில் உள்ள வலிமை, வீரம் ஆகிய பொருள்களைத் தக்கவைத்து, தாவீதின் சிறப்புப் போர்வீரர்களைக் குறிக்கக்கூடிய நுணுக்கத்தையும் காக்கிறது.
- source_word: וְאֵת כָּל צָבָא הַגִּבּוֹרִים
  choice: வலிமைமிக்க வீரர்களின் படை முழுவதையும்
  rationale: யோவாபுடன் சேர்த்து அனுப்பப்பட்ட இரண்டாவது நேரடி பொருளையும், ‘வீரர்களின் படை’ என்ற எபிரெய இணைப்பையும் தமிழில் தெளிவாகப் பாதுகாக்கிறது.
