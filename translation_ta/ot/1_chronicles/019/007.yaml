base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/007.yaml
  text: So they hired for themselves thirty-two thousand chariots[a], and the king of Maacah with his people. They came and camped before Medeba[b], and the sons of Ammon gathered from their cities and came to battle.
translation:
  language: ta
  text: அவர்கள் தங்களுக்காக முப்பத்திரண்டாயிரம் தேர்களையும்[a], மாக்காவின் அரசனையும் அவனுடைய மக்களையும் கூலிக்கு அமர்த்தினார்கள். அவர்கள் வந்து மேதேபாவுக்கு எதிரே முகாமிட்டார்கள். அம்மோனின் மக்கள்[b] தங்கள் நகரங்களிலிருந்து ஒன்றுகூடி போருக்காக வந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தேர்கள்” என்பது தேர்ப்படையையோ தேர்ப்படையைக் கூட்டாகவோ குறிக்கக்கூடும்; தனித்தனி வாகனங்களின் எண்ணிக்கையை மட்டும் அவசியமாகக் குறிக்க வேண்டியதில்லை.
    reason: lexical_alternative
  - marker: b
    text: சொல்லளவில், “அம்மோனின் மகன்கள்”; இது அம்மோனிய மக்களைக் குறிக்கும் வழக்கமான எபிரெய இனப்பெயர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂכְּרוּ לָהֶם
  choice: அவர்கள் தங்களுக்காக ... கூலிக்கு அமர்த்தினார்கள்
  rationale: שׂכר என்பதன் பணம் கொடுத்து அமர்த்துதல் என்ற பொருளையும், לָהֶם என்பதன் தங்களுக்காக என்ற பயனுறு பொருளையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: שְׁנַיִם וּשְׁלֹשִׁים אֶלֶף
  choice: முப்பத்திரண்டாயிரம்
  rationale: எபிரெய எண்ணின் மதிப்பை நவீனத் தமிழின் இயல்பான வரிசையில் துல்லியமாகத் தருகிறது.
- source_word: רֶכֶב
  choice: தேர்ப்படையினர்
  rationale: இராணுவச் சூழலில் רֶכֶב தனித்தனி தேர்களை மட்டுமல்லாமல் தேர்ப்படையையும் கூட்டாகக் குறிக்கலாம். மனிதர்களைக் கூலிக்கு அமர்த்தும் வினையோடு தமிழில் இயல்பாகப் பொருந்துமாறு இந்தக் கூட்டுப் பொருள் தேர்ந்தெடுக்கப்பட்டது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: מֶלֶךְ מַעֲכָה
  choice: மாக்காவின் அரசன்
  rationale: Construct வடிவிலுள்ள ஆட்சியுறவைத் தெளிவாகக் காட்டி, இடப்பெயரை ஒலிபெயர்க்கிறது.
- source_word: עַמּוֹ
  choice: அவனுடைய மக்கள்
  rationale: עם என்பதன் அடிப்படைப் பொருளான ‘மக்கள்’ என்பதைக் காக்கிறது; சூழலில் அவர்கள் போர்வீரர்களாக இருக்கலாம் என்றாலும் ‘படை’ என்று குறுக்கவில்லை.
- source_word: לִפְנֵי מֵידְבָא
  choice: மேதேபாவுக்கு எதிரே
  rationale: புவியியல் மற்றும் இராணுவச் சூழலில் לִפְנֵי குறிக்கும் ‘முன்பாக/எதிரே’ என்ற இடத்தொடர்பை இயல்பான தமிழில் தருகிறது.
- source_word: בְנֵי עַמּוֹן
  choice: அம்மோனின் மக்கள்
  rationale: சொல்லளவில் ‘அம்மோனின் மகன்கள்’ என்றாலும், இது ஓர் இனக்குழுவைக் குறிக்கும் வழக்கமான எபிரெயச் சொற்றொடர். நவீனத் தமிழில் பாலினக் குழப்பமின்றி அதன் இனப்பொருளை வெளிப்படுத்துகிறது.
- source_word: נֶאֶסְפוּ ... וַיָּבֹאוּ לַמִּלְחָמָה
  choice: ஒன்றுகூடி போருக்கு வந்தார்கள்
  rationale: இராணுவ அணிதிரட்டலையும் போருக்குச் சென்றதையும் நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
