translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமானதும் பொதுவாசகர்களுக்கு எளிதில் புரியக்கூடியதுமான உரை. தொடர் நிகழ்வை ‘ஆகவே’ கொண்டு இணைத்து, இராணுவச் சூழலைத் தெளிவாக வைத்திருக்கிறது. எபிரெயின் ‘தேர்/தேர்ப்படை’ என்ற உண்மையான பொருள் இருமை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
