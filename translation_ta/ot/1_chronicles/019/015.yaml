  register: நவீன பொதுத்தமிழில், கண்ணியமான வரலாற்றுக் கதைநடை பயன்படுத்தப்பட்டது. பெயர்கள் தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் வடிவங்களில் தரப்பட்டுள்ளன; மூலத்தில் இல்லாத ‘திரும்பினான்’ போன்ற விளக்கங்கள் தவிர்க்கப்பட்டுள்ளன.
