  text: וּ/בְנֵ֨י עַמּ֤וֹן רָאוּ֙ כִּי נָ֣ס אֲרָ֔ם וַ/יָּנ֣וּסוּ גַם הֵ֗ם מִ/פְּנֵי֙ אַבְשַׁ֣י אָחִ֔י/ו וַ/יָּבֹ֖אוּ הָ/עִ֑ירָ/ה וַ/יָּבֹ֥א יוֹאָ֖ב יְרוּשָׁלִָֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/015.yaml
  text: When the Ammonites saw that Aram had fled[a], they also fled before Abishai his brother and entered the city[b]. Then Joab came to Jerusalem.
translation:
  language: ta
  text: அராம் படையினர்[a] தப்பியோடியதை அம்மோனியர்கள் கண்டபோது, அவர்களும் யோவாபின் சகோதரனான அபிசாயிடமிருந்து[b] தப்பியோடி நகருக்குள் புகுந்தார்கள். பின்பு யோவாப் எருசலேமுக்கு வந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘அராம்’; இங்கு அது அராமியப் படையினரைக் குறிக்கிறது. மரபுவழியாக ‘சீரியர்கள்’ என்றும் மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், ‘அபிசாய், அவனுடைய சகோதரன்’; இங்குள்ள ‘அவனுடைய’ என்பது யோவாபைக் குறிக்கிறது.
    reason: referent_clarification
lexical_decisions:
- source_word: וּבְנֵי עַמּוֹן
  choice: அம்மோனியர்கள்
  rationale: ‘அம்மோனின் மகன்கள்’ என்ற எபிரெய மரபுத்தொடர் அம்மோன் மக்களைக் குறிக்கிறது; இயல்பான தமிழ் இனப்பெயர் பயன்படுத்தப்பட்டது.
- source_word: רָאוּ כִּי נָס
  choice: தப்பியோடியதைக் கண்டபோது
  rationale: כִּי இங்கு அவர்கள் கண்ட நிகழ்வின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது. தமிழில் நிகழ்வுகளின் தொடர்பை இயல்பாகக் காட்ட பெயரெச்சத் தொடர் பயன்படுத்தப்பட்டது.
- source_word: אֲרָם
  choice: அராம் படையினர்
  rationale: ஒருமை வடிவிலுள்ள இடப்பெயர் இங்கு அராமியப் படையினரைத் தொகுப்பாகக் குறிக்கிறது; ‘சீரியா’ என்ற மரபுவழிப் பெயரை இறக்குமதி செய்யாமல் குறிப்பிட்ட படை சார்ந்த பொருள் தெளிவாக்கப்பட்டது.
- source_word: וַיָּנוּסוּ גַם הֵם
  choice: அவர்களும் ... தப்பியோடி
  rationale: גַם הֵם என்பதன் ஒப்பீட்டு வலியுறுத்தலை ‘அவர்களும்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מִפְּנֵי
  choice: முன்பாக
  rationale: போர்ச் சூழலில் எதிரிப்படையின் முன்னிலையிலிருந்து பின்வாங்கி ஓடுவதைக் குறிக்கும் மரபுத்தொடரின் பொருள் காக்கப்பட்டது.
- source_word: אַבְשַׁי אָחִיו
  choice: யோவாபின் சகோதரனான அபிசாய்
  rationale: ஆண்பால் ஒருமை உடைமைப் பின்னொட்டு கதைச்சூழலில் யோவாபைக் குறிக்கிறது. தமிழில் சுட்டுப்பெயர் தெளிவின்மையைத் தவிர்க்க பெயர் வெளிப்படையாகக் கொடுக்கப்பட்டது.
- source_word: וַיָּבֹאוּ הָעִירָה
  choice: நகருக்குள் புகுந்தார்கள்
  rationale: திசையைக் காட்டும் ה־ இறுதி நகரின் உள்ளே சென்றதைச் சுட்டுகிறது; பாதுகாப்புக்காக நகருக்குள் சென்ற போர்ச் சூழலுக்கு ‘புகுந்தார்கள்’ இயல்பானது.
- source_word: וַיָּבֹא יוֹאָב יְרוּשָׁלִָם
  choice: பின்பு யோவாப் எருசலேமுக்கு வந்தான்
  rationale: தொடர்ச்சியான கதை நகர்வை ‘பின்பு’ காட்டுகிறது. மூலத்தில் வெளிப்படையாக இல்லாத ‘திரும்பினான்’ என்பது சேர்க்கப்படவில்லை.
