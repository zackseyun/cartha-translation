revisions:
- from: அம்மோனின் மகன்கள்[a] வெளியே வந்து, நகரத்தின் நுழைவிடத்தில்[c] போருக்கு அணிவகுத்து நின்றார்கள்[b]; வந்திருந்த அரசர்களோ அவர்களிடமிருந்து தனியாக வயல்வெளியில் இருந்தார்கள்[d].
  to: அம்மோனியர்[a] வெளியே வந்து, நகரத்தின் நுழைவிடத்தில்[c] போருக்கு அணிவகுத்து நின்றார்கள்[b]; வந்திருந்த அரசர்களோ வயல்வெளியில் தனியாக இருந்தார்கள்[d].
