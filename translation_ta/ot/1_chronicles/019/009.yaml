base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/009.yaml
  text: And the sons of Ammon came out and drew up for battle at the entrance of the city[d][c][b][a], while the kings who had come were by themselves in the field.
translation:
  language: ta
  text: அம்மோனியர்[a] வெளியே வந்து, நகரத்தின் நுழைவிடத்தில்[c] போருக்கு அணிவகுத்து நின்றார்கள்[b]; வந்திருந்த அரசர்களோ வயல்வெளியில் தனியாக இருந்தார்கள்[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: வேறு வகையில், ‘அம்மோனின் மகன்கள்.’ எபிரெயத்தில் சொல்லுக்குச் சொல் இவ்வாறே உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, படைகளைப் போருக்குரிய ஒழுங்கில் நிறுத்தினார்கள்.
    reason: lexical_alternative
  - marker: c
    text: ‘நகர வாசலில்’ என்றும் மொழிபெயர்க்கலாம். ஆனால் எபிரெயச் சொல் வழக்கமாக ‘வாசல்’ என்பதைக் குறிப்பதைவிடப் பொதுவாக ‘நுழைவிடம்’ அல்லது ‘திறப்பு’ என்பதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: d
    text: அதாவது, கூட்டணியாக வந்த அரசர்கள் அம்மோனியரிடமிருந்து பிரிந்து, வயல்வெளியில் தனியாக நிலைகொண்டிருந்தார்கள்.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: வெளியே வந்து
  rationale: יצא என்பது இக்கதைச் சூழலில் உள்ளிருந்து வெளியே வருவதைக் குறிக்கிறது; நகரத்திலிருந்து படைகள் புறப்பட்ட காட்சியை இயல்பாகத் தருகிறது.
- source_word: בְּנֵי עַמּוֹן
  choice: அம்மோனின் மகன்கள்
  rationale: எபிரெய மொழியின் இனக்குழுப் பெயருக்குரிய சொற்றொடரை முறையாகப் பாதுகாக்கிறது; தமிழில் பொருள் புரியுமாறு மாற்றுவடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וַיַּעַרְכוּ מִלְחָמָה
  choice: போருக்கு அணிவகுத்து நின்றார்கள்
  rationale: ערך உடன் מלחמה வரும் இராணுவ மரபுத்தொடர், படைகளைப் போருக்கான ஒழுங்கில் நிறுத்துவதைக் குறிக்கிறது; வெறுமனே ‘போரிட்டார்கள்’ என்று பொருளைச் சுருக்கவில்லை.
- source_word: פֶּתַח הָעִיר
  choice: நகரத்தின் நுழைவிடத்தில்
  rationale: פתח என்பதன் அடிப்படைப் பொருள் ‘திறப்பு/நுழைவிடம்’; வழக்கமான ‘வாசல்’ என்பதற்கான குறிப்பிட்ட எபிரெயச் சொல் இங்கு இல்லை.
- source_word: וְהַמְּלָכִים אֲשֶׁר בָּאוּ
  choice: வந்திருந்த அரசர்களோ
  rationale: இணைப்புச் சொல் இங்கு அம்மோனியப் படைகளின் நிலைக்கும் கூட்டணி அரசர்களின் நிலைக்கும் இடையிலான வேறுபாட்டைக் காட்டுகிறது; ‘-ஓ’ அந்த எதிர்நிலையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לְבַדָּם
  choice: அவர்களிடமிருந்து தனியாக
  rationale: அரசர்கள் அம்மோனியப் படைகளுடன் சேராமல் தனிப் பிரிவாக இருந்ததைத் தெளிவாக்குகிறது; அவர்கள் எண்ணிக்கையில் ஒவ்வொருவரும் தனித்திருந்தார்கள் என்று பொருள் கொள்ளவில்லை.
- source_word: בַּשָּׂדֶה
  choice: வயல்வெளியில்
  rationale: שׂדה என்பது வயல் அல்லது திறந்த வெளிப்பகுதியைக் குறிக்கலாம்; இச்சூழலில் நகருக்கு வெளியேயுள்ள வெளிப்பகுதியைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது.
