translation_notes:
  register: நவீனத் தரத் தமிழில், கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘அணிவகுத்து நின்றார்கள்’ இராணுவச் சூழலைத் தெளிவுபடுத்துகிறது; ‘நுழைவிடம்’ எபிரெயச் சொல்லின் பொதுவான பொருளைப் பாதுகாக்கிறது. மூலத்தின் எதிர்நிலையை ‘அரசர்களோ’ என்பதும், படைப்பிரிவுகளின் பிரிவை ‘அவர்களிடமிருந்து தனியாக’ என்பதும் இயல்பாக வெளிப்படுத்துகின்றன.
