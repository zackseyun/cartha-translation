  text: וְ/יוֹאָ֥ב בֶּן צְרוּיָ֖ה עַל הַ/צָּבָ֑א וִ/יהוֹשָׁפָ֥ט בֶּן אֲחִיל֖וּד מַזְכִּֽיר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/015.yaml
  text: And Joab son of Zeruiah was over the army[a], and Jehoshaphat son of Ahilud was recorder.
translation:
  language: ta
  text: செருயாவின் மகன் யோவாப் படைக்குப் பொறுப்பாளராக இருந்தான்; அகிலூதின் மகன் யோசபாத் பதிவாளராக இருந்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு மொழிபெயர்ப்பு: “செயலாளர்” அல்லது “வரலாற்றுப் பதிவாளர்.” எபிரெயச் சொல், பதிவுகளைப் பேணுவதும் காரியங்களை அரசனின் கவனத்திற்குக் கொண்டுவருவதும் பொறுப்பாக இருந்த ஓர் அரச அதிகாரியைக் குறிக்கிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יוֹאָב
  choice: செருயாவின் மகன் யோவாப்
  rationale: וְ இங்கு அதிகாரிகளின் பட்டியலைத் தொடரும் எளிய இணைப்புச் சொல். தனித்தமிழ் வாக்கியத் தொடக்கத்தில் ‘மேலும்’ எனச் சேர்ப்பது தேவையற்றதாக இருப்பதால், இயல்பான பட்டியல் நடைக்காக வெளிப்படையாக மொழிபெயர்க்கப்படவில்லை; יוֹאָב என்பது ‘யோவாப்’ என ஒலிபெயர்க்கப்பட்டது.
- source_word: בֶּן צְרוּיָה
  choice: செருயாவின் மகன்
  rationale: எபிரெய மரபுவழி அடையாள அமைப்பை இயல்பான நவீனத் தமிழில் நேரடியாகக் கொடுக்கிறது.
- source_word: עַל הַצָּבָא
  choice: படைக்குப் பொறுப்பாளராக இருந்தான்
  rationale: עַל என்பது இங்கு படையின் மீது அதிகாரமும் பொறுப்பும் உடைய பதவியைக் குறிக்கிறது. ‘படைத் தளபதி’ என்பது சாத்தியமான விளக்கம் என்றாலும், மூலத்தில் இல்லாத குறிப்பிட்ட பதவிப் பெயரைச் சேர்க்காமல் அதன் பரந்த பொருளை இத்தேர்வு காக்கிறது.
- source_word: וִ/יהוֹשָׁפָט
  choice: அகிலூதின் மகன் யோசபாத்
  rationale: וְ பட்டியலின் அடுத்த அதிகாரியை இணைக்கிறது; தமிழில் அரைப்புள்ளி மூலமே அந்தத் தொடர்பு இயல்பாக வெளிப்படுகிறது. יהוֹשָׁפָט என்பது ‘யோசபாத்’ என ஒலிபெயர்க்கப்பட்டது.
- source_word: בֶּן אֲחִילוּד
  choice: அகிலூதின் மகன்
  rationale: மரபுவழி அடையாளத்தைத் தெளிவாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: מַזְכִּיר
  choice: பதிவாளர்
  rationale: זכר வேரிலிருந்து வந்த இச்சொல் அரசவையில் நிகழ்வுகளையும் அரச காரியங்களையும் பதிவு செய்து அரசனின் கவனத்திற்குக் கொண்டுவரும் அதிகாரியைக் குறிக்கலாம். ‘பதிவாளர்’ அதன் நிர்வாகப் பணியை நவீனத் தமிழில் மிகைப்படுத்தாமல் வெளிப்படுத்துகிறது.
