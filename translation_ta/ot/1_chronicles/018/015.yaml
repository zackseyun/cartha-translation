translation_notes:
  register: நவீன நிலையான தமிழில், அரச அதிகாரிகளின் சுருக்கமான பட்டியல் நடையைப் பேணும் வகையில் மொழிபெயர்க்கப்பட்டது. வாக்கியத் தொடர்புக்கு அரைப்புள்ளி பயன்படுத்தப்பட்டுள்ளது. பதவிப் பெயர்களில் மூலத்தைவிட அதிகத் துல்லியத்தைத் திணிக்காமல், இயல்பான நிர்வாகச் சொற்கள் தேர்ந்தெடுக்கப்பட்டுள்ளன.
