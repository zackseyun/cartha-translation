base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/008.yaml
  text: And from Tibhath and from Cun, cities of Hadadezer, David took a very great amount of bronze; with it Solomon made the bronze sea, the pillars, and the bronze articles.
translation:
  language: ta
  text: ஹதாதேசரின் நகரங்களான திப்ஹாத்திலிருந்தும் கூனிலிருந்தும் தாவீது மிகப் பெருமளவில் வெண்கலத்தை எடுத்துக்கொண்டான். அதைக் கொண்டு சாலொமோன் வெண்கலக் கடல்தொட்டியையும், தூண்களையும், வெண்கலப் பொருட்களையும் செய்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נְחֹשֶׁת
  choice: வெண்கலம்
  rationale: இச்சூழலில் ஆலயப் பொருட்களுக்குப் பயன்படுத்தப்பட்ட bronze/copper alloy-ஐக் குறிக்கும் வழக்கமான, புரிந்துகொள்ளத்தக்க தமிழ் சொல்.
- source_word: יָם הַנְּחֹשֶׁת
  choice: வெண்கலக் கடல்தொட்டி
  rationale: יָם என்பதன் நேரடி உருவகமான ‘கடல்’ என்பதையும், இது ஒரு பெரிய தொட்டி என்பதையும் இயல்பான தமிழில் தெளிவாகக் காக்கிறது.
- source_word: כְּלֵי הַנְּחֹשֶׁת
  choice: வெண்கலப் பொருட்கள்
  rationale: כְּלִי என்பது பாத்திரம், கருவி, பொருள் எனப் பரந்த பொருள் தருவதால், குறிப்பிட்ட வகையை தேவையின்றி சுருக்காமல் ‘பொருட்கள்’ என வழங்கப்பட்டது.
- source_word: בָּהּ עָשָׂה
  choice: அதைக் கொண்டு ... செய்தான்
  rationale: பெண்பால் ஒருமை சுட்டுப்பெயர் முன்னுள்ள வெண்கலத்தைச் சுட்டுகிறது; பொருளை இயல்பாகத் தமிழில் வெளிப்படுத்துகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழ்; வரலாற்று உரைக்கு ஏற்ற கண்ணியமான, நேரடியான நடை. இடப்பெயர்கள் எபிரெய வடிவங்களுக்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டுள்ளன.
