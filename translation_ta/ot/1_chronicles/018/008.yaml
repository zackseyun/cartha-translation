    issue: 'Place-name transliteration: திப்காத்'
    rationale: טִבְחַת is Tibhat (with ḥ), not Tibkath. “திப்ஹாத்” more closely and transparently represents the Hebrew name.
  - severity: low
    issue: 'Personal-name transliteration: அதாதேசர்'
    rationale: The Hebrew name הֲדַדְעֶזֶר begins with he (h). “ஹதாதேசர்” better preserves the name Hadadezer.
