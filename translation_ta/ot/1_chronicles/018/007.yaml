base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/007.yaml
  text: And David took the shields of gold that were on the servants of Hadadezer and brought them to Jerusalem[a][b][c].
translation:
  language: ta
  text: தாவீது, அதாதேசர்[c] பணியாளர்கள் அணிந்திருந்த பொன் கேடயங்களை[a][b] எடுத்து அவற்றை எருசலேமுக்குக் கொண்டுவந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பொன்னாலான கேடயங்கள்’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொற்றொடர் பொன் பூசப்பட்ட கேடயங்களையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: இங்கு ‘பணியாளர்கள்’ என்பது குறுகிய நவீனப் பொருளில் வீட்டு அடிமைகளை மட்டுமே குறிக்க வேண்டியதில்லை; அதாதேசரின் அரச பரிவாரத்தாரையோ இராணுவ உதவியாளர்களையோ குறிக்கலாம்.
    reason: cultural_note
  - marker: c
    text: சில உரைமரபுகளிலும் 2 சாமுவேலில் உள்ள இணைப் பகுதியிலும் இப்பெயர் ‘அதாரேசர்’ என்று எழுதப்பட்டுள்ளது.
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּקַּח
  choice: எடுத்துக்கொண்டு
  rationale: לקח என்பதன் இயல்பான கதைநடைப் பொருள் ‘எடுத்தல்’. போர் சூழலில் ‘கைப்பற்றுதல்’ சாத்தியமானாலும், மூலத்தின் பொதுவான சொல்லாட்சியை இத்தேர்வு காக்கிறது.
- source_word: שִׁלְטֵי הַזָּהָב
  choice: பொன் கேடயங்கள்
  rationale: שׁלטים என்பது கேடயங்களைக் குறிக்கிறது; construct தொடரை இயல்பான நவீனத் தமிழில் ‘பொன் கேடயங்கள்’ என வழங்குகிறது. அவை முழுவதும் பொன்னாலானவையா அல்லது பொன் பூசப்பட்டவையா என்பது தெளிவில்லை.
- source_word: אֲשֶׁר הָיוּ עַל
  choice: இருந்த
  rationale: எபிரெயத்தின் நேரடியான பொருள் ‘மேல் இருந்த’ என்பதாகும். தமிழில் ‘பணியாளர்களிடம் இருந்த’ என்பது அவர்கள் அணிந்திருந்தார்களா அல்லது ஏந்தியிருந்தார்களா என்பதைத் தீர்மானிக்காமல் இயல்பாக அந்த உறவைத் தெரிவிக்கிறது.
- source_word: עַבְדֵי הֲדַדְעָזֶר
  choice: அதாதேசரின் பணியாளர்கள்
  rationale: עבדים என்பதற்கு அடிப்படையாக ‘பணியாளர்கள்/ஊழியர்கள்’ என்று பொருள். அரச மற்றும் இராணுவச் சூழலில் மன்னரின் பரிவாரத்தார் அல்லது படை உதவியாளர்களையும் குறிக்கலாம்; ‘அடிமைகள்’ என்று குறுக்காமல் ‘பணியாளர்கள்’ பயன்படுத்தப்படுகிறது.
- source_word: הֲדַדְעָזֶר
  choice: அதாதேசர்
  rationale: இவ்வசனத்தின் மசோரா எபிரெய உரையிலுள்ள Hadadezer என்ற வடிவத்தைத் தமிழ் ஒலிமரபுக்கேற்ப ‘அதாதேசர்’ என வழங்குகிறது; Hadarezer என்ற வேறுபாடு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וַיְבִיאֵם יְרוּשָׁלִָם
  choice: அவற்றை எருசலேமுக்குக் கொண்டுவந்தான்
  rationale: Hiphil வடிவிலுள்ள בוא என்பதற்கு ‘கொண்டுவருதல்’ என்பது துல்லியமான பொருள்; பொருள்சுட்டும் பன்மை பின்னொட்டு ‘அவற்றை’ என வெளிப்படுத்தப்பட்டுள்ளது.
