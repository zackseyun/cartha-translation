translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘அடிமைகள்’ என்ற குறுகிய பொருளைத் தவிர்க்க ‘பணியாளர்கள்’ என்றும், ‘கைப்பற்றினான்’ எனப் போர் சூழலை அதிகமாக விளக்காமல் ‘எடுத்துக்கொண்டு’ என்றும் மொழிபெயர்க்கப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
