  source_fidelity: 'மூலத்தின் முக்கியப் பொருள் நன்றாகத் தரப்பட்டுள்ளது: முந்தைய வசனத்தின் வெண்கலப் பொருட்களையும் தாவீது யாவேவுக்கு அர்ப்பணித்தார்; அவற்றுடன் பல நாடுகளிடமிருந்து எடுத்த வெள்ளியும் தங்கமும் சேர்க்கப்பட்டன. ஆயினும், இரண்டு தனி வாக்கியங்களில் ‘அர்ப்பணித்தான்’ மீண்டும் வருவதால், עִם (‘உடன்/சேர்த்து’) குறிக்கும் ஒரே அர்ப்பணிப்புச் செயல் சற்றுத் தளர்கிறது. அதை ஒரே வாக்கியமாக்குவது மூலத் தொடர்பைத் துல்லியமாகக் காக்கும்.'
