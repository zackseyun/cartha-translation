id: 1CH.18.11
reference: 1 Chronicles 18:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: גַּם אֹתָ֗/ם הִקְדִּ֞ישׁ הַ/מֶּ֤לֶךְ דָּוִיד֙ לַ/יהוָ֔ה עִם הַ/כֶּ֨סֶף֙ וְ/הַ/זָּהָ֔ב אֲשֶׁ֥ר נָשָׂ֖א מִ/כָּל הַ/גּוֹיִ֑ם מֵֽ/אֱד֤וֹם וּ/מִ/מּוֹאָב֙ וּ/מִ/בְּנֵ֣י עַמּ֔וֹן וּ/מִ/פְּלִשְׁתִּ֖ים וּ/מֵֽ/עֲמָלֵֽק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/011.yaml
  text: 'King David also dedicated these to Yahweh[a], along with the silver and the gold that he had taken from all the nations: from Edom, Moab, the Ammonites, the Philistines[c][b], and Amalek.'
translation:
  language: ta
  text: தாவீது அரசன் அவற்றையும்[a], ஏதோம், மோவாப், அம்மோனியர்[b], பெலிஸ்தியர், அமாலேக்கு ஆகிய எல்லா நாடுகளிடமிருந்தும் அவன் எடுத்துக்கொண்ட[c] வெள்ளியோடும் தங்கத்தோடும் சேர்த்து யாவேவுக்கு அர்ப்பணித்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவற்றை’ என்றும் மொழிபெயர்க்கலாம்; இந்தப் பிரதிப்பெயர் முந்தைய வசனத்தில் குறிப்பிடப்பட்ட வெண்கலப் பொருட்களைக் குறிக்கிறது.
    reason: cross_reference
  - marker: b
    text: எபிரெயத்தில் ‘அம்மோனின் மகன்கள்’; அதாவது, அம்மோனியர்.
    reason: lexical_alternative
  - marker: c
    text: ‘எடுத்துச் சென்ற’ அல்லது ‘கையகப்படுத்திய’ என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல் ‘தூக்குதல்/சுமத்தல்/எடுத்துச் செல்லுதல்’ என்று பொருள்படும்; இங்கு வென்ற நாடுகளிடமிருந்து கிடைத்த கொள்ளைப் பொருள் அல்லது திறையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם אֹתָם
  choice: அவற்றையும்
  rationale: גַּם தொடர்ச்சியையும் சேர்த்தலையும் குறிக்கிறது; אֹתָם முந்தைய வசனத்தில் குறிப்பிடப்பட்ட வெண்கலப் பொருட்களைச் சுட்டுகிறது. ‘அவற்றையும்’ என்பது தமிழில் இயல்பாக இந்த இரு கூறுகளையும் தருகிறது.
- source_word: הִקְדִּישׁ
  choice: அர்ப்பணித்தான்
  rationale: இறைவனுக்கெனப் பொருட்களை ஒதுக்கிவைக்கும் ஆலயச் சூழலை, சாதாரண வாசகருக்குப் புரியும் இயல்பான தமிழில் ‘அர்ப்பணித்தான்’ தெரிவிக்கிறது.
- source_word: לַיהוָה
  choice: யாவேவுக்கு
  rationale: எபிரெய மூலத்தில் உள்ள יהוה என்ற தனிப்பெயரைப் பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்த்துத் தருகிறது.
- source_word: עִם הַכֶּסֶף וְהַזָּהָב
  choice: அதோடு ... வெள்ளியையும் தங்கத்தையும்
  rationale: עִם குறிக்கும் உடன்சேர்த்தலை ‘அதோடு’ காட்டுகிறது; வெள்ளியும் தங்கமும் அதே அர்ப்பணிப்பில் அடங்கியிருந்தன என்பதைத் தமிழ் வாக்கிய அமைப்பு தெளிவுபடுத்துகிறது.
- source_word: אֲשֶׁר נָשָׂא
  choice: அவன் எடுத்துக்கொண்ட
  rationale: נָשָׂא என்பதன் அடிப்படை ‘தூக்குதல்/சுமத்தல்/எடுத்துச் செல்லுதல்’; இங்கு வென்ற நாடுகளிடமிருந்து கிடைத்த பொருட்களை எடுத்துக்கொண்ட பொருள் சூழலுக்கு ஏற்றது. ‘கொள்ளையடித்த’ என்று மிகத் திட்டவட்டமாக்காமல் மூலத்தின் பரப்பை காக்கிறது.
- source_word: מִכָּל הַגּוֹיִם
  choice: எல்லா நாடுகளிடமிருந்தும்
  rationale: இராணுவ-அரசியல் சூழலில் גּוֹיִם சுற்றியிருந்த நாடுகளைக் குறிக்கிறது; ‘நாடுகளிடமிருந்தும்’ என்பது பொருட்கள் அவர்களிடமிருந்து பெறப்பட்டதை இயல்பாகச் சொல்கிறது.
- source_word: מֵאֱדוֹם וּמִמּוֹאָב וּמִבְּנֵי עַמּוֹן וּמִפְּלִשְׁתִּים וּמֵעֲמָלֵק
  choice: ஏதோம், மோவாப், அம்மோனியர், பெலிஸ்தியர், அமாலேக்கு
  rationale: பெயர்கள் வழக்கமான தமிழ் வேதாகம ஒலிப்புமுறையில் தரப்படுகின்றன. בְּנֵי עַמּוֹן என்ற சொல்லுக்கு இயல்பான இனப்பெயராக ‘அம்மோனியர்’ பயன்படுத்தப்படுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைபெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரை நான்கெழுத்து இறைத் தனிப்பெயரையே பயன்படுத்துகிறது. அதன் தனிப்பெயர்த் தன்மையைப் பாதுகாக்க ‘யாவே’ என்று ஒலிபெயர்க்கப்படுகிறது; பட்டப்பெயரைப் பயன்படுத்தி அதை மறைக்கவில்லை.
- issue: הִקְדִּישׁ குறிக்கும் அர்ப்பணிப்பின் தன்மை
  choice: அர்ப்பணித்தான்
  alternative: புனிதப்படுத்தினான் / பரிசுத்தமாக ஒதுக்கிவைத்தான்
  rationale: பொருட்களை யாவேவுக்கென ஒதுக்கும் செயலை ‘அர்ப்பணித்தான்’ தெளிவாகக் காட்டுகிறது; பொருட்களுக்குள் ஏதோ மாற்றம் ஏற்பட்டதாக தேவையின்றி விளக்குவதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட நடையில் வடிவமைக்கப்பட்டது. நீண்ட எபிரெய வாக்கியம் தமிழில் இயல்பாக வாசிக்க இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது; இரண்டாவது வாக்கியத்தில் ‘அர்ப்பணித்தான்’ மீண்டும் சொல்லப்படுவது உறவைத் தெளிவாக்குகிறது. இனப்பெயர்களும் இடப்பெயர்களும் தமிழ் வேதாகம வாசகர்களுக்குப் பரிச்சயமான வடிவங்களில் தரப்பட்டுள்ளன.
