source:
  edition: WLC
  text: וַ/יִּמְלֹ֥ךְ דָּוִ֖יד עַל כָּל יִשְׂרָאֵ֑ל וַ/יְהִ֗י עֹשֶׂ֛ה מִשְׁפָּ֥ט וּ/צְדָקָ֖ה לְ/כָל עַמּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/014.yaml
  text: So David reigned over all Israel[a], and he administered justice and righteousness to all his people.
translation:
  language: ta
  text: தாவீது இஸ்ரவேல் முழுவதையும் அரசாண்டான்; தன் மக்கள் அனைவருக்கும் நியாயத்தையும் நீதியையும்[a] செயல்படுத்தி வந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நீதியையும் நேர்மையான ஒழுங்கையும்.’ இந்த எபிரெயச் சொல் இணை சட்டப்படி நியாயம் செய்வதையும், சரியானதும் நீதியானதுமான ஆட்சியையும் ஒன்றாகக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְלֹךְ
  choice: ஆட்சி செய்தான்
  rationale: מלך என்பதன் Qal wayyiqtol வடிவம் அரசனாக ஆள்வதைக் குறிக்கிறது. சூழலில் தாவீது அரசன் என்பது தெளிவாக இருப்பதால், நவீன தமிழில் இயல்பான ‘ஆட்சி செய்தான்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: இஸ்ரவேல் முழுவதையும்
  rationale: מלך உடன் வரும் עַל ஆளப்படும் நாட்டையோ மக்களையோ குறிக்கிறது. ‘முழுவதையும்’ என்பது כָּל என்பதன் பரப்பைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: וַיְהִי עֹשֶׂה
  choice: நிலைநாட்டி வந்தான்
  rationale: היה + பங்கேற்புவினை வழக்கமாகவும் தொடர்ச்சியாகவும் நடைபெற்ற செயலைக் குறிக்கிறது. அரசாட்சி சார்ந்த இச்சூழலில் ‘நிலைநாட்டி வந்தான்’ என்பது அந்தத் தொடர்ச்சியையும் செயற்பாட்டையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מִשְׁפָּט
  choice: நீதி
  rationale: அரசாட்சி மற்றும் சட்ட நிர்வாகச் சூழலில் இச்சொல் நியாயமான தீர்ப்பையும் சட்ட ஒழுங்கையும் குறிக்கிறது. ‘நீதி’ நவீன தமிழில் தெளிவான, பரந்த பொருளை வழங்குகிறது.
- source_word: וּצְדָקָה
  choice: நேர்மை
  rationale: צְדָקָה சரியானதும் ஒழுக்கநெறிக்கு ஏற்றதுமான நடத்தையைக் குறிக்கிறது. מִשְׁפָּט என்பதிலிருந்து வேறுபாட்டைப் பாதுகாக்க ‘நேர்மை’ பயன்படுத்தப்பட்டது.
- source_word: לְכָל עַמּוֹ
  choice: தன் மக்கள் அனைவருக்கும்
  rationale: לְ இங்கு தாவீதின் நீதியான ஆட்சியால் பயன் பெறுவோரைக் குறிக்கிறது; 3ஆம் நபர் ஆண்பால் ஒருமை உடைமை விகுதி ‘தன்’ என்பதால் இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: מִשְׁפָּט וּצְדָקָה என்ற அரசாட்சிசார் நெறியியல் சொல் இணை
  choice: நீதியையும் நேர்மையையும்
  alternative: நியாயத்தீர்ப்பையும் நீதியையும்
  rationale: முதல் சொல் சட்ட மற்றும் தீர்ப்புசார் நீதியையும், இரண்டாவது சொல் ஒழுக்கரீதியான சரியான நடத்தையையும் வலியுறுத்துகிறது. இரண்டையும் ஒரே தமிழ்ச் சொல்லாக மாற்றாமல், எபிரெய மொழியிலுள்ள கருத்து வேறுபாடும் இணைப்பும் பாதுகாக்கப்பட்டுள்ளன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வரலாற்று நடையில் மொழிபெயர்க்கப்பட்டது. ‘நிலைநாட்டி வந்தான்’ என்பது மூலத்திலுள்ள தொடர்ச்சியான அரசாட்சிச் செயலை இயல்பாக வெளிப்படுத்துகிறது; அடிக்குறிப்பு குறியீடு அது விளக்கும் சொல் இணைக்குப் பின்னர் வைக்கப்பட்டுள்ளது.
