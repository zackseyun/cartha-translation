revisions:
- from: அதனால் அவர் தம் மகன் அதோராமைத் தாவீது அரசனிடம் அனுப்பினார். தாவீதின் நலனை விசாரிக்கவும், அவர் அதாதேசருக்கு எதிராகப் போரிட்டு அவரைத் தோற்கடித்ததற்காக அவரை வாழ்த்தவும்[a] அனுப்பினார். ஏனெனில் அதாதேசர் தோவூவுடன் போரிட்டு வந்தார்.[b] தங்கம், வெள்ளி, வெண்கலம் ஆகியவற்றாலான எல்லாவகைப் பொருட்களையும் அவர் அனுப்பினார்.[c]
  to: அப்போது தோவூ தன் மகன் அதோராமைத் தாவீது அரசனிடம் அனுப்பினார்; தாவீதின் நலனை விசாரிக்கவும்[a], தாவீது அதாதேசருக்கு எதிராகப் போரிட்டு அவனைத் தோற்கடித்ததற்காக அவரை வாழ்த்தவும்[b] அனுப்பினார். ஏனெனில் அதாதேசர் தோவூவுடன் போரில் இருந்துவந்தார்.[c] மேலும், தங்கம், வெள்ளி, வெண்கலம் ஆகியவற்றாலான எல்லாவகைப் பொருட்களையும் அனுப்பினார்.[d]
  rationale: The revision retains the source meaning while making Tou, David, and the embassy's two purposes syntactically explicit. It preserves the contextual force of the Hebrew war idiom without imposing a stronger claim, and it separates the lexical and ellipsis notes at their respective anchors.
