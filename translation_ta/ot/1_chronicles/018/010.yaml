base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/010.yaml
  text: So he sent Hadoram his son to King David to ask about his welfare and to bless him because he had fought against Hadadezer and struck him down[a], for Hadadezer had been at war with Tou[d][c][b]; and he sent all kinds of articles of gold and silver and bronze.
translation:
  language: ta
  text: அப்போது தோவூ தன் மகன் அதோராமைத் தாவீது அரசனிடம் அனுப்பினார்; தாவீதின் நலனை விசாரிக்கவும்[a], தாவீது அதாதேசருக்கு எதிராகப் போரிட்டு அவனைத் தோற்கடித்ததற்காக அவரை வாழ்த்தவும்[b] அனுப்பினார். ஏனெனில் அதாதேசர் தோவூவுடன் போரில் இருந்துவந்தார்.[c] மேலும், தங்கம், வெள்ளி, வெண்கலம் ஆகியவற்றாலான எல்லாவகைப் பொருட்களையும் அனுப்பினார்.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “அவருடைய சமாதானத்தை விசாரிக்கவும்” என்று உள்ளது. இங்கு “சமாதானம்” என்பது நலநிலையை அல்லது நலத்தை குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “வாழ்த்தவும்” என்பதற்கான எபிரெய வினை சொல்லுக்குச் சொல் “ஆசீர்வதிக்கவும்” என்பதாகும். இந்த அரசதந்திரச் சூழலில் அது வெற்றிக்காக வாழ்த்துவதையும் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: சொல்லுக்குச் சொல், “அதாதேசர் தோவூவுடன் போர்களின் மனிதனாக இருந்தார்” என்று உள்ளது. இது அதாதேசர் தோவூவுடன் போரில் இருந்தார் என்பதைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: d
    text: எபிரெய மூலவாக்கியம் “தங்கம், வெள்ளி, வெண்கலம் ஆகியவற்றின் எல்லாப் பொருட்களும்” என்று வினையின்றி முடிகிறது. “அனுப்பினார்” என்பது சூழலிலிருந்து நிரப்பப்பட்டுள்ளது.
    reason: source_ellipsis
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: அதனால் அவர் ... அனுப்பினார்
  rationale: தொடர்ச்சியான எபிரெயக் கதைநடையை இயல்பான நவீனத் தமிழில் காட்டுகிறது; முந்தைய வசனத்தில் குறிப்பிடப்பட்ட தோவூவே எழுவாய் என்ற சூழலைப் பாதுகாக்கப் பெயரைச் சேர்க்காமல் ‘அவர்’ என வைக்கப்பட்டுள்ளது.
- source_word: הֲדוֹרָם בְּנוֹ
  choice: தம் மகன் அதோராமை
  rationale: மகன் என்ற உறவை வெளிப்படையாகப் பாதுகாத்து, இயற்பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: לִשְׁאוֹל לוֹ לְשָׁלוֹם
  choice: தாவீதின் நலனை விசாரிக்கவும்
  rationale: சொல்லுக்குச் சொல் ‘சமாதானத்தை விசாரித்தல்’ என்ற எபிரெய மரபுத்தொடர் இங்கு ஒருவரின் நலநிலையை விசாரிப்பதைக் குறிக்கிறது; தமிழில் இயல்பான சமமான சொற்றொடர் பயன்படுத்தப்பட்டுள்ளது.
- source_word: וּלְבָרֲכוֹ
  choice: அவரை வாழ்த்தவும்
  rationale: בּרך என்பதன் அடிப்படைப் பொருள் ‘ஆசீர்வதித்தல்’; ஆனால் இவ்வெற்றிக்குப் பிந்தைய அரசதந்திரச் சூழலில் ‘வாழ்த்துதல்’ இயல்பான பொருளைத் தருகிறது. அடிப்படைப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: עַל אֲשֶׁר נִלְחַם בַּהֲדַדְעֶזֶר וַיַּכֵּהוּ
  choice: அவர் அதாதேசருக்கு எதிராகப் போரிட்டு அவரைத் தோற்கடித்ததற்காக
  rationale: נכה என்ற வினை இங்கு போரில் முறியடித்ததைக் குறிக்கிறது; அவர் கொல்லப்பட்டார் என்று மிகைப்படுத்தாமல் ‘தோற்கடித்தார்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: כִּי אִישׁ מִלְחֲמוֹת תֹּעוּ הָיָה הֲדַדְעָזֶר
  choice: ஏனெனில் அதாதேசர் தோவூவுடன் போரிட்டு வந்தார்
  rationale: சொல்லுக்குச் சொல் ‘தோவூவுக்கு உரிய போர்களின் மனிதன்’ என்ற கடினமான எபிரெய மரபுத்தொடரின் உறவுப்பொருளை இயல்பான தமிழில் தருகிறது; நீடித்த பகைமை/போர் நிலையை ‘போரிட்டு வந்தார்’ வெளிப்படுத்துகிறது.
- source_word: וְכֹל כְּלֵי זָהָב וָכֶסֶף וּנְחֹשֶׁת
  choice: தங்கம், வெள்ளி, வெண்கலம் ஆகியவற்றாலான எல்லாவகைப் பொருட்களையும் அவர் அனுப்பினார்
  rationale: כְּלֵי என்பது பலவகைப் பொருட்கள் அல்லது பாத்திரங்களைக் குறிக்கக்கூடும் என்பதால் பொதுவான ‘பொருட்கள்’ தேர்ந்தெடுக்கப்பட்டது. பழங்கால உலோகச் சூழலில் נְחֹשֶׁת என்பதற்கு ‘வெண்கலம்’ பொருத்தமானது. எபிரெயில் விடுபட்ட வினை சூழலிலிருந்து நிரப்பப்பட்டுள்ளது.
