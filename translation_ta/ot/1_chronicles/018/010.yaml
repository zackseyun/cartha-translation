translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. அரசதந்திரச் சூழலிலுள்ள மரபுத்தொடர்கள் இயல்பாக மொழிபெயர்க்கப்பட்டு, அவற்றின் சொல்லடிப்படையான மாற்றுகள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன. இயற்பெயர்கள் WLC வடிவங்களுக்கு ஏற்ப அதோராம், அதாதேசர், தோவூ என ஒலிபெயர்க்கப்பட்டுள்ளன.
