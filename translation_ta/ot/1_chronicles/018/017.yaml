base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/017.yaml
  text: And Benaiah son of Jehoiada was over the Kerethites and the Pelethites[c][b][a], and David’s sons were the chief officials at the king’s side.
translation:
  language: ta
  text: யெகோயாதாவின் மகன் பெனாயா, கிரேத்தியருக்கும் பெலேத்தியருக்கும் தலைவராக இருந்தான்; தாவீதின் மகன்கள் அரசரின் அருகில் முதன்மையானவர்களாக[a] இருந்தார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “முதலானவர்கள்” அல்லது “முன்னணியினர்”; இங்கு அரசவையின் தலைமை அதிகாரிகளைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “அரசரின் அருகில்” என்பது சொல்லர்த்தமாக “அரசரின் கையருகில்”; அரசருடன் நெருங்கி இருந்து பணியாற்றுவதைக் குறிக்கும் சொல்லாட்சியாக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל
  choice: தலைவராக இருந்தான்
  rationale: இராணுவ அல்லது நிர்வாகச் சூழலில் இந்த முன்னிடைச்சொல் அதிகாரத்தையும் மேற்பார்வையையும் குறிக்கிறது; தமிழில் இயல்பாக அந்தப் பொருளைத் தருகிறது.
- source_word: הַכְּרֵתִי
  choice: கிரேத்தியர்
  rationale: இது ஒரு மக்களினம் அல்லது படைப்பிரிவின் பெயர் என்பதால் பொருள் விளக்கமாக மாற்றாமல் எபிரெய ஒலிப்புக்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: הַפְּלֵתִי
  choice: பெலேத்தியர்
  rationale: இதுவும் ஒரு குழுவின் பெயர்; உரை ஆதரிக்காத விளக்கத்தைச் சேர்க்காமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: הָרִאשֹׁנִים
  choice: முதன்மையானவர்கள்
  rationale: சொல்லுக்கு நேரடியாக ‘முதலானவர்கள்’ அல்லது ‘முன்னணியினர்’ என்ற பொருள் உண்டு. அரசவையிலுள்ள பதவி அல்லது முன்னுரிமையைக் குறிக்கக்கூடும்; மூலத்தின் தெளிவின்மையைப் பாதுகாக்க ‘அதிகாரிகள்’ என்பதை முதன்மை உரையில் சேர்க்கவில்லை.
- source_word: לְיַד הַמֶּלֶךְ
  choice: அரசரின் அருகில்
  rationale: சொல்லர்த்தமாக ‘அரசரின் கையருகில்’; நெருங்கிய உடனிருப்பையும் பணியையும் குறிக்கும் சொல்லாட்சி. ‘அருகில்’ என்பது உருவகத்தையும் சாத்தியமான அரசவைப் பணியையும் திறந்தவாறு வைத்திருக்கிறது.
- source_word: וּבְנֵי דָוִיד
  choice: தாவீதின் மகன்கள்
  rationale: எபிரெய இணைப்புத் தொடரின் நேரடியான, இயல்பான தமிழாக்கம்.
- source_word: בְּנָיָהוּ בֶּן יְהוֹיָדָע
  choice: யெகோயாதாவின் மகன் பெனாயா
  rationale: தனிப்பெயர்கள் வழக்கமான தமிழ் வேதாகம ஒலிப்புமுறையில் தரப்பட்டு, தந்தை–மகன் உறவு இயல்பான தமிழில் அமைக்கப்பட்டுள்ளது.
theological_decisions:
- issue: தாவீதின் மகன்களின் அரசவை நிலை
  choice: ‘முதன்மையானவர்கள்’ என்று சொல்லர்த்தத்திற்கு நெருக்கமாக மொழிபெயர்த்து, சாத்தியமான பதவிப் பொருளை அடிக்குறிப்பில் குறிப்பிடுதல்
  alternative: ‘தலைமை அதிகாரிகள்’ அல்லது ‘அரசருக்குப் பணிவிடை செய்த முதன்மை அதிகாரிகள்’
  rationale: הָרִאשֹׁנִים என்பது பதவிப் பெயராக இருக்கலாம்; ஆனால் ‘அதிகாரிகள்’ என்ற பெயர்ச்சொல் எபிரெய உரையில் வெளிப்படையாக இல்லை. எனவே வரலாற்று/அரசவை விளக்கத்தை உறுதிப்படுத்தாமல் மூலத்தின் நெகிழ்வை காக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. குழுப் பெயர்கள் ஒலிபெயர்க்கப்பட்டுள்ளன. அரசவைப் பதவியைத் தீர்மானமாக்காமல் எபிரெய உரையின் இருபொருள் வாய்ப்பு அடிக்குறிப்புகளுடன் பாதுகாக்கப்பட்டுள்ளது.
