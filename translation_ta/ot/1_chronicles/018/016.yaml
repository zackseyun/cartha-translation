base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/016.yaml
  text: Zadok son of Ahitub and Abimelech son of Abiathar were priests[a], and Shavsha was secretary.
translation:
  language: ta
  text: 'அகிதூபின் மகன் சாதோக்கும், அபியத்தாரின் மகன் அபிமெலேக்கும்[a] ஆசாரியர்களாக இருந்தார்கள்; சவ்சா அரசுச் செயலாளராக இருந்தான்.


    [a] 2 சாமுவேல் 8:17-இல் உள்ள இணையான பதிவில், “அபியத்தாரின் மகன் அகிமெலேக்கு” என்று உள்ளது. இங்கே நாளாகமத்தின் எபிரெய உரையில் உள்ளபடி “அபியத்தாரின் மகன் அபிமெலேக்கு” என்று மொழிபெயர்க்கப்பட்டுள்ளது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 2 சாமுவேல் 8:17-இல் உள்ள இணையான பதிவில், “அபியத்தாரின் மகன் அகிமெலேக்கு” என்று உள்ளது. இங்கே நாளாகமத்தின் எபிரெய உரையில் உள்ளபடி “அபியத்தாரின் மகன் அபிமெலேக்கு” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: textual_variant
lexical_decisions:
- source_word: צָדוֹק
  choice: சாதோக்கு
  rationale: தனிப்பெயர் தமிழில் வழக்கமான வேதாகம ஒலிபெயர்ப்பு வடிவில் தரப்பட்டுள்ளது.
- source_word: בֶּן
  choice: மகன்
  rationale: இந்த நிர்வாகப் பட்டியலில் உடனடியான தந்தை–மகன் உறவையே இயல்பாகக் குறிக்கிறது.
- source_word: אֲחִיטוּב
  choice: அகிதூபு
  rationale: எபிரெய தனிப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: אֲבִימֶלֶךְ
  choice: அபிமெலேக்கு
  rationale: நாளாகமத்தின் கொடுக்கப்பட்டுள்ள எபிரெய உரை அபிமெலேக்கு என்ற பெயரையே கொண்டிருப்பதால் அது பாதுகாக்கப்பட்டுள்ளது; இணைப்பதிவின் வேறுபாடு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: אֶבְיָתָר
  choice: அபியத்தார்
  rationale: எபிரெய தனிப்பெயர் தமிழில் வழக்கமான வேதாகம வடிவில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: כֹּהֲנִים
  choice: ஆசாரியர்கள்
  rationale: כֹּהֵן என்பதன் முதன்மையான சமயப் பணிப் பொருள் இச்சூழலில் சாதோக்கு மற்றும் அபியத்தாரின் குடும்பங்களுக்குப் பொருந்துகிறது.
- source_word: שַׁוְשָׁא
  choice: சவ்சா
  rationale: நாளாகமத்தின் எபிரெய மெய்யெழுத்து வடிவை நெருக்கமாகப் பிரதிபலிக்கும் தமிழொலிபெயர்ப்பு.
- source_word: סוֹפֵר
  choice: அரசுச் செயலாளர்
  rationale: அரச நிர்வாகச் சூழலில் இச்சொல் எழுத்துப் பணியும் ஆவணப் பொறுப்பும் கொண்ட அதிகாரியைக் குறிக்கிறது; நவீன வாசகருக்குப் பதவியைத் தெளிவாக்க ‘அரசுச் செயலாளர்’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
