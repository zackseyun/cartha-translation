translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் மரியாதைமிக்க நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. பெயர்கள் ஒலிபெயர்க்கப்பட்டுள்ளன; பதவிகள் பொருள் தெளிவாக மொழிபெயர்க்கப்பட்டுள்ளன. எபிரெய வாக்கியத்தின் பட்டியல் அமைப்பும் இரு இணை வாக்கியங்களின் சமநிலையும் காக்கப்பட்டுள்ளன.
