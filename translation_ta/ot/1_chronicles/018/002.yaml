source:
  edition: WLC
  text: וַ/יַּ֖ךְ אֶת מוֹאָ֑ב וַ/יִּהְי֤וּ מוֹאָב֙ עֲבָדִ֣ים לְ/דָוִ֔יד נֹשְׂאֵ֖י מִנְחָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/002.yaml
  text: And he struck Moab[a], and the Moabites became servants to David, bringing tribute.
translation:
  language: ta
  text: அவர் மோவாபைத் தாக்கினார். மோவாபியர் தாவீதுக்கு அடிமைகளாகி[a], கப்பம் கொண்டுவந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தாவீதின் ஊழியர்களாகி, காணிக்கையைச் சுமந்து வந்தார்கள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொற்கள் பொதுவான பொருள்களையும் கொள்ளலாம்; ஆனால் இந்தப் படையெடுப்புச் சூழலில், அவை கட்டாயக் கீழ்ப்படிதலையும் கீழ்ப்பட்ட மக்கள் கொண்டுவந்த கப்பத்தையும் குறிக்கின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּךְ
  choice: தாக்கினார்
  rationale: נכה என்பதன் அடிப்படைப் பொருளான ‘அடித்தல்/தாக்குதல்’ என்ற இராணுவச் செயலைக் காக்கிறது; ‘தோற்கடித்தார்’ என்று விளைவை மிகுதியாகத் தீர்மானிப்பதைத் தவிர்க்கிறது.
- source_word: מוֹאָב
  choice: மோவாப் / மோவாபியர்
  rationale: முதல் இடத்தில் நாடு அல்லது தேசிய அமைப்பு நேரடிப் பொருளாக இருப்பதால் ‘மோவாப்’; இரண்டாம் இடத்தில் மக்களைக் குறிக்கும் கூட்டுப்பெயராக இருப்பதால் இயல்பான தமிழில் ‘மோவாபியர்’.
- source_word: וַיִּהְיוּ
  choice: ஆகி
  rationale: கதைத் தொடரில் ஏற்பட்ட புதிய நிலையைச் சுட்டும் ‘ஆனார்கள்’ என்ற பொருளைத் தருகிறது.
- source_word: עֲבָדִים
  choice: அடிமைகள்
  rationale: வெற்றிகொள்ளப்பட்ட மக்களின் கட்டாயக் கீழ்ப்படிதலை வலுவாக வெளிப்படுத்துகிறது; எபிரெயச் சொல் சூழலுக்கு ஏற்ப ‘பணியாளர்கள்’ என்றும் பொருள்படக்கூடியதால் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לְדָוִיד
  choice: தாவீதுக்கு
  rationale: தாவீதுடனான கீழ்ப்படிதல் உறவைத் தமிழில் இயல்பாகக் குறிக்கிறது.
- source_word: נֹשְׂאֵי מִנְחָה
  choice: கப்பம் செலுத்தினார்கள்
  rationale: சொல்லளவில் ‘காணிக்கை/பரிசைச் சுமந்து வருபவர்கள்’ என்றாலும், போர் வெற்றிக்குப் பிந்தைய அரசியல் சூழலில் கீழ்ப்பட்ட மக்கள் செலுத்தும் கப்பத்தைக் குறிக்கிறது.
theological_decisions:
- issue: עֲבָדִים என்ற சொல்லின் கீழ்ப்படிதல் அளவு
  choice: அடிமைகள்
  alternative: பணியாளர்கள் / ஊழியர்கள்
  rationale: படையெடுப்புக்குப் பிந்தைய கட்டாய அரசியல் கீழ்ப்படிதலை மென்மையாக்காமல் காட்ட ‘அடிமைகள்’ தேர்ந்தெடுக்கப்பட்டது; இருப்பினும் மூலச்சொல்லின் பரந்த பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சுருக்கமான வரலாற்றுக் கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘அவர்’ என்பது முந்தைய சூழலில் உள்ள தாவீதைக் குறிக்கிறது. ‘கப்பம் செலுத்தினார்கள்’ என்பது தமிழில் இயல்பாகவும் அரசியல்-இராணுவச் சூழலுக்கு ஏற்றவாறும் உள்ளது.
