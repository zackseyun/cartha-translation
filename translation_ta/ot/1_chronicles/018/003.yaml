- from: தாவீது, சோபாவின் அரசனான அதாதேசரை[a], ஆமாத்தை நோக்கிய படையெடுப்பில் தாக்கினார். அதாதேசர் ஐபிராத்து ஆற்றருகே தமது அதிகாரத்தை நிலைநாட்டச் சென்றபோது இது நிகழ்ந்தது.[b]
  to: தாவீது ஆமாத் திசையிலுள்ள சோபாவின் அரசனான அதாதேசரை[a] தாக்கினார்; அவர் ஐபிராத்து ஆற்றுப் பகுதியில் தமது அதிகாரத்தை நிலைநாட்டச் சென்றபோது இது நிகழ்ந்தது.[b]
  rationale: ஆமாத்துக்கான திசைக்குறிப்பு சோபாவின் இடவியல் அடையாளமாக வழங்கப்பட்டுள்ளது; இதனால் மூலத்தின் சுருக்கமான தொடரியல் தக்கவைக்கப்படுகிறது, ஆனால் ‘படையெடுப்பு’ என்ற கூடுதல் விளக்கம் தவிர்க்கப்படுகிறது. செல்லுதல் மற்றும் அதிகாரம் நிலைநாட்டுதல் குறித்த பின்னொட்டுகளின் குறிப்பு தெளிவற்றதால், முதன்மை உரை அதைத் தீர்மானிக்காமல் வைத்திருக்கிறது; தேவையான விளக்கம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
