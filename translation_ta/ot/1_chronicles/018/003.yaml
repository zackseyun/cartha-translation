source:
  edition: WLC
  text: וַ/יַּ֥ךְ דָּוִ֛יד אֶת הֲדַדְעֶ֥זֶר מֶֽלֶךְ צוֹבָ֖ה חֲמָ֑תָ/ה בְּ/לֶכְתּ֕/וֹ לְ/הַצִּ֥יב יָד֖/וֹ בִּֽ/נְהַר פְּרָֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/003.yaml
  text: David struck Hadadezer king of Zobah[b][a], as he went to establish his power at the Euphrates River.
translation:
  language: ta
  text: தாவீது ஆமாத் திசையிலுள்ள சோபாவின் அரசனான அதாதேசரை[a] தாக்கினார்; அவர் ஐபிராத்து ஆற்றுப் பகுதியில் தமது அதிகாரத்தை நிலைநாட்டச் சென்றபோது இது நிகழ்ந்தது.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு பெயர் ‘அதாதேசர்’ என்று உள்ளது; இணை வசனமான 2 சாமுவேல் 8:3-ல் ‘அதரேசர்’ என்று ஒலிபெயர்க்கப்படும் வேறுபட்ட பெயர்வடிவம் காணப்படுகிறது.
    reason: textual_variant
  - marker: b
    text: ‘தமது அதிகாரத்தை நிலைநாட்ட’ என்பதன் சொல்லுக்கு-சொல் வடிவம் ‘தமது கையை நிலைநிறுத்த’ என்பதாகும்; இதை ‘தமது கட்டுப்பாட்டை மீண்டும் நிலைநாட்ட’ என்றும் புரிந்துகொள்ளலாம். ‘அவர்’ மற்றும் ‘தமது’ என்பவற்றுக்கான எபிரெய ஒருமை ஆண்பால் பின்னொட்டுகள் தாவீதையோ அதாதேசரையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּךְ
  choice: தாக்கினார்
  rationale: נכה என்பதன் நேரடியான இராணுவப் பொருளைத் தக்கவைக்கிறது; முழுமையாகத் தோற்கடித்தார் என்று மூலத்தைவிட அதிகமாகக் கூறுவதில்லை.
- source_word: הֲדַדְעֶזֶר
  choice: அதாதேசர்
  rationale: நாளாகமத்தில் உள்ள எபிரெயப் பெயர்வடிவமான Hadadezer-ஐத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: מֶלֶךְ צוֹבָה
  choice: சோபாவின் அரசனான
  rationale: அரசப் பதவியையும் ஆட்சிப்பகுதியையும் இயல்பான தமிழில் நேரடியாகக் குறிப்பிடுகிறது.
- source_word: חֲמָתָה
  choice: ஆமாத்தை நோக்கிய படையெடுப்பில்
  rationale: இடப்பெயருடன் சேர்ந்துள்ள திசைகாட்டும் ־ה, ஆமாத்தை நோக்கிய இயக்கத்தைக் குறிக்கிறது. அது வாக்கியத்தின் முதல் பாதியிலுள்ள தாவீதின் தாக்குதலோடு இணைவதைத் தெளிவான தமிழில் வழங்குகிறது.
- source_word: בְּלֶכְתּוֹ
  choice: சென்றபோது
  rationale: בְּ உடன் வரும் infinitive construct காலச்சூழலைக் குறிக்கிறது; தமிழில் இயல்பான காலத் தொடராக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: לְהַצִּיב יָדוֹ
  choice: தமது அதிகாரத்தை நிலைநாட்ட
  rationale: ‘தன் கையை நிலைநிறுத்த’ என்ற எபிரெய மரபுத்தொடர், இராணுவ-அரசியல் சூழலில் அதிகாரம் அல்லது கட்டுப்பாட்டை நிலைநாட்டுதலைக் குறிக்கிறது.
- source_word: בִּנְהַר פְּרָת
  choice: ஐபிராத்து ஆற்றருகே
  rationale: פְּרָת என்பதைக் குறிப்பிட்ட ஆற்றுப் பெயராகவும் נָהָר என்பதையும் வெளிப்படையாகவும் வழங்குகிறது; בְּ இங்கு இடத்தைக் குறிக்கிறது.
theological_decisions:
- issue: בְּלֶכְתּוֹ மற்றும் יָדוֹ ஆகியவற்றின் குறிப்பு
  choice: அதாதேசர் சென்றதாக வெளிப்படுத்தப்பட்டது
  alternative: தாவீது சென்றதாகவோ, ‘அவர்’ என்று தெளிவுபடுத்தாமலோ மொழிபெயர்த்தல்
  rationale: எபிரெய ஆண்பால் ஒருமைப் பின்னொட்டுகள் இலக்கண ரீதியில் இருவரையும் குறிக்கக்கூடியவை. ஆயினும், இணை வசனமான 2 சாமுவேல் 8:3-ன் போர் சூழலும் அருகிலுள்ள பெயரான அதாதேசரும் இங்கு அவரையே சுட்டுவதாக வலுவாகக் காட்டுகின்றன; பெயரை மீண்டும் கூறுவது தமிழில் குழப்பத்தைத் தவிர்க்கிறது. இது இறையியல் முடிவு அல்ல, உரையாடல் சார்ந்த இலக்கணத் தீர்மானம்.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான வரலாற்று நடையில் அமைக்கப்பட்டுள்ளது. ‘தாக்கினார்’ மூலவினையின் உருவகத் தீவிரத்தைத் தக்கவைக்கிறது; ‘படையெடுப்பில்’ என்பது ஆமாத்தை நோக்கிய திசைச்சொல்லை இயல்பாக இணைக்கிறது. அடிக்குறிப்பு குறிகள் முதன்மை உரையில் [a], [b] என இடம்பெற்றுள்ளன.
