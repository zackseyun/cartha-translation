source:
  edition: WLC
  text: וְ/אַבְשַׁ֣י בֶּן צְרוּיָ֗ה הִכָּ֤ה אֶת אֱדוֹם֙ בְּ/גֵ֣יא הַמֶּ֔לַח שְׁמוֹנָ֥ה עָשָׂ֖ר אָֽלֶף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/012.yaml
  text: And Abishai son of Zeruiah struck down eighteen thousand Edomites in the Valley of Salt[a].
translation:
  language: ta
  text: மேலும், செருயாவின் மகன் அபிசாய் உப்புப் பள்ளத்தாக்கில் ஏதோமியரான பதினெட்டாயிரம் பேரை வீழ்த்தினான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில்: “ஏதோம்”; இப்போர்ச் சூழலில் ஏதோம் மக்களே குறிக்கப்படுவதால், “ஏதோமியரான பதினெட்டாயிரம் பேர்” என்று மொழிபெயர்க்கப்பட்டுள்ளது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַבְשַׁי
  choice: அபிசாய்
  rationale: ו தொடர் நிகழ்வுடன் இவ்வசனத்தை இணைக்கிறது; ஆனால் தனித்த வசனமாகவும் இயல்பாக வாசிக்க நவீன தமிழில் வெளிப்படையான ‘மேலும்’ தவிர்க்கப்பட்டது. அபிசாய் என்ற பெயர் ஒலிபெயர்க்கப்பட்டது.
- source_word: בֶּן צְרוּיָה
  choice: செருயாவின் மகன்
  rationale: தாய்வழி அடையாளத்தைக் குறிப்பிடும் எபிரெயச் சொல்லமைப்பு தெளிவாகவும் இயல்பாகவும் காக்கப்பட்டது.
- source_word: הִכָּה
  choice: வீழ்த்தினான்
  rationale: נכה என்பதன் ‘அடித்தல்/வீழ்த்துதல்’ என்ற வலிமையைப் போர்ச் சூழலில் காக்கிறது; ‘கொன்றான்’ என்று வினைச்சொல் மட்டும் தருவதைவிட அதிகமாகக் குறிப்பாக்குவதையும், ‘தோற்கடித்தான்’ என்று எண்ணிக்கையின் தனிநபர் சார்பை மங்கச் செய்வதையும் தவிர்க்கிறது.
- source_word: אֶת אֱדוֹם
  choice: ஏதோமியரில் ... பேரை
  rationale: எபிரெயத்தில் ‘ஏதோம்’ என்ற பெயரே இருந்தாலும், போர் வினைச்சொல்லும் எண்ணிக்கையும் இங்கு ஏதோம் மக்களைக் குறிக்கின்றன. தமிழில் ‘ஏதோமியரில் ... பேர்’ என்பது அந்த மறைபொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּ/גֵיא הַמֶּלַח
  choice: உப்புப் பள்ளத்தாக்கில்
  rationale: גיא ‘பள்ளத்தாக்கு’, המלח ‘உப்பு’; இவை இடப்பெயராக இயல்பான தமிழில் வழங்கப்பட்டன.
- source_word: שְׁמוֹנָה עָשָׂר אָלֶף
  choice: பதினெட்டாயிரம்
  rationale: மூலத்தின் முழு எண்ணிக்கை சொற்களால் வழங்கப்பட்டு, தமிழின் இயல்பான கூட்டெண் வடிவம் பயன்படுத்தப்பட்டது.
theological_decisions:
- issue: ‘ஏதோம்’ என்பது நிலப்பகுதியையா மக்களையா குறிக்கிறது?
  choice: ஏதோம் மக்களைக் குறிக்கும் ‘ஏதோமியரில் ... பேர்’
  alternative: ஏதோம் என்ற நாடு அல்லது நிலப்பகுதி
  rationale: ‘வீழ்த்தினான்’ என்ற போர்ச் செயலும் பதினெட்டாயிரம் என்ற எண்ணிக்கையும் மனிதர்களையே சுட்டுகின்றன. இது சூழல்சார்ந்த மொழிபெயர்ப்பு முடிவு; கோட்பாட்டுச் சேர்க்கை அல்ல.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பாகவும், வேதாகம வரலாற்றுரைக்கு ஏற்ற கண்ணியமான நடையிலும் அமைக்கப்பட்டது. ‘வீழ்த்தினான்’ என்பது மூல வினையின் வலிமையையும் அதன் அளவான தெளிவின்மையையும் காக்கிறது.
