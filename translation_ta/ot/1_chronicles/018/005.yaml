base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/005.yaml
  text: And Aram of Damascus came to help Hadadezer king of Zobah[b][a], and David struck down twenty-two thousand men of Aram.
translation:
  language: ta
  text: தமஸ்குவின் அராமியர், சோபாவின் அரசன் ஹதாதேசருக்கு[b] உதவ வந்தார்கள். தாவீது அராமியரில் இருபத்திரண்டாயிரம் பேரை வீழ்த்தினான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வீழ்த்தினான்’ என்பதற்கு ‘கொன்றான்’ அல்லது ‘தோற்கடித்தான்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இங்கு பெயர் ‘ஹதாதேசர்’ என்று உள்ளது; இணையான சில பகுதிகளில் ‘ஹதாரேசர்’ என்ற மாற்று வடிவம் காணப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: אֲרַם דַּרְמֶשֶׂק
  choice: தமஸ்குவைச் சேர்ந்த அராம் மக்கள்
  rationale: אֲרַם என்பது நிலப்பகுதியையோ மக்களையோ குறிக்கலாம். இங்கு உதவுவதற்காக வருகிற செயப்பொருளாக இருப்பதால் மக்களைக் குறிக்கும் இயல்பான தமிழ் வடிவம் தேர்ந்தெடுக்கப்பட்டது; பிற்கால அரசியல் பெயரான ‘சிரியா’ தவிர்க்கப்பட்டது.
- source_word: לַעְזוֹר
  choice: உதவ
  rationale: עזר என்பதன் நேரான பொருள் ‘உதவி செய்’; இராணுவச் சூழலிலும் ‘உதவ’ என்பது இயல்பாக உள்ளது.
- source_word: הֲדַדְעֶזֶר
  choice: ஆதாதேசர்
  rationale: இவ்வசனத்தின் எபிரெய வடிவமான הֲדַדְעֶזֶר-ஐத் தொடர்ந்து பெயர் ஒலிபெயர்க்கப்பட்டது.
- source_word: מֶלֶךְ צוֹבָה
  choice: சோபாவின் அரசன்
  rationale: அரச பட்டத்தையும் இடப்பெயரையும் விரிவாக்கமின்றி நேரடியாகக் கொடுக்கிறது.
- source_word: וַיַּךְ
  choice: வீழ்த்தினான்
  rationale: נכה போர்ச் சூழலில் தாக்குதல், தோற்கடித்தல் அல்லது கொல்லுதல் எனப் பொருள்படலாம். உயிரிழந்தோர் எண்ணிக்கை தொடர்வதால் ‘வீழ்த்தினான்’ வன்முறையை வெளிப்படுத்தியும் எபிரெயத்தைவிட மிகையாகத் துல்லியப்படுத்தாமலும் இருக்கிறது.
- source_word: בַּאֲרָם
  choice: அராம் மக்களில்
  rationale: בְּ உடன் வரும் இன-நிலப்பகுதிப் பெயர் இங்கு எண்ணிக்கைக்குரிய குழுவைக் குறிக்கிறது; தமிழில் ‘அராம் மக்களில்’ என்பது தெளிவான இயல்பான வடிவம்.
- source_word: עֶשְׂרִים וּשְׁנַיִם אֶלֶף אִישׁ
  choice: இருபத்திரண்டாயிரம் பேர்
  rationale: எபிரெய எண்ணிக்கையைத் துல்லியமாகத் தருகிறது; மூலத்தில் இல்லாத ‘படைவீரர்கள்’ போன்ற விளக்கத்தைச் சேர்க்கவில்லை.
