  text: When Tou king of Hamath heard that David had struck down all the army of Hadadezer king of Zobah,[a]
translation:
  language: ta
  text: ஆமாத்தின் அரசன் தோவு[a], சோபாவின் அரசன் அதாதேசேருடைய படை முழுவதையும் தாவீது முறியடித்ததைக் கேள்விப்பட்டபோது,
