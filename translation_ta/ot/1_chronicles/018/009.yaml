lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: கேள்விப்பட்டபோது
  rationale: வாவ் தொடர்வினை கதையை முன்னெடுத்துச் செல்கிறது; அடுத்த வசனச் செயலுக்கான காலச் சூழலை இயல்பான தமிழில் இவ்வாறு காட்டுகிறது.
- source_word: תֹּעוּ
  choice: தோவு
  rationale: நாளாகமத்தில் உள்ள எபிரெயப் பெயர்வடிவத்தை ஒலிபெயர்க்கிறது; சாமுவேலின் இணைப் பகுதியில் வேறொரு வடிவம் காணப்படுகிறது.
- source_word: מֶלֶךְ חֲמָת
  choice: ஆமாத்தின் அரசன்
  rationale: அரச பதவியையும் ஆட்சிப்பகுதியையும் குறிக்கும் எபிரெய இணைப்பை இயல்பான தமிழில் தருகிறது.
- source_word: כִּי
  choice: …தைக்
  rationale: அவன் கேட்ட செய்தியின் உள்ளடக்கத்தை அறிமுகப்படுத்துவதால், தமிழில் வினைப்பெயர் வேற்றுமை அமைப்பாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: הִכָּה
  choice: முறியடித்த
  rationale: போர்ச் சூழலில் נכה என்பது தாக்கி வீழ்த்துதல் அல்லது தோற்கடித்தலைக் குறிக்கிறது; ‘முறியடித்த’ என்பது அதன் வலிமையையும் இயல்பான தமிழையும் பேணுகிறது.
- source_word: כָּל
  choice: முழுவதையும்
  rationale: மூலத்தில் வெளிப்படையாக உள்ள முழுமைக் குறிப்பைப் பேணுகிறது.
- source_word: חֵיל
  choice: படை
  rationale: இப்போர்ச் சூழலில் இது செல்வத்தையோ பொதுவான வலிமையையோ அல்ல, ஆயுதப்படையையே குறிக்கிறது.
- source_word: הֲדַדְעֶזֶר
  choice: அதாதேசர்
  rationale: நாளாகமத்தின் எபிரெய வடிவத்தைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: מֶלֶךְ צוֹבָה
  choice: சோபாவின் அரசன்
  rationale: பட்டமும் இடப்பெயரும் சேர்ந்த அமைப்பை தெளிவான தமிழில் தருகிறது.
