  text: וַ/יְהִי֙ אַחֲרֵי כֵ֔ן וַ/יַּ֥ךְ דָּוִ֛יד אֶת פְּלִשְׁתִּ֖ים וַ/יַּכְנִיעֵ֑/ם וַ/יִּקַּ֛ח אֶת גַּ֥ת וּ/בְנֹתֶ֖י/הָ מִ/יַּ֥ד פְּלִשְׁתִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/001.yaml
  text: After this[a], David struck the Philistines and subdued them, and he took Gath and its surrounding towns from the hand of the Philistines.
translation:
  language: ta
  text: இதற்குப் பிறகு, தாவீது பெலிஸ்தியரைத் தாக்கி அவர்களை அடக்கினான்; காத் நகரத்தையும் அதைச் சார்ந்த ஊர்களையும்[a] பெலிஸ்தியரின் கையிலிருந்து கைப்பற்றினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேர்ச்சொல்லாக, “அதன் மகள்கள்”; இது காத் நகரத்தைச் சார்ந்த சிறிய நகரங்கள் அல்லது ஊர்களைக் குறிக்கும் எபிரேய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: இதற்குப் பிறகு
  rationale: எபிரேயக் கதைநடை மாற்றுச் சூத்திரத்தின் காலத் தொடர்ச்சியை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; ‘அப்போது நிகழ்ந்ததாவது’ என்ற சொல்லுக்குச் சொல் வடிவத்தைத் தவிர்க்கிறது.
- source_word: וַיַּךְ
  choice: தாக்கி
  rationale: נכה என்பதன் போர்ச் சூழலிலான ‘அடி/தாக்கு’ என்ற செயலாற்றலைக் காக்கிறது; அடுத்த வினை அதன் விளைவான அடக்குதலைத் தனியே கூறுகிறது.
- source_word: פְּלִשְׁתִּים
  choice: பெலிஸ்தியர்
  rationale: இந்த மக்கள் இனத்திற்கான தமிழில் நிலைபெற்ற பெயர்ப்பு.
- source_word: וַיַּכְנִיעֵם
  choice: அவர்களை அடக்கினான்
  rationale: Hiphil வடிவம் ஒருவரைக் கீழ்ப்படியச் செய்தல் அல்லது ஆதிக்கத்துக்குள் கொண்டுவருதல் என்ற இராணுவ-அரசியல் பொருளைக் கொண்டுள்ளது; ‘அடக்கினான்’ அதைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: וַיִּקַּח
  choice: கைப்பற்றினான்
  rationale: לקח அடிப்படையில் ‘எடுத்துக்கொள்’ என்றாலும், இங்கு நகரங்களின் கட்டுப்பாட்டைப் போரில் பெற்றதைக் குறிக்கிறது; ‘கைப்பற்றினான்’ சூழலுக்குத் தெளிவான தமிழ்.
- source_word: גַּת
  choice: காத்
  rationale: பெலிஸ்திய நகரப் பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: וּבְנֹתֶיהָ
  choice: அதைச் சார்ந்த ஊர்களையும்
  rationale: நேரடியாக ‘அதன் மகள்கள்’ என்று வரும் எபிரேய மரபுத்தொடர், முதன்மை நகரைச் சார்ந்த சிற்றூர்கள் அல்லது துணை நகரங்களைக் குறிக்கிறது. வாசகத்துக்கு இயல்பான பொருள் முதன்மை உரையில் தரப்பட்டு, மூல உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: מִיַּד
  choice: கையிலிருந்து
  rationale: கட்டுப்பாடு அல்லது உடைமையைக் குறிக்கும் எபிரேய ‘கையிலிருந்து’ என்ற உருவகத்தைத் தமிழிலும் புரியக்கூடிய வகையில் அப்படியே காக்கிறது.
