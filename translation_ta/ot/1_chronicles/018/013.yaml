revisions:
- from: அவன் ஏதோமில் காவற்படைகளை[a] நிறுத்தினான்; ஏதோம் முழுவதும் தாவீதுக்கு அடிமையானது. தாவீது சென்ற இடமெல்லாம் ஆண்டவர் அவனுக்கு வெற்றியளித்தார்.[b]
  to: அவன் ஏதோமில் காவல் நிலையங்களை[a] நிறுவினார்; ஏதோமியர் அனைவரும் தாவீதின் அடிமைகளானார்கள். தாவீது சென்ற இடமெல்லாம் ஆண்டவர் அவருக்கு வெற்றி தந்தார்.[b]
  rationale: திருத்தம் எபிரெய மூலத்தின் பன்மை “அடிமைகள்” மற்றும் ஏதோமின் மக்களைக் குறிக்கும் கூட்டுப்பொருளைத் தெளிவாகத் தக்கவைக்கிறது. மேலும், இராணுவச் சூழலில் נְצִיבִים என்பதற்கான இயல்பான தமிழ் வெளிப்பாட்டைப் பயன்படுத்துகிறது. இறுதிக் கூற்று வெற்றியின் பொருளைத் தக்கவைத்தபடியே, அடிக்குறிப்பில் வினையின் நேரடிப் பொருளான “காப்பாற்றினார்” என்பதையும் பாதுகாக்கிறது.
