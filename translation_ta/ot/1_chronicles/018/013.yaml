  text: וַ/יָּ֤שֶׂם בֶּֽ/אֱדוֹם֙ נְצִיבִ֔ים וַ/יִּהְי֥וּ כָל אֱד֖וֹם עֲבָדִ֣ים לְ/דָוִ֑יד וַ/יּ֤וֹשַׁע יְהוָה֙ אֶת דָּוִ֔יד בְּ/כֹ֖ל אֲשֶׁ֥ר הָלָֽךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/013.yaml
  text: He placed garrisons in Edom, and all Edom became servants to David. And the LORD gave David victory wherever he went.
translation:
  language: ta
  text: அவன் ஏதோமில் காவல் நிலையங்களை[a] நிறுவினார்; ஏதோமியர் அனைவரும் தாவீதின் அடிமைகளானார்கள். தாவீது சென்ற இடமெல்லாம் ஆண்டவர் அவருக்கு வெற்றி தந்தார்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நிர்வாக அதிகாரிகளை.”
    reason: נְצִיבִים என்பது இராணுவக் காவல் நிலையங்களையோ நியமிக்கப்பட்ட அதிகாரிகளையோ குறிக்கக்கூடும்.
  - marker: b
    text: “வெற்றி தந்தார்” என்பதற்கான எபிரெய வினை நேரடியாக “காப்பாற்றினார்” என்றும் மொழிபெயர்க்கப்படலாம். “ஆண்டவர்” என்பது இங்கு יהוה (YHWH) என்ற தெய்வீகப் பெயரைக் குறிக்கிறது.
    reason: வினையின் அடிப்படைப் பொருளையும் மூலத்தில் வரும் தெய்வீகப் பெயரையும் வாசகருக்குத் தெரிவிக்கிறது.
lexical_decisions:
- source_word: נְצִיבִים
  choice: காவற்படைகள்
  rationale: இச்சூழலில் கைப்பற்றப்பட்ட ஏதோமில் நிறுத்தப்பட்ட இராணுவக் காவல் அணிகளைக் குறிக்கிறது; எபிரெயச் சொல் ‘நிர்வாக அதிகாரிகள்’ என்றும் பொருள்படக்கூடும் என்பதால் அடிக்குறிப்பு சேர்க்கப்பட்டது.
- source_word: עֲבָדִים
  choice: அடிமை
  rationale: அரசியல் மற்றும் இராணுவ அடக்கத்தின் விளைவாக தாவீதுக்குக் கீழ்ப்பட்ட நிலையைக் குறிக்கும் வலுவான சொல்லைத் தக்கவைக்கிறது.
- source_word: וַיּוֹשַׁע
  choice: வெற்றியளித்தார்
  rationale: சொல்லின் அடிப்படைப் பொருள் ‘காப்பாற்றினார்’; போர் வெற்றிகளை விவரிக்கும் இச்சூழலில் ‘வெற்றியளித்தார்’ என்பது இயல்பான பொருள்.
- source_word: יְהוָה
  choice: ஆண்டவர்
  rationale: தெய்வீகப் பெயரைத் தமிழில் வழக்கமான மரியாதைத் தலைப்பால் குறிக்கிறது; பெயரின் தனித்துவத்தை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
theological_decisions:
- issue: தாவீதின் வெற்றியில் இறைவனின் செயற்பாடு
  choice: ஆண்டவர் அவனுக்கு வெற்றியளித்தார்
  alternative: ஆண்டவர் தாவீதைக் காப்பாற்றினார்
  rationale: எபிரெய வினையின் மீட்பு/காப்பாற்றுதல் சார்ந்த வலிமையை மறுக்காமல், இப்பகுதியின் இராணுவச் சூழலில் அதன் விளைவாகிய வெற்றியைத் தெளிவாகக் கூறுகிறது.
- issue: ஏதோமின் கீழ்ப்பட்ட நிலை
  choice: தாவீதுக்கு அடிமையானது
  alternative: தாவீதின் பணியாளர்களாயினர்
  rationale: עֲבָדִים என்பதன் கடுமையான கீழ்ப்படிதல் அர்த்தத்தை மென்மையாக்காமல் வைத்திருக்கிறது; இங்கு தனிப்பட்ட வீட்டு அடிமைத்தனத்தை விட ஒரு நாட்டின் அரசியல் அடக்கமே முதன்மைச் சூழல்.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையான, கண்ணியமான வரலாற்று நடையைப் பயன்படுத்துகிறது. ஏதோம் என்ற நாட்டை ஒருமைப் பெயராகக் கொண்டு ‘அடிமையானது’ என அமைத்துள்ளது; இது எபிரெய மூலத்தின் ‘ஏதோம் முழுவதும்’ என்ற கூட்டுப்பொருளைத் தக்கவைக்கிறது.
