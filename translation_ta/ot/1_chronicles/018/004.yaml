base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/004.yaml
  text: David captured from him 1,000 chariots, 7,000 horsemen, and 20,000 foot soldiers. Then David hamstrung all the chariot horses, but left from them enough for 100 chariots.
translation:
  language: ta
  text: தாவீது அவனிடமிருந்து 1,000 தேர்களையும், 7,000 குதிரைவீரர்களையும்,[b] 20,000 காலாட்படை வீரர்களையும் கைப்பற்றினார். பின்பு தாவீது தேர்ப்படையின் குதிரைகள் எல்லாவற்றின் பின்னங்கால் நரம்புகளையும் வெட்டினார்;[a] ஆனால் 100 தேர்களுக்குத் தேவையான குதிரைகளை மட்டும் விட்டுவைத்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில், ‘எல்லாத் தேர்கள்/தேர்ப்படை’ என்று உள்ளது. ஆனால் ‘பின்னங்கால் நரம்புகளை வெட்டுதல்’ என்ற வினையால், தேர்ப்படையைச் சேர்ந்த குதிரைகள் ஆகுபெயராகக் குறிக்கப்படுகின்றன என்று புரிந்துகொள்ளப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: இணைப்பகுதியான 2 சாமுவேல் 8:4-ல் ‘7,000 குதிரைவீரர்கள்’ என்பதற்குப் பதிலாக ‘1,700 குதிரைவீரர்கள்’ என்று உள்ளது. இது உரை மரபில் காணப்படும் எண்ணிக்கை வேறுபாடு.
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּלְכֹּד
  choice: கைப்பற்றினார்
  rationale: לכד என்பது போர்ச் சூழலில் பிடித்தல் அல்லது கைப்பற்றுதல் எனப் பொருள்படும்; நவீன தமிழில் ‘கைப்பற்றினார்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: מִמֶּנּוּ
  choice: அவனிடமிருந்து
  rationale: எபிரெயச் சுட்டுப்பெயர் ஒருமையில் இருந்து, முந்தைய சூழலில் உள்ள அதாதேசேரைக் குறிக்கிறது; ஒருமை தமிழிலும் காக்கப்படுகிறது.
- source_word: אֶלֶף רֶכֶב
  choice: 1,000 தேர்கள்
  rationale: רכב என்பது கூட்டாகத் தேர்ப்படையைக் குறிக்கக்கூடும்; எனினும் எண்ணிக்கையுடன் வருவதால் எண்ணக்கூடிய ‘தேர்கள்’ என்பது இயல்பான மொழிபெயர்ப்பு.
- source_word: פָּרָשִׁים
  choice: குதிரைவீரர்கள்
  rationale: இச்சொல் குதிரையில் போரிடும் வீரர்களைக் குறிக்கிறது; ‘குதிரைவீரர்கள்’ என்பது தெளிவான, பொதுவாகப் புரியும் தமிழ்ச் சொல்.
- source_word: אִישׁ רַגְלִי
  choice: காலாட்படை வீரர்கள்
  rationale: சொல்லுக்கு சொல் ‘கால்நடையாகச் செல்லும் ஆட்கள்’; இராணுவச் சூழலில் ‘காலாட்படை வீரர்கள்’ துல்லியமும் இயல்பும் உடையது.
- source_word: וַיְעַקֵּר
  choice: பின்னங்கால் நரம்புகளை வெட்டினார்
  rationale: עקר இச்சூழலில் குதிரைகளைப் போருக்குப் பயன்படாதவையாக்க அவற்றின் பின்னங்கால் நரம்புகளை வெட்டுவதைக் குறிக்கிறது; தமிழில் செயலைத் தெளிவாகக் கூறுவது இயல்பானது.
- source_word: אֶת כָּל הָרֶכֶב
  choice: தேர்ப்படையின் குதிரைகள் எல்லாவற்றின்
  rationale: எழுத்துப்படி ‘எல்லாத் தேர்கள்/தேர்ப்படை’; நரம்புகளை வெட்டும் வினை வாகனங்களுக்கு அல்ல, அவற்றின் குதிரைகளுக்கே பொருந்துவதால் ஆகுபெயர்ப் பொருள் வெளிப்படுத்தப்படுகிறது.
- source_word: וַיּוֹתֵר מִמֶּנּוּ מֵאָה רָכֶב
  choice: 100 தேர்களுக்குத் தேவையான குதிரைகளை மட்டும் விட்டுவைத்தார்
  rationale: முழுத் தேர்ப்படையையும் செயலிழக்கச் செய்யாமல், நூறு தேர்களுக்குரிய குதிரைகளைத் தக்கவைத்தார் என்ற மறைபொருளைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
