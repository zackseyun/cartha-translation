  source_fidelity: 'மூலத்தின் முக்கியக் கருத்துகள் துல்லியமாக உள்ளன: தமஸ்கு அராமில் படைக்காவல்கள் அமைத்தல், அராமியர் தாவீதுக்குக் கீழ்ப்படிதல், திறை கொண்டுவருதல், யாவே தாவீதுக்கு வெற்றி அளித்தல். ஆனால் עֲבָדִים என்பதற்கான ‘பணியாளர்கள்’ நவீன தமிழில் ஊதிய வேலை செய்பவர்களைக் குறிப்பதற்கு அதிக வாய்ப்புள்ளதால், இங்குள்ள அரசியல் கீழ்ப்படிதல்/வசலாட்சி கருத்தைத் தெளிவாகக் காட்டவில்லை. נֹשְׂאֵי மִנְחָה என்பது திறையைச் ‘சுமந்து/கொண்டு வருதல்’; ‘செலுத்திவந்தார்கள்’ பொருளில் அருகிலிருந்தாலும் செயல் நுணுக்கத்தைச் சற்றுக் குறைக்கிறது.'
  naturalness: நடை பொதுவாக நவீன நிலையான தமிழில் இயல்பாக உள்ளது. ‘தாவீதுக்குக் கீழ்ப்பட்டவர்களாகி, திறை கொண்டுவந்தார்கள்’ என்பது ‘தாவீதின் பணியாளர்களாகி, திறை செலுத்திவந்தார்கள்’ என்பதைக் காட்டிலும் வரலாற்று-அரசியல் சூழலுக்கு இயல்பாகவும் தெளிவாகவும் அமைகிறது.
