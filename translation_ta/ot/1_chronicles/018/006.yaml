source:
  edition: WLC
  text: וַ/יָּ֤שֶׂם דָּוִיד֙ בַּ/אֲרַ֣ם דַּרְמֶ֔שֶׂק וַ/יְהִ֤י אֲרָם֙ לְ/דָוִ֔יד עֲבָדִ֖ים נֹשְׂאֵ֣י מִנְחָ֑ה וַ/יּ֤וֹשַׁע יְהוָה֙ לְ/דָוִ֔יד בְּ/כֹ֖ל אֲשֶׁ֥ר הָלָֽךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/006.yaml
  text: And David placed garrisons in Aram of Damascus[a], and the Arameans became David’s servants, bringing tribute[c][b]. And Yahweh gave victory to David wherever he went.
translation:
  language: ta
  text: தாவீது தமஸ்கு அராமில் படைக்காவல் நிலையங்களை அமைத்தான்[a]. அராமியர்கள்[b] தாவீதுக்குக் கீழ்ப்பட்டவர்களாகி, திறை கொண்டுவந்தார்கள். தாவீது சென்ற இடமெல்லாம் யாவே அவனுக்கு வெற்றி அளித்தார்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் சொல்லுக்குச் சொல், ‘தமஸ்கு அராமில் வைத்தான்.’ எதை வைத்தான் என்பது குறிப்பிடப்படவில்லை; போர் சூழலிலிருந்து ‘படைக்காவல் நிலையங்கள்’ என்று பொருள் கொள்ளப்படுகிறது. ‘படைகளை நிறுத்தினான்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெய மொழியில் ‘அராம்’; மரபாக ‘சீரியா’ என்றும், அதன் மக்களை ‘சீரியர்கள்’ என்றும் அழைப்பதுண்டு.
    reason: alternative_reading
  - marker: c
    text: ‘தாவீதைக் காப்பாற்றினார்’ அல்லது ‘தாவீதை விடுவித்தார்’ என்றும் மொழிபெயர்க்கலாம்; போர் சூழலில் இது அவருக்கு வெற்றி அளித்ததைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: படைக்காவல் நிலையங்களை அமைத்தான்
  rationale: שׂוּם என்பதன் அடிப்படைப் பொருள் ‘வைத்தான்’; ஆனால் இங்கு நேரடிச் செயப்படுபொருள் விடுபட்டுள்ளது. போர் சூழலும் இணை வசனமும் படைக்காவல் நிலையங்களைக் குறிக்கின்றன. ஆகவே தமிழில் சூழலால் உணர்த்தப்படும் பொருள் வெளிப்படையாகக் கொடுக்கப்பட்டுள்ளது; அடிப்படைச் சொல்லின் வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: בַּאֲרַם דַּרְמֶשֶׂק
  choice: தமஸ்கு அராமில்
  rationale: எபிரெயச் சொற்றொடர் தமஸ்குவுடன் தொடர்புடைய அராம் பகுதியைக் குறிப்பிடுகிறது. ‘தமஸ்கு அராம்’ என்ற வரலாற்றுப் பெயரை இயல்பான தமிழ் வேற்றுமையுடன் வழங்குகிறது.
- source_word: אֲרָם
  choice: அராமியர்கள்
  rationale: இங்கு அராம் என்பது தாவீதுக்குக் கீழ்ப்பட்ட மக்களைக் குறிக்கிறது. எனவே நாட்டுப்பெயரை அப்படியே வைப்பதைவிட மக்களினப் பெயரான ‘அராமியர்கள்’ பொருத்தமானது.
- source_word: עֲבָדִים
  choice: பணியாளர்கள்
  rationale: עֶבֶד என்பது அடிமை, பணியாள், கீழ்ப்பட்டவர் ஆகிய பொருள்களைக் கொள்ளலாம். திறை செலுத்தும் அரசியல் சூழலில் ‘பணியாளர்கள்’ என்பது அடிமைமுறையை தேவையின்றி மிகைப்படுத்தாமல் எபிரெயச் சொல்லுக்கு நெருக்கமாக உள்ளது.
- source_word: נֹשְׂאֵי מִנְחָה
  choice: திறை செலுத்திவந்தார்கள்
  rationale: מִנְחָה இங்கு மேலாதிக்கமுள்ள அரசனுக்குச் செலுத்தப்படும் திறையைக் குறிக்கிறது. பன்முறை அல்லது தொடர்ச்சியான செயலைக் காட்டும் எபிரெயப் பங்கேற்பு வடிவம் ‘செலுத்திவந்தார்கள்’ என்று இயல்பாகத் தரப்பட்டுள்ளது.
- source_word: וַיּוֹשַׁע
  choice: வெற்றி அளித்தார்
  rationale: יָשַׁע என்பதன் ஹிஃபில் வடிவம் ‘காப்பாற்றினார்/விடுவித்தார்’ என்று நேரடியாக மொழிபெயர்க்கப்படலாம். இந்தப் போர்ச் சூழலில் தாவீதுக்கு வெற்றி கிடைக்கச் செய்தார் என்பதே கருத்து; மாற்று நேரடிப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீக நாமமான நான்கு எழுத்துப் பெயர் ஒரு பட்டத்தால் மாற்றப்படாமல், நவீன தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பான ‘யாவே’ என்று வழங்கப்படுகிறது.
- source_word: בְּכֹל אֲשֶׁר הָלָךְ
  choice: சென்ற இடமெல்லாம்
  rationale: எபிரெய மரபுத்தொடர் தாவீதின் பயணங்கள் அல்லது படையெடுப்புகள் அனைத்திலும் கிடைத்த வெற்றியைக் குறிக்கிறது. ‘சென்ற இடமெல்லாம்’ அதன் பரந்த பொருளை இயல்பாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீக நாமத்தின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல வசனம் தெய்வீக நாமத்தையே நேரடியாகப் பயன்படுத்துகிறது. எனவே பட்டப்பெயரான ‘கர்த்தர்’ என்பதற்குப் பதிலாகத் தனிப்பட்ட பெயரின் ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
- issue: וַיּוֹשַׁע என்பதில் தெய்வீகச் செயலின் தன்மை
  choice: அவனுக்கு வெற்றி அளித்தார்
  alternative: அவனைக் காப்பாற்றினார்
  rationale: ‘காப்பாற்றுதல்/விடுவித்தல்’ என்ற அடிப்படைப் பொருளை மறுக்காமல், சுற்றியுள்ள படையெடுப்பு வரலாற்றில் அதன் சூழல்சார் விளைவான வெற்றியை முதன்மை உரை தெளிவுபடுத்துகிறது. மாற்றுப் பொருள் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான வரலாற்று நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘திறை’, ‘படைக்காவல் நிலையங்கள்’ போன்ற சொற்கள் அரசியல்-போர் சூழலைத் துல்லியமாகக் காட்டுகின்றன. மூலத்தில் விடுபட்ட செயப்படுபொருளும் ‘காப்பாற்றினார்/வெற்றி அளித்தார்’ என்ற பொருள் நுணுக்கமும் அடிக்குறிப்புகள் மூலம் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளன.
