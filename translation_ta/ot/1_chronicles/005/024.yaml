  source_fidelity: மூல எபிரேயத்தின் பட்டியல் அமைப்பும், ‘தந்தையர் வீட்டின் தலைவர்கள்’ என்ற குல/வம்ச அலகுச் சொல்லாடலும், பெயர்களும், இருமுறை வரும் தலைமைக்குறிப்பும் துல்லியமாகத் தக்கவைக்கப்பட்டுள்ளன. ‘வலிமைமிக்க வீரர்கள்’ என்பது אֲנָשִׁים גִּבּוֹרֵי חַיִל என்பதன் பொருள்வலிமையை இயல்பாகக் கொடுக்கிறது; ‘புகழ்பெற்ற மனிதர்கள்’ என்பது אַנְשֵׁי שֵׁמוֹת என்ற மரபுத்தொடருக்குச் சரியான பொருளாக்கம்.
