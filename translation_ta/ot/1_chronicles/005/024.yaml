translation_notes:
  register: நவீனச் செந்தமிழுக்கு ஏற்ற, கண்ணியமான மற்றும் பொதுவாசகருக்குப் புரியும் நடை பயன்படுத்தப்பட்டது. வம்சவழிச் சமூக அமைப்பைக் குறிக்கும் ‘தந்தைவழிக் குடும்பங்கள்’ என்ற சொற்றொடர் இரு இடங்களிலும் வேண்டுமென்றே தக்கவைக்கப்பட்டது. தனிப்பெயர்கள் எபிரேய மூலவடிவத்திலிருந்து தமிழில் ஒலிபெயர்க்கப்பட்டன.
