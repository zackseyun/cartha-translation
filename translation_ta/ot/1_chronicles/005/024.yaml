base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/024.yaml
  text: 'These were the heads of their fathers’ houses: Epher[a], Ishi, Eliel, Azriel, Jeremiah, Hodaviah, and Jahdiel, mighty men of valor, men of renown[b], heads of their fathers’ houses.'
translation:
  language: ta
  text: 'இவர்களே அவர்களுடைய தந்தைவழிக் குடும்பங்களின் தலைவர்கள்: ஏபேர், இஷி, எலியேல், அஸ்ரியேல், எரேமியா, ஒதவியா, யக்தியேல். இவர்கள் வலிமைமிக்க வீரர்கள், புகழ்பெற்ற மனிதர்கள்[a], தங்கள் தந்தைவழிக் குடும்பங்களின் தலைவர்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில் சொல்லர்த்தமாக, ‘பெயருடைய மனிதர்கள்’; அதாவது, புகழும் சிறப்பும் பெற்றவர்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: இவர்களே
  rationale: பட்டியலைச் சுட்டிக்காட்டி அறிமுகப்படுத்தும் எபிரேயத் தொடரை இயல்பான தமிழில் வழங்குகிறது; தொடக்க வாவ் இணைப்பைத் தமிழில் தனியே மொழிபெயர்க்க வேண்டிய அவசியமில்லை.
- source_word: רָאשֵׁי בֵית אֲבוֹתָם
  choice: அவர்களுடைய தந்தைவழிக் குடும்பங்களின் தலைவர்கள்
  rationale: ஒரே முன்னோரின் வழிவந்த குலஞ்சார் குடும்ப அலகுகளைக் குறிக்கும் மரபுவழித் தொடரை, இன்றைய வாசகருக்குப் புரியும்படியும் அதன் தந்தைவழி சமூக அமைப்பை மறைக்காமலும் வழங்குகிறது.
- source_word: עֵפֶר
  choice: ஏபேர்
  rationale: எபிரேய மெய்யெழுத்து மற்றும் உயிரொலி வடிவத்தைத் தமிழில் நெருக்கமாக ஒலிபெயர்க்கிறது.
- source_word: יִשְׁעִי
  choice: இஷி
  rationale: எபிரேயப் பெயரின் ஒலியைத் தமிழில் இயல்பாகப் பிரதிபலிக்கிறது.
- source_word: אֱלִיאֵל
  choice: எலியேல்
  rationale: எபிரேயப் பெயரின் கூறுகளையும் ஒலியையும் தெளிவாகக் காக்கும் தமிழ் ஒலிபெயர்ப்பு.
- source_word: עַזְרִיאֵל
  choice: அஸ்ரியேல்
  rationale: எபிரேயப் பெயரை அதன் சுருக்கமான வடிவத்துக்கு நெருக்கமாக ஒலிபெயர்க்கிறது.
- source_word: יִרְמְיָה
  choice: எரேமியா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் அறியப்பட்ட, எபிரேயப் பெயருக்கு ஏற்ற வடிவம்.
- source_word: הוֹדַוְיָה
  choice: ஒதவியா
  rationale: இந்த வசனத்திலுள்ள எபிரேயப் பெயரின் தனித்த வடிவத்தை வேறு ஒத்த பெயர்களோடு ஒன்றாக்காமல் ஒலிபெயர்க்கிறது.
- source_word: יַחְדִּיאֵל
  choice: யக்தியேல்
  rationale: எபிரேயப் பெயரின் கடின மெய்யொலிக் கூட்டைத் தமிழில் வாசிக்கத்தக்க வகையில் நெருக்கமாக வழங்குகிறது.
- source_word: אֲנָשִׁים גִּבּוֹרֵי חַיִל
  choice: வலிமைமிக்க வீரர்கள்
  rationale: வலிமை, துணிவு, போர்திறன் ஆகியவற்றைக் குறிக்கக்கூடிய மரபுத் தொடரைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: אַנְשֵׁי שֵׁמוֹת
  choice: புகழ்பெற்ற மனிதர்கள்
  rationale: சொல்லர்த்தமான ‘பெயருடைய மனிதர்கள்’ என்ற எபிரேய மரபுத்தொடரின் புகழ் அல்லது சிறப்பு என்ற பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: רָאשִׁים לְבֵית אֲבוֹתָם
  choice: தங்கள் தந்தைவழிக் குடும்பங்களின் தலைவர்கள்
  rationale: தொடக்கக் கருத்தை எபிரேயம் நோக்கத்துடன் மீண்டும் கூறுவதால், அதைச் சுருக்காமல் மொழிபெயர்ப்பில் தக்கவைக்கிறது.
