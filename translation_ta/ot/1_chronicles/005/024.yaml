  terminology: ‘தந்தைவழிக் குடும்பங்கள்’ என்பது בֵּית אָבוֹת என்ற குல அடிப்படையிலான சமூக அலகைத் தந்தைவழித் தன்மையை மறைக்காமல் புரியத்தக்கவாறு வழங்குகிறது. ‘புகழ்பெற்ற மனிதர்கள்’ என்பதற்கான அடிக்குறிப்பு எபிரேய சொல்லர்த்தத்தையும் பொருள் விரிவையும் பொருத்தமாக விளக்குகிறது. தனிப்பெயர்களின் தேர்வுகள் வாசிக்கத்தக்க தமிழ் வேதாகம ஒலிபெயர்ப்பு நடைமுறைக்குள் உள்ளன.
