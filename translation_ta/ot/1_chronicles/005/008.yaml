translation:
  language: ta
  text: 8 அசாசின் மகனும், சேமாவின் மகனும், யோவேலின் மகனுமான பேலா அரோவேரிலிருந்து நேபோவும் பாகால்-மெயோனும் வரையிலும் குடியிருந்தான்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “வசித்தான்” என்றும் மொழிபெயர்க்கலாம்; எபிரெயப் பெயரெச்சம் ஓர் இடத்தில் தொடர்ந்து தங்கியிருப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֶלַע
  choice: பேலா
  rationale: ו இணைப்புச்சொல் வம்சப்பட்டியலின் தொடர்ச்சியைக் குறிக்கிறது; தமிழில் வசனத் தொடக்கத்தில் இயல்பான வாக்கிய ஓட்டத்திற்காக தனியே மொழிபெயர்க்கப்படவில்லை. בלע என்பது தனிப்பெயராக ஒலிபெயர்க்கப்பட்டது.
- source_word: בֶּן עָזָז בֶּן שֶׁמַע בֶּן יוֹאֵל
  choice: அசாசின் மகனும், சேமாவின் பேரனும், யோவேலின் கொள்ளுப்பேரனுமான
  rationale: மூன்று தலைமுறைத் தொடர்பையும் நவீன தமிழில் தெளிவாக வெளிப்படுத்துகிறது. எபிரெய மொழியின் தொடர்ச்சியான ‘மகன்’ அமைப்பை இயல்பான தமிழ் உறவுமுறைச் சொற்களால் வழங்குகிறது.
- source_word: הוּא יוֹשֵׁב
  choice: குடியிருந்தான்
  rationale: ישׁב என்பதன் Qal நிகழ்காலப் பெயரெச்சம் ஓர் இடத்தில் வசித்தல் அல்லது குடியிருத்தலைக் குறிக்கிறது; வரலாற்றுக் குறிப்பில் ‘குடியிருந்தான்’ இயல்பாக அமைகிறது. הוּא தரும் மீளெடுப்பு தமிழில் வினைமுற்றின் எழுவாய் ஒத்திசைவால் வெளிப்படுகிறது.
- source_word: בַּעֲרֹעֵר
  choice: அரோவேரில்
  rationale: ב இடத்தைக் குறிக்கிறது; அரோவேர் என்ற இடப்பெயர் ஒலிபெயர்க்கப்பட்டு ‘-இல்’ வேற்றுமை உருபு சேர்க்கப்பட்டது.
- source_word: וְעַד נְבוֹ וּבַעַל מְעוֹן
  choice: அவனுடைய குடியிருப்புப் பகுதி நேபோவையும் பாகால்-மெயோனையும் எட்டியிருந்தது
  rationale: עַד குறிக்கும் புவியியல் எல்லையைத் தமிழில் தெளிவாக்குகிறது. நேபோ, பாகால்-மெயோன் ஆகியவை இடப்பெயர்களாக ஒலிபெயர்க்கப்பட்டன; இரண்டும் ஒருங்கிணைந்த எல்லைக் குறிப்பாகப் பாதுகாக்கப்பட்டன.
