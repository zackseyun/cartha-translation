  text: Abishua fathered Bukki, and Bukki fathered Uzzi.
translation:
  language: ta
  text: அபிஷூவா புக்கியைப் பெற்றான்; புக்கி உஸ்ஸியைப் பெற்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲבִישׁוּעַ
  choice: அபிசூவா
  rationale: எபிரெயத் தனிப்பெயர் நவீனத் தமிழில் ஒலிபெயர்க்கப்பட்டது; தொடக்க வாவ் இங்கு வம்சவரலாற்றுத் தொடரைக் குறிக்கிறது, ஆனால் தனி வசனத்தின் இயல்பான தமிழ் நடையில் வெளிப்படையாக மொழிபெயர்க்கத் தேவையில்லை.
- source_word: הוֹלִיד
  choice: பெற்றான்
  rationale: யָלַד என்பதன் ஹிப்இல் வடிவம் வம்சவரலாற்றுச் சூழலில் ஒருவரைப் பெற்றெடுத்த தந்தை அல்லது மூதாதை உறவைக் குறிக்கிறது. ‘பெற்றான்’ சுருக்கமானதும் இயல்பானதும்; ‘பெற்றெடுத்தான்’ என்றால் ஆண் பெற்றெடுத்ததாகத் தவறாகப் புரியலாம்.
- source_word: אֶת
  choice: '[மொழிபெயர்க்கப்படவில்லை]'
  rationale: இது குறிப்பிட்ட நேரடிச் செயப்படுபொருளைக் குறிக்கும் எபிரெய இலக்கண உருபு; தமிழில் இதற்குத் தனிச் சொல் தேவையில்லை, செயப்படுபொருள் வேற்றுமை ‘-ஐ’ மூலம் குறிக்கப்படுகிறது.
- source_word: בֻּקִּי
  choice: புக்கி
  rationale: எபிரெயத் தனிப்பெயர் அதன் மெய்யொலி இரட்டிப்பைப் பேணும் வகையில் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: וּבֻקִּי
  choice: புக்கி
  rationale: முன்னொட்டு வாவ் தொடர்ச்சியைச் சுட்டினாலும், இரண்டு இணை வாக்கியங்களை அரைப்புள்ளியால் இணைக்கும் இயல்பான தமிழ் நடையில் தனியாக ‘மேலும்’ அல்லது ‘மற்றும்’ சேர்க்கப்படவில்லை.
- source_word: עֻזִּי
  choice: ஊசி
  rationale: எபிரெய עֻזִּי என்ற பெயரின் உச்சரிப்பை அணுகும் தமிழ் ஒலிபெயர்ப்பு; זּ ஒலி தமிழின் ‘ச’ எழுத்தால் வழக்கமாகக் குறிக்கப்படுகிறது.
theological_decisions:
- issue: הוֹלִיד குறிக்கும் தலைமுறை உறவு
  choice: ‘பெற்றான்’ என்று மொழிபெயர்த்து வம்ச உறவை மட்டும் கூறுதல்
  alternative: ‘தந்தையானான்’ அல்லது ‘நேரடியாகப் பெற்றான்’
  rationale: வம்சப்பட்டியல்களில் இந்த வினை நேரடித் தந்தை–மகன் உறவைக் குறிக்கலாம்; சில சூழல்களில் பரந்த மூதாதை உறவையும் குறிக்கக்கூடும். மூலத்தில் இல்லாத தலைமுறைத் துல்லியத்தை மொழிபெயர்ப்பு சேர்க்கவில்லை.
translation_notes:
  register: நவீன, சுருக்கமான, கண்ணியமான வம்சவரலாற்று நடை பயன்படுத்தப்பட்டுள்ளது. பெயர்கள் எபிரெய மூலத்திலிருந்து தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளன; பழமையான ‘ஜனிப்பித்தான்’ போன்ற சொற்கள் தவிர்க்கப்பட்டுள்ளன.
