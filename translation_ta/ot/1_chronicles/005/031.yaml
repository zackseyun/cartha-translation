  source_fidelity: 'வம்சவரலாற்று வினை הוֹלִיד-க்கு ‘பெற்றான்’ பொருத்தமான சுருக்கமான தமிழ் இணையாகும்; இரண்டு தலைமுறை உறவுகளும் முறையாகத் தரப்பட்டுள்ளன. ஆனால் தனிப்பெயர்களின் ஒலிபெயர்ப்பில் திருத்தம் தேவை: אֲבִישׁוּעַ-யிலுள்ள שׁ ஒலி ‘ஷ’ ஆகவும், עֻזִּי-யின் குறில் ‘உ’ மற்றும் இரட்டித்த மெய்யொலி பாதுகாக்கப்படவும் வேண்டும்.'
  naturalness: ‘பெற்றான்’ என்ற நடை நவீனத் தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது. அரைப்புள்ளியால் இரு இணை வம்சவரலாற்றுக் கூறுகளை இணைத்தல் இயல்பானது.
  terminology: பெயர்கள் எபிரெய ஒலிவடிவத்திற்கு நெருக்கமாக ‘அபிஷூவா’, ‘புக்கி’, ‘உஸ்ஸி’ என அமைக்கப்பட வேண்டும். இறையியல் சார்ந்த சிறப்புச் சொற்கள் இவ்வசனத்தில் இல்லை.
