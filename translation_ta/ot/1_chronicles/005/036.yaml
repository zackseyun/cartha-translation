base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/036.yaml
  text: And Johanan fathered Azariah[a]; he was the one who served as priest in the house that Solomon built in Jerusalem.
translation:
  language: ta
  text: யோகனான் அசரியாவைப் பெற்றான்; சாலொமோன் எருசலேமில் கட்டிய வீட்டில்[a] ஆசாரியராகப் பணியாற்றியவர் அவரே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'நேரடி மொழிபெயர்ப்பு: “வீட்டில்”; எபிரெயத்தில் “வீடு” என்பது ஆலயத்தைக் குறிப்பிடும் வழக்கமான சொல்லாகும்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יוֹחָנָן
  choice: யோகனான்
  rationale: வம்சவரலாற்றுத் தொடரில் வரும் ו இணைப்பைத் தமிழில் இயல்பான வாக்கியத் தொடக்கத்திற்காக வெளிப்படையாக மொழிபெயர்க்கவில்லை; יוֹחָנָן என்ற பெயர் ‘யோகனான்’ என ஒலிபெயர்க்கப்பட்டது.
- source_word: הוֹלִיד
  choice: பெற்றான்
  rationale: வம்சவரலாற்றுச் சூழலில் ஹிஃபில் வடிவம் தந்தைவழிப் பிறப்பைக் குறிக்கிறது; ‘பெற்றான்’ என்பது சுருக்கமான, இயல்பான நவீனத் தமிழ் வழக்கு.
- source_word: אֶת עֲזַרְיָה
  choice: அசரியாவை
  rationale: אֶת தனியாக மொழிபெயர்க்கப்படாமல் தமிழ் வேற்றுமை உருபால் குறிக்கப்பட்டது; பெயர் ‘அசரியா’ என ஒலிபெயர்க்கப்பட்டது.
- source_word: הוּא אֲשֶׁר
  choice: இவரே
  rationale: அசரியாவைத் தனித்துக் குறிப்பிடும் மூலமொழியின் வலியுறுத்தலை ‘இவரே’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כִּהֵן
  choice: ஆசாரியராகப் பணியாற்றியவர்
  rationale: כהן என்பது ஆசாரியப் பொறுப்பில் செயல்படுவதைக் குறிக்கும் வினை; நிலையை மட்டும் அல்லாமல் பணிசெய்ததையும் இந்த மொழிபெயர்ப்பு காக்கிறது.
- source_word: בַּ/בַּיִת
  choice: ஆலயத்தில்
  rationale: எபிரெயத்தில் நேரடியாக ‘வீட்டில்’ என்றாலும், சாலொமோன் எருசலேமில் கட்டிய கட்டிடம் என்ற சூழலில் அது ஆலயத்தைக் குறிக்கிறது; இயல்பான தமிழுக்காக ‘ஆலயம்’ முதன்மை உரையில் பயன்படுத்தப்பட்டு நேரடி வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אֲשֶׁר בָּנָה שְׁלֹמֹה
  choice: சாலொமோன் ... கட்டிய
  rationale: தொடர்புச் சொற்றொடரின் பொருளையும் இயல்பான தமிழ் சொல்வரிசையையும் காக்கிறது.
- source_word: בִּ/ירוּשָׁלִָם
  choice: எருசலேமில்
  rationale: இடப்பெயரின் வழக்கமான தமிழ் வடிவத்துடன் இடவேற்றுமை உருபு சேர்க்கப்பட்டது.
