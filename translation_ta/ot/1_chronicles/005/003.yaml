  register: நவீனத் தரத் தமிழில் சுருக்கமான வம்சப் பட்டியல் நடை பயன்படுத்தப்பட்டுள்ளது. ‘முதற்பேறான’ என்பது மூலத்தின் உறவையும் வரிசைச் சிறப்பையும் துல்லியமாகக் காக்கிறது; தனிப்பெயர்கள் தமிழில் பரவலாக அறியப்பட்ட வேதாகம வடிவங்களில் தரப்பட்டுள்ளன.
