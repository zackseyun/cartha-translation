  yaml_path: translation/ot/1_chronicles/005/003.yaml
  text: 'The sons of Reuben, the firstborn of Israel: Hanoch, Pallu, Hezron, and Carmi.'
translation:
  language: ta
  text: 'இஸ்ரவேலின் முதற்பேறான ரூபனின் மகன்கள்: ஆனோக்கு, பல்லூ, எஸ்ரோன், கர்மீ.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: வம்சப் பட்டியலில் வரும் בְּנֵי என்பதன் நேரடியான பொருள் ‘மகன்கள்’; ‘சந்ததியினர்’ என்பது மூலத்தைவிட விரிவானது.
- source_word: רְאוּבֵן
  choice: ரூபன்
  rationale: எபிரெய தனிப்பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: בְּכוֹר יִשְׂרָאֵל
  choice: இஸ்ரவேலின் முதற்பேறான
  rationale: ரூபனை இஸ்ரவேலின் முதலில் பிறந்த மகனாக அடையாளப்படுத்தும் ஆக்கநிலைத் தொடரை இயல்பான தமிழில் பெயரெச்சத் தொடராக வழங்குகிறது.
- source_word: חֲנוֹךְ
  choice: ஆனோக்கு
  rationale: எபிரெய தனிப்பெயருக்கு தமிழில் நிலைபெற்ற வேதாகம ஒலிபெயர்ப்பு.
- source_word: פַלּוּא
  choice: பல்லூ
  rationale: எபிரெய தனிப்பெயரின் இயல்பான தமிழ் ஒலிபெயர்ப்பு.
- source_word: חֶצְרוֹן
  choice: எஸ்ரோன்
  rationale: எபிரெய தனிப்பெயருக்கு தமிழில் நிலைபெற்ற வேதாகம ஒலிபெயர்ப்பு.
- source_word: כַרְמִי
  choice: கர்மீ
  rationale: எபிரெய தனிப்பெயரின் இயல்பான தமிழ் ஒலிபெயர்ப்பு.
