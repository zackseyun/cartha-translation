  text: Joel the chief[a], Shapham the second, and Jaanai and Shaphat in Bashan.
translation:
  language: ta
  text: தலைவனாக யோவேலும், இரண்டாமவராகச் சாப்பாமும்[a], யானாயும் சாப்பாத்தும் பாசானில் இருந்தனர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “துணைத் தலைவரான சாப்பாம்” அல்லது “தரவரிசையில் இரண்டாமவரான சாப்பாம்.”
    reason: הַמִּשְׁנֶה என்பது இரண்டாம் இடத்தையோ துணைநிலையையோ குறிக்கக்கூடும்; குறிப்பிட்ட பதவி தெளிவாக இல்லை.
lexical_decisions:
- source_word: יוֹאֵל
  choice: யோவேல்
  rationale: எபிரெய தனிப்பட்ட பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: הָרֹאשׁ
  choice: தலைவரான
  rationale: רֹאשׁ என்பதன் அடிப்படைப் பொருள் ‘தலை’; இங்கு அது முதன்மை அல்லது தலைமைப் பதவியைக் குறிக்கிறது.
- source_word: וְשָׁפָם
  choice: சாப்பாம்
  rationale: எபிரெய தனிப்பட்ட பெயரைத் தமிழில் ஒலிபெயர்த்த வடிவம்.
- source_word: הַמִּשְׁנֶה
  choice: இரண்டாம் நிலையில் இருந்த
  rationale: இச்சொல் இரண்டாம் இடத்தையோ அடுத்த தரநிலையையோ குறிக்கிறது. ‘துணைத் தலைவர்’ என்பது சாத்தியமானாலும் அதிக விளக்கமளிப்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְיַעְנַי
  choice: யானாய்
  rationale: எபிரெய தனிப்பட்ட பெயரைத் தமிழில் ஒலிபெயர்த்த வடிவம்.
- source_word: וְשָׁפָט
  choice: சாப்பாத்
  rationale: எபிரெய தனிப்பட்ட பெயரைத் தமிழில் ஒலிபெயர்த்த வடிவம்.
- source_word: בַּבָּשָׁן
  choice: பாசானில்
  rationale: இடப்பெயருடன் இணைந்த בְּ முன்னிடைச்சொல்லின் பொருளைத் தமிழின் ‘-இல்’ வேற்றுமை உருபால் இயல்பாக வெளிப்படுத்துகிறது.
