translation_notes:
  register: நவீன நிலையான தமிழில், பட்டியல் அமைப்பை வாசிக்க எளிதாக வைத்துள்ளோம். எபிரெயில் வெளிப்படையாக இல்லாத வினையைத் தமிழில் முழுமையான வாக்கியத்திற்காக ‘இருந்தனர்’ எனக் குறைந்த அளவில் சேர்த்துள்ளோம்; பதவிநிலையின் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
