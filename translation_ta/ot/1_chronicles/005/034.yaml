translation:
  language: ta
  text: அகிதூப் சாதோக்குக்குத் தந்தையானான்; சாதோக்கு அகிமாசுக்குத் தந்தையானான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲחִיטוּב
  choice: அகிதூப்
  rationale: எபிரெய தனிப்பெயரின் ஒலிப்பை நவீனத் தமிழுக்கு இயல்பாக ஒலிபெயர்த்துள்ளது.
- source_word: הוֹלִיד
  choice: பெற்றான்
  rationale: வம்சவரலாற்றுச் சூழலில் ஒருவன் மற்றொருவனுக்குத் தந்தையானதைக் குறிக்கிறது; சுருக்கமாகவும் இயல்பாகவும் தமிழில் ‘பெற்றான்’ என வழங்கப்பட்டுள்ளது.
- source_word: אֶת
  choice: '[தனியாக மொழிபெயர்க்கப்படவில்லை]'
  rationale: இது நேரடிச் செயப்படுபொருளைக் குறிக்கும் இலக்கண உருபு; அதன் பணி தமிழின் ‘ஐ’ வேற்றுமை உருபால் வெளிப்படுகிறது.
- source_word: צָדוֹק
  choice: சாதோக்கு
  rationale: எபிரெய தனிப்பெயரின் ஒலிப்பைத் தமிழில் ஒலிபெயர்த்துள்ளது; ‘ஐ’ உருபு சேரும்போது ‘சாதோக்கைப்’ என்றும் எழுவாயாக வரும்போது ‘சாதோக்கு’ என்றும் வருகிறது.
- source_word: וְ
  choice: ;
  rationale: இணைப்புச் சொல்லின் தொடர்பைத் தமிழில் இயல்பான தொடர்வாக்கிய அமைப்பும் அரைப்புள்ளியும் வெளிப்படுத்துகின்றன; நிகழ்வுகளின் வரிசையைத் தேவையின்றி வலுப்படுத்தவில்லை.
- source_word: הוֹלִיד
  choice: பெற்றான்
  rationale: மீண்டும் வரும் வம்சவரலாற்று வினை ஒரேவிதமாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: אֲחִימָעַץ
  choice: அகிமாஸ்
  rationale: எபிரெய தனிப்பெயரின் ஒலிப்பை நவீனத் தமிழுக்கு ஏற்றவாறு ஒலிபெயர்த்துள்ளது; வாக்கியத்தில் ‘ஐ’ உருபுடன் ‘அகிமாசைப்’ என வருகிறது.
