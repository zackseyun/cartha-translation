translation_notes:
  register: நவீன நிலையான தமிழில், வம்சப்பட்டியலுக்கேற்ற சுருக்கமானவும் கண்ணியமானவும் நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. பழமையான ‘ஜனிப்பித்தான்’ போன்ற சொல்லாட்சியைத் தவிர்த்து, பொதுவாகப் புரியும் ‘பெற்றான்’ பயன்படுத்தப்பட்டுள்ளது.
