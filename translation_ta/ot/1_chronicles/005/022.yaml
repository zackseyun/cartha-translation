base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/022.yaml
  text: For many slain fell[a], because the battle was from God; and they lived in their place until the exile.
translation:
  language: ta
  text: பலர் கொல்லப்பட்டு விழுந்தனர்; ஏனெனில் அந்தப் போர் கடவுளிடமிருந்து வந்தது.[a] அவர்கள் அவர்களுக்குப் பதிலாக நாடுகடத்தல் வரை குடியிருந்தனர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்தப் போர் கடவுளுக்குரியது.” போரின் முடிவு கடவுளிடமிருந்து வந்தது என்பதை எபிரெயச் சொற்றொடர் வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முதல் כִּי முந்தைய வெற்றிச் செய்திக்கான காரண விளக்கத்தை அறிமுகப்படுத்துகிறது; தமிழில் ‘ஏனெனில்’ அந்தத் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: חֲלָלִים רַבִּים
  choice: கொல்லப்பட்டவர்கள் பலர்
  rationale: חֲלָלִים போரில் குத்துண்டு அல்லது தாக்குண்டு கொல்லப்பட்டவர்களைக் குறிக்கிறது; பொதுவான ‘இறந்தவர்கள்’ என்பதைக் காட்டிலும் போர்ச் சூழலை இது காக்கிறது.
- source_word: נָפָלוּ
  choice: விழுந்தார்கள்
  rationale: נפל போர்ச் சூழலில் இறந்து விழுவதைக் குறிக்கும் வழக்குச் சொல்; ‘கொல்லப்பட்டவர்கள்’ என்பதே மரணப் பொருளைத் தெளிவாக்குவதால், வினையை மேலதிக விளக்கமின்றி மொழிபெயர்க்கலாம்.
- source_word: כִּי
  choice: அந்தப் போர் கடவுளிடமிருந்து வந்தது
  rationale: இரண்டாவது כִּי காரணத்தை அறிமுகப்படுத்துகிறது. தமிழில் தனியே மீண்டும் ‘ஏனெனில்’ சேர்ப்பதைவிட அரைப்புள்ளிக்குப் பிந்தைய காரணவாக்கியம் இயல்பாக உள்ளது.
- source_word: מֵהָאֱלֹהִים
  choice: கடவுளிடமிருந்து வந்தது
  rationale: מִן மூலத்தையோ தோற்றுவாயையோ குறிக்கிறது. ‘கடவுளிடமிருந்து வந்தது’ என்பது நேரடி தெய்வீகச் செயற்பாட்டை எபிரெயத்தைவிட வலுப்படுத்தாமல் அதன் மூலப் பொருளைப் பேணுகிறது.
- source_word: הַמִּלְחָמָה
  choice: அந்தப் போர்
  rationale: מִלְחָמָה இங்கு முன்பு விவரிக்கப்பட்ட குறிப்பிட்ட ஆயுத மோதலைக் குறிக்கிறது; தமிழ் சூழலில் ‘அந்தப் போர்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: וַיֵּשְׁבוּ
  choice: குடியிருந்தார்கள்
  rationale: ישב வாழ்தல், தங்குதல், குடியேறுதல் ஆகிய பொருள்களைக் கொள்ளலாம். கைப்பற்றிய நிலத்தில் தொடர்ந்து வாழ்ந்த சூழலில் ‘குடியிருந்தார்கள்’ குடியேற்ற நுணுக்கத்தையும் தெரிவிக்கிறது.
- source_word: תַחְתֵּיהֶם
  choice: அவர்களுடைய இடத்தில்
  rationale: இந்தச் சொற்றொடர் தோற்கடிக்கப்பட்ட மக்களின் இடத்தை எடுத்துக்கொண்டு வாழ்ந்ததைக் குறிக்கிறது; சொற்படியான ‘அவர்களுக்குக் கீழே’ என்பது இங்கு தவறாகப் புரியப்படும்.
- source_word: עַד הַגֹּלָה
  choice: நாடுகடத்தப்படும் காலம்வரை
  rationale: גּוֹלָה நாடுகடத்தலையோ சிறைப்பிடித்துக் கொண்டு செல்லப்படுதலையோ குறிக்கிறது. ‘நாடுகடத்தப்படும் காலம்வரை’ வரலாற்றுச் சம்பவத்தை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: போரில் கடவுளின் ஈடுபாடு
  choice: அந்தப் போர் கடவுளிடமிருந்து வந்தது
  alternative: அந்தப் போர் கடவுளுக்குரியது
  rationale: எபிரெய உரை போரின் தீர்மானிக்கும் தன்மை அல்லது முடிவின் மூலமாகக் கடவுளைக் குறிப்பிடுகிறது. முதன்மை மொழிபெயர்ப்பு மூலத்தைக் காக்கிறது; ‘கடவுளுக்குரியது’ என்ற உரிமை சார்ந்த வாசிப்பும் சாத்தியமாதலால் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம வரலாற்றுரைக்கேற்ற கண்ணியத்துடனும் அமைக்கப்பட்டுள்ளது. காரணத் தொடர்பு, போரில் விழுந்தவர்களின் பொருள், இடம்பெயர்த்துக் குடியேறிய நுணுக்கம் ஆகியவை வெளிப்படையாகக் காக்கப்பட்டுள்ளன.
