  register: நவீன நிலையான தமிழில், வம்சவரிசைக்கேற்ற சுருக்கமானவும் கண்ணியமானவும் உள்ள நடை. ஆள்பெயர்கள் மூல எபிரேய ஒலிகளுக்கு அணுக்கமாக ஒலிப்பெயர்க்கப்பட்டுள்ளன.
