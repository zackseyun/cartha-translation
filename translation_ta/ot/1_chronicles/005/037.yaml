translation:
  language: ta
  text: அசரியா அமரியாவைப் பெற்றான்; அமரியா அகித்தூபைப் பெற்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיּוֹלֶד / הוֹלִיד
  choice: பெற்றான்
  rationale: யָלַד என்பதன் ஹிஃபில் வடிவம் வம்சவரிசைச் சூத்திரத்தில் ஒருவருக்குப் பிள்ளை பிறந்ததைக் குறிக்கிறது. நவீனத் தமிழில் ‘பெற்றான்’ இயல்பாகவும் சுருக்கமாகவும் இந்த வம்சத் தொடர்பை வெளிப்படுத்துகிறது.
- source_word: עֲזַרְיָה
  choice: அசரியா
  rationale: எபிரேய ஆள்பெயரின் ஒலிப்பெயர்ப்பு.
- source_word: אֲמַרְיָה
  choice: அமரியா
  rationale: எபிரேய ஆள்பெயரின் ஒலிப்பெயர்ப்பு; இரு இடங்களிலும் ஒரே வடிவில் வழங்கப்பட்டுள்ளது.
- source_word: אֲחִיטוּב
  choice: அகித்தூப்
  rationale: எபிரேய ஆள்பெயரின் ஒலிப்பெயர்ப்பு; இறுதி மெய்யொலியைத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: אֶת
  choice: தனியாக மொழிபெயர்க்கப்படவில்லை
  rationale: இது நேரடிச் செயப்படுபொருளைக் குறிக்கும் இலக்கண உருபு; தமிழில் ‘-ஐ’ வேற்றுமை உருபால் அதன் செயல்பாடு வெளிப்படுகிறது.
