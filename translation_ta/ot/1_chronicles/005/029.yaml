translation_notes:
  register: நவீனத் தரத் தமிழில், வம்சப்பட்டியலுக்கேற்ற சுருக்கமானவும் கண்ணியமானவும் உள்ள நடை பயன்படுத்தப்பட்டது. ‘பிள்ளைகள்’ என்பது மூலத்தின் சொற்பொருளிலிருந்து சிறிது விலகினாலும், பட்டியலில் மிரியாம் இடம்பெறுவதைத் தெளிவாகவும் இயல்பாகவும் எடுத்துரைக்கிறது; மூலச் சொல் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
