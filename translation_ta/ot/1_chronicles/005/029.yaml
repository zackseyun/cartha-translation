base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/029.yaml
  text: 'The sons of Amram: Aaron[a], Moses, and Miriam; and the sons of Aaron: Nadab and Abihu, Eleazar and Ithamar.'
translation:
  language: ta
  text: 'அம்ராமின் பிள்ளைகள்[a]: ஆரோன், மோசே, மிரியாம்; ஆரோனின் மகன்கள்: நாதாப், அபிகூ, எலெயாசார், இத்தாமார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘மகன்கள்’ என்று உள்ளது. ஆனால் இந்த வம்சப்பட்டியலில் அம்ராமின் கீழ் ஆரோன், மோசே ஆகியோருடன் மிரியாமும் சேர்க்கப்பட்டிருப்பதால், இங்கே அது அவரது பிள்ளைகளைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי עַמְרָם
  choice: அம்ராமின் பிள்ளைகள்
  rationale: בְּנֵי என்பதன் அடிப்படைப் பொருள் ‘மகன்கள்’ என்றாலும், இங்கு ஆரோன், மோசே ஆகியோருடன் மிரியாமும் பட்டியலிடப்படுவதால், பாலினத்தை உள்ளடக்கும் இயல்பான தமிழ்ச் சொல்லான ‘பிள்ளைகள்’ பயன்படுத்தப்பட்டது. தொடக்க וּ- வம்சப்பட்டியல் நடையில் தனியே ‘மேலும்’ என மொழிபெயர்க்கப்படவில்லை.
- source_word: אַהֲרֹן וּמֹשֶׁה וּמִרְיָם
  choice: ஆரோன், மோசே, மிரியாம்
  rationale: பெயர்கள் தமிழில் வழக்கமான வேதாகம ஒலிபெயர்ப்பு வடிவங்களில் தரப்பட்டுள்ளன; எபிரெயத்தில் ஒவ்வொரு பெயருக்கும் முன் வரும் இணைப்புச் சொற்களைத் தமிழ்ப் பட்டியலில் மீண்டும் மீண்டும் காட்டாமல் இயல்பாக அமைக்கப்பட்டது.
- source_word: וּבְנֵי אַהֲרֹן
  choice: ஆரோனின் மகன்கள்
  rationale: இரண்டாவது வம்சத் துணைப் பட்டியலைத் தெளிவாக அறிமுகப்படுத்துகிறது. இங்கு பட்டியலிடப்பட்டவர்கள் அனைவரும் ஆண்கள் என்பதால் ‘மகன்கள்’ என்பது துல்லியமானது.
- source_word: נָדָב וַאֲבִיהוּא אֶלְעָזָר וְאִיתָמָר
  choice: நாதாப், அபிகூ, எலெயாசார், இத்தாமார்
  rationale: தனிப்பெயர்கள் தமிழில் பரவலாக அறியப்பட்ட வேதாகம ஒலிபெயர்ப்பு மரபின்படி தரப்பட்டன; இணைப்புகள் தமிழின் பட்டியல் நடைக்கேற்ப நிறுத்தற்குறிகளால் வெளிப்படுத்தப்பட்டன.
