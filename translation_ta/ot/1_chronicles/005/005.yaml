  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: מִיכָ֥ה בְנ֛/וֹ רְאָיָ֥ה בְנ֖/וֹ בַּ֥עַל בְּנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/005.yaml
  text: Micah his son[a], Reaiah his son, Baal his son.
translation:
  language: ta
  text: அவனுடைய மகன் மீகா; அவனுடைய மகன் ரெயாயா; அவனுடைய மகன் பாகால்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு ‘பாகால்’ என்பது வம்சவரலாற்றில் வரும் ஓர் ஆள்பெயர்; ‘ஆண்டவன்’ என்று மொழிபெயர்க்கப்படும் பட்டப்பெயர் அல்ல.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִיכָה
  choice: மீகா
  rationale: வம்சவரலாற்றில் வரும் ஆள்பெயர்; எபிரெய ஒலிப்புக்கு நெருக்கமாகவும் தமிழில் இயல்பாகவும் ஒலிபெயர்க்கப்பட்டது.
- source_word: בְנוֹ
  choice: அவனுடைய மகன்
  rationale: மூன்றாம் நபர் ஆண்பால் ஒருமை உடைமைப் பின்னொட்டுடன் வரும் சொல்லின் நேரான பொருள் ‘அவனுடைய மகன்.’ இவ்வம்சவரலாற்றுத் தொடரில் ஒவ்வொரு தலைமுறை உறவையும் தெளிவாகக் காட்டுகிறது.
- source_word: רְאָיָה
  choice: ரெயாயா
  rationale: மொழிபெயர்க்கப்பட வேண்டிய பொதுப்பெயர் அல்ல, ஆள்பெயர்; எபிரெய வடிவத்தைப் பிரதிபலிக்கும் வகையில் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: בַּעַל
  choice: பாகால்
  rationale: இங்கு வம்சவரலாற்றுப் பட்டியலில் ஆள்பெயராக வருகிறது. ஆகவே ‘ஆண்டவன்’ போன்ற பட்டப்பெயராக மொழிபெயர்க்காமல் பெயராக ஒலிபெயர்க்கப்பட்டது.
theological_decisions:
- issue: בַּעַל என்பதைப் பட்டப்பெயராக அல்லது தெய்வக் குறிப்பாக மொழிபெயர்ப்பதா, ஆள்பெயராக வைத்திருப்பதா
  choice: ‘பாகால்’ என்ற ஆள்பெயராக வைத்தல்
  alternative: ‘ஆண்டவன்’ போன்ற பட்டப்பெயராக மொழிபெயர்த்தல்
  rationale: இச்சொல் மற்ற ஆள்பெயர்களுடன் வம்சவரலாற்றுத் தொடரில் அமைந்துள்ளதால், இங்கு அது ஆள்பெயராகச் செயல்படுகிறது. பட்டப்பெயராக மொழிபெயர்ப்பது வசனத்தின் இலக்கணத்தையும் இலக்கிய வகையையும் மறைத்துவிடும்.
translation_notes:
  register: நவீன பொதுத்தமிழில், வம்சவரலாற்றுக்குரிய சுருக்கமான மீளுருவைத் தக்கவைத்து, பெயர்களை எபிரெயத்திலிருந்து ஒலிபெயர்த்துள்ளது. தெளிவுக்காக ஒவ்வொரு தலைமுறையும் அரைப்புள்ளியால் பிரிக்கப்பட்டுள்ளது.
