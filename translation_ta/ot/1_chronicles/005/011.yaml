id: 1CH.5.11
reference: 1 Chronicles 5:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וּ/בְנֵי גָ֣ד לְ/נֶגְדָּ֗/ם יָֽשְׁב֛וּ בְּ/אֶ֥רֶץ הַ/בָּשָׁ֖ן עַד סַלְכָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/011.yaml
  text: And the sons of Gad lived opposite them in the land of Bashan[b][a], as far as Salecah.
translation:
  language: ta
  text: காதின் மக்கள் அவர்களுக்கு எதிரே[a], பாசான் நாட்டில் சல்கா[b] வரையிலும் குடியிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவர்களுக்கு அருகில்” அல்லது “அவர்களை எதிர்நோக்கியவாறு” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொற்றொடர், முந்தைய வசனத்தில் குறிப்பிடப்பட்ட மக்களுடன் ஒப்பிட்ட இடநிலையைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: இந்த இடப்பெயர் சில மொழிபெயர்ப்புகளில் “சலேகா” என்றும் வழங்கப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי גָד
  choice: காதின் மக்கள்
  rationale: בני என்பது சொற்படியாக ‘மகன்கள்’ என்றாலும், இங்குள்ள கோத்திர மற்றும் நிலப்பகுதிச் சூழலில் காதின் வழிவந்த கோத்திர மக்களைக் குறிக்கிறது; ‘காதின் மக்கள்’ என்பது நவீன தமிழில் இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: לְ/נֶגְדָּ/ם
  choice: அவர்களுக்கு எதிரே
  rationale: נגד என்ற சொல் ஒருவரையோ ஒரு குழுவையோ ஒப்பிட்டு முன்னால், எதிரில் அல்லது எதிர்ப்புறத்தில் உள்ள இடநிலையைக் குறிக்கிறது. முந்தைய வசனத்தில் சொல்லப்பட்ட ரூபேனியரைச் சார்ந்த இடவுறவைத் தீர்மானிக்காமல் ‘எதிரே’ என்றே மொழிபெயர்க்கப்படுகிறது.
- source_word: יָשְׁבוּ
  choice: குடியிருந்தார்கள்
  rationale: ישב இங்கு ஒரு நிலப்பகுதியில் தொடர்ந்து வசித்ததைச் சொல்கிறது. ‘குடியிருந்தார்கள்’ என்பது வெறும் ‘இருந்தார்கள்’ என்பதைவிட குடியேற்றச் சூழலைத் தெளிவாகக் காட்டுகிறது; ஒருமுறை நிகழ்ந்த குடியேற்றச் செயலாக மட்டும் பொருள்படாமல் தொடர்ந்த வசிப்பையும் குறிக்கிறது.
- source_word: בְּ/אֶרֶץ הַ/בָּשָׁן
  choice: பாசான் நாட்டில்
  rationale: ארץ இங்கு பெயரிடப்பட்ட ஒரு நிலப்பகுதியைக் குறிக்கிறது. בָּשָׁן என்ற இடப்பெயர் தமிழில் வழக்கமான ஒலிபெயர்ப்பாக ‘பாசான்’ என வழங்கப்படுகிறது.
- source_word: עַד
  choice: வரையிலும்
  rationale: நிலவியல் எல்லை அல்லது பரப்பின் எட்டுமுனையைக் குறிக்கும் עַד என்பதற்கு ‘வரையிலும்’ இயல்பான தமிழ் இணை.
- source_word: סַלְכָה
  choice: சல்கா
  rationale: எபிரெய இடப்பெயரின் மெய்யொலி அமைப்பை நெருக்கமாகக் காக்கும் தமிழ் ஒலிபெயர்ப்பு. மாற்று மரபு வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
