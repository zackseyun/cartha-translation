translation_notes:
  register: நவீன தரத் தமிழில், எளிதில் புரியும் ஆனால் வேதாகம வரலாற்றுச் செய்திக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘மக்கள்’ என்பது கோத்திர வழிவந்தோரைக் குறிக்கிறது; இடவுறவின் இயல்பான தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
