base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/014.yaml
  text: These were the sons of Abihail son of Huri[a], son of Jaroah, son of Gilead, son of Michael, son of Jeshishai, son of Jahdo, son of Buz.
translation:
  language: ta
  text: 'இவர்கள் அபிகாயிலின் மகன்கள்[a]: அபிகாயில் ஹூரியின் மகன்; ஹூரி யாரோகாவின் மகன்; யாரோகா கிலேயாத்தின் மகன்; கிலேயாத் மிகாவேலின் மகன்; மிகாவேல் யெஷிஷாயின் மகன்; யெஷிஷாய் யக்தோவின் மகன்; யக்தோ பூஸின் மகன்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு வரும் “மகன்கள்” என்பதும் தொடர்ந்து வரும் “மகன்” என்பதும் ஒரு குடும்பத்தின் வம்சவழியைக் குறிக்கலாம்; ஒவ்வொரு தலைமுறையும் தவறாமல் பட்டியலிடப்பட்டிருக்க வேண்டும் என்பதில்லை.
    reason: cultural_note
lexical_decisions:
- source_word: אֵלֶּה
  choice: இவர்கள்
  rationale: பன்மைச் சுட்டுப்பெயர் வம்சப்பட்டியலில் குறிப்பிடப்படும் நபர்களை இயல்பாக அறிமுகப்படுத்துகிறது; எபிரெயத்தில் வெளிப்படையான வினைச்சொல் இல்லை.
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: கட்டுநிலைப் பன்மையான בְּנֵי என்பதன் நேரடிப் பொருளைப் பாதுகாக்கிறது; வம்சவழக்கில் இது விரிந்த சந்ததியையும் குறிக்கக்கூடும் என்பதை அடிக்குறிப்பு தெரிவிக்கிறது.
- source_word: בֶּן
  choice: மகன்
  rationale: மூலத்தில் திரும்பத் திரும்ப வரும் ஒருமை உறவுமுறையைத் தெளிவாகப் பாதுகாக்கிறது; இடைப்பட்ட தலைமுறைகள் விடப்பட்டிருக்கக்கூடிய சாத்தியத்தைத் தீர்மானித்துவிடவில்லை.
- source_word: אֲבִיחַיִל
  choice: அபிகாயில்
  rationale: எபிரெயத் தனிப்பெயரின் ஒலிப்பெயர்ப்பு.
- source_word: חוּרִי
  choice: ஊரி
  rationale: தொடக்க எபிரெய மெய்யான ח ஒலியைத் தமிழில் இயல்பாக அணுகும் ஒலிப்பெயர்ப்பு.
- source_word: יָרוֹחַ
  choice: யாரோகா
  rationale: நீண்ட முதல் உயிரையும் இறுதி ח ஒலியையும் இயன்றவரை பிரதிபலிக்கும் தமிழ் ஒலிப்பெயர்ப்பு.
- source_word: גִּלְעָד
  choice: கிலேயாத்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரிச்சயமான வடிவத்தையும் எபிரெய ஒலியமைப்பையும் இணைக்கிறது.
- source_word: מִיכָאֵל
  choice: மிகாவேல்
  rationale: எபிரெயப் பெயரின் மெய்-உயிர் அமைப்பை ஆங்கில மரபுவடிவத்திலிருந்து அல்லாமல் நேரடியாகப் பிரதிபலிக்கிறது.
- source_word: יְשִׁישַׁי
  choice: எசிசாய்
  rationale: எபிரெயப் பெயரின் ஷ் ஒலிகளையும் இறுதி ஐ ஒலியையும் வாசிக்க எளிய தமிழில் தருகிறது.
- source_word: יַחְדּוֹ
  choice: யக்தோ
  rationale: חְדּ மெய்க்கூட்டின் ஒலியைத் தமிழில் அணுகும் நேரடி ஒலிப்பெயர்ப்பு.
- source_word: בּוּז
  choice: பூஸ்
  rationale: எபிரெய நீண்ட ū உயிரையும் இறுதி z ஒலியையும் தமிழில் நெருக்கமாகக் குறிக்கிறது.
theological_decisions:
- issue: வம்சப்பட்டியலில் ‘மகன்/மகன்கள்’ என்பதன் பரப்பு
  choice: மூலத்தின் ‘மகன்/மகன்கள்’ என்ற வடிவம் பிரதான உரையில் வைக்கப்பட்டது.
  alternative: ‘வழிவந்தவர்/சந்ததியினர்’ என்று விரிவாக மொழிபெயர்த்தல்.
  rationale: வம்சப்பட்டியல்கள் தலைமுறைகளைச் சுருக்கக்கூடும் என்ற உண்மையை மறுக்காமல், மூலத்தின் வெளிப்படையான உறவுமுறைச் சொல்லை மாற்றாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட வம்சப்பட்டியல் நடை பயன்படுத்தப்பட்டது. நீண்ட ‘X-இன் மகன்’ சங்கிலியைச் சிறு வாக்கியக் கூறுகளாகப் பிரித்து உறவுகள் தெளிவாக்கப்பட்டன; தனிப்பெயர்கள் WLC எபிரெய உரையிலிருந்து ஒலிப்பெயர்க்கப்பட்டன.
