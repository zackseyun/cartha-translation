revisions:
- from: இவர்கள் அபிகாயிலின் மகன்கள். அபிகாயில் ஊரியின் மகன்[a]; ஊரி யாரோகாவின் மகன்; யாரோகா கிலேயாத்தின் மகன்; கிலேயாத் மிகாவேலின் மகன்; மிகாவேல் எசிசாயின் மகன்; எசிசாய் யக்தோவின் மகன்; யக்தோ பூசின் மகன்.
