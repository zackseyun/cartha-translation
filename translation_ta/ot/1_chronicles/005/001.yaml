source:
  edition: WLC
  text: וּ/בְנֵ֨י רְאוּבֵ֥ן בְּכֽוֹר יִשְׂרָאֵל֮ כִּ֣י ה֣וּא הַ/בְּכוֹר֒ וּֽ/בְ/חַלְּל/וֹ֙ יְצוּעֵ֣י אָבִ֔י/ו נִתְּנָה֙ בְּכֹ֣רָת֔/וֹ לִ/בְנֵ֥י יוֹסֵ֖ף בֶּן יִשְׂרָאֵ֑ל וְ/לֹ֥א לְ/הִתְיַחֵ֖שׂ לַ/בְּכֹרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/001.yaml
  text: The sons of Reuben[a], the firstborn of Israel—for he was the firstborn, but because he defiled his father’s bed, his birthright was given to the sons of Joseph son of Israel[b], though not to be enrolled by birthright—
translation:
  language: ta
  text: இஸ்ரவேலின் முதற்பேறான ரூபனின் மகன்கள்—அவன் முதற்பேறானவன்தான்; ஆனால் அவன் தன் தகப்பனின் படுக்கையைத் தீட்டுப்படுத்தியதால்[a], அவனுடைய முதற்பேறு உரிமை இஸ்ரவேலின் மகனான யோசேப்பின் மகன்களுக்குக் கொடுக்கப்பட்டது; ஆயினும், அது முதற்பேறு உரிமையின்படி வம்சப் பட்டியலில் பதிவு செய்யப்படுவதற்காக அல்ல[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல் மொழிபெயர்த்தால், ‘தன் தகப்பனின் படுக்கைகளை’ அல்லது ‘படுக்கை மேடைகளை.’ எபிரெயில் இச்சொல் பன்மையில் இருந்தாலும், இங்கே அது திருமணப் படுக்கையைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: 'வேறு வகையில்: ‘ஆனால் முதற்பேறு உரிமையின்படி வம்சத்தில் கணக்கிடப்படுவதற்காக அல்ல.’'
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵי
  choice: ரூபனின் மகன்கள்
  rationale: וְ என்னும் இணைப்பின் தொடர்ச்சிப் பொருள் வசனத்தின் அமைப்பிலேயே வெளிப்படுகிறது; தமிழில் தேவையற்ற ‘இப்போது’ போன்ற காலக் குறிப்பைச் சேர்க்காமல் இயல்பாகத் தொடங்குகிறது.
- source_word: בְּכוֹר יִשְׂרָאֵל
  choice: இஸ்ரவேலின் முதற்பேறான
  rationale: בכור பிறப்பு வரிசையையும் முதற்பேறான மகனின் நிலையையும் குறிக்கிறது; ‘முதற்பேறான’ என்பது இவ்விரண்டையும் முறையாகத் தக்கவைக்கிறது.
- source_word: כִּי הוּא הַבְּכוֹר
  choice: அவன் முதற்பேறானவன்தான்
  rationale: כִּי இங்கே விளக்கத்தை அறிமுகப்படுத்துகிறது. ‘-தான்’ என்பது ரூபனின் உயிரியல் முதற்பேற்று நிலையை வலியுறுத்தி, பின்னர் வரும் உரிமை மாற்றத்துடனான இழுவிசையைப் பாதுகாக்கிறது.
- source_word: וּבְחַלְּלוֹ
  choice: ஆனால் அவன் ... தீட்டுப்படுத்தியதால்
  rationale: חלל இங்கே தகப்பனின் திருமணப் படுக்கையைப் பாலியல் முறையில் அவமதித்த செயலைக் குறிக்கிறது; காரணப் பொருளுடைய בְּ உடன் வரும் வினையெச்சம் தமிழில் ‘-தால்’ என இயல்பாக வெளிப்படுகிறது.
- source_word: יְצוּעֵי אָבִיו
  choice: தன் தகப்பனின் படுக்கையை
  rationale: எபிரெயில் பன்மையாக இருந்தாலும், இது திருமணப் படுக்கையைக் குறிக்கும் மரபுத்தொடர்; தமிழில் ஒருமை இயல்பானது. மூலத்தின் பன்மை அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: נִתְּנָה בְּכֹרָתוֹ
  choice: அவனுடைய முதற்பேறு உரிமை ... கொடுக்கப்பட்டது
  rationale: בכורה வெறும் பிறப்பு வரிசையை அல்ல, முதற்பேறானவருக்குரிய சிறப்புரிமையை இங்கே குறிக்கிறது; ‘முதற்பேறு உரிமை’ அந்தச் சட்டப்பூர்வ நிலையைக் காக்கிறது.
- source_word: לִבְנֵי יוֹסֵף בֶּן יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகனான யோசேப்பின் மகன்களுக்கு
  rationale: யோசேப்பு இஸ்ரவேலின் மகன் என்பதைக் கூறும் மூலத்தின் வம்சவழிச் சொற்றொடர் வெளிப்படையாகப் பாதுகாக்கப்படுகிறது.
- source_word: וְלֹא לְהִתְיַחֵשׂ לַבְּכֹרָה
  choice: ஆயினும், முதற்பேறு உரிமையின்படி வம்சப் பட்டியலில் பதிவு செய்வதற்காக அல்ல
  rationale: התיחשׂ என்பது வம்சவழிப் பதிவு அல்லது கணக்கீட்டைக் குறிக்கும் தொழில்நுட்பச் சொல். மூலத்தில் செய்பவர் வெளிப்படையாகக் குறிப்பிடப்படாததால் தமிழிலும் இறுதி உட்கருத்து நோக்கவினை அமைப்பில் வைக்கப்பட்டு அந்தத் தெளிவின்மை பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: ரூபனின் முதற்பேற்று நிலைக்கும் யோசேப்பின் மகன்களுக்கு மாற்றப்பட்ட உரிமைக்கும் உள்ள வேறுபாடு
  choice: ரூபன் பிறப்பு வரிசையில் முதற்பேறானவனாகவே கூறப்படுகிறான்; முதற்பேறு உரிமை மட்டும் யோசேப்பின் மகன்களுக்குக் கொடுக்கப்பட்டதாகவும், அது முதற்பேறு உரிமையின்படி வம்சப் பதிவை மாற்றுவதற்காக அல்ல என்றும் மொழிபெயர்க்கப்பட்டுள்ளது.
  alternative: யோசேப்பின் வம்சம் எல்லா வகையிலும் ரூபனை மாற்றி முதற்பேற்றினராகிவிட்டது என்று மொழிபெயர்த்தல்.
  rationale: இறுதி உட்கூறு உரிமை மாற்றத்துக்கு ஒரு வரம்பை வைக்கிறது. ஆகவே உயிரியல் பிறப்பு வரிசை, சட்டப்பூர்வச் சிறப்புரிமை, வம்சப் பதிவு ஆகியவற்றை ஒன்றாகக் கலக்காமல் மூலத்தில் உள்ள இறையியல் இழுவிசை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, பொதுவாசகர்கள் புரிந்துகொள்ளக்கூடிய கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘முதற்பேறானவன்’ மற்றும் ‘முதற்பேறு உரிமை’ என்பவை பிறப்பு நிலைக்கும் அதனுடன் தொடர்புடைய உரிமைக்கும் இடையிலான வேறுபாட்டைத் தெளிவாகக் காட்டுகின்றன. வசனம் அடுத்துவரும் வம்சப் பட்டியலுக்குள் தொடரும் முற்றுப்பெறாத வாக்கியமாக இருப்பதால் இறுதியில் நீண்ட கோடு வைக்கப்பட்டுள்ளது.
