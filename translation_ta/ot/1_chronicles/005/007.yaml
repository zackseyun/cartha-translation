  text: וְ/אֶחָי/ו֙ לְ/מִשְׁפְּחֹתָ֔י/ו בְּ/הִתְיַחֵ֖שׂ לְ/תֹלְדוֹתָ֑/ם הָ/רֹ֥אשׁ יְעִיאֵ֖ל וּ/זְכַרְיָֽהוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/007.yaml
  text: 'And his brothers by their clans[a], in the genealogy of their generations: the chief was Jeiel, and Zechariah.'
translation:
  language: ta
  text: 'அவனுடைய சகோதரர்கள், அவரவர் குலங்களின்படி[a], அவர்களுடைய தலைமுறைகளின்படியான வம்சாவளிப் பதிவில்: தலைவன் எயியேலும் சகரியாவும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள் தங்கள் தலைமுறைகளின்படி வம்சாவளியில் பதிவு செய்யப்பட்டபோது.”
    reason: בְּהִתְיַחֵשׂ לְתֹלְדוֹתָם என்பதை வம்சாவளிப் பதிவைக் குறிக்கும் பெயர்ச்சொல் தொடராகவோ, வம்சாவளியில் பதிவு செய்யப்பட்ட காலத்தைச் சுட்டும் வினையெச்சத் தொடராகவோ புரிந்துகொள்ளலாம்.
lexical_decisions:
- source_word: וְאֶחָיו
  choice: அவனுடைய சகோதரர்கள்
  rationale: אָח என்பதன் நேரடியான பொருள் ‘சகோதரர்’; இங்கு வம்சப்பட்டியல் சூழலில் ஆண் உறவினர்களையும் குறிக்கக்கூடும். மூலத்தின் நேரடித்தன்மையைப் பேண ‘சகோதரர்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: לְמִשְׁפְּחֹתָיו
  choice: அவரவர் குலங்களின்படி
  rationale: מִשְׁפָּחָה என்பது கோத்திர உட்பிரிவான ‘குலம்’ என்பதைக் குறிக்கிறது. எபிரெயில் ஒருமை உடைமைப் பின்னொட்டு இருந்தாலும், சகோதரர்களைத் தொகுப்பாகக் குறிக்கும் பகிர்வுப் பொருளை இயல்பான தமிழில் ‘அவரவர்’ வெளிப்படுத்துகிறது.
- source_word: בְּהִתְיַחֵשׂ לְתֹלְדוֹתָם
  choice: அவர்களுடைய தலைமுறைப் பதிவேட்டில்
  rationale: יחס என்பதன் ஹித்பயேல் வடிவம் வம்சாவளிப்படி பதிவு செய்யப்படுதலைக் குறிக்கிறது; תֹּלְדוֹתָם தலைமுறை அல்லது வம்ச வரிசைகளைச் சுட்டுகிறது. சுருக்கமான பெயர்ச்சொல் தொடரால் மூலத்தின் அமைப்பும் பதிவின் தன்மையும் பேணப்படுகின்றன.
- source_word: הָרֹאשׁ
  choice: தலைவன்
  rationale: רֹאשׁ இங்கு பட்டியலிடப்பட்ட குழுவின் தலைமை அல்லது முதன்மை நபரைக் குறிக்கிறது; நவீன தமிழில் ‘தலைவன்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: יְעִיאֵל
  choice: எயியேல்
  rationale: எபிரெயப் பெயரின் ஒலியமைப்பைத் தமிழில் நெருக்கமாக எழுத்துப்பெயர்த்த வடிவம்.
- source_word: וּזְכַרְיָהוּ
  choice: சகரியா
  rationale: זְכַרְיָהוּ என்ற எபிரெயப் பெயருக்குத் தமிழில் பரவலாக அறியப்படும் வேதாகமப் பெயர் வடிவம் பயன்படுத்தப்பட்டது.
