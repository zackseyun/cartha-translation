  text: Uzzi fathered Zerahiah, and Zerahiah fathered Meraioth.
translation:
  language: ta
  text: உஸ்ஸி செரகியாவுக்குத் தந்தையானான்; மேலும் செரகியா மெராயோத்துக்குத் தந்தையானான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/עֻזִּי
  choice: உஸ்ஸி
  rationale: தனிப்பட்ட பெயர் என்பதால் மொழிபெயர்க்காமல், எபிரெய ஒலிப்புக்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்க்கப்பட்டது. தொடக்க இணைப்புச்சொல் இங்கு தனி வாக்கியத்தின் தொடக்கத்தில் இயல்பான தமிழுக்காக வெளிப்படையாக மொழிபெயர்க்கப்படவில்லை.
- source_word: הוֹלִיד
  choice: பெற்றான்
  rationale: வம்சப்பட்டியல் சூழலில் ஹிஃபில் வடிவிலுள்ள ילד ‘ஒருவருக்குத் தந்தையானான்/ஒருவரைப் பெற்றான்’ என்று பொருள்படும். ‘பெற்றான்’ சுருக்கமானதும் இயல்பானதும் ஆகி, வம்சத் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: אֶת
  choice: '[தனியாக மொழிபெயர்க்கப்படவில்லை]'
  rationale: இது நேரடிச் செயப்படுபொருளைக் குறிக்கும் எபிரெய இலக்கணக் குறியீடு; தமிழில் தனியான சொல் இணை தேவையில்லை.
- source_word: זְרַחְיָה
  choice: செரகியா
  rationale: தனிப்பட்ட பெயர் என்பதால் அதன் எபிரெய உச்சரிப்பை அணுகும் வகையில் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: וּ/זְרַחְיָה
  choice: செரகியா
  rationale: பெயர் மீண்டும் இடம்பெறுவது வம்சத் தொடரைத் தெளிவாக்குகிறது. எபிரெய இணைப்புச்சொல் தமிழில் அரைப்புள்ளியால் இயல்பாகப் பிரதிபலிக்கப்பட்டது.
- source_word: הוֹלִיד
  choice: பெற்றான்
  rationale: முதலாவது நிகழ்வைப் போலவே ஒரே வம்சவழிச் சொல்லாக்கம் பயன்படுத்தப்பட்டு தொடர்ச்சியும் தெளிவும் காக்கப்பட்டன.
- source_word: מְרָיוֹת
  choice: மெராயோத்
  rationale: தனிப்பட்ட பெயர் என்பதால் எபிரெய வடிவுக்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்க்கப்பட்டது.
