  text: כֻּלָּ/ם֙ הִתְיַחְשׂ֔וּ בִּ/ימֵ֖י יוֹתָ֣ם מֶֽלֶךְ יְהוּדָ֑ה וּ/בִ/ימֵ֖י יָרָבְעָ֥ם מֶֽלֶךְ יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/017.yaml
  text: All of them were enrolled by genealogy in the days of Jotham king of Judah[a], and in the days of Jeroboam king of Israel.
translation:
  language: ta
  text: யூதாவின் அரசன் யோதாமின் நாட்களிலும், இஸ்ரவேலின் அரசன் யெரொபெயாமின் நாட்களிலும், அவர்கள் அனைவரும் வம்சாவளிப் பதிவில் சேர்க்கப்பட்டார்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “வம்சாவளிகளின்படி பதிவு செய்யப்பட்டார்கள்” அல்லது “வம்சாவளியின்படி கணக்கிடப்பட்டார்கள்” என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல், வம்சாவளிப் பதிவேட்டில் ஒருவரது பெயர் சேர்க்கப்படுவதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻּלָּם
  choice: அவர்கள் அனைவரும்
  rationale: மூன்றாம் நபர் ஆண்பால் பன்மை பின்னொட்டுடன் வரும் முழுமையைக் குறிக்கும் சொல்லின் வெளிப்படையான சுட்டுப்பொருளை இயல்பான தமிழில் காக்கிறது.
- source_word: הִתְיַחְשׂוּ
  choice: வம்சாவளிப் பதிவில் சேர்க்கப்பட்டார்கள்
  rationale: நாளாகமங்களில் இவ்வினைச்சொல் ஒருவரை வம்சாவளியின் அடிப்படையில் கணக்கிட்டு பதிவேட்டில் சேர்ப்பதைக் குறிக்கிறது; தமிழ் சொற்றொடர் பதிவுசார் பொருளையும் வம்சாவளிச் சூழலையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: בִּימֵי
  choice: நாட்களில்
  rationale: எபிரெய மொழியின் காலக் குறிப்பை நேரடியாகக் காக்கும் அதேவேளையில், தமிழிலும் இயல்பாகவும் புரிந்துகொள்ளத்தக்கதாகவும் உள்ளது.
- source_word: יוֹתָם
  choice: யோதாம்
  rationale: எபிரெய தனிப்பெயரின் ஒலியமைப்பைத் தமிழில் நிலையான வேதாகமப் பயன்பாட்டுக்கு ஏற்றவாறு எழுத்துப்பெயர்க்கிறது.
- source_word: מֶלֶךְ יְהוּדָה
  choice: யூதாவின் அரசன்
  rationale: இணைநிலைப் பெயர்த்தொடரைத் தெளிவாகவும் நேரடியாகவும் மொழிபெயர்க்கிறது.
- source_word: וּבִימֵי
  choice: நாட்களிலும்
  rationale: இணைப்பையும் மீண்டும் வரும் காலக் குறிப்பையும் தமிழ் இணைவேற்றுமை வடிவில் காத்து, இரு அரசர்களின் காலங்களையும் இணையாகக் காட்டுகிறது.
- source_word: יָרָבְעָם
  choice: யெரொபெயாம்
  rationale: எபிரெய தனிப்பெயரைத் தமிழில் பரவலாக அறியப்படும் வடிவில் எழுத்துப்பெயர்க்கிறது.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: இஸ்ரவேலின் அரசன்
  rationale: இணைநிலைப் பெயர்த்தொடரைத் தெளிவாகவும் நேரடியாகவும் மொழிபெயர்க்கிறது.
