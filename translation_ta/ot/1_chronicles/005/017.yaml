translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பாகவும் மதிப்புமிக்க நடையிலும் வடிவமைக்கப்பட்டது. எபிரெய வாக்கியத்தின் இணையான கால அமைப்பு காக்கப்பட்டுள்ளது. ‘ராஜா’ என்பதற்குப் பதில் பொதுவான, செம்மையான ‘அரசன்’ பயன்படுத்தப்பட்டுள்ளது; வம்சாவளிப் பதிவு என்ற நிர்வாகப் பொருள் தெளிவாக்கப்பட்டுள்ளது.
