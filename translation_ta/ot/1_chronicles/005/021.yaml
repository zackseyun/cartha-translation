  text: וַ/יִּשְׁבּ֣וּ מִקְנֵי/הֶ֗ם גְּֽמַלֵּי/הֶ֞ם חֲמִשִּׁ֥ים אֶ֨לֶף֙ וְ/צֹ֗אן מָאתַ֤יִם וַ/חֲמִשִּׁים֙ אֶ֔לֶף וַ/חֲמוֹרִ֖ים אַלְפָּ֑יִם וְ/נֶ֥פֶשׁ אָדָ֖ם מֵ֥אָה אָֽלֶף׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/021.yaml
  text: 'They captured their livestock: 50,000 camels[a], 250,000 sheep, 2,000 donkeys, and 100,000 people.'
translation:
  language: ta
  text: 'அவர்களுடைய கால்நடைகளை அவர்கள் கைப்பற்றினார்கள்: 50,000 ஒட்டகங்கள், 250,000 ஆடுகள், 2,000 கழுதைகள், மேலும் 100,000 மனிதர்கள்[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “ஒரு மனித உயிர்,” அதாவது ஒரு நபர்; இங்கு கைப்பற்றப்பட்ட 100,000 பேரைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁבּוּ
  choice: கைப்பற்றினார்கள்
  rationale: שׁבה என்பது போரில் பொருட்களையும் மனிதர்களையும் பிடித்துக்கொள்வதைக் குறிக்கிறது. பட்டியலில் கால்நடைகளும் மனிதர்களும் இருப்பதால், இரண்டுக்கும் இயல்பாகப் பொருந்தும் ‘கைப்பற்றினார்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: מִקְנֵיהֶם
  choice: இவர்களுடைய கால்நடைகள்
  rationale: מִקְנֶה என்பது உடைமை அல்லது கால்நடைகளைக் குறிக்கலாம்; தொடர்ந்து விலங்குகளின் பட்டியல் வருவதால் ‘கால்நடைகள்’ என்பது இங்கு பொருத்தமானது. முந்தைய சூழலில் குறிப்பிடப்பட்ட எதிரிகளைக் தெளிவாகச் சுட்ட ‘இவர்களுடைய’ பயன்படுத்தப்பட்டது.
- source_word: גְּמַלֵּיהֶם
  choice: ஒட்டகங்கள்
  rationale: பன்மையில் வரும் ‘ஒட்டகங்கள்’ என்ற நேரடியான பொருள்; உடைமையைக் குறிக்கும் பின்னொட்டு தொடக்கத்திலுள்ள ‘இவர்களுடைய கால்நடைகள்’ என்பதில் இயல்பாக வெளிப்படுகிறது.
- source_word: וְצֹאן
  choice: ஆடுகள்
  rationale: צֹאן என்பது செம்மறியாடுகள், வெள்ளாடுகள் உள்ளிட்ட சிறிய கால்நடைகளைத் தொகுப்பாகக் குறிக்கக்கூடும். ‘ஆடுகள்’ என்பது தமிழில் இயல்பாகவும், தேவையற்ற வகைத் துல்லியத்தைச் சேர்க்காமலும் உள்ளது.
- source_word: וַחֲמוֹרִים
  choice: கழுதைகள்
  rationale: நவீனத் தமிழில் தெளிவான, நேரடியான பெயர்.
- source_word: וְנֶפֶשׁ אָדָם
  choice: மனிதர்கள்
  rationale: சொல்லுக்குச் சொல் ‘மனித உயிர்/நபர்’ எனப் பொருள்படும் இந்த எபிரெய மரபுத்தொடர் எண்ணப்பட்ட மனிதர்களைக் குறிக்கிறது. ‘மனிதர்கள்’ என்பது இயல்பான தமிழாகவும், கால்நடைகளிலிருந்து அவர்களைத் தெளிவாக வேறுபடுத்துவதாகவும் உள்ளது.
- source_word: מֵאָה אָלֶף
  choice: 100,000
  rationale: வசனத்திலுள்ள மற்ற எண்ணிக்கைகளுடன் ஒருமைப்பாட்டையும் வாசிப்புத் தெளிவையும் காக்க எண்களால் தரப்பட்டது.
theological_decisions:
- issue: 100,000 மனிதர்களின் நிலை
  choice: ‘மனிதர்கள்’ என்று முதன்மை உரையில் மொழிபெயர்த்து, அவர்கள் பிடிக்கப்பட்டவர்கள் என்பதை வினைச்சொல்லும் அடிக்குறிப்பும் தெரிவிக்கின்றன.
  alternative: ‘100,000 கைதிகள்’
  rationale: மூலத்தில் נֶפֶשׁ אָדָם என்பது ‘மனிதர்கள்/நபர்கள்’ என்பதே; ‘கைதிகள்’ என்பது שׁבה என்ற வினையிலிருந்து புரியும் நிலை. முதன்மை உரையில் மூலத்தின் பெயர்ச்சொல் வடிவத்தைப் பாதுகாத்து, மறைமுகத் தகவலை பெயர்ச்சொல்லுக்குள் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் ஆனால் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. மூலத்தின் பட்டியல் அமைப்பும் எண்ணிக்கைகளும் காக்கப்பட்டுள்ளன; ‘ஆடுகள்’ என்பது צֹאן என்பதிலுள்ள சிறிய கால்நடை வகைகளின் பரப்பை தேவையின்றிச் சுருக்காமல் தருகிறது.
