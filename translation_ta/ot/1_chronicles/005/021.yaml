revisions:
- from: 'அவர்கள் இவர்களுடைய கால்நடைகளைக் கைப்பற்றினார்கள்: 50,000 ஒட்டகங்கள், 250,000 ஆடுகள், 2,000 கழுதைகள், மேலும் 100,000 மனிதர்கள்[a].'
  to: 'அவர்களுடைய கால்நடைகளை அவர்கள் கைப்பற்றினார்கள்: 50,000 ஒட்டகங்கள், 250,000 ஆடுகள், 2,000 கழுதைகள், மேலும் 100,000 மனிதர்கள்[a].'
  rationale: The revision removes the unsupported proximal ‘இவர்களுடைய’ and uses a natural Tamil word order while retaining the source’s two distinct plural referents (‘their livestock’ / ‘they captured’). It preserves all quantities, the broad collective sense of צֹאן as ‘ஆடுகள்,’ and the source-based wording ‘மனிதர்கள்’; the footnote explains the literal Hebrew idiom more fluently.
