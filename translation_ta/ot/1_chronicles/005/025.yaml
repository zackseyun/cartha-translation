  source_fidelity: 'கருத்து பெரும்பாலும் மூல எபிரெயத்துக்கு உண்மையாக உள்ளது: மாஅல் என்பதன் உடன்படிக்கை-நம்பிக்கைத்துரோகமும், זנה + אַחֲרֵי என்பதன் பாலியல் உருவகத்துடனான பிற தெய்வப் பின்தொடர்தலும், அழிக்கப்பட்டது நாட்டுமக்கள் என்பதுமாகச் சரியாகப் புரிந்துகொள்ளப்பட்டுள்ளன. இருப்பினும் சார்புத்தொடரைத் தெய்வங்களுக்கு முன்பாக வைத்துள்ள தற்போதைய சொல் வரிசை தேவையற்ற தற்காலிகத் தெளிவின்மையை உருவாக்குகிறது.'
