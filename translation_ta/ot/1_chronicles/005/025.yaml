  text: וַ/יִּֽמְעֲל֔וּ בֵּ/אלֹהֵ֖י אֲבוֹתֵי/הֶ֑ם וַ/יִּזְנ֗וּ אַחֲרֵי֙ אֱלֹהֵ֣י עַמֵּי הָ/אָ֔רֶץ אֲשֶׁר הִשְׁמִ֥יד אֱלֹהִ֖ים מִ/פְּנֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/025.yaml
  text: But they acted unfaithfully against the God of their fathers and prostituted themselves after the gods of the peoples of the land[b][a], whom God had destroyed before them.
translation:
  language: ta
  text: ஆனால் அவர்கள் தங்கள் மூதாதையரின் கடவுளுக்கு எதிராக நம்பிக்கைத்துரோகம் செய்து, கடவுள் தங்களுக்கு முன்பாக அழித்த அந்த நாட்டின் மக்களுடைய தெய்வங்களைப் பின்தொடர்ந்து வேசித்தனம் செய்தார்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “வேசித்தனம் செய்தார்கள்” என்பது தெய்வங்களை வழிபடுவதன் மூலம் கடவுளுடனான உடன்படிக்கைக்கு உண்மையற்றிருப்பதைக் குறிக்கும் பாலியல் உருவகம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְעֲלוּ
  choice: நம்பிக்கைத் துரோகம் செய்து
  rationale: מעל என்பது இங்கு கடவுளுடனான உடன்படிக்கை உறவில் நம்பிக்கையை மீறிச் செயல்படுவதைக் குறிக்கிறது; பொதுவான ‘பாவம் செய்தார்கள்’ என்பதைவிட இந்த மொழிபெயர்ப்பு உறவுசார் துரோகத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: בֵּאלֹהֵי אֲבוֹתֵיהֶם
  choice: தங்கள் மூதாதையரின் கடவுளுக்கு
  rationale: מעל உடன் வரும் ב, யாருக்கு எதிராக நம்பிக்கைத் துரோகம் செய்யப்பட்டது என்பதைக் குறிக்கிறது. இயல்பான தமிழில் ‘கடவுளுக்கு நம்பிக்கைத் துரோகம்’ என்று வழங்கப்பட்டுள்ளது.
- source_word: וַיִּזְנוּ אַחֲרֵי
  choice: பின்பற்றி வேசித்தனம் செய்தார்கள்
  rationale: זנה என்பதன் பாலியல் உருவகத்தையும், אַחֲרֵי என்பதிலுள்ள பிற தெய்வங்களை நாடிப் பின்செல்லும் கருத்தையும் இந்தச் சொற்றொடர் தக்கவைக்கிறது.
- source_word: אֱלֹהֵי עַמֵּי הָאָרֶץ
  choice: அந்த நாட்டின் மக்களுடைய தெய்வங்களை
  rationale: பன்மை அமைப்பை நேரடியாகப் பிரதிபலிப்பதோடு, நவீன தமிழில் இயல்பாகவும் உள்ளது.
- source_word: אֲשֶׁר הִשְׁמִיד אֱלֹהִים מִפְּנֵיהֶם
  choice: தங்களுக்கு முன்பாகக் கடவுள் அழித்துப்போட்ட அந்த நாட்டின் மக்களுடைய
  rationale: சார்புத்தொடர் ‘மக்களை’ குறிப்பதாகச் சூழல் காட்டுகிறது. הִשְׁמִיד ஒருமை வினையாக இருப்பதால் אֱלֹהִים இங்கு ஒரே கடவுளைக் குறிக்கிறது; முன்னரே நிகழ்ந்த அழிப்பை ‘அழித்துப்போட்ட’ தெரிவிக்கிறது.
theological_decisions:
- issue: சிலை வழிபாட்டைக் குறிக்கும் பாலியல் உருவகத்தைத் தக்கவைத்தல்
  choice: வேசித்தனம் செய்தார்கள்
  alternative: உண்மையற்றவர்களாய் நடந்தார்கள் / அந்தத் தெய்வங்களைப் பின்பற்றினார்கள்
  rationale: எபிரெய உரை வேண்டுமென்றே கடவுளுடனான உறவுத் துரோகத்தைப் பாலியல் ஒழுக்கக்கேட்டின் உருவகத்தால் கூறுகிறது. அதை பொதுவான கீழ்ப்படியாமையாக மென்மைப்படுத்தாமல் தக்கவைக்கப்பட்டுள்ளது.
- issue: சார்புத்தொடரின் முன்னிலைச் சொல்
  choice: கடவுள் அழித்துப்போட்ட மக்கள்
  alternative: கடவுள் அழித்துப்போட்ட தெய்வங்கள்
  rationale: இலக்கண அமைப்பில் அருகிலுள்ள இரண்டு பன்மை பெயர்ச்சொற்களும் சாத்தியமாகத் தோன்றினாலும், ‘அவர்களுக்கு முன்பாக அழித்தல்’ என்ற வழக்கமான வேதாகமச் சொற்றொடரும் வரலாற்றுச் சூழலும் அழிக்கப்பட்டவர்கள் அந்த நாட்டின் மக்கள் என்பதைக் காட்டுகின்றன.
- issue: உறவினர் மரபைக் குறிக்கும் אֲבוֹתֵיהֶם
  choice: தங்கள் மூதாதையரின்
  alternative: தங்கள் தந்தையரின்
  rationale: இங்கு ‘தந்தையர்’ என்பது உடனடியான தந்தையரை மட்டும் அல்லாமல் முன்னோர்களைக் குறிக்கிறது; ‘மூதாதையர்’ அந்தக் கூட்டுப்பொருளைத் தெளிவாக வழங்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. பாலியல் உருவகம் அதிர்வை இழக்காமல் நேரடியாக வைக்கப்பட்டு, அதன் உருவகப் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
