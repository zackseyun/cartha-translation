base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/009.yaml
  text: To the east he settled as far as the entrance to the wilderness from the river Euphrates[a], because their livestock had multiplied in the land of Gilead.
translation:
  language: ta
  text: கிழக்கே அவன் ஐப்பிராத்து ஆற்றிலிருந்து பாலைநிலத்தின் நுழைவிடம் வரை குடியேறினான்[a]. ஏனெனில் கீலேயாத் நாட்டில் அவர்களுடைய கால்நடைகள் பெருகியிருந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஐப்பிராத்து ஆற்றிலிருந்து உள்ள பாலைநிலத்தின் நுழைவிடம் வரை.” எல்லையை விவரிக்கும் எபிரெய வாசகம் சுருக்கமாக இருப்பதால், அதை ஒன்றுக்கு மேற்பட்ட விதங்களில் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וְלַמִּזְרָח
  choice: கிழக்கே
  rationale: இணைப்புச் சொல்லுடன் வரும் திசைக் குறிப்பு இங்கு கிழக்கு நோக்கிய நிலப்பரப்பைக் குறிக்கிறது; நவீன தமிழில் தேவையற்ற தொடக்க ‘மேலும்’ தவிர்க்கப்பட்டது.
- source_word: יָשַׁב
  choice: அவன் … குடியேறினான்
  rationale: ஒருமை வினை, குலத்தை அதன் மூதாதை அல்லது பிரதிநிதி வழியாகக் கூட்டாகக் குறிப்பிடுகிறது. நிலப்பரப்பை ஆக்கிரமித்து வாழ்ந்த சூழலில் ‘குடியேறினான்’ இயல்பானது.
- source_word: עַד לְבוֹא מִדְבָּרָה
  choice: பாலைநிலத்தின் நுழைவிடம் வரை
  rationale: עַד + לְבוֹא அமைப்பு எல்லையின் நீட்சியை, ‘நுழைவிடம்/அணுகுமிடம் வரை’ எனக் குறிக்கிறது; அதன் உருவகமற்ற இடவியல் பொருள் காக்கப்பட்டது.
- source_word: לְמִן הַנָּהָר פְּרָת
  choice: ஐப்பிராத்து ஆற்றிலிருந்து
  rationale: எபிரெய தொடரமைப்பு சுருக்கமாகவும் பலவாறு புரிந்துகொள்ளத்தக்கதாகவும் உள்ளது. மூலத்தின் ‘ஆற்றிலிருந்து’ என்ற வடிவம் நேரடியாகக் காக்கப்பட்டு, மாற்றுப் புரிதல் அடிக்குறிப்பில் தரப்பட்டது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: கிழக்கு நோக்கிய குடியேற்றத்திற்கான காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: מִקְנֵיהֶם
  choice: அவர்களுடைய கால்நடைகள்
  rationale: இந்தச் சொல் மாடுகளை மட்டும் அல்லாமல் வளர்ப்பு விலங்குகளைப் பொதுவாகக் குறிக்கிறது.
- source_word: רָבוּ
  choice: பெருகியிருந்தன
  rationale: எண்ணிக்கையில் அதிகரித்ததைக் குறிக்கிறது; அந்தப் பெருக்கம் குடியேற்ற விரிவாக்கத்திற்கான முந்தைய காரணம் என்பதையும் தமிழ் வினைவடிவம் உணர்த்துகிறது.
- source_word: בְּאֶרֶץ גִּלְעָד
  choice: கீலேயாத் நாட்டில்
  rationale: אֶרֶץ இங்கு கீலேயாத் எனும் நிலப்பகுதி அல்லது நாட்டைக் குறிக்கிறது.
