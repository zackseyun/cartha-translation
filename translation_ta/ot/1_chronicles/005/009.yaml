  register: நவீன செந்தமிழ் நடையில், பொதுவாசகர்களுக்கு எளிதாகவும் வேதாகம உரைக்குரிய கண்ணியத்துடனும் மொழிபெயர்க்கப்பட்டது. ‘அவன்’ என்ற மூலத்தின் ஒருமையும் ‘அவர்களுடைய’ என்ற பன்மையும் திட்டமிட்டு காக்கப்பட்டுள்ளன; இது குலத்தை அதன் பிரதிநிதி வழியாகக் குறிப்பிடும் மூல உரையின் இலக்கண அழுத்தத்தை வெளிப்படுத்துகிறது.
