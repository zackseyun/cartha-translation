base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/040.yaml
  text: Azariah fathered Seraiah, and Seraiah fathered Jehozadak.
translation:
  language: ta
  text: அசரியா செராயாவுக்குத் தந்தையானார்; செராயா யெகோசாதாக்குக்குத் தந்தையானார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַ/עֲזַרְיָה
  choice: அசரியா
  rationale: தனிப்பட்ட பெயர்; எபிரெய ஒலிப்பை அடிப்படையாகக் கொண்டும் தமிழில் நிலவும் வேதாகமப் பெயர் வடிவத்துக்கு ஏற்றவாறும் ஒலிபெயர்க்கப்பட்டது. முன்சேர்க்கை வַ தொடர்ச்சியை உணர்த்துகிறது; தமிழில் அரைப்புள்ளி மூலம் இணைப்பு இயல்பாக வெளிப்படுகிறது.
- source_word: הוֹלִיד
  choice: தந்தையானார்
  rationale: யָלַד என்பதன் ஹிஃபில் வடிவம் வம்சப்பட்டியலில் ஒருவரைப் பெற்றெடுத்த ஆண் மூதாதை உறவைக் குறிக்கிறது. ‘பெற்றார்’ என்பது தமிழில் தாயையும் குறிக்கக்கூடும்; ‘தந்தையானார்’ தெளிவானதும் இயல்பானதும் ஆகும்.
- source_word: אֶת
  choice: '[தனியாக மொழிபெயர்க்கப்படவில்லை]'
  rationale: இது நேரடி செயப்படுபொருளைக் குறிக்கும் இலக்கண உருபு; தமிழில் தனிச் சொல்லாக இணையான வடிவம் தேவையில்லை. ‘-க்கு’ வேற்றுமை உருபுடன் அமைந்த தமிழ் வாக்கிய வடிவில் உறவு வெளிப்படுகிறது.
- source_word: שְׂרָיָה
  choice: செராயா
  rationale: தனிப்பட்ட பெயர்; எபிரெய வடிவத்தை நெருக்கமாகப் பின்பற்றும் தமிழ் ஒலிபெயர்ப்பு.
- source_word: וּ/שְׂרָיָה
  choice: செராயா
  rationale: וּ இணைப்புச்சொல் இரண்டாம் வம்சக்கூற்றை முந்தையதுடன் இணைக்கிறது; தமிழில் அரைப்புள்ளியும் தொடர்ச்சியான வாக்கிய அமைப்பும் அதன் பணியை இயல்பாகச் செய்கின்றன.
- source_word: הוֹלִיד
  choice: தந்தையானார்
  rationale: முதல் பயன்பாட்டைப் போலவே வம்ச உறவைக் குறிக்க ஒரே விதமாக மொழிபெயர்க்கப்பட்டது.
- source_word: יְהוֹצָדָק
  choice: யெகோசாதாக்
  rationale: தனிப்பட்ட பெயர்; எபிரெய יְהוֹצָדָק வடிவத்தின் ஒலியைத் தமிழில் நெருக்கமாகப் பிரதிபலிக்கும் ஒலிபெயர்ப்பு.
