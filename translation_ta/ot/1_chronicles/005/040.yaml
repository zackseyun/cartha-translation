translation_notes:
  register: நவீன நிலையான தமிழில் சுருக்கமான, கண்ணியமான வம்சப்பட்டியல் நடை பயன்படுத்தப்பட்டுள்ளது. ‘பெற்றான்’ என்ற சாத்தியமான இருபொருளைத் தவிர்த்து, ஆண் வம்ச உறவைத் தெளிவாக்க ‘தந்தையானார்’ தேர்ந்தெடுக்கப்பட்டது. மூலத்தில் உள்ள இரண்டு இணையான கூறுகளும் சமநிலையுடன் பாதுகாக்கப்பட்டுள்ளன.
