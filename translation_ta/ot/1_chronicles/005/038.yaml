  source_fidelity: எபிரெய வம்சவரிசை வாக்கியத்தின் இரு ஹிஃபில் வினைச்சொற்களும் தந்தை–மகன் உறவைக் குறிக்கின்றன. “அகித்தூப் சாதோக்கைப் பெற்றான்; சாதோக்கு சல்லூமைப் பெற்றான்” என்பது அந்த இரு உறவுகளையும் வரிசையையும் துல்லியமாகக் காக்கிறது. தொடக்க வாவ் மற்றும் இரண்டாம் கூற்றின் வாவ் தமிழில் தனிச் சொல்லாக இல்லாமல் வாக்கியத் தொடர்ச்சியிலும் அரைப்புள்ளியிலும் இயல்பாக வெளிப்படுகின்றன; பொருள் இழப்பு இல்லை.
  naturalness: சுருக்கமான வம்சப்பட்டியல் நடையில் உரை இயல்பாகவும் தெளிவாகவும் உள்ளது. ஆண் எழுவாயுடன் “பெற்றான்” என்பது இச்சூழலில் நிலைபெற்ற வம்சவரிசைப் பயன்பாடாகும்; தவறாகத் தாய்மை பொருளை உருவாக்காது.
  terminology: பெயர்கள் அகித்தூப், சாதோக்கு, சல்லூம் எனத் தொடர்ந்து ஒலிப்பெயர்க்கப்பட்டுள்ளன. “சாதோக்கைப்,” “சல்லூமைப்” ஆகிய செயப்படுபொருள் வடிவங்களும் சரியானவை. சிறப்புச் சமயக் கலைச்சொல் அல்லது அடிக்குறிப்பு தேவைப்படும் உரைச் சிக்கல் இல்லை.
