translation:
  language: ta
  text: அகித்தூப் சாதோக்கைப் பெற்றான்; சாதோக்கு சல்லூமைப் பெற்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַ/אֲחִיטוּב
  choice: அகித்தூப்
  rationale: தனிநபரின் பெயர் என்பதால், எபிரெய ஒலிப்பைத் தமிழில் இயல்பாக எழுத்துப்பெயர்த்துள்ளது. தொடக்க இணைப்புச்சொல் வாவ், தொடரும் வம்சப்பட்டியலின் அமைப்பில் தமிழில் தனியே மொழிபெயர்க்கப்படவில்லை.
- source_word: הוֹלִיד
  choice: பெற்றான்
  rationale: யலத் என்பதன் ஹிஃபில் வடிவம் வம்சப்பட்டியல் சூழலில் ‘தந்தையானான்/பெற்றான்’ எனப் பொருள்படும். ‘பெற்றான்’ என்பது சுருக்கமான, இயல்பான தமிழ் வம்சவழக்குச் சொல்; ஆண் எழுவாயையும் சூழல் தெளிவாக்குகிறது.
- source_word: אֶת
  choice: '[தனியே மொழிபெயர்க்கப்படவில்லை]'
  rationale: இது நேரடிச் செயப்படுபொருளைக் குறிக்கும் இலக்கணக் குறியீடு; தமிழில் ஐ வேற்றுமை உருபால் அதன் பணி வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: צָדוֹק
  choice: சாதோக்கு
  rationale: எபிரெய தனிநபர் பெயரைத் தமிழில் ஒலிப்பெயர்த்துள்ளது; செயப்படுபொருள் இடத்தில் ‘சாதோக்கைப்’ என்றும் எழுவாய் இடத்தில் ‘சாதோக்கு’ என்றும் வேற்றுமைக்கேற்ப அமைந்துள்ளது.
- source_word: וְ/צָדוֹק
  choice: சாதோக்கு
  rationale: வாவ் இணைப்பு இரண்டு தலைமுறைச் செய்திகளையும் இணைக்கிறது. தமிழில் அரைப்புள்ளியும் அடுத்த கூற்றின் தொடர்ச்சியும் அந்த இணைப்பை இயல்பாக வெளிப்படுத்துவதால் ‘மற்றும்’ தனியே சேர்க்கப்படவில்லை.
- source_word: שַׁלּוּם
  choice: சல்லூம்
  rationale: எபிரெய தனிநபர் பெயர் தமிழில் ஒலிப்பெயர்க்கப்பட்டுள்ளது; செயப்படுபொருள் உருபுடன் உரையில் ‘சல்லூமைப்’ என வருகிறது.
