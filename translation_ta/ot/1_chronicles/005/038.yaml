  register: நவீனத் தரத் தமிழ்; வம்சப்பட்டியலுக்கேற்ற சுருக்கமும் கண்ணியமும் பேணப்பட்டுள்ளன. பெயர்கள் மூல எபிரெய வடிவங்களுக்கு அண்மையாக ஒலிப்பெயர்க்கப்பட்டுள்ளன; இருமுறை வரும் வினை ஒரே விதமாக மொழிபெயர்க்கப்பட்டுள்ளது.
