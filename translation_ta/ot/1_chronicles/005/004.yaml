  register: நவீனத் தரத்தமிழில், சுருக்கமான வம்சவரிசை நடையும் எபிரெய மூலத்தின் மீளுரைப்பும் பாதுகாக்கப்பட்டுள்ளன. தனிப்பெயர்கள் மூல எபிரெய வடிவங்களை அடிப்படையாகக் கொண்டு ஒலிப்பெயர்க்கப்பட்டுள்ளன.
