- from: 'யோவேலின் மகன்கள்: அவனுடைய மகன் செமாயா[a], அவனுடைய மகன் கோகு, அவனுடைய மகன் சிமெயி.'
  to: 'யோவேலின் மகன்கள்: செமாயா; செமாயாவின் மகன் கோகு; கோகுவின் மகன் சிமெயி.[a]'
  rationale: The revision makes each father–son relationship explicit in natural modern Tamil while retaining the Hebrew genealogy’s order, direct filial sense, and compact register. The footnote remains anchored to “மகன்கள்,” where the lexical alternative occurs.
