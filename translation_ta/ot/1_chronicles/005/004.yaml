base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/004.yaml
  text: 'The sons of Joel: Shemaiah his son[a], Gog his son, Shimei his son.'
translation:
  language: ta
  text: 'யோவேலின் மகன்கள்: செமாயா; செமாயாவின் மகன் கோகு; கோகுவின் மகன் சிமெயி.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யோவேலின் வழித்தோன்றல்கள்.” எபிரெய வம்சவரிசைச் சொற்றொடர் சில நேரங்களில் விரிவான வழிமரபைக் குறிக்கலாம். ஆனால், இங்கு மீண்டும் மீண்டும் வரும் “அவனுடைய மகன்” என்பது நேரடியான வம்சத் தொடரை ஆதரிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: בֵּן என்பதன் construct பன்மை வடிவம் ஒரு வம்சவரிசையை அறிமுகப்படுத்துகிறது. இங்கு தொடர்ந்து வரும் ‘அவனுடைய மகன்’ என்ற நேரடி உறவுமுறை ‘மகன்கள்’ என்ற இயல்பான, நேரடியான மொழிபெயர்ப்பை ஆதரிக்கிறது.
- source_word: יוֹאֵל
  choice: யோவேல்
  rationale: எபிரெய தனிப்பெயரின் ஒலிப்பெயர்ப்பு; தமிழ் வேதாகமப் பெயர் மரபுக்கும் மூல உச்சரிப்புக்கும் ஏற்ற வடிவம்.
- source_word: שְׁמַעְיָה
  choice: செமாயா
  rationale: எபிரெய தனிப்பெயரைத் தமிழில் இயல்பாக ஒலிப்பெயர்த்த வடிவம்.
- source_word: בְנוֹ
  choice: அவனுடைய மகன்
  rationale: ஆண்பால் ஒருமை உடைமைப் பின்னொட்டுடன் வரும் בֵּן நேரடி தந்தை–மகன் உறவைக் குறிக்கிறது; வம்சவரிசையின் மீளுரைப்பையும் தமிழில் தெளிவாகப் பாதுகாக்கிறது.
- source_word: גּוֹג
  choice: கோகு
  rationale: இங்கு வம்சவரிசைத் தனிப்பெயராக மட்டுமே வரும் எபிரெயப் பெயரின் ஒலிப்பெயர்ப்பு.
- source_word: שִׁמְעִי
  choice: சிமெயி
  rationale: எபிரெய தனிப்பெயரின் ஒலியமைப்பைப் பாதுகாக்கும் தமிழ் ஒலிப்பெயர்ப்பு.
