  text: וַ/יָּעַר֩ אֱלֹהֵ֨י יִשְׂרָאֵ֜ל אֶת ר֣וּחַ פּ֣וּל מֶֽלֶךְ אַשּׁ֗וּר וְ/אֶת ר֨וּחַ֙ תִּלְּגַ֤ת פִּלְנֶ֨סֶר֙ מֶ֣לֶךְ אַשּׁ֔וּר וַ/יַּגְלֵ/ם֙ לָ/ראוּבֵנִ֣י וְ/לַ/גָּדִ֔י וְ/לַ/חֲצִ֖י שֵׁ֣בֶט מְנַשֶּׁ֑ה וַ֠/יְבִיאֵ/ם לַ/חְלַ֨ח וְ/חָב֤וֹר וְ/הָרָא֙ וּ/נְהַ֣ר גּוֹזָ֔ן עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/026.yaml
  text: So the God of Israel stirred up the spirit of Pul king of Assyria[a], even the spirit of Tilgath-pilneser king of Assyria, and he took the Reubenites, the Gadites, and the half-tribe of Manasseh into exile, and brought them to Halah, Habor, Hara, and the river Gozan[b], to this day.
translation:
  language: ta
  text: இஸ்ரவேலின் கடவுள் அசீரிய அரசன் பூலின் மனதையும், அசீரிய அரசன் தில்காத்-பில்னேசரின்[a] மனதையும் தூண்டினார்.[b] அந்த அரசன் ரூபனியரையும் காதியரையும் மனாசே கோத்திரத்தின் பாதியினரையும் நாடுகடத்தி, அவர்களை ஹலாக், ஹாபோர், ஹாரா, கோசான் ஆறு ஆகிய இடங்களுக்குக் கொண்டுபோனான். இந்நாள்வரை அவர்கள் அங்கே இருக்கிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில் இப்பெயர் ‘தில்காத்-பில்னேசர்’ என்ற வடிவில் உள்ளது; இது பொதுவாக ‘திக்லாத்-பிலேசர்’ என்றும் வழங்கப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: பூல், தில்காத்-பில்னேசர் ஆகியவை இரு தனித்தனி அரசர்களின் பெயர்கள் என்று இவ்வாக்கியத்தை வாசிக்கலாம். வரலாற்றுச் சூழலில் இவை ஒரே அசீரிய அரசனின் இரு பெயர்கள் என்றும் பலர் கருதுகின்றனர்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּעַר
  choice: மனதைத் தூண்டினார்
  rationale: ஒருவரைச் செயல்படும்படி எழுப்புதல் அல்லது தூண்டுதல் என்பதே இங்குள்ள வினையின் பொருள். ‘தூண்டினார்’ என்பது தெய்வீக காரணத்தைத் தெளிவாகக் காட்டுகிறது; எதிர்மறையான நோக்கத்தைத் தேவையின்றி சுமத்துவதில்லை.
- source_word: רוּחַ ... רוּחַ
  choice: மனதையும் ... மனதையும்
  rationale: இச்சூழலில் רוּחַ அரசனின் உள்நோக்கம் அல்லது செயலுக்கான உள்ளார்ந்த உந்துதலைக் குறிக்கிறது. தமிழில் ‘மனம்’ இயல்பாகவும் தெளிவாகவும் உள்ளது; எபிரெயச் சொல்லின் இருமுறை வருதலை மொழிபெயர்ப்பிலும் வைத்திருக்கிறது.
- source_word: פּוּל
  choice: பூல்
  rationale: எபிரெயப் பெயரின் ஒலியமைப்புக்கு நெருக்கமான தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: תִּלְּגַת פִּלְנֶסֶר
  choice: தில்காத்-பில்னேசர்
  rationale: நாளாகம நூலின் எபிரெய வடிவத்தை நெருக்கமாகப் பிரதிபலிக்கும் எழுத்துப்பெயர்ப்பு; பரவலாக அறியப்படும் மாற்று வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וַיַּגְלֵם
  choice: நாடுகடத்தி
  rationale: Hiphil வடிவம் மக்களைத் தங்கள் நாட்டிலிருந்து அகற்றி வேறிடத்துக்குக் கொண்டுசெல்வதைக் குறிக்கிறது. ‘நாடுகடத்தி’ என்பது தற்போதைய தமிழில் இயல்பானதும் துல்லியமானதும் ஆகும்.
- source_word: לָראוּבֵנִי וְלַגָּדִי
  choice: ரூபனியரையும் காதியரையும்
  rationale: இவை ரூபன், காத் கோத்திரங்களைச் சேர்ந்த மக்களைக் குறிக்கும் இனப்பெயர் வடிவங்கள்.
- source_word: וְלַחֲצִי שֵׁבֶט מְנַשֶּׁה
  choice: மனாசே கோத்திரத்தின் பாதிப் பகுதியினரையும்
  rationale: யோர்தானுக்கு அப்பால் குடியேறிய மனாசே கோத்திரத்தின் பாதியை இயல்பான தமிழில் தெளிவாகக் குறிக்கிறது.
- source_word: וַיְבִיאֵם
  choice: அவர்களைக் ... கொண்டுபோனான்
  rationale: நாடுகடத்தப்பட்டவர்கள் குறிப்பிட்ட இடங்களுக்கு அழைத்துச் செல்லப்பட்ட தொடர்ச்சியான செயலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לַחְלַח וְחָבוֹר וְהָרָא וּנְהַר גּוֹזָן
  choice: ஹாலாக், ஹாபோர், ஹாரா ஆகிய இடங்களுக்கும் கோசான் ஆற்றுக்கும்
  rationale: இடப்பெயர்கள் எழுத்துப்பெயர்க்கப்பட்டுள்ளன; נְהַר גּוֹזָן என்பது ‘கோசான் ஆறு’ என்று நேரடியாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: இந்நாள்வரை அவர்கள் அங்கே இருக்கிறார்கள்
  rationale: எபிரெய மொழிமரபில் மறைந்துள்ள ‘அவர்கள் அங்கே இருக்கிறார்கள்’ என்ற கருத்தை இயல்பான தமிழில் வெளிப்படையாகக் கூறி, காலத் தொடர்ச்சியைப் பாதுகாக்கிறது.
theological_decisions:
- issue: பூலுக்கும் தில்காத்-பில்னேசருக்கும் உள்ள தொடர்பு
  choice: மூலத்தில் இருப்பதுபோல் இரு பெயர்களோடும் ‘மனம்’ என்பதைத் திரும்பக் கூறி, இணைநிலை அமைப்பாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘பூல், அதாவது தில்காத்-பில்னேசர்’ என்று ஒரே அரசனின் இரு பெயர்களாக வெளிப்படையாக மொழிபெயர்த்தல்.
  rationale: எபிரெய வாக்கியம் இரு பெயர்களுக்கும் முன் רוּחַ என்பதைத் திரும்பக் கூறுகிறது. வரலாற்றில் இவை ஒரே அசீரிய அரசனின் பெயர்களாக அடையாளப்படுத்தப்படலாம்; ஆனால் வாக்கிய அமைப்பு இரு அரசர்களைக் குறிப்பதாகவும் வாசிக்க இடமளிக்கிறது. முதன்மை உரை அந்தத் தெளிவின்மையைத் தீர்க்காமல் வைத்திருக்கிறது; மாற்று புரிதல் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: וַיַּגְלֵם மற்றும் וַיְבִיאֵם ஆகியவற்றின் எழுவாய்
  choice: ‘அந்த அரசன்’ என்று அருகிலுள்ள அசீரிய அரசனைக் குறிப்பதாக மொழிபெயர்க்கப்பட்டது.
  alternative: இஸ்ரவேலின் கடவுளே நாடுகடத்தினார் என்று தொடர்ச்சியான எழுவாயாக வாசித்தல்.
  rationale: எபிரெயில் வினைகள் ஒருமை ஆண்பால் வடிவில் உள்ளதால் இலக்கணப்படி இரு வாசிப்புகளுக்கும் இடமிருக்கலாம். உடனடி சூழலும் நாடுகடத்தலை நிறைவேற்றிய வரலாற்று முகவரும் அசீரிய அரசன் என்பதைக் காட்டுவதால் ‘அந்த அரசன்’ எனத் தேர்ந்தெடுக்கப்பட்டது; கடவுளின் இறையாண்மை முதல் வாக்கியத்தில் தெளிவாகவே உள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘மனதைத் தூண்டினார்’, ‘நாடுகடத்தி’, ‘கொண்டுபோனான்’ போன்ற இயல்பான சொற்றொடர்கள் பயன்படுத்தப்பட்டுள்ளன. பெயர்கள் மூல எபிரெய வடிவங்களுக்கு நெருக்கமாக எழுத்துப்பெயர்க்கப்பட்டுள்ளன.
