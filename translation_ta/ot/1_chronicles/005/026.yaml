  source_fidelity: 'முக்கியப் பொருள் மூலத்துக்கு உண்மையாக உள்ளது: தேவன் அசீரிய அரசனின்/அரசர்களின் உள்ளார்ந்த நோக்கத்தைத் தூண்டுதல், நாடுகடத்தல், குறிப்பிடப்பட்ட இடங்களுக்கு அழைத்துச் செல்லல், ‘இந்நாள்வரை’ என்ற காலக்குறிப்பு ஆகியவை காக்கப்பட்டுள்ளன. பூல்–தில்காத்-பில்னேசர் தொடர்பிலுள்ள மூலத்தின் இலக்கணத் தெளிவின்மை அடிக்குறிப்பில் சரியாகக் குறிக்கப்பட்டுள்ளது.'
