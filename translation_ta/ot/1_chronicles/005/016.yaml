translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய இணைப்புகளின் தொடர்ச்சியை ‘-இலும்’ அமைப்பு காக்கிறது; மரபுத்தொடர்களின் நேர்ச்சொல் வடிவங்கள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
