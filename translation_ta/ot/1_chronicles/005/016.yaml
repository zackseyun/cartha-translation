base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/016.yaml
  text: They lived in Gilead[a], in Bashan and its towns, and in all the pasturelands of Sharon[c][b], as far as their borders.
translation:
  language: ta
  text: அவர்கள் கீலேயாத்திலும், பாசானிலும் அதன் ஊர்களிலும்[a], சாரோனின் எல்லா மேய்ச்சல் நிலங்களிலும்[b], அவற்றின் எல்லைகள் வரையிலும்[c] குடியிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேர்ச்சொல்லாக, ‘அதன் மகள்கள்’; இது சார்ந்துள்ள பட்டணங்கள் அல்லது கிராமங்களைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: ‘திறந்த நிலங்கள்’ அல்லது ‘பொது நிலங்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: நேர்ச்சொல்லாக, ‘அவற்றின் புறப்பகுதிகள் வரை’; அதாவது, அவற்றின் புற வரம்புகள் அல்லது எல்லைகள் வரை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  choice: குடியிருந்தார்கள்
  rationale: יָשַׁב இங்கு ஒரு பகுதியில் தொடர்ந்து வசித்ததைக் குறிக்கிறது. ‘குடியிருந்தார்கள்’ என்பது நவீனத் தமிழில் இயல்பாகவும் புவியியல் குறிப்புக்கு ஏற்றவாறும் உள்ளது.
- source_word: בַּגִּלְעָד
  choice: கீலேயாத்தில்
  rationale: இடப்பெயர் தமிழில் வழக்கமான வேதாகம ஒலிபெயர்ப்பு வடிவில் தரப்பட்டுள்ளது.
- source_word: בַּבָּשָׁן
  choice: பாசானில்
  rationale: இடப்பெயர் தமிழில் வழக்கமான வேதாகம ஒலிபெயர்ப்பு வடிவில் தரப்பட்டுள்ளது.
- source_word: וּבִבְנֹתֶיהָ
  choice: அதன் ஊர்களிலும்
  rationale: சொல்லுக்கு நேரான பொருள் ‘அதன் மகள்கள்’; ஆனால் இது ஒரு பகுதியைச் சார்ந்த துணைப்பட்டணங்கள் அல்லது கிராமங்களைக் குறிக்கும் எபிரெய மரபுத்தொடர். ஒருமைப் பெண்பால் பின்னொட்டு அருகிலுள்ள பாசானைக் குறிப்பதாக இயல்பாகப் புரிகிறது.
- source_word: מִגְרְשֵׁי
  choice: மேய்ச்சல் நிலங்கள்
  rationale: מִגְרָשׁ என்பது குடியிருப்புகளைச் சுற்றிய திறந்த நிலத்தையோ கால்நடை மேய்ச்சலுக்கான நிலத்தையோ குறிக்கலாம். இங்குள்ள கோத்திரப் புவியியல் சூழலில் ‘மேய்ச்சல் நிலங்கள்’ பொருத்தமானது.
- source_word: שָׁרוֹן
  choice: சாரோன்
  rationale: பிரதேசப் பெயர் மொழிபெயர்க்கப்படாமல் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: עַל תּוֹצְאוֹתָם
  choice: அவற்றின் வெளி எல்லைகள் வரையிலும்
  rationale: ‘அவற்றின் வெளியேறும் இடங்களின்மேல்’ என்ற நேரடிப் பொருளுடைய இச்சொற்றொடர், இங்கு நிலப்பரப்பின் வெளிப்புற வரம்பைச் சுட்டும் இடவியல் மரபுத்தொடராக உள்ளது. ‘அவற்றின்’ என்பது அருகிலுள்ள பன்மைச் சொல்லோடு இணைகிறது; குறிப்பு முழுமையான பரப்பளவை உணர்த்துகிறது.
