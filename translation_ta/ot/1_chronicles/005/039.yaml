  text: And Shallum fathered Hilkiah, and Hilkiah fathered Azariah.
translation:
  language: ta
  text: சல்லூம் இல்க்கியாவைப் பெற்றான்; இல்க்கியா அசரியாவைப் பெற்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ
  choice: ;
  rationale: முந்தைய வம்சவரலாற்றுத் தொடருடன் உள்ள இணைப்பு தனி வசனத் தமிழாக்கத்தில் வெளிப்படையான ‘மேலும்’ என்பதற்குப் பதிலாக இயல்பான தொடர் அமைப்பால் உணர்த்தப்படுகிறது; இரண்டாம் இணைப்பு அரைப்புள்ளியால் குறிக்கப்படுகிறது.
- source_word: שַׁלּוּם
  choice: சல்லூம்
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் இயல்பாக ஒலிபெயர்க்கிறது.
- source_word: הוֹלִיד
  choice: பெற்றான்
  rationale: ஹிஃபில் வடிவம் இங்கு ஆண் வழி வம்சவரலாற்றில் ‘தந்தையானான்/பெற்றான்’ என்ற பொருளில் வருகிறது. ‘பெற்றான்’ சுருக்கமாகவும் வழக்கமான தமிழ் வம்சவரலாற்று நடையிலும் உள்ளது.
- source_word: אֶת
  choice: '[தனியாக மொழிபெயர்க்கப்படவில்லை]'
  rationale: இது நேரடிச் செயப்படுபொருளைக் குறிக்கும் இலக்கண உருபு; தமிழில் ‘-ஐ’ வேற்றுமை உருபால் வெளிப்படுகிறது.
- source_word: חִלְקִיָּה
  choice: இல்க்கியா
  rationale: எபிரெயப் பெயரின் ஒலியை நேரடியாகத் தமிழில் வழங்குகிறது; வசனம் முழுவதும் ஒரே வடிவம் பேணப்படுகிறது.
- source_word: עֲזַרְיָה
  choice: அசரியா
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் வாசிக்க இயலுமாறு ஒலிபெயர்க்கிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், வம்சவரலாற்றுக்கேற்ற சுருக்கமானதும் கண்ணியமானதும் ஆன நடை. ‘பெற்றான்’ என்பது உயிரியல் தந்தைமை அல்லது விரிந்த வம்சத் தொடர்பு ஆகியவற்றில் மூலத்தின் வம்சவரலாற்றுச் சொல்லாட்சி அனுமதிக்கும் அளவைத் தாண்டி விளக்கம் சேர்க்காது.
