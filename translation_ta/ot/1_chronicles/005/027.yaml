  footnotes:
  - marker: a
    text: அல்லது, ‘லேவியின் வழித்தோன்றல்கள்.’ வம்சவரலாறுகளில் ‘மகன்கள்’ என்பது சில வேளைகளில் ஒரு வம்சவழியைப் பரந்த பொருளில் குறிக்கலாம்; ஆனால் இங்கு அது மிக இயல்பாக லேவியின் மூன்று நேரடி மகன்களையே குறிக்கிறது.
