lexical_decisions:
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: בֵּן என்பதன் பன்மை இணைப்புவடிவம். வம்சவரலாற்றுச் சூழலில் இது பரந்த பொருளில் வழித்தோன்றல்களைக் குறிக்கக்கூடும்; ஆனால் இங்கு லேவியின் மூன்று நேரடி மகன்களே பட்டியலிடப்படுவதால் ‘மகன்கள்’ என்பது இயல்பானதும் மூலத்துக்கு நெருக்கமானதும் ஆகும்.
- source_word: לֵוִי
  choice: லேவி
  rationale: தனிப்பெயர்; தமிழில் வழக்கமான வேதாகமப் பெயர்வடிவம் பயன்படுத்தப்பட்டது.
- source_word: גֵּרְשׁוֹן
  choice: கெர்சோன்
  rationale: இங்குள்ள எபிரெய வடிவமான גֵּרְשׁוֹן-ஐப் பிரதிபலிக்கும் பெயரெழுத்தாக்கம்; வேறு இடங்களில் வரும் தொடர்புடைய ‘கெர்சோம்’ என்ற பெயருடன் கலக்கப்படவில்லை.
- source_word: קְהָת
  choice: கோகாத்
  rationale: எபிரெய தனிப்பெயருக்கான தமிழில் நிலைபெற்ற வேதாகமப் பெயர்வடிவம்.
- source_word: מְרָרִי
  choice: மெராரி
  rationale: எபிரெய தனிப்பெயருக்கான தமிழில் நிலைபெற்ற வேதாகமப் பெயர்வடிவம்.
- source_word: וּ
  choice: மற்றும் என்பதைப் பட்டியல் நிறுத்தக்குறியால் வெளிப்படுத்துதல்
  rationale: இறுதிப் பெயரை இணைக்கும் எளிய இணைப்புச்சொல். இயல்பான நவீனத் தமிழ்ப் பட்டியலில் காற்புள்ளியால் இணைப்பு தெளிவாக இருப்பதால் தனியாக ‘மற்றும்’ சேர்க்கப்படவில்லை.
