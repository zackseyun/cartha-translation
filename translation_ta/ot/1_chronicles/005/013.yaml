  terminology: The personal names appropriately follow the Masoretic vocalization. The supplied English audit footnote concerning Eber/Heber has no Tamil counterpart; this is a nonessential English-tradition transliteration note and need not be replicated. The existing footnote anchors are correctly placed and structurally valid.
