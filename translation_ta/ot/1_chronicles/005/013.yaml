    rationale: The Hebrew phrase is singular ‘house’ with a plural ‘fathers’ and is a fixed genealogical designation. Revising the main text to ‘தங்கள் பிதாக்களின் குடும்பங்களின்படி’ avoids unnecessary pluralization of ‘families’ and better aligns text and note.
