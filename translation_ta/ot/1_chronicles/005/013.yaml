  text: וַ/אֲחֵי/הֶ֞ם לְ/בֵ֣ית אֲבוֹתֵי/הֶ֗ם מִֽיכָאֵ֡ל וּ/מְשֻׁלָּ֡ם וְ֠/שֶׁבַע וְ/יוֹרַ֧י וְ/יַעְכָּ֛ן וְ/זִ֥יעַ וָ/עֵ֖בֶר שִׁבְעָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/013.yaml
  text: 'And their brothers[a], according to their fathers’ houses: Michael, Meshullam, Sheba, Jorai, Jachan, Zia[d][c][b], and Eber—seven.'
translation:
  language: ta
  text: 'அவர்களுடைய சகோதரர்கள்[a], தங்கள் பிதாக்களின் குடும்பங்களின்படி[b]: மிகாயேல், மெசுல்லாம், சேபா, யோராய், யாக்கான், சீயா[c], ஏபேர்—மொத்தம் ஏழு பேர்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உறவினர்கள்’ என்றும் மொழிபெயர்க்கலாம்; வம்சப்பட்டியல் சூழலில் ‘சகோதரர்கள்’ என்ற எபிரெயச் சொல் விரிந்த குல உறவினர்களையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லர்த்தமாக, ‘அவர்களுடைய பிதாக்களின் குடும்பத்தின்படி’; இது தந்தைவழிக் குடும்பம் அல்லது குலப் பிரிவைக் குறிக்கிறது.
    reason: cultural_note
  - marker: c
    text: சில உரை அல்லது ஒலிபெயர்ப்பு மரபுகளில் இப்பெயர் ‘சீசா’ என வழங்கப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: அவர்களுடைய சகோதரர்கள்
  rationale: எபிரெயச் சொல்லின் நேரடிப் பொருளான ‘சகோதரர்கள்’ என்பதைக் காக்கிறது; வம்சப்பட்டியல் சூழலில் இது விரிந்த குல உறவினர்களையும் குறிக்கக்கூடும் என்பதால் அடிக்குறிப்பு தரப்பட்டுள்ளது.
- source_word: לְבֵית אֲבוֹתֵיהֶם
  choice: அவர்களுடைய தந்தைவழிக் குடும்பங்களின்படி
  rationale: தந்தை மரபை அடிப்படையாகக் கொண்ட குடும்ப அல்லது குலப் பிரிவைக் குறிக்கும் எபிரெய மரபுத்தொடரை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: מִיכָאֵל וּמְשֻׁלָּם וְשֶׁבַע וְיוֹרַי וְיַעְכָּן וְזִיעַ וָעֵבֶר
  choice: மிகாயேல், மெசுல்லாம், சேபா, யோராய், யாக்கான், சீயா, ஏபேர்
  rationale: WLC உயிர்க்குறிப்புகளை அடிப்படையாகக் கொண்டு தனிப்பெயர்கள் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளன; குறிப்பாக זִיעַ ‘சீயா’ என வழங்கப்பட்டுள்ளது.
- source_word: שִׁבְעָה
  choice: மொத்தம் ஏழு பேர்
  rationale: முன்னர் பட்டியலிடப்பட்ட நபர்களின் எண்ணிக்கையைச் சுருக்கிக் கூறும் தன்மையைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், வம்சப்பட்டியலுக்கேற்ற கண்ணியமான மற்றும் சுருக்கமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய குடும்ப அமைப்பு இயல்பான தமிழில் விளக்கப்பட்டதுடன், பெயர்கள் WLC வாசிப்பை முன்னிறுத்தி ஒலிபெயர்க்கப்பட்டன.
