base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/023.yaml
  text: And the sons of the half-tribe of Manasseh lived in the land from Bashan as far as Baal-hermon[a], Senir, and Mount Hermon[b]; they became numerous.
translation:
  language: ta
  text: மனாசேயின் அரைக் கோத்திரத்தைச் சேர்ந்தவர்கள் பாசானிலிருந்து பாகால்-எர்மோன், செனீர், எர்மோன் மலை[b] வரையுள்ள நாட்டில் குடியிருந்தார்கள்; அவர்கள் எண்ணிக்கையில் பெருகினார்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதனை ‘அவர்கள் அதிகமானார்கள்’ அல்லது ‘அவர்கள் பலுகிப் பெருகினார்கள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல் எண்ணிக்கையில் ஏற்பட்ட வளர்ச்சியை வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: பாகால்-எர்மோன், செனீர், எர்மோன் மலை ஆகியவை அவர்களுடைய நிலப்பரப்பின் வட எல்லையைக் குறிக்கும் இடப்பெயர்கள்.
    reason: cultural_note
lexical_decisions:
- source_word: וּבְנֵי חֲצִי שֵׁבֶט מְנַשֶּׁה
  choice: மனாசேயின் அரைக் கோத்திரத்தைச் சேர்ந்தவர்கள்
  rationale: בני என்பது சொற்படியாக ‘மகன்கள்’ என்றாலும், இங்குள்ள கோத்திரச் சூழலில் அந்தக் குழுவின் உறுப்பினர்கள் அல்லது வழிவந்தோரைக் குறிக்கிறது. நவீன தமிழில் இயல்பாகவும் பொருள் துல்லியமாகவும் இருக்க இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: יָשְׁבוּ
  choice: குடியிருந்தார்கள்
  rationale: இவ்விடத்தில் ישב ஒரு பகுதியில் தொடர்ந்து வசித்ததைக் குறிக்கிறது; ‘குடியிருந்தார்கள்’ என்பது குடியேறிய தொடக்கச் செயலை மட்டும் வலியுறுத்தாமல் வாழ்விடத்தைக் காட்டுகிறது.
- source_word: בָּאָרֶץ מִבָּשָׁן עַד
  choice: பாசானிலிருந்து … வரையுள்ள நாட்டில்
  rationale: מן…עד என்ற அமைப்பு நிலப்பரப்பின் எல்லையைச் சுட்டுகிறது. தமிழில் அதன் புவியியல் விரிவைத் தெளிவாகக் காட்டும் இயல்பான அமைப்பு இது.
- source_word: בַּעַל חֶרְמוֹן וּשְׂנִיר וְהַר חֶרְמוֹן
  choice: பாகால்-எர்மோன், செனீர், எர்மோன் மலை
  rationale: இவை இடப்பெயர்கள் என்பதால் தமிழில் ஒலிபெயர்க்கப்பட்டன; הר חרמון என்பது இயல்பாக ‘எர்மோன் மலை’ என வழங்கப்பட்டது.
- source_word: הֵמָּה רָבוּ
  choice: அவர்கள் எண்ணிக்கையில் பெருகினார்கள்
  rationale: רבה என்பதன் இங்குள்ள பொருள் எண்ணிக்கையில் அதிகமாதல். எதைப் பொறுத்து பெருகினர் என்பதைத் தமிழில் தெளிவாக்க ‘எண்ணிக்கையில்’ சேர்க்கப்பட்டது; தனிப்பட்ட சுட்டுப்பெயரின் வலியுறுத்தலும் ‘அவர்கள்’ என்பதில் தக்கவைக்கப்பட்டது.
