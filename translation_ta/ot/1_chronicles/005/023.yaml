translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘அரைக் கோத்திரம்’ என்ற மரபான வேதாகமச் சொல்லாட்சி தக்கவைக்கப்பட்டு, ‘மகன்கள்’ என்ற சொற்படியான மொழிபெயர்ப்புக்குப் பதிலாக கோத்திர உறுப்பினர்களைக் குறிக்கும் இயல்பான தொடர் பயன்படுத்தப்பட்டது. மூலத்தின் புவியியல் பட்டியல் மற்றும் எண்ணிக்கைப் பெருக்கம் தனித்தனியாகத் தெளிவாகப் பாதுகாக்கப்பட்டுள்ளன.
