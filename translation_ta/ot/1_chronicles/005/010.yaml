  text: וּ/בִ/ימֵ֣י שָׁא֗וּל עָשׂ֤וּ מִלְחָמָה֙ עִם הַֽ/הַגְרִאִ֔ים וַֽ/יִּפְּל֖וּ בְּ/יָדָ֑/ם וַ/יֵּשְׁבוּ֙ בְּ/אָ֣הֳלֵי/הֶ֔ם עַֽל כָּל פְּנֵ֖י מִזְרָ֥ח לַ/גִּלְעָֽד־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/010.yaml
  text: In the days of Saul they made war with the Hagrites[a], and they fell into their hand[b]; and they lived in their tents throughout all the region east of Gilead.
translation:
  language: ta
  text: சவுலின் நாட்களில் அவர்கள் ஆகாரியர்களோடு[a] போரிட்டார்கள். ஆகாரியர்கள் அவர்களுடைய கையில் அகப்பட்டார்கள்[b]. பின்பு அவர்கள் கீலேயாத்துக்குக் கிழக்கே இருந்த பகுதி முழுவதிலும் ஆகாரியர்களின் கூடாரங்களில் குடியிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஆகாரியர்கள்” என்பதை “ஆகரியர்கள்” என்றும் ஒலிபெயர்க்கலாம். இந்த எபிரெய மக்களினப் பெயர் ஆகாருடன் தொடர்புடைய ஒரு மக்களைக் குறிப்பதாக இருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “அவர்கள் இவர்களுடைய கையில் விழுந்தார்கள்”; அதாவது, இவர்களுடைய அதிகாரத்திற்குள் அகப்பட்டார்கள். சூழலின்படி விழுந்தவர்கள் ஆகாரியர்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִימֵי שָׁאוּל
  choice: சவுலின் நாட்களில்
  rationale: יוֹם என்பதன் பன்மை இணைநிலையும் முன்னிடைச்சொல்லும் சேர்ந்து ஒரு காலப்பகுதியைக் குறிக்கின்றன; தமிழில் இயல்பாகவும் வேதாகம நடைக்கு ஏற்றவாறும் உள்ளது.
- source_word: עָשׂוּ מִלְחָמָה עִם
  choice: போரிட்டார்கள்
  rationale: இச்சொற்றொடர் போரில் ஈடுபடுவதைக் குறிக்கும் எபிரெய மரபுத்தொடர். עִם என்பதன் சொற்பொருள் ‘உடன்’ என்றாலும், தமிழில் ‘அவர்களோடு போரிட்டார்கள்’ என்பதே எதிர்தரப்பைத் தெளிவாகக் காட்டும் இயல்பான நடை.
- source_word: הַהַגְרִאִים
  choice: ஆகாரியர்கள்
  rationale: ஆகாருடன் தொடர்புடையதாகக் கருதப்படும் மக்களினப் பெயரைத் தமிழில் அறியப்பட்ட வடிவில் தருகிறது; மாற்று ஒலிபெயர்ப்பு அடிக்குறிப்பில் கொடுக்கப்படுகிறது.
- source_word: וַיִּפְּלוּ בְּיָדָם
  choice: அவர்களுடைய கையில் அகப்பட்டார்கள்
  rationale: ‘கையில் விழுதல்’ என்பது ஒருவரின் அதிகாரத்திற்குள் அகப்படுவதைக் குறிக்கும் உருவகம். தமிழில் உருவகத்தைத் தக்கவைத்தபடியே பொருளை இயல்பாக வெளிப்படுத்துகிறது; சூழலால் மறைமுகமாகத் தெரியும் எழுவாய் ‘ஆகாரியர்கள்’ என்று வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: וַיֵּשְׁבוּ
  choice: குடியிருந்தார்கள்
  rationale: ישב இங்கு வெற்றிக்குப் பின் அப்பகுதியில் தங்கி வாழ்ந்ததைக் குறிக்கிறது. ‘குடியிருந்தார்கள்’ என்பது நிரந்தரக் குடியேற்றத்தை அளவுக்கு மீறி வலியுறுத்தாமல் வாழ்ந்ததையும் தங்கியதையும் காட்டுகிறது.
- source_word: בְּאָהֳלֵיהֶם
  choice: ஆகாரியர்களின் கூடாரங்களில்
  rationale: ‘அவர்களுடைய கூடாரங்கள்’ என்பதில் தமிழில் சுட்டுப்பெயரின் தொடர்பு குழப்பமடையலாம்; எபிரெயச் சூழலில் அது தோற்ற ஆகாரியர்களைக் குறிப்பதால் பெயர் தெளிவாக மீளுரைக்கப்படுகிறது.
- source_word: עַל כָּל פְּנֵי מִזְרָח לַגִּלְעָד
  choice: கீலேயாத்துக்குக் கிழக்கே இருந்த பகுதி முழுவதிலும்
  rationale: עַל כָּל פְּנֵי என்ற பரப்பளவு மரபுத்தொடரையும், கீலேயாத்தை ஒப்பிடும் கிழக்குத் திசை குறிப்பையும் இயல்பான நவீன தமிழில் வழங்குகிறது.
