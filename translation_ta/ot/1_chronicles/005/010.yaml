translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வரலாற்று நடை பயன்படுத்தப்பட்டுள்ளது. ‘கையில் அகப்பட்டார்கள்’ என்ற சொற்றொடர் மூலத்தின் உருவகத்தையும் அதன் அதிகாரம் சார்ந்த பொருளையும் தக்கவைக்கிறது. சுட்டுப்பெயர் குழப்பத்தைத் தவிர்க்க ‘ஆகாரியர்கள்’ என்பது தேவையான இடங்களில் மீண்டும் கூறப்பட்டுள்ளது.
