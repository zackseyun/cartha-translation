lexical_decisions:
- source_word: וַ/אֲחִימַעַץ
  choice: அகிமாஸ்
  rationale: எபிரெய தனிப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டது. தொடக்க இணைப்புச் சொல் பட்டியலின் தொடர்ச்சியைக் குறிப்பதால் தனியாக மொழிபெயர்க்கப்படவில்லை.
- source_word: הוֹלִיד
  choice: பெற்றான்
  rationale: ילד என்பதன் ஹிஃபில் வடிவம் வம்சவரலாற்றுச் சூழலில் ஒருவருக்குத் தந்தையானதைக் குறிக்கிறது; ‘பெற்றான்’ என்பது தமிழில் வழக்கமான, சுருக்கமான வம்சவரலாற்றுச் சொற்பயன்பாடு.
- source_word: אֶת
  choice: '[தனியாக மொழிபெயர்க்கப்படவில்லை]'
  rationale: இது நேரடிச் செயப்படுபொருளைக் குறிக்கும் இலக்கணக் குறியீடு; தமிழில் அதன் பணி ‘-ஐ’ வேற்றுமை உருபால் வெளிப்படுகிறது.
- source_word: עֲזַרְיָה
  choice: அசரியா
  rationale: எபிரெய தனிப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: וַ/עֲזַרְיָה
  choice: அசரியா
  rationale: இணைப்பு வாவ் தமிழில் அரைப்புள்ளியால் இயல்பாக வெளிப்படுத்தப்பட்டு, தனிப்பெயர் ஒலிபெயர்க்கப்பட்டது.
- source_word: יוֹחָנָן
  choice: யோகனான்
  rationale: எபிரெய தனிப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டது; יוֹחָנָן என்ற வடிவத்தின் ஒலியமைப்பை நெருக்கமாகப் பேணுகிறது.
