revisions:
- from: ரூபனின் மக்களிலும், காதியர்களிலும், மனாசேயின் அரைக் கோத்திரத்தினரிலும் போராற்றல் மிக்கவர்கள் இருந்தார்கள். அவர்கள் கேடயத்தையும் வாளையும் ஏந்தியவர்களும், வில்லை வளைத்துப் போரிடுகிறவர்களும்,[a] போருக்குப் பயிற்சி பெற்றவர்களுமாக இருந்தார்கள். படையெடுத்துச் செல்லத் தகுதியுள்ள[b] அவர்களின் எண்ணிக்கை 44,760.
