translation_notes:
  register: நவீன செந்தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. பட்டியல் போன்ற எபிரெய வாக்கிய அமைப்பு தமிழில் தெளிவாக இருக்க இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டது; மூலத்தின் இராணுவப் படிமங்கள் இயன்றவரை பேணப்பட்டன.
