  text: בְּנֵֽי רְאוּבֵ֨ן וְ/גָדִ֜י וַ/חֲצִ֥י שֵֽׁבֶט מְנַשֶּׁה֮ מִן בְּנֵי חַיִל֒ אֲ֠נָשִׁים נֹשְׂאֵ֨י מָגֵ֤ן וְ/חֶ֨רֶב֙ וְ/דֹ֣רְכֵי קֶ֔שֶׁת וּ/לְמוּדֵ֖י מִלְחָמָ֑ה אַרְבָּעִ֨ים וְ/אַרְבָּעָ֥ה אֶ֛לֶף וּ/שְׁבַע מֵא֥וֹת וְ/שִׁשִּׁ֖ים יֹצְאֵ֥י צָבָֽא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/018.yaml
  text: The sons of Reuben and the Gadites and the half-tribe of Manasseh[a], valiant men, men who carried shield and sword, who drew the bow, and who were trained for war, were forty-four thousand seven hundred sixty[c][b], able to go out to war.
translation:
  language: ta
  text: ரூபனின் சந்ததியினரும், காதியரும், மனாசேயின் அரைக் கோத்திரத்தினரும் போர்வீரர்கள்; அவர்கள் கேடயமும் வாளும் ஏந்தியவர்களாகவும், வில்லை இழுப்பவர்களாகவும்[a], போரில் பயிற்சி பெற்றவர்களாகவும் இருந்தார்கள். போருக்குப் புறப்படத் தகுதியான[b] இவர்களின் எண்ணிக்கை நாற்பத்துநான்காயிரத்து எழுநூற்று அறுபது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லர்த்தமாக, “வில்லை மிதிப்பவர்கள்” அல்லது “வில்லை வளைப்பவர்கள்”; அம்பெய்வதற்காக வில்லைத் தயார் செய்வதைக் குறிக்கும் மரபுத்தொடர்.
    reason: cultural_note
  - marker: b
    text: அல்லது “இராணுவச் சேவைக்குத் தகுதியானவர்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי רְאוּבֵן
  choice: ரூபனின் மக்கள்
  rationale: எபிரெயச் சொல்லின் உறவுமுறை வடிவத்தைப் பேணுகிறது; இச்சூழலில் இது ரூபனின் கோத்திரத்தைச் சேர்ந்த சந்ததியினரைக் குறிக்கிறது.
- source_word: וְגָדִי
  choice: காதியர்கள்
  rationale: இது காத்தின் கோத்திர உறுப்பினர்களைக் குறிக்கும் இனப்பெயர் வடிவம்; தனிநபரான காத்தைக் குறிக்கவில்லை.
- source_word: וַחֲצִי שֵׁבֶט מְנַשֶּׁה
  choice: மனாசேயின் அரைக் கோத்திரத்தினர்
  rationale: கோத்திரப் பிரிவைத் தெளிவாகவும் இயல்பான தமிழிலும் தெரிவிக்கிறது.
- source_word: מִן בְּנֵי חַיִל
  choice: போராற்றல் மிக்கவர்கள்
  rationale: חַיִל இங்கு வலிமை, திறன், வீரத்தன்மை கொண்ட போர்வீரர்களைக் குறிக்கிறது; இராணுவச் சூழலுக்கு ஏற்ற பரந்த பொருளை இத்தொடர் தருகிறது.
- source_word: נֹשְׂאֵי מָגֵן וְחֶרֶב
  choice: கேடயத்தையும் வாளையும் ஏந்தியவர்கள்
  rationale: நֹשְׂאֵי என்பதன் சுமத்தல் அல்லது ஏந்துதல் என்ற நேரடியான உருவகத்தைப் பேணுகிறது.
- source_word: וְדֹרְכֵי קֶשֶׁת
  choice: வில்லை வளைத்துப் போரிடுகிறவர்கள்
  rationale: தொடரின் சொற்படிமமான ‘வில்லை மிதித்தல்/வளைத்தல்’ என்பதையும் அதன் போர்ச் செயல்பாட்டையும் இயல்பான தமிழில் எடுத்துரைக்கிறது.
- source_word: וּלְמוּדֵי מִלְחָמָה
  choice: போருக்குப் பயிற்சி பெற்றவர்கள்
  rationale: לְמוּדֵי என்பதிலுள்ள கற்பிக்கப்பட்ட அல்லது பயிற்றுவிக்கப்பட்ட நிலையைத் தெளிவாகக் காட்டுகிறது.
- source_word: אַרְבָּעִים וְאַרְבָּעָה אֶלֶף וּשְׁבַע מֵאוֹת וְשִׁשִּׁים
  choice: 44,760
  rationale: மூல எண்ணைத் துல்லியமாகவும் நவீன வாசிப்புக்கு எளிதாகவும் தருகிறது.
- source_word: יֹצְאֵי צָבָא
  choice: படையெடுத்துச் செல்லத் தகுதியுள்ளவர்கள்
  rationale: சொல்லாட்சியின் ‘படையுடன் புறப்படுதல்’ என்ற உருவகத்தையும் இராணுவச் சேவைக்கான தகுதி என்ற சூழற்பொருளையும் இணைக்கிறது.
