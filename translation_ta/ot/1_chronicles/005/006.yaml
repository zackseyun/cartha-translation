  register: நவீனத் தரத் தமிழில், வம்சவரிசைச் சூழலுக்கு ஏற்ற சுருக்கமான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயத்தின் மீள்சுட்டும் הוּא தனியே ‘அவன்’ எனக் காக்கப்பட்டுள்ளது; அரசனின் பெயர் இவ்வசனத்திலுள்ள WLC வடிவத்தின்படி எழுத்துப்பெயர்க்கப்பட்டுள்ளது.
