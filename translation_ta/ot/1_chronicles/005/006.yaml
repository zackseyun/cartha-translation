  terminology: ‘பெயேரா,’ ‘தில்கத்-பில்னேசர்,’ ‘அசீரிய அரசன்,’ ‘ரூபேனியர்,’ மற்றும் ‘தலைவன்’ ஆகியவை பொருத்தமானவை. ‘தலைவன்’ என்பது נָשִׂיא என்பதற்கான கோத்திரச் சூழலுக்கு ஏற்ற, அரசவம்சக் கருத்தைத் திணிக்காத நவீனச் சொல். அடிக்குறிப்பு எபிரெய வடிவத்தையும் பரவலான வரலாற்று வடிவத்தையும் சரியாக வேறுபடுத்துகிறது.
