source:
  edition: WLC
  text: בְּאֵרָ֣ה בְנ֔/וֹ אֲשֶׁ֣ר הֶגְלָ֔ה תִּלְּגַ֥ת פִּלְנְאֶ֖סֶר מֶ֣לֶךְ אַשֻּׁ֑ר ה֥וּא נָשִׂ֖יא לָ/רֽאוּבֵנִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/006.yaml
  text: Beerah his son[a], whom Tilgath-pilneser king of Assyria carried away into exile—he was a chief of the Reubenites.
translation:
  language: ta
  text: அவனுடைய மகன் பெயேரா; அசீரிய அரசன் தில்கத்-பில்னேசர்[a] அவனை நாடுகடத்தினான். அவன் ரூபேனியரின் தலைவனாக இருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு அசீரிய அரசனின் பெயர் எபிரெயத்தில் “தில்கத்-பில்னேசர்” என்ற வடிவில் உள்ளது; வரலாற்றில் பரவலாக அறியப்படும் வடிவம் “திக்லத்-பிலேசர்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאֵרָה
  choice: பெயேரா
  rationale: எபிரெய தனிநபர் பெயரின் ஒலிப்பைத் தமிழில் இயன்றவரை நெருக்கமாக எழுத்துப்பெயர்த்துள்ளது.
- source_word: בְנוֹ
  choice: அவனுடைய மகன்
  rationale: மூன்றாம் நபர் ஆண்பால் ஒருமை பின்னொட்டுடன் வந்துள்ள ‘மகன்’ என்ற சொல்லை, முந்தைய வம்சவரிசை நபரைக் குறிக்கும் இயல்பான தமிழில் வழங்குகிறது.
- source_word: אֲשֶׁר הֶגְלָה
  choice: அவனை நாடுகடத்தினான்
  rationale: גלה என்பதன் ஹிஃபில் வடிவிலுள்ள காரணவினைப் பொருளையும் வரலாற்றுச் சூழலிலான கட்டாய இடம்பெயர்வையும் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: תִּלְגַת פִּלְנְאֶסֶר
  choice: தில்கத்-பில்னேசர்
  rationale: இவ்வசனத்தின் எபிரெய மெய்யெழுத்து வடிவத்தை நேரடியாகப் பின்பற்றும் எழுத்துப்பெயர்ப்பு; வேறு இடங்களின் அல்லது அக்காதிய வடிவத்தின் அடிப்படையில் ஒத்திசைக்கப்படவில்லை.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: அசீரிய அரசன்
  rationale: இணைப்புநிலைத் தொடரை நவீனத் தமிழில் இயல்பான அரசப் பட்டமாக வழங்குகிறது.
- source_word: הוּא
  choice: அவன்
  rationale: இடைப்பட்ட சார்புத் தொடருக்குப் பின் பெயேராவை மீண்டும் சுட்டும் எபிரெய வலியுறுத்தல்/மீள்சுட்டலைக் காக்கிறது.
- source_word: נָשִׂיא
  choice: தலைவன்
  rationale: கோத்திரச் சூழலில் அங்கீகரிக்கப்பட்ட தலைவரைக் குறிக்கிறது; ‘இளவரசன்’ எனும் அரச மரபுப் பொருளைத் தவிர்க்கிறது.
- source_word: לָרְאוּבֵנִי
  choice: ரூபேனியரின்
  rationale: லாமேத் முன்னொட்டு இங்கு தலைமைக்கும் மக்கள்குழுவுக்கும் உள்ள உறவைக் குறிக்கிறது; தமிழில் உடைமைத் தொடர்பு இயல்பாக உள்ளது.
