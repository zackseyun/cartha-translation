id: 1CH.5.30
reference: 1 Chronicles 5:30
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: אֶלְעָזָר֙ הוֹלִ֣יד אֶת פִּֽינְחָ֔ס פִּֽינְחָ֖ס הֹלִ֥יד אֶת אֲבִישֽׁוּעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/030.yaml
  text: Eleazar fathered Phinehas; Phinehas fathered Abishua.
translation:
  language: ta
  text: எலெயாசார் பினெகாஸைப் பெற்றான்; பினெகாஸ் அபிசுவாவைப் பெற்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶלְעָזָר
  choice: எலெயாசார்
  rationale: எபிரெயத் தனிப்பெயரின் ஒலியைத் தமிழ் வேதாகமப் பயன்பாட்டுக்கு ஏற்ற பரிச்சயமான வடிவில் எழுத்துப்பெயர்த்தது.
- source_word: הוֹלִיד / הֹלִיד
  choice: பெற்றான்
  rationale: யָלַד என்பதன் ஹிஃபில் வடிவம் வம்சப்பட்டியல் சூழலில் ஒருவருக்குப் பிள்ளை பிறந்ததையோ அவர் அடுத்த தலைமுறையின் தந்தையாக இருந்ததையோ குறிக்கிறது. ‘பெற்றான்’ என்பது சுருக்கமான, இயல்பான தமிழ் வம்சப்பட்டியல் நடை.
- source_word: אֶת
  choice: தனியாக மொழிபெயர்க்கப்படவில்லை
  rationale: இது நேரடிச் செயப்படுபொருளைக் குறிக்கும் இலக்கணச் சுட்டி; தமிழில் ‘பினெகாசைப்’, ‘அபிசுவாவைப்’ என்ற வேற்றுமை உருபுகளால் அதன் பணி வெளிப்படுகிறது.
- source_word: פִּינְחָס
  choice: பினெகாஸ்
  rationale: எபிரெயத் தனிப்பெயரைத் தமிழில் பரிச்சயமான வேதாகமப் பெயர் வடிவில் எழுத்துப்பெயர்த்தது; இரு வாக்கியக்கூறுகளிலும் ஒரே பெயர் தொடர்ச்சியாகப் பேணப்பட்டுள்ளது.
- source_word: אֲבִישׁוּעַ
  choice: அபிசுவா
  rationale: எபிரெயத் தனிப்பெயரின் ஒலியை இயல்பான தமிழ் எழுத்துப்பெயர்ப்பு வடிவில் வழங்குகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், வம்சப்பட்டியலுக்கேற்ற சுருக்கமான மற்றும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் இரண்டு இணையான வாக்கியக்கூறுகளும் அரைப்புள்ளியால் தெளிவாக இணைக்கப்பட்டுள்ளன.
