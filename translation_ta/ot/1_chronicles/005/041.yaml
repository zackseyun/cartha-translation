id: 1CH.5.41
reference: 1 Chronicles 5:41
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וִ/יהוֹצָדָ֣ק הָלַ֔ךְ בְּ/הַגְל֣וֹת יְהוָ֔ה אֶת יְהוּדָ֖ה וִ/ירוּשָׁלִָ֑ם בְּ/יַ֖ד נְבֻכַדְנֶאצַּֽר־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/041.yaml
  text: And Jehozadak went away when Yahweh sent Judah and Jerusalem into exile by the hand of Nebuchadnezzar[a].
translation:
  language: ta
  text: யாவே யூதாவையும் எருசலேமையும் நேபுகாத்நேச்சரின் கையால்[a] நாடுகடத்தியபோது, யெகோசாதாக் சென்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, நேபுகாத்நேச்சர் மூலமாக.
    reason: ‘கையால்’ என்ற எபிரெய மொழிமரபின் முகவர்/கருவிப் பொருளைத் தெளிவுபடுத்துகிறது.
lexical_decisions:
- source_word: וִ/יהוֹצָדָק
  choice: யெகோசாதாக்
  rationale: முழுமையான எபிரெயப் பெயர்வடிவத்தைத் தமிழில் ஒலிபெயர்க்கிறது; தொடக்க இணைப்புச்சொல் தமிழின் இயல்பான வாக்கிய அமைப்பில் தனியாக மொழிபெயர்க்கப்படவில்லை.
- source_word: הָלַךְ
  choice: சென்றார்
  rationale: הלך என்பதன் அடிப்படைப் பொருளான ‘செல்’ என்பதைக் காக்கிறது. அவர் தாமாகவே நாடுகடத்தலை முன்னெடுத்தார் என்ற எண்ணத்தைச் சேர்க்காமல், சூழலில் அவர் அங்கிருந்து சென்றதைத் தெரிவிக்கிறது.
- source_word: בְּ/הַגְלוֹת
  choice: நாடுகடத்தியபோது
  rationale: בְּ + infinitive construct இங்கு காலப்பொருளில் ‘நாடுகடத்தியபோது’ என வருகிறது; தமிழில் இயல்பான வினைமுற்று அமைப்பாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பட்டத்தைப் பதிலாக இடாமல், எபிரெய இறைப்பெயரான יהוה-ஐ தமிழில் பரவலாக அறியப்படும் ‘யாவே’ என ஒலிபெயர்க்கிறது.
- source_word: אֶת יְהוּדָה וִ/ירוּשָׁלָם
  choice: யூதாவையும் எருசலேமையும்
  rationale: மூலத்தில் உள்ள நாடு/பகுதி மற்றும் நகரத்தின் பெயர்களை நேரடியாகக் காக்கிறது; ‘மக்கள்’ என்ற விளக்கச் சொல்லைச் சேர்க்கவில்லை.
- source_word: בְּ/יַד
  choice: கையால்
  rationale: மனித முகவர் அல்லது கருவியைக் குறிக்கும் எபிரெய மொழிமரபைத் தக்கவைக்கிறது; அதன் பொருள் அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
- source_word: נְבֻכַדְנֶאצַּר
  choice: நேபுகாத்நேச்சர்
  rationale: பாபிலோனிய அரசனின் பெயருக்கான தமிழில் பரவலாகப் பயன்படும் ஒலிபெயர்ப்பு.
theological_decisions:
- issue: நாடுகடத்தலில் இறைச் செயல்பாடும் மனிதச் செயல்பாடும்
  choice: யாவே நாடுகடத்தியவர் என்றும், நேபுகாத்நேச்சர் அவர் பயன்படுத்திய மனித முகவர் என்றும் வாக்கிய அமைப்பு காட்டுகிறது.
  alternative: நாடுகடத்தலைச் செய்த ஒரே செயலாளராக நேபுகாத்நேச்சரை மட்டும் காட்டுதல்.
  rationale: எபிரெய இலக்கணத்தில் יהוה நாடுகடத்தும் செயலின் எழுவாய்; בְּיַד נְבֻכַדְנֶאצַּר மனித முகவர் அல்லது கருவியைக் குறிக்கிறது. மொழிபெயர்ப்பு இரு நிலைச் செயல்பாட்டையும் தீர்த்துவிடாமல் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘கையால்’ என்ற வேதாகம மொழிமரபு மூலத்தின் இறை–மனித முகவர் உறவைத் தக்கவைக்கிறது; அடிக்குறிப்பு அதன் பொருளை சாதாரண வாசகருக்குத் தெளிவாக்குகிறது.
