  source_fidelity: 'மொத்தத்தில் மூலத்திற்கு நெருக்கமாக உள்ளது: עזר-இன் செயப்பாட்டு வடிவம், נתן בְּיָד idiom, போரில் கடவுளை நோக்கி எழுப்பிய கூக்குரல், நம்பிக்கையை அடிப்படையாகக் கொண்ட சாதகமான தெய்வீக மறுமொழி ஆகியவை பாதுகாக்கப்பட்டுள்ளன. ஆனால் “அவர்களுக்கு எதிராக இவர்களுக்கு” என்பது தமிழில் தேவையற்ற முறையில் தடுமாற்றமும் தெளிவின்மையும் தருகிறது; “அவர்களை எதிர்த்து இவர்களுக்கு” என்பது עֲלֵיהֶם-ஐ இயல்பாகக் காட்டுகிறது. இறுதிவினை நிபால் வடிவத்தின் ‘வேண்டிக்கொள்ளப்பட்டார்/வேண்டுதலுக்கு இணங்கினார்’ நுணுக்கத்தை அடிக்குறிப்பில் வெளிப்படையாக வைத்தல் வேண்டும்.'
  naturalness: திருத்தப்பட்ட உரை நவீன தரநிலைத் தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது. “அவர்களை எதிர்த்து” என்ற அமைப்பு இரு தரப்புகளின் தொடர்பைச் செயற்கையான இரட்டைப் பினாமைகளின்றி தெரிவிக்கிறது. “வேண்டுதலுக்கு இணங்கினார்” இயல்பானது; அடிக்குறிப்பு அதன் நேரடியான செயப்பாட்டுத் தளர்வை விளக்குகிறது.
  terminology: “ஆகிரியர்கள்” என்பது הַהַגְרִיאִים என்பதற்கான ஏற்ற ஒலிபெயர்ப்பாக வைத்திருக்கலாம்; “ஆகாரியர்கள்” மாற்று வடிவமாக அடிக்குறிப்பில் உள்ளது. “கையில் ஒப்புக்கொடுக்கப்பட்டார்கள்” எபிரெயப் போரியல் உருவகத்தைத் தக்கவைக்கிறது. “கடவுள்,” “நம்பியிருந்தார்கள்,” “வேண்டுதல்” ஆகியவை நடுநிலையான பொதுக் கிறிஸ்தவத் தமிழில் பொருத்தமானவை.
