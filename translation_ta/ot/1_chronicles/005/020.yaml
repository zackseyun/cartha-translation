  text: וַ/יֵּעָזְר֣וּ עֲלֵי/הֶ֔ם וַ/יִּנָּתְנ֤וּ בְ/יָדָ/ם֙ הַֽ/הַגְרִיאִ֔ים וְ/כֹ֖ל שֶׁ֣/עִמָּ/הֶ֑ם כִּ֠י לֵ/אלֹהִ֤ים זָעֲקוּ֙ בַּ/מִּלְחָמָ֔ה וְ/נַעְתּ֥וֹר לָ/הֶ֖ם כִּי בָ֥טְחוּ בֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/020.yaml
  text: They were helped against them[a], and the Hagrites and all who were with them were given into their hand, because they cried out to God in the battle[c][b], and he answered them because they trusted in him.
translation:
  language: ta
  text: அவர்களை எதிர்த்து இவர்களுக்கு உதவி கிடைத்தது; ஆகிரியர்களும்[a] அவர்களோடு இருந்த அனைவரும் இவர்களுடைய கையில் ஒப்புக்கொடுக்கப்பட்டார்கள்[b]. ஏனெனில், போரின்போது இவர்கள் கடவுளை நோக்கிக் கூக்குரலிட்டார்கள்; இவர்கள் அவரை நம்பியிருந்ததால், அவர் இவர்களுடைய வேண்டுதலுக்கு இணங்கினார்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆகாரியர்கள்.”
    reason: alternative_reading
  - marker: b
    text: “கையில் ஒப்புக்கொடுக்கப்பட்டார்கள்” என்பது தோற்கடிக்கப்பட்டு அவர்களுடைய அதிகாரத்துக்குள் கொடுக்கப்பட்டார்கள் என்று பொருள்படும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “அவர் அவர்களால் வேண்டிக்கொள்ளப்பட்டார்”; அதாவது, அவர் அவர்களுடைய வேண்டுதலுக்குச் சாதகமாகப் பதிலளித்தார்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּעָזְרוּ עֲלֵיהֶם
  choice: அவர்களுக்கு எதிராக இவர்களுக்கு உதவி கிடைத்தது
  rationale: நிபால் வினைவடிவின் செயப்பாட்டு பொருளைப் பாதுகாத்து, உதவியவர் யார் என்பதை முதல் கூற்றிலேயே வெளிப்படையாகச் சேர்க்காமல் விடுகிறது; தொடர்ந்து வரும் காரணவாக்கியங்கள் கடவுளின் உதவியை உணர்த்துகின்றன.
- source_word: וַיִּנָּתְנוּ בְיָדָם
  choice: இவர்களுடைய கையில் ஒப்புக்கொடுக்கப்பட்டார்கள்
  rationale: தோல்வியடைந்து எதிரியின் அதிகாரத்துக்குள் கொண்டுவரப்படுவதைக் குறிக்கும் எபிரெய இராணுவ மரபுத்தொடரின் கை உருவகத்தைத் தமிழிலும் பாதுகாக்கிறது.
- source_word: הַהַגְרִיאִים
  choice: ஆகிரியர்கள்
  rationale: மக்களினப் பெயரை எபிரெய உச்சரிப்புக்கு அண்மையாக ஒலிபெயர்க்கிறது; ஆகாரியர்கள் என்ற மாற்று வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְכֹל שֶׁעִמָּהֶם
  choice: அவர்களோடு இருந்த அனைவரும்
  rationale: ஆகிரியர்களுடன் இருந்த கூட்டாளிகளையோ படையினரையோ இயல்பான தமிழில் குறிக்கிறது.
- source_word: כִּי לֵאלֹהִים זָעֲקוּ
  choice: ஏனெனில் ... கடவுளை நோக்கிக் கூக்குரலிட்டார்கள்
  rationale: זעק என்பதிலுள்ள அவசரமான உதவிக் கூக்குரலின் வலிமையையும் அது கடவுளை நோக்கியது என்பதையும் தக்கவைக்கிறது.
- source_word: בַּמִּלְחָמָה
  choice: போரின்போது
  rationale: முன்னர் விவரிக்கப்பட்ட குறிப்பிட்ட போரில் நிகழ்ந்ததைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וְנַעְתּוֹר לָהֶם
  choice: அவர் இவர்களுடைய வேண்டுதலுக்கு இணங்கினார்
  rationale: עתר என்பதன் நிபால் வடிவம் வேண்டுதலுக்கு சாதகமாக இணங்குதல் அல்லது மன்றாட்டை ஏற்றுக்கொள்ளுதல் என்ற நுண்பொருளைக் கொண்டுள்ளது; வெறும் பதில் கூறுதல் என்று சுருக்காமல் அதைப் பாதுகாக்கிறது.
- source_word: כִּי בָטְחוּ בוֹ
  choice: இவர்கள் அவரை நம்பியிருந்ததால்
  rationale: בטח ב குறிக்கும் சார்ந்திருக்கும் நம்பிக்கையையும், கடவுளின் சாதகமான பதிலுக்கான காரணத் தொடர்பையும் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: போரில் கிடைத்த உதவியின் செயற்பாட்டாளர்
  choice: செயப்பாட்டு அமைப்பில், உதவியவர் முதல் கூற்றில் மறைமுகமாகவே விடப்படுகிறார்.
  alternative: கடவுள் அவர்களுக்கு எதிராக இவர்களுக்கு உதவினார்.
  rationale: எபிரெய வினை செயப்பாட்டு வடிவில் உள்ளது. கடவுளை வெளிப்படையான எழுவாயாகச் சேர்க்காமல் மூலத்தின் அமைப்பைப் பாதுகாக்கிறது; ஆயினும் ஜெபம் மற்றும் நம்பிக்கை குறித்த அடுத்த கூற்றுகள் இறுதி உதவியாளர் கடவுளே என்பதைத் தெளிவாக்குகின்றன.
- issue: வேண்டுதலுக்குக் கடவுள் அளித்த சாதகமான பதில்
  choice: அவர் இவர்களுடைய வேண்டுதலுக்கு இணங்கினார்.
  alternative: அவர் அவர்களுக்குப் பதிலளித்தார்; அவர் அவர்களால் வேண்டிக்கொள்ளப்பட்டார்.
  rationale: நிபால் வடிவம் கடவுள் மன்றாட்டை ஏற்று சாதகமாகச் செயல்பட்டார் என்ற கருத்தைத் தருகிறது. இந்த மொழிபெயர்ப்பு ஜெபம், நம்பிக்கை, தெய்வீகச் செயல் ஆகியவற்றின் தொடர்பைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழ்; கண்ணியமானதும் பொதுவாசகர்களுக்குப் புரியக்கூடியதுமான நடை. தொடர்ச்சியாக வரும் இரு தரப்பினரையும் தெளிவுபடுத்த “இவர்கள்/அவர்கள்” பயன்படுத்தப்பட்டுள்ளது. எபிரெயச் செயப்பாட்டு அமைப்பும் “கையில்” என்ற உருவகமும் பாதுகாக்கப்பட்டுள்ளன.
