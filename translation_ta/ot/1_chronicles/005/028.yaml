  text: וּ/בְנֵ֖י קְהָ֑ת עַמְרָ֣ם יִצְהָ֔ר וְ/חֶבְר֖וֹן וְ/עֻזִּיאֵֽל׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/028.yaml
  text: 'And the sons of Kohath: Amram, Izhar, Hebron, and Uzziel.'
translation:
  language: ta
  text: 'மேலும், கோகாத்தின் மகன்கள்: அம்ராம், இஸ்ஹார், ஹெப்ரோன் மற்றும் உஸ்ஸியேல்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בְנֵי קְהָת
  choice: கோகாத்தின் மகன்கள்
  rationale: בְנֵי என்பது இங்கு வம்சப் பட்டியலில் நேரடி ‘மகன்கள்’ என இயல்பாகப் பொருள்படுகிறது. தொடக்க ו முந்தைய பட்டியலின் தொடர்ச்சியைக் குறித்தாலும், நவீன தமிழில் தனி வசனத்தின் தொடக்கத்தில் ‘மேலும்’ என்று சேர்ப்பது செயற்கையாக இருப்பதால் வாக்கிய அமைப்பில் மறைமுகமாக வெளிப்படுத்தப்பட்டது.
- source_word: קְהָת
  choice: கோகாத்
  rationale: எபிரேயப் பெயரின் ஒலியை நவீனத் தமிழில் தெளிவாகக் காட்டும் எழுத்துப்பெயர்ப்பு.
- source_word: עַמְרָם
  choice: அம்ராம்
  rationale: எபிரேயப் பெயரின் ஒலிக்கு நெருக்கமான தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: יִצְהָר
  choice: இத்சார்
  rationale: צְ ஒலிக்கூட்டத்தை ‘த்ச’ எனக் காட்டி, பெயரை மூல ஒலிக்கு நெருக்கமாக எழுத்துப்பெயர்க்கிறது.
- source_word: וְ/חֶבְרוֹן
  choice: எப்ரோன்
  rationale: இங்கு இடப்பெயர் அல்ல, ஒருவரின் பெயர். ח ஒலியை தமிழில் இயல்பாக ‘எ’ தொடக்கத்துடனும், בְ இன் இச்சூழல் ஒலியை ‘ப்’ ஆகவும் வழங்குகிறது.
- source_word: וְ/עֻזִּיאֵל
  choice: உசியேல்
  rationale: எபிரேயப் பெயரைத் தமிழில் வாசிக்க எளிதாகவும் மூல ஒலிக்கு நெருக்கமாகவும் எழுத்துப்பெயர்த்தது; பட்டியலின் இறுதி இணைப்பு தமிழின் காற்புள்ளி அமைப்பால் இயல்பாகத் தெரிவிக்கப்படுகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், வம்சப் பட்டியலுக்கேற்ற சுருக்கமான மற்றும் கண்ணியமான நடை. பெயர்கள் மூல எபிரேய ஒலியை முன்னிறுத்தி ஒரே மாதிரியான எழுத்துப்பெயர்ப்பில் வழங்கப்பட்டுள்ளன.
