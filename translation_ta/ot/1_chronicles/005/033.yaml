  yaml_path: translation/ot/1_chronicles/005/033.yaml
  text: Meraioth fathered Amariah, and Amariah fathered Ahitub.
translation:
  language: ta
  text: மெராயோத் அமரியாவுக்குத் தகப்பனானான்; அமரியா அகித்தூபுக்குத் தகப்பனானான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְרָיוֹת
  choice: மெராயோத்
  rationale: தனிப்பட்ட நபரின் பெயர் என்பதால் மொழிபெயர்க்காமல், எபிரெய உச்சரிப்பை நெருக்கமாகப் பின்பற்றி ஒலிபெயர்க்கப்பட்டது.
- source_word: הוֹלִיד
  choice: பெற்றான்
  rationale: வம்சவரலாற்றுச் சூழலில் இந்த ஹிஃபில் வடிவம் ஒருவன் மற்றொருவனுக்குத் தந்தையானதைக் குறிக்கிறது. ‘பெற்றான்’ என்பது தமிழில் சுருக்கமானதும் இயல்பானதும் வம்சப்பட்டியல்களுக்கு ஏற்றதுமான நடை.
- source_word: אֶת
  choice: '[தனியாக மொழிபெயர்க்கப்படவில்லை]'
  rationale: இது நேரடிச் செயப்படுபொருளைக் குறிக்கும் இலக்கண அடையாளம்; தமிழின் ‘-ஐ’ வேற்றுமை உருபில் அதன் பணி வெளிப்படுகிறது.
- source_word: אֲמַרְיָה
  choice: அமரியா
  rationale: தனிப்பட்ட நபரின் பெயர் என்பதால் எபிரெய வடிவத்துக்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டது.
- source_word: וַ/אֲמַרְיָה
  choice: அமரியா
  rationale: இணைப்பைக் காட்டும் வாவ், தமிழில் அரைப்புள்ளியால் இணைக்கப்பட்ட தொடர்ச்சியான வம்சவரலாற்று வாக்கிய அமைப்பில் இயல்பாக வெளிப்படுவதால் தனியே ‘மற்றும்’ என்று மொழிபெயர்க்கப்படவில்லை.
- source_word: הוֹלִיד
  choice: பெற்றான்
  rationale: மீண்டும் வரும் அதே வம்சவரலாற்று வினைச்சொல் தெளிவும் சொல் ஒருமைப்பாடும் காக்க ஒரேவிதமாக மொழிபெயர்க்கப்பட்டது.
- source_word: אֲחִיטוּב
  choice: அகித்தூப்
  rationale: தனிப்பட்ட நபரின் பெயர் என்பதால் மொழிபெயர்க்காமல், எபிரெய மெய்யொலிகளையும் நீண்ட உயிரொலியையும் நெருக்கமாகப் பிரதிபலிக்கும் வகையில் ஒலிபெயர்க்கப்பட்டது.
