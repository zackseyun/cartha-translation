- from: மெராயோத் அமரியாவைப் பெற்றான்; அமரியா அகித்தூபைப் பெற்றான்.
  to: மெராயோத் அமரியாவுக்குத் தகப்பனானான்; அமரியா அகித்தூபுக்குத் தகப்பனானான்.
  rationale: The revision retains the source’s compact two-generation genealogy, names, and coordination while replacing an ambiguous verb with a natural Tamil expression that explicitly conveys direct paternal descent.
