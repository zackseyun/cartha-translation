translation_notes:
  register: நவீனத் தரத் தமிழில், வம்சப்பட்டியலுக்குரிய சுருக்கத்தையும் கண்ணியமான நடையையும் காக்கும் மொழிபெயர்ப்பு. பெயர்கள் மூல எபிரெய வடிவங்களுக்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டுள்ளன; தேவையற்ற விளக்கவுரை சேர்க்கப்படவில்லை.
