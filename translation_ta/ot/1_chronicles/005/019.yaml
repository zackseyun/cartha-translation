  yaml_path: translation/ot/1_chronicles/005/019.yaml
  text: They made war against the Hagrites[a], Jetur, Naphish, and Nodab.
translation:
  language: ta
  text: அவர்கள் ஆகாரியர்களுக்கும் எத்தூர், நாபீஷ், நோதாப் என்பவர்களுக்கும் எதிராகப் போர் செய்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲשׂוּ מִלְחָמָה
  choice: போர் செய்தார்கள்
  rationale: எபிரெய மொழியில் சொற்படியாக ‘போரைச் செய்தார்கள்’ என அமைந்துள்ள மரபுத்தொடரை, அதன் பரந்த போர் நடவடிக்கைப் பொருளைத் தக்கவைத்து இயல்பான நவீனத் தமிழில் ‘போர் செய்தார்கள்’ என்று வழங்குகிறது.
- source_word: עִם
  choice: எதிராக
  rationale: இச்சொல் பொதுவாக ‘உடன்’ என்று பொருள்பட்டாலும், போர் செய்யும் சூழலில் எதிர்நிலைப் பொருளைத் தருவதால் ‘எதிராக’ என்பது தெளிவான இயல்பான தேர்வு.
- source_word: הַגְרִיאִים
  choice: ஆகாரியர்கள்
  rationale: இது ஓர் இனக்குழுவின் பெயர். எபிரெய வடிவுடன் தொடர்புடையதாகத் தமிழில் வழக்கமாகப் பயன்படுத்தப்படும் ‘ஆகாரியர்கள்’ என்ற ஒலிபெயர்ப்பு தேர்ந்தெடுக்கப்பட்டது; பெயரிலுள்ள எபிரெய திட்டவுருபின் கூட்டுப்பொருளும் பன்மையும் இதில் வெளிப்படுகின்றன.
- source_word: וִיטוּר
  choice: எத்தூர்
  rationale: தனிப்பெயர் நவீனத் தமிழில் வாசிக்க ஏற்ற வேதாகம ஒலிபெயர்ப்பு மரபின்படி வழங்கப்பட்டது.
- source_word: וְנָפִישׁ
  choice: நாபீஷ்
  rationale: தனிப்பெயர் அதன் எபிரெய ஒலிவடிவத்தை அணுகும் வகையில் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: וְנוֹדָב
  choice: நோதாப்
  rationale: தனிப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டு, பட்டியலின் இணைப்பு அமைப்பு ‘ஆகியோருக்கும்’ என்பதால் இயல்பாக வெளிப்படுத்தப்பட்டது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெயப் போர் மரபுத்தொடர் தமிழில் இயல்பாக வழங்கப்பட்டுள்ளது; இனப்பெயர் மற்றும் தனிப்பெயர்கள் மொழிபெயர்க்கப்படாமல் ஒலிபெயர்க்கப்பட்டுள்ளன.
