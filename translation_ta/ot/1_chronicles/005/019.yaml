  source_fidelity: போர்ச் சூழலில் עִם என்பதற்கு ‘எதிராக’ என்பதும், עשה מלחמה என்பதற்கு ‘போர் செய்தார்கள்’ என்பதும் பொருத்தமானவை. ஆனால் הַגְרִיאִים என்பதற்கான அடிக்குறிப்பில் தரப்பட்டுள்ள மாற்று ஒலிபெயர்ப்பு எபிரெய வடிவத்தையோ ஆங்கில ஆய்வுத் தடத்திலுள்ள ‘Hagrites/Hagarites’ மாற்றையோ துல்லியமாகப் பிரதிபலிக்கவில்லை.
  naturalness: வாக்கியம் இயல்பாக உள்ளது. பட்டியலில் வரும் பெயர்களை ஒரே எதிர்ப்பொருளாகக் காட்ட ‘என்பவர்களுக்கு எதிராக’ என்பது தெளிவான, நவீன நடையாகும்.
