id: 1CH.5.2
reference: 1 Chronicles 5:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: כִּ֤י יְהוּדָה֙ גָּבַ֣ר בְּ/אֶחָ֔י/ו וּ/לְ/נָגִ֖יד מִמֶּ֑/נּוּ וְ/הַ/בְּכֹרָ֖ה לְ/יוֹסֵֽף׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/002.yaml
  text: For Judah prevailed over his brothers[a], and from him came the ruler, though the birthright belonged to Joseph.
translation:
  language: ta
  text: ஏனெனில், யூதா தன் சகோதரர்களைவிட வலிமை பெற்றான்; அவனிடமிருந்து ஒரு தலைவர்[a] வந்தார். ஆனால் முதற்பேற்றுரிமை யோசேப்புக்கு உரியதாக இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆட்சியாளர்” அல்லது “அதிபர்.”
    reason: נָגִיד என்ற சொல்லுக்குத் தலைவர், ஆட்சியாளர், அதிபர் ஆகிய பொருள் வாய்ப்புகள் உள்ளன.
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்தில் ரூபேன் முதற்பேற்றுரிமையை இழந்தது பற்றிய கூற்றுக்கான விளக்கத்தை அறிமுகப்படுத்துகிறது.
- source_word: יְהוּדָה
  choice: யூதா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள பெயர்வடிவம்.
- source_word: גָּבַר בְּאֶחָיו
  choice: தன் சகோதரர்களைவிட வலிமை பெற்றான்
  rationale: גבר என்பதன் வலிமைபெறுதல் அல்லது மேலோங்குதல் என்ற பொருளையும், בְּ உடன் வரும் ஒப்பீட்டு உறவையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וּלְנָגִיד מִמֶּנּוּ
  choice: அவனிடமிருந்து ஒரு தலைவர் வந்தார்
  rationale: נָגִיד என்பது தலைவர், ஆட்சியாளர் அல்லது அதிபர் எனப் பொருள்படலாம்; מִמֶּנּוּ யூதாவைச் சுட்டும் ஒருமைச் சொல். வம்சத்திலிருந்து தலைவர் தோன்றியதை இயல்பாகக் கூறுகிறது.
- source_word: וְהַבְּכֹרָה לְיוֹסֵף
  choice: ஆனால் முதற்பேற்றுரிமை யோசேப்புக்கு உரியதாக இருந்தது
  rationale: בְּכֹרָה என்பது முதற்பிறந்தவனுக்குரிய உரிமை அல்லது நிலை. இணைப்புச்சொல் இங்கு யூதாவின் மேலாதிக்கத்துக்கும் யோசேப்பின் முதற்பேற்றுரிமைக்கும் இடையிலான வேறுபாட்டைக் காட்டுவதால் ‘ஆனால்’ பயன்படுத்தப்பட்டது.
theological_decisions:
- issue: யூதாவின் மேலாதிக்கத்துக்கும் யோசேப்பின் முதற்பேற்றுரிமைக்கும் உள்ள உறவு
  choice: யூதாவுக்கு வலிமையும் தலைமை மரபும் இருந்ததாகவும், முதற்பேற்றுரிமை யோசேப்புக்கு இருந்ததாகவும் தனித்தனியாகக் கூறப்பட்டுள்ளது.
  alternative: யூதா மிகவும் வலிமையானவனானான்; யோசேப்பு வாரிசுரிமை சார்ந்த சில சலுகைகளை மட்டும் பெற்றான் என்று பொதுவாகப் புரிந்துகொள்ளலாம்.
  rationale: எபிரெய உரை யூதாவின் மேலோங்குதலையும் அவனிடமிருந்து நָגִיד தோன்றுவதையும், யோசேப்புக்குரிய בְּכֹרָה-வையும் அருகருகே வைத்துப் பிரித்துக் காட்டுகிறது. மொழிபெயர்ப்பு இவ்விரண்டையும் ஒன்றாக்காமல் அந்த இறையியல் இழுவிசையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ். ‘முதற்பேற்றுரிமை’ என்பது சூழலுக்கேற்ற துல்லியமான மரபுச் சொல்; ‘வலிமை பெற்றான்’ மூலத்தின் பொருளை அளவுக்கு மீறாமல் காக்கிறது.
