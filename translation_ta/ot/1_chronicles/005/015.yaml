  naturalness: திருத்திய உரை நவீன, கண்ணியமான தமிழில் இயல்பாக உள்ளது. ‘கூனியின் மகனான அப்தியேலின் மகன்’ என்ற தொடர் வம்சவரிசையைத் தெளிவாகவும் தவறான இணைப்பின்றியும் தெரிவிக்கிறது.
