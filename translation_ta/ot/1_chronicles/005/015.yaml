  text: אֲחִי֙ בֶּן עַבְדִּיאֵ֣ל בֶּן גּוּנִ֔י רֹ֖אשׁ לְ/בֵ֥ית אֲבוֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/015.yaml
  text: Ahi son of Abdiel[a], son of Guni, was head of their fathers’ houses.
translation:
  language: ta
  text: கூனியின் மகனான அப்தியேலின் மகன் அகி, அவர்களுடைய தந்தையர் குடும்பங்களுக்குத் தலைவராக இருந்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு மொழிபெயர்ப்பு: “அவர்களுடைய மூதாதையர் குடும்பங்களுக்குத் தலைவர்” அல்லது “அவர்களுடைய குடும்பக் குலங்களுக்குத் தலைவர்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲחִי
  choice: அகி
  rationale: தனிப்பட்ட பெயர்; எபிரெய ஒலிப்பை நவீனத் தமிழில் இயல்பாக ஒலிபெயர்த்துள்ளது.
- source_word: בֶּן עַבְדִּיאֵל בֶּן גּוּנִי
  choice: அப்தியேலின் மகனும் கூனியின் பேரனுமான
  rationale: தொடர்ச்சியான வம்சவரிசையில் முதல் בֶּן என்பதற்கு ‘மகன்’, அடுத்ததற்கு இயல்பான தமிழில் ‘பேரன்’ என வழங்கப்பட்டுள்ளது; இது அகி—அப்தியேல்—கூனி என்ற உறவைத் தெளிவாகக் காட்டுகிறது.
- source_word: רֹאשׁ
  choice: தலைவர்
  rationale: ‘தலை/முதன்மையானவர்’ என்ற உருவகத்தையும் நிர்வாக அல்லது குலத் தலைமைப் பொருளையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: לְבֵית אֲבוֹתָם
  choice: அவர்களுடைய தந்தைவழிக் குடும்பங்களுக்கு
  rationale: சொல்லடியாக ‘அவர்களுடைய தந்தையரின் வீடு’; இங்கு தந்தைவழி மூதாதையர் அடிப்படையிலான குடும்ப அல்லது குலப் பிரிவுகளைக் குறிக்கும் மரபுத்தொடராகப் புரிந்துகொள்ளப்பட்டுள்ளது.
