  text: Chelub[a], the brother of Shuhah, fathered Mehir; he was the father of Eshton.
translation:
  language: ta
  text: ஷூஹாவின் சகோதரனான கெலூப், மெஹீரைப் பெற்றான்; அவன் எஷ்தோனின் தந்தை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எஷ்தோனின் மூதாதை அல்லது நிறுவியவர்.” வம்சப்பட்டியல்களில் “தந்தை” என்பது சில நேரங்களில் நேரடி உயிரியல் தந்தையைக் குறிக்காமல், ஒரு குலத்தின் மூதாதையையோ ஒரு குடியிருப்பின் நிறுவனரையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/כְלוּב
  choice: கெலூப்
  rationale: இது ஒரு தனிப்பெயர் என்பதால் மொழிபெயர்க்காமல், எபிரெய ஒலிப்புக்கு நெருக்கமாக எழுத்துப்பெயர்க்கப்பட்டது. தொடக்க இணைப்புச்சொல் வாவ், தொடர்ச்சியான வம்சப்பட்டியல் நடையில் தமிழில் தனியாகக் காட்டப்பட வேண்டியதில்லை.
- source_word: אֲחִי שׁוּחָה
  choice: சூகாவின் சகோதரனான
  rationale: எபிரெய இணைப்புநிலையின் உறவுமுறையைத் தெளிவாகவும் இயல்பான தமிழிலும் தருகிறது.
- source_word: הוֹלִיד
  choice: பெற்றான்
  rationale: வம்சவரலாற்றுச் சூழலில் ஹிஃபில் வடிவம் ஒருவரைப் பிறப்பித்தல் அல்லது அவருக்குத் தந்தையாக இருத்தலைக் குறிக்கிறது. ‘பெற்றான்’ என்பது சுருக்கமான, இயல்பான தமிழ் மரபுவழிப் பயன்பாடு.
- source_word: מְחִיר
  choice: மெகீர்
  rationale: தனிப்பெயர் என்பதால் எபிரெய உச்சரிப்புக்கு நெருக்கமாக எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: הוּא
  choice: அவன்
  rationale: தனி ஆண்பால் சுட்டுப்பெயரின் வெளிப்படையான மீள்குறிப்பைப் பாதுகாக்கிறது; இங்கு மெகீரையே குறிக்கிறது.
- source_word: אֲבִי
  choice: தந்தை
  rationale: அடிப்படை உறவுமுறைப் பொருளை நேரடியாகத் தருகிறது; வம்சப்பட்டியல்களில் இருக்கக்கூடிய ‘மூதாதை/நிறுவியவர்’ என்ற விரிவான பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: אֶשְׁתּוֹן
  choice: எஷ்தோன்
  rationale: தனிப்பெயர் என்பதால் எபிரெய உச்சரிப்புக்கு நெருக்கமாக எழுத்துப்பெயர்க்கப்பட்டது.
