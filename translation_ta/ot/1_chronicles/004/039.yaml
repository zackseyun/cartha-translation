base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/039.yaml
  text: They went to the entrance of Gedor[a], as far as the east side of the valley[b], to seek pasture for their flocks.
translation:
  language: ta
  text: அவர்கள் தங்கள் மந்தைகளுக்கான மேய்ச்சல் நிலத்தைத் தேடுவதற்காக, கேதோரின் நுழைவிடத்திற்குப் பள்ளத்தாக்கின் கிழக்குப் பகுதி வரை சென்றார்கள்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கேதோரை அணுகும் இடம்’; எபிரெயச் சொல் நுழைவிடம், அணுகுமிடம், அல்லது உள்ளே செல்லும் இடத்தைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘பள்ளத்தாக்குக்குக் கிழக்கே’ அல்லது ‘பள்ளத்தாக்கின் கிழக்கை நோக்கி’; எபிரெயத் தொடர் சுருக்கமான நிலவியல் குறிப்பாக உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: சென்றார்கள்
  rationale: הלך என்பதன் தொடர்கதை வடிவம் அடுத்த நிகழ்வைச் சுட்டுகிறது; இயல்பான தமிழ் நடையில் ‘சென்றார்கள்’ பொருத்தமானது.
- source_word: לִמְבוֹא
  choice: நுழைவிடம்
  rationale: מָבוֹא என்பது நுழைவிடம், அணுகுமிடம், அல்லது உள்ளே செல்லும் பகுதி எனப் பொருள்படலாம்; முதன்மை உரையில் இடஞ்சார்ந்த பொருளைச் சுருக்கமாகத் தருகிறது.
- source_word: גְדֹר
  choice: கேதோர்
  rationale: இது ஓர் இடப்பெயர்; எபிரெய ஒலிப்புக்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: עַד
  choice: வரை
  rationale: இங்கு கால அளவை அல்ல, இடத்தின் எல்லையைச் சுட்டுகிறது.
- source_word: לְמִזְרַח הַגָּיְא
  choice: பள்ளத்தாக்கின் கிழக்குப் பகுதி
  rationale: சுருக்கமான எபிரெய நிலவியல் தொடரை இயல்பான தமிழில் தருகிறது; துல்லியமான தொடர்பில் உள்ள தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: לְבַקֵּשׁ
  choice: தேடி
  rationale: בקש நோக்கத்தைத் தெரிவிக்கிறது; தமிழில் ‘தேடி ... சென்றார்கள்’ இயல்பாக நோக்கத்தை வெளிப்படுத்துகிறது.
- source_word: מִרְעֶה
  choice: மேய்ச்சல் நிலம்
  rationale: கால்நடைகள் மேயும் இடத்தைக் குறிக்கும்; நவீன தமிழில் தெளிவான சொற்றொடர்.
- source_word: לְצֹאנָם
  choice: தங்கள் மந்தைகளுக்கு
  rationale: צֹאן செம்மறியாடுகளையும் வெள்ளாடுகளையும் கூட்டாகக் குறிக்கக்கூடும்; ‘மந்தைகள்’ இனத்தைத் தேவையின்றிக் குறுக்காமல் கூட்டுப் பொருளைப் பாதுகாக்கிறது.
