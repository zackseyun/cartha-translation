base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/036.yaml
  text: and Elioenai, and Jaakobah, and Jeshohaiah, and Asaiah, and Adiel, and Jesimiel, and Benaiah.
translation:
  language: ta
  text: எலியோவேனாயும், யாக்கோபாவும், யெசோகாயாவும், அசாயாவும், அதியேலும், யெசிமியேலும், பெனாயாவும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶלְיוֹעֵינַי
  choice: எலியோவேனாய்
  rationale: எபிரேய ஆள்பெயரை மொழிபெயர்க்காமல், அதன் ஒலிவடிவத்தைத் தமிழில் இயல்பாக எழுத்துப்பெயர்த்துள்ளது.
- source_word: יַעֲקֹבָה
  choice: யாக்கோபா
  rationale: எபிரேய மெய்யெழுத்து மற்றும் உயிரொலி அமைப்பைத் தெளிவாகப் பிரதிபலிக்கும் தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: יְשׁוֹחָיָה
  choice: யெசோகாயா
  rationale: שׁ ஒலியை ‘ச’ என்றும், பெயரின் இறுதிப் பகுதியை ‘காயா’ என்றும் எழுத்துப்பெயர்த்து, மூல ஒலியமைப்பை இயன்றவரை காத்துள்ளது.
- source_word: עֲשָׂיָה
  choice: அசாயா
  rationale: ஆள்பெயரைப் பொருளாக்காமல், தமிழில் வாசிக்க எளிதான முறையில் எபிரேய ஒலிக்கு நெருக்கமாக எழுத்துப்பெயர்த்துள்ளது.
- source_word: עֲדִיאֵל
  choice: அதியேல்
  rationale: ע தொடக்க ஒலிக்கு இயல்பான தமிழ் உயிரெழுத்தைப் பயன்படுத்தி, -אֵל பகுதியை ‘ஏல்’ எனப் பாதுகாத்துள்ளது.
- source_word: יְשִׂימִיאֵל
  choice: யெசிமியேல்
  rationale: பெயரின் ஒலிக்கூறுகளைத் தமிழில் தெளிவாகக் காட்டி, இறுதியிலுள்ள -אֵל பகுதியை ‘ஏல்’ என எழுத்துப்பெயர்த்துள்ளது.
- source_word: בְּנָיָה
  choice: பெனாயா
  rationale: எபிரேய ஆள்பெயரின் ஒலிவடிவத்தைத் தமிழில் எளிதாக வாசிக்கக்கூடிய எழுத்துப்பெயர்ப்பாக வழங்குகிறது.
- source_word: וְ / וַ / וִ / וּ
  choice: -உம்
  rationale: ஒவ்வொரு பெயருக்கும் முன் வரும் எபிரேய வாவ் இணைப்பை, பட்டியலின் தொடர்ச்சியான இணைப்பு நடையைப் பாதுகாக்கும் இயல்பான தமிழ் ‘-உம்’ விகுதியால் காட்டியுள்ளது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதைமிக்கவும் எளிதில் வாசிக்கக்கூடியதாகவும் அமைக்கப்பட்டது. இது பெயர்ப் பட்டியல் என்பதால் மூலத்தின் ஒவ்வொரு இணைப்புச் சொல்லும் தமிழ் ‘-உம்’ வடிவில் பாதுகாக்கப்பட்டுள்ளது; பெயர்கள் நேரடியாக எபிரேயத்திலிருந்து எழுத்துப்பெயர்க்கப்பட்டுள்ளன.
