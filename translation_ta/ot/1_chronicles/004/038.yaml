  register: நவீன நிலையான தமிழ்; வம்சப் பட்டியல் சூழலுக்கேற்ற கண்ணியமான, எளிதில் புரியும் நடை. ‘தந்தைவழிக் குடும்பங்கள்’ என்பது பழங்கால சமூக அலகைத் தெளிவாக்குகிறது; அடிக்குறிப்புகள் எபிரெய மூலத்தின் நேரடி உருவகத்தையும் மெய்யான சொற்பொருள் ஐயத்தையும் பாதுகாக்கின்றன.
