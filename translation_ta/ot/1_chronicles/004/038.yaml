  edition: WLC
  text: אֵ֚לֶּה הַ/בָּאִ֣ים בְּ/שֵׁמ֔וֹת נְשִׂיאִ֖ים בְּ/מִשְׁפְּחוֹתָ֑/ם וּ/בֵית֙ אֲב֣וֹתֵי/הֶ֔ם פָּרְצ֖וּ לָ/רֽוֹב׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/038.yaml
  text: These[a], who were mentioned by name, were leaders in their clans[b], and their ancestral houses increased greatly.
translation:
  language: ta
  text: பெயர் குறிப்பிட்டுச் சொல்லப்பட்ட இவர்கள்[a] தங்கள் குலங்களில் தலைவர்களாக இருந்தார்கள்; அவர்களுடைய தந்தைவழிக் குடும்பங்கள் மிகுதியாகப் பெருகின.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பெயர்களோடு வந்த இவர்கள்.” எபிரெயச் சொல் நேரடியாக “வருகிறவர்கள்” என்று பொருள்படும்; ஆனால் இங்கு வம்சப் பதிவில் பெயரால் குறிப்பிடப்பட்டவர்களைக் குறிப்பதாக இருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: நேரடியாக, “அவர்களுடைய தந்தையரின் வீடுகள் மிகுதியாகப் பரவின.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: இவர்கள்
  rationale: முந்தைய வம்சப் பட்டியலில் பெயரிடப்பட்ட ஆட்களைக் குறிக்கும் பன்மைச் சுட்டுப்பெயர்; தமிழில் மனிதர்களைக் குறிக்க இயல்பான வடிவம்.
- source_word: הַבָּאִים בְּשֵׁמוֹת
  choice: பெயர் பெயராகப் பதிவுசெய்யப்பட்ட
  rationale: בוא என்பதன் நேரடிப் பொருள் ‘வருதல்’ என்றாலும், பெயர்ப்பட்டியல் சூழலில் இச்சொற்றொடர் பெயரால் பதிவு செய்யப்பட்டவர்களைக் குறிப்பதாகத் தெரிகிறது; ‘பெயர் பெயராக’ தனித்தனியாகப் பெயரிடப்பட்டதைக் காட்டுகிறது.
- source_word: נְשִׂיאִים
  choice: தலைவர்கள்
  rationale: குல அல்லது இனக்குழுவில் உயர்ந்த பொறுப்புடையவர்களைக் குறிக்கிறது; அரச மரபைத் தேவையின்றி உணர்த்தும் ‘இளவரசர்கள்’ என்பதற்குப் பதிலாகப் பொதுவான, இயல்பான சொல்.
- source_word: בְּמִשְׁפְּחוֹתָם
  choice: தங்கள் குலங்களில்
  rationale: இங்கு מִשְׁפָּחָה தற்கால அணுக்குடும்பத்தைவிட விரிவான உறவுக் குழுவைக் குறிக்கிறது; ‘குலங்கள்’ அந்த வம்சவழி சமூக அலகைத் தெளிவாகச் சொல்கிறது.
- source_word: וּבֵית אֲבוֹתֵיהֶם
  choice: இவர்களுடைய தந்தைவழிக் குடும்பங்கள்
  rationale: சொல்லெழுத்தாக ‘அவர்களுடைய தந்தையரின் வீடுகள்’; இங்கு தந்தைவழி வம்சக் குடும்ப அலகுகளைக் குறிக்கிறது. நவீன தமிழில் பொருள் தெளிவாக இருக்க இவ்வாறு வழங்கப்பட்டது.
- source_word: פָּרְצוּ לָרֹב
  choice: மிகுதியாகப் பெருகின
  rationale: פָּרַץ என்பதில் எல்லை மீறிப் பரவுதல் அல்லது தழைத்துப் பெருகுதல் என்ற வலிமையான நிழற்பொருள் உள்ளது; לָרֹב அதன் மிகுதியை, குறிப்பாக எண்ணிக்கை வளர்ச்சியை, வலியுறுத்துகிறது.
