base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/017.yaml
  text: 'The sons of Ezrah: Jether[a], Mered, Epher, and Jalon; and she conceived Miriam, Shammai, and Ishbah[c][b], the father of Eshtemoa.'
translation:
  language: ta
  text: 'எஸ்ராவின் மகன்கள்[a]: யெத்தேர், மெரேத், ஏப்பேர், யாலோன். அவள்[b] மிரியாம், ஷம்மாய், எஷ்டெமோவாவின் தந்தையான யிஷ்பாக்[c] ஆகியோரைத் தன் கருவில் கொண்டாள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்சொல்லாக, “எஸ்ராவின் மகன்.” தொடர்ந்து பல பெயர்கள் வருவதால், இங்கே அது பொதுவாக “எஸ்ராவின் மகன்கள்” என்று புரிந்துகொள்ளப்படுகிறது.
    reason: textual_variant
  - marker: b
    text: எபிரெயம் “அவள் கருவுற்றாள்” என்று மட்டுமே கூறுகிறது; இந்தக் கூற்றில் அந்தப் பெண் யார் என்பது குறிப்பிடப்படவில்லை.
    reason: lexical_alternative
  - marker: c
    text: எஷ்டெமோவா ஒரு குலம் அல்லது குடியிருப்பைக் குறித்தால், “எஷ்டெமோவாவை நிறுவியவர்” என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֶן
  choice: எஸ்ராவின் மகன்கள்
  rationale: எபிரெய வடிவம் ஒருமையில் ‘மகன்’ என்று இருந்தாலும், தொடர்ந்து பல பெயர்கள் வருவதால் இதை வம்சப்பட்டியல் தலைப்பாகப் பன்மையில் மொழிபெயர்த்தோம்; சொற்சார்ந்த ஒருமை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: עֶזְרָה
  choice: எஸ்ரா
  rationale: தனிப்பெயர்; நவீனத் தமிழில் இயல்பான ஒலிபெயர்ப்பு.
- source_word: יֶתֶר
  choice: ஏத்தேர்
  rationale: தனிப்பெயர்; எபிரெய உச்சரிப்பை அணுகிய தமிழ் ஒலிபெயர்ப்பு.
- source_word: וּמֶרֶד
  choice: மேரேத்
  rationale: தனிப்பெயர்; எபிரெய உச்சரிப்பை அணுகிய தமிழ் ஒலிபெயர்ப்பு.
- source_word: וְעֵפֶר
  choice: ஏப்பேர்
  rationale: தனிப்பெயர்; எபிரெய உச்சரிப்பை அணுகிய தமிழ் ஒலிபெயர்ப்பு.
- source_word: וְיָלוֹן
  choice: யாலோன்
  rationale: தனிப்பெயர்; எபிரெய உச்சரிப்பை அணுகிய தமிழ் ஒலிபெயர்ப்பு.
- source_word: וַתַּהַר
  choice: அவள் கருவுற்றாள்
  rationale: הרה என்பதன் நேரடிப் பொருள் ‘கருவுறுதல்’. பெண்பால் ஒருமை எழுவாய் மூலத்தில் பெயரிடப்படாததால், பெயரைச் சேர்க்காமல் ‘அவள்’ என அதன் தெளிவின்மையைப் பாதுகாத்தோம்.
- source_word: מִרְיָם
  choice: மிரியாம்
  rationale: தனிப்பெயர்; இங்கு வம்சப்பட்டியலில் உள்ளபடியே ஒலிபெயர்க்கப்பட்டது.
- source_word: שַׁמַּי
  choice: சம்மாய்
  rationale: தனிப்பெயர்; தமிழ் ஒலியமைப்புக்கு ஏற்ற ஒலிபெயர்ப்பு.
- source_word: יִשְׁבָּח
  choice: இஸ்பாக்
  rationale: தனிப்பெயர்; இறுதி எபிரெய உரசொலியைத் தமிழில் ‘க்’ மூலம் அணுகிய ஒலிபெயர்ப்பு.
- source_word: אֲבִי אֶשְׁתְּמֹעַ
  choice: எஸ்தெமோவாவின் தந்தையான
  rationale: வம்சப்பட்டியல் சூழலில் אָב என்பதன் வெளிப்படையான பொருளான ‘தந்தை’ முதன்மை உரையில் வைக்கப்பட்டது; குலம் அல்லது குடியிருப்பைச் சுட்டினால் ‘நிறுவியவர்’ என்ற வாய்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
