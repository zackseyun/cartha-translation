translation:
  language: ta
  text: பெத்துவேலிலும், ஓர்மாவிலும், சிக்லாகிலும் குடியிருந்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בִ/בְתוּאֵל
  choice: பெத்துவேலிலும்
  rationale: וּ தொடரும் பட்டியலை இணைக்கும் ‘-உம்’ விகுதியாலும், בְ இடத்தைக் குறிக்கும் ‘-இல்’ விகுதியாலும் இயல்பான தமிழில் வெளிப்படுத்தப்பட்டுள்ளது. בְתוּאֵל என்பது ஊர்ப்பெயர் என்பதால் ‘பெத்துவேல்’ என ஒலிபெயர்க்கப்பட்டது.
- source_word: וּ/בְ/חָרְמָה
  choice: ஓர்மாவிலும்
  rationale: முந்தைய இடப்பெயரின் அதே וּ + בְ பட்டியல் அமைப்பு ‘-இலும்’ எனத் தக்கவைக்கப்பட்டுள்ளது. חָרְמָה என்பது ஊர்ப்பெயர் என்பதால் எபிரேய உச்சரிப்புக்கு நெருக்கமாக ‘ஓர்மா’ என ஒலிபெயர்க்கப்பட்டது.
- source_word: וּ/בְ/צִֽיקְלָג
  choice: சிக்லாகிலும்
  rationale: וּ + בְ என்பதன் இணைப்பு மற்றும் இடப்பொருள் ‘-இலும்’ மூலம் வெளிப்படுத்தப்பட்டுள்ளது. צִיקְלָג என்ற ஊர்ப்பெயர் ‘சிக்லாக்’ என ஒலிபெயர்க்கப்பட்டு, வேற்றுமை உருபு சேரும்போது ‘சிக்லாகிலும்’ என அமைக்கப்பட்டது.
- source_word: '[ellipsis from preceding verse/list syntax]'
  choice: குடியிருந்தார்கள்
  rationale: எபிரேய உரை தனித்த வினைச்சொல் இல்லாத தொடர்ச்சியான குடியிருப்புப் பட்டியல். தமிழில் வசனத்தை இயல்பாகவும் முழுமையாகவும் வாசிக்க, முந்தைய சூழலில் உள்ள குடியிருத்தல் கருத்து வெளிப்படையாக நிரப்பப்பட்டுள்ளது.
theological_decisions: []
translation_notes:
  register: நவீன பொதுத்தமிழில், கண்ணியமான பட்டியல் நடையுடன் மொழிபெயர்க்கப்பட்டது. எபிரேயத்தின் மீளும் இணைப்பு அமைப்பு ஒவ்வொரு இடப்பெயரிலும் ‘-இலும்’ எனப் பாதுகாக்கப்பட்டுள்ளது; தனித்து மேற்கோள் காட்டப்படும் வசனம் தமிழில் முழுமையாக அமைய ‘குடியிருந்தார்கள்’ சேர்க்கப்பட்டுள்ளது.
