source:
  edition: WLC
  text: וַֽ/יִּמְצְא֤וּ מִרְעֶה֙ שָׁמֵ֣ן וָ/ט֔וֹב וְ/הָ/אָ֨רֶץ֙ רַחֲבַ֣ת יָדַ֔יִם וְ/שֹׁקֶ֖טֶת וּ/שְׁלֵוָ֑ה כִּ֣י מִן חָ֔ם הַ/יֹּשְׁבִ֥ים שָׁ֖ם לְ/פָנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/040.yaml
  text: And they found rich and good pasture[a], and the land was broad, quiet, and peaceful, for those from Ham who had lived there formerly were there before.
translation:
  language: ta
  text: அவர்கள் செழிப்பானதும் நல்லதுமான மேய்ச்சல் நிலத்தைக் கண்டார்கள். அந்த நிலம் விசாலமாகவும் அமைதியாகவும் நிம்மதியாகவும் இருந்தது; ஏனெனில் முன்பு அங்கே குடியிருந்தவர்கள் காமின் வழிவந்தவர்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “முன்பு அங்கே குடியிருந்தோர் காமிலிருந்து வந்தவர்கள்.”
    reason: எபிரெயில் ‘வழிவந்தவர்கள்’ என்ற தனிச்சொல் இல்லை; מִן חָם என்பதன் சுருக்கமான ‘காமிலிருந்து’ என்ற வெளிப்பாட்டைத் தக்கவைக்கும் மாற்று.
lexical_decisions:
- source_word: מִרְעֶה
  choice: மேய்ச்சல் நிலம்
  rationale: ஆடுமாடுகள் மேய்வதற்கான இடத்தைக் குறிக்கும் பெயர்ச்சொல்; சூழலுக்கேற்ற இயல்பான தமிழ்ச் சொற்றொடர்.
- source_word: שָׁמֵן וָטוֹב
  choice: செழிப்பான நல்ல
  rationale: שָׁמֵן என்பதன் நேர்ப்பொருள் ‘கொழுத்த’ என்றாலும், மேய்ச்சல் நிலத்தைப் பற்றிய இச்சூழலில் வளமும் செழுமையும் குறிக்கிறது; טוֹב என்பதன் எளிய மதிப்பீட்டு வலிமையை ‘நல்ல’ தக்கவைக்கிறது.
- source_word: רַחֲבַת יָדַיִם
  choice: விசாலமாக
  rationale: சொல்லுக்குச் சொல் ‘இரு கைகளிலும் அகன்ற’ என்ற எபிரெய மரபுத்தொடர், பரந்த அல்லது இடவசதி நிறைந்த நிலத்தைக் குறிக்கிறது.
- source_word: שֹׁקֶטֶת
  choice: அமைதியாக
  rationale: தொந்தரவின்றி அடங்கியிருக்கும் நிலையை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: שְׁלֵוָה
  choice: நிம்மதியாக
  rationale: பாதுகாப்பு, சாந்தம், கவலையற்ற நிலை ஆகிய பொருள் வாய்ப்புகளில், שֹׁקֶטֶת உடன் இணையும் இச்சூழலில் ‘நிம்மதியாக’ பொருத்தமானது; பொருளாதாரச் செழிப்பை தேவையின்றிச் சேர்ப்பதில்லை.
- source_word: כִּי מִן חָם הַיֹּשְׁבִים שָׁם לְפָנִים
  choice: ஏனெனில் முன்பு அங்கே குடியிருந்தவர்கள் காமின் வழிவந்தவர்கள்
  rationale: எபிரெயச் சொல் வரிசை சற்றுக் குறுகியதாக இருந்தாலும், முந்தைய குடியிருப்போர் காமைச் சேர்ந்தவர்கள் என்பதே அதன் இயல்பான தொடரியல். ‘வழிவந்தவர்கள்’ என்பது מן חם குறிக்கும் வம்ச அல்லது இனத் தொடர்பைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: חָם
  choice: காம்
  rationale: வேதாகமப் பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
theological_decisions:
- issue: முந்தைய குடியிருப்போருக்கும் காமுக்கும் உள்ள தொடர்பு
  choice: காமின் வழிவந்தவர்கள்
  alternative: காமைச் சேர்ந்தவர்கள்
  rationale: மூலத்தில் ‘சந்ததியினர்’ என்ற தனிச்சொல் இல்லாதபோதிலும், מִן חָם என்பது இங்கு காமிலிருந்து வந்த இன அல்லது வம்சத் தொடர்பைக் குறிக்கிறது. முதன்மை உரை இயல்பான தமிழில் இதை வெளிப்படுத்துகிறது; அடிக்குறிப்பு மூலத்தின் சுருக்கத்தைத் தக்கவைக்கும் மாற்றை வழங்குகிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழ்; எளிதில் புரியும், ஆனால் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடை. இணையான மூன்று பண்புகளும் ‘விசாலமாகவும் அமைதியாகவும் நிம்மதியாகவும்’ எனத் தக்கவைக்கப்பட்டுள்ளன.
