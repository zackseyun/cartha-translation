source:
  edition: WLC
  text: וּ/לְ/אַשְׁחוּר֙ אֲבִ֣י תְק֔וֹעַ הָי֖וּ שְׁתֵּ֣י נָשִׁ֑ים חֶלְאָ֖ה וְ/נַעֲרָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/005.yaml
  text: 'Ashhur the father of Tekoa had two wives: Helah and Naarah[a].'
translation:
  language: ta
  text: 'தெக்கோவாவின் தந்தையான அஷ்ஹூருக்கு இரண்டு மனைவிகள் இருந்தார்கள்: ஹெலா, நாரா[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தெக்கோவாவின் நிறுவனர்’ அல்லது ‘தெக்கோவாவின் முன்னோர்’ என்றும் பொருள் கொள்ளலாம். வம்சவரலாறுகளில் ‘தந்தை’ என்பது உடனடி உயிரியல் தந்தையை மட்டுமல்லாமல், ஒரு குலத்தின் அல்லது குடியிருப்பின் நிறுவனரையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְאַשְׁחוּר
  choice: அஸ்கூருக்கு
  rationale: பெயருடன் இணைந்துள்ள முன்னிடைச்சொல், உடைமைப் பொருளைக் காட்டும் எபிரெய இருப்புக் கட்டமைப்பின் பகுதியாகத் தமிழில் இயல்பாக ‘அஸ்கூருக்கு’ என வழங்கப்படுகிறது; தொடக்க இணைப்புச்சொல்லைத் தனியே மொழிபெயர்ப்பது தமிழில் தேவையற்ற கடினத்தன்மையை உண்டாக்கும்.
- source_word: אֲבִי תְקוֹעַ
  choice: தெக்கோவாவின் தந்தையான
  rationale: אָב என்பதன் நேரடியான பொருளான ‘தந்தை’ தக்கவைக்கப்படுகிறது. வம்சவரலாற்றுச் சூழலில் அது முன்னோர் அல்லது ஒரு குடியிருப்பின் நிறுவனர் என்ற விரிந்த பொருளையும் கொள்ளக்கூடும்; இதை அடிக்குறிப்பு குறிப்பிடுகிறது.
- source_word: הָיוּ
  choice: இருந்தார்கள்
  rationale: எபிரெயத்தில் ‘இருந்தனர்’ என்ற இருப்புவினை உள்ளது. ‘அஸ்கூருக்கு ... மனைவிகள் இருந்தார்கள்’ என்பது அதே உடைமைப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: שְׁתֵּי נָשִׁים
  choice: இரண்டு மனைவிகள்
  rationale: வம்சவரலாற்றில் ஒருவருடன் தொடர்புபடுத்தப்பட்டு பெண்களின் பெயர்கள் தரப்படுவதால், נָשִׁים என்பது பொதுவாக ‘பெண்கள்’ என்பதல்ல, ‘மனைவிகள்’ என்பதே சூழலுக்குத் துல்லியமானது.
- source_word: חֶלְאָה
  choice: ஏலா
  rationale: எபிரெயப் பெயரின் ஒலியமைப்பைத் தமிழில் வாசிக்க இயல்பான முறையில் எழுத்துப்பெயர்த்த வடிவம்.
- source_word: וְנַעֲרָה
  choice: நாரா
  rationale: இரண்டாவது மனைவியின் பெயர் எபிரெய ஒலிப்புக்கு அண்மையாகத் தமிழில் எழுத்துப்பெயர்க்கப்படுகிறது; பெயர்ப்பட்டியலில் இணைப்பு இரட்டைப்புள்ளி மற்றும் காற்புள்ளியால் இயல்பாக வெளிப்படுகிறது.
theological_decisions:
- issue: ‘தெக்கோவாவின் தந்தை’ என்பதன் உறவுப் பொருள்
  choice: முதன்மை உரையில் ‘தந்தை’ என்ற நேரடி சொல்லைத் தக்கவைத்தல்
  alternative: ‘தெக்கோவாவின் நிறுவனர்’ அல்லது ‘தெக்கோவாவின் முன்னோர்’
  rationale: இந்த வம்சவரலாற்றுப் பயன்பாடு உயிரியல் தந்தையை மட்டுமே குறிக்கிறதா, குலம் அல்லது குடியிருப்பின் நிறுவனரைச் சுட்டுகிறதா என்பது தெளிவாகத் தீர்மானிக்க முடியாது. ஆகவே மூலத்தின் திறந்த பொருளை முதன்மை உரையில் காத்து, மாற்றுப் பொருள்களை அடிக்குறிப்பில் தருவது பொருத்தமானது.
translation_notes:
  register: நவீன நிலையான தமிழில், வம்சவரலாற்றுக்கேற்ற சுருக்கமானவும் கண்ணியமானவும் உள்ள நடை. எபிரெய உடைமை/இருப்புக் கட்டமைப்பு இயல்பான தமிழாக மாற்றப்பட்டுள்ளது; மூலத்தில் உள்ள உறவுச் சொல்லின் பொருள் தெளிவுபடுத்தப்படாமல் பாதுகாக்கப்பட்டுள்ளது.
