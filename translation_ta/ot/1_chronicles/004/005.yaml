- from: 'தெக்கோவாவின் தந்தையான அஸ்கூருக்கு இரண்டு மனைவிகள் இருந்தார்கள்: ஏலா, நாரா[a].'
  to: 'தெக்கோவாவின் தந்தையான அஷ்ஹூருக்கு இரண்டு மனைவிகள் இருந்தார்கள்: ஹெலா, நாரா[a].'
