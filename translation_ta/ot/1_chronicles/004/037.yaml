source:
  edition: WLC
  text: וְ/זִיזָ֨א בֶן שִׁפְעִ֧י בֶן אַלּ֛וֹן בֶּן יְדָיָ֥ה בֶן שִׁמְרִ֖י בֶּן שְׁמַֽעְיָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/037.yaml
  text: and Ziza son of Shiphi[a], son of Allon, son of Jedaiah, son of Shimri, son of Shemaiah.
translation:
  language: ta
  text: ஸீஸாவும் ஷிபியின் மகன்; ஷிபி அல்லோனின் மகன்; அல்லோன் யெதாயாவின் மகன்; யெதாயா சிம்ரியின் மகன்; சிம்ரி செமாயாவின் மகன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְזִיזָא
  choice: மேலும், சீசா
  rationale: וְ பட்டியல் தொடர்வதைச் சுட்டுவதால் “மேலும்” என வழங்கப்பட்டது. זִיזָא மொழிபெயர்க்கப்படாமல், எபிரெய உச்சரிப்பை அணுகும் தமிழ்ப் பெயராக “சீசா” என எழுத்துப்பெயர்க்கப்பட்டது; இறுதி எழுத்து அலெஃப் என்பதால் தமிழில் தனியான மாற்றுப் பெயர்க்குறிப்பு தேவையில்லை.
- source_word: בֶן
  choice: மகன்
  rationale: வம்சவரிசையில் வரும் בֶן என்பதன் நேரடியான பொருள் “மகன்.” உறவுச் சங்கிலி தெளிவாக இருக்க ஒவ்வொரு தலைமுறையிலும் இது வெளிப்படையாகத் தரப்பட்டுள்ளது.
- source_word: שִׁפְעִי
  choice: சிபெயி
  rationale: இது ஒரு நபரின் பெயர்; ஆகவே பொருள் மொழிபெயர்ப்பு செய்யாமல் எபிரெய மெய்-உயிர் அமைப்பை அணுகும் வகையில் எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: אַלּוֹן
  choice: அல்லோன்
  rationale: இந்தச் சூழலில் இது “கருவாலி மரம்” என்ற பொதுப்பெயர் அல்ல, நபரின் பெயர். ஆகவே “அல்லோன்” என எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: יְדָיָה
  choice: எதாயா
  rationale: எபிரெயப் பெயரின் ஒலியமைப்பை இயல்பான தமிழில் அணுகும் எழுத்துப்பெயர்ப்பு பயன்படுத்தப்பட்டது.
- source_word: שִׁמְרִי
  choice: சிம்ரி
  rationale: நபரின் பெயர் தமிழில் சுருக்கமாகவும் வாசிக்க எளிதாகவும் “சிம்ரி” என எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: שְׁמַעְיָה
  choice: செமாயா
  rationale: எபிரெயப் பெயரின் ஒலியமைப்பை அணுகியும் தமிழில் இயல்பாக வாசிக்கத்தக்க வகையிலும் “செமாயா” என எழுத்துப்பெயர்க்கப்பட்டது.
