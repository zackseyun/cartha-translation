  naturalness: The repeated explanatory subjects and semicolon-separated clauses make the draft heavier than necessary. A compact genealogical chain is natural, clear modern Tamil and reflects the Hebrew structure closely.
  terminology: “மகன்” is the appropriate rendering of בֶן in this genealogy. The personal names have been adjusted to more faithful, readable Tamil transliterations without translating them.
