translation_notes:
  register: நவீன செந்தமிழ் நடையில், சாதாரண வாசகருக்குப் புரியும் வகையில் வம்சவரிசை உறவுகள் தனித்தனி அரைப்புள்ளிகளால் பிரிக்கப்பட்டுள்ளன. மூலத்தின் பெயர்-தந்தை சங்கிலியைத் தெளிவாக்க “இவர்” மட்டும் சேர்க்கப்பட்டுள்ளது; எந்தத் தலைமுறையும் சுருக்கப்படவில்லை.
