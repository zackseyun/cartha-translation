    rationale: “சீசா” does not represent the initial zayin of זִיזָא, and “எதாயா” omits the initial yod of יְדָיָה. “ஷிபி,” “ஸீஸா,” and “யெதாயா” more closely reflect the source names.
  - severity: low
    issue: “மேலும்” and the inserted “இவர்” produce an unnecessarily explanatory construction.
    rationale: The Hebrew simply continues a name list with a conjunction. “ஸீஸாவும்” preserves that linkage naturally, while the direct chain of genitives makes each descent relationship clear.
