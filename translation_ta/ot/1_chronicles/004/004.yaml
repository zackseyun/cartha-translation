revisions:
- from: பெனுவேல்[a], கேதோரின் தந்தை; ஏசேர், ஊஷாவின் தந்தை. இவர்கள் எப்பிராத்தாவின் முதற்பேறானவரும் பெத்லகேமின் தந்தையுமான ஊரின் மகன்கள்.[b]
  to: கேதோரின் தந்தையான பெனுவேலும்[a][b], ஊஷாவின் தந்தையான ஏசேரும்—இவர்கள் எப்பிராத்தாவின் முதற்பேறானவரும் பெத்லகேமின் தந்தையுமான ஊர் என்பவரின் மகன்கள்.
  rationale: திருத்தம் எபிரெயத்தின் இணைப்பட்ட பெயர்த் தொடர்களையும் ‘இவர்கள்’ என்ற சுட்டலையும் தக்கவைத்துக்கொண்டு தமிழ்ச் சொற்றொடர் அமைப்பைச் சீராக்குகிறது. ‘எப்பிராத்தாவின் முதற்பேறானவர்’ மற்றும் ‘பெத்லகேமின் தந்தை’ ஆகிய இரண்டும் ஊரை விளக்கும் இணை அடைமொழிகளாகவே வைக்கப்பட்டுள்ளன. அடிக்குறிப்பு அடையாளம் பெயருக்கான மாற்று வடிவத்தையும் ‘தந்தை’ என்ற மரபுவழிச் சொல்லின் விரிவான பயன்பாட்டையும் சரியான இடங்களில் சுட்டுகிறது.
