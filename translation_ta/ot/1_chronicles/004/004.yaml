base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/004.yaml
  text: Penuel[a], the father of Gedor, and Ezer, the father of Hushah—these were the sons of Hur, the firstborn of Ephrathah[b], the father of Bethlehem.
translation:
  language: ta
  text: கேதோரின் தந்தையான பெனுவேலும்[a][b], ஊஷாவின் தந்தையான ஏசேரும்—இவர்கள் எப்பிராத்தாவின் முதற்பேறானவரும் பெத்லகேமின் தந்தையுமான ஊர் என்பவரின் மகன்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: வேறு சில வேதப்பகுதிகளில் இந்தப் பெயர் ‘பெனியேல்’ என்ற மாற்று வடிவில் வருகிறது.
    reason: lexical_alternative
  - marker: b
    text: இந்த வம்சவரிசைப் பட்டியல் சூழலில் ‘தந்தை’ என்பது, குறிப்பாக ஓர் ஊர் அல்லது குலத்துடன் தொடர்புபடுத்தப்படும்போது, ‘நிறுவியவர்’ அல்லது ‘மூதாதை’ என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְנוּאֵל
  choice: பெனுவேல்
  rationale: இது ஒரு நபரின் பெயர் என்பதால் பொருள் மொழிபெயர்ப்பு செய்யாமல் எபிரெய வடிவுக்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டது.
- source_word: אֲבִי
  choice: தந்தை
  rationale: எபிரெய மரபுவழிப் பட்டியலின் நேரடியான உறவுச் சொல்லைத் தக்கவைக்கிறது; ஊர் அல்லது குலத்துடன் வரும்போது ‘நிறுவியவர்,’ ‘மூதாதை’ அல்லது ‘தலைவர்’ என்ற விரிவான பொருளும் இருக்கலாம் என்பதால் அது அடிக்குறிப்பில் தெரிவிக்கப்பட்டது.
- source_word: גְדֹר
  choice: கேதோர்
  rationale: ஊர் அல்லது குலத்தைக் குறிக்கும் இயற்பெயராக ஒலிபெயர்க்கப்பட்டது.
- source_word: עֵזֶר
  choice: ஏசேர்
  rationale: நபரின் இயற்பெயராக ஒலிபெயர்க்கப்பட்டது.
- source_word: חוּשָׁה
  choice: ஊஷா
  rationale: ஊர் அல்லது குலத்தைக் குறிக்கும் இயற்பெயராக ஒலிபெயர்க்கப்பட்டது.
- source_word: בְנֵי
  choice: மகன்கள்
  rationale: மரபுவழிப் பட்டியலில் இது சில நேரங்களில் ‘வழித்தோன்றல்கள்’ என்ற விரிவான பொருளைக் கொண்டாலும், மூலத்தின் நேரடி சொல்லாட்சியைத் தக்கவைக்க ‘மகன்கள்’ பயன்படுத்தப்பட்டது.
- source_word: חוּר
  choice: ஊர்
  rationale: நபரின் பெயராகத் தமிழில் இயல்பாக ஒலிபெயர்க்கப்பட்டது; தொடக்க எபிரெய மெய்யொலிக்கு தனியான தமிழ் இணை இல்லாததால் நிலைபெற்ற எளிய வடிவம் பயன்படுத்தப்பட்டது.
- source_word: בְּכֹר
  choice: முதற்பேறானவர்
  rationale: எப்பிராத்தாவுடன் ஊருக்கு உள்ள முதற்பேற்று நிலையைத் துல்லியமாகக் காட்டுகிறது; மூலத்தில் இல்லாத ‘மகன்’ இங்கு சேர்க்கப்படவில்லை.
- source_word: אֶפְרָתָה
  choice: எப்பிராத்தா
  rationale: இயற்பெயராக ஒலிபெயர்க்கப்பட்டது.
- source_word: בֵּית לָחֶם
  choice: பெத்லகேம்
  rationale: பெயரின் கூறுகளைச் சொற்பொருளாக மொழிபெயர்க்காமல், தமிழில் பரவலாக அறியப்பட்ட ஊர்ப்பெயர் வடிவம் பயன்படுத்தப்பட்டது.
theological_decisions:
- issue: ‘பெத்லகேமின் தந்தை’ என்பது யாரைக் குறிக்கிறது?
  choice: இது அண்மையில் வரும் ‘ஊர்’ என்பவரைக் குறிக்கும் வகையில் மொழிபெயர்க்கப்பட்டது.
  alternative: இந்தச் சொற்றொடரை எப்பிராத்தாவுடன் இணைத்துப் புரிந்துகொள்வது.
  rationale: எபிரெய தொடரமைப்பில் ‘எப்பிராத்தாவின் முதற்பேறானவர்’ மற்றும் ‘பெத்லகேமின் தந்தை’ ஆகிய இரண்டும் ஊரை விளக்கும் இணை அடைமொழிகளாக இயல்பாக நிற்கின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வாசிப்பின் இயல்பும் காக்கப்பட்டுள்ளன. எபிரெய மரபுவழிப் பட்டியலின் சுருக்கமான அமைப்பு தக்கவைக்கப்பட்டாலும், நீண்ட இணைப்பைத் தெளிவாக்க இரண்டு வாக்கியங்களாக அமைக்கப்பட்டது. ‘தகப்பன்’ என்பதற்குப் பதிலாக இன்றைய பொதுவழக்கில் இயல்பான ‘தந்தை’ பயன்படுத்தப்பட்டது.
