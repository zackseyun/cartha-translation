  text: וַ/יַּכּ֕וּ אֶת שְׁאֵרִ֥ית הַ/פְּלֵטָ֖ה לַ/עֲמָלֵ֑ק וַ/יֵּ֣שְׁבוּ שָׁ֔ם עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/043.yaml
  text: And they struck down the remnant of the survivors of Amalek[b][a], and they lived there to this day.
translation:
  language: ta
  text: அவர்கள் தப்பிப் பிழைத்த அமாலேக்கியரில் எஞ்சியிருந்தவர்களை அடித்து வீழ்த்தினார்கள்;[a] அங்கே இந்நாள்வரை குடியிருந்தார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அமாலேக்கின் தப்பிப் பிழைத்தோரில் எஞ்சியிருந்தவர்களை.” பேரழிவுக்குப் பின் மீந்தவர்களைக் குறிக்கும் அண்மைப் பொருளுடைய இரண்டு சொற்களை எபிரேயத் தொடர் இணைக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அங்கே இந்நாள்வரை குடியேறி வாழ்ந்தார்கள்.” இவ்வினை ஓர் இடத்தில் வாழ்வதையோ குடியேறுவதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: வெட்டி வீழ்த்தி
  rationale: נכה என்ற வினையின் போர்ச் சூழலிலான தாக்குதலையும் உயிர்க்கொல்லும் விளைவையும் இயல்பான தமிழில் உணர்த்துகிறது; வெறுமனே ‘தோற்கடித்தனர்’ என்று பொருளைக் குறுக்கவில்லை.
- source_word: שְׁאֵרִית הַפְּלֵטָה
  choice: தப்பிப் பிழைத்தவர்களில் எஞ்சியிருந்தவர்கள்
  rationale: ‘எஞ்சியது’ மற்றும் ‘தப்பியோர்’ என்ற அண்மைப் பொருளுடைய இரு எபிரேயப் பெயர்ச்சொற்களின் கூட்டு வலியுறுத்தலைத் தமிழில் இயல்பாகப் பேணுகிறது.
- source_word: לַעֲמָלֵק
  choice: அமாலேக்கில்
  rationale: இங்குள்ள לַעֲמָלֵק என்பது அமாலேக்கு என அடையாளப்படுத்தப்படும் மக்களிடையே/அவர்களில் என்பதைக் குறிக்கிறது; ‘அமாலேக்கியர்’ என்பது சாத்தியமான விரிவாக்கம்.
- source_word: וַיֵּשְׁבוּ
  choice: குடியிருந்தார்கள்
  rationale: ישב என்பதன் ‘வாழ்தல்/குடியிருத்தல்/குடியேறுதல்’ என்ற பொருள் வரம்பை இடத்தைக் கைப்பற்றிய சூழலில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: שָׁם
  choice: அங்கே
  rationale: முன்னர் குறிப்பிடப்பட்ட இடத்தைச் சுட்டும் எளிய இடவினையடை.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: இந்நாள்வரை
  rationale: எபிரேயக் கதைநடையின் வழக்கமான காலக் குறிப்பை கண்ணியமான, தெளிவான நவீனத் தமிழில் தருகிறது.
