revisions:
- from: அவர்கள் அமாலேக்கில் தப்பிப் பிழைத்தவர்களில் எஞ்சியிருந்தவர்களை வெட்டி வீழ்த்தி,[a] அங்கே இந்நாள்வரை குடியிருந்தார்கள்.[b]
  to: அவர்கள் தப்பிப் பிழைத்த அமாலேக்கியரில் எஞ்சியிருந்தவர்களை அடித்து வீழ்த்தினார்கள்;[a] அங்கே இந்நாள்வரை குடியிருந்தார்கள்.[b]
  rationale: The revision corrects the people-group reference, removes an unwarranted implication of cutting, and preserves both the Hebrew’s emphatic survivor/remnant expression and the lexical range of “dwell/settle.”
