  register: நவீன நிலையான தமிழில், வரலாற்றுக் கதைநடைக்கு ஏற்ற கண்ணியமான பதிவு. மூலத்தின் இரட்டை வலியுறுத்தல் பிரதான உரையில் இயல்பான தமிழாகப் பேணப்பட்டுள்ளது; ישב என்பதிலுள்ள ‘வாழ்தல்/குடியேறுதல்’ நுணுக்கம் அடிக்குறிப்பில் திறந்துவைக்கப்பட்டுள்ளது.
