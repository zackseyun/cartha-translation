  text: הֵ֚מָּה הַ/יּ֣וֹצְרִ֔ים וְ/יֹשְׁבֵ֥י נְטָעִ֖ים וּ/גְדֵרָ֑ה עִם הַ/מֶּ֥לֶךְ בִּ/מְלַאכְתּ֖/וֹ יָ֥שְׁבוּ שָֽׁם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/023.yaml
  text: These were the potters and the inhabitants of Netaim and Gederah[a]; they lived there with the king for his work.
translation:
  language: ta
  text: இவர்களே குயவர்களும் நெத்தாயீம், கெதேரா[a] ஆகிய இடங்களில் குடியிருந்தவர்களும் ஆவர். அவர்கள் அரசனோடு அவனுடைய பணியில் அங்கே குடியிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இவர்களே குயவர்களும், நடுகைகளுக்கிடையிலும் வேலி அடைப்புகளிலும் குடியிருந்தவர்களும் ஆவர்.” ‘நெத்தாயீம்’, ‘கெதேரா’ என்ற எபிரெயச் சொற்களை இடப்பெயர்களாகவோ, முறையே ‘நடுகைகள்’, ‘வேலி/அடைப்பு’ என்னும் பொதுப்பெயர்களாகவோ வாசிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה
  choice: இவர்களே
  rationale: முந்தைய வம்சப் பட்டியலில் குறிப்பிடப்பட்டவர்களைச் சுட்டுகிறது; வலியுறுத்தும் தன்மையை ‘-ஏ’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַיּוֹצְרִים
  choice: குயவர்கள்
  rationale: יצר என்பதன் உருவாக்குதல் என்ற அடிப்படைப் பொருளிலிருந்து, இச்சூழலில் களிமண்ணை வடிவமைக்கும் தொழிலாளர்களான குயவர்களைக் குறிப்பது மிகவும் பொருத்தமானது.
- source_word: וְיֹשְׁבֵי
  choice: குடியிருந்தவர்களும்
  rationale: ישב என்ற வினையின் பங்கேற்பு வடிவம் நிலையாக வசித்தவர்களைக் குறிக்கிறது; நவீனத் தமிழில் பெயர்ச்சொல் தன்மையையும் தெளிவாகப் பேணுகிறது.
- source_word: נְטָעִים
  choice: நெத்தாயீம்
  rationale: வம்சவழி மற்றும் புவியியல் பட்டியல் சூழலில் இடப்பெயராக எடுத்துக்கொள்ளப்பட்டுள்ளது; ‘நடுகைகள்’ என்ற பொதுப்பெயர்ப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וּגְדֵרָה
  choice: கெதேரா
  rationale: நெத்தாயீமுடன் இணையாக வரும் இடப்பெயராக எடுத்துக்கொள்ளப்பட்டுள்ளது; ‘வேலி/அடைப்பு’ என்ற பொதுப்பெயர்ப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: עִם הַמֶּלֶךְ
  choice: அரசனோடு
  rationale: עִם என்பதன் நேரடியான ‘உடன்’ என்ற உறவைப் பேணுகிறது; அரசப் பணி அல்லது சேவை என்ற உட்குறிப்பை அடுத்த சொற்றொடர் வெளிப்படுத்த அனுமதிக்கிறது.
- source_word: בִּמְלַאכְתּוֹ
  choice: அவனுடைய பணியில்
  rationale: מְלָאכָה என்பது வேலை, தொழில் அல்லது பணி எனப் பொருள்படும். அரசனுடன் தொடர்புடைய பணியைத் தெளிவாக்கியபோதும் ‘சேவை’ என்று மிகையாகக் குறிப்பாக்கவில்லை.
- source_word: יָשְׁבוּ שָׁם
  choice: அங்கே குடியிருந்தார்கள்
  rationale: குறிப்பிட்ட இடத்தில் நிலையாக வசித்ததை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
