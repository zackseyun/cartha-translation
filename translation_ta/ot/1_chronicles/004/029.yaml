base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/029.yaml
  text: and in Bilhah[a], and in Ezem, and in Tolad.
translation:
  language: ta
  text: பில்காவிலும்[a], ஏசெமிலும், தோலாதிலும் குடியிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய உரையில் வினைச்சொல் இல்லை; முந்தைய வசனத்திலிருந்து ‘குடியிருந்தார்கள்’ என்பது பொருளில் நிரப்பப்பட்டுள்ளது. இதை ‘பில்காவில்… ஏசெமில்… தோலாதில்…’ என்றும் நேரடியாக வாசிக்கலாம்.
    reason: ellipsis_and_lexical_alternative
lexical_decisions:
- source_word: וּ/בְ/בִלְהָה
  choice: பில்காவிலும்
  rationale: வ் இணைப்பும் בְ இடச்சுட்டும் சேர்ந்து தொடரிலுள்ள குடியிருப்பு இடத்தைக் குறிக்கின்றன. בִלְהָה என்ற இடப்பெயர் எபிரெய உச்சரிப்பை அண்மித்து ‘பில்கா’ என ஒலிபெயர்க்கப்பட்டது.
- source_word: וּ/בְ/עֶצֶם
  choice: ஏசெமிலும்
  rationale: முந்தைய இடப்பெயருடன் ஒரே அமைப்பில் வரும் וּבְ என்பதற்கு ‘-இலும்’ பயன்படுத்தப்பட்டது. עֶצֶם இங்கு பொதுப்பெயர் அல்ல, இடப்பெயர் என்பதால் ‘ஏசெம்’ என ஒலிபெயர்க்கப்பட்டது.
- source_word: וּ/בְ/תוֹלָד
  choice: தோலாதிலும்
  rationale: இடங்களின் பட்டியலைத் தொடரும் וּבְ அமைப்பு ‘-இலும்’ என இயல்பான தமிழில் தரப்பட்டது. תוֹלָד என்ற இடப்பெயர் ‘தோலாத்’ என ஒலிபெயர்க்கப்பட்டது.
