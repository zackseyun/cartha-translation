base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/018.yaml
  text: And his wife the Jewess bore Jered the father of Gedor[a], Heber the father of Soco, and Jekuthiel the father of Zanoah. These are the sons of Bithiah daughter of Pharaoh[c][b], whom Mered took as wife.
translation:
  language: ta
  text: அவனுடைய மனைவியாகிய யூதப் பெண்[a], கேதோரின் தந்தையான[b] யெரேத்தையும், சோகோவின் தந்தையான ஏபேரையும், சானோவாவின் தந்தையான யெகுத்தியேலையும் பெற்றெடுத்தாள். இவர்கள் பார்வோனின் மகளான பித்தியாவின் மகன்கள்[c]. அவளை மேரேத் மனைவியாக ஏற்றுக்கொண்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “யூதேயப் பெண்” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: நாளாகமத்தில் “தந்தை” என்பது ஓர் இடத்தின் அல்லது குலத்தின் நிறுவியவர், மூதாதை, அல்லது தலைவர் என்றும் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: c
    text: இங்கு எபிரெய வாக்கிய அமைப்பு தெளிவற்றது. “யூதப் பெண்” என்பவளும் பார்வோனின் மகளான பித்தியாவும் ஒரே பெண் என்று சிலர் புரிந்துகொள்கிறார்கள்; வேறு மனைவிகள் என்று மற்றவர்கள் புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
lexical_decisions:
- source_word: הַיְהֻדִיָּה
  choice: யூதப் பெண்
  rationale: பெண்பால் இன/குடியியல் அடையாளத்தை இயல்பான நவீனத் தமிழில் தருகிறது; ‘யூதாவைச் சேர்ந்த பெண்’ என்ற புவியியல் சார்ந்த பொருளும் சாத்தியம் என்பதால் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: יָלְדָה
  choice: பெற்றெடுத்தாள்
  rationale: வம்சவரலாற்றுச் சூழலில் ‘பெற்றாள்/பெற்றெடுத்தாள்’ என்பதே நேரடியும் இயல்புமான தமிழ்; இங்கு குழந்தைகளைப் பெற்றெடுத்த செயலைத் தெளிவாகக் குறிக்கிறது.
- source_word: אֲבִי
  choice: தந்தையான
  rationale: எபிரெயச் சொல்லின் நேரடியான உறவுமுறையைப் பாதுகாக்கிறது; நாளாகமத்தில் அது நிறுவியவர், மூதாதை அல்லது ஓர் இடத்துடன் தொடர்புடைய குலத்தலைவர் என்றும் பொருள்படலாம் என்பதை அடிக்குறிப்பு தெரிவிக்கிறது.
- source_word: שׂוֹכוֹ
  choice: சோகோ
  rationale: எபிரெய இடப்பெயரின் ஒலிப்பெயர்ப்பு.
- source_word: יְקוּתִיאֵל
  choice: யெக்கூத்தியேல்
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் நெருக்கமாக வழங்கும் ஒலிப்பெயர்ப்பு.
- source_word: זָנוֹחַ
  choice: சானோவா
  rationale: எபிரெய இடப்பெயருக்கான வாசிக்க எளிய தமிழ் ஒலிப்பெயர்ப்பு.
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: எபிரெயில் ஆண்பால் சொல் வெளிப்படையாக இருப்பதால் அதையே துல்லியமாகப் பாதுகாக்கிறது.
- source_word: בִּתְיָה בַת פַּרְעֹה
  choice: பார்வோனின் மகளான பித்தியா
  rationale: மூலத்தின் இணைப்புச் சொல்லமைப்பையும் உறவையும் இயல்பான தமிழில் தெளிவாக வழங்குகிறது.
- source_word: לָקַח
  choice: மனைவியாக ஏற்றுக்கொண்டான்
  rationale: வினையின் அடிப்படைப் பொருள் ‘எடுத்தான்’ என்றாலும், திருமணச் சூழலில் பெண்ணை மனைவியாகக் கொண்டதைக் குறிக்கிறது; தமிழ் வழக்கில் மரியாதையுடனும் தெளிவாகவும் வழங்கப்பட்டுள்ளது.
- source_word: וְאֵלֶּה
  choice: இவர்கள்
  rationale: முன் குறிப்பிடப்பட்டவர்களைச் சுட்டும் தொகுப்புரையை நவீனத் தமிழில் இயல்பாக வழங்குகிறது.
theological_decisions:
- issue: ‘யூதப் பெண் மனைவி’ என்பவளுக்கும் ‘பார்வோனின் மகளான பித்தியா’ என்பவளுக்கும் இடையிலான உறவு
  choice: எபிரெய உரையின் வரிசையையும் அதன் தெளிவின்மையையும் அப்படியே வைத்துப் பித்தியாவை மேரேது மனைவியாக ஏற்றுக்கொண்டதாக மட்டும் கூறுதல்
  alternative: ‘யூதப் பெண்’ என்பவளே பித்தியா என்று வெளிப்படையாக அடையாளப்படுத்துதல், அல்லது அவர்கள் இரு வேறு மனைவிகள் என மொழிபெயர்த்தல்
  rationale: எபிரெய வாக்கிய அமைப்பு கடினமானது. இருவரும் ஒரே பெண்ணா அல்லது மேரேதின் வேறு வேறு மனைவிகளா என்பது விவாதத்திற்குரியது; ஆகவே மொழிபெயர்ப்பு எந்த ஓர் விளக்கத்தையும் உரைக்குள் திணிக்காமல் பதற்றத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. வம்சவரலாற்றின் சுருக்கமான நடை காக்கப்பட்டுள்ளது; தனிப்பெயர்கள் எபிரெய ஒலிக்கு நெருக்கமாகத் தமிழாக்கப்பட்டுள்ளன. மூலத்தில் உள்ள உறவுமுறைத் தெளிவின்மை உரைக்குள் தீர்க்கப்படாமல் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
