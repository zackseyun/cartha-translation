base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/042.yaml
  text: And some of them[a], from the sons of Simeon, went to Mount Seir—five hundred men—with Pelatiah, Neariah, Rephaiah, and Uzziel, sons of Ishi, at their head.
translation:
  language: ta
  text: அவர்களில், சிமியோனின் மக்களில் சிலர்—ஐந்நூறு ஆண்கள்—சேயீர் மலைக்குச் சென்றார்கள். இஷியின் மகன்களான பெலத்தியா, நெயரியா, ரெபாயா, உசியேல் ஆகியோர் அவர்களுக்குத் தலைமை தாங்கினார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “அவர்களின் தலையில்/முன்னணியில்” என்று உள்ளது. இது இஷியின் மகன்களான அந்த நால்வரும் ஐந்நூறு பேருக்குத் தலைமை தாங்கியதைக் குறிக்கிறது.
    reason: בְּרֹאשָׁם என்ற எபிரெய மரபுத்தொடரின் நேரடிப் படிமத்தையும், தமிழில் தரப்பட்ட இயல்பான பொருளையும் துல்லியமாகக் காட்டுவதற்காக.
