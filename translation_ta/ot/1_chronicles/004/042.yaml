- source_word: וּפְלַטְיָה וּנְעַרְיָה וּרְפָיָה וְעֻזִּיאֵל בְּנֵי יִשְׁעִי
  choice: இஷியின் மகன்களான பெலத்தியா, நெயரியா, ரெபாயா, உசியேல்
