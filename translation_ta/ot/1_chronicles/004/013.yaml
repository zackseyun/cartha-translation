base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/013.yaml
  text: 'The sons of Kenaz: Othniel and Seraiah[a]. And the sons of Othniel: Hathath.'
translation:
  language: ta
  text: 'கெனாசின் மகன்கள்: ஒத்னியேலும் செராயாவும். ஒத்னியேலின் மகன்கள்: ஹதாத்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேய உரையில் ‘மகன்கள்’ என்று பன்மையில் இருந்தாலும், இங்கு ஹதாத் என்ற ஒரே பெயர் மட்டுமே தரப்பட்டுள்ளது.
    reason: textual_ambiguity
lexical_decisions:
- source_word: וּבְנֵי קְנַז
  choice: கேனாசின் மகன்கள்
  rationale: בְּנֵי என்பது மரபுப்பட்டியல் சூழலில் நேரடியாக ‘மகன்கள்’ எனப் பொருள்படும்; வசனத் தொடக்க இணைப்புச்சொல் இயல்பான தமிழுக்காக வெளிப்படையாக மொழிபெயர்க்கப்படவில்லை.
- source_word: עָתְנִיאֵל
  choice: ஒத்னியேல்
  rationale: எபிரேய தனிப்பெயரின் ஒலியைத் தமிழில் இயன்றவரை பிரதிபலிக்கும் எழுத்துப்பெயர்ப்பு.
- source_word: וּשְׂרָיָה
  choice: செராயா
  rationale: முன்னொட்டான וּ ‘உம்’ என்ற இணைப்பால் வெளிப்படுத்தப்படுகிறது; שְׂרָיָה என்ற தனிப்பெயர் எபிரேய உச்சரிப்பை ஒட்டி எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: וּבְנֵי עָתְנִיאֵל
  choice: ஒத்னியேலின் மகன்கள்
  rationale: அடுத்த தலைமுறையை அறிமுகப்படுத்தும் மீளும் மரபுப்பட்டியல் வாய்பாடு; தமிழில் புதிய வாக்கியமாக இயல்பாக வழங்கப்பட்டது.
- source_word: חֲתַת
  choice: அதாத்
  rationale: חֲתַת என்ற எபிரேய தனிப்பெயரின் ஒலியைத் தமிழில் நெருக்கமாகப் பிரதிபலிக்கும் எழுத்துப்பெயர்ப்பு.
