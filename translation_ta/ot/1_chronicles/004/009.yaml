source:
  edition: WLC
  text: וַ/יְהִ֣י יַעְבֵּ֔ץ נִכְבָּ֖ד מֵ/אֶחָ֑י/ו וְ/אִמּ֗/וֹ קָרְאָ֨ה שְׁמ֤/וֹ יַעְבֵּץ֙ לֵ/אמֹ֔ר כִּ֥י יָלַ֖דְתִּי בְּ/עֹֽצֶב׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/009.yaml
  text: Jabez was more honored than his brothers[a], and his mother called his name Jabez, saying[b], “Because I bore him in pain.”
translation:
  language: ta
  text: யாபேஸ் தன் சகோதரர்களைவிட அதிகமாக மதிக்கப்பட்டவனாக இருந்தான்; அவனுடைய தாய், “நான் அவனை வேதனையுடன் பெற்றெடுத்ததால்[b]” என்று சொல்லி, அவனுக்கு யாபேஸ்[a] என்று பெயரிட்டாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “யாபேஸ்” என்ற பெயர், அவனுடைய தாய் கூறிய விளக்கத்தில் வரும் “வேதனை” அல்லது “துயரம்” என்பதற்கான எபிரேயச் சொல்லுடன் ஒத்த ஒலியுடையது.
    reason: lexical_alternative
  - marker: b
    text: “நான் அவனைத் துயரத்துடன் பெற்றெடுத்ததால்” என்றும் மொழிபெயர்க்கலாம். עֹצֶב என்ற எபிரேயச் சொல் வலி, துயரம் அல்லது கடின உழைப்பைக் குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: இருந்தான்
  rationale: היה என்ற வினையின் கதைக்கூற்று வடிவத்தை இயல்பான தமிழ் இறந்தகாலமாக வழங்குகிறது; மூலத்தில் இல்லாத ‘இப்போது’ போன்ற காலச் சொல்லைச் சேர்க்கவில்லை.
- source_word: יַעְבֵּץ
  choice: யாபேஸ்
  rationale: எபிரெய தனிப்பெயரைத் தமிழில் ஒலிபெயர்க்கிறது. பெயருக்கும் עֹצֶב என்பதற்கும் இடையிலான எபிரெயச் சொல் ஒலித்தொடர்பு அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: נִכְבָּד מֵאֶחָיו
  choice: தன் சகோதரர்களைவிட அதிக மதிப்புக்குரியவனாக
  rationale: נכבד என்பதன் ‘மதிக்கப்பட்ட, கனம்பெற்ற’ பொருளையும் מן காட்டும் ஒப்பீட்டையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: וְאִמּוֹ
  choice: அவனுடைய தாய்
  rationale: உடைமைத் தொடர்பை நேரடியாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: קָרְאָה שְׁמוֹ
  choice: அவனுக்கு ... என்று பெயரிட்டாள்
  rationale: ‘அவனுடைய பெயரை அழைத்தாள்’ என்ற எபிரெய மரபுத்தொடரின் இயல்பான நவீனத் தமிழ் வடிவம்; பெயரிடும் செயலைத் தெளிவாகக் காட்டுகிறது.
- source_word: לֵאמֹר
  choice: என்று சொல்லி
  rationale: தாய் கூறிய பெயர்க்காரணத்தை அறிமுகப்படுத்தும் எபிரெய வடிவத்தை இயல்பாகப் பிரதிபலிக்கிறது.
- source_word: כִּי
  choice: பெற்றெடுத்ததால்
  rationale: பெயரிட்டதற்கான காரணத்தைச் சுட்டும் כי என்பதன் காரணப் பொருளைத் தமிழ் வினையெச்ச அமைப்பில் வெளிப்படுத்துகிறது.
- source_word: יָלַדְתִּי
  choice: நான் அவனை ... பெற்றெடுத்தேன்
  rationale: முதல் நபர் பெண்பால் வினையின் பொருளைத் தெளிவாக வழங்குகிறது; சூழலில் உள்ள குழந்தையை ‘அவனை’ என்று வெளிப்படையாக்குகிறது.
- source_word: בְּעֹצֶב
  choice: வேதனையுடன்
  rationale: பிரசவ வலி என்ற உடனடிச் சூழலுக்கு ஏற்றது; அதேவேளை துயரம் என்ற உணர்வுப் பொருளையும் ‘வேதனை’ ஓரளவு தக்கவைக்கிறது.
