base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/002.yaml
  text: Reaiah son of Shobal fathered Jahath[a], and Jahath fathered Ahumai and Lahad. These were the clans of the Zorathites.
translation:
  language: ta
  text: சோபாலின் மகன் ரெயாயா யாகாத்தைப் பெற்றான்; யாகாத் அகுமாயையும் லாகாதையும் பெற்றான். இவர்களே சோராத்தியரின் குலங்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சோராத்தியரின் குடும்பங்கள்.” இங்குள்ள எபிரெயச் சொல் விரிந்த உறவுக் குழுக்களையும் குறிக்கலாம்; பழங்குடி வம்சவரிசைச் சூழலைத் தெளிவுபடுத்த “குலங்கள்” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
