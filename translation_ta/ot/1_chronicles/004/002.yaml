translation_notes:
  register: நவீனத் தரத் தமிழில், வம்சப்பட்டியலுக்கேற்ற சுருக்கமான மற்றும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. பெயர்கள் எபிரெய ஒலிக்கு அண்மையாகத் தமிழாக்கப்பட்டுள்ளன; ‘பெற்றான்’ என்பது மரபுவழி வம்சவரிசை நடையைத் தக்கவைக்கிறது. ஆங்கில ஆலோசனை உரையில் [a] குறி ‘யாகாத்’ என்பதற்குப் பின் இருந்தாலும், அதன் அடிக்குறிப்பு מִשְׁפְּחֹות (‘குலங்கள்/குடும்பங்கள்’) பற்றியது என்பதால், தமிழ் முதன்மை உரையில் குறி அதற்குரிய இடத்தில் வைக்கப்பட்டுள்ளது.
