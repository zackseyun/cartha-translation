base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/015.yaml
  text: 'And the sons of Caleb son of Jephunneh: Iru[a], Elah, and Naam; and the sons of Elah: Kenaz.'
translation:
  language: ta
  text: 'எப்புன்னேயின் மகனான காலேபின் மகன்கள்: ஈரு[a], ஏலா, நாம்; ஏலாவின் மகன்கள்: கெனாஸ்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மகன்கள்” என்பது இங்கு பரந்த பொருளில் “வழித்தோன்றல்கள்” என்றும் இருக்கலாம்; ஆயினும் உடனடியாக நபர்களின் பெயர்கள் பட்டியலிடப்படுவதால் “மகன்கள்” என மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: மகன்கள்
  rationale: வம்சவரலாற்றுச் சூழலில் בְּנֵי என்பதன் நேரடியான பொருள் ‘மகன்கள்’; சில இடங்களில் இது பரந்த பொருளில் ‘வழித்தோன்றல்கள்’ என்றும் அமையலாம். இங்கு அடுத்தடுத்து தனிநபர்களின் பெயர்கள் வருவதால் ‘மகன்கள்’ பொருத்தமானது.
- source_word: כָּלֵב בֶּן־יְפֻנֶּה
  choice: எப்புன்னேயின் மகன் காலேப்
  rationale: எந்த காலேப் குறிக்கப்படுகிறார் என்பதைத் தெளிவுபடுத்தும் வம்ச அடையாளத்தைத் தமிழின் இயல்பான உடைமைத் தொடரில் வழங்குகிறது.
- source_word: עִירוּ
  choice: ஈரு
  rationale: எபிரேய உயிர்க்குறிப்புக்கு நெருக்கமான தமிழ்ப் பெயர்ப்பெழுத்தாக்கம்.
- source_word: אֵלָה
  choice: ஏலா
  rationale: இச்சூழலில் இது பொதுப்பெயர் அல்ல, ஆண்பால் நபர்பெயர்; எபிரேய ஒலிப்பை அணுகிய பெயர்ப்பெழுத்தாக்கம்.
- source_word: וָנָעַם
  choice: நாகாம்
  rationale: மசோரா உயிர்க்குறிப்பு נָעַם (Nāʿam) என்பதைக் காட்டுகிறது; நடுவிலுள்ள தொண்டையொலி ע-ஐ அணுக ‘க’ சேர்க்கப்பட்டுள்ளது. இது வேறொரு வடிவமான ‘நாகாமா’ அல்ல.
- source_word: וּבְנֵי אֵלָה וּקְנַז
  choice: 'ஏலாவின் மகன்: கேனாஸ்'
  rationale: மூலத்தில் ‘ஏலாவின் மகன்கள்’ எனப் பன்மை இருந்தாலும், தொடர்ந்து கேனாஸ் என்ற ஒரே பெயரே உள்ளது. இயல்பான தமிழுக்காக ஒருமை பயன்படுத்தப்பட்டு, அந்த உரை வேறுபாடு அடிக்குறிப்பில் வெளிப்படையாகக் குறிப்பிடப்படுகிறது.
- source_word: קְנַז
  choice: கேனாஸ்
  rationale: எபிரேய நபர்பெயரின் ஒலிப்பை அணுகிய தமிழ்ப் பெயர்ப்பெழுத்தாக்கம்.
