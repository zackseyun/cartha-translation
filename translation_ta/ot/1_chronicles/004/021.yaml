base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/021.yaml
  text: 'The sons of Shelah son of Judah: Er the father of Lecah[a], and Laadah the father of Mareshah, and the clans of the house of linen workers of the house of Ashbea.'
translation:
  language: ta
  text: 'யூதாவின் மகனான சேலாவின் மகன்கள்: லேகாவின் தந்தையான ஏர், மரேஷாவின் தந்தையான லாதா, பெத்-அஷ்பேயாவிலுள்ள மெல்லிய நார்த்துணி வேலை செய்யும் வீட்டாரின் குலங்கள்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் வசனத்தின் இறுதித் தொடர் மிகவும் சுருக்கமாக உள்ளது. இதை, “பெத்-அஷ்பேயாவைச் சேர்ந்த மெல்லிய நார்த்துணித் தொழில் வீட்டாரின் குலங்கள்” என்றும் மொழிபெயர்க்கலாம். “பெத்-அஷ்பேயா” என்பது இடப்பெயராகவும், “அஷ்பேயாவின் வீடு/வீட்டார்” எனவும் புரிந்துகொள்ளப்படலாம். இவ்வசனத்தில் வரும் “தந்தை” என்பது “மூதாதை” அல்லது ஒரு குடியிருப்பையோ குலத்தையோ நிறுவியவர் என்ற பொருளையும் தரலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי שֵׁלָה בֶן יְהוּדָה
  choice: யூதாவின் மகனான சேலாவின் மகன்கள்
  rationale: எபிரெய உரையின் நேரடியான வம்சவழிச் சொல்லாட்சியைத் தக்கவைத்து, தமிழில் இயல்பான உறவுமுறைத் தொடராக வழங்குகிறது.
- source_word: עֵר אֲבִי לֵכָה
  choice: லேகாவின் தந்தையான ஏர்
  rationale: אֲבִי என்பதன் அடிப்படைப் பொருளான ‘தந்தை’ என்பதைக் காக்கிறது; இத்தகைய பட்டியல்களில் ‘மூதாதை’ அல்லது ‘நிறுவியவர்’ என்ற விரிந்த பொருளும் இருக்கலாம்.
- source_word: לַעְדָּה אֲבִי מָרֵשָׁה
  choice: மரேஷாவின் தந்தையான லாதா
  rationale: பெயர்களை எபிரெய ஒலிப்புக்கு அருகில் எழுத்துப்பெயர்த்து, அசல் உறவுமுறை அமைப்பைக் காக்கிறது.
- source_word: מִשְׁפְּחוֹת
  choice: குலங்கள்
  rationale: இங்கு அணுக்குடும்பங்களைவிட விரிந்த வம்சக் குழுக்களைக் குறிப்பதால் ‘குலங்கள்’ பொருத்தமானது.
- source_word: עֲבֹדַת הַבֻּץ
  choice: மெல்லிய நார்த்துணித் தொழிலாளர்கள்
  rationale: בּוּץ என்பது மெல்லிய நார்த்துணியைக் குறிக்கிறது; עֲבֹדַת உடன் சேர்ந்தபோது அதில் வேலை செய்த தொழிலாளர்களைக் குறிக்கும் சுருக்கமான சொல்லாட்சியாகப் புரிகிறது.
- source_word: לְבֵית אַשְׁבֵּעַ
  choice: அஷ்பேயாவின் வீட்டாரைச் சேர்ந்த
  rationale: לְ மற்றும் בֵּית சேர்ந்த இத்தொடர் இடத்தையா, குடும்ப/வீட்டார் தொடர்பையா குறிக்கிறது என்பது முழுமையாகத் தெளிவில்லை; ‘வீட்டாரைச் சேர்ந்த’ என்பது குடும்ப அல்லது தொழிற்குழுத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
