translation_notes:
  register: நவீனத் தரத் தமிழில், வம்சப்பட்டியலுக்கேற்ற சுருக்கமும் கண்ணியமும் காக்கப்பட்டுள்ளன. அறியப்படாத நபர்/இடப் பெயர்கள் எபிரெய ஒலிப்புக்கு அருகில் எழுத்துப்பெயர்க்கப்பட்டுள்ளன; இறுதியில் உள்ள சுருக்கமான எபிரெயத் தொடரின் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
