  text: וּ/בְנֵ֖י מִשְׁמָ֑ע חַמּוּאֵ֥ל בְּנ֛/וֹ זַכּ֥וּר בְּנ֖/וֹ שִׁמְעִ֥י בְנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/026.yaml
  text: 'The sons of Mishma: Hammuel his son, Zaccur his son, Shimei his son.'
translation:
  language: ta
  text: 'மிஷ்மாவின் மகன்கள்: அவனுடைய மகன் அம்முவேல்; அவனுடைய மகன் சக்கூர்; அவனுடைய மகன் சிமெயி.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: மகன்கள்
  rationale: בְנֵי என்பது ‘மகன்கள்’ என்ற பொருளுடைய பன்மை இணைப்புநிலை வடிவம். வம்சவரிசைப் பட்டியலில் இயல்பான தமிழுக்காக முன்னொட்டு וּ தனியே மொழிபெயர்க்கப்படவில்லை.
- source_word: מִשְׁמָע
  choice: மிஷ்மா
  rationale: எபிரெய தனிப்பெயரின் ஒலியமைப்பை நவீனத் தமிழில் அண்மையாகப் பெயர்த்தெழுதுகிறது.
- source_word: חַמּוּאֵל
  choice: அம்மூவேல்
  rationale: மசோரா உரையின் பெயரைத் தமிழில் ஒலிப்பெயர்த்து, தொடக்க ח ஒலியை தமிழில் இயல்பாக ‘அ’ என்றும், וּאֵל பகுதியை ‘மூவேல்’ என்றும் வழங்குகிறது.
- source_word: בְּנוֹ
  choice: அவனுடைய மகன்
  rationale: 3ஆம் ஆண்பால் ஒருமை உரிமை விகுதியுடன் வரும் בֵּן நேரடியாக ‘அவனுடைய மகன்’ என்று பொருள்படும்; வம்சத் தொடரில் ஒவ்வொரு பெயரும் முந்தைய நபரின் மகன் என்பதைத் தெளிவாகக் காட்டுகிறது.
- source_word: זַכּוּר
  choice: சக்கூர்
  rationale: எபிரெய זַכּוּר பெயரின் மெய்யிரட்டிப்பையும் நீண்ட ū உயிரையும் தமிழில் அண்மையாகக் காட்டும் ஒலிப்பெயர்ப்பு.
- source_word: שִׁמְעִי
  choice: சிமெயி
  rationale: எபிரெயப் பெயரின் மசோரா உயிர்க்குறிப்பை அண்மையாகப் பாதுகாக்கும் தமிழ் ஒலிப்பெயர்ப்பு.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், வம்சவரிசைக்குரிய சுருக்கத்தையும் கண்ணியத்தையும் பேணும் நடை. தொடர்ச்சியான உறவைத் தெளிவுபடுத்த அரைப்புள்ளிகள் பயன்படுத்தப்பட்டுள்ளன.
