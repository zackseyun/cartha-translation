  text: וַ/תֵּ֨לֶד ל֤/וֹ נַעֲרָה֙ אֶת אֲחֻזָּ֣ם וְ/אֶת חֵ֔פֶר וְ/אֶת תֵּימְנִ֖י וְ/אֶת הָ/אֲחַשְׁתָּרִ֑י אֵ֖לֶּה בְּנֵ֥י נַעֲרָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/006.yaml
  text: Naarah bore to him Ahuzzam[a], Hepher, Temeni, and Haahashtari[b]. These were the sons of Naarah.
translation:
  language: ta
  text: நாரா அவனுக்கு அஹுஸ்ஸாம், ஹேப்பேர், தேமெனி[a], ஹாஅஹஷ்தாரி[b] ஆகிய மகன்களைப் பெற்றாள். இவர்கள் நாராவின் மகன்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தேமெனி” என்பது “தேமெனியன்” அல்லது “தெற்கத்தியவன்” என்ற பெயரடைப் பொருளிலும் புரிந்துகொள்ளப்படலாம்; ஆனால் இந்த வம்சப் பட்டியலில் அது ஒருவரின் பெயராக ஒலிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: “ஹாஅஹஷ்தாரி” என்பதை “அஹஷ்தாரி” என்றும் ஒலிபெயர்க்கலாம். எபிரெய வடிவத்தில் முன்னொட்டப்பட்ட குறிப்புருபு பெயரின் நிலையான பகுதியாகியிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: பெற்றாள்
  rationale: ילד என்பதன் பெண்பால் வினைவடிவம் வம்சவரலாற்றில் குழந்தைகளைப் பெற்றெடுத்ததைக் குறிக்கிறது; தமிழில் ‘பெற்றாள்’ இயல்பாகவும் சுருக்கமாகவும் தாயை எழுவாயாகத் தக்கவைக்கிறது.
- source_word: לוֹ
  choice: அவனுக்கு
  rationale: ל இணைந்த ஆண்பால் ஒருமை பின்னொட்டு இங்கு வம்சவரலாற்றுச் சூத்திரத்தில் ஆண் பெற்றோருடனான தொடர்பைக் காட்டுகிறது; சூழல் அளிப்பதற்கு மேல் உறவை விளக்காமல் ‘அவனுக்கு’ என்று மொழிபெயர்க்கப்படுகிறது.
- source_word: נַעֲרָה
  choice: நாராள்
  rationale: இது ஒரு பெண்ணின் இயற்பெயர்; தமிழில் பெயராக ஒலிபெயர்க்கப்பட்டு, வசனத்தின் இறுதியிலும் ஒரே வடிவத்தில் வைக்கப்பட்டுள்ளது.
- source_word: אֶת ... וְאֶת ...
  choice: ஆகியோரை
  rationale: மீண்டும் வரும் நேரடிச் செயப்படுபொருள் உருபுகளின் பணியைத் தமிழில் பட்டியலமைப்பும் ‘ஆகியோரை’ என்ற தொகுப்புச் சொல்லும் இயல்பாக வெளிப்படுத்துகின்றன.
- source_word: אֲחֻזָּם
  choice: அகுசாம்
  rationale: எபிரெய இயற்பெயரின் ஒலிக்கு நெருக்கமான, தமிழில் வாசிக்க இயலும் ஒலிபெயர்ப்பு.
- source_word: חֵפֶר
  choice: ஏப்பேர்
  rationale: எபிரெய இயற்பெயரின் ஒலியைத் தமிழில் இயல்பாகக் குறிக்கும் ஒலிபெயர்ப்பு.
- source_word: תֵּימְנִי
  choice: தேமெனி
  rationale: வடிவம் பெயரடை சார்ந்த பொருளையும் தரக்கூடும்; எனினும் இவ்வம்சப் பட்டியலில் தனிப்பட்ட பெயராகச் செயல்படுவதால் மொழிபெயர்க்காமல் ஒலிபெயர்க்கப்படுகிறது.
- source_word: הָאֲחַשְׁתָּרִי
  choice: ஆகாஷ்தாரி
  rationale: எபிரெய வடிவத்தின் முன்னொட்டிய குறிப்புச் சுட்டையும் பெயரின் பகுதியாகப் பாதுகாக்கும் ஒலிபெயர்ப்பு; இனப்பெயர் அல்லது விளக்கப் பட்டமாகத் தீர்மானிப்பதைத் தவிர்க்கிறது.
- source_word: אֵלֶּה
  choice: இவர்கள்
  rationale: முன் பட்டியலிடப்பட்ட நபர்களைக் குறிக்கும் இயல்பான தமிழ் சுட்டுப்பெயர்.
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: வம்சவரலாற்றுச் சூழலில் בנים ஆண் பிள்ளைகளைக் குறிக்கிறது; அதனால் பொதுவான ‘பிள்ளைகள்’ என்பதற்குப் பதிலாக பாலினத் துல்லியத்துடன் ‘மகன்கள்’ பயன்படுத்தப்படுகிறது.
