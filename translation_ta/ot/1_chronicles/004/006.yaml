  verdict: revise
  source_fidelity: 'வாக்கிய அமைப்பும் வம்சவரலாற்றுப் பொருளும் மூல எபிரெயத்துடன் பொருந்துகின்றன: நாரா பெண் எழுவாய்; לוֹ ஆண் பெற்றோரைக் குறிக்கிறது; இறுதியில் பட்டியலிட்டோர் நாராவின் மகன்கள் எனச் சுருக்கப்படுகிறது. ஆனால் பெயர்களில் மூல மெய்யெழுத்துகளைச் சீராகப் பாதுகாக்க வேண்டும். குறிப்பாக அֲחֻזָּם, חֵפֶר, הָאֲחַשְׁתָּרִי ஆகியவற்றில் உள்ள /h/ ஒலிகள் வரைவில் விடுபட்டுள்ளன அல்லது மாற்றப்பட்டுள்ளன.'
  naturalness: ‘ஆகியோரைப் பெற்றாள்’ இலக்கணப்படி சாத்தியமானதாயினும், நவீன நிலையான தமிழில் வம்சவரலாற்றுப் பட்டியலுக்கு ‘ஆகிய மகன்களைப் பெற்றாள்’ என்பது தெளிவாகவும் இயல்பாகவும் உள்ளது. ‘நாராள்’ என்பது பெயருடன் தமிழ் பெண்பால் விகுதியை இணைப்பதுபோல் தோன்றுவதால், பெயராக ‘நாரா’ பயன்படுத்தப்படுகிறது.
  terminology: ‘மகன்கள்’ என்பது בְּנֵי என்பதற்குத் துல்லியமானது. தேமெனி தனிப்பட்ட பெயராகவே வைக்கப்படுகிறது; அதன் மாற்று பெயரடை/இனப்பெயர் வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது. ஹாஅஹஷ்தாரி பற்றிய அடிக்குறிப்பில் எபிரெய definite article-ஐ ‘குறிப்புருபு’ எனத் தெளிவாகக் குறிப்பிட வேண்டும்.
