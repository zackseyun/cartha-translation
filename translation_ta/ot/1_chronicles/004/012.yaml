base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/012.yaml
  text: Eshton fathered Beth-rapha[a], Paseah, and Tehinnah, the father of Ir-nahash[b]. These were the men of Rekah.
translation:
  language: ta
  text: எஷ்தோன் பேத்-ராப்பாவையும், பாசேயாவையும், நாகாஷ்-ஊரின் தந்தையான தெஹின்னாவையும்[a] பெற்றான். இவர்கள் ரேகாவைச் சேர்ந்த ஆண்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நாகாஷ்-ஊரின் தந்தை” என்பது “நாகாஷ்-ஊரை நிறுவியவர்” என்றும் பொருள்படலாம். வம்சவரலாறுகளில் “தந்தை” என்பது உடனடி உயிரியல் தந்தையை மட்டுமல்லாமல், முன்னோரையோ ஒரு குடியிருப்பின் நிறுவுநரையோ குறிக்கலாம். “நாகாஷ்-ஊர்” என்பதற்கு “நாகாஷின் நகரம்” என்றும் பொருள் இருக்கலாம்; இங்கு அது ஓர் இடப்பெயராகத் தெரிகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹלִיד
  choice: பெற்றான்
  rationale: வம்சவரலாற்றுச் சூழலில் ילד என்பதன் ஹிபில் வடிவம் ஒருவரைப் பெற்றெடுத்து வம்சம் உருவாக்குவதைக் குறிக்கிறது. தமிழில் ஆண் எழுவாயுடன் ‘பெற்றான்’ என்பது இயல்பாகவும் சுருக்கமாகவும் உள்ளது.
- source_word: בֵּית רָפָא
  choice: பேத்-ராப்பா
  rationale: பெயர்ப்பட்டியலின் இணை அமைப்பு இதை ‘ராப்பாவின் வீடு’ என்று மொழிபெயர்ப்பதைவிட ஒரு சிறப்புப்பெயராக ஒலிபெயர்ப்பதை ஆதரிக்கிறது.
- source_word: פָּסֵחַ
  choice: பாசேயா
  rationale: இது ஒரு சிறப்புப்பெயர்; எபிரெய ஒலிப்பை நவீன தமிழில் வாசிக்கத்தக்க வகையில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: תְּחִנָּה
  choice: தெகின்னா
  rationale: வேறு இடங்களில் பொதுப்பெயருக்குரிய பொருள் இருந்தாலும், இங்கு இது ஒருவரின் பெயராக இருப்பதால் மொழிபெயர்க்காமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: אֲבִי עִיר נָחָשׁ
  choice: நாகாஸ்-ஊரின் தந்தையான
  rationale: אֲבִי என்பதன் ‘தந்தை’ என்ற உருவகம் அப்படியே வைக்கப்பட்டுள்ளது; அது உயிரியல் தந்தையையோ முன்னோரையோ ஓர் இடத்தின் நிறுவுநரையோ குறிக்கக்கூடும். עִיר נָחָשׁ இங்கு இடப்பெயராகப் புரிந்துகொள்ளப்பட்டு, அதன் கூறுகள் தமிழில் தெளிவாகத் தெரிய ‘நாகாஸ்-ஊர்’ என வழங்கப்பட்டுள்ளது.
- source_word: אֵלֶּה אַנְשֵׁי רֵכָה
  choice: இவர்கள் ரேகாவைச் சேர்ந்தவர்கள்
  rationale: சொல்லுக்கு சொல் ‘ரேகாவின் மனிதர்கள்’ என்பதைக் காட்டிலும், ஒரு குலம் அல்லது இடத்தைச் சேர்ந்தவர்களைக் குறிக்கும் இயல்பான நவீனத் தமிழ் நடை இது.
- source_word: רֵכָה
  choice: ரேகா
  rationale: இது குலப்பெயராகவோ இடப்பெயராகவோ இருக்கக்கூடிய சிறப்புப்பெயர் என்பதால் ஒலிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: ‘நாகாஸ்-ஊரின் தந்தை’ என்பதன் தொடர்பு
  choice: ‘தந்தை’ என்ற எபிரெய உருவகத்தை முதன்மை உரையில் காத்து, அதன் விரிந்த வம்ச/நிறுவுநர் பொருளை அடிக்குறிப்பில் காட்டுதல்
  alternative: ‘நாகாஸ்-ஊரை நிறுவியவர்’ என்று நேரடியாக மொழிபெயர்த்தல்
  rationale: மூலத்தில் உயிரியல் தந்தை, முன்னோர், அல்லது நிறுவுநர் என்ற சாத்தியங்கள் முழுமையாகத் தீர்மானிக்கப்படவில்லை; ஆகவே அந்தத் தெளிவின்மையைத் தீர்த்துவிடாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க தமிழ் நடை பயன்படுத்தப்பட்டுள்ளது. அரிய சிறப்புப்பெயர்கள் வாசிக்க ஏற்றவாறு ஒலிபெயர்க்கப்பட்டுள்ளன; எபிரெய வம்சவரலாற்றின் சுருக்கமும் ‘தந்தை’ என்ற சொல்லிலுள்ள உண்மையான பொருள் தெளிவின்மையும் காக்கப்பட்டுள்ளன.
