  text: וְ/יוֹקִ֞ים וְ/אַנְשֵׁ֣י כֹזֵבָ֗א וְ/יוֹאָ֧שׁ וְ/שָׂרָ֛ף אֲשֶׁר בָּעֲל֥וּ לְ/מוֹאָ֖ב וְ/יָשֻׁ֣בִי לָ֑חֶם וְ/הַ/דְּבָרִ֖ים עַתִּיקִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/022.yaml
  text: and Jokim[a], and the men of Cozeba, and Joash, and Saraph, who ruled in Moab and returned to Lehem[c][b]. These records are ancient.
translation:
  language: ta
  text: யோகீம், கோசேபாவைச் சேர்ந்த ஆண்கள், மோவாபில் அதிகாரம் செலுத்திய[a] யோவாஷ் மற்றும் சாராப், யாஷுபி-லேகேம்[b] ஆகியோர். இக்காரியங்கள் பண்டையவை[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மோவாபை உடைமைகொண்ட,’ ‘மோவாபில் தலைவர்களான,’ அல்லது ஒருவேளை ‘மோவாபியருடன் திருமண உறவுகொண்ட’ என்றும் பொருள்கொள்ளலாம். எபிரெயத் தொடர் சுருக்கமாகவும் பொருள் உறுதியற்றதாகவும் உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெய வாசகம் உறுதியற்றது. இது ‘யாஷுபி-லேகேம்’ (அல்லது ‘யாஷுப்-லேகேம்’) என்ற தனிப்பெயராக இருக்கலாம்; அல்லது ‘லேகேமுக்குத் திரும்பினர்’ என்ற வினைத்தொடராகவும் வாசிக்கலாம். லேகேமைப் பெத்லகேமுடன் தொடர்புபடுத்துவோரும் உண்டு.
    reason: alternative_reading
  - marker: c
    text: 'வேறு மொழிபெயர்ப்பு: ‘இவை பண்டைக்காலத்தைச் சேர்ந்தவை’ அல்லது ‘இக்காரியங்கள் முற்காலத்தவை.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹקִים
  choice: யோகீம்
  rationale: வம்சப்பட்டியல் சூழலில் இது ஓர் ஆள்பெயர்; எபிரெய ஒலிப்புக்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டது.
- source_word: אַנְשֵׁי כֹזֵבָא
  choice: கோசேபாவைச் சேர்ந்த ஆண்கள்
  rationale: אַנְשֵׁי என்பது குறிப்பாக ‘ஆண்கள்’ என்னும் பன்மை வடிவம்; כֹזֵבָא இடப்பெயராகக் கருதி ஒலிபெயர்க்கப்பட்டது.
- source_word: יוֹאָשׁ
  choice: யோவாஷ்
  rationale: ஆள்பெயராக ஒலிபெயர்க்கப்பட்டது.
- source_word: שָׂרָף
  choice: சாராப்
  rationale: இது வம்சப்பட்டியலில் வரும் ஆள்பெயர்; பொதுப்பெயரின் பொருளாக மொழிபெயர்க்காமல் ஒலிபெயர்க்கப்பட்டது.
- source_word: אֲשֶׁר בָּעֲלוּ לְמוֹאָב
  choice: மோவாபில் அதிகாரம் செலுத்திய
  rationale: בעל என்ற வினை இங்கு உடைமைகொள்ளுதல், தலைவர்களாக இருத்தல், ஆட்சி செய்தல் ஆகிய பொருட்களைத் தரக்கூடியது. தெளிவான இயல்பான தமிழுக்காக ‘அதிகாரம் செலுத்திய’ எனத் தரப்பட்டு, மூலத்தின் நிச்சயமின்மை அடிக்குறிப்பில் காக்கப்பட்டது.
- source_word: יָשֻׁבִי לָחֶם
  choice: யாஷுபி-லேகேம்
  rationale: WLC உயிர்க்குறியீடும் வாக்கிய அமைப்பும் இதனை இணைந்த தனிப்பெயராக வாசிக்க இடமளிக்கின்றன. ‘லேகேமுக்குத் திரும்பினர்’ என்ற வினைத்தொடர் வாசிப்பும் சாத்தியமாதலால் அடிக்குறிப்பில் தரப்பட்டது.
- source_word: הַדְּבָרִים עַתִּיקִים
  choice: இச்செய்திகள் பழங்காலத்தவை
  rationale: דְּבָרִים என்பதற்கு சொற்கள், காரியங்கள், செய்திகள் போன்ற பொருட்கள் உண்டு. இவ்வம்சப்பட்டியல் குறிப்பில் ‘செய்திகள்’ இயல்பாகவும் மூலத்திற்கு நெருக்கமாகவும் உள்ளது; ‘பதிவுகள்’ என்று தேவையின்றி குறிப்பாக்கப்படவில்லை.
