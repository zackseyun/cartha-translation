translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, எளிதில் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. பெயர்கள் எபிரெய வடிவங்களுக்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டன. மிகவும் கடினமான மூலவாசகத்தின் நிச்சயமின்மை முதன்மை உரையைச் சிக்கலாக்காமல் அடிக்குறிப்புகளில் வெளிப்படையாகக் காக்கப்பட்டது.
