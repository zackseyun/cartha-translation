base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/028.yaml
  text: They lived in Beer-sheba[a], Moladah[b], and Hazar-shual.
translation:
  language: ta
  text: அவர்கள் பெயேர்செபா, மோலாதா, ஹசார்-சுவால் ஆகிய இடங்களில் குடியிருந்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  choice: குடியிருந்தார்கள்
  rationale: ישׁב என்பதன் வழக்கமான பொருள் ஓர் இடத்தில் வசித்தல் அல்லது குடியிருத்தல். குடியேறிய தொடக்க நிகழ்வை மட்டும் உணர்த்தாமல், வாழ்ந்துவந்த நிலையை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: בִּבְאֵר שֶׁבַע
  choice: பெயெர்-செபா
  rationale: எபிரெய இடப்பெயரின் ஒலிப்பெயர்ப்பு. בְּאֵר இன் இரண்டு அசைகளையும் தெளிவாகக் காட்டுவதற்குப் ‘பெயெர்’ என்றும், பெயரின் இரு கூறுகளைக் காட்ட இணைப்புக்குறியுடனும் வழங்கப்பட்டுள்ளது.
- source_word: וּמוֹלָדָה
  choice: மோலாதா
  rationale: எபிரெய மூலத்தின் உயிரொலி அமைப்பைப் பின்பற்றிய இடப்பெயர் ஒலிப்பெயர்ப்பு.
- source_word: וַחֲצַר שׁוּעָל
  choice: அசார்-சூவால்
  rationale: மசோரா உயிர்க்குறிகளுடன் உள்ள חֲצַר שׁוּעָל என்ற இருகூறு இடப்பெயரின் ஒலிப்பெயர்ப்பு; எபிரெய ח ஒலிக்குத் தமிழில் நிலையான நேரிணை இல்லாததால் இயல்பான ‘அ’ தொடக்கம் பயன்படுத்தப்பட்டுள்ளது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், வம்சவரலாற்றுச் சூழலுக்கு ஏற்ற சுருக்கமான, கண்ணியமான நடை. எபிரெய இணைப்புச் சொற்கள் தமிழில் இயல்பான பட்டியல் அமைப்பாக ‘ஆகிய இடங்களில்’ என வழங்கப்பட்டுள்ளன; அனைத்து இடப்பெயர்களும் மொழிபெயர்க்கப்படாமல் ஒலிப்பெயர்க்கப்பட்டுள்ளன.
