base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/031.yaml
  text: and in Beth-marcaboth[a], and in Hazar-susim, and in Beth-biri, and in Shaaraim[d][c][b]. These were their cities until David reigned.
translation:
  language: ta
  text: பெத்-மர்காபோத்திலும்[a], ஹசார்-சூசீமிலும்[b], பெத்-பிரீயிலும்[c], ஷாராயீமிலும்[d] குடியிருந்தார்கள். தாவீது அரசனாகும்வரை இவையே அவர்களுடைய பட்டணங்களாக இருந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பெத்-மர்காபோத்” என்பதன் கூறுகளைச் சொற்பொருள்படி “தேர்களின் வீடு” என்று மொழிபெயர்க்கலாம்; இங்கு அது இடப்பெயராக வழங்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: “ஹசார்-சூசீம்” என்பதன் கூறுகளைச் சொற்பொருள்படி “குதிரைகளின் முற்றம்” அல்லது “குதிரைகளின் கிராமம்” என்று மொழிபெயர்க்கலாம்; இங்கு அது இடப்பெயராக வழங்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: c
    text: “பெத்-பிரீ” என்ற இடப்பெயரின் இறுதிக் கூறு வேறு ஒலிபெயர்ப்பு மரபுகளில் சற்றே மாறுபட்டு எழுதப்படலாம்.
    reason: alternative_reading
  - marker: d
    text: “ஷாராயீம்” என்ற பெயர் சொற்பிறப்பின்படி “இரண்டு வாயில்கள்” என்னும் பொருளைக் கொண்டிருக்கலாம்; இங்கு அது இடப்பெயராக வழங்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְ/בֵית מַרְכָּבוֹת
  choice: பெத்-மர்காபோத்திலும்
  rationale: இது குடியிருப்புகளின் பட்டியலில் வரும் இடப்பெயர் என்பதால், அதன் கூறுகளை மொழிபெயர்க்காமல் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது; בְּ முன்னிடைச்சொல் ‘-இல்’ என இயல்பாக இணைக்கப்பட்டுள்ளது.
- source_word: וּ/בַ/חֲצַר סוּסִים
  choice: அத்சார்-சூசீமிலும்
  rationale: இடப்பெயராகக் கருதி ஒலிபெயர்க்கப்பட்டுள்ளது. חֲצַר என்பதன் தனிப்பொருள் ‘முற்றம்’ அல்லது ‘கிராமம்’ என்றும், סוּסִים என்பதன் பொருள் ‘குதிரைகள்’ என்றும் இருக்கலாம்; ஆனால் இங்கு பெயரின் தன்மை பாதுகாக்கப்படுகிறது.
- source_word: וּ/בְ/בֵית בִּרְאִי
  choice: பெத்-பிரீயிலும்
  rationale: சுற்றியுள்ள பெயர்களுக்கு இணையான இடப்பெயராக ஒலிபெயர்க்கப்பட்டுள்ளது; இறுதிக் கூறின் உச்சரிப்பு மரபில் சிறிய நிச்சயமின்மை இருப்பது அடிக்குறிப்பில் சுட்டப்பட்டுள்ளது.
- source_word: וּֽ/בְ/שַׁעֲרָיִם
  choice: ஷாராயீமிலும்
  rationale: ‘இரண்டு வாயில்கள்’ என்ற சொற்பிறப்புப் பொருள் சாத்தியமானாலும், பட்டணப் பட்டியல் சூழலில் இடப்பெயராக ஒலிபெயர்ப்பதே பொருத்தமானது.
- source_word: אֵלֶּה עָרֵי/הֶם
  choice: இவையே அவர்களுடைய பட்டணங்களாக இருந்தன
  rationale: אֵלֶּה முன் பட்டியலிடப்பட்ட இடங்களைக் குறிக்கிறது. עִיר பெரிய நகரத்தை மட்டும் அல்லாமல் பட்டணத்தையும் குறிக்கக்கூடும்; இச்சூழலில் ‘பட்டணங்கள்’ இயல்பானது.
- source_word: עַד מְלֹךְ דָּוִיד
  choice: தாவீது அரசனாகும்வரை
  rationale: עַד உடன் வரும் מְלֹךְ கால எல்லையைக் குறிக்கிறது. எபிரெயச் சொற்றொடர் தாவீதின் ஆட்சியேற்றத்தையோ ஆட்சிக்காலத் தொடக்கத்தையோ சுருக்கமாகக் குறிக்கலாம்; தமிழில் தெளிவான கால எல்லையாக வழங்கப்பட்டுள்ளது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. எபிரெய மூலத்தில் வினைச்சொல் வெளிப்படையாக இல்லாத பட்டியல் தொடரைத் தமிழில் முழுமையான வாக்கியமாக்க ‘குடியிருந்தார்கள்’ சேர்க்கப்பட்டுள்ளது; முந்தைய வசனங்களின் குடியிருப்பு பட்டியல் சூழல் இதை ஆதரிக்கிறது. இடப்பெயர்கள் மொழிபெயர்க்கப்படாமல் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளன.
