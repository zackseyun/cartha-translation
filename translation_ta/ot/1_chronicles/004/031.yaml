    issue: The place name Hazar-susim is transliterated as “அத்சார்-சூசீம்.”
    rationale: The Hebrew חֲצַר begins with ח (ḥet), conventionally represented here by “ஹ,” not by an initial “அத்.” This obscures the source place name and conflicts with the English audit trail’s “Hazar-susim.”
