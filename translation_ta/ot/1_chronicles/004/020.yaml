translation_notes:
  register: நவீன நிலையான தமிழில், சுருக்கமான வம்சப்பட்டியல் நடையும் மரியாதைமிக்க வேதாகமப் பதிவுத் தொனியும் பேணப்பட்டுள்ளன. தனிப்பெயர்கள் பாரம்பரிய ஆங்கில வடிவங்களிலிருந்து அல்லாமல் எபிரெய ஒலிவடிவத்திலிருந்து தமிழாக்கப்பட்டுள்ளன. மூலத்தில் ‘மற்றும்’ இணைப்புகள் இருந்தாலும், தமிழில் இயல்பான பெயர்ப்பட்டியல் நிறுத்தக்குறிகளால் அவை வெளிப்படுத்தப்பட்டுள்ளன.
