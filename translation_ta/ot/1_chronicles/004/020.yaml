base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/020.yaml
  text: 'The sons of Shimon: Amnon and Rinnah[a], Ben-Hanan and Tilon[b]. And the sons of Ishi: Zoheth and Ben-Zoheth.'
translation:
  language: ta
  text: 'ஷிமோனின் மகன்கள்: அம்னோன், ரின்னா, பென்-ஹனான்[a], தொலோன். யிஷியின் மகன்கள்: ஸோஹேத், பென்-ஸோஹேத்[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஹனானின் மகன்” எனப் புரிந்துகொள்ளலாம்; ஆயினும், இந்த வம்சப்பட்டியலில் இது ஒரு தனிப்பெயராக இருப்பதே அதிக சாத்தியம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “ஸோஹேத்தின் மகன்” எனப் புரிந்துகொள்ளலாம்; ஆயினும், இந்த வம்சப்பட்டியலில் இது ஒரு தனிப்பெயராக இருப்பதே அதிக சாத்தியம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי שִׁימוֹן
  choice: ஷிமோனின் மகன்கள்
  rationale: בְּנֵי என்பது வம்சப்பட்டியலை அறிமுகப்படுத்தும் בֵּן என்பதன் பன்மை இணைப்பு வடிவம். வசனத்தின் தொடக்கத்தில் உள்ள וּ இயல்பான தமிழ் பட்டியல் நடைக்காக தனியே மொழிபெயர்க்கப்படவில்லை.
- source_word: אַמְנוֹן
  choice: அம்னோன்
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் நேரடியாகப் பிரதிபலிக்கும் எழுத்துப்பெயர்ப்பு.
- source_word: וְרִנָּה
  choice: ரின்னா
  rationale: வம்சப்பட்டியலிலுள்ள தனிப்பெயர்; பட்டியல் அமைப்பே இணைப்பைத் தெளிவாக்குவதால் וְ என்பதற்கு தனியாக ‘மற்றும்’ சேர்க்கப்படவில்லை.
- source_word: בֶּן חָנָן
  choice: பென்-ஆனான்
  rationale: சொல்லளவில் ‘ஆனானின் மகன்’ எனப் புரிந்துகொள்ள முடிந்தாலும், தொடர்ச்சியான பெயர்ப்பட்டியலில் இது ஒரு கூட்டுத் தனிப்பெயராகச் செயல்படுவது அதிக சாத்தியம். இணைப்புக்குறி அந்தப் பெயரியல் வாசிப்பைக் காட்டுகிறது.
- source_word: ו/תולון
  choice: திலோன்
  rationale: மசோரா உயிர்க்குறிப்பை அடிப்படையாகக் கொண்ட தனிப்பெயர் எழுத்துப்பெயர்ப்பு; இது பட்டியலின் அடுத்த உறுப்பாக வழங்கப்படுகிறது.
- source_word: וּבְנֵי יִשְׁעִי
  choice: யிஷியின் மகன்கள்
  rationale: மீண்டும் வரும் வம்சப்பட்டியல் வாய்பாட்டை நேரடியாக மொழிபெயர்க்கிறது. ‘வழித்தோன்றல்கள்’ என்பதும் சூழலில் சாத்தியமாயினும், உடனடி தொடரமைப்பு ‘மகன்கள்’ என்பதையே ஆதரிக்கிறது.
- source_word: זוֹחֵת
  choice: சோகேத்
  rationale: எபிரெய தனிப்பெயரின் ஒலிக்கு நெருக்கமான தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: וּבֶן זוֹחֵת
  choice: பென்-சோகேத்
  rationale: ‘மகன்’ என்பதற்குப் பின் வேறொரு தனிப்பெயர் வராததாலும், இது பெயர்களின் பட்டியலில் நிற்பதாலும், முழுச் சொற்றொடரும் கூட்டுத் தனிப்பெயராக எடுத்துக்கொள்ளப்படுகிறது.
