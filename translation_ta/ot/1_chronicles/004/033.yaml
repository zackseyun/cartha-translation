base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/033.yaml
  text: And all their villages that were around these cities, as far as Baal—these were their settlements, and they had their genealogy recorded.
translation:
  language: ta
  text: இந்தப் பட்டணங்களைச் சுற்றிலும், பாகால் வரையிலும் இருந்த அவர்களுடைய எல்லாக் கிராமங்கள்[a]. இவையே அவர்களுடைய குடியிருப்புகள்; அவர்கள் வம்சவரிசைப்படி பதிவு செய்துகொண்டார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கிராமங்கள்’ என்பதற்கு ‘சிற்றூர்கள்’ அல்லது ‘குடியிருப்புகள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அவர்கள் வம்சவரிசைப் பதிவில் சேர்க்கப்பட்டிருந்தார்கள்.’ எபிரெயச் சொற்றொடர் வம்சவரிசையின் அடிப்படையிலான பதிவைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַצְרֵיהֶם
  choice: அவர்களுடைய கிராமங்கள்
  rationale: חָצֵר என்பது வேலி அடைப்பு அல்லது முற்றம் என்றும், சூழலுக்கேற்ப சிற்றூர் அல்லது குடியிருப்பு என்றும் பொருள்படும். பட்டணங்களைச் சுற்றியிருந்த வாழிடங்களைக் குறிக்கும் இச்சூழலில் ‘கிராமங்கள்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: אֲשֶׁר סְבִיבוֹת הֶעָרִים הָאֵלֶּה
  choice: இந்தப் பட்டணங்களைச் சுற்றிலும் இருந்த
  rationale: முன்னர் குறிப்பிடப்பட்ட பட்டணங்களைச் சுற்றி அந்தக் கிராமங்கள் அமைந்திருந்த இடத்தொடர்பை நவீன தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: עַד בָּעַל
  choice: பாகால் வரையிலும்
  rationale: עַד எல்லையையோ விரிவின் கடைசி இடத்தையோ குறிக்கிறது; இங்கு בָּעַל ஓர் இடப்பெயர் என்பதால் ‘பாகால்’ என்று ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: זֹאת מוֹשְׁבֹתָם
  choice: அவர்களுடைய குடியிருப்புகளாக இருந்தன
  rationale: זֹאת இலக்கண வடிவில் ஒருமையாக இருந்தாலும், முந்தைய இடங்களின் பட்டியலைத் தொகுத்துக் குறிக்கிறது. தமிழில் பன்மைப் பொருளோடு இயல்பாக அமைக்கப்பட்டுள்ளது; מוֹשָׁב வாழும் இடம் அல்லது குடியேற்றத்தைக் குறிக்கிறது.
- source_word: וְהִתְיַחְשָׂם לָהֶם
  choice: அவர்கள் தங்களை வம்சாவளிப்படி பதிவு செய்துகொண்டார்கள்
  rationale: יחש என்பதன் ஹித்பாயேல் வடிவம் வம்சாவளியின் அடிப்படையில் ஒருவரைப் பதிவு செய்தல் அல்லது பட்டியலிடுதலைக் குறிக்கிறது. எபிரெயச் சொற்றொடரின் தற்சார்பு நுணுக்கத்தையும் வம்சாவளிப் பதிவு என்ற பொருளையும் இத்தேர்வு காக்கிறது.
