translation:
  language: ta
  text: சல்லூம் அவனுடைய மகன்; மிப்சாம் அவனுடைய மகன்; மிஷ்மா அவனுடைய மகன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׁלֻּם
  choice: சல்லூம்
  rationale: எபிரேய ஆள்பெயரின் ஒலிப்பை நவீனத் தமிழில் இயன்றவரை நெருக்கமாக எழுத்துப்பெயர்த்துள்ளது.
- source_word: בְּנוֹ
  choice: அவனுடைய மகன்
  rationale: בֵּן என்ற பெயர்ச்சொல்லுடன் சேர்ந்த மூன்றாம் நபர் ஆண்பால் ஒருமை உரிமை விகுதி நேரடியாக ‘அவனுடைய மகன்’ என்று பொருள்படும்; வம்சப்பட்டியலின் சுருக்கமான தொடர் அமைப்பும் காக்கப்படுகிறது.
- source_word: מִבְשָׂם
  choice: மிப்சாம்
  rationale: எபிரேய ஆள்பெயர் மொழிபெயர்க்கப்படாமல், அதன் ஒலிப்புக்கு ஏற்ப தமிழில் எழுத்துப்பெயர்க்கப்பட்டுள்ளது; שׂ இங்கு ‘ச்’ ஒலியாகக் கொடுக்கப்பட்டுள்ளது.
- source_word: מִשְׁמָע
  choice: மிஷ்மா
  rationale: எபிரேய ஆள்பெயர் மொழிபெயர்க்கப்படாமல் தமிழில் எழுத்துப்பெயர்க்கப்பட்டுள்ளது; இறுதி ע தனியான இயல்பான தமிழ் ஒலியால் காட்டப்படவில்லை.
