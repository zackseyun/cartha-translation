  naturalness: நடை பொதுவாக நவீன நிலையான தமிழுக்கு ஏற்றது. ‘தாக்கி வீழ்த்தினார்கள்’ என்பது கூடாரங்களுக்கும் மனிதர்களுக்கும் ஒரேபோல் பொருந்தும்போது சற்றே இயல்பற்றதாக உள்ளது; ‘தாக்கினார்கள்’ என்பது மூலத்தின் ஒரே வினை அமைப்பையும் காக்கிறது. தேவையற்ற விளக்க வாக்கியத்தையும் இரண்டாம் அடிக்குறிப்பையும் நீக்குவதால் வாசிப்பு தெளிவடைகிறது.
  terminology: ‘எசேக்கியா,’ ‘மெயூனியர்கள்,’ ‘மந்தைகள்,’ ‘மேய்ச்சல் நிலம்’ ஆகியவை ஏற்றவை. ‘முற்றழிவுக்கு அர்ப்பணித்தார்கள்’ என்பது חרם-இன் தனித்துவமான பொருளைத் தக்கவைக்கிறது. ‘அவர்களையும் அவற்றையும்’ என்பது மனிதக் குழுவையும் அவர்களது கூடாரங்களையும் வேறுபடுத்தி, மூலத்தின் பன்மைச் சுட்டலைத் தகுந்தவாறு வழங்குகிறது.
