  text: וַ/יָּבֹ֡אוּ אֵלֶּה֩ הַ/כְּתוּבִ֨ים בְּ/שֵׁמ֜וֹת בִּ/ימֵ֣י יְחִזְקִיָּ֣הוּ מֶֽלֶךְ יְהוּדָ֗ה וַ/יַּכּ֨וּ אֶת אָהֳלֵי/הֶ֜ם וְ/אֶת ה/מעינים אֲשֶׁ֤ר נִמְצְאוּ שָׁ֨מָּ/ה֙ וַ/יַּחֲרִימֻ/ם֙ עַד הַ/יּ֣וֹם הַ/זֶּ֔ה וַ/יֵּשְׁב֖וּ תַּחְתֵּי/הֶ֑ם כִּֽי מִרְעֶ֥ה לְ/צֹאנָ֖/ם שָֽׁם׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/041.yaml
  text: These[a], who were recorded by name, came in the days of Hezekiah king of Judah, and they struck down their tents and the Meunites who were found there, and devoted them to destruction to this day. Then they settled in their place, because there was pasture there for their flocks.
translation:
  language: ta
  text: பெயர்ப் பட்டியலில் பதிவுசெய்யப்பட்டிருந்த இவர்கள் யூதாவின் அரசன் எசேக்கியாவின் நாட்களில் அங்கு வந்து, அவர்களுடைய கூடாரங்களையும் அங்கே காணப்பட்ட மெயூனியர்களையும்[a] தாக்கினார்கள். அவர்களையும் அவற்றையும் இந்நாள்வரை முற்றழிவுக்கு அர்ப்பணித்தார்கள். பின்னர் அவர்கள் அவர்களுடைய இடத்தில் குடியேறினார்கள்; ஏனெனில் அங்கே அவர்களுடைய மந்தைகளுக்கு மேய்ச்சல் நிலம் இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்குள்ள எபிரெயச் சொல் கடினமானது. மரபாக இது ‘மெயூனியர்கள்’ என்ற மக்கள் இனப்பெயராகப் புரிந்துகொள்ளப்படுகிறது; சிலர் இதை ‘குடியிருப்புகள்’ அல்லது ‘வசிப்பிடங்கள்’ என்று புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
lexical_decisions:
- source_word: הַכְּתוּבִים בְּשֵׁמוֹת
  choice: பெயர்ப் பட்டியலில் எழுதப்பட்டிருந்த
  rationale: பெயர்களின்படி பதிவுசெய்யப்பட்ட நபர்களைக் குறிக்கும் நிர்வாக/வம்சாவளிப் பதிவு சார்ந்த சொற்றொடர்; இயல்பான நவீனத் தமிழில் பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: וַיָּבֹאוּ
  choice: அங்கு வந்து
  rationale: בוא என்பதன் அடிப்படைப் பொருளான ‘வந்து/அடைந்து’ என்பதைக் காக்கிறது; சூழல் கருதி ‘அங்கு’ வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது.
- source_word: וַיַּכּוּ
  choice: தாக்கி வீழ்த்தினார்கள்
  rationale: இராணுவச் சூழலில் தாக்கி வெல்வது அல்லது கொல்வது என்ற வலிமையான பொருளைக் காட்டுகிறது; கொல்லப்பட்ட அளவைத் தேவையின்றி மிகத் துல்லியமாக நிர்ணயிக்கவில்லை.
- source_word: אָהֳלֵיהֶם
  choice: அவர்களுடைய கூடாரங்கள்
  rationale: சாதாரண கூடாரங்களைக் குறிக்கும் எபிரெயச் சொல்லின் நேரடிப் பொருளைத் தக்கவைக்கிறது.
- source_word: המעינים
  choice: மெயூனியர்கள்
  rationale: மெய்யெழுத்துப் பாடத்தை மரபாக ஒரு மக்கள் இனப்பெயராகப் புரிந்துகொள்வது சூழலுக்குப் பொருந்துகிறது; பாடம் கடினமானதால் மாற்றுப் புரிதல் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אֲשֶׁר נִמְצְאוּ שָׁמָּה
  choice: அங்கே காணப்பட்ட
  rationale: மெயூனியர்கள் என்ற மக்கள் இன வாசிப்புடன் இயல்பாக இணைகிறது.
- source_word: וַיַּחֲרִימֻם
  choice: அவர்களை முற்றழிவுக்கு அர்ப்பணித்தார்கள்
  rationale: חרם என்பதிலுள்ள அழிவுக்கென ஒதுக்குதல் என்ற சிறப்புப் பொருளைக் காக்கிறது; வெறும் ‘அழித்தார்கள்’ என்பதைவிட மூலத்தின் வழிபாட்டு/போரியல் நுட்பத்தை வெளிப்படுத்துகிறது.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: இந்நாள்வரை
  rationale: எபிரெய மொழியின் வழக்கமான காலக் குறிப்பைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: וַיֵּשְׁבוּ תַּחְתֵּיהֶם
  choice: அவர்களுடைய இடத்தில் குடியேறினார்கள்
  rationale: ‘அவர்களுக்குப் பதிலாக/அவர்களின் இடத்தில்’ என்ற இடமாற்றுக் குடியேற்றப் பொருளைத் தெளிவாக்குகிறது.
- source_word: מִרְעֶה לְצֹאנָם
  choice: அவர்களுடைய மந்தைகளுக்கு மேய்ச்சல் நிலம்
  rationale: מִרְעֶה-வின் மேய்ச்சல் நிலம் என்ற பொருளையும், செம்மறியாடுகள் மற்றும் வெள்ளாடுகள் இரண்டையும் உள்ளடக்கக்கூடிய צֹאן-க்கு ‘மந்தைகள்’ என்ற விரிவான சொல்லையும் பயன்படுத்துகிறது.
theological_decisions:
- issue: חרם என்பதன் பொருள்
  choice: முற்றழிவுக்கு அர்ப்பணித்தார்கள்
  alternative: முற்றிலும் அழித்தார்கள் / அழிவுத் தடையின் கீழ் வைத்தார்கள்
  rationale: இது வெறும் இராணுவ அழிவைக் காட்டிலும் அழிவுக்கென ஒதுக்குதல் என்ற தொழில்நுட்ப நுட்பத்தைக் கொண்டிருக்கலாம்; எந்தக் குறிப்பிட்ட சமயப் பாரம்பரிய விளக்கத்தையும் இறக்குமதி செய்யாமல் அந்த இறுக்கத்தைத் தக்கவைக்கிறது.
- issue: עַד הַיּוֹם הַזֶּה எதனுடன் தொடர்புடையது
  choice: அவர்கள் இல்லாமற்போனார்கள் என்பது இந்நாள்வரை நீடித்ததாகத் தெளிவாக்கப்பட்டது
  alternative: ‘இந்நாள்வரை அவர்களை முற்றழிவுக்கு அர்ப்பணித்தார்கள்’ என்று வினையுடன் நேரடியாக இணைத்தல்
  rationale: எபிரெயச் சொற்றொடர் சொற்படியாக வினைக்குப் பின் வந்தாலும், ஒரே அழிப்புச் செயல் தொடர்ந்து நடைபெறுவதாகத் தமிழில் தவறாகப் புரியாமல் அதன் நீடித்த விளைவை வெளிப்படுத்துகிறது; இதை அடிக்குறிப்பில் குறிப்பிட்டுள்ளோம்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்தியுள்ளது. ‘முற்றழிவுக்கு அர்ப்பணித்தார்கள்’ என்பது மூலத்தின் தொழில்நுட்பப் பொருளைத் தக்கவைக்கும் சற்றே உயர்ந்த நடை. உரையில் [a], [b] ஆகிய எல்லா அடிக்குறிப்பு குறிகளும் இடம்பெற்றுள்ளன.
