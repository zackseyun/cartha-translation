  revised_text: பெயர்ப் பட்டியலில் பதிவுசெய்யப்பட்டிருந்த இவர்கள் யூதாவின் அரசன் எசேக்கியாவின் நாட்களில் அங்கு வந்து, அவர்களுடைய கூடாரங்களையும் அங்கே காணப்பட்ட மெயூனியர்களையும்[a] தாக்கினார்கள். அவர்களையும் அவற்றையும் இந்நாள்வரை முற்றழிவுக்கு அர்ப்பணித்தார்கள். பின்னர் அவர்கள் அவர்களுடைய இடத்தில் குடியேறினார்கள்; ஏனெனில் அங்கே அவர்களுடைய மந்தைகளுக்கு மேய்ச்சல் நிலம் இருந்தது.
