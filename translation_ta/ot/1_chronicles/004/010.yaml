source:
  edition: WLC
  text: וַ/יִּקְרָ֣א יַ֠עְבֵּץ לֵ/אלֹהֵ֨י יִשְׂרָאֵ֜ל לֵ/אמֹ֗ר אִם בָּרֵ֨ךְ תְּבָרֲכֵ֜/נִי וְ/הִרְבִּ֤יתָ אֶת גְּבוּלִ/י֙ וְ/הָיְתָ֤ה יָדְ/ךָ֙ עִמִּ֔/י וְ/עָשִׂ֥יתָ מֵּ/רָעָ֖ה לְ/בִלְתִּ֣י עָצְבִּ֑/י וַ/יָּבֵ֥א אֱלֹהִ֖ים אֵ֥ת אֲשֶׁר שָׁאָֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/010.yaml
  text: And Jabez called on the God of Israel[a], saying, “If you would indeed bless me and enlarge my territory, and let your hand be with me[b], and keep me from harm so that I may not suffer pain!” And God granted what he asked.
translation:
  language: ta
  text: யாபேஸ் இஸ்ரவேலின் கடவுளை நோக்கி, “நீர் என்னை நிச்சயமாக ஆசீர்வதித்து, என் எல்லையை விரிவாக்கி, உமது கை என்னோடு இருக்கவும், எனக்கு வேதனை[b] ஏற்படாதபடி என்னைத் தீங்கிலிருந்து[a] காத்தருளுவீராக!” என்று வேண்டினான். கடவுள் அவன் கேட்டதை அருளினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தீமையிலிருந்து.” எபிரெயச் சொல் ஒழுக்கத் தீமையையோ தீங்கு விளைவிக்கும் துன்பத்தையோ குறிக்கலாம்; இங்கு வேதனையிலிருந்து பாதுகாப்புக் கோரும் சூழல் “தீங்கு” என்ற பொருளை ஆதரிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “வேதனை” என்ற சொல், முந்தைய வசனத்தில் யாபேஸின் பெயருக்குக் கொடுக்கப்பட்ட விளக்கத்தை எதிரொலிக்கிறது.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: நோக்கி வேண்டிக்கொண்டான்
  rationale: இறைவனிடம் செய்யப்படும் விண்ணப்பம் என்பதால், வெறுமனே ‘அழைத்தான்’ என்பதைவிட ‘நோக்கி வேண்டிக்கொண்டான்’ என்பது இச்சூழலின் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לֵאלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கடவுளை
  rationale: இது இஸ்ரவேலின் கடவுளை அடையாளப்படுத்தும் நேரடியான இணைப்புத் தொடர்.
- source_word: אִם בָּרֵךְ תְּבָרֲכֵנִי
  choice: நீர் என்னை நிச்சயமாக ஆசீர்வதித்து
  rationale: வினையெச்சப் பெயரும் வினையும் சேர்ந்த எபிரெய அமைப்பு வேண்டுகோளை வலியுறுத்துகிறது; ‘நிச்சயமாக’ அந்த வலியுறுத்தலை இயல்பான தமிழில் தருகிறது. אִם தொடங்கும் நிறைவுபெறாத நிபந்தனை வடிவம் இங்கு தீவிரமான விருப்ப வேண்டுதலாகச் செயல்படுகிறது.
- source_word: וְהִרְבִּיתָ אֶת גְּבוּלִי
  choice: என் எல்லையை விரிவாக்கி
  rationale: גְּבוּל என்பது எல்லை அல்லது அந்த எல்லைக்குட்பட்ட நிலப்பரப்பைக் குறிக்கலாம். ‘எல்லையை விரிவாக்கி’ என்பது நிலப்பரப்பு சார்ந்த இயல்பான பொருளைப் பாதுகாக்கிறது; நவீன ‘செல்வாக்கின் பரப்பு’ என்ற உருவகத்தைத் திணிப்பதில்லை.
- source_word: וְהָיְתָה יָדְךָ עִמִּי
  choice: உமது கை என்னோடு இருக்கச் செய்து
  rationale: ‘உமது கை’ என்பது கடவுளின் வல்லமையையும் உதவியையும் குறிக்கும் எபிரெயச் சொல்வழக்கு. தமிழிலும் புரிந்துகொள்ளத்தக்க இந்த உருவகம் அப்படியே பாதுகாக்கப்பட்டுள்ளது.
- source_word: וְעָשִׂיתָ מֵּרָעָה
  choice: தீங்கிலிருந்து என்னைக் காத்தருளும்
  rationale: எபிரெயத் தொடர் சுருக்கமானதும் பொருளில் சற்றுக் கடினமானதும் ஆகும். அடுத்து வரும் வேதனை குறித்த நோக்கத் தொடர் காரணமாக, தீங்கான பேரிடரிலிருந்து பாதுகாப்பதே இங்கு முதன்மைப் பொருள்.
- source_word: לְבִלְתִּי עָצְבִּי
  choice: எனக்கு வேதனை ஏற்படாதபடி
  rationale: עצב என்ற வேர் வேதனை, துன்பம் அல்லது வருத்தத்தைக் குறிக்கிறது. முதல் நபர் பின்னொட்டு காரணமாக ‘நான் வேதனைப்படாதபடி’ என்ற பொருள் சூழலுக்கு ஏற்றது; இது முந்தைய வசனத்திலுள்ள யாபேஸின் பெயர் விளக்கத்தையும் எதிரொலிக்கிறது.
- source_word: וַיָּבֵא אֱלֹהִים אֵת אֲשֶׁר שָׁאָל
  choice: கடவுள் அவன் கேட்டதை அருளினார்
  rationale: இங்குள்ள בוא வினைச்சொல், கேட்டது நிகழும்படி கடவுள் செய்தார், அதாவது வேண்டுகோளை நிறைவேற்றினார் என்ற சொல்வழக்குப் பொருளைக் கொண்டுள்ளது. ‘அருளினார்’ என்பது ஜெப வேண்டுகோளின் சூழலில் இயல்பான தமிழ்.
theological_decisions:
- issue: யாபேஸ் விரிவாக்கும்படி கேட்ட גְּבוּל என்பதன் தன்மை
  choice: சாதாரண நில எல்லையைக் குறிக்கும் வகையில் ‘என் எல்லையை விரிவாக்கி’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘என் செல்வாக்கின் பரப்பை விரிவாக்கி’ என்ற உருவக மொழிபெயர்ப்பு.
  rationale: எபிரெயச் சொல் இயல்பாக எல்லை அல்லது நிலப்பரப்பைக் குறிக்கிறது. உரையில் இல்லாத நவீன செழிப்பு அல்லது செல்வாக்கு சார்ந்த இறையியல் கருத்துகளை மொழிபெயர்ப்பு சேர்ப்பதில்லை.
- issue: வேண்டுதலில் רָעָה என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘தீங்கு’ என்று தரப்பட்டது.
  alternative: ‘தீமை’ என்று மொழிபெயர்த்தல்.
  rationale: வேதனை ஏற்படாதிருப்பது பற்றிய அடுத்த தொடர், ஒழுக்கத் தீமையைவிட தீங்கான துன்பம் அல்லது பேரிடரைக் குறிக்கும் பொருளை ஆதரிக்கிறது. இருப்பினும் ஒழுக்கத் ‘தீமை’ என்ற சாத்தியத்தை அடிக்குறிப்பு பாதுகாக்கிறது.
- issue: אִם கொண்டு தொடங்கும் வேண்டுதலின் வடிவம்
  choice: தமிழில் இயல்பான தீவிர வேண்டுகோளாக ‘காத்தருளும்!’ என்று முடிக்கப்பட்டது.
  alternative: ‘நீர் ... செய்தால்!’ என்று நிறைவுபெறாத நிபந்தனை வாக்கியமாகத் தருதல்.
  rationale: எபிரெயில் வெளிப்படையான நிபந்தனை முடிவு இல்லை; இவ்வமைப்பு தீவிரமான விருப்பத்தையும் வேண்டுதலையும் தெரிவிக்கிறது. தமிழில் பொருளைத் தெளிவாகவும் மரியாதையாகவும் வழங்க வேண்டுகோள் வடிவம் பயன்படுத்தப்பட்டது; எந்தப் பலன்-பரிமாற்றக் கோட்பாடும் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதையான ஜெப நடையுடன் மொழிபெயர்க்கப்பட்டது. ‘உமது கை’ என்ற வேதாகம உருவகம் பாதுகாக்கப்பட்டுள்ளது. நில எல்லையை நவீன செல்வாக்கு அல்லது செழிப்பு கருத்தாக மாற்றாமல், மூலத்தின் சாதாரண நிலப்பரப்பு சார்ந்த பொருள் காக்கப்பட்டுள்ளது.
