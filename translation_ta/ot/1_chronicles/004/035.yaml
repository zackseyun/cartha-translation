  text: and Joel[a], and Jehu son of Joshibiah, son of Seraiah, son of Asiel.
translation:
  language: ta
  text: யோவேலும், யோசிபியாவின் மகனும் செராயாவின் மகனும் அசியேலின் மகனுமான யெகூவும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ
  choice: -உம்
  rationale: பெயர்ப்பட்டியலின் தொடர்ச்சியை இயல்பான தமிழில் காட்ட இணைப்புப் பொருளை ‘-உம்’ என்ற பின்னொட்டால் வெளிப்படுத்துகிறது.
- source_word: יוֹאֵל
  choice: யோவேல்
  rationale: எபிரெய தனிப்பெயரின் ஒலிவடிவத்தைத் தமிழில் அடையாளம் காணத்தக்க மரபான வடிவில் ஒலிபெயர்க்கிறது.
- source_word: יֵהוּא
  choice: யெகூ
  rationale: எபிரெய தனிப்பெயரை அதன் ஒலிக்கு நெருக்கமான, தமிழில் வாசிக்க இயல்பான வடிவில் ஒலிபெயர்க்கிறது.
- source_word: בֶּן
  choice: மகன்
  rationale: வம்சாவளிச் சூத்திரத்தில் உள்ள நேரடியான உறவுச் சொல்லைத் தெளிவாகவும் தொடர்ச்சியாகவும் மொழிபெயர்க்கிறது; இதன் விரிந்த பொருள் சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: יֹשִׁבְיָה
  choice: யோசிபியா
  rationale: எபிரெய தனிப்பெயரைத் தமிழ் ஒலியமைப்புக்கு ஏற்றவாறு ஒலிபெயர்க்கிறது.
- source_word: שְׂרָיָה
  choice: செராயா
  rationale: எபிரெய தனிப்பெயரின் ஒலிவடிவத்தை தெளிவான தமிழ் எழுத்துப்பெயர்ப்பில் தருகிறது.
- source_word: עֲשִׂיאֵל
  choice: அசியேல்
  rationale: எபிரெய தனிப்பெயரை அதன் கூறுகளையும் ஒலியையும் இயன்றவரை பாதுகாத்து ஒலிபெயர்க்கிறது.
theological_decisions: []
translation_notes:
  register: நவீன, தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ஒரே நபர் மூவருக்கும் ‘மகன்’ என்று தவறாகப் புரிந்துகொள்ளப்படாதபடி, எபிரெய வம்சத் தொடரின் உறவுகள் இயல்பான தமிழ் வாக்கிய அமைப்பில் தெளிவுபடுத்தப்பட்டுள்ளன; பட்டியலின் இணைப்புத் தன்மை ‘-உம்’ மூலம் காக்கப்பட்டுள்ளது.
