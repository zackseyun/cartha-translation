source:
  edition: WLC
  text: וְ/אֵ֨לֶּה֙ אֲבִ֣י עֵיטָ֔ם יִזְרְעֶ֥אל וְ/יִשְׁמָ֖א וְ/יִדְבָּ֑שׁ וְ/שֵׁ֥ם אֲחוֹתָ֖/ם הַצְלֶלְפּֽוֹנִי׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/003.yaml
  text: 'These were the sons of the father of Etam: Jezreel[a], Ishma, and Idbash[b]; and the name of their sister was Hazzelelponi.'
translation:
  language: ta
  text: 'ஏத்தாமின் தந்தையின் மகன்கள் இவர்கள்[a]: யெஸ்ரயேல், இஷ்மா, இத்பாஷ்; அவர்களுடைய சகோதரியின் பெயர் ஹட்செலெல்போனி.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தந்தை” என்பது இங்கு “மூதாதை” அல்லது “ஏத்தாமை நிறுவியவர்” என்றும் பொருள்படலாம்; நாளாகமத்தில் இந்தச் சொல் விரிவான மரபுவழிப் பொருளில் வரக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: பிறந்தவர்கள்
  rationale: வம்சப் பட்டியல் குறிப்பை இயல்பான தமிழில் அறிமுகப்படுத்துகிறது. எபிரெயத்தில் இணைப்புச்சொல்லும் சுட்டுப்பெயரும் இருந்தாலும், தமிழில் தனியாக ‘இவர்கள்’ எனச் சேர்க்காமல் வாக்கிய அமைப்பிலேயே அதன் அறிமுகப் பொருள் வெளிப்படுகிறது.
- source_word: אֲבִי עֵיטָם
  choice: ஏத்தாமின் தந்தைக்கு
  rationale: ‘தந்தை’ என்பது எபிரெயச் சொல்லின் நேரடியான பொருள். நாளாகம வம்சப் பட்டியல்களில் அது முன்னோர் அல்லது ஒரு குடியிருப்பின் நிறுவனர் என்ற விரிவான பொருளையும் கொள்ளக்கூடும்; அந்தத் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: יִזְרְעֶאל
  choice: யெஸ்ரயேல்
  rationale: எபிரெயத் தனிப்பெயரின் ஒலியைத் தமிழில் அறியத்தக்க முறையில் எழுத்துப்பெயர்த்துள்ளது.
- source_word: יִשְׁמָא
  choice: இஷ்மா
  rationale: எபிரெயத் தனிப்பெயரை அதன் ஷ் ஒலியுடன் நேரடியாக எழுத்துப்பெயர்த்துள்ளது.
- source_word: יִדְבָּשׁ
  choice: இத்பாஷ்
  rationale: எபிரெயத் தனிப்பெயரைத் தமிழில் எழுத்துப்பெயர்த்துள்ளது; இறுதி ஷ் ஒலி காக்கப்பட்டுள்ளது.
- source_word: וְשֵׁם אֲחוֹתָם
  choice: அவர்களுடைய சகோதரியின் பெயர்
  rationale: ‘சகோதரி’ என்பதிலுள்ள பன்மை உடைமைப் பின்னொட்டை வெளிப்படையாகக் காட்டி, முன் குறிப்பிடப்பட்ட ஆண்களைக் குறிக்கிறது.
- source_word: הַצְלֶלְפּוֹנִי
  choice: ஹட்செலெல்போனி
  rationale: எபிரெய வடிவிலுள்ள தொடக்க ha ஒலியையும் வலியுறுத்தப்பட்ட ṣ ஒலியையும் தமிழில் இயன்றவரை நெருக்கமாக எழுத்துப்பெயர்த்துள்ளது.
theological_decisions:
- issue: אֲבִי עֵיטָם என்ற மரபுவழித் தொடர்பின் துல்லிய இயல்பு
  choice: முதன்மை உரையில் ‘ஏத்தாமின் தந்தை’ என்று நேரடியாக மொழிபெயர்த்து, விரிவான மரபுவழிப் பொருளை அடிக்குறிப்பில் தருதல்
  alternative: ‘ஏத்தாமின் நிறுவனர்’ அல்லது ‘ஏத்தாமின் மூதாதை’ என்று முதன்மை உரையிலேயே பொருள் வரையறுத்தல்
  rationale: எபிரெய אָב என்பது நேரடித் தந்தை, மூதாதை, அல்லது ஒரு குலம்/இடத்தின் நிறுவனர் எனப் பலவாறு அமையலாம். ஆதாரம் தீர்மானிக்காத ஒன்றை முதன்மை உரை தீர்மானித்து விடாமல் இருக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், வம்சப் பட்டியலுக்கேற்ற சுருக்கமான மற்றும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயத்தில் வெளிப்படையாக இல்லாத ‘மகன்கள்’ என்பதைச் சேர்க்காமல், பன்மை உறவை இயல்பாகக் காட்ட ‘பிறந்தவர்கள்’ என அமைக்கப்பட்டுள்ளது.
