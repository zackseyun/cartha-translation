base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/019.yaml
  text: And the sons of the wife of Hodiah[a], the sister of Naham[b], were the father of Keilah the Garmite and Eshtemoa the Maacathite.
translation:
  language: ta
  text: 'ஹோதியாவின் மனைவியும் நகாமின் சகோதரியுமானவளின் மகன்கள்: கர்மியனான கெயீலாவினதும் மாகாத்தியனான எஷ்தெமோவாவினதும் தந்தை[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: வம்சப் பட்டியல்களில் எபிரெய மொழியின் ‘தந்தை’ என்ற சொல் உடனடி உயிரியல் தந்தையை மட்டுமன்றி, நிறுவியவர், முன்னோர் அல்லது குலத்தலைவர் என்பதையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெய உரையில் ‘மகன்கள்’ என்பது பன்மையில் இருந்தாலும், அதைத் தொடர்ந்து ‘தந்தை’ என்பது ஒருமையில் வருகிறது. ஆகவே இது எளிய தந்தை—மகன் தொடரைக் காட்டாமல், சுருக்கமாகக் கூறப்பட்ட ஒரு குல உறவைக் குறிக்கக்கூடும்.
    reason: cultural_note
lexical_decisions:
- source_word: וּבְנֵי
  choice: மகன்கள்
  rationale: வம்சப் பட்டியலில் ‘சந்ததியினர்’ என்ற விரிவான பொருளும் இருக்கக்கூடும்; இருப்பினும் இங்கு எபிரெயச் சொல்லின் நேரடியான பொருளான ‘மகன்கள்’ என்பதே வைக்கப்பட்டுள்ளது.
- source_word: אֵשֶׁת הוֹדִיָּה
  choice: ஓதியாவின் மனைவி
  rationale: இணைப்புநிலைத் தொடர் ஓதியாவுடனான திருமண உறவைத் தெளிவாகக் குறிக்கிறது.
- source_word: אֲחוֹת נַחַם
  choice: நாகாமின் சகோதரி
  rationale: ஓதியாவின் மனைவியை மேலும் அடையாளப்படுத்தும் இணைப்புநிலைத் தொடர்.
- source_word: אֲבִי
  choice: தந்தை
  rationale: மூலத்தின் குடும்பவழிச் சொல்லைத் தக்கவைக்கிறது; வம்சப் பட்டியல்களில் இது நேரடி உயிரியல் தந்தையை மட்டுமன்றி முன்னோர், நிறுவியவர் அல்லது குலத்தலைவர் என்பதையும் குறிக்கலாம்.
- source_word: קְעִילָה הַגַּרְמִי
  choice: கர்மியனான கெயிலா
  rationale: பெயரும் குல/இன அடைமொழியும் பொருள் விரிவாக்கமின்றி ஒலிபெயர்க்கப்பட்டுள்ளன.
- source_word: אֶשְׁתְּמֹעַ הַמַּעֲכָתִי
  choice: மாகாத்தியனான எஸ்தெமோவா
  rationale: பெயரும் குல/இன அடைமொழியும் மூலத்தின் இணைப்பைப் பாதுகாக்கும் வகையில் ஒலிபெயர்க்கப்பட்டுள்ளன.
