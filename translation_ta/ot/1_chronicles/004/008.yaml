translation_notes:
  register: நவீனத் தரத் தமிழில், வம்சப்பட்டியலுக்குரிய சுருக்கத்தையும் கண்ணியமான நடையையும் காக்கிறது. பெயர்கள் மசோரா உரையை முதன்மையாகக் கொண்டு ஒலிபெயர்க்கப்பட்டுள்ளன. ஆங்கில ஆலோசனை உரையில் அடிக்குறிப்பு குறியீடுகள் பொருந்தாமல் இருந்ததால், பொருளுக்கு ஏற்ப [a] ஹச்சொபேபாவிற்கும் [b] குடும்பங்களுக்கும் இணைக்கப்பட்டன.
