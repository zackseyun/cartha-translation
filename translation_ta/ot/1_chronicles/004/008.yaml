base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/008.yaml
  text: Koz fathered Anub[a], Hazzobebah[b], and the families of Aharhel son of Harum.
translation:
  language: ta
  text: 'கோஸ் ஆனூபையும், ஹச்சோபேபாவையும்[a], ஹாரூமின் மகனான அஹர்ஹேலின் குடும்பங்களையும்[b] பெற்றான்.


    [a] எபிரெயப் பெயரிலுள்ள முன்னொட்டை ஒலிபெயர்ப்பில் சேர்க்காவிட்டால், “சோபேபா” என்றும் வழங்கலாம்.


    [b] வம்சப்பட்டியல் சூழலில் “குடும்பங்கள்” என்பதை “குலங்கள்” என்றும் மொழிபெயர்க்கலாம்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயப் பெயரிலுள்ள முன்னொட்டை ஒலிபெயர்ப்பில் சேர்க்காவிட்டால், “சோபேபா” என்றும் வழங்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: வம்சப்பட்டியல் சூழலில் “குடும்பங்கள்” என்பதை “குலங்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֣וֹץ
  choice: கோஸ்
  rationale: மொழிபெயர்க்காமல், எபிரெய மெய்யெழுத்து வடிவை அணுகிய தமிழ்ப் பெயரொலிப்பாக வழங்கப்பட்டது; இங்கு பெயருக்கு முன் சுட்டிடைச்சொல் இல்லாததால் ‘ஹக்கோஸ்’ எனக் கொள்ளப்படவில்லை.
- source_word: הוֹלִ֔יד
  choice: பெற்றான்
  rationale: வம்சப்பட்டியல் சூழலில் ஆண் முன்னோரைச் சுட்டும் ילד என்பதன் Hiphil வடிவுக்கு இயல்பான, சுருக்கமான தமிழ்ச் சொல்; ‘தந்தையானான்’ என்பதைவிட பட்டியலின் நடைக்கு ஏற்றது.
- source_word: עָנ֖וּב
  choice: ஆனூப்
  rationale: மசோரா உயிர்க்குறிப்பைப் பின்பற்றிய தமிழ்ப் பெயரொலிப்பு.
- source_word: הַ/צֹּבֵבָ֑ה
  choice: ஹச்சொபேபா
  rationale: எபிரெய வடிவிலுள்ள முன்னொட்டின் h ஒலியையும் வலியுறுத்தப்பட்ட ṣ ஒலியையும் பெயரொலிப்பில் பிரதிபலிக்கிறது; முன்னொட்டைச் சேர்க்காத ‘சொபேபா’ அடிக்குறிப்பில் மாற்றாகத் தரப்பட்டது.
- source_word: וּ/מִשְׁפְּח֥וֹת
  choice: குடும்பங்களையும்
  rationale: வம்சப்பட்டியலில் குடும்ப அடிப்படையிலான குழுக்களைக் குறிக்கும் வெளிப்படையான நவீன தமிழ்ச் சொல்; ‘குலங்கள்’ என்ற சாத்தியமும் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- source_word: אֲחַרְחֵ֖ל
  choice: அகார்கேல்
  rationale: எபிரெயப் பெயரைத் தமிழில் அணுகத்தக்க வகையில் ஒலிபெயர்த்தது; தொண்டை உரசொலியை ‘க’ மூலம் தோராயமாகக் காட்டுகிறது.
- source_word: בֶּן
  choice: மகனான
  rationale: அகார்கேலை ஹாரூமுடன் இணைக்கும் வழக்கமான வம்ச உறவுச் சொல்.
- source_word: הָרֽוּם
  choice: ஹாரூம்
  rationale: மசோரா உயிர்க்குறிப்பை அடிப்படையாகக் கொண்ட பெயரொலிப்பு; ‘ஹாரம்’ என்ற மரபு வடிவை விட மூல வடிவுக்கு நெருக்கமானது.
