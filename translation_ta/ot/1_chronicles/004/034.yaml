  text: and Meshobab[a], and Jamlech, and Joshah son of Amaziah.
translation:
  language: ta
  text: மெஷோபாபும், யம்லேக்கும், அமத்சியாவின் மகன் யோஷாவும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: பெயர்களை எழுத்துப்பெயர்க்கும் மரபைப் பொறுத்து, ‘யம்லேக்’ மற்றும் ‘யோஷா’ ஆகியவை வேறு எழுத்து வடிவங்களிலும் எழுதப்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְשׁוֹבָב
  choice: மெஷோபாப்
  rationale: எபிரெய தனிப்பட்ட பெயரின் ஒலியை நவீன தமிழில் இயன்றவரை தெளிவாக எழுத்துப்பெயர்த்துள்ளது.
- source_word: יַמְלֵךְ
  choice: யம்லேக்
  rationale: எபிரெய யோத் எழுத்தை ஆங்கில மரபுப்படி ‘ஜ’ என மாற்றாமல், மூல ஒலிக்கு நெருக்கமாக ‘ய’ என எழுத்துப்பெயர்த்துள்ளது; இறுதி כְ ஒலிக்கு ‘க்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: יוֹשָׁה
  choice: யோஷா
  rationale: எபிரெய பெயரை அதன் தொடக்க ‘யோ’ மற்றும் ‘ஷா’ ஒல்களுடன் நேரடியாகத் தமிழில் எழுத்துப்பெயர்த்துள்ளது.
- source_word: בֶּן
  choice: மகன்
  rationale: வம்சப் பட்டியலில் தந்தை–மகன் உறவைக் குறிக்கும் வழக்கமான எபிரெய சொல்லுக்கு இயல்பான தமிழ் இணை.
- source_word: אֲמַצְיָה
  choice: அமத்சியா
  rationale: பெயரிலுள்ள צ ஒலியை ‘த்ச’ எனக் காட்டி, எபிரெய வடிவத்துக்கு நெருக்கமாக எழுத்துப்பெயர்த்துள்ளது.
- source_word: וְ
  choice: –உம்
  rationale: ஒவ்வொரு பெயருக்கும் முன் திரும்பத் திரும்ப வரும் எபிரெய இணைப்பை, தமிழ் பட்டியல் அமைப்புக்கு இயல்பான இணைப்பும்மையான ‘–உம்’ மூலம் ஒவ்வொரு உறுப்பிலும் தக்கவைத்துள்ளது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், வம்சப் பட்டியலுக்கேற்ற சுருக்கமானதும் கண்ணியமானதுமான நடை. எபிரெய மொழியில் மீண்டும் வரும் இணைப்புச் சொல் தமிழின் ‘–உம்’ அமைப்பால் பாதுகாக்கப்பட்டுள்ளது; பெயர்கள் ஆங்கில வடிவங்களைச் சாராமல் எபிரெய ஒலியிலிருந்து எழுத்துப்பெயர்க்கப்பட்டுள்ளன.
