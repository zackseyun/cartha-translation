- from: 'அவர்களுடைய குடியிருப்புகள்[a]: ஏத்தாம், ஆயின், ரிம்மோன், தோகென், ஆசான் ஆகிய ஐந்து நகரங்கள்.'
  to: அவர்களுடைய குடியிருப்புகள் ஏத்தாம், ஆயின், ரிம்மோன், தோகென், ஆஷான் ஆகிய ஐந்து நகரங்கள்.
