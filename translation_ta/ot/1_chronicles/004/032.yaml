  yaml_path: translation/ot/1_chronicles/004/032.yaml
  text: And their settlements were Etam[a], Ain, Rimmon, Tochen, and Ashan—five cities.
translation:
  language: ta
  text: அவர்களுடைய குடியிருப்புகள் ஏத்தாம், ஆயின், ரிம்மோன், தோகென், ஆஷான் ஆகிய ஐந்து நகரங்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַצְרֵיהֶם
  choice: அவர்களுடைய குடியிருப்புகள்
  rationale: חָצֵר என்பது சிற்றூர், குடியிருப்பு அல்லது சுற்றுச்சுவர் கொண்ட குடியிருப்பைக் குறிக்கலாம். இங்குள்ள நிலவியல் பட்டியலில் ‘குடியிருப்புகள்’ என்பது அதன் பொருள் அகலத்தை இயல்பாகக் காக்கிறது.
- source_word: עֵיטָם
  choice: ஏத்தாம்
  rationale: இது ஓர் இடப்பெயர்; எபிரெய ஒலிப்புக்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: עַיִן
  choice: ஆயின்
  rationale: பொதுப்பெயராக ‘கண்’ அல்லது ‘நீரூற்று’ என்று பொருள்படக்கூடியதாயினும், இங்கு நகரங்களின் பட்டியலில் இடப்பெயராக வருகிறது; ஆகவே ஒலிபெயர்க்கப்பட்டது.
- source_word: רִמּוֹן
  choice: ரிம்மோன்
  rationale: பொதுப்பெயராக ‘மாதுளை’ என்று பொருள்படக்கூடியதாயினும், இங்கு இடப்பெயராகச் செயல்படுகிறது.
- source_word: תֹכֶן
  choice: தோகென்
  rationale: இடப்பெயர்; எபிரெய மெய்யெழுத்து மற்றும் உயிரொலியை இயன்றவரை பிரதிபலிக்கும் வகையில் ஒலிபெயர்க்கப்பட்டது.
- source_word: עָשָׁן
  choice: ஆசான்
  rationale: இடப்பெயர் என்பதால் மொழிபெயர்க்காமல் ஒலிபெயர்க்கப்பட்டது.
- source_word: עָרִים חָמֵשׁ
  choice: ஐந்து நகரங்கள்
  rationale: עִיר என்பது நகரம் அல்லது ஊர் எனப் பொருள்படும். பட்டியலிடப்பட்ட ஐந்து இடங்களைச் சுருக்கிக் கணக்கிடும் இச்சூழலில் ‘ஐந்து நகரங்கள்’ என்பது வழக்கமான, தெளிவான மொழிபெயர்ப்பு.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. இடப்பெயர்கள் மூல எபிரெய வடிவத்தை அடிப்படையாகக் கொண்டு ஒலிபெயர்க்கப்பட்டன; חַצְרֵיהֶם என்பதிலுள்ள பொருள் அகலம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
