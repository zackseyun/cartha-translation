base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/027.yaml
  text: Shimei had sixteen sons and six daughters[a], but his brothers did not have many sons, and all their clans did not multiply as much as the sons of Judah.
translation:
  language: ta
  text: சிமெயிக்குப் பதினாறு மகன்களும் ஆறு மகள்களும் இருந்தனர். ஆனால் அவனுடைய சகோதரர்களுக்குப் பல மகன்கள் இல்லை; அவர்களுடைய குலங்கள் அனைத்தும் யூதாவின் சந்ததியினரைப்போல் எண்ணிக்கையில் பெருகவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யூதாவின் சந்ததியினரின் எண்ணிக்கையை எட்டவில்லை.”
    reason: עַד ... לֹא הִרְבּוּ என்ற தொடரை ஒப்பீடாகவோ, எண்ணிக்கையின் அளவை எட்டாததாகவோ இயல்பாக மொழிபெயர்க்கலாம்.
lexical_decisions:
- source_word: וּלְשִׁמְעִי
  choice: சீமேயிக்கு ... இருந்தனர்
  rationale: வம்சப்பட்டியல் நடையில் לְ என்பது உடைமையைக் குறிக்கிறது; தமிழில் இயல்பாக ‘சீமேயிக்கு ... இருந்தனர்’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: בָּנִים שִׁשָּׁה עָשָׂר וּבָנוֹת שֵׁשׁ
  choice: பதினாறு மகன்களும் ஆறு மகள்களும்
  rationale: எண்ணிக்கைகளையும் உறவுமுறைகளையும் நேரடியாகக் காத்து, இயல்பான தமிழ் சொல் வரிசையில் அமைக்கப்பட்டது.
- source_word: וּלְאֶחָיו
  choice: ஆனால் அவனுடைய சகோதரர்களுக்கு
  rationale: וְ என்பதன் அடிப்படைப் பொருள் ‘மற்றும்’ என்றாலும், இங்கு சீமேயியின் பிள்ளைகளின் எண்ணிக்கைக்கும் அவன் சகோதரர்களுடைய நிலைக்கும் இடையே உள்ள எதிர்மறை ஒப்பீட்டை ‘ஆனால்’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: אֵין בָּנִים רַבִּים
  choice: அதிகமான மகன்கள் இல்லை
  rationale: אֵין குறிக்கும் இல்லாமை/குறைவை இயல்பான தமிழில் வழங்குகிறது; רַבִּים என்பதைக் மிகைப்படுத்தாமல் ‘அதிகமான’ எனக் காக்கிறது.
- source_word: וְכֹל מִשְׁפַּחְתָּם
  choice: அவர்களுடைய குலங்கள் அனைத்தும்
  rationale: வம்சப்பட்டியல் சூழலில் מִשְׁפָּחָה என்பது தனிக் குடும்பத்தைவிடப் பரந்த உறவுக் குழுவான குலத்தைக் குறிக்கிறது.
- source_word: לֹא הִרְבּוּ
  choice: எண்ணிக்கையில் பெருகவில்லை
  rationale: רבה என்பதன் ஹிஃபில் வடிவம் இங்கு எண்ணிக்கையில் அதிகரிப்பதைக் குறிக்கிறது; தமிழில் பொருளைத் தெளிவாக்க ‘எண்ணிக்கையில்’ சேர்க்கப்பட்டது.
- source_word: עַד בְּנֵי יְהוּדָה
  choice: யூதாவின் சந்ததியினரைப் போல
  rationale: עַד இங்கு எல்லை அல்லது அளவைக் குறிக்கும் ஒப்பீட்டுப் பயன்பாடு. בְּנֵי יְהוּדָה என்பதை வம்சச்சூழலுக்கேற்ப ‘யூதாவின் சந்ததியினர்’ என வழங்குவது நேரடி மகன்கள் என்ற தவறான புரிதலைத் தவிர்க்கிறது.
