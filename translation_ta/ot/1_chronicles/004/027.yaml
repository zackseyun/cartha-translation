    issue: Slightly unnatural expression for ‘many sons’
    rationale: ‘அதிகமான மகன்கள் இல்லை’ is understandable, but ‘பல மகன்கள் இல்லை’ is the more natural modern Tamil expression and retains the source’s unqualified ‘many.’
