  text: וּ/מְעוֹנֹתַ֖י הוֹלִ֣יד אֶת עָפְרָ֑ה וּ/שְׂרָיָ֗ה הוֹלִ֤יד אֶת יוֹאָב֙ אֲבִי֙ גֵּ֣יא חֲרָשִׁ֔ים כִּ֥י חֲרָשִׁ֖ים הָיֽוּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/014.yaml
  text: Meonothai fathered Ophrah[a], and Seraiah fathered Joab, the father of Ge-harashim[b], for they were craftsmen.
translation:
  language: ta
  text: மெயோனோத்தாய் ஒப்ராவைப் பெற்றான்; செராயா, கே-கராஷீமின்[a] தந்தையான[b] யோவாபைப் பெற்றான்; ஏனெனில் அவர்கள் கைவினைஞர்களாக இருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில் இது ‘கே-கராஷீம்’ என்ற இடப்பெயராக உள்ளது; இதன் பொருள் ‘கைவினைஞர்களின் பள்ளத்தாக்கு’ என்பதாக இருக்கலாம். அடுத்த கூற்று அந்தப் பெயரை விளக்குகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘கே-கராஷீமை நிறுவியவர்.’ வம்சவரலாற்றுச் சூழல்களில் ‘தந்தை’ என்பது நிறுவியவரையோ மூதாதையையோ குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: מְעוֹנֹתַי
  choice: மெயோனோத்தாய்
  rationale: தனிப்பட்ட பெயராக இருப்பதால், எபிரெய ஒலிப்புக்கு அண்மையாகத் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: הוֹלִיד
  choice: பெற்றான்
  rationale: வம்சவரலாற்றுச் சூழலில் ஒருவரின் வழித்தோன்றலைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொல்லாக்கம்.
- source_word: עָפְרָה
  choice: ஒப்ரா
  rationale: இங்கு வழித்தோன்றலின் பெயராகச் செயல்படும் சிறப்புப்பெயர்; ஒலிபெயர்க்கப்பட்டது.
- source_word: שְׂרָיָה
  choice: செராயா
  rationale: தனிப்பட்ட பெயர்; எபிரெய உச்சரிப்பை அணுகும் வகையில் ஒலிபெயர்க்கப்பட்டது.
- source_word: יוֹאָב
  choice: யோவாப்
  rationale: தனிப்பட்ட பெயர்; வழக்கமான தமிழ் வேதாகமப் பெயர்வடிவத்துக்கு அண்மையாக ஒலிபெயர்க்கப்பட்டது.
- source_word: אֲבִי
  choice: தந்தையான
  rationale: எபிரெய மொழியின் உறவுமுறைச் சொல்லை முதன்மை உரையில் பாதுகாக்கிறது; வம்சவரலாற்றில் இது நிறுவியவர் அல்லது மூதாதை என்ற விரிந்த பொருளையும் கொள்ளலாம்.
- source_word: גֵּיא חֲרָשִׁים
  choice: கைவினைஞர்களின் பள்ளத்தாக்கு
  rationale: இது இடப்பெயராக இருந்தாலும் அதன் பொருள் அடுத்துவரும் விளக்கக் கூற்றுடன் நேரடியாகத் தொடர்புடையது; ஆகவே தமிழில் பொருள்பெயர்ப்பு இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: இடப்பெயருக்கான காரணத்தை அல்லது விளக்கத்தை அறிமுகப்படுத்தும் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: חֲרָשִׁים
  choice: கைவினைஞர்கள்
  rationale: இச்சொல் பலவகைத் திறன்வாய்ந்த தொழிலாளர்களைக் குறிக்கக்கூடும்; ‘கொல்லர்கள்’ என்று குறுக்காமல் அதன் பரந்த பொருளைப் பாதுகாக்கிறது.
- source_word: הָיוּ
  choice: இருந்தார்கள்
  rationale: பன்மை எழுவாயைக் குறிக்கும் எளிய இணைப்புவினை; அந்த இடத்துடன் தொடர்புடைய மக்களைச் சுட்டுகிறது.
theological_decisions:
- issue: ‘தந்தை’ என்பதன் வம்சவரலாற்றுப் பொருள்
  choice: முதன்மை உரையில் ‘தந்தையான’ என்று வைத்தல்
  alternative: ‘நிறுவியவரான’ அல்லது ‘மூதாதையான’
  rationale: எபிரெய உரையின் உண்மையான பரந்த பொருள் வாய்ப்பை ஒரே விளக்கமாகச் சுருக்காமல் பாதுகாக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், வம்சவரலாற்றின் சுருக்கமான நடையையும் எபிரெய உரையின் காரணவிளக்கத் தொடர்பையும் காக்கும் கண்ணியமான சொல்லாக்கம். இடப்பெயர் வாசகருக்குப் பொருள் தெளிவாக இருக்க மொழிபெயர்க்கப்பட்டு, எபிரெயப் பெயர்வடிவு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
