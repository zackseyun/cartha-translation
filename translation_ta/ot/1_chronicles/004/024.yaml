  source_fidelity: 'மூல எபிரெய உரையின் வம்சப்பட்டியல் அமைப்பும் பெயர்களும் துல்லியமாகக் காக்கப்பட்டுள்ளன: சிமியோன், நெமுவேல், யாமின், யாரீப், செராக், சாவூல். בְּנֵי என்பதற்கு ‘மகன்கள்’ பொருத்தமானது. பெயர்ப்பட்டியலில் எபிரெயத்தில் இணைப்புச்சொல் யாமினுக்கு முன் மட்டுமே இருந்தாலும், தமிழில் காற்புள்ளிப் பட்டியலாக அமைப்பது இயல்பானது; பொருளில் மாற்றமில்லை.'
  naturalness: '‘சிமியோனின் மகன்கள்: ...’ என்பது நவீன நிலையான தமிழில் சுருக்கமான வம்சப்பட்டியல் நடைக்கு இயல்பாக உள்ளது. பெயர்களின் எழுத்துப்பெயர்ப்பும் வாசிக்கத் தெளிவாக உள்ளது.'
  terminology: தனிப்பெயர்கள் மூல எபிரெய வடிவத்தை முன்னிறுத்துகின்றன. ‘நெமுவேல்/யெமுவேல்’, ‘செராக்/சோகார்’, ‘சாவூல்/சவுல்’ குறித்த அடிக்குறிப்புகள் உரையில் உள்ள வடிவத்தையும் இணை வம்சப்பட்டியல்கள் அல்லது வழக்கமான தமிழ் வடிவத்தையும் உரியவாறு வேறுபடுத்துகின்றன.
