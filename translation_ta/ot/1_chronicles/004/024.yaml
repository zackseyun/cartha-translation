source:
  edition: WLC
  text: בְּנֵ֖י שִׁמְע֑וֹן נְמוּאֵ֣ל וְ/יָמִ֔ין יָרִ֖יב זֶ֥רַח שָׁאֽוּל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/024.yaml
  text: 'The sons of Simeon: Nemuel[a], Jamin, Jarib, Zerah[c][b], and Shaul.'
translation:
  language: ta
  text: 'சிமியோனின் மகன்கள்: நெமுவேல்[a], யாமின், யாரீப், செராக்[b], சாவூல்[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ஆதியாகமம் 46:10-இல் உள்ள இணையான வம்சப்பட்டியலில் இந்தப் பெயர் ‘யெமுவேல்’ என்ற வடிவில் வருகிறது; இங்கே எபிரெய உரையில் ‘நெமுவேல்’ என்று உள்ளது.
    reason: alternative_reading
  - marker: b
    text: ஆதியாகமம் 46:10 மற்றும் யாத்திராகமம் 6:15 ஆகியவற்றின் இணையான வம்சப்பட்டியல்களில் செராக் ‘சோகார்’ என்ற பெயர் வடிவில் குறிப்பிடப்படுகிறார்.
    reason: textual_variant
  - marker: c
    text: ‘சாவூல்’ என்பது எபிரெயப் பெயரின் ஒலிபெயர்ப்பு; தமிழில் இது ‘சவுல்’ என்றும் வழக்கமாக எழுதப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: இது ‘மகன்’ என்பதன் பன்மை இணைப்பு வடிவம்; பெயரிடப்பட்ட நேரடி மகன்களின் வம்சப்பட்டியலை அறிமுகப்படுத்துவதால் ‘மகன்கள்’ என்பது இயல்பான, துல்லியமான மொழிபெயர்ப்பு.
- source_word: שִׁמְעוֹן
  choice: சிமியோன்
  rationale: எபிரெய தனிப்பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: נְמוּאֵל
  choice: நெமுவேல்
  rationale: இவ்வசனத்தின் எபிரெய வடிவத்தை நேரடியாகப் பிரதிபலிக்கும் ஒலிபெயர்ப்பு; இணையான மற்றொரு வம்சப்பட்டியலில் காணப்படும் ‘யெமுவேல்’ வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וְיָמִין
  choice: யாமின்
  rationale: வְ என்னும் இணைப்புச் சொல் பெயர்ப்பட்டியலில் தமிழின் நிறுத்தற்குறி மற்றும் இறுதி இணைப்பால் இயல்பாக வெளிப்படுகிறது; יָמִין தனிப்பெயராக ஒலிபெயர்க்கப்படுகிறது.
- source_word: יָרִיב
  choice: யாரீப்
  rationale: பெயரின் சொற்பொருளை மொழிபெயர்க்காமல், எபிரெய உச்சரிப்பை நெருக்கமாகப் பிரதிபலிக்கும் தனிப்பெயர் ஒலிபெயர்ப்பு.
- source_word: זֶרַח
  choice: செராக்
  rationale: இவ்வசனத்தில் உள்ள זֶרַח என்ற எபிரெய வடிவத்தை ஒலிபெயர்க்கிறது; இணையான வம்சப்பட்டியல்களின் ‘சோகார்’ வடிவம் மூல உரைக்குள் கொண்டுவரப்படாமல் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: שָׁאוּל
  choice: சாவூல்
  rationale: எபிரெய பெயரின் இரண்டு உயிரொலிகளையும் தெளிவாகப் பிரதிபலிக்கும் தமிழ் ஒலிபெயர்ப்பு; வழக்கில் காணப்படும் ‘சவுல்’ என்ற வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
