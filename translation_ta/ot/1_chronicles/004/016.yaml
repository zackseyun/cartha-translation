  text: 'And the sons of Jehallelel: Ziph[a], Ziphah, Tiria, and Asarel.'
translation:
  language: ta
  text: 'மேலும், யெஹல்லெலேலின் மகன்கள்: சீப், சீப்பா, திரியா, மற்றும் அசரேல்[a].'
