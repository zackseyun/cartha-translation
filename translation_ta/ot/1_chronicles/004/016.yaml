lexical_decisions:
- source_word: וּבְנֵי
  choice: மகன்கள்
  rationale: בְנֵי என்பது வம்சப்பட்டியலில் ஒருவரின் மகன்களையோ வழித்தோன்றல்களையோ அறிமுகப்படுத்தும் பன்மை இணைப்புநிலைச் சொல். வசனம் தனியாக வாசிக்கப்படும்போது இயல்பாக இருக்க, தொடக்க וּ தனியாக ‘மேலும்’ என மொழிபெயர்க்கப்படவில்லை; பட்டியல் தொடர்ச்சி சூழலால் தெளிவாகிறது.
- source_word: יְהַלֶּלְאֵל
  choice: யெஹல்லெலேல்
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் இயன்றவரை நேரடியாகப் பிரதிபலிக்கும் ஒலிபெயர்ப்பு.
- source_word: זִיף
  choice: சீப்
  rationale: எபிரெய தனிப்பெயரான Ziph என்பதற்கான தமிழ் ஒலிபெயர்ப்பு.
- source_word: וְזִיפָה
  choice: சீப்பா
  rationale: எபிரெய தனிப்பெயரான Ziphah என்பதற்கான தமிழ் ஒலிபெயர்ப்பு; முன்சேர்க்கை வாவ் பட்டியலின் இணைப்பாகப் புரிந்துகொள்ளப்படுகிறது.
- source_word: תִּירְיָא
  choice: திரியா
  rationale: மசோரா உயிர்க்குறிகளுடன் உள்ள எபிரெயப் பெயரின் ஒலியை நெருக்கமாகக் காட்டும் தமிழ் வடிவம்.
- source_word: וַאֲשַׂרְאֵל
  choice: அசரேல்
  rationale: எபிரெய தனிப்பெயரை ஒலிபெயர்த்த வடிவம்; முன்சேர்க்கை வாவ் தமிழ்ப் பட்டியலின் இறுதி உருப்படிக்கு முன் தனியே மீண்டும் இடப்படாமல், நிறுத்தக்குறி அமைப்பால் தொடர்பு காட்டப்பட்டுள்ளது.
