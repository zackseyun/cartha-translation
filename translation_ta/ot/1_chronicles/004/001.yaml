source:
  edition: WLC
  text: בְּנֵ֖י יְהוּדָ֑ה פֶּ֧רֶץ חֶצְר֛וֹן וְ/כַרְמִ֖י וְ/ח֥וּר וְ/שׁוֹבָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/001.yaml
  text: 'The sons of Judah: Perez[a], Hezron, Carmi, Hur, and Shobal.'
translation:
  language: ta
  text: 'யூதாவின் மகன்கள்[a]: பேரேஸ், எஸ்ரோன், கர்மி, ஊர், மற்றும் சோபால்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘மகன்கள்’ என்பது வம்சவரிசைச் சூழலில் நேரடி மகன்களையோ, இன்னும் விரிவாக வழித்தோன்றல்களையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: בֵּן என்பதன் இணைப்புநிலைப் பன்மை. வம்சவரிசைப் பட்டியலில் இது நேரடி மகன்களையும் விரிவான பொருளில் வழித்தோன்றல்களையும் குறிக்கக்கூடும்; எபிரெயச் சொல்லின் நேரடியான வடிவம் முதன்மை உரையில் வைக்கப்பட்டு, அதன் பரந்த பொருள் அடிக்குறிப்பில் தெரிவிக்கப்பட்டுள்ளது.
- source_word: יְהוּדָה
  choice: யூதா
  rationale: குலமுதல்வரையும் அவரால் பெயர்பெற்ற கோத்திரத்தையும் குறிக்கும் இயற்பெயர்; நவீனத் தமிழில் நிலைபெற்ற வடிவம்.
- source_word: פֶּרֶץ
  choice: பேரேஸ்
  rationale: எபிரெய இயற்பெயரின் ஒலியைத் தமிழில் இயல்பாகக் காட்டும் எழுத்துப்பெயர்ப்பு.
- source_word: חֶצְרוֹן
  choice: எஸ்ரோன்
  rationale: எபிரெய இயற்பெயருக்கான தமிழில் நிலைபெற்ற, வாசிக்க இயல்பான வடிவம்.
- source_word: כַרְמִי
  choice: கர்மி
  rationale: எபிரெய இயற்பெயரின் நேரடியான எழுத்துப்பெயர்ப்பு.
- source_word: חוּר
  choice: ஊர்
  rationale: எபிரெயப் பெயரின் நீண்ட உயிரொலியைப் பிரதிபலிக்கும் தமிழ் வடிவம்; தொடக்க ח ஒலிக்கு தமிழில் துல்லிய இணை இல்லாததால் இயல்பான நிலைபெற்ற வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: שׁוֹבָל
  choice: சோபால்
  rationale: எபிரெய இயற்பெயரின் ஒலியை நவீனத் தமிழில் வாசிக்க இயல்பாகக் காட்டும் எழுத்துப்பெயர்ப்பு.
- source_word: וְ
  choice: காற்புள்ளிகளும் இறுதியில் பட்டியல் நிறுத்தக்குறியும்
  rationale: எபிரெயத்தில் ஒவ்வொரு பெயருக்கும் முன் வரும் இணைப்புச் சொல் எளிய பட்டியலைக் குறிக்கிறது. தமிழில் பெயர்களைக் காற்புள்ளிகளால் வரிசைப்படுத்துவது இயல்பானது; இறுதிப் பெயருக்கு முன் ‘மற்றும்’ சேர்க்காமல் பட்டியலாக முடிப்பதும் தெளிவாக உள்ளது.
theological_decisions:
- issue: ‘மகன்கள்’ என்பது நேரடி புதல்வர்களை மட்டும் குறிக்கிறதா, வழித்தோன்றல்களையும் குறிக்கிறதா?
  choice: முதன்மை உரையில் ‘மகன்கள்’ என்று நேரடியாக மொழிபெயர்த்து, வம்சவரிசை சார்ந்த பரந்த பொருளை அடிக்குறிப்பில் குறிப்பிடுதல்
  alternative: ‘வழித்தோன்றல்கள்’ என்று முதன்மை உரையிலேயே மொழிபெயர்த்தல்
  rationale: בְּנֵי என்ற எபிரெய வடிவத்தை நேரடியாகப் பேணுவதோடு, வம்சவரிசைகளில் அதற்குள்ள நெகிழ்வான பொருளையும் மறைக்காமல் வைத்திருக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் சுருக்கமான வம்சவரிசைப் பட்டியல் நடையைப் பேணுகிறது. இயற்பெயர்கள் எபிரெய மூல ஒலியை முன்னிறுத்தி, தமிழில் வாசிக்க இயல்பான வடிவங்களில் தரப்பட்டுள்ளன.
