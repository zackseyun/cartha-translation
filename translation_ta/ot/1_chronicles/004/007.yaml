  text: וּ/בְנֵ֖י חֶלְאָ֑ה צֶ֥רֶת יצחר וְ/אֶתְנָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/007.yaml
  text: 'And the sons of Helah: Zereth[a], Izhar[b], and Ethnan.'
translation:
  language: ta
  text: 'மேலும், ஹெலாவின் மகன்கள்[a]: செரெத், யித்ஸ்ஹார், எத்னான்.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய வம்சப்பட்டியல்களில் ‘மகன்கள்’ என்பது நேரடி மகன்களையோ, சில சூழல்களில் ஒரு குடும்பக் கிளையைச் சேர்ந்த வழித்தோன்றல்களையோ குறிக்கலாம்.
    reason: cultural_note
  - marker: b
    text: ‘ஹெலா’ என்ற பெயரை ஒலிபெயர்ப்பு மரபைப் பொறுத்து ‘ஹெலே’ என்றும் எழுதலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: மகன்கள்
  rationale: וּ என்பது முந்தைய வம்சப்பட்டியலுடன் இணைக்கும் சொல்; தனி வசனமாக வாசிக்கும்போது தமிழில் கட்டாயமாக ‘மேலும்’ என்று சேர்க்காமல் இயல்பாக விடப்பட்டுள்ளது. בְנֵי என்பதன் நேரடிப் பொருள் ‘மகன்கள்’; வம்சப்பட்டியல் சூழலில் அது வழித்தோன்றல்களையும் குறிக்கக்கூடும்.
- source_word: חֶלְאָה
  choice: ஹெலா
  rationale: இது ஒரு நபரின் பெயர். எபிரெய மெய்யெழுத்துகளையும் உயிரொலிப்பையும் நெருக்கமாகக் காட்டும் வகையில் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: צֶרֶת
  choice: செரெத்
  rationale: எபிரெயப் பெயரான ṣeret தமிழில் அதன் ஒலியமைப்புக்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: יצחר
  choice: யிட்ஸ்ஹார்
  rationale: கொடுக்கப்பட்ட எபிரெய மெய்யெழுத்து வடிவமான y-ṣ-ḥ-r தெளிவாகத் தெரியும்படி ஒலிபெயர்க்கப்பட்டுள்ளது; வழக்கமான மொழிபெயர்ப்புகளில் காணப்படும் ‘இஸ்ஹார்’ என்ற வடிவத்தால் மூலத்தின் தொடக்க y ஒலியும் ṣ/ḥ வேறுபாடுகளும் மறையக்கூடும்.
- source_word: וְ/אֶתְנָן
  choice: எத்னான்
  rationale: இறுதிப் பெயரை இணைக்கும் וְ தமிழ்ப் பட்டியலின் நிறுத்தக்குறியால் இயல்பாக வெளிப்படுகிறது; אֶתְנָן என்பது பெயராக ஒலிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: ‘மகன்கள்’ என்ற வம்சப்பட்டியல் சொற்றொடரின் பரப்பு
  choice: மூலத்தின் ஆண்பால் உறவுச் சொல்லை ‘மகன்கள்’ என்று நேரடியாக வைத்துக் கொண்டு, அதன் விரிவான வம்சவழிப் பயன்பாட்டை அடிக்குறிப்பில் குறிப்பிட்டல்
  alternative: ‘வழித்தோன்றல்கள்’ என்று முதன்மை உரையிலேயே விரிவாக்குதல்
  rationale: நபர்களின் துல்லியமான தலைமுறை உறவு இவ்வசனத்தில் விளக்கப்படவில்லை. ஆகவே மூலத்தின் வடிவத்தையும் அதன் இயல்பான வம்சப்பட்டியல் நெகிழ்வையும் இரண்டையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் சுருக்கமான வம்சப்பட்டியல் நடையைப் பேணுகிறது. பெயர்கள் ஆங்கில மரபிலிருந்து அல்லாமல் கொடுக்கப்பட்ட எபிரெய வடிவத்திலிருந்து ஒலிபெயர்க்கப்பட்டுள்ளன; வாசிப்புத் தெளிவுக்காக பட்டியலுக்கு முன் முக்காற்புள்ளி பயன்படுத்தப்பட்டுள்ளது.
