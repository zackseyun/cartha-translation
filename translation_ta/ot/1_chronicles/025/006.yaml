source:
  edition: WLC
  text: כָּל אֵ֣לֶּה עַל יְדֵי֩ אֲבִי/הֶ֨ם בַּ/שִּׁ֜יר בֵּ֣ית יְהוָ֗ה בִּ/מְצִלְתַּ֨יִם֙ נְבָלִ֣ים וְ/כִנֹּר֔וֹת לַ/עֲבֹדַ֖ת בֵּ֣ית הָ/אֱלֹהִ֑ים עַ֚ל יְדֵ֣י הַ/מֶּ֔לֶךְ אָסָ֥ף וִ/ידוּת֖וּן וְ/הֵימָֽן־־ס׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/006.yaml
  text: 'All these were under the direction of their father in the music of the house of Yahweh[a], with cymbals, harps, and lyres, for the service of the house of God, under the direction of the king: Asaph, Jeduthun[c][b], and Heman.'
translation:
  language: ta
  text: இவர்கள் அனைவரும் தங்கள் தந்தையின் வழிநடத்துதலின்கீழ்[a], யாவேயின் ஆலயத்தில் இசைப் பணியைச் செய்தனர்; கைத்தாளங்கள், வீணைகள், யாழ்கள்[c] ஆகியவற்றுடன் தேவனுடைய ஆலயச் சேவைக்காகப் பணியாற்றினர். அவர்கள் அரசன், ஆசாப், எதுத்தூன், ஏமான் ஆகியோரின் மேற்பார்வையின்கீழ் இருந்தனர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேரடியாக, “தங்கள் தந்தையின் கையால்”; இந்த எபிரெய சொல்லடைவு வழிநடத்துதல், மேற்பார்வை அல்லது செயலாண்மையைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: “வீணைகள்” என்றும் “யாழ்கள்” என்றும் மொழிபெயர்க்கப்பட்டுள்ள பண்டைய இசைக்கருவிகள் துல்லியமாக எந்த வகையைச் சேர்ந்தவை என்பது உறுதியாகத் தெரியவில்லை.
    reason: cultural_note
lexical_decisions:
- source_word: עַל יְדֵי אֲבִיהֶם
  choice: தங்கள் தந்தையின் வழிநடத்துதலின்கீழ்
  rationale: எபிரெய மொழியின் ‘கையின்கீழ்/கைகளால்’ என்ற சொல்லடைவு இங்கு இசைப்பணியின் மேற்பார்வையையும் வழிநடத்துதலையும் குறிக்கிறது. ஒருமை வடிவிலுள்ள ‘தந்தை’ என்பதும் பாதுகாக்கப்பட்டுள்ளது.
- source_word: בַּשִּׁיר
  choice: பாடும் பணியில்
  rationale: שִׁיר என்பது ‘பாடல்’ அல்லது ‘பாடுதல்’ எனப் பொருள்படலாம். ஆலய இசைச் சேவையைச் சுட்டும் சூழலில் ‘பாடும் பணியில்’ என்பது இயல்பாக உள்ளது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: בֵּית יְהוָה
  choice: யாவேயின் ஆலயம்
  rationale: ‘யாவேயின் வீடு’ என்ற நேரடிப் பொருளை, இங்கு குறிக்கப்படும் வழிபாட்டு இடத்திற்கேற்ற இயல்பான நவீனத் தமிழில் ‘ஆலயம்’ என வழங்குகிறது; יהוה என்ற திருப்பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: בִּמְצִלְתַּיִם
  choice: கைத்தாளங்கள்
  rationale: ஆலய இசையில் ஒன்றோடொன்று மோதிச் சத்தமெழுப்பும் தாளக் கருவிகளைச் சுட்டுகிறது.
- source_word: נְבָלִים וְכִנֹּרוֹת
  choice: வீணைகள், யாழ்கள்
  rationale: இரண்டு வேறுபட்ட பண்டைய நரம்பிசைக் கருவிகளை வேறுபடுத்திக் காட்டும் புரிந்துகொள்ளத்தக்க தமிழ்ச் சொற்கள் தேர்ந்தெடுக்கப்பட்டுள்ளன; அவற்றின் துல்லியமான நவீன ஒப்புமை உறுதியற்றது.
- source_word: לַעֲבֹדַת בֵּית הָאֱלֹהִים
  choice: தேவனுடைய ஆலயப் பணியைச் செய்தார்கள்
  rationale: עֲבֹדָה இங்கு வழிபாட்டுடன் தொடர்புடைய பணி அல்லது சேவையைக் குறிக்கிறது. ‘ஆலயப் பணி’ என்பது பிற்காலச் சமயப் பதவிச்சொற்களைத் திணிக்காமல் பொருளைத் தெளிவாக்குகிறது.
- source_word: עַל יְדֵי הַמֶּלֶךְ
  choice: அரசனின் வழிநடத்துதலின்கீழ்
  rationale: முதலாவது עַל יְדֵי சொல்லடைவுடன் ஒத்த வகையில் அரசனின் மேற்பார்வை அல்லது அதிகாரத்தை வெளிப்படுத்துகிறது.
- source_word: אָסָף וִידוּתוּן וְהֵימָן
  choice: ஆசாப், எதுத்தூன், ஏமான்
  rationale: தனிநபர் பெயர்கள் தமிழின் இயல்பான ஒலிமுறைக்கேற்ப ஒலிபெயர்க்கப்பட்டுள்ளன.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பொதுப்பட்டப் பெயர் அல்லாமல் நான்கெழுத்துத் திருப்பெயர் நேரடியாக இருப்பதால், அதை ‘யாவே’ என ஒலிபெயர்ப்பது இறைப்பெயருக்கும் אֱלֹהִים (‘தேவன்’) என்பதற்கும் உள்ள வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: עַל יְדֵי הַמֶּלֶךְ என்பதற்கும் பின்வரும் மூன்று பெயர்களுக்கும் உள்ள தொடரியல் உறவு
  choice: ஆசாப், எதுத்தூன், ஏமான் ஆகியோர் அரசனின் வழிநடத்துதலின்கீழ் இருந்தார்கள்
  alternative: அரசன், ஆசாப், எதுத்தூன், ஏமான் ஆகியோரின் வழிநடத்துதலின்கீழ்
  rationale: எபிரெய வாக்கிய அமைப்பில் ‘அரசனின் வழிநடத்துதலின்கீழ்’ என்பதற்குப் பின் வரும் ஆசாப், எதுத்தூன், ஏமான் ஆகியோர், அரசனின்கீழ் இருந்த தலைவர்களாகப் புரிந்துகொள்ளப்படுவது சூழலுக்கும் இலக்கணத்துக்கும் பொருந்துகிறது. அரசனையும் அந்தப் பெயர்களையும் ஒரே பட்டியலாக இணைப்பது עַל־יְדֵי என்பதன் அமைப்பை இயல்பின்றி மாற்றும்.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘வழிநடத்துதலின்கீழ்’ என்பது நிர்வாக மற்றும் இசை மேற்பார்வை இரண்டையும் உள்ளடக்குகிறது. நீண்ட எபிரெய வாக்கியம் தமிழில் தெளிவுக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது; மூலத்தின் கருத்து வரிசை பாதுகாக்கப்பட்டுள்ளது.
