lexical_decisions:
- source_word: לִ/שְׁלֹשָׁה וְ/עֶשְׂרִים
  choice: இருபத்துமூன்றாவது பங்கு
  rationale: சீட்டுப்போட்டு பணிப்பிரிவுகளை ஒதுக்கும் இந்தப் பட்டியலின் சூழலில், முன்னொட்டு ל ஒதுக்கீட்டைக் குறிக்கிறது; எபிரெய எண்ணமைப்பு மரபுத்தொடராக இருபத்துமூன்றாவது என்ற வரிசை எண்ணைக் குறிக்கிறது. இயல்பான தமிழுக்காக சூழலில் உள்ள ‘பங்கு’ வெளிப்படையாகச் சேர்க்கப்பட்டது.
- source_word: לְ/מַחֲזִיאוֹת
  choice: மகசியோத்துக்கு
  rationale: இது ஒரு நபரின் இயற்பெயர்; எனவே பொருள் மொழிபெயர்ப்பு செய்யாமல் தமிழில் ஒலிபெயர்க்கப்பட்டது. ל முன்னொட்டு இங்கு ஒதுக்கீட்டைப் பெறுபவரைக் குறிக்கும் வேற்றுமையாகத் தரப்பட்டது.
- source_word: בָּנָיו
  choice: அவருடைய மகன்கள்
  rationale: எபிரெயச் சொல் குறிப்பாக ஆண் பிள்ளைகளைக் குறிக்கிறது; பட்டியல் சூழலுக்கு ஏற்றவாறு ‘மகன்கள்’ என நேரடியாக மொழிபெயர்க்கப்பட்டது.
- source_word: וְאֶחָיו
  choice: சகோதரர்கள்
  rationale: இந்தப் பட்டியல் சூழலில் אח என்பது சகோதரர்களைக் குறிக்கிறது; ‘உறவினர்கள்’ போன்ற விரிவான சொல்லைத் தவிர்த்து துல்லியமாக மொழிபெயர்க்கப்பட்டது.
- source_word: שְׁנֵים עָשָׂר
  choice: பன்னிரண்டு பேர்
  rationale: மகன்களும் சகோதரர்களும் சேர்ந்த மொத்த எண்ணிக்கையை இது தருகிறது; நபர்களின் எண்ணிக்கை என்பதை இயல்பான தமிழில் காட்ட ‘பேர்’ சேர்க்கப்பட்டது.
