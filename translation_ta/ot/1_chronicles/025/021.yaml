  text: The fourteenth was Mattithiah[a], his sons and his brothers, twelve.
translation:
  language: ta
  text: 'பதினான்காவது பங்கு மத்தித்தியாவுக்கு: அவருடைய மகன்களும் சகோதரர்களும் பன்னிரண்டு பேர்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְאַרְבָּעָה עָשָׂר
  choice: பதினான்காவது பங்கு ... வந்தது
  rationale: இந்தப் பட்டியலின் சூழலில் לְ + எண், சீட்டினால் ஒதுக்கப்பட்ட வரிசைப் பங்கைக் குறிக்கிறது. தமிழில் இயல்பாகவும் சூழலைத் தெளிவாகவும் காட்ட ‘பதினான்காவது பங்கு ... வந்தது’ என வழங்கப்படுகிறது.
- source_word: מַתִּתְיָהוּ
  choice: மத்தித்தியா
  rationale: எபிரெய தனிப்பெயரின் ஒலியை நவீனத் தமிழில் இயல்பாக எழுத்துப்பெயர்த்த வடிவம்.
- source_word: בָּנָיו
  choice: அவருடைய மகன்கள்
  rationale: எபிரெயச் சொல் பொதுவாகப் பிள்ளைகள் என்று அல்லாமல் குறிப்பாக மகன்கள் என்று குறிக்கிறது.
- source_word: וְאֶחָיו
  choice: சகோதரர்கள்
  rationale: இச்சொல்லின் நேரடியான பொருளான ஆண் உடன்பிறந்தோர் அல்லது குழுவின் சகோதரர்கள் என்பதைக் காக்கிறது; ‘உறவினர்கள்’ என்பது தேவையற்ற அளவு விரிவானது.
- source_word: שְׁנֵים עָשָׂר
  choice: மொத்தம் பன்னிரண்டு பேர்
  rationale: மத்தித்தியாவுடன் தொடர்புடைய மகன்களும் சகோதரர்களும் சேர்ந்த எண்ணிக்கையைத் தமிழில் தெளிவாகக் காட்டுகிறது; ‘பேர்’ மனிதர்களின் எண்ணிக்கை என்பதை இயல்பாக உணர்த்துகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், பட்டியல் நடையின் சுருக்கத்தைக் காக்கும் அதேவேளையில் பொருள் தெளிவாக இருக்குமாறு மொழிபெயர்க்கப்பட்டுள்ளது. மரியாதை ஒருமை காரணமாக மத்தித்தியாவைக் குறிக்க ‘அவருடைய’ பயன்படுத்தப்பட்டுள்ளது.
