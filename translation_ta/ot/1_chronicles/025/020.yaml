  text: The thirteenth[a], Shubael; his sons and his brothers, twelve.
translation:
  language: ta
  text: 'பதின்மூன்றாவது[a]: ஷூபாயேல்; அவருடைய மகன்களும் சகோதரர்களும்—பன்னிரண்டு பேர்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்கு சொல், “பதின்மூன்றாவதற்கு, ஷூபாயேல்.” சுற்றியுள்ள வசனங்களின் அடிப்படையில் ‘சீட்டு’ என்பது இங்கே உள்ளடங்கிய கருத்து.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁלֹשָׁה עָשָׂר
  choice: பதின்மூன்றாவது
  rationale: முன்னொட்டான לְ, சீட்டுகளின் வரிசையைச் சொல்லும் இப்பட்டியலில் ஒதுக்கீட்டைக் குறிக்கிறது. எபிரெயத்தில் ‘சீட்டு’ என்ற சொல் இவ்வசனத்தில் வெளிப்படையாக இல்லை; சுற்றியுள்ள வசனங்களிலிருந்து அது புரிகிறது. ஆகவே அதை முதன்மை உரையில் சேர்க்காமல் பட்டியல் நடையில் மொழிபெயர்க்கப்பட்டது.
- source_word: שׁוּבָאֵל
  choice: ஷூபாயேல்
  rationale: தனிப்பெயர் மொழிபெயர்க்கப்படாமல், எபிரெய உச்சரிப்புக்கு அண்மையாகத் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: בָּנָיו
  choice: அவருடைய மகன்கள்
  rationale: எபிரெயச் சொல் பொதுவாகப் பிள்ளைகளை அல்ல, குறிப்பாக மகன்களைக் குறிக்கிறது.
- source_word: וְאֶחָיו
  choice: சகோதரர்களும்
  rationale: சொல்லின் நேரடிப் பொருள் ‘சகோதரர்கள்’. இச்சூழலில் ஆண் உறவினர்களையோ குழுவைச் சேர்ந்தவர்களையோ உள்ளடக்கக்கூடும் என்றாலும், மூலச்சொல்லின் இயல்பான பொருள் பாதுகாக்கப்பட்டது.
- source_word: שְׁנֵים עָשָׂר
  choice: பன்னிரண்டு பேர்
  rationale: ஷூபாயேலுடன் குறிப்பிடப்படும் மகன்களும் சகோதரர்களும் சேர்ந்த எண்ணிக்கையை இது தருகிறது. மனிதர்களின் எண்ணிக்கை என்பதைக் காட்ட ‘பேர்’ இயல்பாகச் சேர்க்கப்பட்டது.
