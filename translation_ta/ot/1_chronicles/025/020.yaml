  source_fidelity: 'மூல எபிரெயத்தின் பட்டியல் நடையும் கூறுகளும் துல்லியமாகப் பாதுகாக்கப்பட்டுள்ளன: לִשְׁלֹשָׁה עָשָׂר என்பதற்கு «பதின்மூன்றாவது», שׁוּבָאֵל என்பதற்கு «ஷூபாயேல்», בָּנָיו וְאֶחָיו என்பதற்கு «அவருடைய மகன்களும் சகோதரர்களும்», மற்றும் שְׁנֵים עָשָׂר என்பதற்கு «பன்னிரண்டு பேர்» சரியாக அமைந்துள்ளன. «சீட்டு» முதன்மை உரையில் சேர்க்கப்படாமல், சூழலில் உட்கிடக்கும் கருத்தாகக் குறிப்பு வழியாக மட்டுமே விளக்கப்படுவது மூலத்திற்கு உண்மையானது.'
  naturalness: '«பதின்மூன்றாவது: ஷூபாயேல்; அவருடைய மகன்களும் சகோதரர்களும்—பன்னிரண்டு பேர்» நவீன தரநிலைத் தமிழில் சுருக்கமான பட்டியல் நடையாக இயல்பாக உள்ளது. «பேர்» என்பது மனிதர்களின் எண்ணிக்கையைத் தெளிவாக்குகிறது; மூலத்தின் சுருக்கத்தையும் குலைக்கவில்லை.'
