  text: the eighth to Jeshaiah[a], his sons and his brothers, twelve.
translation:
  language: ta
  text: 'எட்டாவது: எசாயா; அவனுடைய மகன்களும் அவனுடைய சகோதரர்களும்—பன்னிரண்டு பேர்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַשְּׁמִינִי
  choice: எட்டாவது
  rationale: எபிரெய உரையில் வரும் உருபுடன் கூடிய வரிசை எண்ணை நேரடியாக மொழிபெயர்க்கிறது. சுற்றியுள்ள பட்டியலின் சூழலில் ‘சீட்டு’ என்பது புரிந்துகொள்ளப்பட்டாலும், இவ்வசனத்தில் அந்தச் சொல் வெளிப்படையாக இல்லை.
- source_word: יְשַׁעְיָהוּ
  choice: எசாயா
  rationale: தனிப்பெயரைத் தமிழில் இயல்பான வேதாகமப் பெயர் வடிவில் ஒலிபெயர்க்கிறது.
- source_word: בָּנָיו
  choice: அவனுடைய மகன்கள்
  rationale: בנים இங்கு பொதுவாகப் பிள்ளைகள் என்பதைக் காட்டிலும் குறிப்பாக மகன்களைக் குறிக்கிறது; மூலத்தின் பாலினக் குறிப்பைப் பாதுகாக்கிறது.
- source_word: וְאֶחָיו
  choice: அவனுடைய சகோதரர்கள்
  rationale: אחים என்பதன் நேரடியான குடும்ப உறவுப் பொருளைத் தக்கவைக்கிறது; இச்சூழலில் ‘உறவினர்கள்’ என்று விரிவாக்கத் தெளிவான காரணம் இல்லை.
- source_word: שְׁנֵים עָשָׂר
  choice: மொத்தம் பன்னிரண்டு பேர்
  rationale: குழுவின் மொத்த எண்ணிக்கையைத் தெளிவான இயற்கைத் தமிழில் தருகிறது. எபிரெயத்தில் வினைச்சொல் இல்லாத சுருக்கமான பட்டியல் நடையை நீளமாக்காமல், மனிதர்களைக் கணக்கிடும் ‘பேர்’ என்பதையும் தெளிவுக்காகச் சேர்க்கிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், பட்டியலுக்குரிய சுருக்கத்தையும் கண்ணியமான நடையையும் பேணுகிறது. ‘எட்டாவது’ என்பதற்குப் பின் உள்ள மறைபொருளை முதன்மை உரையில் நிரப்பாமல், அடிக்குறிப்பில் ‘சீட்டு’ என்ற சூழல்சார் மாற்றை வழங்குகிறது.
