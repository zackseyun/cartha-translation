- source_word: וְאֶחָיו
  choice: சகோதரர்கள்
  rationale: நேரடியான பொருள் ‘அவனுடைய சகோதரர்கள்.’ இச்சூழலில் ஆண் உறவினர்கள் அல்லது குலத்தாரையும் குறிக்கக்கூடும்; ஆயினும் மூலத்தின் வெளிப்படையான சொல்லைத் தக்கவைத்துள்ளது.
- source_word: שְׁנֵים עָשָׂר
  choice: பன்னிரண்டு பேர்
  rationale: எரேமோத்தின் மகன்களும் சகோதரர்களும் சேர்ந்த எண்ணிக்கையைக் குறிக்கும் எண்; தமிழில் நபர்களைக் கணக்கிடுவதால் ‘பேர்’ இயல்பாகச் சேர்க்கப்பட்டுள்ளது.
