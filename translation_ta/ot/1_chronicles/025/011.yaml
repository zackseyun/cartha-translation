base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/011.yaml
  text: The fourth[a], to Izri, his sons and his brothers, twelve.
translation:
  language: ta
  text: நான்காவது[a] இஸ்ரிக்கு; அவனுடைய மகன்களும் சகோதரர்களும் பன்னிரண்டு பேர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, சூழலை வெளிப்படையாக்கி, “நான்காவது சீட்டு இஸ்ரிக்கு விழுந்தது.” சுற்றியுள்ள பட்டியலிலிருந்து “சீட்டு” என்பது உணர்த்தப்படுகிறது; ஆனால் இந்த வசனத்தில் அந்தச் சொல் இடம்பெறவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרְבִיעִי
  choice: நான்காவது
  rationale: எபிரெய உரையில் வரிசை எண்ணே உள்ளது; சூழலில் ‘சீட்டு’ என்பது உணர்த்தப்பட்டாலும் இவ்வசனத்தில் வெளிப்படையாகக் கூறப்படாததால் முதன்மை உரையில் அதைச் சேர்க்கவில்லை.
- source_word: לַיִּצְרִי
  choice: இஸ்ரிக்கு
  rationale: முன்னொட்டு ל இப்பட்டியலில் ஒதுக்கீட்டைப் குறிக்கிறது; தமிழில் ‘இஸ்ரிக்கு’ என்பது அதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בָּנָיו
  choice: அவனுடைய மகன்கள்
  rationale: எபிரெயச் சொல் குறிப்பாக ஆண் பிள்ளைகளைக் குறிக்கும் ‘மகன்கள்’ என்பதால் அதே துல்லியம் காக்கப்பட்டுள்ளது.
- source_word: וְאֶחָיו
  choice: அவனுடைய சகோதரர்கள்
  rationale: அடிப்படைப் பொருள் ‘சகோதரர்கள்’; இச்சூழலில் ஆண் உறவினர்கள் அல்லது உடனிருந்த குழுவினரையும் குறிக்கக்கூடும் என்றாலும் நேரடியான பொருள் முதன்மைப்படுத்தப்பட்டுள்ளது.
- source_word: שְׁנֵים עָשָׂר
  choice: மொத்தம் பன்னிரண்டு பேர்
  rationale: இது குழுவின் மொத்த எண்ணிக்கையைக் குறிக்கிறது. இயல்பான தமிழுக்காக ‘மொத்தம்’ மற்றும் மனிதர்களைக் குறிக்கும் ‘பேர்’ சேர்க்கப்பட்டுள்ளன.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், பட்டியலுக்குரிய சுருக்கமான அமைப்பைப் பேணியபடியே வாசிப்புத் தெளிவுக்காக அரைப்புள்ளியும் நீள்கோடும் பயன்படுத்தப்பட்டுள்ளன. பெயர் WLC மெய்யெழுத்து வடிவத்தின்படி ‘இஸ்ரி’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
