source:
  edition: WLC
  text: לְ/הֵימָ֑ן בְּנֵ֣י הֵימָ֡ן בֻּקִּיָּ֡הוּ מַתַּנְיָ֡הוּ עֻ֠זִּיאֵל שְׁבוּאֵ֨ל וִֽ/ירִימ֜וֹת חֲנַנְיָ֣ה חֲנָ֗נִי אֱלִיאָ֤תָה גִדַּ֨לְתִּי֙ וְ/רֹמַ֣מְתִּי עֶ֔זֶר יָשְׁבְּקָ֣שָׁה מַלּ֔וֹתִי הוֹתִ֖יר מַחֲזִיאֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/004.yaml
  text: 'To Heman: the sons of Heman: Bukkiah[a], Mattaniah, Uzziel, Shebuel, and Jerimoth, Hananiah, Hanani, Eliathah, Giddalti, and Romamti-ezer, Joshbekashah, Mallothi, Hothir[c][b], Mahazioth.'
translation:
  language: ta
  text: 'ஏமானுக்கு: ஏமானின் மகன்கள்: புக்கியா, மத்தனியா, உசியேல், செபுவேல், யெரிமோத், அனனியா, அனானி, எலியாத்தா, கித்தல்தி, ரோமம்தி-எசேர்[a], யாஷ்பெகாஷா, மல்லோத்தி, ஓத்திர், மகசியோத்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இந்தப் பட்டியலின் ஒரு பகுதியை—குறிப்பாக ‘கித்தல்தி, ரோமம்தி-எசேர்’ என்பவற்றைச் சுற்றியுள்ள சொற்களை—தனிப்பெயர்களாக மட்டுமல்லாமல் ஒரு பொருளுள்ள சொற்றொடராகவும் வாசிக்கலாம் என்று சிலர் கருதுகின்றனர். இங்குள்ள சூழல் பெயர்ப்பட்டியல் என்பதால், இம்மொழிபெயர்ப்பு அவற்றை ஆட்களின் பெயர்களாக வழங்குகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: לְהֵימָן
  choice: ஏமானுக்கு
  rationale: முன்னொட்டான ל இந்த அதிகாரத்தில் பணிப்பிரிவை அல்லது ஒதுக்கீட்டைச் சுட்டுகிறது; பட்டியலின் அமைப்பைத் தெளிவாகக் காட்ட ‘ஏமானுக்கு’ என மொழிபெயர்க்கப்பட்டது.
- source_word: בְּנֵי הֵימָן
  choice: ஏமானின் மகன்கள்
  rationale: בני என்பதன் நேரடியான பொருள் ‘மகன்கள்’; இங்கு பெயரிடப்பட்ட சந்ததியரின் பட்டியல் வருவதால் இயல்பான தமிழில் இவ்வாறு தரப்பட்டது.
- source_word: שְׁבוּאֵל
  choice: செபுவேல்
  rationale: எபிரெய மூலத்தின் மெய்யெழுத்துகளையும் உயிரொலியையும் நெருக்கமாகக் காட்டும் தமிழ் ஒலிபெயர்ப்பு.
- source_word: וִירִימוֹת
  choice: எரிமோத்
  rationale: ו இணைப்புச்சொல் தமிழ்ப் பட்டியலின் நிறுத்தக்குறிகளால் வெளிப்படுகிறது; יְרִימוֹת என்ற பெயர் மூல ஒலிக்கு நெருக்கமாக ‘எரிமோத்’ என ஒலிபெயர்க்கப்பட்டது.
- source_word: גִדַּלְתִּי
  choice: கித்தல்தி
  rationale: இவ்வடிவம் வேறு சூழலில் வினைச்சொல் போன்று புரிந்துகொள்ளப்படலாம்; ஆனால் இங்குள்ள சந்ததியர் பட்டியலில் தனிப்பெயராக ஒலிபெயர்க்கப்பட்டது.
- source_word: וְרֹמַמְתִּי עֶזֶר
  choice: ரோமம்தி-ஏசேர்
  rationale: உடனடி இலக்கியச் சூழல் பெயர்ப்பட்டியல் என்பதால், இரண்டு கூறுகளையுடைய ஒரே தனிப்பெயராகக் கொண்டு இடைக்கோட்டுடன் தரப்பட்டது.
theological_decisions:
- issue: கித்தல்தி, ரோமம்தி-ஏசேர் உள்ளிட்ட சில வடிவங்களை தனிப்பெயர்களாகக் கொள்வதா, பொருளுள்ள சொற்றொடராகக் கொள்வதா
  choice: ‘ஏமானின் மகன்கள்’ என்பதற்குப் பின் வருவன அனைத்தையும் ஆட்களின் பெயர்களாக வழங்குதல்
  alternative: சில பெயர்களை ‘நான் பெரிதாக்கினேன்; உதவியை உயர்த்தினேன்’ போன்ற ஒரு சொற்றொடரின் பகுதிகளாக வாசித்தல்
  rationale: உடனடி சூழல் இசைப் பணிக்குழுக்களையும் ஏமானின் மகன்களையும் வரிசைப்படுத்தும் பட்டியல். எனவே பெயர்களாக வழங்குவது வெளிப்படையான சூழலோடு நன்கு பொருந்துகிறது; அதேவேளையில் மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பட்டியலுக்கேற்ற சுருக்கமான மற்றும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. எபிரெய தனிப்பெயர்கள் ஆங்கில வடிவங்கள் வழியாக அல்லாமல் மூல மொழியின் ஒலிக்கு இயன்றவரை நெருக்கமாகத் தமிழ் எழுத்துகளில் தரப்பட்டன.
