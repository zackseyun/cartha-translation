base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/002.yaml
  text: 'Of the sons of Asaph: Zaccur[a], Joseph, Nethaniah, and Asharelah, sons of Asaph, under the direction of Asaph, who prophesied under the direction of the king.'
translation:
  language: ta
  text: 'ஆசாப்பின் மகன்களில்: சக்கூர், யோசேப்பு, நெத்தனியா, அசரேலா. இவர்கள் ஆசாப்பின் மகன்கள்; அரசனின் மேற்பார்வையின்கீழ் தீர்க்கதரிசனம் உரைத்த ஆசாப்பின் மேற்பார்வையின்கீழ் இருந்தவர்கள்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆசாப்பின் கையால் … அரசனின் கையால்.” இங்கு வரும் எபிரேயச் சொல்லடை முகமை, மேற்பார்வை அல்லது வழிநடத்துதலைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי
  choice: மகன்களில்
  rationale: இந்தப் பட்டியல் அமைப்பில் ל முன்னொட்டு எண்ணிக் குறிப்பிடப்படும் உட்பிரிவை அறிமுகப்படுத்துகிறது; ‘மகன்களில்’ என்பது தமிழில் இயல்பாகவும் பட்டியலின் தொடர்பைத் தெளிவாகவும் காட்டுகிறது.
- source_word: זַכּוּר וְיוֹסֵף וּנְתַנְיָה וַאֲשַׂרְאֵלָה
  choice: சக்கூர், யோசேப்பு, நெத்தனியா, அசரேலா
  rationale: எபிரேயப் பெயர்களின் ஒலிவடிவத்தை நவீனத் தமிழுக்கு ஏற்ற எழுத்துப்பெயர்ப்பில் வழங்குகிறது.
- source_word: בְּנֵי אָסָף
  choice: ஆசாப்பின் மகன்கள்
  rationale: மூலத்தில் மீண்டும் வரும் சொற்றொடரைத் தக்கவைத்து, பட்டியலிடப்பட்டவர்கள் ஆசாப்பின் மகன்கள் என்பதைத் தெளிவாக்குகிறது.
- source_word: עַל יַד / עַל יְדֵי
  choice: வழிநடத்துதலின்கீழ்
  rationale: சொல்லுக்கு சொல் ‘கையின்கீழ்/கையால்’ என்றாலும், இச்சொல்லடை முகமை, மேற்பார்வை அல்லது வழிநடத்துதலைக் குறிக்கலாம். தமிழில் நிர்வாகத் தொடர்பை இயல்பாக வெளிப்படுத்தும் வடிவம் தேர்ந்தெடுக்கப்பட்டது; மாற்று நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: הַנִּבָּא
  choice: தீர்க்கதரிசனம் உரைத்தார்
  rationale: נבא என்ற வினையின் தீர்க்கதரிசனச் செயற்பாட்டைத் தக்கவைக்கிறது; ஆலய இசைச் சூழல் இருப்பினும் அதை வெறும் பாடல் அல்லது இசை நிகழ்ச்சியாகக் குறுக்கவில்லை.
theological_decisions:
- issue: ஆலய இசைச் சூழலில் ‘தீர்க்கதரிசனம் உரைத்தல்’ என்பதன் பொருள்
  choice: தீர்க்கதரிசனம் உரைத்தார்
  alternative: ஆவியால் ஏவப்பட்ட இசையை நிகழ்த்தினார் / தீர்க்கதரிசன முறையில் பாடினார்
  rationale: நாளாகம ஆசிரியர் ஆலய இசைப்பணியுடன் தொடர்புடைய செயலைக் குறிக்க נבא என்ற சொல்லைப் பயன்படுத்துகிறார். அதன் இறையியல் வலிமையை மங்கச் செய்யாமல், சூழலால் இசைத் தொடர்பைப் புரிந்துகொள்ள இடமளிக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளக்கூடிய கண்ணியமான நடையில் அமைக்கப்பட்டது. பட்டியல் தன்மையும் மூலத்தின் மறுபடியும் கூறுதலும் பாதுகாக்கப்பட்டுள்ளன; எபிரேயச் சொல்லடையின் உண்மையான பொருள் நெகிழ்வு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
