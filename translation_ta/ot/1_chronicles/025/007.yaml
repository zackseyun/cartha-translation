  text: וַ/יְהִ֤י מִסְפָּרָ/ם֙ עִם אֲחֵי/הֶ֔ם מְלֻמְּדֵי שִׁ֖יר לַ/יהוָ֑ה כָּל הַ֨/מֵּבִ֔ין מָאתַ֖יִם שְׁמוֹנִ֥ים וּ/שְׁמוֹנָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/007.yaml
  text: Their number[a], together with their brothers who were trained in singing to Yahweh, all who were skillful[b], was two hundred eighty-eight.
translation:
  language: ta
  text: யாவேக்குப் பாடுவதில் பயிற்சி பெற்ற அவர்களும் அவர்களுடைய சகோதரர்களும், திறமை வாய்ந்த அனைவரும், இருநூற்று எண்பத்தெட்டு பேர்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִסְפָּרָם
  choice: அனைவரின் எண்ணிக்கை
  rationale: பின்னர் வரும் எண்ணிக்கையுடன் இயல்பான தமிழில் இணைகிறது; எபிரெயச் சொல்லின் ‘அவர்களுடைய எண்ணிக்கை’ என்ற பொருளைப் பாதுகாக்கிறது.
- source_word: עִם אֲחֵיהֶם
  choice: தங்கள் சகோதரர்களுடன் சேர்த்து
  rationale: עִם குறிக்கும் உடன்சேர்தலை வெளிப்படுத்துகிறது; ஆண் லேவிய இசைப்பணியாளர்களைக் குறிக்கும் சூழலில் ‘சகோதரர்கள்’ தக்கவைக்கப்படுகிறது.
- source_word: מְלֻמְּדֵי שִׁיר
  choice: பாடுவதில் பயிற்சி பெற்றிருந்த
  rationale: למד என்பதன் பயிற்றுவிக்கப்பட்ட நிலையும் שִׁיר என்பதன் பாடுதல் சார்ந்த பொருளும் தெளிவாக வெளிப்படுகின்றன.
- source_word: לַיהוָה
  choice: யாவேக்குப்
  rationale: ל முன்னிடைச்சொல் பாடலின் நோக்கம் அல்லது திசையைச் சுட்டுகிறது; יהוה என்ற உடன்படிக்கைப் பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்படுகிறது.
- source_word: כָּל הַמֵּבִין
  choice: திறமை வாய்ந்தவர்கள் அனைவரும்
  rationale: இசைப்பணியில் புரிதல், தேர்ச்சி, செயல்வல்லமை உடையவர்களைக் குறிக்கும் சூழல்சார் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: מָאתַיִם שְׁמוֹנִים וּשְׁמוֹנָה
  choice: இருநூற்று எண்பத்தெட்டு
  rationale: எபிரெய எண்ணின் நேரடியான மதிப்பு 288; வேதாகம உரைநடைக்கு ஏற்றவாறு சொற்களால் எழுதப்படுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் நான்கெழுத்து இறைப்பெயர் நேரடியாக உள்ளது; பொதுப்பட்டமாக மாற்றாமல் உடன்படிக்கைப் பெயரைத் தக்கவைக்க ‘யாவே’ பயன்படுத்தப்படுகிறது.
- issue: כָּל הַמֵּבִין என்பதிலுள்ள ‘புரிதல்’ மற்றும் ‘திறமை’ இடையிலான நுணுக்கம்
  choice: திறமை வாய்ந்தவர்கள்
  alternative: புரிந்துகொண்டவர்கள்
  rationale: இசைப்பணி குறித்த சூழல் செயல்வல்லமை அல்லது தேர்ச்சியை முன்னிறுத்துகிறது; இருப்பினும் மூலத்தின் ‘புரிதல்’ நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் வாசிப்பின் இயல்பும் காக்கப்பட்டுள்ளன. எபிரெய வாக்கியத்தின் உறுப்புகளைத் தமிழில் தெளிவாக இணைக்க ‘சேர்த்து’ பயன்படுத்தப்பட்டுள்ளது; இசைத்திறனை மட்டும் மிகைப்படுத்தாமல் ‘புரிதல்’ என்ற மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
