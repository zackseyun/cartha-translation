  text: וַ/יֵּצֵ֞א הַ/גּוֹרָ֧ל הָ/רִאשׁ֛וֹן לְ/אָסָ֖ף לְ/יוֹסֵ֑ף גְּדַלְיָ֨הוּ֙ הַ/שֵּׁנִ֔י הֽוּא וְ/אֶחָ֥י/ו וּ/בָנָ֖י/ו שְׁנֵ֥ים עָשָֽׂר־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/009.yaml
  text: The first lot came out for Asaph[a], for Joseph; Gedaliah the second, he and his brothers and his sons[b], twelve.
translation:
  language: ta
  text: முதலாம் சீட்டு ஆசாப்பின் மகன் யோசேப்புக்கு வந்தது; இரண்டாவது சீட்டு கெதலியாவுக்கு வந்தது; அவரும் அவருடைய சகோதரர்களும் மகன்களும் சேர்ந்து பன்னிரண்டு பேர்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא הַגּוֹרָל
  choice: சீட்டு ... வந்தது
  rationale: சீட்டுப் போட்டு பங்கிடும் சூழலில் எபிரெய வினையின் ‘வெளியே வந்தது’ என்ற உருவகத்தை இயல்பான தமிழில் ‘சீட்டு வந்தது’ எனக் காக்கிறது.
- source_word: הָרִאשׁוֹן
  choice: முதலாம்
  rationale: வரிசையில் முதல் ஒதுக்கீட்டைக் குறிக்கும் எண்ணுப்பெயர்.
- source_word: לְאָסָף לְיוֹסֵף
  choice: ஆசாப்புக்காக, யோசேப்புக்கு
  rationale: முதல் சீட்டு ஆசாப்பின் பிரிவில் குறிப்பாக யோசேப்புக்கு உரியது என்ற எபிரெய அமைப்பை, அதன் சுருக்கமான இரட்டை உறவைத் தீர்த்துவிடாமல் பிரதிபலிக்கிறது.
- source_word: גְּדַלְיָהוּ הַשֵּׁנִי
  choice: இரண்டாவது கெதலியாவுக்கு வந்தது
  rationale: தமிழில் புரியும் வகையில் விடுபட்டுள்ள ‘சீட்டு வந்தது’ என்பதைப் பொருளடிப்படையில் நிரப்பி, இரண்டாம் ஒதுக்கீட்டைத் தெளிவாக்குகிறது; பெயர் வழக்கமான தமிழ் வேதாகம ஒலிபெயர்ப்பில் தரப்படுகிறது.
- source_word: הוּא וְאֶחָיו וּבָנָיו
  choice: அவரும் அவருடைய சகோதரர்களும் மகன்களும்
  rationale: தலைவராகிய அவரையும், அவரது சகோதரர்களையும், மகன்களையும் எண்ணிக்கையில் உள்ளடக்கும் மூலமொழியின் கூறுகளைப் பாதுகாக்கிறது.
- source_word: שְׁנֵים עָשָׂר
  choice: சேர்ந்து பன்னிரண்டு பேர்
  rationale: வினையற்ற எபிரெய எண்ணிக்கைத் தொடரை இயல்பான தமிழில் மொத்தக் குழுவின் எண்ணிக்கையாக வெளிப்படுத்துகிறது.
