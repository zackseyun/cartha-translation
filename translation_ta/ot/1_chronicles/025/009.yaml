  register: நவீன நிலையான தமிழ்; பட்டியல் வசனத்திற்கேற்ற சுருக்கமும் கண்ணியமும் காக்கப்பட்டுள்ளன. மூலத்தின் சற்றே இறுக்கமான அமைப்பு வாசிப்பிற்கு உதவும் அளவு மட்டும் தெளிவாக்கப்பட்டுள்ளது.
