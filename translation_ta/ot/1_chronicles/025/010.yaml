  text: மூன்றாவது சக்கூர்[a]; அவனுடைய மகன்களும் சகோதரர்களும்—மொத்தம் பன்னிரண்டு பேர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, சூழலின்படி, “மூன்றாவது சீட்டு சக்கூருக்கு விழுந்தது; அவனுடைய மகன்களும் சகோதரர்களும் மொத்தம் பன்னிரண்டு பேர்.” இங்கு “சீட்டு” என்ற சொல் எபிரெய மூலத்தில் மீண்டும் இடம்பெறவில்லை; சுற்றியுள்ள வசனங்களிலிருந்து அது புரிந்துகொள்ளப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְּׁלִשִׁי
  choice: மூன்றாவது
  rationale: இது சுற்றியுள்ள வசனங்களின் சீட்டு/பிரிவுப் பட்டியலில் வரிசையைக் குறிக்கும் பெயரடையாக உள்ளது. எபிரெயத்தில் ‘சீட்டு’ மீண்டும் சொல்லப்படாததால் முதன்மை உரையிலும் அதைச் சேர்க்காமல், குறிப்பில் சூழலை விளக்குகிறோம்.
- source_word: זַכּוּר
  choice: சக்கூர்
  rationale: எபிரெயத் தனிப்பெயரின் ஒலிபெயர்ப்பு; நவீனத் தமிழில் இயல்பாக வாசிக்கப்படும் வடிவம்.
- source_word: בָּנָיו
  choice: அவனுடைய மகன்கள்
  rationale: ஆண்பால் பன்மையுடன் மூன்றாம் நபர் ஆண்பால் ஒருமை உடைமை விகுதி இருப்பதால் ‘அவனுடைய மகன்கள்’ எனத் துல்லியமாக மொழிபெயர்க்கப்படுகிறது.
- source_word: וְאֶחָיו
  choice: சகோதரர்களும்
  rationale: இங்கு நேரடியான பொருள் ‘அவனுடைய சகோதரர்கள்’; தொடரிலுள்ள குழு உறுப்பினர்களைக் குறிக்கும் எளிய பொருளே பாதுகாக்கப்படுகிறது.
- source_word: שְׁנֵים עָשָׂר
  choice: மொத்தம் பன்னிரண்டு பேர்
  rationale: குழுவின் மொத்த எண்ணிக்கையைத் தெரிவிக்கிறது. எபிரெயத்தில் வினைச்சொல் இல்லாத பட்டியல் நடை தமிழில் தெளிவாக அமைய ‘மொத்தம்’ மற்றும் மனிதர்களைக் குறிக்கும் ‘பேர்’ சேர்க்கப்பட்டன.
