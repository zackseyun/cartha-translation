  text: for the nineteenth[a], Mallothi; his sons and his brothers, twelve.
translation:
  language: ta
  text: பத்தொன்பதாவது பங்கு[a] மல்லோத்திக்கு வந்தது; அவனுடைய மகன்களும் சகோதரர்களும் சேர்ந்து பன்னிரண்டு பேர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்படியாக, “பத்தொன்பதாவதற்கு.” இவ்வதிகாரத்தில் திரும்பத் திரும்ப வரும் சொற்றொடரின்படி, இது பத்தொன்பதாவது நியமனப் பங்கை அல்லது சீட்டுப்பங்கைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְ/תִשְׁעָה עָשָׂר
  choice: பத்தொன்பதாவது பங்கு
  rationale: எபிரெய வடிவம் சொற்படியாக ‘பத்தொன்பதாவதற்கு’ என இருந்தாலும், இவ்வதிகாரத்தில் திரும்பத் திரும்ப வரும் சீட்டுப்பங்குகளின் வரிசையைச் சூழல் தெளிவுபடுத்துகிறது. இயல்பான தமிழுக்காக ‘பங்கு’ உரையில் வெளிப்படுத்தப்பட்டது; அடிக்குறிப்பு சொற்படியான வடிவத்தைக் குறிப்பிடுகிறது.
- source_word: לְ/מַלּוֹתִי
  choice: மல்லோத்திக்கு
  rationale: இது ஓர் ஆள்பெயர். எபிரெய ஒலிப்பைத் தமிழில் இயன்றவரை பிரதிபலிக்கும் வகையில் எழுத்துப்பெயர்க்கப்பட்டு, לְ முன்னொட்டின் பெறுபொருள் ‘-க்கு’ வேற்றுமையால் காட்டப்பட்டது.
- source_word: בָּנָיו
  choice: அவனுடைய மகன்கள்
  rationale: எபிரெயச் சொல் குறிப்பாக ஆண் பிள்ளைகளைக் குறிக்கும் ‘மகன்கள்’ என்பதால் அதுவே பாதுகாக்கப்பட்டது.
- source_word: וְ/אֶחָיו
  choice: சகோதரர்கள்
  rationale: அடிப்படைப் பொருள் ‘சகோதரர்கள்’. இச்சூழலில் உறவினர் அல்லது குலத்தார் என்ற விரிவான பொருள் இருக்கக்கூடியபோதும், உரை அதைத் தெளிவாகக் கோராததால் நேரடியான பொருள் வைக்கப்பட்டது.
- source_word: שְׁנֵים עָשָׂר
  choice: பன்னிரண்டு பேர்
  rationale: குழுவின் மொத்த மனித எண்ணிக்கையைக் குறிக்கும் எளிய எண்ணுப்பெயர்; தமிழில் மனிதர்களைக் கணக்கிடும் இயல்புக்காக ‘பேர்’ சேர்க்கப்பட்டது.
