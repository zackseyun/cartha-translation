  yaml_path: translation/ot/1_chronicles/025/023.yaml
  text: The sixteenth was for Hananyahu[a], his sons and his brothers[b], twelve.
translation:
  language: ta
  text: பதினாறாவது ஹனனியாஹூவுக்கு[a]; அவனுடைய மகன்களும் சகோதரர்களும் சேர்ந்து பன்னிரண்டு பேர்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சூழலை வெளிப்படையாக்கினால், “பதினாறாவது சீட்டு ஹனனியாஹூவுக்கு விழுந்தது” எனலாம். “சீட்டு” என்பது சுற்றியுள்ள வசனங்களிலிருந்து புரிந்துகொள்ளப்படுகிறது; இந்த வசனத்தின் எபிரெய உரையில் அந்தச் சொல் இல்லை.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் சுருக்கமாக, “பன்னிரண்டு” என்று மட்டும் உள்ளது.
    reason: source_form
lexical_decisions:
- source_word: לְשִׁשָּׁה עָשָׂר
  choice: பதினாறாவது ...க்கு
  rationale: לְ முன்னிடைச்சொல்லுடன் வரும் வரிசை எண், சூழலில் சீட்டின் மூலம் செய்யப்பட்ட பதினாறாவது பங்கீட்டைக் குறிக்கிறது. எபிரெயத்தில் ‘சீட்டு’ வெளிப்படையாக இல்லாததால் முதன்மை உரையில் சேர்க்கப்படவில்லை.
- source_word: לַחֲנַנְיָהוּ
  choice: அனனியா
  rationale: חֲנַנְיָהוּ என்ற பெயரின் வழக்கமான, தமிழில் வாசிக்க இயல்பான வேதாகமப் பெயர் வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: בָּנָיו
  choice: அவனுடைய மகன்கள்
  rationale: בָּנִים இங்கு பொதுவாகப் பிள்ளைகள் என்பதல்ல, ஆண் மக்களைக் குறிப்பதால் ‘மகன்கள்’ என நேரடியாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְאֶחָיו
  choice: சகோதரர்கள்
  rationale: אָח என்பதன் நேரடிப் பொருள் ‘சகோதரன்’; பட்டியல் சூழலிலும் அதையே காக்கிறது, எனினும் இச்சொல் சில சூழல்களில் ஆண் உறவினர்களையும் குறிக்கலாம்.
- source_word: שְׁנֵים עָשָׂר
  choice: சேர்ந்து பன்னிரண்டு பேர்
  rationale: இறுதி எண், முன்கூறப்பட்ட குழுவின் மொத்த எண்ணிக்கையைத் தருகிறது. எபிரெயத்தின் சுருக்கத்தைப் பேணியபடியே தமிழில் அதன் தொடர்பைத் தெளிவாக்க ‘சேர்ந்து’ மற்றும் மனிதர்களுக்குரிய எண்ணுப்பெயரான ‘பேர்’ சேர்க்கப்பட்டன.
