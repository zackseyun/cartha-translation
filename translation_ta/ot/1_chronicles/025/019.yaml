lexical_decisions:
- source_word: הַשְּׁנֵים עָשָׂר
  choice: பன்னிரண்டாம் சீட்டு
  rationale: எபிரெய வடிவம் சொற்படியாக ‘பன்னிரண்டு’ என இருந்தாலும், தொடர்ச்சியாக சீட்டுகளின் வரிசையை எண்ணும் இச்சூழலில் அது பன்னிரண்டாவது சீட்டைக் குறிக்கிறது. தமிழில் பட்டியலின் பொருள் தெளிவாக இருக்க ‘சீட்டு’ வெளிப்படுத்தப்பட்டது.
- source_word: לַחֲשַׁבְיָה
  choice: அசபியாவுக்கு விழுந்தது
  rationale: முன்னொட்டு ל அந்தச் சீட்டு இவருக்கு ஒதுக்கப்பட்டதைக் குறிக்கிறது. எபிரெய பட்டியலில் விடுபட்டுள்ள வினையைத் தமிழின் இயல்புக்கேற்ப ‘விழுந்தது’ என்று வெளிப்படுத்துவது சீட்டுப் போடும் சூழலைத் தெளிவாக்குகிறது.
- source_word: חֲשַׁבְיָה
  choice: அசபியா
  rationale: தனிப்பெயர் எபிரெய உச்சரிப்பை அணுகும் வகையில் தமிழ் எழுத்துப்பெயர்ப்பாக வழங்கப்பட்டது.
- source_word: בָּנָיו
  choice: அவனுடைய மகன்கள்
  rationale: בנים இங்கு ஆண் பிள்ளைகளைக் குறிப்பதால் பொதுவான ‘பிள்ளைகள்’ என்பதற்குப் பதிலாக ‘மகன்கள்’ பயன்படுத்தப்பட்டது.
- source_word: וְאֶחָיו
  choice: சகோதரர்கள்
  rationale: אחים என்பதன் நேரான பொருள் ‘சகோதரர்கள்’; விரிவான ‘உறவினர்கள்’ என்ற சாத்தியத்தைச் சூழல் கட்டாயப்படுத்தவில்லை.
- source_word: שְׁנֵים עָשָׂר
  choice: மொத்தம் பன்னிரண்டு பேர்
  rationale: இறுதி எண் அந்தக் குழுவின் மொத்த எண்ணிக்கையைக் குறிக்கிறது. இயல்பான தமிழுக்காக ‘மொத்தம்’ மற்றும் மனிதர்களைக் குறிக்கும் ‘பேர்’ சேர்க்கப்பட்டன.
