  text: பன்னிரண்டாம்[a] சீட்டு ஹஷபியாவுக்கு ஒதுக்கப்பட்டது; அவனுடைய மகன்களும் சகோதரர்களுமாக பன்னிரண்டு பேர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்படியாக “பன்னிரண்டு” என்றும் மொழிபெயர்க்கலாம். ஆனால் இவ்வதிகாரத்தில் சீட்டுகள் வரிசையாகப் பட்டியலிடப்படுவதால், இங்கு “பன்னிரண்டாம்” என்பதே சூழலுக்குப் பொருத்தமானது.
