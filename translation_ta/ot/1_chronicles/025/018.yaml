translation:
  language: ta
  text: பன்னிரண்டாவது சீட்டு அசரேலுக்கு[a] விழுந்தது; அவனுடைய மகன்களும் சகோதரர்களுமாக மொத்தம் பன்னிரண்டு பேர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயப் பெயரை ‘அசரெயேல்’ என்றும் ஒலிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַשְׁתֵּי עָשָׂר
  choice: பன்னிரண்டாவது சீட்டு
  rationale: எபிரெய வடிவம் அடிப்படையில் ‘பன்னிரண்டு’ என்ற எண்ணைக் குறித்தாலும், தொடர்ச்சியாக சீட்டுகளின் வரிசையைப் பட்டியலிடும் சூழலில் பன்னிரண்டாவது சீட்டு என்பதே பொருள். தமிழில் தெளிவுக்காக ‘சீட்டு’ சேர்க்கப்பட்டது.
- source_word: עֲזַרְאֵל
  choice: அசரேல்
  rationale: தனிப்பெயர் மொழிபெயர்க்கப்படாமல் எபிரெய ஒலிப்புக்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: בָּנָיו
  choice: அவனுடைய மகன்கள்
  rationale: எபிரெயச் சொல் பொதுவான ‘பிள்ளைகள்’ என்பதைவிட குறிப்பாக ஆண் மக்களைக் குறிக்கிறது.
- source_word: וְאֶחָיו
  choice: சகோதரர்கள்
  rationale: மூலச்சொல்லின் நேரடிப் பொருள் ‘அவனுடைய சகோதரர்கள்’; உறவினர்கள் அல்லது உடனிருந்த ஆண்கள் என்ற விரிவான சாத்தியம் இருந்தாலும் அது உரையில் தீர்மானிக்கப்படவில்லை.
- source_word: שְׁנֵים עָשָׂר
  choice: மொத்தம் பன்னிரண்டு பேர்
  rationale: இறுதி எண் அசரேலின் குழுவிலிருந்தவர்களின் மொத்த எண்ணிக்கையைக் குறிக்கிறது; இயல்பான தமிழுக்காக ‘மொத்தம்’ மற்றும் மனிதர்களைக் குறிக்கும் ‘பேர்’ சேர்க்கப்பட்டன.
theological_decisions: []
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டது. மூலத்தின் பட்டியல் அமைப்பைத் தக்கவைத்தபடியே, சுற்றியுள்ள வசனங்களில் உள்ள சீட்டுப் பகிர்வு சூழலைத் தமிழில் தெளிவாக்க ‘சீட்டு ... விழுந்தது’ என்றும், முடிவிலுள்ள சுருக்கமான எண்ணிக்கையை இயல்பாக்க ‘மொத்தம் ... பேர்’ என்றும் வழங்கப்பட்டது.
