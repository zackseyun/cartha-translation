translation:
  language: ta
  text: பத்தாவது[a], சிமெயி; அவனுடைய மகன்களும் சகோதரர்களும்—பன்னிரண்டு பேர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, சூழலை இன்னும் வெளிப்படையாகக் கூறினால், “பத்தாவது சீட்டு சிமெயிக்கு விழுந்தது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֲשִׂירִי
  choice: பத்தாவது
  rationale: குறிப்பிட்ட வரிசை எண்ணாக உள்ளது; சுற்றியுள்ள வசனங்களில் சீட்டுகளின் வரிசை தொடர்வதால், ‘சீட்டு’ என்பதை முதன்மை உரையில் சேர்க்காமல் சூழல் உணர்த்தும்படி வைத்திருக்கிறது.
- source_word: שִׁמְעִי
  choice: சிமெயி
  rationale: தனிப்பெயர் என்பதால் அதன் எபிரேய ஒலிவடிவத்துக்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: בָּנָיו
  choice: அவனுடைய மகன்கள்
  rationale: இங்கு בנים என்பது பட்டியல்/வம்சச் சூழலில் குறிப்பாக ‘மகன்கள்’ எனப் பொருள்படுகிறது.
- source_word: וְאֶחָיו
  choice: சகோதரர்கள்
  rationale: אחים என்பதன் நேரடியான பொருள் ‘சகோதரர்கள்’; உறவினர்கள் அல்லது குழுவைச் சேர்ந்த ஆண்கள் என்ற விரிவான சாத்தியத்தை முதன்மை உரையில் திணிக்கவில்லை.
- source_word: שְׁנֵים עָשָׂר
  choice: பன்னிரண்டு பேர்
  rationale: சிமெயியின் மகன்களும் சகோதரர்களும் சேர்ந்த மொத்த எண்ணிக்கையைக் குறிக்கிறது; மனிதர்களை எண்ணுவதால் இயல்பான தமிழுக்காக ‘பேர்’ சேர்க்கப்பட்டது.
theological_decisions: []
translation_notes:
  register: நவீன பொதுத்தமிழில் சுருக்கமான பட்டியல் நடையைப் பேணுகிறது. மூலத்தின் வினையற்ற அமைப்பும் தொடர்வரிசையும் முடிந்தவரை காக்கப்பட்டுள்ளன; எண்ணிக்கையை இயல்பாக்க ‘பேர்’ பயன்படுத்தப்பட்டுள்ளது.
