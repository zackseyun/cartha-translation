  text: לִ/ידוּת֑וּן בְּנֵ֣י יְדוּת֡וּן גְּדַלְיָ֡הוּ וּ/צְרִ֡י וִֽ֠/ישַׁעְיָהוּ חֲשַׁבְיָ֨הוּ וּ/מַתִּתְיָ֜הוּ שִׁשָּׁ֗ה עַל֩ יְדֵ֨י אֲבִי/הֶ֤ם יְדוּתוּן֙ בַּ/כִּנּ֔וֹר הַ/נִּבָּ֕א עַל הֹד֥וֹת וְ/הַלֵּ֖ל לַ/יהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/003.yaml
  text: 'Of Jeduthun: the sons of Jeduthun—Gedaliah, Zeri, Jeshaiah, Hashabiah, and Mattithiah, six—under the direction of their father Jeduthun, who prophesied with the lyre in giving thanks and praise to Yahweh.'
translation:
  language: ta
  text: 'எதுத்தூனுக்குரியவர்கள்: எதுத்தூனின் மகன்களான கெதலியா, சேரி, ஏசாயா, அசபியா, மத்தித்தியா ஆகிய ஆறு பேர்[a], தங்கள் தந்தையான எதுத்தூனின் வழிநடத்துதலின்கீழ் இருந்தார்கள்; அவர் யாழுடன் யெகோவாவுக்கு நன்றியும் புகழும் செலுத்தித் தீர்க்கதரிசனம் உரைத்தார்.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய உரையில் இங்கே ஐந்து பெயர்களே பட்டியலிடப்பட்டுள்ளன; ஆனால் அதைத் தொடர்ந்து ‘ஆறு பேர்’ என்று கூறுகிறது. இன்னொரு மகனின் பெயர் பட்டியலில் விடுபட்டிருக்கலாம் அல்லது எதுத்தூனும் எண்ணிக்கையில் சேர்க்கப்பட்டிருக்கலாம் என்று சிலர் கருதுகின்றனர்.
    reason: textual_variant
  - marker: b
    text: அல்லது, “யாழுடன் தீர்க்கதரிசனம் உரைத்து, யெகோவாவுக்கு நன்றியும் புகழும் செலுத்தினார்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לִידוּתוּן
  choice: எதுத்தூனின் பிரிவினர்
  rationale: ל முன்னொட்டு இங்கு பட்டியலின் அடுத்த இசைக்குழுப் பிரிவை அறிமுகப்படுத்துகிறது; தமிழில் பட்டியல் நடைக்கு இயல்பாகப் பிரிவைக் குறித்துச் சொல்லப்பட்டுள்ளது.
- source_word: בְּנֵי יְדוּת֡וּן
  choice: எதுத்தூனின் மகன்கள்
  rationale: மூலத்தின் குடும்ப உறவுச் சொல்லைத் தக்கவைக்கிறது; இச்சூழலில் அவரது குடும்பம் அல்லது வழிவந்த இசைக்குழுவினரையும் குறிக்கலாம்.
- source_word: גְּדַלְיָהוּ וּצְרִי וִישַׁעְיָהוּ חֲשַׁבְיָהוּ וּמַתִּתְיָהוּ
  choice: கெதலியா, சேரி, ஏசாயா, அசபியா, மத்தித்தியா
  rationale: எபிரெய தனிப்பெயர்கள் தமிழில் தெளிவாக வாசிக்கக்கூடிய, வழக்கமான வேதாகமப் பெயர் வடிவங்களில் ஒலிபெயர்க்கப்பட்டுள்ளன.
- source_word: שִׁשָּׁה
  choice: ஆறு பேர்
  rationale: மசோரா உரையில் ஐந்து பெயர்களே இருந்தாலும், வெளிப்படையாக உள்ள ‘ஆறு’ என்ற எண்ணிக்கை திருத்தப்படாமல் தக்கவைக்கப்படுகிறது.
- source_word: עַל יְדֵי אֲבִיהֶם
  choice: தங்கள் தந்தையின் வழிநடத்துதலின்கீழ்
  rationale: சொல்லுக்குச் சொல் ‘தங்கள் தந்தையின் கைகளின்கீழ்’ என்றாலும், இசை மற்றும் நிர்வாகச் சூழலில் மேற்பார்வை அல்லது வழிநடத்துதலைக் குறிக்கும் இயல்பான தமிழாக்கம் இது.
- source_word: בַּכִּנּוֹר
  choice: யாழை இசைத்து
  rationale: כִּנּוֹר என்பது பண்டைய நரம்பிசைக் கருவி; ‘யாழ்’ என்பது ‘வீணை’ அல்லது ‘harp’ என்பதைவிட lyre வகைக் கருவைச் சுருக்கமாகவும் புரியும்படியும் குறிக்கிறது.
- source_word: הַנִּבָּא
  choice: தீர்க்கதரிசனம் உரைத்தார்
  rationale: נבא வினையின் நிபால் வடிவத்திலுள்ள தீர்க்கதரிசனப் பொருள், இசைச் சூழல் காரணமாக மெலிதாக்கப்படாமல் தக்கவைக்கப்படுகிறது.
- source_word: עַל הֹדוֹת וְהַלֵּל
  choice: நன்றி செலுத்திப் புகழ்ந்து
  rationale: எதுத்தூனின் இசைமூலமான தீர்க்கதரிசனச் செயலின் உள்ளடக்கம் அல்லது நோக்கத்தை இயல்பான தமிழில் எடுத்துரைக்கிறது; עַל என்பதன் தொடர்பு மாற்று வாசிப்புக்கும் இடமளிக்கிறது.
- source_word: לַיהוָה
  choice: யெகோவாவுக்கு
  rationale: மூலத்தில் உள்ள இறைநாமம் יהוה பொதுப்பட்டமாக மாற்றப்படாமல் தமிழில் அறியப்பட்ட ஒலிபெயர்ப்பு வடிவில் வழங்கப்படுகிறது.
theological_decisions:
- issue: ஆலய இசையில் ‘தீர்க்கதரிசனம் உரைத்தல்’ என்பதன் பொருள்
  choice: இசைச் சூழலிலும் נבא என்பதற்குத் ‘தீர்க்கதரிசனம் உரைத்தார்’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: இறை ஏவுதலுடன் இசைத்தார்; தீர்க்கதரிசன முறையில் பாடினார்
  rationale: நாளாகம ஆசிரியர் ஆலய இசைக்கலைஞர்களின் பணியைத் தீர்க்கதரிசனச் சொல்லால் வெளிப்படையாகக் குறிப்பிடுகிறார். அதை வெறும் இசை நிகழ்ச்சியாகக் குறுக்காமல், இசை, நன்றி, புகழ்ச்சி ஆகிய சூழல் அதன் தன்மையை விளக்கும்படி உரையின் இறையியல் அழுத்தம் தக்கவைக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமுள்ள, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. பட்டியல் நடையின் சுருக்கமும், ஐந்து பெயர்களுக்கும் ‘ஆறு பேர்’ என்ற எண்ணிக்கைக்கும் இடையிலான மூல உரை முரண்பாடும், இசை சார்ந்த தீர்க்கதரிசன மொழியின் இறையியல் அழுத்தமும் தக்கவைக்கப்பட்டுள்ளன.
