revisions:
- from: 'எதுத்தூனின் பிரிவினர்: எதுத்தூனின் மகன்களான கெதலியா, சேரி, ஏசாயா, அசபியா, மத்தித்தியா ஆகிய ஆறு பேர்[a], தங்கள் தந்தை எதுத்தூனின் வழிநடத்துதலின்கீழ் இருந்தார்கள். அவர் யாழை இசைத்து, யெகோவாவுக்கு நன்றி செலுத்திப் புகழ்ந்து தீர்க்கதரிசனம் உரைத்தார்.[b]'
  to: 'எதுத்தூனுக்குரியவர்கள்: எதுத்தூனின் மகன்களான கெதலியா, சேரி, ஏசாயா, அசபியா, மத்தித்தியா ஆகிய ஆறு பேர்[a], தங்கள் தந்தையான எதுத்தூனின் வழிநடத்துதலின்கீழ் இருந்தார்கள்; அவர் யாழுடன் யெகோவாவுக்கு நன்றியும் புகழும் செலுத்தித் தீர்க்கதரிசனம் உரைத்தார்.[b]'
  rationale: The revision brings the introductory heading closer to the Hebrew catalog formula and makes the lyre the accompaniment of Jeduthun’s prophetic activity rather than a merely preceding action. It preserves the textual numerical tension, the named individuals, and the explicit prophetic terminology.
