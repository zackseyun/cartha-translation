source:
  edition: WLC
  text: וַ/יַּפִּ֜ילוּ גּוֹרָל֣וֹת מִשְׁמֶ֗רֶת לְ/עֻמַּת֙ כַּ/קָּטֹ֣ן כַּ/גָּד֔וֹל מֵבִ֖ין עִם תַּלְמִֽיד־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/008.yaml
  text: And they cast lots for duties[a], the small as well as the great[b], the teacher with the student.
translation:
  language: ta
  text: அவர்கள் பணிப் பொறுப்புகளுக்காக[a] சீட்டுப் போட்டார்கள்; சிறியவரும் பெரியவரும்[b], திறமைமிக்கவரும் மாணவரும் ஒரேபோலச் சீட்டுப் போட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பணிக்காக” அல்லது “பணிப்பிரிவுக்காக.” எபிரெயச் சொல் ஒதுக்கப்பட்ட பணி, சேவை, அல்லது காவல்/பணிமுறையைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “சிறியவர் மற்றும் பெரியவர்.” இது வயதை அல்லாமல் அந்தஸ்து அல்லது முக்கியத்துவத்தையும் குறிக்கலாம்; சீட்டுப் போடுதலில் வேறுபாடு காட்டப்படவில்லை.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּפִּילוּ גּוֹרָלוֹת
  choice: சீட்டுப் போட்டார்கள்
  rationale: נפל என்பதன் ஹிபீல் வடிவமும் גּוֹרָלוֹת என்பதும் சேர்ந்துள்ள எபிரெய மரபுத்தொடரை இயல்பான நவீன தமிழில் நேரடியாகத் தருகிறது.
- source_word: מִשְׁמֶרֶת
  choice: பணிமுறைக்காக
  rationale: ஆலய இசைப்பணியின் சூழலில் இது ஒதுக்கப்பட்ட பணி, முறை அல்லது பணிப்பிரிவைக் குறிக்கிறது; ‘பணிமுறை’ அந்த இரு கருத்துகளையும் சுருக்கமாகத் தக்கவைக்கிறது.
- source_word: לְעֻמַּת
  choice: ஒரே விதமாகப் பங்குபெற்றார்கள்
  rationale: இங்கு இடநிலையான ‘எதிரே’ என்பதற்குப் பதிலாக, சீட்டிடுதலில் குறிப்பிடப்பட்ட பிரிவினர் வேறுபாடின்றி சேர்க்கப்பட்ட சமநிலையைக் குறிக்கிறது.
- source_word: כַּקָּטֹן כַּגָּדוֹל
  choice: சிறியவனும் பெரியவனும்
  rationale: அந்தஸ்து அல்லது முக்கியத்துவத்தைச் சுட்டக்கூடிய எபிரெய இணைச்சொல்லைத் தீர்மானமாக விளக்காமல் அதன் வடிவத்துக்கு நெருக்கமாகப் பாதுகாக்கிறது.
- source_word: מֵבִין
  choice: தேர்ச்சி பெற்றவன்
  rationale: சொல்லின் அடிப்படைப் பொருள் ‘புரிந்துகொண்டவன்’; இசைப்பணிச் சூழலில் அறிவும் திறமையும் பெற்றவரைக் குறிக்கலாம். ‘ஆசிரியன்’ என்பது சாத்தியமானாலும் இச்சொல்லிலேயே கற்பிக்கும் பங்கு வெளிப்படையாக இல்லை.
- source_word: תַּלְמִיד
  choice: மாணவன்
  rationale: கற்றுக்கொள்பவரைக் குறிக்கும் சொல்லுக்கு மதசார்ந்த பிற்காலப் பொருளைச் சேர்க்காமல் இயல்பான நவீனத் தமிழில் தருகிறது.
theological_decisions:
- issue: מֵבִין என்பவரின் துல்லியமான பங்கு
  choice: தேர்ச்சி பெற்றவன்
  alternative: ஆசிரியன் / புரிந்துகொண்டவன்
  rationale: சூழல் இசைத்திறமையுள்ள நபரைச் சுட்டுகிறது; அவரை ஆசிரியராகவே முடிவுசெய்யாமல் மூலத்தின் பொருள் அகலத்தைப் பாதுகாக்கிறது.
- issue: ‘சிறியவன், பெரியவன்’ என்பதன் அளவுகோல்
  choice: மூல மரபுத்தொடரை உரையில் வைத்தல்
  alternative: தாழ்ந்தவன், உயர்ந்தவன் / இளையவன், முதியவன்
  rationale: இது வயது, திறமை அல்லது அந்தஸ்தில் எதைக் குறிப்பதாகும் என்பது உரையில் தீர்மானிக்கப்படவில்லை; ஆகவே விளக்கத்தை அடிக்குறிப்பில் மட்டும் தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், ஆலயப் பணிச்சூழலுக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பணிமுறை’ என்பது ஒதுக்கப்பட்ட பணி/முறை என்ற இரு நிழற்பொருள்களையும் சுமக்கிறது. மூலத்தின் சுருக்கமான பட்டியல் அமைப்பு தமிழில் தெளிவாக இருக்க வினைச்சொல் இறுதியில் வெளிப்படுத்தப்பட்டுள்ளது; மாற்று சொல்லமைப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
