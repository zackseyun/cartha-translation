  register: நவீன நிலையான தமிழில், பட்டியலுக்குரிய சுருக்கத்தையும் கண்ணியமான வேதாகம நடையையும் பேணும் மொழியாக்கம். அரைப்புள்ளியும் நீண்ட கோடும் ஒதுக்கீடு மற்றும் குழுவின் மொத்த எண்ணிக்கையைத் தெளிவாகப் பிரிக்கின்றன.
