  text: for the twenty-first[a], Hothir; his sons and his brothers, twelve.
translation:
  language: ta
  text: 'இருபத்தொன்றாவது: ஹோத்திருக்கு; அவனுடைய மகன்களும் சகோதரர்களும்—மொத்தம் பன்னிரண்டு பேர்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/אֶחָד וְ/עֶשְׂרִים
  choice: இருபத்தொன்றாவது
  rationale: இந்த அதிகாரத்தில் சீட்டுகளின் வரிசை எண்ணப்படுகிறது. לְ முன்னொட்டு ஒதுக்கீட்டைக் குறிக்கிறது; ஆகவே இயல்பான தமிழில் வரிசை எண்ணாக மொழிபெயர்க்கப்படுகிறது. 'சீட்டு' என்பது சூழலில் புரிந்தாலும், எபிரெய மூலத்தில் இவ்வசனத்தில் வெளிப்படையாக இல்லாததால் முதன்மை உரையில் சேர்க்கப்படவில்லை.
- source_word: לְ/הוֹתִיר
  choice: ஓத்திருக்கு
  rationale: הוֹתִיר என்பது நபரின் பெயர். அதனுடன் உள்ள לְ முன்னொட்டின் இலக்கு/ஒதுக்கீட்டுப் பொருளைத் தமிழின் நான்காம் வேற்றுமை உருபான '-க்கு' வெளிப்படுத்துகிறது.
- source_word: בָּנָיו
  choice: அவனுடைய மகன்கள்
  rationale: בנים இங்கு பொதுவான 'பிள்ளைகள்' என்பதற்குப் பதிலாக ஆண்பாலைக் குறிப்பாகக் குறிக்கும் 'மகன்கள்' என்று வழங்கப்படுகிறது.
- source_word: וְאֶחָיו
  choice: சகோதரர்கள்
  rationale: அடிப்படை குடும்ப உறவுச் சொல்லான 'சகோதரர்கள்' பாதுகாக்கப்படுகிறது; பட்டியல் சூழலில் கூட்டாளிகள் அல்லது உறவினர்கள் என்ற விரிவான பொருள் இருக்கக்கூடியதாயினும், அதைத் தெளிவாக நிர்ணயிக்க போதிய ஆதாரம் இல்லை.
- source_word: שְׁנֵים עָשָׂר
  choice: மொத்தம் பன்னிரண்டு பேர்
  rationale: இந்த எண் முழுக் குழுவின் எண்ணிக்கையைக் குறிக்கிறது. தமிழில் பொருள் தெளிவாக இருக்க 'மொத்தம்' மற்றும் மனிதர்களைக் குறிக்கும் 'பேர்' சேர்க்கப்பட்டுள்ளன.
