  text: the sixth[a], Bukkiah; his sons and his brothers, twelve.
translation:
  language: ta
  text: ஆறாவது[a], புக்கியா; அவனுடைய மகன்களும் அவனுடைய சகோதரர்களும், பன்னிரண்டு பேர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, சூழலை இன்னும் வெளிப்படையாகக் கூறினால், “ஆறாவது சீட்டு புக்கியாவுக்கும், அவனுடைய மகன்களுக்கும் அவனுடைய சகோதரர்களுக்கும் விழுந்தது; பன்னிரண்டு பேர்.” சுற்றியுள்ள வசனங்களிலிருந்து புரிந்துகொள்ளப்படும் “சீட்டு விழுந்தது” என்ற சொற்றொடரை எபிரெயப் பட்டியல் நடை இங்கு வெளிப்படையாகக் கூறவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשִּׁשִּׁי
  choice: ஆறாவது
  rationale: குறிப்பிட்ட வரிசை எண்ணாக இது இங்கு சீட்டு அல்லது பிரிவைக் குறிக்கும் சுருக்கமான பட்டியல் நடையில் வருகிறது. எபிரெய உரையின் சுருக்கத்தை முதன்மை உரையில் காத்து, சூழலில் மறைந்துள்ள கூறை அடிக்குறிப்பில் விளக்குகிறது.
- source_word: בֻקִּיָּהוּ
  choice: புக்கியா
  rationale: தனிப்பெயர் அதன் எபிரெய ஒலிப்புக்கு ஏற்ற வகையில் தமிழில் ஒலிபெயர்க்கப்படுகிறது.
- source_word: בָּנָיו
  choice: அவனுடைய மகன்கள்
  rationale: எபிரெயச் சொல் பொதுவாகப் பிள்ளைகள் என்பதல்ல, குறிப்பாக மகன்கள் என்பதைக் குறிக்கிறது.
- source_word: וְאֶחָיו
  choice: அவனுடைய சகோதரர்கள்
  rationale: நேரடிப் பொருள் ஆண் உடன்பிறந்தோர்; இப்பட்டியல் சூழலில் உறவினரையோ உடன் சேவை செய்தவர்களையோ குறிக்கும் வாய்ப்பு இருந்தாலும், நேரடியான பொருள் காக்கப்படுகிறது.
- source_word: שְׁנֵים עָשָׂר
  choice: பன்னிரண்டு பேர்
  rationale: குழுவின் மொத்த எண்ணிக்கையைச் சுட்டுகிறது. மனிதர்களைக் கணக்கிடும் இயல்பான நவீனத் தமிழுக்காக ‘பேர்’ சேர்க்கப்பட்டுள்ளது; தனி வினைச்சொல் சேர்க்காமல் எபிரெயப் பட்டியல் நடையின் சுருக்கம் காக்கப்படுகிறது.
