translation_notes:
  register: நவீன, தெளிவான, மரியாதைமிக்க பட்டியல் நடை பயன்படுத்தப்பட்டுள்ளது. மூல எபிரெயின் சுருக்கமும் நீள்வட்டக் கூறமைப்பும் காக்கப்பட்டுள்ளன; இயல்பான தமிழுக்காக மனிதர் எண்ணிக்கையில் ‘பேர்’ மட்டும் சேர்க்கப்பட்டுள்ளது. அடிக்குறிப்பு குறியீடு முதன்மை உரையில் இடம்பெற்றுள்ளது.
