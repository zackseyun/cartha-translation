  yaml_path: translation/ot/1_chronicles/025/014.yaml
  text: The seventh fell to Jesharelah[a]; his sons and his brothers were twelve.
translation:
  language: ta
  text: 'ஏழாவது சீட்டு யெசரெயேலாவுக்கு விழுந்தது[a]; அவனுடைய மகன்களும் சகோதரர்களுமாகப் பன்னிரண்டு பேர்.


    [a] சொல்லுக்குச் சொல்: “ஏழாவது, யெசரெயேலா, அவனுடைய மகன்களும் அவனுடைய சகோதரர்களும், பன்னிரண்டு பேர்.” “சீட்டு ... விழுந்தது” என்பது சுற்றியுள்ள வசனங்களில் திரும்பத் திரும்ப வரும் சீட்டுப்போட்டு ஒதுக்கும் முறையிலிருந்து இங்கே சேர்த்துக் கூறப்பட்டுள்ளது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “ஏழாவது, யெசரெயேலா, அவனுடைய மகன்களும் அவனுடைய சகோதரர்களும், பன்னிரண்டு பேர்.” “சீட்டு ... விழுந்தது” என்பது சுற்றியுள்ள வசனங்களில் திரும்பத் திரும்ப வரும் சீட்டுப்போட்டு ஒதுக்கும் முறையிலிருந்து இங்கே சேர்த்துக் கூறப்பட்டுள்ளது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְּׁבִעִי
  choice: ஏழாவது சீட்டு
  rationale: இந்தப் பட்டியலில் வரிசை எண்ணான ‘ஏழாவது’ என்பது பெயர்ச்சொல்லாகப் பயன்பட்டு, ஏழாவது சீட்டு அல்லது ஒதுக்கீட்டைக் குறிக்கிறது. தமிழில் பொருள் தெளிவாக இருக்க ‘சீட்டு’ சேர்க்கப்பட்டது.
- source_word: יְשַׂרְאֵלָה
  choice: எசரெயேலா
  rationale: தனிநபரின் பெயர் மொழிபெயர்க்கப்படாமல், எபிரெய ஒலிவடிவத்தை அணுகும் தமிழெழுத்துப் பெயர்ப்பாக வழங்கப்பட்டது.
- source_word: בָּנָיו
  choice: அவனுடைய மகன்கள்
  rationale: எபிரெயச் சொல் பொதுவான ‘பிள்ளைகள்’ என்பதைக் காட்டிலும் குறிப்பாக ஆண் மக்களைக் குறிக்கிறது.
- source_word: וְאֶחָיו
  choice: அவனுடைய சகோதரர்கள்
  rationale: இந்தப் பட்டியல் சூழலில் ஆண் உறவினர்களையோ குழுவைச் சேர்ந்தவர்களையோ விரிவாகக் குறிக்க வாய்ப்பிருந்தாலும், சொல்லின் நேரடியான பொருளான ‘சகோதரர்கள்’ பாதுகாக்கப்பட்டது.
- source_word: שְׁנֵים עָשָׂר
  choice: பன்னிரண்டு பேர்
  rationale: குழுவின் மொத்த எண்ணிக்கையைக் கூறும் எண்ணுப்பெயர்; மனிதர்களைக் கணக்கிடும் இயல்பான தமிழுக்காக ‘பேர்’ சேர்க்கப்பட்டது.
- source_word: '[implied allotment formula]'
  choice: சீட்டு ... விழுந்தது
  rationale: சுருக்கமான எபிரெய வரியில் வினைச்சொல் இல்லாவிட்டாலும், சுற்றியுள்ள வசனங்களின் சீட்டு ஒதுக்கீட்டு வாய்பாடு இதை உணர்த்துகிறது. தமிழ் வாசிப்பில் இயல்பாகவும் தெளிவாகவும் இருக்க இது சேர்க்கப்பட்டு, அடிக்குறிப்பில் வெளிப்படையாகக் குறிப்பிடப்பட்டது.
