  text: וַ/יַּבְדֵּ֣ל דָּוִיד֩ וְ/שָׂרֵ֨י הַ/צָּבָ֜א לַ/עֲבֹדָ֗ה לִ/בְנֵ֤י אָסָף֙ וְ/הֵימָ֣ן וִֽ/ידוּת֔וּן ה/נביאים בְּ/כִנֹּר֥וֹת בִּ/נְבָלִ֖ים וּ/בִ/מְצִלְתָּ֑יִם וַֽ/יְהִי֙ מִסְפָּרָ֔/ם אַנְשֵׁ֥י מְלָאכָ֖ה לַ/עֲבֹדָתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/001.yaml
  text: 'And David and the commanders of the army set apart for the service the sons of Asaph[a], Heman, and Jeduthun, who prophesied with lyres, harps, and cymbals; and their number, the men for the work of their service[b], was:'
translation:
  language: ta
  text: 'தாவீதும் படைத்தலைவர்களும் ஆசாப், ஏமான், எதுத்தூன் ஆகியோரின் மக்களை[a] பணிக்காகத் தனியே ஒதுக்கினார்கள். அவர்கள் யாழ்கள், வீணைகள், கைத்தாளங்கள் ஆகியவற்றுடன் இறைவாக்குரைத்தார்கள்[b]. அவர்களுடைய சேவைக்கான பணியாளர்களின் எண்ணிக்கை வருமாறு:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மக்கள்” என்பது இங்கு நேரடி மகன்களை மட்டுமல்லாமல், சந்ததியினரையோ அவர்களுடைய இசைக் குழுக்களின் உறுப்பினர்களையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தை இன்னும் சொல்முறையாக, “யாழ்கள், வீணைகள், கைத்தாளங்களுடன் இருந்த இறைவாக்கினர்களாகிய ஆசாப், ஏமான், எதுத்தூன்” என்று வாசிக்கலாம்; இதில் “இறைவாக்கினர்கள்” என்பது இந்த மூவருக்கான இணைப்பெயராக அமைகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּבְדֵּל
  choice: தனியே நியமித்தார்கள்
  rationale: ஹிப்இல் வடிவம் ‘பிரித்துவைத்தல்/தனியே ஒதுக்குதல்’ எனப் பொருள்படும். ஆலயப் பணிக்கான அமைப்புச் சூழலில், வெறும் பிரித்தலைவிட ‘தனியே நியமித்தார்கள்’ என்பது நோக்கத்தையும் இயல்பான தமிழையும் வெளிப்படுத்துகிறது.
- source_word: שָׂרֵי הַצָּבָא
  choice: படைத்தலைவர்கள்
  rationale: שָׂרֵי என்பது தலைவர்கள் அல்லது அதிகாரிகள்; צָבָא பொதுவாகப் படையைக் குறிக்கும். ஆகவே சொற்றொடரின் நேரடியான பொருளையும் நாளாகமச் சூழலையும் இது காக்கிறது.
- source_word: לַעֲבֹדָה
  choice: பணிக்காக
  rationale: עֲבֹדָה இங்கு ஒழுங்கமைக்கப்பட்ட ஆலயப் பணியைக் குறிக்கிறது. ‘பணிக்காக’ என்பது சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: לִבְנֵי אָסָף וְהֵימָן וִידוּתוּן
  choice: ஆசாப், ஏமான், எதுத்தூன் ஆகியோரின் மக்களை
  rationale: בְּנֵי என்பதன் அடிப்படைப் பொருள் ‘மக்கள்’; அது சந்ததியினர் அல்லது இசைக் குழு/குல உறுப்பினர்களையும் குறிக்கலாம். முதன்மை உரையில் நேரடிப் பொருள் வைக்கப்பட்டு, பரந்த பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: הנביאים
  choice: இறைவாக்குரைத்தார்கள்
  rationale: வடிவத்தில் இது ‘இறைவாக்கினர்கள்’ என்ற பெயர்ச்சொல்; சூழலில் இசைக்கருவிகளுடன் செய்த தீர்க்கதரிசனச் செயலை விவரிக்கிறது. தமிழில் வினை வடிவம் வாக்கியத்தை இயல்பாக்குகிறது; பெயர்ச்சொல் வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: בְּכִנֹּרוֹת
  choice: யாழ்கள்
  rationale: כִּנּוֹר ஒரு பண்டைய நரம்பிசைக் கருவி, வழக்கமாக lyre என அடையாளப்படுத்தப்படுகிறது. ‘யாழ்’ அதற்கான புரிந்துகொள்ளத்தக்க தமிழ் இணை; அடுத்த கருவியிலிருந்து வேறுபாடும் காக்கப்படுகிறது.
- source_word: בִנְבָלִים
  choice: வீணைகள்
  rationale: נֵבֶל என்பது כִּנּוֹר-இலிருந்து வேறுபட்ட நரம்பிசைக் கருவி. துல்லியமான நவீன ஒப்பீடு உறுதியற்றதால், ‘வீணை’ என்ற பொதுவாக அறியப்பட்ட வேறு நரம்பிசைக் கருவிப் பெயர் பயன்படுத்தப்படுகிறது.
- source_word: וּבִמְצִלְתָּיִם
  choice: கைத்தாளங்கள்
  rationale: מְצִלְתַּיִם ஒன்றுடன் ஒன்று மோதிச் சத்தமிடும் cymbals-ஐக் குறிக்கிறது; ‘கைத்தாளங்கள்’ நவீனத் தமிழில் தெளிவான இசைக்கருவிப் பெயர்.
- source_word: וַיְהִי מִסְפָּרָם
  choice: 'எண்ணிக்கை வருமாறு:'
  rationale: இந்தச் சொற்றொடர் அடுத்த வசனங்களில் வரும் பட்டியலை அறிமுகப்படுத்துகிறது. இரட்டைப்புள்ளி அந்த முன்னோக்கிய தொடரைத் தெளிவாகக் காட்டுகிறது.
- source_word: אַנְשֵׁי מְלָאכָה לַעֲבֹדָתָם
  choice: தங்கள் பணிக்குரிய வேலையைச் செய்தவர்கள்
  rationale: ‘வேலையின் மனிதர்கள்’ என்ற எபிரெயச் சொல்லமைப்பை இயல்பான தமிழாக்கமாக்குகிறது; ‘திறமைசாலிகள்’ என்று மூலத்தில் வெளிப்படையாக இல்லாத கருத்தைச் சேர்க்கவில்லை.
theological_decisions:
- issue: הַנְּבִיאִים என்பதை ‘இறைவாக்கினர்கள்’ என்ற பெயர்ச்சொல்லாகவா, இசையோடு தொடர்புடைய செயல்விளக்கமாகவா மொழிபெயர்ப்பது
  choice: ‘அவர்கள் ... இறைவாக்குரைத்தார்கள்’ என வினைச்சொல் தொடராக வழங்கப்பட்டது.
  alternative: ‘யாழ்கள், வீணைகள், கைத்தாளங்களுடன் இருந்த இறைவாக்கினர்களாகிய ஆசாப், ஏமான், எதுத்தூன்’
  rationale: எபிரெய வடிவம் பெயர்ச்சொல் சார்ந்த இணைப்பாக வாசிக்கப்படலாம்; ஆனால் அதன் செயற்பாட்டு பொருளைத் தமிழ் வினை வடிவம் இயல்பாக வெளிப்படுத்துகிறது. மாற்று இலக்கண வாசிப்பு அடிக்குறிப்பில் வைக்கப்பட்டதால், இசைக்கும் இறைவாக்குக்கும் இடையிலான உரையின் தொடர்பும் அதன் குழப்பமற்றதல்லாத அமைப்பும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன பொதுத்தமிழில், கண்ணியமான வேதாகம நடையுடன் மொழிபெயர்க்கப்பட்டது. ‘தனியே நியமித்தார்கள்’ அமைப்புச் சூழலைத் தெளிவாக்குகிறது; பண்டைய இசைக்கருவிகளுக்கான துல்லியமான நவீன ஒப்பீடுகள் உறுதியற்றதால் ‘யாழ்’, ‘வீணை’, ‘கைத்தாளம்’ என்ற எளிதில் புரியும் வேறுபட்ட பெயர்கள் பயன்படுத்தப்பட்டன. இறைவாக்கு குறித்த எபிரெய இலக்கண இருமை அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
