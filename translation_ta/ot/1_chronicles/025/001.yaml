  source_fidelity: 'மொத்தத்தில் எபிரெய மூலத்தின் அமைப்பும் பொருளும் நன்றாகப் பிரதிபலிக்கப்படுகின்றன: தாவீதும் படைத்தலைவர்களும் ஆசாப், ஏமான், எதுத்தூன் ஆகியோரின் ‘மக்களை’ பணிக்காகப் பிரித்தனர்; இசைக்கருவிகளோடு இறைவாக்கு உரைப்பதும், அடுத்த பட்டியலை அறிமுகப்படுத்தும் எண்ணிக்கைக் குறிப்பும் உள்ளன. ஆயினும் ‘தனியே நியமித்தார்கள்’ என்பது וַיַּבְדֵּל (‘பிரித்துவைத்தல்/ஒதுக்குதல்’) என்பதைக் காட்டிலும் நியமனச் செயலைச் சற்றே அதிகமாகக் குறிக்கிறது. மேலும் இறுதி சொற்றொடர் மூலத்தின் ‘தங்கள் சேவைக்கான பணியாளர்கள்’ என்ற கருத்தை விடத் தேவையற்ற முறையில் விரிவடைகிறது.'
