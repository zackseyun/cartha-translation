  to: 'தாவீதும் படைத்தலைவர்களும் ஆசாப், ஏமான், எதுத்தூன் ஆகியோரின் மக்களை[a] பணிக்காகத் தனியே ஒதுக்கினார்கள். அவர்கள் யாழ்கள், வீணைகள், கைத்தாளங்கள் ஆகியவற்றுடன் இறைவாக்குரைத்தார்கள்[b]. அவர்களுடைய சேவைக்கான பணியாளர்களின் எண்ணிக்கை வருமாறு:'
