  text: for the twentieth[a], Eliathah; his sons and his brothers, twelve.
translation:
  language: ta
  text: இருபதாவது ஒதுக்கீடு[a] எலியாத்தாவுக்கு; அவனுடைய மகன்களும் சகோதரர்களும் பன்னிரண்டு பேர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெய மூலத்தில் ‘ஒதுக்கீடு’ அல்லது ‘சீட்டு’ என்ற பெயர்ச்சொல் வெளிப்படையாக இல்லை; இந்த அதிகாரத்தில் தொடர்ந்து வரும் சீட்டுப்போட்டு ஒதுக்கும் பட்டியல் அமைப்பிலிருந்து அது புரிந்துகொள்ளப்படுகிறது. சொற்சார்ந்த வகையில்: ‘இருபதாவதற்கு, எலியாத்தாவுக்கு.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְ/עֶשְׂרִים
  choice: இருபதாவது சீட்டு
  rationale: இந்த அதிகாரத்தில் திரும்பத் திரும்ப வரும் சீட்டுப்போட்டு ஒதுக்கும் பட்டியல் அமைப்பில், לְ ஒதுக்கீட்டைக் குறிக்கிறது; עֶשְׂרִים வரிசையில் இருபதாவது இடத்தைக் குறிக்கிறது. தமிழில் பொருள் தெளிவாக இருக்க, எபிரெயத்தில் மறைமுகமாக உள்ள ‘சீட்டு’ முதன்மை உரையில் சேர்க்கப்பட்டது.
- source_word: לֶאֱלִיָּתָה
  choice: எலியாத்தாவுக்கு வந்தது
  rationale: பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது. முன்னொட்டு לְ குறிக்கும் ஒதுக்கீட்டு உறவு, இயல்பான தமிழில் ‘எலியாத்தாவுக்கு வந்தது’ என்று வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: בָּנָיו
  choice: அவனுடைய மகன்கள்
  rationale: בֵּן என்பதன் பன்மை மற்றும் மூன்றாம் நபர் ஆண்பால் ஒருமை உடைமைப் பின்னொட்டு என்பதால், ஆண் சந்ததியைக் குறிக்கும் ‘அவனுடைய மகன்கள்’ பயன்படுத்தப்பட்டது.
- source_word: וְאֶחָיו
  choice: சகோதரர்களும்
  rationale: אָחִים என்ற குடும்ப உறவுச் சொல்லை தேவையின்றி ‘உறவினர்கள்’ என விரிவுபடுத்தாமல் ‘சகோதரர்கள்’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: שְׁנֵים עָשָׂר
  choice: மொத்தம் பன்னிரண்டு பேர்
  rationale: இது குழுவின் மொத்த எண்ணிக்கையைக் குறிக்கிறது. வினைச்சொல் இல்லாத எபிரெயப் பட்டியல் நடையை இயல்பான தமிழாக்க, ‘மொத்தம்’ மற்றும் மனிதர்களைக் குறிக்கும் ‘பேர்’ சேர்க்கப்பட்டன.
