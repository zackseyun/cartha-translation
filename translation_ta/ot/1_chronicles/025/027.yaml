  to: இருபதாவது ஒதுக்கீடு[a] எலியாத்தாவுக்கு; அவனுடைய மகன்களும் சகோதரர்களும் பன்னிரண்டு பேர்.
  rationale: The revision preserves the implied allocation indicated by the chapter’s repeated formula without adding the narrative verb ‘வந்தது.’ It retains the Hebrew’s concise roster style, accurately renders the kinship terms and number, and places the contextual inference about the lot/allotment in an anchored footnote.
