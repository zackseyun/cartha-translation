translation_notes:
  register: நவீனத் தரத் தமிழில், பட்டியலுக்குரிய சுருக்கமான நடையும் மூல எபிரெய உரையின் வினையற்ற அமைப்பும் இயன்றவரை தக்கவைக்கப்பட்டுள்ளன. ‘அவனுடைய’ என்பது முதல் பெயர்ச்சொல்லோடு மட்டும் பயன்படுத்தப்பட்டு, இணையான இரு குழுக்களுக்கும் இயல்பாகப் பொருந்துமாறு அமைக்கப்பட்டுள்ளது.
