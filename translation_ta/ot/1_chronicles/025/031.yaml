  text: for the twenty-fourth[a], Romamti-ezer, his sons and his brothers, twelve.
translation:
  language: ta
  text: இருபத்துநான்காவதற்கு ரோமம்தி-ஏசேருக்கு; அவனுடைய மகன்களும் சகோதரர்களுமாகப் பன்னிரண்டு பேர்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/אַרְבָּעָה וְ/עֶשְׂרִים
  choice: இருபத்துநான்காவது
  rationale: לְ என்ற முன்னொட்டு ஒதுக்கீட்டைக் குறிக்கிறது; எண்ணிக்கை இந்தச் சூழலில் வரிசை எண்ணாகப் பொருள்படுகிறது. மூலத்தில் ‘சீட்டு’ அல்லது ‘பிரிவு’ என்ற சொல் வெளிப்படையாக இல்லாததால் முதன்மை உரையில் சேர்க்கப்படவில்லை.
- source_word: לְ/רוֹמַמְתִּי עָזֶר
  choice: ரோமம்தி-ஏசேருக்கு
  rationale: இது ஓர் ஆட்பெயர் என்பதால் பொருள் மொழிபெயர்க்கப்படாமல் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது. לְ முன்னொட்டின் ஒதுக்கீட்டுப் பொருள் ‘-க்கு’ என்ற வேற்றுமை உருபால் காட்டப்பட்டுள்ளது.
- source_word: בָּנָיו
  choice: அவனுடைய மகன்கள்
  rationale: எபிரெயச் சொல் பொதுவாகப் பிள்ளைகள் என்பதைவிடத் துல்லியமாக ‘மகன்கள்’ என்று கூறுவதால் அதுவே தக்கவைக்கப்பட்டுள்ளது.
- source_word: וְאֶחָיו
  choice: சகோதரர்கள்
  rationale: இந்தப் பட்டியல் சூழலில் உறவினர்களையோ குழுவைச் சேர்ந்த ஆண்களையோ உள்ளடக்கக்கூடிய வாய்ப்பு இருந்தாலும், சொல்லின் நேரடிப் பொருளான ‘சகோதரர்கள்’ தக்கவைக்கப்பட்டுள்ளது.
- source_word: שְׁנֵים עָשָׂר
  choice: பன்னிரண்டு பேர்
  rationale: பெயரிடப்பட்ட குழுவின் மொத்த எண்ணிக்கையை இது குறிக்கிறது; தமிழில் மனிதர்களின் எண்ணிக்கையை இயல்பாகக் காட்ட ‘பேர்’ சேர்க்கப்பட்டுள்ளது.
