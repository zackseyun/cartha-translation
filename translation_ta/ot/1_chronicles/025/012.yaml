  text: הַ/חֲמִישִׁ֣י נְתַנְיָ֔הוּ בָּנָ֥י/ו וְ/אֶחָ֖י/ו שְׁנֵ֥ים עָשָֽׂר׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/012.yaml
  text: The fifth was Nethaniah[a]; his sons and his brothers were twelve.
translation:
  language: ta
  text: ஐந்தாவது[a] நெத்தனியாவுக்கு; அவனுடைய மகன்களும் சகோதரர்களும் பன்னிரண்டு பேர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, சூழலின்படி, “ஐந்தாவது சீட்டு நெத்தனியாவுக்கு விழுந்தது; அவனுடைய மகன்களும் சகோதரர்களும் பன்னிரண்டு பேர்.” எபிரெய உரையில் “சீட்டு” மற்றும் “விழுந்தது” போன்ற சொற்கள் இல்லை; சுற்றியுள்ள பட்டியலிலிருந்து அவை புரிந்துகொள்ளப்படுகின்றன.
    reason: alternative_reading
lexical_decisions:
- source_word: הַחֲמִישִׁי
  choice: ஐந்தாவது
  rationale: எபிரெய உரையில் திட்டவட்டமாக உள்ள வரிசை எண்ணை மட்டும் முதன்மை உரையில் வைத்திருக்கிறது. சுற்றியுள்ள பட்டியலின் அடிப்படையில் ‘சீட்டு’ அல்லது ‘பங்கு’ என்பதைப் புரிந்துகொள்ளலாம்; ஆனால் அவை இவ்வசனத்தில் வெளிப்படையாக இல்லை.
- source_word: נְתַנְיָהוּ
  choice: நெத்தனியா
  rationale: தனிப்பெயர், நவீனத் தமிழில் இயல்பாக ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: בָּנָיו
  choice: அவனுடைய மகன்கள்
  rationale: ஆண்பால் பன்மையான בנים என்பதன் குறிப்பான பொருளை ‘மகன்கள்’ என்று காக்கிறது.
- source_word: וְאֶחָיו
  choice: சகோதரர்கள்
  rationale: אחים என்பதன் வழக்கமான நேரடிப் பொருள் ‘சகோதரர்கள்’; இங்கு விரிவான ‘உறவினர்கள்’ என்ற பொருளைத் தேவையின்றி சேர்க்கவில்லை.
- source_word: שְׁנֵים עָשָׂר
  choice: பன்னிரண்டு பேர்
  rationale: மனிதர்களின் எண்ணிக்கையை இயல்பான தமிழில் தெரிவிக்க ‘பேர்’ சேர்க்கப்பட்டுள்ளது; இது எபிரெய எண்ணின் பொருளை மாற்றாது.
theological_decisions:
- issue: ‘ஐந்தாவது’ என்பதில் விடுபட்டுள்ள பெயர்ச்சொல்
  choice: முதன்மை உரையில் ‘ஐந்தாவது, நெத்தனியாவுக்கு’ என்று சுருக்கத்தைப் பேணுதல்
  alternative: ‘ஐந்தாவது சீட்டு நெத்தனியாவுக்கு விழுந்தது’
  rationale: எபிரெய வசனம் ‘சீட்டு’ மற்றும் ‘விழுந்தது/இருந்தது’ போன்ற சொற்களை விடுத்துள்ளது. பட்டியல் சூழல் அவற்றை உணர்த்தினாலும், முதன்மை உரையில் சேர்த்தால் மூலத்தின் சுருக்கமும் உண்மையான மறைபொருளும் மறைந்துவிடும்; எனவே விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சுருக்கமான பட்டியல் நடையைப் பேணும் கண்ணியமான மொழிநடை. எபிரெயச் சொல்லமைப்பின் நீள்வட்டத்தை காக்கும் அதே வேளையில், மனிதர் எண்ணிக்கைக்கு இயல்பான ‘பேர்’ பயன்படுத்தப்பட்டுள்ளது.
