base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/005.yaml
  text: All these were sons of Heman[a], the king’s seer in the words of God, to exalt the horn[b]. And God gave Heman fourteen sons and three daughters.
translation:
  language: ta
  text: இவர்கள் அனைவரும், கடவுளின் வார்த்தைகள் தொடர்பான அரசரின் தரிசகராக இருந்த ஏமானின் மகன்கள்—கொம்பை உயர்த்துவதற்காக[b]. கடவுள் ஏமானுக்குப் பதினான்கு மகன்களையும் மூன்று மகள்களையும் கொடுத்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ‘கொம்பைத் தூக்குவதற்காக’ என்றும் மொழிபெயர்க்கலாம். எபிரெயில் ‘கொம்பு’ என்பது வலிமை, மதிப்பு அல்லது உயர்ந்த நிலையைக் குறிக்கும் உருவகம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אֵלֶּה
  choice: இவர்கள் அனைவரும்
  rationale: பட்டியலில் முன்பு குறிப்பிடப்பட்ட அனைவரையும் சுட்டும் இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: חֹזֵה
  choice: தரிசகர்
  rationale: இறைவெளிப்பாட்டைப் பெறும் அரசவைப் பணியாளரைக் குறிக்கும் எபிரெயச் சொல்லின் சிறப்புப் பொருளைப் பேணுகிறது; பொதுவான ‘தீர்க்கதரிசி’ என்பதைவிட மூலச்சொல்லுக்கு நெருக்கமானது.
- source_word: בְּדִבְרֵי הָאֱלֹהִים
  choice: கடவுளின் வார்த்தைகளில்
  rationale: எபிரெயில் உள்ள சுருக்கமான, பலவகையில் புரிந்துகொள்ளக்கூடிய தொடர்பைத் தீர்மானித்துவிடாமல் நேரடியாகப் பேணுகிறது.
- source_word: לְהָרִים קָרֶן
  choice: கொம்பை உயர்த்துவதற்காக
  rationale: வலிமை, மதிப்பு அல்லது மேன்மையைக் குறிக்கும் வேதாகம உருவகத்தை விளக்கமாக மாற்றாமல் அப்படியே வைத்திருக்கிறது; நோக்கத்தைக் குறிக்கும் לְ வடிவமும் வெளிப்படுகிறது.
- source_word: קָרֶן
  choice: கொம்பு
  rationale: வலிமை அல்லது பெருமையின் உருவகமாக உள்ள மூலப்படிமத்தை ‘வலிமை’ என்று பொருளாக்கிவிடாமல் பேணுகிறது.
- source_word: וַיִּתֵּן הָאֱלֹהִים לְהֵימָן
  choice: கடவுள் ஏமானுக்குக் கொடுத்தார்
  rationale: தெய்வீகக் கொடையாகப் பிள்ளைகள் அளிக்கப்பட்டதை இயல்பான தமிழில் தெரிவித்து, לְהֵימָן என்பதையும் ‘ஏமானுக்கு’ என்று வெளிப்படுத்துகிறது.
- source_word: בָנִים אַרְבָּעָה עָשָׂר וּבָנוֹת שָׁלֹשׁ
  choice: பதினான்கு மகன்களையும் மூன்று மகள்களையும்
  rationale: ஆண், பெண் பிள்ளைகளை மூலத்தில் உள்ளபடியே தனித்தனியாகவும் எண்ணிக்கைகளுடன் துல்லியமாகவும் தருகிறது.
theological_decisions:
- issue: ‘கடவுளின் வார்த்தைகளில் அரசரின் தரிசகர்’ என்ற தொடரின் பொருள்
  choice: கடவுளின் வார்த்தைகளுடன் தொடர்புடைய அரசரின் வெளிப்பாட்டுப் பணியாளராக ஏமான் விவரிக்கப்படுகிறார்; தொடர்பின் துல்லிய இயல்பு திறந்தே வைக்கப்படுகிறது.
  alternative: ‘கடவுளைப் பற்றிய காரியங்களில் அரசரின் தரிசகர்’ அல்லது ‘கடவுளின் வார்த்தைகளால் அரசரின் தரிசகர்.’
  rationale: בְּדִבְרֵי הָאֱלֹהִים என்பது தொடர்பு, செயல்படும் தளம், அல்லது வழிமுறை ஆகியவற்றில் ஒன்றைக் குறிக்கக்கூடிய சுருக்கமான அமைப்பு. மொழிபெயர்ப்பு இதை ஒரே விளக்கமாகச் சுருக்கவில்லை.
- issue: ‘கொம்பை உயர்த்துதல்’ என்ற உருவகத்தின் பொருள் மற்றும் தொடர்பு
  choice: வலிமை, மதிப்பு அல்லது உயர்ந்த நிலை பற்றிய உருவகம் அப்படியே வைக்கப்படுகிறது; யாருடைய கொம்பு என்பது வெளிப்படையாக நிர்ணயிக்கப்படவில்லை.
  alternative: ‘அவருடைய வலிமையைப் பெருக்குவதற்காக’ அல்லது ‘அவரைக் கனப்படுத்துவதற்காக.’
  rationale: மூலவசனம் கொம்பின் உரிமையாளரையோ உருவகத்தின் ஒரே கருத்தையோ தெளிவாகக் குறிப்பிடவில்லை. குறிப்பிட்ட விளக்கத்தைத் திணிக்காமல் உருவகமும் இலக்கணத் திறந்தநிலையும் பேணப்படுகின்றன.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘தரிசகர்’ என்பது பழமையான ‘ஞானதிருஷ்டிக்காரன்’ என்பதைக் காட்டிலும் சுருக்கமாகவும் வாசிக்க எளிதாகவும் இருந்து, חֹזֵה என்பதன் சிறப்புப் பணியையும் பேணுகிறது. முதல் வாக்கியத்தின் எபிரெயச் சுருக்கத்தையும் நோக்கத் தொடரின் தெளிவின்மையையும் கோடு மூலம் பாதுகாத்துள்ளோம்; இரண்டாம் வாக்கியம் இயல்பான தமிழ் சொல்வரிசையில் அமைந்துள்ளது.
