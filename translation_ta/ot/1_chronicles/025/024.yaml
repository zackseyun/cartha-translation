  text: For the seventeenth[a], Joshbekashah, his sons and his brothers, twelve.
translation:
  language: ta
  text: பதினேழாவது சீட்டு[a] யாஷ்பெகாஷாவுக்கு விழுந்தது; அவனுடைய மகன்களும் சகோதரர்களுமாக மொத்தம் பன்னிரண்டு பேர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “பதினேழாவதற்கு, யாஷ்பெகாஷாவுக்கு”; சுற்றியுள்ள வசனங்களின் அடிப்படையில் “சீட்டு” அல்லது “பிரிவு” என்பது மறைமுகமாகக் குறிக்கப்படுகிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְשִׁבְעָה עָשָׂר
  choice: பதினேழாவது சீட்டு
  rationale: எபிரெய உரையில் ‘பதினேழாவது’ என்பது மட்டும் வெளிப்படையாக உள்ளது; சூழலில் முந்தைய வசனங்களிலிருந்து ‘சீட்டு’ என்பது விடுபட்டுச் சுட்டப்படுகிறது. தமிழில் பட்டியலின் பொருள் தெளிவாக இருக்க ‘சீட்டு’ சேர்க்கப்படுகிறது; இதை அடிக்குறிப்பு வெளிப்படுத்துகிறது.
- source_word: לְיָשְׁבְּקָשָׁה
  choice: யொஷ்பெக்காஷாவுக்கு விழுந்தது
  rationale: முன்னொட்டு לְ ஒதுக்கீட்டைப் பெறும் நபரைக் குறிக்கிறது. சீட்டுப் போடும் சூழலில் ‘அவருக்கு விழுந்தது’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: בָּנָיו
  choice: அவனுடைய மகன்கள்
  rationale: בנים இங்கு ஆண்பால் சந்ததியினரான ‘மகன்கள்’ என்பதைக் குறிக்கிறது; பாலினக் குறிப்பை அப்படியே காக்கிறது.
- source_word: וְאֶחָיו
  choice: சகோதரர்கள்
  rationale: אחים என்பதன் நேரடியான பொருள் ‘சகோதரர்கள்’; விரிவான ஆண் உறவினர்கள் என்ற சாத்தியம் இருந்தாலும் அதை உரையில் தீர்மானிக்கவில்லை.
- source_word: שְׁנֵים עָשָׂר
  choice: மொத்தம் பன்னிரண்டு பேர்
  rationale: குழுவின் மொத்த எண்ணிக்கையைத் தரும் எண். தமிழில் பெயரற்ற எண்ணிக்கையை இயல்பாகக் கூற ‘பேர்’ சேர்க்கப்படுகிறது; பட்டியல் அமைப்பைத் தெளிவாக்க ‘மொத்தம்’ பயன்படுத்தப்படுகிறது.
