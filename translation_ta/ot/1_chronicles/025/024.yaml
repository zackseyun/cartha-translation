translation_notes:
  register: நவீனத் தரத் தமிழில், பட்டியல் தன்மையைத் தக்கவைத்தபடி முழுமையான இயல்பான வாக்கியமாக மொழிபெயர்க்கப்பட்டது. பெயர் எபிரெய ஒலிப்புக்கு அண்மையாக ‘யொஷ்பெக்காஷா’ என்று எழுத்துப்பெயர்க்கப்பட்டது.
