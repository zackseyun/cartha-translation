  yaml_path: translation/ot/1_chronicles/025/025.yaml
  text: For the eighteenth[a], Hanani; his sons and his brothers, twelve.
translation:
  language: ta
  text: பதினெட்டாவதற்கு அனானி; அவனுடைய மகன்களும் சகோதரர்களும் பன்னிரண்டு பேர்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִשְׁמוֹנָה עָשָׂר
  choice: பதினெட்டாவது சீட்டு ... விழுந்தது
  rationale: לְ முன்னொட்டு பதினெட்டாவது ஒதுக்கீட்டைக் குறிக்கிறது. ‘சீட்டு’ என்ற சொல் இவ்வசனத்தில் வெளிப்படையாக இல்லாவிட்டாலும், அதிகாரத்தின் தொடரமைப்பில் சீட்டுப்போடுதல் குறிக்கப்படுவதால் இயல்பான தமிழுக்காக உரையில் வெளிப்படுத்தப்பட்டுள்ளது; இதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- source_word: לַחֲנָנִי
  choice: அனானிக்கு
  rationale: எபிரெய தனிப்பெயர் חֲנָנִי நவீனத் தமிழ் வேதாகமப் பெயரொலிப்பு மரபுக்கு ஏற்ப ‘அனானி’ என ஒலிபெயர்க்கப்பட்டு, לַ முன்னொட்டின் பெறுநர் பொருளை ‘-க்கு’ காட்டுகிறது.
- source_word: בָּנָיו
  choice: அவனுடைய மகன்கள்
  rationale: எபிரெயச் சொல் பொதுவான ‘பிள்ளைகள்’ என்பதைக் காட்டிலும் குறிப்பாக ஆண் மக்களைக் குறிக்கிறது.
- source_word: וְאֶחָיו
  choice: சகோதரர்கள்
  rationale: அடிப்படைப் பொருளான ‘சகோதரர்கள்’ பாதுகாக்கப்பட்டுள்ளது; ‘உறவினர்கள்’ என்று விரிவுபடுத்தப்படவில்லை.
- source_word: שְׁנֵים עָשָׂר
  choice: மொத்தம் பன்னிரண்டு பேர்
  rationale: அனானியின் மகன்களையும் சகோதரர்களையும் சேர்த்த குழுவின் எண்ணிக்கையைத் தமிழில் தெளிவாகவும் இயல்பாகவும் தெரிவிக்க ‘மொத்தம்’ மற்றும் மனிதர்களுக்குரிய எண்ணுச்சொல் ‘பேர்’ பயன்படுத்தப்பட்டுள்ளன.
