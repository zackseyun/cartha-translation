translation_notes:
  register: நவீனத் தரத் தமிழில், பட்டியல் அமைப்பின் சுருக்கத்தைத் தக்கவைத்தபடியே இயல்பாக வாசிக்கும்படி வாக்கியம் அமைக்கப்பட்டுள்ளது. பெயர் ‘அனானி’ என ஒலிபெயர்க்கப்பட்டுள்ளது; குடும்ப உறவுச் சொற்கள் குறிப்பான பொருளில் பாதுகாக்கப்பட்டுள்ளன.
