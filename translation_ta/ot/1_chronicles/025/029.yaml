translation_notes:
  register: நவீன நிலையான தமிழில், சுருக்கமான எபிரெயப் பட்டியல் நடையின் தன்மையைப் பேணியபடியே இயல்பான வாசிப்புக்காக ‘சீட்டு … விழுந்தது’ மற்றும் மனிதர் எண்ணிக்கைக்கான ‘பேர்’ பயன்படுத்தப்பட்டுள்ளன. கித்தல்தி என்ற பெயர் எபிரெய ஒலியமைப்பை அணுகும் வகையில் எழுத்துப்பெயர்க்கப்பட்டுள்ளது.
