  text: 'For the twenty-second[a], to Giddalti: his sons and his brothers, twelve.'
translation:
  language: ta
  text: இருபத்திரண்டாவது சீட்டு கித்தல்திக்கும் அவருடைய மகன்களுக்கும் சகோதரர்களுக்கும் விழுந்தது; அவர்கள் பன்னிரண்டு பேர்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִשְׁנַיִם וְעֶשְׂרִים
  choice: இருபத்திரண்டாவது சீட்டு
  rationale: சொற்றொடர் நேரடியாக ‘இருபத்திரண்டாவதற்கு’ என இருந்தாலும், சுற்றியுள்ள சீட்டுப்போடும் பட்டியல் சூழலில் ‘சீட்டு’ என்பது விடுபட்டுப் பொருளில் அடங்கியுள்ளது; தமிழில் வரிசை எண்ணை இயல்பாகத் தெரிவிக்க இது வெளிப்படுத்தப்பட்டது.
- source_word: לְגִדַּלְתִּי
  choice: கித்தல்திக்கு விழுந்தது
  rationale: முன்னொட்டு לְ ஒதுக்கீட்டைப் குறிக்கிறது. சீட்டுப்போடும் சூழலில் ‘கித்தல்திக்கு விழுந்தது’ என்பது அந்த ஒதுக்கீட்டை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: בָּנָיו
  choice: அவருடைய மகன்கள்
  rationale: எபிரெயச் சொல் பொதுவான ‘பிள்ளைகள்’ என்பதைக் காட்டிலும் ஆண் சந்ததியினரான மகன்களைத் தெளிவாகக் குறிக்கிறது.
- source_word: וְאֶחָיו
  choice: சகோதரர்கள்
  rationale: அடிப்படைப் பொருளான ‘சகோதரர்கள்’ பாதுகாக்கப்படுகிறது; இதை ‘உறவினர்கள்’ என்று விரிவுபடுத்த உரையில் கட்டாயம் இல்லை.
- source_word: שְׁנֵים עָשָׂר
  choice: பன்னிரண்டு பேர்
  rationale: இறுதி எண் குழுவின் மொத்த எண்ணிக்கையைக் குறிக்கிறது. மனிதர்களை எண்ணும் இயல்பான தமிழுக்காக ‘பேர்’ சேர்க்கப்பட்டது.
