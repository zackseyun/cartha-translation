  register: சுருக்கமான பட்டியல் நடையைப் பேணியபடியே, தமிழில் பொருள் தெளிவாக இருக்க சூழலில் மறைந்துள்ள ‘சீட்டு’ மற்றும் ‘வந்தது’ வெளிப்படுத்தப்பட்டுள்ளன. நடை நவீனமானதும் கண்ணியமானதும் பொதுவாசகர்களுக்கு எளிதில் புரியத்தக்கதுமாக உள்ளது.
