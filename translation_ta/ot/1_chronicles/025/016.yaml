base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/016.yaml
  text: The ninth was Mattanyahu[a], his sons and his brothers, twelve.
translation:
  language: ta
  text: ஒன்பதாவது சீட்டு மத்தன்யாஹுவுக்கு[a] வந்தது; அவருடைய மகன்களும் சகோதரர்களும் சேர்ந்து பன்னிரண்டு பேர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில்: மத்தன்யாஹு; சில மொழிபெயர்ப்புகளில் மரபாக மத்தனியா என வழங்கப்படுகிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתְּשִׁיעִי
  choice: ஒன்பதாவது சீட்டு
  rationale: எபிரெய உரையில் ‘ஒன்பதாவது’ என்பது பெயர்ச்சொல் விடுபட்ட சுருக்கமான பட்டியல் நடையில் உள்ளது. இவ்வதிகாரத்தின் சீட்டுப்போடும் சூழலைத் தெளிவாகக் காட்ட ‘சீட்டு’ சேர்க்கப்பட்டது.
- source_word: מַתַּנְיָהוּ
  choice: மத்தன்யாஹு
  rationale: எபிரெயப் பெயரின் -யாஹு முடிவையும் மெய்யொலிகளையும் தமிழில் இயன்றவரை நேரடியாகப் பிரதிபலிக்கும் ஒலிபெயர்ப்பு.
- source_word: בָּנָיו
  choice: அவருடைய மகன்கள்
  rationale: எபிரெயச் சொல் பொதுவான ‘பிள்ளைகள்’ என்பதைக் காட்டிலும் குறிப்பாக ஆண் மக்களைக் குறிக்கிறது.
- source_word: וְאֶחָיו
  choice: சகோதரர்கள்
  rationale: அடிப்படைப் பொருளான ஆண் உடன்பிறந்தோர் அல்லது சகோதரர்கள் என்பதைக் காக்கிறது; இச்சூழலில் குலத்தாரையும் உள்ளடக்கக்கூடிய சாத்தியத்தை மொழிபெயர்ப்பு தேவையின்றி விரிவாக்கவில்லை.
- source_word: שְׁנֵים עָשָׂר
  choice: சேர்ந்து பன்னிரண்டு பேர்
  rationale: பெயரிடப்பட்ட தலைவரின் மகன்களும் சகோதரர்களும் கொண்ட மொத்த எண்ணிக்கையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions: []
