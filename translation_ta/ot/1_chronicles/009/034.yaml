base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/034.yaml
  text: These were the heads of the fathers’ houses of the Levites[a], according to their generations, heads[b]. These lived in Jerusalem.
translation:
  language: ta
  text: இவர்கள் லேவியர்களின் தந்தைவழிக் குடும்பங்களின் தலைவர்கள்; தங்கள் வம்சவரிசைகளின்படி தலைவர்களாகிய இவர்கள் எருசலேமில் குடியிருந்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָאשֵׁי ... רָאשִׁים
  choice: தலைவர்கள் ... தலைவர்களாக
  rationale: ஒரே எபிரெயச் சொல்வேர் வசனத்தில் திரும்ப வருவதையும் அதனால் உண்டாகும் வலியுறுத்தலையும் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: הָאָבוֹת
  choice: மூதாதையர் குடும்பங்கள்
  rationale: இது தனித்தனி வீடுகளையோ தந்தையரையோ மட்டும் அல்லாமல், வம்ச அடிப்படையிலான குலக் குடும்பப் பிரிவுகளைக் குறிக்கிறது.
- source_word: לַלְוִיִּם
  choice: லேவியர்களின்
  rationale: இக்குடும்பங்களும் அவற்றின் தலைவர்களும் லேவியர்களைச் சேர்ந்தவர்கள் என்ற உறவை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: לְתֹלְדוֹתָם
  choice: தங்கள் வம்சவரிசைகளின்படி
  rationale: மரபுவழித் தலைமுறைகள் அல்லது வழித்தோன்றல் வரிசைகள் என்ற வம்சாவளிசார் பொருளைத் தெளிவாகத் தருகிறது; எழுதப்பட்ட பதிவுகள் என்று மிகையாகப் பொருள்கொள்ளவில்லை.
- source_word: יָשְׁבוּ
  choice: குடியிருந்தார்கள்
  rationale: இங்கு குறிக்கப்படுவது எருசலேமில் வசித்திருத்தல்; ‘குடியேறினார்கள்’ என ஒரு நிகழ்வை உணர்த்தாமல் நிலையான வாழ்விடத்தைச் சொல்கிறது.
- source_word: בִירוּשָׁלִָם
  choice: எருசலேமில்
  rationale: இடப்பொருளைத் தரும் வழக்கமான தமிழ் வடிவம்.
