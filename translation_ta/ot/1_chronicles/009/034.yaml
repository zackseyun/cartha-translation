translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் தெளிவும் கொண்ட வம்சாவளிப் பதிவு நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மூலத்தின் ‘தலைவர்கள்’ என்ற திட்டமிட்ட மறுகூறல் சற்றே அசாதாரணமாக இருந்தாலும் பொருள் மங்காத வகையில் பாதுகாக்கப்பட்டுள்ளது; அடிக்குறிப்பு குறியீடுகள் அவை விளக்கும் சொற்றொடர்களோடு நேரடியாக இணைக்கப்பட்டுள்ளன.
