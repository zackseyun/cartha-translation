base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/022.yaml
  text: All these who were chosen as gatekeepers at the thresholds were two hundred and twelve[a]. They were enrolled by genealogy in their villages. David and Samuel the seer established them in their office of trust.
translation:
  language: ta
  text: வாசற்படிக் காவலர்களாகத் தேர்ந்தெடுக்கப்பட்டவர்கள் அனைவரும் இருநூற்றுப் பன்னிரண்டு பேர். அவர்கள் தங்கள் கிராமங்களில் வம்சாவளியின்படி பதிவு செய்யப்பட்டிருந்தனர். தாவீதும் தரிசனக்காரரான சாமுவேலும் அவர்களை நம்பிக்கைக்குரிய பொறுப்பில் நிலைநிறுத்தினர்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுடைய உண்மைத்தன்மையின் காரணமாகத் தாவீதும் தரிசனக்காரரான சாமுவேலும் அவர்களை நிலைநிறுத்தினர்”; அல்லது, “அவர்களுடைய உண்மைத்தன்மையில் அவர்களை நிலைநிறுத்தினர்.”
    reason: בֶּאֱמוּנָתָם என்பது நம்பிக்கைக்குரிய பொறுப்பையோ, அவர்களுடைய உண்மைத்தன்மையை காரணமாகவோ நிலையையாகவோ குறிக்கக்கூடிய மாற்று வாசிப்பு.
lexical_decisions:
- source_word: הַבְּרוּרִים
  choice: தேர்ந்தெடுக்கப்பட்ட
  rationale: செயல்பாட்டிற்காகக் குறிப்பாகத் தெரிவுசெய்யப்பட்டவர்களைச் சுட்டும் செயல்பாட்டு வினையெச்சத்தின் பொருளை இயல்பாகப் பாதுகாக்கிறது.
- source_word: לְשֹׁעֲרִים
  choice: வாசல்காவலர்களாக
  rationale: வாசல்களையும் நுழைவிடங்களையும் காக்கும் ஆலயப் பணியாளர்களைக் குறிக்கும் சொல்லின் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: בַּסִּפִּים
  choice: வாசற்படிகளில்
  rationale: סַף என்பதன் அடிப்படைப் பொருளான வாசற்படி அல்லது நுழைவிடத்தின் அடித்தளத்தைப் பாதுகாக்கிறது; பொதுவான ‘வாசல்களில்’ என்பதைவிடத் துல்லியமானது.
- source_word: מָאתַיִם וּשְׁנֵים עָשָׂר
  choice: இருநூற்றுப் பன்னிரண்டு
  rationale: எண்ணிக்கையை நேரடியாகவும் இயல்பான தமிழிலும் தருகிறது.
- source_word: בְחַצְרֵיהֶם
  choice: தங்கள் கிராமங்களில்
  rationale: இந்த வம்சாவளி மற்றும் குடியிருப்புச் சூழலில் חָצֵר ஆலய முற்றங்களையல்ல, அவர்கள் வாழ்ந்த கிராமங்கள் அல்லது சிறுகுடியிருப்புகளைக் குறிக்கிறது.
- source_word: הִתְיַחְשָׂם
  choice: வம்சாவளியின்படி பதிவு செய்யப்பட்டிருந்தனர்
  rationale: வம்சத் தொடர்பின் அடிப்படையில் அதிகாரப்பூர்வப் பதிவில் சேர்க்கப்பட்டிருப்பதைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: יִסַּד
  choice: நிலைநிறுத்தினர்
  rationale: ஒரு பணி ஒழுங்கை ஏற்படுத்தி உறுதிப்படுத்துதல் என்ற நிர்வாகச் சூழலிலான பொருளைத் தருகிறது; பிற்கால சமயப் பதவிச்சொற்களைச் சேர்ப்பதில்லை.
- source_word: הָרֹאֶה
  choice: தரிசனக்காரர்
  rationale: ‘தீர்க்கதரிசி’ என்று பொதுமைப்படுத்தாமல், சாமுவேலுக்குப் பயன்படுத்தப்பட்டுள்ள குறிப்பான பழைய பட்டமான ‘seer’ என்பதைக் காக்கிறது.
- source_word: בֶּאֱמוּנָתָם
  choice: நம்பிக்கைக்குரிய பொறுப்பில்
  rationale: אֱמוּנָה என்பதில் உள்ள நம்பகத்தன்மை மற்றும் ஒப்படைக்கப்பட்ட பொறுப்பு ஆகிய இரு நுணுக்கங்களையும் இச்சூழலில் இயல்பாக இணைக்கிறது.
theological_decisions:
- issue: வசனத்தின் இறுதியில் வரும் בֶּאֱמוּנָתָם என்பதன் பொருள்
  choice: தாவீதும் சாமுவேலும் அவர்களை நம்பிக்கைக்குரிய பொறுப்பில் நிலைநிறுத்தினர்
  alternative: அவர்களுடைய உண்மைத்தன்மையின் காரணமாக அவர்களை நிலைநிறுத்தினர்; அல்லது அவர்களுடைய உண்மைத்தன்மையில் அவர்களை நிலைநிறுத்தினர்
  rationale: எபிரெயச் சொற்றொடர் சுருக்கமானதும் பல பொருள் கொள்ளக்கூடியதும் ஆகும். வாசல்காவலர்களின் அதிகாரப்பூர்வப் பதிவும் பணியமைப்பும் இங்கு பேசப்படுவதால், நம்பிக்கையுடன் ஒப்படைக்கப்பட்ட பொறுப்பு என்ற நிர்வாகப் பொருள் முதன்மை உரையில் பொருத்தமானது. ஆயினும், அவர்களுடைய உண்மைத்தன்மையைக் குறிக்கும் சாத்தியத்தையும் அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன செந்தமிழுக்கு அணுக்கமான, மரியாதைமிக்க உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘வாசற்படிகள்’, ‘வம்சாவளியின்படி பதிவு’, ‘நம்பிக்கைக்குரிய பொறுப்பு’ ஆகியவை மூலத்தின் துல்லியத்தையும் சாதாரண வாசகருக்கான தெளிவையும் சமநிலைப்படுத்துகின்றன. ‘தரிசனக்காரர்’ என்பது குறிப்பான எபிரெயப் பட்டத்தைத் தக்கவைக்கிறது.
