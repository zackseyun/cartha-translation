base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/011.yaml
  text: and Azariah son of Hilkiah[a], son of Meshullam, son of Zadok, son of Meraioth, son of Ahitub, chief officer of the house of God.
translation:
  language: ta
  text: மேலும், இல்க்கியாவின் மகனான அசரியா (இல்க்கியா மெசுல்லாமின் மகன்; மெசுல்லாம் சாதோக்கின் மகன்; சாதோக் மெராயோத்தின் மகன்; மெராயோத் அகிதூபின் மகன்), தேவனுடைய இல்லத்தின் தலைமைப் பொறுப்பாளர்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַ/עֲזַרְיָה
  choice: மேலும், ... அசரியா
  rationale: வ பட்டியலின் தொடர்ச்சியைக் குறிப்பதால் ‘மேலும்’ என மொழிபெயர்க்கப்பட்டது; அசரியா என்பது பெயரின் தமிழ் ஒலிபெயர்ப்பு.
- source_word: בֶן
  choice: மகன்
  rationale: வம்சவரிசையில் மீண்டும் மீண்டும் வரும் ஒருமைச் சொல்லை நேரடியாகவும் தெளிவாகவும் மொழிபெயர்க்கிறது. தலைமுறைகள் சில நேரங்களில் சுருக்கப்படலாம் என்ற சாத்தியத்தை உரை தனியாகத் தீர்மானிப்பதில்லை.
- source_word: חִלְקִיָּה / מְשֻׁלָּם / צָדוֹק / מְרָיוֹת / אֲחִיטוּב
  choice: இல்க்கியா / மெசுல்லாம் / சாதோக் / மெராயோத் / அகித்தூப்
  rationale: எபிரெயப் பெயர்களின் ஒலியை நவீனத் தமிழில் இயல்பாகக் காட்டும் ஒலிபெயர்ப்புகள்.
- source_word: נְגִיד
  choice: தலைமைப் பொறுப்பாளர்
  rationale: ஒரு பொறுப்பில் வைக்கப்பட்ட தலைவர் அல்லது மேற்பார்வையாளர் என்ற பொருளை ஆலய நிர்வாகச் சூழலில் தெளிவாக வெளிப்படுத்துகிறது; ‘அரசன்’ அல்லது ‘இளவரசன்’ போன்ற தவறான அரசியல் நுணுக்கத்தைத் தவிர்க்கிறது.
- source_word: בֵּית הָאֱלֹהִים
  choice: தேவனுடைய இல்லம்
  rationale: ‘தேவனுடைய ஆலயம்’ என்பது சூழலுக்குப் பொருத்தமான விளக்க மொழிபெயர்ப்பாக இருந்தாலும், மூலத்தின் ‘தேவனுடைய இல்லம்’ என்ற உருவகத்தையும் வழிபாட்டுச் செறிவையும் இது பாதுகாக்கிறது.
theological_decisions:
- issue: ஆலயத்தைக் குறிக்கும் தொடரில் אֱלֹהִים என்பதன் மொழிபெயர்ப்பு
  choice: தேவன்
  alternative: தெய்வங்கள்
  rationale: இஸ்ரவேலின் பரிசுத்த இடத்தைக் குறிக்கும் இச்சூழலில் இச்சொல் இஸ்ரவேலின் ஒரே தேவனையே குறிக்கிறது; ஆகவே ஒருமை மொழிபெயர்ப்பு துல்லியமானது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, வாசிக்க எளிதான நடை பயன்படுத்தப்பட்டுள்ளது. தொடர்ச்சியாக வரும் ‘மகன்’ உறவுகள் யாரைக் குறிக்கின்றன என்பதில் குழப்பம் ஏற்படாதபடி ஒவ்வொரு தலைமுறையும் வெளிப்படையாக மீளுரைக்கப்பட்டுள்ளது. மூலத்தில் வினைச்சொல் இல்லாத பெயரடைத் தொடரைத் தமிழிலும் பெயர்ச்சொல் வாக்கியமாகவே வைத்துள்ளது.
