  text: 'And from the priests: Jedaiah, Jehoiarib, and Jakin.'
translation:
  language: ta
  text: 'மேலும், ஆசாரியர்களிலிருந்து: யெதாயா, யெஹோயாரீப், யாகீன்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִן הַכֹּהֲנִים
  choice: ஆசாரியர்களில்
  rationale: מן இங்கு பட்டியலிடப்படும் குழுவிலிருந்து சிலரை அறிமுகப்படுத்துகிறது. முந்தைய சூழலோடு இணைக்கும் ו தமிழ்ப் பட்டியல் நடையில் தனியே ‘மேலும்’ என்று மொழிபெயர்க்கப்படாமல் இயல்பாக உட்பொருளாக்கப்பட்டுள்ளது.
- source_word: יְדַעְיָה
  choice: யெதாயா
  rationale: எபிரெய ஒலிப்புக்கு அண்மையாகத் தனிப்பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וִיהוֹיָרִיב
  choice: யெகோயாரீப்
  rationale: தனிப்பெயர் எபிரெய வடிவுக்கு அண்மையாக ஒலிபெயர்க்கப்பட்டுள்ளது; முன்னொட்டு வாவ் பட்டியலின் இணைப்பாகப் புரிந்துகொள்ளப்படுகிறது.
- source_word: וְיָכִין
  choice: யாகீன்
  rationale: தனிப்பெயர் எபிரெய ஒலிப்புக்கு அண்மையாக ஒலிபெயர்க்கப்பட்டுள்ளது; இறுதிப் பெயருக்கு முன் உள்ள வாவைத் தமிழில் காற்புள்ளிப் பட்டியல் அமைப்பு இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில் சுருக்கமான பட்டியல் நடையும் மரியாதையான வேதாகமப் பதிவின் தொனியும் பேணப்பட்டுள்ளன. ‘ஆசாரியர்’ என்பது כֹּהֵן என்பதற்கான பரவலாகப் புரியக்கூடிய வழக்கமான தமிழ் சொல்.
