translation_notes:
  register: நவீன நிலையான தமிழில், நாளாகமத்தின் வம்சப் பட்டியல் நடையை மதிக்கும் கண்ணியமான ஆனால் எளிதில் புரியக்கூடிய மொழிநடை பயன்படுத்தப்பட்டுள்ளது. ‘சகோதரர்கள்’ என்ற நேரடிப் பொருளும் அதன் விரிந்த குலப் பொருளும் அடிக்குறிப்பின் மூலம் பாதுகாக்கப்பட்டுள்ளன; தந்தைவழிக் குடும்ப அமைப்பைக் குறிக்கும் இரட்டை எபிரெயச் சொற்றொடர் தமிழில் தேவையற்ற மறுபடிவமின்றி தெளிவுபடுத்தப்பட்டுள்ளது.
