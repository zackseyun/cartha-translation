base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/009.yaml
  text: And their brothers[a], according to their generations, were nine hundred and fifty-six[b]. All these men were heads of fathers’ houses in their fathers’ households.
translation:
  language: ta
  text: அவர்களுடைய சகோதரர்களும்[a], தங்கள் வம்சவரிசைகளின்படி[b], தொள்ளாயிரத்து ஐம்பத்தாறு பேர். இவர்கள் அனைவரும் தங்கள் தந்தையரின் குடும்பங்களுக்குரிய தந்தைவழிக் குடும்பங்களின் தலைவர்களாக இருந்த ஆண்கள்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “குலத்து ஆண் உறவினர்களும்.” எபிரெயச் சொல் உடன்பிறந்த சகோதரர்களையும், விரிந்த குல உறவினர்களையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, அவர்களுடைய வம்சத் தொடர்கள் அல்லது வம்சப் பதிவுகளின்படி.
    reason: lexical_alternative
  - marker: c
    text: எபிரெயத்தில் இது தந்தைவழி அமைந்த குடும்பக் குழுக்களின் தலைவர்களையும், அவர்களுடைய தந்தையரின் குடும்பங்களோடுள்ள தொடர்பையும் குறிக்கும் மரபுவழிச் சொற்றொடராகும்.
    reason: cultural_note
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: அவர்களுடைய சகோதரர்களும்
  rationale: אָח என்பதன் அடிப்படைப் பொருளான ‘சகோதரர்’ என்பதைக் காக்கிறது; இவ்வம்சப் பட்டியல் சூழலில் இது ஒரே குலத்தைச் சேர்ந்த ஆண் உறவினர்களையும் குறிக்கக்கூடும் என்பதால் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: לְתֹלְדוֹתָם
  choice: தங்கள் வம்சவரிசைகளின்படி
  rationale: תּוֹלְדוֹת இங்கு தலைமுறைகள் மட்டுமல்லாமல் வம்சத் தொடர் அல்லது வம்சப் பதிவையும் குறிக்கிறது; ‘வம்சவரிசைகளின்படி’ என்பது இச்சூழலில் இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: תְּשַׁע מֵאוֹת וַחֲמִשִּׁים וְשִׁשָּׁה
  choice: தொள்ளாயிரத்து ஐம்பத்தாறு பேர்
  rationale: எண்ணைத் தமிழின் இயல்பான எண்ணுருவில் வழங்கி, மனிதர்களின் எண்ணிக்கை என்பதைக் காட்ட ‘பேர்’ சேர்க்கப்பட்டுள்ளது.
- source_word: כָּל אֵלֶּה אֲנָשִׁים
  choice: இவர்கள் அனைவரும் ... இருந்த ஆண்கள்
  rationale: אֲנָשִׁים இங்கு வம்சப் பட்டியலில் குறிப்பிடப்படும் ஆண் குடும்பத் தலைவர்களைக் குறிப்பதால் பாலினத் துல்லியத்துடன் ‘ஆண்கள்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: רָאשֵׁי אָבוֹת לְבֵית אֲבֹתֵיהֶם
  choice: தங்கள் தந்தைவழிக் குலங்களில் குடும்பத் தலைவர்களாக
  rationale: 'இரு எபிரெய மரபுவழிக் குடும்பச் சொற்றொடர்களின் சமூகப் பொருளை இயல்பான தமிழில் இணைக்கிறது: இவர்கள் தந்தைவழிக் குல அலகுகளுக்குள் அதிகாரமும் பிரதிநிதித்துவமும் கொண்ட குடும்பத் தலைவர்கள்.'
