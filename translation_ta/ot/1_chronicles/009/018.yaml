  register: நவீன தரத் தமிழில், வரலாற்று-நிர்வாகச் சூழலுக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரேயத்தின் வலியுறுத்தல் ‘இவர்களே’ என்பதால் காக்கப்பட்டு, ‘பாளையங்கள்/பிரிவுகள்’ மற்றும் காலக் குறிப்பின் பொருள் வாய்ப்புகள் அடிக்குறிப்புகளில் திறந்துவைக்கப்பட்டுள்ளன.
