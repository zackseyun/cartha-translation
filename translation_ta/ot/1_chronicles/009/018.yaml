base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/018.yaml
  text: Until then they were at the king’s gate on the east[b][a]; they were the gatekeepers for the camps of the sons of Levi.
translation:
  language: ta
  text: இதுவரை[a] அவர்கள் கிழக்குப் பக்கத்திலுள்ள அரசரின் வாசலில் இருந்தார்கள்; லேவியின் மகன்களின் பாளையங்களுக்கான[b] வாயிற்காவலர்கள் அவர்களே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அதுவரை’ அல்லது ‘அந்தக் காலப்புள்ளிவரை’ என்றும் மொழிபெயர்க்கலாம். எபிரேய மரபுத்தொடர் ஒரு குறிப்பிட்ட காலம்வரை நிலை தொடர்ந்ததைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘பிரிவுகளுக்கான’ அல்லது ‘அணிகளுக்கான’ என்றும் மொழிபெயர்க்கலாம். எபிரேயச் சொல் பாளையங்களையோ, சூழலுக்கேற்ப ஒழுங்கமைக்கப்பட்ட குழுக்களையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַד הֵנָּה
  choice: இதுவரை
  rationale: இந்த எபிரேய காலக் குறிப்பு, பேசப்படும் காலப்புள்ளிவரை தொடர்ந்த நிலையைக் குறிக்கிறது. ‘இதுவரை’ என்பது அதன் இயல்பான, நேரடியான தமிழ் வடிவம்; சூழலைப் பொறுத்து ‘அதுவரை’ என்றும் புரிந்துகொள்ளலாம்.
- source_word: בְּשַׁעַר הַמֶּלֶךְ
  choice: அரசரின் வாசலில்
  rationale: שַׁעַר என்பது ‘வாசல்’; ב இங்கு இடத்தைக் குறிக்கிறது. ‘அரசரின் வாசலில்’ என்பது எபிரேய தொடர் அமைப்பையும் இயல்பான தமிழையும் காக்கிறது.
- source_word: מִזְרָחָה
  choice: கிழக்கிலுள்ள
  rationale: திசைச் சுட்டு வடிவம் கிழக்குப் பக்கத்திலுள்ள இடத்தை அல்லது கிழக்கு நோக்கிய அமைவைக் குறிக்கிறது. இங்கு வாசலின் இருப்பிடத்தைத் தெளிவாகச் சொல்ல ‘கிழக்கிலுள்ள’ என மொழிபெயர்க்கப்பட்டது.
- source_word: הֵמָּה
  choice: இவர்களே
  rationale: தனி சுட்டுப்பெயர் வலியுறுத்தலோடு முன் குறிப்பிடப்பட்டவர்களை அடையாளப்படுத்துகிறது; ‘இவர்களே’ அந்த வலியுறுத்தலைத் தமிழில் காக்கிறது.
- source_word: הַשֹּׁעֲרִים
  choice: வாயிற்காவலர்கள்
  rationale: வாசல்களைக் காக்க நியமிக்கப்பட்டவர்களைக் குறிக்கும் நிர்வாகப் பதவி. ‘வாயிற்காவலர்கள்’ தெளிவானதும் வழக்கமானதுமான தமிழ்.
- source_word: לְמַחֲנוֹת
  choice: பாளையங்களுக்கான
  rationale: מַחֲנֶה என்பதன் அடிப்படைப் பொருள் ‘பாளையம்’; இங்கு அது ஒழுங்கமைக்கப்பட்ட குழுக்களையோ பிரிவுகளையோ குறிக்கவும் கூடும். முதன்மை உரையில் அடிப்படைப் படிமம் காக்கப்பட்டுள்ளது.
- source_word: בְּנֵי לֵוִי
  choice: லேவியின் மக்கள்
  rationale: சொல்லுக்கு நெருக்கமாக ‘லேவியின் மகன்கள்’ என்று வரலாம்; ஆனால் வம்சத்தாரைக் குறிக்கும் எபிரேய வழக்கை இயல்பான நவீன தமிழில் ‘லேவியின் மக்கள்’ தெளிவாக எடுத்துரைக்கிறது.
