translation_notes:
  register: நவீன தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட பட்டியல் நடை பயன்படுத்தப்பட்டுள்ளது. பெயர்கள் எபிரெய ஒலியமைப்பை அணுகும் வகையில் ஒலிபெயர்க்கப்பட்டுள்ளன; மூலத்தின் பொருள் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
