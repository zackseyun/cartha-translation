base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/017.yaml
  text: And the gatekeepers were Shallum[a], Akkub, Talmon, Ahiman, and their brothers; Shallum was the chief.
translation:
  language: ta
  text: வாசற்காவலர்கள் சல்லூம், அக்கூப், தல்மோன், அகிமான், அவர்களுடைய சகோதரர்கள்[a] ஆகியோர்; சல்லூமே தலைவராக இருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவர்களுடைய குலத்தார்’; எபிரெய மொழியில் சொல்லுக்குச் சொல் ‘அவர்களுடைய சகோதரர்கள்.’ இத்தகைய பட்டியல்களில் இது உடன்பிறந்த சகோதரர்களையோ ஒரே குலத்தைச் சேர்ந்த உறவினர்களையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֹּׁעֲרִים
  choice: வாசற்காவலர்கள்
  rationale: வாசல்களைக் காவல் காக்க நியமிக்கப்பட்டவர்களைக் குறிக்கிறது; ஆலயச் சூழலில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: שַׁלּוּם
  choice: சல்லூம்
  rationale: எபிரெய தனிப்பெயரின் தமிழ் ஒலிபெயர்ப்பு.
- source_word: עַקּוּב
  choice: அக்கூப்
  rationale: எபிரெய தனிப்பெயரின் தமிழ் ஒலிபெயர்ப்பு.
- source_word: טַלְמֹן
  choice: தல்மோன்
  rationale: எபிரெய தனிப்பெயரின் தமிழ் ஒலிபெயர்ப்பு.
- source_word: אֲחִימָן
  choice: அகிமான்
  rationale: எபிரெய தனிப்பெயரின் தமிழ் ஒலிபெயர்ப்பு.
- source_word: אֲחִיהֶם
  choice: அவர்களுடைய சகோதரர்கள்
  rationale: சொல்லுக்குச் சொல் பொருள் ‘அவர்களுடைய சகோதரர்கள்’; பட்டியல் சூழலில் இது ஒரே குலத்தைச் சேர்ந்த உறவினர்களையும் குறிக்கக்கூடும் என்பதால் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: הָרֹאשׁ
  choice: தலைவர்
  rationale: இங்கு தலைமைப் பதவி அல்லது முதன்மை நிலையைக் குறிக்கிறது; நவீன தமிழில் இயல்பான சொல்.
- source_word: וְ...וְ...וַ...וַ
  choice: பட்டியலில் காற்புள்ளிகளும் ‘ஆகியோர்’ என்பதும்
  rationale: எபிரெய மொழியின் தொடர்ச்சியான இணைப்புச் சொற்களின் கூட்டுப் பொருளை இயல்பான தமிழ் பட்டியல் நடையில் வெளிப்படுத்துகிறது.
