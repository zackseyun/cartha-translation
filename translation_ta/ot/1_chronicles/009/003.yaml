base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/003.yaml
  text: And in Jerusalem some from the sons of Judah, and some from the sons of Benjamin, and some from the sons of Ephraim and Manasseh, lived there.
translation:
  language: ta
  text: எருசலேமில் யூதாவின் வழிவந்தவர்களில்[a] சிலரும், பென்யமீனின் வழிவந்தவர்களில் சிலரும், எப்பிராயீம் மற்றும் மனாசேயின் வழிவந்தவர்களில் சிலரும் குடியிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெய மொழியில் சொல்லுக்குச் சொல்: “யூதாவின் மகன்களில் ... பென்யமீனின் மகன்களில் ... எப்பிராயீம் மற்றும் மனாசேயின் மகன்களில்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בִ/ירוּשָׁלִַם
  choice: எருசலேமில்
  rationale: வாவ் இணைப்பைத் தமிழில் தனியே மொழிபெயர்க்காமல், தொடர்ச்சியை இயல்பான வாக்கிய அமைப்பில் உணர்த்துகிறது; בְּ என்பதன் இடப்பொருளை ‘-இல்’ துல்லியமாகக் காட்டுகிறது.
- source_word: יָשְׁבוּ
  choice: குடியிருந்தார்கள்
  rationale: ישב இங்கு ஓர் இடத்தில் வசித்தல் அல்லது குடியிருத்தல் என்ற பொருளில் வருகிறது. ‘குடியிருந்தார்கள்’ என்பது வரலாற்றுச் சூழலுக்கு ஏற்ற, இயல்பான நவீனத் தமிழ்.
- source_word: מִן
  choice: வழிவந்தவர்களில் சிலரும்
  rationale: மீண்டும் மீண்டும் வரும் מִן, ஒவ்வொரு கோத்திரத்தையும் சேர்ந்த முழுக் குழுவையும் அல்லாமல், அவர்களிலிருந்து சிலர் என்பதைக் குறிக்கிறது. தமிழில் எழுவாயைத் தெளிவாகவும் இயல்பாகவும் அமைக்க ‘சிலரும்’ சேர்க்கப்பட்டுள்ளது.
- source_word: בְּנֵי יְהוּדָה / בְּנֵי בִנְיָמִן / בְּנֵי אֶפְרַיִם וּמְנַשֶּׁה
  choice: யூதாவின் / பென்யமீனின் / எப்பிராயீம் மற்றும் மனாசேயின் வழிவந்தவர்கள்
  rationale: בני என்பதன் கோத்திர-வம்சப் பொருளை நவீனத் தமிழில் ‘வழிவந்தவர்கள்’ தெளிவாக வெளிப்படுத்துகிறது. ‘மகன்கள்’ என்ற சொல்லுக்குச் சொல் வடிவம் இச்சூழலில் உயிரியல் மகன்கள் என்று தவறாகப் புரிந்துகொள்ளப்படலாம்.
theological_decisions: []
translation_notes:
  register: இயல்பான, கண்ணியமான நவீனத் தமிழ் பயன்படுத்தப்பட்டுள்ளது. மூன்று கோத்திரக் குழுக்களையும் மீளுருவாக்கும் எபிரெய வாக்கிய அமைப்பு பாதுகாக்கப்பட்டுள்ளது; வம்ச-கோத்திரப் பொருளைத் தெளிவாக்க ‘வழிவந்தவர்கள்’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
