source:
  edition: WLC
  text: וְ/נֵר֙ הוֹלִ֣יד אֶת קִ֔ישׁ וְ/קִ֖ישׁ הוֹלִ֣יד אֶת שָׁא֑וּל וְ/שָׁא֗וּל הוֹלִ֤יד אֶת יְהֽוֹנָתָן֙ וְ/אֶת מַלְכִּי שׁ֔וּעַ וְ/אֶת אֲבִינָדָ֖ב וְ/אֶת אֶשְׁבָּֽעַל־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/039.yaml
  text: Ner fathered Kish[a], and Kish fathered Saul, and Saul fathered Jonathan, Malchi-shua, Abinadab, and Eshbaal.
translation:
  language: ta
  text: நேர் கீசைப் பெற்றான்; கீஸ் சவுலைப் பெற்றான்; சவுல் யோனத்தான், மல்கிசூவா, அபினதாப், எஸ்பால்[a] ஆகியோரைப் பெற்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 2 சாமுவேல் 2:8 மற்றும் தொடர்புடைய பகுதிகளில் எஸ்பால் ‘இஸ்போசேத்’ என்று அழைக்கப்படுகிறார்.
    reason: வேறு நூலில் காணப்படும் மாற்றுப் பெயரை அடையாளப்படுத்துதல்
lexical_decisions:
- source_word: הוֹלִיד
  choice: பெற்றான்
  rationale: வம்சப் பட்டியல் சூழலில் இந்த எபிரெய வினை ஒருவன் ஒருவருக்குத் தந்தையானதைக் குறிக்கிறது. ‘பெற்றான்’ என்பது தமிழில் இயல்பான, சுருக்கமான வம்சாவளி நடை; ‘தந்தையானான்’ என்பதைவிட வாசிப்புக்கு எளிது.
- source_word: נֵר
  choice: நேர்
  rationale: எபிரெய தனிப்பெயரின் ஒலிபெயர்ப்பு.
- source_word: קִישׁ
  choice: கீஸ்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் அறியப்பட்ட வடிவத்தைப் பின்பற்றும் தனிப்பெயர்.
- source_word: שָׁאוּל
  choice: சவுல்
  rationale: தமிழில் பரவலாக அறியப்பட்ட மரபுவழிப் பெயர் வடிவம்.
- source_word: יְהוֹנָתָן
  choice: யோனத்தான்
  rationale: தமிழில் பரவலாக அறியப்பட்ட பெயர் வடிவம்; மூலப் பெயரைத் தெளிவாக அடையாளப்படுத்துகிறது.
- source_word: מַלְכִּי שׁוּעַ
  choice: மல்கிசூவா
  rationale: எபிரெயத்தில் இரண்டு கூறுகளைக் கொண்டிருந்தாலும் இது ஒரே தனிப்பெயராகச் செயல்படுகிறது; தமிழில் ஒன்றிணைந்த ஒலிபெயர்ப்பு இயல்பாக உள்ளது.
- source_word: אֲבִינָדָב
  choice: அபினதாப்
  rationale: மூலப் பெயரைப் பிரதிபலிக்கும், தமிழில் அறியப்பட்ட தனிப்பெயர் வடிவம்.
- source_word: אֶשְׁבָּעַל
  choice: எஸ்பால்
  rationale: நாளாகமத்தின் எபிரெய மூலத்தில் உள்ள பெயரையே மொழிபெயர்ப்பு பின்பற்றுகிறது; சாமுவேலில் காணப்படும் வேறு பெயருடன் அமைதியாக ஒத்திசைக்கவில்லை.
- source_word: וְ
  choice: ; / , / ஆகியோரை
  rationale: மீண்டும் வரும் இணைப்புகளைத் தமிழின் இயல்பான வம்சாவளி வாக்கிய அமைப்பில் அரைப்புள்ளி, பட்டியல் காற்புள்ளி, ‘ஆகியோரை’ ஆகியவற்றால் வெளிப்படுத்துகிறது.
- source_word: אֶת
  choice: தனியாக மொழிபெயர்க்கப்படவில்லை
  rationale: நேரடிச் செயப்படுபொருளைக் குறிக்கும் எபிரெய இலக்கணக் குறிக்கு தமிழில் தனிச் சொல் இணை இல்லை; ‘-ஐ’ வேற்றுமை உருபும் வாக்கிய அமைப்பும் அதன் பணியை வெளிப்படுத்துகின்றன.
theological_decisions:
- issue: எஸ்பால் என்ற பெயரையும் சாமுவேலில் வரும் இஸ்போசேத் என்ற பெயரையும் ஒத்திசைத்தல்
  choice: முதன்மை உரையில் எபிரெய நாளாகம மூலத்தின் ‘எஸ்பால்’ என்பதையே வைத்தல்
  alternative: முதன்மை உரையில் ‘இஸ்போசேத்’ என்று மாற்றுதல்
  rationale: மூல உரையின் தனித்த பெயர் வடிவத்தைப் பாதுகாத்து, வேறு நூலில் வரும் பெயரை அடிக்குறிப்பில் தெரிவிப்பது உரை வேறுபாட்டை மறைக்காது.
translation_notes:
  register: நவீனத் தரத் தமிழில், வம்சாவளிக்கேற்ற சுருக்கமானவும் கண்ணியமானவும் நடை பயன்படுத்தப்பட்டுள்ளது. மீள வரும் எபிரெய இணைப்புகள் தமிழில் இயல்பாக வாசிக்கும்படி அமைக்கப்பட்டுள்ளன; பெயர்கள் பரவலாக அறியப்பட்ட தமிழ் வடிவங்களில் தரப்பட்டுள்ளன.
