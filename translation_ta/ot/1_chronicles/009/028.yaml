source:
  edition: WLC
  text: וּ/מֵ/הֶ֖ם עַל כְּלֵ֣י הָ/עֲבוֹדָ֑ה כִּֽי בְ/מִסְפָּ֣ר יְבִיא֔וּ/ם וּ/בְ/מִסְפָּ֖ר יוֹצִיאֽוּ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/028.yaml
  text: Some of them were in charge of the vessels of service[a], for they brought them in by count and took them out by count.
translation:
  language: ta
  text: அவர்களில் சிலர் வழிபாட்டுப் பணிக்கான பாத்திரங்களுக்குப் பொறுப்பாயிருந்தார்கள்[a]; ஏனெனில் அவற்றை எண்ணிக்கையின்படி உள்ளே கொண்டுவருவார்கள், எண்ணிக்கையின்படி வெளியே எடுத்துச் செல்வார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “வழிபாட்டுப் பணிக்கான பொருள்கள்” அல்லது “வழிபாட்டில் பயன்படுத்தப்படும் கருவிகள்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் பாத்திரங்கள், உபகரணங்கள் அல்லது கருவிகள் எனப் பரந்த பொருளில் வரலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵהֶם
  choice: அவர்களில் சிலர்
  rationale: מִן என்பதன் பகுதிப்பொருளை இயல்பான நவீனத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: עַל
  choice: பொறுப்பாயிருந்தார்கள்
  rationale: இங்கு עַל மேற்பார்வை அல்லது ஒப்படைக்கப்பட்ட பொறுப்பைக் குறிக்கிறது; தமிழில் இது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: כְּלֵי הָעֲבוֹדָה
  choice: வழிபாட்டுப் பணிக்கான பாத்திரங்கள்
  rationale: כְּלִי என்பது பாத்திரங்கள், உபகரணங்கள், கருவிகள் ஆகியவற்றைக் குறிக்கக்கூடிய விரிவான சொல்; ஆலயச் சூழலில் הָעֲבוֹדָה வழிபாட்டுப் பணியைக் குறிக்கிறது. முதன்மை உரை பாத்திரங்கள் என்ற பொருளைத் தருகிறது; விரிவான மாற்றுகள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய பொறுப்பு ஒப்படைப்புக்கான காரணம் அல்லது விளக்கத்தை அறிமுகப்படுத்துகிறது.
- source_word: בְמִסְפָּר
  choice: எண்ணிக்கையின்படி
  rationale: துல்லியமான எண்ணிக்கைக் கணக்கின் அடிப்படையில் பொருள்கள் ஒப்படைக்கப்பட்டதையும் திரும்பப் பெறப்பட்டதையும் குறிக்கிறது; எபிரெய உரையில் இருமுறை வரும் தொடர்ச்சியும் தமிழில் பாதுகாக்கப்படுகிறது.
- source_word: יְבִיאוּם
  choice: அவற்றை ... உள்ளே கொண்டுவருவார்கள்
  rationale: בוא என்பதன் ஹிஃபில் வடிவம் ‘உள்ளே கொண்டுவருதல்’ எனப் பொருள்படும். இங்குள்ள நிறைவுறா வினை வழக்கமான செயலைக் குறிப்பதால் தமிழில் எதிர்கால வடிவிலான வழக்கநிலைப் பயன்பாடு தேர்ந்தெடுக்கப்பட்டது.
- source_word: יוֹצִיאוּם
  choice: வெளியே எடுத்துச் செல்வார்கள்
  rationale: יצא என்பதன் ஹிஃபில் வடிவம் ‘வெளியே கொண்டுசெல்லுதல்’ எனப் பொருள்படும்; முன் வரும் ‘உள்ளே கொண்டுவருவார்கள்’ என்பதற்கு இயல்பான இணைச்சொற்றொடராக உள்ளது.
