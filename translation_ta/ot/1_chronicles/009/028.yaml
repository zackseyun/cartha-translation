translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியக்கூடிய அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ஆலயச் சூழலைத் தெளிவாக்க ‘வழிபாட்டுப் பணி’ பயன்படுத்தப்பட்டுள்ளது; மூலத்தின் கணக்குப்பொறுப்பு வலியுறுத்தப்படும்படி ‘எண்ணிக்கையின்படி’ இருமுறையும் தக்கவைக்கப்பட்டுள்ளது.
