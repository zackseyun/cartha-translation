translation_notes:
  register: நவீனத் தரத் தமிழில், வம்சப்பட்டியலுக்கேற்ற சுருக்கமான பெயர்ப்பட்டியலாக அமைக்கப்பட்டது. எபிரேயத்தில் ஒவ்வொரு பெயருக்கும் முன் உள்ள இணைப்புச் சொல் தமிழில் இயல்பாக ஒவ்வொன்றாக மீண்டும் இடப்படாமல், காற்புள்ளிகளால் பட்டியலாக்கப்பட்டுள்ளது.
