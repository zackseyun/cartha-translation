base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/007.yaml
  text: 'And from the sons of Benjamin: Sallu son of Meshullam[a], son of Hodaviah[c][b], son of Hassenuah.'
translation:
  language: ta
  text: 'மேலும், பென்யமீன் மக்களிலிருந்து: மெஷுல்லாமின் மகனான ஹோதவியாவின் மகனான ஹஸ்ஸெனூவாவின் மகனான சல்லூ.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: வம்சவரிசைகளில் “மகன்” என்பது நேரடி மகனையும், சில சமயங்களில் பிற்கால வம்சத்தவரையும் குறிக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: וּ/מִן בְּנֵי בִּנְיָמִן
  choice: பென்யமீனின் மக்களில்
  rationale: இணைப்புச் சொல் முந்தைய பட்டியலோடு தொடர்ச்சியைச் சுட்டுகிறது; தமிழில் பட்டியல் அமைப்பில் இயல்பாகத் தொடரும் வகையில் மொழிபெயர்க்கப்பட்டது. ‘மக்கள்’ என்பது இங்கு பென்யமீன் கோத்திரத்தைச் சேர்ந்தவர்களைக் குறிக்கிறது.
- source_word: סַלּוּא
  choice: சல்லூ
  rationale: எபிரேய தனிப்பெயரின் ஒலிப்பைத் தமிழில் நெருக்கமாக எழுத்துப்பெயர்த்தல்.
- source_word: בֶּן
  choice: மகன்
  rationale: வம்சவரிசையில் மீண்டும் வரும் בֶּן என்பதன் நேரடியான பொருள் காக்கப்படுகிறது; இது நேரடி மகனையோ பரந்த வம்சவழி உறவையோ குறிக்கக்கூடும்.
- source_word: מְשֻׁלָּם
  choice: மெசுல்லாம்
  rationale: எபிரேய தனிப்பெயரின் ஒலிப்பை நெருக்கமாக எழுத்துப்பெயர்த்தல்.
- source_word: הוֹדַוְיָה
  choice: ஒதவியா
  rationale: WLC மசோரா வாசகத்தில் உள்ள பெயர்வடிவமே பின்பற்றப்படுகிறது.
- source_word: הַ/סְּנֻאָה
  choice: அசெனூவா
  rationale: வம்சவரிசைச் சூழலில் இதைத் தனிப்பெயராக எடுத்துக்கொண்டு, எபிரேய உச்சரிப்பை நெருங்கிய தமிழாக்கம் வழங்கப்படுகிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், வம்சப்பட்டியலுக்குரிய சுருக்கமான மற்றும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. மூலத்தில் மீண்டும் வரும் ‘மகன்’ உறவு தமிழில் தெளிவாகத் தெரிய ஒருங்கிணைந்த பெயரெச்சத் தொடராக அமைக்கப்பட்டது.
