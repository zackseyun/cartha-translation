  source_fidelity: திருத்தம் தேவை. וּמִן என்பதன் ‘மற்றும்/மேலும் ... இலிருந்து’ என்ற தொடர்ச்சி மற்றும் இடமாற்றப் பொருளை ‘...இலிருந்து’ என்று வெளிப்படுத்துவது துல்லியமானது; தற்போதைய ‘...இல்’ என்பது ‘அவர்களுக்குள்/அவர்களிடையே’ என்ற பொருளைத் தரக்கூடும். הַשִּׁילוֹנִי இங்கு குலப்பெயராகக் கூட்டுப்பொருளில் வருவதால் பன்மை வடிவம் ஏற்றது. הַבְּכוֹר மற்றும் בָנָיו முறையே ‘முதற்பேறான’ மற்றும் ‘அவருடைய மகன்கள்’ எனச் சரியாகக் காக்கப்படுகின்றன.
  naturalness: திருத்தப்பட்ட உரை வம்சவரிசைப் பட்டியலுக்குரிய சுருக்கமான நவீன தரத் தமிழில் இயல்பாக உள்ளது. இரட்டைப்புள்ளி, முந்தைய வசனத்துடன் தொடரும் பட்டியல் உறுப்பைத் தெளிவுபடுத்துகிறது; முழு வினைச்சொல் சேர்க்கப்படவில்லை.
