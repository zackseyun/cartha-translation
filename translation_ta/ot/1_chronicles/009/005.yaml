  register: நவீன தரத் தமிழில், வம்சப் பட்டியலுக்கேற்ற சுருக்கமானவும் கண்ணியமானவும் உள்ள நடை பயன்படுத்தப்பட்டுள்ளது. வசனம் முந்தைய பட்டியலின் வாக்கியத் தொடராக இருப்பதால், மூலத்தில் உள்ளபடியே முழு வினைச்சொல் சேர்க்கப்படவில்லை.
