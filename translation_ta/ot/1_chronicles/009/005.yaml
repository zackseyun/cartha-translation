translation:
  language: ta
  text: 'மேலும் ஷீலோனியர்களிலிருந்து: முதற்பேறான அசாயாவும் அவருடைய மகன்களும்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מִן
  choice: …இல் …வும்
  rationale: முந்தைய பட்டியலுடன் தொடரும் இணைப்பைத் தமிழில் பட்டியல் நடைக்கு இயல்பான ‘…இல் …வும்’ என்ற அமைப்பு வெளிப்படுத்துகிறது.
- source_word: הַ/שִּׁילוֹנִי
  choice: சீலோனியர்களில்
  rationale: இலக்கண வடிவம் ஒருமையாக இருந்தாலும், இங்கு அது ஒரு குலத்தாரைக் கூட்டாகக் குறிக்கிறது; ஆகவே தமிழில் பன்மைக் குழுப்பெயராக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: עֲשָׂיָה
  choice: அசாயா
  rationale: தனிப்பட்ட நபரின் பெயர் என்பதால் பொருள் மொழிபெயர்ப்பு செய்யாமல் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: הַ/בְּכֹר
  choice: முதற்பேறான
  rationale: இந்தச் சொல் வெறுமனே வயதில் மூத்தவர் என்பதை அல்ல, குடும்பத்தில் முதலில் பிறந்த மகன் என்ற உறவுநிலையைக் குறிக்கிறது.
- source_word: וּ/בָנָיו
  choice: அவருடைய மகன்களும்
  rationale: בנים இங்கு பொதுவான ‘பிள்ளைகள்’ என்பதற்குப் பதிலாக ‘மகன்கள்’ என்று குறிப்பாக மொழிபெயர்க்கப்படுகிறது; இணைப்புச் சொல் பட்டியலின் தொடர்ச்சியைப் பாதுகாக்கிறது.
