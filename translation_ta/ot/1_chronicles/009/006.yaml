  yaml_path: translation/ot/1_chronicles/009/006.yaml
  text: 'And from the sons of Zerah: Jeuel and their brothers[a], six hundred and ninety.'
translation:
  language: ta
  text: 'சேராகின் மக்களிலிருந்தும்: யெயூவேலும் அவர்களுடைய சகோதரர்களும்[a]—மொத்தம் அறுநூற்றுத் தொண்ணூறு பேர்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யெயூவேலும் அவனுடைய சகோதரர்களும்—மொத்தம் அறுநூற்றுத் தொண்ணூறு பேர்.” யெயூவேலைக் குலத்தின் பிரதிநிதித் தலைவராகக் கொண்டு உறவுமுறையை ஒருமையில் புரிந்துகொண்டால் இவ்வாறு மொழிபெயர்க்கலாம். ஆனால் எபிரெயத்தில் “அவர்களுடைய” என்பதற்குரிய பின்னொட்டு பன்மையில் உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִן
  choice: மக்களில்
  rationale: מִן என்பதன் ‘இருந்து/மத்தியில்’ என்ற பொருளைத் தமிழ்ப் பட்டியல் நடைக்கு இயல்பாக ‘மக்களில்’ என வழங்குகிறது; וְ இணைப்பின் தொடர்ச்சியை முந்தைய வசனத்தோடு உள்ள பட்டியல் அமைப்பு உணர்த்துகிறது.
- source_word: בְּנֵי זֶרַח
  choice: சேராகின் மக்களில்
  rationale: בְּנֵי என்பது இங்கு நேரடி மக்களை மட்டுமல்லாமல் வம்சத்தாரையும் குறிக்கக்கூடிய மரபுவழிப் பட்டியல் சொல். ‘மக்கள்’ அந்த விரிவைத் தக்கவைத்தபடி இயல்பான தமிழை அளிக்கிறது.
- source_word: יְעוּאֵל
  choice: யெயூவேல்
  rationale: எபிரெய தனிப்பெயரின் ஒலியமைப்பைத் தமிழில் நெருக்கமாக எழுத்துப்பெயர்த்துள்ளது.
- source_word: וַ/אֲחֵי/הֶם
  choice: அவர்களுடைய சகோதரர்களும்
  rationale: எபிரெயச் சொல்லிலுள்ள மூன்றாம் நபர் ஆண்பால் பன்மை உடைமைப் பின்னொட்டை வெளிப்படையாகத் தக்கவைக்கிறது. ‘சகோதரர்கள்’ என்பது இந்த வம்சப் பதிவில் உடன்பிறந்தவர்களையோ விரிவான குல உறவினர்களையோ குறிக்கலாம்.
- source_word: שֵׁשׁ מֵאוֹת וְתִשְׁעִים
  choice: மொத்தம் அறுநூற்றுத் தொண்ணூறு பேர்
  rationale: எண்ணிக்கையைத் தமிழில் சொற்களால் வழங்குகிறது. பட்டியலிடப்பட்ட மனிதர்களின் மொத்த எண்ணிக்கை என்பதைத் தெளிவாக்க ‘மொத்தம்’ மற்றும் ‘பேர்’ சேர்க்கப்பட்டுள்ளன.
