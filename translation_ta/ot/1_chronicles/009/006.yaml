translation_notes:
  register: நவீனத் தரத் தமிழில், வம்சப் பட்டியலுக்கேற்ற சுருக்கமானதும் கண்ணியமானதுமான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் பன்மை உடைமைச் சுட்டு இயல்பற்றதாகத் தோன்றினாலும் மறைக்கப்படாமல் முதன்மை உரையில் பாதுகாக்கப்பட்டு, ஒருமை வாசிப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
