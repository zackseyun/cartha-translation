    reason: שֹׁעֵר மற்றும் פֶּתַח ஆகியவற்றுக்கான நெருக்கமான சொற்பொருள் மாற்றுவடிவம்.
lexical_decisions:
- source_word: זְכַרְיָה
  choice: சகரியா
  rationale: எபிரேயத் தனிப்பெயர் தமிழில் வழக்கமான வேதாகமப் பெயர்வடிவில் ஒலிபெயர்க்கப்பட்டது.
