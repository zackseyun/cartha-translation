- source_word: שֹׁעֵר
  choice: காவலர்
  rationale: நுழைவிடத்தைக் காக்கும் பணியாளரை இச்சொல் குறிக்கிறது; ‘காவலர்’ என்பது இச்சூழலில் இயல்பான நவீனத் தமிழ்.
- source_word: פֶּתַח
  choice: நுழைவாயில்
  rationale: ஒரு கூடாரத்திற்குள் செல்லும் திறப்பையோ வாயிலையோ குறிக்கும் சொல்லுக்கு இயல்பான தமிழ் இணை.
- source_word: לְאֹהֶל
  choice: கூடாரத்தின்
  rationale: לְ என்னும் முன்னொட்டு இங்கு פֶּתַח என்பதுடன் தொடர்புபட்டு, தமிழில் இயல்பாக உடைமைத் தொடர்பால் ‘கூடாரத்தின் நுழைவாயில்’ என வழங்கப்படுகிறது.
- source_word: מוֹעֵד
  choice: சந்திப்பு
  rationale: אֹהֶל מוֹעֵד என்ற நிலையான பரிசுத்த இடப்பெயரில், தேவனுடனான நியமிக்கப்பட்ட சந்திப்பின் கருத்தைச் சுருக்கமாகத் தக்கவைக்கிறது.
- source_word: אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரம்
  rationale: எபிரேயச் சொற்றொடரின் ‘கூடாரம்’ மற்றும் ‘சந்திப்பு’ ஆகிய இரு கூறுகளையும் நேரடியாகத் தக்கவைக்கும் தெளிவான தமிழ் வடிவம்.
