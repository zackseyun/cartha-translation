  text: Zechariah son of Meshelemiah was gatekeeper at the entrance to the tent of meeting[a].
translation:
  language: ta
  text: மெஷெலேமியாவின் மகன் சகரியா, சந்திப்புக் கூடாரத்தின் நுழைவாயிலில் காவலராக இருந்தார்.[a]
