  yaml_path: translation/ot/1_chronicles/009/043.yaml
  text: And Moza fathered Binea[a], and his son was Rephaiah, his son Eleasah, his son Azel.
translation:
  language: ta
  text: மோசா பினெயாவைப் பெற்றான்; பினெயாவின் மகன் ரெபாயா; ரெபாயாவின் மகன் எலெயாசா; எலெயாசாவின் மகன் ஆசேல்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில் சொல்லுக்குச் சொல்: “ரெபாயா அவனுடைய மகன், எலெயாசா அவனுடைய மகன், ஆசேல் அவனுடைய மகன்.” வம்சவரிசை தெளிவாகத் தெரிய, தமிழில் ஒவ்வொரு ‘அவனுடைய’ என்பதன் முன்னோடியும் பெயரால் குறிப்பிடப்பட்டுள்ளது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹצָא
  choice: மோசா
  rationale: தனிப்பட்ட பெயர் என்பதால், மசோரா உயிர்க்குறிப்பை அணுகிய தமிழெழுத்துப் பெயர்ப்பாக வழங்கப்பட்டது.
- source_word: הוֹלִיד
  choice: பெற்றான்
  rationale: வம்சப்பட்டியல் சூழலில் Hiphil வடிவம் ஒருவன் மற்றொருவனுக்குத் தந்தையானதைக் குறிக்கிறது; ‘பெற்றான்’ என்பது நவீன தமிழில் இயல்பாகவும் சுருக்கமாகவும் அந்த உறவைத் தெரிவிக்கிறது.
- source_word: בִּנְעָא
  choice: பினெயா
  rationale: எபிரெய மசோரா உச்சரிப்பை நெருங்கிய தனிப்பட்ட பெயர்ப்பாக வழங்கப்பட்டது.
- source_word: רְפָיָה
  choice: ரெபாயா
  rationale: தனிப்பட்ட பெயர்; எபிரெய வடிவத்தைத் தமிழில் ஒலிபெயர்த்தது.
- source_word: אֶלְעָשָׂה
  choice: எலெயாசா
  rationale: தனிப்பட்ட பெயர்; எபிரெய வடிவத்தைத் தமிழில் ஒலிபெயர்த்தது.
- source_word: אָצֵל
  choice: ஆசேல்
  rationale: தனிப்பட்ட பெயர்; எபிரெய மெய்யொலி மற்றும் உயிர்க்குறிப்பை அணுகிய தமிழெழுத்துப் பெயர்ப்பு.
- source_word: בְנוֹ
  choice: …வின் மகன்
  rationale: மூலத்தில் மீண்டும் மீண்டும் வரும் ‘அவனுடைய மகன்’ என்ற உறவை, வம்சத் தொடரின் ஒவ்வொரு தலைமுறையும் தெளிவாகத் தெரிய இயல்பான தமிழில் பெயருடன் இணைத்து வழங்குகிறது.
