  register: நவீன நிலையான தமிழில், வம்சப்பட்டியலுக்கேற்ற சுருக்கமான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் தொடர்ச்சியான ‘அவனுடைய மகன்’ அமைப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டு, முதன்மை உரையில் உறவுகள் தெளிவுபடுத்தப்பட்டுள்ளன.
