  text: וּ/מִקְל֖וֹת הוֹלִ֣יד אֶת שִׁמְאָ֑ם וְ/אַף הֵ֗ם נֶ֧גֶד אֲחֵי/הֶ֛ם יָשְׁב֥וּ בִ/ירֽוּשָׁלִַ֖ם עִם אֲחֵי/הֶֽם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/038.yaml
  text: Mikloth fathered Shimeam[a]. They also lived opposite their brothers in Jerusalem[b], with their brothers.
translation:
  language: ta
  text: மிக்லோத் சிமெயாமைப் பெற்றான்[a]. அவர்களும் எருசலேமில் தங்கள் சகோதரர்களுக்கு எதிரில்[b], தங்கள் சகோதரர்களுடன் குடியிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘சிமெயாம்’; இணையான வம்சவரிசைப் பெயர் வடிவங்களுடன் ஒத்திசைத்து, சில மொழிபெயர்ப்புகள் ‘சிமெயா’ என்று தருகின்றன.
    reason: alternative_reading
  - marker: b
    text: ‘தங்கள் சகோதரர்களுக்கு முன்பாக’ அல்லது ‘தங்கள் சகோதரர்களுக்கு அருகே’ என்றும் பொருள்கொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִקְלוֹת
  choice: மிக்லோத்
  rationale: தனிப்பெயர் என்பதால் மொழிபெயர்க்காமல், எபிரெய ஒலிப்புக்கு நெருக்கமாக எழுத்துப்பெயர்க்கப்பட்டது. தொடக்க இணைப்புச்சொல் தமிழின் வாக்கிய ஓட்டத்தில் தனியே வெளிப்படுத்தப்படவில்லை.
- source_word: הוֹלִיד
  choice: பெற்றான்
  rationale: வம்சவரிசைச் சூழலில் ஹிஃபில் வடிவம் ‘தந்தையானான்/பெற்றான்’ என்ற பொருளைக் கொண்டது; ‘பெற்றான்’ சுருக்கமான, இயல்பான நவீனத் தமிழ் வழக்கு.
- source_word: אֶת שִׁמְאָם
  choice: சிமெயாம்
  rationale: இவ்வசனத்தின் மெய்யெழுத்து வடிவத்தின்படி பெயர் எழுத்துப்பெயர்க்கப்பட்டது; இணையான வம்சவரிசைகளுடன் ஒத்திசைக்கப்படும் ‘சிமெயா’ என்ற வடிவம் மூலப்பாடத்தில் நேரடியாக இல்லை.
- source_word: וְאַף הֵם
  choice: அவர்களும்
  rationale: וְאַף என்பதன் சேர்க்கை/வலியுறுத்தல் நுணுக்கத்தைத் தமிழின் ‘-உம்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: נֶגֶד
  choice: எதிரே
  rationale: இடஞ்சார்ந்த ‘எதிரில்/எதிரே’ என்ற அடிப்படை நுணுக்கத்தைப் பாதுகாக்கிறது; ‘அருகே’ என்று பொருளைத் தீர்மானித்து விடவில்லை.
- source_word: אֲחֵיהֶם
  choice: தங்கள் சகோதரர்கள்
  rationale: எபிரெயத்தின் நேரடியான ‘அவர்களுடைய சகோதரர்கள்’ என்பதைக் குறிக்கிறது. வம்ச/குலச் சூழலில் உறவினர்களைக் குறிக்கக்கூடிய போதிலும், மூலத்தின் பாலின மற்றும் உறவுச் சொல்லைத் தக்கவைக்கிறது.
- source_word: יָשְׁבוּ
  choice: குடியிருந்தார்கள்
  rationale: இங்கு ישב நிலையான வசிப்பைக் குறிக்கிறது; ‘குடியிருந்தார்கள்’ நவீனத் தமிழில் இயல்பாகவும் சூழலுக்கு ஏற்றவாறும் உள்ளது.
- source_word: בִירוּשָׁלִַם
  choice: எருசலேமில்
  rationale: இடப்பெயரின் வழக்கமான தமிழ் வடிவத்துடன் ‘இல்’ வேற்றுமை உருபு சேர்க்கப்பட்டது.
- source_word: עִם אֲחֵיהֶם
  choice: தங்கள் சகோதரர்களுடன்
  rationale: עִם குறிக்கும் உடனிருப்பை நேரடியாக வெளிப்படுத்துகிறது; எபிரெயத்தில் மீண்டும் வரும் ‘சகோதரர்கள்’ என்பதும் நீக்கப்படாமல் தக்கவைக்கப்பட்டது.
