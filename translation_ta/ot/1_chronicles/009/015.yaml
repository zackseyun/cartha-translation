revisions:
- from: பக்பக்கார், ஏரேஷ், காலால், மேலும் ஆசாப்பின் மகன் சிக்ரியின் மகன் மீகாவின் மகன் மத்தனியா.[a]
  to: பக்பக்கார், ஹேரேஷ், கலால், ஆசாப்பின் மகனான சிக்ரியின் மகனான மீகாவின் மகன்[a] மத்தனியா.
  rationale: The revision preserves the Hebrew list and its genealogy without adding interpretation. It corrects the two less faithful name forms, removes the nonessential connective, and makes each filial relationship explicit in natural modern Tamil. The footnote is retained, corrected, and anchored to “மகன்.”
