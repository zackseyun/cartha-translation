base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/015.yaml
  text: and Bakbakkar[a], Heresh, and Galal, and Mattaniah son of Mica, son of Zichri[b], son of Asaph.
translation:
  language: ta
  text: பக்பக்கார், ஹேரேஷ், கலால், ஆசாப்பின் மகனான சிக்ரியின் மகனான மீகாவின் மகன்[a] மத்தனியா.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: வம்சவரிசைகளில் “மகன்” என்பதற்கான எபிரேயச் சொல் சில நேரங்களில் தொலைவான வழித்தோன்றலையும் குறிக்கலாம்; இங்கு அது நேரடியாக “மகன்” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַקְבַּקַּר
  choice: பக்பக்கார்
  rationale: முந்தைய வசனத்திலிருந்து தொடரும் பெயர்ப்பட்டியலில் வரும் இணைப்பிடைச்சொல் தமிழில் இயல்பான பட்டியல் நடைக்காக வெளிப்படையாக மொழிபெயர்க்கப்படவில்லை; பெயர் எபிரெய ஒலிவடிவத்திற்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டது.
- source_word: חֶרֶשׁ
  choice: ஏரேஷ்
  rationale: எபிரெயப் பெயரின் தொடக்க ח ஒலியைத் தமிழில் இயல்பாகக் காட்டி, இறுதி ש ஒலியை ‘ஷ்’ என ஒலிபெயர்க்கிறது.
- source_word: וְ/גָלָל
  choice: காலால்
  rationale: பெயர் எபிரெய ஒலிவடிவத்திற்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டது; பட்டியலில் இடைப்பட்ட ו தமிழின் இயல்பான காற்புள்ளித் தொடரால் உணர்த்தப்படுகிறது.
- source_word: וּ/מַתַּנְיָה
  choice: மேலும் … மத்தனியா
  rationale: பட்டியலின் இறுதி உறுப்பைத் தெளிவாக இணைக்க ו என்பதற்கு ‘மேலும்’ பயன்படுத்தப்பட்டது; பெயர் மத்தனியா என ஒலிபெயர்க்கப்பட்டது.
- source_word: בֶּן
  choice: மகன்
  rationale: வம்சவரிசையில் בֶּן என்பதன் நேரடியான பொருள் ‘மகன்’; எபிரெயத்தில் இது சில வேளைகளில் தொலைவான வழித்தோன்றலையும் குறிக்கக்கூடும் என்பதால் குறிப்பு சேர்க்கப்பட்டது.
- source_word: מִיכָא
  choice: மீகா
  rationale: இவ்விடத்திலுள்ள மִיכָא என்ற குறிப்பிட்ட எபிரெய வடிவத்தைத் தமிழில் ‘மீகா’ என ஒலிபெயர்க்கிறது.
- source_word: זִכְרִי
  choice: சிக்ரி
  rationale: எபிரெயப் பெயரின் மெய்யொலி வரிசையைத் தமிழில் வாசிக்கத்தக்க வகையில் ஒலிபெயர்க்கிறது.
- source_word: אָסָף
  choice: ஆசாப்
  rationale: எபிரெயப் பெயரின் ஒலிவடிவத்தைத் தமிழில் மரியாதையான, பரிச்சயமான வேதாகமப் பெயர்நடையில் தருகிறது.
