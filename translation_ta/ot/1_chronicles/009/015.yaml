translation_notes:
  register: நவீன தரத் தமிழில், சுருக்கமான வம்சப்பட்டியல் நடையுடன் மொழிபெயர்க்கப்பட்டது. எபிரெயத்தில் முன்னோர் முதல் சந்ததி நோக்கி வரும் தொடரைத் தமிழில் தெளிவாக வாசிக்க ஆசாப் முதல் மத்தனியா வரையிலான உறவுமுறை வரிசையாக அமைக்கப்பட்டது; எந்த உறவையும் சேர்க்கவோ நீக்கவோ இல்லை.
