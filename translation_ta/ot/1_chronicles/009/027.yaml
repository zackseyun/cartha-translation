  text: וּ/סְבִיב֥וֹת בֵּית הָ/אֱלֹהִ֖ים יָלִ֑ינוּ כִּֽי עֲלֵי/הֶ֣ם מִשְׁמֶ֔רֶת וְ/הֵ֥ם עַל הַ/מַּפְתֵּ֖חַ וְ/לַ/בֹּ֥קֶר לַ/בֹּֽקֶר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/027.yaml
  text: They spent the night around the house of God[a], because the duty of guarding it was upon them, and they were in charge of opening it morning by morning.
translation:
  language: ta
  text: அவர்கள் கடவுளின் ஆலயத்தைச் சுற்றி இரவில் தங்கியிருந்தார்கள்; ஏனெனில் காவல் காக்கும் பொறுப்பு அவர்கள்மேல் இருந்தது. மேலும், ஒவ்வொரு காலையிலும் அதைத் திறக்கும் பொறுப்பு அவர்களிடம் இருந்தது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் நேரடியாக, “அவர்கள் சாவியின்மேல் இருந்தார்கள்.” எபிரெயச் சொற்றொடர் சாவியைப் பாதுகாக்கும் பொறுப்பையோ, கடவுளின் ஆலயத்தைத் திறக்கும் பொறுப்பையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּסְבִיבוֹת בֵּית הָאֱלֹהִים
  choice: கடவுளின் ஆலயத்தைச் சுற்றிலும்
  rationale: சுற்றியுள்ள பகுதியைக் குறிக்கும் எபிரெயச் சொல்லின் இடவியல் பொருளை இயல்பான தமிழில் தருகிறது. בֵּית הָאֱלֹהִים என்பதன் நேரடிப் பொருள் ‘கடவுளின் வீடு’ என்றாலும், இச்சூழலில் அது ஆலயத்தைக் குறிப்பதால் ‘கடவுளின் ஆலயம்’ என்பது சாதாரண வாசகர்களுக்கு தெளிவாக உள்ளது.
- source_word: יָלִינוּ
  choice: இரவில் தங்கியிருந்தார்கள்
  rationale: வினைச்சொல் இரவு முழுவதும் தங்குதல் அல்லது இரவைக் கழித்தல் என்பதைக் குறிக்கிறது; தூங்கினார்கள் என்று தேவையின்றி குறிப்பாக்காமல் காவல் சூழலையும் காக்கிறது.
- source_word: עֲלֵיהֶם מִשְׁמֶרֶת
  choice: அதைக் காவல்காக்கும் பொறுப்பு அவர்கள்மேல் இருந்தது
  rationale: ‘அவர்கள்மேல் காவல் இருந்தது’ என்ற எபிரெய மரபுத்தொடரின் ஒப்படைக்கப்பட்ட கடமை அல்லது பொறுப்பு என்ற பொருளைத் தெளிவாகவும், ‘அவர்கள்மேல்’ என்ற சுமத்தப்பட்ட பொறுப்பின் நிழலையும் காத்தும் தருகிறது.
- source_word: וְהֵם עַל הַמַּפְתֵּחַ
  choice: அதைத் திறக்கும் பொறுப்பு அவர்களிடம் இருந்தது
  rationale: சொல்லுக்கு நேரடியாக ‘அவர்கள் சாவியின்மேல் இருந்தார்கள்’ என்று பொருள் கொள்ளலாம்; ஆனால் தொடர்ந்து வரும் ‘ஒவ்வொரு காலையிலும்’ என்பது ஆலயத்தைத் திறக்கும் நாளாந்தப் பொறுப்பைக் குறிக்கிறது. மூலத்தின் மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וְלַבֹּקֶר לַבֹּקֶר
  choice: ஒவ்வொரு காலையிலும்
  rationale: மீளுரைப்பால் வெளிப்படும் தொடர்ச்சியான நாளாந்த நிகழ்வை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
