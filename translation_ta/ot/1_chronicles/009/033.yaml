source:
  edition: WLC
  text: וְ/אֵ֣לֶּה הַ֠/מְשֹׁרְרִים רָאשֵׁ֨י אָב֧וֹת לַ/לְוִיִּ֛ם בַּ/לְּשָׁכֹ֖ת פטירים כִּֽי יוֹמָ֥ם וָ/לַ֛יְלָה עֲלֵי/הֶ֖ם בַּ/מְּלָאכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/033.yaml
  text: These were the singers[a], heads of fathers’ houses of the Levites, in the chambers, free from other duties, for they were occupied in the work day and night.
translation:
  language: ta
  text: லேவியர்களின் தந்தைவழிக் குடும்பத் தலைவர்களான இந்தப் பாடகர்கள் அறைகளில் இருந்தனர்; அவர்கள் பிற பணிகளிலிருந்து விலக்கப்பட்டிருந்தனர்[a]. ஏனெனில், பகலும் இரவும் அந்தப் பணியைச் செய்யும் பொறுப்பு அவர்களுக்கிருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘விடுவிக்கப்பட்டிருந்தனர்’ என்றும் மொழிபெயர்க்கலாம். இங்குள்ள எபிரெயச் சொல் அரிதானது; தொடர்ந்து பாடல் பணி செய்ய வேண்டியிருந்ததால், அவர்கள் பிற பணிகளிலிருந்து விலக்கப்பட்டிருந்தனர் என்பதே இதன் சாத்தியமான பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְשֹׁרְרִים
  choice: பாடகர்கள்
  rationale: שׁיר வேரிலிருந்து வந்த இச்சொல் பாடுவதில் ஈடுபட்டவர்களை நேரடியாகக் குறிக்கிறது; ‘இசைக் கலைஞர்கள்’ என்பது மூலச்சொல்லைவிட விரிவானது.
- source_word: רָאשֵׁי אָבוֹת
  choice: தந்தைவழிக் குடும்பத் தலைவர்கள்
  rationale: நாளாகமத்தில் காணப்படும் வம்ச மற்றும் சமூக அமைப்பைத் தெளிவாகக் காட்டுகிறது; பொதுவான ‘குடும்பத் தலைவர்கள்’ என்பதைவிட மூலத்தின் தந்தைவழி அமைப்பைப் பாதுகாக்கிறது.
- source_word: לַלְוִיִּם
  choice: லேவியர்களின்
  rationale: இந்தக் குடும்பத் தலைவர்கள் லேவியர்களைச் சேர்ந்தவர்கள் என்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: בַּלְּשָׁכֹת
  choice: அறைகளில் தங்கியிருந்து
  rationale: לשכה என்பது பொதுவாக ஆலய வளாகத்திலுள்ள அறைகளைக் குறிக்கலாம். ‘ஆலய’ என்று மூலத்தில் இல்லாத சொல்லைச் சேர்க்காமல், சூழலுக்கேற்ற இயல்பான தமிழுக்காக இருப்பிடப் பொருள் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: פטירים
  choice: மற்ற பணிகளிலிருந்து விடுவிக்கப்பட்டிருந்தார்கள்
  rationale: அரிதான இவ்வடிவம் ‘விலக்கு அளிக்கப்பட்டவர்கள்’ அல்லது ‘விடுவிக்கப்பட்டவர்கள்’ என்று புரிந்துகொள்ளப்படுகிறது. எதிலிருந்து விடுவிக்கப்பட்டார்கள் என்பது மூலத்தில் வெளிப்படையாக இல்லாவிட்டாலும், தொடர்ச்சியான பாடல் பணி காரணமாக மற்ற லேவியப் பணிகளிலிருந்து விடுவிக்கப்பட்டனர் என்பதே சூழலின் இயல்பான பொருள்; அரிதான சொல்லின் ஐயம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: יוֹמָם וָלַיְלָה
  choice: பகலும் இரவும்
  rationale: தொடர்ச்சியான பொறுப்பைக் குறிக்கும் எபிரெய கால இணையை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: עֲלֵיהֶם
  choice: இவர்களுடைய பொறுப்பாக இருந்தது
  rationale: சொல்லுக்கு சொல் ‘அவர்கள்மேல் இருந்தது’ என்றாலும், இச்சூழலில் கடமை அல்லது பொறுப்பு என்ற எபிரெய மரபுத்தொடரின் பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: בַּמְּלָאכָה
  choice: இந்தப் பணியில்
  rationale: מלאכה என்பதன் பொதுவான ‘வேலை/பணி’ பொருளைப் பாதுகாக்கிறது; அது குறிப்பாகப் பாடல் பணி என்பதை வசனச் சூழல் உணர்த்துகிறது.
