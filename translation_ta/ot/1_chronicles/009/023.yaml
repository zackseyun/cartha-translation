source:
  edition: WLC
  text: וְ/הֵ֨ם וּ/בְנֵי/הֶ֜ם עַל הַ/שְּׁעָרִ֧ים לְ/בֵית יְהוָ֛ה לְ/בֵ֥ית הָ/אֹ֖הֶל לְ/מִשְׁמָרֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/023.yaml
  text: They and their sons were over the gates of the house of Yahweh[a], that is, the house of the tent, as guards.
translation:
  language: ta
  text: அவர்களும் அவர்களுடைய மகன்களும் யாவேயின் இல்லத்தின், அதாவது கூடாரத்தின் இல்லத்தின், வாயில்களைக் காவல்காக்கும் பணியில் இருந்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “கூடாரத்தின் இல்லம்.” இதை “திருக்கூடாரத்தின் இல்லம்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵם
  choice: அவர்களும்
  rationale: இணைப்பிடைச்சொல்லுடன் வரும் சுட்டுப்பெயரின் தொடர்ச்சியையும், முந்தைய வசனத்தோடு உள்ள தொடர்பையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: וּבְנֵיהֶם
  choice: அவர்களுடைய மகன்களும்
  rationale: மரபுவழிக் காவல் பணியில் இருந்த ஆண் சந்ததியினரை בנים இங்கு குறிப்பதால், பொதுவான ‘பிள்ளைகள்’ என்பதற்குப் பதிலாக ‘மகன்கள்’ துல்லியமானது.
- source_word: עַל הַשְּׁעָרִים
  choice: வாயில்களை ... பொறுப்பில் இருந்தார்கள்
  rationale: עַל இங்கு வெறும் இருப்பிடத்தைக் காட்டாமல் மேற்பார்வை அல்லது பொறுப்பைக் குறிக்கிறது; நவீன தமிழில் அதன் நிர்வாகப் பொருளைத் தெளிவாக்குகிறது.
- source_word: לְבֵית יְהוָה
  choice: யெகோவாவின் ஆலயத்தின்
  rationale: வாயில்கள் யெகோவாவின் பரிசுத்த இல்லத்திற்குரியவை என்பதை இயல்பான தமிழில் காட்டுகிறது; בית என்பதன் சூழல்சார் பொருள் ‘ஆலயம்’ என வழங்கப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தெய்வீகப் பெயரை ஒரு பொதுப் பட்டமாக மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட பெயருருவில் வழங்குகிறது.
- source_word: לְבֵית הָאֹהֶל
  choice: கூடார இல்லம்
  rationale: எபிரெயத்தின் ‘கூடாரத்தின் இல்லம்’ என்ற அபூர்வமான சொற்றொடரை முற்றிலும் ‘திருக்கூடாரம்’ என்று விளக்கிவிடாமல், அதன் இரு கூறுகளையும் தமிழில் தக்கவைக்கிறது.
- source_word: לְמִשְׁמָרוֹת
  choice: காவல்காக்கும்
  rationale: காவல் பணி அல்லது காவல் பொறுப்பைச் சுட்டும் பெயர்ச்சொல்லை தெளிவான தமிழ்ச் செயற்பாட்டு வடிவில் வழங்குகிறது.
theological_decisions:
- issue: ‘யெகோவாவின் ஆலயம்’ மற்றும் ‘கூடார இல்லம்’ ஆகியவற்றின் தொடர்பு
  choice: இரண்டாவது சொற்றொடரை ‘அதாவது’ என முதல் சொற்றொடருக்கான விளக்கப் பெயராக வழங்கி, இரு வெளிப்பாடுகளையும் தக்கவைத்தல்
  alternative: இதை நேரடியாக ‘திருக்கூடாரம்’ என்று மட்டும் மொழிபெயர்த்தல், அல்லது இரு வேறு இடங்களாக எடுத்துக்கொள்ளுதல்
  rationale: மூலத்தில் இரண்டு சொற்றொடர்களும் அடுத்தடுத்து வருகின்றன. அவற்றை ஒன்றாகச் சுருக்காமலும் இரு தனி இடங்களாகப் பிரிக்காமலும் வழங்குவது, ஆலயத்திற்கும் முந்தைய கூடாரப் பரிசுத்த இடத்திற்கும் இடையிலான தொடர்பையும் உரையின் பதற்றத்தையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குத் தெளிவான, கண்ணியமான நடை. ‘கூடார இல்லம்’ என்ற சற்றே அபூர்வமான வடிவம் மூலத்தின் தனித்துவத்தையும் பொருள் நிச்சயமின்மையையும் பாதுகாக்க நோக்கத்துடன் வைக்கப்பட்டுள்ளது.
