revisions:
- from: அவர்களும் அவர்களுடைய மகன்களும் யெகோவாவின் ஆலயத்தின் வாயில்களை—அதாவது, கூடார இல்லத்தின் வாயில்களை—காவல்காக்கும் பொறுப்பில் இருந்தார்கள்.[a]
  to: அவர்களும் அவர்களுடைய மகன்களும் யாவேயின் இல்லத்தின், அதாவது கூடாரத்தின் இல்லத்தின், வாயில்களைக் காவல்காக்கும் பணியில் இருந்தார்கள்.[a]
