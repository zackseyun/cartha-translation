  text: In Gibeon lived Jeiel the father of Gibeon[b][a], and his wife's name was Maacah.
translation:
  language: ta
  text: கிபியோனில் கிபியோனின் தந்தையாகிய[a] யெயியேல்[b] குடியிருந்தார்; அவருடைய மனைவியின் பெயர் மாக்காள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கிபியோனை நிறுவியவர்’ அல்லது ‘கிபியோனின் தலைவர்’; எபிரெயத்தில் நேரடியாக, ‘கிபியோனின் தந்தை.’
    reason: lexical_alternative
  - marker: b
    text: இப்பெயரின் எபிரெய மெய்யெழுத்து வடிவத்தை ‘யெயூவேல்’ என்றும் ஒலிபெயர்க்கலாம்; 1 நாளாகமம் 8:29-இல் உள்ள இணையான பகுதியை ஒப்பிடுக.
    reason: textual_variant
lexical_decisions:
- source_word: וּ/בְ/גִבְע֛וֹן
  choice: கிபியோனில்
  rationale: இடத்தைக் குறிக்கும் בְּ முன்னொட்டை இயல்பான தமிழில் ‘கிபியோனில்’ என வழங்குகிறது. தொடக்க וּ இணைப்பைத் தனியே மொழிபெயர்க்காமல் இருப்பது தமிழில் இயல்பாக உள்ளது.
- source_word: יָשְׁב֥וּ
  choice: குடியிருந்தார்
  rationale: ישב இங்கு குடியிருத்தல் அல்லது வசித்தலைக் குறிக்கிறது. எபிரெய வடிவம் பன்மையாக இருந்தாலும், பெயரிடப்பட்ட ஒருவரை அறிமுகப்படுத்தும் வம்சவரலாற்றுச் சூத்திரத்தின் பொருளுக்கேற்ப தமிழில் மரியாதை ஒருமை பயன்படுத்தப்பட்டுள்ளது.
- source_word: אֲבִֽי גִבְע֖וֹן
  choice: கிபியோனின் தந்தையாகிய
  rationale: எபிரெயச் சொற்றொடரின் நேரடிப் பொருளான ‘கிபியோனின் தந்தை’ பாதுகாக்கப்படுகிறது; நகரத்தின் நிறுவனர் அல்லது தலைவர் என்ற சூழல்சார் சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: יעואל
  choice: எயியேல்
  rationale: இணையான 1 நாளாகமம் 8:29 மற்றும் வாசிப்பு மரபு ஆதரிக்கும் பெயர்வடிவத்தைத் தமிழில் ஒலிபெயர்க்கிறது; மெய்யெழுத்து வடிவத்திலிருந்து பெறக்கூடிய மாற்று வடிவம் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: וְ/שֵׁ֥ם אִשְׁתּ֖/וֹ
  choice: அவருடைய மனைவியின் பெயர்
  rationale: உடைமை உறவைத் தெளிவாகவும் இயல்பான நவீன தமிழிலும் வெளிப்படுத்துகிறது.
- source_word: מַעֲכָֽה
  choice: மாக்காள்
  rationale: மַעֲכָה என்ற பெண்பெயரின் எபிரெய ஒலியமைப்பை அணுகும் தமிழ் ஒலிபெயர்ப்பு.
