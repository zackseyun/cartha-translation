base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/042.yaml
  text: Ahaz fathered Jarah[a], and Jarah fathered Alemeth, Azmaveth, and Zimri; and Zimri fathered Moza.
translation:
  language: ta
  text: ஆகாஸ் யாராவைப்[a] பெற்றான். யாரா அலேமேத், அஸ்மாவேத், சிம்ரி ஆகியோரைப் பெற்றான்; சிம்ரி மோசாவைப் பெற்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 1 நாளாகமம் 8:36-இல் உள்ள இணையான வம்சப் பட்டியலில் ‘யாரா’ என்பதற்குப் பதிலாக ‘யெகோயாதா’ என்று உள்ளது. இங்கு நாளாகமத்தின் கையெழுத்துப் பிரதிகள் ‘யாரா’ என்றே வாசிப்பதால், அதுவே முதன்மைப் பாடத்தில் வைக்கப்பட்டுள்ளது.
    reason: textual_variant
lexical_decisions:
- source_word: הוֹלִיד
  choice: பெற்றான்
  rationale: வம்சப் பட்டியல் சூழலில் இந்த வினை ஆண் ஒருவன் பிள்ளைக்குத் தந்தையானதைக் குறிக்கிறது. ‘பெற்றான்’ என்பது தமிழில் இயல்பாகவும் சுருக்கமாகவும் வம்சத் தொடரை வெளிப்படுத்துகிறது.
- source_word: יַעְרָה
  choice: யாரா
  rationale: எபிரெய மெய்யெழுத்து வடிவத்தை அடிப்படையாகக் கொண்டு தனிப்பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: עָלֶמֶת
  choice: அலேமேத்
  rationale: தனிப்பெயர் எபிரெய உச்சரிப்புக்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: עַזְמָוֶת
  choice: அஸ்மாவேத்
  rationale: தனிப்பெயர் எபிரெய வடிவுக்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: זִמְרִי
  choice: சிம்ரி
  rationale: தனிப்பெயர் எபிரெய ஒலியைத் தமிழில் இயல்பாகக் காட்டும் வகையில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: מוֹצָא
  choice: மோசா
  rationale: தனிப்பெயர் எபிரெய வடிவுக்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְ
  choice: மற்றும் / வாக்கியத் தொடர்ச்சி
  rationale: எபிரெய இணைப்புச்சொல் வம்சத் தொடரை இணைக்கிறது; தமிழின் இயல்புக்கேற்ப பட்டியலில் காற்புள்ளிகளாலும், தொடரில் தனி வாக்கியம் மற்றும் அரைப்புள்ளியாலும் அதன் பணி வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: אֶת
  choice: தனி சொல்லாக மொழிபெயர்க்கப்படவில்லை
  rationale: இது எபிரெய நேரடிச் செயப்படுபொருள் குறியீடு. தமிழில் ‘-ஐ’ வேற்றுமை உருபாலும் வாக்கிய அமைப்பாலும் அதன் இலக்கணப் பணி வெளிப்படுகிறது.
