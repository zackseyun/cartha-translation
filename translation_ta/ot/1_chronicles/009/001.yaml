source:
  edition: WLC
  text: וְ/כָל יִשְׂרָאֵל֙ הִתְיַחְשׂ֔וּ וְ/הִנָּ֣/ם כְּתוּבִ֔ים עַל סֵ֖פֶר מַלְכֵ֣י יִשְׂרָאֵ֑ל וִ/יהוּדָ֛ה הָגְל֥וּ לְ/בָבֶ֖ל בְּ/מַעֲלָֽ/ם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/001.yaml
  text: So all Israel was enrolled by genealogy[a], and behold, they are written in the Book of the Kings of Israel[b]; and Judah was taken into exile to Babylon because of their unfaithfulness.
translation:
  language: ta
  text: இஸ்ரவேலர் அனைவரும் வம்சாவளிப்படி பதிவு செய்யப்பட்டார்கள்[a]; இதோ, அவர்கள் இஸ்ரவேல் அரசர்களின் நூலில் எழுதப்பட்டிருக்கிறார்கள். யூதா மக்கள் தங்கள் துரோகத்தினால் பாபிலோனுக்கு நாடுகடத்தப்பட்டார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வம்சாவளிகளின்படி கணக்கிடப்பட்டார்கள்” அல்லது “வம்சாவளிப்படி பெயர்ப் பட்டியலில் சேர்க்கப்பட்டார்கள்.”
    reason: lexical_alternative
  - marker: b
    text: “துரோகம்” என்பதற்கு “உண்மையின்மை,” “மீறுதல்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் நம்பிக்கையை மீறுதல் அல்லது உடன்படிக்கை உறவில் துரோகம் செய்தல் என்ற பொருளைக் கொண்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְיַחְשׂוּ
  choice: வம்சாவளிப்படி பதிவு செய்யப்பட்டார்கள்
  rationale: இந்த வினைச்சொல் வெறுமனே எண்ணப்படுவதைக் குறிக்காமல், ஒருவரின் குலவழியை உறுதிப்படுத்தி வம்சாவளிப் பதிவில் சேர்ப்பதைக் குறிக்கிறது.
- source_word: וְהִנָּם
  choice: இதோ
  rationale: அடுத்து சொல்லப்படுவதன் மீது கவனத்தை ஈர்க்கும் எபிரெய வழங்குமுறையை இயல்பான, கண்ணியமான தமிழில் தக்கவைக்கிறது.
- source_word: כְּתוּבִים
  choice: எழுதப்பட்டிருக்கிறார்கள்
  rationale: எபிரெயப் பெயரெச்சத்தின் நிலைசார் பொருளை, அவர்கள் அந்த நூலில் பதிவாகியிருக்கும் தற்போதைய நிலையென வெளிப்படுத்துகிறது.
- source_word: עַל סֵפֶר מַלְכֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் அரசர்களின் வரலாற்று நூலில்
  rationale: சொல்லுக்குச் சொல் 'நூலின்மேல்' என்பதற்குப் பதிலாக ஆவணச் சூழலுக்கேற்ற 'நூலில்' பயன்படுத்தப்படுகிறது; 'வரலாற்று நூல்' என்பது இது ஓர் அதிகாரப்பூர்வ அரசர் பதிவைக் குறிக்கிறது என்பதை இயல்பாகத் தெரிவிக்கிறது.
- source_word: וִיהוּדָה
  choice: யூதா மக்கள்
  rationale: இங்கே 'யூதா' என்பது ஒரு தனிநபரை அல்ல, தென் அரசின் மக்களைக் குறிக்கும் கூட்டுப் பெயர்; தமிழில் வினைத் தொடர்பைத் தெளிவாக்க 'மக்கள்' சேர்க்கப்படுகிறது.
- source_word: הָגְלוּ לְבָבֶל
  choice: பாபிலோனுக்குச் சிறைபிடித்துக் கொண்டுபோகப்பட்டார்கள்
  rationale: ஹொஃபால் வினைவடிவத்தின் செயப்பாட்டு, கட்டாய நாடுகடத்தல் பொருளைத் தெளிவாகக் காட்டுகிறது; அவர்கள் தாமாகச் சென்றார்கள் என்ற எண்ணத்தைத் தவிர்க்கிறது.
- source_word: בְּמַעֲלָם
  choice: தங்கள் நம்பிக்கைத் துரோகத்தினால்
  rationale: மַעַל என்பது பொதுவான தவறு மட்டுமல்லாமல், நம்பிக்கையை மீறுதல் அல்லது உடன்படிக்கை உறவில் துரோகம் செய்தல் என்ற வலுவான பொருளையும் கொண்டுள்ளது.
theological_decisions:
- issue: בְּמַעֲלָם குறிக்கும் யூதாவின் குற்றத்தின் இயல்பு
  choice: நம்பிக்கைத் துரோகம்
  alternative: மீறுதல்; குற்றம்; உண்மையின்மை
  rationale: மூலச்சொல்லில் உள்ள உறவுசார் அல்லது உடன்படிக்கைசார் நம்பிக்கை மீறலை 'நம்பிக்கைத் துரோகம்' தக்கவைக்கிறது; அதேவேளையில் யாருடைய நம்பிக்கைக்கு எதிரானது என்று மூலத்தில் இல்லாத விளக்கத்தைச் சேர்க்கவில்லை.
- issue: הָגְלוּ என்பதன் வினைக்குரல்
  choice: செயப்பாட்டில் கட்டாயமாகச் சிறைபிடித்துக் கொண்டுபோகப்படுதல்
  alternative: சிறையிருப்புக்குச் சென்றார்கள்
  rationale: ஹொஃபால் வடிவம் யூதா நாடுகடத்தலை அனுபவித்ததைக் காட்டுகிறது; தாமாகப் புறப்பட்டுச் சென்றதாகப் பொருள் மென்மையாக்கப்படுவதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. 'இதோ' மூலத்தின் கவன ஈர்ப்பைத் தக்கவைக்கிறது. கூட்டுப் பெயரான 'யூதா' தமிழில் தெளிவாக இருக்க 'யூதா மக்கள்' என விரிக்கப்பட்டுள்ளது. ஆங்கில ஆலோசனை உரையில் முதல் அடிக்குறி தவறாக இறுதி சொல்லியல் குறிப்புடன் இணைந்திருந்ததால், அடிக்குறி [b] உண்மையில் விளக்கும் בְּמַעֲלָם என்பதற்குரிய தமிழ் சொல்லுக்குப் பின்னர் வைக்கப்பட்டுள்ளது.
