translation_notes:
  register: நவீன, மரியாதைமிக்க, பொதுவாசகர்களுக்குத் தெளிவான தமிழ் பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் வம்சத் தொடர்புகள் தெளிவாகத் தெரிய அரைப்புள்ளிகளாகப் பிரிக்கப்பட்டுள்ளன; உரைச்சிக்கல் தீர்மானமாக மறைக்கப்படாமல் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
