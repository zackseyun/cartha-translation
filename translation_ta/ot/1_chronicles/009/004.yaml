revisions:
- from: ஊத்தாய், அம்மியூத்தின் மகன்; அம்மியூத் ஒம்ரியின் மகன்; ஒம்ரி இம்ரியின் மகன்; இம்ரி பானியின்[a] மகன். பானி, யூதாவின் மகனான பாரேசின் வழித்தோன்றல்களில் ஒருவர்.
  to: ஊத்தாய் அம்மியூத்தின் மகன்; அம்மியூத் ஒம்ரியின் மகன்; ஒம்ரி இம்ரியின் மகன்; இம்ரி பானியின் மகன்; பானி யூதாவின் மகனான பாரேசின் சந்ததியைச் சேர்ந்தவர்.[a]
  rationale: The revision preserves the complete name-by-name ancestry line and connects Bani directly with the Perez-from-Judah clan designation. The footnote now states the alternate reading without changing the order of names or relocating the affiliation.
  reviewer_model: gpt-5.6-terra
