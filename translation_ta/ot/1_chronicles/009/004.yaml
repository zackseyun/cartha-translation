source:
  edition: WLC
  text: עוּתַ֨י בֶּן עַמִּיה֤וּד בֶּן עָמְרִי֙ בֶּן אִמְרִ֣י בֶן בני/מן בְּנֵי פֶ֖רֶץ בֶּן יְהוּדָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/004.yaml
  text: Uthai son of Ammihud[a], son of Omri, son of Imri, son of Bani, from the sons of Perez son of Judah.
translation:
  language: ta
  text: ஊத்தாய் அம்மியூத்தின் மகன்; அம்மியூத் ஒம்ரியின் மகன்; ஒம்ரி இம்ரியின் மகன்; இம்ரி பானியின் மகன்; பானி யூதாவின் மகனான பாரேசின் சந்ததியைச் சேர்ந்தவர்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்குள்ள எபிரெய மூலபாட மரபு சிக்கலானது. ‘பானி’ என்று வழங்கப்பட்ட சொல்லை ‘இருந்து’ என்றும் வாசிக்கலாம். அப்படியானால், ‘இம்ரி யூதாவின் மகனான பாரேசின் சந்ததியைச் சேர்ந்தவர்’ என்ற பொருள் கிடைக்கும். பெயர்களின் தொடருக்கு நன்கு பொருந்துவதால் முதன்மைப் பாடம் இதை ‘பானி’ என்ற தனிப்பெயராக வாசிக்கிறது.
    reason: textual_variant
lexical_decisions:
- source_word: עוּתַי
  choice: ஊத்தாய்
  rationale: எபிரெய தனிப்பெயரின் ஒலிப்பைத் தமிழில் இயல்பாக எழுத்துப்பெயர்த்துள்ளது.
- source_word: בֶּן
  choice: மகன்
  rationale: வம்சப்பட்டியல் சூழலில் இதன் நேரடியான பொருள் ‘மகன்’; தலைமுறைகள் சுருக்கப்பட்டிருக்கக்கூடிய வாய்ப்பை இந்தச் சொல் மறுப்பதில்லை.
- source_word: עַמִּיהוּד
  choice: அம்மியூத்
  rationale: எபிரெய தனிப்பெயரின் மரபான தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: עָמְרִי
  choice: ஒம்ரி
  rationale: தனிப்பெயரை அதன் எபிரெய ஒலிப்புக்கு நெருக்கமாக எழுத்துப்பெயர்த்துள்ளது.
- source_word: אִמְרִי
  choice: இம்ரி
  rationale: தனிப்பெயரை அதன் எபிரெய ஒலிப்புக்கு நெருக்கமாக எழுத்துப்பெயர்த்துள்ளது.
- source_word: בני/מן
  choice: பானி
  rationale: சொல் வடிவம் சிக்கலானதாக இருந்தாலும், தொடர்ந்து வரும் வம்சப்பெயர்களின் அமைப்புக்கு ஏற்ற தனிப்பெயர் வாசிப்பை முதன்மைப் பாடம் பின்பற்றுகிறது; மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בְּנֵי
  choice: வழித்தோன்றல்கள்
  rationale: குலம் அல்லது வம்சத்தைக் குறிக்கும் பன்மை அமைப்பில், நவீன தமிழில் இயல்பாகவும் பொருள் தெளிவாகவும் அமையும் மொழிபெயர்ப்பு.
- source_word: פֶרֶץ
  choice: பாரேஸ்
  rationale: வேதாகமத் தமிழில் அறியப்பட்ட தனிப்பெயர் வடிவம்.
- source_word: יְהוּדָה
  choice: யூதா
  rationale: தனிப்பெயர் மற்றும் கோத்திரப்பெயராகப் பயன்படும் எபிரெயப் பெயரின் மரபான தமிழ் வடிவம்.
