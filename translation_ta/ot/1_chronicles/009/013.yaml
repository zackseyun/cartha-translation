  text: וַ/אֲחֵי/הֶ֗ם רָאשִׁים֙ לְ/בֵ֣ית אֲבוֹתָ֔/ם אֶ֕לֶף וּ/שְׁבַ֥ע מֵא֖וֹת וְ/שִׁשִּׁ֑ים גִּבּ֣וֹרֵי חֵ֔יל מְלֶ֖אכֶת עֲבוֹדַ֥ת בֵּית הָ/אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/013.yaml
  text: And their brothers[a], heads of their fathers’ houses[c][b], were 1,760 mighty men of valor for the work of the service of the house of God.
translation:
  language: ta
  text: அவர்களுடைய சகோதரர்களாகிய தந்தைவழிக் குடும்பத் தலைவர்கள் 1,760 பேர்; அவர்கள் தேவனுடைய வீட்டின் சேவைப் பணிக்காகத் திறனும் வலிமையும் வாய்ந்தவர்கள்.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உறவினர்கள்’ அல்லது ‘குலத்தார்.’ எபிரெயத்தில் ‘சகோதரர்கள்’ என்பது உடன்பிறந்தவர்களை மட்டுமல்லாமல் விரிவான குல உறவினரையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘வீரமிக்கவர்கள்’ அல்லது ‘திறமைவாய்ந்தவர்கள்.’ இத்தொடர் வலிமையையோ நிரூபிக்கப்பட்ட திறனையோ குறிக்கலாம்; இங்கு கட்டாயமாகப் போர்த் திறனைக் குறிக்காது.
    reason: lexical_alternative
  - marker: c
    text: அதாவது, தேவனுடைய ஆலயத்தில்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: அவர்களுடைய சகோதரர்கள்
  rationale: எபிரெயச் சொல்லின் நேரடியான உறவுமுறைச் சொல்லைத் தக்கவைக்கிறது. இங்கு அது உடன்பிறந்தவர்களை மட்டும் அல்லாமல் ஒரே குலத்தைச் சேர்ந்த ஆண் உறவினர்களையும் குறிக்கக்கூடும் என்பதால் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: רָאשִׁים לְבֵית אֲבוֹתָם
  choice: தந்தைவழிக் குடும்பத் தலைவர்கள்
  rationale: ரָאשִׁים என்பதன் ‘தலைவர்கள்’ என்ற பொருளையும், בֵּית אָבוֹת என்ற வம்சாவளி மற்றும் நிர்வாக மரபுத்தொடரின் தந்தைவழிக் குடும்பக் கருத்தையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֶלֶף וּשְׁבַע מֵאוֹת וְשִׁשִּׁים
  choice: 1,760 பேர்
  rationale: எபிரெய எண்ணிக்கையின் மொத்தத்தைத் தமிழில் வழக்கமான எண் வடிவில் தெளிவாகக் கொடுக்கிறது; மனிதர்களைக் குறிக்கும் ‘பேர்’ சேர்க்கப்பட்டுள்ளது.
- source_word: גִּבּוֹרֵי חַיִל
  choice: திறனும் வலிமையும் வாய்ந்தவர்கள்
  rationale: இந்த மரியாதைத் தொடர் வலிமை, திறன், தகுதி ஆகிய பொருட்களைத் தாங்குகிறது. சூழல் போரைக் குறிக்காமல் ஆலயப் பணிவிடையைக் குறிப்பதால் ‘வீரர்கள்’ என்று இராணுவப் பொருளுக்குள் சுருக்கப்படவில்லை.
- source_word: מְלֶאכֶת עֲבוֹדַת
  choice: பணிவிடைப் பணி
  rationale: מְלָאכָה என்பதிலுள்ள பணி/வேலைக் கருத்தையும் עֲבוֹדָה என்பதிலுள்ள சேவை அல்லது பணிவிடைக் கருத்தையும் ஒருங்கே தக்கவைக்கிறது; தமிழில் தேவையற்ற கடினத் திரும்புரையைத் தவிர்க்கிறது.
- source_word: בֵּית הָאֱלֹהִים
  choice: தேவனுடைய வீடு
  rationale: ‘தேவனுடைய வீடு’ என்ற எபிரெய உருவகத்தை நேரடியாகத் தக்கவைக்கிறது; இச்சூழலில் அது ஆலயத்தைக் குறிக்கும் விளக்கம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
theological_decisions:
- issue: ஆண் பன்மையில் வரும் உறவுமுறைச் சொல்லின் மொழிபெயர்ப்பு
  choice: சகோதரர்கள்
  alternative: உறவினர்கள் / குலத்தார்
  rationale: வம்சாவளி மற்றும் ஆசாரியப் பணிச் சூழலில் மூலத்தில் உள்ள ஆண்பால் குடும்பச் சொல்லை மறைக்காமல் தக்கவைக்கிறது; அதேவேளை அதன் விரிவான குல உறவுப் பொருளை அடிக்குறிப்பு தெரிவிக்கிறது.
- issue: ஆலயத்தைக் குறிக்கும் சொல்லாட்சி
  choice: தேவனுடைய வீடு
  alternative: தேவனுடைய ஆலயம்
  rationale: மூலத்தின் ‘வீடு’ என்ற சொல்லையும் அதன் இறையியல் ஒலிநயத்தையும் தக்கவைத்து, குறிப்பிட்ட கட்டடம் ஆலயம் என்பதை அடிக்குறிப்பில் தெளிவுபடுத்துகிறது.
- issue: גִּבּוֹרֵי חַיִל என்பதன் இராணுவமல்லாத சூழல்
  choice: திறனும் வலிமையும் வாய்ந்தவர்கள்
  alternative: வீரமிக்கவர்கள் / வல்லமையுள்ள வீரர்கள்
  rationale: ஆலயப் பணிவிடைச் சூழலில் இத்தொடரைப் போர்வீரர் என்ற பொருளுக்கு மட்டும் கட்டுப்படுத்தாமல், வலிமை மற்றும் நிரூபிக்கப்பட்ட திறன் ஆகிய இரு சாத்தியங்களையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்கு விளங்கும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘தந்தைவழிக் குடும்பம்,’ ‘பணிவிடைப் பணி’ ஆகியவை வம்சாவளி-ஆலய நிர்வாகச் சூழலைத் துல்லியமாகக் காட்டுகின்றன. இரண்டு வாக்கியங்களாகப் பிரித்தது எபிரெயத் தகவல் அமைப்பை இழக்காமல் தமிழில் வாசிப்பை இயல்பாக்குகிறது.
