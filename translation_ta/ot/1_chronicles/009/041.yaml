  text: וּ/בְנֵ֖י מִיכָ֑ה פִּית֥וֹן וָ/מֶ֖לֶךְ וְ/תַחְרֵֽעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/041.yaml
  text: 'And the sons of Micah: Pithon, Melech, and Tahrea.'
translation:
  language: ta
  text: 'மீகாவின் மகன்கள்: பித்தோன், மெலெக், தஹ்ரேயா.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: மகன்கள்
  rationale: בן என்பதன் பன்மை இணைப்பு வடிவம் வம்சவரிசைச் சூத்திரமாக வருகிறது. எபிரெய முன்னொட்டு וְ முந்தைய வம்சவரிசையுடன் இணைக்கிறது; தனி வசனமாக இயல்பான நவீனத் தமிழில் அதை வெளிப்படையாக மொழிபெயர்க்காமல் பட்டியல் அமைப்பின் தொடர்ச்சியில் உணர்த்தப்படுகிறது.
- source_word: מִיכָה
  choice: மீகா
  rationale: எபிரெய தனிப்பட்ட பெயரின் தமிழ் ஒலிபெயர்ப்பு.
- source_word: פִּיתוֹן
  choice: பித்தோன்
  rationale: எபிரெய தனிப்பட்ட பெயரை அதன் மெய்யொலி மற்றும் நீள்வொலிக்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: וָמֶלֶךְ
  choice: மெலேக்கு
  rationale: இங்கு מֶלֶךְ என்பது பொதுப்பெயரான ‘ராஜா’ அல்ல, தனிப்பட்ட பெயர்; ஆகவே பொருள்மொழிபெயர்ப்பு செய்யாமல் தமிழின் இயல்பான இறுதி உயிருடன் ஒலிபெயர்க்கப்படுகிறது.
- source_word: וְתַחְרֵעַ
  choice: தக்ரேயா
  rationale: எபிரெய தனிப்பட்ட பெயரின் ஒலிபெயர்ப்பு; இறுதி ע தனித்த தமிழ் மெய்யாகத் துல்லியமாகக் குறிக்க இயலாததால் இயல்பான உயிர்முடிவுடன் வழங்கப்படுகிறது.
theological_decisions: []
translation_notes:
  register: சுருக்கமான வம்சவரிசை நடையைப் பேணும் வகையில், நவீன நிலையான தமிழில் கண்ணியமாகவும் எளிதில் புரியுமாறும் பெயர்ப்பட்டியல் அமைக்கப்பட்டுள்ளது. பெயர்கள் மொழிபெயர்க்கப்படாமல் எபிரெயத்திலிருந்து ஒலிபெயர்க்கப்பட்டுள்ளன.
