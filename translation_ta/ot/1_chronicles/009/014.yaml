base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/014.yaml
  text: 'And from the Levites: Shemaiah son of Hasshub[a], son of Azrikam, son of Hashabiah, from the sons of Merari.'
translation:
  language: ta
  text: 'லேவியர்களிலிருந்து: ஹஷ்ஷூபின் மகனும், அஸ்ரிக்காமின் மகனும், ஹஷபியாவின் மகனுமான செமாயா, மெராரியின் மகன்களைச் சேர்ந்தவன்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “மெராரியின் மகன்களிலிருந்து.” இங்கு “மகன்கள்” என்பது மெராரியின் விரிந்த வம்சத்தாரையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן הַלְוִיִּם
  choice: லேவியர்களில்
  rationale: முன்னுள்ள பட்டியலுடன் தொடர்ச்சியை וּ காட்டுகிறது; தமிழில் பட்டியல் ஓட்டத்தில் ‘லேவியர்களில்’ என்பது அதன் சேர்க்கைப் பொருளையும் מִן குறிக்கும் குழுவிலிருந்து ஒருவரைத் தெரிவிக்கும் பொருளையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: שְׁמַעְיָה
  choice: செமாயா
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் அண்மையாக எழுத்துப்பெயர்த்த வடிவம்.
- source_word: בֶן
  choice: மகன்
  rationale: வம்சவரிசையின் ஒவ்வொரு இணைப்பிலும் בֶן என்பதன் இயல்பான நேரடிப் பொருளைத் தக்கவைக்கிறது.
- source_word: חַשּׁוּב
  choice: அசூப்
  rationale: எபிரெய தனிப்பெயரைத் தமிழில் உச்சரிக்க ஏற்றவாறு எழுத்துப்பெயர்க்கிறது; தொடக்க ח ஒலி தமிழில் ‘அ’ என இயல்பாக்கப்பட்டுள்ளது.
- source_word: עַזְרִיקָם
  choice: அஸ்ரிக்காம்
  rationale: எபிரெய தனிப்பெயரின் மெய்யொலி வரிசையையும் நீண்ட இறுதி உயிரையும் அண்மையாகத் தரும் தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: חֲשַׁבְיָה
  choice: அசபியா
  rationale: எபிரெய தனிப்பெயரை அதன் -யா இறுதியுடன் அண்மையாகத் தமிழில் எழுத்துப்பெயர்க்கிறது.
- source_word: מִן בְּנֵי מְרָרִי
  choice: மெராரியின் மக்களிலிருந்து வந்த
  rationale: இது லேவியருக்குள் உள்ள மெராரி குலவழியைச் சுட்டுகிறது. ‘மக்கள்’ என்பது בְּנֵי என்பதன் வடிவத்தையும் விரிந்த வம்சப் பொருளையும் தமிழில் புரியும்படி வைத்திருக்கிறது.
