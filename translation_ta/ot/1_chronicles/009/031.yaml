translation_notes:
  register: நவீன செந்தமிழ் நடை; குடும்ப மற்றும் ஆலயப் பணிச்சொற்கள் பொதுவாசகர்களுக்குப் புரியுமாறு அமைக்கப்பட்டுள்ளன. மூலத்தின் நிர்வாகப் பொருளுக்கும் நம்பகத்தன்மைப் பொருளுக்கும் இடையிலான தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
