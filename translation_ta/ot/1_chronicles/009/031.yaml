  edition: WLC
  text: וּ/מַתִּתְיָה֙ מִן הַ/לְוִיִּ֔ם ה֥וּא הַ/בְּכ֖וֹר לְ/שַׁלֻּ֣ם הַ/קָּרְחִ֑י בֶּ/אֱמוּנָ֕ה עַ֖ל מַעֲשֵׂ֥ה הַ/חֲבִתִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/031.yaml
  text: And Mattithiah[a], from the Levites, the firstborn of Shallum the Korahite[b], was entrusted with the work of the flat cakes.
translation:
  language: ta
  text: லேவியர்களில் ஒருவனான கோரகியன் சல்லூமின் முதற்பேறான மத்தித்தியா, தட்டையான அப்பங்களைச் செய்யும் பணிக்குப் பொறுப்பாக நியமிக்கப்பட்டிருந்தான்[a].[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நம்பிக்கைக்குரிய விதத்தில்.” எபிரெயச் சொற்றொடர் மத்தித்தியா நம்பிக்கைக்குரிய விதத்தில் பணியாற்றியதையோ, நம்பிக்கைக்குரிய பொறுப்பில் நியமிக்கப்பட்டதையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயச் சொல் தட்டில் அல்லது வாணலியில் செய்யப்பட்டிருக்கக்கூடிய ஒரு வகை அப்பத்தைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וּמַתִּתְיָה
  choice: மத்தித்தியா
  rationale: எபிரெயப் பெயரைத் தமிழில் ஒலிபெயர்த்துள்ளது; வாவ் இணைப்பைத் தனியே மொழிபெயர்க்காமல், பட்டியலின் தொடர்ச்சியைத் தமிழ் வாக்கிய ஓட்டமே வெளிப்படுத்துகிறது.
- source_word: מִן הַלְוִיִּם
  choice: லேவியர்களில் ஒருவன்
  rationale: מן இங்கு ஒரு குழுவைச் சேர்ந்திருப்பதைக் குறிக்கிறது; தமிழில் இயல்பாகவும் தெளிவாகவும் கூறப்பட்டுள்ளது.
- source_word: הוּא הַבְּכוֹר לְשַׁלֻּם
  choice: சல்லூமின் முதற்பேறு
  rationale: בכור என்பதன் நேரடியான குடும்ப அடையாளமான ‘முதற்பேறு’ என்பதைக் காக்கிறது; ‘மூத்த மகன்’ என விளக்கமாக விரிவாக்கவில்லை.
- source_word: הַקָּרְחִי
  choice: கோராகியன்
  rationale: கோராகின் வம்சத்தவர் அல்லது குலத்தவர் என்பதைக் குறிக்கும் குடும்பப் பெயரைத் தமிழில் இயல்பான வடிவில் வழங்குகிறது.
- source_word: בֶּאֱמוּנָה
  choice: நம்பிக்கைக்குரிய முறையில்
  rationale: אֱמוּנָה நம்பகத்தன்மையையும் ஒப்படைக்கப்பட்ட பொறுப்பையும் குறிக்கக்கூடும். முதன்மை உரை நம்பகமான செயல்முறையை வெளிப்படுத்துகிறது; மாற்று நிர்வாகப் பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: עַל מַעֲשֵׂה
  choice: செய்யும் பணியை ... கவனித்துவந்தான்
  rationale: על மேற்பார்வை அல்லது பொறுப்பையும், מעשה செயல் அல்லது தயாரிப்புப் பணியையும் குறிக்கின்றன; இரண்டையும் இணைத்து இயல்பான தமிழில் பொறுப்பின் கருத்தை வெளிப்படுத்துகிறது.
- source_word: הַחֲבִתִּים
  choice: தட்டையான அப்பங்கள்
  rationale: ஒருவகை வாணலி அல்லது தட்டில் செய்யப்பட்ட அப்பத்தைச் சுட்டும் அரிய உணவுச்சொல்; பலியுணவு என்ற விவரத்தை மூலத்தில் இல்லாமல் சேர்க்காமல், அதன் பொதுவான வடிவைத் தருகிறது.
