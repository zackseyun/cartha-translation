- from: லேவியர்களில் ஒருவனும் கோராகியனான சல்லூமின் முதற்பேறுமான மத்தித்தியா, தட்டையான அப்பங்களைச் செய்யும் பணியை நம்பிக்கைக்குரிய முறையில்[a] கவனித்துவந்தான்[b].
  to: லேவியர்களில் ஒருவனான கோரகியன் சல்லூமின் முதற்பேறான மத்தித்தியா, தட்டையான அப்பங்களைச் செய்யும் பணிக்குப் பொறுப்பாக நியமிக்கப்பட்டிருந்தான்[a].[b]
