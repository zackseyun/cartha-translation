base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/032.yaml
  text: And some of the sons of the Kohathites[a], from among their brothers, were in charge of the bread of the arrangement, to prepare it Sabbath by Sabbath.
translation:
  language: ta
  text: கோகாத்தியரின் மக்களில், தங்கள் சகோதரர்களில் சிலர் அடுக்கி வைக்கப்பட்ட அப்பத்திற்குப் பொறுப்பாளிகளாக இருந்தார்கள்; ஓய்வுநாள்தோறும் அதை ஆயத்தம் செய்வது அவர்களுடைய பணி.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இது பாரம்பரியமாக ‘சமுகத்து அப்பம்’ என அழைக்கப்படுகிறது. எபிரெயச் சொற்றொடர், ஒழுங்காக அடுக்கி அல்லது வரிசையாக வைக்கப்பட்ட அப்பத்தைச் சொற்பொருளில் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן בְּנֵי הַקְּהָתִי
  choice: கோகாத்தியரின் மக்களில் சிலர்
  rationale: מִן என்பதன் பகுதிப்பொருளை இயல்பான தமிழில் ‘சிலர்’ என வெளிப்படுத்துகிறது; ‘மக்கள்’ என்ற குல/வம்சக் கூறையும் தக்கவைக்கிறது.
- source_word: מִן אֲחֵיהֶם
  choice: தங்கள் சகோதரர்களிடையே இருந்து
  rationale: இரண்டாவது מִן இவர்களைச் சக லேவிய சகோதரர்களிடமிருந்து தேர்ந்தெடுக்கப்பட்ட ஒரு குழுவாகக் காட்டுகிறது; ‘சகோதரர்கள்’ எபிரெயச் சொல்லை நேரடியாகப் பிரதிபலிக்கிறது.
- source_word: עַל
  choice: பொறுப்பாளிகளாக இருந்தார்கள்
  rationale: நிர்வாகச் சூழலில் மேற்பார்வை அல்லது ஒப்படைக்கப்பட்ட பொறுப்பைக் குறிக்கும் சொல்லின் பொருளைத் தெளிவான நவீன தமிழில் தருகிறது.
- source_word: לֶחֶם הַמַּעֲרָכֶת
  choice: அடுக்கிவைக்கப்படும் அப்பம்
  rationale: מַעֲרֶכֶת குறிக்கும் ஒழுங்காக அடுக்குதல்/வரிசைப்படுத்துதலை வெளிப்படுத்துகிறது; பாரம்பரியப் பெயரை மட்டும் பயன்படுத்தி மூல உருவகத்தை மறைக்கவில்லை.
- source_word: לְהָכִין
  choice: அதை ஆயத்தம் செய்வது
  rationale: நோக்கத்தைக் குறிக்கும் வினையெச்சத்தின் பொருளைத் தருகிறது; சூழலில் மறைந்திருக்கும் ‘அப்பம்’ என்ற செயப்படுபொருளை ‘அதை’ எனத் தெளிவாக்குகிறது.
- source_word: שַׁבַּת שַׁבָּת
  choice: ஓய்வுநாள்தோறும்
  rationale: பெயர்ச்சொல் மீளுருவாக்கத்தின் பகிர்வு/தொடர்ச்சி பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
