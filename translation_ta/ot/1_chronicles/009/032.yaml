revisions:
- from: கோகாத்தியரின் மக்களில் சிலர், தங்கள் சகோதரர்களிடையே இருந்து, அடுக்கிவைக்கப்படும் அப்பத்திற்குப் பொறுப்பாளிகளாக இருந்தார்கள்; ஓய்வுநாள்தோறும் அதை ஆயத்தம் செய்வது அவர்களுடைய பணி.[a]
  to: கோகாத்தியரின் மக்களில், தங்கள் சகோதரர்களில் சிலர் அடுக்கி வைக்கப்பட்ட அப்பத்திற்குப் பொறுப்பாளிகளாக இருந்தார்கள்; ஓய்வுநாள்தோறும் அதை ஆயத்தம் செய்வது அவர்களுடைய பணி.[a]
