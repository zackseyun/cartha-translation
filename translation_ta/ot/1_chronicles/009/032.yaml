  register: நவீன தரநிலைத் தமிழில், கண்ணியமானதும் பொதுவாசகர்களுக்குப் புரியக்கூடியதுமான நடை பயன்படுத்தப்பட்டுள்ளது. குலப்பெயரும் ஆலயப் பணிப் பொறுப்பும் தெளிவாக வைக்கப்பட்டுள்ளன; எபிரெய மொழியின் பகுதிப்பொருள் மற்றும் ஓய்வுநாள் சார்ந்த தொடர்ச்சியான கடமை இயல்பான தமிழில் காக்கப்பட்டுள்ளன.
