revisions:
- from: எரோகாமின் மகனும், பஸ்கூரின் பேரனும், மல்கியாவின் கொள்ளுப்பேரனுமான அதாயாவும்; அதியேலின் மகனும், யக்சேராவின் பேரனும், மெசுல்லாமின் கொள்ளுப்பேரனும், மெசில்லேமித்தின் வழிவந்தவனும், இம்மேரின் வழித்தோன்றலுமான மாசாயும்.[a]
  to: எரோகாமின் மகன், பஷ்ஹூரின் மகன், மல்கியாவின் மகன் அதாயாவும்; அதியேலின் மகன், யஹ்சேராவின் மகன், மெஷுல்லாமின் மகன், மெஷில்லேமித்தின்[a] மகன், இம்மேரின் மகன் மாசாயும்.
  rationale: The revision retains the Hebrew genealogical sequence and renders every occurrence of בן consistently as 'மகன்,' without supplying unexpressed generational distances. It also uses Hebrew-oriented Tamil name transliterations and relocates the existing lexical-variant footnote marker to the name it concerns.
