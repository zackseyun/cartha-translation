  register: நவீனத் தரத் தமிழில், மரியாதைமிக்க வம்சப் பட்டியல் நடை. பெயர்கள் ஆங்கில வடிவங்களிலிருந்து அல்லாமல் எபிரெய மசோரா வாசகத்தின் ஒலிக்கு இயன்றவரை நெருக்கமாகத் தமிழாக்கப்பட்டன; நீண்ட בֶּן தொடரை வாசகருக்குத் தெளிவாக்க உறவுநிலைகள் இயல்பான தமிழில் வேறுபடுத்தப்பட்டன.
