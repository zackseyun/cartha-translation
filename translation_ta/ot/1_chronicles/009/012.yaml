base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/012.yaml
  text: and Adaiah son of Jeroham[a], son of Pashhur, son of Malchijah, and Maasai son of Adiel, son of Jahzerah, son of Meshullam, son of Meshillemith, son of Immer.
translation:
  language: ta
  text: எரோகாமின் மகன், பஷ்ஹூரின் மகன், மல்கியாவின் மகன் அதாயாவும்; அதியேலின் மகன், யஹ்சேராவின் மகன், மெஷுல்லாமின் மகன், மெஷில்லேமித்தின்[a] மகன், இம்மேரின் மகன் மாசாயும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் உள்ள மְשִׁלֵּמִית என்ற பெயர் இங்கே “மெஷில்லேமித்” என்று ஒலிபெயர்க்கப்பட்டுள்ளது; இதனுடன் தொடர்புடைய பெயர் வடிவம் வேறிடங்களில் “மெஷில்லேமோத்” என்று காணப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַ/עֲדָיָה
  choice: அதாயாவும்
  rationale: வாவ் இணைப்பைத் தமிழ் பட்டியல் நடைக்கு ஏற்ற ‘-வும்’ எனக் காட்டி, பெயரை எபிரெய உச்சரிப்புக்கு நெருக்கமாக ஒலிபெயர்த்தது.
- source_word: בֶּן
  choice: மகன் / பேரன் / கொள்ளுப்பேரன் / வழிவந்தவன் / வழித்தோன்றல்
  rationale: தொடர்ச்சியான வம்சப் பட்டியலில் בֶּן உறவுநிலையைப் பொதுவாகக் குறிக்கிறது. தமிழில் ஒவ்வொரு தலைமுறையிலும் ‘மகன்’ எனத் திரும்பச் சொல்வதால் உறவு குழப்பமடையலாம்; ஆகவே தெரியும் தலைமுறை நிலைகள் இயல்பாகவும், தொலைவான நிலைகள் பாதுகாப்பாகவும் தரப்பட்டன.
- source_word: יְרֹחָם
  choice: எரோகாம்
  rationale: எபிரெயப் பெயரின் ஒலிக்கு நெருக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: פַּשְׁחוּר
  choice: பஸ்கூர்
  rationale: எபிரெயப் பெயரின் மெய்யொலி அமைப்பைப் பேணும் தமிழ் ஒலிபெயர்ப்பு.
- source_word: מַלְכִּיָּה
  choice: மல்கியா
  rationale: எபிரெய வடிவத்தை நேரடியாக ஒலிபெயர்த்தது.
- source_word: וּ/מַעְשַׂי
  choice: மாசாயும்
  rationale: இணைப்பை ‘-வும்’ எனக் காட்டி, இங்குள்ள குறுகிய பெயர் வடிவத்தை மாசாயா போன்ற நீண்ட வடிவத்துடன் கலக்காமல் ‘மாசாய்’ என ஒலிபெயர்த்தது.
- source_word: עֲדִיאֵל
  choice: அதியேல்
  rationale: எபிரெயப் பெயருக்கு நெருக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: יַחְזֵרָה
  choice: யக்சேரா
  rationale: ஆங்கில மரபின் J எழுத்தைச் சாராமல், எபிரெய தொடக்க யோத் மற்றும் நடுவிலுள்ள மெய்யொலியைத் தமிழில் நெருக்கமாகக் காட்டியது.
- source_word: מְשֻׁלָּם
  choice: மெசுல்லாம்
  rationale: எபிரெயப் பெயரின் ஒலி மற்றும் இரட்டித்த லகரத்தைப் பேணும் ஒலிபெயர்ப்பு.
- source_word: מְשִׁלֵּמִית
  choice: மெசில்லேமித்
  rationale: WLC-இன் இவ்வசன வாசகமான מְשִׁלֵּמִית என்பதையே நேரடியாகப் பின்பற்றுகிறது; தொடர்புடைய வேறொரு பெயர் வடிவத்தை இங்கு மாற்றீடாக இடவில்லை.
- source_word: אִמֵּר
  choice: இம்மேர்
  rationale: இரட்டித்த மெய்யையும் நீள உயிரையும் பிரதிபலிக்கும் தமிழ் ஒலிபெயர்ப்பு.
