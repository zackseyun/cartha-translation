  yaml_path: translation/ot/1_chronicles/009/024.yaml
  text: 'The gatekeepers were at the four directions: east[a], west, north, and south.'
translation:
  language: ta
  text: 'வாசற்காவலர்கள் நான்கு திசைகளிலும்[a] இருந்தார்கள்: கிழக்கு, மேற்கு, வடக்கு, தெற்கு.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லர்த்தமாக, “நான்கு காற்றுகளுக்கு”; இங்கு “காற்றுகள்” என்பது நான்கு திசைகளைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאַרְבַּע רוּחוֹת
  choice: நான்கு திசைகளிலும்
  rationale: சொல்லர்த்தமாக ‘நான்கு காற்றுகளுக்கு’ என்றாலும், தொடர்ந்து வரும் நான்கு திசைப் பெயர்கள் இங்கு உலகின் நான்கு திசைகளைக் குறிப்பதைத் தெளிவாக்குகின்றன. לְ முன்னொட்டின் பகிர்வு/இட ஒதுக்கீட்டு நுணுக்கத்தை ‘-இலும்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יִהְיוּ
  choice: இருந்தார்கள்
  rationale: எபிரெய வினைச்சொல்லின் எளிய இருப்பிடப் பொருளைத் தக்கவைத்து, மூலத்தில் வெளிப்படையாக இல்லாத ‘நியமிக்கப்பட்டிருந்தார்கள்’ போன்ற கருத்தைச் சேர்க்கவில்லை.
- source_word: הַשֹּׁעֲרִים
  choice: வாசற்காவலர்கள்
  rationale: வாசல்களைக் காக்கும் பொறுப்புடையவர்களைச் சுட்டுகிறது; ஆலயச் சூழலுக்கு ஏற்ற, தெளிவான நவீனத் தமிழ் சொல்.
- source_word: מִזְרָח יָמָּה צָפוֹנָה וָנֶגְבָּה
  choice: கிழக்கு, மேற்கு, வடக்கு, தெற்கு
  rationale: திசைப்பட்டியலாக இருப்பதால் இயல்பான தமிழ்த் திசைப் பெயர்கள் பயன்படுத்தப்பட்டன. יָמָּה என்பதன் சொல்லர்த்தமான ‘கடலை நோக்கி’ என்பதும் נֶגְבָּה என்பதன் ‘நெகேவை/தெற்கை நோக்கி’ என்பதும் இச்சூழலில் முறையே மேற்கு, தெற்கு எனப் பொருள்படுகின்றன.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட நடை. மூலத்தின் சுருக்கமான இருப்பிடக் கூற்றைத் தக்கவைத்து, திசை ஒதுக்கீடு பற்றிய மறைபொருளை அளவுக்கு மீறி வெளிப்படுத்தவில்லை. அடிக்குறி குறியீடு தொடர்புடைய ‘நான்கு திசைகள்’ கருத்துக்குப் பின் வைக்கப்பட்டது.
