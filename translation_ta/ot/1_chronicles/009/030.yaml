source:
  edition: WLC
  text: וּ/מִן בְּנֵי֙ הַ/כֹּ֣הֲנִ֔ים רֹקְחֵ֥י הַ/מִּרְקַ֖חַת לַ/בְּשָׂמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/030.yaml
  text: And some of the sons of the priests were compounders of the ointment of spices[a].
translation:
  language: ta
  text: ஆசாரியர்களின் மகன்களில் சிலர் நறுமணப் பொருட்களுக்கான கலவையைத் தயாரிப்பவர்களாக இருந்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நறுமணப் பொருட்களைக் கொண்டு வாசனைக் கலவையைத் தயாரிப்பவர்களாக இருந்தார்கள்.”
    reason: הַמִּרְקַחַת לַבְּשָׂמִים என்ற தொடரில் கலவைக்கும் நறுமணப் பொருட்களுக்கும் இடையிலான சரியான தொடர்பை ஒன்றுக்கு மேற்பட்ட விதமாகப் புரிந்துகொள்ளலாம்.
lexical_decisions:
- source_word: וּמִן
  choice: சிலர்
  rationale: מִן என்பதன் பகுதி சார்ந்த பொருளைத் தமிழில் இயல்பாகக் காட்டுகிறது; וּ சூழலில் பட்டியலைத் தொடர்கிறது, தனியாக மொழிபெயர்க்க வேண்டிய அவசியமில்லை.
- source_word: בְּנֵי הַכֹּהֲנִים
  choice: ஆசாரியர்களின் மகன்கள்
  rationale: எபிரெயச் சொற்றொடரின் குடும்ப மற்றும் வம்சத் தன்மையைப் பாதுகாக்கும் முறையான, இயல்பான தமிழ்.
- source_word: רֹקְחֵי
  choice: தயாரிப்பவர்கள்
  rationale: பல பொருட்களைத் திறமையாகக் கலந்து ஒரு கூட்டுப்பொருளை உருவாக்குவோரைக் குறிக்கிறது; ‘கலப்பவர்கள்’ என்பதைவிட இச்சூழலில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: הַמִּרְקַחַת
  choice: கலவை
  rationale: கலந்து தயாரிக்கப்பட்ட பொருள் என்பதே சொல்லின் அடிப்படைப் பொருள். அது தைலமா, களிம்பா, வாசனைத் தயாரிப்பா என்பதை மூலவசனம் முழுமையாகக் குறிப்பிடாததால் ‘கலவை’ அந்தத் தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: לַבְּשָׂמִים
  choice: நறுமணப் பொருட்களுக்கான
  rationale: בְּשָׂמִים என்பது வாசனைமிக்க மசாலா அல்லது நறுமணப் பொருட்களைக் குறிக்கிறது; לְ என்பதன் நோக்கம் அல்லது தொடர்பை ‘-க்கான’ இயல்பாக வெளிப்படுத்துகிறது.
