  register: நவீன பொதுத்தமிழில், dignified பட்டியல்/வரலாற்று நடையில் மொழிபெயர்க்கப்பட்டது. ‘கலவை’ என்பது மூலத்தின் பொருளைத் தேவையின்றி ‘தைலம்’ என்று குறுக்காமல் பாதுகாக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
