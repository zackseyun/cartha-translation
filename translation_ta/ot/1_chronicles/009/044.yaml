translation_notes:
  register: நவீன நிலையான தமிழில், மரபுப்பட்டியலுக்கேற்ற சுருக்கமானவும் கண்ணியமானவும் நடை பயன்படுத்தப்பட்டது. மூலத்தில் உள்ள ஆறு மகன்கள் என்ற எண்ணிக்கையோடு பெயர்ப்பட்டியல் ஒத்திருக்கும்படி בֹּכְרוּ தனிப்பெயராக மொழிபெயர்க்கப்பட்டு, உண்மையான சொற்பொருள் ஐயம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
