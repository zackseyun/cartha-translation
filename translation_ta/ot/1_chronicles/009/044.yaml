source:
  edition: WLC
  text: וּ/לְ/אָצֵל֮ שִׁשָּׁ֣ה בָנִים֒ וְ/אֵ֣לֶּה שְׁמוֹתָ֗/ם עַזְרִיקָ֥ם בֹּ֨כְרוּ֙ וְ/יִשְׁמָעֵ֣אל וּ/שְׁעַרְיָ֔ה וְ/עֹבַדְיָ֖ה וְ/חָנָ֑ן אֵ֖לֶּה בְּנֵ֥י אָצַֽל׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/044.yaml
  text: 'Azel had six sons[a], and these were their names: Azrikam his firstborn, Ishmael, Sheariah, Obadiah, and Hanan[b]. These were the sons of Azel.'
translation:
  language: ta
  text: 'ஆசேலுக்கு ஆறு மகன்கள் இருந்தார்கள். அவர்களுடைய பெயர்கள்: அஸ்ரிக்காம், போக்ரு[a], இஷ்மவேல், ஷெஅரியா, ஒபதியா, ஆனான். இவர்களே ஆசேலின் மகன்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “போக்ரு” என்பது ஒருவரின் பெயராக இங்கே எடுத்துக்கொள்ளப்பட்டுள்ளது; இதே ஆறு பெயர்கள் 1 நாளாகமம் 8:38-இலும் வருகின்றன. இந்த எபிரெய வடிவத்தை “அவனுடைய முதற்பேறானவன்” என்றும் வாசிக்க முடியும்; ஆனால் அப்படி வாசித்தால் இங்கே ஐந்து மகன்களின் பெயர்கள் மட்டுமே இருக்கும்.
    reason: textual_ambiguity
lexical_decisions:
- source_word: וּלְאָצֵל שִׁשָּׁה בָנִים
  choice: ஆசேலுக்கு ஆறு மகன்கள் இருந்தார்கள்
  rationale: எபிரெய மரபுப்பட்டியல் அமைப்பில் לְ என்பது உடைமை அல்லது வம்ச உறவைக் குறிக்கிறது. தமிழில் இயல்பாகவும் தெளிவாகவும் இருக்க ‘ஆசேலுக்கு ... மகன்கள் இருந்தார்கள்’ என்று மொழிபெயர்க்கப்பட்டது; בָנִים என்பதன் பாலினக் குறிப்பும் காக்கப்பட்டது.
- source_word: וְאֵלֶּה שְׁמוֹתָם
  choice: அவர்களுடைய பெயர்கள்
  rationale: பெயர்கள் ஆறு மகன்களுக்குரியவை என்பதைப் பன்மை விகுதி தெளிவுபடுத்துகிறது. பட்டியலை இயல்பாக அறிமுகப்படுத்தும் தமிழ் நடை பயன்படுத்தப்பட்டது.
- source_word: עַזְרִיקָם
  choice: அஸ்ரிக்காம்
  rationale: எபிரெய தனிப்பெயரின் ஒலியை நவீன தமிழில் இயன்றவரை நெருக்கமாக எழுத்துப்பெயர்த்தது.
- source_word: בֹּכְרוּ
  choice: போக்ரு
  rationale: ஆறு மகன்கள் என்று உரை கூறுவதும், 1 நாளாகமம் 8:38-இல் வரும் இணையான பட்டியலும் இதை இரண்டாவது மகனின் தனிப்பெயராகப் புரிந்துகொள்ள வலுவாக ஆதரிக்கின்றன.
- source_word: יִשְׁמָעֵאל
  choice: இஷ்மவேல்
  rationale: எபிரெய பெயரின் ஒலியமைப்பைத் தமிழில் அடையாளம் காணத்தக்க வகையில் எழுத்துப்பெயர்த்தது.
- source_word: שְׁעַרְיָה
  choice: ஷெஅரியா
  rationale: எபிரெய தனிப்பெயரின் மெய் மற்றும் உயிர் ஒலிகளை இயன்றவரை பிரதிபலிக்கும் தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: עֹבַדְיָה
  choice: ஒபதியா
  rationale: எபிரெய தனிப்பெயரைத் தமிழில் தெளிவாகவும் வாசிக்க எளிதாகவும் எழுத்துப்பெயர்த்தது.
- source_word: חָנָן
  choice: ஆனான்
  rationale: தொடக்க எபிரெய ח ஒலியைத் தமிழில் மிகையாகக் கடினப்படுத்தாமல், பெயரின் நீள உயிர்களைக் காக்கும் எழுத்துப்பெயர்ப்பு.
- source_word: אֵלֶּה בְּנֵי אָצַל
  choice: இவர்களே ஆசேலின் மகன்கள்
  rationale: எபிரெய உரையின் முடிவுச் சுருக்கத்தையும் ஆசேலின் பெயர் மீண்டும் வருவதையும் காக்கிறது.
