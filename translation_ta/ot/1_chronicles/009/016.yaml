source:
  edition: WLC
  text: וְ/עֹבַדְיָה֙ בֶּֽן שְׁמַֽעְיָ֔ה בֶּן גָּלָ֖ל בֶּן יְדוּת֑וּן וּ/בֶרֶכְיָ֤ה בֶן אָסָא֙ בֶּן אֶלְקָנָ֔ה הַ/יּוֹשֵׁ֖ב בְּ/חַצְרֵ֥י נְטוֹפָתִֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/016.yaml
  text: and Obadiah son of Shemaiah[a], son of Galal, son of Jeduthun, and Berechiah son of Asa, son of Elkanah, who lived in the villages of the Netophathites.
translation:
  language: ta
  text: எதுத்தூனின் மகனான காலாலின் மகன் செமாயாவின் மகன் ஒபதியாவும், நெத்தோபாத்தியரின் கிராமங்களில்[a] குடியிருந்த எல்க்கானாவின் மகன் ஆசாவின் மகன் பெரெகியாவும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நெத்தோபாவின் குடியிருப்புகளில்.” எபிரெயிலுள்ள ஊர்ச்சார்புப் பெயரை மக்களைக் குறிக்கும் “நெத்தோபாத்தியர்” என்றும், இடப்பெயரைக் குறிக்கும் “நெத்தோபா” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עֹבַדְיָה
  choice: ஒபதியாவும்
  rationale: முந்தைய பட்டியலுடன் பெயரை இணைக்கும் וְ என்ற இணைப்பைத் தமிழின் ‘-வும்’ விகுதி இயல்பாக வெளிப்படுத்துகிறது; பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: בֶּן
  choice: மகன்
  rationale: வம்சவரிசைச் சூழலில் בֶּן என்பதன் நேரடியான பொருள் ‘மகன்’; எபிரெய வடிவையும் உறவின் இயல்பான பொருளையும் இது காக்கிறது.
- source_word: שְׁמַעְיָה / גָּלָל / יְדוּתוּן
  choice: செமாயா / காலால் / எதுத்தூன்
  rationale: தனிப்பெயர்கள் எபிரெய ஒலியமைப்பை அணுகும் வகையில் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளன.
- source_word: וּ/בֶרֶכְיָה
  choice: பெரெகியாவும்
  rationale: இரண்டாவது நபரைப் பட்டியலுடன் இணைக்கும் וּ தமிழில் ‘-வும்’ எனக் காட்டப்பட்டுள்ளது; பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: אָסָא / אֶלְקָנָה
  choice: ஆசா / எல்க்கானா
  rationale: இவை தனிப்பெயர்களாக எபிரெயிலிருந்து தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளன.
- source_word: הַ/יּוֹשֵׁב
  choice: குடியிருந்த
  rationale: இடத்தில் தொடர்ந்து வசித்ததைக் குறிக்கும் எபிரெய வினையெச்சத்தை இயல்பான தமிழ் உறவெச்சமாகத் தருகிறது; ஒருமை வடிவம் அருகிலுள்ள பெரெகியாவையே விவரிக்கிறது.
- source_word: בְּ/חַצְרֵי
  choice: கிராமங்களில்
  rationale: இந்தப் புவியியல் சூழலில் חָצֵר என்பது முற்றங்களைவிடச் சிறிய ஊர்கள் அல்லது குடியிருப்புகளைக் குறிக்கிறது; ‘கிராமங்கள்’ சாதாரண வாசகருக்குத் தெளிவான தேர்வு.
- source_word: נְטוֹפָתִי
  choice: நெத்தோபாத்தியரின்
  rationale: இன/ஊர்ச்சார்புப் பெயரடை நெத்தோபாவைச் சேர்ந்த மக்களைக் குறிக்கிறது; ‘நெத்தோபாத்தியர்’ என்ற மக்கள்குழு வடிவம் மூலத்தின் அமைப்பை நேரடியாகப் பிரதிபலிக்கிறது.
