translation_notes:
  register: நவீன நிலையான தமிழில், வம்சவரிசையின் சங்கிலித் தொடர்பு தெளிவாகத் தெரியும்படி உறவுகள் பின்னிருந்து முன்னாக அமைக்கப்பட்டுள்ளன. இரு பெயர்களையும் இணைக்கும் எபிரெய இணைப்புகள் ‘-வும்’ மூலம் காக்கப்பட்டுள்ளன; நடை கண்ணியமானதும் சாதாரண வாசகர்களுக்கு எளிதில் புரியத்தக்கதுமாக உள்ளது.
