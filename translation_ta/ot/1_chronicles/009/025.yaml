base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/025.yaml
  text: And their brothers in their villages were to come in every seven days[a], from time to time[b], with these.
translation:
  language: ta
  text: தங்கள் கிராமங்களில் இருந்த அவர்களுடைய சகோதரர்கள் ஏழு நாட்களுக்கு ஒருமுறை[a], காலந்தோறும் இவர்களுடன்[b] சேர வரவேண்டியிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஏழு நாட்களுக்கு” என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொற்றொடர் ஏழு நாள் பணிமுறையைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: நேர்ப்பொருள் “இவர்களுடன்”; இது ஏற்கெனவே அங்கு பணியாற்றிக்கொண்டிருந்தவர்களைக் குறிக்கிறது.
    reason: lexical_clarification
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: அவர்களுடைய சகோதரர்கள்
  rationale: אֲחֵיהֶם என்பதன் நேர்ப்பொருள் ‘அவர்களுடைய சகோதரர்கள்.’ இச்சூழலில் இது உடன் பணியாற்றிய லேவிய உறவினர்களையும் குறிக்கக்கூடும்; எனினும் மூலத்தின் குடும்ப மற்றும் சமூகச் சொல்லாட்சியை ‘சகோதரர்கள்’ காக்கிறது.
- source_word: בְּחַצְרֵיהֶם
  choice: தங்கள் கிராமங்களிலிருந்து
  rationale: חָצֵר என்பதற்கு முற்றம், அடைப்பு, கிராமம் அல்லது குடியிருப்பு என்ற பொருள்கள் உண்டு. ஆலய வளாகத்துக்கு வெளியே வாழ்ந்தவர்களைப் பற்றிய இச்சூழலில் ‘கிராமங்கள்’ பொருத்தமானது. ‘வருதல்’ என்ற வினையுடன் இயல்பான தமிழுக்காக இடப்பொருள் ‘இலிருந்து’ என வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: לָבוֹא
  choice: வரவேண்டியிருந்தார்கள்
  rationale: ל முன்னொட்டுடன் வரும் வினையெச்சம் இங்கு ஒழுங்குபடுத்தப்பட்ட வருகை அல்லது கடமையை உணர்த்துகிறது. ‘வரவேண்டியிருந்தார்கள்’ என்பது வெறும் கடந்தகால வருகையாக அல்லாமல் அட்டவணைப்படியான கடமையாக அதைத் தெரிவிக்கிறது.
- source_word: לְשִׁבְעַת הַיָּמִים
  choice: ஏழு நாட்களுக்கு ஒருமுறை
  rationale: இச்சொற்றொடர் ஏழு நாள் இடைவெளியிலான முறைமையை அல்லது ஏழு நாள் பணிக்காலத்தைச் சுட்டலாம். சூழலுக்கு ஏற்ற முதன்மை வாசகமாக ‘ஏழு நாட்களுக்கு ஒருமுறை’ தேர்ந்தெடுக்கப்பட்டு, மாற்றுப் பொருள் அடிக்குறிப்பில் காக்கப்பட்டுள்ளது.
- source_word: מֵעֵת אֶל עֵת
  choice: காலந்தோறும்
  rationale: இந்த மரபுத்தொடர் தொடர்ந்து வரும் காலங்களையோ மீண்டும் நிகழும் சந்தர்ப்பங்களையோ குறிக்கிறது. ‘காலந்தோறும்’ என்பது சுருக்கமான, இயல்பான தமிழ் இணை.
- source_word: עִם אֵלֶּה
  choice: இவர்களுடன் சேர
  rationale: இதன் நேர்ப்பொருள் ‘இவர்களுடன்.’ சுட்டுப்பெயர் முன் குறிப்பிடப்பட்டு அப்போது பணியிலிருந்தவர்களைக் குறிக்கிறது; ‘சேர’ என்பது அவர்களுடன் வருதல் என்ற உறவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
