base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/008.yaml
  text: and Ibneiah son of Jeroham[a], and Elah son of Uzzi, son of Michri, and Meshullam son of Shephatiah, son of Reuel, son of Ibnijah.
translation:
  language: ta
  text: யெரோகாமின் மகன் யிப்னெயா[a], மிக்ரியின் மகனான உஸ்ஸியின் மகன் ஏலா, யிப்னியாவின் மகனான ரெகுவேலின் மகன் ஷெபத்தியாவின் மகன் மெஷுல்லாம் ஆகியோரும் இருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத் தனிப்பெயர்கள் ஒலிபெயர்க்கப்பட்டுள்ளன; சில மொழிபெயர்ப்புகளில் யிப்னெயா, ரெகுவேல் போன்ற பெயர்களின் எழுத்துவடிவங்கள் மாறுபடலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ
  choice: ஆகியோரும்
  rationale: எபிரெயப் பெயர்ப்பட்டியலை முந்தைய வசனத்துடன் இணைக்கும் வாவ் இணைப்பை, இயல்பான தமிழில் பட்டியலின் இறுதியில் ‘ஆகியோரும்’ என வெளிப்படுத்துகிறது.
- source_word: יִבְנְיָה
  choice: யிப்னெயா
  rationale: மசோரா உரையின் மெய்யெழுத்தையும் உயிர்க்குறிப்பையும் நெருக்கமாகப் பின்பற்றிய தனிப்பெயர் ஒலிபெயர்ப்பு.
- source_word: בֶּן
  choice: மகன் / மகனான
  rationale: இந்த வம்சப் பட்டியலில் நேரடி தந்தை–மகன் உறவைக் குறிக்கும் இயல்பான தமிழ் வடிவம்; தொடர்ச்சியான உறவுகள் தெளிவாக இருக்க உருபு வடிவங்கள் மாற்றப்பட்டுள்ளன.
- source_word: יְרֹחָם
  choice: யெரோகாம்
  rationale: எபிரெயத் தனிப்பெயரின் தமிழ் ஒலிபெயர்ப்பு.
- source_word: אֵלָה
  choice: ஏலா
  rationale: எபிரெயத் தனிப்பெயரின் தமிழ் ஒலிபெயர்ப்பு.
- source_word: עֻזִּי
  choice: உசி
  rationale: எபிரெயத் தனிப்பெயரின் இரட்டித்த z ஒலியைத் தமிழில் இயல்பாக ‘சி’ மூலம் ஒலிபெயர்க்கிறது.
- source_word: מִכְרִי
  choice: மிக்ரி
  rationale: எபிரெயத் தனிப்பெயரின் மெய்யொலித் தொடரைத் தக்கவைக்கும் தமிழ் ஒலிபெயர்ப்பு.
- source_word: מְשֻׁלָּם
  choice: மெசுல்லாம்
  rationale: எபிரெயத் தனிப்பெயரின் தமிழ் ஒலிபெயர்ப்பு; இறுதி மெய்யின் இரட்டிப்பும் தக்கவைக்கப்பட்டுள்ளது.
- source_word: שְׁפַטְיָה
  choice: செபத்தியா
  rationale: எபிரெயத் தனிப்பெயரின் தமிழ் வேதாகமப் பயன்பாட்டுக்கு ஏற்ற ஒலிபெயர்ப்பு.
- source_word: רְעוּאֵל
  choice: ரெவேல்
  rationale: மசோரா எபிரெய வடிவத்தை நேரடியாகப் பிரதிபலிக்கிறது; பிற மொழி மரபிலுள்ள ‘ராகுவேல்’ போன்ற வடிவத்தைச் சாரவில்லை.
- source_word: יִבְנִיָּה
  choice: யிப்னியா
  rationale: மசோரா உரையிலுள்ள தனிப்பெயரை நேரடியாக ஒலிபெயர்த்து, இறுதியிலுள்ள -யா கூறைத் தக்கவைக்கிறது.
