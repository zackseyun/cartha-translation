translation_notes:
  register: நவீன தரநிலைத் தமிழில், வம்சப்பட்டியலுக்கேற்ற சுருக்கமான மற்றும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. பெயர்கள் மூல எபிரெய வடிவங்களுக்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டுள்ளன; உண்மையான எழுத்துவடிவ வேறுபாடு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
