  text: וּ/בֶן יְהוֹנָתָ֖ן מְרִ֣יב בָּ֑עַל וּ/מְרִי בַ֖עַל הוֹלִ֥יד אֶת מִיכָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/040.yaml
  text: And the son of Jehonathan was Merib-baal[b][a], and Merib-baal fathered Micah.
translation:
  language: ta
  text: யெகோனத்தான்[b] மகன் மெரிப்-பாகால்[a]; மெரிப்-பாகால் மீகாவுக்குத் தந்தையானான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இந்த வசனத்தின் எபிரெய மூலஉரையில் தந்தையின் பெயர் சற்றே வேறுபட்ட இரு வடிவங்களில் எழுதப்பட்டுள்ளது: முதலில் “மெரிப்-பாகால்,” பின்னர் குறுகிய வடிவில் “மெரி-பாகால்.” தெளிவுக்காக முதன்மை உரையில் பெயர் ஒரே வடிவில் கொடுக்கப்பட்டுள்ளது.'
    reason: textual_variant
  - marker: b
    text: 1 சாமுவேல் 14:49-இல் சவுலின் மகன் “யோனத்தான்” என்று அழைக்கப்படுகிறார். இங்கு நாளாகமத்தின் எபிரெய மூலத்தில் உள்ள வடிவம் “யெகோனத்தான்.”
    reason: cross_reference
lexical_decisions:
- source_word: וּ/בֶן
  choice: மகன்
  rationale: בֶן என்பதற்கு ‘மகன்’ என்று பொருள். வம்சப்பட்டியலின் இயல்பான தமிழ்நடைக்காக முன்னொட்டு ו தனியாக மொழிபெயர்க்கப்படவில்லை; அரைப்புள்ளி முந்தைய தொடருடனான இணைப்பை இயல்பாகக் காட்டுகிறது.
- source_word: יְהוֹנָתָן
  choice: யெகோனத்தான்
  rationale: இங்கு காணப்படும் எபிரெய வடிவம் יְהוֹנָתָן என்பதால், நன்கு அறியப்பட்ட ‘யோனத்தான்’ என்று ஒருமைப்படுத்தாமல் ‘யெகோனத்தான்’ என ஒலிபெயர்க்கப்படுகிறது.
- source_word: מְרִיב בָּעַל
  choice: மெரிப்-பாகால்
  rationale: இரு கூறுகளாக எழுதப்பட்டுள்ள பெயரைப் பொருளாக்காமல் ஒலிபெயர்க்கிறது; இணைப்புக்குறி பெயரின் இருகூற்று அமைப்பைத் தெளிவாக்குகிறது.
- source_word: וּ/מְרִי בַעַל
  choice: மெரிப்-பாகால்
  rationale: இரண்டாவது இடத்தில் பெயர் சற்றுக் குறுகிய வடிவில் மְרִי בַעַל என்று உள்ளது. ஒரே நபரைக் குறிக்கும் வம்சப்பட்டியல் தெளிவுக்காக முழு வடிவம் முதன்மை உரையில் ஒரேபடியாக வழங்கப்பட்டு, வேறுபாடு அடிக்குறிப்பில் பதிவு செய்யப்படுகிறது.
- source_word: הוֹלִיד
  choice: பெற்றான்
  rationale: வம்சப்பட்டியல் சூழலில் Hiphil வடிவம் ‘தந்தையானான்/பெற்றெடுத்தான்’ என்ற ஆண் மரபுவழிப் பொருளைக் குறிக்கிறது. ‘பெற்றான்’ என்பது சுருக்கமான, இயல்பான நவீனத் தமிழ் வம்சப்பட்டியல் நடை.
- source_word: אֶת מִיכָה
  choice: மீகாவை
  rationale: אֶת நேரடிச் செயப்படுபொருள் குறியீடு என்பதால் தனியாக மொழிபெயர்க்கப்படவில்லை; מִיכָה என்ற பெயர் ‘மீகா’ என ஒலிபெயர்க்கப்பட்டு தமிழின் இரண்டாம் வேற்றுமை உருபைப் பெறுகிறது.
