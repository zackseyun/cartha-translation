  source_fidelity: 'The genealogy is rendered accurately overall: Jehonathan is retained rather than normalized, and the shortened second spelling of Merib-baal is appropriately regularized with a note. The verb הוֹלִיד specifically denotes male begetting in this genealogy; a more explicit Tamil expression avoids any possible ambiguity in பெற்றான்.'
