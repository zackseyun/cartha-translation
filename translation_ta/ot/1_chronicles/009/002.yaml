base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/002.yaml
  text: The first inhabitants who lived in their possessions in their cities were Israel[a], the priests, the Levites, and the temple servants.
translation:
  language: ta
  text: தங்கள் நகரங்களிலுள்ள தங்கள் உரிமை நிலங்களில் குடியிருந்த முதல் மக்கள் இஸ்ரயேலர், ஆசாரியர்கள், லேவியர்கள், ஆலயப் பணியாளர்கள்[a] ஆகியோர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘நெதினீமியர்’; ஆலயப் பணிக்காக நியமிக்கப்பட்ட ஒரு வகுப்பினரைக் குறிக்கும் மரபுவழிப் பெயர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַיּוֹשְׁבִים הָרִאשֹׁנִים
  choice: குடியிருந்த முதல் மக்கள்
  rationale: יֹשְׁבִים என்பது குடியிருப்பவர்களைக் குறிக்கும்; הָרִאשֹׁנִים என்பதன் ‘முதல்’ என்ற பொருளையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: בַּאֲחֻזָּתָם
  choice: தங்கள் உரிமை நிலங்களில்
  rationale: אֲחֻזָּה என்பது ஒருவருக்குரிய நிலவுடைமை அல்லது மரபுரிமைப் பங்கைக் குறிக்கலாம். ‘உரிமை நிலங்கள்’ என்பது அதன் நிலம் சார்ந்த பொருளைத் தெளிவாகவும் மிகையாகச் சட்டப் பொருள் ஏற்றாமலும் தெரிவிக்கிறது.
- source_word: בְּעָרֵיהֶם
  choice: தங்கள் நகரங்களிலுள்ள
  rationale: עָרִים என்பதற்கான வழக்கமான பொருள் ‘நகரங்கள்’; தமிழில் உரிமை நிலங்களுடனான தொடர்பை இயல்பாகக் காட்ட இவ்வாறு இணைக்கப்பட்டது.
- source_word: יִשְׂרָאֵל
  choice: இஸ்ரயேலர்
  rationale: இங்கு பெயர் மனிதக் குழுவைக் குறிக்கும் பட்டியலில் வருகிறது; ஆகவே தமிழில் ‘இஸ்ரயேலர்’ என்பது இயல்பான கூட்டுப்பெயர்.
- source_word: הַכֹּהֲנִים
  choice: ஆசாரியர்கள்
  rationale: ஆலய வழிபாட்டுப் பணியைச் செய்த כֹּהֲנִים என்போருக்கான நிலைபெற்ற, தெளிவான தமிழ் சொல்.
- source_word: הַלְוִיִּם
  choice: லேவியர்கள்
  rationale: லேவி கோத்திரத்தார் மற்றும் ஆலயப் பணிவகுப்பைக் குறிக்கும் பெயரைத் தெளிவாகத் தருகிறது.
- source_word: וְהַנְּתִינִים
  choice: ஆலயப் பணியாளர்கள்
  rationale: נְתִינִים என்பது ஆலய சேவைக்கென நியமிக்கப்பட்ட ஒரு குறிப்பிட்ட வகுப்பைக் குறிக்கிறது. அதன் பணியை நவீன வாசகர் புரிந்துகொள்ளும் வகையில் மொழிபெயர்க்கப்பட்டு, மரபுவழிப் பெயர் அடிக்குறிப்பில் தரப்படுகிறது.
