  text: And his firstborn son was Abdon[a], then Zur, Kish, Baal, Ner, and Nadab.
translation:
  language: ta
  text: அவனுடைய முதற்பேறான மகன் அப்தோன்; சூர், கீஷ், பாகால், நேர், நாடாப் ஆகியோரும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנוֹ
  choice: அவனுடைய ... மகன்
  rationale: בְנוֹ என்பதில் உள்ள மூன்றாம் நபர் ஆண்பால் ஒருமை உடைமைப் பொருளை வெளிப்படையாகத் தக்கவைக்கிறது. தொடக்க ו genealogical தொடர்ச்சியைக் குறிக்கிறது; தமிழில் இயல்பான வாக்கியத் தொடரில் அது தனியே மொழிபெயர்க்கப்படவில்லை.
- source_word: הַבְּכוֹר
  choice: முதற்பேறான
  rationale: ‘முதலில் பிறந்த’ என்ற வம்சவரலாற்றுச் சிறப்புப் பொருளையும் மூலத்தின் முறையான நடையையும் காக்கிறது.
- source_word: עַבְדּוֹן
  choice: அப்தோன்
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் அண்மையாக எழுத்துப்பெயர்க்கிறது.
- source_word: וְצוּר וְקִישׁ וּבַעַל וְנֵר וְנָדָב
  choice: அடுத்து சூர், கீஷ், பாகால், நேர், நாடாப் ஆகியோர்
  rationale: ஒவ்வொரு பெயருக்கும் முன் வரும் ו இணைப்புகளைத் தமிழின் இயல்பான பெயர்ப்பட்டியல் அமைப்பில் வழங்குகிறது; ‘அடுத்து’ என்பது பட்டியல் தொடர்வதைக் குறிக்கிறது, பிறப்புவரிசையை உறுதிப்படுத்துவதற்காக அல்ல.
theological_decisions:
- issue: இஸ்ரவேலரின் வம்சப்பட்டியலில் בַּעַל என்ற தனிப்பெயரை வழங்குதல்
  choice: பாகால் என்ற தனிப்பெயராக எழுத்துப்பெயர்த்தல்
  alternative: தெய்வப்பெயருடனான தொடர்பைத் தவிர்க்க வேறு பெயராக மாற்றுதல்
  rationale: இங்கு எபிரெய உரை בַּעַל என்பதைத் தெளிவாக ஒரு நபரின் பெயராக வழங்குகிறது. பிற்கால இறையியல் சங்கடத்தின் காரணமாக அதை மாற்றாமல் மூல உரையைப் பிரதிபலிக்க வேண்டும்; இது சிலைவழிபாட்டை ஆதரிப்பதல்ல.
translation_notes:
  register: நவீனத் தரத் தமிழில், வம்சப்பட்டியலுக்கேற்ற சுருக்கமானதும் கண்ணியமானதுமான நடை பயன்படுத்தப்பட்டுள்ளது. தனிப்பெயர்கள் எபிரெய உச்சரிப்புக்கு அண்மையாக எழுத்துப்பெயர்க்கப்பட்டுள்ளன.
