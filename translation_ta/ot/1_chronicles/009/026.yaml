source:
  edition: WLC
  text: כִּ֣י בֶ/אֱמוּנָ֞ה הֵ֗מָּה אַרְבַּ֨עַת֙ גִּבֹּרֵ֣י הַ/שֹּׁעֲרִ֔ים הֵ֖ם הַ/לְוִיִּ֑ם וְ/הָיוּ֙ עַל הַ/לְּשָׁכ֔וֹת וְ/עַ֥ל הָ/אֹצְר֖וֹת בֵּ֥ית הָ/אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/026.yaml
  text: For these four mighty gatekeepers[a], who were Levites[b], were entrusted with the chambers and with the storehouses of the house of God.
translation:
  language: ta
  text: ஏனெனில், லேவியர்களான இந்த நான்கு வலிமைமிக்க வாயிற்காவலர்களும் நம்பிக்கையுடன் தங்கள் பொறுப்பை வகித்தார்கள்[a]; அவர்கள் கடவுளின் இல்லத்தின் அறைகளுக்கும் பண்டகசாலைகளுக்கும்[b] பொறுப்பாளர்களாக இருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “உண்மையோடு இருந்தார்கள்” / “நம்பிக்கைக்குரியவர்களாக இருந்தார்கள்.” எபிரெயச் சொல் அவர்கள் தங்கள் பொறுப்பில் காட்டிய நம்பகத்தன்மையை வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது “கருவூலங்களுக்கும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட பணியமைப்புக்கான விளக்கத்தை அறிமுகப்படுத்தும் இணைப்புச் சொல்லாக இயல்பாக அமைகிறது.
- source_word: בֶאֱמוּנָה
  choice: நம்பிக்கைக்குரிய பொறுப்பில் இருந்தார்கள்
  rationale: אֱמוּנָה என்பது உண்மைத்தன்மை, நம்பகத்தன்மை அல்லது நம்பி ஒப்படைக்கப்பட்ட நிலை ஆகியவற்றைக் குறிக்கலாம். இங்கு ஆலய நிர்வாகச் சூழலில் அந்தப் பொறுப்பின் நம்பகத்தன்மையை இயல்பான தமிழில் தெரிவிக்கிறது; சொற்சார்ந்த மாற்றுகள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: אַרְבַּעַת גִּבֹּרֵי הַשֹּׁעֲרִים
  choice: வாயிற்காவலர்களில் முக்கியமான அந்த நால்வரும்
  rationale: גִּבּוֹרֵי என்பதன் அடிப்படைப் பொருள் வலிமைமிக்க அல்லது ஆற்றல்மிக்க மனிதர்கள் என்றாலும், இந்நிர்வாகச் சூழலில் அது முன்னணி அல்லது முக்கியப் பொறுப்பிலிருந்த காவலர்களைக் குறிக்கிறது. ‘முக்கியமான’ என்பது பொருளை மிகைப்படுத்தாமல் இயல்பாகத் தருகிறது.
- source_word: הֵם הַלְוִיִּם
  choice: லேவியர்களான
  rationale: அந்த நான்கு வாயிற்காவலர்களையும் லேவியர்கள் என்று அடையாளப்படுத்தும் இடைச்சேர்க்கையைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: וְהָיוּ עַל
  choice: மேற்பார்வையிட்டார்கள்
  rationale: היה עַל என்ற அமைப்பு ஒன்றின் பொறுப்பில் அல்லது மேற்பார்வையில் இருப்பதைக் குறிக்கிறது. அறைகள் மற்றும் பண்டகசாலைகள் மீதான நிர்வாகப் பொறுப்பைத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: הַלְּשָׁכוֹת
  choice: அறைகள்
  rationale: ஆலயப் பணிகளுடன் தொடர்புடைய அறைகளைக் குறிக்கும் சொல்லுக்கு நவீன வாசகர்கள் எளிதில் புரிந்துகொள்ளும் நேரடியான தமிழ்.
- source_word: הָאֹצְרוֹת
  choice: பண்டகசாலைகள்
  rationale: אֹצָר என்பது பொருட்கள் சேமிக்கப்படும் இடத்தையோ கருவூலத்தையோ குறிக்கலாம். ‘பண்டகசாலைகள்’ என்பது பணம் மட்டுமல்லாமல் சேமிக்கப்பட்ட பலவகைப் பொருட்களையும் உள்ளடக்கும்; மற்றொரு சாத்தியம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: בֵּית הָאֱלֹהִים
  choice: கடவுளின் இல்லம்
  rationale: எபிரெயச் சொற்றொடரின் உருவகத்தையும் ஆலயக் குறிப்பையும் காக்கும் தெளிவான, மரியாதையான மொழிபெயர்ப்பு.
