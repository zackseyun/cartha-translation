source:
  edition: WLC
  text: וּ/פִֽינְחָ֣ס בֶּן אֶלְעָזָ֗ר נָגִ֨יד הָיָ֧ה עֲלֵי/הֶ֛ם לְ/פָנִ֖ים יְהוָ֥ה עִמּֽ/וֹ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/020.yaml
  text: And Phinehas son of Eleazar had formerly been chief over them[a]; Yahweh was with him.
translation:
  language: ta
  text: எலெயாசாரின் மகன் பினெகாஸ் முன்பு அவர்களுக்குத் தலைவராக இருந்தார்[a]; யாவே அவரோடு இருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘முன்பு’ என்பதை ‘தலைவராக இருந்தார்’ என்பதுடன் நெருக்கமாகவோ, முதல் கூற்று முழுவதுடனோ தொடர்புபடுத்தலாம்; எபிரெயச் சொல் வரிசை இரண்டுக்கும் இடமளிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפִינְחָס
  choice: பினெகாஸ்
  rationale: பெயர் வழக்கமான தமிழ் ஒலிபெயர்ப்பில் தரப்பட்டுள்ளது. எபிரெய இணைப்புச்சொல் தமிழில் தேவையற்ற செயற்கைத்தன்மையை ஏற்படுத்தாதபடி தனியாக மொழிபெயர்க்கப்படவில்லை.
- source_word: בֶּן אֶלְעָזָר
  choice: எலெயாசாரின் மகன்
  rationale: எபிரெய மரபுறவுக் கட்டமைப்பை இயல்பான நவீன தமிழில் தெளிவாகத் தருகிறது.
- source_word: נָגִיד
  choice: தலைவர்
  rationale: ஆளுகை அல்லது மேற்பார்வைப் பொறுப்பிலுள்ள ஒருவரைக் குறிக்கிறது; அரசாட்சிப் பொருளை மிகைப்படுத்தாமல் இச்சூழலுக்கு ஏற்ற பொதுவான சொல்லாக உள்ளது.
- source_word: הָיָה
  choice: இருந்தார்
  rationale: לְפָנִים என்பதுடன் சேர்ந்து கடந்த காலத்தில் நிலவிய பொறுப்பைச் சுட்டுகிறது. தமிழில் ‘முன்பு ... இருந்தார்’ என்பது இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עֲלֵיהֶם
  choice: அவர்களுக்குத்
  rationale: முன்னர் குறிப்பிடப்பட்ட காவலர்கள் அல்லது லேவியர்கள் மீதான அதிகாரத்தையோ மேற்பார்வையையோ தமிழில் இயல்பாகக் குறிக்கிறது.
- source_word: לְפָנִים
  choice: முன்பு
  rationale: முந்தைய காலத்தைக் குறிக்கும் எளிய, நவீன தமிழ்ச் சொல். எபிரெயச் சொல் வாக்கியத்தில் எதனுடன் நெருக்கமாக இணைகிறது என்ற சிறிய தெளிவின்மையை அடிக்குறிப்பு பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பட்டத்தை மாற்றீடாக இடாமல், எபிரெய நான்கெழுத்துத் திருப்பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: עִמּוֹ
  choice: அவரோடு இருந்தார்
  rationale: இறைவனின் உடனிருப்பையும் ஆதரவையும் விளக்க விரிவாக்கமின்றி நேரடியாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது; அதை ஒரு பட்டமாக மாற்றாமல் தமிழ் ஒலிபெயர்ப்பில் தருவது மூல வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: ‘யாவே அவரோடு இருந்தார்’ என்பதன் பொருள்
  choice: விளக்க விரிவாக்கமின்றி நேரடியாக மொழிபெயர்த்தல்
  alternative: யாவே அவருக்கு ஆதரவாக இருந்தார்
  rationale: இச்சொற்றொடர் இறை உடனிருப்பையும் அருளான ஆதரவையும் உணர்த்தலாம்; ‘ஆதரவாக’ என்று மட்டும் கூறுவது அதன் பரந்த இறையியல் செறிவைச் சுருக்கிவிடும்.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் எளிமையாகவும், வேதாகம வரலாற்றுரைக்கு ஏற்ற கண்ணியத்துடனும் அமைக்கப்பட்டது. ‘தலைவர்’ நிர்வாக அல்லது வழிபாட்டுப் பொறுப்பைத் தெளிவாகக் காட்டுகிறது; அரசருக்குரிய பொருளைத் தேவையின்றி சேர்ப்பதில்லை.
