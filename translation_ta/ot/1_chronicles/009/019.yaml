  text: וְ/שַׁלּ֣וּם בֶּן ק֠וֹרֵא בֶּן אֶבְיָסָ֨ף בֶּן קֹ֜רַח וְֽ/אֶחָ֧י/ו לְ/בֵית אָבִ֣י/ו הַ/קָּרְחִ֗ים עַ֚ל מְלֶ֣אכֶת הָ/עֲבוֹדָ֔ה שֹׁמְרֵ֥י הַ/סִּפִּ֖ים לָ/אֹ֑הֶל וַ/אֲבֹֽתֵי/הֶם֙ עַל מַחֲנֵ֣ה יְהוָ֔ה שֹׁמְרֵ֖י הַ/מָּבֽוֹא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/019.yaml
  text: And Shallum son of Kore[a], son of Ebiasaph, son of Korah, and his brothers from his father’s house, the Korahites, were over the work of the service, keepers of the thresholds of the tent; and their fathers had been over the camp of Yahweh[b], keepers of the entrance.
translation:
  language: ta
  text: கோரேயின் மகனான, எபியாசாப்பின் மகனான, கோராகின் மகனான சல்லூமும், அவனுடைய தந்தைவழிக் குடும்பத்தைச் சேர்ந்த அவனுடைய சகோதரர்களான கோராகியர்களும், சேவைப் பணிக்குப் பொறுப்பாக, கூடாரத்தின் வாயிற்படிகளைக் காக்கிறவர்களாய் இருந்தார்கள்; அவர்களுடைய முன்னோர்களோ யாவேயின்[a] பாளயத்தின் நுழைவாயிலைக் காக்கிறவர்களாய் இருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “யாவே” என்பது எபிரெய மொழியிலுள்ள YHWH என்ற இறைப்பெயர்; பல மொழிபெயர்ப்புகள் இதை “கர்த்தர்” என்று வழங்குகின்றன.
    reason: divine_name_clarification
lexical_decisions:
- source_word: וְשַׁלּוּם
  choice: சல்லூமும்
  rationale: இணைப்புச் சொல்லை ‘-உம்’ விகுதி இயல்பாக வெளிப்படுத்துகிறது; பெயர் எபிரெய வடிவுக்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டது.
- source_word: בֶּן קוֹרֵא בֶּן אֶבְיָסָף בֶּן קֹרַח
  choice: கோரேயின் மகனும், எபியாசாப்பின் பேரனும், கோராகின் கொள்ளுப்பேரனுமான
  rationale: எபிரெய மொழியின் தொடர்ச்சியான ‘மகன்’ மரபுவழிச் சூத்திரத்தைத் தமிழில் உறவுநிலைகள் தெளிவாகத் தெரியுமாறு இயல்பாக மாற்றுகிறது; வம்சவரிசை அப்படியே காக்கப்படுகிறது.
- source_word: וְאֶחָיו לְבֵית אָבִיו
  choice: அவனுடைய தந்தைவழிக் குடும்பத்தைச் சேர்ந்த அவனுடைய சகோதரர்களும்
  rationale: ‘சகோதரர்கள்’ என்பது மூலத்தின் ஆண்பால் பன்மையைப் பேணுகிறது; ‘தந்தைவழிக் குடும்பம்’ குலக் குடும்பச் சார்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: הַקָּרְחִים
  choice: கோராகியர்கள்
  rationale: கோராகின் வம்சத்தாரைக் குறிக்கும் இன/குலப் பன்மை வடிவம் தமிழில் இயல்பாகத் தரப்படுகிறது.
- source_word: עַל מְלֶאכֶת הָעֲבוֹדָה
  choice: பணிக்குப் பொறுப்பாயிருந்தார்கள்
  rationale: עַל குறிக்கும் மேற்பார்வை அல்லது பொறுப்பைத் தெளிவாக வெளிப்படுத்துகிறது; ஒரே கருத்தை மீளச்சொல்லும் செயற்கையான சொற்றொடர் தவிர்க்கப்படுகிறது.
- source_word: שֹׁמְרֵי הַסִּפִּים לָאֹהֶל
  choice: கூடாரத்தின் வாயிற்படிகளைக் காவல்காக்கும்
  rationale: סִפִּים என்பதன் உறுதியான ‘வாயிற்படிகள்/நிலைப்படிகள்’ என்ற உருவகத்தைப் பேணுகிறது; אֹהֶל என்பதற்கு தொழில்நுட்பமான ‘திருக்கூடாரம்’ என்பதற்குப் பதில் நேரடியான ‘கூடாரம்’ பயன்படுத்தப்படுகிறது.
- source_word: וַאֲבֹתֵיהֶם
  choice: அவர்களுடைய முன்னோர்களோ
  rationale: இங்கு முந்தைய தலைமுறைகளைச் சுட்டுவதால், தமிழில் ‘முன்னோர்கள்’ காலப்பின்னோக்கை இயல்பாகத் தெரிவிக்கிறது.
- source_word: עַל מַחֲנֵה יְהוָה
  choice: யாவேயின் பாளயத்தின்
  rationale: சூழலில் עַל பொறுப்பை உணர்த்தினாலும், அடுத்த காவல் பங்கு அதைத் தமிழில் தெளிவாக்குகிறது; மַחֲנֶה ‘பாளயம்’ என்றும், தெய்வீகப் பெயர் ஒலிபெயர்ப்பாகவும் தரப்பட்டுள்ளது.
- source_word: שֹׁמְרֵי הַמָּבוֹא
  choice: நுழைவாயிலைக் காவல்காப்பவர்களாக
  rationale: מָבוֹא என்பது உள்ளே செல்லும் இடம் அல்லது நுழைவைக் குறிக்கிறது; ‘நுழைவாயில்’ இச்சூழலில் இயல்பாகவும் துல்லியமாகவும் உள்ளது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பட்டப்பெயர் அல்லாமல் நான்கெழுத்துத் தெய்வீகப் பெயரே உள்ளது. ‘யாவே’ அதைத் தனிப்பட்ட பெயராகப் பேணுகிறது; தமிழ் வாசகர்களுக்குப் பழக்கமான மாற்றை அடிக்குறிப்பு குறிப்பிடுகிறது.
- issue: אֹהֶל என்பதைக் குறிப்பிட்ட சமயத் தொழில்நுட்பச் சொல்லாக்க வேண்டுமா
  choice: கூடாரம்
  alternative: திருக்கூடாரம்
  rationale: மூலச் சொல் நேரடியாக ‘கூடாரம்’ என்பதே. அது பரிசுத்த ஸ்தலத்தைக் குறிக்கிறது என்பதைச் சூழல் உணர்த்தட்டும்; மொழிபெயர்ப்பு மேலதிக தொழில்நுட்பப் பொருளைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, வாசிக்க எளிய நடை பயன்படுத்தப்பட்டுள்ளது. நீண்ட எபிரெய வம்சவரிசை தமிழில் ‘மகன்—பேரன்—கொள்ளுப்பேரன்’ எனத் தெளிவாக்கப்பட்டுள்ளது. ‘வாயிற்படிகள்’ என்ற நேரடியான உருவகம் காக்கப்பட்டு, காவலர் பணியின் சூழல் இயல்பான வாக்கிய அமைப்பில் தரப்பட்டுள்ளது.
