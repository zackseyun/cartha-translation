translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதையான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தில் עַל மீண்டும் மீண்டும் வருவது தமிழில் ஒவ்வொரு பெயருடனும் ‘-க்கும்’ எனக் காட்டப்பட்டு, இறுதியில் ‘பொறுப்பாக நியமிக்கப்பட்டிருந்தனர்’ என்பதுடன் இயல்பாக இணைக்கப்பட்டுள்ளது.
