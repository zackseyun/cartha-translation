  text: וּ/מֵ/הֶ֗ם מְמֻנִּים֙ עַל הַ/כֵּלִ֔ים וְ/עַ֖ל כָּל כְּלֵ֣י הַ/קֹּ֑דֶשׁ וְ/עַל הַ/סֹּ֨לֶת֙ וְ/הַ/יַּ֣יִן וְ/הַ/שֶּׁ֔מֶן וְ/הַ/לְּבוֹנָ֖ה וְ/הַ/בְּשָׂמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/029.yaml
  text: And some of them were appointed over the vessels[a], over all the holy vessels, and over the fine flour, the wine, the oil, the frankincense, and the spices.
translation:
  language: ta
  text: அவர்களில் சிலர் கருவிகளுக்கும், பரிசுத்தப் பாத்திரங்கள் அனைத்துக்கும்[a], மெல்லிய மாவுக்கும், திராட்சை மதுவுக்கும், எண்ணெய்க்கும், குங்கிலியத்துக்கும், நறுமணப் பொருள்களுக்கும் பொறுப்பாக நியமிக்கப்பட்டிருந்தனர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பரிசுத்த இடத்தின் பாத்திரங்கள் அனைத்துக்கும்.”
    reason: הַקֹּדֶשׁ என்பதை ‘பரிசுத்தமானவை’ என்றும் ‘பரிசுத்த இடம்’ என்றும் புரிந்துகொள்ளக்கூடிய சொற்பொருள் வாய்ப்பைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: וּמֵהֶם
  choice: அவர்களில் சிலர்
  rationale: מִן என்பதன் பகுதியைக் குறிக்கும் பொருளை இயல்பான நவீன தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: מְמֻנִּים עַל
  choice: பொறுப்பாக நியமிக்கப்பட்டிருந்தனர்
  rationale: ஒப்படைக்கப்பட்ட பொறுப்பையும் செயலின் நிறைவேற்றப்பட்ட நிலை தொடர்வதையும் வெளிப்படுத்துகிறது; தனிப்பட்ட பதவிப் பெயரை உரையில் சேர்ப்பதில்லை.
- source_word: הַכֵּלִים
  choice: கருவிகள்
  rationale: כְּלִי என்பது கருவிகள், உபகரணங்கள், பாத்திரங்கள் ஆகியவற்றைக் குறிக்கக்கூடிய விரிவான சொல்; அடுத்துவரும் பரிசுத்தப் பாத்திரங்களிலிருந்து வேறுபடுத்த இங்கு பொதுவான ‘கருவிகள்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: כָּל כְּלֵי הַקֹּדֶשׁ
  choice: பரிசுத்தப் பாத்திரங்கள் அனைத்தும்
  rationale: ‘பரிசுத்தத்துக்குரிய எல்லாப் பாத்திரங்கள்’ என்ற எபிரெயக் கட்டமைப்பைச் சுருக்கமாகவும் வழிபாட்டுச் சூழலுக்கு ஏற்றவாறும் தருகிறது; ‘பரிசுத்த இடத்தின் பாத்திரங்கள்’ என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பு தரப்பட்டுள்ளது.
- source_word: הַסֹּלֶת
  choice: மெல்லிய மாவு
  rationale: காணிக்கைகளுக்குப் பயன்படுத்தப்பட்ட நன்றாக அரைக்கப்பட்ட மாவைக் குறிக்கும் சொல்லின் குறிப்பான பொருளைப் பாதுகாக்கிறது.
- source_word: הַיַּיִן
  choice: திராட்சை மது
  rationale: יַיִן என்பதன் இயல்பான பொருளைத் தெளிவாகத் தருகிறது; கோவில் பயன்பாடு சூழலால் அறியப்படுகிறது.
- source_word: הַשֶּׁמֶן
  choice: எண்ணெய்
  rationale: மூலத்தில் எண்ணெயின் வகை வெளிப்படையாகக் குறிப்பிடப்படாததால் ‘ஒலிவ எண்ணெய்’ என்று விரிவாக்கப்படவில்லை.
- source_word: הַלְּבוֹנָה
  choice: குங்கிலியம்
  rationale: לְבוֹנָה பொதுவான தூபத்தை அல்ல, குறிப்பாக frankincense வகை நறுமணப் பிசினைக் குறிக்கிறது.
- source_word: הַבְּשָׂמִים
  choice: நறுமணப் பொருள்கள்
  rationale: புனிதப் பயன்பாட்டுக்குரிய பலவகை மணமுள்ள பொருள்களை உள்ளடக்கும் விரிவான, இயல்பான தமிழ்ச் சொற்றொடர்.
