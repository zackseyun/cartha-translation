base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/020/008.yaml
  text: These were born to Rapha in Gath[a], and they fell by the hand of David and by the hand of his servants.
translation:
  language: ta
  text: இவர்கள் காத்தில் ராபாவுக்குப் பிறந்தவர்கள்; தாவீதின் கையாலும் அவனுடைய பணியாளர்களின் கையாலும் வீழ்ந்தனர்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵל
  choice: இவர்கள்
  rationale: முன்னர் குறிப்பிடப்பட்ட போர்வீரர்களைச் சுட்டும் பன்மைச் சுட்டுப்பெயர்; எபிரெயத்தில் மீண்டும் சொல்லப்படாத ‘மனிதர்கள்’ போன்ற சொல்லைச் சேர்க்கவில்லை.
- source_word: נוּלְּדוּ
  choice: பிறந்தவர்கள்
  rationale: ילד என்பதன் நிஃபால் வடிவின் நேரடிப் பொருள் ‘பிறத்தல்’; இங்கு வம்சவழித் தொடர்பையும் இயல்பாக உணர்த்துகிறது.
- source_word: לְהָרָפָא
  choice: ராபாவுக்கு
  rationale: ל முன்னொட்டின் உறவு/வம்சவழிப் பொருளைப் பேணுகிறது. הָרָפָא என்பது தனிப்பட்ட மூதாதையையோ ஒரு வம்சக் குழுவையோ குறிக்கலாம்; ‘இராட்சதன்’ எனத் தீர்மானமாக மொழிபெயர்ப்பதைத் தவிர்க்கிறது.
- source_word: בְּגַת
  choice: காத்தில்
  rationale: ב என்னும் இடப்பொருள் முன்னொட்டையும் காத்து என்னும் இடப்பெயரையும் இயல்பான தமிழில் தருகிறது.
- source_word: וַיִּפְּלוּ
  choice: வீழ்ந்தார்கள்
  rationale: נפל என்பதன் ‘விழுதல்’ என்ற உருவகத்தைப் பேணுகிறது; போர்ச் சூழலில் கொல்லப்பட்டார்கள் அல்லது தோற்கடிக்கப்பட்டார்கள் என்பதை உணர்த்துகிறது.
- source_word: בְיַד
  choice: கையால்
  rationale: செயற்படுத்தும் நபரைக் குறிக்கும் எபிரெய மரபுத்தொடரான ‘கையால்’ என்பதைத் தமிழிலும் பேணுகிறது.
- source_word: עֲבָדָיו
  choice: அவனுடைய பணியாளர்கள்
  rationale: עבד என்பதன் அடிப்படைப் பொருளைப் பேணுகிறது; அரச/படைச் சூழலில் தாவீதின் சேவையில் இருந்த வீரர்களையும் இது உள்ளடக்கலாம்.
theological_decisions:
- issue: הָרָפָא என்பவரின் அல்லது குழுவின் அடையாளம்
  choice: ‘ராபா’ என்பதை வம்ச மூதாதை அல்லது வம்சக் குழுவைக் குறிக்கக்கூடிய பெயராக ஒலிபெயர்த்தல்
  alternative: ‘இராட்சதன்’ அல்லது ‘ரெப்பாயீமினர்’ என்று பொருளுரை செய்தல்
  rationale: எபிரெய வடிவம் ஒருமையில் சுட்டுப்பெயருடன் வருகிறது; பொதுவான பன்மை வடிவமான ‘ரெப்பாயீம்’ இங்கு இல்லை. ஆகவே இராட்சத வம்சத்துடனான சாத்தியமான தொடர்பைக் குறிப்பில் தெரிவித்து, மூலத்தின் தெளிவின்மையை முதன்மை உரையில் பேணுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘கையால்’ மற்றும் ‘வீழ்ந்தார்கள்’ ஆகியவை மூல எபிரெய உருவகங்களைப் பேணுகின்றன; ‘பணியாளர்கள்’ என்பது அரச மற்றும் படைச் சேவை இரண்டையும் உள்ளடக்கக்கூடிய சொல்லாகத் தேர்ந்தெடுக்கப்பட்டது.
