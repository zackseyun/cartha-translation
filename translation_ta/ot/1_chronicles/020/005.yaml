source:
  edition: WLC
  text: וַ/תְּהִי ע֥וֹד מִלְחָמָ֖ה אֶת פְּלִשְׁתִּ֑ים וַ/יַּ֞ךְ אֶלְחָנָ֣ן בֶּן יעור אֶת לַחְמִי֙ אֲחִי֙ גָּלְיָ֣ת הַ/גִּתִּ֔י וְ/עֵ֣ץ חֲנִית֔/וֹ כִּ/מְנ֖וֹר אֹרְגִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/020/005.yaml
  text: And there was war with the Philistines again[a], and Elhanan son of Jair struck down Lahmi, the brother of Goliath the Gittite, whose spear shaft was like a weaver’s beam.
translation:
  language: ta
  text: மீண்டும் பெலிஸ்தியரோடு போர் நடந்தது.[a] அப்போது யாயீரின் மகன் எல்கானான், காத்தியனான கோலியாத்தின் சகோதரன் லக்மியைக் கொன்றான். லக்மியின் ஈட்டித் தண்டு நெசவாளரின் பாவுமரத்தைப் போல இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதற்கு இணையான 2 சாமுவேல் 21:19-இன் எபிரேய வாசகம் கடினமானது; அது எல்கானான் கோலியாத்தையே கொன்றதாகத் தோன்றக்கூடும். ஆனால் நாளாகமம், எல்கானான் கொன்றது கோலியாத்தின் சகோதரன் லக்மி என்று வெளிப்படையாகக் கூறுகிறது.
    reason: textual_variant
lexical_decisions:
- source_word: וַתְּהִי עוֹד מִלְחָמָה
  choice: மீண்டும் ... போர் நடந்தது
  rationale: עוֹד தொடரில் இன்னொரு நிகழ்வைக் குறிக்கும் என்பதால் ‘மீண்டும்’ எனவும், מִלְחָמָה இயல்பான நவீனத் தமிழில் ‘போர்’ எனவும் மொழிபெயர்க்கப்பட்டது.
- source_word: אֶת פְּלִשְׁתִּים
  choice: பெலிஸ்தியரோடு
  rationale: மோதலில் எதிர்த்தரப்பைக் குறிக்கும் אֶת, ‘போர் நடந்தது’ என்பதுடன் இயல்பாக அமைய ‘-ஓடு’ எனத் தரப்பட்டது; இது கூட்டணியை அல்ல, போரிட்ட எதிர்த்தரப்பைக் குறிக்கிறது.
- source_word: וַיַּךְ
  choice: கொன்றான்
  rationale: נכה என்பதன் அடிப்படை உருவகம் ‘அடித்தல்/வீழ்த்துதல்’ என்றாலும், இப்போர் சூழலில் உயிரிழப்பு தெளிவாகக் குறிக்கப்படுகிறது. தமிழில் ‘வீழ்த்தினான்’ தெளிவற்றிருக்கக்கூடும் என்பதால் ‘கொன்றான்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: אֶלְחָנָן בֶּן יעור
  choice: யாயீரின் மகன் எல்கானான்
  rationale: எபிரேய வம்சக் குறிப்பை இயல்பான தமிழ் சொல்வரிசையில் வழங்குகிறது; יעור இவ்வசனத்தின் பாரம்பரிய அடையாளத்தின்படி ‘யாயீர்’ என ஒலிபெயர்க்கப்பட்டது.
- source_word: אֶת לַחְמִי
  choice: லக்மியை
  rationale: மசோரா உயிர்க்குறிப்பும் நாளாகமத்தின் வாக்கிய அமைப்பும் לַחְמִי என்பதை ‘லக்மி’ என்ற தனிப்பெயராகக் காட்டுகின்றன; אֶת வேற்றுமை உருபாக ‘-ஐ’ மூலம் வெளிப்படுகிறது.
- source_word: אֲחִי גָּלְיָת
  choice: கோலியாத்தின் சகோதரன்
  rationale: எபிரேய இணைப்புநிலைத் தொடர் உறவை வெளிப்படையாகக் கூறுவதால் அதே தெளிவு பாதுகாக்கப்பட்டது.
- source_word: הַגִּתִּי
  choice: கித்தியனான
  rationale: காத் ஊரைச் சேர்ந்தவர் என்ற இன/இடப்பெயர் அடையாளத்தை மரபான ‘கித்தியன்’ வடிவில் பாதுகாக்கிறது.
- source_word: וְעֵץ חֲנִיתוֹ
  choice: லக்மியின் ஈட்டித் தண்டு
  rationale: சொல்லுக்கு சொல் ‘அவனுடைய ஈட்டியின் மரம்’ என்பதற்குப் பதிலாக, பொருளைத் தெளிவாகத் தரும் ‘ஈட்டித் தண்டு’ பயன்படுத்தப்பட்டது. சுட்டுப்பெயரின் தொடர்பு குழப்பமடையாமல் ‘லக்மியின்’ என வெளிப்படுத்தப்பட்டது.
- source_word: כִּמְנוֹר אֹרְגִים
  choice: நெசவாளரின் பாவுமரத்தைப் போல
  rationale: מְנוֹר אֹרְגִים என்பது நெசவுத் தறியின் கனமான beam-ஐக் குறிக்கிறது. தமிழில் தறியின் அந்த உறுப்புக்குரிய துல்லியமான சொல்லான ‘பாவுமரம்’ ஒப்புமையின் வலிமையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: 2 சாமுவேல் 21:19-இன் கடினமான இணை வாசகத்துடனான தொடர்பு
  choice: நாளாகமத்தின் வெளிப்படையான வாசகத்தையே பின்பற்றி, எல்கானான் கோலியாத்தின் சகோதரன் லக்மியைக் கொன்றான் என மொழிபெயர்த்தல்
  alternative: சாமுவேல் இணைப்பகுதியை ஒத்திசைக்க இந்த வசனத்தின் சொற்களைத் திருத்திப் புரிதல், அல்லது லக்மி என்பதை ‘பெத்லகேமியன்’ என்பதன் பகுதியாக வாசித்தல்
  rationale: இவ்வசனத்தின் எபிரேய உரை லக்மியைத் தனிப்பெயராகவும் கோலியாத்தின் சகோதரனாகவும் தெளிவாகக் குறிப்பிடுகிறது. இணைப்பகுதியின் உரைச் சிக்கலை இங்கே புகுத்தாமல், அது அடிக்குறிப்பில் நேர்மையாகக் குறிப்பிடப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘பாவுமரம்’ என்பது நெசவுத் தறியின் பெரிய கிடைமட்டத் தண்டைக் குறிக்கும் துல்லியமான தமிழ் தொழில்சொல். பெயர்கள் தமிழ் வேதாகமப் பயன்பாட்டுடன் ஒத்த ஒலிபெயர்ப்பில் தரப்பட்டுள்ளன.
