  terminology: ‘பெலிஸ்தியர்,’ ‘எல்கானான்,’ ‘யாயீர்,’ ‘லக்மி,’ and ‘கோலியாத்’ are suitable. ‘காத்தியனான’ is preferable to ‘கித்தியனான’ for הַגִּתִּי, since Gath is normally rendered ‘காத்’ in Tamil biblical usage.
