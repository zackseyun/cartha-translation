  text: וַ/תְּהִי ע֥וֹד מִלְחָמָ֖ה בְּ/גַ֑ת וַ/יְהִ֣י אִ֣ישׁ מִדָּ֗ה וְ/אֶצְבְּעֹתָ֤י/ו שֵׁשׁ וָ/שֵׁשׁ֙ עֶשְׂרִ֣ים וְ/אַרְבַּ֔ע וְ/גַם ה֖וּא נוֹלַ֥ד לְ/הָ/רָפָֽא־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/020/006.yaml
  text: And there was war again at Gath[a], and there was a man of great size whose fingers and toes were six each, twenty-four in all; he also was born to Rapha.
translation:
  language: ta
  text: காத்தில் மீண்டும் போர் நடந்தது. அங்கே மிகுந்த உயரமுள்ள ஒரு மனிதன் இருந்தான். அவனுடைய கைவிரல்களும் கால்விரல்களும் ஒவ்வொன்றிலும் ஆறு வீதம், மொத்தம் இருபத்துநான்கு இருந்தன. அவனும் ராப்பாவுக்குப் பிறந்தவன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இராட்சதனின் வழிவந்தவன்,” அல்லது “ரெப்பாயீம்களில் ஒருவன்.” எபிரெயத்தில், “ராப்பாவுக்குப் பிறந்தவன்” என்று உள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: עוֹד
  choice: மீண்டும்
  rationale: கதைத் தொடரில் போர் மறுபடியும் நிகழ்ந்ததை இயல்பாகக் குறிக்கிறது.
- source_word: מִלְחָמָה
  choice: போர்
  rationale: ஒரு தனிப்பட்ட மோதலைவிடப் பரந்த போர் நிகழ்வைக் குறிக்கும் பெயர்ச்சொல்லுக்கு ஏற்ற நவீன தமிழ்.
- source_word: בְּגַת
  choice: காத்தில்
  rationale: בְּ என்னும் இடப்பொருள் முன்னொட்டைத் தமிழில் இயல்பாக இடவேற்றுமையால் தருகிறது.
- source_word: אִישׁ מִדָּה
  choice: மிகுந்த உயரமுள்ள ஒரு மனிதன்
  rationale: சொல்லடியாக ‘அளவுடைய மனிதன்’; சூழலில் அசாதாரண உடல் உயரத்தைச் சுட்டுவதால் இவ்வாறு மொழிபெயர்க்கப்பட்டது. ‘இராட்சதன்’ என்று விளக்கத்தை முதன்மை உரைக்குள் கொண்டுவரவில்லை.
- source_word: אֶצְבְּעֹתָיו
  choice: அவனுடைய கைவிரல்களும் கால்விரல்களும்
  rationale: எபிரெயச் சொல் பொதுவாக விரல்களைக் குறித்தாலும், ஆறு ஆறாக மொத்தம் இருபத்துநான்கு என்ற விவரமும் இணை உரையும் கைகள் மற்றும் கால்கள் இரண்டையும் குறிக்கின்றன.
- source_word: שֵׁשׁ וָשֵׁשׁ
  choice: ஒவ்வொன்றிலும் ஆறு வீதம்
  rationale: ஒவ்வொரு கை மற்றும் காலிலும் ஆறு என்ற பகிர்வுப் பொருளைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: עֶשְׂרִים וְאַרְבַּע
  choice: மொத்தம் இருபத்துநான்கு
  rationale: முன்னர் கூறிய எண்ணிக்கையின் கூட்டுத்தொகை என்பதைத் தெளிவுபடுத்துகிறது.
- source_word: וְגַם הוּא
  choice: அவனும்
  rationale: முந்தைய சூழலில் குறிப்பிடப்பட்டவர்களுடன் இவனையும் இணைக்கும் வலியுறுத்தலைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: נוֹלַד לְהָרָפָא
  choice: ராப்பாவுக்குப் பிறந்தவன்
  rationale: ‘ராப்பாவுக்குப் பிறந்தான்’ என்ற எபிரெயச் சொற்றொடரின் உருவத்தையும், அது முன்னோர் பெயரா அல்லது குலக் குறிப்பா என்ற தெளிவின்மையையும் பாதுகாக்கிறது.
theological_decisions:
- issue: הָרָפָא என்பதன் அடையாளம்
  choice: முதன்மை உரையில் ‘ராப்பா’ என ஒலிபெயர்த்து, பிறப்பு/வம்சத் தொடர்பைக் காக்குதல்
  alternative: ‘இராட்சதனின் வழிவந்தவன்’ அல்லது ‘ரெப்பாயீம்களில் ஒருவன்’
  rationale: எபிரெய வடிவம் ஒருமையில் குறிப்புச் சுட்டுடன் வருகிறது; அது பெயரிடப்பட்ட முன்னோரையோ ஒரு குலத்தையோ குறிக்கலாம். ஒலிபெயர்ப்பு இந்த உண்மையான தெளிவின்மையைத் தீர்த்துவிடாமல் பாதுகாக்கிறது; விளக்க வாசிப்புகள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டது. நீண்ட எபிரெய இணைப்புத் தொடரைத் தமிழின் இயல்புக்கேற்ப மூன்று வாக்கியங்களாகப் பிரித்துள்ளோம்; பொருள் உறவுகள் அனைத்தும் காக்கப்பட்டுள்ளன.
