base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/020/001.yaml
  text: And it happened at the time of the turning of the year[a], at the time when kings go out, that Joab led out the army and devastated the land of the Ammonites, and he came and besieged Rabbah. But David stayed in Jerusalem. And Joab struck Rabbah and tore it down.
translation:
  language: ta
  text: ஆண்டு திரும்பும் காலத்தில்[a], அரசர்கள் புறப்படும் வேளையில், யோவாப் படையை வழிநடத்திச் சென்று, அம்மோனியரின் நாட்டைப் பாழாக்கினார். பின்பு அவர் வந்து ரப்பாவை முற்றுகையிட்டார். ஆனால் தாவீது எருசலேமிலேயே தங்கியிருந்தார். யோவாப் ரப்பாவைத் தாக்கி அதை இடித்துத் தள்ளினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, கூடுதல் விளக்கமாக, “வசந்தகாலத்தில், அரசர்கள் போருக்குப் புறப்படும் வேளையில்.” எபிரெயத்தில் இன்னும் சொற்சார்பாக, “ஆண்டு திரும்பும் காலத்தில், அரசர்கள் புறப்படும் வேளையில்” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּשׁוּבַת הַשָּׁנָה
  choice: ஆண்டு திரும்பும் காலத்தில்
  rationale: எபிரெயச் சொற்றொடரின் ‘ஆண்டு திரும்புதல்’ என்ற உருவகத்தைத் தக்கவைத்து, வசந்தகாலம் என்ற சூழல்சார் விளக்கத்தை முதன்மை உரையில் கட்டாயப்படுத்தாமல் விடுகிறது.
- source_word: לְעֵת צֵאת הַמְּלָכִים
  choice: அரசர்கள் போருக்குப் புறப்படும் வேளையில்
  rationale: ‘அரசர்கள் புறப்படும் வேளை’ என்பதே நேரடி அமைப்பு; தமிழில் நோக்கம் முற்றிலும் விடப்பட்டால் தெளிவு குறைவதால், உடனடி இராணுவச் சூழலை வெளிப்படுத்த ‘போருக்கு’ சேர்க்கப்பட்டுள்ளது.
- source_word: וַיִּנְהַג
  choice: வழிநடத்திச் சென்று
  rationale: படையை முன்னின்று நடத்திச் சென்ற இராணுவச் செயலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: חֵיל הַצָּבָא
  choice: படையை
  rationale: இணைந்துள்ள இரு எபிரெயப் பெயர்ச்சொற்களும் இராணுவப் படையைக் குறிக்கின்றன; தமிழில் தேவையற்ற இரட்டிப்பைத் தவிர்க்கிறது.
- source_word: וַיַּשְׁחֵת אֶת אֶרֶץ בְּנֵי עַמּוֹן
  choice: அம்மோனியரின் நாட்டைப் பாழாக்கினார்
  rationale: இராணுவ நடவடிக்கையால் நாட்டை அழிவுக்குள்ளாக்கிய பொருளைத் தருகிறது; ‘அம்மோனின் புதல்வர்கள்’ என்பதற்குப் பதில் இயல்பான இனப்பெயர் பயன்படுத்தப்பட்டுள்ளது.
- source_word: וַיָּצַר
  choice: முற்றுகையிட்டார்
  rationale: நகரைச் சூழ்ந்து கைப்பற்ற முயலும் இராணுவச் செயலைத் துல்லியமாகக் குறிக்கிறது.
- source_word: וְדָוִיד יֹשֵׁב בִּירוּשָׁלִָם
  choice: ஆனால் தாவீது எருசலேமிலேயே தங்கியிருந்தார்
  rationale: எபிரெய வினையெச்சத்தின் தொடர்நிலைப் பொருளையும், யோவாப் சென்றதற்கு மாறாகத் தாவீது அங்கேயே இருந்த வேறுபாட்டையும் வெளிப்படுத்துகிறது.
- source_word: וַיַּךְ
  choice: தாக்கி
  rationale: இந்த இடத்தில் நகருக்கு எதிரான இராணுவத் தாக்குதலை இயல்பாகக் குறிக்கிறது; ‘தோற்கடித்தார்’ என்று முடிவை அளவுக்கு மீறி குறிப்பாக்கவில்லை.
- source_word: וַיֶּהֶרְסֶהָ
  choice: அதை இடித்துத் தள்ளினார்
  rationale: நகரை அல்லது அதன் கட்டமைப்புகளை இடித்து அழித்த செயலைத் தெளிவாகக் கூறி, முன்னர் வந்த ‘பாழாக்கினார்’ என்பதிலிருந்து வேறுபடுத்துகிறது.
- source_word: רַבָּה
  choice: ரப்பா
  rationale: நகரின் பெயரைத் தமிழில் வழக்கமான ஒலிபெயர்ப்பாக வழங்குகிறது.
