  text: וַ/יִּקַּ֣ח דָּוִ֣יד אֶת עֲטֶֽרֶת מַלְכָּ/ם֩ מֵ/עַ֨ל רֹאשׁ֜/וֹ וַֽ/יִּמְצָאָ֣/הּ מִשְׁקַ֣ל כִּכַּר זָהָ֗ב וּ/בָ/הּ֙ אֶ֣בֶן יְקָרָ֔ה וַ/תְּהִ֖י עַל רֹ֣אשׁ דָּוִ֑יד וּ/שְׁלַ֥ל הָ/עִ֛יר הוֹצִ֖יא הַרְבֵּ֥ה מְאֹֽד־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/020/002.yaml
  text: And David took the crown of their king from his head and found that it weighed a talent of gold, and in it was a precious stone; and it was placed on David’s head. And he carried off very much plunder from the city.
translation:
  language: ta
  text: தாவீது அவர்களுடைய அரசனின்[a] தலையிலிருந்த கிரீடத்தை எடுத்தான். அதன் எடை ஒரு தாலந்து தங்கம் என்றும், அதில் விலையுயர்ந்த ஒரு கல் இருந்தது என்றும் கண்டான். அந்தக் கிரீடம் தாவீதின் தலையில் இருந்தது. நகரத்திலிருந்து ஏராளமான கொள்ளைப்பொருளையும் அவன் எடுத்துச் சென்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மில்கோமின் கிரீடத்தை” (அல்லது “மல்காமின் கிரீடத்தை”). இங்கு மַלְכָּם என்ற சொல்லை “அவர்களுடைய அரசன்” என்பதற்குப் பதிலாக அம்மோனியரின் தெய்வப் பெயராகவும் வாசிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: עֲטֶרֶת
  choice: கிரீடம்
  rationale: அரசரின் தலையணியைத் தெளிவாகக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொல்.
- source_word: מַלְכָּם
  choice: அவர்களுடைய அரசன்
  rationale: மூன்றாம் நபர் ஆண்பால் பன்மை உடைமை விகுதியுடன் இதை வாசிப்பது இயல்பானது; தொடர்ந்து வரும் ‘அவனுடைய தலையிலிருந்து’ என்ற தொடரும் மனித அரசனைக் குறிக்க ஏதுவாக உள்ளது. தெய்வப் பெயராக வாசிக்கும் வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: מֵעַל רֹאשׁוֹ
  choice: தலையிலிருந்த
  rationale: ‘அவனுடைய தலையின் மேலிருந்து’ என்ற எபிரெயச் சொல்லமைப்பின் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: וַיִּמְצָאָהּ מִשְׁקַל כִּכַּר זָהָב
  choice: அது ஒரு தாலந்து தங்கம் எடையுள்ளது என்று கண்டான்
  rationale: கிரீடத்தின் எடையைத் தாவீது அறிந்துகொண்டான் என்ற பொருளைத் தெளிவாகத் தருகிறது; பண்டைய அளவான ‘தாலந்து’ மாற்றமின்றி வைக்கப்படுகிறது.
- source_word: אֶבֶן יְקָרָה
  choice: விலையுயர்ந்த ஒரு கல்
  rationale: கல்லின் வகையைத் தேவையின்றி குறிப்பாக்காமல், மூலத்தின் ஒருமையையும் மதிப்பையும் நேரடியாகக் காக்கிறது.
- source_word: וַתְּהִי עַל רֹאשׁ דָּוִיד
  choice: அந்தக் கிரீடம் தாவீதின் தலையில் இருந்தது
  rationale: எபிரெயில் கூறப்படாத ‘வைக்கப்பட்டது’ என்ற செயப்படுபொருள் கருத்தைச் சேர்க்காமல், ‘தாவீதின் தலையில் இருந்தது’ என்பதை நேரடியாகத் தருகிறது.
- source_word: וּשְׁלַל הָעִיר
  choice: நகரத்திலிருந்து கொள்ளைப்பொருள்
  rationale: போர்ச்சூழலில் שָׁלָל என்பதற்கான தெளிவான, தற்போதைய தமிழ் இணை.
- source_word: הוֹצִיא הַרְבֵּה מְאֹד
  choice: ஏராளமாக எடுத்துச் சென்றான்
  rationale: நகரிலிருந்து போர்க்கொள்ளையை வெளியே கொண்டு சென்ற செயலையும் அதன் மிகுந்த அளவையும் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: מַלְכָּם என்பது ‘அவர்களுடைய அரசன்’ என்பதைக் குறிக்கிறதா, அம்மோனியத் தெய்வமான மில்கோம்/மல்காம் என்பதைக் குறிக்கிறதா?
  choice: அவர்களுடைய அரசன்
  alternative: மில்கோமின் (அல்லது மல்காமின்) கிரீடம்
  rationale: சொல்லின் வடிவமும் ‘அவனுடைய தலையிலிருந்து’ என்ற உடனடிச் சூழலும் அரசனைக் குறிக்கும் வாசிப்புக்கு ஆதரவளிக்கின்றன. எனினும் தெய்வப் பெயராக வாசிப்பதும் உண்மையான சாத்தியம் என்பதால் அது அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெயின் தொடர் வாக்கிய அமைப்பு தமிழில் தெளிவுக்காகப் பிரிக்கப்பட்டுள்ளது; உண்மையான சொற்பொருள் ஐயம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
