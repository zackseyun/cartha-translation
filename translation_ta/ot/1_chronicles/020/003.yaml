  text: וְ/אֶת הָ/עָ֨ם אֲשֶׁר בָּ֜/הּ הוֹצִ֗יא וַ/יָּ֨שַׂר בַּ/מְּגֵרָ֜ה וּ/בַ/חֲרִיצֵ֤י הַ/בַּרְזֶל֙ וּ/בַ/מְּגֵר֔וֹת וְ/כֵן֙ יַעֲשֶׂ֣ה דָוִ֔יד לְ/כֹ֖ל עָרֵ֣י בְנֵי עַמּ֑וֹן וַ/יָּ֧שָׁב דָּוִ֛יד וְ/כָל הָ/עָ֖ם יְרוּשָׁלִָֽם־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/020/003.yaml
  text: He brought out the people who were in it and put them to work with saws[a], iron tools, and axes. Thus David did to all the cities of the Ammonites[b]. Then David and all the people returned to Jerusalem.
translation:
  language: ta
  text: அதில் இருந்த மக்களை அவன் வெளியே கொண்டுவந்து, அவர்களை ரம்பங்கள்[a], இரும்புக் கருவிகள்[b], கோடரிகள் ஆகியவற்றைக் கொண்டு வேலை செய்ய வைத்தான். அம்மோனியரின் எல்லா நகரங்களிலும் தாவீது இவ்வாறே செய்தான். பின்னர் தாவீதும் எல்லா மக்களும் எருசலேமுக்குத் திரும்பினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ஒருவேளை, “அவர்களை ரம்பங்களுக்கும் இரும்பாலான போரடிக்கும் பலகைகளுக்கும் வெட்டுக் கருவிகளுக்கும் உட்படுத்தினான்.” 2 சாமுவேல் 12:31-ன் இணையான பகுதியின் தாக்கத்தில், இக்கருவிகளால் தாவீது அவர்களைக் கொன்றான் என்று சிலர் இவ்வசனத்தைப் புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
  - marker: b
    text: இங்கு வரும் கருவிகளுக்கான எபிரெயச் சொற்களில் சிலவற்றின் துல்லியமான பொருள் நிச்சயமில்லை; “இரும்புக் கருவிகள், கோடரிகள்” என்று மொழிபெயர்க்கப்பட்ட சொற்றொடர் பொதுவாக இரும்பாலான கூரிய வெட்டுக் கருவிகளைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹצִיא
  choice: வெளியே கொண்டுவந்து
  rationale: יצא என்பதன் ஹிஃபீல் வடிவம் ஒருவரை அல்லது ஒரு குழுவை வெளியே கொண்டுவருதல் என்னும் பொருளை இயல்பாகக் கொண்டுள்ளது.
- source_word: וַיָּשַׂר
  choice: வேலை செய்ய வைத்தான்
  rationale: இவ்வினைச்சொல் கடினமானது. நாளாகமத்தின் தனிப்பட்ட சொற்றொடர், பட்டியலிடப்பட்ட கருவிகளைக் கொண்டு மக்களை வேலை செய்ய வைத்ததாகப் புரிந்துகொள்ள இடமளிக்கிறது; சாமுவேல் இணைப்பகுதியின் கடுமையான பொருளை இங்கே கட்டாயமாகப் புகுத்தவில்லை.
- source_word: בַּמְּגֵרָה
  choice: இரம்பங்கள்
  rationale: מְגֵרָה என்பது அறுக்கும் இரம்பத்தைக் குறிக்கிறது; கருவிகளின் பட்டியலில் தமிழ்ப் பன்மை இயல்பாக உள்ளது.
- source_word: בַּחֲרִיצֵי הַבַּרְזֶל
  choice: இரும்புக் கருவிகள்
  rationale: இந்தச் சொற்றொடர் கூரிய அல்லது அறுக்கும் இரும்புக் கருவிகளைக் குறிக்கலாம்; துல்லியமான கருவி நிச்சயமில்லாததால் பொதுவான மொழிபெயர்ப்பு தேர்ந்தெடுக்கப்பட்டது.
- source_word: וּבַמְּגֵרוֹת
  choice: கோடரிகள்
  rationale: இச்சொல்லின் சரியான அடையாளம் தெளிவில்லை. சூழலில் வேறொரு வெட்டுக் கருவியைக் குறிக்கும் வாசிப்பாக ‘கோடரிகள்’ இயல்பாக உள்ளது; ஐயம் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: וְכֵן יַעֲשֶׂה
  choice: இவ்வாறே செய்தான்
  rationale: இது அம்மோனிய நகரங்கள் அனைத்திடமும் தாவீது மேற்கொண்ட நடவடிக்கையைச் சுருக்கமாகக் கூறுகிறது.
- source_word: לְכֹל עָרֵי בְנֵי עַמּוֹן
  choice: அம்மோனியரின் எல்லா நகரங்களுக்கும்
  rationale: בְנֵי עַמּוֹן என்பதற்கான இயல்பான நவீன தமிழினப்பெயர் ‘அம்மோனியர்’ ஆகும்.
- source_word: וַיָּשָׁב ... יְרוּשָׁלִָם
  choice: எருசலேமுக்குத் திரும்பினார்கள்
  rationale: שוב உடன் இலக்கு வரும்போது ‘திரும்புதல்’ என்பது இயல்பான கதைநடைப் பொருள்; கூட்டு எழுவாய்க்கேற்ப தமிழில் பன்மை பயன்படுத்தப்பட்டது.
theological_decisions:
- issue: இவ்வசனம் அம்மோனியர்களைக் கருவிகளால் கொன்றதையா அல்லது அவர்களைக் கட்டாய உழைப்பில் ஈடுபடுத்தியதையா விவரிக்கிறது?
  choice: பிடிக்கப்பட்ட மக்களைக் கருவிகளைக் கொண்டு வேலை செய்ய வைத்ததாக முதன்மை உரை மொழிபெயர்க்கிறது.
  alternative: குறிப்பாக 2 சாமுவேல் 12:31-ன் இணைப்பகுதியின் தாக்கத்தில், அவர்களை இரம்பங்களாலும் இரும்புக் கருவிகளாலும் கொன்றதாக இதை வாசிக்கலாம்.
  rationale: நாளாகமத்தின் எபிரெயச் சொற்றொடர் சாமுவேல் உரையிலிருந்து வேறுபடுகிறது; வேலைக்கு அமர்த்தியதாக வாசிக்க இடமளிக்கிறது. உண்மையான உரைசார் ஐயத்தையும் அதன் அறநெறி மற்றும் இறையியல் முக்கியத்துவத்தையும் மறைக்காமல் மாற்று வாசிப்பு அடிக்குறிப்பில் வைக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டது. ‘வேலை செய்ய வைத்தான்’ என்பது உரையின் சாத்தியமான குறைந்த வன்முறை வாசிப்பை முதன்மைப்படுத்தினாலும், மரணதண்டனை சார்ந்த மாற்று வாசிப்பு அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்பட்டது.
