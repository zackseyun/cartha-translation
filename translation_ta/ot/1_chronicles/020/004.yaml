  text: וַ/יְהִי֙ אַחֲרֵי כֵ֔ן וַ/תַּעֲמֹ֧ד מִלְחָמָ֛ה בְּ/גֶ֖זֶר עִם פְּלִשְׁתִּ֑ים אָ֣ז הִכָּ֞ה סִבְּכַ֣י הַ/חֻֽשָׁתִ֗י אֶת סִפַּ֛י מִ/ילִדֵ֥י הָ/רְפָאִ֖ים וַ/יִּכָּנֵֽעוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/020/004.yaml
  text: After this[a], war arose at Gezer with the Philistines. Then Sibbecai the Hushathite struck down Sippai, one of the descendants of the Rephaim[b], and they were subdued.
translation:
  language: ta
  text: இதற்குப் பிறகு, கெசேரில் பெலிஸ்தியர்களுடன் போர் மூண்டது. அப்போது ஊசாத்தியனான சிபெக்காய், ரெப்பாயீமின்[b] வழிவந்தவர்களில் ஒருவனான சிப்பாயை[a] வீழ்த்தினான்; அவர்கள் அடக்கப்பட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சிப்பாய்” என்பதற்கு “சப்பாய்” என்றும் ஒலிப்பெயர்க்கப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: “ரெப்பாயீம்” என்பது எபிரேயப் பெயர்; மரபுவழியாக “இராட்சதர்கள்” என்றும் மொழிபெயர்க்கப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: இதற்குப் பிறகு
  rationale: எபிரேயக் கதைத் தொடரின் காலவரிசையை இயல்பான நவீனத் தமிழில் தெளிவாகக் காட்டுகிறது; ‘அதற்குப் பிறகு நிகழ்ந்ததாவது’ என்ற சொற்சொல் வடிவத்தைத் தவிர்க்கிறது.
- source_word: וַתַּעֲמֹד מִלְחָמָה
  choice: போர் மூண்டது
  rationale: עמד என்பதன் அடிப்படை உருவகத்தைச் சொற்சொல்லாகக் கொடுக்காமல், போர் தொடங்கியதை இயல்பாகவும் வலிமையாகவும் தெரிவிக்கிறது.
- source_word: בְּגֶזֶר
  choice: கெசேரில்
  rationale: போரின் இடத்தைக் குறிக்கும் இடப்பெயரைத் தமிழ் ஒலிப்பெயர்ப்பில் தருகிறது.
- source_word: עִם פְּלִשְׁתִּים
  choice: பெலிஸ்தியர்களுடன்
  rationale: עם என்பதன் ‘உடன்’ என்ற வடிவத்தைப் பாதுகாக்கிறது; போர்ச் சூழல் பகைமையான மோதலைத் தெளிவுபடுத்துகிறது.
- source_word: אָז
  choice: அப்போது
  rationale: கதை நிகழ்வின் அடுத்த கட்டத்தைக் குறிக்கும் இயல்பான தமிழ் இணைப்புச்சொல்.
- source_word: הִכָּה
  choice: வீழ்த்தினான்
  rationale: போரில் தாக்கி முறியடித்தல் அல்லது கொல்லுதல் ஆகிய பொருள் வரம்பைத் தக்கவைத்து, ‘கொன்றான்’ என்று தேவையின்றி மிகத் துல்லியப்படுத்தாமல் உள்ளது.
- source_word: סִבְּכַי הַחֻשָׁתִי
  choice: ஊசாத்தியனான சிபெக்காய்
  rationale: தனிநபர் பெயரையும் இன/ஊர் சார்ந்த அடைமொழியையும் ஒலிப்பெயர்த்து, தமிழில் இயல்பான உறவமைப்பில் தருகிறது.
- source_word: סִפַּי
  choice: சிப்பாய்
  rationale: மசோரா உயிர்க்குறிப்புடைய வடிவத்தைத் தமிழ் ஒலிப்பெயர்ப்பாகக் கொடுக்கிறது.
- source_word: מִילִדֵי הָרְפָאִים
  choice: ரெப்பாயீமின் வழிவந்தவர்களில் ஒருவனான
  rationale: ילידי குறிக்கும் பிறப்பு/வம்ச உறவையும், ஒரே நபரைக் குறிக்கும் சூழலையும் தெளிவாக்குகிறது; רפאים என்பதை விளக்கப் பெயராக மாற்றாமல் இனக்குழுப் பெயராக ஒலிப்பெயர்க்கிறது.
- source_word: וַיִּכָּנֵעוּ
  choice: அவர்கள் அடக்கப்பட்டார்கள்
  rationale: כנע என்பதன் நிபால் வடிவிலுள்ள ‘அடக்கப்படுதல், கீழ்ப்படுத்தப்படுதல்’ என்ற இராணுவச் சூழலுக்குரிய பொருளைத் தருகிறது; ‘அவர்கள்’ யாரைக் குறிக்கிறது என்பது மூலத்திலும் வெளிப்படையாகத் தீர்மானிக்கப்படாததால் அந்தத் தெளிவின்மையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: הָרְפָאִים என்பதன் மொழிபெயர்ப்பு
  choice: ரெப்பாயீம்
  alternative: இராட்சதர்கள் / பெருவீரர்கள்
  rationale: இச்சொல் நேரடியான உடல் வருணனையாக மட்டுமல்லாமல் ஓர் இனக்குழு அல்லது வம்சப் பெயராகவும் அமையலாம். ஆகவே விளக்கவுரையை முதன்மை உரைக்குள் புகுத்தாமல் ஒலிப்பெயர்த்து, மரபுவழி மாற்றை அடிக்குறிப்பில் தருகிறது.
- issue: וַיִּכָּנֵעוּ என்பதில் பன்மை எழுவாய்
  choice: அவர்கள் அடக்கப்பட்டார்கள்
  alternative: பெலிஸ்தியர்கள் அடக்கப்பட்டார்கள்
  rationale: எபிரேயத்தில் எழுவாய் பெயரிட்டு மீண்டும் சொல்லப்படவில்லை. சூழலில் பெலிஸ்தியர்களைக் குறிப்பதாக இருக்கலாம் என்றாலும், முதன்மை உரை அந்தக் குறிப்பைத் தேவையின்றி வெளிப்படையாக்காமல் மூலத்தின் அமைப்பைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டது. பெயர்கள் எபிரேய வடிவங்களுக்கு நெருக்கமாக ஒலிப்பெயர்க்கப்பட்டன. போர்ச் சொற்கள் இயல்பாக அமைக்கப்பட்டாலும், ரெப்பாயீம் மற்றும் இறுதிப் பன்மைச் சுட்டின் உண்மையான தெளிவின்மை பாதுகாக்கப்பட்டது.
