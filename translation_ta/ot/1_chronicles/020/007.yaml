  text: וַ/יְחָרֵ֖ף אֶת יִשְׂרָאֵ֑ל וַ/יַּכֵּ֨/הוּ֙ יְה֣וֹנָתָ֔ן בֶּן שִׁמְעָ֖א אֲחִ֥י דָוִֽיד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/020/007.yaml
  text: And when he taunted Israel[a], Jonathan son of Shimea, David’s brother, struck him down.
translation:
  language: ta
  text: அவன் இஸ்ரவேலை இகழ்ந்தபோது[a], தாவீதின் சகோதரனான சிமெயாவின் மகன் யோனத்தான் அவனை வீழ்த்தினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்ரவேலுக்குச் சவால் விட்டபோது.” எபிரெய வினைச்சொல் இகழ்ச்சியுடன் பழிப்பதையோ வெளிப்படையாகச் சவால் விடுவதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחָרֵף
  choice: நிந்தித்தபோது
  rationale: חרף இச்சூழலில் இகழ்ச்சியுடனான பழிப்பையும் வெளிப்படையான சவாலையும் குறிக்கலாம். ‘நிந்தித்தான்’ என்பது பகைமையான வாய்மொழி அவமதிப்பை இயல்பாகவும் கண்ணியமாகவும் வெளிப்படுத்துகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אֶת יִשְׂרָאֵל
  choice: இஸ்ரவேலை
  rationale: எபிரெய உரையில் தேச/மக்கள் ஒருமைப்பாட்டைக் குறிக்கும் ‘இஸ்ரவேல்’ நேரடி செயப்படுபொருளாக உள்ளது; அதை அப்படியே வைத்திருப்பது மூலத்தின் வடிவத்தையும் பொருளையும் காக்கிறது.
- source_word: וַיַּכֵּהוּ
  choice: அவனை வீழ்த்தினான்
  rationale: נכה என்பதன் காரணவினை வடிவம் இக்கதைச் சூழலில் உயிரைப் பறிக்கும் தாக்குதலைக் குறிக்கிறது. ‘வீழ்த்தினான்’ என்பது மரணத்துக்கு வழிவகுத்த அடியை இயல்பாக உணர்த்துகிறது; ‘கொன்றான்’ என்பதைக் காட்டிலும் மூல வினையின் செயற்படிமத்தைப் பாதுகாக்கிறது.
- source_word: יְהוֹנָתָן
  choice: யோனத்தான்
  rationale: எபிரெய தனிப்பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: בֶּן שִׁמְעָא
  choice: சிமெயாவின் மகன்
  rationale: எபிரெய தனிப்பெயரை ஒலிபெயர்த்து, בֶּן என்ற உறவை இயல்பான தமிழில் ‘மகன்’ என வழங்குகிறது.
- source_word: אֲחִי דָוִיד
  choice: தாவீதின் சகோதரனான
  rationale: ‘தாவீதின் சகோதரன்’ என்ற உறவைத் தெளிவாகக் காக்கிறது. தமிழில் பெயருடன் அதன் விளக்கத்தை இயல்பாக இணைக்க ‘சகோதரனான’ பயன்படுத்தப்பட்டுள்ளது.
