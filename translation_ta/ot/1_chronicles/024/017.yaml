  register: சுருக்கமான பட்டியல் நடையைப் பேணி, நவீனத் தரமான தமிழில் இயல்பான வரிசை எண்கள் பயன்படுத்தப்பட்டுள்ளன. மூலத்தில் வினைச்சொல் இல்லாத இணை அமைப்பு தமிழிலும் பாதுகாக்கப்பட்டுள்ளது.
