translation:
  language: ta
  text: யாக்கீனுக்கு இருபத்தொன்றாவது; காமூலுக்கு இருபத்திரண்டாவது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/יָכִין
  choice: யாகீனுக்கு
  rationale: இந்த ஆசாரியப் பிரிவுகளின் பட்டியலில் לְ என்பது சீட்டுப்படி அமைந்த வரிசை அல்லது ஒதுக்கீட்டைக் குறிக்கிறது. יָכִין என்ற ஆள்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: אֶחָד וְ/עֶשְׂרִים
  choice: இருபத்தொன்றாவது
  rationale: எபிரெயத்தில் சொற்படியாக ‘ஒன்றும் இருபதும்’ என்ற எண்ணிக்கை வடிவம் இருந்தாலும், தொடர்ச்சியான இப்பட்டியலில் அது வரிசை எண்ணாகச் செயல்படுகிறது.
- source_word: לְ/גָמוּל
  choice: காமூலுக்கு
  rationale: முதல் கூறைப் போலவே לְ என்பது வரிசை அல்லது ஒதுக்கீட்டைக் குறிக்கிறது. גָמוּל என்ற ஆள்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: שְׁנַיִם וְ/עֶשְׂרִים
  choice: இருபத்திரண்டாவது
  rationale: எபிரெயத்தில் எண்ணிக்கை வடிவமாக இருந்தாலும், இப்பட்டியலின் சூழலில் இது இருபத்திரண்டாம் வரிசையைக் குறிக்கிறது.
