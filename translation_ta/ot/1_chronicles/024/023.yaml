base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/023.yaml
  text: 'And the sons of Jeriah: Amariah the second[a], Jahaziel the third, Jekameam the fourth.'
translation:
  language: ta
  text: 'மேலும், எரியாவின் மகன்கள்: அமரியா இரண்டாமவன்[a], யஹஸியேல் மூன்றாமவன், யெக்காமெயாம் நான்காமவன்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயப் பட்டியல் நடை சுருக்கமானது. சொற்சொல்லாக, “மேலும், எரியாவின் மகன்கள்: அமரியா இரண்டாமவன், யஹஸியேல் மூன்றாமவன், யெக்காமெயாம் நான்காமவன்.” இதை “அமரியா இரண்டாமவனாக இருந்தான்” என்பது போன்ற விடுபட்ட வினைச்சொல்லுடன் புரிந்துகொள்ளலாம்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנָי
  choice: மகன்கள்
  rationale: இது ஆண் சந்ததியினரைப் பட்டியலிடும் வம்சவரலாற்றுச் சூழல் என்பதால், בְנֵי என்பதற்கு நேரடியாக ‘மகன்கள்’ என மொழிபெயர்க்கப்பட்டது. தொடக்க வாவ் முந்தைய பட்டியலுடன் இணைக்கிறது; தமிழில் பட்டியல் இயல்பாகத் தொடர்வதால் தனியாக ‘மேலும்’ சேர்க்கப்படவில்லை.
- source_word: יְרִיָּהוּ
  choice: எரியா
  rationale: எபிரெயத் தனிப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டது; இறுதியில் உள்ள தெய்வீகப் பெயர்க்கூற்றின் சுருங்கிய வடிவத்தைத் தமிழின் வழக்கமான வேதாகமப் பெயரமைப்புக்கு ஏற்ப வழங்குகிறது.
- source_word: אֲמַרְיָהוּ
  choice: அமரியா
  rationale: மசோரா உயிர்க்குறிப்புக்கு நெருக்கமான, தமிழில் இயல்பான தனிப்பெயர் ஒலிபெயர்ப்பு.
- source_word: הַשֵּׁנִי
  choice: இரண்டாமவன்
  rationale: ஆண் பெயரைத் தொடர்ந்து வரும் வரிசை எண்ணைத் தமிழில் சுருக்கமான பட்டியல் நடையில் வழங்குகிறது; ‘இரண்டாவது மகன்’ என்று விரிவுபடுத்தாமல் எபிரெய உரையின் விடுபட்ட வினை அமைப்பு பாதுகாக்கப்பட்டது.
- source_word: יַחֲזִיאֵל
  choice: யகசியேல்
  rationale: எபிரெய மெய்யெழுத்துகளையும் உயிரமைப்பையும் அடிப்படையாகக் கொண்ட தமிழ் ஒலிபெயர்ப்பு.
- source_word: הַשְּׁלִישִׁי
  choice: மூன்றாமவன்
  rationale: பட்டியலின் வரிசை எண்ணை இயல்பான தமிழ் ஆண்பால் வடிவில் நேரடியாகக் காட்டுகிறது.
- source_word: יְקַמְעָם
  choice: யெக்காமெயாம்
  rationale: மசோரா வாசிப்பிலுள்ள பெயரின் ஒலியமைப்பைத் தமிழில் இயன்றவரை பாதுகாக்கும் ஒலிபெயர்ப்பு.
- source_word: הָרְבִיעִי
  choice: நான்காமவன்
  rationale: எபிரெயப் பட்டியலின் சுருக்கமான வரிசை அமைப்பைப் பாதுகாக்கிறது; வெளிப்படையான வினைச்சொல் சேர்க்கப்படவில்லை.
