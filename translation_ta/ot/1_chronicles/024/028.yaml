  text: לְ/מַחְלִי֙ אֶלְעָזָ֔ר וְ/לֹא הָ֥יָה ל֖/וֹ בָּנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/028.yaml
  text: 'For Mahli: Eleazar[a], and he had no sons.'
translation:
  language: ta
  text: 'மக்லியைப் பொறுத்தவரை: எலெயாசார்[a]; அவருக்கு மகன்கள் இல்லை.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, “மக்லிக்கு: எலெயாசார்; அவருக்கு மகன்கள் இல்லை.” தொடக்கத்திலுள்ள முன்னிடைச்சொல், பட்டியலின் தலைப்பையோ பேசுபொருளையோ குறிக்கக்கூடும்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַחְלִי
  choice: மக்லியைப் பொறுத்தவரை
  rationale: முன்னொட்டு לְ இங்கு வம்சப்பட்டியலில் தலைப்பு அல்லது பேசுபொருளைக் குறிக்கிறது. இதை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֶלְעָזָר
  choice: எலெயாசார்
  rationale: எபிரெயத் தனிப்பெயரின் ஒலியைத் தமிழில் பெயராக எழுத்துப்பெயர்த்து வழங்குகிறது.
- source_word: וְלֹא הָיָה לוֹ
  choice: அவருக்கு ... இல்லை
  rationale: ‘அவருக்கு இருந்ததில்லை’ என்ற எபிரெய உடைமை மரபுத்தொடரை இயல்பான தமிழில் தருகிறது; וְ இணைப்பை அரைப்புள்ளிக்குப் பிந்தைய தொடர்ச்சியில் காக்கிறது.
- source_word: בָּנִים
  choice: மகன்கள்
  rationale: வம்சப்பட்டியல் சூழலில் בָּנִים குறிப்பாக ஆண் சந்ததியினரைக் குறிக்கிறது; பொதுவான ‘பிள்ளைகள்’ என்று விரிவாக்கவில்லை.
theological_decisions: []
translation_notes:
  register: நவீன தரநிலைத் தமிழில், வம்சப்பட்டியலின் சுருக்கமான அமைப்பைத் தக்கவைத்து மொழிபெயர்க்கப்பட்டுள்ளது. ‘மக்லியைப் பொறுத்தவரை’ என்பது தலைப்பு/பேசுபொருள் பயன்பாட்டை இயல்பாக வெளிப்படுத்துகிறது; மூலத்தின் பட்டியல் துணுக்கை அரைப்புள்ளி காக்கிறது.
