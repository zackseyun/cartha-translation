  text: for Bilgah[a], the fifteenth; for Immer, the sixteenth.
translation:
  language: ta
  text: பில்காவுக்கு பதினைந்தாவது; இம்மேருக்கு பதினாறாவது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்கு சொல், “பதினைந்து,” “பதினாறு.” இங்கு எண்ணிடப்பட்ட சீட்டுகள் பற்றிய சூழலில், “பதினைந்தாவது,” “பதினாறாவது” என்பதே பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְ/בִלְגָּה
  choice: பில்காவுக்கு
  rationale: முன்னொட்டான לְ இங்கு ஆசாரியப் பிரிவுகளுக்கான சீட்டின் ஒதுக்கீட்டைக் குறிக்கிறது. தமிழில் ‘பில்காவுக்கு’ என்பது அந்த ஒதுக்கீட்டை இயல்பாகத் தெரிவிக்கிறது.
- source_word: חֲמִשָּׁה עָשָׂר
  choice: பதினைந்தாவது
  rationale: எபிரெயத்தில் சொல் வடிவம் ‘பதினைந்து’ என்ற எண்ணைக் குறித்தாலும், வரிசையாக ஒதுக்கப்பட்ட சீட்டுகளின் சூழலில் இது வரிசை எண்ணாகச் செயல்படுகிறது.
- source_word: לְ/אִמֵּר
  choice: இம்மேருக்கு
  rationale: முன்னொட்டான לְ ஆசாரியப் பிரிவுக்கான ஒதுக்கீட்டைக் குறிக்கிறது; ‘இம்மேருக்கு’ என்பது தமிழில் சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: שִׁשָּׁה עָשָׂר
  choice: பதினாறாவது
  rationale: சொல்லுக்கு நேரான வடிவம் ‘பதினாறு’ என்றாலும், எண்ணிடப்பட்ட சீட்டுகளின் பட்டியலில் வரிசை எண்ணான ‘பதினாறாவது’ என்பதே பொருளைத் தெளிவாக அளிக்கிறது.
