  text: for Pethahiah[a], the nineteenth; for Jehezkel, the twentieth.
translation:
  language: ta
  text: பெத்தகியாவுக்குப் பத்தொன்பதாவது; யெஹெஸ்கேலுக்கு[a] இருபதாவது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘எசேக்கியேல்.’ இங்குள்ள எபிரெயப் பெயர் יְחֶזְקֵאל என்ற வடிவில் உள்ளது; அதை நெருக்கமாக ஒலிபெயர்த்தால் ‘யெஹெஸ்கேல்.’ சில மொழிபெயர்ப்புகள் இதைப் பரிச்சயமான ‘எசேக்கியேல்’ என்று வழங்குகின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְתַחְיָה
  choice: பெத்தகியாவுக்கு
  rationale: பட்டியலின் சூழலில் முன்னொட்டு ל ஒதுக்கீட்டைக் குறிக்கிறது; எனவே பெயர் ஒலிபெயர்க்கப்பட்டு, ‘பெத்தகியாவுக்கு’ என்று இயல்பாக வழங்கப்பட்டது.
- source_word: תִּשְׁעָה עָשָׂר
  choice: பத்தொன்பதாவது
  rationale: எபிரெயத்தில் எண்ணிக்கை வடிவில் இருந்தாலும், ஆசாரியப் பிரிவுகளின் வரிசையில் இது வரிசை எண்ணாகச் செயல்படுகிறது.
- source_word: לִיחֶזְקֵאל
  choice: யெஹெஸ்கேலுக்கு
  rationale: ל ஒதுக்கீட்டைக் குறிக்கிறது. இங்குள்ள எபிரெயப் பெயரின் வடிவத்தைப் பாதுகாக்க ‘யெஹெஸ்கேல்’ என்று ஒலிபெயர்க்கப்பட்டது; பரிச்சயமான பெயருடன் அமைதியாக ஒத்திசைக்கப்படவில்லை.
- source_word: הָעֶשְׂרִים
  choice: இருபதாவது
  rationale: குறிப்பிட்ட உருபுடன் வரும் எண்ணிக்கை, இந்த வரிசைப் பட்டியலில் வரிசை எண்ணைக் குறிக்கிறது; சூழலால் புரியும் ‘பங்கு/முறை’ என்ற பெயர்ச்சொல் மீண்டும் சேர்க்கப்படவில்லை.
theological_decisions: []
translation_notes:
  register: நவீன பொதுத்தமிழில், பட்டியலுக்குரிய சுருக்கமான மற்றும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய மூலத்தில் வெளிப்படையாக இல்லாமல் சூழலால் புரியும் ‘சீட்டு’ அல்லது ‘பிரிவு’ போன்ற பெயர்ச்சொற்கள் உரையில் சேர்க்கப்படவில்லை.
