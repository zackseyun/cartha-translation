lexical_decisions:
- source_word: לְחֵזִיר
  choice: எசீருக்கு
  rationale: לְ என்ற முன்னொட்டு சீட்டின் ஒதுக்கீட்டைப் குறிக்கிறது. חֵזִיר என்பது பொருள் மொழிபெயர்ப்பு செய்யப்படாமல், எபிரெய உச்சரிப்பை அணுகும் வகையில் ‘எசீர்’ என ஒலிபெயர்க்கப்பட்ட தனிப்பெயர்.
- source_word: שִׁבְעָה עָשָׂר
  choice: பதினேழாவது
  rationale: இது வரிசைப்படுத்தப்பட்ட ஆசாரியப் பிரிவுகளின் சீட்டுப் பட்டியல் என்பதால், எண்ணிக்கை இங்கு வரிசை எண்ணாகச் செயல்படுகிறது.
- source_word: לְהַפִּצֵּץ
  choice: அப்பிச்சேசுக்கு
  rationale: לְ என்பது ஒதுக்கீட்டைக் குறிக்கிறது. הַפִּצֵּץ என்ற தனிப்பெயர் அதன் எபிரெய ஒலிவடிவத்தை அணுகும் வகையில் ‘அப்பிச்சேஸ்’ என ஒலிபெயர்க்கப்பட்டது.
- source_word: שְׁמוֹנָה עָשָׂר
  choice: பதினெட்டாவது
  rationale: முந்தைய எண்ணைப் போலவே, பட்டியல் சூழலில் இது வரிசை எண்ணாக மொழிபெயர்க்கப்படுகிறது.
