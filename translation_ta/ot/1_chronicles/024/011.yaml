translation:
  language: ta
  text: ஒன்பதாவது சீட்டு யேசுவாவுக்கும், பத்தாவது சீட்டு செக்கனியாவுக்கும் விழுந்தது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְיֵשׁוּעַ
  choice: யேசுவாவுக்கு
  rationale: לְ முன்னிடைச்சொல் இச்சூழலில் குலுக்குச் சீட்டினால் பணிப்பிரிவு ஒதுக்கப்பட்டவரைக் குறிக்கிறது; எபிரெயப் பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: הַתְּשִׁעִי
  choice: ஒன்பதாவது சீட்டு
  rationale: வரிசை எண்ணாகிய இச்சொல், முந்தைய சூழலில் கூறப்பட்ட குலுக்குச் சீட்டைச் சுருக்கமாகக் குறிக்கிறது; தமிழில் பொருள் இயல்பாகத் தெளிவதற்காக ‘சீட்டு’ சேர்க்கப்பட்டது.
- source_word: לִשְׁכַנְיָהוּ
  choice: செகனியாவுக்கு
  rationale: לְ இங்கு ஒதுக்கீட்டைப் பெறுபவரைக் குறிக்கிறது; שְׁכַנְיָהוּ என்ற பெயர் மூல எபிரெய வடிவை அடிப்படையாகக் கொண்டு தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: הָעֲשִׂרִי
  choice: பத்தாவது சீட்டு
  rationale: இது பட்டியலின் பத்தாவது குலுக்குச் சீட்டு அல்லது வரிசை ஒதுக்கீட்டைக் குறிக்கிறது; வாசிப்புத் தெளிவுக்காக ‘சீட்டு’ வெளிப்படையாக வழங்கப்பட்டது.
