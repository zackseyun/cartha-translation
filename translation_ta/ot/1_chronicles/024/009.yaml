    text: அல்லது, “ஐந்தாவது சீட்டு மல்கியாவுக்காக; ஆறாவது சீட்டு மியாமினுக்காக.” இந்தச் சீட்டுப் பங்கீட்டுப் பட்டியலில் எபிரெய முன்னிடைச்சொல்லை “ஒருவருக்கு” என்றும் “ஒருவருக்காக” என்றும் மொழிபெயர்க்கலாம்.
