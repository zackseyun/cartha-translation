lexical_decisions:
- source_word: לְמַלְכִּיָּה
  choice: மல்கியாவுக்கு
  rationale: இந்தச் சீட்டுப் பங்கீட்டுப் பட்டியலில் לְ என்பது ஒதுக்கீட்டைப் பெறுபவரைக் குறிக்கிறது. எபிரெயப் பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: הַחֲמִישִׁי
  choice: ஐந்தாவது சீட்டு
  rationale: இங்கு வரிசை எண் தனித்து நின்று ஐந்தாவது சீட்டைக் குறிக்கிறது; சூழலிலிருந்து புரியும் ‘சீட்டு’ தமிழில் இயல்பான தெளிவுக்காகச் சேர்க்கப்பட்டது.
- source_word: לְמִיָּמִן
  choice: மியாமினுக்கு
  rationale: முதல் தொடரைப் போலவே לְ என்பது சீட்டின் ஒதுக்கீட்டைப் பெறுபவரைக் குறிக்கிறது; பெயர் எபிரெய வடிவுக்கு ஏற்ப ஒலிபெயர்க்கப்பட்டது.
- source_word: הַשִּׁשִּׁי
  choice: ஆறாவது சீட்டு
  rationale: இது பட்டியலில் ஆறாவது சீட்டைக் குறிக்கும் பெயரடைவழிப் பயன்பாடு; தமிழில் தெளிவுக்காக ‘சீட்டு’ வெளிப்படையாகக் கூறப்பட்டது.
