lexical_decisions:
- source_word: לְחָרִם
  choice: ஆரீமுக்கு
  rationale: முன்னொட்டு לְ இச்சீட்டுப் பட்டியலில் ஒதுக்கீட்டைக் குறிக்கிறது; தமிழில் பெயருடன் இணையும் ‘-க்கு’ அதை இயல்பாக வெளிப்படுத்துகிறது. חָרִם என்ற பெயர் எபிரெய உச்சரிப்பை அணுகும் வகையில் ஒலிபெயர்க்கப்பட்டது.
- source_word: הַשְּׁלִישִׁי
  choice: மூன்றாவது
  rationale: குறிப்பிட்ட மூன்றாவது சீட்டை அல்லது ஒதுக்கீட்டைச் சுட்டும் வரிசை எண்ணாகும்; எபிரெயப் பட்டியலின் சுருக்கமான நடை பாதுகாக்கப்படுகிறது.
- source_word: לִשְׂעֹרִים
  choice: செயோரீமுக்கு
  rationale: முன்னொட்டு לִ ஒதுக்கீட்டைக் குறிக்கிறது; ‘-க்கு’ என இயல்பாக மொழிபெயர்க்கப்பட்டது. שְׂעֹרִים என்ற பெயர் எபிரெய வடிவிலிருந்து ஒலிபெயர்க்கப்பட்டது.
- source_word: הָרְבִעִי
  choice: நான்காவது
  rationale: மூன்றாவது என்பதற்கு இணையாக, குறிப்பிட்ட நான்காவது சீட்டை அல்லது ஒதுக்கீட்டைச் சுட்டும் வரிசை எண்ணாகும்.
