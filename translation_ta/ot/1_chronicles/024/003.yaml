  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. பெயர்கள் வழக்கமான தமிழ் ஒலிபெயர்ப்பில் தரப்பட்டுள்ளன; ஆசாரிய வம்சத்தைக் குறிக்கும் בני என்பதற்கு உயிரியல் மகன்கள் என்ற குறுகிய பொருளைத் தவிர்க்க ‘வழிவந்தவர்கள்’ பயன்படுத்தப்பட்டுள்ளது.
