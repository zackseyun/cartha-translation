base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/003.yaml
  text: David[a], with Zadok from the sons of Eleazar and Ahimelech from the sons of Ithamar, divided them according to their appointment in their service.
translation:
  language: ta
  text: தாவீது, எலெயாசாரின் சந்ததியைச் சேர்ந்த சாதோக்குடனும், இத்தாமாரின் சந்ததியைச் சேர்ந்த அகிமெலேக்குடனும் சேர்ந்து, அவர்களை அவர்களுடைய பணியில் அவர்களுக்கு நியமிக்கப்பட்ட ஒழுங்கின்படி[a] பிரித்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவர்களுடைய பணியில் அவர்களுக்குரிய பொறுப்பின்படி’ அல்லது ‘அவர்களுடைய பணியில் அவர்களுக்குரிய மேற்பார்வைப் பொறுப்பின்படி.’ எபிரெயச் சொல் நியமனம், பதவி, மேற்பார்வை, அல்லது ஒழுங்குபடுத்தப்பட்ட பொறுப்பு ஆகிய கருத்துகளைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחָלְקֵם
  choice: அவர்களைப் பிரித்தான்
  rationale: חלק என்பதன் நேரடிப் பொருள் ‘பிரித்தல்.’ இங்கு ஆசாரியர்களைப் பணிப்பிரிவுகளாக ஒழுங்குபடுத்துவது சூழலில் தெளிவாக இருந்தாலும், மூலத்தின் நேரடியான செயற்பாட்டை இச்சொல் காக்கிறது.
- source_word: וְצָדוֹק מִן בְּנֵי אֶלְעָזָר
  choice: எலெயாசாரின் வழிவந்தவர்களில் ஒருவனான சாதோக்குடனும்
  rationale: בני என்பது இங்கு உடனடி மகன்களை மட்டும் அல்லாமல் வம்சவழியினரையும் குறிக்கிறது; இயல்பான நவீன தமிழில் ‘வழிவந்தவர்கள்’ அந்த வம்சத் தொடர்பைத் தெளிவாகக் காட்டுகிறது. וְ என்பது தாவீதுடன் சாதோக் பங்கேற்றதைத் தமிழில் இயல்பாக வெளிப்படுத்த ‘உடனும்’ என வழங்கப்பட்டுள்ளது.
- source_word: וַאֲחִימֶלֶךְ מִן בְּנֵי אִיתָמָר
  choice: இத்தாமாரின் வழிவந்தவர்களில் ஒருவனான அகிமெலேக்குடனும்
  rationale: முந்தைய இணைத் தொடரின் அமைப்பைத் தக்கவைத்து, அகிமெலேக்கின் இத்தாமார் வம்சத் தொடர்பையும் தாவீதுடன் அவர் பங்கேற்றதையும் தெளிவாக்குகிறது.
- source_word: לִפְקֻדָּתָם
  choice: அவர்களுடைய பணிக்குரிய பொறுப்புகளின்படி
  rationale: פקדה என்பது நியமனம், மேற்பார்வை, பதவி அல்லது ஒழுங்குபடுத்தப்பட்ட பொறுப்பு ஆகிய பொருள்களை ஏற்கக்கூடும். ஆசாரியப் பணியின் நிர்வாகச் சூழலில் ‘பொறுப்புகள்’ இயல்பாகவும் போதிய அளவு விரிவாகவும் உள்ளது; பொருளின் நுட்ப வேறுபாடு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: בַּעֲבֹדָתָם
  choice: அவர்களுடைய பணிக்குரிய
  rationale: עבודה என்பதன் அடிப்படைப் பொருள் பணி அல்லது சேவை. இங்கு ஆசாரியச் சேவை குறிக்கப்பட்டாலும், ‘ஊழியம்’ போன்ற கூடுதல் சமய நுட்பத்தைச் சேர்க்காமல் ‘பணி’ மூலத்துக்கு நெருக்கமாக உள்ளது.
