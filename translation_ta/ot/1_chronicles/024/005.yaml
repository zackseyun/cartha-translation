base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/005.yaml
  text: So they divided them by lots[a], these with those[b], because there were officers of the sanctuary and officers of God from the sons of Eleazar and from the sons of Ithamar.
translation:
  language: ta
  text: ஆகவே, இவர்களை அவர்களோடு[a] சீட்டுப் போட்டு பிரித்தார்கள். ஏனெனில் எலெயாசாரின் மகன்களிலும் இத்தாமாரின் மகன்களிலும் பரிசுத்த இடத்தின் அதிகாரிகளும் கடவுளுக்குரிய அதிகாரிகளும்[b] இருந்தனர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் நேரடியாக, ‘இவர்கள் அவர்களோடு.’ அல்லது, ‘ஒரு குழுவை மற்றொரு குழுவோடு’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘பரிசுத்த இடத்தின் தலைவர்களும் கடவுளின் தலைவர்களும்’ அல்லது ‘பரிசுத்த இடத்தின் முதன்மையானவர்களும் கடவுளின் முதன்மையானவர்களும்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחְלְקוּם
  choice: அவர்களைப் பிரித்தார்கள்
  rationale: חלק என்பதன் பியேல் வடிவம் இங்கு ஆசாரியக் குடும்பக் குழுக்களைப் பிரித்து ஒதுக்குவதைக் குறிக்கிறது. ‘பிரித்தார்கள்’ என்பது செயலை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: בְּגוֹרָלוֹת
  choice: சீட்டுகள் போட்டு
  rationale: גוֹרָל என்பது பொறுப்பையோ வரிசையையோ தீர்மானிக்கச் சீட்டுப் போடுதலைக் குறிக்கிறது. எபிரெயப் பன்மையையும் கருவிப் பொருளையும் இந்தத் தமிழ் வழக்கு இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֵלֶּה עִם אֵלֶּה
  choice: இவர்களையும் அவர்களையும்
  rationale: இரண்டு தொடர்புடைய குழுக்களும் ஒன்றாகக் கருத்தில் கொள்ளப்பட்டதைச் சுட்டுப்பெயர்களின் இணை அமைப்பு காட்டுகிறது. எபிரெயத்தின் சுருக்கமான பகிர்வு நயத்தை மிகையாக விளக்காமல் இந்தத் தேர்வு காக்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: சீட்டுப் போட்டுப் பிரித்ததற்கான காரணத்தை כִּי அறிமுகப்படுத்துவதால், தெளிவான காரண இணைப்பாக ‘ஏனெனில்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: שָׂרֵי קֹדֶשׁ
  choice: பரிசுத்த இடத்தின் தலைவர்கள்
  rationale: שָׂרִים என்பது தலைவர்கள், முதன்மையானவர்கள் அல்லது அதிகாரிகள் எனப் பொருள்படலாம். இந்த வழிபாட்டுச் சூழலில் קֹדֶשׁ பரிசுத்த இடத்தைக் குறிப்பதாக இயல்பாகப் புரிகிறது; ‘தலைவர்கள்’ மூலச்சொல்லின் பதவி சார்ந்த விரிவைத் திறந்தே வைக்கிறது.
- source_word: וְשָׂרֵי הָאֱלֹהִים
  choice: கடவுளின் தலைவர்களும்
  rationale: எபிரெயம் நேரடியாக ‘கடவுளின் தலைவர்கள்’ என்கிறது; ‘கடவுளின் ஆலயம்’ அல்லது ‘கடவுளின் பணி’ என்று இல்லாத சொற்களைச் சேர்க்காமல் மூலத்தின் சற்றுக் கடினமான இணை அமைப்பு காக்கப்பட்டுள்ளது.
- source_word: מִבְּנֵי אֶלְעָזָר וּבִבְנֵי אִיתָמָר
  choice: எலெயாசாரின் மக்களிலும் இத்தாமாரின் மக்களிலும்
  rationale: בְּנֵי என்பது இங்கு ஆசாரியக் குடும்ப வழியினரைச் சுட்டும் மரபுவழிச் சொல். தமிழ் ‘மக்கள்’ நேரடி சந்ததியினரையும் குடும்ப வழியினரையும் சூழலுக்கு ஏற்ப உள்ளடக்க முடியும்; இரு குடும்பங்களிலும் அத்தகைய தலைவர்கள் இருந்ததையும் ‘-இலும்’ அமைப்பு தெளிவாக்குகிறது.
theological_decisions:
- issue: שָׂרֵי קֹדֶשׁ וְשָׂרֵי הָאֱלֹהִים என்பதன் பொருள்
  choice: ‘பரிசுத்த இடத்தின் தலைவர்கள்’ மற்றும் ‘கடவுளின் தலைவர்கள்’ என்ற இரண்டு இணையான பதவிப் பெயர்களாக மொழிபெயர்க்கப்பட்டுள்ளது.
  alternative: ‘பரிசுத்தமானவற்றின் அதிகாரிகள் மற்றும் கடவுளின் அதிகாரிகள்’ அல்லது இரண்டாவது தொடரை ‘கடவுளின் ஆலய அதிகாரிகள்’ என விரித்துரைத்தல்.
  rationale: எலெயாசார், இத்தாமார் ஆகிய இரு வழியினரிடையேயும் பரிசுத்தப் பொறுப்புடைய தலைவர்கள் இருந்ததே சீட்டுப் போடுவதற்கான காரணம் என வசனம் கூறுகிறது. மூலத்தில் இல்லாத ‘ஆலயம்’ அல்லது ‘பணி’ என்பதைக் கூட்டாமல் இணை அமைப்பும் அதன் பொருள் நெருக்கடியும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதைமிக்க நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘சீட்டுகள் போட்டுப் பிரித்தார்கள்’ என்பது இயல்பான தமிழ்; பதவிச் சொற்களில் உள்ள எபிரெய மூலத்தின் ambiguity-ஐ ‘தலைவர்கள்’ காக்கிறது. அடிக்குறிப்பு குறிகள் தொடர்புடைய சொற்றொடர்களுக்குப் பின்னரே வைக்கப்பட்டுள்ளன.
