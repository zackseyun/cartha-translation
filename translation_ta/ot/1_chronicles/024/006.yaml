base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/006.yaml
  text: Shemaiah son of Nethanel[a], the scribe from among the Levites, recorded them in the presence of the king, the officials, Zadok the priest, Ahimelech son of Abiathar, and the heads of the fathers’ houses of the priests and of the Levites—one father’s house being taken for Eleazar, and one being taken for Ithamar.
translation:
  language: ta
  text: லேவியர்களில் ஒருவரான நெத்தனெயேலின் மகனும் எழுத்தருமான செமாயா, அரசர், அதிகாரிகள், ஆசாரியனான சாதோக்கு, அபியத்தாரின் மகன் அகிமெலேக்கு, ஆசாரியர்கள் மற்றும் லேவியர்களின் தந்தைவழிக் குடும்பத் தலைவர்கள் ஆகியோரின் முன்னிலையில் அவர்களைப் பதிவு செய்தார். எலெயாசாருக்காக ஒரு தந்தைவழிக் குடும்பம் எடுத்துக்கொள்ளப்பட்டது; இத்தாமாருக்காகவும் ஒன்று எடுத்துக்கொள்ளப்பட்டது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய வாசகம் மிகவும் சுருக்கமாக, “எலெயாசாருக்காக ஒரு தந்தைவழிக் குடும்பம் எடுத்துக்கொள்ளப்பட்டது; இத்தாமாருக்காக எடுத்துக்கொள்ளப்பட்டு, எடுத்துக்கொள்ளப்பட்டது” என்று உள்ளது. இந்த மீளுரை, எலெயாசார் மற்றும் இத்தாமாரின் மரபுகளிலிருந்து தந்தைவழிக் குடும்ப அலகுகள் முறைமுறையாகத் தேர்ந்தெடுக்கப்பட்டதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְתְּבֵם
  choice: அவர்களைப் பதிவு செய்தார்
  rationale: כתב என்பதன் மூன்றாம் நபர் ஆண்பால் பன்மை பின்னொட்டு, முந்தைய சூழலில் வகுக்கப்பட்ட ஆசாரியக் குடும்பப் பிரிவினரைக் குறிக்கிறது. ‘பதிவு செய்தார்’ என்பது எழுத்துப்பூர்வமான நிர்வாகச் செயலை இயல்பாகத் தெரிவிக்கிறது.
- source_word: הַסּוֹפֵר
  choice: எழுத்தர்
  rationale: அதிகாரபூர்வமாக எழுதிப் பதிவு செய்பவரைக் குறிக்கும் வரலாற்றுப் பதவிப் பெயருக்கு இயல்பான, மரியாதையான தமிழ் சொல்.
- source_word: מִן הַלֵּוִי
  choice: லேவியர்களில் ஒருவரான
  rationale: מן என்பதிலுள்ள ஒரு குழுவைச் சேர்ந்தவர் என்ற பகுதிப்பொருளைத் தெளிவாகக் காக்கிறது.
- source_word: לִפְנֵי
  choice: முன்னிலையில்
  rationale: அரசரும் தலைவர்களும் சாட்சிகளாக இருந்த பொது நிர்வாகச் சூழலைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: הַשָּׂרִים
  choice: அதிகாரிகள்
  rationale: அரச நிர்வாகத் தலைவர்களைக் குறிக்கிறது; ‘இளவரசர்கள்’ என்று மொழிபெயர்த்து அரச குடும்ப உறுப்பினர்கள் என்ற தவறான எண்ணத்தை ஏற்படுத்தாது.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: தந்தைவழிக் குடும்பத் தலைவர்கள்
  rationale: நாளாகமத்தில் வரும் மரபுவழி சமூக-நிர்வாக அலகைக் குறிக்கிறது; சொற்றொடரின் தந்தைவழி அமைப்பையும் நவீன வாசகருக்குப் புரியும் விதத்திலும் தருகிறது.
- source_word: בֵּית אָב אֶחָד
  choice: ஒரு தந்தைவழிக் குடும்பம்
  rationale: בית אב என்பது ஒரு மூதாதையரிடமிருந்து வந்த குடும்ப அல்லது குல அலகு; ‘தந்தைவழிக் குடும்பம்’ அதன் வரலாற்றுச் சமூக அமைப்பைக் காக்கிறது.
- source_word: אָחֻז
  choice: எடுத்துக்கொள்ளப்பட்டது
  rationale: אחז என்பதன் செயலப்பாட்டு வடிவின் அடிப்படைப் பொருளைத் தக்கவைத்து, சீட்டுப்போட்டு வரிசைப்படுத்தும் சூழலில் தேர்வு செய்யப்பட்டதை உணர்த்துகிறது.
- source_word: לְאֶלְעָזָר ... לְאִיתָמָר
  choice: எலெயாசாருக்காக ... இத்தாமாருக்காக
  rationale: ל முன்னிடைச்சொல் இரு ஆசாரிய மரபுகளுக்கான ஒதுக்கீட்டைக் குறிக்கிறது; தமிழில் ‘-க்காக’ அதை மிகைப்படுத்தாமல் வெளிப்படுத்துகிறது.
- source_word: וְאָחֻז אָחֻז לְאִיתָמָר
  choice: இத்தாமாருக்காகவும் ஒன்று எடுத்துக்கொள்ளப்பட்டது
  rationale: எபிரெயச் சொற்றொடர் சுருக்கமானதும் மீளுரைப்புடையதும் ஆகும். முன் வந்த ‘ஒரு குடும்பம்’ என்பதைத் தமிழில் ‘ஒன்று’ என்று நிறைவு செய்து, ஒவ்வொரு மரபிலிருந்தும் எடுக்கப்பட்ட நடைமுறையைத் தெளிவாக்குகிறது; கூடுதல் விவரம் அடிக்குறிப்பில் தரப்படுகிறது.
