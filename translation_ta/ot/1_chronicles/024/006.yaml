translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகருக்கு விளங்கும் மரியாதையான வரலாற்று-நிர்வாக நடையில் மொழிபெயர்க்கப்பட்டது. நபர்பெயர்கள் தமிழ்க் கிறிஸ்தவ வாசகர்களுக்கு பரிச்சயமான வடிவங்களுக்கு அருகில் வைக்கப்பட்டுள்ளன. בית אב என்ற தொழில்நுட்பச் சொல்லுக்கு ‘தந்தைவழிக் குடும்பம்’ பயன்படுத்தப்பட்டு அதன் மரபுவழிப் பொருள் காக்கப்பட்டது; இறுதிப் பகுதியின் எபிரெயச் சுருக்கமும் மீளுரைப்பும் அடிக்குறிப்பில் வெளிப்படையாகக் குறிப்பிடப்பட்டுள்ளன.
