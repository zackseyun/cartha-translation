lexical_decisions:
- source_word: בְּנֵי
  choice: மகன்களில்
  rationale: בן என்பதன் construct பன்மை வடிவம் வம்சப்பட்டியல் சூத்திரத்தை அறிமுகப்படுத்துகிறது. தமிழில் அடுத்த பெயரை அந்தக் குழுவைச் சேர்ந்தவராக இயல்பாகக் காட்டுவதற்கு ‘மகன்களில்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: עֻזִּיאֵל
  choice: ஊசியேல்
  rationale: எபிரெய தனிப்பெயரின் ஒலியை நவீனத் தமிழில் இயன்றவரை பிரதிபலிக்கும் ஒலிபெயர்ப்பு.
- source_word: מִיכָה
  choice: மீகா
  rationale: எபிரெய தனிப்பெயரின் நேரடியான தமிழ் ஒலிபெயர்ப்பு.
- source_word: לִ/בְנֵי
  choice: மகன்களில்
  rationale: முன்னொட்டு ל இங்கு பட்டியலின் அடுத்த வம்சத் தொடர்பை அறிமுகப்படுத்துகிறது. ‘மீகாவின் மகன்களில்’ என்பது தமிழில் இயல்பாகவும் மூலத்தின் பட்டியல் அமைப்புக்கு நெருக்கமாகவும் உள்ளது.
- source_word: שמור
  choice: சாமீர்
  rationale: மசோரா உயிர்க்குறிப்பின்படி இப்பெயர் šāmîr என வாசிக்கப்படுகிறது; ஆகவே ‘சாமீர்’ என ஒலிபெயர்க்கப்பட்டது.
