source:
  edition: WLC
  text: לַ/יִּצְהָרִ֣י שְׁלֹמ֔וֹת לִ/בְנֵ֥י שְׁלֹמ֖וֹת יָֽחַת׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/022.yaml
  text: 'For the Izharite: Shelomoth[b][a]; for the sons of Shelomoth: Jahath.'
translation:
  language: ta
  text: 'இஸ்ஹாரியருக்கு[a]: செலோமோத்; செலோமோத்தின் மகன்களுக்கு[b]: யஹாத்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இஸ்ஹாரியரைச் சேர்ந்தவருக்கு’ என்றும் மொழிபெயர்க்கலாம். இந்த நிர்வாகப் பட்டியலில் எபிரேய முன்னொட்டு தொடர்பையோ ஒதுக்கீட்டையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: வம்சப் பட்டியல்களில் ‘மகன்கள்’ என்பது விரிந்த பொருளில் ‘வழித்தோன்றல்கள்’ என்பதையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַיִּצְהָרִי
  choice: இஸ்காரியருக்கு
  rationale: இங்கு לְ என்ற முன்னொட்டு நிர்வாகப் பட்டியலில் ஒதுக்கீடு அல்லது தொடர்பைக் குறிக்கிறது; தமிழில் ‘-க்கு’ என்பது ‘இஸ்காரியருக்கு’ அல்லது ‘இஸ்காரியரைச் சேர்ந்தவருக்கு’ என்ற இரு நுணுக்கங்களையும் இயல்பாகத் தாங்குகிறது. יִצְהָרִי என்பது இஸ்கார் குலத்தைச் சேர்ந்தவரைக் குறிக்கும் குலப்பெயர்.
- source_word: שְׁלֹמוֹת
  choice: செலோமோத்
  rationale: இது நபரின் பெயர் என்பதால் பொருளாக்காமல், எபிரேய ஒலிப்புக்கு நெருக்கமாக எழுத்துப்பெயர்க்கப்பட்டுள்ளது.
- source_word: לִבְנֵי
  choice: செலோமோத்தின் மகன்களுக்கு
  rationale: בְּנֵי என்பதன் நேரடி பொருள் ‘மகன்கள்’; வம்சப் பட்டியல்களில் அது ‘வழித்தோன்றல்கள்’ என்ற விரிந்த பொருளையும் கொள்ளலாம். முன்னொட்டு לְ இங்கு பட்டியல் சார்ந்த ஒதுக்கீட்டைக் குறிக்கும் ‘-க்கு’ எனத் தரப்பட்டுள்ளது.
- source_word: יָחַת
  choice: யாகாத்
  rationale: இது நபரின் பெயர்; எபிரேய எழுத்து மற்றும் உச்சரிப்பை அடிப்படையாகக் கொண்டு ‘யாகாத்’ என எழுத்துப்பெயர்க்கப்பட்டுள்ளது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், பட்டியலுக்குரிய சுருக்கமான அமைப்பும் கண்ணியமான நடையும் பேணப்பட்டுள்ளன. எபிரேய மூலத்தின் இணை அமைப்பைக் காக்க அரைப்புள்ளிகளும் முக்காற்புள்ளிகளும் பயன்படுத்தப்பட்டுள்ளன; பெயர்கள் ஆங்கில வடிவத்தைப் பின்பற்றாமல் எபிரேயத்திலிருந்து எழுத்துப்பெயர்க்கப்பட்டுள்ளன.
