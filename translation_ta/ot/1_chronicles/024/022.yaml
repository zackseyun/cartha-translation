- from: 'இஸ்காரியருக்கு: செலோமோத்[a]; செலோமோத்தின் மகன்களுக்கு[b]: யாகாத்.'
  to: 'இஸ்ஹாரியருக்கு[a]: செலோமோத்; செலோமோத்தின் மகன்களுக்கு[b]: யஹாத்.'
  rationale: The revision corrects the Izharite clan name, adopts closer Hebrew-based transliteration for Jahath, and relocates the first note anchor to the expression addressed by its alternative rendering. The source's terse, parallel administrative-list form and the genealogical ambiguity of ‘sons’ are preserved.
