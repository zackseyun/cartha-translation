  register: நவீன செந்தமிழ் சார்ந்த, எளிதில் புரியும் கண்ணியமான நடை. ‘தந்தையர் வீடுகள்’ என்ற செயற்கையான சொற்சொல் வடிவத்திற்கு பதிலாக ‘மூதாதையர் குடும்பங்கள்’ பயன்படுத்தப்பட்டுள்ளது; எபிரெய உரையின் எண்ணிக்கை மற்றும் நிர்வாக அமைப்பு காக்கப்பட்டுள்ளன.
