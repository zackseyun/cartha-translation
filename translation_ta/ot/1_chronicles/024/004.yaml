  text: וַ/יִּמָּצְא֣וּ בְֽנֵי אֶלְעָזָ֡ר רַבִּ֞ים לְ/רָאשֵׁ֧י הַ/גְּבָרִ֛ים מִן בְּנֵ֥י אִיתָמָ֖ר וַֽ/יַּחְלְק֑וּ/ם לִ/בְנֵ֨י אֶלְעָזָ֜ר רָאשִׁ֤ים לְ/בֵית אָבוֹת֙ שִׁשָּׁ֣ה עָשָׂ֔ר וְ/לִ/בְנֵ֧י אִיתָמָ֛ר לְ/בֵ֥ית אֲבוֹתָ֖/ם שְׁמוֹנָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/004.yaml
  text: 'The sons of Eleazar were found to be more numerous[a], as heads of the men, than the sons of Ithamar, and they divided them thus: for the sons of Eleazar, sixteen heads of fathers’ houses, and for the sons of Ithamar, according to their fathers’ houses[b], eight.'
translation:
  language: ta
  text: 'எலெயாசாரின் மக்களில் தலைமைப் பொறுப்புள்ள ஆண்கள், இத்தாமாரின் மக்களிலிருந்தவர்களைவிட அதிகமாகக் காணப்பட்டார்கள்[a]. அவர்களை இவ்வாறு பிரித்தார்கள்: எலெயாசாரின் மக்களுக்கு மூதாதையர் குடும்பங்களின் தலைவர்கள் பதினாறு பேர்; இத்தாமாரின் மக்களுக்கு, அவர்களுடைய மூதாதையர் குடும்பங்களின்படி[b], எட்டுப் பேர்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தலைமைப் பொறுப்புள்ள ஆண்கள்” என்பதற்கான எபிரெயச் சொற்றொடரை “ஆண்களின் தலைவர்கள்,” “வலிமைமிக்கவர்களின் தலைவர்கள்,” அல்லது “வீரர்களின் தலைவர்கள்” என்றும் மொழிபெயர்க்கலாம். இச்சூழலில் அது ஆசாரியக் குடும்பங்களின் தலைமை ஆண்களைக் குறிப்பதாக இருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “மூதாதையர் குடும்பங்கள்” என்பது இஸ்ரவேலில் வம்சவழிக் குடும்பக்குழு அல்லது குலக்குடும்பம் என்ற உறவுமுறை சார்ந்த நிர்வாக அலகைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּמָּצְאוּ
  choice: காணப்பட்டார்கள்
  rationale: நிபால் வடிவம் ஆய்வில் தெரியவந்த நிலையைச் சுட்டுகிறது; தமிழ் சூழலில் ‘காணப்பட்டார்கள்’ இயல்பாக அதைக் கொண்டுவருகிறது.
- source_word: רַבִּים
  choice: அதிகமாக
  rationale: இத்தாமாரின் மக்களோடு உள்ள மறைமுக ஒப்பீட்டைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: לְרָאשֵׁי הַגְּבָרִים
  choice: ஆண் தலைவர்கள்
  rationale: רֹאשׁ என்பதின் தலைமைப் பொருளையும் גְּבָרִים என்பதின் அடிப்படை ‘ஆண்கள்’ பொருளையும் காக்கிறது; இச்சூழலில் தேவையின்றி ‘வீரர்கள்’ எனக் குறுக்கவில்லை.
- source_word: וַיַּחְלְקוּם
  choice: அவர்களைப் பிரித்தார்கள்
  rationale: ஆசாரியக் குழுக்களாகப் பகுத்தமைத்த செயலை நேரடியாகக் கூறுகிறது.
- source_word: רָאשִׁים
  choice: தலைவர்கள்
  rationale: குடும்ப நிர்வாக அமைப்பின் தலைமைப் பதவியை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: לְבֵית אָבוֹת
  choice: மூதாதையர் குடும்பங்களின்
  rationale: בֵּית אָבוֹת என்பது வம்சவழிக் குடும்பம் அல்லது குலக்குடும்ப நிர்வாக அலகைக் குறிக்கும்; சொற்சொல் மொழிபெயர்ப்பான ‘தந்தையர் வீடுகள்’ என்பதைக் காட்டிலும் இத்தேர்வு தெளிவானது.
- source_word: שִׁשָּׁה עָשָׂר
  choice: பதினாறு பேர்
  rationale: எண்ணிக்கை குடும்பத் தலைவர்களைக் குறிக்கிறது என்பதால் தமிழில் மனிதர் எண்ணும் ‘பேர்’ சேர்க்கப்பட்டுள்ளது.
- source_word: לְבֵית אֲבוֹתָם
  choice: அவர்களுடைய மூதாதையர் குடும்பங்களின்படி
  rationale: உடைமைப் பின்னொட்டையும் குடும்பங்களின்படி செய்யப்பட்ட பகுப்பையும் வெளிப்படையாகக் காட்டுகிறது.
- source_word: שְׁמוֹנָה
  choice: எட்டுப் பேர்
  rationale: இத்தாமார் வழியிலான குடும்பத் தலைவர்களின் எண்ணிக்கையை இயல்பான தமிழில் தருகிறது.
