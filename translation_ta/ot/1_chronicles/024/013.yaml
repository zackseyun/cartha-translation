  text: for Huppah[a], the thirteenth; for Jeshebeab, the fourteenth.
translation:
  language: ta
  text: ஹுப்பாவுக்கு பதின்மூன்றாவது; யெஷெபாபுக்கு பதினான்காவது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/חֻפָּה
  choice: ஊப்பாவுக்கு
  rationale: இந்தச் சீட்டுப் பங்கீட்டுப் பட்டியலில் பெயருக்கு முன் வரும் לְ, அந்தப் பெயருடைய ஆசாரியக் குடும்பத்துக்கு முறை ஒதுக்கப்பட்டதைக் குறிக்கிறது. தமிழில் ‘ஊப்பாவுக்கு’ என்பது இயல்பாகவும் சுருக்கமாகவும் உள்ளது.
- source_word: שְׁלֹשָׁה עָשָׂר
  choice: பதின்மூன்றாவது
  rationale: எபிரெயத்தில் எண்ணிக்கை வடிவம் இருந்தாலும், சீட்டுகளின் வரிசையில் இது வரிசை எண்ணாகச் செயல்படுவதால் தமிழில் ‘பதின்மூன்றாவது’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: לְ/יֶשֶׁבְאָב
  choice: எசபெயாபுக்கு
  rationale: முதல் பெயரைப் போலவே இங்கும் לְ ஒதுக்கீட்டைக் குறிக்கிறது. יֶשֶׁבְאָב என்ற பெயர் எபிரெய ஒலிப்புக்கு நெருக்கமாக ‘எசபெயாப்’ என எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: אַרְבָּעָה עָשָׂר
  choice: பதினான்காவது
  rationale: வடிவில் எண்ணிக்கையாக இருந்தாலும், சூழலில் சீட்டின் வரிசையைக் குறிப்பதால் இயல்பான தமிழ் வரிசை எண்ணான ‘பதினான்காவது’ பயன்படுத்தப்பட்டது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், பட்டியலுக்கேற்ற சுருக்கமான மற்றும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. எபிரெய வாக்கியத்தின் இணை அமைப்பும் நிறுத்தக்குறியும் காக்கப்பட்டுள்ளன.
