  rationale: The revision retains the concise enumerative syntax, the ordinal interpretation, and the assignment sense of the Hebrew while correcting the two proper names to source-faithful, modern Tamil transliterations. The removed footnote does not represent a meaningful unresolved ambiguity in Tamil, since the dative wording already covers the Hebrew preposition’s contextual force.
