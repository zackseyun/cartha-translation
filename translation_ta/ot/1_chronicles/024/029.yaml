    issue: The name קִישׁ is rendered as “கீசு” in the uninflected form and “கீசின்” elsewhere.
    rationale: The Hebrew ends in שׁ /š/, not /s/, and the added final -ு is unsupported. “கீஷ்” more closely represents the source and inflects naturally as “கீஷின்.”
  - severity: low
    issue: The name יְרַחְמְאֵל is rendered “எரக்மெயேல்.”
    rationale: The initial יְ /yə/ is omitted. “யெரக்மெயேல்” better preserves the source-name form without affecting the deliberately unresolved plural/singular list construction.
  - severity: low
    issue: The footnote’s alternative “கீசுக்கு” does not express the ‘of Kish’ alternative as directly as the English audit trail.
    rationale: “கீஷினுடைய” supplies the possessive/list-heading alternative, while “கீஷைக் குறித்து” supplies the topical alternative.
