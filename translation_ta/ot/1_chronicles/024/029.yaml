    reason: lexical_alternative
lexical_decisions:
- source_word: לְקִישׁ
  choice: கீசைப் பொறுத்தவரை
  rationale: முன்னொட்டு לְ இங்கு பட்டியலில் ஒரு தலைப்பை அல்லது பேசுபொருளை அறிமுகப்படுத்துகிறது. இயல்பான நவீனத் தமிழில் இதைத் தெளிவாகக் காட்டுகிறது; எபிரெயச் சொல்லின் வேறு சாத்தியங்களைக் குறிப்பில் பாதுகாக்கிறது.
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: இது ‘மகன்கள்’ என்பதன் உடைமைத் தொகை வடிவம். ஒரே பெயர் தொடர்ந்து வந்தாலும், மூலத்தின் பன்மை வடிவத்தை மொழிபெயர்ப்பில் பாதுகாக்கிறது.
- source_word: קִישׁ
  choice: கீசு / கீசின்
  rationale: தனிப்பட்ட பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது; வேற்றுமைச் சூழலுக்கேற்ப ‘கீசின்’ என அமைந்துள்ளது.
- source_word: יְרַחְמְאֵל
  choice: எரக்மெயேல்
  rationale: தனிப்பட்ட பெயர் எபிரெய உச்சரிப்பை அணுகும் வகையில் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், பட்டியல் அமைப்பைத் தக்கவைக்கும் சுருக்கமான, கண்ணியமான நடை. மூலத்திலுள்ள ‘மகன்கள்’ என்ற பன்மை வடிவமும், அடுத்து ஒரே நபரின் பெயர் வருவதால் உருவாகும் இயல்பான பதற்றமும் தீர்த்துவிடப்படாமல் பாதுகாக்கப்பட்டுள்ளன.
