  naturalness: The concise heading-plus-colon structure is natural and appropriate for this genealogical list. Using the consonant-final form கீஷ் is more natural than the uninflected form கீசு and also gives consistent inflection in கீஷின்.
  terminology: No theological terminology occurs. The names are revised to closer Tamil transliterations of קִישׁ (Qish/Kish) and יְרַחְמְאֵל (Yerahmeel/Jerahmeel).
  issues:
