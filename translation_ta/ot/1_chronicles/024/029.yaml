  text: 'For Kish: the sons of Kish[a], Jerahmeel.'
translation:
  language: ta
  text: 'கீஷைப் பொறுத்தவரை[a], கீஷின் மகன்கள்: யெரக்மெயேல்.'
  philosophy: optimal-equivalence
  footnotes:
