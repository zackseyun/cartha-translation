  text: 'The sons of Merari: of Jaaziah, his son, Shoham, Zaccur, and Ibri.'
translation:
  language: ta
  text: 'மெராரியின் மகன்கள்: யாசியாவைச் சேர்ந்தவர்கள்—அவனுடைய மகன்[a], ஷோஹாம், சக்கூர், இப்ரி.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “அவனுடைய மகன்.” இங்குள்ள வாக்கிய அமைப்பு கடினமானது. சிலர் இதை “பெனோ” என்ற ஆள்பெயராகக் கொள்கிறார்கள்; வேறு சிலர் “அவனுடைய மகன்கள்” என்ற பன்மைப் பொருளில் புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי מְרָרִי
  choice: மெராரியின் மகன்கள்
  rationale: வம்சப் பட்டியலை அறிமுகப்படுத்தும் எபிரெயக் கட்டமைப்பை நேரடியாகவும் தமிழில் இயல்பாகவும் தருகிறது.
- source_word: לְיַעֲזִיָּהוּ
  choice: யாசியாவைச் சேர்ந்தவர்கள்
  rationale: לְ முன்னொட்டு இங்கு யாசியாவுடன் தொடர்புடைய வம்சக் கிளையைக் குறிக்கிறது; பட்டியலின் உறவைத் தமிழில் தெளிவாக்க பன்மைச் சொற்றொடர் பயன்படுத்தப்பட்டது.
- source_word: בְנוֹ
  choice: அவனுடைய மகன்
  rationale: மசோரா உயிர்க்குறியீட்டுடன் உள்ள உரையின் இயல்பான ஒருமை வாசிப்பைப் பாதுகாக்கிறது; கடினமான தொடரமைப்பும் மாற்று வாசிப்புகளும் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: וְשֹׁהַם
  choice: சோகாம்
  rationale: ஆள்பெயரின் எபிரெய ஒலிப்புக்கு ஏற்ற தமிழ் ஒலிபெயர்ப்பு.
- source_word: וְזַכּוּר
  choice: சக்கூர்
  rationale: ஆள்பெயரின் எபிரெய ஒலிப்புக்கு ஏற்ற தமிழ் ஒலிபெயர்ப்பு.
- source_word: וְעִבְרִי
  choice: இப்ரி
  rationale: ஆள்பெயரின் எபிரெய ஒலிப்புக்கு ஏற்ற தமிழ் ஒலிபெயர்ப்பு.
