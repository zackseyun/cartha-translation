translation_notes:
  register: நவீனத் தரத் தமிழில், வம்சப்பட்டியலுக்கேற்ற சுருக்கமான மற்றும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. தனிப்பெயர்கள் எபிரெய ஒலிகளுக்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டுள்ளன; பழமையான ‘பிதாக்களின் வீடுகள்’ என்ற சொற்சொல் வடிவத்திற்குப் பதிலாக அதன் பொருளைத் தெளிவுபடுத்தும் ‘தந்தைவழிக் குடும்பங்கள்’ பயன்படுத்தப்பட்டுள்ளது.
