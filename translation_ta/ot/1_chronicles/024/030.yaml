base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/030.yaml
  text: 'And the sons of Mushi: Mahli[a], Eder, and Jeremoth. These were the sons of the Levites according to their fathers'' houses.'
translation:
  language: ta
  text: 'மேலும், மூஷியின் மகன்கள்: மக்லி, ஏதேர், யெரிமோத்[a]. இவர்களே தங்கள் தந்தைவழிக் குடும்பங்களின்படியான லேவியரின் வழித்தோன்றல்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இப்பெயர் “யெரேமோத்” என்றும் ஒலிபெயர்க்கப்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי מוּשִׁי
  choice: மூஷியின் மகன்கள்
  rationale: வம்சப்பட்டியல் தொடரை இயல்பான தமிழில் அறிமுகப்படுத்துகிறது. தொடக்க וּ இணைப்பைத் தனியாக ‘மேலும்’ என்று மொழிபெயர்க்காமல், பட்டியலின் தொடர்ச்சியை வாக்கிய அமைப்பில் வெளிப்படுத்துகிறது.
- source_word: מַחְלִי
  choice: மக்லி
  rationale: எபிரெயப் பெயரின் மெய்யொலி அமைப்பை நெருக்கமாகப் பின்பற்றிய ஒலிபெயர்ப்பு.
- source_word: וְעֵדֶר
  choice: ஏதேர்
  rationale: עֵדֶר என்ற தனிப்பெயரின் ஒலிபெயர்ப்பு; பெயர்ப்பட்டியலில் உள்ள இணைப்புச் சொல் தமிழில் இறுதிப் பெயருக்கு முன் கட்டாயமாகத் தேவையில்லை.
- source_word: וִירִימוֹת
  choice: எரிமோத்
  rationale: மசோரா உரையின் יְרִימוֹת வடிவத்தை அடிப்படையாகக் கொண்ட தமிழ் ஒலிபெயர்ப்பு. ‘எரேமோத்’ என்ற மாற்று ஒலிபெயர்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אֵלֶּה בְּנֵי הַלְוִיִּם
  choice: இவர்களே ... லேவியரின் வழித்தோன்றல்கள்
  rationale: இங்கு בְּנֵי என்பது உடனடியான மகன்களை மட்டும் அல்லாமல் வம்சத்தாரைக் குறிக்கும் வம்சப்பட்டியல் பயன்பாடு; ஆகவே இயல்பான தமிழில் ‘வழித்தோன்றல்கள்’ என்று தரப்பட்டுள்ளது.
- source_word: לְבֵית אֲבֹתֵיהֶם
  choice: தங்கள் தந்தைவழிக் குடும்பங்களின்படி
  rationale: தந்தைவழி மூதாதையர் குடும்பங்கள் அல்லது குலப்பிரிவுகளின்படி வகைப்படுத்தப்படுவதைத் தெளிவாகவும் சுருக்கமாகவும் வெளிப்படுத்துகிறது.
