  text: for Delaiah, the twenty-third; for Maaziah, the twenty-fourth.
translation:
  language: ta
  text: தெலாயாவுக்கு இருபத்துமூன்றாவது; மாசியாவுக்கு இருபத்துநான்காவது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִ/דְלָיָהוּ
  choice: தெலாயாவுக்கு
  rationale: முன்னொட்டு ל இந்த ஆசாரியப் பிரிவுகளின் பட்டியலில் சீட்டு அல்லது முறை அந்த நபருக்கு ஒதுக்கப்பட்டதைக் குறிக்கிறது. தமிழில் பெயருடன் ‘-க்கு’ வேற்றுமை உருபைப் பயன்படுத்துவது இயல்பாகவும் சுருக்கமாகவும் அந்தப் பொருளைத் தருகிறது.
- source_word: שְׁלֹשָׁה וְ/עֶשְׂרִים
  choice: இருபத்துமூன்றாவது
  rationale: எபிரெயத்தில் இது சொற்படியாக எண்ணிக்கை வடிவில் இருந்தாலும், தொடர்ச்சியாகக் கூறப்படும் ஆசாரியப் பிரிவுகளின் வரிசையில் இருபத்துமூன்றாம் முறையைக் குறிக்கிறது; எனவே தமிழில் வரிசை எண்ணாக மொழிபெயர்க்கப்பட்டது.
- source_word: לְ/מַעַזְיָהוּ
  choice: மாசியாவுக்கு
  rationale: இங்கும் ל முன்னொட்டு ஒதுக்கீட்டைக் குறிக்கிறது. ‘மாசியாவுக்கு’ என்பது பட்டியல் நடையில் இயல்பான தமிழாக்கம்; தனிப்பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: אַרְבָּעָה וְ/עֶשְׂרִים
  choice: இருபத்துநான்காவது
  rationale: மூலத்தில் எண்ணிக்கை வடிவம் இருந்தாலும், பட்டியலின் சூழலில் இது இருபத்துநான்காம் வரிசை அல்லது முறையைக் குறிக்கிறது; அதனால் வரிசை எண்ணாகத் தரப்பட்டது.
theological_decisions: []
translation_notes:
  register: சுருக்கமான பட்டியல் அமைப்பு பாதுகாக்கப்பட்டுள்ளது. நவீன, நிலையான தமிழில் இயல்பாக இருக்குமாறு பெயர்களோடு ‘-க்கு’ உருபும் வரிசை எண்களும் பயன்படுத்தப்பட்டுள்ளன; மூலத்தின் இரு இணையான கூறுகளும் அப்படியே தக்கவைக்கப்பட்டுள்ளன.
