lexical_decisions:
- source_word: אֲחִי מִיכָה
  choice: மீகாவின் சகோதரன்
  rationale: אֲחִי என்பது אָח என்பதன் சார்பு வடிவம்; பட்டியல் அமைப்பில் மீகாவுடனான சகோதர உறவைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: יִשִּׁיָּה
  choice: இஷியா
  rationale: எபிரேயப் பெயரின் ஒலியை நவீன தமிழில் இயல்பாக ஒலிபெயர்க்கிறது; வசனத்தில் இருமுறையும் ஒரே வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: לִבְנֵי יִשִּׁיָּה
  choice: இஷியாவின் மகன்களில்
  rationale: இங்கு לְ திசையையோ பயனையோ அல்லாமல் வம்ச அல்லது உட்பிரிவு உறவைக் குறிக்கிறது; ‘மகன்களில்’ என்பது பட்டியல் சூழலில் சகரியா அந்தக் குழுவைச் சேர்ந்தவர் என்பதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: זְכַרְיָהוּ
  choice: சகரியா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பு; எபிரேயத் தனிப்பெயரைக் மொழிபெயர்க்காமல் பெயராகவே வழங்குகிறது.
