  text: 'The brother of Micah: Isshiah; of the sons of Isshiah[a], Zechariah.'
translation:
  language: ta
  text: 'மீகாவின் சகோதரன்: இஷ்ஷியா; இஷ்ஷியாவின்[a] மகன்களில் சகரியா.'
