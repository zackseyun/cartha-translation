translation_notes:
  register: வம்ச மற்றும் பணிப்பிரிவுப் பட்டியலுக்குரிய சுருக்கமான அமைப்பு பாதுகாக்கப்பட்டுள்ளது. இரு அரைப்பகுதிகளையும் பிரிக்கும் அரைப்புள்ளி, மூலத்தின் துண்டுவாக்கியப் பட்டியல் நடையைத் தெளிவாகவும் கண்ணியமாகவும் தமிழில் வெளிப்படுத்துகிறது.
