source:
  edition: WLC
  text: וַ/יַּפִּילוּ֩ גַם הֵ֨ם גּוֹרָל֜וֹת לְ/עֻמַּ֣ת אֲחֵי/הֶ֣ם בְּנֵֽי אַהֲרֹ֗ן לִ/פְנֵ֨י דָוִ֤יד הַ/מֶּ֨לֶךְ֙ וְ/צָד֣וֹק וַ/אֲחִימֶ֔לֶךְ וְ/רָאשֵׁי֙ הָֽ/אָב֔וֹת לַ/כֹּהֲנִ֖ים וְ/לַ/לְוִיִּ֑ם אָב֣וֹת הָ/רֹ֔אשׁ לְ/עֻמַּ֖ת אָחִ֥י/ו הַ/קָּטָֽן־׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/031.yaml
  text: These also cast lots alongside their brothers[a], the sons of Aaron, before King David, Zadok, Ahimelech[b], and the heads of the fathers’ houses of the priests and of the Levites—the chief fathers’ houses as well as those of their younger brothers.
translation:
  language: ta
  text: இவர்களும் ஆரோனின் மக்களான தங்கள் சகோதரர்களுக்கு இணையாக[a], தாவீது அரசன், சாதோக்கு, அகிமெலேக்கு, ஆசாரியர்கள் மற்றும் லேவியர்களின் தந்தைவழிக் குடும்பத் தலைவர்கள் ஆகியோரின் முன்னிலையில் சீட்டுப் போட்டார்கள்—முதன்மைக் குடும்பக் கிளைக்கும் அதன் இளைய கிளைக்கும் வேறுபாடின்றி.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இணையாக” என்பதற்கு “எதிரே” அல்லது “அவர்களுக்கு ஒத்தவாறு” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் எதிரில் நிற்பதையோ, ஒன்றுக்கு ஒத்த அமைப்பையோ, இணையான நிலையையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: 'எபிரெயில் இப்பகுதி சொற்சுருக்கமாக உள்ளது: “முதன்மையான தந்தைவழிக் குடும்பம், அவனுடைய இளைய சகோதரனுக்கு இணையாக/எதிராக.” ஒருமை வடிவங்கள் ஒவ்வொரு முதன்மை மற்றும் இளைய குடும்பக் கிளையையும் பொதுவாகக் குறிப்பதாகப் புரிந்துகொள்ளப்படலாம்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּפִּילוּ ... גּוֹרָלוֹת
  choice: சீட்டுப் போட்டார்கள்
  rationale: சீட்டுப்போட்டு பொறுப்புகளைத் தீர்மானிக்கும் நடைமுறையைக் குறிக்கும் எபிரெய மரபுத்தொடருக்கு இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: גַם הֵם
  choice: இவர்களும்
  rationale: முந்தைய பகுதியில் குறிப்பிடப்பட்ட லேவியக் குழுக்களைச் சுட்டி, அவர்களும் இந்த நடைமுறையில் பங்கேற்றதைக் காட்டுகிறது.
- source_word: לְעֻמַּת אֲחֵיהֶם בְּנֵי אַהֲרֹן
  choice: தங்கள் சகோதரர்களான ஆரோனின் மக்களுடன் இணையாக
  rationale: לְעֻמַּת என்பதிலுள்ள எதிரே, ஒத்தவாறு, இணையாக என்ற பொருள் வாய்ப்புகளில், நிர்வாகப் பங்கீட்டின் சமநிலையை உணர்த்தும் ‘இணையாக’ என்பதைத் தேர்ந்தெடுத்து, மாற்றுப் பொருளை அடிக்குறிப்பில் பாதுகாக்கிறது.
- source_word: לִפְנֵי
  choice: முன்னிலையில்
  rationale: அதிகாரப்பூர்வ சாட்சிகளின் சமூகத்தில் இந்நடவடிக்கை நடைபெற்றதை இயல்பாகத் தெரிவிக்கிறது.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: தந்தைவழிக் குடும்பத் தலைவர்கள்
  rationale: ‘தந்தையர் வீடுகள்’ என்ற எபிரெய சமூக அமைப்பை சொற்சொல்லாக அல்லாமல், நவீன வாசகருக்கு புரியும் வகையில் குலக் குடும்பத் தலைமையாக வழங்குகிறது.
- source_word: אָבוֹת הָרֹאשׁ לְעֻמַּת אָחִיו הַקָּטָן
  choice: முதன்மைக் குடும்பத்தாரும் அவர்களுடைய இளைய சகோதரர்களின் குடும்பத்தாரும் ஒரே விதமாக நடத்தப்பட்டார்கள்
  rationale: சுருக்கமான, இலக்கண ரீதியாகக் கடினமான எபிரெய வாசகத்தில் உள்ள முதன்மை/இளைய கிளைகளுக்கிடையேயான ஒப்புமையைத் தெளிவாக்குகிறது; ஒருமை வடிவங்களை பகிர்வுப் பொருளில் எடுத்துக்கொள்கிறது.
theological_decisions:
- issue: ஆசாரிய மற்றும் லேவியக் குடும்பங்களுக்கு இடையேயான சீட்டுப்போட்டுத் தீர்மானித்தல்
  choice: ‘இணையாக’ மற்றும் ‘ஒரே விதமாக’ என்று நிர்வாகச் சமநிலையாக மொழிபெயர்க்கப்பட்டது
  alternative: ஆவிக்குரிய பதவி அல்லது அதிகாரத்தில் முழுச் சமத்துவத்தை வலியுறுத்துதல்
  rationale: மூலவசனம் சீட்டுப்போடும் நடைமுறை மற்றும் குடும்பக் கிளைகளின் ஒப்புமையைச் சொல்கிறது; அதற்கு அப்பாற்பட்ட சமய அதிகாரக் கோட்பாட்டைச் சேர்க்கவில்லை.
translation_notes:
  register: மொழிநடை நவீனச் செந்தமிழும் பொதுவாசிப்புக்கு ஏற்ற மரியாதைமிக்க தமிழும் கலந்தது. ‘ஆசாரியர்கள்’, ‘லேவியர்கள்’, ‘சீட்டுப் போட்டார்கள்’ ஆகிய பரிச்சயமான வேதாகமச் சொற்கள் வைக்கப்பட்டுள்ளன; ‘தந்தைவழிக் குடும்பம்’ என்பது எபிரெய சமூக அமைப்பைத் தெளிவாகக் காட்டுகிறது.
