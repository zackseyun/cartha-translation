lexical_decisions:
- source_word: לְהַקּוֹץ
  choice: அக்கோசுக்கு
  rationale: முன்னொட்டு ל இந்தச் சீட்டுப்போட்டு வரிசைப்படுத்தும் பட்டியலில் ஒதுக்கீட்டைக் குறிக்கிறது. הַקּוֹץ என்ற பெயர் தமிழில் இயல்பாக ‘அக்கோசு’ என ஒலிபெயர்க்கப்பட்டது.
- source_word: הַשְּׁבִעִי
  choice: ஏழாவது
  rationale: இது குறிப்பிட்ட ஏழாவது முறை அல்லது பிரிவைக் குறிக்கும் இடைச்சொல்லுடன் கூடிய வரிசை எண்; பட்டியல் நடைக்கு ஏற்றவாறு ‘ஏழாவது’ என மொழிபெயர்க்கப்பட்டது.
- source_word: לַאֲבִיָּה
  choice: அபியாவுக்கு
  rationale: இங்கும் முன்னொட்டு ל வரிசையில் ஒதுக்கீட்டைக் குறிக்கிறது. אֲבִיָּה என்ற பெயர் ‘அபியா’ என ஒலிபெயர்க்கப்பட்டது.
- source_word: הַשְּׁמִינִי
  choice: எட்டாவது
  rationale: ‘ஏழாவது’ என்பதற்கு இணையான அமைப்பில், பட்டியலின் எட்டாவது முறை அல்லது பிரிவைக் குறிக்கும் வரிசை எண்.
