base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/002.yaml
  text: But Nadab and Abihu died before their father[a], and they had no sons; so Eleazar and Ithamar served as priests.
translation:
  language: ta
  text: ஆனால் நாதாபும் அபிகூவும் தங்கள் தகப்பன் உயிரோடிருந்தபோதே இறந்தார்கள்; அவர்களுக்கு மகன்கள் இல்லை. ஆகவே எலெயாசாரும் இத்தாமாரும் ஆசாரியர்களாகப் பணியாற்றினார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָת
  choice: இறந்துபோனார்கள்
  rationale: מוּת என்பதன் wayyiqtol வடிவம் கடந்தகால நிகழ்வை விவரிக்கிறது; இணைந்த இரு பெயர்களுக்கு ஏற்ப தமிழில் பன்மை வினை பயன்படுத்தப்பட்டுள்ளது.
- source_word: לִפְנֵי
  choice: முன்பாகவே
  rationale: இங்கு இச்சொல் அவர்களுடைய தகப்பன் இறப்பதற்கு முன், அதாவது அவர் உயிரோடிருந்த காலத்திலேயே, அவர்கள் இறந்தார்கள் என்ற காலப் பொருளை இயல்பாகத் தருகிறது; ‘அவர் முன்னிலையில்’ என்ற இடப்பொருளும் சாத்தியமாதலால் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: אֲבִיהֶם
  choice: தங்கள் தகப்பனுக்கு
  rationale: மூன்றாம் நபர் ஆண்பால் பன்மை பின்னொட்டுடன் வரும் இச்சொல் நாதாப், அபிகூ ஆகியோரின் தகப்பனாகிய ஆரோனைக் குறிக்கிறது. ‘தங்கள்’ என்பது தமிழ் வாக்கியத்தில் எழுவாயுடனான தொடர்பைத் தெளிவாக்குகிறது.
- source_word: וּבָנִים לֹא הָיוּ לָהֶם
  choice: அவர்களுக்கு மகன்கள் இல்லை
  rationale: בָּנִים என்பது பொதுவான ‘பிள்ளைகள்’ என்பதைவிட குறிப்பாக ‘மகன்கள்’ என்று பொருள்படும்; மூலத்தின் பாலினக் குறிப்பை மொழிபெயர்ப்பு காக்கிறது.
- source_word: וַיְכַהֲנוּ
  choice: ஆசாரியர்களாகப் பணியாற்றினார்கள்
  rationale: כָּהַן என்பதன் piel வடிவம் ஆசாரியப் பணியைச் செய்வதைக் குறிக்கிறது; நிலையான பதவியை மட்டும் காட்டாமல் செயற்பாட்டு வலிமையை இச்சொற்றொடர் காக்கிறது.
- source_word: אֶלְעָזָר וְאִיתָמָר
  choice: எலெயாசாரும் இத்தாமாரும்
  rationale: எபிரெய தனிப்பெயர்கள் தமிழில் வழக்கமான வேதாகம ஒலிபெயர்ப்பு மரபுக்கு அருகாகவும் வாசிக்க இயல்பாகவும் தரப்பட்டுள்ளன.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘ஆசாரியர்களாகப் பணியாற்றினார்கள்’ என்பது மூல வினைச்சொல்லின் செயற்பாட்டுப் பொருளைக் காக்கிறது. லִפְנֵי என்பதிலுள்ள உண்மையான கால/இட இருபொருள் அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
