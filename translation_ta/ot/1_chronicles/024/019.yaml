source:
  edition: WLC
  text: אֵ֣לֶּה פְקֻדָּתָ֞/ם לַ/עֲבֹדָתָ֗/ם לָ/ב֤וֹא לְ/בֵית יְהוָה֙ כְּ/מִשְׁפָּטָ֔/ם בְּ/יַ֖ד אַהֲרֹ֣ן אֲבִי/הֶ֑ם כַּ/אֲשֶׁ֣ר צִוָּ֔/הוּ יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/019.yaml
  text: These were their appointed duties for their service[a], to enter the house of Yahweh according to their ordinance, under the hand of Aaron their father, as Yahweh, the God of Israel[b], had commanded him.
translation:
  language: ta
  text: 'யாவேவின் இல்லத்திற்குள் நுழைவதற்கான அவர்களுடைய சேவை நியமனங்கள் இவையே: தங்கள் தந்தையான ஆரோனின் அதிகாரத்தின்கீழ், அவர்களுக்குரிய ஒழுங்கின்படி; இவ்வாறே இஸ்ரவேலின் தேவனாகிய யாவே ஆரோனுக்குக் கட்டளையிட்டிருந்தார்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְקֻדָּתָם
  choice: அவர்களுடைய பணிக்கான நியமங்கள்
  rationale: இந்தச் சூழலில் இச்சொல் ஒழுங்காக வழங்கப்பட்ட பொறுப்புகள் அல்லது பணி நியமிப்புகளைக் குறிக்கிறது. ‘நியமங்கள்’ என்பது அதிகாரப்பூர்வ ஒதுக்கீட்டையும் நடைமுறைப் பொறுப்பையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: לַעֲבֹדָתָם
  choice: அவர்களுடைய பணிக்கான
  rationale: ஆசாரிய மற்றும் ஆலயச் சூழலில் עֲבֹדָה வழிபாட்டுச் சேவையைக் குறிக்கிறது. ‘பணி’ என்பது நவீன வாசகர்களுக்குத் தெளிவாகவும் தேவையற்ற பிற்கால சமயச் சொற்பயன்பாட்டைத் தவிர்ப்பதாகவும் உள்ளது.
- source_word: לָבוֹא לְבֵית יְהוָה
  choice: யாவேவின் இல்லத்திற்குள் சென்று பணியாற்ற
  rationale: בוא என்பதன் ‘வருதல்/செல்லுதல்’ என்ற இயக்கப் பொருளும், בית יהוה என்பதன் ‘யாவேவின் இல்லம்’ என்ற எபிரெய உருவகமும் காக்கப்பட்டுள்ளன. தமிழில் வாக்கியத்தின் நோக்கம் தெளிவாக இருக்க ‘பணியாற்ற’ சூழலிலிருந்து வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது.
- source_word: כְּמִשְׁפָּטָם
  choice: தங்களுக்கு விதிக்கப்பட்ட ஒழுங்கின்படி
  rationale: מִשְׁפָּט இங்கு தீர்ப்பைக் காட்டிலும் நிர்ணயிக்கப்பட்ட விதிமுறை அல்லது பணி வரிசையைக் குறிக்கிறது. ‘விதிக்கப்பட்ட ஒழுங்கு’ சட்டபூர்வ தன்மையையும் நடைமுறை வரிசையையும் ஒருங்கே எடுத்துரைக்கிறது.
- source_word: בְּיַד אַהֲרֹן
  choice: ஆரோனின் மேற்பார்வையில்
  rationale: ‘ஆரோனின் கையின்கீழ்’ என்ற சொற்சொல் தமிழில் தெளிவில்லாமல் இருக்கலாம். இச்சூழலில் உள்ள நிர்வாகம்/அதிகாரம் என்ற இடியோமாட்டிக் பொருளை ‘மேற்பார்வையில்’ இயல்பாகத் தருகிறது.
- source_word: אֲבִיהֶם
  choice: தங்கள் தந்தையான
  rationale: ஆரோன் ஆசாரியக் குலத்தின் மூதாதையாக இருப்பினும், எபிரெயத்தின் நேரடியான ‘அவர்களுடைய தந்தை’ என்ற உறவுமொழி காக்கப்படுகிறது.
- source_word: כַּאֲשֶׁר צִוָּהוּ
  choice: ஆரோனுக்குக் கட்டளையிட்டபடியே
  rationale: צִוָּהוּ-இல் உள்ள ஒருமை ஆண்பால் பின்னொட்டு ஆரோனைக் குறிக்கிறது. தமிழில் சுட்டுப்பெயரின் ஐயத்தைத் தவிர்க்க அவரது பெயர் மீண்டும் பயன்படுத்தப்பட்டுள்ளது.
- source_word: יְהוָה אֱלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் தேவனாகிய யாவே
  rationale: தெய்வீகப் பெயர் யாவே என ஒலிபெயர்க்கப்பட்டு, ‘இஸ்ரவேலின் தேவன்’ என்பது அதற்கு விளக்கப் பெயராக இயல்பான தமிழில் அமைக்கப்பட்டுள்ளது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் உடன்படிக்கைப் பெயரான நான்கெழுத்துப் பெயர் நேரடியாக உள்ளது. பொதுப்பட்டமான ‘கர்த்தர்’ என்பதற்குப் பதிலாக ‘யாவே’ என்பது அந்தத் தனிப்பெயரைத் தெளிவாகக் காக்கிறது.
- issue: בְּיַד אַהֲרֹן என்பதில் அதிகாரமா அல்லது செயற்படுத்தும் கருவியா
  choice: ஆரோனின் மேற்பார்வையில்
  alternative: ஆரோனின் கையால் / ஆரோனின் கையின்கீழ்
  rationale: இச்சூழல் ஆசாரியப் பணிப் பிரிவுகளின் நிர்வாக ஒழுங்கைப் பற்றியது. ஆகவே அதிகாரம் மற்றும் வழிநடத்துதல் என்ற பொருள் முன்னிலைப்படுத்தப்படுகிறது; சொற்றொடரின் நேரடி உருவகம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் ‘யாவேவின் இல்லம்’ என்ற உருவகம் காக்கப்பட்டுள்ளது; தமிழில் இயல்பற்ற ‘கையின்கீழ்’ என்ற சொல்லாக்கத்தின் பொருள் முதன்மை உரையில் ‘மேற்பார்வையில்’ எனவும், நேரடி வடிவம் அடிக்குறிப்பிலும் தரப்பட்டுள்ளது.
