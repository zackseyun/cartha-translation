  text: לִ/רְחַבְיָ֑הוּ לִ/בְנֵ֣י רְחַבְיָ֔הוּ הָ/רֹ֖אשׁ יִשִּׁיָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/021.yaml
  text: For Rehabiah[a], from the sons of Rehabiah, the chief was Isshiah.
translation:
  language: ta
  text: ரெகபியாவைப் பொறுத்தவரை,[a] ரெகபியாவின் மகன்களில் தலைவன் இஷ்ஷியா.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, ‘ரெகபியாவின் குடும்பக் கிளைக்கு: ரெகபியாவின் மகன்களில் தலைவன் இஷ்ஷியா.’'
    reason: לְ முன்னொட்டு பட்டியலில் குடும்பக் கிளை அல்லது அதற்குரிய பிரிவை அறிமுகப்படுத்துவதாகவும் புரிந்துகொள்ளப்படலாம்.
lexical_decisions:
- source_word: לִ/רְחַבְיָהוּ
  choice: ரெகபியாவைப் பொறுத்தவரை
  rationale: לְ முன்னொட்டு இங்கு பட்டியலின் அடுத்த குடும்பக் கிளையை அறிமுகப்படுத்துகிறது. ‘ரெகபியாவைப் பொறுத்தவரை’ என்பது அந்தத் தலைப்பு உறவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לִ/בְנֵי רְחַבְיָהוּ
  choice: ரெகபியாவின் மகன்களில்
  rationale: בְּנֵי என்பது ‘மகன்கள்/வழிவந்தவர்கள்’ என்று பொருள்படும். பெயரிடப்படும் தலைவன் அந்தக் குடும்பக் கிளையைச் சேர்ந்தவர் என்பதை ‘மகன்களில்’ தெளிவாகக் காட்டுகிறது; வம்சப்பட்டியல் மொழிநடைக்கேற்ப ‘மகன்கள்’ தக்கவைக்கப்படுகிறது.
- source_word: הָ/רֹאשׁ
  choice: தலைவன்
  rationale: רֹאשׁ என்பதன் அடிப்படைப் பொருள் ‘தலை’; இங்கு குடும்பப் பிரிவின் முதன்மைப் பிரதிநிதியைக் குறிக்கிறது. ‘தலைவன்’ நவீனத் தமிழில் இயல்பாகவும் சூழலுக்குப் பொருத்தமாகவும் உள்ளது.
- source_word: יִשִּׁיָּה
  choice: இஷ்ஷியா
  rationale: தனிப்பட்ட பெயர் மொழிபெயர்க்கப்படாமல் எபிரெய மெய்யொலி இரட்டிப்பைப் பிரதிபலிக்கும் வகையில் ஒலிபெயர்க்கப்பட்டுள்ளது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், வம்சவழி மற்றும் நிர்வாகப் பட்டியலுக்குரிய சுருக்கமான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. பெயர்கள் எபிரெய வடிவத்துக்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டுள்ளன.
