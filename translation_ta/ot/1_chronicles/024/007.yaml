  text: The first lot came out for Jehoiarib[a], the second for Jedaiah.
translation:
  language: ta
  text: முதலாம் சீட்டு யோயாரீபுக்கு வந்தது[a]; இரண்டாம் சீட்டு யெதாயாவுக்கு வந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “முதலாம் சீட்டு யோயாரீபுக்கு விழுந்தது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: வந்தது
  rationale: יצא என்பதன் அடிப்படைப் பொருள் ‘வெளியே போ/வா’ என்பதாகும். சீட்டுப் போடும் சூழலில் முடிவு ஒருவருக்கு ‘வந்தது’ என்பது தமிழில் இயல்பாகவும் எபிரெயச் சொல்லுக்கு நெருக்கமாகவும் உள்ளது.
- source_word: הַגּוֹרָל
  choice: சீட்டு
  rationale: גוֹרָל என்பது முடிவை அல்லது ஒதுக்கீட்டை நிர்ணயிக்கப் பயன்படுத்தப்படும் சீட்டைக் குறிக்கிறது; ஆசாரியப் பணி முறைப் பிரிவுகளை ஒதுக்கும் இச்சூழலில் ‘சீட்டு’ தெளிவான, வழக்கமான சொல்.
- source_word: הָרִאשׁוֹן
  choice: முதலாம்
  rationale: இது வரிசையில் முதலாவதைக் குறிக்கும் எண் பெயரடை. தொடரும் ‘இரண்டாம்’ என்பதுடன் சமச்சீராக ‘முதலாம்’ அமைந்துள்ளது.
- source_word: לִיהוֹיָרִיב
  choice: யோயாரீபுக்கு
  rationale: முன்னொட்டு ל சீட்டு ஒதுக்கப்பட்ட பெறுநரைக் குறிக்கிறது; தமிழின் நான்காம் வேற்றுமை உருபான ‘-க்கு’ இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לִידַעְיָה
  choice: யெதாயாவுக்கு
  rationale: இங்கும் ל இரண்டாம் சீட்டு ஒதுக்கப்பட்ட பெறுநரைக் குறிக்கிறது; ‘-க்கு’ என்பது இயல்பான தமிழ் வடிவம்.
- source_word: הַשֵּׁנִי
  choice: இரண்டாம் சீட்டு
  rationale: எபிரெயத்தில் பெயர்ச்சொல் இரண்டாம் பகுதியில் விடுபட்டிருந்தாலும், தமிழில் தெளிவுக்காக ‘சீட்டு’ மீண்டும் சேர்க்கப்பட்டுள்ளது; ‘இரண்டாம்’ வரிசையைத் துல்லியமாகக் காட்டுகிறது.
