translation_notes:
  register: நவீனத் தரத் தமிழில், நிர்வாகப் பட்டியலின் சுருக்கத்தைக் காத்து மொழிபெயர்க்கப்பட்டுள்ளது. ஆட்பெயர்கள் எபிரெய உச்சரிப்புக்கு அண்மையாக ஒலிபெயர்க்கப்பட்டுள்ளன; ‘வந்தது’ என்ற முதன்மைத் தெரிவுடன், சீட்டுப் போடும் சூழலில் இயல்பான ‘விழுந்தது’ அடிக்குறிப்பில் தரப்பட்டுள்ளது.
