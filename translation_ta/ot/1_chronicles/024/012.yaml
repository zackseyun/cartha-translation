  text: the eleventh to Eliashib[b][a], the twelfth to Jakim.
translation:
  language: ta
  text: பதினோராவது எலியாசீபுக்கு[a][b]; பன்னிரண்டாவது யாக்கீமுக்கு.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘எலியாசீபுக்காக … யாக்கீமுக்காக’ என்றும் பொருள் கொள்ளலாம். இந்த ஒதுக்கீட்டுப் பட்டியலில் வரும் எபிரெய முன்னொட்டு இருவிதமாகவும் மொழிபெயர்க்கப்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்குச் சொல்: ‘பதினொன்று … பன்னிரண்டு.’ சீட்டுகளின் தொடர்வரிசை என்ற சூழலில் இவை வரிசை எண்களாகப் பயன்படுத்தப்பட்டுள்ளன.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְ/אֶלְיָשִׁיב
  choice: எலியாசீபுக்கு
  rationale: முன்னொட்டான לְ இங்கு சீட்டின் வரிசை ஒதுக்கப்படுவதைக் குறிக்கிறது. தமிழின் ‘-க்கு’ வேற்றுமை உருபு இந்த ஒதுக்கீட்டுப் பொருளை இயல்பாகத் தெரிவிக்கிறது; பெயர் எபிரெய ஒலிப்புக்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: עַשְׁתֵּי עָשָׂר
  choice: பதினோராவது
  rationale: சொல்லமைப்பில் இது ‘பதினொன்று’ என்ற எண்ணாக இருந்தாலும், ஆசாரியப் பிரிவுகளுக்கான சீட்டுகளின் தொடர்வரிசையில் வரிசை எண்ணாகச் செயல்படுவதால் ‘பதினோராவது’ என்று மொழிபெயர்க்கப்பட்டது. மூலத்தில் இல்லாத ‘சீட்டு’ சேர்க்கப்படவில்லை.
- source_word: לְ/יָקִים
  choice: யாக்கீமுக்கு
  rationale: לְ மீண்டும் ஒதுக்கீட்டைக் குறிக்கிறது; தமிழில் ‘-க்கு’ இயல்பான இணை. יָקִים என்ற எபிரெய உயிரொலிப்பைப் பிரதிபலிக்கும் வகையில் பெயர் ‘யாக்கீம்’ என ஒலிபெயர்க்கப்பட்டது.
- source_word: שְׁנֵים עָשָׂר
  choice: பன்னிரண்டாவது
  rationale: சொல்லமைப்பில் ‘பன்னிரண்டு’ என்றாலும், பட்டியல் சூழலில் இது வரிசை எண்ணாக இருப்பதால் ‘பன்னிரண்டாவது’ என வழங்கப்பட்டது; ‘சீட்டு’ என்பது சூழலில் புரிந்துகொள்ளப்படுவதால் உரையில் சேர்க்கப்படவில்லை.
