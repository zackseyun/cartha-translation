  language: en
  yaml_path: translation/ot/1_chronicles/024/001.yaml
  text: 'These were the divisions of the sons of Aaron: the sons of Aaron were Nadab and Abihu[a], Eleazar and Ithamar.'
translation:
  language: ta
  text: 'ஆரோனின் மகன்களின் பிரிவுகள் இவை: ஆரோனின் மகன்கள் நாதாப், அபிகூ, எலெயாசார், இத்தாமார்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/לִ/בְנֵי אַהֲרֹן
  choice: ஆரோனின் மகன்களுக்குரிய
  rationale: எபிரெய முன்னொட்டுகளின் தொடர்புப் பொருளைத் தலைப்புப் போன்ற இச்சூழலில் இயல்பான தமிழில் வெளிப்படுத்துகிறது; மூலத்தில் இல்லாத காலச்சுட்டுச் சொல்லைச் சேர்க்கவில்லை.
- source_word: מַחְלְקוֹתָם
  choice: பிரிவுகள்
  rationale: ஒழுங்குபடுத்தப்பட்ட ஆசாரியக் குழுக்களைக் குறிக்கும் சொல்லுக்கு எளிதில் புரியும் பரந்த தமிழ்ச் சொல்; உடைமைப் பொருள் முந்தைய தொடரில் இயல்பாக வெளிப்படுகிறது.
- source_word: בְּנֵי אַהֲרֹן
  choice: ஆரோனின் மகன்கள்
  rationale: மூலத்தின் உறவுமுறை மற்றும் ஆண்பால் குறிப்பை நேரடியாகவும் இயல்பாகவும் காக்கிறது.
- source_word: נָדָב
  choice: நாதாப்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் அறியப்பட்ட பெயரொலிப்பு.
- source_word: וַאֲבִיהוּא
  choice: அபியூ
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் அறியப்பட்ட பெயரொலிப்பு; பெயர்ப்பட்டியலில் இணைப்புகள் தமிழில் இயல்பாக விடப்பட்டுள்ளன.
- source_word: אֶלְעָזָר
  choice: எலெயாசார்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் அறியப்பட்ட பெயரொலிப்பு.
- source_word: וְאִיתָמָר
  choice: ஈத்தாமார்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் அறியப்பட்ட பெயரொலிப்பு; இறுதி இணைப்புச் சொல்லைச் சேர்க்காமல் பட்டியல் அமைப்பைப் பின்பற்றுகிறது.
