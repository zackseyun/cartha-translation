base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/020.yaml
  text: 'And for the remaining sons of Levi: for the sons of Amram[a], Shubael; for the sons of Shubael[b], Jehdeiah.'
translation:
  language: ta
  text: 'லேவியின் எஞ்சிய மகன்களில்: அம்ராமின் மகன்களில், சூபாயேல்; சூபாயேலின் மகன்களில், யெஹ்தெயா[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இந்தப் பட்டியலில் வாக்கியங்கள் சுருக்கமாக உள்ளன; குறிப்பிடப்பட்ட தனிநபர் பெயர்கள் ஒவ்வொரு குலக்கிளையின் தலைவரையோ பிரதிநிதியையோ குறிக்கக்கூடும்.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/לִ/בְנֵי לֵוִי הַ/נּוֹתָרִים
  choice: லேவியின் எஞ்சிய மகன்களில்
  rationale: இது நிர்வாகப் பட்டியலின் அடுத்த பகுதியை அறிமுகப்படுத்தும் தொடர். הַנּוֹתָרִים என்பதன் ‘எஞ்சிய’ என்ற பொருளையும், לִבְנֵי என்பதன் வகைப்படுத்தும் பட்டியல் செயலையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: לִ/בְנֵי עַמְרָם
  choice: அம்ராமின் மகன்களில்
  rationale: அம்ராமியக் கிளையை அறிமுகப்படுத்தும் எபிரெயப் பட்டியல் வாய்பாட்டைச் சுருக்காமல் பிரதிபலிக்கிறது.
- source_word: שׁוּבָאֵל
  choice: சூபவேல்
  rationale: எபிரெயப் பெயரின் ஒலியை நவீனத் தமிழில் அணுக்கமாக எழுத்துப்பெயர்க்கிறது.
- source_word: לִ/בְנֵי שׁוּבָאֵל
  choice: சூபவேலின் மகன்களில்
  rationale: முந்தைய பட்டியல் அமைப்பை மீண்டும் தக்கவைத்து அடுத்த உட்கிளையை அறிமுகப்படுத்துகிறது.
- source_word: יֶחְדְּיָהוּ
  choice: யெக்தெயா
  rationale: எபிரெயப் பெயரின் மெய்யொலி அமைப்பையும் இறுதியில் உள்ள தெய்வீகப் பெயர்க் கூறின் சுருங்கிய ஒலிப்பையும் தமிழில் அணுக்கமாகக் காட்டும் எழுத்துப்பெயர்ப்பு.
