  text: Joah his son[a], Iddo his son, Zerah his son, Jeatherai his son.
translation:
  language: ta
  text: யோவாக் அவனுடைய மகன்; இத்தோ அவனுடைய மகன்; சேராக் அவனுடைய மகன்; யெஅத்ராய் அவனுடைய மகன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இப்பெயர் “யெத்ராய்” என்றும் எழுத்துப்பெயர்க்கப்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹאָח
  choice: யோவாக்
  rationale: எபிரெய தனிப்பெயரின் ஒலியமைப்பைத் தமிழில் இயன்றவரை நேரடியாக எழுத்துப்பெயர்த்தது.
- source_word: בְּנוֹ
  choice: அவனுடைய மகன்
  rationale: வம்சப் பட்டியல் அமைப்பில் בֵּן என்பதற்கான இயல்பான பொருள் ‘மகன்’; தலைமுறைகள் சில நேரங்களில் சுருக்கப்பட்டிருக்கக்கூடும் என்றாலும், இங்கு மூலச்சொல்லின் உறவுமுறைக் குறிப்பே பாதுகாக்கப்படுகிறது.
- source_word: עִדּוֹ
  choice: இத்தோ
  rationale: எபிரெய தனிப்பெயரை அதன் ஒலிப்புக்கு நெருக்கமாகத் தமிழில் எழுத்துப்பெயர்த்தது.
- source_word: זֶרַח
  choice: சேராக்
  rationale: எபிரெய தனிப்பெயரை மொழிபெயர்க்காமல், அதன் ஒலிப்புக்கு நெருக்கமாகத் தமிழில் எழுத்துப்பெயர்த்தது.
- source_word: יְאָתְרַי
  choice: யெஆத்ராய்
  rationale: மசோரா உயிர்க்குறிகளுடன் காணப்படும் எபிரெய வடிவத்தின் தனித்த உயிரொலிகளைப் பாதுகாக்கும் தமிழ் எழுத்துப்பெயர்ப்பு; வாசிப்பில் சுருக்கப்பட்ட மாற்றுவடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், வம்சப் பட்டியலுக்கேற்ற சுருக்கமானவும் கண்ணியமானவும் உள்ள நடை பயன்படுத்தப்பட்டுள்ளது. ஒவ்வொரு בְּנוֹ என்பதும் தெளிவுக்காக ‘அவனுடைய மகன்’ என்று மீண்டும் வழங்கப்பட்டுள்ளது. ஆங்கில ஆலோசனை உரையில் மாற்றுப் பெயருக்கான அடிக்குறி ‘யோவாக்’ என்பதற்குப் பின் இருந்தாலும், அது יְאָתְרַי என்ற கடைசிப் பெயரையே சார்வதால் தமிழ் உரையில் அந்தப் பெயருக்குப் பின் பொருத்தப்பட்டுள்ளது.
