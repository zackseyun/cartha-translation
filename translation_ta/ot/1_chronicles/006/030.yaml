  text: בֶּן חֲשַׁבְיָ֥ה בֶן אֲמַצְיָ֖ה בֶּן חִלְקִיָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/030.yaml
  text: the son of Hashabiah, the son of Amaziah, the son of Hilkiah.
translation:
  language: ta
  text: அசபியாவின் மகன், அமத்சியாவின் மகன், இல்க்கியாவின் மகன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן
  choice: மகன்
  rationale: வம்சப் பட்டியலில் இச்சொல் மகன் அல்லது வழித்தோன்றல் உறவைக் குறிக்கலாம். இங்கு எபிரெய மூலத்தின் மீளும் வம்சவழிச் சூத்திரத்தைத் தெளிவாகப் பாதுகாக்க ‘மகன்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: חֲשַׁבְיָה
  choice: அசபியா
  rationale: எபிரெய தனிப்பெயரின் ஒலிவடிவத்தைத் தமிழில் இயல்பாகவும் வேதாகமப் பெயர் மரபுக்கு ஏற்றவாறும் எழுத்துப்பெயர்த்த வடிவம்.
- source_word: אֲמַצְיָה
  choice: அமத்சியா
  rationale: எபிரெய பெயரிலுள்ள צ ஒலியை ‘த்ச’ எனக் காட்டி, தனிப்பெயரை மொழிபெயர்க்காமல் எழுத்துப்பெயர்த்துள்ளது.
- source_word: חִלְקִיָּה
  choice: இல்க்கியா
  rationale: எபிரெய தனிப்பெயரின் ஒலியமைப்பைத் தமிழில் வாசிக்க ஏற்றவாறு எழுத்துப்பெயர்த்த வடிவம்.
theological_decisions:
- issue: בֶּן குறிக்கும் உறவின் துல்லியம்
  choice: ‘மகன்’ என்ற வம்சவழிச் சொல்லை வைத்திருத்தல்
  alternative: ‘வழித்தோன்றல்’
  rationale: בֶּן உடனடி மகனையும் விரிந்த வம்ச உறவையும் குறிக்கக்கூடும். மூலத்தில் இடைவெளி இருப்பதற்கான தனிப்பட்ட குறிப்பு இல்லாததால், பொதுவான வம்சவழிச் சூத்திரமான ‘மகன்’ பயன்படுத்தப்படுகிறது; இதனால் தேவையின்றி உறவின் துல்லியம் மாற்றப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், வம்சப் பட்டியலுக்குரிய சுருக்கமான மற்றும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. எபிரெய மூலத்தில் בֶּן மூன்று முறை வருவதுபோல ‘மகன்’ மூன்று முறை மீள்கிறது.
