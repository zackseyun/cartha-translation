base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/048.yaml
  text: To the sons of Merari, according to their clans, from the tribe of Reuben, from the tribe of Gad, and from the tribe of Zebulun, twelve cities by lot.
translation:
  language: ta
  text: மெராரியின் மகன்களுக்கு, அவர்களுடைய குலங்களின்படி, ரூபன் கோத்திரத்திலிருந்தும் காத் கோத்திரத்திலிருந்தும் செபுலோன் கோத்திரத்திலிருந்தும், சீட்டுப்போட்டு பன்னிரண்டு பட்டணங்கள் ஒதுக்கப்பட்டன.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மூலத்தில் ‘ஒதுக்கப்பட்டன’ என்ற வினைச்சொல் வெளிப்படையாக இல்லை; வாக்கியத்தின் சூழலிலிருந்து அது புரிந்துகொள்ளப்படுகிறது.
    reason: மூலத்தின் சுருக்கமான, வினையற்ற சொல்லமைப்பையும் தமிழில் தெளிவுக்காகச் செய்யப்பட்ட நிரப்புதலையும் வாசகருக்குத் தெரிவிக்கிறது.
lexical_decisions:
- source_word: לִבְנֵי מְרָרִי
  choice: மெராரியின் மகன்களுக்கு
  rationale: ஒதுக்கீட்டைப் பெறும் மெராரியின் வழிவந்தவர்களைக் குறிக்கும் மரபுவழிச் சொல்லமைப்பை இயல்பான தமிழில் காக்கிறது.
- source_word: לְמִשְׁפְּחוֹתָם
  choice: அவர்களுடைய குலங்களின்படி
  rationale: கோத்திரத்துக்குள் உள்ள வம்சக் குழுக்களை இச்சூழலில் ‘குலங்கள்’ துல்லியமாகக் குறிக்கிறது.
- source_word: מִמַּטֵּה
  choice: கோத்திரத்திலிருந்து
  rationale: நிலம் மற்றும் பட்டணங்களின் பங்கீட்டுச் சூழலில் מַטֶּה என்பது ‘கோத்திரம்’ என்று பொருள்படுகிறது; மூன்று முறை வரும் மூலச் சொல்லமைப்பும் தமிழில் காக்கப்பட்டுள்ளது.
- source_word: רְאוּבֵן / גָד / זְבוּלֻן
  choice: ரூபன் / காத் / செபுலோன்
  rationale: எபிரெயப் பெயர்களின் ஒலிப்பை நவீனத் தமிழில் இயன்றவரை தெளிவாக எழுத்துப்பெயர்க்கிறது.
- source_word: בַּגּוֹרָל
  choice: சீட்டுப்போட்டு
  rationale: ஒதுக்கீடு செய்யப்பட்ட முறையை இயல்பான தற்போதைய தமிழில் தெரிவிக்கிறது.
- source_word: עָרִים שְׁתֵּים עֶשְׂרֵה
  choice: பன்னிரண்டு பட்டணங்கள்
  rationale: עִיר என்பதற்கு பட்டணப் பங்கீட்டுப் பட்டியல்களில் பொருத்தமான வழக்குச் சொல்லையும் எண்ணையும் நேரடியாக வழங்குகிறது.
theological_decisions:
- issue: எபிரெய மூலத்தில் வெளிப்படையான வினைச்சொல் இல்லாமை
  choice: ‘ஒதுக்கப்பட்டன’ என்பதைச் சேர்த்து வாக்கியப் பொருளைத் தெளிவாக்குதல்
  alternative: ‘சீட்டுப்படி பன்னிரண்டு பட்டணங்கள்’ என்று வினையற்ற அமைப்பை அப்படியே வைத்தல்
  rationale: முந்தைய ஒதுக்கீட்டுச் சூழலில் மறைந்துள்ள செயலைத் தமிழில் நிறைவான வாக்கியமாகச் சொல்ல வேண்டியுள்ளது; இது ஒதுக்கீட்டின் முகவர் அல்லது இறையியல் பொருளை மேலதிகமாக நிர்ணயிப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்கு புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘கோத்திரம்’, ‘குலம்’, ‘சீட்டுப்போட்டு’, ‘பட்டணம்’ ஆகியவை பட்டியல் மற்றும் பங்கீட்டுச் சூழலுக்கு ஏற்ற சொற்களாகத் தேர்ந்தெடுக்கப்பட்டன.
