  source_fidelity: 'எபிரெய மூலத்தின் வம்சவரிசைச் சுருக்கத்தைத் துல்லியமாகக் காக்கிறது: எல்க்கானா, அமாசாய், அகிமோத் ஆகிய பெயர்களும், எல்க்கானாவுடன் உள்ள ‘மகன்கள்’ என்ற உறவும் சரியாகத் தரப்பட்டுள்ளன. தொடக்க வாவ் மற்றும் இரண்டாம் பெயருக்கு முன் உள்ள இணைப்பு தமிழ்ப் பட்டியல் நிறுத்தற்குறி அமைப்பில் இயல்பாக உட்கொள்ளப்பட்டுள்ளன; பொருள் இழப்பு இல்லை.'
  naturalness: '‘எல்க்கானாவின் மகன்கள்: அமாசாய், அகிமோத்.’ என்பது நவீன தரமான தமிழில் சுருக்கமான வம்சப்பட்டியல் நடையாக இயல்பாக உள்ளது. பெயர்களை இணைக்க ‘மற்றும்’ சேர்க்காமல் காற்புள்ளியைப் பயன்படுத்தியிருப்பதும் இந்நடைக்கு ஏற்றது.'
  terminology: தனிப்பெயர்கள் ஒலிபெயர்க்கப்பட்டுள்ளன. ‘எல்க்கானா,’ ‘அமாசாய்,’ ‘அகிமோத்’ ஆகிய வடிவங்கள் எபிரெயப் பெயர்களைத் தெளிவாகவும் நிலையாகவும் பிரதிபலிக்கின்றன. இறையியல் அல்லது விளக்கவியல் சொற்கள் இவ்வசனத்தில் இல்லை.
