  text: 'And the sons of Elkanah: Amasai and Ahimoth[a].'
translation:
  language: ta
  text: 'எல்க்கானாவின் மகன்கள்: அமாசாய், அகிமோத்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: மகன்கள்
  rationale: בְנֵי என்பது அடுத்துவரும் பெயருடன் இணைந்து ‘மகன்கள்’ என்று பொருள்படுகிறது. வம்சப்பட்டியல் நடையில் தொடக்க ו தனியாக மொழிபெயர்க்கப்படாமல், இயல்பான தமிழ் பட்டியல் அமைப்பில் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: אֶלְקָנָה
  choice: எல்க்கானா
  rationale: எபிரெய தனிப்பெயர் நவீனத் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது; நடுவிலுள்ள மெய்யொலியின் வலிமையைக் காட்ட ‘க்க’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: עֲמָשַׂי
  choice: அமாசாய்
  rationale: எபிரெய தனிப்பெயரின் ஒலிவடிவத்தைத் தமிழில் இயல்பாகப் பிரதிபலிக்கும் ஒலிபெயர்ப்பு.
- source_word: וַ/אֲחִימוֹת
  choice: அகிமோத்
  rationale: தனிப்பெயர் எபிரெய உச்சரிப்புக்கு அண்மையாக ஒலிபெயர்க்கப்பட்டுள்ளது. இணைப்புச் சொல் தமிழ் பட்டியலில் காற்புள்ளியால் இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது.
