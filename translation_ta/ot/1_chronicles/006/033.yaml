  text: וַ/אֲחֵי/הֶ֖ם הַ/לְוִיִּ֑ם נְתוּנִ֕ים לְ/כָ֨ל עֲבוֹדַ֔ת מִשְׁכַּ֖ן בֵּ֥ית הָ/אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/033.yaml
  text: And their brothers the Levites were appointed for all the service of the tabernacle of the house of God[a].
translation:
  language: ta
  text: அவர்களுடைய சகோதரர்களாகிய லேவியர்கள், கடவுளின் இல்லத்தின் திருக்கூடாரத்தின் எல்லாச் சேவைகளுக்கும் நியமிக்கப்பட்டிருந்தார்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கொடுக்கப்பட்டவர்கள்”; எபிரெயச் சொல் சொற்பட “கொடுக்கப்பட்டவர்கள்” என்று பொருள்படும்; இங்கு ஒரு பணிக்காக ஒதுக்கப்பட்டவர்கள் அல்லது நியமிக்கப்பட்டவர்கள் என்ற பொருளில் உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: அவர்களுடைய சகோதரர்களான
  rationale: வாவ் இணைப்பைத் தமிழ் வாக்கிய ஓட்டத்தில் இயல்பாக உள்ளடக்கி, אֲחֵי என்பதன் உறவுமுறைச் சொல்லை ‘சகோதரர்கள்’ என வெளிப்படையாகத் தக்கவைக்கிறது; இங்கு அது சக குலத்தாரையும் குறிக்கலாம்.
- source_word: הַלְוִיִּם
  choice: லேவியர்கள்
  rationale: லேவி கோத்திரத்தைச் சேர்ந்தவர்களைக் குறிக்கும் வழக்கமான, துல்லியமான பெயர்.
- source_word: נְתוּנִים
  choice: நியமிக்கப்பட்டிருந்தார்கள்
  rationale: נתן வேரிலிருந்து வந்த இந்தச் செயல்பாட்டு வினையெச்சம் சொற்பட ‘கொடுக்கப்பட்டவர்கள்’ எனினும், இவ்வழிபாட்டுப் பணிச் சூழலில் ஒரு கடமைக்கு அமர்த்தப்பட்ட அல்லது ஒதுக்கப்பட்ட நிலையை இயல்பாகத் தெரிவிக்கிறது.
- source_word: לְכָל עֲבוֹדַת
  choice: எல்லாப் பணிகளுக்காகவும்
  rationale: לְ நோக்கம் அல்லது பணியொதுக்கீட்டைக் குறிக்கிறது; עֲבוֹדָה இங்கு வழிபாட்டுத் தலத்தில் செய்யப்படும் சேவை அல்லது வேலையைச் சுட்டுவதால், நவீனத் தமிழில் தெளிவான ‘பணிகள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: מִשְׁכַּן
  choice: திருக்கூடாரம்
  rationale: கடவுளின் வாசஸ்தலமாகிய கூடாரத்தைக் குறிக்கும் மִשְׁכָּן என்பதற்கான அறியப்பட்ட வேதாகமத் தமிழ் சொல்; ‘ஆலயம்’ என்று மாற்றி காலச்சூழலைத் தட்டையாக்கவில்லை.
- source_word: בֵּית הָאֱלֹהִים
  choice: கடவுளின் இல்லம்
  rationale: எபிரெயச் சொற்றொடரின் நேரடியான பொருளான ‘கடவுளின் இல்லம்’ என்பதைக் காத்து, அதை ‘ஆலயம்’ என மட்டும் விளக்கவில்லை.
theological_decisions:
- issue: நாளாகமச் சூழலில் ‘திருக்கூடாரம்’ மற்றும் ‘கடவுளின் இல்லம்’ ஆகியவற்றின் தொடர்பு
  choice: கடவுளின் இல்லத்தின் திருக்கூடாரம்
  alternative: கடவுளின் ஆலயம்; கடவுளின் இல்லமாகிய திருக்கூடாரம்
  rationale: மூலத்தில் מִשְׁכַּן மற்றும் בֵּית הָאֱלֹהִים ஆகிய இரு கூறுகளும் உள்ளன. அவற்றை ஒரே ‘ஆலயம்’ என்ற சொல்லுக்குள் சுருக்காமல் இரண்டையும் தக்கவைத்து, அவற்றுக்கிடையிலான சற்றே இறுக்கமான தொடர்பையும் தேவையின்றித் தீர்மானிக்காமல் விடுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் மரியாதைமிக்க நடையிலும் வடிவமைக்கப்பட்டது. ‘சகோதரர்கள்,’ ‘திருக்கூடாரம்,’ ‘கடவுளின் இல்லம்’ ஆகிய மூல உருவகங்கள் தக்கவைக்கப்பட்டுள்ளன; வழிபாட்டுச் சூழலில் தேவையற்ற பிற்கால சமயச் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
