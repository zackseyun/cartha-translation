translation_notes:
  register: நவீனத் தரத் தமிழில், வம்சவரிசைக்குரிய சுருக்கத்தையும் கண்ணியத்தையும் காக்கும் நடை. மூலத்தில் உள்ள ‘அவனுடைய மகன்’ என்ற மீளுருவாக்கம் பாதுகாக்கப்பட்டுள்ளது; தொடர்ச்சியான וְ இணைப்புகள் தமிழில் அரைப்புள்ளிகளால் இயல்பாக்கப்பட்டுள்ளன.
