  text: Elkanah his son[a], and Ebiasaph his son, and Assir his son.
translation:
  language: ta
  text: எல்க்கானா அவனுடைய மகன்; எபியாசாப்[a] அவனுடைய மகன்; அசீர் அவனுடைய மகன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபியாசாப் என்ற பெயர் சில இணையான வம்சவரிசைகளிலும் பாரம்பரிய ஒலிப்பெயர்ப்புகளிலும் “அபியாசாப்” என்றும் வழங்கப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶלְקָנָה
  choice: எல்க்கானா
  rationale: எபிரெய தனிப்பெயரின் ஒலிப்பெயர்ப்பு; பெயரின் நடுவிலுள்ள மெய்யொலிப்பு தமிழில் தெளிவாகத் தெரிய ‘க்க’ பயன்படுத்தப்பட்டது.
- source_word: בְנוֹ
  choice: அவனுடைய மகன்
  rationale: மூன்றாம் ஆண்பால் ஒருமை உடைமைப் பின்னொட்டுடன் உள்ள בֵּן என்பதன் நேரடியான பொருள் ‘அவனுடைய மகன்’; வம்சவரிசையில் ‘வழித்தோன்றல்’ என்ற விரிவான பொருள் சாத்தியமானாலும், மூலத்தின் நேரடியான உறவுமொழி பாதுகாக்கப்பட்டது.
- source_word: וְ
  choice: ;
  rationale: எபிரெய இணைப்புச் சொல் வம்சவரிசையின் ஒவ்வொரு தொடரையும் இணைக்கிறது; தமிழில் மீண்டும் மீண்டும் ‘மற்றும்’ என்று இடுவதைவிட அரைப்புள்ளி இயல்பாகத் தொடர்ச்சியை வெளிப்படுத்துகிறது.
- source_word: אֶבְיָסָף
  choice: எபியாசாப்
  rationale: இவ்வசனத்தின் எபிரெய எழுத்துருவை அடிப்படையாகக் கொண்ட ஒலிப்பெயர்ப்பு.
- source_word: אַסִּיר
  choice: அசீர்
  rationale: எபிரெய தனிப்பெயரின் நேரடி ஒலிப்பெயர்ப்பு; அழுத்தமுள்ள ס தமிழில் இயல்பாக ‘ச’ ஒலியால் குறிக்கப்பட்டது.
