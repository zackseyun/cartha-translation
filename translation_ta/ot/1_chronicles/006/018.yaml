base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/018.yaml
  text: 'And these are the ones who stood[a], and their sons: from the sons of the Kohathites: Heman the singer, son of Joel[b], son of Samuel.'
translation:
  language: ta
  text: 'நின்றவர்களும்[a] அவர்களுடைய மகன்களும் இவர்களே: கோகாத்தியரின் வழிவந்தவர்களில் பாடகரான ஏமான்; யோவேலின் மகன், சாமுவேலின் மகன்.


    [a] வேறு வகையில், “பணியாற்றியவர்கள்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் நேரடியாக “நின்றவர்கள்” என்று பொருள்படும்; இச்சூழலில் அது பணியில் நின்றதைக் குறிக்கக்கூடும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: வேறு வகையில், “பணியாற்றியவர்கள்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் நேரடியாக “நின்றவர்கள்” என்று பொருள்படும்; இச்சூழலில் அது பணியில் நின்றதைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: இவர்களே
  rationale: புதிய பெயர்ப்பட்டியலை அறிமுகப்படுத்தும் சுட்டுச் சொல்லின் வலிமையை இயல்பான தமிழில் தருகிறது; வாக்கியத் தொடக்க வாவ் அடுத்துள்ள இணைப்புகளாலும் பட்டியல் அமைப்பாலும் வெளிப்படுகிறது.
- source_word: הָעֹמְדִים
  choice: அங்கே நின்றவர்கள்
  rationale: עמד என்பதன் நேரடியான ‘நில்’ என்ற உருவகத்தைத் தக்கவைக்கிறது. சூழல் பணிசெய்வதைக் குறிக்கக்கூடும் என்பதால் அந்த மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: וּבְנֵיהֶם
  choice: அவர்களுடைய மகன்களும்
  rationale: எளிய எபிரெய இணைப்பான ‘மற்றும்/உம்’ என்பதையும் ‘அவர்களுடைய மகன்கள்’ என்ற உறவையும் நேரடியாகப் பாதுகாக்கிறது; ‘மகன்களோடு’ என்று விளக்கமாக மாற்றவில்லை.
- source_word: מִבְּנֵי הַקְּהָתִי
  choice: கோகாத்தியரின் வழிவந்தவர்களில்
  rationale: கோகாத்தின் குலவழியை இயல்பான நவீன தமிழில் தெளிவாகக் குறிக்கிறது; எபிரெயத்தின் வம்ச/குலப் பொருளைத் தக்கவைக்கிறது.
- source_word: הַמְשׁוֹרֵר
  choice: பாடகரான
  rationale: பாடுகிறவரைக் குறிக்கும் சொல்லின் நேரடியான, பொதுவாகப் புரியக்கூடிய தமிழ் இணை.
- source_word: בֶּן יוֹאֵל בֶּן שְׁמוּאֵל
  choice: யோவேலின் மகன், சாமுவேலின் பேரன்
  rationale: 'தொடர்ச்சியான எபிரெய வம்சத் தொடரை இயல்பான தமிழில் வெளிப்படுத்துகிறது: ஏமான் யோவேலின் மகன்; யோவேல் சாமுவேலின் மகன்.'
