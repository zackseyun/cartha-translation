base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/046.yaml
  text: And to the sons of Kohath[a] who remained, from the families of the tribe, from the half-tribe, the half of Manasseh, ten cities were given by lot.
translation:
  language: ta
  text: கேகாத்தின் எஞ்சிய மக்களுக்கு, கோத்திரத்தின் குடும்பத்திலிருந்து, அரைக் கோத்திரத்திலிருந்து, மனாசேயின் பாதியிலிருந்து[a] சீட்டுப்போட்டு பத்து நகரங்கள் வழங்கப்பட்டன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “கோத்திரத்தின் குடும்பத்திலிருந்து, அரைக் கோத்திரத்திலிருந்து, மனாசேயின் பாதியிலிருந்து” என்று மீளுரைப்புடன் உள்ளது. இது மனாசேயின் அரைக் கோத்திரத்தைக் குறிக்கும் பங்கீட்டு வாய்பாடாகும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לִ/בְנֵי קְהָת
  choice: கோகாத்தின் மக்களில் ... அவர்களுக்கு
  rationale: לְ குறிக்கும் பெறுநர் பொருளையும், בְּנֵי என்ற வம்சவழி/குல மரபுச் சொல்லாட்சியையும் தமிழில் இயல்பாகத் தக்கவைக்கிறது.
- source_word: הַנּוֹתָרִים
  choice: மீதியாயிருந்தவர்கள்
  rationale: முந்தைய பகிர்வுகளுக்குப் பின் எஞ்சிய கோகாத்தியக் குழுவினரைக் குறிக்கும் பங்கேற்பு வடிவத்தின் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: מִ/מִּשְׁפַּחַת הַ/מַּטֶּה
  choice: கோத்திரக் குடும்பங்களிலிருந்து
  rationale: מַטֶּה என்பதை இப்பங்கீட்டுச் சூழலில் ‘கோத்திரம்’ என்றும், מִשְׁפָּחָה என்பதை குடும்ப/குலக் குழுக்கள் என்றும் எடுத்துரைக்கிறது; எபிரெயச் சொற்றொடரின் சுருக்கமான அமைப்பையும் காக்கிறது.
- source_word: מִֽ/מַּחֲצִית מַטֵּה חֲצִי מְנַשֶּׁה
  choice: அரைக்கோத்திரத்திலிருந்து—மனாசேயின் பாதியிலிருந்து
  rationale: மனாசேயின் அரைக்கோத்திரத்தைக் குறிக்கும் மூலத்தின் மீளுரைப்பை முற்றிலும் ஒழிக்காமல், தமிழில் புரியத்தக்க வகையில் கோடுகளால் இணைக்கிறது.
- source_word: בַּ/גּוֹרָל
  choice: குலுக்குப்போட்டு
  rationale: சீட்டுக் குலுக்குதலால் பங்கு ஒதுக்கப்பட்டதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: עָרִים עָשֶׂר
  choice: பத்து நகரங்கள் ... வழங்கப்பட்டன
  rationale: עָרִים என்பதற்கு ‘நகரங்கள்’ என மொழிபெயர்த்து, எபிரெயில் வெளிப்படையாக இல்லாத வினையைப் பங்கீட்டுச் சூழலிலிருந்து ‘வழங்கப்பட்டன’ என்று நிரப்புகிறது.
