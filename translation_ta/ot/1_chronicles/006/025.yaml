  text: son of Michael[a], son of Baaseiah[b], son of Malkijah.
translation:
  language: ta
  text: மிகாயேலின் மகன், பாசெயாவின்[a] மகன், மல்கியாவின் மகன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மூலபாடம் இங்கு בַּעֲשֵׂיָה (பாசெயா) என்று வாசிக்கிறது; வேறு சில வேதாகம வம்சப்பட்டியல்களிலும் மொழிபெயர்ப்பு மரபுகளிலும் இதற்கு ஒத்த ‘மாசெயா’ என்ற பெயர் காணப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן
  choice: மகன்
  rationale: இந்த வம்சப்பட்டியல் தொடரில் בֶּן நேரடியான தந்தை–மகன் உறவைக் குறிக்கிறது. மீண்டும் வரும் எபிரெய அமைப்பையும் ஓசையையும் காக்க ‘மகன்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: מִיכָאֵל
  choice: மிகாயேல்
  rationale: எபிரெயப் பெயரின் ஒலியையும் தமிழில் வழக்கிலுள்ள வேதாகமப் பெயர் வடிவத்தையும் பின்பற்றும் ஒலிபெயர்ப்பு.
- source_word: בַּעֲשֵׂיָה
  choice: பாசெயா
  rationale: கொடுக்கப்பட்ட மசோரா மூலபாடத்தின் மெய்யெழுத்து மற்றும் உயிர்க்குறி வடிவத்தை நேரடியாகப் பிரதிபலிக்கும் தமிழ் ஒலிபெயர்ப்பு. வேறு வம்சப்பட்டியல்களில் காணப்படும் ‘மாசெயா’ என்ற ஒத்த பெயருடன் இதை ஒன்றாக்கவில்லை.
- source_word: מַלְכִּיָּה
  choice: மல்கியா
  rationale: எபிரெய மெய்யெழுத்துகளுக்கும் உச்சரிப்புக்கும் நெருக்கமான, வாசிக்க இயல்பான தமிழ் ஒலிபெயர்ப்பு.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், வம்சப்பட்டியலுக்குரிய சுருக்கமான மற்றும் கண்ணியமான நடையைப் பேணுகிறது. எபிரெய மொழியின் மீளுருவாக்க அமைப்பு ‘…இன் மகன்’ என இயல்பான தமிழில் பாதுகாக்கப்பட்டுள்ளது. ஆங்கிலத்தில் எழுத்துமுறை சார்ந்த ‘Malkijah/Malchijah’ வேறுபாடு தமிழில் தனித்த பொருள் வேறுபாட்டை உருவாக்காததால் அதற்கென அடிக்குறிப்பு சேர்க்கப்படவில்லை.
