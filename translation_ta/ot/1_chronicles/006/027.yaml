  text: son of Ethan[a], son of Zimmah, son of Shimei.
translation:
  language: ta
  text: ஏத்தானின் மகன்[a], சிம்மாவின் மகன், சிமெயியின் மகன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய வம்சவரலாறுகளில் சில சமயம் இடைப்பட்ட தலைமுறைகள் விடப்பட்டிருக்கலாம். ஆகவே, சில சூழல்களில் ‘மகன்’ என்பது விரிவான பொருளில் ‘வழிவந்தவர்’ என்பதையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן
  choice: மகன்
  rationale: எபிரெய வம்சவரலாற்றுப் பட்டியலில் வரும் வழக்கமான உறவுமுறைச் சொல்லை அதன் நேரடியான பொருளான ‘மகன்’ என்று மொழிபெயர்த்துள்ளது. சில பட்டியல்களில் தலைமுறைகள் விடுபட்டிருக்கலாம் என்பதைக் குறிப்பு விளக்குகிறது.
- source_word: אֵיתָן
  choice: ஏத்தான்
  rationale: எபிரெய தனிப்பெயரின் ஒலிப்பை நவீனத் தமிழில் இயல்பாக எழுத்துப்பெயர்த்துள்ளது.
- source_word: זִמָּה
  choice: சிம்மா
  rationale: இங்கு பொதுப்பொருள் கொண்ட சொல்லாக அல்லாமல் தனிப்பெயராக இருப்பதால், எபிரெய உச்சரிப்புக்கு ஏற்றவாறு எழுத்துப்பெயர்த்துள்ளது.
- source_word: שִׁמְעִי
  choice: சிமெயி
  rationale: எபிரெய தனிப்பெயரின் இறுதி ஒலியையும் வெளிப்படுத்தும் வகையில் ‘சிமெயி’ என்று எழுத்துப்பெயர்த்துள்ளது.
theological_decisions: []
