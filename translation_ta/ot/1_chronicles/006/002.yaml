  source_fidelity: 'மூல எபிரெய வாக்கியத்தின் பட்டியல் அறிமுகமும் உடைமைத் தொடர்பும் துல்லியமாகத் தரப்பட்டுள்ளன: “கெர்சோமின் மகன்களுடைய பெயர்கள் இவை” என்பது וְאֵלֶּה שְׁמוֹת בְּנֵי גֵרְשׁוֹם என்பதற்கு இயல்பானதும் போதுமான நெருக்கமுடையதுமாகும். லிப்னி, சிமெயி என்ற இரு பெயர்களும் விடுபடவில்லை. எபிரெய இணைப்புச் சொல் பட்டியலில் காற்புள்ளியால் இயல்பாக வெளிப்படுகிறது.'
