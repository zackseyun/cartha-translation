translation_notes:
  register: நவீன நிலையான தமிழில், வம்சவரிசைப் பட்டியலுக்கேற்ற சுருக்கமான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. பெயர்கள் மூல எபிரெய வடிவங்களுக்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டுள்ளன; அடிக்குறிக் குறியீடு முதன்மை உரையில் சேர்க்கப்பட்டுள்ளது.
