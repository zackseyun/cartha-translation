source:
  edition: WLC
  text: וְ/אֵ֛לֶּה שְׁמ֥וֹת בְּֽנֵי גֵרְשׁ֖וֹם לִבְנִ֥י וְ/שִׁמְעִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/002.yaml
  text: 'These are the names of the sons of Gershom: Libni and Shimei[a].'
translation:
  language: ta
  text: 'கெர்சோமின் மகன்களுடைய பெயர்கள் இவை: லிப்னி, சிமெயி.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு எபிரெயக் கையெழுத்துப் பிரதிகளில் கெர்சோம் என்று உள்ளது; தொடர்புடைய சில வம்சவரிசைப் பகுதிகளில் சில மொழிபெயர்ப்பு மரபுகள் கெர்சோன் என்று வழங்குகின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: இவை
  rationale: பட்டியலை அறிமுகப்படுத்தும் இணைப்புச் சொல்லும் சுட்டுப்பெயரும் தமிழில் இயல்பாகவும் சுருக்கமாகவும் ‘இவை’ என்று தரப்பட்டுள்ளன; தொடக்க ‘וְ’ என்பதைக் கட்டாயமாகத் தனியே மொழிபெயர்க்கத் தேவையில்லை.
- source_word: שְׁמוֹת
  choice: பெயர்கள்
  rationale: שְׁמוֹת בְּנֵי என்ற இணைநிலைத் தொடரைத் தமிழின் இயல்பான உடைமை அமைப்பில் ‘மகன்களுடைய பெயர்கள்’ என்று வழங்குகிறது.
- source_word: בְּנֵי
  choice: மகன்களுடைய
  rationale: வம்சவரிசைச் சூழலில் இங்கு பெயரிடப்பட்ட இருவரும் கெர்சோமின் நேரடி மகன்களாகக் காட்டப்படுவதால், பொதுவான ‘சந்ததியினர்’ என்பதற்குப் பதிலாகத் துல்லியமான ‘மகன்கள்’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
- source_word: גֵרְשׁוֹם
  choice: கெர்சோம்
  rationale: இவ்வசனத்தின் எபிரெய வடிவான גֵרְשׁוֹם என்பதைக் கருத்தில் கொண்டு பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: לִבְנִי
  choice: லிப்னி
  rationale: தனிப்பெயர் எபிரெய உச்சரிப்புக்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְשִׁמְעִי
  choice: சிமெயி
  rationale: தனிப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது; பெயர்ப் பட்டியலில் தமிழின் இயல்பான நிறுத்தற்குறி அமைப்பே இணைப்பின் பணியைச் செய்கிறது.
