translation:
  language: ta
  text: 'யித்சாரின் மகன், கேகாத்தின் மகன், லேவியின் மகன், இஸ்ரவேலின்[a] மகன்.


    [a] இஸ்ரவேல் என்பது யாக்கோபின் உடன்படிக்கைப் பெயர்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இஸ்ரவேல் என்பது யாக்கோபின் உடன்படிக்கைப் பெயர்.
    reason: ‘இஸ்ரவேல்’ என்று மூல உரையில் உள்ள பெயர் யாக்கோபையே குறிக்கிறது என்பதைத் தெளிவுபடுத்துகிறது; அதே நேரத்தில் மூலத்தின் பெயரை முதன்மை உரையில் மாற்றாமல் பாதுகாக்கிறது.
lexical_decisions:
- source_word: בֶּן
  choice: மகன்
  rationale: வம்சவரிசைச் சூத்திரத்தில் மீண்டும் வரும் בֶּן என்பதன் நேரடியான பொருள் ‘மகன்’. வம்சவரிசைகள் சில வேளைகளில் இடைப்பட்ட தலைமுறைகளை விடக்கூடும் என்றாலும், இங்கு ‘வழித்தோன்றல்’ என்று பொருளை விரிவாக்க வேண்டிய கட்டாயம் இல்லை.
- source_word: יִצְהָר
  choice: யித்சார்
  rationale: எபிரெயப் பெயரின் ஒலியமைப்பை நவீன தமிழில் இயன்றவரை தெளிவாகப் பிரதிபலிக்கும் எழுத்துப்பெயர்ப்பு.
- source_word: קְהָת
  choice: கோகாத்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் அறியப்பட்ட வடிவத்தைப் பின்பற்றும் எழுத்துப்பெயர்ப்பு.
- source_word: לֵוִי
  choice: லேவி
  rationale: எபிரெயத் தனிப்பெயருக்கான தமிழில் நிலைபெற்ற எழுத்துப்பெயர்ப்பு.
- source_word: יִשְׂרָאֵל
  choice: இஸ்ரவேல்
  rationale: மூலத்தில் ‘யாக்கோபு’ என்பதற்குப் பதிலாக יִשְׂרָאֵל என்ற பெயரே இருப்பதால், ‘இஸ்ரவேல்’ முதன்மை உரையில் தக்கவைக்கப்படுகிறது.
