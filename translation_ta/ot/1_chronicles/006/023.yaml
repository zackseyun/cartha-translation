  naturalness: The concise, repeated genealogical construction is natural and suitably formal in Tamil. The genitive forms «யித்சாரின்», «கேகாத்தின்», «லேவியின்», and «இஸ்ரவேலின்» read smoothly.
  terminology: «மகன்» is an appropriate modern-standard alternative to archaic «குமாரன்». «யித்சார்», «லேவி», and «இஸ்ரவேல்» are acceptable name forms. Revise «கோகாத்» to the established Tamil biblical name «கேகாத்». The footnote preserves the source-name/main-text distinction and remains appropriately anchored.
