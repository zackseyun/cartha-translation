source:
  edition: WLC
  text: וְ/אֵ֖לֶּה בְּנֵ֣י אַהֲרֹ֑ן אֶלְעָזָ֥ר בְּנ֛/וֹ פִּֽינְחָ֥ס בְּנ֖/וֹ אֲבִישׁ֥וּעַ בְּנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/035.yaml
  text: 'And these were the sons of Aaron: Eleazar his son, Phinehas his son, Abishua his son.'
translation:
  language: ta
  text: 'ஆரோனின் மகன்கள் இவர்களே: அவருடைய மகன் எலெயாசார்; அவருடைய மகன் பினெகாஸ்; அவருடைய மகன் அபிசூவா.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: இவர்களே
  rationale: இணைப்புச் சொல்லும் சுட்டுப்பெயரும் வம்சவரிசையை அறிமுகப்படுத்துகின்றன. தமிழில் வசனம் தனியே வாசிக்கப்படும்போது இயல்பாக இருக்க ‘இவர்களே’ என மொழிபெயர்க்கப்பட்டது; எபிரேய ‘וְ’ இங்கே உரையோட்ட இணைப்பாக இருப்பதால் தனியே ‘மேலும்’ எனச் சேர்க்கப்படவில்லை.
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: அடுத்தடுத்து நேரடி தந்தை–மகன் உறவு குறிப்பிடப்படுவதால், விரிவான ‘வழித்தோன்றல்கள்’ என்பதற்குப் பதில் நேரடியான ‘மகன்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: אַהֲרֹן
  choice: ஆரோன்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற பெயர்வடிவம்.
- source_word: אֶלְעָזָר
  choice: எலெயாசார்
  rationale: எபிரேயப் பெயருக்கான தமிழில் நிலைபெற்ற வேதாகமப் பெயர்வடிவம்.
- source_word: בְּנוֹ
  choice: அவருடைய மகன்
  rationale: மூன்றாம் நபர் ஆண்பால் ஒருமை உடைமைப் பின்னொட்டுடன் உள்ள ‘மகன்’ என்ற சொல்லைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது; ஒவ்வொரு பெயரும் முந்தைய நபரின் மகன் என்பதைப் பாதுகாக்கிறது.
- source_word: פִּינְחָס
  choice: பினெகாஸ்
  rationale: தமிழ் வேதாகம மரபில் பரவலாக அறியப்படும் பெயர்வடிவம்.
- source_word: אֲבִישׁוּעַ
  choice: அபிசூவா
  rationale: எபிரேயப் பெயரொலிக்கு அண்மையாகவும் தமிழ் வேதாகமப் பயன்பாட்டுக்கு ஏற்றதாகவும் உள்ள வடிவம்.
