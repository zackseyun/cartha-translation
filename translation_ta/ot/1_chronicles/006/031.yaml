translation:
  language: ta
  text: அம்சியின் மகன்[a], பானியின் மகன், சேமேரின் மகன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு வரும் ஒவ்வொரு ‘மகன்’ என்பதையும் ‘வழித்தோன்றல்’ என்றும் மொழிபெயர்க்கலாம்; எபிரெய மரபுப்பட்டியல்களில் இடைப்பட்ட தலைமுறைகள் சில நேரங்களில் விடப்பட்டிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן
  choice: மகன்
  rationale: எபிரெய மரபுப்பட்டியல்களில் இச்சொல் நேரடியான மகனையும் பரந்த வழித்தோன்றல் உறவையும் குறிக்கலாம். மூலத்தின் வடிவை வெளிப்படையாகப் பேணுவதற்காக ‘மகன்’ என மொழிபெயர்க்கப்பட்டது; தலைமுறைகள் சுருக்கப்பட்டிருக்கக்கூடிய சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אַמְצִי
  choice: அம்சி
  rationale: எபிரெய தனிப்பெயரின் ஒலியை நவீனத் தமிழில் இயல்பாக எழுத்துப்பெயர்க்கிறது.
- source_word: בָּנִי
  choice: பானி
  rationale: எபிரெய தனிப்பெயரான Bānî-யின் நீண்ட முதல் உயிரொலியைத் தமிழில் ‘பானி’ எனப் பிரதிபலிக்கிறது.
- source_word: שָׁמֶר
  choice: சேமேர்
  rationale: எபிரெய Šāmer என்ற தனிப்பெயரின் மெய் மற்றும் உயிரொலிகளைத் தமிழுக்கு ஏற்றவாறு எழுத்துப்பெயர்க்கிறது.
