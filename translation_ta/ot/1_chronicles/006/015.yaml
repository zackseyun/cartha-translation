lexical_decisions:
- source_word: שִׁמְעָא
  choice: சிமெயா
  rationale: எபிரெய தனிப்பெயரின் ஒலிப்பெயர்ப்பு; நவீனத் தமிழில் வாசிக்க இயல்பான வடிவமும் தமிழ்ச் சமூகத்தில் பரவலாக அறியப்பட்ட வேதாகமப் பெயர் வடிவமும் ஆகும்.
- source_word: בְנוֹ
  choice: அவனுடைய மகன்
  rationale: בֵּן என்ற பெயர்ச்சொல்லுடன் சேர்ந்த மூன்றாம் ஆண்பால் ஒருமை உரிமை விகுதி நேரடியான வம்சத் தொடர்பைக் குறிக்கிறது. மூன்று முறையும் வரும் வம்சாவளிச் சூத்திரத்தைத் தமிழிலும் அப்படியே மீளுரைக்கிறது.
- source_word: חַגִּיָּה
  choice: அக்கியா
  rationale: எபிரெய தனிப்பெயரின் தமிழில் நிலைபெற்ற ஒலிப்பெயர்ப்பு; பெயரின் இறுதியில் உள்ள யா கூறும் தக்கவைக்கப்பட்டுள்ளது.
- source_word: עֲשָׂיָה
  choice: அசாயா
  rationale: எபிரெய தனிப்பெயரை மொழிபெயர்க்காமல், தமிழில் அறியப்பட்ட வேதாகமப் பெயர் வடிவில் ஒலிப்பெயர்த்துள்ளது.
