  text: וּ/מִֽ/מַּחֲצִית֙ מַטֵּ֣ה מְנַשֶּׁ֔ה אֶת עָנֵר֙ וְ/אֶת מִגְרָשֶׁ֔י/הָ וְ/אֶת בִּלְעָ֖ם וְ/אֶת מִגְרָשֶׁ֑י/הָ לְ/מִשְׁפַּ֥חַת לִ/בְנֵי קְהָ֖ת הַ/נּוֹתָרִֽים־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/055.yaml
  text: 'And from the half-tribe of Manasseh: Aner with its pasturelands[a], and Bileam with its pasturelands, for the clan of the remaining sons of Kohath.'
translation:
  language: ta
  text: மனாசேயின் அரைக்கோத்திரத்திலிருந்து, ஆனேரையும் அதன் மேய்ச்சல் நிலங்களையும், பிலெயாமையும்[a] அதன் மேய்ச்சல் நிலங்களையும், எஞ்சியிருந்த கோகாத்தின் மக்களுடைய குலத்துக்குக் கொடுத்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: பிலெயாம் என்பது வேறிடங்களில் இப்லெயாம் எனப்படும் ஊரின் பெயருக்கான வேறொரு வடிவமாக இருக்கலாம்.
    reason: பெயரின் உரை மற்றும் அடையாளம் குறித்த நிச்சயமின்மையைப் பாதுகாக்கிறது; எபிரெய மூலத்தில் உள்ள ‘பிலெயாம்’ பிரதான உரையில் மாற்றப்படவில்லை.
lexical_decisions:
- source_word: וּמִמַּחֲצִית מַטֵּה מְנַשֶּׁה
  choice: மனாசேயின் அரைக்கோத்திரத்திலிருந்து
  rationale: מַחֲצִית என்பது ‘பாதி’ என்பதையும், மַטֶּה இச்சூழலில் ‘கோத்திரம்’ என்பதையும் குறிக்கிறது. ‘அரைக்கோத்திரம்’ என்பது இயல்பாகவும் சுருக்கமாகவும் உள்ளது.
- source_word: אֶת עָנֵר
  choice: ஆனேரை
  rationale: ஊர்ப்பெயர் நவீனத் தமிழில் வாசிக்க ஏற்றவாறு ஒலிபெயர்க்கப்பட்டது.
- source_word: מִגְרָשֶׁיהָ
  choice: அதன் மேய்ச்சல் நிலங்களை
  rationale: מִגְרָשׁ என்பது லேவியரின் நகரங்களைச் சுற்றியிருந்த திறந்தவெளி அல்லது கால்நடை மேய்ச்சலுக்கான நிலத்தைக் குறிக்கிறது; இச்சூழலில் ‘மேய்ச்சல் நிலங்கள்’ தெளிவான தேர்வு.
- source_word: בִּלְעָם
  choice: பிலெயாம்
  rationale: மசோரா எபிரெய உரையிலுள்ள பெயர் அப்படியே ஒலிபெயர்க்கப்பட்டது; இப்லெயாமுடன் இருக்கக்கூடிய பெயரியல் தொடர்பு அடிக்குறிப்பில் மட்டும் சுட்டப்படுகிறது.
- source_word: לְמִשְׁפַּחַת לִבְנֵי קְהָת הַנּוֹתָרִים
  choice: எஞ்சியிருந்த கோகாத்தின் மக்களுடைய குலத்துக்கு
  rationale: מִשְׁפָּחָה ஒருமையில் ஒரு குடும்பக் குழு அல்லது குலத்தைக் குறிக்கிறது. הַנּוֹתָרִים முன்பு நகரங்கள் ஒதுக்கப்படாமல் எஞ்சியிருந்த கோகாத்தின் சந்ததியினரைக் குறிக்கிறது.
