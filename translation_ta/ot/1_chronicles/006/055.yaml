  register: நவீன, கண்ணியமான பொதுத்தமிழ் பயன்படுத்தப்பட்டுள்ளது. தனியாக வாசிக்கும்போது வாக்கியம் முழுமையடைய, சூழலில் முன்பே புரிந்துகொள்ளப்படும் ‘கொடுத்தார்கள்’ என்ற வினை சேர்க்கப்பட்டுள்ளது. ‘கோத்திரம்’, ‘குலம்’, ‘மேய்ச்சல் நிலங்கள்’ ஆகியவை பட்டியல் மற்றும் நிலப்பங்கீட்டுச் சூழலுக்கு ஏற்ற தெளிவான சொற்கள்.
