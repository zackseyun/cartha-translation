lexical_decisions:
- source_word: מְרָיוֹת
  choice: மெராயோத்
  rationale: எபிரெய தனிப்பெயர் மொழிபெயர்க்கப்படாமல், தமிழில் இயல்பாக உச்சரிக்கத்தக்க வகையில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: בְּנוֹ
  choice: அவனுடைய மகன்
  rationale: בֵּן என்ற சொல்லின் மூன்றாம் நபர் ஆண்பால் ஒருமை உடைமைப் பின்னொட்டுடன் கூடிய வடிவம். வம்சவரிசையில் ஒவ்வொரு தலைமுறையின் மகன் உறவையும் வெளிப்படையாகக் காட்டுகிறது.
- source_word: אֲמַרְיָה
  choice: அமரியா
  rationale: எபிரெய தனிப்பெயர் தமிழில் வழக்கமான, வாசிக்க எளிய வடிவில் ஒலிபெயர்க்கப்பட்டுள்ளது; பெயரின் இறுதியில் உள்ள யா கூறும் தக்கவைக்கப்பட்டுள்ளது.
- source_word: אֲחִיטוּב
  choice: அகித்தூப்
  rationale: எபிரெய தனிப்பெயரின் ஒலியமைப்பைத் தமிழில் நெருக்கமாகக் காட்டும் ஒலிபெயர்ப்பு.
