lexical_decisions:
- source_word: צָדוֹק
  choice: சாதோக்கு
  rationale: எபிரெய தனிப்பட்ட பெயர்; தமிழில் வழக்கமான வேதாகமப் பெயர்வடிவத்துக்கு ஏற்ப ஒலிபெயர்க்கப்பட்டது.
- source_word: בְּנוֹ
  choice: அவனுடைய மகன்
  rationale: בֵּן என்ற பெயர்ச்சொல்லுடன் மூன்றாம் நபர் ஆண்பால் ஒருமை பின்னொட்டு சேர்ந்துள்ளதால் ‘அவனுடைய மகன்’ என்று பொருள்; வம்சவரிசையின் சுருக்கமான தொடர் அமைப்பு பாதுகாக்கப்பட்டது.
- source_word: אֲחִימַעַץ
  choice: அகிமாஸ்
  rationale: எபிரெய தனிப்பட்ட பெயர்; அதன் ஒலியை இயன்றவரை காக்கும் தமிழ்ப் பெயர்வடிவம் பயன்படுத்தப்பட்டது.
- source_word: בְּנוֹ
  choice: அவனுடைய மகன்
  rationale: மீண்டும் வரும் வம்சவரிசைச் சொற்றொடர் ஒரே விதமாக மொழிபெயர்க்கப்பட்டு, ஒவ்வொருவரும் முந்தையவரின் மகன் என்பது தெளிவாக வைக்கப்பட்டது.
