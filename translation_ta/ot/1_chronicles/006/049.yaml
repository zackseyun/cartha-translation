  text: And the sons of Israel gave to the Levites the cities and their pasturelands[a][b].
translation:
  language: ta
  text: இஸ்ரவேலின் மகன்கள்[a] லேவியர்களுக்கு நகரங்களையும் அவற்றின் மேய்ச்சல் நிலங்களையும்[b] கொடுத்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இஸ்ரவேல் மக்கள்.’ எபிரெயத்தில் நேரடியாக ‘இஸ்ரவேலின் மகன்கள்’ என்று உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அவற்றின் பொதுநிலங்கள்’ அல்லது ‘அவற்றைச் சுற்றியுள்ள நிலங்கள்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: கொடுத்தார்கள்
  rationale: נתן என்பதன் Qal wayyiqtol வடிவம்; இக்கதைச் சூழலில் அதன் இயல்பான, நேரடியான பொருள் ‘கொடுத்தார்கள்’ என்பதாகும்.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரெயச் சொற்றொடரின் நேரடியான வடிவமான ‘இஸ்ரவேலின் மகன்கள்’ என்பதைக் காக்கிறது; தமிழில் இயல்பான ‘இஸ்ரவேல் மக்கள்’ என்பது அடிக்குறிப்பில் மாற்றாக வழங்கப்படுகிறது.
- source_word: לַלְוִיִּם
  choice: லேவியர்களுக்கு
  rationale: לְ முன்னொட்டின் பெறுநரைக் குறிக்கும் பொருளையும் לְוִיִּם என்ற குலப்பெயரையும் தெளிவாக வழங்குகிறது.
- source_word: הֶעָרִים
  choice: நகரங்கள்
  rationale: עָרִים என்பது நகரங்கள் அல்லது ஊர்களைக் குறிக்கலாம்; சுற்றியுள்ள லேவிய நகரங்கள் பற்றிய சூழலுடன் ஒத்திருக்க ‘நகரங்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: מִגְרְשֵׁיהֶם
  choice: அவற்றின் மேய்ச்சல் நிலங்கள்
  rationale: מִגְרָשׁ என்பது நகரத்துடன் சேர்ந்த திறந்த வெளி அல்லது கால்நடை மேய்க்கும் நிலத்தைக் குறிக்கிறது; ‘மேய்ச்சல் நிலங்கள்’ அதன் நடைமுறைப் பயன்பாட்டைத் தெளிவாக எடுத்துரைக்கிறது. பன்மை உடைமைப் பின்னொட்டு நகரங்களைக் குறிப்பதால் தமிழில் ‘அவற்றின்’ பயன்படுத்தப்பட்டது.
