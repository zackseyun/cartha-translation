translation_notes:
  register: நவீன நிலையான தமிழில், வம்சவரிசைத் தொடர்புகள் குழப்பமின்றித் தெரியுமாறு சுருக்கமாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. மூலத்தில் உள்ள மீளும் בֶּן அமைப்பு தமிழில் வெறும் தொடர் பெயர்களாக அல்லாமல், ஒவ்வொரு தலைமுறையின் உறவையும் வெளிப்படையாகச் சொல்லும் வாக்கியத் தொடராக வழங்கப்பட்டுள்ளது.
