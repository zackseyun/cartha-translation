translation:
  language: ta
  text: எத்னியின் மகன், சேராக்கின் மகன், அதாயாவின் மகன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן
  choice: மகன்
  rationale: வம்சவரிசையில் நேரடியான தந்தை–மகன் உறவைக் குறிக்கும் எபிரெயச் சொல்லை இயல்பான நவீனத் தமிழில் தருகிறது. பெயர்ச்சங்கிலியின் உறவுகள் தெளிவாக இருக்க, ஒவ்வொரு பெயருடனும் உறவு வெளிப்படையாகக் கூறப்பட்டுள்ளது.
- source_word: אֶתְנִי
  choice: எத்னி
  rationale: எபிரெயத் தனிப்பெயரின் ஒலியமைப்பைத் தமிழில் நெருக்கமாக எழுத்துப்பெயர்க்கிறது.
- source_word: זֶרַח
  choice: சேரா
  rationale: எபிரெயத் தனிப்பெயரின் தொடக்க மெய்யொலியையும் இறுதி தொண்டை மெய்யையும் தமிழில் இயல்பாக அணுகும் எழுத்துப்பெயர்ப்பு.
- source_word: עֲדָיָה
  choice: அதாயா
  rationale: எபிரெயத் தனிப்பெயரை அதன் மெய் மற்றும் உயிரொலி வரிசைக்கு நெருக்கமாகத் தமிழில் எழுத்துப்பெயர்க்கிறது.
