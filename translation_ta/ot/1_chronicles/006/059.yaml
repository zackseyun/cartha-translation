  yaml_path: translation/ot/1_chronicles/006/059.yaml
  text: 'and from the tribe of Asher: Mashal with its pasturelands[a], and Abdon with its pasturelands.'
translation:
  language: ta
  text: 'ஆசேர் கோத்திரத்திலிருந்து: மாஷாலும் அதன் மேய்ச்சல் நிலங்களும்[a], அப்தோனும் அதன் மேய்ச்சல் நிலங்களும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு நாளாகமத்தின் எபிரெய உரையில் இப்பெயர் “மாஷால்” என்று உள்ளது; யோசுவா 21:30-இல் உள்ள இணைப் பட்டியலில் “மிஷால்” என்று உள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/מִ/מַּטֵּה
  choice: கோத்திரத்திலிருந்து
  rationale: நிலப் பங்கீட்டுச் சூழலில் מַטֶּה என்பது ‘கோத்திரம்’ எனப் பொருள்படும். முன் வரும் இணைப்பும் இவ்வசனத்தின் பட்டியல் தொடர்ச்சியில் இயல்பான தமிழ் வாக்கிய அமைப்பில் வெளிப்படுகிறது.
- source_word: אָשֵׁר
  choice: ஆசேர்
  rationale: கோத்திரப் பெயர்; எபிரெய உச்சரிப்பை அணுகிய தமிழ் ஒலிபெயர்ப்பு.
- source_word: מָשָׁל
  choice: மாஷால்
  rationale: நாளாகமத்தில் உள்ள மசோரா உரையின் வடிவத்தை நேரடியாக ஒலிபெயர்க்கிறது; யோசுவா 21:30-இன் இணைப் பட்டியலிலுள்ள வேறுபாடு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: מִגְרָשֶׁיהָ
  choice: அதைச் சுற்றியிருந்த மேய்ச்சல் நிலங்கள்
  rationale: லேவிய நகரங்களோடு இணைக்கப்பட்ட திறந்த வெளி அல்லது கால்நடை மேய்ச்சல் நிலங்களை מִגְרָשׁ குறிக்கிறது. நகரைக் குறிக்கும் பெண்பால் ஒருமை பின்னொட்டு தமிழில் ‘அதைச் சுற்றியிருந்த’ என்று இயல்பாக வெளிப்படுகிறது.
- source_word: עַבְדּוֹן
  choice: அப்தோன்
  rationale: இடப்பெயர்; எபிரெய வடிவத்தை அணுகிய தமிழ் ஒலிபெயர்ப்பு.
