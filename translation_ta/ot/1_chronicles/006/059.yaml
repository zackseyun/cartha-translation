translation_notes:
  register: இயல்பான, தற்காலத் தரநிலைத் தமிழில் கண்ணியமான பட்டியல் நடையைப் பயன்படுத்துகிறது. எபிரெயத்தில் வினைச்சொல் இல்லாவிட்டாலும், முந்தைய வசனங்களிலிருந்து தொடரும் கருத்தைத் தமிழில் நிறைவு செய்ய ‘கொடுத்தார்கள்’ சேர்க்கப்பட்டுள்ளது; நகரங்களையும் அவற்றின் மேய்ச்சல் நிலங்களையும் தெளிவாக வேறுபடுத்த ‘நகரம்’ விளக்கமாகச் சேர்க்கப்பட்டுள்ளது.
