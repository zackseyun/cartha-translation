  text: וְ/אֶת אַיָּלוֹן֙ וְ/אֶת מִגְרָשֶׁ֔י/הָ וְ/אֶת גַּת רִמּ֖וֹן וְ/אֶת מִגְרָשֶֽׁי/הָ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/054.yaml
  text: and Aijalon with its pasturelands[a], and Gath-rimmon with its pasturelands.
translation:
  language: ta
  text: ஆயலோனையும் அதன் மேய்ச்சல் நிலங்களையும்[a], கத்-ரிம்மோனையும் அதன் மேய்ச்சல் நிலங்களையும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மேய்ச்சல் நிலங்கள்’ என்பதற்கு ‘பொதுநிலங்கள்’ அல்லது ‘சுற்றுப்புற நிலங்கள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் ஒரு நகரத்துக்குச் சொந்தமான சுற்றுப்புறத் திறந்தவெளியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַיָּלוֹן
  choice: ஆயலோன்
  rationale: இடப்பெயர் என்பதால் மொழிபெயர்க்காமல், எபிரெய ஒலிப்புக்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: מִגְרָשֶׁיהָ
  choice: அதன் மேய்ச்சல் நிலங்கள்
  rationale: நகரத்தைச் சேர்ந்த சுற்றுப்புறத் திறந்தவெளி அல்லது பொதுநிலத்தைக் குறிக்கிறது; லேவியர் நகரங்களின் சூழலில் அதன் பயன்பாட்டைத் தெளிவாகக் காட்டும் இயல்பான தமிழ் சொற்றொடர் இது.
- source_word: גַּת רִמּוֹן
  choice: கத்-ரிம்மோன்
  rationale: கூட்டு இடப்பெயர் என்பதால் ஒலிபெயர்க்கப்பட்டு, ஒரே இடப்பெயர் என்பதைத் தெளிவாக்க இடைக்கோடு பயன்படுத்தப்பட்டுள்ளது.
- source_word: וְאֶת
  choice: -ஐயும் / -ங்களையும்
  rationale: וְ என்ற இணைப்பையும் אֶת என்ற நேரடிச் செயப்படுபொருள் குறியையும் தமிழில் பட்டியலை இயல்பாக இணைக்கும் ‘-உம்’ மற்றும் இரண்டாம் வேற்றுமை உருபுகள் மூலம் வெளிப்படுத்துகிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், பட்டியல் நடைக்கு ஏற்ற கண்ணியமான மொழிநடை பயன்படுத்தப்பட்டுள்ளது. இவ்வசனத்தின் எபிரெய உரை முந்தைய வாக்கியத்தின் தொடர்ச்சியாக இருப்பதால், தமிழில் வாக்கியம் முழுமையடையச் சூழலிலிருந்து ‘கொடுத்தார்கள்’ சேர்க்கப்பட்டுள்ளது.
