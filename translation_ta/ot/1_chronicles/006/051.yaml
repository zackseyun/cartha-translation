base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/051.yaml
  text: And from the families of the sons of Kohath[b][a], the cities of their territory were from the tribe of Ephraim.
translation:
  language: ta
  text: கோகாத்தின் மகன்களின் குடும்பங்களுக்கு உரிய பிரதேச நகரங்கள்[a] எப்பிராயீம் கோத்திரத்தின் பிரதேசத்திலிருந்து கிடைத்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவர்களுடைய எல்லை நகரங்கள்.’ எபிரெயச் சொல் ‘எல்லை,’ ‘எல்லைப்பகுதி,’ அல்லது ‘பிரதேசம்’ எனப் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִמִּשְׁפְּחוֹת
  choice: குடும்பங்களிலிருந்து
  rationale: מִשְׁפָּחוֹת என்பது குடும்பக் குழுக்கள் அல்லது குலங்களைக் குறிக்கலாம். ‘குடும்பங்கள்’ என்பது இயல்பான நவீனத் தமிழ்; מִן முன்னொட்டின் ‘இலிருந்து’ என்ற பொருளும் பாதுகாக்கப்படுகிறது. வசனம் முந்தைய பட்டியலின் தொடர்ச்சியாக இருப்பதால் தொடக்க ו தனியாக மொழிபெயர்க்கப்படாமல் வாக்கிய ஓட்டத்தில் உணர்த்தப்படுகிறது.
- source_word: בְּנֵי קְהָת
  choice: கோகாத்தின் மகன்களுடைய
  rationale: எபிரெயச் சொற்றொடரின் நேரடியான ‘கோகாத்தின் மகன்கள்’ என்ற வம்சவழி வடிவத்தைப் பாதுகாக்கிறது; சூழலில் இது அவருடைய சந்ததியினரைக் குறிக்கிறது.
- source_word: וַיְהִי
  choice: கிடைத்தன
  rationale: நகரங்கள் எப்பிராயீம் கோத்திரத்திலிருந்து இவர்களுக்கு ஒதுக்கப்பட்ட பட்டியல் சூழலில், வெறும் ‘இருந்தன’ என்பதைவிட ‘கிடைத்தன’ என்பது உறவைக் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது; ஒதுக்கீட்டை அளவுக்கு மீறி விரிவுபடுத்தாது.
- source_word: עָרֵי גְבוּלָם
  choice: அவர்களுடைய நிலப்பகுதியின் நகரங்கள்
  rationale: גְּבוּל என்பதற்கு எல்லை, எல்லைப்பகுதி, நிலப்பகுதி ஆகிய பொருள்கள் உண்டு. இங்கு லேவிய நகரங்களுக்குரிய பிரதேச ஒதுக்கீட்டுச் சூழலில் ‘நிலப்பகுதி’ இயல்பாகப் பொருந்துகிறது; ‘எல்லை நகரங்கள்’ என்ற மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: מִמַּטֵּה אֶפְרָיִם
  choice: எப்பிராயீம் கோத்திரத்திலிருந்து
  rationale: கோத்திர ஒதுக்கீட்டுச் சூழலில் מַטֶּה என்பது ‘கோத்திரம்’ எனப் பொருள்படும்; מִן என்பதன் மூல/பகிர்வு உறவை ‘இலிருந்து’ துல்லியமாகக் காட்டுகிறது.
