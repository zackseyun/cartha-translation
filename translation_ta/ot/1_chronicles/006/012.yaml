translation:
  language: ta
  text: எலியாப் அவனுடைய மகன்; யெரோகாம் அவனுடைய மகன்; எல்க்கானா அவனுடைய மகன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱלִיאָב
  choice: எலியாப்
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் வழக்கமான வேதாகமப் பெயர்ப்பு முறைக்கு ஏற்ப எழுத்துப்பெயர்த்துள்ளது.
- source_word: בְּנוֹ
  choice: அவனுடைய மகன்
  rationale: בֵּן என்ற பெயர்ச்சொல்லுடன் சேர்ந்த மூன்றாம் நபர் ஆண்பால் ஒருமை உடைமைப் பின்னொட்டு நேரடியாக ‘அவனுடைய மகன்’ என்று பொருள்படும்; வினைச்சொல் சேர்க்காமல் வம்சவரிசை நடையைப் பாதுகாக்கிறது.
- source_word: יְרֹחָם
  choice: யெரோகாம்
  rationale: எபிரெய தனிப்பெயரை அதன் ஒலிக்கு நெருக்கமாகத் தமிழில் எழுத்துப்பெயர்த்துள்ளது.
- source_word: בְּנוֹ
  choice: அவனுடைய மகன்
  rationale: வம்சவரிசையில் தொடர்ச்சியான மகன் உறவைக் காட்டும் மீளுரைப்பை மூலத்தைப் போலவே ஒரேவிதமாக வைத்துள்ளது.
- source_word: אֶלְקָנָה
  choice: எல்க்கானா
  rationale: எபிரெய தனிப்பெயரைத் தமிழில் வழக்கமான வடிவில் எழுத்துப்பெயர்த்துள்ளது.
- source_word: בְנוֹ
  choice: அவனுடைய மகன்
  rationale: இறுதி வம்சத் தொடர்பையும் முந்தைய தொடர்களுடன் ஒத்திசைவாகக் காட்டுகிறது.
