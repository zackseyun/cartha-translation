base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/052.yaml
  text: 'They gave them the cities of refuge: Shechem with its pasturelands in the hill country of Ephraim[a], and Gezer with its pasturelands.'
translation:
  language: ta
  text: 'அவர்கள் அவர்களுக்குக் அடைக்கல நகரங்களைக் கொடுத்தார்கள்[a]: எப்பிராயீம் மலைநாட்டிலுள்ள சீகேமையும் அதன் மேய்ச்சல் நிலங்களையும், கேசேரையும் அதன் மேய்ச்சல் நிலங்களையும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேய வாசகத்தின் சொல்லமைப்புக்கு இன்னும் நெருக்கமாக, “அடைக்கல நகரங்களை—எப்பிராயீம் மலைநாட்டிலுள்ள சீகேமையும் அதன் மேய்ச்சல் நிலங்களையும், கேசேரையும் அதன் மேய்ச்சல் நிலங்களையும்—அவர்களுக்குக் கொடுத்தார்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: அவர்கள் ... கொடுத்தார்கள்
  rationale: தொடர்ச்சியான கதைநடவடிக்கையைக் குறிக்கும் வினை; தமிழில் இயல்பான இறந்தகால வாக்கியமாக வழங்கப்பட்டுள்ளது. நீண்ட பட்டியலுக்குப் பின் வினை மீண்டும் இடப்படுவது பொருளைத் தெளிவாக்குகிறது.
- source_word: לָהֶם
  choice: அவர்களுக்கு
  rationale: முந்தைய சூழலில் குறிப்பிடப்பட்ட பெறுநர்களைக் குறிக்கும் எளிய மூன்றாம் நபர் பன்மை வடிவம்.
- source_word: עָרֵי הַמִּקְלָט
  choice: அடைக்கல நகரங்கள்
  rationale: இஸ்ரவேலின் சட்டத்தில் பாதுகாப்புக்காக ஒதுக்கப்பட்ட நகரங்களைக் குறிக்கும் தொழில்நுட்பச் சொல்லுக்கு தெளிவான, வழக்கமான தமிழ் இணை.
- source_word: שְׁכֶם
  choice: சீகேம்
  rationale: எபிரெய இடப்பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: מִגְרָשֶׁיהָ
  choice: அதைச் சுற்றியிருந்த மேய்ச்சல் நிலங்கள்
  rationale: நகரத்துக்கு உட்பட்ட, குறிப்பாக கால்நடைகளை மேய்ப்பதற்கான திறந்த நிலங்களைச் சுட்டுகிறது; ‘சுற்றுப்புறம்’ என்பதைவிட இச்சூழலில் துல்லியமானது.
- source_word: בְּהַר אֶפְרָיִם
  choice: எப்பிராயீம் மலைநாட்டிலுள்ள
  rationale: ஒரே மலைச்சிகரத்தை அல்லாமல் எப்பிராயீமுடன் தொடர்புடைய மேட்டுநிலப் பகுதியைக் குறிக்கிறது.
- source_word: גֶּזֶר
  choice: கேசேர்
  rationale: எபிரெய இடப்பெயரின் தமிழுக்கு ஏற்ற ஒலிபெயர்ப்பு.
- source_word: וְאֶת ... וְאֶת
  choice: சீகேமையும் ... கேசேரையும்
  rationale: இரண்டு நேரடிச் செயப்படுபொருள்களையும் இணைக்கும் எபிரெய அமைப்பு தமிழின் ‘-ஐயும் ... -ஐயும்’ வடிவில் இயல்பாகப் பாதுகாக்கப்பட்டுள்ளது.
theological_decisions:
- issue: ‘அடைக்கல நகரங்கள்’ என்ற பன்மைச் சொல் சீகேமையும் கேசேரையும் ஒரே வகையில் வரையறுக்கிறதா என்பது
  choice: மூலத்தின் பட்டியல் அமைப்பைத் தக்கவைத்து, இரண்டு நகரங்களையும் இரட்டைப் புள்ளிக்குப் பின் வரிசைப்படுத்துதல்
  alternative: ‘அடைக்கல நகரங்களாக சீகேமையும் கேசேரையும் கொடுத்தார்கள்’ என்று வெளிப்படையாக இரண்டையும் அடைக்கல நகரங்களாக அடையாளப்படுத்துதல்
  rationale: எபிரெய இலக்கண அமைப்பு இரண்டு பெயர்களையும் ‘அடைக்கல நகரங்கள்’ என்பதற்குப் பின் தருகிறது; ஆனால் கேசேரின் நிலையைத் தனியாக விளக்கவில்லை. ஆகவே மொழிபெயர்ப்பு மூலத்திலுள்ள சாத்தியமான தெளிவின்மையைத் தீர்மானமாக நீக்கவில்லை.
translation_notes:
  register: நவீன, மரியாதைமிக்க பொதுத்தமிழ் பயன்படுத்தப்பட்டுள்ளது. நிர்வாக அல்லது பழமையான சொற்களைத் தவிர்த்து, ‘மேய்ச்சல் நிலங்கள்’ என்ற எளிதில் புரியும் சொல் தேர்ந்தெடுக்கப்பட்டுள்ளது; எபிரெய பட்டியல் அமைப்பும் இடப்பெயர்களும் பாதுகாக்கப்பட்டுள்ளன.
