translation_notes:
  register: நவீன நிலையான தமிழில், வேதாகமப் பட்டியலுக்கேற்ற கண்ணியமான மற்றும் எளிதில் புரியக்கூடிய நடை பயன்படுத்தப்பட்டது. எபிரெயில் இவ்வசனத்தில் வெளிப்படையாக இல்லாத கொடுத்தல் வினை, முந்தைய வசனங்களின் ஒதுக்கீட்டுச் சூழலிலிருந்து ‘கொடுக்கப்பட்டவை’ என்று தெளிவாகச் சேர்க்கப்பட்டது; முக்காற்புள்ளி நகரங்களின் பட்டியலை அறிமுகப்படுத்துகிறது.
