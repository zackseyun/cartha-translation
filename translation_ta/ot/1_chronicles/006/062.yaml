  text: לִ/בְנֵ֣י מְרָרִי֮ הַ/נּוֹתָרִים֒ מִ/מַּטֵּ֣ה זְבוּלֻ֔ן אֶת רִמּוֹנ֖וֹ וְ/אֶת מִגְרָשֶׁ֑י/הָ אֶת תָּב֖וֹר וְ/אֶת מִגְרָשֶֽׁי/הָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/062.yaml
  text: 'To the sons of Merari who remained[a], from the tribe of Zebulun: Rimmono and its pasturelands, Tabor and its pasturelands.'
translation:
  language: ta
  text: 'மெராரியின் மக்களில் எஞ்சியவர்களுக்கு, செபுலோன் கோத்திரத்திலிருந்து: ரிம்மோனோ[a] மற்றும் அதன் மேய்ச்சல் நிலங்கள், தாபோர் மற்றும் அதன் மேய்ச்சல் நிலங்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு எபிரேய உரையில் ‘ரிம்மோனோ’ என்று உள்ளது; இதற்கு இணையான யோசுவா 21:35 பட்டியலில் ‘திம்னா’ என்று உள்ளது.
    reason: textual_variant
lexical_decisions:
- source_word: לִבְנֵי מְרָרִי הַנּוֹתָרִים
  choice: மெராரியின் மக்களில் எஞ்சியவர்களுக்கு
  rationale: לִבְנֵי என்பது ஒதுக்கீட்டைப் பெறுபவர்களைக் குறிக்கிறது; הַנּוֹתָרִים முந்தைய ஒதுக்கீடுகளுக்குப் பின் எஞ்சியவர்களைக் குறிக்கும். இவ்விரண்டையும் இயல்பான நவீனத் தமிழில் இணைக்கிறது.
- source_word: מִמַּטֵּה זְבוּלֻן
  choice: செபுலோன் கோத்திரத்திலிருந்து
  rationale: இங்கு מַטֶּה என்பதன் பொருள் நேரடியான ‘கோல்’ அல்ல, இஸ்ரவேலின் ‘கோத்திரம்’ என்பதாகும்.
- source_word: רִמּוֹנוֹ
  choice: ரிம்மோனோ
  rationale: மசோரா எபிரெய உரையின் இடப்பெயரை ஒலிபெயர்க்கிறது; யோசுவா 21:35-இன் இணைப் பட்டியலிலுள்ள வேறுபாடு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: מִגְרָשֶׁיהָ
  choice: அதன் மேய்ச்சல் நிலங்கள்
  rationale: லேவியர் நகரங்களின் சூழலில் מִגְרָשׁ என்பது நகரைச் சேர்ந்த திறந்த மேய்ச்சல் நிலத்தைக் குறிக்கிறது.
- source_word: תָּבוֹר
  choice: தாபோர்
  rationale: இங்கு நகரின் பெயராக வரும் எபிரெய இடப்பெயரின் ஒலிபெயர்ப்பு.
- source_word: אֶת רִמּוֹנוֹ ... אֶת תָּבוֹר
  choice: ரிம்மோனோ நகரமும் ... தாபோர் நகரமும்
  rationale: אֶת குறிக்கும் பட்டியல் அமைப்பைத் தமிழில் ‘-உம்’ இணைப்பால் இயல்பாக வெளிப்படுத்துகிறது; இவை நகரங்கள் என்பதைச் சூழலுக்கேற்ப தெளிவாக்குகிறது.
