  text: and Hukok with its pasturelands[a], and Rehob with its pasturelands.
translation:
  language: ta
  text: மேலும், ஹுக்கோக்கையும் அதன் மேய்ச்சல் நிலங்களையும், ரெகோபையும் அதன் மேய்ச்சல் நிலங்களையும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய உரையில், “ஹுக்கோக்கு.” யோசுவா 21:31-இன் இணைப் பட்டியலில் “எல்காத்” என்று உள்ளது.
    reason: textual_variant
lexical_decisions:
- source_word: חוּקֹק
  choice: ஊக்கோக்கு
  rationale: மசோரா எபிரெய உரையில் உள்ள ஊர்ப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டது; யோசுவா 21:31-இன் இணைப் பட்டியலிலுள்ள வேறுபட்ட பெயர் முதன்மை உரையில் ஏற்கப்படவில்லை.
- source_word: מִגְרָשֶׁיהָ
  choice: அதன் மேய்ச்சல் நிலங்கள்
  rationale: ஊருக்குரிய திறந்த வெளி அல்லது கால்நடை மேய்ச்சலுக்கான பொதுநிலங்களைக் குறிக்கும் சொல்லின் தெளிவான, இயல்பான தமிழ் வடிவம்.
- source_word: רְחֹב
  choice: ரெகோபு
  rationale: எபிரெய ஊர்ப்பெயர் நவீனத் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: וְאֶת
  choice: -ஐயும்
  rationale: பட்டியலில் திரும்பத் திரும்ப வரும் இணைப்புச் சொல்லும் நேரடிப் பொருள் உருபும் தமிழில் இயல்பான ஒருங்கிணைப்பாகக் கொடுக்கப்பட்டுள்ளன.
