translation_notes:
  register: நவீனத் தரத் தமிழில், பட்டியல் நடைக்கு ஏற்ற சுருக்கமான மற்றும் கண்ணியமான மொழி பயன்படுத்தப்பட்டுள்ளது. இவ்வசனம் முந்தைய வினைச்சொல்லைத் தொடரும் துண்டுவாக்கியமாக இருந்தாலும், தனிவசன வாசிப்பின் தெளிவுக்காக சூழலிலிருந்து ‘கொடுத்தார்கள்’ சேர்க்கப்பட்டுள்ளது; அடிக்குறி குறியீடு உரையின் முடிவில் இடப்பட்டுள்ளது.
