source:
  edition: WLC
  text: וְ/אָחִ֣י/ו אָסָ֔ף הָ/עֹמֵ֖ד עַל יְמִינ֑/וֹ אָסָ֥ף בֶּן בֶּרֶכְיָ֖הוּ בֶּן שִׁמְעָֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/024.yaml
  text: 'And his brother Asaph stood at his right hand: Asaph son of Berechiah[a], son of Shimea.'
translation:
  language: ta
  text: அவனுடைய சகோதரனாகிய ஆசாப் அவனுடைய வலப்பக்கத்தில்[a] நின்றான்; ஆசாப் பெரெக்கியாவின் மகன்; பெரெக்கியா சிமெயாவின் மகன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொற்றொடரை ‘அவனுடைய வலதுபுறத்தில்’ என்றும் மொழிபெயர்க்கலாம்; அது ஒருவரின் வலப்பக்கத்தில் இருக்கும் இடத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָחִיו
  choice: அவனுடைய சகோதரனாகிய
  rationale: וְ என்பது இணைப்பைத் தருகிறது; אָחִיו என்பதன் இயல்பான பொருள் ‘அவனுடைய சகோதரன்.’ இங்கு வம்ச மற்றும் பணியமைப்புச் சூழலில் இந்த நேரடிப் பொருள் பொருத்தமானது.
- source_word: אָסָף
  choice: ஆசாப்
  rationale: தனிப்பட்ட நபரின் பெயர்; எபிரெய ஒலிப்பை அணுகும் வகையில் தமிழில் எழுத்துப்பெயர்க்கப்பட்டது. மூலத்தில் பெயர் இருமுறை வருவதால், அடையாளத்தையும் வம்சவிளக்கத்தையும் இணைக்க தமிழிலும் இருமுறை இடம்பெறுகிறது.
- source_word: הָעֹמֵד
  choice: நின்றான்
  rationale: עמד என்ற வினையின் Qal நிகழ்காலப் பெயரெச்ச வடிவம், ‘நின்றுகொண்டிருப்பவன்’ அல்லது ‘நிற்பவன்’ என்று சொற்பொருள் தருகிறது. இச்சூழலில் நிலை அல்லது பணியிடத்தைக் குறிக்கும் இயல்பான தமிழ் வினைமுற்றாக ‘நின்றான்’ பயன்படுத்தப்பட்டது.
- source_word: עַל יְמִינוֹ
  choice: அவனுடைய வலப்பக்கத்தில்
  rationale: இச்சொற்றொடர் ஒருவரின் வலதுபுறத்தில் உள்ள இடத்தைக் குறிக்கிறது. ‘வலப்பக்கத்தில்’ என்பது அந்த இடவியல் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: בֶּן בֶּרֶכְיָהוּ בֶּן שִׁמְעָא
  choice: பெரெகியாவின் மகனும் சிமெயாவின் பேரனும்
  rationale: எபிரெய வம்சத்தொடர் ஆசாப் பெரெகியாவின் மகன் என்றும், பெரெகியா சிமெயாவின் மகன் என்றும் கூறுகிறது. தமிழில் இயல்பாகவும் உறவுமுறையைத் தெளிவாகவும் காட்ட ‘மகன்… பேரன்’ என வழங்கப்பட்டது.
- source_word: בֶּרֶכְיָהוּ
  choice: பெரெகியா
  rationale: எபிரெய தனிப்பெயரின் தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: שִׁמְעָא
  choice: சிமெயா
  rationale: எபிரெய தனிப்பெயரின் தமிழ் எழுத்துப்பெயர்ப்பு.
