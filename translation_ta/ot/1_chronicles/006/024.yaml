    reason: lexical_alternative
  revision_rationale: The revision retains the source’s repeated name “Asaph,” its positional expression, and the nested בן genealogy without collapsing it into “grandson.” The footnote remains correctly anchored to the positional phrase and accurately states the lexical alternative.
