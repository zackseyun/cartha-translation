translation_notes:
  register: நவீனத் தரத் தமிழில், வேதாகம உரைக்கு ஏற்ற கண்ணியமான ஆனால் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டது. மூலத்தின் இருமுறை வரும் ‘ஆசாப்’ பெயர் பாதுகாக்கப்பட்டது; நீளமான ஒரே வாக்கியத்தைத் தவிர்த்து, வம்சவிளக்கம் தெளிவாகத் தனி வாக்கியமாக அமைக்கப்பட்டது.
