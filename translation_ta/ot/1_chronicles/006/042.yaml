source:
  edition: WLC
  text: וְ/לִ/בְנֵ֣י אַהֲרֹ֗ן נָתְנוּ֙ אֶת עָרֵ֣י הַ/מִּקְלָ֔ט אֶת חֶבְר֥וֹן וְ/אֶת לִבְנָ֖ה וְ/אֶת מִגְרָשֶׁ֑י/הָ וְ/אֶת יַתִּ֥ר וְ/אֶֽת אֶשְׁתְּמֹ֖עַ וְ/אֶת מִגְרָשֶֽׁי/הָ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/042.yaml
  text: 'And to the sons of Aaron they gave the cities of refuge: Hebron[a], and Libnah with its pasturelands, and Jattir, and Eshtemoa with its pasturelands.'
translation:
  language: ta
  text: ஆரோனின் மகன்களுக்கு அவர்கள் அடைக்கல நகரங்களான எப்ரோனையும், லிப்னாவையும் அதன் சுற்றியுள்ள திறந்த நிலங்களையும்[a], யத்தீரையும், எஸ்தெமோவாவையும் அதன் சுற்றியுள்ள திறந்த நிலங்களையும் கொடுத்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சுற்றியுள்ள திறந்த நிலங்கள்” என்பதை “பொதுப் பயன்பாட்டு நிலங்கள்” என்றும் மொழிபெயர்க்கலாம்; எபிரேயச் சொல் ஒரு நகரத்துக்குச் சொந்தமான திறந்தவெளி நிலத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לִ/בְנֵי אַהֲרֹן
  choice: ஆரோனின் மகன்களுக்கு
  rationale: לְ பெறுநரைக் குறிக்கிறது; בְּנֵי என்பதன் நேரடியான பொருளான ‘மகன்கள்’ வம்ச/குலச் சூழலிலும் இயல்பாக உள்ளது.
- source_word: נָתְנוּ
  choice: அவர்கள் ... கொடுத்தார்கள்
  rationale: נתן என்பதன் அடிப்படைப் பொருள் ‘கொடு’; நகரப் பங்கீட்டுச் சூழலிலும் இது தெளிவாகவும் மூலத்திற்கு நெருக்கமாகவும் உள்ளது.
- source_word: עָרֵי הַמִּקְלָט
  choice: அடைக்கல நகரங்களாகிய
  rationale: தோராவில் பாதுகாப்புக்காக ஒதுக்கப்பட்ட நகரங்களைக் குறிக்கும் நிலையான சட்டச் சொற்றொடரை இயல்பான தமிழில் தருகிறது.
- source_word: אֶת חֶבְרוֹן
  choice: எப்ரோனையும்
  rationale: எபிரேய இடப்பெயரின் தமிழ் ஒலிபெயர்ப்பு.
- source_word: וְאֶת לִבְנָה
  choice: லிப்னாவையும்
  rationale: எபிரேய இடப்பெயரின் தமிழ் ஒலிபெயர்ப்பு.
- source_word: מִגְרָשֶׁיהָ
  choice: அதன் மேய்ச்சல் நிலங்களையும்
  rationale: מִגְרָשׁ என்பது நகரத்தைச் சேர்ந்த திறந்தவெளி நிலத்தை, குறிப்பாக கால்நடை மேய்ச்சலுக்கான நிலத்தை, குறிக்கிறது; பெண்பால் ஒருமை பின்னொட்டு உடனடியாக முன்வரும் நகரத்தைக் குறிக்கிறது.
- source_word: וְאֶת יַתִּר
  choice: யத்தீரையும்
  rationale: எபிரேய இடப்பெயரின் ஒலியமைப்பைத் தெளிவாகப் பிரதிபலிக்கும் தமிழ் வடிவம்.
- source_word: וְאֶת אֶשְׁתְּמֹעַ
  choice: எஸ்தெமோவாவையும்
  rationale: எபிரேய இடப்பெயரின் தமிழ் ஒலிபெயர்ப்பு; இறுதி ע ஒலிக்கான பாரம்பரிய உயிரொலி வடிவம் வாசிப்பை எளிதாக்குகிறது.
