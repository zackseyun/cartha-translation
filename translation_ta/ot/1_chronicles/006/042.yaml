  register: நவீன நிலையான தமிழில், வரலாற்றுப் பட்டியலுக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரேய வாக்கியத்தின் தொடர் பட்டியல் அமைப்பு காக்கப்பட்டுள்ளது; ஒவ்வொரு நகரத்துடனும் வெளிப்படையாக இணைக்கப்பட்ட மேய்ச்சல் நிலங்கள் மட்டும் அதேபடி குறிப்பிடப்பட்டுள்ளன.
