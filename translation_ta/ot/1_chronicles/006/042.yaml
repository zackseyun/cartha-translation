  source_fidelity: மூல எபிரேயத்தின் பட்டியல் அமைப்பும், ஆரோனின் மகன்களுக்கு அடைக்கல நகரங்கள் வழங்கப்பட்டன என்ற பொருளும் சரியாக உள்ளன. ஆனால் מִגְרָשֶׁיהָ என்பது நகரத்தைச் சுற்றியுள்ள திறந்த நிலப்பகுதிகளைக் குறிக்கிறது; அதை 'மேய்ச்சல் நிலங்கள்' என்று மட்டும் கூறுவது பொருளைச் சற்றே குறுக்குகிறது. மேலும் அடிக்குறி குறியீடு லிப்னாவுக்குரிய இந்தச் சொல்லின் பின்னர் வர வேண்டும்; தற்போதைய இடம் அதற்கு ஏற்றதே, ஆனால் உரையில் இணைப்பு இயல்பாகச் சீரமைக்கப்படலாம்.
