  naturalness: The concise list format, possessive form “கோகாத்தின்,” and comma-separated names are natural modern Tamil. Adding “மேலும்,” retains the source linkage without making the genealogy unnatural.
  terminology: “மகன்கள்” correctly denotes Kohath’s immediate sons in this context. The established and recognizable Tamil biblical name forms “கோகாத்,” “அம்ராம்,” “எப்ரோன்,” and “ஊசியேல்” are suitable. “இத்சார்” is a defensible close transliteration of יִצְהָר and does not introduce a meaning change.
