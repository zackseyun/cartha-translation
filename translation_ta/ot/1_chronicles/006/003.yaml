source:
  edition: WLC
  text: וּ/בְנֵ֖י קְהָ֑ת עַמְרָ֣ם וְ/יִצְהָ֔ר וְ/חֶבְר֖וֹן וְ/עֻזִּיאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/003.yaml
  text: 'And the sons of Kohath: Amram, Izhar, Hebron, and Uzziel.'
translation:
  language: ta
  text: 'மேலும், கோகாத்தின் மகன்கள்: அம்ராம், இத்சார், எப்ரோன், ஊசியேல்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: மகன்கள்
  rationale: בְנֵי என்பது இங்கு நேரடி மகன்களைக் குறிக்கும் இணைநிலை வடிவம். தொடக்க ו முந்தைய வம்சப்பட்டியலுடன் இணைக்கிறது; ஆனால் இயல்பான தமிழ் பட்டியல் நடையில் தனியாக ‘மேலும்’ என்று சேர்க்காமல் விடுவது பொருளையும் தொடர்ச்சியையும் காக்கிறது.
- source_word: קְהָת
  choice: கோகாத்
  rationale: எபிரெய தனிப்பெயரின் ஒலியை நவீனத் தமிழில் இயல்பாக எழுத்துப்பெயர்த்துள்ளது; உடைமைத் தொடர்புக்காக ‘கோகாத்தின்’ என உருபேற்றப்பட்டுள்ளது.
- source_word: עַמְרָם
  choice: அம்ராம்
  rationale: எபிரெய தனிப்பெயரின் ஒலியை நெருக்கமாகப் பேணும் தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: וְיִצְהָר
  choice: இத்சார்
  rationale: יִצְהָר என்ற தனிப்பெயரில் உள்ள צְ ஒலிக்கூட்டத்தை ‘த்ச’ எனக் காட்டி, பட்டியலிலுள்ள ו இணைப்புகளைத் தமிழ் காற்புள்ளி அமைப்பால் வெளிப்படுத்தியுள்ளது.
- source_word: וְחֶבְרוֹן
  choice: எப்ரோன்
  rationale: இங்கு חֶבְרוֹן என்பது நகரம் அல்ல, ஒருவரின் பெயர். தொடக்க ח ஒலியைத் தமிழில் இயல்பாக ‘எ’ தொடக்கத்துடனும், ב ஒலியை ‘ப்’ சார்ந்த வடிவத்திலும் எழுத்துப்பெயர்த்துள்ளது.
- source_word: וְעֻזִּיאֵל
  choice: ஊசியேல்
  rationale: עֻזִּיאֵל என்ற தனிப்பெயரின் பாரம்பரியமாக அறியத்தக்க தமிழ் வடிவத்தைப் பயன்படுத்தியுள்ளது; இறுதி பட்டியல் இணைப்பு தமிழ் நடையில் காற்புள்ளியால் இயல்பாகத் தெரிவிக்கப்படுகிறது.
theological_decisions: []
translation_notes:
  register: சுருக்கமான வம்சப்பட்டியல் நடையைப் பேணி, சாதாரண நவீனத் தமிழ் வாசகர்களுக்குப் புரியும் கண்ணியமான மொழிநடை பயன்படுத்தப்பட்டுள்ளது. தனிப்பெயர்கள் மூல எபிரெய ஒலிகளையும் தமிழில் நிலைபெற்ற வேதாகமப் பயன்பாட்டையும் சமநிலைப்படுத்தி வழங்கப்பட்டுள்ளன.
