  text: Elkanah his son[a], Elkanah his son, Zophai his son, and Nahath his son.
translation:
  language: ta
  text: எல்க்கானா, அவனுடைய மகன்; எல்க்கானா, அவனுடைய மகன்; சோப்பாய்[a], அவனுடைய மகன்; மற்றும் நாகாத், அவனுடைய மகன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சூப்பாய்”; צוֹפַי என்ற பெயரின் வேறுபட்ட உயிர்ப்பிப்பு அல்லது எழுத்துப்பெயர்ப்பு மரபை இது பிரதிபலிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶלְקָנָה
  choice: எல்க்கானா
  rationale: எபிரெய தனிப்பெயர் அதன் ஒலியமைப்பைப் பின்பற்றி தமிழில் எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: בְּנוֹ / בנו
  choice: அவனுடைய மகன்
  rationale: மூன்றாம் நபர் ஆண்பால் ஒருமை உடைமை விகுதியுடன் வரும் ‘மகன்’ என்ற சொல்லை இயல்பான தமிழில் வழங்கி, எபிரெய வம்சவரிசையின் திரும்பவரும் நடையைப் பாதுகாக்க ஒவ்வொரு முறையும் முழுமையாகக் கூறப்பட்டது.
- source_word: צוֹפַי
  choice: சோப்பாய்
  rationale: மசோரா உயிர்க்குறிப்புகளுடனான எபிரெய வடிவத்தின் ஒலிப்பை நெருக்கமாகப் பின்பற்றும் தனிப்பெயர் எழுத்துப்பெயர்ப்பு.
- source_word: וְ
  choice: —
  rationale: இறுதிப் பெயருக்கு முன் உள்ள எபிரெய இணைப்புச்சொல், தமிழில் வம்சவரிசைப் பட்டியலின் இயல்பான நிறுத்தக்குறி அமைப்பால் வெளிப்படுத்தப்பட்டது; தனியாக ‘மற்றும்’ சேர்ப்பது தொடர்பைத் தெளிவிழக்கச் செய்யக்கூடும்.
- source_word: נַחַת
  choice: நாகாத்
  rationale: எபிரெய தனிப்பெயரின் மெய்யெழுத்துகளையும் நடுவிலுள்ள தொண்டை உரசொலியையும் தமிழ் எழுத்துப்பெயர்ப்பில் அண்மையாகக் காட்டுகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், வம்சவரிசைக்குரிய சுருக்கத்தையும் திரும்பவரும் ஓசையையும் காக்கும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் உறவுக் குறிப்புகள் பெயருக்குப் பின் வந்தாலும், இயல்பான தமிழுக்காக ‘அவனுடைய மகன் + பெயர்’ என்ற சொல் வரிசை பயன்படுத்தப்பட்டது.
