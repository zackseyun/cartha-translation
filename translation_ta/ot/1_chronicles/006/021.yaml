  text: the son of Elkanah[a], the son of Joel, the son of Azariah, the son of Zephaniah.
translation:
  language: ta
  text: எல்க்கானாவின் மகன்[a], யோவேலின் மகன், அசரியாவின் மகன், செப்பனியாவின் மகன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு ஒவ்வொரு ‘மகன்’ என்பதும் ‘வழித்தோன்றல்’ என்றும் பொருள்பட வாய்ப்புள்ளது; ஏனெனில் எபிரெய மரபுப்பட்டியல்கள் சில தலைமுறைகளைச் சொல்லாமல் விடக்கூடும். எனினும், இங்குள்ள தொடர்ச்சியான மரபுவரிசை ‘மகன்’ என்ற குறிப்பான பொருளையே ஆதரிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן
  choice: மகன்
  rationale: எபிரெய மரபுப்பட்டியலில் இது தந்தை–மகன் உறவைக் குறிக்கிறது. மூலத்தின் தொடர் அமைப்பைப் பாதுகாக்க ஒவ்வொரு பெயருடனும் ‘மகன்’ மீண்டும் வழங்கப்பட்டுள்ளது.
- source_word: אֶלְקָנָה
  choice: எல்க்கானா
  rationale: எபிரெய தனிப்பெயரின் ஒலிப்பை நவீனத் தமிழில் இயன்றவரை தெளிவாகப் பெயர்த்தெழுதுகிறது.
- source_word: יוֹאֵל
  choice: யோவேல்
  rationale: எபிரெய Yo'el என்ற தனிப்பெயரின் ஒலிப்பையும் இரண்டு அசை அமைப்பையும் தமிழில் தெளிவாகப் பாதுகாக்கிறது.
- source_word: עֲזַרְיָה
  choice: அசரியா
  rationale: எபிரெய தனிப்பெயரின் ஒலிப்பைத் தமிழ் எழுத்துமுறைக்கு ஏற்றவாறு பெயர்த்தெழுதுகிறது.
- source_word: צְפַנְיָה
  choice: செப்பனியா
  rationale: எபிரெய Ṣəp̄anyāh என்ற தனிப்பெயரின் ஒலிப்பைத் தமிழில் இயல்பாகப் பெயர்த்தெழுதுகிறது.
