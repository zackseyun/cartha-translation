source:
  edition: WLC
  text: וְ/אֵ֗לֶּה אֲשֶׁ֨ר הֶעֱמִ֥יד דָּוִ֛יד עַל יְדֵי שִׁ֖יר בֵּ֣ית יְהוָ֑ה מִ/מְּנ֖וֹחַ הָ/אָרֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/016.yaml
  text: These are the men whom David appointed over the service of song in the house of Yahweh[b][a], after the ark came to rest.
translation:
  language: ta
  text: பேழை ஓய்வுற்றபின்[a], யாவேயின் இல்லத்தில் பாடல் பணிக்குப் பொறுப்பாக[b] தாவீது நியமித்தவர்கள் இவர்களே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பேழையின் ஓய்விலிருந்து.” எபிரெயத்தில் சொல்லுக்கு சொல், “பேழையின் ஓய்விலிருந்து.”
    reason: lexical_alternative
  - marker: b
    text: “பாடுவதற்காக” அல்லது “பாடலை மேற்பார்வையிட” என்றும் மொழிபெயர்க்கலாம். இச்சொற்றொடர் பரிசுத்த இடத்தில் இசைவழிபாட்டிற்கான பொறுப்பைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה אֲשֶׁר
  choice: நியமித்தவர்கள் இவர்களே
  rationale: அடுத்து வரும் பெயர்ப்பட்டியலை அறிமுகப்படுத்தும் எபிரெய உறவுத்தொடரை இயல்பான தமிழில் தருகிறது; ஆட்கள் ஆண்கள் என்பது சூழலில் தெளிவாக இருப்பதால் ‘மனிதர்கள்’ என்று கூடுதலாகச் சேர்க்கப்படவில்லை.
- source_word: הֶעֱמִיד דָּוִיד
  choice: தாவீது நியமித்த
  rationale: עמד என்பதன் ஹிஃபில் வடிவம் இங்கு வெறுமனே நிறுத்துவதை அல்ல, ஒரு பொறுப்பில் அமர்த்துவதைச் சுட்டுகிறது.
- source_word: עַל יְדֵי שִׁיר
  choice: பாடல் பணிக்குப் பொறுப்பாக
  rationale: இந்தச் சொற்றொடர் பாடுதல் அல்லது இசைவழிபாடு சார்ந்த பணிக்கான பொறுப்பைச் சுட்டுகிறது; நிர்வாக நுணுக்கத்தையும் வழிபாட்டுச் செயலையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: בֵּית יְהוָה
  choice: யெகோவாவின் இல்லத்தில்
  rationale: בַּיִת என்பதன் ‘இல்லம்’ என்ற உருவகத்தைப் பாதுகாக்கிறது; יְהוָה என்ற திருப்பெயரை தமிழில் பரவலாக அறியப்படும் ‘யெகோவா’ என ஒலிபெயர்க்கிறது.
- source_word: מִמְּנוֹחַ הָאָרוֹן
  choice: பெட்டி இளைப்பாறியதிலிருந்து
  rationale: மூலத்தின் מן + מְנוֹחַ அமைப்பை ‘இளைப்பாறியதிலிருந்து’ என்று நெருக்கமாகப் பாதுகாக்கிறது; הָאָרוֹן என்பதற்கு மூலத்தில் இல்லாத ‘உடன்படிக்கை’ என்ற விளக்கத்தைச் சேர்க்காமல் ‘பெட்டி’ எனத் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: கர்த்தர் / யாஹ்வே
  rationale: மூலத்தில் தனிப்பட்ட திருப்பெயர் நேரடியாக இருப்பதால் பொதுப்பட்டமான ‘கர்த்தர்’ என்று மாற்றாமல் ஒலிபெயர்க்கப்படுகிறது. தமிழில் இயல்பாகவும் பரவலாகவும் அறியப்படும் வடிவமாக ‘யெகோவா’ தேர்ந்தெடுக்கப்பட்டது.
- issue: ‘பெட்டி இளைப்பாறியதிலிருந்து’ என்பதன் காலத் தொடர்பு
  choice: மூலத்தின் ‘இருந்து’ வடிவத்தைத் தக்கவைத்தல்
  alternative: பெட்டி இளைப்பாறிய பிறகு
  rationale: מִן என்ற முன்னிடைச்சொல் தொடக்கப்புள்ளி அல்லது காலத் தொடர்பைக் குறிக்கலாம். ‘பிறகு’ என்பது இயல்பான விளக்கம் என்றாலும், மூலத்தின் சிறிதளவு தெளிவின்மையை முதன்மை உரையில் தக்கவைத்து மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட நடை. ‘இல்லம்’, ‘பாடல் பணி’, ‘இளைப்பாறுதல்’ ஆகிய சொற்கள் மூல உருவகங்களையும் வழிபாட்டுச் சூழலையும் காக்கின்றன. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்றொடர்களின் உடனடிப் பின்னர் வைக்கப்பட்டுள்ளன.
