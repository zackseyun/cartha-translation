base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/029.yaml
  text: 'And the sons of Merari[a], their brothers, were on the left: Ethan son of Kishi, son of Abdi, son of Malluch.'
translation:
  language: ta
  text: 'அவர்களுடைய சகோதரர்களான மெராரியின் மகன்கள்[a] இடப்பக்கத்தில் இருந்தார்கள்: கீஷியின் மகன் ஏத்தான்; அப்தியின் மகன் கீஷி; மல்லூக்கின் மகன் அப்தி.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவர்களுடைய உறவினர்கள்’; குலமரபுச் சூழல்களில் ‘சகோதரர்கள்’ என்பதற்கான எபிரெயச் சொல் ஒரே குலத்தைச் சேர்ந்தவர்களையும் பரந்த பொருளில் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי מְרָרִי
  choice: மெராரியின் மகன்களாகிய
  rationale: எபிரெயச் சொற்றொடரின் ‘மெராரியின் மகன்கள்’ என்ற வடிவத்தைப் பேணுகிறது; இங்கு அது மெராரியின் வம்சத்தாரைக் குறிக்கிறது.
- source_word: אֲחֵיהֶם
  choice: அவர்களுடைய சகோதரர்கள்
  rationale: அடிப்படைப் பொருளான ‘சகோதரர்கள்’ என்பதைக் காக்கிறது; குலமரபுச் சூழலில் இது உறவினர்களையும் ஒரே குலத்தைச் சேர்ந்தவர்களையும் குறிக்கக்கூடும் என்பதால் அடிக்குறிப்பு சேர்க்கப்பட்டுள்ளது.
- source_word: עַל הַשְּׂמֹאול
  choice: இடப்பக்கத்தில் இருந்தார்கள்
  rationale: ‘இடப்பக்கத்தில்’ என்ற இடநிலையை இயல்பான தமிழில் தருகிறது; எபிரெய வாக்கியத்தில் மறைமுகமாக உள்ள வினைச்சொல் தமிழில் தெளிவுக்காகச் சேர்க்கப்பட்டுள்ளது.
- source_word: אֵיתָן בֶּן קִישִׁי בֶּן עַבְדִּי בֶּן מַלּוּךְ
  choice: கீசியின் மகன் ஏத்தான்; கீசி அப்தியின் மகன்; அப்தி மல்லூக்கின் மகன்
  rationale: வம்சவரிசையைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது; בֶּן என்பதன் ‘மகன்’ என்ற நேரடிப் பொருளைப் பேணுகிறது.
