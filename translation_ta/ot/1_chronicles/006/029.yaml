  register: நவீன நிலையான தமிழில், கண்ணியமானதும் பொதுவாசகர்களுக்கு எளிதில் புரியத்தக்கதுமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய வம்சவரிசை வடிவம் தெளிவுக்காகத் தமிழுக்கேற்றவாறு விரிக்கப்பட்டுள்ளது.
