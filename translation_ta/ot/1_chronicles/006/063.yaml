  text: וּ/מֵ/עֵ֜בֶר לְ/יַרְדֵּ֣ן יְרֵחוֹ֮ לְ/מִזְרַ֣ח הַ/יַּרְדֵּן֒ מִ/מַּטֵּ֣ה רְאוּבֵ֔ן אֶת בֶּ֥צֶר בַּ/מִּדְבָּ֖ר וְ/אֶת מִגְרָשֶׁ֑י/הָ וְ/אֶת יַ֖הְצָ/ה וְ/אֶת מִגְרָשֶֽׁי/הָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/063.yaml
  text: 'And beyond the Jordan at Jericho[a], east of the Jordan, from the tribe of Reuben: Bezer in the wilderness, with its pasturelands, and Jahzah, with its pasturelands.'
translation:
  language: ta
  text: 'மேலும், எரிகோவுக்கு எதிரே, யோர்தானுக்கு அப்பால், யோர்தானுக்குக் கிழக்கே, ரூபன் கோத்திரத்திலிருந்து: வனாந்தரத்திலுள்ள பெசேரையும் அதன் மேய்ச்சல் நிலங்களையும், யஹ்சாவையும்[a] அதன் மேய்ச்சல் நிலங்களையும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இப்பெயர் “யஹாஸ்” என்றும் வழங்கப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵעֵבֶר
  choice: மேலும், ... அப்பால்
  rationale: இந்த இணைப்பும் இடத்தைக் குறிக்கும் சொற்றொடரும் முந்தைய நகரப் பட்டியலின் தொடர்ச்சியைத் தெரிவிக்கின்றன; ‘அப்பால்’ என்பது எபிரெயச் சொல்லின் இடம்சார் பொருளை இயல்பாகக் காக்கிறது.
- source_word: לְיַרְדֵּן יְרֵחוֹ
  choice: எரிகோவுக்கு அருகே யோர்தானுக்கு அப்பால்
  rationale: எரிகோவை ஒட்டிய யோர்தான் பகுதியைச் சுட்டும் அடுக்குச் சொல்லமைப்பைத் தமிழில் தெளிவான இடக்குறிப்பாக வழங்குகிறது.
- source_word: לְמִזְרַח הַיַּרְדֵּן
  choice: யோர்தானுக்குக் கிழக்கே
  rationale: מִזְרָח என்பதன் திசைப் பொருளை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: מִמַּטֵּה רְאוּבֵן
  choice: ரூபன் கோத்திரத்திலிருந்து
  rationale: நிலப் பங்கீட்டுச் சூழலில் מַטֶּה என்பது ‘கோத்திரம்’ எனப் பொருள்படுகிறது.
- source_word: בֶּצֶר
  choice: பேசேர்
  rationale: எபிரெய இடப்பெயரின் ஒலிவடிவத்தைத் தமிழில் அணுக்கமாக எழுத்துப்பெயர்க்கிறது.
- source_word: בַּמִּדְבָּר
  choice: வனாந்தரத்திலுள்ள
  rationale: மற்ற இடங்களில் உள்ள அதே பெயருடைய ஊரிலிருந்து இதை வேறுபடுத்தும் நிலவியல் குறிப்பைச் சுருக்கமாகக் காக்கிறது.
- source_word: מִגְרָשֶׁיהָ
  choice: அதன் மேய்ச்சல் நிலங்கள்
  rationale: லேவியர் நகரப் பட்டியல்களில் מִגְרָשׁ என்பது நகரைச் சுற்றிய கால்நடை மேய்ச்சலுக்கான திறந்த நிலங்களைக் குறிக்கிறது.
- source_word: יַהְצָה
  choice: யாக்சா
  rationale: இவ்வசனத்திலுள்ள எபிரெயப் பெயரின் வடிவத்தை அடிப்படையாகக் கொண்ட எழுத்துப்பெயர்ப்பு; மரபில் காணப்படும் மாற்று வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
