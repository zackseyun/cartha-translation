  text: Ramoth with its pasturelands[a], and Anem with its pasturelands.
translation:
  language: ta
  text: 'ராமோத்தையும் அதன் மேய்ச்சல் நிலங்களையும், ஆனேமையும்[a] அதன் மேய்ச்சல் நிலங்களையும்.


    [a] எபிரெய மூலப்பாடத்தில் “ஆனேம்”; இதற்கு இணையான யோசுவா 21:25 பட்டியலில் “ஆனேர்” என்று உள்ளது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மூலப்பாடத்தில் “ஆனேம்”; இதற்கு இணையான யோசுவா 21:25 பட்டியலில் “ஆனேர்” என்று உள்ளது.
    reason: மூலப்பாட வேறுபாட்டைக் குறிப்பிட்டு, மசோரா உரையின் வாசகத்தைப் பிரதான உரையில் நிலைநிறுத்துகிறது.
lexical_decisions:
- source_word: רָאמוֹת
  choice: ராமோத்
  rationale: இது ஓர் ஊரின் பெயர்; பொருள் மொழிபெயர்ப்பு செய்யாமல் எபிரெய ஒலிப்புக்கு நெருக்கமாகப் பெயர்க்கப்பட்டது.
- source_word: מִגְרָשֶׁיהָ
  choice: அதன் மேய்ச்சல் நிலங்கள்
  rationale: מִגְרָשׁ என்பது நகரத்தைச் சேர்ந்த சுற்றுப்புறத் திறந்த நிலத்தை, குறிப்பாக கால்நடைகளை மேய்க்கப் பயன்படும் நிலத்தை, குறிக்கிறது. லேவியர் நகரங்களின் சூழலில் “மேய்ச்சல் நிலங்கள்” இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: עָנֵם
  choice: ஆனேம்
  rationale: மசோரா மூலப்பாடத்தின் ஊர்ப்பெயர் ஒலிப்பெயர்க்கப்பட்டது. யோசுவா 21:25-இல் காணப்படும் “ஆனேர்” பிரதான உரையில் ஏற்கப்படாமல் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- source_word: וְאֶת
  choice: -ஐ / -யையும்
  rationale: וְ என்ற இணைப்பும் אֶת என்ற நேர்செயப்படுபொருள் குறியும் தமிழில் பட்டியலின் ஒவ்வொரு கூறிலும் “-ஐ/-யையும்” என்ற வேற்றுமை மற்றும் இணைப்பு வடிவங்களால் இயல்பாக வெளிப்படுத்தப்பட்டன.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், பட்டியல் அமைப்பைத் தெளிவாக வைத்திருக்கும் கண்ணியமான நடை. எபிரெய வசனம் முந்தைய வாக்கியத்தின் தொடராக இருப்பதால், தமிழில் வாக்கியத்தை நிறைவு செய்ய சூழலிலிருந்து “கொடுத்தார்கள்” சேர்க்கப்பட்டுள்ளது.
