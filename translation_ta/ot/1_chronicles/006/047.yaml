  source_fidelity: எபிரெய மூலத்தின் ஒதுக்கீட்டுப் பட்டியல் அமைப்பு, கெர்சோம் என்ற இவ்வசனத்திற்குரிய எழுத்துவடிவம், குலம்/கோத்திரம் என்ற வேறுபாடு, நான்கு கோத்திரங்களின் வரிசை, மற்றும் பதின்மூன்று நகரங்கள் என்ற எண்ணிக்கை ஆகியவை துல்லியமாகக் காக்கப்பட்டுள்ளன. மூலத்தில் வெளிப்படையாக வினைச்சொல் இல்லாவிட்டாலும், முன்னும் பின்னுமான ஒதுக்கீட்டுச் சூழலுக்கு ஏற்ப ‘ஒதுக்கப்பட்டன’ என்பது பொருளை மாற்றாத இயல்பான தமிழ் நிறைவாக்கம் ஆகும்.
  naturalness: நவீன நிலையான தமிழில் வாசிக்க இயல்பானதும், நிர்வாக-வம்சப் பட்டியலுக்கேற்ற கண்ணியமான நடையுமாக உள்ளது. ‘கெர்சோமின் மகன்களுக்கு’ மற்றும் தொடர்ச்சியான ‘கோத்திரத்திலிருந்தும்’ அமைப்பு தெளிவாக உள்ளது.
  terminology: ‘குலங்கள்’ என்பது מִשְׁפְּחוֹתָם என்பதற்கும், ‘கோத்திரம்’ என்பது מַטֶּה என்பதற்கும் பொருத்தமான வேறுபாட்டைத் தருகிறது. பெயரொலிபெயர்ப்புகளும் ஒரேமுறையில் உள்ளன. அடிக்குறிப்பு a, இவ்வசனத்தில் உள்ள கெர்சோம் வடிவத்தையும் மரபான கெர்சோன் வடிவத்தையும் சரியாக விளக்குகிறது; அடிக்குறிப்பு b, மூலத்தில் இல்லாத ‘அரைக்கோத்திரம்’ என்ற விரிவாக்கத்தை உரையில் சேர்க்காமல் விளக்குகிறது.
