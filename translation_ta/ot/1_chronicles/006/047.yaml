id: 1CH.6.47
reference: 1 Chronicles 6:47
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/לִ/בְנֵ֨י גֵרְשׁ֜וֹם לְ/מִשְׁפְּחוֹתָ֗/ם מִ/מַּטֵּ֣ה יִ֠שָׂשכָר וּ/מִ/מַּטֵּ֨ה אָשֵׁ֜ר וּ/מִ/מַּטֵּ֣ה נַפְתָּלִ֗י וּ/מִ/מַּטֵּ֤ה מְנַשֶּׁה֙ בַּ/בָּשָׁ֔ן עָרִ֖ים שְׁלֹ֥שׁ עֶשְׂרֵֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/047.yaml
  text: 'And to the sons of Gershom[a], according to their clans, from the tribe of Issachar, and from the tribe of Asher, and from the tribe of Naphtali[b], and from the tribe of Manasseh in Bashan: thirteen cities.'
translation:
  language: ta
  text: கெர்சோமின்[a] மகன்களுக்கு, அவர்களுடைய குலங்களின்படி, இசக்கார் கோத்திரத்திலிருந்தும் ஆசேர் கோத்திரத்திலிருந்தும் நப்தலி கோத்திரத்திலிருந்தும் பாசானிலிருந்த மனாசே கோத்திரத்திலிருந்தும்[b] பதின்மூன்று நகரங்கள் ஒதுக்கப்பட்டன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு எபிரெயத்தில் குலப்பெயர் ‘கெர்சோம்’ என்று எழுதப்பட்டுள்ளது; பல மொழிபெயர்ப்புகளில் ‘கெர்சோன்’ என்று உள்ளது.
    reason: alternative_reading
  - marker: b
    text: புவியியல் குறிப்பை வெளிப்படையாக்க சில மொழிபெயர்ப்புகள் இதை ‘பாசானிலிருந்த மனாசேயின் அரைக்கோத்திரம்’ என்று விரிவாக்குகின்றன. ஆனால் ‘அரைக்கோத்திரம்’ என்பது இவ்வசனத்தின் எபிரெய உரையில் இல்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִבְנֵי
  choice: மகன்களுக்கு
  rationale: בְּנֵי என்பதன் அடிப்படைப் பொருளான ‘மகன்கள்’ என்பதைக் காத்து, ஒதுக்கீட்டைப் பெறுபவர்களைக் குறிக்கும் לְ முன்னொட்டைத் தமிழின் நான்காம் வேற்றுமையால் வெளிப்படுத்துகிறது.
- source_word: גֵרְשׁוֹם
  choice: கெர்சோம்
  rationale: இவ்வசனத்தின் எபிரெய வடிவம் இறுதியில் ם (ம்) கொண்ட ‘கெர்சோம்’; மரபில் காணப்படும் ‘கெர்சோன்’ என்ற வடிவத்தை விட மூல எழுத்தமைப்பை இது நெருக்கமாகப் பின்பற்றுகிறது.
- source_word: לְמִשְׁפְּחוֹתָם
  choice: அவர்களுடைய குலங்களின்படி
  rationale: கோத்திர அமைப்புக்குள் உள்ள உட்பிரிவுகளை מִשְׁפָּחוֹת குறிக்கிறது; ஆகவே பொதுவான ‘குடும்பங்கள்’ என்பதைக் காட்டிலும் ‘குலங்கள்’ இச்சூழலில் துல்லியமானது.
- source_word: מִמַּטֵּה
  choice: கோத்திரத்திலிருந்து
  rationale: நில மற்றும் வம்ச ஒதுக்கீட்டுச் சூழலில் מַטֶּה என்பது ‘கோத்திரம்’; மீண்டும் மீண்டும் வரும் מִן முன்னொட்டை ‘-இலிருந்து’ என மொழிபெயர்க்கிறது.
- source_word: יִשָׂשכָר
  choice: இசக்கார்
  rationale: எபிரெய கோத்திரப் பெயரின் தமிழில் பரவலாக அறியப்படும் வடிவம்.
- source_word: אָשֵׁר
  choice: ஆசேர்
  rationale: எபிரெய கோத்திரப் பெயரைத் தமிழில் இயல்பாக ஒலிபெயர்க்கும் வடிவம்.
- source_word: נַפְתָּלִי
  choice: நப்தலி
  rationale: எபிரெய கோத்திரப் பெயரின் தமிழில் பரவலாக அறியப்படும் வடிவம்.
- source_word: מְנַשֶּׁה בַּבָּשָׁן
  choice: பாசானிலிருந்த மனாசே
  rationale: எபிரெயம் நேரடியாக ‘பாசானில் மனாசே’ என்றே கூறுகிறது. புவியியல் தொடர்பை இயல்பான தமிழில் தருகிறது; ‘மனாசேயின் அரைக்கோத்திரம்’ என்ற மூலத்தில் இல்லாத விரிவாக்கத்தைச் சேர்க்கவில்லை.
- source_word: עָרִים שְׁלֹשׁ עֶשְׂרֵה
  choice: பதின்மூன்று நகரங்கள்
  rationale: எண்ணையும் பெயர்ச்சொல்லையும் நேரடியாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: '[implicit allocation clause]'
  choice: ஒதுக்கப்பட்டன
  rationale: எபிரெய வசனம் ‘அவர்களுக்கு … பதின்மூன்று நகரங்கள்’ என்ற பட்டியல் வடிவில் வினையின்றி நிற்கிறது. முந்தைய ஒதுக்கீட்டுச் சூழல் உணர்த்தும் தொடர்பைத் தமிழில் முழுமையான வாக்கியமாக்க இந்த வினை வெளிப்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: பாசானிலுள்ள மனாசே என்பது அரைக்கோத்திரத்தைக் குறிக்கிறதா?
  choice: ‘பாசானிலிருந்த மனாசே கோத்திரம்’ என்று மூலத்தின் அளவிலேயே மொழிபெயர்க்கப்பட்டது.
  alternative: ‘பாசானிலிருந்த மனாசேயின் அரைக்கோத்திரம்’
  rationale: புவியியல் மற்றும் வரலாற்றுச் சூழலில் கிழக்குப் பகுதி மனாசேயின் அரைக்கோத்திரம் குறிக்கப்படலாம்; எனினும் ‘அரை’ என்பது இவ்வசனத்தின் எபிரெய உரையில் வெளிப்படையாக இல்லை. ஆகவே விளக்கத்தை அடியுரையில் மட்டும் குறிப்பிடுவது மூலத்தின் சுருக்கத்தையும் சாத்தியமான பதற்றத்தையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பட்டியல் மற்றும் கோத்திர ஒதுக்கீட்டுக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. மூலத்தில் வினை இல்லாவிட்டாலும், தமிழில் இயல்பான முழு வாக்கியத்திற்காகச் சூழலால் உணர்த்தப்படும் ‘ஒதுக்கப்பட்டன’ சேர்க்கப்பட்டது. ‘கோத்திரம்’, ‘குலம்’ ஆகியவை நிர்வாக-வம்சப் பிரிவுகளின் வேறுபாட்டைக் காக்கின்றன.
