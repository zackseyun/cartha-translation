  source_fidelity: மூலத்தின் முக்கிய கூறுகள்—வாழ்விடங்கள், குடியிருப்புகள்/முகாம்கள், எல்லைப்பகுதி, ஆரோனின் மகன்கள், கோகாத்தியர் குடும்பத் தொடர்பு, சீட்டின் மூலம் கிடைத்த பங்கு—பாதுகாக்கப்பட்டுள்ளன. ஆனால் ‘இவை ... உரியவை’ என்ற இரண்டாவது வாக்கியத் தொடக்கம், மூலத்தின் ஒருங்கிணைந்த பெயர்ச்சொல் அமைப்பைத் தமிழில் சற்றே துண்டிக்கிறது.
