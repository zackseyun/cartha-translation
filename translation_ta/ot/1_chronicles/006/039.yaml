base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/039.yaml
  text: These were their dwelling places according to their settlements within their territory[a], for the sons of Aaron, of the family of the Kohathites; for the lot was theirs.
translation:
  language: ta
  text: 'அவர்களுடைய எல்லைப்பகுதியில், அவர்களுடைய குடியிருப்புகளின்படி இருந்த வாழ்விடங்கள் இவையே[a]: கோகாத்தியர் குடும்பத்தைச் சேர்ந்த ஆரோனின் மகன்களுக்கானவை; ஏனெனில் சீட்டு அவர்களுக்கே உரியதாயிருந்தது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவர்களுடைய முகாம்களின்படி’ அல்லது ‘அவர்களுடைய கிராமங்களில்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹשְׁבוֹתָם
  choice: அவர்களுடைய வாழ்விடங்கள்
  rationale: மக்கள் வசிக்கும் இடங்களைக் குறிக்கும் எபிரெயச் சொல்லின் தெளிவான, இயல்பான தமிழாக்கம்.
- source_word: לְטִירוֹתָם
  choice: அவர்களுடைய குடியிருப்புகளின்படி
  rationale: טִירָה என்பது குடியிருப்பு, முகாம், அல்லது அரணமைந்த கிராமம் எனப் பொருள்படலாம். நிலப்பங்கீட்டுச் சூழலில் ‘குடியிருப்புகள்’ என்பது குறிப்பிட்ட ஓர் அமைப்பைத் தேவையின்றி நிர்ணயிக்காமல் பரந்த பொருளைத் தக்கவைக்கிறது.
- source_word: בִּגְבוּלָם
  choice: அவர்களுடைய எல்லைக்குள்
  rationale: இங்கு גְּבוּל வெறும் எல்லைக்கோட்டைவிட, அவர்களுக்கு ஒதுக்கப்பட்ட நிலப்பரப்பைக் குறிக்கிறது; ‘எல்லைக்குள்’ என்பது இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לִבְנֵי אַהֲרֹן
  choice: ஆரோனின் மகன்களுக்குரியவை
  rationale: குடிவழி மற்றும் ஆசாரிய அடையாளத்தைத் தக்கவைக்கும் நேரடியான மொழிபெயர்ப்பு.
- source_word: לְמִשְׁפַּחַת הַקְּהָתִי
  choice: கோகாத்தியரின் குடும்பத்தைச் சேர்ந்த
  rationale: ஆரோனின் மகன்களுடைய பரந்த குலத் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: כִּי לָהֶם הָיָה הַגּוֹרָל
  choice: ஏனெனில் சீட்டு அவர்களுக்கே உரியதாக இருந்தது
  rationale: எபிரெய மூலத்தின் உடைமை அமைப்பை நெருக்கமாகப் பின்பற்றி, சீட்டினால் செய்யப்பட்ட பங்கீட்டின் கருத்தையும் காக்கிறது.
