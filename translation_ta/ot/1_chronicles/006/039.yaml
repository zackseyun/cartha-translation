  register: நவீனத் தரத் தமிழில், வரலாற்றுப் பட்டியல் நடைக்கு ஏற்ற கண்ணியமான மொழிநடை பயன்படுத்தப்பட்டுள்ளது. ‘சீட்டு’ என்பது நிலப்பங்கீட்டுக்காக இடப்பட்ட சீட்டைக் குறிக்கிறது; மூலத்தில் உள்ள சுருக்கமான காரணத் தொடர்பு பாதுகாக்கப்பட்டுள்ளது.
