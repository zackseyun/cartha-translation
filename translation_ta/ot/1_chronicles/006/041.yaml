  yaml_path: translation/ot/1_chronicles/006/041.yaml
  text: But the fields of the city and its pasturelands they gave to Caleb son of Jephunneh[a].
translation:
  language: ta
  text: ஆனால் நகரத்தின் வயல்களையும் அதைச் சேர்ந்த குடியிருப்புகளையும்[a] எப்புன்னேயின் மகன் காலேபுக்குக் கொடுத்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “அதன் கிராமங்களையும்”; “அதன் மேய்ச்சல் நிலங்களையும்” என்றும் பொருள்கொள்ளலாம். எபிரெயச் சொல் நகரத்தைச் சார்ந்த குடியிருப்புகளையோ நிலங்களையோ குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂדֵה הָעִיר
  choice: நகரத்தின் வயல்கள்
  rationale: שָׂדֶה என்பது வயல், திறந்த நிலம் அல்லது பயிரிடும் நிலத்தைக் குறிக்கிறது. இங்கு நகரத்துடன் இணைந்த நிலப்பகுதிகளை இயல்பான தமிழில் கூட்டுப்பொருளுடன் தெரிவிக்கிறது.
- source_word: חֲצֵרֶיהָ
  choice: அதைச் சேர்ந்த குடியிருப்புகள்
  rationale: חָצֵר என்பது சூழலைப் பொறுத்து கிராமங்கள், சார்புக் குடியிருப்புகள் அல்லது நகரத்துடன் இணைந்த திறந்த நிலங்களைக் குறிக்கலாம். நிலப்பங்கீட்டுச் சூழலில் ‘அதைச் சேர்ந்த குடியிருப்புகள்’ என்ற மொழிபெயர்ப்பு நகரத்தைச் சார்ந்த இடங்கள் என்ற உறவைத் தெளிவாகக் காட்டி, சொல்லின் தெளிவின்மையையும் தேவையற்ற வகையில் குறுக்கவில்லை.
- source_word: נָתְנוּ
  choice: கொடுத்தார்கள்
  rationale: נתן என்பதன் கால் நிறைவுவினை வடிவம் நேரடியாக ‘கொடுத்தார்கள்’ என்று பொருள்படும்; ‘ஒதுக்கினார்கள்’ போன்ற விளக்கவுரையான சொல்லைத் தவிர்க்கிறது.
- source_word: לְכָלֵב בֶּן יְפֻנֶּה
  choice: எப்புன்னேயின் மகன் காலேபுக்கு
  rationale: லாமேத் மறைமுகச் செயப்படுபொருளைக் குறிக்கிறது. பெயர்கள் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளன.
- source_word: וְאֶת ... וְאֶת
  choice: ஆனால் ... -யும் ... -யும்
  rationale: முந்தைய சூழலில் நகரம் ஒரு தரப்புக்குக் கொடுக்கப்பட்டதற்கும் அதன் சார்ந்த நிலங்கள் காலேபுக்குக் கொடுக்கப்பட்டதற்கும் இடையிலான எதிர்மறைத் தொடர்பை ஆரம்பத்திலுள்ள வாவ் காட்டுகிறது; ‘ஆனால்’ அதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
