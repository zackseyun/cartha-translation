  source_fidelity: எபிரெய மூலத்தில் இரண்டு நகரப்பெயர்களும், ஒவ்வொன்றோடும் அதன் מִגְרָשֶׁיהָ (‘அதன் மேய்ச்சல்/நகரத்தைச் சுற்றிய திறந்த நிலங்கள்’) என்பதும் பட்டியலிடப்பட்டுள்ளன. ‘கெதேமோத்,’ ‘மேபாத்,’ மற்றும் ‘அதன் மேய்ச்சல் நிலங்கள்’ ஆகியவை இதைத் துல்லியமாகக் காட்டுகின்றன. மூலத்தில் இவ்வசனம் முந்தைய வாக்கியத்துடன் தொடரும் துண்டாக இருப்பதால், தனித்த தமிழ் வாசிப்பிற்காக ‘கொடுத்தார்கள்’ சேர்க்கப்பட்டிருப்பது சூழலால் ஆதரிக்கப்படும் தெளிவாக்கம்; புதிய பொருளைச் சேர்ப்பதில்லை.
