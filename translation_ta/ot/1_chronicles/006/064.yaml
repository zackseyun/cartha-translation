  yaml_path: translation/ot/1_chronicles/006/064.yaml
  text: and Kedemoth with its pasturelands[a], and Mephaath with its pasturelands.
translation:
  language: ta
  text: கெதேமோத்தையும் அதன் மேய்ச்சல் நிலங்களையும்[a], மேபாத்தையும் அதன் மேய்ச்சல் நிலங்களையும் கொடுத்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மேய்ச்சல் நிலங்கள்’ என்பதற்கு ‘பொதுப் பயன்பாட்டு நிலங்கள்’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் ஒரு நகரத்துக்குச் சொந்தமான சுற்றுப்புறத் திறந்த நிலத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: קְדֵמוֹת
  choice: கெதேமோத்
  rationale: இது ஓர் இடப்பெயர்; எபிரெய உச்சரிப்புக்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: מִגְרָשֶׁיהָ
  choice: அதன் மேய்ச்சல் நிலங்கள்
  rationale: מִגְרָשׁ என்பது நகரத்துக்குச் சொந்தமான சுற்றுப்புறத் திறந்த நிலத்தை, குறிப்பாக மேய்ச்சலுக்குப் பயன்படும் நிலத்தை, குறிக்கிறது. பெண்பால் ஒருமை பின்னொட்டு ஒவ்வொரு நகரத்தையும் சுட்டுவதால் ‘அதன்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: מֵיפַעַת
  choice: மேபாத்
  rationale: இது ஓர் இடப்பெயர்; எபிரெய வடிவத்துக்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְאֶת ... וְאֶת
  choice: …ஐயும் …ஐயும்
  rationale: இணைப்புச் சொல்லுடன் மீண்டும் வரும் நேரடிச் செயப்படுபொருள் குறியீடுகள் பட்டியலின் ஒவ்வொரு கூறையும் இணைக்கின்றன; தமிழில் ‘-ஐயும்’ அமைப்பு இதை இயல்பாக வெளிப்படுத்துகிறது. முந்தைய வசனத்திலிருந்து தொடரும் வினை தமிழில் தெளிவுக்காக ‘கொடுத்தார்கள்’ என நிறைவு செய்யப்பட்டுள்ளது.
theological_decisions: []
translation_notes:
  register: நவீன தரத் தமிழில், பட்டியல் நடையை இயல்பாக வைத்தும் மூலத்தின் மீளுருவாக்கத்தைப் பேணியும் மொழிபெயர்க்கப்பட்டுள்ளது. இவ்வசனம் எபிரெயில் முந்தைய வாக்கியத்தின் தொடர்ச்சியான துண்டாக இருப்பதால், தனித்து வாசிக்கத் தெளிவாக ‘கொடுத்தார்கள்’ சேர்க்கப்பட்டுள்ளது.
