  text: 'To Gershom: Libni his son, Jahath his son, Zimmah his son.'
translation:
  language: ta
  text: 'கேர்சோமின் வம்சத்தில்: அவனுடைய மகன் லிப்னி; அவனுடைய மகன் யாகாத்; அவனுடைய மகன் சிம்மா.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְגֵרְשׁוֹם
  choice: கெர்சோமின் வழியில்
  rationale: முன்னொட்டு לְ இங்கு கெர்சோமின் வழிவந்தோர் பட்டியலை அறிமுகப்படுத்துகிறது. தமிழில் இயல்பாகவும் மரபுவழிப் பட்டியலின் திசையைத் தெளிவாகவும் காட்ட இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: לִבְנִי
  choice: லிப்னி
  rationale: இது ஒரு நபரின் பெயர்; பொருள் மொழிபெயர்க்கப்படாமல் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: בְנוֹ
  choice: அவனுடைய மகன்
  rationale: ஆண்பால் ஒருமை உடைமைப் பின்னொட்டுடன் உள்ள בֵּן நேரடியான தந்தை–மகன் உறவைக் குறிக்கிறது; ஒவ்வொரு தலைமுறையிலும் எதைக் சுட்டுகிறது என்பது எபிரெய மூலத்தைப்போல தொடர்ச்சியால் அறியப்படுகிறது.
- source_word: יַחַת
  choice: யாகாத்
  rationale: இது ஒரு நபரின் பெயர்; எபிரெய உச்சரிப்பை அண்மித்து தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: זִמָּה
  choice: சிம்மா
  rationale: வேறு இடங்களில் தொடர்புடைய சொல் பொதுப்பெயர்ப் பொருள் கொண்டிருந்தாலும், இங்கு இது நபரின் பெயராகச் செயல்படுவதால் பொருள் மொழிபெயர்க்காமல் ஒலிபெயர்க்கப்பட்டது.
