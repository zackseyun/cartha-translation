  text: וַ/יִּהְי֨וּ מְשָׁרְתִ֜ים לִ/פְנֵ֨י מִשְׁכַּ֤ן אֹֽהֶל מוֹעֵד֙ בַּ/שִּׁ֔יר עַד בְּנ֧וֹת שְׁלֹמֹ֛ה אֶת בֵּ֥ית יְהוָ֖ה בִּ/ירוּשָׁלִָ֑ם וַ/יַּעַמְד֥וּ כְ/מִשְׁפָּטָ֖/ם עַל עֲבוֹדָתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/017.yaml
  text: They were ministering before the tabernacle[a], the tent of meeting, with song until Solomon built the house of Yahweh in Jerusalem[c][b], and they stood according to their ordinance over their service.
translation:
  language: ta
  text: சாலொமோன் எருசலேமில் யாவேயின் இல்லத்தைக்[a] கட்டும்வரை, அவர்கள் சந்திப்புக் கூடாரமாகிய திருவாசஸ்தலத்தின் முன்னிலையில் பாடலோடு ஊழியம் செய்துவந்தார்கள்; தங்கள் சேவையில் தங்களுக்கு விதிக்கப்பட்ட ஒழுங்கின்படி நிலைநின்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “யாவேயின் வீடு”; அதாவது ஆலயம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְשָׁרְתִים
  choice: பணிசெய்துவந்தார்கள்
  rationale: வழிபாட்டுக்குரிய தொடர்ச்சியான சேவையைச் சுட்டும் எபிரெயப் பெயரெச்ச வினையின் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: לִפְנֵי
  choice: முன்னிலையில்
  rationale: திருவாசஸ்தலத்தின் முன்பாகவும் அதன் சந்நிதியிலும் செய்யப்பட்ட பணியைக் குறிக்கும் இட/உறவுப் பொருளைப் பாதுகாக்கிறது.
- source_word: מִשְׁכַּן אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரமாகிய திருவாசஸ்தலம்
  rationale: இரு எபிரெயப் பெயர்களையும் ஒன்றாகக் கலக்காமல், இரண்டாவது பெயரை முதலாவதற்கான விளக்கப் பெயராக வைத்திருக்கிறது.
- source_word: בַּשִּׁיר
  choice: பாடலால்
  rationale: அவர்களுடைய சேவை பாடுவதன் மூலம் நடைபெற்றது என்ற கருவி/முறைப் பொருளைச் சுருக்கமாகத் தருகிறது.
- source_word: עַד בְּנוֹת שְׁלֹמֹה
  choice: சாலொமோன் ... கட்டும்வரை
  rationale: עַד உடன் வரும் infinitive construct குறிக்கும் கால எல்லையை இயல்பான தமிழ் வினைத்தொடராக அளிக்கிறது.
- source_word: בֵּית יְהוָה
  choice: யெகோவாவின் ஆலயம்
  rationale: இங்கு 'வீடு' என்பது எருசலேம் ஆலயத்தைக் குறிக்கிறது; நவீன தமிழில் தவறான புரிதலைத் தவிர்க்க 'ஆலயம்' என இயல்பாக மொழிபெயர்க்கப்படுகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் வடிவில் இறைப்பெயரைத் தலைப்பாக மாற்றாமல் தனிப்பெயராகப் பாதுகாக்கிறது.
- source_word: וַיַּעַמְדוּ
  choice: நிலைநின்றார்கள்
  rationale: வினையின் அடிப்படை 'நிற்றல்' பொருளையும் தங்களுக்கு ஒதுக்கப்பட்ட பணியில் நிலைகொண்டிருக்கும் செயல்பாட்டு நுணுக்கத்தையும் காக்கிறது.
- source_word: כְמִשְׁפָּטָם
  choice: தங்களுக்கு விதிக்கப்பட்ட முறைப்படி
  rationale: நீதித்தீர்ப்பை அல்ல, நிறுவப்பட்ட ஒழுங்கையோ விதிமுறையையோ இச்சூழலில் குறிக்கும் சொல்லைத் தெளிவாக வழங்குகிறது.
- source_word: עַל עֲבוֹדָתָם
  choice: தங்கள் பணியில்
  rationale: தங்களுக்கு உரிய சேவையுடன் தொடர்புடைய நியமிக்கப்பட்ட நிலையை இயல்பான தமிழில் காட்டுகிறது; செயற்கையான 'பணியின்மேல்' என்பதைத் தவிர்க்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழியாக்கம்
  choice: யெகோவா
  alternative: யாவே
  rationale: மூலத்தின் தனிப்பட்ட இறைப்பெயரை 'கர்த்தர்' போன்ற பட்டப்பெயரால் மாற்றாமல் பாதுகாக்கிறது; தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பு தேர்ந்தெடுக்கப்பட்டது.
- issue: בֵּית יְהוָה என்பதன் வெளிப்பாடு
  choice: யெகோவாவின் ஆலயம்
  alternative: யெகோவாவின் வீடு
  rationale: சூழலில் சாலொமோன் கட்டிய எருசலேம் ஆலயமே குறிப்பாக இருப்பதால், பொருளைத் தெளிவுபடுத்துகிறது; 'வீடு' என்ற உருவகத்தைப் பிரதான உரையில் வற்புறுத்தவில்லை.
translation_notes:
  register: நவீன தரநிலைத் தமிழ்; பொதுவாசகர்களுக்குத் தெளிவாகவும் வழிபாட்டு வரலாற்றுச் சூழலுக்கேற்ற கண்ணியமான நடையிலும் அமைக்கப்பட்டது. எபிரெய வாக்கியத்தின் இரு முதன்மைப் பகுதிகளும் அரைப்புள்ளியால் இணைக்கப்பட்டுள்ளன.
