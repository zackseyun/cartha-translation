translation:
  language: ta
  text: புக்கி அவனுடைய மகன்; உஸ்ஸி அவனுடைய மகன்; செரகியா அவனுடைய மகன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֻּקִּי
  choice: புக்கி
  rationale: தனிப்பட்ட பெயர் என்பதால் பொருள் மொழிபெயர்ப்பு செய்யாமல், எபிரெய ஒலிப்புக்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: בְנ/וֹ
  choice: அவனுடைய மகன்
  rationale: בֵּן என்பதுடன் மூன்றாம் நபர் ஆண்பால் ஒருமை உடைமைப் பின்னொட்டு சேர்ந்துள்ளதால், நேரடியாகவும் இயல்பாகவும் ‘அவனுடைய மகன்’ என மொழிபெயர்க்கப்பட்டது; மரபுப்பட்டியலின் தொடர்ச்சியான உறவுமுறையும் காக்கப்படுகிறது.
- source_word: עֻזִּי
  choice: ஊசி
  rationale: எபிரெய தனிப்பட்ட பெயரின் உச்சரிப்பை நவீனத் தமிழில் இயன்றவரை நெருக்கமாகக் காட்டும் ஒலிபெயர்ப்பு.
- source_word: זְרַחְיָה
  choice: செரகியா
  rationale: எபிரெய தனிப்பட்ட பெயரை அதன் மெய்யொலி அமைப்பிற்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்த்த வடிவம்.
