  text: לִ/בְנֵי֮ גֵּרְשׁוֹם֒ מִ/מִּשְׁפַּ֗חַת חֲצִי֙ מַטֵּ֣ה מְנַשֶּׁ֔ה אֶת גּוֹלָ֥ן בַּ/בָּשָׁ֖ן וְ/אֶת מִגְרָשֶׁ֑י/הָ וְ/אֶת עַשְׁתָּר֖וֹת וְ/אֶת מִגְרָשֶֽׁי/הָ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/056.yaml
  text: 'To the sons of Gershom[a], from the clan of the half-tribe of Manasseh: Golan in Bashan with its pasturelands, and Ashtaroth with its pasturelands.'
translation:
  language: ta
  text: 'கெர்ஷோமின் மக்களுக்கு, மனாசேயின் அரைக் கோத்திரத்தைச் சேர்ந்த குலத்திலிருந்து: பாசானிலுள்ள கோலானும் அதன் மேய்ச்சல் நிலங்களும்[a], அஸ்தரோத்தும் அதன் மேய்ச்சல் நிலங்களும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மேய்ச்சல் நிலங்கள்’ என்பதற்கு ‘பொது நிலங்கள்’ என்றும் மொழிபெயர்க்கலாம்; எபிரேயச் சொல் ஒரு நகரத்துக்குச் சொந்தமான, பெரும்பாலும் கால்நடை மேய்ப்பதற்குப் பயன்படுத்தப்பட்ட திறந்த நிலத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי גֵּרְשׁוֹם
  choice: கெர்சோமின் மக்களுக்கு
  rationale: לְ ஒதுக்கீட்டைப் பெறுபவர்களைக் குறிக்கிறது; בְּנֵי என்ற மரபுவழிச் சொல்லை இயல்பான தமிழில் ‘மக்கள்’ என வழங்குவது வம்சத்தாரையும் உள்ளடக்கக்கூடியதாக உள்ளது.
- source_word: מִמִּשְׁפַּחַת
  choice: குலத்திலிருந்து
  rationale: கோத்திரத்தின் உட்பிரிவைக் குறிக்கும் מִשְׁפָּחָה என்பதற்கு இச்சூழலில் ‘குலம்’ துல்லியமானது.
- source_word: חֲצִי מַטֵּה מְנַשֶּׁה
  choice: மனாசேயின் அரைக் கோத்திரம்
  rationale: மனாசே கோத்திரத்தின் பிரிக்கப்பட்ட நிலப்பகுதி சார்ந்த பாதியைக் குறிக்கும் மரபான, சுருக்கமான வடிவம்.
- source_word: אֶת גּוֹלָן בַּבָּשָׁן
  choice: பாசானிலுள்ள கோலான்
  rationale: கோலான் நகரம் பாசான் பிரதேசத்தில் அமைந்திருந்ததை நேரடியாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: מִגְרָשֶׁיהָ
  choice: அதைச் சுற்றியிருந்த மேய்ச்சல் நிலங்கள்
  rationale: லேவியர் நகரங்களைச் சுற்றியிருந்த, கால்நடை மேய்த்தல் உள்ளிட்ட பொதுப் பயன்பாடுகளுக்கான திறந்த நிலத்தைத் தெளிவாக உணர்த்துகிறது.
- source_word: עַשְׁתָּרוֹת
  choice: அஸ்தரோத்
  rationale: எபிரெய இடப்பெயரின் ஒலியமைப்பைத் தமிழில் நெருக்கமாகப் பெயர்த்தெழுதுகிறது.
- source_word: וְאֶת ... וְאֶת
  choice: …உம் …உம்
  rationale: ஒதுக்கப்பட்ட நகரங்களையும் அவற்றைச் சுற்றிய நிலங்களையும் ஒரே பட்டியலாக இணைக்கும் எபிரெய தொடரமைப்பை இயல்பான தமிழில் காக்கிறது.
