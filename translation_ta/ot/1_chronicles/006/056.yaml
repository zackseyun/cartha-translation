translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான வேதாகமப் பட்டியல் நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. மூல எபிரெயில் வினைச்சொல் இல்லாததால், முந்தைய சூழலைச் சார்ந்த பட்டியல் வாக்கியமாகவே வைக்கப்பட்டு, ‘கொடுத்தார்கள்’ போன்ற மறைமுக வினை சேர்க்கப்படவில்லை.
