revisions:
- from: 'கெர்சோமின் மக்களுக்கு, மனாசேயின் அரைக் கோத்திரத்துக் குலத்திலிருந்து: பாசானிலுள்ள கோலானும் அதைச் சுற்றியிருந்த மேய்ச்சல் நிலங்களும்[a], அஸ்தரோத்தும் அதைச் சுற்றியிருந்த மேய்ச்சல் நிலங்களும்.'
  to: 'கெர்ஷோமின் மக்களுக்கு, மனாசேயின் அரைக் கோத்திரத்தைச் சேர்ந்த குலத்திலிருந்து: பாசானிலுள்ள கோலானும் அதன் மேய்ச்சல் நிலங்களும்[a], அஸ்தரோத்தும் அதன் மேய்ச்சல் நிலங்களும்.'
  rationale: The revision preserves the verbless allotment-list form and every listed source element, while clarifying the clan’s relationship to Manasseh’s half-tribe, using a direct possessive form for the city lands, and making the Gershom transliteration more source-near. The single footnote anchor remains on the first occurrence, as in the audit trail.
