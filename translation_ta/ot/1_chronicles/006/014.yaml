  register: சுருக்கமான வம்சப்பட்டியல் அமைப்பும், ஒவ்வொரு தலைமுறையையும் இணைக்கும் மீளுரைப்பும் பாதுகாக்கப்பட்டுள்ளன. மொழிநடை நவீன, தெளிவான, கண்ணியமான தரத் தமிழில் அமைந்துள்ளது.
