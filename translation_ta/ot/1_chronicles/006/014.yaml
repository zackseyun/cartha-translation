base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/014.yaml
  text: 'The sons of Merari: Mahli[a], Libni his son, Shimei his son, Uzzah his son.'
translation:
  language: ta
  text: 'மெராரியின் மகன்கள்[a]: மக்லி; அவன் மகன் லிப்னி; அவன் மகன் சிமேயி; அவன் மகன் உஸ்ஸா.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: வம்சப்பட்டியல் நடையில், இதை விரிந்த பொருளில் ‘மெராரியின் வழித்தோன்றல்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: בֵּן என்பதன் பன்மை இணைப்புவடிவம் ஒரு வம்சப்பட்டியலை அறிமுகப்படுத்துகிறது. நேரடிப் பொருளான ‘மகன்கள்’ மூலத்தின் வடிவத்தைப் பாதுகாக்கிறது; வம்சப்பட்டியல் நடையில் இது ‘வழித்தோன்றல்கள்’ என்ற விரிந்த பொருளையும் கொள்ளலாம்.
- source_word: מְרָרִי
  choice: மெராரி
  rationale: தனிப்பட்ட பெயர்; நவீனத் தமிழில் இயல்பாக ஒலிபெயர்க்கப்பட்டது.
- source_word: מַחְלִי
  choice: மக்லி
  rationale: தனிப்பட்ட பெயர்; எபிரெய உச்சரிப்பை அணுகும் வகையில் ஒலிபெயர்க்கப்பட்டது.
- source_word: לִבְנִי
  choice: லிப்னி
  rationale: தனிப்பட்ட பெயர்; எபிரெய வடிவத்துக்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டது.
- source_word: בְנוֹ
  choice: அவன் மகன்
  rationale: மூன்றாம் நபர் ஆண்பால் ஒருமை உடைமைப் பின்னொட்டுடன் வரும் ‘மகன்’ என்ற உறவுமுறையைத் தெளிவாகக் காட்டுகிறது; மீளுரைப்புகள் வம்சத் தொடரை அசல் உரையைப் போலவே வெளிப்படுத்துகின்றன.
- source_word: שִׁמְעִי
  choice: சிமேயி
  rationale: தனிப்பட்ட பெயர்; எபிரெய பெயரின் ஒலியமைப்பைத் தமிழில் அணுகும் ஒலிபெயர்ப்பு.
- source_word: עֻזָּה
  choice: ஊசா
  rationale: தனிப்பட்ட பெயர்; வலியுறுத்தப்பட்ட z ஒலியைத் தமிழில் இரட்டிப்பிக்காமல், வாசிக்க இயல்பான மரபுவழித் தமிழ் வடிவம் பயன்படுத்தப்பட்டது.
