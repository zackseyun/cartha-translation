  source_fidelity: 'The genealogical sequence and the repeated filial relationship are preserved. However, «ஊசா» does not adequately represent עֻזָּה (Uzzah): it changes both the initial short vowel and the consonant. «உஸ்ஸா» is a closer, readable Tamil transliteration.'
