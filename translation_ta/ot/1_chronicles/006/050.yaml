translation_notes:
  register: நவீன நிலையான தமிழில், வேதாகமக் குலவழிச் சொல்லாட்சியைப் பாதுகாக்க ‘புத்திரர்’, ‘கோத்திரம்’ ஆகியவை பயன்படுத்தப்பட்டுள்ளன. நீண்ட எபிரெய வாக்கியத்தின் ஒழுங்கு இயன்றவரை காக்கப்பட்டாலும், அடுத்து வரும் பட்டியலைத் தெளிவாகச் சுட்ட ‘பின்வரும்’ சேர்க்கப்பட்டுள்ளது.
