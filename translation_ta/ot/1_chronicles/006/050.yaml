  text: וַ/יִּתְּנ֣וּ בַ/גּוֹרָ֗ל מִ/מַּטֵּ֤ה בְנֵי יְהוּדָה֙ וּ/מִ/מַּטֵּ֣ה בְנֵי שִׁמְע֔וֹן וּ/מִ/מַּטֵּ֖ה בְּנֵ֣י בִנְיָמִ֑ן אֵ֚ת הֶ/עָרִ֣ים הָ/אֵ֔לֶּה אֲשֶׁר יִקְרְא֥וּ אֶתְ/הֶ֖ם בְּ/שֵׁמֽוֹת־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/050.yaml
  text: They assigned by lot from the tribe of the sons of Judah[a], and from the tribe of the sons of Simeon, and from the tribe of the sons of Benjamin, these cities, which they called by name.
translation:
  language: ta
  text: யூதா புத்திரரின் கோத்திரத்திலிருந்தும், சிமியோன் புத்திரரின் கோத்திரத்திலிருந்தும், பென்யமீன் புத்திரரின் கோத்திரத்திலிருந்தும், அவர்கள் பெயரிட்டு அழைத்த இந்தப் பட்டணங்களைச் சீட்டுப்போட்டு ஒதுக்கினார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, பொருள்விளக்கமாக: “பெயர்வாரியாகப் பட்டியலிடப்பட்ட இந்தப் பட்டணங்கள்.” எபிரெயத்தில் சொல்லுக்குச் சொல் “அவர்கள் அவற்றைப் பெயர்களால் அழைத்தார்கள்” என்று உள்ளது; இது அடுத்து வரும் பெயர்ப் பட்டியலை அறிமுகப்படுத்தும் சொற்றொடர்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: ஒதுக்கிக் கொடுத்தார்கள்
  rationale: נתן என்பதன் அடிப்படைப் பொருளான ‘கொடுத்தார்கள்’ என்பதையும், லேவியருக்கான பட்டணப் பகிர்வுச் சூழலில் உள்ள நிர்வாக ஒதுக்கீட்டையும் இணைத்துப் பாதுகாக்கிறது.
- source_word: בַגּוֹרָל
  choice: சீட்டுப்போட்டு
  rationale: גורל குறிக்கும் சீட்டின் மூலம் தீர்மானிக்கும் முறையை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: מִמַּטֵּה
  choice: கோத்திரத்திலிருந்து
  rationale: இந்தக் குலப் பட்டியல் சூழலில் מַטֶּה என்பது ‘கோத்திரம்’ என்று பொருள்படுகிறது.
- source_word: בְנֵי יְהוּדָה / בְנֵי שִׁמְעוֹן / בְּנֵי בִנְיָמִן
  choice: யூதா புத்திரர் / சிமியோன் புத்திரர் / பென்யமீன் புத்திரர்
  rationale: ‘மகன்கள்/புத்திரர்கள்’ என்ற எபிரெய குலவழி மொழிநடையைத் தெளிவாகவும் ஒரே சீராகவும் பாதுகாக்கிறது.
- source_word: הֶעָרִים הָאֵלֶּה
  choice: பின்வரும் பட்டணங்கள்
  rationale: הָאֵלֶּה என்பதன் சுட்டுப்பொருளைத் தொடர்ந்து வரும் பெயர்ப்பட்டியலோடு இயல்பாக இணைக்கிறது; עָרִים என்பதற்கு இச்சூழலில் ‘பட்டணங்கள்’ பொருத்தமானது.
- source_word: אֲשֶׁר יִקְרְאוּ אֶתְהֶם בְּשֵׁמוֹת
  choice: பெயர்பெயராக அழைக்கப்பட்ட
  rationale: קרא என்ற ‘அழை/பெயரிடு’ வினையையும் בְּשֵׁמוֹת என்ற பன்மை வடிவத்தையும் பாதுகாக்கும் வகையில், அடுத்து தனித்தனிப் பெயர்களால் குறிப்பிடப்படும் பட்டணங்களைச் சுட்டுகிறது.
