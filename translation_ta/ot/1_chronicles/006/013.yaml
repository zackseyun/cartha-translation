  text: 'And the sons of Samuel: the firstborn[a], Vashni, and Abijah.'
translation:
  language: ta
  text: 'சாமுவேலின் மகன்கள்: முதற்பேறானவன்[a] வஷ்னி, அபியா.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில்: “வஷ்னி.” இந்தச் சொற்றொடரை “முதற்பேறானவன்; இரண்டாமவன் அபியா” என்றும் புரிந்துகொள்ளலாம். 1 சாமுவேல் 8:2 சாமுவேலின் மகன்களை யோவேல், அபியா என்று குறிப்பிடுகிறது.'
    reason: textual_variant
lexical_decisions:
- source_word: וּבְנֵי
  choice: மகன்கள்
  rationale: בְנֵי என்பது ஒரு நபரின் பெயருடன் இணைந்து வருவதால் ‘மகன்கள்’ என்று இயல்பாக மொழிபெயர்க்கப்பட்டது. வ வசனம் மரபுப்பட்டியல் தொடரில் இணைப்புச் சொல்லாக இருந்தாலும், தமிழில் வசனத் தொடக்கத்தில் அதைத் தனியாகச் சேர்க்காமல் விடுவது இயல்பான நடை.
- source_word: שְׁמוּאֵל
  choice: சாமுவேல்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்பட்ட பெயர்வடிவம் பயன்படுத்தப்பட்டது.
- source_word: הַבְּכֹר
  choice: முதற்பேறானவன்
  rationale: குடும்பத்தில் பிறப்பு வரிசையையும் மூத்த மகனின் நிலையையும் குறிக்கும் எபிரெயச் சொல்லைத் துல்லியமாக வெளிப்படுத்துகிறது.
- source_word: וַשְׁנִי
  choice: வஷ்னி
  rationale: மசோரா உயிர்க்குறிப்பீட்டின்படி இது இங்கு தனிப்பெயராகப் பாதுகாக்கப்பட்டது; ‘இரண்டாமவன்’ என்ற மாற்றுப் புரிதல் அடிக்குறிப்பில் தரப்பட்டது.
- source_word: וַאֲבִיָּה
  choice: அபியா
  rationale: இணைப்புச் சொல்லுடன் வந்த தனிப்பெயர், தமிழில் வழக்கமான வேதாகமப் பெயர்வடிவத்தில் தரப்பட்டது; பட்டியலின் இறுதியில் இயல்பான தமிழ் தொடரமைப்பு பயன்படுத்தப்பட்டது.
theological_decisions:
- issue: சாமுவேலின் மகன்களின் பெயர் மற்றும் பிறப்பு வரிசை குறித்த மரபுப்பட்டியல் சிக்கல்
  choice: மசோரா உரையின் ‘வஷ்னி’ என்ற வடிவத்தை முதன்மை உரையில் வைத்தல்
  alternative: இந்தச் சொற்றொடரை ‘முதற்பேறானவன்; இரண்டாமவன் அபியா’ என்று புரிந்துகொள்ளலாம்; அல்லது 1 சாமுவேல் 8:2-ஐ ஒட்டி முதற்பேறான யோவேலின் பெயரை ஊகித்துச் சேர்க்கலாம்.
  rationale: எபிரெய உரையின் பெற்ற வடிவத்தை ஒத்திசைவுக்காக மாற்றாமல் பாதுகாக்கிறது. அதேவேளை உண்மையான உரைசார் தெளிவின்மையை அடிக்குறிப்பில் வெளிப்படையாகக் குறிப்பிடுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் சுருக்கமான மரபுப்பட்டியல் நடையும் கண்ணியமான வேதாகமப் பதிவும் பேணப்பட்டுள்ளன. மூல எபிரெயத்தில் உள்ள சிக்கல் முதன்மை உரையில் தீர்த்துவைக்கப்படாமல், அடிக்குறிப்பில் தெளிவாகச் சுட்டப்பட்டுள்ளது.
