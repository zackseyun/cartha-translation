  text: and Hilen with its pasturelands[a], Debir with its pasturelands.
translation:
  language: ta
  text: கிலேன் நகரத்தையும் அதன் மேய்ச்சல் நிலங்களையும்[a], தெபீர் நகரத்தையும் அதன் மேய்ச்சல் நிலங்களையும் கொடுத்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கிலேன்’ என்ற இடப்பெயர் நாளாகமங்களிலுள்ள எபிரெய வடிவத்தைப் பிரதிபலிக்கிறது. இதற்கு இணையான யோசுவா 21:15 பட்டியலில் ‘ஓலோன்’ என்று உள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: חִילֵז
  choice: கிலேன்
  rationale: இது ஓர் இடப்பெயர். நாளாகமங்களின் எபிரெய வடிவத்தைத் தமிழில் ஒலிபெயர்த்துள்ளது; இறுதி மெய்யெழுத்து உரைச்சான்றில் நுனிநா நாசிக ஒலியாகப் படிக்கப்படுகிறது.
- source_word: מִגְרָשֶׁיהָ
  choice: அதன் மேய்ச்சல் நிலங்கள்
  rationale: லேவியர் நகரத்தைச் சுற்றி கால்நடைகளை மேய்ப்பதற்கும் பொதுப் பயன்பாட்டிற்கும் ஒதுக்கப்பட்ட திறந்த நிலத்தைக் குறிக்கிறது. இச்சூழலில் ‘மேய்ச்சல் நிலங்கள்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: דְּבִיר
  choice: தெபீர்
  rationale: இடப்பெயரை எபிரெய ஒலிக்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்த்துள்ளது.
- source_word: וְ/אֶת … אֶת
  choice: … நகரத்தையும் … நகரத்தையும்
  rationale: אֶת என்பது நேரடிச் செயப்படுபொருள் குறியீடு; தனியாக மொழிபெயர்க்கப்படவில்லை. தமிழ் பட்டியல் அமைப்பில் ‘-ஐயும்’ என்பதன் மூலம் அதன் தொடரியல் பணி இயல்பாக வெளிப்படுகிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், நில ஒதுக்கீட்டுப் பட்டியலுக்கேற்ற சுருக்கமான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. இவ்வசனம் முந்தைய வினையின் தொடர்ச்சியாக இருப்பதால், தமிழில் முழுமையான வாக்கியமாகத் தெளிவுபடுத்த ‘கொடுத்தார்கள்’ சேர்க்கப்பட்டுள்ளது; அது உடனடி இலக்கியச் சூழலிலிருந்து பெறப்படுகிறது. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
