source:
  edition: WLC
  text: וּ/מִ/מַּטֵּ֣ה יִשָׂשכָ֔ר אֶת קֶ֖דֶשׁ וְ/אֶת מִגְרָשֶׁ֑י/הָ אֶת דָּבְרַ֖ת וְ/אֶת מִגְרָשֶֽׁי/הָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/057.yaml
  text: 'And from the tribe of Issachar: Kedesh with its pasturelands[a], and Daberath with its pasturelands.'
translation:
  language: ta
  text: 'மேலும், இசக்கார் கோத்திரத்திலிருந்து: கேதேஸும் அதன் மேய்ச்சல் நிலங்களும், தாபெரத்தும் அதன் மேய்ச்சல் நிலங்களும்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מִ/מַּטֵּה
  choice: மேலும் இசக்கார் கோத்திரத்திலிருந்து
  rationale: מַטֶּה என்பது இந்த நிலப்பங்கீட்டுச் சூழலில் ‘கோத்திரம்’ என்பதைக் குறிக்கிறது. முன்னொட்டுகளான וּ மற்றும் מִ பட்டியலின் தொடர்ச்சியைச் சுட்டுவதால் ‘மேலும் ... கோத்திரத்திலிருந்து’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: יִשָׂשכָר
  choice: இசக்கார்
  rationale: தமிழில் நிலைபெற்றுள்ள கோத்திரப் பெயரின் வடிவம் பயன்படுத்தப்பட்டது.
- source_word: קֶדֶשׁ
  choice: கேதேஸ்
  rationale: இடப்பெயர் பொருளாக்கப்படாமல் எபிரெய ஒலிக்கு ஏற்றவாறு எழுத்துப்பெயர்க்கப்பட்டது; மூலத்தில் இல்லாத விளக்க அடைமொழி சேர்க்கப்படவில்லை.
- source_word: מִגְרָשֶׁיהָ
  choice: அதன் மேய்ச்சல் நிலங்கள்
  rationale: מִגְרָשׁ என்பது லேவியர் நகரங்களைச் சுற்றியிருந்த திறந்த பொதுநிலம் அல்லது கால்நடை மேய்ச்சலுக்குரிய நிலத்தைக் குறிக்கிறது. இச்சூழலில் ‘மேய்ச்சல் நிலங்கள்’ தெளிவான இயல்பான தமிழ்.
- source_word: דָּבְרַת
  choice: தாபெரத்
  rationale: இடப்பெயர் எபிரெய வடிவத்தை நெருக்கமாகப் பின்பற்றி எழுத்துப்பெயர்க்கப்பட்டது. மாற்று எழுத்துப்பெயர்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
theological_decisions: []
translation_notes:
  register: நவீன தரத் தமிழில், பட்டியலின் தொடர்ச்சியும் எபிரெய வாக்கிய அமைப்பின் நேர்முகப் பொருளும் காக்கப்பட்டுள்ளன. தமிழில் வாக்கியம் முழுமையடைய, முந்தைய வசனத்திலிருந்து தொடரும் ‘கொடுத்தார்கள்’ என்ற வினை சூழலின் அடிப்படையில் வெளிப்படையாக இடப்பட்டுள்ளது.
