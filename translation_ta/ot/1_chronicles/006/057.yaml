- from: 'மேலும் இசக்கார் கோத்திரத்திலிருந்து: கேதேஸையும் அதன் மேய்ச்சல் நிலங்களையும், தாபெரத்[a] நகரையும் அதன் மேய்ச்சல் நிலங்களையும் கொடுத்தார்கள்.'
