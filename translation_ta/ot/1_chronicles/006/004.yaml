source:
  edition: WLC
  text: בְּנֵ֥י מְרָרִ֖י מַחְלִ֣י וּ/מֻשִׁ֑י וְ/אֵ֛לֶּה מִשְׁפְּח֥וֹת הַ/לֵּוִ֖י לַ/אֲבוֹתֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/004.yaml
  text: 'The sons of Merari: Mahli and Mushi[b][a]. These were the clans of the Levites according to their fathers’ houses.'
translation:
  language: ta
  text: 'மெராரியின் மகன்கள்: மக்லியும் மூஷியும். இவர்களே, தங்கள் தந்தைவழிக் குடும்பங்களின்படி, லேவியரின் குலங்கள்[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “குலங்கள்” என்பதற்கு “வம்சக் குடும்பங்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי מְרָרִי
  choice: மெராரியின் மகன்கள்
  rationale: בן என்பதன் பன்மை இணைப்புநிலை மரபுவழிப் பட்டியலை அறிமுகப்படுத்துகிறது. இங்கு உடனடியாக இரு மகன்களின் பெயர்கள் வருவதால், விரிவான ‘வழித்தோன்றல்கள்’ என்பதற்குப் பதிலாக ‘மகன்கள்’ துல்லியமானது.
- source_word: מַחְלִי וּמֻשִׁי
  choice: மக்லி, மூசி
  rationale: எபிரெயப் பெயர்களின் ஒலியைத் தமிழில் இயன்றவரை அணுக்கமாக எழுத்துப்பெயர்த்துள்ளது; பட்டியலில் இயல்பான தமிழ் இணைப்புமுறைக்கேற்ப காற்புள்ளி பயன்படுத்தப்பட்டுள்ளது.
- source_word: וְאֵלֶּה
  choice: இவர்களே
  rationale: முன்னர் பெயரிடப்பட்ட நபர்களைச் சுட்டும் பன்மை வடிவம். וְ இணைப்பைத் தனியாக ‘மேலும்’ என்று மொழிபெயர்ப்பது தமிழில் தேவையற்ற இறுக்கத்தை உண்டாக்கும்; வலியுறுத்தும் ‘-ஏ’ சுருக்கக் கூற்றின் இயல்பைத் தருகிறது.
- source_word: מִשְׁפְּחוֹת
  choice: குலங்கள்
  rationale: வம்ச மற்றும் கோத்திர அமைப்புச் சூழலில், இது அணுக்கக் குடும்பத்தைவிட விரிவான உறவுக் குழுக்களைக் குறிக்கிறது. ஆகவே ‘குடும்பங்கள்’ என்பதைக் காட்டிலும் ‘குலங்கள்’ பொருத்தமானது.
- source_word: הַלֵּוִי
  choice: லேவியரின்
  rationale: வடிவத்தில் ஒருமை இனப்பெயராக இருந்தாலும், இங்கு லேவி வம்சத்தைச் சேர்ந்தோரைக் கூட்டாகக் குறிக்கிறது. நவீன தமிழில் ‘லேவியரின்’ என்பது அந்தக் கூட்டு மரபுச் சார்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לַאֲבוֹתֵיהֶם
  choice: தங்கள் தந்தைவழிக் குடும்பங்களின்படி
  rationale: சொல்லுக்கு நேர் பொருள் ‘அவர்களுடைய தந்தையரின்படி.’ மரபுவழிப் பட்டியல் சூழலில் இது தந்தைவழி மூதாதையர் குடும்பங்களின் அடிப்படையிலான வகைப்பாட்டைக் குறிக்கிறது; அந்த மறைபொருளைத் தமிழில் தெளிவாகவும் சுருக்கமாகவும் வெளிப்படுத்துகிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், வேதாகம மரபுப்பட்டியலுக்கேற்ற கண்ணியமான மற்றும் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘தந்தைவழிக் குடும்பங்கள்’ என்பது மூலத்தின் சுருக்கமான பண்பாட்டு மரபுச்சொல்லை இயல்பான தமிழில் விளக்குகிறது. முதன்மை உரையிலுள்ள [a] குறியீடு அடிக்குறிப்புடன் பொருந்துகிறது.
