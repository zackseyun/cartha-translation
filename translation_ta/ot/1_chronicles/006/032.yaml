translation_notes:
  register: நவீன நிலையான தமிழில், வம்சவரிசை உறவுகள் தெளிவாகத் தெரியுமாறு ஒவ்வொரு பெயருடனும் ‘மகன்’ என்ற உறவுச் சொல்லை வெளிப்படையாக மீளுரைத்துள்ளோம். மூலத்தின் சுருக்கமான, கண்ணியமான வம்சவரிசை நடையைப் பேணியுள்ளோம்.
