  text: மக்லியின் மகன், மூசியின் மகன், மெராரியின் மகன், லேவியின் மகன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן
  choice: மகன்
  rationale: எபிரெய வம்சவரிசைச் சூத்திரத்தில் மீண்டும் வரும் בֶּן என்பதன் இயல்பான நேரடிப் பொருள் ‘மகன்’. இங்கு தலைமுறைகள் விடுபட்டுள்ளன என்பதற்கான உடனடிச் சான்று இல்லாததால் ‘வழிவந்தவர்’ என்று பொதுமைப்படுத்தவில்லை.
- source_word: מַחְלִי
  choice: மக்லி
  rationale: தனிப்பெயர்; எபிரெய உச்சரிப்பை நவீனத் தமிழில் இயன்றவரை நெருக்கமாக ஒலிபெயர்த்துள்ளது.
- source_word: מוּשִׁי
  choice: மூசி
  rationale: தனிப்பெயர்; எபிரெய மெய்யொலி மற்றும் நீண்ட உயிரொலியைப் பிரதிபலிக்கும் தமிழ் ஒலிபெயர்ப்பு.
- source_word: מְרָרִי
  choice: மெராரி
  rationale: தனிப்பெயர்; எபிரெய வடிவத்துக்கு நெருக்கமான, வாசிக்க இயல்பான தமிழ் ஒலிபெயர்ப்பு.
- source_word: לֵוִי
  choice: லேவி
  rationale: தனிப்பெயர்; இங்கு கோத்திரத்தைப் பொதுவாகக் குறிக்காமல் முற்பிதாவாகிய லேவியைக் குறிக்கிறது.
