translation_notes:
  register: நவீன நிலையான தமிழில், வம்சப்பட்டியலுக்குரிய சுருக்கத்தையும் கண்ணியத்தையும் பேணும் நடை. இந்த வசனம் முந்தைய வசனத்தில் தொடங்கிய வம்சத்தொடரின் பகுதியாக இருப்பதால், மூலத்தில் உள்ளபடி தனித்த முழு வாக்கியமாக மாற்றப்படவில்லை.
