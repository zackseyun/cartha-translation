translation:
  language: ta
  text: சிப்பின் மகன், எல்கானாவின் மகன், மகாத்தின் மகன், அமாசாயின் மகன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן
  choice: மகன்; அவன் … மகன்
  rationale: வம்சவரிசையில் நேரடியான தந்தை–மகன் உறவைக் குறிக்கிறது. எபிரெய உரையின் தொடர் அமைப்பைப் பேணவும், தமிழில் ஒவ்வொருவருடைய உறவையும் தெளிவாக்கவும் முதல் இடத்தில் ‘மகன்’ என்றும் அடுத்தடுத்த இடங்களில் ‘அவன் … மகன்’ என்றும் வழங்கப்பட்டுள்ளது.
- source_word: ציף
  choice: சீப்
  rationale: இது ஒருவரின் இயற்பெயர்; எபிரெய உச்சரிப்புக்கு அண்மையாக ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: אֶלְקָנָה
  choice: எல்க்கானா
  rationale: இது ஒருவரின் இயற்பெயர்; எபிரெய மெய்யெழுத்து இரட்டிப்பையும் நீண்ட இறுதி உயிரையும் இயன்றவரை பிரதிபலிக்கும் வகையில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: מַחַת
  choice: மாகாத்
  rationale: இது ஒருவரின் இயற்பெயர்; எபிரெய பெயரின் ஒலிக்கு அண்மையாக ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: עֲמָשָׂי
  choice: அமாசாய்
  rationale: இது ஒருவரின் இயற்பெயர்; இறுதியிலுள்ள நீண்ட ஒலியையும் சேர்த்து எபிரெய வடிவுக்கு அண்மையாக ஒலிபெயர்க்கப்பட்டுள்ளது.
