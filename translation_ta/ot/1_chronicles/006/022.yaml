lexical_decisions:
- source_word: בֶּן
  choice: மகன்
  rationale: இந்த வம்சவரிசையில் בֶּן நேரடியான மகன் உறவைக் குறிக்கிறது. தலைமுறைகள் சில நேரங்களில் விடுபட்டிருக்கக்கூடும் என்ற பொதுவான சாத்தியம் இருந்தாலும், இவ்வசனத்தில் ‘மகன்’ என்பதே தெளிவான இயல்பான மொழிபெயர்ப்பு.
- source_word: תַּחַת
  choice: தகாத்
  rationale: எபிரேய தனிப்பெயரின் ஒலியை நவீனத் தமிழில் இயன்றவரை நெருக்கமாக எழுத்துப்பெயர்த்துள்ளது.
- source_word: אַסִּיר
  choice: அசீர்
  rationale: எபிரேய தனிப்பெயரின் எழுத்துப்பெயர்ப்பு; இரட்டிக்கப்பட்ட samekh மெய்யொலி தமிழில் இயல்பாக ‘ச’ மூலம் தரப்பட்டுள்ளது.
- source_word: אֶבְיָסָף
  choice: எபியாசாப்
  rationale: மசோரா உயிர்க்குறிகளுடனான எபிரேய வடிவத்தை நெருக்கமாகப் பிரதிபலிக்கும் தனிப்பெயர் எழுத்துப்பெயர்ப்பு.
- source_word: קֹרַח
  choice: கோராக்
  rationale: எபிரேய தனிப்பெயரை எழுத்துப்பெயர்த்து, இறுதி ח ஒலியைத் தோராயமாக ‘க்’ மூலம் பிரதிபலித்துள்ளது.
