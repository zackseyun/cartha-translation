  text: They gave them Hebron in the land of Judah[a], with its pasturelands around it.
translation:
  language: ta
  text: அவர்கள் யூதா நாட்டிலுள்ள எப்ரோனையும் அதைச் சுற்றியுள்ள மேய்ச்சல் நிலங்களையும்[a] அவர்களுக்குக் கொடுத்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நகரத்துக்குரிய பொதுநிலங்கள்.” எபிரெயச் சொல் ஒரு நகரத்துடன் இணைந்த திறந்தவெளி நிலத்தைக் குறிக்கிறது; அது பெரும்பாலும் கால்நடைகளை மேய்ப்பதற்குப் பயன்படுத்தப்பட்டது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: கொடுத்தார்கள்
  rationale: נתן என்பதன் Qal wayyiqtol வடிவம் தொடர்ச்சியான கடந்தகால நிகழ்வைக் குறிக்கிறது. தமிழில் இயல்பான வரலாற்று நடைக்காக இணைப்புச்சொல் வெளிப்படையாகச் சேர்க்கப்படவில்லை.
- source_word: לָהֶם
  choice: அவர்களுக்குக்
  rationale: ל முன்னொட்டு மறைமுகப் பொருளைக் குறிக்கிறது; தமிழில் நான்காம் வேற்றுமை உருபுடன் இயல்பாக மொழிபெயர்க்கப்பட்டது.
- source_word: חֶבְרוֹן
  choice: எப்ரோன்
  rationale: எபிரெய இடப்பெயரின் ஒலியை நவீனத் தமிழ் வேதாகமப் பெயரிடல் மரபுக்கு ஏற்றவாறு ஒலிபெயர்க்கிறது.
- source_word: בְּאֶרֶץ יְהוּדָה
  choice: யூதா நாட்டிலுள்ள
  rationale: אֶרֶץ என்பதன் ‘நாடு/நிலப்பகுதி’ என்ற புவியியல் பொருளைப் பாதுகாத்து, எப்ரோனை இயல்பாக வரையறுக்கும் தமிழ் தொடராக அமைக்கப்பட்டது.
- source_word: מִגְרָשֶׁיהָ
  choice: அதன் மேய்ச்சல் நிலங்களையும்
  rationale: מִגְרָשׁ என்பது நகரத்தோடு இணைந்த திறந்த வெளி நிலத்தைக் குறிக்கிறது; லேவியர் நகரச் சூழலில் அதன் பொதுவான பயன்பாட்டை ‘மேய்ச்சல் நிலங்கள்’ தெளிவாக எடுத்துரைக்கிறது.
- source_word: סְבִיבֹתֶיהָ
  choice: அதைச் சுற்றியிருந்த
  rationale: எப்ரோனைச் சுற்றி அந்த நிலங்கள் அமைந்திருந்த இடவியல் உறவை இயல்பான தமிழில் தெரிவிக்கிறது.
