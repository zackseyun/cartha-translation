  text: בֶּן יַ֥חַת בֶּן גֵּרְשֹׁ֖ם בֶּן לֵוִֽי־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/028.yaml
  text: son of Jahath[a], son of Gershom[b], son of Levi.
translation:
  language: ta
  text: யாகாத்தின் மகன்[a], கேர்சோமின் மகன்[b], லேவியின் மகன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: வம்சப் பட்டியல் நடையில் இதை விரிவாக, “யாகாத்தின் வழித்தோன்றல் … கேர்சோமின் வழித்தோன்றல் … லேவியின் வழித்தோன்றல்” என்றும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெய மூலத்தில் “கேர்சோம்” என்றே உள்ளது. வேறு வம்சப் பட்டியல் சூழல்களில் “கேர்சோன்” என்று எதிர்பார்க்கப்படலாம்; ஆனால் இங்கு மூலத்தில் உள்ள பெயர்வடிவம் வேறுபட்டது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן
  choice: மகன்
  rationale: வம்சப் பட்டியலில் בֶּן என்பதன் இயல்பான நேரடிப் பொருள் ‘மகன்’. சில வம்சப் பட்டியல்கள் தலைமுறைகளைத் தாண்டிச் செல்லக்கூடும் என்பதால் விரிவான ‘வழித்தோன்றல்’ என்ற பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: יַחַת
  choice: யாகாத்
  rationale: எபிரெயப் பெயரின் ஒலியமைப்பை நவீனத் தமிழில் இயல்பாகக் காட்டும் ஒலிபெயர்ப்பு.
- source_word: גֵּרְשֹׁם
  choice: கேர்சோம்
  rationale: மூலத்தில் உள்ள גֵּרְשֹׁם என்ற பெயர்வடிவத்தைப் பின்பற்றுகிறது; இதை வேறு இடங்களில் வரும் தொடர்புடைய ‘கேர்சோன்’ என்று மாற்றவில்லை.
- source_word: לֵוִי
  choice: லேவி
  rationale: எபிரெயப் பெயருக்கான தமிழில் பரவலாக அறியப்பட்ட வடிவம்.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில் சுருக்கமான வம்சப் பட்டியல் நடை காக்கப்பட்டுள்ளது. பெயர்கள் எபிரெய வடிவங்களுக்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டுள்ளன; பரவலாக அறியப்பட்ட ‘லேவி’ வடிவம் மட்டும் வழக்குப்படி வைக்கப்பட்டுள்ளது.
