  text: Ashan with its pasturelands[a], and Beth-shemesh with its pasturelands.
translation:
  language: ta
  text: ஆசானையும்[a] அதன் மேய்ச்சல் நிலங்களையும், பெத்-ஷெமேஷையும் அதன் மேய்ச்சல் நிலங்களையும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில இணையான சாட்சிகளும் மொழிபெயர்ப்புகளும் இங்கே ‘ஆயின்’ என்று குறிப்பிடுகின்றன; நாளாகமத்தின் மசோரா உரை ‘ஆசான்’ என்று வாசிக்கிறது.
    reason: textual_variant
lexical_decisions:
- source_word: עָשָׁן
  choice: ஆசான்
  rationale: இது ஓர் இடப்பெயர். நாளாகமத்தின் மசோரா எபிரெய உரையில் உள்ள வடிவத்தைத் தொடர்ந்து தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: מִגְרָשֶׁיהָ
  choice: அதன் மேய்ச்சல் நிலங்கள்
  rationale: லேவியர் நகரங்களுக்குச் சொந்தமான திறந்தவெளி அல்லது கால்நடை மேயும் நிலப்பகுதிகளை இச்சொல் குறிக்கிறது; நகரத்தைச் சுட்டும் ஒருமைப் பெண்பால் பின்னொட்டு தமிழில் இயல்பாக ‘அதன்’ என வழங்கப்பட்டுள்ளது.
- source_word: בֵּית שֶׁמֶשׁ
  choice: பெத்-சேமேஸ்
  rationale: இடப்பெயர் பொருளாக்கப்படாமல், எபிரெய உச்சரிப்பை அணுகும் வகையில் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְאֶת
  choice: -ஐயும் / மற்றும்
  rationale: וְ என்னும் இணைப்பும் אֶת என்னும் நேர்செயப்படுபொருள் குறியும் பட்டியல் அமைப்பை உருவாக்குகின்றன; தமிழில் அவை இயல்பாக ‘-ஐயும்’ என்ற இணைப்பு வேற்றுமை வடிவால் வெளிப்படுத்தப்பட்டுள்ளன.
