base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/061.yaml
  text: 'And from the tribe of Naphtali: Kedesh in Galilee with its pasturelands[a], Hammon with its pasturelands, and Kiriathaim with its pasturelands.'
translation:
  language: ta
  text: 'நப்தலி கோத்திரத்திலிருந்து: கலிலேயாவிலுள்ள கேதேஸையும் அதன் மேய்ச்சல் நிலங்களையும்[a], ஹம்மோனையும் அதன் மேய்ச்சல் நிலங்களையும், கீரியாத்தாயீமையும் அதன் மேய்ச்சல் நிலங்களையும் கொடுத்தார்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பொதுப் பயன்பாட்டு நிலங்கள்’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் ஒவ்வொரு நகரத்துக்கும் சொந்தமான சுற்றுப்புறத் திறந்த நிலத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִמַּטֵּה נַפְתָּלִי
  choice: நப்தலி கோத்திரத்திலிருந்து
  rationale: மַטֶּה என்பது இங்கு இஸ்ரயேலின் பழங்குடிப் பிரிவைக் குறிக்கும்; தமிழில் நிலப்பங்கீட்டுச் சூழலுக்கு இயல்பான ‘கோத்திரம்’ பயன்படுத்தப்பட்டது. தொடக்க வாவ், முந்தைய பட்டியலின் தொடர்ச்சியைக் காட்டுவதால் வாக்கிய அமைப்பில் இயல்பாகப் பிரதிபலிக்கப்பட்டுள்ளது.
- source_word: קֶדֶשׁ בַּגָּלִיל
  choice: கலிலேயாவிலுள்ள கேதேஸ்
  rationale: בַּגָּלִיל என்பது கேதேஸ் நகரத்தை அதன் பிராந்தியத்தால் வேறுபடுத்துகிறது; ‘கலிலேயாவிலுள்ள’ என்பது தமிழில் தெளிவான இயல்பான வடிவம்.
- source_word: מִגְרָשֶׁיהָ
  choice: அதன் மேய்ச்சல் நிலங்கள்
  rationale: מִגְרָשׁ என்பது லேவியர் நகரத்துக்குச் சொந்தமான சுற்றுப்புறத் திறந்த நிலத்தைக் குறிக்கிறது; அது கால்நடை மேய்ச்சலுக்குப் பயன்பட்டதால் ‘மேய்ச்சல் நிலங்கள்’ முதன்மை மொழிபெயர்ப்பாகத் தேர்ந்தெடுக்கப்பட்டது.
- source_word: חַמּוֹן
  choice: ஹம்மோன்
  rationale: எபிரெய மெய்யொலியை நெருக்கமாகப் பிரதிபலிக்கும் இடப்பெயர் ஒலிபெயர்ப்பு.
- source_word: קִרְיָתַיִם
  choice: கீரியாத்தாயீம்
  rationale: எபிரெய இடப்பெயரின் ஒலியமைப்பை வாசிக்கத்தக்க நவீன தமிழில் பிரதிபலிக்கும் ஒலிபெயர்ப்பு.
- source_word: אֶת ... וְאֶת
  choice: …ஐயும் …ஐயும்
  rationale: எபிரெயத்தில் ஒவ்வொரு நகரமும் அதனுடன் சேர்ந்த நிலமும் நேரடிச் செயப்படுபொருள்களாகப் பட்டியலிடப்படுகின்றன; தமிழில் இணைப்பும்மை மூலம் அந்தப் பட்டியல் அமைப்பு தக்கவைக்கப்பட்டது.
theological_decisions:
- issue: எபிரெய மூலத்தில் இவ்வசனத்துக்குள் வெளிப்படையான வினைச்சொல் இல்லாமை
  choice: முந்தைய சூழலிலிருந்து புரிந்துகொள்ளப்படும் ‘கொடுத்தார்கள்’ என்பதை வாக்கிய முடிவில் சேர்த்தல்
  alternative: 'வினையில்லாத பட்டியலாக ‘நப்தலி கோத்திரத்திலிருந்து: …’ என்று மட்டும் விடுதல்'
  rationale: இது முந்தைய வசனங்களில் தொடங்கிய நகரங்கள் வழங்கப்பட்ட பட்டியலின் தொடர்ச்சி. நவீன தமிழில் முழுமையான வாக்கியமாக வாசிக்க, சூழலில் மறைந்துள்ள வினை வெளிப்படுத்தப்பட்டது; யார் பெற்றார்கள் என்ற தகவல் இவ்வசனத்தில் புதிதாகச் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. இடப்பெயர்கள் எபிரெய ஒலியமைப்புக்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டுள்ளன. பட்டியல் தெளிவாக இருக்க இரட்டைப் புள்ளியும் இணைப்பும்மையும் பயன்படுத்தப்பட்டுள்ளன.
