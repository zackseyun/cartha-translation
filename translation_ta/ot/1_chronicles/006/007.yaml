  yaml_path: translation/ot/1_chronicles/006/007.yaml
  text: 'The sons of Kohath: Amminadab his son[a], Korah his son, Assir his son.'
translation:
  language: ta
  text: 'கேகாத்தின் மகன்கள்: அவனுடைய மகன் அம்மினதாப்[a], அவனுடைய மகன் கோராகு, அவனுடைய மகன் அசீர்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இணையான மரபுவழிப் பட்டியல்களில் இதற்குரிய மூதாதையின் பெயர் அம்மினதாப் என்பதற்குப் பதிலாக இஸ்ஹார் என்று வருகிறது; இங்குள்ள எபிரெய உரை அம்மினதாப் என்றே வாசிக்கிறது.
    reason: textual_variant
lexical_decisions:
- source_word: בְּנֵי קְהָת
  choice: கேகாத்தின் மகன்கள்
  rationale: எபிரெயக் கட்டுநிலைப் பன்மை வடிவத்தை நேரடியாகவும் இயல்பான தமிழ் மரபுவழிப் பட்டியல் நடையிலும் தருகிறது.
- source_word: עַמִּינָדָב
  choice: அம்மினதாப்
  rationale: மூல எபிரெய உரையில் உள்ள நபர்பெயரைத் தமிழில் ஒலிபெயர்க்கிறது; இணையான சில மரபுவழிப் பட்டியல்களுடன் ஒத்திசைக்க பெயரை மாற்றவில்லை.
- source_word: בְּנוֹ
  choice: அவனுடைய மகன்
  rationale: மூன்றாம் ஆண்பால் ஒருமை உடைமைப் பின்னொட்டுடன் வரும் 'மகன்' என்ற சொல்லை வெளிப்படையாகத் தருகிறது; மரபுவழிப் பட்டியலில் தலைமுறைகள் விடுபட்டிருக்கக்கூடும் என்ற சாத்தியத்தை முன்னிட்டு 'வழிவந்தவன்' என்று விரிவாக்கவில்லை.
- source_word: קֹרַח
  choice: கோராகு
  rationale: எபிரெய நபர்பெயரின் ஒலியை நவீனத் தமிழில் தெளிவாக ஒலிபெயர்க்கிறது.
- source_word: אַסִּיר
  choice: அசீர்
  rationale: இங்கு பொதுப்பொருளில் மொழிபெயர்க்க வேண்டிய சொல் அல்ல, நபர்பெயர் என்பதால் ஒலிபெயர்க்கப்பட்டுள்ளது.
