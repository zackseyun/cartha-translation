  text: וְֽ/אַהֲרֹ֨ן וּ/בָנָ֜י/ו מַקְטִירִ֨ים עַל מִזְבַּ֤ח הָֽ/עוֹלָה֙ וְ/עַל מִזְבַּ֣ח הַ/קְּטֹ֔רֶת לְ/כֹ֕ל מְלֶ֖אכֶת קֹ֣דֶשׁ הַ/קֳּדָשִׁ֑ים וּ/לְ/כַפֵּר֙ עַל יִשְׂרָאֵ֔ל כְּ/כֹל֙ אֲשֶׁ֣ר צִוָּ֔ה מֹשֶׁ֖ה עֶ֥בֶד הָ/אֱלֹהִֽים־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/034.yaml
  text: And Aaron and his sons were offering on the altar of burnt offering and on the altar of incense[a], for all the work of the Most Holy Place and to make atonement for Israel, according to all that Moses the servant of God had commanded.
translation:
  language: ta
  text: ஆரோனும் அவருடைய மகன்களும் தகனபலிப் பீடத்திலும் தூபப் பீடத்திலும் புகையெழச் செய்து வந்தார்கள். மகா பரிசுத்த இடத்தின்[a] எல்லாப் பணிகளுக்காகவும் இஸ்ரவேலுக்காகப் பாவநிவிர்த்தி செய்வதற்காகவும், கடவுளின் ஊழியரான மோசே கட்டளையிட்ட அனைத்தின்படியும் அவர்கள் செய்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மிகப் பரிசுத்தமானவை.” எபிரெயச் சொற்றொடர் சூழலுக்கேற்ப “மகா பரிசுத்த இடம்” அல்லது “மிகப் பரிசுத்தமானவை” எனப் பொருள்படலாம்.
    reason: கֹדֶשׁ הַקֳּדָשִׁים என்பதன் இடம்/பொருட்கள் சார்ந்த உண்மையான பொருள் இருமையைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: מַקְטִירִים
  choice: காணிக்கைகளை எரித்துப் புகையெழச் செய்துவந்தார்கள்
  rationale: கטר என்பதன் ஹிஃபில் வடிவம் பலிகளையோ தூபத்தையோ எரித்துப் புகையெழச் செய்வதைக் குறிக்கிறது. இரண்டு பீடங்களும் குறிப்பிடப்படுவதால், இரண்டுக்கும் பொருந்தும் விரிவான வழிபாட்டுச் செயலை இச்சொற்றொடர் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: מִזְבַּח הָעֹלָה
  choice: தகனபலிப் பீடம்
  rationale: עֹלָה பலிக்குரிய பீடத்தைத் தெளிவாகவும் வழிபாட்டுச் சூழலுக்கு ஏற்ற தமிழிலும் குறிக்கிறது.
- source_word: מִזְבַּח הַקְּטֹרֶת
  choice: தூபப் பீடம்
  rationale: தூபம் எரிக்கப்படும் பீடத்தைச் சுருக்கமாகவும் தெளிவாகவும் குறிக்கும் நிலையான தமிழ் வடிவம்.
- source_word: לְכֹל מְלֶאכֶת
  choice: எல்லாப் பணிகளையும் செய்து
  rationale: מְלָאכָה இங்கு பரிசுத்த இடத்தோடு தொடர்புடைய ஒப்படைக்கப்பட்ட பணியையோ சேவையையோ குறிக்கிறது; ‘பணிகள்’ என்பது தேவையற்ற விளக்கத்தைச் சேர்க்காமல் அதன் பரந்த பொருளைக் காக்கிறது.
- source_word: קֹדֶשׁ הַקֳּדָשִׁים
  choice: மகா பரிசுத்த இடம்
  rationale: இச்சொற்றொடர் உள்ளார்ந்த பரிசுத்த இடத்தையோ மிகப் பரிசுத்தமான பொருட்களையோ குறிக்கக்கூடும். முதன்மை உரையில் இடத்தைக் குறிக்கும் வாசிப்பு இயல்பானதாகத் தேர்ந்தெடுக்கப்பட்டு, மற்ற சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: וּלְכַפֵּר עַל יִשְׂרָאֵל
  choice: இஸ்ரவேலுக்காகப் பாவநிவிர்த்தி செய்வதற்காக
  rationale: כפר என்பதன் ஆசாரிய வழிபாட்டுப் பொருளைத் தக்கவைத்து, குறிப்பிட்ட ஒரு பாவநிவிர்த்திக் கோட்பாட்டை உரைக்குள் திணிக்காமல் பொதுவான பலிசார் பொருளை வழங்குகிறது.
- source_word: כְּכֹל אֲשֶׁר צִוָּה
  choice: கட்டளையிட்ட அனைத்தின்படியும்
  rationale: மோசேயின் கட்டளையின் முழு வரம்புக்கும் இணங்கச் செய்ததை இவ்வடிவம் வெளிப்படுத்துகிறது.
- source_word: עֶבֶד הָאֱלֹהִים
  choice: கடவுளின் ஊழியர்
  rationale: மோசேக்குரிய மரியாதையான பட்டத்தைத் தெளிவான நவீன தமிழில் வழங்குகிறது.
theological_decisions:
- issue: קֹדֶשׁ הַקֳּדָשִׁים என்பதன் குறிப்பு
  choice: மகா பரிசுத்த இடம்
  alternative: மிகப் பரிசுத்தமானவை
  rationale: ஆசாரியப் பணி, பீடங்கள், பாவநிவிர்த்தி ஆகிய உடனடிச் சூழலில் பரிசுத்த இடத்தைக் குறிக்கும் வாசிப்பு பொருத்தமானது. ஆயினும் எபிரெயச் சொற்றொடரின் பொருட்களைக் குறிக்கும் சாத்தியம் அடிக்குறிப்பில் வெளிப்படையாக வைக்கப்படுகிறது.
- issue: כפר என்பதன் இறையியல் பரப்பு
  choice: பாவநிவிர்த்தி செய்வது
  alternative: பரிகாரம் செய்வது
  rationale: பலிசார் உடன்படிக்கைச் சூழலைக் காக்கும் பரந்த வழிபாட்டுச் சொல்லாக இது பயன்படுத்தப்பட்டுள்ளது; பாவநிவிர்த்தி எவ்வாறு நிகழ்கிறது என்ற தனிப்பட்ட இறையியல் விளக்கம் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளக்கூடிய மரியாதைமிக்க வேதாகம நடையைப் பயன்படுத்துகிறது. வழிபாட்டுச் சொற்கள் தெளிவாக வைக்கப்பட்டுள்ளன; எபிரெய மொழியின் பொருள் இருமை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
