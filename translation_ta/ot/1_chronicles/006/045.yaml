  text: וּ/מִ/מַּטֵּ֣ה בִנְיָמִ֗ן אֶת גֶּ֤בַע וְ/אֶת מִגְרָשֶׁ֨י/הָ֙ וְ/אֶת עָלֶ֣מֶת וְ/אֶת מִגְרָשֶׁ֔י/הָ וְ/אֶת עֲנָת֖וֹת וְ/אֶת מִגְרָשֶׁ֑י/הָ כָּל עָרֵי/הֶ֛ם שְׁלֹשׁ עֶשְׂרֵ֥ה עִ֖יר בְּ/מִשְׁפְּחוֹתֵי/הֶֽם־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/045.yaml
  text: 'and from the tribe of Benjamin: Geba with its pasturelands[a], Alemeth with its pasturelands, and Anathoth with its pasturelands—all their cities were thirteen cities according to their families.'
translation:
  language: ta
  text: 'பென்யமீன் கோத்திரத்திலிருந்து: கேபாவையும் அதன் மேய்ச்சல் நிலங்களையும், அலேமேத்தையும்[a] அதன் மேய்ச்சல் நிலங்களையும், ஆனதோத்தையும் அதன் மேய்ச்சல் நிலங்களையும்—அவர்களுடைய எல்லா நகரங்களும், அவர்களுடைய குடும்பங்களின்படி, பதின்மூன்று நகரங்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய உரையில் ‘அலேமேத்’; யோசுவா 21:18-இல் உள்ள இணைப் பட்டியலில் ‘அல்மோன்’ என்று உள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִמַּטֵּה בִנְיָמִן
  choice: பென்யமீன் கோத்திரத்திலிருந்து
  rationale: מַטֶּה இங்கு கோத்திரப் பிரிவைக் குறிக்கிறது; முன் வசனத்தின் பட்டியலைத் தொடரும் מִן முன்னொட்டு ‘-இலிருந்து’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: גֶּבַע
  choice: கேபா
  rationale: இடப்பெயர் என்பதால் அதன் எபிரெய வடிவத்துக்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டது.
- source_word: מִגְרָשֶׁיהָ
  choice: அதன் மேய்ச்சல் நிலங்கள்
  rationale: நகரைச் சூழ்ந்த பொதுவெளி அல்லது கால்நடை மேய்ச்சலுக்குரிய நிலத்தை מִגְרָשׁ குறிக்கிறது; இச்சூழலில் ‘மேய்ச்சல் நிலங்கள்’ தெளிவாக உள்ளது.
- source_word: עָלֶמֶת
  choice: அலேமேத்
  rationale: இவ்வசனத்தின் மசோரா உரையிலுள்ள இடப்பெயர் வடிவமே பிரதான உரையில் ஒலிபெயர்க்கப்பட்டது; யோசுவா 21:18-இன் இணைப் பட்டியலிலுள்ள வேறு வடிவம் அடிக்குறிப்பில் தரப்பட்டது.
- source_word: עֲנָתוֹת
  choice: ஆனதோத்
  rationale: எபிரெய இடப்பெயருக்கு நெருக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: כָּל עָרֵיהֶם
  choice: அவர்களுடைய நகரங்கள் அனைத்தும்
  rationale: பட்டியலின் முடிவிலுள்ள தொகுப்புக் கூற்றை இயல்பான தமிழில், எபிரெய பன்மை உடைமைச் சுட்டைத் தக்கவைத்து மொழிபெயர்க்கிறது.
- source_word: שְׁלֹשׁ עֶשְׂרֵה עִיר
  choice: பதின்மூன்று நகரங்கள்
  rationale: எண்ணுக்குப் பின் எபிரெயத்தில் ஒருமை பெயர்ச்சொல் வந்தாலும், தமிழில் இயல்பாகப் பன்மையில் வழங்கப்படுகிறது.
- source_word: בְּמִשְׁפְּחוֹתֵיהֶם
  choice: அவர்களுடைய குடும்பங்களின்படி
  rationale: מִשְׁפָּחוֹת என்பது விரிந்த குடும்பங்கள் அல்லது குலக் குழுக்களைக் குறிக்கலாம்; மூலத்தின் பொருள் அகலத்தை ‘குடும்பங்களின்படி’ தக்கவைக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், பட்டியல் நடையைத் தக்கவைக்கும் கண்ணியமான மற்றும் எளிதில் புரியும் மொழிநடை. வசனம் முந்தைய வாக்கியத்தைத் தொடருவதால், தமிழில் முழுமையான வாக்கியமாக அமைய ‘கொடுத்தார்கள்’ சூழலிலிருந்து நிரப்பப்பட்டுள்ளது; பெயர்களின் ஒலிபெயர்ப்பு எபிரெய வடிவங்களை முன்னிறுத்துகிறது.
