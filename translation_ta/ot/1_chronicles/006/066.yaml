base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/066.yaml
  text: and Heshbon with its pasturelands[a], and Jazer with its pasturelands.
translation:
  language: ta
  text: எஸ்போனையும் அதன் மேய்ச்சல் நிலங்களையும்[a], யாசேரையும் அதன் மேய்ச்சல் நிலங்களையும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அதன் பொதுநிலங்களையும்’ அல்லது ‘அதைச் சுற்றியுள்ள திறந்தவெளி நிலங்களையும்.’ நகரத்துக்குச் சொந்தமான திறந்தவெளி நிலத்தை எபிரெயச் சொல் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶשְׁבּוֹן
  choice: எஸ்போன்
  rationale: இது ஓர் இடப்பெயர்; எபிரெய உச்சரிப்பை அணுகும் வகையில் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: מִגְרָשֶׁיהָ
  choice: அதன் மேய்ச்சல் நிலங்கள்
  rationale: லேவியருக்குரிய நகரங்களின் சூழலில், நகரத்துக்குச் சொந்தமான திறந்தவெளி அல்லது கால்நடை மேய்க்கும் நிலத்தை இச்சொல் குறிக்கிறது. பெண்பால் ஒருமை உடைமை விகுதி ஒவ்வொரு நகரத்தையும் சுட்டும் ‘அதன்’ என்று தரப்பட்டது.
- source_word: יַעְזֵיר
  choice: யாசேர்
  rationale: இது ஓர் இடப்பெயர்; எபிரெயப் பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: וְאֶת
  choice: -ஐயும்
  rationale: மீண்டும் வரும் இணைப்புச் சொல்லும் நேர்ச்செயப்படுபொருள் குறியும், தமிழில் பட்டியல் அமைப்புக்கு இயல்பான ‘-ஐயும்’ என்ற வடிவில் வெளிப்படுத்தப்பட்டன.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், பட்டியலின் தொடர்ச்சியைத் தக்கவைக்கும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வசனம் முந்தைய வாக்கியத்தின் தொடராக இருப்பதால், தமிழில் முழுமையான வாசிப்புக்காக ‘கொடுத்தார்கள்’ சேர்க்கப்பட்டுள்ளது.
