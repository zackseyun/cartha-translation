source:
  edition: WLC
  text: וּ/מִ֨/מַּטֵּה גָ֔ד אֶת רָאמ֥וֹת בַּ/גִּלְעָ֖ד וְ/אֶת מִגְרָשֶׁ֑י/הָ וְ/אֶֽת מַחֲנַ֖יִם וְ/אֶת מִגְרָשֶֽׁי/הָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/065.yaml
  text: 'And from the tribe of Gad: Ramoth in Gilead with its pasturelands[a], and Mahanaim with its pasturelands.'
translation:
  language: ta
  text: காத் கோத்திரத்திலிருந்து, கீலேயாத்திலுள்ள ராமோத்தையும் அதன் மேய்ச்சல் நிலங்களையும், மகனாயீமையும் அதன் மேய்ச்சல் நிலங்களையும் கொடுத்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִמַּטֵּה
  choice: கோத்திரத்திலிருந்து
  rationale: மַטֶּה என்பது இங்கு இஸ்ரவேலின் கோத்திரத்தைக் குறிக்கிறது. வாவ் இணைப்பின் தொடர்ச்சி, தமிழில் பட்டியல் அமைப்பாலும் இறுதி வினையாலும் இயல்பாக வெளிப்படுகிறது.
- source_word: גָד
  choice: காத்
  rationale: கோத்திரப் பெயர்; எபிரெய உச்சரிப்பை அணுகிய தமிழ் ஒலிபெயர்ப்பு.
- source_word: רָאמוֹת בַּגִּלְעָד
  choice: கீலேயாத்திலுள்ள ராமோத்
  rationale: בְּ முன்னிடைச்சொல்லின் இடப்பொருளைத் தெளிவாகப் பாதுகாக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: מִגְרָשֶׁיהָ
  choice: அதன் மேய்ச்சல் நிலங்கள்
  rationale: லேவியர் நகரங்களைச் சூழ்ந்து கால்நடைகளுக்குப் பயன்பட்ட திறந்த நிலங்களை இச்சொல் குறிக்கிறது; 'மேய்ச்சல் நிலங்கள்' சூழலுக்கு தெளிவான சமமான சொல்.
- source_word: מַחֲנַיִם
  choice: மகனாயீம்
  rationale: இடப்பெயர்; எபிரெய இரட்டை வடிவத்தின் ஒலியை இயன்றவரை பேணும் தமிழ் ஒலிபெயர்ப்பு.
- source_word: וְאֶת
  choice: -ஐயும்
  rationale: மீண்டும் வரும் இணைப்பும் நேர்செயப்படுபொருள் குறியும் தமிழில் இணைப்புச் சாரியை உடைய வேற்றுமை உருபால் இயல்பாக வெளிப்படுகின்றன.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் எளிய புரிதலும் கொண்ட நடையில் மொழிபெயர்க்கப்பட்டது. இவ்வசனம் முந்தைய வசனத்தின் வினையைத் தொடர்வதால், தனித்த வசனமாகவும் தெளிவாக இருக்க 'கொடுத்தார்கள்' சேர்க்கப்பட்டுள்ளது; அது எபிரெய உரையின் சூழலிலிருந்து நிரப்பப்பட்ட வினை.
