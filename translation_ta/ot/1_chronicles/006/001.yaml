id: 1CH.6.1
reference: 1 Chronicles 6:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: בְּנֵ֖י לֵוִ֑י גֵּרְשֹׁ֕ם קְהָ֖ת וּ/מְרָרִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/001.yaml
  text: 'The sons of Levi: Gershom[a], Kohath[b], and Merari.'
translation:
  language: ta
  text: 'லேவியின் மகன்கள்[a]: கேர்ஷோம்[b], கோகாத், மற்றும் மெராரி.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய வம்சவரலாற்று மொழிநடையில் ‘மகன்கள்’ என்பது நேரடி மகன்களையோ, சில சூழல்களில் பரந்த பொருளில் வழித்தோன்றல்களையோ குறிக்கலாம். இங்கு சூழல் லேவியின் நேரடி மகன்களைக் குறிக்கிறது.
    reason: cultural_note
  - marker: b
    text: எபிரெய உரையில் ‘கேர்ஷோம்’ என்று உள்ளது; தொடர்புடைய சில பகுதிகளிலும் மொழிபெயர்ப்பு மரபுகளிலும் இப்பெயர் ‘கேர்சோன்’ என்ற மாற்று வடிவத்தில் காணப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי לֵוִי
  choice: லேவியின் மகன்கள்
  rationale: בְּנֵי என்பது בֵּן (‘மகன்’) என்பதன் பன்மை இணைப்பு வடிவம். வம்சவரலாற்றுச் சூழல்களில் இது சில நேரங்களில் பரந்த பொருளில் வழித்தோன்றல்களைக் குறிக்கலாம்; ஆனால் இங்கு லேவியின் நேரடி மகன்களே பட்டியலிடப்படுவதால் ‘மகன்கள்’ என்பது துல்லியமும் இயல்பும் உடைய மொழிபெயர்ப்பு.
- source_word: גֵּרְשֹׁם
  choice: கேர்சோம்
  rationale: எபிரெய மூலத்தில் உள்ள தனிப்பெயரின் ஒலியமைப்பைத் தமிழில் இயன்றவரை தெளிவாக எழுத்துப்பெயர்த்துள்ளது. இவ்வசனத்தின் மசோரா உரை இறுதியில் ם (ம்) கொண்ட ‘கேர்சோம்’ வடிவத்தையே ஆதரிக்கிறது.
- source_word: קְהָת
  choice: கோகாத்
  rationale: எபிரெய தனிப்பெயருக்கான தமிழில் பரவலாக அறியத்தக்க எழுத்துப்பெயர்ப்பு.
- source_word: וּמְרָרִי
  choice: மெராரி
  rationale: וּ (‘மற்றும்’) என்பது பட்டியலின் இறுதி இணைப்பாகத் தமிழில் காற்புள்ளியுடன் இயல்பாக உணரப்படுவதால், பெயர் ‘மெராரி’ என்று எழுத்துப்பெயர்க்கப்பட்டது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில் சுருக்கமான வம்சவரலாற்றுப் பட்டியல் வடிவம் காக்கப்பட்டுள்ளது. தனிப்பெயர்கள் எபிரெய ஒலிவடிவத்தை நெருக்கமாகப் பின்பற்றி, தமிழில் எளிதாக வாசிக்கத்தக்க வகையில் வழங்கப்பட்டுள்ளன. அடிக்குறிப்பு [a] ‘மகன்கள்’ என்பதற்குப் பின்னும், [b] ‘கேர்சோம்’ என்பதற்குப் பின்னும் பொருளுக்கேற்ற இடங்களில் வைக்கப்பட்டுள்ளன.
