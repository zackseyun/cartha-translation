  rationale: The revision preserves the source order and genealogical sense, explicitly renders the final conjunction, and adjusts Gershom’s Tamil transliteration to reflect the Hebrew shin (שׁ). Footnote anchors remain attached to the same relevant words, and the footnote content retains the English audit trail’s limited lexical and genealogical clarification.
