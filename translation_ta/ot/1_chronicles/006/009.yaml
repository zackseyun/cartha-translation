  yaml_path: translation/ot/1_chronicles/006/009.yaml
  text: Tahath his son[a], Uriel his son, Uzziah his son, and Shaul his son.
translation:
  language: ta
  text: அவனுடைய மகன் தகாத்; அவனுடைய மகன் ஊரியேல்; அவனுடைய மகன் உஸ்ஸியா; மற்றும் அவனுடைய மகன் ஷாவூல்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ஷாவூல் என்பது தமிழில் பொதுவாக ‘சவுல்’ என்றும் வழங்கப்படும் எபிரெயப் பெயர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת
  choice: தகாத்
  rationale: வம்சப்பட்டியலில் வரும் தனிப்பட்ட பெயர்; எபிரெய ஒலிப்புக்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: בְּנוֹ
  choice: அவனுடைய மகன்
  rationale: בֵּן என்பது வம்சப்பட்டியல்களில் சில நேரம் பொதுவாக ‘வழித்தோன்றல்’ என்பதைக் குறிக்கக்கூடியது; இருப்பினும் இங்கு எபிரெய மொழியின் வழக்கமான வம்சப்பட்டியல் சூத்திரத்தைப் பாதுகாக்க ‘மகன்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: אוּרִיאֵל
  choice: ஊரியேல்
  rationale: எபிரெய தனிப்பட்ட பெயரின் ஒலிப்பை இயல்பான தமிழ் எழுத்துமுறையில் பிரதிபலிக்கும் ஒலிபெயர்ப்பு.
- source_word: עֻזִּיָּה
  choice: உஸ்ஸியா
  rationale: எபிரெய பெயரிலுள்ள வலுப்படுத்தப்பட்ட மெய்யொலியை ‘ஸ்ஸ’ மூலம் பிரதிபலிக்கும் தமிழ் ஒலிபெயர்ப்பு.
- source_word: וְשָׁאוּל
  choice: அவனுடைய மகன் ஷாவூல்
  rationale: וְ என்ற இணைப்பின் பட்டியல் செயல்பாடு தமிழின் இறுதித் தொடரில் இயல்பாக வெளிப்படுகிறது; שָׁאוּל என்ற பெயர் எபிரெய ஒலிப்புக்கு நெருக்கமாக ‘ஷாவூல்’ என ஒலிபெயர்க்கப்பட்டது. மீண்டும் வரும் בְּנוֹ சொற்றொடரும் தமிழில் வெளிப்படையாக வைக்கப்பட்டது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், வம்சப்பட்டியலுக்கேற்ற சுருக்கமானவும் கண்ணியமானவும் உள்ள நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயத்தில் ஒவ்வொரு பெயருக்குப் பின்னும் வரும் ‘அவனுடைய மகன்’ என்ற உறவுமுறை தமிழில் பெயருக்கு முன் இயல்பாக அமைக்கப்பட்டுள்ளது; முதல் ‘அவன்’ என்பதன் முன்னிலை முந்தைய வசனத்தில் உள்ளது.
