base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/002.yaml
  text: And David knew that Yahweh had established him as king over Israel[b][a], for his kingdom had been greatly exalted for the sake of his people Israel.
translation:
  language: ta
  text: தாவீது, யெகோவா தன்னை இஸ்ரவேலின்மேல் அரசனாக நிலைநிறுத்தியிருந்தார் என்பதை அறிந்துகொண்டான். ஏனெனில், அவருடைய மக்களாகிய இஸ்ரவேலுக்காக அவனுடைய அரசாட்சி மிகவும் உயர்த்தப்பட்டிருந்தது.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவனுடைய அரசாட்சி உயரத்திற்கு உயர்த்தப்பட்டிருந்தது” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “அவருடைய மக்கள்” என்பது யெகோவாவின் மக்களாகிய இஸ்ரவேலைக் குறிக்கிறது; சிலர் இதைத் தாவீதின் மக்கள் என்று புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּדַע
  choice: அறிந்துகொண்டான்
  rationale: ידע என்பதன் கால் வடிவம் ‘அறிந்தான்’ அல்லது ‘அறிந்துகொண்டான்’ எனப் பொருள்படும்; இங்கு நிகழ்வுகளின் மூலம் தாவீது உணர்ந்து அறிந்ததை இயல்பாகக் காட்டுகிறது.
- source_word: הֱכִינוֹ
  choice: தன்னை ... நிலைநிறுத்தியிருக்கிறார்
  rationale: כון என்பதன் ஹிப்இல் வடிவம் உறுதிப்படுத்துதல் அல்லது நிலைநிறுத்துதல் என்னும் பொருளைத் தருகிறது; அரச பதவியில் தாவீதை உறுதியாக நிறுவியதை இச்சொல் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: எபிரெயத் தெய்வீகப் பெயரான יהוה-ஐ ஒரு பட்டப்பெயராக மாற்றாமல், தமிழில் பரவலாக அறியப்படும் பெயர்வடிவில் தருகிறது.
- source_word: לְמֶלֶךְ עַל יִשְׂרָאֵל
  choice: இஸ்ரவேலின்மேல் அரசனாக
  rationale: לְ நியமிக்கப்பட்ட நிலையைச் சுட்டுகிறது; עַל ஆட்சியதிகாரத்தைக் குறிக்கிறது.
- source_word: נִשֵּׂאת לְמַעְלָה
  choice: மிகவும் உயர்த்தியிருந்தார்
  rationale: சொற்றொடர் உயர்ந்த நிலைக்குக் கொண்டுசெல்லப்பட்டதைச் சுட்டுகிறது; தமிழ் நடையில் செயப்பாட்டு வடிவத்தைவிட, சூழலில் மறைமுகமாக உள்ள யெகோவாவைச் செய்பவராகக் குறிப்பிடுவது இயல்பாக உள்ளது.
- source_word: מַלְכוּתוֹ
  choice: தனது அரசாட்சியை
  rationale: מַלְכוּת என்பது ராஜ்யம், அரசுரிமை அல்லது ஆட்சி எனப் பொருள்படலாம்; இங்கு தாவீதின் அரச அதிகாரமும் ஆட்சிநிலையும் உயர்த்தப்பட்டதைக் குறிக்க ‘அரசாட்சி’ பொருத்தமானது.
- source_word: בַּעֲבוּר
  choice: -க்காக
  rationale: இந்தச் சொல் நோக்கம் அல்லது நன்மையைச் சுட்டுகிறது; தாவீதின் உயர்வு இஸ்ரவேலின் நலனுக்காக இருந்ததைத் தெரிவிக்கிறது.
- source_word: עַמּוֹ יִשְׂרָאֵל
  choice: அவருடைய மக்களாகிய இஸ்ரவேல்
  rationale: உடைமைப் பின்னொட்டின் சுட்டுப்பொருளைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது; அதேவேளையில் மாற்று இலக்கணச் சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: עַמּוֹ (‘அவருடைய மக்கள்’) என்பதிலுள்ள உடைமைச் சுட்டின் குறிப்பு
  choice: ‘அவருடைய’ என்பது யெகோவாவைக் குறிக்கிறது
  alternative: அது தாவீதைக் குறிக்கலாம்
  rationale: இஸ்ரவேல் யெகோவாவின் மக்களாக இருப்பதால் அவர்களுடைய நன்மைக்காகத் தாவீதின் அரசாட்சி உயர்த்தப்பட்டது என்பது நாளாகமத்தின் சூழலுக்கு ஏற்றது; எனினும் எபிரெய இலக்கணம் தாவீதைக் குறிக்கும் வாசிப்பையும் முற்றிலும் விலக்கவில்லை.
- issue: இரண்டாவது כִּי என்பதன் தொடர்பு
  choice: 'காரணவியல்: ‘ஏனெனில்’'
  alternative: 'விளக்கவியல்: ‘என்று/அதாவது’'
  rationale: அரசாட்சி உயர்த்தப்பட்டிருப்பது, யெகோவா தன்னை அரசனாக நிலைநிறுத்தியதைத் தாவீது அறிந்துகொண்டதற்கான காரணமாக இங்கு அமைகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கண்ணியமானதும் பொதுவாசகர்களுக்குப் புரியக்கூடியதுமான நடை. எபிரெய மூலத்தின் காரணத் தொடர்பும், உடைமைச் சுட்டிலுள்ள உண்மையான தெளிவின்மையும் பாதுகாக்கப்பட்டுள்ளன.
