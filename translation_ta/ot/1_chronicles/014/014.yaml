translation_notes:
  register: நவீன நிலையான தமிழில், கதைநடைக்கேற்ற எளிய ஆனால் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கடவுளைக் குறிக்கும் வினைமுற்றில் மரியாதைப் பன்மை பயன்படுத்தப்பட்டாலும், தாவீதைக் குறிக்கும் கதைநடையில் இயல்பான ஒருமை காக்கப்பட்டுள்ளது. தாவரவியல் அடையாளத்தின் உண்மையான நிச்சயமின்மை அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
