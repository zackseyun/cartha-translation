base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/014.yaml
  text: So David inquired of God again[a], and God said to him, “You shall not go up after them. Circle around from behind them, and come against them opposite the balsam trees.”
translation:
  language: ta
  text: தாவீது மீண்டும் கடவுளிடம் விசாரித்தான். கடவுள் அவனிடம், “நீ அவர்களைப் பின்தொடர்ந்து முன்னேறாதே. அவர்களிடமிருந்து விலகிச் சுற்றிப்போய், பக்கா மரங்களுக்கு[a] எதிரே அவர்களை அணுகு” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் “பக்கா மரங்கள்”; இவை எந்த வகை மரங்கள் என்பது உறுதியாகத் தெரியவில்லை. சில மொழிபெயர்ப்புகள் “தைலமரங்கள்” என்றும், பாரம்பரியமாகச் சில மொழிபெயர்ப்புகள் “மல்பெரி மரங்கள்” என்றும் குறிப்பிடுகின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁאַל עוֹד דָּוִיד בֵּאלֹהִים
  choice: தாவீது மீண்டும் கடவுளிடம் விசாரித்தான்
  rationale: שׁאל + בְּ இங்கு தெய்வீக வழிநடத்தலை நாடிக் கேட்பதைக் குறிக்கிறது. ‘விசாரித்தான்’ என்பது சாதாரணமாகக் ‘கேட்டான்’ என்பதைக் காட்டிலும் இந்த ஆலோசனை நாடும் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது; עוֹד என்பதற்கு ‘மீண்டும்’ இயல்பான இணை.
- source_word: וַיֹּאמֶר לוֹ הָאֱלֹהִים
  choice: கடவுள் அவனிடம் … என்றார்
  rationale: எபிரெயக் கதைநடையின் நேரடியான பேச்சு அறிமுகத்தை இயல்பான, மரியாதையான நவீனத் தமிழில் தருகிறது.
- source_word: לֹא תַעֲלֶה אַחֲרֵיהֶם
  choice: நீ அவர்களைப் பின்தொடர்ந்து முன்னேறாதே
  rationale: עלה என்பதன் அடிப்படைப் பொருள் ‘மேலே போதல்’; இப்போர்ச் சூழலில் படை முன்னேற்றத்தைக் குறிக்கிறது. தமிழில் பொருளற்றதாகத் தோன்றும் ‘மேலே போகாதே’ என்பதைத் தவிர்த்து, மூலத்தின் நகர்வு மற்றும் இராணுவச் சூழல் இரண்டையும் ‘முன்னேறாதே’ காக்கிறது.
- source_word: הָסֵב מֵעֲלֵיהֶם
  choice: அவர்களிடமிருந்து விலகிச் சுற்றிப்போய்
  rationale: הָסֵב திசைமாற்றி வளைந்து அல்லது சுற்றிச் செல்வதைக் குறிக்கிறது; מֵעֲלֵיהֶם நேரடியாக அவர்களை நோக்கிச் செல்லாமல் விலகும் நகர்வைக் காட்டுகிறது. மூலத்தில் வெளிப்படையாக இல்லாத ‘அவர்களுக்குப் பின்னால்’ என்ற குறிப்பைச் சேர்க்கவில்லை.
- source_word: וּבָאתָ לָהֶם מִמּוּל
  choice: எதிரே அவர்களை அணுகு
  rationale: போர்ச் சூழலில் בוא + ל எதிரியை நோக்கி வருதல் அல்லது அணுகுதலைக் குறிக்கிறது; מִמּוּל எதிரே அல்லது எதிர்ப்புறத்தில் என்ற இடநிலையைத் தருகிறது.
- source_word: הַבְּכָאִים
  choice: பக்கா மரங்கள்
  rationale: குறிப்பிட்ட மரவகை உறுதியற்றதால், ஊகமான ஒரு தாவரவியல் அடையாளத்தை முதன்மை உரையில் உறுதிப்படுத்தாமல் எபிரெயப் பெயரைத் தமிழில் ஒலிபெயர்த்துள்ளது; அடிக்குறிப்பு வாசகருக்குத் தேவையான மாற்றுப் புரிதல்களை வழங்குகிறது.
