source:
  edition: WLC
  text: וִ֠/יהִי כְּֽ/שָׁמְעֲ/ךָ֞ אֶת ק֤וֹל הַ/צְּעָדָה֙ בְּ/רָאשֵׁ֣י הַ/בְּכָאִ֔ים אָ֖ז תֵּצֵ֣א בַ/מִּלְחָמָ֑ה כִּֽי יָצָ֤א הָֽ/אֱלֹהִים֙ לְ/פָנֶ֔י/ךָ לְ/הַכּ֖וֹת אֶת מַחֲנֵ֥ה פְלִשְׁתִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/015.yaml
  text: And when you hear the sound of marching in the tops of the balsam trees[a], then go out to battle, for God has gone out before you to strike down the camp of the Philistines.
translation:
  language: ta
  text: நீ பிசின் மரங்களின்[a] உச்சிகளில் அணிவகுத்துச் செல்லும் ஓசையைக் கேட்கும்போது, போருக்குப் புறப்படு; ஏனெனில் பெலிஸ்தியரின் பாளயத்தைத் தாக்குவதற்காகக் கடவுள் உனக்கு முன்னே புறப்பட்டுச் சென்றிருக்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பாக்கா மரங்கள்”; மரபுவழியாக “மல்பெரி மரங்கள்” என்றும் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெயச் சொல் குறிக்கும் துல்லியமான மரவகை உறுதியாகத் தெரியவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיהִי כְּשָׁמְעֲךָ
  choice: நீ ... கேட்கும்போது
  rationale: வாவ் + היה மற்றும் כְּ + வினையெச்சக் கட்டமைப்பு காலச் சூழலை அறிமுகப்படுத்துகிறது. தமிழில் இயல்பாகவும் துல்லியமாகவும் காலத் தொடர்பைக் காட்டுகிறது.
- source_word: קוֹל הַצְּעָדָה
  choice: அணிவகுத்துச் செல்லும் ஓசை
  rationale: צעד என்பது அடியெடுத்து நடப்பதை அல்லது அணிவகுத்துச் செல்வதைச் சுட்டுகிறது. போர்ச் சூழலில் ‘அணிவகுத்துச் செல்லும் ஓசை’ என்பது வெறும் காலடியோசையைவிட இராணுவ இயக்கத்தைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: בְּרָאשֵׁי הַבְּכָאִים
  choice: பிசின் மரங்களின் உச்சிகளில்
  rationale: רָאשִׁים இங்கு மரங்களின் மேற்பகுதிகளைக் குறிக்கிறது. בְּכָאִים என்பதன் துல்லியமான மரவகை உறுதியற்றது; ‘பிசின் மரங்கள்’ என்பது பொதுவாக முன்வைக்கப்படும் அடையாளத்தை வாசகருக்குப் புரியும் வகையில் தருகிறது, உறுதியின்மையை அடிக்குறிப்பு பாதுகாக்கிறது.
- source_word: אָז תֵּצֵא בַמִּלְחָמָה
  choice: போருக்குப் புறப்படு
  rationale: יצא என்பதன் ‘வெளியேறு/புறப்படு’ என்ற அடிப்படைப் பொருளையும், בַמִּלְחָמָה தரும் போர்ச் சூழலையும் இயல்பான தமிழில் இணைக்கிறது.
- source_word: כִּי יָצָא הָאֱלֹהִים לְפָנֶיךָ
  choice: ஏனெனில் ... கடவுள் உனக்கு முன்பாகப் புறப்பட்டுச் சென்றிருக்கிறார்
  rationale: כִּי காரணத்தை அறிமுகப்படுத்துகிறது. நிறைவுற்ற வினை, அடையாளம் கேட்கப்படும் நேரத்தில் கடவுளின் முன்னேறும் செயல் ஏற்கெனவே தொடங்கியிருப்பதைச் சுட்டுவதால், ‘புறப்பட்டுச் சென்றிருக்கிறார்’ என வழங்கப்பட்டுள்ளது.
- source_word: לְהַכּוֹת אֶת מַחֲנֵה פְלִשְׁתִּים
  choice: பெலிஸ்தியரின் முகாமை வீழ்த்துவதற்காக
  rationale: נכה என்பதன் causative வடிவம் போர்ச் சூழலில் தாக்கி முறியடித்தல் அல்லது வீழ்த்துதலைக் குறிக்கிறது. ‘வீழ்த்துவதற்காக’ தீர்மானமான இராணுவ நடவடிக்கையை இயல்பாகக் காட்டுகிறது.
theological_decisions:
- issue: הָאֱלֹהִים என்பதன் எண் மற்றும் குறிப்பு
  choice: கடவுள்
  alternative: தெய்வங்கள்
  rationale: אֱלֹהִים வடிவத்தில் பன்மையாக இருந்தாலும், இங்கு ஒருமை வினையுடன் வந்து இஸ்ரவேலின் கடவுளைக் குறிக்கிறது. ஆகவே ஒருமையான ‘கடவுள்’ பொருத்தமானது.
translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, கண்ணியமான மற்றும் பொதுவாசகருக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. போர்ச் சூழலின் இயக்கம் இயல்பாக வெளிப்படுத்தப்பட்டாலும், மூலத்தின் உருவகமும் மரவகை குறித்த உறுதியின்மையும் பாதுகாக்கப்பட்டுள்ளன.
