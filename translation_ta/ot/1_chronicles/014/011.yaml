source:
  edition: WLC
  text: וַ/יַּעֲל֥וּ בְּ/בַֽעַל פְּרָצִים֮ וַ/יַּכֵּ֣/ם שָׁ֣ם דָּוִיד֒ וַ/יֹּ֣אמֶר דָּוִ֔יד פָּרַ֨ץ הָֽ/אֱלֹהִ֧ים אֶת אוֹיְבַ֛/י בְּ/יָדִ֖/י כְּ/פֶ֣רֶץ מָ֑יִם עַל כֵּ֗ן קָֽרְא֛וּ שֵֽׁם הַ/מָּק֥וֹם הַ/ה֖וּא בַּ֥עַל פְּרָצִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/011.yaml
  text: So they went up to Baal-perazim[a], and David struck them down there. And David said, “God has broken through my enemies by my hand, like a bursting flood of waters.” Therefore they called the name of that place Baal-perazim.
translation:
  language: ta
  text: அவர்கள் பாகால்-பெராசீமுக்கு[a] ஏறிச் சென்றார்கள்; அங்கே தாவீது அவர்களை வீழ்த்தினார். தாவீது, “நீர் பெருக்கெடுத்து உடைப்பதைப்போல, கடவுள் என் கையால் என் பகைவர்களை உடைத்தார்” என்றார். அதனால் அந்த இடத்துக்குப் பாகால்-பெராசீம் என்று பெயரிட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பாகால்-பெராசீம்” என்ற பெயர் “உடைப்புகளின் தலைவர்” அல்லது “உடைப்புகளின் இடம்” என்ற பொருளை உணர்த்துகிறது; கடவுள் என் பகைவர்களை “உடைத்தார்” என்ற தாவீதின் கூற்றுடன் இது சொல்லாட்டமாக இணைகிறது.
    reason: இடப்பெயரின் பொருளையும் פרץ என்ற எபிரேயச் சொல்லுடனான சொல்லாட்டத்தையும் விளக்குகிறது.
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: ஏறிச் சென்றார்கள்
  rationale: עלה என்பதன் திசைசார்ந்த ‘மேலே செல்/ஏறிச் செல்’ என்ற படைநகர்வு உணர்வைப் பாதுகாக்கிறது; தேவையற்ற போர்தந்திர விளக்கத்தைச் சேர்ப்பதில்லை.
- source_word: בְּבַעַל פְּרָצִים / בַּעַל פְּרָצִים
  choice: பாகால்-பெராசீம்
  rationale: இது இடப்பெயர் என்பதால் ஒலிபெயர்க்கப்பட்டுள்ளது. פרץ சார்ந்த பெயர்ச் சொல்லாட்டம் முதன்மை உரையிலும் அடிக்குறிப்பிலும் வெளிப்படுத்தப்படுகிறது.
- source_word: וַיַּכֵּם
  choice: தாவீது அவர்களை வீழ்த்தினார்
  rationale: போர்ச் சூழலில் נכה என்பது தாக்கி முறியடிப்பதைக் குறிக்கிறது. ‘வீழ்த்தினார்’ அதன் வலிமையையும் இயல்பான தமிழையும் இணைக்கிறது.
- source_word: פָּרַץ
  choice: உடைத்துக்கொண்டு பாய்ந்தார்
  rationale: פרץ என்பது தடையை உடைத்துக்கொண்டு வேகமாகப் பாய்வதைச் சுட்டுகிறது. நீரின் உருவகத்தையும் பெராசீம் என்ற பெயருடனான சொல்லிணைப்பையும் இது காக்கிறது.
- source_word: הָאֱלֹהִים
  choice: கடவுள்
  rationale: ஒருமை வினைச்சொல் இதை ஒருமை தெய்வீகக் கர்த்தாவாகக் காட்டுகிறது; நவீன பொதுத்தமிழில் ‘கடவுள்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: אֶת אֹיְבַי
  choice: என் பகைவர்களை
  rationale: நேரடி, தெளிவான பொருள்; உயர்வான கதைநடைத் தமிழுக்கும் ஏற்றது.
- source_word: בְּיָדִי
  choice: என் கையால்
  rationale: தெய்வீகச் செயல் தாவீதின் கை வழியாக நிகழ்ந்ததைச் சொல்லும் எபிரேய உருவகத்தையும் கருவித்தன்மையையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: כְּפֶרֶץ מָיִם
  choice: பெருக்கெடுத்து உடைக்கும் வெள்ளம்போல
  rationale: நீர் தடையை உடைத்துக்கொண்டு பாயும் உயிரோட்டமான உருவகத்தை இயல்பான தமிழில் தருகிறது; פרץ என்ற வேரின் உடைத்துப் பாயும் கருத்தையும் காக்கிறது.
- source_word: עַל כֵּן
  choice: அதனால்
  rationale: காரணத்திலிருந்து பெயரிடுதலுக்கு நகரும் தொடர்பை எளிமையாகவும் துல்லியமாகவும் காட்டுகிறது.
- source_word: קָרְאוּ שֵׁם הַמָּקוֹם הַהוּא
  choice: அந்த இடத்துக்குப் ... என்று பெயரிட்டார்கள்
  rationale: எபிரேய வினையின் மூன்றாம் நபர் பன்மையைப் பாதுகாக்கிறது; எபிரேயப் பெயரிடும் சூத்திரத்தை இயல்பான தமிழில் வழங்குகிறது.
theological_decisions:
- issue: தாவீதின் அறிவிப்பில் אֱלֹהִים என்பதன் குறிப்பு மற்றும் செயற்பாடு
  choice: தாவீதின் கை வழியாகச் செயல்படும் ஒருமைத் தெய்வீகக் கர்த்தாவாகக் கடவுள்
  alternative: வெற்றியைத் தாவீதின் செயல் மட்டுமாகவோ, மனிதப் பங்கு இல்லாத தெய்வீகச் செயலாகவோ வழங்குதல்
  rationale: פָּרַץ என்ற ஒருமை வினை கடவுளை ஒருமை எழுவாயாகக் காட்டுகிறது; בְּיָדִי (‘என் கையால்’) தாவீதை மனிதக் கருவியாகக் காட்டுகிறது. இரு செயற்பாடுகளுக்கிடையிலான உரையின் பதற்றம் அப்படியே பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை. ‘என் கையால்’ என்ற எபிரேய உருவகம் திட்டமிட்டு வைக்கப்பட்டுள்ளது. இடப்பெயர் ஒலிபெயர்க்கப்பட்டு, அதன் சொல்லாட்டம் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
