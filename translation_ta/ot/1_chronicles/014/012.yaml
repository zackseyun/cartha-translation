  edition: WLC
  text: וַ/יַּעַזְבוּ שָׁ֖ם אֶת אֱלֹֽהֵי/הֶ֑ם וַ/יֹּ֣אמֶר דָּוִ֔יד וַ/יִּשָּׂרְפ֖וּ בָּ/אֵֽשׁ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/012.yaml
  text: And they left their gods there[a], and David gave the order[b], and they were burned with fire.
translation:
  language: ta
  text: அவர்கள் தங்கள் தெய்வங்களை அங்கே விட்டுச் சென்றார்கள்[a]. தாவீது கட்டளையிட்டான்[b]; அவை நெருப்பால் எரிக்கப்பட்டன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தங்கள் சிலைகளை.’ எபிரெய மூலத்தில் சொல்லுக்குச் சொல் ‘தங்கள் தெய்வங்களை’ என்கிறது; எனினும் இங்கு அவர்களுடைய வழிபாட்டு உருவங்களே குறிக்கப்பட்டிருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இதற்கு இணையான 2 சாமுவேல் 5:21-இன் பதிவு, ‘தாவீதும் அவனுடைய ஆட்களும் அவற்றை எடுத்துச் சென்றார்கள்’ என்று செய்வினையில் கூறுகிறது. நாளாகமமோ, தாவீதின் கட்டளையின்படி அவை நெருப்பால் எரிக்கப்பட்டதாகக் கூறுகிறது.
    reason: cross_reference
lexical_decisions:
- source_word: וַיַּעַזְבוּ
  choice: விட்டுச் சென்றார்கள்
  rationale: עזב என்பதன் ‘விட்டுவிடுதல்/கைவிடுதல்’ என்ற பொருளை, பெலிஸ்தியர் பின்வாங்கியபோது அவற்றை அங்கேயே விட்டுச் சென்ற நிகழ்வாக இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: שָׁם
  choice: அங்கே
  rationale: இடத்தைக் குறிக்கும் எளிய எபிரெய வினையடைக்கு நேரான, இயல்பான தமிழ் இணை.
- source_word: אֶת אֱלֹהֵיהֶם
  choice: தங்கள் தெய்வங்களை
  rationale: எபிரெயம் நேரடியாக ‘அவர்களுடைய தெய்வங்கள்’ என்கிறது. இங்கு வழிபாட்டு உருவங்கள் குறிக்கப்பட்டிருக்கலாம்; எனினும் மூலச்சொல்லின் வடிவை உரையில் காக்க ‘தெய்வங்கள்’ என்று மொழிபெயர்க்கப்படுகிறது.
- source_word: וַיֹּאמֶר דָּוִיד
  choice: தாவீது கட்டளையிட்டான்
  rationale: சொல்லுக்குச் சொல் ‘தாவீது சொன்னான்’ என்றாலும், அடுத்த செயலை நிகழ்த்தும் ஆணையாக இக்கூற்று செயல்படுவதால் ‘கட்டளையிட்டான்’ என்பது சூழலுக்கேற்ற இயல்பான தமிழ்.
- source_word: וַיִּשָּׂרְפוּ
  choice: அவை எரிக்கப்பட்டன
  rationale: வடிவின் செயல்பாட்டு வினை உணர்வைக் காத்து, எரித்தவர் யார் என்று மூலத்தில் இல்லாத கர்த்தாவைச் சேர்க்காமல் மொழிபெயர்க்கிறது.
- source_word: בָּאֵשׁ
  choice: நெருப்பால்
  rationale: எரித்தலுக்குப் பயன்படுத்தப்பட்ட சாதனத்தைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது.
theological_decisions:
- issue: புறவழிபாட்டுப் பொருட்கள் குறித்த சூழலில் אֱלֹהֵיהֶם என்பதன் மொழிபெயர்ப்பு
  choice: தங்கள் தெய்வங்களை
  alternative: தங்கள் சிலைகளை
  rationale: எபிரெய உரை ‘அவர்களுடைய தெய்வங்கள்’ என்றே கூறுகிறது. குறிப்பு வழிபாட்டு உருவங்களைக் குறித்திருக்கக்கூடும் என்றாலும், விளக்கமான ‘சிலைகள்’ என்பதை முதன்மை உரைக்குள் கொண்டு வந்து மூலத்தின் சொற்பயன்பாட்டை மாற்றாமல் அதன் இயல்பான இறையியல் பதற்றம் காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘தெய்வங்கள்’ என்ற மூலச்சொல் முதன்மை உரையில் காக்கப்பட்டு, ‘சிலைகள்’ என்பது அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது; செய்பவர் குறிப்பிடப்படாத எபிரெயச் செயல்பாட்டு அமைப்பும் தமிழில் காக்கப்பட்டுள்ளது.
