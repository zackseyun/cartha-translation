translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் மரியாதைமிக்க நடையிலும் வடிவமைக்கப்பட்டது. ‘கைவினைஞர்கள்’ என்ற பொதுச்சொல் இரு தொழில்களுக்கும் இணையாகப் பயன்படுத்தப்பட்டு, அவற்றின் தனிப்பணிகள் தெளிவுபடுத்தப்பட்டுள்ளன. அனைத்து அடிக்குறிப்பு குறிகளும் மூல உரையில் இடம்பெற்றுள்ளன.
