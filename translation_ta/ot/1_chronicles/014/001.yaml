source:
  edition: WLC
  text: וַ֠/יִּשְׁלַח חירם מֶֽלֶךְ צֹ֥ר מַלְאָכִים֮ אֶל דָּוִיד֒ וַ/עֲצֵ֣י אֲרָזִ֔ים וְ/חָרָשֵׁ֣י קִ֔יר וְ/חָרָשֵׁ֖י עֵצִ֑ים לִ/בְנ֥וֹת ל֖/וֹ בָּֽיִת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/001.yaml
  text: Then Hiram king of Tyre sent messengers to David[a], and cedar timber, masons, and carpenters[b], to build a house for him.
translation:
  language: ta
  text: பின்பு, தீருவின் அரசனான ஈராம், தாவீதிடம் தூதர்களையும்[a], கேதுரு மரப்பொருட்களையும், சுவர் கட்டும் கைவினைஞர்களையும், மரவேலைக் கைவினைஞர்களையும் அவனுக்கு ஒரு வீட்டைக்[b] கட்டுவதற்காக அனுப்பினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தூதர்கள்” என்பதற்கு “அரசப் பிரதிநிதிகள்” என்றும் மொழிபெயர்க்கலாம். அரசச் சூழலில் எபிரேயச் சொல் அதிகாரப்பூர்வமாக அனுப்பப்பட்ட பிரதிநிதிகளைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அரண்மனையைக்.” “வீடு” என்பதற்கான எபிரேயச் சொல் இங்கு அரசரின் வசிப்பிடத்தைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: பின்பு ... அனுப்பி ... கட்டச் செய்தான்
  rationale: வாவ் தொடர்வினை கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது. எபிரேய வாக்கியத்தில் அனுப்பப்பட்ட பொருட்களும் பணியாளர்களும் கட்டுமான நோக்கத்துடன் வந்தனர்; இயல்பான தமிழில் காரணச் செயப்பாட்டு அமைப்பு இதைத் தெளிவாக இணைக்கிறது.
- source_word: חירם
  choice: ஈராம்
  rationale: இவ்வசனத்தின் மெய்யெழுத்து வடிவம் Hiram என்பதை ஆதரிக்கிறது; தமிழில் வழக்கமான ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டது.
- source_word: מֶלֶךְ צֹר
  choice: தீருவின் அரசனான
  rationale: பெயருடன் இயல்பாக இணையும் தமிழ் அடைமொழித் தொடர்; அரச பதவியையும் ஆட்சிப்பகுதியையும் நேரடியாகக் காட்டுகிறது.
- source_word: מַלְאָכִים
  choice: தூதுவர்கள்
  rationale: இந்தச் சொல் பொதுவாகச் செய்தி அல்லது பணியுடன் அனுப்பப்படுவோரைக் குறிக்கிறது. அரசச் சூழலில் அதிகாரப்பூர்வப் பிரதிநிதிகள் என்ற பொருளும் சாத்தியம்; அதை அடிக்குறிப்பில் வைத்திருக்கிறது.
- source_word: וַעֲצֵי אֲרָזִים
  choice: கேதுரு மரங்கள்
  rationale: עֵצִים என்பது மரங்கள் அல்லது மரப்பொருள் என வரலாம்; கட்டுமானச் சூழல் மரப்பொருளைக் குறித்தாலும், மூலத்தின் வடிவத்தை நெருக்கமாகப் பேணும் பரிச்சயமான வேதாகமச் சொற்றொடர் தேர்ந்தெடுக்கப்பட்டது.
- source_word: חָרָשֵׁי קִיר
  choice: சுவர் கட்டும் கைவினைஞர்கள்
  rationale: சொல்லளவில் ‘சுவரின் கைவினைஞர்கள்’; ‘கொத்தனார்கள்’ என்று பொருளைச் சுருக்காமல், சுவர் கட்டும் பணியை வெளிப்படையாகக் காட்டுகிறது.
- source_word: חָרָשֵׁי עֵצִים
  choice: மரவேலை செய்யும் கைவினைஞர்கள்
  rationale: மரத்தில் வேலை செய்யும் தொழிலாளர்களைத் துல்லியமாகக் குறிக்கிறது; ‘தச்சர்கள்’ என்பதும் இயலும்.
- source_word: לִבְנוֹת לוֹ בָּיִת
  choice: அவனுக்கு ஓர் அரண்மனையைக் கட்ட
  rationale: בַּיִת என்பதன் அடிப்படைப் பொருள் ‘வீடு’; அரசனான தாவீதுக்கான இந்தக் கட்டுமானச் சூழலில் அது அரச மாளிகை அல்லது அரண்மனையைக் குறிக்கிறது. அடிப்படைச் சொல்லை அடிக்குறிப்பு பாதுகாக்கிறது.
