  text: וַ/יַּ֣עַשׂ דָּוִ֔יד כַּֽ/אֲשֶׁ֥ר צִוָּ֖/הוּ הָֽ/אֱלֹהִ֑ים וַ/יַּכּוּ֙ אֶת מַחֲנֵ֣ה פְלִשְׁתִּ֔ים מִ/גִּבְע֖וֹן וְ/עַד גָּֽזְרָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/016.yaml
  text: So David did as God had commanded him, and they struck down the Philistine army from Gibeon as far as Gezer.
translation:
  language: ta
  text: தாவீது, கடவுள் அவனுக்குக் கட்டளையிட்டபடியே செய்தான். அவர்கள் பெலிஸ்தியரின் படையை[a] கிபியோனிலிருந்து கேசேர் வரை தாக்கி வீழ்த்தினர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேர்ச்சொல்லாக, “பெலிஸ்தியரின் பாளையத்தை.” இங்கு “பாளையம்” என்பது அங்கே பாளையமிட்டிருந்த படையைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: செய்தான்
  rationale: עשה என்ற பொதுவான வினை இங்கு கீழ்ப்படிதலைக் குறிக்கும் ‘கட்டளையிட்டபடியே செய்தான்’ என்ற இயல்பான தமிழ் மரபுத்தொடரில் நேரடியாக வழங்கப்பட்டுள்ளது.
- source_word: כַּאֲשֶׁר צִוָּהוּ הָאֱלֹהִים
  choice: கடவுள் தனக்குக் கட்டளையிட்டபடியே
  rationale: כַּאֲשֶׁר கட்டளைக்கு ஏற்ப நடந்ததைச் சுட்டுகிறது; צוה என்பது அதிகாரப்பூர்வமாகக் கட்டளையிடுதலைக் குறிக்கிறது. ‘தனக்கு’ என்பது எபிரெய வினையிலுள்ள மூன்றாம் நபர் ஆண்பால் ஒருமை பின்னொட்டைப் பிரதிபலிக்கிறது.
- source_word: וַיַּכּוּ
  choice: அவர்கள் ... தாக்கி வீழ்த்தினார்கள்
  rationale: வினை பன்மையில் உள்ளது. נכה போர்ச் சூழலில் தாக்கி முறியடித்தல் அல்லது வீழ்த்துதல் என்ற வலிமையைக் கொண்டதால், வெறும் ‘தாக்கினார்கள்’ என்பதைவிட இத்தொடர் பொருத்தமானது.
- source_word: מַחֲנֵה פְלִשְׁתִּים
  choice: பெலிஸ்தியரின் படை
  rationale: מַחֲנֶה என்பதன் நேர்ப்பொருள் ‘பாளையம்’; ஆனால் போர்ச் சூழலில் அது பாளையமிட்டிருந்த படையை ஆகுபெயராகக் குறிக்கலாம். நவீன தமிழில் செயற்பாட்டின் இலக்கைத் தெளிவாக்க ‘படை’ பயன்படுத்தப்பட்டு, நேர்ப்பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: מִגִּבְעוֹן וְעַד גָּזְרָה
  choice: கிபியோன் தொடங்கி கேசேர் வரைக்கும்
  rationale: מִן ... עַד என்ற அமைப்பு நடவடிக்கையின் தொடக்கத்தையும் எல்லையையும் குறிக்கிறது; ‘தொடங்கி ... வரைக்கும்’ இதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: וַיַּכּוּ என்ற போர் வினையின் எழுவாய்
  choice: தாவீதையும் அவனுடைய படையினரையும் உள்ளடக்கும் பன்மை எழுவாயாக ‘அவர்கள்’
  alternative: தாவீது ஒருவனையே எழுவாயாகக் கொண்டு ஒருமையில் மொழிபெயர்த்தல்
  rationale: எபிரெய வினை இலக்கணப்படி பன்மையில் உள்ளது. சூழலில் தாவீதோடு அவனுடைய வீரர்களும் போரிட்டிருப்பது இயல்பானது; எனவே பன்மை மறைக்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியக்கூடிய அதேவேளையில் கண்ணியமான வரலாற்று உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘பெலிஸ்தியர்,’ ‘கிபியோன்,’ ‘கேசேர்’ ஆகியவை தமிழில் வழக்கமான வேதாகமப் பெயர்வடிவங்களுக்கு ஏற்ப வழங்கப்பட்டுள்ளன.
