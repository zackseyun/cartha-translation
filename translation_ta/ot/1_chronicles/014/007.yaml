translation_notes:
  register: நவீனத் தரத் தமிழில், தனிப்பெயர்களை மொழிபெயர்க்காமல் எபிரெய ஒலிக்கு நெருக்கமாக ஒலிபெயர்த்துள்ளோம். இது பெயர்களால் ஆன பட்டியலின் தொடர்ச்சி என்பதால் ஒவ்வொரு ו-வையும் ‘மற்றும்’ என மீண்டும் மீண்டும் கூறாமல் தமிழ் பட்டியல் நடையில் வழங்கப்பட்டுள்ளது. அடிக்குறிப்பு குறியீடு தொடர்புடைய ‘எலிசாமா’ பெயருக்குப் பின் வைக்கப்பட்டுள்ளது; அதன் குறிப்பு இணைப் பகுதியிலுள்ள வேறுபட்ட பெயர்வடிவத்தை விளக்குகிறது.
