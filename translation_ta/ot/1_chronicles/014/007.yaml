lexical_decisions:
- source_word: וֶ/אֱלִישָׁמָע
  choice: எலிசாமா
  rationale: இணைப்பிடைச்சொல் ו பட்டியலின் தொடர்ச்சியைச் சுட்டுகிறது; முந்தைய வசனத்துடன் இயல்பாகத் தொடர்வதால் தமிழில் தனியே ‘மற்றும்’ என்று சேர்க்காமல் பெயர் ஒலிபெயர்க்கப்பட்டது.
- source_word: וּ/בְעֶלְיָדָע
  choice: பெயெலியாதா
  rationale: இங்குள்ள எபிரெய மெய்யெழுத்து வடிவம் בְעֶלְיָדָע என்பதையே பின்பற்றி பெயர் ஒலிபெயர்க்கப்பட்டது; இணைப்பிடைச்சொல் ו பட்டியல் நிறுத்தற்குறியால் இயல்பாக வெளிப்படுத்தப்பட்டது.
- source_word: וֶ/אֱלִיפָלֶט
  choice: எலிபெலேத்
  rationale: אֱלִיפָלֶט என்ற தனிப்பெயர் அதன் எபிரெய ஒலிவடிவத்தை நெருக்கமாகப் பிரதிபலிக்கும் வகையில் தமிழில் ஒலிபெயர்க்கப்பட்டது; முன்சேர்க்கை ו பட்டியல் அமைப்பில் இயல்பாக உணர்த்தப்படுகிறது.
