  - marker: a
    text: 2 சாமுவேல் 5:16-இல் உள்ள இணைப் பட்டியலில் ‘எலியாதா’ என்ற பெயர் வருகிறது. இங்கே எபிரேய மூல உரை ‘பெஎலியாதா’ என்று வாசிக்கிறது.
