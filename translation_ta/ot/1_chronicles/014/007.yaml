- from: எலிசாமா[a], பெயெலியாதா, எலிபெலேத்.
  to: எலிஷாமா[a], பெஎலியாதா, எலிபாலேத்.
  rationale: The verse remains a concise list, preserving its source-text sequence. The revision corrects the transliteration of shin in Elishama, the /pa/ syllable in Eliphalet, and the distinctive Beeliada spelling attested in the Hebrew text. The footnote remains anchored to Elishama, as in the English audit trail, and accurately reports the parallel-name variation without implying that the parallel reading replaces this verse’s text.
