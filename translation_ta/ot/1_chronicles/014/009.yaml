base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/009.yaml
  text: The Philistines came and raided the Valley of Rephaim[a].
translation:
  language: ta
  text: பெலிஸ்தியர்கள் வந்து ரெப்பாயீம் பள்ளத்தாக்கில் தாக்குதல் நடத்தினார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ரெப்பாயீம் பள்ளத்தாக்கில் பரவினார்கள்.” எபிரெய வினைச்சொல் படைகள் பரவி நிலைகொண்டதையோ, கொள்ளையிடும் தாக்குதலை நடத்தியதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/פְלִשְׁתִּים
  choice: பெலிஸ்தியர்கள்
  rationale: פְלִשְׁתִּים என்பது ‘Philistines’ என்ற இனப்பெயர். வ் இணைப்பைத் தமிழில் தனியாக மொழிபெயர்க்காமல், இயல்பான கதைத் தொடரால் உணர்த்தப்பட்டுள்ளது.
- source_word: בָּאוּ
  choice: வந்து
  rationale: בוא என்பதன் Qal perfect 3cp வடிவம்; அடுத்த தொடர் வினையுடன் இயல்பாக இணைக்க ‘வந்து’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וַיִּפְשְׁטוּ
  choice: கொள்ளையிடுவதற்காகப் பரவினார்கள்
  rationale: போர் சூழலில் פשט என்பது படைகள் பரவியமை அல்லது கொள்ளையிடும் படையெடுப்பை மேற்கொண்டமை ஆகிய இரு நுணுக்கங்களையும் தரலாம். தமிழ் முதன்மை உரை இந்த இடவியல் மற்றும் பகைமை சார்ந்த கூறுகளை இணைத்துப் பாதுகாக்கிறது.
- source_word: בְּ/עֵמֶק
  choice: பள்ளத்தாக்கில்
  rationale: עֵמֶק என்பது பள்ளத்தாக்கைக் குறிக்கிறது; בְ முன்னிடைச்சொல் ‘-இல்’ என இயல்பாகக் காட்டப்பட்டுள்ளது.
- source_word: רְפָאִים
  choice: ரெப்பாயீம்
  rationale: இங்கு இது நிலையான இடப்பெயரின் ஒரு பகுதி; ஆகவே பொருள் மொழிபெயர்ப்பு செய்யாமல் எபிரெய ஒலிப்புக்கு அண்மையாக எழுத்துப்பெயர்க்கப்பட்டுள்ளது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு விளங்கும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. மூல வினைச்சொல்லிலுள்ள ‘பரவுதல்/படையெடுத்தல்’ என்ற உண்மையான பொருள் நெருக்கடி அடிக்குறிப்புடன் பாதுகாக்கப்பட்டுள்ளது.
