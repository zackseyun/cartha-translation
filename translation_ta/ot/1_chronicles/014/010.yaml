source:
  edition: WLC
  text: וַ/יִּשְׁאַ֨ל דָּוִ֤יד בֵּ/אלֹהִים֙ לֵ/אמֹ֔ר הַ/אֶֽעֱלֶה֙ עַל פלשתיים וּ/נְתַתָּ֖/ם בְּ/יָדִ֑/י וַ/יֹּ֨אמֶר ל֤/וֹ יְהוָה֙ עֲלֵ֔ה וּ/נְתַתִּ֖י/ם בְּ/יָדֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/010.yaml
  text: And David inquired of God[a], saying, “Shall I go up against the Philistines, and will you give them into my hand?” And Yahweh said to him, “Go up, and I will give them into your hand.”
translation:
  language: ta
  text: தாவீது கடவுளிடம், “நான் பெலிஸ்தியர்களுக்கு எதிராகப் போகலாமா? அவர்களை என் கையில் ஒப்புக்கொடுப்பீரா?” என்று விசாரித்தான். யாவே அவனிடம், “போ; அவர்களை உன் கையில் ஒப்புக்கொடுப்பேன்” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁאַל ... בֵּאלֹהִים
  choice: கடவுளிடம் விசாரித்து
  rationale: இது சாதாரணமாகக் கேட்பதைவிட இறைவழிகாட்டுதலை நாடுவதைக் குறிக்கிறது; ‘விசாரித்து’ அந்த முறையான பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: הַאֶעֱלֶה
  choice: நான் ... போகலாமா?
  rationale: עלה என்பதன் சொற்பொருள் ‘மேலே போதல்’ என்றாலும், இங்கு அது படையெடுத்துச் செல்வதைக் குறிக்கிறது. தமிழில் ‘எதிராகப் போகலாமா?’ என்பது கேள்வியின் நோக்கத்தை இயல்பாகத் தெரிவிக்கிறது.
- source_word: עַל פלשתיים
  choice: பெலிஸ்தியர்களுக்கு எதிராக
  rationale: போர்ச் சூழலில் עַל பகைமை நோக்கிய நகர்வைக் குறிக்கிறது.
- source_word: וּנְתַתָּם בְּיָדִי / וּנְתַתִּים בְּיָדֶךָ
  choice: அவர்களை என்/உன் கையில் ஒப்புக்கொடுப்பீரா/ஒப்புக்கொடுப்பேன்
  rationale: נתן ביד என்பது ஒருவரின் அதிகாரத்திற்குள் எதிரிகளை ஒப்புக்கொடுப்பதைக் குறிக்கும் எபிரெய மரபுத்தொடர். ‘கையில்’ என்ற உருவகத்தையும் கேள்வி–பதில் ஒத்திசைவையும் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தலைப்புப் பெயரால் மாற்றாமல், எபிரெய நான்கெழுத்து இறைப்பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: עֲלֵה
  choice: போ
  rationale: தாவீதின் கேள்வியிலுள்ள அதே வினையைப் பதிலும் மீண்டும் பயன்படுத்துகிறது; தமிழில் போர்ச் சூழலுக்கு இயல்பான சுருக்கமான கட்டளை.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட இறைப்பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டப்பெயரால் மாற்றாமல் தமிழில் ஒலிபெயர்ப்பது மூல வேறுபாட்டைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; மரியாதைமிக்க ஆனால் எளிதில் புரியும் நடை. கடவுளை நோக்கிய தாவீதின் பேச்சில் மரியாதைப் பன்மையும், தாவீதிடம் யாவே கூறும் பதிலில் ஒருமையும் பயன்படுத்தப்பட்டுள்ளன. எபிரெய ‘கையில் கொடுத்தல்’ என்ற உருவகம் தமிழில் புரியத்தக்க வகையில் ‘கையில் ஒப்புக்கொடுத்தல்’ எனப் பாதுகாக்கப்பட்டுள்ளது.
