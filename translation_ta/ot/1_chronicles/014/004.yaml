  edition: WLC
  text: וְ/אֵ֨לֶּה֙ שְׁמ֣וֹת הַ/יְלוּדִ֔ים אֲשֶׁ֥ר הָיוּ ל֖/וֹ בִּ/ירוּשָׁלִָ֑ם שַׁמּ֣וּעַ וְ/שׁוֹבָ֔ב נָתָ֖ן וּ/שְׁלֹמֹֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/004.yaml
  text: 'And these are the names of the children born to him in Jerusalem: Shammua[a], Shobab, Nathan, and Solomon.'
translation:
  language: ta
  text: 'எருசலேமில் அவனுக்குப் பிறந்த பிள்ளைகளின்[a] பெயர்கள் இவை: சம்மூவா, சோபாப், நாத்தான், சாலொமோன்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “அவனுக்கு எருசலேமில் பிறந்தவர்கள்” என்பது சொல்லர்த்தம். பட்டியலில் உள்ள பெயர்கள் அனைத்தும் ஆண்களின் பெயர்களாக இருந்தாலும், இங்கு “மகன்கள்” என்பதற்கான வழக்கமான சொல் பயன்படுத்தப்படவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: இவை
  rationale: இணைப்புச் சொல் பட்டியலை முந்தைய உரையுடன் தொடர்புபடுத்துகிறது; தமிழில் இயல்பான வாக்கிய அமைப்பில் இறுதியிலுள்ள “இவை” அந்தத் தொடர்பையும் அறிமுகப் பணியையும் போதுமான அளவு வெளிப்படுத்துகிறது.
- source_word: שְׁמוֹת
  choice: பெயர்கள்
  rationale: “பெயர்” என்பதன் பன்மை; தொடர்ந்து வரும் நபர்களின் பட்டியலை அறிமுகப்படுத்துகிறது.
- source_word: הַיְלוּדִים
  choice: பிறந்த பிள்ளைகள்
  rationale: ילד வேரிலிருந்து வந்த செயப்பாட்டு எச்சப் பெயர்ச்சொல், சொல்லர்த்தமாக “பிறந்தவர்கள்.” இயல்பான தமிழுக்காக “பிறந்த பிள்ளைகள்” என வழங்கப்பட்டுள்ளது; “மகன்கள்” என்று மூலத்தில் இல்லாத பாலினக் குறிப்பைச் சேர்க்கவில்லை.
- source_word: אֲשֶׁר הָיוּ לוֹ
  choice: அவனுக்கு
  rationale: היה + ל அமைப்பு உடைமை அல்லது ஒருவருக்குப் பிறந்தவர்கள் என்ற உறவைச் சுட்டுகிறது; “அவனுக்குப் பிறந்த” என்பது தமிழில் இதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: בִּירוּשָׁלִָם
  choice: எருசலேமில்
  rationale: பிறந்த இடத்தைக் குறிக்கும் நேரடியான இடவேற்றுமை மொழிபெயர்ப்பு.
- source_word: שַׁמּוּעַ
  choice: சம்மூவா
  rationale: எபிரெய தனிப்பெயரின் தமிழ்ப் பெயர்ப்பு; நீண்ட உயிரொலியையும் இரட்டித்த மெய்யையும் இயன்றவரை பிரதிபலிக்கிறது.
- source_word: שׁוֹבָב
  choice: சோபாப்
  rationale: எபிரெய தனிப்பெயரின் தமிழில் வழக்கமான ஒலிபெயர்ப்பு.
- source_word: נָתָן
  choice: நாத்தான்
  rationale: எபிரெய தனிப்பெயரின் தமிழில் நிலைபெற்ற வடிவம்.
- source_word: שְׁלֹמֹה
  choice: சாலொமோன்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் தனிப்பெயர் வடிவம்.
