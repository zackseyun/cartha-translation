source:
  edition: WLC
  text: וַ/יֵּצֵ֥א שֵׁם דָּוִ֖יד בְּ/כָל הָֽ/אֲרָצ֑וֹת וַֽ/יהוָ֛ה נָתַ֥ן אֶת פַּחְדּ֖/וֹ עַל כָּל הַ/גּוֹיִֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/017.yaml
  text: And David’s name went out into all the lands[b][a], and Yahweh put the fear of him on all the nations.
translation:
  language: ta
  text: தாவீதின் பெயர் எல்லா நாடுகளிலும் பரவியது[a]. யாவே எல்லா தேசத்தார்மேலும் தாவீதைக் கண்டு அஞ்சும் அச்சத்தை ஏற்படுத்தினார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில், “தாவீதின் பெயர் எல்லா நாடுகளுக்கும் சென்றது”; அதாவது, அவரது புகழ் எல்லா நாடுகளிலும் பரவியது.
    reason: lexical_alternative
  - marker: b
    text: இங்கு “அவருடைய” என்பது தாவீதைக் குறிப்பதாகப் பொருள்கொள்ளப்பட்டுள்ளது. எபிரேயப் பின்னொட்டை யாவேயைக் குறிப்பதாகவும் வாசிக்க இயலும்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּצֵא שֵׁם דָּוִיד
  choice: தாவீதின் பெயர் ... பரவியது
  rationale: ‘பெயர் புறப்பட்டது’ என்ற எபிரேய உருவகத்தின் பொருள் புகழ் அல்லது நற்பெயர் பரவியது என்பதாகும். நவீனத் தமிழில் இயல்பாக இருக்க ‘பரவியது’ என மொழிபெயர்த்து, ‘பெயர்’ என்பதைத் தக்கவைத்துள்ளது.
- source_word: בְּכָל הָאֲרָצוֹת
  choice: எல்லா நாடுகளிலும்
  rationale: பன்மையான אֲרָצוֹת இச்சூழலில் சுற்றியுள்ள நாடுகள் அல்லது நிலப்பகுதிகளைக் குறிக்கிறது; ‘எல்லா நாடுகளிலும்’ என்பது இயல்பான தமிழாக்கம்.
- source_word: יְהוָה
  choice: யாவே
  rationale: தேவனுடைய தனிப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பொதுவாகப் புரியக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: נָתַן אֶת פַּחְדּוֹ עַל
  choice: அவரைப் பற்றிய அச்சத்தை ... வரச்செய்தார்
  rationale: சொல்லுக்கு நெருக்கமாக ‘அச்சத்தை வைத்தார்’ எனலாம்; ஆனால் இந்த எபிரேய மரபுத்தொடரின் காரணவினைப் பொருளை இயல்பான தமிழில் ‘வரச்செய்தார்’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: כָּל הַגּוֹיִם
  choice: எல்லா தேசத்தார்மேலும்
  rationale: גּוֹיִם என்பது இங்கு பிற தேசங்களையும் அவற்றின் மக்களையும் குறிக்கிறது. அச்சம் மனிதர்கள்மேல் வருவது என்பதால் ‘தேசத்தார்’ என வழங்கப்பட்டுள்ளது.
theological_decisions:
- issue: פַּחְדּוֹ என்பதிலுள்ள மூன்றாம் நபர் ஒருமை ஆண்பால் பின்னொட்டின் சுட்டுப்பொருள்
  choice: ‘அவரைப் பற்றிய அச்சம்’ என்பதில் ‘அவர்’ தாவீதைக் குறிக்கிறது.
  alternative: அந்தப் பின்னொட்டு யாவேயைக் குறித்து, ‘அவருக்கான அச்சம்’ அல்லது ‘யாவேக்குப் பயப்படுதல்’ எனப் பொருள்படலாம்.
  rationale: உடனடிச் சூழல் தாவீதின் பெயர் நாடுகளெங்கும் பரவியதைக் கூறுகிறது; ஆகவே யாவே தேசத்தார் தாவீதைக் கண்டு அஞ்சும்படி செய்தார் என்பதே தொடர்ச்சிக்கு மிகவும் பொருத்தமான வாசிப்பு. மூலத்தில் இலக்கணரீதியாக ஏற்படக்கூடிய மாற்று சுட்டுப்பொருள் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. எபிரேய உருவகமான ‘பெயர்’ தக்கவைக்கப்பட்டாலும், ‘புறப்பட்டது’ என்பதற்குப் பதில் இயல்பான ‘பரவியது’ பயன்படுத்தப்பட்டுள்ளது. ‘யாவே’ என்பது יהוה என்பதன் தனிப்பெயர் ஒலிபெயர்ப்பு.
