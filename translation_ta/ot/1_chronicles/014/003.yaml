source:
  edition: WLC
  text: וַ/יִּקַּ֨ח דָּוִ֥יד ע֛וֹד נָשִׁ֖ים בִּ/ירוּשָׁלִָ֑ם וַ/יּ֧וֹלֶד דָּוִ֛יד ע֖וֹד בָּנִ֥ים וּ/בָנֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/003.yaml
  text: And David took more wives in Jerusalem[a], and David fathered more sons and daughters.
translation:
  language: ta
  text: தாவீது எருசலேமில் மேலும் மனைவிகளை எடுத்துக்கொண்டான்[a]. தாவீது மேலும் மகன்களையும் மகள்களையும் பெற்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மேலும் பெண்களை மணந்துகொண்டான்”; எபிரெய மொழியில் சொல்லர்த்தமாக, “மேலும் மனைவிகளை எடுத்துக்கொண்டான்.”
    reason: נָשִׁים என்பது ‘பெண்கள்’ அல்லது ‘மனைவிகள்’ என்றும், לקח என்பது சொல்லர்த்தமாக ‘எடுத்துக்கொண்டான்’ என்றும் வரக்கூடியதால், இயல்பான திருமணப் பொருள் மாற்றாகக் கொடுக்கப்படுகிறது.
lexical_decisions:
- source_word: וַיִּקַּח
  choice: எடுத்துக்கொண்டான்
  rationale: לקח என்பதன் அடிப்படைப் பொருளான ‘எடுத்துக்கொள்’ என்பதைப் பாதுகாக்கிறது. இச்சூழலில் இது மனைவிகளாக ஏற்றுக்கொண்டதைக் குறிக்கிறது; ‘மணந்துகொண்டான்’ என்பது இயல்பான மாற்று என்றாலும், மூலத்தில் திருமணத்துக்கே உரிய வினைச்சொல் இல்லை.
- source_word: עוֹד
  choice: மேலும்
  rationale: மனைவிகளும் பிள்ளைகளும் முன்பிருந்தவர்களோடு கூடுதலாக இருந்ததை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: נָשִׁים
  choice: மனைவிகள்
  rationale: இந்தப் பெயர்ச்சொல் ‘பெண்கள்’ அல்லது ‘மனைவிகள்’ எனப் பொருள்படலாம்; தாவீது அவர்களை எடுத்துக்கொண்டதாகக் கூறும் சூழலில் உறவுநிலையைக் குறிக்கும் ‘மனைவிகள்’ பொருத்தமானது.
- source_word: בִּירוּשָׁלִָם
  choice: எருசலேமில்
  rationale: ב முன்னிடைச்சொல்லின் இடப்பொருளையும் இடப்பெயரையும் நேரடியாக வழங்குகிறது.
- source_word: וַיּוֹלֶד
  choice: பெற்றான்
  rationale: ஆண் எழுவாயுடன் வரும் ילד வினையின் ‘பிள்ளைகளுக்குத் தந்தையானான்’ என்ற பொருளை நவீன தமிழில் இயல்பாகத் தருகிறது.
- source_word: בָּנִים וּבָנוֹת
  choice: மகன்களையும் மகள்களையும்
  rationale: மூல எபிரெயம் இரு பாலினத்தவரையும் தனித்தனியாகக் குறிப்பிடுவதால், பொதுவான ‘பிள்ளைகள்’ என்பதற்குப் பதிலாக அந்தத் தனித்தன்மை பாதுகாக்கப்படுகிறது.
- source_word: דָּוִיד
  choice: தாவீது
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள பெயர் வடிவம்.
theological_decisions:
- issue: தாவீதின் பலதார மணத்தைப் பற்றிய கதை விவரிப்பு
  choice: எந்த அறநெறி மதிப்பீட்டையும் சேர்க்காமல் நிகழ்வை விவரிப்பாகவே மொழிபெயர்த்தல்
  alternative: இந்நடைமுறை அங்கீகரிக்கப்பட்டது அல்லது கண்டிக்கப்பட்டது எனக் காட்டும் மதிப்பீட்டுச் சொல்லைச் சேர்த்தல்
  rationale: இந்த வசனம் தாவீது மேலும் மனைவிகளை எடுத்துக்கொண்டதையும் பிள்ளைகளைப் பெற்றதையும் மட்டும் தெரிவிக்கிறது; அந்த நடைமுறையை இவ்வசனமே வெளிப்படையாக மதிப்பிடவில்லை. ஆகவே மூலத்தின் நிலைப்பாட்டை மீறிய இறையியல் தீர்ப்பு சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் தாவீதின் பெயர் இருமுறை வருவதும், ‘மகன்களும் மகள்களும்’ எனத் தனித்தனியாகக் குறிப்பிடப்படுவதும் பாதுகாக்கப்பட்டுள்ளன.
