lexical_decisions:
- source_word: נֹגַהּ
  choice: நோகா
  rationale: இது ஒரு நபரின் பெயர்; எபிரெய ஒலிப்புக்கு அண்மையாகப் பெயரெழுத்தாக்கம் செய்யப்பட்டது. இறுதி הּ தனியாகத் தெளிவான மெய்யொலியாக ஒலிக்காததால் தமிழில் கூடுதல் மெய்யெழுத்து சேர்க்கப்படவில்லை.
- source_word: נֶפֶג
  choice: நெபெக்
  rationale: இது ஒரு நபரின் பெயர்; எபிரெய மெய்-உயிர் அமைப்பை இயன்றவரை பின்பற்றி தமிழில் பெயரெழுத்தாக்கம் செய்யப்பட்டது. சொல்லிறுதி ג தமிழில் ‘க்’ எனக் கொடுக்கப்பட்டது.
- source_word: יָפִיעַ
  choice: யாஃபீயா
  rationale: இது ஒரு நபரின் பெயர்; தொடக்க י ‘ய’ என்றும், דגש இல்லாத פ ‘ஃப’ என்றும் பெயரெழுத்தாக்கப்பட்டன. சொல்லிறுதி ע-ஐத் தமிழில் இயல்பற்ற தனி ஒலியாக வற்புறுத்தாமல், பெயரின் உயிரொலி அமைப்பு காக்கப்பட்டது.
