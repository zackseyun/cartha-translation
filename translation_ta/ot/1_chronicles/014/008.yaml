base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/008.yaml
  text: When the Philistines heard that David had been anointed king over all Israel[a], all the Philistines went up to seek David. And David heard, and went out before them.
translation:
  language: ta
  text: தாவீது இஸ்ரவேல் முழுவதற்கும் அரசனாக அபிஷேகம் செய்யப்பட்டிருந்தான் என்று பெலிஸ்தியர் கேள்விப்பட்டபோது, பெலிஸ்தியர் அனைவரும் தாவீதைத் தேடி மேலே வந்தனர். தாவீது அதைக் கேள்விப்பட்டு, அவர்களை எதிர்கொள்ளப் புறப்பட்டான்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுக்கு எதிராகப் புறப்பட்டான்.” எபிரேயத்தில் சொல்லுக்குச் சொல், “அவர்களுக்கு முன்பாக வெளியே சென்றான்.” இது போரில் அவர்களை எதிர்கொள்ளச் சென்றதைக் குறிக்கக்கூடும்; ஆனால் அதை வெளிப்படையாகக் கூறவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: கேள்விப்பட்டபோது
  rationale: שׁמע என்பது இங்கு செய்தியை அறிந்துகொள்வதைக் குறிக்கிறது. தமிழில் நிகழ்வுகளின் தொடர்பை இயல்பாக வெளிப்படுத்த ‘கேள்விப்பட்டபோது’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: פְלִשְׁתִּים
  choice: பெலிஸ்தியர்
  rationale: இந்த மக்கள் இனத்துக்கான தமிழில் பரவலாக அறியப்பட்ட பெயர்.
- source_word: כִּי נִמְשַׁח דָּוִיד לְמֶלֶךְ
  choice: தாவீது ... அரசனாக அபிஷேகம் செய்யப்பட்டிருந்தான் என்று
  rationale: נִמְשַׁח என்ற நிபால் வடிவத்தின் செயப்படுபொருள் நிலையையும், பெலிஸ்தியர் கேள்விப்படுவதற்கு முன்பே நிகழ்ந்த செயல் என்பதையும் ‘செய்யப்பட்டிருந்தான்’ வெளிப்படுத்துகிறது.
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: இஸ்ரவேல் முழுவதற்கும்
  rationale: தாவீதின் அரசாட்சி எல்லா இஸ்ரவேலையும் உள்ளடக்கியது என்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וַיַּעֲלוּ כָל פְּלִשְׁתִּים
  choice: பெலிஸ்தியர் அனைவரும் ... மேலே வந்தனர்
  rationale: עלה என்பதிலுள்ள மேல்நோக்கிய பயணக் கருத்தையும், כָל என்பதிலுள்ள முழுமையையும் தக்கவைக்கிறது.
- source_word: לְבַקֵּשׁ אֶת דָּוִיד
  choice: தாவீதைத் தேடி
  rationale: בקשׁ என்பதன் அடிப்படைப் பொருளான ‘தேடுதல்’ தக்கவைக்கப்படுகிறது; பகைமையான நோக்கம் சூழலில் புலப்பட்டாலும், அதை மொழிபெயர்ப்பிலேயே மிகையாகத் தெளிவுபடுத்தவில்லை.
- source_word: וַיִּשְׁמַע דָּוִיד
  choice: தாவீது அதைக் கேள்விப்பட்டு
  rationale: முன்னர் பெலிஸ்தியர் கேள்விப்பட்டதுடன் உள்ள சொல் மீளுருவாக்கத்தைத் தக்கவைத்து, தமிழில் எதைப் பற்றிக் கேள்விப்பட்டான் என்பதையும் இயல்பாக இணைக்கிறது.
- source_word: וַיֵּצֵא לִפְנֵיהֶם
  choice: அவர்களுக்கு முன்பாகப் புறப்பட்டுச் சென்றான்
  rationale: ‘அவர்களுக்கு முன்பாக வெளியே சென்றான்’ என்ற எபிரெய உருவகத்தை இயன்றவரை தக்கவைக்கிறது; இது சந்திக்க அல்லது எதிர்கொள்ளச் சென்றதைக் குறிக்கலாம், ஆனால் மூலவசனம் அதை வெளிப்படையாகத் தீர்மானிக்கவில்லை.
