translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியக்கூடியதாயும் மரியாதைமிக்க வரலாற்று நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘அபிஷேகம்’ என்பது இச்சூழலில் பரவலாக அறியப்பட்ட வேதாகமச் சொல் என்பதால் தக்கவைக்கப்பட்டது. இறுதி சொற்றொடரின் உண்மையான பொருள்-தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
