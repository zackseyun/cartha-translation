id: 1CH.13.12
reference: 1 Chronicles 13:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יִּירָ֤א דָוִיד֙ אֶת הָ֣/אֱלֹהִ֔ים בַּ/יּ֥וֹם הַ/ה֖וּא לֵ/אמֹ֑ר הֵ֚יךְ אָבִ֣יא אֵלַ֔/י אֵ֖ת אֲר֥וֹן הָ/אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/012.yaml
  text: And David feared God that day[a], saying, “How can I bring the ark of God to me?”
translation:
  language: ta
  text: அந்த நாளில் தாவீது கடவுளுக்குப் பயந்தார். அவர், “கடவுளின் பேழையை நான் எப்படி என்னிடம் கொண்டுவர முடியும்?” என்று கூறினார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּירָא
  choice: பயந்து
  rationale: இங்கு ירא என்பது ஊசாவின் மரணமாகிய தெய்வீகத் தீர்ப்புக்குப் பிந்தைய தாவீதின் அச்சத்தை முதன்மையாகக் குறிக்கிறது. ‘பயந்து’ என்பது அச்சத்தின் உணர்வையும் பயபக்தியின் சாத்தியத்தையும் முற்றிலும் நீக்காமல் காக்கிறது.
- source_word: אֶת הָאֱלֹהִים
  choice: கடவுளுக்குப்
  rationale: எபிரெயத்தில் நேரடி செயப்படுபொருளாக இருந்தாலும், தமிழ் வழக்கில் ‘கடவுளுக்குப் பயந்தார்’ என்பதே இயல்பான அமைப்பு.
- source_word: בַּיּוֹם הַהוּא
  choice: அந்த நாளில்
  rationale: குறிப்பிட்ட அந்நாளைச் சுட்டும் இயல்பான, தெளிவான காலச் சொற்றொடர்.
- source_word: לֵאמֹר
  choice: என்றார்
  rationale: நேர்கூற்றை அறிமுகப்படுத்தும் எபிரெயச் சொல்லின் உரையாடல் செயல்பாட்டை இயல்பான தமிழில் தருகிறது.
- source_word: הֵיךְ
  choice: எப்படி ... முடியும்
  rationale: செயலின் நடைமுறைச் சாத்தியத்தையும் அதற்கான தாவீதின் தயக்கத்தையும் இயல்பான கேள்வி வடிவில் வெளிப்படுத்துகிறது.
- source_word: אָבִיא
  choice: நான் ... கொண்டுவர
  rationale: בוא என்பதன் ஹிஃபில் வடிவிலுள்ள ‘வரச் செய்/கொண்டுவா’ என்ற காரணவினைப் பொருளைத் துல்லியமாகக் காட்டுகிறது.
- source_word: אֵלַי
  choice: என்னிடம்
  rationale: தாவீதிடமா அல்லது அவன் இருக்கும் இடத்திற்கா என்பது எபிரெயத்தில் வெளிப்படையாகத் தீர்மானிக்கப்படாததால், அந்தத் திறந்த பொருளைத் தக்கவைக்கிறது.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: கடவுளின் பெட்டி
  rationale: אֲרוֹן என்பதன் அடிப்படைப் பொருளான ‘பெட்டி/பேழை’ என்பதை எளிய நவீன தமிழில் தருகிறது; இது கடவுளுக்குரிய புனிதப் பெட்டி என்பதை உடைமைத் தொடர்பு தெளிவுபடுத்துகிறது.
theological_decisions:
- issue: கடவுளின் தீர்ப்புக்கு தாவீது காட்டிய எதிர்வினையின் இயல்பு
  choice: ‘கடவுளுக்குப் பயந்து’ என்று மொழிபெயர்த்தல்
  alternative: ‘கடவுளைக் கண்டு அஞ்சினார்’ அல்லது ‘கடவுளிடம் பயபக்தி கொண்டார்’
  rationale: சூழல் ஊசாவின் மரணத்துக்குப் பிந்தைய உடனடி அச்சத்தைச் சுட்டுகிறது. அதேவேளையில், ירא என்பதில் இருக்கக்கூடிய பயபக்தியின் நிழலை அடிக்குறிப்பு வழியாகத் திறந்தவாறே வைக்கிறது; இறையியல் பதற்றத்தை மென்மைப்படுத்தவோ மிகைப்படுத்தவோ இல்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘என்னிடம்’ என்பது இலக்கின் தெளிவின்மையைப் பாதுகாக்கிறது; நேர்கூற்று இயல்பான தமிழ் வாக்கிய அமைப்பில் தரப்பட்டுள்ளது.
