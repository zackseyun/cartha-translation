  yaml_path: translation/ot/1_chronicles/013/001.yaml
  text: And David consulted with the commanders of the thousands and the hundreds[a], with every leader.
translation:
  language: ta
  text: தாவீது ஆயிரப் படைப்பிரிவுகளுக்கும் நூறுபேர் படைப்பிரிவுகளுக்கும் தளபதிகளோடும், எல்லாத் தலைவர்களோடும் ஆலோசனை செய்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּוָּעַץ
  choice: ஆலோசனை செய்தார்
  rationale: நிபால் வடிவம் பிறரோடு கலந்து ஆலோசித்தல் அல்லது கலந்துரையாடுதல் என்ற பொருளைத் தருகிறது; இத்தமிழாக்கம் அதன் பரஸ்பரமான ஆலோசனை உணர்வை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עִם
  choice: -ஓடும்
  rationale: தாவீது யாருடன் ஆலோசனை செய்தார் என்பதைக் குறிக்கும் உடனிகழ்ச்சி உறவை இயல்பான தமிழில் காட்டுகிறது.
- source_word: שָׂרֵי
  choice: பொறுப்பான தளபதிகள்
  rationale: ஆயிரம், நூறு என்ற படை அல்லது நிர்வாக அலகுகளோடு வரும் שַׂר என்பது அவற்றை வழிநடத்தும் அதிகாரிகளைக் குறிக்கிறது; சூழலில் 'தளபதிகள்' பொருத்தமானது.
- source_word: הָאֲלָפִים וְהַמֵּאוֹת
  choice: ஆயிரத்திற்கும் நூற்றிற்கும்
  rationale: எபிரேயத்தின் 'ஆயிரங்கள் மற்றும் நூறுகள்' என்பது படை அல்லது நிர்வாகப் பிரிவுகளைக் குறிக்கும் மரபுச் சொற்றொடர். தமிழில் எண்ணிக்கையையே மட்டும் கூறுவதால் ஏற்படும் தெளிவின்மையைத் தவிர்த்து, அடுத்துள்ள 'பொறுப்பான' என்பதோடு அலகுகளின் கருத்தை வெளிப்படுத்துகிறது.
- source_word: לְכָל נָגִיד
  choice: எல்லாத் தலைவர்களோடும்
  rationale: לְ இங்கு முன் கூறப்பட்ட ஆலோசனையில் பங்கேற்றவர்களின் வரம்பை விரிவாக்குகிறது. נָגִיד என்பதன் பரந்த தலைமைப் பொருளை மிகைப்படுத்தாமல் 'தலைவர்' காக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. மூலத்தின் படை/நிர்வாக அமைப்பைக் காக்கும் வகையில் 'ஆயிரத்திற்கும் நூற்றிற்கும் பொறுப்பான தளபதிகள்' என மொழிபெயர்க்கப்பட்டது; தேவையற்ற சமயப் பிரிவுசார் விளக்கம் சேர்க்கப்படவில்லை.
