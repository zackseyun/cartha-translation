translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தில் இல்லாத ‘உடன்படிக்கை’ போன்ற விளக்கச் சொற்கள் சேர்க்கப்படவில்லை; נהג என்பதிலுள்ள உண்மையான சொற்பொருள் விரிவு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
