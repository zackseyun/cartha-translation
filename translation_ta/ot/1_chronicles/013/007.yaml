source:
  edition: WLC
  text: וַ/יַּרְכִּ֜יבוּ אֶת אֲר֤וֹן הָ/אֱלֹהִים֙ עַל עֲגָלָ֣ה חֲדָשָׁ֔ה מִ/בֵּ֖ית אֲבִינָדָ֑ב וְ/עֻזָּ֣א וְ/אַחְי֔וֹ נֹהֲגִ֖ים בָּ/עֲגָלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/007.yaml
  text: So they set the ark of God on a new cart from the house of Abinadab[a], and Uzza and Ahio were guiding the cart.
translation:
  language: ta
  text: அவர்கள் அபினதாபின் வீட்டிலிருந்து தேவனுடைய பேழையை ஒரு புதிய வண்டியின்மேல் ஏற்றினார்கள். ஊசாவும் அகியோவும் அந்த வண்டியை வழிநடத்தினர்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அந்த வண்டியை ஓட்டினர்’ என்றும் மொழிபெயர்க்கலாம். இதற்கான எபிரெயச் சொல் ஒரு வாகனத்தை வழிநடத்துவதையோ ஓட்டுவதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְכִּיבוּ
  choice: ஏற்றினார்கள்
  rationale: רכב என்பதன் காரணவினை வடிவம், ஒன்றை வாகனத்தின்மேல் ஏற்றிச் செல்லும்படி வைப்பதைக் குறிக்கிறது. ‘ஏற்றினார்கள்’ என்பது இச்செயலை இயல்பாகவும் நேரடியாகவும் தெரிவிக்கிறது.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: தேவனுடைய பெட்டி
  rationale: אֲרוֹן என்பதற்கு இவ்வழிபாட்டுச் சூழலில் ‘பெட்டி’ என்பது தெளிவான தமிழ் இணை. மூலத்தில் இல்லாத ‘உடன்படிக்கை’ என்ற சொல்லைச் சேர்க்காமல் எபிரெயக் கட்டமைப்பைப் பாதுகாக்கிறது.
- source_word: עַל עֲגָלָה חֲדָשָׁה
  choice: ஒரு புதிய வண்டியின்மேல்
  rationale: עֲגָלָה என்பது பொருட்களை ஏற்றிச் செல்லும் வண்டியைக் குறிக்கிறது; חֲדָשָׁה என்ற ‘புதிய’ என்னும் விவரமும் வெளிப்படையாகத் தக்கவைக்கப்பட்டுள்ளது.
- source_word: מִבֵּית אֲבִינָדָב
  choice: அபினதாபின் வீட்டிலிருந்து
  rationale: מִן முன்னொட்டு புறப்படும் இடத்தைக் குறிக்கிறது. உடைமைத் தொடர்பை இயல்பான தமிழில் ‘அபினதாபின் வீடு’ என்று வழங்குகிறது.
- source_word: עֻזָּא
  choice: ஊசா
  rationale: எபிரெயத் தனிப்பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: אַחְיוֹ
  choice: அகியோ
  rationale: எபிரெயத் தனிப்பெயரின் ஒலியமைப்பை அணுகிய தமிழ் ஒலிபெயர்ப்பு.
- source_word: נֹהֲגִים בָּעֲגָלָה
  choice: அந்த வண்டியை வழிநடத்தினர்
  rationale: נהג என்பது வாகனத்தை நடத்துதல் அல்லது ஓட்டுதல் ஆகிய இரு நுண்பொருள்களையும் கொண்டிருக்கலாம். ‘வழிநடத்தினர்’ செயலில் கட்டுப்படுத்திச் சென்றதைக் காட்டுகிறது; ‘ஓட்டினர்’ என்ற மாற்றும் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
