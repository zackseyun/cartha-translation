id: 1CH.13.8
reference: 1 Chronicles 13:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/דָוִ֣יד וְ/כָל יִשְׂרָאֵ֗ל מְשַׂחֲקִ֛ים לִ/פְנֵ֥י הָ/אֱלֹהִ֖ים בְּ/כָל עֹ֑ז וּ/בְ/שִׁירִ֤ים וּ/בְ/כִנֹּרוֹת֙ וּ/בִ/נְבָלִ֣ים וּ/בְ/תֻפִּ֔ים וּ/בִ/מְצִלְתַּ֖יִם וּ/בַ/חֲצֹצְרֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/008.yaml
  text: And David and all Israel were celebrating before God with all their might[a], with songs, lyres, harps, tambourines, cymbals, and trumpets.
translation:
  language: ta
  text: தாவீதும் இஸ்ரவேலர் அனைவரும் கடவுளின் முன்னிலையில் தங்கள் முழு வலிமையோடு பாடல்கள், யாழ்கள், வீணைகள், தம்புருகள், கைத்தாளங்கள், எக்காளங்கள் ஆகியவற்றுடன் மகிழ்ந்து கொண்டாடிக்கொண்டிருந்தனர்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கடவுளின் முன்னிலையில் விளையாடி மகிழ்ந்துகொண்டிருந்தனர்’ என்றும் மொழிபெயர்க்கலாம்; எபிரெய வினை விழாக்கால மகிழ்ச்சியான செயலையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְשַׂחֲקִים
  choice: மகிழ்ந்து கொண்டாடிக்கொண்டிருந்தார்கள்
  rationale: שׂחק என்ற வினையின் பங்கேற்பு வடிவம் விளையாட்டுத்தனமான அல்லது விழாக்கால மகிழ்ச்சியான செயலைக் குறிக்கலாம். இசைக்கருவிகளுடன் நடைபெற்ற இந்த வழிபாட்டு ஊர்வலச் சூழலில், ‘மகிழ்ந்து கொண்டாடிக்கொண்டிருந்தார்கள்’ என்பது அதன் விழாக்கால மகிழ்ச்சியையும் தொடர்ச்சியான செயலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לִפְנֵי הָאֱלֹהִים
  choice: கடவுளுக்கு முன்பாக
  rationale: கடவுளின் முன்னிலையில் நடைபெறும் செயலைக் குறிக்கும் எபிரெயச் சொற்றொடரின் நேரான, இயல்பான தமிழ் வடிவம்.
- source_word: בְּכָל עֹז
  choice: தங்கள் முழு வலிமையோடு
  rationale: עֹז என்பது வலிமை அல்லது ஆற்றலைக் குறிக்கிறது. பன்மை எழுவாய்க்கு ஏற்றவாறு ‘தங்கள்’ சேர்க்கப்பட்டு, கொண்டாட்டத்தின் முழுமையான தீவிரம் பாதுகாக்கப்படுகிறது.
- source_word: שִׁירִים
  choice: பாடல்கள்
  rationale: பன்மை பெயர்ச்சொல்லான எபிரெய வடிவத்தை நேரடியாகப் பாதுகாக்கிறது; அது பாடுவதையும் சூழலில் உட்பொருளாகக் கொண்டுள்ளது.
- source_word: כִנֹּרוֹת
  choice: யாழ்கள்
  rationale: כִּנּוֹר பொதுவாக யாழ் வகையைச் சேர்ந்த நரம்பிசைக் கருவி எனக் கருதப்படுகிறது. தமிழில் ‘யாழ்’ மரியாதையானதும் புரிந்துகொள்ளத்தக்கதுமான நெருங்கிய இணைச்சொல்.
- source_word: נְבָלִים
  choice: வீணைகள்
  rationale: נֵבֶל என்பது כִּנּוֹר இலிருந்து வேறுபட்ட மற்றொரு நரம்பிசைக் கருவி. அதன் துல்லியமான அமைப்பு உறுதியற்றதால், ‘வீணைகள்’ என்ற பழக்கமான சொல் இரு கருவிகளுக்கிடையிலான வேறுபாட்டைப் பாதுகாக்கிறது.
- source_word: תֻפִּים
  choice: தம்புருகள்
  rationale: תֹּף என்பது கையால் அடிக்கப்படும் சட்டக வடிவ மேளம் அல்லது தம்புரு போன்ற தாளக் கருவி. ‘தம்புருகள்’ என்பது பொதுவாசகருக்கு அணுகத்தக்க தமிழ் வழக்கு.
- source_word: מְצִלְתַּיִם
  choice: கைத்தாளங்கள்
  rationale: ஒன்றோடொன்று மோதிச் சத்தமிடும் cymbals வகைக் கருவிக்கான தெளிவான தமிழ் பெயர்.
- source_word: חֲצֹצְרוֹת
  choice: எக்காளங்கள்
  rationale: சடங்கு ஊர்வலங்களில் பயன்படுத்தப்பட்ட நேரான ஊதுகருவிகளைக் குறிக்கும் சொல்லுக்கு இயல்பான தமிழ் இணை. இவ்வசனத்தில் குறிப்பிடப்படாத ‘வெள்ளி’ என்ற விவரம் சேர்க்கப்படவில்லை.
- source_word: וְדָוִיד וְכָל יִשְׂרָאֵל
  choice: தாவீதும் இஸ்ரவேலர் அனைவரும்
  rationale: இணைப்புச் சொற்களின் உறவைத் தமிழின் ‘-உம் ... -உம்’ அமைப்பில் இயல்பாகப் பாதுகாக்கிறது; ‘இஸ்ரவேலர் அனைவரும்’ என்பது தேசியக் கூட்டத்தைக் குறிக்கிறது.
theological_decisions:
- issue: הָאֱלֹהִים என்பதன் மொழிபெயர்ப்பு
  choice: கடவுள்
  alternative: அந்தக் கடவுள்
  rationale: எபிரெயத்தில் சுட்டு உருபு இருந்தாலும், இச்சூழலில் அது இஸ்ரவேலின் கடவுளைக் குறிக்கும் வழக்கமான பெயராகச் செயல்படுகிறது. ‘அந்தக் கடவுள்’ என்பது தமிழில் தேவையற்ற ஒப்பீட்டையோ தூரத்தையோ உணர்த்தக்கூடும்; எனவே ‘கடவுள்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகருக்கு எளிதில் புரியும் மரியாதையான நடை பயன்படுத்தப்பட்டுள்ளது. நீண்ட கருவிப் பட்டியல் வாசிப்பதற்கு தெளிவாக இருக்கும்படி இரண்டாவது வாக்கியமாக அமைக்கப்பட்டுள்ளது; எனினும் எல்லா கருவிகளும் மூலவரிசையிலேயே வைக்கப்பட்டுள்ளன.
