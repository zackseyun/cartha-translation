- from: தாவீதும் இஸ்ரவேலர் அனைவரும் தங்கள் முழு வலிமையோடு கடவுளுக்கு முன்பாக மகிழ்ந்து கொண்டாடிக்கொண்டிருந்தார்கள்[a]. பாடல்கள், யாழ்கள், வீணைகள், தம்புருகள், கைத்தாளங்கள், எக்காளங்கள் ஆகியவற்றுடன் அவர்கள் கொண்டாடினார்கள்.
