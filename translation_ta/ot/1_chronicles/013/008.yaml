  source_fidelity: 'மூல எபிரெயத்தின் கூறுகள் அனைத்தும் சரியாக உள்ளன: தாவீதும் இஸ்ரவேலர் அனைவரும், கடவுளின் முன்னிலையில், முழு வலிமையோடு, பாடல்களும் பட்டியலிடப்பட்ட இசைக்கருவிகளும். מְשַׂחֲקִים என்பதன் விழாக்கால மகிழ்ச்சிச் செயல் என்ற பொருளை முதன்மை மொழிபெயர்ப்பு நன்றாகக் காட்டுகிறது. ஆனால் கருவிப்பட்டியலைத் தொடர்ந்து தனி வாக்கியத்தில் மீண்டும் ‘கொண்டாடினார்கள்’ என்று கூறுவது, மூலத்தில் ஒரே வினையைச் சார்ந்துள்ள அமைப்பைத் தேவையின்றி இரட்டிப்பாக்குகிறது.'
  naturalness: ‘கடவுளின் முன்னிலையில்’ என்பது ‘கடவுளுக்கு முன்பாக’ என்பதைக் காட்டிலும் நவீன தரத் தமிழில் சற்றே இயல்பானது. கருவிப் பட்டியலை அதே வாக்கியத்தில் வைத்தால் ஓட்டமும் மூலத்தின் தொடர்பும் தெளிவாகும். ‘கொண்டாடிக்கொண்டிருந்தார்கள்’ என்பதற்குப் பதிலாக மரியாதையான உரைநடையில் ‘கொண்டாடிக்கொண்டிருந்தனர்’ பயன்படுத்தப்பட்டுள்ளது.
