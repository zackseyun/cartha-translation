  text: וַ/יִּ֣חַר לְ/דָוִ֔יד כִּֽי פָרַ֧ץ יְהוָ֛ה פֶּ֖רֶץ בְּ/עֻזָּ֑א וַ/יִּקְרָ֞א לַ/מָּק֤וֹם הַ/הוּא֙ פֶּ֣רֶץ עֻזָּ֔א עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/011.yaml
  text: And David was angry because Yahweh had broken out against Uzza[a]; so he called that place Perez-uzza to this day.
translation:
  language: ta
  text: யாவே உசாவுக்கு எதிராக உடைத்துப் பாய்ந்ததால், தாவீதுக்குக் கோபம் மூண்டது. எனவே அவன் அந்த இடத்துக்குப் ‘பேரெஸ்-உசா’[a] என்று பெயரிட்டான்; அது இன்றுவரை அவ்வாறே அழைக்கப்படுகிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பேரெஸ்-உசா’ என்பதற்கு ‘உசாவுக்கு எதிரான உடைப்பு’ அல்லது ‘உசாவுக்கு எதிரான திடீர்ப் பாய்ச்சல்’ என்று பொருள் கொள்ளலாம். யாவே ‘உடைத்துப் பாய்ந்தார்’ என்பதில் வரும் எபிரெயச் சொல்லோடு இந்தப் பெயர் சொல்விளையாட்டாக இணைகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר לְדָוִיד
  choice: தாவீதுக்குக் கோபம் மூண்டது
  rationale: חרה ל என்ற எபிரெய மரபுத்தொடர் ஒருவருக்குள் கோபம் பற்றியெழுவதைக் குறிக்கிறது. இத்தமிழாக்கம் அதன் உணர்ச்சி வலிமையை இயல்பாகத் தருகிறது; தாவீதின் கோபம் யார்மீது இருந்தது என்பதை மூலத்தைவிடத் தெளிவுபடுத்தாமல் விடுகிறது.
- source_word: כִּי
  choice: …தால்
  rationale: தாவீதின் கோபத்திற்கான காரணத்தை அறிமுகப்படுத்தும் காரணப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: פָרַץ יְהוָה פֶּרֶץ בְּעֻזָּא
  choice: யாவே உசாவுக்கு எதிராகச் சீறிப் பாய்ந்ததால்
  rationale: פרץ என்ற வினை திடீரென எல்லையை உடைத்துக்கொண்டு பாய்தல் அல்லது வெடித்தெழுதல் என்ற வலிமையான உருவகத்தைக் கொண்டது. ‘சீறிப் பாய்ந்தார்’ என்பது திடீர் தெய்வீகத் தாக்குதலை இயல்பான தமிழில் வெளிப்படுத்துகிறது; வினை–பெயர்ச்சொல் சொல்விளையாட்டு அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் நேரடியாக வரும் தேவனுடைய தனிப்பெயரைத் தமிழில் ஒலிபெயர்க்கிறது; ஒரு பட்டப்பெயரால் மாற்றவில்லை.
- source_word: בְּעֻזָּא
  choice: உசாவுக்கு எதிராக
  rationale: இந்தச் சூழலில் בְ என்பது தெய்வீகப் பாய்ச்சலின் இலக்காக உசாவைக் காட்டுகிறது; ‘எதிராக’ என்பது தமிழில் அதைத் தெளிவாகத் தருகிறது.
- source_word: וַיִּקְרָא לַמָּקוֹם הַהוּא
  choice: எனவே, அவன் அந்த இடத்துக்கு … என்று பெயரிட்டான்
  rationale: இது இடத்துக்குப் பெயரிடுவதற்கான வழக்கமான எபிரெய சொற்றொடர். காரணத்துக்கும் பெயரிடுதலுக்கும் உள்ள தொடர்பை ‘எனவே’ இயல்பாகக் காட்டுகிறது.
- source_word: פֶּרֶץ עֻזָּא
  choice: பேரேஸ்-உசா
  rationale: இடப்பெயரை மொழிபெயர்க்காமல் ஒலிபெயர்த்து, அதன் பொருளையும் முந்தைய சொல்விளையாட்டையும் அடிக்குறிப்பில் பாதுகாக்கிறது.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: இன்றுவரை அதுவே அதன் பெயராக உள்ளது
  rationale: எழுதப்பட்ட காலம்வரை அந்தப் பெயர் தொடர்ந்து பயன்பாட்டில் இருந்தது என்ற எபிரெய மரபுத்தொடரின் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற தேவனுடைய பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலவசனம் நான்கு எழுத்துகளைக் கொண்ட தேவனுடைய தனிப்பெயரைப் பயன்படுத்துகிறது. ‘யாவே’ என்ற ஒலிபெயர்ப்பு அதை ஒரு பட்டப்பெயராக மாற்றாமல் பாதுகாக்கிறது.
- issue: தாவீதின் கோபம் யார்மீது இருந்தது
  choice: கோபத்தின் இலக்கைக் குறிப்பிடாமல் விடுதல்
  alternative: தாவீது யாவேமீது கோபமடைந்தான்
  rationale: எபிரெயம் தாவீதுக்குக் கோபம் மூண்டதாகக் கூறுகிறது; ஆனால் அது யாவேமீது, நிகழ்வின்மீது, அல்லது சூழ்நிலையின்மீது என இலக்கை வெளிப்படையாகக் கூறவில்லை. ஆகவே மூலத்தின் இறையியல் பதற்றமும் தெளிவின்மையும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘சீறிப் பாய்ந்தார்’ என்ற உயிர்ப்பான சொற்றொடர் மூலத்தின் திடீர், வலிமையான פרץ உருவகத்தைத் தக்கவைக்கிறது; ‘கோபம் மூண்டது’ மரபுத்தொடரின் உணர்ச்சி வலிமையையும் இயல்பான தமிழையும் சமநிலைப்படுத்துகிறது.
