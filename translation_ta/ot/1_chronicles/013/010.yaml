base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/010.yaml
  text: Then Yahweh’s anger burned against Uzza[a], and he struck him down because he had put out his hand to the ark; and he died there before God.
translation:
  language: ta
  text: அப்போது யாவேயின் கோபம் ஊசாவுக்கு எதிராக மூண்டது. அவன் அந்தப் பெட்டியின்மேல் தன் கையை நீட்டியதால்[a], யாவே அவனை அடித்து வீழ்த்தினார்; அவன் அங்கே கடவுளின் முன்னிலையில் இறந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்தப் பெட்டியை நோக்கித் தன் கையை நீட்டியதால்.”
    reason: עַל என்ற முன்னிடைச்சொல் இச்சூழலில் பெட்டியின்மேல் அல்லது பெட்டியை நோக்கிய கைநீட்டலைக் குறிக்கக்கூடும்; செயலை அளவுக்கு மீறி குறிப்பாக்காமல் மாற்று வாசிப்பைக் காட்டுகிறது.
lexical_decisions:
- source_word: וַיִּחַר אַף יְהוָה
  choice: யாவேயின் கோபம் ... மூண்டது
  rationale: חרה אף என்ற எபிரெய மரபுத்தொடரின் தீவிரத்தையும் ‘கோபம் மூண்டது’ என்ற இயல்பான நவீனத் தமிழ் வழக்கையும் காக்கிறது.
- source_word: בְּעֻזָּא
  choice: ஊசாவுக்கு எதிராக
  rationale: இங்கு ב என்பது கோபம் எவர்மேல் திரும்பியது என்பதைக் குறிக்கிறது; ‘எதிராக’ என்பது அதைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וַיַּכֵּהוּ
  choice: அவனை அடித்து வீழ்த்தினார்
  rationale: נכה என்பது அடித்தல் அல்லது அடித்து வீழ்த்துதல் எனப் பொருள்படும்; உடனே மரணம் நிகழ்வதால் இத்தேர்வு நிகழ்வின் கடுமையைச் சூழலுக்கு ஏற்றவாறு தெரிவிக்கிறது.
- source_word: עַל אֲשֶׁר
  choice: '... நீட்டியதால்'
  rationale: தீர்ப்புக்கான காரணத்தை அறிமுகப்படுத்தும் சொற்றொடர்; தமிழில் காரண வினையெச்சம் சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: שָׁלַח יָדוֹ עַל הָאָרוֹן
  choice: அந்தப் பெட்டியின்மேல் தன் கையை நீட்டியதால்
  rationale: செய்யப்பட்ட உடல்சார்ந்த நடவடிக்கையைப் பாதுகாக்கிறது; அவனுடைய நோக்கத்தையோ தொடுதலையோ மூலத்தில் உள்ளதைவிட அதிகமாக விளக்கவில்லை.
- source_word: הָאָרוֹן
  choice: அந்தப் பெட்டி
  rationale: இவ்வசனத்தில் ‘பெட்டி’ என்பது மட்டுமே உள்ளது; முந்தைய சூழலில் குறிப்பிடப்பட்ட குறிப்பிட்ட புனிதப் பெட்டி என்பதால் ‘அந்த’ சேர்ப்பது தமிழில் இயல்பான குறித்துச் சுட்டலை அளிக்கிறது, ஆனால் ‘உடன்படிக்கை’ போன்ற இல்லாத விவரத்தைச் சேர்ப்பதில்லை.
- source_word: וַיָּמָת שָׁם
  choice: அவன் அங்கே ... இறந்தான்
  rationale: கதைநிகழ்வின் தொடரையும் שָׁם என்பதன் ‘அங்கே’ என்ற இடக்குறிப்பையும் நேரடியாகக் காக்கிறது.
- source_word: לִפְנֵי אֱלֹהִים
  choice: கடவுளின் முன்னிலையில்
  rationale: לִפְנֵי என்பதன் இடம் மற்றும் பிரசன்னம் சார்ந்த அர்த்தத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் நான்கெழுத்து இறைப்பெயர் நேரடியாக இருப்பதால், அதை பொதுப்பட்டமாக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- issue: ஒரே வசனத்தில் יְהוָה மற்றும் אֱלֹהִים வரும் வேறுபாடு
  choice: ‘யாவே’ ... ‘கடவுள்’ என இரண்டையும் காத்தல்
  alternative: இரண்டையும் ஒரே இறைப்பெயராக ஒத்திசைத்தல்
  rationale: முதல் பகுதியில் יְהוָה என்றும் இறுதியில் אֱלֹהִים என்றும் உள்ள மூலத்தின் சொல்வேறுபாட்டைத் தீர்த்துவிடாமல் பாதுகாக்கிறது.
- issue: ஊசாவின் செயலுக்கும் தண்டனைக்கும் உள்ள காரணத் தொடர்பு
  choice: ‘கையை நீட்டியதால்’ என்று மட்டும் கூறுதல்
  alternative: அவன் பெட்டியைத் தொட்டதால் அல்லது அவமதித்ததால் என்று விளக்குதல்
  rationale: עַל אֲשֶׁר காரணத்தைச் சுட்டுகிறது; ஆனால் நோக்கம், அவமதிப்பு, அல்லது தொடுதல் ஆகியவற்றை இவ்வசனத்தின் எபிரெய உரை வெளிப்படையாகக் கூறாததால் அவை சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிதில் புரியும் ஆனால் புனித வரலாற்றுக்கேற்ற கண்ணியமான நடை. எபிரெய மரபுத்தொடரின் தீவிரம் ‘கோபம் மூண்டது’ எனப் பாதுகாக்கப்பட்டுள்ளது. பெயர் ‘ஊசா’ என ஒலிபெயர்க்கப்பட்டுள்ளது; இறைப்பெயர் ‘யாவே’ என வழங்கப்பட்டுள்ளது.
