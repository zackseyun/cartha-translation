translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘மக்கள் அனைவரின் பார்வையிலும்’ என்பது மூலத்தின் மதிப்பீட்டு மரபுத்தொடரை இயல்பாகப் பாதுகாக்கிறது.
