reference: 1 Chronicles 13:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יֹּאמְר֥וּ כָֽל הַ/קָּהָ֖ל לַ/עֲשׂ֣וֹת כֵּ֑ן כִּֽי יָשַׁ֥ר הַ/דָּבָ֖ר בְּ/עֵינֵ֥י כָל הָ/עָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/004.yaml
  text: And all the assembly said to do so[a], for the matter was right in the eyes of all the people.
translation:
  language: ta
  text: கூட்டத்தினர் அனைவரும் அவ்வாறே செய்ய வேண்டும் என்று கூறினர்[a]; ஏனெனில், அந்தக் காரியம் எல்லா மக்களின் பார்வையில் சரியானதாக இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கூட்டத்தினர் அனைவரும் அவ்வாறே செய்ய ஒப்புக்கொண்டார்கள்.” எபிரெயச் சொற்றொடர், அந்தக் கூட்டம் முன்மொழிவுக்கு இசைவு தெரிவித்ததைக் காட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: ஒப்புக்கொண்டார்கள்
  rationale: அடிப்படைப் பொருள் ‘சொன்னார்கள்’ என்றாலும், לַעֲשׂוֹת כֵּן என்பதுடன் வரும் இச்சூழலில் சபையார் முன்மொழிவுக்கு இசைவு தெரிவித்ததை இயல்பான தமிழில் ‘ஒப்புக்கொண்டார்கள்’ தெளிவாக வெளிப்படுத்துகிறது; நேரடியான வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: כָל הַקָּהָל
  choice: சபையார் அனைவரும்
  rationale: קָהָל என்பது கூடிவந்த சமூகத்தைக் குறிக்கிறது. ‘சபையார்’ என்பது திருச்சபை சார்ந்த தனிப்பொருளுக்கு மட்டுப்படாமல், இங்கு கூடியிருந்த மக்களின் அவையை இயல்பாகக் குறிக்கிறது; כָל என்பதும் ‘அனைவரும்’ எனத் தக்கவைக்கப்படுகிறது.
- source_word: לַעֲשׂוֹת כֵּן
  choice: அப்படியே செய்ய
  rationale: ‘அவ்வாறு செய்ய’ என்ற எபிரெய வழக்கை நவீன, இயல்பான தமிழில் நேர்த்தியாக வெளிப்படுத்துகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: சபையாரின் இசைவுக்கான காரணத்தை அறிமுகப்படுத்தும் விளக்கத் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: יָשַׁר
  choice: சரியானதாக இருந்தது
  rationale: இச்சூழலில் முன்மொழியப்பட்ட காரியம் முறையானது அல்லது ஏற்றது என்ற மதிப்பீட்டை யָשַׁר குறிக்கிறது; ‘சரியானதாக’ என்பது இயல்பான சமமான சொல்.
- source_word: הַדָּבָר
  choice: அந்தக் காரியம்
  rationale: דָּבָר இங்கு விவாதிக்கப்படும் விஷயம் அல்லது முன்மொழிவைக் குறிக்கிறது. ‘அந்தக் காரியம்’ சூழலைத் தெளிவாகச் சுட்டுகிறது; ‘திட்டம்’ என்று மொழிபெயர்த்து விளக்கத்தைச் சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: בְּעֵינֵי
  choice: பார்வையிலும்
  rationale: ‘கண்களில்’ என்ற சொற்சொல் வடிவத்தைவிட, ஒருவரின் மதிப்பீட்டில் அல்லது கண்ணோட்டத்தில் என்பதைக் குறிக்கும் எபிரெய மரபுத்தொடரை ‘பார்வையில்’ இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: כָל הָעָם
  choice: மக்கள் அனைவரின்
  rationale: עָם மக்களை ஒட்டுமொத்தமாகக் குறிக்கிறது; כָל என்பதன் முழுமையும் ‘அனைவரின்’ எனப் பாதுகாக்கப்படுகிறது.
