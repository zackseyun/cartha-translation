  to: கூட்டத்தினர் அனைவரும் அவ்வாறே செய்ய வேண்டும் என்று கூறினர்[a]; ஏனெனில், அந்தக் காரியம் எல்லா மக்களின் பார்வையில் சரியானதாக இருந்தது.
