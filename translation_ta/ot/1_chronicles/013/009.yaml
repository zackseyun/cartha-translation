base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/009.yaml
  text: When they came to the threshing floor of Kidon[a], Uzza reached out his hand to take hold of the ark, because the oxen stumbled.
translation:
  language: ta
  text: அவர்கள் கீதோனின் தானியம் போரடிக்கும் களத்திற்கு வந்தபோது, மாடுகள் தடுமாறியதால் ஊசா தன் கையை நீட்டிப் பேழையைப் பிடித்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மாடுகள் வழுக்கியதால்.” எபிரெய வினைச்சொல் வழுக்குவதையோ எதையாவது நழுவவிடுவதையோ குறிக்கலாம்; இங்கே அது மாடுகள் நிலையிழந்து அசைந்ததைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּרֶן כִּידֹן
  choice: கீதோனின் போரடிக்கும் களம்
  rationale: גֹּרֶן என்பது தானியத்திலிருந்து பதரைப் பிரிக்கும் களம்; כִּידֹן இடப்பெயராக ஒலிபெயர்க்கப்படுகிறது.
- source_word: וַיִּשְׁלַח ... אֶת יָדוֹ
  choice: தன் கையை நீட்டி
  rationale: கையை நீட்டுதல் என்ற எபிரெய மரபுத்தொடரின் உடல்செயலை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: לֶאֱחֹז
  choice: பிடித்தான்
  rationale: אחז என்பதன் பற்றிக்கொள்ளுதல் என்ற பொருளைத் தருகிறது; பகைமையான கைப்பற்றுதலைக் குறிப்பதில்லை.
- source_word: הָאָרוֹן
  choice: பெட்டி
  rationale: மூலத்தில் உள்ள definite noun-ஐ மட்டும் மொழிபெயர்த்து, இவ்வசனத்தில் இல்லாத ‘தேவனுடைய’ என்பதைச் சேர்க்கவில்லை.
- source_word: כִּי
  choice: -ஆல்
  rationale: ஊசாவின் செயலுக்கான காரணத்தை இயல்பான தமிழ் காரண விகுதியால் தெளிவுபடுத்துகிறது.
- source_word: שָׁמְטוּ
  choice: தடுமாறின
  rationale: வினைச்சொல் வழுக்குதல் அல்லது நழுவவிடுதல் ஆகிய பொருட்களை ஏற்கக்கூடும்; மாடுகளை எழுவாயாகக் கொண்ட சூழலில் நிலையிழந்த அசைவை ‘தடுமாறின’ என இயல்பாகக் காட்டுகிறது.
- source_word: הַבָּקָר
  choice: மாடுகள்
  rationale: בָּקָר பொதுவாக மாட்டினத்தைக் குறிக்கும்; வண்டி இழுக்கும் சூழலில் இயல்பான தமிழ் சொல்லாக ‘மாடுகள்’ பயன்படுத்தப்படுகிறது.
