base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/014.yaml
  text: And the ark of God remained with the household of Obed-edom[a], in his house, for three months. And Yahweh blessed the household of Obed-edom and all that belonged to him.
translation:
  language: ta
  text: தேவனுடைய பேழை ஓபேத்-ஏதோமின் குடும்பத்தாருடன்[a], அவனுடைய வீட்டில் மூன்று மாதங்கள் இருந்தது. யாவே ஓபேத்-ஏதோமின் குடும்பத்தாரையும் அவனுக்குச் சொந்தமான அனைத்தையும் ஆசீர்வதித்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, முதல் மற்றும் கடைசி இடங்களில் ‘ஓபேத்-ஏதோமின் வீடு’; எபிரெய மொழியிலுள்ள בֵּית என்ற சொல் கட்டடமான வீட்டையோ குடும்பம் அல்லது வீட்டாரையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: இருந்தது
  rationale: ישׁב என்பது உட்காருதல், குடியிருத்தல் அல்லது தொடர்ந்து இருத்தல் எனப் பொருள்படலாம். பெட்டி தற்காலிகமாக அங்கே வைக்கப்பட்டிருந்த சூழலில், இயல்பான தமிழில் ‘இருந்தது’ அதன் தொடர்ந்த இருப்பைத் தெரிவிக்கிறது.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: தேவனுடைய பெட்டி
  rationale: எபிரெயச் சொற்றொடர் நேரடியாக ‘தேவனுடைய பெட்டி’ என்றே உள்ளது; ‘உடன்படிக்கைப் பெட்டி’ என்ற விரிவான பெயர் இவ்வசனத்தில் இல்லை.
- source_word: עִם בֵּית עֹבֵד אֱדֹם
  choice: ஓபேத்-ஏதோமின் குடும்பத்தாருடன்
  rationale: בֵּית என்பது கட்டடமான வீட்டையோ குடும்பம்/வீட்டாரையோ குறிக்கலாம். அடுத்த சொற்றொடர் ‘அவனுடைய வீட்டில்’ என்று இடத்தைக் குறிப்பதால், இங்கே சமூகக் குழுவைக் குறிக்கும் ‘குடும்பத்தார்’ இயல்பானது; வேறு சாத்தியம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: בְּבֵיתוֹ
  choice: அவனுடைய வீட்டில்
  rationale: இது பெட்டி இருந்த பௌதிக இடத்தைக் குறிப்பிடுகிறது; ஆகவே ‘வீட்டில்’ என்ற நேரடியான சொல் பயன்படுத்தப்பட்டுள்ளது.
- source_word: שְׁלֹשָׁה חֳדָשִׁים
  choice: மூன்று மாதங்கள்
  rationale: காலநீட்சியைத் தமிழில் இயல்பாகவும் துல்லியமாகவும் தெரிவிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் வரும் தேவனுடைய தனிப்பெயரான יהוה ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: אֶת בֵּית עֹבֵד אֱדֹם
  choice: ஓபேத்-ஏதோமின் குடும்பத்தாரை
  rationale: ஆசீர்வாதம் கட்டடத்தை மட்டும் அல்லாமல் வீட்டாரை நோக்கியதாக இருப்பதால் ‘குடும்பத்தார்’ என மொழிபெயர்க்கப்பட்டுள்ளது; ‘வீடு’ என்ற மாற்று பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וְאֶת כָּל אֲשֶׁר לוֹ
  choice: அவனுக்குச் சொந்தமான அனைத்தையும்
  rationale: அவனுடைய உடைமைகள் மற்றும் அவனோடு தொடர்புடைய அனைத்தையும் உள்ளடக்கக்கூடிய எபிரெயச் சொற்றொடரின் பரந்த பொருளை இது காக்கிறது.
theological_decisions:
- issue: יהוה என்ற தேவனுடைய பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலவசனம் יהוה என்ற தனிப்பெயரை நேரடியாகப் பயன்படுத்துவதால், பட்டப்பெயராக மாற்றாமல் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. பெயர் ‘ஓபேத்-ஏதோம்’ என்றும் தேவனுடைய தனிப்பெயர் ‘யாவே’ என்றும் ஒலிபெயர்க்கப்பட்டுள்ளன. ‘குடும்பத்தார்’ மற்றும் ‘வீடு’ என்பவற்றின் வேறுபாடு முதன்மை உரையில் தெளிவாக்கப்பட்டாலும், எபிரெயச் சொல்லின் உண்மையான இருபொருள் வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
