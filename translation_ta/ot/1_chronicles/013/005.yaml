  text: וַ/יַּקְהֵ֤ל דָּוִיד֙ אֶת כָּל יִשְׂרָאֵ֔ל מִן שִׁיח֥וֹר מִצְרַ֖יִם וְ/עַד לְב֣וֹא חֲמָ֑ת לְ/הָבִיא֙ אֶת אֲר֣וֹן הָ/אֱלֹהִ֔ים מִ/קִּרְיַ֖ת יְעָרִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/005.yaml
  text: So David assembled all Israel[a], from the Shihor of Egypt to Lebo-hamath[b], to bring the ark of God from Kiriath-jearim.
translation:
  language: ta
  text: தாவீது, எகிப்தின் சீகோரிலிருந்து[a] லெபோ-காமாத்வரை[b] இஸ்ரவேல் முழுவதையும் ஒன்றுகூட்டினார்; கடவுளின் பேழையைக் கீரியாத்-யெயாரீமிலிருந்து கொண்டுவருவதற்காகவே அவர் இவ்வாறு செய்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “எகிப்தின் சீகோர்” என்பது தெற்கு எல்லையைக் குறிக்கும் பெயர்; இதை “எகிப்தின் ஓடை” என்றும் சிலர் புரிந்துகொள்கின்றனர்.
    reason: cultural_note
  - marker: b
    text: அல்லது, சொல்லுக்கு நெருக்கமாக, “காமாத்தின் நுழைவிடம் வரை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְהֵל
  choice: ஒன்றுகூட்டினார்
  rationale: கהל என்பதன் ஹிஃபீல் வடிவம் மக்களை ஒன்றாகக் கூடச்செய்வதைக் குறிக்கிறது; இங்கு தேசிய அளவிலான கூட்டத்திற்குப் பொருத்தமான இயல்பான தமிழ் இது.
- source_word: כָּל יִשְׂרָאֵל
  choice: இஸ்ரவேல் முழுவதையும்
  rationale: எபிரெய மொழியின் கூட்டு தேசியச் சொல்லாட்சியைப் பேணுகிறது; இது ஒவ்வொரு தனிநபரையும் கட்டாயமாகக் குறிக்காமல், முழு நாட்டையும் பிரதிநிதித்துவ முறையில் குறிக்கலாம்.
- source_word: מִן שִׁיחוֹר מִצְרַיִם
  choice: எகிப்தின் சீகோரிலிருந்து
  rationale: שִׁיחוֹר என்பதை இடப்பெயராக ஒலிபெயர்ப்பது மூலத்தின் தெளிவின்மையைப் பேணுகிறது; குறிப்பிட்ட நீர்நிலையோடு அதை முதன்மை உரையிலேயே அடையாளப்படுத்துவதைத் தவிர்க்கிறது.
- source_word: וְעַד לְבוֹא חֲמָת
  choice: லெபோ-காமாத்வரை
  rationale: சொல்லுக்கு நெருக்கமாக ‘காமாத்தின் நுழைவிடம் வரை’ என்று பொருள்படலாம்; ஆனால் இத்தொடர் அறியப்பட்ட எல்லை இடப்பெயராகவும் செயல்படுவதால் ஒலிபெயர்ப்பு முதன்மை உரையில் வைக்கப்பட்டு, நேரடியான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: לְהָבִיא
  choice: கொண்டுவருவதற்காக
  rationale: இறந்தெச்சம் நோக்கத்தை வெளிப்படுத்துகிறது; தமிழில் நோக்க உறவைத் தெளிவாகக் காட்டுகிறது.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: கடவுளின் பெட்டி
  rationale: கட்டமைப்புத் தொடரை நேரடியாக மொழிபெயர்க்கிறது; אָרוֹן என்பதன் அடிப்படைப் பொருளான பெட்டியை எளிய, புரிந்துகொள்ளத்தக்க தமிழில் தருகிறது.
- source_word: מִקִּרְיַת יְעָרִים
  choice: கீரியாத்-யெயாரீமிலிருந்து
  rationale: எபிரெய இடப்பெயரைத் தமிழில் நெருக்கமாக ஒலிபெயர்த்து அதன் தனிப்பெயர்த் தன்மையைப் பேணுகிறது.
