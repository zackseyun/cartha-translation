- from: தாவீது இஸ்ரவேலின் சபையார் அனைவரிடமும், “இது உங்களுக்கு நல்லதாகத் தோன்றினால், நம் கடவுளாகிய யாவேயிடமிருந்து வந்ததாகவும் இருந்தால், இஸ்ரவேலின் எல்லாப் பகுதிகளிலும்[c] எஞ்சியிருக்கும் நம் சகோதரர்களுக்கும்[b], அவர்களோடு தங்களுக்குரிய மேய்ச்சல் நிலங்களுள்ள நகரங்களில்[d] இருக்கும் ஆசாரியர்களுக்கும் லேவியர்களுக்கும் நாம் பரவலாகச் செய்தி அனுப்புவோம்[a]; அவர்கள் நம்மிடம் ஒன்றுகூடி வரட்டும்” என்றான்.
