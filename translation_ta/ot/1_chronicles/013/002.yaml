base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/002.yaml
  text: And David said to all the assembly of Israel[a], “If it seems good to you, and if it is from Yahweh our God, let us send word to our brothers who remain in all the lands of Israel, and also to the priests and Levites with them in the cities of their pasturelands[d][c][b], that they may gather to us.”
translation:
  language: ta
  text: தாவீது இஸ்ரவேலின் சபையினர் அனைவரிடமும், “இது உங்களுக்கு நல்லதாகத் தோன்றினால், நம் கடவுளாகிய யாவேயிடமிருந்து வந்தது என்றால், இஸ்ரவேலின் எல்லாப் பகுதிகளிலும்[c] எஞ்சியிருக்கும் நம் சகோதரர்களுக்கும்[b], அவர்களோடு தங்களுக்குரிய மேய்ச்சல் நிலங்களுள்ள நகரங்களில் இருக்கும் ஆசாரியர்களுக்கும் லேவியர்களுக்கும் நாம் எங்கும் செய்தி அனுப்புவோம்[a]; அவர்கள் நம்மிடம் ஒன்றுகூடி வரட்டும்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்கு சொல், “நாம் உடைத்துக்கொண்டு வெளியேறுவோம்; நாம் அனுப்புவோம்.” இந்தத் தொடர் எங்கும் பரவலாகச் செய்தி அனுப்புவதைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இங்கு “சகோதரர்கள்” என்பது சக இஸ்ரவேலர்களைப் பொதுவாகக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “இஸ்ரவேலின் எல்லா நிலப்பகுதிகளிலும்”; எபிரெயத்தில் “நிலங்கள்” என்பது பன்மையில் உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: קְהַל
  choice: சபையார்
  rationale: கூடியிருந்த இஸ்ரவேலின் தேசிய மக்கள்குழுவைக் குறிக்கிறது; இயல்பான தமிழில் மக்களையும் கூட்டத்தையும் ஒருங்கே உணர்த்துகிறது.
- source_word: אִם עֲלֵיכֶם טוֹב
  choice: இது உங்களுக்கு நல்லதாகத் தோன்றினால்
  rationale: மக்களின் ஒப்புதலைக் கோரும் எபிரெய மரபுத்தொடரின் பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: וּמִן יְהוָה אֱלֹהֵינוּ
  choice: நம் கடவுளாகிய யாவேயிடமிருந்து வந்ததாகவும் இருந்தால்
  rationale: மக்களின் ஒப்புதலோடு இறை அங்கீகாரத்தையும் இணைக்கும் மறைமுக நிபந்தனையைத் தமிழில் தெளிவுபடுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநாமத்தின் நான்கு எபிரெய மெய்யெழுத்துகளைக் குறிக்கும் வழக்கமான தமிழ் ஒலிபெயர்ப்பு; பொதுப்பட்டப் பெயராக மாற்றவில்லை.
- source_word: נִפְרְצָה נִשְׁלְחָה
  choice: நாம் பரவலாகச் செய்தி அனுப்புவோம்
  rationale: முதற் வினையின் ‘உடைத்துக்கொண்டு பரவுதல்’ என்ற படிமம் அடுத்துள்ள ‘அனுப்புதல்’ வினையின் பரந்த வீச்சை வலியுறுத்துவதாகப் புரிந்துகொள்ளப்படுகிறது; மறைந்துள்ள செய்தி அல்லது அழைப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: עַל אַחֵינוּ
  choice: நம் சகோதரர்களுக்கும்
  rationale: இங்கு ‘சகோதரர்கள்’ என்பது சக இஸ்ரவேலர்களை பிரதிநிதித்துவ முறையில் குறிக்கிறது; அனுப்புதலின் பெறுநர்களாக உள்ளதால் நான்காம் வேற்றுமை பயன்படுத்தப்பட்டது.
- source_word: הַנִּשְׁאָרִים
  choice: எஞ்சியிருக்கும்
  rationale: அப்பகுதிகளில் தொடர்ந்து வசிக்கும் மற்ற இஸ்ரவேலர்களைக் குறிக்கிறது; ‘மீதியானோர்’ என்ற தனித் தெய்வியல் பொருளைத் தேவையின்றி சேர்க்கவில்லை.
- source_word: בְּכֹל אַרְצוֹת יִשְׂרָאֵל
  choice: இஸ்ரவேலின் எல்லாப் பகுதிகளிலும்
  rationale: எபிரெய உரையின் பன்மையைப் பகுதிகள் என இயல்பாகக் காத்து, பரந்த நிலப்பரப்பைக் காட்டுகிறது.
- source_word: מִגְרְשֵׁיהֶם
  choice: தங்களுக்குரிய மேய்ச்சல் நிலங்கள்
  rationale: லேவிய நகரங்களோடு இணைந்திருந்த திறந்த வெளி அல்லது கால்நடை மேய்க்கும் நிலங்களைக் குறிக்கிறது.
- source_word: וְיִקָּבְצוּ אֵלֵינוּ
  choice: அவர்கள் நம்மிடம் ஒன்றுகூடி வரட்டும்
  rationale: அழைப்பின் நோக்கத்தையும் ‘எங்களிடம்’ என்ற திசைநிலையையும் இயல்பாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைத் திருநாமத்தை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூல உரை பொதுவான ‘ஆண்டவர்’ என்ற பட்டத்தை அல்ல, இறைவனின் தனிப்பட்ட உடன்படிக்கைத் திருநாமத்தை நேரடியாகப் பயன்படுத்துகிறது; எனவே அதை ஒலிபெயர்த்தது.
- issue: மக்களின் ஒப்புதலும் இறை அங்கீகாரமும்
  choice: இரண்டையும் நிபந்தனைகளாக வைத்தல்
  alternative: இறைவனிடமிருந்து வந்தது என்று உறுதியாகக் கூறுதல்
  rationale: எபிரெய தொடரமைப்பு ‘இது உங்களுக்கு நல்லதாக இருந்தால்’ என்பதோடு ‘யாவேயிடமிருந்து’ என்பதையும் இணைக்கிறது; தாவீது இங்கே வெளிப்படுத்தும் நிபந்தனைத் தன்மையையும் பதற்றத்தையும் தீர்த்துவிடாமல் காக்கிறது.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க, பொதுமக்கள் எளிதில் புரிந்துகொள்ளக்கூடிய தமிழ் பயன்படுத்தப்பட்டது. அரசவைக் கடினநடை தவிர்க்கப்பட்டாலும் ‘சபையார்’, ‘ஆசாரியர்கள்’, ‘லேவியர்கள்’ போன்ற வரலாற்று-வேதாகமச் சொற்கள் காக்கப்பட்டன. மூலத்தின் நீண்ட ஒரே வாக்கிய அமைப்பும் நிபந்தனைத் தொனியும் இயன்றவரை பாதுகாக்கப்பட்டன.
