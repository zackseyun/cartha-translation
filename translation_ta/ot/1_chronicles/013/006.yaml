  naturalness: '''கடவுளின் பெட்டி'' என்பதற்குப் பதிலாக வேதாகமச் சூழலில் இயல்பாகவும் நிறுவப்பட்டும் உள்ள ''கடவுளின் பேழை'' பயன்படுத்தப்பட்டுள்ளது. இடப்பெயர்களின் இணை அடையாளம் தெளிவாக அமைக்கப்பட்டு, இரண்டாவது வாக்கியத்தில் மீண்டும் வரும் ''போனார்கள்'' தவிர்க்கப்பட்டுள்ளது.'
  terminology: யְהוָה-வுக்கு 'யாவே' தக்கது. 'கேருபீன்கள்', 'வீற்றிருக்கும்', 'பேழை' ஆகியவை மரியாதையான நவீன வேதாகமத் தமிழுக்கு ஏற்றவை. இறுதிக் கூற்றில் 'யாவேயின் பெயர் அதன்மேல் அழைக்கப்படும்' என்பது மூலத்தின் செயப்பாட்டு அமைப்பையும் பேழையுடனான தொடர்பையும் காக்கிறது; அடிக்குறிப்பு மாற்று இணைப்பை வழங்குகிறது.
  issues:
