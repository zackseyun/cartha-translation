revisions:
- from: எனவே தாவீதும் இஸ்ரவேலர் அனைவரும் யூதாவைச் சேர்ந்த கீரியாத்-யெயாரீம் என்னும் பாகாலாவுக்குப் போனார்கள். கேருபீன்களுக்கு மேலாக அரியணையில் அமர்ந்திருக்கும் யாவே என்னும் பெயர் அதன்மேல் அழைக்கப்படும் கடவுளின் பெட்டியை அங்கிருந்து கொண்டுவருவதற்காகப் போனார்கள்.[a]
  to: தாவீதும் இஸ்ரவேலர் அனைவரும் பாகாலாவுக்கு, அதாவது யூதாவைச் சேர்ந்த கீரியாத்-யெயாரீமுக்கு, மேலே சென்றார்கள். கேருபீன்களுக்கு மேலாக அரியணையில் வீற்றிருக்கும் யாவேயின் பெயர் அதன்மேல் அழைக்கப்படும் கடவுளின் பேழையை அங்கிருந்து கொண்டுவரவே அவர்கள் சென்றார்கள்.[a]
  rationale: இடத்தின் இரட்டைப் பெயரிடல், யூதாவுடனான தொடர்பு, பயணத்தின் நோக்கம், யாவே என்ற இறைப்பெயர், கேருபீன்களோடு தொடர்புடைய அரியணை உருவகம் ஆகியவை காக்கப்பட்டுள்ளன. இறுதிக் கூற்று முதன்மை உரையில் செயப்பாட்டு வடிவோடு தரப்பட்டு, அதன் மாற்று இயல்பான வாசிப்பு அடிக்குறிப்பில் வழங்கப்பட்டுள்ளது.
