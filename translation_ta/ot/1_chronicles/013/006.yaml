base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/006.yaml
  text: So David and all Israel went up to Baalah[a], that is, to Kiriath-jearim, which belongs to Judah, to bring up from there the ark of God, Yahweh who is enthroned above the cherubim, whose name is called upon it.
translation:
  language: ta
  text: தாவீதும் இஸ்ரவேலர் அனைவரும் பாகாலாவுக்கு, அதாவது யூதாவைச் சேர்ந்த கீரியாத்-யெயாரீமுக்கு, மேலே சென்றார்கள். கேருபீன்களுக்கு மேலாக அரியணையில் வீற்றிருக்கும் யாவேயின் பெயர் அதன்மேல் அழைக்கப்படும் கடவுளின் பேழையை அங்கிருந்து கொண்டுவரவே அவர்கள் சென்றார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, இயல்பான சொல்லாக்கத்தில்: “கேருபீன்களுக்கு மேலாக அரியணையில் வீற்றிருக்கும் யாவேயின் பெயரால் அழைக்கப்படும் கடவுளின் பேழையை.” 2 சாமுவேல் 6:2-ஐ ஒப்பிடுக.'
    reason: மூல எபிரெயத்தின் இறுதிக் கூற்று சுருக்கமாக உள்ளது. பெயர் பேழையின்மேல் அழைக்கப்படுவதாகவும், பேழை யாவேயின் பெயரால் அழைக்கப்படுவதாகவும் தொடர்புபடுத்தி வாசிக்க முடியும்.
lexical_decisions:
- source_word: וַיַּעַל
  choice: போனார்கள்
  rationale: עלה என்பதில் மேலே செல்லுதல் என்ற திசை உணர்வு இருந்தாலும், இங்கு பயணச் சூழலில் இயல்பான தமிழுக்காக ‘போனார்கள்’ என வழங்கப்பட்டது; பின்னர் வரும் அதே வேரின் காரணவினை ‘கொண்டுவருவதற்காக’ என மொழிபெயர்க்கப்பட்டது.
- source_word: בַּעֲלָתָה אֶל קִרְיַת יְעָרִים
  choice: கீரியாத்-யெயாரீம் என்னும் பாகாலாவுக்கு
  rationale: இரு பெயர்களும் ஒரே இடத்தைக் குறிப்பதை ‘என்னும்’ தெளிவாக்குகிறது; எபிரெய வடிவுக்கு ஏற்ற ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டது.
- source_word: אֲשֶׁר לִיהוּדָה
  choice: யூதாவைச் சேர்ந்த
  rationale: לִיהוּדָה என்பது யூதாவின் கோத்திரப் பகுதிக்குரிய தொடர்பைக் குறிக்கிறது; ‘சேர்ந்த’ என்பது இருப்பிடத்தையும் தொடர்பையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לְהַעֲלוֹת מִשָּׁם
  choice: அங்கிருந்து கொண்டுவருவதற்காக
  rationale: பெட்டியை அந்த இடத்திலிருந்து எடுத்துவரும் நோக்கத்தை இயல்பான தமிழில் தருகிறது; ‘மேலே கொண்டுவர’ என்பதைக் காட்டிலும் சூழலில் தெளிவாக உள்ளது.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: கடவுளின் பெட்டி
  rationale: אֲרוֹן என்பதன் அடிப்படைப் பொருள் பெட்டி; மதப்பிரிவு சார்ந்த கூடுதல் சொல்லாக்கம் இன்றி நேரடியாக வழங்கப்பட்டது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எழுத்துகளைக் கொண்ட இறைப்பெயரை பட்டப்பெயராக மாற்றாமல், தமிழில் பொதுவாகப் புரியக்கூடிய ஒலிபெயர்ப்பில் வழங்குகிறது.
- source_word: יוֹשֵׁב הַכְּרוּבִים
  choice: கேருபீன்களுக்கு மேலாக அரியணையில் அமர்ந்திருக்கும்
  rationale: יֹשֵׁב என்பதிலுள்ள அரசரின் அரியணை உருவகத்தை வெளிப்படுத்துகிறது; எபிரெயத்தில் வெளிப்படையான முன்னிடைச்சொல் இல்லாததால் உறவை அளவுக்கு மீறித் துல்லியப்படுத்தாமல் ‘மேலாக’ என வழங்கப்பட்டது.
- source_word: אֲשֶׁר נִקְרָא שֵׁם
  choice: என்னும் பெயர் அதன்மேல் அழைக்கப்படும்
  rationale: சுருக்கமான, இலக்கணத் தெளிவில்லாத எபிரெயக் கூற்றின் செயப்பாட்டு வடிவத்தையும் பெட்டியோடு பெயருக்குள்ள தொடர்பையும் காக்கிறது; வேறு சாத்தியமான வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்னும் இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் தனிப்பட்ட இறைப்பெயர் நேரடியாக இருப்பதால், அதை பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்ப்பது மூல வேறுபாட்டைக் காக்கிறது.
- issue: אֲשֶׁר נִקְרָא שֵׁם என்னும் இறுதிக் கூற்றின் தொடர்பு
  choice: யாவே என்னும் பெயர் அதன்மேல் அழைக்கப்படும் கடவுளின் பெட்டி
  alternative: ‘கேருபீன்களுக்கு மேலாக அரியணையில் அமர்ந்திருக்கும் யாவே’ என்ற பெயரால் அழைக்கப்படும் கடவுளின் பெட்டி
  rationale: எபிரெயம் சுருக்கமாகவும் தொடர்பு தெளிவில்லாமலும் உள்ளது. முதன்மை உரை ‘பெயர் அதன்மேல் அழைக்கப்படுகிறது’ என்ற வடிவத்தைப் பாதுகாக்கிறது; பெயர் பெட்டியை அடையாளப்படுத்துகிறது என்ற இயல்பான வாசிப்பு அடிக்குறிப்பில் வைக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் மரியாதைமிக்கதாகவும் அமைக்கப்பட்டது. இடப்பெயர்களும் இறைப்பெயரும் ஒலிபெயர்க்கப்பட்டன. நீண்ட எபிரெய வாக்கியம் வாசிப்புத் தெளிவுக்காக தமிழில் இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டது; இறுதிக் கூற்றின் உண்மையான ambiguity அடிக்குறிப்புடன் பாதுகாக்கப்பட்டது.
