source:
  edition: WLC
  text: וְ/לֹֽא הֵסִ֨יר דָּוִ֧יד אֶת הָ/אָר֛וֹן אֵלָ֖י/ו אֶל עִ֣יר דָּוִ֑יד וַ/יַּטֵּ֕/הוּ אֶל בֵּ֥ית עֹבֵֽד אֱדֹ֖ם הַ/גִּתִּֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/013.yaml
  text: So David did not bring the ark to himself[a], into the City of David; instead[b], he turned it aside to the house of Obed-edom the Gittite.
translation:
  language: ta
  text: தாவீது பெட்டியைத் தன்னிடமாகத் தாவீதின் நகரத்துக்குக் கொண்டுவரவில்லை[a]; அதற்குப் பதிலாக, அதைக் கித்தியனாகிய ஓபேத்-ஏதோமின் வீட்டுக்குத் திருப்பிவிட்டான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பெட்டியைத் தன்னிடமாக அகற்றவில்லை” அல்லது “எடுத்துச் செல்லவில்லை.” எபிரெய வினைச்சொல் “அகற்று” எனப் பொருள்படலாம்; இச்சூழலில் “கொண்டுவா” அல்லது “எடுத்துச் செல்” என்ற பொருளும் தருகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அதைத் திருப்பினான்” அல்லது “அதை ஓரமாகக் கொண்டு சென்றான்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵסִיר
  choice: கொண்டுவரவில்லை
  rationale: ஹிப்இல் வடிவிலுள்ள இந்த வினைச்சொல் அடிப்படையில் ‘அகற்றுதல்’ அல்லது ‘விலக்குதல்’ எனப் பொருள்படலாம். ஆனால் பெட்டியும் அதைச் சேர்க்கவிருந்த இடமும் குறிப்பிடப்படும் இச்சூழலில், இயல்பான தமிழில் ‘கொண்டுவரவில்லை’ என்பது கருத்தைத் தெளிவாக வெளிப்படுத்துகிறது; மூலத்தின் சொற்பொருள் மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: אֵלָיו
  choice: தன்னிடம்
  rationale: சொல்லுக்குச் சொல் ‘அவனிடம்’ என்றாலும், எழுவாய் தாவீது என்பதால் இங்கு தற்சுட்டுப் பொருள் உள்ளது. ‘தன்னிடம்’ என்பது அதைத் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: עִיר דָּוִיד
  choice: தாவீதின் நகரம்
  rationale: இது நிலையான இடப்பெயர்; ‘தாவீதின் நகரம்’ என்பது தமிழில் தெளிவான, வழக்கமான வடிவம்.
- source_word: וַיַּטֵּהוּ
  choice: அதைக் ... திருப்பிவிட்டான்
  rationale: נטה என்பதன் ‘திருப்புதல்/விலக்குதல்’ என்ற தெளிவான இயக்கப் பொருளை இது காக்கிறது. திட்டமிட்ட பாதையிலிருந்து பெட்டி வேறு இடத்திற்குத் திருப்பப்பட்டதைச் சூழல் காட்டுகிறது.
- source_word: בֵּית
  choice: வீட்டுக்கு
  rationale: בַּיִת என்பது ‘வீடு’ அல்லது ‘குடும்பம்’ என இருக்கலாம். பெட்டி தங்கவைக்கப்பட்ட இடத்தைச் சுட்டும் இச்சூழலில் ‘வீடு’ நேரடியான பொருள்.
- source_word: עֹבֵד אֱדֹם
  choice: ஓபேத்-ஏதோம்
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் வாசிக்கத்தக்க வகையில் எழுத்துப்பெயர்த்த வடிவம்.
- source_word: הַגִּתִּי
  choice: கித்தியன்
  rationale: காத் ஊரைச் சேர்ந்தவரைக் குறிக்கும் இன/ஊரடைமொழியை நேரடியாகவும் சுருக்கமாகவும் தருகிறது.
