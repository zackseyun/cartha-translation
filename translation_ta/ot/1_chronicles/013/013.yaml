  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘பெட்டி’ என்பது உடன்படிக்கைப் பெட்டியைக் குறிக்கும் சூழல்சார் வேதாகமச் சொல். மூலத்தில் உள்ள இரண்டு இயக்க வினைகளின் வேறுபாடு முதன்மை உரையிலும் அடிக்குறிப்புகளிலும் பாதுகாக்கப்பட்டுள்ளது.
