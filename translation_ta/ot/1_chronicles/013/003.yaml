source:
  edition: WLC
  text: וְ/נָסֵ֛בָּה אֶת אֲר֥וֹן אֱלֹהֵ֖י/נוּ אֵלֵ֑י/נוּ כִּי לֹ֥א דְרַשְׁנֻ֖/הוּ בִּ/ימֵ֥י שָׁאֽוּל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/003.yaml
  text: And let us bring the ark of our God back to us[a], for we did not seek it in the days of Shaul.
translation:
  language: ta
  text: “நம் கடவுளின் பேழையை நம்மிடம் திரும்பக் கொண்டுவருவோம்; ஏனெனில் ஷாவுலின் நாட்களில் நாம் அதை நாடவில்லை[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதனிடம் விசாரிக்கவில்லை”; அல்லது, “அவரை நாடவில்லை” / “அவரிடம் விசாரிக்கவில்லை.” எபிரெய வினைச்சொல் ‘நாடுதல்’ அல்லது ‘விசாரித்தல்’ என்ற பொருளைக் கொள்ளலாம். பின்னொட்டு பேழையைக் குறிக்கலாம்; சில மொழிபெயர்ப்புகள் அதை கடவுளைக் குறிப்பதாகப் புரிந்துகொள்கின்றன.
    reason: דרש வினைச்சொல்லின் பொருள் வரம்பையும், ஆண்பால் ஒருமைப் பின்னொட்டின் பேழை அல்லது கடவுள் என்ற சாத்தியமான குறிப்பையும், ஒரு விளக்கத்தை முதன்மைப்படுத்தாமல் தெளிவுபடுத்துதல்.
lexical_decisions:
- source_word: וְנָסֵבָּה
  choice: திரும்பக் கொண்டுவருவோம்
  rationale: סבב என்பதன் முதலாம் நபர் பன்மைக் cohortative வடிவம் இச்சூழலில் பேழையை மீண்டும் சமூகத்திடம் கொண்டுவரும் முன்மொழிவைக் குறிக்கிறது. ‘கொண்டுவருவோம்’ என்பது அழைப்பின் வலிமையையும், ‘திரும்ப’ என்பது மீட்பின் திசையையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֶת אֲרוֹן אֱלֹהֵינוּ
  choice: நம் கடவுளின் பேழையை
  rationale: எபிரெய கட்டமைப்புத் தொடர் நேரடியாக ‘நம் கடவுளின் பேழை’ என்று பொருள்படுகிறது. ‘பேழை’ என்பது வழிபாட்டுக்குரிய இப்புனிதப் பொருளை சாதாரணப் பெட்டியிலிருந்து வேறுபடுத்தும், தமிழில் நிலைபெற்ற கண்ணியமான சொல்.
- source_word: אֵלֵינוּ
  choice: நம்மிடம்
  rationale: முன்னிடைச்சொல்லும் முதலாம் நபர் பன்மை விகுதியும் பேச்சாளர்கள் மற்றும் சமூகத்தை நோக்கிய இயக்கத்தைக் குறிக்கின்றன.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய முன்மொழிவுக்கான காரணத்தை அறிமுகப்படுத்தும் தொடர்பைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: לֹא דְרַשְׁנֻהוּ
  choice: நாம் அதை நாடவில்லை
  rationale: דרש என்பது ‘தேடு/நாடு’ என்றும் ‘விசாரி’ என்றும் பொருள்படலாம். ஆண்பால் ஒருமை விகுதி, இலக்கணப்படி ஆண்பாலான ‘பேழை’யை இயல்பாகச் சுட்டுகிறது; தமிழில் ‘அதை’ என்று மொழிபெயர்ப்பது இக்குறிப்பைத் தக்கவைத்து, கடவுளை நாடாத ஆன்மிக உட்பொருளை முதன்மை உரையில் கட்டாயப்படுத்தாமல் விடுகிறது.
- source_word: בִּימֵי שָׁאוּל
  choice: சவுலின் நாட்களில்
  rationale: காலத்தைக் குறிக்கும் எபிரெய மரபுத்தொடரை இயல்பான, வேதாகமக் கண்ணியம் கொண்ட தமிழில் தருகிறது; שָׁאוּל என்ற பெயர் ‘சவுல்’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: ‘நாம் நாடவில்லை’ என்பதன் செயப்படுபொருள்
  choice: ‘அதை’ என்று பேழையைச் சுட்டுதல்
  alternative: ‘அவரை’ என்று கடவுளைச் சுட்டுதல்; அல்லது ‘அதனிடம்/அவரிடம் விசாரிக்கவில்லை’ என மொழிபெயர்த்தல்
  rationale: எபிரெயப் பின்னொட்டு அருகிலுள்ள ஆண்பால் ஒருமைப் பெயர்ச்சொல்லான ‘பேழை’யை இயல்பாகச் சுட்டுகிறது. இருப்பினும் דרש என்பது விசாரித்தல் என்றும் பொருள்படக்கூடும்; பேழையோடு தொடர்புடைய விதத்தில் கடவுளை நாடுதல் என்ற இறையியல் உட்பொருளும் சாத்தியம். எனவே முதன்மை உரை இலக்கணக் குறிப்பைத் தக்கவைத்து, மாற்றுப் புரிதலை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் எளிதாகப் புரியும் வகையிலும், வரலாற்று-வழிபாட்டு சூழலுக்கேற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘பேழை’ என்ற நிலைபெற்ற சொல் புனிதப் பொருளைக் குறிக்கிறது; ‘நம்’ மற்றும் ‘நம்மிடம்’ சமூகத்தின் கூட்டுணர்வை இயல்பாகத் தக்கவைக்கின்றன.
