  text: וַ/יֹּ֣אמֶר שָׁאוּל֩ אֶל נֹשֵׂ֨א כֵלָ֜י/ו שְׁלֹ֥ף חַרְבְּ/ךָ֣ וְ/דָקְרֵ֣/נִי בָ֗/הּ פֶּן יָבֹ֜אוּ הָ/עֲרֵלִ֤ים הָ/אֵ֨לֶּה֙ וְ/הִתְעַלְּלוּ בִ֔/י וְ/לֹ֤א אָבָה֙ נֹשֵׂ֣א כֵלָ֔י/ו כִּ֥י יָרֵ֖א מְאֹ֑ד וַ/יִּקַּ֤ח שָׁאוּל֙ אֶת הַ/חֶ֔רֶב וַ/יִּפֹּ֖ל עָלֶֽי/הָ־׀־־ס־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/004.yaml
  text: Then Saul said to his armor-bearer[a], “Draw your sword and thrust me through with it, lest these uncircumcised men come and mistreat me.” But his armor-bearer was not willing, because he was very afraid[c][b]. So Saul took the sword and fell on it.
translation:
  language: ta
  text: அப்போது சவுல் தன் ஆயுதங்களைச் சுமப்பவனிடம், “உன் வாளை உருவி, என்னை அதனால் குத்து. இல்லையென்றால், விருத்தசேதனம் செய்யப்படாத இந்த ஆட்கள் வந்து என்னை இழிவாக நடத்துவார்கள்[a]” என்றான். ஆனால் அவனுடைய ஆயுதங்களைச் சுமப்பவன் மிகவும் பயந்ததால், அவன் அதற்குச் சம்மதிக்கவில்லை. எனவே சவுல் அந்த வாளை எடுத்துக்கொண்டு அதன்மேல் விழுந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என்னைத் துன்புறுத்துவார்கள்,” “என்னை ஏளனம் செய்வார்கள்,” அல்லது “என்னை அவமானப்படுத்துவார்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹשֵׂא כֵלָיו
  choice: தன் ஆயுதங்களைச் சுமப்பவன்
  rationale: எபிரெயச் சொற்றொடர் நேரடியாக அவரது கருவிகள் அல்லது ஆயுதங்களைச் சுமப்பவரைக் குறிக்கிறது. தமிழில் குறிப்பிட்ட பழங்கால இராணுவப் பணியையும் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: שְׁלֹף חַרְבְּךָ
  choice: உன் வாளை உருவி
  rationale: வாளை அதன் உறையிலிருந்து எடுக்கும் செயலைக் குறிக்கும் இயல்பான தமிழ்ச் சொல் ‘உருவி’ ஆகும்.
- source_word: וְדָקְרֵנִי בָהּ
  choice: அதனால் என்னைத் துளைத்துப்போடு
  rationale: דקר என்பது கூரிய ஆயுதத்தால் குத்தி ஊடுருவச் செய்வதைக் குறிக்கிறது. மரண நோக்கம் சூழலில் தெளிவாக இருந்தாலும், மூலத்தின் செயற்படிமத்தை இந்த மொழிபெயர்ப்பு காக்கிறது.
- source_word: פֶּן
  choice: இல்லையென்றால்
  rationale: சவுல் அஞ்சும் விளைவை நவீன தமிழில் இயல்பாக அறிமுகப்படுத்துகிறது.
- source_word: הָעֲרֵלִים הָאֵלֶּה
  choice: விருத்தசேதனம் செய்யப்படாத இந்த ஆட்கள்
  rationale: மூலத்திலுள்ள இன-சமய அடையாளச் சொல்லை ‘பெலிஸ்தியர்கள்’ என்று சூழலிலிருந்து நிரப்பாமல் நேரடியாகப் பாதுகாக்கிறது.
- source_word: וְהִתְעַלְּלוּ בִי
  choice: என்னை இழிவாக நடத்துவார்கள்
  rationale: வன்முறை கலந்த அவமானகரமான நடத்தையை உணர்த்துகிறது; அதன் குறிப்பிட்ட வடிவத்தைத் தேவையின்றி நிர்ணயிப்பதில்லை.
- source_word: וְלֹא אָבָה
  choice: அதற்கு மனமில்லாதிருந்தான்
  rationale: ஆயுதம் சுமப்பவன் சம்மதிக்கவில்லை என்பதை மூலத்துக்கு நெருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: כִּי יָרֵא מְאֹד
  choice: மிகவும் பயந்ததால்
  rationale: அவன் மறுத்ததற்கான காரணத்தையும் מְאֹד தரும் வலியுறுத்தலையும் தெளிவாகக் காக்கிறது.
- source_word: וַיִּפֹּל עָלֶיהָ
  choice: அதன்மேல் விழுந்தான்
  rationale: ‘அதன்மேல் விழுந்தான்’ என்ற எபிரெயச் சொல்லமைப்பை விளக்கவுரை சேர்க்காமல் நேரடியாகப் பிரதிபலிக்கிறது.
theological_decisions:
- issue: பெலிஸ்தியர்கள் சவுலுக்கு செய்வார்கள் என அவன் அஞ்சிய நடத்தையின் தன்மை
  choice: என்னை இழிவாக நடத்துவார்கள்
  alternative: என்னைத் துன்புறுத்துவார்கள்; என்னை ஏளனம் செய்வார்கள்; என்னை அவமானப்படுத்துவார்கள்
  rationale: எபிரெய வினை அவமானகரமான, தீங்கிழைக்கும் நடத்தையைச் சுட்டுகிறது; ஆனால் அதன் துல்லியமான வடிவத்தைச் சொல்லவில்லை. எனவே மொழிபெயர்ப்பு அந்தத் தெளிவின்மையையும் தீவிரத்தையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. பழங்கால இராணுவப் பணியைத் தெளிவுபடுத்த ‘ஆயுதங்களைச் சுமப்பவன்’ என்றும், மூலத்தின் இன-சமய அடையாளத்தை மறைக்காமல் ‘விருத்தசேதனம் செய்யப்படாத இந்த ஆட்கள்’ என்றும் மொழிபெயர்க்கப்பட்டுள்ளது.
