  yaml_path: translation/ot/1_chronicles/010/005.yaml
  text: When his armor-bearer saw that Saul was dead[b][a], he too fell on the sword and died.
translation:
  language: ta
  text: சவுலின் ஆயுததாரி[a], சவுல் இறந்துவிட்டதைக் கண்டபோது, அவனும் வாளின் மேல் விழுந்து[b] இறந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: ‘அவனுடைய ஆயுதங்களைச் சுமப்பவன்.’'
    reason: lexical_alternative
  - marker: b
    text: ‘வாளின் மேல் விழுதல்’ என்பது வாளால் தன்னைக் கொன்றுகொள்வதைக் குறிக்கும் சொல்வழக்கு.
    reason: cultural_note
lexical_decisions:
- source_word: נֹשֵׂא כֵלָיו
  choice: அவருடைய ஆயுதங்களைச் சுமப்பவன்
  rationale: எபிரெயச் சொற்றொடர் நேரடியாக ‘அவருடைய ஆயுதங்களைச் சுமப்பவன்’ என்று பொருள்படும். இது அந்தப் பணியைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: כִּי מֵת שָׁאוּל
  choice: சவுல் இறந்துவிட்டதை
  rationale: כִּי இங்கு கண்டதன் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது; מֵת சவுலின் இறந்த நிலையைக் குறிக்கிறது. தமிழில் ‘இறந்துவிட்டதை ... கண்டபோது’ என்பது இயல்பான கதைநடையைத் தருகிறது.
- source_word: גַּם הוּא
  choice: அவனும்
  rationale: சவுலைப் போலவே ஆயுதங்களைச் சுமந்தவனும் இறந்தான் என்ற சேர்க்கை வலியுறுத்தலைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: וַיִּפֹּל ... עַל הַחֶרֶב
  choice: வாள்மேல் விழுந்து
  rationale: ‘வாள்மேல் விழுந்தான்’ என்ற மூல உருவகத்தைப் பாதுகாக்கிறது; சூழலில் இது வாளைப் பயன்படுத்தித் தன்னைக் கொன்றுகொண்டதைக் குறிக்கிறது.
- source_word: וַיָּמֹת
  choice: இறந்தான்
  rationale: செயலின் முடிவை மூலத்தின் சுருக்கமான கதைநடைக்கு ஏற்ப நேரடியாகத் தெரிவிக்கிறது.
