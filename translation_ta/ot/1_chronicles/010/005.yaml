translation_notes:
  register: நவீன செந்தமிழ் நடையில், பொதுவாசகர்களுக்கு எளிதில் புரியுமாறு மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் சுருக்கமான கதைநடையும் ‘வாள்மேல் விழுதல்’ என்ற உருவகமும் பாதுகாக்கப்பட்டுள்ளன.
