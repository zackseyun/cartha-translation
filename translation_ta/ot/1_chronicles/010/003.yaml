  yaml_path: translation/ot/1_chronicles/010/003.yaml
  text: The battle grew heavy against Saul, and the archers found him, and he was badly wounded by the archers.
translation:
  language: ta
  text: சவுலுக்கு எதிரான போர் கடுமையடைந்தது. வில்லாளர்கள் அவரைக் கண்டுபிடித்தார்கள்; வில்லாளர்களால் அவர் காயமடைந்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வில்லாளர்களால் அவர் கடும் வேதனை அடைந்தார்.” எபிரெய வினைச்சொல் உடற்காயத்தை அல்லாமல் கடுமையான துயரத்தையோ வேதனையையோ குறிக்கவும் முடியும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּכְבַּד
  choice: கடுமையடைந்தது
  rationale: כבד என்பதன் அடிப்படைப் பொருள் ‘கனமாதல்’; போர்ச் சூழலில் அது போர் தீவிரமடைந்து கடுமையான அழுத்தத்தை ஏற்படுத்தியதைக் குறிக்கிறது. நவீனத் தமிழில் ‘கடுமையடைந்தது’ இயல்பாக இந்தச் சூழற்பொருளைத் தருகிறது.
- source_word: הַמִּלְחָמָה עַל שָׁאוּל
  choice: சவுலுக்கு எதிரான போர்
  rationale: இங்கு עַל பகைமை அல்லது தாக்குதலின் திசையைக் குறிக்கிறது; ஆகவே ‘எதிரான’ என்பது இயல்பான தமிழ் வடிவம்.
- source_word: וַיִּמְצָאֻהוּ
  choice: அவரைக் கண்டுபிடித்தார்கள்
  rationale: מצא என்பதன் நேரடிப் பொருள் ‘கண்டுபிடித்தல்’. இப்போர்ச் சூழலில் வில்லாளர்கள் சவுலை எட்டிப் பிடித்தார்கள் என்ற உட்பொருள் இருந்தாலும், மூலச்சொல்லுக்கு நெருக்கமான இயல்பான வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- source_word: הַמּוֹרִים בַּקָּשֶׁת
  choice: வில்லாளர்கள்
  rationale: சொல்லுக்கு சொல் ‘வில்லால் எய்கிறவர்கள்’ என்று பொருள்; தமிழில் ‘வில்லாளர்கள்’ சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: וַיָּחֶל
  choice: படுகாயமடைந்தார்
  rationale: இந்த அரிய வினை வடிவம் உடல் காயத்தையோ கடும் வேதனையையோ குறிக்கலாம். இணையான 1 சாமுவேல் 31:3 மற்றும் தொடரும் போர்க்கதைச் சூழல் உடல் காயம் என்ற புரிதலை ஆதரிக்கின்றன; ‘படுகாயமடைந்தார்’ கடுமையையும் வெளிப்படுத்துகிறது, மாற்றுப் புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: מִן הַיּוֹרִים
  choice: வில்லாளர்களால்
  rationale: מִן இங்கு காரணம் அல்லது செயற்பாட்டின் மூலத்தைக் குறிக்கிறது; செயலப்பாட்டு வாக்கியத்தில் ‘வில்லாளர்களால்’ என்பது இயல்பான தமிழ்.
theological_decisions:
- issue: וַיָּחֶל என்ற வினையின் பொருள் தெளிவின்மை
  choice: உடல் காயத்தைக் குறிக்கும் ‘படுகாயமடைந்தார்’
  alternative: வில்லாளர்களால் அவர் கடும் வேதனை அடைந்தார் / வில்லாளர்களைக் கண்டு அவர் மிகவும் துயருற்றார்
  rationale: இது நேரடியாக ஒரு கோட்பாட்டுச் சிக்கல் அல்ல; இருப்பினும் சவுலின் இறுதி நிகழ்வை எவ்வாறு புரிந்துகொள்வது என்பதில் தாக்கம் ஏற்படுத்தலாம். கதையின் உடனடிச் சூழல் உடல் காயத்துக்கு ஆதரவளிக்கிறது; ஆனால் எபிரெயச் சொல்லின் உண்மையான இருபொருள் வாய்ப்பு அடிக்குறிப்பில் வெளிப்படையாக வைக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத் தமிழில், மரியாதையும் கதைநடைத் தெளிவும் காக்கப்பட்டுள்ளன. ‘போர் கடுமையடைந்தது’ என்பது எபிரெய மொழியின் ‘கனமடைந்தது’ என்ற உருவகத்தைச் சொற்சொல்லாக அல்லாமல் இயல்பான தமிழில் வழங்குகிறது. சவுலைக் குறிக்க மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது.
