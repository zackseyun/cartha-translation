source:
  edition: WLC
  text: וּ/פְלִשְׁתִּ֖ים נִלְחֲמ֣וּ בְ/יִשְׂרָאֵ֑ל וַ/יָּ֑נָס אִֽישׁ יִשְׂרָאֵל֙ מִ/פְּנֵ֣י פְלִשְׁתִּ֔ים וַ/יִּפְּל֥וּ חֲלָלִ֖ים בְּ/הַ֥ר גִּלְבֹּֽעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/001.yaml
  text: The Philistines fought against Israel[a], and the men of Israel fled from before the Philistines and fell slain on Mount Gilboa.
translation:
  language: ta
  text: பெலிஸ்தியர்கள் இஸ்ரவேலுக்கு எதிராகப் போரிட்டார்கள். இஸ்ரவேலைச் சேர்ந்த ஆண்கள்[a] பெலிஸ்தியர்களிடமிருந்து தப்பியோடி, கில்போவா மலையில் கொல்லப்பட்டு விழுந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் சொற்பட ‘இஸ்ரவேலின் மனிதன்’; இங்குள்ள ஒருமைச் சொல் கூட்டுப்பொருளில் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְלִשְׁתִּים
  choice: பெலிஸ்தியர்கள்
  rationale: வாக்கியத் தொடக்கத்தில் உள்ள ו தொடர் இணைப்பைக் குறிக்கிறது; தமிழில் தேவையற்ற காலச்சுட்டுச் சொல்லைச் சேர்க்காமல் இயல்பான புதிய நிகழ்வாகத் தொடங்கப்பட்டுள்ளது. פְלִשְׁתִּים என்ற மக்களினப் பெயர் வழக்கமான தமிழ் வடிவில் தரப்பட்டுள்ளது.
- source_word: נִלְחֲמוּ בְיִשְׂרָאֵל
  choice: இஸ்ரவேலுக்கு எதிராகப் போரிட்டார்கள்
  rationale: לחם என்பதன் நிபால் வடிவம் ב உடன் இங்கு பகைமைப் போரைக் குறிக்கிறது; ‘எதிராகப் போரிட்டார்கள்’ என்பது தெளிவான, இயல்பான தமிழ்.
- source_word: וַיָּנָס אִישׁ יִשְׂרָאֵל
  choice: இஸ்ரவேலைச் சேர்ந்த ஆண்கள் தப்பியோடி
  rationale: אִישׁ இலக்கணத்தில் ஒருமையாக இருந்தாலும் இங்கு கூட்டுப்பொருளில் செயல்படுகிறது. ஆண்பால் குறிப்பைத் தக்கவைத்து, தமிழில் இயல்பாகப் பன்மையில் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: מִפְּנֵי פְלִשְׁתִּים
  choice: பெலிஸ்தியர்களிடமிருந்து
  rationale: מִפְּנֵי என்பதன் சொற்பொருள் ‘முன்னிலையிலிருந்து/முகத்திலிருந்து’; இந்தப் போர்ச் சூழலில் எதிரியின் முன்னிலையிலிருந்து பின்வாங்கித் தப்பிய பொருளை ‘இடமிருந்து’ இயல்பாகத் தெரிவிக்கிறது.
- source_word: וַיִּפְּלוּ חֲלָלִים
  choice: கொல்லப்பட்டு விழுந்தார்கள்
  rationale: נפל மற்றும் חֲלָלִים இணைவு போரில் கொல்லப்பட்டவர்களாக விழுதலைக் குறிக்கிறது. கொல்லப் பயன்படுத்தப்பட்ட ஆயுதத்தை ஊகிக்காமல் அந்த இராணுவப் பொருள் பாதுகாக்கப்பட்டுள்ளது.
- source_word: בְּהַר גִּלְבֹּעַ
  choice: கில்போவா மலையில்
  rationale: הַר + இடப்பெயர் தமிழில் இயல்பாக ‘கில்போவா மலை’ என வழங்கப்படுகிறது; ב இங்குள்ள போர்க்கள இருப்பிடத்தை ‘மலையில்’ எனக் குறிக்கிறது.
