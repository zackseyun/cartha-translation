lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: கேள்விப்பட்டபோது
  rationale: தொடர்ந்து வரும் வசனத்தின் செயலுக்கு இக்கூற்று காலச் சூழலை அமைக்கிறது. ஆகவே எளிய ‘கேள்விப்பட்டார்கள்’ என்பதற்குப் பதிலாக, எபிரெயக் கதைத் தொடரை இயல்பான தமிழில் ‘கேள்விப்பட்டபோது’ என வழங்குகிறது.
- source_word: כֹּל יָבֵישׁ גִּלְעָד
  choice: யாபேஸ் கீலேயாத் ஊரார் அனைவரும்
  rationale: எபிரெயில் சொற்சொல்லாக ‘யாபேஸ் கீலேயாத் முழுவதும்’ என்றிருந்தாலும், சூழலில் அது இடத்தை அல்ல, அந்த ஊரின் மக்களைக் குறிக்கிறது. ‘ஊரார் அனைவரும்’ என்பது அந்த ஆகுபெயர்ப் பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: אֵת כָּל אֲשֶׁר
  choice: செய்த அனைத்தையும்
  rationale: செய்யப்பட்டவற்றின் முழுமையைக் குறிக்கும் எபிரெயத் தொடரைச் சுருக்கமாகவும் இயல்பாகவும் பிரதிபலிக்கிறது.
- source_word: עָשׂוּ
  choice: செய்த
  rationale: பெலிஸ்தியரின் செயல் அதைப் பற்றிக் கேள்விப்படுவதற்கு முன்பே நிகழ்ந்தது என்பதைத் தமிழ் வினையெச்ச அமைப்பு இயல்பாக வெளிப்படுத்துகிறது.
- source_word: פְלִשְׁתִּים
  choice: பெலிஸ்தியர்கள்
  rationale: இந்த மக்கள் இனப்பெயரின் தமிழில் நிலைபெற்ற வடிவம்.
- source_word: לְשָׁאוּל
  choice: சவுலுக்கு
  rationale: לְ என்னும் முன்னொட்டு இங்கு செயலால் பாதிக்கப்பட்ட நபரைக் குறிக்கலாம். ‘சவுலுக்கு’ என்பது எபிரெயின் திறந்த பொருளைத் தக்கவைக்கிறது; ‘சவுலுக்கு எதிராக’ என்பது பகைமை நுணுக்கத்தை மேலும் வெளிப்படையாகச் சேர்க்கும்.
