translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் வரலாற்று உரைக்கு ஏற்ற கண்ணியமான நடை. ‘போர்க்கருவிகள்’ என்பது ஆயுதங்கள்/கவசம் என்ற மூலத்தின் பரப்பைத் திறந்தவையாக வைத்திருக்கிறது; ‘பொருத்திவைத்தார்கள்’ என்பது செயல் முறையை அளவுக்கு மீறி விளக்குவதைக் தவிர்க்கிறது.
