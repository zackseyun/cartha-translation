source:
  edition: WLC
  text: וַ/יָּשִׂ֨ימוּ֙ אֶת כֵּלָ֔י/ו בֵּ֖ית אֱלֹהֵי/הֶ֑ם וְ/אֶת גֻּלְגָּלְתּ֥/וֹ תָקְע֖וּ בֵּ֥ית דָּגֽוֹן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/010.yaml
  text: They put his armor in the house of their gods[b][a], and they fastened his skull in the house of Dagon.
translation:
  language: ta
  text: அவர்கள் அவனுடைய போர்க்கருவிகளைத் தங்கள் தெய்வங்களின் ஆலயத்தில்[a] வைத்தார்கள்; அவனுடைய மண்டையோட்டை[b] தாகோனின் ஆலயத்தில் பொருத்திவைத்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் நேரடியாக, “தங்கள் தெய்வங்களின் வீட்டில்.” தெய்வத்தின் ‘வீடு’ என்பது ஆலயத்தைக் குறிக்கும் வழக்கமான சொல்லாட்சி.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவனுடைய தலையை.” எபிரெயச் சொல் மண்டையோட்டையையோ தலையையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂימוּ
  choice: வைத்தார்கள்
  rationale: שׂים என்பதன் இயல்பான பொருள் ‘வை/இடு’; இச்சூழலில் ‘வைத்தார்கள்’ என்பது தெளிவான நவீனத் தமிழ்.
- source_word: כֵּלָיו
  choice: அவனுடைய போர்க்கருவிகளை
  rationale: כְּלִי என்பது கருவிகள், பொருட்கள், ஆயுதங்கள் அல்லது போர்ச் சாதனங்களைக் குறிக்கலாம். சவுலின் போர்ச் சூழலில் ‘போர்க்கருவிகள்’ என்பது ஆயுதங்களையும் கவசம் போன்ற சாதனங்களையும் உள்ளடக்கி, மூலச்சொல்லை அளவுக்கு மீறிக் குறிப்பாக்காமல் காக்கிறது.
- source_word: בֵּית אֱלֹהֵיהֶם
  choice: தங்கள் தெய்வங்களின் ஆலயத்தில்
  rationale: בַּיִת என்பதன் நேர்ப்பொருள் ‘வீடு’; தெய்வ வழிபாட்டுச் சூழலில் அது ஆலயத்தைக் குறிக்கிறது. தமிழில் ‘தெய்வங்களின் வீடு’ என்பதைவிட ‘ஆலயம்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: גֻּלְגָּלְתּוֹ
  choice: அவனுடைய மண்டையோட்டை
  rationale: גֻּלְגֹּלֶת குறிப்பாக மண்டையோடு அல்லது தலையைக் குறிக்கலாம்; ‘மண்டையோடு’ இங்குள்ள கொடூரமான வெற்றிச் சின்னக் காட்சியில் துல்லியமான இணைச்சொல்.
- source_word: תָקְעוּ
  choice: பொருத்திவைத்தார்கள்
  rationale: תקע என்பது செருகுதல், அறைந்து பதித்தல், உறுதியாகப் பொருத்துதல் போன்ற பொருள்களை உடையது. ‘பொருத்திவைத்தார்கள்’ காட்சிக்காக இணைத்துப் பதித்ததை உணர்த்துகிறது; உறுதியற்ற ‘கழுவேற்றினர்’ போன்ற வலுவான பொருளைச் சேர்ப்பதில்லை.
- source_word: בֵּית דָּגוֹן
  choice: தாகோனின் ஆலயத்தில்
  rationale: வழிபாட்டுச் சூழலில் בֵּית என்பது ஆலயம்; דָּגוֹן தெய்வத்தின் பெயராக ‘தாகோன்’ என ஒலிபெயர்க்கப்படுகிறது.
