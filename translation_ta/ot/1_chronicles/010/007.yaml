  text: וַ֠/יִּרְאוּ כָּל אִ֨ישׁ יִשְׂרָאֵ֤ל אֲשֶׁר בָּ/עֵ֨מֶק֙ כִּ֣י נָ֔סוּ וְ/כִי מֵ֖תוּ שָׁא֣וּל וּ/בָנָ֑י/ו וַ/יַּעַזְב֤וּ עָרֵי/הֶם֙ וַ/יָּנֻ֔סוּ וַ/יָּבֹ֣אוּ פְלִשְׁתִּ֔ים וַ/יֵּשְׁב֖וּ בָּ/הֶֽם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/007.yaml
  text: When all the men of Israel who were in the valley saw that they had fled and that Saul and his sons were dead[a], they abandoned their cities and fled[c][b]; then the Philistines came and lived in them.
translation:
  language: ta
  text: பள்ளத்தாக்கில்[a] இருந்த இஸ்ரயேல் ஆண்கள்[b] அனைவரும், அவர்கள் தப்பியோடியதையும் சவுலும் அவனுடைய மகன்களும் இறந்துவிட்டதையும் கண்டபோது, தங்கள் பட்டணங்களைக் கைவிட்டுத் தப்பியோடினர். பின்பு பெலிஸ்தியர்கள் வந்து அவற்றில் குடியேறினர்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சமவெளியில்.”
    reason: עֵמֶק என்பது பொதுவாக ‘பள்ளத்தாக்கு’ எனப் பொருள்படும்; சில நிலவியல் சூழல்களில் ‘சமவெளி’ என்றும் மொழிபெயர்க்கலாம்.
  - marker: b
    text: எபிரெய உரை ஆண்பால் சொல்லைப் பயன்படுத்தி, “இஸ்ரயேல் ஆண்கள் அனைவரும்” என்று கூறுகிறது.
    reason: மூலத்தில் உள்ள வெளிப்படையான ஆண்பால் குறிப்பை வாசகருக்குத் தெரியப்படுத்துகிறது.
  - marker: c
    text: அல்லது, “அவற்றில் வசித்தனர்.”
    reason: ישב என்பது ‘குடியேறுதல்’ அல்லது ‘வசித்தல்’ ஆகிய இரு நெருங்கிய பொருள்களையும் கொண்டிருக்கலாம்.
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: கண்டபோது
  rationale: ראה என்பதன் அடிப்படைப் பொருளான நேரடியாகக் காணுதல் இங்கு போரின் முடிவை அவர்கள் கண்டதைச் சித்தரிக்கிறது; ‘உணர்ந்தபோது’ என்பதைவிட இது மூலத்தின் காட்சித் தன்மையைப் பாதுகாக்கிறது.
- source_word: כָּל אִישׁ יִשְׂרָאֵל
  choice: இஸ்ரயேல் ஆண்கள் அனைவரும்
  rationale: כָּל உடன் வரும் אִישׁ பகிர்ந்தளிக்கும் பொருளைக் கொண்டதோடு, எபிரெய உரை வெளிப்படையாக ஆண்பாலைக் குறிப்பிடுகிறது. இயல்பான நவீனத் தமிழில் இதைத் தெளிவாகப் பிரதிபலிக்கிறது.
- source_word: אֲשֶׁר בָּעֵמֶק
  choice: பள்ளத்தாக்கில் இருந்த
  rationale: עֵמֶק என்பதன் வழக்கமான நிலவியல் பொருள் ‘பள்ளத்தாக்கு’; சூழலை மிகையாகத் தீர்மானிக்காமல் நேரடியான பொருள் தேர்ந்தெடுக்கப்பட்டது.
- source_word: כִּי נָסוּ
  choice: அவர்கள் தப்பியோடியதையும்
  rationale: נוּס என்பது ஆபத்திலிருந்து தப்பியோடுவதைக் குறிக்கிறது. எபிரெயத்தில் எழுவாய் மறைமுகமாக இருப்பதால், ‘அவர்கள்’ என்று மட்டும் கூறி அதன் குறிப்பு யாரைச் சாரும் என்பதை மிகையாகத் தீர்மானிக்கவில்லை.
- source_word: וְכִי מֵתוּ שָׁאוּל וּבָנָיו
  choice: சவுலும் அவனுடைய மகன்களும் இறந்துவிட்டதையும்
  rationale: מוּת இங்கு அவர்கள் மரணம் ஏற்கெனவே நிகழ்ந்திருந்ததைக் குறிக்கிறது; ‘இறந்துவிட்டனர்’ என்ற தமிழ் வடிவம் அந்த முடிவுற்ற நிலையைக் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיַּעַזְבוּ עָרֵיהֶם
  choice: தங்கள் பட்டணங்களைக் கைவிட்டு
  rationale: עזב என்பது விட்டுச் செல்லுதல் அல்லது கைவிடுதல்; படையெடுப்பால் ஏற்பட்ட வெளியேற்றத்தின் வலிமையை ‘கைவிட்டு’ தக்கவைக்கிறது. עָרִים என்பதற்கு இச்சூழலில் ‘பட்டணங்கள்’ இயல்பான தேர்வு.
- source_word: וַיָּנֻסוּ
  choice: தப்பியோடினர்
  rationale: נוּס என்பதன் நேரடியான, சுருக்கமான தமிழ் இணை இது.
- source_word: וַיָּבֹאוּ פְלִשְׁתִּים
  choice: பின்பு பெலிஸ்தியர்கள் வந்து
  rationale: தொடர்ச்சியான நிகழ்வைச் சுட்டும் வாவ் வடிவத்தை ‘பின்பு’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיֵּשְׁבוּ בָּהֶם
  choice: அவற்றில் குடியேறினர்
  rationale: ישב இங்கு கைவிடப்பட்ட பட்டணங்களில் வந்து தங்கி வசிப்பதை அல்லது குடியேறுவதைச் சுட்டுகிறது. ‘குடியேறினர்’ ஆக்கிரமிப்புக்குப் பிந்தைய நிலையான வசிப்பைச் சுருக்கமாக வெளிப்படுத்துகிறது; ‘வசித்தனர்’ என்பதும் சாத்தியம்.
