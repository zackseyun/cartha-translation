translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified வேதாகம வரலாற்று நடை பயன்படுத்தப்பட்டுள்ளது. ‘பட்டணங்கள்,’ ‘கைவிட்டு,’ ‘தப்பியோடினர்,’ ‘குடியேறினர்’ ஆகியவை இயல்பானவையாகவும் மூலத்தின் நிகழ்வுத் தொடரைத் தெளிவாகவும் வைத்திருக்கின்றன. மூலத்தில் மறைமுகமாக உள்ள ‘அவர்கள்’ என்பதன் குறிப்பு விளக்கமாக விரிவாக்கப்படவில்லை.
