source:
  edition: WLC
  text: וַ/יַּ֨פְשִׁיטֻ֔/הוּ וַ/יִּשְׂא֥וּ אֶת רֹאשׁ֖/וֹ וְ/אֶת כֵּלָ֑י/ו וַ/יְשַׁלְּח֨וּ בְ/אֶֽרֶץ פְלִשְׁתִּ֜ים סָבִ֗יב לְ/בַשֵּׂ֛ר אֶת עֲצַבֵּי/הֶ֖ם וְ/אֶת הָ/עָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/009.yaml
  text: They stripped him[a], took his head and his weapons, and sent word throughout the land of the Philistines to proclaim the news to their idols and to the people.
translation:
  language: ta
  text: அவர்கள் சவுலின் உடைகளைக் கழற்றி[a], அவருடைய தலையையும் ஆயுதங்களையும் எடுத்துக்கொண்டார்கள். பின்பு, அந்தச் செய்தியைத் தங்கள் சிலைகளுக்கும் மக்களுக்கும் அறிவிப்பதற்காகப் பெலிஸ்தியர்களின் நாடெங்கும் செய்தி அனுப்பினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவருடைய போர்க்கவசத்தைக் கழற்றி.’
    reason: פשט என்பது உடை அல்லது போர்க்கவசத்தைக் கழற்றுவதைக் குறிக்கலாம்; போர்க்களச் சூழல் ‘போர்க்கவசம்’ என்ற குறிப்பான வாசிப்பை ஆதரிக்கிறது, ஆனால் அது இக்கூற்றில் வெளிப்படையாக இல்லை.
lexical_decisions:
- source_word: וַיַּפְשִׁיטֻהוּ
  choice: சவுலின் உடைகளைக் கழற்றி
  rationale: פשט என்பதன் பொருள் ஒருவர்மேல் உள்ள உடை அல்லது போர்க்கவசத்தைக் கழற்றுவது. எபிரெயத்தில் போர்க்கவசம் வெளிப்படையாகக் குறிப்பிடப்படாததால், பொதுவான பொருளை இயல்பான தமிழில் அளிக்கிறது.
- source_word: וַיִּשְׂאוּ אֶת־רֹאשׁוֹ
  choice: அவருடைய தலையை எடுத்துக்கொண்டார்கள்
  rationale: נשא என்பது தூக்குதல், எடுத்தல், சுமத்தல் ஆகிய பொருள்களைக் கொண்டது. போர்ச்சூழலில் வெட்டப்பட்ட தலையைக் கைப்பற்றியதை இந்தச் சொற்றொடர் தெரிவிக்கிறது; தலை வெட்டிய செயலை இவ்வசனம் வெளிப்படையாகச் சொல்லாததால் அதைச் சேர்க்கவில்லை.
- source_word: כֵּלָיו
  choice: அவருடைய ஆயுதங்கள்
  rationale: כְּלִי என்பது கருவி, பொருள், உபகரணம் அல்லது ஆயுதம் எனப் பரந்த பொருள் உடையது. போர்க்களச் சூழலில் ‘ஆயுதங்கள்’ இயல்பாகப் பொருந்துகிறது.
- source_word: וַיְשַׁלְּחוּ
  choice: செய்தி அனுப்பினார்கள்
  rationale: வினைச்சொல் அடிப்படையில் ‘அனுப்பினார்கள்’ என்பதே பொருள். தொடர்ந்து வரும் அறிவிக்கும் நோக்கத்தை வைத்து, எபிரெயத்தில் இல்லாத ‘தூதர்கள்’ என்பதைச் சேர்க்காமல் தமிழில் தேவையான ‘செய்தி’ எனும் உட்பொருள் வெளிப்படுத்தப்பட்டது.
- source_word: בְאֶרֶץ פְלִשְׁתִּים סָבִיב
  choice: பெலிஸ்தியர்களின் நாடெங்கும்
  rationale: סָבִיב இங்கு எல்லாத் திசைகளிலும் பரவலாக என்பதைக் குறிக்கிறது; ‘நாடெங்கும்’ என்பது தெளிவான நவீனத் தமிழ்.
- source_word: לְבַשֵּׂר
  choice: அந்தச் செய்தியை அறிவிப்பதற்காக
  rationale: בשר என்பது ஒரு செய்தியை அறிவித்தல்; இங்கு சவுலின் தோல்வியை வெற்றிச் செய்தியாகப் பரப்புவதைக் குறிக்கும். தனியே ‘நற்செய்தி’ என்ற இறையியல் நிறமுள்ள சொல்லைத் தவிர்க்கிறது.
- source_word: עֲצַבֵּיהֶם
  choice: தங்கள் சிலைகள்
  rationale: עֶצֶב வழிபாட்டு உருவங்களையோ சிலைகளையோ குறிக்கலாம். ‘சிலைகள்’ உருவம் சார்ந்த அடிப்படைப் பொருளைப் பாதுகாக்கிறது; வழிபாட்டுச் சூழல் வசனத்திலேயே தெளிவாக உள்ளது.
- source_word: הָעָם
  choice: மக்கள்
  rationale: எபிரெயத்தின் ஒருமைத் தொகுப்புச் சொல்லான ‘அந்த மக்கள்’ என்பதை இயல்பான தமிழில் ‘மக்கள்’ என அளிக்கிறது; சூழலில் பெலிஸ்திய மக்களைக் குறிக்கிறது.
theological_decisions:
- issue: עֲצַבֵּיהֶם என்ற வழிபாட்டுச் சொல்லின் மொழிபெயர்ப்பு
  choice: தங்கள் சிலைகள்
  alternative: தங்கள் விக்கிரகங்கள்
  rationale: எபிரெயச் சொல் தெய்வங்களைக் குறிக்கும் வழிபாட்டு உருவங்களைச் சுட்டுகிறது. ‘சிலைகள்’ அதன் உருவம் சார்ந்த பொருளையும் உண்மையான சொற்பொருள் விரிவையும் காக்கிறது; ‘விக்கிரகங்கள்’ என்பது வேதாகமத் தமிழில் வழக்கமான மாற்று, ஆனால் அதிக மதிப்பீட்டுச் சாயலைக் கொண்டிருக்கலாம்.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் dignified நடையில் மொழிபெயர்க்கப்பட்டது. நீண்ட எபிரெயத் தொடரை இரண்டு தமிழ் வாக்கியங்களாகப் பிரித்து தெளிவு பெறப்பட்டது. ‘சவுலின்’ என்பது முந்தைய சூழலிலுள்ள பிரதிப்பெயரின் குறிப்பு தெளிவாக இருக்கச் சேர்க்கப்பட்டது.
