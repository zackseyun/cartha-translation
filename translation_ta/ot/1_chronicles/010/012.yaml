translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய உரையின் ‘உடல்கள்’ என்பதிலிருந்து ‘எலும்புகள்’ என்பதற்கான மாற்றம் வழுவாக்கப்படாமல் அப்படியே பாதுகாக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறிகள் தொடர்புடைய சொற்களுக்குப் பின்னர் வைக்கப்பட்டுள்ளன.
