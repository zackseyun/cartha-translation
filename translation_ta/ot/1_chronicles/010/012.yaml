base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/012.yaml
  text: Then all the valiant men arose and carried away the body of Saul and the bodies of his sons[a], and brought them to Jabesh[b]. They buried their bones under the oak in Jabesh and fasted seven days.
translation:
  language: ta
  text: அப்போது வீரமிக்க ஆண்கள் அனைவரும் எழுந்து, சவுலின் உடலையும் அவருடைய மகன்களின் உடல்களையும் சுமந்து, அவற்றை யாபேசுக்குக் கொண்டுவந்தார்கள்.[a] அவர்களுடைய எலும்புகளை யாபேசிலிருந்த கருவாலி மரத்தின்[b] கீழ் புதைத்து, ஏழு நாட்கள் நோன்பிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: விரிவான வரலாற்றுச் சூழலில் இந்த இடம் ‘யாபேசு-கிலேயாத்’ என்று அடையாளப்படுத்தப்படுகிறது; இங்கே எபிரெய உரை ‘யாபேசு’ என்ற சுருக்கமான பெயரையே கொண்டுள்ளது.
    reason: cross_reference
  - marker: b
    text: ‘கருவாலி மரம்’ என மொழிபெயர்க்கப்பட்டுள்ள எபிரெயச் சொல், கருவாலி (terebinth) அல்லது ஓக் போன்ற ஒரு பெரிய மரத்தைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אִישׁ חַיִל
  choice: வீரமிக்க ஆண்கள் அனைவரும்
  rationale: இந்த நிலையான எபிரெயச் சொற்றொடர் வலிமை, துணிவு, போர்த்திறன் கொண்ட ஆண்களைக் குறிக்கிறது. தமிழில் இயல்பான பன்மை வடிவம் அதன் கூட்டுப் பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: גּוּפַת ... גּוּפֹת
  choice: சவுலின் உடலையும் அவருடைய மகன்களின் உடல்களையும்
  rationale: גּוּפָה இறந்த உடலைக் குறிக்கிறது. சூழல் மரணத்தைத் தெளிவுபடுத்துவதால், கண்ணியமும் இயல்பும் கொண்ட ‘உடல்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: וַיִּשְׂאוּ
  choice: எடுத்துக்கொண்டு
  rationale: נשא இங்கு உடல்களைத் தூக்கி அங்கிருந்து எடுத்துச் செல்வதைக் குறிக்கிறது; அடுத்துள்ள ‘கொண்டுவந்தார்கள்’ என்பதுடன் இணைந்து தமிழில் இயல்பாக அமைகிறது.
- source_word: וַיְבִיאוּם יָבֵישָׁה
  choice: அவற்றை யாபேசுக்குக் கொண்டுவந்தார்கள்
  rationale: இவ்வசனத்தின் எபிரெய உரை இடப்பெயரைச் சுருக்கமாக ‘யாபேசு’ என்றே தருவதால், விரிவான ‘யாபேசு-கிலேயாத்’ என்பதை மூலவாக்கியத்தில் சேர்க்கவில்லை.
- source_word: עַצְמוֹתֵיהֶם
  choice: அவர்களுடைய எலும்புகளை
  rationale: עֶצֶם என்பதன் நேரடிப் பொருள் ‘எலும்பு.’ உடல்களை எடுத்துவந்து பின்னர் எலும்புகளைப் புதைத்ததாக உள்ள எபிரெய உரையின் குறிப்பான சொல்லாட்சியை ‘எஞ்சிய உடல்கள்’ என்று பொதுமைப்படுத்தாமல் காக்கிறது.
- source_word: תַּחַת הָאֵלָה
  choice: கருவாலி மரத்தின் கீழ்
  rationale: אֵלָה கருவாலி அல்லது ஓக் வகையைச் சேர்ந்த பெரிய மரத்தைக் குறிக்கலாம். வாசிக்கத்தக்க தமிழ் மரப்பெயரை முதன்மை உரையில் வைத்து, தாவரவியல் நிச்சயமின்மையை அடிக்குறிப்பில் காத்துள்ளோம்.
- source_word: וַיָּצֻמוּ שִׁבְעַת יָמִים
  choice: ஏழு நாட்கள் உண்ணாநோன்பிருந்தார்கள்
  rationale: துக்கத்தின் அடையாளமாக உணவைத் தவிர்த்ததை நவீனத் தமிழில் தெளிவாகவும் கண்ணியமாகவும் கூறுகிறது.
