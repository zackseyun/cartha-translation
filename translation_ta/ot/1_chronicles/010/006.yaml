  text: וַ/יָּ֤מָת שָׁאוּל֙ וּ/שְׁלֹ֣שֶׁת בָּנָ֔י/ו וְ/כָל בֵּית֖/וֹ יַחְדָּ֥ו מֵֽתוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/006.yaml
  text: So Saul died[a], and his three sons, and all his house died together.
translation:
  language: ta
  text: இவ்வாறு சவுல் இறந்தான்; அவனுடைய மூன்று மகன்களும், அவனுடைய வீட்டார் அனைவரும் ஒன்றாக இறந்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָת
  choice: இவ்வாறு சவுல் இறந்தான்
  rationale: מּוּת என்பதன் வழக்கமான பொருள் ‘இறத்தல்.’ வַ-யுடன் வரும் வினை வடிவம் கதையை முன்னெடுத்துச் செல்வதால், முந்தைய நிகழ்வின் தொடர்ச்சியையும் விளைவையும் இயல்பான தமிழில் காட்ட ‘இவ்வாறு’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: שָׁאוּל
  choice: சவுல்
  rationale: இப்பெயரின் தமிழில் நிலைபெற்ற வேதாகம வடிவம்.
- source_word: וּשְׁלֹשֶׁת בָּנָיו
  choice: அவனுடைய மூன்று மகன்களும்
  rationale: எண், ‘மகன்கள்’ என்ற பெயர்ச்சொல், மூன்றாம் நபர் ஆண்பால் ஒருமை உடைமை விகுதி ஆகியவற்றைக் கொண்ட எபிரெயக் கட்டமைப்பை இயல்பான தமிழில் வழங்குகிறது; சூழலில் முன்பே குறிப்பிடப்பட்ட மூன்று மகன்களையே இது சுட்டுகிறது.
- source_word: וְכָל בֵּיתוֹ
  choice: அவனுடைய வீட்டார் அனைவரும்
  rationale: בַּיִת என்ற சொல் கட்டடமான வீடு மட்டுமன்றி வீட்டார், குடும்பம், குடும்ப வழி ஆகிய பொருள்களையும் தரக்கூடும். ‘வீட்டார்’ என்பது தமிழில் மனிதர்களைக் குறித்தபடியே மூலச்சொல்லின் விரிந்த பொருள் வரம்பையும் ஓரளவு காக்கிறது.
- source_word: יַחְדָּו
  choice: அவனுடன் ஒன்றாக
  rationale: ‘ஒன்றாக’ என்பது அடிப்படைப் பொருளைத் தருகிறது; தமிழில் யாருடன் என்பதைக் தெளிவாக்க ‘அவனுடன்’ சேர்க்கப்பட்டுள்ளது. இது சவுல், அவன் மகன்கள், அவன் வீட்டார் ஆகியோரின் கூட்டு மரணத்தைக் குறிக்கிறது.
- source_word: מֵתוּ
  choice: இறந்தார்கள்
  rationale: מוּת என்பதன் Qal perfect மூன்றாம் நபர் பன்மை வடிவம்; எளிய இறந்தகாலமாக மொழிபெயர்க்கப்பட்டுள்ளது. சவுலின் மரணத்திற்குப் பிறகு வினை மீண்டும் வருவது மூலத்தின் வலியுறுத்தலைக் காக்கிறது.
theological_decisions:
- issue: ‘அவனுடைய வீடு’ என்பதன் வரம்பு
  choice: முதன்மை உரையில் ‘அவனுடைய வீட்டார்’ என்று வைத்து, அதன் பொருள் வரம்பை அடிக்குறிப்பில் விளக்குதல்.
  alternative: அவனுடைய குடும்பத்தார் அனைவரும் / அவனுடைய குடும்ப வழியினர் அனைவரும்
  rationale: உடனடிச் சூழல் சவுலுடன் போரில் வீழ்ந்தவர்களைப் பற்றியது. ஆகவே சவுலின் விரிந்த உறவினர்கள் ஒவ்வொருவரும் இறந்தார்கள் என்ற முழுமையான வரலாற்றுக் கூற்றாக இதைச் சுருக்கவோ விரிவாக்கவோ கூடாது. ‘வீட்டார்’ என்பது எபிரெயச் சொல்லின் குடும்பம் அல்லது குடும்ப வழி சார்ந்த நெகிழ்வைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘இறந்தான் … இறந்தார்கள்’ என்ற மீட்சி மூல எபிரெயின் கட்டமைப்பையும் வலியுறுத்தலையும் காக்கிறது; அரைப்புள்ளி தமிழில் இரு தொடர்புடைய வாக்கியப் பகுதிகளைத் தெளிவாக இணைக்கிறது.
