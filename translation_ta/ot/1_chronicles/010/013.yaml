revisions:
- from: ஆகவே, சவுல் யாவேக்கு உண்மையற்றவராக நடந்துகொண்ட தன் உண்மையின்மையினாலும், தான் கடைப்பிடிக்காத யாவேயின் வார்த்தையினாலும், விசாரித்து அறிய ஒரு ஆவிகளோடு தொடர்புகொள்ளும் பெண்ணிடம்[a] ஆலோசனை கேட்டதினாலும் இறந்தார்.
