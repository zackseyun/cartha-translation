reference: 1 Chronicles 10:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יָּ֣מָת שָׁא֗וּל בְּ/מַֽעֲל/וֹ֙ אֲשֶׁ֣ר מָעַ֣ל בַּֽ/יהוָ֔ה עַל דְּבַ֥ר יְהוָ֖ה אֲשֶׁ֣ר לֹא שָׁמָ֑ר וְ/גַם לִ/שְׁא֥וֹל בָּ/א֖וֹב לִ/דְרֽוֹשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/013.yaml
  text: So Saul died for his unfaithfulness by which he was unfaithful to Yahweh[a], because of the word of Yahweh, which he did not keep, and also because he asked counsel of a medium[b], to inquire.
translation:
  language: ta
  text: ஆகவே, சவுல் யாவேக்கு உண்மையற்றவராக நடந்துகொண்ட தன் உண்மையின்மையினாலும், யாவேயின் வார்த்தையைக் கடைப்பிடிக்காததினாலும், மேலும் விசாரிப்பதற்காக ஆவிகளோடு தொடர்புகொள்பவரிடம் ஆலோசனை கேட்டதினாலும் இறந்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָת
  choice: ஆகவே ... இறந்தார்
  rationale: வாவ் தொடர்வினை உரையின் முடிவுரையையும் முந்தைய நிகழ்வுகளின் விளைவையும் முன்னெடுக்கிறது; ‘ஆகவே’ அந்த விளைவுத்தன்மையை இயல்பான தமிழில் காட்டுகிறது.
- source_word: בְּמַעֲלוֹ אֲשֶׁר מָעַל
  choice: உண்மையற்றவராக நடந்துகொண்ட தன் உண்மையின்மையினால்
  rationale: பெயர்ச்சொல்–வினைச்சொல் ஒரே வேரிலிருந்து வரும் எபிரேயச் சொல்விளையாட்டையும், உடன்படிக்கைச் சார்ந்த நம்பிக்கைத்துரோகத்தின் கனத்தையும் இயன்றவரை காக்கிறது.
- source_word: בַּיהוָה
  choice: யாவேக்கு
  rationale: מעל என்பதுடன் வரும் முன்னொட்டு, உண்மையின்மை யாருக்கு எதிராகச் செய்யப்பட்டது என்பதைக் குறிக்கிறது; தமிழில் ‘யாவேக்கு உண்மையற்றவர்’ இயல்பாக உள்ளது.
- source_word: עַל דְּבַר יְהוָה
  choice: யாவேயின் வார்த்தையினால்
  rationale: சவுலின் மரணத்திற்கான காரணமாகவும் அவன் உண்மையின்மை வெளிப்பட்ட தளமாகவும் யாவேயின் வார்த்தையைச் சுட்டுகிறது; அடுத்த உறவுப்பிரிவு அதன் பொருளைத் தெளிவாக்குகிறது.
- source_word: אֲשֶׁר לֹא שָׁמָר
  choice: தான் கடைப்பிடிக்காத
  rationale: שׁמר இங்கு வார்த்தைக்குக் கீழ்ப்படிந்து அதைக் கைக்கொள்வதைக் குறிக்கிறது; ‘கடைப்பிடி’ நவீனத் தமிழில் தெளிவான உடன்படிக்கைச் சார்ந்த பொருளைக் கொடுக்கிறது.
- source_word: וְגַם לִשְׁאוֹל בָּאוֹב
  choice: ஆவிகளோடு தொடர்புகொள்ளும் பெண்ணிடம் ஆலோசனை கேட்டதினாலும்
  rationale: கூடுதலான இரண்டாம் காரணத்தை வெளிப்படையாகக் காட்டுகிறது. 1 சாமுவேல் 28:7 சூழலில் குறிக்கப்படுபவர் பெண்; אוֹב என்பதன் ஆவி விசாரணைச் சார்ந்த பண்பையும் வாசகருக்குத் தெளிவாக்குகிறது.
- source_word: לִדְרֹשׁ
  choice: விசாரித்து அறிய
  rationale: ஆலோசனை கேட்டதன் நோக்கம் தகவல் அல்லது வழிகாட்டுதல் தேடுவதாக இருந்ததை இயல்பான தமிழில் காட்டுகிறது.
theological_decisions:
- issue: יהוה என்ற உடன்படிக்கைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயரான יהוה நேரடியாக உள்ளது; அதை ஒரு பட்டமாக மாற்றாமல் பெயராக ஒலிபெயர்க்கிறது.
- issue: சவுலின் குற்றத்தின் தன்மை
  choice: உண்மையின்மை / உண்மையற்றவராக நடந்துகொண்டார்
  alternative: குற்றம் / அத்துமீறல்
  rationale: מעל என்ற பெயர்ச்சொல் மற்றும் வினைச்சொல் பொதுவான தவறை மட்டுமல்லாமல், யாவேக்கு எதிரான நம்பிக்கைத்துரோகத்தைக் குறிக்கின்றன; ஒரே வேர் மீளுரைப்பையும் இந்தத் தேர்வு ஓரளவு காக்கிறது.
- issue: עַל דְּבַר יְהוָה என்பதன் தொடர்பு
  choice: யாவேயின் வார்த்தையினால்
  alternative: யாவேயின் வார்த்தைக்கு எதிராக
  rationale: עַל காரணம், தொடர்பு, அல்லது எதிர்மறை நோக்கம் என நுண்ணிய வேறுபாடுகளைக் கொள்ளலாம். தொடர்ந்து வரும் ‘தான் கடைப்பிடிக்காத’ என்பதுடன் காரணத் தொடர்பு இயல்பாக அமைகிறது; ஆயினும் வார்த்தைக்கு எதிரான செயலின் நிழற்பொருள் சூழலில் நீடிக்கிறது.
translation_notes:
  register: நவீனச் செந்தமிழ் சார்ந்த, பொதுவாசகருக்கு விளங்கும் கண்ணியமான நடை. எபிரேயத்தின் காரணத் தொடர் ஒரே வாக்கியத்தில் காக்கப்பட்டுள்ளது; மிகப் பழமையான ‘குறிசொல்பவள்’ போன்ற சொற்களைத் தவிர்த்து விளக்கமான பதம் பயன்படுத்தப்பட்டுள்ளது.
