  terminology: பெலிஸ்தியர்கள், சவுல், யோனத்தான், அபினதாப், மல்கிசூவா ஆகிய பெயர்வடிவங்களும் ‘மகன்கள்’ என்ற உறவுச்சொல்லும் ஏற்றவையாக உள்ளன. அடிக்குறிப்பு lexical மாற்றுவாய்ப்பையும் வினையின் அடிப்படைப் பொருளையும் பொருத்தமாக விளக்குகிறது.
