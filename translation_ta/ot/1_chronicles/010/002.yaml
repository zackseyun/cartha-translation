  source_fidelity: மூல எபிரெயத்தின் இருமுறை வரும் பெலிஸ்தியர்கள், சவுலும் அவன் மகன்களும் என்ற துரத்தலின் இலக்குகள், மற்றும் பெயரிடப்பட்ட சவுலின் மூன்று மகன்களைத் தாக்கி வீழ்த்துதல் ஆகியவை துல்லியமாக வெளிப்படுத்தப்பட்டுள்ளன. ‘விடாமல் துரத்தினார்கள்’ என்பது דבק + אחרי என்பதன் போர்ச் சூழலிலான நெருக்கமான, இடைவிடாத பின்தொடர்தல் பொருளை நன்றாகக் கொண்டுவருகிறது. ‘தாக்கி வீழ்த்தினார்கள்’ என்பது נכה வினையின் பரந்த ‘அடித்தல்/வீழ்த்தல்’ பொருளை தேவையின்றி நேரடியாக ‘கொன்றார்கள்’ எனக் குறுக்காமல் தருகிறது.
