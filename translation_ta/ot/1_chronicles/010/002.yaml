source:
  edition: WLC
  text: וַ/יַּדְבְּק֣וּ פְלִשְׁתִּ֔ים אַחֲרֵ֥י שָׁא֖וּל וְ/אַחֲרֵ֣י בָנָ֑י/ו וַ/יַּכּ֣וּ פְלִשְׁתִּ֗ים אֶת יוֹנָתָ֧ן וְ/אֶת אֲבִינָדָ֛ב וְ/אֶת מַלְכִּי שׁ֖וּעַ בְּנֵ֥י שָׁאֽוּל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/002.yaml
  text: And the Philistines pursued Saul and his sons[a], and the Philistines struck down Jonathan, Abinadab, and Malchi-shua, the sons of Saul.
translation:
  language: ta
  text: பெலிஸ்தியர்கள் சவுலையும் அவனுடைய மகன்களையும் விடாமல் துரத்தினார்கள்[a]. பெலிஸ்தியர்கள் சவுலின் மகன்களான யோனத்தான், அபினதாப், மல்கிசூவா ஆகியோரைத் தாக்கி வீழ்த்தினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவர்களை நெருக்கமாகத் துரத்தினார்கள்’ என்றும் மொழிபெயர்க்கலாம். இங்குள்ள எபிரெய வினை அடிப்படையில் ‘ஒட்டிக்கொள்’ அல்லது ‘பற்றிக்கொள்’ என்ற பொருளுடையது; போர்ச் சூழலில் அது இடைவிடாத, நெருக்கமான துரத்தலைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּדְבְּקוּ
  choice: விடாமல் துரத்தினார்கள்
  rationale: דבק என்பதன் அடிப்படைப் பொருள் ‘ஒட்டிக்கொள்/பற்றிக்கொள்’ என்பதாகும். אַחֲרֵי என்பதுடன் போர்ச் சூழலில் வரும்போது, ஒருவரை நெருக்கமாகவும் இடைவிடாமலும் பின்தொடர்வதைக் குறிக்கிறது. ‘விடாமல் துரத்தினார்கள்’ என்பது அந்தத் தீவிரத்தையும் இயல்பான நவீனத் தமிழையும் தக்கவைக்கிறது.
- source_word: אַחֲרֵי שָׁאוּל וְאַחֲרֵי בָנָיו
  choice: சவுலையும் அவனுடைய மகன்களையும்
  rationale: தமிழில் ‘துரத்து’ வினையுடன் செயப்படுபொருளை நேரடியாக அமைப்பது இயல்பானது. எபிரெயத்தில் ‘சவுலுக்குப் பின்னும் அவன் மகன்களுக்குப் பின்னும்’ என்று மீளக் கூறப்படும் அமைப்பின் இரு இலக்குகளும் இங்கே தெளிவாகப் பாதுகாக்கப்படுகின்றன.
- source_word: וַיַּכּוּ
  choice: தாக்கி வீழ்த்தினார்கள்
  rationale: נכה என்பது ‘அடி/தாக்கு/வீழ்த்து’ என்ற பரந்த பொருளுடையது. இப்போர்ச் சூழலில் ‘தாக்கி வீழ்த்தினார்கள்’ என்பது மரண விளைவைச் சூழல் உணர்த்த அனுமதிக்கிறது; அதே நேரத்தில் மூல வினையை நேரடியாக ‘கொன்றார்கள்’ என்று குறுக்குவதில்லை.
- source_word: פְלִשְׁתִּים
  choice: பெலிஸ்தியர்கள்
  rationale: தமிழில் நிலைபெற்ற மக்களினப் பெயர். மூலத்தில் இரு வாக்கியப் பகுதிகளிலும் பெயர் மீண்டும் வருவதால், வலியுறுத்தலைப் பாதுகாக்க இரண்டாவது இடத்திலும் சுட்டுப்பெயராக மாற்றாமல் மீண்டும் வழங்கப்பட்டுள்ளது.
- source_word: יוֹנָתָן
  choice: யோனத்தான்
  rationale: எபிரெயப் பெயருக்கான வழக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: אֲבִינָדָב
  choice: அபினதாப்
  rationale: எபிரெயப் பெயருக்கான தெளிவான தமிழ் ஒலிபெயர்ப்பு.
- source_word: מַלְכִּי שׁוּעַ
  choice: மல்கிசூவா
  rationale: இரு கூறுகளைக் கொண்ட எபிரெயப் பெயரைத் தமிழில் வாசிக்க இயல்பான ஒரே பெயராக ஒலிபெயர்க்கிறது.
- source_word: בְּנֵי שָׁאוּל
  choice: சவுலின் மகன்களான
  rationale: பெயரிடப்பட்ட மூவரையும் அடையாளப்படுத்தும் மூலத்தின் பின்னிணைப்புச் சொற்றொடரை இயல்பான தமிழில் முன்னதாக இணைக்கிறது.
