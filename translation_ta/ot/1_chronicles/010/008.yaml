  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் கண்ணியமான கதைநடைத் தொனியுடனும் வடிவமைக்கப்பட்டது. எபிரெயப் போர்க்களப் படிமமான “வீழ்ந்து” என்பதும், உடல்களிலிருந்து பொருள்களைக் கழற்றும் வினைநுணுக்கமும் பாதுகாக்கப்பட்டுள்ளன.
