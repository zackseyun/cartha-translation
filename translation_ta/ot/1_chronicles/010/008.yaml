base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/008.yaml
  text: It happened on the next day that the Philistines came to strip the slain[b][a], and they found Saul and his sons fallen on Mount Gilboa.
translation:
  language: ta
  text: 'மறுநாளில்[a], பெலிஸ்தியர்கள் போரில் கொல்லப்பட்டவர்களிடமிருந்தவற்றைக் கழற்றி எடுத்துக்கொள்ள[b] வந்தார்கள். அப்போது கில்போவா மலையில் சவுலும் அவனுடைய மகன்களும் வீழ்ந்து கிடப்பதை அவர்கள் கண்டார்கள்.


    [a] அல்லது, “அடுத்த நாளில்.”

    [b] போரில் இறந்தவர்களிடமிருந்து உடைகள், கவசங்கள் போன்ற கொள்ளைப் பொருள்களைக் கழற்றி எடுப்பதை இது குறிக்கிறது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அடுத்த நாளில்.”
    reason: lexical_alternative
  - marker: b
    text: போரில் இறந்தவர்களிடமிருந்து உடைகள், கவசங்கள் போன்ற கொள்ளைப் பொருள்களைக் கழற்றி எடுப்பதை இது குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי
  choice: '[தனி சொற்றொடராக வெளிப்படுத்தாமல், தொடரும் நிகழ்வாக அமைத்தல்]'
  rationale: இது எபிரெயக் கதைநடையின் தொடர்ச்சி சூத்திரம். தமிழில் தனியாக “அது நிகழ்ந்தது” என்று சேர்ப்பது இயல்பற்றதாக இருப்பதால், மறுநாளில் நிகழ்ந்த செயலை நேரடியாகத் தொடங்குவது அதன் கதைத் தொடர்ச்சியை இயல்பாகக் காட்டுகிறது.
- source_word: מִמָּחֳרָת
  choice: மறுநாளில்
  rationale: முன்னர் விவரிக்கப்பட்ட போர்நிகழ்வுகளுக்கு அடுத்த நாளைக் குறிக்கிறது; “மறுநாளில்” என்பது சுருக்கமான, இயல்பான நவீனத் தமிழ்.
- source_word: לְפַשֵּׁט
  choice: கழற்றி எடுத்துக்கொள்ள
  rationale: போரில் இறந்தவர்களின் உடைகள், கவசங்கள் முதலியவற்றை அகற்றிக் கொள்ளும் செயலைக் குறிக்கும். பொதுவான “கொள்ளையிட” என்பதைவிட எபிரெய வினையின் உடலிலிருந்து கழற்றும் நுணுக்கத்தை இது காக்கிறது.
- source_word: הַחֲלָלִים
  choice: போரில் கொல்லப்பட்டவர்கள்
  rationale: பொதுவாக இறந்தவர்கள் என்பதல்லாமல், போரில் வெட்டுண்டு இறந்தவர்களைக் குறிக்கும் இராணுவச் சூழலைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: נֹפְלִים
  choice: வீழ்ந்து கிடப்பதை
  rationale: “வீழ்ந்தவர்கள்” என்ற எபிரெயப் போர்க்களப் படிமத்தைப் பேணுகிறது; அவர்கள் இறந்திருந்தார்கள் என்பதை விளக்கமாகச் சேர்த்து மூலத்தின் படிமத்தை மாற்றவில்லை.
- source_word: בְּהַר גִּלְבֹּעַ
  choice: கில்போவா மலையில்
  rationale: பெயரிடப்பட்ட மலையைக் குறிக்கும் இடப்பெயர்ச் சொற்றொடரின் இயல்பான தமிழ் வடிவம்.
