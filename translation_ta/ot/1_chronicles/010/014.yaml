  text: וְ/לֹֽא דָרַ֥שׁ בַּֽ/יהוָ֖ה וַ/יְמִיתֵ֑/הוּ וַ/יַּסֵּב֙ אֶת הַ/מְּלוּכָ֔ה לְ/דָוִ֖יד בֶּן יִשָֽׁי־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/014.yaml
  text: He did not seek Yahweh[b][a], so he put him to death and turned the kingdom over to David son of Jesse.
translation:
  language: ta
  text: அவன் யாவேயை நாடவில்லை[a]. ஆகவே, யாவே அவனை மரணமடையச் செய்து, அரசாட்சியை[b] ஈசாயின் மகன் தாவீதுக்குக் கொடுத்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘யாவேயிடம் விசாரிக்கவில்லை’ அல்லது ‘யாவேயிடம் ஆலோசனை கேட்கவில்லை.’
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் ‘அரசாட்சி’; ‘அரசுரிமை’ அல்லது ‘ராஜ்யம்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: דָרַשׁ בַּיהוָה
  choice: யாவேயை நாடவில்லை
  rationale: דרשׁ என்பதற்கு இங்கு ‘நாடுதல்’, ‘விசாரித்தறிதல்’, ‘ஆலோசனை கேட்குதல்’ ஆகிய பொருள்கள் சாத்தியம். ‘நாடவில்லை’ என்பது இறைவனிடமிருந்து வழிகாட்டுதலைத் தேடாததையும் அவரை உறவுப்பூர்வமாக நாடாததையும் உள்ளடக்கும் இயல்பான தமிழ் சொற்றொடர்.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான יהוה-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், அதன் பரவலாக ஏற்றுக்கொள்ளப்பட்ட ஒலிபெயர்ப்பைத் தமிழில் வழங்குகிறது.
- source_word: וַיְמִיתֵהוּ
  choice: அவனை மரணமடையச் செய்து
  rationale: מות என்பதன் ஹிஃபில் வடிவிலுள்ள காரணவினைப் பொருளைத் தக்கவைக்கிறது. வெறும் அனுமதி என மென்மைப்படுத்தாமலும், தமிழில் இயல்பாகவும் உள்ளது.
- source_word: וַיַּסֵּב
  choice: மாற்றினார்
  rationale: அரசாட்சி ஒருவரிடமிருந்து மற்றொருவரிடம் செல்லும்படி செய்தல் என்ற ஹிஃபில் வினையின் கருத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: הַמְּלוּכָה
  choice: அரசாட்சி
  rationale: מְלוּכָה என்பது ராஜ்யம், அரசாட்சி, அரசுரிமை ஆகிய பொருள்களைக் கொள்ளலாம். இங்கு சவுலிடமிருந்து தாவீதுக்கு மாறுவது ஆளும் அதிகாரம் என்பதால் ‘அரசாட்சி’ பொருத்தமான பரந்த சொல்லாகும்.
- source_word: לְדָוִיד בֶּן־יִשַׁי
  choice: ஈசாயின் மகன் தாவீதிடம்
  rationale: எபிரெய தந்தைவழி அடையாளத்தை நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் வழங்குகிறது.
theological_decisions:
- issue: சவுலின் மரணத்தில் இறைவனின் செயற்பாடு
  choice: யாவே சவுலை மரணமடையச் செய்தார் என்று நேரடியாகக் கூறுதல்
  alternative: யாவே சவுல் இறக்க அனுமதித்தார் என்று கூறுதல்
  rationale: வினையின் காரணவினை வடிவமும் சூழலில் தொடரும் எழுவாயும் யாவேயின் செயற்பாட்டை நேரடியாகக் குறிப்பிடுகின்றன. அதை வெறும் அனுமதியாக மாற்றாமல், அதேவேளையில் இரண்டாம் நிலைக் காரணங்கள் குறித்த விளக்கத்தைச் சேர்க்காமல் மூலத்தின் இறையியல் அழுத்தம் தக்கவைக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. தெய்வப் பெயர் ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டுள்ளது. காரணவினையும் அரசாட்சி மாற்றமும் மூலத்தின் நேரடித் தன்மையோடு பாதுகாக்கப்பட்டுள்ளன.
