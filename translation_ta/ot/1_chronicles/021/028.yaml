reference: 1 Chronicles 21:28
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: בָּ/עֵ֣ת הַ/הִ֔יא בִּ/רְא֤וֹת דָּוִיד֙ כִּי עָנָ֣/הוּ יְהוָ֔ה בְּ/גֹ֖רֶן אָרְנָ֣ן הַ/יְבוּסִ֑י וַ/יִּזְבַּ֖ח שָֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/028.yaml
  text: At that time[a], when David saw that Yahweh had answered him at the threshing floor of Ornan the Jebusite, he sacrificed there.
translation:
  language: ta
  text: அந்த நேரத்தில், எபூசியனான ஒர்னானின் களத்துமேட்டில் யாவே தாவீதுக்குப் பதில் அளித்ததைத் தாவீது கண்டபோது, அவன் அங்கே பலியிட்டான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தாவீதுக்கு மறுமொழி அளித்ததை.” இங்கே எபிரெய வினைச்சொல், குறிப்பாக வேண்டுதலுக்கோ பலிக்கோ அளிக்கப்படும் பதிலைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: அந்த நேரத்தில்
  rationale: இது வழக்கமான காலக் குறிப்பு; முந்தைய நிகழ்வுடன் உள்ள கதைத் தொடர்பைக் காக்கிறது, ஆனால் மிகத் துல்லியமான உடனடித்தன்மையைச் சேர்ப்பதில்லை.
- source_word: בִּרְאוֹת
  choice: கண்டபோது
  rationale: ב முன்னொட்டுடன் வரும் infinitive construct காலச் சூழலைக் குறிக்கிறது; நவீனத் தமிழில் இயல்பாக ‘கண்டபோது’ என வருகிறது.
- source_word: כִּי
  choice: …என்பதை / …தை
  rationale: தாவீது கண்டதன் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது; காரணப் பொருளைத் தேவையின்றி சேர்க்காமல் தமிழ் வாக்கியத்தில் வினைப்பெயர் அமைப்பால் தரப்பட்டுள்ளது.
- source_word: עָנָהוּ
  choice: தனக்குப் பதிலளித்ததை
  rationale: ענה இச்சூழலில் வேண்டுதல் அல்லது பலிக்குக் கடவுள் பதிலளிப்பதைக் குறிக்கிறது; suffix தாவீதைக் குறிக்கும் வகையில் ‘தனக்கு’ என இயல்பாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான நான்கெழுத்துத் திருப்பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: בְּגֹרֶן
  choice: களத்துமேட்டில்
  rationale: גֹּרֶן என்பது தானியத்தைப் போரடித்துத் தூற்றும் இடம்; ‘களத்துமேடு’ தமிழில் புரிந்துகொள்ளக்கூடிய, சூழலுக்கேற்ற சொல்.
- source_word: אָרְנָן הַיְבוּסִי
  choice: எபூசியனான ஒர்னான்
  rationale: பெயர் ஒலிபெயர்க்கப்பட்டு, இன அடையாளம் இயல்பான தமிழ் அடைமொழி அமைப்பில் தரப்பட்டுள்ளது.
- source_word: וַיִּזְבַּח
  choice: அவன் … பலியிட்டான்
  rationale: זבח என்பதன் பலியிடுதல் என்ற நேரடியான பொருளைக் காக்கிறது; பொருள் தெளிவுக்காக எழுவாய் மீண்டும் குறிப்பிடப்பட்டுள்ளது.
- source_word: שָׁם
  choice: அங்கே
  rationale: இடத்தைக் குறிக்கும் எளிய வினையடை; முன்பு குறிப்பிடப்பட்ட களத்துமேட்டையே சுட்டுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக இருப்பதால், பட்டப்பெயரால் மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டது.
- issue: தெய்வீகப் பதிலின் தன்மை
  choice: பதிலளித்தார்
  alternative: மறுமொழி அளித்தார் / செவிகொடுத்தார்
  rationale: ענה என்பதன் பொதுவான ‘பதிலளித்தல்’ பொருளை வைத்திருக்கிறது; எந்தக் குறிப்பிட்ட வழியில் பதில் வந்தது என்பதை மொழிபெயர்ப்பு தீர்மானிப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட வேதாகம நடையில் வடிவமைக்கப்பட்டது. ‘களத்துமேடு’ பொதுவாசகனுக்குப் புரியக்கூடிய வேளாண்மைச் சொலாகத் தேர்ந்தெடுக்கப்பட்டது; வாக்கியத்தின் எபிரெய கால-உள்ளடக்க உறவு இயல்பான தமிழ் தொடரில் பாதுகாக்கப்பட்டுள்ளது.
