  text: וַ/יְדַבֵּ֤ר יְהוָה֙ אֶל גָּ֔ד חֹזֵ֥ה דָוִ֖יד לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/009.yaml
  text: And Yahweh spoke to Gad[a], David’s seer, saying,
translation:
  language: ta
  text: 'யாவே[a], தாவீதின் தரிசனக்காரரான காத் என்பவரிடம் இவ்வாறு கூறினார்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரேயத்தில்: “YHWH”; இதை “யாவே” என்றும் ஒலிபெயர்க்கலாம்.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பேசிச் சொன்னது
  rationale: வாவ் தொடருடன் வரும் דּבר அடுத்த கதைநிகழ்வை அறிமுகப்படுத்துகிறது. தொடர்ந்து வரும் לֵאמֹר என்பதையும் இயல்பான தமிழில் இணைத்துக் காட்டுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது இறைப்பட்டம் அல்ல, எபிரெய தனிப்பெயரான நான்கெழுத்துத் திருப்பெயர்; அதனைத் தமிழில் ஒலிபெயர்த்துள்ளது.
- source_word: אֶל
  choice: -ிடம்
  rationale: பேச்சு யாரை நோக்கி உரைக்கப்பட்டது என்பதைக் குறிக்கும் இயல்பான தமிழ் வேற்றுமை வடிவம்.
- source_word: גָּד
  choice: காத்
  rationale: எபிரெய ஆள்பெயரின் தமிழ் ஒலிபெயர்ப்பு.
- source_word: חֹזֵה
  choice: தரிசனக்காரர்
  rationale: வெளிப்படுத்தப்பட்ட காட்சியைப் பெறுபவர் என்ற சொல்லின் குறிப்பிட்ட பொருளைக் காக்கிறது; பொதுவான ‘தீர்க்கதரிசி’ என்பதுடன் அமைதியாக ஒன்றாக்கவில்லை.
- source_word: דָוִיד
  choice: தாவீதின்
  rationale: எபிரெய இணைப்புநிலையை இயல்பான தமிழ் உடைமை வேற்றுமையில் தருகிறது.
- source_word: לֵאמֹר
  choice: 'சொன்னது:'
  rationale: நேரடிக் கூற்றை அறிமுகப்படுத்தும் எபிரெய வாய்ப்பாட்டைத் தமிழில் இயல்பாகக் காட்டுகிறது; அடுத்த வசனத்தில் உரை தொடர்வதை முக்காற்புள்ளி உணர்த்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் பட்டமல்ல, தனிப்பெயரே உள்ளது. ‘யாவே’ என்பது ஏற்றுக்கொள்ளப்பட்ட ஒலியமைப்பைப் பிரதிபலித்து, பெயரை ஒரு பட்டத்தால் மாற்றுவதைத் தவிர்க்கிறது.
- issue: חֹזֵה என்பதன் பணிப்பெயர்
  choice: தரிசனக்காரர்
  alternative: தீர்க்கதரிசி; காட்சியாளர்
  rationale: மூலச்சொல் தரிசனத்தின் வழி வெளிப்பாடு பெறுபவரைக் குறிக்கிறது. ‘தரிசனக்காரர்’ இந்த நுணுக்கத்தையும் பிற தீர்க்கதரிசனப் பதங்களிலிருந்து உள்ள வேறுபாட்டையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான வேதாகம நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. ‘பேசிச் சொன்னது’ என்பது וַיְדַבֵּר ... לֵאמֹר என்ற இரட்டைக் கட்டமைப்பைச் சொல்லுக்குச் சொல் கடினமாக்காமல் இயல்பாக எடுத்துரைக்கிறது.
