base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/017.yaml
  text: Then David said to God[a], “Was it not I who ordered the people to be counted? I am the one who has sinned and done great evil. But these sheep—what have they done? O Yahweh my God, please let your hand be against me and against my father’s house[d][c][b], but not against your people for a plague.”
translation:
  language: ta
  text: அப்போது தாவீது கடவுளிடம், “மக்களைக் கணக்கெடுக்கச் சொன்னவன் நான்தானே?[a] பாவம் செய்து மிகுந்த தீமை செய்தவன் நானே. ஆனால் இந்த ஆடுகள்—இவர்கள் என்ன செய்தார்கள்?[b] என் கடவுளாகிய யாவே, தயவுசெய்து உமது கை என்மீதும் என் தந்தையின் குடும்பத்தினர்மீதும் இருக்கட்டும்[c]; ஆனால் உமது மக்கள்மீது கொள்ளைநோய் வர வேண்டாம்[d]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில், “மக்களைக் கணக்கெடுக்க நான் சொல்லவில்லையா?” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “இந்த ஆடுகள்” என்பது மக்களைக் குறிக்கும் உருவகம்.
    reason: cultural_note
  - marker: c
    text: “உமது கை ... இருக்கட்டும்” என்பதில் ‘கை’ என்பது செயலில் வெளிப்படும் வல்லமை அல்லது தீர்ப்பைக் குறிக்கும் எபிரெய வழக்கு. “உமது கை எனக்கும் என் தந்தையின் குடும்பத்தினருக்கும் எதிராக இருக்கட்டும்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: d
    text: அல்லது, “ஆனால் உமது மக்கள்மீது கொள்ளைநோயைக் கொண்டுவர வேண்டாம்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא אֲנִי אָמַרְתִּי לִמְנוֹת בָּעָם
  choice: மக்களைக் கணக்கெடுக்கச் சொன்னவன் நான்தானே?
  rationale: எபிரெயச் சொற்றொடரின் ‘நான் சொல்லவில்லையா?’ என்ற வினாவையும் கணக்கெடுப்புக்கான தாவீதின் பொறுப்பையும் இயல்பான தமிழில் காக்கிறது; ‘கட்டளையிட்டேன்’ என்று மூலத்தைவிட வலுப்படுத்தவில்லை.
- source_word: וַאֲנִי הוּא אֲשֶׁר חָטָאתִי
  choice: பாவம் செய்தவன் நானே
  rationale: וַאֲנִי הוּא என்பதிலுள்ள தனிப்பட்ட பொறுப்பின் வலியுறுத்தலை ‘நானே’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וְהָרֵעַ הֲרֵעוֹתִי
  choice: நான் மிகவும் தீமையாக நடந்துகொண்டேன்
  rationale: வினையெச்ச முழுவடிவும் வினையும் சேர்ந்த எபிரெய வலியுறுத்தலை ‘மிகவும்’ என்பதால் இயல்பாகத் தெரிவிக்கிறது.
- source_word: וְאֵלֶּה הַצֹּאן
  choice: ஆனால் இந்த ஆடுகள்
  rationale: மக்களைக் குறிக்கும் மேய்ப்பியல் உருவகத்தை விளக்கமாக மாற்றாமல் அப்படியே பாதுகாக்கிறது.
- source_word: יְהוָה אֱלֹהַי
  choice: என் கடவுளாகிய யாவே
  rationale: தெய்வீகப் பெயரான יהוה-ஐ ஒரு பட்டத்தால் மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்த்து, אֱלֹהַי-ஐ ‘என் கடவுள்’ என்ற உடைமை உறவுடன் வழங்குகிறது.
- source_word: תְּהִי נָא יָדְךָ בִּי וּבְבֵית אָבִי
  choice: தயவுசெய்து உமது கை என்மீதும் என் தந்தையின் வீட்டார்மீதும் இருக்கட்டும்
  rationale: ‘கை’ என்ற மூல உருவகத்தையும் נָא-வின் வேண்டுகோள் தொனியையும் காக்கிறது. ‘தந்தையின் வீடு’ இங்கு குடும்பத்தார் அல்லது வம்சத்தாரைக் குறிக்கும் என்பதால் ‘வீட்டார்’ என வழங்கப்பட்டது.
- source_word: וּבְעַמְּךָ לֹא לְמַגֵּפָה
  choice: உமது மக்கள்மீது கொள்ளைநோயாக இருக்க வேண்டாம்
  rationale: முந்தைய ‘உமது கை’ என்பதையே எழுவாயாகத் தொடர்ந்து, לְמַגֵּפָה-வின் சுருக்கமான எபிரெய அமைப்பையும் நியாயத்தீர்ப்பு சார்ந்த வேண்டுகோளையும் காக்கிறது.
theological_decisions:
- issue: יהוה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட தெய்வீகப் பெயர் நேரடியாக உள்ளது. ஆகவே அதைப் பட்டமாக மாற்றாமல், பரவலாக ஏற்கப்படும் ஒலிப்புக்கு நெருக்கமாக ‘யாவே’ என்று வழங்கப்பட்டுள்ளது.
- issue: தாவீதின் மக்களைக் குறித்த ‘ஆடுகள்’ உருவகம்
  choice: இந்த ஆடுகள்
  alternative: இந்த மக்கள் / இந்த மந்தை
  rationale: மூல உருவகம் தாவீதை மேய்ப்பனாகவும் மக்களை ஆடுகளாகவும் மறைமுகமாக நிறுத்துகிறது; அதிலுள்ள இறையியல் மற்றும் அரசியல் பதற்றத்தை விளக்கமிட்டு நீக்காமல் பாதுகாக்கிறது.
- issue: ‘உமது கை’ என்பதன் தீர்ப்புச் சார்ந்த பொருள்
  choice: உமது கை ... இருக்கட்டும்
  alternative: உமது தண்டனை ... வரட்டும்
  rationale: சூழலில் தண்டனை குறிக்கப்பட்டாலும், ‘கை’ என்ற உருவகம் ஆற்றல், செயல், தீர்ப்பு ஆகியவற்றை ஒருங்கே தாங்குகிறது. குறிப்பிட்ட ஒரே விளக்கமாகச் சுருக்காமல் மூலத்தின் பரப்பை காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் நேரடி வேண்டுகோளின் கண்ணியமான தொனியுடனும் மொழிபெயர்க்கப்பட்டது. தாவீதின் குற்றஒப்புதல் ‘நானே’ மூலம் வலியுறுத்தப்பட்டுள்ளது. ‘ஆடுகள்’, ‘உமது கை’, ‘தந்தையின் வீட்டார்’ ஆகிய மூல உருவகங்களும் சமூகச் சொற்களும் இயன்றவரை காக்கப்பட்டுள்ளன.
