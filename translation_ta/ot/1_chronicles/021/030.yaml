source:
  edition: WLC
  text: וְ/לֹא יָכֹ֥ל דָּוִ֛יד לָ/לֶ֥כֶת לְ/פָנָ֖י/ו לִ/דְרֹ֣שׁ אֱלֹהִ֑ים כִּ֣י נִבְעַ֔ת מִ/פְּנֵ֕י חֶ֖רֶב מַלְאַ֥ךְ יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/030.yaml
  text: But David could not go before it to seek God[a], because he was terrified by the sword of the angel of Yahweh.
translation:
  language: ta
  text: ஆனால் தாவீது கடவுளைத் தேடுவதற்காக அதற்கு முன்பாகச் செல்ல முடியவில்லை[a]; ஏனெனில் யெகோவாவின் தூதனின் வாளின் காரணமாக அவர் திகிலடைந்திருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இங்குள்ள சுட்டுப்பெயர் கிபியோனிலிருந்த திருவாசஸ்தலத்தைக் குறிக்காமல் கடவுளைக் குறிப்பதாக எடுத்துக்கொண்டால், “அவர் முன்னிலையில்.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/לֹא
  choice: ஆனால் ... முடியவில்லை
  rationale: முந்தைய வசனத்துடன் உள்ள மென்மையான மாறுபாட்டையும் மறுப்பையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יָכֹל ... לָ/לֶכֶת
  choice: செல்ல முடியவில்லை
  rationale: יכולתைக் குறிக்கும் வினையையும் இயக்கத்தைக் குறிக்கும் இற infinitive-ஐயும் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: לְ/פָנָי/ו
  choice: அதற்கு முன்பாக
  rationale: ஆண்பால் ஒருமை பின்னொட்டு, உடனடி சூழலில் கிபியோனிலிருந்த திருவாசஸ்தலத்தைச் சுட்டுவதாக மிகச் சாத்தியம்; தமிழில் அஃறிணைச் சுட்டுப்பெயர் அந்தப் பொருளை இயல்பாகத் தருகிறது.
- source_word: לִ/דְרֹשׁ אֱלֹהִים
  choice: கடவுளைத் தேடுவதற்காக
  rationale: דרשׁ என்பதன் வழிபாடு, விண்ணப்பம், கடவுளின் வழிநடத்தலை நாடுதல் ஆகிய பரந்த பொருளைச் சுருக்காமல் காக்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: தாவீது செல்ல முடியாததற்கான காரணத்தைத் தெளிவாக அறிமுகப்படுத்துகிறது.
- source_word: נִבְעַת
  choice: மிகவும் அஞ்சினார்
  rationale: Niphal வடிவம் தீவிரமான அச்சத்தால் ஆட்கொள்ளப்பட்ட நிலையைக் குறிக்கிறது; நவீன தமிழில் இயல்பாக அதே வலிமையைத் தருகிறது.
- source_word: מִ/פְּנֵי חֶרֶב
  choice: வாளைக் கண்டு
  rationale: வாள் ஏற்படுத்திய அச்சத்தின் காரணத்தைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; ஆயுதத்தின் நேரடியான குறிப்பையும் காக்கிறது.
- source_word: מַלְאַךְ יְהוָה
  choice: யெகோவாவின் தூதன்
  rationale: இச்சூழலில் מלאך ஒரு விண்ணுலகத் தூதரைக் குறிக்கிறது; יהוה என்ற தனிப்பெயர் ஒலிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: לְפָנָיו என்பதிலுள்ள சுட்டுப்பெயரின் குறிப்பு
  choice: கிபியோனிலிருந்த திருவாசஸ்தலம் அல்லது சந்திப்புக் கூடாரத்தைக் குறிக்கும் ‘அதற்கு முன்பாக’
  alternative: கடவுளைக் குறிக்கும் ‘அவருக்கு முன்பாக’
  rationale: முந்தைய வசனத்தில் கர்த்தரின் திருவாசஸ்தலமும் பலிபீடமும் உடனடி முன்னிலைகளாக வருகின்றன; இருப்பினும் இலக்கண ரீதியாக கடவுளைக் குறிப்பதற்கும் வாய்ப்புள்ளதால் அடிக்குறிப்பில் மாற்று வாசிப்பு காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய உரையின் சாத்தியமான சுட்டுப்பெயர் இருமை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
