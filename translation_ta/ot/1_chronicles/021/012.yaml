source:
  edition: WLC
  text: אִם שָׁל֨וֹשׁ שָׁנִ֜ים רָעָ֗ב וְ/אִם שְׁלֹשָׁ֨ה חֳדָשִׁ֜ים נִסְפֶּ֥ה מִ/פְּנֵי צָרֶי/ךָ֮ וְ/חֶ֣רֶב אוֹיְבֶ֣/ךָ לְ/מַשֶּׂגֶת֒ וְ/אִם שְׁלֹ֣שֶׁת יָ֠מִים חֶ֣רֶב יְהוָ֤ה וְ/דֶ֨בֶר֙ בָּ/אָ֔רֶץ וּ/מַלְאַ֣ךְ יְהוָ֔ה מַשְׁחִ֖ית בְּ/כָל גְּב֣וּל יִשְׂרָאֵ֑ל וְ/עַתָּ֣ה רְאֵ֔ה מָֽה אָשִׁ֥יב אֶת שֹׁלְחִ֖/י דָּבָֽר־־־׀־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/012.yaml
  text: either three years of famine[a], or three months of being swept away before your foes while the sword of your enemies overtakes you, or three days of the sword of Yahweh, even pestilence in the land, with the angel of Yahweh destroying throughout all the territory of Israel[b]. Now consider what answer I should return to the one who sent me.
translation:
  language: ta
  text: மூன்று ஆண்டுகள் பஞ்சமோ, அல்லது மூன்று மாதங்கள் உன் எதிரிகளுக்கு முன்பாக நீ அழிந்துபோவதோ[a]—உன் பகைவர்களின் வாள் உன்னை எட்டிப்பிடிக்கும்போது—அல்லது மூன்று நாட்கள் யாவேவின் வாளாகிய, நாட்டில் வரும் கொள்ளைநோயும்[b], யாவேவின் தூதர் இஸ்ரவேலின் எல்லாப் பகுதிகளிலும் அழிவை ஏற்படுத்துவதுமோ? இப்போது, என்னை அனுப்பியவருக்கு நான் என்ன பதில் சொல்ல வேண்டும் என்பதைச் சிந்தித்துப் பார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அழிக்கப்பட்டுப்போவது” அல்லது “முறியடிக்கப்படுவது” என்றும் மொழிபெயர்க்கலாம்; எபிரேயச் சொல் போரில் அழிவுக்குள்ளாதல் அல்லது முறியடிக்கப்படுதல் என்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “பெருந்தொற்று” என்றும் மொழிபெயர்க்கலாம்; எபிரேயச் சொல் நியாயத்தீர்ப்பாக வரும் பரவலான கொடிய நோயைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָעָב
  choice: பஞ்சம்
  rationale: ஒரு நாட்டைத் தாக்கும் நீடித்த உணவுப் பற்றாக்குறையைக் குறிக்கும் இயல்பான, நிலையான தமிழ் சொல்.
- source_word: נִסְפֶּה
  choice: அழித்தொழிக்கப்படுவது
  rationale: நிஃபால் வினையெச்சம் போரில் அழிவுக்கும் வீழ்ச்சிக்கும் உட்படுத்தப்படுவதைச் சுட்டுகிறது; மரணத்தை மட்டும் மிகக் குறுகலாகக் குறிப்பிடாமல் அழிவின் வலிமையைத் தக்கவைக்கிறது.
- source_word: מִפְּנֵי צָרֶיךָ
  choice: உன் பகைவர்களுக்கு முன்பாக
  rationale: பகைவர்களின் முன்னிலையில் தோற்கடிக்கப்பட்டு விரட்டப்படுதல் என்ற இராணுவச் சூழலை வடிவத்துக்கு நெருக்கமாகப் பாதுகாக்கிறது.
- source_word: חֶרֶב אוֹיְבֶיךָ
  choice: உன் எதிரிகளின் வாள்
  rationale: எபிரெயக் கட்டமைப்பையும் வாள் என்ற போர்க்கால உருவகத்தையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: לְמַשֶּׂגֶת
  choice: உன்னை எட்டிப்பிடிக்கும்படி
  rationale: துரத்திவரும் எதிரிப்படை ஒருவரை எட்டிப் பிடித்தல் என்ற வினையின் சூழல்சார்ந்த பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: חֶרֶב יְהוָה
  choice: யாவேவின் வாள்
  rationale: எதிரிகளின் வாளுக்கும் யாவேவின் வாளுக்கும் இடையிலான திட்டமிட்ட முரண்பாட்டைப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் நேரடியாக வரும் தேவப் பெயரை பட்டப்பெயராக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: דֶבֶר
  choice: கொள்ளைநோய்
  rationale: நியாயத்தீர்ப்பாக நாட்டில் பரவும் கொடிய தொற்றுநோயைக் குறிக்கும் பொருத்தமான, புரிந்துகொள்ளக்கூடிய தமிழ் சொல்.
- source_word: מַלְאַךְ יְהוָה
  choice: யாவேவின் தூதர்
  rationale: מַלְאַךְ என்பதன் அடிப்படைப் பொருளைத் தக்கவைத்து, இவ்வுருவின் துல்லியமான இறையியல் அடையாளத்தை மொழிபெயர்ப்பில் தீர்மானிக்காமல் விடுகிறது.
- source_word: מַשְׁחִית
  choice: அழிவை உண்டாக்குவது
  rationale: தூதரின் தொடர்ச்சியான அழிக்கும் செயலை இயல்பான தமிழில் வினைநிலையாக வெளிப்படுத்துகிறது.
- source_word: בְּכָל גְּבוּל יִשְׂרָאֵל
  choice: இஸ்ரவேலின் எல்லாப் பகுதிகளிலும்
  rationale: எல்லைக்கோடுகளை மட்டும் அல்லாமல் இஸ்ரவேல் நிலப்பரப்பு முழுவதையும் இங்கு גְּבוּל குறிக்கிறது.
- source_word: רְאֵה
  choice: சிந்தித்துப் பார்
  rationale: உடல்ரீதியாகப் பார்ப்பதை அல்ல, தேர்வை ஆராய்ந்து பதில் கூறுவதை இக்கட்டளை கோருவதால் அதன் உரையாடல் வலிமையைத் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற தேவப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் நான்கு எழுத்துகளைக் கொண்ட தேவப் பெயர் நேரடியாக உள்ளது; அதை ஒரு பட்டப்பெயரால் மாற்றாமல் தனிப்பெயராகப் பாதுகாக்கிறது.
- issue: מַלְאַךְ יְהוָה என்பவரின் இயல்பு
  choice: யாவேவின் தூதர்
  alternative: யாவேவின் வானதூதர்
  rationale: இவர் படைக்கப்பட்ட வானதூதரா அல்லது தனிப்பட்ட தேவ வெளிப்பாடா என்பதை வசனம் வெளிப்படையாகத் தீர்மானிக்கவில்லை; ஆகவே 'தூதர்' என்ற சொல் அந்த இறையியல் பதற்றத்தைத் திறந்தவாறே வைக்கிறது.
- issue: דֶבֶר மற்றும் חֶרֶב יְהוָה இடையிலான தொடர்பு
  choice: அதாவது நாட்டில் கொள்ளைநோய்
  alternative: யாவேவின் வாளும் நாட்டில் கொள்ளைநோயும்
  rationale: இங்கு கொள்ளைநோய் 'யாவேவின் வாள்' எவ்வாறு செயல்படுகிறது என்பதை விளக்கும் இணைப்பாக வாசிக்கலாம்; 'அதாவது' அந்த appositional உறவை வெளிப்படுத்துகிறது, ஆனால் தனியே நான்காவது தேர்வாக மாற்றுவதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், நேரடியும் கண்ணியமுமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. மூன்று தேர்வுகளின் நீண்ட எபிரெய வாக்கிய அமைப்பு தெளிவாகத் தொடரப் பிரிப்புக்குறிகள் பயன்படுத்தப்பட்டுள்ளன; மூலத்தின் இராணுவ உருவகங்களும் இறையியல் தெளிவின்மைகளும் பாதுகாக்கப்பட்டுள்ளன.
