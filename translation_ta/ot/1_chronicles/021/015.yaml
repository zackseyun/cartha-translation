  text: וַ/יִּשְׁלַח֩ הָ/אֱלֹהִ֨ים מַלְאָ֥ךְ לִֽ/ירוּשָׁלִַם֮ לְ/הַשְׁחִיתָ/הּ֒ וּ/כְ/הַשְׁחִ֗ית רָאָ֤ה יְהוָה֙ וַ/יִּנָּ֣חֶם עַל הָֽ/רָעָ֔ה וַ/יֹּ֨אמֶר לַ/מַּלְאָ֤ךְ הַ/מַּשְׁחִית֙ רַ֔ב עַתָּ֖ה הֶ֣רֶף יָדֶ֑/ךָ וּ/מַלְאַ֤ךְ יְהוָה֙ עֹמֵ֔ד עִם גֹּ֖רֶן אָרְנָ֥ן הַ/יְבוּסִֽי׀׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/015.yaml
  text: And God sent an angel to Jerusalem to destroy it[a], but as he was destroying it, Yahweh saw and relented concerning the calamity, and he said to the destroying angel, “Enough[b]; now withdraw your hand.” And the angel of Yahweh was standing by the threshing floor of Ornan the Jebusite.
translation:
  language: ta
  text: கடவுள் எருசலேமை அழிப்பதற்காக ஒரு தூதனை எருசலேமுக்கு அனுப்பினார். அவன் எருசலேமை அழித்துக்கொண்டிருந்தபோது, யாவே கண்டு, அந்தப் பேரழிவைக் குறித்து மனமிரங்கினார்.[a] அழித்துக்கொண்டிருந்த தூதனிடம் அவர், “போதும்! இப்போது உன் கையை நிறுத்து”[b] என்றார். யாவேயின் தூதன் எபூசியனான ஒர்னானின் போரடிக்கும் களத்தருகே நின்றுகொண்டிருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பேரழிவு” என்பதற்கான எபிரெயச் சொல் இங்கு ஒழுக்கத் தீமையை அல்ல, அழிவை விளைவிக்கும் பேரிடர் அல்லது நீதித்தீர்ப்பைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெய மரபுத்தொடர் நேரடியாக, “உன் கையைத் தளர்த்து” என்பதாகும்; அதாவது, அழிக்கும் செயலை நிறுத்து.
    reason: idiom_clarification
lexical_decisions:
- source_word: הָאֱלֹהִים
  choice: கடவுள்
  rationale: தனித்த ஒருமை வினைச் சூழலுடன் வரும் இச்சொல் இஸ்ரவேலின் கடவுளையே குறிக்கிறது; நவீனத் தமிழில் இயல்பான மொழிபெயர்ப்பு ‘கடவுள்’.
- source_word: מַלְאָךְ
  choice: தூதன்
  rationale: இங்கு கடவுளால் அனுப்பப்பட்ட வானுலகத் தூதனைக் குறிக்கிறது; ‘தூதன்’ என்பது ‘செய்தியாளர்’ என்ற பரந்த பொருளைவிடச் சூழலுக்குப் பொருத்தமானது.
- source_word: לִירוּשָׁלִַם לְהַשְׁחִיתָהּ
  choice: எருசலேமை அழிப்பதற்காக ... அங்கு
  rationale: לְ விகுதி நகரத்தை நோக்கிய இயக்கத்தையும், தொடர்ந்து வரும் வினையெச்சம் அழிக்கும் நோக்கத்தையும் காட்டுகிறது. தமிழில் நகரத்தின் பெயரை நேரடிச் செயப்படுபொருளாக்குவது இயல்பானது; ‘அங்கு’ இயக்கத்தை வெளிப்படுத்துகிறது.
- source_word: וּכְהַשְׁחִית
  choice: அவன் அதை அழித்துக்கொண்டிருந்தபோது
  rationale: செயல் நடைபெற்றுக்கொண்டிருக்கையில் அது இடைநிறுத்தப்பட்டதை எபிரெயக் கட்டமைப்பு குறிக்கிறது; தொடர்நிலைத் தமிழ் இதைப் பாதுகாக்கிறது.
- source_word: רָאָה יְהוָה
  choice: யாவே அதைக் கண்டு
  rationale: ראה என்பதன் நேரான பொருள் ‘கண்டார்’; יהוה தனிப்பட்ட இறைப் பெயராக ‘யாவே’ என்று ஒலிபெயர்க்கப்படுகிறது.
- source_word: וַיִּנָּחֶם עַל הָרָעָה
  choice: அந்தப் பேரழிவைக் குறித்து மனமிரங்கினார்
  rationale: נחם இச்சூழலில் தொடர்ந்து தண்டிப்பதிலிருந்து இரக்கத்துடன் விலகுவதைக் காட்டுகிறது. ‘மனமிரங்கினார்’ கடவுளின் கதைநிலைப் பதில்செயலைப் பாதுகாக்கிறது; அதை வெறும் உணர்ச்சி வருத்தமாகவோ தத்துவார்த்த ‘மனமாற்றமாகவோ’ குறுக்கவில்லை.
- source_word: הָרָעָה
  choice: பேரழிவு
  rationale: இங்கு רָעָה ஒழுக்கத் தீமையை அல்ல, அழிவை விளைவிக்கும் நீதித்தீர்ப்பைக் குறிக்கிறது. ‘பேரழிவு’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: הַמַּלְאָךְ הַמַּשְׁחִית
  choice: அழித்துக்கொண்டிருந்த தூதன்
  rationale: எபிரெயப் பெயரெச்சம் அப்போது நடைபெற்ற அழிக்கும் செயலை வலியுறுத்துகிறது; தமிழில் உறவெச்சத் தொடர் இயல்பாக உள்ளது.
- source_word: רַב
  choice: போதும்!
  rationale: இது ‘போதுமானது’ என்ற சுருக்கமான இடைச்சொல்; ‘போதும்!’ அதன் உடனடித் தடை உத்தரவை இயல்பாகத் தருகிறது.
- source_word: הֶרֶף יָדֶךָ
  choice: உன் கையை நிறுத்து
  rationale: செயல்பட்டுக்கொண்டிருக்கும் கையின் செயலை நிறுத்துமாறு கூறும் எபிரெய மரபுத்தொடரை நவீனத் தமிழில் தெளிவாகப் பிரதிபலிக்கிறது.
- source_word: מַלְאַךְ יְהוָה
  choice: யாவேயின் தூதன்
  rationale: இணைப்புத் தொடரை நேரடியாக மொழிபெயர்த்து, அந்தத் தூதனின் இயல்பையோ அடையாளத்தையோ உரை கூறுவதற்கு அப்பால் தீர்மானிக்கவில்லை.
- source_word: גֹּרֶן אָרְנָן הַיְבוּסִי
  choice: எபூசியனான ஒர்னானின் போரடிக்கும் களம்
  rationale: גֹּרֶן என்பது தானியத்திலிருந்து பதரைப் பிரிக்கும் இடம்; ‘போரடிக்கும் களம்’ வேளாண் சூழலைத் தெளிவாகக் காட்டுகிறது. இனப்பெயர் தமிழில் ‘எபூசியன்’ என வழங்கப்படுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல உரையில் தனிப்பட்ட உடன்படிக்கைப் பெயரே உள்ளது. அதை பொதுப்பட்டமாக மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: וַיִּנָּחֶם עַל הָרָעָה என்பதில் கடவுளின் பதில்செயல்
  choice: அந்தப் பேரழிவைக் குறித்து மனமிரங்கினார்
  alternative: பேரழிவைப் பற்றி மனதை மாற்றிக்கொண்டார்; தீமைக்காக வருந்தினார்
  rationale: கடவுள் கதைநிலையில் பதிலளித்து அழிவை நிறுத்துவதை உரை சித்தரிக்கிறது. ‘மனமிரங்கினார்’ அந்தத் தெய்வீகப் பதில்செயலை மறுக்காமலும், உரைக்கு அப்பாற்பட்ட தத்துவ முடிவைத் திணிக்காமலும் பதற்றத்தைப் பாதுகாக்கிறது.
- issue: מַלְאַךְ יְהוָה என்பவரின் அடையாளம்
  choice: யாவேயின் தூதன்
  alternative: தூதரூபில் வெளிப்பட்ட யாவே; படைக்கப்பட்ட வானதூதன்
  rationale: மூலத் தொடரைத் தெளிவாக மொழிபெயர்த்து, இவ்வுரையில் தீர்மானிக்கப்படாத அவரது இயல்பை எந்தக் கோட்பாட்டின் அடிப்படையிலும் முடிவுசெய்யவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. தெய்வப் பெயர் ‘யாவே’ என நிலைநிறுத்தப்பட்டுள்ளது. ‘மனமிரங்கினார்’ என்ற சொல் கதைநிலையின் தெய்வீகப் பதில்செயலை இயல்பாகக் காட்டினாலும், அதன் தத்துவ விளக்கத்தைத் தீர்மானிக்காமல் விடுகிறது. எல்லா அடிக்குறிப்பு அடையாளங்களும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
