  text: וַ/יִּשָּׂ֨א דָוִ֜יד אֶת עֵינָ֗י/ו וַ/יַּ֞רְא אֶת מַלְאַ֤ךְ יְהוָה֙ עֹמֵ֗ד בֵּ֤ין הָ/אָ֨רֶץ֙ וּ/בֵ֣ין הַ/שָּׁמַ֔יִם וְ/חַרְבּ֤/וֹ שְׁלוּפָה֙ בְּ/יָד֔/וֹ נְטוּיָ֖ה עַל יְרוּשָׁלִָ֑ם וַ/יִּפֹּ֨ל דָּוִ֧יד וְ/הַ/זְּקֵנִ֛ים מְכֻסִּ֥ים בַּ/שַּׂקִּ֖ים עַל פְּנֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/016.yaml
  text: David lifted up his eyes and saw the angel of Yahweh standing between the earth and the heavens[a], with his sword drawn in his hand, stretched out over Jerusalem. Then David and the elders, covered in sackcloth, fell on their faces.
translation:
  language: ta
  text: தாவீது தன் கண்களை ஏறெடுத்துப் பார்த்தபோது, யாவேயின் தூதர் பூமிக்கும் வானங்களுக்கும்[a] நடுவே நின்றுகொண்டிருப்பதைக் கண்டான். அவருடைய கையில் உறையிலிருந்து எடுக்கப்பட்ட வாள் எருசலேமின்மேல் நீட்டப்பட்டிருந்தது. அப்போது தாவீதும் மூப்பர்களும் சாக்குத்துணி உடுத்திக்கொண்டு முகங்குப்புற விழுந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பூமிக்கும் வானத்துக்கும் நடுவே.’ எபிரெய மூலத்தில் ‘பூமிக்கும் வானங்களுக்கும் நடுவே’ என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא ... עֵינָיו
  choice: தன் கண்களை ஏறெடுத்துப் பார்த்தபோது
  rationale: எபிரெய மொழியின் கண்களை உயர்த்துதல் என்ற காட்சிப் படிமத்தைத் தக்கவைத்தபடி, தமிழில் இயல்பான நிகழ்வுத் தொடராக வழங்குகிறது.
- source_word: מַלְאַךְ יְהוָה
  choice: யாவேயின் தூதர்
  rationale: מַלְאַךְ என்பதற்கு சூழலுக்கு ஏற்ற ‘தூதர்’ என்பதையும், יהוה என்ற தனிப்பெயருக்கு ‘யாவே’ என்ற ஒலிபெயர்ப்பையும் பயன்படுத்துகிறது.
- source_word: בֵּין הָאָרֶץ וּבֵין הַשָּׁמַיִם
  choice: பூமிக்கும் வானங்களுக்கும் நடுவே
  rationale: பூமி–வானங்கள் என்ற அண்டவியல் எதிரிணையைப் பாதுகாக்கிறது; שָׁמַיִם என்பதன் வடிவை ‘வானங்கள்’ என நெருக்கமாகப் பிரதிபலிக்கிறது.
- source_word: וְחַרְבּוֹ שְׁלוּפָה
  choice: அவருடைய கையில் உருவப்பட்ட வாள்
  rationale: வாள் உறையிலிருந்து வெளியே எடுக்கப்பட்டு ஆயத்த நிலையில் இருந்தது என்ற விளைவுநிலையை ‘உருவப்பட்ட’ தெளிவாகக் காட்டுகிறது.
- source_word: נְטוּיָה עַל יְרוּשָׁלִָם
  choice: எருசலேமுக்கு மேலாக நீட்டப்பட்டிருந்தது
  rationale: நகருக்கு மேலாக அச்சுறுத்தும் வகையில் வாள் நீட்டப்பட்டிருந்த காட்சியை நேரடியாகத் தருகிறது; வாள் நகரைத் தொட்டதாகக் கூறுவதில்லை.
- source_word: מְכֻסִּים בַּשַּׂקִּים
  choice: சாக்குத் துணி உடுத்தியவர்களாய்
  rationale: துக்கம் மற்றும் மனத்தாழ்மையின் பண்பாட்டுச் சின்னத்தை விளக்கிப் பரப்பாமல், வாசிக்க எளிதான நவீன தமிழில் தருகிறது.
- source_word: וַיִּפֹּל ... עַל פְּנֵיהֶם
  choice: முகங்குப்புற விழுந்தார்கள்
  rationale: உடல் செய்கையையும் பணிவு மற்றும் அச்சத்தின் உட்கருத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் வரும் உடன்படிக்கைத் தனிப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், பரவலாக ஏற்றுக்கொள்ளப்படும் ‘Yahweh’ உச்சரிப்பைத் தமிழில் ஒலிபெயர்க்கிறது.
- issue: வானம் அல்லது வானங்கள்
  choice: வானங்கள்
  alternative: வானம்
  rationale: எபிரெய שָׁמַיִם வடிவை நெருக்கமாகப் பாதுகாக்கிறது; இருப்பினும் இங்கு பல தனித்தனி வானங்களைப் பற்றிய கோட்பாட்டை அவசியமாகக் குறிக்காது என்பதால் வழக்கமான ஒருமை மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன செந்தமிழ் சார்ந்த, மரியாதையும் கதைநடைத் தெளிவும் கொண்ட பதிவு. ‘யாவே’, ‘சாக்குத் துணி’ போன்ற மூலப் பண்பாட்டு மற்றும் இறையியல் சொற்கள் தக்கவைக்கப்பட்டுள்ளன; மிகப் பழமையான வினைமுற்றுகளும் தேவையற்ற விளக்கவுரையும் தவிர்க்கப்பட்டுள்ளன.
