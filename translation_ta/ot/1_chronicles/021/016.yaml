  to: தாவீது தன் கண்களை ஏறெடுத்துப் பார்த்தபோது, யாவேயின் தூதர் பூமிக்கும் வானங்களுக்கும்[a] நடுவே நின்றுகொண்டிருப்பதைக் கண்டான். அவருடைய கையில் உறையிலிருந்து எடுக்கப்பட்ட வாள் எருசலேமின்மேல் நீட்டப்பட்டிருந்தது. அப்போது தாவீதும் மூப்பர்களும் சாக்குத்துணி உடுத்திக்கொண்டு முகங்குப்புற விழுந்தார்கள்.
  rationale: The revision corrects the key lexical error for the drawn sword by rendering it explicitly as “உறையிலிருந்து எடுக்கப்பட்ட வாள்.” It also makes the sackcloth clause smoother in modern standard Tamil. The Hebrew plural “heavens,” the divine name, the spatial image, and the footnote’s stated lexical alternative are retained.
