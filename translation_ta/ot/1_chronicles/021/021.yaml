source:
  edition: WLC
  text: וַ/יָּבֹ֥א דָוִ֖יד עַד אָרְנָ֑ן וַ/יַּבֵּ֤ט אָרְנָן֙ וַ/יַּ֣רְא אֶת דָּוִ֔יד וַ/יֵּצֵא֙ מִן הַ/גֹּ֔רֶן וַ/יִּשְׁתַּ֧חוּ לְ/דָוִ֛יד אַפַּ֖יִם אָֽרְצָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/021.yaml
  text: When David came to Ornan[a], Ornan looked and saw David, and he went out from the threshing floor and bowed down before David with his face to the ground.
translation:
  language: ta
  text: தாவீது ஒர்னானிடம் வந்தான். ஒர்னான் பார்த்துத் தாவீதைக் கண்டான்; களத்திலிருந்து வெளியே வந்து, தாவீதுக்கு முன்பாகத் தன் முகம் தரையில் படும்படி பணிந்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தாவீதுக்கு முன்பாக நெடுஞ்சாண்கிடையாக விழுந்தான்.” முகம் தரையில் படுமாறு முழுமையாகப் பணிந்ததை எபிரேயம் விவரிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא דָוִיד עַד אָרְנָן
  choice: தாவீது ஒர்னானிடம் வந்தான்
  rationale: בוא என்பது சூழலுக்கேற்ப ‘வருதல்/செல்லுதல்’ எனப் பொருள்படும்; עַד இங்கு ஒருவரை நோக்கிய அணுகுதலைக் குறிக்கிறது. நவீன தமிழில் ‘ஒர்னானிடம் வந்தான்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: וַיַּבֵּט אָרְנָן וַיַּרְא אֶת דָּוִיד
  choice: ஒர்னான் பார்த்துத் தாவீதைக் கண்டதும்
  rationale: נבט மற்றும் ראה ஆகிய இரு பார்வைச் செயல்களையும் ஒழிக்காமல் வைத்திருக்கிறது. அடுத்த செயல் அவன் தாவீதைக் கண்டதைத் தொடர்ந்து நிகழ்ந்தது என்பதை ‘கண்டதும்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיֵּצֵא מִן הַגֹּרֶן
  choice: களத்திலிருந்து வெளியே வந்து
  rationale: יצא மற்றும் מן ஆகியவை வெளிநோக்கிய இயக்கத்தையும் புறப்படும் இடத்தையும் தெளிவாகக் காட்டுகின்றன. גורן என்பதற்கான வழக்கமான வேதாகமத் தமிழ் சொல் ‘களம்’; இங்கு தானியம் போரடிக்கும் களத்தைக் குறிக்கிறது.
- source_word: וַיִּשְׁתַּחוּ לְדָוִיד
  choice: தாவீதுக்கு முன்பாகத் ... பணிந்து வணங்கினான்
  rationale: השתחוה உடலைத் தாழ்த்திப் பணிவதைச் சுட்டுகிறது. ‘பணிந்து வணங்கினான்’ உடல் செயலும் மரியாதையும் வெளிப்படுத்துகிறது; தாவீதைத் தெய்வமாக வழிபட்டான் என்ற பொருளைத் தேவையின்றி புகுத்துவதில்லை.
- source_word: אַפַּיִם אָרְצָה
  choice: தன் முகம் தரையில் படும்படி
  rationale: சொல்லுக்கு நெருக்கமாக ‘முகம்/மூக்குத் துவாரங்கள் நிலத்தை நோக்கி’ என்ற எபிரேய மரபுத்தொடர் முழுமையாகத் தரையில் விழுந்து பணிவதைக் குறிக்கிறது. தேர்ந்த தமிழ் வடிவம் அந்த உடல் நிலையைக் இயல்பாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: ஒர்னானின் செயல் தாவீதை வழிபட்டதாக மொழிபெயர்க்கப்பட வேண்டுமா
  choice: பணிந்து வணங்கினான்
  alternative: தாவீதை வழிபட்டான்; தாவீதுக்கு மரியாதை செலுத்தினான்
  rationale: השתחוה என்பது சூழலுக்கேற்ப மனித அதிகாரியின் முன் பணிவதையோ கடவுளை வழிபடுவதையோ குறிக்கலாம். இங்கு செயல் தாவீதின் முன் நிகழ்வதால், ‘வழிபட்டான்’ என்பது தெய்வீக வழிபாட்டைத் தேவையின்றி உணர்த்தும்; ‘மரியாதை செலுத்தினான்’ என்பது உரையில் தெளிவாகக் கூறப்பட்ட உடல் செயலை மறைத்துவிடும். ஆகவே உடல் பணிவை நேரடியாகக் காட்டும் வடிவம் தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் ஆனால் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரேயத்தின் ‘பார்த்தான்—கண்டான்’ என்ற இருபடி வரிசை பாதுகாக்கப்பட்டுள்ளது. ‘களம்’ என்பது இச்சூழலில் தானியம் போரடிக்கும் களத்தைக் குறிக்கிறது. அடிக்குறிப்புக் குறி அதற்குரிய பணிதல் சொற்றொடருக்குப் பின் வைக்கப்பட்டுள்ளது.
