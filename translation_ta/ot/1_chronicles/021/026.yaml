reference: 1 Chronicles 21:26
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יִּבֶן֩ שָׁ֨ם דָּוִ֤יד מִזְבֵּ֨חַ֙ לַ/יהוָ֔ה וַ/יַּ֥עַל עֹל֖וֹת וּ/שְׁלָמִ֑ים וַ/יִּקְרָא֙ אֶל יְהוָ֔ה וַ/יַּֽעֲנֵ֤/הוּ בָ/אֵשׁ֙ מִן הַ/שָּׁמַ֔יִם עַ֖ל מִזְבַּ֥ח הָ/עֹלָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/026.yaml
  text: There David built an altar to Yahweh and offered up burnt offerings and peace offerings. He called on Yahweh[a], and he answered him with fire from heaven on the altar of burnt offering.
translation:
  language: ta
  text: அங்கே தாவீது யாவேவுக்கு ஒரு பலிபீடத்தைக் கட்டி, தகனபலிகளையும் சமாதானப் பலிகளையும்[a] செலுத்தினான். அவன் யாவேயை நோக்கிக் கூப்பிட்டான்; அவர் வானத்திலிருந்து தகனபலிப் பீடத்தின்மேல் வந்த நெருப்பினால் அவனுக்குப் பதிலளித்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நல்லுறவுப் பலிகளையும்.”
    reason: שְׁלָמִים என்ற பலிவகை சமாதானம், நலம், பங்குண்ணும் நல்லுறவு ஆகிய கருத்துகளோடு தொடர்புடையதால் இந்த மாற்று மொழிபெயர்ப்பும் சாத்தியம்.
lexical_decisions:
- source_word: וַיִּבֶן שָׁם
  choice: அங்கே ... கட்டி
  rationale: שָׁם என்பது முன்பு குறிப்பிடப்பட்ட இடத்தைக் குறிக்கிறது; בנה என்பதன் நேரான பொருள் ‘கட்டு’ என்பதாகும்.
- source_word: מִזְבֵּחַ לַיהוָה
  choice: யாவேவுக்கு ஒரு பலிபீடம்
  rationale: מִזְבֵּחַ என்பதற்கான வழக்கமான தமிழ்ச் சொல் ‘பலிபீடம்’; לְ இங்கு அர்ப்பணிப்பு அல்லது தொடர்பைக் குறிக்கிறது.
- source_word: עֹלוֹת
  choice: தகனபலிகள்
  rationale: முழுவதுமாக எரித்துச் செலுத்தப்படும் பலிவகையைச் சுருக்கமாகவும் தெளிவாகவும் குறிக்கிறது.
- source_word: שְׁלָמִים
  choice: சமாதானப் பலிகள்
  rationale: எபிரெய பலிவகைப் பெயரின் ‘சமாதானம்/நலன்’ சார்ந்த சொல்லமைப்பைப் பாதுகாக்கும் பரவலாக அறியப்பட்ட மொழிபெயர்ப்பு; ‘நல்லுறவுப் பலிகள்’ என்ற பொருள்வழி மாற்றும் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וַיַּעַל
  choice: செலுத்தினான்
  rationale: பலிகளைச் செலுத்தும் சூழலில் இயல்பான நவீனத் தமிழ்; பலி மேலே கொண்டுசெல்லப்பட்டது என்ற எபிரெய வினையின் சொற்பிறப்பை இயற்கையற்ற வகையில் திணிக்கவில்லை.
- source_word: וַיִּקְרָא אֶל יְהוָה
  choice: யாவேயை நோக்கிக் கூப்பிட்டான்
  rationale: இது வெறும் அழைப்பு அல்ல, தேவனை நோக்கி விண்ணப்பிப்பதைக் குறிக்கும்; ‘நோக்கிக் கூப்பிட்டான்’ அந்தச் சூழலைத் தெளிவாகத் தருகிறது.
- source_word: וַיַּעֲנֵהוּ בָאֵשׁ מִן הַשָּׁמַיִם
  choice: அவர் வானத்திலிருந்து ... வந்த நெருப்பினால் அவனுக்குப் பதிலளித்தார்
  rationale: בְ கருவிப் பொருளையும் מִן தோற்ற இடத்தையும் பாதுகாக்கிறது; மூலத்தில் இல்லாத விரிவான விளக்கத்தைச் சேர்க்காமல், தமிழில் இயல்பாக நிகழ்வை வெளிப்படுத்துகிறது.
- source_word: עַל מִזְבַּח הָעֹלָה
  choice: தகனபலிப் பீடத்தின்மேல்
  rationale: நெருப்பு தோன்றிய இடத்தையும், தகனபலிக்குரிய பலிபீடம் என்ற வழிபாட்டுச் சொல்லையும் சுருக்கமாகக் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைபெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் வரும் உடன்படிக்கைப் பெயரைப் பட்டப்பெயராக மாற்றாமல், தமிழில் உச்சரிப்புமுறைக்கு ஏற்ற ஒலிபெயர்ப்பாக வழங்குகிறது.
- issue: நெருப்பினால் கிடைத்த இறைப் பதிலின் இயல்பு
  choice: வானத்திலிருந்து பலிபீடத்தின்மேல் வந்த நெருப்பினால் அவர் பதிலளித்தார்
  alternative: அவர் வானத்திலிருந்து நெருப்பை அனுப்பினார்
  rationale: தெய்வீகப் பதிலை வரலாற்று நிகழ்வாக உரை கூறும் விதத்தில் வைத்துக்கொண்டு, ‘அனுப்பினார்’ போன்ற மூலத்தில் வெளிப்படையாக இல்லாத செயல்விளக்கத்தைச் சேர்க்கவில்லை.
- issue: וַיַּעֲנֵהוּ என்பதன் மறைமுக எழுவாய்
  choice: அவர்
  alternative: யாவே
  rationale: முந்தைய உட்பிரிவில் யாவே தெளிவாகக் குறிப்பிடப்பட்டிருப்பதால் எபிரெய உரையின் பெயர்ச்சொல் மீளாமையைப் பாதுகாக்கும் சுட்டுப்பெயர் பயன்படுத்தப்பட்டது; தமிழில் மரியாதைப் பன்மை இறைவனைக் குறிக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகமக் கதைநடைக்கு ஏற்ற கண்ணியத்துடனும் அமைக்கப்பட்டது. ‘பலிபீடம்’, ‘தகனபலி’ போன்ற நிலைபெற்ற வழிபாட்டுச் சொற்கள் துல்லியத்திற்காகத் தக்கவைக்கப்பட்டன; இறைவனைக் குறிக்கும் வினைகள் மரியாதை வடிவில் உள்ளன.
