  text: וּ/מַלְאַ֧ךְ יְהוָ֛ה אָמַ֥ר אֶל גָּ֖ד לֵ/אמֹ֣ר לְ/דָוִ֑יד כִּ֣י יַעֲלֶ֣ה דָוִ֗יד לְ/הָקִ֤ים מִזְבֵּ֨חַ֙ לַ/יהוָ֔ה בְּ/גֹ֖רֶן אָרְנָ֥ן הַ/יְבֻסִֽי־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/018.yaml
  text: And the angel of Yahweh said to Gad to tell David that David should go up to set up an altar to Yahweh on the threshing floor of Ornan the Jebusite[a][b].
translation:
  language: ta
  text: 'யாவேயின் தூதர்[a] காதுக்குத் தாவீதிடம் இவ்வாறு சொல்லும்படி கூறினார்: “தாவீது, எபூசியனான ஓர்னானின் போரடிக்கும் களத்தில் யாவேக்கு ஒரு பலிபீடத்தை அமைப்பதற்காக ஏறிச் செல்ல வேண்டும்[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேயின் செய்தியாளர்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “தாவீது ஏறிச் செல்லட்டும்” அல்லது “தாவீது ஏறிச் செல்ல வேண்டும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַלְאַךְ יְהוָה
  choice: யாவேயின் தூதர்
  rationale: מַלְאַךְ என்பது ‘தூதர்’ அல்லது ‘செய்தியாளர்’ எனப் பொருள்படலாம்; இச்சூழலில் பரலோகத் தூதரைக் குறிப்பதால் ‘தூதர்’ இயல்பானது. יהוה என்பது உடன்படிக்கையின் தனிப்பெயராக ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டது.
- source_word: אָמַר אֶל־גָּד לֵאמֹר לְדָוִיד
  choice: காதிடம், தாவீதிடம் இவ்வாறு சொல்லும்படி கூறினார்
  rationale: אָמַר மற்றும் לֵאמֹר ஆகிய இரு பேச்சுக் கூறுகளையும் தமிழில் இயல்பாகவும் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: כִּי יַעֲלֶה דָוִיד
  choice: தாவீது ஏறிச் சென்று … வேண்டும்
  rationale: עלה என்பதன் ‘மேலே செல்/ஏறிச் செல்’ என்ற இயக்கத்தைப் பேணுகிறது; இங்கு கட்டளையின் வலிமையை ‘வேண்டும்’ தெரிவிக்கிறது.
- source_word: לְהָקִים מִזְבֵּחַ
  choice: ஒரு பலிபீடத்தை எழுப்ப
  rationale: הקים என்பதன் ‘எழுப்புதல், நிறுவுதல்’ என்ற பொருளையும் מִזְבֵּחַ என்பதற்கான வழக்கமான ‘பலிபீடம்’ என்ற சொல்லையும் பேணுகிறது.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: லாமேத் முன்னொட்டு அர்ப்பணிப்பு அல்லது தொடர்பைக் குறிப்பதால் ‘யாவேக்கு’ என்று நேரடியாக வழங்கப்பட்டது.
- source_word: בְּגֹרֶן
  choice: போரடிக்கும் களத்தில்
  rationale: גֹרֶן என்பது தானியத்திலிருந்து உமியைப் பிரிக்கப் போரடிக்கும் இடத்தைக் குறிக்கிறது; நவீன தமிழில் பொருள் தெளிவாக இருக்க இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: אָרְנָן הַיְבֻסִי
  choice: எபூசியனான ஓர்னான்
  rationale: தனிப்பெயர் ஒலிபெயர்க்கப்பட்டு, இனப்பெயர் இயல்பான தமிழ் வடிவில் தரப்பட்டது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல உரையில் உள்ள நான்கு எழுத்து உடன்படிக்கைப் பெயரை ஒரு பொதுப் பட்டப்பெயராக மாற்றாமல், தமிழில் அதன் பரவலான ஒலிபெயர்ப்பு வடிவில் வழங்குகிறது.
- issue: כִּי יַעֲלֶה என்பதன் கட்டளை வலிமை
  choice: ஏறிச் சென்று … வேண்டும்
  alternative: ஏறிச் செல்லட்டும்; ஏறிச் செல்ல வேண்டும் என்று
  rationale: இது தாவீதுக்குக் கொடுக்கப்படும் மறைமுகக் கட்டளையின் உள்ளடக்கம். ‘வேண்டும்’ அந்த வலிமையைத் தெளிவாக்குகிறது; சாத்தியமான வேறு வலிமைகள் அடிக்குறிப்பில் பேணப்பட்டுள்ளன.
translation_notes:
  register: நவீன நிலையான தமிழில், வாசிக்க எளிதான ஆனால் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘போரடிக்கும் களம்’ வேளாண் சூழலைத் தெளிவாகக் காட்டுகிறது; ‘ஏறிச் சென்று’ எபிரெய வினையின் திசை உணர்வைப் பேணுகிறது.
