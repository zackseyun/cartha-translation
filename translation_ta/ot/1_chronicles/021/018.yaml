revisions:
- from: 'யாவேயின் தூதர்[a] காதிடம், தாவீதிடம் இவ்வாறு சொல்லும்படி கூறினார்: “தாவீது ஏறிச் சென்று, எபூசியனான ஓர்னானின் போரடிக்கும் களத்தில் யாவேக்கு ஒரு பலிபீடத்தை எழுப்ப வேண்டும்[b].”'
  to: 'யாவேயின் தூதர்[a] காதுக்குத் தாவீதிடம் இவ்வாறு சொல்லும்படி கூறினார்: “தாவீது, எபூசியனான ஓர்னானின் போரடிக்கும் களத்தில் யாவேக்கு ஒரு பலிபீடத்தை அமைப்பதற்காக ஏறிச் செல்ல வேண்டும்[b].”'
  rationale: The revision retains all source elements and the modern formal register, while making Gad's dative role idiomatic and rendering the relation between “go up” and “establish an altar” more closely as a purpose infinitive. Footnote markers remain attached to the same source phrases.
