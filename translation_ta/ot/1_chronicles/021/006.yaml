base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/006.yaml
  text: But he did not count Levi and Benjamin among them[a], because the king’s command was detestable to Joab.
translation:
  language: ta
  text: ஆனால் லேவியையும் பென்யமீனையும் அவர்களோடு சேர்த்து யோவாப் கணக்கிடவில்லை; ஏனெனில் அரசனின் கட்டளை யோவாபுக்கு அருவருப்பாக இருந்தது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அரசனின் வார்த்தை யோவாபுக்கு வெறுப்புக்குரியதாக இருந்தது.”
    reason: דבר மற்றும் נתעב ஆகியவற்றின் சொற்பொருளுக்கு நெருக்கமான மாற்று வாசகத்தைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: וְ/לֵוִי֙ וּ/בִנְיָמִ֔ן
  choice: ஆனால் லேவியையும் பென்யமீனையும்
  rationale: முந்தைய கணக்கெடுப்போடு உள்ள முரண்பாட்டை முன்னிட்டு וְ என்பதை ‘ஆனால்’ எனவும், இரு கோத்திரப் பெயர்களையும் இயல்பான தமிழ்ப் பெயர்ப்பில் இணைத்தும் வழங்குகிறது.
- source_word: לֹ֥א פָקַ֖ד
  choice: கணக்கிடவில்லை
  rationale: மக்கள்தொகைக் கணக்கெடுப்பின் சூழலில் פקד என்பது எண்ணுதல் அல்லது கணக்கிடுதல் என்று பொருள்படுகிறது.
- source_word: בְּ/תוֹכָ֑/ם
  choice: அவர்களோடு சேர்த்து
  rationale: ‘அவர்கள் நடுவில்/அவர்களுள்’ என்ற அடிப்படைப் பொருளை, ஏற்கெனவே குறிப்பிடப்பட்ட கணக்கில் இவர்களைச் சேர்க்கவில்லை எனத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: כִּֽי
  choice: ஏனெனில்
  rationale: லேவி மற்றும் பென்யமீன் கணக்கிடப்படாததற்கான காரணத்தை அறிமுகப்படுத்தும் காரண இணைப்புச்சொல்.
- source_word: נִתְעַ֥ב
  choice: அருவருப்பாக இருந்தது
  rationale: Niphal வடிவத்தின் வலுவான எதிர்மறை மதிப்பீட்டை, நவீனத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் வெளிப்படுத்துகிறது.
- source_word: דְּבַר הַ/מֶּ֖לֶךְ
  choice: அரசனின் கட்டளை
  rationale: דבר என்பதற்கு ‘வார்த்தை’ என்ற நேரடிப் பொருள் இருந்தாலும், இச்சூழலில் அது கணக்கெடுப்பை நடத்துமாறு அரசன் இட்ட கட்டளையைக் குறிக்கிறது.
- source_word: אֶת יוֹאָֽב
  choice: யோவாபுக்கு
  rationale: உணர்வு அல்லது மதிப்பீட்டைக் குறிக்கும் வினையுடன் אֶת பாதிக்கப்படும் நபரைச் சுட்டுகிறது; இங்கு அந்தக் கட்டளை யோவாபுக்கு அருவருப்பாக இருந்தது என்பதே பொருள்.
