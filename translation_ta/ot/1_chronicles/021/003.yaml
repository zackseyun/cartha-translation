  rationale: முதல் வாக்கியத்தில் மட்டுமே திருத்தம் செய்யப்பட்டுள்ளது. இது யோவாபின் விருப்ப/வேண்டுதல் தொனியையும், தற்போதுள்ள மக்கள்தொகையை அடிப்படையாகக் கொண்ட நூறுமடங்குப் பெருக்கத்தையும் தெளிவாக வெளிப்படுத்துகிறது. மற்ற சொற்களும் குறிப்புகளும் மூலத்திற்கும் நவீன நிலையான தமிழ் நடைக்கும் ஏற்றவையாக இருப்பதால் தக்கவைக்கப்பட்டன.
