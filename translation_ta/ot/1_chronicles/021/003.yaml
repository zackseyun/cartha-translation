  text: וַ/יֹּ֣אמֶר יוֹאָ֗ב יוֹסֵף֩ יְהוָ֨ה עַל עַמּ֤/וֹ כָּ/הֵם֙ מֵאָ֣ה פְעָמִ֔ים הֲ/לֹא֙ אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ כֻּלָּ֥/ם לַ/אדֹנִ֖/י לַ/עֲבָדִ֑ים לָ֣/מָּה יְבַקֵּ֥שׁ זֹאת֙ אֲדֹנִ֔/י לָ֛/מָּה יִהְיֶ֥ה לְ/אַשְׁמָ֖ה לְ/יִשְׂרָאֵֽל־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/003.yaml
  text: But Joab said[a], “May Yahweh add to his people a hundred times as many as they are! Are they not all, my lord the king[c][b], servants of my lord? Why does my lord seek this? Why should it become guilt for Israel?”
translation:
  language: ta
  text: ஆனால் யோவாப், “யாவே தமது மக்களை இப்போது இருப்பதைவிட நூறு மடங்காகப் பெருகச் செய்வாராக![a] அரசராகிய என் ஆண்டவரே, அவர்கள் அனைவரும் என் ஆண்டவரின் பணியாளர்கள்தானே?[b] என் ஆண்டவர் இதை ஏன் நாடுகிறார்? இது இஸ்ரவேலுக்குக் குற்றப்பழியாக ஏன் ஆக வேண்டும்?[c]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவே தமது மக்களுக்கு, இப்போது இருப்பவர்களைப் போல நூறு மடங்கு மேலும் சேர்ப்பாராக!”
    reason: lexical_alternative
  - marker: b
    text: ‘பணியாளர்கள்’ என்பதற்கு ‘அடிமைகள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அதாவது, இந்தச் செயலால் இஸ்ரவேல்மேல் வரும் குற்றமும் அதற்கான பொறுப்பும்.
    reason: cultural_note
lexical_decisions:
- source_word: יוֹסֵף
  choice: பெருகச் செய்வாராக
  rationale: எபிரெய வினை வடிவம் யோவாபின் விருப்பம் அல்லது வேண்டுதலைத் தெரிவிக்கிறது; தமிழில் ‘செய்வாராக’ அந்த வாழ்த்துதல்/வேண்டுதல் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது இறைவனின் தனிப்பெயரான நான்கெழுத்துத் திருப்பெயர்; ஒரு பட்டப்பெயராக மாற்றாமல் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: עַל עַמּוֹ כָּהֵם מֵאָה פְעָמִים
  choice: தமது மக்களை இப்போது இருப்பதைப்போல் நூறு மடங்கு
  rationale: தற்போதைய மக்கள் தொகையை ஒப்பீட்டளவாகக் கொண்டு நூறு மடங்கு பெருக்கப்படுதல் என்னும் எபிரெய மரபுத்தொடரின் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: הֲלֹא
  choice: தானே?
  rationale: ஒப்புதலை எதிர்பார்க்கும் எதிர்மறை வினாவை நவீன தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: அரசராகிய என் ஆண்டவரே
  rationale: அரசவையில் அரசனை மரியாதையுடன் அழைக்கும் முறையைக் கண்ணியமான தமிழில் தக்கவைக்கிறது.
- source_word: כֻּלָּם לַאדֹנִי לַעֲבָדִים
  choice: அவர்கள் அனைவரும் என் ஆண்டவரின் பணியாளர்கள்
  rationale: இங்கு עֲבָדִים என்பது அரசனுக்குக் கீழ்ப்பட்ட அரசியல் பணிநிலையை முன்னிறுத்துவதால் ‘பணியாளர்கள்’ பொருத்தமானது; ‘அடிமைகள்’ என்பதும் சொல்லளவில் சாத்தியம்.
- source_word: יְבַקֵּשׁ זֹאת
  choice: இதை ஏன் நாடுகிறார்
  rationale: בקש என்பதன் ‘தேடு/நாடு’ என்னும் விரிவான பொருளைத் தக்கவைத்து, மக்கள் தொகைக் கணக்கெடுப்பை மேற்கொள்ளும் நோக்கத்தைச் சூழலிலிருந்து வாசகர் புரிந்துகொள்ள இடமளிக்கிறது.
- source_word: לְאַשְׁמָה
  choice: குற்றப்பழி
  rationale: இச்சூழலில் பலிக்குரிய ‘குற்றநிவாரண காணிக்கை’ அல்ல, குற்றமும் அதனால் வரும் பொறுப்பும் குறிக்கப்படுகின்றன; ‘குற்றப்பழி’ இரண்டையும் சுருக்கமாக உணர்த்துகிறது.
theological_decisions:
- issue: יְהוָה என்னும் இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரை இறைவனின் தனிப்பெயரை நேரடியாகப் பயன்படுத்துவதால், அதை ஒரு பொதுப் பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் தன்மையைப் பாதுகாக்கிறது.
- issue: עֲבָדִים என்பதன் அரசியல்-சமூக பொருள்
  choice: பணியாளர்கள்
  alternative: அடிமைகள்
  rationale: இங்கு யோவாப் இஸ்ரவேல் மக்கள் அனைவரும் ஏற்கெனவே அரசனின் ஆளுகைக்கும் பணிக்கும் உட்பட்டவர்கள் என வாதிடுகிறார்; தனிப்பட்ட அடிமை உடைமை நிலையை உரை முன்னிறுத்தவில்லை.
- issue: לְאַשְׁמָה என்பதில் குற்றமும் விளைவுப் பொறுப்பும்
  choice: குற்றப்பழி
  alternative: குற்றத்திற்குக் காரணம்
  rationale: இந்தச் செயல் இஸ்ரவேல்மேல் குற்றத்தையும் அதற்குரிய பொறுப்பையும் கொண்டுவரும் என்ற பதற்றத்தைச் சுருக்கமாகத் தக்கவைக்கிறது; வெறும் மனநிலை சார்ந்த குற்றவுணர்வாகக் குறுக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், அரசவைக்குரிய மரியாதையும் யோவாபின் எச்சரிக்கைத் தொனியும் காக்கப்பட்டுள்ளன. ‘என் ஆண்டவர்’ என்ற தொடர்ச்சி மூலத்தின் மரியாதைமிக்க மீளுரைப்பைத் தக்கவைக்கிறது; வாக்கிய அமைப்பு சாதாரண வாசகருக்கும் தெளிவாக இருக்கும்படி இயல்பாக்கப்பட்டுள்ளது.
