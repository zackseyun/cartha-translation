  text: וַ/יֵּ֨רַע֙ בְּ/עֵינֵ֣י הָ/אֱלֹהִ֔ים עַל הַ/דָּבָ֖ר הַ/זֶּ֑ה וַ/יַּ֖ךְ אֶת יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/007.yaml
  text: But this matter was evil in the sight of God[a], so he struck Israel.
translation:
  language: ta
  text: ஆனால் இந்தக் காரியம் கடவுளின் பார்வையில் தீயதாக இருந்தது[a]; ஆகவே அவர் இஸ்ரவேலைத் தாக்கினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுளுக்கு விருப்பமற்றதாக இருந்தது.” எபிரெய மொழியில் சொல்லுக்கு சொல், “கடவுளின் கண்களில் தீயதாக இருந்தது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרַע
  choice: தீயதாக இருந்தது
  rationale: רעע என்ற வினை இங்கு இச்செயல் ஒழுக்கரீதியாகத் தீயது அல்லது கடவுளுக்கு ஏற்புடையதல்ல என்பதைக் குறிக்கிறது. ‘தீயதாக இருந்தது’ என்பது அதன் வலுவான மதிப்பீட்டை மென்மைப்படுத்தாமல் இயல்பான தமிழில் தருகிறது.
- source_word: בְּעֵינֵי הָאֱלֹהִים
  choice: கடவுளின் பார்வையில்
  rationale: ‘கடவுளின் கண்களில்’ என்ற எபிரெய மரபுத்தொடரின் மதிப்பீட்டுக் கண்ணோட்டத்தை, நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: הָאֱלֹהִים
  choice: கடவுள்
  rationale: மூலத்தில் יהוה என்ற இறைப்பெயர் அல்ல, הָאֱלֹהִים என்பதே உள்ளது; எனவே ‘கடவுள்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: עַל הַדָּבָר הַזֶּה
  choice: இந்தக் காரியம்
  rationale: דבר என்பது ‘விஷயம், காரியம், நிகழ்வு’ போன்ற பரந்த பொருளுடைய சொல். இங்கு தாவீதின் கணக்கெடுப்பு நடவடிக்கையைக் குறிக்க, கூடுதல் விளக்கம் புகுத்தாமல் ‘இந்தக் காரியம்’ என்பது பொருத்தமாக உள்ளது.
- source_word: וַיַּךְ
  choice: தாக்கினார்
  rationale: נכה என்பதன் அடிப்படைப் பொருள் ‘அடி, தாக்கு.’ இவ்வசனம் தனியாகக் கூறுவதைவிட அதிகமாக மரணத்தைக் குறிப்பாக்காமல், நவீன தமிழில் நேரடியாக ‘தாக்கினார்’ என வழங்கப்பட்டுள்ளது.
- source_word: אֶת יִשְׂרָאֵל
  choice: இஸ்ரவேலை
  rationale: நேரடிச் செயப்படுபொருள் இஸ்ரவேல் தேசம். ‘இஸ்ரவேல் மக்களை’ என்று விரிவாக்க வேண்டிய அவசியமின்றி, ‘இஸ்ரவேலை’ என்பது தெளிவாக உள்ளது.
- source_word: וַ … וַ
  choice: ஆனால் … ஆகவே
  rationale: முதல் வாவ் முந்தைய நிகழ்வுடன் உள்ள மிதமான முரண்பாட்டையும், இரண்டாவது வாவ் தெய்வீக மதிப்பீட்டின் விளைவாக வந்த செயலையும் இயல்பான தமிழில் காட்டுகின்றன.
theological_decisions:
- issue: தாவீதின் கணக்கெடுப்பைப் பற்றிய கடவுளின் மதிப்பீடும் அதைத் தொடர்ந்து வந்த தீர்ப்பும்
  choice: இக்காரியம் கடவுளின் பார்வையில் தீயதாக இருந்ததால் அவர் இஸ்ரவேலைத் தாக்கினார் என்று வசனம் நேரடியாகக் கூறுகிறது.
  alternative: இக்காரியம் ஒழுக்கத் தீமையின்றி வெறுமனே கடவுளுக்குப் பிடிக்காததாக இருந்தது என்றும், தாக்குதல் நீதித்தீர்ப்பல்லாத மென்மையான நடவடிக்கை என்றும் வாசித்தல்.
  rationale: ‘தீயதாக இருந்தது’ என்ற வலுவான மதிப்பீட்டையும் ‘தாக்கினார்’ என்ற நேரடியான விளைவுச் செயலையும் எபிரெய உரை கொண்டுள்ளது. தாவீதின் செயல் கடவுளால் தீர்ப்பிடப்படுகிறது; அதேவேளையில் இஸ்ரவேல் தாக்கப்படுகிறது என்ற இறையியல் பதற்றத்தை மொழிபெயர்ப்பு அப்படியே வைத்திருக்கிறது; அதை இவ்வசனத்திற்கு அப்பாற்பட்ட விளக்கங்களால் தீர்க்க முயலவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘கடவுளின் பார்வையில்’ என்பது எபிரெய மரபுத்தொடரின் பொருளைத் தக்கவைத்தபடி தமிழில் இயல்பாக ஒலிக்கிறது; ‘தாக்கினார்’ என்பது பழமையான ‘அடித்தார்’ அல்லது அளவுக்கு மீறிய ‘அழித்தார்’ என்பவற்றைத் தவிர்க்கிறது.
