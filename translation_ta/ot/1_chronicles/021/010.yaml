base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/010.yaml
  text: 'Go and speak to David[a], saying, ‘Thus says Yahweh: I am setting three things before you. Choose one of them for yourself, and I will do it to you.’'
translation:
  language: ta
  text: '“நீ போய் தாவீதிடம் பேசி, ‘யாவே கூறுவது இதுவே: நான் மூன்றை உனக்கு முன்வைக்கிறேன்[a]. அவற்றில் ஒன்றை உனக்காகத் தேர்ந்தெடு; அதை நான் உனக்குச் செய்வேன்’ என்று சொல்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “மூன்றை நான் உன்மேல் நீட்டுகிறேன்.” எபிரெயத்தில் ‘மூன்று’ என்பதற்குரிய பொருள் குறிப்பிடப்படவில்லை; யாவே தாவீது தேர்ந்தெடுக்கும்படி மூன்றை முன்வைக்கிறார் என்பதே சூழலின் பொருள்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵךְ וְדִבַּרְתָּ אֶל דָּוִיד לֵאמֹר
  choice: நீ போய் தாவீதிடம் பேசி, … என்று சொல்
  rationale: எபிரெய கட்டளைத் தொடரையும் நேரடி உரையை அறிமுகப்படுத்தும் לֵאמֹר என்பதையும் இயல்பான நவீனத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: כֹּה אָמַר יְהוָה
  choice: யாவே கூறுவது இதுவே
  rationale: தீர்க்கதரிசனத் தூதர் சூத்திரத்தின் வலிமையை இயல்பான தமிழில் காக்கிறது; יהוה என்ற தனிப்பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்படுகிறது.
- source_word: שָׁלוֹשׁ אֲנִי נֹטֶה עָלֶיךָ
  choice: நான் மூன்றை உனக்கு முன்வைக்கிறேன்
  rationale: எபிரெயத்தில் ‘மூன்று’ என்பதற்குரிய பெயர்ச்சொல் குறிப்பிடப்படவில்லை; எனவே ‘காரியங்கள்’, ‘தண்டனைகள்’ போன்றவற்றைச் சேர்க்காமல் அந்தத் தெளிவின்மை காக்கப்படுகிறது. தேர்வு செய்ய வேண்டிய மூன்றை எதிரில் வைக்கும் சூழல்சார்ந்த பொருளை ‘முன்வைக்கிறேன்’ இயல்பாகத் தருகிறது.
- source_word: בְּחַר לְךָ אַחַת מֵהֵנָּה
  choice: அவற்றில் ஒன்றை உனக்காகத் தேர்ந்தெடு
  rationale: בחר என்ற நேரடிக் கட்டளையையும் לְךָ தரும் தனிப்பட்ட தொடர்பையும், பகுதியைக் குறிக்கும் מֵהֵנָּה என்பதையும் காக்கிறது.
- source_word: וְאֶעֱשֶׂה לָּךְ
  choice: அதை நான் உனக்குச் செய்வேன்
  rationale: לְךָ இங்கு நன்மையா தீமையா என்பதை இலக்கணத்தால் மட்டும் தீர்மானிக்காமல், எபிரெயத்தின் சுருக்கத்தையும் பதற்றத்தையும் காக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் வரும் உடன்படிக்கைத் தனிப்பெயரைப் பொதுப்பட்டமாக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- issue: ‘மூன்று’ என்பதன் விடுபட்ட பொருள்
  choice: பெயர்ச்சொல் சேர்க்காமல் ‘மூன்றை’ என வைத்தல்
  alternative: மூன்று தண்டனைகள் / மூன்று காரியங்கள் / மூன்று வாய்ப்புகள்
  rationale: மூல எபிரெயம் பொருளைக் குறிப்பிடவில்லை. அடுத்த வசனம் அவற்றை விளக்கும்வரை அதன் உண்மையான தெளிவின்மையைப் பாதுகாக்கிறது.
- issue: וְאֶעֱשֶׂה לָּךְ என்பதிலுள்ள לְךָ
  choice: உனக்குச் செய்வேன்
  alternative: உன்மேல் வரச்செய்வேன்
  rationale: சூழல் தண்டனையைச் சுட்டினாலும், ‘உன்மேல் வரச்செய்வேன்’ என்பது மூலத்தைவிட விளக்கமானது; நேரடியான தமிழ் வடிவம் இறையியல் பதற்றத்தைத் திறந்தவாறே வைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான தூதர் உரைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் விடுபட்டுள்ள பெயர்ச்சொல் தமிழிலும் நிரப்பப்படவில்லை; சொல்லுக்குச் சொல் அமைப்பு அடிக்குறிப்பில் பதிவு செய்யப்பட்டுள்ளது.
