  to: யோவாப் மக்கள் கணக்கெடுப்பின் மொத்த எண்ணிக்கையைத் தாவீதிடம் கொடுத்தான். இஸ்ரவேலில் வாளை உருவுகிற ஆண்கள் மொத்தம் 11,00,000 பேர்[a] இருந்தனர்; யூதாவில் வாளை உருவுகிற ஆண்கள் 4,70,000 பேர் இருந்தனர்.
