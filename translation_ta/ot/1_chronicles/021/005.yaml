translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘வாள் உருவுகிற’ என்ற மூலப்படிமம் தக்கவைக்கப்பட்டு, எண்ணிக்கைகள் இந்திய இலக்கக் குழுவாக்கத்தில் வழங்கப்பட்டுள்ளன.
