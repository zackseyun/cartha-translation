  text: וַ/יִּתֵּ֥ן יוֹאָ֛ב אֶת מִסְפַּ֥ר מִפְקַד הָ/עָ֖ם אֶל דָּוִ֑יד וַ/יְהִ֣י כָֽל יִשְׂרָאֵ֡ל אֶ֣לֶף אֲלָפִים֩ וּ/מֵאָ֨ה אֶ֤לֶף אִישׁ֙ שֹׁ֣לֵֽף חֶ֔רֶב וִֽ/יהוּדָ֕ה אַרְבַּע֩ מֵא֨וֹת וְ/שִׁבְעִ֥ים אֶ֛לֶף אִ֖ישׁ שֹׁ֥לֵֽף חָֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/005.yaml
  text: Joab gave the number of the census of the people to David. All Israel was 1,100,000 men drawing the sword[a], and Judah was 470,000 men drawing the sword.
translation:
  language: ta
  text: யோவாப் மக்கள் கணக்கெடுப்பின் மொத்த எண்ணிக்கையைத் தாவீதிடம் கொடுத்தான். இஸ்ரவேலில் வாளை உருவுகிற ஆண்கள் மொத்தம் 11,00,000 பேர்[a] இருந்தனர்; யூதாவில் வாளை உருவுகிற ஆண்கள் 4,70,000 பேர் இருந்தனர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்சொல்லாக, “ஆயிரம் ஆயிரங்களும் நூறு ஆயிரமும்.”
    reason: மூல எபிரெய மொழியின் எண்ணிக்கை அமைப்பைத் தெரிவிக்கும் சொற்சொல் மாற்று.
lexical_decisions:
- source_word: מִסְפַּר מִפְקַד הָעָם
  choice: மக்களைக் கணக்கெடுத்த மொத்த எண்ணிக்கை
  rationale: מִסְפַּר என்பதன் ‘மொத்த எண்ணிக்கை’ என்ற பொருளையும், מִפְקַד என்பதன் ‘கணக்கெடுப்பு’ என்ற பொருளையும் இயல்பான நவீன தமிழில் தக்கவைக்கிறது.
- source_word: וַיְהִי כָל יִשְׂרָאֵל
  choice: இஸ்ரவேல் முழுவதிலும் … பேர்
  rationale: எபிரெயச் சொற்றொடர் கணக்கெடுப்பின் முடிவான மொத்தத் தொகையை அறிமுகப்படுத்துகிறது; தமிழில் இயல்பாக எண்ணிக்கையுடன் அமைக்கப்பட்டுள்ளது.
- source_word: אֶלֶף אֲלָפִים וּמֵאָה אֶלֶף
  choice: 11,00,000
  rationale: பெரிய எண்ணை நவீன தமிழ் வாசகர்கள் எளிதில் புரிந்துகொள்ளும் இந்திய இலக்கக் குழுவாக்கத்தில் தருகிறது; மூலத்தின் சொற்சொல் வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: אִישׁ
  choice: ஆண்கள்
  rationale: இது போருக்குரிய கணக்கெடுப்புச் சூழலில் ஆண் நபர்களைக் குறிக்கும் கூட்டுப்பயன்பாடு.
- source_word: שֹׁלֵף חֶרֶב
  choice: வாள் உருவுகிற
  rationale: שֹׁלֵף என்பதன் ‘உருவுதல்/உறையிலிருந்து இழுத்தெடுத்தல்’ என்ற உயிரோட்டமான படிமத்தை, பொதுவான ‘ஆயுதம் தாங்குகிற’ என்று மென்மையாக்காமல் காக்கிறது.
- source_word: אַרְבַּע מֵאוֹת וְשִׁבְעִים אֶלֶף
  choice: 4,70,000
  rationale: எண்ணைத் தெளிவாகவும் நவீன தமிழ் நடைமுறைக்கு ஏற்றவாறும் இலக்கங்களில் தருகிறது.
