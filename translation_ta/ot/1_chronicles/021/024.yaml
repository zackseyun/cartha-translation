review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys David’s emphatic refusal, his resolve to buy the property, the ownership clause, dedication to Yahweh, and the refusal to offer a burnt offering without cost. However, it omits the explicit payment medium in בְּכֶסֶף מָלֵא (‘with/full silver’), rendering only ‘at the full price.’ The revised wording restores this detail without over-specifying coins.
  naturalness: The Tamil is clear, modern, and appropriately formal for biblical narrative. ‘தகனபலியைச் செலுத்த’ is understandable and maintains the sacrificial register. The proposed addition ‘வெள்ளியாகக் கொடுத்து’ is natural in context.
  terminology: ‘யாவே’ appropriately represents יהוה as a personal divine name. ‘தகனபலி’ suitably renders עֹלָה. ‘உனக்குச் சொந்தமானதை’ accurately represents what belongs to Ornan. ‘ஒர்னான்’ is retained, consistent with the supplied English audit trail and established transliteration.
  issues:
