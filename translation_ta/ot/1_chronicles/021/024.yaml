id: 1CH.21.24
reference: 1 Chronicles 21:24
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר הַ/מֶּ֤לֶךְ דָּוִיד֙ לְ/אָרְנָ֔ן לֹ֕א כִּֽי קָנֹ֥ה אֶקְנֶ֖ה בְּ/כֶ֣סֶף מָלֵ֑א כִּ֠י לֹא אֶשָּׂ֤א אֲשֶׁר לְ/ךָ֙ לַ/יהוָ֔ה וְ/הַעֲל֥וֹת עוֹלָ֖ה חִנָּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/024.yaml
  text: But King David said to Ornan[a], “No, for I will surely buy it for the full price in silver, because I will not take for Yahweh what is yours[b], nor offer up a burnt offering for nothing.”
translation:
  language: ta
  text: ஆனால் அரசன் தாவீது ஒர்னானிடம், “இல்லை; அதற்கான முழு விலையையும் வெள்ளியாகக் கொடுத்து அதை நிச்சயமாக வாங்குவேன். ஏனெனில், உனக்குச் சொந்தமானதை யாவேக்காக நான் எடுத்துக்கொள்ளவும் மாட்டேன்; செலவில்லாமல் தகனபலியைச் செலுத்தவும் மாட்டேன்” என்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא כִּי
  choice: இல்லை; ... ஏனெனில்
  rationale: தாவீதின் உறுதியான மறுப்பையும் அதைத் தொடர்ந்து வரும் காரணத்தையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: קָנֹה אֶקְנֶה
  choice: நிச்சயமாக வாங்குவேன்
  rationale: வினைமுற்றுடன் வரும் infinitive absolute வலியுறுத்தலைக் குறிக்கிறது; அதை ‘நிச்சயமாக’ என்பதன் மூலம் தக்கவைக்கிறது.
- source_word: בְּכֶסֶף מָלֵא
  choice: முழு விலையையும் கொடுத்து
  rationale: முழுத் தொகையையும் செலுத்தி வாங்குவதைத் தெளிவாகவும் இயல்பாகவும் கூறுகிறது; இங்கு כֶּסֶף பணம் அல்லது வெள்ளிப் பணத்தைக் குறிக்கலாம்.
- source_word: אֶשָּׂא אֲשֶׁר לְךָ
  choice: உனக்குச் சொந்தமானதை ... நான் எடுத்துக்கொள்ளவும் மாட்டேன்
  rationale: பிறருக்குச் சொந்தமானதைத் தனக்கென அல்லது ஒரு நோக்கத்திற்கென பெற்றுக்கொள்வது என்ற சூழல்சார் பொருளை நேரடியாகப் பாதுகாக்கிறது.
- source_word: לַיהוָה
  choice: யாவேக்காக
  rationale: பலிக்கென ஒன்றை எடுத்துக்கொள்ளும் நோக்கத்தை ‘-க்காக’ இயல்பாகக் காட்டுகிறது; יהוה என்ற தனிப்பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְהַעֲלוֹת עוֹלָה
  choice: தகனபலியைச் செலுத்தவும் மாட்டேன்
  rationale: עֹלָה என்பது முழுவதும் எரித்துச் செலுத்தப்படும் பலிக்கான வழக்கமான வேதாகமச் சொல்; எதிர்மறை வாக்கியத் தொடர்ச்சியை ‘-வும் மாட்டேன்’ வெளிப்படுத்துகிறது.
- source_word: חִנָּם
  choice: செலவில்லாமல்
  rationale: விலை கொடுக்காமல் அல்லது தனக்குச் செலவு ஏதுமின்றி என்பதே இச்சூழலின் கருத்து; ‘செலவில்லாமல்’ அதைத் தெளிவாகத் தருகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பொதுப் பட்டப்பெயர் அல்ல, நான்கு எழுத்துகளைக் கொண்ட தனிப்பெயர் நேரடியாக உள்ளது; எனவே அதைத் தமிழில் ஒலிபெயர்ப்பது மூல வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: தாவீதின் கூற்றை வழிபாட்டுக்கான பொதுக் கோட்பாடாக விரிவாக்குதல்
  choice: வசனத்தின் குறிப்பிட்ட கொள்முதல் மற்றும் பலிச் சூழலை மட்டும் மொழிபெயர்த்தல்
  alternative: ‘எனக்குச் செலவில்லாத பலியைச் செலுத்தமாட்டேன்’ என்று பொதுமைப்படுத்துதல்
  rationale: חִנָּם இங்கு ஒர்னானின் சொத்தை விலையின்றிப் பெற்று பலியிடுவதைக் குறிக்கிறது; உரையில் இல்லாத பரந்த இறையியல் கோட்பாட்டை மொழிபெயர்ப்பில் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பான வாக்கிய அமைப்பு பயன்படுத்தப்பட்டுள்ளது. ‘தகனபலி’ மட்டும் பலியியல் துல்லியத்தைப் பாதுகாக்கும் நிலைபெற்ற வேதாகமச் சொலாக வைக்கப்பட்டுள்ளது. மூலத்தில் உள்ள மறுப்பு, வலியுறுத்தல், காரணத் தொடர்பு ஆகியவை தெளிவாகத் தக்கவைக்கப்பட்டுள்ளன.
