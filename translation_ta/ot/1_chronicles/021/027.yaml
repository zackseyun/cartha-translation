id: 1CH.21.27
reference: 1 Chronicles 21:27
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ לַ/מַּלְאָ֔ךְ וַ/יָּ֥שֶׁב חַרְבּ֖/וֹ אֶל נְדָנָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/027.yaml
  text: And Yahweh spoke to the angel[b][a], and he returned his sword to its sheath.
translation:
  language: ta
  text: யாவே தேவதூதனிடம் சொன்னார்[a]; அவன் தன் வாளை அதன் உறையில் மீண்டும் வைத்தான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தேவதூதனிடம் பேசினார்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘தன் வாளை அதன் உறைக்குத் திருப்பினார்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைநாமமான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் இயல்பாக ஒலிபெயர்த்து வழங்குகிறது.
- source_word: וַיֹּאמֶר
  choice: சொன்னார்
  rationale: אמר என்பதன் அடிப்படைப் பொருளான ‘சொல்’ என்பதை நேரடியாகப் பாதுகாக்கிறது; உரையின் சூழல் கட்டளையை உணர்த்தினாலும், வினைச்சொல் தானாகவே ‘கட்டளையிட்டார்’ என்று குறிப்பிடவில்லை.
- source_word: לַמַּלְאָךְ
  choice: தூதனிடம்
  rationale: מלאך என்பது ‘தூதன்’ அல்லது ‘தேவதூதன்’ எனப் பொருள்படலாம். வாள் ஏந்திய வானுலகத் தூதனைச் சூழல் தெளிவுபடுத்துவதால், சுருக்கமான ‘தூதன்’ இயல்பாக உள்ளது.
- source_word: וַיָּשֶׁב
  choice: திரும்ப வைத்தான்
  rationale: שוב என்பதன் ஹிஃபில் வடிவிலுள்ள ‘திரும்பச் செய்தல்/மீண்டும் வைத்தல்’ என்ற காரணவினைப் பொருளைப் பாதுகாக்கிறது.
- source_word: חַרְבּוֹ
  choice: தன் வாளை
  rationale: உடனடி சூழலில் செய்பவனாகிய தூதனையே உடைமைச் சுட்டு குறிக்கிறது; தமிழில் ‘தன்’ என்பது இதை இயல்பாகத் தெரிவிக்கிறது.
- source_word: אֶל נְדָנָהּ
  choice: அதன் உறைக்குள்
  rationale: נְדָן என்பது வாளின் உறையைக் குறிக்கிறது. אֶל இங்கு வாள் உறைக்குள் வைக்கப்படுவதைச் சூழலின்படி காட்டுகிறது.
theological_decisions:
- issue: וַיָּשֶׁב (‘திரும்ப வைத்தான்’) என்பதன் எழுவாய்
  choice: முந்திய சொற்றொடரில் குறிப்பிடப்பட்ட தூதனே வாளை உறைக்குள் திரும்ப வைக்கிறான்.
  alternative: யாவே வாளைத் திரும்ப வைத்தார் என்று இலக்கண எழுவாயை யாவேயாகப் புரிந்துகொள்ளுதல்.
  rationale: யாவே தூதனிடம் சொன்னதைத் தொடர்ந்து, தூதன் தன் வாளை உறைக்குள் வைப்பதே கதைச்சூழலில் இயல்பான வாசிப்பு. இருப்பினும் எபிரெயத்தில் எழுவாய் மீண்டும் வெளிப்படையாகக் குறிப்பிடப்படாததால், மொழிபெயர்ப்பு சூழலின் தொடர்ச்சியைப் பின்பற்றுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிமையும் கண்ணியமும் கொண்ட நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘சொன்னார்’ என்பது மூலவினையின் பொதுப் பொருளைப் பாதுகாக்கிறது; ‘திரும்ப வைத்தான்’ காரணவினை நுணுக்கத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது. யாவேக்கு மரியாதைப் பன்மை வினைமுற்றும், தூதனுக்கு ஒருமை வினைமுற்றும் பயன்படுத்தப்பட்டுள்ளன.
