revisions:
- from: அப்போது தாவீது ஒர்னானிடம், “நான் யெகோவாவுக்கு ஒரு பலிபீடத்தைக் கட்டும்படி, இந்தப் போரடிக்கும் களத்தின் இடத்தை எனக்குக் கொடு. மக்கள்மேல் வந்த கொள்ளைநோய் நிறுத்தப்படும்படி, அதை முழு விலைக்கு எனக்குக் கொடு” என்றார்.
  to: அப்போது தாவீது ஒர்னானிடம், “நான் யெகோவாவுக்கு ஒரு பலிபீடத்தைக் கட்டுவதற்காக, இந்தக் கதிரடிக்கும் களத்தின் இடத்தை எனக்குக் கொடு. மக்கள்மேலிருந்து கொள்ளைநோய் விலகும்படி, முழு விலைக்கு அதை எனக்குக் கொடு” என்றார்.
  rationale: 'The revision retains the draft’s direct, respectful register and its rendering of the divine name. It replaces the less idiomatic term for the threshing floor and renders the plague as departing from the people, corresponding to the Hebrew preposition מֵעַל. The purpose relationship remains noncommittal: David requests the site so that he may build an altar, and so that the plague may be removed.'
  reviewer_model: gpt-5.6-terra
