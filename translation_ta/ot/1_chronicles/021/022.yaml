source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר דָּוִ֜יד אֶל אָרְנָ֗ן תְּנָ/ה לִּ/י֙ מְק֣וֹם הַ/גֹּ֔רֶן וְ/אֶבְנֶה בּ֥/וֹ מִזְבֵּ֖חַ לַ/יהוָ֑ה בְּ/כֶ֤סֶף מָלֵא֙ תְּנֵ֣/הוּ לִ֔/י וְ/תֵעָצַ֥ר הַ/מַּגֵּפָ֖ה מֵ/עַ֥ל הָ/עָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/022.yaml
  text: Then David said to Ornan, “Give me the place of the threshing floor, so that I may build on it an altar to the LORD. Give it to me for the full price, so that the plague may be stopped from upon the people.”
translation:
  language: ta
  text: அப்போது தாவீது ஒர்னானிடம், “நான் யெகோவாவுக்கு ஒரு பலிபீடத்தைக் கட்டுவதற்காக, இந்தக் கதிரடிக்கும் களத்தின் இடத்தை எனக்குக் கொடு. மக்கள்மேலிருந்து கொள்ளைநோய் விலகும்படி, முழு விலைக்கு அதை எனக்குக் கொடு” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְקוֹם הַגֹּרֶן
  choice: போரடிக்கும் களத்தின் இடம்
  rationale: ‘מְקוֹם’ என்பதன் ‘இடம்’ என்ற பொருளையும், ‘גֹּרֶן’ குறிக்கும் தானியம் போரடிக்கும் களத்தையும் தெளிவாகக் காக்கிறது.
- source_word: בְּכֶסֶף מָלֵא
  choice: முழு விலைக்கு
  rationale: சொல்லளவில் ‘முழுத் தொகைக்கு’ எனினும், பேரமோ தள்ளுபடியோ இன்றிய முழு விலையைக் குறிக்கும் இயல்பான தமிழ் நடை.
- source_word: וְתֵעָצַר
  choice: நிறுத்தப்படும்படி
  rationale: கொள்ளைநோய் தடுக்கப்பட்டு முடிவுக்கு வர வேண்டும் என்ற நோக்கத்தை, மூலத்தின் செயல்பாட்டு வடிவத்துடன் வெளிப்படுத்துகிறது.
- source_word: מֵעַל הָעָם
  choice: மக்கள்மேல் வந்த
  rationale: ‘மக்கள்மேலிருந்து’ என்ற எபிரெயச் சொல்லமைப்பைத் தமிழில் இயல்பாகப் புரியவைக்கிறது; கொள்ளைநோய் மக்களைப் பீடித்திருப்பதையும் காக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: கர்த்தர் / யாவே
  rationale: தனிப்பட்ட இறைப் பெயரை பொதுப் பட்டப்பெயராக மாற்றாமல், தமிழ் வேதாகம வாசகர்களுக்குப் பரவலாக அறிமுகமான ஒலிபெயர்ப்பால் வழங்குகிறது; குறிப்பிட்ட சமய விளக்கத்தைச் சேர்ப்பதில்லை.
- issue: பலிபீடம் கட்டுவதற்கும் கொள்ளைநோய் நிற்பதற்கும் இடையிலான தொடர்பு
  choice: இரு நோக்கங்களையும் ‘ும்படி’ என இணைத்தல்
  alternative: பலிபீடம் கட்டினால் கொள்ளைநோய் நிச்சயமாக நிற்கும் என காரணவிளக்கமாக்குதல்
  rationale: மூலத்தில் உள்ள நோக்கத் தொடர்பை மட்டும் காத்து, வெளிப்படையாகச் சொல்லப்படாத காரணவியல் அல்லது சடங்கு சார்ந்த விளக்கத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட நேரடி உரை. ‘போரடிக்கும் களம்’, ‘கொள்ளைநோய்’, ‘முழு விலை’ ஆகியவை சாதாரண வாசகருக்குப் புரியும் வகையில் தேர்ந்தெடுக்கப்பட்டன.
