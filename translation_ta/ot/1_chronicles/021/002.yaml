source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר דָּוִ֤יד אֶל יוֹאָב֙ וְ/אֶל שָׂרֵ֣י הָ/עָ֔ם לְכ֗וּ סִפְרוּ֙ אֶת יִשְׂרָאֵ֔ל מִ/בְּאֵ֥ר שֶׁ֖בַע וְ/עַד דָּ֑ן וְ/הָבִ֣יאוּ אֵלַ֔/י וְ/אֵדְעָ֖ה אֶת מִסְפָּרָֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/002.yaml
  text: Then David said to Joab and to the commanders of the people[a], “Go, count Israel from Beersheba to Dan, and bring it to me, so that I may know their number.”
translation:
  language: ta
  text: பின்பு தாவீது யோவாபையும் மக்களின் தலைவர்களையும் நோக்கி, “நீங்கள் போய், பெயெர்செபா முதல் தாண் வரை[a] இஸ்ரவேலைக் கணக்கெடுங்கள். அவர்களுடைய எண்ணிக்கையை நான் அறிந்துகொள்ளும்படி, அதை என்னிடம் கொண்டுவாருங்கள்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பெயெர்செபா முதல் தாண் வரை” என்பது இஸ்ரவேலின் ஒரு முனையிலிருந்து மறுமுனைவரை, அதாவது நாடு முழுவதையும் குறிக்கும் எபிரெய வழக்குத்தொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: பின்பு ... என்றான்
  rationale: வாவ் தொடர்வினை கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது; ‘பின்பு’ அதன் தொடர் இயல்பை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: שָׂרֵי הָעָם
  choice: மக்களின் படைத்தலைவர்கள்
  rationale: שָׂרִים என்பது தலைவர்கள், அதிகாரிகள் அல்லது படைத்தலைவர்களைக் குறிக்கலாம். யோவாபும் மக்கள் கணக்கெடுப்பின் இராணுவச் சூழலும் இடம்பெறுவதால், ‘படைத்தலைவர்கள்’ பொருத்தமானதாகும்; குறிப்பிட்ட பதவிநிலையை அதற்கு மேல் சேர்ப்பதில்லை.
- source_word: לְכוּ סִפְרוּ
  choice: நீங்கள் போய் ... கணக்கெடுங்கள்
  rationale: இரு பன்மை கட்டளைகளையும் இயல்பான தமிழில் காக்கிறது. இச்சூழலில் ספר என்பது மக்களைக் கணக்கிடுவதைக் குறிப்பதால் ‘கணக்கெடுங்கள்’ தெளிவானது.
- source_word: אֶת יִשְׂרָאֵל
  choice: இஸ்ரவேலை
  rationale: எபிரெய மூலத்தில் உள்ள ‘இஸ்ரவேல்’ என்ற கூட்டு மக்கள்பெயரை விளக்க விரிவாக்கமின்றி நேரடியாகக் காக்கிறது.
- source_word: מִבְּאֵר שֶׁבַע וְעַד דָּן
  choice: பெயெர்செபா முதல் தாண் வரை
  rationale: தெற்கிலிருந்து வடக்குவரையிலான நாட்டின் முழுப் பரப்பையும் குறிக்கும் நிலையான புவியியல் சொல்லாட்சியை இடப்பெயர்களுடன் காக்கிறது.
- source_word: וְהָבִיאוּ אֵלַי
  choice: அதை என்னிடம் கொண்டுவாருங்கள்
  rationale: மூலத்தில் வெளிப்படையாகக் குறிப்பிடப்படாத பொருளை ‘அதை’ எனவே வைத்திருப்பதால், கணக்கெடுப்பின் முடிவைச் சுட்டும் எபிரெய மொழியின் சுருக்கமும் சிறு மறைபொருளும் காக்கப்படுகின்றன.
- source_word: וְאֵדְעָה אֶת מִסְפָּרָם
  choice: அவர்களுடைய எண்ணிக்கையை நான் அறிந்துகொள்ளும்படி
  rationale: கோஹோர்டேட்டிவ் வடிவத்தின் நோக்கம் அல்லது விரும்பிய விளைவை ‘அறிந்துகொள்ளும்படி’ இயல்பாக வெளிப்படுத்துகிறது; ‘அவர்களுடைய எண்ணிக்கை’ மூலப் பெயர்ச்சொல் தொடரைத் துல்லியமாகக் காக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் மரியாதைமிக்க வேதாகம நடையிலும் வடிவமைக்கப்பட்டது. பன்மை கட்டளைகளைத் தெளிவாக்க ‘நீங்கள்’ சேர்க்கப்பட்டுள்ளது. இடப்பெயர்கள் தமிழ் வேதாகம மரபில் பரவலாக அறியப்படும் வடிவங்களில் வழங்கப்பட்டுள்ளன; மூலத்தின் சுருக்கத்தையும் மறைபொருளையும் காக்க ‘அதை’ என்பது விரிவுபடுத்தப்படவில்லை.
