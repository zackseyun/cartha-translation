- from: ஆனால் அரசனின் சொல் யோவாபை மேற்கொண்டது[a]. ஆகவே யோவாப் புறப்பட்டு, இஸ்ரவேல் முழுவதும் சுற்றிப் பயணம் செய்துவிட்டு[b], எருசலேமுக்கு வந்தான்.
