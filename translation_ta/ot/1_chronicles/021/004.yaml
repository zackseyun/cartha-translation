base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/004.yaml
  text: But the king’s word prevailed against Joab[a]. So Joab went out and went throughout all Israel[b], and he came to Jerusalem.
translation:
  language: ta
  text: ஆனால் அரசனின் சொல் யோவாபை விட மேலோங்கியது[a]. அதனால் யோவாப் புறப்பட்டு, இஸ்ரவேல் முழுவதும் சுற்றிச் சென்றான்[b]; பின்னர் எருசலேமுக்கு வந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அரசனின் கட்டளை யோவாபை விட மேலோங்கியது.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “இஸ்ரவேல் முழுவதும் பயணம் செய்தான்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּדְבַר הַמֶּלֶךְ
  choice: ஆனால் அரசனின் சொல்
  rationale: דָּבָר என்பதன் அடிப்படைப் பொருளான ‘சொல்’ என்பதைக் காத்து, இச்சூழலில் அது அதிகாரமுள்ள அரச கட்டளையைக் குறிப்பதை வாசகர் உணரும்படி மொழிபெயர்க்கப்பட்டுள்ளது. וּ முன்னைய வசனத்தில் யோவாப் தெரிவித்த எதிர்ப்புடன் உள்ள முரண்பாட்டைக் காட்ட ‘ஆனால்’ என வழங்கப்பட்டுள்ளது.
- source_word: חָזַק עַל
  choice: யோவாபை மேற்கொண்டது
  rationale: ‘ஒருவருக்கு எதிராக/மேல் வலுப்பெறு’ என்ற எபிரெய மரபுத்தொடர், யோவாபின் எதிர்ப்பை அரசனின் சொல் வென்றதைக் குறிக்கிறது. ‘மேற்கொண்டது’ அந்த மேலோங்கிய வலிமையை இயல்பான, கண்ணியமான தமிழில் காக்கிறது.
- source_word: וַיֵּצֵא יוֹאָב
  choice: ஆகவே யோவாப் புறப்பட்டு
  rationale: יָצָא என்பதன் சாதாரணப் பொருள் ‘வெளியே செல்/புறப்படு.’ முந்தைய கூற்றின் விளைவாக நிகழ்வதால் וַ தொடரை ‘ஆகவே’ என வழங்குவது உரையின் காரணவிளைவு ஓட்டத்தைத் தெளிவாக்குகிறது.
- source_word: וַיִּתְהַלֵּךְ בְּכָל יִשְׂרָאֵל
  choice: இஸ்ரவேல் முழுவதும் சுற்றிப் பயணம் செய்துவிட்டு
  rationale: הָלַךְ என்பதன் ஹித்பயேல் வடிவம் இங்கு பல இடங்களுக்குச் சுற்றிச் செல்வதைக் காட்டுகிறது. ‘சுற்றிப் பயணம் செய்துவிட்டு’ என்பது அந்த விரிவான நடமாட்டத்தையும், பின்னர் எருசலேமுக்கு வந்த நிகழ்வையும் இயல்பாக இணைக்கிறது.
- source_word: כָּל יִשְׂרָאֵל
  choice: இஸ்ரவேல் முழுவதும்
  rationale: பயணத்தின் தேசமுழுதுமான பரப்பைத் தெளிவாகக் காட்டும் நேரான தமிழ் வடிவம்.
- source_word: וַיָּבֹא יְרוּשָׁלִָם
  choice: எருசலேமுக்கு வந்தான்
  rationale: בּוֹא என்பது ‘வரு/நுழை’ என்பதாகும். சூழலால் திரும்பி வந்தான் எனப் புரிந்துகொள்ள முடிந்தாலும், மூலத்தில் ‘திரும்பு’ இல்லை; ஆகவே ‘வந்தான்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
