translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘அரசனின் சொல்’ மூலத்தின் உருவகத்தைப் பாதுகாக்கிறது; ‘மேற்கொண்டது’ சற்றே இலக்கியமானதாயினும் புரியத்தக்க வகையில் חָזַק עַל என்ற மரபுத்தொடரின் வலிமையை வெளிப்படுத்துகிறது. அனைத்து அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
