source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר דָּוִיד֙ אֶל הָ֣/אֱלֹהִ֔ים חָטָ֣אתִֽי מְאֹ֔ד אֲשֶׁ֥ר עָשִׂ֖יתִי אֶת הַ/דָּבָ֣ר הַ/זֶּ֑ה וְ/עַתָּ֗ה הַֽעֲבֶר נָא֙ אֶת עֲו֣וֹן עַבְדְּ/ךָ֔ כִּ֥י נִסְכַּ֖לְתִּי מְאֹֽד־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/008.yaml
  text: Then David said to God[a], “I have sinned greatly in doing this thing. But now, please take away the guilt of your servant, for I have acted very foolishly.”
translation:
  language: ta
  text: அப்போது தாவீது கடவுளிடம், “இந்தக் காரியத்தைச் செய்ததனால் நான் பெரிதும் பாவம் செய்துவிட்டேன். இப்போது, உமது அடியானின் குற்றப்பழியை[a] தயவுசெய்து அகற்றும்; ஏனெனில் நான் மிகவும் மூடத்தனமாக நடந்துகொண்டேன்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உமது அடியானின் அக்கிரமத்தை அகற்றும்.” எபிரெயச் சொல் “அக்கிரமம்,” “குற்றப்பழி,” அல்லது குற்றத்தால் ஏற்படும் பொறுப்பு ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றான்
  rationale: வாவ் தொடர்வினை கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது; ‘அப்போது’ இயல்பான தமிழ் கதைநடையில் நிகழ்வின் தொடர்ச்சியைத் தெளிவாக்குகிறது.
- source_word: אֶל הָאֱלֹהִים
  choice: கடவுளிடம்
  rationale: இஸ்ரவேலின் கடவுளைக் குறிக்கும் இச்சூழலில், நவீன நிலையான தமிழில் இயல்பான ஒருமைச் சுட்டாக ‘கடவுள்’ பயன்படுத்தப்படுகிறது.
- source_word: חָטָאתִי מְאֹד
  choice: நான் பெரிதும் பாவம் செய்துவிட்டேன்
  rationale: מְאֹד என்பதன் வலியுறுத்தலையும், முடிந்த செயலை ஒப்புக்கொள்ளும் எபிரெய நிறைவுவினையின் உணர்வையும் இயல்பான தமிழில் தருகிறது.
- source_word: אֲשֶׁר עָשִׂיתִי אֶת הַדָּבָר הַזֶּה
  choice: இந்தக் காரியத்தைச் செய்ததனால்
  rationale: தாவீதின் பாவத்துக்கும் குறிப்பிட்ட செயலுக்கும் உள்ள காரணத் தொடர்பைச் சுருக்கமாகவும் தெளிவாகவும் காட்டுகிறது.
- source_word: וְעַתָּה
  choice: இப்போது
  rationale: ஒப்புக்கொள்ளுதலிலிருந்து வேண்டுதலுக்கு மாறும் கருத்துத் திருப்பத்தை இயல்பாகக் குறிக்கிறது; எபிரெய இணைப்பை தமிழில் தேவையின்றி மிகைப்படுத்தவில்லை.
- source_word: הַעֲבֶר נָא
  choice: தயவுசெய்து அகற்றும்
  rationale: עבר என்பதன் ஹிஃபீல் கட்டளை வடிவம் இங்கு அகற்றுதல் என்ற பொருளையும், נָא பணிவான வேண்டுதலையும் தருகிறது; மரியாதை வினைமுற்று தெய்வத்திடம் செய்யும் விண்ணப்பத்துக்கு ஏற்றது.
- source_word: עֲוֹן
  choice: குற்றப்பழி
  rationale: இச்சொல் அக்கிரமம், குற்றநிலை, அதனால் வரும் பொறுப்பு ஆகியவற்றைக் குறிக்கக்கூடும். ‘குற்றப்பழி’ தாவீது அகற்றும்படி கேட்கும் தார்மீகப் பாரத்தைத் தெரிவிக்கிறது; அதைப் பாவச்செயலாகவோ தண்டனையாகவோ மட்டும் குறுக்கவில்லை.
- source_word: עַבְדְּךָ
  choice: உமது அடியான்
  rationale: கடவுளுக்கு முன் தாவீது தன்னைப் பணிவுடன் குறிப்பிடும் சூழலை ‘அடியான்’ இயல்பாகவும் கண்ணியமாகவும் வெளிப்படுத்துகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய வேண்டுதலுக்கான காரணத்தை வெளிப்படையாக அறிமுகப்படுத்துகிறது.
- source_word: נִסְכַּלְתִּי מְאֹד
  choice: நான் மிகவும் மூடத்தனமாக நடந்துகொண்டேன்
  rationale: இது வெறும் குணப்பண்பை அல்ல, மூடத்தனமான செயலைக் குறிக்கிறது; ‘மிகவும்’ מְאֹד என்பதன் வலியுறுத்தலைப் பாதுகாக்கிறது.
theological_decisions:
- issue: தாவீதின் வேண்டுதலில் עָוֹן என்பதன் பொருள்
  choice: ‘குற்றப்பழி’ என்று மொழிபெயர்க்கப்பட்டது
  alternative: ‘அக்கிரமம்’ அல்லது ‘அக்கிரமத்திற்கான தண்டனை’
  rationale: சொல்லின் பொருள் பாவச்செயல், குற்றநிலை, அதனால் உருவாகும் பொறுப்பு ஆகியவற்றை உள்ளடக்கலாம். ‘குற்றப்பழி’ மன்னிப்புக்கான வேண்டுதலின் தார்மீகப் பாரத்தைத் தெரிவிப்பதோடு, பொருளைச் செயல் அல்லது தண்டனை ஒன்றுக்கு மட்டும் வரையறுக்காமல் வைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான வேதாகம நடை பயன்படுத்தப்பட்டுள்ளது. ‘உமது,’ ‘அடியான்,’ ‘அகற்றும்’ ஆகியவை வேண்டுதலின் பணிவையும் நேரடி உரையின் மரியாதையையும் காக்கின்றன; தேவையற்ற பழமையான சொற்கள் தவிர்க்கப்பட்டுள்ளன.
