source:
  edition: WLC
  text: וַ/יִּתֵּ֥ן דָּוִ֛יד לְ/אָרְנָ֖ן בַּ/מָּק֑וֹם שִׁקְלֵ֣י זָהָ֔ב מִשְׁקָ֖ל שֵׁ֥שׁ מֵאֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/025.yaml
  text: And David gave Ornan six hundred shekels of gold by weight for the place[a].
translation:
  language: ta
  text: தாவீது அந்த இடத்திற்காக ஓர்னானுக்கு எடையளவில் அறுநூறு சேக்கல் தங்கத்தைக் கொடுத்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இணை வசனமான 2 சாமுவேல் 24:24 ஐம்பது சேக்கல் வெள்ளியைக் குறிப்பிடுகிறது; ஆனால் நாளாகமம் இங்கு அறுநூறு சேக்கல் தங்கம் என்று வாசிக்கிறது. இது வாங்கியதன் அளவு அல்லது வரம்பு வேறுபட்டிருந்ததையோ, வேறொரு உரைமரபையோ பிரதிபலிக்கலாம்.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: கொடுத்தார்
  rationale: נתן என்பதன் அடிப்படைப் பொருள் ‘கொடு’. இது வாங்கிய சூழல் என்றாலும், எபிரெயச் சொல்லை மிகையாக விளக்காமல் ‘கொடுத்தார்’ என்று மொழிபெயர்ப்பது பொருத்தமானது; தொகையும் இடமும் இதைப் பணம் செலுத்தியதாகத் தெளிவாக்குகின்றன.
- source_word: לְאָרְנָן
  choice: ஓர்னானுக்கு
  rationale: நாளாகமத்தின் உடனடி எபிரெய மூலத்தில் பெயர் ஓர்னான் என்று உள்ளது. சாமுவேல் இணைப் பகுதியில் வரும் அரவுனா என்ற பெயரை இங்கு கொண்டுவராமல் மூலவடிவத்தைப் பேணுகிறது.
- source_word: בַּמָּקוֹם
  choice: அந்த இடத்திற்காக
  rationale: מָקוֹם என்பது ‘இடம்’ அல்லது ‘தளம்’ எனப் பொருள்படும். வாங்கும் சூழலில், இடத்திற்குக் கொடுக்கப்பட்ட விலை என்ற உறவை ‘அந்த இடத்திற்காக’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: שִׁקְלֵי זָהָב
  choice: சேக்கல் தங்கம்
  rationale: பண்டைய எடை அலகான சேக்கலை மாற்றிக் கணக்கிடாமல் வைத்திருக்கிறது; தங்கம் என்பதே எடைபோடப்பட்ட பொருள் என்பதைத் தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: מִשְׁקָל
  choice: எடையின்படி
  rationale: מִשְׁקָל இங்கு சேக்கல் ஓர் எடை அளவு என்பதை வலியுறுத்துகிறது. ‘எடையின்படி’ என்பது இதைத் தெளிவான நவீன தமிழில் தருகிறது.
- source_word: שֵׁשׁ מֵאוֹת
  choice: அறுநூறு
  rationale: மூலத்தில் உள்ள எண்ணை எந்த ஒத்திசைவும் செய்யாமல் நேரடியாகப் பேணுகிறது.
theological_decisions:
- issue: 2 சாமுவேல் 24:24-இன் இணைக் குறிப்புடன் காணப்படும் தொகை வேறுபாடு
  choice: நாளாகமத்தின் ‘அறுநூறு சேக்கல் தங்கம்’ என்ற வாசகத்தை மாற்றமின்றிப் பேணுதல்
  alternative: 2 சாமுவேலில் எருதுகளுக்கும் களத்துமேட்டுக்கும் கூறப்படும் ஐம்பது சேக்கல் வெள்ளியுடன் ஒத்திசைத்த மொழிபெயர்ப்பு
  rationale: நாளாகமத்தின் எபிரெய உரை அறுநூறு சேக்கல் தங்கம் என்று வெளிப்படையாகக் கூறுகிறது. உரைகளுக்கிடையேயான பதற்றத்தை மொழிபெயர்ப்பில் மறைக்காமல், இந்த வசனத்தை அது எழுதப்பட்டபடியே வழங்க வேண்டும்; சாத்தியமான விளக்கங்கள் அடிக்குறிப்பில் மட்டுமே குறிப்பிடப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘சேக்கல்’ என்ற பண்டைய எடை அலகு பாதுகாக்கப்பட்டு, ‘எடையின்படி’ என்பதால் அதன் இயல்பு தெளிவாக்கப்பட்டது. வசனத்தின் முடிவில் [a] குறியீடு சேர்க்கப்பட்டுள்ளது.
