base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/014.yaml
  text: So Yahweh sent a plague on Israel[a], and seventy thousand men of Israel fell.
translation:
  language: ta
  text: ஆகவே யாவே இஸ்ரவேலின் மேல் கொள்ளைநோயை அனுப்பினார்[a]; இஸ்ரவேலருள் எழுபதாயிரம் ஆண்கள் வீழ்ந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கொடிய தொற்றுநோய்.” எபிரேயச் சொல் உயிரிழப்பை ஏற்படுத்தும் நோய்ப்பரவலைக் குறிக்கிறது; இது பெரும்பாலும் தெய்வீகத் தீர்ப்பின் சூழலில் வருகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: וַיִּתֵּן
  choice: அனுப்பினார்
  rationale: சொல்லளவில் ‘கொடுத்தார்’ என்றாலும், கொள்ளைநோயுடன் வரும் எபிரேய மரபுத்தொடரை இயல்பான தமிழில் ‘அனுப்பினார்’ என்று வழங்குவது செயற்பாட்டைத் தெளிவாகக் காக்கிறது.
- source_word: דֶּבֶר
  choice: கொள்ளைநோய்
  rationale: உயிரிழப்பை ஏற்படுத்தும் பரவலான நோயையும் இச்சூழலிலுள்ள தெய்வீகத் தீர்ப்பின் தன்மையையும் குறிக்கும் இயல்பான நவீனத் தமிழ் சொல்.
- source_word: בְּיִשְׂרָאֵל
  choice: இஸ்ரவேல்மேல்
  rationale: நோய் இஸ்ரவேலின்மேல் வந்ததைத் தெரிவிக்கும் בְ முன்னிடைச்சொல்லின் சூழல்சார் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיִּפֹּל
  choice: வீழ்ந்தார்கள்
  rationale: மரணத்தைக் குறிக்கும் எபிரேய உருவகத்தை நேரடியாகக் காக்கிறது; ‘இறந்தார்கள்’ என்று விளக்கி விரிவுபடுத்தவில்லை.
- source_word: מִיִּשְׂרָאֵל
  choice: இஸ்ரவேலரில்
  rationale: இஸ்ரவேல் மக்களுக்குள் அல்லது அவர்களில் எழுபதாயிரம் பேர் என்பதைக் குறிக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: שִׁבְעִים אֶלֶף אִישׁ
  choice: எழுபதாயிரம் ஆண்கள்
  rationale: எண்ணுக்குப் பின் கூட்டுப்பொருளில் வரும் אִישׁ என்பதன் ஆண்பால் குறிப்பை மறைக்காமல் மொழிபெயர்க்கிறது.
theological_decisions:
- issue: தீர்ப்பில் கடவுளின் நேரடி செயற்பாடு
  choice: யாவே ... கொள்ளைநோயை அனுப்பினார்
  alternative: யாவே ... கொள்ளைநோய் வர அனுமதித்தார்
  rationale: எபிரேய வாக்கியம் செயலை நேரடியாக யாவேக்கு உரியதாகக் கூறுகிறது; ‘அனுமதித்தார்’ என மாற்றுவது மூலத்தில் இல்லாத இறையியல் தணிப்பைச் சேர்க்கும்.
