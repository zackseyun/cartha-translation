  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘யாவே’ என இறைப்பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது; ‘வீழ்ந்தார்கள்’ என்ற மூல உருவகம் காக்கப்பட்டுள்ளது.
