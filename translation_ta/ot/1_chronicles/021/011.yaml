  edition: WLC
  text: וַ/יָּ֥בֹא גָ֖ד אֶל דָּוִ֑יד וַ/יֹּ֥אמֶר ל֛/וֹ כֹּֽה אָמַ֥ר יְהוָ֖ה קַבֶּל לָֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/011.yaml
  text: So Gad came to David and said to him[a], “Thus says Yahweh, ‘Choose for yourself—’”
translation:
  language: ta
  text: 'அப்பொழுது காத் தாவீதிடம் வந்து அவரிடம், “யாவே இவ்வாறு கூறுகிறார்: ‘உனக்காகத் தேர்ந்தெடுத்துக்கொள்[a]—’” என்றார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்சொல்லாக, “உனக்காக ஏற்றுக்கொள்—”; அடுத்த வசனத்தில் கூறப்படும் விருப்பங்களில் ஒன்றைத் தேர்ந்தெடுக்கும்படியான கட்டளையே சூழலின்படி இதன் பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: வந்து
  rationale: בוא என்ற பொதுவான நகர்வு வினைச்சொல் இங்கு தாவீதை நோக்கி வந்ததை இயல்பான தமிழ் கதைநடையில் தெரிவிக்கிறது.
- source_word: גָד
  choice: காத்
  rationale: எபிரேய தனிப்பெயரின் ஒலியை நவீன தமிழில் அண்மையாக எழுத்துப்பெயர்த்துள்ளது.
- source_word: אֶל דָּוִיד
  choice: தாவீதிடம்
  rationale: ஒருவரை நோக்கிய நகர்வைக் குறிக்கும் אֶל என்பதையும் தாவீது என்ற தனிப்பெயரையும் இயல்பான தமிழில் ஒருங்கிணைக்கிறது.
- source_word: וַיֹּאמֶר לוֹ
  choice: அவரிடம் ... என்றார்
  rationale: אמר உடன் வரும் மறைமுகப் பொருள் சுட்டுப்பெயரைத் தக்கவைத்து, மரியாதை ஒருமையுடன் இயல்பான தமிழ் நேர்கூற்று அமைப்பைப் பயன்படுத்துகிறது.
- source_word: כֹּה אָמַר
  choice: இவ்வாறு கூறுகிறார்
  rationale: தீர்க்கதரிசனத் தூதுச் சூத்திரத்தை தற்போதைய அறிவிப்பாக இயல்பாகவும் கண்ணியமாகவும் வழங்குகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், எபிரேய நான்கெழுத்துப் பெயரின் பரவலான தமிழ் எழுத்துப்பெயர்ப்பாக வழங்குகிறது.
- source_word: קַבֶּל
  choice: தேர்ந்தெடுத்துக்கொள்
  rationale: அடுத்த வசனத்தில் சொல்லப்படும் விருப்பங்களில் ஒன்றைத் தாவீது தேர்வு செய்ய வேண்டும் என்பதே சூழல்சார் வலிமை; அடிப்படைப் பொருளான ‘ஏற்றுக்கொள்’ அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: לָךְ
  choice: உனக்காக
  rationale: தாவீது தனக்கென ஒரு விருப்பத்தைத் தேர்ந்தெடுக்க வேண்டிய தனிப்பட்ட தொடர்பைத் தெரிவிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் ஒரு தெய்வீகப் பட்டம் அல்ல, நான்கெழுத்துத் தனிப்பெயரே உள்ளது. ஆகவே பெயரைப் பெயராகவே எழுத்துப்பெயர்ப்பது மூல வடிவத்தைப் பாதுகாக்கிறது.
- issue: קַבֶּל என்பதன் சூழல்சார் பொருள்
  choice: தேர்ந்தெடுத்துக்கொள்
  alternative: ஏற்றுக்கொள்
  rationale: அடுத்த வசனத்தில் முன்வைக்கப்படும் தண்டனை விருப்பங்களில் ஒன்றைத் தேர்வு செய்யும்படி கட்டளையிடப்படுவதால், சூழல்சார் பொருள் முதன்மை உரையில் தரப்படுகிறது; சொற்பொருள் அடிக்குறிப்பில் வைக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; கதைநடையில் கண்ணியமான மரியாதை ஒருமை பயன்படுத்தப்பட்டுள்ளது. தீர்க்கதரிசனத் தூதுச் சூத்திரமும் முடிவுறாத மேற்கோளைக் காட்டும் நீண்ட கோடும் பாதுகாக்கப்பட்டுள்ளன.
