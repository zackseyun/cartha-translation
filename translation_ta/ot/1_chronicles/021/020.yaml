translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியக்கூடிய கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயத்தின் தொடர்ச்சியான வாக்கிய அமைப்பு தமிழில் தெளிவுக்காக வாக்கியங்களாகப் பிரிக்கப்பட்டாலும், செயல்களின் ஒரேகாலப் பின்னணி காக்கப்பட்டுள்ளது.
