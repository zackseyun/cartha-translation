base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/020.yaml
  text: Ornan turned and saw the angel[a], and his four sons with him were hiding themselves, while Ornan was threshing wheat.
translation:
  language: ta
  text: ஒர்னான் திரும்பி அந்தத் தேவதூதனைப் பார்த்தான். அவனுடன் இருந்த அவனுடைய நான்கு மகன்களும் தங்களை ஒளித்துக்கொண்டிருந்தார்கள்[a]; அப்போது ஒர்னான் கோதுமையைக் கதிரடித்துக்கொண்டிருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஒளிந்துகொண்டிருந்தார்கள்.’ எபிரெயச் சொல்லின் தற்சுட்டு வடிவம் இன்னும் சொல்லுக்குச் சொல்லாக, ‘தங்களை ஒளித்துக்கொண்டிருந்தார்கள்’ எனப் பொருள்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: திரும்பி
  rationale: שׁוב என்பதன் அடிப்படைப் பொருளான ‘திரும்புதல்’ என்பதை இயல்பாகத் தருகிறது; எபிரெயத்தில் இல்லாத ‘இப்போது’ போன்ற காலக் குறிப்பு சேர்க்கப்படவில்லை.
- source_word: וַיַּרְא אֶת הַמַּלְאָךְ
  choice: அந்தத் தேவதூதனைப் பார்த்தான்
  rationale: מַלְאָךְ என்பது ‘தூதன்’ அல்லது ‘தேவதூதன்’ எனப் பொருள்படலாம்; இத்தெய்வீகத் தண்டனைச் சூழலில் இயற்கைக்கு அப்பாற்பட்ட தூதனே குறிக்கப்படுவதால் ‘தேவதூதன்’ தெளிவானது.
- source_word: וְאַרְבַּעַת בָּנָיו עִמּוֹ
  choice: அவனுடன் இருந்த அவனுடைய நான்கு மகன்களும்
  rationale: மகன்கள் ஒர்னானுடன் இருந்தார்கள் என்பதையும் அவர்கள் அவனுடைய நான்கு மகன்கள் என்பதையும் இயல்பான தமிழ் தொடரில் வெளிப்படுத்துகிறது.
- source_word: מִתְחַבְּאִים
  choice: தங்களை ஒளித்துக்கொண்டிருந்தார்கள்
  rationale: Hitpael வடிவத்தின் தற்சுட்டு/இடைநிலை நுட்பத்தையும் தொடர்ந்துகொண்டிருந்த செயலையும் பாதுகாக்கிறது.
- source_word: וְאָרְנָן דָּשׁ חִטִּים
  choice: அப்போது ஒர்னான் கோதுமையைக் கதிரடித்துக்கொண்டிருந்தான்
  rationale: ஒர்னான் அச்சமயத்தில் செய்துகொண்டிருந்த பின்னணிச் செயலைத் தெளிவாகக் காட்டுகிறது; חִטִּים என்பது பொதுவான தானியம் அல்ல, குறிப்பாக கோதுமை.
