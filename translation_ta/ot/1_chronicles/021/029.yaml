source:
  edition: WLC
  text: וּ/מִשְׁכַּ֣ן יְ֠הוָה אֲשֶׁר עָשָׂ֨ה מֹשֶׁ֧ה בַ/מִּדְבָּ֛ר וּ/מִזְבַּ֥ח הָ/עוֹלָ֖ה בָּ/עֵ֣ת הַ/הִ֑יא בַּ/בָּמָ֖ה בְּ/גִבְעֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/029.yaml
  text: The tabernacle of Yahweh, which Moses had made in the wilderness, and the altar of burnt offering were at that time on the high place at Gibeon.
translation:
  language: ta
  text: வனாந்தரத்தில் மோசே அமைத்த யாவேயின் திருக்கூடாரமும் தகனபலிப் பலிபீடமும் அக்காலத்தில் கிபியோனிலுள்ள மேட்டுத் தொழுகையிடத்தில் இருந்தன.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשְׁכַּן
  choice: திருக்கூடாரம்
  rationale: மோசே அமைத்த எடுத்துச் செல்லக்கூடிய பரிசுத்த இருப்பிடத்தைக் குறிக்கும் வழக்கமான, சூழலுக்குப் பொருத்தமான தமிழ்ச் சொல்.
- source_word: יְהוָה
  choice: யாவே
  rationale: தேவனுடைய தனிப்பட்ட உடன்படிக்கைப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אֲשֶׁר עָשָׂה מֹשֶׁה בַמִּדְבָּר
  choice: வனாந்தரத்தில் மோசே அமைத்த
  rationale: எபிரெய உறவுநிலைத் தொடரை இயல்பான தமிழ் பெயரெச்சத் தொடராக வழங்குகிறது; עָשָׂה இச்சூழலில் கட்டி/அமைத்த செயலைக் குறிக்கிறது.
- source_word: מִזְבַּח הָעוֹלָה
  choice: தகனபலிப் பலிபீடம்
  rationale: முழுவதுமாக எரித்துச் செலுத்தப்படும் பலிக்குரிய பீடத்தைத் துல்லியமாகக் குறிக்கும் நிலைபெற்ற வழிபாட்டுச் சொற்றொடர்.
- source_word: בָּעֵת הַהִיא
  choice: அக்காலத்தில்
  rationale: கதையின் அப்போதைய காலநிலையைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: בַּבָּמָה בְּגִבְעוֹן
  choice: கிபியோனிலுள்ள மேட்டுத் தொழுகையிடத்தில்
  rationale: בָּמָה என்பது வெறும் உயரமான நிலப்பகுதி அல்ல, வழிபாட்டுக்குரிய மேட்டு இடம் என்பதைக் சூழலுக்கேற்ப தெளிவாக்குகிறது.
- source_word: וּ
  choice: –மும் … –மும்
  rationale: இரு பெயர்த்தொடர்களையும் கூட்டெழுவாயாக இணைக்கும் எபிரெய இணைப்புகளை இயல்பான தமிழ் இணை அமைப்பில் பிரதிபலிக்கிறது; மூலத்தில் இல்லாத ‘இப்போது’ போன்ற காலச் சொல்லைச் சேர்க்கவில்லை.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பட்டம் அல்ல, நான்கெழுத்துத் தெய்வீகப் பெயரே உள்ளது; ஆகவே பெயரின் தன்மையைப் பாதுகாக்க ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டது.
- issue: בָּמָה என்பதன் வழிபாட்டுச் சார்பு
  choice: மேட்டுத் தொழுகையிடம்
  alternative: மேடான இடம்
  rationale: இவ்வசனத்தில் திருக்கூடாரமும் பலிபீடமும் அமைந்த அதிகாரப்பூர்வ வழிபாட்டு இடத்தைக் குறிக்கிறது; மொழிபெயர்ப்பு அந்த வழிபாட்டுச் சார்பை வெளிப்படுத்துகிறது, ஆனால் அதன் ஏற்புடைமை குறித்து வசனத்தைத் தாண்டிய தீர்ப்பைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு விளங்கும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. எபிரெயத்தின் பெயர்ச்சொல் சார்ந்த உட்பிரிவை இயல்பான தமிழ் பெயரெச்சத் தொடராகவும், கூட்டெழுவாயை ‘–மும் … –மும்’ அமைப்பாகவும் வழங்குகிறது.
