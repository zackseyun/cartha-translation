  source_fidelity: 'மூல எபிரெய வாக்கியத்தின் முக்கிய கூறுகள் அனைத்தும் துல்லியமாகத் தரப்பட்டுள்ளன: וַיַּעַל என்பதன் திசைநுட்பம் ‘மேலே சென்றார்’ என்பதில் உள்ளது; בִּדְבַר என்பதன் ‘...வார்த்தையின்படி’ என்ற இணக்க/அடிப்படைப் பொருளும் காக்கப்பட்டுள்ளது; காத் யாவேவின் பெயரில் கூறியதாகிய சார்புத் தொடர்பும் தெளிவாக உள்ளது.'
  naturalness: ‘அப்போது தாவீது, யாவேவின் பெயரில் காத் கூறிய வார்த்தையின்படி மேலே சென்றார்’ என்பது நவீன தரநிலைத் தமிழில் இயல்பாகவும் கண்ணியமான வேதாகம நடையுடனும் உள்ளது. ‘அப்போது’ மூலத்தில் வெளிப்படையாக இல்லாவிட்டாலும், தொடர்வாக்கிய வவ்-இன் கதையாடல் இணைப்பை இயல்பாக வெளிப்படுத்தும் தீங்கற்ற சேர்க்கையாகும்.
  terminology: ‘தாவீது’, ‘காத்’, ‘யாவே’ ஆகிய பெயர்வடிவங்கள் சீராக உள்ளன. யாவே என்ற திருநாமத்தை நேரடியாக வழங்குவது இத்திட்டத்தின் தீர்மானத்துடனும் בְּשֵׁם יְהוָה என்ற மூலத்தொடருடனும் பொருந்துகிறது. ‘பெயரில்’ என்பது அதிகாரப்பூர்வமாகப் பேசுதல் என்ற சூழல் நுணுக்கத்தைப் போதுமான அளவு காக்கிறது.
