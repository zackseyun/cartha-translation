source:
  edition: WLC
  text: וַ/יַּ֤עַל דָּוִיד֙ בִּ/דְבַר גָּ֔ד אֲשֶׁ֥ר דִּבֶּ֖ר בְּ/שֵׁ֥ם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/019.yaml
  text: So David went up at the word of Gad[b][a], which he had spoken in the name of Yahweh.
translation:
  language: ta
  text: அப்போது தாவீது, யாவேவின் பெயரில் காத் கூறிய வார்த்தையின்படி மேலே சென்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: மேலே சென்றார்
  rationale: עלה என்பதன் திசை சார்ந்த ‘மேலே செல்’ என்ற பொருளைப் பாதுகாக்கிறது; சூழலில் தாவீது களத்துமேட்டிற்குச் செல்வதைக் குறிக்கிறது.
- source_word: בִּדְבַר גָּד
  choice: காத் கூறிய வார்த்தையின்படி
  rationale: בְּ இங்கு அடிப்படை அல்லது இணக்கத்தைக் குறிக்கிறது. ‘வார்த்தையின்படி’ என்பது காத் அறிவித்த கட்டளைக்கு இணங்க தாவீது செயல்பட்டதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: גָּד
  choice: காத்
  rationale: எபிரெய தனிப்பெயரின் தமிழில் வழக்கமான ஒலிபெயர்ப்பு.
- source_word: אֲשֶׁר דִּבֶּר
  choice: கூறிய
  rationale: முன்னர் காத் கூறிய வார்த்தையைச் சுட்டும் சார்புநிலையைத் தமிழில் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: בְּשֵׁם יְהוָה
  choice: யாவேவின் பெயரில்
  rationale: தீர்க்கதரிசனச் செய்தி யாவேவின் அதிகாரத்தோடு அறிவிக்கப்பட்டது என்பதைக் காட்டும் மூலமொழி வடிவத்தைப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநாமமான YHWH-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், ‘Yahweh’ என்பதற்கேற்ற தமிழ்ச் சொல்மாற்றத்தில் வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருநாமத்தை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலவசனம் இறைத் திருநாமத்தை நேரடியாகப் பயன்படுத்துவதால், பட்டப்பெயரான ‘கர்த்தர்’ என்பதற்குப் பதிலாக அதன் ஒலிபெயர்ப்பை வழங்குகிறது. ‘யாவே’ என்பது ‘Yahweh’ என்ற வடிவத்தைத் தமிழில் இயல்பாகப் பிரதிபலிக்கிறது.
translation_notes:
  register: நவீன செந்தமிழ் நடை; எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. எபிரெய வாக்கியத்தின் சொற்பொருளையும் தமிழின் இயல்பான சொல் வரிசையையும் சமநிலைப்படுத்த, சார்பு வாக்கியம் பெயர்ச்சொல்லுக்கு முன்னால் வைக்கப்பட்டுள்ளது.
