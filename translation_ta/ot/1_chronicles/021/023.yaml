translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, மரியாதையும் கதைநடை இயல்பும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. அரசரிடம் பேசும் மரியாதையைப் பன்மை வடிவங்கள் காட்டுகின்றன. ‘போரடிக்கும் பலகைகள்’ வரலாற்றுக் கருவியை சாதாரண வாசகருக்கு புரியத்தக்கவாறு குறிப்பிடுகிறது; தேவையான பண்பாட்டு விளக்கம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
