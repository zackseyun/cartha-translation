  text: וַ/יֹּ֨אמֶר אָרְנָ֤ן אֶל דָּוִיד֙ קַֽח לָ֔/ךְ וְ/יַ֛עַשׂ אֲדֹנִ֥/י הַ/מֶּ֖לֶךְ הַ/טּ֣וֹב בְּ/עֵינָ֑י/ו רְאֵה֩ נָתַ֨תִּי הַ/בָּקָ֜ר לָֽ/עֹל֗וֹת וְ/הַ/מּוֹרִגִּ֧ים לָ/עֵצִ֛ים וְ/הַ/חִטִּ֥ים לַ/מִּנְחָ֖ה הַ/כֹּ֥ל נָתָֽתִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/023.yaml
  text: And Ornan said to David, “Take it for yourself, and let my lord the king do what is good in his eyes. See, I have given the cattle for burnt offerings, the threshing sledges for wood, and the wheat for the grain offering. I have given it all.”
translation:
  language: ta
  text: அப்பொழுது ஒர்னான் தாவீதிடம், “இதை உங்களுக்காக எடுத்துக்கொள்ளுங்கள். என் ஆண்டவரான அரசர் தம் பார்வையில் நல்லது எதுவோ அதைச் செய்யட்டும்.[a] இதோ, எரிபலிகளுக்காக மாடுகளையும்,[b] விறகுக்காகப் போரடிக்கும் இழுவைப் பலகைகளையும்,[c] தானியப் பலிக்காகக் கோதுமையையும்[d] கொடுத்துவிட்டேன். அனைத்தையும் கொடுத்துவிட்டேன்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் ஆண்டவரான அரசர் தமக்கு நல்லதாகத் தோன்றுவதைச் செய்யட்டும்.” எபிரேய மரபுத்தொடரின் நேர்ப்பொருள் “தம் கண்களில் நல்லதை” என்பதாகும்.
    reason: lexical_alternative
  - marker: b
    text: “எருதுகளையும்” என்றும் மொழிபெயர்க்கலாம். எபிரேயச் சொல் மாடுகளைப் பொதுவாகவோ, குறிப்பாக எருதுகளையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அதாவது, தானியத்தைப் போரடிக்கும் இந்தக் கருவிகள் பலியை எரிப்பதற்கான விறகாக வழங்கப்படுகின்றன.
    reason: cultural_note
  - marker: d
    text: “காணிக்கை” அல்லது “கப்பம் காணிக்கை” என்றும் மொழிபெயர்க்கலாம். பலிச் சூழலில் எபிரேயச் சொல் பொதுவாகத் தானியப் பலியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח לָךְ
  choice: இதை உங்களுக்காக எடுத்துக்கொள்ளுங்கள்
  rationale: לָךְ என்பதன் தனிப்பட்ட பயன்/உரிமையாக்கும் நுட்பத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது; சூழலில் இடமும் பொருட்களும் குறிக்கப்படுவதால் ‘இதை’ பொருத்தமானது.
- source_word: וְיַעַשׂ אֲדֹנִי הַמֶּלֶךְ הַטּוֹב בְּעֵינָיו
  choice: என் ஆண்டவராகிய அரசர் தம் பார்வைக்கு நல்லது எதுவோ அதைச் செய்யட்டும்
  rationale: ஒருவரின் தீர்மானப்படி செயல்பட அனுமதிக்கும் எபிரேய மரபுத்தொடரை அதன் உருவகத்துடன் பாதுகாக்கிறது.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: என் ஆண்டவராகிய அரசர்
  rationale: இங்கு אֲדֹנִי என்பது கடவுளைக் குறிக்கும் பட்டம் அல்ல; தாவீதுக்குரிய மரியாதையான அரசவை அழைப்பு.
- source_word: רְאֵה
  choice: இதோ
  rationale: கவனத்தை ஈர்த்து அடுத்து வரும் கொடையை வலியுறுத்தும் உரையாடல் செயல்பாட்டை இயல்பான தமிழில் தருகிறது.
- source_word: הַבָּקָר לָעֹלוֹת
  choice: எரிபலிகளுக்காக மாடுகளை
  rationale: בקר என்பது மாடுகள் அல்லது குறிப்பாக எருதுகளைக் குறிக்கக்கூடிய கூட்டுப்பெயர்; ‘மாடுகள்’ அதன் பரந்த பொருளைத் தக்கவைக்கிறது. עֹלוֹת என்பது முழுவதும் எரிக்கப்படும் பலிகளைக் குறிக்கிறது.
- source_word: הַמּוֹרִגִּים לָעֵצִים
  choice: விறகுக்காகப் போரடிக்கும் பலகைகளை
  rationale: מורגים என்பது தானியத்தைப் போரடிக்கப் பயன்படுத்திய இழுவைப் பலகை போன்ற கருவிகள்; அவை பலிக்கான எரிபொருளாக வழங்கப்படுகின்றன.
- source_word: הַחִטִּים לַמִּנְחָה
  choice: தானியப் பலிக்காகக் கோதுமையை
  rationale: பலிச் சூழலில் מִנְחָה பொதுவாக தானியப் பலியைக் குறிக்கிறது; கோதுமை அதன் பொருளாக நேரடியாகக் குறிப்பிடப்படுகிறது.
- source_word: הַכֹּל נָתָתִּי
  choice: அனைத்தையும் கொடுக்கிறேன்
  rationale: எபிரேய நிறைவுவினை இங்கு ஒர்னானின் முழுமையான தற்போதைய வழங்கலை வலியுறுத்துகிறது; தமிழில் நிகழ்காலம் உரையாடல் சூழலுக்கு இயல்பானது.
