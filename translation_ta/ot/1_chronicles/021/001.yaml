  choice: நாளாகமம் கூறுவதுபோல் சாத்தானை உடனடி செயலாளராக உரையில் வைத்தல்
  alternative: 2 சாமுவேல் 24:1-ஐ முன்னிறுத்தி கர்த்தரின் கோபமே நேரடியாகத் தூண்டியதாக உரையை ஒத்திசைத்தல்
  rationale: இரு நூல்களும் தரும் வேறுபட்ட முன்வைப்புகளை ஒன்றில் ஒன்றாகக் கரைக்காமல், வேதப்பகுதிகளுக்கிடையிலான உண்மையான இறையியல் பதற்றத்தைப் பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்கு எளிதாகவும் வேதாகம உரைக்கேற்ற கண்ணியத்துடனும் அமைக்கப்பட்டது. ‘எழுந்து நின்று’ மூலத்தின் உருவகத்தைப் பேணுகிறது; ‘எண்ணும்படி’ தேவையற்ற விளக்க விரிவாக்கத்தைத் தவிர்க்கிறது. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
