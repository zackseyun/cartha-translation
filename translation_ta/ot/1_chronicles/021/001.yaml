  text: Then Satan stood up against Israel and incited David to count Israel[a][b].
translation:
  language: ta
  text: பின்பு சாத்தான்[a] இஸ்ரவேலுக்கு எதிராக நின்று, இஸ்ரவேலை எண்ணும்படி தாவீதைத் தூண்டினான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஓர் எதிரி.” எபிரெய மொழியிலுள்ள சாத்தான் என்ற சொல் “எதிரி” என்று பொருள்படலாம்; அல்லது “சாத்தான்” என்ற தனிப்பட்ட பெயராகவோ பட்டமாகவோ பயன்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: 2 சாமுவேல் 24:1, இஸ்ரவேலுக்கு எதிரான கர்த்தரின் கோபமே தாவீதைத் தூண்டியதாகக் கூறுகிறது. நாளாகமம் சாத்தானை உடனடியாகத் தூண்டியவனாகக் காட்டுகிறது; இவ்விரு விவரங்களுக்கிடையிலுள்ள இறையியல் பதற்றத்தைத் தீர்க்காமல் காக்கிறது.
    reason: cross_reference
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: எழுந்து நின்று
  rationale: עמד என்பதன் அடிப்படைப் பொருளான ‘நில்/நிலைஎடு’ என்பதையும், இச்சூழலில் பகைமையுடன் செயல்படத் தொடங்கியதையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: שָׂטָן
  choice: சாத்தான்
  rationale: கட்டுரைச் சுட்டியின்றி வரும் இச்சொல் இங்கு தனிப்பட்ட எதிராளியைக் குறிக்கும் பெயர்/பட்டமாகப் புரிந்துகொள்ளப்படுவது பொருத்தமானது; ‘ஓர் எதிரி’ என்ற உண்மையான சொற்பொருள் மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: עַל יִשְׂרָאֵל
  choice: இஸ்ரவேலுக்கு எதிராக
  rationale: பகைமை சார்ந்த வினையுடன் வரும் עַל என்பதற்கு ‘எதிராக’ என்பது சூழலுக்கேற்ற தெளிவான தமிழ்.
- source_word: וַיָּסֶת
  choice: தூண்டினான்
  rationale: סות என்பதன் ஹிஃபில் வடிவம் ஒருவரை ஒரு செயலைச் செய்யத் தூண்டுதல் அல்லது ஏவுதல் என்று பொருள்படும்; ‘தூண்டினான்’ காரணத் தூண்டுதலைக் காட்டுகிறது, கட்டாயப்படுத்தியதாக மிகைப்படுத்தாது.
- source_word: לִמְנוֹת
  choice: எண்ணும்படி
  rationale: מנה என்பதன் நேரடியான பொருள் ‘எண்ணுதல்’; ‘மக்கள்தொகைக் கணக்கெடுக்க’ என்பது சூழலுக்கு ஏற்றதாக இருந்தாலும் மூலத்தைவிட விளக்கமான விரிவாக்கமாகும்.
- source_word: אֶת יִשְׂרָאֵל
  choice: இஸ்ரவேலை
  rationale: மூலத்தில் நேரடிப் பொருள் ‘இஸ்ரவேல்’ மட்டுமே; ‘இஸ்ரவேல் மக்களை’ என்று விரிவுபடுத்தாமல் அதன் சுருக்கத்தைப் பேணுகிறது.
