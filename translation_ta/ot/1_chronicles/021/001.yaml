- issue: שָׂטָן என்பவரின் அடையாளமும் பொருளும்
  choice: தனிப்பட்ட எதிராளியைக் குறிக்கும் ‘சாத்தான்’
  alternative: ‘ஓர் எதிரி’ அல்லது ‘குற்றஞ்சாட்டுபவன்’
  rationale: எபிரெயச் சொல் பொதுவாக ஓர் எதிரியையும் குறிக்கலாம்; ஆனால் இச்சூழலில் தனிப்பட்ட ஒருவரான சாத்தானைக் குறிக்கும் வாசிப்பு மிகப் பொருத்தமானது. இருப்பினும் சொற்பொருள் இருபொருள்தன்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
