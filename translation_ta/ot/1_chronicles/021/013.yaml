revisions:
- from: அப்போது தாவீது காதிடம், “நான் மிகுந்த நெருக்கடியில் இருக்கிறேன். தயவுசெய்து, நான் யாவேவின் கையில் விழட்டும்; ஏனெனில் அவருடைய இரக்கம் மிகப் பெரிது. ஆனால் மனிதனின் கையில்[a] நான் விழ வேண்டாம்” என்றான்.
  to: அப்போது தாவீது காத்திடம், “நான் மிகுந்த நெருக்கடியில் இருக்கிறேன். தயவுசெய்து, நான் யாவேவின் கையில் விழட்டும்; ஏனெனில் அவருடைய இரக்கம் மிகப் பெரிது. ஆனால் மனிதனின் கையில் நான் விழாதிருப்பேனாக” என்றான்.
  rationale: The revision corrects the transparent Tamil form of Gad's name and improves the two volitional clauses without changing their meaning. It retains the source's singular hand imagery, the contrast between Yahweh and humanity, and the intensity of divine compassion. The footnote remains anchored to 'மனிதனின் கையில்' and preserves the legitimate plural alternative.
