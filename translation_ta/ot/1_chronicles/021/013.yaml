id: 1CH.21.13
reference: 1 Chronicles 21:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר דָּוִ֛יד אֶל גָּ֖ד צַר לִ֣/י מְאֹ֑ד אֶפְּלָה נָּ֣א בְ/יַד יְהוָ֗ה כִּֽי רַבִּ֤ים רַחֲמָי/ו֙ מְאֹ֔ד וּ/בְ/יַד אָדָ֖ם אַל אֶפֹּֽל־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/013.yaml
  text: Then David said to Gad[a], “I am in great distress. Please let me fall into the hand of Yahweh, for his mercies are very great; but do not let me fall into the hand of man.”
translation:
  language: ta
  text: அப்போது தாவீது காத்திடம், “நான் மிகுந்த நெருக்கடியில் இருக்கிறேன். தயவுசெய்து, நான் யாவேவின் கையில் விழட்டும்; ஏனெனில் அவருடைய இரக்கம் மிகப் பெரிது. ஆனால் மனிதனின் கையில் நான் விழாதிருப்பேனாக” என்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צַר לִי מְאֹד
  choice: நான் மிகுந்த நெருக்கடியில் இருக்கிறேன்
  rationale: இந்த எபிரெய மொழிமரபு கடுமையான மனவேதனையையும் இக்கட்டான சூழ்நிலையையும் குறிக்கிறது. இத்தமிழாக்கம் அதன் தீவிரத்தையும் இயல்பான நவீன நடையையும் காக்கிறது.
- source_word: אֶפְּלָה נָּא
  choice: தயவுசெய்து, நான் ... விழட்டும்
  rationale: விருப்பவினையும் נָא துகளும் சேர்ந்து அவசரமான, பணிவான வேண்டுகோளை வெளிப்படுத்துகின்றன; ‘தயவுசெய்து’ மற்றும் ‘விழட்டும்’ இவ்விரு நுணுக்கங்களையும் தருகின்றன.
- source_word: בְיַד יְהוָה
  choice: யாவேவின் கையில்
  rationale: ‘கையில்’ என்பது ஒருவருடைய அதிகாரத்திற்கோ தீர்ப்பிற்கோ ஒப்படைக்கப்படுவதைக் குறிக்கும் எபிரெய உருவகத்தைத் தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: மூலத்தில் நேரடியாக வரும் இறை பெயரைப் பட்டப்பெயராக மாற்றாமல், தமிழில் அதன் பரவலான ஒலிபெயர்ப்பு வடிவத்தில் தருகிறது.
- source_word: כִּי רַבִּים רַחֲמָיו מְאֹד
  choice: ஏனெனில் அவருடைய இரக்கம் மிகப் பெரிது
  rationale: רַחֲמִים வடிவத்தில் பன்மையாக இருந்தாலும், தமிழில் ‘இரக்கம்’ இயல்பாகத் திரள்பொருள் ஒருமையாகப் பயன்படுகிறது. ‘மிகப் பெரிது’ என்பது רַבִּים மற்றும் מְאֹד ஆகியவற்றின் தீவிரத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וּבְיַד אָדָם
  choice: ஆனால் மனிதனின் கையில்
  rationale: இறைவனுடைய கைக்கும் மனித அதிகாரத்திற்கும் இடையிலான எதிர்மறை ஒப்புமையைத் தக்கவைக்க, ஒருமை ‘கை’ உருவகமும் பிரதிநிதித்துவ ஒருமையான ‘மனிதன்’ என்பதும் பாதுகாக்கப்பட்டுள்ளன.
- source_word: אַל אֶפֹּל
  choice: நான் விழ வேண்டாம்
  rationale: இது விரும்பாத முடிவு நிகழக்கூடாது என்ற தாவீதின் வேண்டுதலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறை பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூல எபிரெய உரையில் நான்கெழுத்து இறை பெயர் நேரடியாக உள்ளது. அதை பொதுப் பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்ப்பது உடன்படிக்கைப் பெயரின் தனித்தன்மையைப் பாதுகாக்கிறது.
- issue: யாவேவின் கை மற்றும் மனிதனின் கை என்ற எதிரிணை
  choice: இரு இடங்களிலும் ‘கையில்’ என்ற ஒருமை உருவகத்தைத் தக்கவைத்தல்
  alternative: யாவேவின் அதிகாரத்தில்; மனிதர்களின் கைகளில்
  rationale: மூலத்தின் இலக்கிய இணைப்பையும், இறைத் தீர்ப்புக்கும் மனித அதிகாரத்துக்கும் இடையிலான பதற்றத்தையும் இத்தேர்வு பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய ‘கை’ உருவகம் இரு கூறுகளிலும் தக்கவைக்கப்பட்டுள்ளது; இரக்கத்தைக் குறிக்கும் எபிரெயப் பன்மை, இயல்பான தமிழுக்காகத் திரள்பொருள் ஒருமையாக மொழிபெயர்க்கப்பட்டுள்ளது.
