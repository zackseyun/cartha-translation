base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/019.yaml
  text: And the Spirit clothed Amasai, chief of the Thirty, and he said, “Yours are we, David, and with you, son of Jesse! Peace, peace to you, and peace to your helpers, for your God helps you.” Then David received them and made them chiefs of the troops.
translation:
  language: ta
  text: 'அப்போது ஆவி அமாசாயை ஆடையாக அணிந்துகொண்டது[a]. முப்பதினரின் தலைவராகிய அவர்,


    “தாவீதே, நாங்கள் உம்முடையவர்கள்;


    ஈசாயின் மகனே, நாங்கள் உம்மோடு இருக்கிறோம்!


    உமக்குச் சமாதானம், சமாதானம்;


    உமக்கு உதவுகிறவர்களுக்கும்[b] சமாதானம்!


    ஏனெனில், உமது கடவுள் உமக்கு உதவுகிறார்[c]”


    என்றார். பின்பு தாவீது அவர்களை ஏற்றுக்கொண்டு, படைக்குழுவின் தலைவர்களாக நியமித்தார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஆவி அமாசாயை ஆடையாக அணிந்துகொண்டது’ என்பது எபிரெய மொழியின் நேரடியான உருவகம். இதை ‘கடவுளின் ஆவி அமாசாயின்மேல் வந்தது’ அல்லது ‘ஓர் ஆவி அமாசாயின்மேல் வந்தது’ என்றும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
  - marker: b
    text: அல்லது ‘உமக்கு உதவுகிறவருக்கும்.’ எபிரெய மொழியில் இச்சொல் ஒருமையில் உள்ளது; அது ஒரு குழுவைக் கூட்டாகக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது ‘உமது கடவுள் உமக்கு உதவியிருக்கிறார்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרוּחַ לָבְשָׁה
  choice: ஆவி ... ஆடையாக அணிந்துகொண்டது
  rationale: רוּחַ என்பதையும் לָבַשׁ என்பதன் ‘ஆடையாக அணிதல்’ என்ற உயிருள்ள எபிரெய உருவகத்தையும் பாதுகாக்கிறது. மூலத்தில் definite article இல்லாததால், முதன்மை உரையில் ‘கடவுளின் ஆவி’ என்று வெளிப்படையாகச் சேர்க்காமல், தெய்வீக ஆவியைக் குறிக்கும் சாத்தியத்தை அடிக்குறிப்பில் தெரிவிக்கிறது.
- source_word: אֶת עֲמָשַׂי
  choice: அமாசாயை
  rationale: நேரடி வேற்றுமை உருபுடன் வரும் ஆள்பெயரை நவீனத் தமிழ் ஒலிபெயர்ப்பு முறையில் தருகிறது.
- source_word: רֹאשׁ הַשְּׁלֹשִׁים
  choice: முப்பதுபேரின் தலைவர்
  rationale: רֹאשׁ என்பதன் தலைவர் என்ற பொருளையும், அறியப்பட்ட ‘முப்பது பேர்’ படைக்குழுவைக் குறிக்கும் எண்ணையும் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: לְךָ דָוִיד
  choice: தாவீதே, நாங்கள் உம்முடையவர்கள்
  rationale: எபிரெய மொழியின் சுருக்கமான விசுவாச உறுதிமொழியைத் தமிழில் இயல்பாகவும் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: וְעִמְּךָ בֶן יִשַׁי
  choice: ஈசாயின் மகனே, நாங்கள் உம்மோடு இருக்கிறோம்
  rationale: வினைச்சொல் இல்லாத எபிரெய சொற்றொடரின் பொருளைத் தமிழுக்குத் தேவையான வினையுடன் வழங்கி, முந்தைய வரியின் இணைப்பையும் காக்கிறது.
- source_word: שָׁלוֹם שָׁלוֹם לְךָ
  choice: உமக்குச் சமாதானம், சமாதானம்
  rationale: שָׁלוֹם என்ற சொல்லின் வலியுறுத்தும் மறுபடியுரைத்தலைச் சுருக்காமல் பாதுகாக்கிறது.
- source_word: וְשָׁלוֹם לְעֹזְרֶךָ
  choice: உமக்கு உதவுகிறவர்களுக்கும் சமாதானம்
  rationale: ஒருமையில் உள்ள participle-ஐ சூழலுக்கு ஏற்ப கூட்டுப்பொருளில் வழங்குகிறது; அடுத்து தாவீது பலரை ஏற்றுக்கொள்வதும் இதற்கு ஆதரவாக உள்ளது.
- source_word: כִּי עֲזָרְךָ אֱלֹהֶיךָ
  choice: ஏனெனில், உமது கடவுள் உமக்கு உதவுகிறார்
  rationale: qatal வடிவத்தைச் சூழலில் தொடரும் அல்லது பொதுவான ஆதரவாகப் புரிந்து நிகழ்காலத்தில் தருகிறது; நிறைவுற்ற உதவி என்ற வாசிப்பை அடிக்குறிப்பில் பாதுகாக்கிறது.
- source_word: וַיְקַבְּלֵם
  choice: அவர்களை ஏற்றுக்கொண்டு
  rationale: קבל என்பதன் ‘பெற்றுக்கொள்/ஏற்றுக்கொள்’ பொருளில், இங்கு விசுவாசத்தைத் தெரிவித்து வந்தவர்களை ஏற்றுக்கொண்டார் என்ற சூழலுக்கு இயல்பான தமிழைத் தேர்ந்தெடுக்கிறது.
- source_word: וַיִּתְּנֵם בְּרָאשֵׁי הַגְּדוּד
  choice: படைப்பிரிவுகளின் தலைவர்களாக நியமித்தார்
  rationale: ‘தலைவர்களுக்குள் வைத்தார்’ என்ற எபிரெய மரபுத்தொடரின் நியமனப் பொருளைத் தெளிவாக்குகிறது; גְּדוּד என்பதன் படை/படைக்குழு பொருளை இயல்பான இராணுவத் தமிழில் தருகிறது.
theological_decisions:
- issue: רוּחַ என்பது கடவுளின் ஆவியையா, ஓர் ஆவியையா, அல்லது ஆவிக்குரிய உந்துதலையா குறிக்கிறது?
  choice: முதன்மை உரையில் ‘ஆவி’ என்று வைத்து, ‘ஆடையாக அணிந்துகொண்டது’ என்ற மூல உருவகத்தைப் பாதுகாத்தல்
  alternative: ‘கடவுளின் ஆவி அமாசாயின்மேல் வந்தார்’ அல்லது ‘ஓர் ஆவி அமாசாயின்மேல் வந்தது’
  rationale: நாளாகமத்தில் தெய்வீக வல்லமையூட்டல் சூழலால் கடவுளின் ஆவி என்பது வலுவான சாத்தியம். எனினும், எபிரெய மொழியில் article அல்லது ‘கடவுளின்’ என்ற வெளிப்படையான அடைமொழி இல்லாததால், தமிழில் ‘ஆவியானவர்’ என்று மட்டும் மொழிபெயர்ப்பது மூலத்தின் இலக்கணத் தெளிவின்மையைத் தீர்த்துவிடும். ஆகவே முதன்மை உரை ‘ஆவி’ எனவும், மாற்று விளக்கங்கள் அடிக்குறிப்பிலும் தரப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. தாவீதிடம் நேரடியாகப் பேசும் இடத்தில் மரியாதை ஒருமையான ‘உமது/உம்மோடு’ வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. கவிதைநடையிலுள்ள உரை வரிகளாகப் பிரிக்கப்பட்டு, மறுபடியுரைத்தல் மற்றும் இணை அமைப்பு பாதுகாக்கப்பட்டுள்ளன.
