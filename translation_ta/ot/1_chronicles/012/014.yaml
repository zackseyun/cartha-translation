  text: Jeremiah the tenth[a], Machbannai the eleventh.
translation:
  language: ta
  text: பத்தாவது எரேமியா; பதினொன்றாவது[a] மக்பன்னாய்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “பதினொன்று”; இந்தப் பட்டியல் சூழலில் அது “பதினொன்றாவது” என்று பொருள்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְמְיָהוּ
  choice: எரேமியா
  rationale: எபிரெய தனிப்பெயரின் தமிழில் நிலைபெற்ற, வாசகர்களுக்கு இயல்பான வடிவம்.
- source_word: הָעֲשִׂירִי
  choice: பத்தாவது
  rationale: உறுப்புப் பெயருடன் வரும் வரிசை எண்ணை, பட்டியல் சூழலுக்கு இயல்பான தமிழ் வரிசை எண்ணாக மொழிபெயர்க்கிறது.
- source_word: מַכְבַּנַּי
  choice: மக்பன்னாய்
  rationale: எபிரெய மெய்யொலிகளைத் தமிழில் இயன்றவரை தெளிவாகப் பிரதிபலிக்கும் தனிப்பெயர் ஒலிபெயர்ப்பு.
- source_word: עַשְׁתֵּי עָשָׂר
  choice: பதினொன்றாவது
  rationale: மூலத்தில் 'பதினொன்று' என்னும் எண்ணிக்கை வடிவம் இருந்தாலும், முந்தைய வரிசை எண்ணுக்கு இணையாகப் பட்டியலின் பதினொன்றாம் இடத்தைக் குறிக்கிறது; தமிழில் வரிசை எண் இயல்பானது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில் சுருக்கமான பட்டியல் நடையைப் பின்பற்றுகிறது. மூலத்தின் இணையான அமைப்பையும் பெயர்களின் வரிசையையும் காக்கிறது; தேவையற்ற ‘நபர்’ போன்ற சொற்கள் சேர்க்கப்படவில்லை.
