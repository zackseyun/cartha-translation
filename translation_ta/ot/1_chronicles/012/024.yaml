  text: וְ֠/אֵלֶּה מִסְפְּרֵ֞י רָאשֵׁ֤י הֶֽ/חָלוּץ֙ לַ/צָּבָ֔א בָּ֥אוּ עַל דָּוִ֖יד חֶבְר֑וֹנָ/ה לְ/הָסֵ֞ב מַלְכ֥וּת שָׁא֛וּל אֵלָ֖י/ו כְּ/פִ֥י יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/024.yaml
  text: And these are the numbers of the heads of the armed troops for war[a], who came to David at Hebron to turn Saul’s kingdom over to him, according to the word of Yahweh.
translation:
  language: ta
  text: 'போருக்காக ஆயுதமேந்திய படையினரின் தலைவர்களின் எண்ணிக்கைகள் இவை: அவர்கள் சவுலின் அரசாட்சியைத் தாவீதிடம் மாற்றுவதற்காக, யாவேயின் வார்த்தையின்படி, எப்ரோனில் இருந்த தாவீதிடம் வந்தார்கள்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִסְפְּרֵי רָאשֵׁי
  choice: தலைவர்களுடைய எண்ணிக்கைகள்
  rationale: பன்மை இணைநிலை அமைப்பைத் தெளிவாகப் பிரதிபலிக்கிறது. அடுத்து வரும் பட்டியலை அறிமுகப்படுத்தும் சொற்றொடராகவும் இயல்பாக அமைகிறது; ‘தலைகளின் எண்ணிக்கை’ என்ற மிகச் சொற்பொருள் மொழிபெயர்ப்பு தமிழில் தவறாகப் புரியக்கூடும்.
- source_word: הֶחָלוּץ לַצָּבָא
  choice: போருக்காக ஆயுதம் ஏந்திய படைப்பிரிவுகள்
  rationale: הֶחָלוּץ என்பது போருக்காக ஆயுதமணிந்து அல்லது ஆயத்தமாக அணிவகுத்தவர்களைக் குறிக்கும் கூட்டுப்பெயர். ‘படைப்பிரிவுகள்’ அதன் கூட்டான இராணுவப் பொருளையும், ‘ஆயுதம் ஏந்திய’ அதன் ஆயத்த நிலையையும் வெளிப்படுத்துகிறது.
- source_word: בָּאוּ עַל דָּוִיד
  choice: தாவீதிடம் வந்தார்கள்
  rationale: இச்சூழலில் עַל பகைமையைக் குறிக்காமல் தாவீதை நோக்கி வந்து அவரோடு சேர்ந்ததைக் குறிக்கிறது. கூடுதல் விளக்கத்தைப் புகுத்தாமல் ‘தாவீதிடம்’ என்பது அந்தத் திசைநோக்கிய பொருளை இயல்பாகத் தருகிறது.
- source_word: חֶבְרוֹנָה
  choice: எப்ரோனிலிருந்த
  rationale: திசையைக் குறிக்கும் இறுதி ה, எப்ரோனை நோக்கிய வருகையைச் சுட்டுகிறது. தமிழ் வாக்கியத்தில் ‘எப்ரோனிலிருந்த தாவீதிடம் வந்தார்கள்’ என்பது வருகையின் இலக்கையும் தாவீதின் இருப்பிடத்தையும் இயல்பாக இணைக்கிறது.
- source_word: לְהָסֵב מַלְכוּת שָׁאוּל אֵלָיו
  choice: சவுலின் அரசாட்சியைத் தாவீதிடம் மாற்றுவதற்காக
  rationale: הסב என்ற காரணவினை அரசாட்சி ஒருவரிடமிருந்து மற்றவரிடம் திருப்பப்படுதல் அல்லது மாற்றப்படுதலைக் குறிக்கிறது. מַלְכוּת இங்கு நிலப்பரப்பை மட்டும் அல்லாமல் அரசுரிமை அல்லது ஆட்சியையும் குறிக்கக்கூடும் என்பதால் ‘அரசாட்சி’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: כְּפִי יְהוָה
  choice: யாவே கூறியபடி
  rationale: சொல்லுக்கு சொல் ‘யாவேயின் வாயின்படி’ என்ற எபிரெய மொழிவழக்கு, அவர் கூறிய வார்த்தைக்கு ஏற்ப என்பதைக் குறிக்கிறது. தமிழில் ‘கூறியபடி’ என்பது அதனைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் உடன்படிக்கைப் பெயரான நான்கெழுத்துப் பெயர் நேரடியாக உள்ளது. பொதுப்பட்டமான ‘கர்த்தர்’ என்பதற்குப் பதிலாக ‘யாவே’ என்று ஒலிபெயர்ப்பது தனிப்பெயரைத் தக்கவைக்கிறது.
- issue: מַלְכוּת என்பதன் பொருள்
  choice: அரசாட்சி
  alternative: ராஜ்யம்
  rationale: இங்கு சவுலின் நிலப்பரப்பு சார்ந்த ராஜ்யம் மட்டுமல்ல, அவருடைய அரசுரிமையும் ஆட்சியும் தாவீதிடம் மாற்றப்படுவது கருத்தாக உள்ளது. ‘அரசாட்சி’ இந்தப் பொருள் அகலத்தைத் தமிழில் நன்றாகத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான வரலாற்று நடையில் வடிவமைக்கப்பட்டது. இராணுவ மற்றும் அரசியல் சொற்கள் தெளிவாக வைக்கப்பட்டுள்ளன; எபிரெய மொழிவழக்கின் சொற்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
