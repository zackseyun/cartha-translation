  yaml_path: translation/ot/1_chronicles/012/008.yaml
  text: and Joelah and Zebadiah[a], the sons of Jeroham from Gedor.
translation:
  language: ta
  text: யோஏலாவும் செபதியாவும் கெதோரிலிருந்து வந்த யெரோகாமின் மகன்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/יוֹעֵאלָה
  choice: யோவேலாவும்
  rationale: וְ இணைப்பைத் தமிழின் இயல்பான பட்டியல் அமைப்புக்கேற்ப பெயருடன் சேர்ந்த ‘-வும்’ என வழங்கியுள்ளோம். יוֹעֵאלָה என்ற ஆள்பெயர் தமிழில் வாசிக்க இயல்பாக ‘யோவேலா’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וּ/זְבַדְיָה
  choice: செபதியாவும்
  rationale: וּ இணைப்பு ‘-வும்’ என வழங்கப்பட்டுள்ளது. זְבַדְיָה என்ற ஆள்பெயருக்கு தமிழ்க் கிறிஸ்தவப் பயன்பாட்டில் எளிதில் அடையாளம் காணப்படும் ‘செபதியா’ என்ற ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: בְּנֵי என்பது இங்கு நேரடியான தந்தை–மகன் உறவைக் குறிக்கும் இயல்பான பன்மைக் கட்டமைப்பு; ஆகவே ‘மகன்கள்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: יְרֹחָם
  choice: யெரோகாம்
  rationale: எபிரெய ஆள்பெயரின் ஒலியமைப்பைத் தமிழில் தெளிவாகக் காட்டும் ஒலிபெயர்ப்பு.
- source_word: מִן הַ/גְּדֽוֹר
  choice: கெதோரிலிருந்து வந்த
  rationale: מִן தோற்ற இடத்தைச் சுட்டுவதால் ‘-இலிருந்து வந்த’ என இயல்பாக வழங்கப்பட்டுள்ளது. הַגְּדוֹר இங்கு இடப்பெயராகப் புரிந்துகொள்ளப்பட்டு ‘கெதோர்’ என ஒலிபெயர்க்கப்பட்டுள்ளது; எபிரெயச் சுட்டுச் சொல் தமிழில் தனியே வெளிப்படுத்தப்படவில்லை.
