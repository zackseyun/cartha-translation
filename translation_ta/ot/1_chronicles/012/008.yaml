translation_notes:
  register: நவீனத் தரத் தமிழில், வரலாற்றுப் பெயர்ப்பட்டியலுக்கேற்ற சுருக்கமான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் பெயர் வரிசை காக்கப்பட்டு, ‘இவர்கள்’ என்பதன் மூலம் உறவுத் தகவல் தெளிவாக இணைக்கப்பட்டுள்ளது.
