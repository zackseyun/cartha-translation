translation_notes:
  register: நவீனப் பொதுத்தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் அமைக்கப்பட்டது. எபிரெய வசனத்தின் பட்டியல் அறிமுகம், தாவீதின் தெளிவாக வரையறுக்கப்படாத கட்டுப்பட்ட நிலை, மற்றும் போர்வீரர்களின் துணைப் பங்கு ஆகியவை தேவையற்ற விளக்கமின்றிப் பாதுகாக்கப்பட்டுள்ளன.
