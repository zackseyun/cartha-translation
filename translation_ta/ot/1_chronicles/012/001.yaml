base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/001.yaml
  text: These are the men who came to David at Ziklag while he was still kept back because of Saul son of Kish[a]; and they were among the mighty warriors[b], helpers in war.
translation:
  language: ta
  text: சீக்லாகில் தாவீதிடம் வந்தவர்கள் இவர்களே. கீசின் மகன் சவுலின் காரணமாகத் தாவீது இன்னும் தடுத்து வைக்கப்பட்டிருந்தபோது[a], அவர்கள் வலிமைமிக்க போர்வீரர் குழுவைச் சேர்ந்தவர்களாகவும்[b], போரில் துணைநின்றவர்களாகவும் இருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தடுத்து வைக்கப்பட்டிருந்தார்” என்பதற்கு “கட்டுப்படுத்தப்பட்டிருந்தார்” அல்லது “அடைக்கப்பட்டிருந்தார்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “வலிமைமிக்க போர்வீரர் குழு” என்பதற்கு “வீரமிக்கவர்கள்” அல்லது “மாவீரர்கள்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் வீரம் வாய்ந்த போர்வீரர்களையோ வீரநாயகர்களையோ குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: இவர்களே
  rationale: ஒரு புதிய பட்டியலை அறிமுகப்படுத்தும் சுட்டுப்பெயரின் வலியுறுத்தலை இயல்பான தமிழில் தருகிறது; எபிரெயத்தில் காலத்தைக் குறிக்கும் தனிப்பட்ட ‘இப்போது’ இல்லாததால் அதைச் சேர்க்கவில்லை.
- source_word: הַבָּאִים אֶל דָּוִיד לְצִיקְלַג
  choice: சீக்லாகில் தாவீதிடம் வந்தவர்கள்
  rationale: பங்கேற்புவினை வடிவத்தை தமிழில் இயல்பான பெயரெச்சத் தொடராகத் தருகிறது. לְצִיקְלַג இங்கு தாவீது இருந்த இடத்தைக் குறிப்பதால் ‘சீக்லாகில்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: עוֹד עָצוּר
  choice: இன்னும் தடுத்து வைக்கப்பட்டிருந்தார்
  rationale: தொடர்ந்துகொண்டிருந்த கட்டுப்பட்ட நிலையை வெளிப்படுத்துகிறது; சிறையில் அடைக்கப்பட்டிருந்தார் என்று தேவையின்றி மிகத் துல்லியப்படுத்தவில்லை.
- source_word: מִפְּנֵי שָׁאוּל בֶּן קִישׁ
  choice: கீசின் மகன் சவுலின் காரணமாக
  rationale: சவுலால் ஏற்பட்ட கட்டுப்பாட்டைக் காரணத் தொடர்புடன் தெளிவாகக் கூறுகிறது; ‘சவுலுக்குப் பயந்து’ என்று மூலத்தில் இல்லாத மனநிலையைச் சேர்க்கவில்லை.
- source_word: בַּגִּבּוֹרִים
  choice: வலிமைமிக்க வீரர்களில் சிலராக
  rationale: גִּבּוֹרִים என்பதன் வீரம் மற்றும் போர்சார் பொருளை நவீனத் தமிழில் தெளிவாகக் கொண்டுவருகிறது. בְּ முன்னொட்டின் ‘அவர்களுள்/அவர்களில்’ என்ற பொருளை ‘சிலராக’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עֹזְרֵי הַמִּלְחָמָה
  choice: போரில் துணைநின்றவர்களாக
  rationale: அவர்களுடைய போர்சார் உதவிப் பங்கைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
