  text: 'From the sons of Simeon, mighty men of valor for the army: 7,100.'
translation:
  language: ta
  text: 'சிமியோன் சந்ததியாரில், படைக்குரிய வலிமைமிக்க வீரர்கள்: 7,100 பேர்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִן בְּנֵי שִׁמְעוֹן
  choice: சிமியோனின் மக்களிலிருந்து
  rationale: எபிரெய மொழியின் ‘சிமியோனின் மகன்களிலிருந்து’ என்ற குலவழிப் பயன்பாட்டை, நவீன தமிழில் இயல்பாகவும் சிமியோன் கோத்திரத்தைத் தெளிவாகவும் குறிக்கும் வகையில் வழங்குகிறது.
- source_word: גִּבּוֹרֵי חַיִל
  choice: வலிமைமிக்க வீரர்கள்
  rationale: போர்திறன், வலிமை, துணிவு ஆகியவற்றை உள்ளடக்கும் எபிரெய மரபுத்தொடரின் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: לַצָּבָא
  choice: படைக்குத் தகுதியான
  rationale: இங்கு לְ என்பது இந்த ஆட்கள் படைச் சேவைக்குரியவர்கள் அல்லது அதற்குத் தயாரானவர்கள் என்பதைக் குறிக்கிறது; பட்டியல் சூழலில் ‘படைக்குத் தகுதியான’ என்பது தமிழில் தெளிவாக உள்ளது.
- source_word: שִׁבְעַת אֲלָפִים וּמֵאָה
  choice: 7,100 பேர்
  rationale: மூலத்தின் சரியான எண்ணிக்கையை நவீன எண் வடிவில் தருகிறது; மனிதர்களின் எண்ணிக்கை என்பதை ‘பேர்’ தெளிவுபடுத்துகிறது.
