translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘காலங்கள்’ என்ற மூலத்தின் விரிவான பொருள் காக்கப்பட்டு, ‘பகுத்தறிந்து’ மூலம் சூழ்நிலைக்கேற்ற விவேகம் வெளிப்படுத்தப்பட்டுள்ளது. இறுதி எபிரெய வழக்கை முழுமையாக இராணுவச் சொல்லான ‘கட்டளை’ எனச் சுருக்காமல், ‘சொல்லின்படி நடந்தார்கள்’ என மொழிபெயர்த்து அதன் வழிகாட்டல்/அதிகார இருபொருள் சாத்தியமும் பாதுகாக்கப்பட்டுள்ளது.
