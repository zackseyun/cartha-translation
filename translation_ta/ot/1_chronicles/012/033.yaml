base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/033.yaml
  text: 'From the sons of Issachar[a], men who understood the times, to know what Israel should do: their chiefs were two hundred[b], and all their brothers were under their command.'
translation:
  language: ta
  text: இசக்காரின் மக்களிலிருந்து, காலங்களைப் பற்றிய பகுத்தறிவு உடையவர்களாய், இஸ்ரவேல் என்ன செய்ய வேண்டும் என்பதை அறிந்தவர்கள் இருந்தார்கள்[a]. அவர்களுடைய தலைவர்கள் இருநூறு பேர்; அவர்களுடைய சகோதரர்கள் அனைவரும் அவர்களுடைய சொல்லின்படி நடந்தார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘காலங்களைப் பற்றிய பகுத்தறிவு உடையவர்கள்’ என்றும் மொழிபெயர்க்கலாம்; அந்த வரலாற்றுத் தருணத்துக்கு ஏற்ற விவேகத்தை எபிரெயச் சொற்றொடர் வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்கு சொல், ‘அவர்களுடைய வாயின்படி’; அதாவது, அவர்களுடைய வழிகாட்டலுக்கோ கட்டளைக்கோ உட்பட்டு நடந்தார்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבְּנֵי יִשָּׂשכָר
  choice: இசக்காரின் மக்களில்
  rationale: מִן உடன் வரும் בְּנֵי என்பது பட்டியலில் இசக்கார் கோத்திரத்திலிருந்து வந்தவர்களைக் குறிக்கிறது. தமிழில் இயல்பாகவும் கோத்திரத் தொடர்பைத் தெளிவாகவும் காட்டுகிறது.
- source_word: יוֹדְעֵי בִינָה לָעִתִּים
  choice: காலங்களைப் பகுத்தறிந்து
  rationale: בִינָה என்பது வெறும் தகவலறிவை அல்ல, சூழ்நிலையை உணர்ந்து மதிப்பிடும் பகுத்தறிவைக் குறிக்கிறது; לָעִתִּים வரலாற்றுத் தருணங்களையோ காலச்சூழல்களையோ குறிக்கலாம். இத்தொடர் இரண்டையும் இயல்பான தமிழில் இணைக்கிறது.
- source_word: לָדַעַת מַה יַעֲשֶׂה יִשְׂרָאֵל
  choice: இஸ்ரவேல் என்ன செய்ய வேண்டும் என்பதை அறிந்தவர்கள்
  rationale: לָדַעַת நோக்கம் அல்லது விளைவைச் சுட்டுகிறது. יַעֲשֶׂה இச்சூழலில் ஏற்ற செயல் என்ன என்பதைக் குறிக்கிறது; ஆகவே ‘செய்ய வேண்டும்’ என்பது முன்னறிவிப்பாக மாற்றாமல் நடைமுறை வழிகாட்டுதலை வெளிப்படுத்துகிறது.
- source_word: רָאשֵׁיהֶם מָאתַיִם
  choice: அவர்களுடைய தலைவர்கள் இருநூறு பேர்
  rationale: רָאשֵׁיהֶם இங்கு உடல் உறுப்பான ‘தலைகள்’ அல்ல, தலைமை வகிப்பவர்களைக் குறிக்கிறது. ‘தலைவர்கள்’ நவீனத் தமிழில் தெளிவானதும் கண்ணியமானதும் ஆகும்.
- source_word: וְכָל אֲחֵיהֶם
  choice: அவர்களுடைய சகோதரர்கள் அனைவரும்
  rationale: אֲחֵיהֶם என்பதன் நேரடிப் பொருள் ‘அவர்களுடைய சகோதரர்கள்’; இங்கு அது சககோத்திரத்தாரை விரிவாகக் குறிக்கக்கூடும். மூலத்தின் உறவுசார் சொல்லாட்சியைப் பாதுகாக்க ‘சகோதரர்கள்’ வைக்கப்பட்டுள்ளது.
- source_word: עַל־פִּיהֶם
  choice: அவர்களுடைய சொல்லின்படி நடந்தார்கள்
  rationale: சொல்லுக்கு சொல் ‘அவர்களுடைய வாயின்படி’ என்ற எபிரெய வழக்கு, அவர்களுடைய வழிகாட்டல் அல்லது கட்டளைக்குக் கீழ்ப்படிவதைக் குறிக்கிறது. ‘சொல்லின்படி நடந்தார்கள்’ அதிகாரப் பொருளையும் மூல உருவகத்தின் சுவடையும் இயல்பான தமிழில் காக்கிறது.
