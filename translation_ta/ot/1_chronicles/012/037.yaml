translation_notes:
  register: நவீனத் தரத்தமிழில், பட்டியல் நடைக்கு ஏற்ற சுருக்கமும் கண்ணியமும் பேணப்பட்டுள்ளன. ‘அணிவகுத்து’ என்பது ערך என்ற இராணுவச் சொல்லின் கருத்தைத் தெளிவாகத் தருகிறது; எபிரெயத் தொடரின் இரு கூறுகளையும் ஒரே கருத்தாகச் சுருக்கிவிடாமல் அடிக்குறிப்பு பாதுகாக்கிறது.
