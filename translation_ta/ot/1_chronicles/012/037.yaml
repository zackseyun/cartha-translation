base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/037.yaml
  text: And from Asher[a], forty thousand who went out for military service, to array themselves for battle.
translation:
  language: ta
  text: ஆசேரிலிருந்தும், போர்ப்பணிக்குப் புறப்பட்டு, போருக்காக அணிவகுக்கும் நாற்பதாயிரம் பேர்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “போர்ப்பணிக்குப் புறப்பட்டு, போருக்காக அணிவகுக்க வந்த நாற்பதாயிரம் பேர்.” எபிரெய உரை ‘போர்ப்பணிக்குப் புறப்படுதல்’ என்பதையும் ‘போருக்காக அணிவகுத்தல்’ என்பதையும் இணைக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מֵ/אָשֵׁר
  choice: ஆசேரிலிருந்து
  rationale: இணைப்பிடைச்சொல்லும் முன்னிடைச்சொல்லும் சேர்ந்த தொடரைத் தமிழில் இயல்பாகப் பெயருடன் ‘-இலிருந்து’ என வழங்குகிறது; ஆசேர் என்பது கோத்திரப் பெயர்.
- source_word: יוֹצְאֵי צָבָא
  choice: போர்ப்பணிக்குப் புறப்பட்டு
  rationale: יצא என்பதன் புறப்படுதல் என்ற பொருளையும் צבא என்பதன் ஒழுங்கமைந்த படை அல்லது போர்ப்பணி என்ற சூழல்சார் பொருளையும் இணைத்துப் பாதுகாக்கிறது.
- source_word: לַ/עֲרֹךְ מִלְחָמָה
  choice: அணிவகுத்துப் போரிடக்கூடியவர்கள்
  rationale: ערך என்பதன் போருக்காக ஒழுங்காக அணிவகுத்தல் என்ற இராணுவப் பொருளையும் מלחמה என்பதன் போர் என்ற பொருளையும் இயல்பான தமிழில் தருகிறது. ‘கூடியவர்கள்’ என்பது பட்டியலின் படைத்தகுதி சார்ந்த சூழலைத் தெளிவாக்குகிறது.
- source_word: אַרְבָּעִים אָלֶף
  choice: நாற்பதாயிரம் பேர்
  rationale: எண்ணிக்கையை நேரடியாக வழங்கி, மனிதர்களைக் குறிக்கும் இயல்பான தமிழ் எண்ணுப்பின்னொட்டான ‘பேர்’ என்பதைச் சேர்க்கிறது.
