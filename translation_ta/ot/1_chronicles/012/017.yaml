  text: וַ/יָּבֹ֗אוּ מִן בְּנֵ֤י בִנְיָמִן֙ וִֽ/יהוּדָ֔ה עַד לַ/מְצָ֖ד לְ/דָוִֽיד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/017.yaml
  text: And some of the sons of Benjamin and Judah came to the stronghold[b][a], to David.
translation:
  language: ta
  text: பென்யமீன் மற்றும் யூதா கோத்திரத்தாரில் சிலர், தாவீதிடம் இருந்த அரணுக்கு[a] வந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கோட்டைக்கு.’ எபிரெயச் சொல் பாதுகாப்புக்காக அமைக்கப்பட்ட அரணான புகலிடத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: வந்தார்கள்
  rationale: בוא என்பதன் தொடர்கதை வடிவம் நிகழ்வை முன்னெடுக்கிறது; தாவீது இருந்த இடத்தை நோக்கிய இயக்கத்திற்கு ‘வந்தார்கள்’ இயல்பானது.
- source_word: מִן
  choice: கோத்திரத்தாரில் சிலர்
  rationale: מִן இங்கு பகுதியைக் குறிக்கிறது; இரு கோத்திரங்களின் அனைவரும் அல்ல, அவர்களுள் சிலர் வந்தார்கள் என்பதைத் தெளிவாக்குகிறது.
- source_word: בְּנֵי בִנְיָמִן וִיהוּדָה
  choice: பென்யமீன், யூதா கோத்திரத்தார்
  rationale: எபிரெய உரையில் ‘பென்யமீனின் மகன்கள்’ என்பதோடு ‘யூதா’ சுருக்கமாக இணைக்கப்பட்டுள்ளது. நவீன தமிழில் இரு கோத்திர மக்களையும் இயல்பாகக் குறிக்க ‘கோத்திரத்தார்’ பயன்படுத்தப்படுகிறது.
- source_word: עַד
  choice: அரணுக்குள்
  rationale: இயக்கத்தின் இலக்கை עַד குறிக்கிறது. தமிழில் ‘வந்தார்கள்’ என்பதுடன் இலக்கிடத்தைக் குறிக்க ‘-க்குள்’ இயல்பாக அமைகிறது.
- source_word: הַמְצָד
  choice: அரண்
  rationale: מְצָד என்பது பாதுகாப்புக்கான அரணமைந்த புகலிடத்தைக் குறிக்கிறது; ‘அரண்’ சுருக்கமாகவும் சூழலுக்கு ஏற்றதாகவும் உள்ளது.
- source_word: לְדָוִיד
  choice: தாவீதிடம்
  rationale: לְ இங்கு இலக்கிடத்தில் இருந்த தாவீதுடனான தொடர்பைக் குறிக்கிறது; ‘தாவீதிடம்’ என்பது இயல்பான தமிழ்.
theological_decisions: []
translation_notes:
  register: நவீன தரத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. பகுதியைக் குறிக்கும் מִן வெளிப்படையாக ‘சிலர்’ என மொழிபெயர்க்கப்பட்டுள்ளது; எபிரெயின் சுருக்கமான இனக்குழுக் கட்டமைப்பு இயல்பான தமிழுக்காக ‘கோத்திரத்தார்’ என விரிக்கப்பட்டுள்ளது.
