  terminology: வில்லேந்தியவர்கள், வலது கையையும் இடது கையையும் பயன்படுத்த வல்லவர்கள், and பென்யமீன் கோத்திரத்தார் are suitable. The footnote correctly preserves the wider semantic range of 'brothers.'
