  text: נֹ֣שְׁקֵי קֶ֗שֶׁת מַיְמִינִ֤ים וּ/מַשְׂמִאלִים֙ בָּֽ/אֲבָנִ֔ים וּ/בַ/חִצִּ֖ים בַּ/קָּ֑שֶׁת מֵ/אֲחֵ֥י שָׁא֖וּל מִ/בִּנְיָמִֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/002.yaml
  text: They were archers[a], able to use both the right hand and the left in hurling stones and shooting arrows with the bow; they were from Saul’s brothers, from Benjamin.
translation:
  language: ta
  text: அவர்கள் வில்லேந்தியவர்கள்; கற்களை எறிவதிலும் வில்லால் அம்பு எய்வதிலும் வலது கையையும் இடது கையையும் பயன்படுத்த வல்லவர்கள். அவர்கள் சவுலின் சகோதரர்களாகிய[a] பென்யமீன் கோத்திரத்தாரைச் சேர்ந்தவர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சவுலின் உறவினர்கள்.” இங்குள்ள “சகோதரர்கள்” என்ற எபிரெயச் சொல் உடன்பிறந்தவர்களை மட்டுமல்லாமல், விரிந்த குடும்பம், குலம் அல்லது கோத்திரத்தைச் சேர்ந்தவர்களையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹשְׁקֵי קֶשֶׁת
  choice: வில்லேந்தியவர்கள்
  rationale: எபிரெயப் பங்கேற்புவினை வடிவம் வில்லை ஆயுதமாக ஏந்திய அல்லது பயன்படுத்தியவர்களைக் குறிக்கிறது. ‘வில்லேந்தியவர்கள்’ என்பது மூலத்தின் ஆயுதம் தாங்கியிருக்கும் கருத்தையும் இயல்பான தமிழையும் காக்கிறது.
- source_word: מַיְמִינִים וּמַשְׂמִאלִים
  choice: வலக்கை, இடக்கை இரண்டையும் பயன்படுத்த வல்லவர்கள்
  rationale: இது வெறுமனே இயல்பான கைப்பழக்கத்தை அல்ல, எந்தக் கையாலும் ஆயுதங்களைத் திறமையாகப் பயன்படுத்தும் ஆற்றலைக் குறிக்கிறது.
- source_word: בָּאֲבָנִים
  choice: கற்களை எறிவதிலும்
  rationale: போர்ச் சூழலில் கற்களைப் பயன்படுத்தும் செயல் உட்குறிப்பாக உள்ளது. மூலத்தில் கவண் வெளிப்படையாகக் குறிப்பிடப்படாததால் அதைச் சேர்க்காமல் ‘எறிவது’ என இயல்பாக மொழிபெயர்க்கப்பட்டது.
- source_word: וּבַחִצִּים בַּקָּשֶׁת
  choice: வில்லால் அம்பெய்வதிலும்
  rationale: அம்புகளும் வில்லும் இணைந்து குறிப்பிடப்படுவதன் கருவிசார் பொருளைத் தெளிவான, சுருக்கமான தமிழில் தருகிறது.
- source_word: מֵאֲחֵי שָׁאוּל
  choice: சவுலின் சகோதரர்கள்
  rationale: אָח என்ற சொல்லின் நேரடிப் பொருள் ‘சகோதரர்.’ இங்கு அது விரிந்த உறவினர் அல்லது ஒரே குலம்/கோத்திரத்தைச் சேர்ந்தவர் என்ற பொருளிலும் இருக்கக்கூடும்; அந்த வாய்ப்பு அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: מִבִּנְיָמִן
  choice: பென்யமீன் கோத்திரத்தைச் சேர்ந்த
  rationale: இது அவர்களின் கோத்திரப் பின்னணியைக் குறிக்கிறது. வாசகருக்குத் தெளிவாக இருக்க ‘கோத்திரம்’ வெளிப்படுத்தப்பட்டுள்ளது.
