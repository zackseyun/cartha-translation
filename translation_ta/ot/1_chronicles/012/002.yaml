translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, பொதுவாசகருக்குப் புரியும் நடை பயன்படுத்தப்பட்டது. எபிரெய மூலத்தின் சுருக்கமான படைவீரர் விவரிப்பு இயல்பான தமிழ் வாக்கியங்களாக அமைக்கப்பட்டது; மூலத்தில் வெளிப்படையாக இல்லாத ‘கவண்’ சேர்க்கப்படவில்லை.
