translation_notes:
  register: நவீன நிலையான தமிழில், பட்டியல் நடைக்கு ஏற்ற சுருக்கமான மற்றும் கண்ணியமான மொழிநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் கோத்திர அடையாளம், படைக்கல விவரம், எண்ணிக்கை, இராணுவ ஆயத்தநிலை ஆகியவை பாதுகாக்கப்பட்டுள்ளன. அடிக்குறிப்பு குறி அது விளக்கும் חֲלוּצֵי צָבָא என்ற தொடரின் மொழிபெயர்ப்புக்குப் பின்னர் வைக்கப்பட்டுள்ளது.
