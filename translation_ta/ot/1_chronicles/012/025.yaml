source:
  edition: WLC
  text: בְּנֵ֣י יְהוּדָ֔ה נֹשְׂאֵ֥י צִנָּ֖ה וָ/רֹ֑מַח שֵׁ֧שֶׁת אֲלָפִ֛ים וּ/שְׁמוֹנֶ֥ה מֵא֖וֹת חֲלוּצֵ֥י צָבָֽא׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/025.yaml
  text: From the sons of Judah[a], carrying shield and spear, there were 6,800 equipped for battle.
translation:
  language: ta
  text: யூதாவின் மக்களில், கேடயத்தையும் ஈட்டியையும் ஏந்தி, போருக்கு ஆயத்தமாயிருந்தவர்கள்[a] 6,800 பேர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘போருக்காக ஆயுதம் தரித்தவர்கள்.’ חֲלוּצֵי צָבָא என்ற எபிரெயத் தொடர், போருக்குத் தேவையான படைக்கலன்களுடன் ஆயத்தமாக இருந்தவர்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יְהוּדָה
  choice: யூதாவின் மக்களில்
  rationale: இது யூதா கோத்திரத்தைச் சேர்ந்தவர்களைக் குறிக்கிறது. சுற்றியுள்ள வசனங்களில் ஒவ்வொரு கோத்திரத்திலிருந்தும் வந்த படைப்பிரிவுகள் பட்டியலிடப்படுவதால், ‘மக்களில்’ என்பது எபிரெய வடிவத்தையும் பட்டியல் சூழலையும் இயல்பாகப் பாதுகாக்கிறது.
- source_word: נֹשְׂאֵי
  choice: ஏந்தி
  rationale: இப்பெயரெச்சம் படைக்கலன்களைச் சுமந்து அல்லது ஏந்தியிருப்பதைக் குறிக்கிறது. ‘ஏந்தி’ என்பது கேடயத்துக்கும் ஈட்டிக்கும் இயல்பான, கண்ணியமான நவீனத் தமிழ் சொல்.
- source_word: צִנָּה
  choice: கேடயம்
  rationale: צִנָּה பொதுவாகக் கேடயத்தையும், சில சூழல்களில் பெரிய கேடயத்தையும் குறிக்கலாம். இங்கு அளவைத் தெளிவாக வலியுறுத்தாததால் பொதுவான ‘கேடயம்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: וָרֹמַח
  choice: ஈட்டியையும்
  rationale: רֹמַח என்பது ஈட்டி அல்லது நீண்ட ஈட்டியைக் குறிக்கும். ‘ஈட்டி’ சாதாரண வாசகர்களுக்கு தெளிவானதும் இச்சூழலுக்கு ஏற்றதுமான படைக்கலச் சொல்.
- source_word: שֵׁשֶׁת אֲלָפִים וּשְׁמוֹנֶה מֵאוֹת
  choice: 6,800 பேர்
  rationale: எபிரெய எண்ணிக்கை நேரடியாக 6,800 ஆகும். பட்டியல் வாசிப்பை எளிதாக்க எண்கள் பயன்படுத்தப்பட்டன; மனிதர்களின் எண்ணிக்கை என்பதைக் காட்ட ‘பேர்’ சேர்க்கப்பட்டது.
- source_word: חֲלוּצֵי צָבָא
  choice: போருக்கு ஆயத்தமாயிருந்தவர்கள்
  rationale: இராணுவச் சூழலில் இத்தொடர் போருக்குத் தேவையானவற்றுடன் ஆயத்தப்படுத்தப்பட்ட அல்லது அணிவகுக்கப்பட்ட வீரர்களைக் குறிக்கிறது. முன்பே கேடயமும் ஈட்டியும் குறிப்பிடப்படுவதால், ‘போருக்கு ஆயத்தமாயிருந்தவர்கள்’ என்பது தேவையற்ற மறுபடியுரைத்தலைத் தவிர்த்து பொருளை இயல்பாகத் தருகிறது.
