  revised_text: 'தாவீது வெளியே சென்று அவர்கள் முன்பாக, அவர்களிடம் மறுமொழியாகக் கூறினான்: “நீங்கள் எனக்கு உதவுவதற்காகச் சமாதானத்துடன் என்னிடம் வந்திருந்தால், என் உள்ளம் உங்களோடு ஒன்றுபடும். ஆனால், என் கைகளில் வன்முறை ஏதும் இல்லாதபோதும், என்னை என் எதிரிகளிடம் காட்டிக்கொடுக்க[a] வந்திருந்தால், நம் முன்னோர்களின் கடவுள் கண்டு தீர்ப்பாராக[b].”'
