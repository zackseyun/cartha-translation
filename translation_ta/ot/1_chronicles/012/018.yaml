base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/018.yaml
  text: David went out before them and answered and said to them[a], “If you have come to me in peace to help me, my heart will be united with you; but if you have come to betray me to my enemies, though there is no violence in my hands[b], may the God of our fathers see and judge.”
translation:
  language: ta
  text: 'தாவீது வெளியே சென்று அவர்கள் முன்பாக, அவர்களிடம் மறுமொழியாகக் கூறினான்: “நீங்கள் எனக்கு உதவுவதற்காகச் சமாதானத்துடன் என்னிடம் வந்திருந்தால், என் உள்ளம் உங்களோடு ஒன்றுபடும். ஆனால், என் கைகளில் வன்முறை ஏதும் இல்லாதபோதும், என்னை என் எதிரிகளிடம் காட்டிக்கொடுக்க[a] வந்திருந்தால், நம் முன்னோர்களின் கடவுள் கண்டு தீர்ப்பாராக[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என்னை ஏமாற்ற.” எபிரேய வினை துரோகமான ஏமாற்றத்தைக் குறிக்கலாம்; எதிரிகளிடம் ஒப்படைக்கும் சூழலால் இங்கு “காட்டிக்கொடுக்க” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “கண்டு கண்டிப்பாராக” அல்லது “கண்டு முடிவு செய்வாராக.” இறுதி எபிரேய வினை கண்டித்தல், வழக்கைத் தீர்த்தல், தீர்மானித்தல் ஆகிய பொருள்களைக் கொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּצֵא ... לִפְנֵיהֶם
  choice: அவர்களுக்கு முன்பாகப் புறப்பட்டுச் சென்று
  rationale: יצא என்பதன் இயக்கத்தையும் לִפְנֵיהֶם என்பதன் இடஞ்சார்ந்த பொருளையும் தக்கவைக்கிறது; ‘சந்திக்கச் சென்றான்’ என்ற கூடுதல் விளக்கத்தைத் தவிர்க்கிறது.
- source_word: וַיַּעַן וַיֹּאמֶר
  choice: மறுமொழியாகக் கூறினான்
  rationale: இரு எபிரேய வினைகளின் பதிலுரைக்கும் தன்மையை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; சொற்சொல்லாக இரட்டிப்பது தமிழில் செயற்கையாக இருக்கும்.
- source_word: לְשָׁלוֹם
  choice: சமாதானத்துடன்
  rationale: அவர்களுடைய வருகை அமைதியான, நேர்மையான நோக்கமுடையதா என்ற பொருளைத் தெளிவாகவும் மூலத்திற்கு நெருக்கமாகவும் தருகிறது.
- source_word: לְעָזְרֵנִי
  choice: எனக்கு உதவுவதற்காக
  rationale: நோக்கத்தைக் குறிக்கும் எபிரேய வினையெச்சத்தை நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: יִהְיֶה לִּי עֲלֵיכֶם לֵבָב לְיָחַד
  choice: என் உள்ளம் உங்களோடு ஒன்றுபட்டிருக்கும்
  rationale: சற்றே இடியோமாட்டிக்கான எபிரேய தொடரிலுள்ள ஒருமனப்பட்ட இணக்கத்தைக் கூறுகிறது; ‘இதயம்’ என்பதற்குப் பதில் தமிழில் எண்ணம், விருப்பம், பற்றுறுதி ஆகியவற்றை இயல்பாகக் குறிக்கும் ‘உள்ளம்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: לְרַמּוֹתַנִי
  choice: என்னை ... காட்டிக்கொடுக்க
  rationale: רמה என்பதற்கு ‘ஏமாற்று’ அல்லது துரோகமாக ஒப்படை என்ற பொருள் வரலாம். எதிரிகளிடம் என்பதோடு வரும் இச்சூழலில் ‘காட்டிக்கொடுக்க’ என்பது துரோகத்தின் நடைமுறை விளைவை இயல்பாகத் தெரிவிக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לְצָרַי
  choice: என் எதிரிகளிடம்
  rationale: பகைமை கொண்ட எதிராளிகளைக் குறிக்கும் தெளிவான நவீனத் தமிழ்.
- source_word: בְּלֹא חָמָס בְּכַפַּי
  choice: என் கைகளில் வன்முறை ஏதும் இல்லாதிருக்க
  rationale: חמס என்பதன் ‘வன்முறை/அநீதி’ சார்ந்த பொருளையும், குற்றச்செயலைக் கைகளோடு இணைக்கும் மூல உருவகத்தையும் காக்கிறது. சூழலின் விட்டுக்கொடுப்பு சார்ந்த வலியுறுத்தலும் வெளிப்படுகிறது.
- source_word: יֵרֶא
  choice: கண்டு
  rationale: நிபந்தனைக்குப் பிந்தைய இறைமுறையீட்டில் இது வேண்டுகோள் அல்லது விருப்பநிலையாகச் செயல்படுகிறது; அடுத்த வினையோடு இணைத்து தமிழில் இயல்பாக வழங்கப்படுகிறது.
- source_word: אֱלֹהֵי אֲבוֹתֵינוּ
  choice: நம் முன்னோர்களின் கடவுள்
  rationale: உடன்படிக்கை மரபைச் சுட்டும் தொடரை உள்ளடக்கமான, இயல்பான நவீனத் தமிழில் தருகிறது; אבות இங்கு தலைமுறை முன்னோர்களைக் குறிக்கிறது.
- source_word: וְיוֹכַח
  choice: தீர்ப்பாராக
  rationale: יכח என்பதன் நிரூபித்தல், கண்டித்தல், வழக்குத் தீர்த்தல் ஆகிய பொருள் பரப்பில் இச்சூழலின் நீதிசார் இறைமுறையீட்டைச் சிறப்பாகத் தெரிவிக்கிறது; பிற சாத்தியங்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
theological_decisions:
- issue: இறுதியில் கடவுளுடைய செயலுக்கான முறையீடு
  choice: நம் முன்னோர்களின் கடவுள் அதைக் கண்டு தீர்ப்பாராக
  alternative: நம் முன்னோர்களின் கடவுள் அதைக் கண்டு கண்டிப்பாராக / முடிவு செய்வாராக; அல்லது ‘கண்டு தீர்ப்பார்’
  rationale: எபிரேய imperfect வடிவங்கள் இங்கு வெறும் எதிர்கால முன்னறிவிப்பாக அல்லாமல், துரோகக் குற்றச்சாட்டின் நிலையில் கடவுளின் நீதித் தலையீட்டை வேண்டுகிற முறையீடாக இயல்பாகப் புரிகின்றன. ‘தீர்ப்பாராக’ அந்த வேண்டுகோள் தன்மையைப் பாதுகாக்கிறது; வினையின் ‘கண்டி/தீர்மானி’ என்ற பரப்பை அடிக்குறிப்பு வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘முன்பாக’, ‘கைகளில் வன்முறை’, ‘உள்ளம் ஒன்றுபடுதல்’ போன்ற மூல உருவகங்கள் வாசிக்க இயன்ற அளவில் காக்கப்பட்டுள்ளன; எபிரேய மொழியின் செயற்கையான வாக்கிய இரட்டிப்புகள் இயல்பான தமிழாக்கமாக மாற்றப்பட்டுள்ளன. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
