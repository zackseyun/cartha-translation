    text: அல்லது, “என்னை ஏமாற்ற.” எபிரேய வினை துரோகமான ஏமாற்றத்தைக் குறிக்கலாம்; எதிரிகளிடம் ஒப்படைக்கும் சூழலால் இங்கு “காட்டிக்கொடுக்க” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
