base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/041.yaml
  text: 'Also those near them[a], as far as Issachar and Zebulun and Naphtali, were bringing food on donkeys, camels, mules, and cattle: provisions of flour, fig cakes, raisin cakes, wine, oil, cattle, and sheep in abundance[c][b], for there was joy in Israel.'
translation:
  language: ta
  text: 'மேலும், அவர்களுக்கு அருகிலிருந்தவர்கள் இசக்கார், செபுலோன், நப்தலி வரையிலும் கழுதைகள், ஒட்டகங்கள், கோவேறு கழுதைகள், மாடுகள் ஆகியவற்றின்மேல் ஏராளமான உணவுப்பொருள்களைக் கொண்டுவந்தார்கள்: மாவு, அத்திப்பழ அடைகள், உலர்ந்த திராட்சைகள்[a], திராட்சரசம், எண்ணெய், மாடுகள், ஆடுகள். ஏனெனில் இஸ்ரவேலில் மகிழ்ச்சி இருந்தது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “திராட்சை அடைகள்.” எபிரெயச் சொல் உலர்ந்த திராட்சைகளையோ, எடுத்துச் செல்வதற்காக அழுத்திச் செய்யப்பட்ட திராட்சை அடைகளையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: அவர்களுக்கு அருகிலிருந்தவர்களும்
  rationale: முந்தைய வசனத்துடன் தொடர்ச்சியையும் கூடுதலாகச் சேர்ந்தவர்களையும் குறிக்கும் வְגַם என்பதன் கூட்டுச் சக்தியை இயல்பான தமிழில் ‘-உம்’ வெளிப்படுத்துகிறது.
- source_word: הַקְּרֹבִים אֲלֵיהֶם
  choice: அவர்களுக்கு அருகிலிருந்தவர்கள்
  rationale: ‘அவர்களுடைய அயலார்’ என்று குடியிருப்பு உறவைத் திட்டவட்டமாக்காமல், எபிரெயச் சொல்லின் இட அல்லது உறவு சார்ந்த நெருக்கத்தைப் பாதுகாக்கிறது.
- source_word: עַד יִשָׂשכָר וּזְבֻלוּן וְנַפְתָּלִי
  choice: இசக்கார், செபுலோன், நப்தலி வரையிலிருந்தவர்கள்
  rationale: עַד குறிக்கும் புவியியல் எல்லையை இயல்பான தமிழில் தெரிவிக்கிறது; வேறு இலக்கண இணைப்புக்கான சாத்தியம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: מְבִיאִים
  choice: ஏற்றிக்கொண்டு வந்தார்கள் / கொண்டுவந்தார்கள்
  rationale: கதைச் சூழலில் பங்கேற்பெயர் தொடர்ந்து நடைபெற்ற பொருள் கொண்டுவரும் செயலைக் காட்டுகிறது; தமிழ் வாக்கியத்தில் செயல் தெளிவாகவும் இயல்பாகவும் கூறப்பட்டுள்ளது.
- source_word: לֶחֶם
  choice: உணவு
  rationale: அடிப்படைப் பொருள் ‘அப்பம்’ என்றாலும், தொடர்ந்து பலவகையான உணவுப் பொருள்கள் பட்டியலிடப்படுவதால் இங்கு பொதுப்பொருளான ‘உணவு’ பொருத்தமானது.
- source_word: בַּחֲמוֹרִים וּבַגְּמַלִּים וּבַפְּרָדִים וּבַבָּקָר
  choice: கழுதைகள், ஒட்டகங்கள், கோவேறு கழுதைகள், மாடுகள் ஆகியவற்றின்மேல் ... ஏற்றி
  rationale: בְּ இங்கு போக்குவரத்துச் சாதனத்தைக் குறிக்கிறது. בָּקָר என்பதைக் ‘வண்டிகள்’ என்று மாற்றாமல், மூலத்தில் உள்ள சற்றே அசாதாரணமான ‘மாடுகள்’ என்பதே வைக்கப்பட்டுள்ளது.
- source_word: מַאֲכָל
  choice: உணவுப் பொருள்கள்
  rationale: அடுத்து வரும் உண்ணத்தக்க பொருள்களின் விரிவான பட்டியலை அறிமுகப்படுத்தும் கூட்டுப்பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: קֶמַח
  choice: மாவு
  rationale: நன்றாக அரைக்கப்பட்ட தானியத்திற்கான வழக்கமான, தெளிவான தமிழ்ச் சொல்.
- source_word: דְּבֵלִים
  choice: அத்திப்பழ அடைகள்
  rationale: சேமிப்புக்கும் எடுத்துச் செல்வதற்கும் அழுத்திச் செய்யப்பட்ட அத்திப்பழத் தொகுதிகளை இயல்பாகக் குறிக்கிறது.
- source_word: צִמּוּקִים
  choice: உலர்ந்த திராட்சை
  rationale: சொல்லின் உறுதியான பொதுப்பொருளைப் பிரதான உரையில் வைக்கிறது; அழுத்திச் செய்யப்பட்ட திராட்சை அடைகள் என்ற சூழல்சார் சாத்தியம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: יַיִן
  choice: திராட்சரசம்
  rationale: மது வகையான திராட்சைப் பானத்தைக் குறிக்கும் சொல்லை நவீனத் தமிழில் தெளிவாகத் தருகிறது.
- source_word: שֶׁמֶן
  choice: எண்ணெய்
  rationale: சூழலில் பெரும்பாலும் ஒலிவ எண்ணெயாக இருந்திருக்கலாம்; ஆயினும் எபிரெய உரை வகையைச் சுட்டாததால் பொதுச்சொல் தக்கவைக்கப்பட்டுள்ளது.
- source_word: לָרֹב
  choice: ஏராளமாக
  rationale: பொருள்கள் மிகுதியாகக் கொண்டுவரப்பட்டதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: כִּי שִׂמְחָה בְּיִשְׂרָאֵל
  choice: ஏனெனில் இஸ்ரவேலில் மகிழ்ச்சி நிலவியது
  rationale: כִּי தரும் காரணத் தொடர்பையும், பெயர்ச்சொல் வாக்கியமான ‘இஸ்ரவேலில் மகிழ்ச்சி’ என்பதன் நிலைமையையும் பாதுகாக்கிறது.
