  to: 'மேலும், அவர்களுக்கு அருகிலிருந்தவர்கள் இசக்கார், செபுலோன், நப்தலி வரையிலும் கழுதைகள், ஒட்டகங்கள், கோவேறு கழுதைகள், மாடுகள் ஆகியவற்றின்மேல் ஏராளமான உணவுப்பொருள்களைக் கொண்டுவந்தார்கள்: மாவு, அத்திப்பழ அடைகள், உலர்ந்த திராட்சைகள்[a], திராட்சரசம், எண்ணெய், மாடுகள், ஆடுகள். ஏனெனில் இஸ்ரவேலில் மகிழ்ச்சி இருந்தது.'
