  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடையைக் கொண்டுள்ளது. மூலத்தின் பட்டியல் அமைப்பு காக்கப்பட்டாலும், நீண்ட எபிரெய வாக்கியம் வாசிப்புத் தெளிவிற்காக இரண்டு தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது. ‘மாடுகள்’ போக்குவரத்திற்குப் பயன்படுத்தப்பட்டதாக மூலத்தில் உள்ள அசாதாரணமான குறிப்பை விளக்கமாக மாற்றாமல் தக்கவைத்துள்ளது.
