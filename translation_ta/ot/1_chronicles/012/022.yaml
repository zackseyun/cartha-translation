revisions:
- from: அவர்கள் தாவீதுக்கு உதவியாக அந்தக் கொள்ளையர் படையை[a] எதிர்த்தார்கள்; ஏனெனில் அவர்கள் அனைவரும் வலிமைமிக்க போர்வீரர்கள்[b]. அவர்கள் படையில் தளபதிகளானார்கள்[c].
  to: அவர்கள் தாவீதோடு சேர்ந்து அந்தக் கொள்ளையர் படையை[a] எதிர்த்துப் போராட அவருக்கு உதவினார்கள்; ஏனெனில் அவர்கள் அனைவரும் வலிமைமிக்க போர்வீரர்கள்[b]. அவர்கள் படையில் படைத் தலைவர்களானார்கள்[c].
  rationale: The revision explicitly represents the Hebrew preposition עִם as David’s companions in the action, while retaining the contextual sense of hostile action against a raiding band. It also replaces the rank-specific ‘தளபதிகள்’ with the broader ‘படைத் தலைவர்கள்,’ corresponding more closely to שָׂרִים. The causal clause, the emphasis that all were warriors, and the resultant sense of ‘became’ are retained.
