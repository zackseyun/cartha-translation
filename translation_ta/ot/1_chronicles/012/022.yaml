translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான இராணுவ நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் காரணத் தொடர்பும், அனைவரையும் உள்ளடக்கும் வலியுறுத்தலும், பின்னர் தளபதிகளானார்கள் என்ற நிகழ்வுநிலையும் பாதுகாக்கப்பட்டுள்ளன.
