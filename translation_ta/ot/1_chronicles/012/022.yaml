base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/022.yaml
  text: And they helped David against the raiding band[a], for all of them were mighty men of valor[c][b], and they became commanders in the army.
translation:
  language: ta
  text: அவர்கள் தாவீதோடு சேர்ந்து அந்தக் கொள்ளையர் படையை[a] எதிர்த்துப் போராட அவருக்கு உதவினார்கள்; ஏனெனில் அவர்கள் அனைவரும் வலிமைமிக்க போர்வீரர்கள்[b]. அவர்கள் படையில் படைத் தலைவர்களானார்கள்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘படைக்குழு’ அல்லது ‘துருப்புப்படை’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் ஆயுதமேந்திய படைக்குழுவையோ கொள்ளையடிக்கும் படையையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘வீரமிக்க வலியவர்கள்’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொற்றொடர் வலிமையும் போர்த்திறனும் வீரமும் கொண்டவர்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: ‘தளபதிகள்’ அல்லது ‘அதிகாரிகள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵמָּה
  choice: அவர்கள்
  rationale: தனிப்பட்ட சுட்டுப்பெயர் பொருளை வலியுறுத்துகிறது; தமிழில் வெளிப்படையான எழுவாயாக ‘அவர்கள்’ இயல்பாக உள்ளது.
- source_word: עָזְרוּ עִם דָּוִיד
  choice: தாவீதுக்கு உதவியாக
  rationale: עזר என்பதன் அடிப்படைப் பொருள் ‘உதவுதல்’; עִם தாவீதுடனான இணைப்பைக் காட்டுகிறது. தமிழில் உதவியின் பயனாளியையும் அவர்களுடைய துணைநிலையையும் இயல்பாகத் தெரிவிக்க இவ்வாறு மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: עַל הַגְּדוּד
  choice: அந்தக் கொள்ளையர் படையை எதிர்த்தார்கள்
  rationale: גְּדוּד என்பது படைக்குழு அல்லது கொள்ளையடிக்கும் படை எனப் பொருள்படலாம்; עַל இச்சூழலில் பகைமை சார்ந்த ‘எதிராக’ என்ற உறவைக் குறிக்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: அடுத்த கூற்று அவர்கள் அளித்த உதவிக்கான விளக்கத்தையோ காரணத்தையோ அறிமுகப்படுத்துகிறது.
- source_word: גִבּוֹרֵי חַיִל
  choice: வலிமைமிக்க போர்வீரர்கள்
  rationale: இது வலிமை, திறமை, வீரம் கொண்ட போராளிகளைக் குறிக்கும் வழக்கமான எபிரெய இராணுவச் சொற்றொடர்.
- source_word: כֻּלָּם
  choice: அவர்கள் அனைவரும்
  rationale: பின்னொட்டுடன் அமைந்துள்ள இச்சொல் அந்தக் குழுவில் ஒருவரும் விலக்கல்ல என்பதை வலியுறுத்துகிறது.
- source_word: וַיִּהְיוּ
  choice: ஆனார்கள்
  rationale: இது நிலையான ‘இருந்தார்கள்’ என்பதைக் காட்டிலும், தொடர்ந்து ஏற்பட்ட புதிய நிலையைச் சுட்டுகிறது.
- source_word: שָׂרִים
  choice: தளபதிகள்
  rationale: שָׂרִים என்பது தலைவர்கள் அல்லது அதிகாரிகளைக் குறிக்கலாம்; இராணுவச் சூழலில் ‘தளபதிகள்’ தெளிவான நவீனத் தமிழ் சொல்லாகும்.
- source_word: בַּצָּבָא
  choice: படையில்
  rationale: צָבָא இங்கு ஒழுங்கமைக்கப்பட்ட இராணுவப் படையைக் குறிக்கிறது.
