- source_word: הָרְבִיעִי
  choice: நான்காவது
  rationale: பட்டியலில் உள்ள வரிசை அல்லது பதவிநிலையைக் குறிக்கும் உருபுடன் கூடிய வரிசை எண்; தமிழில் இயல்பான பட்டியல் நடைக்கேற்ப மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: יִרְמְיָה
  choice: எரேமியா
  rationale: இது ஓர் ஆளின் பெயர். தமிழில் பரவலாக அறியப்படும் வேதாகமப் பெயர் வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: הַחֲמִשִׁי
  choice: ஐந்தாவது
  rationale: அடுத்த வரிசை அல்லது பதவிநிலையைக் குறிக்கும் உருபுடன் கூடிய வரிசை எண்; எபிரெயப் பட்டியல் அமைப்பு தக்கவைக்கப்பட்டுள்ளது.
