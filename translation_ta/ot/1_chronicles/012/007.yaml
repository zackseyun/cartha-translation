base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/007.yaml
  text: Elkanah[a], Isshiah, Azarel, Joezer, and Jashobeam, the Korahites.
translation:
  language: ta
  text: எல்க்கானா, யிஷ்ஷியாஹூ, அசரேல், யோஎசேர், யாஷோவாம் ஆகிய கோராகியர்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கோராவின் சந்ததியினர்.”
    reason: எபிரெயப் பன்மைக் குலப்பெயரின் விரிவான பொருள் மாற்று.
lexical_decisions:
- source_word: אֶלְקָנָה
  choice: எல்க்கானா
  rationale: எபிரெயத் தனிப்பெயரின் ஒலியைத் தமிழில் இயன்றவரை நேரடியாகப் பெயர்த்தெழுதிய வடிவம்.
- source_word: יִשִּׁיָּהוּ
  choice: யிஷ்ஷியாகு
  rationale: இவ்வசனத்திலுள்ள எபிரெய வடிவத்தைப் பின்பற்றி, இரட்டித்த ஷ் ஒலியையும் இறுதி யாகு கூறையும் பிரதிபலிக்கும் பெயரெழுத்தாக்கம்.
- source_word: עֲזַרְאֵל
  choice: அசரேல்
  rationale: எபிரெயத் தனிப்பெயரின் மெய் மற்றும் உயிரொலி அமைப்பை இயல்பான தமிழ் எழுத்தாக்கத்தில் தருகிறது.
- source_word: יוֹעֶזֶר
  choice: யோவேசேர்
  rationale: எபிரெயப் பெயரில் உள்ள யோ-எசேர் ஒலித்தொடரைத் தமிழில் வாசிக்கத்தக்க வகையில் பெயர்த்தெழுதுகிறது; இடையிலுள்ள எபிரெயக் கண்ட ஒலியை இணைப்பொலி மூலம் காட்டுகிறது.
- source_word: יָשָׁבְעָם
  choice: யாஷொபெயாம்
  rationale: இவ்வசனத்தின் மசோரா மூலத்தில் உள்ள பெயரையே பெயர்த்தெழுதுகிறது; வேறு இடத்தில் காணப்படும் மாறுபட்ட பெயர்வடிவத்தை இங்கு புகுத்தவில்லை.
- source_word: הַקָּרְחִים
  choice: கோராகியர்
  rationale: கோராகு என்னும் குலப்பெயருடன் தொடர்புடைய பன்மைக் குழுப்பெயரைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
theological_decisions: []
translation_notes:
  register: நவீன தரத் தமிழில், பட்டியல் வசனத்திற்கேற்ற சுருக்கமான மற்றும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. பெயர்கள் ஆங்கில மரபிலிருந்து அல்லாமல் எபிரெய வடிவங்களிலிருந்து பெயர்த்தெழுதப்பட்டுள்ளன. [a] குறி அது விளக்கும் ‘கோராகியர்’ என்பதற்குப் பின்னர் வைக்கப்பட்டுள்ளது.
