review_pass:
  verdict: revise
  source_fidelity: 'The clan designation is conveyed accurately, but two personal-name forms depart from the Hebrew: יִשִּׁיָּהוּ ends in -yahu/-yahū, not -yaku, and יוֹעֶזֶר contains no consonant corresponding to the added வ. The final name is more closely represented as யாஷோவாம், reflecting the Hebrew consonantal/vocalic form rather than the English conventional spelling.'
  naturalness: The concise list format and appositional clan label are natural for a biblical genealogical/list verse in modern standard Tamil. The revised name forms remain readable Tamil transliterations.
  terminology: கோராகியர் is an appropriate concise rendering of the plural gentilic הַקָּרְחִים. The alternative footnote is retained, with more idiomatic Tamil for “descendants of Korah.”
  issues:
  - severity: medium
    issue: யிஷ்ஷியாகு does not accurately represent יִשִּׁיָּהוּ.
    rationale: The Hebrew theophoric ending is -yahu/-yahū (יהו), not -yaku. யிஷ்ஷியாஹூ preserves the relevant final element without interpreting the name.
  - severity: medium
    issue: யோவேசேர் adds a consonant not present in יוֹעֶזֶר.
    rationale: The Hebrew is yōʿezer. Rendering it யோஎசேர் avoids the unsupported வ while retaining a readable representation of the vowel sequence.
  - severity: low
    issue: யாஷொபெயாம் follows an English-like conventional form more than the Hebrew form.
    rationale: יָשָׁבְעָם is more directly represented as யாஷோவாம் in Tamil; this avoids the added பே syllable and reflects the bet sound.
  revised_text: எல்க்கானா, யிஷ்ஷியாஹூ, அசரேல், யோஎசேர், யாஷோவாம் ஆகிய கோராகியர்[a].
  revised_footnotes:
  - marker: a
    text: அல்லது, “கோராவின் சந்ததியினர்.”
    reason: எபிரெயப் பன்மைக் குலப்பெயரின் விரிவான பொருள் மாற்று.
