  rationale: பெயர்களை ஆங்கில மரபுவடிவங்களுக்குப் பதிலாக எபிரெய மூலவடிவத்துக்கு நெருக்கமாகத் திருத்தியுள்ளோம். கோராகியர் என்ற குலப்பெயரும் அதன் அடிக்குறிப்பு இடமும் பொருளும் தக்கவைக்கப்பட்டுள்ளன.
