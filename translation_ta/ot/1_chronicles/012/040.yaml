base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/040.yaml
  text: They were there with David for three days[a], eating and drinking, because their brothers had prepared for them.
translation:
  language: ta
  text: அவர்கள் தாவீதோடு அங்கே மூன்று நாட்கள் உண்டும் குடித்தும் இருந்தார்கள்; ஏனெனில் அவர்களுடைய சகோதரர்கள்[a] அவர்களுக்காக ஆயத்தம் செய்திருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவர்களுடைய உறவினர்கள்’ அல்லது ‘அவர்களுடைய குலத்தார்.’ எபிரெய மொழியில் சொல்லுக்குச் சொல் ‘அவர்களுடைய சகோதரர்கள்’ என்று உள்ளது; இச்சூழலில் அது ஒரே குலத்தையோ கோத்திரத்தையோ சேர்ந்தவர்களையும் விரிவாகக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: இருந்து … குடித்தார்கள்
  rationale: היה இங்கு அவர்கள் அங்கே இருந்ததைக் குறிக்கும் கடந்தகாலக் கதை வினை. தமிழில் தொடர்ச்சியான செயல்களுடன் இயல்பாக இணைக்க, ‘இருந்து’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: שָׁם
  choice: அங்கே
  rationale: தாவீதோடு மக்கள் கூடியிருந்த இடத்தைக் குறிக்கும் இயல்பான இடவினையடை.
- source_word: עִם דָּוִיד
  choice: தாவீதோடு
  rationale: עִם உடனிருத்தல் அல்லது தொடர்பைக் குறிக்கிறது; ‘தாவீதோடு’ என்பது நேரடியான, இயல்பான தமிழ் வடிவம்.
- source_word: יָמִים שְׁלוֹשָׁה
  choice: மூன்று நாட்கள்
  rationale: கால நீட்சியைக் குறிக்கும் எபிரெயச் சொற்றொடர்; தமிழில் தனி முன்னிடைச்சொல் இன்றியே கால அளவு இயல்பாக வெளிப்படுகிறது.
- source_word: אֹכְלִים וְשׁוֹתִים
  choice: சாப்பிட்டுக் குடித்தார்கள்
  rationale: மூன்று நாள் தங்கியிருந்தபோது நடந்த செயல்களைப் பங்கேற்புவினைகள் குறிக்கின்றன. ‘விருந்துண்டார்கள்’ என்று சுருக்காமல், மூலத்தில் உள்ள உண்ணுதல் மற்றும் குடித்தல் ஆகிய இரு செயல்களும் பாதுகாக்கப்பட்டுள்ளன.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: அவர்கள் சாப்பிட்டுக் குடித்ததற்கான காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: הֵכִינוּ
  choice: ஆயத்தம் செய்திருந்தார்கள்
  rationale: כון என்பதன் Hiphil வடிவம் ஆயத்தப்படுத்துதல் அல்லது தயாராக வைத்தல் என்று பொருள்படும். காரணமாகக் கூறப்படும் ஏற்பாடு ஏற்கெனவே செய்யப்பட்டிருந்ததை ‘செய்திருந்தார்கள்’ காட்டுகிறது; என்ன ஆயத்தம் செய்தார்கள் என்பதை மூலத்தைப் போலவே வெளிப்படையாக நிரப்பவில்லை.
- source_word: לָהֶם
  choice: அவர்களுக்காக
  rationale: தாவீதோடு இருந்தவர்களின் நலனுக்காக ஆயத்தம் செய்யப்பட்டதைக் குறிக்கும் இயல்பான தமிழ் இணை.
- source_word: אֲחֵיהֶם
  choice: அவர்களுடைய சகோதரர்கள்
  rationale: மூலத்தின் ஆண்பால் உறவுமுறைச் சொல்லை முதன்மை உரையில் நேரடியாகப் பாதுகாக்கிறது. சூழலில் அது குலத்தார் அல்லது உறவினர் என்ற விரிவான பொருளையும் கொள்ளலாம்; அது அடிக்குறிப்பில் தரப்பட்டுள்ளது.
theological_decisions:
- issue: אֲחֵיהֶם என்ற சொல்லின் விரிவான உறவுமுறைப் பொருள்
  choice: அவர்களுடைய சகோதரர்கள்
  alternative: அவர்களுடைய உறவினர்கள் அல்லது குலத்தார்
  rationale: இங்கு கோட்பாட்டுச் சர்ச்சை இல்லை. இருப்பினும், மூலத்தின் நேரடியான ஆண்பால் உறவுமுறைச் சொல்லை முதன்மை உரை பாதுகாக்கிறது; இராணுவ-கோத்திரச் சூழலில் சாத்தியமான விரிவான சமூகப் பொருள் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘சாப்பிட்டுக் குடித்தார்கள்’ என்பது மூலத்தின் இரட்டைச் செயலைத் தெளிவாகக் காக்கிறது; ‘ஆயத்தம் செய்திருந்தார்கள்’ என்பது பொருளை ஊகித்து நிரப்பாமல் வினையின் திறந்த தன்மையைப் பாதுகாக்கிறது. அடிக்குறிப்பு குறியீடு அது விளக்கும் ‘சகோதரர்கள்’ என்பதன் பின்னர் வைக்கப்பட்டுள்ளது.
