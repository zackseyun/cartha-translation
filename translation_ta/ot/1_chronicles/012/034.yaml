base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/034.yaml
  text: From Zebulun[a], fifty thousand men fit for military service, prepared for battle with every kind of weapon of war[b], to help without a divided heart.
translation:
  language: ta
  text: செபுலோனிலிருந்து, படைப்பணிக்குத் தகுதியுள்ளவர்களும் எல்லா வகையான போர்க்கருவிகளுடன் போருக்கு அணிவகுக்க ஆயத்தமானவர்களுமான ஐம்பதாயிரம் பேர், பிளவுபட்ட உள்ளமின்றி ஆதரவளிக்க[a] வந்தார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அணியில் சேர்ந்துகொள்ள” / “துணைநிற்க”; இங்குள்ள எபிரெய வினை அரிதானது. தாவீதுக்கு ஒன்றுபட்ட ஆதரவு அளிக்க அவர்கள் வந்தார்கள் என்பதே சூழலின் கருத்து.
    reason: alternative_reading
  - marker: b
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “இதயமும் இதயமும் இல்லாமல்”; அதாவது, பிளவுபட்ட மனமோ இருமனமோ இல்லாமல்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְּבֻלוּן
  choice: செபுலோனிலிருந்து
  rationale: முன்னொட்டு מ־ மூலத்தையோ புறப்பட்ட இடத்தையோ குறிக்கிறது; எனவே இந்தப் படைப்பிரிவினர் செபுலோன் கோத்திரத்திலிருந்து வந்தவர்கள் என்பதைக் காட்டுகிறது.
- source_word: יוֹצְאֵי צָבָא
  choice: படைப்பணிக்குத் தகுதியுள்ளவர்கள்
  rationale: சொல்லுக்குச் சொல் ‘படைக்குப் புறப்படுகிறவர்கள்’; சூழலில் படைப்பணிக்கு ஏற்ற அல்லது அதற்குக் கிடைக்கக்கூடிய ஆட்களைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
- source_word: עֹרְכֵי מִלְחָמָה
  choice: போருக்கு அணிவகுக்க ஆயத்தமானவர்கள்
  rationale: ערך என்ற வினையின் இப்பயன்பாடு போருக்காக வரிசைப்படுத்துதல் அல்லது போரணியை அமைத்தல் என்ற இராணுவப் பொருளைக் கொண்டது; தமிழ் வாசிப்பில் ஆயத்தநிலையையும் அணிவகுப்பையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּכָל כְּלֵי מִלְחָמָה
  choice: எல்லா வகையான போர்க்கருவிகளுடன்
  rationale: כְּלֵי מִלְחָמָה என்பது ஆயுதங்கள் உட்பட போருக்கான கருவிகளையோ உபகரணங்களையோ குறிக்கலாம்; ‘போர்க்கருவிகள்’ மூலத்தின் பரந்த பொருளைத் தக்கவைக்கிறது.
- source_word: חֲמִשִּׁים אָלֶף
  choice: ஐம்பதாயிரம்
  rationale: மூல எண்ணிக்கையின் நேரான தமிழ் வடிவம்.
- source_word: וְלַעֲדֹר
  choice: ஆதரவளிக்க
  rationale: இங்கு வரும் עדר அரிதானதும் பொருள் உறுதியாகாததுமாகும். சூழலில் தாவீதின் தரப்பில் சேர்ந்து ஒழுங்கான ஆதரவு அளிப்பதை இது குறிக்கிறது; ‘ஆதரவளிக்க’ தொழில்நுட்பப் பொருளை அளவுக்கு மீறி நிர்ணயிக்காமல் செயல்பாட்டுப் பொருளைத் தருகிறது.
- source_word: בְּלֹא לֵב וָלֵב
  choice: பிளவுபட்ட உள்ளமின்றி
  rationale: சொல்லுக்குச் சொல் ‘இதயமும் இதயமும் இல்லாமல்’ என்ற இந்த எபிரெய மரபுத்தொடர், பிளவுபட்ட விசுவாசமோ இருமனமோ இல்லாத நிலையைக் குறிக்கிறது. ‘உள்ளம்’ என்ற சொல் மூலத்தின் இதய உருவகத்தை இயல்பான தமிழில் தக்கவைக்கிறது.
