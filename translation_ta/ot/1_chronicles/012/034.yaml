translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. இராணுவச் சொற்கள் சாதாரண வாசகருக்குப் புரியுமாறு அமைக்கப்பட்டுள்ளன. அரிதான וְלַעֲדֹר என்பதன் உறுதியற்ற தன்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது; לֵב וָלֵב என்பதன் இதய உருவகம் ‘பிளவுபட்ட உள்ளம்’ எனத் தக்கவைக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்றொடர்களோடு சரியாக இணைக்கப்பட்டுள்ளன.
