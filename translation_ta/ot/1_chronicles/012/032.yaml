translation:
  language: ta
  text: மனாசேயின் அரைக் கோத்திரத்திலிருந்து, தாவீதை அரசனாக்க வருவதற்காகப் பெயரால் குறிப்பிடப்பட்ட பதினெட்டாயிரம் பேர்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמֵחֲצִי מַטֵּה מְנַשֶּׁה
  choice: மனாசேயின் கோத்திரத்தில் பாதியினரிலிருந்து
  rationale: וּמֵחֲצִי என்பதிலுள்ள இணைப்பையும் ‘பாதி’ என்ற பொருளையும், מַטֵּה என்பதன் கோத்திரச் சூழல் பொருளையும் இயல்பான தமிழில் தருகிறது. ‘மனாசேயின் அரைக் கோத்திரம்’ என்பதைவிட மூலத்தின் ‘மனாசேயின் கோத்திரத்தில் பாதி’ என்ற அமைப்புக்கு இது நெருக்கமானது.
- source_word: שְׁמוֹנָה עָשָׂר אָלֶף
  choice: பதினெட்டாயிரம் பேர்
  rationale: எண்ணிக்கையை நேரடியாகத் தருகிறது; மனிதர்களைக் குறிக்கத் தமிழில் இயல்பாக ‘பேர்’ சேர்க்கப்பட்டுள்ளது.
- source_word: אֲשֶׁר נִקְּבוּ בְּשֵׁמוֹת
  choice: பெயர் குறிப்பிட்டு நியமிக்கப்பட்டவர்கள்
  rationale: נקב என்பதன் நிபால் வடிவிலுள்ள செயப்பாட்டு உணர்வையும், בְּשֵׁמוֹת என்பதிலுள்ள தனித்தனியாகப் பெயரிடப்பட்ட அல்லது பட்டியலிடப்பட்ட உணர்வையும் காக்கிறது; நிர்வாகப் பதிவு என்ற குறிப்பிட்ட பொருளைத் தேவையின்றித் திணிக்கவில்லை.
- source_word: לָבוֹא
  choice: வருவதற்காக
  rationale: எபிரேய நோக்க infinitive அமைப்பைத் தமிழில் இயல்பாகவும் வெளிப்படையாகவும் காக்கிறது.
- source_word: לְהַמְלִיךְ אֶת דָּוִיד
  choice: தாவீதை அரசனாக்க
  rationale: מלך என்பதன் ஹிஃபில் வடிவான ‘அரசனாக்குதல்’ என்ற காரணவினைப் பொருளை நேரடியாகத் தருகிறது; முடிசூட்டும் சடங்காக மட்டும் பொருளைக் குறுக்கவில்லை.
