translation_notes:
  register: நவீனத் தரத் தமிழில், பட்டியல் நடையின் சுருக்கத்தையும் கண்ணியத்தையும் காக்கும் மொழிநடை பயன்படுத்தப்பட்டுள்ளது. ‘முப்பது பேர்’ என்பது அறியப்பட்ட சிறப்பு வீரர் குழுவைக் குறிக்கும் என்பதால் எண்ணுப் பெயர் குழுப்பெயராகத் தரப்பட்டுள்ளது. ‘மேலானவன்’ என்ற சொல் மூலத்தின் தலைமை/தரவரிசை ambiguity-ஐ திறந்தவாறே வைக்கிறது.
