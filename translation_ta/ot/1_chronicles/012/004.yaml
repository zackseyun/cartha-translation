  text: וְ/יִֽשְׁמַֽעְיָ֧ה הַ/גִּבְעוֹנִ֛י גִּבּ֥וֹר בַּ/שְּׁלֹשִׁ֖ים וְ/עַל הַ/שְּׁלֹשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/004.yaml
  text: and Ishmaiah the Gibeonite[b][a], a mighty man among the Thirty and over the Thirty.
translation:
  language: ta
  text: கிபியோனியனாகிய இஸ்மாயா—முப்பதினரில்[a] வலிமைமிக்க வீரனும், அந்த முப்பதினருக்கு மேலானவனுமாக[b] இருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “முப்பதினரைச் சேர்ந்த”; எபிரெய முன்னிடைச்சொல், “முப்பதினர்” எனப்பட்ட சிறப்பு வீரர் குழுவின் உறுப்பினராக இருந்ததைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “முப்பதினருக்கு மேலானவன்” என்பது அவர்கள்மீது தலைமை வகித்ததையோ, அவர்களைவிட உயர்ந்த பதவி பெற்றிருந்ததையோ குறிக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/יִֽשְׁמַֽעְיָ֧ה
  choice: யிஸ்மாயா
  rationale: எபிரெயப் பெயரின் ஒலிப்பைத் தமிழில் இயல்பாகப் பெயர்த்தெழுதுகிறது. பட்டியலைத் தொடரும் וְ என்பதன் இணைப்புப் பொருள், தமிழில் தனி ‘மற்றும்’ என்பதைக் கட்டாயப்படுத்தாமல் வாக்கியத் தொடரமைப்பில் வெளிப்படுகிறது.
- source_word: הַ/גִּבְעוֹנִ֛י
  choice: கிபியோனியனான
  rationale: இது கிபியோனுடன் தொடர்புடைய ஊர் அல்லது இன அடையாளத்தைக் குறிக்கும் பெயரடை வடிவம்; ‘கிபியோனைச் சேர்ந்த’ என்பதும் சாத்தியம், ஆனால் மூலத்தின் சுருக்கமான வடிவம் இங்கு காக்கப்படுகிறது.
- source_word: גִּבּ֥וֹר
  choice: வலிமைமிக்க வீரன்
  rationale: இராணுவப் பட்டியல் சூழலில் உடல் வலிமை, வீரம், போர்த்திறன் ஆகிய நிழற்பொருள்களை இயல்பாக எடுத்துரைக்கிறது.
- source_word: בַּ/שְּׁלֹשִׁ֖ים
  choice: முப்பது பேரில்
  rationale: בְּ முன்னிடைச்சொல் அந்தச் சிறப்புக் குழுவுக்குள் இடம்பெற்றிருப்பதைக் குறிக்கலாம்; ‘முப்பது பேரைச் சேர்ந்தவன்’ என்ற மாற்றுப் பொருளும் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וְ/עַל הַ/שְּׁלֹשִֽׁים
  choice: அந்த முப்பது பேருக்கு மேலானவனுமாக
  rationale: עַל என்பதன் ‘மேல்’ என்ற நேரடியான உறவையும், பதவி அல்லது தலைமை குறித்திருக்கக்கூடிய சுருக்கத்தையும் காக்கிறது; ‘தலைவன்’ என்று வெளிப்படையாகச் சேர்த்து மூலத்தின் ambiguity-ஐ தீர்மானிக்கவில்லை.
