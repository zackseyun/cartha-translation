revisions:
- from: கிபியோனியனான யிஸ்மாயா—முப்பது பேரில்[a] வலிமைமிக்க வீரனும், அந்த முப்பது பேருக்கு மேலானவனுமாக[b] இருந்தான்.
  to: கிபியோனியனாகிய இஸ்மாயா—முப்பதினரில்[a] வலிமைமிக்க வீரனும், அந்த முப்பதினருக்கு மேலானவனுமாக[b] இருந்தான்.
  rationale: The revision standardizes the personal name, improves the Tamil gentilic construction, and uses the compact group designation “முப்பதினர்.” It retains the Hebrew’s potentially awkward dual relationship to the Thirty and leaves the force of על unresolved in the main text, with the explanatory note preserving both leadership and rank possibilities.
