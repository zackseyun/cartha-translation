  register: நவீன நிலையான தமிழில், படைப் பட்டியலுக்கேற்ற சுருக்கமான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஏந்தியவர்கள்’ என்பது எபிரெய முன்னிடைச்சொல் அமைப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது; எண்கள் தெளிவுக்காக இலக்க வடிவில் தரப்பட்டுள்ளன.
