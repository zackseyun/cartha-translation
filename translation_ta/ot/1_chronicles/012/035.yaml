base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/035.yaml
  text: 'From Naphtali: 1,000 commanders[b][a], and with them 37,000 with shield and spear.'
translation:
  language: ta
  text: 'நப்தலியிலிருந்து: தலைவர்கள்[a] 1,000 பேர்; அவர்களுடன் கேடயமும்[b] ஈட்டியும் ஏந்தியவர்கள் 37,000 பேர்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தலைவர்கள்’ என்பதற்கு ‘முதன்மையானவர்கள்’ அல்லது ‘படைத் தலைவர்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘கேடயம்’ என்பதற்கான எபிரெயச் சொல் குறிப்பாகப் பெரிய கேடயத்தைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִנַּפְתָּלִי
  choice: நப்தலியிலிருந்து
  rationale: இணைப்பிடைச்சொல்லும் முன்னிடைச்சொல்லும் சேர்ந்து சொற்படியாக ‘நப்தலியிலிருந்து’ எனப் பொருள்படுகின்றன; பட்டியல் நடையில் இது இயல்பாக உள்ளது.
- source_word: שָׂרִים
  choice: தலைவர்கள்
  rationale: இச்சொல் அதிகாரிகளையோ படைத்தலைவர்களையோ குறிக்கலாம். குறிப்பிட்ட ஒரு இராணுவப் பதவியைத் தேவையின்றி நிர்ணயிக்காமல், அதன் பரந்த பொருளை ‘தலைவர்கள்’ காக்கிறது.
- source_word: אָלֶף
  choice: 1,000 பேர்
  rationale: படைப்பட்டியலில் எண்ணைத் தெளிவாகக் காட்ட எண் வடிவம் பயன்படுத்தப்பட்டுள்ளது; மனிதர்களைக் கணக்கிடுவதால் ‘பேர்’ சேர்க்கப்பட்டுள்ளது.
- source_word: וְעִמָּהֶם
  choice: அவர்களுடன்
  rationale: அந்த ஆயிரம் தலைவர்களுடன் வந்த பெரிய படைப்பிரிவை நேரடியாக இணைக்கிறது.
- source_word: בְּצִנָּה
  choice: கேடயமும்
  rationale: צִנָּה கேடயத்தைக் குறிக்கிறது; குறிப்பாகப் பெரிய கேடயமாகவும் இருக்கலாம். முதன்மை உரையில் பொதுவான இயல்பான சொல்லை வைத்து, அந்த நுணுக்கம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: וַחֲנִית
  choice: ஈட்டியும்
  rationale: חֲנִית என்பதற்கான தெளிவான நவீனத் தமிழ் இணை ‘ஈட்டி’; இணைப்பைத் தமிழில் இயல்பாகக் காட்ட ‘-உம்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: שְׁלֹשִׁים וְשִׁבְעָה אָלֶף
  choice: 37,000 பேர்
  rationale: படை எண்ணிக்கையை வாசிக்க எளிதாக எண் வடிவில் கொடுத்து, மனிதர்களைக் குறிக்க ‘பேர்’ சேர்க்கப்பட்டுள்ளது.
