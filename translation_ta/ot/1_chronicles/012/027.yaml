lexical_decisions:
- source_word: מִן
  choice: மக்களில்
  rationale: இந்தப் பட்டியல் சூழலில், ஒரு பெரிய குழுவுக்குள் லேவியின் சந்ததியிலிருந்து வந்தவர்களைக் குறிக்கும் எபிரெய முன்னிடைச்சொல்லை இயல்பான தமிழில் இவ்வாறு தருகிறது.
- source_word: בְּנֵי הַלֵּוִי
  choice: லேவியின் மக்கள்
  rationale: சொல்லடிப்படையில் ‘லேவியின் மகன்கள்/மக்கள்’ என்று பொருள். ‘லேவியர்’ என்பதும் சூழலுக்குப் பொருந்தினாலும், மூலத்தின் வம்சவழிச் சொல்லாட்சியை ‘லேவியின் மக்கள்’ பாதுகாக்கிறது.
- source_word: אַרְבַּעַת אֲלָפִים וְשֵׁשׁ מֵאוֹת
  choice: 4,600 பேர்
  rationale: எபிரெய எண்ணிக்கை ‘நான்காயிரத்து அறுநூறு’ என்பதாகும். பட்டியலில் தெளிவுக்காக இலக்கங்கள் பயன்படுத்தப்பட்டுள்ளன; தமிழில் மனிதர்களின் எண்ணிக்கை என்பதை இயல்பாகக் காட்ட ‘பேர்’ சேர்க்கப்பட்டுள்ளது.
