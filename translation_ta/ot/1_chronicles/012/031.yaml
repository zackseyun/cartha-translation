base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/031.yaml
  text: And from the sons of Ephraim[a], twenty thousand eight hundred mighty men of valor, men of renown according to their fathers’ houses.
translation:
  language: ta
  text: எப்பிராயீமின் வழிவந்தவர்களில் 20,800 பேர் வலிமைமிக்க வீரர்கள்; அவர்கள் அவரவர் தந்தைவழிக் குடும்பங்களின்படி பெயர்பெற்ற மனிதர்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சிறப்புப் பெற்றவர்கள்”; சொல்லாட்சிப்படி, “பெயருள்ள மனிதர்கள்,” அதாவது குறிப்பிடத்தக்க அல்லது நன்கு அறியப்பட்டவர்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן
  choice: வழிவந்தவர்களில்
  rationale: முந்தைய கோத்திரப் பட்டியலின் தொடர்ச்சியைத் தமிழ்ச் சொற்றொடரின் இயல்பான அமைப்பில் உணர்த்துகிறது; וּ என்பதன் இணைப்புப் பொருள் சூழலால் வெளிப்படுகிறது.
- source_word: בְּנֵי אֶפְרַיִם
  choice: எப்பிராயீமின் வழிவந்தவர்கள்
  rationale: சொல்லாட்சிப்படி ‘எப்பிராயீமின் மகன்கள்’; இங்கு கோத்திரத்தைச் சேர்ந்த சந்ததியினரைக் குறிப்பதால், நவீனத் தமிழில் தெளிவான ‘வழிவந்தவர்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: עֶשְׂרִים אֶלֶף וּשְׁמוֹנֶה מֵאוֹת
  choice: 20,800 பேர்
  rationale: எண்ணிக்கையைத் துல்லியமாகவும் உடனடியாகப் புரியும் நவீன வடிவிலும் தருகிறது; ‘பேர்’ மனிதர்களின் எண்ணிக்கை என்பதைத் தெளிவாக்குகிறது.
- source_word: גִּבּוֹרֵי חַיִל
  choice: வலிமைமிக்க வீரர்கள்
  rationale: இந்த எபிரெயச் சொற்றொடரில் உள்ள வலிமை, திறமை, போர்வீரம் ஆகிய பொருள் நிழல்களைச் சுருக்கமாகக் காக்கிறது.
- source_word: אַנְשֵׁי שֵׁמוֹת
  choice: பெயர்பெற்றவர்கள்
  rationale: சொல்லாட்சிப்படி ‘பெயர்களின் மனிதர்கள்’; வழக்குப்பொருளில் நன்கு அறியப்பட்ட அல்லது சிறப்புப் பெற்ற மனிதர்களைக் குறிக்கிறது.
- source_word: לְבֵית אֲבוֹתָם
  choice: தங்கள் தந்தைவழிக் குடும்பங்களில்
  rationale: இது அவரவர் தந்தைவழி வம்சக் குடும்பங்களுக்குள் அவர்கள் பெற்றிருந்த நிலையைக் குறிக்கிறது; ‘குடும்பங்களில்’ என்பது இங்கு எபிரெய முன்னிடைச்சொல்லின் தொடர்பைப் பொருத்தமாக வெளிப்படுத்துகிறது.
