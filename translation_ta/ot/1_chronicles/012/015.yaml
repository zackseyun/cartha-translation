source:
  edition: WLC
  text: אֵ֥לֶּה מִ/בְּנֵי גָ֖ד רָאשֵׁ֣י הַ/צָּבָ֑א אֶחָ֤ד לְ/מֵאָה֙ הַ/קָּטָ֔ן וְ/הַ/גָּד֖וֹל לְ/אָֽלֶף־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/015.yaml
  text: These were from the sons of Gad[a], heads of the army; the least was for a hundred, and the greatest for a thousand.
translation:
  language: ta
  text: இவர்கள் காத் கோத்திரத்தின் மக்களில் படைத்தலைவர்களாக இருந்தார்கள்; அவர்களில் மிகவும் குறைந்தவனும் நூறு பேருக்குச் சமமானவன், மிகவும் உயர்ந்தவன் ஆயிரம் பேருக்குச் சமமானவன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “ஒருவன் நூறுக்கு—மிகவும் குறைந்தவன்; மிகவும் உயர்ந்தவன் ஆயிரத்துக்கு” என்று சுருக்கமாக உள்ளது. இது அவர்களின் போர்த்திறன் அல்லது படை மதிப்பைக் குறிக்கலாம்; அல்லது அவர்கள் தலைமை தாங்கிய வீரர்களின் எண்ணிக்கையைக் குறிக்கலாம்.
    reason: மூலத்தின் நீள்விடுபாட்டைத் துல்லியமாகக் காட்டி, உரையில் வெளிப்படுத்தப்பட்ட போர்த்திறன் சார்ந்த புரிதலுடன் மாற்றுச் சாத்தியத்தையும் பாதுகாக்கிறது.
lexical_decisions:
- source_word: אֵלֶּה מִבְּנֵי גָד
  choice: இவர்கள் காதின் மக்களில்
  rationale: எபிரெய மொழியின் குடும்ப–கோத்திரச் சொல்லாட்சியைப் பேணுகிறது; தமிழில் இயல்பாக அமைய வினைச்சொல் அடுத்த தொடருடன் சேர்க்கப்பட்டுள்ளது.
- source_word: רָאשֵׁי הַצָּבָא
  choice: படைத்தலைவர்கள்
  rationale: ரָאשֵׁי என்பதன் நேரடிப் பொருள் ‘தலைவர்கள்’; இங்கு படையை வழிநடத்துவோரைக் குறிக்கும் இயல்பான தமிழ்ச் சொல் இது.
- source_word: הַקָּטָן
  choice: மிகச் சிறியவன்
  rationale: உடல் அளவை மட்டும் அல்லாமல், இவர்களில் வலிமை அல்லது நிலைமையில் குறைந்தவனையும் குறிக்கக்கூடிய ஒப்பீட்டுச் சொல்லாக உள்ளது.
- source_word: אֶחָד לְמֵאָה ... וְהַגָּדוֹל לְאָלֶף
  choice: மிகச் சிறியவன் நூறு பேருக்குச் சமமானவன், மிகப் பெரியவன் ஆயிரம் பேருக்குச் சமமானவன்
  rationale: எபிரெயத் தொடர் சுருக்கமானதும் நீள்விடுபாடு கொண்டதும் ஆகும். சூழலில் போர்த்திறன் அல்லது படை மதிப்பைக் குறிக்கும் சாத்தியத்தைத் தெளிவாகவும், எண்ணியல் விகிதத்தைப் பேணியும் தருகிறது.
theological_decisions:
- issue: ‘ஒருவன் நூறுக்கு; பெரியவன் ஆயிரத்துக்கு’ என்ற சுருக்கத் தொடரின் பொருள்
  choice: போர்த்திறன் அல்லது படை மதிப்பில் முறையே நூறு, ஆயிரம் பேருக்குச் சமமானவர்கள் என முதன்மை உரையில் தரப்பட்டது.
  alternative: ஒவ்வொருவரும் முறையே நூறு அல்லது ஆயிரம் வீரர்களுக்குத் தலைமை தாங்கினர் என்று பொருள் கொள்ளலாம்.
  rationale: மூல எபிரெயம் தொடர்பை வெளிப்படையாகக் கூறவில்லை. உடனடியான சூழல் இவர்களின் வீரத்திறனை வலியுறுத்துவதால் ‘சமமானவன்’ என்பது பொருத்தமானது; எனினும் படைத்தலைமை குறித்த மாற்றுப் புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘காத்’ என்ற கோத்திரப் பெயரும் ‘படைத்தலைவர்கள்’ என்ற தெளிவான இராணுவச் சொல்லும் பயன்படுத்தப்பட்டுள்ளன; மூலத்தின் சுருக்கத்தால் தோன்றும் ambiguity அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
