revisions:
- from: இவர்கள் காதின் மக்களில் படைத்தலைவர்களாக இருந்தார்கள்; அவர்களில் மிகச் சிறியவன் நூறு பேருக்குச் சமமானவன், மிகப் பெரியவன் ஆயிரம் பேருக்குச் சமமானவன்.[a]
  to: இவர்கள் காத் கோத்திரத்தின் மக்களில் படைத்தலைவர்களாக இருந்தார்கள்; அவர்களில் மிகவும் குறைந்தவனும் நூறு பேருக்குச் சமமானவன், மிகவும் உயர்ந்தவன் ஆயிரம் பேருக்குச் சமமானவன்.[a]
  rationale: The revision preserves the contextual interpretation that each man’s effectiveness corresponded to a hundred or a thousand, while making the Tamil comparative language less physical and correcting the tribal-name form. The footnote now accurately presents the Hebrew’s compressed, disputed construction and retains the alternative command-size interpretation without treating either expansion as explicit in the source.
