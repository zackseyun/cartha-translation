revisions:
- from: இவர்கள் அனைவரும் போர்வீரர்கள்; போரணியை அமைப்பவர்கள். இவர்கள் முழு மனதோடு எப்ரோனுக்கு வந்து, தாவீதை இஸ்ரவேல் முழுவதற்கும் அரசனாக்கினார்கள். இஸ்ரவேலில் எஞ்சியிருந்த அனைவரும் தாவீதை அரசனாக்குவதில் ஒரே மனதுடன் இருந்தார்கள்.[a]
