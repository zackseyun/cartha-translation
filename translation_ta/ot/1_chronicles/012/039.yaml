base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/039.yaml
  text: All these were men of war[a], arrayed for battle, who came to Hebron with a whole heart to make David king over all Israel; and also all the rest of Israel were of one heart to make David king.
translation:
  language: ta
  text: இவர்கள் அனைவரும் போர்வீரர்கள்; போருக்காக அணிவகுத்தவர்கள். இவர்கள் முழு மனதோடு எப்ரோனுக்கு வந்து, இஸ்ரவேல் முழுவதற்கும் தாவீதை அரசனாக்குவதற்காக வந்தார்கள். இஸ்ரவேலின் மற்ற அனைவரும் தாவீதை அரசனாக்க ஒரே மனதுடன் இருந்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இஸ்ரவேலின் மீதியானோர் அனைவரும்” என்றும் மொழிபெயர்க்கலாம். இங்கு அந்தச் சொல், முன்பு குறிப்பிடப்பட்டவர்களைத் தவிர இஸ்ரவேலின் மற்ற அனைவரையும் குறிப்பதாகத் தெரிகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי מִלְחָמָה
  choice: போர்வீரர்கள்
  rationale: எபிரெயக் கூட்டுச்சொல் நேரடியாகப் போர் செய்யும் ஆண்களைக் குறிக்கிறது. நவீன தமிழில் ‘போர்வீரர்கள்’ இயல்பாகவும் இராணுவப் பொருளைத் தெளிவாகவும் தருகிறது.
- source_word: עֹדְרֵי מַעֲרָכָה
  choice: போரணியை அமைப்பவர்கள்
  rationale: இப்பங்கேற்பு வடிவம் போருக்கான அணிவகுப்பை அல்லது போர்வரிசையை அமைப்பதைக் குறிக்கிறது; வெறுமனே ‘போருக்குத் தயாரானவர்கள்’ என்பதைவிட மூலத்தின் அணியமைப்பு நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: בְּלֵבָב שָׁלֵם
  choice: முழு மனதோடு
  rationale: முழுமையான, பிளவுபடாத உள்ளார்ந்த நோக்கத்தை வெளிப்படுத்துகிறது; ‘மனம்’ என்ற மூல உருவகத்தையும் இயல்பான தமிழையும் காக்கிறது.
- source_word: בָּאוּ חֶבְרוֹנָה
  choice: எப்ரோனுக்கு வந்து
  rationale: இடப்பெயரின் திசைச் சுட்டு எப்ரோனை நோக்கிய நகர்வைக் குறிக்கிறது; தமிழில் ‘எப்ரோனுக்கு வந்து’ என்பது நேரான இயல்பான மொழிபெயர்ப்பு.
- source_word: לְהַמְלִיךְ אֶת דָּוִיד
  choice: தாவீதை அரசனாக்கினார்கள்
  rationale: המליך ஒருவரை ஆட்சி செய்யச் செய்வது அல்லது அரசனாக நிறுவுவது என்ற பொருள் தருகிறது. ‘முடிசூட்டினார்கள்’ என்று மொழிபெயர்ப்பது மூலத்தில் வெளிப்படையாக இல்லாத சடங்கைச் சேர்க்கலாம்.
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: இஸ்ரவேல் முழுவதற்கும்
  rationale: தேசம் முழுவதின் மீதான தாவீதின் அரசாட்சியை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: כָּל שֵׁרִית יִשְׂרָאֵל
  choice: இஸ்ரவேலில் எஞ்சியிருந்த அனைவரும்
  rationale: இச்சரித்திரச் சூழலில் שֵׁרִית முன்பு பட்டியலிடப்பட்டவர்களைத் தவிர்த்த இஸ்ரவேலின் மற்ற அனைவரையும் குறிக்கிறது; தீர்க்கதரிசன நூல்களுக்குரிய தொழில்நுட்பமான ‘மீதியானோர்’ கருத்தைத் தேவையின்றி ஏற்றுவதில்லை.
- source_word: לֵב אֶחָד
  choice: ஒரே மனதுடன்
  rationale: ஒன்றுபட்ட நோக்கத்தைச் சுட்டும் ‘ஒரே இருதயம்’ என்ற எபிரெய உருவகத்தை, நவீன தமிழில் இயல்பான ‘ஒரே மனதுடன்’ எனக் கொடுக்கிறது.
theological_decisions:
- issue: שֵׁרִית என்பதிலுள்ள ‘மீதியானோர்’ என்ற இறையியல் சாத்தியம்
  choice: இஸ்ரவேலில் எஞ்சியிருந்த அனைவரும்
  alternative: இஸ்ரவேலின் மீதியானோர் அனைவரும்
  rationale: உடனடிச் சூழல் தாவீதுக்கு நாடு முழுவதும் கிடைத்த ஆதரவைச் சுருக்கிக் கூறும் வரலாற்றுக் கதை. எனவே தீர்க்கதரிசன நூல்களில் காணப்படும் சிறப்பான ‘மீதியானோர்’ இறையியல் கருத்தை இங்கு முன்னிறுத்தாமல், சூழலுக்குரிய ‘மற்ற அனைவரும்’ என்ற பொருளைத் தேர்ந்தெடுக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘முழு மனதோடு’ மற்றும் ‘ஒரே மனதுடன்’ என்பவற்றால் மூலத்தின் இருதய உருவகமும், தனிப்பட்ட முழுமையும் தேசிய ஒருமைப்பாடும் வேறுபடுத்திப் பாதுகாக்கப்பட்டுள்ளன.
