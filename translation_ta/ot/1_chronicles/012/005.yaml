lexical_decisions:
- source_word: יִרְמְיָה
  choice: எரேமியா
  rationale: எபிரெய தனிப்பெயர்; நவீனத் தமிழில் பரவலாக அறியப்படும் வேதாகமப் பெயர் வடிவம் பயன்படுத்தப்பட்டது.
- source_word: יַחֲזִיאֵל
  choice: யகாசியேல்
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் இயல்பாகக் காட்டும் மரபான எழுத்துப்பெயர்ப்பு.
- source_word: יוֹחָנָן
  choice: யோகனான்
  rationale: எபிரெய தனிப்பெயரின் சுருக்கமான வடிவத்தையும் அடையாளம் காணத்தக்க ஒலியையும் பாதுகாக்கும் தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: יוֹזָבָד
  choice: யோசபாத்
  rationale: எபிரெய தனிப்பெயருக்கான தமிழில் அறிமுகமான, இயல்பான எழுத்துப்பெயர்ப்பு.
- source_word: הַגְּדֵרָתִי
  choice: கெதேராத்தியனான
  rationale: இவ்வினப்பெயர் யோசபாத்தை அவர் வந்த இடம் அல்லது குலத் தொடர்பால் அடையாளப்படுத்துகிறது; மூலத்தின் குறிப்பான இன/இடச் சார்பு வடிவத்தைத் தெளிவாகப் பாதுகாக்கிறது.
