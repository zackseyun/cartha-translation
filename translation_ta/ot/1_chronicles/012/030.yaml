base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/030.yaml
  text: And from the sons of Benjamin[a], Saul’s brothers, three thousand[b]; until then most of them had been keeping watch over the house of Saul.
translation:
  language: ta
  text: பென்யமீனின் மக்களில், சவுலின் சகோதரர்கள்[a] மூவாயிரம் பேர்; அதுவரை அவர்களில் பெரும்பாலோர் சவுலின் வீட்டுக்கான[b] காவல் பொறுப்பை நிறைவேற்றிவந்தனர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சவுலின் உறவினர்கள்” அல்லது “சவுலின் குலத்தவர்கள்” என்றும் பொருள் கொள்ளலாம். “சகோதரர்கள்” என்பதற்கான எபிரெயச் சொல் உடன்பிறந்தவர்களை மட்டுமல்லாமல் விரிவான உறவுக் குழுவையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “சவுலின் வீடு” என்பது சவுலின் குடும்பத்தையோ வீட்டாரையோ, அல்லது அவரது அரச மரபையும் அதன் நலன்களையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן בְּנֵי בִנְיָמִן
  choice: பென்யமீனின் மக்களில்
  rationale: தொடர்ந்து வரும் எண்ணிக்கைப் பட்டியலின் அமைப்பையும் எபிரெய குலவழக்கு மொழியையும் இயல்பான தமிழில் காக்கிறது.
- source_word: אֲחֵי שָׁאוּל
  choice: சவுலின் சகோதரர்கள்
  rationale: அடிப்படைப் பொருளான ‘சகோதரர்கள்’ என்பதைக் காக்கிறது; இங்கு அது நெருங்கிய உடன்பிறந்தோரைத் தாண்டி உறவினர் அல்லது ஒரே குலத்தவரைக் குறிக்கக்கூடும் என்பதால் அடிக்குறிப்பு சேர்க்கப்பட்டுள்ளது.
- source_word: שְׁלֹשֶׁת אֲלָפִים
  choice: மூவாயிரம் பேர்
  rationale: எண்ணிக்கையைத் தெளிவாகத் தருவதோடு, மனிதர்களைக் குறிக்கும் இயல்பான தமிழ் எண்ணுமுறையைப் பயன்படுத்துகிறது.
- source_word: וְעַד הֵנָּה
  choice: அதுவரை
  rationale: வாசகரின் நிகழ்காலத்தை அல்லாமல், விவரிக்கப்படும் வரலாற்றுக் கட்டம் வரையிலான காலத்தைக் குறிக்கிறது.
- source_word: מַרְבִּיתָם
  choice: அவர்களில் பெரும்பாலோர்
  rationale: அந்தக் குழுவின் பெரும்பான்மையைக் குறிக்கும் எபிரெயச் சொல்லைத் தெளிவான நவீன தமிழில் வழங்குகிறது.
- source_word: שֹׁמְרִים מִשְׁמֶרֶת
  choice: காவல் பொறுப்பை நிறைவேற்றிவந்தனர்
  rationale: தொடர்ந்து மேற்கொள்ளப்பட்ட காவல் அல்லது ஒப்படைக்கப்பட்ட கடமையைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; ‘வந்தனர்’ என்பது அதுவரை நீடித்த நிலையைக் காட்டுகிறது.
- source_word: בֵּית שָׁאוּל
  choice: சவுலின் வீட்டுக்கான
  rationale: ‘வீடு’ என்ற எபிரெய உருவகத்தின் அகலத்தை ஓரளவு காக்கிறது; அது குடும்பம், வீட்டார் அல்லது அரச மரபின் நலன் ஆகியவற்றைக் குறிக்கக்கூடும்.
theological_decisions:
- issue: சவுலின் ‘சகோதரர்கள்’ என்பதன் உறவுப்பரப்பு
  choice: முதன்மை உரையில் ‘சகோதரர்கள்’ என்று மொழிபெயர்த்து, விரிவான உறவுப் பொருளை அடிக்குறிப்பில் தருதல்
  alternative: சவுலின் உறவினர்கள்
  rationale: எபிரெயச் சொல்லின் நேரடிப் பொருளைக் காக்கும்போதே, அது உடன்பிறந்தவர்களுக்கு மட்டும் கட்டுப்படாது என்ற உண்மையான தெளிவின்மையையும் பாதுகாக்கிறது.
- issue: ‘சவுலின் வீடு’ என்பதன் குறிப்பு
  choice: ‘சவுலின் வீட்டுக்கான’ என்று வைத்து, பல சாத்தியப் பொருள்களை அடிக்குறிப்பில் குறிப்பிடுதல்
  alternative: சவுலின் அரச வம்சத்துக்கான
  rationale: ‘அரச வம்சம்’ என்று மட்டும் கூறுவது குடும்பம், வீட்டார், அரச மரபு அல்லது அதன் நலன்கள் ஆகிய எபிரெயச் சொல்லின் விரிவைத் தேவையின்றி குறுக்கும்.
translation_notes:
  register: நவீன செந்தமிழ் நடையில், பட்டியல் சார்ந்த சுருக்கமான வாக்கிய அமைப்பு காக்கப்பட்டுள்ளது. ‘காவல் பொறுப்பை நிறைவேற்றிவந்தனர்’ என்பது சொற்சொல்லான மீளுரைப்பைத் தவிர்த்து, தொடர்ச்சியான காவல்/கடமை என்ற மூலப்பொருளை இயல்பாக வழங்குகிறது.
