source:
  edition: WLC
  text: בְּ/לֶכְתּ֣/וֹ אֶל צִֽיקְלַ֗ג נָפְל֣וּ עָלָ֣י/ו מִֽ/מְּנַשֶּׁ֡ה עַ֠דְנַח וְ/יוֹזָבָ֤ד וִ/ידִֽיעֲאֵל֙ וּ/מִיכָאֵ֣ל וְ/יוֹזָבָ֔ד וֶ/אֱלִיה֖וּא וְ/צִלְּתָ֑י רָאשֵׁ֥י הָ/אֲלָפִ֖ים אֲשֶׁ֥ר לִ/מְנַשֶּֽׁה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/021.yaml
  text: 'As he went to Ziklag[a], some from Manasseh defected to him: Adnah, Jozabad, Jediael, Michael, another Jozabad, Elihu, and Zillethai[c][b], chiefs of the thousands that belonged to Manasseh.'
translation:
  language: ta
  text: 'அவன் சிக்லாகுக்குப் போய்க்கொண்டிருந்தபோது, மனாசேயைச் சேர்ந்த சிலர் அவன் பக்கம் சேர்ந்தார்கள்[a]: அத்னாக், யோசபாத், யெதியாயேல், மிகாயேல், யோசபாத்[b], எலிகூ, சில்லெத்தாய். இவர்கள் மனாசேயின் ஆயிரப்பிரிவுகளுக்குத் தலைவர்கள்[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேய மொழியில் சொல்லுக்குச் சொல், “அவன்மேல் விழுந்தார்கள்.” இது அவர்கள் தாவீதின் தரப்புக்கு மாறிச் சேர்ந்தார்கள் என்று பொருள்படும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: யோசபாத் என்ற பெயர் எபிரேயப் பட்டியலில் இருமுறை வருகிறது; ஒரே பெயரைக் கொண்ட இரு வேறு ஆட்களை இது குறிக்கிறது.
    reason: cultural_note
  - marker: c
    text: “ஆயிரப்பிரிவுகளுக்குத் தலைவர்கள்” என்பது ஆயிரம் பேர் கொண்ட இராணுவ அணிகளின் தளபதிகளையோ மனாசேயின் குலப்பிரிவுத் தலைவர்களையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּלֶכְתּוֹ
  choice: அவன் ... போய்க்கொண்டிருந்தபோது
  rationale: בְּ + வினையெச்சப் பெயரின் காலப்பொருளை இயல்பான நவீனத் தமிழில் காட்டுகிறது; பயணம் நடந்துகொண்டிருந்த சூழலையும் தக்கவைக்கிறது.
- source_word: אֶל צִיקְלַג
  choice: சிக்லாகுக்குப்
  rationale: אֶל இங்கு சென்றடைய வேண்டிய இடத்தைச் சுட்டுகிறது; தமிழ் வேற்றுமையுருபுடன் இடப்பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: נָפְלוּ עָלָיו
  choice: அவன் பக்கம் சேர்ந்தார்கள்
  rationale: சொல்லுக்குச் சொல் ‘அவன்மேல் விழுந்தார்கள்’ என்பதல்ல; இராணுவ-அரசியல் சூழலில் ஒருவருடைய தரப்புக்கு மாறிச் சேர்வதைக் குறிக்கும் எபிரேய மரபுத்தொடரை இயல்பாகத் தருகிறது. ‘துரோகம் செய்து கட்சி மாறினார்கள்’ என்பது மூலத்தில் வெளிப்படையாக இல்லாத எதிர்மறை மதிப்பீட்டைச் சேர்க்கக்கூடும்.
- source_word: מִמְּנַשֶּׁה
  choice: மனாசேயைச் சேர்ந்த சிலர்
  rationale: கோத்திர அல்லது குழுச் சார்பைத் தெளிவாக்குகிறது; ‘சிலர்’ என்பது பின்வரும் பெயர்ப்பட்டியலை இயல்பாக அறிமுகப்படுத்துகிறது.
- source_word: עַדְנַח וְיוֹזָבָד וִידִיעֲאֵל וּמִיכָאֵל וְיוֹזָבָד וֶאֱלִיהוּא וְצִלְּתָי
  choice: அத்னாக், யோசபாத், யெதியாயேல், மிகாயேல், யோசபாத், எலிகூ, சில்லெத்தாய்
  rationale: ஆள்பெயர்கள் எபிரேய வடிவங்களுக்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளன. யோசபாத் என்ற பெயர் மூலத்தில் இருமுறை வருவதால் உரையிலும் இருமுறை வைக்கப்பட்டுள்ளது.
- source_word: רָאשֵׁי הָאֲלָפִים
  choice: ஆயிரப்பிரிவுகளுக்குத் தலைவர்கள்
  rationale: רָאשֵׁי என்பதன் தலைமைப் பொருளையும் אֲלָפִים என்பதன் நேரடி ‘ஆயிரங்கள்’ வடிவத்தையும் தக்கவைக்கிறது; இவை இராணுவ அணிகளா குலப்பிரிவுகளா என்பதை அடிக்குறிப்பு திறந்த நிலையில் வைக்கிறது.
- source_word: אֲשֶׁר לִמְנַשֶּׁה
  choice: மனாசேயின் ... தலைவர்கள்
  rationale: இந்தத் தலைவர்களின் அமைப்பு அல்லது கோத்திரச் சார்பைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது.
