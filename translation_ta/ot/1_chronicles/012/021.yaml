translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. எபிரேய மரபுத்தொடர் பொருளோடு மொழிபெயர்க்கப்பட்டு அதன் நேரடி வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது. பெயர்ப்பட்டியலின் மறுபெயரும் ‘ஆயிரப்பிரிவுகள்’ என்பதிலுள்ள அமைப்பியல் தெளிவின்மையும் திருத்தப்படாமல் பாதுகாக்கப்பட்டுள்ளன.
