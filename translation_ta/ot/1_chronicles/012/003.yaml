  register: நவீன நிலையான தமிழ்; பெயர்ப்பட்டியலின் சுருக்கம் காக்கப்பட்டுள்ளது. அரிதான குடியினப் பெயர்ச்சொற்களுக்கு பதிலாக ‘ஊரானான’ என்ற தெளிவான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் வினையற்ற தொடக்க வாக்கியம் தமிழில் இயல்பாகவே வினையின்றி வைக்கப்பட்டுள்ளது.
