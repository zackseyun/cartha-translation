base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/003.yaml
  text: The chief was Ahiezer[a], then Joash, the sons of Shemaah the Gibeathite; and Jeziel and Pelet, the sons of Azmaveth[b]; and Beracah and Jehu the Anathothite.
translation:
  language: ta
  text: தலைவன் அகியேசர்; அடுத்து யோவாஸ்—கிபியாவைச் சேர்ந்த செமாயாவின் மகன்கள்; மேலும் அஸ்மாவேத்தின் மகன்களான யெசியேலும்[a] பேலேத்தும்; பெராகாவும்[b] ஆனதோத்தைச் சேர்ந்த யெகூவும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இப்பெயரை «இசியேல்» என்றும் பெயர்த்தெழுதலாம்.
    reason: lexical_alternative
  - marker: b
    text: இப்பெயரை «பெராக்கா» என்றும் பெயர்த்தெழுதலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרֹאשׁ
  choice: தலைவன்
  rationale: பெயர்ப்பட்டியல் சூழலில் רֹאשׁ என்பது உடலின் ‘தலை’ அல்ல, குழுவின் முதன்மையானவரைக் குறிக்கிறது.
- source_word: אֲחִיעֶזֶר
  choice: அகியேசர்
  rationale: எபிரெய ஒலியமைப்பை நவீனத் தமிழில் இயல்பாகப் பெயர்த்தெழுதிய வடிவம்.
- source_word: וְיוֹאָשׁ
  choice: அடுத்து யோவாஸ்
  rationale: וְ என்பதன் அடிப்படைப் பொருள் ‘மற்றும்’; இங்கு தலைவனுக்குப் பின் வரும் பெயரைத் தெளிவாகக் காட்ட ‘அடுத்து’ என இயல்பாக்கப்பட்டுள்ளது.
- source_word: בְּנֵי הַשְּׁמָעָה
  choice: செமாயாவின் மகன்கள்
  rationale: בְּנֵי என்பது வழக்கமான வம்சப்பட்டியல் சொற்றொடர்; הַשְּׁמָעָה இங்கு தனிப்பெயராக எடுத்துக்கொள்ளப்பட்டுள்ளது.
- source_word: הַגִּבְעָתִי
  choice: கிபியா ஊரானான
  rationale: கிபியாவைச் சேர்ந்தவர் என்ற பூர்வீக/ஊரடையாளத்தை சாதாரண தமிழ் வாசகருக்குத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ויזואל
  choice: எயேசியேல்
  rationale: மசோரா உயிர்க்குறிகள் இல்லாத இவ்வடிவத்தின் தொடக்க எழுத்தாக்கத்தில் மாறுபாடு உள்ளது; தமிழ் வேதாகமப் பெயர்மரபிற்கு ஏற்ற வடிவம் முதன்மை உரையில் தரப்பட்டுள்ளது.
- source_word: וָפֶלֶט
  choice: பேலேத்
  rationale: தனிப்பெயரை எபிரெய ஒலிக்கு அண்மையாகத் தமிழ் எழுத்தில் வழங்குகிறது.
- source_word: בְּנֵי עַזְמָוֶת
  choice: அஸ்மாவேத்தின் மகன்கள்
  rationale: வம்ச உறவை நேரடியாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: וּבְרָכָה
  choice: பெராக்கா
  rationale: தனிப்பெயரின் כ ஒலியை இச்சூழலில் ‘க்க’ எனப் பெயர்த்தெழுதுகிறது; மாற்று எழுத்தாக்கம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: וְיֵהוּא
  choice: யெகூ
  rationale: எபிரெய יֵהוּא பெயரின் ஒலியமைப்புக்கு அண்மையான தமிழ் வடிவம்.
- source_word: הָעֲנְּתֹתִי
  choice: ஆனதோத் ஊரானான
  rationale: ஆனதோத்தைச் சேர்ந்தவர் என்ற ஊரடையாளத்தை இயல்பான நவீனத் தமிழில் தருகிறது.
