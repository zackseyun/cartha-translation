  text: Eluzai[a], Jerimoth, Bealiah, Shemariahu, and Shephatiah the Haruphite.
translation:
  language: ta
  text: எலூசாய், யெரிமோத், பெயலியா, செமரியாஹு, ஹரூப்பியனாகிய செபத்தியாஹு[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஹரீப்பியன்.” எபிரெய குல அடைமொழி, வேறு இடங்களில் ‘ஹரீப்’ என்ற வடிவில் காணப்படும் குலப்பெயரைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶלְעוּזַי
  choice: எலூசாய்
  rationale: தனிப்பட்ட பெயர்; எபிரெய ஒலிவடிவத்துக்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: וִירִימוֹת
  choice: எரிமோத்
  rationale: முன்னொட்டு இணைப்புச்சொல்லை பட்டியல் நிறுத்தக்குறியால் வெளிப்படுத்தி, பெயரை எபிரெய ஒலிப்புக்கு ஏற்ப ஒலிபெயர்த்தது.
- source_word: וּבְעַלְיָה
  choice: பெயலியா
  rationale: தனிப்பட்ட பெயர்; בְעַלְיָה என்பதன் ஒலியமைப்பை இயல்பான தமிழ் எழுத்தாக்கத்தில் வழங்குகிறது.
- source_word: וּשְׁמַרְיָהוּ
  choice: செமரியாஹு
  rationale: பெயரின் முழுமையான -யாஹு முடிவைத் தக்கவைத்து, மூல எபிரெய வடிவத்தை நெருக்கமாகப் பிரதிபலிக்கிறது.
- source_word: וּשְׁפַטְיָהוּ
  choice: செபத்தியாஹு
  rationale: தனிப்பட்ட பெயரின் முழு எபிரெய -யாஹு முடிவைத் தக்கவைத்த ஒலிபெயர்ப்பு.
- source_word: הַחֲרִיפִי
  choice: ஆரீப்பியன்
  rationale: குறிப்பிட்ட குலம் அல்லது குடும்பத்தைச் சேர்ந்தவர் என்பதைக் காட்டும் எபிரெய இன/குல அடைமொழியைத் தமிழின் ‘-இயன்’ வடிவில் வழங்குகிறது.
