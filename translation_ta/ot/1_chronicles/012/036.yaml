  register: நவீன நிலையான தமிழில், கோத்திரப் படைவீரர் பட்டியலுக்கேற்ற சுருக்கமான மற்றும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் மறைமுகமாக உள்ள ‘மக்கள்/வீரர்கள்’ என்ற கருத்து தமிழில் ‘பேர்’ என்பதால் தெளிவாக்கப்பட்டுள்ளது; அடிக்குறிப்பு குறியீடு உரையிலேயே இடம்பெற்றுள்ளது.
