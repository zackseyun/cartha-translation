lexical_decisions:
- source_word: וּמִן הַדָּנִי
  choice: தாண் கோத்திரத்திலிருந்து
  rationale: எபிரெயச் சொற்றொடர் எழுத்துப்படி ‘தாணியரிடமிருந்து’ எனப் பொருள்பட்டாலும், இந்தக் கோத்திரவாரியான படைவீரர் பட்டியலில் இயல்பான நவீனத் தமிழுக்காக ‘தாண் கோத்திரத்திலிருந்து’ என்று மொழிபெயர்க்கப்பட்டது. தொடக்க இணைப்புச் சொல்லான וּ பட்டியலின் தொடர்ச்சியைக் குறிக்கிறது; தமிழில் அது தனியே வெளிப்படத் தேவையில்லை.
- source_word: עֹרְכֵי מִלְחָמָה
  choice: போருக்கு அணிவகுக்கத் தயாரானவர்கள்
  rationale: ערך என்ற வேரிலிருந்து வந்த பன்மை வினையெச்சம் போருக்காக வரிசைப்படுத்துதல் அல்லது போரணியில் நிற்றல் என்ற கருத்தைக் கொண்டது. இத்தேர்வு படை அணிவகுப்பையும் போர்த்தயார்நிலையையும் இணைத்துப் பாதுகாக்கிறது.
- source_word: עֶשְׂרִים וּשְׁמוֹנָה אֶלֶף וְשֵׁשׁ מֵאוֹת
  choice: 28,600 பேர்
  rationale: எபிரெய மூலத்தின் எண்ணிக்கை நேரடியாக எண் வடிவில் தரப்பட்டது; மனிதர்களைக் குறிக்கும் இயல்பான தமிழுக்காக ‘பேர்’ சேர்க்கப்பட்டது.
