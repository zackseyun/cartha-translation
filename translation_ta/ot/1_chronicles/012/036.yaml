  text: From Dan[a], twenty-eight thousand six hundred prepared for battle.
translation:
  language: ta
  text: தாண் கோத்திரத்திலிருந்து, போருக்கு அணிவகுத்த[a] 28,600 பேர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “போருக்குத் தயாராக இருந்தவர்கள்” அல்லது “போர் அணிவகுப்பை அமைத்தவர்கள்.” எபிரெய வினையெச்சத் தொடர் போருக்கான ஆயத்தநிலையையோ படை அணிவகுப்பையோ வலியுறுத்துகிறது.
