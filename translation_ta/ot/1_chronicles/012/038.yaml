base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/038.yaml
  text: And from beyond the Jordan[a], from the Reubenites, the Gadites, and the half-tribe of Manasseh, with every kind of military equipment for war, there were one hundred twenty thousand.
translation:
  language: ta
  text: யோர்தானுக்கு அப்பாலிருந்த ரூபனியர், காதியர், மனாசேயின் பாதிக் கோத்திரத்தார் ஆகியோரிடமிருந்து, போருக்கான எல்லாப் படைக்கலன்களோடும் ஒரு இலட்சத்து இருபதாயிரம் பேர் இருந்தனர்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யோர்தானின் மறுபக்கத்திலிருந்து.” எபிரெயச் சொற்றொடரைப் புவியியல் பார்வைக்கோணத்திற்கேற்ப “யோர்தானைக் கடந்த பகுதியிலிருந்து” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵעֵבֶר לַיַּרְדֵּן
  choice: யோர்தானுக்கு அப்பாலிருந்து
  rationale: מֵעֵבֶר என்பது யோர்தானின் மறுபக்கம் அல்லது அப்பால் உள்ள பகுதியைக் குறிக்கிறது. புவியியல் பார்வைக்கோணத்தைத் தேவையின்றி நிர்ணயிக்காமல், எபிரெயச் சொல்லாட்சியை இயல்பான தமிழில் காக்கிறது.
- source_word: מִן הָראוּבֵנִי וְהַגָּדִי וַחֲצִי שֵׁבֶט מְנַשֶּׁה
  choice: ரூபனியர், காதியர், மனாசேயின் பாதிக் கோத்திரத்தார் ஆகியோரில்
  rationale: எபிரெயத்தில் இனப்பெயர்கள் ஒருமை வடிவில் இருந்தாலும், இங்கு அவை குழுக்களைத் தொகுப்பாகக் குறிக்கின்றன. ‘பாதிக் கோத்திரத்தார்’ என்பது மனாசே கோத்திரத்தின் பாதிப் பகுதியைத் தெளிவாகக் காட்டுகிறது.
- source_word: בְּכֹל כְּלֵי צְבָא מִלְחָמָה
  choice: போருக்குரிய எல்லா வகையான படைக்கலன்களோடும்
  rationale: כְּלֵי என்பது கருவிகள் அல்லது உபகரணங்கள் என்ற பரந்த பொருளுடையது; இராணுவச் சூழலில் ஆயுதங்களையும் போர் உபகரணங்களையும் குறிக்கலாம். ‘படைக்கலன்கள்’ அந்த உறுதியான இராணுவப் பொருளை இயல்பாக வெளிப்படுத்துகிறது; ‘எல்லா வகையான’ என்பது בְּכֹל என்பதைக் காட்டுகிறது.
- source_word: מֵאָה וְעֶשְׂרִים אָלֶף
  choice: ஒரு இலட்சத்து இருபதாயிரம் பேர்
  rationale: எண்ணிக்கையை நவீனத் தமிழில் இயல்பாக வழங்குகிறது; மனிதர்களின் எண்ணிக்கை என்பதால் ‘பேர்’ சேர்க்கப்பட்டுள்ளது.
