revisions:
- from: யோர்தானுக்கு அப்பாலிருந்து[a], ரூபனியர், காதியர், மனாசேயின் பாதிக் கோத்திரத்தார் ஆகியோரில், போருக்குரிய எல்லா வகையான படைக்கலன்களோடும் வந்தவர்கள் ஒரு இலட்சத்து இருபதாயிரம் பேர்.
