translation_notes:
  register: நவீன நிலையான, கண்ணியமான தமிழ். மூல எபிரெயின் சுருக்கமான பட்டியல் நடையைப் பாதுகாத்தபடியே, தமிழில் புரியும்படி உள்ளார்ந்த ‘இருந்தனர்’ சேர்க்கப்பட்டுள்ளது. ‘தந்தைவழிக் குடும்பம்’ என்பது ‘தந்தையின் வீடு’ என்ற சொற்படி மொழிபெயர்ப்பைவிட சமூகப் பொருளை இயல்பாகத் தருகிறது.
