  yaml_path: translation/ot/1_chronicles/012/029.yaml
  text: And Zadok[a], a young man mighty in valor[b], and from his father’s house twenty-two commanders.
translation:
  language: ta
  text: சாதோக்கு—வீரமிக்க ஓர் இளைஞர்; அவருடைய தந்தைவழிக் குடும்பத்தில் இருபத்திரண்டு தலைவர்கள் இருந்தனர்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צָדוֹק
  choice: சாதோக்கு
  rationale: தனிப்பட்ட பெயர் என்பதால் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: נַעַר
  choice: இளைஞர்
  rationale: இந்த இராணுவப் பட்டியல் சூழலில் வயதில் இளைய ஆணைக் குறிக்கிறது; ‘ஊழியன்’ என்ற சாத்தியமான பொருள் இங்கு பொருந்துவது குறைவு.
- source_word: גִּבּוֹר חָיִל
  choice: வீரத்திறம் மிக்க
  rationale: வலிமையையும் போர்சார்ந்த வீரத்தையும் குறிக்கும் எபிரெயச் சொற்றொடரின் பொருளை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: בֵית אָבִיו
  choice: அவருடைய தந்தைவழிக் குடும்பம்
  rationale: தந்தை மரபைச் சார்ந்த குடும்பத்தையோ குலப் பிரிவையோ குறிக்கும் எபிரெய சமூகச் சொல்லாட்சியைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: שָׂרִים
  choice: தலைவர்கள்
  rationale: שָׂרִים என்பது தலைமை வகிப்பவர்களைக் குறிக்கிறது; இராணுவச் சூழலால் ‘தளபதிகள்’ என்பதும் சாத்தியம் என்றாலும், மூலத்தின் பரந்த பொருளை ‘தலைவர்கள்’ காக்கிறது.
- source_word: עֶשְׂרִים וּשְׁנָיִם
  choice: இருபத்திரண்டு
  rationale: எண்ணை இயல்பான தமிழில் நேரடியாக வழங்குகிறது.
- source_word: וְ
  choice: -உம்
  rationale: முந்தைய பட்டியல் குறிப்புடன் இதை இணைக்கும் எபிரெய இணைப்புச் சொல்லைத் தமிழின் இயல்பான இணைப்பு விகுதியால் காட்டுகிறது.
