base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/023.yaml
  text: For day by day they came to David to help him[a], until there was a great camp, like the camp of God.
translation:
  language: ta
  text: 'ஏனெனில், நாளுக்கு நாள் அவர்கள் தாவீதுக்கு உதவுவதற்காக அவரிடம் வந்துகொண்டே இருந்தார்கள்; தேவனுடைய பாளயத்தைப் போன்ற[a] ஒரு பெரும் பாளயம் உருவாகும்வரை.


    [a] “தேவனுடைய பாளயம்” என்பதை “தெய்வீகப் பாளயம்” அல்லது “வானுலகப் பாளயம்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொற்றொடர் சுருக்கமானதும் பல பொருள் நிழல்களை உணர்த்துவதுமானது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தேவனுடைய பாளயம்” என்பதை “தெய்வீகப் பாளயம்” அல்லது “வானுலகப் பாளயம்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொற்றொடர் சுருக்கமானதும் பல பொருள் நிழல்களை உணர்த்துவதுமானது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: சுற்றியுள்ள நிகழ்வோட்டத்தை விளக்கும் இணைப்பாக உள்ளது; காரண அல்லது விளக்கத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לְעֶת יוֹם בְּיוֹם
  choice: நாளுக்கு நாள்
  rationale: தொடர்ந்து ஒவ்வொரு நாளும் நிகழ்ந்த வருகையை நவீனத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: יָבֹאוּ
  choice: வந்துகொண்டிருந்தார்கள்
  rationale: கதைச் சூழலில் எபிரெய இறப்பல்லா வினைமுற்று மீண்டும் மீண்டும் நிகழ்ந்த கடந்தகாலச் செயலைக் குறிக்கிறது; தமிழின் தொடர்நிலை வடிவம் அந்தத் தன்மையைத் தெளிவாக்குகிறது.
- source_word: עַל דָּוִיד
  choice: அவரிடம்
  rationale: வருதல் என்ற வினையுடனும் உதவும் நோக்கத்துடனும் சேர்ந்து, தாவீதை நோக்கிய இயக்கத்தைக் குறிக்கிறது; பகைமையை அல்ல.
- source_word: לְעָזְרוֹ
  choice: தாவீதுக்கு உதவுவதற்காக
  rationale: பெயரெச்ச வினையுடன் இணைந்த பின்னொட்டு நோக்கத்தையும் தாவீதைச் சார்ந்த சுட்டுதலையும் தெரிவிக்கிறது.
- source_word: עַד לְמַחֲנֶה גָדוֹל
  choice: ஒரு பெரும் பாளயம் உருவாகும்வரை
  rationale: தொடர்ச்சியான வருகைகள் எட்டிய முடிவையோ அளவையோ ‘வரை’ என்ற அமைப்பால் காக்கிறது; தமிழில் வாக்கியம் முழுமையடைய ‘உருவாக’ என்பது வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: כְּמַחֲנֵה אֱלֹהִים
  choice: தேவனுடைய பாளயத்தைப் போன்ற
  rationale: எபிரெய உவமையையும் இறைச்சார்ந்த மர்மமிக்க ஒலிப்பையும் விளக்கிச் சுருக்காமல் தக்கவைக்கிறது.
theological_decisions:
- issue: כְּמַחֲנֵה אֱלֹהִים என்ற உவமையில் אֱלֹהִים என்பதன் பொருள்
  choice: தேவன்
  alternative: தெய்வீகமான / வானுலகத்தைச் சேர்ந்த
  rationale: இச்சொற்றொடர் இயல்பாக ‘தேவனுடைய பாளயம்’ எனப் பொருள்படுகிறது. இவ்வாறு மொழிபெயர்ப்பது எபிரெயச் சொற்றொடரின் இறையியல் ஒலிப்பையும், மிகப் பெரும் அல்லது பிரமிப்பூட்டும் அணிவகுப்பைக் குறிக்கும் சாத்தியத்தையும் தீர்மானித்துச் சுருக்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதாகப் புரியும், அதேவேளை வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மறைமுகப் பன்மை எழுவாயை ‘அவர்கள்’ என்று வைத்ததால், மூலத்தில் இல்லாத ‘ஆட்கள்’ அல்லது ‘வீரர்கள்’ போன்ற பெயர்ச்சொல் சேர்க்கப்படவில்லை.
