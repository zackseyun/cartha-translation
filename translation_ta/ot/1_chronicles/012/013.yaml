lexical_decisions:
- source_word: יֽוֹחָנָן
  choice: யோகானான்
  rationale: எபிரெயத் தனிப்பெயரை அதன் ஒலியமைப்புக்கு நெருக்கமாகத் தமிழில் எழுத்துப்பெயர்த்துள்ளது.
- source_word: הַ/שְּׁמִינִי
  choice: எட்டாமவன்
  rationale: பெயருக்கு முன்வரும் வரிசை எண்ணாக இயல்பான தமிழில் கொடுக்கப்பட்டுள்ளது; பட்டியலில் ஆண் நபரைக் குறிப்பதால் ‘அவன்’ வடிவம் பொருந்துகிறது.
- source_word: אֶלְזָבָד
  choice: எல்சாபாத்
  rationale: எபிரெயத் தனிப்பெயரை அதன் மெய்யொலிகளும் உயிரொலிகளும் இயன்றவரை தெளிவாகத் தெரியுமாறு தமிழில் எழுத்துப்பெயர்த்துள்ளது.
- source_word: הַ/תְּשִׁיעִי
  choice: ஒன்பதாமவன்
  rationale: முந்தைய தொடருக்கு இணையான வரிசை எண்ணாகவும், சுருக்கமான பட்டியல் நடையைத் தக்கவைக்கும் வகையிலும் மொழிபெயர்க்கப்பட்டுள்ளது.
