base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/009.yaml
  text: Some of the Gadites separated themselves to David at the stronghold in the wilderness[a], mighty warriors, men of the army for battle, able to handle shield and spear, whose faces were like the faces of lions[c][b], and who were as swift as gazelles on the mountains.
translation:
  language: ta
  text: காதியரில் சிலர் பிரிந்து, வனாந்தரத்தில் உள்ள அரணில் தாவீதிடம் வந்தார்கள்[a]. அவர்கள் வலிமைமிக்க வீரர்கள், போருக்கான படைவீரர்கள்; கேடயத்தையும் ஈட்டியையும் கையாளத் தெரிந்தவர்கள்[b]. அவர்களுடைய முகங்கள் சிங்கங்களின் முகங்களைப் போன்றிருந்தன; மலைகளில் வெளிமான்களைப் போல விரைந்து செல்லக்கூடியவர்கள்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வனாந்தர அரணை நோக்கித் தாவீதிடம் வந்தார்கள்.” எபிரேய முன்னிடைச்சொற்களின் தொடர், அரணை நோக்கிய நகர்வாகவோ அங்கு வந்து சேர்ந்ததாகவோ புரிந்துகொள்ளப்படலாம்.
    reason: alternative_reading
  - marker: b
    text: 'சொல்லுக்குச் சொல்: “கேடயத்தையும் ஈட்டியையும் ஒழுங்குபடுத்தியவர்கள்.” போருக்கு ஆயத்தமான, இந்த ஆயுதங்களைப் பயன்படுத்தத் திறமையுள்ள வீரர்களை இச்சொற்றொடர் குறிக்கிறது.'
    reason: lexical_alternative
  - marker: c
    text: “வெளிமான்கள்” என்பதற்கான எபிரேயச் சொல், வேகத்துக்கும் சுறுசுறுப்புக்கும் பெயர்பெற்ற மான்வகை விலங்குகளைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן הַגָּדִי
  choice: காதியரில் சிலர்
  rationale: מן என்பதும் ஒருமை இனப்பெயரான הַגָּדִי என்பதும் காத் கோத்திரத்தைச் சேர்ந்த அனைவரையும் அல்ல, அவர்களில் ஒரு பகுதியினரை இங்கு குறிக்கின்றன.
- source_word: נִבְדְּלוּ
  choice: பிரிந்து
  rationale: בדל என்பதன் நிஃபால் வடிவம் பிரிதல் அல்லது தம்மைப் பிரித்துக்கொள்ளுதல் என்ற பொருளைத் தருகிறது; அவர்களின் நோக்கத்தை மேலதிகமாக ஊகிக்காமல் அந்த நுணுக்கம் காக்கப்படுகிறது.
- source_word: אֶל דָּוִיד
  choice: தாவீதிடம் வந்தார்கள்
  rationale: אֶל என்பது தாவீதை நோக்கிய நகர்வைக் குறிக்கிறது. தமிழில் இயல்பாக அமைய ‘வந்தார்கள்’ சேர்க்கப்பட்டுள்ளது; சேர்ந்துகொண்டார்கள் என்ற சூழல்சார் கருத்து வெளிப்படையாகத் திணிக்கப்படவில்லை.
- source_word: לַמְצַד מִדְבָּרָה
  choice: வனாந்தரத்திலிருந்த அரணில்
  rationale: מְצַד என்பது பாதுகாப்பான அரண் அல்லது கோட்டை. மொத்த வாக்கியத்தில் அங்கு வந்து சேர்ந்த இடமாக இதை மொழிபெயர்ப்பது இயல்பானது; திசைநோக்கிய மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: גִּבֹּרֵי הַחַיִל
  choice: வலிமைமிக்க வீரர்கள்
  rationale: இது போராற்றலும் வலிமையும் கொண்ட தேர்ந்த வீரர்களைக் குறிக்கும் வழக்கமான இராணுவச் சொற்றொடர்; நவீன தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது.
- source_word: אַנְשֵׁי צָבָא לַמִּלְחָמָה
  choice: போருக்கான படைவீரர்கள்
  rationale: அவர்களின் இராணுவ அடையாளத்தையும் போருக்குரிய தகுதியையும் நெருக்கமாக வெளிப்படுத்துகிறது; ‘பயிற்சி பெற்றவர்கள்’ என்று மூலத்தில் இல்லாத கருத்தைச் சேர்ப்பதில்லை.
- source_word: עֹרְכֵי צִנָּה וָרֹמַח
  choice: கேடயத்தையும் ஈட்டியையும் கையாளத் தெரிந்தவர்கள்
  rationale: ערך என்பதன் அடிப்படை கருத்து ஒழுங்குபடுத்துதல் அல்லது போருக்கு ஆயத்தப்படுத்துதல். இச்சூழலில் ஆயுதங்களுடன் போரிடும் ஆயத்தத்தையும் திறமையையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וּפְנֵי אַרְיֵה פְּנֵיהֶם
  choice: அவர்களுடைய முகங்கள் சிங்கங்களின் முகங்களைப் போன்றிருந்தன
  rationale: எபிரேயத்தில் ‘முகம்’ திரும்பச் சொல்லப்படுவதையும் நேரடியான உவமையையும் இயன்றவரை காக்கிறது; ‘கடுமையானவர்கள்’ போன்ற விளக்கத்தைப் புகுத்தவில்லை.
- source_word: וְכִצְבָאִים עַל הֶהָרִים לְמַהֵר
  choice: மலைகளில் மான்களைப் போல விரைந்து செல்லக்கூடியவர்கள்
  rationale: צְבָאִים மலைப்பகுதியில் வேகமாக இயங்கும் மான்வகை விலங்குகளைக் குறிக்கிறது; לְמַהֵר வெளிப்படுத்தும் வேகம் உவமையோடு இயல்பாக இணைக்கப்பட்டுள்ளது.
