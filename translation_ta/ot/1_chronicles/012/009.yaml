translation_notes:
  register: நவீனத் தரமான, எளிதில் புரியும் கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. நீளமான எபிரேயப் பட்டியல் அரைப்புள்ளியால் தெளிவுபடுத்தப்பட்டுள்ளது. ‘பிரிந்து’ என்ற சொல் நிஃபால் வடிவின் பொருளைக் காக்கிறது; யாரிடமிருந்து பிரிந்தார்கள் என்பதைக் மூலத்தை மீறி வெளிப்படுத்தவில்லை. சிங்கமுக உவமையும் மான்களின் வேக உவமையும் விளக்கவுரையாக மாற்றாமல் நேரடியாக வைக்கப்பட்டுள்ளன.
