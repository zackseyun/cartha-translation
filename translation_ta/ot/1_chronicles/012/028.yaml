  text: וִ/יהוֹיָדָ֖ע הַ/נָּגִ֣יד לְ/אַהֲרֹ֑ן וְ/עִמּ֕/וֹ שְׁלֹ֥שֶׁת אֲלָפִ֖ים וּ/שְׁבַ֥ע מֵאֽוֹת׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/028.yaml
  text: and Jehoiada[a], the leader of Aaron, and with him three thousand seven hundred.
translation:
  language: ta
  text: ஆரோனின் தலைவரான யோயாதாவும்[a], அவரோடு மூவாயிரத்து எழுநூறு பேரும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆரோனுக்கான தலைவரான யோயாதா”; அதாவது, ஆரோனிய ஆசாரியக் குடும்பத்துடன் தொடர்புடைய தலைவர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיהוֹיָדָע
  choice: யோயாதாவும்
  rationale: இணைப்பிடைச்சொல்லான ו பட்டியல் தொடர்வதைக் காட்டுவதால், பெயருடன் ‘உம்’ சேர்க்கப்பட்டது. יהוידע என்ற பெயர் தமிழில் வழக்கமான வேதாகம வடிவமான ‘யோயாதா’ என ஒலிபெயர்க்கப்பட்டது.
- source_word: הַנָּגִיד
  choice: தலைவரான
  rationale: נָגִיד என்பது தலைவர், முதன்மையானவர் அல்லது ஆளுநர் எனப் பொருள்படலாம். இங்குள்ள குல மற்றும் படைப் பட்டியல் சூழலில் ‘தலைவர்’ என்பது இயல்பானதும் அரசப் பட்டத்தைத் தேவையின்றி உணர்த்தாததும் ஆகும்.
- source_word: לְאַהֲרֹן
  choice: ஆரோனியரின்
  rationale: לְ இங்கு திசையைக் காட்டாமல் ஆரோனோடும் அவரது ஆசாரியக் குடும்பத்தோடும் உள்ள தொடர்பைக் குறிக்கிறது. ‘ஆரோனியரின்’ என்பது அந்தக் குடும்பத்தின் பிரதிநிதித் தலைமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது; எபிரெயச் சொற்றொடரின் மாற்று நேரடி புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וְעִמּוֹ
  choice: அவரோடு
  rationale: யோயாதாவுடன் இருந்தவர்களின் எண்ணிக்கையை அறிமுகப்படுத்துகிறது. இயல்பான தமிழ் பட்டியல் அமைப்பிற்காக அடுத்துள்ள ‘உம்’ உடன் இணைக்கப்பட்டது.
- source_word: שְׁלֹשֶׁת אֲלָפִים וּשְׁבַע מֵאוֹת
  choice: மூவாயிரத்து எழுநூறு பேர்
  rationale: மூலத்தின் துல்லியமான 3,700 என்ற எண்ணிக்கை சொற்களால் தரப்பட்டது. சூழலில் எண்ணப்படுபவர்கள் மனிதர்கள் என்பதால் இயல்பான தமிழுக்காக ‘பேர்’ சேர்க்கப்பட்டது.
- source_word: ס
  choice: வசன உரையில் மொழிபெயர்க்கப்படவில்லை
  rationale: மசோரா உரையின் ס என்பது ஒரு மூடிய/சிறு பத்திப் பிரிவு குறியீடு; அது வசனத்தின் சொல் அல்ல.
theological_decisions:
- issue: לְאַהֲרֹן குறிக்கும் உறவு
  choice: ஆரோனியரின் தலைவர்
  alternative: ஆரோனுக்கான தலைவர் / ஆரோனின் தலைவர்
  rationale: சூழல் ஆரோனின் ஆசாரியக் குடும்பத்தை அல்லது ஆரோனியரைச் சுட்டுவதாகத் தெரிகிறது. எனினும் לְ என்பதன் உறவு நுட்பத்தை முழுவதும் ஒரே விதமாக நிர்ணயிக்காமல், மாற்று நேரடி வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமானதும் பொதுவாசகர்களுக்கு எளிதில் புரியத்தக்கதுமான நடை. முந்தைய வசனங்களின் பட்டியல் தொடர்ச்சியை ‘உம்’ அமைப்பு காக்கிறது. மூலத்தில் இயக்க வினை வெளிப்படையாக இல்லாவிட்டாலும், 12:23–37 பட்டியல் சூழலில் தமிழில் முழுமையான வாக்கியமாக அமைய ‘வந்தார்கள்’ சூழலிலிருந்து நிரப்பப்பட்டுள்ளது.
