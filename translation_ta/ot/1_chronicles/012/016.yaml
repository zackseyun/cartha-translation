base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/016.yaml
  text: These are the men who crossed the Jordan in the first month[a], when it was overflowing all its banks, and they put to flight all those in the valleys, to the east and to the west.
translation:
  language: ta
  text: முதல் மாதத்தில், யோர்தான் தன் கரைகளையெல்லாம் மீறிப் பெருக்கெடுத்து ஓடியபோது அதைக் கடந்தவர்கள் இவர்களே. இவர்கள் கிழக்கிலும் மேற்கிலும் உள்ள பள்ளத்தாக்குகளில் இருந்த அனைவரையும்[a] ஓடிப்போகச் செய்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில் சொல்லுக்கு சொல், “பள்ளத்தாக்குகள் அனைத்தையும்.” “ஓடிப்போகச் செய்தார்கள்” என்ற வினை மக்களைக் குறிப்பதால், பள்ளத்தாக்குகளில் இருந்தவர்கள் என்பது பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה הֵם
  choice: இவர்களே
  rationale: சுட்டுப்பெயரும் பதிலிடுபெயரும் சேர்ந்துள்ள வலியுறுத்தும் அடையாளப்படுத்தலை இயல்பான நவீனத் தமிழில் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר עָבְרוּ אֶת הַיַּרְדֵּן
  choice: யோர்தானைக் கடந்தவர்கள்
  rationale: עָבַר என்பதன் நேரடியான பொருளான ‘கடத்தல்/கடந்து செல்லுதல்’ என்பதையும் ஆற்றைக் கடக்கும் செயலையும் தெளிவாகத் தருகிறது.
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן
  choice: முதல் மாதத்தில்
  rationale: எபிரெய காலக் குறிப்பை நெருக்கமாகவும் இயல்பாகவும் மொழிபெயர்க்கிறது.
- source_word: וְהוּא מְמַלֵּא עַל כָּל גְּדִיתָיו
  choice: யோர்தான் தன் கரைகள் அனைத்தையும் கடந்து பெருக்கெடுத்து ஓடியபோது
  rationale: ஆறு வெள்ளப்பெருக்கில் தன் கரைகளை மீறிய நிலையைத் தெளிவான நவீனத் தமிழில் தெரிவிக்கிறது; ‘அது’ என்பதற்குப் பதில் ‘யோர்தான்’ என மீண்டும் கூறுவது தமிழில் குறிப்பு மயக்கத்தைத் தவிர்க்கிறது.
- source_word: וַיַּבְרִיחוּ
  choice: ஓடச்செய்தார்கள்
  rationale: ברח என்பதன் ஹிஃபில் வடிவிலுள்ள ‘தப்பியோடச் செய்தல்’ என்ற காரணவினைப் பொருளை நேரடியாகப் பாதுகாக்கிறது.
- source_word: אֶת כָּל הָעֲמָקִים
  choice: பள்ளத்தாக்குகள் அனைத்தையும் சேர்ந்தவர்களை
  rationale: சொல்லுக்கு சொல் ‘பள்ளத்தாக்குகள் அனைத்தையும்’ என்றாலும், ஓடச்செய்யப்பட்டவர்கள் அங்கிருந்த மக்கள் என்பதால் எபிரெய மொழியின் இடப்பெயர்-மக்கள் ஆகுபெயர்ப் பயன்பாட்டை வாசிக்கத்தக்க தமிழில் வெளிப்படுத்துகிறது.
- source_word: לַמִּזְרָח וְלַמַּעֲרָב
  choice: கிழக்கிலும் மேற்கிலும் உள்ள
  rationale: இரு திசைகளிலும் இருந்த பள்ளத்தாக்குகளையும் அவற்றைச் சேர்ந்த மக்களையும் குறிக்கும் எபிரெய திசைச்சொற்களை இயல்பாக இணைக்கிறது.
