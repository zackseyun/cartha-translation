translation_notes:
  register: நவீன நிலையான தமிழில், வரலாற்றுக் கதைநடைக்கு ஏற்ற கண்ணியமான ஆனால் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வலியுறுத்தல் ‘இவர்களே’ எனப் பாதுகாக்கப்பட்டுள்ளது; ஆகுபெயரான ‘பள்ளத்தாக்குகள்’ வாசிப்புத் தெளிவுக்காக மக்களைக் குறிக்கும் வகையில் மொழிபெயர்க்கப்பட்டு அடிக்குறிப்பில் நேரடி வடிவம் தரப்பட்டுள்ளது.
