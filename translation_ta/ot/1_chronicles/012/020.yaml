  text: וּ/מִֽ/מְּנַשֶּׁ֞ה נָפְל֣וּ עַל דָּוִ֗יד בְּ/בֹא֨/וֹ עִם פְּלִשְׁתִּ֧ים עַל שָׁא֛וּל לַ/מִּלְחָמָ֖ה וְ/לֹ֣א עֲזָרֻ֑/ם כִּ֣י בְ/עֵצָ֗ה שִׁלְּחֻ֜/הוּ סַרְנֵ֤י פְלִשְׁתִּים֙ לֵ/אמֹ֔ר בְּ/רָאשֵׁ֕י/נוּ יִפּ֖וֹל אֶל אֲדֹנָ֥י/ו שָׁאֽוּל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/020.yaml
  text: Some from Manasseh also defected to David when he came with the Philistines against Saul for battle[a], though they did not help them, because the lords of the Philistines, after taking counsel, sent him away, saying[b], “He may defect to his master Saul at the cost of our heads.”
translation:
  language: ta
  text: தாவீது பெலிஸ்தியர்களுடன் சவுலுக்கு எதிராகப் போரிடச் சென்றபோது, மனாசே கோத்திரத்தைச் சேர்ந்த சிலரும் தாவீதின் பக்கம் சேர்ந்தார்கள்[a]. ஆனால் அவர்கள் பெலிஸ்தியர்களுக்கு உதவவில்லை; ஏனெனில் பெலிஸ்தியத் தலைவர்கள் கலந்து ஆலோசித்தபின் தாவீதைத் திருப்பி அனுப்பி, “அவன் தன் எஜமானாகிய சவுலின் பக்கம் சேர்ந்துவிடுவானோ; அதற்கு நம் தலைகளையே விலையாகக் கொடுக்க வேண்டியிருக்கும்[b]” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் சொற்பட, “தாவீதின்மேல் விழுந்தார்கள்”; இந்த மரபுத்தொடர் ஒருவருடைய பக்கம் செல்வதை அல்லது அவரது அணியில் சேர்வதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெய மொழியில் சொற்பட, “நம் தலைகளோடு”; அதாவது, நம் உயிரையே விலையாகக் கொடுத்து அல்லது நமக்கே அழிவை வரவழைத்து என்பதாகும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִמְּנַשֶּׁה
  choice: மனாசே கோத்திரத்தைச் சேர்ந்த சிலரும்
  rationale: מן காட்டும் பகுதியெச்சப் பொருளை அடுத்த வசனத்தில் நபர்கள் பட்டியலிடப்படுவதற்கு ஏற்ப ‘சிலர்’ என்று வெளிப்படுத்துகிறது; ו additive force-ஐ ‘-உம்’ தருகிறது.
- source_word: נָפְלוּ עַל דָּוִיד
  choice: தாவீதின் பக்கம் சேர்ந்தார்கள்
  rationale: இராணுவ-அரசியல் சூழலில் இந்த எபிரெய மரபுத்தொடர் ஒருவரின் அணிக்குச் செல்வதைக் குறிக்கிறது; சொற்பொருளான ‘விழுந்தார்கள்’ இயல்பாகாது. ‘பக்கம் சேர்ந்தார்கள்’ துரோக நோக்கத்தை மிகைப்படுத்தாமல் அடிப்படை பொருளைக் காக்கிறது.
- source_word: בְּבֹאוֹ עִם פְּלִשְׁתִּים עַל שָׁאוּל לַמִּלְחָמָה
  choice: அவன் பெலிஸ்தியர்களுடன் சவுலுக்கு எதிராகப் போருக்குச் சென்றபோது
  rationale: ב + infinitive construct காலச் சூழலைக் குறிக்கிறது. בוא இங்கு இலக்கு நோக்கிய நகர்வைச் சுட்டுவதால் தமிழில் ‘சென்றபோது’ இயல்பாக உள்ளது; עַל பகைமைத் திசையை ‘எதிராக’ எனக் காட்டுகிறது.
- source_word: וְלֹא עֲזָרֻם
  choice: ஆனால் அவர்கள் பெலிஸ்தியர்களுக்கு உதவவில்லை
  rationale: வினையோடு இணைந்த மூன்றாம் நபர் ஆண்பால் பன்மைச் சுட்டு அருகிலுள்ள பெலிஸ்தியர்களைக் குறிப்பதாக எடுத்துக்கொள்ளப்படுகிறது; தமிழில் தெளிவுக்காக பெயர் மீண்டும் வழங்கப்படுகிறது.
- source_word: כִּי בְעֵצָה
  choice: ஏனெனில் ... கலந்து ஆலோசித்தபின்
  rationale: כִּי காரணத்தையும் בְעֵצָה ஆலோசனையால் ஏற்பட்ட முடிவையும் குறிக்கின்றன; தமிழில் நிகழ்வுகளின் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: שִׁלְּחֻהוּ
  choice: தாவீதைத் திருப்பி அனுப்பி
  rationale: Piel வடிவம் உடன் வந்த தாவீதைப் படையிலிருந்து அனுப்பிவிட்டதைக் குறிக்கிறது; ‘திருப்பி அனுப்பி’ சூழலையும் செயற்பொருளையும் தெளிவாக்குகிறது.
- source_word: סַרְנֵי פְלִשְׁתִּים
  choice: பெலிஸ்தியத் தலைவர்கள்
  rationale: சொல் பெலிஸ்திய ஆட்சியாளர்களுக்குரிய தனிப்பட்ட பட்டமாக இருந்தாலும், நவீன தமிழில் ‘தலைவர்கள்’ இயல்பாகவும் அரசியல்-இராணுவ அதிகாரத்தை மிகையாகக் குறுக்காமல் வெளிப்படுத்துகிறது.
- source_word: בְרָאשֵׁינוּ
  choice: நம் தலைகளையே விலையாகக் கொடுக்க வேண்டியிருக்கும்
  rationale: எபிரெய மொழியின் உயிரிழப்பு உருவகத்தை ‘தலைகள்’ எனக் காத்து, அதற்கான உயிர் விலையின் பொருளையும் தமிழில் தெளிவாக்குகிறது.
- source_word: יִפּוֹל אֶל אֲדֹנָיו שָׁאוּל
  choice: அவன் தன் எஜமானாகிய சவுலின் பக்கம் சேர்ந்துவிட்டால்
  rationale: נפל אל இங்கு அணி மாறிச் சேர்வதைக் குறிக்கிறது. அச்சத்தைக் காட்டும் imperfect-ஐ தமிழில் நிபந்தனை வடிவம் இயல்பாக வெளிப்படுத்துகிறது; אֲדֹנָיו அரசியல்/தனிப்பட்ட எஜமான உறவாக மொழிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: தாவீது உண்மையில் சவுலின் பக்கம் திரும்புவாரா என்பதன் முறைநிலை
  choice: “சேர்ந்துவிட்டால்” என்ற அச்சம்/சாத்திய நிபந்தனையாக மொழிபெயர்க்கப்பட்டது
  alternative: “சேர்ந்துவிடுவான்” என்ற உறுதியான எதிர்கால வாக்கியம்
  rationale: எபிரெய imperfect உரையாடல் சூழலில் பெலிஸ்தியத் தலைவர்களின் அச்சத்தை வெளிப்படுத்தலாம்; நிகழப்போவது உறுதி என்று உரை தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் dignified நடையில் அமைக்கப்பட்டது. நீளமான எபிரெய வாக்கியம் தெளிவுக்காக மூன்று தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டது. ‘எஜமான்’ என்பது இங்கு இறையியல் பட்டமல்ல; தாவீதின் முன்னைய அரசியல் விசுவாச உறவைக் குறிக்கிறது.
