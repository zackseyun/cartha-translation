  register: நவீனத் தரத் தமிழில் சுருக்கமான பட்டியல் நடையைக் காத்து, மூலத்தில் ஒவ்வொரு பெயருக்கும் முன் வரும் தலைமைப் பட்டம் மீண்டும் மீண்டும் தரப்பட்டுள்ளது. தேவையற்ற ஆங்கில ஒலிபெயர்ப்பு வேறுபாடு குறித்த குறிப்புகள் தமிழில் சேர்க்கப்படவில்லை.
