base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/051.yaml
  text: 'Hadad died[a], and the chiefs of Edom were: Chief Timna, Chief Aliah[c][b], Chief Jetheth.'
translation:
  language: ta
  text: 'ஹதாத் இறந்தான். ஏதோமின் குலத்தலைவர்கள்[a] இவர்களே: குலத்தலைவர் திம்னா, குலத்தலைவர் அலியா[b], குலத்தலைவர் யெதேத்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கே “குலத்தலைவர்” என்பது ஏதோமியக் குலம் அல்லது இனக்குழுவின் தலைவரைக் குறிக்கிறது; பழைய மொழிபெயர்ப்புகள் சிலவற்றில் இதற்குப் “பிரபு” போன்ற பட்டங்கள் வழங்கப்பட்டுள்ளன.
    reason: lexical_alternative
  - marker: b
    text: ஆதியாகமம் 36:40-இல் இதற்கு இணையான பெயர் “அல்வா” என்று உள்ளது; நாளாகமத்தின் எபிரெய வாசகம் இங்கே “அலியா” என்று உள்ளது.
    reason: textual_variant
lexical_decisions:
- source_word: וַיָּמָת
  choice: இறந்தான்
  rationale: מות என்பதன் தொடர்நிகழ்வைக் குறிக்கும் வினை வடிவம்; தமிழில் இயல்பான இறந்தகால வினையாகத் தரப்பட்டுள்ளது.
- source_word: הֲדָד
  choice: ஹதாத்
  rationale: எபிரெயப் பெயரின் மெய்யொலிகளை நெருக்கமாகக் காட்டும் தமிழ் ஒலிபெயர்ப்பு.
- source_word: וַיִּהְיוּ
  choice: இவர்களே
  rationale: அடுத்து வரும் பட்டியலை அறிமுகப்படுத்தும் היה வினையின் இச்சூழல் செயல்பாட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אַלּוּפֵי / אַלּוּף
  choice: குலத்தலைவர்கள் / குலத்தலைவர்
  rationale: ஏதோமியக் குல அல்லது இனக்குழுத் தலைவர்களைக் குறிக்கும் சொல்லாக இங்கு வருகிறது; மூலத்தில் ஒவ்வொரு பெயருக்கும் முன் பட்டம் திரும்ப வருவதையும் மொழிபெயர்ப்பு காக்கிறது.
- source_word: אֱדוֹם
  choice: ஏதோம்
  rationale: தமிழில் நிலைபெற்ற வேதாகமப் பெயர் வடிவம்.
- source_word: תִּמְנָע
  choice: திம்னா
  rationale: இவ்வசனத்திலுள்ள எபிரெயப் பெயரின் நேரிய தமிழ் ஒலிபெயர்ப்பு.
- source_word: עליה
  choice: அலியா
  rationale: நாளாகமத்தில் உள்ள எழுத்து வடிவத்தைப் பின்பற்றும் ஒலிபெயர்ப்பு; ஆதியாகம இணைப்பகுதியின் வேறுபட்ட பெயர் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: יְתֵת
  choice: யெதேத்
  rationale: எபிரெயப் பெயரின் ஒலியைத் தமிழில் நெருக்கமாகக் காட்டும் வடிவம்.
