    reason: textual_variant
lexical_decisions:
- source_word: וּבְנֵי לוֹטָן
  choice: லோத்தானின் மகன்கள்
  rationale: בְנֵי என்பது ‘மகன்கள்’ என்ற பொருளுடைய இணைநிலைப் பன்மை வடிவம். வம்சவரலாற்றுச் சூழலில் ‘லோத்தானின் மகன்கள்’ என்பது துல்லியமும் இயல்பும் கொண்ட தமிழ் நடை. தொடக்க וּ தனி ‘மேலும்’ என மொழிபெயர்க்கப்படாமல், பட்டியல் நடையில் இயல்பாக விடப்பட்டுள்ளது.
- source_word: חֹרִי
  choice: ஓரி
  rationale: இங்கு இனப்பெயராக அல்ல, வம்சப்பட்டியலிலுள்ள ஆள்பெயராக வருகிறது. எபிரெய ஒலிப்புக்கு ஏற்ப ‘ஓரி’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְהוֹמָם
  choice: ஓமாம்[a]
  rationale: நாளாகமத்தின் இவ்வசனத்தில் உள்ள הוֹמָם என்ற வடிவத்தைப் பின்பற்றி ‘ஓமாம்’ என ஒலிபெயர்க்கப்பட்டுள்ளது. தொடர் இணைப்பைத் தமிழ் பட்டியலின் காற்புள்ளி இயல்பாக வெளிப்படுத்துகிறது. ஆதியாகமம் 36:22-இல் காணப்படும் வேறுபட்ட பெயர் வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: וַאֲחוֹת לוֹטָן
  choice: லோத்தானின் சகோதரி
  rationale: אֲחוֹת என்பது ‘சகோதரி.’ எபிரெயப் பெயர்ச்சொல் வாக்கியத்தில் இணைப்புவினை வெளிப்படையாக இல்லாததால், தமிழில் இயல்பான அடையாள வாக்கியமாக அமைக்கப்பட்டுள்ளது.
- source_word: תִּמְנָע
  choice: திம்னா
  rationale: இவ்வசனத்தின் எபிரெய மெய்யெழுத்து வடிவத்தை நேரடியாகப் பிரதிபலிக்கும் ஆள்பெயர் ஒலிபெயர்ப்பு.
