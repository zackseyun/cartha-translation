translation_notes:
  register: நவீனத் தரத்தமிழில், சுருக்கமான வம்சப்பட்டியல் நடையும் கண்ணியமான வேதாகம மொழிநடையும் பேணப்பட்டுள்ளன. ஆள்பெயர்கள் எபிரெய மூலத்தின் ஒலியமைப்புக்கு அணுக்கமாகத் தமிழாக்கப்பட்டுள்ளன; வாசகத்தின் தெளிவுக்காக இரண்டு வாக்கியங்களாக அமைக்கப்பட்டுள்ளது.
