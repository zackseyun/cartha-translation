  text: וַ/יּ֥וֹלֶד אַבְרָהָ֖ם אֶת יִצְחָ֑ק בְּנֵ֣י יִצְחָ֔ק עֵשָׂ֖ו וְ/יִשְׂרָאֵֽל־ס׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/034.yaml
  text: 'Abraham fathered Isaac[a]. The sons of Isaac: Esau and Israel.'
translation:
  language: ta
  text: 'ஆபிரகாம் ஈசாக்கின் தந்தையானார். ஈசாக்கின் மகன்கள்: ஏசாவும் இஸ்ரவேலும்[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில்: “இஸ்ரவேல்,” அதாவது யாக்கோபு.'
    reason: மூல எபிரெய உரையில் உள்ள ‘இஸ்ரவேல்’ என்ற பெயர் யாக்கோபைக் குறிக்கிறது என்பதைத் தெளிவுபடுத்துகிறது.
lexical_decisions:
- source_word: וַיּוֹלֶד
  choice: பெற்றார்
  rationale: வம்சவரலாற்றுச் சூழலில், ஆண் முன்னோரிடமிருந்து பிறந்த சந்ததியைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கும் தமிழ் வழக்கு. எபிரெய வினையின் causative கருத்து, ஆபிரகாம் ஈசாக்கின் தந்தை என்பதன் மூலம் வெளிப்படுகிறது.
- source_word: אֶת
  choice: '[தனியாக மொழிபெயர்க்கப்படவில்லை]'
  rationale: இது நேரடிச் செயப்படுபொருளைக் குறிக்கும் எபிரெய இலக்கணக் குறி; தமிழில் தனிச் சொல்லாக மொழிபெயர்க்க வேண்டியதில்லை. ‘ஈசாக்கைப்’ என்பதிலுள்ள வேற்றுமை உருபு அதன் இலக்கணச் செயல்பாட்டைக் காட்டுகிறது.
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: בן என்பதன் பன்மை இணைப்புநிலை வடிவம்; அடுத்த வம்சக்கிளையை அறிமுகப்படுத்தும் பட்டியல் அமைப்பை இயல்பான தமிழில் தருகிறது.
- source_word: עֵשָׂו
  choice: ஏசா
  rationale: இந்தத் தனிப்பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: וְיִשְׂרָאֵל
  choice: இஸ்ரவேலும்
  rationale: மூல எபிரெய உரை ‘யாக்கோபு’ என்று அல்லாமல் ‘இஸ்ரவேல்’ என்றே கூறுகிறது. இணைப்பிடைச்சொல்லும் ‘-உம்’ விகுதியால் வெளிப்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: யாக்கோபைக் குறிக்கும் வம்சப்பட்டியலில் יִשְׂרָאֵל என்பதை எவ்வாறு வழங்குவது
  choice: இஸ்ரவேல்
  alternative: யாக்கோபு
  rationale: இங்கு குறிப்பிடப்படுபவர் யாக்கோபு என்றாலும், எபிரெய உரை அவருடைய ‘இஸ்ரவேல்’ என்ற பெயரையே பயன்படுத்துகிறது. உரையில் இல்லாத ஒத்திசைவைச் செய்யாமல் அந்தப் பெயரைப் பாதுகாத்து, அடிக்குறிப்பில் அடையாளத்தைத் தெளிவுபடுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், வம்சப்பட்டியலுக்கேற்ற சுருக்கமானவும் கண்ணியமானவும் உள்ள நடை பயன்படுத்தப்பட்டுள்ளது. ‘இஸ்ரவேல்’ என்ற மூலப்பெயர் மாற்றமின்றிப் பாதுகாக்கப்பட்டு, அடிக்குறி அதே பெயருக்குப் பின்னர் வைக்கப்பட்டுள்ளது.
