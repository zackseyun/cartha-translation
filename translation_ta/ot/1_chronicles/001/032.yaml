  text: וּ/בְנֵ֨י קְטוּרָ֜ה פִּילֶ֣גֶשׁ אַבְרָהָ֗ם יָלְדָ֞ה אֶת זִמְרָ֧ן וְ/יָקְשָׁ֛ן וּ/מְדָ֥ן וּ/מִדְיָ֖ן וְ/יִשְׁבָּ֣ק וְ/שׁ֑וּחַ וּ/בְנֵ֥י יָקְשָׁ֖ן שְׁבָ֥א וּ/דְדָֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/032.yaml
  text: 'And the sons of Keturah[a], Abraham’s concubine: she bore Zimran, Jokshan, Medan, Midian, Ishbak, and Shuah. And the sons of Jokshan: Sheba and Dedan.'
translation:
  language: ta
  text: 'ஆபிரகாமின் துணை மனைவியான கேத்தூராவின்[a] மகன்கள்: அவள் சிம்ரான், யோக்ஷான், மேதான், மீதியான், இஸ்பாக், சூவா ஆகியோரைப் பெற்றாள். யோக்ஷானின் மகன்கள்: சேபா, தேதான்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ஆதியாகமம் 25:1 கேத்தூராவை ஆபிரகாமின் மனைவி என்று குறிப்பிடுகிறது; இங்கே நாளாகம ஆசிரியர் அவரைத் துணை மனைவி என்று குறிப்பாக அழைக்கிறார்.
    reason: cross_reference
lexical_decisions:
- source_word: וּבְנֵי קְטוּרָה
  choice: கேத்தூராவின் மகன்கள்
  rationale: בְּנֵי என்பது ‘மகன்கள்’ என்ற பொருளுடைய இணைப்புநிலைப் பன்மை வடிவம். தமிழில் இயல்பான உடைமைத் தொடராக மொழிபெயர்க்கப்பட்டது; வம்சப்பட்டியலின் தொடர்ச்சியை வாக்கிய அமைப்பு வெளிப்படுத்துகிறது.
- source_word: פִּילֶגֶשׁ אַבְרָהָם
  choice: ஆபிரகாமின் துணை மனைவி
  rationale: פִּילֶגֶשׁ என்பது பிரதான மனைவியைவிடக் குறைந்த சமூக நிலையைக் கொண்ட, அங்கீகரிக்கப்பட்ட மணஉறவில் இருந்த பெண்ணைக் குறிக்கிறது. ‘துணை மனைவி’ என்பது இன்றைய வாசகருக்குப் புரியக்கூடிய, கண்ணியமான சொற்றொடர்; இதை ‘மனைவி’ என்று மட்டும் மொழிபெயர்த்து வேறுபாட்டை மறைக்கவில்லை.
- source_word: יָלְדָה
  choice: அவள் … பெற்றாள்
  rationale: பெண்பால் ஒருமை வினைச்சொல் கேத்தூராவையே சுட்டுகிறது. தமிழில் எழுவாயை வெளிப்படையாகக் கூறுவது பொருளைத் தெளிவாக்குகிறது.
- source_word: זִמְרָן
  choice: சிம்ரான்
  rationale: எபிரெயப் பெயரின் ஒலிப்பைத் தமிழில் இயன்றவரை பிரதிபலிக்கும் எழுத்துப்பெயர்ப்பு.
- source_word: יָקְשָׁן
  choice: யொக்சான்
  rationale: எபிரெயப் பெயரின் ஒலிப்பை அடிப்படையாகக் கொண்ட தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: מְדָן
  choice: மேதான்
  rationale: எபிரெயப் பெயரின் உயிரொலி மற்றும் மெய்யொலியைப் பிரதிபலிக்கும் எழுத்துப்பெயர்ப்பு.
- source_word: מִדְיָן
  choice: மீதியான்
  rationale: எபிரெயப் பெயரின் ஒலிப்பை அடிப்படையாகக் கொண்ட தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: יִשְׁבָּק
  choice: இஸ்பாக்
  rationale: எபிரெயப் பெயரின் ஒலிப்பைத் தமிழில் நெருக்கமாகப் பிரதிபலிக்கும் எழுத்துப்பெயர்ப்பு.
- source_word: שׁוּחַ
  choice: சூவா
  rationale: இறுதி தொண்டை மெய்யைத் தமிழில் இயல்பாகக் குறிக்க இயலாததால், பெயரின் வழக்கமான ஒலிப்புக்கு நெருக்கமான வடிவம் பயன்படுத்தப்பட்டது.
- source_word: שְׁבָא
  choice: சேபா
  rationale: எபிரெயப் பெயரின் ஒலிப்பை அடிப்படையாகக் கொண்ட தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: דְדָן
  choice: தேதான்
  rationale: எபிரெயப் பெயரின் ஒலிப்பை அடிப்படையாகக் கொண்ட தமிழ் எழுத்துப்பெயர்ப்பு.
theological_decisions:
- issue: ஆபிரகாமுடன் கேத்தூராவுக்கு இருந்த உறவின் நிலை
  choice: துணை மனைவி
  alternative: மனைவி; மறுமனையாட்டி
  rationale: இவ்வசனம் வெளிப்படையாகப் பயன்படுத்தும் פִּילֶגֶשׁ என்ற சொல்லின் தனிப்பொருள் காக்கப்பட்டது. கேத்தூராவை ‘மனைவி’ என்று அழைக்கும் ஆதியாகமம் 25:1 உடன் செயற்கையாக ஒத்திசைக்காமல், நாளாகமத்தின் சொல்வழக்கு அப்படியே நிலைநிறுத்தப்பட்டது. ‘மறுமனையாட்டி’ துல்லியமானதாக இருக்கக்கூடியபோதும் இன்றைய பொதுவாசகருக்கு பழமையானதாகத் தோன்றும்.
translation_notes:
  register: நவீனத் தரத் தமிழில், வம்சப்பட்டியலுக்கேற்ற சுருக்கமான மற்றும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் ‘மகன்கள் … அவள் பெற்றாள்’ என்ற பட்டியல் அமைப்பும், கேத்தூராவின் உறவுநிலையைச் சுட்டும் வேறுபாடும் பாதுகாக்கப்பட்டுள்ளன.
