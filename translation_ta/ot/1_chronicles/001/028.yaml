  text: 'The sons of Abraham: Isaac and Ishmael[a].'
translation:
  language: ta
  text: 'ஆபிரகாமின் மகன்கள்: ஈசாக்கும் இஸ்மவேலும்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: விரிவான வம்சவரலாற்றுப் பொருளில் ‘பிள்ளைகள்’ அல்லது ‘வழிவந்தவர்கள்’ என்றும் மொழிபெயர்க்கலாம்; எபிரெய மொழியில் சொல்லுக்குச் சொல் ‘மகன்கள்’ என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: בֵּן என்பதன் பன்மை இணைப்புநிலை வடிவம்; இங்கு ஆண் வழிப் பெயர்ப்பட்டியலை அறிமுகப்படுத்துகிறது. ‘மகன்கள்’ என்பது எபிரெயச் சொல்லின் நேரடிப் பொருளையும் வம்சவரலாற்றுச் சூழலையும் காக்கிறது.
- source_word: אַבְרָהָם
  choice: ஆபிரகாம்
  rationale: தனிப்பட்ட பெயர்; நவீனத் தமிழில் பரவலாக நிலைபெற்ற வேதாகமப் பெயர்வடிவம்.
- source_word: יִצְחָק
  choice: ஈசாக்கு
  rationale: தனிப்பட்ட பெயர்; நவீனத் தமிழில் பரவலாக நிலைபெற்ற வேதாகமப் பெயர்வடிவம்.
- source_word: וְ/יִשְׁמָעֵאל
  choice: இஸ்மவேலும்
  rationale: இணைப்பிடைச்சொல்லுடன் வரும் தனிப்பட்ட பெயர். தமிழில் பட்டியலை இயல்பாக நிறைவு செய்ய ‘-உம்’ இணைப்பு பயன்படுத்தப்பட்டுள்ளது.
theological_decisions: []
translation_notes:
  register: சுருக்கமான வம்சவரலாற்று நடையைப் பேணும் வகையில், நவீனமும் கண்ணியமுமான பொதுத் தமிழ் பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் ஆண் வழிக் குறிப்பை நடுநிலைப்படுத்தாமல் ‘மகன்கள்’ எனக் காக்கப்பட்டுள்ளது; அடிக்குறி மாற்றுப் பொருள் வாய்ப்பைக் குறிப்பிடுகிறது.
