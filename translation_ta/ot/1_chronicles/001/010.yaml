  naturalness: ‘கூஷ் நிம்ரோதைப் பெற்றான்’ என்பது ஆண் முன்னோரைச் சுட்டும் வம்சவரலாற்று நடையில் நிலைபெற்ற, புரிந்துகொள்ளத்தக்க தமிழ் பயன்பாடாகும். வசனம் சுருக்கமாகவும் நவீன நிலையான தமிழில் இயல்பாகவும் உள்ளது. ‘வல்லவனாக இருக்கத் தொடங்கினான்’ என்பது மூலத்தின் ‘began to be’ அமைப்பை தேவையற்ற விளக்கமின்றி நன்றாக வெளிப்படுத்துகிறது.
