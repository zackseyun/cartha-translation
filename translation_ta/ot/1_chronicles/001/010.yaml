source:
  edition: WLC
  text: וְ/כ֖וּשׁ יָלַ֣ד אֶת נִמְר֑וֹד ה֣וּא הֵחֵ֔ל לִ/הְי֥וֹת גִּבּ֖וֹר בָּ/אָֽרֶץ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/010.yaml
  text: And Cush fathered Nimrod[a]; he began to be a mighty one in the land.
translation:
  language: ta
  text: கூஷ் நிம்ரோதைப் பெற்றான்; அவன் நாட்டில்[a] வல்லவனாக இருக்கத் தொடங்கினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பூமியில்.’ எபிரெய மொழியிலுள்ள אֶרֶץ என்ற சொல் ‘நாடு/நிலம்’ அல்லது ‘பூமி’ என்று பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כ֖וּשׁ
  choice: கூஷ்
  rationale: וְ என்பது வம்சவரலாற்றுக் குறிப்புகளை இணைக்கும் எளிய இணைப்புச்சொல். தனி வசனமாக இயல்பான தமிழில் அது வெளிப்படையாக மொழிபெயர்க்கப்பட வேண்டியதில்லை; כּוּשׁ என்ற பெயர் ‘கூஷ்’ என ஒலிபெயர்க்கப்பட்டது.
- source_word: יָלַ֣ד
  choice: பெற்றான்
  rationale: வம்சவரலாற்றுச் சூழலில் ילד தந்தையாகும் உறவைக் குறிக்கிறது. ‘பெற்றான்’ என்பது சுருக்கமானதும் தமிழில் வழக்கமான வம்சவரலாற்று நடையுமாகும்; இது குழந்தையைப் பெற்றெடுத்தவர் தாய் என்ற உடலியல் பொருளை இங்கு நோக்கவில்லை.
- source_word: אֶת
  choice: '[தனியாக மொழிபெயர்க்கப்படவில்லை]'
  rationale: இது திட்டவட்டமான நேரடிச் செயப்படுபொருளைக் குறிக்கும் இலக்கண அடையாளம்; தமிழில் இதற்குத் தனிச் சொல் தேவையில்லை.
- source_word: נִמְר֑וֹד
  choice: நிம்ரோத்
  rationale: எபிரெயப் பெயர் தமிழில் அதன் ஒலிக்கு நெருக்கமாக ‘நிம்ரோத்’ என ஒலிபெயர்க்கப்பட்டது; வேற்றுமை உருபுடன் ‘நிம்ரோதைப்’ என்று வருகிறது.
- source_word: ה֣וּא
  choice: அவன்
  rationale: பெயருக்குப் பின் மீண்டும் வரும் தனிப்பெயர்ச்சுட்டு நிம்ரோதை வலியுறுத்தி எடுத்துரைக்கிறது. இயல்பான தமிழில் ‘அவன்’ இதைப் போதுமான அளவு வெளிப்படுத்துகிறது.
- source_word: הֵחֵ֔ל
  choice: தொடங்கினான்
  rationale: חלל என்பதன் ஹிஃபில் வடிவம், தொடரும் வினையெச்சப் பொருளோடு, பொதுவாக ‘தொடங்கு’ எனப் பொருள்படும். ‘முதலாவதாக ஆனான்’ என்ற கூடுதல் விளக்கத்தைச் சேர்க்காமல் மூல அமைப்பைப் பாதுகாக்கிறது.
- source_word: לִ/הְי֥וֹת
  choice: இருக்க
  rationale: היה என்பதன் வினையெச்ச வடிவத்தை நேரடியாகவும் இயல்பாகவும் ‘இருக்க’ என்று மொழிபெயர்த்து, ‘இருக்கத் தொடங்கினான்’ என்ற மூல கட்டமைப்பு பாதுகாக்கப்பட்டது.
- source_word: גִּבּ֖וֹר
  choice: வல்லவன்
  rationale: גִּבּוֹר என்பது வலிமைமிக்கவன், வீரன் அல்லது போர்வீரன் எனப் பொருள்படலாம். இங்கு போர்ச் செயல் வெளிப்படையாகக் கூறப்படாததால், பரந்த பொருளைக் காக்கும் ‘வல்லவன்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: בָּ/אָֽרֶץ
  choice: நாட்டில்
  rationale: אֶרֶץ என்பது ‘நாடு/நிலம்’ அல்லது ‘பூமி’ என்று பொருள்படக்கூடும். வசனம் நிம்ரோத்தின் செல்வாக்கை உலகளாவியதாக வெளிப்படையாகக் கூறாததால், குறுகிய பொருளான ‘நாட்டில்’ முதன்மை உரையில் தரப்பட்டு, பரந்த மாற்று அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
theological_decisions:
- issue: நிம்ரோத்தின் வல்லமையின் பரப்பைக் குறிக்கும் בָּאָרֶץ என்பதன் பொருள்
  choice: நாட்டில்
  alternative: பூமியில்
  rationale: אֶרֶץ என்ற எபிரெயச் சொல்லுக்கு இரு பொருள்களும் சாத்தியம். வசனமே உலகளாவிய பரப்பைத் தீர்மானிக்காததால் ‘நாட்டில்’ முதன்மை உரையில் வைக்கப்பட்டுள்ளது; ‘பூமியில்’ என்ற சாத்தியமான வாசிப்பு அடிக்குறிப்பில் தரப்பட்டு மூலத்தின் தெளிவின்மை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், வம்சவரலாற்றுக்கேற்ற சுருக்கமான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘வல்லவன்’ என்பது இராணுவப் பொருளைத் தேவையின்றி சேர்க்காமல் גִּבּוֹר என்பதன் பரந்த பொருளைப் பாதுகாக்கிறது. அடிக்குறிப்பு குறி அது விளக்கும் ‘நாட்டில்’ என்பதற்குப் பின் வைக்கப்பட்டுள்ளது.
