lexical_decisions:
- source_word: וַיָּמָת
  choice: இறந்தான்
  rationale: מוּת என்பதன் wayyiqtol வடிவம் கதைத் தொடரில் அடுத்த நிகழ்வைக் குறிக்கிறது; தமிழில் இயல்பான இறந்தகால வினையாக மொழிபெயர்க்கப்பட்டது.
- source_word: בָּלַע
  choice: பேலா
  rationale: எபிரெய தனிப்பட்ட பெயரின் ஒலிபெயர்ப்பு.
- source_word: וַיִּמְלֹךְ
  choice: அரசாண்டான்
  rationale: Qal wayyiqtol வடிவிலுள்ள מלך இங்கு அரசுரிமையை ஏற்று ஆட்சி செய்ததைக் குறிக்கிறது; அரசர் வாரிசுரிமைச் சூத்திரத்துக்கு ஏற்ற சுருக்கமான தமிழ்.
- source_word: תַּחְתָּיו
  choice: அவனுக்குப் பதிலாக
  rationale: முந்தைய அரசனின் இடத்தை அடுத்தவர் ஏற்றுக்கொண்டார் என்ற வாரிசுரிமைப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יוֹבָב
  choice: யோபாப்
  rationale: எபிரெய தனிப்பட்ட பெயரின் ஒலிபெயர்ப்பு.
- source_word: בֶּן זֶרַח
  choice: சேராகின் மகன்
  rationale: எபிரெய தந்தைவழி அடையாள அமைப்பை இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: מִבָּצְרָה
  choice: போஸ்ராவைச் சேர்ந்த
  rationale: முன்னொட்டு מִן இங்கு அந்த நகரிலிருந்து வந்தவர் அல்லது அதனுடன் தொடர்புடையவர் என்பதைக் குறிக்கலாம்; ‘சேர்ந்த’ என்பது இந்த இரு நுணுக்கங்களையும் தேவையின்றிக் குறுக்காமல் தாங்குகிறது.
