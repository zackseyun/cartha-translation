  text: Bela died[a], and Jobab son of Zerah from Bozrah reigned in his place.
translation:
  language: ta
  text: பேலா இறந்தான்; அவனுக்குப் பதிலாகப் போஸ்ராவிலிருந்து வந்த சேராகின் மகன் யோபாப் அரசாண்டான்.[a]
