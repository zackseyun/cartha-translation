base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/045.yaml
  text: And Yobab died[b][a], and Husham from the land of the Temanites reigned in his place.
translation:
  language: ta
  text: யோபாப் இறந்தான். தேமானியரின் நாட்டைச் சேர்ந்த[a] ஹூஷாம் அவனுக்குப் பதிலாக அரசாண்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தேமான் நாட்டைச் சேர்ந்த” அல்லது “தேமானியனின் நாட்டைச் சேர்ந்த.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: இறந்தான்
  rationale: מות என்பதன் தொடர்கதை வடிவம் அடுத்த நிகழ்வைச் சொல்கிறது; தமிழில் எழுவாயான யோபாபின் பால் மற்றும் எண் வினைமுற்றில் இயல்பாக வெளிப்படுகின்றன.
- source_word: יוֹבָב
  choice: யோபாப்
  rationale: எபிரெயப் பெயரின் ஒலிவடிவத்தைத் தமிழில் நேரடியாகப் பிரதிபலிக்கும் எழுத்துப்பெயர்ப்பு.
- source_word: וַיִּמְלֹךְ
  choice: அரசாண்டான்
  rationale: מלך என்பது அரசனாக ஆட்சி செய்ததைக் குறிக்கிறது; அரசர்-வாரிசுப் பட்டியலின் சூழலில் ‘அரசாண்டான்’ இயல்பாகவும் சுருக்கமாகவும் உள்ளது.
- source_word: תַּחְתָּיו
  choice: அவனுக்குப் பதிலாக
  rationale: இந்த வாரிசுரிமைச் சூழலில் תחתיו, முந்தைய அரசனின் இடத்தை ஏற்று ஆட்சி செய்ததைக் குறிக்கிறது.
- source_word: חוּשָׁם
  choice: ஹூஷாம்
  rationale: எபிரெயத் தனிப்பெயரின் ஒலிவடிவத்தைத் தமிழில் நெருக்கமாகப் பிரதிபலிக்கும் எழுத்துப்பெயர்ப்பு.
- source_word: מֵאֶרֶץ
  choice: நாட்டைச் சேர்ந்த
  rationale: מן உடன் வரும் אֶרֶץ புவியியல் தோற்றத்தைச் சுட்டுகிறது; தமிழில் ஒருவரின் ஊற்றிடத்தை இயல்பாகக் கூறும் வடிவம்.
- source_word: הַתֵּימָנִי
  choice: தேமானியரின்
  rationale: இச்சொல் இங்கு இனத்தையோ பிராந்தியத்தையோ குறிக்கும் பெயராகப் புரிந்துகொள்ளப்படலாம்; பன்மைக் குழுவைக் குறிக்கும் மொழிபெயர்ப்பு தமிழில் இயல்பாக உள்ளது, வேறு சாத்தியங்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
