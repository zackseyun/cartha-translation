  source_fidelity: எபிரெய மூலத்தின் தொடர்நிகழ்வு, யோபாபின் மரணம், அதன்பின் ஹூஷாம் அவனுக்குப் பதிலாக அரசாளுதல் ஆகியவை துல்லியமாகத் தரப்பட்டுள்ளன. מֵאֶרֶץ הַתֵּימָנִי என்பதற்கான ‘தேமானியரின் நாட்டைச் சேர்ந்த’ என்பது சாத்தியமான இன/பிராந்தியப் பொருளை இயல்பாக வெளிப்படுத்துகிறது; மாற்று வாசிப்புகள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.
  naturalness: ‘யோபாப் இறந்தான். ... ஹூஷாம் அவனுக்குப் பதிலாக அரசாண்டான்’ என்பது நவீனத் தரத் தமிழில் சுருக்கமாகவும் அரசர்-வாரிசுப் பட்டியல் நடைக்கு ஏற்றதாகவும் உள்ளது. இரண்டு வாக்கியங்களாக்கியது நிகழ்வுவரிசையையோ பொருளையோ மாற்றவில்லை.
  terminology: பெயர்கள் ‘யோபாப்,’ ‘ஹூஷாம்’ என எபிரெய ஒலிவடிவத்திற்கு நெருக்கமாகத் தரப்பட்டுள்ளன. ‘அரசாண்டான்’ மற்றும் ‘அவனுக்குப் பதிலாக’ என்பவை מלך மற்றும் תחתיו ஆகியவற்றின் இச்சூழல் பொருளுக்கு ஏற்றவை. தேமானியர்/தேமான்/தேமானியன் என்ற விளக்க வாய்ப்புகளை அடிக்குறிப்பு முறையாகக் காட்டுகிறது.
