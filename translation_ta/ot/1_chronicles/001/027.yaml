  text: Abram—that is[a], Abraham.
translation:
  language: ta
  text: ஆபிராம்—அதாவது[a], ஆபிரகாம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொல்லுக்குச் சொல்லாக, “ஆபிராம், அவனே ஆபிரகாம்” அல்லது “ஆபிராம் ஆபிரகாம் ஆவார்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַבְרָם
  choice: ஆபிராம்
  rationale: தனிப்பட்ட பெயர்; தமிழில் நிலைபெற்ற வேதாகமப் பெயர் வடிவத்தில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: הוּא
  choice: அதாவது
  rationale: இது சொற்பொருளில் ‘அவன்’ என்ற தனிநிலைச் சுட்டுப்பெயர். ஆனால் இங்கு இரு பெயர்களையும் இணைக்கும் வினையற்ற அடையாளப்படுத்தும் தொடரில், ஆபிராம் என்பவரே ஆபிரகாம் என விளக்குவதற்கு இயல்பான நவீனத் தமிழ் வடிவம் ‘அதாவது’ ஆகும்.
- source_word: אַבְרָהָם
  choice: ஆபிரகாம்
  rationale: தனிப்பட்ட பெயர்; தமிழில் நிலைபெற்ற வேதாகமப் பெயர் வடிவத்தில் ஒலிபெயர்க்கப்பட்டுள்ளது. ஆபிராம் என்ற பெயருடையவர் ஆபிரகாம் என்ற பெயரால் அறியப்படுவதை இவ்வசனம் சுட்டுகிறது.
theological_decisions:
- issue: வம்சவரலாற்றுச் சூழலில் உள்ள வினையற்ற அடையாளப்படுத்தும் தொடரை மொழிபெயர்த்தல்
  choice: ஆபிராம்—அதாவது, ஆபிரகாம்.
  alternative: ஆபிராம், அவனே ஆபிரகாம்; அல்லது, ஆபிராம் ஆபிரகாம் ஆவார்.
  rationale: எபிரெய உரையில் இரண்டு தனிப்பெயர்களுக்கு இடையில் הוּא என்ற சுட்டுப்பெயர் வருகிறது. ‘அதாவது’ என்பது இங்கு ஆசிரியர் இரு பெயர்களும் ஒரே நபரைக் குறிக்கின்றன என்று விளக்கும் செயல்பாட்டை இயல்பான தமிழில் தருகிறது; இது இறையியல் விளக்கச் சேர்க்கை அல்ல, தொடரியல் சார்ந்த மொழிபெயர்ப்புத் தீர்மானம்.
translation_notes:
  register: நவீன நிலையான தமிழில், சுருக்கமான வம்சவரலாற்று நடையையும் dignified வேதாகமப் பதிவின் தொனியையும் பேணும் வகையில் மொழிபெயர்க்கப்பட்டது. பெயர்களுக்கு தமிழில் பரவலாக நிலைபெற்ற ‘ஆபிராம்’, ‘ஆபிரகாம்’ வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன.
