  text: the Jebusites[a], the Amorites, and the Girgashites.
translation:
  language: ta
  text: எபூசியர்[a], எமோரியர், கிர்காசியர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு எபிரெய மொழியில் ஒருமை இனப்பெயர் வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன; அவை எபூசியர், எமோரியர், கிர்காசியர் ஆகிய மக்களினங்களைக் கூட்டாகக் குறிக்கின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיְבוּסִי
  choice: எபூசியர்
  rationale: எபிரெய வடிவம் ஒருமை இனப்பெயராக இருந்தாலும், இவ்வம்சப் பட்டியலில் ஒரு மக்களினத்தைக் கூட்டாகக் குறிக்கிறது; தமிழில் மக்களினப் பெயராக இயல்பாகத் தரப்பட்டது.
- source_word: הָאֱמֹרִי
  choice: எமோரியர்
  rationale: சுற்றியுள்ள இனப்பெயர்களைப் போலவே இது கானானிலிருந்து தோன்றிய மக்களினத்தைச் சுட்டும் கூட்டு ஒருமை; தமிழில் மக்களினப் பெயராக வழங்கப்பட்டது.
- source_word: הַגִּרְגָּשִׁי
  choice: கிர்காசியர்
  rationale: வம்சப் பட்டியலின் கூட்டு இனப்பெயர் நடை காக்கப்பட்டு, மக்களினத்தைக் குறிக்கும் தமிழ்ப் பெயராக வழங்கப்பட்டது.
- source_word: וְאֶת / וְאֵת
  choice: பட்டியல் இணைப்பு; தனியாக மொழிபெயர்க்கப்படவில்லை
  rationale: אֶת என்பது நேரடிச் செயப்படுபொருள் குறியீடு; தமிழில் தனிச் சொல்லாகத் தேவைப்படாது. וְ பட்டியலின் இணைப்பைத் தருகிறது; தமிழில் காற்புள்ளிகளால் இயல்பாக வெளிப்படுத்தப்பட்டது.
