lexical_decisions:
- source_word: וּבְנֵי
  choice: மகன்கள்
  rationale: בְּנֵי என்பது ‘மகன்கள்’ என்பதன் இணைப்பு வடிவம். வம்சப் பட்டியலின் இயல்பான தமிழ்நடைக்காக முன்சேர்க்கை ו தனியே ‘மேலும்’ என்று மொழிபெயர்க்கப்படாமல், பட்டியலின் தொடர்ச்சியில் உணர்த்தப்பட்டுள்ளது.
- source_word: גֹּמֶר
  choice: கோமர்
  rationale: எபிரெயப் பெயரின் ஒலியை நவீன தமிழில் இயன்றவரை அண்மையாக எழுத்துப்பெயர்த்த வடிவம்.
- source_word: אַשְׁכֲּנַז
  choice: அஷ்கெனாஸ்
  rationale: எபிரெயப் பெயரின் ஷ் ஒலியையும் இறுதி ז ஒலிக்கு அண்மையான ஸ் வடிவையும் தெளிவாகக் காட்டும் எழுத்துப்பெயர்ப்பு.
- source_word: דִיפַת
  choice: தீபாத்
  rationale: நாளாகமத்தின் மசோரா எபிரெய உரையில் உள்ள דִיפַת என்பதையே முதன்மை உரையில் பின்பற்றுகிறது; இணை வம்சப் பட்டியலின் ‘ரீபாத்’ என்ற வாசகம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: תוֹגַרְמָה
  choice: தோகர்மா
  rationale: எபிரெயப் பெயரின் ஒலியமைப்பை இயல்பான தமிழில் எழுத்துப்பெயர்த்த வடிவம்.
