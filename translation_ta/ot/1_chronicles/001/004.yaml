lexical_decisions:
- source_word: נֹחַ
  choice: நோவா
  rationale: மரபுவழி தமிழில் நிலைபெற்றுள்ள தனிப்பெயர் வடிவம்; பெயரின் சொற்பொருளை மொழிபெயர்க்காமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: שֵׁם
  choice: சேம்
  rationale: வம்சவரலாற்றுப் பட்டியலில் வரும் தனிப்பெயர்; ‘பெயர்’ என்ற சொற்பொருளாக மொழிபெயர்க்காமல் வழக்கமான தமிழ் ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: חָם
  choice: காம்
  rationale: எபிரெய தனிப்பெயரின் தொடக்க மெய்யொலியை நெருக்கமாகக் காட்டும் தமிழ் ஒலிபெயர்ப்பு.
- source_word: וָ/יָפֶת
  choice: யாப்பேத்
  rationale: יָפֶת என்ற தனிப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது. எபிரெய இணைப்புச்சொல் ו பட்டியலின் இறுதி உறுப்பை இணைக்கிறது; இயல்பான தமிழ் பெயர்ப்பட்டியலில் அதைத் தனியாக வெளிப்படுத்த வேண்டியதில்லை.
