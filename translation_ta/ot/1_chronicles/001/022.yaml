  - marker: a
    text: இணையான வம்சவரலாற்றுப் பட்டியலான ஆதியாகமம் 10:28-ல் இந்தப் பெயர் ‘ஓபால்’ என்று வருகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/אֶת
  choice: ஆகியோரையும்
  rationale: וְ என்ற இணைப்பும் אֶת என்ற நேர்செயப்படுபொருள் அடையாளமும் பெயர்ப்பட்டியலின் ஒவ்வொரு உறுப்பையும் முந்தைய வினையுடன் இணைக்கின்றன. இயல்பான தமிழில் அவற்றை ஒவ்வொரு பெயருக்கும் முன் மீண்டும் கூறாமல், பட்டியலின் முடிவில் ‘ஆகியோரையும்’ என்று ஒருங்கிணைத்துள்ளது.
- source_word: עֵיבָל
  choice: ஏபால்
  rationale: எபிரெய வடிவத்தின் ஒலிப்பை நவீனத் தமிழில் இயல்பாக எழுத்துப்பெயர்த்துள்ளது. இணையான ஆதியாகமம் 10:28 பட்டியலில் உள்ள வேறுபட்ட வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: אֲבִימָאֵל
  choice: அபிமாயேல்
  rationale: தனிப்பெயரை மொழிபெயர்க்காமல், எபிரெய ஒலிவடிவத்திற்கு நெருக்கமாகத் தமிழில் எழுத்துப்பெயர்த்துள்ளது.
- source_word: שְׁבָא
  choice: சேபா
  rationale: שְׁבָא என்ற தனிப்பெயரை அதன் எபிரெய ஒலிப்புக்கு ஏற்ப எழுத்துப்பெயர்த்துள்ளது; வேறு இடங்களில் வரும் ஒத்த பெயருடன் இதைக் கலக்கவில்லை.
