translation_notes:
  register: நவீன தரத் தமிழில், நாளாகம அரசர் பட்டியலுக்கேற்ற சுருக்கமானதும் கண்ணியமானதும் ஆகிய நடை பயன்படுத்தப்பட்டுள்ளது. பெயர்கள் மொழிபெயர்க்கப்படாமல் எழுத்துப்பெயர்க்கப்பட்டுள்ளன; “அரசாண்டான்” என்பது தொடர்ச்சியான அரசாட்சிப் பட்டியல் நடையைப் பேணுகிறது.
