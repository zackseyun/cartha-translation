- from: ஆதாத் இறந்தான்; அவனுக்குப் பதிலாக[a] மஸ்ரேக்காவைச் சேர்ந்த சம்லா அரசாண்டான்.
  to: ஹதாத் இறந்தான்; அவனுக்குப் பதிலாக[a] மஸ்ரேக்காவைச் சேர்ந்த சம்லா அரசாண்டான்.
