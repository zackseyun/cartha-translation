base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/047.yaml
  text: Hadad died[a], and Samlah from Masrekah reigned in his place.
translation:
  language: ta
  text: ஹதாத் இறந்தான்; அவனுக்குப் பதிலாக[a] மஸ்ரேக்காவைச் சேர்ந்த சம்லா அரசாண்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவனுக்குப் பிறகு” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொற்றொடர் சொல்லர்த்தமாக “அவன் இடத்தில்” என்பதைக் குறிக்கிறது; அரசப் பதவியில் அவனைத் தொடர்ந்து மற்றொருவன் வந்ததைக் காட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: இறந்தான்
  rationale: מוּת என்பதன் இவ்வடிவம் மரணத்தை நேரடியாகக் குறிக்கிறது; எளிய, இயல்பான தமிழில் “இறந்தான்” பொருத்தமானது.
- source_word: הֲדָד
  choice: ஆதாத்
  rationale: இது ஓர் ஆண் இயற்பெயர்; எபிரெய ஒலிப்பைத் தமிழில் இயன்றவரை பிரதிபலிக்கும் வகையில் எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: וַיִּמְלֹךְ
  choice: அரசாண்டான்
  rationale: מָלַךְ என்பது அரசனாக ஆட்சி செய்வதைக் குறிக்கிறது; அரசர் பட்டியலின் சுருக்கமான நடைக்கு “அரசாண்டான்” இயல்பாகப் பொருந்துகிறது.
- source_word: תַּחְתָּיו
  choice: அவனுக்குப் பதிலாக
  rationale: תַּחַת உடன் இணைந்த மூன்றாம் நபர் ஒருமை ஆண்பால் பின்னொட்டு இங்கு ஆட்சிப் பதவியில் ஒருவனைத் தொடர்ந்து மற்றொருவன் வருவதைக் குறிக்கிறது; “அவனுக்குப் பதிலாக” அந்த மாற்றத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: שַׂמְלָה
  choice: சம்லா
  rationale: இது ஓர் ஆண் இயற்பெயர்; மூல மொழியின் மெய்யொலிக் கட்டமைப்பைத் தமிழில் தெளிவாகப் பிரதிபலிக்கும் எழுத்துப்பெயர்ப்பு.
- source_word: מִמַּשְׂרֵקָה
  choice: மஸ்ரேக்காவைச் சேர்ந்த
  rationale: מִן முன்னொட்டு இங்கு ஊர் சார்பு அல்லது பிறப்பிடத்தைக் காட்டுகிறது; நவீன தமிழில் “மஸ்ரேக்காவைச் சேர்ந்த” என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது.
