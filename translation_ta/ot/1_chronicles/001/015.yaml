  text: וְ/אֶת הַ/חִוִּ֥י וְ/אֶת הַֽ/עַרְקִ֖י וְ/אֶת הַ/סִּינִֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/015.yaml
  text: and the Hivites[a], and the Arkites, and the Sinites.
translation:
  language: ta
  text: ஹிவ்வியரையும்[a], அர்க்கியரையும், சீனியரையும் பெற்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘ஹிவ்வியன்,’ ‘அர்க்கியன்,’ ‘சீனியன்’ என ஒருமை இனச்சுட்டு வடிவங்கள் வருகின்றன. ஆனால் இந்த வம்சப்பட்டியல் சூழலில் அவை மக்கள் இனங்களையோ குலங்களையோ குறிக்கின்றன; ஆகவே தமிழில் ‘ஹிவ்வியர்,’ ‘அர்க்கியர்,’ ‘சீனியர்’ என வழங்கப்பட்டுள்ளன.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  choice: -ஐயும் / -ரையும்
  rationale: וְ என்பதன் இணைப்புப் பொருளையும் אֵת என்பதன் நேரடி செயப்படுபொருள் குறியீட்டையும் தமிழில் ‘-ஐயும் / -ரையும்’ என்ற வேற்றுமை-இணைப்பு வடிவம் இயல்பாக வெளிப்படுத்துகிறது. முந்தைய வசனத்திலிருந்து தொடரும் வினைச் சூழலைத் தெளிவாக்க ‘பெற்றான்’ சேர்க்கப்பட்டுள்ளது.
- source_word: הַחִוִּי
  choice: இவ்வியர்
  rationale: இது ஒரு இனப்பெயர். எபிரெயத்தில் ஒருமை இனச்சுட்டு வடிவம் இருந்தாலும், வம்சப்பட்டியல் சூழலில் ஒரு மக்கள் குழுவைக் குறிப்பதால் தமிழில் மரியாதைப் பன்மை/கூட்டுப்பெயர் வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: הָעַרְקִי
  choice: அர்க்கியர்
  rationale: இடம் அல்லது குலத்திலிருந்து உருவான இனப்பெயர்; இச்சூழலில் மக்கள் குழுவைக் குறிப்பதால் ‘அர்க்கியர்’ எனக் கூட்டுப்பொருளில் வழங்கப்பட்டுள்ளது.
- source_word: הַסִּינִי
  choice: சீனியர்
  rationale: இன அல்லது குல அடையாளப் பெயர்; சுற்றியுள்ள பெயர்களைப் போலவே மக்கள் குழுவைக் குறிக்கும் பன்மைப் பொருளில் மொழிபெயர்க்கப்பட்டுள்ளது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், வம்சப்பட்டியலுக்கேற்ற சுருக்கமான மற்றும் கண்ணியமான நடை. மூல வசனம் முந்தைய வாக்கியத்தின் தொடராக இருப்பதால், தனியாக வாசிக்கத் தெளிவாக ‘பெற்றான்’ என்பது சூழலிலிருந்து நிரப்பப்பட்டுள்ளது.
