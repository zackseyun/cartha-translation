base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/020.yaml
  text: Joktan fathered Almodad[a], Sheleph, Hazarmaveth, and Jerah.
translation:
  language: ta
  text: யோக்தான் அல்மோதாத்[a], சேலேப், ஹசர்மாவேத், யேராக் ஆகியோருக்குத் தந்தையானான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இவர்களுக்குத் தந்தையானான்”; மரபாக, “பிறப்பித்தான்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יָקְטָן
  choice: யொக்தான்
  rationale: எபிரெயத் தனிப்பெயரின் ஒலிப்பை நவீனத் தமிழில் இயல்பாக எழுத்துப்பெயர்த்துள்ளது.
- source_word: יָלַד
  choice: பெற்றான்
  rationale: ஆண் வம்சப்பட்டியல் சூழலில் ‘தந்தையானான்/பெற்றெடுத்தான்’ என்ற பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது; நேரடியாகப் பிரசவித்தான் என்ற பொருள் இங்கு இல்லை.
- source_word: אֶת
  choice: '[தனியாக மொழிபெயர்க்கப்படவில்லை]'
  rationale: இது நேர்ச்செயப்படுபொருளைக் குறிக்கும் இலக்கண உருபு; தமிழின் ‘-ஐ’ வேற்றுமை உருபும் வாக்கிய அமைப்பும் அதன் பணியை வெளிப்படுத்துகின்றன.
- source_word: אַלְמוֹדָד
  choice: அல்மோதாத்
  rationale: எபிரெயத் தனிப்பெயரின் ஒலிப்பை அணுக்கமாகப் பிரதிபலிக்கும் எழுத்துப்பெயர்ப்பு.
- source_word: שָׁלֶף
  choice: சேலேப்
  rationale: எபிரெய மசோரா உயிர்க்குறிப்புகளுக்கு அணுக்கமான தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: חֲצַרְמָוֶת
  choice: அசர்மாவேத்
  rationale: தொடக்க எபிரெய ח ஒலிக்கு தமிழில் துல்லியமான இணை இல்லாததால் வாசிக்க இயல்பான ‘அ’ வடிவம் பயன்படுத்தப்பட்டு, பெயரின் பிற ஒலியமைப்பு காக்கப்பட்டுள்ளது.
- source_word: יָרַח
  choice: யேராகு
  rationale: எபிரெயத் தொடக்க ய் ஒலியையும் இறுதி ח ஒலிக்கான அணுக்கமான தமிழ் ‘கு’ வடிவத்தையும் கொண்டு எழுத்துப்பெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: יָלַד என்ற வம்சப்பட்டியல் வினையின் உறவுப் பொருள்
  choice: பெற்றான்
  alternative: தந்தையானான்; பிறப்பித்தான்
  rationale: உரை தந்தைவழி உறவைச் சொல்கிறது; தலைமுறை இடைவெளி உள்ளதா என்பதைத் தீர்மானிக்காமல், எபிரெய வம்சப்பட்டியல் சொல்லாட்சியின் இயல்பான விரிவை காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், வம்சப்பட்டியலுக்கேற்ற சுருக்கமான மற்றும் கண்ணியமான நடை. தனிப்பெயர்கள் எபிரெய மூல ஒலிப்பை முன்னிறுத்தி எழுத்துப்பெயர்க்கப்பட்டுள்ளன; பட்டியலின் கடைசி பெயருக்கு முன் ‘ஆகியோரை’ சேர்த்து இயல்பான தமிழ் தொடரமைப்பு வழங்கப்பட்டுள்ளது.
