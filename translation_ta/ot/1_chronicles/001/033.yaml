base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/033.yaml
  text: 'The sons of Midian: Ephah[a], Epher, Hanoch, Abida, and Eldaah. All these were the sons of Keturah.'
translation:
  language: ta
  text: 'மீதியானின் மகன்கள்: ஏப்பா, ஏப்பேர், ஹானோக்கு[a], அபிதா, மற்றும் எல்தாகா. இவர்கள் அனைவரும் கேத்தூராவின் மகன்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ஹானோக்கு; சில மரபுவழி மொழிபெயர்ப்புகளில் ‘ஏனோக்கு’ என்று வழங்கப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי מִדְיָן
  choice: மீதியானின் மகன்கள்
  rationale: எபிரெய கட்டுநிலைப் பன்மையை இயல்பான தமிழ் உடைமைத் தொடரால் வழங்குகிறது; தொடக்க இணைப்புச்சொல் வம்சப்பட்டியல் நடையில் தனியே மொழிபெயர்க்கப்படவில்லை.
- source_word: עֵיפָה
  choice: ஏப்பா
  rationale: எபிரெயப் பெயரின் ஒலியைத் தமிழில் வேறுபடுத்திக் காட்டும் ஒலிபெயர்ப்பு.
- source_word: וָעֵפֶר
  choice: ஏப்பேர்
  rationale: பெயர் மொழிபெயர்க்கப்படாமல் ஒலிபெயர்க்கப்பட்டுள்ளது; தொடரிலுள்ள இணைப்புகள் தமிழ்ப் பட்டியல் நிறுத்தக்குறிகளால் இயல்பாக வெளிப்படுகின்றன.
- source_word: וַחֲנוֹךְ
  choice: ஆனோக்கு
  rationale: חֲנוֹךְ என்ற எபிரெய வடிவை நேரடியாகச் சார்ந்த ஒலிபெயர்ப்பு; வழக்கில் காணப்படும் ஏனோக்கு என்ற வடிவிலிருந்து இதை வேறுபடுத்துகிறது.
- source_word: וַאֲבִידָע
  choice: அபிதா
  rationale: எபிரெயத் தனிப்பெயரின் நெருக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: וְאֶלְדָּעָה
  choice: எல்தாகா
  rationale: எபிரெயத் தனிப்பெயரை அதன் மெய்யொலி வேறுபாடுகளை இயன்றவரை காத்து ஒலிபெயர்க்கிறது.
- source_word: כָּל אֵלֶּה
  choice: இவர்கள் அனைவரும்
  rationale: முன் பட்டியலிடப்பட்ட நபர்களைத் தொகுத்துச் சுட்டும் இயல்பான நவீன தமிழ்.
- source_word: בְּנֵי קְטוּרָה
  choice: கேத்தூராளின் மகன்கள்
  rationale: எபிரெயக் கட்டுநிலைத் தொடரைத் தெளிவான தமிழ் உடைமைத் தொடராக வழங்குகிறது; பெண் நபர்பெயருடன் மரியாதை/இயல்பைக் காட்டும் ‘ஆள்’ விகுதி இணைக்கப்பட்டுள்ளது.
