base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/019.yaml
  text: 'And to Eber were born two sons: the name of the one was Peleg[a], because in his days the earth was divided; and his brother’s name was Joktan.'
translation:
  language: ta
  text: ஏபேருக்கு இரண்டு மகன்கள் பிறந்தார்கள். ஒருவனுடைய பெயர் பேலேகு[a]; ஏனெனில் அவனுடைய நாட்களில் பூமி பிரிக்கப்பட்டது. அவனுடைய சகோதரனின் பெயர் யொக்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நிலம் பிரிக்கப்பட்டது’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் முழுப் பூமியையோ ஒரு நிலப்பரப்பு அல்லது தேசத்தையோ குறிக்கலாம்; எத்தகைய பிரிவு ஏற்பட்டது என்பதை உரை குறிப்பிடவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְעֵבֶר
  choice: ஏபேருக்கு
  rationale: முந்தைய வம்சவரலாற்றின் தொடர்ச்சியைத் தமிழ் நடையில் இயல்பாகக் காட்டுகிறது; לְ குறிக்கும் மறைமுக வேற்றுமை உறவு ‘-க்கு’ எனத் தக்கவைக்கப்படுகிறது.
- source_word: יֻלַּד שְׁנֵי בָנִים
  choice: இரண்டு மகன்கள் பிறந்தார்கள்
  rationale: எபிரெயச் சொல்லமைப்பின் செயப்பாட்டு பிறப்பு கருத்தையும், மகன்கள் என்ற ஆண்பால் சார்ந்த வம்சவரலாற்றுப் பொருளையும் இயல்பான தமிழில் தருகிறது.
- source_word: שֵׁם הָאֶחָד
  choice: ஒருவனுடைய பெயர்
  rationale: ‘ஒருவனின் பெயர்’ என்ற நேரடியான வேறுபடுத்தலைப் பாதுகாக்கிறது; மூலத்தில் இல்லாத ‘முதலாமவன்’ என்ற வரிசைப் பொருளைச் சேர்க்கவில்லை.
- source_word: פֶּלֶג
  choice: பேலேகு
  rationale: எபிரெயத் தனிப்பெயரின் ஒலிப்பைத் தமிழில் எழுத்துப்பெயர்க்கிறது.
- source_word: כִּי בְיָמָיו
  choice: ஏனெனில் அவனுடைய நாட்களில்
  rationale: כִּי இங்கு பெயருக்கான காரண விளக்கத்தை அறிமுகப்படுத்துகிறது; ‘அவனுடைய நாட்களில்’ என்பது காலக் குறிப்பை வெளிப்படையாகப் பாதுகாக்கிறது.
- source_word: נִפְלְגָה הָאָרֶץ
  choice: பூமி பிரிக்கப்பட்டது
  rationale: நִפְלְגָה என்பதன் செயப்பாட்டு பொருளைப் பாதுகாக்கிறது. הָאָרֶץ என்பதற்கு இங்கு பரந்த ‘பூமி’ என்பதை முதன்மை வாசிப்பாகக் கொண்டு, ‘நிலம்/தேசம்’ என்ற சாத்தியத்தை அடிக்குறிப்பில் தருகிறது.
- source_word: וְשֵׁם אָחִיו
  choice: அவனுடைய சகோதரனின் பெயர்
  rationale: உடைமை உறவையும் இரு மகன்களுக்கு இடையிலான சகோதர உறவையும் இயல்பான தமிழ் சொல்லமைப்பில் தருகிறது.
- source_word: יָקְטָן
  choice: யொக்தான்
  rationale: எபிரெயத் தனிப்பெயரின் ஒலிப்பைத் தமிழில் எழுத்துப்பெயர்க்கிறது.
theological_decisions:
- issue: ‘பூமி பிரிக்கப்பட்டது’ என்பதன் குறிப்பு
  choice: பிரிவின் தன்மையை விளக்காமல், ‘பூமி பிரிக்கப்பட்டது’ என்ற பரந்த மொழியைத் தக்கவைத்தல்
  alternative: ‘நிலம்/தேசம் பிரிக்கப்பட்டது’ என்று மொழிபெயர்த்தல்; அல்லது பாபேலுக்குப் பிந்தைய மக்கள்/மொழிப் பிரிவையோ புவியியல் பிரிவையோ வெளிப்படையாகக் குறிப்பிடுதல்
  rationale: மூல எபிரெய உரை எந்த வகையான பிரிவு என்பதை வரையறுக்கவில்லை. ஆகவே குறிப்பிட்ட வரலாற்று அல்லது புவியியல் விளக்கத்தை முதன்மை உரைக்குள் இறக்குமதி செய்யாமல் அதன் உண்மையான பொருள் தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், வம்சவரலாற்றுக்கேற்ற சுருக்கமான மற்றும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. தனிப்பெயர்கள் மூல எபிரெய ஒலிப்பை அணுகும் வகையில் எழுத்துப்பெயர்க்கப்பட்டுள்ளன; விளக்கப்படாத பொருள் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
