base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/007.yaml
  text: 'And the sons of Javan: Elishah[a], Tarshish, Kittim, and Rodanim.'
translation:
  language: ta
  text: 'மேலும், யாவானின் மகன்கள்: எலீஷா, தர்ஷீஷ், கித்தீம், ரோதானீம்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ஆதியாகமம் 10:4-இல் “ரோதானீம்” என்பதற்குப் பதிலாக “தோதானீம்” என்று உள்ளது; இது பெயரிலுள்ள ஒரு மூலப்பாட வேறுபாட்டைக் காட்டுகிறது.
    reason: textual_variant
lexical_decisions:
- source_word: וּבְנֵי
  choice: மகன்கள்
  rationale: בְּנֵי என்பதன் நேரடிப் பொருள் ‘மகன்கள்’; வம்சப்பட்டியல் நடையைப் பாதுகாக்கிறது. தொடக்க וּ இணைப்பை, தமிழில் முந்தைய வசனத்துடன் இயல்பாகத் தொடரும் பட்டியல் அமைப்பில் தனியே ‘மேலும்’ என்று மொழிபெயர்க்கவில்லை.
- source_word: יָוָן
  choice: யாவான்
  rationale: கிரேக்க உலகுடன் தொடர்புடைய பெயராக இருந்தாலும், இங்கு வம்சப்பட்டியலில் வரும் இயற்பெயர்; எனவே பொருளாக்காமல் ஒலிபெயர்க்கப்பட்டது.
- source_word: אֱלִישָׁה
  choice: எலீஷா
  rationale: எபிரேய இயற்பெயரின் ஒலியைத் தமிழில் தெளிவாகக் காட்டும் ஒலிபெயர்ப்பு.
- source_word: תַרְשִׁישָׁה
  choice: தர்ஷீஷ்
  rationale: இயற்பெயர் ஒலிபெயர்க்கப்பட்டது; இறுதி ה இங்கு தனிப் பொருள் கோரும் கூறாக எடுத்துக்கொள்ளப்படவில்லை.
- source_word: כִּתִּים
  choice: கித்தீம்
  rationale: இன/இடப் பெயரை எபிரேய ஒலிக்கு நெருக்கமாகவும் நவீனத் தமிழில் வாசிக்கத்தக்கவாறும் ஒலிபெயர்க்கிறது.
- source_word: וְרוֹדָנִים
  choice: ரோதானீம்
  rationale: நாளாகமத்தின் மசோரா மூலப்பாடமான רוֹדָנִים பின்பற்றப்பட்டது; ஆதியாகமம் 10:4-இன் ‘தோதானீம்’ என்ற வேறுபாடு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், நாளாகம வம்சப்பட்டியலுக்குரிய சுருக்கமான மற்றும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. இயற்பெயர்கள் மொழிபெயர்க்கப்படாமல் எபிரேயத்திலிருந்து ஒலிபெயர்க்கப்பட்டுள்ளன.
