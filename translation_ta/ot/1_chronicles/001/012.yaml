base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/012.yaml
  text: and the Pathrusites[a], and the Casluhites (from whom the Philistines came), and the Caphtorites.
translation:
  language: ta
  text: பத்ரூசீமையும் கஸ்லூகீமையும்—அங்கிருந்து பெலிஸ்தியர்கள் வந்தார்கள்[a]—கப்தோரீமையும் பெற்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “அங்கிருந்து பெலிஸ்தியர்கள் வெளியே வந்தார்கள்.” இங்கு எபிரெய வாசகம் இந்தச் சொற்றொடரை இயல்பாகக் கஸ்லூகீமுடன் இணைக்கிறது. ஆதியாகமம் 10:14-லும் இதே சொற்றொடர் உள்ளது; எனினும் ஆமோஸ் 9:7; எரேமியா 47:4 ஆகியவை பெலிஸ்தியர்களைக் கப்தோருடனும் தொடர்புபடுத்துகின்றன.'
    reason: cross_reference
lexical_decisions:
- source_word: פַּתְרֻסִים
  choice: பத்ரூசீம்
  rationale: பத்ரோசுடன் தொடர்புடைய மக்களினப் பெயர்; எபிரெய வடிவுக்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டது.
- source_word: כַּסְלֻחִים
  choice: கஸ்லூசீம்
  rationale: குறிப்பிடும் மக்கள் யார் என்பது உறுதியில்லாத இனப்பெயர்; தேவையற்ற விளக்கத்தைத் தவிர்த்து ஒலிபெயர்க்கப்பட்டது.
- source_word: אֲשֶׁר יָצְאוּ מִשָּׁם
  choice: இவர்களிடமிருந்து ... தோன்றினார்கள்
  rationale: சொல்லுக்குச் சொல் பொருள் ‘அங்கிருந்து வெளியே வந்தார்கள்.’ வம்சப் பட்டியல் சூழலில் உடனடியாக முந்திய கஸ்லூசீமிலிருந்து வந்த தோற்றத்தை இயல்பான தமிழில் குறிக்கிறது; நேரடி வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: פְּלִשְׁתִּים
  choice: பெலிஸ்தியர்கள்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் அறியப்பட்ட மக்களினப் பெயரைப் பயன்படுத்துகிறது.
- source_word: כַּפְתֹּרִים
  choice: கப்தோரீம்
  rationale: கப்தோருடன் தொடர்புடைய மக்களினப் பெயர்; எபிரெய வடிவுக்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டது.
- source_word: וְאֶת
  choice: -ஐயும் / -ஐயும்
  rationale: மீண்டும் வரும் இணைப்பையும் நேரடி பொருள் குறியையும் தமிழ் பட்டியல் நடைக்கு இயல்பான ‘-ஐயும்’ அமைப்பால் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: பெலிஸ்தியர்களின் தோற்றத்தைக் குறிக்கும் சார்புத் தொடரின் தொடர்பு
  choice: உடனடியாக முந்திய கஸ்லூசீமுடன் தொடர்புபடுத்தப்பட்டது
  alternative: கப்தோரீமுடன் தொடர்புபடுத்துதல் அல்லது பொதுவாக ‘அங்கிருந்து’ என விடுதல்
  rationale: நாளாகமத்தின் எபிரெய சொல் வரிசையிலும் இலக்கணத்திலும் உடனடியாக முந்திய கஸ்லூசீமே இயல்பான முன்னிலைச் சொல். ஆயினும் கப்தோருடன் பெலிஸ்தியர்களை இணைக்கும் வேறு வேதாகமச் சான்றுகள் உள்ளதால் அந்த உரைமரபுத் தளர்வு அடிக்குறிப்பில் வெளிப்படையாக வைக்கப்பட்டது.
translation_notes:
  register: நவீன தரமான, கண்ணியமான தமிழ். வம்சப் பட்டியலின் தொடர்ச்சியைத் தெளிவாக்க ‘பெற்றான்’ சேர்க்கப்பட்டுள்ளது; இது முந்திய வசனத்திலிருந்து தொடரும் வாக்கிய அமைப்பைத் தமிழில் நிறைவு செய்கிறது. இனப்பெயர்கள் மொழிபெயர்க்கப்படாமல் எபிரெய ஒலிக்கு நெருக்கமாக வழங்கப்பட்டுள்ளன.
