id: 1CH.1.41
reference: 1 Chronicles 1:41
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: בְּנֵ֥י עֲנָ֖ה דִּישׁ֑וֹן וּ/בְנֵ֣י דִישׁ֔וֹן חַמְרָ֥ן וְ/אֶשְׁבָּ֖ן וְ/יִתְרָ֥ן וּ/כְרָֽןס׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/041.yaml
  text: 'The sons of Anah: Dishon. And the sons of Dishon: Hamran[a], Eshban, Ithran, and Keran.'
translation:
  language: ta
  text: 'அனாவின் மகன்கள்: திஷோன்; மேலும், திஷோனின் மகன்கள்: ஹம்ரான்[a], எஷ்பான், இத்ரான், கெரான்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ஆதியாகமம் 36:26-இல் உள்ள இணையான வம்சப் பட்டியல், இங்குள்ள “ஹம்ரான்” என்பதற்குப் பதிலாக “ஹெம்தான்” என்று வாசிக்கிறது. முதன்மைப் பாடம் இங்கே 1 நாளாகமத்தின் மசோரெட்டிக் மூலபாடத்தைப் பின்பற்றுகிறது.
    reason: textual_variant
lexical_decisions:
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: வம்சப் பட்டியலில் வரும் בְּנֵי என்ற ஆண்பால் பன்மை இணைப்புநிலையை இயல்பாகவும் துல்லியமாகவும் தெரிவிக்கிறது.
- source_word: עֲנָה
  choice: ஆனா
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் இயல்பாக எழுத்துப்பெயர்த்த வடிவம்.
- source_word: דִּישׁוֹן
  choice: தீஷோன்
  rationale: இங்கு ஆனாவின் மகனாகவும் அடுத்த நான்கு பேரின் தந்தையாகவும் வரும் ஒரே பெயருக்கு ஒரே எழுத்துப்பெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: וּבְנֵי
  choice: மகன்கள்
  rationale: தமிழில் புதிய வம்சப் பட்டியல் வாக்கியத்தை இயல்பாகத் தொடங்குவதற்காக இணைப்புச் சொல் தனியே மொழிபெயர்க்கப்படவில்லை; பட்டியல் தொடர்பு வாக்கிய அமைப்பிலேயே தெளிவாக உள்ளது.
- source_word: חַמְרָן
  choice: அம்ரான்
  rationale: 1 நாளாகமத்தின் மசோரா மூலபாடத்திலுள்ள חמרן என்பதையே முதன்மைப் பாடமாகப் பின்பற்றுகிறது; ஆதியாகமம் 36:26-இன் வேறுபாடு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: אֶשְׁבָּן
  choice: எஷ்பான்
  rationale: எபிரெய தனிப்பெயரின் நேரடியான தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: יִתְרָן
  choice: இத்ரான்
  rationale: எபிரெய பெயரின் தொடக்க மெய்யையும் உயிரொலியையும் நவீன தமிழில் இயல்பாகக் காட்டும் எழுத்துப்பெயர்ப்பு.
- source_word: כְרָן
  choice: கெரான்
  rationale: எபிரெய தனிப்பெயரைத் தமிழில் ஒலிக்கு நெருக்கமாக எழுத்துப்பெயர்த்த வடிவம்.
