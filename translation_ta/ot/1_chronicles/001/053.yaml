lexical_decisions:
- source_word: אַלּוּף
  choice: குலத்தலைவன்
  rationale: ஏதோமியப் பட்டியல்களில் இந்தச் சொல் ஒரு குலம் அல்லது பழங்குடிக் குழுவின் தலைவரைக் குறிக்கிறது. நவீனத் தமிழில் ‘குலத்தலைவன்’ என்பது அந்தப் பொருளைத் தெளிவாகவும் சுருக்கமாகவும் தருகிறது.
- source_word: קְנַז
  choice: கேனாஸ்
  rationale: பெயர்ச்சொல்; எபிரெய ஒலிப்புக்கு ஏற்ப தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: תֵּימָן
  choice: தேமான்
  rationale: இங்கு ஏதோமியத் தலைவர்களின் பட்டியலில் பெயராக வருகிறது; ஆகவே பொருள் மொழிபெயர்க்காமல் ஒலிபெயர்க்கப்பட்டது.
- source_word: מִבְצָר
  choice: மிப்சார்
  rationale: பெயர்ச்சொல்; அதன் பொதுப்பொருளை மொழிபெயர்க்காமல் எபிரெய வடிவத்திலிருந்து ஒலிபெயர்க்கப்பட்டது.
