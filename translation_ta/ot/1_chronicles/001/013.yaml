  source_fidelity: 'மூல எபிரேயத்தின் வம்சவரிசை அமைப்பு துல்லியமாகப் பிரதிபலிக்கப்பட்டுள்ளது: கானான் எழுவாயாகவும், சீதோன் அவனுடைய முதற்பேறாகவும், ஏத் இரண்டாவது பெயராகவும் உள்ளது. ஆண் எழுவாயுடனான יָלַד என்பதற்கு “பெற்றான்” என்பது இச்சூழலில் பொருத்தமான நவீன தமிழ் வழக்கு.'
  naturalness: “கானான் தன் முதற்பேறான சீதோனையும், ஏத்தையும் பெற்றான்” என்பது சுருக்கமானதும் கண்ணியமான வம்சப்பட்டியல் நடையிலானதும் ஆகும். “முதற்பேறான” சீதோனை மட்டுமே வரையறுக்கிறது; இணைப்பு அமைப்பு ஏத்தை அதனுடன் தவறாக இணைக்கவில்லை.
