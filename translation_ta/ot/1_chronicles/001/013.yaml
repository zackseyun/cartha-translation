base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/013.yaml
  text: And Canaan fathered Sidon his firstborn[b][a], and Heth.
translation:
  language: ta
  text: கானான் தன் முதற்பேறான சீதோனையும், ஏத்தையும்[a] பெற்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஏத்” என்பது ஏத்தியருடன் தொடர்புடைய முன்னோரின் பெயர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/כְנַעַן
  choice: கானான்
  rationale: கானான் என்பது தமிழில் நிலைபெற்ற பெயரெழுத்தாக்கம். வம்சப்பட்டியலின் தொடர்ச்சியைத் தமிழின் இயல்பான வாக்கிய ஓட்டமே காட்டுவதால், தொடக்க இணைப்புச்சொல் தனியாக மொழிபெயர்க்கப்படவில்லை.
- source_word: יָלַד
  choice: பெற்றான்
  rationale: ஆண் எழுவாயுடன் வரும் வம்சப்பட்டியல் சூழலில் இச்சொல் ஒருவருக்குத் தந்தையாகியதைக் குறிக்கிறது. ‘பெற்றான்’ என்பது சுருக்கமாகவும் இயல்பாகவும் அந்த வம்ச உறவைத் தெரிவிக்கிறது.
- source_word: צִידוֹן
  choice: சீதோன்
  rationale: எபிரெயப் பெயரான Ṣîḏôn என்பதற்குத் தமிழில் வழக்கிலுள்ள பெயரெழுத்தாக்கம்.
- source_word: בְּכֹר/וֹ
  choice: தன் முதற்பேறான
  rationale: ‘அவனுடைய முதற்பேறு’ என்ற பிறப்பு வரிசை வலியுறுத்தலைப் பாதுகாக்கிறது; மூலத்தில் இல்லாத ‘மகன்’ என்ற சொல்லைச் சேர்க்கவில்லை.
- source_word: וְ/אֶת
  choice: -ஐயும்
  rationale: இணைப்புச்சொல்லையும் இரண்டாம் நேரடிச் செயப்படுபொருளையும் இயல்பான தமிழ் இணைப்பு விகுதி எடுத்துரைக்கிறது.
- source_word: חֵת
  choice: ஏத்
  rationale: இங்கு இருப்பது பன்மை இனப்பெயர் அல்ல, வம்சப்பட்டியலில் வரும் தனிப்பட்ட முன்னோரின் பெயர்; எனவே பெயராகவே எழுத்தாக்கப்பட்டுள்ளது.
