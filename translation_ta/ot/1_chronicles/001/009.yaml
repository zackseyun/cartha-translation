id: 1CH.1.9
reference: 1 Chronicles 1:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וּ/בְנֵ֣י כ֔וּשׁ סְבָא֙ וַ/חֲוִילָ֔ה וְ/סַבְתָּ֥א וְ/רַעְמָ֖א וְ/סַבְתְּכָ֑א וּ/בְנֵ֥י רַעְמָ֖א שְׁבָ֥א וּ/דְדָֽן׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/009.yaml
  text: 'The sons of Cush: Seba[a], Havilah, Sabta, Raama, and Sabteca[c][b]. And the sons of Raama: Sheba and Dedan.'
translation:
  language: ta
  text: 'கூஷின் மகன்கள்: செபா, ஹவிலா, சப்தா, ராமா, சப்தெகா. மேலும் ராமாவின் மகன்கள்: ஷெபா, தெதான்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי כוּשׁ
  choice: கூஷின் மகன்கள்
  rationale: בְּנֵי என்பதன் நேரடிப் பொருள் ‘மகன்கள்.’ இது வம்சவரலாற்றுப் பட்டியல் என்றாலும், இங்கு உடனடிக் கிளையைச் சுட்டும் சூத்திர வடிவத்தைப் பாதுகாக்க ‘சந்ததியினர்’ என்பதற்குப் பதிலாக ‘மகன்கள்’ பயன்படுத்தப்பட்டது. தொடக்க ו தமிழ் பட்டியல் நடையில் தனியே மொழிபெயர்க்கப்படவில்லை.
- source_word: סְבָא
  choice: செபா
  rationale: எபிரெய உச்சரிப்பை அணுகும் வகையில் பெயர் ஒலிபெயர்க்கப்பட்டது; பின்னர் வரும் שְׁבָא என்பதிலிருந்து வேறுபாடு தெளிவாக இருக்க குறில் ‘செ’ பயன்படுத்தப்பட்டது.
- source_word: חֲוִילָה
  choice: அவிலா
  rationale: Proper name transliterated according to a natural Tamil biblical-name form, representing the Hebrew consonantal sequence without translating the name.
- source_word: סַבְתָּא
  choice: சப்தா
  rationale: எபிரெயப் பெயரின் மெய்யெழுத்து அமைப்பைத் தெளிவாகவும் தமிழில் இயல்பாகவும் ஒலிபெயர்க்கிறது.
- source_word: רַעְמָא
  choice: ராமா
  rationale: பெயரிலுள்ள தொண்டை மெய் ע தமிழில் தனியாக இயல்பாகக் குறிக்கப்படாததால், வாசிக்க எளிய ‘ராமா’ வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- source_word: סַבְתְּכָא
  choice: சப்தெகா
  rationale: எபிரெய மெய்யெழுத்துகளையும் சொல் அசைகளையும் நெருக்கமாகப் பாதுகாக்கும் தமிழ் ஒலிபெயர்ப்பு.
- source_word: וּבְנֵי רַעְמָא
  choice: ராமாவின் மகன்கள்
  rationale: புதிய துணைக் கிளையைத் தொடங்கும் வம்சவரலாற்றுச் சூத்திரம். தமிழில் வாக்கியப் பிரிவு அந்த இணைப்பைத் தெளிவாக்குவதால் தொடக்க ו தனியே ‘மேலும்’ என்று மொழிபெயர்க்கப்படவில்லை.
- source_word: שְׁבָא
  choice: சேபா
  rationale: சேபா என்ற வடிவம் சְבָא (‘செபா’) என்பதிலிருந்து வேறுபாட்டைக் காட்டுவதோடு, பெயரின் பரவலான தமிழ் ஒலிவடிவத்தையும் பின்பற்றுகிறது.
- source_word: דְדָן
  choice: தேதான்
  rationale: எபிரெயப் பெயர் நேரடியாக ஒலிபெயர்க்கப்பட்டது; மூலத்தில் இல்லாத ‘குலம்’ அல்லது ‘சந்ததி’ போன்ற விளக்கம் சேர்க்கப்படவில்லை.
