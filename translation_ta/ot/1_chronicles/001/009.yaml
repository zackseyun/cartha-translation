translation_notes:
  register: நவீன நிலையான தமிழில், வம்சவரலாற்றுப் பட்டியலின் சுருக்கமான மற்றும் கண்ணியமான நடையைப் பாதுகாக்கிறது. பெயர்கள் மொழிபெயர்க்கப்படாமல் தமிழ் எழுத்தில் ஒலிபெயர்க்கப்பட்டுள்ளன. ஆங்கிலத்தில் தேவைப்பட்ட இறுதி h சார்ந்த மாற்று வடிவக் குறிப்புகள் தமிழுக்கு பொருந்தாததால் அடிக்குறிப்புகளாக கொண்டுவரப்படவில்லை.
