    issue: அவிலா omits the initial consonant of חֲוִילָה.
    rationale: The Hebrew begins with ח (ḥet). In a source-oriented Tamil transliteration it should be represented, e.g. “ஹவிலா.”
  - severity: medium
    issue: சேபா and தேதான் introduce long initial vowels not indicated by the pointed Hebrew forms שְׁבָא and דְדָן.
    rationale: Both begin with shewa, not a long e vowel. “ஷெபா” and “தெதான்” more closely preserve the source pronunciation; “ஷெபா” also distinguishes שְׁבָא from סְבָא.
  revised_text: 'கூஷின் மகன்கள்: செபா, ஹவிலா, சப்தா, ராமா, சப்தெகா. மேலும் ராமாவின் மகன்கள்: ஷெபா, தெதான்.'
