  text: בְּנֵ֣י יֶ֔פֶת גֹּ֣מֶר וּ/מָג֔וֹג וּ/מָדַ֖י וְ/יָוָ֣ן וְ/תֻבָ֑ל וּ/מֶ֖שֶׁךְ וְ/תִירָֽס׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/005.yaml
  text: 'The sons of Japheth: Gomer[a], Magog, Madai, Javan, Tubal, Meshech, and Tiras.'
translation:
  language: ta
  text: 'யாப்பேத்தின் மகன்கள்: கோமேர்[a], மாகோகு, மாதாய், யாவான், தூபால், மேசேக்கு, தீராஸ்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் “மகன்கள்” என்பது வம்சாவளிச் சூழலில் நேரடி மகன்களையோ, விரிந்த பொருளில் வழித்தோன்றல்களையோ குறிக்கக்கூடும்; இங்கு அது யாப்பேத்தின் வம்சத்தை ஒரு பெயர்ப் பட்டியலாக அறிமுகப்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: בֵּן என்பதன் பன்மை இணைப்புநிலை வடிவம்; வம்சப் பட்டியலை அறிமுகப்படுத்துகிறது. இந்த இடத்தில் உடனடியாகப் பெயரிடப்பட்ட மகன்களைக் குறிக்கும் இயல்பான, நேரடியான மொழிபெயர்ப்பு.
- source_word: יֶפֶת
  choice: யாப்பேத்
  rationale: எபிரெய தனிப்பெயரின் ஒலியை நவீனத் தமிழில் இயன்றவரை தக்கவைக்கும் ஒலிபெயர்ப்பு.
- source_word: גֹּמֶר
  choice: கோமேர்
  rationale: வம்சப் பட்டியலிலுள்ள தனிப்பெயர்; பொருளாக்காமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: מָגוֹג
  choice: மாகோகு
  rationale: தனிப்பெயர்; இறுதி எபிரெய மெய்யொலி தமிழில் தெளிவாகக் கேட்குமாறு ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: מָדַי
  choice: மாதாய்
  rationale: இங்கு இனப்பெயராக விளக்காமல், வம்சப் பட்டியலிலுள்ள பெயராக ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: יָוָן
  choice: யாவான்
  rationale: கிரேக்கம் அல்லது ஐோனியா என்று பொருளாக்காமல், இங்குள்ள தனிப்பெயர் வடிவம் பாதுகாக்கப்பட்டுள்ளது.
- source_word: תֻבָל
  choice: தூபால்
  rationale: எபிரெய உயிரொலி மற்றும் பெயரின் வடிவத்தை அணுகும் தமிழ் ஒலிபெயர்ப்பு.
- source_word: מֶשֶׁךְ
  choice: மேசேக்கு
  rationale: தனிப்பெயர்; எபிரெய பெயரின் ஒலியை வாசிக்கத்தக்க தமிழில் ஒலிபெயர்க்கிறது.
- source_word: תִירָס
  choice: தீராஸ்
  rationale: தனிப்பெயர்; பொருளாக்காமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְ / וּ
  choice: காற்புள்ளிகளால் பிரிக்கப்பட்ட பெயர்ப்பட்டியல்
  rationale: எபிரெயத்தில் பெரும்பாலான பெயர்களுக்கு முன் இணைப்புச்சொல் திரும்பத் திரும்ப வருகிறது. நவீனத் தமிழில் இயல்பான பட்டியல் நடைக்காகக் காற்புள்ளிகள் பயன்படுத்தப்பட்டுள்ளன; பட்டியல் உறவு மாறவில்லை.
