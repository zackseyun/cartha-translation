  text: אַלּ֥וּף מַגְדִּיאֵ֖ל אַלּ֣וּף עִירָ֑ם אֵ֖לֶּה אַלּוּפֵ֥י אֱדֽוֹם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/054.yaml
  text: Chief Magdiel[a], chief Iram. These were the chiefs of Edom.
translation:
  language: ta
  text: தலைவன் மக்தியேல்[a], தலைவன் ஈராம். இவர்களே ஏதோமின் தலைவர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “குலத்தலைவன் மக்தியேல்.” எபிரெயச் சொல் ஓர் இனக்குழு அல்லது குலத்தின் தலைவரைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלּוּף
  choice: தலைவன் / தலைவர்கள்
  rationale: ஏதோமிய மரபுப் பட்டியலில் இச்சொல் ஒரு குலம் அல்லது இனக்குழுவின் தலைவரைக் குறிக்கிறது. நவீனத் தமிழில் இயல்பாகவும் பட்டியலின் சுருக்கமான நடைக்கு ஏற்றவாறும் ‘தலைவன்’ பயன்படுத்தப்பட்டது.
- source_word: מַגְדִּיאֵל
  choice: மக்தியேல்
  rationale: இது இயற்பெயர்; அதன் சாத்தியமான பொருளை மொழிபெயர்க்காமல் எபிரெய ஒலிப்புக்கு நெருக்கமாக எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: עִירָם
  choice: ஈராம்
  rationale: இது இயற்பெயர்; எபிரெய உச்சரிப்புக்கு நெருக்கமாகத் தமிழில் எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: אֵלֶּה
  choice: இவர்களே
  rationale: வினைச்சொல் இல்லாத எபிரெயச் சுருக்க வாக்கியத்தை இயல்பான தமிழில் வழங்குகிறது; முன் பட்டியலிடப்பட்ட நபர்களைச் சுட்டுவதால் மனிதர்களுக்குரிய ‘இவர்கள்’ பயன்படுத்தப்பட்டு, தொகுப்புரையின் வலியுறுத்தல் ‘-ஏ’ மூலம் தக்கவைக்கப்பட்டது.
- source_word: אַלּוּפֵי אֱדֹם
  choice: ஏதோமின் தலைவர்கள்
  rationale: முன்னுள்ள பெயர்களை ஏதோமியத் தலைவர்களாகத் தொகுத்துக் கூறும் இணைப்புத் தொடர்; ‘ஏதோமின் தலைவர்கள்’ சுருக்கமாகவும் தெளிவாகவும் உள்ளது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், வம்சப்பட்டியலுக்கேற்ற சுருக்கமான, கண்ணியமான நடை பயன்படுத்தப்பட்டது. ‘பிரபு’ போன்ற மரபுசார்ந்த அல்லது தெளிவற்ற சொல்லுக்குப் பதிலாகப் பொதுவாகப் புரியும் ‘தலைவன்’ தேர்ந்தெடுக்கப்பட்டது.
