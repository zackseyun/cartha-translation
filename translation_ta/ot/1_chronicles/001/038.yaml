- source_word: וּבְנֵי שֵׂעִיר
  choice: சேயீரின் மகன்கள்
  rationale: בְנֵי என்பது வம்சப் பட்டியலை அறிமுகப்படுத்தும் ‘மகன்கள்’ என்ற இணைவு வடிவம். வசனம் பட்டியல் வடிவில் இயல்பாகத் தொடங்குவதால் prefixed ו தனியே ‘மேலும்’ என மொழிபெயர்க்கப்படவில்லை; தொடர்ச்சி சூழலில் வெளிப்படுகிறது.
- source_word: שֵׂעִיר
