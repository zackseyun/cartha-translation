    text: வம்சப் பட்டியல் சூழல்களில் எபிரேய மொழியின் ‘மகன்கள்’ என்ற சொல் நேரடியான மகன்களையோ, விரிவான பொருளில் வழித்தோன்றல்கள் அல்லது குல உறுப்பினர்களையோ குறிக்கலாம். இங்கு மூலத்தின் வம்சப் பட்டியல் சொல்லமைப்பு பேணப்பட்டுள்ளது.
