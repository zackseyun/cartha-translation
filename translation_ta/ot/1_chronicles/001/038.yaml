  text: 'And the sons of Seir: Lotan[a], Shobal, Zibeon, Anah, Dishon, Ezer, and Dishan.'
translation:
  language: ta
  text: 'மேலும், சேயீரின் மகன்கள்[a]: லோத்தான், சோபால், சிபியோன், ஆனா, தீஷோன், ஏத்சேர், தீஷான்.'
