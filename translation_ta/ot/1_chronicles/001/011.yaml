    reason: lexical_alternative
lexical_decisions:
- source_word: מִצְרַיִם
  choice: மிஸ்ராயீம்
  rationale: வம்சப்பட்டியலில் இது இடப்பெயரான ‘எகிப்து’ என்பதற்குப் பதிலாக ஒரு நபரின் இயற்பெயராக வருவதால் ஒலிபெயர்க்கப்பட்டது.
- source_word: יָלַד
  choice: பெற்றான்
  rationale: ஆண் வம்சவழிச் சூழலில் பிறப்பித்தல் அல்லது முன்னோராக இருத்தலைக் குறிக்கிறது; நவீன தமிழில் இயல்பாகவும் சுருக்கமாகவும் ‘பெற்றான்’ என வழங்கப்பட்டது.
- source_word: אֶת
  choice: '[தனியாக மொழிபெயர்க்கப்படவில்லை]'
  rationale: இது எபிரெய மொழியின் நேரடிச் செயப்படுபொருள் குறியீடு; தமிழில் தனிச் சொல்லாகத் தேவைப்படாமல் ‘-ஐ’ வேற்றுமை உருபில் அதன் இலக்கணப் பணி வெளிப்படுகிறது.
- source_word: לודיים
  choice: லூதியர்
  rationale: மக்களினப் பெயரைக் குறிக்கும் எபிரெயப் பன்மை வடிவம்; தமிழில் புரியத்தக்க இனக்குழுப் பெயராக ‘-யர்’ வடிவில் வழங்கப்பட்டது.
- source_word: עֲנָמִים
  choice: அனாமியர்
  rationale: பட்டியலிலுள்ள மக்களினப் பெயர்களுடன் ஒருமைப்பாட்டை காக்கத் தமிழுக்குரிய இனக்குழுப் பெயர் வடிவில் வழங்கப்பட்டது.
- source_word: לְהָבִים
  choice: லெகாபியர்
  rationale: எபிரெய மெய்யெழுத்தான ה இங்கு ‘க’ ஒலியால் அணுகப்பட்டு, மக்களினப் பெயராகத் தமிழில் இயல்பான வடிவம் தரப்பட்டது.
- source_word: נַפְתֻּחִים
  choice: நப்துகியர்
  rationale: மூலப்பெயரின் ஒலியமைப்பை இயன்றவரை காத்து, மக்களினத்தைக் குறிக்கும் தமிழ் வடிவில் வழங்கப்பட்டது.
