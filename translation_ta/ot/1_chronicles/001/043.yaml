source:
  edition: WLC
  text: וְ/אֵ֣לֶּה הַ/מְּלָכִ֗ים אֲשֶׁ֤ר מָלְכוּ֙ בְּ/אֶ֣רֶץ אֱד֔וֹם לִ/פְנֵ֥י מְלָךְ מֶ֖לֶךְ לִ/בְנֵ֣י יִשְׂרָאֵ֑ל בֶּ֚לַע בֶּן בְּע֔וֹר וְ/שֵׁ֥ם עִיר֖/וֹ דִּנְהָֽבָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/043.yaml
  text: 'And these are the kings who reigned in the land of Edom before any king reigned over the sons of Israel: Bela son of Beor, and the name of his city was Dinhabah.'
translation:
  language: ta
  text: 'இஸ்ரவேல் மக்கள்மேல் ஒரு அரசன் ஆட்சி செய்வதற்கு முன்பு ஏதோம் நாட்டில் ஆட்சி செய்த அரசர்கள் இவர்களே: பேயோரின் மகன் பேலா; அவனுடைய நகரத்தின் பெயர் தின்ஹாபா.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இஸ்ரவேல் மக்கள்மேல் எந்த அரசனும் ஆட்சி செய்வதற்கு முன்பு” என்றும் மொழிபெயர்க்கலாம். எபிரெயில் சொல்லுக்குச் சொல், “இஸ்ரவேல் மக்களுக்காக/அவர்கள்மேல் ஓர் அரசன் ஆட்சி செய்வதற்கு முன்பு” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה הַמְּלָכִים
  choice: அரசர்கள் இவர்களே
  rationale: பட்டியலை அறிமுகப்படுத்தும் எபிரெயச் சொல்லமைப்பை இயல்பான நவீனத் தமிழில் தருகிறது; முன்னுள்ள பட்டியலோடு உள்ள தொடர்ச்சியும் சூழலில் தெளிவாக உள்ளது.
- source_word: אֲשֶׁר מָלְכוּ בְּאֶרֶץ אֱדוֹם
  choice: ஏதோம் நாட்டில் ஆட்சி செய்த
  rationale: מָלְכוּ என்பதன் அரசாட்சிப் பொருளையும் אֶרֶץ என்பதிலுள்ள ‘நாடு’ என்ற கூறையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: לִפְנֵי מְלָךְ מֶלֶךְ לִבְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்மேல் ஒரு அரசன் ஆட்சி செய்வதற்கு முன்பு
  rationale: எபிரெயில் உள்ள ஒருமை ‘ஒரு அரசன்’ என்பதையும், לִבְנֵי יִשְׂרָאֵל என்பதன் ஆட்சிக்குட்பட்ட மக்களைக் குறிக்கும் உறவையும் இயல்பான தமிழில் தருகிறது; ‘எந்த அரசனும்’ என்று பொருளைத் தீர்மானிக்கவில்லை.
- source_word: בֶּלַע בֶּן בְּעוֹר
  choice: பேயோரின் மகன் பேலா
  rationale: தமிழ் வாக்கிய ஓட்டத்திற்கு இயல்பான உறவுமுறை அமைப்பில் ஆள்பெயர்களை ஒலிபெயர்க்கிறது.
- source_word: וְשֵׁם עִירוֹ דִּנְהָבָה
  choice: அவனுடைய நகரத்தின் பெயர் தின்காபா
  rationale: பெயர்ச்சொல் வாக்கியத்தைத் தமிழில் இயல்பாகக் கொடுத்து, இடப்பெயரை எபிரெய ஒலிக்கு நெருக்கமாக ஒலிபெயர்க்கிறது.
theological_decisions:
- issue: இஸ்ரவேலர்மேல் அரசாட்சி தொடங்கிய காலத்தைக் குறிக்கும் சொற்றொடர்
  choice: ஒரு அரசன் ஆட்சி செய்வதற்கு முன்பு
  alternative: எந்த அரசனும் ஆட்சி செய்வதற்கு முன்பு
  rationale: מֶלֶךְ என்பது வடிவில் ஒருமை மற்றும் குறிப்பிடப்படாதது. ‘ஒரு அரசன்’ என்பது மூலத்தின் உண்மையான தெளிவின்மையைப் பாதுகாக்கிறது; ‘எந்த அரசனும்’ என்பது சூழலால் சாத்தியமான விளக்கம் என்றாலும் அதை முதன்மை உரையில் கட்டாயப்படுத்தவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பட்டியல் மற்றும் வரலாற்றுக் குறிப்புக்கு ஏற்ற சுருக்கமான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘இஸ்ரவேல் மக்கள்’ என்பது தமிழில் இயல்பாகவும் மூலத்தின் கூட்டுப்பெயர் பொருளைத் தெளிவாகவும் தருகிறது. ஆள்பெயர் மற்றும் இடப்பெயர் ஒலிபெயர்ப்புகள் எபிரெய வடிவங்களை முன்னிறுத்துகின்றன.
