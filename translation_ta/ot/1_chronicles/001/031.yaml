  text: Jetur[a], Naphish, and Kedemah. These were the sons of Ishmael.
translation:
  language: ta
  text: யெத்தூர், நாபீஷ், கேத்மா. இவர்கள் இஸ்மவேலின் மகன்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְטוּר
  choice: யெத்தூர்
  rationale: எபிரெயப் பெயரின் ஒலியை நவீனத் தமிழில் இயன்றவரை தெளிவாகப் பெயர்த்தெழுதிய வடிவம்.
- source_word: נָפִישׁ
  choice: நாபீஷ்
  rationale: பெயரின் நீண்ட உயிரொலியையும் இறுதி שׁ ஒலியையும் பிரதிபலிக்கும் தமிழ் பெயர்த்தெழுத்து.
- source_word: וָ/קֵדְמָה
  choice: கேத்மா
  rationale: ו இணைப்பை பட்டியலில் காற்புள்ளி வழியாக இயல்பாக வெளிப்படுத்தி, קֵדְמָה என்ற பெயரைத் தமிழில் ஒலிபெயர்த்துள்ளது; தமிழில் ק மற்றும் כ/כּ ஆகியவற்றுக்குத் தனித்தனி வழக்கமான எழுத்துகள் இல்லாததால் Q/K வேறுபாட்டுக்கான அடிக்குறிப்பு தேவையில்லை.
- source_word: אֵלֶּה הֵם
  choice: இவர்கள்
  rationale: அடையாளப்படுத்தும் எபிரெயச் சொற்றொடரை இயல்பான தமிழ் சுட்டுப்பெயரால் வழங்குகிறது; ‘இவர்களே’ என வலியுறுத்துவது மூலத்தில் கட்டாயமல்ல.
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: இங்கு இஸ்மவேலின் ஆண் பிள்ளைகள் பட்டியலிடப்படுவதால் பொதுவான ‘பிள்ளைகள்’ என்பதைக் காட்டிலும் ‘மகன்கள்’ துல்லியமானது.
- source_word: יִשְׁמָעֵאל
  choice: இஸ்மவேல்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நன்கு அறியப்பட்ட மரபுவழிப் பெயர் வடிவம்.
theological_decisions: []
translation_notes:
  register: சுருக்கமான வம்சவரலாற்றுப் பட்டியலின் நடையைப் பேணும் வகையில், நவீன நிலையான தமிழில் நேரடியாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. பெயர்கள் மூல எபிரெய ஒலிகளுக்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டுள்ளன.
