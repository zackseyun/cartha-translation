base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/035.yaml
  text: 'The sons of Esau: Eliphaz[a], Reuel, Jeush, Jalam, and Korah.'
translation:
  language: ta
  text: 'ஏசாவின் மகன்கள்: எலிப்பாஸ், ரெகுவேல்[a], எயூஷ், யாலாம், கோரா.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில மொழிபெயர்ப்பு மரபுகளில் இந்தப் பெயர் ‘ரகுவேல்’ என்றும் எழுதப்படுகிறது; இது வேறொரு நபரைக் குறிக்காமல், அதே பெயரின் வேறுபட்ட ஒலிபெயர்ப்பு மரபைப் பிரதிபலிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: בֵּן என்பதன் பன்மை இணைப்பு வடிவம்; நேரடியான மகன்களைப் பட்டியலிடும் வம்சவரலாற்றுச் சூழலில் ‘மகன்கள்’ என்பது இயல்பானதும் துல்லியமானதும் ஆகும்.
- source_word: עֵשָׂו
  choice: ஏசா
  rationale: எபிரெய தனிப்பெயரின் தமிழில் நிலைபெற்ற, எளிதில் அறியக்கூடிய ஒலிபெயர்ப்பு.
- source_word: אֱלִיפַז
  choice: எலிப்பாஸ்
  rationale: எபிரெய தனிப்பெயரைத் தமிழின் ஒலியமைப்புக்கு ஏற்ற வகையில் ஒலிபெயர்க்கிறது.
- source_word: רְעוּאֵל
  choice: ரெகுவேல்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் அறியப்பட்ட பெயர்வடிவத்தைப் பயன்படுத்துகிறது; இது எபிரெய மூலத்திலுள்ள அதே தனிப்பெயரைக் குறிக்கிறது.
- source_word: וִיעוּשׁ
  choice: எயூஷ்
  rationale: முன்னொட்டான இணைப்புச்சொல்லை பட்டியலின் தமிழ் நிறுத்தக்குறிகள் கையாளுகின்றன; தனிப்பெயர் தமிழில் இயல்பாக ‘எயூஷ்’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְיַעְלָם
  choice: யாலாம்
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் வாசிக்கத்தக்க முறையில் பிரதிபலிக்கிறது.
- source_word: וְקֹרַח
  choice: கோராகு
  rationale: இறுதிப் பெயருக்கு முன் உள்ள எபிரெய இணைப்பை தமிழ் பட்டியல் அமைப்பு வெளிப்படுத்துகிறது; பெயர் தமிழில் பரவலாக அறியப்பட்ட வடிவில் தரப்பட்டுள்ளது.
