  text: and the Arvadites[a], and the Zemarites, and the Hamathites.
translation:
  language: ta
  text: அர்வாதியரையும்[a], செமாரியரையும், ஹமாத்தியரையும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இங்குள்ள எபிரெய இனப்பெயர்கள் இலக்கண வடிவில் ஒருமையாக இருந்தாலும், மக்கள் அல்லது குலங்களைத் தொகுப்பாகக் குறிக்கின்றன: அர்வாதியர், செமாரியர், ஹமாத்தியர்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: -ஐயும்
  rationale: இந்த வம்சப்பட்டியலில் וְ என்பது ஒவ்வொரு அடுத்த இனக்குழுவையும் முந்தைய பட்டியலோடு இணைக்கிறது; אֶת நேரடி செயப்படுபொருளைக் குறிக்கிறது. தமிழில் இரண்டின் பணியையும் இயல்பாகச் செயப்படுபொருள் வேற்றுமை உருபுடன் சேர்ந்த ‘-உம்’ வெளிப்படுத்துகிறது.
- source_word: הָאַרְוָדִי
  choice: அர்வாதியர்
  rationale: எபிரெயத்தில் வடிவம் ஒருமையாக இருந்தாலும், இங்கு அர்வாதுடன் தொடர்புடைய மக்கள் அல்லது குலத்தைத் தொகுப்பாகக் குறிக்கிறது. ‘அர்வாதியர்’ அந்த இனப்பெயரையும் கூட்டுப் பொருளையும் இயல்பான தமிழில் காக்கிறது.
- source_word: הַצְּמָרִי
  choice: செமாரியர்
  rationale: சுற்றியுள்ள இனப்பெயர்களைப் போல இதுவும் வடிவில் ஒருமையாக இருந்து, செமாருடன் தொடர்புடைய மக்களைத் தொகுப்பாகக் குறிக்கிறது. ‘செமாரியர்’ மூலப்பெயரின் ஒலியையும் பட்டியலின் நடையையும் காக்கிறது.
- source_word: הַחֲמָתִי
  choice: ஆமாத்தியர்
  rationale: இது ஆமாத்துடன் தொடர்புடைய குடிமக்கள் அல்லது குலத்தைக் குறிக்கும் இனப்பெயர். ‘ஆமாத்தியர்’ அதன் கூட்டுப் பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரமான தமிழில், வம்சப்பட்டியலுக்கேற்ற சுருக்கமானதும் கண்ணியமானதும் ஆன நடை பயன்படுத்தப்பட்டுள்ளது. ஒவ்வொரு பெயருடனும் ‘-ஐயும்’ சேர்த்து எபிரெயப் பட்டியலின் இணைப்பும் செயப்படுபொருள் அமைப்பும் இயல்பாக வெளிப்படுத்தப்பட்டுள்ளன.
