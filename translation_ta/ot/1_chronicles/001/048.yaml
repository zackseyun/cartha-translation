base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/048.yaml
  text: Samlah died[a], and Shaul from Rehoboth by the River reigned in his place.
translation:
  language: ta
  text: சம்லா இறந்தான்; அவனுக்குப் பதிலாக, நதிக்கரையிலுள்ள[a] ரெகொபோத்தைச் சேர்ந்த சவுல் அரசாண்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில், “நதி” அல்லது “அந்த நதி.” இதை ஐபிராத்து நதியைக் குறிப்பதாகப் பலர் புரிந்துகொள்கிறார்கள்.
    reason: எபிரேயத்தில் நதியின் பெயர் வெளிப்படையாகக் குறிப்பிடப்படவில்லை; “ஐபிராத்து” என்பது சாத்தியமான அடையாளம் மட்டுமே.
lexical_decisions:
- source_word: וַיָּמָת
  choice: இறந்தான்
  rationale: מות என்பதன் கால் தொடர்நிகழ்வு வடிவம் இறப்பை நேரடியாகக் குறிக்கிறது; தேவையற்ற இடக்கரடக்கல் இன்றி எளிய உரைநடைத் தமிழில் தரப்பட்டுள்ளது.
- source_word: שַׂמְלָה
  choice: சம்லா
  rationale: எபிரேய ஒலிப்புக்கு நெருக்கமான தமிழ்ப் பெயரெழுத்தாக்கம்.
- source_word: וַיִּמְלֹךְ
  choice: அரசாண்டான்
  rationale: מלך என்ற வினை அரச வாரிசுரிமைச் சூழலில் ஆட்சிசெய்ததைக் குறிக்கிறது; ‘அரசாண்டான்’ இயல்பான, சுருக்கமான தமிழாக்கம்.
- source_word: תַּחְתָּיו
  choice: அவனுக்குப் பதிலாக
  rationale: תחתיו அரச வாரிசுரிமைச் சூழலில் முந்தைய அரசனின் இடத்தை ஏற்றதைக் குறிக்கிறது.
- source_word: שָׁאוּל
  choice: சவுல்
  rationale: எபிரேய שָׁאוּל பெயருக்கான தமிழில் பரவலாக அறியப்பட்ட பெயரெழுத்தாக்கம்; சூழல் இது ஏதோமிய அரசனைக் குறிக்கிறது என்பதைத் தெளிவாக்குகிறது.
- source_word: מֵרְחֹבוֹת
  choice: ரெகொபோத்தைச் சேர்ந்த
  rationale: முன்னொட்டு מ־ பிறப்பிடம் அல்லது ஊர்சார்பைக் குறிக்கிறது; இடப்பெயர் மொழிபெயர்க்கப்படாமல் பெயரெழுத்தாக்கப்பட்டுள்ளது.
- source_word: הַנָּהָר
  choice: நதியருகிலுள்ள
  rationale: சொல்லுக்கு நேரடியாக ‘அந்த நதி’ என்று பொருள்; இங்கு ரெகொபோத்தின் இருப்பிடத்தைச் சுட்டும் புவியியல் அடையாளமாக இயல்பான தமிழில் தரப்பட்டுள்ளது. எந்த நதி என்பது மூலத்தில் வெளிப்படையாகக் குறிப்பிடப்படவில்லை.
