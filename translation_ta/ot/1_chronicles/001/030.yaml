lexical_decisions:
- source_word: מִשְׁמָע
  choice: மிஷ்மா
  rationale: வம்சவரலாற்றுப் பட்டியலில் வரும் இயற்பெயர்; பொருளாக்காமல் எபிரெய ஒலிப்புக்கு ஏற்ப எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: וְ/דוּמָה
  choice: தூமா
  rationale: דוּמָה என்பது இயற்பெயர் என்பதால் எழுத்துப்பெயர்க்கப்பட்டது. பட்டியலில் உள்ள וְ இணைப்பைத் தமிழின் இயல்பான பட்டியல் நடைக்கு ஏற்ப தனியே மொழிபெயர்க்கவில்லை.
- source_word: מַשָּׂא
  choice: மாசா
  rationale: இங்கு ‘சுமை’ அல்லது ‘இறைவாக்கு’ என்ற பொதுப்பெயர் அல்ல; சந்ததியினரின் பட்டியலில் வரும் இயற்பெயர் என்பதால் எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: חֲדַד
  choice: அதாத்
  rationale: WLC-இன் நாளாகம வாசகமான חֲדַד தக்கவைக்கப்பட்டு, எபிரெய ஒலிப்புக்கு நெருக்கமாக எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: וְ/תֵימָא
  choice: தேமா
  rationale: תֵימָא என்பது இயற்பெயர் என்பதால் எழுத்துப்பெயர்க்கப்பட்டது. இறுதி וְ இணைப்பைத் தமிழில் பட்டியலின் நிறைவு குறியீடாகச் சேர்க்காமல், இயல்பான சுருக்கப்பட்டியல் நடையில் வழங்கப்பட்டது.
