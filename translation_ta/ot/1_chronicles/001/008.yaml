translation_notes:
  register: நவீன நிலையான தமிழில் சுருக்கமான வம்சப்பட்டியல் நடை பயன்படுத்தப்பட்டுள்ளது. பெயர்கள் மூல எபிரெய வடிவங்களை இயன்றவரை நெருங்கியவாறு ஒலிபெயர்க்கப்பட்டுள்ளன. ஆங்கில ஆலோசனை உரையில் அடிக்குறிப்பு குறியீடுகள் பொருளுக்குப் பொருந்தாத பெயர்களுக்குப் பின் இருந்ததால், [a] ‘மகன்கள்’ என்பதற்குப் பின்னும் [b] ‘மிஸ்ராயிம்’ என்பதற்குப் பின்னும் பொருத்தமாக வைக்கப்பட்டுள்ளன.
