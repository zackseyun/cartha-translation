id: 1CH.1.8
reference: 1 Chronicles 1:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: בְּנֵ֖י חָ֑ם כּ֥וּשׁ וּ/מִצְרַ֖יִם פּ֥וּט וּ/כְנָֽעַן׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/008.yaml
  text: 'The sons of Ham: Cush[a], Mizraim, Put[b], and Canaan.'
translation:
  language: ta
  text: 'காமின் மகன்கள்[a]: கூஷ், மிஸ்ராயிம்[b], பூத், கானான்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘காமின் வழித்தோன்றல்கள்.’ வம்சப்பட்டியல்களில் ‘மகன்கள்’ என்ற எபிரெயச் சொற்றொடர் நேரடி மகன்களையோ பிற்கால வழித்தோன்றல்களையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் ‘மிஸ்ராயிம்’; இப்பெயர் மரபாக எகிப்துடன் தொடர்புபடுத்தப்படுகிறது. இங்கு கூஷ், பூத், கானான் ஆகிய பெயர்களுடன் வம்சப்பட்டியலில் ஒரு தனிப்பெயராக வருவதால், ஒலிபெயர்ப்பு தக்கவைக்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: בֵּן என்பதன் பன்மை இணைப்புவடிவம். வம்சப்பட்டியலில் இது நேரடி மகன்களையோ விரிந்த வழித்தோன்றல்களையோ குறிக்கக்கூடும்; முதன்மை உரையில் இயல்பான ‘மகன்கள்’ என்பதும், விரிந்த பொருள் அடிக்குறிப்பிலும் தரப்படுகிறது.
- source_word: חָם
  choice: காம்
  rationale: எபிரெய தனிப்பெயரின் நவீனத் தமிழ் ஒலிபெயர்ப்பு.
- source_word: כּוּשׁ
  choice: கூஷ்
  rationale: வம்சப்பட்டியலில் தனிநபர் அல்லது பெயர்மூதாதையைக் குறிக்கும் தனிப்பெயராக இருப்பதால் ஒலிபெயர்க்கப்படுகிறது.
- source_word: מִצְרַיִם
  choice: மிஸ்ராயிம்
  rationale: இங்கு மற்ற தனிப்பெயர்களோடு வம்சப்பட்டியலில் வருவதால் ‘எகிப்து’ என்று இடப்பெயராக மொழிபெயர்க்காமல் எபிரெய வடிவம் ஒலிபெயர்க்கப்படுகிறது.
- source_word: פּוּט
  choice: பூத்
  rationale: எபிரெய தனிப்பெயருக்கு நெருக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: כְנָעַן
  choice: கானான்
  rationale: தமிழில் பரவலாக அறியப்படும், எபிரெய தனிப்பெயருக்கு ஏற்ற ஒலிபெயர்ப்பு.
