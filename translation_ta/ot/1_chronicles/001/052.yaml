lexical_decisions:
- source_word: אַלּוּף
  choice: தலைவர்
  rationale: ஏதோமிய வம்சப் பட்டியல்களில் இச்சொல் ஒரு கோத்திரம் அல்லது குலத்தின் தலைவரைக் குறிக்கிறது. மீண்டும் மீண்டும் வரும் பட்டப்பெயர் அமைப்பில் ‘தலைவர்’ சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: אָהֳלִיבָמָה
  choice: ஓகோலிபாமா
  rationale: எபிரெயப் பெயரின் ஒலியமைப்பைப் பின்பற்றி மொழிபெயர்க்காமல் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: אֵלָה
  choice: ஏலா
  rationale: இது தனிநபர் அல்லது குலப் பெயராக இருப்பதால், பொருள் மொழிபெயர்ப்பு செய்யாமல் எபிரெயிலிருந்து ஒலிபெயர்க்கப்பட்டது.
- source_word: פִּינֹן
  choice: பீனோன்
  rationale: எபிரெய மூலத்திலுள்ள நீண்ட ‘ஈ’ ஒலியையும் பெயரின் மெய்யெழுத்து அமைப்பையும் பிரதிபலிக்கும் வகையில் ஒலிபெயர்க்கப்பட்டது.
