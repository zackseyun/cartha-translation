base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/017.yaml
  text: 'The sons of Shem: Elam[a], Asshur, Arpachshad, Lud, and Aram; Uz, Hul, Gether, and Meshech.'
translation:
  language: ta
  text: 'சேமின் மகன்கள்: ஏலாம், அசூர், அர்பக்சாத், லூத், அராம்; ஊத்ஸ், கூல், கெதெர், மேசேக்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இணையான வம்சப்பட்டியலாகிய ஆதியாகமம் 10:23-ல் “மேசேக்” என்பதற்குப் பதிலாக “மாஷ்” என்று உள்ளது.
    reason: textual_variant
lexical_decisions:
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: בן என்பதன் பன்மை இணைப்பு வடிவம் வம்சப்பட்டியலை அறிமுகப்படுத்துகிறது; எபிரேயச் சொல்லுக்கு நேரானதும் இயல்பானதுமான மொழிபெயர்ப்பு.
- source_word: שֵׁם
  choice: சேம்
  rationale: நபரின் பெயர்; தமிழ் வேதாகமப் பயன்பாட்டுடன் ஒத்த, எபிரேய ஒலியை அணுகும் எழுத்துப்பெயர்ப்பு.
- source_word: עֵילָם
  choice: ஏலாம்
  rationale: வம்சப்பட்டியலில் வரும் இயற்பெயர்; மொழிபெயர்க்காமல் எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: אַשּׁוּר
  choice: அசூர்
  rationale: இங்கு நாட்டைக் குறிக்கும் ‘அசீரியா’ என்பதற்குப் பதிலாக, சேமின் மகனாகப் பட்டியலிடப்பட்ட நபரின் பெயராக எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: אַרְפַּכְשַׁד
  choice: அர்பக்சாத்
  rationale: எபிரேயப் பெயரின் மெய்யொலிகளையும் இறுதி ஒலியையும் தெளிவாகப் பிரதிபலிக்கும் தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: לוּד
  choice: லூத்
  rationale: இங்கு இருப்பது பன்மை இனப்பெயர் அல்ல, ஒருமை இயற்பெயர்; எபிரேய இறுதி ד ஒலிக்கு நெருக்கமாக எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: אֲרָם
  choice: அராம்
  rationale: பிற்கால நிலப்பெயரான ‘சீரியா’ என்று மாற்றாமல், வம்சப்பட்டியலில் உள்ள நபரின் பெயர் பாதுகாக்கப்பட்டது.
- source_word: עוּץ
  choice: ஊத்ஸ்
  rationale: எபிரேய עוּץ பெயரின் நீண்ட உயிரையும் இறுதி צ ஒலியையும் அணுகும் எழுத்துப்பெயர்ப்பு.
- source_word: חוּל
  choice: கூல்
  rationale: எபிரேய ח ஒலியை வாசிக்கத்தக்க தமிழில் ‘க’ மூலம் அணுகி, நீண்ட உயிர் பாதுகாக்கப்பட்டது.
- source_word: גֶתֶר
  choice: கேத்தேர்
  rationale: இயற்பெயர் எபிரேய வடிவிலிருந்து வாசிக்கத்தக்க தமிழில் எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: מֶשֶׁךְ
  choice: மேசேக்
  rationale: WLC மசோரா உரையில் உள்ள பெயரே மொழிபெயர்க்கப்பட்டது; இணை வம்சப்பட்டியலின் வேறுபட்ட வாசகம் அடிக்குறிப்பில் தரப்படுகிறது.
