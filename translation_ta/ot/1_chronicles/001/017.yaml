  source_fidelity: பட்டியலின் அமைப்பும், சேமின் மகன்களாக வரும் முதல் ஐந்து பெயர்களும், பின்னர் அரைப்புள்ளிக்குப் பின் வரும் நான்கு பெயர்களும் எபிரேய உரைக்கு ஏற்ப பாதுகாக்கப்பட்டுள்ளன. எபிரேயத்தில் அராமின் பெயரை மீண்டும் கூறி அடுத்த நான்கு பெயர்களை அவனுடைய மகன்களாக வெளிப்படையாக இணைக்கவில்லை; தமிழும் அந்தத் தெளிவின்மையைச் சேர்க்காமல் காக்கிறது. ஆனால் גֶתֶר (Gether) என்பதற்கான “கேத்தேர்” வடிவம் எபிரேயத்தின் குறில் எ-உயிருக்கும் த-ஒலிக்கும் துல்லியமாக ஒத்ததல்ல.
  naturalness: “சேமின் மகன்கள்” என்ற வம்சப்பட்டியல் அறிமுகமும் அரைப்புள்ளியால் பட்டியல் பிரிக்கப்படுவதும் நவீனத் தரத் தமிழில் இயல்பாகவும் சுருக்கமாகவும் உள்ளன. திருத்தப்பட்ட பெயர் வடிவமும் வாசிக்கத்தக்கது.
  terminology: பெயர்கள் மொழிபெயர்க்கப்படாமல் எழுத்துப்பெயர்க்கப்பட்டுள்ளன. “அசூர்,” “அர்பக்சாத்,” “லூத்,” “அராம்,” “ஊத்ஸ்,” “கூல்,” “மேசேக்” ஆகியவை திட்டத்தின் நடப்புப் பெயரியல் நடைமுறையுடன் ஒத்துள்ளன. கேத்தேர் மட்டும் கெதெர் எனத் திருத்தப்பட வேண்டும்.
