  register: நவீனத் தரத் தமிழில் சுருக்கமான, கண்ணியமான வம்சப்பட்டியல் நடை பயன்படுத்தப்பட்டுள்ளது. பெயர்கள் மொழிபெயர்க்கப்படாமல் எபிரேய மூலத்துக்கு அணுக்கமாக எழுத்துப்பெயர்க்கப்பட்டுள்ளன; பட்டியலில் எபிரேய உரை காட்டும் பிரிவை அரைப்புள்ளி பிரதிபலிக்கிறது.
