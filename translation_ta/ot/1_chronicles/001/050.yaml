base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/050.yaml
  text: Baal-hanan died[a], and Hadad reigned in his place. The name of his city was Pai, and the name of his wife was Mehetabel daughter of Matred[b], daughter of Mezahab.
translation:
  language: ta
  text: பாகால்-ஆனான் இறந்தான்; அவனுக்குப் பதிலாக ஆதாத் அரசாண்டான். அவனுடைய நகரத்தின் பெயர் பாயி[a]. அவனுடைய மனைவியின் பெயர் மெகேதபேல்; அவள் மாத்ரேத்தின் மகள், மே-சகாபின் மகள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ஆதியாகமம் 36:39-ல் இந்த நகரத்தின் பெயர் ‘பாவு’ என்று உள்ளது; நாளாகமத்தின் எபிரெய உரையோ ‘பாயி’ என்று வாசிக்கிறது.
    reason: textual_variant
  - marker: b
    text: வம்சவரலாற்று வழக்கில் இரண்டாவது ‘மகள்’ என்பது ‘பேத்தி’ என்ற பொருளைக் குறிக்கக்கூடும்; எனினும் எபிரெயச் சொற்றொடர் இங்கே நேரடியாகவே மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת בַּעַל חָנָן
  choice: பாகால்-ஆனான் இறந்தான்
  rationale: מות என்பதன் நேரடியான பொருளைத் தக்கவைத்து, எபிரெயக் கதைத் தொடரை இயல்பான நவீனத் தமிழில் வழங்குகிறது. கூட்டுப்பெயரின் இரு கூறுகளும் தெளிவாக இருக்க இணைப்புக்கோடு பயன்படுத்தப்பட்டுள்ளது.
- source_word: וַיִּמְלֹךְ תַּחְתָּיו הֲדַד
  choice: அவனுக்குப் பதிலாக ஆதாத் அரசாண்டான்
  rationale: מלך இங்கு அரசப் பதவியேற்று ஆட்சி செய்தலைக் குறிக்கிறது; תחתיו என்பதன் வாரிசுரிமைச் சூழலை ‘அவனுக்குப் பதிலாக’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְשֵׁם עִירוֹ פָּעִי
  choice: அவனுடைய நகரத்தின் பெயர் பாயி
  rationale: வினைச்சொல் இல்லாத எபிரெயப் பெயரிடும் கூற்றைத் தமிழில் இயல்பாக வழங்குகிறது. நாளாகம எபிரெய வடிவமான פָּעִי என்பதே மூல உரையில் பின்பற்றப்பட்டுள்ளது.
- source_word: וְשֵׁם אִשְׁתּוֹ מְהֵיטַבְאֵל
  choice: அவனுடைய மனைவியின் பெயர் மெகேதபேல்
  rationale: எபிரெயப் பெயரிடும் அமைப்பைத் தெளிவான தமிழில் காக்கிறது; தனிப்பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: בַּת מַטְרֵד בַּת מֵי זָהָב
  choice: அவள் மாத்ரேத்தின் மகள், மே-சகாபின் மகள்
  rationale: மூலத்தில் இருமுறை வரும் בַּת (‘மகள்’) என்பதை விளக்கமாக மாற்றாமல் அப்படியே தக்கவைக்கிறது. מֵי זָהָב இச்சூழலில் தனிப்பெயராக ஒலிபெயர்க்கப்பட்டுள்ளது.
