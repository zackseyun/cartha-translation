translation_notes:
  register: நவீன பொதுத்தமிழில், கண்ணியமான வேதாகம நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. குறுகிய அரசர் பட்டியல் நடையைப் பேணுவதற்காக வாக்கியங்கள் நேர்த்தியாக வைக்கப்பட்டுள்ளன. தனிப்பெயர்கள் எபிரெய ஒலியமைப்பை அணுகும் வகையில் தமிழாக்கப்பட்டுள்ளன; மூலத்தின் வம்சவரலாற்றுத் தெளிவின்மை தீர்மானித்து விடப்படவில்லை.
