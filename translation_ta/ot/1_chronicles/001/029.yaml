base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/029.yaml
  text: 'These are their generations: the firstborn of Ishmael[a], Nebaioth, Kedar, Adbeel, and Mibsam.'
translation:
  language: ta
  text: 'இவர்களுடைய சந்ததியினர் இவர்கள்: இஸ்மவேலின் முதற்பேறான நெபாயோத், கேதார், அத்பெயேல், மிப்சாம்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  choice: இவர்களுடைய
  rationale: சூழலில் முன்பு குறிப்பிடப்பட்டவர்களைச் சுட்டும் எபிரெயச் சொல்லின் பணியை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: תֹּלְדוֹתָם
  choice: சந்ததியினர்
  rationale: வம்சப் பட்டியல் சூழலில் இச்சொல் தலைமுறைகள், வம்ச வரலாறு அல்லது சந்ததியினரைக் குறிக்கலாம்; இங்கு தொடர்ந்து நபர்களின் பெயர்கள் வருவதால் ‘சந்ததியினர்’ இயல்பாகவும் பொருத்தமாகவும் உள்ளது.
- source_word: בְּכוֹר
  choice: முதற்பேறான
  rationale: முதலில் பிறந்தவர் என்ற நிலையைத் துல்லியமாகக் காட்டுகிறது; ‘மகன்’ என்று மூலத்தில் இல்லாத சொல்லைச் சேர்க்கவில்லை.
- source_word: יִשְׁמָעֵאל
  choice: இஸ்மவேல்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற பெயர்வடிவம்.
- source_word: נְבָיוֹת
  choice: நெபாயோத்
  rationale: எபிரெயப் பெயரின் ஒலியமைப்பைத் தமிழில் நெருக்கமாக எழுத்துப்பெயர்க்கிறது.
- source_word: קֵדָר
  choice: கேதார்
  rationale: எபிரெயப் பெயரைத் தமிழில் இயல்பாக எழுத்துப்பெயர்க்கிறது.
- source_word: אַדְבְּאֵל
  choice: அத்பெயேல்
  rationale: எபிரெயப் பெயரின் மெய் மற்றும் உயிரொலிகளைத் தமிழில் நெருக்கமாகப் பிரதிபலிக்கிறது.
- source_word: מִבְשָׂם
  choice: மிப்சாம்
  rationale: எபிரெயப் பெயரைத் தமிழில் நெருக்கமாக எழுத்துப்பெயர்க்கிறது.
