translation_notes:
  register: நவீனத் தரத்தமிழில், வம்சப் பட்டியலுக்கேற்ற சுருக்கமான மற்றும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ஆங்கிலத்தில் உள்ள Nebaioth/Nebajoth எழுத்துவடிவ வேறுபாடு தமிழ்மொழிபெயர்ப்புக்கு நேரடியாகப் பொருந்தாததால் அடிக்குறிப்பாகச் சேர்க்கப்படவில்லை.
