base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/036.yaml
  text: 'The sons of Eliphaz: Teman[a], Omar, Zephi, Gatam, Kenaz, Timna[b], and Amalek.'
translation:
  language: ta
  text: 'எலிபாஸின் மகன்கள்: தேமான், ஓமார், செபி[a], காத்தாம், கெனாஸ், திம்னா மற்றும் அமாலேக்கு[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு எபிரேய உரையில் ‘செபி’ என்று உள்ளது; ஆதியாகமம் 36:11-இல் ‘செபோ’ என்ற மாறுபட்ட பெயர் வடிவம் உள்ளது.
    reason: textual_variant
  - marker: b
    text: ஆதியாகமம் 36:12 திம்னாவை எலிபாஸின் மறுமனைவியாகவும் (வைப்பாட்டியாகவும்), அமாலேக்கை அவளுடைய மகனாகவும் குறிப்பிடுகிறது. ஆனால் இங்கு நாளாகமம் இரு பெயர்களையும் எலிபாஸின் மகன்களுடைய பட்டியலுக்குள் வழங்குகிறது.
    reason: cross_reference
lexical_decisions:
- source_word: בְּנֵי אֱלִיפָז
  choice: எலிபாசின் மகன்கள்
  rationale: בְּנֵי என்பது வம்சவரலாற்றுப் பட்டியலை அறிமுகப்படுத்தும் בן என்பதன் பன்மை இணைப்புவடிவம். இங்கு ‘மகன்கள்’ என்பது நேரடியானதும் இயல்பானதும் ஆகும்.
- source_word: תֵּימָן
  choice: தேமான்
  rationale: எபிரேய தனிப்பெயரின் ஒலியைத் தமிழில் இயல்பாக எழுத்துப்பெயர்த்த வடிவம்.
- source_word: אוֹמָר
  choice: ஓமார்
  rationale: தனிப்பெயரை அதன் எபிரேய ஒலிக்கு நெருக்கமாக எழுத்துப்பெயர்த்துள்ளது.
- source_word: צְפִי
  choice: செபி
  rationale: இவ்வசனத்தின் எபிரேய வடிவமான צְפִי-ஐப் பிரதிபலிக்கிறது; ஆதியாகமம் 36:11-இல் காணப்படும் צְפו என்ற மாறுபட்ட வடிவத்துடன் இதை ஒன்றாக்கவில்லை.
- source_word: גַעְתָּם
  choice: காத்தாம்
  rationale: தனிப்பெயரின் எபிரேய உச்சரிப்பைத் தமிழில் வாசிக்கத்தக்க வகையில் எழுத்துப்பெயர்த்துள்ளது.
- source_word: קְנַז
  choice: கெனாஸ்
  rationale: எபிரேய தனிப்பெயரின் ஒலியைத் தமிழில் தெளிவாக எழுத்துப்பெயர்த்துள்ளது.
- source_word: תִמְנָע
  choice: திம்னா
  rationale: இவ்வசனத்தில் உயிர்க்குறியிடப்பட்டுள்ள தனிப்பெயர் வடிவத்தைப் பிரதிபலிக்கிறது.
- source_word: עֲמָלֵק
  choice: அமாலேக்கு
  rationale: தனிநபர் அல்லது குலமுதல்வரின் பெயரைத் தமிழில் அறியத்தக்க முறையில் எழுத்துப்பெயர்த்துள்ளது.
- source_word: וְ / וַ
  choice: காற்புள்ளிகளால் பிரிக்கப்பட்ட பட்டியல்
  rationale: எபிரேயத்தில் பெயர்களுக்கு முன் இணைப்புச்சொற்கள் திரும்பத் திரும்ப வந்தாலும், நவீனத் தமிழில் காற்புள்ளிகளைக் கொண்ட பட்டியல் அதன் அமைப்பை இயல்பாகவும் தெளிவாகவும் தருகிறது.
theological_decisions:
- issue: ஆதியாகமம் 36:12 உடன் ஒப்பிடும்போது திம்னா மற்றும் அமாலேக்கின் வம்சவரலாற்று உறவு
  choice: நாளாகமத்தின் வெளிப்படையான இலக்கண அமைப்பின்படி திம்னாவையும் அமாலேக்கையும் ‘எலிபாசின் மகன்கள்’ என்ற பட்டியலுக்குள் வைத்தல்
  alternative: ஆதியாகமம் 36:12-க்கு இசைவாக்கி, திம்னாவை எலிபாசின் மறுமனைவியாகவும் அமாலேக்கை அவளுடைய மகனாகவும் முதன்மை உரையிலேயே விளக்குதல்
  rationale: இவ்வசனம் ‘எலிபாசின் மகன்கள்’ என்று தொடங்கி எல்லாப் பெயர்களையும் ஒரே பட்டியலாக வழங்குகிறது. இணை வசனத்தின் தகவலை முதன்மை உரைக்குள் புகுத்தாமல், நூல்களுக்கிடையிலான பதற்றத்தை அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கிறது.
translation_notes:
  register: 'நவீன நிலையான தமிழில் சுருக்கமான வம்சவரலாற்று நடை பயன்படுத்தப்பட்டுள்ளது. தனிப்பெயர்கள் எபிரேய வடிவங்களை முன்னிறுத்தி, தமிழில் எளிதாக வாசிக்கக்கூடியவாறு எழுத்துப்பெயர்க்கப்பட்டுள்ளன. ஆங்கில ஆலோசனை உரையில் அடிக்குறிப்பு குறிகளுக்கும் அவற்றின் உள்ளடக்கத்துக்கும் இருந்த இடமாற்றம் பொருளடிப்படையில் திருத்தப்பட்டுள்ளது: பெயர் மாறுபாட்டுக் குறிப்பு ‘செபி’க்குப் பின்னரும், திம்னா–அமாலேக்கு உறவுக் குறிப்பு பட்டியலின் முடிவிலும் வைக்கப்பட்டுள்ளது.'
