  text: בְּנֵ֣י שׁוֹבָ֔ל עַלְיָ֧ן וּ/מָנַ֛חַת וְ/עֵיבָ֖ל שְׁפִ֣י וְ/אוֹנָ֑ם וּ/בְנֵ֥י צִבְע֖וֹן אַיָּ֥ה וַ/עֲנָֽהס׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/040.yaml
  text: 'The sons of Shobal: Alian[a], Manahath, Ebal, Shephi, and Onam[b]. And the sons of Zibeon: Aiah and Anah.'
translation:
  language: ta
  text: 'சோபாலின் மகன்கள்: அலியான்[a], மானகாத், ஏபால், செப்பி[b], ஓனாம். சிபியோனின் மகன்கள்: அய்யா, அனா.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில் ‘அலியான்’; ஆதியாகமம் 36:23-இல் உள்ள இணையான வம்சப் பட்டியலில் ‘அல்வான்’ என்று உள்ளது.
    reason: alternative_reading
  - marker: b
    text: நாளாகமத்தில் ‘செப்பி’; ஆதியாகமம் 36:23-இல் உள்ள இணையான பட்டியலில் ‘செப்போ’ என்று உள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: வம்சப் பட்டியலில் இது நேரடியாகப் பெயரிடப்பட்ட ஆண் பிள்ளைகளைக் குறிக்கிறது; எனவே பொதுவான ‘சந்ததியினர்’ என்பதைக் காட்டிலும் ‘மகன்கள்’ பொருத்தமானது.
- source_word: שׁוֹבָל
  choice: சோபால்
  rationale: எபிரேய தனிப்பெயரின் ஒலிப்பைத் தமிழில் இயல்பாக எழுத்துப்பெயர்த்த வடிவம்.
- source_word: עַלְיָן
  choice: அலியான்
  rationale: இவ்வசனத்தின் எபிரேய வடிவத்தை நேரடியாகப் பிரதிபலிக்கிறது; இணையான ஆதியாகமப் பட்டியலில் வேறுபட்ட வடிவம் உள்ளது.
- source_word: מָנַחַת
  choice: மானகாத்
  rationale: எபிரேய உச்சரிப்பை அண்மையாகப் பிரதிபலிக்கும் தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: עֵיבָל
  choice: ஏபால்
  rationale: இவ்வசனத்தில் உள்ள எபிரேய பெயர்வடிவத்தின் நேரடி தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: שְׁפִי
  choice: செப்பி
  rationale: நாளாகமத்தின் எபிரேய வடிவத்தைப் பிரதிபலிக்கிறது; ஆதியாகமத்தின் இணைப் பட்டியலில் வேறொரு வடிவம் காணப்படுகிறது.
- source_word: אוֹנָם
  choice: ஓனாம்
  rationale: எபிரேய தனிப்பெயரின் நேரடி தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: צִבְעוֹן
  choice: சிபியோன்
  rationale: எபிரேய பெயரின் ஒலியமைப்பை நவீன தமிழில் இயல்பாகப் பிரதிபலிக்கிறது.
- source_word: אַיָּה
  choice: அய்யா
  rationale: எபிரேய பெயரிலுள்ள இரட்டித்த மெய்யொலியைப் பிரதிபலிக்கும் எழுத்துப்பெயர்ப்பு.
- source_word: עֲנָה
  choice: ஆனாக்
  rationale: இறுதி ה-ஐ இங்கு மெய்யொலியுள்ள பெயரிறுதியாகக் கொண்டு எபிரேய உச்சரிப்பை அண்மையாகக் காட்டுகிறது.
- source_word: וְ / וּ / וַ
  choice: பட்டியலில் காற்புள்ளிகள்; இரண்டாம் வாக்கியத்தில் இயல்பான தொடர்ச்சி
  rationale: எபிரேய இணைப்பிடைச்சொற்கள் பெயர்களையும் பட்டியலின் இரு பகுதிகளையும் இணைக்கின்றன. தமிழில் ஒவ்வொரு பெயருக்கும் ‘மற்றும்’ சேர்ப்பதைவிட நிறுத்தக்குறிகளால் அமைப்பது இயல்பாகவும் தெளிவாகவும் உள்ளது.
