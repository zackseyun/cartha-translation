translation_notes:
  register: நவீனத் தரத் தமிழில், வம்சப் பட்டியலுக்கேற்ற சுருக்கமானவும் கண்ணியமானவும் உள்ள நடை பயன்படுத்தப்பட்டது. தனிப்பெயர்கள் இவ்வசனத்தின் எபிரேய வாசகத்தை முன்னிறுத்தி எழுத்துப்பெயர்க்கப்பட்டன; இணையான ஆதியாகம வாசக வேறுபாடுகள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டன.
