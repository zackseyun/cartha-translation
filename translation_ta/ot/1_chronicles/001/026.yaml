lexical_decisions:
- source_word: שְׂר֥וּג
  choice: செரூகு
  rationale: இது ஓர் ஆளின் பெயர். எபிரெய உச்சரிப்பை நெருக்கமாகப் பிரதிபலிக்கும், தமிழில் வாசிக்க இயல்பான ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: נָח֖וֹר
  choice: நாகோர்
  rationale: இது ஓர் ஆளின் பெயர். எபிரெயிலுள்ள நீண்ட உயிரொலியையும் மெய்யொலியையும் இயன்றவரை காக்கும் தமிழ் ஒலிபெயர்ப்பு.
- source_word: תָּֽרַח
  choice: தேராகு
  rationale: இது ஓர் ஆளின் பெயர். இறுதி எபிரெய ח ஒலியைத் தமிழில் வாசிக்கத்தக்க வகையில் ‘கு’ என அண்மித்துள்ளோம்; வம்சவரிசையின் பெயர்ப் பட்டியல் வடிவம் விரிவாக்கமின்றிக் காக்கப்பட்டுள்ளது.
