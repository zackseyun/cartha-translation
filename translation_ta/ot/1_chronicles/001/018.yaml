  edition: WLC
  text: וְ/אַרְפַּכְשַׁ֖ד יָלַ֣ד אֶת שָׁ֑לַח וְ/שֶׁ֖לַח יָלַ֥ד אֶת עֵֽבֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/018.yaml
  text: Arpachshad fathered Shelah[b][a], and Shelah fathered Eber.
translation:
  language: ta
  text: அர்பக்சாத்[a] சேலாகைப்[b] பெற்றான்; சேலாக் ஏபேரைப் பெற்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயப் பெயர் அர்பக்சாத்; கிரேக்க மொழி மரபின் செல்வாக்கால் சில மொழிபெயர்ப்புகளில் இதற்கு வேறு எழுத்துப்பெயர்ப்பு வடிவங்கள் காணப்படுகின்றன.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயப் பெயர் சேலாக்; தொடர்புடைய சில வம்சப்பட்டியல்களிலும் மொழிபெயர்ப்பு மரபுகளிலும் ‘சாலா’ என்ற பாரம்பரிய வடிவம் காணப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַרְפַּכְשַׁד
  choice: அர்பக்சாத்
  rationale: எபிரெய மெய்யெழுத்து வடிவத்தை நேரடியாகப் பிரதிபலிக்கும் தமிழாக்க ஒலிபெயர்ப்பு; கிரேக்க மரபின் செல்வாக்குள்ள ‘அர்பக்சாத்/அர்பக்சாத்’ போன்ற வேறு மொழி மரபுகளை அடிப்படையாகக் கொள்ளவில்லை.
- source_word: יָלַד
  choice: பெற்றான்
  rationale: ஆண் வழி வம்சப்பட்டியலில் ஒருவன் மற்றொருவனுக்குத் தந்தையானதைக் குறிக்கும் இயல்பான, சுருக்கமான நவீனத் தமிழ் சொல். ‘பெறச் செய்தான்’ அல்லது பழமையான பிற சொற்களைவிட வாசிக்க எளிது.
- source_word: אֶת
  choice: தனியாக மொழிபெயர்க்கப்படவில்லை
  rationale: இது நேரடிச் செயப்படுபொருளைக் குறிக்கும் இலக்கண அடையாளம்; தமிழில் இரண்டாம் வேற்றுமை உருபான ‘-ஐ’ மூலம் அதன் பணி வெளிப்படுகிறது.
- source_word: שָׁלַח / שֶׁלַח
  choice: சேலாக்
  rationale: மசோரா உயிர்க்குறிகளில் சிறு வேறுபாடு இருந்தாலும் இரு இடங்களிலும் ஒரே நபரின் பெயரே வருகிறது. எபிரெய வடிவத்துக்கு நெருக்கமாக ஒரே தமிழ்ப் பெயர் தொடர்ந்து பயன்படுத்தப்பட்டது.
- source_word: עֵבֶר
  choice: ஏபேர்
  rationale: எபிரெய עבר என்ற பெயரின் ஒலியை நேரடியாகப் பிரதிபலிக்கும் தமிழாக்கம்; பிற மொழி மரபுகளில் காணப்படும் ‘எபேர்/ஹேபேர்’ வடிவங்களைத் தவிர்க்கிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், வம்சப்பட்டியலுக்கேற்ற சுருக்கமும் கண்ணியமும் பேணப்பட்டுள்ளன. பெயர்கள் எபிரெய மூலத்திலிருந்து ஒலிபெயர்க்கப்பட்டன; ஒவ்வொரு நேரடிச் செயப்படுபொருளிலும் இயல்பான ‘-ஐ’ உருபு பயன்படுத்தப்பட்டது. அடிக்குறிப்பு குறிகள் அவை விளக்கும் பெயர்களுக்குப் பின்னரே இடப்பட்டுள்ளன.
