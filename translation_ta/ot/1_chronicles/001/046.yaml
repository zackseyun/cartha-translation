base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/046.yaml
  text: And Husham died[a], and Hadad son of Bedad reigned in his place, who struck Midian in the field of Moab; and the name of his city was Avith.
translation:
  language: ta
  text: ஊஷாம் இறந்தான்; அவனுக்குப் பதிலாக, மோவாபின் வெளிநிலத்தில் மிதியானைத் தாக்கிய பெதாதின் மகன் ஹதாத் அரசனானான்; அவனுடைய நகரத்தின் பெயர் அவீத்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அயோத்’; நகரத்தின் பெயருக்கான வேறொரு எழுத்துப்பெயர்ப்பு.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: இறந்தான்
  rationale: מות என்பதன் வழக்கமான நேரடியான கதைநடைப் பொருளை மறைமுகச் சொல்லின்றி வழங்குகிறது.
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  choice: அவனுக்குப் பதிலாக … ஆட்சி செய்தான்
  rationale: מלך குறிக்கும் அரசாட்சியையும் תחתיו குறிக்கும் முன்னோரின் இடத்தை ஏற்றதையும் இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: חוּשָׁם / הֲדַד / בְּדַד
  choice: ஊசாம் / ஹதாத் / பெதாத்
  rationale: எபிரெய தனிப்பெயர்களின் ஒலியமைப்பை நவீன தமிழில் இயன்றவரை நேரடியாக எழுத்துப்பெயர்க்கிறது.
- source_word: בֶּן בְּדַד
  choice: பெதாதின் மகன்
  rationale: בן குறிக்கும் தந்தை–மகன் உறவை நேரடியாகப் பாதுகாக்கிறது.
- source_word: הַמַּכֶּה
  choice: தாக்கியவன்
  rationale: נכה என்ற வினையின் அடிப்படைச் செயற்பொருளைத் தருகிறது; ‘தோற்கடித்தவன்’ என்று முடிவை வலுப்படுத்தி விளக்குவதைத் தவிர்க்கிறது.
- source_word: מִדְיָן
  choice: மீதியான்
  rationale: மக்கள் அல்லது இடத்தைக் குறிக்கக்கூடிய தனிப்பெயரை விளக்கமின்றி எழுத்துப்பெயர்த்து, மூலத்தின் பரப்பைத் திறந்தே வைக்கிறது.
- source_word: בִּשְׂדֵה מוֹאָב
  choice: மோவாபின் வெளிநிலத்தில்
  rationale: שׂדה என்பதன் ‘வெளி/திறந்த நிலம்’ என்ற உருவைத் தக்கவைத்து, தமிழில் ஒரு குறிப்பிட்ட பயிர்நிலம் என்று தவறாகப் புரிவதைத் தவிர்க்கிறது.
- source_word: וְשֵׁם עִירוֹ
  choice: அவனுடைய நகரத்தின் பெயர்
  rationale: எபிரெயப் பெயரிடும் வாய்பாட்டையும் உடைமைத் தொடர்பையும் தெளிவாக வழங்குகிறது.
- source_word: עיות
  choice: ஆவீத்
  rationale: இடப்பெயரின் மரபான வாசிப்பைத் தமிழ் ஒலிப்பெயர்ப்பில் தருகிறது; வேறொரு எழுத்துப்பெயர்ப்பு அடிக்குறிப்பில் பதிவு செய்யப்படுகிறது.
