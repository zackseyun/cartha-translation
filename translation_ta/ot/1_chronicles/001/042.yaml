base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/042.yaml
  text: 'The sons of Ezer: Bilhan[a], Zaavan, and Jaakan[b]. The sons of Dishon: Uz and Aran.'
translation:
  language: ta
  text: 'ஏசேரின் மகன்கள்: பில்ஹான், சாவான்[a], யாக்கான்[b]. திஷோனின் மகன்கள்: ஊத்ஸ், அரான்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு எபிரெய உரையில் சாவான்; இணையான வம்சப் பட்டியலாகிய ஆதியாகமம் 36:27-ல் சவான் என்று வாசிக்கப்படுகிறது.
    reason: alternative_reading
  - marker: b
    text: இங்கு எபிரெய உரையில் யாக்கான்; இணையான வம்சப் பட்டியலாகிய ஆதியாகமம் 36:27-ல் ஆக்கான் என்று உள்ளது.
    reason: cross_reference
lexical_decisions:
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: வம்சப் பட்டியலை அறிமுகப்படுத்தும் בֵּן என்பதன் பன்மை இணைப்பு வடிவம். இங்கு உடனடியான மகன்களையே பட்டியலிடுவதால், பொதுவான ‘வழித்தோன்றல்கள்’ என்பதைவிட ‘மகன்கள்’ துல்லியமானது.
- source_word: אֵצֶר
  choice: ஏசேர்
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் இயல்பாகப் பெயர்த்தெழுதிய வடிவம்.
- source_word: בִּלְהָן
  choice: பில்ஹான்
  rationale: எபிரெய தனிப்பெயரின் மெய்யொலி அமைப்பைப் பாதுகாக்கும் பெயர்ப்பு.
- source_word: זַעֲוָן
  choice: சாவான்
  rationale: நாளாகம எபிரெய உரையின் உயிரொலிப்பை நெருக்கமாகப் பிரதிபலிக்கும் பெயர்ப்பு; இணையான ஆதியாகமப் பட்டியலில் மாறுபட்ட வடிவம் இருப்பது அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: יַעֲקָן
  choice: யாக்கான்
  rationale: எபிரெய உரையில் உள்ள தொடக்க யோத் ஒலியையும் பெயரின் வடிவத்தையும் பிரதிபலிக்கும் தமிழ்ப் பெயர்ப்பு.
- source_word: דִישׁוֹן
  choice: திஷோன்
  rationale: இதே வம்சப் பட்டியலில் வரும் ஒத்த பெயரான திஷானிலிருந்து வேறுபடுத்தி, எபிரெய வடிவத்தைப் பெயர்த்தெழுதுகிறது.
- source_word: עוּץ
  choice: ஊத்ஸ்
  rationale: நீண்ட ū உயிரையும் இறுதி ts ஒலியையும் பிரதிபலிக்கும் தமிழ் வடிவம்.
- source_word: אֲרָן
  choice: அரான்
  rationale: எபிரெய தனிப்பெயரின் உயிரொலிப்பை நெருக்கமாகப் பெயர்த்தெழுதிய வடிவம்.
