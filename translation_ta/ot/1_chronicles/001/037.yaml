  text: בְּנֵ֖י רְעוּאֵ֑ל נַ֥חַת זֶ֖רַח שַׁמָּ֥ה וּ/מִזָּֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/037.yaml
  text: 'The sons of Reuel: Nahath, Zerah, Shammah, and Mizzah.'
translation:
  language: ta
  text: 'ரெகுவேலின் மகன்கள்: நகாத், சேராக், ஷம்மா, மிஸ்ஸா.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: בֵּן என்பதன் பன்மை இணைப்பு வடிவம்; இங்கு உடனடி ஆண் பிள்ளைகளைப் பட்டியலிடும் வம்சவரலாற்றுச் சூழலில் நேரடியாக ‘மகன்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: רְעוּאֵל
  choice: ரெகுவேல்
  rationale: எபிரெய தனிப்பெயரின் ஒலியமைப்பைத் தமிழில் இயன்றவரை பிரதிபலிக்கும் எழுத்துப்பெயர்ப்பு.
- source_word: נַחַת
  choice: நகாத்
  rationale: தனிப்பெயர் என்பதால் பொருள் மொழிபெயர்ப்பு செய்யாமல் எபிரெய உச்சரிப்புக்கு நெருக்கமாக எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: זֶרַח
  choice: செராகு
  rationale: இது தனிப்பெயர்; சொல்லின் வேர்ப்பொருளை மொழிபெயர்க்காமல் எபிரெய ஒலிப்பைத் தமிழில் இயல்பாகக் குறிக்கும் வகையில் எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: שַׁמָּה
  choice: சம்மா
  rationale: எபிரெய தனிப்பெயரின் மெய்யொலி இரட்டிப்பையும் இறுதி உயிரொலியையும் பிரதிபலிக்கும் தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: וּמִזָּה
  choice: மிசா
  rationale: וּ இணைப்புச்சொல் பட்டியலின் இறுதி உறுப்பைத் தமிழில் இயல்பாகக் குறிக்கும் அமைப்பில் பிரதிபலிக்கப்படுகிறது; מִזָּה தனிப்பெயர் எபிரெய ஒலிக்கு நெருக்கமாக ‘மிசா’ என எழுத்துப்பெயர்க்கப்பட்டது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. வம்சவரலாற்றுப் பட்டியலின் சுருக்கமான வடிவம் காக்கப்பட்டுள்ளது; தனிப்பெயர்கள் மூல எபிரெய உரையிலிருந்து நேரடியாக எழுத்துப்பெயர்க்கப்பட்டுள்ளன.
