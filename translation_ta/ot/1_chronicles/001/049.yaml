  text: וַ/יָּ֖מָת שָׁא֑וּל וַ/יִּמְלֹ֣ךְ תַּחְתָּ֔י/ו בַּ֥עַל חָנָ֖ן בֶּן עַכְבּֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/049.yaml
  text: And Shaul died[a], and Baal-hanan son of Akbor reigned in his place.
translation:
  language: ta
  text: சவுல் இறந்தான்; அவனுக்குப் பதிலாக அக்போரின் மகன் பாகால்-ஆனான் அரசனானான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָת
  choice: இறந்தான்
  rationale: מות என்பதன் Qal wayyiqtol வடிவம்; எபிரெயக் கதைத் தொடரின் நேரடியான ‘இறந்தான்’ என்ற பொருளைப் பேணுகிறது.
- source_word: שָׁאוּל
  choice: சவுல்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் பெயர்வடிவம்; எபிரெய שָׁאוּל பெயரையும் தெளிவாக அடையாளப்படுத்துகிறது.
- source_word: וַיִּמְלֹךְ
  choice: அரசனானான்
  rationale: இங்கு அரச வாரிசுரிமைச் சூத்திரத்தில் מלך என்பது ஆட்சிப் பொறுப்பை ஏற்றதைக் குறிக்கிறது; இயல்பான நவீனத் தமிழில் ‘அரசனானான்’ என்பது அந்த நிகழ்வைத் தெளிவாகச் சொல்கிறது.
- source_word: תַּחְתָּיו
  choice: அவனுக்குப் பதிலாக
  rationale: תחת + பின்னொட்டு தரும் இடமாற்றம் அல்லது வாரிசுரிமைப் பொருளை நேரடியாக வெளிப்படுத்துகிறது.
- source_word: בַּעַל חָנָן
  choice: பாகால்-ஆனான்
  rationale: எபிரெயப் பெயரின் இரு கூறுகளையும் இணைப்புக்குறியுடன் ஒலிபெயர்த்து, பெயரின் கூட்டு அமைப்பைப் பேணுகிறது.
- source_word: בֶּן
  choice: மகன்
  rationale: இந்த வம்ச/அரசப் பட்டியல் சூழலில் உடனடியான தந்தை–மகன் உறவைக் குறிக்கிறது.
- source_word: עַכְבּוֹר
  choice: அக்போர்
  rationale: எபிரெய மெய்யெழுத்து அமைப்புக்கு அணுக்கமான, தமிழில் உச்சரிக்கக்கூடிய ஒலிபெயர்ப்பு.
theological_decisions: []
translation_notes:
  register: சுருக்கமான அரச வாரிசுரிமைப் பதிவுக்கேற்ற கண்ணியமான நவீனத் தமிழ். எபிரெய வாக்கியத்தின் தொடர் ‘וַ’ வடிவங்களை இயல்பான தமிழுக்காக அரைப்புள்ளியால் இணைத்துள்ளது. வாசகருக்குப் பயனுள்ள உண்மையான உரைமாற்று வேறுபாடு இல்லாததால் அடிக்குறிப்பு சேர்க்கப்படவில்லை.
