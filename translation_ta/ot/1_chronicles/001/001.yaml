  alternative: மனிதன்; மனுக்குலம்
  rationale: பெயரிடப்பட்ட மூதாதையர்களை வரிசைப்படுத்தும் வம்சவரலாற்றுச் சூழல், இச்சொல்லை பொதுவான மனிதகுலக் குறிப்பாக அல்லாமல் ஆதாம் என்ற நபரின் பெயராகப் புரிந்துகொள்ளக் கோருகிறது.
