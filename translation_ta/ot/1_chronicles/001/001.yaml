lexical_decisions:
- source_word: אָדָם
  choice: ஆதாம்
  rationale: இது ஒரு வம்சவரலாற்றுப் பெயர்ப்பட்டியல் என்பதால், இங்கு பொதுப்பெயரான ‘மனிதன்’ அல்லது ‘மனுக்குலம்’ என்று அல்லாமல் ஆதாம் என்ற நபரின் பெயராக ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: שֵׁת
