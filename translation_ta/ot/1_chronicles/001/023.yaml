  yaml_path: translation/ot/1_chronicles/001/023.yaml
  text: and Ophir[a], Havilah, and Jobab. All these were the sons of Joktan.
translation:
  language: ta
  text: ஓபீரும், ஆவிலாவும், யோபாபும். இவர்கள் அனைவரும் யொக்தானின் மகன்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘யொக்தானின் வழிவந்தவர்கள்.’ எபிரெய உரை ‘யொக்தானின் மகன்கள்’ என்று கூறுகிறது; ஆனால் வம்சவரலாற்றுச் சூழல்களில் ‘மகன்கள்’ என்பது சில சமயங்களில் பரந்த வழித்தோன்றலையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  choice: -உம்
  rationale: אֵת என்பது நேரடி செயப்படுபொருள் குறிப்பான்; தமிழில் அதைத் தனியாக மொழிபெயர்க்கத் தேவையில்லை. வְ தரும் இணைப்பை, தொடரும் பெயர்ப்பட்டியலுக்கு இயல்பான ‘-உம்’ விகுதி வெளிப்படுத்துகிறது.
- source_word: אוֹפִיר
  choice: ஓபீர்
  rationale: எபிரெய தனிப்பெயரின் ஒலிப்பைத் தமிழில் தெளிவாகப் பெயர்த்தெழுதுகிறது.
- source_word: חֲוִילָה
  choice: ஆவிலா
  rationale: எபிரெய தனிப்பெயரின் தொடக்க மெய்யொலியைத் தமிழில் இயல்பாக அண்மைப்படுத்தும் மரபான பெயர்த்தெழுத்து.
- source_word: יוֹבָב
  choice: யோபாப்
  rationale: எபிரெய தனிப்பெயரை அதன் ஒலிக்கு நெருக்கமாகத் தமிழில் பெயர்த்தெழுதுகிறது.
- source_word: כָּל אֵלֶּה
  choice: இவர்கள் அனைவரும்
  rationale: முன்னர் பட்டியலிடப்பட்ட நபர்களைச் சுட்டி தொகுத்துரைக்கும் எபிரெய சொற்றொடரை இயல்பான நவீன தமிழில் வழங்குகிறது.
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: எபிரெயச் சொல் நேரடியாக ஆண்பால் பன்மையான ‘மகன்கள்’ என்று கூறுவதால், பரந்த மரபுவழிப் பொருளை முதன்மை உரையில் திணிக்காமல் அதையே பாதுகாக்கிறது.
- source_word: יָקְטָן
  choice: யொக்தான்
  rationale: எபிரெய தனிப்பெயருக்கான அறிமுகமான தமிழ் வேதாகமப் பெயர்த்தெழுத்தைத் தக்கவைக்கிறது.
theological_decisions:
- issue: வம்சவரலாற்றில் בְּנֵי என்பதன் பரப்பு
  choice: முதன்மை உரையில் ‘மகன்கள்’
  alternative: ‘வழிவந்தவர்கள்’
  rationale: மூல எபிரெயம் ‘மகன்கள்’ என்று நேரடியாகச் சொல்கிறது; அதேவேளையில் வம்சவரலாற்றுச் சூழலில் அது பரந்த வழித்தோன்றல் உறவையும் குறிக்கக்கூடும். இந்தத் திறந்த தன்மையை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் சுருக்கமான, கண்ணியமான வம்சவரலாற்று நடை பயன்படுத்தப்பட்டுள்ளது. தொடரும் பட்டியலின் இணைப்பு ‘-உம்’ விகுதியால் இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது; பெயர்கள் அறிமுகமான தமிழ் வேதாகம வடிவங்களில் தரப்பட்டுள்ளன.
