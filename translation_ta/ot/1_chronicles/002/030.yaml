  text: וּ/בְנֵ֥י נָדָ֖ב סֶ֣לֶד וְ/אַפָּ֑יִם וַ/יָּ֥מָת סֶ֖לֶד לֹ֥א בָנִֽים׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/030.yaml
  text: 'The sons of Nadab: Seled and Appaim[a]. Seled died without sons.'
translation:
  language: ta
  text: நாதாபின் மகன்கள் சேலேத், அப்பாயீம். சேலேத் மகன்கள் இல்லாமல் இறந்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சேலேத் இறந்தான்; அவனுக்கு மகன்கள் இல்லை.”
    reason: லֹא בָנִים என்ற சுருக்கமான எபிரெயத் தொடரை மரணத்தின் சூழ்நிலையாகவோ, தனியான கூறாகவோ தமிழில் வெளிப்படுத்தலாம்.
lexical_decisions:
- source_word: וּבְנֵי
  choice: மகன்கள்
  rationale: בְנֵי என்பது בֵּן என்பதன் பன்மை இணைப்பு வடிவம்; இது வம்சவரலாற்றுப் பட்டியலை அறிமுகப்படுத்துகிறது. தொடக்க வாவைத் தனியே மொழிபெயர்க்காமல் இருப்பது இயல்பான தமிழ் நடைக்கு ஏற்றது.
- source_word: נָדָב
  choice: நாதாப்
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் நிலையான வேதாகமப் பெயர் வடிவில் எழுத்துப்பெயர்த்தது.
- source_word: סֶלֶד
  choice: சேலேத்
  rationale: தனிப்பெயரை இரு இடங்களிலும் ஒரே விதமாக எழுத்துப்பெயர்த்தது.
- source_word: וְאַפָּיִם
  choice: அப்பாயீம்
  rationale: இவ்வம்சவரலாற்றுச் சூழலில் இது பொதுப்பெயர் அல்ல, தனிப்பெயர்; இணைப்பு வாவை பட்டியலின் நிறுத்தக்குறியீட்டு அமைப்பில் இயல்பாக வெளிப்படுத்தியது.
- source_word: וַיָּמָת
  choice: இறந்தான்
  rationale: מוּת வினையின் wayyiqtol வடிவம் அடுத்த நிகழ்வைக் கூறுகிறது; தமிழில் எளிய இறந்தகாலம் அதன் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: לֹא בָנִים
  choice: மகன்கள் இல்லாமல்
  rationale: எபிரெயச் சொற்றொடர் சொற்சொல்லாக ‘மகன்கள் இல்லை’ என உள்ளது. மரண வினையுடன் இணைந்த முதன்மை மொழிபெயர்ப்பு இயல்பாக இருக்கிறது; בָּנִים என்பதால் ‘பிள்ளைகள்’ என்று விரிவுபடுத்தாமல் ‘மகன்கள்’ என்று வைத்துள்ளது.
theological_decisions: []
translation_notes:
  register: நவீன பொதுத்தமிழில், வம்சவரலாற்றுக்கேற்ற சுருக்கமானவும் கண்ணியமானவும் உள்ள நடை பயன்படுத்தப்பட்டது. தனிப்பெயர்கள் எபிரெய ஒலியை அணுகும் வகையில் எழுத்துப்பெயர்க்கப்பட்டன; மூலத்தின் சுருக்கமும் மாற்று தொடரமைப்பும் அடிக்குறிப்பில் பாதுகாக்கப்பட்டன.
