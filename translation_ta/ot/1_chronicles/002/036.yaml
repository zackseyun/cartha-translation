  yaml_path: translation/ot/1_chronicles/002/036.yaml
  text: Attai fathered Nathan, and Nathan fathered Zabad.
translation:
  language: ta
  text: அத்தாய் நாத்தானைப் பெற்றான்; நாத்தான் சாபாத்தைப் பெற்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/עַתַּי
  choice: அத்தாய்
  rationale: எபிரெய தனிப்பெயரான עַתַּי ஒலிபெயர்க்கப்பட்டுள்ளது; தொடக்க இணைப்புச்சொல் வம்சப்பட்டியலின் தொடர்ச்சியைக் குறிப்பதால், தனி வசனத்தின் இயல்பான தமிழ்நடையில் வெளிப்படையாக மொழிபெயர்க்கப்படவில்லை.
- source_word: הֹלִיד
  choice: பெற்றான்
  rationale: ילד என்பதன் ஹிஃபில் வடிவம் வம்சப்பட்டியல் சூழலில் ஒருவருக்குத் தந்தையானதைக் குறிக்கிறது. ‘பெற்றான்’ சுருக்கமான, இயல்பான தமிழ் வம்சப்பட்டியல் நடை; இங்கு ஆண் எழுவாயும் ஆண் சந்ததியும் இருப்பதால் பொருள் தெளிவாக உள்ளது.
- source_word: אֶת
  choice: '[தனியாக மொழிபெயர்க்கப்படவில்லை]'
  rationale: எபிரெய நேரடிச் செயப்படுபொருள் உருபுக்கு தமிழில் தனியான சொல் தேவையில்லை; ‘நாத்தானைப்’ என்ற வேற்றுமை வடிவம் அதன் இலக்கணப் பணியை வெளிப்படுத்துகிறது.
- source_word: נָתָן
  choice: நாத்தான்
  rationale: எபிரெய தனிப்பெயர் נָתָן தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது; நீண்ட முதல் உயிரையும் இறுதி மெய்யையும் தெளிவாகக் காட்டும் வழக்கமான வடிவம்.
- source_word: וְ/נָתָן
  choice: நாத்தான்
  rationale: பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது. இணைப்புச் சொல் וְ தமிழில் அரைப்புள்ளியால் இயல்பாக வெளிப்படும் தொடர்ச்சியாக அமைக்கப்பட்டுள்ளது; தேவையற்ற ‘மற்றும்’ தவிர்க்கப்பட்டது.
- source_word: הוֹלִיד
  choice: பெற்றான்
  rationale: முன்னைய அதே வினைச்சொல்லும் அதே வம்சப்பட்டியல் பணியும் என்பதால் ஒரே விதமாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: זָבָד
  choice: சாபாத்
  rationale: எபிரெய தனிப்பெயர் זָבָד ஒலிபெயர்க்கப்பட்டுள்ளது; ז-க்கு ‘ச’, நீண்ட ā-க்கு ‘ா’, இறுதி d-க்கு ‘த்’ பயன்படுத்தப்பட்டுள்ளன.
