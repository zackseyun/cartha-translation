lexical_decisions:
- source_word: וּבְנֵי
  choice: மகன்கள்
  rationale: בְנֵי என்பது ‘மகன்கள்’ என்னும் சொல்லின் இணைப்புநிலைப் பன்மை வடிவம்; இங்கு உடனடியாகப் பெயர்கள் பட்டியலிடப்படுவதால் ‘சந்ததியினர்’ என்பதைவிட ‘மகன்கள்’ நேரடியானது. தொடக்க וְ தமிழில் தனியே மொழிபெயர்க்கப்படாவிட்டாலும் வம்சவரலாற்றுப் பட்டியலின் இயல்பான நடை காக்கப்படுகிறது.
- source_word: חֶבְרוֹן
  choice: எப்ரோன்
  rationale: இது ஒருவரின் பெயர்; எபிரெய ஒலிவடிவத்தைத் தமிழில் இயல்பாக ஒலிபெயர்த்துள்ளது.
- source_word: קֹרַח
  choice: கோராகு
  rationale: தனிப்பெயரை எபிரெய உச்சரிப்புக்கு நெருக்கமாகத் தமிழ் எழுத்துகளில் ஒலிபெயர்த்துள்ளது.
- source_word: תַּפּוּחַ
  choice: தப்புவாகு
  rationale: வேறு சூழல்களில் பொதுப்பெயராகப் பொருள் தரக்கூடியதாயினும், இங்கு தனிப்பெயர் என்பதால் மொழிபெயர்க்காமல் ஒலிபெயர்த்துள்ளது.
- source_word: רֶקֶם
  choice: ரேகேம்
  rationale: தனிப்பெயரை மசோரா உயிர்க்குறிகளுக்கு நெருக்கமாக ஒலிபெயர்த்துள்ளது.
- source_word: שָׁמַע
  choice: சேமா
  rationale: மசோரா உரையின் שָׁמַע என்ற தனிப்பெயரை அதன் உயிர்க்குறிகளுக்கு ஏற்ப ‘சேமா’ என்று ஒலிபெயர்த்துள்ளது.
theological_decisions: []
