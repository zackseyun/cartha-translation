base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/013.yaml
  text: And Jesse fathered his firstborn Eliab[a], Abinadab the second, and Shimea the third.
translation:
  language: ta
  text: ஈசாய் தன் முதற்பேறான எலியாபையும், இரண்டாமவனாகிய அபினதாபையும், மூன்றாமவனாகிய சிமெயாவையும்[a] பெற்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேய உரையில் “சிமெயா”; 1 சாமுவேல் 16:9-இன் இணைப் பட்டியலில் “சம்மா” என்று உள்ளது.
    reason: cross_reference
lexical_decisions:
- source_word: וְאִישַׁי
  choice: ஈசாய்
  rationale: வம்சப் பட்டியலைத் தொடரும் וְ தமிழில் தனியே மொழிபெயர்க்கப்படாமல் இயல்பான தொடர்ச்சியாக விடப்பட்டுள்ளது; אִישַׁי என்ற பெயர் வழக்கமான தமிழ் வடிவில் ‘ஈசாய்’ என வழங்கப்பட்டுள்ளது.
- source_word: הוֹלִיד
  choice: பெற்றான்
  rationale: ילד என்பதன் ஹிஃபில் வடிவம் வம்சப் பட்டியலில் ‘தந்தையானான்/பிறப்பித்தான்’ என்ற ஆண் வழி மரபுப் பொருளைக் குறிக்கிறது; ‘பெற்றான்’ என்பது தமிழில் சுருக்கமான, இயல்பான வம்சப்பட்டியல் நடை.
- source_word: אֶת בְּכֹרוֹ אֶת אֱלִיאָב
  choice: தன் முதற்பேறான எலியாபையும்
  rationale: בְּכֹרוֹ என்பது ‘அவனுடைய முதற்பேறு’ என்று பொருள்; எலியாப் அதற்கு விளக்கப் பெயராக வருவதால் தமிழில் ‘தன் முதற்பேறான எலியாப்’ என இணைக்கப்பட்டுள்ளது.
- source_word: וַאֲבִינָדָב הַשֵּׁנִי
  choice: இரண்டாமவனாகிய அபினதாபையும்
  rationale: הַשֵּׁנִי வரிசையில் இரண்டாவது மகனைக் குறிக்கிறது; தமிழில் பட்டியலின் தொடர்பைத் தெளிவாகக் காட்ட ‘இரண்டாமவனாகிய’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: וְשִׁמְעָא הַשְּׁלִישִׁי
  choice: மூன்றாமவனாகிய சிமெயாவையும்
  rationale: நாளாகமத்தின் இவ்வசனத்திலுள்ள שִׁמְעָא பெயர் ‘சிமெயா’ என நேரடியாக ஒலிபெயர்க்கப்பட்டுள்ளது; הַשְּׁלִישִׁי என்பது ‘மூன்றாமவன்’ என்று வழங்கப்பட்டுள்ளது.
