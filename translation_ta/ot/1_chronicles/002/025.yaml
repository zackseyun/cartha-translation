base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/025.yaml
  text: The sons of Jerahmeel[a], the firstborn of Hezron, were Ram his firstborn, Bunah, Oren, Ozem, and Ahijah.
translation:
  language: ta
  text: 'எஸ்ரோனின் முதற்பேறான எரக்மெயேலின் மகன்கள்[a]: அவனுடைய முதற்பேறான மகன் ராம், பூனா, ஓரேன், ஓசேம், அகியா ஆகியோர்.


    [a] எபிரெய வாக்கிய அமைப்பின்படி, எரக்மெயேலின் ஐந்து மகன்கள் இங்கே பட்டியலிடப்பட்டு, ராம் அவனுடைய முதற்பேறான மகன் என்று அடையாளப்படுத்தப்படுவதாக வாசிக்கலாம். சிலர் “அகியா” என்பதை இப்பட்டியலுடன் வேறுவிதமாகத் தொடர்புபடுத்திப் புரிந்துகொண்டுள்ளனர்; ஆனால் நேரடியான வாசிப்பில் அது இத்தொடரில் வரும் மற்றொரு நபரின் பெயராக உள்ளது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய வாக்கிய அமைப்பின்படி, எரக்மெயேலின் ஐந்து மகன்கள் இங்கே பட்டியலிடப்பட்டு, ராம் அவனுடைய முதற்பேறான மகன் என்று அடையாளப்படுத்தப்படுவதாக வாசிக்கலாம். சிலர் “அகியா” என்பதை இப்பட்டியலுடன் வேறுவிதமாகத் தொடர்புபடுத்திப் புரிந்துகொண்டுள்ளனர்; ஆனால் நேரடியான வாசிப்பில் அது இத்தொடரில் வரும் மற்றொரு நபரின் பெயராக உள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: ஆகியோர்
  rationale: வம்சவரலாற்றுப் பட்டியலில் குடும்ப உறுப்பினர்களை அறிமுகப்படுத்தும் היה என்பதன் செயல்பாட்டை இயல்பான நவீனத் தமிழில் நிறைவு செய்கிறது.
- source_word: בְנֵי
  choice: மகன்கள்
  rationale: இச்சூழலில் ஆண் வழித்தோன்றல்களைக் குறிக்கும் எபிரெயச் சொல்லின் பாலின மற்றும் வம்சவரலாற்று வலிமையைப் பாதுகாக்கிறது.
- source_word: יְרַחְמְאֵל
  choice: எரக்மெயேல்
  rationale: எபிரெயத் தனிப்பெயரின் ஒலியைத் தமிழில் அண்மையாக எழுத்துப்பெயர்க்கிறது.
- source_word: בְּכוֹר חֶצְרוֹן
  choice: எஸ்ரோனின் முதற்பேறான
  rationale: எரக்மெயேல் எஸ்ரோனின் முதற்பேறு என்பதைத் தெளிவாகக் காட்டுகிறது.
- source_word: הַבְּכוֹר
  choice: அவனுடைய முதற்பேறான
  rationale: மீண்டும் வரும் எபிரெயச் சொல்லை விடாமல், ராம் எரக்மெயேலின் முதற்பேறு என்பதை இயல்பாகத் தெளிவுபடுத்துகிறது.
- source_word: רָם
  choice: ராம்
  rationale: தனிப்பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וּבוּנָה
  choice: பூனா
  rationale: தனிப்பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וָאֹרֶן
  choice: ஓரேன்
  rationale: தனிப்பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וָאֹצֶם
  choice: ஓசேம்
  rationale: தனிப்பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: אֲחִיָּה
  choice: அகியா
  rationale: எபிரெயத் தனிப்பெயர் தமிழில் இயல்பாக ஒலிபெயர்க்கப்பட்டுள்ளது.
