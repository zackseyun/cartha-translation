revisions:
- from: 'யூதாவின் மகன்கள்: ஏர், ஓனான், சேலா. இந்த மூவரும் கானானியப் பெண்ணான சூவாவின் மகள்[a] மூலம் அவனுக்குப் பிறந்தார்கள். யூதாவின் முதற்பேறான ஏர் யாவேயின் பார்வையில் தீயவனாக இருந்தான்; அவர் அவனை மரணமடையச் செய்தார்[b].'
  to: 'யூதாவின் மகன்கள்: ஏர், ஓனான், சேலா. இந்த மூவரும் சூவாவின் மகளான கானானியப் பெண்ணால் அவனுக்குப் பிறந்தார்கள்[a]. யூதாவின் முதற்பிறந்தவனான ஏர் யாவேயின் பார்வையில் தீயவனாக இருந்தான்; அவர் அவனைக் கொன்றார்[b].'
  rationale: The revision improves modern Tamil idiom while maintaining every source element and the source's syntactic restraint. It renders the maternal phrase as a clear descent/agency expression, makes Er's firstborn status explicit, and uses the natural direct Tamil equivalent of the causative death verb. The footnotes retain the proper-name ambiguity and the implicit-subject explanation.
