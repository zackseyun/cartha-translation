  text: בְּנֵ֣י יְהוּדָ֗ה עֵ֤ר וְ/אוֹנָן֙ וְ/שֵׁלָ֔ה שְׁלוֹשָׁה֙ נ֣וֹלַד ל֔/וֹ מִ/בַּת שׁ֖וּעַ הַֽ/כְּנַעֲנִ֑ית וַ/יְהִ֞י עֵ֣ר בְּכ֣וֹר יְהוּדָ֗ה רַ֛ע בְּ/עֵינֵ֥י יְהוָ֖ה וַ/יְמִיתֵֽ/הוּ־׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/003.yaml
  text: 'The sons of Judah: Er[a], Onan, and Shelah; three were born to him by Bath-shua the Canaanite. Er, Judah’s firstborn, was evil in the sight of Yahweh[b], and he put him to death.'
translation:
  language: ta
  text: 'யூதாவின் மகன்கள்: ஏர், ஓனான், சேலா. இந்த மூவரும் சூவாவின் மகளான கானானியப் பெண்ணால் அவனுக்குப் பிறந்தார்கள்[a]. யூதாவின் முதற்பிறந்தவனான ஏர் யாவேயின் பார்வையில் தீயவனாக இருந்தான்; அவர் அவனைக் கொன்றார்[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “சூவாவின் மகளான கானானியப் பெண்ணால்.” சிலர் இதை “கானானியப் பெண்ணான பாத்சூவா” என்ற தனிப்பெயராகப் புரிந்துகொள்கிறார்கள்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “யாவே அவனைக் கொன்றார்.” எபிரெயத்தில் எழுவாய் வெளிப்படையாகக் கூறப்படவில்லை; முந்தைய சொற்றொடரிலுள்ள யாவேயையே அது இயல்பாகக் குறிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי יְהוּדָה
  choice: யூதாவின் மகன்கள்
  rationale: வம்சவரலாற்றுப் பாணியையும் எபிரெயக் கட்டமைப்பின் உறவையும் இயல்பான தமிழில் காக்கிறது.
- source_word: שְׁלוֹשָׁה
  choice: இந்த மூவரும்
  rationale: பெயரிடப்பட்ட மூன்று மகன்களைக் குறிக்கும் எண்ணிக்கையை வெளிப்படையாகக் காக்கிறது; தமிழில் முன் வந்த பட்டியலோடு இயல்பாக இணைகிறது.
- source_word: נוֹלַד לוֹ
  choice: அவனுக்குப் பிறந்தார்கள்
  rationale: ילד என்பதன் நிஃபால் வடிவிலுள்ள செயப்பாட்டு பொருளை, ‘அவன் பெற்றான்’ என்று செயலாக்காமல் காக்கிறது.
- source_word: מִבַּת שׁוּעַ הַכְּנַעֲנִית
  choice: கானானியப் பெண்ணான சூவாவின் மகள் மூலம்
  rationale: சொற்றொடரை ‘சூவாவின் மகள், கானானியப் பெண்’ என்ற மூலப் பொருளுக்கு ஏற்ப மொழிபெயர்க்கிறது; ‘பாத்சூவா’ என்ற தனிப்பெயர் வாசிப்பை அடிக்குறிப்பில் தருகிறது.
- source_word: בְּכוֹר יְהוּדָה
  choice: யூதாவின் முதற்பேறான
  rationale: வம்சவரலாற்று முக்கியத்துவத்தையும் முதற்பிறந்த மகன் என்ற உறவையும் சுருக்கமாகக் காக்கிறது.
- source_word: רַע בְּעֵינֵי יְהוָה
  choice: யாவேயின் பார்வையில் தீயவனாக இருந்தான்
  rationale: தெய்வீக மதிப்பீட்டைக் குறிக்கும் எபிரெய மரபுத்தொடரின் ‘கண்களில்/பார்வையில்’ உருவகத்தை இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கெழுத்துத் தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: וַיְמִיתֵהוּ
  choice: அவர் அவனை மரணமடையச் செய்தார்
  rationale: המית வினையின் காரணவினைப் பொருளை ‘கொன்றார்’ என்பதைக் காட்டிலும் வெளிப்படையாகக் காக்கிறது; மரியாதைப் பிரதிப்பெயர் முந்தைய யாவேயைக் குறிக்கிறது.
theological_decisions:
- issue: וַיְמִיתֵהוּ என்பதன் வெளிப்படையாகக் கூறப்படாத எழுவாய்
  choice: ‘அவர்’ என்பது முந்தைய சொற்றொடரிலுள்ள யாவேயைக் குறிக்கிறது
  alternative: ‘யாவே அவனை மரணமடையச் செய்தார்’ என்று பெயரை மீண்டும் வெளிப்படையாகக் கூறுதல்
  rationale: எபிரெய உரையில் எழுவாய் மீண்டும் பெயரிடப்படவில்லை; முந்தைய சொற்றொடரின் யாவே இயல்பான குறிப்பு. பிரதிப்பெயரை வைத்திருப்பது மூலத்தின் தொடர்ச்சியையும் சிறிய மறைமுகத்தன்மையையும் காக்கிறது.
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் இருப்பது பொதுப் பட்டமல்ல, இஸ்ரவேலின் தேவனுடைய தனிப்பெயர்; ஆகவே ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், வம்சவரலாற்றுக்கேற்ற சுருக்கமானதும் கண்ணியமானதும் ஆன நடை பயன்படுத்தப்பட்டது. ‘அவன்/அவர்’ வேறுபாடு யூதாவையும் யாவேயையும் தெளிவாக வேறுபடுத்துகிறது; மூலத்தில் வெளிப்படையாக இல்லாத காரணத் தொடர்பு சேர்க்கப்படவில்லை.
