source:
  edition: WLC
  text: וַ/יִּהְי֤וּ בָנִים֙ לְ/שׁוֹבָ֔ל אֲבִ֖י קִרְיַ֣ת יְעָרִ֑ים הָרֹאֶ֖ה חֲצִ֥י הַ/מְּנֻחֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/052.yaml
  text: 'And Shobal the father of Kiriath-jearim had sons: Haroeh[c][b][a], half of the Manahathites.'
translation:
  language: ta
  text: 'கீரியாத்-யெயாரீமின் தந்தையான[a] சோபாலுக்கு மகன்கள் இருந்தார்கள்: ஹரோவே[b], மெனுகோத்தின் பாதி[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கீரியாத்-யெயாரீமை நிறுவியவர்.’ மரபுவழிப் பட்டியல்களில் ‘தந்தை’ என்பது ஓர் ஊரோடு தொடர்புடைய மூதாதை, நிறுவியவர் அல்லது தலைவரைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ஹரோவே என்பது ஒரு தனிப்பெயராகத் தெரிகிறது; சில மரபுகளில் இது ‘ரெயாயா’ என வழங்கப்படுகிறது.
    reason: alternative_reading
  - marker: c
    text: எபிரெயத்தில், ‘மெனுகோத்தின் பாதி.’ இது மெனுகோத் என்னும் இடத்தின் பாதியையோ, அங்கிருந்த குடியினர் அல்லது குலத்தாரில் பாதிப்பேரையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ בָנִים לְשׁוֹבָל
  choice: சோபாலுக்கு மகன்கள் இருந்தார்கள்
  rationale: ‘சோபாலுக்கு மகன்கள் இருந்தார்கள்’ என்பது எபிரெய மரபுவழிப் பட்டியல் நடையைத் தெளிவான, இயல்பான தமிழில் நேரடியாகப் பிரதிபலிக்கிறது.
- source_word: אֲבִי קִרְיַת יְעָרִים
  choice: கீரியாத்-யாரீமின் தந்தையாகிய
  rationale: மூலத்தின் ‘தந்தை’ என்ற சொல்லை வெளிப்படையாகத் தக்கவைக்கிறது; இத்தகைய மரபுவழிப் பட்டியல்களில் அது ஒரு ஊரின் மூதாதை, நிறுவியவர் அல்லது தலைவரைக் குறிக்கக்கூடும் என்பதைக் குறிப்பில் விளக்குகிறது.
- source_word: קִרְיַת יְעָרִים
  choice: கீரியாத்-யாரீம்
  rationale: இது ஓர் இடப்பெயர் என்பதால் அதன் பொருளை மொழிபெயர்க்காமல் தமிழ் ஒலிபெயர்ப்பாக வழங்கப்பட்டுள்ளது.
- source_word: הָרֹאֶה
  choice: அரோவே
  rationale: இம்மரபுவழிப் பட்டியலில் இது தனிப்பெயராகச் செயல்படுவதாக எடுத்துக்கொண்டு எபிரெய உச்சரிப்புக்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டுள்ளது; ‘ரெயாயா’ என்ற மாற்று மரபும் குறிப்பில் தரப்பட்டுள்ளது.
- source_word: חֲצִי הַמְּנֻחוֹת
  choice: மனுகோத் மக்களில் பாதிப்பேர்
  rationale: சொற்றொடரின் ‘மனுகோத்தில்/மனுகோத் மக்களில் பாதி’ என்ற தெளிவின்மையை முற்றிலும் தீர்த்துவிடாமல், குலத்தார் அல்லது குடியிருப்போரைக் குறிக்கும் சாத்தியத்தை இயல்பான தமிழில் காட்டுகிறது; இடப்பெயர் சார்ந்த புரிதல் குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
