  source_fidelity: 'வசனத்தின் வாக்கிய அமைப்பும் உறவும் சரியாகக் காக்கப்பட்டுள்ளன: எஸ்ரோனுக்குப் பிறந்த மகன்களின் பட்டியலாகவே மொழிபெயர்க்கப்பட்டுள்ளது. ஆனால் יְרַחְמְאֵל என்ற பெயரில் உள்ள ח ஒலி வரைவு வடிவமான ‘யெராமெயேல்’ இல் விடுபட்டுள்ளது; כְּלוּבָי என்பதில் உள்ள நீண்ட ū ஒலியும் ‘கெலுபாய்’ இல் துல்லியமாகக் காட்டப்படவில்லை.'
  naturalness: ‘எஸ்ரோனுக்குப் பிறந்த மகன்கள்’ என்ற தொடர் நவீன பொதுத் தமிழில் இயல்பாகவும், வம்சவரலாற்றுப் பட்டியல் நடைக்கு ஏற்றதாகவும் உள்ளது. இரட்டை இடைநிறுத்தப் புள்ளிக்குப் பின் பெயர்ப்பட்டியல் தெளிவாக உள்ளது.
