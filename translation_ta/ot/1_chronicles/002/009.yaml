  text: וּ/בְנֵ֥י חֶצְר֖וֹן אֲשֶׁ֣ר נוֹלַד ל֑/וֹ אֶת יְרַחְמְאֵ֥ל וְ/אֶת רָ֖ם וְ/אֶת כְּלוּבָֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/009.yaml
  text: 'The sons of Hezron who were born to him: Jerahmeel[a], Ram, and Chelubai.'
translation:
  language: ta
  text: 'எஸ்ரோனுக்குப் பிறந்த மகன்கள்: யெரக்மெயேல், ராம், கெலூபாய்[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கெலூபாய், இந்த வம்சவரலாற்றில் வேறு இடங்களில் காலேப் என்று அழைக்கப்படும் அதே நபராக இருக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: மகன்கள்
  rationale: בְּנֵי என்பது ‘மகன்கள்’ என்ற பொருளுடைய பன்மை இணைப்புநிலை வடிவம். தொடக்கத்தில் உள்ள וּ இணைப்பைத் தமிழ் வம்சவரலாற்று நடையில் தனியாக மொழிபெயர்க்காமல் இயல்பாக உள்ளடக்கியுள்ளோம்.
- source_word: חֶצְרוֹן
  choice: எஸ்ரோன்
  rationale: எபிரெய தனிப்பெயரின் ஒலியை நவீனத் தமிழில் தெளிவாகக் காட்டும் மரபான பெயர்ப்பு.
- source_word: אֲשֶׁר נוֹלַד לוֹ
  choice: எஸ்ரோனுக்குப் பிறந்த
  rationale: ילד என்பதன் நிஃபால் வடிவமும் לוֹ என்பதும் தரும் ‘அவனுக்குப் பிறந்த’ என்ற செயப்பாட்டு உறவைப் பாதுகாக்கிறது. தமிழில் சுட்டுப்பெயரின் ஐயத்தைத் தவிர்க்க எஸ்ரோனின் பெயர் மீண்டும் குறிப்பிடப்பட்டுள்ளது.
- source_word: אֶת
  choice: —
  rationale: இது நேரடிச் செயப்படுபொருளைக் குறிக்கும் எபிரெய இலக்கணக் குறி; தமிழில் இதற்குத் தனிச் சொல் தேவையில்லை.
- source_word: יְרַחְמְאֵל
  choice: யெராமெயேல்
  rationale: எபிரெய தனிப்பெயரைத் தமிழ் ஒலியமைப்புக்கு ஏற்றவாறு எழுத்துப்பெயர்த்தல்.
- source_word: רָם
  choice: ராம்
  rationale: எபிரெய தனிப்பெயரை நேரடியாக எழுத்துப்பெயர்த்தல்.
- source_word: כְּלוּבָי
  choice: கெலுபாய்
  rationale: மூல மெய்யெழுத்து வடிவம் כְּלוּבָי என்பதால், அதை நன்கு அறியப்பட்ட ‘காலேப்’ என்ற பெயரோடு முதன்மை உரையில் ஒத்திசைக்காமல் நேரடியாக எழுத்துப்பெயர்த்துள்ளோம்.
theological_decisions:
- issue: கெலுபாயையும் காலேபையும் ஒரே நபராக அடையாளப்படுத்துதல்
  choice: முதன்மை உரையில் ‘கெலுபாய்’ என்று மூல வடிவத்தைப் பாதுகாத்து, சாத்தியமான அடையாளத்தை அடிக்குறிப்பில் குறிப்பிடுதல்
  alternative: முதன்மை உரையிலேயே ‘காலேப்’ என்று எழுதுதல்
  rationale: எபிரெய உரை இங்கு குறிப்பாக כְּלוּבָי என்று வாசிக்கிறது. வேறு இடங்களிலுள்ள காலேபுடன் இவர் ஒரே நபராக இருக்கலாம் என்ற சாத்தியத்தைத் தெரிவிக்கலாம்; ஆனால் அதை உறுதியான அடையாளமாக உரைக்குள் திணிக்கக் கூடாது.
translation_notes:
  register: இன்றைய பொதுத் தமிழ் வாசகர்களுக்குப் புரியும் எளிய, கண்ணியமான வம்சவரலாற்று நடை பயன்படுத்தப்பட்டுள்ளது. ‘குமாரர்கள்’ என்பதற்குப் பதிலாக இயல்பான ‘மகன்கள்’ தேர்ந்தெடுக்கப்பட்டது; பெயர்களின் பட்டியல் சுருக்கமாகவும் மூலத்தின் அமைப்புக்கு நெருக்கமாகவும் வைக்கப்பட்டுள்ளது.
