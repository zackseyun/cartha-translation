translation_notes:
  register: நவீன தரத் தமிழில், மரியாதையும் எளிமையும் கொண்ட பெயர்ப்பட்டியல் நடை. மூலத்தின் பெயர் வரிசை அப்படியே காக்கப்பட்டுள்ளது; சமயப்பிரிவு சார்ந்த சொற்கள் சேர்க்கப்படவில்லை.
