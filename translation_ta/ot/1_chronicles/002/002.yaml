lexical_decisions:
- source_word: דָּן
  choice: தாண்
  rationale: தனிநபர் மற்றும் கோத்திரப் பெயர்; எபிரேய ஒலிப்பை இயன்றவரை பின்பற்றி தமிழில் எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: יוֹסֵף
  choice: யோசேப்பு
  rationale: தனிநபர் மற்றும் கோத்திரப் பெயர்; தமிழில் நன்கு நிலைபெற்ற வடிவம் பயன்படுத்தப்பட்டது.
- source_word: וּ/בִנְיָמִן
  choice: பென்யமீன்
  rationale: பெயர் எபிரேய ஒலிப்புக்கு அண்மையாக எழுத்துப்பெயர்க்கப்பட்டது. பட்டியலில் உள்ள ו இணைப்புகள் தமிழில் ஒவ்வொரு இடத்திலும் வெளிப்படையாகத் தேவைப்படாததால் தனியே மொழிபெயர்க்கப்படவில்லை.
- source_word: נַפְתָּלִי
  choice: நப்தலி
  rationale: தனிநபர் மற்றும் கோத்திரப் பெயர்; எபிரேய ஒலிப்பை அண்மையாகக் காட்டும் இயல்பான தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: גָּד
  choice: காத்
  rationale: தனிநபர் மற்றும் கோத்திரப் பெயர்; இறுதி மெய்யொலியையும் நீண்ட உயிரையும் பிரதிபலிக்கும் எழுத்துப்பெயர்ப்பு.
- source_word: וְ/אָשֵׁר
  choice: ஆசேர்
  rationale: தனிநபர் மற்றும் கோத்திரப் பெயர் எபிரேய ஒலிப்புக்கு அண்மையாக எழுத்துப்பெயர்க்கப்பட்டது; இறுதி ו தமிழ்ப் பட்டியல் நடையில் நிறுத்தற்குறியால் இயல்பாக வெளிப்படுகிறது.
