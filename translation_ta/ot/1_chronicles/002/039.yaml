translation_notes:
  register: நவீனத் தரத் தமிழில், வம்சப் பட்டியலுக்கேற்ற சுருக்கமானதும் கண்ணியமானதும் ஆன நடை. ‘பெற்றான்’ என்பதன் சாத்தியமான தெளிவின்மையைத் தவிர்த்து, எபிரெய வினையின் ஆண் வம்சப் பொருளை ‘தந்தையானான்’ என வெளிப்படுத்துகிறது. அடிக்குறி குறியீடு பிரதான உரையில் இணைக்கப்பட்டுள்ளது.
