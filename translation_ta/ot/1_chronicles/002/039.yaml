base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/039.yaml
  text: Azariah fathered Helez[a], and Helez fathered Eleasah.
translation:
  language: ta
  text: அசரியா ஏலேசுக்குத் தந்தையானான்; ஏலேஸ் எலெயாசாவுக்குத் தந்தையானான்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இறுதிப் பெயரைச் சுருக்கமான ஒலிபெயர்ப்பில் ‘எலாசா’ என்றும் வழங்கலாம்; இங்கு எபிரெய வடிவை நேரடியாகப் பிரதிபலிக்கும் ‘எலெயாசா’ பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲזַרְיָה
  choice: அசரியா
  rationale: இது ஓர் ஆண்பால் இயற்பெயர். எபிரெய உச்சரிப்பை நெருக்கமாகப் பின்பற்றி தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது; முன்னொட்டு வாவ் வாக்கியத் தொடர்ச்சியில் இயல்பாகக் கொள்ளப்படுகிறது.
- source_word: הֹלִיד
  choice: தந்தையானான்
  rationale: வம்சப் பட்டியல் சூழலில் ஹிஃபில் வடிவிலுள்ள ילד, ஒருவனைப் பெற்றெடுத்த ஆண் முன்னோனாக இருப்பதைக் குறிக்கிறது. ‘தந்தையானான்’ என்பது நவீன தமிழில் இயல்பாகவும் ஆண் வழி வம்சத் தொடர்பைத் தெளிவாகவும் காட்டுகிறது.
- source_word: אֶת
  choice: '[தனியே மொழிபெயர்க்கப்படவில்லை]'
  rationale: இது நேரடி செயப்படுபொருள் குறியீடு; தமிழில் இதற்குத் தனிச் சொல் தேவையில்லை, வேற்றுமை உருபு வழியாக அதன் இலக்கணப் பணி வெளிப்படுகிறது.
- source_word: חָלֶץ / וְחֶלֶץ
  choice: ஏலேஸ் / ஏலேஸ்
  rationale: ஒரே இயற்பெயர் இரு உட்பிரிவுகளிலும் வருகிறது; எபிரெய வடிவை நெருக்கமாக ஒலிபெயர்த்து இரு இடங்களிலும் ஒரேவிதமாக வழங்கப்பட்டுள்ளது. இரண்டாவது இடத்தின் வாவ், அரைப்புள்ளியால் குறிக்கப்படும் தொடர்ச்சியில் இயல்பாக வெளிப்படுகிறது.
- source_word: אֶלְעָשָׂה
  choice: எலெயாசா
  rationale: எபிரெய மெய்-உயிர் வடிவமான ʾElʿāsâ-வை நெருக்கமாகப் பிரதிபலிக்கும் தமிழ் ஒலிபெயர்ப்பு; பெயரின் நடுவிலுள்ள ע ஒலிக்கூறு தமிழில் இயல்பாக ‘யா’ இணைப்பால் அணுகப்பட்டுள்ளது.
