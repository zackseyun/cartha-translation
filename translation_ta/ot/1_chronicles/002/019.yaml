translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட நடையைக் கடைப்பிடிக்கிறது. வம்சவரலாற்றின் சுருக்கமான தொடர் அமைப்பு காக்கப்பட்டுள்ளது. எபிரெய மூலத்தில் உள்ள ‘எடுத்துக்கொண்டான்’ என்ற திருமண மரபுத்தொடரின் பொருள் பிரதான உரையில் தெளிவாக்கப்பட்டு, அதன் சொற்சார்ந்த வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
