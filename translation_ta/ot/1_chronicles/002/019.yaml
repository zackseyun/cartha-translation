  yaml_path: translation/ot/1_chronicles/002/019.yaml
  text: Azubah died[a], and Caleb took Ephrath as his wife[b], and she bore Hur to him.
translation:
  language: ta
  text: அசூபா இறந்தபின், காலேப் எப்ராத்தைத் தனக்கு மனைவியாக ஏற்றுக்கொண்டான்[a]. அவள் அவனுக்கு ஊரைப் பெற்றெடுத்தாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்சார்ந்து, “காலேப் எப்ராத்தைத் தனக்கென்று எடுத்துக்கொண்டான்” என்று உள்ளது. இது திருமணத்தைக் குறிக்கும் மரபுத்தொடர்; “காலேப் எப்ராத்தை மணந்துகொண்டான்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּמָת
  choice: இறந்தாள்
  rationale: מות என்பதன் Qal wayyiqtol வடிவம்; மறைமுகமான மென்மைப்படுத்தலைத் தவிர்த்து, மரணத்தை இயல்பாகவும் நேரடியாகவும் குறிக்கிறது.
- source_word: עֲזוּבָה
  choice: அசூபாள்
  rationale: பெண்ணின் இயற்பெயர்; எபிரெய ஒலிப்பை நவீனத் தமிழ் பெயரொலிப்பு மரபுக்கு ஏற்ப வழங்குகிறது. பெண்பால் பெயர் என்பதைத் தெளிவாக்க இறுதி மெய்யுடன் இயல்பான தமிழ் வேற்றுமை ஏற்கும் வடிவம் பயன்படுத்தப்பட்டது.
- source_word: וַיִּקַּח לוֹ
  choice: தனக்கு மனைவியாக ஏற்றுக்கொண்டான்
  rationale: ஒரு பெண்ணை இலக்காகக் கொண்ட לקח என்பது திருமணம் செய்துகொள்ளுதலைக் குறிக்கும் எபிரெய மரபுத்தொடர். தமிழில் திருமணப் பொருளைத் தெளிவாக்கியபடியே ‘தனக்கு எடுத்தான்’ என்ற மூல அமைப்பின் கூறையும் இயன்றவரை காக்கிறது.
- source_word: כָלֵב
  choice: காலேப்
  rationale: எபிரெய இயற்பெயரின் ஒலிப்பெயர்ப்பு.
- source_word: אֶפְרָת
  choice: எப்ராத்
  rationale: இவ்வசனத்தில் உள்ள குறுகிய אֶפְרָת வடிவத்தைப் பின்பற்றும் ஒலிப்பெயர்ப்பு; வேறு இடங்களின் விரிவான ‘எப்ராத்தா’ வடிவம் இங்கு இறக்குமதி செய்யப்படவில்லை.
- source_word: וַתֵּלֶד לוֹ
  choice: அவள் அவனுக்கு ... பெற்றெடுத்தாள்
  rationale: ילד என்பதன் Qal வடிவம் பிரசவித்தலைக் குறிக்கிறது; לּוֹ என்ற மறைமுகப் பொருளை ‘அவனுக்கு’ என்று வெளிப்படையாகக் காக்கிறது.
- source_word: חוּר
  choice: ஊர்
  rationale: எபிரெய חוּר பெயரின் ஒலிப்பெயர்ப்பு; தொடக்க ח ஒலி தமிழில் வழக்கமாக உயிரொலியுடன் வழங்கப்படுகிறது.
