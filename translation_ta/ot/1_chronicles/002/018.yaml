source:
  edition: WLC
  text: וְ/כָלֵ֣ב בֶּן חֶצְר֗וֹן הוֹלִ֛יד אֶת עֲזוּבָ֥ה אִשָּׁ֖ה וְ/אֶת יְרִיע֑וֹת וְ/אֵ֣לֶּה בָנֶ֔י/הָ יֵ֥שֶׁר וְ/שׁוֹבָ֖ב וְ/אַרְדּֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/018.yaml
  text: 'And Caleb son of Hezron fathered children by Azubah his wife[a], and by Jerioth; and these were her sons: Jesher, Shobab[b], and Ardon.'
translation:
  language: ta
  text: 'எஸ்ரோனின் மகன் காலேப், தன் மனைவி அசூபாவின் மூலமாகவும்[a] எரியோத்தின் மூலமாகவும் பிள்ளைகளைப் பெற்றான். அவளுடைய மகன்கள்[b] இவர்கள்: யேஷேர், ஷோபாப், அர்தோன்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத் தொடரியல் இங்கு கடினமாக உள்ளது. ‘எரியோத்’ என்பது காலேபுடன் தொடர்புடைய இரண்டாவது பெண்ணைக் குறிக்கலாம்; அல்லது சில விளக்கங்களில் அது அசூபாவுடன் இணைத்து, அவளை விளக்கும் பெயராகப் புரிந்துகொள்ளப்படலாம்.
    reason: alternative_reading
  - marker: b
    text: எபிரெயத்தில் ‘அவளுடைய மகன்கள்’ என்று உள்ளது. சிலர் இந்த வம்சவரலாற்றை வேறுவிதமாகப் புரிந்துகொண்டாலும், மசோரெட்டிக் உரையில் இங்குள்ள பின்னொட்டு பெண்பால் ஒருமையாகும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹלִיד
  choice: பிள்ளைகளைப் பெற்றான்
  rationale: יָלַד என்பதன் ஹிஃபில் வடிவம் இங்கு ‘தந்தையானான்/பிள்ளைகளைப் பெற்றான்’ என்ற பொருளைக் கொண்டது. பெண்களின் பெயர்கள் தொடர்ந்து வருவதால், இயல்பான தமிழில் உறவைத் தெளிவாக்க ‘மூலமாகப் பிள்ளைகளைப் பெற்றான்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: אֶת עֲזוּבָה אִשָּׁה וְאֶת יְרִיעוֹת
  choice: தன் மனைவி அசூபாவின் மூலமாகவும் எரியோத்தின் மூலமாகவும்
  rationale: எபிரெயத் தொடர் சுருக்கமாகவும் இலக்கண ரீதியாகக் கடினமாகவும் உள்ளது. אִשָּׁה என்பதை அசூபாவை விளக்கும் ‘மனைவி’ என எடுத்துக்கொண்டு, யெரீயோத்தை/எரியோத்தை இணையாகக் குறிப்பிடும் பெண்ணாக முதன்மை உரை வழங்குகிறது; வேறு புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: אִשָּׁה
  choice: தன் மனைவி
  rationale: பெயர்ச்சொல்லில் உடைமைப் பின்னொட்டு இல்லாவிட்டாலும், இந்த வம்சவரலாற்றுச் சூழலில் ‘மனைவி’ என்பதே இயல்பான பொருள். காலேபுடனான உறவைத் தமிழில் இயல்பாகக் காட்ட ‘தன்’ சேர்க்கப்பட்டது.
- source_word: יְרִיעוֹת
  choice: எரியோத்
  rationale: தனிப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: וְאֵלֶּה בָנֶיהָ
  choice: அவளுடைய மகன்கள்
  rationale: בָנֶיהָ என்பதிலுள்ள பின்னொட்டு பெண்பால் ஒருமை; ஆகவே வம்சவரலாற்றைச் சீராக்க முயலாமல் மசோரெட்டிக் உரையின் இலக்கணப்படி ‘அவளுடைய’ என்பது தக்கவைக்கப்பட்டது.
- source_word: יֵשֶׁר וְשׁוֹבָב וְאַרְדּוֹן
  choice: யேசேர், சோபாப், அர்தோன்
  rationale: தனிப்பெயர்கள் நவீன தமிழில் வாசிக்க ஏற்றவாறு ஒலிபெயர்க்கப்பட்டன.
theological_decisions:
- issue: இவ்வசனத்தில் குறிப்பிடப்படும் பெண்களையும் மகன்களையும் பற்றிய வம்சவரலாற்றுத் தெளிவின்மை
  choice: காலேப் தன் மனைவி அசூபாவின் மூலமாகவும் எரியோத்தின் மூலமாகவும் பிள்ளைகளைப் பெற்றான்; பின்னர் வருபவர்கள் மசோரெட்டிக் உரையிலுள்ள பெண்பால் ஒருமைப் பின்னொட்டின்படி ‘அவளுடைய மகன்கள்’ எனக் குறிப்பிடப்படுகின்றனர்.
  alternative: எரியோத் அசூபாவுக்கான மற்றொரு பெயராகவோ அவளை விளக்கும் இணைப்பெயராகவோ இருக்கலாம்; அல்லது சில வம்சவரலாற்று மறுகட்டமைப்புகளில் மகன்கள் வேறுவிதமாகப் பகுக்கப்படலாம்.
  rationale: இது கோட்பாட்டை விட உரையியல் மற்றும் தொடரியல் சார்ந்த தெளிவின்மை. முதன்மை உரை மசோரெட்டிக் இலக்கணத்தைப் பாதுகாக்கிறது; அதேவேளையில் கடினமான தொடரைத் தீர்மானமாக ஒரே விதத்தில் முடித்துவிடாமல் அடிக்குறிப்பு மாற்றுப் புரிதலைச் சுட்டுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. வம்சவரலாற்றுக்குரிய சுருக்கமான நடை காக்கப்பட்டதுடன், மூலத்திலுள்ள பெண்பால் குறிப்பு மற்றும் தொடரியல் தெளிவின்மை மறைக்கப்படவில்லை.
