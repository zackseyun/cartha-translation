  text: וְ/אַחַ֥ר מוֹת חֶצְר֖וֹן בְּ/כָלֵ֣ב אֶפְרָ֑תָה וְ/אֵ֤שֶׁת חֶצְרוֹן֙ אֲבִיָּ֔ה וַ/תֵּ֣לֶד ל֔/וֹ אֶת אַשְׁח֖וּר אֲבִ֥י תְקֽוֹעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/024.yaml
  text: After Hezron died in Caleb-ephrathah[a], Hezron’s wife Abijah bore to him Ashhur[b], the father of Tekoa.
translation:
  language: ta
  text: காலேப்-எப்ராத்தாவில்[a] எஸ்ரோன் இறந்த பிறகு, எஸ்ரோனின் மனைவி அபியா அவனுக்கு அஷ்ஹூரைப் பெற்றெடுத்தாள். அஷ்ஹூர் தெக்கோவாவின் தந்தை[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “காலேப்-எப்ராத்தாவில்” என்ற எபிரெயத் தொடர் பொருள் காண்பதற்குக் கடினமானது. இது ஓர் இடத்தையோ குலத்தையோ குறிக்கலாம்; மரபாக “காலேப்-எப்ராத்தா” அல்லது “காலேப் எப்ராத்தா” என்று வழங்கப்படுகிறது.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “தெக்கோவாவை நிறுவியவர்.” வம்சப்பட்டியல்களில் “தந்தை” என்பது உடனடியான உயிரியல் தந்தையை மட்டுமல்லாமல், ஓர் ஊரையோ குலத்தையோ நிறுவியவர் அல்லது அதன் முதன்மை மூதாதையையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחַר מוֹת חֶצְרוֹן
  choice: எஸ்ரோன் இறந்த பிறகு
  rationale: אַחַר + מוֹת என்ற காலத்தைக் குறிக்கும் அமைப்பை, பொருளைத் தெளிவாகக் காக்கும் இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: בְּכָלֵב אֶפְרָתָה
  choice: காலேப்-எப்ராத்தாவில்
  rationale: בְ என்பதை இடத்தைக் குறிக்கும் ‘-இல்’ என எடுத்துக்கொண்டு, கடினமான இருசொல் குறிப்பை ஒரே இடம் அல்லது குலப்பெயராகக் காட்ட இணைப்புக்கோடு பயன்படுத்தப்பட்டுள்ளது; அதன் நிச்சயமின்மை அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: וְאֵשֶׁת חֶצְרוֹן אֲבִיָּה
  choice: எஸ்ரோனின் மனைவி அபியா
  rationale: எபிரெயக் கட்டமைப்பை இயல்பான தமிழ் உடைமைத் தொடராக வழங்குகிறது; אֲבִיָּה என்பது பெண்ணின் தனிப்பெயராக ஒலிபெயர்க்கப்படுகிறது.
- source_word: וַתֵּלֶד לוֹ
  choice: அவனுக்கு ... பெற்றெடுத்தாள்
  rationale: לוֹ என்ற மறைமுகச் சுட்டை விடாமல் காத்து, יָלַד வினையின் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: אַשְׁחוּר
  choice: அஸ்கூர்
  rationale: எபிரெயத் தனிப்பெயரின் ஒலியைத் தமிழில் அணுக்கமாகக் குறிக்கிறது.
- source_word: אֲבִי תְקוֹעַ
  choice: தெக்கோவாவின் தந்தை
  rationale: אָב என்பதன் வெளிப்படையான ‘தந்தை’ என்ற பொருளை முதன்மை உரையில் காக்கிறது; வம்சப்பட்டியல் சூழலில் சாத்தியமான ‘நிறுவியவர்/முதன்மை மூதாதை’ பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
