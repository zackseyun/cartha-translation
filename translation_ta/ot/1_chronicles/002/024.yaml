translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடையைக் கடைப்பிடிக்கிறது. நீண்ட எபிரெய வாக்கியத்தை இரண்டு தமிழ் வாக்கியங்களாகப் பிரித்து வாசிப்புத் தெளிவு மேம்படுத்தப்பட்டுள்ளது; தகவல் உறவுகள் மாற்றப்படவில்லை. மூலத்தின் கடினமான இடப்பெயர்/குலப்பெயர் தொடரும், ‘தந்தை’ என்பதன் விரிந்த வம்சப்பட்டியல் பொருளும் அடிக்குறிப்புகளில் திறந்தவையாக வைக்கப்பட்டுள்ளன.
