base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/029.yaml
  text: The name of Abishur’s wife was Abihail, and she bore to him Ahban and Molid.
translation:
  language: ta
  text: அபிசூரின் மனைவியின் பெயர் அபிஹாயில். அவள் அவனுக்கு அக்பானையும் மோலீதையும் பெற்றாள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲבִישׁוּר
  choice: அபிசூர்
  rationale: எபிரேயப் பெயரின் ஒலிப்பைத் தமிழில் இயல்பாகப் பிரதிபலிக்கும் எழுத்துப்பெயர்ப்பு.
- source_word: אֲבִיהָיִל
  choice: அபியாயில்
  rationale: மசோரா உரையின் பெயர் வடிவத்தை ஒட்டி செய்யப்பட்ட எழுத்துப்பெயர்ப்பு.
- source_word: אַחְבָּן
  choice: அக்பான்
  rationale: חְבּ ஒலித்தொடரைத் தமிழில் நெருக்கமாகக் காட்டும் எழுத்துப்பெயர்ப்பு.
- source_word: מוֹלִיד
  choice: மோலீது
  rationale: எபிரேயப் பெயரின் நீண்ட உயிரொலிகளைப் பேணும் தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: וַתֵּלֶד לוֹ
  choice: அவள் அவனுக்கு … பெற்றாள்
  rationale: வினையின் பெண்பால் எழுவாயையும் לוֹ என்பதிலுள்ள ‘அவனுக்கு’ என்ற உறவையும் வெளிப்படையாகப் பேணுகிறது.
