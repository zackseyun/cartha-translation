id: 1CH.2.50
reference: 1 Chronicles 2:50
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: אֵ֤לֶּה הָיוּ֙ בְּנֵ֣י כָלֵ֔ב בֶּן ח֖וּר בְּכ֣וֹר אֶפְרָ֑תָה שׁוֹבָ֕ל אֲבִ֖י קִרְיַ֥ת יְעָרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/050.yaml
  text: 'These were the sons of Caleb son of Hur[a], the firstborn of Ephrathah: Shobal, father of Kiriath-jearim.'
translation:
  language: ta
  text: 'எப்பிராத்தாவின் முதற்பேறான ஊரின் மகன் காலேபின் மகன்கள் இவர்களாயிருந்தார்கள்: கீரியாத்-யெயாரீமின் தந்தையான[a] சோபால்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கீரியாத்-யெயாரீமை நிறுவியவர்” அல்லது “கீரியாத்-யெயாரீமின் மூதாதை.” வம்சவரலாற்றுச் சூழல்களில் “தந்தை” என்பதற்கான எபிரெயச் சொல், ஒரு குலத்தின் அல்லது குடியிருப்பின் நிறுவுநரையோ மூதாதையையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה הָיוּ
  choice: இவர்கள்
  rationale: வம்சவரலாற்றுக் குறிப்பை அறிமுகப்படுத்தும் எபிரெயச் சொற்றொடரை இயல்பான நவீனத் தமிழில் சுருக்கமாகக் கொடுக்கிறது; பட்டியல் தொடர்வதால் தனியே ‘இருந்தார்கள்’ என்பது தேவையில்லை.
- source_word: בְּנֵי כָלֵב
  choice: காலேபின் மகன்கள்
  rationale: בְּנֵי என்பதன் நேரடிப் பொருளான ‘மகன்கள்’ என்பதைக் காக்கிறது; இங்கு ‘வழித்தோன்றல்கள்’ என்று விரிவுபடுத்தத் தெளிவான கட்டாயம் இல்லை.
- source_word: בֶּן חוּר
  choice: ஊரின் மகன்
  rationale: வம்சவரலாற்றுச் சுருக்கம் இருக்கக்கூடும் என்றாலும், எபிரெய உரையின் ‘மகன்’ என்ற உறவுமுறையை நேரடியாகப் பாதுகாக்கிறது.
- source_word: בְּכוֹר אֶפְרָתָה
  choice: எப்பிராத்தாவின் முதற்பேறான
  rationale: இச்சொற்றொடர் மிக இயல்பாக ‘ஊர்’ என்பதையே விளக்குகிறது; ஆகவே எப்பிராத்தாவின் முதற்பேறானவர் ஊர் என்ற தொடரமைப்பு காக்கப்பட்டுள்ளது.
- source_word: שׁוֹבָל
  choice: சோபால்
  rationale: எபிரெய தனிப்பெயரின் தமிழொலிபெயர்ப்பு.
- source_word: אֲבִי
  choice: தந்தையான
  rationale: மூலத்தின் ‘தந்தை’ என்ற உருவகத்தை முதன்மை உரையில் காக்கிறது; குடியிருப்பை நிறுவியவர் அல்லது அதன் குலமூதாதை என்ற பொருள் இருக்கலாம் என்பதைக் குறிப்பில் தெரிவிக்கிறது.
- source_word: קִרְיַת יְעָרִים
  choice: கீரியாத்-யெயாரீம்
  rationale: இது ஓர் இடப்பெயர் என்பதால் பொருளாக்காமல் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: בְּכוֹר אֶפְרָתָה என்ற சொற்றொடரின் தொடர்பு
  choice: ‘எப்பிராத்தாவின் முதற்பேறான’ என்பது ஊரைக் குறிக்கிறது
  alternative: அது காலேபைக் குறிக்கிறது என்று வாசித்தல்
  rationale: எபிரெயச் சொல் வரிசையும் அண்மைத்தொடர்பும் ‘ஊர், எப்பிராத்தாவின் முதற்பேறு’ என்ற வாசிப்பை ஆதரிக்கின்றன; உரையில் இல்லாத இறையியல் விளக்கம் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன தரத்தமிழில், வம்சவரலாற்றுக்குரிய சுருக்கத்தையும் கண்ணியமான நடையையும் காக்கிறது. தனிப்பெயர்கள் எபிரெய ஒலிப்புக்கு அண்மையாகத் தமிழாக்கப்பட்டுள்ளன; ‘தந்தை’ என்ற மூலமொழி உருவகத்தின் பொருள் வேறுபாடுகள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.
