  variant: modern standard Tamil
source:
  edition: WLC
  text: וּ/שְׂג֖וּב הוֹלִ֣יד אֶת יָאִ֑יר וַֽ/יְהִי ל֗/וֹ עֶשְׂרִ֤ים וְ/שָׁלוֹשׁ֙ עָרִ֔ים בְּ/אֶ֖רֶץ הַ/גִּלְעָֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/022.yaml
  text: Segub fathered Jair, and he had twenty-three cities in the land of Gilead.
translation:
  language: ta
  text: செகூபு யாயீரைப் பெற்றான்; யாயீருக்குக் கிலேயாத் நாட்டில் இருபத்து மூன்று நகரங்கள் இருந்தன.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּשְׂגוּב
  choice: செகூபு
  rationale: தனிப்பெயர் நவீனத் தமிழ் ஒலிபெயர்ப்பு மரபுக்கு ஏற்ப வழங்கப்பட்டுள்ளது; முன்னொட்டு வாவ், தமிழில் இயல்பான வாக்கியத் தொடக்கத்திற்காகத் தனியே மொழிபெயர்க்கப்படவில்லை.
- source_word: הוֹלִיד
  choice: பெற்றான்
  rationale: யָלַד என்பதன் ஹிபீல் வடிவம் வம்சவரலாற்றுச் சூழலில் ஒருவன் மற்றொருவனுக்குத் தந்தையானதைக் குறிக்கிறது. ‘பெற்றான்’ என்பது தமிழில் இயல்பாகவும் சுருக்கமாகவும் அந்த வம்சவழிப் பொருளைத் தருகிறது.
- source_word: יָאִיר
  choice: யாயீர்
  rationale: எபிரெயத் தனிப்பெயரின் ஒலிப்பை நெருக்கமாகக் காக்கும் தமிழ் ஒலிபெயர்ப்பு.
- source_word: וַיְהִי לוֹ
  choice: யாயீருக்கு ... இருந்தன
  rationale: היה + ל உடைமையைக் குறிக்கும் எபிரெய மொழிமரபாகும். வினையின் ஒருமை ஆண்பால் வடிவமும் அருகிலுள்ள ‘யாயீர்’ என்பதும் காரணமாக ‘அவனுக்கு’ என்பது யாயீரைக் குறிக்கிறது என்பதைத் தெளிவாக வெளிப்படுத்தப் பெயர் மீண்டும் வழங்கப்பட்டுள்ளது.
- source_word: עֶשְׂרִים וְשָׁלוֹשׁ
  choice: இருபத்து மூன்று
  rationale: எபிரெய எண்ணிக்கையை நவீனத் தமிழின் இயல்பான எண்ணுருவில் வழங்குகிறது.
- source_word: עָרִים
  choice: நகரங்கள்
  rationale: עִיר என்பது நகரம் அல்லது ஊர் எனப் பொருள்படலாம்; இங்குள்ள நிலப்பகுதி சார்ந்த குறிப்பில் ‘நகரங்கள்’ என்பது மரபானதும் பொருத்தமானதும் ஆகும்.
- source_word: בְּאֶרֶץ הַגִּלְעָד
  choice: கிலேயாத் நாட்டில்
  rationale: אֶרֶץ இங்கு கிலேயாதின் நிலம் அல்லது பிரதேசத்தைக் குறிக்கிறது; ‘நாட்டில்’ என்பது முழுச் சொற்றொடரின் புவியியல் பொருளை இயல்பான தமிழில் காக்கிறது.
theological_decisions:
- issue: וַיְהִי לוֹ என்பதில் ‘அவனுக்கு’ குறிக்கும் நபர்
  choice: யாயீர்
  alternative: செகூபு
  rationale: எபிரெய வினை ஒருமை ஆண்பாலில் இருப்பதாலும், மிக அருகிலுள்ள ஆண்பால் ஒருமைப் பெயர் யாயீர் என்பதாலும், இருபத்து மூன்று நகரங்கள் யாயீருக்குரியவை என எடுத்துக்கொள்ளப்பட்டது; இது 2:23-இன் தொடர்ச்சிக்கும் பொருந்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; வம்சவரலாற்றுக்கேற்ற சுருக்கமான, கண்ணியமான நடை. வாசிப்புத் தெளிவுக்காக இரண்டாம் கூறில் யாயீரின் பெயர் மீண்டும் சொல்லப்பட்டுள்ளது.
