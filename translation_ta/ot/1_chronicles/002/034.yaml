  yaml_path: translation/ot/1_chronicles/002/034.yaml
  text: Sheshan had no sons[a], only daughters. And Sheshan had an Egyptian servant whose name was Jarha.
translation:
  language: ta
  text: ஷேஷானுக்கு மகன்கள் இல்லை; மகள்கள் மட்டுமே இருந்தார்கள். ஷேஷானுக்கு எகிப்திய அடிமை[a] ஒருவன் இருந்தான்; அவன் பெயர் யர்ஹா.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பணியாளர்.’ எபிரெயச் சொல் עֶבֶד அடிமை அல்லது பணியாளரைக் குறிக்கலாம்; இங்கு பிணைக்கப்பட்ட நிலையைத் தெளிவுபடுத்த ‘அடிமை’ என மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָיָה לְשֵׁשָׁן
  choice: ஷேஷானுக்கு … இருந்தார்கள் / இருந்தான்
  rationale: எபிரெய மொழியின் உடைமைக்கான ‘ஒருவருக்கு இருத்தல்’ என்ற சொற்றொடரை இயல்பான தமிழில் ‘ஷேஷானுக்கு … இருந்தார்கள்/இருந்தான்’ என்று வழங்குகிறது.
- source_word: בָּנִים
  choice: மகன்கள்
  rationale: பின்னர் வரும் ‘மகள்கள்’ என்பதுடன் நேரடியாக வேறுபடுத்தப்படுவதால், பொதுவான ‘பிள்ளைகள்’ என்பதற்குப் பதில் ‘மகன்கள்’ தேவை.
- source_word: כִּי אִם
  choice: மட்டுமே
  rationale: மறுப்புக்குப் பின் வரும் இச்சொற்றொடர் ‘அல்லாமல்/மட்டுமே’ என்ற கட்டுப்படுத்தும் பொருளைத் தருகிறது.
- source_word: בָּנוֹת
  choice: மகள்கள்
  rationale: ஆண்–பெண் சந்ததியினருக்கிடையிலான வேறுபாட்டைத் தெளிவாகக் காக்கும் நேரடி இணைச்சொல்.
- source_word: עֶבֶד
  choice: அடிமை
  rationale: இச்சொல் பணியாளையும் அடிமையையும் குறிக்கக்கூடும்; இங்கு அதன் பிணைக்கப்பட்ட கீழ்நிலைச் சமூக நிலையைக் மென்மைப்படுத்தாமல் காட்ட ‘அடிமை’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: מִצְרִי
  choice: எகிப்திய
  rationale: அந்த அடிமையின் இன அல்லது நாட்டுத் தோற்றத்தைக் குறிக்கும் நேரடி தமிழ் வடிவம்.
- source_word: וּשְׁמוֹ
  choice: அவன் பெயர்
  rationale: ‘அவனுடைய பெயர்’ என்ற எபிரெய அமைப்பை இயல்பான, சுருக்கமான தமிழில் வழங்குகிறது.
- source_word: יַרְחָע
  choice: யர்ஹா
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் அண்மையாக எழுத்துப்பெயர்க்கிறது.
