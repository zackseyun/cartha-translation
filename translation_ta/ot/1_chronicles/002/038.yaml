  text: Obed fathered Jehu, and Jehu fathered Azariah.
translation:
  language: ta
  text: ஓபேத் யெகூவைப் பெற்றான்; யெகூ அசரியாவைப் பெற்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עוֹבֵד
  choice: ஓபேத்
  rationale: தனிப்பட்ட நபரின் பெயர்; எபிரெய உச்சரிப்பை அணுகும் வகையில் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: הוֹלִיד
  choice: பெற்றான்
  rationale: வம்சவரலாற்றுச் சூழலில் ஹிப்ஃபில் வடிவம் ஒருவன் மற்றொருவனுக்குத் தந்தையானதைக் குறிக்கிறது. தமிழில் வம்சப்பட்டியல்களுக்கு இயல்பாகவும் சுருக்கமாகவும் உள்ள ஆண்பால் வினைமுற்று பயன்படுத்தப்பட்டது.
- source_word: אֶת
  choice: '[தனியாக மொழிபெயர்க்கப்படவில்லை]'
  rationale: இது நேரடி செயப்படுபொருளைக் குறிக்கும் இலக்கணச் சுட்டி; தமிழின் வேற்றுமை உருபும் வாக்கிய அமைப்பும் அதன் பணியை வெளிப்படுத்துகின்றன.
- source_word: יֵהוּא
  choice: யெகூ
  rationale: தனிப்பட்ட நபரின் பெயர்; எபிரெய வடிவத்தை அடிப்படையாகக் கொண்டு தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: וְ
  choice: ;
  rationale: இரு இணையான வம்சவரலாற்றுக் கூற்றுகளை இணைக்கும் எபிரெய இணைப்பை, இயல்பான தமிழ் நடையில் அரைப்புள்ளி வெளிப்படுத்துகிறது; கூடுதல் கால அல்லது தர்க்க நுணுக்கம் சேர்க்கப்படவில்லை.
- source_word: עֲזַרְיָה
  choice: அசரியா
  rationale: தனிப்பட்ட நபரின் பெயர்; எபிரெய வடிவத்தை அடிப்படையாகக் கொண்டு தமிழில் ஒலிபெயர்க்கப்பட்டது.
