source:
  edition: WLC
  text: וּ/בְנֵ֣י זֶ֗רַח זִ֠מְרִי וְ/אֵיתָ֧ן וְ/הֵימָ֛ן וְ/כַלְכֹּ֥ל וָ/דָ֖רַע כֻּלָּ֥/ם חֲמִשָּֽׁה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/006.yaml
  text: 'And the sons of Zerah: Zimri[a], Ethan, Heman, Kalkol[b], and Dara—five in all.'
translation:
  language: ta
  text: 'சேராவின் மகன்கள்: சிம்ரி, ஏத்தான், ஏமான், கல்கோல், தாரா[a]—மொத்தம் ஐந்து பேர்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு எபிரெய உரை ‘தாரா’ என்று வாசிக்கிறது; இணையான 1 இராஜாக்கள் 4:31-இல் ‘தார்தா’ என்று உள்ளது.
    reason: cross_reference
lexical_decisions:
- source_word: וּבְנֵי זֶרַח
  choice: சேராவின் மகன்கள்
  rationale: בְנֵי என்பது வம்சவரலாற்றுச் சூழலில் இயல்பாக ‘மகன்கள்’ என்று மொழிபெயர்க்கப்படுகிறது. வாக்கியத் தொடக்கத்தில் உள்ள ו பட்டியலின் தொடர்ச்சியைக் குறித்தாலும், தனி வசனமாகத் தமிழில் தேவையற்ற ‘மேலும்’ என்பதைச் சேர்க்காமல் இயல்பாக வழங்கப்பட்டுள்ளது.
- source_word: זִמְרִי
  choice: சிம்ரி
  rationale: எபிரெயத் தனிப்பெயரின் ஒலியைத் தமிழில் நெருக்கமாகப் பிரதிபலிக்கும் ஒலிபெயர்ப்பு.
- source_word: וְאֵיתָן
  choice: ஏத்தான்
  rationale: எபிரெயத் தனிப்பெயரின் தமிழ் ஒலிபெயர்ப்பு; முன்னொட்டு இணைப்புச் சொல் பெயர்ப்பட்டியலின் அமைப்பில் இயல்பாக வெளிப்படுகிறது.
- source_word: וְהֵימָן
  choice: ஏமான்
  rationale: எபிரெயத் தனிப்பெயரைத் தமிழில் இயல்பாக ஒலிபெயர்க்கிறது.
- source_word: וְכַלְכֹּל
  choice: கல்கோல்
  rationale: כַלְכֹּל (Kalkol) என்ற எபிரெயப் பெயரின் மெய்யெழுத்துகளையும் உயிரொலிகளையும் நெருக்கமாகப் பின்பற்றும் தமிழ் ஒலிபெயர்ப்பு.
- source_word: וָדָרַע
  choice: தாரா
  rationale: இவ்வசனத்தின் எபிரெய மசோரா உரை ‘தாரா’ என்று வாசிக்கிறது; 1 இராஜாக்கள் 4:31-இன் இணை இடத்திலுள்ள ‘தார்தா’ என்பதோடு ஒத்திசைக்காமல் இங்குள்ள மூல உரையே பின்பற்றப்பட்டுள்ளது.
- source_word: כֻּלָּם חֲמִשָּׁה
  choice: மொத்தம் ஐந்து பேர்
  rationale: சொல்லுக்குச் சொல் ‘அவர்கள் அனைவரும் ஐந்து’ என்பதன் பொருளை, நபர்களின் எண்ணிக்கையைத் தெரிவிக்கும் இயல்பான நவீனத் தமிழில் வழங்குகிறது.
