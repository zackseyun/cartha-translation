translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. வம்சவரலாற்றுப் பட்டியலின் சுருக்கமான வடிவம் காக்கப்பட்டுள்ளது. ஆங்கில ஆலோசனை உரையில் கால்கோல் மற்றும் தாராவுக்கான அடிக்குறிப்புக் குறிகள் இடம் மாறியிருந்ததால், தமிழில் மூல எபிரெய உரைக்குப் பொருத்தமான ‘தாரா’ குறிப்பு மட்டும் உரிய இடத்தில் வழங்கப்பட்டுள்ளது; ஆங்கில எழுத்துமுறை சார்ந்த ‘Calcol’ மாற்று தமிழுக்கு பொருந்தாததால் சேர்க்கப்படவில்லை.
