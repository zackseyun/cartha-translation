id: 1CH.2.51
reference: 1 Chronicles 2:51
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: שַׂלְמָא֙ אֲבִ֣י בֵֽית לָ֔חֶם חָרֵ֖ף אֲבִ֥י בֵית גָּדֵֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/051.yaml
  text: Salma[a], the father of Bethlehem; Hareph[b], the father of Beth-gader.
translation:
  language: ta
  text: சல்மா[a], பெத்லகேமின் தந்தை; ஹாரேப்[b], பெத்-காதேரின் தந்தை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்குள்ள “தந்தை” என்பது “நிறுவுநர்” அல்லது “முன்னோர்” என்றும் பொருள்படலாம்; வம்சப் பட்டியல்களில் இச்சொல் உடனடி உயிரியல் தந்தையை மட்டுமல்லாமல் ஒரு குலம் அல்லது ஊரின் நிறுவுநரையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: இப்பெயர் சில பெயர் மரபுகளில் “ஹாரிப்” என்றும் வழங்கப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: שַׂלְמָא
  choice: சல்மா
  rationale: எபிரெய தனிப்பெயரின் ஒலிப்பெயர்ப்பு; இறுதியில் உள்ள א எழுத்துக்கு ஏற்ப ‘சல்மா’ என வழங்கப்படுகிறது.
- source_word: אֲבִי
  choice: தந்தை
  rationale: எபிரெயச் சொல்லை நேரடியாகப் பாதுகாக்கிறது; இத்தகைய வம்சப் பட்டியல்களில் இது உயிரியல் தந்தையை மட்டுமல்லாமல் முன்னோர் அல்லது ஒரு குடியிருப்பு/குலத்தின் நிறுவுநரையும் குறிக்கக்கூடும்.
- source_word: בֵית לָחֶם
  choice: பெத்லகேம்
  rationale: தமிழில் நிலைபெற்ற வேதாகம இடப்பெயர் வடிவம் பயன்படுத்தப்படுகிறது.
- source_word: חָרֵף
  choice: ஆரேப்
  rationale: மசோரா உயிர்க்குறிகளுடன் உள்ள חָרֵף என்ற தனிப்பெயரின் தமிழ் ஒலிப்பெயர்ப்பு; தொடக்க ח-க்கு அருகிய தமிழ் வடிவமாக ‘ஆ’வும், இறுதி ף-க்கு ‘ப்’வும் பயன்படுத்தப்பட்டுள்ளன.
- source_word: בֵית גָּדֵר
  choice: பெத்-காதேர்
  rationale: இது ஓர் இடப்பெயராக இருப்பதால், בֵית + גָּדֵר என்ற வடிவம் மொழிபெயர்க்கப்படாமல் ஒலிப்பெயர்க்கப்படுகிறது.
theological_decisions:
- issue: אֲבִי என்பதன் மரபுவழிப் பொருள்
  choice: முதன்மை உரையில் ‘தந்தை’ என்று நேரடியாக வழங்கி, விரிவான பொருளை அடிக்குறிப்பில் குறிப்பிடுதல்
  alternative: ‘நிறுவுநர்’ அல்லது ‘முன்னோர்’ என்று முதன்மை உரையிலேயே வழங்குதல்
  rationale: அசல் சொல்லின் திட்டமிட்ட பரந்த பொருளையும் வம்சாவளிசார் தெளிவின்மையையும் முன்கூட்டியே தீர்மானிக்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் சுருக்கமான வம்சப் பட்டியல் நடையைப் பேணுகிறது. தனிப்பெயர்களும் இடப்பெயர்களும் தமிழில் இயல்பாக ஒலிப்பெயர்க்கப்பட்டுள்ளன; אֲבִי என்பதின் உண்மையான பொருள் விரிவு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
