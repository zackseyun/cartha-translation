base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/035.yaml
  text: Sheshan gave his daughter to Jarha his servant as a wife[a], and she bore Attai to him.
translation:
  language: ta
  text: சேசான் தன் மகளைத் தன் அடிமையான யர்காவுக்கு மனைவியாகக் கொடுத்தான்; அவள் அவனுக்கு அத்தாயைப் பெற்றெடுத்தாள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: கொடுத்தான்
  rationale: נתן என்பதன் நேர்ப்பொருள் ‘கொடுத்தான்.’ திருமணச் சூழலை ‘மனைவியாக’ என்ற தொடரே தெளிவுபடுத்துவதால், வினையை விரித்துரைக்கத் தேவையில்லை.
- source_word: שֵׁשָׁן
  choice: சேசான்
  rationale: எபிரெய தனிப்பெயரின் ஒலியை நவீனத் தமிழில் இயல்பாக எழுத்துப்பெயர்த்த வடிவம்.
- source_word: בִּתּוֹ
  choice: தன் மகளை
  rationale: மூன்றாம் நபர் ஆண்பால் ஒருமை உடைமை விகுதியைத் தமிழில் இயல்பாகக் காட்டுகிறது; எழுவாயையே சுட்டுவதால் ‘தன்’ பயன்படுத்தப்பட்டது.
- source_word: לְיַרְחָע
  choice: யர்காவுக்கு
  rationale: לְ பெறுநரைக் குறிக்கிறது; יַרְחָע என்ற தனிப்பெயர் தமிழில் ஒலிப்பெயர்க்கப்பட்டது.
- source_word: עַבְדּוֹ
  choice: தன் அடிமையான
  rationale: עֶבֶד என்பது ‘பணியாள்’ அல்லது ‘அடிமை’ என இருவகையில் பொருள்படலாம். சேசானின் வீட்டுக்குள் யர்காவின் சார்புநிலையை இவ்வம்சம் வலியுறுத்துவதால் ‘அடிமை’ முதன்மை மொழிபெயர்ப்பாகத் தேர்ந்தெடுக்கப்பட்டது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לְאִשָּׁה
  choice: மனைவியாக
  rationale: ‘மனைவியாக/மனைவியாய்’ என்ற வழக்கமான திருமணப் பொருளைச் சுருக்கமாகவும் தெளிவாகவும் தருகிறது.
- source_word: וַתֵּלֶד
  choice: பெற்றெடுத்தாள்
  rationale: பெண் எழுவாயுடன் வரும் ילד வினையின் ‘பெற்றாள்/பெற்றெடுத்தாள்’ என்ற பிறப்புப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: לוֹ
  choice: அவனுக்கு
  rationale: பிறப்பு மரபுத்தொடரில் தந்தையுடனான உறவைக் குறிக்கும் לְ விகுதியை நேராகப் பிரதிபலிக்கிறது.
- source_word: עַתָּי
  choice: அத்தாய்
  rationale: எபிரெய தனிப்பெயரை அதன் மெய்யொலி மற்றும் இறுதி இரட்டை உயிரொலியைப் பேணித் தமிழில் எழுத்துப்பெயர்த்த வடிவம்.
