base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/020.yaml
  text: Hur fathered Uri, and Uri fathered Bezalel.
translation:
  language: ta
  text: ஊர் ஊரியைப் பெற்றான்; ஊரி பெசலெயேலைப் பெற்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חוּר
  choice: ஊர்
  rationale: தனிப்பட்ட நபரின் பெயர்; எபிரெய ஒலிப்புக்கு நெருக்கமான, தமிழில் வழக்கிலுள்ள வடிவில் ஒலிபெயர்க்கப்பட்டது.
- source_word: הוֹלִיד
  choice: பெற்றான்
  rationale: ילד என்பதன் ஹிபீல் வடிவம் வம்சவரலாற்றுச் சூழலில் ஒருவன் மற்றொருவனுக்குத் தந்தையானதைக் குறிக்கிறது. ‘பெற்றான்’ என்பது தமிழில் வம்சப்பட்டியல்களுக்கு இயல்பானதும் சுருக்கமானதும் ஆகும்.
- source_word: אֶת
  choice: '[தனியாக மொழிபெயர்க்கப்படவில்லை]'
  rationale: இது நேரடிச் செயப்படுபொருளைக் குறிக்கும் இலக்கணச் சுட்டி; தமிழில் ‘-ஐ’ வேற்றுமை உருபால் அதன் பணி வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: אוּרִי
  choice: ஊரி
  rationale: தனிப்பட்ட நபரின் பெயர்; மொழிபெயர்க்காமல் ஒலிபெயர்க்கப்பட்டது.
- source_word: וְ
  choice: ;
  rationale: இரண்டு தொடர்ச்சியான வம்சவரலாற்றுக் கூற்றுகளை இணைக்கும் எபிரெய இணைப்புச் சொல், தமிழில் இயல்பான வாக்கிய ஓட்டத்திற்காக அரைப்புள்ளியால் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: בְּצַלְאֵל
  choice: பெசலெயேல்
  rationale: தனிப்பட்ட நபரின் பெயர்; எபிரெய வடிவை அடிப்படையாகக் கொண்டு தமிழில் ஒலிபெயர்க்கப்பட்டது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், வம்சப்பட்டியலுக்கேற்ற சுருக்கமான மற்றும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பெற்றான்’ இங்கு ஆண் வம்சத் தொடர்பில் ‘தந்தையானான்’ என்ற பொருளைக் கொண்டுள்ளது.
