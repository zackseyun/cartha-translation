base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/054.yaml
  text: 'The sons of Salma: Bethlehem[a], the Netophathites, Atroth-beth-joab, half of the Manahathites[b], the Zorites.'
translation:
  language: ta
  text: 'சல்மாவின் வழிவந்தவர்கள்: பெத்லெகேம், நெத்தோபாத்தியர், அத்ரோத்-பெத்-யோவாப், மனாகாத்தியரில் பாதியினர்[a], சோராத்தியர்[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மெனுகோத்தியரில் பாதியினர்.” இந்த எபிரெய இனப்பெயர் எந்த இடப்பெயரோடு தொடர்புடையது என்பது உறுதியாகத் தெரியவில்லை.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “சாராத்தியர்”; அதாவது, சோராவோடு தொடர்புடைய மக்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: வழிவந்தவர்கள்
  rationale: இந்த வம்சப்பட்டியலில் இச்சொல் உடனடிப் புதல்வர்களை மட்டும் அல்லாமல் வழிவந்த குலங்களையும் குடியிருப்புக் குழுக்களையும் குறிக்கக்கூடும்; எனவே இயல்பான தமிழில் அதன் பரந்த பொருள் தரப்பட்டுள்ளது.
- source_word: שַׂלְמָא
  choice: சல்மா
  rationale: எபிரெய மெய்யெழுத்து வடிவத்தைப் பின்பற்றிய பெயரெழுத்தாக்கம்.
- source_word: בֵּית לֶחֶם
  choice: பெத்லெகேம்
  rationale: நன்கு அறியப்பட்ட இடப்பெயர்; இப்பட்டியலில் அந்த இடத்தோடு தொடர்புடைய குலத்தையும் குறிக்கக்கூடும்.
- source_word: וּנְטוֹפָתִי
  choice: நெத்தோபாத்தியர்
  rationale: குடியினர் அல்லது குலத்தாரைக் குறிக்கும் எபிரெய இனப்பெயர் வடிவத்தைத் தமிழில் பன்மைக் குழுப்பெயராகத் தருகிறது.
- source_word: עַטְרוֹת בֵּית יוֹאָב
  choice: அத்ரோத்-பெத்-யோவாப்
  rationale: சொற்களின் தனிப்பொருளை மொழிபெயர்ப்பதைவிட, வம்சப்பட்டியல் சூழலுக்கேற்ற கூட்டு இடப்பெயர் அல்லது குலப்பெயராகப் பெயரெழுத்தாக்கப்பட்டுள்ளது.
- source_word: וַחֲצִי
  choice: பாதிப்பேர்
  rationale: ஒரு குழுவின் பாதிப் பகுதியைக் குறிக்கும் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הַמָּנַחְתִּי
  choice: மனாகாத்தியர்
  rationale: மனாகாத் என்ற இடம் அல்லது குலத்தோடு தொடர்புடைய மக்களைக் குறிக்கும் இனப்பெயராகப் பெயரெழுத்தாக்கப்பட்டுள்ளது; துல்லியமான இடப்பெயர்த் தொடர்பு உறுதியற்றதால் மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: הַצָּרְעִי
  choice: சோராத்தியர்
  rationale: சோரா என்ற இடத்தோடு தொடர்புடைய மக்களைக் குறிக்கும் இனப்பெயராகத் தரப்பட்டுள்ளது.
