translation_notes:
  register: நவீன செந்தமிழ் நடையில், வம்சப்பட்டியலின் சுருக்கத்தையும் பெயர்ப் பட்டியல் அமைப்பையும் காத்துள்ளது. இடங்களும் குலங்களும் கலந்திருக்கக்கூடிய மூலத்தின் இயல்பைத் தெளிவாக்கிவிடாமல், ‘வழிவந்தவர்கள்’ என்ற பரந்த சொல்லும் தொடர்ச்சியான பட்டியல் நிறுத்தக்குறிகளும் பயன்படுத்தப்பட்டுள்ளன. ஆலோசனை ஆங்கிலத்தில் அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்களோடு பொருந்தாமல் இருந்ததால், மூலத் தகவலின் அடிப்படையில் [a] மனாகாத்தியருக்கும் [b] சோராத்தியருக்கும் இணைக்கப்பட்டுள்ளன.
