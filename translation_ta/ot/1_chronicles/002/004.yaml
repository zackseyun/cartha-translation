base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/004.yaml
  text: Tamar[a], his daughter-in-law, bore Perez and Zerah to him[b]. All the sons of Judah were five.
translation:
  language: ta
  text: அவனுடைய மருமகளான தாமார், அவனுக்குப் பேரேஸ்[b] மற்றும் சேராவைப் பெற்றெடுத்தாள். யூதாவின் மகன்கள் மொத்தம் ஐந்து பேர்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “யூதாவின் மகன்கள் மொத்தம் ஐந்து பேர்” என்பது, முன்பு குறிப்பிடப்பட்ட மகன்களுடன் பேரேஸையும் சேராவையும் சேர்த்து மொத்த எண்ணிக்கையைச் சுருக்கமாகக் கூறும் எபிரெய வாக்கியம்.
    reason: cross_reference
  - marker: b
    text: “பேரேஸ்” என்ற பெயர், எபிரெய ஒலிப்பை இன்னும் நெருக்கமாகப் பின்பற்றும் எழுத்துப்பெயர்ப்பு முறைகளில் “பெரெத்ஸ்” என்றும் எழுதப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָמָר
  choice: தாமார்
  rationale: எபிரெயத் தனிப்பெயரின் ஒலிப்பைத் தமிழில் இயல்பாக எழுத்துப்பெயர்த்துள்ளது.
- source_word: כַּלָּתוֹ
  choice: அவனுடைய மருமகள்
  rationale: כַּלָּה இச்சூழலில் மகனின் மனைவியை, அதாவது மருமகளை, குறிக்கிறது; இது இயல்பான நவீனத் தமிழ்க் குடும்ப உறவுச் சொல்.
- source_word: יָלְדָה
  choice: பெற்றெடுத்தாள்
  rationale: ילד என்பதன் பெண்பால் வினை வடிவம் குழந்தை பெற்றெடுத்தலைக் குறிக்கிறது; வம்சவரலாற்று நடைக்கு ஏற்ற தெளிவான சொல்.
- source_word: לוֹ
  choice: அவனுக்கு
  rationale: לְ என்னும் முன்னொட்டும் ஆண்பால் ஒருமை பின்னொட்டும் யூதாவுடனான தந்தை உறவைக் குறிக்கின்றன; மூலத்தின் உறவுக் கட்டமைப்பைத் தக்கவைக்கிறது.
- source_word: פֶּרֶץ
  choice: பேரேஸ்
  rationale: எபிரெயத் தனிப்பெயரின் வழக்கமான வேதாகம ஒலிப்பெயர்ப்புக்கு நெருக்கமான தமிழ் வடிவம்.
- source_word: זָרַח
  choice: சேரா
  rationale: எபிரெயத் தனிப்பெயரை அதன் ஒலிப்புக்கு நெருக்கமாகத் தமிழில் எழுத்துப்பெயர்த்துள்ளது.
- source_word: כָּל בְּנֵי יְהוּדָה
  choice: யூதாவின் மகன்கள் மொத்தம்
  rationale: בְּנֵי என்பதன் ஆண்பால் சந்ததிப் பொருளான ‘மகன்கள்’ என்பதையும் כָּל என்பதன் மொத்தக் கணக்குப் பொருளையும் தெளிவாகத் தக்கவைக்கிறது.
- source_word: חֲמִשָּׁה
  choice: ஐந்து பேர்
  rationale: யூதாவின் மகன்களின் மொத்த எண்ணிக்கையைத் தரும் எண்ணுச் சொல்; மனிதர்களைக் கணக்கிடும் இயல்பான தமிழ் நடை பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: பேரேஸ் மற்றும் சேரா குறிப்பிடப்பட்ட பின்வரும் வம்சவரலாற்றுச் சுருக்கம்
  choice: “யூதாவின் மகன்கள் மொத்தம் ஐந்து பேர்” என்று நேரடியாக மொத்த எண்ணிக்கையாக மொழிபெயர்த்தல்
  alternative: “இவர்களே யூதாவின் மகன்கள்; அவர்கள் ஐந்து பேர்”
  rationale: எபிரெய வாக்கியம் எளிய வம்சவரலாற்றுக் கணக்குச் சுருக்கமாகும். வெளிப்படையாகத் தரப்பட்டுள்ள மொத்த எண்ணிக்கையை மொழிபெயர்ப்பு தக்கவைக்கிறது.
- issue: பாலினமும் குடும்ப உறவும் குறிக்கும் சொற்கள்
  choice: “மருமகள்” மற்றும் “மகன்கள்” என்பவற்றைத் தக்கவைத்தல்
  alternative: “திருமண உறவினர்” மற்றும் “பிள்ளைகள்”
  rationale: மூலம் குறிப்பிட்ட குடும்ப உறவையும் ஆண் சந்ததியரையும் வெளிப்படையாகக் குறிக்கிறது; பொதுப்பாலாக்குவது அந்தத் துல்லியத்தைக் குறைக்கும்.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான வம்சவரலாற்று நடை பயன்படுத்தப்பட்டுள்ளது. ஆங்கில ஆலோசனை உரையில் அடிக்குறிப்பு குறியீடுகள் விளக்கப்படும் சொற்றொடர்களுடன் பொருந்தாமல் இருந்ததால், [a] மொத்த எண்ணிக்கைக் கூற்றின் பின்னரும் [b] பேரேஸ் என்ற பெயரின் பின்னரும் பொருத்தப்பட்டுள்ளன.
