source:
  edition: WLC
  text: וּ/מִשְׁפְּח֤וֹת סֹפְרִים֙ ישבו יַעְבֵּ֔ץ תִּרְעָתִ֥ים שִׁמְעָתִ֖ים שׂוּכָתִ֑ים הֵ֚מָּה הַ/קִּינִ֣ים הַ/בָּאִ֔ים מֵ/חַמַּ֖ת אֲבִ֥י בֵית רֵכָֽב־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/055.yaml
  text: 'and the families of the scribes who lived at Jabez: the Tirathites[a], the Shimeathites, and the Sucathites. These are the Kenites who came from Hammath, the father of the house of Rechab.'
translation:
  language: ta
  text: 'மேலும், யாபேசில் குடியிருந்த எழுத்தர்களின் குடும்பங்கள்: திராத்தியர், சிமெயாத்தியர், சூகாத்தியர். இவர்கள் ரேகாபின் குடும்பத்துக்குத் தந்தையான[a] ஹம்மாத்திலிருந்து வந்த கேனியர்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ரேகாபின் குடும்பத்தின் மூதாதையான” அல்லது “ரேகாபின் குடும்பத்தைத் தோற்றுவித்தவரான.” வம்சப் பட்டியல் சூழல்களில் “தந்தை” என்பதற்கான எபிரெயச் சொல் ஒரு மூதாதையையோ குடும்பத்தை நிறுவியவரையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִשְׁפְּחוֹת סֹפְרִים
  choice: மேலும், எழுத்தர்களின் குடும்பங்கள்
  rationale: வம்சப் பட்டியலின் தொடர்ச்சியைக் காட்ட வாவ் இணைப்பை ‘மேலும்’ என்று தக்கவைத்து, סֹפְרִים என்பதன் எழுதுதல் மற்றும் பதிவுப் பணியுடன் தொடர்புடைய பொதுவான பொருளை ‘எழுத்தர்கள்’ என வழங்குகிறது.
- source_word: ישבו יַעְבֵּץ
  choice: யாபேசில் வாழ்ந்த
  rationale: ישבו என்பது பன்மை வினை; யாபேஸ் அவர்கள் வாழ்ந்த இடம் என்பதை இயல்பான தமிழ் தொடர்பெயரெச்சத் தொடரால் வெளிப்படுத்துகிறது.
- source_word: תִּרְעָתִים שִׁמְעָתִים שׂוּכָתִים
  choice: திராத்தியர், சிமெயாத்தியர், சூகாத்தியர்
  rationale: இவை இன அல்லது குலக் குழுக்களைக் குறிக்கும் பெயர்கள் என்பதால் தமிழில் ஒலிபெயர்க்கப்பட்டு, குழுவைக் குறிக்கும் ‘-யர்’ விகுதி சேர்க்கப்பட்டுள்ளது.
- source_word: הֵמָּה הַקִּינִים
  choice: இவர்கள் ... கேனியர்
  rationale: הֵמָּה தரும் அடையாளப்படுத்தும் வலியுறுத்தலை ‘இவர்கள்’ எனவும், குலப் பெயரை ‘கேனியர்’ எனவும் வழங்குகிறது.
- source_word: הַבָּאִים מֵחַמַּת
  choice: அம்மாத்திலிருந்து வந்த
  rationale: מן உடனான participle பிறப்பிடம், வழித்தோன்றல் அல்லது வந்த இடம் ஆகியவற்றைக் குறிக்கக்கூடும்; ‘இலிருந்து வந்த’ என்பது அந்தத் தெளிவின்மையைத் தீர்மானிக்காமல் காக்கிறது.
- source_word: אֲבִי בֵית רֵכָב
  choice: ரேகாபின் குடும்பத்துக்குத் தந்தையான
  rationale: אָב என்பதன் நேரடியான ‘தந்தை’ என்ற உருவகத்தைத் தக்கவைக்கிறது; בֵית என்பதைக் குடும்பம் அல்லது வம்சம் என்ற சூழல்சார் பொருளில் இயல்பான தமிழாக வழங்குகிறது.
theological_decisions:
- issue: அம்மாத் என்பவர் ரேகாபின் குடும்பத்துடன் கொண்ட உறவு
  choice: ‘தந்தை’ என்ற எபிரெய உருவகத்தை முதன்மை உரையில் தக்கவைத்தல்
  alternative: ‘மூதாதை’ அல்லது ‘குடும்பத்தைத் தோற்றுவித்தவர்’ என்று வெளிப்படையாக விளக்குதல்
  rationale: வம்சச் சூழலில் אָב என்பது உயிரியல் தந்தை மட்டுமன்றி மூதாதை அல்லது நிறுவனர் என்பதையும் குறிக்கலாம். முதன்மை உரை இந்தப் பொருள் விரிவைச் சுருக்காமல் வைத்திருக்கிறது; அடிக்குறிப்பு மாற்றுப் புரிதல்களை அளிக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், வம்சப் பட்டியலுக்கேற்ற கண்ணியமான நடையும் தெளிவான வாக்கிய அமைப்பும் பயன்படுத்தப்பட்டுள்ளன. அரிதான குலப்பெயர்கள் ஒலிபெயர்க்கப்பட்டுள்ளன; ‘வீடு’ என்ற சொற்சொல் மொழிபெயர்ப்புக்குப் பதிலாக இச்சூழலில் இயல்பான ‘குடும்பம்’ பயன்படுத்தப்பட்டுள்ளது.
