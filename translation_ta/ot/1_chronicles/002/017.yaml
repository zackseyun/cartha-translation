  text: וַ/אֲבִיגַ֕יִל יָלְדָ֖ה אֶת עֲמָשָׂ֑א וַ/אֲבִ֣י עֲמָשָׂ֔א יֶ֖תֶר הַ/יִּשְׁמְעֵאלִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/017.yaml
  text: Abigail bore Amasa[a], and the father of Amasa was Jether the Ishmaelite.
translation:
  language: ta
  text: அபிகாயில் அமாசாவைப் பெற்றெடுத்தாள்.[a] அமாசாவின் தந்தை இஸ்மவேலியனான யெத்தேர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளும் 2 சாமுவேல் 17:25-இல் உள்ள இணைப் பகுதியும், ‘இஸ்மவேலியனான யெத்தேர்’ என்பதற்குப் பதிலாக ‘இஸ்ரவேலியனான இத்ரா’ என்று வாசிக்கின்றன. இங்கே மசோரெட்டிக் உரை ‘இஸ்மவேலியனான யெத்தேர்’ என்று வாசிக்கிறது.
    reason: textual_variant
lexical_decisions:
- source_word: יָלְדָה
  choice: பெற்றெடுத்தாள்
  rationale: பெண் எழுவாயுடன் வரும் Qal வடிவம் ‘பெற்றாள்/பெற்றெடுத்தாள்’ என்று பொருள்படும்; வம்சவரலாற்றுச் சூழலில் தாய்மையைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: אֶת עֲמָשָׂא
  choice: அமாசாவை
  rationale: אֶת நேரடி செயப்படுபொருளைக் குறிக்கிறது; தமிழில் இரண்டாம் வேற்றுமை உருபான ‘-ஐ’ பெயருடன் இணைக்கப்பட்டுள்ளது.
- source_word: וַאֲבִי עֲמָשָׂא
  choice: அமாசாவின் தந்தை
  rationale: எபிரெயக் கட்டுநிலைத் தொடரான ‘அமாசாவின் தந்தை’ என்பதை இயல்பான தமிழ் உடைமைத் தொடராக வழங்குகிறது.
- source_word: יֶתֶר
  choice: எத்தேர்
  rationale: எபிரெயத் தனிப்பெயரின் ஒலியை நெருக்கமாகக் காட்டும் தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: הַיִּשְׁמְעֵאלִי
  choice: இஸ்மவேலியனான
  rationale: குறிப்பிட்ட இன அடையாளமாக வரும் சொல்லையும் அதன் சுட்டு உருபையும், தமிழில் நபரை அடையாளப்படுத்தும் இயல்பான பெயரடை வடிவில் வழங்குகிறது.
