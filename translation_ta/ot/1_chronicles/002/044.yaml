  text: Shema fathered Raham[a], the father of Jorkeam; and Rekem fathered Shammai.
translation:
  language: ta
  text: சேமா ராகாமைப் பெற்றான்; ராகாம் யொர்க்கேயாமின் தந்தை[a]. ரேக்கேம் சம்மாயைப் பெற்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யொர்க்கேயாமின் நிறுவனர் அல்லது மூதாதை.” இங்குள்ள “தந்தை” என்ற எபிரெயச் சொல், குறிப்பாகக் குலங்கள் அல்லது குடியிருப்புகளோடு தொடர்புடைய வம்சவரலாறுகளில், நிறுவனர் அல்லது மூதாதையைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹלִיד
  choice: பெற்றான்
  rationale: வம்சவரலாற்றுச் சூழலில் ஹிப்ஃபில் வடிவம் ஒருவன் இன்னொருவனுக்குத் தந்தையானதைக் குறிக்கிறது. ‘பெற்றான்’ என்பது தமிழில் சுருக்கமான, இயல்பான வம்சவரலாற்றுச் சொல்லாக்கம்.
- source_word: אֲבִי
  choice: தந்தை
  rationale: எபிரெயச் சொற்றொடரின் வெளிப்படையான வடிவத்தைப் பேணுகிறது. இது ஓர் ஊர் அல்லது குலத்தின் நிறுவனர்/மூதாதையையும் குறிக்கக்கூடும் என்பதால் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: שֶׁמַע
  choice: சேமா
  rationale: எபிரெயப் பெயரின் ஒலிபெயர்ப்பு.
- source_word: רַחַם
  choice: ராகாம்
  rationale: எபிரெயப் பெயரின் ஒலிபெயர்ப்பு.
- source_word: יָרְקֳעָם
  choice: யொர்க்கேயாம்
  rationale: இது நபர் அல்லது இடப் பெயராக இருக்கக்கூடிய தனிப்பெயர்; எபிரெய வடிவத்திற்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டது.
- source_word: רֶקֶם
  choice: ரேக்கேம்
  rationale: எபிரெயப் பெயரின் ஒலிபெயர்ப்பு.
- source_word: שַׁמָּי
  choice: சம்மாய்
  rationale: எபிரெயப் பெயரின் ஒலிபெயர்ப்பு; தொடக்க மெய்யின் இரட்டிப்பைத் தமிழ் வடிவம் பிரதிபலிக்கிறது.
