lexical_decisions:
- source_word: וּ/בְנֵי
  choice: மகன்கள்
  rationale: בְנֵי என்பது ‘மகன்கள்’ என்ற பன்மை இணைப்புநிலை வடிவம். ஒரே பெயர் தொடர்ந்து வந்தாலும், எபிரெய உரையின் வம்சவரிசைச் சூத்திரத்தைத் திருத்தாமல் பாதுகாக்கிறது. ו இங்கு பட்டியலின் தொடர்ச்சியைச் சுட்டுகிறது; இயல்பான தமிழ் வம்சப்பட்டியல் நடையில் தனியே ‘மேலும்’ என்று மொழிபெயர்க்க வேண்டியதில்லை.
- source_word: אֵיתָן
