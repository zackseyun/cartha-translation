  text: וְ/אַחַ֗ר בָּ֤א חֶצְרוֹן֙ אֶל בַּת מָכִיר֙ אֲבִ֣י גִלְעָ֔ד וְ/ה֣וּא לְקָחָ֔/הּ וְ/ה֖וּא בֶּן שִׁשִּׁ֣ים שָׁנָ֑ה וַ/תֵּ֥לֶד ל֖/וֹ אֶת שְׂגֽוּב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/021.yaml
  text: Afterward Hezron went in to the daughter of Machir the father of Gilead[a], and he took her when he was sixty years old[c][b], and she bore Segub to him.
translation:
  language: ta
  text: அதன்பின் எஸ்ரோன், கீலேயாத்தின் தந்தையாகிய[a] மாகீரின் மகளுடன் சேர்ந்தான்[b]. அவன் அறுபது வயதாயிருந்தபோது அவளை மனைவியாக ஏற்றுக்கொண்டான்[c]. அவள் அவனுக்கு செகூபைப் பெற்றெடுத்தாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு ‘தந்தை’ என்பது நேரடியான தந்தையையோ, மூதாதையையோ, ஒரு குலம் அல்லது பகுதியின் நிறுவனரையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘சேர்ந்தான்’ என்பதற்கான எபிரெய மரபுத்தொடரை ‘அவளிடம் வந்தான்’ என்றும் மொழிபெயர்க்கலாம்; இச்சூழலில் அது மணவுறவு அல்லது பாலுறவை மறைமுகமாகக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: நேரடியாக, ‘அவளை எடுத்துக்கொண்டான்’; ஒரு பெண்ணைப் பற்றிய இம்மரபுத்தொடர் பொதுவாக அவளை மணந்துகொண்டதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחַר
  choice: அதன்பின்
  rationale: வம்சவரலாற்றில் அடுத்ததாக நிகழ்ந்ததை இயல்பான நவீனத் தமிழில் குறிக்கிறது.
- source_word: בָּא אֶל
  choice: மகளிடம் சேர்ந்தான்
  rationale: பெண்ணுடன் மணவுறவு அல்லது பாலுறவு கொள்வதைக் குறிப்பாக உணர்த்தும் எபிரெய மறைமுகச் சொல்லாட்சியை, மிக வெளிப்படையாகவும் இல்லாமல் வெறும் இடப்பெயர்ச்சியாகவும் இல்லாமல் தமிழில் தருகிறது.
- source_word: בַּת מָכִיר
  choice: மாகீரின் மகள்
  rationale: எபிரெய இணைப்புநிலைத் தொடரை இயல்பான தமிழ் உடைமைத் தொடராக வழங்குகிறது.
- source_word: אֲבִי גִלְעָד
  choice: கீலேயாத்தின் தந்தை
  rationale: אָב என்பதன் நேரடிப் பொருளைத் தக்கவைக்கிறது; வம்சவரலாற்றுச் சூழலில் மூதாதை அல்லது குலத்தலைவன் என்ற சாத்தியத்தைக் குறிப்பில் பதிவு செய்கிறது.
- source_word: לְקָחָהּ
  choice: அவளை மனைவியாக ஏற்றுக்கொண்டான்
  rationale: ஒரு பெண்ணைக் குறித்த לקח என்பதன் வழக்கமான திருமணப் பொருளை இயல்பாக வெளிப்படுத்துகிறது; நேரடியான ‘அவளை எடுத்துக்கொண்டான்’ நவீனத் தமிழில் தெளிவற்றதாகவும் கடினமாகவும் இருக்கும்.
- source_word: וְהוּא בֶּן שִׁשִּׁים שָׁנָה
  choice: அவன் அறுபது வயதாயிருந்தபோது
  rationale: ‘அறுபது ஆண்டுகளின் மகன்’ என்ற எபிரெய வயது மரபுத்தொடரை இயல்பான தமிழில் தருகிறது.
- source_word: וַתֵּלֶד לוֹ
  choice: அவள் அவனுக்கு ... பெற்றெடுத்தாள்
  rationale: לוֹ என்பதிலுள்ள ‘அவனுக்கு’ என்ற கூறைத் தக்கவைத்து, வம்சவரலாற்று நடையில் இயல்பாக அமைகிறது.
- source_word: שְׂגוּב
  choice: செகூப்
  rationale: எபிரெய பெயரான שְׂגוּב (Śəgûḇ) என்பதன் ஒலியைத் தமிழில் அண்மையாக எழுத்துப்பெயர்க்கிறது.
theological_decisions:
- issue: אָבִי גִלְעָד என்பதில் ‘தந்தை’ என்பதன் வம்சவரலாற்றுப் பொருள்
  choice: முதன்மை உரையில் ‘கீலேயாத்தின் தந்தை’
  alternative: ‘கீலேயாத்தின் மூதாதை’ அல்லது ‘கீலேயாத்தின் நிறுவனர்’
  rationale: எபிரெய சொல் உண்மையான தந்தை, மூதாதை, அல்லது ஒரு குலம்/பகுதியின் நிறுவனர் ஆகிய பொருள்களைக் கொள்ளலாம். முதன்மை உரை நேரடிப் பொருளைத் தக்கவைத்து, தீர்மானிக்க முடியாத விரிவான பொருள்களை அடிக்குறிப்பில் அளிக்கிறது.
- issue: בָּא אֶל மற்றும் לְקָחָהּ ஆகியவற்றின் உறவுச் சார்ந்த பொருள்
  choice: ‘சேர்ந்தான்’ என்றும் ‘மனைவியாக ஏற்றுக்கொண்டான்’ என்றும் மொழிபெயர்த்தல்
  alternative: ‘அவளிடம் வந்தான்’ என்றும் ‘அவளை எடுத்துக்கொண்டான்’ என்றும் சொற்சொல்லாக மொழிபெயர்த்தல்
  rationale: சூழல் மண/பாலுறவைக் குறிக்கிறது. தமிழ் வாசகருக்கு இயல்பாகப் புரியுமாறு அதைக் காட்டுகிறது; அதேவேளை ‘சேர்ந்தான்’ என்பதன் மறைமுகத்தன்மை மூலத்தின் நயத்தைக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், வம்சவரலாற்றுக்கேற்ற கண்ணியமான மற்றும் சுருக்கமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘சேர்ந்தான்’ மூலத்தின் மறைமுகமான மண/பாலுறவுச் சொல்லாட்சியைப் பாதுகாக்கிறது; ‘மனைவியாக ஏற்றுக்கொண்டான்’ திருமணப் பொருளைத் தெளிவாக்குகிறது. அனைத்து அடிக்குறிப்பு குறிகளும் உரையில் தொடர்புடைய இடங்களில் இடப்பட்டுள்ளன.
