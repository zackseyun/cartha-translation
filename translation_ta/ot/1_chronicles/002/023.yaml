base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/023.yaml
  text: But Geshur and Aram took the villages of Jair from them[a], along with Kenath and its daughter towns—sixty cities. All these were the sons of Machir[c][b], the father of Gilead.
translation:
  language: ta
  text: மேலும், கேஷூரும் ஆராமும் யாயீரின் கிராமங்களை[a] அவர்களிடமிருந்து கைப்பற்றினர்; கேனாத்தையும் அதைச் சார்ந்த ஊர்களையும்[b] சேர்த்து, மொத்தம் அறுபது நகரங்களைக் கைப்பற்றினர். அவர்கள் அனைவரும் கிலேயாத்தின் தந்தையான மாகீரின் மகன்கள்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஹவ்வோத்-யாயீர்’; இது ‘யாயீரின் கூடாரக் கிராமங்கள்’ என்று பொருள்படும் ஓர் இடப்பெயர்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லர்த்தமாக, ‘அதன் மகள்கள்’; கேனாத்தைச் சார்ந்த சுற்றுப்புறக் குடியிருப்புகளை இது குறிக்கிறது.
    reason: cultural_note
  - marker: c
    text: ‘மாகீரின் மகன்கள்’ என்பது உடனடியான மகன்களை மட்டுமல்லாமல், வழித்தோன்றல்களையோ குலத்தைச் சேர்ந்தவர்களையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: கைப்பற்றின
  rationale: நிலப்பகுதிகளை மற்றவர்களிடமிருந்து எடுத்துக்கொண்ட செயலை இயல்பாகக் குறிக்கிறது; இராணுவத் தாக்குதல் என்ற நுணுக்கத்தைத் தேவையின்றி மிகைப்படுத்தாது. எபிரெயத்தில் கூட்டெழுவாயுடன் ஒருமை வினை வந்தாலும் தமிழில் இயல்பான பன்மை வினை பயன்படுத்தப்பட்டது.
- source_word: גְּשׁוּר וַאֲרָם
  choice: கேசூரும் ஆராமும்
  rationale: எபிரெயப் பெயர்களை நேரடியாக ஒலிபெயர்த்து, ‘சீரியா’ போன்ற பிற்காலப் பெயரைத் தவிர்க்கிறது.
- source_word: חַוֺּת יָאִיר
  choice: யாயீரின் கிராமங்கள்
  rationale: இது ஓர் இடப்பெயராகவும் புரிந்துகொள்ளப்படலாம்; எனினும் அதன் வெளிப்படையான சொல்லர்த்தத்தை வாசிக்க எளிதாக மொழிபெயர்த்து, இடப்பெயர் வாய்ப்பை அடிக்குறிப்பில் வைத்துள்ளது.
- source_word: מֵאִתָּם
  choice: அவர்களிடமிருந்து
  rationale: முன்னர் குறிப்பிடப்பட்டவர்களின் கட்டுப்பாட்டிலிருந்து இவ்விடங்கள் எடுக்கப்பட்டதை நேரடியாகக் காட்டுகிறது; சுட்டப்படுபவர்கள் யார் என்ற மூலத்தின் மறைமுகத்தன்மையைப் பாதுகாக்கிறது.
- source_word: קְנָת
  choice: கேனாத்
  rationale: இடப்பெயரின் எபிரெய ஒலிக்கு நெருக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: בְּנֹתֶיהָ
  choice: அதைச் சார்ந்த ஊர்கள்
  rationale: சொல்லர்த்தமான ‘அதன் மகள்கள்’ என்பது ஒரு முதன்மை நகரத்தைச் சார்ந்த குடியிருப்புகளைக் குறிக்கும் எபிரெய மரபுத்தொடர்; இயல்பான தமிழில் அதன் பொருள் தரப்பட்டுள்ளது.
- source_word: שִׁשִּׁים עִיר
  choice: அறுபது நகரங்கள்
  rationale: עִיר என்பதன் வழக்கமான பொருளைத் தக்கவைத்து மொத்த எண்ணிக்கையைக் குறிப்பிடுகிறது.
- source_word: כָּל אֵלֶּה
  choice: இவர்கள் அனைவரும்
  rationale: தொடர்ந்து வரும் ‘மாகீரின் மகன்கள்’ என்ற வம்சவழிக் கூற்றோடு இயல்பாக இணைகிறது. அதேவேளை, சூழலில் குலத்தாரைக் குறிக்கும் வாய்ப்பு அடுத்த அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: בְּנֵי מָכִיר
  choice: மாகீரின் மகன்கள்
  rationale: எபிரெய வடிவத்தை நேரடியாகப் பாதுகாக்கிறது; இது உடனடியான மகன்களை மட்டுமல்லாமல் வழித்தோன்றல்களையோ குலத்தாரையோ குறிக்கக்கூடும் என்பதை அடிக்குறிப்பு தெரிவிக்கிறது.
- source_word: אֲבִי גִלְעָד
  choice: கிலேயாத்தின் தந்தை
  rationale: ‘தந்தை’ என்ற எபிரெய உறவுமுறையை அப்படியே வைத்துள்ளது; இங்கு கிலேயாத் என்ற நபரின் தந்தை என்பது வம்சவரலாற்றுச் சூழலுக்கு ஏற்றது.
