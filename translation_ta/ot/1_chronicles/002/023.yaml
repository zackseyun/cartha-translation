  rationale: The revision resolves the incomplete enumeration by explicitly making the sixty cities the complete set taken, retains the Hebrew’s broad territorial-taking sense, and changes the connector to a non-adversative narrative continuation. The genealogical wording and all three required footnote anchors are retained; the notes continue to preserve the place-name alternative, the idiom for dependent settlements, and the broad sense of “sons.”
