id: 1CH.2.49
reference: 1 Chronicles 2:49
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/תֵּ֗לֶד שַׁ֚עַף אֲבִ֣י מַדְמַנָּ֔ה אֶת שְׁוָ֛א אֲבִ֥י מַכְבֵּנָ֖ה וַ/אֲבִ֣י גִבְעָ֑א וּ/בַת כָּלֵ֖ב עַכְסָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/049.yaml
  text: Shepha fathered Sheva, the father of Machbenah and the father of Gibea; and Caleb’s daughter was Acsah.
translation:
  language: ta
  text: அவள் மத்மன்னாவின் தந்தையான ஷாஅப்பையும், மக்பேனாவின் தந்தையும் கிபெயாவின் தந்தையுமான ஷெவாவையும் பெற்றெடுத்தாள். காலேபின் மகள் அக்சா.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: அவள் ... பெற்றெடுத்தாள்
  rationale: எபிரெய வினைச்சொல் பெண்பால் ஒருமையில் உள்ளது; அதன் எழுவாய் முந்தைய வசனத்தில் குறிப்பிடப்பட்ட மாக்கா. தமிழில் இயல்பாக இருக்க மறைமுக எழுவாய் ‘அவள்’ வெளிப்படுத்தப்பட்டது.
- source_word: אֲבִי
  choice: தந்தையான / தந்தையும்
  rationale: நேரடியான பொருள் ‘தந்தை’. வம்சப்பட்டியல் சூழலில் இது மூதாதை அல்லது ஓர் ஊரின் நிறுவனர்/தலைவர் என்றும் அமையலாம்; முதன்மை உரையில் மூலத்தின் உறவுமுறைச் சொல்லே பாதுகாக்கப்பட்டது.
- source_word: שַׁעַף
  choice: ஷாஅப்
  rationale: எபிரெய மெய்யெழுத்துகளையும் நடுவிலுள்ள தொண்டையொலியையும் நெருக்கமாகக் காட்டும் பெயரெழுத்தாக்கம்.
- source_word: שְׁוָא
  choice: ஷெவா
  rationale: மசோரா உயிர்க்குறிப்புகளுக்கு ஏற்ப பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: עַכְסָה
  choice: அக்சா
  rationale: எபிரெயப் பெயரின் ஒலிக்கு நெருக்கமான, எளிதில் வாசிக்கக்கூடிய தமிழ் வடிவம்.
theological_decisions:
- issue: וַתֵּלֶד என்ற பெண்பால் வினையின் எழுவாய் மற்றும் ஷாஅப்–ஷெவா உறவு
  choice: முந்தைய வசனத்தின் மாக்காவைக் குறிக்கும் ‘அவள்’ ஷாஅப்பையும் ஷெவாவையும் பெற்றெடுத்தாள் என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘ஷாஅப் ஷெவாவைப் பெற்றான்’ என்று வாசித்தல்.
  rationale: WLC உரையில் வினை பெண்பால் ஒருமையில் இருப்பதுடன், אֵת குறியீடு ஷெவாவை அதே வினையின் இரண்டாம் நேரடிச் செயப்படுபொருளாகக் காட்டுகிறது. ஆகவே ஆங்கில ஆலோசனை உரையிலுள்ள தந்தை–மகன் அமைப்பை விட எபிரெய மூல அமைப்பு பின்பற்றப்பட்டது.
- issue: ‘தந்தை’ என்பதன் வம்சவியல் அல்லது இடப்பெயரியல் பொருள்
  choice: உரையில் ‘தந்தை’ என்ற திறந்த பொருளுள்ள சொல்லை வைத்தல்.
  alternative: ‘நிறுவனர்’, ‘தலைவர்’ அல்லது ‘மூதாதை’ என்று குறிப்பாக்குதல்.
  rationale: மத்மன்னா, மக்பேனா, கிபெயா என்பவை நபர்களையோ குடியிருப்புகளையோ குறிக்கக்கூடும்; மூல உரையின் சுருக்கமும் தெளிவின்மையும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், வம்சப்பட்டியலுக்கேற்ற சுருக்கமான மற்றும் கண்ணியமான நடை. எபிரெய மூலத்தில் உள்ள இணை அமைப்பு தெளிவாகத் தெரிய ‘தந்தையான’ மற்றும் ‘தந்தையும் ... தந்தையுமான’ என்ற வடிவங்கள் பயன்படுத்தப்பட்டன. ஆங்கில POB-இன் ‘Shepha fathered Sheva’ என்ற வாசிப்பு WLC இலக்கணத்துடன் பொருந்தாததால் பின்பற்றப்படவில்லை.
