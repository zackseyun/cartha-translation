base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/031.yaml
  text: 'The sons of Appaim: Ishi[a]; and the sons of Ishi: Sheshan; and the sons of Sheshan: Ahlai.'
translation:
  language: ta
  text: 'அப்பாயீமின் மகன்கள்[a]: யிஷி; யிஷியின் மகன்கள்: சேஷான்; சேஷானின் மகன்கள்: அக்லாய்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு வரும் ஒவ்வொரு ‘மகன்கள்’ என்பதையும் ‘வழித்தோன்றல்கள்’ என்றும் மொழிபெயர்க்கலாம்; எபிரெய בְּנֵי என்ற சொல் வம்சப்பட்டியல்களில் பரந்த மரபுவழி உறவைக் குறிக்கக்கூடும். எனினும், இங்கு ‘மகன்கள்’ என்பதே நேரடியான மொழிபெயர்ப்பு.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: மகன்கள்
  rationale: வம்சப்பட்டியல்களில் בְּנֵי என்பது நேரடி மகன்களையோ பரந்த வழித்தோன்றலையோ குறிக்கக்கூடும். இங்கு எபிரெயச் சொல்லின் நேரடியான பொருளையும் மீண்டும் வரும் வம்சப்பட்டியல் அமைப்பையும் காக்க ‘மகன்கள்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: אַפַּיִם
  choice: அப்பாயீம்
  rationale: எபிரெய உச்சரிப்பை இயன்றவரை பிரதிபலிக்கும் வகையில் தனிப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: יִשְׁעִי
  choice: இஷி
  rationale: தனிப்பெயர் எபிரெய வடிவத்திலிருந்து இயல்பான தமிழ் எழுத்துகளில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: שֵׁשָׁן
  choice: சேசான்
  rationale: தனிப்பெயர் எபிரெய மெய், உயிர் ஒலிகளைத் தொடர்ந்து தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: אַחְלָי
  choice: அக்லாய்
  rationale: எபிரெயப் பெயரிலுள்ள மெய்யொலிக் கூட்டை வாசிக்கத்தக்க தமிழில் நெருக்கமாகக் காட்டும் ஒலிபெயர்ப்பு.
