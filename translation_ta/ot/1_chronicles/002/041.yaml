  source_fidelity: 'வம்சவரலாற்றுச் சூழலில் הוֹלִיד / הֹלִיד என்பதற்கு «தந்தையானான்» என்பது பொருத்தமானது; இரு இணையான கூற்றுகளும் செயப்படுபொருள்களும் தக்கவைக்கப்பட்டுள்ளன. ஆனால் יְקַמְיָה என்ற பெயரின் தொடக்க யோத் ஒலி வரைவில் விடுபட்டுள்ளது: «எக்கமியா» என்பதற்குப் பதில் «யெகமியா» வேண்டும். இரண்டாவது கூற்றின் வாவ் இணைப்பும் வெளிப்படையாக மொழிபெயர்க்கப்பட வேண்டும்.'
  naturalness: «சல்லூம் யெகமியாவுக்குத் தந்தையானான்; யெகமியா எலிசாமாவுக்குத் தந்தையானான்» என்பது நவீனத் தரநிலைத் தமிழில் சுருக்கமாகவும் இயல்பாகவும் உள்ளது. «மேலும்» சேர்ப்பது எபிரேய வாவ் இணைப்பைத் தெளிவாகக் காட்டுகிறது; அரைப்புள்ளி வம்சவரிசையின் இணைநடையைப் பேணுகிறது.
