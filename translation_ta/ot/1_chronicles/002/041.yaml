lexical_decisions:
- source_word: שַׁלּוּם
  choice: சல்லூம்
  rationale: தனிநபரின் எபிரேயப் பெயர்; அதன் ஒலிவடிவத்திற்கு நெருக்கமாகத் தமிழில் எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: הוֹלִיד / הֹלִיד
  choice: தந்தையானான்
  rationale: ילד என்பதன் ஹிஃபில் வடிவம் வம்சவரலாற்றுச் சூழலில் ‘ஒருவனைப் பெற்ற தந்தையானான்’ என்ற பொருளைக் குறிக்கிறது. ‘தந்தையானான்’ என்பது சுருக்கமாகவும் இயல்பாகவும் அந்த வம்சவழிப் பொருளைத் தருகிறது.
- source_word: אֶת
  choice: '[தனியாக மொழிபெயர்க்கப்படவில்லை]'
  rationale: இது நேரடிச் செயப்படுபொருளைக் குறிக்கும் இலக்கணச் சுட்டு; தமிழில் தனிச் சொல்லாக இதற்கு இணை தேவையில்லை.
- source_word: יְקַמְיָה / וִיקַמְיָה
  choice: எக்கமியா / எக்கமியா
  rationale: எபிரேயத் தனிநபர் பெயர் தமிழில் ஒலிப்பெயர்க்கப்பட்டது. இரண்டாவது இடத்திலுள்ள ו இணைப்பின் பணி அரைப்புள்ளி மற்றும் அடுத்த கூற்றின் தொடர்ச்சியால் இயல்பாக வெளிப்படுகிறது; மூலத்திலுள்ள பெயரின் மறுபயன்பாடு தக்கவைக்கப்பட்டது.
- source_word: אֱלִישָׁמָע
  choice: எலிசாமா
  rationale: எபிரேயத் தனிநபர் பெயர் அதன் ஒலிவடிவத்திற்கு நெருக்கமாகத் தமிழில் எழுத்துப்பெயர்க்கப்பட்டது.
