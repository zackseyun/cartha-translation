  text: וְ/רָ֖ם הוֹלִ֣יד אֶת עַמִּינָדָ֑ב וְ/עַמִּינָדָב֙ הוֹלִ֣יד אֶת נַחְשׁ֔וֹן נְשִׂ֖יא בְּנֵ֥י יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/010.yaml
  text: Ram fathered Amminadab[a], and Amminadab fathered Nahshon, leader of the sons of Judah.
translation:
  language: ta
  text: ராம் அம்மினதாபைப் பெற்றான்; அம்மினதாப் நகசோனைப் பெற்றான். நகசோன் யூதாவின் மகன்களுக்குத் தலைவனாக இருந்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘யூதாவின் மகன்களுடைய அதிபதி’ அல்லது ‘யூதாவின் மகன்களுடைய முதன்மையானவன்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹלִיד
  choice: பெற்றான்
  rationale: வம்சப்பட்டியல் சூழலில் ஹிபில் வடிவம் ஒரு மகனைப் பெற்றெடுத்துத் தந்தையானதைக் குறிக்கிறது. தமிழில் ஆண் எழுவாயுடன் ‘பெற்றான்’ என்பது இயல்பாகவும் சுருக்கமாகவும் இந்த வம்சத் தொடர்பை வெளிப்படுத்துகிறது.
- source_word: נְשִׂיא
  choice: தலைவன்
  rationale: இச்சொல் தலைமை நிலையிலுள்ளவர், தலைவர் அல்லது அதிபதி என்பதைக் குறிக்கலாம். அரசகுமாரன் என்ற தவறான முடியாட்சி சார்ந்த எண்ணத்தைத் தவிர்த்து, நகசோனின் அங்கீகரிக்கப்பட்ட தலைமையை ‘தலைவன்’ தெளிவாகக் காட்டுகிறது.
- source_word: בְּנֵי יְהוּדָה
  choice: யூதாவின் மகன்கள்
  rationale: எபிரெய மூலத்தின் நேரடியான ஆண்பால் மற்றும் வம்சவழிச் சொல்லாட்சியைப் பாதுகாக்கிறது; இங்கு அது யூதாவின் வழிவந்த குலத்தாரையும் குறிக்கிறது.
- source_word: רָם / עַמִּינָדָב / נַחְשׁוֹן
  choice: ராம் / அம்மினதாப் / நகசோன்
  rationale: தனிப்பெயர்கள் மொழிபெயர்க்கப்படாமல், எபிரெய உச்சரிப்பைத் தமிழில் இயன்றவரை பிரதிபலிக்கும் வகையில் ஒலிபெயர்க்கப்பட்டுள்ளன.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான வம்சப்பட்டியல் நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் ‘யூதாவின் மகன்கள்’ என்ற வம்ச/குலச் சொற்றொடர் அப்படியே பாதுகாக்கப்பட்டு, நְשִׂיא என்பதன் பொருள் வேறுபாடுகள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
