lexical_decisions:
- source_word: נְתַנְאֵל
  choice: நெத்தனெயேல்
  rationale: தனிப்பட்ட நபரின் பெயர் என்பதால் மொழிபெயர்க்காமல், எபிரெய ஒலிப்புக்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: הָרְבִיעִי
  choice: நான்காவது மகன்
  rationale: வம்சப் பட்டியலின் சூழலில் பிறப்பு வரிசையைக் குறிக்கும் வரிசை எண்ணாக உள்ளது; தமிழில் இயல்பாகவும் பொருள் தெளிவாகவும் இருக்க ‘மகன்’ வெளிப்படையாகச் சேர்க்கப்பட்டது.
- source_word: רַדַּי
  choice: ரத்தாய்
  rationale: தனிப்பட்ட நபரின் பெயர் என்பதால் எபிரெய மெய்யெழுத்தின் இரட்டிப்பையும் இறுதி இரட்டை உயிரொலியையும் பிரதிபலிக்கும் வகையில் ஒலிபெயர்க்கப்பட்டது.
- source_word: הַחֲמִישִׁי
  choice: ஐந்தாவது மகன்
  rationale: முந்தைய சொற்றொடருக்கு இணையாக, வம்சப் பட்டியலில் பிறப்பு வரிசையைக் காட்டுகிறது; இயல்பான தமிழுக்காக ‘மகன்’ சேர்க்கப்பட்டது.
