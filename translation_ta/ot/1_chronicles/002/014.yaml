revisions:
- from: நான்காவது மகன் நெத்தனெயேல்; ஐந்தாவது மகன் ரத்தாய்.
  to: நெத்தனேல் நான்காமவன்; ரத்தாய் ஐந்தாமவன்.
  rationale: The revision corrects the transliteration of Nethanel, retains Raddai, and uses idiomatic masculine ordinal forms appropriate to the genealogical context without unnecessarily inserting «மகன்».
  reviewer_model: gpt-5.6-terra
