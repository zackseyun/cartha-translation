  text: Boaz fathered Obed, and Obed fathered Jesse.
translation:
  language: ta
  text: போவாஸ் ஓபேதைப் பெற்றான்; ஓபேத் ஈசாயைப் பெற்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בֹעַז
  choice: போவாஸ்
  rationale: எபிரெய தனிப்பெயர் தமிழில் வழக்காக அறியப்படும் வேதாகமப் பெயர்வடிவில் ஒலிபெயர்க்கப்பட்டது; தொடக்க இணைப்புச் சொல் வம்சப்பட்டியலின் தொடரைச் சுட்டினாலும், தனித்து வாசிக்கப்படும் இவ்வசனத்தில் இயல்பான தமிழுக்காக வெளிப்படையாக மொழிபெயர்க்கப்படவில்லை.
- source_word: הוֹלִיד
  choice: பெற்றான்
  rationale: ילד என்பதன் ஹிஃபில் வடிவம் வம்சப்பட்டியல் சூழலில் ஒருவருக்குத் தந்தையானதை அல்லது அவரைப் பிறப்பித்ததைச் சுட்டுகிறது. ‘பெற்றான்’ என்பது தமிழில் வம்சவழியைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: אֶת
  choice: '[மொழிபெயர்க்கப்படவில்லை]'
  rationale: இது நேரடி செயப்படுபொருளைக் குறிக்கும் இலக்கண உருபு; அதன் பணி தமிழின் ‘-ஐ’ வேற்றுமை உருபால் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: עוֹבֵד
  choice: ஓபேது
  rationale: எபிரெய தனிப்பெயர், தமிழில் நிலைபெற்ற வேதாகமப் பெயர்வடிவுக்கு ஏற்ப ஒலிபெயர்க்கப்பட்டது; செயப்படுபொருளாக ‘ஓபேதை’ என வேற்றுமை பெற்றுள்ளது.
- source_word: וְ/עוֹבֵד
  choice: ஓபேது
  rationale: மீண்டும் வரும் தனிப்பெயர் தமிழில் எழுவாய் வடிவில் தரப்பட்டுள்ளது. எபிரெய இணைப்புச் சொல் ו-இன் தொடர்பு தமிழில் அரைப்புள்ளியால் இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: הוֹלִיד
  choice: பெற்றான்
  rationale: மீண்டும் வரும் வம்சப்பட்டியல் வினை, பொருள் மற்றும் நடை ஒருமைப்பாட்டிற்காக முதல் பயன்பாட்டைப் போலவே மொழிபெயர்க்கப்பட்டது.
- source_word: יִשָׁי
  choice: ஈசாய்
  rationale: எபிரெய தனிப்பெயர் தமிழில் பரவலாக அறியப்படும் வேதாகமப் பெயர்வடிவில் தரப்பட்டுள்ளது; செயப்படுபொருளாக ‘ஈசாயை’ என வருகிறது.
