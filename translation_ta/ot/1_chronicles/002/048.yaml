base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/048.yaml
  text: Caleb’s concubine Maacah bore Sheber and Tirhanah[a].
translation:
  language: ta
  text: காலேபின் துணைமனைவியான மாக்கா, ஷேபேரையும் திர்ஹானாவையும் பெற்றாள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, வம்சவரலாற்றில் יָלַד என்ற வினைச்சொல் பொதுவாகச் சந்ததியைப் பெறுதலைக் குறிக்கலாம். ஆனால் இங்கு எழுவாய் வெளிப்படையாகப் பெண்ணாக இருப்பதால், முதன்மை உரையில் “பெற்றாள்” என்று தரப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּלֶגֶשׁ
  choice: மறுமனைவி
  rationale: அங்கீகரிக்கப்பட்டிருந்தாலும் முதன்மை மனைவியைவிடத் தாழ்ந்த நிலையிலிருந்த திருமண உறவிலுள்ள பெண்ணைக் குறிக்கிறது. நவீன தமிழில் இயல்பாகவும் கண்ணியமாகவும் புரியும்படி ‘மறுமனைவி’ என மொழிபெயர்க்கப்பட்டது.
- source_word: כָּלֵב
  choice: காலேப்
  rationale: எபிரெயத் தனிப்பெயரின் தமிழ் ஒலிபெயர்ப்பு.
- source_word: מַעֲכָה
  choice: மாக்காள்
  rationale: எபிரெயத் தனிப்பெயரின் தமிழ் ஒலிபெயர்ப்பு; இறுதி மெய் ஒலியும் பெயரின் ஒலியமைப்பும் பிரதிபலிக்கப்படுகின்றன.
- source_word: יָלַד
  choice: பெற்றெடுத்தாள்
  rationale: வம்சவரலாற்றுச் சூத்திரங்களில் இச்சொல் பொதுவாகப் பிறப்பித்தல் அல்லது சந்ததியை உருவாக்குதல் என்று வரலாம். இங்கு எழுவாய் பெண் என்பதால் ‘பெற்றெடுத்தாள்’ என்பது இயல்பான, பாலினத்திற்கேற்ற பொருள்.
- source_word: שֶׁבֶר
  choice: சேபேர்
  rationale: எபிரெயத் தனிப்பெயரின் தமிழ் ஒலிபெயர்ப்பு.
- source_word: וְאֶת
  choice: -ஐயும்
  rationale: இணைப்புச் சொல்லும் நேரடி செயப்படுபொருள் குறியீடும் சேர்ந்து இரண்டாவது பெயரை அறிமுகப்படுத்துகின்றன; தமிழில் ‘-ஐயும்’ இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: תִּרְחֲנָה
  choice: திர்கானா
  rationale: எபிரெயத் தனிப்பெயரின் தமிழ் ஒலிபெயர்ப்பு; ח ஒலி தமிழில் அண்மையாக ‘க’ மூலம் வழங்கப்பட்டுள்ளது.
