  text: Jerahmeel also had another wife, and her name was Atarah; she was the mother of Onam.
translation:
  language: ta
  text: எரக்மெயேலுக்கு மற்றொரு மனைவியும் இருந்தாள். அவள் பெயர் அதாரா; அவள் ஓனாமின் தாய்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתְּהִי
  choice: இருந்தாள்
  rationale: היה என்பதுடன் לִירַחְמְאֵל சேர்ந்து, எரக்மெயேலுக்கு ஒரு மனைவி இருந்ததை உடைமை சார்ந்த இயல்பான தமிழில் தெரிவிக்கிறது. தொடக்க வாவ், சூழலில் கூடுதலான மனைவியைக் குறிப்பிடுவதால், ‘-உம்’ என்பதில் பிரதிபலிக்கப்படுகிறது.
- source_word: אִשָּׁה אַחֶרֶת
  choice: வேறொரு மனைவியும்
  rationale: அடுத்துவரும் வம்சவரலாற்றுச் சூழலில் אִשָּׁה என்பது ‘மனைவி’; אַחֶרֶת என்பது முன்னர் குறிப்பிடப்பட்ட மனைவியிலிருந்து வேறான, கூடுதலான மனைவியைக் குறிக்கிறது.
- source_word: לִירַחְמְאֵל
  choice: எரக்மெயேலுக்கு
  rationale: ל முன்னொட்டைத் தமிழின் உடைமை/உறவு வேற்றுமையான ‘-க்கு’ மூலம் வெளிப்படுத்தி, பெயரை எபிரெய ஒலிப்புக்கு அண்மையாக எழுத்துப்பெயர்த்துள்ளது.
- source_word: וּשְׁמָהּ
  choice: அவள் பெயர்
  rationale: எபிரெயப் பெயரிடும் வழக்கை இயல்பான, சுருக்கமான தமிழில் அளிக்கிறது; வாக்கிய இணைப்பு முற்றுப்புள்ளிக்குப் பின் இயல்பாகத் தொடர்கிறது.
- source_word: עֲטָרָה
  choice: அதாரா
  rationale: தனிப்பெயர் எபிரெய உச்சரிப்புக்கு அண்மையாக எழுத்துப்பெயர்க்கப்பட்டுள்ளது.
- source_word: הִיא
  choice: அவள்
  rationale: தனி சுட்டுப்பெயரின் தெளிவூட்டும் வலியுறுத்தலைத் தமிழில் இயல்பான ‘அவள்’ காக்கிறது; ‘அவளே’ என்பது மூலத்திலுள்ள வலியுறுத்தலை அளவுக்கு மீறச் செய்யலாம்.
- source_word: אֵם
  choice: தாய்
  rationale: வம்சவரலாற்றுச் சூழலுக்கு ஏற்ற நேரடியான தமிழ் இணைச்சொல்.
- source_word: אוֹנָם
  choice: ஓனாம்
  rationale: தனிப்பெயர் எபிரெய உச்சரிப்புக்கு அண்மையாக எழுத்துப்பெயர்க்கப்பட்டுள்ளது.
