  text: וְ/עֵיפָה֙ פִּילֶ֣גֶשׁ כָּלֵ֔ב יָֽלְדָ֛ה אֶת חָרָ֥ן וְ/אֶת מוֹצָ֖א וְ/אֶת גָּזֵ֑ז וְ/חָרָ֖ן הֹלִ֥יד אֶת גָּזֵֽז־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/046.yaml
  text: And Ephah[a], Caleb’s concubine, bore Haran, Moza, and Gazez; and Haran fathered Gazez.
translation:
  language: ta
  text: காலேபின் துணை மனைவியான ஏபா, ஹாரான், மோட்சா, காசேஸ் ஆகியோரைப் பெற்றெடுத்தாள். ஹாரான் காசேசுக்குத் தந்தையானான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פִּילֶגֶשׁ
  choice: துணை மனைவி
  rationale: அங்கீகரிக்கப்பட்டிருந்தாலும் முதன்மை மனைவியைவிடத் தாழ்ந்த குடும்ப நிலை கொண்ட பெண்ணைக் குறிக்கும் எபிரெயச் சொல்லை, இழிவான தொனி இன்றி நவீனத் தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: יָלְדָה
  choice: பெற்றெடுத்தாள்
  rationale: பெண் எழுவாயாக வரும் இந்த வம்சவரலாற்றுச் சூழலில், பிள்ளைகளைப் பெற்றாள் என்ற பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: הֹלִיד
  choice: தந்தையானான்
  rationale: யָלַד என்பதன் ஹிப்இல் வடிவம் ஆண் வழி வம்ச உறவைக் குறிக்கிறது; பழமையான சொல்லாட்சியைத் தவிர்த்து அந்த உறவைத் துல்லியமாகக் கூறுகிறது.
- source_word: עֵיפָה
  choice: ஏபா
  rationale: எபிரெயத் தனிப்பெயரின் ஒலியை நவீனத் தமிழ் எழுத்துமுறைக்கு ஏற்றவாறு ஒலிபெயர்க்கிறது.
- source_word: כָּלֵב
  choice: காலேப்
  rationale: எபிரெயத் தனிப்பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: חָרָן
  choice: ஹாரான்
  rationale: ஒரே பெயர் இருமுறையும் ஒரே விதமாக ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: מוֹצָא
  choice: மோட்சா
  rationale: எபிரெய צ ஒலியை ‘ட்ச’ எனக் காட்டி மூலமொழி உச்சரிப்பை நெருக்கமாகப் பேணுகிறது.
- source_word: גָּזֵז
  choice: காசேஸ்
  rationale: தனிப்பெயர் இரு இடங்களிலும் ஒரே விதமாக ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְ
  choice: மேலும் / பெயர்ப் பட்டியலில் மறைமுக இணைப்பு
  rationale: முதல் வாவ் தனி வாக்கியமாகப் பிரிக்கப்படவில்லை; பட்டியலிலுள்ள இணைப்புகள் தமிழின் ‘ஆகியோர்’ அமைப்பாலும், இரண்டாம் கூற்று புதிய வாக்கியமாக அமைவதாலும் இயல்பாக வெளிப்படுகின்றன.
- source_word: אֶת
  choice: தனியாக மொழிபெயர்க்கப்படவில்லை
  rationale: நேரடிச் செயப்படுபொருளைக் குறிக்கும் இலக்கணச் சுட்டிக்கு தமிழில் தனிச் சொல் தேவையில்லை; ‘-ஐ’ வேற்றுமையும் வாக்கிய அமைப்பும் அதன் பணியைச் செய்கின்றன.
