translation_notes:
  register: நவீனத் தரத் தமிழில், வம்சவரலாற்றுக்கேற்ற சுருக்கமானதும் கண்ணியமானதுமான நடை பயன்படுத்தப்பட்டுள்ளது. ஆங்கில ஆலோசனை உரையிலுள்ள [a] குறிப்பு ‘ஹாரான் காசேசுக்குத் தந்தையானான்’ என்பதற்கான சொற்பொழிவு மாற்றை மட்டும் தருகிறது; மேலும் அதன் குறியீடு ஏபா என்ற பெயருக்குப் பின் தவறாக அமைந்துள்ளது. எபிரெய மூலத்தில் இங்கு குறிப்பிடத்தக்க உரை வேறுபாடோ பொருள் குழப்பமோ இல்லாததால் அந்தக் குறிப்பு சேர்க்கப்படவில்லை.
