  source_fidelity: 'எபிரெய மூலத்தின் வம்சவரலாற்று அமைப்பும் உறவுகளும் துல்லியமாகத் தரப்பட்டுள்ளன: ஏபா காலேபின் துணை மனைவி; அவள் ஹாரான், மோட்சா, காசேஸ் ஆகியோரைப் பெற்றெடுத்தாள்; ஹாரான் காசேசுக்குத் தந்தையானான். הֹלִיד-இன் ஆண்வழி வம்ச உறவு தெளிவாகப் பாதுகாக்கப்பட்டுள்ளது.'
  naturalness: நடை நவீனத் தரத் தமிழில் சுருக்கமாகவும் இயல்பாகவும் உள்ளது. பட்டியலுக்குப் பின் வரும் இரண்டாம் வாக்கியம் தெளிவாக அமைந்துள்ளது. ‘காலேபின்’ மற்றும் ‘காசேசுக்குத்’ ஆகிய வேற்றுமை வடிவங்கள் தமிழில் இயல்பானவை.
  terminology: ‘துணை மனைவி’ என்பது פִּילֶגֶשׁ என்பதன் அங்கீகரிக்கப்பட்ட ஆனால் இரண்டாம் நிலைத் திருமண உறவைக் கண்ணியமாகவும் போதுமான துல்லியத்துடனும் குறிக்கிறது. தனிப்பெயர்கள் ஒரே வசனத்துக்குள் சீராக ஒலிபெயர்க்கப்பட்டுள்ளன. ஆங்கில audit குறிப்பு வெறும் ஆங்கிலச் சொற்றொடர் மாற்றையே வழங்குகிறது; தமிழில் பொருள் வேறுபாடு இல்லாததால் குறிப்பு தேவையில்லை.
