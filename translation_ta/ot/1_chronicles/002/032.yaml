source:
  edition: WLC
  text: וּ/בְנֵ֤י יָדָע֙ אֲחִ֣י שַׁמַּ֔י יֶ֖תֶר וְ/יוֹנָתָ֑ן וַ/יָּ֥מָת יֶ֖תֶר לֹ֥א בָנִֽים׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/032.yaml
  text: 'The sons of Jada[a], Shammai’s brother: Jether and Jonathan. Jether died without sons.'
translation:
  language: ta
  text: 'சம்மாயின் சகோதரனான யாதாவின் மகன்கள்: யெத்தேரும் யோனத்தானும். யெத்தேர் மகன்கள் இல்லாமல் இறந்தான்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “யெத்தேர் இறந்தான்; மகன்கள் இல்லை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: மகன்கள்
  rationale: בְּנֵי என்பது பன்மை இணைநிலை வடிவம்; இது வம்சப்பட்டியலின் ஒரு துணைப்பிரிவை அறிமுகப்படுத்துகிறது. தொடக்க வாவைத் தனியே மொழிபெயர்க்காமல் இயல்பான தமிழ் வம்சப்பட்டியல் நடையில் தரப்பட்டுள்ளது.
- source_word: יָדָע
  choice: யாதா
  rationale: எபிரெயப் பெயரின் ஒலியை நவீனத் தமிழில் இயன்றவரை பிரதிபலிக்கும் எழுத்துப்பெயர்ப்பு.
- source_word: אֲחִי שַׁמַּי
  choice: சம்மாயின் சகோதரனான
  rationale: אֲחִי என்பதன் நேரடியான உறவுப் பொருள் ‘சகோதரன்’; பெயருக்கும் மகன்களுக்கும் உள்ள தொடர்பு தமிழில் தெளிவாக அமைய பெயரெச்சத் தொடராக வழங்கப்பட்டுள்ளது.
- source_word: יֶתֶר
  choice: ஏத்தேர்
  rationale: இரு இடங்களிலும் வரும் அதே எபிரெயப் பெயர் ஒரே விதமாக எழுத்துப்பெயர்க்கப்பட்டுள்ளது.
- source_word: וְיוֹנָתָן
  choice: யோனத்தான்
  rationale: இணைப்புச்சொல்லுடன் வரும் பெயர்; ‘ஏத்தேரும் யோனத்தானும்’ என்ற தமிழ் இணைப்பு அமைப்பில் இயல்பாக வழங்கப்பட்டுள்ளது.
- source_word: וַיָּמָת
  choice: இறந்தான்
  rationale: வம்சப்பட்டியலில் அடுத்த நிகழ்வைக் குறிக்கும் wayyiqtol வடிவம்; தமிழில் எளிய இறந்தகாலமாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: לֹא בָנִים
  choice: மகன்கள் இல்லாமல்
  rationale: சொல்லுக்குச் சொல் ‘மகன்கள் இல்லை’ என்ற சுருக்கமான எபிரெயத் தொடரை, அதன் வம்சப்பட்டியல் பொருளை மாற்றாமல் இயல்பான தமிழில் வழங்குகிறது.
theological_decisions:
- issue: லֹא בָנִים என்பது எல்லாக் குழந்தைகளும் இல்லையென்றா அல்லது மகன்கள் மட்டும் இல்லையென்றா?
  choice: மகன்கள் இல்லாமல்
  alternative: குழந்தைகள் இல்லாமல்
  rationale: மூலத்தில் בָנִים என்பது குறிப்பாக ‘மகன்கள்’ என்று உள்ளது. பெண் குழந்தைகளும் இல்லை என்று உரை கூறாததால், பரந்த பொருளான ‘குழந்தைகள் இல்லாமல்’ என்பதைத் தவிர்த்து மூலத்தின் வரம்பு காக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், வம்சப்பட்டியலுக்கேற்ற சுருக்கமானதும் கண்ணியமானதும் இயல்பானதுமான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் ‘மகன்கள்’ என்ற குறிப்பிட்ட சொல்லைத் தக்கவைத்து, ‘குழந்தைகள் இல்லாமல்’ என விரிவுபடுத்துவது தவிர்க்கப்பட்டுள்ளது.
