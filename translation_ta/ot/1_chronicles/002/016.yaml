translation_notes:
  register: நவீனத் தரத் தமிழில், கண்ணியமான ஆனால் எளிதில் புரியும் வம்சவரலாற்று நடை பயன்படுத்தப்பட்டுள்ளது. தனிப்பெயர்கள் எபிரெய ஒலிப்புக்கு அண்மையாக எழுத்துப்பெயர்க்கப்பட்டுள்ளன; மூலத்தின் சுருக்கமான பட்டியல் அமைப்பும் இறுதியிலுள்ள எண்ணிக்கையும் பாதுகாக்கப்பட்டுள்ளன.
