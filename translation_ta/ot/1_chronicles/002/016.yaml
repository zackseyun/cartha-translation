source:
  edition: WLC
  text: ו/אחיתי/הם צְרוּיָ֣ה וַ/אֲבִיגָ֑יִל וּ/בְנֵ֣י צְרוּיָ֗ה אַבְשַׁ֛י וְ/יוֹאָ֥ב וַ/עֲשָׂה אֵ֖ל שְׁלֹשָֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/016.yaml
  text: 'Their sisters were Zeruiah and Abigail. The sons of Zeruiah: Abishai, Joab, and Asahel—three.'
translation:
  language: ta
  text: 'அவர்களுடைய சகோதரிகள் செருயாவும் அபிகாயிலும். செருயாவின் மகன்கள்: அபிசாய், யோவாப், ஆசகேல்—மூவர்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲחֹתֵיהֶם
  choice: அவர்களுடைய சகோதரிகள்
  rationale: இணைப்புச் சொல்லுடன் வரும் பன்மை உறவுமுறைப் பெயரும் மூன்றாம் நபர் ஆண்பால் பன்மை உரிமை விகுதியும் இயல்பான நவீன தமிழில் இவ்வாறு தரப்பட்டுள்ளன.
- source_word: צְרוּיָה
  choice: செருயா
  rationale: எபிரெய தனிப்பெயரின் ஒலிப்பைத் தமிழில் அண்மையாக எழுத்துப்பெயர்த்தது.
- source_word: וַאֲבִיגָיִל
  choice: அபிகாயிலும்
  rationale: தனிப்பெயர் எழுத்துப்பெயர்க்கப்பட்டு, எபிரெய இணைப்புச் சொல் தமிழ் பட்டியலுக்கேற்ற ‘உம்’ விகுதியால் காட்டப்பட்டுள்ளது.
- source_word: וּבְנֵי צְרוּיָה
  choice: செருயாவின் மகன்கள்
  rationale: எபிரெய சார்பு அமைப்பின் பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது; பட்டியல் அமைப்பு முக்காற்புள்ளியால் காட்டப்படுகிறது.
- source_word: אַבְשַׁי
  choice: அபிசாய்
  rationale: எபிரெய தனிப்பெயரின் ஒலிப்பைத் தமிழில் அண்மையாக எழுத்துப்பெயர்த்தது.
- source_word: וְיוֹאָב
  choice: யோவாப்
  rationale: தனிப்பெயர் எழுத்துப்பெயர்க்கப்பட்டது; பட்டியலின் இணைப்பு தமிழில் இறுதி உறுப்புக்கு முன் இயல்பாக உணரப்படுவதால் தனியே சேர்க்கப்படவில்லை.
- source_word: וַעֲשָׂהאֵל
  choice: ஆசகேல்
  rationale: எபிரெய தனிப்பெயரின் மெய்யொலிகளைப் பாதுகாக்கும் தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: שְׁלֹשָׁה
  choice: மூவர்
  rationale: மனிதர்களைக் குறிக்கும் எபிரெய எண்ணிக்கையைத் தமிழின் உயர்திணை எண்ணுப்பெயரால் வெளிப்படுத்தி, மூலத்தில் உள்ள தொகைச் சுருக்கத்தைத் தெளிவாகப் பாதுகாக்கிறது.
