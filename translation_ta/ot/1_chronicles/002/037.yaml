  text: Zabad fathered Ephlal, and Ephlal fathered Obed.
translation:
  language: ta
  text: சாபாத் எப்லாலைப் பெற்றான்; எப்லால் ஓபேதைப் பெற்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זָבָד
  choice: சாபாத்
  rationale: எபிரெயத் தனிப்பெயர்; தமிழில் அதன் ஒலிப்புக்கு நெருக்கமாக எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: הוֹלִיד
  choice: பெற்றான்
  rationale: வம்சவரலாற்றுச் சூழலில் ஹிஃபில் வடிவம் ‘தந்தையானான்/பெற்றான்’ என்ற ஆண் வழிப் பிறப்புறவைக் குறிக்கிறது. ‘பெற்றான்’ என்பது தமிழில் சுருக்கமாகவும் இயல்பாகவும் வம்சப்பட்டியல்களுக்கு ஏற்றதாகவும் உள்ளது.
- source_word: אֵת
  choice: '[தனியே மொழிபெயர்க்கப்படவில்லை]'
  rationale: இது நேரடிச் செயப்படுபொருளைக் குறிக்கும் இலக்கண அடையாளம்; தமிழில் ‘ஐ’ வேற்றுமை உருபால் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: אֶפְלָל
  choice: எப்லால்
  rationale: எபிரெயத் தனிப்பெயர்; அதன் ஒலிப்பைத் தொடர்ந்து தமிழில் எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: וְ
  choice: ;
  rationale: இரு நெருக்கமாக இணைந்த வம்சவரலாற்றுக் கூறுகளைத் தமிழ் நடையில் அரைப்புள்ளி இயல்பாக இணைக்கிறது; இணைப்பின் பொருள் காக்கப்பட்டுள்ளது.
- source_word: עוֹבֵד
  choice: ஓபேத்
  rationale: எபிரெயத் தனிப்பெயர்; பெயரின் சொற்பிறப்புப் பொருளை மொழிபெயர்க்காமல் ஒலிப்புக்கு ஏற்ப எழுத்துப்பெயர்க்கப்பட்டது.
