lexical_decisions:
- source_word: וְ/נַחְשׁוֹן
  choice: நகசோன்
  rationale: நַחְשׁוֹן என்ற எபிரெயத் தனிப்பெயரின் ஒலியைத் தமிழில் இயல்பாகப் பிரதிபலிக்கும் எழுத்துப்பெயர்ப்பு; வம்சவரலாற்றின் தொடர்ச்சியைத் தமிழில் தொடக்க ‘மற்றும்’ இல்லாமலேயே தெளிவாகக் கூறலாம்.
- source_word: הוֹלִיד
  choice: பெற்றான்
  rationale: வம்சவரலாற்றுச் சூழலில் ஹிஃபில் வடிவிலுள்ள ילד ‘தந்தையானான்/வழித்தோன்றலைப் பெற்றான்’ என்று பொருள்படும். ‘பெற்றான்’ என்பது தமிழில் சுருக்கமான, வழக்கமான வம்சவரலாற்றுச் சொல்.
- source_word: אֶת
  choice: '[தனியாக மொழிபெயர்க்கப்படவில்லை]'
  rationale: இது நேரடிச் செயப்படுபொருளைக் குறிக்கும் இலக்கண அடையாளம்; தமிழில் ‘-ஐ’ வேற்றுமை உருபால் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: שַׂלְמָא
  choice: சல்மா
  rationale: இவ்வசனத்தின் எபிரெய வடிவம் שַׂלְמָא என்பதால், தொடர்புடைய வம்சவரலாறுகளோடு ஒத்திசைக்க ‘சல்மோன்’ என்று மாற்றாமல் ‘சல்மா’ என நேரடியாக எழுத்துப்பெயர்க்கப்பட்டுள்ளது.
- source_word: וְ/שַׂלְמָא
  choice: சல்மா
  rationale: וְ இணைப்பின் தொடர்ச்சி தமிழில் அரைப்புள்ளி மற்றும் அடுத்த வாக்கிய அமைப்பால் இயல்பாக வெளிப்படுகிறது; பெயர் எபிரெய வடிவத்தின்படி ‘சல்மா’ என வைக்கப்பட்டுள்ளது.
- source_word: בֹּעַז
  choice: போவாஸ்
  rationale: בֹּעַז என்ற எபிரெயத் தனிப்பெயரின் தமிழில் பரவலாக அறியப்படும் எழுத்துப்பெயர்ப்பு.
