lexical_decisions:
- source_word: אֹצֶם
  choice: ஓத்சேம்
  rationale: தனிப்பட்ட நபரின் பெயர் என்பதால் மொழிபெயர்க்காமல், எபிரெய ஒலிப்புக்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: הַשִּׁשִּׁי
  choice: ஆறாவது மகன்
  rationale: வரிசை எண்ணைக் குறிக்கும் சொல். வம்சப் பட்டியலின் சூழலில் இயல்பான தமிழுக்காக மறைந்துள்ள ‘மகன்’ என்பது வெளிப்படையாகச் சேர்க்கப்பட்டது.
- source_word: דָּוִיד
  choice: தாவீது
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நன்கு நிலைபெற்றுள்ள பெயர் வடிவம் பயன்படுத்தப்பட்டது.
- source_word: הַשְּׁבִעִי
  choice: ஏழாவது மகன்
  rationale: இணையான வரிசை எண்ணைக் குறிக்கும் சொல். பட்டியலில் தாவீதின் இடத்தைத் தெளிவுபடுத்த ‘மகன்’ சேர்க்கப்பட்டது.
