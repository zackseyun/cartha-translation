  text: וּ/בְנֵ֤י כָלֵב֙ אֲחִ֣י יְרַחְמְאֵ֔ל מֵישָׁ֥ע בְּכֹר֖/וֹ ה֣וּא אֲבִי זִ֑יף וּ/בְנֵ֥י מָרֵשָׁ֖ה אֲבִ֥י חֶבְרֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/042.yaml
  text: 'And the sons of Caleb the brother of Jerahmeel: Mesha his firstborn[a], who was the father of Ziph[b], and the sons of Mareshah the father of Hebron.'
translation:
  language: ta
  text: 'எரக்மெயேலின் சகோதரனான காலேபின் மகன்கள்: அவனுடைய முதற்பேறானவன் மேஷா; அவன் சீப்பின் தந்தை[a]. மேலும், மாரேஷாவின் மகன்கள், எபிரோனின் தந்தை[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நாளாகமத்தில் “தந்தை” என்பது உயிரியல் தந்தையை மட்டுமல்லாமல், ஒரு மூதாதை, குலத்தலைவர், அல்லது ஓர் இடத்தோடு தொடர்புடைய நிறுவனர் என்பதையும் குறிக்கலாம்.
    reason: cultural_note
  - marker: b
    text: இறுதிப் பகுதியின் எபிரெய இலக்கண அமைப்பு கடினமானது. மசோரா உரை சொல்லுக்குச் சொல், “மாரேஷாவின் மகன்கள், எபிரோனின் தந்தை” என்று வாசிக்கிறது. சிலர் இதை “எபிரோனின் தந்தையான மாரேஷா” என்று புரிந்துகொள்கிறார்கள்; இங்கு எபிரெய உரையின் சொற்றொடர் தக்கவைக்கப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵי כָלֵב
  choice: காலேபின் மகன்கள்
  rationale: வம்சவரலாற்றில் வரும் வழக்கமான ‘மகன்கள்’ என்ற வடிவத்தைத் தக்கவைக்கிறது; சூழலின்படி இது விரிந்த வழித்தோன்றலையும் குறிக்கலாம்.
- source_word: אֲחִי יְרַחְמְאֵל
  choice: எரக்மெயேலின் சகோதரனான
  rationale: காலேபை அடையாளப்படுத்தும் இணைப்புத் தொடரை இயல்பான தமிழில் தருகிறது.
- source_word: מֵישָׁע בְּכֹרוֹ
  choice: அவனுடைய முதற்பேறான மேஷா
  rationale: בכור என்பதிலுள்ள பிறப்பு வரிசை மற்றும் வம்ச உரிமை சார்ந்த நிழற்பொருளை ‘முதற்பேறு’ பாதுகாக்கிறது.
- source_word: הוּא אֲבִי זִיף
  choice: இவன் சீப்பின் தந்தை
  rationale: הוּא என்பதைத் தெளிவாக மேஷாவுடன் இணைத்து, אָב என்பதன் நேரடி ‘தந்தை’ வடிவத்தைப் பாதுகாக்கிறது.
- source_word: וּבְנֵי מָרֵשָׁה אֲבִי חֶבְרוֹן
  choice: மேலும், எபிரோனின் தந்தையான மாரேஷாவின் மகன்கள்
  rationale: மசோரா உரையின் கடினமான தொடரைச் சீரமைக்காமல், ‘மாரேஷா—எபிரோனின் தந்தை’ என்ற இயல்பான இணைப்பில் தமிழாக்குகிறது; ‘மகன்கள்’ என்பதையும் விடாமல் காக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீன தரத் தமிழில், வம்சவரலாற்றுக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. பெயர்கள் எபிரெய ஒலியமைப்பை அணுகும் வகையில் எழுத்துப்பெயர்க்கப்பட்டுள்ளன. மூலத்தின் இறுதிக் கூறிலுள்ள உண்மையான இலக்கணக் கடினத்தன்மை அடிக்குறிப்பில் வெளிப்படையாகக் குறிக்கப்பட்டுள்ளது.
