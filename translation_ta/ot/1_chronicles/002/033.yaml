translation_notes:
  register: நவீன நிலையான தமிழில், வம்சப் பட்டியலுக்கேற்ற சுருக்கமானவும் கண்ணியமானவும் இயல்பானவும் உள்ள நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் இல்லாத விளக்கங்கள் சேர்க்கப்படவில்லை.
