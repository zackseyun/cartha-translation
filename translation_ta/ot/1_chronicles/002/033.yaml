source:
  edition: WLC
  text: וּ/בְנֵ֥י יוֹנָתָ֖ן פֶּ֣לֶת וְ/זָזָ֑א אֵ֥לֶּה הָי֖וּ בְּנֵ֥י יְרַחְמְאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/033.yaml
  text: 'And the sons of Jonathan: Peleth and Zaza. These were the sons of Jerahmeel.'
translation:
  language: ta
  text: 'மேலும், யோனத்தானின் மகன்கள்: பெலெத், சாசா; இவர்கள் எரக்மெயேலின் மகன்கள்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי יוֹנָתָן
  choice: யோனத்தானின் மகன்கள்
  rationale: வம்சப் பட்டியலின் தொடர்ச்சியைத் தமிழில் இயல்பாக வெளிப்படுத்துவதற்காக வாவ் இணைப்பைத் தனியாக ‘மேலும்’ என்று மொழிபெயர்க்காமல், உரையின் தொடரமைப்பில் உணர்த்தப்பட்டுள்ளது; בְּנֵי என்ற இணைப்புநிலைச் சொல் ‘மகன்கள்’ என நேரடியாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: פֶּלֶת
  choice: பெலேத்
  rationale: எபிரெய தனிப்பெயரின் ஒலியமைப்புக்கு நெருக்கமாகத் தமிழில் எழுத்துப்பெயர்க்கப்பட்டுள்ளது.
- source_word: וְזָזָא
  choice: சாசா
  rationale: இரண்டாவது மகனின் பெயர் தமிழில் இயல்பான ஒலிப்புடன் எழுத்துப்பெயர்க்கப்பட்டுள்ளது; பெயர்களின் பட்டியலில் உள்ள இணைப்பு தமிழில் காற்புள்ளியால் இயல்பாகக் காட்டப்படுகிறது.
- source_word: אֵלֶּה הָיוּ
  choice: இவர்களே
  rationale: முன்னர் குறிப்பிடப்பட்ட நபர்களைச் சுட்டும் אֵלֶּה என்பதையும், அடையாளப்படுத்தும் הָיוּ என்பதையும் சேர்த்து, வலியுறுத்தலைக் காக்கும் இயல்பான தமிழாக ‘இவர்களே’ என வழங்கப்பட்டுள்ளது.
- source_word: בְּנֵי יְרַחְמְאֵל
  choice: எரக்மெயேலின் மகன்கள்
  rationale: בְּנֵי என்பதன் நேரடி வம்ச உறவுச் சொல்லான ‘மகன்கள்’ தக்கவைக்கப்பட்டுள்ளது; எபிரெய தனிப்பெயர் தமிழில் எழுத்துப்பெயர்க்கப்பட்டுள்ளது.
