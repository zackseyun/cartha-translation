translation_notes:
  register: நவீன நிலையான தமிழில் சுருக்கமான வம்சவரலாற்று நடையைப் பேணுகிறது. தனிப்பெயர்கள் எபிரெய ஒலிக்கு அருகாக ஒலிப்பெயர்க்கப்பட்டுள்ளன; இறையியல் சார்புடைய விளக்கம் எதுவும் சேர்க்கப்படவில்லை.
