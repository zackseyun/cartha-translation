id: 1CH.2.45
reference: 1 Chronicles 2:45
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וּ/בֶן שַׁמַּ֖י מָע֑וֹן וּ/מָע֖וֹן אֲבִ֥י בֵֽית צֽוּר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/045.yaml
  text: And the son of Shammai was Maon[a], and Maon was the father of Beth-zur.
translation:
  language: ta
  text: சம்மாயின் மகன் மாவோன்; மாவோன் பெத்சூரின் தந்தை[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பெத்சூரின் மூதாதை/நிறுவனர்.” வம்சவரலாறுகளில் “தந்தை” என்பது ஒரு குலம் அல்லது குடியிருப்பின் மூதாதையையோ நிறுவனரையோ குறிக்கவும் முடியும்.
    reason: אֲבִי என்பதன் நேரடித் தந்தை, மூதாதை, நிறுவனர் ஆகிய சாத்தியமான பொருள்களைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: וּבֶן
  choice: மகன்
  rationale: வம்சவரலாற்றுச் சூழலில் בֶן நேரடி மகனைக் குறிக்கிறது. தொடக்க ו முந்தைய பட்டியலின் தொடர்ச்சியைக் காட்டுகிறது; இயல்பான தமிழில் தனியே ‘மேலும்’ என்று மொழிபெயர்க்காமல் வாக்கியத் தொடரால் அது வெளிப்படுகிறது.
- source_word: שַׁמַּי
  choice: சம்மாய்
  rationale: எபிரெயத் தனிப்பெயரின் ஒலிப்பெயர்ப்பு.
- source_word: מָעוֹן
  choice: மாவோன்
  rationale: இங்கு வம்சவரலாற்றுத் தொடரமைப்பு இதை ஒருவரின் பெயராகக் காட்டுகிறது; எனவே தனிப்பெயராக ஒலிப்பெயர்க்கப்படுகிறது.
- source_word: אֲבִי
  choice: தந்தை
  rationale: אָב என்பதன் வழக்கமான வம்சவரலாற்றுப் பொருளைத் தருகிறது; இச்சூழலில் மூதாதை அல்லது குடியிருப்பின் நிறுவனர் என்ற விரிந்த பொருளும் இருக்கலாம் என்பதால் அது அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: בֵית צוּר
  choice: பெத்சூர்
  rationale: இது இடம் அல்லது குலத்தைக் குறிக்கும் கூட்டுத் தனிப்பெயர்; ‘சூரின் வீடு’ என்று சொற்படி மொழிபெயர்ப்பதைவிட ஒலிப்பெயர்ப்பு பொருத்தமானது.
