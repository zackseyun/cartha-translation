reference: 1 Chronicles 2:47
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וּ/בְנֵ֖י יָהְדָּ֑י רֶ֧גֶם וְ/יוֹתָ֛ם וְ/גֵישָׁ֥ן וָ/פֶ֖לֶט וְ/עֵיפָ֥ה וָ/שָֽׁעַף׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/047.yaml
  text: 'The sons of Jahdai: Regem, Jotham, Geshan, Pelet, Ephah, and Shaaph.'
translation:
  language: ta
  text: 'யஹ்தாயின் மகன்கள்: ரெகெம், யோதாம், கேஷான், பெலெத், ஏபா, ஷாஅப்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: மகன்கள்
  rationale: בְנֵי என்பது ‘மகன்கள்’ என்ற சொல்லின் இணைப்பு வடிவம்; இங்கு வம்சப் பட்டியலை நேரடியாக அறிமுகப்படுத்துவதால் ‘மகன்கள்’ என்பது இயல்பான தேர்வு. தொடக்க וּ பட்டியல் தொடர்ச்சியைக் காட்டினாலும், தனி வசனமாக இயல்பாக வாசிக்க தமிழில் அதை வெளிப்படையாக மொழிபெயர்க்க வேண்டியதில்லை.
- source_word: יָהְדָּי
  choice: யக்தாய்
  rationale: தனிப்பட்ட பெயர் என்பதால் பொருள் மொழிபெயர்ப்பு செய்யாமல் எபிரெய ஒலிக்கு நெருக்கமாக எழுத்துப்பெயர்க்கப்பட்டுள்ளது; הְדּ ஒலித்தொடர் ‘க்த’ எனத் தோராயமாகக் குறிக்கப்படுகிறது.
- source_word: רֶגֶם
  choice: ரேகேம்
  rationale: தனிப்பட்ட பெயர்; எபிரெய உயிரொலிகளையும் மெய்யொலிகளையும் தமிழில் இயன்றவரை நெருக்கமாகக் குறிக்கும் எழுத்துப்பெயர்ப்பு.
- source_word: יוֹתָם
  choice: யோதாம்
  rationale: தனிப்பட்ட பெயர்; தொடக்க y ஒலியையும் நீண்ட o மற்றும் a உயிரொலிகளையும் பிரதிபலிக்கும் எழுத்துப்பெயர்ப்பு.
- source_word: גֵישָׁן
  choice: கேஷான்
  rationale: தனிப்பட்ட பெயர்; ג இங்கு ‘க’, שׁ ‘ஷ’ எனவும் உயிரொலிகள் ‘ே’ மற்றும் ‘ா’ எனவும் எழுத்துப்பெயர்க்கப்பட்டுள்ளன.
- source_word: פֶלֶט
  choice: பேலேத்
  rationale: தனிப்பட்ட பெயர்; எபிரெயப் பெயரின் ஒலிவடிவத்தைத் தமிழில் அணுகும் எழுத்துப்பெயர்ப்பு. இறுதி ט ‘த்’ எனக் குறிக்கப்படுகிறது.
- source_word: עֵיפָה
  choice: ஏப்பா
  rationale: இங்கு அளவையின் பெயர் அல்ல, ஒருவரின் பெயர். தொடக்க ע தமிழில் தனியாகத் துல்லியமாகக் குறிக்க இயலாததால் உயிரொலியுடன் எழுத்துப்பெயர்க்கப்பட்டு, פ ஒலி ‘ப்ப’ என வழங்கப்பட்டுள்ளது.
- source_word: שָׁעַף
  choice: சாஆப்
  rationale: தனிப்பட்ட பெயர்; שׁ ஒலி தமிழில் வாசிக்கத்தக்க ‘ச’ ஆகவும், நடுவிலுள்ள ע காரணமான உயிரிடைவேறுபாடு ‘ஆஅ’ எனவும், இறுதி ף ‘ப்’ எனவும் குறிக்கப்பட்டுள்ளது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில் சுருக்கமான வம்சப்பட்டியல் நடையைப் பேணுகிறது. பெயர்கள் மூல எபிரெய உரையிலிருந்து நேரடியாக எழுத்துப்பெயர்க்கப்பட்டுள்ளன; வசனத்தில் விளக்கக் குறிப்புகள் தேவையில்லை.
