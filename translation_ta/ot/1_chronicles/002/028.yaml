source:
  edition: WLC
  text: וַ/יִּהְי֥וּ בְנֵי אוֹנָ֖ם שַׁמַּ֣י וְ/יָדָ֑ע וּ/בְנֵ֣י שַׁמַּ֔י נָדָ֖ב וַ/אֲבִישֽׁוּר־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/028.yaml
  text: The sons of Onam were Shammai and Jada[a]. The sons of Shammai were Nadab and Abishur.
translation:
  language: ta
  text: ஓனாமின் மகன்கள் சம்மாயும் யாதாவும். சம்மாயின் மகன்கள் நாதாபும் அபிசூரும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: — (தமிழில் பெயர்ப்பயனிலை வாக்கிய அமைப்பு)
  rationale: வம்சப்பட்டியல் சூழலில் היה எளிய இணைப்புவினையாக உள்ளது. இயல்பான தமிழில் ‘ஆகியோர்’ அல்லது ‘இருந்தார்கள்’ என்று சேர்க்காமல் பெயர்ப்பயனிலை அமைப்பே ‘were’ என்ற பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: בְנֵי
  choice: மகன்கள்
  rationale: இங்கு உடனடியான ஆண் வழித்தோன்றல்கள் குறிக்கப்படுவதால், பொதுவான ‘பிள்ளைகள்’ அல்லது ‘வழித்தோன்றல்கள்’ என்பதைக் காட்டிலும் ‘மகன்கள்’ துல்லியமானது.
- source_word: אוֹנָם
  choice: ஓனாம்
  rationale: எபிரெய தனிப்பெயரின் ஒலிப்புக்கு ஏற்ற தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: שַׁמַּי
  choice: சம்மாய்
  rationale: தனிப்பெயர் மொழிபெயர்க்கப்படாமல் தமிழ் ஒலிபெயர்ப்பில் இரு இடங்களிலும் ஒரே வடிவில் தரப்பட்டுள்ளது.
- source_word: יָדָע
  choice: யாதா
  rationale: எபிரெய மெய்யெழுத்து மற்றும் உயிரொலிப்பை பிரதிபலிக்கும் தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: וּבְנֵי
  choice: சம்மாயின் மகன்கள்
  rationale: וְ என்ற இணைப்பைத் தமிழில் தனியாக ‘மேலும்’ எனக் கூறாமல், அடுத்த வம்சக் கிளையைத் தெளிவாக அறிமுகப்படுத்தும் இயல்பான வாக்கியமாக அமைக்கப்பட்டுள்ளது.
- source_word: נָדָב
  choice: நாதாப்
  rationale: எபிரெய தனிப்பெயரின் ஒலிப்புக்கு நெருக்கமான தமிழ் எழுத்துப்பெயர்ப்பு; வேற்றுமை உருபு இணைவதால் ‘நாதாபும்’ என வருகிறது.
- source_word: אֲבִישׁוּר
  choice: அபிசூர்
  rationale: எபிரெய தனிப்பெயரின் ஒலிப்புக்கு நெருக்கமான தமிழ் எழுத்துப்பெயர்ப்பு; வேற்றுமை உருபு இணைவதால் ‘அபிசூரும்’ என வருகிறது.
