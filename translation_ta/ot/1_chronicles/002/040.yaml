  register: நவீன நிலையான தமிழில், வம்சவரலாற்றுப் பட்டியலுக்கேற்ற சுருக்கமானதும் கண்ணியமானதும் எளிதில் புரியக்கூடியதுமான நடை பயன்படுத்தப்பட்டுள்ளது.
