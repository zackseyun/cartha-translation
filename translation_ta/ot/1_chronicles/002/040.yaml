translation:
  language: ta
  text: எலாசா சிஸ்மாயைப் பெற்றான்; சிஸ்மாய் சல்லூமைப் பெற்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶלְעָשָׂה
  choice: எலெயாசா
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் இயல்பாக எழுத்துப்பெயர்த்த வடிவம்.
- source_word: הֹלִיד
  choice: பெற்றான்
  rationale: יָלַד என்பதன் ஹிஃபில் வடிவம் இவ்வம்சவரலாற்றுச் சூழலில் ‘தந்தையானான்/பெற்றெடுத்தான்’ என்ற பொருளைக் குறிக்கிறது. ‘பெற்றான்’ என்பது சுருக்கமாகவும் இயல்பாகவும் வம்சத் தொடர்பைத் தெரிவிக்கிறது.
- source_word: אֶת
  choice: '[தனியாக மொழிபெயர்க்கப்படவில்லை]'
  rationale: இது நேரடிச் செயப்படுபொருளைக் குறிக்கும் இலக்கண அடையாளம்; தமிழில் ‘-ஐ’ வேற்றுமை உருபின் மூலம் அதன் பணி வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: סִסְמָי
  choice: சிஸ்மாய்
  rationale: எபிரெய தனிப்பெயரின் ஒலியமைப்பை நெருக்கமாகப் பின்பற்றும் தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: וְ
  choice: ;
  rationale: இரு இணையான வம்சவரலாற்றுக் கூற்றுகளின் தொடர்பு தமிழில் அரைப்புள்ளியால் இயல்பாகவும் தெளிவாகவும் காட்டப்பட்டுள்ளது; தனியே ‘மற்றும்’ சேர்ப்பது இங்கு தேவையில்லை.
- source_word: שַׁלּוּם
  choice: சல்லூம்
  rationale: எபிரெய தனிப்பெயரின் மெய்யிரட்டிப்பையும் நீண்ட உயிரொலியையும் பிரதிபலிக்கும் தமிழ் எழுத்துப்பெயர்ப்பு.
