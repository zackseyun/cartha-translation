id: 1CH.2.1
reference: 1 Chronicles 2:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: אֵ֖לֶּה בְּנֵ֣י יִשְׂרָאֵ֑ל רְאוּבֵ֤ן שִׁמְעוֹן֙ לֵוִ֣י וִ/יהוּדָ֔ה יִשָׂשכָ֖ר וּ/זְבֻלֽוּן׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/001.yaml
  text: 'These are the sons of Israel: Reuben, Simeon, Levi, Judah, Issachar, and Zebulun.'
translation:
  language: ta
  text: 'இஸ்ரவேலின் மகன்கள் இவர்களே: ரூபன், சிமியோன், லேவி, யூதா, இசக்கார், செபுலோன்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  choice: இவர்களே
  rationale: மனிதர்களின் பட்டியலை அறிமுகப்படுத்தும் பன்மைச் சுட்டுப்பெயர்; தமிழில் இயல்பாகவும் வலியுறுத்தலுடனும் அமைகிறது.
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: இங்கு இஸ்ரவேலின் ஆண் பிள்ளைகளே பெயரிட்டு வரிசைப்படுத்தப்படுவதால், பொதுவான ‘பிள்ளைகள்’ அல்லது ‘வழித்தோன்றல்கள்’ என்பதைக் காட்டிலும் துல்லியமானது.
- source_word: יִשְׂרָאֵל
  choice: இஸ்ரவேல்
  rationale: எபிரெய மூலத்தில் உள்ள உடன்படிக்கைப் பெயரையே தக்கவைக்கிறது; குறிக்கப்படுபவர் யாக்கோபு என்றாலும் பெயரை விளக்கமாக மாற்றவில்லை.
- source_word: רְאוּבֵן
  choice: ரூபன்
  rationale: தமிழ் வேதாகம மரபில் பரவலாக அறியப்படும் பெயர் வடிவம்.
- source_word: שִׁמְעוֹן
  choice: சிமியோன்
  rationale: தமிழ் வாசகர்களுக்கு பரிச்சயமான மரபுவழிப் பெயர் வடிவம்.
- source_word: לֵוִי
  choice: லேவி
  rationale: தமிழில் நிலைபெற்ற பெயர் வடிவம்.
- source_word: וִיהוּדָה
  choice: யூதா
  rationale: பெயரை நிலைபெற்ற தமிழ் வடிவில் தருகிறது; எபிரெய இணைப்புச் சொல் தமிழ் பட்டியல் நடைக்கு ஏற்ப நிறுத்தற்குறிகளால் வெளிப்படுகிறது.
- source_word: יִשָׂשכָר
  choice: இசக்கார்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரிச்சயமான பெயர் வடிவம்.
- source_word: וּזְבֻלוּן
  choice: செபுலோன்
  rationale: தமிழில் பரவலாக அறியப்படும் மரபுவழிப் பெயர் வடிவம்; இறுதி எபிரெய இணைப்புச் சொல் தமிழ் பட்டியலில் இயல்பாக மறைமுகமாக வெளிப்படுகிறது.
