translation_notes:
  register: நவீனத் தரத் தமிழ்; சுருக்கமான வம்சவரலாற்றுத் தலைப்பு நடை. பெயர்கள் சாதாரண தமிழ் வேதாகம வாசகர்களுக்குப் பரிச்சயமான மரபு வடிவங்களில் தரப்பட்டுள்ளன.
