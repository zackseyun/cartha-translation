  text: וּ/מִשְׁפְּחוֹת֙ קִרְיַ֣ת יְעָרִ֔ים הַ/יִּתְרִי֙ וְ/הַ/פּוּתִ֔י וְ/הַ/שֻּׁמָתִ֖י וְ/הַ/מִּשְׁרָעִ֑י מֵ/אֵ֗לֶּה יָצְאוּ֙ הַ/צָּ֣רְעָתִ֔י וְ/הָ/אֶשְׁתָּ֖אֻֽלִֽי׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/053.yaml
  text: 'And the clans of Kiriath-jearim: the Ithrites[a], the Puthites, the Shumathites, and the Mishraites[b]. From these came the Zorathites and the Eshtaolites.'
translation:
  language: ta
  text: 'கிரியாத்-யாரீமின் குலங்களாவன[a]: இத்திரியர், பூத்தியர், சுமாத்தியர், மிஷ்ராயியர். இவர்களிலிருந்து சோராத்தியரும் எஸ்தாவோலியரும் தோன்றினார்கள்[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘குடும்பங்கள்’ என்றும் மொழிபெயர்க்கலாம்; இங்கு வரும் எபிரெயச் சொல், வம்சப்பட்டியலில் பொதுவாக விரிவான உறவுவழிக் குழுக்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: நேர்ச்சொல்லாக, ‘வெளியே வந்தார்கள்’; இங்கு முன்னர் குறிப்பிடப்பட்ட குலங்களிலிருந்து இக்குழுக்கள் வழிவந்தன அல்லது உருவாயின என்பது பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִשְׁפְּחוֹת
  choice: குலங்கள்
  rationale: வம்சப்பட்டியல் சூழலில் מִשְׁפָּחוֹת என்பது தனிக்குடும்பங்களைவிட விரிவான உறவுவழிக் குழுக்களைக் குறிக்கிறது; தமிழில் ‘குலங்கள்’ இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: קִרְיַת יְעָרִים
  choice: கிரியாத்-யாரீம்
  rationale: இது இடப்பெயர் என்பதால் மொழிபெயர்க்காமல் எபிரெய ஒலிப்புக்கு அணுக்கமாக எழுத்துப்பெயர்க்கப்பட்டுள்ளது.
- source_word: הַיִּתְרִי
  choice: இத்திரியர்
  rationale: குலம் அல்லது இனக்குழுவைக் குறிக்கும் பெயர்; எபிரெய வடிவத்தைத் தமிழில் இயல்பாக எழுத்துப்பெயர்க்கிறது.
- source_word: וְהַפּוּתִי
  choice: பூத்தியர்
  rationale: குலப்பெயர் என்பதால் அதன் எபிரெய ஒலிவடிவம் தமிழில் எழுத்துப்பெயர்க்கப்பட்டுள்ளது.
- source_word: וְהַשֻּׁמָתִי
  choice: சுமாத்தியர்
  rationale: எபிரெய குலப்பெயரின் முழுமையான வடிவத்தை இயன்றவரை பாதுகாக்கும் எழுத்துப்பெயர்ப்பு.
- source_word: וְהַמִּשְׁרָעִי
  choice: மிஸ்ராயர்
  rationale: குலப்பெயரின் எபிரெய மெய்யொலி அமைப்பைத் தமிழில் தெளிவாகப் பிரதிபலிக்கும் எழுத்துப்பெயர்ப்பு.
- source_word: מֵאֵלֶּה
  choice: இவர்களிலிருந்து
  rationale: முன்னர் பட்டியலிடப்பட்ட குலங்களையே சுட்டுகிறது; மனிதக் குழுக்களைச் சுட்டும் தமிழில் ‘இவர்களிலிருந்து’ இயல்பானது.
- source_word: יָצְאוּ
  choice: தோன்றினார்கள்
  rationale: சொல்லுக்கு நேரடியாக ‘வெளியே வந்தார்கள்’ என்ற பொருள் இருந்தாலும், இவ்வம்சப்பட்டியல் சூழலில் ஒரு குழுவிலிருந்து மற்ற குழுக்கள் உருவான அல்லது வழிவந்த கருத்தை ‘தோன்றினார்கள்’ தெளிவாகவும் அளவுக்கு மீறிய விளக்கமின்றியும் தருகிறது.
- source_word: הַצָּרְעָתִי
  choice: சோராத்தியர்
  rationale: சோரா என்ற இடத்துடன் தொடர்புடைய குடியினரைக் குறிக்கும் பெயரை எபிரெய வடிவத்துக்கு அணுக்கமாக எழுத்துப்பெயர்க்கிறது.
- source_word: וְהָאֶשְׁתָּאֻלִי
  choice: எஸ்தாவோலியர்
  rationale: எஸ்தாவோல் என்ற இடத்திலிருந்து உருவான குடிப்பெயரைத் தமிழில் அடையாளம் காணக்கூடிய வகையில் எழுத்துப்பெயர்க்கிறது.
