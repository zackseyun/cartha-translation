    rationale: The Hebrew has שׁ (sh) and ends in -āʿî. “மிஷ்ராயியர்” better preserves the name’s consonant and gentilic ending, while matching the treatment of the other group names.
  - severity: low
    issue: The opening list lacks an explicit Tamil copular/list-introducing expression.
    rationale: “குலங்களாவன:” is a natural, compact way to introduce the enumerated clans and reflects the Hebrew nominal construction clearly.
