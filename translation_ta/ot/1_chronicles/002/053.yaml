translation_notes:
  register: நவீன நிலையான தமிழில், வம்சப்பட்டியலுக்கேற்ற சுருக்கமான மற்றும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. இடப்பெயர்களும் குலப்பெயர்களும் எபிரெய மூல ஒலிகளுக்கு அணுக்கமாக எழுத்துப்பெயர்க்கப்பட்டுள்ளன; பெயர்களுக்குப் பன்மை மனிதர் விகுதியான ‘-யர்/ர்’ பயன்படுத்தப்பட்டுள்ளது.
