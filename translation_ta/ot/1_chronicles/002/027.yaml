source:
  edition: WLC
  text: וַ/יִּהְי֥וּ בְנֵי רָ֖ם בְּכ֣וֹר יְרַחְמְאֵ֑ל מַ֥עַץ וְ/יָמִ֖ין וָ/עֵֽקֶר־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/027.yaml
  text: 'The sons of Ram: Jerahmeel the firstborn[a], Maaz, Jamin, and Eker.'
translation:
  language: ta
  text: 'யெரக்மெயேலின் முதற்பேறான ராமின் மகன்கள்[a]: மாஸ், யாமின், ஏக்கேர்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “யெரக்மெயேலின் முதற்பேறான ராமின் மகன்கள் மாஸ், யாமின், ஏக்கேர் ஆகியோர் இருந்தார்கள்” என்று உள்ளது.
    reason: எபிரெய வினை வம்சப் பட்டியலை அறிமுகப்படுத்துகிறது; “யெரக்மெயேலின் முதற்பேறான” என்பது ராமைக் குறிக்கிறது.
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: 'மகன்கள்:'
  rationale: வம்சப் பட்டியலை அறிமுகப்படுத்தும் ‘அவர்கள் இருந்தார்கள்’ என்ற எபிரெயச் சொல்லாட்சியை, இயல்பான தமிழில் முக்காற்புள்ளியுடன் கூடிய பட்டியலாக வழங்குகிறது; அதன் பட்டியலிடும் பணி தக்கவைக்கப்படுகிறது.
- source_word: בְנֵי
  choice: மகன்கள்
  rationale: இங்கு பெயரிடப்பட்டவர்கள் ஆண் சந்ததியினர் என்பதால், வம்சவரலாற்றுச் சூழலில் நேரடியான பொருள் ஏற்றது.
- source_word: רָם
  choice: ராம்
  rationale: எபிரெய தனிப்பெயரின் ஒலிபெயர்ப்பு.
- source_word: בְּכוֹר יְרַחְמְאֵל
  choice: யெரக்மெயேலின் முதற்பேறான
  rationale: எபிரெயத் தொடரும் உடனுள்ள வம்சவரலாற்றுச் சூழலும் ராமை யெரக்மெயேலின் முதற்பேறாக அடையாளப்படுத்துகின்றன.
- source_word: מַעַץ
  choice: மாஸ்
  rationale: எபிரெய தனிப்பெயரின் தமிழ் ஒலிபெயர்ப்பு; இறுதி צ ஒலியை ‘ஸ்’ மூலம் இயல்பாகக் குறிக்கிறது.
- source_word: יָמִין
  choice: யாமின்
  rationale: இங்கு பொதுப்பெயர்ப் பொருள் அல்ல, தனிப்பெயர்; எபிரெய உச்சரிப்பை அணுகிய ஒலிபெயர்ப்பு.
- source_word: עֵקֶר
  choice: ஏக்கேர்
  rationale: எபிரெய தனிப்பெயரின் ஒலியமைப்பை அணுகிய தமிழ் ஒலிபெயர்ப்பு.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில் சுருக்கமான வம்சப் பட்டியல் நடை பயன்படுத்தப்பட்டுள்ளது. தனிப்பெயர்கள் எபிரெய மூலத்துக்கு அண்மையாக ஒலிபெயர்க்கப்பட்டுள்ளன. ஆங்கில ஆலோசனை உரையிலிருந்து மாறாக, மூல எபிரெயமும் 1 நாளாகமம் 2:25–27 சூழலும் காட்டுவதுபோல் ‘முதற்பேறான’ என்பது யெரக்மெயேலை அல்ல, ராமைக் குறிக்கும் வகையில் மொழிபெயர்க்கப்பட்டுள்ளது.
