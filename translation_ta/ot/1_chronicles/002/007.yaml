  edition: WLC
  text: וּ/בְנֵ֖י כַּרְמִ֑י עָכָר֙ עוֹכֵ֣ר יִשְׂרָאֵ֔ל אֲשֶׁ֥ר מָעַ֖ל בַּ/חֵֽרֶם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/007.yaml
  text: 'And the sons of Karmi: Achar[a], the troubler of Israel[b], who acted unfaithfully regarding the devoted things.'
translation:
  language: ta
  text: 'கர்மியின் மகன்கள்: இஸ்ரவேலைத் துன்புறுத்திய ஆகார்[a]; அவன் அழிவுக்கென்று ஒதுக்கப்பட்டவற்றின் விஷயத்தில் துரோகமாக நடந்துகொண்டான்[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஆகான்.’ யோசுவா 7-இல் பெயர் இவ்வாறு வருகிறது. இங்கு நாளாகமம் ‘ஆகார்’ என்ற வடிவத்தைப் பயன்படுத்துகிறது; இது ‘இஸ்ரவேலைத் துன்புறுத்தியவன்’ என்பதற்கான எபிரெயச் சொல்லுடன் சொல்விளையாட்டை ஏற்படுத்துகிறது.
    reason: alternative_reading
  - marker: b
    text: எபிரெயத்தில், ‘அழிவுக்கென்று ஒதுக்கப்பட்ட பொருள்’ என்று ஒருமையில் உள்ளது. இது கடவுளுக்கென முற்றிலும் ஒதுக்கப்பட்டு அழிக்கப்பட வேண்டியவற்றைக் குறிக்கிறது; இச்சூழலில் அது கூட்டுப்பொருளில் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי כַּרְמִי
  choice: கர்மியின் மகன்கள்
  rationale: எபிரெய மரபுப்பட்டியல் வடிவிலுள்ள இணைப்பையும் பன்மையையும் இயல்பான தமிழில் காக்கிறது.
- source_word: עָכָר
  choice: ஆகார்
  rationale: யோசுவா 7-இல் காணப்படும் ‘ஆகான்’ என்ற பழக்கமான வடிவத்துடன் ஒத்திசைக்காமல், நாளாகம எபிரெய உரையிலுள்ள עָכָר என்ற பெயர் வடிவத்தைப் பாதுகாக்கிறது.
- source_word: עוֹכֵר יִשְׂרָאֵל
  choice: இஸ்ரவேலுக்குத் துன்பம் விளைவித்த இவன்
  rationale: Qal வினையெச்சத்தின் விளக்கப் பயன்பாட்டைத் தெளிவான நவீன தமிழில் தருகிறது. பெயருக்கும் வினைச்சொல்லுக்கும் இடையிலான எபிரெயச் சொல்விளையாட்டு அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: מָעַל
  choice: நம்பிக்கைத் துரோகம் செய்தான்
  rationale: பரிசுத்தமானதாக ஒதுக்கப்பட்டவற்றைப் பற்றிய விசுவாசமின்மை, நம்பிக்கை மீறல் ஆகிய מעל என்பதன் அற மற்றும் சமயப் பரிமாணங்களை வெளிப்படுத்துகிறது.
- source_word: בַּחֵרֶם
  choice: அழிவுக்கென்று அர்ப்பணிக்கப்பட்ட பொருள்களின் விஷயத்தில்
  rationale: חֵרֶם என்பதன் கூட்டு அர்த்தத்தையும், கடவுளுக்கென ஒதுக்கப்பட்டு அழிவுக்கு உட்படுத்தப்பட்ட பொருட்கள் என்ற சூழலையும் தெளிவாகத் தருகிறது.
theological_decisions:
- issue: חֵרֶם என்ற சொல்லில் அர்ப்பணிப்பும் அழிவுக்கான தடையாணையும் இணைந்திருத்தல்
  choice: அழிவுக்கென்று அர்ப்பணிக்கப்பட்ட பொருள்கள்
  alternative: தடையாணைக்குட்பட்ட பொருள்கள்; அர்ப்பணிக்கப்பட்ட பொருள்
  rationale: இச்சொல் வெறும் பொதுவான அர்ப்பணிப்பைக் குறிக்கவில்லை; கடவுளுக்கென முற்றிலும் ஒதுக்கப்பட்டு, இச்சூழலில் அழிக்கப்பட வேண்டியவற்றைக் குறிக்கிறது. அதேவேளை விளக்கத்தை அளவுக்கு மீறி விரிவாக்காமல் அதன் இரு கூறுகளையும் மொழிபெயர்ப்பு காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் உள்ள நடையைக் கடைப்பிடிக்கிறது. ‘ஆகார்’ என்ற அரிதான பெயர் வடிவமும் חֵרֶם என்பதன் தனித்துவமான கருத்தும் அடிக்குறிப்புகளால் விளக்கப்படுகின்றன.
