  to: 'கர்மியின் மகன்கள்: இஸ்ரவேலைத் துன்புறுத்திய ஆகார்[a]; அவன் அழிவுக்கென்று ஒதுக்கப்பட்டவற்றின் விஷயத்தில் துரோகமாக நடந்துகொண்டான்[b].'
