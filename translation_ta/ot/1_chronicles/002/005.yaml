  source_fidelity: 'எபிரெய மூலத்தின் அமைப்பும் பொருளும் துல்லியமாகக் கொடுக்கப்பட்டுள்ளன: פֶרֶץ என்பவரின் நேரடி மகன்களாக חֶצְרוֹן மற்றும் חָמוּל பட்டியலிடப்படுகின்றனர். இணைப்புச் சொல்லான וְ தமிழில் இரண்டாவது பெயருடன் வரும் “-உம்” மூலம் இயல்பாக வெளிப்படுகிறது.'
  naturalness: '“பேரேசின் மகன்கள்: எஸ்ரோனும் ஆமூலும்” என்பது சுருக்கமான வம்சவரலாற்று நடையில் நவீனத் தரத் தமிழுக்கு இயல்பானது. பெயர்ப் பட்டியலில் இரு பெயர்களோடும் “-உம்” சேர்ப்பது தெளிவாகவும் பொருத்தமாகவும் உள்ளது.'
  terminology: “மகன்கள்” என்பது இவ்வசனத்தில் நேரடி பிள்ளைகளையே குறிக்கும் בְּנֵי என்பதற்குச் சரியான தேர்வு. “பேரேசின்” என்பது தேர்ந்தெடுக்கப்பட்ட பெயர்வடிவமான “பேரேஸ்” என்பதன் இயல்பான வேற்றுமை வடிவமாகும்; எஸ்ரோன், ஆமூல் ஆகிய பெயர்வடிவங்களும் ஏற்றவை.
