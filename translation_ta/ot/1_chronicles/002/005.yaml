lexical_decisions:
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: בֵּן என்பதன் பன்மை இணைப்பு வடிவம். இங்கு நேரடி ஆண் பிள்ளைகளின் பெயர்கள் தரப்படுவதால், பொதுவான ‘வழித்தோன்றல்கள்’ என்பதற்குப் பதிலாக ‘மகன்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: פֶרֶץ
  choice: பேரேஸ்
  rationale: எபிரெய தனிப்பெயரின் ஒலியை நவீன தமிழில் இயல்பாகக் குறிக்கும் எழுத்துப்பெயர்ப்பு.
- source_word: חֶצְרוֹן
  choice: எஸ்ரோன்
  rationale: எபிரெய தனிப்பெயரைத் தமிழின் நிலைபெற்ற வேதாகமப் பெயர்வடிவத்துக்கு நெருக்கமாக எழுத்துப்பெயர்த்தல்.
- source_word: וְחָמוּל
  choice: ஆமூலும்
  rationale: וְ இணைப்பை ‘-உம்’ என இயல்பாகக் காட்டி, חָמוּל என்ற தனிப்பெயரைத் தமிழில் ‘ஆமூல்’ என எழுத்துப்பெயர்த்துள்ளது.
