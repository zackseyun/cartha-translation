source:
  edition: WLC
  text: וּ/בְנֵ֥י יְדִיעֲאֵ֖ל בִּלְהָ֑ן וּ/בְנֵ֣י בִלְהָ֗ן יעיש וּ֠/בִנְיָמִן וְ/אֵה֤וּד וּֽ/כְנַעֲנָה֙ וְ/זֵיתָ֔ן וְ/תַרְשִׁ֖ישׁ וַ/אֲחִישָֽׁחַר׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/010.yaml
  text: 'And the sons of Jediael: Bilhan. And the sons of Bilhan: Jeush[a], Benjamin, Ehud, Chenaanah, Zethan, Tarshish, and Ahishahar.'
translation:
  language: ta
  text: 'யெதியேலின் மகன்கள்: பில்ஹான். பில்ஹானின் மகன்கள்: யெயூஷ்[a], பென்யமீன், ஏஹூத், கெனானா, சேத்தான், தர்ஷீஷ், அஹிஷஹர்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: முதல் மகனின் எபிரேயப் பெயர் இங்கு வழக்கத்திற்கு மாறான வடிவில் (יעיש) உள்ளது. இந்த வம்சவரிசையில் குறிக்கப்பட்டிருக்கக்கூடிய பெயரைப் பின்பற்றி “யெயூஷ்” என்று எழுத்துப்பெயர்க்கப்பட்டுள்ளது; “யாயிஷ்” அல்லது “யாய்ஷ்” என்பவையும் சாத்தியமான வாசிப்புகள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: மகன்கள்
  rationale: இந்த நேரடி வம்சவரிசைப் பட்டியலில் בֵּן என்பதற்கு இயல்பான பொருள் ‘மகன்கள்’; ‘வழித்தோன்றல்கள்’ என்ற விரிவான பொருள் இங்கு தேவையில்லை.
- source_word: יְדִיעֲאֵל
  choice: எதியேல்
  rationale: எபிரேய தனிப்பெயரின் ஒலியைத் தமிழில் இயன்றவரை இயல்பாக எழுத்துப்பெயர்த்துள்ளது.
- source_word: בִּלְהָן
  choice: பில்கான்
  rationale: தனிப்பெயர்; எபிரேய ஒலிப்புக்கு நெருக்கமாகத் தமிழ் எழுத்துப்பெயர்ப்பு செய்யப்பட்டுள்ளது.
- source_word: וּבְנֵי בִלְהָן
  choice: 'பில்கானின் மகன்கள்:'
  rationale: மூலத்தின் மீளும் வம்சவரிசை அமைப்பைப் பேணுகிறது; பட்டியலைத் தெளிவுபடுத்த முக்காற்புள்ளி இடப்பட்டுள்ளது.
- source_word: יעיש
  choice: யெயூஷ்
  rationale: மசோரெட்டிக் வடிவம் வழக்கத்திற்கு மாறானதாக இருந்தாலும், இவ்வம்சவரிசையில் பெரும்பாலும் குறிக்கப்படுவது יְעוּשׁ என்ற தனிப்பெயராக இருக்கலாம்; அந்தச் சாத்தியத்தைப் பின்பற்றி எழுத்துப்பெயர்க்கப்பட்டுள்ளது.
- source_word: וּבִנְיָמִן
  choice: பென்யமீன்
  rationale: எபிரேயப் பெயரின் ஒலியை அடிப்படையாகக் கொண்ட தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: וְאֵהוּד
  choice: ஏகூத்
  rationale: எபிரேயப் பெயரின் மெய்யொலிகளைப் பிரதிபலிக்கும் தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: וּכְנַעֲנָה
  choice: கெனானா
  rationale: இது ‘கானான்’ என்ற இடம் அல்லது இனத்தைக் குறிக்காமல், வம்சவரிசையிலுள்ள தனிப்பெயராக உள்ளது.
- source_word: וְזֵיתָן
  choice: சேத்தான்
  rationale: எபிரேய தனிப்பெயரின் ஒலிப்பைத் தமிழில் இயல்பாகப் பிரதிபலிக்கிறது.
- source_word: וְתַרְשִׁישׁ
  choice: தர்ஷீஷ்
  rationale: வேறு இடங்களில் இடப்பெயராக வரக்கூடிய இச்சொல், இங்கு சூழலின்படி ஒருவரின் பெயராக எழுத்துப்பெயர்க்கப்பட்டுள்ளது.
- source_word: וַאֲחִישָׁחַר
  choice: அகிஷாகர்
  rationale: எபிரேய வடிவத்தை வேறு பரிச்சயமான பெயருடன் ஒத்திசைக்காமல் நேரடியாக எழுத்துப்பெயர்க்கப்பட்டுள்ளது.
