source:
  edition: WLC
  text: וְ/זָבָ֥ד בְּנ֛/וֹ וְ/שׁוּתֶ֥לַח בְּנ֖/וֹ וְ/עֵ֣זֶר וְ/אֶלְעָ֑ד וַ/הֲרָג֗וּ/ם אַנְשֵׁי גַת֙ הַ/נּוֹלָדִ֣ים בָּ/אָ֔רֶץ כִּ֣י יָרְד֔וּ לָ/קַ֖חַת אֶת מִקְנֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/021.yaml
  text: Zabad his son[a], and Shuthelah his son, and Ezer and Elead; the men of Gath who were born in the land killed them[b], because they had gone down to take their livestock.
translation:
  language: ta
  text: அவனுடைய மகன் சாபாத், அவனுடைய மகன் சூத்தெலாக், ஏசேர், எலெயாத் ஆகியோர்; நாட்டில் பிறந்த காத்தைச் சேர்ந்த ஆண்கள்[a] அவர்களைக் கொன்றார்கள். ஏனெனில், அவர்கள் காத் ஆண்களின் கால்நடைகளை எடுத்துக்கொள்ள இறங்கிச் சென்றிருந்தார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “காத்தைச் சேர்ந்த பூர்வீக ஆண்கள்.” எபிரெயில் சொல்லுக்குச் சொல், “நாட்டில் பிறந்த காத்தைச் சேர்ந்த ஆண்கள்” என்று உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: “இறங்கிச் சென்றிருந்தார்கள்” என்பதன் எழுவாய், சூழலின்படி அருகில் குறிப்பிடப்பட்டுள்ள ஏசேரும் எலெயாதும் ஆவர்.
    reason: cross_reference
lexical_decisions:
- source_word: בְּנוֹ
  choice: அவனுடைய மகன்
  rationale: மூன்றாம் நபர் ஆண்பால் ஒருமை பின்னொட்டுடன் வரும் ‘மகன்’ என்ற உறவுமுறையை இயல்பான தமிழ் மரபுப்பட்டியல் நடையில் தருகிறது; எபிரெய உரையில் இருமுறை வருவதால் இருமுறையும் தக்கவைக்கப்பட்டது.
- source_word: וְעֵזֶר וְאֶלְעָד
  choice: ஏசேர், எலெயாத்
  rationale: இவை ஆட்பெயர்கள் என்பதால் எபிரெய ஒலிப்புக்கு நெருக்கமாக எழுத்துப்பெயர்க்கப்பட்டன; தமிழ் பட்டியல் நடைக்கேற்ப இறுதியில் ‘ஆகியோர்’ சேர்க்கப்பட்டது.
- source_word: וַהֲרָגוּם
  choice: அவர்களைக் கொன்றார்கள்
  rationale: הרג என்பதன் நேரடியான பொருள் ‘கொல்’; 3ஆம் நபர் பன்மை செயப்படுபொருள் பின்னொட்டு ‘அவர்களை’ எனத் தரப்பட்டது.
- source_word: אַנְשֵׁי גַת
  choice: காத் ஊர் ஆண்கள்
  rationale: אַנְשֵׁי என்பது இங்கு பொதுவாக ‘ஆண்கள்’ என்பதைக் குறிக்கிறது; காத் ஓர் இடப்பெயர் என்பதை சாதாரண வாசகர் தெளிவாக உணர ‘ஊர்’ பயன்படுத்தப்பட்டது.
- source_word: הַנּוֹלָדִים בָּאָרֶץ
  choice: அந்த நாட்டிலேயே பிறந்த
  rationale: ‘நாட்டில் பிறந்தவர்கள்’ என்ற எபிரெய தொடரை நெருக்கமாகப் பாதுகாக்கிறது; ‘-லேயே’ என்பது அவர்கள் அந்நாட்டைச் சேர்ந்த பூர்வகுடியினர் என்ற உட்பொருளை இயல்பாகச் சுட்டுகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: கொலைக்கான காரணத்தை அறிமுகப்படுத்தும் இணைப்புச் சொல்லாக தெளிவாக அமைகிறது.
- source_word: יָרְדוּ
  choice: இறங்கிச் சென்றிருந்தார்கள்
  rationale: ‘இறங்கு’ என்ற திசை உணர்வைத் தக்கவைத்து, கொலைக்கு முன்பே நிகழ்ந்த செயலைத் தமிழில் நிறைவுற்ற இறந்தகால வடிவில் காட்டுகிறது.
- source_word: לָקַחַת
  choice: பிடித்துக்கொள்ள
  rationale: לקח என்பதன் பரந்த ‘எடுத்துக்கொள்’ பொருளை வைத்திருந்தாலும், பிறருடைய கால்நடைகளை எடுத்துச் செல்லும் சூழலில் நோக்கத்தை இயல்பாக வெளிப்படுத்துகிறது; ‘கொள்ளையிட’ என்று மிகையாகத் தீர்மானிக்கவில்லை.
- source_word: מִקְנֵיהֶם
  choice: அந்த ஆண்களின் கால்நடைகளை
  rationale: מִקְנֶה என்பது மந்தைகள் உள்ளிட்ட கால்நடைகளைக் குறிக்கிறது. எபிரெய 3ஆம் நபர் பன்மை உரிமைப் பின்னொட்டின் சுட்டுப்பொருளைத் தமிழில் தெளிவாக்க ‘அந்த ஆண்களின்’ என வழங்கப்பட்டது.
theological_decisions:
- issue: יָרְדוּ (‘இறங்கிச் சென்றார்கள்’) என்பதன் எழுவாய்
  choice: முதன்மை உரையில் ‘அவர்கள்’ என்று வைத்து, அடிக்குறிப்பில் சூழல்சார் அடையாளத்தைத் தெரிவித்தல்
  alternative: ‘ஏசேரும் எலெயாதும்’ என்று முதன்மை உரையிலேயே வெளிப்படையாகக் குறிப்பிடுதல்
  rationale: எபிரெய வினை பன்மையில் மட்டுமே இருப்பதால் எழுவாயின் பெயரை நேரடியாகக் கூறவில்லை. அருகிலுள்ள பன்மை முன்னோடிகளான ஏசேரும் எலெயாதும் எழுவாயாக இருப்பது சூழலுக்கு ஏற்றது; இருப்பினும் மூலத்தின் இலக்கணத் தெளிவின்மையை முற்றிலும் அகற்றாமல் பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் எளிமையும் கொண்ட வரலாற்று-மரபுப்பட்டியல் நடை பயன்படுத்தப்பட்டது. மூலத்தில் உள்ள பட்டியல் அமைப்பை அரைப்புள்ளி மூலம் தெளிவுபடுத்தி, இடப்பெயர்களும் ஆட்பெயர்களும் எபிரெய ஒலிப்புக்கு நெருக்கமாக எழுத்துப்பெயர்க்கப்பட்டன.
