  rationale: நேரடியாக ‘அதன் மகள்கள்’ என்றாலும், முதன்மை நகரத்துக்குக் கீழ்ப்பட்ட சிறிய பட்டணங்கள் அல்லது கிராமங்களைக் குறிக்கும் எபிரெய மரபுத்தொடரின் பொருளைத் தெளிவாக எடுத்துரைக்கிறது; நேரடிப் படிமம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: נַעֲרָן
  choice: நாரான்
  rationale: மசோரா உயிர்க்குறிப்புகளுடன் உள்ள வடிவத்துக்கு நெருக்கமான தமிழ் ஒலிபெயர்ப்பு; ‘நாரா’ என்ற தொடர்புடைய மரபு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: גֶּזֶר
  choice: கெசேர்
  rationale: எபிரெய இடப்பெயரின் தமிழ் ஒலிபெயர்ப்பு.
- source_word: שְׁכֶם
  choice: சீகேம்
  rationale: எபிரெய இடப்பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு வடிவம்.
- source_word: עַד
