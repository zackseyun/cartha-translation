  source_fidelity: மூல எபிரெயப் பட்டியல் அமைப்பும் இடப்பெயர்களும் பெரும்பாலும் சரியாகப் பிரதிபலிக்கப்படுகின்றன. ஆனால் பிரதான உரையில் கெசேர் இடப்பெயர் ‘கெசேரும்’ என வந்திருப்பது வழங்கப்பட்ட ஒலிபெயர்ப்பு முடிவான ‘கெசேர்’ என்பதோடு பொருந்தவில்லை. மேலும் עַיָּה என்பதற்கு ‘அய்யா’ என்ற வடிவம் மூல ஒலிக்கு நெருக்கமானது; ‘ஐயா’ நவீனத் தமிழில் பொதுவான விளிச்சொல்லாகவும் வேறுபட்ட உயிரொலியுடனும் புரியலாம்.
  naturalness: ‘நில உடைமைகளும் குடியிருப்புகளும் இவையே’ என்பது புவியியல் பட்டியலுக்குத் தெளிவான, நவீனத் தரத் தமிழ் நடை. ‘அதைச் சார்ந்த சிற்றூர்கள்’ என்ற தொடர் இயல்பாக உள்ளது; ஒவ்வொரு நகரப்பெயருடனும் அதற்குரிய சிற்றூர்களைத் தெளிவாக இணைக்கிறது.
  terminology: ‘சிற்றூர்கள்’ என்பது בְּנֹתֶיהָ என்ற இடவியல் மரபுத்தொடருக்குப் பொருத்தமான பொருள்விளக்கமாகும்; அதன் நேரடிப் படிமமும் பொருளும் அடிக்குறிப்பில் உரியவாறு தரப்பட்டுள்ளன. பெத்தேல், நாரான், கெசேர், சீகேம், அய்யா ஆகிய ஒலிபெயர்ப்புகள் ஒரே முறையில் வழங்கப்பட்டுள்ளன.
