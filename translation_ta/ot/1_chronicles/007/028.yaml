  revision_rationale: 'இரு பாதுகாப்பான திருத்தங்கள் செய்யப்பட்டுள்ளன: கெசேர் என்ற இடப்பெயரின் எழுத்துரு உரை முழுவதும் ஒருமைப்படுத்தப்பட்டது; עַיָּה-வின் ஒலிபெயர்ப்பு ‘அய்யா’ எனத் திருத்தப்பட்டது. ‘உடைமைப்பகுதிகள்’ என்பதற்குப் பதிலாக ‘நில உடைமைகள்’ பயன்படுத்தப்பட்டு, அֲחֻזָּתָם-இன் நிலப்பரப்பு சார்ந்த பொருள் நவீனத் தமிழில் இயல்பாகத் தெரிவிக்கப்பட்டுள்ளது. அடிக்குறிப்புக் குறிகள் அவை விளக்கும் சொற்களோடு இணைந்தே உள்ளன; உரைமாற்றச் சான்று குறித்த ஐயப்பாடும் பாதுகாக்கப்பட்டுள்ளது.'
