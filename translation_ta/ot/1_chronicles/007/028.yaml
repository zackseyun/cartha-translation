translation_notes:
  register: நவீனத் தரத் தமிழில், கண்ணியமானவும் சாதாரண வாசகர்களுக்குப் புரியக்கூடியவுமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய வாக்கியத்தின் புவியியல் பட்டியல் அமைப்பு பேணப்பட்டுள்ளது. ‘மகள் நகரங்கள்’ என்ற சொல்லுக்குச் சொல் வடிவம் பிரதான உரையில் இயல்பற்றதாக இருப்பதால் பொருள் சார்ந்த ‘சார்ந்த சிற்றூர்கள்’ பயன்படுத்தப்பட்டு, மூலப்படிமம் அடிக்குறிப்பில் குறிப்பிடப்பட்டுள்ளது. ஆங்கில ஆலோசனை உரையில் இடம் மாறியிருந்த அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்களோடு நேரடியாக இணைக்கப்பட்டுள்ளன.
