  revised_text: 'அவர்களுடைய நில உடைமைகளும் குடியிருப்புகளும் இவையே: பெத்தேலும் அதைச் சார்ந்த சிற்றூர்களும்,[b] கிழக்கே நாரானும்,[a] மேற்கே கெசேரும் அதைச் சார்ந்த சிற்றூர்களும், சீகேமும் அதைச் சார்ந்த சிற்றூர்களும், அய்யா[c] வரையிலும் அதைச் சார்ந்த சிற்றூர்களும் ஆகும்.


    [a] இங்குள்ள நாரான் என்ற இடப்பெயர், வேறொரு இடத்தில் காணப்படும் தொடர்புடைய இடப்பெயர் மரபின் அடிப்படையில் சிலரால் ‘நாரா’ என்று மொழிபெயர்க்கப்படுகிறது.


    [b] எபிரெய மொழியில் நேரடியாக ‘அதன் மகள்கள்’ என்று உள்ளது. இது ஒரு முதன்மை நகரத்தைச் சார்ந்த சிறிய பட்டணங்களையோ கிராமங்களையோ குறிக்கும் மரபுத்தொடர்.


    [c] எபிரெய மூலப்பாடத்தில் ‘அய்யா’ என்று உள்ளது; சில பழங்காலச் சான்றுகளும் மொழிபெயர்ப்புகளும் இதற்குப் பதிலாக ‘காசா’ என்ற இடப்பெயரைப் பிரதிபலிக்கின்றன.'
