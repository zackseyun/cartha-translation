- source_word: אֲחֻזָּתָם
  choice: அவர்களுடைய உடைமைப்பகுதிகள்
  rationale: நிலப்பரப்பு சார்ந்த உரிமையையும் உடைமையையும் குறிக்கும் சொல்லாக இருப்பதால், பின்வரும் புவியியல் பட்டியலுக்கு ஏற்றவாறு ‘உடைமைப்பகுதிகள்’ என வழங்கப்பட்டது.
- source_word: מֹשְׁבוֹתָם
  choice: குடியிருப்புகள்
  rationale: இந்த நிலப்பரப்பு சூழலில் மக்கள் வாழ்ந்த இடங்களைக் குறிக்கிறது; நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: בְנֹתֶיהָ
