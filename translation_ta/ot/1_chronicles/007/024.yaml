  text: His daughter was Sheerah[a], and she built Lower Beth-horon and Upper Beth-horon[b], and Uzzen-sheerah.
translation:
  language: ta
  text: அவனுடைய மகளான ஷீரா[a], கீழ் பெத்-ஹோரோனையும் மேல் பெத்-ஹோரோனையும்[b] உஸ்ஸேன்-ஷீராவையும் கட்டினாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல் முறையில், “அவனுடைய மகளும் ஷீரா [இருந்தாள்]” என்று உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் “மேலிருப்பது” என்று மட்டுமே உள்ளது; முந்தைய சொற்றொடரிலிருந்து “பெத்-ஹோரோன்” என்பது பொருளில் கொள்ளப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִתּוֹ שֶׁאֱרָה
  choice: அவனுடைய மகளான செரா
  rationale: எபிரெயச் சொற்றொடர் சொல்லுக்குச் சொல் முறையில் ‘அவனுடைய மகளும், செரா’ என அமைகிறது. தமிழில் வம்சவரலாற்று நடைக்கு இயல்பாகவும் உறவையும் பெயரையும் தெளிவாகவும் காட்ட ‘அவனுடைய மகளான செரா’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: וַתִּבֶן
  choice: கட்டினாள்
  rationale: בנה என்ற வினையின் வழக்கமான பொருள் ‘கட்டு’. நகரங்களை நிறுவினாள் அல்லது மறுகட்டினாள் என்று மூலத்தில் இல்லாத குறிப்பைச் சேர்க்காமல் அடிப்படைப் பொருள் காக்கப்பட்டது.
- source_word: בֵּית חוֹרוֹן הַתַּחְתּוֹן
  choice: கீழ் பெத்-ஓரோன்
  rationale: இடப்பெயர் ஒலிபெயர்க்கப்பட்டு, הַתַּחְתּוֹן என்பதன் ‘கீழ்’ என்ற வேறுபடுத்தும் அடைமொழி இயல்பான தமிழ்ச் சொல்லடுக்கில் முன்வைக்கப்பட்டது.
- source_word: הָעֶלְיוֹן
  choice: மேல் பெத்-ஓரோன்
  rationale: எபிரெயத்தில் ‘மேலுள்ளது’ என்பது மட்டும் வந்தாலும், இணையான முந்தைய தொடரிலிருந்து ‘பெத்-ஓரோன்’ என்பது பொருளில் உள்ளடங்குகிறது. தமிழில் தெளிவுக்காக அது மீண்டும் வழங்கப்பட்டது.
- source_word: אֻזֵּן שֶׁאֱרָה
  choice: உசென்-செரா
  rationale: இது ஒரே கூட்டிடப்பெயராக இருப்பதைத் தெளிவாக்க, இரு கூறுகளும் ஒலிபெயர்க்கப்பட்டு இடைக்கோட்டுடன் எழுதப்பட்டன.
