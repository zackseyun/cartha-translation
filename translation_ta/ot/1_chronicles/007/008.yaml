translation_notes:
  register: நவீன நிலையான தமிழில், வம்சப்பட்டியலுக்கேற்ற சுருக்கமான மற்றும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. பெயர்கள் ஆங்கில வடிவத்தை அப்படியே சாராமல், முதன்மையாக WLC எபிரேய உரையின் ஒலியமைப்பிலிருந்து தமிழாக்கப்பட்டுள்ளன.
