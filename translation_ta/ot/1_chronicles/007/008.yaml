id: 1CH.7.8
reference: 1 Chronicles 7:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וּ/בְנֵ֣י בֶ֗כֶר זְמִירָ֡ה וְ/יוֹעָ֡שׁ וֶ֠/אֱלִיעֶזֶר וְ/אֶלְיוֹעֵינַ֤י וְ/עָמְרִי֙ וִ/ירֵמ֣וֹת וַ/אֲבִיָּ֔ה וַ/עֲנָת֖וֹת וְ/עָלָ֑מֶת כָּל אֵ֖לֶּה בְּנֵי בָֽכֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/008.yaml
  text: 'And the sons of Becher: Zemirah[a], Joash, Eliezer, Elioenai, Omri, Jeremoth, Abijah, Anathoth, and Alemeth. All these were the sons of Becher.'
translation:
  language: ta
  text: 'பெகேரின் மகன்கள்: செமீரா, யோவாஸ், எலியேசர், எலியோயேனாய், ஒம்ரி, எரேமோத்[a], அபியா, ஆனதோத், அலேமேத். இவர்கள் அனைவரும் பெகேரின் மகன்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இந்தப் பெயர் சில மொழிபெயர்ப்பு மரபுகளில் ‘எரிமோத்’ என்றும் எழுதப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי בֶכֶר
  choice: பெகேரின் மகன்கள்
  rationale: வம்சப்பட்டியல் சூழலில் בְּנֵי என்பதற்கு நேர்த்தியான இயல்பான தமிழ் இணை ‘மகன்கள்’; தொடக்க וּ பட்டியலின் தொடர்ச்சியைக் குறித்தாலும், தமிழில் தலைப்புப்போன்ற பட்டியல் அமைப்பில் தனியே ‘மேலும்’ சேர்க்காமல் இருப்பது இயல்பானது.
- source_word: זְמִירָה
  choice: செமீரா
  rationale: எபிரேய ஒலியமைப்பை நவீனத் தமிழில் தெளிவாகக் காட்டும் பெயரெழுத்தாக்கம்.
- source_word: יוֹעָשׁ
  choice: யோவாஸ்
  rationale: எபிரேய יוֹעָשׁ பெயரின் ஒலியை அண்மையாகப் பாதுகாக்கும் தமிழ் வடிவம்.
- source_word: אֱלִיעֶזֶר
  choice: எலியேசர்
  rationale: பெயரின் எபிரேய ஒலியமைப்பை அண்மையாகப் பிரதிபலிக்கும் வழக்கமான தமிழ் எழுத்தாக்கம்.
- source_word: אֶלְיוֹעֵינַי
  choice: எலியோயேனாய்
  rationale: எபிரேயப் பெயரின் உயிர் மற்றும் மெய் ஒலிகளை இயன்றவரை தெளிவாகப் பாதுகாக்கிறது.
- source_word: עָמְרִי
  choice: ஒம்ரி
  rationale: எபிரேயப் பெயருக்கான சுருக்கமான, பரவலாகப் புரியக்கூடிய தமிழ் எழுத்தாக்கம்.
- source_word: יְרֵמוֹת
  choice: எரேமோத்
  rationale: WLC வாசகத்தின் மெய்யெழுத்து மற்றும் உயிர்க்குறிகளை அடிப்படையாகக் கொண்ட தமிழ் பெயரெழுத்தாக்கம்.
- source_word: אֲבִיָּה
  choice: அபியா
  rationale: இறுதி יה ஒலியை ‘யா’ எனக் காட்டி, பெயரை மூல ஒலிக்கு அண்மையாக வழங்குகிறது.
- source_word: עֲנָתוֹת
  choice: ஆனதோத்
  rationale: இங்கு வம்சப்பட்டியலில் தனிநபரின் பெயராக வருவதால், பொருள் மொழிபெயர்ப்பு செய்யாமல் பெயரெழுத்தாக்கம் செய்யப்பட்டுள்ளது.
- source_word: עָלָמֶת
  choice: அலேமேத்
  rationale: எபிரேய உயிர்க்குறிகளுக்கு அண்மையான இயல்பான தமிழ் பெயரெழுத்தாக்கம்.
- source_word: כָּל אֵלֶּה בְּנֵי בָכֶר
  choice: இவர்கள் அனைவரும் பெகேரின் மகன்கள்
  rationale: சுருக்கமாக முடிக்கும் எபிரேய வாக்கியத்தை இயல்பான தமிழில் அதன் வம்சவழிப் பொருளுடன் நேரடியாக வழங்குகிறது.
