  text: Rephah his son[a], Resheph, Telah his son, Tahan his son.
translation:
  language: ta
  text: அவனுடைய மகன் ரெபாஹ்[a]; ரெஷெப்; அவனுடைய மகன் தெலாஹ்; அவனுடைய மகன் தஹான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெய வம்சவரலாறுகளில் வெளிப்படையான வினைச்சொல் பெரும்பாலும் விடுபடும். இங்கு சந்ததியினரின் வரிசை பட்டியலாகத் தரப்படுகிறது: “அவனுடைய மகன் ரெபாஹ்; ரெஷெப்; அவனுடைய மகன் தெலாஹ்; அவனுடைய மகன் தஹான்.”'
    reason: cultural_note
lexical_decisions:
- source_word: רֶפַח
  choice: ரெப்பாகு
  rationale: வம்சவரலாற்றில் வரும் நபர்பெயர்; எபிரெய ஒலியமைப்பைத் தமிழில் இயன்றவரை நெருக்கமாக ஒலிபெயர்த்தது.
- source_word: בְּנוֹ
  choice: அவனுடைய மகன்
  rationale: மூன்றாம் நபர் ஆண்பால் ஒருமை உடைமைப் பின்னொட்டைக் கொண்ட பெயர்ச்சொல்; மீண்டும் வரும் வம்சவரலாற்றுச் சூத்திரத்தைச் சீராக்காமல் வெளிப்படையாக வைத்துள்ளது.
- source_word: רֶשֶׁף
  choice: ரேசெப்பு
  rationale: வேறு சூழல்களில் பொதுப்பெயருக்குரிய பொருள்கள் இருந்தாலும், இங்கு வம்சவரலாற்றிலுள்ள நபர்பெயராகச் செயல்படுவதால் ஒலிபெயர்க்கப்பட்டது.
- source_word: תֶלַח
  choice: தேலாகு
  rationale: வம்சவரலாற்றில் வரும் நபர்பெயர்; இறுதி ח ஒலியைத் தமிழில் தோராயமாக ‘கு’ மூலம் பிரதிபலித்துள்ளது.
- source_word: תַחַן
  choice: தாகான்
  rationale: வம்சவரலாற்றில் வரும் நபர்பெயர்; எபிரெய வடிவத்திலிருந்து தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: וְ
  choice: ;
  rationale: இணைப்பிடைச்சொல் பெயர்களையும் உறவுத்தொடர்களையும் வரிசைப்படுத்துகிறது; தமிழில் குழப்பமில்லாத வம்சப்பட்டியல் ஓட்டத்திற்காக அரைப்புள்ளிகளால் பிரிக்கப்பட்டது.
theological_decisions:
- issue: வினைச்சொல் இல்லாத வம்சவரலாற்றுத் தொடர்
  choice: மூலத்தில் உள்ள பெயர்–உறவுச் சொற்றொடர் வரிசையை வினைச்சொல் சேர்க்காமல் காத்தல்
  alternative: ‘அவனுக்குப் பிறந்தவர்கள்’ அல்லது ‘அவனுடைய சந்ததியினர்’ போன்ற விளக்க வினைத்தொடரைச் சேர்த்தல்
  rationale: எபிரெய மூலம் உறவுகளைப் பட்டியலிடுகிறது; உறவின் துல்லியமான கட்டமைப்பை விளக்க வினைச்சொல் மூலம் மறைமுகமாகத் தீர்மானிக்காமல் அதன் சுருக்கத்தையும் இயல்பான தெளிவின்மையையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் சுருக்கமான, கண்ணியமான வம்சப்பட்டியல் நடை பயன்படுத்தப்பட்டுள்ளது. பெயர்கள் மொழிபெயர்க்கப்படாமல் எபிரெயிலிருந்து தமிழுக்கு ஒலிபெயர்க்கப்பட்டுள்ளன; அரைப்புள்ளிகள் தொடரின் உறுப்புகளைத் தெளிவுபடுத்துகின்றன.
