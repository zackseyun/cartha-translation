base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/018.yaml
  text: His sister Hammoleketh bore Ishhod[a], Abiezer, and Mahlah.
translation:
  language: ta
  text: அவனுடைய சகோதரி ஹம்மோலெகெத்[a] இஷ்ஹோத், அபியேசர், மக்லா ஆகியோரைப் பெற்றெடுத்தாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ஹம்மோலெகெத்; ‘மொலெகெத்’ என்றும் ஒலிபெயர்க்கலாம். இந்தப் பெயரின் வடிவம் ‘அரசி’ அல்லது ‘ஆளுகிறவள்’ என்ற பொருளுடைய சொல்லுடன் தொடர்புடையது; ஆனால் இங்கே இது ஒரு தனிப்பெயராகவே கொள்ளப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲחֹתוֹ
  choice: அவனுடைய சகோதரியான
  rationale: וַ என்பது முந்தைய வம்சவரலாற்றுடன் இவ்வசனத்தை இணைக்கிறது; இயல்பான தமிழ் நடையில் தனியாக ‘மேலும்’ என்று மொழிபெயர்க்க வேண்டிய அவசியமில்லை. אֲחֹתוֹ என்பது ஆண்பால் ஒருமை உரிமை விகுதியுடன் ‘அவனுடைய சகோதரி’ என்று பொருள்படும்.
- source_word: הַמֹּלֶכֶת
  choice: ஹம்மோலெகெத்
  rationale: வம்சவரலாற்றுச் சூழலில் இது ஒரு பெண்ணின் தனிப்பெயராகச் செயல்படுகிறது. சொல்லின் வடிவம் ‘அரசி’ அல்லது ‘ஆளுகிறவள்’ என்ற பொருளுடைய சொல்லுடன் தொடர்புடையதாயினும், இங்கே பொருளாக்காமல் ஒலிபெயர்ப்பது ஏற்றது; தொடக்க הַ பெயரின் மரபுவழி வடிவத்தின் பகுதியாகப் பாதுகாக்கப்படுகிறது.
- source_word: יָלְדָה
  choice: பெற்றெடுத்தாள்
  rationale: பெண்பால் ஒருமை வினைவடிவம் தாயே குழந்தைகளைப் பெற்றாள் என்பதைத் தெளிவாகக் காட்டுகிறது. ‘பெற்றெடுத்தாள்’ என்பது இன்றைய தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: אֶת
  choice: '[நேரடிச் செயப்படுபொருள் குறியீடு; தனியாக மொழிபெயர்க்கப்படவில்லை]'
  rationale: எபிரெயத்தில் அடுத்து வரும் பெயர்களை நேரடிச் செயப்படுபொருள்களாகக் குறிக்கிறது; தமிழில் இதன் பணி ‘-ஐ/ரை’ வேற்றுமை வடிவத்தாலும் பட்டியல் அமைப்பாலும் வெளிப்படுகிறது.
- source_word: אִישְׁהוֹד
  choice: இஷ்ஹோத்
  rationale: எபிரெயத் தனிப்பெயரின் ஒலியைத் தமிழில் நெருக்கமாகக் காட்டும் ஒலிபெயர்ப்பு.
- source_word: אֲבִיעֶזֶר
  choice: அபியேசர்
  rationale: எபிரெயத் தனிப்பெயரைத் தமிழில் வாசிக்க இயல்பான முறையில் ஒலிபெயர்க்கிறது.
- source_word: מַחְלָה
  choice: மக்லா
  rationale: ח ஒலியைத் தமிழ் வாசிப்புக்கு ஏற்றவாறு ‘க’ மூலம் அண்மையாகக் காட்டி, தனிப்பெயரை ஒலிபெயர்க்கிறது.
