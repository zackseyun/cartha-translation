translation_notes:
  register: நவீன நிலையான தமிழில், வம்சவரலாற்றுக்குரிய சுருக்கத்தையும் மரியாதையான நடையையும் பேணுகிறது. ‘ஆகியோரை’ என்பது மூன்று பெயர்களையும் ஒரே வினையின் செயப்படுபொருள்களாக இயல்பாக இணைக்கிறது. அடிக்குறிப்பு குறி அது விளக்கும் ‘ஹம்மோலெகெத்’ என்ற பெயருக்குப் பின்னரே வைக்கப்பட்டுள்ளது.
