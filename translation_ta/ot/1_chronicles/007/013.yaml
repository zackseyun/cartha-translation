base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/013.yaml
  text: 'The sons of Naphtali: Jahziel[a], Guni, Jezer, and Shallum—the sons of Bilhah.'
translation:
  language: ta
  text: 'நப்தலியின் மகன்கள்: யக்சியேல்[a], கூனி, யேசேர், சல்லூம்—பில்காளின் மகன்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ஆதியாகமம் 46:24-இல் இந்தப் பெயருக்குப் பதிலாக ‘சில்லேம்’ என்று வருகிறது; நாளாகமம் இங்கே ‘சல்லூம்’ என்று வாசிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי נַפְתָּלִי
  choice: நப்தலியின் மகன்கள்
  rationale: בְּנֵי என்பது இங்கு உடனடியாக நான்கு ஆண் மக்களை அறிமுகப்படுத்துவதால், பொதுவான ‘வழித்தோன்றல்கள்’ என்பதைக் காட்டிலும் ‘மகன்கள்’ என்பது துல்லியமானது.
- source_word: יַחֲצִיאֵל
  choice: யக்சியேல்
  rationale: எபிரேயப் பெயரின் மெய்யெழுத்துகளையும் ஒலியமைப்பையும் தமிழில் இயன்றவரை நெருக்கமாகப் பெயர்த்தெழுதுகிறது.
- source_word: גוּנִי
  choice: கூனி
  rationale: எபிரேயப் பெயரைத் தமிழ் ஒலிமுறைக்கு ஏற்ப நேரடியாகப் பெயர்த்தெழுதிய வடிவம்.
- source_word: יֵצֶר
  choice: யேசேர்
  rationale: எபிரேயப் பெயரின் தொடக்க y ஒலியையும் ṣ ஒலிக்கான வாசிக்க எளிய தமிழ் வடிவத்தையும் பிரதிபலிக்கிறது.
- source_word: שַׁלּוּם
  choice: சல்லூம்
  rationale: நாளாகமத்தின் மசோரா உரையில் உள்ள שַׁלּוּם என்ற வடிவத்தையே மொழிபெயர்ப்பு பின்பற்றுகிறது; ஆதியாகம இணைப்பகுதியின் வேறு வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בְּנֵי בִלְהָה
  choice: இவர்கள் பில்காளின் மகன்கள்
  rationale: இறுதியில் வரும் மரபுவழிக் குறிப்பை இயல்பான தமிழில் தனி வாக்கியமாகத் தெளிவுபடுத்துகிறது; மூலத்தின் தொடர்பை மாற்றவில்லை.
