  register: நவீனத் தரத் தமிழில், வம்சப்பட்டியலுக்கேற்ற சுருக்கமான மற்றும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. மூல எபிரெயின் கடினமான ஒருமை–பன்மை அமைப்பு பிரதான உரையில் தக்கவைக்கப்பட்டு அடிக்குறிப்பில் விளக்கப்பட்டது; ஆட்பெயர்கள் மொழிபெயர்க்கப்படாமல் எழுத்துப்பெயர்க்கப்பட்டன.
