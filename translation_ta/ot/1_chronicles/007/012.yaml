  text: וְ/שֻׁפִּ֤ם וְ/חֻפִּם֙ בְּנֵ֣י עִ֔יר חֻשִׁ֖ם בְּנֵ֥י אַחֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/012.yaml
  text: And Shuppim and Huppim were the sons of Ir[b][a]; Hushim was the son of Aher.
translation:
  language: ta
  text: ஷுப்பீமும் ஹுப்பீமும் இரின் மகன்கள்[b]; ஹுஷீம், அஹேரின் மகன்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயில், “அஹேரின் மகன்கள்.” இந்த வாக்கிய அமைப்பு கடினமானது: “மகன்கள்” என்ற பன்மைச் சொல், “ஹுஷீம்” என்னும் பெயருடன் வருகிறது. சிலர் “அஹேர்” என்பதை ஆட்பெயராகக் கொள்கின்றனர்; வேறு சிலர் அதை “வேறொருவர்” என்று புரிந்துகொள்கின்றனர்.'
    reason: lexical_alternative
  - marker: b
    text: தொடர்புடைய வம்சப்பட்டியல் பகுதிகளை அடிப்படையாகக் கொண்டு, சில மரபுகளில் இப்பெயர்கள் “ஷெப்புப்பாம்,” “ஹுப்பாம்” என்றும் வழங்கப்படுகின்றன.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/שֻׁפִּם
  choice: சுப்பீமும்
  rationale: இது ஓர் ஆட்பெயர் என்பதால் மொழிபெயர்க்காமல் எபிரெய ஒலிக்கு நெருக்கமாக எழுத்துப்பெயர்க்கப்பட்டது; முன்னொட்டான இணைப்புச்சொல் ‘-உம்’ மூலம் காட்டப்பட்டது.
- source_word: וְ/חֻפִּם
  choice: உப்பீமும்
  rationale: இது ஓர் ஆட்பெயர்; எபிரெய ஒலிப்புக்கு ஏற்ப எழுத்துப்பெயர்க்கப்பட்டு, இணைப்புச்சொல் ‘-உம்’ மூலம் தக்கவைக்கப்பட்டது.
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: வம்சப்பட்டியல் சூழலில் இதன் இயல்பான பொருள் ‘மகன்கள்.’ எபிரெயில் வினைச்சொல் இல்லாததால், தமிழிலும் பெயர்ப் பயனிலையாக இயல்பாக அமைக்கப்பட்டது.
- source_word: עִיר
  choice: ஈர்
  rationale: மசோரா உரையின் עִיר என்ற ஆட்பெயர் அதன் உயிர்க்குறிப்புக்கு ஏற்ப ‘ஈர்’ என எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: חֻשִׁם
  choice: ஊசீம்
  rationale: எபிரெய ஆட்பெயர் தமிழில் ஒலிக்கு நெருக்கமாக எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: בְּנֵי אַחֵר
  choice: ஆகேரின் மகன்கள்
  rationale: בְּנֵי என்பது இலக்கணப்படி பன்மையான ‘மகன்கள்’; אַחֵר இங்கு ஆட்பெயராக ‘ஆகேர்’ என எடுத்துக்கொள்ளப்பட்டது. ஒருமை ஆட்பெயரான ‘ஊசீம்’ உடன் வரும் பன்மை வடிவத்தின் உரைச் சிக்கலை மொழிபெயர்ப்பு மறைக்காமல் வைத்திருக்கிறது.
