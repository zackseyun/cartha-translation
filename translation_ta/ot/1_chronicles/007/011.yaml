translation_notes:
  register: நவீன நிலையான தமிழில், வம்சவரலாற்றுக்கேற்ற கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டது. மூலத்தின் பெயர்ச்சொல் அடுக்கை அப்படியே செயற்கையாகப் பிரதிபலிக்காமல், இரு வாக்கியங்களாகப் பிரித்து உறவுகளையும் எண்ணிக்கையையும் தெளிவுபடுத்துகிறது; அதேவேளையில் ‘மகன்கள்’ மற்றும் படைக்குப் ‘புறப்படுதல்’ ஆகிய மூலப் படிமங்கள் குறிப்புகளுடன் காக்கப்பட்டுள்ளன.
