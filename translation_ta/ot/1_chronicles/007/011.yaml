  source_fidelity: மொத்த எண்ணிக்கையும், எதியேலுடனான வம்சத் தொடர்பும், வீரத்தன்மையும், போர்ப்பணிக்கான புறப்படுதலும் நன்றாகக் காக்கப்பட்டுள்ளன. ஆனால் לְרָאשֵׁי הָאָבוֹת என்பதிலுள்ள ‘தந்தையர் குடும்பங்களின் தலைவர்கள்’ என்ற தொழில்நுட்ப வம்சவரலாற்றுத் தொடர்பைத் தெளிவாகக் காட்ட ‘தந்தைவழிக் குடும்பத் தலைவர்கள்’ என்பதற்குப் பதிலாகத் துல்லியமான சொற்றொடர் தேவை. குறிப்பு d-இல் ‘படையுடன்’ என்பது மூலத்தின் ‘படைக்குப்/படையில் சேவைக்குப் புறப்படுவோர்’ என்ற பொருளைச் சற்றே மாற்றுகிறது.
