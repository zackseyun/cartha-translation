source:
  edition: WLC
  text: כָּל אֵ֜לֶּה בְּנֵ֤י יְדִֽיעֲאֵל֙ לְ/רָאשֵׁ֣י הָ/אָב֔וֹת גִּבּוֹרֵ֖י חֲיָלִ֑ים שִׁבְעָֽה עָשָׂ֥ר אֶ֨לֶף֙ וּ/מָאתַ֔יִם יֹצְאֵ֥י צָבָ֖א לַ/מִּלְחָמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/011.yaml
  text: All these were sons of Jediael[a], according to the heads of the fathers’ houses, mighty men of valor, seventeen thousand two hundred[d][c][b], able to go out in the army for war.
translation:
  language: ta
  text: இவர்கள் அனைவரும் எதியேலின் மகன்கள்[a]. தந்தையர் குடும்பத் தலைவர்களின் கணக்கின்படி[b], போராற்றல் மிக்க வீரர்களான[c] இவர்கள் 17,200 பேர்; போருக்காகப் படைப்பணிக்குப் புறப்படக்கூடியவர்கள்[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எதியேலின் வழித்தோன்றல்கள்.” வம்சவரலாற்றுப் பட்டியல்களில் “மகன்கள்” என்ற எபிரெயச் சொல் பரந்த பொருளில் வழித்தோன்றல்களையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “தந்தையர் குடும்பங்களின் தலைவர்களின்படி”; அதாவது, குல அல்லது குடும்பத் தலைவர்களின் கணக்கின்படி.
    reason: cultural_note
  - marker: c
    text: எபிரெயத்தில், “வலிமையும் வீரமும் மிக்க ஆண்கள்”; இச்சூழலில் போரில் வல்ல வீரர்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: d
    text: எழுத்துப்படி, “போருக்காகப் படைக்குப் புறப்படுவோர்”; இது படைப்பணிக்குச் செல்லத் தகுதியும் தயார்நிலையும் உடையவர்களைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אֵלֶּה
  choice: இவர்கள் அனைவரும்
  rationale: எபிரெயச் சுருக்கமான தொகுப்புச் சொற்றொடரை இயல்பான தமிழில் தருகிறது; மூலத்தில் இல்லாத கூடுதல் அடையாளத்தைச் சேர்க்கவில்லை.
- source_word: בְּנֵי יְדִיעֲאֵל
  choice: எதியேலின் மகன்கள்
  rationale: בְּנֵי என்பதன் நேரடிப் பொருளான ‘மகன்கள்’ என்பதைக் காக்கிறது; வம்சவரலாற்றுச் சூழலில் அது வழித்தோன்றல்களையும் குறிக்கக்கூடும் என்பதைக் குறிப்பில் தெரிவிக்கிறது.
- source_word: לְרָאשֵׁי הָאָבוֹת
  choice: தந்தைவழிக் குடும்பத் தலைவர்களின் கணக்குப்படி
  rationale: சொற்றொடர் குறிக்கும் மூதாதையர் சார்ந்த குடும்ப அல்லது குல அமைப்பையும், לְ என்பதன் வகைப்படுத்தும் பொருளையும் தெளிவான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: גִּבּוֹרֵי חֲיָלִים
  choice: போராற்றல் மிக்க வீரர்கள்
  rationale: வலிமை, துணிவு, போர்திறன் ஆகியவற்றை உள்ளடக்கும் எபிரெயச் சொல்லிணையைப் பழமையான நடையின்றி இயல்பாகத் தருகிறது.
- source_word: שִׁבְעָה עָשָׂר אֶלֶף וּמָאתַיִם
  choice: 17,200 பேர்
  rationale: மூலத்தின் துல்லியமான கணக்கைத் தெளிவாகக் காட்டுகிறது; ‘பேர்’ மனிதர்களின் எண்ணிக்கை என்பதை இயல்பான தமிழில் உணர்த்துகிறது.
- source_word: יֹצְאֵי צָבָא לַמִּלְחָמָה
  choice: போருக்காகப் படைப்பணிக்குப் புறப்படக்கூடியவர்கள்
  rationale: ‘போருக்குப் படையாகப் புறப்படுவோர்’ என்ற மூலப் படிமத்தைத் தக்கவைத்தபடியே, இராணுவப் பணிக்கான தகுதி அல்லது தயார்நிலையை இயல்பான தமிழில் தெரிவிக்கிறது.
