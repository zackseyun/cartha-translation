base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/019.yaml
  text: The sons of Shemida were Ahian[a], Shechem, Likhi, and Aniam.
translation:
  language: ta
  text: செமீதாவின் மகன்கள் அகியான்[a], சேகேம், லிக்கி, அனியாம் ஆகியோர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “செமீதாவின் வழித்தோன்றல்கள்.” வம்சப் பட்டியல்களில் “மகன்கள்” என்பது சில சமயங்களில் ஆண் வழித்தோன்றல்களைப் பரந்த பொருளில் குறிக்கலாம்; எனினும் இங்குள்ள உடனடிச் சூழல் “மகன்கள்” என்பதையே ஆதரிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: ஆகியோர்
  rationale: வம்சப் பட்டியலை அறிமுகப்படுத்தும் היה வினையின் இவ்வடிவம் இங்கு ‘இருந்தார்கள்’ என்ற தனி வினையாக அல்லாமல், பெயர்ப்பட்டியலை இயல்பாக நிறைவு செய்யும் ‘ஆகியோர்’ எனத் தமிழில் வழங்கப்பட்டுள்ளது.
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: בנים என்பது வம்சாவளிகளில் பரந்த பொருளில் ஆண் வழித்தோன்றல்களைக் குறிக்கக்கூடும்; எனினும் உடனடிச் சூழலில் ஆண் பெயர்கள் நேரடியாகப் பட்டியலிடப்படுவதால் ‘மகன்கள்’ என்பதே முதன்மைத் தேர்வு.
- source_word: שְׁמִידָע
  choice: செமிதா
  rationale: எபிரெயப் பெயரின் ஒலியை இயல்பான நவீனத் தமிழ் எழுத்துப்பெயர்ப்பில் தருகிறது.
- source_word: אַחְיָן
  choice: அகியான்
  rationale: எபிரெய மெய் மற்றும் உயிரொலிகளுக்கு நெருக்கமான, தமிழில் வாசிக்க இயல்பான எழுத்துப்பெயர்ப்பு.
- source_word: שֶׁכֶם
  choice: சேகேம்
  rationale: இங்கு தொடரமைப்பு இதனை இடப்பெயராக அல்ல, நபரின் பெயராகக் காட்டுகிறது; அதனால் பொருள் மொழிபெயர்ப்பு செய்யாமல் எழுத்துப்பெயர்க்கப்பட்டுள்ளது.
- source_word: לִקְחִי
  choice: லிக்கி
  rationale: எபிரெயப் பெயரின் ஒலியைத் தமிழில் வாசிக்க ஏற்றவாறு எழுத்துப்பெயர்க்கிறது.
- source_word: אֲנִיעָם
  choice: அனியாம்
  rationale: பெயரின் எபிரெய ஒலிவடிவத்தை இயல்பான தமிழ் எழுத்துப்பெயர்ப்பில் தருகிறது.
