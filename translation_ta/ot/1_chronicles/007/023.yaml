translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதாகமக் கதைநடை பயன்படுத்தப்பட்டுள்ளது. தாம்பத்திய உறவு கண்ணியமான மறைமுகச் சொல்லால் தெரிவிக்கப்பட்டுள்ளது; ‘வீடு’ என்பதன் குடும்பப் பொருள் முதன்மை உரையில் வெளிப்படுத்தப்பட்டுள்ளது.
