base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/023.yaml
  text: Then he went in to his wife[a], and she conceived and bore a son, and he called his name Beriah[c][b], because disaster had been in his house.
translation:
  language: ta
  text: பின்பு அவன் தன் மனைவியுடன் சேர்ந்தான்; அவள் கருவுற்று ஒரு மகனைப் பெற்றாள். அவன் அந்த மகனுக்குப் பெரீயா[a] என்று பெயரிட்டான்; ஏனெனில் அவனுடைய குடும்பத்தில் பேரிடர் இருந்தது.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பெரீயா” என்ற எபிரெயப் பெயர், “பேரிடர்” என மொழிபெயர்க்கப்பட்ட எபிரெயச் சொல்லுடன் சொல்விளையாட்டாகத் தொடர்புடையது.
    reason: wordplay
  - marker: b
    text: இங்கு “பேரிடர்” என்பது குடும்பத்தைத் தாக்கிய துன்பம் அல்லது கேடைக் குறிக்கிறது; அறநெறிசார் தீமையைக் குறிக்கவில்லை. மூலமொழியை இன்னும் சொல்லுக்குச் சொல் மொழிபெயர்த்தால், “அவனுடைய வீட்டில் பேரிடர் இருந்தது” என்றும் கூறலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא אֶל אִשְׁתּוֹ
  choice: அவன் தன் மனைவியுடன் சேர்ந்தான்
  rationale: எபிரெய மொழியின் בוא אל என்ற மரபுத்தொடர் இங்கு தாம்பத்திய உறவைக் குறிப்பதாகும். நவீன தமிழில் கண்ணியமாகவும் தெளிவாகவும் அதைப் புரியவைக்கிறது.
- source_word: וַתַּהַר וַתֵּלֶד בֵּן
  choice: அவள் கருவுற்று ஒரு மகனைப் பெற்றாள்
  rationale: கருத்தரித்தல், மகப்பேறு ஆகிய இரு தொடர்ச்சியான செயல்களையும் எபிரெய மூலத்தின் சுருக்கமான நடைக்கு ஏற்ப இயல்பாகத் தருகிறது.
- source_word: וַיִּקְרָא אֶת שְׁמוֹ בְּרִיעָה
  choice: அவன் அவனுக்கு பெரீயா என்று பெயரிட்டான்
  rationale: பெயரிடுதலைக் குறிக்கும் எபிரெய மரபுச் சூத்திரத்தை நவீன தமிழில் இயல்பாக வழங்குகிறது; בְּרִיעָה என்பது ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: כִּי בְרָעָה הָיְתָה בְבֵיתוֹ
  choice: ஏனெனில் அவனுடைய குடும்பத்தில் பேரிடர் நேர்ந்திருந்தது
  rationale: רָעָה இச்சூழலில் அறநெறிசார் தீமையையல்ல, ஏற்பட்ட துன்பகரமான பேரிடரைக் குறிக்கிறது. בֵּיתוֹ இங்கு கட்டடத்தைவிட குடும்பம் அல்லது வீட்டாரைக் குறிக்கிறது; הָיְתָה என்பதன் நிலைமையை இயல்பான தமிழில் ‘நேர்ந்திருந்தது’ எனத் தருகிறது.
