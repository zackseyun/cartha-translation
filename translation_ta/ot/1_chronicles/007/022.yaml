  register: நவீனத் தரத் தமிழில், மரியாதையும் எளிய வாசிப்புத்தன்மையும் காக்கப்பட்டுள்ளன. எப்பிராயீமைக் குறிக்கும் வினைகள் மரியாதைப் பன்மையில் அமைக்கப்பட்டுள்ளன. மூலத்தில் உள்ள இரு உடன்பிறப்பு உறவுகளும் தெளிவாகப் பாதுகாக்கப்பட்டுள்ளன.
