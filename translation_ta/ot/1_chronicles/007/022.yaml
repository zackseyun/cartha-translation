base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/022.yaml
  text: And Ephraim their father mourned for many days[a], and his brothers came to comfort him.
translation:
  language: ta
  text: அவர்களுடைய தந்தையான எப்பிராயீம் பல நாட்கள் துக்கம் அனுசரித்தார்; அவருக்கு ஆறுதல் சொல்ல அவருடைய சகோதரர்கள் வந்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְאַבֵּל
  choice: துக்கம் அனுசரித்தார்
  rationale: אבל என்பதன் ஹித்பயேல் வடிவம், மரணத்தையொட்டி துக்கத்தில் இருப்பதையோ துக்கம் அனுசரிப்பதையோ குறிக்கிறது. முந்தைய வசனத்தின் இறப்புச் சூழலைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்தும் தேர்வு இது.
- source_word: אֶפְרַיִם
  choice: எப்பிராயீம்
  rationale: எபிரேயத் தனிப்பெயரின் தமிழில் பரவலாக அறியப்பட்ட ஒலிபெயர்ப்பு.
- source_word: אֲבִיהֶם
  choice: அவர்களுடைய தந்தையான
  rationale: மூன்றாம் நபர் ஆண்பால் பன்மை பின்னொட்டு, முன்பு குறிப்பிடப்பட்ட மகன்களின் தந்தை எப்பிராயீம் என்பதைச் சுட்டுகிறது. தமிழில் பெயருடன் இயல்பாக இணைக்க இந்த அமைப்பு பயன்படுத்தப்பட்டது.
- source_word: יָמִים רַבִּים
  choice: பல நாட்கள்
  rationale: இந்த எபிரேயக் காலவழக்கு நீண்ட கால அளவைக் குறிக்கிறது; தமிழில் ‘பல நாட்கள்’ என்பது இயல்பான நேரடித் தெரிவாகும்.
- source_word: וַיָּבֹאוּ
  choice: வந்தார்கள்
  rationale: בוא என்னும் வினை இக்கதைச் சூழலில் எப்பிராயீமிடம் அவர்கள் வந்ததைக் குறிக்கிறது.
- source_word: אֶחָיו
  choice: அவருடைய சகோதரர்கள்
  rationale: אָח என்பதன் வழக்கமான நேரடிப் பொருள் ‘சகோதரர்’. இங்கு அதை விரிவான ‘உறவினர்கள்’ என்ற பொருளில் எடுத்துக்கொள்ள வேண்டிய கட்டாயம் இல்லை.
- source_word: לְנַחֲמוֹ
  choice: அவருக்கு ஆறுதல் சொல்ல
  rationale: נחם என்பதன் இவ்வடிவம் துயரப்படுகிற ஒருவரைத் தேற்றுதல் அல்லது ஆறுதல்படுத்துதல் என்று பொருள்படும். ‘ஆறுதல் சொல்ல’ என்பது சாதாரண வாசகர்களுக்குப் புரியும் இயல்பான தமிழ்.
