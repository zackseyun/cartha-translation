  text: וּ/בְנֵ֥י עֻזִּ֖י יִֽזְרַֽחְיָ֑ה וּ/בְנֵ֣י יִֽזְרַֽחְיָ֗ה מִֽיכָאֵ֡ל וְ֠/עֹבַדְיָה וְ/יוֹאֵ֧ל יִשִּׁיָּ֛ה חֲמִשָּׁ֖ה רָאשִׁ֥ים כֻּלָּֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/003.yaml
  text: 'And the sons of Uzzi: Izrahiah. And the sons of Izrahiah: Michael[a], Obadiah, Joel, and Isshiah—five, all of them heads.'
translation:
  language: ta
  text: 'உஸ்ஸியின் மகன்கள்: இஸ்ரகியா. இஸ்ரகியாவின் மகன்கள்: மிகாயேல், ஒபதியா, யோவேல், இஷியா—ஐவர், அனைவரும் தலைவர்கள்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில் சொற்சொல்லாக, “ஐந்து தலைகள், அவர்கள் அனைவரும்” என்று உள்ளது. இதை “ஐந்து முதன்மையானவர்கள்” அல்லது “ஐந்து குடும்பத் தலைவர்கள்” என்றும் புரிந்துகொள்ளலாம். பெயரிடப்பட்டவர்கள் நால்வரே என்றாலும், மூல உரை ‘ஐவர்’ என்று கூறுகிறது.
    reason: lexical_alternative_and_textual_ambiguity
lexical_decisions:
- source_word: וּבְנֵי
  choice: மகன் / மகன்கள்
  rationale: בְּנֵי என்பது வம்சப்பட்டியலில் வழக்கமாக வரும் ‘மகன்/மகன்கள்’ என்ற இணைநிலைப் பன்மை வடிவம். முதல் இடத்தில் ஒரே பெயர் வருவதால் இயல்பான தமிழில் ‘மகன்’ என்றும், இரண்டாம் இடத்தில் பல பெயர்கள் வருவதால் ‘மகன்கள்’ என்றும் வழங்கப்பட்டுள்ளது; வாவ் இணைப்புகள் பட்டியல் நடையில் தனி வாக்கியங்களாக இயல்புபடுத்தப்பட்டுள்ளன.
- source_word: עֻזִּי
  choice: ஊசி
  rationale: எபிரெய தனிப்பெயரின் ஒலியை நெருக்கமாகக் காட்டும் தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: יִזְרַחְיָה
  choice: இஸ்ரகியா
  rationale: இரு இடங்களிலும் ஒரே எழுத்துப்பெயர்ப்பு தொடர்ந்து பயன்படுத்தப்பட்டுள்ளது; இறுதியிலுள்ள தெய்வீகப் பெயர்க்கூறை மொழிபெயர்க்காமல் பெயராகவே ஒலிபெயர்க்கிறது.
- source_word: מִיכָאֵל
  choice: மிகாயேல்
  rationale: தமிழில் அறிமுகமான, மூல ஒலியையும் தெளிவாகக் காக்கும் எழுத்துப்பெயர்ப்பு.
- source_word: וְעֹבַדְיָה
  choice: ஒபதியா
  rationale: தனிப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது; முன்னொட்டு இணைப்புச் சொல் பட்டியலின் நிறுத்தக்குறிகளால் வெளிப்படுத்தப்படுகிறது.
- source_word: וְיוֹאֵל
  choice: யோவேல்
  rationale: எபிரெயப் பெயரின் மெய்-உயிர் அமைப்பை வாசிக்கத்தக்க நவீன தமிழில் ஒலிபெயர்க்கிறது.
- source_word: יִשִּׁיָּה
  choice: இஷியா
  rationale: எபிரெய மெய்யெழுத்து வடிவத்தை நெருக்கமாகக் காட்டும், தமிழில் எளிதாக வாசிக்கக்கூடிய எழுத்துப்பெயர்ப்பு.
- source_word: חֲמִשָּׁה
  choice: மொத்தம் ஐவர்
  rationale: மனிதர்களைக் குறிக்கும் எண்ணை இயல்பான தமிழில் ‘ஐவர்’ என்று வழங்கி, பட்டியலில் நான்கு மகன்களின் பெயர்கள் மட்டுமே இருப்பதால் எண்ணிக்கையைத் தெளிவாகத் தனிப்படுத்த ‘மொத்தம்’ சேர்க்கப்பட்டுள்ளது; இதனால் மூலத்தில் உள்ள கணக்கீட்டுச் சிக்கல் நீக்கப்படவில்லை.
- source_word: רָאשִׁים
  choice: தலைவர்கள்
  rationale: சொல்லின் நேர்ப்பொருள் ‘தலைகள்’; வம்சப்பட்டியல் சூழலில் குடும்ப அல்லது குலத் தலைமை வகிப்பவர்களைக் குறிக்கும் இயல்பான தமிழ் ‘தலைவர்கள்’. நேர்ப்பொருளும் பிற சாத்தியங்களும் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: כֻּלָּם
  choice: இவர்கள் அனைவரும்
  rationale: குறிப்பிடப்பட்ட ஐவரையும் வலியுறுத்தும் தொகுப்புச் சொல்லின் பொருளைத் தெளிவாகக் காக்கிறது.
theological_decisions:
- issue: நான்கு மகன்களின் பெயர்களுக்குப் பின் ‘ஐவர்’ என்று வருவது
  choice: மூலத்தின் ‘ஐவர்’ என்ற எண்ணிக்கையை அப்படியே வைத்துப் பட்டியலின் தெளிவின்மையைப் பாதுகாத்தல்
  alternative: ‘நால்வர்’ என்று திருத்துதல் அல்லது ஐந்தாவது பெயர் விடுபட்டதாகக் கருதுதல்
  rationale: எபிரெய உரை חֲמִשָּׁה (‘ஐந்து’) என்று தெளிவாகக் கூறுகிறது. இஸ்ரகியாவையும் அவரது நான்கு மகன்களையும் சேர்த்து ஐவர் எனக் கணக்கிடலாம்; ஆனால் அதை மூல உரை வெளிப்படையாக விளக்கவில்லை. ஆகவே உரைத் தரவைத் திருத்தாமலும் ஒரே விளக்கத்தைத் திணிக்காமலும் மொழிபெயர்க்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், வம்சப்பட்டியலுக்கேற்ற சுருக்கமான மற்றும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘குமாரர்’ என்பதற்குப் பதிலாக பொதுவாகப் புரியும் ‘மகன்/மகன்கள்’ தேர்ந்தெடுக்கப்பட்டுள்ளது. மூலத்தில் உள்ள நான்கு பெயர்கள்–ஐவர் என்ற பதற்றம் அடிக்குறிப்புடன் அப்படியே காக்கப்பட்டுள்ளது.
