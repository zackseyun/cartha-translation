source:
  edition: WLC
  text: בְּנֵ֣י אָשֵׁ֗ר יִמְנָ֧ה וְ/יִשְׁוָ֛ה וְ/יִשְׁוִ֥י וּ/בְרִיעָ֖ה וְ/שֶׂ֥רַח אֲחוֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/030.yaml
  text: 'The sons of Asher: Imnah[a], Ishvah, Ishvi, and Beriah, and Serah their sister.'
translation:
  language: ta
  text: 'ஆசேரின் மகன்கள்: இம்னா[a], இஷ்வா, இஷ்வி, பெரீயா; மேலும் அவர்களுடைய சகோதரி சேரா.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயப் பெயர்களின் எழுத்தாக்கம் மொழிபெயர்ப்பு மரபுகளில் வேறுபடலாம்: “இம்னா” என்பது “யிம்னா” என்றும், “இஷ்வா” என்பது “இஷுவா” என்றும், “இஷ்வி” என்பது “இஷுவி” என்றும் எழுதப்படலாம்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: இது ‘மகன்கள்’ என்பதன் இணைப்புநிலைப் பன்மை. இங்கு உடனடியாகப் பெயரிடப்பட்ட பிள்ளைகளின் பட்டியல் வருவதால் ‘வழித்தோன்றல்கள்’ என்பதைவிட ‘மகன்கள்’ நேரடியான மொழிபெயர்ப்பு.
- source_word: אָשֵׁר
  choice: ஆசேர்
  rationale: எபிரெய தனிப்பெயரின் ஒலிபெயர்ப்பு; தமிழில் நிலைபெற்ற வேதாகமப் பெயர் வடிவத்துக்கும் அணுக்கமானது.
- source_word: יִמְנָה
  choice: இம்னா
  rationale: மசோரா உயிர்க்குறிப்புகளுக்கு ஏற்ப எபிரெயப் பெயர் நேரடியாக ஒலிபெயர்க்கப்பட்டது.
- source_word: יִשְׁוָה
  choice: இஷ்வா
  rationale: இவ்வசனத்தின் எபிரெய மெய்-உயிர் வடிவத்தைப் பிரதிபலிக்கும் ஒலிபெயர்ப்பு.
- source_word: יִשְׁוִי
  choice: இஷ்வி
  rationale: மசோரா வாசிப்புக்கு ஏற்ப பெயர் ஒலிபெயர்க்கப்பட்டது.
- source_word: בְרִיעָה
  choice: பெரீயா
  rationale: எபிரெய தனிப்பெயரின் ஒலியமைப்பை இயல்பான தமிழ் எழுத்துகளில் பிரதிபலிக்கிறது.
- source_word: שֶׂרַח
  choice: சேராகு
  rationale: இது வேறொரு எபிரெயப் பெயரான ‘சாராள்’ என்பதுடன் குழப்பமடையாதபடி, שֶׂרַח என்ற தனித்த பெயரின் ஒலியைப் பேணும் வடிவம்.
- source_word: אֲחוֹתָם
  choice: அவர்களுடைய சகோதரி
  rationale: மூன்றாம் நபர் ஆண்பால் பன்மை பின்னொட்டு இருப்பதால், பட்டியலிடப்பட்ட மகன்கள் அனைவருக்கும் அவள் சகோதரி என்று நேரடியாகக் கூறுகிறது.
