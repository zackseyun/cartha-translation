  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וּ/בְנֵ֥י אֶפְרַ֖יִם שׁוּתָ֑לַח וּ/בֶ֤רֶד בְּנ/וֹ֙ וְ/תַ֣חַת בְּנ֔/וֹ וְ/אֶלְעָדָ֥ה בְנ֖/וֹ וְ/תַ֥חַת בְּנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/020.yaml
  text: 'The sons of Ephraim: Shuthelah[a], and Bered his son, and Tahath his son, and Eleadah his son, and Tahath his son.'
translation:
  language: ta
  text: 'எப்பிராயீமின் மகன்கள்: சூத்தேலாக்; அவனுடைய மகன்[a] பெரேத்; அவனுடைய மகன் தகாத்; அவனுடைய மகன் எலெயாதா; அவனுடைய மகன் தகாத்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: வம்சப்பட்டியல்களில் எபிரெய ‘மகன்’ என்ற சொல் சில வேளைகளில் பல தலைமுறைகள் பிந்திய சந்ததியையும் குறிக்கலாம்; ஆனால் இங்குள்ள ஒவ்வொரு கட்டத்திலும் மூலவாசகம் நேரடியாக ‘அவனுடைய மகன்’ என்றே கூறுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי אֶפְרַיִם
  choice: எப்பிராயீமின் மகன்கள்
  rationale: בְּנֵי என்பது ‘மகன்கள்’ என்ற பன்மை இணைப்புநிலை வடிவம். தொடக்க וּ வம்சப்பட்டியல் தலைப்பில் இயல்பான தமிழுக்காகத் தனியே மொழிபெயர்க்கப்படவில்லை.
- source_word: שׁוּתָלַח
  choice: சூத்தெலாக்
  rationale: தனிப்பட்ட பெயர்; எபிரெய ஒலிப்புக்கு நெருக்கமான, தமிழில் வாசிக்கத்தக்க ஒலிபெயர்ப்பு.
- source_word: וּבֶרֶד
  choice: பேரேத்
  rationale: தனிப்பட்ட பெயர்; முன்னொட்டு இணைப்புச்சொல்லின் பட்டியல் செயல்பாடு தமிழின் அரைப்புள்ளி அமைப்பால் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: בְּנוֹ
  choice: அவனுடைய மகன்
  rationale: மூன்றாம் நபர் ஆண்பால் ஒருமை உடைமைப் பின்னொட்டுடன் வரும் בן என்பதன் நேரடியான பொருள் ‘அவனுடைய மகன்’. வம்சப்பட்டியல்களில் இது தூரத்துச் சந்ததியையும் குறிக்கக்கூடும் என்பதால் அந்த வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: וְתַחַת
  choice: தாகாத்
  rationale: இங்கு תַחַת என்பது ‘கீழே’ என்ற பொதுச் சொல்லல்ல; வம்சப்பட்டியல் சூழலில் ஒரு நபரின் பெயர்.
- source_word: וְאֶלְעָדָה
  choice: எலாதா
  rationale: வம்சப்பட்டியலில் வரும் தனிப்பட்ட பெயர்; பொருள் மொழிபெயர்ப்பு செய்யாமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְתַחַת בְּנוֹ
  choice: அவனுடைய மகன் தாகாத்
  rationale: மூலத்தின் மீளுருவாக்கப்பட்ட வம்சப்பட்டியல் சூத்திரம் ஒவ்வொரு தலைமுறைத் தொடர்பிலும் தெளிவாகத் தக்கவைக்கப்பட்டுள்ளது.
