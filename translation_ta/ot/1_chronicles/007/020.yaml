  register: நவீன நிலையான தமிழில், வம்சப்பட்டியலுக்குரிய சுருக்கமும் கண்ணியமும் காக்கப்பட்டுள்ளன. தொடர்ச்சியான தந்தை–மகன் சங்கிலி குழப்பமின்றி வாசிக்க அரைப்புள்ளிகள் பயன்படுத்தப்பட்டுள்ளன; மூலத்தின் மீளுரைகள் சுருக்கப்படவில்லை.
