  text: וּ/בְנֵ֥י אוּלָ֖ם בְּדָ֑ן אֵ֚לֶּה בְּנֵ֣י גִלְעָ֔ד בֶּן מָכִ֖יר בֶּן מְנַשֶּֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/017.yaml
  text: 'And the sons of Ulam: Bedan. These were the sons of Gilead son of Machir[a], son of Manasseh.'
translation:
  language: ta
  text: 'ஊலாமின் மகன்கள்: பேதான். இவர்கள் கிலேயாத்தின் மகன்கள்; கிலேயாத் மாகீரின் மகன்[a], மாகீர் மனாசேயின் மகன்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “இவர்கள் கிலேயாத்தின் மகன்கள்…” என்று உள்ளது. இந்தக் கூற்று, ஊலாமின் வம்சத்தை கிலேயாத், மாகீர், மனாசே ஆகியோரின் வழியுடன் இணைக்கும் வம்சவழிச் சுருக்கமாகச் செயல்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: மகன்கள்
  rationale: ו என்பது வம்சப்பட்டியலில் எளிய இணைப்பைத் தருகிறது; தமிழில் புதிய வாக்கியத் தொடக்கத்தில் அதைத் தனியே மொழிபெயர்க்காமல் விடுவது இயல்பானது. בְנֵי என்பதற்கு வம்சவழிச் சொல்லாட்சியைத் தெளிவாகக் காக்கும் வகையில் ‘மகன்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: אוּלָם
  choice: ஊலாம்
  rationale: தனிப்பெயர்; எபிரெய ஒலிப்புக்கு அண்மையாக எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: בְּדָן
  choice: பேதான்
  rationale: தனிப்பெயர்; எபிரெய ஒலிப்புக்கு அண்மையாக எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: אֵלֶּה
  choice: இவர்கள்
  rationale: எபிரெயச் சுட்டுப்பெயரின் பன்மையைப் பாதுகாக்கிறது; வம்சப்பட்டியலின் பின்னோக்குச் சுருக்கமாகவும் இயல்பாக அமைகிறது.
- source_word: בְּנֵי גִלְעָד
  choice: கிலேயாத்தின் மகன்கள்
  rationale: ‘கிலேயாத்தின் சந்ததியினர்’ என்பதற்குப் பதிலாக, எபிரெய வம்சவழி மரபுத்தொடரான ‘மகன்கள்’ என்பதைக் காக்கிறது.
- source_word: בֶּן מָכִיר
  choice: மாகீரின் மகன்
  rationale: நிலையான வம்சவழித் தொடர்பை முறையாகக் காக்கிறது.
- source_word: בֶּן מְנַשֶּׁה
  choice: மனாசேயின் மகன்
  rationale: நிலையான வம்சவழித் தொடர்பை முறையாகக் காக்கிறது; மனாசே என்ற தனிப்பெயர் எழுத்துப்பெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: ‘இவர்கள் கிலேயாத்தின் மகன்கள்’ என்ற கூற்றின் வம்சவழிச் செயல்பாடு
  choice: கூற்றை நேரடியாக வைத்திருந்து, அது ஊலாமின் வழியை கிலேயாத், மாகீர், மனாசே ஆகியோருடன் இணைக்கும் வம்சவழிச் சுருக்கமாக இருக்கலாம் என்பதை அடிக்குறிப்பில் குறிப்பிடுதல்
  alternative: ‘இவர்கள் கிலேயாத்தின் சந்ததியினர்’ என்று பொருளை வெளிப்படையாகத் தீர்மானித்தல்
  rationale: எபிரெய மூலத்தில் உள்ள ‘மகன்கள்’ என்ற சொல்லாட்சியையும், கூற்றின் துல்லியமான தொடர்பில் உள்ள உண்மையான தெளிவின்மையையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான வம்சப்பட்டியல் நடை பயன்படுத்தப்பட்டது. பெயர்கள் எபிரெய வடிவங்களுக்கு அண்மையாக எழுத்துப்பெயர்க்கப்பட்டன. ‘இவர்கள்’ என்ற வடிவம் எபிரெயத்தின் காலமற்ற சுட்டுக் கூற்றைத் தேவையின்றி இறந்தகாலமாக்காமல் காக்கிறது.
