  source_fidelity: 'மூல எபிரெயத்தின் வம்சவரிசை அமைப்பு துல்லியமாகக் காக்கப்பட்டுள்ளது: ஊலாமின் மகனாகப் பேதான் குறிப்பிடப்படுகிறார்; பின்னர் ‘இவர்கள் கிலேயாத்தின் மகன்கள்’ என்ற சுருக்கக் கூற்றும், கிலேயாத்–மாகீர்–மனாசே தொடர்பும் விடுபடாமல் உள்ளன. எபிரெயத்தில் உள்ள இணைப்புச் சொல் வாவ் தமிழில் தனியே வெளிப்படாதது வம்சப்பட்டியல் நடையில் ஏற்றுக்கொள்ளத்தக்கது.'
  naturalness: '‘ஊலாமின் மகன்கள்: பேதான்’ மற்றும் ‘இவர்கள் கிலேயாத்தின் மகன்கள்’ ஆகியவை நவீனத் தரத் தமிழில் சுருக்கமான வம்சப்பட்டியல் நடையாக இயல்பாக உள்ளன. அரைப்புள்ளியால் தொடரும் தலைமுறை இணைப்பு தெளிவாகிறது.'
  terminology: ‘மகன்கள்’ மற்றும் ‘மகன்’ என்பன எபிரெய வம்சவழிச் சொல்லாட்சியைச் சரியாகப் பாதுகாக்கின்றன. ஊலாம், பேதான், கிலேயாத், மாகீர், மனாசே ஆகிய பெயரெழுத்துப்பெயர்ப்புகள் நிலையான பயன்பாட்டுக்கு ஏற்றவை. அடிக்குறிப்பு மூலத்தின் இலக்கணத் தெளிவின்மையைத் தீர்மானிக்காமல் உரியவாறு விளக்குகிறது; அதன் குறியீட்டு இடமும் சரியானது.
