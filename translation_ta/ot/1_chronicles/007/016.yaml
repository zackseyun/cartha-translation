  source_fidelity: மாக்கா மாகீரின் மனைவி என்பதையும், அவர் ஒரு மகனைப் பெற்றுப் பேரேஷ் என்று பெயரிட்டதையும் உரை துல்லியமாகக் காட்டுகிறது. பின்னர் பேரேஷின் சகோதரனாக ஷேரேஷை அறிமுகப்படுத்தி, இறுதியில் மூலத்தில் உள்ள ஆண்பால் ஒருமை உடைமைப் பின்னொட்டின் வெளிப்படையான முன்னிலையைக் குறிப்பிடாமல் ‘அவனுடைய மகன்கள்’ என்று காத்துள்ளது. இது எபிரெய உரையின் வடிவத்துக்கும் அதன் சிறிய குறிப்பிடுபவர்-தெளிவின்மைக்கும் ஏற்றது.
  naturalness: நடை நவீன பொதுத்தமிழில் சுருக்கமாகவும் வம்சவரிசைப் பதிவுக்கேற்ற கண்ணியத்துடனும் உள்ளது. ‘பெற்றெடுத்து ... பெயரிட்டாள்’ இயல்பான இணை வினை அமைப்பாகும். ‘அவனுடைய சகோதரனின் பெயர் ஷேரேஷ்’ என்பது தமிழ் வம்சவரிசை நடையில் இயல்பாகப் புரியும் பெயர்ச்சொல் வாக்கியமாகும்.
  terminology: ‘மகன்/மகன்கள்’ என்பது בֵּן மற்றும் בָּנָיו என்பவற்றின் ஆண்பால் வம்சவரிசைப் பொருளைச் சரியாகத் தருகிறது. மாக்கா, மாகீர், பேரேஷ், ஷேரேஷ், ஊலாம், ராக்கேம் ஆகிய தனிப்பெயர்களின் எழுத்துப்பெயர்ப்பு வழங்கப்பட்ட POB ஆங்கில வழித்தடத்துடன் ஒத்திருக்கிறது. அடிக்குறிப்பு a சரியான இடத்தில் இணைக்கப்பட்டு, ‘அவனுடைய’ என்பதன் சாத்தியமான முன்னிலையை விளக்குகிறது.
