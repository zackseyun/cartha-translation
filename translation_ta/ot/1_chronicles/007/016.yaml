source:
  edition: WLC
  text: וַ/תֵּ֨לֶד מַעֲכָ֤ה אֵֽשֶׁת מָכִיר֙ בֵּ֔ן וַ/תִּקְרָ֤א שְׁמ/וֹ֙ פֶּ֔רֶשׁ וְ/שֵׁ֥ם אָחִ֖י/ו שָׁ֑רֶשׁ וּ/בָנָ֖י/ו אוּלָ֥ם וָ/רָֽקֶם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/016.yaml
  text: Maacah the wife of Machir bore a son[a], and she called his name Peresh; and the name of his brother was Sheresh[b], and his sons were Ulam and Rakem.
translation:
  language: ta
  text: மாகீரின் மனைவியான மாக்கா ஒரு மகனைப் பெற்றெடுத்து, அவனுக்குப் பேரேஷ் என்று பெயரிட்டாள். அவனுடைய சகோதரனின் பெயர் ஷேரேஷ். அவனுடைய[a] மகன்கள் ஊலாம், ராக்கேம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவனுடைய” என்பது பெரும்பாலும் ஷேரேஷைக் குறிக்கிறது; எபிரெய உரையில் அந்தப் பெயர் இங்கு மீண்டும் சொல்லப்படவில்லை.
    reason: referent_ambiguity
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: பெற்றெடுத்து
  rationale: வம்சப் பட்டியல் சூழலில் குழந்தையைப் பெற்றெடுத்ததைக் குறிக்கும் இயல்பான, சுருக்கமான தமிழ் வினைச்சொல்.
- source_word: אֵשֶׁת מָכִיר
  choice: மாகீரின் மனைவியான
  rationale: மாக்காவை மாகீருடனான உறவால் அடையாளப்படுத்தும் எபிரெய இணைப்பைத் தெளிவான நவீன தமிழில் தருகிறது.
- source_word: בֵּן
  choice: ஒரு மகனை
  rationale: பெயர் குறிப்பிடப்படுவதற்கு முன் அறிமுகப்படுத்தப்படும் ஆண் குழந்தையைத் துல்லியமாகக் குறிக்கிறது.
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: அவனுக்குப் … என்று பெயரிட்டாள்
  rationale: சொல்லர்த்தமாக ‘அவனுடைய பெயரை அழைத்தாள்’ என்றாலும், தமிழில் பெயரிடுதலை இயல்பாகவும் பொருள் மாறாமலும் வெளிப்படுத்துகிறது.
- source_word: פֶּרֶשׁ
  choice: பேரேஷ்
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் எழுத்துப்பெயர்க்கிறது.
- source_word: וְשֵׁם אָחִיו
  choice: அவனுடைய சகோதரனின் பெயர்
  rationale: எபிரெய பெயர்ச்சொல் தொடரைத் தெளிவாகவும் வம்சப் பட்டியல் நடைக்கு ஏற்றவாறும் தருகிறது.
- source_word: שָׁרֶשׁ
  choice: ஷேரேஷ்
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் எழுத்துப்பெயர்க்கிறது.
- source_word: וּבָנָיו
  choice: அவனுடைய மகன்கள்
  rationale: בנים இங்கு வம்சப் பட்டியலில் ஆண் சந்ததியினரைக் குறிக்கிறது; ஒருமை ஆண்பால் பின்னொட்டின் குறிப்பிடுபவர் மீண்டும் பெயரிடப்படாததால் மூலத்தின் வடிவம் காக்கப்படுகிறது.
- source_word: אוּלָם
  choice: ஊலாம்
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் எழுத்துப்பெயர்க்கிறது.
- source_word: וָרָקֶם
  choice: ராக்கேம்
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் எழுத்துப்பெயர்க்கிறது; பட்டியலின் இணைப்பு தமிழில் காற்புள்ளியால் இயல்பாகக் காட்டப்படுகிறது.
theological_decisions:
- issue: וּבָנָיו என்பதில் உள்ள ‘அவனுடைய’ என்ற பின்னொட்டின் முன்னிலை
  choice: மூலத்தைப் போலவே ‘அவனுடைய’ என்று வைத்து, அது யாரைக் குறிக்கிறது என்பதை அடிக்குறிப்பில் விளக்குதல்
  alternative: ‘ஷேரேஷின் மகன்கள்’ என்று வெளிப்படையாகத் தருதல்
  rationale: அருகிலுள்ள பெயர் ஷேரேஷ் என்பதால் அவனையே குறிப்பதாகப் பொதுவாகப் புரிந்துகொள்ளப்பட்டாலும், எபிரெய உரை பெயரை மீண்டும் சொல்லாமல் ஆண்பால் ஒருமைப் பின்னொட்டை மட்டுமே பயன்படுத்துகிறது. மொழிபெயர்ப்பில் அந்தச் சிறிய தெளிவின்மையை நீக்காமல் காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், வம்சப் பட்டியலுக்கேற்ற சுருக்கமான கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. தனிப்பெயர்கள் எபிரெய உச்சரிப்பை அணுகும் வகையில் எழுத்துப்பெயர்க்கப்பட்டுள்ளன.
