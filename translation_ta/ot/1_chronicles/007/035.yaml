source:
  edition: WLC
  text: וּ/בֶן הֵ֖לֶם אָחִ֑י/ו צוֹפַ֥ח וְ/יִמְנָ֖ע וְ/שֵׁ֥לֶשׁ וְ/עָמָֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/035.yaml
  text: 'The son of Helem his brother: Zophah[a], Imna, Shelesh, and Amal.'
translation:
  language: ta
  text: 'அவனுடைய சகோதரனான ஹேலேமின் மகன்: சோபாக்[a], இம்னா, ஷெலெஷ், அமால்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மூலத்தில் “மகன்” ஒருமையில் உள்ளது; ஆனால் அதைத் தொடர்ந்து நான்கு பெயர்கள் வருகின்றன. צוֹפַח என்ற பெயரை ஒலிபெயர்ப்பு முறையைப் பொறுத்து “சோபாஹ்” என்றும் எழுதலாம்.
    reason: textual_grammar_and_lexical_alternative
lexical_decisions:
- source_word: וּבֶן
  choice: மகன்கள்
  rationale: எபிரெயச் சொல் ஒருமையில் இருந்தாலும், தொடர்ந்து நான்கு பெயர்கள் வருவதால் பட்டியலின் இயல்புக்கு ஏற்ப தமிழில் பன்மை பயன்படுத்தப்பட்டுள்ளது; தொடக்க וּ பட்டியலின் தொடர்ச்சியில் இயல்பாக விடப்பட்டுள்ளது.
- source_word: הֵלֶם
  choice: ஏலேம்
  rationale: தனிப்பட்ட நபரின் பெயர்; எபிரெய உச்சரிப்புக்கு அண்மையாகத் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: אָחִיו
  choice: அவனுடைய சகோதரனான
  rationale: மூன்றாம் நபர் ஆண்பால் ஒருமை பின்னொட்டுடனான உறவுமுறையைப் பாதுகாக்கிறது; 'அவன்' யாரைக் குறிக்கிறது என்பதை மூலத்தைவிட அதிகமாக விளக்கவில்லை.
- source_word: צוֹפַח
  choice: சோபாகு
  rationale: இறுதி ח ஒலியைத் தமிழில் 'கு' என அண்மித்து, பெயரை ஒலிபெயர்த்துள்ளது.
- source_word: וְיִמְנָע
  choice: இம்னா
  rationale: பட்டியலிலுள்ள தனிப்பட்ட பெயர்; இணைப்பிடைச்சொல் தமிழ் பட்டியல் நிறுத்தக்குறிகளால் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: וְשֵׁלֶשׁ
  choice: சேலேசு
  rationale: தனிப்பட்ட பெயர் எபிரெய ஒலிவடிவுக்கு அண்மையாகத் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְעָמָל
  choice: அமால்
  rationale: பட்டியலின் இறுதிப் பெயர்; முன்வரும் இணைப்பு தமிழில் இறுதி காற்புள்ளியால் இயல்பாகக் குறிக்கப்படுகிறது.
theological_decisions:
- issue: בֶן என்ற ஒருமைக்கும் தொடர்ந்து வரும் நான்கு பெயர்களுக்கும் இடையிலான இலக்கணத் tension
  choice: தமிழில் 'மகன்கள்' என்று பன்மையில் வழங்குதல்
  alternative: '''மகன்'' என்று மூலத்தின் ஒருமையை அப்படியே வைத்தல்'
  rationale: நான்கு நபர்களையும் ஏலேமின் மக்களாகப் பட்டியலிடும் வம்சவரலாற்றுப் பொருள் தமிழில் தெளிவாக இருக்க பன்மை இயல்பானது; மூலத்தின் ஒருமை வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், வம்சவரலாற்றுப் பட்டியலுக்கேற்ற சுருக்கமானவும் கண்ணியமானவும் நடையில் வழங்கப்பட்டுள்ளது. தெளிவில்லாத சுட்டுப்பெயரின் முன்னிலையைத் தீர்மானித்து விரிவாக்காமல் 'அவனுடைய' எனப் பாதுகாக்கப்பட்டுள்ளது.
