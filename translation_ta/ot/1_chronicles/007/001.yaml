source:
  edition: WLC
  text: וְ/לִ/בְנֵ֣י יִשָׂשכָ֗ר תּוֹלָ֧ע וּ/פוּאָ֛ה ישיב וְ/שִׁמְר֖וֹן אַרְבָּעָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/001.yaml
  text: 'The sons of Issachar: Tola[a], Puah, Jashub[b], and Shimron—four.'
translation:
  language: ta
  text: 'இசக்காரின் மகன்கள்: தோலா, பூவா[a], யாசூப்[b], சிம்ரோன்—மொத்தம் நான்கு பேர்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மூலத்தில் ‘பூவா’; வேறு சில வம்சப்பட்டியல்களில் காணப்படும் இணையான பெயர் வடிவத்தின் அடிப்படையில் சில மொழிபெயர்ப்பு மரபுகள் ‘புவா’ எனக் கொடுக்கின்றன.
    reason: alternative_reading
  - marker: b
    text: எபிரெய மூலத்தில் ‘யாசூப்’; ஆதியாகமம் 46:13-இல் இதற்கு இணையான பெயர் ‘இஸ்வி’ என்ற வடிவத்தில் வருகிறது.
    reason: cross_reference
lexical_decisions:
- source_word: וְ/לִ/בְנֵי
  choice: மகன்கள்
  rationale: இது அடுத்த கோத்திர வம்சப்பட்டியலை அறிமுகப்படுத்தும் தலைப்புத் தொடர். எபிரெய முன்னொட்டுகளைத் தனித்தனியாக மொழிபெயர்ப்பதைவிட, தமிழில் இயல்பாக ‘இசக்காரின் மகன்கள்’ என்று வழங்கப்பட்டுள்ளது.
- source_word: יִשָׂשכָר
  choice: இசக்கார்
  rationale: கோத்திரத் தலைவரின் இயற்பெயர்; தமிழ் வேதாகமப் பெயர் மரபுக்கு ஏற்ற ஒலிபெயர்ப்பு.
- source_word: תּוֹלָע
  choice: தோலா
  rationale: வம்சப்பட்டியலில் வரும் இயற்பெயர்; பொருள் மொழிபெயர்ப்பு செய்யாமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וּ/פוּאָה
  choice: பூவா
  rationale: இவ்வசனத்தின் மசோரா உயிர்க்குறிப்பான פּוּאָה வடிவத்தைப் பின்பற்றும் தமிழ் ஒலிபெயர்ப்பு.
- source_word: ישיב
  choice: யாசூப்
  rationale: நாளாகமத்தின் இப்பகுதியில் உள்ள எபிரெய மெய்யெழுத்து வடிவத்தை யாசூப் என ஒலிபெயர்க்கிறது; ஆதியாகமம் 46:13-இல் காணப்படும் இணையான பெயர் வடிவம் வேறுபடுகிறது.
- source_word: וְ/שִׁמְרוֹן
  choice: சிம்ரோன்
  rationale: பட்டியலின் இறுதி இயற்பெயர்; முன் வரும் பெயர்களோடு தமிழில் இயல்பாக இணைக்கப்பட்டுள்ளது.
- source_word: אַרְבָּעָה
  choice: மொத்தம் நான்கு பேர்
  rationale: பட்டியலிடப்பட்ட மகன்களின் எண்ணிக்கையைச் சுருக்கிக் கூறும் சொல். மனிதர்களைக் குறிக்கும் இயல்பான தமிழ் நடைக்காக ‘பேர்’ சேர்க்கப்பட்டுள்ளது.
