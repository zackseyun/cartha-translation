translation_notes:
  register: நவீன நிலையான தமிழில், வம்சப்பட்டியலுக்குரிய சுருக்கத்தையும் கண்ணியமான நடையையும் காக்கும் மொழிபெயர்ப்பு. பெயர்கள் எபிரெய வடிவங்களை அடிப்படையாகக் கொண்டு ஒலிபெயர்க்கப்பட்டுள்ளன; பட்டியலின் முடிவிலுள்ள எண்ணிக்கை தமிழில் இயல்பாகத் தெளிவுபடுத்தப்பட்டுள்ளது.
