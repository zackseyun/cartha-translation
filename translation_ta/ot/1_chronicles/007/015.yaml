base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/015.yaml
  text: Machir took a wife for Huppim and for Shuppim. The name of his sister was Maacah[a], and the name of the second was Zelophehad; and Zelophehad had daughters.
translation:
  language: ta
  text: மாகீர் உப்பீமுக்கும் சுப்பீமுக்கும் ஒரு மனைவியை எடுத்தான். அவனுடைய சகோதரியின் பெயர் மாகா; இரண்டாமவரின்[a] பெயர் செலொப்பெகாத். செலொப்பெகாத்துக்கு மகள்கள் இருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இரண்டாவது மகனின் பெயர் செலொப்பெகாத்.” எபிரெய மூலம் “இரண்டாமவர்” என்று மட்டுமே கூறுகிறது; அது யாரைக் குறிக்கிறது என்பது வெளிப்படையாகச் சொல்லப்படவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: לָקַח אִשָּׁה
  choice: ஒரு மனைவியை எடுத்தான்
  rationale: ‘மனைவியை எடுத்தல்’ என்பது திருமணம் செய்துகொள்ளுதல் அல்லது திருமணத்திற்காகப் பெண்ணை எடுத்தல் என்ற எபிரெய மரபுத்தொடரின் பொருளைப் பாதுகாக்கிறது. இங்கு அடுத்து வரும் பயனாளிக் குறிப்புகளால், மாகீர் தனக்காக அல்லாமல் உப்பீம் மற்றும் சுப்பீமுக்காக அவளை எடுத்தான் என்ற விசித்திரமான வாக்கிய அமைப்பும் அப்படியே விடப்படுகிறது.
- source_word: לְחֻפִּים וּלְשֻׁפִּים
  choice: உப்பீமுக்கும் சுப்பீமுக்கும்
  rationale: இரு பெயர்களோடும் வரும் לְ முன்னிடைச்சொல்லைத் தமிழின் ‘-க்கும் ... -க்கும்’ அமைப்பு இயல்பாகவும் தெளிவாகவும் பிரதிபலிக்கிறது; திருமண ஏற்பாடு என்ற விளக்கத்தை உரைக்குள் சேர்க்கவில்லை.
- source_word: וְשֵׁם אֲחֹתוֹ מַעֲכָה
  choice: அவனுடைய சகோதரியின் பெயர் மாகா
  rationale: பெயரிடும் வாய்பாட்டை நேரடியாக மொழிபெயர்க்கிறது. அருகிலுள்ள முன்னோடிப் பெயரான மாகீரையே ‘அவன்’ இயல்பாகச் சுட்டுகிறது; ஆயினும் மூலத்தில் பெயர் மீண்டும் சொல்லப்படவில்லை.
- source_word: וְשֵׁם הַשֵּׁנִי צְלָפְחָד
  choice: இரண்டாமவரின் பெயர் செலொப்பெகாத்
  rationale: எபிரெயத்தில் ‘இரண்டாமவர்’ என்று மட்டுமே இருப்பதால், ‘மகன்’ போன்ற விடுபட்டதாகக் கருதப்படும் பெயர்ச்சொல்லை முதன்மை உரையில் சேர்க்காமல் அதன் சுருக்கத்தையும் தெளிவின்மையையும் காக்கிறது.
- source_word: וַתִּהְיֶנָה לִצְלָפְחָד בָּנוֹת
  choice: செலொப்பெகாத்துக்கு மகள்கள் இருந்தார்கள்
  rationale: உடைமையைக் குறிக்கும் எபிரெய இருப்பு அமைப்புக்கு இயல்பான தமிழ் வடிவம்; செலொப்பெகாத்துக்கு மகள்கள் இருந்தனர் என்ற வம்சவரலாற்றுக் குறிப்பைத் தெளிவாக வைத்திருக்கிறது.
theological_decisions:
- issue: ‘இரண்டாமவர்’ என்பதன் வம்சவரலாற்றுச் சுட்டு தெளிவற்றிருத்தல்
  choice: முதன்மை உரையில் ‘இரண்டாமவர்’ என்ற சுருக்கமான சொல்லைத் தக்கவைத்து, ‘மகன்’ என்பதைச் சேர்க்காதிருத்தல்
  alternative: ‘இரண்டாவது மகனின் பெயர் செலொப்பெகாத்’
  rationale: இது பிரதான கோட்பாட்டுச் சிக்கல் அல்ல; ஆனால் வம்சவரலாற்றை எவ்வாறு அமைப்பது என்பதில் முக்கியமான மொழிபெயர்ப்புத் தீர்மானம். எபிரெய மூலம் ‘மகன்’ என்று வெளிப்படையாகக் கூறாததால், அந்தச் சொல்லை உரைக்குள் சேர்த்து தெளிவின்மையை மறைக்காமல் மாற்று வாசிப்பை அடிக்குறிப்பில் தருகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையான, மரியாதைமிக்க வம்சவரலாற்று நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயத்தின் இயல்பற்ற ‘உப்பீமுக்கும் சுப்பீமுக்கும் ஒரு மனைவியை எடுத்தான்’ என்ற அமைப்பு விளக்கிக் கரைக்கப்படாமல் பாதுகாக்கப்பட்டுள்ளது. ஆள்பெயர்கள் எபிரெய ஒலிப்புக்கு நெருக்கமாக மாகீர், உப்பீம், சுப்பீம், மாகா, செலொப்பெகாத் என ஒலிபெயர்க்கப்பட்டுள்ளன.
