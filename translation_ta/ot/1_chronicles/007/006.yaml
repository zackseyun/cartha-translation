  yaml_path: translation/ot/1_chronicles/007/006.yaml
  text: 'The sons of Benjamin: Bela[a], Beker, and Jediael—three.'
translation:
  language: ta
  text: 'பென்யமீனின் மகன்கள்: பேலா, பெகேர், எதியாயேல்—மூவர்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּנְיָמִן
  choice: பென்யமீன்
  rationale: தனிநபர்/கோத்திரப் பெயர்; எபிரெயப் பெயரின் பரவலாக அறியப்பட்ட தமிழாக்க வடிவம் பயன்படுத்தப்பட்டது. வம்சப்பட்டியல் சூழலுக்கேற்ப உட்பொருளாக உள்ள உறவு ‘மகன்கள்’ என்று வெளிப்படுத்தப்பட்டது.
- source_word: בֶּלַע
  choice: பேலா
  rationale: எபிரெயத் தனிப்பெயரின் ஒலியை இயல்பான தமிழ் எழுத்தாக்கத்தில் பிரதிபலிக்கிறது.
- source_word: בֶּכֶר
  choice: பேகேர்
  rationale: כ என்ற மெய்யொலியை இங்கு ‘க’ என நேரடியாகப் பிரதிபலித்து, எபிரெய உச்சரிப்புக்கு நெருக்கமாகப் பெயரெழுத்தாக்கம் செய்யப்பட்டது.
- source_word: יְדִיעֲאֵל
  choice: எதியவேல்
  rationale: எபிரெயத் தனிப்பெயரின் ஒலியையும், இறுதியிலுள்ள אֵל கூறையும் தமிழில் இயல்பாகப் பிரதிபலிக்கும் பெயர்வடிவம்.
- source_word: שְׁלֹשָׁה
  choice: மூவர்
  rationale: குறிப்பிடப்பட்ட மூன்று மனிதர்களின் மொத்த எண்ணிக்கையைச் சுருக்கிக் கூறுவதால், மனிதர்களுக்குரிய இயல்பான தமிழ் எண்ணுப்பெயர் பயன்படுத்தப்பட்டது.
- source_word: '[implicit genealogical heading]'
  choice: 'பென்யமீனின் மகன்கள்:'
  rationale: எபிரெயத்தில் வினையில்லாமல் சுருக்கமாக அமைந்த வம்சப்பட்டியல் தலைப்பின் தெளிவான உறவை, தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions: []
translation_notes:
  register: நவீன தரநிலைத் தமிழ்; சுருக்கமான வம்சப்பட்டியல் நடையும் கண்ணியமான வேதாகமப் பதிவுத் தொனியும் பேணப்பட்டுள்ளன. பெயர்கள் மூல எபிரெய ஒலியை முன்னிறுத்தி எழுத்தாக்கப்பட்டுள்ளன.
