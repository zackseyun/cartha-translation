translation_notes:
  register: நவீன நிலையான தமிழில், வரலாற்று-புவியியல் பட்டியலுக்கேற்ற கண்ணியமான இயல்பான நடை பயன்படுத்தப்பட்டது. கோத்திர மக்களை நேரடியான ‘மகன்கள்’ என்பதற்குப் பதிலாக ‘சந்ததியினர்’ என்று தெளிவுபடுத்தி, யோசேப்பைப் பற்றிய தனிப்பட்ட உறவுக் குறிப்பில் ‘மகன்’ தக்கவைக்கப்பட்டது. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெறுகின்றன.
