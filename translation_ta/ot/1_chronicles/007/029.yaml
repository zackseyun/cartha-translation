base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/029.yaml
  text: And along the borders of the sons of Manasseh were Beth-shean and its daughter towns[a], Taanach and its daughter towns, Megiddo and its daughter towns, Dor and its daughter towns[b]. In these lived the sons of Joseph son of Israel.
translation:
  language: ta
  text: மனாசேயின் சந்ததியினரின் எல்லையோரத்தில்[b] பெத்-ஷெயானும் அதைச் சார்ந்த சிற்றூர்களும்[a], தானாக்கும் அதைச் சார்ந்த சிற்றூர்களும், மெகிதோவும் அதைச் சார்ந்த சிற்றூர்களும், தோரும் அதைச் சார்ந்த சிற்றூர்களும் இருந்தன. இவற்றில் இஸ்ரவேலின் மகனான யோசேப்பின் சந்ததியினர் குடியிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில் சொல்லுக்கு சொல் ‘அதன் மகள்கள்.’ இது ஒரு முதன்மை நகரத்தைச் சார்ந்த துணைக் குடியிருப்புகள் அல்லது சிற்றூர்களைக் குறிக்கும் வழக்குச் சொல்.
    reason: lexical_alternative
  - marker: b
    text: ‘எல்லையோரத்தில்’ என்பதற்கு, ‘மனாசேயின் சந்ததியினரின் அருகில்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய மொழிநடை இங்கு நிலப்பகுதிகளின் அண்மையையோ எல்லையையோ குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל יְדֵי
  choice: எல்லையோரத்தில்
  rationale: நிலப்பகுதிகளைப் பட்டியலிடும் இச்சூழலில் இந்த எபிரெய மொழிநடை நேரடியான ‘கையின் அருகில்’ என்பதைக் குறிக்காமல், மனாசேயின் பகுதிக்கு அடுத்துள்ள எல்லைப்புற இடத்தைக் குறிக்கிறது.
- source_word: בְנֵי מְנַשֶּׁה
  choice: மனாசேயின் சந்ததியினர்
  rationale: கோத்திரத்தைக் குறிக்கும் ‘மகன்கள்’ என்ற எபிரெய உறவுமுறைச் சொல்லை நவீனத் தமிழில் தெளிவாகத் தெரிவிக்க ‘சந்ததியினர்’ பயன்படுத்தப்பட்டது.
- source_word: בֵּית שְׁאָן
  choice: பெத்-செயான்
  rationale: மசோரா உயிர்க்குறிப்பை ஒட்டிய இடப்பெயர் ஒலிபெயர்ப்பு.
- source_word: וּבְנֹתֶיהָ / וּבְנוֹתֶיהָ
  choice: அதைச் சார்ந்த சிற்றூர்களும்
  rationale: ‘அதன் மகள்கள்’ என்ற நேரடிப் பொருள், ஒரு முதன்மை நகரத்தைச் சார்ந்த துணைக் குடியிருப்புகளைக் குறிக்கும் வழக்குச் சொல். தமிழில் பொருள் தெளிவாக இருக்க இவ்வாறு மொழிபெயர்க்கப்பட்டது; உருவகம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: תַּעְנַךְ
  choice: தானாக்
  rationale: எபிரெய இடப்பெயரின் தமிழ் ஒலிபெயர்ப்பு.
- source_word: מְגִדּוֹ
  choice: மெகிதோ
  rationale: எபிரெய இடப்பெயரின் தமிழ் ஒலிபெயர்ப்பு.
- source_word: דּוֹר
  choice: தோர்
  rationale: எபிரெய இடப்பெயரின் தமிழ் ஒலிபெயர்ப்பு.
- source_word: בְאֵלֶּה
  choice: இவற்றில்
  rationale: முன்னர் பட்டியலிடப்பட்ட நகரங்களையும் அவற்றைச் சார்ந்த குடியிருப்புகளையும் சுட்டுகிறது.
- source_word: יָשְׁבוּ
  choice: குடியிருந்தார்கள்
  rationale: இங்கு வினைச்சொல் அந்த இடங்களில் வாழ்ந்து வசித்ததைக் குறிக்கிறது; ‘குடியேறினார்கள்’ என்பது தொடக்க ஆக்கிரமிப்பைத் தேவையின்றி உணர்த்தக்கூடும்.
- source_word: בְּנֵי יוֹסֵף
  choice: யோசேப்பின் சந்ததியினர்
  rationale: கோத்திர வழிவந்த மக்களைக் குறிக்கும் எபிரெய உறவுமுறை மொழிநடையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: בֶּן יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகனான
  rationale: யோசேப்பை இஸ்ரவேலின் மகன் என்று அடையாளப்படுத்தும் மூலத்தின் உறவுமுறைக் குறிப்பைத் தக்கவைக்கிறது.
