lexical_decisions:
- source_word: וּבְנֵי
  choice: மகன்கள்
  rationale: בְּנֵי என்பது ‘மகன்கள்’ என்பதன் இணைப்பு வடிவம்; வம்சப்பட்டியல் நடையை இயல்பான நவீனத் தமிழில் துல்லியமாகப் பாதுகாக்கிறது. தொடக்க וּ சூழலில் பட்டியலைத் தொடரும் இணைப்புச்சொல்; தனித்த தமிழ்வாக்கியத்தில் அதை வெளிப்படையாக மொழிபெயர்க்காமல் விடுவது இயல்பானது.
- source_word: יֶתֶר
  choice: யெத்தேர்
  rationale: எபிரெயத் தனிப்பெயரின் ஒலியமைப்பைத் தமிழில் அண்மையாக எழுத்துப்பெயர்த்த வடிவம்.
- source_word: יְפֻנֶּה
  choice: எப்புன்னே
  rationale: தனிப்பெயர் மொழிபெயர்க்கப்படாமல், எபிரெய உச்சரிப்புக்கு அண்மையாகத் தமிழில் எழுத்துப்பெயர்க்கப்பட்டுள்ளது.
- source_word: וּפִסְפָּה
  choice: பிஸ்பா
  rationale: முன்னொட்டு இணைப்புச்சொல்லுடன் வரும் தனிப்பெயர். இறுதி ה ஒலிக்காததாகக் கொண்டு ‘பிஸ்பா’ என இயல்பாக எழுத்துப்பெயர்க்கப்பட்டுள்ளது; எழுத்துக்கு எழுத்தான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: וַאְרָא
  choice: ஆரா
  rationale: வம்சப்பட்டியலில் வரும் தனிப்பெயராகக் கொண்டு, எபிரெய ஒலியமைப்புக்கு அண்மையாக எழுத்துப்பெயர்க்கப்பட்டுள்ளது; பட்டியல் அமைப்பே இணைப்பைத் தெளிவாக்குவதால் தனியே ‘மற்றும்’ சேர்க்கப்படவில்லை.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், வம்சப்பட்டியலுக்கேற்ற சுருக்கமானதும் கண்ணியமானதுமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘குமாரர்கள்’ என்பதற்குப் பதிலாக பொதுவாகப் புரியும் ‘மகன்கள்’ தேர்ந்தெடுக்கப்பட்டுள்ளது. ஆங்கில ஆலோசனை உரையில் அடிக்குறி எப்புன்னே என்பதன் பின்னர் இருந்தாலும், அதன் உள்ளடக்கம் பிஸ்பா என்ற பெயரைச் சார்ந்ததால் [a] குறி பிஸ்பாவுக்குப் பின்னர் வைக்கப்பட்டுள்ளது.
