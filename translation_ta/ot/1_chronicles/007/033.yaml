source:
  edition: WLC
  text: וּ/בְנֵ֣י יַפְלֵ֔ט פָּסַ֥ךְ וּ/בִמְהָ֖ל וְ/עַשְׁוָ֑ת אֵ֖לֶּה בְּנֵ֥י יַפְלֵֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/033.yaml
  text: 'The sons of Japhlet: Pasach[a], Bimhal, and Ashvath[b]. These were the sons of Japhlet.'
translation:
  language: ta
  text: 'யப்லேத்தின் மகன்கள்: பாசக், பிம்ஹால், அஷ்வாத். இவர்களே யப்லேத்தின் மகன்கள்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְנֵי
  choice: மகன்கள்
  rationale: வம்சப் பட்டியலின் உடனடிச் சூழலில் construct plural ஆன בְנֵי என்பது பொதுவாக ‘மகன்கள்’ எனப் பொருள்படும்; ‘பிள்ளைகள்’ அல்லது ‘வழித்தோன்றல்கள்’ என்பதைக் காட்டிலும் இது துல்லியமானது.
- source_word: יַפְלֵט
  choice: யப்லேத்
  rationale: எபிரெய தனிப்பெயர் மொழிபெயர்க்கப்படாமல், நவீனத் தமிழில் இயல்பாக ஒலிபெயர்க்கப்பட்டது.
- source_word: פָּסַךְ
  choice: பாசக்
  rationale: இறுதி כְ ஒலியைத் தக்கவைத்து தனிப்பெயர் ‘பாசக்’ என ஒலிபெயர்க்கப்பட்டது.
- source_word: וּבִמְהָל
  choice: பிம்ஹால்
  rationale: முன்னொட்டு இணைப்புச்சொல் பட்டியல் அமைப்பில் தனியே உணரப்படுகிறது; பெயர் בִמְהָל என்பதன் ஒலியமைப்பைப் பின்பற்றி ‘பிம்ஹால்’ என வழங்கப்பட்டது.
- source_word: וְעַשְׁוָת
  choice: அஷ்வாத்
  rationale: எபிரெய மெய்யெழுத்துத் தொடரை வாசிக்கத்தக்க தமிழ் ஒலிபெயர்ப்பாக ‘அஷ்வாத்’ என வழங்கப்பட்டது.
- source_word: אֵלֶּה
  choice: இவர்களே
  rationale: மனிதர்களைக் குறிக்கும் சுட்டுப்பெயராகவும், பட்டியலை முடிக்கும் எபிரெயச் சுருக்கக் கூற்றின் வலியுறுத்தலையும் காக்கவும் ‘இவர்களே’ தேர்ந்தெடுக்கப்பட்டது. தமிழில் காலத்தைக் கட்டாயமாகச் சேர்க்காமல் மூலத்தின் அமைப்பை இயல்பாகக் காக்கிறது.
- source_word: בְּנֵי יַפְלֵט
  choice: யப்லேத்தின் மகன்கள்
  rationale: மூலத்தில் மீண்டும் வரும் வம்சவழிச் சொற்றொடர் முழுமையாக மீளுரைக்கப்பட்டு அதன் கட்டமைப்பு பாதுகாக்கப்பட்டது.
