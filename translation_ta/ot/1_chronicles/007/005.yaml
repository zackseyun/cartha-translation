base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/005.yaml
  text: And their brothers[a], throughout all the families of Issachar, were mighty men of valor, eighty-seven thousand in all[b], enrolled by genealogy.
translation:
  language: ta
  text: இசக்காரின் எல்லா வம்சங்களிலும் இருந்த அவர்களுடைய சகோதரர்கள்[a] வலிமைமிக்க போர்வீரர்கள். வம்சாவளிப் பதிவின்படி அவர்களுடைய மொத்த எண்ணிக்கை எண்பத்தேழாயிரம் பேர்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவர்களுடைய இனத்தார்’ அல்லது ‘அவர்களுடைய உறவினர்கள்.’ எபிரெய மொழியில் ‘சகோதரர்கள்’ என்பது வம்சம் மற்றும் குலம் சார்ந்த சூழல்களில் உடன்பிறந்தவர்களைத் தாண்டிய விரிந்த உறவினரையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘வம்சாவளியின்படி பதிவு செய்யப்பட்டவர்கள்.’ எபிரெய வினைச்சொல் வம்சாவளிப் பதிவுகளில் சேர்க்கப்படுதல் அல்லது அவற்றின்படி கணக்கிடப்படுதலைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: அவர்களுடைய சகோதரர்கள்
  rationale: אָח என்பதன் நேரடிப் பொருள் ‘சகோதரர்’; வம்சச் சூழலில் இது நெருங்கிய இனத்தார் அல்லது உறவினரையும் குறிக்கலாம். மூலமொழியின் உருவகத்தைப் பாதுகாக்க நேரடிச் சொல் பயன்படுத்தப்பட்டு, விரிவான பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: לְכֹל מִשְׁפְּחוֹת יִשָׂשכָר
  choice: இசக்காரின் எல்லா வம்சங்களிலும் இருந்த
  rationale: לְכֹל இங்கு இசக்காரின் எல்லா குடும்ப அல்லது குலப் பிரிவுகளையும் உள்ளடக்கும் பரப்பைக் குறிக்கிறது. ‘வம்சங்கள்’ என்பது பட்டியல் மற்றும் வம்சாவளிச் சூழலுக்கு இயல்பான தமிழ்ச் சொல்.
- source_word: גִּבּוֹרֵי חֲיָלִים
  choice: வலிமைமிக்க போர்வீரர்கள்
  rationale: இத்தொடர் வலிமையும் போர்த் திறனும் கொண்ட வீரர்களைக் குறிக்கிறது. சொற்சொல் மரபுத்தொடரைவிட நவீன தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது.
- source_word: שְׁמוֹנִים וְשִׁבְעָה אֶלֶף
  choice: எண்பத்தேழாயிரம் பேர்
  rationale: எண்ணின் நேரடியான தமிழ் வடிவம்; மனிதர்களைக் கணக்கிடுவதால் ‘பேர்’ சேர்க்கப்பட்டுள்ளது.
- source_word: הִתְיַחְשָׂם
  choice: வம்சாவளிப் பதிவில் சேர்க்கப்பட்ட
  rationale: יחשׂ என்பதன் ஹித்பயேல் வடிவம் வம்சாவளி அடிப்படையில் பதிவு செய்யப்படுதல் அல்லது கணக்கிடப்படுதலைக் குறிக்கிறது. இத்தேர்வு நிர்வாகப் பதிவும் வம்சத் தொடர்பும் இரண்டையும் வெளிப்படுத்துகிறது.
- source_word: לַכֹּל
  choice: அவர்கள் அனைவரும்
  rationale: இது மொத்த எண்ணிக்கையைச் சுருக்கிக் கூறுகிறது. தமிழில் வாக்கியத்துடன் இயல்பாக இணைய ‘அவர்கள் அனைவரும்’ என வழங்கப்பட்டுள்ளது.
