translation_notes:
  register: நவீன நிலையான தமிழ்; பட்டியல் சார்ந்த வரலாற்று நடையைத் தக்கவைத்தபடி சாதாரண வாசகர்களுக்குத் தெளிவாக வடிவமைக்கப்பட்டது. ‘சகோதரர்கள்’ என்ற மூலமொழி உருவகம் பிரதான உரையில் பாதுகாக்கப்பட்டு அதன் விரிந்த குலப் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
