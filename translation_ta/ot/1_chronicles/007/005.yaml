- from: இசக்காரின் எல்லா வம்சங்களிலும் இருந்த அவர்களுடைய சகோதரர்கள்[a] வலிமைமிக்க போர்வீரர்கள். வம்சாவளிப் பதிவில் சேர்க்கப்பட்ட அவர்கள் அனைவரும்[b] எண்பத்தேழாயிரம் பேர்.
