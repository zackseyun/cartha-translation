base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/040.yaml
  text: All these were sons of Asher[a], heads of fathers’ houses, select men, mighty warriors, chief leaders; and they were enrolled for service in the army for war. Their number in men was twenty-six thousand.
translation:
  language: ta
  text: இவர்கள் எல்லாரும் ஆசேரின் மகன்கள்; மூதாதையர் குடும்பங்களின் தலைவர்கள், தேர்ந்தெடுக்கப்பட்டவர்கள், ஆற்றல்மிக்க வீரர்கள், தலைவர்களில் முதன்மையானவர்கள். இவர்கள் போர்ச் சேவைக்கான படையில் வம்சாவளிப்படி பதிவு செய்யப்பட்டவர்கள்[a]. இவர்களின் எண்ணிக்கை இருபத்தாறாயிரம் ஆண்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “போர்ச் சேவைக்கான படையில் சேர்க்கப்பட்டவர்கள்.” இங்கு வரும் எபிரெய வினைச்சொல் நாளாகமத்தில் பெரும்பாலும் வம்சாவளிப்படி பதிவு செய்வதைக் குறிக்கிறது; இந்தச் சூழலில் அது படைப் பதிவையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאשֵׁי בֵית הָאָבוֹת
  choice: மூதாதையர் குடும்பங்களின் தலைவர்கள்
  rationale: இது குல அல்லது மூதாதையர் வழிக் குடும்பப் பிரிவுகளின் தலைவர்களைக் குறிக்கும் நாளாகம மரபுச் சொற்றொடர். எபிரெய உருவகத்தைத் தெளிவாகவும் இயல்பான நவீன தமிழிலும் தருகிறது.
- source_word: בְּרוּרִים
  choice: தேர்ந்தெடுக்கப்பட்டவர்கள்
  rationale: செயப்பாட்டு வினையெச்ச வடிவம் தேர்வு செய்யப்பட்ட அல்லது சிறப்பாகத் தெரிந்தெடுக்கப்பட்ட நபர்களைக் குறிக்கிறது.
- source_word: גִּבּוֹרֵי חֲיָלִים
  choice: ஆற்றல்மிக்க வீரர்கள்
  rationale: வலிமை, திறமை, போர்த் தகுதி ஆகியவற்றை ஒருங்கே உணர்த்தும் எபிரெய இராணுவச் சொற்றொடரை பழமையான நடையின்றி வெளிப்படுத்துகிறது.
- source_word: רָאשֵׁי הַנְּשִׂיאִים
  choice: தலைவர்களில் முதன்மையானவர்கள்
  rationale: சுருக்கமான எபிரெயத் தொடர் தலைவர்களிடையே உயர்ந்த நிலையைக் குறிக்கிறது. அரச குமாரர்கள் என்ற பொருளைத் தேவையின்றி புகுத்தாமல், רָאשֵׁי மற்றும் הַנְּשִׂיאִים இரண்டையும் பிரதிபலிக்கிறது.
- source_word: וְהִתְיַחְשָׂם
  choice: வம்சாவளிப்படி பதிவு செய்யப்பட்ட
  rationale: நாளாகமத்தில் יחס என்பதன் ஹித்பயேல் வடிவம் பொதுவாக வம்சாவளிப் பதிவைக் குறிக்கிறது; இங்கு படைச் சூழலுடன் இணைந்திருப்பதால், பதிவு மற்றும் இராணுவப் பயன்பாடு இரண்டையும் இச்சொற்றொடர் தக்கவைக்கிறது.
- source_word: בַּצָּבָא בַּמִּלְחָמָה
  choice: போருக்கான படையில்
  rationale: ஒழுங்கமைக்கப்பட்ட படையையும் அதன் போர்நோக்கத்தையும் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: מִסְפָּרָם אֲנָשִׁים
  choice: இவர்களுடைய ஆண்களின் எண்ணிக்கை
  rationale: எண்ணப்பட்டவர்கள் ஆண்கள் என்று மூலத்தில் வெளிப்படையாகக் கூறப்படுவதை இயல்பான தமிழ்ச் சொற்றொடரில் பாதுகாக்கிறது.
- source_word: עֶשְׂרִים וְשִׁשָּׁה אָלֶף
  choice: இருபத்தாறாயிரம்
  rationale: எபிரெய எண்ணின் வழக்கமான நவீனத் தமிழ் வடிவம்.
