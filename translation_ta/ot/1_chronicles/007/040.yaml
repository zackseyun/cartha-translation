  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. பட்டியலின் இணைவடிவமும் இராணுவச் சூழலும் காக்கப்பட்டுள்ளன; மரபுவழிப் பழமையான சொற்களும் அரசாட்சிச் சார்ந்த தேவையற்ற பொருள் புகுத்தலும் தவிர்க்கப்பட்டுள்ளன.
