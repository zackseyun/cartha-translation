translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் தகவல் அமைப்பைத் தெளிவாக்க இரண்டு வாக்கியங்களாக அமைத்து, எண்ணிக்கைக்கு ‘அவர்களின் எண்ணிக்கை’ என்று இயல்பான இணைப்பு சேர்க்கப்பட்டுள்ளது.
