base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/009.yaml
  text: 'They were enrolled by genealogy[a], according to their generations, as heads of their fathers’ houses[b], mighty men of valor: twenty thousand two hundred.'
translation:
  language: ta
  text: அவர்கள் தங்கள் தலைமுறைகளின்படி வம்சாவளிப் பதிவில் சேர்க்கப்பட்டார்கள்[a]. அவர்கள் தங்கள் தந்தைவழிக் குடும்பங்களின் தலைவர்களாகவும்[b], வலிமைமிக்க வீரர்களாகவும் இருந்தார்கள்; அவர்களின் எண்ணிக்கை இருபதாயிரத்து இருநூறு.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வம்சாவளியின்படி பதிவு செய்யப்பட்டார்கள்.’ எபிரெய வினைச்சொல், வம்சாவளிப் பதிவேட்டில் ஒருவரின் பெயர் சேர்க்கப்படுவதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘தந்தைவழிக் குடும்பங்கள்’ என்பது அணுக்குடும்பங்களை மட்டும் குறிக்காமல், பொதுவான மூதாதையரை அடிப்படையாகக் கொண்ட விரிவான குலக் குடும்ப அலகுகளைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִתְיַחְשָׂם
  choice: வம்சாவளிப் பதிவில் சேர்க்கப்பட்டார்கள்
  rationale: יחשׂ என்பதன் ஹித்பயேல் வடிவம் நாளாகமங்களில் ஒருவரை வம்சாவளிப் பதிவில் பதிவு செய்தல் அல்லது கணக்கில் சேர்த்தல் என்பதைக் குறிக்கிறது. இத்தமிழாக்கம் அதன் பதிவுசார் சூழலையும் செயப்பாட்டு நுணுக்கத்தையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לְתֹלְדוֹתָם
  choice: தங்கள் தலைமுறைகளின்படி
  rationale: תולדות என்பது தலைமுறைகள் அல்லது வம்சத் தொடரைக் குறிக்கிறது. ‘தலைமுறைகளின்படி’ என்பது எபிரெயச் சொல்லின் வடிவத்தையும் வம்சாவளிச் சூழலையும் காக்கிறது.
- source_word: רָאשֵׁי בֵּית אֲבוֹתָם
  choice: தங்கள் தந்தைவழிக் குடும்பங்களின் தலைவர்கள்
  rationale: இது அணுக்குடும்பத்தை மட்டும் குறிக்காமல், ஒரே மூதாதையரிடமிருந்து வந்த விரிவான குலக் குடும்ப அலகுகளைக் குறிக்கும் நாளாகமங்களின் வழக்குச் சொற்றொடர். ‘தந்தைவழிக் குடும்பங்கள்’ அதன் சமூக அமைப்பைத் தெளிவுபடுத்துகிறது.
- source_word: גִּבּוֹרֵי חָיִל
  choice: வலிமைமிக்க வீரர்கள்
  rationale: இந்தச் சொற்றொடர் வலிமை, வீரம் மற்றும் போர்த் திறன் உடையவர்களைக் குறிக்கலாம். இச்சூழலில் ‘வலிமைமிக்க வீரர்கள்’ இயல்பாகவும் பொருத்தமாகவும் உள்ளது; அதேவேளையில் திறனும் வீரமும் சார்ந்த விரிந்த பொருளையும் தக்கவைக்கிறது.
- source_word: עֶשְׂרִים אֶלֶף וּמָאתָיִם
  choice: இருபதாயிரத்து இருநூறு
  rationale: எபிரெய எண்ணின் நேரடியான, தமிழ் இலக்கிய நடைக்கு ஏற்ற சொல்வடிவம்.
