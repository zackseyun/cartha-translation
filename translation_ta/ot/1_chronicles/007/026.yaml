translation:
  language: ta
  text: லாதான்[a] அவனுடைய மகன்; அம்மிஹூத் அவனுடைய மகன்; எலிஷாமா அவனுடைய மகன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இந்தப் பெயரை வேறுவிதமான ஒலிபெயர்ப்பில் ‘லாதன்’ என்றும் வழங்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַעְדָּן
  choice: லாதான்
  rationale: எபிரெய தனிப்பெயர் மொழிபெயர்க்கப்படாமல், அதன் உயிரெழுத்தமைப்பைப் பிரதிபலிக்கும் வகையில் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: בְּנוֹ
  choice: அவனுடைய மகன்
  rationale: இந்தச் சொல் நேரடியாக ‘அவனுடைய மகன்’ என்று பொருள்படும். வம்சப்பட்டியல் சூழலில் ‘வழித்தோன்றல்’ என்பதற்கான தெளிவான அழுத்தம் இல்லாததால், நேரடியான உறவுமுறைப் பொருள் தக்கவைக்கப்பட்டுள்ளது.
- source_word: עַמִּיהוּד
  choice: அம்மியூத்
  rationale: எபிரெய தனிப்பெயர் அதன் ஒலிப்புக்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: אֱלִישָׁמָע
  choice: எலிசாமா
  rationale: எபிரெய தனிப்பெயர் அதன் ஒலிப்புக்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
