    text: இந்தப் பெயரை வேறுவிதமான ஒலிபெயர்ப்பில் ‘லாதன்’ என்றும் வழங்கலாம்.
    reason: lexical_alternative
  revision_rationale: Ammihud and Elishama have been corrected to reflect the Hebrew h and sh consonants. The concise genealogical syntax, the literal “அவனுடைய மகன்,” and the existing transliteration alternative for the first name are retained.
