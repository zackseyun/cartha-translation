  text: பெசர், ஹோட், ஷம்மா, ஷில்ஷா, யித்ரான், பெஎரா.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּצֶר
  choice: பெசேர்
  rationale: வம்சப் பட்டியலில் வரும் தனிப்பெயர்; எபிரெய ஒலிப்புக்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: הוֹד
  choice: ஹோத்
  rationale: இங்கு ‘மகிமை’ அல்லது ‘மாட்சிமை’ என்ற பொதுப்பெயர் அல்ல, ஒருவரின் பெயர்; ஆகவே மொழிபெயர்க்காமல் ஒலிபெயர்க்கப்பட்டது.
- source_word: שַׁמָּא
  choice: ஷம்மா
  rationale: எபிரெய வடிவம் இறுதியில் மெய்யொலியில்லாத ‘ஷம்மா’ என்ற வாசிப்பை ஆதரிக்கிறது.
- source_word: שִׁלְשָׁה
  choice: ஷில்ஷா
  rationale: எபிரெய உயிர்க்குறிகளுடன் கூடிய பெயரின் ஒலியை இயல்பான தமிழ் எழுத்துகளில் பிரதிபலிக்கிறது.
- source_word: יִתְרָן
  choice: யித்ரான்
  rationale: தொடக்க எபிரெய யோத் ஒலியை ‘யி’ என்றும், பெயரின் மீதிப் பகுதியை நேரடியாகவும் ஒலிபெயர்க்கிறது.
- source_word: בְאֵרָא
  choice: பேரா
  rationale: நடுவிலுள்ள எபிரெய அலெஃப் குறிக்கும் உயிரிடைவெளியைத் தமிழில் தனியே காட்டுவது இயல்பற்றதாக இருப்பதால், வாசிக்க எளிதான நெருக்கமான வடிவம் பயன்படுத்தப்பட்டது.
theological_decisions: []
translation_notes:
  register: நவீன செந்தமிழ் நடையில், வம்சப் பட்டியலுக்கேற்ற சுருக்கமான பெயர்ப்பட்டியலாக அமைக்கப்பட்டது. ‘ஆகியோர்’ என்பது எபிரெயத்தில் வெளிப்படையாக இல்லாவிட்டாலும், தமிழில் பெயர்ப்பட்டியல் ஒரு முழுமையான வாக்கியமாக இயல்பாக நிறைவடையச் சேர்க்கப்பட்டது. ஆங்கில மரபுவழி பெயர்வடிவங்கள் தமிழுக்கு பொருந்தாததால் அவற்றுக்கான அடிக்குறிப்புகள் சேர்க்கப்படவில்லை.
