base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/036.yaml
  text: 'The sons of Zophah: Suah[a], Harnepher, Shual, Beri, and Imrah.'
translation:
  language: ta
  text: 'சோபாஹின் மகன்கள்[a]: சூஆஹ், ஹர்நெஃபேர், சூஆல், பேரி, யிம்ராஹ்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சோபாஹின் வழித்தோன்றல்கள்.” வம்சப் பட்டியல்களில் எபிரெயச் சொல் சில நேரங்களில் விரிந்த பரம்பரையையும் குறிக்கலாம்; எனினும் “மகன்கள்” என்பதே அதன் நேரடியான மொழிபெயர்ப்பு.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: இது ‘மகன்கள்’ என்பதன் எபிரெயக் கட்டுநிலைப் பன்மை வடிவம். வம்சப் பட்டியல்களில் விரிந்த வழித்தோன்றலையும் குறிக்கக்கூடும்; எனினும் இங்கு நேரடியான பொருளே முதன்மையாக வைக்கப்படுகிறது.
- source_word: צוֹפָח
  choice: சோபாக்
  rationale: மசோரா உரையின் மெய்யெழுத்துகளையும் இறுதி ח ஒலியையும் தமிழில் நெருக்கமாகக் காட்டும் பெயரெழுத்தாக்கம்.
- source_word: סוּחַ
  choice: சூவா
  rationale: தனிப்பெயராக ஒலிபெயர்க்கப்பட்டது; நடுவிலுள்ள வாவ் உயிர்மெய் நகர்வை இயல்பான தமிழில் ‘வா’ எனக் காட்டுகிறது.
- source_word: חַרְנֶפֶר
  choice: கர்நேப்பேர்
  rationale: எபிரெயத் தனிப்பெயரின் ஒலியமைப்பைத் தமிழில் இயன்றவரை நெருக்கமாகப் பிரதிபலிக்கிறது.
- source_word: שׁוּעָל
  choice: சூவால்
  rationale: வேறு இடங்களில் பொதுப்பெயராக வரக்கூடிய சொல் என்றாலும், இங்கு வம்சப் பட்டியலிலுள்ள தனிப்பெயர் என்பதால் ஒலிபெயர்க்கப்படுகிறது.
- source_word: בֵרִי
  choice: பேரி
  rationale: மசோரா உயிர்க்குறிப்பின்படி தனிப்பெயர் ஒலிபெயர்க்கப்படுகிறது.
- source_word: יִמְרָה
  choice: இம்ரா
  rationale: தொடக்க யோத் இங்கு தமிழில் இயல்பாக ‘இ’ எனவும், இறுதி ஒலி ‘ரா’ எனவும் ஒலிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: בְּנֵי குறிக்கும் உறவின் பரப்பு
  choice: மகன்கள்
  alternative: வழித்தோன்றல்கள்
  rationale: வம்சப் பட்டியலில் இச்சொல் பரந்த வழித்தோன்றலைக் குறிக்க வாய்ப்பிருந்தாலும், உடனடி மகன்கள் என்பதே அதன் நேரடியான பொருள். அந்தத் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் சுருக்கமான வம்சப் பட்டியல் நடையைப் பேணுகிறது. தனிப்பெயர்கள் ஆங்கில வடிவிலிருந்து அல்லாமல் WLC எபிரெய உரையின் ஒலியமைப்பிலிருந்து தமிழாக்கப்பட்டுள்ளன.
