translation_notes:
  register: நவீனத் தரத் தமிழில், வம்சப்பட்டியலுக்கேற்ற சுருக்கமான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. பழமையான ‘குமாரர்’, ‘பிதாக்களின் வீடுகள்’ போன்ற சொல்லாட்சிகளைத் தவிர்த்து, மூலத்தின் உறவுமுறை மற்றும் இராணுவ நிழற்பொருள்கள் பாதுகாக்கப்பட்டுள்ளன.
