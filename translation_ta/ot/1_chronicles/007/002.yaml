base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/002.yaml
  text: 'The sons of Tola: Uzzi[a], Rephaiah, Jeriel, Jahmai, Ibsam, and Samuel, heads of their fathers’ houses belonging to Tola, mighty men of valor according to their generations[c][b]. Their number in the days of David was twenty-two thousand six hundred.'
translation:
  language: ta
  text: 'தோலாவின் மகன்கள்: உஸ்ஸி, ரெபாயா, எரியேல், யக்மாய், இப்சாம், சாமுவேல். இவர்கள் தோலா வம்சத்தைச் சேர்ந்த தங்கள் தந்தைவழிக் குடும்பங்களின் தலைவர்கள்[a]; தங்கள் வம்சவரிசைகளின்படி[c] வலிமைமிக்க வீரர்கள்[b]. தாவீதின் நாட்களில் இவர்களுடைய எண்ணிக்கை இருபத்திரண்டாயிரத்து அறுநூறு.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தலைவர்கள்’ என்பதை ‘குலத் தலைவர்கள்’ அல்லது ‘முதன்மையானவர்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘வலிமைமிக்க வீரர்கள்’ என்பதை ‘போர்த்திறன்மிக்கவர்கள்’ அல்லது ‘வீரமிக்க ஆண்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: ‘தங்கள் வம்சவரிசைகளின்படி’ என்பதை ‘தங்கள் தலைமுறைகளின்படி’ அல்லது ‘தங்கள் வம்சப் பதிவுகளின்படி’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי תוֹלָע
  choice: தோலாவின் மகன்கள்
  rationale: வம்சப்பட்டியல் சூழலில் בְּנֵי என்பது நேரடியாக ‘மகன்கள்’ எனப் பொருள்படுகிறது; தொடக்க இணைப்புச்சொல் தமிழில் இயல்பான நடைக்காகத் தனியே மொழிபெயர்க்கப்படவில்லை.
- source_word: עֻזִּי וּרְפָיָה וִירִיאֵל וְיַחְמַי וְיִבְשָׂם וּשְׁמוּאֵל
  choice: உஸ்ஸி, ரெபாயா, எரியேல், யக்மாய், இப்சாம், சாமுவேல்
  rationale: எபிரெய ஒலிப்புக்கு அண்மையாகவும் தமிழில் வாசிக்க இயலுமாறும் ஆள்பெயர்கள் ஒலிபெயர்க்கப்பட்டுள்ளன.
- source_word: רָאשִׁים לְבֵית אֲבוֹתָם
  choice: தங்கள் தந்தைவழிக் குடும்பங்களின் தலைவர்கள்
  rationale: ‘தலைகள்’ என்ற நேரடி உருவகத்தைக் காட்டிலும் அதன் சமூகப் பொருளான குடும்பத் தலைமை தமிழில் தெளிவாகக் கூறப்படுகிறது; בֵּית אָבוֹת என்பது தந்தைவழி மூதாதையர் குடும்ப அலகைக் குறிக்கிறது.
- source_word: לְתוֹלָע
  choice: தோலா வம்சத்தைச் சேர்ந்த
  rationale: இங்குள்ள לְ என்பது தோலாவின் குடும்பக் கிளையுடனான சார்பைக் குறிக்கிறது; ‘தோலாவுக்காக’ என்பதைக் காட்டிலும் இது இயல்பாகவும் சூழலுக்கு ஏற்றவாறும் உள்ளது.
- source_word: גִּבּוֹרֵי חַיִל
  choice: வலிமைமிக்க வீரர்கள்
  rationale: இச்சொற்றொடரில் வலிமை, ஆற்றல், போர்த்திறன் ஆகிய நிழற்பொருள்கள் உள்ளன; ‘வீரர்கள்’ அதன் சாத்தியமான இராணுவப் பொருளைத் தக்கவைக்கிறது.
- source_word: לְתֹלְדוֹתָם
  choice: தங்கள் வம்சவரிசைகளின்படி
  rationale: תּוֹלְדוֹת இங்கு தலைமுறைகள் மட்டுமல்லாமல் வம்சப் பதிவுகள் அல்லது மரபுவழிப் பிரிவுகளையும் குறிக்கலாம்; ‘வம்சவரிசைகளின்படி’ இந்தப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מִסְפָּרָם בִּימֵי דָוִיד עֶשְׂרִים וּשְׁנַיִם אֶלֶף וְשֵׁשׁ מֵאוֹת
  choice: தாவீதின் நாட்களில் இவர்களுடைய எண்ணிக்கை இருபத்திரண்டாயிரத்து அறுநூறு
  rationale: எபிரெய வாக்கியத்தின் காலக் குறிப்பையும் மொத்த எண்ணிக்கையையும் தெளிவான நவீன தமிழில் நேரடியாக வழங்குகிறது.
