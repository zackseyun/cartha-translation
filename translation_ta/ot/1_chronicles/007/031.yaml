source:
  edition: WLC
  text: וּ/בְנֵ֣י בְרִיעָ֔ה חֶ֖בֶר וּ/מַלְכִּיאֵ֑ל ה֖וּא אֲבִ֥י ברזות׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/031.yaml
  text: 'The sons of Beriah: Heber and Malchiel[b][a]; he was the father of Birzaith.'
translation:
  language: ta
  text: பெரியாவின் மகன்கள் ஏபேரும் மல்கியேலும் ஆவர்; மல்கியேல் பிர்சாயித்தின் தந்தை.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தந்தை’ என்பது இங்கு ‘முன்னோர்’ அல்லது பிர்சாயித் என்னும் குலம் அல்லது குடியிருப்பின் ‘நிறுவியவர்’ என்றும் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘பிர்சாயித்’ பெயரை ‘பிர்சோத்’ அல்லது ‘பெராசோத்’ என்றும் ஒலிபெயர்க்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵי בְרִיעָה
  choice: பெரியாவின் மகன்கள்
  rationale: வம்சப்பட்டியல் துணைப்பிரிவை அறிமுகப்படுத்தும் இணைப்புடன் கூடிய சார்புநிலைப் பன்மைத் தொடர். தமிழில் இயல்பாகத் தலைப்புத் தன்மையில் வழங்கப்பட்டுள்ளது; தொடக்க இணைப்பைத் தனியே மொழிபெயர்க்க வேண்டியதில்லை.
- source_word: חֶבֶר
  choice: ஏபேர்
  rationale: எபிரெய தனிப்பெயரின் தமிழ் ஒலிபெயர்ப்பு.
- source_word: וּמַלְכִּיאֵל
  choice: மல்கியேல்
  rationale: இணைப்புடன் வரும் தனிப்பெயர்; பட்டியலில் காற்புள்ளி மூலம் இயல்பாக இணைக்கப்பட்டுள்ளது.
- source_word: הוּא
  choice: இவனே
  rationale: உடனடியாக முன்வரும் ஆண்பால் ஒருமை நபரை மீண்டும் சுட்டும் வலியுறுத்தப்பட்ட தனிப்பெயர்; எபிரெய வாக்கிய அமைப்பின் அழுத்தத்தைத் தமிழ் இயல்பில் காக்கிறது.
- source_word: אֲבִי
  choice: தந்தை
  rationale: மூலத்தின் நேரடியான உறவுச்சொல். வம்சப்பட்டியல் சூழலில் முன்னோர் அல்லது ஒரு குடி/குடியிருப்பின் நிறுவனர் என்ற விரிந்த பொருளும் இருக்கலாம்; அது அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ברזות
  choice: பிர்சாயித்
  rationale: உயிர்க்குறிகள் இல்லாத அரிய தனிப்பெயரின் எச்சரிக்கையான ஒலிபெயர்ப்பு. இது ஒருவரையோ, ஒரு குலத்தையோ, குடியிருப்பையோ குறிக்கலாம் என்பதால் விளக்கப் பெயராக மாற்றப்படவில்லை.
theological_decisions:
- issue: אֲבִי என்பதன் வம்சப்பட்டியல் சார்ந்த பொருள்
  choice: முதன்மை உரையில் ‘தந்தை’
  alternative: ‘முன்னோர்’ அல்லது ‘நிறுவியவர்’
  rationale: உயிரியல் தந்தை என்ற பொருளை மட்டும் கட்டாயப்படுத்தாமலும், மூலத்தின் நேரடி உறவுச்சொல்லைக் காத்தும், விரிந்த சாத்தியங்களை அடிக்குறிப்பில் குறிப்பிடுகிறது.
translation_notes:
  register: நவீனத் தரநிலைத் தமிழில் சுருக்கமான, கண்ணியமான வம்சப்பட்டியல் நடை பயன்படுத்தப்பட்டது. தனிப்பெயர்கள் எபிரெய ஒலியமைப்பை அணுகும் வகையில் தமிழாக்கப்பட்டன. மூலத்தில் அடிக்குறிப்பு குறியீடுகளின் இடம் குழப்பமாக இருந்ததால், ஒவ்வொரு குறிப்பும் தொடர்புடைய முழு கூற்றுக்குப் பின் ஒழுங்காக வைக்கப்பட்டது.
