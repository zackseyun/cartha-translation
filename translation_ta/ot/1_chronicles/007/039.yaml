  text: וּ/בְנֵ֖י עֻלָּ֑א אָרַ֥ח וְ/חַנִּיאֵ֖ל וְ/רִצְיָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/039.yaml
  text: 'The sons of Ulla: Arah[a], Hanniel[d][c][b], and Rizia.'
translation:
  language: ta
  text: 'உல்லாவின் மகன்கள்: ஆராஹ், ஹன்னியேல், ரித்சியா.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: மகன்கள்
  rationale: בְּנֵי என்பது ‘மகன்கள்’ என்ற பொருளுடைய சார்புநிலைப் பன்மை வடிவம். வம்சப் பட்டியல் நடைக்கு இயல்பாக இருக்க, தொடக்க இணைப்புச்சொல் וּ தனியே மொழிபெயர்க்கப்படவில்லை.
- source_word: עֻלָּא
  choice: உல்லா
  rationale: எபிரெயப் பெயரின் மெய்யெழுத்து இரட்டிப்பைப் பிரதிபலிக்கும் ஒலிபெயர்ப்பு.
- source_word: אָרַח
  choice: ஆராகு
  rationale: எபிரெயப் பெயரான אָרַח-ஐத் தமிழ் உச்சரிப்புக்கு ஏற்றவாறு ஒலிபெயர்க்கிறது; இறுதி ח ஒலியை ‘கு’ அண்மையாகக் குறிக்கிறது.
- source_word: חַנִּיאֵל
  choice: அன்னியேல்
  rationale: தொடக்க ח-ஐ தமிழில் இயல்பான ‘அ’வாகவும், இரட்டித்த נּ-ஐ ‘ன்னி’ என்றும், אֵל கூறை ‘யேல்’ என்றும் ஒலிபெயர்க்கிறது.
- source_word: רִצְיָא
  choice: ரித்சியா
  rationale: צְ ஒலியை ‘த்ச்’ என்ற அண்மையான தமிழ் எழுத்தாக்கத்தால் காட்டி, இறுதி வடிவத்தை ‘யா’ என ஒலிபெயர்க்கிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில் சுருக்கமான வம்சப் பட்டியல் நடை பயன்படுத்தப்பட்டுள்ளது. பெயர்கள் மொழிபெயர்க்கப்படாமல் எபிரெய மூலத்திலிருந்து ஒலிபெயர்க்கப்பட்டுள்ளன; தேவையற்ற ஆங்கில மாற்று எழுத்துவடிவக் குறிப்புகள் சேர்க்கப்படவில்லை.
