  text: Nun his son[a], Joshua his son.
translation:
  language: ta
  text: நூன் அவனுடைய மகன்[a]; யோசுவா அவனுடைய மகன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெய மொழியில் ஒவ்வொரு பெயருக்குப் பின்னரும் “அவனுடைய மகன்” என்ற சொற்றொடர் மீண்டும் வருகிறது. இது அடுத்தடுத்த தலைமுறை வழியைச் சுட்டும் வழக்கமான வம்சவரிசை நடை: “நூன் அவனுடைய மகன்; யோசுவா அவனுடைய மகன்.”'
    reason: cultural_note
lexical_decisions:
- source_word: נ֥וֹן
  choice: நூன்
  rationale: நபரின் பெயர் மொழிபெயர்க்கப்படாமல், தமிழில் வழக்கமான வேதாகமப் பெயர்வடிவில் ஒலிபெயர்க்கப்பட்டது.
- source_word: בְּנ֖/וֹ
  choice: அவனுடைய மகன்
  rationale: בֵּן என்பதுடன் மூன்றாம் நபர் ஆண்பால் ஒருமை உடைமைப் பின்னொட்டு சேர்ந்துள்ளதால், அதன் நேரடியான உறவுப்பொருளும் வம்சவரிசை நடையும் காக்கப்பட்டன.
- source_word: יְהוֹשֻׁ֥עַ
  choice: யோசுவா
  rationale: எபிரெயப் பெயரான யெஹோஷுவாவுக்குத் தமிழில் நிலைபெற்ற வேதாகமப் பெயர்வடிவம் பயன்படுத்தப்பட்டது.
- source_word: בְּנֽ/וֹ
  choice: அவனுடைய மகன்
  rationale: அடுத்தடுத்த தலைமுறைத் தொடர்பைக் காட்டும் எபிரெய வம்சவரிசைச் சூத்திரத்தின் மீளுரைத்தல் வெளிப்படையாகப் பாதுகாக்கப்பட்டது.
theological_decisions: []
