  text: וַ/עֲלֵי/הֶ֨ם לְ/תֹלְדוֹתָ֜/ם לְ/בֵ֣ית אֲבוֹתָ֗/ם גְּדוּדֵי֙ צְבָ֣א מִלְחָמָ֔ה שְׁלֹשִׁ֥ים וְ/שִׁשָּׁ֖ה אָ֑לֶף כִּֽי הִרְבּ֥וּ נָשִׁ֖ים וּ/בָנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/004.yaml
  text: And with them, by their generations, according to their fathers' houses, were 36,000 troops for the army of war, for they had many wives and sons.
translation:
  language: ta
  text: அவர்களோடு, அவர்களுடைய வம்சவரிசைகளின்படியும் தந்தையர் குடும்பங்களின்படியும், போருக்கான இராணுவப் பிரிவுகளாக 36,000 பேர் இருந்தார்கள்[a]; ஏனெனில் அவர்களுக்கு மனைவிகளும்[b] மகன்களும் பலர் இருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “போருக்கான இராணுவப் பிரிவுகள்” என்பது எபிரெயத்தில் செறிவாக அமைந்த இராணுவச் சொற்றொடர்; இதை “போருக்குரிய படைப் பிரிவுகள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “மனைவிகள்” என்பதற்கான எபிரெயச் சொல் “பெண்கள்” என்றும் பொருள்படலாம்; இங்குள்ள குடும்ப மற்றும் வம்சவரிசைச் சூழலில் “மனைவிகள்” என்பதே மிகவும் பொருத்தமானது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲלֵיהֶם
  choice: அவர்களோடு
  rationale: பட்டியல் மற்றும் கணக்கெடுப்புச் சூழலில் עַל என்பது அவர்களுடன் தொடர்புடையவர்களை அறிமுகப்படுத்துகிறது; இடத்தைக் குறிக்கும் ‘அவர்கள்மேல்’ என்பதைவிட ‘அவர்களோடு’ இயல்பானது.
- source_word: לְתֹלְדוֹתָם
  choice: அவர்களுடைய வம்சவரிசைகளின்படி
  rationale: תּוֹלְדוֹת என்பது தலைமுறைகள் அல்லது வம்சவரிசைப் பிரிவுகளைக் குறிக்கலாம். இங்கு குலமரபின் அடிப்படையிலான கணக்கைக் குறிப்பதால் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: לְבֵית אֲבוֹתָם
  choice: தந்தைவழிக் குடும்பங்களின்படி
  rationale: எபிரெயச் சமூக அமைப்பில் தந்தைவழி மூதாதையரின் குடும்பக் குழுக்களைக் குறிக்கும் வழக்கமான சொற்றொடர்; நவீனத் தமிழில் அதன் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: גְּדוּדֵי צְבָא מִלְחָמָה
  choice: போருக்கான இராணுவப் படைப்பிரிவுகளில்
  rationale: גְּדוּדֵי, צְבָא, מִלְחָמָה ஆகியவற்றின் படைப்பிரிவு, இராணுவம், போர் என்ற அடுக்கப்பட்ட இராணுவப் பொருளை இயல்பான தமிழில் காக்கிறது.
- source_word: שְׁלֹשִׁים וְשִׁשָּׁה אָלֶף
  choice: 36,000 பேர்
  rationale: எண்ணிக்கையைத் துல்லியமாகவும் நவீன வாசிப்புக்கு எளிதாகவும் தருகிறது; மனிதர்களின் எண்ணிக்கை என்பதால் ‘பேர்’ சேர்க்கப்பட்டது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய பெரிய எண்ணிக்கைக்கான காரணத்தை அறிமுகப்படுத்தும் காரணவியல் இணைப்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: הִרְבּוּ
  choice: பலர் இருந்தார்கள்
  rationale: רבה என்பதன் ஹிஃபில் வடிவம் ‘பலவாக்குதல்/பெருகச் செய்தல்’ எனப் பொருள்படும்; மனைவிகளும் மகன்களும் பொருளாக வருவதால் இயல்பான தமிழில் ‘பலர் இருந்தார்கள்’ என வழங்கப்பட்டது.
- source_word: נָשִׁים
  choice: மனைவிகள்
  rationale: இந்தச் சொல் ‘பெண்கள்’ அல்லது ‘மனைவிகள்’ என இருவகையில் பொருள்படலாம். குடும்ப மற்றும் வம்சவரிசைச் சூழலிலும் ‘மகன்கள்’ என்பதோடு இணைந்திருப்பதாலும் ‘மனைவிகள்’ மிகவும் பொருத்தமானது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: וּבָנִים
  choice: மகன்கள்
  rationale: בָּנִים என்பதன் நேரடிப் பொருளான ‘மகன்கள்’ என்பதைக் காக்கிறது; அதை பொதுவான ‘பிள்ளைகள்’ என்று விரிவுபடுத்தவில்லை.
