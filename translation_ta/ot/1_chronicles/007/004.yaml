translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெயத்தின் கணக்கெடுப்பு மற்றும் வம்சவரிசை அமைப்பைத் தக்கவைத்தபடியே, செறிவான இராணுவச் சொற்றொடர் இயல்பான தமிழாக்கமாக வழங்கப்பட்டுள்ளது.
