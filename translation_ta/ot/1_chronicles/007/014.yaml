  text: בְּנֵ֣י מְנַשֶּׁ֔ה אַשְׂרִיאֵ֖ל אֲשֶׁ֣ר יָלָ֑דָה פִּֽילַגְשׁ/וֹ֙ הָֽ/אֲרַמִּיָּ֔ה יָלְדָ֕ה אֶת מָכִ֖יר אֲבִ֥י גִלְעָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/014.yaml
  text: 'The sons of Manasseh: Asriel[a], whom his Aramean concubine bore[c][b]; she bore Machir the father of Gilead.'
translation:
  language: ta
  text: 'மனாசேயின் மகன்கள்[a]: அஸ்ரியேல்—மனாசேயின் அரமேயப் பெண்ணான[b] துணைமனைவி அவனைப் பெற்றெடுத்தாள்; அவள் கீலேயாத்தின் தந்தையான[c] மாகீரையும் பெற்றெடுத்தாள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மனாசேயின் சந்ததியினர்.’ வம்சவரலாறுகளில் ‘மகன்கள்’ என்பது சில நேரங்களில் சந்ததியினரைப் பொதுவாகக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், ‘அரமேயப் பெண்’; பாரம்பரியமாக, ‘சீரியப் பெண்.’
    reason: lexical_alternative
  - marker: c
    text: வம்சவரலாற்று வழக்கில் ‘தந்தை’ என்பது ‘மூதாதை’ அல்லது ‘நிறுவியவர்’ என்ற பொருளையும் தரக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי מְנַשֶּׁה
  choice: மனாசேயின் மகன்கள்
  rationale: בְּנֵי என்பதன் நேரடியான பொருள் ‘மகன்கள்.’ வம்சவரலாற்றுச் சூழலில் இது சந்ததியினரையும் குறிக்கலாம் என்பதால் அந்த வாய்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אַשְׂרִיאֵל
  choice: அஸ்ரியேல்
  rationale: எபிரெய தனிப்பெயரின் ஒலியை இயன்றவரை தக்கவைக்கும் தமிழ் ஒலிபெயர்ப்பு.
- source_word: אֲשֶׁר יָלָדָה
  choice: அவனை ... பெற்றெடுத்தாள்
  rationale: மூன்றாம் நபர் பெண்பால் ஒருமை வினைச்சொல்லையும், தொடர்புச் சொல்லின் முன்னிலைப் பெயரான அஸ்ரியேலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: פִּילַגְשׁוֹ
  choice: மனாசேயின் ... மறுமனைவி
  rationale: פִּילֶגֶשׁ என்பது முழு மனைவியைவிடக் குறைந்த சமூக நிலையிலிருந்த துணைவியைக் குறிக்கிறது. ‘மறுமனைவி’ என்பது இங்கு இயல்பாகவும் கண்ணியமாகவும் உள்ளது; ‘மனாசேயின்’ என்று பெயரைத் திரும்பச் சொல்வது தமிழ் வாசகருக்கு சுட்டுப்பெயர் குழப்பத்தைத் தவிர்க்கிறது.
- source_word: הָאֲרַמִּיָּה
  choice: அரமேய
  rationale: இச்சொல் அரமேய இனத்தைச் சேர்ந்த பெண்ணைக் குறிக்கிறது. பிற்கால நிலப்பெயரான ‘சீரிய’ என்பதைவிட ‘அரமேய’ வரலாற்றுத் துல்லியத்தைப் பேணுகிறது.
- source_word: יָלְדָה אֶת מָכִיר
  choice: அவள் ... மாகீரையும் பெற்றெடுத்தாள்
  rationale: பெண்பால் எழுவாயை மீண்டும் வெளிப்படுத்தும் எபிரெய வாக்கிய அமைப்பைப் பேணுகிறது. ‘-யும்’ என்பது முன் கூறப்பட்ட பிறப்புச் செய்தியுடன் இதை இயல்பாக இணைக்கிறது.
- source_word: אֲבִי גִלְעָד
  choice: கீலேயாத்தின் தந்தையான
  rationale: אָב என்பதன் அடிப்படைப் பொருளான ‘தந்தை’ பிரதான உரையில் தக்கவைக்கப்படுகிறது; வம்சவரலாற்றில் சாத்தியமான விரிவான பொருள்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
