base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/007.yaml
  text: 'And the sons of Bela: Ezbon[a], Uzzi, Uzziel, Jerimoth, and Iri—five heads of fathers’ houses, mighty men of valor; and their genealogical enrollment was twenty-two thousand and thirty-four.'
translation:
  language: ta
  text: 'பெலாவின் மகன்கள்: எஸ்போன், உஸ்ஸி, உஸ்ஸியேல், யெரிமோத், ஈரி ஆகிய ஐந்து பேர் தந்தைவழிக் குடும்பங்களின் தலைவர்களும் வலிமைமிக்க வீரர்களுமாயிருந்தார்கள்; அவர்களுடைய வம்சாவளிப் பதிவு[a] இருபத்திரண்டாயிரத்து முப்பத்து நான்காக இருந்தது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுடைய வம்சவரலாறு” அல்லது “வம்சாவளிப்படி செய்யப்பட்ட அவர்களுடைய பதிவு.” வம்சாவளி ஆவணங்களில் ஒருவர் பதிவுசெய்யப்பட்டிருப்பதை எபிரெயச் சொல் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי בֶלַע
  choice: பெலாவின் மகன்கள்
  rationale: בְנֵי என்பதன் நேரடிப் பொருள் ‘மகன்கள்’; பெயரிடப்பட்ட ஆண் வழித்தோன்றல்கள் தொடர்வதால் இங்கே அதுவே இயல்பான தேர்வு.
- source_word: אֶצְבּוֹן וְעֻזִּי וְעֻזִּיאֵל וִירִימוֹת וְעִירִי
  choice: எஸ்போன், உஸ்ஸி, உஸ்ஸியேல், யெரிமோத், ஈரி
  rationale: எபிரெய தனிப்பெயர்களின் ஒலியை நவீனத் தமிழில் தெளிவாகக் காட்டும் எழுத்துப்பெயர்ப்பு.
- source_word: רָאשֵׁי בֵּית אָבוֹת
  choice: தந்தைவழிக் குடும்பங்களின் தலைவர்கள்
  rationale: ‘தந்தையர் வீடு’ என்ற எபிரெய சமூக-வம்சவழிச் சொல்லைச் சொற்சொல்லாகக் கடினப்படுத்தாமல், அதன் தந்தைவழிக் குடும்ப அமைப்பையும் தலைமைப் பொருளையும் காக்கிறது.
- source_word: גִּבּוֹרֵי חֲיָלִים
  choice: வலிமைமிக்க வீரர்கள்
  rationale: போர்திறன், வலிமை, வீரியம் ஆகிய பொருள்களை இயல்பான தமிழில் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: וְהִתְיַחְשָׂם
  choice: அவர்களுடைய வம்சாவளிப் பதிவில் இருந்தவர்களின் எண்ணிக்கை
  rationale: Chronicles நூலில் יחס என்பதன் Hitpael வடிவம் வம்சாவளி அடிப்படையில் பதிவுசெய்யப்படுதலைக் குறிக்கிறது. தொடர்ந்து வரும் எண்ணிக்கையுடன் தமிழில் இயல்பாக இணைய ‘பதிவில் இருந்தவர்களின் எண்ணிக்கை’ என வழங்கப்பட்டுள்ளது.
- source_word: עֶשְׂרִים וּשְׁנַיִם אֶלֶף וּשְׁלֹשִׁים וְאַרְבָּעָה
  choice: இருபத்திரண்டாயிரத்து முப்பத்து நான்கு
  rationale: எபிரெய எண்ணமைப்பான 22,000 + 34 என்பதைக் தமிழில் சொற்களாக இயல்பாக வழங்குகிறது.
