translation_notes:
  register: நவீன நிலையான தமிழில், வரலாற்று வம்சப்பட்டியலுக்கேற்ற கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. தொழில்நுட்பமான ‘தந்தையர் வீடுகள்’ என்பதற்குப் பதிலாக அதன் சமூகப் பொருளைத் தெளிவாக்கும் ‘தந்தைவழிக் குடும்பங்கள்’ பயன்படுத்தப்பட்டுள்ளது; வம்சப் பதிவு குறித்த மூலமொழியின் பொருள் வேறுபாடுகள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.
