  rationale: எபிரெய தனிப்பெயரின் ஒலிக்கு நெருக்கமான தமிழ் ஒலிபெயர்ப்பு; தொடக்க ח தனியாகக் கடினமான தமிழ் மெய்யால் மாற்றப்படவில்லை.
- source_word: שׁוּעָא
