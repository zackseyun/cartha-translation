translation_notes:
  register: நவீன நிலையான தமிழில், வம்சப் பட்டியலுக்கேற்ற சுருக்கமும் கண்ணியமும் பேணப்பட்டுள்ளன. எபிரெய மொழியின் «அவர்களுடைய சகோதரி» என்ற பன்மைக் குறிப்பை ஒருமையாக மாற்றாமல் காத்து, தமிழில் இயல்பாக அமைய «இவர்களுடைய சகோதரியான» எனப் பெயருக்கு முன் அமைக்கப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
