  text: וּ/בְנֵ֖י שָׁ֑מֶר אֲחִ֥י ו/רוהגה יחבה וַ/אֲרָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/034.yaml
  text: 'And the sons of Shemer: Ahi[a], Rohgah, Jehubbah[b], and Aram.'
translation:
  language: ta
  text: 'மேலும், ஷாமெரின் மகன்கள்[a]: அஹி, ரோஹ்கா, யெஹுப்பா[b], அராம்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய வம்சப்பட்டியல்களில் ‘மகன்கள்’ என்பது உடனடியாகப் பிறந்த மகன்களை மட்டுமல்லாமல், ஆண் வழித்தோன்றல்களையோ குல உறுப்பினர்களையோ குறிக்கவும் பயன்படுத்தப்படலாம்.
    reason: cultural_note
  - marker: b
    text: இந்த எபிரெயப் பெயர் ஒலிப்பெயர்ப்பு முறையைப் பொறுத்து ‘யெஹுப்பா’ அல்லது ‘ஹுப்பா’ போன்ற வடிவங்களில் எழுதப்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: மகன்கள்
  rationale: בן என்பதன் பன்மை இணைப்புநிலை வடிவம். வம்சப்பட்டியல் சூழலில் இது நேரடி மகன்களையோ ஆண் வழித்தோன்றல்களையோ குல உறுப்பினர்களையோ குறிக்கக்கூடும்; இயல்பான தமிழ் வம்சப்பட்டியல் நடையில் ‘மகன்கள்’ பொருத்தமானது. தொடக்க ו இணைப்பை தனியே ‘மேலும்’ என்று மொழிபெயர்ப்பது இத்தனித்த வசனத்தில் இயல்பாக இல்லாததால் பெயர்ச்சொல் தொடரின் அமைப்பிலேயே விடப்பட்டுள்ளது.
- source_word: שָׁמֶר
  choice: சேமேர்
  rationale: எபிரெய தனிப்பெயரின் ஒலிப்பெயர்ப்பு; தமிழில் வாசிக்க இயல்பாகவும் மூல ஒலிக்கு நெருக்கமாகவும் உள்ளது.
- source_word: אֲחִי
  choice: அகி
  rationale: இங்கு ‘என் சகோதரன்’ என்ற பொதுப்பொருளில் அல்லாமல் வம்சப்பட்டியலிலுள்ள தனிப்பெயராகச் செயல்படுகிறது; அதனால் மொழிபெயர்க்காமல் ஒலிப்பெயர்க்கப்பட்டுள்ளது.
- source_word: וְרוֹהְגָה
  choice: ரோகா
  rationale: தனிப்பெயர் ஒலிப்பெயர்க்கப்பட்டுள்ளது. முன்னுள்ள ו பட்டியலின் இணைப்பாகத் தமிழில் காற்புள்ளியால் இயல்பாக வெளிப்படுகிறது.
- source_word: יְחֻבָּה
  choice: யெகுப்பா
  rationale: தொடக்க yod மற்றும் நடுவிலுள்ள வலியுறுத்தப்பட்ட மெய்யொலியைத் தமிழில் இயன்ற அளவு பிரதிபலிக்கும் ஒலிப்பெயர்ப்பு.
- source_word: וַאֲרָם
  choice: அராம்
  rationale: אֲרָם என்ற எபிரெய வடிவை நேரடியாக ஒலிப்பெயர்த்தது; முன்னுள்ள ו பட்டியலின் இறுதி இணைப்பாகத் தமிழில் காற்புள்ளி அமைப்பால் வெளிப்படுகிறது.
theological_decisions:
- issue: ‘மகன்கள்’ என்ற வம்சப்பட்டியல் சொல்லின் பரப்பு
  choice: முதன்மை உரையில் ‘மகன்கள்’ என்று வைத்து, அதன் விரிவான வம்சவழிப் பயன்பாட்டை அடிக்குறிப்பில் குறிப்பிடுதல்
  alternative: ‘வழித்தோன்றல்கள்’ அல்லது ‘குலத்தார்’ என்று முதன்மை உரையிலேயே விரிவுபடுத்துதல்
  rationale: மூலத்தின் வழக்கமான உறவுச்சொல்லைப் பாதுகாக்கிறது; அதே நேரத்தில் அது உடனடி உயிரியல் மகன்களை மட்டுமே அவசியமாகக் குறிக்காது என்ற உண்மையான பொருள் நெகிழ்வையும் மறைக்கவில்லை.
translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, சுருக்கமான வம்சப்பட்டியல் நடை பயன்படுத்தப்பட்டுள்ளது. ‘குமாரர்கள்’ என்பதற்குப் பதில் பொதுவாகப் புரியும் ‘மகன்கள்’ தேர்ந்தெடுக்கப்பட்டது. தனிப்பெயர்கள் மூல எபிரெய ஒலிகளுக்கு நெருக்கமாகத் தமிழாக்கப்பட்டுள்ளன.
