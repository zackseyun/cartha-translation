base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/011.yaml
  text: Now[a], my son, may Yahweh be with you, and may you prosper and build the house of Yahweh your God[c][b], as he has spoken concerning you.
translation:
  language: ta
  text: இப்போது, என் மகனே, யாவே உன்னோடு இருப்பாராக! நீ வெற்றிபெற்று, அவர் உன்னைக் குறித்து சொன்னபடியே உன் தேவனாகிய யாவேவின் இல்லத்தைக்[b] கட்டுவாயாக.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ‘உன் தேவனாகிய யாவேவின் ஆலயம்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயில் சொல்லுக்குச் சொல், ‘உன் தேவனாகிய யாவேவின் வீடு/இல்லம்.’
    reason: lexical_alternative
  - marker: c
    text: ‘உன்னைக் குறித்து அவர் வாக்குறுதி அளித்தபடியே’ என்றும் பொருள் கொள்ளலாம். எபிரெயில் இன்னும் நேரடியாக, ‘உன்னைக் குறித்து அவர் சொன்னபடியே.’
    reason: alternative_reading
lexical_decisions:
- source_word: עַתָּה
  choice: இப்போது
  rationale: தாவீதின் ஆசீர்வாதத்தையும் அறிவுறுத்தலையும் தொடங்கும் காலக் குறிப்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְנִי
  choice: என் மகனே
  rationale: முதலாம் நபர் ஒருமை உடைமை விகுதியையும் தந்தைக்குரிய நேரடி அழைப்பின் அன்பான தொனியையும் காக்கிறது.
- source_word: יְהִי יְהוָה עִמָּךְ
  choice: யாவே உன்னோடு இருப்பாராக
  rationale: יְהִי என்பதன் ஆசீர்வாத அல்லது விருப்பப் பொருளை ‘இருப்பாராக’ வெளிப்படுத்துகிறது; יהוה என்பது பட்டப்பெயரால் மாற்றப்படாமல் ‘யாவே’ எனப் பெயர்த்தெழுதப்படுகிறது.
- source_word: וְהִצְלַחְתָּ
  choice: நீ வெற்றிபெறுவாயாக
  rationale: צלח என்பதன் சூழலுக்கேற்ற ‘வெற்றிபெறு/சித்தியடை’ பொருளைத் தருகிறது; இதை பொருளாதாரச் செழிப்பாகக் குறுக்கவில்லை.
- source_word: וּבָנִיתָ
  choice: கட்டுவாயாக
  rationale: முந்தைய ஆசீர்வாதத்தோடு தொடரும் எதிர்பார்ப்பையும் அறிவுறுத்தலையும் தமிழில் இயல்பான விருப்ப வடிவில் தருகிறது.
- source_word: בֵּית יְהוָה אֱלֹהֶיךָ
  choice: உன் தேவனாகிய யாவேவின் இல்லம்
  rationale: ‘யாவேவின் வீடு/இல்லம்’ என்ற எபிரெய உருவகத்தையும் அதன் இறையியல் ஒலிப்பையும் காக்கிறது; ‘ஆலயம்’ என்பது விளக்க மாற்றாக அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: כַּאֲשֶׁר דִּבֶּר עָלֶיךָ
  choice: உன்னைக் குறித்து அவர் சொன்னபடியே
  rationale: דבר + על என்பதன் ‘ஒருவரைக் குறித்துச் சொல்’ என்ற நேரடிப் பொருளைக் காக்கிறது; அதை வெளிப்படையாக ‘வாக்குறுதி அளித்தார்’ எனத் தீர்மானிக்கவில்லை.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது; ஆகவே பட்டப்பெயரால் மாற்றாமல் தமிழில் பொதுவாக ஏற்ற ஒலிபெயர்ப்பு பயன்படுத்தப்படுகிறது.
- issue: தாவீது சாலொமோனிடம் கூறும் வினைத்தொடரின் வலிமை
  choice: 'ஆசீர்வாதம்/விருப்பம்: ‘இருப்பாராக ... வெற்றிபெறுவாயாக ... கட்டுவாயாக’'
  alternative: 'முன்னறிவிப்பு: ‘இருப்பார் ... வெற்றிபெற்று கட்டுவாய்’'
  rationale: தொடக்கத்திலுள்ள יְהִי தெளிவான விருப்ப அல்லது ஆசீர்வாத வலிமையுடையது. தொடர்ந்து வரும் நிறைவுவடிவ வினைகள் எதிர்பார்க்கப்படும் விளைவாகவும் வாசிக்கப்படலாம்; தமிழில் ஆசீர்வாதத் தொடர்ச்சியாக வழங்குவது சூழலுக்கு ஏற்றது, மாற்று உணர்வு குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: ‘அவர் சொன்னார்’ என்பதா, ‘வாக்குறுதி அளித்தார்’ என்பதா
  choice: உன்னைக் குறித்து அவர் சொன்னபடியே
  alternative: உன்னைக் குறித்து அவர் வாக்குறுதி அளித்தபடியே
  rationale: இச்சூழலில் முந்தைய இறைவாக்கு வாக்குறுதியாகச் செயல்பட்டாலும், எபிரெய வினை பொதுவாக ‘சொல்/பேசு’ என்பதே; அதனால் கூடுதல் விளக்கத்தை முதன்மை உரையில் புகுத்தவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான தந்தைமைக் ஆசீர்வாத நடையைப் பயன்படுத்துகிறது. ‘இல்லம்’ என்ற சொல் எபிரெய உருவகத்தைப் பாதுகாக்கிறது; வாசகருக்குப் பரிச்சயமான ‘ஆலயம்’ அடிக்குறிப்பில் வழங்கப்படுகிறது. இறுதி ‘இது நிறைவேறட்டும்’ என்பது தமிழில் முன் கூறிய இறைவார்த்தையுடன் ஆசீர்வாதத்தை இணைக்க உதவும் வெளிப்படுத்தப்பட்ட கூறாகும்.
