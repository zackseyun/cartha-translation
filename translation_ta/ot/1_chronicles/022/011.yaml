- from: இப்போது, என் மகனே, யாவே உன்னோடு இருப்பாராக! நீ வெற்றிபெறுவாயாக[a]; உன் தேவனாகிய யாவேவின் இல்லத்தைக்[b] கட்டுவாயாக. உன்னைக் குறித்து அவர் சொன்னபடியே[c] இது நிறைவேறட்டும்.
