reference: 1 Chronicles 22:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר דָּוִ֖יד לִ/שְׁלֹמֹ֑ה בנ/ו אֲנִי֙ הָיָ֣ה עִם לְבָבִ֔/י לִ/בְנ֣וֹת בַּ֔יִת לְ/שֵׁ֖ם יְהוָ֥ה אֱלֹהָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/007.yaml
  text: And David said to Solomon his son[a], “As for me[b], it was in my heart to build a house for the name of Yahweh my God.”
translation:
  language: ta
  text: தாவீது தன் மகன் சாலொமோனிடம், “என்னைப் பொறுத்தவரை, என் கடவுளாகிய யாவேயின் பெயருக்காக ஒரு வீட்டைக்[a] கட்ட வேண்டும் என்ற எண்ணம் என் உள்ளத்தில் இருந்தது[b]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஓர் ஆலயத்தைக்.’ எபிரெயத்தில் நேரடியாக ‘ஒரு வீட்டைக்’ என்றுள்ளது; இங்கு அது யாவேக்காகக் கட்டப்படவிருந்த ஆலயத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அதைச் செய்ய என் மனத்தில் தீர்மானித்திருந்தேன்.’ எபிரெய மொழிவழக்கு தாவீதின் உள்ளார்ந்த நோக்கம் அல்லது தீர்மானத்தை வெளிப்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: என்றார்
  rationale: வாவ் தொடர்ச்சியால் கதை முன்னேறுகிறது; தமிழில் இயல்பான வாக்கிய அமைப்புக்கேற்ப பேச்சின் முடிவில் ‘என்றார்’ என வழங்கப்பட்டது.
- source_word: לִשְׁלֹמֹה בְנוֹ
  choice: தன் மகன் சாலொமோனிடம்
  rationale: உறவையும் பெயரையும் தெளிவாகக் காக்கும் இயல்பான நவீனத் தமிழ் நடை.
- source_word: אֲנִי
  choice: என்னைப் பொறுத்தவரை
  rationale: எபிரெயத்தில் வெளிப்படையாக வரும் முதலாம் நபர் சுட்டுப்பெயரின் வலியுறுத்தலைக் காட்டுகிறது.
- source_word: הָיָה עִם לְבָבִי
  choice: என்ற எண்ணம் என் உள்ளத்தில் இருந்தது
  rationale: தாவீதின் உள்ளார்ந்த நோக்கம் அல்லது தீர்மானத்தைச் சுட்டும் எபிரெய மொழிவழக்கை, அதன் ‘உள்ளம்’ என்ற உருவகத்தைக் காத்து இயல்பான தமிழில் தருகிறது.
- source_word: לִבְנוֹת בַּיִת
  choice: ஒரு வீட்டைக் கட்ட
  rationale: בַּיִת என்பதன் நேரடிப் பொருளான ‘வீடு’ காக்கப்படுகிறது; இங்கு குறிக்கப்படுவது ஆலயம் என்பது அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
- source_word: לְשֵׁם
  choice: பெயருக்காக
  rationale: யாவேயின் பெயருக்கென அர்ப்பணிக்கப்படும் இடம் என்ற உடன்படிக்கை மற்றும் வழிபாட்டுச் சார்ந்த சொல்லாட்சியைப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பட்டத்தால் மாற்றாமல், எபிரெய இறைப்பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אֱלֹהָי
  choice: என் கடவுள்
  rationale: முதலாம் நபர் ஒருமை உடைமை விகுதியைத் தெளிவாகக் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக இருப்பதால், அதை ஒரு பட்டத்தால் மாற்றாமல் ஒலிபெயர்ப்பாக வழங்குகிறது.
- issue: בַּיִת என்பதை ‘வீடு’ அல்லது ‘ஆலயம்’ என வழங்குதல்
  choice: வீடு
  alternative: ஆலயம்
  rationale: மூலத்தின் நேரடிச் சொல்லையும் ‘யாவேயின் பெயருக்காக ஒரு வீடு’ என்ற வேதாகமச் சொல்லாட்சியையும் காக்கிறது; சூழலில் அது ஆலயத்தைக் குறிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘என்னைப் பொறுத்தவரை’ என்பது אֲנִי என்பதன் வலியுறுத்தலை வெளிப்படுத்துகிறது; ‘என் உள்ளத்தில் இருந்தது’ என்ற மூல உருவகம் இயன்றவரை காக்கப்பட்டுள்ளது.
