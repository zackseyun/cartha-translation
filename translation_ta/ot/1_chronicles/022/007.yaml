  source_fidelity: 'மூல எபிரெயத்தின் கூறுகள் துல்லியமாகக் காக்கப்பட்டுள்ளன: தாவீது சாலொமோனிடம் பேசுதல், வலியுறுத்தலான ‘என்னைப் பொறுத்தவரை,’ உள்ளார்ந்த நோக்கத்தைக் குறிக்கும் ‘என் உள்ளத்தில் இருந்தது,’ ‘வீடு’ என்ற சொல்லாட்சி, ‘யாவே,’ மற்றும் ‘என் கடவுள்’ ஆகியவை அனைத்தும் பொருத்தமாக உள்ளன. ‘ஒரு வீட்டைக் கட்ட வேண்டும் என்ற எண்ணம்’ என்பது לִבְנוֹת என்பதன் தாவீதுசார்ந்த நோக்கத்தைச் சூழலோடு இயல்பாகத் தருகிறது.'
