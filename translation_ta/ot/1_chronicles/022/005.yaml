base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/005.yaml
  text: And David said[a], “My son Solomon is young and inexperienced, and the house to be built for Yahweh must be made exceedingly great in fame and splendor in all lands[c][b]. I will now make preparation for it.” So David made abundant preparations before his death.
translation:
  language: ta
  text: தாவீது, “என் மகன் சாலொமோன் இளைஞனும் அனுபவமற்றவனுமாய் இருக்கிறான்[a]. யாவேக்காகக் கட்டப்படவிருக்கும் வீடு மிகவும் மகத்தானதாக இருக்க வேண்டும்; எல்லா நாடுகளிலும் புகழுக்கும் மகிமைக்கும் உரியதாக இருக்க வேண்டும்[c][b]. அதற்கான ஏற்பாடுகளை நான் இப்போதே செய்வேன்” என்றார். தாவீது தன் மரணத்திற்கு முன் ஏராளமான ஏற்பாடுகளைச் செய்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இளைஞனும் மென்மையானவனுமாய் இருக்கிறான்.” எபிரெயச் சொல் மென்மை அல்லது முதிர்ச்சியின்மையைக் குறிக்கலாம்; இங்கு அனுபவக் குறைவைச் சுட்டுவதாக இருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “ஆலயம்.” எபிரெயத்தில், “வீடு.”
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “எல்லா நாடுகளிலும் பெயருக்கும் மகிமைக்கும் உரியதாக.” ‘புகழும் மகிமையும்’ என்பதை ‘பெயரும் சிறப்பும்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעַר
  choice: இளைஞன்
  rationale: சாலொமோனின் ஒப்பீட்டளவிலான இளமையைக் குறிக்கிறது; கண்டிப்பாகச் சிறுவன் என்ற பொருளைத் திணிக்காமல் இயல்பான தமிழில் தருகிறது.
- source_word: וָרָךְ
  choice: அனுபவமற்றவன்
  rationale: அடிப்படையில் ‘மென்மையானவன்’ எனப் பொருள்படும் சொல் இங்கு இளமையோடு இணைந்து முதிர்ச்சி அல்லது ஆயத்தம் குறைவாக இருப்பதைச் சுட்டுகிறது; மூலத்தின் நேரடியான மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: הַבַּיִת
  choice: ஆலயம்
  rationale: எபிரெயத்தில் நேரடியாக ‘வீடு’ என்றாலும், யெகோவாவுக்குக் கட்டப்படவிருந்த பரிசுத்த கட்டடம் என்பதால் நவீன தமிழில் ‘ஆலயம்’ தெளிவாகவும் இயல்பாகவும் உள்ளது; நேரடி வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לַיהוָה
  choice: யெகோவாவுக்காக
  rationale: יהוה என்ற உடன்படிக்கைப் பெயரை பொதுவான தமிழ் வேதாகமப் பயன்பாட்டிற்கு ஏற்ற ‘யெகோவா’ என ஒலிபெயர்க்கிறது; ஒரு பட்டப்பெயராக மாற்றவில்லை.
- source_word: לְהַגְדִּיל לְמַעְלָה
  choice: மிகவும் மேன்மையானதாக
  rationale: கட்டடத்தின் அளவு மற்றும் சிறப்பை மிக உயர்ந்த நிலையில் வலியுறுத்தும் எபிரெயச் சொல்லமைப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לְשֵׁם וּלְתִפְאֶרֶת
  choice: புகழும் மகிமையும் பெறுவதாக
  rationale: ‘பெயருக்காகவும் சிறப்புக்காகவும்’ என்ற நோக்கம் அல்லது விளைவு சார்ந்த நுணுக்கத்தை வாசிக்க இயல்பான தமிழில் தருகிறது; மேலும் நேரடியான மாற்றுகள் அடிக்குறிப்பில் உள்ளன.
- source_word: לְכָל הָאֲרָצוֹת
  choice: எல்லா நாடுகளிலும்
  rationale: பன்மையான ‘நிலங்கள்’ இங்கு உலகின் நாடுகள் அல்லது பிரதேசங்களைக் குறிக்கிறது.
- source_word: אָכִינָה נָּא לוֹ
  choice: அதற்காக நான் இப்போதே ஆயத்தம் செய்வேன்
  rationale: விருப்புறுதி வடிவம் தாவீதின் தீர்மானத்தை வெளிப்படுத்துகிறது; பின்னொட்டு ஆலயம் அல்லது கட்டுமானத் திட்டத்தைக் குறிப்பதாக எடுத்துக்கொள்ளப்பட்டுள்ளது.
- source_word: לָרֹב
  choice: ஏராளமாக ஆயத்தம் செய்தார்
  rationale: தாவீதின் ஆயத்தங்களின் மிகுதியைக் குறிக்கும் வினையடைப் பொருளை இயல்பான தமிழில் காக்கிறது.
- source_word: לִפְנֵי מוֹתוֹ
  choice: தான் இறப்பதற்கு முன்பே
  rationale: காலத் தொடர்பைத் தெளிவாகத் தருவதோடு, ‘-ஏ’ ஆயத்தம் முன்கூட்டியே நடைபெற்றதை இயல்பாக வலியுறுத்துகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழியாக்கம்
  choice: யெகோவா
  alternative: யாவே
  rationale: மூலத்தில் உள்ள தனிப்பட்ட உடன்படிக்கைப் பெயரைப் பொதுப்பட்டமான ‘கர்த்தர்’ என மாற்றாமல் ஒலிபெயர்க்கிறது; தமிழில் பரவலாக அறியப்பட்ட வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- issue: הַבַּיִת என்பதை ‘வீடு’ அல்லது ‘ஆலயம்’ என மொழியாக்குதல்
  choice: ஆலயம்
  alternative: வீடு
  rationale: மூலத்தின் உருவகத்தன்மையை அடிக்குறிப்பில் காத்தபடி, இங்கு குறிக்கப்படும் பரிசுத்த கட்டடத்தை சாதாரண வாசகருக்கு உடனடியாகத் தெளிவாக்குகிறது.
- issue: לְשֵׁם וּלְתִפְאֶרֶת என்பதன் நோக்கம்/விளைவு
  choice: புகழும் மகிமையும் பெறுவதாக
  alternative: பெயருக்காகவும் மகிமைக்காகவும்
  rationale: இந்தப் புகழும் மகிமையும் ஆலயத்தோடு இலக்கண ரீதியாக இணைவதைப் பாதுகாக்கிறது; அவை நேரடியாகக் கடவுளுக்குரியவை என்று விளக்கிச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், கண்ணியமான வரலாற்று நடையுடன் வடிவமைக்கப்பட்டது. மூலத்தின் ‘வீடு’ மற்றும் ‘மென்மையானவன்’ ஆகிய நேரடி சொற்கள் வாசிப்பின் தெளிவுக்காக முதன்மை உரையில் பொருள்சார் முறையில் மொழியாக்கப்பட்டு, அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன. நோக்கம்/விளைவு சார்ந்த எபிரெயத் தெளிவின்மை தேவையின்றித் தீர்க்கப்படவில்லை.
