  rationale: The revision follows the project’s current rendering of the divine name, restores the Hebrew’s explicit “house” in the main text, and keeps the contextual interpretation “temple” in a footnote. It also smooths the preparation idiom and expresses the building’s exceptional greatness and intended international renown without adding interpretive theological content.
