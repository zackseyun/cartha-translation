revisions:
- from: தாவீது, “என் மகன் சாலொமோன் இளைஞனும் அனுபவமற்றவனுமாய் இருக்கிறான்[a]. யெகோவாவுக்காகக் கட்டப்பட வேண்டிய ஆலயம்[b] மிகவும் மேன்மையானதாகவும், எல்லா நாடுகளிலும் புகழும் மகிமையும் பெறுவதாகவும் இருக்க வேண்டும்[c]. ஆகவே, அதற்காக நான் இப்போதே ஆயத்தம் செய்வேன்” என்றார். தாவீது தான் இறப்பதற்கு முன்பே அதற்காக ஏராளமாக ஆயத்தம் செய்தார்.
