source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר דָּוִ֔יד זֶ֣ה ה֔וּא בֵּ֖ית יְהוָ֣ה הָ/אֱלֹהִ֑ים וְ/זֶה מִּזְבֵּ֥חַ לְ/עֹלָ֖ה לְ/יִשְׂרָאֵֽל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/001.yaml
  text: Then David said[a], “This is the house of Yahweh God[b], and this is the altar for burnt offering for Israel.”
translation:
  language: ta
  text: அப்போது தாவீது, “இதுவே யாவே தேவனுடைய வீடு[a]; இதுவே இஸ்ரவேலுக்காகத் தகனபலி செலுத்துவதற்கான பலிபீடம்[b]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவே தேவனுடைய ஆலயம்.” எபிரெயத்தில் நேரடியாக, “யாவே தேவனுடைய வீடு.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “இஸ்ரவேலுக்கான தகனபலிகளின் பலிபீடம்.” எபிரெயத்தில் ‘தகனபலி’ ஒருமையில் இருந்தாலும், அது பொதுவகையாகப் பன்மைப் பொருளில் புரிந்துகொள்ளப்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றார்
  rationale: வாவ் தொடர் வடிவம் நிகழ்வின் தொடர்ச்சியை முன்னெடுக்கிறது; ‘அப்போது’ என்பது இயல்பான தமிழ் கதைநடையில் அந்த வரிசையை வெளிப்படுத்துகிறது.
- source_word: דָּוִיד
  choice: தாவீது
  rationale: தமிழ் வேதாகம மரபில் பரவலாக அறியப்படும் பெயர்வடிவம்.
- source_word: זֶה הוּא
  choice: இதுவே
  rationale: சுட்டுப்பெயரும் வலியுறுத்தும் பெயர்ப்பதிலியும் சேர்ந்துள்ள அடையாளப்படுத்தும் வலிமையை ‘இதுவே’ இயல்பாகக் காக்கிறது.
- source_word: בֵּית
  choice: வீடு
  rationale: எபிரெயச் சொல் நேரடியாக ‘வீடு’ என்று பொருள்படுகிறது. சூழலில் வருங்கால ஆலயத்தைக் குறித்தாலும், மூலத்தின் உருவகத்தையும் இறையியல் ஒலிப்பையும் இது பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: நான்கெழுத்துத் திருப்பெயரை ஒரு பொதுப் பட்டத்தால் மாற்றாமல், நவீன தமிழில் பரவலாக அறியப்படும் தனிப்பெயர் வடிவில் வழங்குகிறது.
- source_word: הָאֱלֹהִים
  choice: தேவன்
  rationale: திருப்பெயருடன் இணைந்து வரும் குறிப்புப் பெயராக அமைந்துள்ளது; ‘யெகோவா தேவன்’ என்பது இயல்பாகவும் கண்ணியமாகவும் உள்ளது.
- source_word: מִּזְבֵּחַ
  choice: பலிபீடம்
  rationale: பலியிடுவதற்கான கட்டமைப்பைக் குறிக்கும் எபிரெயச் சொல்லுக்கான தெளிவான, வழக்கிலுள்ள தமிழ் இணைச்சொல்.
- source_word: לְעֹלָה
  choice: தகனபலிக்கான
  rationale: முழுமையாக எரிக்கப்படும் பலிவகையைத் தெளிவாகக் குறிக்கிறது; எபிரெய ஒருமை இங்கு பொதுவகைப் பொருளில் இருக்கக்கூடும்.
- source_word: לְיִשְׂרָאֵל
  choice: இஸ்ரவேலுக்கான
  rationale: இஸ்ரவேலோடு தொடர்புடைய நோக்கம்/பயன்பாட்டைக் குறிக்கும் לְ முன்னிடைச்சொல்லைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை எவ்வாறு வழங்குவது
  choice: யெகோவா
  alternative: கர்த்தர்; யாவே
  rationale: மூலத்தில் தனிப்பட்ட இறைப்பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டமாக மாற்றாமல் பெயராகவே வழங்கப்பட்டுள்ளது; ‘யெகோவா’ தமிழ் வாசகர்களிடையே பரவலாக அறியப்படும் ஒலிபெயர்ப்பு.
- issue: בֵּית יְהוָה הָאֱלֹהִים என்பதில் ‘வீடு’ அல்லது ‘ஆலயம்’
  choice: யெகோவா தேவனுடைய வீடு
  alternative: யெகோவா தேவனுடைய ஆலயம்
  rationale: சூழல் ஆலயம் அமையவிருக்கும் இடத்தைக் குறித்தாலும், மூல எபிரெயம் ‘வீடு’ என்றே கூறுகிறது. அதைப் பாதுகாப்பது மூலத்தின் சொற்படிமத்தையும் இறையியல் தொடர்புகளையும் நிலைநிறுத்துகிறது.
- issue: עֹלָה என்ற ஒருமையின் எண்ணிக்கை
  choice: தகனபலி (பொதுவகை ஒருமை)
  alternative: தகனபலிகள்
  rationale: எபிரெய ஒருமை ஒரு பலிவகையைப் பொதுவாகக் குறிக்கலாம். தமிழ் ஒருமை அந்தத் தெளிவின்மையைப் பாதுகாக்கிறது; பன்மையும் பொருளில் சாத்தியம்.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான வேதாகம நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் வலியுறுத்தலை ‘இதுவே’ என்றும், ‘வீடு’ என்ற நேரடிப் படிமத்தையும் காத்து, தேவையற்ற விளக்க விரிவாக்கம் தவிர்க்கப்பட்டுள்ளது.
