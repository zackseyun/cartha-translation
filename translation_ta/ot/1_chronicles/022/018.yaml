  to: “உங்கள் கடவுளாகிய யாவே உங்களோடு இருக்கிறார் அல்லவா? அவர் உங்களுக்குச் சுற்றிலும் ஓய்வு அளித்திருக்கிறார் அல்லவா? ஏனெனில், அவர் நாட்டில் வாழ்பவர்களை என் கையில் ஒப்படைத்திருக்கிறார்; நாடு யாவேக்கு முன்பாகவும் அவருடைய மக்களுக்கு முன்பாகவும்[a] அடக்கப்பட்டிருக்கிறது.”
  rationale: ‘இந்நாடு/இந்த நாடு’ என்ற மூலத்தில் இல்லாத அண்மைச் சுட்டல் நீக்கப்பட்டது. நிறைவுற்ற செயல்களையும் அவற்றின் நிகழ்கால விளைவையும் ஒரே மாதிரியாக வெளிப்படுத்த வினை வடிவங்கள் திருத்தப்பட்டன. அடிக்குறிப்பு மாற்றப்படவில்லை; அது சுட்டுப்பெயரின் மாற்று தொடர்பைத் தகுந்தவாறு பாதுகாக்கிறது.
