  text: הֲ/לֹ֨א יְהוָ֤ה אֱלֹֽהֵי/כֶם֙ עִמָּ/כֶ֔ם וְ/הֵנִ֥יחַ לָ/כֶ֖ם מִ/סָּבִ֑יב כִּ֣י נָתַ֣ן בְּ/יָדִ֗/י אֵ֚ת יֹשְׁבֵ֣י הָ/אָ֔רֶץ וְ/נִכְבְּשָׁ֥ה הָ/אָ֛רֶץ לִ/פְנֵ֥י יְהוָ֖ה וְ/לִ/פְנֵ֥י עַמּֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/018.yaml
  text: Is not Yahweh your God with you? And has he not given you rest on every side? For he has given the inhabitants of the land into my hand[a], and the land has been subdued before Yahweh and before his people.
translation:
  language: ta
  text: “உங்கள் கடவுளாகிய யாவே உங்களோடு இருக்கிறார் அல்லவா? அவர் உங்களுக்குச் சுற்றிலும் ஓய்வு அளித்திருக்கிறார் அல்லவா? ஏனெனில், அவர் நாட்டில் வாழ்பவர்களை என் கையில் ஒப்படைத்திருக்கிறார்; நாடு யாவேக்கு முன்பாகவும் அவருடைய மக்களுக்கு முன்பாகவும்[a] அடக்கப்பட்டிருக்கிறது.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவருடைய” என்பது பெரும்பாலும் யாவேயைக் குறிக்கிறது; அதைத் தாவீதைக் குறிப்பதாகவும் புரிந்துகொள்ள வாய்ப்புண்டு. “அவருடைய மக்களின் பார்வையிலும்” என்றும் மொழிபெயர்க்கலாம்.
    reason: சுட்டுப்பெயரின் தொடர்பில் உள்ள தெளிவின்மையையும் לִפְנֵי என்பதன் மாற்று நுண்பொருளையும் பாதுகாக்கிறது.
lexical_decisions:
- source_word: הֲלֹא
  choice: அல்லவா?
  rationale: உறுதியான ஆம் என்ற பதிலை எதிர்பார்க்கும் எபிரெய வினாவை இயல்பான தமிழ் சொல்லாட்சியில் தக்கவைக்கிறது; தொடரிலுள்ள இரு வினைகளுக்கும் இதன் வினாப்பாங்கு பொருந்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைவனுடைய தனிப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אֱלֹהֵיכֶם עִמָּכֶם
  choice: உங்கள் கடவுளாகிய யாவே உங்களோடு இருக்கிறார்
  rationale: இஸ்ரவேலின் கடவுளைக் குறிக்கும் ஒருமைப் பொருளையும், உடனிருப்பு மற்றும் துணை என்ற עִם என்பதன் இயல்பான பொருளையும் வெளிப்படுத்துகிறது.
- source_word: וְהֵנִיחַ לָכֶם מִסָּבִיב
  choice: அவர் உங்களுக்குச் சுற்றிலும் ஓய்வு அளித்திருக்கிறார்
  rationale: சுற்றியுள்ள பகைவர்களிடமிருந்து கிடைத்த அமைதி மற்றும் விடுதலை என்ற הניח சொல்லின் சூழற்பொருளைத் தக்கவைக்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்திய வினாக்களில் கூறப்பட்டதற்கான காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: נָתַן בְּיָדִי
  choice: என் கையில் ஒப்படைத்தார்
  rationale: ஒருவரின் அதிகாரத்திற்குள் ஒப்புவித்தல் என்ற எபிரெய மரபுத்தொடரின் கை உருவகத்தைத் தமிழிலும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: இந்நாட்டில் குடியிருப்பவர்கள்
  rationale: நிலம் அல்லது நாட்டில் வசிப்பவர்களைக் குறிக்கும் பங்கேற்பு வடிவத்தை இயல்பான தமிழில் வழங்குகிறது; சூழலில் குறிப்பிட்ட நாட்டைக் குறிக்க ‘இந்நாடு’ பயன்படுத்தப்படுகிறது.
- source_word: וְנִכְבְּשָׁה הָאָרֶץ
  choice: இந்த நாடு ... அடக்கப்பட்டது
  rationale: כבש என்பதன் நிபால் வடிவிலுள்ள செயல்பாட்டு受நிலைப் பொருளான ‘கட்டுப்பாட்டுக்குள் கொண்டுவரப்பட்டது’ என்பதைச் சுருக்கமாகவும் நேரடியாகவும் தெரிவிக்கிறது.
- source_word: לִפְנֵי יְהוָה וְלִפְנֵי עַמּוֹ
  choice: யாவேக்கு முன்பாகவும் அவருடைய மக்களுக்கு முன்பாகவும்
  rationale: இருமுறை வரும் לִפְנֵי அமைப்பின் இணைநிலையைத் தக்கவைத்து, ‘யாவேயின் முன்னிலையிலும் அவருடைய மக்களின் முன்னிலையிலும்’ என்ற மூலத்தின் சொல்லாட்சியைப் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் பட்டமல்ல, இறைவனுடைய தனிப்பெயரே உள்ளது. ஆகவே அதை மாற்றீட்டுப் பட்டமாக்காமல் ஒலிபெயர்ப்பது மூலத்துக்கு நெருக்கமானது.
- issue: עַמּוֹ என்பதிலுள்ள ‘அவருடைய’ என்ற சுட்டுப்பெயரின் தொடர்பு
  choice: யாவேயைக் குறிக்கிறது
  alternative: தாவீதைக் குறிக்கலாம்
  rationale: உடனிருக்கும் முக்கிய முன்னிடுபெயர் யாவே என்பதும், ‘யாவேக்கு முன்பாகவும் அவருடைய மக்களுக்கு முன்பாகவும்’ என்ற இணைப்பு இயல்பாக இருப்பதும் இத்தேர்வை ஆதரிக்கின்றன. இருப்பினும் எபிரெய ஆண்பால் ஒருமைச் சுட்டுப்பெயர் தனியாக இந்தத் தொடர்பை முற்றிலும் தீர்மானிக்காததால் மாற்று வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளக்கூடிய கண்ணியமான நடை. எபிரெய மொழியின் இரட்டை வினாப்பாங்கு, ‘கையில்’ என்ற உருவகம், ‘முன்பாக’ என்ற இணை அமைப்பு ஆகியவை இயன்றவரை பாதுகாக்கப்பட்டுள்ளன.
