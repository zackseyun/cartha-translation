  source_fidelity: 'மொத்தத்தில் எபிரெய மூலத்துக்கு நெருக்கமாக உள்ளது: வினாப்பாங்கு, யாவே என்ற பெயர், ‘என் கையில்’ உருவகம், மற்றும் இருமுறை வரும் ‘முன்பாக’ இணை அமைப்பு ஆகியவை பாதுகாக்கப்பட்டுள்ளன. ஆனால் הָאָרֶץ என்பதன் திட்டவட்டமான ‘நாடு/நிலம்’ என்பதைச் சுட்டும் வகையில் ‘இந்நாடு’ என மாற்றுவது மூலத்தில் இல்லாத அண்மைச் சுட்டலைச் சேர்க்கிறது. மேலும் இரண்டு நிறைவுற்ற வினை வடிவங்களின் தற்போதைய விளைவைக் காட்டும் தமிழ் நிறைவுநிலை வடிவம் இங்கே சிறந்தது.'
  naturalness: நடை நவீன நிலையான தமிழிலும் கண்ணியமான வேதாகம நடையிலும் உள்ளது. ‘நாட்டில் குடியிருப்பவர்கள்’ புரிந்துகொள்ளத்தக்கது; ‘நாட்டில் வாழ்பவர்கள்’ இன்னும் இயல்பானது. ‘ஒப்படைத்திருக்கிறார்’ மற்றும் ‘அடக்கப்பட்டிருக்கிறது’ என்பவை முன்சொல்லப்பட்ட ‘அளித்திருக்கிறார்’ உடன் காலநிலையிலும் நன்றாக ஒத்திசைகின்றன.
