  text: וְ/הִנֵּ֨ה בְ/עָנְיִ֜/י הֲכִינ֣וֹתִי לְ/בֵית יְהוָ֗ה זָהָ֞ב כִּכָּרִ֤ים מֵֽאָה אֶ֨לֶף֙ וְ/כֶ֗סֶף אֶ֤לֶף אֲלָפִים֙ כִּכָּרִ֔ים וְ/לַ/נְּחֹ֤שֶׁת וְ/לַ/בַּרְזֶל֙ אֵ֣ין מִשְׁקָ֔ל כִּ֥י לָ/רֹ֖ב הָיָ֑ה וְ/עֵצִ֤ים וַ/אֲבָנִים֙ הֲכִינ֔וֹתִי וַ/עֲלֵי/הֶ֖ם תּוֹסִֽיף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/014.yaml
  text: Behold[a], in my affliction I have prepared for the house of Yahweh one hundred thousand talents of gold, and one million talents of silver; and for the bronze and the iron there is no weighing, for it was in abundance. I have prepared timber and stones[c][b], and you may add to them.
translation:
  language: ta
  text: இதோ, என் துன்ப நிலையில்[a], யாவேவின் ஆலயத்திற்காகத் தங்கம் ஒரு இலட்சம் தாலந்துகளும், வெள்ளி பத்து இலட்சம் தாலந்துகளும்[b] ஆயத்தம் செய்திருக்கிறேன். வெண்கலத்திற்கும் இரும்பிற்கும் எடை கணக்கே இல்லை; ஏனெனில் அவை ஏராளமாக இருந்தன. மரப்பொருட்களையும் கற்களையும் ஆயத்தம் செய்திருக்கிறேன்; நீ அவற்றோடு இன்னும் சேர்க்கலாம்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘என் வறுமையில்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் துன்பம், கடினநிலை, அல்லது வறுமையைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், ‘ஆயிரம் ஆயிரங்கள்.’
    reason: lexical_alternative
  - marker: c
    text: ‘நீ அவற்றோடு இன்னும் சேர்க்க வேண்டும்’ அல்லது ‘அவற்றோடு இன்னும் சேர்த்துக்கொள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: הִנֵּה கவனத்தை ஈர்க்கும் சொல். வெளிப்படையான காலக் குறிப்பு இல்லாததால் ‘இப்போது’ சேர்க்கப்படவில்லை.
- source_word: בְעָנְיִי
  choice: என் துன்ப நிலையில்
  rationale: עֳנִי என்பது துன்பம், நெருக்கடி அல்லது வறுமையைக் குறிக்கலாம். இங்கு தாவீது எதிர்கொண்ட கடின நிலையைக் காட்டும் வகையில் இயல்பான தமிழில் மொழிபெயர்க்கப்பட்டது; ‘வறுமையில்’ என்ற சாத்தியம் அடிக்குறிப்பில் வைக்கப்பட்டது.
- source_word: הֲכִינוֹתִי
  choice: ஆயத்தம் செய்திருக்கிறேன்
  rationale: כון என்பதன் ஹிபீல் வடிவம் ‘ஆயத்தப்படுத்துதல்’ என்று பொருள்படும். முடிந்த செயல் தற்போதைய பயன்பாட்டுடன் தொடர்புடையதைக் காட்டும் இயல்பான தமிழ் வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- source_word: לְבֵית יְהוָה
  choice: யாவேவின் ஆலயத்திற்காக
  rationale: בַּיִת என்பதன் நேர்பொருள் ‘வீடு’ என்றாலும், இச்சூழலில் கட்டப்படவிருக்கும் திருக்கோயிலைக் குறிக்கிறது. நவீன வாசகருக்குத் தெளிவாக ‘ஆலயம்’ பயன்படுத்தப்பட்டது.
- source_word: כִּכָּרִים
  choice: தாலந்து
  rationale: כִּכָּר என்பது பெரிய எடை அலகு. வேதாகமப் பயன்பாட்டில் நிலைபெற்ற ‘தாலந்து’ என்ற ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டது.
- source_word: מֵאָה אֶלֶף
  choice: ஒரு இலட்சம்
  rationale: 100,000 என்ற எண்ணை நவீனத் தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: אֶלֶף אֲלָפִים
  choice: பத்து இலட்சம்
  rationale: ‘ஆயிரம் ஆயிரங்கள்’ என்பதன் எண்ணளவு 1,000,000. தமிழில் தெளிவாக ‘பத்து இலட்சம்’ எனக் கொடுக்கப்பட்டு, மூலத்தின் சொற்கட்டமைப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- source_word: וְלַנְּחֹשֶׁת וְלַבַּרְזֶל אֵין מִשְׁקָל
  choice: வெண்கலத்திற்கும் இரும்பிற்கும் எடைக்கணக்கே இல்லை
  rationale: மூலத்தில் ‘எடை இல்லை’ என்று இருப்பது அவை எடையற்றவை என்பதல்ல; மிகுதியால் எடை கணக்கிடப்படவில்லை அல்லது கணக்கிட இயலவில்லை என்பதைக் குறிக்கிறது. ‘எடைக்கணக்கே இல்லை’ இந்தப் பொருளை இயல்பாகப் பாதுகாக்கிறது.
- source_word: כִּי לָרֹב הָיָה
  choice: ஏனெனில் அவை ஏராளமாக இருந்தன
  rationale: எடைக்கணக்கு இல்லாததற்கான காரணமாக உலோகங்களின் மிகுதியைத் தெளிவாக்குகிறது. எபிரெய ஒற்றை வடிவம் கூட்டுப்பொருளைக் கொண்டிருப்பதால் தமிழில் பன்மை இயல்பாக உள்ளது.
- source_word: וְעֵצִים וַאֲבָנִים
  choice: மரங்களையும் கற்களையும்
  rationale: עֵצִים கட்டுமானச் சூழலில் மரப்பொருட்களைக் குறிக்கிறது; ‘மரங்கள்’ என்பது எளிய, இயல்பான தமிழ். கற்களுடன் இணைந்து கட்டுமானப் பொருட்கள் என்பது சூழலால் தெளிவாகிறது.
- source_word: וַעֲלֵיהֶם תּוֹסִיף
  choice: நீ அவற்றோடு இன்னும் சேர்க்கலாம்
  rationale: יסף என்பதன் ஹிபீல் நிறைவுறா வடிவம் இங்கு அனுமதியையோ மென்மையான கட்டளையையோ குறிக்கலாம். ‘சேர்க்கலாம்’ அனுமதிப் பொருளை முதன்மையாகக் காட்டுகிறது; கட்டளைப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
theological_decisions:
- issue: יְהוָה என்ற இறைபெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் நான்கு எழுத்துகளைக் கொண்ட உடன்படிக்கைப் பெயர் நேரடியாக வருகிறது. பொதுப்பட்டப் பெயராக மாற்றாமல், இறைபெயரை ‘யாவே’ என ஒலிபெயர்ப்பது மூல வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: בְעָנְיִי என்பதன் பொருள்
  choice: என் துன்ப நிலையில்
  alternative: என் வறுமையில்
  rationale: இச்சொல் துன்பம், கடினநிலை, வறுமை ஆகிய பொருட்களை ஏற்கும். சூழலின் பதற்றத்தை ‘துன்ப நிலை’ நன்றாகக் காட்டினாலும், தாவீதின் தாழ்மையையோ ஒப்பீட்டு வறுமையையோ குறிக்கும் வாசிப்பைத் தீர்மானமாக நிராகரிக்காமல் அடிக்குறிப்பில் வைத்துள்ளது.
- issue: תּוֹסִיף என்பதன் வினை வலிமை
  choice: சேர்க்கலாம்
  alternative: சேர்க்க வேண்டும் / சேர்த்துக்கொள்
  rationale: இது அனுமதிக்கும் எதிர்காலமாகவும் மென்மையான கட்டளையாகவும் புரிந்துகொள்ளப்படலாம். முதன்மை உரை அனுமதிப் பொருளைக் கொடுக்கிறது; வலுவான கட்டளை வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. எண் அளவுகள் தமிழ் வழக்கில் ‘இலட்சம்’ எனத் தரப்பட்டுள்ளன. மூலத்தில் இல்லாத ‘இப்போது’ சேர்க்கப்படவில்லை. இறைபெயர் பட்டப்பெயராக மாற்றப்படாமல் ‘யாவே’ எனப் பாதுகாக்கப்பட்டது.
