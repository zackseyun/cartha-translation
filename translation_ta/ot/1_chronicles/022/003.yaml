base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/003.yaml
  text: And David prepared iron in abundance for the nails for the doors of the gates and for the fastenings[b][a], and bronze in abundance without weight.
translation:
  language: ta
  text: வாசல்களின் கதவுகளுக்கான ஆணிகளுக்கும் இணைப்புப் பொருட்களுக்கும்[a] தேவையான இரும்பை மிகுதியாகத் தாவீது ஆயத்தப்படுத்தினார்; வெண்கலத்தையும் எடைபோட முடியாத அளவுக்கு[b] மிகுதியாக ஆயத்தப்படுத்தினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கீல்களுக்கும்”; எபிரெயச் சொல் இணைக்கும் அல்லது சேர்க்கும் பொருட்களைப் பொதுவாகக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “எடை இல்லாமல்”; அதாவது, எடைபோட முடியாத அளவுக்கு மிகுதியாக.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַרְזֶל
  choice: இரும்பு
  rationale: கட்டுமானப் பொருட்களின் பட்டியலில் இச்சொல் இரும்பை நேரடியாகக் குறிக்கிறது.
- source_word: לָרֹב
  choice: மிகுதியாக
  rationale: பொருள் பெருமளவில் சேகரிக்கப்பட்டது என்ற கருத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: מִּסְמְרִים
  choice: ஆணிகள்
  rationale: கதவுகளின் கட்டுமானச் சூழலில் பொதுவாக இணைக்கப் பயன்படும் இரும்பு ஆணிகளைக் குறிக்கும் இயல்பான சொல்.
- source_word: דַלְתוֹת הַשְּׁעָרִים
  choice: வாசல்களின் கதவுகள்
  rationale: வாசல் அமைப்புகளுக்குச் சேர்ந்த கதவுப் பலகைகள் என்ற எபிரெயக் கட்டமைப்பைப் பொருள் தெளிவுடன் காக்கிறது.
- source_word: מְחַבְּרוֹת
  choice: இணைப்புப் பொருட்கள்
  rationale: இணைக்கும் அல்லது சேர்க்கும் உலோகப் பகுதிகள் என்ற பரந்த பொருளைக் காக்கிறது; ‘கீல்கள்’ என்று மிகக் குறிப்பாக்கவில்லை.
- source_word: הֵכִין
  choice: ஆயத்தப்படுத்தினார்
  rationale: கோவில் கட்டுமானத்துக்காகப் பொருட்களை முன்கூட்டியே திரட்டி வைத்த செயலைச் சரியாகக் காட்டுகிறது.
- source_word: נְחֹשֶׁת
  choice: செம்பு
  rationale: נְחֹשֶׁת என்பது செம்பையோ செம்புக் கலவையையோ குறிக்கக்கூடும்; நவீன பொதுத் தமிழில் ‘செம்பு’ இயல்பாகவும் மூலத்தின் உலோக வகை குறித்த பரப்பை ஓரளவு காக்கும் விதமாகவும் உள்ளது.
- source_word: אֵין מִשְׁקָל
  choice: எடைபோட முடியாத அளவுக்கு
  rationale: சொல்லுக்குச் சொல் ‘எடை இல்லை’ என்ற எபிரெய மரபுத்தொடரின் கருத்தான, எடைபோட இயலாத பெருமளவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
