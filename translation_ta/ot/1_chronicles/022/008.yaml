source:
  edition: WLC
  text: וַ/יְהִ֨י עָלַ֤/י דְּבַר יְהוָה֙ לֵ/אמֹ֔ר דָּ֤ם לָ/רֹב֙ שָׁפַ֔כְתָּ וּ/מִלְחָמ֥וֹת גְּדֹל֖וֹת עָשִׂ֑יתָ לֹֽא תִבְנֶ֥ה בַ֨יִת֙ לִ/שְׁמִ֔/י כִּ֚י דָּמִ֣ים רַבִּ֔ים שָׁפַ֥כְתָּ אַ֖רְצָ/ה לְ/פָנָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/008.yaml
  text: But the word of Yahweh came to me[a], saying, ‘You have shed much blood and fought great wars. You shall not build a house for my name[d][c][b], because you have shed much blood on the earth before me.’
translation:
  language: ta
  text: 'ஆனால் யாவேவின் வார்த்தை எனக்கு வந்தது: “நீ மிகுந்த இரத்தத்தைச் சிந்தியிருக்கிறாய்[a]; பெரும் போர்களை நடத்தியிருக்கிறாய்[b]. என் பெயருக்காக ஒரு வீட்டை[c] நீ கட்டக் கூடாது. ஏனெனில் என் முன்னிலையில் பூமியின்மேல்[d] மிகுந்த இரத்தத்தைச் சிந்தியிருக்கிறாய்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஏராளமான இரத்தத்தைச் சிந்தியிருக்கிறாய்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “பெரும் போர்களைப் புரிந்திருக்கிறாய்.”
    reason: lexical_alternative
  - marker: c
    text: இது ஆலயத்தைக் குறிக்கிறது; எபிரேயத்தில், “என் பெயருக்காக ஒரு வீடு.”
    reason: cultural_note
  - marker: d
    text: அல்லது, “தரையின்மேல்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּבַר יְהוָה
  choice: யாவேவின் வார்த்தை
  rationale: தீர்க்கதரிசனச் சொல்லாடலின் வடிவத்தையும் יְהוָה என்ற உடன்படிக்கைப் பெயரையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: וַיְהִי עָלַי
  choice: எனக்கு வந்தது
  rationale: ‘என்மேல் இருந்தது’ என்ற எபிரேய மரபுத்தொடரின் பொருளை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: דָּם לָרֹב / דָּמִים רַבִּים
  choice: மிகுந்த இரத்தம்
  rationale: பெருமளவிலான இரத்தச் சிந்துதலைக் குறிக்கும் உறுதியான இரத்தப் படிமத்தை இரு இடங்களிலும் தக்கவைக்கிறது.
- source_word: שָׁפַכְתָּ
  choice: சிந்தியிருக்கிறாய்
  rationale: இரத்தத்தோடு வரும் எபிரேய மரபுத்தொடரைத் தமிழிலும் இயல்பாகக் கொடுத்து, தாவீதின் முந்தைய செயல்களைச் சுட்டுகிறது.
- source_word: וּמִלְחָמוֹת גְּדֹלוֹת עָשִׂיתָ
  choice: பெரும் போர்களை நடத்தியிருக்கிறாய்
  rationale: சொல்லுக்குச் சொல் ‘பெரும் போர்களைச் செய்தாய்’ என்பதைவிட இயல்பாக இருந்து, செயற்பாட்டுள்ள இராணுவப் பொருளைப் பாதுகாக்கிறது.
- source_word: לֹא תִבְנֶה בַיִת לִשְׁמִי
  choice: என் பெயருக்காக ஒரு வீட்டை நீ கட்டக் கூடாது
  rationale: ‘வீடு’ மற்றும் ‘என் பெயருக்காக’ என்ற எபிரேய ஆலய-உடன்படிக்கைச் சொல்லாடலை விளக்கவுரையாக மாற்றாமல் தக்கவைக்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: தாவீது அந்த வீட்டைக் கட்டக் கூடாததற்கான காரணத்தைத் தெளிவாக அறிமுகப்படுத்துகிறது.
- source_word: אַרְצָה
  choice: பூமியின்மேல்
  rationale: திசைநோக்கு வடிவம் ‘தரையை நோக்கி’ என்றும் புரியக்கூடியதாயினும், இரத்தம் சிந்துதல் என்ற சூழலில் இது இயல்பான தமிழ் வாசிப்பாகும்.
- source_word: לְפָנַי
  choice: என் முன்னிலையில்
  rationale: இரத்தச் சிந்துதல் கடவுளின் பார்வைக்கும் சந்நிதிக்கும் முன்பாக நடந்தது என்ற இறையியல் வலிமையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைபெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் உள்ள நான்கு எழுத்து உடன்படிக்கைப் பெயரை ஒரு பட்டப்பெயராக மாற்றாமல், பரவலாக ஏற்றுக்கொள்ளப்பட்ட ஒலிப்புமுறையில் தருகிறது.
- issue: בַיִת என்பதை ‘வீடு’ என்றா ‘ஆலயம்’ என்றா தருவது
  choice: வீடு
  alternative: ஆலயம்
  rationale: இங்கு ஆலயமே குறிக்கப்பட்டாலும், மூலத்தின் ‘வீடு’ என்ற உருவகத்தையும் வேதாகமம் முழுவதும் காணப்படும் ஆலய-வீடு தொடர்பையும் முதன்மை உரையில் தக்கவைக்கிறது.
- issue: דָּמִים என்ற பன்மையின் நுண்பொருள்
  choice: மிகுந்த இரத்தம்
  alternative: மிகுந்த இரத்தப்பழி; பெரும் இரத்தச் சிந்துதல்
  rationale: இச்சூழலில் இரத்தச் சிந்துதலும் இரத்தப்பழியும் நெருக்கமாக இருந்தாலும், முதன்மை உரை concrete ஆன ‘இரத்தம்’ என்ற சொல்லைப் பாதுகாத்து தெளிவற்ற இறையியல் பதற்றத்தைத் தீர்மானிக்காமல் விடுகிறது.
translation_notes:
  register: நவீனத் தரத்தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் வகையிலும் வேதாகம உரைக்குரிய கண்ணியத்துடனும் அமைக்கப்பட்டுள்ளது. நேரடியான இறை உரை தெளிவாகப் பிரிக்கப்பட்டுள்ளது; எபிரேயத்தின் மீளுரையும் ‘என் பெயருக்காக ஒரு வீடு’ என்ற மரபுத்தொடரும் பாதுகாக்கப்பட்டுள்ளன.
