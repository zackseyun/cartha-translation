translation_notes:
  register: நவீனத் தரநிலைத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம வரலாற்றுரைக்கு ஏற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. வசனம் முந்தைய பட்டியலின் தொடர்ச்சியாக இருப்பதால், தமிழில் முழுமையான வாக்கியமாக அமையச் சூழலிலிருந்து ‘சேகரித்தான்’ இணைக்கப்பட்டுள்ளது; இது எபிரெய உரையில் இவ்வசனத்தில் வெளிப்படையாக மீண்டும் வராத தொடர்ச்சிக் கருத்தாகும்.
