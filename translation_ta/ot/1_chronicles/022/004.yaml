base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/004.yaml
  text: and cedar timbers without number[a], for the Sidonians and Tyrians had brought cedar timbers in abundance to David.
translation:
  language: ta
  text: மேலும், எண்ணிக்கையில்லாத கேதுரு மரக்கட்டைகளும்[a]; ஏனெனில் சீதோனியரும் தீரியரும் தாவீதிடம் ஏராளமான கேதுரு மரக்கட்டைகளைக் கொண்டுவந்திருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கேதுரு மரப்பொருள்.’ ஆலயக் கட்டுமானச் சூழலில் இது கட்டுமானத்திற்கான மரக்கட்டைகளைக் குறிப்பதாக இருக்கலாம்; எனினும் எபிரெயச் சொல் கேதுரு மரப்பொருளை விரிவாகவும் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַ/עֲצֵי אֲרָזִים
  choice: கேதுரு மரக்கட்டைகளையும்
  rationale: עֲצֵי אֲרָזִים என்பது கேதுரு மரம் அல்லது மரப்பொருளைக் குறிக்கலாம். ஆலயக் கட்டுமானப் பொருட்களின் சூழலில், நிற்கும் மரங்களைவிட கட்டுமானத்திற்கான மரக்கட்டைகள் என்பதே இயல்பான பொருள்.
- source_word: לְ/אֵין מִסְפָּר
  choice: எண்ணிக்கையில்லாத
  rationale: எண்ண முடியாத அளவிலான பெருந்தொகையை உணர்த்தும் எபிரெய மரபுத்தொடரின் வலிமையைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தை அறிமுகப்படுத்தும் இணைப்புச் சொல்லாக இங்கு செயல்படுகிறது.
- source_word: הֵבִיאוּ
  choice: கொண்டுவந்திருந்தார்கள்
  rationale: இது பன்மை எழுவாயுடன் வரும் ‘கொண்டுவந்தார்கள்’ என்ற பொருள். தாவீது பொருட்களைச் சேகரித்ததற்கு முன்பே நிகழ்ந்த காரணச் செயலைத் தமிழில் தெளிவாகக் காட்ட இறந்தகால முன்னிலை வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: הַ/צִּידֹנִים
  choice: சீதோனியர்
  rationale: சீதோன் நகர மக்களைக் குறிக்கும் இனப்பெயரின் வழக்கமான தமிழ் வடிவம்.
- source_word: וְ/הַ/צֹּרִים
  choice: தீரியரும்
  rationale: தீர் நகர மக்களைக் குறிக்கும் இனப்பெயரை சீதோனியர் என்பதுடன் இணையான அமைப்பில் வழங்குகிறது.
- source_word: לָ/רֹב
  choice: ஏராளமான
  rationale: பெரும் அளவு அல்லது மிகுதியை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: לְ/דָוִד
  choice: தாவீதிடம்
  rationale: לְ இங்கு பெற்றுக்கொள்பவரைக் குறிக்கிறது; பொருட்கள் தாவீதிடம் கொண்டுவரப்பட்டன என்பதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
