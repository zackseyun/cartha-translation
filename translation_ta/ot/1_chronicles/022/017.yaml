translation:
  language: ta
  text: பின்பு தாவீது தன் மகன் சாலொமோனுக்கு உதவும்படி இஸ்ரவேலின் தலைவர்கள் அனைவருக்கும் கட்டளையிட்டான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו
  choice: பின்பு ... கட்டளையிட்டான்
  rationale: צוה என்பதன் wayyiqtol வடிவம் கதைநிகழ்வை அடுத்த கட்டத்திற்கு நகர்த்துவதோடு அதிகாரபூர்வமான ஆணையையும் குறிக்கிறது. எனவே தொடர்ச்சியைப் காட்ட ‘பின்பு’ என்றும், வலிமையைப் பேண ‘கட்டளையிட்டான்’ என்றும் மொழிபெயர்க்கப்பட்டது.
- source_word: שָׂרֵי
  choice: தலைவர்கள்
  rationale: שָׂרִים என்பது ஆட்சி அல்லது நிர்வாகப் பொறுப்புடைய தலைவர்களைக் குறிக்கிறது. ‘தலைவர்கள்’ என்பது பதவியை அளவுக்கு மீறிக் குறிப்பாக்காமல், நவீனத் தமிழில் தெளிவாக உள்ளது.
- source_word: לְכָל שָׂרֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் தலைவர்கள் அனைவருக்கும்
  rationale: தேசியத் தலைமை முழுவதையும் உள்ளடக்கும் பொருளையும், ‘இஸ்ரவேலின்’ என்ற உடைமைத் தொடர்பையும் இயல்பான தமிழில் பேணுகிறது.
- source_word: לַעְזֹר
  choice: உதவும்படி
  rationale: עזר என்பதன் பெயரெச்ச வினை வடிவம் ‘உதவுதல்’ என்று நேரடியாகப் பொருள்படும். கட்டளையின் நோக்கத்தைத் தமிழில் இயல்பாக வெளிப்படுத்த ‘உதவும்படி’ பயன்படுத்தப்பட்டது.
- source_word: לִשְׁלֹמֹה בְנוֹ
  choice: தன் மகன் சாலொமோனுக்கு
  rationale: ‘அவனுடைய மகன்’ என்ற உறவைத் தெளிவாகப் பேணுகிறது. தமிழின் இயல்பான சொல்வரிசைக்காக உறவுமுறைப் பதம் பெயருக்கு முன் வைக்கப்பட்டு, எழுவாயான தாவீதையே சுட்ட ‘தன்’ பயன்படுத்தப்பட்டது.
