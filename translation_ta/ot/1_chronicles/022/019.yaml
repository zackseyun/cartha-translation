base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/019.yaml
  text: Now set your heart and your soul to seek Yahweh your God[a]. Rise up and build the sanctuary of Yahweh God[b], to bring the ark of the covenant of Yahweh and the holy vessels of God into the house that is to be built for the name of Yahweh.
translation:
  language: ta
  text: இப்போது உங்கள் கடவுளாகிய யாவேவைத் தேடுவதற்கு உங்கள் இதயத்தையும் உங்கள் ஆத்துமாவையும் அர்ப்பணியுங்கள்.[a] எழுந்து, யாவேவாகிய கடவுளின் பரிசுத்தஸ்தலத்தைக் கட்டுங்கள்; யாவேவின் உடன்படிக்கைப் பெட்டியையும் கடவுளின் பரிசுத்தப் பொருள்களையும் யாவேவின் பெயருக்காகக் கட்டப்படவிருக்கும் ஆலயத்திற்குள் கொண்டுவரும்படியாகக் கட்டுங்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் நேரடியாக மொழிபெயர்த்தால், “யாவேவைத் தேடுவதற்கு உங்கள் இதயத்தையும் உங்கள் ஆத்துமாவையும் கொடுங்கள்.”
    reason: lexical_alternative
  - marker: b
    text: இங்கே “ஆலயம்” என்பது யாவேவின் பெயருக்காகக் கட்டப்படவிருந்த கோவில் கட்டிடத்தைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: תְּנוּ לְבַבְכֶם וְנַפְשְׁכֶם
  choice: உங்கள் இதயத்தையும் உங்கள் ஆத்துமாவையும் அர்ப்பணியுங்கள்
  rationale: நேரடியாக ‘உங்கள் இதயத்தையும் ஆத்துமாவையும் கொடுங்கள்’ எனும் எபிரெயச் சொற்றொடரை, முழுமையான உள்ளார்ந்த தீர்மானத்தைக் குறிக்கும் இயல்பான தமிழில் தருகிறது; இரு சொற்களையும் தனித்தனியாகப் பாதுகாக்கிறது.
- source_word: לִדְרוֹשׁ
  choice: தேடுவதற்கு
  rationale: கடவுளை நாடுதல், அவரிடம் சார்ந்து அவரைத் தேடுதல் என்ற சூழல்சார் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்திலுள்ள உடன்படிக்கைப் பெயரை பொதுப்பட்டமாக மாற்றாமல் ஒலிபெயர்க்கிறது.
- source_word: וְקוּמוּ וּבְנוּ
  choice: எழுந்து ... கட்டுங்கள்
  rationale: தொடர்ச்சியான இரு கட்டளைகளின் அவசரத்தையும் உயர்ந்த நடையையும் இயல்பான தமிழில் காக்கிறது.
- source_word: מִקְדַּשׁ
  choice: பரிசுத்த இடம்
  rationale: மִקְדַּשׁ என்பதன் ‘புனிதமாக்கப்பட்ட இடம்/சரணாலயம்’ என்ற பொருளைக் காக்கிறது; பின்னர் வரும் ‘ஆலயம்’ என்பதுடன் தேவையற்ற சொல் மீளலைத் தவிர்க்கிறது.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: யாவேவின் உடன்படிக்கைப் பெட்டி
  rationale: எபிரெய உருபுத் தொடரைத் தெளிவான, வழக்கமான தமிழ் வேதாகமச் சொல்லாட்சியில் வழங்குகிறது.
- source_word: כְלֵי קֹדֶשׁ הָאֱלֹהִים
  choice: கடவுளின் பரிசுத்தப் பொருள்கள்
  rationale: כְּלִי என்பதன் பரந்த ‘பாத்திரங்கள்/கருவிகள்/பொருள்கள்’ என்ற வரம்பை ஒரே வகையாகக் குறுக்காமல் பாதுகாக்கிறது.
- source_word: לַבַּיִת הַנִּבְנֶה לְשֵׁם יְהוָה
  choice: யாவேவின் பெயருக்காகக் கட்டப்படவிருக்கும் ஆலயத்திற்குள்
  rationale: בַּיִת இங்கு சாதாரண வீடல்ல, கட்டப்படவிருக்கும் ஆலயக் கட்டிடம் என்பதைச் சூழலுக்கேற்ற தமிழில் தெளிவாக்குகிறது; ‘பெயருக்காக’ என்ற மூல உருவகத்தையும் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயர்
  choice: யாவே
  alternative: கர்த்தர் / ஆண்டவர்
  rationale: மூலத்தில் வரும் தனிப்பட்ட உடன்படிக்கைப் பெயரைப் பொதுப் பட்டத்தால் மாற்றாமல் பாதுகாக்கிறது.
- issue: ‘இதயம் மற்றும் ஆத்துமா’ என்ற மனித உள்ளமைச் சொல் இணை
  choice: இரு சொற்களையும் வெளிப்படையாக வைத்தல்
  alternative: முழு உள்ளத்தோடு
  rationale: முழுமையான அர்ப்பணிப்பை வலியுறுத்தும் எபிரெய இணையைப் பாதுகாக்கிறது; அதே நேரத்தில் ஒரு குறிப்பிட்ட தொழில்நுட்ப மனிதவியல் கோட்பாட்டைத் திணிக்கவில்லை.
- issue: ‘யாவேவின் பெயருக்காக’ ஆலயம் கட்டப்படுதல்
  choice: பெயருக்காக என்ற உருவகத்தைத் தக்கவைத்தல்
  alternative: யாவேவுக்காக
  rationale: கடவுளின் பெயர், பிரசன்னம், அதிகாரம் ஆகியவற்றுக்கிடையிலான வேதாகமத் தொடர்பை விளக்கி முடிக்காமல் மூலத்தின் இறையியல் செறிவைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன செந்தமிழுக்கு அணுக்கமான, dignified வழிபாட்டு நடையைக் கொண்ட மொழிபெயர்ப்பு. ‘ஆத்துமா’, ‘உடன்படிக்கைப் பெட்டி’, ‘பரிசுத்தம்’, ‘ஆலயம்’ ஆகியவை பொதுவாகப் புரியக்கூடிய வேதாகமச் சொற்களாகப் பயன்படுத்தப்பட்டுள்ளன. நீண்ட எபிரெய வாக்கியம் தமிழில் தெளிவுக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டது; இறுதி நோக்கவாக்கியம் தெளிவாக இணைக்கப்பட்டது.
