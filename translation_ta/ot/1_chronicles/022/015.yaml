source:
  edition: WLC
  text: וְ/עִמְּ/ךָ֤ לָ/רֹב֙ עֹשֵׂ֣י מְלָאכָ֔ה חֹצְבִ֕ים וְ/חָרָשֵׁ֥י אֶ֖בֶן וָ/עֵ֑ץ וְ/כָל חָכָ֖ם בְּ/כָל מְלָאכָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/015.yaml
  text: 'And with you in abundance are workers for the task: stonecutters[a], and craftsmen of stone and wood, and every skilled man for every kind of work.'
translation:
  language: ta
  text: 'மேலும், வேலை செய்வோர் உன்னிடம் ஏராளமாக இருக்கிறார்கள்: கல் வெட்டுபவர்கள், கல்லிலும் மரத்திலும் கைவினைஞர்கள், எல்லா வகையான வேலையிலும் திறமைமிக்க ஒவ்வொருவரும்[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில் இது இலக்கணப்படி ஆண்பால் ஒருமையில், சொல்லுக்குச் சொல் ‘திறமைமிக்க ஒவ்வொருவன்’ என்று உள்ளது; இங்கு அது திறமையான பணியாளர்களைப் பொதுவாகக் குறிக்கிறது.
    reason: மூலமொழியின் இலக்கணப் பாலினத்தையும் அதன் பிரதிநிதித்துவப் பயன்பாட்டையும் வெளிப்படுத்துதல்.
lexical_decisions:
- source_word: וְעִמְּךָ
  choice: மேலும் … உன்னிடம் … இருக்கிறார்கள்
  rationale: எபிரெயச் சொற்றொடரின் இணைப்பையும் சாலொமோனை நோக்கிய நேரடி உரையையும் இயல்பான தமிழ் இருப்புவாக்கியமாகத் தருகிறது.
- source_word: לָרֹב
  choice: ஏராளமாக
  rationale: வேலை செய்வோர் மிகுந்த எண்ணிக்கையில் இருப்பதைக் குறிக்கும் அளவுப்பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עֹשֵׂי מְלָאכָה
  choice: வேலை செய்வோர்
  rationale: குறிப்பிட்ட கட்டுமானப் பணியில் ஈடுபடுகிறவர்களைக் குறிக்கும் எபிரெயப் பங்கேற்புவினைத் தொடரை நேரடியாகவும் தெளிவாகவும் தருகிறது.
- source_word: חֹצְבִים
  choice: கல் வெட்டுகிறவர்கள்
  rationale: கட்டுமானச் சூழலில் சொல்லில் மறைந்துள்ள ‘கல்’ என்னும் செயப்படுபொருளைத் தெளிவுபடுத்துகிறது.
- source_word: וְחָרָשֵׁי אֶבֶן וָעֵץ
  choice: கல் மற்றும் மரக் கைவினைஞர்கள்
  rationale: חָרָשׁ என்பதிலுள்ள தொழில்திறன் சார்ந்த பொருளையும், கல் மற்றும் மரம் ஆகிய இரு பணிப்பொருட்களையும் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: וְכָל חָכָם בְּכָל מְלָאכָה
  choice: எல்லா வகையான வேலையிலும் திறமைவாய்ந்த ஒவ்வொருவரும்
  rationale: חָכָם இங்கு கோட்பாட்டு ஞானத்தை அல்ல, நடைமுறைத் தொழில்திறனைச் சுட்டுகிறது; בְּכָל மְלָאכָה பலவகைப் பணிகளிலுள்ள திறமையைச் சுட்டுகிறது.
theological_decisions:
- issue: וְכָל חָכָם என்பதிலுள்ள இலக்கணப் பாலினமும் பிரதிநிதித்துவப் பயன்பாடும்
  choice: திறமைவாய்ந்த ஒவ்வொருவரும்
  alternative: திறமைவாய்ந்த ஒவ்வொரு ஆணும்
  rationale: எபிரெய வடிவம் ஆண்பால் ஒருமையாக இருந்தாலும் ‘ஆண்’ என்பதற்கான தனிப் பெயர்ச்சொல் இங்கு இல்லை; தொழிலாளர்களை வகையாகக் குறிக்கும் பிரதிநிதித்துவப் பயன்பாட்டை இயல்பான தமிழில் ‘ஒவ்வொருவரும்’ எனத் தந்து, மூலத்தின் இலக்கண வடிவத்தை அடிக்குறிப்பில் பதிவு செய்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதில் புரியும், அதேவேளை மரியாதையும் வேதாகம உரைக்கேற்ற செறிவும் கொண்ட நடை. தொழில்சார் சொற்களுக்கு வழக்கிலுள்ள ‘கைவினைஞர்கள்’, ‘கல் வெட்டுகிறவர்கள்’ பயன்படுத்தப்பட்டுள்ளன; தேவையற்ற பழமையான சொற்கள் தவிர்க்கப்பட்டுள்ளன.
