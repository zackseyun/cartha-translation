base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/016.yaml
  text: For the gold[a], the silver, the bronze, and the iron, there is no number. Rise up and work[c][b], and may Yahweh be with you.
translation:
  language: ta
  text: தங்கம், வெள்ளி, வெண்கலம்[c], இரும்பு ஆகியவற்றுக்கு கணக்கே இல்லை.[a] எழுந்து வேலையைச் செய்; யாவே உன்னோடு இருப்பாராக.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எண்ணி முடியாது”; “எண்ணிக்கைக்கு அப்பாற்பட்டவை.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “யாவே உன்னோடு இருப்பார்” அல்லது “யாவே உன்னோடு இருக்கட்டும்.” எபிரெய வினைவடிவம் வாழ்த்து அல்லது ஆசீர்வாதத்தைக் குறிக்கக்கூடும்.
    reason: alternative_reading
  - marker: c
    text: எபிரெயச் சொல்லைச் சில சூழல்களில் “செம்பு” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַזָּהָב לַכֶּסֶף וְלַנְּחֹשֶׁת וְלַבַּרְזֶל
  choice: தங்கம், வெள்ளி, வெண்கலம், இரும்பு ஆகியவற்றுக்கோ
  rationale: ஒவ்வொரு பெயர்ச்சொல்லுக்கும் முன் வரும் לְ இங்கே தலைப்பைச் சுட்டும் பொருளில் உள்ளது. தமிழில் ‘ஆகியவற்றுக்கோ’ என்பது முந்தைய சூழலில் குறிப்பிடப்பட்ட கட்டுமானப் பொருட்களை மீண்டும் எடுத்துரைக்கும் தன்மையை இயல்பாகக் காட்டுகிறது.
- source_word: נְחֹשֶׁת
  choice: வெண்கலம்
  rationale: பண்டைய கட்டுமானப் பொருட்கள் மற்றும் வழிபாட்டுப் பொருட்களின் பட்டியலில் இச்சொல் பொதுவாக வெண்கலத்தைக் குறிக்கிறது; செம்பு என்பதும் சொல்லியல் வாய்ப்பாக இருப்பதால் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: אֵין מִסְפָּר
  choice: கணக்கே இல்லை
  rationale: எண்ணிக்கையிட முடியாத மிகுதியைக் குறிக்கும் எபிரெய மரபுத்தொடரை, அதன் வடிவத்தையும் வலியுறுத்தலையும் காக்கும் இயல்பான தமிழில் வழங்குகிறது.
- source_word: קוּם
  choice: எழுந்து
  rationale: செயலில் இறங்கும்படி தூண்டும் கட்டளையாக உள்ளது; அடுத்த கட்டளையோடு இயல்பாக இணைக்கப்பட்டுள்ளது.
- source_word: וַעֲשֵׂה
  choice: வேலையைச் செய்
  rationale: ஆலயக் கட்டுமானச் சூழலில் עשה என்பது வெறும் ‘செய்’ என்பதைவிடக் குறிப்பாக வேலையை மேற்கொள்வதைக் குறிக்கிறது.
- source_word: וִיהִי יְהוָה עִמָּךְ
  choice: யாவே உன்னோடு இருப்பாராக
  rationale: இங்குள்ள வினைவடிவம் சாதாரண எதிர்காலக் கூற்றைவிட வாழ்த்து அல்லது ஆசீர்வாதத்தை வெளிப்படுத்துகிறது. יהוה என்ற இறைபெயர் ஒலிபெயர்ப்பாக ‘யாவே’ என்று தரப்பட்டுள்ளது.
theological_decisions:
- issue: יהוה என்ற இறைபெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் நான்கெழுத்து இறைபெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டப்பெயராக மாற்றாமல், தமிழில் தெளிவான ஒலிபெயர்ப்பாக ‘யாவே’ என்று வழங்குவது மூலத்தின் தனிப்பெயர் தன்மையைப் பாதுகாக்கிறது.
- issue: וִיהִי என்பதன் ஆசீர்வாத அல்லது எதிர்கால நுணுக்கம்
  choice: இருப்பாராக
  alternative: இருப்பார்; இருக்கட்டும்
  rationale: இந்த வினைவடிவம் இச்சூழலில் விருப்பம் அல்லது ஆசீர்வாதத்தை வெளிப்படுத்தக்கூடும். ‘இருப்பாராக’ அந்தத் திறந்த நுணுக்கத்தைப் பாதுகாத்து, இதை உறுதியான எதிர்கால வாக்குறுதியாக மாற்றுவதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வேதாகமத்துக்குரிய கண்ணியமும் காக்கப்பட்டுள்ளன. ஒருமை ஆண்பால் பெறுநருக்கான கட்டளைகள் ‘எழுந்து... செய்’ என்றும், ஆசீர்வாதம் ‘இருப்பாராக’ என்றும் இயல்பாக வழங்கப்பட்டுள்ளன. அடிக்குறிப்பு குறிகள் தொடர்புடைய சொற்றொடர்களின் உடனடிப் பின்னர் வைக்கப்பட்டுள்ளன.
