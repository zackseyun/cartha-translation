base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/006.yaml
  text: Then he called for Solomon his son and commanded him to build a house for Yahweh[a], the God of Israel.
translation:
  language: ta
  text: பின்பு தாவீது தன் மகன் சாலொமோனை அழைத்து, இஸ்ரவேலின் கடவுளாகிய யாவேக்காக ஓர் ஆலயத்தைக்[a] கட்டும்படி அவனுக்குக் கட்டளையிட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒரு வீட்டை.” எபிரெயில் நேரடியாக, “யாவேக்காக ஒரு வீட்டை” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא לִשְׁלֹמֹה בְנוֹ
  choice: பின்பு தாவீது தன் மகன் சாலொமோனை அழைத்து
  rationale: வாவ்-தொடர்நிலை கதையை முன்னெடுப்பதால் ‘பின்பு’ இயல்பான தொடர் உணர்வைத் தருகிறது. எபிரெய உரையில் எழுவாய் மறைந்திருந்தாலும் சூழலிலிருந்து அது தாவீது என்பது தெளிவு; தமிழில் இயல்புக்கும் தெளிவுக்கும் பெயர் வெளிப்படுத்தப்பட்டுள்ளது. ‘தன் மகன்’ உறவைத் துல்லியமாகக் காட்டுகிறது.
- source_word: וַיְצַוֵּהוּ
  choice: அவனுக்குக் கட்டளையிட்டார்
  rationale: צוה என்பதன் அதிகாரபூர்வமான கட்டளை உணர்வை நவீனத் தமிழில் நேரடியாகப் பாதுகாக்கிறது.
- source_word: לִבְנוֹת
  choice: கட்டும்படி
  rationale: கட்டளையின் உள்ளடக்கத்தைத் தெரிவிக்கும் எபிரெய வினையெச்சத்தை இயல்பான தமிழ் நோக்க/உள்ளடக்க அமைப்பில் தருகிறது.
- source_word: בַּיִת
  choice: ஓர் ஆலயத்தை
  rationale: בית என்பதன் அடிப்படைப் பொருள் ‘வீடு’ என்றாலும், இச்சூழலில் அது யாவேக்காகக் கட்டப்படவிருந்த ஆலயத்தைக் குறிக்கிறது. பிரதான உரையில் இயல்பான சூழற்பொருள் தரப்பட்டு, சொற்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: לַיהוָה
  choice: யாவேக்காக
  rationale: ל முன்னிடைச்சொல் இங்கு அர்ப்பணிப்புக்காகக் கட்டப்படுவதைக் குறிக்கிறது; ‘-க்காக’ தமிழில் இயல்பானது. יהוה என்ற தனிப்பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்படுகிறது.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கடவுளாகிய
  rationale: இணைப்புநிலைத் தொடரின் அடையாளப்படுத்தும் பொருளைத் துல்லியமாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பொதுப்பட்டமல்ல, நான்கு எழுத்துகளைக் கொண்ட உடன்படிக்கைத் தனிப்பெயர் நேரடியாக உள்ளது. ஆகவே தனிப்பெயரின் தன்மையைப் பாதுகாக்க ‘யாவே’ பயன்படுத்தப்பட்டுள்ளது.
- issue: בַּיִת என்பதன் ஆலயச் சூழற்பொருள்
  choice: பிரதான உரையில் ‘ஆலயம்’
  alternative: ‘வீடு’
  rationale: இங்கு கட்டப்படுவது வழிபாட்டுக்குரிய ஆலயம் என்பது சூழலால் தெளிவு. எனினும் எபிரெயின் நேரடிப் பொருளான ‘வீடு’ அடிக்குறிப்பில் தரப்பட்டு அதன் உருவக மற்றும் இறையியல் நிழல் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. மரியாதைப் பன்மை வினைமுற்று தாவீதைக் குறிக்க இயல்பாகப் பயன்படுத்தப்பட்டுள்ளது; இறைப்பெயர் தனிப்பெயராகப் பாதுகாக்கப்பட்டுள்ளது.
