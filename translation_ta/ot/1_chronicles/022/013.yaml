base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/013.yaml
  text: Then you will prosper[a], if you are careful to do the statutes and the judgments that Yahweh commanded Moses for Israel. Be strong and courageous. Do not fear[b], and do not be dismayed.
translation:
  language: ta
  text: யாவே மோசேக்கு இஸ்ரவேலுக்காகக் கட்டளையிட்ட சட்டங்களையும் நீதிமுறைகளையும்[b] நீ கவனமாகக் கடைப்பிடித்தால், அப்போது வெற்றிபெறுவாய்[a]. பலமாகவும் துணிவாகவும் இரு. அஞ்சாதே; கலங்காதே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “செழிப்படைவாய்.” எபிரேய வினை வெற்றிபெறுதல் அல்லது செழிப்படைதல் ஆகிய இரண்டையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “சட்டங்கள்,” “நீதிமுறைகள்” என்பவை எபிரேயத்தில் தனித்தனியான இரண்டு சட்டச் சொற்கள்; “நியமங்கள்,” “நீதித்தீர்ப்புகள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: அப்போது
  rationale: முந்தைய அறிவுறுத்தலைப் பின்பற்றுவதால் விளையும் முடிவை இயல்பான தமிழில் குறிக்கிறது.
- source_word: תַּצְלִיחַ
  choice: நீ வெற்றிபெறுவாய்
  rationale: הצלח என்பதன் வெற்றியடைதல்/செழித்தல் என்ற இரு சாத்தியங்களுள், இச்சூழலில் இயல்பான முதன்மை வாசகமாக ‘வெற்றிபெறுவாய்’ தேர்ந்தெடுக்கப்பட்டது; மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אִם תִּשְׁמֹר לַעֲשׂוֹת
  choice: கவனமாகக் கடைப்பிடித்தால்
  rationale: ‘காத்து/கவனித்து செய்யுதல்’ என்ற எபிரேய மரபுத்தொடரின் கவனத்தையும் கீழ்ப்படிதலையும் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: הַחֻקִּים
  choice: சட்டங்கள்
  rationale: நியமிக்கப்பட்ட சட்டவிதிகளைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொல்; அடுத்த சட்டச்சொல்லிலிருந்து வேறுபடுத்தப்பட்டுள்ளது.
- source_word: הַמִּשְׁפָּטִים
  choice: நீதிமுறைகள்
  rationale: நீதித்தீர்ப்பு, நியாயவிதி, சட்ட ஒழுங்கு ஆகிய பொருள் பரப்பைத் தக்கவைத்து חֻקִּים என்பதிலிருந்து வேறுபடுத்துகிறது.
- source_word: אֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה עַל יִשְׂרָאֵל
  choice: இஸ்ரவேலுக்காக மோசேக்கு யாவே கட்டளையிட்ட
  rationale: மோசே கட்டளையைப் பெற்றவர் என்பதையும், இஸ்ரவேல் அதன் நோக்கப்பட்ட மக்கள் என்பதையும் மூலமொழி அமைப்புக்கு ஏற்ப காட்டுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருப்பெயரான יהוה-ஐ பொதுப்பட்டப் பெயரால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: חֲזַק וֶאֱמָץ
  choice: பலங்கொண்டு துணிவாயிரு
  rationale: வலிமையும் மனவுறுதியும் கொண்டிருக்கச் சொல்லும் இணை அறிவுறுத்தலை இயல்பாகவும் கண்ணியமாகவும் தருகிறது.
- source_word: אַל תִּירָא
  choice: அஞ்சாதே
  rationale: தடை அறிவுறுத்தலை நேரடியாகவும் சுருக்கமாகவும் மொழிபெயர்க்கிறது.
- source_word: וְאַל תֵּחָת
  choice: கலங்காதே
  rationale: மனமுடைந்து நிலைகுலைதல் என்ற வினையின் தீவிரத்தை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: யெகோவா
  rationale: மூலத்தில் திருப்பெயர் நேரடியாக இருப்பதால் அதைப் பட்டப்பெயராக மாற்றாமல், பரவலாக ஏற்றுக்கொள்ளப்படும் ‘யாவே’ என்ற ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டது.
- issue: வெற்றி கீழ்ப்படிதலோடு தொடர்புபடுத்தப்படும் விதம்
  choice: மூலத்தின் நிபந்தனை அமைப்பு அப்படியே வைக்கப்பட்டது
  alternative: உறுதியான செழிப்பு வாக்குறுதியாக விரிவாக்குதல்
  rationale: אִם என்ற ‘என்றால்’ நிபந்தனையையும் இவ்வசனத்தின் குறிப்பிட்ட உடன்படிக்கைச் சூழலையும் தக்கவைத்து, பொதுவான பொருளாதாரச் செழிப்பு கோட்பாடாக வாசகத்தை விரிவாக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், நேரடியான அறிவுறுத்தல் நடையும் வேதாகமத்துக்குரிய கண்ணியமும் பேணப்பட்டுள்ளன. ‘கடாப்பிடி’ போன்ற பேச்சுவழக்குச் சொற்கள் தவிர்க்கப்பட்டு, பொதுவாசகர்களுக்குப் புரியும் ‘கவனமாகக் கடைப்பிடி’ பயன்படுத்தப்பட்டது.
