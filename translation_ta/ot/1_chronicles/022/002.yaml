  text: וַ/יֹּ֣אמֶר דָּוִ֔יד לִ/כְנוֹס֙ אֶת הַ/גֵּרִ֔ים אֲשֶׁ֖ר בְּ/אֶ֣רֶץ יִשְׂרָאֵ֑ל וַ/יַּעֲמֵ֣ד חֹֽצְבִ֗ים לַ/חְצוֹב֙ אַבְנֵ֣י גָזִ֔ית לִ/בְנ֖וֹת בֵּ֥ית הָ/אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/002.yaml
  text: And David ordered the foreigners who were in the land of Israel to be gathered[c][b][a], and he appointed stonecutters to cut dressed stones for building the house of God.
translation:
  language: ta
  text: இஸ்ரவேல் நாட்டில் வாழ்ந்துவந்த அந்நியக் குடியிருப்பாளர்களை[a] ஒன்றுகூட்டும்படி தாவீது கட்டளையிட்டார். கடவுளின் இல்லத்தைக்[c] கட்டுவதற்காகச் செதுக்கப்பட்ட கற்களை[b] வெட்ட கல் வெட்டுவோரை அவர் நியமித்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தங்கிவாழும் அந்நியர்கள்’ அல்லது ‘குடியேறிகள்’ என்றும் மொழிபெயர்க்கலாம். இங்கு எபிரெயச் சொல், இஸ்ரவேலர் அல்லாதவர்களாக நாட்டில் குடியிருந்து வாழ்ந்தவர்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘வெட்டப்பட்ட கற்கள்’ அல்லது ‘வடிவமைக்கப்பட்ட கற்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அதாவது, ஆலயம்.
    reason: cross_reference
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: கட்டளையிட்டார்
  rationale: வினைச்சொல்லின் அடிப்படைப் பொருள் ‘சொன்னார்’ என்பதாக இருந்தாலும், לִכְנוֹס என்ற வினையெச்சத்துடன் இங்கு ஒரு பணிப்புரையைக் குறிக்கிறது. எனவே சூழலின் வலிமையை இயல்பான தமிழில் ‘கட்டளையிட்டார்’ என்று வழங்குகிறது.
- source_word: לִכְנוֹס
  choice: ஒன்றுகூட்டும்படி
  rationale: தாவீது தாமே அவர்களைத் திரட்டினார் என்று கூறாமல், அவர்களை ஒன்றுகூட்டுமாறு பிறருக்குக் கொடுத்த பணிப்புரையின் உள்ளடக்கத்தை இது தெளிவாகக் காட்டுகிறது.
- source_word: הַגֵּרִים
  choice: அந்நியக் குடியிருப்பாளர்கள்
  rationale: இச்சொல் இஸ்ரவேலர் அல்லாதவர்களாக நாட்டில் குடியிருந்து வாழ்ந்தவர்களைக் குறிக்கிறது. ‘அந்நியர்கள்’ என்பதைவிட குடியிருப்பு நிலையைத் தெளிவாகவும், அதிகார மொழிபோல் ஒலிக்காமலும் இத்தொடர் தெரிவிக்கிறது.
- source_word: בְּאֶרֶץ יִשְׂרָאֵל
  choice: இஸ்ரவேல் நாட்டில்
  rationale: אֶרֶץ என்பதன் நிலப்பரப்பு சார்ந்த பொருளைப் பாதுகாத்து, இயல்பான தமிழில் வழங்குகிறது.
- source_word: וַיַּעֲמֵד
  choice: நியமித்தார்
  rationale: ஒரு குறிப்பிட்ட பணிக்காக வேலைக்காரர்களை அமர்த்துதல் அல்லது பொறுப்பில் நிறுத்துதல் என்பதே இங்குள்ள பொருள்.
- source_word: חֹצְבִים
  choice: கல் வெட்டுவோர்
  rationale: கற்களை வெட்டி வடிவமைக்கும் தொழிலாளர்களைக் குறிக்கும் எளிய, தற்போதைய தமிழ்ச் சொற்றொடர்.
- source_word: לַחְצוֹב
  choice: வெட்டுவதற்காக
  rationale: חֹצְבִים என்பதிலுள்ள அதே வேர்ச்சொல்லின் மீளுரைப்பைத் தமிழிலும் ‘கல் வெட்டுவோர் ... வெட்டுவதற்காக’ என்று இயன்றவரை பாதுகாக்கிறது.
- source_word: אַבְנֵי גָזִית
  choice: செதுக்கப்பட்ட கற்கள்
  rationale: கட்டுமானத்திற்காக வெட்டி ஒழுங்கான வடிவில் தயாரிக்கப்பட்ட கற்களை இத்தொடர் குறிக்கிறது. ‘வெட்டப்பட்ட கற்கள்’ என்பதும் சாத்தியம்; ஆனால் தயாரித்து வடிவமைத்த தன்மையை ‘செதுக்கப்பட்ட’ தெளிவாக்குகிறது.
- source_word: לִבְנוֹת
  choice: கட்டுவதற்குத் தேவையான
  rationale: கற்களை வெட்டுவதன் நோக்கம் கட்டுமானம் என்பதைத் தமிழில் இயல்பாக இணைக்கிறது; மூலத்தின் நோக்கப் பொருள் காக்கப்படுகிறது.
- source_word: בֵּית הָאֱלֹהִים
  choice: கடவுளின் இல்லம்
  rationale: எபிரெயச் சொற்றொடரின் நேரடிப் பொருளான ‘கடவுளின் இல்லம்’ என்பதைக் காக்கிறது; பொருள் ஆலயத்தைக் குறித்தாலும், முதன்மை உரையில் அதை விளக்கச் சொல்லாக மாற்றவில்லை.
theological_decisions:
- issue: בֵּית הָאֱלֹהִים என்பதன் மொழிபெயர்ப்பு
  choice: கடவுளின் இல்லம்
  alternative: கடவுளின் ஆலயம்
  rationale: இச்சூழலில் கட்டப்படவிருக்கும் ஆலயமே குறிப்பிடப்படுகிறது. ஆயினும் எபிரெய மூலத்தில் ‘கடவுளின் இல்லம்’ என்றே இருப்பதால், அதன் உருவகத்தையும் சொல்வடிவத்தையும் முதன்மை உரையில் காத்து, ‘ஆலயம்’ என்பதை அடிக்குறிப்பில் விளக்கமாக வழங்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified நடையைப் பயன்படுத்துகிறது. ‘கடவுளின் இல்லம்’ என்ற மூல உருவகம் பாதுகாக்கப்பட்டுள்ளது; தொழில்சார் சொற்கள் மிகப் பழமையான அல்லது செயற்கையான நடையைத் தவிர்த்து வழங்கப்பட்டுள்ளன.
