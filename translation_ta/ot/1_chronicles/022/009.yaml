  edition: WLC
  text: הִנֵּה בֵ֞ן נוֹלָ֣ד לָ֗/ךְ ה֤וּא יִהְיֶה֙ אִ֣ישׁ מְנוּחָ֔ה וַ/הֲנִח֥וֹתִי ל֛/וֹ מִ/כָּל אוֹיְבָ֖י/ו מִ/סָּבִ֑יב כִּ֤י שְׁלֹמֹה֙ יִהְיֶ֣ה שְׁמ֔/וֹ וְ/שָׁל֥וֹם וָ/שֶׁ֛קֶט אֶתֵּ֥ן עַל יִשְׂרָאֵ֖ל בְּ/יָמָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/009.yaml
  text: Behold[a], a son will be born to you. He will be a man of rest, and I will give him rest from all his enemies all around; for Solomon will be his name[b], and I will give peace and quiet to Israel in his days.
translation:
  language: ta
  text: இதோ, உனக்கு ஒரு மகன் பிறப்பான். அவன் ஓய்வை அனுபவிக்கும் மனிதனாக இருப்பான்; அவனைச் சுற்றியுள்ள எல்லாப் பகைவர்களிடமிருந்தும் அவனுக்கு நான் ஓய்வு அளிப்பேன். ஏனெனில் அவனுடைய பெயர் சாலொமோன்[a] ஆகும்; அவனுடைய நாட்களில் இஸ்ரவேலுக்குச் சமாதானத்தையும் அமைதியையும் நான் அளிப்பேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சாலொமோன்” என்ற பெயர் எபிரெய மொழியில் “சமாதானம்” (shalom) என்ற சொல்லுடன் தொடர்புடையது; இவ்வசனம் அவனை ஓய்வை அனுபவிக்கும் மனிதன் என்றும் கூறுகிறது.
    reason: பெயருக்கும் எபிரெய ‘சமாதானம்’ சொல்லுக்கும் உள்ள தொடர்பையும், வசனத்தில் வரும் ஓய்வு கருத்தையும் விளக்குகிறது.
lexical_decisions:
- source_word: הִנֵּה
  choice: இதோ
  rationale: அடுத்து வரும் இறை அறிவிப்பின் மீது கவனத்தைத் திருப்பும் எபிரெயச் சொல்லின் சுட்டிக்காட்டும் வலிமையையும் கண்ணியமான நடையையும் காக்கிறது.
- source_word: בֵן נוֹלָד לָךְ
  choice: உனக்கு ஒரு மகன் பிறப்பான்
  rationale: வடிவில் நிகழ்காலப் பங்கேற்புச் சொல் இருந்தாலும், வாக்குறுதியின் சூழலில் எதிர்காலப் பிறப்பைக் குறிக்கிறது; தமிழில் இயல்பாக எதிர்காலத்தில் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: אִישׁ מְנוּחָה
  choice: நிம்மதியாக வாழும் மனிதன்
  rationale: சொல்லுக்குச் சொல் ‘இளைப்பாறுதலின் மனிதன்’ என்பது இயல்பற்ற தமிழ். ‘நிம்மதியாக வாழும்’ என்பது ஓய்வு, பாதுகாப்பு, போர் தொல்லையின்மை ஆகிய சூழல்சார்ந்த கருத்துகளைத் தெரிவிக்கிறது.
- source_word: וַהֲנִחוֹתִי לוֹ
  choice: அவனுக்கு நான் நிம்மதி அளிப்பேன்
  rationale: முன்னுள்ள מְנוּחָה என்பதுடனான வேர் சார்ந்த மீளுரையை ‘நிம்மதி’ மூலம் காக்கிறது; இறைவன் பாதுகாப்பான ஓய்வை அருளுவதை இயல்பான தமிழில் கூறுகிறது.
- source_word: מִכָּל אוֹיְבָיו מִסָּבִיב
  choice: சுற்றியிருக்கும் அவனுடைய எதிரிகள் அனைவரிடமிருந்தும்
  rationale: எதிரிகளின் முழுமையையும் அவர்கள் எல்லாப் பக்கங்களிலும் இருப்பதையும் தெளிவாகக் காக்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முன் கூறிய வாக்குறுதியைத் தொடர்ந்து பெயர் மற்றும் சமாதானம் பற்றிய விளக்கத்தை அறிமுகப்படுத்தும் காரணவிளக்க இணைப்பாக வழங்கப்பட்டுள்ளது.
- source_word: שְׁלֹמֹה יִהְיֶה שְׁמוֹ
  choice: அவனுடைய பெயர் சாலொமோன் என்பதாக இருக்கும்
  rationale: பெயரை வழக்கமான தமிழ் ஒலிபெயர்ப்பில் தருவதோடு, எதிர்கால அறிவிப்பையும் தெளிவாகக் காக்கிறது.
- source_word: שָׁלוֹם וָשֶׁקֶט
  choice: சமாதானத்தையும் அமைதியையும்
  rationale: இரு வேறு எபிரெயச் சொற்களையும் ஒன்றாக்காமல், முறையே முழுமையான நலன்/சமாதானம் மற்றும் கலக்கமற்ற அமைதி என்ற கருத்துகளுடன் வேறுபடுத்துகிறது.
theological_decisions:
- issue: ஓய்வு, சாலொமோன் என்ற பெயர், சமாதானம் ஆகியவற்றுக்கிடையிலான கருத்துத் தொடர்பு
  choice: מְנוּחָה மற்றும் נוח வேர் சார்ந்த சொற்களை ‘நிம்மதி’ கொண்டு இணைத்து, שָׁלוֹם என்பதைத் தனியே ‘சமாதானம்’ என மொழிபெயர்த்து, பெயருடனான தொடர்பை அடிக்குறிப்பில் விளக்குதல்
  alternative: אִישׁ מְנוּחָה என்பதை ‘சமாதானத்தின் மனிதன்’ என மொழிபெயர்த்து எல்லாக் கருத்துகளையும் ஒரே சொல்லில் இணைத்தல்
  rationale: மூலத்தில் ஓய்வு/நிம்மதி மற்றும் சமாதானம் என்பவை தொடர்புடையவையாக இருந்தாலும் தனித்தனி சொற்கள். அவற்றை ஒன்றாகக் கலக்காமல் வசனத்தின் கருத்துத் தொடர்பையும் பெயர்ச் சொல்லாட்டத்தையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான அறிவிப்பு நடை பயன்படுத்தப்பட்டுள்ளது. ‘நிம்மதி’, ‘சமாதானம்’, ‘அமைதி’ ஆகியவை மூலத்தின் தொடர்புடைய ஆனால் வேறுபட்ட சொற்களைத் தனித்தனியாகத் தெரிவிக்கின்றன.
