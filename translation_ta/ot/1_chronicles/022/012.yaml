source:
  edition: WLC
  text: אַ֣ךְ יִֽתֶּן לְּ/ךָ֤ יְהוָה֙ שֵׂ֣כֶל וּ/בִינָ֔ה וִֽ/יצַוְּ/ךָ֖ עַל יִשְׂרָאֵ֑ל וְ/לִ/שְׁמ֕וֹר אֶת תּוֹרַ֖ת יְהוָ֥ה אֱלֹהֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/012.yaml
  text: Only[a], may Yahweh give you insight and understanding, and command you concerning Israel[b], that you may keep the law of Yahweh your God.
translation:
  language: ta
  text: 'எல்லாவற்றிற்கும் மேலாக, யாவே உனக்கு விவேகத்தையும் புரிந்துணர்வையும் அளித்து, இஸ்ரயேலைக் குறித்து உனக்குக் கட்டளையிடுவாராக[a]; நீ உன் கடவுளாகிய யாவேயின் சட்டத்தைக் கடைப்பிடிக்கும்படியாக.


    [a] அல்லது, ‘இஸ்ரயேலின்மேல் உன்னைப் பொறுப்பில் அமர்த்துவாராக.’ எபிரெய வினைத்தொடரை ‘இஸ்ரயேலைக் குறித்து உனக்குக் கட்டளையிடுவாராக’ என்றும் புரிந்துகொள்ளலாம்.

    [b] அல்லது, ‘போதனையை.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இஸ்ரயேலின்மேல் உன்னைப் பொறுப்பில் அமர்த்துவாராக.’ எபிரெய வினைத்தொடரை ‘இஸ்ரயேலைக் குறித்து உனக்குக் கட்டளையிடுவாராக’ என்றும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘போதனையை.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: எல்லாவற்றிற்கும் மேலாக
  rationale: இந்த இடத்தில் வரும் வலியுறுத்தும்/வரையறுக்கும் இடைச்சொல், தாவீது சாலொமோனுக்காக விரும்பும் முதன்மையான காரியத்தை அறிமுகப்படுத்துகிறது. ‘எல்லாவற்றிற்கும் மேலாக’ என்பது இயல்பான தமிழில் அந்த மையப்படுத்தும் வலிமையை வெளிப்படுத்துகிறது.
- source_word: יִתֶּן
  choice: அளித்து ... கட்டளையிடுவாராக
  rationale: வடிவில் முற்றுப்பெறாத வினையாக இருந்தாலும், சூழலில் இது வேண்டுதல் அல்லது ஆசிமொழியின் பொருளை உடையது; ‘-வாராக’ அந்த விருப்பநிலையைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் நேரடியாக வரும் கடவுளின் உடன்படிக்கைப் பெயரைப் பெயராகவே ஒலிபெயர்க்கிறது.
- source_word: שֵׂכֶל
  choice: விவேகம்
  rationale: நடைமுறை ஞானம், நல்ல தீர்மானத் திறன் ஆகிய கருத்துகளை வெளிப்படுத்துகிறது; அடுத்துள்ள בִינָה என்பதிலிருந்து வேறுபாட்டையும் காக்கிறது.
- source_word: בִינָה
  choice: புரிந்துணர்வு
  rationale: ஆழ்ந்து உணர்ந்து பகுத்தறியும் திறனைக் குறிக்கிறது; שֵׂכֶל உடன் வரும் இணைச்சொல் அமைப்பை ஒரே பொருளாகச் சுருக்காமல் காக்கிறது.
- source_word: וִיצַוְּךָ עַל יִשְׂרָאֵל
  choice: இஸ்ரயேலைக் குறித்து உனக்குக் கட்டளையிடுவாராக
  rationale: צוה என்பதன் வழக்கமான ‘கட்டளையிடு’ என்ற பொருளை நேரடியாகக் காக்கிறது. עַל உடன் வரும் அரசச் சூழலில் ‘இஸ்ரயேலின்மேல் உன்னைப் பொறுப்பில் அமர்த்துவாராக’ என்றும் புரிந்துகொள்ள இயலும் என்பதால் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְלִשְׁמוֹר
  choice: அப்போது ... கடைப்பிடிப்பாய்
  rationale: இணைப்பும் வினையெச்சமும் முன் வேண்டுதலின் நோக்கம் அல்லது விளைவைத் தெரிவிக்கின்றன. தமிழ் வாக்கிய ஓட்டத்தில் ‘அப்போது’ இதை இயல்பாக வெளிப்படுத்துகிறது; நோக்கம்–விளைவு உறவை அளவுக்கு மீறித் தீர்மானிக்கவில்லை.
- source_word: תּוֹרַת
  choice: சட்டத்தை
  rationale: உடன்படிக்கைச் சூழலில் தேவனுடைய கட்டளைகளின் தொகுப்பைக் குறிக்கும் அறியப்பட்ட சொல்லாக்கம். இதற்கு ‘போதனை’ என்ற விரிவான பொருளும் இருப்பது அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: אֱלֹהֶיךָ
  choice: உன் கடவுளாகிய
  rationale: சாலொமோனை நோக்கிய இரண்டாம் நபர் ஒருமை உரிமைத் தொடர்பைத் தெளிவாகவும் இயல்பாகவும் வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் நான்கெழுத்து இறைப்பெயர் நேரடியாக உள்ளது. பொதுப்பட்டப்பெயராக மாற்றாமல், உடன்படிக்கைப் பெயரை ஒலிபெயர்ப்பது மூலத்தின் தனித்தன்மையைப் பாதுகாக்கிறது.
- issue: וִיצַוְּךָ עַל יִשְׂרָאֵל என்பதன் அரசச் சூழல் பொருள்
  choice: இஸ்ரயேலைக் குறித்து உனக்குக் கட்டளையிடுவாராக
  alternative: இஸ்ரயேலின்மேல் உன்னைப் பொறுப்பில் அமர்த்துவாராக
  rationale: முதன்மை உரை צוה வினையின் நேரடியான பொருளைக் காக்கிறது. அதேவேளை עַל உடன் அரசச் சூழலில் பொறுப்பு ஒப்படைத்தல் என்ற பொருள் சாத்தியமுள்ளதால், அந்த உண்மையான தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: תּוֹרָה என்பதன் பொருள்
  choice: சட்டம்
  alternative: போதனை / அறிவுறுத்தல்
  rationale: இங்கு யாவேயின் உடன்படிக்கைக் கட்டளைகள் குறிக்கப்படுவதால் ‘சட்டம்’ பொருத்தமானது; எனினும் தோரா என்பது வெறும் சட்ட விதிகளைவிட விரிந்த ‘போதனை’ என்ற பொருளையும் தாங்குவதால் மாற்றுப் பொருள் குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் எளிமையும் கொண்ட ஆசிமொழி நடையைப் பயன்படுத்துகிறது. ‘விவேகம்—புரிந்துணர்வு’ என்ற இணைச்சொற்கள் எபிரெயச் சொற்களின் நெருங்கியதாயினும் தனித்த நுணுக்கங்களைப் பாதுகாக்கின்றன. இறைப்பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது; உண்மையான சொற்பொருள் தெளிவின்மைகள் அடிக்குறிப்புகளில் வைக்கப்பட்டுள்ளன.
