  edition: WLC
  text: הֽוּא יִבְנֶ֥ה בַ֨יִת֙ לִ/שְׁמִ֔/י וְ/הוּא֙ יִהְיֶה לִּ֣/י לְ/בֵ֔ן וַ/אֲנִי ל֖/וֹ לְ/אָ֑ב וַ/הֲכִ֨ינוֹתִ֜י כִּסֵּ֧א מַלְכוּת֛/וֹ עַל יִשְׂרָאֵ֖ל עַד עוֹלָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/010.yaml
  text: He will build a house for my name[a], and he will be a son to me, and I will be a father to him, and I will establish the throne of his kingdom over Israel forever.
translation:
  language: ta
  text: அவன் என் பெயருக்காக ஒரு வீட்டைக் கட்டுவான்; அவன் எனக்கு மகனாக இருப்பான், நான் அவனுக்குத் தந்தையாக இருப்பேன்; இஸ்ரவேலின் மேல் அவனுடைய அரசின் அரியணையை என்றென்றும் நிலைநிறுத்துவேன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּיִת
  choice: வீடு
  rationale: அடிப்படைப் பொருள் ‘வீடு’. இச்சூழலில் இது ஆலயத்தைக் குறித்தாலும், எபிரெயச் சொல்லாட்சியை முதன்மை உரையில் காக்க ‘வீடு’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: לִשְׁמִי
  choice: என் பெயருக்காக
  rationale: தேவனுடைய பெயருக்கு அர்ப்பணிக்கப்பட்டதைக் குறிக்கும் எபிரெயச் சொல்லாட்சியை நேரடியாகவும் இயல்பாகவும் காக்கிறது.
- source_word: לְבֵן
  choice: மகனாக
  rationale: உறவைக் குறிக்கும் உடன்படிக்கைச் சூத்திரத்தை விளக்கவுரையாக்காமல் நேரடியாகப் பாதுகாக்கிறது.
- source_word: לְאָב
  choice: தந்தையாக
  rationale: ‘மகனாக’ என்பதற்கு இணையான உறவுமுறைச் சொல்லாட்சியைத் தெளிவாகக் காக்கிறது.
- source_word: וַהֲכִינוֹתִי
  choice: நிலைநிறுத்துவேன்
  rationale: כון என்பதன் ஹிபீல் வடிவம் உறுதிப்படுத்துதல் அல்லது நிலைபெறச் செய்தல் என்ற பொருளைத் தருகிறது; அரச வம்சத்தின் நிலைத்தன்மையை ‘நிலைநிறுத்துவேன்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כִּסֵּא מַלְכוּתוֹ
  choice: அவனுடைய அரசின் அரியணை
  rationale: ‘அரியணை’ மற்றும் ‘அரசு’ ஆகிய இரு கூறுகளையும் பாதுகாத்து, வம்ச மற்றும் ஆட்சிப் பரிமாணங்களைத் தக்கவைக்கிறது.
- source_word: עַל יִשְׂרָאֵל
  choice: இஸ்ரவேலின்மேல்
  rationale: அரசாட்சிச் சூழலில் עַל ஆளுகையைக் குறிப்பதால் ‘மேல்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: עַד עוֹלָם
  choice: என்றென்றும்
  rationale: நீடித்த நிரந்தரத்தன்மையைக் குறிக்கும் வாக்குறுதியின் வலிமையை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: சாலொமோனுக்குப் பொருந்தும் தந்தை–மகன் உடன்படிக்கைச் சூத்திரமும் தாவீதிய மேசியா வாக்குறுதியுடனான அதன் விரிவான வேதாகமத் தொடர்பும்
  choice: ‘அவன் எனக்கு மகனாக இருப்பான்; நான் அவனுக்குத் தந்தையாக இருப்பேன்’ என்ற உறவுமுறை மொழி நேரடியாகத் தக்கவைக்கப்பட்டுள்ளது.
  alternative: ‘அவனை என் மகனைப்போல் நடத்துவேன்’ போன்ற, மகன் உறவின் நேரடித் தன்மையைத் தளர்த்தும் விளக்கவுரை.
  rationale: எபிரெய உரை உடன்படிக்கை உறவை நேரடியாகக் கூறுகிறது. இவ்வாறு மொழிபெயர்ப்பது சாலொமோனைப் பற்றிய உடனடிக் குறிப்பையும் அதன் விரிவான வேதாகம முக்கியத்துவத்தையும் காக்கிறது; பிற்காலக் கோட்பாட்டு முடிவுகளை வசனத்துக்குள் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமானவும் பொதுவாசகர்களுக்குப் புரியத்தக்கதாகவும் வடிவமைக்கப்பட்டுள்ளது. ‘வீடு’ என்ற நேரடி உருவகமும் தந்தை–மகன் உடன்படிக்கை மொழியும் பாதுகாக்கப்பட்டுள்ளன.
