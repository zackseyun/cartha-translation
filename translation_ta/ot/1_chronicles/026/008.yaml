translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. நீண்ட எபிரெய வாக்கியம் தெளிவுக்காக மூன்று வாக்கியங்களாக அமைக்கப்பட்டாலும், குடும்பப் பட்டியல், பணித்தகுதி, மொத்த எண்ணிக்கை ஆகிய தொடர்புகள் பேணப்பட்டுள்ளன.
