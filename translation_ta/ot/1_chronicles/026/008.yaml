base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/008.yaml
  text: All these were from the sons of Obed-edom—they and their sons and their brothers, able men with strength for the service—sixty-two belonging to Obed-edom.
translation:
  language: ta
  text: இவர்கள் அனைவரும் ஓபேத்-ஏதோமின் மகன்களின் வழிவந்தவர்கள்; இவர்களும் அவர்களுடைய மகன்களும் அவர்களுடைய சகோதரர்களும்[a] பணிக்குத் தகுந்த வலிமையும் திறமையும் கொண்ட ஆண்கள்[b]. ஓபேத்-ஏதோமுக்குச் சேர்ந்தவர்கள் மொத்தம் அறுபத்திரண்டு பேர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சகோதரர்கள்” என்பது இங்கே குலத்தைச் சேர்ந்த ஆண் உறவினர்களையும் விரிவாகக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “வலிமையும் திறமையும் கொண்ட ஆண்கள்” என்று மொழிபெயர்க்கப்பட்ட எபிரெயச் சொற்றொடர் “வீரமுள்ள ஆண்கள்” அல்லது “வல்ல ஆண்கள்” என்றும் பொருள்படலாம்; இச்சூழலில் பணிக்குத் தகுதியான வலிமையையும் திறமையையும் இது குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבְּנֵי
  choice: மக்களில் வந்தவர்கள்
  rationale: מִן உடன் வரும் ‘மகன்கள்’ என்பது ஓபேத்-ஏதோமின் குடும்ப வழியிலிருந்து அல்லது குடும்பக் குழுவிலிருந்து வந்தவர்கள் என்பதைக் குறிக்கிறது.
- source_word: הֵמָּה וּבְנֵיהֶם וַאֲחֵיהֶם
  choice: இவர்களும் இவர்களுடைய மகன்களும் சகோதரர்களும்
  rationale: மூலத்தின் மூன்று குழுக்களையும் நேரடியாகப் பேணுகிறது; אחים என்பதன் அடிப்படைப் பொருளான ‘சகோதரர்கள்’ முதன்மை உரையில் வைக்கப்பட்டுள்ளது.
- source_word: אִישׁ חַיִל
  choice: திறமைசாலிகள்
  rationale: இச்சூழலில் חַיִל போர்வீரத்தைக் காட்டிலும் பணிக்கான ஆற்றல், தகுதி, திறமை ஆகியவற்றை முன்னிறுத்துகிறது.
- source_word: בַּכֹּחַ
  choice: வலிமை கொண்ட
  rationale: כֹּחַ என்பதன் வலிமை அல்லது ஆற்றல் என்ற நேரடியான பொருளைப் பேணி, தமிழில் இயல்பாக இணைக்கிறது.
- source_word: לַעֲבֹדָה
  choice: பணிக்குத் தேவையான
  rationale: ஆலயத்தோடு தொடர்புடைய நியமிக்கப்பட்ட சேவை அல்லது பணிக்கான தகுதியைச் சுட்டுகிறது; மூலத்தில் வெளிப்படையாக இல்லாத கூடுதல் விவரத்தைச் சேர்ப்பதில்லை.
- source_word: שִׁשִּׁים וּשְׁנַיִם
  choice: அறுபத்திரண்டு
  rationale: எண்ணின் நேரடியான மொழிபெயர்ப்பு.
- source_word: לְעֹבֵד אֱדֹם
  choice: ஓபேத்-ஏதோமைச் சேர்ந்தவர்கள்
  rationale: இறுதி לְ ஓபேத்-ஏதோமின் குடும்பக் குழுவுடனான தொடர்பைக் குறிக்கும் தொகுப்புரையாக எடுத்துக்கொள்ளப்பட்டுள்ளது.
