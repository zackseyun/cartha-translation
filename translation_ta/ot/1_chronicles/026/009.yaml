translation:
  language: ta
  text: மெஷெலெமியாவுக்கு மகன்களும் சகோதரர்களுமாகத் திறன்வாய்ந்த ஆண்கள் பதினெட்டுப் பேர் இருந்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/לִ/מְשֶׁלֶמְיָהוּ
  choice: மெஷெலெமியாவுக்கு
  rationale: இணைப்பிடைச்சொல்லுடன் வரும் לְ முன்னொட்டு இங்கு பட்டியலில் மெஷெலெமியாவுக்குரியவர்களை அறிமுகப்படுத்துகிறது. தமிழின் வேற்றுமை உருபுடன் கூடிய இந்த வடிவம் எபிரெய அமைப்பையும் இயல்பான கணக்கீட்டு நடையையும் காக்கிறது. பெயர் WLC வாசகத்தின்படி மெஷெலெமியா என ஒலிபெயர்க்கப்பட்டது.
- source_word: בָּנִים וְ/אַחִים
  choice: மகன்களும் சகோதரர்களுமாக
  rationale: בָּנִים என்பது ஆண் பிள்ளைகளையும் אַחִים என்பது இயல்பாக சகோதரர்களையும் குறிக்கிறது. பரந்த பொருளான ‘உறவினர்கள்’ என்பதை ஆதாரமின்றி தேர்ந்தெடுக்காமல் நேரடியான உறவுமுறைகள் காக்கப்பட்டுள்ளன.
- source_word: בְּנֵי חָיִל
  choice: திறன்வாய்ந்த ஆண்கள்
  rationale: சொல்லுக்கு சொல் ‘வலிமை/திறமையின் மகன்கள்’ என்ற எபிரெய மரபுத்தொடர், இச்சூழலில் ஆற்றலும் தகுதியும் உள்ள ஆண்களைக் குறிக்கிறது. ‘திறன்வாய்ந்த ஆண்கள்’ என்பது போர் வீரத்துக்கு மட்டும் பொருளைக் குறுக்காமல் இயல்பான தமிழில் அதன் பரப்பைத் தருகிறது.
- source_word: שְׁמוֹנָה עָשָׂר
  choice: பதினெட்டுப் பேர்
  rationale: மனிதர்களின் எண்ணிக்கையைச் சுட்டுவதால், தமிழில் இயல்பான மனிதர் எண்ணிக்கைக் குறிப்பான ‘பேர்’ சேர்க்கப்பட்டுள்ளது.
theological_decisions: []
translation_notes:
  register: நவீன பொதுத்தமிழில், பட்டியல்/கணக்கீட்டுச் சூழலுக்கு ஏற்ற சுருக்கமான கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வாக்கியத்தில் வெளிப்படையாக இல்லாத ‘இருந்தார்கள்’ தமிழில் வாக்கியத்தை இயல்பாக நிறைவு செய்யச் சேர்க்கப்பட்டுள்ளது; ‘பதினெட்டுப் பேர்’ இறுதியில் வைக்கப்பட்டதால் மூலத்தின் எண்ணிக்கைச் சுருக்கமும் ஓரளவு காக்கப்படுகிறது.
