base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/010.yaml
  text: 'And Hosah[a], from the sons of Merari, had sons: Shimri the chief, though he was not the firstborn; his father made him chief.'
translation:
  language: ta
  text: 'மெராரியின் மக்களில் ஒருவனான ஓசாவுக்கு மகன்கள் இருந்தார்கள்: சிம்ரி தலைவன்; அவன் முதற்பிறந்தவன் அல்லாதபோதிலும்[a], அவனுடைய தந்தை அவனைத் தலைவனாக நியமித்தார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஏனெனில் அவன் முதற்பிறந்தவன் அல்ல.” எபிரெய இணைப்புச்சொல் விளக்கவுரையாகவும் சலுகைப் பொருளிலும் புரிந்துகொள்ளப்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְחֹסָה
  choice: ஓசாவுக்கு
  rationale: பட்டியல் சூழலில் לְ முன்னொட்டு உடைமை அல்லது உறவைக் குறிக்கிறது; அடுத்துள்ள ‘மகன்கள்’ என்பதுடன் சேர்ந்து, ஓசாவுக்கு மகன்கள் இருந்தார்கள் என்ற பொருளை இயல்பாகத் தருகிறது.
- source_word: מִן בְּנֵי מְרָרִי
  choice: மெராரியின் மக்களில் ஒருவனான
  rationale: ஓசா மெராரியின் வழிவந்தவர்களில் ஒருவர் என்பதைத் தெளிவாகவும் இயல்பான நவீன தமிழிலும் தெரிவிக்கிறது.
- source_word: בָּנִים
  choice: மகன்கள் இருந்தார்கள்
  rationale: எபிரெயத்தில் பெயர்ச்சொல் மட்டும் இருந்தாலும், தமிழில் முழுமையான வாக்கியமாக அமையத் தேவையான குறைந்தபட்ச வினைச்சொல் சேர்க்கப்பட்டுள்ளது; ஆண்பால் பன்மையும் காக்கப்படுகிறது.
- source_word: שִׁמְרִי
  choice: சிம்ரி
  rationale: தனிப்பெயர் என்பதால் தமிழ் ஒலிபெயர்ப்பாக வழங்கப்பட்டுள்ளது.
- source_word: הָרֹאשׁ
  choice: தலைவன்
  rationale: רֹאשׁ இங்கு உடல் உறுப்பைக் குறிக்காமல் குடும்பக் குழுவிலான முதன்மை அல்லது தலைமைப் பதவியைக் குறிக்கிறது.
- source_word: כִּי לֹא הָיָה בְכוֹר
  choice: அவன் முதற்பேறானவன் அல்லாதிருந்தும்
  rationale: சிம்ரி முதற்பேறானவன் அல்லாத நிலையிலும் தலைவனாக்கப்பட்டான் என்ற முரண்பாட்டை முதன்மை வாசிப்பாக வெளிப்படுத்துகிறது; כִּי என்பதன் விளக்கவுரைச் சாத்தியம் அடிக்குறிப்பில் காக்கப்பட்டுள்ளது.
- source_word: בְכוֹר
  choice: முதற்பேறானவன்
  rationale: பிறப்பு வரிசையில் முதலில் பிறந்த ஆண் மகனைக் குறிக்கும் சொல்லுக்கு சூழலுக்கேற்ற துல்லியமான தமிழ் வடிவம்.
- source_word: וַיְשִׂימֵהוּ אָבִיהוּ לְרֹאשׁ
  choice: அவனுடைய தந்தை அவனைத் தலைவனாக நியமித்தார்
  rationale: שׂים + לְ இங்கு ஒருவரை ஒரு பதவியில் அமர்த்துதல் அல்லது நியமித்தல் என்ற பொருளைக் கொண்டது; ‘தலைவன்’ என்பதை மீண்டும் பயன்படுத்துவது மூலத்தின் சொல் தொடர்பைக் காக்கிறது.
