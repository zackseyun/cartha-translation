translation_notes:
  register: நவீன நிலையான தமிழில், வம்சப்பட்டியல் நடைக்கு ஏற்ற சுருக்கமான மற்றும் கண்ணியமான மொழிநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் உள்ள பெயர்ச்சொல் மைய அமைப்பு தமிழில் இயல்பாக அமைய குறைந்தபட்ச வினைச்சொற்கள் சேர்க்கப்பட்டுள்ளன; எபிரெய இணைப்புச்சொல்லின் உண்மையான இருபொருள் சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
