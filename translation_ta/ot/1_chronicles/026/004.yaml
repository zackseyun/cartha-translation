base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/004.yaml
  text: 'And Obed-edom had sons: Shemaiah the firstborn[a], Jehozabad the second, Joah the third, and Sakar the fourth[b], and Nethanel the fifth.'
translation:
  language: ta
  text: ஓபேத்-ஏதோமுக்கும் மகன்கள் இருந்தனர்:[a] முதற்பேறானவன் செமாயா, இரண்டாமவன் யெகோசபாத், மூன்றாமவன் யோவாக், நான்காமவன் சாகார்,[b] ஐந்தாமவன் நெதனெயேல்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்சொல்லாக, “ஓபேத்-ஏதோமுக்கு மகன்கள்.” வம்சவரலாற்றுச் சொல்லமைப்பை இயல்பான தமிழில் தெரிவிக்க “இருந்தனர்” சேர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: இங்கு வரும் “சாகார்” என்ற பெயரின் எபிரெய வடிவம் “இசக்கார்” என்ற பெயரிலிருந்து வேறுபட்டது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/עֹבֵד אֱדֹם בָּנִים
  choice: ஓபேத்-ஏதோமுக்கு மகன்கள் இருந்தார்கள்
  rationale: எபிரெய மொழியில் சொற்சொல்லாக ‘ஓபேத்-ஏதோமுக்கு மகன்கள்’ என்ற வினைச்சொல் விடுபட்ட வம்சவரலாற்றுச் சூத்திரம் உள்ளது. இயல்பான நவீனத் தமிழுக்காக ‘இருந்தார்கள்’ சேர்க்கப்படுகிறது; לְ என்பதன் பொருள் ‘-க்கு’ என்பதால் காக்கப்படுகிறது.
- source_word: שְׁמַעְיָה הַבְּכוֹר
  choice: முதற்பேறான செமாயா
  rationale: בְּכוֹר என்பது வெறுமனே ‘முதலாவது’ என்ற வரிசை எண்ணைக் காட்டாமல், குடும்பத்தில் ‘முதற்பேறானவன்’ என்ற நிலையையும் குறிக்கிறது.
- source_word: יְהוֹזָבָד הַשֵּׁנִי
  choice: இரண்டாவது யெகோசபாத்
  rationale: பெயர் எபிரெய வடிவுக்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டு, பிறப்பு வரிசை நேரடியாகத் தரப்படுகிறது.
- source_word: יוֹאָח הַשְּׁלִשִׁי
  choice: மூன்றாவது யோவாக்
  rationale: יוֹאָח என்ற எபிரெயப் பெயரின் இறுதி மெய்யொலியைத் தமிழில் ‘க்’ கொண்டு பிரதிபலித்து, வரிசை நேரடியாக மொழிபெயர்க்கப்படுகிறது.
- source_word: וְשָׂכָר הָרְבִיעִי
  choice: நான்காவது சாகார்
  rationale: இங்குள்ள שָׂכָר என்ற பெயர் அதன் எபிரெய வடிவின்படி ‘சாகார்’ என ஒலிபெயர்க்கப்படுகிறது; இது ‘இசக்கார்’ என்ற பெயரல்ல.
- source_word: וּנְתַנְאֵל הַחֲמִישִׁי
  choice: ஐந்தாவது நெதனெயேல்
  rationale: נְתַנְאֵל என்ற எபிரெய வடிவிலிருந்து நேரடியாக ஒலிபெயர்க்கப்பட்டு, ஐந்தாவது என்ற வரிசையும் தெளிவாகக் காக்கப்படுகிறது.
