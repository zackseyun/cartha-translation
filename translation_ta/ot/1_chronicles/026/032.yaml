base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/032.yaml
  text: And his brothers[a], valiant men, were two thousand seven hundred heads of fathers’ houses; and King David appointed them over the Reubenites, the Gadites, and the half-tribe of Manasseh for every matter of God and of the king.
translation:
  language: ta
  text: அவனுடைய சகோதரர்கள்[அ], திறமைவாய்ந்த ஆண்களான 2,700 தந்தைவழிக் குடும்பத் தலைவர்கள் இருந்தார்கள்; தாவீது அரசன் அவர்களை ரூபேனியர், காதியர், மனாசேயின் அரைக் கோத்திரத்தார் ஆகியோர்மேல், கடவுளுக்குரிய ஒவ்வொரு காரியத்திற்கும் அரசனுக்குரிய ஒவ்வொரு காரியத்திற்கும் பொறுப்பாளர்களாக நியமித்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: அ
    text: அல்லது, “உறவினர்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶחָיו
  choice: அவனுடைய சகோதரர்கள்
  rationale: முந்தைய வசனத்தில் வரும் அசபியாவை உருபுப் பின்னொட்டு சுட்டுகிறது. ஆண்பால் பன்மையான அחים என்பதன் நேரடியான பொருளைத் தக்கவைக்கிறது.
- source_word: בְּנֵי חַיִל
  choice: திறமைவாய்ந்த ஆண்கள்
  rationale: நிர்வாகத் தலைமைச் சூழலில் இச்சொற்றொடர் வலிமையோடு திறனையும் தகுதியையும் குறிக்கலாம்; போர்வீரம் மட்டும் என்று சுருக்காமல் சூழலுக்கேற்ற பொருளை அளிக்கிறது.
- source_word: אַלְפַּיִם וּשְׁבַע מֵאוֹת
  choice: 2,700 பேர்
  rationale: எண்ணிக்கையை இயல்பான நவீன தமிழ் வடிவில் நேரடியாக அளிக்கிறது.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: தந்தைவழிக் குடும்பங்களின் தலைவர்கள்
  rationale: குலம் அல்லது மூதாதையர் குடும்பத்தை அடிப்படையாகக் கொண்ட நிர்வாகத் தலைவர்களைக் குறிக்கும் எபிரெயத் தொழில்நுட்பச் சொல்லை புரியத்தக்க வகையில் வழங்குகிறது.
- source_word: וַיַּפְקִידֵם
  choice: அவர்களை நியமித்தான்
  rationale: ஹிப்இல் வடிவம் பொறுப்பு அல்லது மேற்பார்வைப் பதவியில் அமர்த்துவதைச் சுட்டுகிறது.
- source_word: עַל
  choice: மேல்
  rationale: பட்டியலிடப்பட்ட கோத்திரங்கள்மீதான நிர்வாக அதிகாரத்தையும் பொறுப்பையும் நேரடியாகத் தெரிவிக்கிறது.
- source_word: הָראוּבֵנִי וְהַגָּדִי וַחֲצִי שֵׁבֶט הַמְנַשִּׁי
  choice: ரூபேனியர், காதியர், மனாசேயின் அரைக் கோத்திரத்தார்
  rationale: எபிரெயத்தில் ஒருமை இனப்பெயர்கள் இருந்தாலும், மக்களைத் தொகுப்பாகக் குறிக்கும் இயல்பான தமிழ்ப் பன்மையைப் பயன்படுத்துகிறது.
- source_word: לְכָל דְּבַר הָאֱלֹהִים וּדְבַר הַמֶּלֶךְ
  choice: கடவுளுக்குரிய எல்லாக் காரியங்களையும் அரசனுக்குரிய காரியங்களையும் கவனிப்பதற்காக
  rationale: דבר என்பதன் ‘காரியம்/விவகாரம்’ என்ற பரந்த பொருளையும், கடவுளுக்குரிய மற்றும் அரசனுக்குரிய பொறுப்புகள் என்ற இணையான இரு தளங்களையும் இயல்பான தமிழில் காக்கிறது.
theological_decisions:
- issue: கடவுளுக்குரிய மற்றும் அரசனுக்குரிய நிர்வாகப் பொறுப்புகளின் வரம்பு
  choice: இரண்டு தனித்த பொறுப்புத் தளங்களையும் இணையாகக் குறிப்பிடுதல்
  alternative: ‘கடவுளின் பணியும் அரசனின் சேவையும்’ என்று குறிப்பான சமய-அரசுப் பணிகளாக விளக்குதல்
  rationale: எபிரெய உரை இரண்டு தளங்களை வேறுபடுத்துகிறது; ஆனால் அவற்றின் துல்லியமான செயல்பாடுகளையோ படிநிலையையோ வரையறுப்பதில்லை. ஆகவே பிற்கால சமய-அரசு வகைப்பாடுகளைச் சேர்க்காமல் அதன் பொதுமையைக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; மரியாதைமிக்க, பொதுவாசகர்களுக்குப் புரியும் நடை. நீண்ட எபிரெய வாக்கியம் இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது. ‘திறமைவாய்ந்த ஆண்கள்’ என்பது போர்வீரத் தன்மையை மட்டும் வலியுறுத்தாமல் நிர்வாகச் சூழலை பிரதிபலிக்கிறது.
