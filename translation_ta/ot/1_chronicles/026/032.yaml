revisions:
- from: அவனுடைய சகோதரர்கள்—திறமைவாய்ந்த ஆண்கள்—2,700 பேர்; அவர்கள் தந்தைவழிக் குடும்பங்களின் தலைவர்கள். கடவுளுக்குரிய எல்லாக் காரியங்களையும் அரசனுக்குரிய காரியங்களையும் கவனிப்பதற்காக ரூபேனியர், காதியர், மனாசேயின் அரைக் கோத்திரத்தார் ஆகியோர்மேல் தாவீது அரசன் அவர்களை நியமித்தான்.
  to: அவனுடைய சகோதரர்கள்[அ], திறமைவாய்ந்த ஆண்களான 2,700 தந்தைவழிக் குடும்பத் தலைவர்கள் இருந்தார்கள்; தாவீது அரசன் அவர்களை ரூபேனியர், காதியர், மனாசேயின் அரைக் கோத்திரத்தார் ஆகியோர்மேல், கடவுளுக்குரிய ஒவ்வொரு காரியத்திற்கும் அரசனுக்குரிய ஒவ்வொரு காரியத்திற்கும் பொறுப்பாளர்களாக நியமித்தான்.
  rationale: The revision joins the number and the office into one expression, more closely reflecting “2,700 heads of fathers’ houses.” It retains the administrative scope over the named tribal groups and explicitly distributes “every matter” across both the divine and royal spheres. A footnote preserves the documented broader kinship sense of “brothers.”
