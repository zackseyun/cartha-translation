base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/021.yaml
  text: 'The sons of Ladan[b][a], the sons of the Gershonite belonging to Ladan: the heads of the fathers’ houses belonging to Ladan the Gershonite were Jehieli.'
translation:
  language: ta
  text: 'லாதானின் மகன்கள்[a], கெர்சோனியனான லாதானின் மகன்கள்; கெர்சோனியனான லாதானின் தந்தைவழிக் குடும்பங்களின் தலைவர்கள்[b]: யெகியேலி.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: வம்சப்பட்டியல் சூழலில் “மகன்கள்” என்பது “வழிவந்தவர்கள்” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: “தந்தைவழிக் குடும்பங்கள்” என்பது மூதாதையரை அடிப்படையாகக் கொண்ட குடும்பப் பிரிவுகள் அல்லது குலங்களைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: எபிரெயக் கட்டுநிலைப் பன்மையின் நேரடியான பொருளைத் தக்கவைக்கிறது; வம்சப்பட்டியல் சூழலில் இது பரந்த பொருளில் வழிவந்தவர்களையும் குறிக்கலாம் என்பதால் அடிக்குறிப்பு தரப்பட்டுள்ளது.
- source_word: לַעְדָּן
  choice: லாதான்
  rationale: எபிரெயப் பெயரின் ஒலிப்பை நவீன தமிழில் இயல்பாக எழுத்துப்பெயர்க்கிறது.
- source_word: הַגֵּרְשֻׁנִּי
  choice: கெர்சோனியர் / கெர்சோனியனான
  rationale: கெர்சோன் குலத்தைச் சேர்ந்தவர் என்ற இனக்குழு அல்லது குலச் சார்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: לְלַעְדָּן
  choice: லாதானைச் சேர்ந்த
  rationale: இங்குள்ள ל முன்னொட்டு திசையையல்ல, வம்ச அல்லது குடும்பச் சார்பைக் குறிக்கிறது.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: தந்தைவழிக் குடும்பங்களின் தலைவர்கள்
  rationale: மூதாதையரை மையமாகக் கொண்ட விரிவான குடும்ப அலகுகளின் தலைவர்களைக் குறிக்கும் எபிரெய மரபுத்தொடரை புரியத்தக்க தமிழில் வழங்குகிறது.
- source_word: יְחִיאֵלִי
  choice: யெகியேலியர்
  rationale: வடிவம் ஒருவரைக் குறிக்கிறதா அல்லது யெகியேலி வம்சத்தாரைக் குறிக்கிறதா என்பதில் உள்ள சுருக்கமான வம்சப்பட்டியல் நடையின் தெளிவின்மையைத் தீர்க்காமல், மரியாதைப் பன்மை வடிவில் பெயரை எழுத்துப்பெயர்க்கிறது.
theological_decisions:
- issue: יְחִיאֵלִי என்பதன் எண்ணிக்கை மற்றும் குறிப்பு
  choice: “யெகியேலியர் ஆவர்” என்று வம்ச/குடும்பக் குழுவாகவும் வாசிக்க இடமளிக்கும் வடிவம்
  alternative: “யெகியேலி என்பவர்” என்று ஒரே நபராக மொழிபெயர்த்தல்
  rationale: רָאשֵׁי என்ற பன்மைச் சொல்லுக்குப் பின் வரும் பெயர்வடிவம் உரையில் சுருக்கமாக உள்ளது. ஒரே நபர் எனத் திட்டவட்டமாக்காமல், மூலத்தின் இலக்கண இழுபறியை ஓரளவு தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், நாளாகமத்தின் வம்சப்பட்டியல் நடையைத் தக்கவைக்கும் கண்ணியமான மொழிநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய உரையின் மீளுரையும் சுருக்கமான தொடரமைப்பும் வாசிப்புத் தெளிவுக்காக கோடுகளால் பிரிக்கப்பட்டுள்ளன; பெயர்களும் குலச் சார்பும் மூலத்துக்கு நெருக்கமாக வைக்கப்பட்டுள்ளன.
