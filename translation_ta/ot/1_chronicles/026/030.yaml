source:
  edition: WLC
  text: לַֽ/חֶבְרוֹנִ֡י חֲשַׁבְיָהוּ֩ וְ/אֶחָ֨י/ו בְּנֵי חַ֜יִל אֶ֣לֶף וּ/שְׁבַע מֵא֗וֹת עַ֚ל פְּקֻדַּ֣ת יִשְׂרָאֵ֔ל מֵ/עֵ֥בֶר לַ/יַּרְדֵּ֖ן מַעְרָ֑בָ/ה לְ/כֹל֙ מְלֶ֣אכֶת יְהוָ֔ה וְ/לַ/עֲבֹדַ֖ת הַ/מֶּֽלֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/030.yaml
  text: 'For the Hebronites: Hashabiah and his brothers[a], 1,700 capable men, were in charge of the oversight of Israel west of the Jordan, for all the work of the LORD and for the service of the king.'
translation:
  language: ta
  text: எப்ரோனியர்களில் அசபியாவும் அவரது சகோதரர்களுமாகிய 1,700 திறமையானவர்கள், யோர்தானுக்கு மேற்கே[a] இஸ்ரவேலரின் மேற்பார்வைப் பொறுப்பில் இருந்தார்கள்; ஆண்டவருடைய எல்லாப் பணிகளுக்கும் அரசனுக்குரிய சேவைக்கும் அவர்கள் பொறுப்பாளர்களாக இருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “யோர்தானுக்கு அப்பால், மேற்கே”; அதாவது, யோர்தானின் மேற்குப் பகுதியில்.
    reason: மூலச் சொல்லாட்சியையும் அதன் சூழல்சார் இடப்பொருளையும் காட்டும் சொற்பொருள் மாற்று.
lexical_decisions:
- source_word: לַחֶבְרוֹנִי
  choice: எப்ரோனியரில்
  rationale: இச்சூழலில் இது தனி நபரை அல்ல, எப்ரோனிய லேவியக் குலத்தினரைக் குறிக்கிறது; நிர்வாகப் பட்டியலின் தொடரை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: חֲשַׁבְיָהוּ
  choice: அசபியா
  rationale: எபிரெயத் தனிப்பெயரின் தமிழில் வழக்கமான ஒலிபெயர்ப்பு.
- source_word: וְאֶחָיו
  choice: அவனுடைய சகோதரர்கள்
  rationale: சொல்லின் நேரடியான குடும்பப் பொருளைப் பேணுகிறது; குலச் சூழலில் இது நெருங்கிய உறவினர்களையும் உள்ளடக்கக்கூடும்.
- source_word: בְּנֵי חַיִל
  choice: திறமைவாய்ந்த ... பேர்
  rationale: இங்கு போர்த்திறனைவிட நிர்வாகப் பணிக்கான ஆற்றலும் தகுதியும் முன்னிலையில் உள்ளதால், செயல்திறனைக் காட்டும் இயல்பான சொல்லாட்சி தேர்ந்தெடுக்கப்பட்டது.
- source_word: אֶלֶף וּשְׁבַע מֵאוֹת
  choice: 1,700
  rationale: எண்ணிக்கை நவீன தமிழ் வாசிப்புக்கு ஏற்ற இலக்க வடிவில் தரப்பட்டது.
- source_word: עַל פְּקֻדַּת יִשְׂרָאֵל
  choice: இஸ்ரவேலரைக் கண்காணிக்கும் பொறுப்பில்
  rationale: פְּקֻדָּה என்பதிலுள்ள மேற்பார்வை, பொறுப்பு, நிர்வாகக் கண்காணிப்பு ஆகிய நுணுக்கங்களை இச்சொற்றொடர் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מֵעֵבֶר לַיַּרְדֵּן מַעְרָבָה
  choice: யோர்தானுக்கு மேற்கே
  rationale: சொல்லுக்கு நெருக்கமான வடிவம் ‘யோர்தானுக்கு அப்பால், மேற்கே’ என்றாலும், குறிக்கப்படும் யோர்தானின் மேற்குப் பகுதியை நவீன தமிழில் தெளிவாகக் கூறுகிறது.
- source_word: לְכֹל מְלֶאכֶת יְהוָה
  choice: ஆண்டவருடைய எல்லாப் பணிகளையும்
  rationale: מְלָאכָה என்பதன் பரந்த ‘பணி/வேலை’ பொருளையும் இறைச் சேவை சார்ந்த நிர்வாகச் சூழலையும் பேணுகிறது.
- source_word: יְהוָה
  choice: ஆண்டவர்
  rationale: எபிரெய வேதாகமத்தின் நான்கெழுத்து இறைப் பெயரை, தமிழ் வேதாகம நடையில் புரிந்துகொள்ளத்தக்க மரியாதைத் தலைப்பால் வழங்குகிறது.
- source_word: וְלַעֲבֹדַת הַמֶּלֶךְ
  choice: அரசனுக்குரிய சேவையையும்
  rationale: עֲבֹדָה என்பதன் சேவை அல்லது கடமை என்ற பொருளைத் தக்கவைத்து, இறைவனுடைய பணிகளிலிருந்து அரசருக்குரிய கடமையை வேறுபடுத்துகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரைத் தமிழில் வழங்குதல்
  choice: ஆண்டவர்
  alternative: யாவே
  rationale: மூலத்தில் இறைவனின் தனிப்பெயர் இருப்பதை ஏற்றுக்கொண்டபோதிலும், திட்டத்தின் LORD மரபுக்கும் இயல்பான நவீன தமிழ் வேதாகம நடைக்கும் ஏற்ப ‘ஆண்டவர்’ பயன்படுத்தப்பட்டது; ‘யாவே’ என்பது பெயரின் நேரடி ஒலிபெயர்ப்பு மாற்றாகும்.
- issue: இறைப் பணியும் அரச சேவையும் இடையிலான உறவு
  choice: இரண்டையும் தனித்தனியான பொறுப்புகளாகப் பேணுதல்
  alternative: இரண்டையும் ஒரே பொதுநிர்வாகப் பணியாக இணைத்தல்
  rationale: மூலத்தில் உள்ள לְכֹל ... וְלַעֲבֹדַת என்ற இணை அமைப்பு, இறைவனுக்குரிய பணிகளையும் அரசனுக்குரிய சேவையையும் வேறுபட்டும் தொடர்புடையவையாகவும் காட்டுகிறது.
translation_notes:
  register: நவீன பொதுத் தமிழில், மரியாதையும் வேதாகம வரலாற்றுப் பட்டியலுக்குரிய செம்மையும் பேணப்பட்டுள்ளன. நீண்ட எபிரெய வாக்கியம் வாசிப்புத் தெளிவுக்காக இரண்டு தமிழ் வாக்கியங்களாக அமைக்கப்பட்டது; இரண்டாவது வாக்கியம் நோக்கத்தைக் குறிப்பிடும் மூலச் சொற்றொடரின் பொருளைத் தெளிவாக்குகிறது.
