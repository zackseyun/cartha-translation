  rationale: குழுப்பெயரின் தமிழ் அமைப்பும் அசபியா, அவரது சகோதரர்கள், 1,700 திறமையானவர்கள் ஆகியோரின் தொடர்பும் தெளிவாக்கப்பட்டன. மூலத்தில் உள்ள மேற்பார்வைப் பொறுப்பு மற்றும் அதற்குரிய ஆண்டவரின் பணி, அரசனின் சேவை என்ற இரட்டை நோக்கமும் ஒரே வாக்கியத் தொடரில் நேரடியாகப் பேணப்பட்டன. இடப்பொருளுக்கான அடிக்குறிப்பு அதன் சரியான சொல்லிடத்தில் தக்கவைக்கப்பட்டுள்ளது.
