translation_notes:
  register: நவீன செந்தமிழ் நடையில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான மொழி பயன்படுத்தப்பட்டுள்ளது. எபிரெய வசனத்தின் பட்டியல் அமைப்பும், כֹּל הַמַּקְדִּישׁ என்ற மீள்தொகுக்கும் பொதுப்படுத்தலும் கோடுகளுக்கிடையிலான தொடரால் பாதுகாக்கப்பட்டுள்ளன. רֹאֶה என்ற குறிப்பிட்ட பழைய பட்டம் ‘தீர்க்கதரிசி’ என்று பொதுமைப்படுத்தப்படாமல் ‘தரிசனக்காரர்’ என வழங்கப்பட்டு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
