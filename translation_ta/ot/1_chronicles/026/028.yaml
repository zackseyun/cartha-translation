  source_fidelity: மூல எபிரெயத்தின் பட்டியல், அர்ப்பணிப்புப் பொருட்களைச் சுட்டும் முழுமைப் பொருள், ரֹאֶה என்ற தனிப்பட்ட பட்டம், மற்றும் செலோமித்துக்கும் அவன் சகோதரர்களுக்கும் இருந்த நிர்வாகப் பொறுப்பு ஆகியவை வரைவு மொழிபெயர்ப்பில் பெரும்பாலும் துல்லியமாக உள்ளன. ஆனால் ‘செலோமித்தும் அவன் சகோதரர்களும் வகித்த பொறுப்பில்’ என்பது தமிழில் இயல்பற்றது; அவர்கள் பொறுப்பு ஏற்றிருந்த பொருட்களைக் குறிக்கும் மூலத்தின் நிர்வாகப் பொருளைத் தெளிவாகத் தர வேண்டும்.
  naturalness: பெயர்ப்பட்டியல் மற்றும் கோடுகளுக்கிடையிலான மீள்தொகுப்பு நன்றாக அமைந்துள்ளன. எனினும் இறுதிப் பொறுப்பு-தொடரை ‘செலோமித்துக்கும் அவன் சகோதரர்களுக்கும் பொறுப்பாக இருந்தன’ என மாற்றுவது நவீன நிலையான தமிழில் நேரடியும் இயல்பும் ஆகும். அடிக்குறிப்பு அ-வின் விளக்கமும் மேலும் இயல்பான சொற்களால் செம்மைப்படுத்தப்பட்டுள்ளது.
  terminology: ‘தரிசனக்காரர்’ ரֹאֶה என்ற பழைய, குறிப்பான பட்ட வேறுபாட்டைப் பாதுகாக்கிறது; அதை ‘தீர்க்கதரிசி’ எனப் பொதுமைப்படுத்தவில்லை. தனிப்பெயர்களின் எழுத்துப்பெயர்ப்பும் தொடர்ந்து ஒரே முறையில் உள்ளது. ‘அர்ப்பணித்த’ என்பது הִקְדִּישׁ என்பதற்கும் இச்சூழலுக்கும் பொருத்தமானது.
