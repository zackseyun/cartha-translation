base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/028.yaml
  text: And all that Samuel the seer[a], Saul son of Kish, Abner son of Ner[b], and Joab son of Zeruiah had dedicated—everything that anyone had dedicated—was under the care of Shelomith and his brothers.
translation:
  language: ta
  text: தரிசனக்காரரான[a] சாமுவேல், கீசின் மகன் சவுல், நேரின் மகன் அப்னேர், செருயாவின் மகன் யோவாப் ஆகியோர் அர்ப்பணித்த அனைத்தும்—எவரும் அர்ப்பணித்த அனைத்தும்—செலோமித்துக்கும் அவன் சகோதரர்களுக்கும் பொறுப்பாக இருந்தன.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தரிசனக்காரர்’ என்பது எபிரெய மொழியின் רֹאֶה என்ற பட்டம்; தீர்க்கதரிசனத்துடன் தொடர்புடைய ஒருவரைக் குறிக்கும் பழைய சொல்.
    reason: cultural_note
  - marker: b
    text: அல்லது, ‘செலோமித்தும் அவன் சகோதரர்களும் மேற்பார்வையிட்டனர்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל
  choice: அனைத்தும்
  rationale: சூழலில் அர்ப்பணிக்கப்பட்ட பொருட்கள் முழுவதையும் குறிக்கும் כֹּל என்பதன் தொகுப்புப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: הַהִקְדִּישׁ
  choice: அர்ப்பணித்த
  rationale: קדשׁ என்பதன் ஹிஃபில் வடிவம் பொருட்களைப் புனிதப் பயன்பாட்டுக்காக ஒதுக்கி வழங்குவதைக் குறிக்கிறது; கருவூலச் சூழலில் ‘அர்ப்பணித்த’ என்பது தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: שְׁמוּאֵל הָרֹאֶה
  choice: தரிசனக்காரரான சாமுவேல்
  rationale: רֹאֶה என்பது தீர்க்கதரிசனப் பணியுடன் தொடர்புடைய பழைய தனிப்பட்ட பட்டம்; பொதுவான ‘தீர்க்கதரிசி’ என்று ஒத்திசைக்காமல் மூலத்தின் சொல்லை வேறுபடுத்திக் காட்டுகிறது.
- source_word: בֶּן
  choice: மகன்
  rationale: இங்கு வரும் நேரடியான வம்ச உறவுச் சூத்திரத்தை இயல்பான தமிழில் துல்லியமாகக் காட்டுகிறது.
- source_word: צְרוּיָה
  choice: செருயா
  rationale: எபிரெயத் தனிப்பெயரின் ஒலிப்பைத் தமிழில் இயன்றவரை பாதுகாக்கும் எழுத்துப்பெயர்ப்பு.
- source_word: כֹּל הַמַּקְדִּישׁ
  choice: எவர் அர்ப்பணித்திருந்தாலும், அர்ப்பணிக்கப்பட்ட அனைத்தும்
  rationale: தொகுப்புப் பொருளில் வரும் ஒருமைப் பங்கேற்பு வடிவத்தின் பொதுப்படுத்தும் தன்மையையும், முன் பட்டியலிடப்பட்ட அர்ப்பணிப்புகளை மீண்டும் தொகுக்கும் பணியையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: עַל יַד
  choice: வகித்த பொறுப்பில்
  rationale: நிர்வாகச் சூழலில் இந்த மரபுத்தொடர் மேற்பார்வை அல்லது பொறுப்பைக் குறிக்கிறது; சொல்லுக்குச் சொல் ‘கையின்மேல்’ என்று மொழிபெயர்ப்பதைவிட இத்தேர்வு பொருளைத் தெளிவாக்குகிறது.
- source_word: שְׁלֹמִית
  choice: செலோமித்
  rationale: எபிரெயத் தனிப்பெயரின் ஒலிப்பை அடிப்படையாகக் கொண்ட எழுத்துப்பெயர்ப்பு.
- source_word: וְאֶחָיו
  choice: அவன் சகோதரர்களும்
  rationale: மூன்றாம் நபர் ஆண்பால் ஒருமை உடைமை விகுதியுடன் வரும் பன்மைச் சொல், செலோமித்தின் சகோதரர்களை அல்லது நெருங்கிய ஆண் உறவினர்களைக் குறிக்கலாம்; நேரடியான பொருளாக ‘சகோதரர்கள்’ தேர்ந்தெடுக்கப்பட்டது.
