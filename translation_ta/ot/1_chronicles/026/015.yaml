  text: To Obed-edom[a], the south; and to his sons, the house of stores.
translation:
  language: ta
  text: ஓபேத்-ஏதோமுக்குத் தெற்குப் பக்கம்; அவன் மகன்களுக்குச் சேமிப்பிடங்களின் கட்டிடம்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சேமிப்புக் கிடங்கு” அல்லது “சேகரிப்புகளின் கட்டிடம்.” எபிரெயச் சொல் சேமித்து வைக்கப்பட்ட பொருட்கள் அல்லது அவற்றுக்கான சேமிப்பிடங்களைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעֹבֵד אֱדֹם
  choice: ஓபேத்-ஏதோமுக்கு
  rationale: சூழலில் לְ என்பது சீட்டுப்போட்டு வழங்கப்பட்ட பொறுப்பை அல்லது பகுதியைக் குறிக்கிறது; சுருக்கமான எபிரெய ஒதுக்கீட்டு நடையைத் தமிழிலும் தக்கவைக்கிறது.
- source_word: נֶגְבָּה
  choice: தெற்குப் பகுதி
  rationale: திசையைக் குறிக்கும் இறுதியுடன் வந்துள்ள இச்சொல், இங்கு ஆலயத்தின் தெற்குப் பக்கத்தைக் குறிக்கிறது.
- source_word: וּלְבָנָיו
  choice: அவன் மகன்களுக்கு
  rationale: ஓபேத்-ஏதோமின் மகன்களுக்கு வழங்கப்பட்ட தனி ஒதுக்கீட்டை நேரடியாகக் குறிக்கிறது.
- source_word: בֵּית הָאֲסֻפִּים
  choice: களஞ்சியக் கட்டிடம்
  rationale: בֵּית என்பது கட்டிடத்தைச் சுட்டுகிறது; אסף (‘சேர்த்தல்’) வேரிலிருந்து வந்த הָאֲסֻפִּים சேகரித்த பொருட்களை வைத்திருக்கும் சேமிப்பிடத்தைக் குறிக்கிறது. ‘களஞ்சியக் கட்டிடம்’ என்பது கட்டிடத்தையும் அதன் பயன்பாட்டையும் இயல்பான தமிழில் தெரிவிக்கிறது.
