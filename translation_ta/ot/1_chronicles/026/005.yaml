  source_fidelity: மூல எபிரேயப் பட்டியல் அமைப்பும் பெயர்களும் வரிசை எண்களும் துல்லியமாகக் காக்கப்பட்டுள்ளன. ‘ஏனெனில்’ என்பது כִּי-யின் விளக்க/காரணப் பொருளைச் சரியாகத் தருகிறது; ‘அவனை’ என்ற சுட்டுப்பெயர் மூலத்தில் உள்ள தெளிவின்மையைப் பாதுகாக்கிறது. ‘ஆசீர்வதித்திருந்தார்’ என்பது சாத்தியமான சூழல்சார் நிறைவிறந்தகால வெளிப்பாடு; அடிக்குறிப்பு எளிய இறந்தகால மாற்றையும் சரியாகக் குறிக்கிறது.
