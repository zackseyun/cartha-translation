base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/005.yaml
  text: Ammiel the sixth[a], Issachar the seventh, Peullethai the eighth; for God had blessed him.
translation:
  language: ta
  text: ஆறாவது மகன் அம்மியேல், ஏழாவது மகன் இசக்கார், எட்டாவது மகன் பெவுல்லெத்தாய்; ஏனெனில் கடவுள் அவனை ஆசீர்வதித்திருந்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஏனெனில் கடவுள் அவனை ஆசீர்வதித்தார்.” எபிரேய இணைப்புச் சொல்லையும் வினையையும் இவ்வாறு எளிய இறந்தகாலத்தில் நேரடியாக மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמִּיאֵל
  choice: அம்மியேல்
  rationale: தனிநபரின் பெயர்; எபிரேய ஒலிப்புக்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: הַשִּׁשִּׁי
  choice: ஆறாவது மகன்
  rationale: குறிப்பிட்ட வரிசை எண்ணைத் தருகிறது; சூழலில் மகன்களின் பட்டியல் என்பதால் இயல்பான தமிழுக்காக ‘மகன்’ வெளிப்படையாகச் சேர்க்கப்பட்டது.
- source_word: יִשָׂשכָר
  choice: இசக்கார்
  rationale: இங்கு கோத்திரப் பெயராக அல்லாமல் தனிநபரின் பெயராக வருகிறது; வழக்கமான தமிழ் வேதாகம ஒலிபெயர்ப்பு காக்கப்பட்டது.
- source_word: הַשְּׁבִיעִי
  choice: ஏழாவது மகன்
  rationale: சுற்றியுள்ள பட்டியலின் இணை அமைப்பைப் பின்பற்றும் வரிசை எண்.
- source_word: פְּעֻלְּתַי
  choice: பெவுல்லெத்தாய்
  rationale: தனிநபரின் பெயர்; எபிரேய மெய்யெழுத்து இரட்டிப்பையும் உயிரொலியையும் இயன்றவரை பிரதிபலிக்கும் தமிழ் ஒலிபெயர்ப்பு.
- source_word: הַשְּׁמִינִי
  choice: எட்டாவது மகன்
  rationale: மகன்களின் வரிசையை நிறைவு செய்யும் வரிசை எண்.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: பல மகன்கள் பிறந்ததற்கான காரணத்தை அறிமுகப்படுத்தும் விளக்க இணைப்புச் சொல்.
- source_word: בֵרֲכוֹ
  choice: அவனை ஆசீர்வதித்திருந்தார்
  rationale: ברך வினையும் மூன்றாம் நபர் ஆண்பால் ஒருமை பின்னொட்டும் ‘அவனை ஆசீர்வதித்தார்’ எனப் பொருள்படும்; முந்தைய பட்டியலுக்குக் காரணமான முன்நிகழ்வைத் தமிழில் இயல்பாகக் காட்ட நிறைவிறந்தகால வடிவம் பயன்படுத்தப்பட்டது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: இங்கு ஒருமைப் பொருளில் இஸ்ரவேலின் கடவுளைக் குறிக்கும் பொதுப்பெயர்; நவீன நிலையான தமிழில் தெளிவான வடிவம்.
theological_decisions:
- issue: ‘அவனை’ என்பதன் குறிப்பு
  choice: உடனடிச் சூழலில் தந்தையாகக் குறிப்பிடப்படும் ஓபேத்-ஏதோமைச் சுட்டுகிறது.
  alternative: அவருடைய குடும்ப வழியைப் பொதுவாகச் சுட்டுவதாக எடுத்துக்கொள்ளலாம்.
  rationale: 1 நாளாகமம் 26:4–8 ஓபேத்-ஏதோமின் மகன்களையும் வழித்தோன்றல்களையும் பட்டியலிடுகிறது; அவர்களின் எண்ணிக்கைக்குக் கடவுள் அவரை ஆசீர்வதித்ததே காரணம் என இந்த விளக்கவுரை இயல்பாகக் கூறுகிறது. பெயரை வசனத்திற்குள் சேர்க்காமல், மூலத்தின் சுட்டுப்பெயர் வடிவம் காக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான, கண்ணியமான தமிழ். பட்டியல் தமிழில் தெளிவாக இருக்க ‘மகன்’ சேர்க்கப்பட்டுள்ளது; மூலத்தில் அது மறைமுகமாக உள்ளது. காரணவுரை மற்றும் சுட்டுப்பெயரின் இயல்பான தெளிவின்மை காக்கப்பட்டுள்ளன.
