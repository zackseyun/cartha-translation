base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/011.yaml
  text: Hilkiah the second[a], Tebaliah the third, Zechariah the fourth. All the sons and brothers of Hosah were thirteen.
translation:
  language: ta
  text: இல்க்கியா இரண்டாவது; தெபலியா மூன்றாவது; சகரியா நான்காவது. ஓசாவின் மகன்களும் சகோதரர்களும்[a] மொத்தம் பதின்மூன்று பேர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சகோதரர்கள்” என்பதற்குப் பதிலாக, ஓசாவின் குலத்தைச் சேர்ந்த ஆண் உறவினர்களை விரிவாகக் குறிக்கும் “உறவினர்கள்” என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: חִלְקִיָּהוּ
  choice: இல்க்கியா
  rationale: எபிரெயத் தனிப்பெயரின் ஒலியைத் தமிழில் இயன்றவரை இயல்பாக எழுத்துப்பெயர்த்துள்ளது.
- source_word: הַשֵּׁנִי
  choice: இரண்டாவது
  rationale: பட்டியலிலுள்ள வரிசைநிலையைக் குறிக்கும் பெயரடை; தமிழில் நேரடியான வரிசை எண்ணாக வழங்கப்பட்டுள்ளது.
- source_word: טְבַלְיָהוּ
  choice: தெபலியா
  rationale: எபிரெயத் தனிப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: הַשְּׁלִשִׁי
  choice: மூன்றாவது
  rationale: சுற்றியுள்ள பெயர்களுடன் இணையான வரிசை எண்ணாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: זְכַרְיָהוּ
  choice: சகரியா
  rationale: தமிழ் வேதாகம மரபில் பரவலாக அறியப்படும் பெயர் வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: הָרְבִעִי
  choice: நான்காவது
  rationale: பட்டியலின் வரிசைநிலையை நேரடியாகத் தெரிவிக்கிறது.
- source_word: כָּל
  choice: மொத்தம்
  rationale: குழுவின் முழு எண்ணிக்கையைச் சுருக்கிக் கூறும் இச்சூழலில் இயல்பான தமிழாக்கம்.
- source_word: בָּנִים
  choice: மகன்கள்
  rationale: எபிரெயச் சொல் ஆண் பிள்ளைகளையே குறிப்பதால் பாலினத் துல்லியம் காக்கப்பட்டுள்ளது.
- source_word: וְאַחִים
  choice: சகோதரர்கள்
  rationale: அடிப்படை உறவுப்பொருள் காக்கப்பட்டுள்ளது; குலப்பட்டியல் சூழலில் விரிந்த ஆண் உறவினர் என்ற பொருளும் இருக்கக்கூடும் என்பதால் அடிக்குறிப்பு தரப்பட்டுள்ளது.
- source_word: לְחֹסָה
  choice: ஓசாவின்
  rationale: உறவு அல்லது உடைமையைக் குறிக்கும் முன்னொட்டு தமிழில் இயல்பான ஆறாம் வேற்றுமை வடிவில் வழங்கப்பட்டுள்ளது.
- source_word: שְׁלֹשָׁה עָשָׂר
  choice: பதின்மூன்று பேர்
  rationale: மனிதர்களின் மொத்த எண்ணிக்கையைத் தமிழில் இயல்பாகக் குறிக்க ‘பேர்’ சேர்க்கப்பட்டுள்ளது.
