translation_notes:
  register: நவீனத் தரத் தமிழில், பட்டியல் நடையைச் சுருக்கமாகவும் கண்ணியமாகவும் காத்துள்ள மொழிபெயர்ப்பு. தனிப்பெயர்கள் தமிழ் வாசகர்களுக்கு வாசிக்க இயலுமாறு ஒலிபெயர்க்கப்பட்டுள்ளன; எபிரெய மூலத்தின் குடும்ப உறவுச் சொல்லிலுள்ள பொருள் விரிவை அடிக்குறிப்பு பாதுகாக்கிறது.
