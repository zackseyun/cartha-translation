base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/018.yaml
  text: 'For the Parbar on the west: four at the road[b][a], and two at the Parbar.'
translation:
  language: ta
  text: 'மேற்குப் பக்கத்திலுள்ள பர்பாருக்கு[a]: பாதையில்[b] நான்கு பேர்; பர்பாரில் இரண்டு பேர்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பர்பார்’ என்பதற்குப் ‘வளாகம்,’ ‘முற்றம்,’ ‘இணைப்புக் கட்டடம்’ அல்லது மரபாக ‘புறப்பகுதி’ என்றும் பொருள் கொள்ளலாம். இந்த அரிதான எபிரேயச் சொல் குறிக்கும் துல்லியமான கட்டடப் பகுதி உறுதியாகத் தெரியவில்லை.
    reason: lexical_alternative
  - marker: b
    text: அல்லது ‘உயர்த்தப்பட்ட சாலை,’ ‘பெருவழி.’
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּרְבָּר
  choice: பர்பார்
  rationale: இது அரிதாக வரும் எபிரேயச் சொல்; அது குறிக்கும் துல்லியமான கட்டடப் பகுதி உறுதியாகத் தெரியாததால், ஊகமான பொருளை முதன்மை உரையில் திணிக்காமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: מַעֲרָב
  choice: மேற்குப் பக்கம்
  rationale: மேற்குத் திசையையோ மேற்குப் பகுதியையோ குறிக்கும் சொல்லை இச்சூழலில் இயல்பான இடக்குறிப்பாக வழங்குகிறது.
- source_word: אַרְבָּעָה
  choice: நான்கு பேர்
  rationale: காவலர் பங்கீட்டுப் பட்டியலின் சூழலில் எண்ணிக்கை மனிதர்களைக் குறிக்கிறது; தமிழில் தெளிவுக்காக ‘பேர்’ சேர்க்கப்பட்டுள்ளது.
- source_word: מְסִלָּה
  choice: பாதை
  rationale: உயர்த்தப்பட்ட சாலை, பெருவழி அல்லது அணுகுபாதை எனப் பொருள்படக்கூடிய சொல்லுக்கு, தேவையற்ற கட்டடவியல் துல்லியத்தைத் தவிர்க்கும் இயல்பான பொதுச்சொல் தேர்ந்தெடுக்கப்பட்டுள்ளது.
- source_word: שְׁנַיִם
  choice: இரண்டு பேர்
  rationale: இரண்டாவது காவலர் பங்கீட்டின் எண்ணிக்கையைத் தெளிவாகக் காட்டுகிறது.
- source_word: לְ
  choice: -க்கு / -இல்
  rationale: திரும்பத் திரும்ப வரும் முன்னிடைச்சொல் இடவாரியான பங்கீட்டைச் சுட்டுகிறது; தமிழின் இயல்புக்கேற்ப வேற்றுமை உருபுகளால் மொழிபெயர்க்கப்பட்டுள்ளது.
