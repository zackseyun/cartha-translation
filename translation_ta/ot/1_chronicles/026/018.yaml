translation_notes:
  register: நவீன நிலையான தமிழில், பட்டியல் நடையின் சுருக்கத்தையும் கண்ணியத்தையும் காத்து மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தில் வெளிப்படையாக இல்லாத ‘காவலர்கள்’ என்ற சொல்லைச் சேர்க்காமல், எண்ணப்படும் நபர்கள் என்பதைத் தெளிவாக்க ‘பேர்’ மட்டும் சேர்க்கப்பட்டுள்ளது. அரிதான கட்டடவியல் சொல்லின் நிச்சயமின்மை முதன்மை உரையிலும் அடிக்குறிப்பிலும் பாதுகாக்கப்பட்டுள்ளது.
