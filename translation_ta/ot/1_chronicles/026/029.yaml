  register: நவீன நிலையான தமிழில், பட்டியல் வசனத்துக்கேற்ற சுருக்கமும் கண்ணியமும் காக்கப்பட்டுள்ளன. மூலத்தில் வெளிப்படையாக இல்லாத ‘ஆலயத்துக்கு வெளியே’ என்ற விளக்கம் முதன்மை உரையில் சேர்க்கப்படாமல் அடிக்குறிப்பில் மட்டும் வழங்கப்பட்டுள்ளது.
