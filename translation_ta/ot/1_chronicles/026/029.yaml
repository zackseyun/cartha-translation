base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/029.yaml
  text: For the Izharites[a], Chenaniah and his sons were assigned to the outside work over Israel, as officers and judges.
translation:
  language: ta
  text: இத்சாரியர் பிரிவுக்கு, கெனனியாவும் அவன் மகன்களும் இஸ்ரவேலின்மேல் அதிகாரிகளாகவும் நீதிபதிகளாகவும் வெளிப்புறப் பணிக்கு[a] நியமிக்கப்பட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வெளியில் செய்யும் பணி.’ இது மையப் பரிசுத்த இடத்தில் செய்யப்பட்ட சேவைக்கு வெளியேயான கடமைகளைக்—இஸ்ரவேலரிடையே மேற்கொள்ளப்பட்ட நிர்வாக மற்றும் நீதித்துறைப் பொறுப்புகளைக்—குறித்திருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַיִּצְהָרִי
  choice: இத்சாரியர்களில்
  rationale: முன்னொட்டு לְ இங்கு பட்டியலிலுள்ள குலப்பிரிவை அறிமுகப்படுத்துகிறது; தமிழ் பட்டியல் நடையில் ‘இத்சாரியர்களில்’ என்பது இயல்பாகவும் சுருக்கமாகவும் உள்ளது.
- source_word: כְּנַנְיָהוּ
  choice: கெனனியா
  rationale: எபிரெய தனிப்பெயர் மொழிபெயர்க்கப்படாமல், அதன் ஒலிக்கு நெருக்கமான நவீன தமிழ் வடிவில் எழுத்துப்பெயர்க்கப்பட்டுள்ளது.
- source_word: וּבָנָיו
  choice: அவனுடைய மகன்களும்
  rationale: בָּנִים இச்சூழலில் ஆண்பால் பன்மையாகவும் குடும்ப/வம்சப் பட்டியலைக் குறிக்கவும் வருவதால் ‘மகன்கள்’ எனத் துல்லியமாக மொழிபெயர்க்கப்பட்டது.
- source_word: לַמְּלָאכָה הַחִיצוֹנָה
  choice: வெளிப்புறப் பணிக்கு
  rationale: מְלָאכָה என்பது ஒதுக்கப்பட்ட வேலை அல்லது பணி; הַחִיצוֹנָה என்பது வெளியில் உள்ளதைச் சுட்டுகிறது. இவ்விரண்டையும் இயல்பாக இணைத்து, ஆலயத்தின் உட்புறச் சேவையிலிருந்து வேறான பணியென்ற திறந்த பொருளைத் தக்கவைக்கிறது.
- source_word: עַל יִשְׂרָאֵל
  choice: இஸ்ரவேலின்மேல்
  rationale: עַל நிர்வாகச் சூழலில் மேற்பார்வை அல்லது அதிகாரத்தை உணர்த்தலாம்; ‘இஸ்ரவேலின்மேல்’ அந்த உறவை விளக்கிக் குறுக்காமல் காக்கிறது.
- source_word: לְשֹׁטְרִים
  choice: அதிகாரிகளாக
  rationale: שֹׁטְרִים இங்கு காவல்துறையினரை அல்ல, நிர்வாக அலுவலர்களைக் குறிக்கிறது; ‘அதிகாரிகள்’ என்பது இச்சூழலுக்கு தெளிவான சொல்.
- source_word: וּלְשֹׁפְטִים
  choice: நீதிபதிகளாகவும்
  rationale: שֹׁפְטִים நீதித்தீர்ப்பு வழங்குவோரைக் குறிக்கிறது; ‘நீதிபதிகள்’ நேரடியான, பொதுவாகப் புரியும் மொழிபெயர்ப்பு.
