translation_notes:
  register: நவீன, தெளிவான, கண்ணியமான தமிழ் நடை. சீட்டுப் போடுதல் தொடர்பான எபிரெய உருவகங்களும் வினை வேறுபாடும் இயன்றவரை பாதுகாக்கப்பட்டுள்ளன. மூலத்தின் சற்றுக் கடினமான இரண்டாம் வாக்கிய அமைப்பு வாசிப்புத் தெளிவுக்காக இயல்பாக்கப்பட்டு, அதன் மாற்று அமைப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
