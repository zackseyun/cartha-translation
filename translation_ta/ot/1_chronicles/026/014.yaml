base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/014.yaml
  text: The lot for the east fell to Shelemyahu. Then they cast lots for his son Zekaryahu[a], a counselor with insight, and his lot came out for the north.
translation:
  language: ta
  text: கிழக்குப் பக்கத்திற்கான சீட்டு செலெமியாவுக்கு விழுந்தது. பின்பு, அவருடைய மகன் சகரியாவுக்காகவும் சீட்டுகளைப் போட்டார்கள். அவர் விவேகமுள்ள ஆலோசகர்; அவருடைய சீட்டு வடக்குப் பக்கத்திற்கு வந்தது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “விவேகத்தோடு ஆலோசனை வழங்குகிறவர்.” எபிரெயச் சொற்றொடர் சகரியாவை நுண்ணறிவு அல்லது விவேகத்துடன் ஆலோசனை வழங்குகிறவராக வருணிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֹּל הַגּוֹרָל
  choice: சீட்டு ... விழுந்தது
  rationale: נפל + גורל என்ற எபிரெய வழக்குச் சொல்லின் உருவகத்தை இயல்பான தமிழ் வேதாகம நடையில் தக்கவைக்கிறது.
- source_word: מִזְרָחָה / צָפוֹנָה
  choice: கிழக்குப் பக்கத்திற்கான / வடக்குப் பக்கத்திற்கு
  rationale: திசையைக் குறிக்கும் ה இங்கு வாசல் காவல் பொறுப்பு ஒதுக்கப்பட்ட திசையைக் காட்டுகிறது.
- source_word: לְשֶׁלֶמְיָהוּ
  choice: செலெமியாவுக்கு
  rationale: לְ பெறுநரைக் குறிக்கிறது; பெயர் எபிரெய வடிவத்திற்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: יוֹעֵץ בְּשֶׂכֶל
  choice: விவேகத்தோடு ஆலோசனை வழங்குகிற
  rationale: יוֹעֵץ என்பதன் செயற்பாட்டு தன்மையையும் בְּשֶׂכֶל என்பதன் விவேகம் அல்லது நுண்ணறிவு என்ற கருத்தையும் தனித்தனியாகப் பாதுகாக்கிறது.
- source_word: הִפִּילוּ גּוֹרָלוֹת
  choice: சீட்டுகளைப் போட்டார்கள்
  rationale: சீட்டுப் போட்டு தீர்மானிக்கும் செயலைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொற்றொடர்.
- source_word: וַיֵּצֵא גוֹרָלוֹ
  choice: அவருடைய சீட்டு ... வந்தது
  rationale: יצא உடன் வரும் גורל முடிவு வெளிப்பட்டது அல்லது வந்தது என்ற பொருளைத் தருகிறது; முன் வரும் ‘விழுந்தது’ என்பதிலிருந்து மூலத்தின் வினை வேறுபாட்டையும் காக்கிறது.
