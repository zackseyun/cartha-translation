id: 1CH.26.24
reference: 1 Chronicles 26:24
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וּ/שְׁבֻאֵל֙ בֶּן גֵּרְשׁ֣וֹם בֶּן מֹשֶׁ֔ה נָגִ֖יד עַל הָ/אֹצָרֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/024.yaml
  text: And Shebuel son of Gershom[a], son of Moses[b], was chief over the treasuries.
translation:
  language: ta
  text: மோசேயின் மகனான கெர்சோமின் மகன் செபுவேல், கருவூலங்களுக்குப் பொறுப்பான தலைவராக இருந்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கருவூலங்கள்’ என்பதற்கு ‘பண்டகசாலைகள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல், மதிப்புள்ள பொருட்கள் சேமிக்கப்படும் இடங்களையோ சேமித்து வைக்கப்பட்ட செல்வங்களையோ குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׁבֻאֵל
  choice: செபுவேல்
  rationale: வாவ் இணைப்பைத் தமிழில் தனியாக மொழிபெயர்த்தால் பட்டியல் நடையில் செயற்கையாகத் தோன்றும்; தொடர்ச்சியைச் சொற்றொடரமைப்பே காட்டுகிறது. பெயர் எபிரெய உச்சரிப்பை அணுகும் வகையில் ஒலிபெயர்க்கப்பட்டது.
- source_word: בֶּן גֵּרְשׁוֹם בֶּן מֹשֶׁה
  choice: மோசேயின் மகனான கெர்சோமின் மகன்
  rationale: இரண்டு בֶּן சொற்களும் காட்டும் நேரடி வம்ச உறவைப் பாதுகாத்து, தமிழில் இயல்பான வரிசையில் வம்சத் தொடர் அமைக்கப்பட்டது.
- source_word: נָגִיד עַל
  choice: பொறுப்பான தலைவர்
  rationale: נָגִיד அதிகாரத்தில் நியமிக்கப்பட்ட தலைவரைக் குறிக்கிறது; עַל இங்கு மேற்பார்வை அல்லது பொறுப்பைக் காட்டுவதால், நிர்வாகச் சூழலுக்கு ஏற்ற இயல்பான தமிழ்ச் சொற்றொடர் தேர்ந்தெடுக்கப்பட்டது.
- source_word: הָאֹצָרוֹת
  choice: கருவூலங்கள்
  rationale: இச்சூழலில் மதிப்புள்ள பொருட்கள் வைக்கப்படும் இடங்களையோ அவற்றின் நிர்வாகப் பிரிவுகளையோ குறிக்கும் பன்மைச் சொல்லாக இருப்பதால் ‘கருவூலங்கள்’ பொருத்தமானது; ‘பண்டகசாலைகள்’ என்பதும் சாத்தியம்.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், வரலாற்று-நிர்வாகப் பட்டியலுக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. வம்சத் தொடரைத் தெளிவாக்கத் தமிழ் இயல்பின்படி மோசேயிலிருந்து செபுவேல் வரை சொற்றொடர் அமைக்கப்பட்டுள்ளது.
