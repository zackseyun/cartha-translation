  source_fidelity: 'மூல எபிரெயத்தின் வம்சத் தொடர் துல்லியமாகப் பாதுகாக்கப்பட்டுள்ளது: செபுவேல் கெர்சோமின் மகனும், கெர்சோம் மோசேயின் மகனும் ஆவார். נָגִיד עַל הָאֹצָרוֹת என்பதன் நிர்வாகப் பொருளை ‘கருவூலங்களுக்குப் பொறுப்பான தலைவராக’ என்பது இயல்பாகவும் போதிய துல்லியத்துடனும் தருகிறது. தொடக்க வாவைத் தனிச் சொல்லாக விடுத்திருப்பது தமிழ் பட்டியல் நடையில் பொருள் இழப்பை ஏற்படுத்தவில்லை.'
