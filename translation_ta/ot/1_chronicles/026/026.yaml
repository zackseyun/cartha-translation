base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/026.yaml
  text: Shelomoth and his brothers were over all the treasuries of the holy things that King David[a], the heads of the fathers’ houses, the commanders of thousands and of hundreds[b], and the commanders of the army had dedicated.
translation:
  language: ta
  text: ஷெலோமோத்தும் அவனுடைய சகோதரர்களும், அரசன் தாவீதும் தந்தைவழிக் குடும்பங்களின் தலைவர்களும்[b], ஆயிரத்துத் தலைவர்களும் நூற்றுத் தலைவர்களும் படைத்தலைவர்களும் அர்ப்பணித்த பரிசுத்தப் பொருட்களின் கருவூலங்கள் அனைத்திற்கும் பொறுப்பாயிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: எபிரெயத்தில், ‘தந்தையரின் தலைவர்கள்’; இது குல அடிப்படையிலான குடும்ப நிர்வாகப் பதவியைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: הוּא שְׁלֹמוֹת וְאֶחָיו
  choice: செலோமோத்தும் அவனுடைய சகோதரர்களும் ... பொறுப்பாயிருந்தார்கள்
  rationale: எபிரெயத்தில் தொடக்கச் சுட்டுப்பெயர் ஒருமையில் இருந்தாலும், செலோமோத்தும் அவனுடைய சகோதரர்களும் என்ற கூட்டெழுவாய்க்கேற்ப தமிழில் இயல்பான பன்மை வினை பயன்படுத்தப்பட்டது.
- source_word: עַל כָּל אֹצְרוֹת
  choice: எல்லாக் கருவூலங்களுக்கும் பொறுப்பாயிருந்தார்கள்
  rationale: நிர்வாகச் சூழலில் עַל மேற்பார்வை அல்லது பொறுப்பைக் குறிக்கிறது; אֹצָרוֹת இங்கு சேமிக்கப்பட்ட செல்வத்தைவிட நிறுவனரீதியான கருவூலங்களைக் குறிக்கிறது.
- source_word: הַקֳּדָשִׁים
  choice: பரிசுத்தப் பொருட்கள்
  rationale: அர்ப்பணிக்கப்பட்டு தனியே வைக்கப்பட்ட பொருட்கள் என்ற பொருளை நேரடியாகவும் புரிந்துகொள்ளத்தக்க வகையிலும் தருகிறது.
- source_word: אֲשֶׁר הִקְדִּישׁ
  choice: அர்ப்பணித்த
  rationale: קדשׁ என்பதன் ஹிஃபில் வடிவம் புனித நோக்கத்திற்காக ஒதுக்குதல் அல்லது அர்ப்பணித்தல் என்பதைக் குறிக்கிறது; இச்சூழலில் ‘அர்ப்பணித்த’ இயல்பானது.
- source_word: דָּוִיד הַמֶּלֶךְ
  choice: தாவீது அரசன்
  rationale: பெயரையும் அரசப் பட்டத்தையும் தெளிவான தமிழ் சொல் வரிசையில் தருகிறது.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: தந்தைவழிக் குடும்பங்களின் தலைவர்கள்
  rationale: இது நாளாகமத்தில் குலம் சார்ந்த நிர்வாகப் பதவி; சொல்லுக்குச் சொல் வடிவத்தை விட அதன் சமூகப் பொருளை நவீன தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: שָׂרֵי הָאֲלָפִים וְהַמֵּאוֹת
  choice: ஆயிரத்துத் தலைவர்களும் நூற்றுத் தலைவர்களும்
  rationale: படைத்துறை அல்லது நிர்வாகப் பிரிவுகளான ஆயிரம் மற்றும் நூறு பேருக்குப் பொறுப்பான தலைவர்களைச் சுருக்கமாகக் குறிக்கிறது.
- source_word: שָׂרֵי הַצָּבָא
  choice: படைத்தலைவர்கள்
  rationale: צָבָא இங்கு இராணுவத்தைக் குறிக்கிறது; ‘படைத்தலைவர்கள்’ நவீன தமிழில் தெளிவும் கண்ணியமும் உடையது.
theological_decisions:
- issue: பரிசுத்தப் பொருட்களை அர்ப்பணித்தவர்களின் வரம்பு
  choice: தாவீது அரசன் முதல் படைத்தலைவர்கள் வரை பட்டியலிடப்பட்ட அனைவரும் அர்ப்பணித்தவர்களாக மொழிபெயர்க்கப்பட்டுள்ளனர்.
  alternative: தாவீது மட்டுமே அர்ப்பணித்தார் என்றும், பின்னுள்ள குழுக்கள் வேறுவகையில் அவருடன் தொடர்புடையவர்கள் என்றும் வாசித்தல்.
  rationale: தொடர்ச்சியான இணைப்புச் சொற்களால் அமைந்த எபிரெயப் பட்டியல், ஒருமை வினை வடிவம் இருந்தபோதிலும், கூட்டுப் பொருளில் அனைத்து குழுக்களையும் எழுவாய்களாகப் புரிந்துகொள்வதற்கு இயல்பாக இடமளிக்கிறது.
- issue: לְשָׂרֵי என்பதிலுள்ள לְ முன்னிடைச்சொல்லின் தொடர்பு
  choice: சூழலுக்கும் இணையான பதவிப் பட்டியலுக்கும் ஏற்ப ஆயிரத்துத் தலைவர்களையும் நூற்றுத் தலைவர்களையும் தனித்த இணை எழுவாய்களாகத் தரப்பட்டது.
  alternative: ‘தந்தைவழிக் குடும்பங்களின் தலைவர்கள்’ என்பதற்கு விளக்கவுரையாகவோ அவர்களோடு சார்புடையவர்களாகவோ ‘ஆயிரத்துத் தலைவர்கள் மற்றும் நூற்றுத் தலைவர்கள்’ என்பதை வாசித்தல்.
  rationale: மூல வாக்கிய அமைப்பு சுருக்கமாகவும் ஓரளவு கடினமாகவும் உள்ளது. தமிழ் வாக்கியம் பட்டியலின் மிக இயல்பான பொருளைத் தருகிறது; இருப்பினும் முன்னிடைச்சொல்லின் சரியான தொடரியல் தொடர்பை அளவுக்கு மீறித் தீர்மானிப்பதில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில், வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. நீண்ட எபிரெயப் பட்டியல் தமிழில் தெளிவாகப் புரிய இணைப்புகளுடன் அமைக்கப்பட்டது. அடிக்குறிப்புக் குறிகள் அவை விளக்கும் சொற்றொடர்களுக்குப் பின்னர் சரியாக வைக்கப்பட்டுள்ளன.
