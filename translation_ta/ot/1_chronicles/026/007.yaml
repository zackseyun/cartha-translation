translation_notes:
  register: நவீன நிலையான தமிழில், வம்சப்பட்டியலுக்கேற்ற சுருக்கமானதும் கண்ணியமானதுமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய ஒருமை உரிமைச் சுட்டு காக்கப்பட்டுள்ளது; நிறுத்தக்குறிகள் மூலம் எலிகூவும் செமக்கியாவும் எல்சாபாத்தின் சகோதரர்கள் என்பது தெளிவாக்கப்பட்டுள்ளது.
