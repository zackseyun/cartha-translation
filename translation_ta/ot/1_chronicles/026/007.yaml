  text: בְּנֵ֣י שְׁמַֽעְיָ֗ה עָ֠תְנִי וּ/רְפָאֵ֨ל וְ/עוֹבֵ֧ד אֶלְזָבָ֛ד אֶחָ֖י/ו בְּנֵי חָ֑יִל אֱלִיה֖וּ וּ/סְמַכְיָֽהוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/007.yaml
  text: 'The sons of Shemaiah: Othni[a], Rephael, Obed, Elzabad, whose brothers were capable men, Elihu and Semakiah.'
translation:
  language: ta
  text: 'செமாயாவின் மகன்கள்: ஒத்னி, ரெபாயேல், ஓபேத், எல்சாபாத்; அவனுடைய சகோதரர்களான எலிகூவும் செமக்கியாவும் திறமைமிக்கவர்கள்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வீரமிக்கவர்கள்” அல்லது “வல்லவர்கள்.” எபிரெயச் சொற்றொடர் வலிமை, வீரம் அல்லது திறமை ஆகியவற்றைக் குறிக்கலாம்; இங்கு சேவைக்கான தகுதியை வலியுறுத்துவதாக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי שְׁמַעְיָה
  choice: செமாயாவின் மகன்கள்
  rationale: எபிரெயக் கட்டமைப்பு செமாயாவுக்கும் பட்டியலிடப்படும் மகன்களுக்கும் உள்ள தந்தை–மகன் உறவைக் குறிக்கிறது; வம்சப்பட்டியல் நடைக்கு இயல்பான தமிழில் வழங்கப்பட்டது.
- source_word: עָתְנִי
  choice: ஒத்னி
  rationale: மசோரா உயிர்க்குறிப்பை ஒட்டி ஆள்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: וּרְפָאֵל
  choice: ரெபாயேல்
  rationale: எபிரெய உச்சரிப்பை நெருக்கமாகப் பிரதிபலிக்கும் தமிழ் ஒலிபெயர்ப்பு.
- source_word: וְעוֹבֵד
  choice: ஓபேத்
  rationale: ஆள்பெயரின் எபிரெய வடிவம் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: אֶלְזָבָד
  choice: எல்சாபாத்
  rationale: ஆள்பெயரின் எபிரெய வடிவம் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: אֶחָיו
  choice: இவனுடைய சகோதரர்களான
  rationale: சொல் இலக்கணப்படி மூன்றாம் நபர் ஆண்பால் ஒருமை உரிமை விகுதியைக் கொண்டிருப்பதால், அருகிலுள்ள எல்சாபாத்தைச் சுட்டும் ‘இவனுடைய’ என்ற பொருள் காக்கப்பட்டது.
- source_word: בְּנֵי חָיִל
  choice: திறமைமிக்கவர்கள்
  rationale: חַיִל வலிமை, வீரியம், தகுதி அல்லது செயல்திறனைக் குறிக்கலாம்; ஆலய வாயிற்காவலர் பட்டியலான இச்சூழலில் தேவையின்றி இராணுவப் பொருளை ஏற்றாமல் சேவைக்கான திறமையை இயல்பாகக் காட்டுகிறது.
- source_word: אֱלִיהוּ
  choice: எலிகூ
  rationale: ஆள்பெயர் எபிரெய ஒலிவடிவத்தை அடிப்படையாகக் கொண்டு தமிழில் வழங்கப்பட்டது.
- source_word: וּסְמַכְיָהוּ
  choice: செமக்கியா
  rationale: மசோரா வடிவமான Semakhyahu-வை நெருக்கமாகப் பிரதிபலிக்கும் தமிழ் ஒலிபெயர்ப்பு.
