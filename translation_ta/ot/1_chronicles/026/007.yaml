  to: 'செமாயாவின் மகன்கள்: ஒத்னி, ரெபாயேல், ஓபேத், எல்சாபாத்; அவனுடைய சகோதரர்களான எலிகூவும் செமக்கியாவும் திறமைமிக்கவர்கள்.[a]'
