base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/027.yaml
  text: From the wars and from the spoil they had dedicated things to strengthen the house of Yahweh.
translation:
  language: ta
  text: போர்களிலிருந்தும் கொள்ளைப் பொருளிலிருந்தும் கிடைத்தவற்றை[a] யாவேயின் இல்லத்தை உறுதிப்படுத்துவதற்காக அவர்கள் அர்ப்பணித்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘கிடைத்தவற்றை’ என்பதற்கான நேரடிச் சொல் இல்லை; செயப்படுபொருள் குறிப்பிடப்படாமல் விடப்பட்டுள்ளது. ‘போர்கள்’ என்பதை ‘யுத்தங்கள்’ என்றும், ‘கொள்ளைப் பொருள்’ என்பதை ‘சூறையாடப்பட்ட பொருள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: மூல உரையில் விடப்பட்டுள்ள செயப்படுபொருளையும் சொற்பொருள் மாற்றுகளையும் தெரிவிக்கிறது.
lexical_decisions:
- source_word: מִן הַמִּלְחָמוֹת
  choice: போர்களிலிருந்து
  rationale: מִן என்பது மூலத்தையோ தோற்றத்தையோ குறிக்கிறது; מִלְחָמוֹת என்பதன் பன்மைப் பொருளான ‘போர்கள்’ சூழலுக்கு ஏற்ற விரிவான சொல்லாக உள்ளது.
- source_word: וּמִן הַשָּׁלָל
  choice: கொள்ளைப் பொருளிலிருந்து
  rationale: שָׁלָל என்பது போரில் கைப்பற்றப்பட்ட பொருட்களைக் குறிக்கிறது; ‘கொள்ளைப் பொருள்’ நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: הִקְדִּישׁוּ
  choice: அவர்கள் அர்ப்பணித்திருந்தார்கள்
  rationale: קדשׁ என்பதன் ஹிஃபில் வடிவம் புனிதப் பயன்பாட்டிற்கென ஒதுக்கி அர்ப்பணிப்பதைக் குறிக்கிறது. சுற்றியுள்ள கதைநடையின் முந்திய செயலைக் காட்ட இறந்தகால நிறைவுவடிவம் பயன்படுத்தப்பட்டது.
- source_word: לְחַזֵּק
  choice: உறுதிப்படுத்துவதற்காக
  rationale: חזק என்பதன் அடிப்படைப் பொருளான ‘வலிமையாக்குதல்/உறுதிப்படுத்துதல்’ பாதுகாக்கப்படுகிறது; ஆலயச் சூழலில் இது பழுதுபார்த்தல் அல்லது பராமரித்தலையும் உள்ளடக்கலாம்.
- source_word: לְבֵית יְהוָה
  choice: யாவேயின் இல்லத்தை
  rationale: בַּיִת என்பதன் ‘இல்லம்’ என்ற உருவகத்தைப் பேணுகிறது; இச்சூழலில் அது ஆலயத்தைக் குறிக்கிறது. יהוה தனிப்பட்ட இறைப் பெயராக ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: எபிரெய உரையில் வரும் உடன்படிக்கைப் பெயரை பொதுப்பட்டப் பெயராக மாற்றாமல், தமிழில் இயல்பான ஒலிபெயர்ப்பாக வழங்குகிறது.
- issue: இல்லத்தை ‘உறுதிப்படுத்துதல்’ என்பதன் துல்லிய நோக்கம்
  choice: உறுதிப்படுத்துவதற்காக
  alternative: பழுதுபார்ப்பதற்காக
  rationale: மூலச் சொல்லின் விரிவான பொருளையும், அது பராமரிப்பு அல்லது பழுதுபார்ப்பைக் குறிக்கக்கூடிய தெளிவின்மையையும் பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘இல்லம்’ என்ற எபிரெய உருவகம் பேணப்பட்டாலும் சூழலில் அது யாவேயின் ஆலயத்தைக் குறிக்கிறது; மறைமுகச் செயப்படுபொருள் இயல்பான தமிழுக்காக உரையில் சேர்க்கப்பட்டு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
