translation_notes:
  register: நவீனத் தரத் தமிழில், வரலாற்றுக் குறிப்பேட்டுக்கு ஏற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் வினையற்ற பங்கீட்டு வாக்கியம் தமிழில் தெளிவடைய ‘ஒதுக்கப்பட்டது’ என நிறைவு செய்யப்பட்டுள்ளது; இறுதி தொடரின் இடவியல்/நிர்வாகத் தெளிவின்மை முழுமையாகத் தீர்மானிக்கப்படாமல் பேணப்பட்டுள்ளது.
