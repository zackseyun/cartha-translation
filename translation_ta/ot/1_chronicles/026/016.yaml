- from: சுப்பீமுக்கும் ஓசாவுக்கும் மேற்குப் பக்கம் ஒதுக்கப்பட்டது; மேலே செல்லும் நெடுஞ்சாலையிலுள்ள சல்லெகேத் வாசலும் அவர்களுக்கு ஒதுக்கப்பட்டது.[a] காவல் முறை காவல் முறைக்கு எதிரே இருந்தது.
  to: சுப்பீமுக்கும் ஓசாவுக்கும் மேற்குப் பக்கம், மேலே ஏறிச் செல்லும் பெருவழியிலுள்ள சல்லெகேத் வாசலோடு சேர்த்து, ஒதுக்கப்பட்டது.[a] காவலுக்கு எதிராகக் காவல் இருந்தது.
  rationale: The revision keeps the gate connected to the western assignment by rendering עִם as “வாசலோடு சேர்த்து,” rather than stating that the gate itself received a separate allocation. It also renders the final compact Hebrew phrase with “காவல்” rather than “காவல் முறை,” preserving its likely guard/guard-post sense and its concise spatial correspondence.
