base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/016.yaml
  text: For Shuppim and Hosah[a], the lot fell to the west, with the Gate of Shallecheth on the ascending highway, guard corresponding to guard.
translation:
  language: ta
  text: சுப்பீமுக்கும் ஓசாவுக்கும் மேற்குப் பக்கம், மேலே ஏறிச் செல்லும் பெருவழியிலுள்ள சல்லெகேத் வாசலோடு சேர்த்து, ஒதுக்கப்பட்டது.[a] காவலுக்கு எதிராகக் காவல் இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சல்லெகேத் வாசல்” என்பதை “வெளியேற்றும் வாசல்” என்றும் பொருள்கொள்ளலாம். “சல்லெகேத்” என்பது “எறிதல்” அல்லது “கீழே வீசுதல்” என்ற பொருளுடைய வினையிலிருந்து வந்த வாசலின் பெயராக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְשֻׁפִּים וּלְחֹסָה
  choice: சுப்பீமுக்கும் ஓசாவுக்கும்
  rationale: לְ முன்னொட்டுகள் இச்சூழலில் பங்கீட்டைப் பெறுபவர்களைக் குறிக்கின்றன. இரு பெயர்களிலும் ‘-க்கும்’ பயன்படுத்துவது எபிரெய இணை அமைப்பை இயல்பான தமிழில் தருகிறது.
- source_word: לַמַּעֲרָב
  choice: மேற்குப் பக்கம் ஒதுக்கப்பட்டது
  rationale: எபிரெய மூலத்தில் வினை வெளிப்படையாக இல்லாவிட்டாலும், சுற்றியுள்ள சீட்டுப்போட்டுப் பங்கிடும் சூழல் இதை நிறைவு செய்கிறது. தமிழில் பொருள் தெளிவாக இருக்க ‘ஒதுக்கப்பட்டது’ சேர்க்கப்பட்டுள்ளது.
- source_word: עִם שַׁעַר שַׁלֶּכֶת
  choice: சல்லெகேத் வாசலும் அவர்களுக்கு ஒதுக்கப்பட்டது
  rationale: עִם என்பதன் இணைப்பு உணர்வை ‘-உம்’ தக்கவைக்கிறது; שַׁלֶּכֶת என்பது பெரும்பாலும் வாசலின் இயற்பெயர் என்பதால் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: בַּמְסִלָּה הָעוֹלָה
  choice: மேலே செல்லும் நெடுஞ்சாலையிலுள்ள
  rationale: מְסִלָּה உயர்த்தப்பட்ட பெருவழி அல்லது நெடுஞ்சாலையையும், הָעוֹלָה மேலே ஏறும் திசையையும் குறிக்கிறது. இவ்வடிவம் நிலவியல் கருத்தை இயல்பாகத் தருகிறது.
- source_word: מִשְׁמָר לְעֻמַּת מִשְׁמָר
  choice: காவல் முறை காவல் முறைக்கு எதிரே
  rationale: மூலத்தின் சுருக்கமான, மீளுருவாக்க அமைப்பைப் பேணுகிறது. מִשְׁמָר என்பது காவல் பணி, காவல் முறை அல்லது காவல் நிலையைக் குறிக்கலாம்; ‘காவல் முறை’ தேவையற்ற குறிப்பாக்கத்தைத் தவிர்க்கிறது.
