base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/001.yaml
  text: 'For the divisions of the gatekeepers: of the Korahites[a], Meshelemiah son of Kore, from the sons of Asaph.'
translation:
  language: ta
  text: 'வாயிற்காவலர்களின் பிரிவுகள்[a]: கோராகியருக்குரியது: ஆசாபின் சந்ததியினரில் ஒருவரான கோரேயின் மகன் மெசெலெமியா.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வாயிற்காவலர்களின் பிரிவுகளின்படி.” தொடக்கச் சொற்றொடர் வாயிற்காவலர்களின் பிரிவுகளை அறிமுகப்படுத்தும் பகுதித் தலைப்பாகச் செயல்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַחְלְקוֹת לְשֹׁעֲרִים
  choice: வாயிற்காவலர்களின் பிரிவுகள்
  rationale: இது தொடர்ந்து வரும் பட்டியலை அறிமுகப்படுத்தும் தலைப்புத் தொடராக உள்ளது. מַחְלְקוֹת என்பது பணிப்பிரிவுகள் அல்லது முறைப்படி அமைக்கப்பட்ட குழுக்களைக் குறிக்கிறது; שֹׁעֲרִים என்பது வாயில்களில் காவல் செய்வோரைக் குறிக்கிறது.
- source_word: לַקָּרְחִים
  choice: கோராகியரில்
  rationale: கோராகின் குலத்தைச் சேர்ந்தவர்களுள் ஒருவரை அறிமுகப்படுத்தும் பட்டியல் நடையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מְשֶׁלֶמְיָהוּ
  choice: மெசெலெமியா
  rationale: இவ்வசனத்தின் எபிரெய மெய்யெழுத்து வடிவத்தைப் பின்பற்றிய தனிப்பெயர் ஒலிபெயர்ப்பு.
- source_word: בֶן קֹרֵא
  choice: கோரேயின் மகன்
  rationale: בֶן என்பதன் நேரடியான வம்ச உறவுப் பொருளான ‘மகன்’ இங்கு பொருத்தமானது; קֹרֵא தனிப்பெயராக ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: מִן בְּנֵי אָסָף
  choice: ஆசாபின் மக்களுள் ஒருவரான
  rationale: מִן ஒரு பெரிய குடும்பக் குழுவிலிருந்து வந்தவர் அல்லது அதில் உறுப்பினர் என்பதைக் குறிக்கிறது. தமிழில் இயல்பாக இருக்க இத்தொடர் கோரேயை விளக்கும் வகையில் அமைக்கப்பட்டுள்ளது; ‘ஆசாப்’ என்ற பெயருக்கு மேலதிக அடையாளம் எதுவும் சேர்க்கப்படவில்லை.
