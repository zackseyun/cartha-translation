base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/020.yaml
  text: And of the Levites[b][a], Ahijah was over the treasuries of the house of God and the treasuries of the holy things.
translation:
  language: ta
  text: லேவியர்களில்[a], அகியா தேவனுடைய இல்லத்தின் கருவூலங்களுக்கும் பரிசுத்தப் பொருட்களின்[b] கருவூலங்களுக்கும் மேற்பார்வையாளனாக இருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, “லேவியர்களைப் பொறுத்தவரை: அகியா …” எபிரேயத் தொடக்கம் சுருக்கமானது; அது ஒரு தலைப்பைப் போன்ற இடைமாற்றாகவும் செயல்படலாம்.'
    reason: alternative_reading
  - marker: b
    text: “பரிசுத்தப் பொருட்கள்” என்பதை “அர்ப்பணிக்கப்பட்ட பொருட்கள்” அல்லது “புனிதமாக்கப்பட்ட பொருட்கள்” என்றும் மொழிபெயர்க்கலாம்; இது புனிதப் பயன்பாட்டுக்காகப் பிரித்துவைக்கப்பட்டவற்றைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַלְוִיִּם
  choice: லேவியர்களில்
  rationale: தொடர்ந்து ஒருமைப் பெயரான அகியா வருவதால், இது லேவியர்களைக் குறித்த ஒரு புதிய நிர்வாகப் பகுதியை அறிமுகப்படுத்தும் சுருக்கமான தலைப்புத் தொடராகப் புரிந்துகொள்ளப்படுகிறது. எபிரெய மொழியின் நீள்விடுபாட்டை ஓரளவு காத்தபடியே தமிழில் பொருள் விளங்குமாறு மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: אֲחִיָּה
  choice: அகியா
  rationale: எபிரெய தனிப்பெயரின் ஒலிபெயர்ப்பு.
- source_word: עַל
  choice: பொறுப்பாளனாக இருந்தான்
  rationale: நிர்வாகச் சூழலில் அதிகாரம் அல்லது மேற்பார்வைப் பொறுப்பைக் குறிக்கிறது; இயல்பான நவீன தமிழில் அந்தப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: אֹצְרוֹת
  choice: கருவூலங்கள்
  rationale: மதிப்புமிக்க பொருட்களையோ சேமிப்புகளையோ வைத்திருக்கும் இடங்கள் அல்லது அவற்றின் தொகுப்புகளைக் குறிக்கிறது; ஆலயச் சூழலுக்கு ‘கருவூலங்கள்’ பொருத்தமானது.
- source_word: בֵּית הָאֱלֹהִים
  choice: தேவனுடைய இல்லம்
  rationale: ‘தேவனுடைய வீடு/இல்லம்’ என்ற நேரடிப் பொருளைத் தக்கவைக்கிறது; இங்கு அது ஆலய வளாகத்தைக் குறிக்கிறது.
- source_word: וּלְאֹצְרוֹת
  choice: கருவூலங்களுக்கும்
  rationale: முன்னுள்ள עַל குறிக்கும் மேற்பார்வை இரண்டாவது கருவூலத் தொகுதிக்கும் பொருந்துகிறது; தமிழ் இணைப்பு இரண்டையும் ஒரே பொறுப்பின் கீழ் தெளிவாக அமைக்கிறது.
- source_word: הַקֳּדָשִׁים
  choice: பரிசுத்தப் பொருட்கள்
  rationale: புனிதப் பயன்பாட்டுக்காகப் பிரித்துவைக்கப்பட்ட அல்லது அர்ப்பணிக்கப்பட்ட பொருட்களைக் குறிக்கும் பன்மைச் சொல்லின் நேரடியான பொருளைத் தருகிறது.
