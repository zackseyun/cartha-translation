  to: மெஷெலேமியாவுக்கு மகன்கள் இருந்தார்கள்:[a] முதற்பிறந்த மகன் சகரியா; இரண்டாவது எதியேல்; மூன்றாவது செபதியா; நான்காவது யத்னியேல்.
