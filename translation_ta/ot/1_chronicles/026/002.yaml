  text: וְ/לִ/מְשֶֽׁלֶמְיָ֖הוּ בָּנִ֑ים זְכַרְיָ֤הוּ הַ/בְּכוֹר֙ יְדִֽיעֲאֵ֣ל הַ/שֵּׁנִ֔י זְבַדְיָ֨הוּ֙ הַ/שְּׁלִישִׁ֔י יַתְנִיאֵ֖ל הָ/רְבִיעִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/002.yaml
  text: 'And Shelemiah had sons: Zechariah the firstborn[a], Jediael the second, Zebadiah the third[b], and Jathniel the fourth.'
translation:
  language: ta
  text: மெஷெலேமியாவுக்கு மகன்கள் இருந்தார்கள்:[a] முதற்பிறந்த மகன் சகரியா; இரண்டாவது எதியேல்; மூன்றாவது செபதியா; நான்காவது யத்னியேல்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் சொல்லுக்குச் சொல், “மெஷெலேமியாவுக்கு மகன்கள்”; இது வம்சவரலாற்றில் “மெஷெலேமியாவுக்கு மகன்கள் இருந்தார்கள்” என்று பொருள்படும் சொல்லமைப்பு.
    reason: cultural_note
lexical_decisions:
- source_word: וְלִמְשֶׁלֶמְיָהוּ
  choice: மெஷெல்லெமியாவுக்கு
  rationale: எபிரெய உரையில் לְ முன்னொட்டுக்குப் பின் வரும் பெயர் מְשֶׁלֶמְיָהוּ (மெஷெல்லெமியா). முந்தைய வசனத்துடனான தொடர்பைத் தமிழின் பட்டியல் அமைப்பே இயல்பாக வெளிப்படுத்துவதால் தனியாக ‘மேலும்’ சேர்க்கப்படவில்லை.
- source_word: בָּנִים
  choice: மகன்கள் இருந்தார்கள்
  rationale: בָּנִים என்பது ஆண் பிள்ளைகளைக் குறிப்பதால் ‘மகன்கள்’ என மொழிபெயர்க்கப்பட்டது. வினைச்சொல் இல்லாத எபிரெய வம்சவரலாற்றுத் தொடரை இயல்பான தமிழில் கூற ‘இருந்தார்கள்’ சேர்க்கப்பட்டது.
- source_word: זְכַרְיָהוּ
  choice: சகரியா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் பெயர் வடிவம்.
- source_word: הַבְּכוֹר
  choice: மூத்த மகன்
  rationale: בְּכוֹר குடும்பத்தில் முதலில் பிறந்த மகனைக் குறிக்கிறது; இயல்பான தமிழில் அந்த உறவுப் பொருளை ‘மூத்த மகன்’ தெளிவாகத் தருகிறது.
- source_word: יְדִיעֲאֵל
  choice: எதியேல்
  rationale: எபிரெய தனிப்பெயரின் ஒலிக்கு ஏற்ற இயல்பான தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: הַשֵּׁנִי
  choice: இரண்டாவது
  rationale: வரிசை எண்ணை நேரடியாகவும் பட்டியலுக்கு ஏற்றவாறும் மொழிபெயர்க்கிறது.
- source_word: זְבַדְיָהוּ
  choice: செபதியா
  rationale: எபிரெய தனிப்பெயரின் மரபான தமிழ் ஒலிவடிவம்.
- source_word: הַשְּׁלִישִׁי
  choice: மூன்றாவது
  rationale: வரிசை எண்ணை நேரடியாக மொழிபெயர்க்கிறது.
- source_word: יַתְנִיאֵל
  choice: யத்னியேல்
  rationale: தொடக்க எபிரெய யோத் மெய்யை ‘ய’ என்று நேரடியாகப் பிரதிபலிக்கும் தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: הָרְבִיעִי
  choice: நான்காவது
  rationale: வரிசை எண்ணை நேரடியாக மொழிபெயர்க்கிறது.
