    text: எபிரெய மொழியில் சொல்லுக்குச் சொல், “மெஷெலேமியாவுக்கு மகன்கள்”; இது வம்சவரலாற்றில் “மெஷெலேமியாவுக்கு மகன்கள் இருந்தார்கள்” என்று பொருள்படும் சொல்லமைப்பு.
    reason: cultural_note
  revision_rationale: Shelemiah’s name is corrected to reflect the Hebrew consonants and syllabification, and “முதற்பிறந்த மகன்” is used for the specific firstborn sense. The remainder faithfully preserves the Hebrew genealogy and its ordinal sequence.
