translation_notes:
  register: நவீனத் தரத் தமிழில், வம்சவரலாற்றுப் பட்டியலின் சுருக்கத்தையும் கண்ணியத்தையும் காக்கும் நடை பயன்படுத்தப்பட்டுள்ளது. பெயர்கள் எபிரெய மூலத்தையும் வழக்கமான தமிழ் வேதாகம ஒலிவடிவங்களையும் கருத்தில் கொண்டு எழுதப்பட்டுள்ளன. ஆங்கில ஆலோசனை உரையிலுள்ள ‘Shelemiah’ என்பதற்குப் பதிலாக, WLC மூலத்தில் உள்ள מְשֶׁלֶמְיָהוּ என்ற முழுப் பெயரின்படி ‘மெஷெல்லெமியா’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
