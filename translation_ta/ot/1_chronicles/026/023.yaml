  register: நவீனத் தரத் தமிழில் சுருக்கமான பட்டியல் வடிவம் பயன்படுத்தப்பட்டுள்ளது. குலப்பெயர்கள் தமிழில் வாசிக்க இயலும் வகையில் ஒலிபெயர்க்கப்பட்டுள்ளன; மூலத்தின் வாக்கியத் துணுக்கு போன்ற அமைப்பும் தெளிவின்மையும் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.
