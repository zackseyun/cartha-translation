  text: அம்ராமியர், இஸ்ஹாரியர், எபிரோனியர், ஊசியேலியர்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לַעַמְרָמִי
  choice: அம்ராமியருக்கும்
  rationale: ל முன்னொட்டுடன் வரும் குலப்பெயர், இந்த நிர்வாகப் பட்டியலில் தலைப்புப் போன்ற குறிப்பாகச் செயல்படுகிறது. ‘-க்கும்’ என்பது எபிரெய முன்னொட்டைப் பிரதிபலிப்பதோடு, தமிழில் பட்டியலை இயல்பாக அமைக்கிறது.
- source_word: לַיִּצְהָרִי
  choice: இத்சாரியருக்கும்
  rationale: இத்சாரிலிருந்து வந்த குலத்தாரைக் குறிக்கும் குடும்பப் பெயர். பெயரை ஒலிபெயர்த்து, ‘-யர்’ வடிவில் குலத்தாரைக் குறித்துள்ளோம்.
- source_word: לַחֶבְרוֹנִי
  choice: எப்ரோனியருக்கும்
  rationale: எப்ரோனின் குலத்தாரைக் குறிக்கும் பெயர். சுற்றியுள்ள குலப்பெயர்களுடன் ஒரே வடிவமைப்பைப் பேணுகிறது.
- source_word: לָעָזִּיאֵלִי
  choice: ஊசியேலியருக்கும்
  rationale: ஊசியேலின் குலத்தாரைக் குறிக்கும் இறுதிப் பெயர். எபிரெய உரையில் இணைப்புச்சொல் இல்லாததால், தமிழிலும் தனியாக ‘மற்றும்’ சேர்க்காமல் இணைவேற்றுமை வடிவம் பயன்படுத்தப்பட்டுள்ளது.
