base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/025.yaml
  text: 'And his brothers belonging to Eliezer: Rehabiah his son[a], and Jeshaiah his son, and Joram his son, and Zichri his son, and Shelomith his son.'
translation:
  language: ta
  text: 'எலியேசருடன் தொடர்புடைய அவனுடைய சகோதரர்கள்[a]: அவனுடைய மகன் ரெகபியா; ரெகபியாவின் மகன் எசாயா; எசாயாவின் மகன் யோராம்; யோராமின் மகன் சிக்ரி; சிக்ரியின் மகன் செலோமித்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்கு நெருக்கமாக, “எலியேசருக்குரிய அவனுடைய சகோதரர்கள்.” இந்த எபிரெயச் சொற்றொடர் எலியேசருடன் தொடர்புடைய குடும்பக் கிளையை அறிமுகப்படுத்துவதாகத் தெரிகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶחָיו לֶאֱלִיעֶזֶר
  choice: அவனுடைய சகோதரர்களில் எலியேசரின் வழிவந்தவர்கள்
  rationale: אָחִים என்பது நேரடியாக ‘சகோதரர்கள்’ என்றாலும், வம்சப்பட்டியல் சூழலில் விரிவான உறவினர்களையும் குறிக்கலாம். לֶאֱלִיעֶזֶר இங்கு எலியேசருடன் தொடர்புடைய குடும்பக் கிளையை அறிமுகப்படுத்துகிறது. இயல்பான தமிழுக்காக ‘வழிவந்தவர்கள்’ என அமைக்கப்பட்டாலும், மூலத்தின் சிக்கலான சொற்றொடர் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: בְנוֹ
  choice: X-இன் மகன்
  rationale: ‘அவனுடைய மகன்’ என்பது ஒவ்வொரு தலைமுறையிலும் முந்தைய பெயரைக் குறிக்கிறது. தமிழில் சுட்டுப்பெயர் குழப்பம் ஏற்படாதபடி ஒவ்வொரு தந்தையின் பெயரும் வெளிப்படையாக மீண்டும் கூறப்பட்டுள்ளது; இதனால் மூலத்தில் உள்ள வம்சத் தொடர் தெளிவாகிறது.
- source_word: רְחַבְיָהוּ
  choice: ரெகபியா
  rationale: தமிழ் வேதாகமப் பெயர்வழக்கிற்கு ஏற்ற ஒலிபெயர்ப்பு.
- source_word: וִישַׁעְיָהוּ
  choice: எசாயா
  rationale: இந்த நபருக்கான பரவலான தமிழ் வேதாகமப் பெயர்வழக்கைப் பின்பற்றும் ஒலிபெயர்ப்பு.
- source_word: וְיֹרָם
  choice: யோராம்
  rationale: இவ்வசனத்தில் உள்ள குறுகிய எபிரெயப் பெயர்வடிவத்தை ஒலிபெயர்க்கிறது.
- source_word: וְזִכְרִי
  choice: சிக்ரி
  rationale: தமிழில் வாசிக்க இயல்பான, மரபில் அறியப்பட்ட ஒலிபெயர்ப்பு.
- source_word: וּשְׁלֹמוֹת
  choice: செலோமித்
  rationale: நாளாகமப் பெயருக்கான பரவலான தமிழ் வேதாகம ஒலிபெயர்ப்பு.
