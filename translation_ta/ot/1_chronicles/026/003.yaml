translation_notes:
  register: நவீனத் தரத் தமிழில் சுருக்கமான பெயர்ப்பட்டியல் நடையைக் கையாளுகிறது. எபிரேயத்தில் பெயருக்குப் பின் வரும் வரிசை எண்கள், இயல்பான தமிழ் நடைக்காக பெயருக்கு முன் வைக்கப்பட்டுள்ளன; மூன்று கூறுகளின் இணை அமைப்பு பாதுகாக்கப்பட்டுள்ளது.
