translation:
  language: ta
  text: ஏலாம் ஐந்தாவது, யெஹோஹானான் ஆறாவது, எலியேஹோஏனாய் ஏழாவது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֵילָם
  choice: ஏலாம்
  rationale: தனிப்பட்ட நபரின் பெயர்; எபிரேய ஒலிப்புக்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: הַחֲמִישִׁי
  choice: ஐந்தாவது
  rationale: குறிப்பிட்ட வரிசை எண்ணைக் குறிக்கும் எபிரேயச் சொல்; பட்டியலின் இயல்பான தமிழ் சொல்வரிசைக்கு ஏற்ப பெயருக்கு முன் வைக்கப்பட்டது.
- source_word: יְהוֹחָנָן
  choice: யெகோகானான்
  rationale: தனிப்பட்ட நபரின் பெயர்; எபிரேய உச்சரிப்பை இயன்றவரை வெளிப்படுத்தும் தமிழ் ஒலிபெயர்ப்பு.
- source_word: הַשִּׁשִּׁי
  choice: ஆறாவது
  rationale: ஆறாம் இடத்தைக் குறிக்கும் வரிசை எண்; மற்ற வரிசை எண்களுடன் ஒரே அமைப்பில் தரப்பட்டது.
- source_word: אֶלְיְהוֹעֵינַי
  choice: எலியோகேனாய்
  rationale: தனிப்பட்ட நபரின் பெயர்; அதன் கூறுகளையும் எபிரேய ஒலியமைப்பையும் அடையாளம் காணக்கூடிய வகையில் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: הַשְּׁבִיעִי
  choice: ஏழாவது
  rationale: ஏழாம் இடத்தைக் குறிக்கும் வரிசை எண்; பட்டியலின் இணையான அமைப்பு காக்கப்பட்டது.
