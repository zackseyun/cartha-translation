  text: These were the divisions of the gatekeepers for the sons of the Korahites and for the sons of Merari[a].
translation:
  language: ta
  text: கோராவின் சந்ததியினருக்கும் மெராரியின் மகன்களுக்கும் உரிய வாயிற்காவலர்களின் பணிப்பிரிவுகள் இவையே.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  choice: இவையே
  rationale: வினைச்சொல் இல்லாத எபிரெயச் சுருக்க வாக்கியத்தை இயல்பான தமிழில் சுருக்கப்பட்ட பட்டியலின் முடிவுரையாக அளிக்கிறது; காலத்தைத் தேவையின்றி குறிப்பதில்லை.
- source_word: מַחְלְקוֹת
  choice: பணிப்பிரிவுகள்
  rationale: ஆலயப் பணிக்காக ஒழுங்குபடுத்தப்பட்ட குழுக்களை இச்சொல் குறிக்கிறது. வெறும் ‘பிரிவுகள்’ என்பதைவிட ‘பணிப்பிரிவுகள்’ சூழலைத் தெளிவாக்குகிறது; அதே நேரத்தில் அளவுக்கு மீறி விளக்குவதில்லை.
- source_word: הַשֹּׁעֲרִים
  choice: வாயிற்காவலர்கள்
  rationale: வாயில்களைக் காவல் காக்க நியமிக்கப்பட்டவர்களைத் தெளிவாகவும் நவீன தமிழில் இயல்பாகவும் குறிக்கிறது.
- source_word: לִבְנֵי
  choice: மகன்களுக்கும் … உரிய
  rationale: குலச் சார்பையும் பணிப்பிரிவுகளின் ஒதுக்கீட்டையும் காட்டும் לְ முன்னிடைச்சொல்லின் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הַקָּרְחִי
  choice: கோரகியரின்
  rationale: கோராகிலிருந்து வந்த குலத்தாரைக் குறிக்கும் இனக்குழுப் பெயர். அடுத்துள்ள ‘மகன்கள்’ என்பதுடன் சேர்த்து எபிரெய அமைப்பைத் தக்கவைக்கிறது.
- source_word: וְלִבְנֵי מְרָרִי
  choice: மெராரியின் மகன்களுக்கும்
  rationale: ‘மெராரியர்’ என்று சுருக்காமல், மூலத்தில் உள்ள இணையான ‘மெராரியின் மகன்கள்’ என்ற கட்டமைப்பைப் பாதுகாக்கிறது.
