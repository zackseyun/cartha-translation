  text: לְ֠/אֵלֶּה מַחְלְק֨וֹת הַ/שֹּֽׁעֲרִ֜ים לְ/רָאשֵׁ֧י הַ/גְּבָרִ֛ים מִשְׁמָר֖וֹת לְ/עֻמַּ֣ת אֲחֵי/הֶ֑ם לְ/שָׁרֵ֖ת בְּ/בֵ֥ית יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/012.yaml
  text: For these divisions of the gatekeepers[a], the chief men had assigned duties corresponding to those of their brothers, to minister in the house of Yahweh.
translation:
  language: ta
  text: இந்த வாயிற்காவலர் பிரிவுகளில் உள்ள தலைமை ஆண்களுக்கு, தங்கள் சகோதரர்களுக்கு இணையான, யாவேயின் இல்லத்தில் ஊழியம் செய்வதற்கான காவல் பொறுப்புகள் இருந்தன.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இந்த வாயிற்காவலர் பிரிவுகளில் உள்ள தலைமை ஆண்களுக்கு, தங்கள் சகோதரர்களுக்கு இணையாக, காவல் பணிகள் இருந்தன.” எபிரெய வாக்கியம் மிகவும் சுருக்கமானது; מִשְׁמָרוֹת என்பதற்கு “காவல் பணிகள்,” “பணிக்காலங்கள்,” அல்லது “சேவைப் பொறுப்புகள்” என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאֵלֶּה מַחְלְקוֹת הַשֹּׁעֲרִים
  choice: இந்த வாயிற்காவலர் பிரிவுகளின்
  rationale: לְאֵלֶּה என்பதுடன் தொடங்கும் எபிரெயச் சொற்றொடர் சுருக்கமானது. தமிழில் பிரிவுகளைத் தலைமை ஆண்களுடன் இயல்பாக இணைக்கும் வகையில் இவ்வாறு தரப்பட்டுள்ளது; மַחְלְקוֹת என்பது ஒழுங்கமைக்கப்பட்ட பணிப்பிரிவுகளையும், הַשֹּׁעֲרִים என்பது வாயில்களைக் காத்துப் பராமரித்தவர்களையும் குறிக்கிறது.
- source_word: לְרָאשֵׁי הַגְּבָרִים
  choice: தலைமை ஆண்களுக்கும்
  rationale: רָאשֵׁי என்பதன் தலைமை அல்லது முதன்மை என்ற பொருளையும், வரலாற்றுச் சூழலில் ஆண் ஆலயப் பணியாளர்களைக் குறிக்கும் גְּבָרִים என்பதையும் தக்கவைக்கிறது; போர்வீரர்கள் என்ற தேவையற்ற பொருளைச் சேர்க்கவில்லை.
- source_word: מִשְׁמָרוֹת
  choice: காவல் பணிகள்
  rationale: இந்தப் பெயர்ச்சொல் காவல் முறைகள், பணிக்காலங்கள் அல்லது ஒதுக்கப்பட்ட சேவைப் பொறுப்புகள் என்று பொருள்படலாம். வாயிற்காவலர் சூழலில் ‘காவல் பணிகள்’ தெளிவாகவும் இயல்பாகவும் உள்ளது; எபிரெய வாக்கியத்தில் விடுபட்டுள்ள வினை தமிழில் ‘இருந்தன’ என்று வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: לְעֻמַּת אֲחֵיהֶם
  choice: தங்கள் சகோதரர்களைப் போலவே
  rationale: לְעֻמַּת குறிக்கும் இணைநிலை அல்லது ஒத்த தொடர்பை இயல்பான தமிழில் தருகிறது. אֲחֵיהֶם என்பதன் நேரடியான குடும்பச் சொல்லான ‘சகோதரர்கள்’ தக்கவைக்கப்பட்டுள்ளது.
- source_word: לְשָׁרֵת
  choice: ஊழியம் செய்வதற்கான
  rationale: שׁרת இங்கு ஆலயச் சேவையைக் குறிக்கிறது. ‘ஊழியம் செய்வது’ புனிதப் பணியின் நுண்ணுணர்வைக் காக்கிறது.
- source_word: בְּבֵית יְהוָה
  choice: யாவேயின் இல்லத்தில்
  rationale: בֵּית என்பதன் நேரடியான உருவகத்தை ‘இல்லம்’ காக்கிறது; சூழல் ஆலயத்தைக் காட்டுகிறது. יהוה என்பது பொதுப்பட்டமான ‘கர்த்தர்’ என்று மாற்றப்படாமல் ‘யாவே’ எனப் பெயர்ப்பெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் நான்கு எழுத்து இறைப் பெயர் நேரடியாக உள்ளது. ‘யாவே’ என்பது அந்த உடன்படிக்கைப் பெயரைப் பொதுப்பட்டமாக மாற்றாமல், பரவலாக ஏற்கப்படும் உச்சரிப்புக்கு நெருக்கமாகத் தமிழில் தருகிறது.
- issue: גְּבָרִים என்பதன் பாலினக் குறிப்பைத் தக்கவைத்தல்
  choice: ஆண்கள்
  alternative: மக்கள்; தலைவர்கள்
  rationale: இவ்வரலாற்றுச் சூழலில் ஆலயப் பணியாளர்கள் ஆண்கள் என்பதால் மூலத்தின் ஆண்பால் குறிப்பு மறைக்கப்படவில்லை. அதேவேளை ‘போர்வீரர்கள்’ என்ற குறிப்பிட்ட பொருள் திணிக்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் நீள்வட்டமான இலக்கணத்தை வாசிக்கத்தக்கதாக மாற்ற ‘இருந்தன’ சேர்க்கப்பட்டுள்ளது; அதன் உண்மையான சொற்பொருள் மற்றும் தொடரியல் மாற்று அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
