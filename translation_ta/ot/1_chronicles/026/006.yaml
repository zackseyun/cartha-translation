  register: நவீனத் தரத் தமிழில், பட்டியல்/வம்சவரலாற்றுக்கேற்ற சுருக்கமானதும் கண்ணியமானதுமான நடை பயன்படுத்தப்பட்டது. ‘தந்தைவழிக் குடும்பம்’ என்பது எபிரெய குடும்ப-குல அமைப்பைத் தெளிவாக்குகிறது; גִּבּוֹרֵי חַיִל என்பதிலுள்ள பொருள் விரிவை முதன்மை உரையும் அடிக்குறிப்பும் சேர்ந்து பாதுகாக்கின்றன.
