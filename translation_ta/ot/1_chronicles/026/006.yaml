base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/006.yaml
  text: And to Shemaiah his son[a], sons were born who ruled over their fathers’ house[b], for they were mighty men of valor.
translation:
  language: ta
  text: அவனுடைய மகனான செமாயாவுக்கும் மகன்கள் பிறந்தார்கள்; அவர்கள் தங்கள் தந்தைவழிக் குடும்பத்தை ஆண்டவர்கள்; ஏனெனில் அவர்கள் வலிமைமிக்க திறமைசாலிகளாக இருந்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “வலிமைமிக்க திறமைசாலிகள்” என்பதற்கான எபிரெயச் சொற்றொடர் “வீரமிக்க ஆண்கள்” அல்லது “வீரர்கள்” என்றும் மொழிபெயர்க்கப்படலாம். அது போர்த் திறனை மட்டும் அல்லாமல், நிரூபிக்கப்பட்ட வலிமை, திறமை, தகுதி அல்லது உயர்ந்த நிலை ஆகியவற்றையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִשְׁמַעְיָה בְנוֹ
  choice: அவனுடைய மகன் செமாயாவுக்கு
  rationale: எபிரெயப் பிறப்பு அறிவிப்பு அமைப்பிலுள்ள לְ என்பதைக் ‘-க்கு’ என இயல்பாகக் காட்டி, בְנוֹ என்பதை முந்தைய வசனத்திலுள்ள ஓபேத்-ஏதோமின் மகன் என்று தெளிவுபடுத்துகிறது.
- source_word: נוֹלַד בָּנִים
  choice: மகன்கள் பிறந்தார்கள்
  rationale: נוֹלַד வடிவில் ஒருமையாக இருந்தாலும், பிறப்பு அறிவிப்புகளில் பன்மைப் பொருளான בָּנִים உடன் வரும் எபிரெய வழக்கை இயல்பான தமிழ் பன்மை வினையால் வழங்குகிறது.
- source_word: הַמִּמְשָׁלִים
  choice: ஆளுகிற
  rationale: משׁל என்பதன் ஆட்சி அல்லது அதிகாரம் செலுத்துதல் என்ற செயற்பொருளைப் பாதுகாக்கிறது; வெறும் பதவிப் பெயராக மாற்றவில்லை.
- source_word: לְבֵית אֲבִיהֶם
  choice: தங்கள் தந்தைவழிக் குடும்பத்தை
  rationale: בֵּית אָב என்பது கட்டடமான ‘வீடு’ அல்லாமல் தந்தைவழிக் குடும்ப அல்லது குல அலகைக் குறிக்கும் மரபுத்தொடர். தமிழ் வாசகருக்கு அந்த சமூகப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: அவர்கள் ஆளும் நிலையைப் பெற்றதற்கான காரணத்தை அறிமுகப்படுத்தும் தொடர்பை வெளிப்படையாகக் காட்டுகிறது.
- source_word: גִּבּוֹרֵי חַיִל
  choice: வலிமையும் திறமையும் மிக்கவர்கள்
  rationale: இச்சூழலில் உடல் அல்லது போர்வீரத்தோடு மட்டுப்படாமல் வலிமை, திறமை, தகுதி, மதிப்பு ஆகியவற்றையும் குறிக்கக்கூடிய மரபுத்தொடரின் பரந்த பொருளைப் பாதுகாக்கிறது.
