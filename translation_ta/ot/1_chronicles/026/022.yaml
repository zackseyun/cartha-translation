source:
  edition: WLC
  text: בְּנֵ֖י יְחִֽיאֵלִ֑י זֵתָם֙ וְ/יוֹאֵ֣ל אָחִ֔י/ו עַל אֹצְר֖וֹת בֵּ֥ית יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/022.yaml
  text: 'The sons of Jehieli: Zetham and Joel his brother were over the treasuries of the house of Yahweh[a].'
translation:
  language: ta
  text: 'யெகியேலியின் மகன்கள்: சேத்தாமும் அவன் சகோதரன் யோவேலும் யாவேயின் இல்லத்தின் கருவூலங்களுக்குப் பொறுப்பாயிருந்தார்கள்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “யாவேயின் இல்லம்”; மரபாக, “ஆண்டவரின் இல்லம்” என்றும் மொழிபெயர்க்கப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי יְחִיאֵלִי
  choice: யெகியேலியின் மகன்களான
  rationale: בְּנֵי என்பது ‘மகன்கள்’ என்ற நேரடிப் பொருளில் எடுக்கப்பட்டுள்ளது; יְחִיאֵלִי இங்கு தனிப்பெயராகப் புரிந்துகொள்ளப்படுகிறது.
- source_word: זֵתָם וְיוֹאֵל
  choice: சேத்தாமும் ... யோவேலும்
  rationale: இரு எபிரெயத் தனிப்பெயர்களும் தமிழில் ஒலிபெயர்க்கப்பட்டு, וְ இணைப்புச்சொல் ‘உம்’ மூலம் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: אָחִיו
  choice: அவன் சகோதரன்
  rationale: மூலத்தில் மூன்றாம் நபர் ஆண்பால் ஒருமை உடைமை விகுதி உள்ளது; எனவே பன்மையாக மாற்றாமல், யோவேலைச் சேத்தாமின் சகோதரனாகக் காட்டும் ஒருமை வடிவம் தக்கவைக்கப்பட்டுள்ளது.
- source_word: עַל אֹצְרוֹת
  choice: கருவூலங்களுக்குப் பொறுப்பாயிருந்தார்கள்
  rationale: நிர்வாகச் சூழலில் עַל என்பது மேற்பார்வை அல்லது பொறுப்பைக் குறிக்கிறது; אֹצְרוֹת நிறுவனச் சார்ந்த சேமிப்பு/செல்வக் கருவூலங்களைக் குறிக்கிறது.
- source_word: בֵּית יְהוָה
  choice: யாவேயின் இல்லத்திலுள்ள
  rationale: בֵּית என்பதன் ‘இல்லம்’ என்ற உருவகம் காக்கப்பட்டுள்ளது; יהוה என்ற உடன்படிக்கைப் பெயர் ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டுள்ளது. கருவூலங்களுக்கும் இல்லத்திற்கும் உள்ள உறவை இயல்பான தமிழில் ‘இல்லத்திலுள்ள’ எனத் தருகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் நான்கெழுத்து இறைப்பெயர் நேரடியாக இருப்பதால், பட்டப்பெயரால் மாற்றாமல் தமிழில் ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டுள்ளது.
- issue: בֵּית יְהוָה என்பதிலுள்ள ‘இல்லம்’ உருவகம்
  choice: யாவேயின் இல்லம்
  alternative: யாவேயின் ஆலயம்
  rationale: சூழலில் ஆலயம் குறிக்கப்பட்டாலும், எபிரெய மூலத்தின் ‘இல்லம்’ என்ற சொற்படிமத்தைப் பாதுகாக்க இவ்வடிவம் தேர்ந்தெடுக்கப்பட்டது; அதன் சூழற்பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
translation_notes:
  register: இயல்பான நவீனத் தரத் தமிழில், நிர்வாகப் பொறுப்பைக் குறிக்கும் தெளிவான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் ஒருமைச் சுட்டான ‘அவன் சகோதரன்’ மற்றும் ‘யாவேயின் இல்லம்’ என்ற உருவகம் பாதுகாக்கப்பட்டுள்ளன.
