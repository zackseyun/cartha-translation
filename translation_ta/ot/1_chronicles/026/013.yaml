base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/013.yaml
  text: And they cast lots[a], small and great alike, according to their fathers’ houses, for each gate.
translation:
  language: ta
  text: அவர்கள் சிறியவர் பெரியவர் என்ற வேறுபாடின்றி, தங்கள் தந்தைவழிக் குடும்பங்களின்படி, ஒவ்வொரு வாசலுக்கும் சீட்டுப் போட்டார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “வாசல் வாசலாக” என்றும் மொழிபெயர்க்கலாம்; பகிர்வுப் பொருளை வலியுறுத்த ஒருமைச் சொல் திரும்பக் கூறப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּפִּילוּ גוֹרָלוֹת
  choice: சீட்டுப்போட்டார்கள்
  rationale: נפל என்பதன் ஹிபீல் வடிவமும் גוֹרָלוֹת என்பதும் சேர்ந்துள்ள எபிரெய மரபுத்தொடருக்கு இயல்பான தமிழ் இணை; பங்கீட்டு முடிவுக்காகச் சீட்டிடுதலைக் குறிக்கிறது.
- source_word: כַּקָּטֹן כַּגָּדוֹל
  choice: சிறியவர் பெரியவர் என்ற வேறுபாடின்றி
  rationale: வயதைத் திட்டவட்டமாகக் குறிப்பிடாமல், நிலையோ முக்கியத்துவமோ சார்ந்த வேறுபாடு இன்றி அனைவரும் சமமாகப் பங்கேற்ற கருத்தைப் பாதுகாக்கிறது.
- source_word: לְבֵית אֲבוֹתָם
  choice: தங்கள் தந்தைவழிக் குடும்பங்களின்படி
  rationale: தந்தைவழி மூதாதைக் குடும்பப் பிரிவுகளின் அடிப்படையில் செய்யப்பட்ட ஒழுங்கைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: לְשַׁעַר וָשָׁעַר
  choice: ஒவ்வொரு வாசலுக்கும்
  rationale: ஒருமைச் சொல்லின் எபிரெய மறுபதிப்பு தரும் பகிர்வுப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
