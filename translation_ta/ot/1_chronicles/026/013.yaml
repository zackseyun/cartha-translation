translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியக்கூடிய அதேவேளையில் கண்ணியமான நடை. ‘தந்தைவழிக் குடும்பங்கள்’ என்பது வரலாற்றுக் குடும்ப அமைப்பைத் தெளிவாக்குகிறது; ‘சிறியவர் பெரியவர்’ என்ற மூலமொழி எதிரிணையின் பொருள் ‘வேறுபாடின்றி’ என்பதால் இயல்பாக வெளிப்படுத்தப்பட்டது.
