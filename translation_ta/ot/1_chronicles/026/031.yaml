base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/031.yaml
  text: For the Hebronites[a], Jeriah was the chief of the Hebronites according to his generations by fathers’ houses. In the fortieth year of David’s reign they were sought out[c][b], and among them mighty men of valor were found at Jazer of Gilead.
translation:
  language: ta
  text: எப்ரோனியர்களைப் பொறுத்தவரை,[a] எரியா தம் வம்சவரிசையின்படியும் தந்தைவழிக் குடும்பங்களின்படியும்[b] எப்ரோனியரின் தலைவராக இருந்தார். தாவீதின் ஆட்சியின் நாற்பதாம் ஆண்டில் அவர்களைத் தேடி விசாரித்தபோது, கீலேயாத்திலுள்ள யாசேரில் அவர்களிடையே வலிமையும் வீரமும் மிக்க ஆண்கள்[c] கண்டறியப்பட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எப்ரோனியர்களில் எரியா தலைவராக இருந்தார்.”
    reason: lexical_alternative
  - marker: b
    text: “தந்தைவழிக் குடும்பங்கள்” என்பது தனிக் குடும்பங்களை மட்டும் குறிக்காமல், ஒரு பொதுவான மூதாதையரிடமிருந்து வந்த விரிவான குலப் பிரிவுகளைக் குறிக்கும்.
    reason: cultural_note
  - marker: c
    text: அல்லது, “வலிமைமிக்க வீரர்கள்” அல்லது “திறமைமிக்க ஆண்கள்.” எபிரெயச் சொற்றொடர் வலிமை, வீரம், அல்லது நிரூபிக்கப்பட்ட திறமை ஆகியவற்றில் சிறந்தவர்களைக் குறிக்கலாம்.
    reason: lexical_alternative
