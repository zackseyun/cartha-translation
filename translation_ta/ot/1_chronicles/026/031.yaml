  rationale: דרש என்ற வினையின் நிபால் வடிவம் முறையான தேடல், விசாரணை அல்லது பதிவாய்வைக் குறிக்கலாம். வெறுமனே உடல்ரீதியாகத் தேடப்பட்டார்கள் என்று குறுக்காமல் அதன் நிர்வாகச் சூழலை வெளிப்படுத்துகிறது.
- source_word: וַיִּמָּצֵא בָהֶם
  choice: அவர்களிடையே ... இருப்பது கண்டறியப்பட்டது
  rationale: எபிரெய ஒருமை வினையின் இருப்பு/கண்டறிதல் சார்ந்த இயல்பற்ற கட்டமைப்பைத் தமிழில் இயல்பான செயப்பாட்டு வடிவில் தருகிறது.
- source_word: גִּבּוֹרֵי חַיִל
  choice: வலிமையும் வீரமும் மிக்க ஆண்கள்
  rationale: இந்த நிலையான சொற்றொடர் உடல் வலிமை, போர்வீரம் அல்லது நிரூபிக்கப்பட்ட திறமை ஆகியவற்றைக் குறிக்கக்கூடும்; தேர்வு அதன் பரந்த பொருள் வட்டத்தைப் பாதுகாக்கிறது.
- source_word: בְּיַעְזֵיר גִּלְעָד
  choice: கீலேயாத்திலுள்ள யாசேரில்
  rationale: இரு இடப்பெயர்களின் உறவை இயல்பான தமிழில் தெளிவாக்குகிறது; யாசேர் கீலேயாத் பகுதியில் உள்ள இடமாகக் காட்டப்படுகிறது.
