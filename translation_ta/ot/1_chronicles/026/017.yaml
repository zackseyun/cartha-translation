base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/017.yaml
  text: On the east were six Levites; on the north[a], four a day; on the south, four a day; and at the storehouses, two by two.
translation:
  language: ta
  text: 'கிழக்குப் பக்கத்தில் லேவியர்கள் ஆறு பேர்; வடக்குப் பக்கத்தில் நாள்தோறும் நான்கு பேர்; தெற்குப் பக்கத்தில் நாள்தோறும் நான்கு பேர்; சேமிப்பறைகளில்[a] இரண்டிரண்டு பேர்.


    [a] எபிரெயத்தில் “அசுப்பீம்.” இது பொதுவான சேமிப்பறைகளைக் குறிக்காமல், ஒரு குறிப்பிட்ட இடத்தின் பெயரையோ அறைகளின் தொகுதியையோ குறிக்கக்கூடும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் “அசுப்பீம்.” இது பொதுவான சேமிப்பறைகளைக் குறிக்காமல், ஒரு குறிப்பிட்ட இடத்தின் பெயரையோ அறைகளின் தொகுதியையோ குறிக்கக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמִּזְרָח
  choice: கிழக்குப் பக்கத்தில்
  rationale: திசையைக் குறிக்கும் சொல்லுடன் சேர்ந்த முன்னொட்டு, இங்கு பணியமர்த்தப்பட்ட இடத்தைக் குறிக்கிறது; பட்டியலின் அமைப்புக்கு ஏற்ற இயல்பான தமிழ்.
- source_word: הַלְוִיִּם שִׁשָּׁה
  choice: லேவியர்கள் ஆறு பேர்
  rationale: கிழக்குப் பக்கத்தில் நியமிக்கப்பட்ட லேவியர்களின் எண்ணிக்கையைத் தெளிவாகக் காட்டுகிறது; மனிதர்களை எண்ணும் தமிழ்ச் சொல்லான “பேர்” சேர்க்கப்பட்டுள்ளது.
- source_word: לַצָּפוֹנָה ... לַנֶּגְבָּה
  choice: வடக்குப் பக்கத்தில் ... தெற்குப் பக்கத்தில்
  rationale: கிழக்குப் பக்கத்துடன் இணையான இடவியல் அமைப்பை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: לַיּוֹם
  choice: நாள்தோறும்
  rationale: நிர்வாகப் பணிப்பங்கீட்டுச் சூழலில் ஒவ்வொரு நாளுக்கும் உரிய எண்ணிக்கை என்ற பகிர்வுப் பொருளைத் தருகிறது.
- source_word: וְלָאֲסֻפִּים
  choice: சேமிப்பறைகளில்[a]
  rationale: இந்தச் சொல் ஆலய வளாகத்திலிருந்த சேமிப்பறைகள் அல்லது அறைத்தொகுதியைக் குறிக்கலாம். பொருள் உறுதியற்றதால் மாற்று வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: שְׁנַיִם שְׁנָיִם
  choice: இரண்டிரண்டு பேர்
  rationale: எண்ணின் இரட்டிப்பு பகிர்வுப் பொருளைக் கொண்டது; ஒவ்வொரு பிரிவிலும் அல்லது இடத்திலும் இருவர் என்ற கருத்தை இயல்பான தமிழில் தருகிறது.
