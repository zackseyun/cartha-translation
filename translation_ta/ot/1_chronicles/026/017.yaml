translation_notes:
  register: நவீனத் தரத் தமிழில், நிர்வாகப் பணிப்பங்கீட்டின் சுருக்கமான பட்டியல் அமைப்பு பாதுகாக்கப்பட்டுள்ளது. மூலத்தில் பின்னைய பகுதிகளில் விடுபட்டுள்ள “லேவியர்கள்/பேர்” என்ற கருத்து தமிழில் புரிதலுக்காக அளவாக வெளிப்படுத்தப்பட்டுள்ளது; விவாதத்திற்குரிய אֲסֻפִּים என்பதன் பொருள் அடிக்குறிப்பில் திறந்த நிலையில் வைக்கப்பட்டுள்ளது.
