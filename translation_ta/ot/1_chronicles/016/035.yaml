source:
  edition: WLC
  text: וְ/אִמְר֕וּ הוֹשִׁיעֵ֨/נוּ֙ אֱלֹהֵ֣י יִשְׁעֵ֔/נוּ וְ/קַבְּצֵ֥/נוּ וְ/הַצִּילֵ֖/נוּ מִן הַ/גּוֹיִ֑ם לְ/הֹדוֹת֙ לְ/שֵׁ֣ם קָדְשֶׁ֔/ךָ לְ/הִשְׁתַּבֵּ֖חַ בִּ/תְהִלָּתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/035.yaml
  text: And say[a], “Save us, O God of our salvation; gather us and deliver us from the nations[b], that we may give thanks to your holy name and glory in your praise.”
translation:
  language: ta
  text: 'மேலும் சொல்லுங்கள்: “எங்கள் மீட்பின் கடவுளே, எங்களைக் மீட்டருளும்; எங்களை ஒன்றுசேர்த்து, தேசங்களிலிருந்து விடுவித்தருளும்; உமது பரிசுத்தப் பெயருக்கு நன்றி செலுத்தவும், உமது புகழில் பெருமை கொள்ளவும் எங்களை அருளும்.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִמְרוּ
  choice: மேலும் சொல்லுங்கள்
  rationale: பன்மை ஏவல் வடிவத்தையும் முந்தைய வழிபாட்டு ஓட்டத்துடன் இணைக்கும் וְ என்ற இணைப்பையும் இயல்பான தமிழில் காக்கிறது.
- source_word: הוֹשִׁיעֵנוּ
  choice: எங்களை மீட்டருளும்
  rationale: ישׁע என்பதன் இரட்சிப்பு/மீட்பு பொருளைக் கண்ணியமான வேண்டுதல் நடையில் தருகிறது; பின்னுள்ள נצל என்பதற்கு ‘விடுவித்தருளும்’ என்று வேறுபாடு பேணப்படுகிறது.
- source_word: אֱלֹהֵי יִשְׁעֵנוּ
  choice: எங்கள் மீட்பின் கடவுளே
  rationale: ‘எங்கள் மீட்பின் கடவுள்’ என்ற எபிரேய உடைமைத் தொடரைத் தக்கவைத்து, அழைப்பைத் தமிழின் விளிவடிவில் இயல்பாகக் காட்டுகிறது.
- source_word: וְקַבְּצֵנוּ
  choice: எங்களை ஒன்றுசேர்த்து
  rationale: சிதறியவர்களைத் திரட்டுதல் என்ற קבץ சொல்லின் சாத்தியமான மீள்சேர்ப்பு நுண்ணுணர்வைத் தக்கவைக்கிறது.
- source_word: וְהַצִּילֵנוּ
  choice: விடுவித்தருளும்
  rationale: נצל என்பதன் ஆபத்து அல்லது பகைமை அதிகாரத்திலிருந்து மீட்கும் பொருளைத் தருவதோடு, முன் வரும் ישׁע உடன் சொல்வேறுபாட்டையும் பேணுகிறது.
- source_word: מִן־הַגּוֹיִם
  choice: பிற தேசங்களிலிருந்து
  rationale: இங்கு גוים என்பது இஸ்ரவேல் சிதறியிருக்கக்கூடிய சுற்றியுள்ள பிற மக்கள்/தேசங்களைக் குறிக்கிறது; பிற்கால சமயப் பிரிவை இறக்குமதி செய்யாமல் வரலாற்றுச் சூழலைக் காட்டுகிறது.
- source_word: לְהוֹדוֹת
  choice: அப்போது நாங்கள் ... நன்றி செலுத்தி
  rationale: לְ நோக்கத்தைக் குறிக்கிறது; தமிழில் மீட்பின் நோக்கம் அல்லது விளைவைக் காட்ட ‘அப்போது’ இயல்பாக அமைந்து, ידה என்பதற்கு ‘நன்றி செலுத்து’ பொருந்துகிறது.
- source_word: לְשֵׁם קָדְשֶׁךָ
  choice: உமது பரிசுத்தப் பெயருக்கு
  rationale: ‘உமது பரிசுத்தப் பெயர்’ என்ற மரியாதைமிக்க வழக்கைத் தக்கவைத்து, நன்றி செலுத்துதல் என்ற வினைக்கேற்ற ‘-க்கு’ உருபைப் பயன்படுத்துகிறது.
- source_word: לְהִשְׁתַּבֵּחַ
  choice: பெருமகிழ்ச்சி கொள்வோம்
  rationale: Hitpael வடிவம் தெரிவிக்கும் கடவுளுடைய புகழில் களித்துப் பெருமிதம் கொள்ளும் நேர்மறைப் பொருளை, தற்பெருமை என்ற எதிர்மறை ஒலியின்றி இயல்பான தமிழில் தருகிறது.
- source_word: בִּתְהִלָּתֶךָ
  choice: உமது புகழில்
  rationale: בְּ என்ற முன்னிடைச்சொல்லையும் תהלה என்பதன் ‘புகழ்/துதி’ சார்ந்த பொருளையும் காக்கிறது; இங்கு கடவுளின் புகழத்தக்க மேன்மையிலும் அவருக்குச் செலுத்தப்படும் துதியிலும் மகிழ்தல் என்ற இரு நிழல்களும் சாத்தியம்.
theological_decisions:
- issue: הַגּוֹיִם என்பதை ‘புறவினத்தார்’ என்று சமய வகைப்பாடாக மொழிபெயர்ப்பதா
  choice: பிற தேசங்களிலிருந்து
  alternative: புறவினத்தாரிடமிருந்து
  rationale: இந்தப் பழைய ஏற்பாட்டுச் சூழலில், இச்சொல் இஸ்ரவேல் சிதறியுள்ள பிற மக்கள் அல்லது தேசங்களைக் குறிக்கிறது. பிற்கால யூதர்/புறவினத்தார் என்ற இறையியல் எதிர்வை உரைக்குள் சேர்க்காமல் வரலாற்றுப் பொருளைப் பேணுகிறது.
- issue: לְהִשְׁתַּבֵּחַ בִּתְהִלָּתֶךָ என்பதிலுள்ள பெருமை/களிப்பு மொழி
  choice: உமது புகழில் பெருமகிழ்ச்சி கொள்வோம்
  alternative: உமது புகழில் பெருமை கொள்வோம்
  rationale: எபிரேயம் கடவுளுடைய புகழில் களித்துப் பெருமிதம் கொள்வதைக் குறிக்கிறது. ‘பெருமகிழ்ச்சி’ நேர்மறையான களிப்பைத் தெளிவாக்குகிறது; எனினும் ‘பெருமை கொள்வோம்’ என்ற நெருக்கமான வடிவமும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுமக்கள் புரிந்துகொள்ளும் கண்ணியமான வழிபாட்டு நடை பயன்படுத்தப்பட்டுள்ளது. ‘உமது’, ‘மீட்டருளும்’, ‘விடுவித்தருளும்’ ஆகியவை வேண்டுதலின் மரியாதைத் தொனியைப் பேணுகின்றன. மூலத்தின் பன்மை ஏவலும் கூட்டுச் செபத் தன்மையும் காக்கப்பட்டுள்ளன; இறுதிக் கூறின் ‘பெருமை/களிப்பு’ சார்ந்த உண்மையான பொருள் அடிக்குறிப்பில் திறந்தவாறு வைக்கப்பட்டுள்ளது.
