- from: 'மேலும் சொல்லுங்கள்: “எங்கள் மீட்பின் கடவுளே, எங்களை மீட்டருளும்; பிற தேசங்களிலிருந்து[a] எங்களை ஒன்றுசேர்த்து விடுவித்தருளும். அப்போது நாங்கள் உமது பரிசுத்தப் பெயருக்கு நன்றி செலுத்தி, உமது புகழில் பெருமகிழ்ச்சி கொள்வோம்[b].”'
  to: 'மேலும் சொல்லுங்கள்: “எங்கள் மீட்பின் கடவுளே, எங்களைக் மீட்டருளும்; எங்களை ஒன்றுசேர்த்து, தேசங்களிலிருந்து விடுவித்தருளும்; உமது பரிசுத்தப் பெயருக்கு நன்றி செலுத்தவும், உமது புகழில் பெருமை கொள்ளவும் எங்களை அருளும்.”'
  rationale: இறுதியில் மூலத்தில் உள்ள நோக்கக் கூறைத் தமிழில் வெளிப்படையாக்க, ‘அப்போது ... கொள்வோம்’ என்பதற்குப் பதிலாக ‘...வும் ...வும் எங்களை அருளும்’ என மாற்றப்பட்டுள்ளது. இதனால் வேண்டுதலின் தொடர்ச்சியும், நன்றி செலுத்துதல் மற்றும் புகழில் பெருமை கொள்ளுதல் மீட்பின் நோக்கங்கள் என்பதும் காக்கப்படுகின்றன. ‘பிற’ நீக்கப்பட்டு, தேசங்களைக் குறிக்கும் சொல் மூலத்திற்கு நெருக்கமாக வைக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறியீடுகள் முறையே ‘தேசங்கள்’ மற்றும் இறுதி ‘பெருமை கொள்ள’ ஆகியவற்றில் இணைக்கப்பட வேண்டும்.
