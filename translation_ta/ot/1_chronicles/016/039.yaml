  - severity: medium
    issue: ‘யெகோவாவின் திருவாசஸ்தலம்’
    rationale: மִשְׁכָּן என்பது இச்சூழலில் குறிப்பான கூடார-பரிசுத்தஸ்தலத்தைச் சுட்டுகிறது. ‘திருவாசஸ்தலம்’ பரந்த பொருளுடையது; ‘திருக்கூடாரம்’ மூலத்தின் குறிப்பைத் தெளிவாகக் காக்கிறது.
