  text: And Zadok the priest and his fellow priests were before the tabernacle of Yahweh at the high place that was in Gibeon,[a]
translation:
  language: ta
  text: ஆசாரியராகிய சாதோக்கையும் அவருடைய சக ஆசாரியர்களையும் கிபியோனிலிருந்த மேட்டிடத்தில் உள்ள யெகோவாவின் திருக்கூடாரத்தின் முன்பாக இருக்கும்படி விட்டுவைத்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில்: “அவருடைய சகோதரர்களாகிய ஆசாரியர்கள்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵת
  choice: …ஐயும்
  rationale: முந்தைய வசனத்தின் வினையைத் தொடர்ந்து வரும் நேரடிச் செயப்படுபொருளைக் குறிக்கும் அமைப்பு; வாவ் இணைப்பை ‘-யும்’ வெளிப்படுத்துகிறது, אֵת தனியாக மொழிபெயர்க்கப்படவில்லை.
- source_word: צָדוֹק הַכֹּהֵן
  choice: குருவாகிய சாதோக்
  rationale: தனிப்பெயர் தமிழில் வழக்கமான ஒலிபெயர்ப்பில் தரப்பட்டு, definite title இயல்பான தமிழில் அடைமொழித் தொடராக மொழிபெயர்க்கப்பட்டது.
- source_word: וְאֶחָיו הַכֹּהֲנִים
  choice: அவருடைய சக குருக்கள்
  rationale: சொல்லளவில் ‘அவருடைய சகோதரர்கள், குருக்கள்’; இச்சூழலில் உடன்பணியாற்றும் குருக்களைக் குறிப்பதால் இயல்பான தமிழில் ‘சக குருக்கள்’ எனப்பட்டது.
- source_word: לִפְנֵי
  choice: முன்பாக
  rationale: திருவாசஸ்தலத்தின் முன்னிலையில் அல்லது அதன் முன் உள்ள இடத்தைக் குறிக்கும் இடவியல் பொருளைப் பாதுகாக்கிறது.
- source_word: מִשְׁכַּן יְהוָה
  choice: யெகோவாவின் திருவாசஸ்தலம்
  rationale: מִשְׁכָּן என்பது உறைவிடம் அல்லது வாசஸ்தலம்; இங்கு புனிதக் கூடாரத்தைச் சுட்டுவதால் ‘திருவாசஸ்தலம்’ தெளிவாகவும் மரியாதையான நடையிலும் உள்ளது. தெய்வீகப் பெயர் ஒலிபெயர்க்கப்பட்டது.
- source_word: בַּבָּמָה
  choice: மேட்டிடம்
  rationale: வழிபாட்டுக்குரிய உயர்ந்த இடத்தைக் குறிக்கும் בָּמָה என்பதற்கு, பின்னைய எதிர்மறை மதிப்பீட்டை இங்கு திணிக்காமல் ‘மேட்டிடம்’ பயன்படுத்தப்பட்டது.
- source_word: אֲשֶׁר בְּגִבְעוֹן
  choice: கிபியோனிலிருந்த
  rationale: மேட்டிடத்தின் இருப்பிடத்தைச் சுட்டும் தொடர்புத் தொடரைச் சுருக்கமான, இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: יהוה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே
  rationale: எபிரெய மூலத்தில் நான்கு எழுத்துத் தெய்வீகப் பெயர் நேரடியாக உள்ளது. பொதுவான தமிழ் வேதாகமப் பயன்பாட்டில் அறியப்பட்ட ‘யெகோவா’ ஒலிவடிவம் தேர்ந்தெடுக்கப்பட்டது; பெயரை ‘கர்த்தர்’ என்ற பட்டமாக மாற்றவில்லை.
- issue: אֶחָיו என்பதன் உறவுப் பொருள்
  choice: சக குருக்கள்
  alternative: அவருடைய சகோதரர்களாகிய குருக்கள்
  rationale: இந்த நிர்வாக மற்றும் வழிபாட்டுச் சூழலில் உயிரியல் சகோதரர்கள் என்பதைக் காட்டிலும் அதே குருத்துவக் குழுவைச் சேர்ந்தவர்கள் என்ற பொருள் இயல்பானது; சொல்லளவிலான வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- issue: முந்தைய வசனத்திலிருந்து தொடரும் மறை வினை
  choice: இருக்கும்படி விட்டுவைத்தார்
  alternative: நியமித்தார்
  rationale: இவ்வசனம் தனித்து வினைச்சொல் இல்லாமல் முந்தைய தொடரின் செயலை ஏந்துகிறது. தமிழில் முழு வாக்கியமாகப் புரிய ‘விட்டுவைத்தார்’ நிரப்பப்பட்டது; ‘நியமித்தார்’ என்று பணியின் தன்மையை அதிகமாகத் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் மரியாதையும் வாசிப்புத் தெளிவும் காக்கப்பட்டுள்ளன. எபிரெயத்தில் இவ்வசனத்துக்குள் வெளிப்படையான வினை இல்லாததால், முந்தைய வசனத்திலிருந்து தொடரும் கருத்தைத் தமிழில் முழுமைப்படுத்த ‘இருக்கும்படி விட்டுவைத்தார்’ சேர்க்கப்பட்டது. ‘திருவாசஸ்தலம்’ என்பது புனிதக் கூடாரத்தைக் குறிக்கிறது.
