revisions:
- from: குருவாகிய சாதோக்கையும் அவருடைய சக குருக்களையும் கிபியோனிலிருந்த மேட்டிடத்தில், யெகோவாவின் திருவாசஸ்தலத்திற்கு முன்பாக இருக்கும்படி விட்டுவைத்தார்.[a]
  to: ஆசாரியராகிய சாதோக்கையும் அவருடைய சக ஆசாரியர்களையும் கிபியோனிலிருந்த மேட்டிடத்தில் உள்ள யெகோவாவின் திருக்கூடாரத்தின் முன்பாக இருக்கும்படி விட்டுவைத்தார்.[a]
  rationale: குரு/திருவாசஸ்தலம் ஆகிய பரந்த அல்லது வேறு சாயலுடைய சொற்களுக்குப் பதிலாக, மூலத்தின் ஆசாரியப் பதவியையும் கூடாரத்தையும் துல்லியமாகக் குறிக்கும் ‘ஆசாரியர்’ மற்றும் ‘திருக்கூடாரம்’ பயன்படுத்தப்பட்டன. மற்றபடி முந்தைய வசனத்திலிருந்து தொடரும் செயல், யெகோவா என்ற பெயர், கிபியோனிலுள்ள மேட்டிடம், மற்றும் אֶחָיו என்பதற்கான சொல்லளவு மாற்று ஆகியவை பாதுகாக்கப்பட்டுள்ளன.
