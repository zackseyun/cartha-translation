source:
  edition: WLC
  text: יִשְׂמְח֤וּ הַ/שָּׁמַ֨יִם֙ וְ/תָגֵ֣ל הָ/אָ֔רֶץ וְ/יֹאמְר֥וּ בַ/גּוֹיִ֖ם יְהוָ֥ה מָלָֽךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/031.yaml
  text: Let the heavens rejoice[a], and let the earth be glad; and let them say among the nations, “Yahweh reigns!”
translation:
  language: ta
  text: 'வானங்கள் மகிழட்டும்;

    பூமி களிகூரட்டும்;

    தேசங்களிடையே,

    “யாவே[a] அரசாளுகிறார்![b]”

    என்று சொல்லட்டும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெய மொழியில்: יהוה (YHWH), இறைவனின் தனிப்பெயர்; இங்கு “யாவே” என்று ஒலிபெயர்க்கப்பட்டுள்ளது.'
    reason: divine_name
  - marker: b
    text: “அரசரானார்!” என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல் நிலவும் அரசாட்சியை அல்லது அரசராக ஏற்றதைக் குறிக்கக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: יִשְׂמְחוּ
  choice: மகிழட்டும்
  rationale: שׂמח என்பதன் Qal imperfect இங்கு கவிதைநடையிலான விருப்பம் அல்லது அழைப்பைக் குறிக்கிறது; “மகிழட்டும்” அந்த வலிமையை இயல்பான தமிழில் தருகிறது.
- source_word: הַשָּׁמַיִם
  choice: வானங்கள்
  rationale: שׁמים பன்மை வடிவத்தில் உள்ளது; பூமியுடன் அமைந்துள்ள பிரபஞ்ச அளவிலான இணைப்பையும் உயர்ந்த கவிதை நடையையும் “வானங்கள்” காக்கிறது.
- source_word: וְתָגֵל
  choice: பூமி களிகூரட்டும்
  rationale: גיל மிகுந்த மகிழ்ச்சி அல்லது களிப்பைக் குறிக்கிறது. முந்தைய “மகிழட்டும்” என்பதைக் காரணமின்றி மீண்டும் கூறாமல் கவித்துவ இணைநிலையைப் பாதுகாக்க “களிகூரட்டும்” பயன்படுத்தப்பட்டுள்ளது.
- source_word: הָאָרֶץ
  choice: பூமி
  rationale: “வானங்கள்” என்பதற்கு இணையாக இங்கு ארץ உள்ளூர் நிலப்பகுதியை அல்ல, பூமியையே குறிக்கிறது.
- source_word: וְיֹאמְרוּ
  choice: அவர்கள் சொல்லட்டும்
  rationale: אמר என்பதன் மூன்றாம் நபர் ஆண்பால் பன்மை imperfect, முன் வரும் விருப்பவினைத் தொடரைத் தொடர்கிறது. எபிரெயத்தில் உள்ள பன்மை எழுவாயை வெளிப்படையாகக் காக்க “அவர்கள்” சேர்க்கப்பட்டுள்ளது.
- source_word: בַגּוֹיִם
  choice: தேசங்களிடையே
  rationale: גוים உலக மக்களினங்களையும் தேசங்களையும் பொதுவாகக் குறிக்கிறது; “தேசங்களிடையே” பொதுவெளியில் செய்யப்படும் அறிவிப்பின் பொருளை இயல்பாகத் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எழுத்துகளைக் கொண்ட இறைப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரிந்துகொள்ளக்கூடிய ஒலிபெயர்ப்பாக “யாவே” வழங்குகிறது.
- source_word: מָלָךְ
  choice: அரசாளுகிறார்
  rationale: இந்தப் புகழ்ச்சிச் சூழலில் מלך என்பதன் perfect வடிவம் கடவுளுடைய அரசாட்சியை நிகழ்கால உண்மையாக அறிவிக்க முடியும்; “அரசாளுகிறார்” தமிழில் இயல்பாகவும் வலிமையாகவும் உள்ளது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலவசனம் இறைவனின் தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைக் காக்கிறது.
- issue: מָלָךְ என்பதன் காலம் மற்றும் அரசேற்ற நுணுக்கம்
  choice: அரசாளுகிறார்
  alternative: அரசரானார்
  rationale: perfect வடிவத்தை “அரசரானார்” என்றும் புரிந்துகொள்ள முடியும்; ஆனால் புகழ்ச்சியிலும் அரசாட்சி அறிவிப்பிலும் அது நிலவும் அரசாட்சியை அறிவிக்கலாம். பிரதான உரை இயல்பான நிகழ்கால அறிவிப்பைத் தருகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன தரமான தமிழில், பொதுவாசகர்களுக்குப் புரியும் உயரிய கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மூலத்தின் மூன்று விருப்பவினை அழைப்புகளும், வானங்கள்–பூமி என்ற இணை அமைப்பும், தேசங்களிடையேயான பொது அறிவிப்பும் காக்கப்பட்டுள்ளன.
