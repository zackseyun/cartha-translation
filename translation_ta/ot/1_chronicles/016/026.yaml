id: 1CH.16.26
reference: 1 Chronicles 16:26
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: כִּ֠י כָּל אֱלֹהֵ֤י הָ/עַמִּים֙ אֱלִילִ֔ים וַ/יהוָ֖ה שָׁמַ֥יִם עָשָֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/026.yaml
  text: For all the gods of the peoples are idols[b][a], but Yahweh made the heavens.
translation:
  language: ta
  text: ஏனெனில் மக்களினங்களின் தெய்வங்கள் அனைத்தும் விக்கிரகங்களே; ஆனால் யாவே வானங்களை உண்டாக்கினார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: சுற்றியுள்ள துதிக்கான அழைப்புக்கு இவ்வசனம் காரணம் அளிப்பதால், எபிரெயச் சொல்லின் விளக்கக் காரணத் தொடர்பை இயல்பான தமிழில் காக்கிறது.
- source_word: כָּל
  choice: அனைத்தும்
  rationale: கூற்றின் முழுமையான பரப்பைத் தக்கவைக்கிறது.
- source_word: אֱלֹהֵי הָעַמִּים
  choice: மக்களினங்களின் தெய்வங்கள்
  rationale: இங்கு பல்வேறு மக்களினங்கள் வழிபடும் தெய்வங்களைக் குறிக்கிறது; ‘மக்களினங்கள்’ என்பது அரசியல் சார்ந்த ‘நாடுகள்’ என்பதைக் காட்டிலும் עַמִּים என்பதன் சமூகக் குழு உணர்வை நெருக்கமாகத் தருகிறது.
- source_word: אֱלִילִים
  choice: சிலைகளே
  rationale: இச்சொல் விக்கிரகங்களையும் அவற்றின் பயனற்ற தன்மையையும் இழிவாகக் குறிக்கலாம். ‘சிலைகள்’ என்பது தெளிவான, இயல்பான தமிழ்; ‘-ஏ’ எதிர்மறை ஒப்பீட்டை வலுப்படுத்துகிறது, ஆனால் ‘பயனற்றவை’ என்ற விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: וַיהוָה
  choice: ஆனால் யாவே
  rationale: וְ என்பதன் அடிப்படைப் பொருள் ‘மற்றும்’ என்றாலும், பொய்த் தெய்வங்களுக்கும் வானங்களை உண்டாக்கிய யாவேக்கும் இடையிலான எதிர்மறைத் தொடர்பை இங்கு ‘ஆனால்’ இயல்பாக வெளிப்படுத்துகிறது. יהוה என்பது பெயராக ‘யாவே’ என ஒலிபெயர்க்கப்படுகிறது.
- source_word: שָׁמַיִם
  choice: வானங்களை
  rationale: எபிரெய வடிவத்தின் பன்மைத் தோற்றத்தையும் படைப்புச் சூழலையும் காக்கிறது.
- source_word: עָשָׂה
  choice: உண்டாக்கினார்
  rationale: ‘செய்தார்/உண்டாக்கினார்’ என்ற பொதுப் பொருளைத் தருகிறது; மூலத்தில் உள்ள עשה என்பதைக் காட்டிலும் குறிப்பான ‘படைத்தார்’ என்பதைத் தேவையின்றி இறக்குமதி செய்யவில்லை.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூல உரை நான்கெழுத்து இறைப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. அதை ஒரு பட்டப்பெயராக மாற்றாமல், உடன்படிக்கைப் பெயராகத் தமிழில் ஒலிபெயர்க்கிறது.
- issue: יהוה-க்கு முன் உள்ள וְ இணைப்பின் வலிமை
  choice: 'எதிர்மறை இணைப்பு: ‘ஆனால்’'
  alternative: 'எளிய இணைப்பு: ‘மற்றும்’'
  rationale: மக்களினங்களின் தெய்வங்கள் சிலைகள் என்பதையும் யாவே வானங்களை உண்டாக்கினார் என்பதையும் வசனம் எதிரெதிராக நிறுத்துகிறது. எனவே தமிழில் ‘ஆனால்’ உரையாடல் தொடர்பைத் தெளிவாகக் காக்கிறது.
- issue: אֱלִילִים என்பதன் இழிவுப் பொருள்
  choice: சிலைகள்
  alternative: பயனற்ற சிலைகள் / வெறுமையானவை
  rationale: மூலச்சொல்லில் பயனற்ற தன்மையின் இழிவுணர்வு இருக்கலாம்; எனினும் அதை வெளிப்படையான பெயரடையாகச் சேர்ப்பது விளக்கத்தை அதிகரிக்கும். ‘சிலைகளே’ என்ற வடிவம் படைப்பாளரான யாவேவுடனான எதிர்மறையைத் தெளிவாக வைத்திருக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் விதமாகவும் வேதாகமக் கவிதைநடைக்கு ஏற்ற கண்ணியத்துடனும் மொழியாக்கப்பட்டது. மூலத்தின் சுருக்கமான இருபகுதி எதிர்மறை அமைப்பு காக்கப்பட்டுள்ளது.
