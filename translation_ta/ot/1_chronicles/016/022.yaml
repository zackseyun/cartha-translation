base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/022.yaml
  text: Do not touch my anointed ones[a], and do not harm my prophets.
translation:
  language: ta
  text: '“என் அபிஷேகம் பெற்றவர்களைத்[a] தொடாதீர்கள்;

    என் தீர்க்கதரிசிகளுக்குத் தீங்கு செய்யாதீர்கள்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் அபிஷேகம் செய்யப்பட்டவர்களை.” எபிரெயத்தில் சொல்லுக்கு சொல், “என் அபிஷேகம் செய்யப்பட்டவர்களை.” இங்குள்ள எபிரெயச் சொல் ‘மேசியா’ என்ற சொல்லுடன் தொடர்புடையது; ஆனால் இவ்வசனத்தில் அது குறிப்பாக ஒரே மேசியாவை அல்ல, கடவுளால் அபிஷேகம் செய்யப்பட்டவர்களைப் பொதுவாகக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּגְּעוּ
  choice: தொடாதீர்கள்
  rationale: נגע என்பதன் நேரடிப் பொருள் ‘தொடு’ என்பதாகும். இணையான அடுத்த வரியில் தீங்கு செய்வது தடுக்கப்படுவதால், இங்கு பகைமையான நோக்கத்துடன் தொடுவதையும் இது உள்ளடக்குகிறது; ஆனால் மூலத்தில் இல்லாத குறிப்பிட்ட வன்முறைச் செயலை மொழிபெயர்ப்பில் சேர்க்கவில்லை.
- source_word: בִּמְשִׁיחָי
  choice: என்னால் அபிஷேகம் செய்யப்பட்டவர்களை
  rationale: מָשִׁיחַ என்பது ‘அபிஷேகம் செய்யப்பட்டவர்’ என்று பொருள்படும். இங்கு பன்மையும் முதலாம் நபர் ஒருமை உடைமைப் பின்னொட்டும் இருப்பதால், கடவுளால் அபிஷேகம் செய்யப்பட்ட பலரைக் குறிக்கும் வகையில் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וּבִנְבִיאַי
  choice: என் தீர்க்கதரிசிகளுக்கு
  rationale: נָבִיא என்பதன் வழக்கமான பொருள் ‘தீர்க்கதரிசி.’ பன்மையையும் ‘என்’ என்ற உடைமையையும் தமிழில் தெளிவாகப் பேணுகிறது.
- source_word: תָּרֵעוּ
  choice: தீங்கு செய்யாதீர்கள்
  rationale: רעע என்பதன் இந்த வடிவம் ஒருவருக்குத் தீமை அல்லது தீங்கு செய்வதைத் தடை செய்கிறது. ‘தீங்கு செய்யாதீர்கள்’ என்பது இயல்பானதும், தீங்கின் வகையைத் தேவையின்றிக் குறுக்காததும் ஆகும்.
- source_word: אַל
  choice: செய்யாதீர்கள் / தொடாதீர்கள்
  rationale: אַל தொடர்ந்து வரும் வினை வடிவங்களுடன் தடை கட்டளையைத் தெரிவிக்கிறது. தமிழில் எதிர்மறை ஏவல் விகுதிகளால் இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: מְשִׁיחָי என்ற சொல்லை மேசியாவைக் குறிப்பதல்லாத பன்மைச் சூழலில் மொழிபெயர்த்தல்
  choice: என்னால் அபிஷேகம் செய்யப்பட்டவர்கள்
  alternative: என் அபிஷேகம் பெற்றவர்கள்; என் அபிஷேகம் செய்யப்பட்டவர்கள்; என் மேசியாக்கள்
  rationale: எபிரெயச் சொல் ‘மேசியா’ என்ற பட்டத்துடன் தொடர்புடையதாயினும், இங்கு ஒரே மேசியாவை அல்லாமல் கடவுளால் அபிஷேகம் செய்யப்பட்ட பலரைக் குறிக்கிறது. ஆகவே மூலத்தில் இல்லாத தனிப்பட்ட கிறிஸ்துவியல் குறிப்பைச் சேர்க்காமல் பொதுப்பெயரின் பன்மைப் பொருள் பேணப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதைமிக்க பன்மைத் தடை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. ‘அபிஷேகம்’ மற்றும் ‘தீர்க்கதரிசி’ ஆகியவை தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற சொற்களாக இருப்பதால் வாசகர்களுக்குப் பரிச்சயமானவையாகவும், மூலத்தின் சமயச் சூழலைத் துல்லியமாகக் காக்கிறவையாகவும் உள்ளன.
