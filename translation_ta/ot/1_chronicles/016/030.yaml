revisions:
- from: பூமியெங்கும் உள்ளவர்களே, அவர் முன்னிலையில் நடுங்குங்கள்; ஆம், உலகம் நிலைநிறுத்தப்பட்டுள்ளது; அது அசைவுறாது[a].
  to: பூமியனைத்தும், அவர் முன்னிலையில் நடுங்குங்கள்; உண்மையாகவே, உலகம் நிலைநிறுத்தப்பட்டுள்ளது; அது நிலைகுலையாது[a].
  rationale: The revision removes the added reference to inhabitants and retains the Hebrew’s direct, cosmic address to ‘all the earth.’ It also uses an idiomatic emphatic connective for אַף and renders the final stability image as ‘will not be destabilized,’ preserving the intended figurative force. The footnote remains anchored to the final clause and presents legitimate lexical alternatives.
