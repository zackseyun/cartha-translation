id: 1CH.16.30
reference: 1 Chronicles 16:30
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: חִ֤ילוּ מִ/לְּ/פָנָי/ו֙ כָּל הָ/אָ֔רֶץ אַף תִּכּ֥וֹן תֵּבֵ֖ל בַּל תִּמּֽוֹט־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/030.yaml
  text: Tremble before him[a], all the earth; indeed, the world is established; it shall not be moved.
translation:
  language: ta
  text: பூமியனைத்தும், அவர் முன்னிலையில் நடுங்குங்கள்; உண்மையாகவே, உலகம் நிலைநிறுத்தப்பட்டுள்ளது; அது நிலைகுலையாது[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அது தடுமாறாது” அல்லது “அது அசையாது.” எபிரெய உருவகம் உறுதியான நிலைத்தன்மையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: חִילוּ
  choice: நடுங்குங்கள்
  rationale: חול வினையின் கட்டளை வடிவம் உடல் நடுக்கம் அல்லது துடிப்பைக் குறிக்கலாம்; இறைமுன்னிலைச் சூழலில் பயபக்தியால் நடுங்குவதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מִלְּפָנָיו
  choice: அவர் முன்னிலையில்
  rationale: சொல்லாட்சியாக ‘அவருடைய முகம்/முன்னிலையிலிருந்து’ என்றிருந்தாலும், இங்கு இறைமுன்னிலைக்கு எதிரான மனிதப் பிரதிசெயலைக் குறிக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: כָּל הָאָרֶץ
  choice: பூமியெங்கும் உள்ளவர்களே
  rationale: எபிரெயச் சொற்றொடர் சொல்லாட்சியாக ‘பூமியனைத்தும்’ எனினும், நடுங்கும்படி நேரடியாக அழைக்கப்படுவது பூமியின் குடிகளாகப் புரிகிறது; உலகளாவிய அழைப்பை இயல்பான தமிழில் தருகிறது.
- source_word: אַף
  choice: ஆம்
  rationale: அடுத்த கூற்றை உறுதிப்படுத்தும் வலியுறுத்தலைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: תִּכּוֹן
  choice: நிலைநிறுத்தப்பட்டுள்ளது
  rationale: כון என்பதன் நிபால் வடிவத்திலுள்ள நிலைபெறுதல், உறுதியாக நிறுவப்படுதல் ஆகிய அர்த்தங்களைப் பாதுகாக்கிறது.
- source_word: תֵּבֵל
  choice: உலகம்
  rationale: ஒழுங்குபடுத்தப்பட்ட அல்லது குடியிருக்கும் உலகைக் குறிக்கும் கவிதைச்சொல்லுக்கு தெளிவான, இயல்பான தமிழ் இணை.
- source_word: בַּל
  choice: அசைவுறாது என்பதிலுள்ள ‘-ஆது’
  rationale: கவிதைநடையின் மறுப்பை நேரடியாக வெளிப்படுத்துகிறது.
- source_word: תִּמּוֹט
  choice: அசைவுறாது
  rationale: מוט என்பதிலுள்ள தடுமாறுதல், ஆட்டம் காணுதல், நிலைகுலைதல் ஆகிய உறுதியின்மை உருவகத்தை உள்ளடக்கும் சுருக்கமான தமிழ்; முழுமையான இயக்கமின்மை என்ற அறிவியல் கூற்றாகக் கட்டுப்படுத்தாது.
theological_decisions:
- issue: உலகத்தின் உறுதிநிலை பற்றிய மொழி
  choice: தேவனுடைய ஆட்சியின்கீழ் உலகம் உறுதியாக நிலைநிறுத்தப்பட்டிருப்பதைச் சொல்லும் கவிதை உருவகமாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘அது தடுமாறாது’ அல்லது ‘அது நிலைகுலையாது’ என்று உருவகத்தை இன்னும் வெளிப்படையாகத் தரலாம்.
  rationale: இப்பாடல் படைப்பின் உறுதியையும் ஒழுங்கையும் வலியுறுத்துகிறது; உலகம் முற்றிலும் நகராதது என்ற பிற்கால அறிவியல் அல்லது அண்டவியல் விவாதத்தை வசனத்திற்குள் இறக்குமதி செய்யவில்லை.
translation_notes:
  register: நவீன, பொதுவாகப் புரியும், வழிபாட்டிற்கேற்ற கண்ணியமான தமிழ். எபிரெயக் கவிதையின் இரண்டு அழைப்புரை/உறுதிப்பாட்டு அசைவுகளையும் அரைப்புள்ளிகளால் காக்கிறது; உலகளாவிய அழைப்பு தமிழில் இயல்பாக இருக்க ‘பூமியெங்கும் உள்ளவர்களே’ பயன்படுத்தப்பட்டது.
