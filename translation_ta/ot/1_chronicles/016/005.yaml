base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/005.yaml
  text: Asaph was the chief[a], and second to him was Zechariah; then Jeiel, Shemiramoth, Jehiel, Mattithiah, Eliab, Benaiah, Obed-edom, and Jeiel, with instruments of harps and lyres[b]; and Asaph sounded the cymbals.
translation:
  language: ta
  text: ஆசாப் தலைவராக இருந்தான்[a]; அவனுக்கு அடுத்த நிலையில் சகரியா இருந்தான். பின்பு யெயியேல், செமிராமோத், யெகியேல், மத்தித்தியா, எலியாப், பெனாயா, ஓபேத்-ஏதோம், யெயியேல் ஆகியோர் நெபேல், கின்னோர் என்னும் நரம்பிசைக் கருவிகளுடன் இருந்தார்கள்[b]; ஆசாப் தாளங்களை ஒலிக்கச் செய்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆசாப் தலைவன்; அவனுக்கு இரண்டாமவனாகச் சகரியா இருந்தான்.” எபிரெயச் சொல் ஆசாப்புடன் ஒப்பிட்ட இரண்டாம் தரநிலையைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் நெபேல், கின்னோர் எனப்படும் இருவேறு நரம்பிசைக் கருவிகள் குறிப்பிடப்படுகின்றன. அவற்றுக்கு முற்றிலும் இணையான நவீன கருவிகள் எவை என்பது உறுதியில்லை.
    reason: cultural_note
lexical_decisions:
- source_word: הָרֹאשׁ
  choice: தலைவராக
  rationale: இங்கு רֹאשׁ உடல் உறுப்பைக் குறிக்காமல், இசைப் பணியாளர்களிடையே ஆசாபின் தலைமை நிலையைக் குறிக்கிறது.
- source_word: וּמִשְׁנֵהוּ
  choice: அவனுக்கு அடுத்த நிலையில்
  rationale: மூன்றாம் ஆண்பால் ஒருமை பின்னொட்டுடன் வரும் מִשְׁנֶה, ஆசாப்புடன் ஒப்பிட்ட இரண்டாம் தரநிலையைச் சுட்டுகிறது; தமிழில் இயல்பாக உறவைத் தெளிவுபடுத்துகிறது.
- source_word: יְעִיאֵל / וִיעִיאֵל
  choice: எயியேல்
  rationale: இவ்வசனத்தில் இருமுறை வரும் ஒரே எபிரெயப் பெயர் இரு இடங்களிலும் ஒரேவிதமாக ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: בִּכְלֵי נְבָלִים וּבְכִנֹּרוֹת
  choice: நெபேல், கின்னோர் என்னும் நரம்பிசைக் கருவிகளை
  rationale: நֵבֶל, כִּנּוֹר ஆகியவை வேறுபட்ட இரண்டு நரம்பிசைக் கருவிகள். அவற்றின் துல்லியமான நவீன ஒப்புமை உறுதியில்லாததால் பெயர்களை ஒலிபெயர்த்து, கருவி வகையை விளக்கியுள்ளது.
- source_word: בַּמְצִלְתַּיִם
  choice: கைத்தாளங்களை
  rationale: מְצִלְתַּיִם ஒன்றோடொன்று மோதிச் சத்தமிடும் தாளக் கருவிகளைக் குறிக்கிறது; 'கைத்தாளங்கள்' நவீன தமிழில் புரிந்துகொள்ளக்கூடிய இணைச்சொல்.
- source_word: מַשְׁמִיעַ
  choice: முழங்கச் செய்தான்
  rationale: שׁמע வினையின் ஹிபீல் வடிவிலுள்ள காரணவினைப் பொருளை—கருவிகளின் ஒலியைக் கேட்கச் செய்தல்—தமிழில் தக்கவைக்கிறது.
