translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான பட்டியல் நடை பயன்படுத்தப்பட்டுள்ளது. அறியப்படாத பழங்கால இசைக்கருவிகளை ஊகமாக ‘யாழ்’ போன்ற ஒரு குறிப்பிட்ட தமிழ்க் கருவியுடன் அடையாளப்படுத்தாமல், ஒலிபெயர்ப்புடன் வகை விளக்கம் தரப்பட்டுள்ளது. பெயர்கள் எபிரெய ஒலிவடிவங்களுக்கு நெருக்கமாகத் தமிழாக்கப்பட்டுள்ளன.
