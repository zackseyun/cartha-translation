  text: לְֽ/הַעֲלוֹת֩ עֹל֨וֹת לַ/יהוָ֜ה עַל מִזְבַּ֧ח הָ/עֹלָ֛ה תָּמִ֖יד לַ/בֹּ֣קֶר וְ/לָ/עָ֑רֶב וּ/לְ/כָל הַ/כָּתוּב֙ בְּ/תוֹרַ֣ת יְהוָ֔ה אֲשֶׁ֥ר צִוָּ֖ה עַל יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/040.yaml
  text: to offer burnt offerings to Yahweh on the altar of burnt offering continually[a], morning and evening, and according to all that is written in the law of Yahweh, which he commanded for Israel.
translation:
  language: ta
  text: யாவேக்கு எரிபலிப் பீடத்தின்மேல் எரிபலிகளைத் தொடர்ந்து, காலையிலும் மாலையிலும், அவர் இஸ்ரவேலுக்குக் கட்டளையிட்ட யாவேயின் திருச்சட்டத்தில்[a] எழுதப்பட்டுள்ள அனைத்தின்படியும் செலுத்துவதற்கு.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘திருச்சட்டம்’ என்பதற்குப் பதிலாக ‘அறிவுறுத்தல்’ என்றும் மொழிபெயர்க்கலாம்; எபிரேயச் சொல்லான ‘தோரா’ இவ்விரு பொருள்களையும் கொண்டது.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהַעֲלוֹת עֹלוֹת
  choice: எரிபலிகளைச் செலுத்துவதற்காக
  rationale: עלה என்பதன் ஹிஃபில் வடிவம் சொல்லளவில் ‘மேலே எழச்செய்தல்’ எனினும், பலியிடும் சூழலில் பலியைச் செலுத்துவதைக் குறிக்கிறது; עֹלָה என்பது முழுவதும் எரிக்கப்படும் பலிக்கான வழக்கமான சொல்.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: יהוה என்ற உடன்படிக்கைப் பெயரை ‘யாவே’ என ஒலிபெயர்த்து, ל முன்னொட்டின் அர்ப்பணிப்பு/திசைப் பொருளை ‘-க்கு’ எனக் காட்டுகிறது.
- source_word: מִזְבַּח הָעֹלָה
  choice: எரிபலிப் பீடம்
  rationale: எரிபலிக்கென அமைந்த குறிப்பிட்ட பலிபீடத்தை இயல்பான, சுருக்கமான தமிழில் குறிக்கிறது.
- source_word: תָּמִיד לַבֹּקֶר וְלָעָרֶב
  choice: தொடர்ந்து, காலையிலும் மாலையிலும்
  rationale: תמיד குறிக்கும் ஒழுங்கான தொடர்ச்சியை ‘தொடர்ந்து’ எனப் பேணுகிறது; அடுத்த சொற்றொடர் அதன் தினசரி கால அட்டவணையைத் தெளிவுபடுத்துகிறது.
- source_word: וּלְכָל הַכָּתוּב
  choice: எழுதப்பட்டுள்ள அனைத்தின்படியும்
  rationale: לְכָל இங்கு எழுதப்பட்ட விதிமுறைகளுக்கு இணங்கச் செய்வதைக் குறிக்கிறது; ‘அனைத்தின்படியும்’ அந்தக் கருத்தை இயல்பாகத் தருகிறது.
- source_word: בְּתוֹרַת יְהוָה
  choice: யாவேயின் திருச்சட்டத்தில்
  rationale: תורה என்பதற்கு ‘சட்டம்’ என்றும் ‘அறிவுறுத்தல்’ என்றும் பொருள் உண்டு. இங்குள்ள எழுத்துப்பூர்வமான பலிவிதிகளின் சூழலில் ‘திருச்சட்டம்’ தெளிவாக உள்ளது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אֲשֶׁר צִוָּה עַל יִשְׂרָאֵל
  choice: இஸ்ரவேலுக்காக அவர் கட்டளையிட்ட
  rationale: צוה உடன் வரும் עַל, இஸ்ரவேல்மீது விதிக்கப்பட்ட கட்டளைகளைக் குறிக்கிறது. ‘இஸ்ரவேலுக்காக’ என்பது அதன் இலக்கை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் வரும் நான்கெழுத்து உடன்படிக்கைப் பெயரை பொதுப்பட்டமாக மாற்றாமல், தனிப்பெயராக ஒலிபெயர்க்கிறது.
- issue: תורה என்பதன் பொருள்
  choice: திருச்சட்டம்
  alternative: அறிவுறுத்தல்
  rationale: இந்தப் பலிவழிபாட்டு மற்றும் எழுத்துப்பூர்வ விதிமுறைச் சூழலில் ‘திருச்சட்டம்’ முதன்மைப் பொருளைத் தெளிவாகத் தருகிறது; எபிரெயச் சொல்லின் பரந்த பொருளை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், வழிபாட்டு மரியாதையும் மூலவாக்கியத்தின் தொடர்ச்சியான நோக்கவினை அமைப்பும் பேணப்பட்டுள்ளன. இது முந்தைய வசனத்தைத் தொடரும் சொற்றொடர் என்பதால் முழுமையான தனிவாக்கியமாக மாற்றப்படவில்லை.
