id: 1CH.16.29
reference: 1 Chronicles 16:29
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: הָב֥וּ לַ/יהוָ֖ה כְּב֣וֹד שְׁמ֑/וֹ שְׂא֤וּ מִנְחָה֙ וּ/בֹ֣אוּ לְ/פָנָ֔י/ו הִשְׁתַּחֲו֥וּ לַ/יהוָ֖ה בְּ/הַדְרַת קֹֽדֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/029.yaml
  text: Ascribe to Yahweh the glory due his name; bring an offering and come before him[a]. Bow down to Yahweh in holy splendor.
translation:
  language: ta
  text: 'யாவேவுக்கு அவருடைய பெயருக்குரிய மகிமையைச் செலுத்துங்கள்;

    காணிக்கையைக் கொண்டுவந்து, அவர் முன்னிலையில் வாருங்கள்.

    பரிசுத்தப் பேரழகில்[a] யாவேவைத் தாழ்ந்து வணங்குங்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பரிசுத்தத்தின் பேரழகில்”; ஒருவேளை, “பரிசுத்த ஆடை அணிந்து.”
    reason: בְּהַדְרַת קֹדֶשׁ என்பது பரிசுத்தத்தின் ஒளிமிகு அழகையோ வழிபாட்டுக்குரிய புனித ஆடை அல்லது அலங்காரத்தையோ குறிக்கக்கூடிய சொற்றொடர்.
lexical_decisions:
- source_word: הָבוּ
  choice: செலுத்துங்கள்
  rationale: இந்த வழிபாட்டு அழைப்பில், மகிமையைப் பொருள்போல் கொடுப்பதைவிட அதை யாவேவுக்கு உரியதாக ஏற்றுக்கொண்டு அவருக்குச் செலுத்துதல் என்பதே கருத்து.
- source_word: לַיהוָה
  choice: யாவேவுக்கு
  rationale: יהוה என்ற உடன்படிக்கைப் பெயரை ஒலிபெயர்த்து, மூல உரையில் உள்ள தனிப்பெயரைப் பாதுகாக்கிறது.
- source_word: כְּבוֹד שְׁמוֹ
  choice: அவருடைய பெயருக்குரிய மகிமையை
  rationale: இறைவனுடைய பெயருக்கு உரிய அல்லது செலுத்தப்பட வேண்டிய மகிமை என்ற வழிபாட்டு மொழிநடையின் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: שְׂאוּ מִנְחָה
  choice: காணிக்கையைக் கொண்டுவந்து
  rationale: שְׂאוּ என்பதன் அடிப்படைப் பொருள் தூக்குதல் அல்லது சுமத்தல் என்றாலும், מִנְחָה உடன் வரும்போது காணிக்கையை எடுத்துவந்து சமர்ப்பிக்கும் பொருளைத் தருகிறது.
- source_word: מִנְחָה
  choice: காணிக்கை
  rationale: பலவகை பரிசு அல்லது பலிக் காணிக்கைகளைக் குறிக்கக்கூடிய பொதுவான சொல் என்பதால், அதன் வகையைத் தேவையின்றிக் குறுக்காமல் மொழிபெயர்க்கிறது.
- source_word: וּבֹאוּ לְפָנָיו
  choice: அவர் முன்னிலையில் வாருங்கள்
  rationale: வழிபாட்டிற்காக இறைவனுடைய சந்நிதியை அணுகும் இடவியல் மற்றும் மரியாதை உணர்வுகளைப் பாதுகாக்கிறது.
- source_word: הִשְׁתַּחֲווּ
  choice: தாழ்ந்து வணங்குங்கள்
  rationale: வழிபாடு என்ற பொதுப்பொருளுடன், உடலைத் தாழ்த்திப் பணியும் மூல வினையின் செயற்படிமத்தையும் வெளிப்படுத்துகிறது.
- source_word: בְּהַדְרַת קֹדֶשׁ
  choice: பரிசுத்தப் பேரழகில்
  rationale: பரிசுத்தத்தோடு தொடர்புடைய ஒளிமிகு அழகு அல்லது மேன்மையைச் சுருக்கமான கவிதைநடையில் தருகிறது; புனித ஆடை என்ற சாத்தியத்தைக் குறிப்பில் பாதுகாக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல உரையில் நேரடியாக வரும் உடன்படிக்கைத் தனிப்பெயரை பொதுப்பட்டமாக மாற்றாமல் ஒலிபெயர்த்து வழங்குகிறது.
- issue: בְּהַדְרַת קֹדֶשׁ என்பதன் பொருள்
  choice: பரிசுத்தப் பேரழகில்
  alternative: பரிசுத்தத்தின் பேரழகில்; பரிசுத்த ஆடை அணிந்து
  rationale: எபிரெயச் சொற்றொடர் பரிசுத்தத்தின் அழகையும் வழிபாட்டுக்குரிய புனித அலங்காரம் அல்லது ஆடையையும் குறிக்கக்கூடும். முதன்மை உரை அதன் கவிதைநயத்தைப் பாதுகாக்கிறது; குறிப்பு மாற்று வாசிப்பை வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், வழிபாட்டுக்குரிய கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. இணையான மூன்று கட்டளைகளும் தெளிவாக வைக்கப்பட்டுள்ளன; அரிதான சமயத் தொழில்நுட்பச் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
