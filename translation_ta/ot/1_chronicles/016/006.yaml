base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/006.yaml
  text: And Benaiah and Jahaziel the priests were continually with the trumpets before the ark of the covenant of God[a].
translation:
  language: ta
  text: ஆசாரியர்களான பெனாயாவும் யகசியேலும் கடவுளுடைய உடன்படிக்கைப் பெட்டியின் முன்பாக எக்காளங்களுடன் தொடர்ந்து இருந்தார்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுளுடைய உடன்படிக்கைப் பெட்டியின் முன்பாக எக்காளங்களைத் தொடர்ந்து ஊதிக்கொண்டிருந்தார்கள்.” எபிரெயத்தில் “ஊதினார்கள்” என்ற வினை வெளிப்படையாக இல்லை; எனினும், இதுவே உள்ளடங்கிய பொருளாக இருக்க வாய்ப்புள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנָיָהוּ וְ/יַחֲזִיאֵל
  choice: பெனாயாவும் யகசியேலும்
  rationale: எபிரெய தனிப்பெயர்கள் நவீனத் தமிழில் இயல்பாக ஒலிபெயர்க்கப்பட்டுள்ளன; இணைப்புச் சொற்கள் ‘-உம் ... -உம்’ அமைப்பில் வெளிப்படுத்தப்பட்டுள்ளன.
- source_word: הַ/כֹּהֲנִים
  choice: ஆசாரியர்களான
  rationale: இருவரின் சமயப் பணியை அடையாளப்படுத்தும் definite plural noun; தமிழில் பெயர்களுக்கு முன் இயல்பாக இணைக்கப்பட்டுள்ளது.
- source_word: בַּ/חֲצֹצְרוֹת
  choice: எக்காளங்களுடன்
  rationale: חֲצֹצְרוֹת என்பது பொதுவான கொம்புகளை அல்ல, குறிப்பிட்ட வகை எக்காளங்களைக் குறிக்கிறது. எபிரெயத்தில் ‘ஊதுதல்’ என்ற வினை வெளிப்படையாக இல்லாததால், முதன்மை உரையில் ‘உடன்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: תָּמִיד
  choice: தொடர்ந்து
  rationale: தொடர்ச்சியான அல்லது தவறாமல் நடைபெறும் பணியை உணர்த்தும் வினையடைப் பொருளை, கால அட்டவணையை அளவுக்கு மீறித் துல்லியப்படுத்தாமல் தருகிறது.
- source_word: לִ/פְנֵי
  choice: முன்பாக
  rationale: இடத்தையும் வழிபாட்டுச் சூழலில் உள்ள நிலையையும் இயல்பாகக் குறிக்கிறது.
- source_word: אֲרוֹן בְּרִית הָ/אֱלֹהִים
  choice: கடவுளின் உடன்படிக்கைப் பெட்டி
  rationale: எபிரெய construct தொடரைத் தமிழில் இயல்பான உடைமைத் தொடராக அளிக்கிறது; אֱלֹהִים இங்கு இஸ்ரவேலின் கடவுளைக் குறிக்கிறது.
theological_decisions:
- issue: ஆசாரியர்கள் எக்காளங்களை ஊதினார்கள் என்பதை முதன்மை உரையில் வெளிப்படையாகச் சேர்ப்பதா
  choice: ‘எக்காளங்களுடன் தொடர்ந்து இருந்தார்கள்’ என்று எபிரெயத்தின் வினையற்ற அமைப்பைப் பாதுகாத்தல்
  alternative: ‘எக்காளங்களைத் தொடர்ந்து ஊதிக்கொண்டிருந்தார்கள்’ என்று மறைமுகமாக உணர்த்தப்படும் செயலை வெளிப்படுத்துதல்
  rationale: சூழல் அவர்கள் எக்காளங்களை ஊதினார்கள் என வலுவாக உணர்த்தினாலும், எபிரெய உரையில் ‘ஊது’ என்ற வினை இல்லை. ஆகவே அந்தச் சாத்தியமான பொருள் அடிக்குறிப்பில் தரப்பட்டு, முதன்மை உரையில் மூலத்தின் உண்மையான தெளிவின்மை பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயத்தின் வினையற்ற வாக்கியத்தைத் தமிழில் முழுமையாக்க ‘இருந்தார்கள்’ சேர்க்கப்பட்டுள்ளது; செயலைக் குறிக்கும் ‘ஊதினார்கள்’ முதன்மை உரையில் சேர்க்கப்படவில்லை.
