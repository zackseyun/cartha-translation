source:
  edition: WLC
  text: וַ/יִּתֵּ֞ן לִ/פְנֵ֨י אֲר֧וֹן יְהוָ֛ה מִן הַ/לְוִיִּ֖ם מְשָׁרְתִ֑ים וּ/לְ/הַזְכִּיר֙ וּ/לְ/הוֹד֣וֹת וּ/לְ/הַלֵּ֔ל לַ/יהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/004.yaml
  text: He appointed some of the Levites to minister before the ark of Yahweh[a], to commemorate, to give thanks, and to praise Yahweh, the God of Israel.
translation:
  language: ta
  text: அவர் லேவியர்களில் சிலரை யாவேயின் பேழைக்கு முன்பாகத் திருப்பணி செய்யவும், நினைவுகூரவும்[a], நன்றி செலுத்தவும், இஸ்ரவேலின் கடவுளாகிய யாவேயைப் புகழவும் நியமித்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நினைவாகக் குறிப்பிடவும்.” இங்கு வரும் எபிரெய வினை, வழிபாட்டுச் சூழலில் நினைவை எழுப்புவதையோ நினைவாக அறிவிப்பதையோ குறிக்கலாம்.
    reason: וּלְהַזְכִּיר என்பதன் ஹிஃபீல் வடிவும் வழிபாட்டுச் சார்ந்த பயன்பாடும் “நினைவுகூருதல்” என்பதுடன் “நினைவாகக் குறிப்பிடுதல்” என்ற நுட்பத்தையும் அனுமதிக்கின்றன.
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: நியமித்தார்
  rationale: ‘கொடுத்தார்/வைத்தார்’ என்பது சொற்சார்ந்த பொருள்; இங்கு லேவியர்களுக்குத் திருப்பணிப் பொறுப்பு அளிக்கப்படுவதால் ‘நியமித்தார்’ என்பது சூழலுக்கேற்ற இயல்பான தமிழ்.
- source_word: לִפְנֵי אֲרוֹן יְהוָה
  choice: யாவேயின் பேழைக்கு முன்பாக
  rationale: இடத்தையும் வழிபாட்டுச் சூழலையும் நேரடியாகப் பேணுகிறது; אֲרוֹן என்பதற்கு மரியாதையும் இயல்பும் கொண்ட ‘பேழை’ பயன்படுத்தப்பட்டது.
- source_word: מִן הַלְוִיִּם
  choice: லேவியர்களில் சிலரை
  rationale: מִן என்பதன் பகுதிப்பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: מְשָׁרְתִים
  choice: திருப்பணி செய்ய
  rationale: வழிபாட்டுக்குரிய சேவையைச் சுட்டுவதால் பொதுவான ‘பணிசெய்ய’ என்பதைக் காட்டிலும் ‘திருப்பணி செய்ய’ சூழலைத் தெளிவாக்குகிறது.
- source_word: וּלְהַזְכִּיר
  choice: நினைவுகூரச் செய்ய
  rationale: זכר வினையின் ஹிஃபீல் வடிவிலுள்ள காரணவினை நுட்பத்தையும், வழிபாட்டில் நினைவை எழுப்புதல் அல்லது நினைவாக அறிவித்தல் என்ற சாத்தியத்தையும் பேணுகிறது.
- source_word: וּלְהוֹדוֹת
  choice: நன்றி செலுத்த
  rationale: இந்த வழிபாட்டுச் சூழலில் ידה என்பது அறிக்கையிடுதலைவிட நன்றிசெலுத்துதலைக் குறிக்கிறது.
- source_word: וּלְהַלֵּל
  choice: புகழ
  rationale: הלל என்பதன் வழக்கமான பொருளைத் தருகிறது; மூலத்தில் பாடுதல் வெளிப்படையாக இல்லாததால் அதனைச் சேர்க்கவில்லை.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கடவுள்
  rationale: எபிரெயக் கட்டமைப்பையும் உடன்படிக்கை சார்ந்த அடையாளத்தையும் தெளிவாகப் பேணும் இயல்பான தமிழ்.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் பட்டப்பெயர் அல்ல, நான்கெழுத்து இறைப்பெயர் நேரடியாக வருகிறது. ஆகவே பட்டப்பெயரால் மாற்றாமல் அதன் பரவலான ஒலிபெயர்ப்பான ‘யாவே’ பயன்படுத்தப்பட்டது.
- issue: וּלְהַזְכִּיר என்பதன் வழிபாட்டுப் பொருள்
  choice: நினைவுகூரச் செய்ய
  alternative: நினைவுகூர; குறிப்பிட; நினைவூட்ட
  rationale: செயலின் கூறப்படாத செயப்படுபொருளையோ அது கடவுளுக்கு நினைவூட்டுதலா அல்லது மக்களிடையே நினைவை எழுப்புதலா என்பதையோ உரை வெளிப்படையாகத் தீர்மானிக்கவில்லை. காரணவினைத் தன்மையைப் பேணி அந்த இறையியல் மற்றும் வழிபாட்டு இறுக்கத்தைத் திறந்தவாறே வைத்துள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான வழிபாட்டு நடையைப் பயன்படுத்துகிறது. ‘திருப்பணி’ மற்றும் ‘பேழை’ ஆகியவை சூழலைத் தெளிவாக்கினாலும் குறிப்பிட்ட திருச்சபை மரபின் தனிச்சொற்களைத் திணிக்கவில்லை. மூலத்தில் இல்லாத ‘உடன்படிக்கை’ என்ற சொல்லைச் சேர்க்கவில்லை.
