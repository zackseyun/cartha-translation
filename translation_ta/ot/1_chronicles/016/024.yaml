id: 1CH.16.24
reference: 1 Chronicles 16:24
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: סַפְּר֤וּ בַ/גּוֹיִם֙ אֶת כְּבוֹד֔/וֹ בְּ/כָל הָ/עַמִּ֖ים נִפְלְאֹתָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/024.yaml
  text: Declare his glory among the nations, his wondrous deeds among all the peoples.
translation:
  language: ta
  text: நாடுகளிடையே அவருடைய மகிமையை அறிவியுங்கள்; மக்கள் அனைவரிடையிலும் அவருடைய வியத்தகு செயல்களை அறிவியுங்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: סַפְּרוּ
  choice: அறிவியுங்கள்
  rationale: ספר என்பதன் பன்மை ஏவல் வடிவம் பொதுவாக எடுத்துரைத்தல் அல்லது பிரகடனம் செய்தல் என்ற பொருளைக் கொண்டது. ‘அறிவியுங்கள்’ என்பது பொதுமக்களிடையே வாய்மொழியாகப் பரப்பும் அழைப்பை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: בַגּוֹיִם
  choice: நாடுகளிடையே
  rationale: גּוֹיִם இங்கு இஸ்ரவேலுக்கு வெளியேயுள்ள தேசங்களை உள்ளடக்கிய விரிவான பொருளில் வருகிறது. ב முன்னிடைச்சொல்லின் இடச்சார்ந்த பொருளை ‘இடையே’ காக்கிறது.
- source_word: כְּבוֹדוֹ
  choice: அவருடைய மகிமையை
  rationale: כָּבוֹד இறைவனுடைய மேன்மை, கனம், சிறப்பு ஆகியவற்றைச் சுட்டுகிறது. ‘மகிமை’ என்பது தமிழில் இயல்பாகவும் வேதாகமச் சூழலுக்கு ஏற்றவாறும் இப்பொருள் வளத்தைத் தக்கவைக்கிறது.
- source_word: בְּכָל־הָעַמִּים
  choice: மக்கள் அனைவரிடையிலும்
  rationale: עַמִּים என்பதை ‘மக்கள்’ என மொழிபெயர்ப்பது முந்தைய גּוֹיִם (‘நாடுகள்’) என்பதிலிருந்து உள்ள சொல் வேறுபாட்டையும் கவிதை இணைநிலையையும் காக்கிறது. כָּל என்பதன் முழுமையை ‘அனைவரிடையிலும்’ வெளிப்படுத்துகிறது.
- source_word: נִפְלְאֹתָיו
  choice: அவருடைய வியத்தகு செயல்களை
  rationale: פלא வேரிலிருந்து வரும் இச்சொல் வியப்பை உண்டாக்கும் அசாதாரண செயல்களைக் குறிக்கிறது. ‘வியத்தகு செயல்கள்’ என்பது வெறும் அதிசயப் பொருட்களை அல்ல, அவர் செய்த செயல்களையே தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: மூன்றாம் நபர் ஒருமை உரிமைப்பின்னொட்டுகளின் குறிப்பு (‘அவருடைய’)
  choice: சூழலில் இவை இஸ்ரவேலின் தேவனாகிய ஆண்டவரைக் குறிக்கின்றன; எனினும் வசனத்தின் பெயர்ச்சொல்லற்ற சுட்டுமுறையே மொழிபெயர்ப்பில் காக்கப்படுகிறது.
  alternative: ஒவ்வொரு இடத்திலும் ‘ஆண்டவருடைய’ என்று பெயரை வெளிப்படையாகச் சேர்த்தல்.
  rationale: 1 நாளாகமம் 16-ன் உடனடிச் சூழல் ஆண்டவரையே புகழ்ச்சியின் பொருளாக அடையாளப்படுத்துகிறது. ஆனால் எபிரெய வசனம் பெயரை மீண்டும் கூறாமல் உரிமைப்பின்னொட்டுகளைப் பயன்படுத்துவதால், தேவையற்ற விளக்கச் சேர்க்கையின்றி ‘அவருடைய’ எனத் தக்கவைக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியக்கூடிய கண்ணியமான ஏவல் நடையைப் பயன்படுத்துகிறது. எபிரெயக் கவிதையின் இரு இணை உறுப்புகளும், ‘நாடுகள்’/‘மக்கள்’ என்ற சொல் வேறுபாடும் காக்கப்பட்டுள்ளன.
