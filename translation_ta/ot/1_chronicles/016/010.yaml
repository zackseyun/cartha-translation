id: 1CH.16.10
reference: 1 Chronicles 16:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: הִֽתְהַֽלְלוּ֙ בְּ/שֵׁ֣ם קָדְשׁ֔/וֹ יִשְׂמַ֕ח לֵ֖ב מְבַקְשֵׁ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/010.yaml
  text: Boast in his holy name[a]; let the hearts of those who seek Yahweh rejoice.
translation:
  language: ta
  text: அவருடைய பரிசுத்தப் பெயரில் பெருமை கொள்ளுங்கள்; யாவேவைத் தேடுகிறவர்களின் உள்ளம் மகிழட்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִתְהַלְלוּ
  choice: பெருமைகொள்ளுங்கள்
  rationale: הלל என்பதன் ஹித்பவேல் பன்மை ஏவல் வடிவம் இங்கு ஒருவரில் அல்லது ஒன்றில் பெருமைகொள்வது, அதனால் களிகூருவது என்ற பொருளைத் தருகிறது. ‘பெருமைகொள்ளுங்கள்’ ஏவல் வலிமையையும் בְּ குறிக்கும் உறவையும் இயல்பான தமிழில் காக்கிறது.
- source_word: בְּשֵׁם קָדְשׁוֹ
  choice: அவருடைய பரிசுத்தப் பெயரில்
  rationale: בְּ என்பதன் ‘இல்’ சார்ந்த பொருளையும், ‘அவருடைய பரிசுத்தப் பெயர்’ என்ற எபிரெய அடைமொழிக் கட்டமைப்பையும் நேர்த்தியாகப் பிரதிபலிக்கிறது.
- source_word: יִשְׂמַח
  choice: மகிழட்டும்
  rationale: இது வடிவியல் ரீதியில் மூன்றாம் நபர் ஆண்பால் ஒருமை நிறைவுறா வினை என்றாலும், கவிதை மற்றும் அறிவுறுத்தல் சூழலில் விருப்ப/ஏவல் பொருளில் வருகிறது. ‘மகிழட்டும்’ அந்த வலிமையைத் தக்கவைக்கிறது.
- source_word: לֵב
  choice: உள்ளம்
  rationale: ஒருமையில் உள்ள לֵב, தேடுகிறவர்களின் உள்ளார்ந்த மனிதனைத் தொகுப்பாகக் குறிக்கிறது. தமிழில் ‘உள்ளம்’ இயல்பாகவும் கவிதைநயத்துடனும் இப்பொருளை வழங்குகிறது.
- source_word: מְבַקְשֵׁי
  choice: தேடுகிறவர்களின்
  rationale: பெயர்ச்சொல் பயனுடைய நிகழ்காலப் பங்கேற்பு, தொடர்ந்து தேடுவதைத் தன்மையாகக் கொண்டவர்களைக் குறிக்கிறது. ‘தேடுகிறவர்கள்’ இதைத் தெளிவாகக் காட்டுகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: திருநான்கெழுத்தான יהוה ஒரு பொதுப் பட்டமல்ல, இஸ்ரவேலின் தேவனுடைய தனிப்பெயர். நவீனத் தமிழ்க் கிறிஸ்தவ வாசகர்களிடையே அறியப்பட்ட தனிப்பெயர் வடிவமான ‘யெகோவா’ பயன்படுத்தப்படுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் இறைவனுடைய தனிப்பெயர் நேரடியாக உள்ளது. ஆகவே ‘கர்த்தர்’ என்ற பட்டத்தால் மாற்றாமல் தனிப்பெயராகவே வழங்கப்படுகிறது. ‘யாவே’ சாத்தியமான ஒலிபெயர்ப்பு; ‘யெகோவா’ தமிழில் பரவலாக அறியப்படும் மரபுவழி வடிவம்.
- issue: לֵב என்ற ஒருமையைப் பிரதிபலித்தல்
  choice: தேடுகிறவர்களின் உள்ளம்
  alternative: தேடுகிறவர்களின் உள்ளங்கள்
  rationale: எபிரெயத்தில் ‘உள்ளம்’ ஒருமையில் இருந்து, பன்மையான தேடுகிறவர்களின் உள்ளார்ந்த வாழ்வைத் தொகுப்பாகக் குறிக்கிறது. தமிழிலும் தொகுப்பொருள் தெளிவாக இருப்பதால் ஒருமை காக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், வழிபாட்டு மரியாதையும் கவிதைச் சுருக்கமும் காக்கப்பட்டுள்ளன. முதல் அரையடியில் பன்மை ஏவலும், இரண்டாம் அரையடியில் விருப்ப/ஏவல் நடையும் தெளிவாகப் பாதுகாக்கப்பட்டுள்ளன.
