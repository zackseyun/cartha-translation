translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான வழிபாட்டு நடையைக் கடைப்பிடிக்கிறது. தொடர்ச்சியான மூன்று பன்மை ஏவல் வினைகளின் கவிதை ஓட்டமும், ‘பாடுங்கள் / புகழ்ந்து பாடுங்கள் / பேசுங்கள்’ என்ற முன்னேற்றமும் காக்கப்பட்டுள்ளன.
