- from: அவரைப் பாடுங்கள்; அவரைப் புகழ்ந்து பாடுங்கள்; அவருடைய அற்புதச் செயல்கள் அனைத்தையும் பற்றிப் பேசுங்கள்.[a]
  to: அவருக்குப் பாடுங்கள்; அவருக்குப் புகழ்பாடுங்கள்; அவருடைய அற்புதச் செயல்கள் அனைத்தையும் பற்றிப் பேசுங்கள்.[a]
