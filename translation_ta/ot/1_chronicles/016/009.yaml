id: 1CH.16.9
reference: 1 Chronicles 16:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: שִׁ֤ירוּ ל/וֹ֙ זַמְּרוּ ל֔/וֹ שִׂ֖יחוּ בְּ/כָל נִפְלְאֹתָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/009.yaml
  text: Sing to him[a]; sing praises to him; speak of all his wondrous deeds.
translation:
  language: ta
  text: அவருக்குப் பாடுங்கள்; அவருக்குப் புகழ்பாடுங்கள்; அவருடைய அற்புதச் செயல்கள் அனைத்தையும் பற்றிப் பேசுங்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவருடைய அதிசயங்கள் அனைத்தையும் எடுத்துரையுங்கள்,’ அல்லது ‘அவருடைய அற்புதச் செயல்கள் அனைத்தையும் தியானியுங்கள்.’ எபிரெய வினைச்சொல் பேசுதல் அல்லது உள்ளத்தில் சிந்தித்தல் ஆகிய இரு நுணுக்கங்களையும் தரக்கூடும்; எனினும், பொதுமக்களுக்கு விடுக்கப்படும் அழைப்பின் சூழல் இங்கு வெளிப்படையாகப் பேசும் பொருளுக்கு ஆதரவளிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁירוּ
  choice: பாடுங்கள்
  rationale: שׁיר என்பதன் பன்மை ஏவல் வடிவம். பொதுவான பாடுதல் என்ற பொருளையும் கவிதை இணைப்பையும் இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: לֹו
  choice: அவரைப்
  rationale: לֹו இங்கு பாடலின் நோக்குநராகிய கடவுளைக் குறிக்கிறது. தமிழில் ‘அவரைப் பாடுங்கள்’ என்பது அவரைக் குறித்தும் அவரை நோக்கியும் பாடும் பொருளை இயல்பாகத் தருகிறது.
- source_word: זַמְּרוּ
  choice: அவரைப் புகழ்ந்து பாடுங்கள்
  rationale: זמר என்பதன் பியேல் வடிவம் இசையுடன் பாடுதல் அல்லது புகழ்பாடுதல் எனப் பொருள்படும். முதல் ‘பாடுங்கள்’ என்பதிலிருந்து இதை வேறுபடுத்தி, வழிபாட்டுச் சூழலைத் தெளிவாகக் காட்டுகிறது.
- source_word: שִׂיחוּ
  choice: பற்றிப் பேசுங்கள்
  rationale: שׂיח பேசுதல், எடுத்துரைத்தல், சிந்தித்தல் ஆகிய நுணுக்கங்களைக் கொண்டது. பொதுமக்களுக்கான இந்த அழைப்பின் சூழலில் வெளிப்படையாகப் பேசுதல் முதன்மையாகத் தோன்றுவதால் இவ்வாறு மொழிபெயர்க்கப்பட்டது; மற்ற சாத்தியங்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: בְּכָל
  choice: அனைத்தையும் பற்றி
  rationale: בְּ என்ற முன்னொட்டு இங்கு שׂיחוּ உடன் உரையாடலின் பொருளைக் குறிக்கிறது; כָּל முழுமையை வலியுறுத்துகிறது. தமிழில் ‘அனைத்தையும் பற்றி’ என்பது இயல்பான இணைப்பு.
- source_word: נִפְלְאֹתָיו
  choice: அவருடைய அற்புதச் செயல்கள்
  rationale: פלא வேரிலிருந்து வந்த இச்சொல் வியப்பூட்டும் செயல்களை, குறிப்பாகக் கடவுளின் வல்லமையான செயல்களை, குறிக்கிறது. ‘அற்புதச் செயல்கள்’ என்பது வியப்பின் தன்மையையும் நிகழ்த்தப்பட்ட செயல்களையும் காக்கிறது.
