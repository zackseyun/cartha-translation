  yaml_path: translation/ot/1_chronicles/016/016.yaml
  text: which he made with Abraham[a], and his oath to Isaac—
translation:
  language: ta
  text: அவர் ஆபிரகாமுடன் செய்துகொண்ட உடன்படிக்கையையும்[a], ஈசாக்குக்கு அவர் செய்த சத்தியத்தையும்—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்படியாக, “அவர் ஆபிரகாமுடன் வெட்டியது.” இது “ஆபிரகாமுடன் உடன்படிக்கை செய்துகொண்டது” என்று பொருள்படும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: அவர் … செய்துகொண்ட
  rationale: இது முந்தைய வசனத்தில் வரும் ‘உடன்படிக்கை’ என்பதைத் தொடரும் உறவுச் சொல். தமிழில் இயல்பாக அமைய, தனியான ‘எது’ என்பதற்குப் பதிலாக வினையெச்சத் தொடர்பாக மொழிபெயர்க்கப்பட்டது.
- source_word: כָּרַת
  choice: செய்துகொண்ட
  rationale: நேரடிப் பொருள் ‘வெட்டினார்’; ஆனால் உடன்படிக்கைச் சூழலில் இது ‘உடன்படிக்கை செய்துகொள்’ என்னும் எபிரெய மரபுத்தொடர். ‘செய்துகொண்ட’ என்பது அதன் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: אֶת אַבְרָהָם
  choice: ஆபிரகாமுடன்
  rationale: אֶת பொதுவாக நேரடிச் செயப்படுபொருளைக் குறித்தாலும், உடன்படிக்கை செய்யும் மரபுத்தொடரில் ஆபிரகாம் உடன்படிக்கையின் மறுதரப்பாக இருப்பதால் ‘ஆபிரகாமுடன்’ என வழங்கப்பட்டது.
- source_word: וּשְׁבוּעָתוֹ
  choice: அவர் அளித்த ஆணையையும்
  rationale: שְׁבוּעָה என்பது உறுதிமொழியாகிய ‘ஆணை’; மூன்றாம் ஆண்பால் ஒருமை உடைமைப் பின்னொட்டின் கருத்தை இயல்பான தமிழில் ‘அவர் அளித்த’ என வெளிப்படுத்துகிறது.
- source_word: לְיִצְחָק
  choice: ஈசாக்குக்கு
  rationale: לְ இங்கு ஆணை யாருக்கு அளிக்கப்பட்டது என்பதைக் குறிக்கிறது; ஆகவே ‘ஈசாக்குக்கு’ என்பது நேரான இயல்பான தமிழ்.
theological_decisions:
- issue: כרת என்னும் ‘வெட்டுதல்’ வினை மூலம் குறிக்கப்படும் உடன்படிக்கை ஏற்படுத்தும் எபிரெய மரபுத்தொடர்
  choice: அவர் ஆபிரகாமுடன் செய்துகொண்ட உடன்படிக்கை
  alternative: அவர் ஆபிரகாமுடன் வெட்டிய உடன்படிக்கை
  rationale: முந்தைய வசனத்தில் உள்ள ‘உடன்படிக்கை’ இங்கு மறைமுகமாகத் தொடர்கிறது. சொற்படியான ‘வெட்டிய’ என்பது நவீன தமிழில் பொருளை மறைக்கும் என்பதால், உடன்படிக்கையின் முழு வலிமையைத் தெளிவாகப் பாதுகாக்கும் இயல்பான மரபு தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன தரத் தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் dignified covenantal register. முந்தைய வசனத்துடன் உள்ள இலக்கணத் தொடர்ச்சியைப் பாதுகாக்க ‘உடன்படிக்கையையும்’ என இரண்டாம் வேற்றுமை வடிவம் பயன்படுத்தப்பட்டது; வசனத்தின் நிறைவின்மையை நீண்ட கோடு காட்டுகிறது.
