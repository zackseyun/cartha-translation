revisions:
- from: அவர்கள் ஒரு நாட்டிலிருந்து மற்றொரு நாட்டிற்கும்[a], ஓர் அரசாட்சியிலிருந்து வேறொரு மக்களிடத்திற்கும் அலைந்து திரிந்தார்கள்.
  to: அவர்கள் ஒரு நாட்டிலிருந்து மற்றொரு நாட்டிற்கு, ஓர் அரசாட்சியிலிருந்து வேறொரு மக்களிடம் இடம் பெயர்ந்தார்கள்[a].
  rationale: The revision retains the Hebrew’s two parallel movements and its distinctions among nation, kingdom, and people. It replaces a potentially over-interpreting verb, improves Tamil coordination, and moves the retained lexical-alternative note to the verb it explains.
