  yaml_path: translation/ot/1_chronicles/016/020.yaml
  text: And they wandered from nation to nation[a], and from one kingdom to another people.
translation:
  language: ta
  text: அவர்கள் ஒரு நாட்டிலிருந்து மற்றொரு நாட்டிற்கு, ஓர் அரசாட்சியிலிருந்து வேறொரு மக்களிடம் இடம் பெயர்ந்தார்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள் ஒரு நாட்டிலிருந்து மற்றொரு நாட்டிற்கு, ஓர் அரசாட்சியிலிருந்து வேறொரு மக்களிடம் அலைந்து திரிந்தார்கள்.”
    reason: וַיִּתְהַלְּכוּ என்பது இடம் இடமாகச் சென்றதைக் குறிக்கிறது. ‘அலைந்து திரிந்தார்கள்’ என்பது சாத்தியமான மொழிபெயர்ப்பு; ஆனால் அதில் நோக்கமற்ற அலைச்சல் என்ற நிழற்பொருள் தோன்றலாம், அது மூலத்தில் கட்டாயமல்ல.
lexical_decisions:
- source_word: וַיִּתְהַלְּכוּ
  choice: அலைந்து திரிந்தார்கள்
  rationale: הלך என்பதன் ஹித்பயேல் வடிவம் இங்கு ஓரிடத்திலிருந்து மற்றோரிடத்திற்குத் தொடர்ந்து சென்றதைக் குறிக்கிறது. ‘அலைந்து திரிந்தார்கள்’ என்பது அந்தத் தொடர் இடப்பெயர்வை இயல்பான தமிழில் வெளிப்படுத்துகிறது; அவசியமாக நோக்கமற்ற அலைச்சலைக் குறிக்க வேண்டியதில்லை.
- source_word: מִגּוֹי אֶל גּוֹי
  choice: ஒரு நாட்டிலிருந்து மற்றொரு நாட்டிற்கு
  rationale: גּוֹי என்பதற்கு இங்கு ‘நாடு’ பொருத்தமானது. எபிரெய மொழியின் ‘ஒன்றிலிருந்து மற்றொன்றுக்கு’ என்ற பகிர்வு அமைப்பைத் தெளிவான நவீன தமிழில் தருகிறது.
- source_word: וּמִמַּמְלָכָה
  choice: ஓர் அரசாட்சியிலிருந்து
  rationale: מַמְלָכָה என்பது ‘அரசாட்சி/ராஜ்யம்’ என்று பொருள்படும். ‘அரசாட்சி’ என்பது ஆட்சிக்குட்பட்ட அரசியல் நிலப்பரப்பைக் குறிக்கும் இயல்பான, சமயச் சார்பற்ற தமிழ் சொல்.
- source_word: אֶל עַם אַחֵר
  choice: வேறொரு மக்களிடம்
  rationale: עַם என்பதை ‘மக்கள்’ என்றும் אַחֵר என்பதை ‘வேறொரு’ என்றும் மொழிபெயர்ப்பது, முன் வந்த גּוֹי (‘நாடு’) என்பதிலிருந்து உள்ள சொல்வேறுபாட்டைப் பாதுகாக்கிறது.
