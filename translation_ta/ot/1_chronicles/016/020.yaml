translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடையில் அமைக்கப்பட்டது. இணையான ‘ஒரு… மற்றொரு… / ஓர்… வேறொரு…’ அமைப்பு எபிரெய வசனத்தின் இயக்கத்தையும் சமநிலையையும் தக்கவைக்கிறது.
