source:
  edition: WLC
  text: הוֹד֤וּ לַ/יהוָה֙ כִּ֣י ט֔וֹב כִּ֥י לְ/עוֹלָ֖ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/034.yaml
  text: Give thanks to Yahweh[a], for he is good[b]; for his steadfast love endures forever.
translation:
  language: ta
  text: யாவேவுக்கு[a] நன்றி செலுத்துங்கள்; ஏனெனில் அவர் நல்லவர்; ஏனெனில் அவரது மாறாத அன்பு[b] என்றென்றும் நிலைத்திருக்கிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேய மூலத்தில் יהוה (YHWH) என்ற இறைபெயர் உள்ளது. அதன் பழங்கால உச்சரிப்பு முழு உறுதியுடன் அறியப்படாவிட்டாலும், இங்கு அது ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டுள்ளது; பல மொழிபெயர்ப்புகள் இதை ‘கர்த்தர்’ என்று வழங்குகின்றன.
    reason: alternative_reading
  - marker: b
    text: ‘மாறாத அன்பு’ என மொழிபெயர்க்கப்பட்ட எபிரேய חֶסֶד (ஹெசெத்) என்ற சொல் உறுதியான அன்பையும் பற்றுறுதியையும் குறிக்கிறது; ‘உடன்படிக்கைக்கு உண்மையாய் நிலைத்திருக்கும் அன்பு’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹד֤וּ
  choice: நன்றி செலுத்துங்கள்
  rationale: ידה என்பதன் ஹிஃபில் பன்மை ஏவல் வடிவம் இத்தகைய வழிபாட்டு மொழிநடையில் ‘நன்றி செலுத்துங்கள்’ அல்லது ‘புகழுங்கள்’ என்று பொருள்படும். இங்கு நன்றியறிதலைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்க ‘நன்றி செலுத்துங்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: לַ/יהוָה֙
  choice: யாவேவுக்கு
  rationale: יהוה என்ற இறைபெயரை பொதுப்பட்டமான ‘கர்த்தர்’ என்று மாற்றாமல், எபிரேய மெய்யெழுத்துப் பெயரின் வழக்கமான உச்சரிப்பைத் தமிழில் ‘யாவே’ என்று ஒலிபெயர்த்துள்ளது.
- source_word: כִּ֣י ... כִּ֥י
  choice: ஏனெனில் ... ;
  rationale: முதல் כִּי நன்றி செலுத்துவதற்கான காரணத்தை அறிமுகப்படுத்துவதால் ‘ஏனெனில்’ என மொழிபெயர்க்கப்பட்டது. இரண்டாவது כִּי அதே காரண விளக்கத்தைத் தொடர்கிறது; தமிழில் கனமான மறுபடிதலைத் தவிர்த்து அரைப்புள்ளியால் இணைத்தாலும் எபிரேய இணைநிலையும் காரணத் தொடர்பும் காக்கப்படுகின்றன.
- source_word: ט֔וֹב
  choice: நல்லவர்
  rationale: எபிரேயத்தில் சொற்பட ‘நல்லவர்/நல்லது’ என்பதே உள்ளது. தமிழில் இறைவனைக் குறிக்கும் பயனிலையாக ‘அவர் நல்லவர்’ என்பது இயல்பானதும் பொருளை விரிவுபடுத்தாததுமாகும்.
- source_word: לְ/עוֹלָ֖ם
  choice: என்றென்றும்
  rationale: לְעוֹלָם காலவரையற்ற நீடிப்பைக் குறிக்கிறது. ‘என்றென்றும்’ என்பது அதன் கவிதைநயத்தையும் நிலைத்த காலப் பொருளையும் இயல்பான தமிழில் தருகிறது.
- source_word: חַסְדּֽ/וֹ
  choice: அவரது மாறாத அன்பு
  rationale: חֶסֶד அன்பு, உறுதியான பற்றுறுதி, உடன்படிக்கைச் சார்ந்த விசுவாசம் ஆகிய பரிமாணங்களைக் கொண்டது. ‘மாறாத அன்பு’ அன்பையும் அதன் நிலைத்த விசுவாசத்தையும் சுருக்கமாகக் காக்கிறது.
- source_word: לְ/עוֹלָ֖ם חַסְדּֽ/וֹ
  choice: அவரது மாறாத அன்பு என்றென்றும் நிலைத்திருக்கிறது
  rationale: எபிரேய வாக்கியத்தில் வெளிப்படையான வினைச்சொல் இல்லை. தமிழில் இயல்பான முழு வாக்கியமாக அமைய ‘நிலைத்திருக்கிறது’ சேர்க்கப்பட்டுள்ளது; இது காலமெல்லாம் தொடரும் חֶסֶד என்ற உட்கருத்தை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יהוה என்ற இறைபெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் உடன்படிக்கைப் பெயரான יהוה நேரடியாக உள்ளது. பொதுப்பட்டத்தால் மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்ப்பது அந்தத் தனிப்பெயரைக் காக்கிறது; உச்சரிப்பில் உள்ள வரலாற்றுச் சிக்கல் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- issue: חֶסֶד என்பதன் பலபரிமாணப் பொருள்
  choice: மாறாத அன்பு
  alternative: உடன்படிக்கை விசுவாசம்; இரக்கம்; பேரன்பு
  rationale: இச்சொல் உணர்வுபூர்வமான அன்பையும் உறுதியான பற்றுறுதியையும் தாங்குகிறது. ‘மாறாத அன்பு’ எந்த ஓர் இறையியல் பரிமாணத்திற்கும் அதைச் சுருக்காமல் இந்த இரு கூறுகளையும் காக்கிறது; உடன்படிக்கை விசுவாசம் என்ற மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, பொதுமக்கள் எளிதில் புரிந்துகொள்ளக்கூடிய மரியாதைமிக்க வழிபாட்டு நடை பயன்படுத்தப்பட்டுள்ளது. எபிரேயச் செய்யுளின் சுருக்கமும் காரணத் தொடரும் அரைப்புள்ளிகளால் காக்கப்பட்டுள்ளன.
