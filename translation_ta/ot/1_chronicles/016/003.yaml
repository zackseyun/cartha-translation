translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மூலத்தின் ‘ஆண் முதல் பெண் வரை’ என்ற வெளிப்பாடு காக்கப்பட்டு, வாக்கிய ஓட்டத்திற்காக இடைக்கோடுகளுக்குள் அமைக்கப்பட்டுள்ளது. அரிதான אֶשְׁפָּר என்பதன் ஐயம் முதன்மை உரையில் மறைக்கப்படாமல் அடிக்குறிப்பில் பதிவு செய்யப்பட்டுள்ளது.
