  text: וַ/יְחַלֵּק֙ לְ/כָל אִ֣ישׁ יִשְׂרָאֵ֔ל מֵ/אִ֖ישׁ וְ/עַד אִשָּׁ֑ה לְ/אִישׁ֙ כִּכַּר לֶ֔חֶם וְ/אֶשְׁפָּ֖ר וַ/אֲשִׁישָֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/003.yaml
  text: He distributed to every person of Israel[a], from man to woman, to each one a loaf of bread, a portion of meat, and a raisin cake.
translation:
  language: ta
  text: அவர் இஸ்ரவேலரான ஒவ்வொருவருக்கும்—ஆண் முதல் பெண் வரை—ஓர் அப்பமும், இறைச்சியின் ஒரு பங்கும்[a], உலர்ந்த திராட்சை அடை ஒன்றும் வழங்கினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஒரு பங்கு’; இது வேறொரு உணவுப் பொருளையும் குறிக்கலாம். אֶשְׁפָּר என்ற எபிரெயச் சொல் அரிதானது; அதன் துல்லியமான பொருள் உறுதியாகத் தெரியவில்லை. பலர் இதை இங்கு இறைச்சியின் ஒரு பங்கு என்று புரிந்துகொள்கிறார்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַלֵּק
  choice: வழங்கினார்
  rationale: பியேல் வினை வடிவம், ஒரு கூட்டத்திலுள்ள ஒவ்வொருவருக்கும் பொருட்களைப் பகிர்ந்தளிப்பதைக் குறிக்கிறது. ‘வழங்கினார்’ என்பது இயல்பான நவீனத் தமிழில் அந்தப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: לְכָל אִישׁ יִשְׂרָאֵל
  choice: இஸ்ரவேலில் உள்ள ஒவ்வொருவருக்கும்
  rationale: אִישׁ இங்கு பகிர்ந்தளிப்பின் ஒவ்வொரு பெறுநரையும் தனித்தனியாகச் சுட்டுகிறது; அடுத்த சொற்றொடர் பெண்களும் இதில் அடங்குவர் என்பதை வெளிப்படையாகக் கூறுவதால், தமிழில் ‘ஒவ்வொருவருக்கும்’ என்பது அதன் உள்ளடக்கிய பகிர்வுப் பொருளை இயல்பாகத் தெரிவிக்கிறது.
- source_word: מֵאִישׁ וְעַד אִשָּׁה
  choice: ஆண் முதல் பெண் வரை
  rationale: பெறுநர்களில் ஆண்களும் பெண்களும் அடங்கிய முழு வரம்பைச் சுட்டும் எபிரெயச் சொல்லமைப்பை நெருக்கமாகவும் புரியத்தக்கவாறும் காக்கிறது.
- source_word: לְאִישׁ
  choice: ஒவ்வொருவருக்கும்
  rationale: முந்தைய சொற்றொடரில் குறிப்பிடப்பட்ட ஆண்கள், பெண்கள் ஆகிய ஒவ்வொரு தனிநபரையும் குறிக்கும் பகிர்வுப் பயன்பாடு தமிழில் தெளிவாக வெளிப்படுகிறது.
- source_word: כִּכַּר לֶחֶם
  choice: ஓர் அப்பம்
  rationale: כִּכָּר இங்கு வட்டமான முழு அப்பத்தைக் குறிக்கலாம்; ‘ஓர் அப்பம்’ நவீனத் தமிழில் இயல்பாகவும் போதுமான துல்லியத்துடனும் உள்ளது.
- source_word: אֶשְׁפָּר
  choice: இறைச்சித் துண்டு ஒன்று
  rationale: இது அரிதான, பொருள் உறுதியாகத் தெரியாத சொல். விருந்து உணவுகள் வழங்கப்படும் இச்சூழலில் இறைச்சியின் ஒரு பங்கு என்ற பொதுவான புரிதலை முதன்மை உரை ஏற்கிறது; ஐயம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: אֲשִׁישָׁה
  choice: உலர்ந்த திராட்சை அடை ஒன்று
  rationale: அழுத்திச் செய்யப்பட்ட ஓர் அடையை, பொதுவாக உலர்ந்த திராட்சையால் செய்யப்பட்டதாகப் புரிந்துகொள்ளப்படும் உணவுப் பொருளை, தெளிவான நவீனத் தமிழில் குறிக்கிறது.
