source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא אָ֣ז נָתַ֤ן דָּוִיד֙ בָּ/רֹ֔אשׁ לְ/הֹד֖וֹת לַ/יהוָ֑ה בְּ/יַד אָסָ֖ף וְ/אֶחָֽי/ו־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/007.yaml
  text: On that day then David first appointed Asaph and his brothers to give thanks to Yahweh[a].
translation:
  language: ta
  text: அந்த நாளில் தாவீது முதன்முறையாக ஆசாபையும் அவரது சகோதரர்களையும் யாவேக்கு நன்றி செலுத்த நியமித்தார்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘முதன்முறையாக’ என்று மொழிபெயர்க்கப்பட்டுள்ள எபிரெயச் சொற்றொடர் பலவகையில் புரிந்துகொள்ளப்படலாம். இதை, ‘ஆசாபையும் அவரது சகோதரர்களையும் தலைமையில் வைத்து நியமித்தார்’ என்றும், ‘முதலில் ஆசாப் மற்றும் அவரது சகோதரர்கள் மூலம் யாவேக்கு நன்றி செலுத்தச் செய்தார்’ என்றும் கொள்ளலாம். இது தொடக்க நிறுவல், முன்னுரிமை, அல்லது தலைமை ஆகியவற்றில் ஒன்றை வலியுறுத்தலாம். ‘நன்றி செலுத்த’ என்பதற்கு ‘துதிக்க’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא אָז
  choice: அந்த நாளில்
  rationale: காலத்தையும் நிகழ்வின் தொடர்ச்சியையும் குறிக்கும் இயல்பான தமிழ் வடிவம். אָז தரும் ‘அப்போது/பின்பு’ என்ற தொடர்ச்சி இச்சூழலில் வாக்கிய அமைப்பிலேயே வெளிப்படுகிறது; தனியாக மொழிபெயர்த்தால் தமிழ் நடையில் தேவையற்ற இரட்டிப்பு ஏற்படும்.
- source_word: נָתַן ... בְּיַד
  choice: பொறுப்பை ... ஒப்படைத்தார்
  rationale: சொல்லுக்குச் சொல் ‘கையில் கொடுத்தார்’ என்றாலும், இங்கு பணி அல்லது வழிபாட்டுச் சேவையை ஒருவரிடம் ஒப்படைத்தல் என்ற நிர்வாகப் பொருள் உள்ளது. தமிழில் ‘ஒப்படைத்தார்’ அந்தச் சொல்லாட்சியின் இயல்பான பொருளைத் தருகிறது.
- source_word: בָּרֹאשׁ
  choice: முதன்முறையாக
  rationale: இச்சொற்றொடர் தொடக்க நிறுவலை, முன்னுரிமையை, அல்லது தலைமை இடத்தைச் சுட்டலாம். சூழலில் ஒரு வழிபாட்டுப் பணியை முதலில் நிறுவியதைக் குறிக்கும் வாசிப்பு முதன்மை உரையில் ஏற்கப்பட்டுள்ளது; மற்ற சாத்தியங்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: לְהֹדוֹת
  choice: நன்றி செலுத்தும்
  rationale: ידה என்பதன் ஹிப்இல் infinitive வழிபாட்டுச் சூழலில் நன்றி செலுத்துதல் அல்லது துதித்தல் எனப் பொருள்படும். ‘நன்றி செலுத்தும்’ என்பது இங்கு தெளிவான, இயல்பான தேர்வு.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: எபிரெய மூலத்தில் வரும் தேவனுடைய தனிப்பெயரான יהוה தமிழில் ‘யாவே’ என்று ஒலிபெயர்க்கப்படுகிறது.
- source_word: אָסָף וְאֶחָיו
  choice: ஆசாபிடமும் அவருடைய சகோதரர்களிடமும்
  rationale: பெயரும் உறவுச் சொல்லும் நேரடியாகப் பாதுகாக்கப்படுகின்றன. இங்கு ‘சகோதரர்கள்’ உடன்பணியாற்றிய லேவியர்களையும் குறிக்கக்கூடும்; ஆனால் மூலத்தின் உறவுச் சொல்லை பொதுப்படுத்தவில்லை.
theological_decisions:
- issue: יהוה என்ற தேவனுடைய பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூல உரை தேவனுடைய தனிப்பெயரை நேரடியாகப் பயன்படுத்துவதால், பட்டப்பெயராக மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டது.
- issue: לְהֹדוֹת என்பதன் வழிபாட்டுப் பொருள்
  choice: நன்றி செலுத்துதல்
  alternative: துதித்தல்
  rationale: இரு பொருள்களும் சாத்தியமானவை. இச்சூழலில் நன்றியறிதலை மையப்படுத்தும் வாசிப்பு இயல்பானது; ‘துதித்தல்’ என்ற பொருளையும் அடிக்குறிப்பு குறிப்பிடுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘கையில் கொடுத்தார்’ என்ற சொல்லுக்குச் சொல் வடிவத்திற்குப் பதிலாக, בְּיַד என்பதன் ஒப்படைப்பு/பொறுப்பு சார்ந்த பொருள் இயல்பான தமிழில் வெளிப்படுத்தப்பட்டுள்ளது. மூலத்தில் வெளிப்படையாக இல்லாத பாடல் அல்லது சங்கீதம் என்ற செயப்படுபொருள் சேர்க்கப்படவில்லை; ‘பொறுப்பு’ என்பது வினைச்சொல் அமைப்பில் மறைந்துள்ள நிர்வாகப் பொருளைத் தெளிவாக்குகிறது.
