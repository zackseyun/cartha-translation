  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יָּבִ֨יאוּ֙ אֶת אֲר֣וֹן הָֽ/אֱלֹהִ֔ים וַ/יַּצִּ֣יגוּ אֹת֔/וֹ בְּ/ת֣וֹךְ הָ/אֹ֔הֶל אֲשֶׁ֥ר נָֽטָה ל֖/וֹ דָּוִ֑יד וַ/יַּקְרִ֛יבוּ עֹל֥וֹת וּ/שְׁלָמִ֖ים לִ/פְנֵ֥י הָ/אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/001.yaml
  text: So they brought in the ark of God and set it in the midst of the tent that David had pitched for it[b][a], and they offered burnt offerings and peace offerings before God.
translation:
  language: ta
  text: அவர்கள் தேவனுடைய பெட்டியைக் கொண்டுவந்து, தாவீது அதற்காக அமைத்திருந்த கூடாரத்தின் நடுவில் அதை வைத்தார்கள்.[a] பின்பு தேவனுக்கு முன்பாகத் தகனபலிகளையும் சமாதானபலிகளையும்[b] செலுத்தினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கூடாரத்தின் உள்ளே” என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொற்றொடர் சொல்லுக்கு சொல் “கூடாரத்தின் நடுவில்” என்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “உறவுப் பலிகள்” அல்லது “நல்வாழ்வுப் பலிகள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבִיאוּ
  choice: கொண்டுவந்து
  rationale: בוא என்பதன் ஹிஃபில் வடிவம் இங்கு பெட்டியைக் கூடாரத்திற்குள் கொண்டுவருவதைக் குறிக்கிறது; தமிழில் ‘கொண்டுவந்து’ இயல்பாக அந்த இயக்கத்தை வெளிப்படுத்துகிறது.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: தேவனுடைய பெட்டி
  rationale: எபிரெயச் சொற்றொடர் ‘தேவனுடைய பெட்டி’ என்றே உள்ளது; ‘உடன்படிக்கைப் பெட்டி’ என்று மூலத்தில் இல்லாத சொல்லைச் சேர்க்கவில்லை.
- source_word: וַיַּצִּיגוּ אֹתוֹ
  choice: அதை வைத்தார்கள்
  rationale: יצג என்பதன் causative பொருள் ஒன்றை உரிய இடத்தில் வைப்பது அல்லது நிலைநிறுத்துவது; இச்சூழலில் ‘வைத்தார்கள்’ தெளிவான இயல்பான தமிழ்.
- source_word: בְּתוֹךְ הָאֹהֶל
  choice: கூடாரத்தின் நடுவில்
  rationale: בְּתוֹךְ என்பது ‘நடுவில்’ என்றும் பொதுவாக ‘உள்ளே’ என்றும் பொருள்படலாம்; முதன்மை உரை அதன் konkretaana இடவியல் நுணுக்கத்தைப் பேணுகிறது.
- source_word: הָאֹהֶל
  choice: கூடாரம்
  rationale: இது பொதுவான ‘கூடாரம்’ என்னும் சொல்; தாவீது அதை அமைத்ததாக வசனம் கூறுவதால், மோசேயின் திருவாசஸ்தலத்தைத் திட்டவட்டமாகக் குறிக்கும் சொல்லை இறக்குமதி செய்யவில்லை.
- source_word: אֲשֶׁר נָטָה לוֹ דָּוִיד
  choice: தாவீது அதற்காக அமைத்திருந்த
  rationale: கூடாரத்தைப் பற்றியபோது נטה என்பது அதை விரித்து அமைத்தலைக் குறிக்கிறது; לוֹ என்பது இங்கு பெட்டிக்காக என்பதைக் குறிப்பதாக இயல்பாகப் புரிகிறது.
- source_word: וַיַּקְרִיבוּ
  choice: செலுத்தினார்கள்
  rationale: பலிச் சூழலில் קרב ஹிஃபில் வடிவம் பலியை அர்ப்பணித்தல் அல்லது செலுத்துதலைக் குறிக்கிறது; ‘பலிகளைச் செலுத்தினார்கள்’ என்பது நடப்பு மரியாதைமிக்க தமிழ்.
- source_word: עֹלוֹת
  choice: தகனபலிகள்
  rationale: முழுவதும் பலிபீடத்தில் எரிக்கப்படும் பலிவகைக்கான வழக்கமான துல்லியமான தமிழ்ச் சொல்.
- source_word: שְׁלָמִים
  choice: சமாதானபலிகள்
  rationale: שׁלם என்னும் சொல்லின் சமாதானம், நலவாழ்வு, உறவு ஆகிய பொருள் வட்டத்தைப் பேணும் நிலைபெற்ற பலியியல் சொல்; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: לִפְנֵי הָאֱלֹהִים
  choice: தேவனுக்கு முன்பாக
  rationale: ‘தேவனுடைய முகத்திற்கு/சந்நிதியில்’ என்ற எபிரெயச் சொற்றொடரின் சுருக்கமான, வெளிப்படையான தமிழ் வடிவம்.
theological_decisions:
- issue: பலிவகைகளின் தனித்தன்மை
  choice: ‘தகனபலிகள்’, ‘சமாதானபலிகள்’ என்ற குறிப்பிட்ட பலியியல் சொற்களைப் பேணுதல்
  alternative: ‘பலிகள்’ என்று பொதுமைப்படுத்துதல்; அல்லது ‘உறவுப் பலிகள்/நல்வாழ்வுப் பலிகள்’ என மொழிபெயர்த்தல்
  rationale: இஸ்ரவேலின் வழிபாட்டில் வேறுபட்ட இரு பலிவகைகளை வசனம் குறிப்பிடுகிறது. அவற்றைப் பொதுமைப்படுத்தாமல் சடங்கு மற்றும் இறையியல் தனித்தன்மையைப் பேணுகிறது; שְׁלָמִים என்பதன் பொருள் பரப்பை அடிக்குறிப்பு வெளிப்படுத்துகிறது.
- issue: கூடாரத்தின் அடையாளம்
  choice: הָאֹהֶל என்பதை ‘கூடாரம்’ என மொழிபெயர்த்தல்
  alternative: ‘திருவாசஸ்தலம்’ என்று மொழிபெயர்த்தல்
  rationale: மூலம் பொதுவான ‘கூடாரம்’ என்னும் பெயரையே பயன்படுத்தி, தாவீது அதை அமைத்ததாகச் சொல்கிறது. மோசேயின் திருவாசஸ்தலம் என்ற அடையாளத்தை வசனத்தில் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகமக் கண்ணியத்தைப் பேணும் வகையிலும் வடிவமைக்கப்பட்டது. ‘பெட்டி’, ‘கூடாரம்’ போன்ற நேரடியான சொற்கள் மூலத்தின் பொதுப்பெயர்களைப் பேணுகின்றன; பலியியல் சொற்கள் மட்டும் தேவையான தொழில்நுட்பத் துல்லியத்துடன் வழங்கப்பட்டுள்ளன.
