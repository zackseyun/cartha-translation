  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יְכַ֣ל דָּוִ֔יד מֵ/הַעֲל֥וֹת הָ/עֹלָ֖ה וְ/הַ/שְּׁלָמִ֑ים וַ/יְבָ֥רֶךְ אֶת הָ/עָ֖ם בְּ/שֵׁ֥ם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/002.yaml
  text: When David finished offering up the burnt offering and the peace offerings[a], he blessed the people in the name of Yahweh.
translation:
  language: ta
  text: தாவீது தகனபலியையும் சமாதானப் பலிகளையும்[a] செலுத்தி முடித்தபோது, யாவேயின் பெயரில் மக்களை ஆசீர்வதித்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உறவுப் பலிகளையும்” அல்லது “நல்வாழ்வுப் பலிகளையும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַל
  choice: முடித்தபோது
  rationale: כלה என்பதன் இந்தக் கதையோட்ட வடிவம் செயல் நிறைவடைந்ததையும், அதன்பின் வந்த ஆசீர்வாதத்துடன் உள்ள காலத் தொடர்பையும் காட்டுகிறது.
- source_word: מֵהַעֲלוֹת
  choice: செலுத்தி
  rationale: מן + עלה என்ற இறையெச்ச அமைப்பு ‘செலுத்தி முடித்தல்’ என்ற பொருளைத் தருகிறது; தமிழில் இயல்பான பலியிடல் வழக்காக இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: הָעֹלָה
  choice: தகனபலி
  rationale: עֹלָה முழுவதும் எரித்துச் செலுத்தப்படும் வழக்கமான பலிவகையைக் குறிக்கிறது; ‘தகனபலி’ துல்லியமும் சுருக்கமும் உடைய நிலையான தமிழ் சொல்.
- source_word: וְהַשְּׁלָמִים
  choice: சமாதானப் பலிகள்
  rationale: שְׁלָמִים சமாதானம், நல்வாழ்வு, உறவு ஆகிய பொருள் பரப்பைக் கொண்ட பலிவகை. அறியப்பட்ட வகைப்பெயராக ‘சமாதானப் பலிகள்’ முதன்மை உரையில் வைக்கப்பட்டது; பிற சாத்தியங்கள் அடிக்குறிப்பில் தரப்பட்டன.
- source_word: וַיְבָרֶךְ
  choice: ஆசீர்வதித்தான்
  rationale: ברך இச்சூழலில் மக்களை ஆசீர்வதித்தல் என்று நேரடியாகப் பொருள்படுகிறது.
- source_word: אֶת־הָעָם
  choice: மக்களை
  rationale: எபிரெய உரையில் ‘மக்கள்’ மட்டுமே உள்ளது; ‘எல்லா’ என்பது சேர்க்கப்படவில்லை.
- source_word: בְּשֵׁם יְהוָה
  choice: யாவேயின் பெயரில்
  rationale: בְּשֵׁם என்பது ‘பெயரில்’ என்று இயல்பாக மொழிபெயர்க்கப்படுகிறது; יהוה தனிப்பெயராக ஒலிபெயர்க்கப்பட்டது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கெழுத்துத் தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரியக்கூடிய ‘யாவே’ என ஒலிபெயர்க்கிறது.
theological_decisions:
- issue: שְׁלָמִים என்ற பலிச்சொல்லின் பொருள்
  choice: சமாதானப் பலிகள்
  alternative: உறவுப் பலிகள்; நல்வாழ்வுப் பலிகள்
  rationale: இச்சொல் சமாதானம், நல்வாழ்வு, கூட்டுறவு ஆகியவற்றை உள்ளடக்கக்கூடும். முதன்மை உரையில் மரபாக அறியப்பட்ட பலிவகைப் பெயர் பயன்படுத்தப்பட்டு, உண்மையான சொற்பொருள் மாற்றுகள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டன.
- issue: יהוה என்ற தெய்வீகப் பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: யெகோவா; கர்த்தர்
  rationale: மூல உரை தெய்வீகத் தனிப்பெயரை நேரடியாகப் பயன்படுத்துவதால், அதை பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் தன்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டு உரைக்கேற்ற கண்ணியமான ஆனால் பொதுவாசகருக்குப் புரியும் நடையில் அமைக்கப்பட்டது. ‘தகனபலி’, ‘சமாதானப் பலிகள்’, ‘ஆசீர்வதித்தான்’ ஆகியவை வேதாகமச் சூழலைத் தெளிவாகக் காக்கின்றன; [a] குறி முதன்மை உரையிலும் இடம்பெறுகிறது.
