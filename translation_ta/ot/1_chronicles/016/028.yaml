source:
  edition: WLC
  text: הָב֤וּ לַֽ/יהוָה֙ מִשְׁפְּח֣וֹת עַמִּ֔ים הָב֥וּ לַ/יהוָ֖ה כָּב֥וֹד וָ/עֹֽז׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/028.yaml
  text: Ascribe to Yahweh[a], families of the peoples, ascribe to Yahweh glory and strength.
translation:
  language: ta
  text: மக்களினங்களின் குடும்பங்களே[a], யாவேவுக்குச் செலுத்துங்கள்; யாவேவுக்கு மகிமையையும் வல்லமையையும் செலுத்துங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மக்களினங்களின் குலங்களே” அல்லது “நாடுகளின் குடும்பங்களே.”
    reason: מִשְׁפְּחוֹת என்பது ‘குடும்பங்கள்’ அல்லது ‘குலங்கள்’ என்றும், עַמִּים என்பது ‘மக்களினங்கள்’ அல்லது ‘நாடுகள்’ என்றும் சூழலுக்கேற்ப மொழிபெயர்க்கப்படலாம்.
lexical_decisions:
- source_word: הָבוּ
  choice: செலுத்துங்கள்
  rationale: இது பன்மை ஏவல் வடிவம். துதிப் பின்னணியில் எதையாவது கடவுளிடம் கொடுப்பதைவிட, அவருக்கு உரிய மகிமையையும் வல்லமையையும் ஏற்றுக்கொண்டு செலுத்துமாறு அழைக்கிறது. மீண்டும் வரும் ஏவல் வடிவமும் தமிழில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: לַיהוָה
  choice: யாவேவுக்கு
  rationale: לְ முன்னொட்டு செயல் நோக்கிச் செலுத்தப்படும் நபரைக் குறிக்கிறது; יהוה என்ற தனிப்பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: מִשְׁפְּחוֹת עַמִּים
  choice: மக்களினங்களின் குடும்பங்களே
  rationale: מִשְׁפְּחוֹת என்பது குடும்பங்கள் அல்லது குலங்கள் போன்ற உறவுமுறைச் சமூகக் குழுக்களைக் குறிக்கிறது; עַמִּים பன்மையில் பல மக்களினங்களைக் குறிக்கிறது. எபிரெயக் கட்டமைப்பையும் உலகளாவிய அழைப்பையும் இத்தேர்வு பாதுகாக்கிறது.
- source_word: כָּבוֹד
  choice: மகிமை
  rationale: துதிச் சூழலில் இச்சொல் கடவுளுக்குரிய பெருமை, கனம், மாட்சி ஆகியவற்றைக் குறிக்கிறது; ‘மகிமை’ இயல்பான வேதாகமத் தமிழாகும்.
- source_word: וָעֹז
  choice: வல்லமை
  rationale: עֹז என்பது பலம் அல்லது வல்லமையைக் குறிக்கிறது. கடவுளின் ஆற்றலைக் குறிப்பிடும் துதிச் சூழலில் ‘வல்லமை’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல உரை இறைவனின் தனிப்பெயரான יהוה என்பதையே பயன்படுத்துகிறது. அதை ஒரு பொதுப் பட்டமாக மாற்றாமல், உடன்படிக்கைப் பெயரைத் தமிழில் ‘யாவே’ என ஒலிபெயர்ப்பது மூலத்தின் தன்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, பொதுமக்களுக்கு விளங்கும் மரியாதைமிக்க துதிநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயத்தில் இருமுறை வரும் הָבוּ என்ற ஏவல் ‘செலுத்துங்கள்’ என இருமுறையும் வைக்கப்பட்டு கவிதை இணைநிலை பாதுகாக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறி அது விளக்கும் சொற்றொடருக்குப் பின் இடப்பட்டுள்ளது.
