  choice: நினைவுகூருங்கள்
  rationale: זכר என்பதன் பன்மை ஏவல் வடிவம்; கடந்தவற்றைச் செயல்முறையாக நினைவுக்குக் கொண்டுவருமாறு அழைக்கிறது. ‘நினைவுகூருங்கள்’ என்பது அதன் அறிவுறுத்தல் வலிமையை இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: נִפְלְאֹתָיו
  choice: அவர் செய்த வியத்தகு செயல்கள்
  rationale: פלאות வியப்பை உண்டாக்கும் அசாதாரண செயல்களைக் குறிக்கிறது. ‘வியத்தகு செயல்கள்’ என்பது அவை வெறும் காட்சிகளல்ல, அவர் நிகழ்த்திய செயல்கள் என்பதையும் வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר עָשָׂה
  choice: அவர் செய்த
  rationale: நிறைவேறிய செயலைக் குறிக்கும் தொடர்புச் சொற்றொடர்; தமிழில் பெயரெச்சத் தொடராக வழங்குவது சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: מֹפְתָיו
  choice: அவருடைய அடையாளங்கள்
  rationale: מופתים தெய்வீக வல்லமையைச் சுட்டிக்காட்டும் அடையாளங்கள் அல்லது முன்னறிகுறிகளைக் குறிக்கலாம். ‘அடையாளங்கள்’ என்பது பொருளை மிகையாகக் குறுக்காமல் பொதுவாகப் புரியும் சொல்லாகும்.
- source_word: וּמִשְׁפְּטֵי פִיהוּ
  choice: அவரது வாயிலிருந்து வந்த நியாயத்தீர்ப்புகள்
  rationale: משפטים என்பது தீர்ப்புகள், விதிமுறைகள் அல்லது ஆணைகள் எனப் பொருள்படலாம். ‘வாயிலிருந்து வந்த’ என்பது அவை அவர் உரைத்தவை என்ற எபிரெய உருவகத்தை இயல்பான தமிழில் காக்கிறது; ‘நியாயத்தீர்ப்புகள்’ அதன் நீதித்துறை நுட்பத்தை முன்வைக்கிறது.
theological_decisions:
- issue: இணைநிலைச் செய்யுளில் வரும் இரண்டு தெய்வீகச் செயல் சொற்களின் மொழிபெயர்ப்பு
  choice: פלאות என்பதற்கு ‘வியத்தகு செயல்கள்’ என்றும் מופתים என்பதற்கு ‘அடையாளங்கள்’ என்றும் வேறுபடுத்தி மொழிபெயர்க்கப்பட்டது.
  alternative: ‘அற்புதங்கள்’ மற்றும் ‘அதிசயங்கள்’ என்று வழங்குதல் அல்லது இரண்டையும் ஒரே சொல்லால் மொழிபெயர்த்தல்.
  rationale: எபிரெயத்தில் பொருள் தொடர்புடையதாயினும் வெவ்வேறான இரண்டு சொற்கள் பயன்படுத்தப்பட்டுள்ளன. அவற்றை வேறுபடுத்துவது செய்யுளின் இணைநிலை அமைப்பையும் ஒவ்வொரு சொல்லின் தனித்த நுட்பத்தையும் காக்கிறது.
- issue: מִשְׁפְּטֵי என்பதன் பொருள் வரம்பு
  choice: முதன்மை உரையில் ‘நியாயத்தீர்ப்புகள்’ என வழங்கி, விதிமுறைகள் மற்றும் ஆணைகள் என்ற சாத்தியங்களை அடிக்குறிப்பில் காக்கப்பட்டது.
  alternative: முதன்மை உரையிலேயே ‘விதிமுறைகள்’ அல்லது ‘ஆணைகள்’ என வழங்குதல்.
  rationale: இச்சொல் நீதித்தீர்ப்பையும் அதிகாரப்பூர்வமான விதிப்பையும் குறிக்கக்கூடும். சூழல் ஒன்றை மட்டும் கட்டாயப்படுத்தாததால் முதன்மைப் பொருளுடன் மாற்றுப் பொருட்களும் வெளிப்படையாகப் பாதுகாக்கப்பட்டன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான அறிவுறுத்தல் நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. கடவுளைக் குறிக்கும் ஒருமைச் சுட்டுப்பெயருக்கு மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது. எபிரெயச் செய்யுளின் மூன்று கூறுகளும் தமிழில் ‘-ஐயும்’ தொடர்களால் இணைக்கப்பட்டுள்ளன.
