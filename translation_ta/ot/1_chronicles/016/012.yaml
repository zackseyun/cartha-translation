base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/012.yaml
  text: Remember his wondrous deeds that he has done[a], his signs[c][b], and the judgments of his mouth.
translation:
  language: ta
  text: அவர் செய்த வியத்தகு செயல்களையும்[a], அவருடைய அடையாளங்களையும்[b], அவரது வாயிலிருந்து வந்த நியாயத்தீர்ப்புகளையும்[c] நினைவுகூருங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவருடைய அற்புதங்களையும்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அவருடைய முன்னறிகுறிகளையும்.’
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘அவரது வாயிலிருந்து வந்த விதிமுறைகளையும் / ஆணைகளையும்.’
    reason: lexical_alternative
lexical_decisions:
