source:
  edition: WLC
  text: דִּרְשׁ֤וּ יְהוָה֙ וְ/עֻזּ֔/וֹ בַּקְּשׁ֥וּ פָנָ֖י/ו תָּמִֽיד׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/011.yaml
  text: Seek Yahweh and his strength[a]; seek his face continually.
translation:
  language: ta
  text: யாவேயையும் அவருடைய வல்லமையையும் நாடுங்கள்; அவருடைய முகத்தை[a] எப்போதும் தேடுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவருடைய பிரசன்னத்தை” (சொல்லர்த்தமாக, “அவருடைய முகத்தை”).
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּרְשׁוּ
  choice: நாடுங்கள்
  rationale: இச்சூழலில் இந்த வினை, வெறுமனே விசாரிப்பதை அல்லாமல், கடவுளை நோக்கித் திரும்பி அவரை ஆர்வத்துடன் நாடுவதைச் சுட்டுகிறது. அடுத்துள்ள בקשׁוּ என்பதிலிருந்து கவித்துவ வேறுபாட்டையும் இது இயல்பாகப் பேணுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் வரும் கடவுளின் தனிப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: וְעֻזּוֹ
  choice: அவருடைய வல்லமையையும்
  rationale: עֹז என்பதன் முதன்மைப் பொருள் வலிமை அல்லது ஆற்றல். இங்கு 'வல்லமை' கடவுளுடைய ஆற்றலை இயல்பாகவும் மேன்மையான நடையிலும் வெளிப்படுத்துகிறது; 'அரண்' என்ற சூழல்சார் பொருள் இவ்விணைப்பில் குறைவாகப் பொருந்துகிறது.
- source_word: בַּקְּשׁוּ
  choice: தேடுங்கள்
  rationale: இந்த வினை ஆர்வத்தோடும் நோக்கத்தோடும் தேடுவதை வலியுறுத்துகிறது. 'நாடுங்கள் ... தேடுங்கள்' என்பது மூலத்தின் இணைநிலையையும் இரு வினைகளின் நுண்ணிய வேறுபாட்டையும் பேணுகிறது.
- source_word: פָנָיו
  choice: அவருடைய முகத்தை
  rationale: சொல்லர்த்தமான 'முகம்' என்ற உருவகத்தை முதன்மை உரையில் பேணுகிறது. இந்த எபிரெய மரபுத்தொடர் கடவுளுடைய தனிப்பட்ட பிரசன்னத்தையும் குறிக்கக்கூடும்; அது அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: תָּמִיד
  choice: எப்போதும்
  rationale: தொடர்ச்சியான அல்லது நிலையான செயலைக் குறிக்கும் இச்சொல்லுக்கு, நவீனத் தமிழில் தெளிவானதும் இயல்பானதுமான இணை இது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரை கடவுளின் தனிப்பெயரான நான்கெழுத்துப் பெயரை நேரடியாகப் பயன்படுத்துகிறது. அதை ஒரு பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் தனிப்பெயர் பயன்பாட்டைப் பேணுகிறது.
- issue: פָנָיו என்பதிலுள்ள உருவகமும் பொருளும்
  choice: முதன்மை உரையில் 'அவருடைய முகத்தை'
  alternative: அவருடைய பிரசன்னத்தை
  rationale: சொல்லர்த்தமான உருவகத்தைப் பேணுவதோடு, அது குறிக்கக்கூடிய தனிப்பட்ட பிரசன்னம் என்ற பொருளை அடிக்குறிப்பில் தெரிவிப்பது மூலத்தின் உருவகச் செறிவையும் பொருள் விரிவையும் தீர்மானமின்றிப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான அறிவுறுத்தல் நடை பயன்படுத்தப்பட்டுள்ளது. இரு பன்மை ஏவல் வினைகளும் மரியாதை/பொது அழைப்பிற்கேற்ற “-ங்கள்” வடிவில் உள்ளன; மூலத்தின் கவித்துவ இணைநிலைக்காக அரைப்புள்ளி பேணப்பட்டுள்ளது.
