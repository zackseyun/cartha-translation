  text: הוֹד֤וּ לַֽ/יהוָה֙ קִרְא֣וּ בִ/שְׁמ֔/וֹ הוֹדִ֥יעוּ בָ/עַמִּ֖ים עֲלִילֹתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/008.yaml
  text: Give thanks to Yahweh[a]; call on his name[b]; make his deeds known among the peoples.
translation:
  language: ta
  text: யாவேவுக்கு[a] நன்றி செலுத்துங்கள்; அவருடைய பெயரைச் சொல்லி அழையுங்கள்; மக்களினங்களிடையே[b] அவர் செய்தவற்றைத் தெரியப்படுத்துங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் יהוה (YHWH) என்ற கடவுளுடைய தனிப்பட்ட பெயர் உள்ளது; அதன் பழங்காலத் துல்லிய உச்சரிப்பு உறுதியாகத் தெரியாவிட்டாலும், பொதுவாக ‘யாவே’ என்று ஒலிபெயர்க்கப்படுகிறது.
    reason: divine_name
  - marker: b
    text: அல்லது, ‘தேசங்களிடையே.’ எபிரெயச் சொல் பல இனமக்களையோ தேசத்தாரையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹד֤וּ
  choice: நன்றி செலுத்துங்கள்
  rationale: ידה என்பதன் ஹிஃபில் பன்மை ஏவல் வடிவம் இந்தத் துதிப்பாடல் சூழலில் கடவுளுக்கு நன்றி செலுத்துவதைக் குறிக்கிறது; இச்சொற்றொடர் நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: לַֽיהוָה
  choice: யாவேவுக்கு
  rationale: יהוה என்ற உடன்படிக்கைப் பெயரைப் பொதுப்பட்டமான ‘ஆண்டவர்’ என்று மாற்றாமல், எபிரெயப் பெயரின் பரவலாக ஏற்றுக்கொள்ளப்பட்ட ஒலிபெயர்ப்பான ‘யாவே’ என்று வழங்குகிறது.
- source_word: קִרְא֣וּ בִ/שְׁמ֔/וֹ
  choice: அவருடைய பெயரைச் சொல்லி அழையுங்கள்
  rationale: קרא + בְּשֵׁם இங்கு கடவுளுடைய பெயரை உச்சரித்து அவரை நோக்கி அழைப்பதை அல்லது வேண்டுவதைக் குறிக்கிறது. ‘பெயரைச் சொல்லி அழையுங்கள்’ என்பது அந்த வழிபாட்டுப் பொருளையும் எபிரெயத் தொடரின் அமைப்பையும் இயல்பான தமிழில் காக்கிறது.
- source_word: הוֹדִ֥יעוּ
  choice: தெரியப்படுத்துங்கள்
  rationale: ידע என்பதன் ஹிஃபில் ஏவல் வடிவத்திலுள்ள ‘அறியும்படி செய்யுங்கள்’ என்ற காரணவினைப் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: בָ/עַמִּ֖ים
  choice: மக்களினங்களிடையே
  rationale: עַמִּים என்பது பன்மையில் பல்வேறு இனமக்களை அல்லது தேசத்தாரைக் குறிக்கலாம். ‘மக்களினங்கள்’ என்பது நவீன அரசியல் நாடுகள் என்ற பொருளைத் தேவையின்றி வரையறுக்காமல் பன்மை இனக்குழுக்களைச் சுட்டுகிறது.
- source_word: עֲלִילֹתָֽי/ו
  choice: அவர் செய்தவற்றை
  rationale: עֲלִילוֹתָיו என்பது அவரது செயல்கள் அல்லது அவர் செய்த காரியங்களைக் குறிக்கிறது. ‘அவர் செய்தவற்றை’ என்பது ‘வல்ல செயல்கள்’ போன்ற மூலத்தில் வெளிப்படையாக இல்லாத மதிப்பீட்டைச் சேர்க்காமல் இயல்பான தமிழில் பொருளை வழங்குகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூல உரையில் நான்கெழுத்து இறைப்பெயர் நேரடியாக உள்ளது. தனிப்பட்ட உடன்படிக்கைப் பெயரைப் பொதுப்பட்டமாக மாற்றாமல் காக்க ‘யாவே’ பயன்படுத்தப்பட்டது; உச்சரிப்பின் வரலாற்றுச் சிக்கல் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- issue: קרא בשמו என்பதன் பொருள்
  choice: அவருடைய பெயரைச் சொல்லி அழையுங்கள்
  alternative: அவருடைய பெயரை அறிவியுங்கள்
  rationale: இத்தொடர் கடவுளை அவரது பெயரால் அழைத்து வேண்டுதல் என்ற பொருளையும், சில சூழல்களில் பெயரை அறிவித்தல் என்ற பொருளையும் ஏற்கக்கூடும். இங்குள்ள வழிபாட்டு ஏவல்களின் தொடரில் வேண்டி அழைத்தல் முதன்மையாகத் தெரிகிறது; ‘பெயரைச் சொல்லி’ என்பது பெயருக்குள்ள முக்கியத்துவத்தைக் காக்கிறது.
translation_notes:
  register: நவீன செந்தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் மரியாதையான ஏவல் நடையைப் பயன்படுத்துகிறது. மூன்று இணையான கட்டளைகளின் ஓட்டம் அரைப்புள்ளிகளால் காக்கப்பட்டுள்ளது. ஆங்கில ஆலோசனை உரையிலுள்ள அடிக்குறிப்பு குறியீடுகள் அவற்றின் சொற்களோடு பொருந்தாமல் இருந்ததால், மூல எபிரெயத்தின் உண்மையான மொழிபெயர்ப்புச் சிக்கல்களுக்கு ஏற்றவாறு குறியீடுகளும் குறிப்புகளும் சீரமைக்கப்பட்டன.
