source:
  edition: WLC
  text: כִּי֩ גָד֨וֹל יְהוָ֤ה וּ/מְהֻלָּל֙ מְאֹ֔ד וְ/נוֹרָ֥א ה֖וּא עַל כָּל אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/025.yaml
  text: For Yahweh is great and greatly to be praised[a], and he is to be feared above all gods.
translation:
  language: ta
  text: ஏனெனில், யாவே பெரியவர்; அவர் மிகவும் போற்றப்படத்தக்கவர்; எல்லாத் தெய்வங்களையும்விட அவர் அஞ்சத்தக்கவர்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அஞ்சத்தக்கவர்’ என்பது பயத்தையும் பயபக்தியையும் எழுப்புகிறவர் என்றும் மொழிபெயர்க்கலாம்; இங்கு எபிரெயச் சொல் வெறும் திகிலை அல்ல, ஆழ்ந்த பிரமிப்போடு கூடிய மரியாதையான அச்சத்தையும் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: சுற்றியுள்ள வழிபாட்டு அழைப்புக்கான காரணத்தை அறிமுகப்படுத்தும் இணைப்புச் சொல்லின் விளக்கத் தன்மையை இயல்பான தமிழில் காக்கிறது.
- source_word: גָדוֹל
  choice: பெரியவர்
  rationale: அளவை மட்டும் அல்லாமல் நிலை, மாட்சிமை ஆகியவற்றிலுள்ள மேன்மையையும் இங்கு குறிக்கிறது; கடவுளைக் குறிக்கும் மரியாதைப் பன்மையுடன் தமிழில் இயல்பாக அமைக்கப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இஸ்ரவேலின் கடவுளுடைய தனிப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், எபிரெய நான்கெழுத்துப் பெயரின் பரவலாக ஏற்கப்பட்ட ஒலிபெயர்ப்பைத் தமிழில் தருகிறது.
- source_word: מְהֻלָּל מְאֹד
  choice: மிகவும் போற்றப்படத்தக்கவர்
  rationale: செயப்பாட்டு எச்ச வடிவத்தின் போற்றுதலுக்குரியவர் என்ற பொருளையும் מְאֹד தரும் வலியுறுத்தலையும் தெளிவான நவீன தமிழில் காக்கிறது.
- source_word: נוֹרָא
  choice: அஞ்சத்தக்கவர்
  rationale: ירא என்ற வேரிலிருந்து வரும் இச்சொல் பயத்தையும் பயபக்தியையும் எழுப்புகிற தன்மையைக் குறிக்கிறது. ‘அற்புதமானவர்’ என்பது அதன் அச்சம் சார்ந்த வலிமையை இழக்கச் செய்யும்; ‘பயங்கரமானவர்’ என்பது வெறும் திகிலை மிகைப்படுத்தக்கூடும்.
- source_word: עַל כָּל אֱלֹהִים
  choice: எல்லாத் தெய்வங்களையும்விட
  rationale: עַל இங்கு ஒப்பீட்டு மேன்மையைக் காட்டுகிறது; ‘எல்லாத் தெய்வங்களையும்விட’ என்பது அந்தப் பொருளைத் தெளிவாகவும் சுருக்கமாகவும் தருகிறது.
- source_word: אֱלֹהִים
  choice: தெய்வங்கள்
  rationale: இச்சூழலில் இது இஸ்ரவேலின் ஒரே கடவுளைக் குறிக்காமல் பிற நாடுகளின் தெய்வங்களைப் பன்மையில் குறிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலவசனம் இறைவனுடைய தனிப்பெயரையே பயன்படுத்துவதால், அதை ஒரு பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்ப்பாகக் கொடுக்கிறது.
- issue: נוֹרָא என்பதன் இறையியல் நுட்பம்
  choice: அஞ்சத்தக்கவர்
  alternative: அற்புதமானவர் / பயங்கரமானவர்
  rationale: மூலச்சொல்லில் பயமும் பயபக்தியும் கலந்துள்ளன. தேர்ந்தெடுக்கப்பட்ட சொல் அந்தத் தீவிரத்தைத் தக்கவைத்துக் கொண்டு, அதை வெறும் வியப்பாகவோ வெறும் திகிலாகவோ சுருக்குவதில்லை.
- issue: ‘எல்லாத் தெய்வங்கள்’ என்பதன் இருப்பியல் நிலை
  choice: மூலத்தின் பன்மைச் சொல்லை அப்படியே வைத்தல்
  alternative: பொய்த் தெய்வங்கள்
  rationale: வசனம் இத்தெய்வங்களின் இருப்பியல் நிலையை இங்கே வெளிப்படையாக வரையறுக்கவில்லை. ‘பொய்’ என்ற விளக்கத்தைச் சேர்க்காமல் மூலத்தின் polemical comparison மற்றும் தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான, வழிபாட்டுக்கேற்ற நடை பயன்படுத்தப்பட்டுள்ளது. கடவுளைக் குறிக்கும் இடங்களில் மரியாதைப் பன்மை காக்கப்பட்டுள்ளது; அரிதான சமயச் சொற்களைத் தவிர்த்து, மூலத்தின் இணை வாக்கிய அமைப்பை அரைப்புள்ளிகளால் தெளிவாக வெளிப்படுத்தியுள்ளது.
