reference: 1 Chronicles 16:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: זֶ֚רַע יִשְׂרָאֵ֣ל עַבְדּ֔/וֹ בְּנֵ֥י יַעֲקֹ֖ב בְּחִירָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/013.yaml
  text: O offspring of Israel his servant[a], sons of Jacob[c][b], his chosen ones.
translation:
  language: ta
  text: அவருடைய ஊழியனாகிய இஸ்ரவேலின் சந்ததியினரே[a], யாக்கோபின் மகன்களே[b], அவரால் தேர்ந்தெடுக்கப்பட்டவர்களே[c]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இஸ்ரவேலின் வித்து’; எபிரெய மொழியில் வழிவந்த அனைவரையும் கூட்டாகக் குறிக்கும் ஒருமைச் சொல் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: ‘மகன்கள்’ என்பதைக் ‘பிள்ளைகள்’ என்றும் மொழிபெயர்க்கலாம்; எபிரெய மொழியில் சொற்சார்ந்து ‘யாக்கோபின் மகன்கள்’ என்றுள்ளது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘அவரால் தெரிந்துகொள்ளப்பட்டவர்களே.’
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶרַע
  choice: சந்ததியினர்
  rationale: இச்சொல் இங்கு இஸ்ரவேலின் வழிவந்த மக்களை ஒரு கூட்டாகக் குறிக்கிறது. ‘விதை’ என்பது சொற்சார்ந்த மாற்றாக இருந்தாலும், நவீன தமிழில் தவறாகப் புரிந்துகொள்ளப்படலாம்; ‘சந்ததியினர்’ பொருளை இயல்பாகவும் தெளிவாகவும் தருகிறது.
- source_word: יִשְׂרָאֵל
  choice: இஸ்ரவேல்
  rationale: தனிப்பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: עַבְדּוֹ
  choice: அவருடைய ஊழியன்
  rationale: עבד என்பதற்கு ‘அடிமை’ என்ற பொருளும் இருக்கலாம்; ஆனால் இங்கு கடவுளோடு இஸ்ரவேலுக்குள்ள உறவையும் பணியையும் குறிக்கும் அடையாளப் பெயராக இருப்பதால் ‘ஊழியன்’ சூழலுக்கு ஏற்றது.
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: எபிரெயச் சொல் ஆண்பால் பன்மையில் சொற்சார்ந்து ‘மகன்கள்’ என்று பொருள்படுகிறது; அதன் வம்சவழி சார்ந்த வடிவம் தக்கவைக்கப்பட்டுள்ளது.
- source_word: יַעֲקֹב
  choice: யாக்கோபு
  rationale: மூதாதையின் பெயருக்கான வழக்கமான தமிழ் வடிவம்; வேற்றுமை உருபுடன் ‘யாக்கோபின்’ என வருகிறது.
- source_word: בְּחִירָיו
  choice: அவரால் தேர்ந்தெடுக்கப்பட்டவர்கள்
  rationale: கடவுள் தேர்ந்தெடுத்த மக்களைக் குறிக்கும் பன்மை தெளிவாகப் பாதுகாக்கப்படுகிறது; கனமான கோட்பாட்டுச் சாயலை ஏற்படுத்தக்கூடிய சிறப்புச் சொல்லுக்குப் பதிலாக இயல்பான தமிழ் வினைத்தொடர் பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: ‘அவருடைய ஊழியன்’ மற்றும் ‘அவரால் தேர்ந்தெடுக்கப்பட்டவர்கள்’ என்பவற்றிலுள்ள மூன்றாம் நபர் ஒருமைச் சுட்டின் குறிப்பு
  choice: அச்சுட்டு கடவுளைக் குறிக்கிறது; இஸ்ரவேல் கடவுளுடைய ஊழியனாகவும், யாக்கோபின் மக்கள் அவரால் தேர்ந்தெடுக்கப்பட்டவர்களாகவும் விவரிக்கப்படுகிறார்கள்.
  alternative: கவிதை அமைப்பில் சுட்டின் குறிப்பை வெளிப்படையாக அடையாளப்படுத்தாமல் அப்படியே விடலாம்.
  rationale: சுற்றியுள்ள வசனங்களில் ஆண்டவருடைய செயல்களை நினைவுகூரும்படி அழைப்பு விடுக்கப்படுவதால், இயல்பான சூழற்பொருள் கடவுளையே சுட்டுகிறது. எனினும் மூலத்தில் கடவுளுடைய பெயர் இவ்வசனத்தில் மீண்டும் கூறப்படாததால் தமிழிலும் ‘அவர்’ என்ற சுட்டே வைக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைநடையின் நேரடி அழைப்பை ‘-ஏ’ விகுதியால் வெளிப்படுத்தியுள்ளோம். மொழிநடை கண்ணியமானதும் பொதுவாசகர்களுக்கு எளிதில் புரியக்கூடியதுமாக வைக்கப்பட்டுள்ளது; மூலத்தின் இணைவரி அமைப்பும் காக்கப்பட்டுள்ளது.
