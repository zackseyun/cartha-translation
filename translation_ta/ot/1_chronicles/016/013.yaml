  source_fidelity: மூல எபிரெயத்தின் இணைவரிகளும் உறவுச் சொற்களும் துல்லியமாகக் காக்கப்பட்டுள்ளன. זֶרַע என்பதன் கூட்டுப்பொருள் ‘சந்ததியினர்’ என இயல்பாகத் தரப்பட்டுள்ளது; עַבְדּוֹ மற்றும் בְּחִירָיו ஆகியவற்றின் மூன்றாம் நபர் சுட்டு கடவுளைக் குறிப்பதும் தமிழில் ‘அவருடைய/அவரால்’ எனச் சரியாக வெளிப்படுகிறது. ‘மகன்கள்’ என்பது בְּנֵי என்பதன் சொற்சார்ந்த ஆண்பால் பன்மையைத் தக்கவைக்கிறது.
  naturalness: ‘-ரே’ எனும் அழைப்பு வடிவம் கவிதைநடைக்கு ஏற்றது. ‘அவருடைய ஊழியனாகிய இஸ்ரவேலின் சந்ததியினரே’ என்ற தொடர் நவீன நிலையான தமிழில் புரிந்துகொள்ளத்தக்கதாகவும் மரியாதையான வேதாகமப் பதிவுக்கு ஏற்றதாகவும் உள்ளது.
  terminology: இஸ்ரவேல், யாக்கோபு ஆகிய பெயர்வடிவங்கள் நிலையானவை. ‘ஊழியன்’ உடன்படிக்கை/இறைசேவைச் சூழலில் ‘servant’ என்பதற்கு பொருத்தமானது; ‘தேர்ந்தெடுக்கப்பட்டவர்கள்’ בְּחִירָיו என்பதன் பன்மை மற்றும் செயற்பொருளைத் தெளிவாகத் தருகிறது. அடிக்குறிப்புகள் மாற்றுச் சொற்களையும் எபிரெய இலக்கணக் குறிப்பையும் பொருத்தமாக வழங்குகின்றன.
