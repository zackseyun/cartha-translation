revisions:
- from: அவர்களுடன் ஏமானும் எதுத்தூனும், யாவேக்கு நன்றி செலுத்துவதற்காகப் பெயர் குறிப்பிட்டு நியமிக்கப்பட்டிருந்த[a] தேர்ந்தெடுக்கப்பட்ட மற்றவர்களும் இருந்தார்கள்; ஏனெனில், அவரது மாறாத அன்பு என்றென்றும் நிலைத்திருக்கிறது.[b]
  to: அவர்களோடு ஏமான், எதுத்தூன், மேலும் பெயரால் குறிப்பிடப்பட்டிருந்த தேர்ந்தெடுக்கப்பட்ட மற்றவர்களும் இருந்தார்கள்; யாவேக்கு நன்றி செலுத்துவதற்காக அவர்கள் அவ்வாறு இருந்தார்கள்; ஏனெனில், அவருடைய நிலையான அன்பு என்றென்றும் உள்ளது.[b]
  rationale: The revised wording replaces the unsupported appointment nuance with explicit naming by name. It also preserves the syntax by placing the purpose phrase with the whole group. The text has been kept concise and natural while retaining the liturgical refrain. Footnote a must be anchored in the text; the revised text should therefore read with [a] after “குறிப்பிடப்பட்டிருந்த.”
