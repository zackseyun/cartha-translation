base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/041.yaml
  text: And with them were Heman and Jeduthun and the rest of those chosen, who were designated by name to give thanks to Yahweh, for his steadfast love endures forever.
translation:
  language: ta
  text: அவர்களோடு ஏமான், எதுத்தூன், மேலும் பெயரால் குறிப்பிடப்பட்டிருந்த தேர்ந்தெடுக்கப்பட்ட மற்றவர்களும் இருந்தார்கள்; யாவேக்கு நன்றி செலுத்துவதற்காக அவர்கள் அவ்வாறு இருந்தார்கள்; ஏனெனில், அவருடைய நிலையான அன்பு என்றென்றும் உள்ளது.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: எபிரெயத்தில், “அவருடைய நிலையான அன்பு என்றென்றும்.” இது வழிபாட்டில் மீண்டும் மீண்டும் பயன்படுத்தப்பட்ட பல்லவி.
    reason: cultural_note
lexical_decisions:
- source_word: וְעִמָּהֶם
  choice: அவர்களுடன் ... இருந்தார்கள்
  rationale: எபிரெயத்தில் வினைச்சொல் வெளிப்படையாக இல்லாவிட்டாலும், தொடர்ந்து வரும் பன்மை நபர்களைக் கருத்தில் கொண்டு இயல்பான தமிழுக்காக ‘இருந்தார்கள்’ சேர்க்கப்பட்டுள்ளது.
- source_word: הֵימָן וִידוּתוּן
  choice: ஏமானும் எதுத்தூனும்
  rationale: இரு நபர்ப் பெயர்களும் எபிரெய உச்சரிப்பை அணுகும் தமிழெழுத்துப் பெயர்ப்புகளாக வழங்கப்பட்டுள்ளன.
- source_word: וּשְׁאָר הַבְּרוּרִים
  choice: தேர்ந்தெடுக்கப்பட்ட மற்றவர்களும்
  rationale: שְׁאָר என்பது மீதியான அல்லது மற்றவர்களையும், הַבְּרוּרִים என்பது தேர்ந்தெடுக்கப்பட்டவர்களையும் குறிக்கிறது; மூலத்தில் வெளிப்படையாக இல்லாத பாலினக் குறிப்பைச் சேர்க்கவில்லை.
- source_word: אֲשֶׁר נִקְּבוּ בְּשֵׁמוֹת
  choice: பெயர் குறிப்பிட்டு நியமிக்கப்பட்டிருந்த
  rationale: נקב என்பதன் நிஃபால் வடிவமும் ‘பெயர்கள்’ என்ற சொல்லும், குறிப்பிட்ட நபர்கள் பெயரால் அடையாளப்படுத்தப்பட்டு நியமிக்கப்பட்டதைச் சுட்டுகின்றன.
- source_word: לְהֹדוֹת
  choice: நன்றி செலுத்துவதற்காக
  rationale: வழிபாட்டுச் சூழலிலும் தொடர்ந்து வரும் பல்லவியிலும், ידה என்பதற்கு ‘நன்றி செலுத்துதல்’ என்பது மிகவும் பொருத்தமான பொருள்.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: יהוה என்ற இறைப் பெயர் பொதுப்பட்டமாக மாற்றப்படாமல், தமிழில் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: כִּי לְעוֹלָם חַסְדּוֹ
  choice: ஏனெனில், அவரது மாறாத அன்பு என்றென்றும் நிலைத்திருக்கிறது
  rationale: חֶסֶד என்பதிலுள்ள உறுதியான, நிலைமாறாத அன்பின் கருத்தை ‘மாறாத அன்பு’ தெரிவிக்கிறது; எபிரெயத்தில் ‘என்றென்றும்’ என்று சுருக்கமாக உள்ளதை இயல்பான தமிழுக்காக ‘நிலைத்திருக்கிறது’ என நிறைவு செய்துள்ளது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூல உரையில் உடன்படிக்கையின் தனிப்பெயரான יהוה நேரடியாக உள்ளது. அதை ஒரு பொதுப்பட்டமாக மாற்றாமல், வழக்கமான தமிழொலிப்புக்கு ஏற்ற ‘யாவே’ என வழங்குவது பெயரின் தன்மையைப் பாதுகாக்கிறது.
- issue: חֶסֶד என்பதன் பொருள்
  choice: மாறாத அன்பு
  alternative: இரக்கம் / உடன்படிக்கை அன்பு
  rationale: இச்சொல் அன்பு, விசுவாசத்தன்மை, உறுதிப்பற்று ஆகிய பொருட்சாயல்களைக் கொண்டது. ‘மாறாத அன்பு’ அவற்றை ஓரளவு தக்கவைக்கிறது; ‘உடன்படிக்கை’ என்ற சொல் இவ்வசனத்தில் வெளிப்படையாக இல்லாததால்正文த்தில் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான வழிபாட்டு நடையில் அமைக்கப்பட்டுள்ளது. மூலத்தின் பன்மை அமைப்பும், தேர்வு மற்றும் பெயரால் நியமித்தல் என்ற கருத்துகளும் பாதுகாக்கப்பட்டுள்ளன.
