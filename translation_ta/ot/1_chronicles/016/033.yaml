source:
  edition: WLC
  text: אָ֥ז יְרַנְּנ֖וּ עֲצֵ֣י הַ/יָּ֑עַר מִ/לִּ/פְנֵ֣י יְהוָ֔ה כִּי בָ֖א לִ/שְׁפּ֥וֹט אֶת הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/033.yaml
  text: Then the trees of the forest will sing for joy before Yahweh[c][b][a], for he comes to judge the earth.
translation:
  language: ta
  text: அப்போது காட்டின் மரங்கள் யாவேயின் முன்னிலையில் மகிழ்ச்சியுடன் பாடும்[a]; ஏனெனில் பூமியை[b] நியாயந்தீர்க்க அவர் வருகிறார்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மகிழ்ச்சியுடன் ஆரவாரம் செய்யும்.’ எபிரெய வினைச்சொல் பாடலாகவோ முழக்கமாகவோ வெளிப்படும் பேருவகையைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘நாட்டை.’ இங்கு படைப்பு முழுவதையும் உள்ளடக்கும் சூழல் ‘பூமி’ என்ற பொருளை ஆதரிக்கிறது.
    reason: alternative_reading
  - marker: c
    text: அல்லது, ‘அவர் வந்துகொண்டிருக்கிறார்.’ எபிரெய வடிவம் கவிதைச் சூழலில் நிச்சயமாக நிகழவிருக்கும் வருகையை உயிரோட்டத்துடன் வெளிப்படுத்தலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: அப்போது
  rationale: தொடர்ந்து நிகழும் காட்சியை அறிமுகப்படுத்தும் கால வினையடையை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: יְרַנְּנוּ
  choice: மகிழ்ச்சியுடன் பாடும்
  rationale: רנן என்பதன் பியேல் வடிவம் மகிழ்ச்சிப் பெருக்குடன் ஒலிப்பதைக் குறிக்கிறது; கவிதைச் சூழலில் ‘மகிழ்ச்சியுடன் பாடும்’ என்பது அதன் கொண்டாட்டத் தொனியைப் பாதுகாக்கிறது.
- source_word: עֲצֵי הַיָּעַר
  choice: காட்டின் மரங்கள்
  rationale: எபிரெயக் கூட்டுச்சொற்றொடரை நேரடியாகவும் இயல்பாகவும் தருவதோடு மரங்களின் ஆளுருவகத்தையும் காக்கிறது.
- source_word: מִלִּפְנֵי
  choice: முன்பாக
  rationale: யாவேயின் முன்னிலையில் நிகழும் மகிழ்ச்சியைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், எபிரெய நான்கெழுத்துப் பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பாகத் தருகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: படைப்பின் மகிழ்ச்சிக்கான காரணத்தைத் தெளிவாக அறிமுகப்படுத்துகிறது.
- source_word: בָא
  choice: வருகிறார்
  rationale: கவிதைச் சூழலில் நிச்சயமாகவும் உயிரோட்டமாகவும் முன்வைக்கப்படும் வருகையை நிகழ்கால வடிவில் பாதுகாக்கிறது.
- source_word: לִשְׁפּוֹט
  choice: நியாயந்தீர்க்க
  rationale: தெய்வீக நீதிநடத்தையின் நீதித்துறை சார்ந்த பொருளை நேரடியாகத் தக்கவைக்கிறது.
- source_word: הָאָרֶץ
  choice: பூமியை
  rationale: படைப்பு முழுவதும் மகிழும் பரந்த சூழலில், குறிப்பிட்ட ஒரு நாட்டைவிட உலகளாவிய பரப்பைக் குறிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் வரும் தனிப்பட்ட தெய்வீகப் பெயரைப் பட்டமாக மாற்றாமல் ஒலிபெயர்த்து, உடன்படிக்கைப் பெயரின் தனித்தன்மையைப் பாதுகாக்கிறது.
- issue: הָאָרֶץ என்பதன் பரப்பு
  choice: பூமி
  alternative: நாடு
  rationale: காடு மற்றும் மரங்கள் பங்கேற்கும் படைப்பளாவிய துதிச் சூழல், உள்ளூர் நிலப்பரப்பைவிட முழுப் பூமியைக் குறிக்கும் வாசிப்பை ஆதரிக்கிறது; இருப்பினும் ‘நாடு’ என்ற பொருளும் சொல்லுக்குச் சாத்தியம்.
- issue: בָא என்பதன் கால/தோற்றப் பொருள்
  choice: வருகிறார்
  alternative: வருகிறார் என்பது நிச்சயமான எதிர்வருகையைக் குறிக்கலாம்; வந்துள்ளார்
  rationale: எபிரெய நிறைவுவடிவம் கவிதையில் உறுதியாக அல்லது நெருங்கி நிகழப்போகும் செயலை உயிரோட்டமாகக் காட்ட முடியும். தமிழ் நிகழ்கால வடிவம் அந்தத் திட்டமிட்ட தெளிவின்மையையும் உறுதியையும் ஓரளவு காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிதில் புரியும், அதேவேளையில் கவிதைத் தன்மையும் மரியாதைத் தொனியும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘மகிழ்ச்சியுடன் பாடும்’ என்ற இயல்பான சொற்றொடர் ஆளுருவகத்தைத் தெளிவாக வைத்திருக்கிறது; ‘நியாயந்தீர்க்க’ என்பது வேதாகமப் பயன்பாட்டில் பரிச்சயமானதாயினும் இன்றைய வாசகருக்கும் புரியக்கூடிய நீதிசார் வினையாக உள்ளது.
