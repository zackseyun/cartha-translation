reference: 1 Chronicles 16:21
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: לֹא הִנִּ֤יחַ לְ/אִישׁ֙ לְ/עָשְׁקָ֔/ם וַ/יּ֥וֹכַח עֲלֵי/הֶ֖ם מְלָכִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/021.yaml
  text: He allowed no man to oppress them[a], and he rebuked kings on their account,
translation:
  language: ta
  text: 'ஒருவரையும் அவர்களை ஒடுக்க அவர் அனுமதிக்கவில்லை;

    அவர்களுக்காக[a] அரசர்களைக் கண்டித்தார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவர்களை முன்னிட்டு’ அல்லது ‘அவர்கள் காரணமாக.’
    reason: עֲלֵיהֶם என்பது நலன், தொடர்பு அல்லது காரணம் சார்ந்த நுண்பொருள்களைத் தரக்கூடும்.
lexical_decisions:
- source_word: הִנִּיחַ
  choice: அனுமதிக்கவில்லை
  rationale: לֹא என்பதுடனும் தொடர்ந்து வரும் வினையெச்சத்துடனும் இச்சொல் ‘அனுமதிக்கவில்லை’ என்ற பொருளைத் தருகிறது; தேவன் அந்தச் செயலை நிகழ விடவில்லை என்பதையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: אִישׁ
  choice: ஒருவரையும்
  rationale: எபிரெயச் சொல்லின் ஒருமை வடிவத்தையும் பொதுப்படையான பொருளையும் ‘ஒருவரையும்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לְעָשְׁקָם
  choice: அவர்களை ஒடுக்குவதற்கு
  rationale: עשׁק என்பது ஒடுக்குதல், அநியாயம் செய்தல், சுரண்டுதல் ஆகிய பொருள் எல்லையைக் கொண்டது; இவ்வரலாற்றுச் சுருக்கத்தில் ‘ஒடுக்குவது’ அதன் பரந்த தீங்கிழைக்கும் பொருளைத் தக்கவைக்கிறது.
- source_word: וַיּוֹכַח
  choice: கண்டித்தார்
  rationale: יכח இச்சூழலில் கடிந்து கண்டிப்பதைக் குறிக்கிறது; அரசர்களை நோக்கிய தேவனுடைய உறுதியான நடவடிக்கையை ‘கண்டித்தார்’ தெளிவாகக் காட்டுகிறது.
- source_word: עֲלֵיהֶם
  choice: அவர்களுக்காக
  rationale: עַל உடன் வரும் பின்னொட்டு இங்கு அவர்களை முன்னிட்டு அல்லது அவர்களுடைய நலனுக்காக நடவடிக்கை எடுத்ததைக் குறிக்கலாம்; ‘அவர்களுக்காக’ பாதுகாப்புச் சார்ந்த நுண்பொருளை இயல்பாகத் தருகிறது, அதேவேளை மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: מְלָכִים
  choice: அரசர்களை
  rationale: இச்சொல் நேரடியாக ‘அரசர்கள்’ என்று பொருள்படுகிறது; பொதுவான ‘ஆட்சியாளர்கள்’ என்று விரிவுபடுத்தச் சூழல் காரணம் இல்லை.
theological_decisions:
- issue: வினைச்சொற்களின் மறைமுக எழுவாய்
  choice: சுற்றியுள்ள சூழலிலிருந்து தொடரும் எழுவாயாகிய தேவனைக் குறிக்க ‘அவர்’ பயன்படுத்தப்பட்டது.
  alternative: குறிப்பிடப்படாத ஓர் எழுவாய்
  rationale: சுற்றியுள்ள பகுதி முற்பிதாக்களைப் பாதுகாத்த ஆண்டவரின் செயல்களைத் தொடர்ந்து விவரிக்கிறது. தமிழிலும் எழுவாயை விடக்கூடியதாக இருந்தாலும், ‘அவர்’ என்பது யாரைக் குறிக்கிறது என்பதைத் தெளிவாக்கி, சூழலைத் தாண்டிய இறையியல் விளக்கத்தைச் சேர்க்காமல் உள்ளது.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பான, கண்ணியமான நடையுடன் அமைக்கப்பட்டது. எபிரெயக் கவிதைநடையின் இணை வாக்கிய அமைப்பு தக்கவைக்கப்பட்டுள்ளது; ‘அவர்’ என்பது சூழலிலிருந்து தேவனைக் குறிக்கிறது.
