  text: וְ/עִמָּ/הֶם֩ הֵימָ֨ן וִֽ/ידוּת֜וּן חֲצֹצְר֤וֹת וּ/מְצִלְתַּ֨יִם֙ לְ/מַשְׁמִיעִ֔ים וּ/כְלֵ֖י שִׁ֣יר הָ/אֱלֹהִ֑ים וּ/בְנֵ֥י יְדוּת֖וּן לַ/שָּֽׁעַר׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/042.yaml
  text: And with them were Heman and Jeduthun with trumpets and cymbals for sounding aloud[a], and instruments for the songs of God; and the sons of Jeduthun were at the gate.
translation:
  language: ta
  text: அவர்களோடு ஏமானும் எதுத்தூனும், ஒலி எழுப்புவதற்கான எக்காளங்களும் கைத்தாளங்களும், தேவனுடைய பாடல்களுக்கான இசைக்கருவிகளும் இருந்தன; எதுத்தூனின் மகன்கள் வாசலில் இருந்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வாசல் காவலர்களாக இருந்தார்கள்.” எபிரெயத்தில் சொல்லர்த்தமாக, “வாசலுக்காக” என்று உள்ளது; இது அவர்களுக்கு ஒதுக்கப்பட்ட வாசல் பணியைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעִמָּהֶם הֵימָן וִידוּתוּן
  choice: அவர்களோடு ஏமானும் எதுத்தூனும் இருந்தார்கள்
  rationale: எபிரெய முன்னிலைத் தொடரில் மறைந்துள்ள ‘இருந்தார்கள்’ என்ற வினையைத் தமிழில் வெளிப்படையாகச் சேர்த்து இயல்பான முழு வாக்கியமாக்குகிறது.
- source_word: חֲצֹצְרוֹת
  choice: எக்காளங்கள்
  rationale: ஆலய வழிபாட்டில் பயன்படுத்தப்பட்ட உலோக ஊதுகருவிகளைக் குறிக்கும் வழக்கமான, புரிந்துகொள்ளத்தக்க தமிழ்ச் சொல்.
- source_word: וּמְצִלְתַּיִם
  choice: கைத்தாளங்கள்
  rationale: ஒன்றோடொன்று மோதிச் சத்தமெழுப்பும் cymbals என்பதற்கான இயல்பான நவீனத் தமிழ் இணை.
- source_word: לְמַשְׁמִיעִים
  choice: முழங்கச் செய்வதற்கான
  rationale: ‘கேட்கும்படி செய்தல்’ என்ற காரணவினைப் பொருளை, இங்கு எக்காளங்களும் கைத்தாளங்களும் எழுப்பும் பொதுவான பேரொலிக்கேற்றவாறு வழங்குகிறது; இசைமெட்டு என மிகையாகக் குறுக்கவில்லை.
- source_word: וּכְלֵי שִׁיר הָאֱלֹהִים
  choice: தேவனுடைய பாடல்களுக்கான இசைக்கருவிகள்
  rationale: ‘தேவனுடைய பாடல்களின்/பாடல்களுக்கான கருவிகள்’ என்ற எபிரெயத் தொடர்பைத் தக்கவைத்து, தமிழில் தெளிவாகவும் இயல்பாகவும் கூறுகிறது.
- source_word: וּבְנֵי יְדוּתוּן
  choice: எதுத்தூனின் மகன்கள்
  rationale: வம்ச மற்றும் லேவியப் பணிச்சூழலில் בְּנֵי என்பதன் நேரடியான ‘மகன்கள்’ என்ற பொருளைப் பாதுகாக்கிறது.
- source_word: לַשָּׁעַר
  choice: வாசலில் இருந்தார்கள்
  rationale: ‘வாசலுக்கு/வாசலுக்காக’ என்ற சுருக்கமான எபிரெயச் சொல்லாக்கத்தை இடப்பொருளுடன் இயல்பாக வழங்குகிறது; அது நியமிக்கப்பட்ட வாசல் காவல் பணியைக் குறிக்கலாம் என்பதைக் குறிப்பில் பாதுகாக்கிறது.
