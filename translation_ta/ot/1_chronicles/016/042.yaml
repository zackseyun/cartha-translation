translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. நீண்ட எபிரெய இணைப்புத் தொடரை வாசிப்புத் தெளிவுக்காக இரண்டு வாக்கியங்களாக அமைத்தாலும், பெயர்கள், கருவிகள், அவற்றின் நோக்கம், வாசல் பணி ஆகிய தகவல்கள் அனைத்தும் பாதுகாக்கப்பட்டுள்ளன.
