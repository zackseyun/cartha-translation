id: 1CH.16.23
reference: 1 Chronicles 16:23
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: שִׁ֤ירוּ לַֽ/יהוָה֙ כָּל הָ/אָ֔רֶץ בַּשְּׂר֥וּ מִ/יּֽוֹם אֶל י֖וֹם יְשׁוּעָתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/023.yaml
  text: Sing to Yahweh[a], all the earth[b]; proclaim his salvation from day to day.
translation:
  language: ta
  text: 'பூமியெங்கும், யாவேக்குப்[a] பாடுங்கள்;

    அவருடைய மீட்பை நாளுக்கு நாள் அறிவியுங்கள்[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் יהוה (YHWH) என்ற இறைப் பெயர் உள்ளது; அது இங்கு ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டுள்ளது.
    reason: alternative_reading
  - marker: b
    text: ‘அவருடைய மீட்பின் நற்செய்தியை நாள்தோறும் அறிவியுங்கள்’ என்றும் மொழிபெயர்க்கலாம். பயன்படுத்தப்பட்ட வினைச்சொல் நற்செய்தியைக் கொண்டுவருவது அல்லது அறிவிப்பது என்ற பொருளைக் கொண்டது.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁירוּ
  choice: பாடுங்கள்
  rationale: שׁיר என்பதன் பன்மை ஏவல் வடிவை நேரடியாகவும் இயல்பாகவும் தருகிறது; மூலத்தில் இல்லாத ‘துதியுங்கள்’ என்ற கருத்தைச் சேர்க்கவில்லை.
- source_word: לַיהוָה
  choice: யாவேக்குப்
  rationale: לְ முன்னொட்டு ‘-க்கு’ என்றும், יהוה என்ற தனிப்பட்ட இறைப் பெயர் ‘யாவே’ என்றும் ஒலிபெயர்க்கப்பட்டது.
- source_word: כָּל־הָאָרֶץ
  choice: பூமியனைத்துமே
  rationale: பாடலின் உலகளாவிய அழைப்பைச் சுட்டுவதால் אָרֶץ என்பதற்கு இங்கு ‘நாடு’ என்பதைக் காட்டிலும் ‘பூமி’ பொருத்தமானது; கவிதைநடையிலுள்ள நேரடி அழைப்பும் காக்கப்படுகிறது.
- source_word: בַּשְּׂרוּ
  choice: நற்செய்தியாக அறிவியுங்கள்
  rationale: בשׂר என்பதன் பியேல் ஏவல் வடிவம் வெறுமனே அறிவிப்பதைவிட நற்செய்தியை அறிவிக்கும் உட்பொருளைக் கொண்டுள்ளது; தமிழில் அந்த நுணுக்கம் வெளிப்படையாகக் காக்கப்படுகிறது.
- source_word: מִיּוֹם אֶל־יוֹם
  choice: நாளுக்கு நாள்
  rationale: தொடர்ச்சியாக ஒவ்வொரு நாளும் நிகழ்வதைச் சொல்லும் எபிரெயச் சொற்றொடருக்கு இயல்பான தமிழ்ச் சமவிகிதம்.
- source_word: יְשׁוּעָתוֹ
  choice: அவருடைய மீட்பை
  rationale: יְשׁוּעָה குறிக்கும் காப்பு அல்லது விடுதலையின் பரந்த பொருளை ‘மீட்பு’ இயல்பாகத் தருகிறது; சூழல் நிர்ணயிக்காத குறிப்பிட்ட கோட்பாட்டுப் பொருளைத் திணிக்கவில்லை.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரையில் பொதுப்பட்டப் பெயர் அல்ல, நான்கெழுத்து இறைப் பெயரே உள்ளது. அதை ‘யாவே’ என்று ஒலிபெயர்ப்பது பெயரின் தன்மையைத் தெளிவாகக் காக்கிறது.
- issue: יְשׁוּעָה என்பதன் பொருள்
  choice: மீட்பு
  alternative: இரட்சிப்பு / விடுதலை
  rationale: இங்கு உடல், தேசிய அல்லது ஆன்மீக விடுதலை என்று உரை வரம்பிடவில்லை. ‘மீட்பு’ அந்தப் பரப்பையும் இறையியல் திறந்தநிலையையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் பாடலுக்குரிய கண்ணியமும் கவித்துவ அழைப்பும் காக்கப்பட்டுள்ளன. ‘பூமியனைத்துமே’ என்பது பூமியை நேரடியாக அழைக்கும் எபிரெயக் கவிதைநடையைப் பாதுகாக்கிறது.
