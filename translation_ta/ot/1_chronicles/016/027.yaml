id: 1CH.16.27
reference: 1 Chronicles 16:27
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: ה֤וֹד וְ/הָדָר֙ לְ/פָנָ֔י/ו עֹ֥ז וְ/חֶדְוָ֖ה בִּ/מְקֹמֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/027.yaml
  text: Splendor and majesty are before him[a]; strength and joy are in his place.
translation:
  language: ta
  text: மாட்சியும் மகத்துவமும் அவர் முன்னிலையில் இருக்கின்றன; வலிமையும் மகிழ்ச்சியும் அவர் இருக்கும் இடத்தில்[a] இருக்கின்றன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவர் வசிக்கும் இடத்தில்’ அல்லது ‘அவருடைய பரிசுத்த இடத்தில்.’ எபிரெய மூலத்தில் ‘அவர் இருக்கும் இடத்தில்’ என்ற பரந்த சொற்றொடர் உள்ளது; சங்கீதம் 96:6-இன் இணையான வாசகத்திலோ ‘அவருடைய பரிசுத்த இடத்தில்’ என்று உள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹד
  choice: மாட்சி
  rationale: அரசருக்குரிய மேன்மையையும் பொலிவையும் குறிக்கும் சொல்லாக, הָדָר என்பதிலிருந்து வேறுபடுத்தி கவிதை இணையைப் பாதுகாக்கிறது.
- source_word: הָדָר
  choice: மகத்துவம்
  rationale: கம்பீரமான மேன்மை அல்லது மாண்பை உணர்த்துகிறது; ‘மாட்சி’ என்பதுடன் இயல்பான உயர்நடை இணையாக அமைகிறது.
- source_word: לְפָנָיו
  choice: அவருக்கு முன்பாக
  rationale: ‘அவருக்கு முன்/அவருடைய முகத்திற்கு முன்’ என்ற எபிரெய இடவுறவுப் படிமத்தை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: עֹז
  choice: வலிமை
  rationale: சொல்லின் பொதுவான ‘strength/might’ பொருளை நேராகவும் தெளிவாகவும் தருகிறது.
- source_word: חֶדְוָה
  choice: மகிழ்ச்சி
  rationale: மகிழ்வு அல்லது களிப்பைக் குறிக்கும் சொல்லுக்கு நவீனத் தமிழில் இயல்பான, கவிதைக்கு ஏற்ற தேர்வு.
- source_word: בִּמְקֹמוֹ
  choice: அவருடைய இடத்தில்
  rationale: מָקוֹם என்பதன் பரந்த ‘இடம்’ என்ற பொருளைப் பாதுகாக்கிறது; மூலத்தில் இல்லாத ‘பரிசுத்த இடம்’ என்ற குறுகிய பொருளை முதன்மை உரையில் சேர்க்கவில்லை.
theological_decisions:
- issue: מְקוֹמוֹ என்பது குறிப்பாக பரிசுத்த இடத்தையா ஆலயத்தையா குறிக்கிறது?
  choice: அவருடைய இடத்தில்
  alternative: அவர் வாசம்பண்ணும் இடத்தில்; அவருடைய பரிசுத்த இடத்தில்
  rationale: வழிபாட்டுச் சூழலும் சங்கீதம் 96:6-இன் இணை வசனமும் ‘பரிசுத்த இடம்’ என்ற புரிதலை ஆதரிக்கக்கூடும். ஆயினும் நாளாகமத்தின் எபிரெய உரை பரந்த מָקוֹם (‘இடம்’) என்ற சொல்லையே பயன்படுத்துவதால், அதை ஒத்திசைத்து குறுக்காமல் முதன்மை உரையில் பாதுகாத்து, சூழல்சார்ந்த மாற்றுப் புரிதல்களை அடிக்குறிப்பில் தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. இரு இணையான பெயர்ச்சொல் ஜோடிகளும் பாதுகாக்கப்பட்டுள்ளன; ‘இடம்’ என்பதன் மூலமொழிச் சார்ந்த பரந்த தன்மை அடிக்குறிப்புடன் தக்கவைக்கப்பட்டுள்ளது.
