- from: மாட்சியும் மகத்துவமும் அவருக்கு முன்பாக இருக்கின்றன; வலிமையும் மகிழ்ச்சியும் அவருடைய இடத்தில்[a] இருக்கின்றன.
  to: மாட்சியும் மகத்துவமும் அவர் முன்னிலையில் இருக்கின்றன; வலிமையும் மகிழ்ச்சியும் அவர் இருக்கும் இடத்தில்[a] இருக்கின்றன.
  rationale: The revision makes small register and idiom improvements only. It retains the Hebrew poetic parallelism, preserves the distinction between the two first nouns, and keeps מְקוֹמוֹ broad in the main text. The footnote continues to identify ‘dwelling place’ and ‘sanctuary’ as contextual alternatives rather than resolving the Hebrew term to either one.
