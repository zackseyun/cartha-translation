  text: בִּֽ/הְיֽוֹתְ/כֶם֙ מְתֵ֣י מִסְפָּ֔ר כִּ/מְעַ֖ט וְ/גָרִ֥ים בָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/019.yaml
  text: when you were few in number[a], very few, and sojourners in it,
translation:
  language: ta
  text: நீங்கள் எண்ணிக்கையில் சிலராக, மிகச் சிலராக[a], அதில் அந்நியர்களாகத் தங்கியிருந்தபோது,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மிக மிகச் சிலராக” அல்லது “ஏறக்குறைய எவருமே இல்லாதவர்களாக” என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொற்றொடர் அவர்களுடைய மிகச் சிறிய எண்ணிக்கையை வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּהְיוֹתְכֶם
  choice: நீங்கள் ... இருந்தபோது
  rationale: ב plus the infinitive construct of היה and the second-person plural suffix forms a temporal clause; this Tamil construction expresses it naturally.
- source_word: מְתֵי מִסְפָּר
  choice: எண்ணிக்கையில் சிலராக
  rationale: The Hebrew idiom denotes people who were few and readily countable; the Tamil wording preserves both the numerical idea and the smallness of the group.
- source_word: כִּמְעַט
  choice: மிகச் சிலராக
  rationale: In this context the expression reinforces how small their number was. This rendering keeps the emphatic repetition, while the footnote preserves the stronger possible nuance.
- source_word: וְגָרִים
  choice: அந்நியர்களாகத் தங்கியிருந்த
  rationale: The participle from גור refers to residing somewhere without belonging to the native population. This is clearer in modern Tamil than a technical noun and preserves the temporary, foreign-resident sense.
- source_word: בָּהּ
  choice: அதில்
  rationale: The feminine singular suffix points back to the land in the surrounding context. The pronoun 'அதில்' preserves that backward reference without unnecessarily repeating the noun.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. எபிரெய மூலத்தின் ‘சிலர்—மிகச் சிலர்’ என்ற வலியுறுத்தும் மறுகூற்றும், அந்த நாட்டில் அந்நியர்களாக வாழ்ந்த நிலையும் பாதுகாக்கப்பட்டுள்ளன.
