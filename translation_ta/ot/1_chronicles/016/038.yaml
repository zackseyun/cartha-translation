translation_notes:
  register: நவீனத் தரத் தமிழில், பட்டியல் நடையின் சுருக்கத்தையும் வரலாற்று நூலுக்குரிய கண்ணியமான தொனியையும் காக்கும் மொழிபெயர்ப்பு. ‘வாயிற்காவலர்கள்’ என்பது ஆலய/புனிதப் பணிச்சூழலுக்கு ஏற்ற தெளிவான சொல். அடிக்குறிப்பு குறியீடு உரையில் இடம்பெற்றுள்ளது.
