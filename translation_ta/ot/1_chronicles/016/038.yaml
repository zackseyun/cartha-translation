base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/038.yaml
  text: And Obed-edom and their brothers[a], sixty-eight; and Obed-edom son of Jeduthun and Hosah were gatekeepers.
translation:
  language: ta
  text: ஓபேத்-ஏதோமும் அவர்களுடைய சகோதரர்களும்[a] அறுபத்தெட்டுப் பேர்; எதித்தூனின் மகன் ஓபேத்-ஏதோமும் ஓசாவும் வாயிற்காவலர்களாக இருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில், ‘அவர்களுடைய சகோதரர்கள்.’ உறவைத் தெளிவுபடுத்துவதற்காகச் சில மொழிபெயர்ப்புகள் இதை ‘அவனுடைய சகோதரர்கள்’ என்று வழங்குகின்றன; இங்கு பெறப்பட்ட எபிரேய உரையின் பன்மை உடைமை விகுதி பின்பற்றப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/עֹבֵד אֱדֹם
  choice: ஓபேத்-ஏதோமும்
  rationale: முந்தைய வசனத்தின் பட்டியல் தொடர்வதைத் தமிழின் இணைப்பும்மை இயல்பாக வெளிப்படுத்துகிறது; பெயர் எபிரேய ஒலிப்புக்கு ஏற்ப எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: וַ/אֲחֵי/הֶם
  choice: அவர்களுடைய சகோதரர்களும்
  rationale: பெறப்பட்ட எபிரேய உரையிலுள்ள மூன்றாம் நபர் ஆண்பால் பன்மை உடைமை விகுதியை மாற்றாமல் காக்கிறது. சுட்டப்படுபவர்கள் யார் என்பது சுருக்கமாக இருப்பதால் பன்மையை ஒருமையாகத் தெளிவுபடுத்தவில்லை.
- source_word: שִׁשִּׁים וּ/שְׁמוֹנָה
  choice: அறுபத்தெட்டுப் பேர்
  rationale: எண்ணிக்கையை இயல்பான நவீனத் தமிழில் தருகிறது; மனிதர்களின் எண்ணிக்கை என்பதால் ‘பேர்’ சேர்க்கப்பட்டது.
- source_word: בֶּן יְדִיתוּן
  choice: எதித்தூனின் மகன்
  rationale: வம்ச அடையாளத்தை நேரடியாகவும் இயல்பான தமிழ் உறவுமுறை அமைப்பிலும் வழங்குகிறது.
- source_word: וְ/חֹסָה
  choice: ஓசாவும்
  rationale: பெயர் எபிரேய ஒலிப்புக்கு ஏற்ப எழுத்துப்பெயர்க்கப்பட்டு, ஓபேத்-ஏதோமுடன் ஒரே பணியில் இணைக்கப்படுவதை இணைப்பும்மை காட்டுகிறது.
- source_word: לְ/שֹׁעֲרִים
  choice: வாயிற்காவலர்களாக இருந்தார்கள்
  rationale: לְ முன்னொட்டு இங்கு நியமனம் அல்லது பணிப்பங்கைக் குறிக்கிறது; தமிழில் முழுமையான பயனிலையாக இயல்பாகத் தர ‘இருந்தார்கள்’ சேர்க்கப்பட்டது.
