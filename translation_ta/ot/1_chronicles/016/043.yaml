source:
  edition: WLC
  text: וַ/יֵּלְכ֥וּ כָל הָ/עָ֖ם אִ֣ישׁ לְ/בֵית֑/וֹ וַ/יִּסֹּ֥ב דָּוִ֖יד לְ/בָרֵ֥ךְ אֶת בֵּיתֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/043.yaml
  text: Then all the people went[a], each man to his house, and David turned to bless his household.
translation:
  language: ta
  text: பின்பு மக்கள் அனைவரும் அவரவர் வீட்டுக்குச் சென்றார்கள். தாவீது தன் வீட்டாரை[a] ஆசீர்வதிக்கத் திரும்பினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல்லை ‘தன் வீட்டை’ என்றும் மொழிபெயர்க்கலாம். அது ஒரு கட்டிடத்தையோ, அந்த வீட்டைச் சேர்ந்த குடும்பத்தாரையோ குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: சென்றார்கள்
  rationale: הלך என்பதன் தொடர்கதை வடிவம் அடுத்த நிகழ்வைக் குறிக்கிறது; ‘சென்றார்கள்’ என்பது எளிய, இயல்பான தமிழாக்கம்.
- source_word: כָל הָעָם
  choice: மக்கள் அனைவரும்
  rationale: עם இங்கு கூடியிருந்த மக்கள் முழுவதையும் குறிக்கிறது; ‘மக்கள் அனைவரும்’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: אִישׁ לְבֵיתוֹ
  choice: அவரவர் வீட்டுக்கு
  rationale: אִישׁ இங்கு பகிர்ந்தளிக்கும் பொருளில், ஒவ்வொருவரையும் தனித்தனியாகக் குறிக்கிறது. ‘அவரவர்’ அந்தப் பொருளை இயல்பான தமிழில் தருகிறது; לְבֵיתוֹ அவருடைய சொந்த வீட்டுக்குச் செல்வதைக் குறிக்கிறது.
- source_word: וַיִּסֹּב
  choice: திரும்பினார்
  rationale: סבב இங்கு பொதுக்கூட்டத்திலிருந்து தன் வீட்டை நோக்கித் திசைமாறியதைக் குறிக்கிறது. ‘திரும்பினார்’ மூலத்தின் இயக்கப் பொருளைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: לְבָרֵךְ
  choice: ஆசீர்வதிக்க
  rationale: ברך என்பதன் நோக்கத்தைக் குறிக்கும் வினையெச்ச வடிவத்தை ‘ஆசீர்வதிக்க’ நேரடியாகவும் மரபான முறையிலும் தருகிறது.
- source_word: בֵּיתוֹ
  choice: தன் வீட்டாரை
  rationale: இரண்டாவது בַּיִת இச்சூழலில் கட்டிடத்தைவிட தாவீதின் குடும்பம் அல்லது வீட்டைச் சேர்ந்தவர்களைக் குறிக்கும் வாய்ப்பு அதிகம். ‘வீட்டார்’ அந்தக் கூட்டுப் பொருளை இயல்பாகத் தருகிறது; சொல்லின் அடிப்படை இருபொருள் தன்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
