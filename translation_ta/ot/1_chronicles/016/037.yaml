base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/037.yaml
  text: So he left Asaph and his brothers there before the ark of the covenant of Yahweh[a], to minister before the ark continually, according to each day's requirement.
translation:
  language: ta
  text: அவர் ஆசாபையும் அவனுடைய சகோதரர்களையும் யாவேவின் உடன்படிக்கைப் பெட்டியின் முன்பாக அங்கே விட்டுவைத்தார்; அவர்கள் அந்தப் பெட்டியின் முன்பாகத் தொடர்ந்து, ஒவ்வொரு நாளுக்கும் உரிய கடமையின்படி ஊழியம் செய்வதற்காக.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில் சொல்லுக்குச் சொல்: “ஒரு நாளின் காரியத்தின்படி, அதற்குரிய நாளில்.” இதை “ஒவ்வொரு நாளும் தேவையானபடி” என்றும் மொழிபெயர்க்கலாம்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲזָב
  choice: விட்டுவைத்தார்
  rationale: עזב என்பதன் அடிப்படைப் பொருளான ‘விட்டுச் செல்லுதல்’ என்பதையும், தொடர்ந்த பணிக்காக அங்கே இருக்கச் செய்த நிர்வாகச் சூழலையும் இயல்பாக வெளிப்படுத்துகிறது; ‘நியமித்தார்’ என்பது அதிக விளக்கவுரையாகிவிடும்.
- source_word: שָׁם
  choice: அங்கே
  rationale: அவர்கள் தங்கியிருந்த இடத்தைச் சுட்டும் எளிய இடவினையடை.
- source_word: לִפְנֵי אֲרוֹן בְּרִית יְהוָה
  choice: யாவேவின் உடன்படிக்கைப் பெட்டிக்கு முன்பாக
  rationale: לִפְנֵי என்பதன் இடவியல் மற்றும் வழிபாட்டுச் சார்ந்த ‘முன்பாக’ என்ற பொருளைப் பேணுகிறது; יְהוָה என்பது உடன்படிக்கைப் பெயராக ‘யாவே’ என ஒலிபெயர்க்கப்படுகிறது.
- source_word: לְאָסָף וּלְאֶחָיו
  choice: ஆசாபையும் அவனுடைய சகோதரர்களையும்
  rationale: אֶחָיו என்பதன் நேரடியான ‘அவனுடைய சகோதரர்கள்’ என்ற சொல்லாக்கத்தைப் பேணுகிறது; சூழலில் இது உடன் பணியாற்றிய லேவியர்களையும் குறிக்கக்கூடும்.
- source_word: לְשָׁרֵת
  choice: ஊழியம் செய்யும்படி
  rationale: שרת இங்கு பரிசுத்தப் பெட்டிக்கு முன்பாக நடைபெறும் வழிபாட்டுப் பணியைக் குறிக்கிறது; ‘ஊழியம் செய்’ என்பது அந்தச் சடங்கு/ஆராதனை நுணுக்கத்தை இயல்பாகத் தருகிறது.
- source_word: תָּמִיד
  choice: எப்போதும்
  rationale: தொடர்ச்சியாகவும் ஒழுங்காகவும் நடைபெறும் வழிபாட்டுப் பணியைச் சுருக்கமாகக் குறிக்கிறது.
- source_word: לִדְבַר יוֹם בְּיוֹמוֹ
  choice: ஒவ்வொரு நாளுக்கும் உரிய பணியின்படி
  rationale: ‘ஒரு நாளின் காரியம் அதற்குரிய நாளில்’ என்ற எபிரெயச் சொற்றொடரின் நாளாந்தக் கடமை/தேவையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் நான்கு எழுத்துகளைக் கொண்ட உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது. பொதுப்பட்டமான ‘கர்த்தர்’ என்பதற்குப் பதிலாக ‘யாவே’ என்பது அந்தத் தனிப்பெயரைப் பேணுகிறது.
- issue: ‘சகோதரர்கள்’ என்பதன் உறவுப் பரப்பு
  choice: சகோதரர்கள்
  alternative: உடன் பணியாற்றியவர்கள் / உறவினர்கள்
  rationale: இச்சூழலில் உடன் பணியாற்றிய லேவியர்களைக் குறிக்கும் விரிவான சமூகப் பொருள் இருக்கலாம்; இருந்தாலும் மூலத்தின் குடும்பச் சொல்லையும் அதன் சாத்தியமான பரப்பையும் மொழிபெயர்ப்பில் பேணுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கண்ணியமான வேதாகம நடையுடன் மொழிபெயர்க்கப்பட்டது. நீண்ட எபிரெய வாக்கியத்தின் நோக்கத் தொடர்பு தமிழில் தெளிவாக இருக்க ‘அவர்கள்… அவ்வாறு செய்தார்’ என்ற அமைப்பு பயன்படுத்தப்பட்டது; ‘உடன்படிக்கைப் பெட்டி’, ‘ஊழியம்’ ஆகியவை சாதாரண வாசகருக்கும் புரியும் வழிபாட்டுச் சொற்களாக வைக்கப்பட்டுள்ளன.
