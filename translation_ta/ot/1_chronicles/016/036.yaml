  text: בָּר֤וּךְ יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל מִן הָ/עוֹלָ֖ם וְ/עַ֣ד הָ/עֹלָ֑ם וַ/יֹּאמְר֤וּ כָל הָ/עָם֙ אָמֵ֔ן וְ/הַלֵּ֖ל לַֽ/יהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/036.yaml
  text: Blessed be Yahweh[a], the God of Israel, from everlasting to everlasting. Then all the people said[b], “Amen!” and praised Yahweh.
translation:
  language: ta
  text: இஸ்ரவேலின் கடவுளாகிய யாவே, நித்தியத்திலிருந்து நித்தியம் வரை[a] போற்றப்படுவாராக! பின்னர் மக்கள் அனைவரும், “ஆமென்!” என்று சொல்லி, யாவேயைப் புகழ்ந்தார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என்றென்றும்,” “காலங்காலமாக.”
    reason: lexical_alternative
  - marker: b
    text: எபிரேயச் சொற்றொடர் சுருக்கமாக, “ஆமென்; யாவேக்குப் புகழ்” அல்லது “ஆமென்; யாவேயைப் புகழுங்கள்” என்றும் புரிந்துகொள்ளப்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: போற்றப்படுவாராக
  rationale: இது இறைவனை வாழ்த்திப் போற்றும் வழிபாட்டு வாய்பாட்டில் வரும் செயல்பாட்டு இடைச்சொல். நவீனத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் ஒலிக்க, ஆசீர்வாதமும் புகழ்ச்சியும் கலந்த அதன் பொருளை ‘போற்றப்படுவாராக’ வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரேய மெய்யெழுத்துப் பெயரான יהוה-வை ஒரு பட்டமாக மாற்றாமல், தமிழில் பரவலாகப் புரிந்துகொள்ளக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கடவுளாகிய
  rationale: எபிரேய இணைப்புத் தொடரைத் தெளிவாகக் காட்டி, யாவேயை இஸ்ரவேலின் கடவுள் என்று அடையாளப்படுத்துகிறது.
- source_word: מִן הָעוֹלָם וְעַד הָעֹלָם
  choice: என்றென்றும்
  rationale: எல்லையற்ற கால அளவைக் குறிக்கும் துதிமொழியை இயல்பான நவீனத் தமிழில் சுருக்கமாகவும் உயர்ந்த நடையிலும் தெரிவிக்கிறது; சொல்லடக்கமான ‘ஒரு நித்தியத்திலிருந்து இன்னொரு நித்தியம் வரை’ என்ற வடிவத்தைப் பயன்படுத்தவில்லை.
- source_word: וַיֹּאמְרוּ כָל הָעָם
  choice: பின்னர் மக்கள் அனைவரும் ... என்று சொல்லி
  rationale: வாவ் தொடர்வினையின் நிகழ்வுநகர்வை ‘பின்னர்’ காட்டுகிறது; עָם இச்சூழலில் கூடியிருந்த மக்கள் அனைவரையும் குறிக்கிறது.
- source_word: אָמֵן
  choice: ஆமென்!
  rationale: கூட்டத்தாரின் வழிபாட்டு மறுமொழியை மொழிபெயர்க்காமல், தமிழில் அறியப்பட்ட ஒலிபெயர்ப்பாகப் பாதுகாக்கிறது.
- source_word: וְהַלֵּל לַיהוָה
  choice: யாவேயைப் புகழ்ந்தார்கள்
  rationale: சுருக்கமான எபிரேயத் தொடரை, மக்களின் ‘ஆமென்’ என்ற மறுமொழியுடன் இணைந்த புகழ்ச்சிச் செயலாக இயல்பான தமிழில் வழங்குகிறது; அதன் இலக்கணச் சுருக்கமும் மாற்று வாசிப்பும் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் தனிப்பட்ட இறைப்பெயர் நேரடியாக இருப்பதால், அதை ஒரு பட்டத்தால் மாற்றாமல் ஒலிபெயர்ப்பாகப் பாதுகாக்கிறது.
- issue: עוֹלָם என்பதன் கால எல்லை
  choice: என்றென்றும்
  alternative: நித்தியத்திலிருந்து நித்தியம் வரை
  rationale: இங்கு தத்துவ ரீதியாக நுணுக்கமான காலக் கோட்பாட்டை வரையறுக்காமல், எல்லையற்ற காலமெங்கும் கடவுள் போற்றப்பட வேண்டும் என்ற துதிமொழியின் வலிமையைத் தருகிறது.
- issue: וְהַלֵּל לַיהוָה என்ற இறுதித் தொடரின் இலக்கணப் பொருள்
  choice: மக்கள் யாவேயைப் புகழ்ந்தார்கள்
  alternative: “யாவேயைப் புகழுங்கள்” என்ற மேற்கோள்
  rationale: சூழலில் இது மக்களின் மறுமொழியை விவரிப்பதாக வாசிப்பது இயல்பானது. ஆயினும் எபிரேய வடிவம் கட்டளை அல்லது மேற்கோள் போலவும் புரிந்துகொள்ளப்படக்கூடியதால், அந்த உண்மையான தெளிவின்மை அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுமக்கள் புரிந்துகொள்ளக்கூடிய கண்ணியமான வழிபாட்டு நடை பயன்படுத்தப்பட்டுள்ளது. ‘போற்றப்படுவாராக’ துதிமொழியின் உயர்ந்த தொனியைத் தக்கவைக்கிறது; இறுதித் தொடரின் எபிரேயத் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
