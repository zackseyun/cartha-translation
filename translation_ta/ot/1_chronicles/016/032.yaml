id: 1CH.16.32
reference: 1 Chronicles 16:32
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: יִרְעַ֤ם הַ/יָּם֙ וּ/מְלוֹא֔/וֹ יַעֲלֹ֥ץ הַ/שָּׂדֶ֖ה וְ/כָל אֲשֶׁר בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/032.yaml
  text: Let the sea thunder[a], and all that fills it; let the field exult[b], and all that is in it.
translation:
  language: ta
  text: கடலும் அதில் நிறைந்துள்ள அனைத்தும்[b] முழங்கட்டும்[a]; வயலும் அதிலுள்ள அனைத்தும் களிகூரட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பேரொலி எழுப்பட்டும்.’ எபிரெய வினைச்சொல் இடிமுழக்கம் போன்ற பேரொலியையோ உறுமும் ஓசையையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், ‘அதன் நிறைவு’; அதாவது, கடலில் நிறைந்துள்ள அனைத்தும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְעַם
  choice: முழங்கட்டும்
  rationale: רעם என்பது இடிமுழக்கம் போன்ற பேரொலி அல்லது உறுமும் ஓசையை எழுப்புவதைக் குறிக்கிறது. கடலை எழுவாயாகக் கொண்ட கவிதை நடையில் ‘முழங்கட்டும்’ இயல்பாகவும் வலிமையாகவும் உள்ளது; ‘இடிமுழங்கட்டும்’ என்பதும் சாத்தியம்.
- source_word: הַיָּם
  choice: கடல்
  rationale: יָם என்பதற்கான நேரடியான, வழக்கமான தமிழ் இணைச்சொல்; கவிதையின் கடல்–வயல் இணை அமைப்பையும் காக்கிறது.
- source_word: וּמְלוֹאוֹ
  choice: அதில் நிறைந்துள்ள அனைத்தும்
  rationale: מְלוֹאֹו என்பதன் சொற்பொருள் ‘அதன் நிறைவு.’ தற்காலத் தமிழில் பொருள் தெளிவாக இருக்க, கடலை நிரப்பியிருக்கும் உயிரினங்கள் உள்ளிட்ட அனைத்தையும் குறிக்கும் வகையில் இவ்வாறு மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: יַעֲלֹץ
  choice: களிகூரட்டும்
  rationale: עלץ மிகுந்த மகிழ்ச்சியுடன் களிப்பதைக் குறிக்கிறது. ‘களிகூரட்டும்’ என்பது அதன் உயர்ந்த கவிதை வலிமையைத் தக்கவைத்துக்கொண்டு இயல்பாக ஒலிக்கிறது.
- source_word: הַשָּׂדֶה
  choice: வயல்
  rationale: שׂדה என்பது வயல் அல்லது திறந்த நிலப்பரப்பைக் குறிக்கலாம். இங்கு கடலுக்கு இணையான படைப்புலகக் காட்சியாக ‘வயல்’ நேரடியும் சுருக்கமானதுமாக உள்ளது.
- source_word: וְכָל אֲשֶׁר בּוֹ
  choice: அதிலுள்ள அனைத்தும்
  rationale: இந்தத் தொடர்புச் சொற்றொடர் வயலைச் சுட்டுகிறது; כָל என்பதன் முழுமையையும் இயல்பான தமிழில் தக்கவைக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதத் தன்மையுள்ள கண்ணியமான கவிதை நடையைப் பேணுகிறது. இரு இணை உறுப்புகளிலும் ஒரே கட்டளை/விருப்ப வினை அமைப்பு பயன்படுத்தப்பட்டு, கடலும் வயலும் அவற்றிலுள்ள அனைத்துடனும் மனிதச் செயற்பாடுகளைப் பெறும் எபிரெயக் கவிதைப் படிமம் காக்கப்பட்டுள்ளது.
