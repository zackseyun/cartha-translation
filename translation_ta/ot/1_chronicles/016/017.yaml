  yaml_path: translation/ot/1_chronicles/016/017.yaml
  text: And he confirmed it to Jacob as a statute[a], to Israel as an everlasting covenant[b],
translation:
  language: ta
  text: அவர் அதை யாக்கோபுக்கு நியமமாகவும், இஸ்ரவேலுக்கு நித்திய உடன்படிக்கையாகவும் உறுதிப்படுத்தினார்[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர் அதை நிலைநிறுத்தினார்.” எபிரெய வினைச்சொல் ஒன்றை உறுதியாக நிலைநிற்கச் செய்வதைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “என்றென்றும் நிலைக்கும் உடன்படிக்கையாக.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמִידֶהָ
  choice: அவர் அதை ... உறுதிப்படுத்தினார்
  rationale: עמד என்பதன் ஹிஃபில் வடிவம் ‘நிலைநிற்கச் செய்தல், உறுதியாக ஏற்படுத்துதல்’ என்ற பொருளைக் கொண்டது. பெண்பால் ஒருமை பின்னொட்டு முந்தைய சூழலில் உள்ள உடன்படிக்கை அல்லது ஆணையைக் குறிக்கிறது; ‘அதை’ என்பது அதன் துல்லியமான முன்னிலையைத் தேவையின்றி நிர்ணயிக்காமல் காக்கிறது.
- source_word: לְיַעֲקֹב
  choice: யாக்கோபுக்கு
  rationale: לְ முன்னிடைச்சொல் இங்கு மறைமுகப் பொருள் அல்லது பயனாளியைக் குறிக்கிறது; இணையான ‘இஸ்ரவேலுக்கு’ என்பதோடும் இயல்பாகப் பொருந்துகிறது.
- source_word: לְחֹק
  choice: ஒரு நியமமாக
  rationale: חֹק என்பது நிர்ணயிக்கப்பட்ட சட்டம், கட்டளை அல்லது நியமத்தைக் குறிக்கிறது. ‘நியமம்’ சட்டப்பூர்வமான, நிலைநாட்டப்பட்ட தன்மையை நவீன தமிழில் கண்ணியமாக வெளிப்படுத்துகிறது.
- source_word: לְיִשְׂרָאֵל
  choice: இஸ்ரவேலுக்கு
  rationale: ‘யாக்கோபுக்கு’ என்பதற்கு இணையான எபிரெய அமைப்பைத் தக்கவைத்து, யாக்கோபு/இஸ்ரவேல் என்ற பெயர்களின் மறுபயன்பாட்டைச் சீராக்காமல் மொழிபெயர்க்கிறது.
- source_word: בְּרִית עוֹלָם
  choice: என்றென்றும் நிலைக்கும் உடன்படிக்கையாக
  rationale: בְּרִית என்பதற்கு இறையியல் முக்கியத்துவமுள்ள ‘உடன்படிக்கை’ தக்கவைக்கப்படுகிறது. עוֹלָם இங்கு நீடித்த நிலைத்தன்மையைச் சுட்டுவதால், ‘என்றென்றும் நிலைக்கும்’ என்பது தத்துவார்த்த நித்தியத்தை அளவுக்கு மீறி வரையறுக்காமல் அதன் வலிமையை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: וַיַּעֲמִידֶהָ என்பதிலுள்ள பெண்பால் ஒருமை பின்னொட்டின் முன்னிலை
  choice: முந்தைய வசனங்களில் கூறப்பட்ட உடன்படிக்கை சார்ந்த வாக்குறுதி அல்லது ஆணையைப் பொதுவாகக் குறிக்கும் ‘அதை’
  alternative: அது குறிப்பாக முந்தைய வசனத்திலுள்ள ஆணையை மட்டும் குறிக்கலாம்
  rationale: உடன்படிக்கை, வார்த்தை, ஆணை ஆகியவை உடனடியான சூழலில் இணையாக வருகின்றன. ‘அதை’ என்று மொழிபெயர்ப்பது எபிரெய மூலத்தின் சுட்டுப்பெயர் தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய இணை அமைப்பைத் தெளிவாகக் காட்ட அரைப்புள்ளி இடப்பட்டுள்ளது; இரண்டாவது ‘ஏற்படுத்தினார்’ தமிழில் முழுமையான வாக்கிய ஓட்டத்திற்காக நிரப்பப்பட்டுள்ளது.
