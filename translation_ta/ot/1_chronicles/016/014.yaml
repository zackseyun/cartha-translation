  source_fidelity: மூல எபிரெயத்தின் வலியுறுத்தப்பட்ட சுட்டுப்பெயர், யாவே என்ற இறைப்பெயர், ‘நம் கடவுள்’ என்ற உடைமைத் தொடர்பு, பூமியெங்கும் என்ற பரப்பு, மற்றும் பன்மை வடிவிலான מִשְׁפָּטָיו ஆகியவை துல்லியமாகப் பாதுகாக்கப்பட்டுள்ளன. ‘உள்ளன’ என்பது எபிரெய வினையற்ற கூற்றின் தமிழ்ச் சமமான இயல்பான வெளிப்பாடாகச் செயல்படுகிறது.
