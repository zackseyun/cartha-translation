id: 1CH.16.14
reference: 1 Chronicles 16:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: ה֚וּא יְהוָ֣ה אֱלֹהֵ֔י/נוּ בְּ/כָל הָ/אָ֖רֶץ מִשְׁפָּטָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/014.yaml
  text: He is Yahweh our God[b][a]; his judgments are in all the earth.
translation:
  language: ta
  text: அவரே நம் கடவுளாகிய யாவே[b]; அவருடைய நியாயத்தீர்ப்புகள் பூமியெங்கும் உள்ளன.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நாடெங்கும்”; אֶרֶץ என்ற எபிரெயச் சொல் சூழலுக்கு ஏற்ப ‘நாடு’ என்றும் பொருள்படலாம். இங்கு உலகளாவிய ஆட்சியை வலியுறுத்தும் சூழலால் ‘பூமி’ என மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெய மூலத்தில் YHWH என்ற இறைப்பெயர் உள்ளது; இது மரபாக ‘கர்த்தர்’ என்று வழங்கப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: הוּא
  choice: அவரே
  rationale: தனித்து நிற்கும் வலியுறுத்தப்பட்ட பதிலிப்பெயரின் அழுத்தத்தை இயல்பான தமிழில் ‘அவரே’ எனப் பாதுகாக்கிறது; எபிரெய மொழியின் வினையற்ற கூற்றை தமிழில் தனியாக ‘இருக்கிறார்’ சேர்க்காமல் இயல்பாக வழங்குகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: YHWH என்னும் இறைப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், நவீன தமிழில் புரிந்துகொள்ளத்தக்க ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֱלֹהֵינוּ
  choice: நம் கடவுள்
  rationale: வடிவத்தில் பன்மைத் தோற்றம் இருந்தாலும், இங்கு முதலாம் நபர் பன்மை உடைமை விகுதியுடன் இஸ்ரவேலின் ஒரே கடவுளைக் குறிக்கிறது.
- source_word: בְּכָל הָאָרֶץ
  choice: பூமியெங்கும்
  rationale: בְּ + כָּל அமைப்பின் பரவலான எல்லையைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது; சூழலில் உலகளாவிய பொருள் முதன்மையானது, ஆயினும் ‘நாடெங்கும்’ என்ற உள்ளூர்மையான பொருள் சாத்தியம்.
- source_word: מִשְׁפָּטָיו
  choice: அவருடைய நியாயத்தீர்ப்புகள்
  rationale: நீதித் தீர்ப்புகள், நீதி ஆட்சி, சட்டத் தீர்மானங்கள் ஆகிய பொருள் பரப்பை அளவுக்கு மீறிக் குறுக்காமல், மூலச்சொல்லின் பன்மையையும் நீதித்துறை சார்ந்த வலிமையையும் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பட்டம் அல்ல, YHWH என்ற தனிப்பட்ட இறைப்பெயரே உள்ளது; எனவே அதை மறைக்காமல் ஒலிபெயர்க்கப்படுகிறது.
- issue: הָאָרֶץ என்பதன் பரப்பு
  choice: பூமி
  alternative: நாடு
  rationale: துதிப்பாடல் சூழல் யாவேயின் தீர்ப்புகளின் உலகளாவிய பரப்பை ஆதரிப்பதால் ‘பூமி’ முதன்மைப்படுத்தப்படுகிறது; இருப்பினும் எபிரெயச் சொல்லுக்கு ‘நாடு’ என்ற உள்ளூர்மையான பொருளும் இருப்பதால் அது அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான வழிபாட்டு நடையைப் பயன்படுத்துகிறது. ‘அவரே’ மூலத்தின் வலியுறுத்தலைக் காக்கிறது; ‘பூமியெங்கும்’ இயல்பான தமிழில் உலகளாவிய பரப்பைத் தெரிவிக்கிறது. இறைப்பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டு, மரபு மாற்றீடு அடிக்குறிப்பில் தரப்படுகிறது.
