  terminology: ‘யாவே’ மூல இறைப்பெயரை மறைக்காமல் தருகிறது. ‘கடவுள்’, ‘நியாயத்தீர்ப்புகள்’, ‘பூமியெங்கும்’ ஆகியவை நவீன தரநிலைத் தமிழுக்கும் மூலத்தின் பொருள் பரப்புக்கும் ஏற்றவை. அகராதிசார் மாற்றுவாசிப்பான ‘நாடு’ அடிக்குறிப்பில் முறையாகப் பாதுகாக்கப்பட்டுள்ளது.
