  text: זִכְר֤וּ לְ/עוֹלָם֙ בְּרִית֔/וֹ דָּבָ֥ר צִוָּ֖ה לְ/אֶ֥לֶף דּֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/015.yaml
  text: Remember his covenant forever[a], the word he commanded for a thousand generations.
translation:
  language: ta
  text: அவருடைய உடன்படிக்கையை என்றென்றும் நினைவில் கொள்ளுங்கள்—ஆயிரம் தலைமுறைகளுக்காக அவர் கட்டளையிட்ட வார்த்தையை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆயிரம் தலைமுறைகளுக்காக அவர் கட்டளையிட்ட வாக்குறுதியை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זִכְרוּ
  choice: நினைவில் கொள்ளுங்கள்
  rationale: சமூகத்தை நோக்கிய ஆண்பால் பன்மை கட்டளை. நவீன தரத் தமிழில் நேரடியான அறிவுறுத்தலாக இயல்பாக ஒலிக்கிறது.
- source_word: לְעוֹלָם
  choice: என்றென்றும்
  rationale: நிலையான, முடிவில்லாத காலத்தைக் குறிக்கும் எபிரெயச் சொல்லின் வலிமையை இயல்பான தமிழில் தருகிறது.
- source_word: בְּרִיתוֹ
  choice: அவருடைய உடன்படிக்கை
  rationale: தேவனுடைய கட்டுப்படுத்தும் உறுதிப்பாட்டைக் குறிக்கும் בְּרִית என்பதற்கு தெளிவான, பரவலாகப் புரியக்கூடிய தமிழ் இணை.
- source_word: דָּבָר
  choice: வார்த்தை
  rationale: ‘வார்த்தை’, ‘காரியம்’, சூழலின்படி ‘வாக்குறுதி’ என்றும் பொருள்படக்கூடிய எபிரெயச் சொல்லின் பரந்த தன்மையைப் பாதுகாக்கிறது.
- source_word: צִוָּה
  choice: கட்டளையிட்ட
  rationale: צוה என்பதன் வழக்கமான நேரடிப் பொருளான ‘கட்டளையிடுதல்’ என்பதைக் காக்கிறது; ‘நியமித்த’ என்று மென்மையாக்கவில்லை.
- source_word: לְאֶלֶף דּוֹר
  choice: ஆயிரம் தலைமுறைகளுக்கு
  rationale: காலநீட்டத்தைக் குறிக்கும் לְ முன்னொட்டையும், எண்ணைச் சொற்பொருளுக்கு அப்பால் தேவையின்றி விளக்காமல் மூலத்தின் வடிவையும் காக்கிறது.
theological_decisions:
- issue: דָּבָר என்பதை ‘வார்த்தை’ என்றா, உடன்படிக்கைச் சூழலில் ‘வாக்குறுதி’ என்றா மொழிபெயர்ப்பது
  choice: வார்த்தை
  alternative: வாக்குறுதி
  rationale: மூலச் சொல் ‘வாக்குறுதி’ என்பதைவிடப் பரந்தது. உடன்படிக்கைச் சூழல் அந்தப் பொருளை உணர்த்தக்கூடும் என்பதால், அதை முதன்மை உரையில் திணிக்காமல் அடிக்குறிப்பில் மாற்றாக வைத்திருக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழ்; சமூகத்திடம் விடுக்கப்படும் பன்மை மரியாதைக் கட்டளையைத் தெளிவாகக் காக்கும் கண்ணியமான, எளிதில் புரியக்கூடிய நடை. எபிரெய இணையமைப்பை இயல்பாக வெளிப்படுத்த நீண்ட கோடு பயன்படுத்தப்பட்டுள்ளது.
