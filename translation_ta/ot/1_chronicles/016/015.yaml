- from: அவருடைய உடன்படிக்கையை என்றென்றும் நினைவில் கொள்ளுங்கள்—அவர் ஆயிரம் தலைமுறைகளுக்குக் கட்டளையிட்ட வார்த்தையை.[a]
  to: அவருடைய உடன்படிக்கையை என்றென்றும் நினைவில் கொள்ளுங்கள்—ஆயிரம் தலைமுறைகளுக்காக அவர் கட்டளையிட்ட வார்த்தையை.[a]
