  yaml_path: translation/ot/1_chronicles/016/018.yaml
  text: saying[a], “To you I will give the land of Canaan[b], the portion of your inheritance.”
translation:
  language: ta
  text: 'அவர் இவ்வாறு கூறினார்: “கானான் நாட்டை உனக்குக் கொடுப்பேன்; அது உங்கள்[a] மரபுரிமைச் சொத்தின் பங்கு[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மூல எபிரெயத்தில் “உனக்கு” என்பது ஒருமையிலும், “உங்கள்” என்பது பன்மையிலும் உள்ளது. வாக்குறுதி ஒரு முற்பிதாவிடம் சொல்லப்பட்டு, அவரது சந்ததியினரின் மரபுரிமையையும் நோக்குவதை இந்த மாற்றம் காட்டலாம்.
    reason: lexical_alternative
  - marker: b
    text: “பங்கு” என்பதற்குப் பதிலாக “ஒதுக்கப்பட்ட பங்கு” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் சொல்லடிப்படையில் கயிறு அல்லது அளவிடும் கோட்டைக் குறிக்கிறது; அதிலிருந்து அளந்து ஒதுக்கப்பட்ட நிலப்பங்கு என்ற பொருள் வந்தது.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵאמֹר
  choice: அவர் இவ்வாறு கூறினார்
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட உடன்படிக்கை உரையின் உள்ளடக்கத்தை அறிமுகப்படுத்தும் சொல்லாக இது வருகிறது. தமிழில் இயல்பான நேரடி உரை அறிமுகமாக இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: לְךָ
  choice: உனக்கு
  rationale: இது இரண்டாம் நபர் ஆண்பால் ஒருமை வடிவம்; வாக்குறுதி நேரடியாகச் சொல்லப்பட்ட முறையைப் பாதுகாக்க ஒருமை தக்கவைக்கப்பட்டது.
- source_word: אֶתֵּן
  choice: கொடுப்பேன்
  rationale: வாக்குறுதிச் சூழலில் வரும் முதல் நபர் ஒருமை imperfect வடிவத்தின் எதிர்காலப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֶרֶץ כְּנָעַן
  choice: கானான் நாடு
  rationale: வாக்குறுதி அளிக்கப்பட்ட குறிப்பிட்ட நிலப்பரப்பை நவீனத் தமிழில் தெளிவாகக் குறிக்கிறது.
- source_word: חֶבֶל
  choice: பங்கு
  rationale: இச்சொல் அடிப்படையில் அளவிடும் கயிற்றையோ கோட்டையோ குறித்தாலும், நிலப் பங்கீட்டுச் சூழலில் அளந்து ஒதுக்கப்பட்ட பங்கைக் குறிக்கிறது.
- source_word: נַחֲלַתְכֶם
  choice: உங்கள் மரபுரிமைச் சொத்து
  rationale: உடன்படிக்கையின் அடிப்படையில் சந்ததியினருக்குக் கிடைக்கும் நிலவுடைமையின் மரபுரிமைத் தன்மையையும், மூலத்திலுள்ள இரண்டாம் நபர் பன்மையையும் தக்கவைக்கிறது.
theological_decisions:
- issue: ஒருமை அழைப்பிலிருந்து பன்மை உடைமைக்கு மாறுதல்
  choice: “உனக்கு ... உங்கள் மரபுரிமைச் சொத்து” என்று இரு எண்களையும் தக்கவைத்தல்
  alternative: முழுவதையும் ஒருமையாக மாற்றுதல் அல்லது “உனக்கும் உன் சந்ததியினருக்கும்” என்று விளக்கி விரிவாக்குதல்
  rationale: எபிரெய உரை לְךָ என்ற ஒருமையையும் נַחֲלַתְכֶם என்ற பன்மையையும் அருகருகே வைக்கிறது. வாக்குறுதி முற்பிதாவிடம் சொல்லப்பட்டதையும், அதன் மரபுரிமை சந்ததியினருக்குரியதாயிருப்பதையும் உரை உருவாக்கும் பதற்றத்தோடு அப்படியே பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. “உனக்கு” மற்றும் “உங்கள்” என்ற வெளிப்படையான எண் மாறுதல் வேண்டுமென்றே தக்கவைக்கப்பட்டுள்ளது; “மரபுரிமைச் சொத்து” என்பது சட்ட, குடும்ப மற்றும் உடன்படிக்கை சார்ந்த பொருள்களை அளவாகப் பாதுகாக்கிறது.
