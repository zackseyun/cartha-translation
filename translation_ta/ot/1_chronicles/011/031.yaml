translation:
  language: ta
  text: பென்யமீன் கோத்திரத்தாரின் கிபியாவைச் சேர்ந்த ரீபாயின் மகன் இத்தாய்; பிராத்தோனைச் சேர்ந்த பெனாயா;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִיתַי
  choice: இத்தாய்
  rationale: எபிரெய தனிப்பெயரின் ஒலியை நவீன தமிழில் இயல்பாக எழுத்துப்பெயர்த்துள்ளது.
- source_word: בֶּן רִיבַי
  choice: ரீபாயின் மகன்
  rationale: בֶּן என்ற உறவுமுறைச் சொல்லையும் தொடரும் தனிப்பெயரையும் இயல்பான தமிழ் உடைமைத் தொடராக வழங்குகிறது.
- source_word: מִגִּבְעַת
  choice: கிபியாவைச் சேர்ந்த
  rationale: מִן முன்னொட்டு இங்கு பிறப்பிடம் அல்லது தொடர்பைக் குறிக்கிறது; גִּבְעַת என்பது இடப்பெயர் என்பதால் மொழிபெயர்க்காமல் எழுத்துப்பெயர்க்கப்பட்டுள்ளது.
- source_word: בְּנֵי בִנְיָמִן
  choice: பென்யமீன் கோத்திரத்தாரின்
  rationale: சொல்லர்த்தமாக ‘பென்யமீனின் மகன்கள்’; இச்சூழலில் அது பென்யமீன் கோத்திரத்தைச் சேர்ந்த மக்களைக் குறிக்கிறது. தமிழில் குழப்பமின்றி இயல்பாகத் தெரிவிக்க ‘கோத்திரத்தார்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: בְּנָיָה
  choice: பெனாயா
  rationale: எபிரெய தனிப்பெயரை தமிழில் ஒலிப்பெயர்த்துள்ளது.
- source_word: הַפִּרְעָתֹנִי
  choice: பிரத்தோனைச் சேர்ந்த
  rationale: இடம் அல்லது குலத் தொடர்பைக் குறிக்கும் இவ்வினப்பெயரை, தமிழில் தெளிவான இடத்தொடர்புச் சொற்றொடராக வழங்குகிறது.
