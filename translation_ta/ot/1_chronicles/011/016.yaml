  yaml_path: translation/ot/1_chronicles/011/016.yaml
  text: David was in the stronghold[b][a], and the garrison of the Philistines was then in Bethlehem.
translation:
  language: ta
  text: அப்போது தாவீது அரணில்[a] இருந்தார்; பெலிஸ்தியரின் காவற்படை அப்போது பெத்லெகேமில் இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கோட்டையில்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מְּצוּדָה
  choice: அரண்
  rationale: இச்சொல் பாதுகாப்புக்குரிய அரணாக்கப்பட்ட இடத்தையோ தற்காப்பிடத்தையோ குறிக்கிறது. இராணுவச் சூழலில் “அரண்” சுருக்கமாகவும் இயல்பாகவும் அதன் பொருளைத் தருகிறது.
- source_word: נְצִיב
  choice: படைக்காவல்
  rationale: பெலிஸ்தியருடன் இணைந்து, ஓர் ஊரில் இருந்ததாகக் கூறப்படுவதால் இங்கு குடிமை ஆளுநரைவிட அங்கு நிறுத்தப்பட்ட இராணுவப் படையையே குறிக்கிறது.
- source_word: פְּלִשְׁתִּים
  choice: பெலிஸ்தியர்
  rationale: இம்மக்கள் இனத்திற்கான வழக்கமான தமிழ் பெயர்.
- source_word: בְּבֵית לָחֶם
  choice: பெத்லெகேமில்
  rationale: בְּ இடத்தைக் குறிப்பதால் நகருக்குள் அல்லது அந்த நகரில் இருந்த நிலையை இயல்பாகத் தெரிவிக்கிறது.
- source_word: אָז ... אָז
  choice: அப்போது ... அப்போது
  rationale: எபிரெய மூலத்தில் இரு வாக்கியக் கூறுகளிலும் மீண்டும் வரும் காலக் குறிப்பைத் தமிழிலும் இயல்பாகப் பாதுகாக்கிறது.
- source_word: וְדָוִיד
  choice: தாவீது
  rationale: தொடக்க வாவ் இங்கு சூழ்நிலையைத் தொடர்கிறது; தமிழில் தனியாக “மேலும்” என மொழிபெயர்ப்பது இயல்பற்றதால் பெயருடன் நேரடியாகத் தொடங்கப்பட்டுள்ளது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான வரலாற்று-இராணுவ நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெயத்தில் இருமுறை வரும் אָז என்பதன் வலியுறுத்தல் “அப்போது ... அப்போது” எனப் பாதுகாக்கப்பட்டுள்ளது.
