base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/043.yaml
  text: Hanan son of Maacah[a], and Joshaphat the Mithnite;
translation:
  language: ta
  text: மாக்காவின் மகன் ஹானானும் மித்னியனான யோஷாபாத்[a]தும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்குள்ள எபிரெயப் பெயர் யோஷாபாத் (יוֹשָׁפָט), பொதுவாக அறியப்பட்ட யெகோஷாபாத் என்ற நீண்ட பெயர் வடிவத்தைவிடக் குறுகியது; எனவே இங்கு யோஷாபாத் என்று ஒலிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָנָן
  choice: ஹானான்
  rationale: தனிப்பட்ட பெயர்; எபிரெய ஒலிப்புக்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: בֶּן
  choice: மகன்
  rationale: வம்ச அல்லது தந்தைவழி உறவைக் குறிக்கும் வழக்கமான எபிரெயச் சொல்; பட்டியல் சூழலில் இயல்பான தமிழாக அமைக்கப்பட்டது.
- source_word: מַעֲכָה
  choice: மாக்கா
  rationale: தனிப்பட்ட பெயர்; இங்கு ‘மாக்காவின் மகன்’ என்ற தந்தைவழி அடையாளத்தில் வருகிறது. நடுவிலுள்ள எபிரெய மெய்யொலியின் தாக்கத்தை இரட்டைக் ‘க்’ மூலம் சுட்டும் ஒலிபெயர்ப்பு.
- source_word: וְיוֹשָׁפָט
  choice: யோஷாபாத்
  rationale: இணைப்புச் சொல்லுடன் வரும் தனிப்பட்ட பெயர். மூலத்தில் உள்ள குறுகிய יוֹשָׁפָט (Yôšāp̄āṭ) வடிவத்தைப் பிரதிபலிக்கிறது; வேறு இடங்களில் காணப்படும் நீண்ட யெகோஷாபாத் வடிவம் இங்கு புகுத்தப்படவில்லை.
- source_word: הַמִּתְנִי
  choice: மித்னியனான
  rationale: இடம் அல்லது குலச் சார்பைக் குறிக்கும் அடைமொழி. வீரர்களின் பட்டியலில் ஒருவரின் சார்பை இயல்பான தமிழில் அடையாளப்படுத்துகிறது.
theological_decisions: []
translation_notes:
  register: நவீனச் செந்தமிழ் நடையில், பெயர்ப்பட்டியலுக்கேற்ற சுருக்கமும் கண்ணியமும் பேணப்பட்டுள்ளன. எபிரெய வாக்கியத்தின் இணைப்பைத் தமிழில் தெளிவான பட்டியல் நிறுத்தக்குறியால் வெளிப்படுத்தியுள்ளோம்; வசனம் தொடரும் பட்டியலின் ஓர் அங்கம் என்பதால் இறுதி நிறுத்தக்குறி பதிப்பக முறைக்கேற்ப மாற்றப்படலாம்.
