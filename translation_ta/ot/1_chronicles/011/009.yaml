reference: 1 Chronicles 11:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יֵּ֥לֶךְ דָּוִ֖יד הָל֣וֹךְ וְ/גָד֑וֹל וַ/יהוָ֥ה צְבָא֖וֹת עִמּֽ/וֹ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/009.yaml
  text: And David became greater and greater[a], and Yahweh of hosts was with him.
translation:
  language: ta
  text: தாவீது மேன்மேலும் மகத்துவமடைந்தார்[a]; படைகளின் யாவே அவரோடு இருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்படியாக, “தாவீது சென்று, தொடர்ந்து பெரிதாகிக்கொண்டிருந்தார்”; இது அவர் படிப்படியாக மிகுந்த மகத்துவம் அடைந்ததைக் குறிக்கும் மொழிநடை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ הָלוֹךְ וְגָדוֹל
  choice: மேன்மேலும் வலிமை பெற்றார்
  rationale: இந்த எபிரெய மொழிநடை தொடர்ச்சியான வளர்ச்சியையும் வலுப்பெறுதலையும் குறிக்கிறது; சொற்படியாக ‘சென்று, சென்றுகொண்டும் பெரிதாகிக்கொண்டும்’ என மொழிபெயர்ப்பதைவிட இத்தமிழாக்கம் இயல்பாக அதன் முன்னேற்றப் பொருளைத் தருகிறது.
- source_word: דָּוִיד
  choice: தாவீது
  rationale: தமிழில் வழக்கமாக நிலைபெற்றுள்ள வேதாகமப் பெயர்வடிவம்.
- source_word: וַיהוָה
  choice: யாவே
  rationale: மூலத்தில் வரும் தனிப்பட்ட இறைப்பெயரான יהוה என்பதை ஒரு பொதுப்பட்டமாக மாற்றாமல் பெயராகவே வழங்குகிறது.
- source_word: צְבָאוֹת
  choice: படைகளின்
  rationale: இச்சொல் படைகள் அல்லது சேனைகளைக் குறிக்கிறது; இறைப்பெயருடன் இணைந்த பட்டத்தின் உருவகத்தைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: עִמּוֹ
  choice: அவரோடு
  rationale: עם என்ற முன்னிடைச்சொல்லின் உடனிருப்பு அல்லது துணைநிற்றல் பொருளை நேரடியாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல எபிரெய உரை தனிப்பட்ட இறைப்பெயரைப் பயன்படுத்துவதால், அதனைப் பொதுவான பட்டமாக மாற்றாமல் ஒலிபெயர்த்துள்ளது.
- issue: וַ என்ற இணைப்பின் தொடர்பு
  choice: ‘;’ மூலம் இணையான தொடர்ச்சி
  alternative: ‘ஏனெனில்’ என்ற காரணத் தொடர்பு
  rationale: எபிரெய இணைப்புச்சொல் இங்கு காரணத்தை வெளிப்படையாகக் குறிக்கவில்லை; ஆகவே காரணப்பொருளைச் சேர்க்காமல் இரு கூற்றுகளையும் தொடர்ச்சியாக இணைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘மேன்மேலும்’ என்பது எபிரெய மொழிநடையின் தொடர்ச்சியான தீவிர வளர்ச்சியைச் சுருக்கமாகத் தருகிறது; ‘படைகளின் யாவே’ மூலப்பட்டத்தின் படை உருவகத்தைக் காக்கிறது.
