translation_notes:
  register: நவீனத் தரத் தமிழில், வீரர்களின் பெயர்ப்பட்டியலுக்குரிய சுருக்கமானவும் கண்ணியமானவும் உள்ள நடை பயன்படுத்தப்பட்டது. மூலத்தின் பட்டியல் அமைப்பை அரைப்புள்ளி மற்றும் நீள்கோடு மூலம் தெளிவுபடுத்தியது; வசன முடிவின் எபிரெய பிரிவு குறி மொழிபெயர்க்கப்படவில்லை.
