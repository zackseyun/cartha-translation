  text: צֶ֖לֶק הָ/עַמּוֹנִ֑י נַחְרַי֙ הַ/בֵּ֣רֹתִ֔י נֹשֵׂ֕א כְּלֵ֖י יוֹאָ֥ב בֶּן צְרוּיָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/039.yaml
  text: Zelek the Ammonite[a], Naharai the Beerothite, the armor-bearer of Joab son of Zeruiah;
translation:
  language: ta
  text: அம்மோனியனான செலேக்; பேரோத்தியனான நஹ்ராய், செருயாவின் மகன் யோவாபின் ஆயுதம் தாங்குபவன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, சொற்படியாக, “செருயாவின் மகன் யோவாபின் ஆயுதங்களைச் சுமப்பவன்.”
    reason: நֹשֵׂא כְּלֵי என்பது சொற்படியாக ஆயுதங்கள் அல்லது போர்க்கருவிகளைச் சுமப்பவனைக் குறிக்கிறது; ஆனால் இது வழக்காக ஆயுதம் தாங்குபவன் என்ற இராணுவப் பணியைக் குறிக்கும் சொற்றொடராகும்.
lexical_decisions:
- source_word: צֶלֶק
  choice: சேலேக்கு
  rationale: எபிரெய தனிப்பெயரைத் தமிழின் இயல்பான ஒலியமைப்புக்கு ஏற்ப ஒலிபெயர்த்தது.
- source_word: הָעַמּוֹנִי
  choice: அம்மோனியனான
  rationale: குறிப்பிட்ட இன/புவியியல் அடையாளத்தைக் காட்டும் சொல்லை பட்டியல் நடைக்கு ஏற்றவாறு பெயருடன் இணைத்தது.
- source_word: נַחְרַי
  choice: நக்ராய்
  rationale: மசோரா உயிர்க்குறிப்புகளின் ஒலிப்பை நெருக்கமாகப் பிரதிபலிக்கும் தமிழ் ஒலிபெயர்ப்பு.
- source_word: הַבֵּרֹתִי
  choice: பேரோத்தியனான
  rationale: பேரோத் என்ற இடத்துடன் உள்ள தொடர்பைத் தெளிவாகப் பாதுகாக்கும் குடியிடப் பெயர்.
- source_word: נֹשֵׂא כְּלֵי
  choice: ஆயுதங்களைச் சுமந்தவன்
  rationale: சொல்லுக்கு சொல் பொருளான ‘உபகரணங்கள்/ஆயுதங்களைச் சுமப்பவன்’ என்பதைப் பாதுகாக்கிறது; சூழலில் இது ஆயுதம் தாங்குபவனைக் குறிக்கலாம்.
- source_word: יוֹאָב
  choice: யோவாப்
  rationale: எபிரெய தனிப்பெயரின் வழக்கமான தமிழ் வடிவம்.
- source_word: בֶּן צְרוּיָה
  choice: செருயாவின் மகன்
  rationale: யோவாபை அவரது தாய்வழி அடையாளப்படுத்தும் எபிரெய இணைப்பை நேரடியாகப் பாதுகாக்கிறது.
