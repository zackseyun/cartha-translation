source:
  edition: WLC
  text: וְ/אֵ֨לֶּה רָאשֵׁ֤י הַ/גִּבּוֹרִים֙ אֲשֶׁ֣ר לְ/דָוִ֔יד הַ/מִּתְחַזְּקִ֨ים עִמּ֧/וֹ בְ/מַלְכוּת֛/וֹ עִם כָּל יִשְׂרָאֵ֖ל לְ/הַמְלִיכ֑/וֹ כִּ/דְבַ֥ר יְהוָ֖ה עַל יִשְׂרָאֵֽל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/010.yaml
  text: These were the chiefs of the mighty men who belonged to David[a], who strengthened themselves with him in his kingdom, together with all Israel, to make him king[b], according to the word of Yahweh concerning Israel.
translation:
  language: ta
  text: தாவீதுக்குரிய வலிமைமிக்க வீரர்களின் தலைவர்கள் இவர்களே. இவர்கள் இஸ்ரவேலர் அனைவரோடும் சேர்ந்து, இஸ்ரவேலைக் குறித்து யாவே உரைத்த வார்த்தையின்படி தாவீதை அரசனாக்குவதற்காக, அவரது அரசாட்சியில் அவருக்கு உறுதுணையாக நின்றார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவருடன் தங்களை வலுப்படுத்திக்கொண்டார்கள்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொற்றொடர், தாவீதின் அரசாட்சியை நிலைநாட்ட அவருடன் வலுவாக இணைந்து ஆதரித்ததைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאשֵׁי הַגִּבּוֹרִים
  choice: வலிமைமிக்க வீரர்களின் தலைவர்கள்
  rationale: இது தாவீதின் முதன்மையான போர்வீரர்களைக் குறிக்கிறது. ‘தலைவர்கள்’ என்பதும் ‘வலிமைமிக்க வீரர்கள்’ என்பதும் பதவிநிலையையும் போர்திறனையும் இயல்பான தமிழில் தெரிவிக்கின்றன.
- source_word: אֲשֶׁר לְדָוִיד
  choice: தாவீதுக்குரிய
  rationale: לְ குறிக்கும் தொடர்பு அல்லது உடைமை உணர்வைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது; இவர்கள் தாவீதுடன் இணைந்திருந்த வீரர்கள் என்பதைக் காட்டுகிறது.
- source_word: הַמִּתְחַזְּקִים עִמּוֹ
  choice: அவருக்கு உறுதுணையாக நின்றார்கள்
  rationale: Hitpael வடிவத்தின் அடிப்படை ‘அவருடன் தங்களை வலுப்படுத்திக்கொண்டவர்கள்’ என்ற நுணுக்கத்தைத் தமிழில் தெளிவான அரசியல்-இராணுவ ஆதரவாக வெளிப்படுத்துகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: בְמַלְכוּתוֹ
  choice: அவரது அரசாட்சியில்
  rationale: מַלְכוּת இங்கு நாட்டின் நிலப்பரப்பைவிட தாவீதின் அரசுரிமை அல்லது ஆட்சிநிலையைச் சுட்டுகிறது. ‘அரசாட்சி’ அந்தப் பரந்த பொருளைத் தக்கவைக்கிறது.
- source_word: עִם כָּל יִשְׂרָאֵל
  choice: இஸ்ரவேலர் அனைவரோடும் சேர்ந்து
  rationale: மக்களாகிய இஸ்ரவேல் முழுவதுடனும் இணைந்து செயல்பட்டதை இயல்பான தமிழில் கூறுகிறது.
- source_word: לְהַמְלִיכוֹ
  choice: தாவீதை அரசனாக்குவதற்காக
  rationale: מלך என்பதன் Hiphil வடிவமான ‘அரசனாக்குதல்’ என்பதை நேரடியாகத் தருகிறது; தமிழில் சுட்டுப்பெயரின் குழப்பத்தைத் தவிர்க்க ‘தாவீதை’ என்று பெயர் மீண்டும் கூறப்படுகிறது.
- source_word: כִּדְבַר יְהוָה
  choice: யாவே உரைத்த வார்த்தையின்படி
  rationale: דבר என்பதன் ‘வார்த்தை’ பொருளையும், அது தெய்வீக உரை என்பதையும் காக்கிறது. יהוה தனிப்பெயராக ‘யாவே’ என்று ஒலிபெயர்க்கப்படுகிறது.
- source_word: עַל יִשְׂרָאֵל
  choice: இஸ்ரவேலைக் குறித்து
  rationale: דבר உடன் வரும் עַל இங்கு ‘குறித்து’ எனப் பொருள்படுவது தொடரமைப்புக்கு ஏற்றது; ‘இஸ்ரவேலின்மேல்’ என்ற சாத்தியமான நேரடி வடிவத்தைவிட குழப்பமற்றது.
theological_decisions:
- issue: הַמִּתְחַזְּקִים עִמּוֹ என்பதில் ஆதரவாளர்களின் செயல்
  choice: தாவீதின் அரசுரிமைக்கு வலுவான அரசியல்-இராணுவ ஆதரவு அளித்தல்
  alternative: தாவீதுடன் தங்களை வலுப்படுத்திக்கொள்ளுதல் அல்லது அவருடன் சேர்ந்து வலிமைபெறுதல்
  rationale: அடுத்துவரும் ‘அவரை அரசனாக்குவதற்காக’ என்ற நோக்கவாக்கியம் ஆதரவின் பொருளை வலுப்படுத்துகிறது. ஆனாலும் எபிரெயச் சொல்லின் பிரதிபலிப்பு நுணுக்கம் அடிக்குறிப்பில் தக்கவைக்கப்படுகிறது.
- issue: בְמַלְכוּתוֹ என்பதன் பொருள் எல்லை
  choice: தாவீதின் அரசாட்சி அல்லது அரசுரிமை
  alternative: அவரது ராஜ்யம் என்ற நிலப்பரப்பு அல்லது அவரது ஆட்சிக்காலம்
  rationale: சூழல் தாவீதின் அரியணையேற்றத்தையும் ஆட்சி நிலைநாட்டப்படுவதையும் பற்றியது. ‘அரசாட்சி’ என்பது அரசுரிமையையும் ஆட்சியையும் உள்ளடக்கி, தேவையற்ற குறுக்கத்தைத் தவிர்க்கிறது.
- issue: עַל יִשְׂרָאֵל எதனுடன் தொடர்புபடுகிறது
  choice: யாவே இஸ்ரவேலைக் குறித்து உரைத்த வார்த்தை
  alternative: இஸ்ரவேலின்மேல் தாவீது அரசனாதல்
  rationale: அர்த்தரீதியாக இரண்டும் நெருக்கமாக இருந்தாலும், உடனடியான தொடரமைப்பில் இது ‘யாவேயின் வார்த்தை’ என்பதோடு இயல்பாக இணைகிறது. மொழிபெயர்ப்பு இதைத் தேர்ந்தெடுக்கிறது; அரசாட்சியைப் பற்றிய உட்பொருளை மறுப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. நீண்ட எபிரெய வாக்கியம் தமிழில் இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டாலும், அதன் தொடர்புகளும் நோக்கமும் பாதுகாக்கப்பட்டுள்ளன. இறைப்பெயர் יהוה ‘யாவே’ என்று வழங்கப்பட்டுள்ளது.
