base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/033.yaml
  text: Azmaveth the Baharumite[a], Eliyahba the Shaalbonite.
translation:
  language: ta
  text: பகரூமைச் சேர்ந்த அஸ்மாவேத்[a], சால்போனைச் சேர்ந்த எலியாக்பா.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘பகரூமி’; இது பகூரீம் என்ற இடத்துடன் தொடர்புடையதாக இருக்கலாம். அப்படியானால், ‘பகூரீமைச் சேர்ந்தவர்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַזְמָוֶת
  choice: அஸ்மாவேத்
  rationale: எபிரெய தனிப்பெயரை அதன் ஒலியமைப்புக்கு நெருக்கமாகத் தமிழில் எழுத்துப்பெயர்த்துள்ளது.
- source_word: הַבַּחֲרוּמִי
  choice: பகரூமைச் சேர்ந்த
  rationale: இடம் அல்லது குலச் சார்பைக் குறிக்கும் இவ்வடிவம், நவீனத் தமிழில் இயல்பாகப் புரியுமாறு மொழிபெயர்க்கப்பட்டுள்ளது; மசோரா உயிர்க்குறிப்பின் ‘பகரூமி’ வடிவம் பாதுகாக்கப்படுகிறது.
- source_word: אֶלְיַחְבָּא
  choice: எலியாக்பா
  rationale: எபிரெய ஒலியமைப்பையும் பெயரிலுள்ள ‘எலி’ கூறையும் தெளிவாக வைத்திருக்கும் தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: הַשַּׁעַלְבֹנִי
  choice: சால்போனைச் சேர்ந்த
  rationale: சால்போன் என்ற இடத்துடனான சார்பைக் குறிக்கும் இனப்பெயர் வடிவத்தை, பட்டியலின் சுருக்கத்தைக் காத்து இயல்பான தமிழில் வழங்குகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், வீரர்களின் பெயர்ப்பட்டியலுக்கேற்ற சுருக்கமான, கண்ணியமான நடை. இடச்சார்பைக் குறிக்கும் எபிரெய இனப்பெயர்கள் வெறும் ஒலிபெயர்ப்பாக அல்லாமல் ‘—ஐச் சேர்ந்த’ என்று வாசகருக்கு இயல்பாக வழங்கப்பட்டுள்ளன; உரையிலுள்ள ஐயம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
