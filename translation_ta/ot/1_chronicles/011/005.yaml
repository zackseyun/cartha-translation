revisions:
- from: எபூசில் குடியிருந்தவர்கள் தாவீதிடம்[a], “நீ இங்கே நுழைய முடியாது” என்றார்கள். ஆனாலும் தாவீது சீயோன் கோட்டையைக் கைப்பற்றினார்; அதுவே தாவீதின் நகரம்.
  to: எபூசில் குடியிருந்தவர்கள் தாவீதிடம், “நீ இங்கே வரமாட்டாய்[a]” என்றார்கள். ஆனால் தாவீது சீயோன் கோட்டையைக் கைப்பற்றினார்; அது தாவீதின் நகரம்.
