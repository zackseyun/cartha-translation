translation_notes:
  register: நவீன நிலையான தமிழ்; எளிதில் புரியும் அதேவேளையில் வரலாற்று உரைக்கு ஏற்ற கண்ணியமான நடை. நேரடி பேச்சின் சவாலான தொனி காக்கப்பட்டுள்ளது.
