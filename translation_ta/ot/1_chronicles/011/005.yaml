  text: וַ/יֹּ֨אמְר֜וּ יֹשְׁבֵ֤י יְבוּס֙ לְ/דָוִ֔יד לֹ֥א תָב֖וֹא הֵ֑נָּה וַ/יִּלְכֹּ֤ד דָּוִיד֙ אֶת מְצֻדַ֣ת צִיּ֔וֹן הִ֖יא עִ֥יר דָּוִֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/005.yaml
  text: The inhabitants of Jebus said to David[a], “You will not come in here.” But David captured the stronghold of Zion, that is, the City of David.
translation:
  language: ta
  text: எபூசில் குடியிருந்தவர்கள் தாவீதிடம், “நீ இங்கே வரமாட்டாய்[a]” என்றார்கள். ஆனால் தாவீது சீயோன் கோட்டையைக் கைப்பற்றினார்; அது தாவீதின் நகரம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீ இங்கே நுழையமாட்டாய்.” எபிரெயத்தில் சொல்லுக்கு சொல், “நீ இங்கே வரமாட்டாய்” என்று உள்ளது; சூழலில் இது நுழைவதற்கு மறுப்புத் தெரிவிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹשְׁבֵי יְבוּס
  choice: எபூசில் குடியிருந்தவர்கள்
  rationale: எபூசில் வசித்த மக்களைக் குறிக்கும் எபிரெயக் கட்டமைப்பின் கூட்டு அர்த்தத்தை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: לֹא תָבוֹא הֵנָּה
  choice: நீ இங்கே நுழைய முடியாது
  rationale: சொல்லுக்கு சொல் ‘நீ இங்கே வரமாட்டாய்’ என்றாலும், சூழலில் இது நுழைவதைத் தடுக்கும் சவாலாக உள்ளது; ‘நுழைய முடியாது’ அதன் இயல்பான தமிழ் வலிமையைப் பாதுகாக்கிறது.
- source_word: וַיִּלְכֹּד
  choice: கைப்பற்றினார்
  rationale: பாதுகாப்பு அரணை இராணுவ நடவடிக்கையால் பிடித்துக்கொண்டதைக் குறிக்கும் பொருத்தமான தமிழ் வினைச்சொல்.
- source_word: מְצֻדַת צִיּוֹן
  choice: சீயோன் கோட்டை
  rationale: מְצוּדָה என்பது பாதுகாப்புமிக்க அரண் அல்லது கோட்டையைக் குறிக்கிறது; ‘கோட்டை’ தெளிவான, பொதுவாகப் புரியும் தமிழ் சொல்.
- source_word: הִיא עִיר דָּוִיד
  choice: அதுவே தாவீதின் நகரம்
  rationale: சீயோன் கோட்டையையும் ‘தாவீதின் நகரம்’ என்ற பெயரையும் அடையாளப்படுத்தும் எபிரெயப் பெயர்ச்சொல் வாக்கியத்தை இயல்பாகத் தருகிறது.
