  register: நவீன பொதுத்தமிழில் சுருக்கமான பெயர்ப்பட்டியலாகவும், வேதாகமப் பெயர்களுக்கேற்ற கண்ணியமான நடையிலும் அமைக்கப்பட்டுள்ளது. வசனத்தில் உள்ள [a] குறி, உறுதியற்ற குடிப்பெயர்/இடப்பெயர் குறித்த அடிக்குறிப்புடன் நேரடியாக இணைக்கப்பட்டுள்ளது.
