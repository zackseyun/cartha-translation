  text: Eliel[a], Obed, and Jaasiel the Mezobaite.
translation:
  language: ta
  text: எலியேல், ஓபேத், மெசோபாவைச் சேர்ந்த யாசியேல்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல்லான הַמְּצֹבָיָה, யாசியேல் மெசோபா அல்லது அதைப் போன்ற பெயருடைய ஓர் இடத்தையோ குலத்தையோ சேர்ந்தவர் என்பதைக் குறிக்கும் அடையாளப் பெயராக இருக்கலாம். இதன் அடிப்படையான இடப்பெயர் உறுதியற்றது; எனவே இதனை “மெசோபாயர்” அல்லது “மிட்சோபாயர்” போன்ற வடிவங்களிலும் எழுத்துப்பெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלִיאֵל
  choice: எலியேல்
  rationale: தனிப்பட்ட பெயர்; எபிரெய ஒலிவடிவத்தைத் தமிழில் இயல்பாக எழுத்துப்பெயர்த்துள்ளது.
- source_word: וְעוֹבֵד
  choice: ஓபேத்
  rationale: வாவ் இணைப்புடன் வரும் தனிப்பட்ட பெயர். தமிழ் பட்டியல் நடைக்கு ஏற்ப இணைப்பை ஒவ்வொரு பெயருக்கும் இயந்திரமாக மீளச் சேர்க்காமல் இயல்பாக அமைத்துள்ளது.
- source_word: וְיַעֲשִׂיאֵל
  choice: யாசியேல்
  rationale: வாவ் இணைப்புடன் வரும் தனிப்பட்ட பெயர்; יַעֲשִׂיאֵל என்பதன் ஒலிவடிவத்தைத் தமிழில் எழுத்துப்பெயர்த்துள்ளது.
- source_word: הַמְּצֹבָיָה
  choice: மெசோபாவைச் சேர்ந்த
  rationale: யாசியேலை ஓர் இடம் அல்லது குலத்தோடு தொடர்புபடுத்தும் குடிப்பெயர் போன்ற அடையாளம். தமிழில் இயல்பாக அதன் செயல்பாட்டை வெளிப்படுத்தும் வகையில் மொழிபெயர்க்கப்பட்டது; அடிப்படை இடப்பெயரின் துல்லிய வடிவம் உறுதியற்றதால் குறிப்பில் அது தெரிவிக்கப்பட்டுள்ளது.
