translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மூலத்தின் சுருக்கமான நிலவியல் சொல்லமைப்பு அளவுக்கு மீறி விளக்கப்படவில்லை. இரு அடிக்குறிப்பு குறிகளும் அவை சார்ந்த கூறுகளுக்குப் பின் வருமாறு பிரதான உரையில் இடம்பெற்றுள்ளன.
