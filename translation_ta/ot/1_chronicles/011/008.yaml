source:
  edition: WLC
  text: וַ/יִּ֤בֶן הָ/עִיר֙ מִ/סָּבִ֔יב מִן הַ/מִּלּ֖וֹא וְ/עַד הַ/סָּבִ֑יב וְ/יוֹאָ֕ב יְחַיֶּ֖ה אֶת שְׁאָ֥ר הָ/עִֽיר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/008.yaml
  text: He built the city all around[a], from the Millo even to the surrounding area[b], and Joab restored the rest of the city.
translation:
  language: ta
  text: அவர் மில்லோவிலிருந்து[b] சுற்றியுள்ள பகுதி வரையில் நகரைச் சுற்றிலும் கட்டினார்; யோவாப் நகரின் எஞ்சிய பகுதியை மீட்டமைத்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மீட்டமைத்தார்” என்பதற்கான எபிரெய வினைச்சொல் சொற்பொருளில் “உயிர்ப்பித்தார்” என்று பொருள்படும்; இங்கு அது நகரின் எஞ்சிய பகுதியை மீட்டமைத்தார் அல்லது பழுதுபார்த்தார் என்ற பொருளில் பயன்படுத்தப்பட்டிருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “மில்லோ” என்பது எருசலேமிலிருந்த ஓர் இடம் அல்லது கட்டமைப்பைக் குறிக்கும் நிலவியல் சொல். அதன் துல்லியமான பொருள் உறுதியில்லை; அது படிக்கட்டு வடிவிலான கட்டமைப்பையோ மண் நிரப்பி உருவாக்கப்பட்ட அரணமைப்பையோ குறிக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּבֶן
  choice: அவர் கட்டினார்
  rationale: בנה என்பதன் இயல்பான கால் வினைப்பொருள் ‘கட்டினார்’ என்பதாகும். முந்தைய வசனத்திலிருந்து இதன் எழுவாய் தாவீது என்பது புரிகிறது; ‘மீண்டும் கட்டினார்’ என்பது மூலத்தில் வெளிப்படையாக இல்லை.
- source_word: הָעִיר
  choice: நகரை
  rationale: עִיר என்பது இங்கு எருசலேம்/சீயோனைக் குறிக்கும் பொதுவான ‘நகர்’ என்ற சொல்.
- source_word: מִסָּבִיב
  choice: சுற்றிலும்
  rationale: סָבִיב இங்கு நகரைச் சுற்றிய முழுப் பரப்பையும் குறிக்கும் வினையடைப் பயன்பாடு.
- source_word: מִן הַמִּלּוֹא
  choice: மில்லோவிலிருந்து
  rationale: מִלּוֹא என்பதன் துல்லியமான நிலவியல் பொருள் உறுதியற்றதால், விளக்கப் பொருளைத் திணிக்காமல் இடப்பெயர்சார் சொல்லாக ஒலிபெயர்க்கப்படுகிறது.
- source_word: וְעַד הַסָּבִיב
  choice: சுற்றுப்புறம்வரை
  rationale: கட்டுமானத்தின் எல்லையைச் சுட்டும் சுருக்கமான எபிரெய சொற்றொடரை இயல்பான தமிழில் வழங்குகிறது; அதன் துல்லிய நிலவியல் குறிப்பு தெளிவற்றதாகவே விடப்படுகிறது.
- source_word: וְיוֹאָב
  choice: யோவாப்
  rationale: எபிரெய தனிப்பெயர் தமிழில் வழக்கமான முறையில் ஒலிபெயர்க்கப்படுகிறது.
- source_word: יְחַיֶּה
  choice: புதுப்பித்தார்
  rationale: חיה என்பதன் பியேல் வடிவம் சொற்பொருளில் ‘உயிர்ப்பித்தார்’ எனினும், நகரைப் பற்றிய இச்சூழலில் பழுதுபார்த்து மீட்டமைத்தல் என்ற உருவகப் பொருளைக் கொண்டுள்ளது. ‘புதுப்பித்தார்’ இயல்பாகவும் பொருள் அகலத்தைப் பாதுகாப்பதாகவும் உள்ளது.
- source_word: אֶת שְׁאָר הָעִיר
  choice: நகரின் எஞ்சிய பகுதியை
  rationale: שְׁאָר என்பது மீதமுள்ள பகுதியைக் குறிக்கிறது; இத்தொடர் நவீன தமிழில் தெளிவாக உள்ளது.
