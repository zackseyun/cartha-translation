translation_notes:
  register: நவீனத் தரத் தமிழில், பெயர்ப் பட்டியலுக்கேற்ற சுருக்கமானவும் கண்ணியமானவும் உள்ள நடை பயன்படுத்தப்பட்டுள்ளது. ‘கர்மேலியன்’ என்ற மரபுவழிச் சொல்லால் பின்னாளைய சமய அமைப்புடன் குழப்பம் ஏற்படாதபடி, முதன்மை உரையில் ‘கர்மேலைச் சேர்ந்த’ என்று தெளிவாகக் கொடுக்கப்பட்டுள்ளது.
