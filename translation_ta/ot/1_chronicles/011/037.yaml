  verdict: revise
  source_fidelity: The verse’s two name-list entries and the gentilic are otherwise represented accurately. However, חֶצְרוֹ begins with ח, which should not be omitted in a direct modern Tamil transliteration; “ஹெஸ்ரோ” more faithfully represents the Chronicles form than “எஸ்ரோ.”
