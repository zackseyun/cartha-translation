  text: Hezro the Carmelite[a], Naarai son of Ezbai[b];
translation:
  language: ta
  text: கர்மேலைச் சேர்ந்த[a] ஹெஸ்ரோ, எஸ்பாயின்[b] மகன் நாராய்;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கர்மேலியனான.” எபிரெயச் சொல் கர்மேல் என்ற இடத்தைச் சேர்ந்த ஒருவரைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: '2 சாமுவேல் 23:35-இல் உள்ள இணைப் பட்டியலில், இதற்கு இணையான இடத்தில் பெயர்கள் வேறுபடுகின்றன: “கர்மேலியனான ஹெஸ்ராய், அர்பியைச் சேர்ந்த பாராய்.” இங்கே நாளாகமம் தனித்த பெயர்வடிவங்களைப் பாதுகாக்கிறது.'
    reason: cross_reference
lexical_decisions:
- source_word: חֶצְרוֹ
  choice: எஸ்ரோ
  rationale: நாளாகமத்தில் உள்ள எபிரெயப் பெயர்வடிவத்தைத் தமிழில் ஒலிபெயர்த்தது; இணைப் பட்டியலில் வேறொரு வடிவம் காணப்பட்டாலும், இங்கு நாளாகமத்தின் வாசகமே பின்பற்றப்படுகிறது.
- source_word: הַכַּרְמְלִי
  choice: கர்மேலைச் சேர்ந்த
  rationale: இடப்பெயரிலிருந்து உருவான இந்த எபிரெய அடையாளச்சொல், கர்மேல் ஊரைச் சேர்ந்த ஒருவரைக் குறிக்கிறது. நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் இவ்வாறு மொழிபெயர்க்கப்படுகிறது.
- source_word: נַעֲרַי
  choice: நாராய்
  rationale: எபிரெயத் தனிப்பெயரின் நேரடி தமிழ் ஒலிபெயர்ப்பு.
- source_word: בֶּן
  choice: மகன்
  rationale: பெயர்ப் பட்டியல் சூழலில் בֶּן என்பதன் இயல்பான பொருள் ‘மகன்’ என்பதாகும்.
- source_word: אֶזְבָּי
  choice: எஸ்பாய்
  rationale: எபிரெயத் தனிப்பெயரின் நேரடி தமிழ் ஒலிபெயர்ப்பு; זְ ஒலி தமிழில் ‘ஸ்’ என்றும் בּ ‘ப்’ என்றும் பிரதிபலிக்கப்படுகிறது.
