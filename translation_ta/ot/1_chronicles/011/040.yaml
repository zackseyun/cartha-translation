lexical_decisions:
- source_word: עִירָא
  choice: ஈரா
  rationale: தனிப்பட்ட பெயர் என்பதால், எபிரேய ஒலிப்புக்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: הַיִּתְרִי
  choice: யித்ரியனான
  rationale: குலம் அல்லது வட்டாரச் சார்பைக் குறிக்கும் எபிரேய இனப்பெயர். தொடக்க யோத் ஒலியைத் தெளிவாகக் காட்டும் வகையில் ‘யித்ரியன்’ என ஒலிபெயர்க்கப்பட்டு, தமிழில் பெயரை இயல்பாக அடையாளப்படுத்த ‘-ஆன’ சேர்க்கப்பட்டது.
- source_word: גָּרֵב
  choice: காரேப்
  rationale: தனிப்பட்ட பெயர் என்பதால் மொழிபெயர்க்காமல், எபிரேய உச்சரிப்பை அணுகும் வகையில் ஒலிபெயர்க்கப்பட்டது.
- source_word: הַיִּתְרִי
  choice: யித்ரியனான
  rationale: மூலத்தில் இரண்டாவது நபருக்கும் அதே குலப்பெயர் மீண்டும் வருவதால், அந்த மீளுருவாக்கம் தமிழிலும் ஒரே வடிவில் தக்கவைக்கப்பட்டது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், வீரர்களின் பெயர்ப்பட்டியலுக்கேற்ற சுருக்கமான மற்றும் கண்ணியமான நடை. மூல எபிரேயத்தில் இணைப்புச் சொல் இல்லாததால், இரண்டு பெயர்களும் காற்புள்ளியால் பிரிக்கப்பட்டுள்ளன; இறுதியிலுள்ள மசோரா பிரிவுக்குறி மொழிபெயர்க்கப்படவில்லை.
