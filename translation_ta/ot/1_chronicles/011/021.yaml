source:
  edition: WLC
  text: מִן הַ/שְּׁלוֹשָׁ֤ה בַ/שְּׁנַ֨יִם֙ נִכְבָּ֔ד וַ/יְהִ֥י לָ/הֶ֖ם לְ/שָׂ֑ר וְ/עַד הַ/שְּׁלוֹשָׁ֖ה לֹֽא בָֽא־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/021.yaml
  text: He was more honored than the two among the three[a], and he became their commander; but he did not attain to the three.
translation:
  language: ta
  text: அந்த மூவரில் உள்ள இருவரைவிட அவன் அதிக மதிப்புப் பெற்றான்[a]; அவர்களுக்குத் தளபதியானான். ஆனாலும், அந்த மூவரின் நிலையை அவன் அடையவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்த மூவரைவிட அந்த இருவரால் அவன் அதிகம் மதிக்கப்பட்டான்.” எபிரெயச் சொற்றொடர் சுருக்கமானதும் பொருள் காண்பதற்குக் கடினமானதும் ஆகும். ஒரு தரவரிசைக் குழுவில் அவன் மிகவும் மதிக்கப்பட்டிருந்தாலும், ‘அந்த மூவருக்கு’ இணையாகவில்லை என்பதே அதன் பொதுவான கருத்து.
    reason: alternative_reading
lexical_decisions:
- source_word: מִן הַשְּׁלוֹשָׁה בַשְּׁנַיִם
  choice: அந்த மூவரில் இருவரைவிட
  rationale: எபிரெயச் சொற்றொடர் சுருக்கமானதும் இலக்கண ரீதியாகக் கடினமானதும் ஆகும். சூழலில் உள்ள வீரர்களின் தரவரிசையைக் கருத்தில் கொண்டு, மூவரைக் கொண்ட ஒரு குழுவில் மற்ற இருவரைவிட அவன் மதிப்புப் பெற்றவன் என்ற சாத்தியமான பொருளை முதன்மை உரை தருகிறது; வேறு சாத்தியமான வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: נִכְבָּד
  choice: அதிக மதிப்புப் பெற்றிருந்தான்
  rationale: כבד என்பதன் நிஃபால் வடிவம் இங்கு மதிக்கப்படுதல் அல்லது உயர்வாகக் கருதப்படுதல் என்பதைக் குறிக்கிறது. ஒப்பீட்டுக் கட்டமைப்பால் ‘அதிக’ என்பது சேர்க்கப்பட்டுள்ளது.
- source_word: וַיְהִי לָהֶם לְשָׂר
  choice: அவர்களுக்குத் தளபதியானான்
  rationale: שַׂר என்பது தலைவர், தலைவன், அல்லது தளபதி என்று பொருள்படும்; போர்வீரர்களைப் பற்றிய இச்சூழலில் ‘தளபதி’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: וְעַד הַשְּׁלוֹשָׁה לֹא בָא
  choice: அந்த மூவரின் நிலையை அவன் அடையவில்லை
  rationale: עַד உடன் வரும் בוא இங்கு இடத்தைச் சென்றடைதலை அல்ல, தரத்தையோ நிலையையோ எட்டுதலைக் குறிக்கிறது. ‘நிலையை அடையவில்லை’ என்பது முன்னணி மூவருக்கு இணையாகவில்லை என்ற கருத்தைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: ‘மூவர்’ மற்றும் ‘இருவர்’ குறித்த கடினமான தரவரிசைச் சொற்றொடர்
  choice: மூவரில் இருவரைவிட அவன் அதிக மதிப்புப் பெற்றிருந்தான்
  alternative: அந்த மூவரைவிட அந்த இருவரால் அவன் அதிகம் மதிக்கப்பட்டான்
  rationale: மூல எபிரெயம் பலவாறு புரிந்துகொள்ளக்கூடிய அளவுக்கு சுருக்கமாக உள்ளது. முதன்மை வாசிப்பு சூழலுக்கு ஏற்ற தரவரிசைப் பொருளைக் கொடுக்கிறது; மாற்று வாசிப்பு அடிக்குறிப்பில் வைக்கப்பட்டதால் மூலத்தின் உண்மையான தெளிவின்மை மறைக்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், இயல்பான ஆனால் கண்ணியமான வரலாற்று-இராணுவ நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெயத்தின் சிக்கலான ஒப்பீட்டை முதன்மை உரையில் வாசிக்கத் தெளிவாக்கி, அதன் மாற்றுப் புரிதலை அடிக்குறிப்பில் பாதுகாத்துள்ளோம்.
