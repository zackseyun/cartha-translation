  text: Jediael son of Shimri[a], and Joha his brother, the Tizite;
translation:
  language: ta
  text: சிம்ரியின் மகன் யெதியேலும், அவனுடைய சகோதரன் யோஹா திசியனும்[a];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இந்தக் குடிப்பெயரின் உயிரொலிப்பையும் அது தொடர்புடைய இடம் அல்லது குலப்பெயரையும் வேறுவிதமாகப் புரிந்துகொண்டால், “சிசியன்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְדִיעֲאֵל
  choice: யெதியேல்
  rationale: தனிப்பட்ட நபரின் பெயர் என்பதால், அதன் எபிரெய ஒலிவடிவத்தைத் தமிழில் இயல்பாக ஒலிபெயர்த்துள்ளது.
- source_word: בֶּן שִׁמְרִי
  choice: சிம்ரியின் மகன்
  rationale: இந்த வீரர் பட்டியலில் בֶּן என்பது உடனடியான தந்தை–மகன் உறவைக் குறிப்பதாக இயல்பாகப் புரிகிறது; தமிழில் உறவைத் தெளிவாகவும் இயல்பாகவும் சொல்கிறது.
- source_word: וְיֹחָא
  choice: யோஹா
  rationale: இணைப்புச் சொல்லுடன் வரும் தனிப்பட்ட பெயரை எபிரெய வடிவத்துக்கு நெருக்கமாக ஒலிபெயர்த்துள்ளது.
- source_word: אָחִיו
  choice: அவனுடைய சகோதரனாகிய
  rationale: אָחִיו என்பதன் முதன்மையான பொருள் ‘அவனுடைய சகோதரன்’; பட்டியல் வாக்கியத்தில் யோஹாவை யெதியேலுடன் இயல்பாக இணைக்க இவ்வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: הַתִּיצִי
  choice: திசியன்
  rationale: ஓர் இடம் அல்லது குலத்துடனான தொடர்பைக் காட்டும் குடிப்பெயராகக் கொண்டு ஒலிபெயர்க்கப்பட்டுள்ளது; அதன் சரியான மூலத் தொடர்பு விளக்கப்படாமல் விடப்பட்டுள்ளது.
