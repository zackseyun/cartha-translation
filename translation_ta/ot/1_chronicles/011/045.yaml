translation_notes:
  register: நவீனத் தரத் தமிழில், பெயர்ப்பட்டியலுக்கேற்ற சுருக்கமானவும் கண்ணியமானவும் உள்ள நடை. மூல வசனம் தொடரும் பட்டியலின் ஒரு பகுதியாக இருப்பதால் இறுதியில் அரைப்புள்ளி வைக்கப்பட்டுள்ளது. குடிப்பெயரின் நிச்சயமின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
