revisions:
- from: 'வலிமைமிக்க போர்வீரர்கள் இவர்களே: யோவாபின் சகோதரனான அசகேல்; தோதோவின் மகனும் பெத்லெகேமிலிருந்து வந்தவனுமான[a] எல்க்கானான்.'
  to: 'வலிமைமிக்க போர்வீரர்கள்: யோவாபின் சகோதரன் ஆசகேல்; பெத்லெகேமிலிருந்து வந்த[a] தோதோவின் மகன் எல்க்கானான்.'
  rationale: The revision preserves the source’s concise enumeration, uses conventional Tamil biblical spellings, and retains the literal origin sense of מִבֵּית לָחֶם. The footnote remains anchored to the Bethlehem-origin phrase and gives the idiomatic gentilic alternative.
