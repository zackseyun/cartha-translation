reference: 1 Chronicles 11:26
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/גִבּוֹרֵ֖י הַ/חֲיָלִ֑ים עֲשָׂה אֵל֙ אֲחִ֣י יוֹאָ֔ב אֶלְחָנָ֥ן בֶּן דּוֹד֖וֹ מִ/בֵּ֥ית לָֽחֶם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/026.yaml
  text: 'And the mighty warriors were: Asahel the brother of Joab[a], Elhanan son of Dodo, from Bethlehem.'
translation:
  language: ta
  text: 'வலிமைமிக்க போர்வீரர்கள்: யோவாபின் சகோதரன் ஆசகேல்; பெத்லெகேமிலிருந்து வந்த[a] தோதோவின் மகன் எல்க்கானான்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, ‘பெத்லெகேமியன்.’ எபிரெயத்தில் சொல்லுக்குச் சொல்: ‘பெத்லெகேமிலிருந்து.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגִבּוֹרֵי הַחֲיָלִים
  choice: வலிமைமிக்க போர்வீரர்கள்
  rationale: இந்தச் சொற்றொடர் வலிமையும் போர்த்திறனும் கொண்ட சிறப்புப் படைவீரர்களைக் குறிக்கிறது. ‘வலிமைமிக்க போர்வீரர்கள்’ என்பது இராணுவப் பொருளைத் தெளிவாகவும் இயல்பான நவீனத் தமிழிலும் தருகிறது; தொடக்க וְ பட்டியலின் தொடர்ச்சியால் தமிழில் தனியாக மொழிபெயர்க்கப்படவில்லை.
- source_word: עֲשָׂה אֵל
  choice: அசகேல்
  rationale: இது עֲשָׂהאֵל என்ற தனிப்பட்ட பெயரின் தமிழ் ஒலிபெயர்ப்பு.
- source_word: אֲחִי יוֹאָב
  choice: யோவாபின் சகோதரனான
  rationale: அசகேலை யோவாபுடனான உறவால் அடையாளப்படுத்தும் எபிரெயக் கட்டமைப்பை இயல்பான தமிழில் தருகிறது.
- source_word: אֶלְחָנָן
  choice: எல்க்கானான்
  rationale: எபிரெயத் தனிப்பட்ட பெயரின் தமிழ் ஒலிபெயர்ப்பு.
- source_word: בֶּן דּוֹדוֹ
  choice: தோதோவின் மகன்
  rationale: இது வழக்கமான வம்ச உறவுச் சொற்றொடர்; இங்கே דּוֹדוֹ ஒரு நபரின் பெயராகப் புரிந்துகொள்ளப்படுகிறது.
- source_word: מִבֵּית לָחֶם
  choice: பெத்லெகேமிலிருந்து வந்தவன்
  rationale: முன்னொட்டு מִן இடத்திலிருந்து வந்த தோற்றத்தைக் குறிக்கிறது. ‘பெத்லெகேமிலிருந்து வந்தவன்’ என்பது எபிரெயின் நேரடிப் பொருளைப் பாதுகாக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. பட்டியல் தெளிவாக இருக்க அரைப்புள்ளி இடப்பட்டுள்ளது. மூலத்தில் வெளிப்படையாக இல்லாத ‘இவர்களே’ தமிழில் வாக்கியத்தை இயல்பாக்கச் சேர்க்கப்பட்டுள்ளது. அடிக்குறிப்பு குறியீடு அது விளக்கும் பெத்லெகேம் சார்ந்த சொற்றொடருக்குப் பின்னர் வைக்கப்பட்டுள்ளது.
