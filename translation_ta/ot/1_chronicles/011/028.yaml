lexical_decisions:
- source_word: עִירָא
  choice: ஈரா
  rationale: தனிப்பட்ட பெயர்; எபிரெய ஒலிப்பைத் தமிழில் இயல்பாக எழுத்துப்பெயர்த்துள்ளது.
