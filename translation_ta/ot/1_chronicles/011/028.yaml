translation_notes:
  register: வீரர்களின் பெயர்ப்பட்டியலுக்குரிய சுருக்கமான நடையைப் பேணியபடியே, பழமையான ‘ஊரானாகிய’ போன்ற வடிவங்களைத் தவிர்த்து நவீன, கண்ணியமான தமிழைப் பயன்படுத்துகிறது. தெக்கோவா என்ற அடைமொழி இக்கேசை அல்ல, ஈராவைக் குறிப்பது தெளிவாகும் வகையில் தொடரமைப்பு அமைக்கப்பட்டுள்ளது.
