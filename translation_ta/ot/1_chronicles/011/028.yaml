- source_word: אֲבִיעֶזֶר
  choice: அபியேசர்
  rationale: தனிப்பட்ட பெயர்; தமிழில் பரவலாக அறியப்படும் வேதாகமப் பெயர் வடிவத்துக்கு ஏற்ற எழுத்துப்பெயர்ப்பு.
- source_word: הָעֲנְּתוֹתִי
  choice: ஆனதோத்தைச் சேர்ந்த
  rationale: ஆனதோத்தைச் சார்ந்த ஒருவரைக் குறிக்கும் எபிரெய குடியிடப் பெயரடையை இயல்பான நவீனத் தமிழில் தருகிறது.
