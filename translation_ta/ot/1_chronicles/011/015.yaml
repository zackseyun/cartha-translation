  text: וַ/יֵּרְד֡וּ שְֽׁלוֹשָׁה֩ מִן הַ/שְּׁלוֹשִׁ֨ים רֹ֤אשׁ עַל הַ/צֻּר֙ אֶל דָּוִ֔יד אֶל מְעָרַ֖ת עֲדֻלָּ֑ם וּ/מַחֲנֵ֣ה פְלִשְׁתִּ֔ים חֹנָ֖ה בְּ/עֵ֥מֶק רְפָאִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/015.yaml
  text: Then three of the thirty chiefs went down to the rock[a], to David, at the cave of Adullam, while the camp of the Philistines was encamped in the Valley of Rephaim.
translation:
  language: ta
  text: அப்போது முப்பது பேரில் தலைவர்களான மூவர் பாறைக்குச்[a] இறங்கிச் சென்றார்கள்; அவர்கள் அதுல்லாம் குகையில் இருந்த தாவீதிடம் சென்றார்கள். அந்நேரத்தில் பெலிஸ்தியரின் முகாம் ரெப்பாயீம் பள்ளத்தாக்கில் முகாமிட்டிருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொல்லுக்கு நெருக்கமாக: “முப்பதினரில் தலைவர்களான மூவர் பாறையின்மேல் தாவீதிடமும் அதுல்லாம் குகைக்கும் இறங்கிச் சென்றார்கள்.” எபிரெய வாக்கிய அமைப்பு சுருக்கமாக உள்ளது. ‘பாறையின்மேல்’ என்பதன் துல்லியமான இடவியல் தொடர்பு விவாதத்திற்குரியது; முதன்மை உரை தாவீது அதுல்லாம் குகையில் இருந்ததைத் தெளிவுபடுத்துகிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: சென்றிறங்கினார்கள்
  rationale: ירד என்பதன் வழக்கமான கதைநடை வடிவம்; கீழ்நோக்கிய இயக்கத்தையும் இயல்பான தமிழ் நடையையும் காக்கிறது.
- source_word: שְׁלוֹשָׁה מִן־הַשְּׁלוֹשִׁים רֹאשׁ
  choice: முப்பது பேரில் தலைவர்களான மூவர்
  rationale: மூவர் ‘முப்பது பேரில்’ சேர்ந்தவர்கள் என்பதையும், רֹאשׁ அவர்களை முன்னணி அல்லது தலைமை நபர்களாகக் குறிக்கிறது என்பதையும் இயல்பாக வெளிப்படுத்துகிறது; குறிப்பிட்ட இராணுவப் பதவியைப் புகுத்தவில்லை.
- source_word: עַל־הַצּוּר
  choice: பாறைக்கு
  rationale: על இங்கு பாறையை நோக்கிய அல்லது அதன்மேல் சென்ற இயக்கத்தைக் குறிக்கலாம். முதன்மை உரை இலக்கைச் சுருக்கமாகக் காட்டுகிறது; மாற்று முறையான அமைப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אֶל־דָּוִיד אֶל־מְעָרַת עֲדֻלָּם
  choice: அதுல்லாம் குகையில் இருந்த தாவீதிடம்
  rationale: இருமுறை வரும் אֶל அமைப்பைத் தமிழில் இயல்பாக மாற்றி, தாவீதின் இருப்பிடம் அதுல்லாம் குகை என்பதைத் தெளிவாக்குகிறது; மூலத்தின் சுருக்கமான தொடரமைப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וּמַחֲנֵה פְלִשְׁתִּים חֹנָה
  choice: அந்நேரத்தில் பெலிஸ்தியரின் படை ... முகாமிட்டிருந்தது
  rationale: இணைப்புச் சொல் பின்னணி சூழலை அறிமுகப்படுத்துவதையும், חֹנָה தொடர்ந்திருந்த நிலையைச் சுட்டுவதையும் இயல்பான தமிழில் தெரிவிக்கிறது. מַחֲנֶה இங்கு முகாமிட்ட படைக்குழுவைக் குறிக்கிறது.
- source_word: בְּעֵמֶק רְפָאִים
  choice: ரெப்பாயீம் பள்ளத்தாக்கில்
  rationale: புவியியல் பெயரை ஒலிபெயர்த்து, עֵמֶק என்பதற்கு ‘பள்ளத்தாக்கு’ என வழங்குகிறது.
