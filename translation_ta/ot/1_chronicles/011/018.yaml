base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/018.yaml
  text: So the three broke through into the camp of the Philistines and drew water from the well of Bethlehem that was by the gate[a], and carried it and brought it to David. But David was not willing to drink it; instead, he poured it out to Yahweh.
translation:
  language: ta
  text: அப்போது அந்த மூவரும் பெலிஸ்தியரின் முகாமுக்குள் உடைத்துக்கொண்டு சென்று, பெத்லெகேமின் வாசலருகே இருந்த கிணற்றிலிருந்து தண்ணீரை மொண்டு, அதை எடுத்துக்கொண்டு தாவீதிடம் கொண்டுவந்தார்கள். ஆனால் தாவீது அதைக் குடிக்க விரும்பவில்லை; அதை யாவேக்காக ஊற்றினார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதை இன்னும் விளக்கமாக, “அதை யாவேக்குப் பானபலியாக ஊற்றினார்” என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல் பானபலியாக ஊற்றுவதையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְקְעוּ
  choice: ஊடுருவிச் சென்று
  rationale: பகைவரின் முகாமை அல்லது அணிவரிசையை உடைத்துக்கொண்டு முன்னேறுவதை இச்சூழலில் இயல்பாகவும் வலிமையுடனும் தெரிவிக்கிறது.
- source_word: הַשְּׁלֹשָׁה
  choice: அந்த மூவரும்
  rationale: எபிரெய உரை இங்கு ‘மூவர்’ என்று மட்டுமே கூறுகிறது; ‘வீரர்கள்’ என்பதைச் சேர்க்காமல், முந்தைய சூழலைச் சுட்ட ‘அந்த’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: בְּמַחֲנֵה פְלִשְׁתִּים
  choice: பெலிஸ்தரின் முகாமுக்குள்
  rationale: இயக்கத்தைக் குறிக்கும் வினையுடன், பகைவரின் முகாமுக்குள் நுழைந்ததைத் தெளிவாகத் தருகிறது.
- source_word: וַיִּשְׁאֲבוּ מַיִם
  choice: தண்ணீர் மொண்டு
  rationale: கிணற்றிலிருந்து தண்ணீர் எடுப்பதைக் குறிக்கும் இயல்பான நவீனத் தமிழ் நடை.
- source_word: מִבּוֹר בֵּית לֶחֶם אֲשֶׁר בַּשַּׁעַר
  choice: பெத்லெகேமின் வாசலருகே இருந்த கிணற்றிலிருந்து
  rationale: בּוֹר என்பதற்கு குழி, நீர்த்தொட்டி, கிணறு என்ற பொருள்கள் உண்டு; குடிநீர் மொண்ட சூழலில் ‘கிணறு’ இயல்பானது. ‘வாசலருகே’ இடத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: וַיִּשְׂאוּ וַיָּבִיאוּ אֶל דָּוִיד
  choice: அதைத் தாவீதிடம் சுமந்துகொண்டு வந்தார்கள்
  rationale: தண்ணீரை எடுத்துச் சென்று தாவீதிடம் கொண்டுவந்த தொடர் செயலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְלֹא אָבָה דָוִיד לִשְׁתּוֹתָם
  choice: தாவீது அதைக் குடிக்க மனமில்லாமல்
  rationale: אָבָה என்பது விருப்பம் அல்லது மனம் இருப்பதைக் குறிக்கிறது; ‘மறுத்தார்’ என்பதைக் காட்டிலும் எபிரெய சொல்லின் நுணுக்கத்தை நெருக்கமாகப் பாதுகாக்கிறது. எபிரெயில் பன்மை பின்னொட்டு இருந்தாலும், தமிழில் தண்ணீரை ஒருமையாகச் சுட்டுவது இயல்பு.
- source_word: וַיְנַסֵּךְ אֹתָם לַיהוָה
  choice: அதை யெகோவாவுக்கென்று ஊற்றிவிட்டார்
  rationale: காணக்கூடிய செயலை முதன்மை உரையில் வைத்திருக்கிறது; נסך என்பதிலுள்ள பானபலியாக ஊற்றும் வழிபாட்டு நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தெய்வீகப் பெயரை ஒரு பொதுப் பட்டமாக மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட தனிப்பெயர் வடிவில் வழங்குகிறது.
theological_decisions:
- issue: தாவீது தண்ணீரை ஊற்றிய செயலின் வழிபாட்டு அல்லது பலிசார் முக்கியத்துவம்
  choice: முதன்மை உரையில் ‘யெகோவாவுக்கென்று ஊற்றிவிட்டார்’ என்று நேரடிச் செயலைக் கூறி, பானபலிசார் பொருளை அடிக்குறிப்பில் குறிப்பிடுதல்
  alternative: ‘யெகோவாவுக்குப் பானபலியாக ஊற்றினார்’ என்று முதன்மை உரையிலேயே விளக்கமாக மொழிபெயர்த்தல்
  rationale: נסך என்ற வினை பானபலி செலுத்தும் பொருளைக் கொண்டிருக்கலாம்; அதே நேரத்தில் கதை நேரடியாக ஊற்றும் செயலைச் சித்தரிக்கிறது. முதன்மை உரை இந்த இரு பரிமாணங்களையும் முன்னதாகத் தீர்மானித்துவிடாமல் வைத்திருக்கிறது; அடிக்குறிப்பு வழிபாட்டு நுணுக்கத்தைத் தெளிவுபடுத்துகிறது.
translation_notes:
  register: நவீன, கண்ணியமான, பொதுவாகப் புரியும் தமிழ் நடை. வேகமான எபிரெயக் கதைத் தொடரை இயல்பான ஒரே வாக்கியமாகப் பேணுகிறது. ‘மூவர்’ என்பதுடன் மூலத்தில் இல்லாத ‘வீரர்கள்’ சேர்க்கப்படவில்லை; ‘பானபலி’ முதன்மை உரையில் கட்டாயப்படுத்தப்படாமல் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
