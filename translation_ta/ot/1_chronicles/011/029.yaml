lexical_decisions:
- source_word: סִבְּכַי
  choice: சிபெக்காய்
  rationale: தனிப்பட்ட பெயர்; எபிரெய உச்சரிப்பைப் பின்பற்றி தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: הַחֻשָׁתִי
  choice: ஊசாத்தியனான
  rationale: ஊசா என்னும் இடம் அல்லது குலத்துடன் தொடர்பைக் குறிக்கும் அடைமொழி; தமிழில் இயல்பான இன/குலச் சார்புப் பெயராக வழங்கப்பட்டது.
- source_word: עִילַי
  choice: ஈலாய்
  rationale: இவ்வசனத்தின் எபிரெய மெய்யெழுத்து வடிவத்தைப் பின்பற்றிய தனிப்பெயர் ஒலிபெயர்ப்பு; 2 சாமுவேல் 23:26-ன் இணைப் பட்டியலிலுள்ள வேறுபட்ட பெயருடன் ஒத்திசைக்கப்படவில்லை.
- source_word: הָאֲחוֹחִי
  choice: அகோகியனான
  rationale: அகோகு குலத்தைச் சேர்ந்தவர் என்பதைக் குறிக்கும் அடைமொழியைத் தமிழின் இயல்பான வடிவில் வழங்குகிறது.
