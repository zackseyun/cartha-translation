  text: Maharai the Netophathite[a], Heled son of Baanah the Netophathite;
translation:
  language: ta
  text: நெத்தோபாத்தியனாகிய[a] மகராய், நெத்தோபாத்தியனாகிய பானாவின் மகன் ஹெலேத்;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இரு இடங்களிலும், “நெத்தோபாவைச் சேர்ந்த” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַהְרַי
  choice: மகராய்
  rationale: தனிநபர் பெயர் என்பதால், எபிரெய ஒலிப்பைத் தமிழில் இயன்றவரை நெருக்கமாக எழுத்துப்பெயர்த்துள்ளது.
- source_word: הַנְּטֹפָתִי / הַנְּטוֹפָתִי
  choice: நெத்தோபாத்தியனாகிய
  rationale: நெத்தோபா ஊரைச் சேர்ந்தவரைக் குறிக்கும் எபிரெய இன/இடப்பெயரடை. அதன் பெயரடைத் தன்மையையும் இரு முறை வரும் அமைப்பையும் தமிழில் தக்கவைக்கிறது.
- source_word: חֵלֶד
  choice: கேலேத்
  rationale: தனிநபர் பெயர் என்பதால் எபிரெய மெய்யொலிகளுக்கு நெருக்கமாக எழுத்துப்பெயர்க்கப்பட்டுள்ளது.
- source_word: בֶּן
  choice: மகன்
  rationale: பட்டியல் சூழலில் தந்தை–மகன் உறவைக் குறிக்கும் வழக்கமான எபிரெயச் சொல்.
- source_word: בַּעֲנָה
  choice: பானா
  rationale: தனிநபர் பெயர் என்பதால் எழுத்துப்பெயர்க்கப்பட்டுள்ளது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், பெயர்ப்பட்டியலுக்கேற்ற சுருக்கமான மற்றும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. இரண்டாவது ‘நெத்தோபாத்தியன்’ என்பது கேலேத்தை அல்ல, பானாவையே குறிப்பதைத் தெளிவாக்கும் வகையில் எபிரெயச் சொற்றொடரின் உறவு பாதுகாக்கப்பட்டுள்ளது.
