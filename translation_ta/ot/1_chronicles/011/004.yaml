  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יֵּ֨לֶךְ דָּוִ֧יד וְ/כָל יִשְׂרָאֵ֛ל יְרוּשָׁלִַ֖ם הִ֣יא יְב֑וּס וְ/שָׁם֙ הַ/יְבוּסִ֔י יֹשְׁבֵ֖י הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/004.yaml
  text: Then David and all Israel went to Jerusalem—that is[a], Jebus—where the Jebusites, the inhabitants of the land, were.
translation:
  language: ta
  text: பின்பு தாவீதும் இஸ்ரவேலர் அனைவரும் எருசலேமுக்குச் சென்றார்கள்; அதுவே எபூசு. அங்கே அந்நிலத்தின் குடிகளான எபூசியர்[a] இருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘எபூசியன்’ என்பது ஒருமை வடிவில் உள்ளது; ஆனால் இங்கே அது எபூசிய மக்களை மொத்தமாகக் குறிக்கும் கூட்டொருமையாகப் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: பின்பு ... சென்றார்கள்
  rationale: வாவ் தொடர் வடிவம் கதையை அடுத்த நிகழ்வுக்கு நகர்த்துகிறது. தாவீதும் இஸ்ரவேலர் அனைவரும் சேர்ந்த எழுவாயாக வருவதால் தமிழில் பன்மை வினை இயல்பாகிறது.
- source_word: וְכָל יִשְׂרָאֵל
  choice: தாவீதும் இஸ்ரவேலர் அனைவரும்
  rationale: தேசியக் குழுவைக் குறிக்கும் ‘இஸ்ரவேல்’ என்பதை இச்சூழலில் இயல்பான தமிழில் ‘இஸ்ரவேலர் அனைவரும்’ என்று வழங்குகிறது; இணைப்பான וְ ‘-உம்’ அமைப்பால் காக்கப்படுகிறது.
- source_word: יְרוּשָׁלִַם הִיא יְבוּס
  choice: எருசலேமுக்குச் சென்றார்கள்; அதுவே எபூசு
  rationale: הִיא இரண்டு இடப்பெயர்களையும் ஒன்றென அடையாளப்படுத்துகிறது. ‘அதுவே’ பழைய பெயரான எபூசுடன் உள்ள அடையாளத்தைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וְשָׁם
  choice: அங்கே
  rationale: எபிரெயச் சொல்லின் நேரடியான இடச்சுட்டுப் பொருளைக் காக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: הַיְבוּסִי
  choice: எபூசியர்
  rationale: மூலத்தில் ஒருமை வடிவம் இருந்தாலும், தொடர்ந்து வரும் பன்மை יֹשְׁבֵי காரணமாக இது ஓர் இனக்குழுவைக் குறிக்கும் கூட்டொருமை. தமிழில் ‘எபூசியர்’ இயல்பாக அந்தக் குழுவைக் குறிக்கிறது.
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: அந்நிலத்தின் குடிகளான
  rationale: குடியிருப்பவர்களைக் குறிக்கும் பங்கேற்பு வடிவத்தையும், சூழலில் அவர்கள் வாழ்ந்த உள்ளூர் நிலப்பகுதியைக் குறிக்கும் הָאָרֶץ என்பதையும் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
