  register: நவீனத் தரத் தமிழில், பெயர்ப்பட்டியலுக்கேற்ற சுருக்கமான மற்றும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வரிசையை அப்படியே பின்பற்றாமல், தமிழ் வாசிப்பில் உறவுகள் தெளிவாக இருக்க பெயர்கள் இயல்பான வரிசையில் அமைக்கப்பட்டுள்ளன.
