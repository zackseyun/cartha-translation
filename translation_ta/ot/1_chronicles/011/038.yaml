base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/038.yaml
  text: Joel the brother of Nathan[a], Mibhar son of Hagri,
translation:
  language: ta
  text: நாத்தானின் சகோதரன் யோவேல்; ஹக்ரியின் மகன் மிப்ஹார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஹக்ரியனின் மகன் மிப்ஹார்.” எபிரெய הַגְרִי என்பதைத் தனிப்பட்ட பெயராக அல்லாமல், ஓர் இனத்தையோ குழுவையோ சேர்ந்தவரைக் குறிக்கும் அடையாளப் பெயராகவும் வாசிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: יוֹאֵל
  choice: யோவேல்
  rationale: எபிரெய தனிப்பட்ட பெயரைத் தமிழில் வழக்கமான ஒலிபெயர்ப்பு முறையில் வழங்குகிறது.
- source_word: אֲחִי
  choice: சகோதரன்
  rationale: இது ‘சகோதரன்’ என்பதன் இணைப்பு வடிவம்; இங்கு உறவைக் குறிக்கும் நேரடியான பொருளே பொருத்தமானது.
- source_word: נָתָן
  choice: நாத்தான்
  rationale: எபிரெய தனிப்பட்ட பெயரின் தமிழ் ஒலிபெயர்ப்பு.
- source_word: מִבְחָר
  choice: மிப்கார்
  rationale: தனிப்பட்ட பெயராகக் கொண்டு, எபிரெய ஒலியமைப்பை அணுகும் வகையில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: בֶּן
  choice: மகன்
  rationale: பெயர்ப்பட்டியலில் வழக்கமான நேரடி தந்தை–மகன் உறவைக் குறிக்கிறது; ‘வழித்தோன்றல்’ எனப் பொதுமைப்படுத்தச் சூழல் காரணம் இல்லை.
- source_word: הַגְרִי
  choice: ஆக்ரி
  rationale: முதன்மை உரையில் தனிப்பட்ட பெயராகக் கொள்ளப்பட்டுள்ளது. எனினும், இதை ஓர் இன/குழு அடையாளப் பெயராகவும் வாசிக்க முடிவதால் அந்த மாற்று அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
