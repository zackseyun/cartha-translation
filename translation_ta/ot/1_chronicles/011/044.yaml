  text: Uzzia the Ashterathite[a], Shama and Jeiel[b], the sons of Hotham the Aroerite.
translation:
  language: ta
  text: அஷ்தெராத்தியனான உசியா[a]; அரோவேரியனான ஹோதாமின் மகன்களாகிய சாமாவும் யெயூவேலும்[b].
  philosophy: optimal-equivalence
  footnotes:
