    text: ‘அஷ்தரோத்தியன்’ என்றும் ஒலிப்பெயர்க்கலாம்; இக்குடிப்பெயர் அஷ்தரோத்/அஷ்தெராத் என்ற இடத்தைச் சேர்ந்தவரைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘யெயியேல்’ என்றும் ஒலிப்பெயர்க்கலாம்; இது ஆங்கில ஒலிப்பெயர்ப்பு மரபுகளில் காணப்படும் மாற்றுப் பெயர்வடிவம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֻזִּיָּא
  choice: உசியா
  rationale: எபிரேய தனிப்பெயரின் ஒலிப்பெயர்ப்பு; இவ்விடத்தில் உள்ள வடிவைத் தேவையின்றி வேறு பரிச்சயமான பெயர்வடிவத்துடன் ஒன்றாக்கவில்லை.
- source_word: הָעֲשְׁתְּרָתִי
  choice: அஷ்தெராத்தியன்
  rationale: அஷ்தெராத்/அஷ்தரோத் என்னும் இடத்தைச் சேர்ந்தவரைக் குறிக்கும் குடிப்பெயரைத் தமிழ் இயல்புக்கேற்ப ஒலிப்பெயர்த்தது.
- source_word: שָׁמָע
  choice: சாமா
  rationale: மசோரெட்டிக் உரையின் தனிப்பெயரை ஒலிப்பெயர்த்தது; சாம்மா என்ற பரிச்சயமான வேறொரு வடிவத்தை இங்கு திணிக்கவில்லை.
- source_word: ויעואל
  choice: யெயூவேல்
  rationale: எழுதப்பட்ட மெய்யெழுத்து வடிவத்தை அடிப்படையாகக் கொண்ட ஒலிப்பெயர்ப்பு; முன்சேர்க்கை வாவ் ‘-உம்’ என இணைப்புச் சொல்லாக வழங்கப்பட்டது.
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: கட்டமைப்பு பன்மையான ‘மகன்கள்’ என்பதை நேரடியாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: חוֹתָם
  choice: ஓத்தாம்
  rationale: எபிரேய தனிப்பெயரின் ஒலிப்பெயர்ப்பு.
- source_word: הָעֲרֹעֵרִי
  choice: அரோவேரியன்
  rationale: அரோவேர் என்னும் இடத்தைச் சேர்ந்தவரைக் குறிக்கும் குடிப்பெயரைத் தமிழ் ஒலியமைப்புக்கு ஏற்றவாறு வழங்கியது.
