  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. இராணுவச் சூழலைத் தெளிவுபடுத்தினாலும், וַיַּעַל என்பதைக் ‘தாக்கினான்’ என்று விளக்கமிகுத்து மொழிபெயர்க்காமல் மூலத்தின் திறந்த பொருளை வைத்திருக்கிறது.
