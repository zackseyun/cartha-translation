base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/006.yaml
  text: And David said[a], “Whoever strikes down a Jebusite first shall become chief and commander.” So Joab son of Zeruiah went up first[b], and he became chief.
translation:
  language: ta
  text: தாவீது, “யார் முதலில் ஒரு எபூசியனை வீழ்த்துகிறாரோ, அவர் தலைவனும் தளபதியும் ஆவார்” என்றார். அப்போது செருயாவின் மகன் யோவாப் முதலில் ஏறிச் சென்றான்; அவன் தலைவனானான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל מַכֵּה יְבוּסִי
  choice: யார் ஒரு எபூசியனை வீழ்த்துகிறாரோ
  rationale: כָּל என்பதும் அடித்தல்/வீழ்த்துதல் என்ற பொருளுடைய מַכֵּה என்னும் பங்கேற்பு வடிவமும் சேர்ந்து, ‘யார் ... செய்கிறாரோ’ என்ற பொதுவான நிபந்தனைப் பொருளைத் தருகின்றன. இராணுவச் சூழலில் נכה என்பதற்கு ‘வீழ்த்துதல்’ இயல்பானது; ஒருமையான יְבוּסִי இங்கு இனத்தைச் சேர்ந்த ஒருவரைப் பொதுவாகக் குறிக்கிறது.
- source_word: בָּרִאשׁוֹנָה
  choice: முதலில்
  rationale: செயலில் முன்னுரிமையைச் சுட்டும் வினையடைப் பயன்பாட்டை இயல்பான நவீனத் தமிழில் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: יִהְיֶה לְרֹאשׁ וּלְשָׂר
  choice: தலைவனும் தளபதியும் ஆவார்
  rationale: רֹאשׁ தலைமை நிலையைச் சுட்டுகிறது; שַׂר ஆட்சிப் பொறுப்பையோ இராணுவக் கட்டளைப் பொறுப்பையோ குறிக்கலாம். இப்போர்ச் சூழலில் ‘தலைவன்’ மற்றும் ‘தளபதி’ என்ற இணை இயல்பாகவும் வேறுபாட்டைக் காக்கும் வகையிலும் உள்ளது.
- source_word: וַיַּעַל
  choice: ஏறிச் சென்றான்
  rationale: עלה என்பதன் அடிப்படைப் பொருள் ‘மேலே செல்லுதல்/ஏறிச் செல்லுதல்.’ கோட்டையைத் தாக்க முன்னேறியதைக் குறிக்கக்கூடும் என்றாலும், உரையில் நேரடியாக உள்ள மேலே செல்லும் கருத்தை மொழிபெயர்ப்பு காக்கிறது.
- source_word: יוֹאָב בֶּן צְרוּיָה
  choice: செருயாவின் மகன் யோவாப்
  rationale: எபிரெயப் பெயர்களையும் தந்தை/தாய் வழி உறவைக் காட்டும் கட்டமைப்பையும் தமிழின் இயல்பான சொல் வரிசையில் தருகிறது.
- source_word: וַיְהִי לְרֹאשׁ
  choice: அவன் தலைவனானான்
  rationale: முன்னர் வந்த רֹאשׁ என்ற சொல்லுடனான சொற்பிணைப்பைக் காக்கிறது. இங்கு שַׂר மீண்டும் வராததால் ‘தளபதி’ சேர்க்கப்படவில்லை.
