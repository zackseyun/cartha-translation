  rationale: மக்களை வழிநடத்துவதைக் குறிக்கும் எபிரெய உருவகச் சொல்லாட்சியை விளக்கமாக்காமல் அதன் வெளியே/உள்ளே இயக்கப் படிமத்தைத் தக்கவைக்கிறது.
