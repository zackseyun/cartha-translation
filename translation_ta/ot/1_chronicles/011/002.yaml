base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/002.yaml
  text: Even in times past[a], even before, when Saul was king, you were the one who led Israel out and brought them in; and Yahweh your God said to you, ‘You shall shepherd my people Israel[c][b], and you shall be ruler over my people Israel.’
translation:
  language: ta
  text: முன்னாளிலும், அதற்கு முன்பும்[a], சவுல் அரசனாக இருந்தபோது, இஸ்ரயேலை வெளியே நடத்திச் சென்று உள்ளே அழைத்து வந்தவர் நீரே[b]. உமது கடவுளாகிய யாவே உம்மிடம், “என் மக்களான இஸ்ரயேலை நீர் மேய்ப்பீர்; என் மக்களான இஸ்ரயேலின்மேல் நீர் தலைவராய் இருப்பீர்[c]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லர்த்தமாக, “நேற்றும் அதற்கு முந்தின நாளும்”; இது “முன்னாளில்” அல்லது “கடந்த காலத்தில்” என்று பொருள்படும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லர்த்தமாக, “இஸ்ரயேலை வெளியே கொண்டுசென்று உள்ளே கொண்டுவந்தவர்.” இது மக்களை வழிநடத்துவதைக் குறிக்கும் எபிரெயச் சொல்லாட்சி.
    reason: lexical_alternative
  - marker: c
    text: “ஆட்சியாளர்” அல்லது “இளவரசர்” என்றும் மொழிபெயர்க்கலாம்; இங்குள்ள எபிரெயச் சொல் வழக்கமாக “அரசன்” என்பதற்குப் பயன்படுத்தப்படும் சொல் அல்ல.
    reason: lexical_alternative
