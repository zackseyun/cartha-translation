theological_decisions:
- issue: יהוה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூலத்தில் பொதுப்பட்டப் பெயர் அல்லாமல் நான்கெழுத்துத் தெய்வீகப் பெயரே உள்ளது; ஆகவே அதை ஒலிபெயர்ப்பது அந்தத் தனிப்பெயரைத் தக்கவைக்கிறது.
- issue: תִרְעֶה என்ற அரச-மேய்ப்பர் உருவகம்
  choice: என் மக்களாகிய இஸ்ரயேலை நீர் மேய்ப்பீர்
