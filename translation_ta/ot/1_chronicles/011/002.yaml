  rationale: மூலத்தின் மேய்ப்பர் உருவகத்தையும் அதிலுள்ள பராமரிப்பு மற்றும் தலைமை ஆகிய இரு பரிமாணங்களையும் தீர்த்துவிடாமல் பாதுகாக்கிறது.
- issue: נָגִיד என்பதன் தலைமைப் பொருள்
  choice: தலைவர்
  alternative: ஆட்சியாளர்; இளவரசர்
  rationale: இச்சொல்லுக்கு அரசாட்சித் தொடர்பு இருந்தாலும், அது வழக்கமான ‘அரசன்’ என்ற சொல்லல்ல; ‘தலைவர்’ அந்த வேறுபாட்டைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. தாவீதிடம் பேசும் இரண்டாம் நபர் ஆண்பால் ஒருமையை ‘நீர்/உமது’ என்ற மரியாதை ஒருமையில் வழங்குகிறது. எபிரெய மூலத்தின் மேய்ப்பர் உருவகமும் ‘அரசன்’–‘தலைவர்’ சொல்வேறுபாடும் பாதுகாக்கப்பட்டுள்ளன.
