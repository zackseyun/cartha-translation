translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான வரலாற்று உரைநடை பயன்படுத்தப்பட்டுள்ளது. ஆங்கில ஆலோசனை உரையில் [b] குறி ‘வாற்கோதுமை’ என்பதற்குப் பின் இருந்தாலும், அதன் அடிக்குறிப்பு ஓடிப்போனதைக் குறிக்கும் எபிரெய மரபுத்தொடரையே விளக்குவதால், தமிழில் அந்தக் குறி தொடர்புடைய வாக்கியத்தின் முடிவுக்கு மாற்றப்பட்டுள்ளது.
