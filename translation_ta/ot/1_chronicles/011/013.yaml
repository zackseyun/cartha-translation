base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/013.yaml
  text: He was with David at Pas-dammim[a], where the Philistines had gathered for battle. Now the plot of the field was full of barley[b], and the people fled from before the Philistines.
translation:
  language: ta
  text: அவன் பாஸ்-தம்மீமில்[a] தாவீதுடன் இருந்தான். அங்கே பெலிஸ்தியர்கள் போருக்காக ஒன்றுகூடியிருந்தார்கள். வயலின் ஒரு பகுதி வாற்கோதுமை நிறைந்திருந்தது; மக்கள் பெலிஸ்தியர்களுக்கு முன்பாக ஓடிப்போனார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: பாஸ்-தம்மீம் என்பது ஓர் இடப்பெயர். இதற்கு இணையான நிகழ்வைக் கூறும் 1 சாமுவேல் 17:1-ல் அந்த இடம் எபேஸ்-தம்மீம் என்று அழைக்கப்படுகிறது.
    reason: cross_reference
  - marker: b
    text: சொல்லர்த்தமாக, ‘பெலிஸ்தியர்களின் முன்பிலிருந்து ஓடினார்கள்.’ இது எதிரியின் முன்பாகப் பின்வாங்கி ஓடுவதைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּפַּס דַּמִּים
  choice: பாஸ்-தம்மீமில்
  rationale: நாளாகமத்தில் இது ஓர் இடப்பெயராக வருகிறது. அதன் பொருளை ஊகித்து மொழிபெயர்ப்பதைவிட, எபிரெய உச்சரிப்பைத் தமிழில் ஒலிபெயர்ப்பது இடப்பெயர் தன்மையைத் தெளிவாகக் காக்கிறது.
- source_word: נֶאֱסְפוּ
  choice: ஒன்றுகூடியிருந்தார்கள்
  rationale: אסף என்பதன் நிபால் வடிவம் இங்கு போருக்காகப் படைகள் கூடிவந்ததைக் குறிக்கிறது; தொடரும் நிகழ்வுக்கு முன்பே அந்தக் கூடுகை நிகழ்ந்திருந்ததை இவ்வடிவம் இயல்பாகத் தெரிவிக்கிறது.
- source_word: לַמִּלְחָמָה
  choice: போருக்காக
  rationale: இங்கு பொதுவான போர் நிலையைவிட ஒரு குறிப்பிட்ட மோதலுக்கான படைக்கூடுகையே சூழல்; ‘போருக்காக’ என்பது இயல்பாகவும் நேரடியாகவும் உள்ளது.
- source_word: חֶלְקַת הַשָּׂדֶה
  choice: வயலின் ஒரு பகுதி
  rationale: חֶלְקָה என்பது வரையறுக்கப்பட்ட நிலப்பகுதி அல்லது வயல் துண்டைக் குறிக்கிறது. ‘வயலின் ஒரு பகுதி’ என்பது சாதாரண வாசகருக்குத் தெளிவான இயல்பான தமிழ்.
- source_word: מְלֵאָה שְׂעוֹרִים
  choice: வாற்கோதுமை நிறைந்திருந்தது
  rationale: שְׂעוֹרִים என்பது பொதுவான தானியம் அல்ல, குறிப்பாக வாற்கோதுமை. மூலத்தின் வேளாண் விவரம் அப்படியே காக்கப்படுகிறது.
- source_word: וְהָעָם
  choice: மக்களோ
  rationale: עָם என்ற சொல் ‘வீரர்கள்’ அல்லது ‘ஆண்கள்’ என்று பொருளைக் குறுக்காமல் பொதுவாக ‘மக்கள்’ என மொழிபெயர்க்கப்படுகிறது; சூழலில் அவர்கள் இஸ்ரவேல் தரப்பினராக இருக்கலாம்.
- source_word: נָסוּ מִפְּנֵי פְלִשְׁתִּים
  choice: பெலிஸ்தியர்களிடமிருந்து தப்பியோடினார்கள்
  rationale: מִפְּנֵי என்பதன் சொற்பொருள் ‘முன்பிலிருந்து’ என்றாலும், எதிரியை விட்டு பின்வாங்கி ஓடுவதைக் குறிக்கும் எபிரெய மரபுத்தொடர் இது. தமிழில் அதன் சூழற்பொருளை இயல்பாகத் தருகிறது.
