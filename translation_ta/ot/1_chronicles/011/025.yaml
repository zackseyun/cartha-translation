translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, வாசிக்க எளிய நடை பயன்படுத்தப்பட்டுள்ளது. ‘முப்பது பேர்’ மற்றும் ‘அந்த மூவர்’ ஆகியவை தாவீதின் வீரர்களுக்குள் அறியப்பட்ட தரவரிசைக் குழுக்களாகத் தரப்பட்டுள்ளன; மூலத்தில் இல்லாத ‘தலைசிறந்த’ போன்ற விளக்கச் சொற்கள் சேர்க்கப்படவில்லை. எபிரெயத்தின் ஒப்பீட்டு/பங்கீட்டு ambiguity மற்றும் מִשְׁמַעַת என்பதன் பொருள் பரப்பு அடிக்குறிப்புகளில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளன.
