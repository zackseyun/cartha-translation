  text: מִן הַ/שְּׁלוֹשִׁ֗ים הִנּ֤/וֹ נִכְבָּד֙ ה֔וּא וְ/אֶל הַ/שְּׁלוֹשָׁ֖ה לֹא בָ֑א וַ/יְשִׂימֵ֥/הוּ דָוִ֖יד עַל מִשְׁמַעְתּֽ/וֹ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/025.yaml
  text: Among the Thirty[a], he was indeed honored, but he did not attain to the Three[b]; and David appointed him over his bodyguard.
translation:
  language: ta
  text: முப்பது பேரைவிட அவன் உண்மையிலேயே மதிப்புக்குரியவனாக இருந்தான்; ஆனாலும் அந்த மூவரின் தரத்தை அவன் எட்டவில்லை[a]. தாவீது அவனைத் தன் காவல் அணிக்குத் தலைவனாக நியமித்தார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்த மூவரிடம் அவன் வரவில்லை.” எபிரெயத்தில் ‘வருதல்’ என்பது இங்கு அவர்களுடைய தரத்தை அடைவதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “தன் காவல் அணிக்குப் பொறுப்பாக” அல்லது “தன் கட்டளைக்குக் கீழிருந்தவர்களுக்குப் பொறுப்பாக.” எபிரெயச் சொல் காவல் அணியையோ, ஒருவரின் அதிகாரத்தின்கீழ் ஒப்படைக்கப்பட்ட குழுவையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַשְּׁלוֹשִׁים
  choice: முப்பது பேரைவிட
  rationale: מִן இங்கு ஒப்பீட்டுப் பொருளில் வருவதாக இணையான உரையும் சூழலும் சுட்டுகின்றன; அவன் முப்பது பேரைவிட உயர்ந்த மதிப்பைப் பெற்றிருந்தாலும் மூவரின் நிலையை எட்டவில்லை என்பதே வாக்கியத்தின் தரவரிசை அமைப்புக்கு இயல்பாகப் பொருந்துகிறது. பங்கீட்டுப் பொருளான ‘முப்பது பேரில்’ என்பதும் சாத்தியமாதலால் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: הִנּוֹ נִכְבָּד
  choice: அவன் உண்மையிலேயே மதிப்புக்குரியவனாக இருந்தான்
  rationale: הִנּוֹ தரும் வலியுறுத்தலை ‘உண்மையிலேயே’ இயல்பாக வெளிப்படுத்துகிறது; כבד என்பதன் நிபால் வடிவம் இங்கு இராணுவத் தரநிலையில் பெற்ற மதிப்பையும் சிறப்பையும் குறிக்கிறது.
- source_word: וְאֶל הַשְּׁלוֹשָׁה לֹא בָא
  choice: ஆனாலும் அந்த மூவரின் நிலையை அவன் எட்டவில்லை
  rationale: ‘மூவரிடம் வரவில்லை’ என்ற எபிரெய மொழிமரபு இச்சூழலில் அவர்களுடைய தரத்தை அல்லது நிலையை அடையாததைக் குறிக்கிறது. ‘அந்த மூவர்’ என்பது ஏற்கெனவே அறியப்பட்ட சிறப்புவாய்ந்த மூவர் குழுவைச் சுட்டுகிறது.
- source_word: וַיְשִׂימֵהוּ דָוִיד
  choice: தாவீது அவனை ... தலைவனாக நியமித்தார்
  rationale: שׂים என்பதன் அடிப்படைப் பொருள் ‘வைத்தல்’ என்றாலும், ஓர் இராணுவப் பொறுப்பை ஒப்படைக்கும் இச்சூழலில் ‘தலைவனாக நியமித்தார்’ என்பது அதன் செயல்பாட்டு பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: עַל מִשְׁמַעְתּוֹ
  choice: தன் மெய்க்காவல் படைக்குத் தலைவனாக
  rationale: מִשְׁמַעַת என்பது ஒருவரின் கட்டளைக்குக் கீழ்ப்பட்ட காவல் அணி அல்லது படைப்பிரிவைக் குறிக்கலாம். அரசனின் தனிப்பட்ட பாதுகாப்புப் படை என்பது இச்சூழலில் பொருத்தமான முதன்மைப் பொருள்; சொல்லின் பரந்த சாத்தியம் அடிக்குறிப்பில் காக்கப்பட்டுள்ளது.
