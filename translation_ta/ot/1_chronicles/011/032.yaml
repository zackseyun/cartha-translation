  text: Hurai from the wadis of Gaash[b][a], Abiel the Arbathite.
translation:
  language: ta
  text: காஷின் பருவகால ஓடைப் பள்ளங்களைச் சேர்ந்த ஹூராய்[a]; அர்பாத்தியனான அபியேல்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “காஷின் பள்ளத்தாக்குகளிலிருந்து” அல்லது “காஷின் ஓடைகளிலிருந்து.” இங்குள்ள எபிரெயச் சொல் வாடி, பள்ளத்தாக்கு, ஓடை, அல்லது பருவகால நீரோடைப் பள்ளம் ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “அர்பாத்தியன்” என்பது அர்பாத் என்னும் இடத்தைச் சேர்ந்தவர் என்பதைக் குறிக்கும் குடிப்பெயர்; அது அரபா பகுதியுடன் தொடர்புடையதாக இருக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: חוּרַי
  choice: கூராய்
  rationale: ஆள்பெயர் என்பதால் மொழிபெயர்க்காமல், எபிரெய ஒலிப்புக்கு நெருக்கமாகத் தமிழில் எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: מִ/נַּחֲלֵי
  choice: பள்ளத்தாக்குகளிலிருந்து வந்த
  rationale: נַחַל என்பது ஓடை, பருவகால நீரோடும் பள்ளம், பள்ளத்தாக்கு ஆகிய பொருள்களைக் கொண்டது. இயல்பான தமிழில் புவியியல் பொருளைத் தக்கவைக்க ‘பள்ளத்தாக்குகள்’ தேர்ந்தெடுக்கப்பட்டது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: גָעַשׁ
  choice: காயாஷ்
  rationale: இடப்பெயர் என்பதால் எபிரெய ஒலிப்புக்கு நெருக்கமாக எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: אֲבִיאֵל
  choice: அபியேல்
  rationale: ஆள்பெயர் என்பதால் மொழிபெயர்க்காமல் தமிழில் எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: הָ/עַרְבָתִי
  choice: அர்பாத்தியனான
  rationale: ஒருவர் அர்பாத் என்னும் இடத்தைச் சேர்ந்தவர் என்பதைக் குறிக்கும் குடிப்பெயர்/இடச்சார்புப் பெயராக இயல்பான தமிழில் வழங்கப்பட்டது; அந்த இடத்தை அரபாவுடன் உறுதியாக அடையாளப்படுத்தவில்லை.
