  - marker: a
    text: எபிரெய உரை, “கிசோனியனாகிய ஹாஷேமின் மகன்கள்” என்று வாசிக்கிறது. 2 சாமுவேல் 23:32-இல் உள்ள இணைப் பட்டியலில் பெயர்களின் வரிசை வேறுபடுகிறது; சில மொழிபெயர்ப்புகளிலும் உரை மீட்டமைப்புகளிலும் அந்த வாசகம் பிரதிபலிக்கிறது.
    reason: textual_variant
lexical_decisions:
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: בן என்பதன் பன்மை இணைப்பு வடிவம்; மசோரா உரையில் உள்ள பன்மையை இணை வசனத்தோடு ஒத்திசைக்காமல் அப்படியே காக்கிறது.
- source_word: הָשֵׁם
  choice: ஹாசேம்
  rationale: தனிப்பட்ட பெயர் என்பதால் பொருள் மொழிபெயர்ப்பு செய்யாமல், தமிழில் இயல்பாக ஒலிபெயர்க்கப்பட்டது.
- source_word: הַגִּזוֹנִי
  choice: கிசோனியனான
  rationale: குடி அல்லது ஊர்சார்பைக் குறிக்கும் பெயரடை; எபிரெயக் குறிப்பிட்ட சுட்டையும் தமிழ்ச் சொற்றொடரின் இயல்பில் வெளிப்படுத்துகிறது.
- source_word: יוֹנָתָן
  choice: யோனத்தான்
  rationale: எபிரெயத் தனிப்பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: בֶּן
  choice: மகன்
  rationale: வம்ச உறவைக் காட்டும் இணைப்பு வடிவத்திற்கான இயல்பான தமிழ் இணை.
- source_word: שָׁגֵה
  choice: சாகே
  rationale: தனிப்பெயர் என்பதால் எபிரெய உச்சரிப்பை அணுகும் வகையில் ஒலிபெயர்க்கப்பட்டது.
- source_word: הַהֲרָרִי
  choice: ஆராரியனான
  rationale: குடி அல்லது இடச்சார்பைக் குறிக்கும் வடிவமாக ஒலிபெயர்த்து, தமிழில் பெயரடைத் தொடராக வழங்கப்பட்டது.
