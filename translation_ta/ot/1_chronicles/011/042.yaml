  language: en
  yaml_path: translation/ot/1_chronicles/011/042.yaml
  text: Adina son of Shiza the Reubenite[a], a chief of the Reubenites, and with him were thirty.
translation:
  language: ta
  text: ரூபன் கோத்திரத்தைச் சேர்ந்த ஷீசாவின் மகன் அதீனா; ரூபன் கோத்திரத்தாரின் தலைவர்; அவருடன் முப்பது பேர் இருந்தனர்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, சொல்லுக்குச் சொல்: “அவர்மேல் முப்பது பேர் இருந்தனர்.” இந்த இராணுவப் பட்டியலில், முப்பது பேர் அவருடன் இணைந்திருந்தனர் என்று பொருள்பட வாய்ப்புள்ளது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲדִינָא
  choice: அதீனா
  rationale: எபிரெயத் தனிப்பெயர் தமிழில் இயல்பாக ஒலிபெயர்க்கப்பட்டது.
- source_word: בֶן שִׁיזָא
  choice: சீசாவின் மகன்
  rationale: בן இங்கு வீரர் பட்டியலில் நேரடியான தந்தை–மகன் உறவைக் குறிக்கிறது; שִׁיזָא தனிப்பெயராக ஒலிபெயர்க்கப்பட்டது.
- source_word: הָרְאוּבֵנִי
  choice: ரூபன் கோத்திரத்தானான
  rationale: குறிப்பிட்ட இனக்குழுப் பெயரடை ரூபன் கோத்திரச் சேர்ந்தவரை அடையாளப்படுத்துகிறது.
- source_word: רֹאשׁ לָרְאוּבֵנִי
  choice: ரூபன் கோத்திரத்தாரின் தலைவர்
  rationale: רֹאשׁ இச்சூழலில் உடல் உறுப்பை அல்ல, தலைமை நிலையைக் குறிக்கிறது; ל உறவு அல்லது அதிகார வட்டத்தைக் காட்டுகிறது.
- source_word: וְעָלָיו שְׁלוֹשִׁים
  choice: இவருடன் முப்பது பேர் இருந்தனர்
  rationale: על என்பதன் அடிப்படைப் பொருள் ‘மேல்’ எனினும், இந்த இராணுவப் பட்டியலில் அதீனாவுடன் இணைக்கப்பட்ட அல்லது அவரது பொறுப்பிலிருந்த முப்பது பேரைக் குறிக்க வாய்ப்புள்ளது. ‘பேர்’ என்பது சூழலிலிருந்து தெளிவாக்கப்பட்டுள்ளது.
