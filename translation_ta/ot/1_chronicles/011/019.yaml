base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/019.yaml
  text: And he said[a], “Far be it from me, by my God, to do this! Shall I drink the blood of these men at the cost of their lives? For they brought it at the cost of their lives.” So he was not willing to drink it[b]. These things the three mighty men did.
translation:
  language: ta
  text: 'அவர் சொன்னார்: “என் கடவுளின் பேரில், இதைச் செய்வது எனக்கு ஆகாது! தங்கள் உயிர்களைப் பணயம் வைத்து[a] வந்த இந்த மனிதர்களின் இரத்தத்தை[b] நான் குடிப்பேனா? ஏனெனில், தங்கள் உயிர்களைப் பணயம் வைத்தே அவர்கள் இதைக் கொண்டுவந்தார்கள்.” எனவே, அவர் அதைக் குடிக்க இணங்கவில்லை. இந்தச் செயல்களை அந்த மூன்று மாவீரர்களும் செய்தார்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேரடியாக, “தங்கள் உயிர்களோடு.” உயிராபத்தை எதிர்கொண்டு என்பதே இங்குள்ள பொருள். இதே சொற்றொடர் அடுத்த வாக்கியத்திலும் மீண்டும் வருகிறது.
    reason: lexical_alternative
  - marker: b
    text: “இரத்தம்” என்பது மூலமொழியில் உள்ள சொல்லே. அந்தத் தண்ணீரை இவர்கள் உயிராபத்தின் வழியாகக் கொண்டுவந்ததால், தாவீது அதை அவர்களுடைய இரத்தத்தைப் போலக் கருதுகிறார்.
    reason: cultural_note
lexical_decisions:
- source_word: חָלִילָה לִּי מֵאֱלֹהַי
  choice: என் கடவுளின் பேரில், இதைச் செய்வது எனக்கு ஆகாது
  rationale: חָלִילָה என்பதன் வலுவான மறுப்பையும், מֵאֱלֹהַי என்பதில் சூழலால் உணரப்படும் கடவுளைச் சாட்சியாகக் கொள்ளும் வலிமையையும் இயல்பான தமிழில் தருகிறது; ‘கடவுள் தடுத்தருள்வாராக’ என்ற மரபுவழிச் சொற்றொடரைத் திணிக்கவில்லை.
- source_word: מֵעֲשׂוֹת זֹאת
  choice: இதைச் செய்வது
  rationale: முன்னுள்ள வலுவான மறுப்புடன் இணைந்து, ‘இதைச் செய்வது எனக்கு ஆகாது’ என்ற இயல்பான தமிழ் அமைப்பை உருவாக்குகிறது.
- source_word: הֲדַם הָאֲנָשִׁים הָאֵלֶּה אֶשְׁתֶּה
  choice: இந்த மனிதர்களின் இரத்தத்தை நான் குடிப்பேனா?
  rationale: הֲ எழுப்பும் வினாவை மறைமுக மறுப்புடைய வினாவாக வைத்ததுடன், மூலத்தின் ‘இரத்தம்’ என்ற தாக்கமிக்க உருவகத்தையும் அப்படியே காக்கிறது.
- source_word: בְנַפְשׁוֹתָם
  choice: தங்கள் உயிர்களைப் பணயம் வைத்து
  rationale: נֶפֶשׁ இங்கு ‘ஆத்துமா’ அல்ல, ஆபத்துக்குள்ளாக்கப்பட்ட உடல் உயிரைக் குறிக்கிறது. בְ கூறும் சூழ்நிலை அல்லது விலையை நவீனத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: כִּי בְנַפְשׁוֹתָם הֱבִיאוּם
  choice: ஏனெனில், தங்கள் உயிர்களைப் பணயம் வைத்தே அவர்கள் இதைக் கொண்டுவந்தார்கள்
  rationale: மூலத்தில் בְנַפְשׁוֹתָם மீண்டும் வருவதைத் தமிழிலும் மீளுரைத்துக் காக்கிறது. הֱבִיאוּם இன் சுட்டுப்பொருளான தண்ணீர் தமிழில் ஒருமைப் பொதுப்பெயரான ‘இது’ எனக் குறிப்பிடப்படுகிறது.
- source_word: וְלֹא אָבָה לִשְׁתּוֹתָם
  choice: எனவே, அவர் அதைக் குடிக்க இணங்கவில்லை
  rationale: אָבָה என்பதிலுள்ள மனவிருப்பம் அல்லது இணக்கமின்மையை, வெறுமனே ‘குடிக்கவில்லை’ என்பதைக் காட்டிலும் துல்லியமாகத் தருகிறது.
- source_word: אֵלֶּה עָשׂוּ שְׁלֹשֶׁת הַגִּבּוֹרִים
  choice: இந்தச் செயல்களை அந்த மூன்று மாவீரர்களும் செய்தார்கள்
  rationale: גִּבּוֹרִים என்பதன் இராணுவ-வீரத் தன்மையையும், இறுதிக் கூற்றின் சுருக்கப் பண்பையும் காக்கிறது.
theological_decisions:
- issue: தாவீது தண்ணீரை ‘இரத்தம்’ என்று குறிப்பிடுவது
  choice: ‘இரத்தம்’ என்பதை முதன்மை உரையில் நேரடியாக வைத்தல்
  alternative: ‘உயிரைப் பணயம் வைத்துப் பெற்ற தண்ணீர்’ என்று விளக்கமாக மாற்றுதல்
  rationale: எபிரெய உரை வெளிப்படையாக ‘இரத்தம்’ என்கிறது. அந்தத் தண்ணீரைப் பெற அவர்கள் உயிராபத்தை எதிர்கொண்டதால், அதை அருந்துவது அவர்களுடைய இரத்தத்தை அருந்துவதற்கு ஒப்பானது என்ற தாவீதின் அறநெறி மதிப்பீட்டை இந்த உருவகம் தாங்குகிறது.
- issue: נֶפֶשׁ என்பதன் பொருள்
  choice: உயிர்கள்
  alternative: ஆத்துமாக்கள்
  rationale: இச்சூழலில் இச்சொல் ஆபத்துக்குள்ளான உடல் உயிரைக் குறிக்கிறது; மனிதனின் காணமுடியாத கூறைப் பற்றிய தனிப்பட்ட இறையியல் கருத்தை இது முன்வைக்கவில்லை.
- issue: מֵאֱלֹהַי என்பதன் தொடர்பு
  choice: என் கடவுளின் பேரில்
  alternative: என் கடவுளுக்கு முன்பாக
  rationale: சூழலில் உள்ள கடவுளைச் சாட்சியாகக் கொள்ளும் அல்லது அவரை நோக்கி வலுவாக மறுக்கும் தொனியை முதன்மை உரை தருகிறது; ‘என் கடவுளுக்கு முன்பாக’ என்பது இலக்கணரீதியாகச் சாத்தியமான மாற்றாக இருந்தாலும், தமிழில் வாக்கியத் தொடர்பு குறைவாகத் தெளிவாகும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் வகையிலும் வரலாற்றுக் கதைக்கு ஏற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘ஆகாது,’ ‘இணங்கவில்லை,’ ‘மாவீரர்கள்’ ஆகியவை உயர்வானதாக இருந்தாலும் வழக்கிலுள்ள சொற்கள். மூலத்தின் வலுவான மறுப்பு, உயிராபத்து குறித்த இருமுறை வலியுறுத்தல், மற்றும் ‘இரத்தம்’ என்ற நோக்கமுள்ள உருவகம் காக்கப்பட்டுள்ளன.
