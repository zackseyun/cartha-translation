  rationale: தனிப்பட்ட பெயர் என்பதால் எபிரெய ஒலிப்புக்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: פְּלוֹנִי
  choice: பெலோனைச் சேர்ந்த
  rationale: குறிப்பிட்ட இடம் அல்லது குலத்தைச் சேர்ந்தவர் என்பதைக் காட்டும் சொல்லாக இயல்பான தமிழில் வழங்கப்பட்டுள்ளது. நாளாகமத்தின் மசோரா வடிவம் பாதுகாக்கப்பட்டுள்ளது.
