translation_notes:
  register: நவீன தரத் தமிழில், பெயர்ப் பட்டியலுக்கேற்ற சுருக்கமான மற்றும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய இன/இடச் சார்புப் பெயர்களை செயற்கையான தமிழ் பெயரடைகளாக மாற்றாமல், ordinary readersக்கு தெளிவான “சேர்ந்த” அமைப்பில் வழங்கப்பட்டுள்ளது; உரை வேறுபாடுகள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
