  rationale: தனிப்பட்ட பெயர் என்பதால் மொழிபெயர்க்காமல், எபிரெய ஒலிப்புக்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: הֲרוֹרִי
