base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/014.yaml
  text: And they took their stand in the middle of the plot and delivered it[a], and they struck down the Philistines, and Yahweh saved by a great victory.
translation:
  language: ta
  text: அவர்கள் அந்த நிலப்பகுதியின் நடுவில் நிலைகொண்டு, அதைக் காப்பாற்றி, பெலிஸ்தியரை வீழ்த்தினார்கள். யாவே மாபெரும் மீட்பை அளித்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவே மாபெரும் வெற்றியை அளித்தார்”; அல்லது, “யாவே பெரும் விடுதலையை உண்டாக்கினார்.”
    reason: תְּשׁוּעָה என்பது இப்போர்ச் சூழலில் ‘மீட்பு,’ ‘விடுதலை,’ அல்லது ‘வெற்றி’ எனப் பொருள்படலாம்.
lexical_decisions:
- source_word: וַיִּתְיַצְּבוּ
  choice: நிலைகொண்டு
  rationale: התיצב என்பதன் தன்னிலை/உறுதிநிலை உணர்வையும், போரில் தங்கள் இடத்தை விட்டுக்கொடுக்காமல் நின்றதையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְתוֹךְ הַחֶלְקָה
  choice: அந்த நிலப்பகுதியின் நடுவில்
  rationale: חֶלְקָה என்பது பயிரிடப்பட்ட நிலத்தின் ஒரு குறிப்பிட்ட பகுதி அல்லது துண்டைக் குறிக்கிறது; ‘நிலப்பகுதி’ என்பது சூழலுக்கு ஏற்ற தெளிவான பொதுத்தமிழ்.
- source_word: וַיַּצִּילוּהָ
  choice: அதைக் காப்பாற்றி
  rationale: பெண்பால் ஒருமை பின்னொட்டு நிலப்பகுதியையே சுட்டுகிறது. נצל என்பதன் பகைவர் கைப்பற்றுவதிலிருந்து மீட்கும் பொருளை ‘காப்பாற்றி’ இயல்பாகத் தருகிறது.
- source_word: וַיַּכּוּ אֶת־פְּלִשְׁתִּים
  choice: பெலிஸ்தியரை வீழ்த்தினார்கள்
  rationale: போர்ச் சூழலில் נכה என்பது வெறுமனே அடித்ததைவிடத் தாக்கி வீழ்த்தியதைக் குறிக்கிறது.
- source_word: וַיּוֹשַׁע יְהוָה תְּשׁוּעָה גְדוֹלָה
  choice: யாவே மாபெரும் மீட்பை அளித்தார்
  rationale: ஒரே வேர் சார்ந்த வினைச்சொல்–பெயர்ச்சொல் அமைப்பைச் சொற்சொல்லாக மாற்றினால் தமிழ் இயல்பிழக்கும். செயல் யாவேயுடையது என்பதையும், תְּשׁוּעָה என்பதன் மீட்பு/வெற்றி பரப்பையும் இவ்வாக்கியம் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான நான்கெழுத்துத் திருப்பெயரை பட்டப்பெயராக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் பட்டப்பெயர் அல்ல, இறைவனின் தனிப்பெயர் நேரடியாக உள்ளது; ஆகவே அதை ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: וַיּוֹשַׁע ... תְּשׁוּעָה גְדוֹלָה என்பதன் இராணுவ மற்றும் மீட்பு நுணுக்கம்
  choice: மாபெரும் மீட்பை அளித்தார்
  alternative: மாபெரும் வெற்றியை அளித்தார் / பெரும் விடுதலையை உண்டாக்கினார்
  rationale: இச்சூழலில் வெற்றி என்ற பொருள் வலுவாக இருந்தாலும், ישׁע வேரின் விரிவான மீட்பு உணர்வை மட்டும் இராணுவ வெற்றியாகச் சுருக்காமல் வைத்திருக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், வரலாற்றுப் போர்விவரத்திற்கேற்ற கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் தொடர் வினை அமைப்பு தமிழில் இயல்பாக இணைக்கப்பட்டு, இறுதியில் யாவேயின் தீர்மானகரமான செயல் தனி வாக்கியமாக வலியுறுத்தப்பட்டுள்ளது.
