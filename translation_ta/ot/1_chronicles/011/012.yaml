  text: וְ/אַחֲרָ֛י/ו אֶלְעָזָ֥ר בֶּן דּוֹד֖וֹ הָ/אֲחוֹחִ֑י ה֖וּא בִּ/שְׁלוֹשָׁ֥ה הַ/גִּבֹּרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/012.yaml
  text: After him was Eleazar son of Dodo the Ahohite[a]; he was among the three mighty men.
translation:
  language: ta
  text: அவனுக்குப் பிறகு அகோகியனான தோதோவின் மகன் எலெயாசார் இருந்தான்; அவன் அந்த மூன்று மாவீரர்களில் ஒருவனாக இருந்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவன் மூன்று மாவீரர்களுள் இருந்தான்.” எபிரெயச் சொற்றொடர் அந்தச் சிறப்புக் குழுவில் உறுப்பினராக இருந்ததைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַחֲרָיו
  choice: அவனுக்குப் பிறகு
  rationale: வீரர்களின் பட்டியலில் வரும் வரிசையை இயல்பான நவீன தமிழில் குறிக்கிறது; தொடக்க இணைப்புச் சொல்லைத் தனியே மொழிபெயர்க்க வேண்டியதில்லை.
- source_word: אֶלְעָזָר
  choice: எலெயாசார்
  rationale: எபிரெய தனிப்பெயரின் ஒலிபெயர்ப்பு.
- source_word: בֶּן
  choice: மகன்
  rationale: இங்கு உடனடியான தந்தை–மகன் உறவே இயல்பான பொருள்.
- source_word: דּוֹדוֹ
  choice: தோதோ
  rationale: இவ்வசனத்தின் மசோரா உரையிலுள்ள பெயர் வடிவத்தை ஒலிபெயர்க்கிறது.
- source_word: הָ/אֲחוֹחִי
  choice: அகோகியனான
  rationale: குலம் அல்லது ஊர்சார் அடையாளத்தைக் குறிக்கும் எபிரெயப் பெயரடை வடிவத்தைத் தமிழில் இயல்பாக ஒலிபெயர்த்துக் காட்டுகிறது.
- source_word: הוּא
  choice: அவன்
  rationale: தொடர்ந்து வரும் முன்மொழித் தொடரை பயனிலையாகக் கொண்ட வாக்கியத்தில் சுயாதீனப் பதிலிப்பெயரைத் தெளிவாகக் காட்டுகிறது.
- source_word: בִּ/שְׁלוֹשָׁה
  choice: மூன்று ... ஒருவன்
  rationale: בְּ முன்னொட்டுடன் வரும் எண்ணிக்கை, அறியப்பட்ட மூவர் குழுவில் உறுப்பினராக இருந்ததைக் குறிக்கிறது; தமிழில் ‘மூவரில் ஒருவன்’ என்பது இயல்பான வெளிப்பாடு.
- source_word: הַ/גִּבֹּרִים
  choice: மாவீரர்கள்
  rationale: தாவீதின் சிறப்புப் போர்வீரர்களைக் குறிக்கும் அரைப்பட்டப்பெயர் தன்மையையும் வலிமைமிக்க வீரர் என்ற பொருளையும் சுருக்கமாகப் பாதுகாக்கிறது.
