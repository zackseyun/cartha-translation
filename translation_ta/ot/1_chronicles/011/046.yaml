translation_notes:
  register: நவீன செந்தரத் தமிழில், பெயர்ப்பட்டியலுக்கேற்ற சுருக்கமான மற்றும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் வரிசையும், யெரீபாய் மற்றும் யோஷவியா ஆகிய இருவரே எல்நாகாமின் மகன்கள் என்ற தொடர்பும் தெளிவாகப் பாதுகாக்கப்பட்டுள்ளன.
