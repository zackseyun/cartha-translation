base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/046.yaml
  text: Eliel the Mahavite[a], and Jeribai and Joshaviah, the sons of Elnaam[b], and Ithmah the Moabite.
translation:
  language: ta
  text: மகாவியனான[a] எலியேல், எல்நாமின் மகன்களான யெரீபாயும் யோஷவியாவும், மோவாபியனான யித்மாவும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மகாவியன்” என்பது எபிரெயப் பெயரின் ஒலிபெயர்ப்பு; அது குறிக்கும் ஊர் அல்லது குலம் எது என்பது உறுதியாகத் தெரியவில்லை.
    reason: cultural_note
lexical_decisions:
- source_word: אֱלִיאֵל
  choice: எலியேல்
  rationale: தனிப்பட்ட பெயர்; எபிரெய உச்சரிப்பை இயன்றவரைத் தெளிவாகப் பிரதிபலிக்கும் வகையில் ஒலிபெயர்க்கப்பட்டது.
- source_word: הַמַּחֲוִים
  choice: மகாவியனான
  rationale: இது உறுதியாக அடையாளம் காண முடியாத ஊர் அல்லது குலத்தைச் சுட்டும் பெயரடை. குறிப்பிட்ட இடத்தை ஊகிக்காமல் எபிரெய வடிவத்துக்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டது.
- source_word: וִירִיבַי
  choice: யெரீபாயும்
  rationale: தனிப்பட்ட பெயர்; தொடக்க எபிரெய யோத் எழுத்து ‘ய’ எனவும் நீண்ட ஈ உயிர் வெளிப்படுமாறும் ஒலிபெயர்க்கப்பட்டது. இணைப்புச் சொல் தமிழில் ‘-உம்’ எனத் தரப்பட்டது.
- source_word: וְיוֹשַׁוְיָה
  choice: யோஷவியாவும்
  rationale: தனிப்பட்ட பெயர்; שׁ ஒலி ‘ஷ’ என்றும் தொடக்க யோத் ‘ய’ என்றும் பிரதிபலிக்கப்பட்டது.
- source_word: בְּנֵי
  choice: மகன்களான
  rationale: இரண்டு பெயர்களையும் எல்நாகாமின் மகன்கள் என்று அடையாளப்படுத்தும் பன்மை இணைப்பு அமைப்பு இயல்பான தமிழில் தரப்பட்டது.
- source_word: אֶלְנָעַם
  choice: எல்நாகாம்
  rationale: தனிப்பட்ட பெயர்; நடுவிலுள்ள ע ஒலியைத் தமிழ் வாசிப்பில் முற்றிலும் மறைக்காமல் வழக்கமான ஒலிபெயர்ப்பு வடிவத்தில் தரப்பட்டது.
- source_word: וְיִתְמָה
  choice: யித்மா
  rationale: தனிப்பட்ட பெயர்; எபிரெய தொடக்க யோத் ‘ய’ என நேரடியாகப் பிரதிபலிக்கப்பட்டது.
- source_word: הַמּוֹאָבִי
  choice: மோவாபியனான
  rationale: மோவாபைச் சேர்ந்தவர் என்பதைக் காட்டும் அடையாளப் பெயரடை; எபிரெய வரையறைச் சுட்டின் தன்மையைத் தக்கவைக்கும் விதத்தில் யித்மாவுடன் இணைக்கப்பட்டது.
