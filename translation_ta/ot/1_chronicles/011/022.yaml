  text: בְּנָיָ֨ה בֶן יְהוֹיָדָ֧ע בֶּן אִֽישׁ חַ֛יִל רַב פְּעָלִ֖ים מִֽן קַבְצְאֵ֑ל ה֣וּא הִכָּ֗ה אֵ֣ת שְׁנֵ֤י אֲרִיאֵל֙ מוֹאָ֔ב וְ֠/הוּא יָרַ֞ד וְ/הִכָּ֧ה אֶֽת הָ/אֲרִ֛י בְּ/ת֥וֹךְ הַ/בּ֖וֹר בְּ/י֥וֹם הַ/שָּֽׁלֶג־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/022.yaml
  text: Benaiah son of Jehoiada[a], son of a mighty man, a man of many deeds, from Kabzeel—he struck down the two heroes of Moab. He also went down and struck down the lion in the midst of a pit on a snowy day.
translation:
  language: ta
  text: யெகோயாதாவின் மகனான பெனாயா, கப்செயேலைச் சேர்ந்த பராக்கிரமமிக்க ஒருவரின் மகன்; அவன் பல வீரச்செயல்கள் புரிந்தவன். மோவாபைச் சேர்ந்த இரண்டு மாவீரர்களை[a] அவன் வீழ்த்தினான். மேலும், பனி பெய்த ஒரு நாளில் ஒரு குழிக்குள் இறங்கி, அதன் நடுவில் இருந்த சிங்கத்தையும் வீழ்த்தினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மோவாபைச் சேர்ந்த இரண்டு மாவீரர்கள்’ என்று மொழிபெயர்க்கப்பட்டுள்ள எபிரெயச் சொற்றொடரின் பொருள் உறுதியில்லை. இதை ‘மோவாபைச் சேர்ந்த அரியேலின் இரண்டு மகன்கள்,’ ‘மோவாபின் இரண்டு அரியேல்கள்,’ அல்லது ‘மோவாபைச் சேர்ந்த சிங்கம் போன்ற இரண்டு வீரர்கள்’ என்றும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: בֶן אִישׁ חַיִל
  choice: பராக்கிரமமிக்க ஒருவரின் மகன்
  rationale: בן என்பதன் ‘மகன்’ என்ற உறவையும், איש חיל என்பதன் வலிமை மற்றும் போர்த்திறன் சார்ந்த பொருளையும் இயல்பான தமிழில் காக்கிறது.
- source_word: רַב פְּעָלִים
  choice: பல வீரச்செயல்கள் புரிந்தவன்
  rationale: சொல்லளவில் ‘பல செயல்களையுடையவன்’; போர்வீரர்களின் பட்டியல் என்ற சூழலில் குறிப்பிடத்தக்க வீரச்செயல்களைக் குறிக்கும் இயல்பான மொழிபெயர்ப்பு.
- source_word: מִן קַבְצְאֵל
  choice: கப்செயேலைச் சேர்ந்த
  rationale: מן இங்கு பிறப்பிடம் அல்லது சொந்த ஊரைக் குறிக்கிறது; ‘சேர்ந்த’ என்பது நவீன தமிழில் இயல்பானது.
- source_word: הִכָּה
  choice: வீழ்த்தினான்
  rationale: נכה என்பது அடித்தல், தாக்குதல், முறியடித்தல் அல்லது கொல்லுதல் எனப் பரந்த பொருள் உடையது. இவ்வீரச்செயல் சூழலில் ‘வீழ்த்தினான்’ வன்முறையான முடிவைக் காட்டுகிறது; ஆனால் ‘கொன்றான்’ என்று தேவையின்றி குறுக்குவதில்லை.
- source_word: שְׁנֵי אֲרִיאֵל מוֹאָב
  choice: மோவாபைச் சேர்ந்த இரண்டு மாவீரர்களை
  rationale: אֲרִיאֵל இங்கு தெளிவற்றது; ‘சிங்கம் போன்ற வீரர்கள்’ என்ற பொருள் சாத்தியமானதால், வாசிக்க இயல்பாக ‘மாவீரர்கள்’ என முதன்மை உரையில் தரப்பட்டு, மற்ற சாத்தியங்கள் அடிக்குறிப்பில் காக்கப்படுகின்றன.
- source_word: יָרַד
  choice: குழிக்குள் இறங்கி
  rationale: ‘இறங்கினான்’ என்ற அடிப்படைப் பொருளைத் தக்கவைத்து, அடுத்துள்ள குழி என்ற இடத்தோடு தமிழில் இயல்பாக இணைக்கிறது.
- source_word: הָאֲרִי
  choice: சிங்கம்
  rationale: இந்த இடத்தில் பெயர்ச்சொல் தெளிவாகச் சிங்கத்தைக் குறிக்கிறது.
- source_word: בְּתוֹךְ הַבּוֹר
  choice: குழியின் நடுவில்
  rationale: בתוך என்பதன் ‘உள்ளே/நடுவில்’ என்ற இடப்பொருளையும், בור என்பதன் ‘குழி’ என்ற படிமத்தையும் காக்கிறது.
- source_word: בְּיוֹם הַשָּׁלֶג
  choice: பனி பெய்த ஒரு நாளில்
  rationale: சொல்லளவிலான ‘பனியின் நாளில்’ என்பதை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: אֲרִיאֵל מוֹאָב என்பதன் தெளிவற்ற பொருள்
  choice: முதன்மை உரையில் ‘மோவாபைச் சேர்ந்த இரண்டு மாவீரர்கள்’
  alternative: ‘மோவாபைச் சேர்ந்த அரியேலின் இரண்டு மகன்கள்’, ‘மோவாபின் இரண்டு அரியேல்கள்’, அல்லது ‘மோவாபைச் சேர்ந்த சிங்கம் போன்ற இரண்டு வீரர்கள்’
  rationale: எபிரெயச் சொற்றொடர் பெயரையா, பட்டத்தையா, சிங்க உருவகத்தையா குறிக்கிறது என்பது உறுதியில்லை. ஒரு விளக்கத்தை இறுதியானதாக ஆக்காமல், வாசிக்க இயல்பான சாத்தியத்தை உரையில் வைத்து உண்மையான தெளிவின்மையை அடிக்குறிப்பில் வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க தமிழ் பயன்படுத்தப்பட்டுள்ளது. போர்வீரர் பட்டியலுக்கேற்ற வகையில் ‘பராக்கிரமமிக்க’, ‘வீரச்செயல்கள்’, ‘வீழ்த்தினான்’ ஆகிய சொற்கள் தேர்ந்தெடுக்கப்பட்டுள்ளன. முதல் வாக்கியத்தில் உள்ள வம்ச/விளக்கத் தொடரின் எபிரெய அமைப்பு நெருக்கமாகக் காக்கப்பட்டுள்ளது; אֲרִיאֵל என்பதன் உண்மையான தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
