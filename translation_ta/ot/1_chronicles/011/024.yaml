base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/024.yaml
  text: These things Benaiah son of Jehoiada did[a], and he had a name among the three mighty men.
translation:
  language: ta
  text: யெஹோயாதாவின் மகன் பெனாயா இவற்றைச் செய்தான்; அந்த மூன்று மாவீரர்களிடையே அவனுக்குப் பெயர் இருந்தது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அந்த மூன்று மாவீரர்களிடையே அவனுக்குப் புகழ் இருந்தது.’ எபிரெயத்தில் சொல்லுக்குச் சொல், ‘அவனுக்குப் பெயர் இருந்தது.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה עָשָׂה
  choice: இவற்றைச் செய்தான்
  rationale: முன்பு விவரிக்கப்பட்ட பெனாயாவின் வீரச்செயல்களைச் சுட்டும் சுருக்கமான தொடர்; எபிரெயச் சொல்லமைப்பின் நேரடியான பொருளையும் இயல்பான தமிழையும் காக்கிறது.
- source_word: בְּנָיָהוּ בֶּן יְהוֹיָדָע
  choice: யெகோயாதாவின் மகன் பெனாயா
  rationale: தந்தை–மகன் உறவை இயல்பான தமிழில் தருகிறது; பெயர்கள் எபிரெய உச்சரிப்பை அணுகிய முறையில் ஒலிபெயர்க்கப்பட்டுள்ளன.
- source_word: וְלוֹ שֵׁם
  choice: அவனுக்குப் பெயர் இருந்தது
  rationale: எபிரெய மொழியின் நேரடியான ‘அவனுக்கு ஒரு பெயர் இருந்தது’ என்ற மரபுத்தொடரைப் பாதுகாக்கிறது; இங்கு ‘பெயர்’ என்பது புகழ் அல்லது நற்பெயரைக் குறிக்கிறது.
- source_word: בִּשְׁלוֹשָׁה הַגִּבֹּרִים
  choice: அந்த மூன்று மாவீரர்களிடையே
  rationale: בְּ என்பதை இங்கு ஒரு குழுவினரிடையேயான அங்கீகாரம் அல்லது நிலை எனக் கொண்டு ‘இடையே’ என்று வழங்குகிறது. הַגִּבֹּרִים என்பது தாவீதின் சிறப்புப் போர்வீரர்களைக் குறிக்கும் சூழலில் ‘மாவீரர்கள்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘அவனுக்குப் பெயர் இருந்தது’ என்ற எபிரெய மரபுத்தொடர் முதன்மை உரையில் காக்கப்பட்டு, அதன் ‘புகழ் பெற்றிருந்தான்’ என்ற பொருள் அடிக்குறிப்பில் தெளிவுபடுத்தப்பட்டுள்ளது.
