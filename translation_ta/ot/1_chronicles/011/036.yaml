translation_notes:
  register: நவீன நிலையான தமிழில், பட்டியல் நடைக்கு ஏற்ற சுருக்கமானதும் கண்ணியமானதுமான மொழிநடை பயன்படுத்தப்பட்டது. அறியப்படாத ஊர்/குலப் பெயர்கள் ஊகமாக மாற்றப்படாமல் தமிழில் ஒலிப்பெயர்க்கப்பட்டன; இரு அடைமொழிகளும் இயல்பான ‘-ஆன’ அமைப்பில் வழங்கப்பட்டன. எல்லா அடிக்குறிப்பு சுட்டிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
