- source_word: אֲחִיָּה
  choice: அகியா
  rationale: இது ஓர் ஆட்பெயர். எபிரெய உச்சரிப்பை இயல்பான தமிழில் பிரதிபலிக்கும் வகையில் எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: הַפְּלֹנִי
  choice: பெலோனியனான
  rationale: ஊர் அல்லது குலச் சார்பைக் குறிக்கும் அடைமொழி. இவ்வசனத்தின் மசோரா உரையிலுள்ள வடிவமே முதன்மை உரையில் பின்பற்றப்பட்டது.
