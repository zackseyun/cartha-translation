base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/007.yaml
  text: David lived in the stronghold[a]; therefore they called it the City of David.
translation:
  language: ta
  text: தாவீது அந்த அரணில்[a] குடியிருந்தார்; ஆகையால் அதற்கு “தாவீதின் நகரம்” என்று பெயரிட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கோட்டையில்.” எபிரெயச் சொல் பாதுகாப்புக்காக வலுப்படுத்தப்பட்ட அரணைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: குடியிருந்தார்
  rationale: ישׁב என்பதன் அடிப்படைப் பொருள் ‘உட்கார்’ என்றாலும், ஓர் இடத்துடன் வரும் இக்கதைச் சூழலில் அது அங்கே வசிப்பதையோ குடியேறுவதையோ குறிக்கிறது. ‘குடியிருந்தார்’ என்பது தாவீது கைப்பற்றிய இடத்தைத் தமது இருப்பிடமாக்கியதைக் இயல்பாகத் தெரிவிக்கிறது.
- source_word: בַּמְצָד
  choice: அந்த அரணில்
  rationale: מְצָד என்பது பாதுகாப்புக்காக வலுப்படுத்தப்பட்ட இடத்தைக் குறிக்கிறது. ‘அரண்’ அதன் இராணுவப் பாதுகாப்புத் தன்மையைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது; בְּ முன்னொட்டு ‘-இல்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: עַל כֵּן
  choice: ஆகையால்
  rationale: இச்சொற்றொடர் முந்தைய நிகழ்வின் விளைவைக் காட்டுகிறது. ‘ஆகையால்’ காரண–விளைவு தொடர்பைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: קָרְאוּ לוֹ
  choice: அதற்கு … என்று பெயரிட்டார்கள்
  rationale: எபிரெய வடிவம் செயப்பாட்டு பன்மையில் உள்ளது; பெயரிடும் சூழலில் לּוֹ உடன் வரும் קרא, ஓர் இடத்திற்கு ஒரு பெயரை வழங்குவதைக் குறிக்கிறது. தமிழில் ‘அதற்கு … என்று பெயரிட்டார்கள்’ என்பது இதை இயல்பாகவும் தெளிவாகவும் கூறுகிறது.
- source_word: עִיר דָּוִיד
  choice: தாவீதின் நகரம்
  rationale: இது வேதாகமப் பயன்பாட்டில் நிலையான இடப்பெயர். உடைமைத் தொடர்பைக் காட்டும் எபிரெய இணைப்பை ‘தாவீதின் நகரம்’ நேரடியாகப் பாதுகாக்கிறது.
