translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘முப்பதின்மர்’ என்பது சாதாரண எண்ணிக்கையாக மட்டுமல்லாமல் சிறப்பு வீரர் குழுவின் பெயராக வாசிக்கப்படும்படி அமைக்கப்பட்டது; போரியல் சொற்றொடரின் மூலமொழிச் சுருக்கமும் அடிக்குறிப்பின் உதவியுடன் பாதுகாக்கப்பட்டது.
