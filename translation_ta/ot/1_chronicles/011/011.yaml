  text: וְ/אֵ֛לֶּה מִסְפַּ֥ר הַ/גִּבֹּרִ֖ים אֲשֶׁ֣ר לְ/דָוִ֑יד יָשָׁבְעָ֣ם בֶּן חַכְמוֹנִ֗י רֹ֚אשׁ ה/שלושים הֽוּא עוֹרֵ֧ר אֶת חֲנִית֛/וֹ עַל שְׁלֹשׁ מֵא֥וֹת חָלָ֖ל בְּ/פַ֥עַם אֶחָֽת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/011.yaml
  text: 'And these are the number of David’s mighty men: Jashobeam son of Hachmoni[a], the chief of the Thirty; he wielded his spear against three hundred slain in one encounter.'
translation:
  language: ta
  text: 'தாவீதுக்குரிய மாவீரர்களின் எண்ணிக்கை இதுவே: ஹக்மோனியின் மகன் யாஷொபெயாம், முப்பதினரின் தலைவர். ஒரே சந்தர்ப்பத்தில் அவன் தன் ஈட்டியை முன்னூறு பேருக்கு எதிராக ஓங்கி, அவர்களை வீழ்த்தினான்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தன் ஈட்டியை உயர்த்தினான்,” “தன் ஈட்டியைச் சுழற்றினான்,” அல்லது “தன் ஈட்டியைப் பயன்படுத்தினான்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொற்றொடர் சுருக்கமானது; ஈட்டியால் செய்யப்பட்ட செயலும் அது நிகழ்ந்த ஒரே சந்தர்ப்பமும் மொழிபெயர்ப்புகளில் வெவ்வேறு விதமாக வெளிப்படுத்தப்படுகின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִסְפַּר
  choice: பட்டியல்
  rationale: இச்சொல்லின் அடிப்படைப் பொருள் ‘எண்ணிக்கை’ என்றாலும், இங்கு மாவீரர்களின் பெயர்ப்பட்டியலை அறிமுகப்படுத்துவதால் நவீன தமிழில் ‘பட்டியல்’ இயல்பாகவும் சூழலுக்குப் பொருத்தமாகவும் உள்ளது.
- source_word: הַגִּבֹּרִים
  choice: மாவீரர்கள்
  rationale: போராற்றலும் வலிமையும் பெற்ற வீரர்களைக் குறிக்கும் இச்சொல்லுக்கு ‘மாவீரர்கள்’ இயல்பான, கண்ணியமான தமிழ் இணை.
- source_word: אֲשֶׁר לְדָוִיד
  choice: தாவீதுக்குரிய
  rationale: לְ குறிக்கும் உடைமை அல்லது தொடர்பைத் தெளிவாகச் சொல்லி, இவர்கள் தாவீதோடு தொடர்புடைய வீரர்கள் என்பதைக் காட்டுகிறது.
- source_word: יָשָׁבְעָם בֶּן חַכְמוֹנִי
  choice: ஹக்மோனியின் மகன் யாஷொபெயாம்
  rationale: எபிரெயப் பெயர்களின் ஒலியைத் தமிழில் எழுத்துப்பெயர்த்து, வெளிப்படையான தந்தை–மகன் உறவை இயல்பான தமிழ் வரிசையில் அளிக்கிறது.
- source_word: רֹאשׁ הַשלושים
  choice: முப்பதின்மரின் தலைவர்
  rationale: רֹאשׁ பதவி அல்லது முன்னணியைக் குறிக்கும் இடத்தில் ‘தலைவர்’ இயல்பானது; ‘முப்பதின்மர்’ என்பது குறிப்பிட்ட சிறப்பு வீரர் குழுவின் பெயராகப் பாதுகாக்கப்படுகிறது.
- source_word: עוֹרֵר אֶת חֲנִיתוֹ
  choice: தன் ஈட்டியை ஓங்கினான்
  rationale: עורר என்பதன் நேர்ப்பொருள் ‘எழுப்புதல்/தூண்டுதல்’; ஈட்டியுடன் வரும் போரியல் வழக்கில் ‘ஓங்கினான்’ செயலை இயல்பாக வெளிப்படுத்துகிறது, ஆனால் தாக்குதலின் துல்லிய வடிவத்தை மிகையாக வரையறுக்கவில்லை.
- source_word: עַל שְׁלֹשׁ מֵאוֹת חָלָל
  choice: கொல்லப்பட்ட முந்நூறு பேருக்கு எதிராக
  rationale: עַל என்பதன் எதிர்தாக்குதல் நோக்கையும் חָלָל என்பதன் ‘கொல்லப்பட்டவர்’ என்ற பொருளையும் பாதுகாத்து, எபிரெய வாக்கியத்தின் சுருக்கமான போரியல் அமைப்பை முடிந்தவரை நிலைநிறுத்துகிறது.
- source_word: בְּפַעַם אֶחָת
  choice: ஒரே மோதலில்
  rationale: சொல்லுக்கு நேராக ‘ஒரே சமயத்தில்/ஒரே சந்தர்ப்பத்தில்’ எனப் பொருள்; போர்ச் சூழலில் ‘ஒரே மோதலில்’ என்பது ஒரே போர்நிகழ்வைக் குறிக்கும் இயல்பான தமிழ்.
