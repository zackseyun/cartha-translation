  to: 'தாவீதுக்குரிய மாவீரர்களின் எண்ணிக்கை இதுவே: ஹக்மோனியின் மகன் யாஷொபெயாம், முப்பதினரின் தலைவர். ஒரே சந்தர்ப்பத்தில் அவன் தன் ஈட்டியை முன்னூறு பேருக்கு எதிராக ஓங்கி, அவர்களை வீழ்த்தினான்.[a]'
