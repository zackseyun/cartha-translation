  source_fidelity: மூல எபிரேயத்தின் நிகழ்வுவரிசை, “இஸ்ரயேலர் அனைவரும்” என்ற கூட்டுப்பொருள், எப்ரோனில் தாவீதிடம் கூடிவருதல், மற்றும் எலும்பு–சதை உறவுமுறை உருவகம் ஆகியவை துல்லியமாகப் பாதுகாக்கப்பட்டுள்ளன. “எப்ரோனிலிருந்த தாவீதிடம்” என்பது எபிரேயத்தின் ‘எப்ரோனுக்கு/எப்ரோனில்’ என்ற இடச்சுட்டலையும் சூழலின் பொருளான தாவீது அங்கே இருந்ததையும் இயல்பாக வெளிப்படுத்துகிறது.
