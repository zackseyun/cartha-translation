source:
  edition: WLC
  text: וַ/יִּקָּבְצ֧וּ כָֽל יִשְׂרָאֵ֛ל אֶל דָּוִ֖יד חֶבְר֣וֹנָ/ה לֵ/אמֹ֑ר הִנֵּ֛ה עַצְמְ/ךָ֥ וּֽ/בְשָׂרְ/ךָ֖ אֲנָֽחְנוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/001.yaml
  text: Then all Israel gathered to David at Hebron, saying, “Look, we are your bone and your flesh.”
translation:
  language: ta
  text: பின்பு இஸ்ரயேலர் அனைவரும் எப்ரோனிலிருந்த தாவீதிடம் ஒன்றுகூடி வந்து, “இதோ, நாங்கள் உங்கள் எலும்பும் உங்கள் சதையுமாயிருக்கிறோம்” என்றார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקָּבְצוּ
  choice: ஒன்றுகூடி வந்து
  rationale: வினைச்சொல்லின் கூடிவருதல் என்ற இயக்கத்தையும், தாவீதிடம் அவர்கள் திரண்டதையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: כָל יִשְׂרָאֵל
  choice: இஸ்ரயேலர் அனைவரும்
  rationale: கூட்டாகிய இஸ்ரயேல் மக்களைக் குறிக்கும் இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: חֶבְרוֹנָה
  choice: எப்ரோனிலிருந்த
  rationale: 'இலக்கைக் குறிக்கும் எபிரேய திசைமுற்றைச் சூழலுக்கேற்ற தமிழில் வெளிப்படுத்துகிறது: எப்ரோனில் இருந்த தாவீதிடம் அவர்கள் வந்தனர்.'
- source_word: הִנֵּה
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் மூலமொழியின் உரையாடல் சுட்டுச்சொல்லைத் தக்கவைக்கிறது.
- source_word: עַצְמְךָ וּבְשָׂרְךָ
  choice: உங்கள் எலும்பும் உங்கள் சதையும்
  rationale: உறவு, ஒரே மக்கள் தன்மை ஆகியவற்றைக் குறிக்கும் செமித்திய மரபுத்தொடரை விளக்கிப் பரப்பாமல் நேரடியாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: “உங்கள் எலும்பும் உங்கள் சதையும்” என்ற உறவுமுறை மரபுத்தொடர்
  choice: உருவகத்தை அப்படியே தக்கவைத்தல்
  alternative: “நாங்கள் உங்கள் சொந்த இனத்தார்” என்று பொருள் விளக்கி மொழிபெயர்த்தல்
  rationale: மூலத்தின் உடற்கூறு உருவகத்தையும் அதன் உடன்பிறப்பு/மக்கள் ஒற்றுமை சார்ந்த செறிவையும் பாதுகாக்கிறது; ஒரே விளக்கத்துக்குள் பொருளைச் சுருக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை. தாவீதிடம் பேசும் கூட்டத்தின் மரியாதைப் பன்மையை வெளிப்படுத்த “உங்கள்” பயன்படுத்தப்பட்டது; மூலத்தில் ஒருமை இரண்டாம் நபர் இருப்பினும், தமிழில் இது இயல்பான மரியாதை வழக்கு.
