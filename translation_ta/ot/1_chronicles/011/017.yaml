  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. நேரடி வினா வடிவம் மூலத்தின் அமைப்பைத் தக்கவைக்கிறது; அதன் விருப்பப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
