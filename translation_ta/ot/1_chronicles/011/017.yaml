base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/017.yaml
  text: And David longed and said[b][a], “Who will give me water to drink from the well of Bethlehem that is by the gate?”
translation:
  language: ta
  text: தாவீது ஏக்கங்கொண்டு, “பெத்லெகேமின் நகரவாசலருகே உள்ள கிணற்றிலிருந்து[b] எனக்குத் தண்ணீர் குடிக்கக் கொடுப்பவர் யார்?[a]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதை இன்னும் இயல்பான முறையில், “பெத்லெகேமின் நகரவாசலருகே உள்ள கிணற்றிலிருந்து யாராவது எனக்குத் தண்ணீர் குடிக்கக் கொடுத்தால் எவ்வளவு நன்றாயிருக்கும்!” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘கிணறு’ என்று மொழிபெயர்க்கப்பட்டுள்ள எபிரெயச் சொல் ‘நீர்த்தேக்கம்’ அல்லது ‘குழி’ என்றும் பொருள்படலாம்; இங்கு அது குடிநீர் கிடைக்கும் ஓர் இடத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ויתאו
  choice: ஏக்கமுற்று
  rationale: התאו என்ற வினை தீவிரமான விருப்பத்தையோ ஏக்கத்தையோ குறிக்கிறது. ‘ஏக்கமுற்று’ என்பது அதன் வலிமையை இயல்பான, கண்ணியமான தமிழில் தருகிறது.
- source_word: מי
  choice: யார்?
  rationale: எபிரெய உரையின் நேரடி வினா வடிவத்தைப் பாதுகாக்கிறது; சூழலில் இது தாவீதின் ஆழ்ந்த விருப்பத்தையும் வெளிப்படுத்துகிறது.
- source_word: ישקני
  choice: எனக்குத் ... குடிக்கக் கொடுப்பவர்
  rationale: שקה என்பதன் ஹிஃபில் வடிவத்திலுள்ள ‘குடிக்கக் கொடு’ என்ற காரணவினைப் பொருளைப் பாதுகாக்கிறது.
- source_word: מים
  choice: தண்ணீர்
  rationale: பொதுவழக்கிலும் நவீனத் தமிழிலும் இயல்பாகப் புரியும் நேரடியான பொருள்.
- source_word: מבּור
  choice: கிணற்றிலிருந்து
  rationale: בור என்பது குழி, நீர்த்தேக்கம் அல்லது கிணறு எனப் பொருள்படலாம்; இங்கு குடிநீர் எடுக்கப்படும் அறியப்பட்ட இடம் என்பதால் ‘கிணறு’ சூழலுக்குப் பொருத்தமானது.
- source_word: בית לחם
  choice: பெத்லெகேம்
  rationale: இடப்பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: אשר בשער
  choice: வாசலருகே உள்ள
  rationale: கிணறு வாசலைச் சார்ந்து அமைந்திருந்ததை இயல்பான தமிழில் தெரிவிக்கிறது; ‘வாசலில்’ என்று துல்லியமற்ற இடக்குறிப்பை உருவாக்குவதைத் தவிர்க்கிறது.
