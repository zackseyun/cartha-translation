translation_notes:
  register: நவீனத் தரத் தமிழில் சுருக்கமான பட்டியல் நடையும் கண்ணியமான மொழிநடையும் பேணப்பட்டுள்ளன. எபிரெய வாக்கியத்தின் பெயர்–உறவு அமைப்பு தமிழில் இயல்பாக வாசிக்கும்படி உறவுச் சொற்றொடர் பெயருக்கு முன் வைக்கப்பட்டுள்ளது; மூலத்தின் இரு பட்டியல் உறுப்புகளும் அரைப்புள்ளியால் தெளிவுபடுத்தப்பட்டுள்ளன.
