  text: אֲחִיאָ֧ם בֶּן שָׂכָ֛ר הַ/הֲרָרִ֖י אֱלִיפַ֥ל בֶּן אֽוּר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/035.yaml
  text: Ahiam son of Sachar the Hararite[a], Eliphal son of Ur.
translation:
  language: ta
  text: ஹராரியனான சாகாரின் மகன்[a] அகியாம்; ஊரின் மகன் எலிபால்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு வரும் ஒவ்வொரு ‘மகன்’ என்பதும் ‘வழிவந்தவர்’ என்றும் பொருள்படக்கூடும்; எனினும், இந்தப் படைவீரர் பட்டியலில் நேரடி மகன் என்பதே மிகவும் இயல்பான பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲחִיאָם
  choice: அகியாம்
  rationale: எபிரெய தனிப்பெயரின் ஒலியை நவீனத் தமிழில் இயல்பாகக் குறிக்கும் ஒலிபெயர்ப்பு.
- source_word: בֶּן
  choice: மகன்
  rationale: இந்தப் படைவீரர் பட்டியலின் சூழலில் நேரடியான தந்தை–மகன் உறவே மிகவும் இயல்பான பொருள்; பரந்த வம்சவழிப் பொருளும் சாத்தியம் என்பதால் அடிக்குறிப்பில் அது பாதுகாக்கப்படுகிறது.
- source_word: שָׂכָר
  choice: சாகார்
  rationale: שָׂכָר என்ற தனிப்பெயரின் எபிரெய உச்சரிப்பை அண்மித்த தமிழ் ஒலிபெயர்ப்பு.
- source_word: הֲרָרִי
  choice: ஹராரியன்
  rationale: இது ஓர் இன அல்லது புவியிடச் சார்பைக் குறிக்கும் பெயரடை வடிவம்; அதன் அடிப்படை இடப்பெயரையோ ‘மலைவாசி’ என்ற பொருளையோ ஊகித்து நிர்ணயிக்காமல் வடிவத்தைப் பாதுகாக்கிறது.
- source_word: אֱלִיפַל
  choice: எலிபால்
  rationale: எபிரெய தனிப்பெயரைத் தமிழில் தெளிவாகக் குறிக்கும் ஒலிபெயர்ப்பு.
- source_word: אֽוּר
  choice: ஊர்
  rationale: இங்கு இது மெசொப்பொத்தாமிய நகரத்தின் பெயரல்ல, ஒருவரின் தனிப்பெயர்; மூல ஒலிப்பை நேரடியாகப் பிரதிபலிக்கும் ஒலிபெயர்ப்பு.
