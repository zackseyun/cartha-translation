base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/023.yaml
  text: And he struck down the Egyptian[a], a man five cubits tall. In the Egyptian’s hand was a spear like a weaver’s beam, and he went down to him with a staff, snatched the spear from the Egyptian’s hand[c][b], and killed him with his own spear.
translation:
  language: ta
  text: அவன் ஐந்து முழம் உயரமுள்ள எகிப்தியனை[a] வீழ்த்தினான். அந்த எகிப்தியனின் கையில் நெசவுத் தறியின் பாவுமரத்தைப் போன்ற ஓர் ஈட்டி இருந்தது. அவன் ஒரு தடியுடன்[b] அவனை நோக்கி இறங்கிச் சென்று, அந்த எகிப்தியனின் கையிலிருந்த ஈட்டியைப் பறித்து, அவனுடைய சொந்த ஈட்டியாலேயே அவனைக் கொன்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்சொல்லாக, “அளவுடைய ஒரு மனிதன்” என்று உள்ளது; இது அசாதாரண உடலளவு அல்லது உயரமுள்ளவனைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “ஒரு கோலுடன்” அல்லது “ஒரு தண்டுடன்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכָּה
  choice: வீழ்த்தினான்
  rationale: நכה என்பது பொதுவாக அடித்தலைக் குறிக்கலாம்; இப்போர் சூழலில் ‘வீழ்த்தினான்’ என்பது வன்முறைச் செயலைக் காட்டுகிறது, அதேவேளை பின்னர் வரும் வெளிப்படையான ‘கொன்றான்’ என்பதுடன் தேவையற்ற மீளுரையைத் தவிர்க்கிறது.
- source_word: הָאִישׁ הַמִּצְרִי
  choice: எகிப்தியனை
  rationale: தமிழில் தேசிய அடையாளப் பெயரே அந்த மனிதனைக் இயல்பாகக் குறிக்கிறது; ‘எகிப்திய மனிதனை’ என்பது தேவையற்ற மீளுரை.
- source_word: אִישׁ מִדָּה חָמֵשׁ בָּאַמָּה
  choice: ஐந்து முழம் உயரமுள்ள
  rationale: ‘அளவுள்ள மனிதன்’ என்ற எபிரெயச் சொற்றொடரைத் தொடர்ந்து வரும் அளவுடன் இணைத்து, அசாதாரண உயரத்தை நவீன தமிழில் தெளிவாகக் கூறுகிறது.
- source_word: חֲנִית
  choice: ஈட்டி
  rationale: பாவுமரத்துடன் ஒப்பிடப்படும் நீண்ட குத்தாயுதத்துக்கு ‘ஈட்டி’ இயல்பான, பொதுவாகப் புரியும் தமிழ் சொல்.
- source_word: כִּמְנוֹר אֹרְגִים
  choice: நெசவாளரின் பாவுமரத்தைப் போன்ற
  rationale: מְנוֹר என்பது நெசவுத்தறியின் பாவுக்குரிய கனமான மரக்கட்டையைக் குறிக்கிறது; ‘பாவுமரம்’ ஒப்புமையின் பொருளைத் துல்லியமாகப் பாதுகாக்கிறது.
- source_word: וַיֵּרֶד אֵלָיו
  choice: அவனை நோக்கி இறங்கிச் சென்று
  rationale: ירד என்பதன் ‘இறங்குதல்’ என்ற இயக்கத்தைப் பாதுகாத்து, இலக்கை நோக்கிய நகர்வையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בַּשָּׁבֶט
  choice: ஒரு தடியுடன்
  rationale: שֵׁבֶט என்பதற்கு தடி, கோல், கதாயுதம் ஆகிய பொருள்கள் இருக்கலாம்; இங்கு ‘தடி’ குறைந்த விளக்கச் சுமையுடன் ஈட்டிக்கு எதிரான எளிய ஆயுதத்தைச் சுட்டுகிறது.
- source_word: וַיִּגְזֹל
  choice: பறித்து
  rationale: வலுக்கட்டாயமாகக் கைப்பற்றும் வேகமான போர்ச் செயலை ‘பறித்து’ தெளிவாகக் கூறுகிறது.
- source_word: וַיַּהַרְגֵהוּ
  choice: அவனைக் கொன்றான்
  rationale: இது மரணத்தை வெளிப்படையாகக் குறிக்கும் வினை; ‘கொன்றான்’ நவீன தமிழில் நேரடியானதும் துல்லியமானதும் ஆகும்.
- source_word: בַּחֲנִיתוֹ
  choice: அவனுடைய சொந்த ஈட்டியாலேயே
  rationale: பின்னொட்டு எகிப்தியனிடமிருந்து பறிக்கப்பட்ட ஈட்டியைக் குறிப்பதாக இயல்பாகப் புரிகிறது; ‘சொந்த...ஆலேயே’ போரின் எதிர்மறைத் திருப்பத்தைத் தெளிவாக்குகிறது.
