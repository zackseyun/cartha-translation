source:
  edition: WLC
  text: וְ/אַבְשַׁ֣י אֲחִֽי יוֹאָ֗ב ה֤וּא הָיָה֙ רֹ֣אשׁ הַ/שְּׁלוֹשָׁ֔ה וְ/הוּא֙ עוֹרֵ֣ר אֶת חֲנִית֔/וֹ עַל שְׁלֹ֥שׁ מֵא֖וֹת חָלָ֑ל ו/לא שֵׁ֖ם בַּ/שְּׁלוֹשָֽׁה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/020.yaml
  text: And Abishai[a], the brother of Joab, was chief of the Three. He brandished his spear against three hundred slain[c][b], and had a name among the Three.
translation:
  language: ta
  text: யோவாபின் சகோதரனான அபிசாய் அந்த மூவருக்குத் தலைவனாக இருந்தான்.[a] அவன் கொல்லப்பட்ட முந்நூறு பேருக்கு எதிராகத் தன் ஈட்டியை ஓங்கினான்.[b] அந்த மூவரிடையே அவன் பெயர்பெற்றிருந்தான்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில், ‘அந்த மூவர்.’ இணை நிகழ்வான 2 சாமுவேல் 23:18-இலும் அதைச் சுற்றியுள்ள வீரர்களின் பட்டியலிலும் ‘மூவர்,’ ‘முப்பது பேர்’ என்பவை தொடர்பாக உரை மற்றும் சூழல் சார்ந்த சிக்கல்கள் உள்ளன. இங்கு மசோரா எபிரெய உரையின் ‘மூவர்’ என்ற வாசிப்பு தக்கவைக்கப்பட்டுள்ளது.
    reason: textual_variant
  - marker: b
    text: எபிரெயை இன்னும் சொற்சொல்லாக, ‘கொல்லப்பட்ட முந்நூறு பேருக்கு எதிராகத் தன் ஈட்டியை ஓங்கினான்’ என மொழிபெயர்க்கலாம். ‘ஓங்கினான்’ என்பதற்கு ‘சுழற்றினான்’ அல்லது ‘கையில் ஏந்தினான்’ என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
  - marker: c
    text: எபிரெயில் சொற்சொல்லாக, ‘அவனுக்கு ஒரு பெயர் இருந்தது’; அதாவது, அவன் புகழ்பெற்றிருந்தான்.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאשׁ
  choice: தலைவன்
  rationale: இராணுவக் குழுவில் வகித்த தலைமை நிலையைக் குறிக்கும் இச்சொல்லுக்கு, நவீன தமிழில் இயல்பாகவும் சுருக்கமாகவும் ‘தலைவன்’ பொருந்துகிறது.
- source_word: הַשְּׁלוֹשָׁה / בַּשְּׁלוֹשָׁה
  choice: அந்த மூவர் / அந்த மூவரிடையே
  rationale: மசோரா எபிரெய உரையில் தெளிவாக உள்ள ‘மூவர்’ என்பதையே இணை இடத்தின் ‘முப்பது’ என்பதோடு ஒத்திசைக்காமல் முதன்மை உரையில் தக்கவைக்கிறது.
- source_word: עוֹרֵר אֶת־חֲנִיתוֹ
  choice: தன் ஈட்டியை ஓங்கி
  rationale: ‘ஈட்டியை எழுப்புதல்/தூண்டுதல்’ என்ற உயிரோட்டமான எபிரெயப் படிமத்தை, போர்ச் செயலை இயல்பாக உணர்த்தும் தமிழ்ச் சொல்லாக்கமாக வழங்குகிறது.
- source_word: עַל שְׁלֹשׁ מֵאוֹת חָלָל
  choice: முந்நூறு பேருக்கு எதிராக … அவர்களைக் கொன்றான்
  rationale: חָלָל என்பது ‘கொல்லப்பட்டவர்/குத்துண்டு வீழ்ந்தவர்’ என்று பொருள்படும். தமிழில் நிகழ்ச்சியின் விளைவைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்க வினை வடிவில் வழங்கப்பட்டுள்ளது; சொற்சொல்லான வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: שֵׁם
  choice: பெயர்பெற்றிருந்தான்
  rationale: ‘பெயர் இருந்தது’ என்ற எபிரெய மரபுத்தொடர் புகழையும் சிறப்பான நற்பெயரையும் குறிக்கிறது; ‘பெயர்பெற்றிருந்தான்’ அந்தப் பொருளை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: אַבְשַׁי
  choice: அபிசாய்
  rationale: தனிப்பெயர் தமிழில் வழக்கமான ஒலிபெயர்ப்பு வடிவில் தரப்படுகிறது.
- source_word: אֲחִי יוֹאָב
  choice: யோவாபின் சகோதரனான
  rationale: எபிரெய இணைப்பின் உறவைத் தெளிவாகவும் இயல்பான தமிழிலும் தெரிவிக்கிறது.
theological_decisions:
- issue: ‘மூவர்’ மற்றும் ‘முப்பது’ குறித்த உரைச்சிக்கல்
  choice: இவ்வசனத்தின் மசோரா உரையிலுள்ள ‘மூவர்’ என்பதைக் காத்தல்
  alternative: இணை வசனத்தையோ சூழலையோ பின்பற்றி ‘முப்பது பேர்’ என்று ஒத்திசைத்தல்
  rationale: மூல எபிரெயச் சான்று இங்கு ‘மூவர்’ என்றே வாசிக்கிறது. உரை மற்றும் சூழல் சார்ந்த சிக்கலை மறைத்து ஒத்திசைக்காமல், வாசிப்பை முதன்மை உரையில் காத்து அடிக்குறிப்பில் விளக்குவது பொருத்தமானது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் வரலாற்று-வீரவுரைக்கேற்ற கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘மூவர்’ என்ற சற்றே புதிரான குழுப்பெயர் விளக்கமின்றி மாற்றப்படாமல், அடிக்குறிப்பால் தெளிவுபடுத்தப்பட்டுள்ளது.
