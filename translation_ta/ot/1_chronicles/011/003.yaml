source:
  edition: WLC
  text: וַ֠/יָּבֹאוּ כָּל זִקְנֵ֨י יִשְׂרָאֵ֤ל אֶל הַ/מֶּ֨לֶךְ֙ חֶבְר֔וֹנָ/ה וַ/יִּכְרֹת֩ לָ/הֶ֨ם דָּוִ֥יד בְּרִ֛ית בְּ/חֶבְר֖וֹן לִ/פְנֵ֣י יְהוָ֑ה וַ/יִּמְשְׁח֨וּ אֶת דָּוִ֤יד לְ/מֶ֨לֶךְ֙ עַל יִשְׂרָאֵ֔ל כִּ/דְבַ֥ר יְהוָ֖ה בְּ/יַד שְׁמוּאֵֽל־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/003.yaml
  text: So all the elders of Israel came to the king at Hebron[a], and David made a covenant with them at Hebron before Yahweh. Then they anointed David king over Israel, according to the word of Yahweh by Samuel.
translation:
  language: ta
  text: இஸ்ரயேலின் மூப்பர்கள் அனைவரும் எப்ரோனில் அரசனிடம் வந்தார்கள். தாவீது எப்ரோனில் யாவேயின் முன்னிலையில் அவர்களுடன் ஓர் உடன்படிக்கை செய்தான். சாமுவேல் மூலம்[a] யாவே உரைத்த வார்த்தையின்படி, அவர்கள் தாவீதை இஸ்ரயேலின் அரசனாக அபிஷேகம் செய்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “சாமுவேலின் கையால்”; இது “சாமுவேல் மூலம்” அல்லது “சாமுவேல் வழியாக” என்று பொருள்படும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: זִקְנֵי
  choice: மூப்பர்கள்
  rationale: இஸ்ரயேலின் அங்கீகரிக்கப்பட்ட சமூக-அரசியல் பிரதிநிதிகளைக் குறிக்கும் வழக்கமான, குறிப்பான சொல்.
- source_word: הַמֶּלֶךְ
  choice: அரசன்
  rationale: எபிரெய உரை இங்கு தாவீதின் பெயரை அல்ல, திட்டவட்டமான அரசப் பட்டத்தையே பயன்படுத்துகிறது; அடுத்த வாக்கியம் அவரைத் தாவீது என்று அடையாளப்படுத்துகிறது.
- source_word: חֶבְרוֹנָה / בְּחֶבְרוֹן
  choice: எப்ரோனில் இருந்த / எப்ரோனில்
  rationale: முதல் வடிவம் எப்ரோனை நோக்கிய வருகையைக் குறித்தாலும், அரசன் அங்கே இருந்தான் என்பதை இயல்பான தமிழில் தெரிவிக்கிறது; இரண்டாவது வடிவம் உடன்படிக்கை செய்யப்பட்ட இடத்தை நேரடியாகக் குறிக்கிறது.
- source_word: וַיִּכְרֹת ... בְּרִית
  choice: ஓர் உடன்படிக்கை செய்தான்
  rationale: சொல்லுக்குச் சொல் ‘உடன்படிக்கையை வெட்டினான்’ என்ற எபிரெய மரபுத்தொடரை, அதன் பொருளைத் தெளிவாகத் தரும் இயல்பான நவீன தமிழில் மொழிபெயர்க்கிறது.
- source_word: לִפְנֵי יְהוָה
  choice: யாவேயின் முன்னிலையில்
  rationale: தெய்வீகச் சாட்சியின் முன் நிகழ்ந்த உடன்படிக்கையின் solemn/covenantal பொருளைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தலைப்பொன்றால் மாற்றாமல், எபிரெய வேதப்பெயரான יהוה-ஐத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: וַיִּמְשְׁחוּ
  choice: திருப்பொழிவு செய்தார்கள்
  rationale: அரசரை நிறுவும் சூழலில் எண்ணெய் ஊற்றி அபிஷேகம் செய்யும் குறிப்பான செயலைச் சுட்டும் மரியாதையான தமிழ் வேதாகமச் சொல்.
- source_word: לְמֶלֶךְ עַל יִשְׂרָאֵל
  choice: இஸ்ரயேலின் அரசனாக
  rationale: தாவீது இஸ்ரயேல்மீது அரசாள நியமிக்கப்பட்டதை இயல்பாகவும் துல்லியமாகவும் தெரிவிக்கிறது.
- source_word: כִּדְבַר יְהוָה
  choice: யாவே உரைத்த வார்த்தையின்படி
  rationale: דָבָר என்பதன் ‘வார்த்தை’ பொருளைப் பாதுகாப்பதோடு, தமிழில் இது தெய்வீக உரை என்பதைத் தெளிவாக்குகிறது.
- source_word: בְּיַד שְׁמוּאֵל
  choice: சாமுவேல் மூலம்
  rationale: சொல்லர்த்தமான ‘சாமுவேலின் கையால்’ என்பது இங்கு முகமை அல்லது இடைத்தரகுச் செயலைக் குறிக்கும் மரபுத்தொடர்; ‘மூலம்’ என்பது அதன் இயல்பான தமிழ் இணை.
theological_decisions:
- issue: יהוה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூல உரையிலுள்ள தனிப்பட்ட உடன்படிக்கைப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் ஒலிபெயர்த்து வழங்குகிறது.
- issue: בְּיַד שְׁמוּאֵל என்பதில் சாமுவேலின் பங்கு
  choice: சாமுவேல் மூலம்
  alternative: சாமுவேலின் கையால்
  rationale: சாமுவேல் செய்தியின் மூலாதாரம் என்று கூறாமல், யாவேயின் வார்த்தை சாமுவேல் வழியாகத் தெரிவிக்கப்பட்டது என்ற முகமைப் பொருளைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம வரலாற்றுரைக்கு ஏற்ற கண்ணியமான நடையிலும் அமைக்கப்பட்டது. ‘மூப்பர்கள்’, ‘உடன்படிக்கை’, ‘திருப்பொழிவு’ போன்ற நிலைபெற்ற சொற்கள் துல்லியத்திற்காக வைக்கப்பட்டுள்ளன.
