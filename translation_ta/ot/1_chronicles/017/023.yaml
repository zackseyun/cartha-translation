  text: וְ/עַתָּ֣ה יְהוָ֔ה הַ/דָּבָ֗ר אֲשֶׁ֨ר דִּבַּ֤רְתָּ עַֽל עַבְדְּ/ךָ֙ וְ/עַל בֵּית֔/וֹ יֵאָמֵ֖ן עַד עוֹלָ֑ם וַ/עֲשֵׂ֖ה כַּ/אֲשֶׁ֥ר דִּבַּֽרְתָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/023.yaml
  text: And now[a], Yahweh, let the word that you have spoken concerning your servant and concerning his house be established forever, and do as you have spoken.
translation:
  language: ta
  text: இப்போது, யாவே, உமது அடியானைக் குறித்தும் அவனுடைய வீட்டைக்[a] குறித்தும் நீர் சொன்ன வார்த்தை என்றென்றும் உறுதியாகட்டும்; நீர் சொன்னபடியே செய்வீராக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனுடைய அரச வம்சத்தை” அல்லது “அவனுடைய குடும்ப வழியை.” இந்த உடன்படிக்கைச் சூழலில் எபிரெய மொழியிலுள்ள “வீடு” என்பது குடும்பம், வம்சவழி அல்லது அரச மரபைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: இப்போது
  rationale: முந்தைய துதியிலிருந்து தாவீதின் விண்ணப்பத்துக்கு மாறும் உரையோட்டத்தை இயல்பான நவீனத் தமிழில் காட்டுகிறது; எபிரெய இணைப்பைத் தமிழில் தனியே வெளிப்படுத்தாமல் விட்டாலும் அதன் தொடர்ச்சி சூழலால் தெளிவாகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டமாக மாற்றாமல், அதன் ஒலிபெயர்ப்பைத் தமிழில் தருகிறது.
- source_word: הַדָּבָר
  choice: வார்த்தை
  rationale: சூழலில் இது வாக்குறுதியைக் குறித்தாலும், எபிரெயச் சொல்லையும் தொடர்ந்து வரும் ‘சொன்ன’ என்பதுடனான தொடர்பையும் பாதுகாக்கிறது.
- source_word: עַל עַבְדְּךָ וְעַל בֵּיתוֹ
  choice: உமது அடியானைக் குறித்தும் அவனுடைய வீட்டைக் குறித்தும்
  rationale: עַל என்பதன் ‘குறித்து’ என்ற பொருளை இருமுறை வரும் எபிரெய அமைப்புக்கு ஏற்ப வைத்திருக்கிறது. ‘வீடு’ என்பது குடும்பம், வம்சவழி, அரச மரபு ஆகிய பொருள் சாத்தியங்களைத் திறந்தே வைக்கிறது.
- source_word: יֵאָמֵן
  choice: உறுதியாகட்டும்
  rationale: அமன் வேரின் நிபால் வடிவம் இங்கு உறுதிப்படுதல் அல்லது நிலைநாட்டப்படுதல் என்ற வேண்டுதல் பொருளைத் தருகிறது; ‘உறுதியாகட்டும்’ தமிழில் இயல்பாகவும் சுருக்கமாகவும் உள்ளது.
- source_word: עַד עוֹלָם
  choice: என்றென்றும்
  rationale: நீடித்த நிரந்தரத்தைக் குறிக்கும் எபிரெயச் சொற்றொடருக்கான இயல்பான தமிழ் இணை.
- source_word: וַעֲשֵׂה כַּאֲשֶׁר דִּבַּרְתָּ
  choice: நீர் சொன்னபடியே செய்யும்
  rationale: தேவன் தாம் சொன்னதைச் செயல்படுத்த வேண்டும் என்ற நேரடி விண்ணப்பத்தையும், முன்பு வந்த ‘சொன்ன’ என்ற வினையுடனான இணைப்பையும் காக்கிறது. ‘செய்யும்’ என்பது மரியாதையுள்ள வேண்டுதல் வடிவம்.
theological_decisions:
- issue: தாவீதின் உடன்படிக்கைச் சூழலில் ‘அவனுடைய வீடு’ என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘அவனுடைய வீடு’ என்று வைத்தல்
  alternative: அவனுடைய அரச வம்சம் / அவனுடைய குடும்ப வழி
  rationale: இந்த வாக்குறுதி தாவீதின் குடியிருப்பைப் பற்றியது மட்டுமல்ல; அவனுடைய குடும்பத்தையும் அரச மரபையும் உள்ளடக்குகிறது. எனினும், எபிரெய ‘வீடு’ என்பது உடன்படிக்கைச் சூழலில் பல அடுக்குப் பொருளுடையதால், அதை ஒரே விளக்கமாகச் சுருக்காமல் முதன்மை உரையில் பாதுகாத்து, விரிவான சாத்தியங்களை அடிக்குறிப்பில் தருவது பொருத்தம்.
translation_notes:
  register: நவீன நிலையான தமிழில், ஜெபத்துக்குரிய கண்ணியமான நடையைப் பேணுகிறது. ‘அடியான்,’ ‘நீர்,’ ‘செய்யும்’ ஆகியவை மரியாதையையும் ஜெபத் தொனியையும் தருகின்றன; மிகப் பழமையான வாக்கிய அமைப்புகள் தவிர்க்கப்பட்டுள்ளன. அடிக்குறிப்பு குறி அது விளக்கும் ‘வீடு’ என்ற சொல்லுக்குப் பிறகே இடப்பட்டுள்ளது.
