translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. மூல எபிரெயத்தின் இரட்டை כְּכֹל அமைப்பின் சமநிலை, தமிழில் ‘அனைத்திற்கும் ... முழுவதற்கும் ... ஏற்ப’ என்ற கட்டமைப்பால் பேணப்பட்டுள்ளது. அடிக்குறிப்பு குறிகள் உரையில் அவற்றின் பொருந்திய சொற்களுக்கு உடனடியாக இணைக்கப்பட்டுள்ளன.
