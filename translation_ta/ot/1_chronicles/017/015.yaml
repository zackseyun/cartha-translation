  text: According to all these words and according to all this vision[b][a], so Nathan spoke to David.
translation:
  language: ta
  text: இந்த வார்த்தைகள் அனைத்தின்படியும்[a], இந்தத் தரிசனம் முழுவதின்படியும்[b], நாத்தான் தாவீதிடம் அவ்வாறே பேசினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இந்தக் காரியங்கள் அனைத்தின்படியும்’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் דְּבָרִים சூழலுக்கேற்ப ‘வார்த்தைகள்’ அல்லது ‘காரியங்கள்/விஷயங்கள்’ என்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘இந்த வெளிப்பாடு முழுவதின்படியும்’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் חָזוֹן தீர்க்கதரிசனத் தரிசனத்தையோ வெளிப்படுத்தப்பட்ட செய்தியையோ குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּכֹל ... וּכְכֹל
  choice: அனைத்திற்கும் ... முழுவதற்கும் ஏற்ப
  rationale: כְּ + כֹל ஒத்திசைவு அல்லது பொருந்துதலைக் குறிக்கிறது. எபிரெயச் சொல்லமைப்பின் இணைநிலையைத் தமிழில் இயல்பாகப் பேணுவதற்கு ‘ஏற்ப’ இரு கூறுகளையும் சாருமாறு அமைக்கப்பட்டுள்ளது.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: இந்த வார்த்தைகள்
  rationale: דְּבָרִים என்பதற்கு ‘வார்த்தைகள்’, ‘காரியங்கள்’, ‘விஷயங்கள்’ எனப் பொருள் வரலாம். இங்கு நாத்தான் பெற்ற இறைச்செய்தியின் வாய்மொழி உள்ளடக்கம் சுட்டப்படுவதால் ‘வார்த்தைகள்’ முதன்மைத் தேர்வாகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: הֶחָזוֹן הַזֶּה
  choice: இந்தத் தரிசனம்
  rationale: חָזוֹן தீர்க்கதரிசனக் காட்சி அல்லது வெளிப்படுத்தப்பட்ட செய்தியைக் குறிக்கிறது. ‘தரிசனம்’ மூலச்சொல்லின் காட்சி சார்ந்த பொருளை நேரடியாகப் பேணுகிறது; ‘வெளிப்பாடு’ மாற்றாகக் குறிப்பிடப்படுகிறது.
- source_word: כֵּן
  choice: ஏற்ப
  rationale: כֵּן முன்னர் கூறப்பட்ட வார்த்தைகளுக்கும் தரிசனத்திற்கும் நாத்தானின் பேச்சு துல்லியமாக ஒத்திருந்ததைச் சுட்டுகிறது. தமிழில் வாக்கிய முடிவில் ‘அவ்வாறே’ என மீண்டும் கூறுவதைவிட, ‘ஏற்ப’ அந்தத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: דִּבֶּר
  choice: பேசினார்
  rationale: דבר என்பதன் நேரடி பொருள் ‘பேசுதல்’. மரியாதை விகுதி தமிழ் வேதாகம உரைநடையின் கண்ணியமான பாங்கிற்கு ஏற்றது.
- source_word: נָתָן
  choice: நாத்தான்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற பெயரெழுத்தாக்கம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: אֶל דָּוִיד
  choice: தாவீதிடம்
  rationale: אֶל பேச்சின் நோக்குநபரைச் சுட்டுகிறது. ‘தாவீதிடம்’ நவீனத் தமிழில் இயல்பாக ‘தாவீதோடு/தாவீதுக்கு’ என்ற திசைப்பொருளை வழங்குகிறது.
