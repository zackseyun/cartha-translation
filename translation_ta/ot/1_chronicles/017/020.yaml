  to: யாவே, நாங்கள் எங்கள் காதுகளால் கேட்ட எல்லாவற்றின்படியும், உம்மைப்போன்றவர் யாரும் இல்லை; உம்மைத் தவிர வேறு கடவுளும் இல்லை[a].
  rationale: The evidential phrase has been moved to the front so that it naturally qualifies the entire two-part confession, as it does in the Hebrew. The unsupported added sentence “இதுவே உண்மை” has been removed. The divine name, respectful prayer register, exclusivity claim, and lexical-alternative footnote are retained.
