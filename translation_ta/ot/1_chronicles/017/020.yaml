source:
  edition: WLC
  text: יְהוָה֙ אֵ֣ין כָּמ֔וֹ/ךָ וְ/אֵ֥ין אֱלֹהִ֖ים זוּלָתֶ֑/ךָ בְּ/כֹ֥ל אֲשֶׁר שָׁמַ֖עְנוּ בְּ/אָזְנֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/020.yaml
  text: O Yahweh[a], there is none like you, and there is no God besides you, in all that we have heard with our own ears.
translation:
  language: ta
  text: யாவே, நாங்கள் எங்கள் காதுகளால் கேட்ட எல்லாவற்றின்படியும், உம்மைப்போன்றவர் யாரும் இல்லை; உம்மைத் தவிர வேறு கடவுளும் இல்லை[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உம்மையன்றி கடவுள் இல்லை.”
    reason: זוּלָתֶךָ என்பதற்கு ‘உம்மைத் தவிர’ அல்லது ‘உம்மையன்றி’ என இயல்பாக மொழிபெயர்க்கலாம்.
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெயத் திருப்பெயரான YHWH-ஐ பட்டப்பெயராக மாற்றாமல், நவீன தமிழில் இயல்பாக ஒலிபெயர்த்துள்ளது.
- source_word: אֵין כָּמוֹךָ
  choice: உம்மைப் போன்றவர் யாரும் இல்லை
  rationale: ஒப்பிடத்தக்க ஒருவர் கூட இல்லை என்ற எபிரெயச் சொற்றொடரின் வலிமையைத் தெளிவான தமிழில் தக்கவைக்கிறது.
- source_word: וְאֵין אֱלֹהִים זוּלָתֶךָ
  choice: உம்மைத் தவிர வேறு கடவுள் இல்லை
  rationale: זוּלָתֶךָ என்பதன் ‘உம்மைத் தவிர’ என்ற விலக்குப் பொருளையும், வேறு கடவுள் இல்லை என்ற நேரடியான தனித்தன்மைக் கூற்றையும் காக்கிறது.
- source_word: בְּכֹל אֲשֶׁר שָׁמַעְנוּ בְּאָזְנֵינוּ
  choice: நாங்கள் எங்கள் காதுகளால் கேட்ட எல்லாவற்றின்படியும்
  rationale: בְּ இங்கு கேட்டறிந்த அனைத்தையும் இவ்வறிக்கையின் அடிப்படை அல்லது அளவுகோலாகக் காட்டுகிறது; ‘எங்கள் காதுகளால்’ என்பது மூலத்தின் உடல் சார்ந்த வலியுறுத்தலைத் தக்கவைக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைபெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் நேரடியாக வரும் உடன்படிக்கைப் பெயரை பொதுப் பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: וְאֵין אֱלֹהִים זוּלָתֶךָ என்பதன் தனித்தன்மைக் கூற்று
  choice: உம்மைத் தவிர வேறு கடவுள் இல்லை
  alternative: தேவர்களுக்குள் உமக்கு ஒப்பானவர் இல்லை
  rationale: எபிரெயம் வெறும் மேன்மை ஒப்பீட்டை மட்டும் கூறாமல், வேறு கடவுள் இருப்பதையே மறுக்கும் நேரடியான கூற்றை முன்வைக்கிறது.
translation_notes:
  register: மரியாதை ஒருமையான ‘உம்’ வடிவம் பயன்படுத்தப்பட்டுள்ளது. ஜெபத்திற்கேற்ற கண்ணியமான, ஆனால் இன்றைய வாசகர்களுக்கு எளிதில் புரியும் நடை பேணப்பட்டுள்ளது. கடைசியில் சேர்க்கப்பட்ட ‘இதுவே உண்மை’ என்பது தமிழில் ‘எல்லாவற்றின்படியும்’ என்ற தொடர்பை முழுமையான வாக்கியமாக இயல்பாக்குகிறது; அது புதிய கருத்தைச் சேர்ப்பதற்காக அல்ல.
