id: 1CH.17.12
reference: 1 Chronicles 17:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: ה֥וּא יִבְנֶה לִּ֖/י בָּ֑יִת וְ/כֹנַנְתִּ֥י אֶת כִּסְא֖/וֹ עַד עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/012.yaml
  text: He will build a house for me[a], and I will establish his throne forever.
translation:
  language: ta
  text: அவன் எனக்காக ஒரு வீட்டைக் கட்டுவான்[a]; நான் அவனுடைய அரியணையை என்றென்றும் நிலைநிறுத்துவேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வீடு’ என்பதற்குப் பதிலாக ‘ஆலயம்’ என்றும் மொழிபெயர்க்கலாம்; எபிரேயச் சொல் நேரடியாக ‘வீடு’ என்று பொருள்பட்டாலும், இச்சூழலில் சாலொமோன் கட்டவிருந்த ஆலயத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּא
  choice: அவனே
  rationale: மூன்றாம் நபர் ஆண்பால் ஒருமைத் தனிப்பெயர் இங்கு வெளிப்படையாகவும் வலியுறுத்தலுடனும் வருகிறது; ‘அவனே’ அந்த வலியுறுத்தலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יִבְנֶה
  choice: கட்டுவான்
  rationale: בנה என்ற வேரின் Qal முற்றுப்பெறா வடிவம்; வாக்குறுதியின் சூழலில் எதிர்காலச் செயலைக் குறிக்கிறது.
- source_word: לִּי
  choice: எனக்காக
  rationale: ל முன்னொட்டும் முதலாம் நபர் ஒருமை விகுதியும் இங்கு பயன் அல்லது சார்பைக் குறிக்கின்றன; ‘எனக்காக’ என்பது தமிழில் இயல்பான இணை.
- source_word: בָּיִת
  choice: ஒரு வீடு
  rationale: இந்தச் சொல் நேரடியாக ‘வீடு’ என்று பொருள்படும். சூழலில் சாலொமோன் கட்டவிருந்த இறை ஆலயத்தைக் குறித்தாலும், மூலத்தின் விரிவான சொல்லையும் தாவீதின் உடன்படிக்கையிலுள்ள இலக்கியத் தொடர்பையும் முதன்மை உரை காக்கிறது.
- source_word: וְכֹנַנְתִּי
  choice: நான் ... நிலைநிறுத்துவேன்
  rationale: כון வேரிலிருந்து வந்த இந்த முதலாம் நபர் வடிவம் உறுதியாக நிறுவுதல் அல்லது நிலைபெறச் செய்தல் என்ற பொருளுடையது; அரச அரியணையைப் பற்றிய வாக்குறுதிக்கு ‘நிலைநிறுத்துவேன்’ இயல்பாகப் பொருந்துகிறது.
- source_word: אֶת כִּסְאוֹ
  choice: அவனுடைய அரியணையை
  rationale: நேரடிச் செயப்படுபொருள் குறியீட்டுடன் மூன்றாம் நபர் ஆண்பால் ஒருமை உடைமை விகுதி சேர்ந்துள்ளது; ‘அவனுடைய அரியணையை’ அதன் இலக்கண உறவைத் தெளிவாகக் காட்டுகிறது.
- source_word: עַד עוֹלָם
  choice: என்றென்றும்
  rationale: நீடித்த நிரந்தரத்தைக் குறிக்கும் எபிரெய மரபுத்தொடருக்கு ‘என்றென்றும்’ தெளிவான, இயல்பான தமிழ் இணையாகும்.
theological_decisions:
- issue: בָּיִת என்பதை ‘வீடு’ என்றே மொழிபெயர்ப்பதா, சூழலுக்கேற்ப ‘ஆலயம்’ என்று விளக்கிப் பெயர்ப்பதா
  choice: வீடு
  alternative: ஆலயம்
  rationale: எபிரெய மூலத்தில் பொதுவான ‘வீடு’ என்ற சொல்லே உள்ளது. அதை முதன்மை உரையில் காப்பது தாவீதின் உடன்படிக்கையில் ‘வீடு’ என்பதன் இலக்கிய மற்றும் இறையியல் தொடர்பைத் தக்கவைக்கிறது; சூழல்சார் ‘ஆலயம்’ என்ற பொருள் அடிக்குறிப்பில் வழங்கப்படுகிறது.
- issue: தாவீதுக்கான வாக்குறுதியில் עַד עוֹלָם என்பதன் கால வலிமை
  choice: என்றென்றும்
  alternative: நிரந்தரமாக
  rationale: வாக்குறுதியின் இறுதி நிறைவேற்றம் குறித்த இறையியல் விவாதங்களை மொழிபெயர்ப்பில் தீர்மானிக்காமல், மூல உரையின் நீடித்த நிரந்தரக் கூற்றை நேரடியாகப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘அவனே’ மூலத்தின் வலியுறுத்தலைக் காக்கிறது; ‘வீடு’ மூலச் சொல்லின் பரப்பைத் தக்கவைக்கிறது; ‘அரியணை’ அரசாட்சி சார்ந்த பொருளை இயல்பாக வெளிப்படுத்துகிறது.
