base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/025.yaml
  text: For you[a], my God, have revealed to your servant that you will build him a house[b]; therefore your servant has found courage to pray before you.
translation:
  language: ta
  text: '**1 நாளாகமம் 17:25**


    என் தேவனே, நீர் உமது அடியானுக்கு, “அவனுக்கு ஒரு வீட்டைக்[b] கட்டுவீர்” என்று வெளிப்படுத்தியிருக்கிறீர்[a]. ஆகையால், உமது அடியான் உமக்கு முன்பாக மன்றாடத் துணிவு பெற்றான்.


    [a] எபிரெய மொழியில் சொல்லுக்குச் சொல், “உமது அடியானின் செவியை வெளிப்படுத்தியிருக்கிறீர்”; இது ஒருவருக்கு ஒன்றை வெளிப்படுத்துவதைக் குறிக்கும் மரபுத்தொடர்.


    [b] அல்லது, “அவனுக்கு ஒரு வம்சத்தை நிலைநாட்டுவீர்.” இங்கு “வீடு” என்பது குடும்பத்தையும் நிலைத்திருக்கும் அரச வம்சத்தையும் குறிக்கக்கூடும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் சொல்லுக்குச் சொல், “உமது அடியானின் செவியை வெளிப்படுத்தியிருக்கிறீர்”; இது ஒருவருக்கு ஒன்றை வெளிப்படுத்துவதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவனுக்கு ஒரு வம்சத்தை நிலைநாட்டுவீர்.” இங்கு “வீடு” என்பது குடும்பத்தையும் நிலைத்திருக்கும் அரச வம்சத்தையும் குறிக்கக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: גָּלִיתָ אֶת אֹזֶן עַבְדְּךָ
  choice: உமது அடியானுக்கு வெளிப்படுத்தி
  rationale: சொல்லுக்குச் சொல் பார்த்தால், “உமது அடியானின் செவியைத் திறந்தீர்” என்பதாகும். வெளிப்படுத்துதல் அல்லது அறிவித்தல் என்னும் பொருளுடைய எபிரெய மரபுத்தொடர் என்பதால், நவீனத் தமிழில் தெளிவாக அதன் பொருள் மொழிபெயர்க்கப்பட்டுள்ளது; சொல்லுருவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: לִבְנוֹת לוֹ בָּיִת
  choice: அவனுக்கு ஒரு வீட்டைக் கட்டுவீர் என்று
  rationale: வெளிப்படுத்தப்பட்ட செய்தியின் உள்ளடக்கத்தை இம்முடிவிலா வினை வடிவம் தெரிவிக்கிறது. “வீட்டைக் கட்டுதல்” என்ற மூல உருவகம் தக்கவைக்கப்பட்டதால், குடும்பம் மற்றும் அரச வம்சம் ஆகிய இரு பொருள் வாய்ப்புகளும் திறந்திருக்கின்றன.
- source_word: בָּיִת
  choice: வீடு
  rationale: தாவீதுக்கு அளிக்கப்பட்ட வாக்குறுதியின் சூழலில் இச்சொல் ஒரு குடும்பத்தையோ தொடரும் அரச வம்சத்தையோ குறிக்கலாம். “வம்சம்” என்று மட்டும் மொழிபெயர்த்து பொருளை வரையறுக்காமல், மூல மொழியின் படிமமும் பொருள் அடுக்குகளும் முதன்மை உரையில் பாதுகாக்கப்பட்டுள்ளன.
- source_word: מָצָא ... לְהִתְפַּלֵּל
  choice: மன்றாடத் துணிவு பெற்றான்
  rationale: இங்கு “கண்டடைதல்” என்பதுடன் வரும் வினையெச்ச அமைப்பு, செயலில் இறங்குவதற்கான துணிவு அல்லது மனவுறுதியைப் பெற்றதைக் குறிக்கிறது. சொல்லுக்குச் சொல்லான தமிழ் தெளிவற்றதாக இருக்கும் என்பதால், மரபுத்தொடரின் பொருள் இயல்பாக வழங்கப்பட்டுள்ளது.
- source_word: לְפָנֶיךָ
  choice: உமக்கு முன்பாக
  rationale: தேவனுடைய முன்னிலையில் செய்யப்படும் மன்றாட்டின் உறவுசார் மற்றும் பக்திநிறைந்த சூழலை நேரடியாகத் தக்கவைக்கிறது.
- source_word: עַבְדְּךָ
  choice: உமது அடியான்
  rationale: அரசருக்குரிய மன்றாட்டு நடையில் இது தேவனுக்கு முன்பாகத் தன்னைத் தாழ்த்திக் குறிப்பிடும் சொல். “அடியான்” என்பது நவீனத் தமிழிலும் இச்சூழலுக்குரிய பணிவையும் கீழ்ப்படிதலையும் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: தாவீதுக்கான வாக்குறுதியில் “வீடு” என்பதன் பொருள்
  choice: முதன்மை உரையில் “வீடு” என்பதைத் தக்கவைத்து, அரச வம்சம் என்ற பொருளை அடிக்குறிப்பில் குறிப்பிடுதல்
  alternative: முதன்மை உரையிலேயே “வம்சம்” அல்லது “அரச வம்சம்” என்று வெளிப்படையாக மொழிபெயர்த்தல்
  rationale: எபிரெயச் சொல் குடும்பம், குடும்ப வழி, அரச வம்சம் ஆகிய தொடர்புடைய பொருள்களைத் தாங்குகிறது. “வீடு” என்ற மூலப் படிமத்தைத் தக்கவைப்பது உடன்படிக்கை வாக்குறுதியின் பொருள் அடுக்கை முன்கூட்டியே ஒரே விளக்கமாகச் சுருக்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளக்கூடிய கண்ணியமான மன்றாட்டு நடை பயன்படுத்தப்பட்டுள்ளது. தேவனை நோக்கி “நீர்/உமது” என்றும், தாவீதின் பணிவான தற்குறிப்புக்கு “அடியான்” என்றும் வழங்கப்பட்டுள்ளது. மூலத்தின் மூன்றாம் நபர் தற்குறிப்பும் “வீடு” என்ற பலபொருள் உருவகமும் பாதுகாக்கப்பட்டுள்ளன.
