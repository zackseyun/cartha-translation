  source_fidelity: மூலத்தின் ‘வெளிப்படுத்தினீர்’ என்னும் வினை, அதைத் தொடர்ந்து வரும் ‘அவனுக்கு ஒரு வீட்டைக் கட்ட’ என்ற அறிவிப்பின் உள்ளடக்கத்தை நேரடியாக ஆள்கிறது. வரைவில் உள்ள ‘வெளிப்படுத்தி ... கூறியிருக்கிறீர்’ என்பது இரண்டு தனி வினைகளைப் போலத் தோற்றமளித்து தேவையற்ற ‘கூறுதல்’ வினையைச் சேர்க்கிறது. அதைச் சரிசெய்தால் மூலத் தொடரும் நிறைவு வினையும் தெளிவாகப் பிரதிபலிக்கும்.
  naturalness: ‘என் தேவனே’, ‘உமது அடியான்’, ‘உமக்கு முன்பாக மன்றாடத் துணிவு பெற்றான்’ ஆகியவை கண்ணியமான நவீனத் தரத் தமிழில் இயல்பாக உள்ளன. அறிவிப்பின் உள்ளடக்கத்தை மேற்கோள் வடிவில் அமைப்பது வாசிப்பைத் தெளிவாக்குகிறது.
  terminology: ‘அடியான்’ அரச-மன்றாட்டு சூழலுக்கு ஏற்ற பணிவான தற்குறிப்பு. ‘வீடு’ முதன்மை உரையில் தக்கவைக்கப்பட்டு, அரச வம்சம் என்ற பொருள் அடிக்குறிப்பில் மட்டும் வழங்கப்படுகிறது; இதனால் எபிரெயத்தின் பலபொருள் தன்மை பாதுகாக்கப்படுகிறது. அடிக்குறிப்பு a-வில் ‘செவியைத் திறத்தல்’ என்பதை விட ‘செவியை வெளிப்படுத்துதல்’ மூலத்தின் ‘uncover’ உருவகத்துக்கு நெருக்கமானது; அது தமிழில் மரபுத்தொடர் விளக்கத்துடன் தரப்பட்டுள்ளது.
