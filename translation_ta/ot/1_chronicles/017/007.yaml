source:
  edition: WLC
  text: וְ֠/עַתָּה כֹּֽה תֹאמַ֞ר לְ/עַבְדִּ֣/י לְ/דָוִ֗יד כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת אֲנִ֤י לְקַחְתִּ֨י/ךָ֙ מִן הַ/נָּוֶ֔ה מִֽן אַחֲרֵ֖י הַ/צֹּ֑אן לִ/הְי֣וֹת נָגִ֔יד עַ֖ל עַמִּ֥/י יִשְׂרָאֵֽל־ס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/007.yaml
  text: 'Now therefore[a], this is what you shall say to my servant David: This is what Yahweh of hosts says: I took you from the pasture, from following the flock[b], to be ruler over my people Israel.'
translation:
  language: ta
  text: 'இப்போது, என் ஊழியனாகிய தாவீதிடம் நீ சொல்ல வேண்டியது இதுவே: “படைகளின் யாவே இவ்வாறு கூறுகிறார்: மேய்ச்சல் நிலத்திலிருந்து[a], மந்தையைப் பின்தொடர்ந்து வந்ததிலிருந்து உன்னை நான் எடுத்து, என் மக்களாகிய இஸ்ரவேலின்மேல் தலைவனாக[b] நியமித்தேன்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “தொழுவத்திலிருந்து.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது “ஆட்சியாளனாக” அல்லது “இளவரசனாக.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ஆகையால் இப்போது
  rationale: இணைப்புச் சொல்லின் தொடர்ச்சி/விளைவு நுணுக்கத்தையும் ‘இப்போது’ என்ற காலமாற்றத்தையும் இயல்பான தமிழில் இணைக்கிறது.
- source_word: כֹּה תֹאמַר
  choice: நீ சொல்ல வேண்டியது இதுவே
  rationale: தீர்க்கதரிசனத் தூதுச் சூத்திரத்தின் கட்டளைத் தன்மையைத் தெளிவான நவீன தமிழில் தருகிறது.
- source_word: לְעַבְדִּי
  choice: என் ஊழியனாகிய
  rationale: இங்கு அடிமை நிலையைக் காட்டிலும் கடவுளுக்குரிய சேவையையும் மரியாதைக்குரிய உடன்படிக்கை உறவையும் குறிக்கிறது.
- source_word: יְהוָה צְבָאוֹת
  choice: படைகளின் யாவே
  rationale: தெய்வீகப் பெயரை ஒலிபெயர்த்து, צְבָאוֹת என்பதன் பரந்த படைத் தொகுதிகள் என்ற பொருளையும் காக்கிறது.
- source_word: לְקַחְתִּיךָ
  choice: உன்னை நான் எடுத்து
  rationale: தாவீதை உயர்த்தியதில் யாவேயின் முன்முயற்சியை לקח என்பதற்கு நெருக்கமாக வெளிப்படுத்துகிறது.
- source_word: מִן הַנָּוֶה
  choice: மேய்ச்சல் நிலத்திலிருந்து
  rationale: அருகிலுள்ள மந்தை மேய்க்கும் உருவகத்துக்கு ஏற்ற முதன்மைப் பொருள்; ‘தொழுவம்’ என்ற சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: מִן אַחֲרֵי הַצֹּאן
  choice: மந்தையின் பின்னால் சென்றுகொண்டிருந்த
  rationale: எபிரெயச் சொல்லமைப்பின் மேய்ப்பர் உருவகத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: לִהְיוֹת נָגִיד
  choice: தலைவனாக வைத்தேன்
  rationale: நியமிக்கப்பட்டு மக்களை வழிநடத்தி ஆளும் அதிகாரத்தைத் தெரிவிக்கிறது; இறுதி வினை தமிழில் நோக்கத்தின் நிறைவேற்றத்தை இயல்பாகச் சொல்கிறது.
- source_word: עַל עַמִּי יִשְׂרָאֵל
  choice: என் மக்களாகிய இஸ்ரவேலின்மேல்
  rationale: ‘என் மக்கள்’ என்ற சொந்த உறவையும் עַל என்பதன் ‘மேல்’ என்ற ஆட்சிசார் தொடர்பையும் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: யெகோவா
  rationale: மூலத்தில் உள்ள உடன்படிக்கைப் பெயரைப் பொதுப்பட்டமாக மாற்றாமல், ஏற்றுக்கொள்ளப்பட்ட ஒலிப்புக்கு நெருக்கமாகத் தமிழில் தருகிறது.
- issue: עַבְדִּי என்பதில் தாவீதின் நிலை
  choice: என் ஊழியன்
  alternative: என் அடிமை
  rationale: இந்த அரச மற்றும் உடன்படிக்கைச் சூழலில் மரியாதைக்குரிய தெய்வீகச் சேவையே முதன்மை; சட்டரீதியான அடிமை நிலை வலியுறுத்தப்படவில்லை.
- issue: נָגִיד என்பதன் ஆட்சிசார் நுணுக்கம்
  choice: தலைவன்
  alternative: ஆட்சியாளன் அல்லது இளவரசன்
  rationale: சொல் நியமிக்கப்பட்ட வழிநடத்தலையும் ஆளும் அதிகாரத்தையும் குறிக்க முடியும்; ‘தலைவன்’ அரசன் என்ற பிற்காலத் தொழில்நுட்பப் பட்டத்தை முன்கூட்டியே திணிக்காமல் அந்த விரிவை வைத்திருக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில் தெளிவாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. தீர்க்கதரிசனத் தூதுச் சூத்திரம் இயல்பான உரைநடையில் தரப்பட்டாலும், மேய்ப்பர் உருவகமும் தெய்வீகப் பெயரும் ஆட்சிசார் நுணுக்கமும் பாதுகாக்கப்பட்டுள்ளன.
