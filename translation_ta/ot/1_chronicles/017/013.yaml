  source_fidelity: கருத்து முழுமையாக மூலத்துடன் ஒத்துள்ளது. ஆனால் எபிரெய மூலத்தின் வரிசையில் முதலில் ‘என் மாறாத அன்பை ... நீக்கமாட்டேன்’ என்றும் பின்னர் அதற்கான ‘உனக்கு முன்பு இருந்தவனிடமிருந்து ... நீக்கியதுபோல்’ என்ற ஒப்பீடும் வருகிறது. வரைவில் இந்த ஒப்பீடு முன்வைக்கப்பட்டுள்ளது; பொருள் மாறாவிட்டாலும், உகந்த-சமநிலை மொழிபெயர்ப்பில் மூல வரிசையைப் பேணுவது சிறந்தது.
  naturalness: ‘நான் அவனுக்குத் தந்தையாக இருப்பேன்; அவன் எனக்கு மகனாக இருப்பான்’ மற்றும் ‘என் மாறாத அன்பு’ ஆகியவை நவீன தரநிலைத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் உள்ளன. திருத்தப்பட்ட வாக்கிய அமைப்பு ஒப்பீட்டின் தொடர்பை மேலும் தெளிவாக்கும்.
  terminology: ‘தந்தை’, ‘மகன்’, ‘மாறாத அன்பு’, ‘நீக்கமாட்டேன்’ ஆகியவை நேரடியான உறவுமொழியையும் חֶסֶד-ன் நிலைத்த அன்பு என்னும் பொருளையும் போதுமான அளவு காக்கின்றன. சவுலின் பெயர் முதன்மை உரையில் சேர்க்கப்படாமல் அடிக்குறிப்பில் மட்டுமே விளக்கப்படுவது மூலத்தின் மறைமுகக் குறிப்பைச் சரியாகப் பேணுகிறது.
