base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/013.yaml
  text: I will be a father to him[a], and he will be a son to me. And I will not remove my steadfast love from him[b], as I removed it from the one who was before you.
translation:
  language: ta
  text: நான் அவனுக்குத் தந்தையாக இருப்பேன்[a]; அவன் எனக்கு மகனாக இருப்பான். என் மாறாத அன்பை அவனிடமிருந்து நீக்கமாட்டேன்; உனக்கு முன்பு இருந்தவனிடமிருந்து அதை நீக்கியதுபோல் நான் நீக்கமாட்டேன்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் அவனுடைய தந்தையாக இருப்பேன்; அவன் என்னுடைய மகனாக இருப்பான்.”
    reason: lexical_alternative
  - marker: b
    text: “உனக்கு முன்பு இருந்தவன்” என்பது தாவீதுக்கு முன் அரசனாக இருந்த சவுலைக் குறிக்கிறது.
    reason: cross_reference
lexical_decisions:
- source_word: אֶהְיֶה לּוֹ לְאָב
  choice: நான் அவனுக்குத் தந்தையாக இருப்பேன்
  rationale: எபிரெய மொழியின் ‘அவனுக்குத் தந்தையாக இருப்பேன்’ என்ற உறவுசார் அமைப்பை இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: וְהוּא יִהְיֶה לִּי לְבֵן
  choice: அவன் எனக்கு மகனாக இருப்பான்
  rationale: முந்தைய கூறுடன் உள்ள இணை அமைப்பையும் உடன்படிக்கை சார்ந்த தந்தை–மகன் உறவுமொழியையும் நேரடியாகப் பேணுகிறது.
- source_word: חַסְדִּי
  choice: என் மாறாத அன்பு
  rationale: חֶסֶד என்பதிலுள்ள நிலைத்த அன்பு, பற்றுறுதி, உடன்படிக்கைச் சார்ந்த நம்பகத்தன்மை ஆகியவற்றை மிகையாக விளக்காமல் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לֹא אָסִיר מֵעִמּוֹ
  choice: அவனிடமிருந்து அதை நீக்கமாட்டேன்
  rationale: סור என்பதன் causative பொருளான ‘நீக்குதல்’ என்பதையும் அடுத்த கூறில் திரும்ப வரும் அதே வினையையும் பேணுகிறது.
- source_word: כַּאֲשֶׁר הֲסִירוֹתִי
  choice: நீக்கியதுபோல்
  rationale: முந்தைய ‘நீக்கமாட்டேன்’ என்பதுடன் எபிரெயத்தில் உள்ள சொல் ஒத்திசைவைப் பேணுகிறது; தமிழில் பொருள் சூழலிலிருந்து தெளிவாகிறது.
- source_word: מֵאֲשֶׁר הָיָה לְפָנֶיךָ
  choice: உனக்கு முன்பு இருந்தவனிடமிருந்து
  rationale: மூலத்தில் சவுலின் பெயர் சொல்லப்படாததைப் பேணி, ‘உனக்கு முன் அரசனாக இருந்தவன்’ என்ற கால/பதவி முன்னுரிமையை இயல்பாகக் குறிக்கிறது.
theological_decisions:
- issue: தாவீதின் உடன்படிக்கையிலுள்ள தந்தை–மகன் மொழி
  choice: ‘தந்தையாக இருப்பேன் / மகனாக இருப்பான்’ என்ற நேரடி உறவுமொழியைத் தக்கவைத்தல்
  alternative: ‘தந்தையைப்போல் கவனிப்பேன் / மகனைப்போல் இருப்பான்’ என்று உவமையாக விரித்துரைத்தல்
  rationale: மூலம் நேரடியான உடன்படிக்கை உறவைக் கூறுகிறது; அதை வெறும் ஒப்புமையாக மாற்றாமல் அதன் வேதாகமத் தத்துவ முக்கியத்துவத்தையும் திறந்த பொருள் பரப்பையும் பேணுகிறது.
- issue: உடன்படிக்கைச் சூழலில் חֶסֶד என்பதன் மொழிபெயர்ப்பு
  choice: மாறாத அன்பு
  alternative: கிருபை; இரக்கம்; உடன்படிக்கைப் பற்றுறுதி
  rationale: ‘மாறாத அன்பு’ என்பது அன்பையும் நிலையான பற்றுறுதியையும் ஒன்றாகக் காட்டுகிறது; சொல்லை உணர்ச்சி மட்டுமாகவோ சட்டப்பூர்வக் கடமை மட்டுமாகவோ குறுக்காது.
- issue: ‘உனக்கு முன்பு இருந்தவன்’ என்பவரின் அடையாளம்
  choice: முதன்மை உரையில் பெயரைச் சேர்க்காமல் மூலத்தின் மறைமுகக் குறிப்பைப் பேணுதல்
  alternative: முதன்மை உரையிலேயே ‘சவுல்’ என்று வெளிப்படுத்துதல்
  rationale: மூல எபிரெயம் பெயரைச் சொல்லவில்லை. சூழலில் சவுலைக் குறிப்பது தெளிவுபடுத்தும் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. இணை வாக்கிய அமைப்பும் தந்தை–மகன் உறவுமொழியும் காக்கப்பட்டுள்ளன. ‘மாறாத அன்பு’ என்பது חֶסֶד என்பதன் அன்பும் நிலைத்த பற்றுறுதியும் சேர்ந்த பொருளை இயல்பாக எடுத்துரைக்கிறது.
