id: 1CH.17.26
reference: 1 Chronicles 17:26
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/עַתָּ֣ה יְהוָ֔ה אַתָּה ה֖וּא הָ/אֱלֹהִ֑ים וַ/תְּדַבֵּר֙ עַֽל עַבְדְּ/ךָ֔ הַ/טּוֹבָ֖ה הַ/זֹּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/026.yaml
  text: And now[a], Yahweh, you are God, and you have spoken this good thing concerning your servant.
translation:
  language: ta
  text: இப்போது, யாவே, நீரே கடவுள்; உமது அடியேனைக் குறித்து இந்த நன்மையான காரியத்தை நீர் உரைத்திருக்கிறீர்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உமது அடியேனைக் குறித்து இந்த நல்ல வாக்குறுதியை நீர் அளித்திருக்கிறீர்.” எபிரெயத்தில் சொல்லர்த்தமாக, “உமது அடியேனைக் குறித்து இந்த நன்மையான காரியத்தை நீர் உரைத்திருக்கிறீர்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: இப்போது
  rationale: செபத்தின் அடுத்த உறுதிப்பாட்டை அறிமுகப்படுத்தும் காலநிலை மாற்றத்தை இயல்பான தமிழில் தருகிறது; வாவ் இணைப்பின் தொடர்ச்சி தமிழில் நிறுத்தக்குறியாலும் சூழலாலும் வெளிப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் உள்ள தனிப்பட்ட இறைபெயரைப் பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்க்கிறது.
- source_word: אַתָּה הוּא הָאֱלֹהִים
  choice: நீரே கடவுள்
  rationale: אַתָּה הוּא என்பதன் வலியுறுத்தலை ‘நீரே’ இயல்பாகத் தக்கவைக்கிறது; הָאֱלֹהִים இங்கு கடவுளின் அடையாளத்தை உறுதிப்படுத்துகிறது.
- source_word: וַתְּדַבֵּר
  choice: நீர் உரைத்திருக்கிறீர்
  rationale: முன்பு நிகழ்ந்த இறைவார்த்தை தற்போதும் பொருந்துகிறது என்பதை நிறைவு வினை வடிவில் காட்டுகிறது; ‘வாக்குறுதி அளித்தீர்’ என்று விளக்கமாக மாற்றவில்லை.
- source_word: עַל עַבְדְּךָ
  choice: உமது அடியேனைக் குறித்து
  rationale: עַל என்பதன் பொருளை ‘குறித்து’ எனத் தருகிறது; עֶבֶד என்பது இங்கு கடவுளிடம் பேசுபவரின் தாழ்மையான தற்சுட்டாக இருப்பதால் ‘அடியேன்’ பொருத்தமானது.
- source_word: הַטּוֹבָה הַזֹּאת
  choice: இந்த நன்மையான காரியத்தை
  rationale: சொற்றொடரின் ‘இந்த நல்லது/நன்மையானது’ என்ற வெளிப்பாட்டை தமிழில் பெயர்ச்சொல் தேவைப்படுவதால் ‘காரியம்’ சேர்த்து இயல்பாக்குகிறது; சூழலில் வாக்குறுதியைக் குறித்தாலும் அதை முதன்மை உரையில் வெளிப்படையாகச் சேர்க்கவில்லை.
theological_decisions:
- issue: יְהוָה என்ற இறைபெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரை நான்கு எழுத்து இறைபெயரை நேரடியாகப் பயன்படுத்துவதால், உடன்படிக்கைப் பெயரைப் பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: הַטּוֹבָה הַזֹּאת என்பதன் சூழல்சார் பொருள்
  choice: இந்த நன்மையான காரியம்
  alternative: இந்த நல்ல வாக்குறுதி
  rationale: சூழல் இதை ஒரு வாக்குறுதியாகப் புரிந்துகொள்ள இடமளிக்கிறது; ஆனால் எபிரெயச் சொற்றொடர் நேரடியாக ‘வாக்குறுதி’ என்று சொல்லாததால் அந்த விளக்கம் அடிக்குறிப்பில் வைக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான செப மொழிநடை பயன்படுத்தப்பட்டுள்ளது. கடவுளை நோக்கிய மரியாதைப் பன்மை தக்கவைக்கப்பட்டுள்ளது; ‘அடியேன்’ இங்கு தாழ்மையான தற்சுட்டாக இயல்பாக அமைகிறது.
