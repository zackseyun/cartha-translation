source:
  edition: WLC
  text: וַ/יְהִ֕י כַּ/אֲשֶׁ֛ר יָשַׁ֥ב דָּוִ֖יד בְּ/בֵית֑/וֹ וַ/יֹּ֨אמֶר דָּוִ֜יד אֶל נָתָ֣ן הַ/נָּבִ֗יא הִנֵּ֨ה אָנֹכִ֤י יוֹשֵׁב֙ בְּ/בֵ֣ית הָֽ/אֲרָזִ֔ים וַ/אֲר֥וֹן בְּרִית יְהוָ֖ה תַּ֥חַת יְרִיעֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/001.yaml
  text: It happened[a], when David was living in his house, that David said to Nathan the prophet, “Look, I am living in a house of cedar, but the ark of the covenant of Yahweh is under curtains.”
translation:
  language: ta
  text: தாவீது தன் வீட்டில் குடியிருந்தபோது, தாவீது நாத்தான் தீர்க்கதரிசியிடம், “பாருங்கள், நான் கேதுரு மரத்தால் ஆன வீட்டில் குடியிருக்கிறேன்; ஆனால் யாவேயின் உடன்படிக்கைப் பெட்டியோ திரைத் துணிகளின் கீழ் இருக்கிறது[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கூடாரத் திரைகளின் கீழ்.’ எபிரேயச் சொல் துணியால் ஆன திரைகளைக் குறிக்கிறது; குறிப்பாக அது கூடாரம் அல்லது திருக்கூடாரத்தின் திரைகளைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: …குடியிருந்தபோது
  rationale: இது புதிய நிகழ்வை அறிமுகப்படுத்தும் எபிரெயக் கதைத் தொடர். தனியாக ஒரு செயற்கையான தொடக்கச் சொற்றொடரைச் சேர்க்காமல், காலநிலைத் துணைவாக்கியமாக இயல்பான தமிழில் தரப்பட்டுள்ளது.
- source_word: יָשַׁב ... יוֹשֵׁב
  choice: குடியிருந்தபோது … குடியிருக்கிறேன்
  rationale: ישׁב என்பதற்கு ‘உட்கார்’, ‘வசித்திரு’, ‘குடியிரு’ ஆகிய பொருள்கள் உண்டு. வீடு சார்ந்த இச்சூழலில் ‘குடியிரு’ பொருத்தமானது; மூலத்தின் சொல் மீளுருவாக்கமும் காக்கப்படுகிறது.
- source_word: בְּבֵיתוֹ / בְּבֵית הָאֲרָזִים
  choice: தன் வீட்டில் / கேதுரு மரத்தால் கட்டப்பட்ட வீட்டில்
  rationale: மூலத்தில் இருமுறையும் ‘வீடு’ என்ற சொல்லே வருவதால், அரச மாளிகை என விளக்கமாக மாற்றாமல் அதன் சொல்லியல் எதிர்மறை ஒப்பீடு காக்கப்படுகிறது. ‘கேதுரு மரத்தால் கட்டப்பட்ட’ என்பது பொருளைத் தெளிவாகச் சொல்லும் இயல்பான தமிழ்.
- source_word: נָתָן הַנָּבִיא
  choice: தீர்க்கதரிசி நாத்தான்
  rationale: நாத்தானின் பெயரையும் அவருடைய பணியையும் நேரடியாகவும் வழக்கமான தமிழிலும் தருகிறது.
- source_word: הִנֵּה
  choice: பாருங்கள்
  rationale: கவனத்தை ஈர்க்கும் எபிரெய இடைச்சொல்லை, நாத்தானை நோக்கிய மரியாதையான நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַאֲרוֹן בְּרִית יְהוָה
  choice: ஆனால் யாவேயின் உடன்படிக்கைப் பெட்டியோ
  rationale: ו என்பது வடிவத்தில் பொதுவான இணைப்புச்சொல் என்றாலும், தாவீதின் வீட்டுக்கும் பெட்டியின் உறைவிடத்துக்கும் இடையிலான தெளிவான முரண்பாட்டை இங்கு ‘ஆனால் … ஓ’ வெளிப்படுத்துகிறது. אֲרוֹן என்பது இச்சூழலில் புனித உடன்படிக்கைப் பெட்டி.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருப்பெயரை ஒரு பொதுப் பட்டமாக மாற்றாமல், எபிரெய தனிப்பெயரின் பரவலாக ஏற்றுக்கொள்ளப்பட்ட தமிழாக்கமாகத் தருகிறது.
- source_word: תַּחַת יְרִיעוֹת
  choice: திரைத் துணிகளின் கீழ்
  rationale: יְרִיעוֹת என்பது துணியால் ஆன திரைகள் அல்லது விரிப்புகளைக் குறிக்கிறது; கூடாரத் திரைகள் என்பது சாத்தியமான சூழல்சார் விளக்கம் என்பதால் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / ஆண்டவர்
  rationale: மூல வசனம் பட்டத்தை அல்ல, நான்கெழுத்துத் தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. ஆகவே தனிப்பெயரின் தன்மை காக்கப்படுகிறது.
- issue: וַאֲרוֹן என்பதிலுள்ள இணைப்பின் உறவு
  choice: ஆனால் … பெட்டியோ
  alternative: மேலும் உடன்படிக்கைப் பெட்டி
  rationale: எளிய ו இணைப்புச் சொல்லாக இருந்தாலும், தாவீதின் கேதுரு வீட்டுக்கும் பெட்டியின் துணி உறைவிடத்துக்கும் இடையே அவர் சுட்டும் பதற்றம் முரண்பாட்டுக்குரியது. ‘ஆனால்’ அதை வெளிப்படுத்துகிறது; புதிய இறையியல் முடிவொன்றைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன தரத் தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பானதும் கண்ணியமானதும். ‘வீடு’ மற்றும் ‘குடியிரு’ என்ற மூலச் சொல் மீளுருவாக்கங்கள் முடிந்தவரை காக்கப்பட்டுள்ளன. அடிக்குறிப்பு குறியீடு அது விளக்கும் ‘திரைத் துணிகள்’ என்ற சொற்றொடருக்குப் பின் வைக்கப்பட்டுள்ளது.
