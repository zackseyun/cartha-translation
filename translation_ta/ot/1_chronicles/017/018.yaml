  text: מַה יּוֹסִ֨יף ע֥וֹד דָּוִ֛יד אֵלֶ֖י/ךָ לְ/כָב֣וֹד אֶת עַבְדֶּ֑/ךָ וְ/אַתָּ֖ה אֶֽת עַבְדְּ/ךָ֥ יָדָֽעְתָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/018.yaml
  text: What more can David add before you for honoring your servant? You know your servant.
translation:
  language: ta
  text: உமது அடியவனைக் கௌரவித்ததற்காக[b] தாவீது உம்மிடம் இன்னும் என்ன சேர்க்க முடியும்?[a] உமது அடியவனை நீர் அறிந்திருக்கிறீர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உமது அடியவனைக் கௌரவித்ததைக் குறித்து தாவீது உம்மிடம் இன்னும் என்ன சொல்ல முடியும்?” வாசிப்பை இயல்பாக்குவதற்காகச் சில மொழிபெயர்ப்புகள் “சொல்ல” என்பதைச் சேர்க்கின்றன; அந்த வினை எபிரெய மூலத்தில் வெளிப்படையாக இல்லை.
    reason: lexical_alternative
  - marker: b
    text: “உமது அடியவனைக் கௌரவித்ததற்காக” என்று மொழிபெயர்க்கப்பட்டுள்ள எபிரெயச் சொற்றொடர் பொருள் காண்பதற்குக் கடினமானது. அதை “உமது அடியவனின் கௌரவத்திற்காக” அல்லது “உமது அடியவனைக் கௌரவிப்பதற்கு” என்றும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: מַה
  choice: என்ன
  rationale: மேலும் எதைச் சேர்க்க முடியும் என்ற சொல்லாட்சிக் கேள்வியை இயல்பான தமிழில் அறிமுகப்படுத்துகிறது.
- source_word: יוֹסִיף עוֹד
  choice: இன்னும் என்ன சேர்க்க முடியும்
  rationale: יסף உடன் עוד வருவது ‘மேலும் சேர்த்தல்’ என்ற பொருளைத் தருகிறது. எபிரெயத்தில் வெளிப்படையாக இல்லாத ‘சொல்ல’ என்பதை முதன்மை உரையில் சேர்க்காமல், அதன் சுருக்கத்தையும் வினாவையும் காக்கிறது.
- source_word: דָּוִיד
  choice: தாவீது
  rationale: தமிழில் வழக்கில் உள்ள பெயர் வடிவம்.
- source_word: אֵלֶיךָ
  choice: உம்மிடம்
  rationale: தேவனை நேரடியாக நோக்கிப் பேசும் சூழலில் ‘உம்மிடம்’ என்பது ‘உமக்கு/உம்மை நோக்கி’ என்ற இயக்கத்தையும் உரையாடல் உறவையும் இயல்பாக வெளிப்படுத்துகிறது; ‘உமது முன்னிலையில்’ என்பதைக் காட்டிலும் மூலத்தின் אֵל என்பதற்கு நெருக்கமானது.
- source_word: לְכָבוֹד אֶת עַבְדֶּךָ
  choice: உமது அடியவனைக் கௌரவித்ததற்காக
  rationale: சுருக்கமானதும் இலக்கண ரீதியாகக் கடினமானதுமான சொற்றொடரை, சூழலில் தேவன் தமது அடியவனாகிய தாவீதுக்கு அளித்த கனத்தைக் குறிக்கும் வகையில் வாசிக்கத்தக்க தமிழில் தருகிறது; மாற்று இலக்கணப் புரிதல்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: עַבְדֶּךָ
  choice: உமது அடியவன்
  rationale: தாவீது தன்னைத் தேவனுடைய பணிவான சேவகனாகக் குறிப்பிடும் அரச விண்ணப்பச் சூழலுக்கு ‘அடியவன்’ இயல்பானதும் மரியாதைமிக்கதுமான தமிழ் வடிவம்.
- source_word: וְאַתָּה אֶת עַבְדְּךָ יָדָעְתָּ
  choice: உமது அடியவனை நீர் அறிந்திருக்கிறீர்
  rationale: எபிரெய நிறைவுவினையின் நிலைத்த அறிவு உணர்வை ‘அறிந்திருக்கிறீர்’ வெளிப்படுத்துகிறது. וְ இணைப்பைத் தமிழில் தனியே மொழிபெயர்க்காவிட்டாலும் தொடர்ச்சி தெளிவாக உள்ளது.
theological_decisions:
- issue: לְכָבוֹד אֶת עַבְדֶּךָ என்ற கடினமான சொற்றொடரின் பொருள்
  choice: தேவன் தமது அடியவனைக் கௌரவித்தார் என்பதாக, ‘உமது அடியவனைக் கௌரவித்ததற்காக’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘உமது அடியவனின் கனத்திற்காக’ அல்லது ‘உமது அடியவனைக் கௌரவிப்பதற்கு’
  rationale: சூழலில் தேவன் தாவீதுக்குக் காட்டிய பெருமையை எண்ணி அவர் வியக்கிறார். தேர்ந்தெடுக்கப்பட்ட வாசிப்பு அதைக் தெளிவாகக் காட்டினாலும், எபிரெயச் சொற்றொடரின் உண்மையான இலக்கணத் தெளிவின்மையை அடிக்குறிப்பு ஒப்புக்கொள்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் மரியாதை ஒருமை (‘உமது’, ‘நீர்’) பயன்படுத்தப்பட்டுள்ளது. ‘அடியவன்’ ஜெபச் சூழலுக்குரிய பணிவையும் கண்ணியத்தையும் காக்கிறது. மூலத்தில் இல்லாத ‘சொல்ல’ முதன்மை உரையில் சேர்க்கப்படவில்லை; கடினமான כבוד சொற்றொடர் வாசிக்கத்தக்கவாறு மொழிபெயர்க்கப்பட்டு அதன் மாற்று வாசிப்புகள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
