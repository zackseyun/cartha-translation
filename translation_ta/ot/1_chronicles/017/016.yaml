reference: 1 Chronicles 17:16
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יָּבֹא֙ הַ/מֶּ֣לֶךְ דָּוִ֔יד וַ/יֵּ֖שֶׁב לִ/פְנֵ֣י יְהוָ֑ה וַ/יֹּ֗אמֶר מִֽי אֲנִ֞י יְהוָ֤ה אֱלֹהִים֙ וּ/מִ֣י בֵיתִ֔/י כִּ֥י הֲבִיאֹתַ֖/נִי עַד הֲלֹֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/016.yaml
  text: Then King David went in and sat before Yahweh and said[a], “Who am I, O Yahweh God, and what is my house, that you have brought me this far?”
translation:
  language: ta
  text: பின்பு தாவீது அரசர் உள்ளே சென்று, யாவேயின் முன்னிலையில் அமர்ந்து, “யாவே இறைவனே, நான் யார்? என் வீடு என்ன? நீர் என்னை இவ்வளவு தூரம் கொண்டுவந்ததற்கு?” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: உள்ளே சென்று
  rationale: בוא என்பது ‘வருதல்,’ ‘செல்லுதல்,’ ‘நுழைதல்’ ஆகிய பொருள்களைத் தரலாம். இச்சூழலில் தாவீது இறைமுன்னிலைக்குச் சென்றதை இயல்பான தமிழில் ‘உள்ளே சென்று’ எனக் கூறுகிறது; இடத்தைத் தேவையின்றி குறிப்பாக்கவில்லை.
- source_word: הַמֶּלֶךְ דָּוִיד
  choice: தாவீது அரசர்
  rationale: தமிழின் இயல்பான மரியாதைமிக்க பெயர்-பட்ட வரிசையில் மொழிபெயர்க்கப்பட்டது.
- source_word: וַיֵּשֶׁב
  choice: அமர்ந்து
  rationale: ישב என்பதற்கு ‘அமர்தல்,’ ‘தங்குதல்,’ ‘குடியிருத்தல்’ எனப் பொருள் இருக்கலாம்; முந்தைய ‘உள்ளே சென்று’ என்ற செயலுக்குப் பின் இங்கு நேரடியான ‘அமர்ந்து’ என்பதே பொருத்தமானது.
- source_word: לִפְנֵי יְהוָה
  choice: யாவேயின் முன்னிலையில்
  rationale: இச்சொற்றொடர் இடநிலையையும் இறைசந்நிதி என்ற கருத்தையும் கொண்டுள்ளது. ‘முன்னிலையில்’ என்பது நவீன தமிழில் இயல்பாக இரண்டையும் வெளிப்படுத்துகிறது.
- source_word: יְהוָה אֱלֹהִים
  choice: யாவே இறைவனே
  rationale: நேரடி விளிப்பைத் தமிழின் விளிவேற்றுமையால் தெளிவாக்குகிறது; יהוה தனிப்பெயராகவும் אֱלֹהִים இறைப்பட்டமாகவும் வேறுபடுத்தப்பட்டுள்ளன.
- source_word: מִי אֲנִי
  choice: நான் யார்?
  rationale: தாவீதின் தாழ்மையையும் தகுதியின்மை உணர்வையும் இயல்பாகவும் நேரடியாகவும் வெளிப்படுத்துகிறது.
- source_word: וּמִי בֵיתִי
  choice: என் குடும்பம் எம்மாத்திரம்?
  rationale: எபிரெயத்தில் ‘யார்’ என்பது மீண்டும் வந்தாலும், தமிழில் குடும்பத்தைப் பற்றி ‘எம்மாத்திரம்?’ என்பது இயல்பான தாழ்மை வினா. בַּיִת என்பதன் குடும்பம்/வீட்டார்/அரச வம்சம் என்ற பரப்பை அடிக்குறிப்பு பாதுகாக்கிறது.
- source_word: הֲבִיאֹתַנִי
  choice: நீர் என்னைக் கொண்டுவந்திருக்கிறீர்
  rationale: בוא என்பதன் ஹிஃபில் வடிவிலுள்ள காரணவினைப் பொருளை ‘கொண்டுவந்திருக்கிறீர்’ தெளிவாகத் தருகிறது; இதுவரை நிகழ்ந்த இறை வழிநடத்தலின் தற்போதைய விளைவையும் காட்டுகிறது.
- source_word: עַד הֲלֹם
  choice: இந்த நிலைவரை
  rationale: தாவீது அடைந்துள்ள வாழ்க்கை மற்றும் அரச நிலையின் எல்லையைக் குறிக்கிறது. ‘இந்த நிலைவரை’ என்பது ‘இவ்வளவு தூரம்’ என்பதைவிட இச்சூழலில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் உடன்படிக்கையின் தனிப்பெயரான יהוה நேரடியாக வருகிறது. அதை ஒரு பொதுப் பட்டமாக மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்ப்பது பெயரின் தனித்தன்மையைப் பாதுகாக்கிறது.
- issue: தாவீதின் ‘வீடு’ என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘குடும்பம்’; அடிக்குறிப்பில் வீட்டார் மற்றும் அரச வம்சம் ஆகிய பொருள் வாய்ப்புகள்
  alternative: வீடு / வம்சம்
  rationale: உடனடி சூழல் தாவீதின் குடும்பத்தையும் தொடரவிருக்கும் அரச மரபையும் குறிக்கிறது. ‘குடும்பம்’ பொதுவாசகருக்கு இயல்பானது; ஆனால் ‘வம்சம்’ என மட்டும் கூறுவது பொருளை அளவுக்கு மீறிக் குறுக்கும் என்பதால் அதன் விரிந்த பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், வழிபாட்டு மரியாதை குன்றாத எளிய நடையில் அமைக்கப்பட்டது. தாவீதின் வியப்பை இயல்பாக வெளிப்படுத்த இறுதி கூற்று வியப்புக்குறியுடன் தரப்பட்டுள்ளது; மூலத்தின் வினா அமைப்பும் இறுதிக் காரண/விளைவு உறவும் பாதுகாக்கப்பட்டுள்ளன.
