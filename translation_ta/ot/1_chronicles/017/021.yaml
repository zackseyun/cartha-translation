  text: וּ/מִי֙ כְּ/עַמְּ/ךָ֣ יִשְׂרָאֵ֔ל גּ֥וֹי אֶחָ֖ד בָּ/אָ֑רֶץ אֲשֶׁר֩ הָלַ֨ךְ הָ/אֱלֹהִ֜ים לִ/פְדּ֧וֹת ל֣/וֹ עָ֗ם לָ/שׂ֤וּם לְ/ךָ֙ שֵׁ֚ם גְּדֻלּ֣וֹת וְ/נֹרָא֔וֹת לְ/גָרֵ֗שׁ מִ/פְּנֵ֧י עַמְּ/ךָ֛ אֲשֶׁר פָּדִ֥יתָ מִ/מִּצְרַ֖יִם גּוֹיִֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/021.yaml
  text: And who is like your people Israel[a], one nation on the earth, whom God went to redeem for himself as a people, to make for yourself a name by great and fearsome deeds, driving out nations from before your people[b], whom you redeemed from Egypt?
translation:
  language: ta
  text: உமது மக்களாகிய இஸ்ரவேலைப் போன்றவர் யார்? பூமியில் ஒரே தேசமாகிய இஸ்ரவேலைத் தமக்கென ஒரு மக்களாக மீட்டுக்கொள்ளக் கடவுள் சென்றார்; உமக்கென ஒரு பெயரை ஏற்படுத்துவதற்காக மகத்தான, அச்சமூட்டும் செயல்களைச் செய்து[a], எகிப்திலிருந்து நீர் மீட்ட உமது மக்களுக்கு முன்னிலிருந்து தேசங்களைத் துரத்தினார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மகத்தான, வியப்பும் அச்சமும் தரும் காரியங்களைச் செய்து.”
    reason: lexical_alternative
  - marker: b
    text: எபிரேயத்தில், “உமது மக்களுக்கு முன்னிலிருந்து ... தேசங்களைத் துரத்தி” என உள்ளது. இறுதிப் பகுதியின் தொடரமைப்பு கடினமானது; 2 சாமுவேல் 7:23-இல் உள்ள இணையான உரையிலும் வாசகச் சிக்கல் காணப்படுகிறது.
    reason: textual_variant
lexical_decisions:
- source_word: וּמִי כְעַמְּךָ יִשְׂרָאֵל
  choice: உமது மக்களாகிய இஸ்ரவேலைப் போன்றவர் யார்?
  rationale: מִי என்பதன் ‘யார்?’ என்ற நேரடியான வினாவையும், இஸ்ரவேல் கடவுளுடைய மக்கள் என்ற உறவையும் காக்கிறது.
- source_word: גּוֹי אֶחָד בָּאָרֶץ
  choice: பூமியில் ஒரே ஒரு தேசமான
  rationale: ‘பூமியில் ஒரு தேசம்’ என்ற வடிவத்தையும் ஒப்பற்ற தன்மையைக் குறிக்கும் சூழலையும், ‘தனித்துவமான’ என்று மிகையாக விளக்காமல் வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר הָלַךְ הָאֱלֹהִים
  choice: அவர்களைத் ... கடவுள் சென்றார்
  rationale: הלך என்பதில் உள்ள கடவுளின் தீர்மானமான இயக்கச் சித்திரத்தை மென்மைப்படுத்தாமல் காக்கிறது.
- source_word: לִפְדּוֹת לוֹ עָם
  choice: தமக்கென ஒரு மக்களாக மீட்டுக்கொள்ள
  rationale: פדה என்பதற்கு ‘மீட்டுக்கொள்ள’ என்றும், மீட்பின் விளைவாக அவர்கள் கடவுளுக்குரிய மக்களாவதையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: לָשׂוּם לְךָ שֵׁם
  choice: உமக்கென ஒரு பெயரை ஏற்படுத்துவதற்காக
  rationale: கடவுளின் மீட்புச் செயல்கள் அவருடைய புகழை நிலைநாட்டுகின்றன என்ற எபிரேய மரபுத்தொடரின் பொருளைத் தக்கவைக்கிறது.
- source_word: גְּדֻלּוֹת וְנוֹרָאוֹת
  choice: மகத்தான, அச்சமூட்டும் செயல்கள்
  rationale: பெயர்ச்சொல் வெளிப்படையாக இல்லாத எபிரேய தொடரை தமிழில் முழுமையாக்க ‘செயல்கள்’ சேர்க்கப்பட்டுள்ளது; נוראות குறிக்கும் வியப்பும் அச்சமும் காக்கப்படுகின்றன.
- source_word: לְגָרֵשׁ מִפְּנֵי עַמְּךָ
  choice: உமது மக்களுக்கு முன்பாகப் ... துரத்தினார்
  rationale: מִפְּנֵי என்பதன் இடவியல் உருவகத்தையும், לְגָרֵשׁ என்பதன் வெளியேற்றும் வலிமையையும் தக்கவைக்கிறது.
- source_word: אֲשֶׁר פָּדִיתָ מִמִּצְרַיִם
  choice: எகிப்திலிருந்து நீர் மீட்ட
  rationale: கடவுளை நேரடியாக இரண்டாம் நபரில் அழைக்கும் எபிரேய மாற்றத்தைப் பாதுகாக்கிறது.
- source_word: גּוֹיִם
  choice: பிற தேசங்கள்
  rationale: பன்மை ‘தேசங்கள்’ என்பதைக் காக்கிறது; தமிழில் இஸ்ரவேலிலிருந்து அவற்றைத் தெளிவாக வேறுபடுத்த ‘பிற’ சேர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: לָשׂוּם לְךָ שֵׁם என்பதில் கடவுள் தமக்குப் பெயரை ஏற்படுத்துதல்
  choice: உமக்கென ஒரு பெயரை ஏற்படுத்துவதற்காக
  alternative: உமக்குப் புகழை உண்டாக்குவதற்காக
  rationale: ‘பெயர்’ என்ற மூல உருவகத்தைப் பாதுகாத்து, கடவுளின் செயல்கள் அவருடைய புகழை நிறுவுகின்றன என்ற பதற்றத்தை மென்மைப்படுத்தவில்லை.
- issue: נוראות என்பதன் அச்சமும் வியப்பும்
  choice: அச்சமூட்டும்
  alternative: வியப்பூட்டும்; பயங்கரமான
  rationale: வெறும் வியப்பாகக் குறைக்காமலும், முற்றிலும் பயங்கரமானதாக மிகைப்படுத்தாமலும் தெய்வீகச் செயல்கள் எழுப்பும் அச்சத்தை வெளிப்படுத்துகிறது.
- issue: மூன்றாம் நபர் ‘கடவுள்’ என்பதிலிருந்து இரண்டாம் நபர் ‘உமக்கு/நீர்’ என்பதற்கான மாற்றம்
  choice: மூலத்தில் உள்ள நபர் மாற்றத்தைத் தக்கவைத்தல்
  alternative: முழுவதையும் இரண்டாம் நபராக ஒருமைப்படுத்துதல்
  rationale: எபிரேய உரையின் சொல்லாட்சித் திருப்பத்தையும் நேரடி வேண்டுதல் மொழியையும் விளக்கிச் சீராக்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான, மரியாதைமிக்க தமிழில் கடவுளை ‘உமது/நீர்’ என உயர்திணை ஒருமையில் அழைக்கிறது. நீண்ட எபிரேய வாக்கியம் வாசிப்புத் தெளிவுக்காக அரைப்புள்ளியால் பிரிக்கப்பட்டுள்ளது; ஆனால் அதன் வினாவும் நபர் மாற்றங்களும் காக்கப்பட்டுள்ளன.
