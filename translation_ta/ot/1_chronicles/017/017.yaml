base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/017.yaml
  text: And this was a small thing in your eyes[a], O God; yet you have spoken concerning your servant’s house for a long time to come, and you have regarded me according to the rank of man on high, O Yahweh God.
translation:
  language: ta
  text: இது உமது பார்வையில் சிறிய காரியமாக இருந்தது, கடவுளே; ஆனாலும், உமது அடியானின் வீட்டைக் குறித்து, தொலைதூர எதிர்காலத்திற்கும் பேசியிருக்கிறீர். உயர்நிலையில் உள்ள மனிதனுக்குரிய தரத்தின்படி என்னைக் கருதியிருக்கிறீர்[a], யாவே கடவுளே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மனிதர்களின் வருங்காலத் தலைமுறைகளை எனக்குக் காட்டியிருக்கிறீர்,” அல்லது, “உயர்ந்த நிலையிலுள்ள மனிதனாக என்னைக் கருதியிருக்கிறீர்.” இறுதித் தொடரின் எபிரெய வாசகம் கடினமானது; அதைப் பலவிதமாகப் புரிந்துகொள்ள முடியும்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּקְטַן זֹאת בְּעֵינֶיךָ
  choice: இது உமது பார்வையில் சிறிய காரியமாக இருந்தது
  rationale: எபிரெய மதிப்பீட்டு மரபுத்தொடரின் பொருளையும் ‘சிறியது’ என்ற קטן சொல்லின் அடிப்படை உருவகத்தையும் இயல்பான தமிழில் காக்கிறது.
- source_word: אֱלֹהִים
  choice: கடவுளே
  rationale: தாவீது கடவுளை நேரடியாக அழைப்பதால் விளிவேற்றுமை வடிவம் பயன்படுத்தப்படுகிறது.
- source_word: וַתְּדַבֵּר עַל בֵּית עַבְדְּךָ
  choice: உமது அடியானின் வீட்டைக் குறித்துப் பேசியிருக்கிறீர்
  rationale: דבר על என்பதன் அடிப்படைப் பொருளான ‘குறித்துப் பேசுதல்’ என்பதைக் காக்கிறது; வாக்குறுதியின் தன்மையைச் சூழல் வெளிப்படுத்த விடுகிறது.
- source_word: לְמֵרָחוֹק
  choice: வருங்காலத்தில் வெகுதொலைவு வரை
  rationale: தாவீதின் வீட்டைப் பற்றிய தொலைதூர எதிர்காலத்தைக் குறிக்கும் காலப் பொருளைத் தெளிவாக்குகிறது.
- source_word: וּרְאִיתַנִי
  choice: என்னைக் கருதியிருக்கிறீர்
  rationale: ראה இங்கு வெறுமனே காண்பதைவிட ஒருவரை ஒரு குறிப்பிட்ட நிலையில் மதித்தல் அல்லது நடத்துதல் என்ற பொருளைக் கொண்டுள்ளது.
- source_word: כְּתוֹר הָאָדָם הַמַּעֲלָה
  choice: உயர்நிலையில் உள்ள மனிதனின் தரத்தின்படி
  rationale: மிகவும் கடினமான இத்தொடரில் תור என்பதன் ஒழுங்கு அல்லது தரநிலை சார்ந்த நுணுக்கத்தையும் מעלה என்பதன் உயர்ந்த நிலை சார்ந்த பொருளையும் அதிகமாகத் தீர்மானிக்காமல் காக்கிறது.
- source_word: יְהוָה אֱלֹהִים
  choice: யாவே கடவுளே
  rationale: தெய்வீகப் பெயரை ‘யாவே’ என்று ஒலிபெயர்த்து, நேரடி அழைப்பை விளிவேற்றுமையால் காட்டுகிறது.
theological_decisions:
- issue: וּרְאִיתַנִי כְּתוֹר הָאָדָם הַמַּעֲלָה என்ற தெளிவற்ற இறுதித் தொடரின் பொருள்
  choice: உயர்நிலையில் உள்ள மனிதனின் தரத்தின்படி என்னைக் கருதியிருக்கிறீர்
  alternative: மனிதர்களின் வருங்காலத் தலைமுறைகளை எனக்குக் காட்டியிருக்கிறீர்; அல்லது உயர்ந்த நிலையிலுள்ள மனிதனாக என்னைக் கருதியிருக்கிறீர்
  rationale: மசோரா உரை நிலையானதாக இருந்தாலும் தொடரின் சொற்பொருளும் இலக்கண உறவுகளும் தெளிவற்றவை. முதன்மை மொழிபெயர்ப்பு எபிரெயச் சொற்களுக்கு நெருக்கமாக இருந்து உயர்த்தப்பட்ட நிலை என்ற சாத்தியமான கருத்தைக் காக்கிறது; மற்ற முக்கிய வாசிப்புகள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ். கடவுளை நோக்கிய மரியாதைப் பன்மை முழுவதும் பயன்படுத்தப்பட்டுள்ளது. ‘வீடு’ என்பது இங்கு குடும்ப மரபு அல்லது வம்சத்தையும் உள்ளடக்கும் எபிரெய உருவகமாக அப்படியே வைக்கப்பட்டுள்ளது; தெளிவற்ற இறுதித் தொடர் உரையில் அளவுக்கு மீறி விளக்கப்படாமல், மாற்று வாசிப்புகள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.
