source:
  edition: WLC
  text: וְ/הָיָ֗ה כִּֽי מָלְא֤וּ יָמֶ֨י/ךָ֙ לָ/לֶ֣כֶת עִם אֲבֹתֶ֔י/ךָ וַ/הֲקִֽימוֹתִ֤י אֶֽת זַרְעֲ/ךָ֙ אַחֲרֶ֔י/ךָ אֲשֶׁ֥ר יִהְיֶ֖ה מִ/בָּנֶ֑י/ךָ וַ/הֲכִינוֹתִ֖י אֶת מַלְכוּתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/011.yaml
  text: And it shall be[a], when your days are fulfilled to go to be with your fathers, that I will raise up your offspring after you, who shall be one of your sons, and I will establish his kingdom.
translation:
  language: ta
  text: உன் நாட்கள் நிறைவடைந்து, நீ உன் முன்னோர்களுடன் செல்லும் வேளையில்[a], உனக்குப் பின் உன் சந்ததியை நான் எழுப்புவேன்; அவன் உன் மகன்களில் ஒருவனாக இருப்பான்; அவனுடைய அரசை நான் நிலைநிறுத்துவேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “உன் முன்னோர்களுடன் செல்ல.” இது ஒருவர் இறந்து தம் முன்னோர்களுடன் சேர்வதைக் குறிக்கும் எபிரெய மரபுத்தொடர்.'
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: காலம் வரும்போது
  rationale: எதிர்காலத்தில் நிகழவிருப்பதை அறிமுகப்படுத்தும் எபிரெயத் தொடரை, தமிழில் இயல்பான காலவாக்கியமாகத் தருகிறது.
- source_word: מָלְאוּ יָמֶיךָ
  choice: உன் நாட்கள் நிறைவடைந்து
  rationale: வாழ்நாள் முடிவடைவதைக் குறிக்கும் மூலமொழியின் கண்ணியமான உருவகத்தைத் தக்கவைக்கிறது.
- source_word: לָלֶכֶת עִם אֲבֹתֶיךָ
  choice: நீ உன் முன்னோர்களுடன் செல்லும்
  rationale: நாளாகமத்தில் காணப்படும் ‘முன்னோர்களுடன் செல்லுதல்’ என்ற தனிப்பட்ட சொல்லாட்சியைப் பாதுகாக்கிறது; அதன் மரணக் குறிப்பை அடிக்குறிப்பு விளக்குகிறது.
- source_word: וַהֲקִימוֹתִי
  choice: நான் எழுப்பி
  rationale: தாவீதுக்குப் பின் ஒரு வாரிசைத் தோன்றச்செய்வதை இங்கு קום என்பதன் காரணவினை வடிவம் குறிக்கிறது; பின்னர் வரும் הכין என்பதிலிருந்து இதை வேறுபடுத்துகிறது.
- source_word: זַרְעֲךָ
  choice: உன் சந்ததியை
  rationale: தனியொருவரைக் குறிக்கும் இச்சூழலில், זרע என்பதன் வம்சவழிப் பொருளை நவீன தமிழில் தெளிவாகத் தருகிறது.
- source_word: אַחֲרֶיךָ
  choice: உனக்குப் பின்
  rationale: கால வரிசையையும் அரசவழி வாரிசுரிமையையும் சுருக்கமாகவும் நேரடியாகவும் தெரிவிக்கிறது.
- source_word: אֲשֶׁר יִהְיֶה מִבָּנֶיךָ
  choice: உன் மகன்களில் ஒருவனாக இருப்பவனை
  rationale: மின் என்ற முன்னிடைச்சொல்லின் பகுதிப்பொருளையும், வாக்குறுதியளிக்கப்பட்ட சந்ததி தாவீதின் மகன்களில் ஒருவன் என்பதையும் வெளிப்படையாகக் காட்டுகிறது.
- source_word: וַהֲכִינוֹתִי
  choice: நிலைநிறுத்துவேன்
  rationale: அரசை உறுதியாக நிறுவி நிலைக்கச்செய்வது என்ற הכין என்பதன் உடன்படிக்கைச் சூழல் பொருளைத் தருகிறது.
- source_word: מַלְכוּתוֹ
  choice: அவனுடைய அரசை
  rationale: அரசுரிமையையும் ஆட்சிக்குரிய அரசையும் உள்ளடக்கும் dynastic பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: தாவீதின் வம்சத்துக்கான வாக்குறுதியும் மேசியாவைக் குறிக்கும் சாத்தியமான எதிரொலியும்
  choice: தாவீதின் சொந்த மகன்களில் ஒருவரான உடனடி வரலாற்று வாரிசைச் சுட்டும் சொல்லாட்சியை அப்படியே மொழிபெயர்த்தல்
  alternative: முதன்மை உரையிலேயே வெளிப்படையான மேசியா சார்ந்த பட்டத்தையோ விளக்கத்தையோ சேர்த்தல்
  rationale: வசனம் நேரடியாகத் தாவீதுக்குப் பின் அவன் மகன்களில் ஒருவனை எழுப்பி அவனுடைய அரசை நிலைநிறுத்துவதைப் பேசுகிறது. விரிவான வேதாகமச் சூழலில் மேசியா சார்ந்த முக்கியத்துவம் இருந்தாலும், அதை மொழிபெயர்ப்பில் கூடுதலாகச் சேர்க்காமல் உரையின் வரலாற்று மற்றும் இறையியல் விரிவைத் திறந்தவாறே வைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘நாட்கள் நிறைவடைதல்,’ ‘முன்னோர்களுடன் செல்லுதல்’ ஆகிய மூல உருவகங்கள் தக்கவைக்கப்பட்டுள்ளன; நீண்ட வாக்கியத்தின் உறவுத்தொடர் இடைக்கோடுகளால் தெளிவுபடுத்தப்பட்டுள்ளது.
