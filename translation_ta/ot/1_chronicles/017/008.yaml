source:
  edition: WLC
  text: וָֽ/אֶהְיֶ֣ה עִמְּ/ךָ֗ בְּ/כֹל֙ אֲשֶׁ֣ר הָלַ֔כְתָּ וָ/אַכְרִ֥ית אֶת כָּל אוֹיְבֶ֖י/ךָ מִ/פָּנֶ֑י/ךָ וְ/עָשִׂ֤יתִֽי לְ/ךָ֙ שֵׁ֔ם כְּ/שֵׁ֥ם הַ/גְּדוֹלִ֖ים אֲשֶׁ֥ר בָּ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/008.yaml
  text: And I have been with you wherever you have gone[a], and I have cut off all your enemies from before you[b], and I will make for you a name like the name of the great ones who are on the earth.
translation:
  language: ta
  text: நீ சென்ற இடமெல்லாம் நான் உன்னோடு இருந்தேன்; உன் எதிரிகள் அனைவரையும் உன் முன்னிலையிலிருந்து அகற்றினேன். பெருமைமிக்கவர்களின் பெயரைப் போல உனக்கென ஒரு பெயரை ஏற்படுத்துவேன்.[a] பூமியிலுள்ள[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உனக்கென ஒரு பெயரை ஏற்படுத்துவேன்” என்பது உன்னைப் புகழ்பெறச் செய்வதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “பூமியிலுள்ள” என்பதற்கு “நாட்டிலுள்ள” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶהְיֶה עִמְּךָ
  choice: நான் உன்னோடு இருந்தேன்
  rationale: ויהי என்ற தொடர்நிலை இறந்தகால வினை, இங்கு தாவீதுக்குக் கடந்த காலத்தில் கிடைத்த இறைத் துணையை நினைவுகூர்கிறது; עִמְּךָ என்பதன் நேரடியான பொருள் ‘உன்னோடு’.
- source_word: בְּכֹל אֲשֶׁר הָלַכְתָּ
  choice: நீ சென்ற இடமெல்லாம்
  rationale: எபிரெய மொழிமரபான ‘நீ சென்ற அனைத்திலும்’ என்பதன் இயல்பான தமிழ் வடிவம்; தாவீது சென்ற எல்லா இடங்களையும் குறிக்கிறது.
- source_word: וָאַכְרִית אֶת כָּל אוֹיְבֶיךָ
  choice: உன் எதிரிகள் அனைவரையும் ... அகற்றினேன்
  rationale: כרת என்பதன் அடிப்படை உருவகம் ‘துண்டித்தல்/ஒழித்தல்’; இச்சூழலில் எதிரிகளை வழியிலிருந்து நீக்கிய செயலை ‘அகற்றினேன்’ என்பது இயல்பாகவும் வன்முறையின் முறையை தேவையின்றி குறிப்பாக்காமலும் தெரிவிக்கிறது. כָּל வெளிப்படையாக இருப்பதால் ‘அனைவரையும்’ தக்கவைக்கப்பட்டுள்ளது.
- source_word: מִפָּנֶיךָ
  choice: உன் முன்னிலையிலிருந்து
  rationale: சொல்லுக்கு நெருக்கமாக ‘உன் முகத்திலிருந்து/உன் முன்னிலையிலிருந்து’; தாவீதின் முன்பாக இருந்த எதிரிகள் அகற்றப்பட்டதைக் காட்டும் இடவியல் உருவகத்தைத் தக்கவைக்கிறது.
- source_word: וְעָשִׂיתִי לְךָ שֵׁם
  choice: உனக்கும் ஒரு பெயரை ஏற்படுத்துவேன்
  rationale: வாக்குறுதி வரிசையில் இவ்வினைக்கு எதிர்கால வலிமை உள்ளது. שֵׁם என்பது பெயருடன் புகழ் அல்லது நற்பெயரையும் குறிக்கும்; மூல உருவகத்தைத் தக்கவைக்க ‘பெயர்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: כְּשֵׁם הַגְּדוֹלִים
  choice: பெருமைமிக்கவர்களின் பெயரைப்போல
  rationale: הַגְּדוֹלִים என்பது உயர்ந்தோர், புகழ்பெற்றோர் அல்லது செல்வாக்குடையோரைக் குறிக்கலாம். ‘பெருமைமிக்கவர்கள்’ பாலினத்தைச் சேர்க்காமல் அந்த விரிவைத் தக்கவைக்கிறது.
- source_word: אֲשֶׁר בָּאָרֶץ
  choice: பூமியிலுள்ள
  rationale: אֶרֶץ என்பதற்கு ‘பூமி’ அல்லது ‘நாடு’ என இரு பொருள்கள் இருக்கலாம். பரந்த புகழைச் சுட்டும் சூழலில் ‘பூமி’ முதன்மை உரையாகத் தேர்ந்தெடுக்கப்பட்டது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: இறைச் செயல்களின் கால வரிசை
  choice: முதல் இரண்டு செயல்கள் கடந்தகாலமாகவும் இறுதிச் செயல் எதிர்கால வாக்குறுதியாகவும் மொழிபெயர்க்கப்பட்டது.
  alternative: எல்லா வினைகளையும் கடந்தகாலமாகவோ எதிர்காலமாகவோ மொழிபெயர்த்தல்.
  rationale: தாவீதுக்கு ஏற்கெனவே அளிக்கப்பட்ட துணையும் எதிரிகளிடமிருந்து கிடைத்த விடுதலையும் நினைவுகூர்ந்த பின், அவருக்கு ஒரு பெயரை ஏற்படுத்துவதாகிய வாக்குறுதி வழங்கப்படுகிறது. இதுவே எபிரெய வினைத் தொடரையும் சுற்றியுள்ள வாக்குறுதிச் சூழலையும் சிறப்பாகப் பிரதிபலிக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் வேதாகமச் செறிவும் கொண்ட நடை. ‘பெயரை ஏற்படுத்துதல்’ என்ற எபிரெய உருவகம் பிரதான உரையில் தக்கவைக்கப்பட்டு, அதன் புகழ் சார்ந்த பொருள் அடிக்குறிப்பில் தெளிவுபடுத்தப்பட்டுள்ளது.
