base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/019.yaml
  text: O Yahweh[a], for the sake of your servant and according to your heart, you have done all this greatness[b], to make known all these great things.
translation:
  language: ta
  text: யாவே[a], உமது அடியேனுக்காகவும் உமது உள்ளத்தின்படியும், எல்லா மகத்தான செயல்களையும் தெரியப்படுத்துவதற்காக இந்த மகத்துவம் முழுவதையும் செய்தீர்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய தெய்வீகப் பெயரான YHWH-இன் தமிழ் வடிவம்; ‘யெகோவா’ என்றும் வழங்கப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் முதலில் ஒருமையில் ‘இந்த மகத்துவம் முழுவதும்’ என்றும், பின்னர் பன்மையில் ‘எல்லா மகத்தான செயல்கள்’ என்றும் வருகிறது. ஒருமை முழுமையான மகத்துவத்தைத் தொகுத்துக் குறிக்கலாம்; பன்மை அதன் வெளிப்பாடுகளைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தெய்வீகப் பெயரை பொதுவான பட்டப்பெயராக மாற்றாமல், தமிழில் நிலைபெற்றுள்ள பெயர்வடிவில் தருகிறது.
- source_word: בַּעֲבוּר עַבְדְּךָ
  choice: உமது அடியேனுக்காக
  rationale: இறைவனை நோக்கிப் பேசும் அரச ஜெபச் சூழலில் עבד குறிக்கும் பணிவையும் உறவையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וּכְלִבְּךָ
  choice: உமது உள்ளத்தின்படி
  rationale: எபிரெய மொழியின் ‘இதயம்’ உருவகத்தையும் அது குறிக்கும் உள்ளார்ந்த சித்தம் அல்லது நோக்கத்தையும் மிகையாக விளக்காமல் காக்கிறது.
- source_word: עָשִׂיתָ
  choice: செய்தீர்
  rationale: மரியாதை ஒருமையுடன் நிறைவுற்ற இறைச்செயலை இயல்பான தமிழில் குறிக்கிறது.
- source_word: כָּל הַגְּדוּלָּה הַזֹּאת
  choice: இந்த மகத்துவம் அனைத்தையும்
  rationale: மூலத்திலுள்ள ஒருமைச் சுருக்கப்பெயரான ‘மகத்துவம்’ என்பதைப் பாதுகாக்கிறது.
- source_word: לְהוֹדִיעַ
  choice: தெரியப்படுத்துவதற்காக
  rationale: ידע என்பதன் ஹிஃபில் காரணவினைப் பொருளான ‘அறியச் செய்தல்’ என்பதை தெளிவாகத் தருகிறது.
- source_word: כָּל הַגְּדֻלּוֹת
  choice: இந்த மகத்தான செயல்கள் அனைத்தையும்
  rationale: பன்மை வடிவத்தை இயல்பான தமிழில் வெளிப்படுத்தி, இறைவனுடைய மகத்துவத்தின் பல்வேறு வெளிப்பாடுகளைச் சுட்டுகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே
  rationale: தெய்வீகப் பெயரை ‘கர்த்தர்’ போன்ற பட்டப்பெயராக மாற்றாமல் பெயராகவே வைத்திருக்கிறது; தமிழில் பரவலாக அறியப்பட்ட வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- issue: ‘உமது இதயத்தின்படி’ என்ற மனிதஉருவக மொழி
  choice: உமது உள்ளத்தின்படி
  alternative: உமது சித்தத்தின்படி
  rationale: இறைவனுடைய உள்ளார்ந்த நோக்கத்தைக் குறிக்கும் மூல உருவகத்தைத் தக்கவைத்து, அதை வெறும் ‘சித்தம்’ என்று விளக்கித் தீர்ப்பதைத் தவிர்க்கிறது.
- issue: ஒருமை ‘மகத்துவம்’ என்பதிலிருந்து பன்மை ‘மகத்தான செயல்கள்’ என்பதற்கான மாற்றம்
  choice: இரு வடிவங்களின் வேறுபாட்டையும் உரையில் காத்தல்
  alternative: இரண்டையும் ‘மகத்தான செயல்கள்’ என ஒரேபோல் மொழிபெயர்த்தல்
  rationale: மூல எபிரெய உரையின் எண்ணிக்கை மாற்றத்தையும் அதிலுள்ள பொருள் நுணுக்கத்தையும் மறைக்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், ஜெபத்திற்கேற்ற கண்ணியமான மரியாதை ஒருமை பயன்படுத்தப்பட்டுள்ளது. ‘அடியேன்’ பணிவான முதல் நபர் சுயக்குறிப்பாகவும், ‘உள்ளம்’ மூலத்தின் இதய உருவகத்தை இயல்பாகவும் வழங்குகிறது.
