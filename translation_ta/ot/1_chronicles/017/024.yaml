  rationale: மூலத்தில் பட்டப்பெயர் அல்ல, தேவனுடைய தனிப்பெயரான நான்கெழுத்துப் பெயர் நேரடியாக உள்ளது; ஆகவே அதனை ஒலிபெயர்ப்பது மூல வேறுபாட்டைக் காக்கிறது.
- issue: வேண்டுதல் வலிமையுள்ள வினை வடிவங்கள்
  choice: ‘உறுதிப்படுவதாக… மேன்மைப்படுவதாக… நிலைபெறுவதாக’ என்ற வேண்டுதல் நடை
  alternative: ‘உறுதிப்படும்… மேன்மைப்படும்… நிலைபெறும்’ என்ற எதிர்கால அறிவிப்பு
  rationale: தாவீதின் ஜெபச் சூழலில் இவ்வினைகள் வெறும் முன்னறிவிப்பைவிட ஜெபமிகு விருப்பம் அல்லது வேண்டுதலாகப் புரிந்துகொள்ளப்படுவது சிறந்தது.
- issue: אֱלֹהִים לְיִשְׂרָאֵל என்பதிலுள்ள לְ-ன் உறவு
  choice: இஸ்ரவேலுக்குத் தேவனாயிருக்கிறார்
  alternative: இஸ்ரவேலின் தேவனாயிருக்கிறார்
  rationale: மூலத்தின் தத்திவ்/உறவுப் பொருளைத் திறந்தவாறே வைத்திருக்கிறது; உடைமைப் பொருளும் சாத்தியமான விளக்கமாக அடிக்குறிப்பில் தரப்படுகிறது.
- issue: בַּיִת என்பதன் தாவீதியச் சூழல்
  choice: வீடு
  alternative: அரச வம்சம்
  rationale: மூல உருவகத்தை முதன்மை உரையில் காத்து, அது இங்கு தாவீதின் அரச வம்சத்தைக் குறிக்கிறது என்பதை அடிக்குறிப்பில் தெளிவுபடுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், ஜெபத்துக்குரிய கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. தேவனை நோக்கும் ஒருமை மரியாதை வடிவமாக ‘உமது’ பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் ‘பெயர்’, ‘வீடு’, ‘முன்னிலையில்’ ஆகிய உருவகங்களும் உறவுச் சொற்களும் இயன்றவரை காக்கப்பட்டுள்ளன.
