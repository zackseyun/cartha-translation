  text: וְ֠/יֵֽאָמֵן וְ/יִגְדַּ֨ל שִׁמְ/ךָ֤ עַד עוֹלָם֙ לֵ/אמֹ֔ר יְהוָ֤ה צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֱלֹהִ֖ים לְ/יִשְׂרָאֵ֑ל וּ/בֵית דָּוִ֥יד עַבְדְּ/ךָ֖ נָכ֥וֹן לְ/פָנֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/024.yaml
  text: May it be established[a], and may your name be magnified forever, saying, ‘Yahweh of hosts, the God of Israel[b], is God to Israel,’ and may the house of David your servant be established before you.
translation:
  language: ta
  text: 'அது உறுதிப்படுவதாக; உமது பெயர் என்றென்றும் மேன்மைப்படுவதாக. இவ்வாறு சொல்லப்படட்டும்: ‘சேனைகளின் யாவே, இஸ்ரவேலின் தேவன், இஸ்ரவேலுக்குத் தேவனாயிருக்கிறார்[a].’ உமது பணியாளனாகிய தாவீதின் வீடு[b] உமது முன்னிலையில் நிலைபெறுவதாக.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்ரவேலின் தேவனாயிருக்கிறார்.” எபிரெயச் சொற்றொடர் இன்னும் நேரடியாக, “இஸ்ரவேலுக்குத் தேவன்” என உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: இங்கே “வீடு” என்பது தாவீதின் அரச குடும்பத்தையோ அரச வம்சத்தையோ குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וְיֵאָמֵן
  choice: அது உறுதிப்படுவதாக
  rationale: அמן என்பதன் நிஃபால் வடிவம் இங்கு வேண்டுதல் பொருளில் வந்து, முன்னர் கூறப்பட்ட வாக்குறுதி உறுதியாக்கப்பட வேண்டும் என்ற கருத்தைத் தருகிறது. எபிரெயத்தில் கருப்பொருள் வெளிப்படையாக இல்லாததால் ‘அது’ எனப் பொதுவாகவே வைக்கப்பட்டுள்ளது.
- source_word: וְיִגְדַּל שִׁמְךָ
  choice: உமது பெயர் மேன்மைப்படுவதாக
  rationale: גדל என்பதன் வேண்டுதல் வலிமையையும், தேவனுடைய பெயர் உயர்வடைவதையும் இயல்பான நவீன தமிழில் தெரிவிக்கிறது; ‘பெயர்’ என்ற மூல உருவகம் அப்படியே காக்கப்படுகிறது.
- source_word: עַד עוֹלָם
  choice: என்றென்றும்
  rationale: நிலையான காலத் தொடர்ச்சியை இயல்பாக வெளிப்படுத்தும் தமிழ் சொல்.
- source_word: לֵאמֹר
  choice: என்று சொல்லப்படட்டும்
  rationale: பின்வரும் புகழறிக்கையை அறிமுகப்படுத்தும் எபிரெயச் சொல்லின் செயல்பாட்டை, தமிழ் வாக்கிய ஓட்டத்துக்கு ஏற்றவாறு தெரிவிக்கிறது.
- source_word: יְהוָה צְבָאוֹת
  choice: சேனைகளின் யாவே
  rationale: தேவனுடைய தனிப்பெயரை ‘யாவே’ என்று ஒலிபெயர்த்து, צְבָאוֹת என்பதன் விரிவான படை/திரள் சார்ந்த பட்டப்பெயரை மரபாகவும் புரியத்தக்கவாறும் ‘சேனைகள்’ எனக் கொடுக்கிறது.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் தேவன்
  rationale: இஸ்ரவேலோடு யாவே கொண்டுள்ள உடன்படிக்கை உறவைச் சுட்டும் இணைப்புத் தொடரை நேரடியாகத் தருகிறது.
- source_word: אֱלֹהִים לְיִשְׂרָאֵל
  choice: இஸ்ரவேலுக்குத் தேவனாயிருக்கிறார்
  rationale: לְ என்ற முன்னிடைச்சொல்லின் ‘இஸ்ரவேலுக்கு/இஸ்ரவேலைப் பொறுத்தவரை’ என்ற உறவுப் பொருளைக் காத்து, தமிழில் இயல்பாக ஒலிக்கிறது; அதை நேரடியாக உடைமைத் தொடராக மாற்றவில்லை.
- source_word: וּבֵית דָּוִיד עַבְדְּךָ
  choice: உமது பணியாளனாகிய தாவீதின் வீடு
  rationale: בַּיִת என்ற ‘வீடு’ உருவகத்தைப் பாதுகாக்கிறது; இச்சூழலில் அது தாவீதின் அரச மரபைக் குறிக்கும் என்பதை அடிக்குறிப்பு விளக்குகிறது.
- source_word: נָכוֹן לְפָנֶיךָ
  choice: உமது முன்னிலையில் நிலைபெறுவதாக
  rationale: נכון என்பதன் உறுதியாக நிறுவப்பட்டிருக்கும் நிலையை ‘நிலைபெறு’ தெரிவிக்கிறது; לְפָנֶיךָ என்பதன் முன்னிலை/சந்நிதி உறவும் காக்கப்படுகிறது.
theological_decisions:
