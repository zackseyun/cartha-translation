  text: And I will appoint a place for my people Israel and will plant them[a], and they will dwell in their own place and be disturbed no more. And the sons of wickedness will no longer wear them down, as at the first[b],
translation:
  language: ta
  text: என் மக்களாகிய இஸ்ரவேலுக்கு நான் ஓர் இடத்தை ஏற்படுத்தி, அவர்களை அங்கே நாட்டுவேன். அவர்கள் தங்களுக்குரிய இடத்தில் குடியிருப்பார்கள்; இனி அவர்கள் கலக்கமடைய மாட்டார்கள். தீயவர்கள்[a] முன்புபோல்[b] இனி அவர்களை நலிவடையச் செய்ய மாட்டார்கள்.
