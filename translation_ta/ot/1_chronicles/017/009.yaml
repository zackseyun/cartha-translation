  choice: ஓர் இடத்தை ஏற்படுத்தி
  rationale: שׂוּם என்பதன் அடிப்படைப் பொருள் ‘வைத்தல்’; இங்கு ஒரு மக்களுக்கான இடத்தை நியமித்து அமைத்துக் கொடுக்கும் பொருளில் வருவதால், இயல்பான தமிழில் ‘இடத்தை ஏற்படுத்தி’ என மொழிபெயர்க்கப்பட்டது.
- source_word: לְעַמִּי יִשְׂרָאֵל
  choice: என் மக்களாகிய இஸ்ரவேலுக்கு
  rationale: ‘என் மக்கள்’ என்ற உடன்படிக்கைச் சார்ந்த உடைமை உறவையும் ‘இஸ்ரவேல்’ என்ற கூட்டுப்பெயரையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: וּנְטַעְתִּיהוּ
  choice: அவர்களை அங்கே நாட்டுவேன்
  rationale: נטע என்பதன் நேர்ப்பொருள் ‘நடுதல்/நாட்டுதல்’. மக்களை நிலத்தில் உறுதியாக நிலைபெறச் செய்யும் உருவகத்தை ‘நாட்டுவேன்’ பாதுகாக்கிறது; ‘அங்கே’ என்பது முன்சொன்ன இடத்துடனான தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְשָׁכַן תַּחְתָּיו
  choice: அவர்கள் தங்களுக்குரிய இடத்தில் குடியிருப்பார்கள்
  rationale: எபிரெய கூட்டொருமை வடிவம் தமிழில் மக்களைக் குறிக்கும் பன்மையாக அளிக்கப்பட்டது. תַּחְתָּיו என்பதன் சொற்சொல் வடிவமான ‘அதன் கீழ்’ இச்சூழலில் தெளிவற்றது; தங்களுக்கு நியமிக்கப்பட்ட இடத்தில் நிலையாக வாழ்வதே சூழல்சார் பொருள்.
- source_word: וְלֹא יִרְגַּז עוֹד
  choice: இனி அவர்கள் கலக்கமடைய மாட்டார்கள்
  rationale: רגז குறிக்கும் அசைக்கப்படுதல், பதற்றம் அல்லது தொந்தரவுக்குள்ளாதல் ஆகிய நிழற்பொருள்களை ‘கலக்கமடைய’ இயல்பாக வெளிப்படுத்துகிறது; עוֹד உடன் வரும் மறுப்பு ‘இனி … மாட்டார்கள்’ என அளிக்கப்பட்டது.
- source_word: בְנֵי עַוְלָה
  choice: தீயவர்கள்
  rationale: ‘அநீதியின் பிள்ளைகள்’ என்ற எபிரெய மரபுத்தொடரின் செயல்பாட்டு பொருளை சாதாரண நவீனத் தமிழில் தெளிவாகத் தருகிறது; நேரடியான வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: לְבַלֹּתוֹ
  choice: அவர்களை நலிவடையச் செய்ய
  rationale: בלה இங்கு தொடர்ந்து தேய்த்து வலுவிழக்கச் செய்தல் என்ற பொருளைக் கொண்டது. ‘நலிவடையச் செய்ய’ என்பது வெறும் துன்புறுத்தலைவிட இந்த நீடித்த பாதிப்பைத் துல்லியமாகக் காட்டுகிறது.
- source_word: כַּאֲשֶׁר בָּרִאשׁוֹנָה
  choice: முன்புபோல்
  rationale: முந்தைய காலத்தில் நடந்ததைச் சுட்டும் சொற்றொடரை சுருக்கமான, இயல்பான தமிழில் தருகிறது; அதிக சொற்சொல் வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
