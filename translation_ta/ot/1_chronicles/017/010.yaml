base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/010.yaml
  text: from the days when I appointed judges over my people Israel. And I will subdue all your enemies. Moreover[a], I tell you that Yahweh will build you a house.
translation:
  language: ta
  text: நான் என் மக்களாகிய இஸ்ரவேலின்மேல் நீதித்தலைவர்களை நியமித்த நாட்களிலிருந்த நிலையைப்போல இனி அவர்கள் துன்புறுத்தப்படமாட்டார்கள்; உன் பகைவர்கள் அனைவரையும் நான் அடக்குவேன். மேலும், யாவே உனக்காக ஒரு வீட்டைக் கட்டுவார்[a] என்று உனக்கு அறிவிக்கிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு ‘வீடு’ என்பது தாவீதுக்காக நிலைநாட்டப்படும் அரச வம்சத்தையும் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְמִיָּמִים
  choice: நாட்களிலிருந்து இருந்ததுபோலவே
  rationale: இந்தத் தொடர் முந்தைய வாக்கியத்தின் கால ஒப்பீட்டைத் தொடர்கிறது. தனித்து நிற்கும் இயல்பற்ற சொல்லாக்கத்தைத் தவிர்த்து, எபிரெய உரையின் தொடர்பைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר צִוִּיתִי שֹׁפְטִים
  choice: நான் நீதித்தலைவர்களை நியமித்த
  rationale: צוה இங்கு வெறுமனே ‘கட்டளையிட்டேன்’ என்பதல்ல; இஸ்ரவேலுக்கு நீதித்தலைவர்களை ஏற்படுத்தி அதிகாரத்தில் அமர்த்தியதைக் குறிக்கிறது. שֹׁפְטִים என்பது நீதித்தீர்ப்பு வழங்கியதோடு மக்களை வழிநடத்திய வரலாற்றுத் தலைவர்களையும் குறிக்கிறது.
- source_word: עַל עַמִּי יִשְׂרָאֵל
  choice: என் மக்களாகிய இஸ்ரவேலின்மேல்
  rationale: עַל ஆளுகை அல்லது அதிகாரத்தைக் குறிக்கும் ‘மேல்’ என்ற பொருளில் தரப்பட்டுள்ளது; ‘என் மக்கள்’ என்ற உடன்படிக்கைச் சார்ந்த உரிமைச் சொல்லும் பாதுகாக்கப்பட்டுள்ளது.
- source_word: וְהִכְנַעְתִּי
  choice: நான் அடக்குவேன்
  rationale: வாக்குறுதியின் தொடரில் இந்த இறந்தகால வடிவம் எதிர்கால உறுதியைக் குறிக்கிறது. பகைவர்களைப் பொருளாகக் கொண்டபோது ‘அடக்குவேன்’ என்பது இயல்பான தமிழ்.
- source_word: אֶת כָּל אוֹיְבֶיךָ
  choice: உன் பகைவர்கள் அனைவரையும்
  rationale: כָּל குறிப்பிடும் முழுமை பாதுகாக்கப்பட்டு, தமிழில் இயல்பான சொல்லொழுங்கு பயன்படுத்தப்பட்டுள்ளது.
- source_word: וָאַגִּד לָךְ
  choice: மேலும் ... என்று உனக்கு அறிவிக்கிறேன்
  rationale: נגד இங்கு தேவன் நிகழ்காலத்தில் செய்கிற உறுதியான அறிவிப்பை அறிமுகப்படுத்துகிறது; ‘மேலும்’ உரையின் முன்னேற்றத்தையும் ‘அறிவிக்கிறேன்’ அதன் அறிவிப்புத் தன்மையையும் காட்டுகின்றன.
- source_word: וּבַיִת יִבְנֶה לְּךָ יְהוָה
  choice: யாவே உனக்காக ஒரு வீட்டைக் கட்டுவார்
  rationale: בַיִת என்பதைக் ‘அரச மரபு’ என்று விளக்கி மாற்றாமல் ‘வீடு’ எனவே வைத்திருப்பதால், தாவீது தேவனுக்குக் கட்ட விரும்பிய ஆலயத்துக்கும் தேவன் தாவீதுக்காக ஏற்படுத்தும் அரச குடும்ப மரபுக்கும் இடையிலான சொல்விளையாட்டு பாதுகாக்கப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநாமத்தை ஒரு பட்டப்பெயராக மாற்றாமல், எபிரெய நான்கெழுத்துத் திருநாமத்தின் பரவலான தமிழ் ஒலிபெயர்ப்பாக வழங்குகிறது.
theological_decisions:
- issue: இறுதி வாக்கியத்திலுள்ள ‘வீடு’ என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘வீடு’ என்ற உருவகத் திறப்பை அப்படியே வைத்தல்
  alternative: ‘யாவே உனக்காக ஓர் அரச மரபை நிலைநாட்டுவார்’ என்று பொருளை நேரடியாகத் தருதல்
  rationale: இந்தச் சூழலில் ‘வீடு’ என்பது கட்டிடம் அல்லது ஆலயத்தையும் அரச குடும்பம் அல்லது வம்சத்தையும் நினைவூட்டும் திட்டமிட்ட இருபொருள் சொல்லாக உள்ளது. அதை ‘அரச மரபு’ என்று மட்டும் மொழிபெயர்த்தால் இலக்கியச் சொல்விளையாட்டும் இறையியல் அழுத்தமும் மறைந்துவிடும்.
translation_notes:
  register: இயல்பான நவீன செந்தமிழ் நடை பயன்படுத்தப்பட்டுள்ளது. ‘நீதித்தலைவர்கள்’ என்பது பழைய ‘நியாயாதிபதிகள்’ என்பதைக் காட்டிலும் இன்றைய வாசகர்களுக்கு எளிதாகப் புரியும் வகையில், அந்தப் பதவியின் நீதியும் தலைமைத்துவமும் இரண்டையும் உணர்த்துகிறது. ‘யாவே’ திருநாமமாகவே வைக்கப்பட்டுள்ளது; ‘வீடு’ என்ற முக்கிய உருவகமும் விளக்கமாக மாற்றப்படாமல் பாதுகாக்கப்பட்டுள்ளது.
