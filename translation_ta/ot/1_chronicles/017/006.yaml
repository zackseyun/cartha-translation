  source_fidelity: 'முதன்மை உரை எபிரெய மசோரா உரையை நன்றாகப் பின்பற்றுகிறது: ‘நீதித்தலைவர்கள்,’ ‘மேய்க்க,’ மற்றும் பன்மை வினாவான ‘நீங்கள் ஏன் ... கட்டவில்லை?’ ஆகியவை மூலத்தின் அம்சங்களைப் பாதுகாக்கின்றன. இருப்பினும், தொடக்கச் சொற்றொடரின் சொல் வரிசையைச் சீரமைப்பது בְּכֹל אֲשֶׁר הִתְהַלַּכְתִּי בְּכָל־יִשְׂרָאֵל என்பதன் ‘நான் ... நடமாடிய எல்லா இடங்களிலும்’ என்ற பொருளை இயல்பாகத் தருகிறது.'
  naturalness: ‘இஸ்ரவேல் மக்கள் அனைவரின் நடுவிலும் நடமாடிய இடங்களிலெல்லாம்’ என்பது புரியக்கூடியதாயினும் சற்றே கனமாக உள்ளது. ‘இஸ்ரவேல் மக்கள் அனைவரின் நடுவே நடமாடிய எல்லா இடங்களிலும்’ என்பது நவீன நிலையான தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது. அடிக்குறிப்பில் ‘செங்கோல்கள்’ என்பதற்குப் பதில் ‘அதிகாரக் கோல்கள்’ என்பது இன்றைய வாசகருக்குத் தெளிவானது.
