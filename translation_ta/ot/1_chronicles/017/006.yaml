  text: בְּ/כֹ֥ל אֲשֶֽׁר הִתְהַלַּכְתִּי֮ בְּ/כָל יִשְׂרָאֵל֒ הֲ/דָבָ֣ר דִּבַּ֗רְתִּי אֶת אַחַד֙ שֹׁפְטֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֥ר צִוִּ֛יתִי לִ/רְע֥וֹת אֶת עַמִּ֖/י לֵ/אמֹ֑ר לָ֛/מָּה לֹא בְנִיתֶ֥ם לִ֖/י בֵּ֥ית אֲרָזִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/006.yaml
  text: In all the places where I have walked among all Israel[a], did I ever speak a word to one of the judges of Israel, whom I commanded to shepherd my people, saying, ‘Why have you not built for me a house of cedar?’
translation:
  language: ta
  text: நான் இஸ்ரவேல் மக்கள் அனைவரின் நடுவே நடமாடிய எல்லா இடங்களிலும், என் மக்களை மேய்க்கும்படி நான் கட்டளையிட்ட இஸ்ரவேலின் நீதித்தலைவர்களில் ஒருவரிடமாவது, ‘நீங்கள் ஏன் எனக்காகக் கேதுரு மரத்தால் ஆன ஒரு இல்லத்தைக் கட்டவில்லை?’ என்று ஒரு வார்த்தையாவது சொன்னதுண்டா?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இணையான பகுதியான 2 சாமுவேல் 7:7-ல் ‘இஸ்ரவேலின் கோத்திரங்கள்’ என்று வாசிக்கப்படுகிறது; சில உரைச்சாட்சிகளில் ‘தலைவர்கள்’ அல்லது ‘அதிகாரக் கோல்கள்’ என்று உள்ளது. ஆனால் நாளாகமத்தின் எபிரெய உரை இங்கே ‘நீதித்தலைவர்கள்’ என்று வாசிக்கிறது.
    reason: textual_variant
lexical_decisions:
- source_word: הִתְהַלַּכְתִּי
  choice: நடமாடிய
  rationale: התהלך என்ற வினையின் தொடர்ச்சியான இடமாற்றப் பொருளையும் உருவகத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְּכָל יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள் அனைவரின் நடுவிலும்
  rationale: இது வெறும் நிலப்பரப்பைக் காட்டாமல், தேவன் தம் மக்களின் நடுவே இருந்ததையும் நகர்ந்ததையும் குறிக்கிறது; ‘மக்கள்’ என்பது ‘இஸ்ரவேல்’ என்ற கூட்டுப்பெயரின் பொருளைத் தமிழில் தெளிவாக்குகிறது.
- source_word: הֲדָבָר דִּבַּרְתִּי
  choice: ஒரு வார்த்தையாவது சொன்னதுண்டா?
  rationale: கேள்வித் துகளும் ஒரே வேர் சார்ந்த பெயர்-வினை அமைப்பும் தரும் வலியுறுத்தப்பட்ட மறுப்பை இயல்பான தமிழில் காக்கிறது.
- source_word: אֶת אַחַד שֹׁפְטֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் நீதித்தலைவர்களில் ஒருவரிடமாவது
  rationale: דבר உடன் வரும் את உரையாடல் செலுத்தப்படும் நபரைச் சுட்டுகிறது. ‘ஒருவரிடமாவது’ வினாவிலுள்ள ‘எவரிடமாவது’ என்ற வலிமையைத் தருகிறது.
- source_word: שֹׁפְטֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் நீதித்தலைவர்கள்
  rationale: שפטים என்பதன் நீதிவழங்கும் மற்றும் ஆளும் பங்குகளை ‘நீதித்தலைவர்கள்’ தெளிவாகக் காட்டுகிறது; சாமுவேல் இணைப்பகுதியோடு ஒத்திசைக்காமல் நாளாகமத்தின் எபிரெய வாசகத்தையே பின்பற்றுகிறது.
- source_word: צִוִּיתִי לִרְעוֹת
  choice: மேய்க்கும்படி நான் கட்டளையிட்ட
  rationale: רעה என்பதிலுள்ள மேய்ப்பர் உருவகத்தையும் மக்களை வழிநடத்திப் பராமரிக்கும் பொறுப்பையும் காக்கிறது.
- source_word: עַמִּי
  choice: என் மக்களை
  rationale: உடன்படிக்கை உறவைச் சுட்டும் நேரடியான, இயல்பான மொழிபெயர்ப்பு.
- source_word: לָמָּה לֹא בְנִיתֶם לִי
  choice: நீங்கள் ஏன் எனக்குக் ... கட்டவில்லை?
  rationale: இவ்வரையிலும் அத்தகைய கட்டளை வழங்கப்படவில்லை என்பதைக் காட்டும் சொல்லாட்சியை இயல்பான தமிழ் வினாவாக வழங்குகிறது.
- source_word: בֵּית אֲרָזִים
  choice: கேதுரு மரத்தால் ஆன ஓர் இல்லம்
  rationale: கேதுரு மரத்தால் கட்டப்பட்ட இல்லம் என்ற எபிரெய மரபுத்தொடரின் பொருளைத் தெளிவாகவும் கண்ணியமான நடையிலும் தருகிறது.
theological_decisions:
- issue: நாளாகமத்தில் ‘நீதித்தலைவர்கள்’ என்றும் 2 சாமுவேல் 7:7 இணைப்பகுதியில் ‘கோத்திரங்கள்’ என்றும் உள்ள வேறுபாடு
  choice: முதன்மை உரையில் நாளாகமத்தின் மசோரா எபிரெய வாசகத்தின்படி ‘இஸ்ரவேலின் நீதித்தலைவர்கள்’ என்று மொழிபெயர்த்தல்
  alternative: 2 சாமுவேல் 7:7 அடிப்படையில் ‘இஸ்ரவேலின் கோத்திரங்கள்’ அல்லது சில சாட்சிகளின்படி ‘தலைவர்கள்’ என்று ஒத்திசைத்தல்
  rationale: மூலமொழி முன்னுரிமையின்படி நாளாகமத்தின் நிலவும் எபிரெய வாசகத்தை மொழிபெயர்க்க வேண்டும். இணைப்பகுதியின் வேறுபாட்டை அடிக்குறிப்பில் வெளிப்படையாகக் குறிப்பிடுவது உண்மையான உரை வேறுபாட்டைத் தீர்த்துவிடாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதாகம நடை. ‘நடமாடிய’, ‘மேய்க்க’, ‘இல்லம்’ ஆகிய சொற்கள் மூலத்தின் உருவகங்களையும் உயர்ந்த தொனியையும் காக்கின்றன. அடிக்குறி [a] முதன்மை உரையில் இடம்பெற்றுள்ளது.
