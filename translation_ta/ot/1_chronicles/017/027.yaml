    rationale: The Hebrew וּמְבֹרָךְ is a passive participle expressing a blessed state. Adding ‘உள்ளது’ gives Tamil’s natural stative construction while preserving the declarative/resultative reading and the temporal phrase ‘என்றென்றும்.’
