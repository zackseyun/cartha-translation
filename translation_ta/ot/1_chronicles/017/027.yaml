  choice: இப்போது
  rationale: வாக்கியத்தின் தொடர்ச்சியையும் தற்போதைய வேண்டுதல் நிலைக்கான மாற்றத்தையும் இயல்பான நவீன தமிழில் தெரிவிக்கிறது; ו-வின் இணைப்புப் பொருள் சூழலில் இயல்பாகப் புரிகிறது.
- source_word: הוֹאַלְתָּ
  choice: நீர் மனமுவந்தீர்
  rationale: வெறும் செயல் தொடக்கத்தைவிட, விருப்பத்துடன் இசைந்ததையும் அருளுள்ள சம்மதத்தையும் குறிக்கும் எபிரெய வினையின் நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: לְבָרֵךְ
  choice: ஆசீர்வதிக்க
  rationale: הוֹאַלְתָּ என்பதற்குரிய நேரடி வினையெச்சத் துணையாக உள்ள மூல அமைப்பைப் பாதுகாக்கிறது.
- source_word: בֵּית עַבְדְּךָ
  choice: உமது அடியானின் வீட்டை
  rationale: בַּיִת என்பதன் குடும்பம், வழிமரபு, அரச வம்சம் ஆகியவற்றை உள்ளடக்கக்கூடிய விரிவை ‘வீடு’ தக்கவைக்கிறது.
- source_word: לִהְיוֹת לְעוֹלָם לְפָנֶיךָ
  choice: உமக்கு முன்பாக என்றென்றும் நிலைத்திருக்கும்படி
  rationale: தேவனுடைய முன்னிலையில் தொடர்ந்திருப்பதையும் ஆசீர்வாதத்தின் நோக்கத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘நிலைத்திருக்க’ என்பது வெறும் இடவியல் இருப்பாகக் குறுக்காமல் காலநிலைத்தன்மையைத் தெளிவாக்குகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றிற்கான அடிப்படையை அறிமுகப்படுத்தும் காரண இணைப்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், எபிரெய நான்கெழுத்துப் பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: בֵּרַכְתָּ
  choice: நீர் அதை ஆசீர்வதித்தீர்
  rationale: நிறைவேறிய தெய்வீகச் செயலை நேரடியாகக் கூறுகிறது; தமிழில் பொருள் தெளிவதற்காக மறைமுகச் செயப்படுபொருளான வீட்டை ‘அதை’ என வெளிப்படுத்துகிறது.
- source_word: וּמְבֹרָךְ לְעוֹלָם
  choice: அது என்றென்றும் ஆசீர்வதிக்கப்பட்டதே
  rationale: செயப்பாட்டு வினையெச்சத்தின் நிலை/விளைவு சார்ந்த அறிவிப்பைத் தக்கவைக்கிறது. ‘-தே’ முன் கூறிய தெய்வீக ஆசீர்வாதத்திலிருந்து வரும் உறுதியை இயல்பாக எடுத்துரைக்கிறது; தனியான வேண்டுதல் வினைநிலையைச் சேர்ப்பதில்லை.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: யெகோவா; அல்லது பட்டப்பெயரான ‘ஆண்டவர்’
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது. ஆகவே அதை பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்ப்பது மூலச் சான்றுக்கு நெருக்கமானது.
- issue: וּמְבֹרָךְ לְעוֹלָם என்ற இறுதிக் கூற்றின் வினைநிலை
  choice: அறிவிப்பு/விளைவு நிலை — ‘அது என்றென்றும் ஆசீர்வதிக்கப்பட்டதே’
  alternative: விருப்ப வேண்டுதல் — ‘அது என்றென்றும் ஆசீர்வதிக்கப்படுவதாக’
  rationale: மூலத்தில் கட்டளை அல்லது வெளிப்படையான விருப்ப வினை இல்லை; செயப்பாட்டு வினையெச்சமே உள்ளது. எனவே தேவன் ஏற்கெனவே ஆசீர்வதித்ததன் நிலையான விளைவை அறிவிக்கும் வாசிப்பு இலக்கணத்துக்கு இயல்பானது; இருப்பினும் வேண்டுதலாகப் புரியும் வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், ஜெபத்திற்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. தேவனை நோக்கும் ஒருமை மரியாதை வடிவங்களான ‘உமது’, ‘நீர்’ ஆகியவை சீராகப் பேணப்பட்டுள்ளன. ‘வீடு’ என்ற சொல் திட்டமிட்டு வைக்கப்பட்டுள்ளது; அதன் வம்சப் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது. இறுதிக் கூற்றின் எபிரெயத் தெளிவின்மை தீர்த்துவைக்கப்படாமல் மாற்று வாசிப்பாகப் பதிவு செய்யப்பட்டுள்ளது.
