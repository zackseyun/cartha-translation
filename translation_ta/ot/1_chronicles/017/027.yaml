  yaml_path: translation/ot/1_chronicles/017/027.yaml
  text: And now[a], you have been pleased to bless the house of your servant, that it may be before you forever; for you, O Yahweh, have blessed it[c][b], and it is blessed forever.
translation:
  language: ta
  text: இப்போது, உமது அடியானின் வீட்டை[b] உமக்கு முன்பாக என்றென்றும் நிலைத்திருக்கும்படி ஆசீர்வதிக்க நீர் மனமுவந்தீர்[a]. ஏனெனில், யாவே, நீர் அதை ஆசீர்வதித்தீர்; அது என்றென்றும் ஆசீர்வதிக்கப்பட்டுள்ளது[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஆசீர்வதிக்க நீர் முன்வந்தீர்’ அல்லது ‘ஆசீர்வதிக்க நீர் இசைந்தீர்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இங்கு ‘வீடு’ என்பது கட்டடத்தை மட்டும் அல்லாமல், அடியானின் குடும்பத்தையும் வழிமரபையும்—குறிப்பாகத் தாவீதின் அரச வம்சத்தையும்—குறிக்கக்கூடும்.
    reason: cultural_note
  - marker: c
    text: ‘அது என்றென்றும் ஆசீர்வதிக்கப்படுவதாக’ என்றும் சிலர் பொருள்கொள்கிறார்கள். எனினும், எபிரெய வடிவம் நீடித்த ஆசீர்வாத நிலையை அறிவிக்கும் கூற்றாகப் புரிவதே இயல்பானது.
    reason: alternative_reading
