source:
  edition: WLC
  text: לֵ֤ךְ וְ/אָמַרְתָּ֙ אֶל דָּוִ֣יד עַבְדִּ֔/י כֹּ֖ה אָמַ֣ר יְהוָ֑ה לֹ֥א אַתָּ֛ה תִּבְנֶה לִּ֥/י הַ/בַּ֖יִת לָ/שָֽׁבֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/004.yaml
  text: 'Go and say to David my servant[b][a], ‘Thus says Yahweh: You shall not build for me the house to dwell in.’'
translation:
  language: ta
  text: 'போய், என் ஊழியனான தாவீதிடம், ‘யாவே இவ்வாறு கூறுகிறார்: எனக்காக நான் குடியிருப்பதற்கான அந்த வீட்டைக் கட்டுபவன் நீ அல்ல[a]’ என்று சொல்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எனக்காக நான் குடியிருப்பதற்கான அந்த வீட்டை நீ கட்டமாட்டாய்”; இன்னும் சொற்சொல்லாக, “எனக்காக நான் குடியிருப்பதற்கான அந்த வீட்டைக் கட்டுபவன் நீ அல்ல.”
    reason: எபிரெயத்தில் மறுப்புடன் வரும் வெளிப்படையான ‘நீ’ தாவீதையே வலியுறுத்துகிறது; இது கட்டுபவரின் அடையாளத்தை முன்னிறுத்தலாம், அல்லது எதிர்கால மறுப்பாகப் புரிந்துகொள்ளப்படலாம்.
lexical_decisions:
- source_word: לֵךְ וְאָמַרְתָּ
  choice: நீ போய் … சொல்
  rationale: தொடர்ச்சியாக அமைந்த கட்டளைகளைத் தமிழில் இயல்பாகவும் நேரடியாகவும் தெரிவிக்கிறது.
- source_word: דָּוִיד עַבְדִּי
  choice: என் ஊழியனாகிய தாவீது
  rationale: עֶבֶד என்பதன் அரச-உடன்படிக்கைச் சூழலுக்கேற்ற பொருளை ‘ஊழியன்’ தெரிவிக்கிறது; அடிமை நிலையைக் தேவையின்றி முன்னிறுத்துவதில்லை.
- source_word: כֹּה אָמַר יְהוָה
  choice: யாவே கூறுவது இதுவே
  rationale: தீர்க்கதரிசனத் தூதுச் சூத்திரத்தை இயல்பான நவீன தமிழில் காத்து, இறைப்பெயரைப் பெயராகவே வழங்குகிறது.
- source_word: לֹא אַתָּה תִּבְנֶה
  choice: கட்டுவது நீ அல்ல
  rationale: வெறும் தடையாக மட்டும் மொழிபெயர்க்காமல், אַתָּה என்ற வெளிப்படையான சுட்டுப்பெயரால் தாவீதின் மீது விழும் வலியுறுத்தலைக் காக்கிறது.
- source_word: לִּי הַבַּיִת לָשָׁבֶת
  choice: நான் குடியிருப்பதற்கான வீடு
  rationale: ‘எனக்காக/நான் குடியிருப்பதற்கான வீடு’ என்ற நோக்குப் பொருளைத் தெளிவாகத் தருகிறது; הַבַּיִת என்பதைக் கருத்துரையாக ‘ஆலயம்’ என்று மாற்றாமல் ‘வீடு’ எனவே வைத்திருக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக இருப்பதால், பட்டப்பெயராக மாற்றாமல் அதன் பொதுவாக ஏற்கப்படும் தமிழாக்க ஒலிபெயர்ப்பை வழங்குகிறது.
- issue: לֹא אַתָּה תִּבְנֶה என்பதில் உள்ள வலியுறுத்தல்
  choice: கட்டுவது நீ அல்ல
  alternative: நீ கட்டக்கூடாது; நீ கட்டமாட்டாய்
  rationale: இந்தச் சொற்றொடர் தடையையோ எதிர்கால மறுப்பையோ குறிக்கக்கூடியபோதும், வெளிப்படையான ‘நீ’ என்பதன் வலியுறுத்தல் கட்டுபவர் தாவீது அல்ல என்பதில் உள்ளது; அந்த இறையியல் பதற்றத்தைத் தீர்த்துவிடாமல் காக்கிறது.
- issue: הַבַּיִת என்பதன் அடையாளம்
  choice: வீடு
  alternative: ஆலயம்
  rationale: சூழலில் இது ஆலயத்தைக் குறித்தாலும், மூலத்தின் உருவகமும் தாவீதின் வீடு/கடவுளின் வீடு என்ற தொடர்ச்சியான சொல்லாடலும் காக்கப்படுகின்றன.
translation_notes:
  register: மொழிநடை நவீன, தெளிவான, மரியாதைமிக்க பொதுத்தமிழில் உள்ளது. தீர்க்கதரிசன அறிவிப்பின் கம்பீரம் காக்கப்பட்டுள்ளது; பழமையான வினைமுற்றுகளும் தேவையற்ற சமயக்குழுச் சொற்களும் தவிர்க்கப்பட்டுள்ளன.
