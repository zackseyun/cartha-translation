id: 1CH.17.14
reference: 1 Chronicles 17:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/הַֽעֲמַדְתִּ֛י/הוּ בְּ/בֵיתִ֥/י וּ/בְ/מַלְכוּתִ֖/י עַד הָ/עוֹלָ֑ם וְ/כִסְא֕/וֹ יִהְיֶ֥ה נָכ֖וֹן עַד עוֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/014.yaml
  text: But I will establish him in my house and in my kingdom forever[c][b][a], and his throne will be established forever.
translation:
  language: ta
  text: ஆனால் நான் அவனை என் வீட்டிலும் என் அரசாட்சியிலும் என்றென்றும் நிலைநிறுத்துவேன்[a][b]; அவனுடைய அரியணை என்றென்றும் உறுதியாக இருக்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘என் வீடு’ என்பது உடன்படிக்கையின் பரந்த சூழலில் கடவுளுடைய வீட்டைக் குறிக்கலாம்; சிலர் இதை இன்னும் குறிப்பாக ஆலயம் அல்லது கடவுளுடைய அரசக் குடும்பம் எனப் புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
  - marker: b
    text: ‘அவனை’ என்பது உடனடியாகத் தாவீதின் அரச வழித்தோன்றலை, குறிப்பாக சாலொமோனை, குறிக்கலாம்; அதேவேளையில், பின்னர் மேசியாவைச் சார்ந்து புரிந்துகொள்ளப்பட்ட விரிந்த தாவீதிய வாக்குறுதியிலும் இது பங்களிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהַעֲמַדְתִּיהוּ
  choice: ஆனால் நான் அவனை ... நிலைநிறுத்துவேன்
  rationale: עמד என்பதன் ஹிஃபில் வடிவம் ஒருவனை உறுதியாக நிற்கச் செய்வதை அல்லது ஒரு நிலையில் நிலைநிறுத்துவதை உணர்த்துகிறது. முந்தைய வசனத்துடனான கருத்து வேறுபாட்டை இயல்பாகக் காட்ட וְ இங்கு ‘ஆனால்’ என வழங்கப்பட்டுள்ளது.
- source_word: בְּבֵיתִי
  choice: என் வீட்டிலும்
  rationale: ב என்ற முன்னிடைச்சொல்லை நேரடியாகப் பிரதிபலித்து, בית என்பதிலுள்ள வீடு, வீட்டார், ஆலயம் அல்லது உடன்படிக்கை சார்ந்த ஆளுகைக் களம் ஆகிய சாத்தியமான நுணுக்கங்களைத் திறந்தவையாக வைத்திருக்கிறது.
- source_word: וּבְמַלְכוּתִי
  choice: என் அரசாட்சியிலும்
  rationale: מלכות என்பது இங்கு கடவுளுடைய அரசாட்சியைக் குறிக்கிறது. முந்தைய தொடருக்கு இணையாக ב என்பதன் உள்ளடக்கத்தை ‘இல்’ எனப் பாதுகாக்கிறது.
- source_word: עַד הָעוֹלָם
  choice: என்றென்றும்
  rationale: עד + עולם என்ற மரபுத்தொடர் நீடித்த நிரந்தரத்தைக் குறிக்கிறது; ‘என்றென்றும்’ என்பது இயல்பான, கண்ணியமான தமிழ் வடிவம்.
- source_word: וְכִסְאוֹ
  choice: அவனுடைய அரியணை
  rationale: כסא என்ற அரசருக்குரிய முக்கிய உருவகத்தைப் பொருள் சுருக்கமின்றி நேரடியாகப் பாதுகாக்கிறது.
- source_word: יִהְיֶה נָכוֹן
  choice: உறுதியாக இருக்கும்
  rationale: נכון இங்கு உறுதி, நிலைத்தன்மை, பாதுகாப்பான நிறுவல் ஆகியவற்றைக் குறிக்கிறது. ‘உறுதியாக இருக்கும்’ என்பது முதல் வினைச்சொல்லை தேவையின்றி அப்படியே மீண்டும் கூறாமல் அதன் பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: עַד עוֹלָם
  choice: என்றென்றும்
  rationale: முந்தைய ஒத்த மரபுத்தொடரைப் போலவே நீடித்த நிரந்தரத்தை உணர்த்துவதால் ஒரே தமிழ் சொல்லாக்கம் பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: ‘அவனை’ என்ற பதிலிடுபெயர் யாரைக் குறிக்கிறது
  choice: முதன்மை உரையில் ‘அவனை’ என்ற பதிலிடுபெயரை அப்படியே வைத்தல்
  alternative: சாலொமோனை மட்டும், தாவீதின் அரச வம்சத்தை ஒட்டுமொத்தமாக, அல்லது இறுதியில் மேசியாவைக் குறித்தல்
  rationale: எபிரெய உரை ஆண்பால் ஒருமைப் பதிலிடுபெயரையே பயன்படுத்துகிறது; இந்த வசனத்திலேயே அதன் குறிப்பைத் திட்டவட்டமாக்கவில்லை. உடனடி தாவீதிய வம்சச் சூழலையும் பின்னைய மேசியா சார்ந்த புரிதலையும் மொழிபெயர்ப்பு அமைதியாகத் தீர்மானிக்காமல் பாதுகாக்கிறது.
- issue: ‘என் வீடு’ என்பதன் பொருள் வரம்பு
  choice: ‘என் வீடு’ என்று நேரடியாக மொழிபெயர்த்தல்
  alternative: என் ஆலயம் அல்லது என் வீட்டார்/அரச குடும்பம் என்று குறிப்பாக்குதல்
  rationale: இந்தச் சொல் கடவுளுடைய ஆலயம், வீட்டார் அல்லது விரிந்த உடன்படிக்கை சார்ந்த ஆளுகைக் களம் ஆகியவற்றை நினைவூட்டக்கூடும். நேரடி மொழிபெயர்ப்பு இந்த அடுக்குப் பொருளைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான வேதாகம நடை பயன்படுத்தப்பட்டுள்ளது. ‘வீடு,’ ‘அரசாட்சி,’ ‘அரியணை’ போன்ற மூல உருவகங்கள் விளக்கமாகச் சுருக்கப்படாமல் பாதுகாக்கப்பட்டுள்ளன; உண்மையான பொருள் ஐயங்கள் அடிக்குறிப்புகளில் தரப்பட்டுள்ளன.
