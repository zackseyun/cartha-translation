base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/003.yaml
  text: But that night the word of God came to Nathan[a], saying,
translation:
  language: ta
  text: 'ஆனால் அந்த இரவில் கடவுளின் வார்த்தை நாத்தானுக்கு வந்தது[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுளிடமிருந்து ஒரு வார்த்தை நாத்தானுக்கு வந்தது.”
    reason: דְּבַר אֱלֹהִים என்பதிலுள்ள உடைமை அல்லது மூலாதார உறவின் உண்மையான சொற்பொருள் வாய்ப்பைப் பாதுகாக்கும் மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: וַיְהִי
  choice: ஆனால் ... வந்தது
  rationale: முதல் וַיְהִי கதைத் தொடர்ச்சியைக் குறிக்கிறது; முந்தைய சூழலுடன் உள்ள மென்மையான மாறுபாட்டை ‘ஆனால்’ இயல்பாக வெளிப்படுத்துகிறது. இரண்டாவது וַיְהִי தமிழில் ‘வந்தது’ என்ற வினையுடன் இயல்பாக இணைக்கப்பட்டுள்ளது.
- source_word: בַּלַּיְלָה הַהוּא
  choice: அந்த இரவில்
  rationale: குறிப்பிட்ட அதே இரவைக் குறிக்கும் எபிரெய காலச் சொற்றொடரின் சுட்டுப்பொருளைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: דְּבַר אֱלֹהִים
  choice: கடவுளின் வார்த்தை
  rationale: தீர்க்கதரிசன வெளிப்பாட்டை அறிமுகப்படுத்தும் இச்சொற்றொடரின் முறையான தொனியையும் ‘வார்த்தை’ என்பதன் அடிப்படைப் பொருளையும் பாதுகாக்கிறது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: இங்கு இஸ்ரவேலின் கடவுளைக் குறிக்கும் ஒருமைப் பொருளுக்கான இயல்பான நவீனத் தமிழ் சொல்.
- source_word: אֶל נָתָן
  choice: நாத்தானுக்கு
  rationale: אֶל குறிப்பிடும் பெறுநர்நோக்கிய திசையைத் தமிழின் நான்காம் வேற்றுமை இயல்பாகத் தெரிவிக்கிறது.
- source_word: לֵאמֹר
  choice: பின்வரும் நேரடி உரையை அறிமுகப்படுத்தும் முக்குறி
  rationale: எபிரெயச் சொல் நேரடி உரையை அறிமுகப்படுத்துகிறது. தமிழில் தனியாக ‘சொல்லி’ என்று இடுவதைக் காட்டிலும் முக்குறி இயல்பாகவும் தெளிவாகவும் அடுத்த வசனத்துடன் இணைக்கிறது.
theological_decisions:
- issue: דְּבַר אֱלֹהִים என்ற வெளிப்பாட்டு வாய்பாட்டின் மொழிபெயர்ப்பு
  choice: கடவுளின் வார்த்தை
  alternative: கடவுளிடமிருந்து ஒரு வார்த்தை
  rationale: தீர்க்கதரிசன வெளிப்பாட்டின் முறையான இறையியல் கனத்தை ‘கடவுளின் வார்த்தை’ பாதுகாக்கிறது. அதேவேளை, எபிரெயக் கட்டமைப்பை மூலாதாரப் பொருளாகவும் புரிந்துகொள்ள இயலும் என்பதால் மாற்று மொழிபெயர்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. அடுத்த வசனத்தில் வரும் நேரடி உரையை இயல்பாக அறிமுகப்படுத்த முக்குறி பயன்படுத்தப்பட்டுள்ளது; அடிக்குறிப்பு குறியீடு முதன்மை உரையில் இடம்பெற்றுள்ளது.
