  edition: WLC
  text: וַ֠/תִּתֵּן אֶת עַמְּ/ךָ֨ יִשְׂרָאֵ֧ל לְ/ךָ֛ לְ/עָ֖ם עַד עוֹלָ֑ם וְ/אַתָּ֣ה יְהוָ֔ה הָיִ֥יתָ לָ/הֶ֖ם לֵ/אלֹהִֽים־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/022.yaml
  text: And you made your people Israel your people forever[a], and you, O Yahweh, became their God.
translation:
  language: ta
  text: நீர் உமது மக்களாகிய இஸ்ரவேலை என்றென்றும் உமக்கென ஒரு மக்களாக ஆக்கினீர்; யாவே, நீர் அவர்களுக்கு தேவனானீர்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீர் அவர்களுடைய தேவனாயிருந்தீர்.” எபிரெய வாசகத்தை நிலையான உறவைக் குறிப்பதாகவும் மொழிபெயர்க்கலாம்; முதன்மை வாசகம் இச்சூழலில் உடன்படிக்கை உறவு நிறுவப்படுவதை முன்னிறுத்துகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּתֵּן
  choice: ஏற்படுத்தினீர்
  rationale: נתן என்பதன் அடிப்படைப் பொருள் ‘கொடுத்தீர்’ என்றாலும், இரட்டை ל அமைப்பில் இஸ்ரவேலைத் தமக்குரிய மக்களாக நிலைநிறுத்திய செயலைக் குறிக்கிறது; ‘ஏற்படுத்தினீர்’ இயல்பாகவும் பொருள்துல்லியமாகவும் உள்ளது.
- source_word: עַמְּךָ יִשְׂרָאֵל
  choice: உமது மக்களாகிய இஸ்ரவேல்
  rationale: ‘உமது மக்கள்’ என்பதையும் அந்த மக்கள் இஸ்ரவேல் என்பதையும் இணைக்கும் மூலத்தின் அடைமொழி உறவைத் தெளிவாகக் காக்கிறது.
- source_word: לְךָ לְעָם
  choice: உமக்குச் சொந்தமான மக்களாக
  rationale: இரு ל முன்னொட்டுகளும் தேவனுக்குரிய மக்களாகிய உறவுநிலையை வெளிப்படுத்துகின்றன; தமிழில் ‘உமக்குச் சொந்தமான’ என்பது உடன்படிக்கைச் சார்ந்த உடைமையுறவை இயல்பாகத் தெரிவிக்கிறது.
- source_word: עַד עוֹלָם
  choice: என்றென்றும்
  rationale: நீடித்த நிலைத்தன்மையை நவீனத் தமிழில் தெளிவாகவும் கண்ணியமாகவும் தெரிவிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: הָיִיתָ לָהֶם לֵאלֹהִים
  choice: நீர் அவர்களுக்கு தேவனானீர்
  rationale: היה + ל + אלהים அமைப்பின் உடன்படிக்கை உறவை ‘தேவனானீர்’ எனக் காக்கிறது; இது உறவு நிறுவப்பட்டதைக் குறிக்கலாம், ஆனால் தேவனுடைய இயல்பில் மாற்றம் ஏற்பட்டதாகச் சொல்லாது.
theological_decisions:
- issue: היה + ל + אלהים என்ற உடன்படிக்கைச் சூத்திரத்தின் மொழிபெயர்ப்பு
  choice: நீர் அவர்களுக்கு தேவனானீர்
  alternative: நீர் அவர்களுடைய தேவனாயிருந்தீர்
  rationale: சூழலில் இஸ்ரவேலைத் தமது மக்களாக ஏற்படுத்திய செயலுடன் இணைந்த உறவு நிறுவப்படுதலை முதன்மை வாசகம் பிரதிபலிக்கிறது. எபிரெய வடிவை நிலைச்சொல்லாகவும் புரிந்துகொள்ள இயல்வதால் மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், தேவனை நோக்கிய மரியாதைப் பன்மையுடன் மொழிபெயர்க்கப்பட்டது. ‘ஏற்படுத்தினீர்’ என்பது சொல்லுக்குச் சொல் ‘கொடுத்தீர்’ என்பதற்குப் பதிலாக இவ்வாக்கிய அமைப்பின் நிறுவும் வலிமையை வெளிப்படுத்துகிறது. தெய்வீகப் பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
