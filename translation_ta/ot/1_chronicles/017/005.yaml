base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/005.yaml
  text: For I have not lived in a house from the day that I brought up Israel to this day[a], but I have gone from tent to tent and from dwelling place to dwelling place.
translation:
  language: ta
  text: ஏனெனில், நான் இஸ்ரவேலை மேலே கொண்டு வந்த நாள்முதல் இந்நாள்வரை ஒரு வீட்டில் குடியிருந்ததில்லை; மாறாக, கூடாரத்திலிருந்து கூடாரத்திற்கும் உறைவிடத்திலிருந்து உறைவிடத்திற்கும் இருந்துவந்தேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லடிப்படையில்: “நான் இஸ்ரவேலை மேலே கொண்டு வந்த நாள்முதல் … கூடாரத்திலிருந்து கூடாரத்திற்கு, உறைவிடத்திலிருந்து இருந்தேன்.” கடைசிப் பகுதியில் ‘உறைவிடத்திலிருந்து’ என்பதற்குப் பின் இரண்டாவது இலக்கு மூலத்தில் வெளிப்படையாக இல்லை; வாசிப்புத் தெளிவுக்காக முதன்மை உரையில் அது நிரப்பப்பட்டுள்ளது. “இருந்துவந்தேன்” என்பதற்கு “சென்று வந்தேன்” என்றும் கொள்ளலாம். “உறைவிடம்” என்பதற்கு “திருக்கூடாரம்” என்றும் மொழிபெயர்க்கலாம்.'
    reason: மூலத்தின் சுருக்கமான, சற்றே முற்றுப்பெறாத இறுதி இணை அமைப்பையும், வினைச்சொல் மற்றும் מִשְׁכָּן என்பவற்றின் சாத்தியமான மாற்றுகளையும் பாதுகாக்கிறது.
lexical_decisions:
- source_word: יָשַׁבְתִּי
  choice: குடியிருந்ததில்லை
  rationale: ישב என்பது ஓர் இடத்துடன் வரும்போது பொதுவாக ‘வாழ்தல்/குடியிருத்தல்’ என்று பொருள்படும். இங்கு ‘அமர்ந்திருக்கவில்லை’ என்பது சூழலுக்குப் பொருந்தாது.
- source_word: בְּבַיִת
  choice: ஒரு வீட்டில்
  rationale: בית இங்கு குறிப்பிட்ட உருபின்றி, கூடாரம் போன்ற நகர்த்தக்கூடிய உறைவிடத்திற்கு மாறான ஒரு நிரந்தரக் கட்டிடத்தைப் பொதுவாகக் குறிக்கிறது; ‘ஆலயம்’ என்பது மூலத்தில் இல்லாத குறிப்பைச் சேர்க்கும்.
- source_word: הֶעֱלֵיתִי אֶת יִשְׂרָאֵל
  choice: இஸ்ரவேலைக் கொண்டு வந்த
  rationale: עלה என்பதன் ஹிஃபில் வடிவம் ‘மேலே கொண்டுவருதல்/அழைத்து வருதல்’ என்று பொருள்படும். தமிழ் இயல்புக்காக ‘கொண்டு வந்த’ என வழங்கப்பட்டுள்ளது; எகிப்திலிருந்து மேலே கொண்டுவந்த நுண்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וָאֶהְיֶה
  choice: சென்றுகொண்டிருந்தேன்
  rationale: சொல்லடிப்படையில் ‘இருந்தேன்’ என்றாலும், தொடர்ந்து வரும் ‘கூடாரத்திலிருந்து கூடாரத்திற்கு’ என்ற அமைப்பு இடமாற்றத்தை உணர்த்துகிறது. அந்த மறைபொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מֵאֹהֶל אֶל אֹהֶל
  choice: கூடாரத்திலிருந்து கூடாரத்திற்கு
  rationale: தற்காலிகமான கூடார உறைவிடங்களுக்கு இடையிலான நகர்வை, மூலத்தின் திரும்பக்கூறும் அமைப்புடன் நெருக்கமாகப் பாதுகாக்கிறது.
- source_word: וּמִמִּשְׁכָּן
  choice: உறைவிடத்திலிருந்து உறைவிடத்திற்கு
  rationale: מִשְׁכָּן என்பது ‘உறைவிடம்’ அல்லது வழிபாட்டுக்குரிய ‘திருக்கூடாரம்’ எனப் பொருள்படலாம். இங்கு முதல் பொருள் தேவையற்ற தொழில்நுட்பச் சாயலைத் தவிர்த்து இணை அமைப்பைப் பாதுகாக்கிறது; மூலத்தில் இரண்டாம் இலக்கு வெளிப்படையாக இல்லாதது அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
theological_decisions:
- issue: பிற்கால ஆலயக் கருத்தை மூலத்திற்குள் கொண்டுவராமல் பரிசுத்த இடச் சொற்களை மொழிபெயர்த்தல்
  choice: בית என்பதற்கு ‘வீடு’, משכן என்பதற்கு ‘உறைவிடம்’
  alternative: ‘ஆலயம்’ மற்றும் ‘திருக்கூடாரம்’
  rationale: வசனம் நிரந்தரமான வீட்டில் குடியிருப்பதையும் நகர்த்தக்கூடிய கூடார உறைவிடங்களில் இருப்பதையும் வேறுபடுத்துகிறது. ‘ஆலயம்’ என்பது எபிரெயத்தில் வெளிப்படையாக இல்லாத பிற்காலக் குறிப்பைச் சேர்க்கும்; ‘திருக்கூடாரம்’ சாத்தியமானாலும், சொற்பொருளின் திறந்த தன்மையை ‘உறைவிடம்’ சிறப்பாகக் காக்கிறது.
- issue: וָאֶהְיֶה என்பதில் நிலைமையா, நகர்வா
  choice: சூழல் உணர்த்தும் நகர்வை ‘சென்றுகொண்டிருந்தேன்’ என்று வெளிப்படுத்துதல்
  alternative: ‘இருந்தேன்’ அல்லது ‘இருந்துவந்தேன்’
  rationale: வினைச்சொல் தனியாக ‘இருந்தேன்’ என்பதே; ஆனால் ‘கூடாரத்திலிருந்து கூடாரத்திற்கு’ என்ற தொடர்ச்சி நகர்வை வலுவாக உணர்த்துகிறது. அடிக்குறிப்பு சொல்லடிப்படை மாற்றைத் தெளிவுபடுத்துகிறது.
translation_notes:
  register: நவீன பொதுத் தமிழ்; மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட நடை. ‘ஆலயம்’ என்று மிகையாகக் குறிப்பாக்காமல், ‘வீடு/கூடாரம்/உறைவிடம்’ என்ற மூல எதிர்மறை அமைப்பு பேணப்பட்டுள்ளது.
