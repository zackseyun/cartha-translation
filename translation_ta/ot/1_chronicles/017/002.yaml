  source_fidelity: 'மூல எபிரெய வாக்கியத்தின் அனைத்துக் கூறுகளும் துல்லியமாக உள்ளன: நாத்தான் பேசுபவராகவும் தாவீது கேட்பவராகவும் தெளிவாகக் குறிக்கப்பட்டுள்ளனர்; ''உள்ளத்தில் இருப்பதையெல்லாம்'' என்பது כֹּל אֲשֶׁר בִּלְבָבְךָ என்பதன் அகலமான பொருளைத் தக்கவைக்கிறது; ஏவல், காரண இணைப்பு, மற்றும் ''கடவுள் உங்களோடு இருக்கிறார்'' என்ற உடனிருப்புக் கூற்று ஆகியனவும் நேர்மையாக மொழிபெயர்க்கப்பட்டுள்ளன. மூலத்தில் உள்ள அடுத்த நிகழ்வுகளால் பின்னோக்கிப் பாதிக்கப்படாத நாத்தானின் உடனடி கூற்றின் தன்மையும் பாதுகாக்கப்பட்டுள்ளது.'
  naturalness: நவீனத் தமிழில் இயல்பாகவும் மரியாதையான கதைநடையிலும் உள்ளது. மேற்கோளை முன்னிறுத்தி இறுதியில் 'என்றார்' என அமைத்திருப்பது தமிழுக்கு இயல்பானது. தாவீதுக்கான மரியாதைப் பன்மை ('உங்கள்/செய்யுங்கள்/உங்களோடு') எண்ணிக்கையை மாற்றாமல் வழக்கமான மரியாதைத் தொனியைத் தருகிறது.
  terminology: '''கடவுள்'' என்பது הָאֱלֹהִים என்பதற்கு ஏற்ற, இயல்பான தமிழ் வழங்கல்; மூலத்தில் இல்லாத יהוה/‘ஆண்டவர்’ என்ற பெயரைச் சேர்க்கவில்லை. நாத்தான், தாவீது ஆகிய பெயர்வடிவங்களும் நிறுவப்பட்ட தமிழ் வேதாகமப் பயன்பாட்டோடு ஒத்திருக்கின்றன.'
