  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר נָתָן֙ אֶל דָּוִ֔יד כֹּ֛ל אֲשֶׁ֥ר בִּֽ/לְבָבְ/ךָ֖ עֲשֵׂ֑ה כִּ֥י הָ/אֱלֹהִ֖ים עִמָּֽ/ךְ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/002.yaml
  text: And Nathan said to David, “Do all that is in your heart, for God is with you.”
translation:
  language: ta
  text: நாத்தான் தாவீதிடம், “உங்கள் உள்ளத்தில் இருப்பதையெல்லாம் செய்யுங்கள்; ஏனெனில் கடவுள் உங்களோடு இருக்கிறார்” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: என்றார்
  rationale: வாவ் தொடரமைப்பு கதையை முன்னெடுத்துச் செல்கிறது. தமிழில் பேச்சை மேற்கோளுக்கு முன் அறிமுகப்படுத்தி, ‘என்றார்’ என்று முடிப்பது இயல்பான கதைநடை.
- source_word: נָתָן
  choice: நாத்தான்
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் தெளிவாகக் குறிக்கும் வழக்கமான வடிவம்.
- source_word: אֶל דָּוִיד
  choice: தாவீதிடம்
  rationale: பேச்சு தாவீதை நோக்கிச் சொல்லப்படுவதை இயல்பான நவீனத் தமிழில் காட்டுகிறது.
- source_word: כֹּל אֲשֶׁר בִּלְבָבְךָ
  choice: உங்கள் உள்ளத்தில் இருப்பதையெல்லாம்
  rationale: לֵבָב என்பது இங்கு விருப்பம், எண்ணம், தீர்மானம் ஆகியவற்றை உள்ளடக்கும் அகமனிதனைக் குறிக்கிறது. ‘உள்ளம்’ அந்த உருவகத்தையும் பொருள் அகலத்தையும் காக்கிறது; ‘எல்லாம்’ כֹּל என்பதன் முழுமையை வெளிப்படுத்துகிறது.
- source_word: עֲשֵׂה
  choice: செய்யுங்கள்
  rationale: எபிரெய வினை நேரடியான கட்டளை வடிவம். தாவீதிடம் மரியாதையுடன் பேசும் இயல்பான தமிழுக்காக உயர்திணை ஏவல் வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய அறிவுரைக்கான காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: הָאֱלֹהִים
  choice: கடவுள்
  rationale: இங்கு இருப்பது אֱלֹהִים; יהוה அல்ல. தமிழில் ஒரே மெய்க் கடவுளைக் குறிக்கும் இயல்பான பொதுப்பெயராக ‘கடவுள்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: עִמָּךְ
  choice: உங்களோடு இருக்கிறார்
  rationale: இறை உடனிருப்பையும் ஆதரவையும் குறிக்கும் சொற்றொடரை இயல்பாகவும் நேரடியாகவும் தருகிறது.
theological_decisions:
- issue: הָאֱלֹהִים என்ற இறைப் பட்டப்பெயரின் மொழிபெயர்ப்பு
  choice: கடவுள்
  alternative: ஆண்டவர்
  rationale: மூலத்தில் יהוה என்ற தனிப்பெயர் வராமல் אֱלֹהִים வருவதால், ‘ஆண்டவர்’ என்று மாற்றாமல் ‘கடவுள்’ என வேறுபாடு காக்கப்பட்டுள்ளது.
- issue: ‘கடவுள் உங்களோடு இருக்கிறார்’ என்பதன் பொருள்
  choice: மூலத்தின் நேரடியான உறுதிப்பாட்டை மட்டும் மொழிபெயர்த்தல்
  alternative: ‘கடவுள் உங்கள் திட்டத்தை ஆதரிக்கிறார்’ என்று விளக்கமாக்குதல்
  rationale: உடனிருப்பு ஆதரவைக் குறிக்கக்கூடும்; ஆனால் அடுத்தடுத்த நிகழ்வுகளை முன்னிட்டு நாத்தானின் கூற்றை விளக்கி அல்லது திருத்தி எழுதாமல், இவ்வசனத்தின் இறையியல் பதற்றமும் கதைநடைச் செயல்பாடும் அப்படியே விடப்பட்டுள்ளன.
translation_notes:
  register: நவீன, மரியாதையான, வாசிக்க எளிய செந்தமிழ் சார்ந்த பொதுநடை. தாவீதைக் குறிக்கும் எபிரெய ஒருமை முன்னிலைப் பெயர்ச்சொல் தமிழில் மரியாதைப் பன்மையான ‘உங்கள்/செய்யுங்கள்’ என வழங்கப்பட்டுள்ளது; இது எண்ணிக்கையை மாற்றும் நோக்கமல்ல, இயல்பான மரியாதை வழக்கு.
