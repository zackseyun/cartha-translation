translation_notes:
  register: நவீன நிலையான, கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ். வேளாண் சூழலில் לקט என்பதற்கு ‘பொறுக்குதல்’ பயன்படுத்தப்பட்டது. வசனத்தின் இரண்டு எபிரெய வாக்கியங்களும் தனித்தனி தமிழ் வாக்கியங்களாக வைக்கப்பட்டன; உண்மையான சொற்பொருள் மாற்றுகள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டன.
