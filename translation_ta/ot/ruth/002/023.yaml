  text: וַ/תִּדְבַּ֞ק בְּ/נַעֲר֥וֹת בֹּ֨עַז֙ לְ/לַקֵּ֔ט עַד כְּל֥וֹת קְצִֽיר הַ/שְּׂעֹרִ֖ים וּ/קְצִ֣יר הַֽ/חִטִּ֑ים וַ/תֵּ֖שֶׁב אֶת חֲמוֹתָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/023.yaml
  text: So she stayed close to Boaz's young women to glean[a], until the end of the barley harvest and the wheat harvest[b]. And she lived with her mother-in-law.
translation:
  language: ta
  text: வாற்கோதுமை அறுவடையும் கோதுமை அறுவடையும் முடியும் வரை, பொறுக்குவதற்காக அவள் போவாஸின் இளம்பெண்களோடு நெருக்கமாகவே இருந்தாள்[a]. அவள் தன் மாமியாருடன் வாழ்ந்தாள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “போவாஸின் இளம்பெண்களைப் பற்றிக்கொண்டிருந்தாள்.” எபிரெய வினைச்சொல் நெருக்கமான பற்றுறவை வலியுறுத்தலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவள் தன் மாமியாருடன் தங்கியிருந்தாள்.” எபிரெய வினைச்சொல் சூழலுக்கேற்ப ‘தங்கியிருத்தல்,’ ‘நிலைத்திருத்தல்,’ அல்லது ‘வாழ்தல்’ என்று பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּדְבַּק
  choice: நெருக்கமாகவே இருந்து
  rationale: דבק என்பது பற்றிக்கொள்வதையோ மிக நெருக்கமாக இணைந்திருப்பதையோ குறிக்கிறது. இச்சூழலில் போவாசின் பெண் பணியாளர்களுடனான தொடர்ந்த நெருக்கத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: בְּנַעֲרוֹת בֹּעַז
  choice: போவாசின் இளம்பெண் பணியாளர்களோடு
  rationale: נַעֲרוֹת என்பது இங்கு போவாசின் இளம்பெண்களை, சூழலின்படி வயலில் பணிபுரிந்த பெண்களை, குறிக்கிறது. ‘பணியாளர்கள்’ என்பதைச் சேர்ப்பது உறவைத் தெளிவாக்குகிறது.
- source_word: לְלַקֵּט
  choice: பொறுக்குவதற்காக
  rationale: அறுவடைக்குப் பின் வயலில் விடப்பட்ட கதிர்களைச் சேகரிக்கும் செயலைத் தமிழில் ‘பொறுக்குதல்’ துல்லியமாகவும் இயல்பாகவும் குறிக்கிறது; לְ நோக்கத்தைக் காட்டுகிறது.
- source_word: עַד כְּלוֹת קְצִיר הַשְּׂעֹרִים וּקְצִיר הַחִטִּים
  choice: வாற்கோதுமை அறுவடையும் கோதுமை அறுவடையும் முடியும் வரை
  rationale: இரு அறுவடைக் காலங்களின் நிறைவு வரையிலான காலநீட்சியைப் பாதுகாக்கிறது. שְׂעֹרִים என்பதற்கு நவீன நிலையான தமிழில் ‘வாற்கோதுமை’ பயன்படுத்தப்படுகிறது.
- source_word: וַתֵּשֶׁב אֶת חֲמוֹתָהּ
  choice: அவள் தன் மாமியாருடன் வாழ்ந்தாள்
  rationale: ישב இங்கு உட்காருதல் என்பதைவிட ஒருவருடன் குடியிருந்து வாழ்வதைக் குறிக்கிறது. אֶת உடன் வரும் உறவைத் தமிழில் ‘உடன்’ இயல்பாக வெளிப்படுத்துகிறது.
