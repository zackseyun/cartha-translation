- from: அப்போது அவள் முகங்குப்புற விழுந்து, தரைமட்டும் பணிந்து, அவரிடம், “நான் ஓர் அந்நியப் பெண்ணாயிருந்தும், நீங்கள் என்னைக் கவனிக்கும்படி[a] உங்கள் பார்வையில் எனக்கு ஏன் தயவு கிடைத்தது?” என்றாள்.
