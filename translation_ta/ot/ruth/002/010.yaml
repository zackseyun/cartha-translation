  text: וַ/תִּפֹּל֙ עַל פָּנֶ֔י/הָ וַ/תִּשְׁתַּ֖חוּ אָ֑רְצָ/ה וַ/תֹּ֣אמֶר אֵלָ֗י/ו מַדּוּעַ֩ מָצָ֨אתִי חֵ֤ן בְּ/עֵינֶ֨י/ךָ֙ לְ/הַכִּירֵ֔/נִי וְ/אָּנֹכִ֖י נָכְרִיָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/010.yaml
  text: Then she fell on her face and bowed to the ground and said to him[a], “Why have I found favor in your eyes, that you should take notice of me, though I am a foreign woman?”
translation:
  language: ta
  text: அப்போது அவள் முகங்குப்புற விழுந்து, தரைமட்டும் பணிந்து, அவரிடம், “நான் ஓர் அந்நியப் பெண்ணாயிருந்தும், நீங்கள் என்னைக் கவனிக்கிற அளவுக்கு உங்கள் பார்வையில் எனக்கு ஏன் தயவு கிடைத்தது?” என்றாள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּפֹּל עַל־פָּנֶיהָ
  choice: அவள் முகங்குப்புற விழுந்து
  rationale: முகத்தின் மேல் விழுதல் என்ற எபிரெய உருவகத்தையும் ஆழ்ந்த தாழ்மையின் உடல்சைகையையும் இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: וַתִּשְׁתַּחוּ אָרְצָה
  choice: தரைமட்டும் பணிந்து
  rationale: தரையை நோக்கி ஆழமாகப் பணிந்த செயலைக் காட்டுகிறது; இச்சூழலில் இல்லாத வழிபாட்டு அர்த்தத்தைச் சேர்க்கவில்லை.
- source_word: מַדּוּעַ
  choice: ஏன்
  rationale: காரணத்தை வினவும் சொல்லுக்கு இயல்பான நேரடி தமிழ் இணை.
- source_word: מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: உங்கள் பார்வையில் எனக்கு தயவு கிடைத்தது
  rationale: ஒருவருடைய கண்களில் தயவு பெறுதல் என்ற எபிரெய மரபுத்தொடரின் உருவகத்தை இயல்பான தமிழில் ‘உங்கள் பார்வையில்’ எனத் தக்கவைக்கிறது; இச்சமூகச் சூழலுக்கு ‘தயவு’ பொருத்தமானது.
- source_word: לְהַכִּירֵנִי
  choice: நீங்கள் என்னைக் கவனிக்கும்படி
  rationale: இங்கு נכר என்பதன் causative வடிவம் அடையாளம் காணுதல், பொருட்படுத்துதல், கவனம் செலுத்துதல் ஆகிய பொருள் நிழல்களை உடையது. போவாஸ் ரூத்தைச் சாதகமாகக் கவனித்ததை ‘கவனிக்கும்படி’ இயல்பாகத் தெரிவிக்கிறது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: וְאָנֹכִי
  choice: நான் ... ஆயிருந்தும்
  rationale: இணைப்புச்சொல்லும் தனிப்பட்ட சுட்டுப்பெயரும் சூழலில் காட்டும் concessive contrast-ஐ, ‘ஆயிருந்தும்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: נָכְרִיָּה
  choice: ஓர் அந்நியப் பெண்
  rationale: பெண்பால் ஒருமையைத் தெளிவாகக் காத்து, இஸ்ரவேலரல்லாத பெண் என்ற சமூக அடையாளத்தை நவீனத் தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: וַתִּשְׁתַּחוּ என்பதில் வழிபாட்டு நுட்பப்பொருள் இருக்குமா?
  choice: போவாஸுக்கு முன் மரியாதையுடனும் தாழ்மையுடனும் தரைமட்டும் பணிந்ததாக மொழிபெயர்க்கப்பட்டது.
  alternative: இறை வழிபாட்டைக் குறிக்கும் வகையில் ‘வழிபட்டாள்’ என்று மொழிபெயர்த்தல்.
  rationale: கதைச் சூழலில் ரூத் போவாஸிடம் சமூக மரியாதையையும் தாழ்மையையும் காட்டுகிறாள்; அவரைத் தெய்வமாக வழிபடுவதாக உரை கூறவில்லை. ஆகவே செயலைத் தக்கவைத்து, உரையில் இல்லாத இறையியல் கூற்றைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. உரையாடலில் மரியாதைப் பன்மையான ‘நீங்கள்’ பயன்படுத்தப்பட்டுள்ளது. எபிரெய மரபுத்தொடரான ‘கண்களில் தயவு கிடைத்தல்’ என்பதன் உருவகம், தமிழில் இயல்பாக ஒலிக்க ‘உங்கள் பார்வையில் ... தயவு கிடைத்தது’ என வழங்கப்பட்டுள்ளது.
