theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே
  rationale: தெய்வீகப் பெயரை 'ஆண்டவர்' என்ற பட்டமாக மாற்றாமல் தனிப்பெயராகக் காக்கிறது; நவீனத் தமிழில் பரவலாக அறியப்படும் வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- issue: கடவுளின் சிறகுகளின்கீழ் அடைக்கலம் என்ற உருவகம்
  choice: உருவகத்தை அப்படியே வைத்தல்
  alternative: அவருடைய பாதுகாப்பில்
  rationale: மூலத்தின் செறிவான பாதுகாப்பு உருவகத்தையும் அதன் வேதாகமத் தொடர்புகளையும் விளக்கவுரையாகச் சுருக்காமல் பாதுகாக்கிறது.
