  text: May Yahweh repay your work[a], and may your reward be full from Yahweh, the God of Israel, under whose wings you have come to seek refuge.
translation:
  language: ta
  text: யாவே உன் செயலுக்குக் கைம்மாறு செய்வாராக; நீ அவருடைய சிறகுகளின்கீழ் அடைக்கலம் தேடி வந்திருக்கிற இஸ்ரவேலின் கடவுளாகிய யாவேயிடமிருந்து உனக்கான கைம்மாறு முழுமையானதாக இருப்பதாக.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உனக்கான கூலி முழுமையானதாக இருப்பதாக” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் கூலி அல்லது கைம்மாறு என்பதைக் குறிக்கலாம்; “முழுமையான” என்பதும் முதல் வாக்கியத்தில் “கைம்மாறு செய்வாராக” என்று மொழிபெயர்க்கப்பட்ட சொல்லும் தொடர்புடைய எபிரெய வேரிலிருந்து வருகின்றன.
    reason: lexical_alternative
