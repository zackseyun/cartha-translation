translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்தியுள்ளது. ரூத்தின் பணிவான சமூக மொழிநடை ‘நீர்/உமது’ மற்றும் ‘என் ஆண்டவரே’ என்பவற்றால் பாதுகாக்கப்பட்டுள்ளது; மூலமொழியின் ‘இதயத்தோடு பேசுதல்’ உருவகம் முதன்மை உரையில் வைக்கப்பட்டு, அதன் வழக்குப் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
