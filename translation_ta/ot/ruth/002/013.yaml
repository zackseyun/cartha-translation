  text: וַ֠/תֹּאמֶר אֶמְצָא חֵ֨ן בְּ/עֵינֶ֤י/ךָ אֲדֹנִ/י֙ כִּ֣י נִֽחַמְתָּ֔/נִי וְ/כִ֥י דִבַּ֖רְתָּ עַל לֵ֣ב שִׁפְחָתֶ֑/ךָ וְ/אָנֹכִי֙ לֹ֣א אֶֽהְיֶ֔ה כְּ/אַחַ֖ת שִׁפְחֹתֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/013.yaml
  text: Then she said[a], “May I find favor in your eyes, my lord, because you have comforted me and because you have spoken to the heart of your servant, though I am not like one of your female servants.”
translation:
  language: ta
  text: அப்போது அவள், “என் ஆண்டவரே, உமது கண்களில் எனக்குத் தயவு கிடைக்கட்டும். நீர் எனக்கு ஆறுதல் அளித்து, உமது பணிப்பெண்ணின் மனதைத் தேற்றும் வகையில் பேசியிருக்கிறீர்[a]; ஆனாலும் நான் உமது பணிப்பெண்களில் ஒருத்தியைப்போலக்கூட இல்லை” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உமது பணிப்பெண்ணிடம் அன்பாகப் பேசியிருக்கிறீர்.” எபிரெய மொழியில் சொல்லர்த்தமாக, “உமது பணிப்பெண்ணின் இதயத்தோடு பேசியிருக்கிறீர்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶמְצָא חֵן
  choice: எனக்குத் தயவு கிடைக்கட்டும்
  rationale: முற்றுப்பெறாத வினை இங்கு பணிவான விருப்பத்தை வெளிப்படுத்துகிறது; ‘தயவு கிடைக்கட்டும்’ என்பது அருளான அங்கீகாரத்தை நாடும் எபிரெயச் சொற்றொடரின் பொருளை இயல்பாகத் தருகிறது.
- source_word: בְּעֵינֶיךָ
  choice: உமது கண்களில்
  rationale: மதிப்பீட்டையும் தயவையும் குறிக்கும் மூலமொழியின் உருவகத்தைத் தமிழிலும் புரிந்துகொள்ளக்கூடிய வகையில் பாதுகாக்கிறது.
- source_word: אֲדֹנִי
  choice: என் ஆண்டவரே
  rationale: இது போவாசை நோக்கிய மரியாதையான மனித அழைப்பு; இறைப்பட்டமல்ல. சமூகப் பணிவையும் மரியாதையையும் தக்கவைக்கிறது.
- source_word: נִחַמְתָּנִי
  choice: நீர் எனக்கு ஆறுதல் அளித்து
  rationale: ரூத்தின் பாதிப்புக்குள்ளான நிலைக்கு எதிராக வழங்கப்பட்ட தேற்றுதலையும் உணர்வுபூர்வமான ஆறுதலையும் வெளிப்படுத்துகிறது.
- source_word: דִבַּרְתָּ עַל־לֵב
  choice: இதயத்தோடு பேசியிருக்கிறீர்
  rationale: ‘இதயத்திடம்/இதயத்தோடு பேசுதல்’ என்ற எபிரெய உருவகத்தைப் பாதுகாக்கிறது; அதன் இயல்பான பொருளான அன்பாகப் பேசி தேற்றுதல் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: שִׁפְחָתֶךָ / שִׁפְחֹתֶיךָ
  choice: உமது பணிப்பெண் / உமது பணிப்பெண்கள்
  rationale: பெண்பால் பணியாளரைக் குறிக்கும் சொல்லின் பாலினத் தன்மையையும், ரூத்தின் பணிவான சுயக்குறிப்பையும் ஒரே சொல்லால் சீராகப் பாதுகாக்கிறது.
- source_word: וְאָנֹכִי לֹא אֶהְיֶה כְּאַחַת
  choice: ஆனாலும் நான் ... ஒருத்தியைப்போலக்கூட இல்லை
  rationale: போவாசின் கருணைக்கும் ரூத் தன்னை அவருடைய பணிப்பெண்களைவிடத் தாழ்வாகக் காண்பதற்கும் இடையிலான முரண்பாட்டைத் தெளிவாகக் காட்டுகிறது; ‘கூட’ என்பது வலியுறுத்தலை இயல்பாக்குகிறது.
