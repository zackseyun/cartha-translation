  yaml_path: translation/ot/ruth/002/015.yaml
  text: When she rose to glean[a], Boaz commanded his young men, saying, “Let her glean even among the sheaves[b], and do not humiliate her.”
translation:
  language: ta
  text: அவள் கதிர்களைப் பொறுக்க எழுந்தபோது, போவாஸ் தன் இளைஞர்களுக்குக் கட்டளையிட்டு, “அவள் கதிர்க்கட்டுகளுக்கு நடுவிலும்[a] கதிர்களைப் பொறுக்கட்டும்; அவளை அவமானப்படுத்தாதீர்கள்[b]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கதிர்க்கட்டுகளுக்கு இடையிலும்.” எபிரெயச் சொல் பொருட்களின் நடுவிலோ இடையிலோ இருப்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவளை வெட்கப்படுத்தாதீர்கள்.” எபிரெய வினை ஒருவருக்கு அவமானத்தையோ சமூக இழிவையோ ஏற்படுத்துவதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּקָם
  choice: அவள் ... எழுந்தபோது
  rationale: קום என்ற வினையின் எழுதல் என்ற பொருளையும், தொடர் நிகழ்வில் போவாஸின் கட்டளையோடு உள்ள காலத் தொடர்பையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לְלַקֵּט
  choice: கதிர்களைப் பொறுக்க
  rationale: לקט என்பது அறுவடைக்குப் பின் விடப்பட்ட கதிர்களைச் சேகரிப்பதைக் குறிக்கிறது; தமிழில் சூழலைத் தெளிவாக்க ‘கதிர்களைப் பொறுக்க’ என்பது இயல்பான தேர்வு.
- source_word: וַיְצַו ... לֵאמֹר
  choice: கட்டளையிட்டு ... என்றார்
  rationale: צוה என்பதன் அதிகாரமுள்ள கட்டளைத் தன்மையை ‘கட்டளையிட்டு’ காக்கிறது; לאמר என்ற எபிரெயப் பேச்சு அறிமுகத்தை இயல்பான தமிழ் மேற்கோள் முடிவான ‘என்றார்’ மூலம் தருகிறது.
- source_word: נְעָרָיו
  choice: தன் இளைஞர்களுக்கு
  rationale: נַעַר என்பதன் இளைஞர் என்ற அடிப்படைப் பொருளையும் ஆண்பால் குறிப்பையும் காக்கிறது; இச்சூழலில் அவர்கள் போவாஸின் வயல் பணியாளர்கள் என்பது பின்னணியால் விளங்குகிறது.
- source_word: גַּם
  choice: '...இலும்'
  rationale: அனுமதி வழக்கமான எல்லையைத் தாண்டி அரிக்கட்டுகளுக்கு நடுவும் விரிவடைவதைத் தமிழ் இணைவேற்றுமை உருபு இயல்பாக உணர்த்துகிறது.
- source_word: בֵּין הָעֳמָרִים
  choice: அரிக்கட்டுகளுக்கு நடுவிலும்
  rationale: בֵּין என்பதன் ‘நடுவில்/இடையில்’ என்ற இடப்பொருளைக் காக்கிறது. עֳמָרִים என்பது அறுத்த தானியத் தண்டுகளின் கட்டுகளைக் குறிக்கும்; ‘அரிக்கட்டுகள்’ சுருக்கமான, வேளாண்மைச் சூழலுக்கேற்ற தமிழ்.
- source_word: תְּלַקֵּט
  choice: கதிர்களைப் பொறுக்கட்டும்
  rationale: இங்கு உள்ள அனுமதியளிக்கும் கட்டளைத் தன்மையை ‘-ட்டும்’ வடிவம் துல்லியமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: וְלֹא תַכְלִימוּהָ
  choice: அவளை அவமானப்படுத்தாதீர்கள்
  rationale: כלם என்பதன் Hiphil வடிவம் ஒருவரை வெட்கத்திற்கோ சமூக இழிவிற்கோ உள்ளாக்குவதைக் குறிக்கிறது; ‘அவமானப்படுத்தாதீர்கள்’ அந்த வலிமையை நவீனத் தமிழில் காக்கிறது.
