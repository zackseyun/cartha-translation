base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/004.yaml
  text: And behold[a], Boaz came from Bethlehem and said to the reapers, “Yahweh be with you.” And they said to him[b], “May Yahweh bless you.”
translation:
  language: ta
  text: இதோ,[a] போவாஸ் பெத்லெகேமிலிருந்து வந்து அறுவடை செய்கிறவர்களிடம், “யாவே உங்களோடு இருப்பாராக!”[b] என்றார். அவர்களும் அவரிடம், “யாவே உங்களை ஆசீர்வதிப்பாராக!”[c] என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இதோ” என்பது போவாஸின் வருகையை உயிரோட்டத்துடன் அறிமுகப்படுத்தி, வாசகரின் கவனத்தை அதன்மேல் திருப்பும் எபிரெயச் சொல்.
    reason: discourse_marker
  - marker: b
    text: 'எபிரெயில் சொல்லுக்குச் சொல்: “யாவே உங்களோடு.” இங்கு அது வாழ்த்து அல்லது ஆசியாகப் பொருள்படுகிறது; “யாவே உங்களோடு இருக்கிறார்” என்றும் இலக்கணப்படி புரிந்துகொள்ளலாம்.'
    reason: genuine_ambiguity
  - marker: c
    text: இது ஒருவரை நோக்கிச் சொல்லப்படும் ஆசிவாழ்த்து. எபிரெய வினைவடிவம் விருப்பத்தையோ ஆசையையோ வெளிப்படுத்துகிறது.
    reason: grammatical_clarification
lexical_decisions:
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: காட்சியில் நிகழும் புதிய வருகையை வாசகரின் கவனத்துக்குக் கொண்டுவரும் எபிரெயச் சுட்டிடைச்சொல்லின் உயிரோட்டத்தைச் சுருக்கமாகப் பேணுகிறது.
- source_word: בֹּעַז
  choice: போவாஸ்
  rationale: தனிப்பெயரின் எபிரெய ஒலிப்பைத் தமிழில் இயல்பாக எழுத்துப்பெயர்க்கிறது.
- source_word: בָּא מִבֵּית לֶחֶם
  choice: பெத்லெகேமிலிருந்து வந்து
  rationale: வருகையையும் அதன் தொடக்க இடத்தையும் நேரடியாகக் காட்டுகிறது; அடுத்த வினையுடன் இயல்பான தமிழ் தொடராக அமைகிறது.
- source_word: לַקּוֹצְרִים
  choice: அறுவடை செய்கிறவர்களிடம்
  rationale: קצר என்பதன் அறுத்தல் அல்லது அறுவடை செய்தல் என்ற வேளாண் பொருளை, இன்றைய வாசகருக்குத் தெளிவான மொழியில் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் நேரடியாக இடம்பெறும் தேவனுடைய தனிப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் எழுத்துப்பெயர்க்கிறது.
- source_word: עִמָּכֶם
  choice: உங்களோடு இருப்பாராக
  rationale: சொல்லுக்குச் சொல் வடிவில் வினை இல்லாவிட்டாலும், இச்சூழலில் இது வெறும் கூற்றல்ல; வாழ்த்து அல்லது ஆசியாக இருப்பதால் விருப்பநிலையைத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: יְבָרֶכְךָ
  choice: உங்களை ஆசீர்வதிப்பாராக
  rationale: எபிரெய வினைவடிவத்தின் விருப்ப அல்லது ஆசிப் பொருளைப் பேணுகிறது. ஒருவரைக் குறித்தாலும் மரியாதையான தமிழ் வழக்கில் “உங்களை” பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலவசனம் ஒரு பொதுப் பட்டத்தை அல்ல, இஸ்ரவேலின் தேவனுடைய தனிப்பெயரைப் பயன்படுத்துகிறது. ஆகவே அந்தப் பெயர் தமிழில் எழுத்துப்பெயர்க்கப்பட்டுள்ளது.
- issue: יְהוָה עִמָּכֶם என்பதன் இலக்கணத் தன்மை
  choice: “யாவே உங்களோடு இருப்பாராக!” என்ற ஆசிவாழ்த்து
  alternative: “யாவே உங்களோடு இருக்கிறார்” என்ற கூற்று
  rationale: வினையில்லாத எபிரெயத் தொடர் இருவகையாகப் புரியக்கூடியதாயினும், வேலைக்காரர்களின் பதில் ஆசிவாழ்த்தாக இருப்பதும் உரையாடல் சூழலும் இதனை வாழ்த்து அல்லது ஆசியாகப் புரிந்துகொள்ள வலுவாக ஆதரிக்கின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. போவாஸ் பல அறுவடையாளர்களிடம் பேசுவதால் “உங்களோடு” என்றும், அவர்கள் ஒருவரான போவாஸை மரியாதையுடன் நோக்கிப் பேசுவதால் “உங்களை” என்றும் வழங்கப்பட்டுள்ளது. உரையாடலின் ஆசிவாழ்த்துத் தொனியை “இருப்பாராக,” “ஆசீர்வதிப்பாராக” என்ற வடிவங்கள் பேணுகின்றன.
