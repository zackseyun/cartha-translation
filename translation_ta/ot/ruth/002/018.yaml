base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/018.yaml
  text: She picked it up and went into the city[a], and her mother-in-law saw what she had gleaned. Then she brought out and gave her what she had left over after she was satisfied.
translation:
  language: ta
  text: அவள் அதைத் தூக்கிக்கொண்டு ஊருக்குள் சென்றாள். அவள் பொறுக்கிச் சேகரித்ததை அவளுடைய மாமியார் பார்த்தாள். மேலும், அவள் வயிறார உண்டபின் மீதமானதை வெளியே எடுத்து மாமியாருக்குக் கொடுத்தாள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּשָּׂא
  choice: அதைத் தூக்கிக்கொண்டு
  rationale: נשׂא என்பதன் தூக்குதல்/சுமத்தல் என்ற உடல் செயலைத் தக்கவைத்து, சேகரித்த தானியத்தை ரூத் எடுத்துச் செல்வதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: הָעִיר
  choice: ஊருக்குள்
  rationale: עִיר என்பதற்கு நகரம் என்ற நேரடி பொருள் இருந்தாலும், பெத்லெகேம் என்ற கதைச் சூழலில் நவீன தமிழில் ‘ஊர்’ இயல்பாகவும் அளவை மிகைப்படுத்தாமலும் உள்ளது.
- source_word: חֲמוֹתָהּ
  choice: அவளுடைய மாமியார்
  rationale: உறவுமுறையையும் மூன்றாம் நபர் பெண்பால் பின்னொட்டையும் தெளிவாகக் காட்டும் வழக்கமான தமிழ் சொல்.
- source_word: אֵת אֲשֶׁר לִקֵּטָה
  choice: அவள் சேகரித்திருந்ததை
  rationale: לקט என்பது அறுவடைக்குப் பின் சிதறியதைப் பொறுக்கிச் சேகரிப்பதைக் குறிக்கிறது. ஒரே சொல்லில் இதை இயல்பாகச் சொல்லும் பொதுவான நவீன தமிழ் இல்லாததால், சூழலுக்கு ஏற்ற ‘சேகரித்திருந்ததை’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: וַתּוֹצֵא
  choice: வெளியே எடுத்து
  rationale: Hiphil வடிவிலுள்ள יצא என்பதன் ‘வெளியே கொண்டுவருதல்/எடுத்தல்’ என்ற செயலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וַתִּתֶּן לָהּ
  choice: மாமியாருக்குக் கொடுத்தாள்
  rationale: לָהּ குறிக்கும் பெண் மறைமுகச் செயப்படுபொருள் தமிழில் குழப்பமின்றி தெரிய, இயல்பான பெயர்ச்சொல் மீளுரைப்பைப் பயன்படுத்துகிறது.
- source_word: אֵת אֲשֶׁר הוֹתִרָה
  choice: மீதியாக வைத்திருந்ததை
  rationale: יתר என்பதன் மீதியாய் விடுதல் என்ற பொருளையும், ரூத் உணவின் ஒரு பகுதியை நகோமிக்காக வைத்திருந்த கதைச் சூழலையும் தக்கவைக்கிறது.
- source_word: מִשָּׂבְעָהּ
  choice: தான் வயிறார உண்டபின்
  rationale: שׂבע குறிக்கும் திருப்தியடையும் அளவு நிறைவை உணவு உண்ட சூழலில் இயல்பாகத் தெரிவிக்கிறது; ‘தான்’ என்பது ரூத்தையே குறிக்கிறது என்பதைத் தெளிவாக்குகிறது.
