  register: நவீன தரத் தமிழில், சாதாரண வாசகர்களுக்கு விளங்கும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய வினைத் தொடரை அப்படியே இயந்திரமாகப் பின்பற்றாமல் இயல்பான தமிழ் வாக்கியங்களாகப் பிரித்துள்ளதுடன், செயல்களின் வரிசை பாதுகாக்கப்பட்டுள்ளது.
