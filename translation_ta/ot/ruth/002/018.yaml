    rationale: ‘சேகரித்திருந்ததை’ என்பது பொதுவான சேகரிப்பைக் குறிக்கலாம்; இவ்வசனத்தில் அறுவடைக்குப் பின் கிடந்ததைப் பொறுக்கும் செயல் முக்கியமான கதைச்சூழல் கூறாகும்.
