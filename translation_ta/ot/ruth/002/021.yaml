base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/021.yaml
  text: Then Ruth the Moabite said[a], “He also said to me, ‘You are to stay close by my young women until they have finished all my harvest.’”
translation:
  language: ta
  text: அப்போது மோவாபியப் பெண்ணான ரூத், “மேலும் அவர் என்னிடம், ‘என் இளைஞர்களோடு[a] நெருக்கமாகவே இரு; அவர்கள் எனக்குரிய அறுவடைப் பணிகள் அனைத்தையும் முடிக்கும் வரை’ என்று சொன்னார்” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய வேதாகமத்தின் ஓரக்குறிப்பு வாசகம், “என் இளம்பெண்களோடு” என்று வாசிக்கிறது; எழுதப்பட்ட மூலவாசகம், “என் இளைஞர்களோடு” என்று உள்ளது.
    reason: textual_variant
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: அப்போது ... என்றாள்
  rationale: வாவ்-தொடர்வினை கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது; ‘அப்போது’ என்பது இயல்பான தமிழ் கதைநடையைத் தருகிறது.
- source_word: רוּת הַמּוֹאֲבִיָּה
  choice: மோவாபியப் பெண்ணான ரூத்
  rationale: பெயரையும் மோவாபிய இன அடையாளத்தையும் தெளிவான நவீன தமிழில் காக்கிறது.
- source_word: גַּם כִּי אָמַר אֵלַי
  choice: மேலும் அவர் என்னிடம் ... சொன்னார்
  rationale: גַּם என்பது ரூத் ஏற்கெனவே கூறிய செய்தியுடன் இன்னொரு தகவலைச் சேர்ப்பதை வெளிப்படுத்துகிறது.
- source_word: עִם הַנְּעָרִים אֲשֶׁר לִי
  choice: என்னுடைய இளைஞர்களோடு
  rationale: எபிரெயச் சொல் ஆண்பால் பன்மையில் உள்ளது; עִם என்பதன் அடிப்படைப் பொருளான ‘உடன்/ஓடு’ என்பதும் காக்கப்படுகிறது. சூழலில் இவர்கள் போவாசின் வேலைக்கார இளைஞர்களாக இருக்கலாம்.
- source_word: תִּדְבָּקִין
  choice: சேர்ந்தே இரு
  rationale: דבק என்பதிலுள்ள நெருக்கமாக ஒட்டியிருத்தல் அல்லது பிரியாமல் உடனிருத்தல் என்ற கருத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: עַד אִם כִּלּוּ אֵת כָּל הַקָּצִיר אֲשֶׁר לִי
  choice: என் அறுவடை முழுவதையும் முடிக்கும்வரை
  rationale: செயல் முடியும் எல்லையையும், அறுவடை முழுவதும் போவாசுக்குரியது என்பதையும் சுருக்கமாகவும் தெளிவாகவும் வழங்குகிறது.
