revisions:
- from: அப்போது மோவாபியப் பெண்ணான ரூத், “மேலும் அவர் என்னிடம், ‘என் அறுவடை முழுவதையும் முடிக்கும்வரை என்னுடைய இளைஞர்களோடு[a] சேர்ந்தே இரு’ என்று சொன்னார்” என்றாள்.
  to: அப்போது மோவாபியப் பெண்ணான ரூத், “மேலும் அவர் என்னிடம், ‘என் இளைஞர்களோடு[a] நெருக்கமாகவே இரு; அவர்கள் எனக்குரிய அறுவடைப் பணிகள் அனைத்தையும் முடிக்கும் வரை’ என்று சொன்னார்” என்றாள்.
  rationale: The revision retains the WLC written reading “young men” in the main text, while accurately recording the marginal reading “young women” in the footnote. It also clarifies that the workers, not the harvest as an abstraction, complete the harvest work. This preserves the source’s textual ambiguity without adopting the English audit trail’s unsupported explanation.
