revisions:
- from: அவள் போய், வந்து, அறுவடை செய்பவர்களுக்குப் பின்னால் வயலில் சிந்திய கதிர்களைப் பொறுக்கினாள். அவள் தற்செயலாகப் போய்ச் சேர்ந்த வயலின் பகுதி, எலிமெலேக்கின் குடும்பத்தைச் சேர்ந்த போவாசுக்கு உரியதாக இருந்தது.[a]
  to: அவள் போய், வந்து, வயலில் அறுவடை செய்பவர்களுக்குப் பின்னால் சிந்திய கதிர்களைப் பொறுக்கினாள். தற்செயலாக, அவள் எலிமெலேக்கின் குடும்பத்தைச் சேர்ந்த போவாஸுக்கு உரிய வயல் பகுதிக்குப் போய்ச் சேர்ந்தாள்.[a]
  rationale: The revision retains the Hebrew sequential motion verbs and the agricultural action of gleaning, while making the idiom of apparent chance unambiguously modify Ruth’s arrival. It also uses a source-faithful Tamil form of Boaz’s name. The footnote preserves the narrative tension between apparent chance and the book’s wider invitation to perceive divine guidance, without inserting that interpretation into the main text.
