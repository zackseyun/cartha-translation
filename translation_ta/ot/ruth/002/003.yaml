base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/003.yaml
  text: So she went and came and gleaned in the field behind the reapers[a], and she happened to come to the portion of the field belonging to Boaz, who was from the family of Elimelech.
translation:
  language: ta
  text: அவள் போய், வந்து, வயலில் அறுவடை செய்பவர்களுக்குப் பின்னால் சிந்திய கதிர்களைப் பொறுக்கினாள். தற்செயலாக, அவள் எலிமெலேக்கின் குடும்பத்தைச் சேர்ந்த போவாஸுக்கு உரிய வயல் பகுதிக்குப் போய்ச் சேர்ந்தாள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “அவளுடைய தற்செயல் தற்செயலாக நேரிட்டது” என்பதுபோன்ற சொற்றொடர் உள்ளது. இது மனிதப் பார்வையில் தோன்றும் தற்செயலைக் குறிக்கிறது; அதேவேளையில், நூலின் விரிந்த கதை இறைவனின் வழிநடத்துதல் செயல்படுவதை வாசகர் உணர இடமளிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶךְ וַתָּבוֹא
  choice: அவள் போய், வந்து
  rationale: எபிரெய உரையின் படிப்படியான கதைநடையையும் இரு இயக்க வினைகளையும் இயன்றவரை இயல்பான தமிழில் காக்கிறது.
- source_word: וַתְּלַקֵּט
  choice: சிந்திய கதிர்களைப் பொறுக்கினாள்
  rationale: அறுவடைக்குப் பின் விடப்பட்ட தானியக் கதிர்களைச் சேகரிக்கும் לקט என்ற வேளாண்மைச் செயலை சாதாரண தமிழ் வாசகருக்குத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: בַּשָּׂדֶה אַחֲרֵי הַקֹּצְרִים
  choice: அறுவடை செய்பவர்களுக்குப் பின்னால் வயலில்
  rationale: אַחֲרֵי என்பதன் இடஞ்சார்ந்த பொருளையும், அறுப்பவர்களைத் தொடர்ந்து பொறுக்கும் காட்சியையும் காக்கிறது.
- source_word: וַיִּקֶר מִקְרֶהָ
  choice: அவள் தற்செயலாகப் போய்ச் சேர்ந்த
  rationale: ஒரே வேரிலிருந்து வந்த வினை–பெயர்ச்சொல் இணைப்பை மரத்தனமாகப் பிரதிபலிக்காமல், மனிதப் பார்வையில் நிகழ்ந்த தற்செயலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: חֶלְקַת הַשָּׂדֶה
  choice: வயலின் பகுதி
  rationale: חֶלְקָה குறிக்கும் நிலத்தின் பங்கு அல்லது துண்டை எளிய, துல்லியமான தமிழில் தருகிறது.
- source_word: לְבֹעַז
  choice: போவாசுக்கு உரியதாக
  rationale: லாமேத் குறிக்கும் உடைமை அல்லது தொடர்பைத் தெளிவான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר מִמִּשְׁפַּחַת אֱלִימֶלֶךְ
  choice: எலிமெலேக்கின் குடும்பத்தைச் சேர்ந்த
  rationale: מִשְׁפָּחָה என்பதற்கு இச்சூழலில் அணுகத்தக்க பொதுவான ‘குடும்பம்’ என்பதைத் தேர்ந்தெடுக்கிறது; ‘குலம்’ என்பதும் சாத்தியம்.
theological_decisions:
- issue: தற்செயலாகத் தோன்றும் நிகழ்வுக்கும் இறை வழிநடத்துதலுக்கும் இடையிலான கதைத் tension
  choice: மனிதப் பார்வையில் ‘தற்செயலாக’ என்று முதன்மை உரையில் மொழிபெயர்த்தல்
  alternative: இறைவனின் பராமரிப்பை அல்லது வழிநடத்துதலை முதன்மை உரையிலேயே வெளிப்படையாகச் சேர்த்தல்
  rationale: எபிரெய சொற்றொடர் நிகழ்வை வெளிப்படையான தற்செயலாக விவரிக்கிறது; நூலின் விரிந்த கதை இறை வழிநடத்துதலை உணர வாசகரை அழைக்கிறது. மொழிபெயர்ப்பு இந்த இரு நிலைகளுக்கிடையிலான நுட்பத்தைத் தீர்த்துவிடாமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான, கண்ணியமான தமிழ். ‘glean’ என்பதற்குத் தனிச்சொல் மட்டும் பயன்படுத்தாமல், பழங்கால அறுவடைச் செயலைத் தெளிவுபடுத்த ‘சிந்திய கதிர்களைப் பொறுக்கினாள்’ என மொழிபெயர்க்கப்பட்டது. பெயர்கள் ‘போவாஸ்’ அல்ல, எபிரெய ஒலிப்புக்கு நெருக்கமாக ‘போவாசு’; ‘எலிமெலேக்கு’ எனத் தரப்பட்டுள்ளன.
