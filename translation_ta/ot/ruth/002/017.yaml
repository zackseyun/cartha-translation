  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/תְּלַקֵּ֥ט בַּ/שָּׂדֶ֖ה עַד הָ/עָ֑רֶב וַ/תַּחְבֹּט֙ אֵ֣ת אֲשֶׁר לִקֵּ֔טָה וַ/יְהִ֖י כְּ/אֵיפָ֥ה שְׂעֹרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/017.yaml
  text: So she gleaned in the field until evening[a], and beat out what she had gleaned, and it was about an ephah of barley.
translation:
  language: ta
  text: அவள் மாலைவரை வயலில் கதிர்களைப் பொறுக்கினாள். அவள் பொறுக்கியவற்றை அடித்துத் தானியத்தைப் பிரித்தெடுத்தாள்; அது ஏறக்குறைய ஓர் எப்பா[a] அளவு வாற்கோதுமையாக இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எப்பா என்பது பண்டைய காலத்தில் உலர் பொருட்களை அளக்கப் பயன்படுத்தப்பட்ட ஓர் அளவை; அது ஏறக்குறைய 20–22 லிட்டர்.
    reason: cultural_note
lexical_decisions:
- source_word: וַתְּלַקֵּט
  choice: கதிர்களைப் பொறுக்கினாள்
  rationale: ரூத் நூலின் அறுவடைச் சூழலில் לקט என்பது அறுவடை செய்பவர்கள் விட்டுச்சென்ற கதிர்களைப் பொறுக்குவதைக் குறிக்கிறது. ‘சேகரித்தாள்’ என்பதைவிட இந்த வேளாண் நடைமுறையை இச்சொற்றொடர் தெளிவாகக் காட்டுகிறது.
- source_word: בַּשָּׂדֶה
  choice: வயலில்
  rationale: שָׂדֶה என்பதற்கான இயல்பான நவீனத் தமிழ் இணை ‘வயல்’; இங்கு ரூத் வேலை செய்த குறிப்பிட்ட வயலைச் சுட்டுகிறது.
- source_word: עַד הָעָרֶב
  choice: மாலைவரை
  rationale: அவளுடைய உழைப்பு நீடித்த கால எல்லையை இயல்பான தமிழில் துல்லியமாகக் காட்டுகிறது.
- source_word: וַתַּחְבֹּט
  choice: அடித்துத் தானியத்தைப் பிரித்தெடுத்தபோது
  rationale: חבט என்பது பொறுக்கிய கதிர்களை அடித்து அவற்றிலிருந்து தானியத்தைப் பிரிப்பதைக் குறிக்கிறது. வெறும் ‘அடித்தாள்’ என்பதில் தெளிவாகாத செயலை இவ்வாக்கியம் வெளிப்படுத்துகிறது.
- source_word: אֵת אֲשֶׁר לִקֵּטָה
  choice: தான் பொறுக்கியதை
  rationale: எபிரெய உறவுநிலை அமைப்பைப் பொருள்மாறாமல் இயல்பான தமிழில் தருகிறது; לקט என்பதோடு சொல் ஒற்றுமையும் பேணப்படுகிறது.
- source_word: וַיְהִי
  choice: கிடைத்தது
  rationale: கதிர்களை அடித்துப் பிரித்த பின் கிடைத்த தானியத்தின் அளவைத் தெரிவிக்கும் முடிவுநிலையைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כְּאֵיפָה
  choice: ஏறக்குறைய ஓர் எப்பா அளவு
  rationale: כְּ முன்னொட்டின் தோராயப் பொருளை ‘ஏறக்குறைய’ என்பதும், பண்டைய அளவையின் வரலாற்றுப் பெயரை ‘எப்பா’ என்பதும் பாதுகாக்கின்றன.
- source_word: שְׂעֹרִים
  choice: வாற்கோதுமை
  rationale: שְׂעֹרִים என்பது barley தானியத்தைக் குறிக்கிறது; அதற்கான தெளிவான நவீனத் தமிழ் பெயர் ‘வாற்கோதுமை’.
