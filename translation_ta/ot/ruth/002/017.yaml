translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேளாண் சூழலைத் தெளிவாகக் காட்டும் வகையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. வரலாற்று அளவையான ‘எப்பா’ உரையில் தக்கவைக்கப்பட்டு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
