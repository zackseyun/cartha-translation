base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/009.yaml
  text: Keep your eyes on the field where they are harvesting[a], and follow behind them. Have I not commanded the young men not to touch you? When you are thirsty, go to the jars and drink from what the young men have drawn.
translation:
  language: ta
  text: அவர்கள் அறுவடை செய்துகொண்டிருக்கும் வயலையே கவனித்துக்கொள்; அந்தப் பெண்களின் பின்னால் செல். உன்னைத் தொடக்கூடாது என்று இளைஞர்களுக்குக் கட்டளையிட்டேனே?[a] உனக்குத் தாகம் எடுக்கும்போது, தண்ணீர்ப் பாத்திரங்களிடம் சென்று, இளைஞர்கள் மொண்டுவைத்த தண்ணீரிலிருந்து குடி.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, சூழலுக்கேற்ப, “உன் மேல் கை வைக்கக்கூடாது.” எபிரேயத்தில் நேரடியாக “உன்னைத் தொடக்கூடாது” என்று உள்ளது; இதில் தொந்தரவு செய்வதிலிருந்தும் தாக்குவதிலிருந்தும் பாதுகாப்பது அடங்கியிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינַיִךְ
  choice: உன் கண்கள் இருக்கட்டும்
  rationale: எபிரேயத்தில் வினையில்லாமல் வரும் ‘உன் கண்கள்’ என்ற சொற்றொடரின் அறிவுறுத்தல் வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בַּשָּׂדֶה אֲשֶׁר יִקְצֹרוּן
  choice: அவர்கள் அறுவடை செய்துகொண்டிருக்கும் வயல்மீதே
  rationale: தொடர்ந்து நடக்கும் அறுவடைச் செயலைக் காட்டுவதோடு, ரூத் கவனிக்க வேண்டிய வயலைத் தெளிவாக அடையாளப்படுத்துகிறது.
- source_word: וְהָלַכְתִּ אַחֲרֵיהֶן
  choice: அந்தப் பெண்களின் பின்னால் போ
  rationale: அசல் உரையிலுள்ள பெண்பால் பன்மை விகுதியைத் தமிழில் வெளிப்படையாகக் காட்டி, அவர்களுக்குப் பின்னால் செல்லும் இடவியல் பொருளையும் காக்கிறது.
- source_word: הֲלוֹא צִוִּיתִי
  choice: கட்டளையிட்டிருக்கிறேன் அல்லவா?
  rationale: போவாஸின் அதிகாரத்தையும் உறுதியளிக்கும் சொல்லாட்சியையும் காத்து, எபிரேய வினாவடிவை இயல்பான தமிழில் வழங்குகிறது.
- source_word: הַנְּעָרִים
  choice: இளைஞர்கள்
  rationale: இங்கு ஆண் பணியாளர்களைக் குறிக்கும் ஆண்பால் பன்மையைப் பாதுகாக்கிறது.
- source_word: לְבִלְתִּי נָגְעֵךְ
  choice: உன்னைத் தொடக் கூடாது
  rationale: נגע என்பதன் நேரடிப் பொருளான ‘தொடு’ என்பதை முதன்மை உரையில் காக்கிறது; சூழலில் உள்ள தொந்தரவு அல்லது தாக்குதல் சார்ந்த வலிமை அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: וְצָמִת
  choice: உனக்குத் தாகம் எடுக்கும்போது
  rationale: எதிர்பார்க்கப்படும் சூழ்நிலையை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: הַכֵּלִים
  choice: தண்ணீர்ப் பாத்திரங்கள்
  rationale: כֵּלִים என்பது பொதுவாகப் ‘பாத்திரங்கள்’; குடிநீர்ச் சூழல் பொருளைத் தெளிவுபடுத்த ‘தண்ணீர்ப்’ சேர்க்கப்பட்டுள்ளது.
- source_word: וְשָׁתִית מֵאֲשֶׁר יִשְׁאֲבוּן הַנְּעָרִים
  choice: இளைஞர்கள் மொண்டு வைத்திருப்பதிலிருந்து குடி
  rationale: கிணறு போன்ற நீராதாரத்திலிருந்து தண்ணீர் எடுப்பதைக் குறிக்கும் שׁאב-க்கு இயல்பான தமிழான ‘மொண்டு’ பயன்படுத்தப்பட்டு, குடிப்பதற்கு முன் நீர் எடுத்து வைக்கப்பட்டிருப்பதும் தெரிவிக்கப்படுகிறது.
theological_decisions:
- issue: ‘தொடுதல்’ என்பதன் சூழல்சார் வலிமை
  choice: முதன்மை உரையில் ‘உன்னைத் தொடக் கூடாது’
  alternative: ‘உன்மேல் கை வைக்கக் கூடாது’
  rationale: எபிரேயச் சொல்லின் நேரடிப் பொருளைக் காக்கும் அதேவேளையில், பாதுகாப்பு, தொந்தரவு அல்லது தாக்குதல் பற்றிய சாத்தியமான உட்பொருளை அடிக்குறிப்பில் விடுகிறது; குறிப்பிட்ட வகைத் தீங்கை மட்டும் நிர்ணயிக்கவில்லை.
translation_notes:
  register: நவீன, மரியாதைமிக்க, எளிதில் புரியும் உரைநடை. அறுவடைச் சூழலுக்கேற்ற ‘வயல்’, ‘மொண்டு’ போன்ற இயல்பான சொற்கள் பயன்படுத்தப்பட்டுள்ளன. பெண்பால் பன்மை விகுதி தமிழில் மறைந்துவிடாதபடி ‘அந்தப் பெண்கள்’ என்று வெளிப்படுத்தப்பட்டுள்ளது.
