base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/008.yaml
  text: 'Then Boaz said to Ruth, “Listen, my daughter: do not go to glean in another field, and also do not go away from here, but stay close with my young women.”'
translation:
  language: ta
  text: 'அப்போது போவாஸ் ரூத்திடம், “கேள், என் மகளே: கதிர் பொறுக்குவதற்காக வேறொரு வயலுக்குப் போகாதே; இங்கிருந்து விலகிப் போகவும் வேண்டாம். என் இளம்பெண்களோடு சேர்ந்தே இரு[a]” என்றான்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சேர்ந்தே இரு” என்பதற்கான எபிரெயச் சொல், அவர்களைவிட்டு விலகாமல் நெருக்கமாக இருக்க வேண்டும் என்ற வலுவான பொருளையும் கொண்டுள்ளது.
    reason: דבק என்ற சொல்லின் நெருக்கமாக ஒட்டியிருத்தல்/விடாமல் இருத்தல் என்ற வலிமையை விளக்குகிறது.
lexical_decisions:
- source_word: הֲלוֹא שָׁמַעַתְּ
  choice: கேட்டுக்கொள்
  rationale: சொல்லப்படவிருப்பதைக் கவனமாகக் கேட்கும்படி அழைக்கும் எபிரெய மரபுத்தொடர். சொல்லுக்குச் சொல் கேள்வியாக மாற்றுவதைவிட, தமிழில் அதன் உரையாடல் நோக்கத்தை இயல்பாகத் தருகிறது.
- source_word: לִלְקֹט
  choice: கதிர் பொறுக்க
  rationale: அறுவடைக்குப் பின் வயலில் எஞ்சிய கதிர்களைச் சேகரிக்கும் செயலைத் தமிழில் தெளிவாகக் குறிக்கிறது.
- source_word: נַעֲרֹתַי
  choice: என் பெண் பணியாளர்கள்
  rationale: נַעֲרוֹת என்பது இளம்பெண்களையோ பெண் பணியாளர்களையோ குறிக்கலாம்; வயலில் போவாஸுக்காக வேலைசெய்யும் பெண்களை இச்சூழல் குறிப்பதால் இத்தேர்வு இயல்பாகவும் சூழலுக்கு ஏற்றதாகவும் உள்ளது.
- source_word: תִדְבָּקִין עִם
  choice: உடனேயே சேர்ந்திரு
  rationale: דבק என்பதன் அடிப்படை உணர்வான ஒட்டியிருத்தல் அல்லது நெருக்கமாகத் தொடர்ந்திருத்தலை, ரூத் அந்தப் பெண்களைவிட்டு விலகாமல் அவர்களோடு இருக்க வேண்டும் என்ற சூழலில் இயல்பான தமிழில் தருகிறது.
