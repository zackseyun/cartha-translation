  register: நவீன தரத் தமிழில் மரியாதையும் உரையாடலின் அன்பான தொனியும் காக்கப்பட்டுள்ளன. “என் மகளே” என்பது போவாஸ் ரூத்திடம் காட்டும் பாதுகாப்பான, அன்பான அணுகுமுறையை நேரடியாகத் தக்கவைக்கிறது.
