  register: நவீனத் தரத் தமிழில், தொழிலாளர்களுக்குக் கொடுக்கப்படும் பன்மை மரியாதைக் கட்டளை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. ‘வேண்டுமென்றே’ என்பது எபிரெய வினைக் கட்டமைப்பின் வலியுறுத்தலையும் செயல் நோக்கமுடையது என்பதையும் இயல்பாகத் தெரிவிக்கிறது.
