  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/גַ֛ם שֹׁל תָּשֹׁ֥לּוּ לָ֖/הּ מִן הַ/צְּבָתִ֑ים וַ/עֲזַבְתֶּ֥ם וְ/לִקְּטָ֖ה וְ/לֹ֥א תִגְעֲרוּ בָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/016.yaml
  text: And also[a], you must surely pull out some for her from the bundles and leave it, so that she may gather it[b], and you must not rebuke her.
translation:
  language: ta
  text: மேலும், அவளுக்காகக் கதிர்க்கட்டுகளிலிருந்து[a] சில கதிர்களை வேண்டுமென்றே உருவி எடுத்து, அவற்றை அங்கேயே விட்டுவிடுங்கள்; அவள் அவற்றைப் பொறுக்கட்டும்[b]. அவளைக் கடிந்துகொள்ளாதீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல் ஒன்றாகச் சேர்க்கப்பட்ட கதிர்த் தண்டுகளின் கட்டுகளைக் குறிக்கிறது.
    reason: lexical_clarification
  - marker: b
    text: அறுவடை செய்யப்பட்ட வயலில் கதிர்களைப் பொறுக்குவதற்கான வழக்கமான எபிரெய வினைச்சொல் இது.
    reason: lexical_clarification
lexical_decisions:
- source_word: וְגַם
  choice: மேலும்
  rationale: இணைப்பையும் முந்தைய கட்டளைக்கு மேலாகச் சேர்க்கப்படும் அறிவுறுத்தலையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: שֹׁל תָּשֹׁלּוּ
  choice: வேண்டுமென்றே உருவி எடுத்து
  rationale: வினைமுற்றுடன் வந்துள்ள வினையெச்சத்தின் வலியுறுத்தலையும், கதிர்களைத் தற்செயலாக அல்லாமல் ரூத்துக்காக நோக்கத்துடன் கட்டுகளிலிருந்து எடுக்க வேண்டும் என்ற சூழல்சார் பொருளையும் வெளிப்படுத்துகிறது.
- source_word: לָהּ
  choice: அவளுக்காக
  rationale: முன்னிடைச்சொல் இங்கு ரூத்தின் நன்மைக்காகச் செய்யப்படும் செயலைக் குறிக்கிறது.
- source_word: מִן הַצְּבָתִים
  choice: கதிர்க்கட்டுகளிலிருந்து
  rationale: அறுவடையில் ஒன்றாகச் சேர்த்துக் கட்டப்பட்ட கதிர்த் தண்டுகளின் தொகுப்பைத் தெளிவாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: וַעֲזַבְתֶּם
  choice: விட்டுவிடுங்கள்
  rationale: உருவி எடுத்த கதிர்களை ரூத் எடுத்துக்கொள்ளும்படி அங்கேயே விட்டுவைக்க வேண்டும் என்ற கட்டளையை இயல்பாகத் தருகிறது.
- source_word: וְלִקְּטָה
  choice: அவள் அவற்றைப் பொறுக்கிக்கொள்ளட்டும்
  rationale: לקט என்பது அறுவடை முடிந்த வயலில் எஞ்சியவற்றைப் பொறுக்குவதற்கான வழக்கமான சொல்; ‘பொறுக்கிக்கொள்ளட்டும்’ அந்த வேளாண்மைச் சூழலையும் அனுமதிக்கும் கட்டளையையும் தக்கவைக்கிறது.
- source_word: וְלֹא תִגְעֲרוּ בָהּ
  choice: அவளைக் கடிந்துகொள்ளாதீர்கள்
  rationale: גער என்பதன் கூர்மையான கண்டிப்பு அல்லது அதட்டல் என்ற வலிமையை, மிகப் பேச்சுவழக்காகாமல் தெளிவாக வெளிப்படுத்துகிறது.
