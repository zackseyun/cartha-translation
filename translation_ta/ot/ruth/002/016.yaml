revisions:
- from: மேலும், அவளுக்காகக் கதிர்க்கட்டுகளிலிருந்து[a] சில கதிர்களை வேண்டுமென்றே உருவி எடுத்து விட்டுவிடுங்கள்; அவள் அவற்றைப் பொறுக்கிக்கொள்ளட்டும்[b]. அவளைக் கடிந்துகொள்ளாதீர்கள்.
  to: மேலும், அவளுக்காகக் கதிர்க்கட்டுகளிலிருந்து[a] சில கதிர்களை வேண்டுமென்றே உருவி எடுத்து, அவற்றை அங்கேயே விட்டுவிடுங்கள்; அவள் அவற்றைப் பொறுக்கட்டும்[b]. அவளைக் கடிந்துகொள்ளாதீர்கள்.
  rationale: The revision retains all source-level meanings while making explicit that the removed grain is left in place. It also uses a concise permissive form for Ruth’s gleaning and corrects the explanatory footnote so that it does not imply the grain was merely accidental residue.
