base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/014.yaml
  text: At mealtime Boaz said to her[a], “Come here and eat some bread, and dip your piece in the sour wine.” So she sat beside the reapers, and he passed her roasted grain. She ate and was satisfied, and she had some left over.
translation:
  language: ta
  text: உணவு வேளையில் போவாஸ் அவளிடம், “இங்கே வா; சிறிது அப்பம் சாப்பிட்டு, உன் அப்பத்துண்டைப் புளித்த திராட்சை மதுவில் தோய்த்துக்கொள்[a]” என்றான். அவள் அறுப்பவர்களின் அருகில் அமர்ந்தாள். அவன் அவளுக்கு வறுத்த தானியத்தை நீட்டிக் கொடுத்தான். அவள் சாப்பிட்டுத் திருப்தியடைந்தாள்; அவளிடம் சிறிது மீதமிருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் அப்பத்துண்டைக் காடியில் (வினிகரில்) தோய்த்துக்கொள்.” எபிரேயச் சொல் חֹמֶץ காடியையோ புளித்த திராட்சை மதுப் பானத்தையோ குறிக்கலாம்; வயல்வெளித் தொழிலாளர்களின் இந்த உணவுச் சூழலில் புளித்த திராட்சை மதுப் பானம் குறிக்கப்பட்டிருக்க வாய்ப்பு அதிகம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעֵת הָאֹכֶל
  choice: உணவு வேளையில்
  rationale: வேலையாட்கள் உணவருந்தும் நேரத்தைக் குறிக்கும் எபிரேய மரபுத்தொடரை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: גֹּשִׁי הֲלֹם
  choice: இங்கே வா
  rationale: பெண்பால் ஒருமை கட்டளையையும் உடலருகே வருமாறு விடுக்கும் நேரடியான அழைப்பையும் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: וְאָכַלְתְּ מִן הַלֶּחֶם
  choice: அப்பத்தில் கொஞ்சம் சாப்பிட்டு
  rationale: מִן என்பதன் பகுதி சார்ந்த பொருளை ‘கொஞ்சம்’ மூலம் இயல்பாக வெளிப்படுத்துகிறது; לֶחֶם இங்கு உணவிலிருந்த அப்பத்தைக் குறிக்கிறது.
- source_word: וְטָבַלְתְּ פִּתֵּךְ בַּחֹמֶץ
  choice: உன் துண்டைப் புளித்த திராட்சை மதுவில் தோய்த்துக்கொள்
  rationale: פַּת என்பதைக் குறிப்பாக ‘அப்பத்துண்டு’ என்று நிரப்பாமல் ‘துண்டு’ என வைத்து, חֹמֶץ என்பதன் இவ்வுணவுச் சூழலில் சாத்தியமான புளித்த திராட்சை மது என்ற பொருளை முதன்மைப்படுத்துகிறது; ‘காடி’ என்ற மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: מִצַּד הַקּוֹצְרִים
  choice: அறுவடை செய்பவர்களின் அருகில்
  rationale: அவர்களுக்குப் பக்கத்தில் அமர்ந்த இடநிலையைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וַיִּצְבָּט לָהּ קָלִי
  choice: அவன் அவளுக்கு வறுத்த தானியத்தை எடுத்துக் கொடுத்தான்
  rationale: அரிதான வினைச்சொல் உணவை அவளிடம் நீட்டிக் கொடுக்கும் செயலைக் குறிக்கிறது; קָלִי வறுத்த அல்லது பொரித்த தானியத்தைக் குறிக்கிறது.
- source_word: וַתִּשְׂבַּע
  choice: திருப்தியடைந்தாள்
  rationale: போதுமான அளவு உண்டு நிறைவடைந்த பொருளை மரியாதையான நவீனத் தமிழில் தருகிறது.
- source_word: וַתֹּתַר
  choice: அவளுக்கு மீதமும் இருந்தது
  rationale: பெண்பால் ஒருமை வினைத் தொடரோடு ஒத்தபடி, அவள் உண்டபின் உணவு மீந்திருந்ததை இயல்பாக வெளிப்படுத்துகிறது.
