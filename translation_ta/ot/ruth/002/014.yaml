  rationale: The revision preserves the source’s lexical ambiguity and narrative flow while replacing several awkward or potentially misleading Tamil expressions. It makes the bread/morsel relationship explicit for natural Tamil, represents the handing action without adding a picking-up implication, and clarifies that food was left over with Ruth.
