- from: உணவு வேளையில் போவாஸ் அவளிடம், “இங்கே வா; அப்பத்தில் கொஞ்சம் சாப்பிட்டு, உன் துண்டைப் புளித்த திராட்சை மதுவில் தோய்த்துக்கொள்[a]” என்றான். அவள் அறுவடை செய்பவர்களின் அருகில் அமர்ந்தாள். அவன் அவளுக்கு வறுத்த தானியத்தை எடுத்துக் கொடுத்தான். அவள் சாப்பிட்டுத் திருப்தியடைந்தாள்; அவளுக்கு மீதமும் இருந்தது.
