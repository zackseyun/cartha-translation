revisions:
- from: அப்போது நகோமி தன் மருமகளான ரூத்திடம், “என் மகளே, நீ அவனுடைய இளம் பெண்களோடு செல்வது நல்லது; அப்போது வேறொரு வயலில் யாரும் உன்னைத் தொந்தரவு செய்யமாட்டார்கள்[a]” என்றாள்.
  to: அப்போது நகோமி தன் மருமகளான ரூத்திடம், “என் மகளே, வேறொரு வயலில் யாரும் உன்னைத் தொந்தரவு செய்யாதபடி, நீ அவனுடைய இளம்பெண்களோடு செல்வது நல்லது” என்றாள்.
  rationale: A small syntactic revision corrects the relation of the final clause to Naomi's advice. No theological interpretation is added, and the existing footnote continues to preserve the lexical ambiguity of פגע.
  reviewer_model: gpt-5.6-terra
