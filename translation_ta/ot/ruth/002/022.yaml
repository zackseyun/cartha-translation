translation_notes:
  register: நவீன பொதுத்தமிழில், கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘மருமகள்’, ‘என் மகளே’, ‘இளம் பெண்கள்’ ஆகியவை உறவையும் அன்பான தொனியையும் இயல்பாகக் காக்கின்றன; பגע வினையின் உண்மையான பொருள் நெகிழ்வு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
