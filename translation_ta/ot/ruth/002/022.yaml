source:
  edition: WLC
  text: וַ/תֹּ֥אמֶר נָעֳמִ֖י אֶל ר֣וּת כַּלָּתָ֑/הּ ט֣וֹב בִּתִּ֗/י כִּ֤י תֵֽצְאִי֙ עִם נַ֣עֲרוֹתָ֔י/ו וְ/לֹ֥א יִפְגְּעוּ בָ֖/ךְ בְּ/שָׂדֶ֥ה אַחֵֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/022.yaml
  text: Then Naomi said to Ruth her daughter-in-law[a], “It is good, my daughter, that you go out with his young women, so that they do not come upon you in another field.”
translation:
  language: ta
  text: அப்போது நகோமி தன் மருமகளான ரூத்திடம், “என் மகளே, வேறொரு வயலில் யாரும் உன்னைத் தொந்தரவு செய்யாதபடி, நீ அவனுடைய இளம்பெண்களோடு செல்வது நல்லது” என்றாள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: அப்போது ... என்றாள்
  rationale: தொடர்ச்சியான நிகழ்வை முன்னெடுக்கும் எபிரெய வினை வடிவத்தை இயல்பான தமிழ் கதைநடையில் வெளிப்படுத்துகிறது.
- source_word: כַּלָּתָהּ
  choice: தன் மருமகளான
  rationale: ரூத்துக்கும் நகோமிக்கும் இடையிலான உறவைத் தெளிவாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: טוֹב
  choice: நல்லது
  rationale: எளிய மதிப்பீட்டை அப்படியே காக்கிறது; ‘மிகச் சிறந்தது’ போன்ற உயர்நிலைக் கருத்தைச் சேர்க்கவில்லை.
- source_word: בִּתִּי
  choice: என் மகளே
  rationale: இங்கு நேரடி தாய்மையைக் காட்டாமல், நெருக்கத்தையும் குடும்ப உறவையும் வெளிப்படுத்தும் அன்பான அழைப்பு.
- source_word: כִּי תֵצְאִי
  choice: நீ ... செல்வது
  rationale: நகோமி நல்லது என்று மதிப்பிடும் செயலின் உள்ளடக்கத்தை இயல்பான தமிழில் தருகிறது; வினையில் இல்லாத ‘கதிர் பொறுக்க’ என்ற தகவலைச் சேர்க்கவில்லை.
- source_word: נַעֲרוֹתָיו
  choice: அவனுடைய இளம் பெண்களோடு
  rationale: போவாசின் பெண் பணியாளர்களைக் குறித்தாலும், அவர்களின் சமூக நிலையை அளவுக்கு அதிகமாகக் குறிப்பாக்காமல் மூலத்தின் பொதுவான சொல்லைத் தக்கவைக்கிறது.
- source_word: וְלֹא יִפְגְּעוּ בָךְ
  choice: அப்போது ... யாரும் உன்னைத் தொந்தரவு செய்யமாட்டார்கள்
  rationale: פגע என்பதன் எதிர்மறையான சூழற்பொருளை வாசிக்க இயல்பாக வெளிப்படுத்துகிறது; அதன் பரந்த பொருள் வரம்பை அடிக்குறிப்பு பதிவு செய்கிறது. எபிரெய பன்மை எழுவாயைத் தமிழ் வழக்கில் இயல்பான வரையறையற்ற ‘யாரும்’ என வழங்குகிறது.
- source_word: בְּשָׂדֶה אַחֵר
  choice: வேறொரு வயலில்
  rationale: இடத்தைக் குறிக்கும் சொற்றொடரை நேரடியாகவும் இயல்பாகவும் மொழிபெயர்க்கிறது.
