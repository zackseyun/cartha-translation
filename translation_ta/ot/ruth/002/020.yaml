  text: וַ/תֹּ֨אמֶר נָעֳמִ֜י לְ/כַלָּתָ֗/הּ בָּר֥וּךְ הוּא֙ לַ/יהוָ֔ה אֲשֶׁר֙ לֹא עָזַ֣ב חַסְדּ֔/וֹ אֶת הַ/חַיִּ֖ים וְ/אֶת הַ/מֵּתִ֑ים וַ/תֹּ֧אמֶר לָ֣/הּ נָעֳמִ֗י קָר֥וֹב לָ֨/נוּ֙ הָ/אִ֔ישׁ מִֽ/גֹּאֲלֵ֖/נוּ הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/020.yaml
  text: Naomi said to her daughter-in-law[a], “Blessed be he by Yahweh, whose kindness has not forsaken the living or the dead.” Then Naomi said to her, “The man is a close relative of ours[b]; he is one of our redeemers.”
translation:
  language: ta
  text: நகோமி தன் மருமகளிடம், “உயிருடன் இருப்பவர்களுக்கும் இறந்தவர்களுக்கும் தமது மாறாத அன்பைக் கைவிடாத யாவேயால் அவர் ஆசீர்வதிக்கப்படுவாராக![a]” என்றாள். மேலும் நகோமி அவளிடம், “அந்த மனிதர் நமக்கு நெருங்கிய உறவினர்; நம் குடும்பத்தின் மீட்புரிமையுள்ள உறவினர்களில் அவரும் ஒருவர்[b]” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உயிருடன் இருப்பவர்களுக்கும் இறந்தவர்களுக்கும் தன் மாறாத அன்பைக் கைவிடாத அவர் யாவேயால் ஆசீர்வதிக்கப்படுவாராக!” இவ்வாசிப்பில் “தன் மாறாத அன்பு” என்பது யாவேயின் அன்பை அல்ல, போவாசின் அன்பைக் குறிக்கிறது.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “நம் குடும்ப மீட்பாளர்-உறவினர்களில் ஒருவர்.” எபிரெயச் சொல், குடும்ப உறுப்பினரையோ குடும்பச் சொத்தையோ மீட்பதற்கான அங்கீகரிக்கப்பட்ட உரிமை அல்லது கடமை கொண்ட நெருங்கிய உறவினரைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ הוּא לַיהוָה
  choice: யெகோவாவால் அவர் ஆசீர்வதிக்கப்படுவாராக
  rationale: வினைச்சொல் இல்லாத எபிரெய ஆசீர்வாத வாய்பாட்டை இயல்பான தமிழ் வாழ்த்தாக அளிக்கிறது; לַיהוָה என்பதில் ஆசீர்வாதத்தின் மூலமாக யெகோவாவைக் காட்டுகிறது.
- source_word: חַסְדּוֹ
  choice: தமது மாறாத அன்பு
  rationale: חֶסֶד என்பதிலுள்ள அன்பு, பற்றுறுதி, இரக்கம் ஆகிய பொருள் நிழல்களைச் சுருக்கமாக வெளிப்படுத்துகிறது. முதன்மை வாசிப்பில் சுட்டுப்பெயர் யெகோவாவைக் குறிப்பதால் மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது.
- source_word: לֹא עָזַב
  choice: கைவிடாத
  rationale: עזב என்பதன் ‘விட்டுவிடுதல், கைவிடுதல்’ என்ற உறவுசார் வலிமையைப் பாதுகாக்கிறது.
- source_word: אֶת הַחַיִּים וְאֶת הַמֵּתִים
  choice: உயிரோடிருக்கிறவர்களுக்கும் இறந்தவர்களுக்கும்
  rationale: எபிரெய இணைப்பைத் தமிழில் இயல்பான ‘-க்கும்...-க்கும்’ அமைப்பால் கூறி இரு குழுக்களையும் உள்ளடக்குகிறது.
- source_word: קָרוֹב לָנוּ
  choice: நமக்கு நெருங்கிய உறவினர்
  rationale: இங்கு קָרוֹב இடநெருக்கத்தை அல்ல, உறவுமுறை நெருக்கத்தைக் குறிக்கிறது.
- source_word: מִגֹּאֲלֵנוּ
  choice: நம்மை மீட்கும் உரிமையுள்ள உறவினர்களில் ஒருவர்
  rationale: גאל என்ற சட்ட-குடும்பச் சொல்லின் உறவுமுறைப் பின்னணியையும் மீட்கும் உரிமை அல்லது கடமையையும் புரியத்தக்க தமிழில் வெளிப்படுத்துகிறது; ‘நம்முடைய மீட்பர்களில் ஒருவர்’ என்பதால் ஏற்படக்கூடிய தெளிவின்மையைத் தவிர்க்கிறது.
theological_decisions:
- issue: 'ஆசீர்வாத வாக்கியத்திலுள்ள சுட்டுப்பெயர்களின் குறிப்பு: ஆசீர்வதிக்கப்படுபவர் போவாசா, ‘அவருடைய மாறாத அன்பு’ யெகோவாவுடையதா அல்லது போவாசுடையதா?'
  choice: நகோமி போவாசுக்காக ஆசீர்வாதம் வேண்டுகிறாள்; மாறாத அன்பு யெகோவாவுடையது.
  alternative: நகோமி போவாசுக்காக ஆசீர்வாதம் வேண்டுகிறாள்; மாறாத அன்பு போவாசுடையது.
  rationale: பேசப்பட்ட மனிதரான போவாசே ‘அவர்’ என்பதன் இயல்பான குறிப்பு; தொடர்பு வாக்கியத்துக்கு அண்மையிலுள்ள யெகோவாவை ‘தமது’ என்பது குறிப்பதாக முதன்மை உரை எடுத்துக்கொள்கிறது. எனினும் எபிரெயத்தில் போவாசைக் குறிக்கும் வாசிப்பும் இலக்கணரீதியாகச் சாத்தியமாதலால் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. தெய்வப் பெயர் יהוה ‘யெகோவா’ என ஒலிபெயர்க்கப்பட்டுள்ளது. சட்ட-உறவுமுறைச் சொல்லான גֹּאֵל வாசகருக்குப் புரியும்படி விளக்கமாக மொழிபெயர்க்கப்பட்டுள்ளது; மூலத்தின் உண்மையான சுட்டுப்பெயர் தெளிவின்மை அடிக்குறிப்பில் நிலைநிறுத்தப்பட்டுள்ளது.
