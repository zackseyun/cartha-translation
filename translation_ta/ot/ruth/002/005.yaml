translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘தன் இளைஞன்’ மூலச்சொல்லின் நேரடியான பொருளைக் காக்கிறது; அவனுடைய மேற்பார்வைப் பங்கு அடுத்த அடைமொழித் தொடரில் தெளிவாக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறியீடு கேள்விக்குப் பின் பிரதான உரையில் சேர்க்கப்பட்டுள்ளது.
