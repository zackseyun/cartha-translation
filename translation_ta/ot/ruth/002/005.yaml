source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר בֹּ֨עַז֙ לְ/נַעֲר֔/וֹ הַ/נִּצָּ֖ב עַל הַ/קּֽוֹצְרִ֑ים לְ/מִ֖י הַ/נַּעֲרָ֥ה הַ/זֹּֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/005.yaml
  text: Then Boaz said to his young man who was set over the reapers[a], “Whose young woman is this?”
translation:
  language: ta
  text: அப்போது போவாஸ், அறுவடை செய்பவர்களுக்குப் பொறுப்பாக நியமிக்கப்பட்டிருந்த தன் இளம் பணியாளனிடம், “இந்த இளம் பெண் யாரைச் சேர்ந்தவள்?[a]” என்று கேட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இந்த இளம் பெண் யாருடையவள்?” எபிரெயக் கேள்வி அவளுடைய குடும்பம் அல்லது வீட்டார் சார்பை விசாரிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... கேட்டார்
  rationale: வாவ் தொடர் வடிவம் கதையை அடுத்த நிகழ்வுக்கு நகர்த்துகிறது. தமிழில் இயல்பான கதைத் தொடர்ச்சிக்காக ‘அப்போது’ என்றும், நேரடியாகத் தொடர்ந்து வரும் கேள்வியின் சூழலில் ‘கேட்டார்’ என்றும் மொழிபெயர்க்கப்பட்டது.
- source_word: בֹּעַז
  choice: போவாஸ்
  rationale: எபிரெய தனிப்பெயரின் ஒலியை நவீனத் தமிழில் இயல்பாக எழுத்துப்பெயர்க்கிறது.
- source_word: לְנַעֲרוֹ
  choice: தன் இளைஞனிடம்
  rationale: נַעַר என்பதன் அடிப்படை இளமை சார்ந்த பொருளைப் பாதுகாக்கிறது; அவனுடைய மேற்பார்வைப் பணி அடுத்த சொற்றொடரில் தனியே தெரிவிக்கப்படுகிறது.
- source_word: הַנִּצָּב עַל הַקּוֹצְרִים
  choice: அறுவடை செய்பவர்களுக்குப் பொறுப்பாக நியமிக்கப்பட்டிருந்த
  rationale: נצב என்ற நிஃபால் வினையெச்சத்தின் நியமிக்கப்பட்ட அல்லது நிறுத்தப்பட்ட நிலை என்ற மறைசெயப்பாட்டு நுணுக்கத்தையும், עַל மூலம் வெளிப்படும் மேற்பார்வைப் பொறுப்பையும் இயல்பான தமிழில் தருகிறது.
- source_word: לְמִי
  choice: யாரைச் சேர்ந்தவள்
  rationale: இந்த எபிரெய வழக்கு உடைமை மட்டுமன்றி குடும்ப அல்லது சமூகச் சார்பையும் விசாரிக்கலாம்; ‘யாரைச் சேர்ந்தவள்’ அந்தத் திறந்த பொருளைத் தக்கவைக்கிறது.
- source_word: הַנַּעֲרָה
  choice: இளம் பெண்
  rationale: נַעֲרָה என்பதன் வயது மற்றும் பாலினக் குறிப்பை இயல்பான நவீனத் தமிழில் தருகிறது; பணிப்பெண் என்ற சமூக நிலையை தேவையின்றி சேர்ப்பதில்லை.
- source_word: הַזֹּאת
  choice: இந்த
  rationale: பெயர்ச்சொல்லைச் சுட்டும் எளிய சுட்டடைமொழிக்கான இயல்பான தமிழ் இணை.
