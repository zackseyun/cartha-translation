  to: அப்போது போவாஸ், அறுவடை செய்பவர்களுக்குப் பொறுப்பாக நியமிக்கப்பட்டிருந்த தன் இளம் பணியாளனிடம், “இந்த இளம் பெண் யாரைச் சேர்ந்தவள்?[a]” என்று கேட்டார்.
  rationale: The revision clarifies that Boaz addresses his attendant, which is required by the contextual sense of נַעַר, while preserving the source’s age-related nuance through ‘இளம்.’ The footnote is adjusted from the broader ‘சமூகச் சார்பு’ to the more source-focused household/family affiliation sense, without excluding the main text’s open wording.
