base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/019.yaml
  text: And her mother-in-law said to her[a], “Where did you glean today, and where have you worked? Blessed be the one who took notice of you.” So she told her mother-in-law with whom she had worked, and she said, “The name of the man with whom I worked today is Boaz.”
translation:
  language: ta
  text: அவளுடைய மாமியார் அவளிடம், “இன்று நீ எங்கே கதிர் பொறுக்கினாய்? எங்கே வேலை செய்தாய்? உன்னைக் கவனித்தவர் ஆசீர்வதிக்கப்படுவாராக!” என்றாள். அப்போது அவள், தான் யாருடன் வேலை செய்தாள் என்பதைத் தன் மாமியாரிடம் சொல்லி, “இன்று நான் யாருடன் வேலை செய்தேனோ, அந்த மனிதரின் பெயர் போவாஸ்” என்றாள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்சொல்லாக, “அவள் அவருடன் செய்ததை” என்றும், “இன்று நான் அவருடன் [வேலை] செய்த அந்த மனிதர்” என்றும் உள்ளது. இங்கு வயல்வெளி உழைப்பின் சூழலை வெளிப்படுத்துவதற்காக “வேலை செய்தாள்/செய்தேன்” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: עשה עם என்ற எபிரெயச் சொற்றொடரின் சொற்சார்ந்த வடிவத்தையும், சூழலுக்கேற்ற ‘வேலை செய்தல்’ என்ற மொழிபெயர்ப்பையும் பதிவு செய்ய.
lexical_decisions:
- source_word: חֲמוֹתָהּ
  choice: அவளுடைய மாமியார்
  rationale: நவீனத் தமிழில் இந்த உறவுமுறையை இயல்பாகவும் தெளிவாகவும் குறிக்கும் சொல்.
- source_word: לִקַּטְתְּ
  choice: கதிர் பொறுக்கினாய்
  rationale: அறுவடைக்குப் பின் எஞ்சிய கதிர்களைச் சேகரிக்கும் குறிப்பிட்ட வயல்வெளிச் செயலைத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: עָשִׂית
  choice: வேலை செய்தாய்
  rationale: עשה என்பதன் அடிப்படைப் பொருள் ‘செய்’ என்றாலும், இச்சூழலில் வயல்வெளி உழைப்பைக் குறிக்கும் இயல்பான தமிழாக்கம் இதுவாகும்.
- source_word: יְהִי מַכִּירֵךְ בָּרוּךְ
  choice: உன்னைக் கவனித்தவர் ஆசீர்வதிக்கப்படுவாராக
  rationale: מכיר என்பதில் உள்ள அறிந்துகொள்ளுதல் அல்லது கவனம் செலுத்துதல் என்ற நுணுக்கத்தை, ரூத்துக்கு நன்மையுடன் கவனம் கொடுத்தவர் என்ற சூழலில் வெளிப்படுத்துகிறது.
- source_word: אֵת אֲשֶׁר עָשְׂתָה עִמּוֹ
  choice: தான் யாருடன் வேலை செய்தாள் என்பதை
  rationale: எபிரெயத்தின் சொற்பொருள் ‘அவள் அவருடன் செய்ததை’ என்பதாக இருந்தாலும், வயல்வெளி உழைப்புச் சூழலில் பொருளைத் தெளிவாகக் கூறும் இயல்பான தமிழாக்கம்; சொற்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: אֲשֶׁר עָשִׂיתִי עִמּוֹ
  choice: நான் வேலை செய்த மனிதர்
  rationale: ‘நான் அவருடன் செய்த மனிதர்’ என்ற சொற்சார்ந்த வடிவம் தமிழில் இயல்பற்றதால், சூழலுக்கேற்ற வேலை செய்த தொடர்பைத் தெளிவாகக் கூறுகிறது.
- source_word: בֹּעַז
  choice: போவாஸ்
  rationale: எபிரெய தனிப்பெயரின் தமிழில் வழக்கமான ஒலிபெயர்ப்பு.
