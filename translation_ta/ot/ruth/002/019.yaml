  to: அவளுடைய மாமியார் அவளிடம், “இன்று நீ எங்கே கதிர் பொறுக்கினாய்? எங்கே வேலை செய்தாய்? உன்னைக் கவனித்தவர் ஆசீர்வதிக்கப்படுவாராக!” என்றாள். அப்போது அவள், தான் யாருடன் வேலை செய்தாள் என்பதைத் தன் மாமியாரிடம் சொல்லி, “இன்று நான் யாருடன் வேலை செய்தேனோ, அந்த மனிதரின் பெயர் போவாஸ்” என்றாள்.[a]
  rationale: A small syntactic revision makes Ruth's statement unambiguously mean that Boaz was the man with whom she worked. The footnote is repaired so that it is intelligible Tamil and accurately signals the Hebrew's broader ‘did with him’ expression and the contextually supplied sense of work.
