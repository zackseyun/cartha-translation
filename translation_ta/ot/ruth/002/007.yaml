translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதையான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘அரிக்கட்டு’ போன்ற சூழலுக்குரிய வேளாண் சொல் பயன்படுத்தப்பட்டாலும், வாக்கிய அமைப்பு எளிமையாக வைக்கப்பட்டுள்ளது. கடினமான இறுதிக் கூறின் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
