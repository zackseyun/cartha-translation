base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/007.yaml
  text: She said[a], ‘Please let me glean and gather among the sheaves after the reapers.’ So she came and has remained from morning until now; she has sat in the house only a little.
translation:
  language: ta
  text: அவள், “தயவுசெய்து, அறுவடை செய்பவர்களுக்குப் பின்னால் கதிர்க்கட்டுகளுக்கு நடுவே கதிர்களைப் பொறுக்கிச் சேகரிக்க என்னை அனுமதியுங்கள்” என்றாள். அவள் வந்து, காலையிலிருந்து இப்போதுவரை இருந்தாள்; வீட்டில் சிறிது நேரமே அமர்ந்திருந்தாள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தங்கும் குடிலில் சிறிது நேரமே ஓய்வெடுத்தாள்.” இறுதிச் சொற்றொடரின் எபிரெய வாசகம் புரிந்துகொள்ளக் கடினமானது; இங்கே “வீடு” என்பது வயல்வெளிப் பணியாளர்களுக்கான தங்கும் குடிலைக் குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: אֲלַקֳטָה נָּא
  choice: தயவுசெய்து ... கதிர்களைப் பொறுக்கிக்கொள்ள என்னை அனுமதியுங்கள்
  rationale: வேண்டுகோளை வெளிப்படுத்தும் cohortative வடிவத்தையும் மரியாதையைக் குறிக்கும் נָּא என்பதையும் இயல்பான நவீனத் தமிழில் தருகிறது; לקט என்பதன் அறுவடைக்குப் பிந்தைய பொறுக்குதலைத் தெளிவாக்க ‘கதிர்களைப் பொறுக்குதல்’ பயன்படுத்தப்படுகிறது.
- source_word: וְאָסַפְתִּי
  choice: சேகரித்துக்கொள்ள
  rationale: לקט என்பதிலிருந்து வேறுபாட்டைத் தக்கவைத்து, பொறுக்கியவற்றை ஒன்றுசேர்ப்பதைக் குறிக்கிறது.
- source_word: בָעֳמָרִים
  choice: அரிக்கட்டுகளுக்கு இடையே
  rationale: עֳמָרִים என்பது கட்டப்பட்ட தானியத்தாள் கட்டுகளைக் குறிக்கிறது; ‘அரிக்கட்டுகள்’ வேளாண் சூழலுக்குப் பொருத்தமான தமிழ்ச் சொல்.
- source_word: אַחֲרֵי הַקּוֹצְרִים
  choice: அறுவடை செய்கிறவர்களுக்குப் பின்னால்
  rationale: பணியாளர்களின் பின்னால் தொடர்ந்து பொறுக்கும் இடஞ்சார்ந்த பொருளை நேரடியாகக் காக்கிறது.
- source_word: וַתָּבֹא וַתַּעֲמוֹד
  choice: அவள் வந்து ... இங்கேயே இருந்துவருகிறாள்
  rationale: சொல்லளவில் ‘வந்து நின்றாள்’ என்றாலும், அடுத்து வரும் கால அளவோடு சேர்ந்து தொடர்ந்திருப்பதைக் குறிக்கும் சூழல்சார் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מֵאָז הַבֹּקֶר וְעַד עַתָּה
  choice: காலையிலிருந்து இப்போதுவரை
  rationale: காலையின் தொடக்கத்திலிருந்து பேசும் தருணம் வரையிலான தொடர்ச்சியான கால அளவைத் தெளிவாகத் தருகிறது.
- source_word: זֶה שִׁבְתָּהּ הַבַּיִת מְעָט
  choice: வீட்டில் சிறிது நேரமே அமர்ந்திருந்தாள்
  rationale: கடினமான எபிரெயச் சொற்றொடரின் சுருக்கத்தையும், அங்கு அவள் கழித்த நேரம் மிகக் குறைவு என்ற சாத்தியமான பொருளையும் காக்கிறது; הַבַּיִת என்பதற்கு முதன்மையாக ‘வீடு’ தரப்பட்டு மாற்றுப் புரிதல் அடிக்குறிப்பில் வைக்கப்படுகிறது.
