translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘போவாஸ்’, ‘மாமியார்’, ‘தகப்பன்’ ஆகியவை வேதாகமச் சூழலுக்கு ஏற்றவையாகவும் பொதுவாசகர்களுக்குப் புரியக்கூடியவையாகவும் உள்ளன. மூலத்தின் வலியுறுத்தல், பெற்றோர் குறித்த தனித்தனி குறிப்பு, பிறந்த நாடு மற்றும் அறிமுகமில்லாத மக்கள் என்ற கூறுகள் பேணப்பட்டுள்ளன.
