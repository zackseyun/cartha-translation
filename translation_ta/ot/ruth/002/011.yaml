base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/011.yaml
  text: Then Boaz answered and said to her[a], “I have been fully told all that you have done for your mother-in-law after the death of your husband, and how you left your father and your mother and the land of your birth, and went to a people whom you did not know before.”
translation:
  language: ta
  text: 'போவாஸ் அவளுக்குப் பதிலளித்துக் கூறினான்: “உன் கணவன் இறந்த பிறகு நீ உன் மாமியாருக்காகச் செய்த எல்லாவற்றையும், உன் தகப்பனையும் தாயையும் நீ பிறந்த நாட்டையும் விட்டுவிட்டு, முன்பு உனக்குத் தெரியாத மக்களிடம் நீ சென்றதையும் பற்றி எனக்கு நன்கு தெரிவிக்கப்பட்டுள்ளது[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், “நேற்றோ முந்தாநாளோ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֻגֵּד הֻגַּד לִי
  choice: எனக்கு முழுமையாகச் சொல்லப்பட்டிருக்கிறது
  rationale: முற்றுப்பெறா வினையெச்சத்துடன் வரும் ஹோஃபால் வினைச்சொல் தரும் வலியுறுத்தலையும், செய்தி போவாசை வந்தடைந்தது என்ற செயப்பாட்டு வடிவத்தையும் இயல்பான தமிழில் காக்கிறது.
- source_word: כֹּל אֲשֶׁר עָשִׂית אֶת חֲמוֹתֵךְ
  choice: நீ உன் மாமியாருக்குச் செய்த அனைத்தையும்
  rationale: כֹּל என்பதன் முழுமையையும் காக்கிறது; אֶת குறிக்கும் தொடர்பை இச்சூழலில் இயல்பான பயனாளிப் பொருளில் ‘மாமியாருக்கு’ என வழங்குகிறது.
- source_word: אַחֲרֵי מוֹת אִישֵׁךְ
  choice: உன் கணவன் இறந்தபின்
  rationale: எபிரெயச் சொற்றொடரின் காலத் தொடர்பையும் நிகழ்வின் கண்ணியமான தொனியையும் தெளிவான நவீன தமிழில் தருகிறது.
- source_word: וַתַּעַזְבִי אָבִיךְ וְאִמֵּךְ
  choice: உன் தகப்பனையும் தாயையும் விட்டுவிட்டு
  rationale: இரு பெற்றோரையும் தனித்தனியாகக் குறிப்பிடும் மூலத்தின் வடிவத்தைப் பேணுகிறது; עזב என்பதற்கு இங்கு சார்பற்ற ‘விட்டுவிட்டு’ இயல்பானது.
- source_word: וְאֶרֶץ מוֹלַדְתֵּךְ
  choice: நீ பிறந்த நாட்டையும்
  rationale: מוֹלֶדֶת குறிக்கும் பிறந்த அல்லது சொந்த நாட்டைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: וַתֵּלְכִי אֶל עַם
  choice: மக்களிடம் நீ வந்ததை
  rationale: הלך அடிப்படையில் ‘சென்றாய்’ என்றாலும், போவாஸ் பேசும் இடத்தையும் தமிழின் இயல்பான நோக்குநிலையையும் கருத்தில் கொண்டு ‘வந்ததை’ என வழங்கப்படுகிறது; இலக்கு ஒரு மக்கள் சமூகமாகவே காக்கப்படுகிறது.
- source_word: אֲשֶׁר לֹא יָדַעַתְּ
  choice: உனக்குத் தெரியாத
  rationale: ידע இங்கு முன்பிருந்த தனிப்பட்ட அறிமுகமின்மையைக் குறிக்கிறது; தமிழில் ‘உனக்குத் தெரியாத மக்கள்’ என்பது இயல்பானதும் தெளிவானதும்.
- source_word: תְּמוֹל שִׁלְשׁוֹם
  choice: இதற்குமுன்
  rationale: ‘நேற்றும் முந்தாநாளும்’ என்ற சொற்றொடர் வழக்காக முந்தைய காலத்தில் அறியாமையைக் குறிக்கிறது; முதன்மை உரையில் அதன் பொருளை இயல்பாகத் தருகிறது, நேரடிப் பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
