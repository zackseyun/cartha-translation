translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் அதேவேளையில் கதையாடலுக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘இளைஞன்’ என்ற சொல் மூலத்தின் வயதுக் குறிப்பைக் காக்கிறது; அவனுடைய பணி தனியாக விளக்கப்பட்டுள்ளது. அடிக்குறி குறியீடு உரையில் சம்பந்தப்பட்ட சொற்றொடருக்குப் பின் இடப்பட்டுள்ளது.
