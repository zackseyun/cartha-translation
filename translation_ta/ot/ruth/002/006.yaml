base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/006.yaml
  text: Then the young man who was set over the reapers answered and said[a], “She is a young Moabite woman who returned with Naomi from the fields of Moab.”
translation:
  language: ta
  text: 'அப்போது அறுவடை செய்பவர்களை மேற்பார்வையிட நியமிக்கப்பட்டிருந்த இளைஞன் பதிலளித்துச் சொன்னான்: “இவள் மோவாப் நாட்டைச் சேர்ந்த இளம்பெண்; நகோமியுடன் மோவாபின் வயல்களிலிருந்து[a] திரும்பி வந்தவள்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மோவாபின் வயலிலிருந்து”; எபிரெய மொழியில் உள்ள ஒருமைச் சொல் மோவாபின் விவசாய நிலப்பரப்பை ஒட்டுமொத்தமாகவும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמַר
  choice: மறுமொழியாக ... என்றான்
  rationale: எபிரெயக் கதையாடலின் ‘பதிலளித்து சொன்னான்’ என்ற இரட்டை அமைப்பை இயல்பான நவீனத் தமிழில் சுருக்கமாகக் காக்கிறது; அவன் முன்வைக்கப்பட்ட கேள்விக்குப் பதிலளிப்பதும் தெளிவாகிறது.
- source_word: הַנַּעַר
  choice: இளைஞன்
  rationale: நַעַר என்பதன் அடிப்படைப் பொருளான இளம் ஆணை நேரடியாகத் தருகிறது; ‘வேலைக்காரன்’ அல்லது ‘மேற்பார்வையாளர்’ என்பதைப் பெயர்ச்சொல்லுக்குள் தேவையின்றி சேர்க்கவில்லை.
- source_word: הַנִּצָּב עַל הַקּוֹצְרִים
  choice: அறுவடை செய்பவர்களுக்குப் பொறுப்பாக நியமிக்கப்பட்டிருந்த
  rationale: נצב மற்றும் עַל இணைந்து இங்கு குறிக்கும் நியமிக்கப்பட்ட மேற்பார்வைப் பொறுப்பைத் தெளிவாகத் தருகிறது; வெறுமனே ‘அவர்கள்மேல் நின்றிருந்த’ என்ற இயல்பற்ற சொல்லாட்சியைத் தவிர்க்கிறது.
- source_word: הַקּוֹצְרִים
  choice: அறுவடை செய்பவர்கள்
  rationale: தானியத்தை அறுப்பவர்களைக் குறிக்கும் பங்கேற்புப் பெயர்ச்சொல்லை பொதுவாகப் புரியும் நவீனத் தமிழில் தருகிறது.
- source_word: נַעֲרָה מוֹאֲבִיָּה
  choice: மோவாப் நாட்டைச் சேர்ந்த இளம்பெண்
  rationale: நַעֲרָה என்பதன் வயது மற்றும் பாலினக் குறிப்பையும் מוֹאֲבִיָּה என்பதன் இன/நாட்டு அடையாளத்தையும் இயல்பான தமிழில் காக்கிறது.
- source_word: הַשָּׁבָה עִם נָעֳמִי
  choice: நகோமியுடன் ... திரும்பி வந்தவள்
  rationale: שוב என்பதன் ‘திரும்புதல்’ என்ற கதைக்கரு சார்ந்த பொருளையும் עִם என்பதன் உடன்செல்லுதலையும் நேரடியாகக் காக்கிறது.
- source_word: מִשְּׂדֵה מוֹאָב
  choice: மோவாபின் வயல்வெளியிலிருந்து
  rationale: שְׂדֵה என்ற ஒருமை வடிவம் இங்கு மோவாபின் விவசாய நிலப்பரப்பைக் கூட்டாகக் குறிக்கக்கூடும்; ‘வயல்வெளி’ அந்தப் பரப்புணர்வை இயல்பாகத் தருகிறது.
