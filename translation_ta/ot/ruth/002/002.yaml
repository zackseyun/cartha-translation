  register: நவீனத் தரத் தமிழில், எளிமையும் கண்ணியமும் கொண்ட கதைநடை பயன்படுத்தப்பட்டுள்ளது. ரூத் நகோமியிடம் பேசுவதால் மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது; நகோமியின் பதிலில் அன்பான ஒருமை இயல்பாகக் காக்கப்பட்டுள்ளது.
