base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/002.yaml
  text: And Ruth the Moabite said to Naomi[a], “Please let me go to the field and glean among the ears of grain after him in whose eyes I find favor.” And she said to her, “Go[b], my daughter.”
translation:
  language: ta
  text: மோவாபியப் பெண்ணான ரூத் நகோமியிடம், “தயவுசெய்து, நான் வயலுக்குப் போய், யாருடைய பார்வையில் எனக்குத் தயவு கிடைக்குமோ அவருக்குப் பின்னால் கதிர்களைப் பொறுக்க என்னை அனுமதியுங்கள்[a]” என்றாள். அதற்கு நகோமி, “போ, என் மகளே” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “யாருடைய பார்வையில் எனக்குத் தயவு கிடைக்குமோ” என்பது, ஒருவருடைய சாதகமான பார்வையையோ நல்லெண்ணத்தையோ பெறுதலைக் குறிக்கும் எபிரெயச் சொல்லாட்சி.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמּוֹאֲבִיָּה
  choice: மோவாபியப் பெண்ணான
  rationale: ரூத்தின் இனத்தையும் அந்நியப் பின்னணியையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது; இழிவான தொனி எதையும் சேர்ப்பதில்லை.
- source_word: אֵלְכָה נָּא
  choice: தயவுசெய்து, நான் வயலுக்குப் போய் … அனுமதியுங்கள்
  rationale: விருப்பத்தைத் தெரிவிக்கும் cohortative வடிவத்தையும் נָא காட்டும் பணிவான வேண்டுகோளையும் தமிழில் மரியாதையுடன் எடுத்துரைக்கிறது.
- source_word: הַשָּׂדֶה
  choice: வயலுக்கு
  rationale: அறுவடையும் பொறுக்குதலும் நடைபெறும் விளைநிலத்தைச் சூழலுக்கு ஏற்ற எளிய தமிழில் குறிக்கிறது.
- source_word: וַאֲלַקֳטָּה
  choice: பொறுக்கிக்கொள்ள
  rationale: அறுவடைக்குப் பின் எஞ்சிய தானியக் கதிர்களைச் சேகரிக்கும் குறிப்பிட்ட செயலை ‘பொறுக்குதல்’ துல்லியமாகக் குறிக்கிறது.
- source_word: בַשִּׁבֳּלִים
  choice: கதிர்களை
  rationale: שִׁבֳּלִים என்பது கட்டப்பட்ட அரிக்கட்டுகளையல்ல, தானியக் கதிர்களைக் குறிக்கிறது; வினையுடன் இயல்பாக அமைய தமிழில் நேரடி பொருளாக வழங்கப்பட்டுள்ளது.
- source_word: אַחַר אֲשֶׁר אֶמְצָא חֵן בְּעֵינָיו
  choice: யாருடைய பார்வையில் எனக்குத் தயவு கிடைக்குமோ அவருக்குப் பின்னால்
  rationale: எபிரெயச் சொல்லாட்சியில் உள்ள ‘பார்வையில் தயவு கிடைத்தல்’ என்ற உருவகத்தையும், மூன்றாம் ஆண்பால் ஒருமை பின்னொட்டு சுட்டும் வரையறுக்கப்படாத நபரையும் பாதுகாக்கிறது.
- source_word: לְכִי בִתִּי
  choice: போ, என் மகளே
  rationale: எளிய கட்டளையையும் நகோமியின் அன்பான குடும்ப உறவுச் சொல்லையும் இயல்பான தமிழில் காக்கிறது.
