source:
  edition: WLC
  text: וּֽ/לְ/נָעֳמִ֞י מידע לְ/אִישָׁ֗/הּ אִ֚ישׁ גִּבּ֣וֹר חַ֔יִל מִ/מִּשְׁפַּ֖חַת אֱלִימֶ֑לֶךְ וּ/שְׁמ֖/וֹ בֹּֽעַז׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/001.yaml
  text: Naomi had a relative of her husband[a], a man of great worth, from the clan of Elimelech[b], and his name was Boaz.
translation:
  language: ta
  text: நகோமியின் கணவனுக்கு உறவினரான ஒருவர்[a] இருந்தார். அவர் எலிமெலேக்கின் குலத்தைச் சேர்ந்தவர்[b]; மிகுந்த ஆற்றலும் செல்வாக்கும் உடையவர்[c]. அவருடைய பெயர் போவாஸ்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கணவனுக்கு அறிமுகமான ஒருவர்.” எபிரெயச் சொல் தெரிந்தவர், தொடர்புடையவர் அல்லது உறவினர் என்பதைக் குறிக்கலாம்; அடுத்துள்ள குலக் குறிப்பு குடும்பத் தொடர்பை ஆதரிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “எலிமெலேக்கின் குடும்பத்தைச் சேர்ந்தவர்.” இங்குள்ள எபிரெயச் சொல் விரிந்த உறவினர் குழுவையோ குலத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “மிகுந்த வலிமையும் வளமும் உடையவர்,” “மதிப்புமிக்கவர்,” அல்லது “செல்வந்தரும் செல்வாக்குள்ளவரும்.” எபிரெயச் சொற்றொடர் ஆற்றல், திறமை, அந்தஸ்து, செல்வவளம் ஆகிய கருத்துகளை ஒருங்கே கொண்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: מידע
  choice: உறவினரான ஒருவர்
  rationale: இச்சொல் நகோமியின் கணவனுக்குத் தெரிந்த அல்லது அவரோடு தொடர்புடைய ஒருவரைக் குறிக்கலாம். அடுத்து அவர் எலிமெலேக்கின் குலத்தைச் சேர்ந்தவர் என்று கூறப்படுவதால், இங்கு குடும்பத் தொடர்பைக் காட்டும் ‘உறவினர்’ என்பது சூழலுக்கு மிகவும் பொருத்தமானது; எனினும் உறவின் துல்லியமான வகை குறிப்பிடப்படவில்லை.
- source_word: לְאִישָׁהּ
  choice: நகோமியின் கணவனுக்கு
  rationale: உறவுத் தொடர்பு நேரடியாக நகோமியுடன் அல்ல, அவளுடைய கணவனுடன் இணைக்கப்படுவதை இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: אִישׁ גִּבּוֹר חַיִל
  choice: மிகுந்த ஆற்றலும் செல்வாக்கும் உடையவர்
  rationale: இந்த எபிரெயச் சொற்றொடர் ஆற்றல், திறமை, சமூக மதிப்பு, செல்வாக்கு, செல்வவளம் ஆகிய கருத்துகளை உள்ளடக்கக்கூடும். ரூத்தின் இராணுவமற்ற சூழலில் போர்வீரர் என்ற பொருளைத் திணிக்காமல் அதன் விரிந்த பாராட்டுப் பொருளை இத்தேர்வு காக்கிறது.
- source_word: מִמִּשְׁפַּחַת
  choice: குலத்தைச் சேர்ந்தவர்
  rationale: இச்சொல் உடனடிக் குடும்பத்தை மட்டும் அல்லாமல் விரிந்த உறவினர் குழுவையும் குறிக்கலாம்; எனவே ‘குலம்’ இக்கதையின் உறவுமுறைச் சூழலுக்கு ஏற்றது.
- source_word: וּשְׁמוֹ
  choice: அவருடைய பெயர்
  rationale: ஒரு புதிய கதாபாத்திரத்தின் பெயரை அறிமுகப்படுத்தும் எபிரெயக் கதைநடையை இயல்பான தமிழில் தருகிறது.
- source_word: בֹּעַז
  choice: போவாஸ்
  rationale: எபிரெயத் தனிப்பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: וּלְנָעֳמִי
  choice: நகோமியின்
  rationale: வாக்கியத் தொடக்க இணைப்பைத் தனியான காலச்சுட்டுச் சொல்லாக மிகைப்படுத்தாமல், தமிழின் இயல்பான வாக்கிய அமைப்பில் நகோமியைத் தலைப்பாக அறிமுகப்படுத்துகிறது.
