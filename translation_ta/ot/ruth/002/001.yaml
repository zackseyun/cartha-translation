translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதாகப் புரியும், மரியாதையான கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயத்தில் தனியான ‘இப்போது’ என்ற காலச்சுட்டு இல்லாததால் அத்தகைய தொடக்கச் சொல் சேர்க்கப்படவில்லை. போவாஸைக் குறிப்பிடும்போது மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது; அது மூலத்தில் இல்லாத பதவி அல்லது சமயப் பொருளைச் சேர்ப்பதில்லை.
