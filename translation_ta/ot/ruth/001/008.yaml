source:
  edition: WLC
  text: וַ/תֹּ֤אמֶר נָעֳמִי֙ לִ/שְׁתֵּ֣י כַלֹּתֶ֔י/הָ לֵ֣כְנָה שֹּׁ֔בְנָה אִשָּׁ֖ה לְ/בֵ֣ית אִמָּ֑/הּ יעשה יְהוָ֤ה עִמָּ/כֶם֙ חֶ֔סֶד כַּ/אֲשֶׁ֧ר עֲשִׂיתֶ֛ם עִם הַ/מֵּתִ֖ים וְ/עִמָּדִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/008.yaml
  text: And Naomi said to her two daughters-in-law[a], “Go, return, each to her mother’s house. May Yahweh show you kindness, as you have shown it to the dead and to me.”
translation:
  language: ta
  text: நகோமி தன் இரண்டு மருமகள்களிடமும், “போங்கள்; ஒவ்வொருத்தியும் தன் தாயின் வீட்டுக்குத் திரும்புங்கள். நீங்கள் இறந்தவர்களிடமும் என்னிடமும் தயவு காட்டியதுபோல, யாவே உங்களுக்குத் தயவு[a] காட்டுவாராக” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தயவு” என்பதற்கான எபிரெயச் சொல் கெசெத்; இதை “மாறாத அன்பு,” “உறுதியான அன்பு,” அல்லது “உடன்படிக்கைப் பற்றுறுதி” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַלֹּתֶיהָ
  choice: தன் இரண்டு மருமகள்கள்
  rationale: இந்தச் சூழலில் כַּלָּה என்பது மகனின் மனைவியைக் குறிக்கிறது; ‘மருமகள்’ இயல்பான, துல்லியமான தமிழ் சொல்.
- source_word: לֵכְנָה שֹּׁבְנָה
  choice: போய் ... திரும்புங்கள்
  rationale: இரு கட்டளைகளையும் தமிழில் இயல்பாக இணைத்தபடியே, நகோமியின் வலியுறுத்தலைப் பாதுகாக்கிறது.
- source_word: אִשָּׁה לְבֵית אִמָּהּ
  choice: அவரவர் தாயின் வீட்டுக்கு
  rationale: אִשָּׁה இங்கு பகிர்நிலையாக ‘ஒவ்வொருத்தியும்’ என்று பொருள்படுகிறது. ‘அவரவர்’ அதை இயல்பான தமிழில் தெரிவிக்கிறது; ‘தாயின் வீடு’ என்ற எபிரெயக் குறிப்பும் காக்கப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருப்பெயரான יהוה-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: חֶסֶד
  choice: பேரன்பு
  rationale: חֶסֶד-இல் அன்பு, நன்மை, உறுதியான பற்றுறுதி ஆகிய நுணுக்கங்கள் உள்ளன. இந்த ஆசிவாக்கியச் சூழலில் ‘பேரன்பு’ இயல்பாகவும் விரிவான பொருளைச் சுமப்பதாகவும் உள்ளது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: עֲשִׂיתֶם עִם הַמֵּתִים וְעִמָּדִי
  choice: இறந்துபோனவர்களிடமும் என்னிடமும் நீங்கள் பேரன்பு காட்டியதுபோல
  rationale: עשה עם חסד என்ற சொற்றொடரை ‘பேரன்பு காட்டுதல்’ என்று இயல்பாக மொழிபெயர்த்து, முன் வரும் חֶסֶד உடனான தொடர்பைப் பாதுகாக்கிறது. ‘இறந்துபோனவர்கள்’ என்ற பன்மையையும் அப்படியே வைக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர் / யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட திருப்பெயர் நேரடியாக வருகிறது. ஆகவே பட்டப்பெயரான ‘ஆண்டவர்’ என்பதற்குப் பதிலாக ஒலிபெயர்ப்பு பயன்படுத்தப்படுகிறது; ‘யாவே’ என்பது நவீன தமிழில் தெளிவான வடிவம்.
- issue: חֶסֶד என்பதன் பொருள் வரம்பு
  choice: பேரன்பு
  alternative: இரக்கம் / மாறாத அன்பு / பற்றுறுதியுள்ள அன்பு
  rationale: ஒரே குறுகிய கோட்பாட்டுப் பொருளுக்குள் சொல்லை அடைக்காமல், இந்த உறவுசார் சூழலில் அன்பான நன்மையையும் பற்றுறுதியையும் சுட்டும் சொல்லைத் தேர்ந்தெடுத்து, அதன் உண்மையான பொருள் விரிவை அடிக்குறிப்பில் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமும் எளிய வாசிப்பும் இணையும் நடை. ‘அவரவர்’ பகிர்நிலைப் பொருளை இயல்பாகத் தருகிறது. ஆசிவாக்கியத்தை ‘காட்டுவாராக’ என அமைத்து மூலத்தின் வேண்டுதல் நயத்தைப் பாதுகாத்துள்ளது.
