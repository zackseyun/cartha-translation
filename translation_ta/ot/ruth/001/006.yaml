base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/006.yaml
  text: Then she arose with her daughters-in-law and returned from the fields of Moab[a], because in the field of Moab she had heard that Yahweh had visited his people to give them food.
translation:
  language: ta
  text: அப்போது அவள் தன் மருமகள்களுடன் எழுந்து, மோவாபின் வயல்வெளிகளிலிருந்து திரும்பினாள். ஏனெனில், மோவாபின் நாட்டுப்புறத்தில் இருந்தபோது, யாவே தம் மக்களுக்கு உணவு[a] அளிக்க அவர்களைக் கவனித்தார் என்று அவள் கேள்விப்பட்டிருந்தாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேர்ச்சொல்லாக, “அப்பம்.” எபிரெயச் சொல் இங்கு பொதுவாக உணவு அல்லது உணவுப் பொருட்களையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּקָם
  choice: அப்போது அவள் … எழுந்து
  rationale: קום என்பதன் தொடர் நிகழ்வைக் குறிக்கும் வினைவடிவை ‘அப்போது’ என்பதும், செயலை ‘எழுந்து’ என்பதும் இயல்பான தமிழ் கதைநடையில் வெளிப்படுத்துகின்றன.
- source_word: וְכַלֹּתֶיהָ
  choice: தன் மருமகள்களுடன்
  rationale: எபிரெய இணைப்பை உடன்செல்லும் பொருளில் தமிழில் இயல்பாக மொழிபெயர்க்கிறது; சூழலில் இவர்கள் அவளுடைய மகன்களின் மனைவிகள் என்பது தெளிவு.
- source_word: וַתָּשָׁב
  choice: திரும்பிச் செல்லப் புறப்பட்டாள்
  rationale: שׁוב என்பதன் ‘திரும்புதல்’ என்ற பொருளைக் காத்து, அடுத்த வசனத்தில் பயணம் தொடர்வதால் இங்கு திரும்பும் பயணத்தைத் தொடங்கினாள் என்ற நிகழ்வுநிலையைத் தெளிவாக்குகிறது.
- source_word: מִשְּׂדֵי מוֹאָב
  choice: மோவாபின் வயல்வெளிகளிலிருந்து
  rationale: שׂדה என்பதன் தெளிவான வயல்வெளி உருவகத்தைப் பாதுகாக்கிறது; பன்மை வடிவமும் தமிழில் இயல்பாக வெளிப்படுகிறது.
- source_word: שָׁמְעָה
  choice: கேள்விப்பட்டிருந்தாள்
  rationale: அவள் புறப்படுவதற்கு முன்பே கிடைத்த செய்தி காரணமாக அமைவதைத் தமிழின் முற்றிய இறந்தகால வடிவம் தெளிவாகக் காட்டுகிறது.
- source_word: בִּשְׂדֵה מוֹאָב
  choice: மோவாபில் இருந்தபோது
  rationale: இங்குள்ள שׂדה ஒரு பிரதேசத்தைக் குறிக்கும் கூட்டுப்பொருளில் வருகிறது; ‘மோவாபின் வயலில்’ என்பது தமிழில் தவறான தனிவயல் எண்ணத்தைத் தரக்கூடும் என்பதால் சூழற்பொருள் இயல்பாக வழங்கப்படுகிறது.
- source_word: פָּקַד
  choice: கவனித்து
  rationale: இந்தச் சூழலில் פקד என்பது யாவே தம் மக்களின் தேவையைக் கண்டு அவர்களுக்கு ஆதரவாகச் செயல்பட்டதைச் சுட்டுகிறது. ‘கவனித்து’ என்பது செயற்கையான ‘சந்தித்தார்’ என்பதைவிட இயல்பாகவும், உதவியின் முறையை மிகையாக வரையறுக்காமலும் உள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய உரையிலுள்ள இறைப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் அதன் பரவலான ஒலிபெயர்ப்பு வடிவில் வழங்குகிறது.
- source_word: עַמּוֹ
  choice: தம் மக்கள்
  rationale: உடமைப் பொருளையும் உடன்படிக்கை சார்ந்த உறவையும் வெளிப்படுத்துகிறது; யாவேக்கு மரியாதைப் பன்மையான ‘தம்’ பயன்படுத்தப்படுகிறது.
- source_word: לָתֵת לָהֶם לָחֶם
  choice: அவர்களுக்கு உணவு கொடுத்தார்
  rationale: לֶחֶם என்பதன் அடிப்படைப் பொருள் ‘அப்பம்’ என்றாலும், பஞ்சம் முடிந்து வாழ்வாதாரம் கிடைத்த இச்சூழலில் அது பொதுவாக உணவைக் குறிக்கிறது. நோக்கத்தைக் காட்டும் எபிரெய அமைப்பு, தமிழில் யாவேயின் கவனிப்பை விளக்கும் இணைச்செயலாக இயல்பாக வழங்கப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரை பொதுப்பட்டத்தை அல்ல, நான்கு எழுத்துகளைக் கொண்ட தனிப்பட்ட இறைப்பெயரையே பயன்படுத்துகிறது. ஆகவே அந்தப் பெயர் ஒலிபெயர்க்கப்படுகிறது.
- issue: פקד குறிக்கும் இறைத் தலையீடு
  choice: தம் மக்களைக் கவனித்து
  alternative: தம் மக்களைச் சந்தித்து / தம் மக்களுக்கு உதவ வந்து
  rationale: இச்சூழலில் வினை சாதகமான இறைக் கவனிப்பையும் செயலையும் குறிக்கிறது. ‘கவனித்து’ என்பது அந்தச் சாதகப் பொருளைக் காட்டினாலும், தலையீட்டின் துல்லியமான முறையை மூலத்தைவிட அதிகமாக நிர்ணயிப்பதில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘திரும்பிச் செல்லப் புறப்பட்டாள்’ என்பது பயணத்தின் தொடக்கத்தைத் தெளிவாக்குகிறது. அடிக்குறிப்புக் குறி அதன் உண்மையான சொற்பொருள் மாற்றான ‘உணவு’ என்பதற்குப் பின்னர் வைக்கப்பட்டுள்ளது.
