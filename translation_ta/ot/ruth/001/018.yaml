translation_notes:
  register: நவீன செந்தமிழுக்கு நெருக்கமான, எளிதில் புரியும் கண்ணியமான நடை. சுட்டுப்பெயர் குழப்பத்தைத் தவிர்க்க ரூத் மற்றும் நகோமி என்ற பெயர்கள் வெளிப்படையாக இடப்பட்டுள்ளன; எபிரெயத்தின் சுருக்கமான இறுதித் தொடரில் உள்ள சூழல்சார் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
