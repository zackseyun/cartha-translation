  text: When she saw that she was determined to go with her[a], she stopped speaking to her.
translation:
  language: ta
  text: ரூத் தன்னுடன் வர உறுதியாக இருந்ததை நகோமி கண்டபோது, அவளிடம் பேசுவதை நிறுத்தினாள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: கண்டபோது
  rationale: தொடர்ச்சியான எபிரெயக் கதைநடையை இயல்பான தமிழில் காலத் தொடர்புடன் வெளிப்படுத்துகிறது.
- source_word: כִּי
  choice: என்பதை
  rationale: நகோமி உணர்ந்தவற்றின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது; காரணத்தைக் காட்டுவதாக இங்கு கொள்ளத் தேவையில்லை.
- source_word: מִתְאַמֶּצֶת
  choice: உறுதியாக இருப்பதை
  rationale: אמץ என்பதன் Hitpael வடிவம் தன்னைத் திடப்படுத்திக்கொள்வதையும் உறுதியான தீர்மானத்தையும் குறிக்கிறது; இச்சூழலில் இந்தத் தமிழ் இயல்பாக அந்தப் பொருளைத் தருகிறது.
- source_word: הִיא
  choice: ரூத்
  rationale: எபிரெயத்தில் தனிப்பட்ட சுட்டுப்பெயர் ரூத்தை வலியுறுத்துகிறது. தமிழில் இரு பெண்களையும் தெளிவாக வேறுபடுத்த பெயரை வெளிப்படையாகப் பயன்படுத்துவது இயல்பும் தெளிவும் தருகிறது.
- source_word: לָלֶכֶת אִתָּהּ
  choice: தன்னுடன் வருவதில்
  rationale: பயணச் சூழலில் הלך என்பது ‘செல்/வரு’ எனப் பொருள்படும். நகோமியின் பார்வைநிலையிலிருந்து ‘தன்னுடன் வருதல்’ இயல்பான தமிழ்.
- source_word: וַתֶּחְדַּל לְדַבֵּר אֵלֶיהָ
  choice: அவளிடம் மேலும் பேசுவதை நிறுத்தினாள்
  rationale: சொல்லுக்குச் சொல் பொருளான ‘அவளிடம் பேசுவதை நிறுத்தினாள்’ என்பதைக் காக்கிறது. ‘மேலும்’ என்பது செயல் தொடராமல் போனதை இயல்பாகக் காட்டுகிறது; குறிப்பிட்ட பேச்சுச் செயலை முதன்மை உரையில் தீர்மானிப்பதில்லை.
