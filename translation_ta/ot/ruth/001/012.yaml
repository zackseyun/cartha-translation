  to: “திரும்புங்கள், என் மகள்களே; செல்லுங்கள். ஒரு கணவனுக்கு மனைவியாக இருப்பதற்கு நான் மிகவும் வயதாகிவிட்டேன்.[a] ‘எனக்கு நம்பிக்கை உண்டு’ என்று நான் சொன்னாலும்கூட[b]—இன்றிரவே நான் ஒரு கணவனுக்கு மனைவியாக இருந்தாலும், மகன்களைப் பெற்றெடுத்தாலும்கூட—”
