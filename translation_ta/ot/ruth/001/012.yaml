source:
  edition: WLC
  text: שֹׁ֤בְנָה בְנֹתַ/י֙ לֵ֔כְןָ כִּ֥י זָקַ֖נְתִּי מִ/הְי֣וֹת לְ/אִ֑ישׁ כִּ֤י אָמַ֨רְתִּי֙ יֶשׁ לִ֣/י תִקְוָ֔ה גַּ֣ם הָיִ֤יתִי הַ/לַּ֨יְלָה֙ לְ/אִ֔ישׁ וְ/גַ֖ם יָלַ֥דְתִּי בָנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/012.yaml
  text: Turn back[a], my daughters; go on, for I am too old to belong to a husband. Even if I were to say[b], ‘There is still hope for me’—even if I were with a husband tonight and even bore sons—
translation:
  language: ta
  text: “திரும்புங்கள், என் மகள்களே; செல்லுங்கள். ஒரு கணவனுக்கு மனைவியாக இருப்பதற்கு நான் மிகவும் வயதாகிவிட்டேன்.[a] ‘எனக்கு நம்பிக்கை உண்டு’ என்று நான் சொன்னாலும்கூட[b]—இன்றிரவே நான் ஒரு கணவனுக்கு மனைவியாக இருந்தாலும், மகன்களைப் பெற்றெடுத்தாலும்கூட—”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒரு கணவனைப் பெறுவதற்கு” அல்லது “திருமணம் செய்துகொள்வதற்கு.” எபிரெயத்தில் சொற்சொல்லாக, “ஒரு ஆண்/கணவனுக்கு இருப்பதற்கு” என்ற சொல்லாட்சி உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: 'எபிரெயம் ஓர் அனுமானத் தொடரை முன்வைக்கிறது: “நான், ‘எனக்கு நம்பிக்கை உண்டு’ என்று சொன்னாலும், இன்றிரவே ஒரு கணவனுக்கு மனைவியாக இருந்தாலும், மகன்களைப் பெற்றெடுத்தாலும்—”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁבְנָה
  choice: திரும்பிச் செல்லுங்கள்
  rationale: பெண்பால் பன்மை கட்டளை வடிவம். நகோமியுடன் தொடர்ந்து வராமல் தங்கள் வழிக்குத் திரும்பும்படி ரூத்தையும் ஒர்பாளையும் வலியுறுத்தும் திசைச்சார்ந்த பொருளைத் தெளிவாகத் தருகிறது.
- source_word: בְנֹתַי
  choice: என் மகள்களே
  rationale: மருமகள்களை அன்போடு குடும்ப உறவின் மொழியில் அழைக்கும் சொல்லை நேரடியாகவும் கண்ணியமாகவும் காக்கிறது.
- source_word: לֵכְןָ
  choice: போங்கள்
  rationale: முந்தைய கட்டளையைத் தொடர்ந்து வரும் இரண்டாவது பெண்பால் பன்மை கட்டளை. சுருக்கமான இயல்பான தமிழ் வடிவம்.
- source_word: זָקַנְתִּי
  choice: நான் மிகவும் முதிர்ந்துவிட்டேன்
  rationale: முதுமையடைந்ததன் தற்போதைய விளைவை நிறைவேற்றுவினை உணர்வுடன் காட்டுகிறது; மறுமணத்திற்கான வாய்ப்பின்மையைச் சூழல் உணர்த்துகிறது.
- source_word: מִהְיוֹת לְאִישׁ
  choice: ஒரு கணவனுக்கு மனைவியாக இருப்பதற்கு
  rationale: எபிரெயத்தின் ‘ஒரு ஆணுக்கு/கணவனுக்கு இருப்பது’ என்ற உறவுசார் சொல்லாட்சியை இயல்பான தமிழில் வெளிப்படுத்துகிறது; வெறுமனே ‘திருமணம் செய்துகொள்வது’ என்று சுருக்கவில்லை.
- source_word: כִּי אָמַרְתִּי
  choice: என்று நான் சொன்னாலும்கூட
  rationale: காரணவாக்கியமாக அல்லாமல் சாத்தியமற்றதற்கு நெருக்கமான ஓர் அனுமான நிபந்தனைத் தொடராக இங்கு כִּי செயல்படுவதைத் தெரிவிக்கிறது.
- source_word: יֶשׁ לִי תִקְוָה
  choice: எனக்கு நம்பிக்கை உண்டு
  rationale: எபிரெய இருப்புக் கட்டமைப்பைச் சுருக்கமாகவும் இயல்பாகவும் காக்கிறது.
- source_word: גַּם הָיִיתִי הַלַּיְלָה לְאִישׁ
  choice: இன்றிரவே நான் ஒரு கணவனுக்கு மனைவியாகி
  rationale: உடனடியான திருமண உறவை எண்ணிப் பார்க்கும் கற்பனைச் சூழலையும் ‘இன்றிரவே’ என்ற கால வலியுறுத்தலையும் காக்கிறது.
- source_word: וְגַם יָלַדְתִּי בָנִים
  choice: மகன்களையும் பெற்றெடுத்தாலும்கூட
  rationale: יָלַדְתִּי என்பதன் பிள்ளைப்பேறு பொருளையும் בָנִים என்பதன் ஆண்பால் குறிப்பையும் தெளிவாக வைத்திருக்கிறது.
theological_decisions:
- issue: குடும்பப் பெயர் தொடர்ச்சியும் மண உறவும் சார்ந்த சூழலில் ஆண்பால் சந்ததியைக் குறிப்பிடுதல்
  choice: மகன்கள்
  alternative: பிள்ளைகள்
  rationale: எபிரெய மூலம் בָנִים என்று குறிப்பாக ‘மகன்கள்’ என்கிறது. அடுத்த வசனங்களில் நகோமி முன்வைக்கும் மணவாய்ப்பு வாதத்திற்கும் குடும்பத் தொடர்ச்சிக்கும் இந்த ஆண்பால் குறிப்பு பொருத்தமானதால் அதை பொதுப்பாலாக்கவில்லை.
- issue: அனுமான நிபந்தனைகளின் நிறைவேறாத தன்மை
  choice: ‘சொன்னாலும்கூட … மனைவியாகி … பெற்றெடுத்தாலும்கூட’ என்ற திறந்த அனுமானத் தொடர்
  alternative: அவை முற்றிலும் சாத்தியமற்றவை என்று நேரடியாக அறிவித்தல்
  rationale: மூலத்தின் வாதம் பல அனுமானங்களை ஒன்றன்பின் ஒன்றாக அடுக்குகிறது; அவற்றை மொழிபெயர்ப்பாளர் வெளிப்படையான முடிவாக மாற்றாமல் அடுத்த வசனத்திற்குத் திறந்தவாறு வைத்திருக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையைக் கொண்டுள்ளது. ‘என் மகள்களே’ என்ற அன்பான குடும்ப அழைப்பும், நகோமியின் கூற்றில் தொடரும் வாதத்தைக் காட்டும் இறுதி நீள்கோடும் பாதுகாக்கப்பட்டுள்ளன. உறவுசார் எபிரெய மொழிநடையை முதன்மை உரையில் வைத்துக் கொண்டு, இயல்பான மாற்றுகளை அடிக்குறிப்பில் வழங்குகிறது.
