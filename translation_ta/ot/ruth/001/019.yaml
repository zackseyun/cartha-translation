base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/019.yaml
  text: So the two of them went on until they came to Bethlehem. And when they came to Bethlehem[a], the whole town was stirred because of them, and the women said, “Is this Naomi?”
translation:
  language: ta
  text: அப்படியே அவர்கள் இருவரும் பெத்லகேம் வரையில் பயணம் செய்தார்கள். அவர்கள் பெத்லகேமுக்கு வந்தபோது, அவர்களைக் குறித்து ஊர் முழுவதும் பரபரப்புற்றது. அங்கிருந்த பெண்கள்[a], “இவள் நகோமியா?” என்று கேட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “என்று கேட்டார்கள்” என்பதற்கான எபிரெய வினைச்சொல் பெண்பால் பன்மையில் உள்ளது; எனவே பேசியவர்கள் பெண்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלַכְנָה
  choice: தொடர்ந்து சென்றார்கள்
  rationale: הלך என்பதன் இக்கதைத் தொடர் வடிவம் பயணம் தொடர்ந்ததைச் சுட்டுகிறது; இயல்பான தமிழில் அதைத் தெளிவாகக் காட்டுகிறது.
- source_word: שְׁתֵּיהֶם
  choice: அவர்கள் இருவரும்
  rationale: நகோமியும் ரூத்தும் இணைந்து பயணித்த இருவரென்பதற்கான மூலமொழியின் வலியுறுத்தலைப் பாதுகாக்கிறது.
- source_word: עַד בֹּאנָה
  choice: வந்து சேரும்வரை
  rationale: עַד உடன் בוא பயணத்தின் முடிவிடத்தைச் சுட்டுகிறது; தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: בֵּית לָחֶם
  choice: பெத்லகேம்
  rationale: இது இடப்பெயர் என்பதால் அதன் சொல்லார்த்தத்தை மொழிபெயர்க்காமல் தமிழில் ஒலிபெயர்க்கப்படுகிறது.
- source_word: וַיְהִי כְּבֹאנָה
  choice: அவர்கள் ... வந்தபோது
  rationale: எபிரெயக் கதைத் தொடரின் காலத் தொடர்பை இயல்பான தமிழில் வழங்குகிறது; தேவையற்ற 'அது நிகழ்ந்தது' போன்ற சொற்களைச் சேர்க்கவில்லை.
- source_word: וַתֵּהֹם
  choice: பரபரப்படைந்தது
  rationale: המה இங்கு எழுந்த குழப்பமான உணர்ச்சியையும் சமூகக் கிளர்ச்சியையும் குறிக்கிறது; 'கலவரம்' என்று மிகைப்படுத்தாமல் ஊரின் பரபரப்பைத் தருகிறது.
- source_word: כָּל הָעִיר
  choice: ஊர் முழுவதும்
  rationale: கதைச் சூழலில் பெத்லகேமை நவீன தமிழில் இயல்பாக 'ஊர்' என வழங்கி, முழுச் சமூகத்தின் எதிர்வினையையும் காக்கிறது.
- source_word: עֲלֵיהֶן
  choice: அவர்களால்
  rationale: עַל இங்கு நகோமி, ரூத் ஆகியோரின் வருகையே பரபரப்புக்குக் காரணம் அல்லது சந்தர்ப்பம் என்பதைச் சுருக்கமாகத் தெரிவிக்கிறது.
- source_word: וַתֹּאמַרְנָה
  choice: அங்கிருந்த பெண்கள் ... என்று கேட்டார்கள்
  rationale: வினைச்சொல் பெண்பால் பன்மையில் இருப்பதால் பேசியவர்கள் பெண்கள் என்பதைத் தமிழில் வெளிப்படையாகக் காட்டுகிறது; கேள்வி வாக்கியம் என்பதால் 'கேட்டார்கள்' இயல்பானது.
- source_word: הֲזֹאת נָעֳמִי
  choice: இவள் நகோமிதானா?
  rationale: வியப்புடன் அடையாளம் காண முயலும் நேரடியான கேள்வியைப் பாதுகாக்கிறது; 'உண்மையிலேயே' போன்ற கூடுதல் விளக்கத்தைச் சேர்க்கவில்லை.
