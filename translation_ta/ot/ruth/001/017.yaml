source:
  edition: WLC
  text: בַּ/אֲשֶׁ֤ר תָּמ֨וּתִי֙ אָמ֔וּת וְ/שָׁ֖ם אֶקָּבֵ֑ר כֹּה֩ יַעֲשֶׂ֨ה יְהוָ֥ה לִ/י֙ וְ/כֹ֣ה יֹסִ֔יף כִּ֣י הַ/מָּ֔וֶת יַפְרִ֖יד בֵּינִ֥/י וּ/בֵינֵֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/017.yaml
  text: Where you die[a], I will die, and there I will be buried. May Yahweh do so to me, and more also[b], if anything but death separates me from you.
translation:
  language: ta
  text: நீ இறக்கும் இடத்தில் நானும் இறப்பேன்; அங்கேயே நான் அடக்கம் செய்யப்படுவேன். யாவே எனக்கு இப்படியும் அதற்கும் மேலாகவும் செய்யட்டும்; மரணத்தைத் தவிர வேறெதுவும் என்னையும் உன்னையும் பிரித்தால்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּאֲשֶׁר
  choice: நீ இறக்கும் இடத்தில்
  rationale: בְּ + אֲשֶׁר இடத்தைக் குறிக்கிறது. தமிழில் இயல்பாகவும் துல்லியமாகவும் இடத்தொடர்பை வெளிப்படுத்துகிறது.
- source_word: תָּמוּתִי / אָמוּת
  choice: நீ இறக்கும் ... நானும் இறப்பேன்
  rationale: மூலத்தின் இணையான வினைச்சொல் அமைப்பையும் ரூத்தின் உறுதியான வாக்கையும் காக்கிறது; ‘நானும்’ இருவரின் ஒருமைப்பாட்டை இயல்பான தமிழில் காட்டுகிறது.
- source_word: וְשָׁם אֶקָּבֵר
  choice: அங்கேயே நான் அடக்கம் செய்யப்படுவேன்
  rationale: שָׁם என்பதன் இடச் சுட்டுதலை ‘அங்கேயே’ வலியுறுத்துகிறது; קבר என்பதன் நிபால் வடிவைச் செயப்பாட்டுவினையாக அளிக்கிறது.
- source_word: כֹּה יַעֲשֶׂה יְהוָה לִי וְכֹה יֹסִיף
  choice: யாவே எனக்கு இப்படிச் செய்யட்டும்; இதற்கும் மேலாகவும் செய்யட்டும்
  rationale: இது தெய்வீகத் தண்டனையைத் தன்மீது வரவழைக்கும் எபிரெய உறுதிமொழிச் சூத்திரம். அதன் வடிவத்தையும் solemn force-ஐயும் புரிந்துகொள்ளக்கூடிய தமிழில் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எழுத்து இறைப்பெயரை ஒரு பட்டமாக மாற்றாமல், தமிழில் அறியப்பட்ட ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: כִּי
  choice: '...பிரித்தால்'
  rationale: உறுதிமொழிச் சூழலில் நிபந்தனையை அறிமுகப்படுத்தும் வலிமையைத் தமிழின் ‘-ஆல்’ நிபந்தனை வடிவம் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַמָּוֶת יַפְרִיד בֵּינִי וּבֵינֵךְ
  choice: மரணத்தைத் தவிர வேறெதுவும் உன்னையும் என்னையும் பிரித்தால்
  rationale: உறுதிமொழியின் சூழல்படி மரணம் மட்டுமே பிரிவுக்குரிய காரணமாக அனுமதிக்கப்படுகிறது. ‘உன்னையும் என்னையும்’ என்பது בֵּינִי וּבֵינֵךְ என்பதற்கான இயல்பான தமிழ் அமைப்பு.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது; ஆகவே அதை பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்க்கப்படுகிறது.
- issue: ரூத்தின் உறுதிமொழியின் இறுதி நிபந்தனை
  choice: மரணத்தைத் தவிர வேறெதுவும் ... பிரித்தால்
  alternative: மரணம் ... பிரித்தால்
  rationale: உறுதிமொழிச் சூத்திரத்தின் வழக்கமான பொருள், மரணம் மட்டுமே அந்த உறவை முடிக்கலாம் என்பதாகும். இருப்பினும் எபிரெய சொற்களின் மேற்பரப்பு வடிவம் சுருக்கமாக இருப்பதால் நேரடியான மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: உறுதிமொழியில் மறைந்திருக்கும் விளைவு
  choice: அப்படியே ஆகட்டும்
  alternative: விளைவை வெளிப்படையாகச் சேர்க்காமல் வாக்கியத்தை முடித்தல்
  rationale: தமிழில் நிபந்தனை வாக்கியம் தொங்காமல் இருக்க, முன் கூறிய தெய்வீகத் தண்டனை அந்த நிலையில் நேரிடட்டும் என்ற மறைபொருள் சுருக்கமாக வெளிப்படுத்தப்படுகிறது; புதிய தண்டனை விவரம் எதுவும் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் உறுதிமொழிக்குரிய கண்ணியமும் தீவிரமும் குன்றாத வகையிலும் அமைக்கப்பட்டது. ‘அடக்கம் செய்யப்படுவேன்’ செயப்பாட்டு வடிவத்தைப் பாதுகாக்கிறது; ‘அங்கேயே’ மற்றும் ‘நானும்’ மூலத்தின் இணைப்பு மற்றும் வலியுறுத்தலை இயல்பாக வெளிப்படுத்துகின்றன.
