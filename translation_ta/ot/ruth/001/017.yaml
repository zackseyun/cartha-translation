revisions:
- from: நீ இறக்கும் இடத்தில் நானும் இறப்பேன்; அங்கேயே நான் அடக்கம் செய்யப்படுவேன். யாவே எனக்கு இப்படிச் செய்யட்டும்; இதற்கும் மேலாகவும் செய்யட்டும்[a]. மரணத்தைத் தவிர வேறெதுவும் உன்னையும் என்னையும் பிரித்தால்[b], அப்படியே ஆகட்டும்.
