  text: וַ/תֹּ֤אמֶר נָעֳמִי֙ שֹׁ֣בְנָה בְנֹתַ֔/י לָ֥/מָּה תֵלַ֖כְנָה עִמִּ֑/י הַֽ/עֽוֹד לִ֤/י בָנִים֙ בְּֽ/מֵעַ֔/י וְ/הָי֥וּ לָ/כֶ֖ם לַ/אֲנָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/011.yaml
  text: But Naomi said[a], “Turn back, my daughters. Why would you go with me? Do I still have sons in my womb, that they may become husbands for you?”
translation:
  language: ta
  text: ஆனால் நகோமி, “என் மகள்களே[a], திரும்பிப் போங்கள். நீங்கள் ஏன் என்னுடன் வர வேண்டும்? உங்களுக்குக் கணவர்களாகும்படி என் கருப்பையில் இன்னும் மகன்கள் இருக்கிறார்களா?” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நகோமி தன் மருமகள்களைப் பாசத்துடன் “என் மகள்களே” என்று அழைக்கிறாள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: ஆனால் நகோமி … என்றாள்
  rationale: வாவ் தொடர்ச்சிக் கூறு நிகழ்ச்சியை முன்னெடுத்தாலும், முந்தைய வசனத்தில் மருமகள்கள் தெரிவித்த நோக்கத்திற்கு நகோமி மறுமொழி கூறுவதால், சூழலின் எதிர்மறைத் திருப்பத்தை இயல்பாகக் காட்ட ‘ஆனால்’ பயன்படுத்தப்பட்டது.
- source_word: שֹׁבְנָה
  choice: திரும்பிப் போங்கள்
  rationale: שוב என்பதன் திரும்பிச் செல்லும் திசைப் பொருளைத் தெளிவாகவும் இயல்பான நவீனத் தமிழிலும் தெரிவிக்கிறது.
- source_word: בְנֹתַי
  choice: என் மகள்களே
  rationale: எபிரெயச் சொற்றொடரின் நேரடியான உறவுமுறை அழைப்பையும் நகோமியின் பாசத்தையும் பாதுகாக்கிறது; சூழலில் அவர்கள் அவளுடைய மருமகள்கள் என்பது அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: לָמָּה תֵלַכְנָה עִמִּי
  choice: நீங்கள் ஏன் என்னுடன் வர வேண்டும்?
  rationale: இங்குள்ள நிறைவுறா வினை வடிவத்தின் எதிர்நோக்கிய, வாதவினா நுணுக்கத்தை ‘வர வேண்டும்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַעוֹד לִי
  choice: என்னிடம் இன்னும் … இருக்கிறார்களா?
  rationale: עוֹד உடன் வரும் உடைமை அல்லது தொடர்ந்திருத்தல் பொருளைத் தெளிவான தமிழில் தருகிறது; ‘கருப்பையில்’ என்பதுடன் இயல்பதற்காக ‘என் கருப்பையில் இன்னும்’ என்று அமைக்கப்பட்டது.
- source_word: בָנִים
  choice: மகன்கள்
  rationale: எபிரெயில் குறிப்பாக ஆண் பிள்ளைகள் குறிக்கப்படுகின்றனர்; திருமணத்தைப் பற்றிய வாதத்தின் பொருளை மறைக்காமல் ‘மகன்கள்’ எனப் பாதுகாக்கப்பட்டது.
- source_word: בְּמֵעַי
  choice: என் கருப்பையில்
  rationale: இந்தப் பிள்ளைப்பேறு சூழலில் ‘உள்ளுறுப்புகள்’ அல்லது ‘வயிறு’ என்பதைவிட இனப்பெருக்கப் பொருளைக் குறிப்பாகவும் கண்ணியமாகவும் தெரிவிக்கிறது.
- source_word: וְהָיוּ לָכֶם לַאֲנָשִׁים
  choice: உங்களுக்குக் கணவர்களாகும்படி
  rationale: אֲנָשִׁים இங்கு வெறும் ‘ஆண்கள்’ அல்ல, ‘கணவர்கள்’ எனப் பொருள்படுகிறது. தொடரின் கருதுகோள் சார்ந்த நோக்கம் அல்லது விளைவை ‘ஆகும்படி’ இயல்பாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: நகோமியின் கேள்விக்கும் திருமண வழக்கிற்கும் உள்ள தொடர்பு
  choice: மகன்கள் பிறந்து இவர்களுக்குக் கணவர்களாகும் சாத்தியத்தை நகோமி வாதவினாவாக முன்வைப்பதை மட்டும் மொழிபெயர்த்தல்
  alternative: ஒரு குறிப்பிட்ட திருமணச் சட்டம் அல்லது சமய விளக்கத்தை வசனத்திற்குள் வெளிப்படையாகச் சேர்த்தல்
  rationale: வசனம் திருமணப் பின்னணியை உணர்த்தினாலும், சட்டத்தின் பெயரையோ அதன் முழு விதிமுறைகளையோ கூறவில்லை; ஆகவே மூலத்தின் மறைமுகத் தொடர்பும் வாதத் தீவிரமும் அப்படியே வைக்கப்பட்டன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டது. எபிரெயின் வாதவினா அமைப்பும் குடும்பப் பாசத்தை வெளிப்படுத்தும் அழைப்பும் பாதுகாக்கப்பட்டுள்ளன.
