translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. பெயர்களுக்கு தமிழ் வேதாகம வாசகர்களுக்குப் பரிச்சயமான வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. எபிரெயத்தின் மீளுரைப் பெயரிடும் அமைப்பு அளவோடு காக்கப்பட்டுள்ளது; ‘மோவாபின் வெளிநிலங்கள்’ மற்றும் ‘அங்கே இருந்தார்கள்’ ஆகியவற்றின் உண்மையான சொற்பொருள் நுட்பங்கள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
