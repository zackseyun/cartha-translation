  yaml_path: translation/ot/ruth/001/002.yaml
  text: The man's name was Elimelech[a], and his wife's name was Naomi, and the names of his two sons were Mahlon and Chilion. They were Ephrathites from Bethlehem in Judah[c][b]. They came to the fields of Moab and were there.
translation:
  language: ta
  text: அந்த மனிதனின் பெயர் எலிமெலேக்கு; அவனுடைய மனைவியின் பெயர் நகோமி; அவனுடைய இரண்டு மகன்களின் பெயர்கள் மக்லோன், கிலியோன். அவர்கள் யூதாவிலுள்ள பெத்லகேமைச் சேர்ந்த எப்பிராத்தியர்கள். அவர்கள் மோவாபின் வெளிநிலங்களுக்கு[a] வந்து, அங்கே இருந்தார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மோவாப் நாட்டுப்புறப் பகுதிக்கு” அல்லது “மோவாப் பிரதேசத்திற்கு”; எபிரெயத்தில் சொல்லர்த்தமாக, “மோவாபின் வயல்களுக்கு.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அங்கே தங்கினார்கள்”; எபிரெயத்தில் சொல்லர்த்தமாக, “அங்கே இருந்தார்கள்.”
    reason: lexical_alternative
