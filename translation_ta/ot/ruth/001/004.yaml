base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/004.yaml
  text: And they took for themselves Moabite wives. The name of the one was Orpah[a], and the name of the other was Ruth. And they lived there about ten years.
translation:
  language: ta
  text: அவர்கள் மோவாபியப் பெண்களைத் தங்களுக்கு மனைவிகளாகத் திருமணம் செய்துகொண்டார்கள்.[a] ஒருத்தியின் பெயர் ஓர்பாள்; மற்றவளின் பெயர் ரூத். அவர்கள் அங்கே ஏறக்குறைய பத்து ஆண்டுகள் வாழ்ந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்சொல்லாக, “மோவாபிய மனைவிகளைத் தங்களுக்காக எடுத்துக்கொண்டார்கள்.” இது அவர்கள் மோவாபியப் பெண்களை மனைவிகளாகத் திருமணம் செய்துகொண்டார்கள் என்று பொருள்படும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂאוּ לָהֶם נָשִׁים
  choice: தங்களுக்குத் திருமணம் செய்துகொண்டார்கள்
  rationale: נָשָׂא என்பதுடன் נָשִׁים வருவது ‘பெண்களை மனைவிகளாக ஏற்றுக்கொள்ளுதல்,’ அதாவது திருமணம் செய்துகொள்ளுதல் என்ற எபிரெய மரபுத்தொடர். தமிழில் சொற்சொல்லாக ‘மனைவிகளை எடுத்துக்கொண்டார்கள்’ என்பது இயல்பற்றதாகவும் தவறாகப் புரிந்துகொள்ளப்படக் கூடியதாகவும் இருப்பதால், பொருளைத் தெளிவாகத் தரும் இயல்பான வடிவம் தேர்ந்தெடுக்கப்பட்டது; לָהֶם என்பதின் தன்நல/தற்சார்பு நுட்பம் ‘தங்களுக்கு’ என்பதால் தக்கவைக்கப்பட்டது.
- source_word: נָשִׁים מֹאֲבִיּוֹת
  choice: மோவாபியப் பெண்களை
  rationale: பெண்களின் மோவாபிய அடையாளத்தைத் தெளிவாகக் காக்கிறது; வினைச்சொல் அவர்களை மனைவிகளாகத் திருமணம் செய்துகொண்டதைக் காட்டுவதால் ‘மனைவிகள்’ என்பதை மீண்டும் சேர்க்க வேண்டியதில்லை.
- source_word: שֵׁם הָאַחַת ... וְשֵׁם הַשֵּׁנִית
  choice: ஒருத்தியின் பெயர் ... மற்றவளின் பெயர்
  rationale: இரு பெண்களை வேறுபடுத்தும் எபிரெய இணை அமைப்பை இயல்பான நவீன தமிழில் தருகிறது. הַשֵּׁנִית சொற்சொல்லாக ‘இரண்டாமவள்’ என்றாலும், இங்கு வரிசையை வலியுறுத்தாமல் இருவரில் மற்றவளைக் குறிக்கிறது.
- source_word: עָרְפָּה
  choice: ஓர்பாள்
  rationale: எபிரெயப் பெயரின் இறுதி ה இங்கு உச்சரிக்கப்படாவிட்டாலும், עָרְפָּה (ʿOrpāh) என்ற ஒலிவடிவத்தைத் தமிழில் மரபாகவும் வேறுபாட்டுடனும் எழுத்துப்பெயர்க்கிறது.
- source_word: רוּת
  choice: ரூத்
  rationale: எபிரெய רוּת என்ற தனிப்பெயரின் ஒலியைத் தமிழில் நிலைபெற்ற வடிவில் எழுத்துப்பெயர்க்கிறது.
- source_word: וַיֵּשְׁבוּ שָׁם
  choice: அவர்கள் அங்கே ... வாழ்ந்தார்கள்
  rationale: יָשַׁב இச்சூழலில் நீண்டகாலம் வசித்தல் அல்லது வாழ்தல் எனப் பொருள்படுகிறது; ‘வாழ்ந்தார்கள்’ நவீன தமிழில் இயல்பானது.
- source_word: כְּעֶשֶׂר שָׁנִים
  choice: ஏறக்குறைய பத்து ஆண்டுகள்
  rationale: முன்னொட்டு כְּ இங்கு தோராயத்தைக் குறிக்கிறது; ஆகவே சரியாகப் பத்து ஆண்டுகள் என்று உறுதிப்படுத்தாமல் அண்மித்த கால அளவைத் தக்கவைக்கிறது.
