id: RUT.1.20
reference: Ruth 1:20
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/תֹּ֣אמֶר אֲלֵי/הֶ֔ן אַל תִּקְרֶ֥אנָה לִ֖/י נָעֳמִ֑י קְרֶ֤אןָ לִ/י֙ מָרָ֔א כִּי הֵמַ֥ר שַׁדַּ֛י לִ֖/י מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/020.yaml
  text: But she said to them[a], “Do not call me Naomi; call me Mara, for the Almighty has made me very bitter.”
translation:
  language: ta
  text: ஆனால் அவள் அவர்களிடம், “என்னை நகோமி என்று அழைக்காதீர்கள்; என்னை மாரா என்று அழையுங்கள்[a]. ஏனெனில் சர்வவல்லவர் என்னை மிகவும் கசப்புக்குள்ளாக்கினார்” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நகோமி” என்பதற்கு “இனிமையானவள்” என்பது போன்ற பொருளும், “மாரா” என்பதற்கு “கசப்பானவள்” என்ற பொருளும் உண்டு.
    reason: இரு பெயர்களுக்கிடையிலான சொல்விளையாட்டையும் நகோமி கோரும் பெயர் மாற்றத்தின் காரணத்தையும் விளக்குகிறது.
lexical_decisions:
- source_word: וַתֹּאמֶר אֲלֵיהֶן
  choice: ஆனால் அவள் அவர்களிடம் … என்றாள்
  rationale: வாவ் தொடர்கதை நிகழ்வை முன்னெடுத்தாலும், முந்தைய வசனத்தில் பெண்கள் கூறியதற்கு நகோமி திருத்தமாகப் பதிலளிப்பதால் ‘ஆனால்’ என்பது உரையாடலின் எதிர்மறைத் திருப்பை இயல்பாக வெளிப்படுத்துகிறது. אֲלֵיהֶן பெண்பால் பன்மையைச் சுட்டினாலும், சூழலில் பெண்கள் என்பது தெளிவாக இருப்பதால் இயல்பான தமிழில் ‘அவர்களிடம்’ என வழங்கப்பட்டது.
- source_word: אַל תִּקְרֶאנָה לִי נָעֳמִי
  choice: என்னை நகோமி என்று அழைக்காதீர்கள்
  rationale: קרא என்பது இங்கு ஒருவரை ஒரு பெயரால் அழைப்பதைக் குறிக்கிறது. பெண்பால் பன்மை வடிவத்தின் பன்மைத் தன்மை ‘அழைக்காதீர்கள்’ என்பதில் காக்கப்படுகிறது.
- source_word: קְרֶאןָ לִי מָרָא
  choice: என்னை மாரா என்று அழையுங்கள்
  rationale: முந்தைய கட்டளைக்கு இணையான அமைப்பைத் தக்கவைத்து பெயர்களுக்கிடையிலான எதிர்மறையை வெளிப்படுத்துகிறது. மָרָא மாற்றுப் பெயராக வருவதால் மொழிபெயர்க்காமல் ‘மாரா’ என ஒலிபெயர்க்கப்பட்டது; அதன் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: பெயர் மாற்றத்திற்கான காரணத்தை அறிமுகப்படுத்தும் விளக்கத் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: הֵמַר … לִי מְאֹד
  choice: என்னை மிகவும் கசப்புக்குள்ளாக்கினார்
  rationale: מרר வேரின் ஹிஃபில் வடிவத்திலுள்ள ‘கசப்பாக்குதல்’ என்ற காரணவினைப் பொருளை நேரடியாகக் காத்து, ‘மாரா’ என்ற பெயருடனான சொல்விளையாட்டையும் வெளிப்படுத்துகிறது. לִי தமிழில் இயல்பாக நேரடி அனுபவப் பொருளாக ‘என்னை’ என அமைக்கப்பட்டது; מְאֹד ‘மிகவும்’ என வலுப்படுத்துகிறது.
- source_word: שַׁדַּי
  choice: சர்வவல்லவர்
  rationale: இது இறைப்பட்டம். தமிழில் வழக்கமான, பொருள் தெளிவான ‘சர்வவல்லவர்’ என்பது வல்லமையைச் சுட்டும் பட்டமாக வழங்கப்படுகிறது.
theological_decisions:
- issue: שַׁדַּי என்ற இறைப்பட்டத்தின் மொழியாக்கம்
  choice: சர்வவல்லவர்
  alternative: ஷத்தாய்
  rationale: தனிப்பெயராக ஒலிபெயர்ப்பதைவிட, பட்டத்தின் பாரம்பரியமாகப் புரிந்துகொள்ளப்படும் வல்லமை சார்ந்த பொருளைத் தமிழில் வெளிப்படுத்துகிறது; மூலத்தில் தீர்மானிக்க முடியாத கூடுதல் கோட்பாட்டு விளக்கம் சேர்க்கப்படவில்லை.
- issue: הֵמַר என்பதன் காரணவினை மற்றும் நகோமியின் குற்றச்சாட்டு
  choice: என்னை மிகவும் கசப்புக்குள்ளாக்கினார்
  alternative: என்னிடம் மிகவும் கசப்பாக நடந்துகொண்டார்
  rationale: மூல ஹிஃபில் வடிவத்தின் ‘கசப்பாக்கினார்’ என்ற நேரடித் தன்மையையும் மாரா என்ற பெயருடனான தொடர்பையும் காக்கிறது. நகோமி தனது துயரத்தை இறைவனின் செயலோடு இணைக்கும் உரையின் தீவிரமான இறையியல் பதற்றம் மென்மையாக்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், கண்ணியமான நேரடி உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘நகோமி’, ‘மாரா’ ஆகியவை பெயர்களாக ஒலிபெயர்க்கப்பட்டு, அவற்றின் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது. ‘கசப்புக்குள்ளாக்கினார்’ என்பது சற்றே உயர்ந்தாலும் பொதுவாகப் புரியும் நடையாக இருந்து, மூலத்தின் காரணவினை மற்றும் உணர்ச்சித் தீவிரத்தை காக்கிறது.
