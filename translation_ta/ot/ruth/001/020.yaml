  source_fidelity: 'The Tamil accurately conveys Naomi’s corrective response, the paired naming imperatives, the explanatory force of כִּי, and the Hiphil sense of הֵמַר: the Almighty has made her very bitter. ‘சர்வவல்லவர்’ is an established Tamil rendering of שַׁדַּי and does not add doctrinal content. The feminine-plural referent of אֲלֵיהֶן is recoverable from the immediate context (the women of Bethlehem); ‘அவர்களிடம்’ is idiomatic Tamil.'
  naturalness: The direct speech is clear, dignified, and natural in modern standard Tamil. ‘என்னை மிகவும் கசப்புக்குள்ளாக்கினார்’ is somewhat elevated but intelligible and aptly preserves both the causative force and the bitter/Mara wordplay.
  terminology: ‘நகோமி’ and ‘மாரா’ are suitable transliterations. The explanatory footnote appropriately supplies the names’ semantic contrast without placing it into the main text. ‘சர்வவல்லவர்’ is conventional and suitable for the divine title.
