base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/013.yaml
  text: Would you wait for them until they were grown? Would you refrain from belonging to a man for them? No[a], my daughters, for it is much more bitter for me than for you, because the hand of Yahweh has gone out against me.
translation:
  language: ta
  text: அவர்கள் வளர்ந்து பெரியவர்களாகும்வரை அவர்களுக்காகக் காத்திருப்பீர்களா? அவர்களுக்காக ஒரு ஆணைத் திருமணம் செய்துகொள்ளாமல் இருப்பீர்களா?[a] வேண்டாம், என் மகள்களே! உங்களைவிட எனக்கு மிகவும் கசப்பாயிருக்கிறது; ஏனெனில் யாவேயின் கை எனக்கு எதிராகப் புறப்பட்டிருக்கிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுக்காகத் திருமணம் செய்யாமல் இருப்பீர்களா?” எபிரெய வினை அரிதானது; வருங்காலக் கணவர்களுக்காகக் காத்திருந்து, அதுவரை திருமணம் செய்யாமல் இருப்பதையே இது குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּשַׂבֵּרְנָה
  choice: காத்திருப்பீர்களா
  rationale: שׂבר என்பதன் காத்திருத்தல்/எதிர்பார்த்திருத்தல் என்ற பொருளைச் சூழலுக்கேற்ற இயல்பான தமிழில் தருகிறது.
- source_word: עַד אֲשֶׁר יִגְדָּלוּ
  choice: அவர்கள் வளர்ந்து பெரியவர்களாகும்வரை
  rationale: கற்பனையாகப் பிறக்கக்கூடிய மகன்கள் திருமண வயதை அடைவதுவரையிலான காலத்தைக் குறிக்கிறது.
- source_word: תֵּעָגֵנָה ... לְבִלְתִּי הֱיוֹת לְאִישׁ
  choice: வேறொரு ஆணை மணந்துகொள்ளாமல் இருப்பீர்களா
  rationale: அரிதான עגן வினையின் பொருளைத் தொடர்ந்து வரும் ‘ஒரு ஆணுக்குரியவர்களாக ஆகாமல்’ என்ற சொற்றொடர் தெளிவுபடுத்துகிறது; தமிழில் திருமணம் செய்யாமல் காத்திருப்பதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אַל־בְּנֹתַי
  choice: வேண்டாம், என் மகள்களே!
  rationale: אַל இங்கு நேரடியான தடையைவிட நகோமியின் உணர்ச்சிமிக்க மறுப்பாகச் செயல்படுகிறது.
- source_word: כִּי מַר־לִי מְאֹד מִכֶּם
  choice: உங்களைவிட என் நிலை எனக்கு மிகவும் கசப்பானதாக இருக்கிறது
  rationale: מִכֶּם என்பதன் ஒப்பீட்டுப் பொருளையும் מַר என்பதன் கசப்பு உருவகத்தையும் வெளிப்படையாகக் காக்கிறது.
- source_word: יָצְאָה בִי יַד יְהוָה
  choice: யெகோவாவின் கை எனக்கு எதிராகப் புறப்பட்டிருக்கிறது
  rationale: இறைவனின் துன்புறுத்தும் செயலைக் குறிக்கும் எபிரெய உருவகத்தையும் יצא வினையின் இயக்கப் படிமத்தையும் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: இறைப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பால் வழங்குகிறது.
theological_decisions:
- issue: நகோமியின் துன்பத்தில் இறைச் செயல்பாட்டை மொழிபெயர்த்தல்
  choice: யெகோவாவின் கை எனக்கு எதிராகப் புறப்பட்டிருக்கிறது
  alternative: யெகோவாவின் கை எனக்கு எதிராகத் திரும்பியிருக்கிறது
  rationale: எபிரெய உரை நகோமியின் துன்பத்தை யெகோவாவின் கையோடு நேரடியாக இணைக்கிறது. அந்த இறையியல் பதற்றத்தை மென்மையாக்காமலும் விளக்கித் தீர்க்காமலும் இம்மொழிபெயர்ப்பு காக்கிறது.
translation_notes:
  register: நவீன செந்தமிழுக்கு அருகான, இயல்பான, கண்ணியமான நடை. அரிதான எபிரெய வினையின் நிச்சயமின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது; ‘கசப்பு’ மற்றும் ‘கை புறப்படுதல்’ ஆகிய மூல உருவகங்கள் தக்கவைக்கப்பட்டுள்ளன.
