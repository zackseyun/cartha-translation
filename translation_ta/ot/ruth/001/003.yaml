id: RUT.1.3
reference: Ruth 1:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יָּ֥מָת אֱלִימֶ֖לֶךְ אִ֣ישׁ נָעֳמִ֑י וַ/תִּשָּׁאֵ֥ר הִ֖יא וּ/שְׁנֵ֥י בָנֶֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/003.yaml
  text: Then Elimelech[a], Naomi’s husband, died, and she was left, and her two sons.
translation:
  language: ta
  text: பின்பு நகோமியின் கணவனான எலிமெலேக்கு இறந்தான்; அவளும் அவளுடைய இரண்டு மகன்களும் எஞ்சினர்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָת
  choice: பின்பு ... இறந்தான்
  rationale: Wayyiqtol கதை நிகழ்வை அடுத்த கட்டத்துக்கு நகர்த்துகிறது. நவீன தமிழில் ‘பின்பு’ நிகழ்வின் தொடர்ச்சியை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֱלִימֶלֶךְ
  choice: எலிமெலேக்கு
  rationale: தனிப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: אִישׁ נָעֳמִי
  choice: நகோமியின் கணவனான
  rationale: இச்சூழலில் אִישׁ என்பது வெறுமனே ‘ஆண்’ அல்ல, திருமண உறவைக் குறிக்கும் ‘கணவன்’ என்று பொருள்படுகிறது.
- source_word: וַתִּשָּׁאֵר
  choice: எஞ்சியிருந்தார்கள்
  rationale: שׁאר இங்கு ஒருவரின் இறப்புக்குப் பின் உயிரோடு மீந்திருப்பதைக் குறிக்கிறது. கூட்டு எழுவாய்க்கு ஏற்றவாறு தமிழில் பன்மை வினை பயன்படுத்தப்பட்டுள்ளது.
- source_word: הִיא וּשְׁנֵי בָנֶיהָ
  choice: அவளும் அவளுடைய இரண்டு மகன்களும்
  rationale: எபிரெய மூலத்தில் நகோமியும் அவளுடைய இரண்டு மகன்களும் எஞ்சியிருந்தவர்கள் எனத் தெளிவாக இணை எழுவாய்களாகக் குறிப்பிடப்படுகின்றனர்; அந்த அமைப்பு தமிழிலும் காக்கப்பட்டுள்ளது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. எபிரெய மொழியின் வெளிப்படையான ‘அவளும் அவளுடைய இரண்டு மகன்களும்’ என்ற கூட்டு எழுவாய் காக்கப்பட்டு, தமிழின் இயல்புக்கு ஏற்ப பன்மை வினை அமைக்கப்பட்டுள்ளது.
