- from: பின்பு நகோமியின் கணவனான எலிமெலேக்கு இறந்தான்; அவளும் அவளுடைய இரண்டு மகன்களும் எஞ்சியிருந்தார்கள்.
  to: பின்பு நகோமியின் கணவனான எலிமெலேக்கு இறந்தான்; அவளும் அவளுடைய இரண்டு மகன்களும் எஞ்சினர்.
