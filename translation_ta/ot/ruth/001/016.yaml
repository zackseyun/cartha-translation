- from: ஆனால் ரூத், “உம்மைவிட்டு விலகி, உம்மைப் பின்தொடர்வதை விட்டுத் திரும்பிப்போகும்படி என்னை வற்புறுத்தாதீர்[a][b]. நீர் எங்கே போகிறீரோ, அங்கே நானும் போவேன்; நீர் எங்கே இரவு தங்குகிறீரோ, அங்கே நானும் இரவு தங்குவேன்[c]. உமது மக்கள் என் மக்கள்; உமது கடவுள் என் கடவுள்[d]” என்றாள்.
  to: ஆனால் ரூத், “உம்மைவிட்டுச் செல்லவும், உம்மைப் பின்தொடர்வதை விட்டுத் திரும்பிப்போகவும் என்னை வற்புறுத்தாதீர்[a][b]. ஏனெனில், நீர் எங்கே போகிறீரோ, அங்கே நானும் போவேன்; நீர் எங்கே இரவு தங்குகிறீரோ, அங்கே நானும் இரவு தங்குவேன்[c]. உமது மக்கள் என் மக்கள்; உமது கடவுள் என் கடவுள்[d]” என்றாள்.
