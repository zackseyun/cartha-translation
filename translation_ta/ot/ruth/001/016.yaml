base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/016.yaml
  text: But Ruth said[a], “Do not press me to leave you, to turn back from following after you. For where you go, I will go; and where you lodge, I will lodge. Your people will be my people[d][c][b], and your God my God.”
translation:
  language: ta
  text: ஆனால் ரூத், “உம்மைவிட்டுச் செல்லவும், உம்மைப் பின்தொடர்வதை விட்டுத் திரும்பிப்போகவும் என்னை வற்புறுத்தாதீர்[a][b]. ஏனெனில், நீர் எங்கே போகிறீரோ, அங்கே நானும் போவேன்; நீர் எங்கே இரவு தங்குகிறீரோ, அங்கே நானும் இரவு தங்குவேன்[c]. உமது மக்கள் என் மக்கள்; உமது கடவுள் என் கடவுள்[d]” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வற்புறுத்தாதீர்’ என்பதற்கு ‘வேண்டிக்கொள்ளாதீர்,’ ‘வலியுறுத்தாதீர்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயில் சொல்லுக்குச் சொல், ‘உமக்குப் பின்னாலிருந்து திரும்பிப்போக’ என்று உள்ளது; இது உம்மைப் பின்தொடர்வதை விட்டுத் திரும்புவதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘நீர் எங்கே இரவைக் கழிக்கிறீரோ, அங்கே நானும் இரவைக் கழிப்பேன்.’
    reason: lexical_alternative
  - marker: d
    text: ‘உமது மக்கள் என் மக்கள்; உமது கடவுள் என் கடவுள்’ என்ற எபிரெயக் கூற்றுகளில் இணைப்புவினை இல்லை. எனவே அவற்றை நிகழ்காலமாகவோ எதிர்கால உறுதிமொழியாகவோ புரிந்துகொள்ளலாம்; தமிழும் இங்கு அந்தச் சுருக்கத்தையும் காலத் திறந்தநிலையையும் தக்கவைக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: תִּפְגְּעִי בִי
  choice: என்னை வற்புறுத்தாதீர்
  rationale: פגע + ב இங்கு ஒருவரை வலியுறுத்துதல், வேண்டிக்கொள்ளுதல் அல்லது தொடர்ந்து தூண்டுதல் என்ற பொருளைத் தருகிறது. ‘வற்புறுத்தாதீர்’ என்பது உடல்ரீதியான தாக்குதல் என்ற தவறான எண்ணத்தைத் தவிர்த்து, நகோமி தன்னைத் திரும்பிச் செல்லத் தூண்டுவதை நிறுத்துமாறு ரூத் கேட்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: לְעָזְבֵךְ
  choice: உம்மைவிட்டு விலகி
  rationale: עזב என்பதற்கு ‘விட்டுச் செல்லுதல்’ அல்லது ‘கைவிடுதல்’ என்று பொருள் வரலாம். இங்கு ‘விலகி’ என்பது உறவைக் கைவிடுதல் என்ற அளவுக்கு பொருளை மிகைப்படுத்தாமல், நகோமியைவிட்டுப் பிரிவதைக் குறிக்கிறது.
- source_word: לָשׁוּב מֵאַחֲרָיִךְ
  choice: உம்மைப் பின்தொடர்வதை விட்டுத் திரும்பிப்போகும்படி
  rationale: שׁוב என்பது திரும்புதல்; מֵאַחֲרָיִךְ என்பது சொல்லுக்குச் சொல் ‘உமக்குப் பின்னாலிருந்து’ என்று பொருள்பட்டு, இங்கு பின்தொடர்வதைக் குறிக்கும் மரபுத்தொடர். தேர்ந்தெடுத்த தமிழ் இரு கருத்துகளையும் இயல்பாகத் தக்கவைக்கிறது.
- source_word: כִּי
  choice: அடுத்த உறுதிமொழியே காரணமாக நேரடியாகத் தொடர்கிறது
  rationale: כִּי இங்கு ரூத்தின் வேண்டுகோளுக்கான காரணத்தை அறிமுகப்படுத்துகிறது. தமிழில் தனியாக ‘ஏனெனில்’ சேர்ப்பதைவிட, அடுத்த இணையான வாக்கியங்கள் காரணத்தைத் தெளிவாக வெளிப்படுத்துவதால் நேரடித் தொடர்ச்சி இயல்பாகவும் வலிமையாகவும் உள்ளது.
- source_word: אֶל אֲשֶׁר תֵּלְכִי אֵלֵךְ
  choice: நீர் எங்கே போகிறீரோ, அங்கே நானும் போவேன்
  rationale: இலக்கைச் சுட்டும் எபிரெய உறவுநிலை அமைப்பையும், ரூத்தின் உறுதியான இணைநடப்பையும், தமிழின் இயல்பான ‘எங்கே... அங்கே...’ இணை அமைப்பு பாதுகாக்கிறது.
- source_word: וּבַאֲשֶׁר תָּלִינִי אָלִין
  choice: நீர் எங்கே இரவு தங்குகிறீரோ, அங்கே நானும் இரவு தங்குவேன்
  rationale: לון பொதுவாக இரவைக் கழித்தல் அல்லது இரவு தங்குதல் என்பதைக் குறிக்கிறது. ‘இரவு தங்குதல்’ தற்காலிகத் தங்கலைத் தெளிவாக்கி, முந்தைய வாக்கியத்தின் இணைநடையைப் பாதுகாக்கிறது.
- source_word: עַמֵּךְ עַמִּי
  choice: உமது மக்கள் என் மக்கள்
  rationale: எபிரெயில் இணைப்புவினை இல்லாத சுருக்கமான கூற்று. தமிழிலும் இணைப்புவினையின்றி இயல்பாகக் கூற முடிவதால், நிகழ்காலமா எதிர்காலமா என்பதைத் தீர்மானிக்காமல் மூலத்தின் வலிமையும் தெளிவின்மையும் பாதுகாக்கப்படுகின்றன.
- source_word: וֵאלֹהַיִךְ אֱלֹהָי
  choice: உமது கடவுள் என் கடவுள்
  rationale: மூலத்தில் இணைப்புவினை இல்லாததும், இச்சூழலில் ஒருமைச் சுட்டு கொண்டதுமான அறிக்கை. தமிழ் வடிவம் அதன் சுருக்கத்தையும் ரூத்தின் விசுவாச அடையாளப்படுத்தலையும் காக்கிறது; பன்மைத் தெய்வங்களைக் குறிக்கும் பொருளைத் தேவையின்றி புகுத்துவதில்லை.
theological_decisions:
- issue: மக்கள் மற்றும் கடவுளோடு ரூத் தன்னை அடையாளப்படுத்தும் இணைப்புவினையற்ற இரு கூற்றுகளின் காலப்பொருள்
  choice: ‘உமது மக்கள் என் மக்கள்; உமது கடவுள் என் கடவுள்’ என்று இரண்டையும் இணைப்புவினையின்றி மொழிபெயர்த்தல்
  alternative: ‘உமது மக்கள் என் மக்களாக இருப்பார்கள்; உமது கடவுள் என் கடவுளாக இருப்பார்’ என்று எதிர்காலமாகவோ, ‘ஆவர்/ஆகிறார்’ என்று நிகழ்காலமாகவோ வெளிப்படையாகச் சேர்த்தல்
  rationale: எபிரெயில் இரு கூற்றுகளிலும் இணைப்புவினை இல்லை. தமிழிலும் இதே அமைப்பு இயல்பாக இருப்பதால், ரூத்தின் தற்போதைய அடையாள அறிக்கையும் வருங்கால உறுதிப்பாடும் இடையே உள்ள உண்மையான பொருள் நெருக்கத்தைத் தீர்த்துவிடாமல் பாதுகாக்க முடிகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட நேரடி உரை பயன்படுத்தப்பட்டுள்ளது. நகோமியை நோக்கிய ஒருமை மரியாதை வடிவங்களான ‘உம்மை/நீர்/உமது’ பயன்படுத்தப்பட்டுள்ளன. ‘எங்கே... அங்கே நானும்...’ என்ற இணை அமைப்பு மூலத்தின் கவித்துவமான உறுதிமொழி நடையைப் பாதுகாக்கிறது.
