base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/001.yaml
  text: It happened in the days when the judges judged that there was a famine in the land[c][b][a], and a man went from Bethlehem of Judah to sojourn in the fields of Moab—he and his wife and his two sons.
translation:
  language: ta
  text: நீதிபதிகள் நியாயம் வழங்கிய நாட்களில்[a], நாட்டில் பஞ்சம் ஏற்பட்டது. அப்போது யூதாவின் பெத்லெகேமிலிருந்து ஒரு மனிதன், தன் மனைவியுடனும் இரு மகன்களுடனும், மோவாபின் வயல்வெளிகளில்[c] தங்குவதற்காகச்[b] சென்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீதிபதிகள் ஆட்சி செய்த காலத்தில்.” எபிரெயத்தில் ‘நியாயம் வழங்குதல்’ என்ற ஒரே சொல்வேர் இருமுறை வருகிறது; சொல்லுக்குச் சொல், “நீதிபதிகள் நியாயம் வழங்கியபோது.”
    reason: lexical_alternative
  - marker: b
    text: இச்சொல் நிரந்தரமாகக் குடியேறுவதைக் கட்டாயமாகக் குறிக்காது; வெளியிடத்தவராக ஒரு காலம் வசிப்பதையும் குறிக்கலாம்.
    reason: cultural_note
  - marker: c
    text: அல்லது, “மோவாப் பிரதேசத்தில்.” சொல்லுக்குச் சொல், “மோவாபின் வயல்வெளிகளில்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ஏற்பட்டது / அப்போது
  rationale: முதல் וַיְהִי கதையின் தொடக்கத்தை அறிமுகப்படுத்துகிறது; தமிழில் தனியே ‘அது நடந்தது’ என்று கூறுவது இயல்பற்றதால் காலத் துணைவாக்கியத்துடன் இணைக்கப்பட்டுள்ளது. இரண்டாவது நிகழ்விலிருந்து அடுத்த நிகழ்வுக்குச் செல்லும் தொடர்பை ‘அப்போது’ இயல்பாகக் காட்டுகிறது.
- source_word: בִּימֵי
  choice: நாட்களில்
  rationale: יום என்பதன் காலத்தைக் குறிக்கும் எபிரெய மரபுத்தொடரை நெருக்கமாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: שְׁפֹט הַשֹּׁפְטִים
  choice: நீதித்தலைவர்கள் நீதி வழங்கிவந்த
  rationale: ‘நீதி’ என்ற சொல்வேரின் ஒலிப்பொருள் தொடர்பைத் தக்கவைத்து, நீதித்தீர்ப்பு மற்றும் தலைமை ஆட்சி ஆகிய இரண்டையும் உள்ளடக்கக்கூடிய எபிரெயச் சொல்லின் பரப்பை தேவையின்றிக் குறுக்கவில்லை.
- source_word: רָעָב
  choice: பஞ்சம்
  rationale: ஒரு பிரதேசத்தையே பாதிக்கும் கடுமையான உணவுப் பற்றாக்குறைக்கான இயல்பான, துல்லியமான தமிழ் சொல்.
- source_word: בָּאָרֶץ
  choice: நாட்டில்
  rationale: கதைச் சூழலில் யூதா/இஸ்ரவேல் நிலப்பகுதியைக் குறிக்கும் הארץ என்பதற்கு நவீன தமிழில் இயல்பான மொழிபெயர்ப்பு.
- source_word: אִישׁ
  choice: ஒரு மனிதன்
  rationale: பின்னர் எலிமெலேக்கு என அடையாளப்படுத்தப்படும் ஆண் நபரைக் குறிக்கும் ஒருமைச் சொல்லின் பாலினக் குறிப்பைப் பாதுகாக்கிறது.
- source_word: מִבֵּית לֶחֶם יְהוּדָה
  choice: யூதாவின் பெத்லெகேமிலிருந்து
  rationale: இடப்பெயரின் தொடர்பையும் புறப்பட்ட இடத்தையும் எபிரெய உரைக்கு நெருக்கமாகத் தருகிறது.
- source_word: לָגוּר
  choice: அந்நியனாகத் தற்காலிகமாக வாழ
  rationale: גור என்பது நிரந்தரக் குடியேற்றத்தைவிட, வெளியிடத்தவராக ஒரு காலம் வசிப்பதைச் சுட்டுவதால் இரு நுணுக்கங்களையும் வெளிப்படையாகத் தருகிறது.
- source_word: בִּשְׂדֵי מוֹאָב
  choice: மோவாபின் வயல்வெளிகளில்
  rationale: שָׂדֶה என்பதன் பன்மை வடிவத்திலுள்ள ‘வயல்வெளிகள்’ என்ற concrete உருவகத்தைப் பாதுகாக்கிறது; சூழலில் அது மோவாப் பிரதேசத்தையும் குறிக்கலாம்.
- source_word: הוּא וְאִשְׁתּוֹ וּשְׁנֵי בָנָיו
  choice: தன் மனைவியுடனும் இரண்டு மகன்களுடனும்
  rationale: அவனுடன் சென்ற குடும்ப உறுப்பினர்கள் அனைவரையும் தெளிவாகக் குறிப்பிட்டு, தமிழில் இயல்பான உடனிகழ்ச்சி அமைப்பைப் பயன்படுத்துகிறது.
theological_decisions:
- issue: שׁפט என்பதன் நீதித்தீர்ப்பு மற்றும் ஆட்சி சார்ந்த பொருள் பரப்பு
  choice: நீதித்தலைவர்கள் நீதி வழங்கிவந்த
  alternative: நீதித்தலைவர்கள் ஆட்சி செய்த
  rationale: மூலத்தின் சொல்வேர் மீளுருவாக்கத்தை முடிந்தவரைத் தக்கவைத்து, அவர்களின் பங்கை வெறும் அரசாட்சியாக மட்டும் தீர்மானிக்காமல் விடுகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘நீதித்தலைவர்கள்’ என்பது வரலாற்றுப் பதவியைப் புரிந்துகொள்ள உதவுகிறது; ‘நீதி வழங்கிவந்த’ என்பது மூலத்தின் சொல் மீளுருவாக்கத்தை ஓரளவு பாதுகாக்கிறது. ‘அந்நியனாகத் தற்காலிகமாக வாழ’ என்பது சற்றே விரிவானதாயினும் גור என்பதன் சமூக மற்றும் கால நுணுக்கங்களைத் தெளிவாகக் கொண்டுவருகிறது.
