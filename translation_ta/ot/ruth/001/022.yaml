base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/022.yaml
  text: So Naomi returned[a], and Ruth the Moabite, her daughter-in-law, with her, who returned from the fields of Moab. And they came to Bethlehem at the beginning of the barley harvest.
translation:
  language: ta
  text: நகோமி திரும்பிவந்தாள்; அவளுடைய மருமகளான மோவாபியரான ரூத்தும் அவளோடு மோவாபின் வயல்வெளிகளிலிருந்து[a] திரும்பிவந்தாள். அவர்கள் வாற்கோதுமை அறுவடையின் தொடக்கத்தில் பெத்லெகேமுக்கு வந்து சேர்ந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இயல்பான பொருளில், ‘மோவாப் நாட்டிலிருந்து.’ எபிரெய மொழியில், ‘மோவாபின் வயல்வெளிகளிலிருந்து’ என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּשָׁב
  choice: திரும்பிவந்தாள்
  rationale: שוב என்பதன் ‘திரும்புதல்’ என்ற அடிப்படைப் பொருளையும், முந்தைய நிகழ்வுடன் உள்ள கதைத்தொடர்பையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: הַמּוֹאֲבִיָּה
  choice: மோவாபியப் பெண்
  rationale: பெண்பால் இன/நாட்டின அடையாளத்தைத் தெளிவாகவும் இயல்பான நவீனத் தமிழிலும் வெளிப்படுத்துகிறது; கதையில் ரூத்தின் மோவாபிய அடையாளத்துக்குக் கொடுக்கப்படும் முக்கியத்துவத்தையும் காக்கிறது.
- source_word: כַלָּתָהּ
  choice: அவளுடைய மருமகள்
  rationale: இச்சூழலில் மகனின் மனைவியைக் குறிக்கும் உறவுமுறைச் சொல்லுக்கு இயல்பான தமிழ் இணை.
- source_word: עִמָּהּ
  choice: அவளோடு
  rationale: ரூத் நகோமியுடன் வந்ததைச் சுருக்கமாகவும் நேரடியாகவும் குறிக்கிறது.
- source_word: הַשָּׁבָה
  choice: திரும்பிவந்தாள்
  rationale: பெண்பால் ஒருமைப் பங்கேற்புச் சொல் அருகிலுள்ள ரூத்தைக் குறிப்பதாக வாசித்து, அவளுக்கும் שוב என்ற ‘திரும்புதல்’ சொல்லையே பயன்படுத்தும் எபிரெய உரையின் குறிப்பிடத்தக்க சொல்லாட்சியைப் பாதுகாக்கிறது.
- source_word: מִשְּׂדֵי מוֹאָב
  choice: மோவாபின் வயல்வெளிகளிலிருந்து
  rationale: שׂדה என்பதன் நேரடியான ‘வயல்/வயல்வெளி’ உருவகத்தைப் பாதுகாக்கிறது; பரந்த பொருளான ‘மோவாப் நாடு’ அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְהֵמָּה בָּאוּ
  choice: அவர்கள் ... வந்து சேர்ந்தார்கள்
  rationale: தனிப்பட்ட பன்மைப் பெயர்ச்சொல்லின் மெலிதான வலியுறுத்தலை ‘அவர்கள்’ என்பதால் காத்து, இலக்கை அடைந்த இயக்கத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: בֵּית לֶחֶם
  choice: பெத்லெகேம்
  rationale: இடப்பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: בִּתְחִלַּת
  choice: தொடக்கத்தில்
  rationale: காலப்பகுதியின் ஆரம்பத்தைக் குறிக்கும் கட்டமைப்புக்கு நேரடியான, இயல்பான இணை.
- source_word: קְצִיר שְׂעֹרִים
  choice: வாற்கோதுமை அறுவடை
  rationale: ‘வாற்கோதுமையின் அறுவடை’ என்ற எபிரெய இணைப்பைத் தெளிவான தமிழ் பெயர்த்தொடராக வழங்குகிறது.
theological_decisions:
- issue: ரூத்தை ‘திரும்பிவந்தவள்’ என்று விவரிக்கும் எபிரெய சொல்லாட்சி
  choice: ரூத்துக்கும் ‘திரும்பிவந்தாள்’ என்பதையே பயன்படுத்துதல்
  alternative: ‘நகோமியுடன் வந்தாள்’ அல்லது ‘உடன் சென்றாள்’ என்று சீராக்குதல்
  rationale: ரூத் முன்பு யூதாவில் வாழ்ந்ததாகக் கதை கூறாதபோதும், எபிரெய உரை அவளைக் குறிக்க שוב என்ற ‘திரும்புதல்’ சொல்லைப் பயன்படுத்துகிறது. அந்தக் கதையியல் பதற்றத்தை விளக்கித் தீர்க்காமல் மொழிபெயர்ப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. நீண்ட எபிரெய வாக்கியம் வாசிப்புத் தெளிவுக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டாலும், கருத்துகளின் வரிசையும் மீண்டும் வரும் ‘திரும்புதல்’ சொல்லாட்சியும் பாதுகாக்கப்பட்டுள்ளன.
