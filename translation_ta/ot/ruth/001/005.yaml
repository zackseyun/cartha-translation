revisions:
- from: பின்னர் மக்லோனும் கிலியோனுமாகிய அவர்கள் இருவரும் இறந்துபோனார்கள். அந்தப் பெண் தன் இரண்டு பிள்ளைகளையும்[a] தன் கணவனையும் இழந்தவளாக விடப்பட்டாள்.
  to: பின்னர், மக்லோனும் கிலியோனும் ஆகிய இருவரும் கூட இறந்தார்கள். அந்தப் பெண் தன் இரண்டு பிள்ளைகளையும்[a] தன் கணவனையும் இழந்து தனியாக மீதமிருந்தாள்.
  rationale: The revision removes an unnatural redundancy, explicitly represents the additive force of גַם, and uses idiomatic Tamil to convey that the woman remained bereft of her children and husband. The lexical ambiguity of יְלָדִים is retained in the text and documented in the footnote.
