base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/005.yaml
  text: Then both of them also died[a], Mahlon and Chilion, and the woman was left without her two children and without her husband.
translation:
  language: ta
  text: பின்னர், மக்லோனும் கிலியோனும் ஆகிய இருவரும் கூட இறந்தார்கள். அந்தப் பெண் தன் இரண்டு பிள்ளைகளையும்[a] தன் கணவனையும் இழந்து தனியாக மீதமிருந்தாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தன் இரண்டு மகன்களையும்.’ எபிரெயத்தில் ‘தன் இரண்டு பிள்ளைகளையும்’ என்று உள்ளது; பயன்படுத்தப்பட்டுள்ள சொல் பொதுவாகப் பிள்ளைகள் அல்லது சந்ததியினரைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמ֥וּתוּ
  choice: பின்னர் ... இறந்துபோனார்கள்
  rationale: மூலத்தின் wayyiqtol வடிவம் கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது. இயல்பான தமிழ் கதைநடையில் காலவரிசையைத் தெளிவாக்க ‘பின்னர்’ என்பதும், மரண நிகழ்வைக் குறிக்க ‘இறந்துபோனார்கள்’ என்பதும் பயன்படுத்தப்பட்டன.
- source_word: גַם
  choice: -உம் ... -உம் / இருவரும்
  rationale: முந்தைய மரணத்துடன் இவ்விரு மரணங்களும் சேர்ந்தன என்ற சேர்க்கைப் பொருளைத் தமிழ் இணைப்பும் ‘இருவரும்’ என்ற வலியுறுத்தலும் சூழலுக்கேற்றவாறு வெளிப்படுத்துகின்றன.
- source_word: שְׁנֵיהֶם
  choice: அவர்கள் இருவரும்
  rationale: இரு மகன்களும் ஒருசேரக் குறிப்பிடப்படுவதைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: מַחְלוֹן וְכִלְיוֹן
  choice: மக்லோன், கிலியோன்
  rationale: எபிரெயத் தனிப்பெயர்கள் நவீனத் தமிழில் எளிதாக வாசிக்கக்கூடிய வகையில் ஒலிபெயர்க்கப்பட்டுள்ளன.
- source_word: וַתִּשָּׁאֵר
  choice: இழந்தவளாக விடப்பட்டாள்
  rationale: שׁאר என்பதன் ‘எஞ்சியிருத்தல்/விடப்பட்டிருத்தல்’ என்ற பொருளையும், இச்சூழலில் ஏற்பட்ட இழப்பு நிலையையும் இயல்பான தமிழில் இணைத்துக் காட்டுகிறது.
- source_word: הָאִשָּׁה
  choice: அந்தப் பெண்
  rationale: மூலம் நகோமியின் பெயரையோ ‘மனைவி’ என்ற உறவுப்பெயரையோ பயன்படுத்தாமல் ‘அந்தப் பெண்’ என்றே கூறுவதால் அதே கதைசொல்லல் வடிவம் பாதுகாக்கப்பட்டது.
- source_word: מִשְּׁנֵי יְלָדֶיהָ
  choice: தன் இரண்டு பிள்ளைகளையும்
  rationale: முன்னிடைச்சொல் இங்கு பிரிவு அல்லது இழப்பைக் குறிக்கிறது. יְלָדִים என்பது பொதுவாகப் பிள்ளைகள் அல்லது சந்ததியினர் என்று பொருள்படக்கூடியதால், வயதுவந்த மகன்கள் குறிக்கப்பட்டாலும் மூலத்தின் பரந்த சொற்பொருளைப் பாதுகாக்க ‘பிள்ளைகள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: וּמֵאִישָׁהּ
  choice: தன் கணவனையும்
  rationale: உடைமைப் பின்னொட்டுடன் வரும் אִישׁ இச்சூழலில் ‘கணவன்’ என்று பொருள்படுகிறது; மீண்டும் வரும் முன்னிடைச்சொல்லின் இழப்புப் பொருள் ‘இழந்தவளாக’ என்பதுடன் இயல்பாகத் தெரிவிக்கப்படுகிறது.
