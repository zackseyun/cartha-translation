source:
  edition: WLC
  text: וַ/תֹּ֗אמֶר הִנֵּה֙ שָׁ֣בָה יְבִמְתֵּ֔/ךְ אֶל עַמָּ֖/הּ וְ/אֶל אֱלֹהֶ֑י/הָ שׁ֖וּבִי אַחֲרֵ֥י יְבִמְתֵּֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/015.yaml
  text: And she said[a], “Look, your sister-in-law has gone back to her people and to her gods[b]. Go back after your sister-in-law.”
translation:
  language: ta
  text: 'அவள் சொன்னாள்[a]: “இதோ, உன் மைத்துனி தன் மக்களிடமும் தன் தெய்வங்களிடமும்[b] திரும்பிப் போய்விட்டாள். உன் மைத்துனியைப் பின்பற்றி திரும்பிப் போ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “திரும்பியிருக்கிறாள்.” எபிரெயத்தில் שוב என்ற வினைச்சொல் இந்த வசனத்தில் ஓர்பாளின் செயலுக்கும் ரூத்துக்கான நகோமியின் கட்டளைக்கும் மீண்டும் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “அவளுடைய தெய்வங்களிடம்.” சிலர் இதை “அவளுடைய தெய்வத்திடம்” என மொழிபெயர்க்கின்றனர்; ஆனால் இங்குள்ள பன்மை மோவாபின் தெய்வங்களைக் குறிக்கிறது என்பது அதிகம் சாத்தியம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: அவள் சொன்னாள்
  rationale: எபிரெயக் கதைநடையின் வழக்கமான தொடர்ச்சியை இயல்பான நவீனத் தமிழில் தருகிறது; இங்கு பேசுகிறவர் நகோமி என்பது சூழலால் தெளிவாகிறது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: நடந்துள்ள நிலைமையின் மீது ரூத்தின் கவனத்தைத் திருப்பும் சுட்டிடைச்சொல்லின் வலிமையைச் சுருக்கமாகவும் dignified-ஆகவும் காக்கிறது.
- source_word: שָׁבָה
  choice: திரும்பிப் போய்விட்டாள்
  rationale: שוב என்ற வினையின் நிறைவுற்ற செயலை இயல்பான தமிழில் தெரிவிக்கிறது; பின்னர் வரும் அதே வேர்ச்சொல்லுடனான தொடர்பையும் காக்கிறது.
- source_word: יְבִמְתֵּךְ
  choice: உன் மைத்துனி
  rationale: லேவிரேட் குடும்ப உறவைக் குறிக்கும் சொல்லுக்கு இச்சூழலில் புரிந்துகொள்ள எளிதான, இயல்பான தமிழ் உறவுமுறைச் சொல்; இரு இடங்களிலும் ஒரேபோல் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: אֶל עַמָּהּ
  choice: தன் மக்களிடம்
  rationale: உடனடி குடும்பத்தை மட்டும் அல்லாமல் அவளுடைய இன-சமூக மக்களைக் குறிக்கும் עַם என்பதன் சூழல்சார் பொருளைத் தருகிறது.
- source_word: וְאֶל אֱלֹהֶיהָ
  choice: தன் தெய்வங்களிடம்
  rationale: மோவாபின் வழிபாட்டுத் தெய்வங்களைக் குறிக்கும் வாய்ப்பே அதிகம் என்பதால் பன்மை காக்கப்படுகிறது; இஸ்ரவேலின் தேவனைக் குறிக்கும் ஒருமைப் பொருள் இங்கு திணிக்கப்படவில்லை.
- source_word: שׁוּבִי
  choice: திரும்பிப் போ
  rationale: ரூத்திடம் கூறப்படும் பெண்பால் ஒருமை கட்டளையின் நேரடியான வலிமையைத் தருவதோடு, முன் வந்த שָׁבָה என்பதன் மீளுரைப்பையும் தமிழில் பிரதிபலிக்கிறது.
- source_word: אַחֲרֵי
  choice: பின்தொடர்ந்து
  rationale: ஒருவரின் பின்னால் சென்று அவர் எடுத்த பாதையைப் பின்பற்றும் படிமத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: மோவாபிய வழிபாட்டைக் குறிக்கும் אֱלֹהֶיהָ என்பதன் எண்
  choice: தன் தெய்வங்களிடம்
  alternative: தன் தெய்வத்திடம்
  rationale: אֱלֹהִים சில சூழல்களில் ஒருமைப் பொருளில் வரலாம்; ஆனால் இங்கு மோவாபிய மக்களிடமும் அவர்களுடைய வழிபாட்டிடமும் திரும்புவதை இணைத்துக் கூறுவதால் பன்மைப் பொருள் அதிகம் பொருந்துகிறது. இவ்வாறு மொழிபெயர்ப்பது உடன்படிக்கையின் தேவனான கர்த்தரை இங்கு குறிப்பிடுவதாகத் தவறாக உணர்த்துவதையும் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிதில் புரியும், மரியாதைமிக்க நேரடி உரை. שוב என்ற வேர்ச்சொல்லின் இருமுறை பயன்பாடு ‘திரும்பிப் போய்விட்டாள் / திரும்பிப் போ’ எனத் தெளிவாகப் பேணப்பட்டுள்ளது. தேவையற்ற விளக்கச் சேர்க்கைகள் தவிர்க்கப்பட்டுள்ளன.
