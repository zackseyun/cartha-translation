  text: Then they lifted up their voices and wept again. Orpah kissed her mother-in-law[a], but Ruth clung to her.
translation:
  language: ta
  text: பின்பு அவர்கள் உரத்த குரலெழுப்பி, மீண்டும் அழுதார்கள். ஓர்பாள் தன் மாமியாரை முத்தமிட்டாள்; ஆனால்[a] ரூத் அவளைப் பற்றிக்கொண்டாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேய இணைப்புச்சொல்லை ‘ஆனால்’ என்பதற்குப் பதிலாக ‘மற்றும்’ என்றும் மொழிபெயர்க்கலாம். ஆனால், ஓர்பாளின் முத்தத்திற்கும் ரூத்தின் தொடர்ந்த பற்றுதலுக்கும் இடையிலான வேறுபாட்டைச் சூழல் காட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשֶּׂנָה קוֹלָן
  choice: அவர்கள் உரத்த குரலெடுத்து
  rationale: ‘தங்கள் குரலை உயர்த்தினார்கள்’ என்ற எபிரேய மரபுத்தொடர், கேட்கும்படி உரக்கப் புலம்பியதைச் சுட்டுகிறது; ‘உரத்த குரலெடுத்து’ என்பது தமிழில் இயல்பாகவும் சுருக்கமாகவும் உள்ளது.
- source_word: וַתִּבְכֶּינָה
  choice: அழுதார்கள்
  rationale: வினைச்சொல் அழுதல் அல்லது கண்ணீர்விடுதலைக் குறிக்கிறது; நவீனத் தமிழில் ‘அழுதார்கள்’ நேரடியான, இயல்பான மொழிபெயர்ப்பு.
- source_word: עוֹד
  choice: மீண்டும்
  rationale: முந்தைய அழுகையைத் தொடர்ந்து நிகழும் மறுபடியான செயலை இச்சூழலில் குறிக்கிறது.
- source_word: וַתִּשַּׁק
  choice: முத்தமிட்டாள்
  rationale: எபிரேய வினைச்சொல்லின் நேரடியான பொருள் ‘முத்தமிடுதல்’; விரிவாக்கம் தேவையில்லை.
- source_word: לַחֲמוֹתָהּ
  choice: தன் மாமியாரை
  rationale: பெயர்ச்சொல் குறிப்பாக ‘மாமியார்’ என்பதைக் குறிக்கிறது; மூன்றாம் நபர் பெண்பால் பின்னொட்டு ஒர்பாளைக் குறிப்பதால், தமிழில் ‘தன் மாமியாரை’ இயல்பும் தெளிவும் அளிக்கிறது.
- source_word: דָּבְקָה בָּהּ
  choice: அவளைப் பற்றிக்கொண்டாள்
  rationale: דבק நெருக்கமாகப் பற்றியிருத்தல் அல்லது பிரியாமல் ஒட்டியிருத்தலைக் குறிக்கிறது. ‘பற்றிக்கொண்டாள்’ என்பது உணர்வுபூர்வமான உறுதியான இணைப்பைப் பாதுகாக்கிறது; தேவையற்ற உடன்படிக்கைச் சார்ந்த கருத்தைச் சேர்ப்பதில்லை.
- source_word: וְ
  choice: ஆனால்
  rationale: இணைப்புச்சொல் அடிப்படையில் ‘மற்றும்/உம்’ எனப் பொருள்படலாம்; இங்கு ஒர்பாளின் முத்தத்திற்கும் ரூத்தின் தொடர்ந்த பற்றுதலுக்கும் இடையிலான சூழல்சார் முரண்பாட்டை ‘ஆனால்’ வெளிப்படுத்துகிறது. உண்மையான மொழியியல் மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: עָרְפָּה
  choice: ஒர்பாள்
  rationale: தனிப்பெயர் நவீனத் தமிழ் ஒலிபெயர்ப்பு மரபுக்கு ஏற்றவாறு வழங்கப்படுகிறது.
- source_word: רוּת
  choice: ரூத்
  rationale: தனிப்பெயர் எபிரேய உச்சரிப்பை அணுகும் வகையில் தமிழில் ஒலிபெயர்க்கப்படுகிறது.
