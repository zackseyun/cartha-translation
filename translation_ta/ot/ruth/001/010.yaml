id: RUT.1.10
reference: Ruth 1:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/תֹּאמַ֖רְנָה לָּ֑/הּ כִּי אִתָּ֥/ךְ נָשׁ֖וּב לְ/עַמֵּֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/010.yaml
  text: But they said to her[a], “No, we will return with you to your people.”
translation:
  language: ta
  text: ஆனால் அவர்கள் அவளிடம்[a], “இல்லை, உங்களோடு உங்கள் மக்களிடம் திரும்பிச் செல்வோம்” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொல்லுக்குச் சொல் நெருக்கமாக: “ஏனெனில், உங்களோடு உங்கள் மக்களிடம் திரும்புவோம்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמַרְנָה
  choice: ஆனால் அவர்கள் … என்றார்கள்
  rationale: வாவ் தொடர் கதையை முன்னெடுத்தாலும், உடனுள்ள சூழலில் நகோமியின் வற்புறுத்தலுக்கு அவர்கள் எதிராகப் பதிலளிப்பதால் ‘ஆனால்’ என்பது இயல்பாக அந்த முரண்பாட்டை வெளிப்படுத்துகிறது. பெண்பால் பன்மை வினை வடிவம் தமிழில் சூழ்நிலையால் அறியப்படுகிறது.
- source_word: לָּהּ
  choice: அவளிடம்
  rationale: לְ முன்னொட்டுடன் சேர்ந்த மூன்றாம் நபர் பெண்பால் ஒருமை பின்னொட்டு, நகோமியை நோக்கிய மறைமுகச் செயப்படுபொருளைக் குறிக்கிறது.
- source_word: כִּי
  choice: இல்லை
  rationale: כִּי பொதுவாக ‘ஏனெனில்’, ‘உண்மையாகவே’ போன்ற பொருள்களைக் கொள்ளலாம். இங்கு நகோமியின் வேண்டுகோளை மறுத்து வலியுறுத்தும் நேரடி பதிலாக வருவதால், இயல்பான தமிழில் ‘இல்லை’ என மொழிபெயர்க்கப்பட்டது; அதன் நேரடியான இணைப்புப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: אִתָּךְ
  choice: உங்களோடு
  rationale: இரண்டாம் நபர் பெண்பால் ஒருமையுடன் வரும் முன்னிடைச்சொல் நகோமியுடன் சேர்ந்துசெல்லுதலைக் குறிக்கிறது. மாமியாரிடம் மரியாதையுடன் பேசும் நவீன தமிழுக்கு ‘உங்களோடு’ இயல்பானது.
- source_word: נָשׁוּב
  choice: திரும்பிச் செல்வோம்
  rationale: שׁוּב என்பதன் ‘திரும்புதல்’ என்ற அடிப்படைப் பொருளையும் ரூத் 1-ல் மீண்டும் மீண்டும் வரும் திரும்புதல் என்ற கருத்தையும் காக்கிறது; இலக்கை நோக்கிய பயணத்தைத் தமிழில் இயல்பாகச் சொல்ல ‘திரும்பிச் செல்வோம்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: לְעַמֵּךְ
  choice: உங்கள் மக்களிடம்
  rationale: עַם இங்கு நெருங்கிய உறவினரை மட்டும் அல்லாமல் நகோமியின் இனத்தையும் சமூகத்தையும் குறிக்கிறது; ஆகவே ‘உங்கள் மக்கள்’ சூழலுக்கு ஏற்றது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. நகோமியை நோக்கிய இரண்டாம் நபர் பெண்பால் ஒருமை வடிவம், தமிழின் மரியாதைப் பேச்சுக்கு ஏற்ப ‘உங்கள்/உங்களோடு’ என வழங்கப்பட்டுள்ளது.
