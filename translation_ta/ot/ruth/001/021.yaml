  text: אֲנִי֙ מְלֵאָ֣ה הָלַ֔כְתִּי וְ/רֵיקָ֖ם הֱשִׁיבַ֣/נִי יְהוָ֑ה לָ֣/מָּה תִקְרֶ֤אנָה לִ/י֙ נָעֳמִ֔י וַֽ/יהוָה֙ עָ֣נָה בִ֔/י וְ/שַׁדַּ֖י הֵ֥רַֽע לִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/021.yaml
  text: I went away full[a], but Yahweh has brought me back empty. Why do you call me Naomi[b], when Yahweh has testified against me and the Almighty has brought calamity on me?
translation:
  language: ta
  text: நான் நிறைவுடன் புறப்பட்டுச் சென்றேன்; ஆனால் யாவே என்னை வெறுமையாகத் திரும்பிவரச் செய்தார். நீங்கள் ஏன் என்னை நகோமி என்று அழைக்கிறீர்கள்? யாவே எனக்கு எதிராகச் சாட்சியளித்திருக்கும்போதும்[a], சர்வவல்லவர் என்மேல் பேரிடரைக் கொண்டுவந்திருக்கும்போதும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எனக்கு எதிராகச் சாட்சி பகர்ந்திருக்கிறார்.” எபிரெய வினைச்சொல் ஒருவருக்கு எதிராகப் பதிலளித்தல் அல்லது சாட்சியளித்தல் என்ற பொருளைக் கொண்டிருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “எனக்குத் தீங்கு செய்திருக்கிறார்.” எபிரெயச் சொற்றொடர் நகோமிக்கு நேர்ந்த பேரிடர் அல்லது துன்பத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְלֵאָה
  choice: நிறைவுடன்
  rationale: நகோமியின் முந்தைய நிலையைச் சுட்டி, பின்னுள்ள ‘வெறுமையாக’ என்பதுடன் தெளிவான எதிர்மறை இணையைப் பேணுகிறது.
- source_word: הָלַכְתִּי
  choice: புறப்பட்டுச் சென்றேன்
  rationale: சென்றதையும் ஊரைவிட்டுப் புறப்பட்டதையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְרֵיקָם
  choice: வெறுமையாக
  rationale: ‘நிறைவுடன்’ என்பதற்கான கூர்மையான எதிர்மறையைப் பேணுகிறது; ‘வெறுங்கையுடன்’ என்று பொருளைச் சுருக்கவில்லை.
- source_word: הֱשִׁיבַנִי
  choice: என்னைத் திரும்பிவரச் செய்தார்
  rationale: שוב என்பதன் ஹிஃபில் வடிவிலுள்ள காரணவினைப் பொருளையும் இறைச் செயலாற்றலையும் நேரடியாகப் பேணுகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: לָמָּה תִקְרֶאנָה לִי נָעֳמִי
  choice: நீங்கள் ஏன் என்னை நகோமி என்று அழைக்கிறீர்கள்?
  rationale: பெத்லகேமின் பெண்களிடம் கேட்கப்படும் நேரடியான வினாவை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: נָעֳמִי
  choice: நகோமி
  rationale: தனிப்பெயரை ஒலிபெயர்க்கிறது; அதன் ‘இனிமை/மகிழ்ச்சி’ சார்ந்த பொருளை முதன்மை உரைக்குள் விளக்கமாகச் சேர்க்கவில்லை.
- source_word: עָנָה בִי
  choice: எனக்கு எதிராகச் சாட்சியளித்திருக்கிறார்
  rationale: இந்தக் கட்டமைப்பில் உள்ள நீதிமன்றச் சார்ந்த ‘எதிராகப் பதிலளித்தல்/சாட்சியளித்தல்’ என்ற சாத்தியத்தைப் பேணி, அடுத்த பேரிடர் கூற்றுடன் ஒன்றாக்காமல் வைக்கிறது.
- source_word: שַׁדַּי
  choice: சர்வவல்லவர்
  rationale: தெய்வீகப் பட்டத்தின் பொருளை இயல்பாக மொழிபெயர்க்கிறது.
- source_word: הֵרַע לִי
  choice: என்மேல் பேரிடரைக் கொண்டுவந்திருக்கிறார்
  rationale: தீங்கோ துன்பமோ ஏற்படுத்தியதைக் குறிக்கும் காரணவினைப் பொருளைப் பேணுகிறது; கடவுள் ஒழுக்கத் தீமை செய்தார் எனத் தமிழில் தவறாகத் தொனிக்கக்கூடிய சொல்லாக்கத்தைத் தவிர்க்கிறது.
theological_decisions:
- issue: நகோமியின் துன்பத்தில் கடவுளின் செயலாற்றலை மொழிபெயர்த்தல்
  choice: ‘யெகோவா எனக்கு எதிராகச் சாட்சியளித்திருக்கிறார்’ என்றும் ‘சர்வவல்லவர் என்மேல் பேரிடரைக் கொண்டுவந்திருக்கிறார்’ என்றும் வலுவான இறைச் செயலாற்றலைப் பேணுதல்
  alternative: ‘பேரிடர் என்மேல் வர அனுமதித்தார்’ என்று மென்மைப்படுத்துதல்; அல்லது עָנָה என்பதை ‘என்னைத் துன்புறுத்தினார்’ என்று கொள்ளுதல்
  rationale: எபிரெய உரை நகோமியின் கசப்பான அனுபவத்தை நேரடியாக யெகோவாவுக்கும் சர்வவல்லவருக்கும் உரிய செயலாகக் கூறுகிறது. அந்த இறையியல் பதற்றத்தை மொழிபெயர்ப்பு மென்மைப்படுத்தக் கூடாது; அதேவேளை הֵרַע என்பதை ஒழுக்கத் தீமை எனத் தவறாகப் புரியாதவாறு ‘பேரிடரைக் கொண்டுவந்தார்’ என்று தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிதில் புரியும் அதேவேளை கண்ணியமான நடை. ‘நிறைவுடன்/வெறுமையாக’ என்ற எதிர்மறை இணையும், நகோமியின் கூற்றிலுள்ள வலுவான இறைச் செயலாற்றலும் பேணப்பட்டுள்ளன. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடப்பட்டுள்ளன.
