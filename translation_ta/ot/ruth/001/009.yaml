base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/009.yaml
  text: May Yahweh grant that you find rest[a], each of you in the house of her husband." Then she kissed them, and they lifted up their voices and wept.
translation:
  language: ta
  text: “நீங்கள் ஒவ்வொருவரும் தத்தம் கணவனின் வீட்டில் இளைப்பாறுதலைக்[a] கண்டடைய யாவே அருள்வாராக!” அவள் அவர்களை முத்தமிட்டாள். அவர்கள் குரலெழுப்பி அழுதார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பாதுகாப்பை” அல்லது “நிலையான வாழ்வை.” இங்கே “இளைப்பாறுதல்” என்பது கணவனின் வீட்டில் கிடைக்கும் அமைதியும் நிலையான பாதுகாப்பும் கொண்ட வாழ்வைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתֵּן יְהוָה
  choice: யாவே அருள்வாராக
  rationale: நகோமியின் ஆசீர்வாத வேண்டுதலை இயல்பான தமிழில் விருப்பவினை வடிவில் வெளிப்படுத்துகிறது; இறைபெயரையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: וּמְצֶאןָ
  choice: கண்டடைய
  rationale: முந்தைய வேண்டுதலுடன் தொடரும் வினையைச் சுருக்கமான, இயல்பான தமிழில் தருகிறது.
- source_word: מְנוּחָה
  choice: இளைப்பாறுதல்
  rationale: எபிரெயச் சொல்லின் அடிப்படைப் பொருளான ஓய்வு/அமைதியைப் பாதுகாக்கிறது; இச்சூழலில் மறுமணத்தின் வழியாகக் கிடைக்கும் நிலையான பாதுகாப்பையும் சுட்டுகிறது.
- source_word: אִשָּׁה בֵּית אִישָׁהּ
  choice: நீங்கள் ஒவ்வொருவரும் தத்தம் கணவனின் வீட்டில்
  rationale: இரு பெண்களையும் தனித்தனியாகக் குறிக்கும் பகிர்ந்தளிப்பு பொருளைத் தெளிவாக்குகிறது; எதிர்கால கணவனை நோக்கிய சூழற்பொருளைச் செயற்கையாக விரிவுபடுத்தாமல் விடுகிறது.
- source_word: וַתִּשַּׁק לָהֶן
  choice: அவள் அவர்களை முத்தமிட்டாள்
  rationale: எளிய எபிரெயக் கதைநடையைத் தெளிவான நவீன தமிழில் தருகிறது.
- source_word: וַתִּשֶּׂאנָה קוֹלָן וַתִּבְכֶּינָה
  choice: அவர்கள் உரக்க அழுதார்கள்
  rationale: ‘தங்கள் குரலை உயர்த்தி அழுதார்கள்’ என்ற எபிரெய மரபுத்தொடரின் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைபெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் உள்ள உடன்படிக்கைப் பெயரைப் பொதுப்பட்டமாக மாற்றாமல், தமிழ் ஒலிப்பெயர்ப்பில் நேரடியாகப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரமான தமிழில், கண்ணியமான எளிய கதைநடை பயன்படுத்தப்பட்டது. எபிரெய ஆசீர்வாத வடிவம் ‘அருள்வாராக’ எனவும், உணர்ச்சிமிக்க அழுகை இயல்பான தமிழ் மரபில் ‘உரக்க அழுதார்கள்’ எனவும் தரப்பட்டது.
