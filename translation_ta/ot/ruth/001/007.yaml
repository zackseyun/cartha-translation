    issue: ‘அவளுடைய மருமகள்கள் இருவரும் அவளோடு சென்றார்கள்’ என்ற வாக்கியம், பின்னர் வரும் ‘அவர்கள்’ என்பதன் உள்ளடக்கத்தைத் தெளிவிழக்கச் செய்கிறது.
    rationale: וַתֵּלַכְנָה என்பது பெண்பால் பன்மை; நகோமியும் அவளுடைய இரு மருமகள்களும் வழியில் சென்றனர் என்பதே பொருள். தமிழில் நகோமியை வெளிப்படையாக இணைப்பது மூலத்தின் செயற்பாட்டாளர்களைத் துல்லியமாகக் காக்கும்.
