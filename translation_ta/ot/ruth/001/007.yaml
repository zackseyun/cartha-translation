  text: וַ/תֵּצֵ֗א מִן הַ/מָּקוֹם֙ אֲשֶׁ֣ר הָיְתָה שָׁ֔מָּ/ה וּ/שְׁתֵּ֥י כַלֹּתֶ֖י/הָ עִמָּ֑/הּ וַ/תֵּלַ֣כְנָה בַ/דֶּ֔רֶךְ לָ/שׁ֖וּב אֶל אֶ֥רֶץ יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/007.yaml
  text: So she went out from the place where she had been[a], and her two daughters-in-law with her, and they went on the way to return to the land of Judah.
translation:
  language: ta
  text: அவள் தான் தங்கியிருந்த இடத்திலிருந்து புறப்பட்டாள்[a]. அவளும் அவளுடைய இரு மருமகள்களும் யூதா நாட்டிற்குத் திரும்புவதற்காக வழியில் சென்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இன்னும் சொற்சொல்லாக, ‘வெளியே சென்றாள்.’ எபிரெய வினைச்சொல்லின் அடிப்படைப் பொருள் ‘வெளியே செல்லுதல்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּצֵא
  choice: புறப்பட்டாள்
  rationale: יצא என்பதன் அடிப்படை இயக்கப் பொருளையும், முந்தைய நிகழ்வைத் தொடர்ந்து கதை நகர்வதையும் இயல்பான தமிழில் தெரிவிக்கிறது; ‘விட்டுச் சென்றாள்’ என்பதைவிட மூலத்தின் ‘வெளியேறுதல்/புறப்படுதல்’ உணர்வை நெருக்கமாகக் காக்கிறது.
- source_word: מִן־הַמָּקוֹם אֲשֶׁר הָיְתָה שָׁמָּה
  choice: தான் தங்கியிருந்த இடத்திலிருந்து
  rationale: உறவுப்பெயர் வாக்கியத்தை இயல்பான தமிழில் அமைத்து, நகோமி முன்பு அங்கே தங்கியிருந்த நிலையைத் தெளிவாகக் காட்டுகிறது.
- source_word: וּשְׁתֵּי כַלֹּתֶיהָ עִמָּהּ
  choice: அவளுடைய மருமகள்கள் இருவரும் அவளோடு
  rationale: இந்தச் சூழலில் כַּלָּה என்பது ‘மருமகள்’ என்று பொருள்படும்; இருவரும் நகோமியுடன் இருந்ததையும் சொற்றொடர் தெளிவாகக் காட்டுகிறது.
- source_word: וַתֵּלַכְנָה בַדֶּרֶךְ
  choice: அவர்கள் வழியில் பயணித்தார்கள்
  rationale: பெண்பால் பன்மை வினை நகோமியையும் அவளுடைய இரு மருமகள்களையும் குறிக்கிறது. ‘பயணித்தார்கள்’ என்பது வழியில் சென்றுகொண்டிருந்ததை இயல்பாகத் தெரிவிக்கிறது; நடந்தே சென்றார்கள் என்ற தேவையற்ற குறிப்பைச் சேர்ப்பதில்லை.
- source_word: לָשׁוּב
  choice: திரும்பிச் செல்வதற்காக
  rationale: שׁוב என்பதன் ‘திரும்புதல்’ என்ற பொருளையும் ரூத் 1-இல் அதன் கருப்பொருள் முக்கியத்துவத்தையும் காக்கிறது.
- source_word: אֶל־אֶרֶץ יְהוּדָה
  choice: யூதா நாட்டிற்கு
  rationale: மூலத்தில் வெளிப்படையாக உள்ள אֶרֶץ என்ற நிலப்பரப்பு கருத்தை ‘நாடு’ என்பதன் மூலம் காக்கிறது.
