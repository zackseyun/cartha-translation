  verdict: revise
  source_fidelity: 'மொத்தத்தில் மூலத்துக்கு நெருக்கமாக உள்ளது: நகோமி தங்கியிருந்த இடத்திலிருந்து புறப்படுதல், அவளோடு இருந்த இரு மருமகள்கள், யூதா நாட்டிற்குத் திரும்பும் நோக்கம் ஆகியவை சரியாக வந்துள்ளன. ஆனால் வ.7-இன் இரண்டாம் வினை பன்மையாக, நகோமியையும் இரு மருமகள்களையும் இணைத்துக் குறிக்கிறது; நடப்பு உரையின் இரண்டாம் வாக்கியம் மருமகள்கள் மட்டும் சென்றார்கள் எனத் தோன்றச் செய்கிறது. மேலும் ‘பயணித்தார்கள்’ என்பது ‘சென்றார்கள்’ என்பதைக் காட்டிலும் சற்றே விரிவாக்கமானது.'
  naturalness: திருத்திய வடிவம் நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமான கதைநடையிலும் உள்ளது. ‘அவளும் அவளுடைய இரு மருமகள்களும்’ என்ற வெளிப்படையான இணைப்பு, எபிரெயப் பன்மை வினையின் குறியீட்டைத் தெளிவாக்குகிறது.
  terminology: ‘மருமகள்கள்,’ ‘திரும்ப,’ மற்றும் ‘யூதா நாடு’ ஆகியவை சூழலுக்கும் நிலையான வேதாகமப் பயன்பாட்டிற்கும் ஏற்றவை. ‘புறப்பட்டாள்’ ஏற்கத்தக்கது; அடிக்குறிப்பு மூலத்தின் நேரடியான ‘வெளியே சென்றாள்’ என்ற மாற்றைச் சரியாகக் குறிப்பிடுகிறது.
  issues:
