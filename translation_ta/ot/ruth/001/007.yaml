  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெயக் கதைநடையின் தொடர்ச்சியைத் தமிழில் இயல்பாகக் காட்ட வாக்கியங்கள் பிரிக்கப்பட்டுள்ளன; மூலத்தின் ‘திரும்புதல்’ மற்றும் ‘யூதா நாடு’ ஆகிய கூறுகள் பாதுகாக்கப்பட்டுள்ளன.
