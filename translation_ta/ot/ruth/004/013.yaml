  text: וַ/יִּקַּ֨ח בֹּ֤עַז אֶת רוּת֙ וַ/תְּהִי ל֣/וֹ לְ/אִשָּׁ֔ה וַ/יָּבֹ֖א אֵלֶ֑י/הָ וַ/יִּתֵּ֨ן יְהוָ֥ה לָ֛/הּ הֵרָי֖וֹן וַ/תֵּ֥לֶד בֵּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/013.yaml
  text: So Boaz took Ruth[a], and she became his wife. He went in to her, and Yahweh granted her conception, and she bore a son.
translation:
  language: ta
  text: போவாஸ் ரூத்தைத் திருமணம் செய்துகொண்டான்; அவள் அவனுடைய மனைவியானாள். அவன் அவளுடன் சேர்ந்தான். யாவே அவளுக்குக் கருவுறுதலை அளித்தார்[a]; அவள் ஒரு மகனைப் பெற்றெடுத்தாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “யாவே அவளுக்குக் கருவுறுதலைக் கொடுத்தார்”; இதை “யாவே அவள் கருவுறும்படி செய்தார்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: ஏற்றுக்கொண்டான்
  rationale: לקח என்பதன் அடிப்படைப் பொருள் ‘எடுத்துக்கொண்டான்.’ இங்கு திருமணச் சூழலில் வருவதாலும், அடுத்த தொடர் அவள் அவனுக்கு மனைவியானதைத் தெளிவுபடுத்துவதாலும், இயல்பான தமிழில் ‘ஏற்றுக்கொண்டான்’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: וַתְּהִי לוֹ לְאִשָּׁה
  choice: அவள் அவனுக்கு மனைவியானாள்
  rationale: முறையான திருமண உறவைச் சுட்டும் எபிரெய மரபுத்தொடரின் வரிசையையும் பொருளையும் இது காக்கிறது.
- source_word: וַיָּבֹא אֵלֶיהָ
  choice: அவன் அவளுடன் சேர்ந்தான்
  rationale: பாலுறவைக் குறிக்கும் எபிரெய மொழியின் அடக்கமான மரபுத்தொடரை, நவீனத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் வழங்குகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது பட்டப்பெயர் அல்ல, தேவனுடைய தனிப்பெயரான நான்கெழுத்துத் திருப்பெயர்; ஆகவே தமிழில் அதன் பரவலான ஒலிபெயர்ப்பான ‘யாவே’ பயன்படுத்தப்பட்டது.
- source_word: וַיִּתֵּן יְהוָה לָהּ הֵרָיוֹן
  choice: யாவே அவள் கருவுற அருளினார்
  rationale: הֵרָיוֹן கருவுறுதல் அல்லது கர்ப்பத்தைக் குறிக்கிறது. இந்தத் தேர்வு கருவுறுதலில் யாவேயின் செயற்பாட்டைத் தெளிவாகக் காக்கிறது; அதே நேரத்தில் சொல்லுக்குச் சொல் அமைப்பின் இயல்பற்ற தமிழைத் தவிர்க்கிறது.
- source_word: וַתֵּלֶד בֵּן
  choice: அவள் ஒரு மகனைப் பெற்றெடுத்தாள்
  rationale: ילד + בן என்பதன் பொருளை இயல்பான நவீனத் தமிழில் துல்லியமாக வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற தேவப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரை தேவனுடைய தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. பட்டப்பெயரை மாற்றீடாக இடாமல், அந்தத் தனிப்பெயர் ஒலிபெயர்க்கப்பட்டது.
- issue: ரூத்தின் கருவுறுதலில் தேவனுடைய செயற்பாடு
  choice: யாவே அவள் கருவுற அருளினார்
  alternative: யாவே அவள் கருவுறும்படி செய்தார்
  rationale: கருவுறுதல் யாவேயிடமிருந்து கிடைத்ததாக எபிரெய உரை நேரடியாகக் கூறுகிறது. ‘அருளினார்’ அந்தத் தெய்வீக செயற்பாட்டையும் கொடையாகிய நுண்பொருளையும் காக்கிறது; ஆனால் அதன் இயங்குமுறையை உரைக்கு அப்பால் விளக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையான ஆனால் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. பாலுறவைக் குறிக்கும் மூலத்தின் அடக்கமான மொழி ‘அவளுடன் சேர்ந்தான்’ என இயல்பாகப் பாதுகாக்கப்பட்டுள்ளது; எபிரெய வாக்கியங்களின் தொடர்ச்சியும் தேவையான அளவு தக்கவைக்கப்பட்டுள்ளது.
