  text: וּ/בֹ֨עַז עָלָ֣ה הַ/שַּׁעַר֮ וַ/יֵּ֣שֶׁב שָׁם֒ וְ/הִנֵּ֨ה הַ/גֹּאֵ֤ל עֹבֵר֙ אֲשֶׁ֣ר דִּבֶּר בֹּ֔עַז וַ/יֹּ֛אמֶר ס֥וּרָ/ה שְׁבָ/ה פֹּ֖ה פְּלֹנִ֣י אַלְמֹנִ֑י וַ/יָּ֖סַר וַ/יֵּשֵֽׁב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/001.yaml
  text: Boaz had gone up to the gate and sat down there[a], and behold, the kinsman-redeemer of whom Boaz had spoken was passing by. So he said, "Turn aside, sit down here[b], so-and-so." And he turned aside and sat down.
translation:
  language: ta
  text: போவாஸ் நகரவாசலுக்குச் சென்று அங்கே உட்கார்ந்தார்.[b] இதோ, போவாஸ் குறிப்பிட்டிருந்த மீட்புரிமையுள்ள உறவினன் அவ்வழியாகக் கடந்துபோய்க்கொண்டிருந்தான். போவாஸ் அவனிடம், “இங்கே விலகி வந்து உட்காருங்கள், அமுக்கரே[a]” என்றார். அவனும் விலகி வந்து உட்கார்ந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், பெயரை வேண்டுமென்றே குறிப்பிடாமல் விடும் ஒரு வழக்கு; இதன் பொருள் ஏறத்தாழ “அமுக்கர்” அல்லது “அந்த இன்னார்” என்பதாகும்.
    reason: lexical_alternative
  - marker: b
    text: பண்டைய இஸ்ரவேலில் நகரவாசல் பொதுமக்கள் கூடும் இடமாகவும் சட்ட மற்றும் குடிமை நடவடிக்கைகள் நடைபெறும் இடமாகவும் இருந்தது.
    reason: cultural_note
lexical_decisions:
- source_word: עָלָה הַשַּׁעַר
  choice: நகரவாசலுக்குச் சென்று
  rationale: עָלָה என்பதன் அடிப்படைப் பொருள் ‘மேலே போ’ என்றாலும், இங்கு இலக்கை நோக்கிச் செல்வதைக் குறிக்கும் எபிரெய வழக்கு. தமிழில் ‘நகரவாசலுக்குச் சென்று’ இயல்பாகவும் சூழலுக்கு ஏற்றவாறும் உள்ளது.
- source_word: הַשַּׁעַר
  choice: நகரவாசல்
  rationale: இது வெறும் கதவு அல்ல; நகரத்தின் பொதுவான சட்ட, குடிமை நடவடிக்கைகள் நடைபெற்ற வாசற்பகுதி. ‘நகரவாசல்’ சூழலைத் தெளிவாக்குகிறது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: கதையில் கவனத்தைத் திடீர் நிகழ்வின்மேல் திருப்பும் உரையாடல் குறியை ‘இதோ’ நேரடியாகவும் உயிரோட்டமாகவும் தருகிறது.
- source_word: הַגֹּאֵל
  choice: மீட்புரிமையுள்ள உறவினன்
  rationale: גֹּאֵל என்பது குடும்ப உறவின் அடிப்படையில் சொத்து முதலியவற்றை மீட்கும் சட்ட உரிமையும் பொறுப்பும் உடையவரைக் குறிக்கிறது. இந்தத் தமிழாக்கம் உறவையும் மீட்பு உரிமையையும் வெளிப்படுத்துகிறது; அவர் உண்மையில் மீட்பாரா என்பதை முன்கூட்டியே தீர்மானிப்பதில்லை.
- source_word: עֹבֵר
  choice: அந்த வழியாக வந்துகொண்டிருந்தான்
  rationale: எபிரெயப் பங்கேற்புவினையின் தொடர்நிலை உணர்வை ‘வந்துகொண்டிருந்தான்’ காக்கிறது; தமிழில் ‘கடந்துகொண்டிருந்தான்’ என்பதைக் காட்டிலும் இச்சூழலில் இயல்பாக ஒலிக்கிறது.
- source_word: אֲשֶׁר דִּבֶּר בֹּעַז
  choice: போவாஸ் குறிப்பிட்டிருந்த
  rationale: முன்னர் போவாஸ் பேசிய அதே மனிதரை அடையாளப்படுத்தும் உறவுத்தொடரைச் சுருக்கமாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: סוּרָה שְׁבָה־פֹה
  choice: இங்கே சற்றுத் திரும்பி வந்து உட்காருங்கள்
  rationale: பாதையிலிருந்து விலகி போவாஸிடம் வந்து அமருமாறு விடுக்கும் அழைப்பை மரியாதையான நவீன தமிழில் தருகிறது; பின்னர் வரும் וַיָּסַר உடனான வினை எதிரொலியும் ‘திரும்பி’ என்பதால் காக்கப்படுகிறது.
- source_word: פְּלֹנִי אַלְמֹנִי
  choice: ஐயா இன்னாரே
  rationale: பெயரை வேண்டுமென்றே குறிப்பிடாமல் ஓர் ஆணை நேரடியாக அழைக்கும் எபிரெயப் பெயரிடாத வழக்கை ‘இன்னாரே’ வெளிப்படுத்துகிறது; ‘ஐயா’ நேரடி அழைப்பின் மரியாதைத் தொனியை இயல்பாக்குகிறது.
- source_word: וַיָּסַר וַיֵּשֵׁב
  choice: அவனும் திரும்பி வந்து உட்கார்ந்தான்
  rationale: போவாஸின் அழைப்புக்கு அவன் இணங்கியதையும், கட்டளையிலும் நிறைவேற்றத்திலும் உள்ள வினை எதிரொலியையும் காக்கிறது.
theological_decisions:
- issue: גֹּאֵל என்பவரின் குடும்ப மற்றும் சட்டப் பங்கு
  choice: மீட்புரிமையுள்ள உறவினன்
  alternative: மீட்பவன் / நெருங்கிய உறவினன்
  rationale: ‘மீட்பவன்’ மட்டும் உறவுநிலையை மறைக்கலாம்; ‘நெருங்கிய உறவினன்’ மட்டும் சட்டப்பூர்வ மீட்பு உரிமையை மறைக்கலாம். தேர்ந்த சொற்றொடர் இரண்டையும் காக்கிறது; குறிப்பிட்ட ஒரு சமயக் கோட்பாட்டைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. கதைசொல்லலில் போவாஸுக்கு மரியாதைப் பன்மையும், பெயரிடப்படாத மனிதருக்கு மூன்றாம் நபர் ஒருமையும் பயன்படுத்தப்பட்டுள்ளன. எபிரெயத்தில் பெயரிடாமல் விடும் פְּלֹנִי אַלְמֹנִי என்ற வழக்கு ‘ஐயா இன்னாரே’ என இயல்பாக்கப்பட்டுள்ளது. முதன்மை உரையில் உள்ள [a] குறி அடிக்குறிப்புடன் பொருந்துகிறது.
