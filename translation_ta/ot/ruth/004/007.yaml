  to: 'மீட்பையும் பரிமாற்றத்தையும் குறித்து எந்தக் காரியத்தையும் உறுதிப்படுத்துவதற்காக[b], முற்காலத்தில்[a] இஸ்ரவேலில் இருந்த வழக்கம் இதுதான்: ஒருவன் தன் செருப்பைக் கழற்றி, அதைத் தன் அயலானிடம் கொடுப்பான். இதுவே இஸ்ரவேலில் உறுதிச்சான்றாக இருந்தது[c].'
  rationale: The revision places the temporal phrase with the former Israelite custom, preserving the sense of לְפָנִים. It also relocates each footnote marker to its corresponding expression and uses more idiomatic Tamil for the recipient of the sandal. The broad legal and evidentiary language of the Hebrew is retained.
