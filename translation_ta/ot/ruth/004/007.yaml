translation_notes:
  register: நவீனத் தரத் தமிழில், சட்டச் சூழலுக்கேற்ற கண்ணியமான ஆனால் பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மூலத்தின் விளக்கவுரைத் தன்மையும் செயன்முறை வரிசையும் காக்கப்பட்டுள்ளன.
