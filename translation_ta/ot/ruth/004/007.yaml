base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/007.yaml
  text: 'This was formerly the custom in Israel concerning redemption and exchange[a], to confirm any matter: a man removed his sandal and gave it to his neighbor[c][b], and this was the attestation in Israel.'
translation:
  language: ta
  text: 'மீட்பையும் பரிமாற்றத்தையும் குறித்து எந்தக் காரியத்தையும் உறுதிப்படுத்துவதற்காக[b], முற்காலத்தில்[a] இஸ்ரவேலில் இருந்த வழக்கம் இதுதான்: ஒருவன் தன் செருப்பைக் கழற்றி, அதைத் தன் அயலானிடம் கொடுப்பான். இதுவே இஸ்ரவேலில் உறுதிச்சான்றாக இருந்தது[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “முன்பு.”
    reason: lexical_alternative
  - marker: b
    text: “எந்தக் காரியத்தையும் உறுதிப்படுத்துவதற்காக” என்பதற்கு மாற்றாக, “ஒவ்வொரு பரிவர்த்தனையையும் உறுதிப்படுத்துவதற்காக” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “இதுவே இஸ்ரவேலில் சாட்சியாக இருந்தது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְפָנִים
  choice: முன்பு
  rationale: கடந்த காலத்தில் நிலவிய வழக்கத்தை இயல்பான நவீன தமிழில் குறிக்கிறது; எபிரெயத்தில் இல்லாத ‘இப்போது’ போன்ற உரையாடல் இணைப்பைச் சேர்க்கவில்லை.
- source_word: הַגְּאוּלָּה
  choice: மீட்பு
  rationale: உறவுமுறைச் சட்டச் சூழலில் சொத்து அல்லது உரிமையை மீட்டுக்கொள்ளுதலை நேரடியாகவும் சுருக்கமாகவும் குறிக்கிறது.
- source_word: הַתְּמוּרָה
  choice: பரிமாற்றம்
  rationale: மாற்றீடு அல்லது கைமாற்றம் என்ற பொதுவான சட்டப் பொருளைப் பாதுகாக்கிறது; குறிப்பிட்ட சட்ட நடைமுறையைத் தேவையின்றி வரையறுக்கவில்லை.
- source_word: לְקַיֵּם כָּל דָּבָר
  choice: எந்தக் காரியத்தையும் உறுதிப்படுத்துவதற்கு
  rationale: ‘நிலைநிறுத்துதல்/உறுதிப்படுத்துதல்’ என்ற வினைப் பொருளையும், כָּל דָּבָר என்பதன் பரந்த பொருளையும் இயல்பான தமிழில் தருகிறது.
- source_word: שָׁלַף
  choice: கழற்றி
  rationale: செருப்பை அகற்றும் செயலைத் தமிழில் இயல்பாகக் கூறுகிறது.
- source_word: נַעֲלוֹ
  choice: தன் செருப்பு
  rationale: பண்டைய சூழலிலுள்ள காலணியைத் தெளிவாகவும் பொதுவாகப் புரியும் வகையிலும் குறிக்கிறது.
- source_word: לְרֵעֵהוּ
  choice: தன் சக மனிதனிடம்
  rationale: ரֵעַ என்பதன் ‘சக மனிதன்/உடனிருப்பவர்’ என்ற பரந்த பொருளைப் பாதுகாக்கிறது; சட்ட நடவடிக்கையின் மற்ற தரப்பினர் என்று மிகையாக விளக்கவில்லை.
- source_word: הַתְּעוּדָה
  choice: உறுதிச்சான்று
  rationale: பரிவர்த்தனையைச் செல்லுபடியாக உறுதிப்படுத்தும் சான்று அல்லது சாட்சியச் செயல் என்ற சட்டப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
