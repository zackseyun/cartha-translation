source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר בֹּ֔עַז בְּ/יוֹם קְנוֹתְ/ךָ֥ הַ/שָּׂדֶ֖ה מִ/יַּ֣ד נָעֳמִ֑י וּ֠/מֵ/אֵת ר֣וּת הַ/מּוֹאֲבִיָּ֤ה אֵֽשֶׁת הַ/מֵּת֙ קניתי לְ/הָקִ֥ים שֵׁם הַ/מֵּ֖ת עַל נַחֲלָתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/005.yaml
  text: Then Boaz said[a], “On the day you acquire the field from the hand of Naomi, you also acquire Ruth the Moabite, the wife of the dead man[c][b], in order to raise up the name of the dead on his inheritance.”
translation:
  language: ta
  text: அப்போது போவாஸ், “நீ நகோமியின் கையிலிருந்து அந்த வயலை வாங்கும் நாளில், இறந்தவனின் மனைவியாகிய[b] மோவாபியப் பெண் ரூத்தையும் பெற்றுக்கொள்கிறாய்[a]; இறந்தவனின் பெயர் அவனுடைய மரபுரிமைச் சொத்தில் நிலைத்திருக்கும்படியாக” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மசோரா எபிரெய உரை சொற்பட, “மோவாபியப் பெண் ரூத்தை நான் பெற்றுக்கொண்டேன்” (அல்லது “நான் பெறுகிறேன்”) என்று வாசிக்கிறது. இங்கு சூழலின் பொருள் “நீ ரூத்தையும் பெற்றுக்கொள்கிறாய்” என்று பலர் புரிந்துகொள்கிறார்கள்.
    reason: textual_variant
  - marker: b
    text: அல்லது, “இறந்தவனுடைய மனைவியான.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיוֹם קְנוֹתְךָ
  choice: நீ ... வாங்கும் நாளில்
  rationale: குறிப்பிட்ட சட்டபூர்வ மீட்பு நடவடிக்கையைச் சுட்டும் எபிரெயக் காலத் தொடரை இயல்பான தமிழில் நெருக்கமாகப் பிரதிபலிக்கிறது.
- source_word: הַשָּׂדֶה
  choice: அந்த வயலை
  rationale: உரையாடலில் ஏற்கெனவே குறிப்பிடப்பட்ட குறிப்பிட்ட நிலப்பகுதியைச் சுட்டுவதால், ‘நிலம்’ என்பதைவிட ‘வயல்’ நேரடியான இணை.
- source_word: מִיַּד נָעֳמִי
  choice: நகோமியின் கையிலிருந்து
  rationale: உடைமை அல்லது கட்டுப்பாட்டிலிருந்து சட்டபூர்வமாக மாற்றப்படுவதை உணர்த்தும் எபிரெய மரபுத்தொடரின் சட்டச் சாயலைத் தக்கவைக்கிறது.
- source_word: וּמֵאֵת רוּת הַמּוֹאֲבִיָּה ... קניתי
  choice: மோவாபியப் பெண் ரூத்தையும் பெற்றுக்கொள்கிறாய்
  rationale: மசோரா உரையின் முதலாம் நபர் வடிவத்தை அடிக்குறிப்பில் பாதுகாத்தபடி, வயலை மீட்பவருக்கே ரூத் தொடர்பான பொறுப்பும் ஏற்படும் என்ற சூழல்சார் பொருளை முதன்மை உரையில் தருகிறது. ஒரு நபரை ‘வாங்குதல்’ எனத் தமிழில் தவறாக உணர்த்தாமல் இருக்க ‘பெற்றுக்கொள்கிறாய்’ பயன்படுத்தப்பட்டது.
- source_word: אֵשֶׁת הַמֵּת
  choice: இறந்தவனின் மனைவியாகிய
  rationale: ‘விதவை’ என்று விளக்கிப் பொருள் சேர்க்காமல், எபிரெயச் சொல்லமைப்பைத் தெளிவான தமிழில் நேரடியாக வழங்குகிறது.
- source_word: לְהָקִים שֵׁם
  choice: பெயரை ... நிலைநாட்டுவதற்காக
  rationale: இறந்தவரின் குடும்பப் பெயரும் வழித்தொடரும் தொடரச் செய்வதை உணர்த்தும் உருவகத்தை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: עַל נַחֲלָתוֹ
  choice: அவனது பரம்பரைச் சொத்தில்
  rationale: மரபுரிமையாகக் கிடைத்த குடும்ப நிலவுடைமையோடு இறந்தவரின் பெயர் தொடர்ந்து இணைந்திருப்பதைச் சுட்டுகிறது.
theological_decisions:
- issue: ரூத்தையும் קניתי என்ற வினைவடிவத்தையும் கொண்ட உரையின் உரைநிலை/தொடரியல் சிக்கல்
  choice: வயலைப் பெறும் நெருங்கிய மீட்பரிடம் இரண்டாம் நபரில் பேசப்படுவதாக முதன்மை உரையில் வழங்கப்பட்டது.
  alternative: மசோரா உயிர்க்குறிப்புப்படி, ‘மோவாபியப் பெண் ரூத்தை நான் பெற்றுக்கொண்டேன்’ அல்லது ‘நான் பெறுகிறேன்.’
  rationale: கதையின் தர்க்கப்படி, வயலை மீட்க முன்வரும் நெருங்கிய உறவினருக்கு ரூத் தொடர்பான குடும்பப் பொறுப்பும் உண்டு என்று போவாஸ் தெரிவிக்கிறார். எனினும் மசோரா உரையின் உண்மையான முதலாம் நபர் வாசகம் மறைக்கப்படாமல் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: இறந்தவனின் பெயரை நிலைநாட்டுதல்
  choice: பெயரை பரம்பரைச் சொத்தில் நிலைநாட்டுதல் என்ற எபிரெய உருவகம் தக்கவைக்கப்பட்டது.
  alternative: இறந்தவரின் குடும்ப வழித்தொடரையும் சொத்துரிமையையும் பாதுகாத்தல் என முழுமையாக விளக்கிப் பெயர்த்தல்.
  rationale: சட்ட, குடும்ப, மரபுரிமை ஆகிய பல அடுக்குகளையும் கொண்ட சொற்றொடரை எந்த ஒரு கோட்பாட்டிற்கும் சுருக்காமல், அதன் பண்பாட்டு விளக்கத்தை அடிக்குறிப்பில் வழங்குகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சட்டச் சூழலுக்கேற்ற கண்ணியமான ஆனால் பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டது. ‘மீட்பர்’ போன்ற விளக்கச் சொல்லை வசனத்துக்குள் சேர்க்காமல், மூலத்தின் சுருக்கமும் உரைநிலைத் தெளிவின்மையும் இயன்றவரை பாதுகாக்கப்பட்டுள்ளன.
