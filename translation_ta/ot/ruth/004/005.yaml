revisions:
- from: அப்போது போவாஸ், “நீ நகோமியின் கையிலிருந்து அந்த வயலை வாங்கும் நாளில், இறந்தவனின் மனைவியாகிய[b] மோவாபியப் பெண் ரூத்தையும் பெற்றுக்கொள்கிறாய்[a]. இறந்தவனுடைய பெயரை அவனது பரம்பரைச் சொத்தில் நிலைநாட்டுவதற்காகவே[c] இப்படிச் செய்கிறாய்” என்றான்.
  to: அப்போது போவாஸ், “நீ நகோமியின் கையிலிருந்து அந்த வயலை வாங்கும் நாளில், இறந்தவனின் மனைவியாகிய[b] மோவாபியப் பெண் ரூத்தையும் பெற்றுக்கொள்கிறாய்[a]; இறந்தவனின் பெயர் அவனுடைய மரபுரிமைச் சொத்தில் நிலைத்திருக்கும்படியாக” என்றான்.
  rationale: நோக்கத் தொடரிலிருந்த மூலத்திற்கு அப்பாற்பட்ட “இப்படிச் செய்கிறாய்” நீக்கப்பட்டது. לְהָקִים שֵׁם ... עַל נַחֲלָתוֹ என்பதன் பெயர்–மரபுரிமைத் தொடர்பு நவீனத் தமிழில் தெளிவாக வெளிப்படுமாறு மறுசீரமைக்கப்பட்டது. விவாதத்திற்குரிய கניתי வாசிப்பு மற்றும் அதனுடன் தொடர்புடைய அடிக்குறிப்பு மாற்றப்படவில்லை.
