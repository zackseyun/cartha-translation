translation:
  language: ta
  text: பின்பு அவன் நகரத்தின் மூப்பர்களில் பத்துப் பேரைத் தேர்ந்தெடுத்து, “இங்கே உட்காருங்கள்” என்றான்; அவர்களும் உட்கார்ந்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח
  choice: அழைத்து
  rationale: לקח என்பதன் அடிப்படைப் பொருள் ‘எடுத்தல்’ என்றாலும், இச்சூழலில் சட்ட நடவடிக்கைக்காக மூப்பர்களைத் தேர்ந்தெடுத்து வரவழைத்ததைக் குறிக்கிறது. தமிழில் ‘பத்துப் பேரை எடுத்தான்’ என்பது இயல்பற்றதாகவும் தவறாகப் புரிந்துகொள்ளத்தக்கதாகவும் இருப்பதால், ‘அழைத்து’ என்பது செயற்பாட்டின் நோக்கத்தை இயல்பாக வெளிப்படுத்துகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: עֲשָׂרָה אֲנָשִׁים
  choice: பத்துப் பேர்
  rationale: இது பத்து வயதுவந்த ஆண்களைக் குறிக்கிறது. அடுத்துள்ள ‘மூப்பர்கள்’ என்பதே அவர்களின் சமூகப் பங்கைத் தெளிவுபடுத்துவதால், நவீன தமிழில் இயல்பான ‘பத்துப் பேர்’ பயன்படுத்தப்படுகிறது.
- source_word: מִזִּקְנֵי הָעִיר
  choice: நகரத்தின் மூப்பர்களில்
  rationale: מן என்பதன் பகுதியைக் குறிக்கும் பொருளை ‘மூப்பர்களில்’ துல்லியமாகப் பேணுகிறது; זקנים இங்கு அங்கீகரிக்கப்பட்ட நகரத் தலைவர்களைக் குறிக்கிறது.
- source_word: וַיֹּאמֶר
  choice: என்றான்
  rationale: நேர்க் கூற்றைத் தொடர்ந்து வரும் எபிரெய வழக்கை இயல்பான தமிழ் மேற்கோள் அமைப்பில் ‘என்றான்’ என வழங்குகிறது.
- source_word: שְׁבוּ
  choice: உட்காருங்கள்
  rationale: பன்மை ஏவல் வடிவத்தையும் மூப்பர்களிடம் பேசுவதற்குரிய மரியாதை நிலையையும் நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: פֹה
  choice: இங்கே
  rationale: இடத்தைச் சுட்டும் פֹה என்பதற்கு நேரான, இயல்பான தமிழ் இணை.
- source_word: וַיֵּשֵׁבוּ
  choice: அவர்களும் உட்கார்ந்தார்கள்
  rationale: கட்டளைக்கு அவர்கள் உடனே இணங்கியதைத் தொடர்ச்சியான கதைநடையில் காட்டுகிறது; ‘-உம்’ அவர்கள் கூறியபடியே செய்தார்கள் என்ற தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
