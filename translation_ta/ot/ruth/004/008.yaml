source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר הַ/גֹּאֵ֛ל לְ/בֹ֖עַז קְנֵה לָ֑/ךְ וַ/יִּשְׁלֹ֖ף נַעֲלֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/008.yaml
  text: So the redeemer said to Boaz[b][a], “Buy it for yourself,” and he took off his sandal.
translation:
  language: ta
  text: அப்போது மீட்புரிமையுள்ள அந்த உறவினர்[a] போவாசிடம், “நீயே வாங்கிக்கொள்” என்றான். பின்பு அவன் தன் செருப்பைக் கழற்றினான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மீட்பவர்.” எபிரெயச் சொல், குடும்பச் சொத்தையோ குடும்ப வழித்தொடரையோ மீட்பதற்கான சட்டப் பொறுப்புடைய நெருங்கிய உறவினரைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: இந்தப் பரிவர்த்தனையில் செருப்பைக் கழற்றுவது வழக்கமான சட்ட அடையாளமாகச் செயல்பட்டது; ரூத் 4:7-ஐ ஒப்பிடுக.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றான்
  rationale: வாவ் தொடர்வினை கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது; நவீன தமிழில் இயல்பான தொடர் ஓட்டத்தை ‘அப்போது’ தருகிறது.
- source_word: הַגֹּאֵל
  choice: மீட்புரிமையுள்ள அந்த உறவினர்
  rationale: ரூத் நூலின் சூழலில், குடும்பச் சொத்தையோ குடும்ப வழித்தொடரையோ மீட்பதற்கான சட்ட உரிமையும் பொறுப்பும் உடைய நெருங்கிய உறவினரை இச்சொல் குறிக்கிறது. வெறும் ‘மீட்பவர்’ என்பதைவிட இந்தத் தேர்வு அந்தக் குடும்ப-சட்டப் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: לְבֹעַז
  choice: போவாசிடம்
  rationale: முன்னிடைச்சொல்லையும் பெயரையும் இயல்பான தமிழில் நேரடியாகக் காட்டுகிறது.
- source_word: קְנֵה לָךְ
  choice: நீயே வாங்கிக்கொள்
  rationale: கட்டளை வினையின் நேரடியான பொருளையும், வாங்கும் பொறுப்பை போவாஸ் தானே ஏற்க வேண்டும் என்ற தற்சுட்டுப் பொருளையும் இயல்பான தமிழில் தருகிறது.
- source_word: וַיִּשְׁלֹף
  choice: பின்பு ... கழற்றினான்
  rationale: செருப்பை இழுத்து அகற்றுவதைக் குறிக்கும் வினைக்கு ‘கழற்றினான்’ என்பதே தெளிவான, இயல்பான தமிழ்; நிகழ்வுத் தொடரை ‘பின்பு’ வெளிப்படுத்துகிறது.
- source_word: נַעֲלוֹ
  choice: தன் செருப்பு
  rationale: பண்டைய சூழலின் காலணியை ‘செருப்பு’ இயல்பாகக் குறிக்கிறது; தற்சுட்டுப் பெயரடை அதன் உரிமையாளரையே சுட்டுகிறது.
