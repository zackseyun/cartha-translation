base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/010.yaml
  text: And also Ruth the Moabite[a], the wife of Mahlon, I have acquired for myself as a wife, to raise up the name of the dead over his inheritance, so that the name of the dead may not be cut off from among his brothers and from the gate of his place[c][b]. You are witnesses today.
translation:
  language: ta
  text: மேலும், மோவாபியப் பெண்ணான ரூத்தை—மக்லோனின் மனைவியை—எனக்காக மனைவியாகப் பெற்றுக்கொண்டேன்[a]; இறந்தவனுடைய பெயரை அவனுடைய மரபுரிமைச் சொத்தின்மேல் நிலைநிறுத்துவதற்காகவும், இறந்தவனுடைய பெயர் அவனுடைய சகோதரர்களின் நடுவிலிருந்தும் அவன் ஊரின் வாசலிலிருந்தும் அறுபட்டுப்போகாதபடிக்காகவும். இன்று நீங்கள் சாட்சிகள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘எனக்காக மனைவியாக வாங்கிக்கொண்டேன்’ என்றும் மொழிபெயர்க்கலாம். இங்கு பயன்படுத்தப்பட்டுள்ள எபிரெய வினைச்சொல், சட்டரீதியான பரிவர்த்தனையில் விலை கொடுத்து உரிமை பெறுதல் என்ற பொருளையும் தரக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: மேலும்
  rationale: முந்தைய சட்ட நடவடிக்கையுடன் இவ்வறிக்கையை இணைக்கும் சேர்க்கைப் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: רוּת הַמֹּאֲבִיָּה
  choice: மோவாபியப் பெண்ணான ரூத்
  rationale: பெயரையும் பெண்பால் இன அடையாளத்தையும் நவீனத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: אֵשֶׁת מַחְלוֹן
  choice: மக்லோனின் மனைவி
  rationale: எபிரெய மூலத்தின் ‘மக்லோனின் மனைவி’ என்ற நேரடியான சொல்லாட்சியைப் பாதுகாக்கிறது; ‘விதவை’ என்பதை உரையில் சேர்க்கவில்லை.
- source_word: קָנִיתִי לִי
  choice: எனக்கு ... ஏற்றுக்கொண்டேன்
  rationale: קנה என்பதன் சட்டரீதியான பெற்றுக்கொள்ளுதல்/வாங்குதல் சார்ந்த பொருளை திருமணச் சூழலில் இயல்பாகத் தருகிறது; வாங்குதல் என்ற மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: לְאִשָּׁה
  choice: மனைவியாக
  rationale: திருமண நோக்கைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: לְהָקִים שֵׁם הַמֵּת
  choice: இறந்தவனுடைய பெயரை ... நிலைநிறுத்த
  rationale: ‘பெயரை எழுப்புதல்/நிறுவுதல்’ என்ற எபிரெய உருவகத்தின் குடும்ப வழி மற்றும் சட்ட நிலை தொடரும் கருத்தை தமிழில் புரியும்படி காக்கிறது.
- source_word: עַל נַחֲלָתוֹ
  choice: அவனுடைய உரிமைச் சொத்தின்மேல்
  rationale: மரபுரிமையாகக் கிடைத்த நிலம் அல்லது சொத்தோடு இறந்தவனின் பெயர் இணைந்திருப்பதைச் சட்டரீதியாக வெளிப்படுத்துகிறது.
- source_word: וְלֹא יִכָּרֵת
  choice: அறுபட்டுப்போகாமல்
  rationale: כרת என்பதன் வலுவான ‘அறுத்துப்போடப்படுதல்’ உருவகத்தைப் பாதுகாக்கிறது.
- source_word: מֵעִם אֶחָיו
  choice: அவனுடைய சகோதரர்களின் நடுவிலிருந்து
  rationale: மூலத்தில் உள்ள ‘சகோதரர்கள்’ என்ற சொல்லை அப்படியே காக்கிறது; சூழலில் அது விரிந்த உறவுக் குழுவைக் குறிக்கக்கூடும்.
- source_word: וּמִשַּׁעַר מְקוֹמוֹ
  choice: அவன் ஊரின் வாசலிலிருந்து
  rationale: ‘அவனுடைய இடத்தின் வாசல்’ என்பதை இயல்பான தமிழில் தருவதோடு, பொதுச் சட்ட அங்கீகாரத்தின் இடமான வாசலைப் பாதுகாக்கிறது.
- source_word: עֵדִים אַתֶּם הַיּוֹם
  choice: இன்று நீங்கள் சாட்சிகள்
  rationale: கூடியிருந்த மக்களிடம் சொல்லப்பட்ட சட்டப்பூர்வ அறிவிப்பைத் தெளிவாக வழங்குகிறது.
theological_decisions:
- issue: ரூத்தைப் பற்றிய போவாசின் நடவடிக்கையின் சட்ட-மீட்பு இயல்பு
  choice: ‘எனக்கு மனைவியாக ஏற்றுக்கொண்டேன்’ என்று மொழிபெயர்த்து, மாற்றுப் பொருளாக ‘வாங்கிக்கொண்டேன்’ என்பதை அடிக்குறிப்பில் தருதல்
  alternative: ‘எனக்கு மனைவியாக வாங்கிக்கொண்டேன்’
  rationale: קנה என்பதன் பரிவர்த்தனை சார்ந்த வலிமையை மறைக்காமல், ரூத்தைத் தனித்த ஒரு வணிகப் பொருளாகக் காட்டும் அளவுக்கு மிகைப்படுத்தாமலும் திருமணம், சொத்து மீட்பு, இறந்தவனின் பெயர் தொடர்தல் ஆகிய முழுச் சூழலையும் காக்கிறது.
- issue: இறந்தவனின் பெயரை நிலைநிறுத்துதல்
  choice: குடும்ப வழியும் உரிமைச் சொத்துடன் தொடர்புடைய சட்ட நிலையும் தொடர்வதை உரையிலுள்ள உருவகத்தோடு காட்டுதல்
  alternative: ‘இறந்தவனுக்கு ஒரு வாரிசை உண்டாக்க’ என்று விளக்கமாக மொழிபெயர்த்தல்
  rationale: மூலத்தின் ‘பெயரை நிலைநிறுத்துதல்’ என்ற சொல்லாட்சியையும் அதிலுள்ள குடும்ப-சட்டத் திணறலையும் பாதுகாக்கிறது; குறிப்பிட்ட ஒரு கோட்பாட்டு விளக்கத்தை உரைக்குள் புகுத்துவதில்லை.
- issue: אֶחָיו என்பதன் வரம்பு
  choice: சகோதரர்கள்
  alternative: உறவினர்கள்
  rationale: மூலத்தின் ஆண்பால் பன்மைச் சொல்லை நேரடியாகக் காக்கிறது; குல உறவினர்களை விரிவாகக் குறிக்கக்கூடிய வாய்ப்பை நிராகரிப்பதில்லை.
