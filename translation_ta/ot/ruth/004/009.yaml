base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/009.yaml
  text: Then Boaz said to the elders and all the people[b][a], “You are witnesses today that I have acquired from the hand of Naomi all that belonged to Elimelech and all that belonged to Chilion and Mahlon.”
translation:
  language: ta
  text: 'பின்பு போவாஸ் மூப்பர்களிடமும் மக்கள் அனைவரிடமும், “இன்று நீங்கள் சாட்சிகள்: எலிமெலேக்குக்குச் சொந்தமான அனைத்தையும், கிலியோனுக்கும் மக்லோனுக்கும் சொந்தமான அனைத்தையும் நகோமியின் கையிலிருந்து[a] நான் கைப்பற்றினேன்[b]” என்றார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நகோமியின் கையிலிருந்து” என்பது நகோமியின் உடைமையிலிருந்து அல்லது கட்டுப்பாட்டிலிருந்து என்பதைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: cultural_note
  - marker: b
    text: “வாங்கினேன்” அல்லது “விலைக்கு வாங்கினேன்” என்றும் மொழிபெயர்க்கலாம்; எபிரெய வினைச்சொல் சட்டபூர்வமான பரிவர்த்தனையில் விலைக்கு வாங்கிப் பெறுவதையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: பின்பு ... என்றார்
  rationale: வாவ் தொடர் கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது; ‘பின்பு’ என்பது வரிசையை இயல்பான நவீன தமிழில் காட்டுகிறது.
- source_word: לַזְּקֵנִים וְכָל הָעָם
  choice: மூப்பர்களிடமும் மக்கள் அனைவரிடமும்
  rationale: சட்ட நடவடிக்கையில் நேரடியாக உரையாடப்பட்ட இரு குழுக்களையும் தெளிவாகவும் இணையான அமைப்பிலும் குறிப்பிடுகிறது.
- source_word: עֵדִים אַתֶּם הַיּוֹם
  choice: இன்று நீங்கள் சாட்சிகள்
  rationale: எபிரெய வாக்கியத்தின் வலியுறுத்தலை வாசிக்க இயல்பான தமிழ் சொல் வரிசையில் தருகிறது.
- source_word: כִּי
  choice: என்பதற்கு
  rationale: இங்கு כִּי சாட்சியத்தின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது; தமிழ் மேற்கோள் அமைப்பில் ‘என்பதற்கு’ இதைத் தெளிவாக இணைக்கிறது.
- source_word: קָנִיתִי
  choice: நான் பெற்றுக்கொண்டேன்
  rationale: சட்டபூர்வமான உடைமைப் பெறுதலைக் குறிக்கிறது; பணம் கொடுத்து வாங்கியதாக மட்டும் பொருளைக் குறுக்காமல் மூல வினையின் பரப்பை காக்கிறது.
- source_word: אֶת כָּל אֲשֶׁר לֶאֱלִימֶלֶךְ
  choice: எலிமெலேக்குக்குச் சொந்தமான அனைத்தையும்
  rationale: ‘எலிமெலேக்குக்கு இருந்த அனைத்தும்’ என்ற எபிரெய உடைமை மரபுத்தொடரை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְאֵת כָּל אֲשֶׁר לְכִלְיוֹן וּמַחְלוֹן
  choice: கிலியோனுக்கும் மக்லோனுக்கும் சொந்தமான அனைத்தையும்
  rationale: முந்தைய உடைமைச் சொற்றொடருடனான இணை அமைப்பைக் காக்கிறது; இருவரது சொத்தையும் உள்ளடக்குகிறது.
- source_word: מִיַּד נָעֳמִי
  choice: நகோமியின் கையிலிருந்து
  rationale: உடைமை அல்லது கட்டுப்பாட்டிலிருந்து மாற்றப்படுவதைச் சுட்டும் எபிரெய சட்ட மரபுத்தொடரின் உருவகத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: போவாஸின் பரிவர்த்தனையின் தன்மை
  choice: சொத்து உரிமை சட்டபூர்வமாக மாற்றப்பட்டதை ‘பெற்றுக்கொண்டேன்’ என்று மொழிபெயர்த்தல்
  alternative: ‘வாங்கிக்கொண்டேன்’ அல்லது ‘விலைக்கு வாங்கினேன்’
  rationale: வசனம் எலிமெலேக், கிலியோன், மக்லோன் ஆகியோருக்குரிய அனைத்தையும் நகோமியின் கட்டுப்பாட்டிலிருந்து பெறும் சட்ட நடவடிக்கையைச் சொல்கிறது. பணப் பரிமாற்றத்தை மட்டும் கட்டாயமாக்காமலும் மனிதர்களை வாங்கியதாகத் தவறாக உணர்த்தாமலும் மூலத்தின் பொருள் பரப்பை இது காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான சட்டச் சூழல் மொழிநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மரபுத்தொடரான ‘கையிலிருந்து’ முதன்மை உரையில் வைக்கப்பட்டு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது; ‘பெற்றுக்கொண்டேன்’ என்பது மூல வினையின் உண்மையான பரப்பைத் திறந்தவையாக வைத்திருக்கிறது.
