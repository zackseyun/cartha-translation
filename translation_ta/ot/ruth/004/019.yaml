translation:
  language: ta
  text: எஸ்ரோன் ராமைப் பெற்றான்; ராம் அம்மினதாபைப் பெற்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/חֶצְרוֹן
  choice: எஸ்ரோன்
  rationale: எபிரெயத் தனிப்பெயர் நவீனத் தமிழ் வேதாகமப் பெயர்வழக்குக்கு ஏற்றவாறு ஒலிபெயர்க்கப்பட்டது. வசனத்தின் தொடக்கத்தில் உள்ள וְ தொடர்ச்சியைச் சுட்டினாலும், இவ்வசனம் தனியே வாசிக்கப்படும்போது இயல்பான தமிழுக்காகத் தனியாக மொழிபெயர்க்கப்படவில்லை.
- source_word: הוֹלִיד
  choice: பெற்றான்
  rationale: ילד என்பதன் ஹிஃபில் வடிவம் வம்சப்பட்டியல் சூழலில் ஒருவன் மற்றொருவனுக்குத் தந்தையானதைச் சுட்டுகிறது. ‘பெற்றான்’ என்பது தமிழில் வழக்கமான, சுருக்கமான வம்சப்பட்டியல் சொல்லாட்சி.
- source_word: אֶת
  choice: '[தனியாக மொழிபெயர்க்கப்படவில்லை]'
  rationale: இது நேரடிச் செயப்படுபொருளைக் குறிக்கும் இலக்கண அடையாளம்; தமிழில் இதன் பணி ‘-ஐ’ வேற்றுமை உருபால் வெளிப்படுத்தப்படுகிறது.
- source_word: רָם
  choice: ராம்
  rationale: எபிரெயத் தனிப்பெயர் அதன் ஒலிப்புக்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: וְ/רָם
  choice: ராம்
  rationale: וְ இரண்டாவது வம்சத் தொடரை இணைக்கிறது. தமிழில் அரைப்புள்ளியும் தொடர்ச்சியான வாக்கிய அமைப்பும் அந்த இணைப்பை இயல்பாக வெளிப்படுத்துவதால் ‘மற்றும்’ தனியே சேர்க்கப்படவில்லை.
- source_word: הוֹלִיד
  choice: பெற்றான்
  rationale: மூலத்தில் மீண்டும் வரும் வினைச்சொல், வம்சப்பட்டியலின் இணையான அமைப்பைப் பேண ஒரே தமிழ்ச் சொல்லால் மொழிபெயர்க்கப்பட்டது.
- source_word: עַמִּינָדָב
  choice: அம்மினதாப்
  rationale: எபிரெயப் பெயரின் மெய்யெழுத்து இரட்டிப்பையும் ஒலியமைப்பையும் தெளிவாகப் பிரதிபலிக்கும் தமிழ் ஒலிபெயர்ப்பு.
