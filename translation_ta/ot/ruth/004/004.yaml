base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/004.yaml
  text: So I thought I should inform you[a], saying, ‘Buy it in the presence of those sitting here and in the presence of the elders of my people. If you will redeem it, redeem it; but if he will not redeem it, tell me, so that I may know, for there is no one besides you to redeem it, and I am after you.’ And he said[b], ‘I will redeem it.’
translation:
  language: ta
  text: 'ஆகவே, நான் உனக்குத் தெரியப்படுத்த வேண்டும் என்று நினைத்தேன்[a]: ‘இங்கே அமர்ந்திருப்பவர்களின் முன்னிலையிலும் என் மக்களின் மூப்பர்களின் முன்னிலையிலும் அதை வாங்கிக்கொள். நீ அதை மீட்டுக்கொள்வதாக இருந்தால், மீட்டுக்கொள். ஆனால் அவன் அதை மீட்டுக்கொள்ளாவிட்டால்[b], நான் அறிந்துகொள்ளும்படி எனக்குச் சொல்; ஏனெனில் அதை மீட்டுக்கொள்ள உன்னைத் தவிர வேறு யாரும் இல்லை; உனக்கு அடுத்தவன் நான்தான்.’ அப்போது அவன், “நான் அதை மீட்டுக்கொள்வேன்” என்றான்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் சொற்சொல்லாக, “உன் செவியைத் திறப்பேன்.” இது “உனக்குத் தெரிவிப்பேன்” அல்லது “உனக்குத் தெரியப்படுத்துவேன்” என்ற பொருளுடைய மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெய உரையில், “அவன் அதை மீட்டுக்கொள்ளாவிட்டால்” என்று உள்ளது. முன்னும் பின்னும் அந்த மனிதனிடமே நேரடியாகப் பேசப்படுவதால், சிலர் இதை “நீ அதை மீட்டுக்கொள்ளாவிட்டால்” என்று புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
lexical_decisions:
- source_word: אֶגְלֶה אָזְנְךָ
  choice: உனக்குத் தெரிவிக்க வேண்டும்
  rationale: எபிரெய மொழியில் சொற்சொல்லாக ‘உன் செவியைத் திறப்பேன்’ என்றாலும், ஒருவருக்கு ஒரு செய்தியைத் தெரியப்படுத்துதல் என்பதே இங்கு இயல்பான பொருள். நவீன தமிழில் தெளிவாக இருக்க இந்த மரபுத்தொடரின் பொருள் மொழிபெயர்க்கப்பட்டது.
- source_word: קְנֵה
  choice: அதை வாங்கிக்கொள்
  rationale: קנה என்பதன் அடிப்படைப் பொருள் வாங்குதல் அல்லது பெற்றுக்கொள்ளுதல். நிலம் தொடர்பான பொதுவான சட்ட நடவடிக்கையை இயல்பான தமிழில் ‘வாங்கிக்கொள்’ தெளிவாகக் காட்டுகிறது.
- source_word: נֶגֶד הַיֹּשְׁבִים
  choice: இங்கே அமர்ந்திருப்பவர்களுக்கு முன்பாக
  rationale: நகரவாசலில் கூடியிருந்தவர்களின் பொது சாட்சியத்தில் நடவடிக்கை நடைபெறுவதை இச்சொற்றொடர் குறிக்கிறது; ‘இங்கே’ என்பது உடனடி சூழலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: זִקְנֵי עַמִּי
  choice: என் மக்களின் மூப்பர்கள்
  rationale: சமுதாயத்தில் அங்கீகரிக்கப்பட்ட தலைவர்களைக் குறிக்கும் நேரடியான மொழிபெயர்ப்பு; இதை அவசியமின்றி ‘குலம்’ என்று குறுக்கவில்லை.
- source_word: תִּגְאַל ... גְּאָל
  choice: நீ அதை மீட்டுக்கொள்வதாக இருந்தால், மீட்டுக்கொள்
  rationale: גאל என்ற வினை குடும்ப உறவின் அடிப்படையில் சொத்தை மீட்கும் சட்ட உரிமை அல்லது கடமையைக் குறிக்கிறது. மூலத்தின் வினை மறுபடியும் வருவது வலியுறுத்தலாகத் தமிழிலும் பாதுகாக்கப்பட்டது.
- source_word: וְאִם לֹא יִגְאַל
  choice: ஆனால் அவன் அதை மீட்டுக்கொள்ளாவிட்டால்
  rationale: மசோரா உரையில் வினை மூன்றாம் நபர் ஆண்பால் ஒருமையில் உள்ளது. முன்னதாக இரண்டாம் நபரை நேரடியாக அழைத்தபின் வரும் இந்தத் திடீர் நபர்மாற்றம் பிரதான உரையில் பாதுகாக்கப்பட்டு, அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
- source_word: הַגִּידָה לִּי
  choice: என்னிடம் சொல்
  rationale: நேரடியான கட்டளையை இயல்பான, தெளிவான தமிழில் தருகிறது.
- source_word: אֵין זוּלָתְךָ
  choice: உன்னைத் தவிர வேறு யாரும் இல்லை
  rationale: זוּלָתְךָ காட்டும் விலக்கு மற்றும் தனித்தன்மையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְאָנֹכִי אַחֲרֶיךָ
  choice: உனக்கு அடுத்தவன் நான்தான்
  rationale: மீட்பு உரிமையின் வரிசையில் போவாஸ் அடுத்தவர் என்பதைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: אָנֹכִי אֶגְאָל
  choice: நான் அதை மீட்டுக்கொள்கிறேன்
  rationale: அந்த நபர் மீட்பு உரிமையையும் கடமையையும் ஏற்றுக்கொள்வதைத் தமிழில் இயல்பான நேரடி உரையாகக் காட்டுகிறது; பொருள் சூழலிலிருந்து நிரப்பப்பட்டுள்ளது.
theological_decisions:
- issue: குடும்ப-சட்டச் சூழலில் גאל என்பதன் மொழிபெயர்ப்பு
  choice: மீட்டுக்கொள்
  alternative: உறவினன் என்ற முறையில் மீட்பு செய்; திரும்ப வாங்கு
  rationale: இவ்வினை குடும்ப உறவின் அடிப்படையில் சொத்தை மீட்கும் உரிமையையும் கடமையையும் குறிக்கிறது. ‘மீட்டுக்கொள்’ என்பது அதன் சட்ட மற்றும் உடன்படிக்கை சார்ந்த ஒலிப்பைத் தக்கவைக்கிறது; ‘உறவினன்-மீட்பர்’ போன்ற விளக்கச் சொல்லை மூலத்தில் இல்லாத இடத்தில் உட்புகுத்துவதையும் தவிர்க்கிறது.
- issue: இரண்டாம் நபரிலிருந்து மூன்றாம் நபருக்கான திடீர் மாற்றம்
  choice: ‘அவன் அதை மீட்டுக்கொள்ளாவிட்டால்’ என்று மசோரா உரையின் மூன்றாம் நபரைப் பாதுகாத்தல்
  alternative: ‘நீ அதை மீட்டுக்கொள்ளாவிட்டால்’ என்று சூழலுக்கேற்ப சீராக்குதல்
  rationale: மூல எபிரெய உரையின் உண்மையான இலக்கணப் பதற்றத்தை அமைதியாக நீக்காமல் பிரதான உரையில் தக்கவைக்கிறது; சூழலுக்கேற்ற மாற்றுப் புரிதல் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான சட்ட-கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘மீட்டுக்கொள்’ என்ற முக்கியச் சொல் முழு வசனத்திலும் ஒரேபடியாக வைக்கப்பட்டுள்ளது. மூலத்தில் உள்ள நபர்மாற்றம் அடிக்குறிப்புடன் பாதுகாக்கப்பட்டுள்ளது.
