revisions:
- from: ஆகவே, ‘இங்கே அமர்ந்திருப்பவர்களுக்கும் என் மக்களின் மூப்பர்களுக்கும் முன்பாக அதை வாங்கிக்கொள்’ என்று உனக்குத் தெரிவிக்க வேண்டும்[a] என நினைத்தேன். நீ அதை மீட்டுக்கொள்வதாக இருந்தால், மீட்டுக்கொள். ஆனால் அவன் அதை மீட்டுக்கொள்ளாவிட்டால்[b], என்னிடம் சொல்; ஏனெனில் அதை மீட்டுக்கொள்ள உன்னைத் தவிர வேறு யாரும் இல்லை, உனக்கு அடுத்தவன் நான்தான் என்பதை நான் அறிந்துகொள்ள வேண்டும்” என்றான். அதற்கு அவன், “நான் அதை மீட்டுக்கொள்கிறேன்” என்றான்.
