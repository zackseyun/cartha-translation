base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/006.yaml
  text: Then the redeemer said[a], “I cannot redeem it for myself, lest I ruin my own inheritance. Redeem for yourself my right of redemption[b], for I cannot redeem it.”
translation:
  language: ta
  text: அப்போது மீட்புரிமை உடையவர்[a], “நான் அதை எனக்காக மீட்டுக்கொள்ள முடியாது; அப்படிச் செய்தால் என் சொந்த பரம்பரைச் சொத்துக்குச் சேதம் விளைவிப்பேன். எனது மீட்புரிமையை[b] நீரே உமக்காக மீட்டுக்கொள்ளுங்கள்; ஏனெனில் நான் அதை மீட்டுக்கொள்ள முடியாது” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இவர் போவாசைவிட நெருங்கிய உறவினர்; ஆகவே குடும்பச் சொத்தை மீட்பதற்கான உரிமை முதலில் இவருக்கே இருந்தது. சில மொழிபெயர்ப்புகள் இதை ‘உறவின மீட்பாளர்’ என வழங்குகின்றன.
    reason: cultural_note
  - marker: b
    text: எபிரெயத்தில் இதை இன்னும் சொற்சொல்லாக ‘என் மீட்பு’ என மொழிபெயர்க்கலாம். ஆனால் இங்கு குடும்பச் சொத்தை மீட்பதற்கும் ரூத்தை மணந்து குடும்ப வழியைத் தொடர்வதற்கும் உரிய சட்ட உரிமை/கடமையையே அது குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגֹּאֵל
  choice: மீட்புரிமையாளர்
  rationale: גאל என்ற வேரிலிருந்து வந்த இச்சொல், குடும்பச் சொத்தை மீட்பதற்கான சட்ட உரிமையும் கடமையும் உடையவரைக் குறிக்கிறது. ‘மீட்பவர்’ என்பதைக் காட்டிலும் ‘மீட்புரிமையாளர்’ இச்சட்டப் பின்னணியைத் தெளிவாக வெளிப்படுத்துகிறது; உறவுமுறையைச் சொல்லுக்குள் தேவையின்றி சேர்ப்பதில்லை.
- source_word: לִגְאֹל / גְּאַל / גְּאֻלָּתִי
  choice: மீட்டுக்கொள்ள / மீட்டுக்கொள்ளுங்கள் / மீட்புரிமை
  rationale: גאל என்ற ஒரே சொற்குடும்பத்தின் மீளுரைப்பைத் தமிழிலும் இயன்றவரை காக்கிறது. பெயர்ச்சொல் வரும் இடத்தில், இது பொதுவான ஆன்மிக ‘மீட்பு’ அல்லாமல் சொத்தை மீட்பதற்கான சட்ட உரிமை என்பதை ‘மீட்புரிமை’ தெளிவாக்குகிறது.
- source_word: לִי
  choice: எனக்காக
  rationale: தனக்கான நலன் அல்லது விளைவைச் சுட்டும் எபிரெய தத்திவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: פֶּן
  choice: அப்படிச் செய்தால்
  rationale: எதிர்பார்க்கப்படும் பாதக விளைவை நவீன தமிழில் இயல்பாகக் காட்டுகிறது; ‘அப்படி ஆகாதபடிக்கு’ போன்ற செயற்கையான அமைப்பைத் தவிர்க்கிறது.
- source_word: אַשְׁחִית
  choice: சீர்குலைத்துவிடுவேன்
  rationale: இங்கு முழுமையாக அழிப்பது அல்ல, ஒருவருடைய பரம்பரைச் சொத்து நிலையைப் பெரிதும் பாதிப்பதே கருத்து. ‘சீர்குலைத்துவிடுவேன்’ அந்தச் சட்டப் பொருளாதாரப் பாதிப்பை வெளிப்படுத்துகிறது.
- source_word: נַחֲלָתִי
  choice: என் சொந்த உரிமைச்சொத்து
  rationale: நிலம் உட்பட பரம்பரையாகக் கிடைக்கும் பிதிரார்ஜிதச் சொத்தை இங்கு குறிக்கிறது. ‘உரிமைச்சொத்து’ நவீன வாசகருக்கு ‘சுதந்தரம்’ என்பதிலுள்ள தெளிவின்மையைத் தவிர்க்கிறது; ‘சொந்த’ என்பது மற்றவரின் மீட்கப்பட வேண்டிய சொத்துடனான வேறுபாட்டை வலியுறுத்துகிறது.
- source_word: לְךָ אַתָּה
  choice: நீரே … உமக்காக
  rationale: தனிப்பட்ட சுட்டுப்பெயரின் வலியுறுத்தலை ‘நீரே’ என்பதும், பயன்/நலனைக் குறிக்கும் தத்திவை ‘உமக்காக’ என்பதும் இயல்பாகக் காட்டுகின்றன.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முன்னர் கூறிய மறுப்புக்கான காரணத்தை மீண்டும் உறுதிப்படுத்தும் இணைப்பைத் தெளிவாகக் காட்டுகிறது.
