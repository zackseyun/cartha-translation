translation_notes:
  register: நவீன நிலையான தமிழில், சட்ட மற்றும் குடும்பப் பின்னணி புரியும்படி மொழிபெயர்க்கப்பட்டுள்ளது. நேரடி உரையில் மரியாதை ஒருமையை வெளிப்படுத்த ‘நீர்/உமது’ நடை பயன்படுத்தப்பட்டுள்ளது; கட்டளை மட்டும் இயல்பான நவீன மரியாதை வடிவில் உள்ளது. மூலத்தில் வெளிப்படையாக இல்லாத ‘ரூத்தை மணத்தல்’ முதன்மை உரைக்குள் சேர்க்கப்படாமல் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது. வழங்கப்பட்ட ஆங்கில அடிக்குறிப்பு குறிகள் அவற்றின் உள்ளடக்கத்துடன் மாறியிருந்ததால், [a] ‘மீட்புரிமையாளர்’ என்பதற்கும் [b] ‘மீட்புரிமை’ என்பதற்கும் பொருத்தமாக அமைக்கப்பட்டுள்ளன.
