  source_fidelity: மூல எபிரெய வம்சவரிசை அமைப்பில் உள்ள இரண்டு ஹிஃபில் הוֹלִיד வினைகளும் ஆண் வழியிலான தலைமுறை உறவைக் குறிக்கின்றன. ‘பெற்றான்’ இச்சூழலில் நிலையான தமிழ் வம்சவரிசைப் பயன்பாடாக இருந்து அந்தப் பொருளைத் துல்லியமாகத் தருகிறது; அடிக்குறிப்பு ஆண்-தந்தை பொருளைத் தெளிவாக்குகிறது. இரண்டாவது இணைப்பை அரைப்புள்ளி வழியாகத் தொடர்வது தமிழில் இயல்பானது; பொருள் இழப்பு இல்லை.
  naturalness: உரை சுருக்கமாகவும் நவீனத் தரத் தமிழில் இயல்பாகவும் உள்ளது. ‘சல்மோன் போவாசைப் பெற்றான்; போவாஸ் ஓபேதைப் பெற்றான்’ என்பது வம்சவரிசைப் பட்டியலுக்கேற்ற இணையான நடை. வேற்றுமை உருபு சேரும் இடங்களில் போவாஸ்/போவாசை, ஓபேத்/ஓபேதை என வரும் வடிவங்கள் தமிழ் எழுத்துப்பெயர்ப்பிலும் வேற்றுமைச் சந்தியிலும் இயல்பானவை.
  terminology: தனிப்பெயர்கள் சல்மோன், போவாஸ், ஓபேத் எனப் பொருத்தமாக எழுத்துப்பெயர்க்கப்பட்டுள்ளன; உரையில் வேற்றுமை உருபுடன் வரும் வடிவங்களும் ஏற்றவை. அடிக்குறிப்பில் ‘தந்தையானான்’ என்பது הוֹלִיד-இன் வம்சவரிசைப் பொருளைச் சரியாகக் காட்டுகிறது.
