lexical_decisions:
- source_word: וְ/שַׂלְמוֹן
  choice: சல்மோன்
  rationale: வம்சவரிசையின் தொடர்ச்சியைத் தமிழில் இயல்பாக வெளிப்படுத்த முந்தைய வசனத்துடனான இணைப்பு தொடரமைப்பால் உணர்த்தப்படுகிறது; பெயர் எபிரெய ஒலிப்புக்கு ஏற்ப எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: הוֹלִיד
  choice: பெற்றான்
  rationale: ילד என்பதன் ஹிஃபில் வடிவம் வம்சவரிசையில் ‘தந்தையானான்/பெறச்செய்தான்’ என்ற பொருளுடையது. ‘பெற்றான்’ என்பது தமிழில் வழக்கமான, சுருக்கமான வம்சவரிசைச் சொல்; அதன் தந்தைவழிப் பொருளை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- source_word: אֶת
  choice: '[மொழிபெயர்க்கப்படவில்லை]'
  rationale: இது குறித்த நேரடிச் செயப்படுபொருளைக் குறிக்கும் எபிரெய இலக்கண உருபு; தமிழில் தனி இணைச்சொல் தேவையில்லை.
- source_word: בֹּעַז
  choice: போவாஸ்
  rationale: எபிரெய தனிப்பெயர் தமிழ் ஒலியமைப்புக்கு ஏற்றவாறு எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: וּ/בֹעַז
  choice: போவாஸ்
  rationale: எபிரெய இணைப்புச் சொல் இரண்டாவது வம்சவரிசைக் கூற்றை இணைக்கிறது; தமிழில் அரைப்புள்ளியும் தொடரமைப்பும் அந்த இணைப்பை இயல்பாக வெளிப்படுத்துவதால் தனியாக ‘மேலும்’ சேர்க்கப்படவில்லை.
- source_word: הוֹלִיד
  choice: பெற்றான்
  rationale: வம்சவரிசையின் இணையான அமைப்பையும் சொற்பயன்பாட்டு ஒருமையையும் காக்க அதே வினைச்சொல் பயன்படுத்தப்பட்டது.
- source_word: עוֹבֵד
  choice: ஓபேத்
  rationale: எபிரெய தனிப்பெயர் தமிழ் ஒலியமைப்புக்கு ஏற்றவாறு எழுத்துப்பெயர்க்கப்பட்டது.
