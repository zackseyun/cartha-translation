  register: நவீனத் தரத் தமிழில் இயல்பாகவும் மரியாதைமிக்கதாகவும் அமைக்கப்பட்டது. வம்சவரிசைக்குரிய சுருக்கத்தையும் இணையான வாக்கிய அமைப்பையும் காக்க ‘பெற்றான்’ பயன்படுத்தப்பட்டுள்ளது; சாத்தியமான தவறான புரிதலைத் தவிர்க்க அதன் தந்தைவழிப் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
