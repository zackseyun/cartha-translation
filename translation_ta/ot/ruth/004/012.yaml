  text: וִ/יהִ֤י בֵֽיתְ/ךָ֙ כְּ/בֵ֣ית פֶּ֔רֶץ אֲשֶׁר יָלְדָ֥ה תָמָ֖ר לִֽ/יהוּדָ֑ה מִן הַ/זֶּ֗רַע אֲשֶׁ֨ר יִתֵּ֤ן יְהוָה֙ לְ/ךָ֔ מִן הַֽ/נַּעֲרָ֖ה הַ/זֹּֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/012.yaml
  text: And may your house be like the house of Perez[a], whom Tamar bore to Judah[b], from the offspring that Yahweh will give you by this young woman.
translation:
  language: ta
  text: யூதாவுக்குத் தாமார் பெற்றெடுத்த பாரேஸின் குடும்பத்தைப்போல, இந்த இளம் பெண்ணின் மூலம் யாவே உனக்குக் கொடுக்கும் சந்ததியால்[a] உன் குடும்பமும் ஆகட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சந்ததி’ என்பதற்கான எபிரேயச் சொல் எழுத்துப்படி ‘விதை’ என்று பொருள்படும்; அது வழித்தோன்றல்களைக் குறிக்கும் பொதுவான மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיהִי
  choice: ஆகட்டும்
  rationale: இங்கு வினை வடிவம் ஆசீர்வாதமாகச் சொல்லப்படும் விருப்பத்தை வெளிப்படுத்துகிறது; ‘ஆகட்டும்’ என்பது தமிழில் இயல்பாகவும் மாண்பாகவும் அதைக் காட்டுகிறது.
- source_word: בֵיתְךָ / כְּבֵית פֶּרֶץ
  choice: உன் குடும்பம் / பாரேசின் குடும்பம்
  rationale: בַּיִת இச்சந்ததி சார்ந்த ஆசீர்வாதத்தில் கட்டிடத்தை அல்ல, குடும்பத்தையும் குடும்ப வழியையும் குறிக்கிறது. தமிழில் ‘வீடு’ ஏற்படுத்தக்கூடிய தெளிவின்மையைத் தவிர்க்க ‘குடும்பம்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: אֲשֶׁר יָלְדָה תָמָר לִיהוּדָה
  choice: யூதாவுக்குத் தாமார் பெற்றெடுத்த
  rationale: எபிரேய உறவுத்தொடரையும் ילד என்ற பேறுபெறுதல் வினையையும் நேரடியாகப் பிரதிபலிக்கிறது.
- source_word: מִן הַזֶּרַע
  choice: சந்ததியால்
  rationale: זֶרַע என்பதன் எழுத்துப்பொருள் ‘விதை’; இங்கு அது குழந்தை அல்லது வழித்தோன்றலைக் குறிக்கிறது. மִן ஒப்பீடு நிறைவேறும் மூலத்தையோ அடிப்படையையோ சுட்டுவதால், காரணத்தை மிகைப்படுத்தாமல் ‘சந்ததியால்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: אֲשֶׁר יִתֵּן יְהוָה לְךָ
  choice: யெகோவா உனக்குக் கொடுக்கும்
  rationale: எதிர்பார்க்கப்படும் இறைக் கொடையை எளிய எதிர்காலத் தொடரால் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: திருப்பெயரை பொதுப்பட்டமாக மாற்றாமல், தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு வடிவில் வழங்குகிறது.
- source_word: מִן הַנַּעֲרָה הַזֹּאת
  choice: இந்த இளம் பெண்ணின் மூலம்
  rationale: נַעֲרָה என்பது இளம் பெண்ணைக் குறிக்கிறது; மִן இங்கு குழந்தையின் தாய்வழி மூலத்தைச் சுட்டுவதால் ‘மூலம்’ இயல்பான தமிழ்.
theological_decisions:
- issue: יְהוָה என்ற இறைத்திருப்பெயரின் மொழியாக்கம்
  choice: யெகோவா
  alternative: யாவே
  rationale: எபிரேய உரையிலுள்ள தனிப்பட்ட இறைத்திருப்பெயரை ‘கர்த்தர்’ போன்ற பட்டமாக மாற்றாமல் ஒலிபெயர்க்கிறது. துல்லியமான பண்டைய உச்சரிப்பு உறுதியாகத் தெரியாததால், தமிழில் பரவலாக அறியப்படும் வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- issue: בֵּית என்பதன் குடும்ப/வம்சப் பொருள்
  choice: குடும்பம்
  alternative: வீடு; குடும்ப வழி; வம்சம்
  rationale: ஆசீர்வாதத்தின் மையம் சந்ததிப் பெருக்கம். ‘குடும்பம்’ இல்லத்தார் மற்றும் குடும்ப வழி ஆகிய நிழற்பொருள்களைத் தாங்குகிறது; ‘வம்சம்’ மட்டும் எனக் குறுக்கவில்லை.
- issue: מִן הַזֶּרַע என்பதன் தொடர்பு
  choice: சந்ததியால்
  alternative: சந்ததியிலிருந்து; விதையிலிருந்து; சந்ததியின் காரணமாக
  rationale: מִן என்பதைக் காரணவுருபாக மட்டும் தீர்மானிக்காமல், கொடுக்கப்படும் சந்ததி வழியாக குடும்பம் பாரேசின் குடும்பத்தைப் போல ஆகும் என்ற மூல/வழிப் பொருளைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரமான, மாண்பான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ஆசீர்வாதத்தின் வாய்மொழித் தன்மையைத் தக்கவைக்க வாக்கியம் ‘ஆகட்டும்’ என முடிகிறது. ‘பாரேஸ்’ என்ற பெயர் எபிரேய פֶּרֶץ (Perets) என்பதற்கான தமிழில் அறியப்பட்ட வடிவில் தரப்பட்டுள்ளது.
