  terminology: ‘குடும்பம்’ is a defensible contextual rendering of בֵּית in this lineage blessing. ‘சந்ததி’ accurately renders זֶרַע in context. The name spelling should be internally consistent; ‘பாரேஸ்’ is used consistently below.
