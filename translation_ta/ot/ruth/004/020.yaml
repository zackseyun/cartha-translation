lexical_decisions:
- source_word: עַמִּינָדָב
  choice: அம்மினதாப்
  rationale: எபிரேய தனிப்பெயரின் ஒலிப்பை நவீனத் தமிழில் இயன்றவரை நெருக்கமாக எழுத்துப்பெயர்த்த வடிவம்.
- source_word: הוֹלִיד
  choice: தந்தையானான்
  rationale: ילד என்பதன் ஹிஃபில் வடிவம் இவ்வம்சவரலாற்றுச் சூழலில் ‘தந்தையானான்’ அல்லது ‘பெற்றான்’ என்று பொருள்படும். ஆண் வழி உறவைத் தெளிவாகவும், ஒரு ஆண் குழந்தையைப் பிரசவித்தான் என்ற தவறான எண்ணத்தைத் தவிர்க்கவும் ‘தந்தையானான்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: אֶת
  choice: '[தனியாக மொழிபெயர்க்கப்படவில்லை]'
  rationale: இது நேரடிச் செயப்படுபொருளைக் குறிக்கும் இலக்கண அடையாளம்; தமிழில் இதற்கு இவ்வாக்கிய அமைப்பில் தனிச் சொல் தேவையில்லை.
- source_word: נַחְשׁוֹן
  choice: நகசோன்
  rationale: எபிரேய தனிப்பெயரின் ஒலிப்பை அடிப்படையாகக் கொண்ட தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: וְ
  choice: ;
  rationale: இணையான இரு வம்சவரலாற்றுக் கூற்றுகளைத் தமிழில் இயல்பாக இணைக்க அரைப்புள்ளி பயன்படுத்தப்பட்டது; எபிரேய இணைப்புச்சொல்லின் தொடர்பு இதன்மூலம் வெளிப்படுகிறது.
- source_word: שַׂלְמָה
  choice: சல்மா
  rationale: இவ்வசனத்தின் மசோரா எபிரேய உரையில் உள்ள שַׂלְמָה என்ற வடிவத்தை நேரடியாக எழுத்துப்பெயர்க்கிறது; இணை வம்சவரலாறுகளோடு ஒத்திசைக்க ‘சல்மோன்’ என்று மாற்றப்படவில்லை.
