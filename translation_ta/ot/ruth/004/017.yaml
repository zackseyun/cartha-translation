  yaml_path: translation/ot/ruth/004/017.yaml
  text: Then the neighbor women gave him a name[a], saying, “A son has been born to Naomi.” And they named him Obed. He was the father of Jesse, the father of David.
translation:
  language: ta
  text: அப்போது அண்டை வீட்டுப் பெண்கள், “நகோமிக்கு ஒரு மகன் பிறந்திருக்கிறான்” என்று சொல்லி, அவனுக்கு ஒரு பெயர் வைத்தார்கள்.[a] அவனுக்கு ஓபேத் என்று பெயரிட்டார்கள். அவன்தான் ஈசாயின் தந்தை; ஈசாய் தாவீதின் தந்தை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “நகோமிக்கு ஒரு மகன் பிறந்திருக்கிறான்.” நகோமி அந்தக் குழந்தையின் உயிரியல் தாய் என்று பெண்கள் கூறவில்லை; ரூத்தின் குழந்தை வழியாக நகோமியின் குடும்ப வழி மீட்கப்பட்டதை அவர்கள் குறிப்பிடுகிறார்கள்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְּׁכֵנוֹת
  choice: அண்டை வீட்டுப் பெண்கள்
  rationale: பெண்பால் பன்மை வடிவம் அருகில் வசித்த பெண்களைச் சுட்டுகிறது; நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: וַתִּקְרֶאנָה לוֹ שֵׁם
  choice: அவனுக்கு ஒரு பெயர் வைத்தார்கள்
  rationale: ‘அவனுக்காக/அவனுக்கு ஒரு பெயரை அழைத்தார்கள்’ என்ற எபிரெய மொழிவழக்கை இயல்பான தமிழில் பெயரிடும் செயலாகத் தருகிறது; לוֹ என்பதன் மறைமுகப் பொருளையும் காக்கிறது.
- source_word: לֵאמֹר
  choice: என்று சொல்லி
  rationale: பெயரிடுதலுடன் தொடர்புடைய பெண்களின் அறிவிப்பை இயல்பான தமிழ் மேற்கோள் அமைப்பில் அறிமுகப்படுத்துகிறது.
- source_word: יֻלַּד בֵּן לְנָעֳמִי
  choice: நகோமிக்கு ஒரு மகன் பிறந்திருக்கிறான்
  rationale: செயப்பாட்டு வினையையும் לְ மூலம் நகோமி பயனாளி/பெறுபவர் எனக் காட்டப்படுவதையும் காக்கிறது; அவளை உயிரியல் தாய் என்று விளக்கமாக்குவதில்லை.
- source_word: וַתִּקְרֶאנָה שְׁמוֹ עוֹבֵד
  choice: அவனுக்கு ஓபேத் என்று பெயரிட்டார்கள்
  rationale: எபிரெயப் பெயரிடும் சூத்திரத்தை இயல்பான நவீன தமிழில் நேரடியாக வழங்குகிறது.
- source_word: עוֹבֵד
  choice: ஓபேத்
  rationale: தனிப்பெயரை அதன் சாத்தியமான ‘சேவை செய்பவன்’ என்ற பொருளாக மொழிபெயர்க்காமல் ஒலிபெயர்க்கிறது.
- source_word: אֲבִי
  choice: தந்தை
  rationale: ரூத்–ஓபேத்–ஈசாய்–தாவீது என்ற உடனடி வம்சவரிசையில் ‘மூதாதை’ என்பதைக் காட்டிலும் நேரடியான ‘தந்தை’ பொருத்தமானது.
- source_word: יִשַׁי
  choice: ஈசாய்
  rationale: தமிழ் வேதாகம மரபில் அறியப்பட்ட பெயர் வடிவத்தைப் பயன்படுத்துகிறது.
- source_word: דָוִד
  choice: தாவீது
  rationale: தமிழ் வேதாகம மரபில் பரவலாக அறியப்பட்ட பெயர் வடிவத்தைப் பயன்படுத்துகிறது.
theological_decisions:
- issue: ‘நகோமிக்கு ஒரு மகன் பிறந்திருக்கிறான்’ என்ற அறிவிப்பில் நகோமிக்கும் குழந்தைக்கும் உள்ள உறவு
  choice: ‘நகோமிக்கு’ என்ற மூல உரையின் சொல்லாட்சியை முதன்மை உரையில் அப்படியே தக்கவைத்தல்
  alternative: ‘நகோமிக்கு ஒரு பேரன் பிறந்திருக்கிறான்’ அல்லது ‘நகோமி ஒரு மகனைப் பெற்றுக்கொண்டாள்’
  rationale: ரூத்தின் குழந்தை வழியாக நகோமியின் குடும்ப வழி மீட்கப்பட்டதை அண்டை வீட்டுப் பெண்கள் கூறுகின்றனர். ‘பேரன்’ என்று மாற்றுவது இலக்கிய மற்றும் குடும்ப உறவின் திட்டமிட்ட பதற்றத்தைத் தீர்த்துவிடும்; ‘பெற்றாள்’ என்பது உயிரியல் தாய்மை என்ற தவறான எண்ணத்தை உருவாக்கலாம்.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியக்கூடிய ஆனால் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. பெயர்கள் தமிழ் வேதாகம வாசகர்களுக்குப் பழக்கமான வடிவங்களில் தரப்பட்டுள்ளன. [a] குறிப்பு குறிக்கும் கூற்றுக்குப் பின் வைக்கப்பட்டுள்ளது.
