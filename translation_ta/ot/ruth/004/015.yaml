  text: וְ/הָ֤יָה לָ/ךְ֙ לְ/מֵשִׁ֣יב נֶ֔פֶשׁ וּ/לְ/כַלְכֵּ֖ל אֶת שֵׂיבָתֵ֑/ךְ כִּ֣י כַלָּתֵ֤/ךְ אֲֽשֶׁר אֲהֵבַ֨תֶ/ךְ֙ יְלָדַ֔תּ/וּ אֲשֶׁר הִיא֙ ט֣וֹבָה לָ֔/ךְ מִ/שִּׁבְעָ֖ה בָּנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/015.yaml
  text: And he will be to you a restorer of life and a sustainer of your old age[a], for your daughter-in-law, who loves you[c][b], has borne him—she who is better to you than seven sons.
translation:
  language: ta
  text: அவன் உனக்கு வாழ்வை மீட்டுத் தருகிறவனாகவும், உன் முதுமையில்[a] உன்னைப் பேணுகிறவனாகவும் இருப்பான். ஏனெனில், உன்னை நேசிக்கிற உன் மருமகள் அவனைப் பெற்றெடுத்தாள்; அவள் உனக்கு ஏழு மகன்களைவிடச் சிறந்தவள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உன் முதுமையில்’ என்பதற்கான எபிரெயச் சொற்றொடர் நேரடியாக ‘உன் நரைமுடியை’ என்று கூறுகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘ஏழு மகன்கள்’ என்பதில் ஏழு என்ற எண் நிறைவு அல்லது முழுமையை அடிக்கடி உணர்த்துகிறது. அக்காலத்தில் பல மகன்களைப் பெறுவது மிகப்பெரிய ஆசீர்வாதமாகக் கருதப்பட்ட நிலையில், ரூத் நவோமிக்கு அதைவிட மதிப்புள்ளவள் என்பதே கருத்து.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה
  choice: இருப்பான்
  rationale: சூழலில் குழந்தையைப் பற்றிய எதிர்கால விளைவு அல்லது உறுதியான எதிர்பார்ப்பைக் குறிக்கிறது; இயல்பான தமிழில் எதிர்கால வினை வடிவம் பொருத்தமானது.
- source_word: לְמֵשִׁיב נֶפֶשׁ
  choice: வாழ்வைப் புதுப்பிக்கிறவனாக
  rationale: שוב என்பது மீட்டல் அல்லது புதுப்பித்தலைக் குறிக்கிறது; נֶפֶשׁ இங்கு கோட்பாட்டுச் சார்ந்த ‘ஆத்துமா’ என்பதற்குப் பதிலாக நவோமியின் வாழ்க்கை/உயிர்நிலையைச் சுட்டுகிறது.
- source_word: וּלְכַלְכֵּל
  choice: பேணுகிறவனாக
  rationale: כלכל என்பதன் பொருள் தொடர்ந்து ஆதரித்தல், பராமரித்தல், உணவளித்தல் என்பதாகும்; ‘பேணுதல்’ இவற்றை இயல்பான தமிழில் உள்ளடக்குகிறது.
- source_word: אֶת שֵׂיבָתֵךְ
  choice: உன் முதுமையில் உன்னை
  rationale: எபிரெயச் சொல் நேரடியாக ‘உன் நரைமுடி/முதுமை’ எனினும், ஆதரவு பெறும் காலத்தைத் தமிழில் இயல்பாகக் கூற ‘உன் முதுமையில் உன்னை’ என மொழிபெயர்க்கப்பட்டது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: כַלָּתֵךְ
  choice: உன் மருமகள்
  rationale: ரூத்துக்கும் நவோமிக்கும் இடையிலான உறவுக்கான இயல்பான நவீனத் தமிழ்ச் சொல்.
- source_word: אֲשֶׁר אֲהֵבַתֶךְ
  choice: உன்னை நேசிக்கிற
  rationale: நிறைவேற்றப்பட்ட வினை வடிவம் செயலால் நிரூபிக்கப்பட்டு தொடர்ந்து நிலவும் அன்பைக் குறிக்கிறது; நிகழ்காலத் தமிழ் இதைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: יְלָדַתּוּ
  choice: அவனைப் பெற்றெடுத்தாள்
  rationale: ஆண்பால் ஒருமை பின்னொட்டு இப்போது குறிப்பிடப்படும் ஆண் குழந்தையைச் சுட்டுகிறது; கூடுதலாக ‘மகன்’ என்பதைச் சேர்க்காமல் மூலவடிவைப் பின்பற்றுகிறது.
- source_word: אֲשֶׁר הִיא טוֹבָה לָךְ
  choice: அவள் உனக்கு ... சிறந்தவள்
  rationale: מן உடனான טוֹבָה ஒப்பீட்டு மேன்மையை அல்லது மதிப்பைத் தெரிவிக்கிறது; ‘சிறந்தவள்’ அந்த ஒப்பீட்டு வலிமையைப் பாதுகாக்கிறது.
- source_word: מִשִּׁבְעָה בָּנִים
  choice: ஏழு மகன்களைவிட
  rationale: மூலத்தில் பாலினம் தெளிவாக ‘மகன்கள்’ என உள்ளது; ஏழு என்பது நிறைவு அல்லது முழுமையை உணர்த்தும் வழக்கமான எண்ணாகவும் இருக்கிறது.
theological_decisions:
- issue: נֶפֶשׁ என்பதன் பொருள்
  choice: வாழ்வு
  alternative: ஆத்துமா; உயிர்; சுயம்
  rationale: சூழல் நவோமியின் குடும்ப வாழ்வு மீண்டும் மலர்வதையும் எதிர்காலப் பராமரிப்பையும் பற்றியது; உடலிலிருந்து பிரிந்த ஆத்துமா குறித்த கோட்பாட்டை இங்கு புகுத்தக் கூடாது.
- issue: מִשִּׁבְעָה בָּנִים என்ற பாலினக் குறிப்புள்ள ஒப்பீடு
  choice: ஏழு மகன்கள்
  alternative: ஏழு பிள்ளைகள்
  rationale: எபிரெயம் வெளிப்படையாக ‘மகன்கள்’ என்கிறது; முதுமையில் பாதுகாப்பும் ஆதரவும் அளிப்பவர்கள் மகன்கள் என்ற அக்கால சமூக எதிர்பார்ப்பின் பின்னணியில் இந்த ஒப்பீடு அமைந்துள்ளது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. ‘வாழ்வைப் புதுப்பித்தல்’ என்ற உருவகம் பாதுகாக்கப்பட்டுள்ளது; ‘பேணுதல்’ தொடர்ந்த பராமரிப்பு மற்றும் ஆதரவை வெளிப்படுத்துகிறது. முதுமை குறித்த நேரடி எபிரெய உருவகம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
