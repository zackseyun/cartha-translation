  text: Then Naomi took the child and laid him in her lap[a], and she became his nurse.
translation:
  language: ta
  text: பின்பு நகோமி அந்தக் குழந்தையை எடுத்துத் தன் மடியில் வைத்தாள்; அவனைப் பராமரித்து வளர்ப்பவளானாள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனுக்குச் செவிலித்தாயானாள்.” எபிரெயச் சொல் ஒரு குழந்தையைப் பேணி, வளர்த்து, பராமரிக்கும் பெண்ணைக் குறிக்கிறது; மருத்துவச் செவிலியரை அல்ல.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקַּח
  choice: எடுத்தாள்
  rationale: לקח என்ற வினை இங்கு குழந்தையைத் தன்னிடம் எடுத்துக்கொண்ட உடல்சார்ந்த செயலை நேரடியாகக் குறிக்கிறது.
- source_word: הַיֶּלֶד
  choice: அந்தக் குழந்தையை
  rationale: יֶלֶד என்பதற்கு ‘குழந்தை’ அல்லது ‘சிறுவன்’ எனப் பொருள் கொள்ளலாம்; சூழலில் புதிதாகப் பிறந்த குழந்தை என்பதால் ‘குழந்தை’ இயல்பானது.
- source_word: וַתְּשִׁתֵהוּ
  choice: வைத்தாள்
  rationale: שׁית என்ற வினையின் ‘வை/இடம் செய்’ என்ற அடிப்படைப் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: בְחֵיקָהּ
  choice: தன் மடியில்
  rationale: חֵיק என்பது மார்பணை அல்லது மடிப் பகுதியைக் குறிக்கலாம்; குழந்தையை வைத்துக்கொள்ளும் காட்சிக்கு ‘மடியில்’ என்பது தெளிவான, இயல்பான நவீனத் தமிழ்.
- source_word: וַתְּהִי לוֹ
  choice: அவனைப் … ஆனாள்
  rationale: היה + ל அமைப்பு ஏற்பட்ட புதிய உறவையோ பொறுப்பையோ குறிக்கிறது; தமிழில் ‘ஆனாள்’ அதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לְאֹמֶנֶת
  choice: பராமரித்து வளர்ப்பவளானாள்
  rationale: אֹמֶנֶת என்பது குழந்தையைப் பேணி வளர்க்கும் பெண்ணைக் குறிக்கிறது. ‘செவிலித்தாய்’ பாலூட்டுதலை அல்லது மருத்துவச் செவிலியரை நினைவூட்டக்கூடும் என்பதால், இச்சொற்றொடர் அதன் பரந்த பராமரிப்பு மற்றும் வளர்ப்பு நுண்ணுணர்வைத் தெளிவாகத் தருகிறது.
