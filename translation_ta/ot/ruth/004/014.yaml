base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/014.yaml
  text: Then the women said to Naomi[a], “Blessed be Yahweh, who has not left you without a redeemer today[c][b], and may his name be renowned in Israel.”
translation:
  language: ta
  text: அப்போது பெண்கள் நகோமியிடம், “இன்று உனக்கு மீட்பர்[a][b] இல்லாமல் இருக்கவிடாத யாவே போற்றப்படுவாராக! அவருடைய பெயர் இஸ்ரவேலில் புகழ்பெறுவதாக![c]” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மீட்பர்’ என்பதற்கு ‘மீட்கும் நெருங்கிய உறவினர்’ அல்லது ‘குடும்பக் காவல்-மீட்பர்’ என்றும் பொருள் கொள்ளலாம். குடும்பத்தின் சொத்து, வழித்தொடர், நலன் ஆகியவற்றை மீட்டுக் காக்கும் நெருங்கிய உறவினரின் சட்டப்பூர்வப் பங்கை இச்சொல் சுட்டுகிறது.
    reason: lexical_alternative
  - marker: b
    text: இங்கு ‘மீட்பர்’ என்பது நகோமியின் வாழ்வை மீண்டும் நிலைநிறுத்தப்போகும் புதிதாகப் பிறந்த குழந்தையை நேரடியாகக் குறிக்கலாம். வேறு சிலர், இவ்வதிகாரத்தில் மீட்பராகச் செயல்பட்ட போவாஸின் பங்கையும் இது உள்ளடக்குவதாகப் புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
  - marker: c
    text: எபிரெயத்தில் சொற்சொல்லாக, ‘அவருடைய பெயர் இஸ்ரவேலில் அழைக்கப்படுவதாக.’ அதாவது, அவருடைய பெயர் இஸ்ரவேலில் அறியப்பட்டு, எடுத்துரைக்கப்பட்டு, மதிக்கப்படுவதாக.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמַרְנָה
  choice: அப்போது ... என்றார்கள்
  rationale: தொடர்ச்சியான கதை நிகழ்வை இயல்பான நவீனத் தமிழில் காட்டுகிறது; பெண்பால் பன்மை வினை வடிவத்தின் பொருள் ‘பெண்கள்’ என்ற எழுவாயால் தெளிவாகிறது.
- source_word: הַנָּשִׁים
  choice: அந்தப் பெண்கள்
  rationale: எபிரெய definite article-ஐச் சூழலுக்கு இயல்பாக ‘அந்த’ என்று வெளிப்படுத்தி, அங்கு இருந்த சமூகப் பெண்களைக் குறிக்கிறது.
- source_word: בָּרוּךְ יְהוָה
  choice: யாவே போற்றப்படுவாராக
  rationale: எபிரெய ஆசீர்வாதப் புகழுரை வடிவத்தைத் தக்கவைத்து, தெய்வீகப் பெயர் יהוה-ஐ ஒரு பட்டத்தால் மாற்றாமல் ‘யாவே’ என ஒலிபெயர்க்கிறது.
- source_word: אֲשֶׁר לֹא הִשְׁבִּית לָךְ
  choice: உனக்கு ... இல்லாமல் விட்டுவிடாத
  rationale: שבת என்பதன் Hiphil வடிவம் இங்கு ஒருவரை மீட்பர் இல்லாத நிலையில் விடாதிருப்பதைக் குறிக்கிறது; சொற்சொல் அமைப்பை விட இந்தத் தமிழ் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: גֹּאֵל
  choice: மீட்பர்
  rationale: குடும்பத்தின் உரிமையையும் வழித்தொடரையும் காத்து மீட்டெடுக்கும் நெருங்கிய உறவினரின் சட்ட-குடும்பப் பங்கை உள்ளடக்கும் முக்கியச் சொல். முதன்மை உரையில் சுருக்கமான ‘மீட்பர்’ வைக்கப்பட்டு, விரிவான நுட்பம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: הַיּוֹם
  choice: இன்று
  rationale: காலத்தைக் குறிக்கும் சொல்லின் நேரடியான, இயல்பான நவீனத் தமிழ் இணை.
- source_word: וְיִקָּרֵא שְׁמוֹ
  choice: அவருடைய பெயர் ... புகழ்பெறுவதாக
  rationale: ‘அவருடைய பெயர் அழைக்கப்படுவதாக’ என்ற சொற்சொல் மொழிபெயர்ப்பை விட, இவ்வாழ்த்தில் பெயர் அறியப்பட்டு மதிக்கப்பட வேண்டும் என்ற கருத்தை இயல்பாகத் தருகிறது.
- source_word: בְּיִשְׂרָאֵל
  choice: இஸ்ரவேலில்
  rationale: அந்தப் பெயர் அறியப்பட்டு மதிக்கப்படும் வட்டாரத்தை நேரடியாகக் குறிக்கிறது.
theological_decisions:
- issue: גֹּאֵל (‘மீட்பர்’) யாரைக் குறிக்கிறது?
  choice: முதன்மை உரையில் ‘மீட்பர்’ என்று மட்டும் வைத்து, அது புதிதாகப் பிறந்த குழந்தையையா போவாசையா குறிக்கிறது என்பதைத் தீர்மானிக்காமல் விடுதல்.
  alternative: அது குறிப்பாகப் புதிதாகப் பிறந்த ஓபேதைக் குறிக்கிறது; அல்லது இவ்வதிகாரத்தில் குடும்ப மீட்பராகச் செயல்பட்ட போவாசைக் குறிக்கிறது.
  rationale: பிறப்பைப் பற்றிய உடனடிச் சூழலும் தொடர்ந்து வரும் ‘அவருடைய பெயர்’ என்பதும் குழந்தையை அண்மைக் குறிப்பாக ஆதரிக்கின்றன. ஆயினும் அதிகாரம் முழுவதிலும் போவாசின் குடும்ப மீட்பர் பங்கு முக்கியமாக இருப்பதால், எபிரெய உரையிலுள்ள உண்மையான குறிப்புத் தெளிவின்மையை மொழிபெயர்ப்பு காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் வகையிலும் வழிபாட்டு வாசிப்புக்கேற்ற கண்ணியத்துடனும் அமைக்கப்பட்டுள்ளது. ‘யாவே’ என்பது יהוה என்ற தனிப்பெயரின் ஒலிபெயர்ப்பு. நகோமியிடம் பெண்கள் நேரடியாகப் பேசுவதால் ‘உனக்கு’ பயன்படுத்தப்பட்டுள்ளது; ‘அவருடைய’ என்ற மரியாதை ஒருமை, குறிப்பவரின் அடையாளத்தைத் தீர்மானிக்காமல் காக்கிறது.
