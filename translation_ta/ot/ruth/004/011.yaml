  rationale: “இந்த” நீக்கப்பட்டு, மூலத்தின் குறிப்புத்தன்மை மட்டும் “வரும் பெண்ணை” எனக் காக்கப்பட்டது. இறுதி இரு ஆசீர்வாதங்களும் இணையான விருப்பநிலை வினை வடிவங்களில் அமைக்கப்பட்டன. “வளமுடன் விளங்குவாயாக” சூழலிலுள்ள செழிப்பு/சிறப்பு உணர்வைத் தருகிறது; சொல்லின் பரந்த பொருள் வாய்ப்புகள் அடிக்குறிப்பில் தக்கவைக்கப்பட்டுள்ளன.
