base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/011.yaml
  text: Then all the people who were at the gate[a], and the elders, said, “We are witnesses. May Yahweh make the woman who is coming into your house like Rachel and Leah, who together built up the house of Israel. And may you prosper in Ephrathah and proclaim a name in Bethlehem.”
translation:
  language: ta
  text: அப்போது நகரவாசலில் இருந்த மக்கள் அனைவரும் மூப்பர்களும், “நாங்கள் சாட்சிகள். உன் வீட்டிற்குள் வரும் பெண்ணை, இஸ்ரவேல் வீட்டை இருவருமாகக் கட்டியெழுப்பிய ராகேலையும் லேயாளையும் போல யாவே ஆக்குவாராக! நீ எப்ராத்தாவில் வளமுடன் விளங்குவாயாக[a]; பெத்லெகேமில் பெயர்பெறுவாயாக!” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வீரத்துடன் செயல்படுவாயாக,” “தகுதியை வெளிப்படுத்துவாயாக,” அல்லது “செழிப்படைவாயாக”; இங்குள்ள எபிரேயச் சொற்றொடர் ஆற்றல், வீரம், தகுதி, செல்வம் அல்லது வெற்றிகரமான செழிப்பு ஆகியவற்றைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵדִים
  choice: நாங்கள் சாட்சிகள்
  rationale: எபிரேய மொழியில் பெயர்ச்சொல் மட்டும் வந்தாலும், தமிழில் மறைந்திருக்கும் இணைப்புவினையை வெளிப்படுத்துவது இயல்பான நேரடிக் கூற்றாக அமைகிறது.
- source_word: יִתֵּן יְהוָה
  choice: யாவே ஆக்குவாராக
  rationale: נתן என்பதன் அடிப்படைப் பொருள் ‘கொடு’ என்றாலும், பெண்ணை ராகேலையும் லேயாளையும் போல ஆக்க வேண்டும் என்ற ஆசீர்வாதச் சூழலில் ‘ஆக்குவாராக’ என்பது நோக்கத்தையும் விருப்பநிலையையும் தெளிவாகத் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தலைப்பாக மாற்றாமல், எபிரேய இறைப்பெயரான நான்கெழுத்துப் பெயரைத் தமிழில் ஒலிபெயர்த்துள்ளது.
- source_word: הָאִשָּׁה הַבָּאָה אֶל בֵּיתֶךָ
  choice: உன் வீட்டிற்குள் வரும் இந்தப் பெண்ணை
  rationale: திருமணத்தின் வழியாக வீட்டுக்குள் வருகிற நிகழ்வைச் சுட்டும் பங்கேற்புவினையின் உடனடி உணர்வையும் ‘வீடு’ என்ற உருவகத்தையும் காக்கிறது.
- source_word: אֲשֶׁר בָּנוּ שְׁתֵּיהֶם אֶת בֵּית יִשְׂרָאֵל
  choice: இஸ்ரவேல் வீட்டை இருவருமாகக் கட்டியெழுப்பிய
  rationale: בנה மற்றும் בית ஆகியவற்றின் ‘வீட்டைக் கட்டுதல்’ உருவகத்தைத் தக்கவைத்து, שְׁתֵּיהֶם என்பதை ‘இருவருமாக’ என வெளிப்படுத்துகிறது; இங்கு ‘வீடு’ குடும்பம் அல்லது வம்சத்தையும் குறிக்கிறது.
- source_word: וַעֲשֵׂה חַיִל
  choice: ஆற்றலுடன் விளங்கி
  rationale: חיל என்பதிலுள்ள ஆற்றல், வலிமை, தகுதி, செழிப்பு, சாதனை ஆகிய விரிந்த பொருள் வாய்ப்புகளை ஒரே குறுகிய பொருளுக்குள் அடைக்காமல் தருகிறது.
- source_word: בְּאֶפְרָתָה
  choice: எப்ராத்தாவில்
  rationale: எபிரேய இடப்பெயரைத் தமிழில் தெளிவாக ஒலிபெயர்த்து, இடத்தைக் குறிக்கும் முன்னொட்டையும் இயல்பாக வழங்குகிறது.
- source_word: וּקְרָא שֵׁם
  choice: பெயர்பெறுவாயாக
  rationale: சொல்லுக்குச் சொல் ‘பெயரை அழை/அறிவி’ என்று இருந்தாலும், இச்சூழலில் புகழும் நற்பெயரும் பெறுதல் என்ற எபிரேய மரபுத்தொடரின் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: בְּבֵית לָחֶם
  choice: பெத்லெகேமில்
  rationale: இடப்பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பையும் உள்ளூர் புகழைக் குறிக்கும் இடவுருபையும் பயன்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் பொதுவான பட்டப்பெயர் அல்ல, தனிப்பட்ட உடன்படிக்கைப் பெயரே உள்ளது; எனவே அதைத் தலைப்பால் மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: ‘இஸ்ரவேல் வீட்டைக் கட்டியெழுப்புதல்’ என்ற உருவகம்
  choice: இஸ்ரவேல் வீட்டை இருவருமாகக் கட்டியெழுப்பிய
  alternative: இஸ்ரவேல் குடும்பத்தை உருவாக்கிய
  rationale: வம்சம் உருவானதைக் குறிக்கும் பொருள் தெளிவாக இருந்தாலும், மூலத்தின் ‘வீடு/கட்டுதல்’ உருவகத்தையும் அதன் குடும்ப-தேசிய பரப்பையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ஆசீர்வாதத்தின் உயர்ந்த தொனிக்காக ‘ஆக்குவாராக’, ‘விளங்கி’, ‘பெயர்பெறுவாயாக’ ஆகிய வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. ‘வீட்டைக் கட்டியெழுப்புதல்’ என்ற மூல உருவகம் வாசகருக்குப் புரியும் அளவில் தக்கவைக்கப்பட்டுள்ளது.
