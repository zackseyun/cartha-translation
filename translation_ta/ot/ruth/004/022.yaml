base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/022.yaml
  text: And Obed fathered Jesse[a], and Jesse fathered David.
translation:
  language: ta
  text: ஓபேத் ஈசாயைப் பெற்றான்[a]; ஈசாய் தாவீதைப் பெற்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தந்தையானான்’; எபிரெய வம்சவரிசை மொழிநடையில் இவ்வினைச்சொல் ‘பெற்றான்’, ‘தந்தையானான்’ அல்லது ‘பிறப்பித்தான்’ என்ற பொருளில் பயன்படுத்தப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ
  choice: தொடரிணைப்பு மற்றும் அரைப்புள்ளி
  rationale: எபிரெய இணைப்பிடைச்சொல் வம்சவரிசையின் இறுதிக் கூற்றை முந்தைய பட்டியலுடன் இணைக்கிறது. தமிழில் முதல் வாக்கியத்தின் தொடக்கத்தில் ‘மேலும்’ எனச் சேர்ப்பதைவிட, இயல்பான தொடரோட்டமும் அரைப்புள்ளியும் அதன் பணியைத் தெளிவாக வெளிப்படுத்துகின்றன.
- source_word: עֹבֵד
  choice: ஓபேத்
  rationale: தனிப்பெயர் நவீனத் தமிழ் வேதாகம வழக்கிற்கு ஏற்றவாறு ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: הוֹלִיד
  choice: பெற்றான்
  rationale: ילד என்பதன் ஹிஃபில் வடிவம் வம்சவரிசையில் ‘தந்தையானான்/பெற்றான்’ எனப் பொருள்படுகிறது. ‘பெற்றான்’ என்பது சுருக்கமான, இயல்பான நவீனத் தமிழ்; ஆண் வழி வம்சத் தொடர்பையும் காக்கிறது.
- source_word: אֶת
  choice: தனியாக மொழிபெயர்க்கப்படவில்லை
  rationale: இது நேரடிச் செயப்படுபொருளைக் குறிக்கும் இலக்கணக் குறியீடு; தமிழின் வேற்றுமை அமைப்பில் ‘-ஐ’ மூலம் அதன் பணி வெளிப்படுகிறது.
- source_word: יִשַׁי / יִשָׁי
  choice: ஈசாய்
  rationale: தனிப்பெயர் தமிழில் நிலைபெற்ற வேதாகமப் பெயர் வடிவத்தின்படி வழங்கப்பட்டுள்ளது.
- source_word: דָּוִד
  choice: தாவீது
  rationale: தனிப்பெயர் தமிழில் பரவலாக நிலைபெற்ற வேதாகமப் பெயர் வடிவத்தின்படி வழங்கப்பட்டுள்ளது; செயப்படுபொருள் நிலையில் ‘தாவீதை’ என வருகிறது.
theological_decisions:
- issue: வம்சவரிசை வினைச்சொல்லின் மொழிபெயர்ப்பு
  choice: பெற்றான்
  alternative: தந்தையானான்; பிறப்பித்தான்
  rationale: இந்த வசனம் தாவீதுடன் முடியும் நேரடியான வம்சவரிசைக் கூற்று. ‘பெற்றான்’ என்பது எபிரெயச் சொல்லின் உயிரியல்/வம்சவழிப் பொருளைக் காத்து, பழமையான அல்லது செயற்கையான நடையைத் தவிர்க்கிறது; மூலத்தில் இல்லாத தனிப்பட்ட இறையியல் கருத்தையும் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட வம்சவரிசை நடை பயன்படுத்தப்பட்டுள்ளது. பெயர்கள் தமிழில் நிலைபெற்ற வேதாகம வடிவங்களில் தரப்பட்டுள்ளன. முதல் וְ தனிச் சொல்லாகச் சுமையூட்டாமல், வாக்கியத் தொடர்ச்சியில் பிரதிபலிக்கப்பட்டுள்ளது.
