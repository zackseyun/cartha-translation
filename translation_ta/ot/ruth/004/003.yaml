source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ לַ/גֹּאֵ֔ל חֶלְקַת֙ הַ/שָּׂדֶ֔ה אֲשֶׁ֥ר לְ/אָחִ֖י/נוּ לֶ/אֱלִימֶ֑לֶךְ מָכְרָ֣ה נָעֳמִ֔י הַ/שָּׁ֖בָה מִ/שְּׂדֵ֥ה מוֹאָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/003.yaml
  text: Then he said to the redeemer[a], “Naomi, who has returned from the fields of Moab[c][b], is selling the portion of the field that belonged to our brother Elimelech.”
translation:
  language: ta
  text: அப்போது அவன் மீட்கும் உரிமையுள்ள அந்த உறவினரிடம், “மோவாப் நாட்டிலிருந்து[c] திரும்பிவந்த நகோமி, நம் சகோதரனான எலிமெலேக்குக்குச் சொந்தமான வயலின் பங்கை[a] விற்கிறாள்[b]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “நிலத்துண்டை.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது “விற்றுவிட்டாள்”; எபிரெய வினைவடிவத்தை முடிந்த செயலாகவும் புரிந்துகொள்ளலாம். இங்கு நடந்துகொண்டிருக்கும் சட்டப் பேச்சுவார்த்தையைக் கருத்தில் கொண்டு “விற்கிறாள்” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: alternative_reading
  - marker: c
    text: எபிரெயத்தில் நேரடியாக “மோவாபின் வயல்வெளியிலிருந்து”; இது மோவாப் நாடு அல்லது நிலப்பகுதியைக் குறிக்கும் வழக்கு.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது அவன் ... என்றான்
  rationale: வாவ் தொடர்வினை கதையின் அடுத்த நிகழ்வை முன்னெடுப்பதால், இயல்பான தமிழில் ‘அப்போது’ என்று தரப்பட்டுள்ளது.
- source_word: לַגֹּאֵל
  choice: மீட்கும் உரிமையுள்ள அந்த உறவினரிடம்
  rationale: גֹּאֵל என்பது குடும்பச் சொத்தை மீட்பதற்கான சட்டப்பூர்வ உரிமையும் பொறுப்பும் உள்ள உறவினரைக் குறிக்கிறது. தமிழ் வாசகருக்கு அந்தக் குடும்ப மற்றும் சட்டப் பொருள் தெளிவாக இருக்க இவ்வாறு மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: חֶלְקַת הַשָּׂדֶה
  choice: வயலின் பங்கை
  rationale: חֶלְקָה என்பதன் ‘பங்கு/துண்டு’ என்ற பொருளை எபிரெயச் சொல்லமைப்புக்கு நெருக்கமாகவும் இயல்பான தமிழிலும் தருகிறது.
- source_word: אֲשֶׁר לְאָחִינוּ לֶאֱלִימֶלֶךְ
  choice: நம் சகோதரனான எலிமெலேக்குக்குச் சொந்தமான
  rationale: லாமேத் அமைப்பு உடைமையைக் குறிக்கிறது. ‘நம் சகோதரன்’ என்ற உறவுமுறை மொழி அப்படியே காக்கப்பட்டுள்ளது; சூழலில் அது விரிந்த குல உறவையும் குறிக்கக்கூடும்.
- source_word: מָכְרָה
  choice: விற்கிறாள்
  rationale: எபிரெய நிறைவுவினை வடிவம் ‘விற்றுவிட்டாள்’ என்றும் புரிந்துகொள்ளலாம். ஆனால் நடந்துகொண்டிருக்கும் சட்டப் பேச்சுவார்த்தையில் சொத்து இப்போது விற்பனைக்கு முன்வைக்கப்படுவதை ‘விற்கிறாள்’ இயல்பாக வெளிப்படுத்துகிறது; மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: נָעֳמִי
  choice: நகோமி
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் பெயர்வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: הַשָּׁבָה
  choice: திரும்பிவந்த
  rationale: நகோமியைத் ‘திரும்பிவந்தவள்’ என்று அடையாளப்படுத்தும் எபிரெயப் பெயரெச்சத்தின் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: מִשְּׂדֵה מוֹאָב
  choice: மோவாப் நாட்டிலிருந்து
  rationale: ‘மோவாபின் வயல்/வயல்வெளி’ என்பது மோவாப் நிலப்பகுதியைக் குறிக்கும் எபிரெய வழக்கு. முதன்மை உரையில் இயல்பான தமிழ் தரப்பட்டு, நேரடியான உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
theological_decisions:
- issue: גֹּאֵל என்பவரின் குடும்ப மற்றும் சட்டப் பங்கு
  choice: மீட்கும் உரிமையுள்ள உறவினர்
  alternative: மீட்பாளர்
  rationale: ‘மீட்பாளர்’ மட்டும் என்றால் ஆன்மீகப் பொருள் தேவையின்றி முன்வரலாம். இங்கு குடும்பச் சொத்து தொடர்பான சட்ட உரிமை உடைய உறவினர் என்பதே சூழலின் பொருள்.
translation_notes:
  register: நவீன செந்தமிழ் சார்ந்த, பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளக்கூடிய கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. சட்டப் பின்னணியைத் தெளிவாக்கும் அளவுக்கு மட்டும் ‘மீட்கும் உரிமையுள்ள உறவினர்’ என விரிவாக்கப்பட்டுள்ளது; எபிரெயத்தின் வினைக்காலத் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
