base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/014.yaml
  text: So she lay at his feet until morning[a], and she got up before one man could recognize another. And he said[b], “Do not let it be known that the woman came to the threshing floor.”
translation:
  language: ta
  text: அவள் காலைவரை அவர் கால்மாட்டில் படுத்திருந்தாள். ஒருவரை ஒருவர் அடையாளம் காண முடிவதற்கு முன்பே[a] அவள் எழுந்தாள். அப்போது அவர்[b], “அந்தப் பெண் போரடிக்கும் களத்துக்கு வந்தாள் என்பது தெரியக்கூடாது” என்று சொன்னார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, மங்கலான வெளிச்சத்தில் மக்கள் ஒருவரை ஒருவர் வேறுபடுத்தி அறிய முடிவதற்கு முன்பு. சொல்லுக்குச் சொல், “ஒரு மனிதன் தன் தோழனை அடையாளம் காண்பதற்கு முன்பு.”
    reason: lexical_alternative
  - marker: b
    text: சூழலின்படி பேசியவர் பெரும்பாலும் போவாஸ். ஆனால் எபிரெய உரை, “அவர் சொன்னார்” என்று மட்டுமே கூறுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: מרגלתיו
  choice: அவருடைய காலடியில்
  rationale: இந்தச் சொல் கால்கள் இருக்கும் இடத்தை, அதாவது போவாஸ் படுத்திருந்த இடத்தின் கால் பக்கத்தைக் குறிக்கிறது. ‘காலடியில்’ என்பது இயல்பான தமிழில் இடத்தைக் காட்டுகிறது; தேவையற்ற பாலியல் விளக்கத்தையோ உடல்நிலை விவரத்தையோ சேர்ப்பதில்லை.
- source_word: עד הבקר
  choice: விடியற்காலைவரை
  rationale: அவள் காலை நேரம் வரை அங்கே படுத்திருந்தாள் என்ற காலவரம்பை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: בטרום
  choice: முன்பே
  rationale: அடுத்த நிகழ்வு நடைபெறக்கூடிய நேரத்துக்கு முன்னதாக அவள் எழுந்ததைத் தெளிவாகக் காட்டுகிறது.
- source_word: יכיר
  choice: அடையாளம் காண முடிவதற்கு
  rationale: மங்கலான வெளிச்சத்தில் ஒருவரை அடையாளம் காண இயலாத நிலையைச் சுட்டும் சாத்தியப்பொருளைத் தக்கவைக்கிறது.
- source_word: איש את רעהו
  choice: ஒருவரை ஒருவர்
  rationale: எபிரெயச் சொற்றொடரின் பரஸ்பரப் பொருளை இயல்பான தமிழில் தருகிறது. அது குறைந்த வெளிச்சத்தில் மக்கள் ஒருவரையொருவர் வேறுபடுத்தி அறியும் நிலையைச் சுட்டுகிறது.
- source_word: אל יוודע
  choice: தெரியக்கூடாது
  rationale: செய்தி வெளிப்படாமல் இருக்க வேண்டும் என்ற எதிர்மறை விருப்பம் அல்லது தடையைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது; செயப்பாட்டு நுணுக்கமும் காக்கப்படுகிறது.
- source_word: האשה
  choice: அந்தப் பெண்
  rationale: எபிரெயத்தில் உள்ள குறிப்பிட்ட சுட்டைத் தமிழில் இயல்பாக வெளிப்படுத்தி, சூழலில் ரூத்தைச் சுட்டுகிறது; எனினும் பெயரைச் சேர்ப்பதில்லை.
- source_word: הגרן
  choice: களத்துமேடு
  rationale: தானியத்தைப் போரடித்து தூற்றும் வேளாண் இடத்திற்கான புரிந்துகொள்ளத்தக்க தமிழ்ச் சொல்.
- source_word: ויאמר
  choice: அப்போது அவர் ... என்று சொன்னார்
  rationale: எபிரெயம் ஆண்பால் ஒருமை வினையால் பேச்சாளரை மட்டும் மறைமுகமாகக் காட்டுகிறது. சூழலில் போவாஸ் எனத் தெரிந்தாலும், மூலத்தில் இல்லாத பெயரைச் சேர்க்காமல் ‘அவர்’ என மொழிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: ויאמר என்பதன் பேச்சாளர் யார்?
  choice: முதன்மை உரையில் ‘அவர்’ என்று மட்டும் தருதல்
  alternative: தெளிவுக்காக ‘போவாஸ்’ என்று பெயரிட்டு மொழிபெயர்த்தல்
  rationale: சூழல் போவாஸையே வலுவாகச் சுட்டினாலும் எபிரெய உரை பெயரைக் கூறவில்லை. மூலத்தின் மறைமுகத்தன்மையைப் பாதுகாக்கப் பெயர் சேர்க்கப்படவில்லை; அடிக்குறிப்பில் வாய்ப்புள்ள அடையாளம் தெரிவிக்கப்படுகிறது.
- issue: ரூத் போவாஸின் காலடியில் படுத்திருந்ததன் ஒழுக்க அல்லது பாலியல் உட்பொருள்
  choice: ‘அவருடைய காலடியில் படுத்திருந்தாள்’ என்ற நேரடியான இடவியல் விளக்கத்தை மட்டும் தருதல்
  alternative: பாலுறவைச் சுட்டும் மறைமொழியைச் சேர்த்தல் அல்லது எந்தப் பாலியல் நிகழ்வும் இல்லை என்று விளக்கமாக மறுத்தல்
  rationale: இவ்வசனம் இடத்தையும் நேரத்தையும் மட்டுமே விவரிக்கிறது; பாலியல் செயலை வெளிப்படையாகச் சொல்வதுமில்லை, அதை வெளிப்படையாக மறுப்பதுமில்லை. ஆகவே உரையின் பதற்றமும் தெளிவின்மையும் தீர்த்துவைக்கப்படவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், இயல்பான மற்றும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘களத்துமேடு’ வேளாண் சூழலைத் தக்கவைக்கிறது. மரியாதை ஒருமையான ‘அவர்’ தமிழ் உரையில் இயல்பாகப் போவாஸைச் சுட்டினாலும், அவரது பெயரை மூலத்தை மீறிச் சேர்ப்பதில்லை. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
