  text: וְ/עַתָּה֙ כִּ֣י אָמְנָ֔ם כִּ֥י אם גֹאֵ֖ל אָנֹ֑כִי וְ/גַ֛ם יֵ֥שׁ גֹּאֵ֖ל קָר֥וֹב מִמֶּֽ/נִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/012.yaml
  text: And now[a], it is true that I am a redeemer[b], yet there is also a redeemer closer than I.
translation:
  language: ta
  text: இப்போதோ, நான் குடும்ப மீட்பராக இருப்பது உண்மைதான்; ஆனால், என்னைவிட நெருங்கிய[b] ஒரு குடும்ப மீட்பர்[a] இருக்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘குடும்ப மீட்பர்’ என்பது குடும்பச் சொத்து, குடும்பத் தொடர்ச்சி போன்றவற்றைக் காக்கும் அங்கீகரிக்கப்பட்ட மீட்புப் பொறுப்புகளும் உரிமைகளும் உடைய நெருங்கிய உறவினரைக் குறிக்கிறது. இதை ‘மீட்கும் உரிமையுள்ள உறவினர்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இங்கு ‘நெருங்கிய’ என்பது இடத்தால் அருகில் இருப்பதைக் குறிக்காது; குடும்ப உறவிலும் அதனுடன் தொடர்புடைய மீட்புரிமையின் முன்னுரிமையிலும் போவாஸைவிட நெருங்கியவர் என்பதைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: இப்போது
  rationale: அடுத்த கருத்தை அறிமுகப்படுத்தும் கால மற்றும் உரையாடல் மாற்றத்தை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; தொடக்க வாவைத் தனியே ‘மேலும்’ என்று மொழிபெயர்ப்பது தமிழில் தேவையற்றதாக இருக்கும்.
- source_word: כִּי אָמְנָם כִּי אִם
  choice: என்பது உண்மைதான்
  rationale: போவாஸ் முதலில் ஓர் உண்மையை ஒப்புக்கொண்டு, பின்னர் அதற்கு வரம்பிடும் செய்தியைச் சொல்வதைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: גֹאֵל
  choice: குடும்ப மீட்பர்
  rationale: இச்சொல் பொதுவான ஆன்மிக மீட்பரை அல்ல, குடும்ப உறவின் அடிப்படையில் மீட்புப் பொறுப்பும் உரிமையும் உடைய நெருங்கிய உறவினரைக் குறிக்கிறது. ‘குடும்ப மீட்பர்’ அதன் மீட்பு மற்றும் உறவுமுறை கூறுகளைச் சுருக்கமாகக் காக்கிறது.
- source_word: אָנֹכִי
  choice: நான்
  rationale: தனி நபர்ப் பெயர்ச்சொல் வலியுறுத்தும் எழுவாயை வெளிப்படுத்துகிறது; ‘நான் ... என்பது உண்மைதான்’ என்ற அமைப்பு அந்த வலியுறுத்தலை இயல்பாகத் தக்கவைக்கிறது.
- source_word: וְגַם יֵשׁ
  choice: ஆனாலும் ... ஒருவரும் இருக்கிறார்
  rationale: கூட்டிச் சொல்லும் கַּם என்பதையும், முந்தைய கூற்றை வரம்பிடும் சூழல் சார்ந்த எதிர்மறைத் திருப்பத்தையும் ஒருசேரத் தெரிவிக்கிறது.
- source_word: קָרוֹב מִמֶּנִּי
  choice: என்னைவிட நெருங்கிய
  rationale: எபிரெயச் சொல்லின் ஒப்பீட்டு வடிவத்தைப் பாதுகாக்கிறது; இங்கு நெருக்கம் இடத்தைக் குறிக்காமல் உறவுமுறை மற்றும் மீட்புரிமையின் முன்னுரிமையைக் குறிக்கிறது என்பதை அடிக்குறிப்பு விளக்குகிறது.
theological_decisions:
- issue: גֹאֵל என்ற சட்ட-உறவுமுறைச் சொல்லை மொழிபெயர்த்தல்
  choice: குடும்ப மீட்பர்
  alternative: மீட்பர்; மீட்கும் உரிமையுள்ள உறவினர்
  rationale: வசனம் இஸ்ரவேலரின் குடும்ப மீட்புக் கடமைகளையும் உரிமைகளையும் பற்றியது. ‘குடும்ப மீட்பர்’ என்பது மூலச்சொல்லின் மீட்புக் கருத்தைத் தக்கவைத்தபடி, இது உறவுமுறை சார்ந்த பங்கு என்பதையும் வெளிப்படுத்துகிறது; அதன் சட்ட மற்றும் பண்பாட்டுப் பரப்பை அடிக்குறிப்பு விளக்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. பழமையான சட்டச் சொற்களைத் தவிர்த்து, மூலத்தின் குடும்ப-சட்டப் பின்னணியை ‘குடும்ப மீட்பர்’ என்ற சுருக்கமான சொற்றொடராலும் அடிக்குறிப்பாலும் பாதுகாக்கிறது.
