source:
  edition: WLC
  text: וַ/תֹּ֨אמֶר֙ שְׁבִ֣י בִתִּ֔/י עַ֚ד אֲשֶׁ֣ר תֵּֽדְעִ֔י/ן אֵ֖יךְ יִפֹּ֣ל דָּבָ֑ר כִּ֣י לֹ֤א יִשְׁקֹט֙ הָ/אִ֔ישׁ כִּֽי אִם כִּלָּ֥ה הַ/דָּבָ֖ר הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/018.yaml
  text: Then she said[a], “Wait, my daughter, until you learn how the matter will fall out[b], for the man will not rest unless he has settled the matter today.”
translation:
  language: ta
  text: அப்போது அவள், “என் மகளே, இந்தக் காரியம் எப்படி அமையும்[a] என்பதை நீ அறிந்துகொள்ளும்வரை காத்திரு. ஏனெனில், அந்த மனிதர்[b] இந்தக் காரியத்தை இன்றே முடித்துவிடாமல் ஓயமாட்டார்” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மரபுத்தொடர் சொற்சொல்லாக, “காரியம் எப்படி விழும்” என உள்ளது; அதாவது, “காரியம் எப்படி முடிவடையும்” அல்லது “எப்படி அமையும்” என்று பொருள்.
    reason: lexical_alternative
  - marker: b
    text: “அந்த மனிதர்” என்பது சூழலில் போவாசைக் குறிக்கிறது; ஆனால் எபிரெய உரை இங்கு அவரது பெயரைச் சொல்லாமல் பொதுப்பெயரையே பயன்படுத்துகிறது.
    reason: cross_reference
lexical_decisions:
- source_word: שְׁבִי
  choice: காத்திரு
  rationale: இந்தக் கட்டளைச்சொல் நேரடியாக ‘உட்கார்’ அல்லது ‘அங்கேயே இரு’ எனப் பொருள்படலாம். இச்சூழலில் ரூத் அங்கேயே இருந்து முடிவுக்காகக் காத்திருக்க வேண்டும் என்பதே நடைமுறைப் பொருள்; அதனால் இயல்பான தமிழில் ‘காத்திரு’ என மொழிபெயர்க்கப்பட்டது.
- source_word: בִתִּי
  choice: என் மகளே
  rationale: நகோமியின் அன்பான அழைப்பையும் எபிரெய மொழியிலுள்ள தன்மைப் பொருளையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: תֵּדְעִין
  choice: நீ அறிந்துகொள்ளும்வரை
  rationale: இங்கு ידע ஏற்கெனவே அறிந்திருப்பதை அல்ல, நிகழப்போவது பின்னர் தெரியவருவதைச் சுட்டுகிறது.
- source_word: אֵיךְ יִפֹּל דָּבָר
  choice: இந்தக் காரியம் எப்படி அமையும்
  rationale: ‘காரியம் எப்படி விழும்’ என்ற எபிரெய மரபுத்தொடரின் பொருளை இயல்பான நவீனத் தமிழில் தருகிறது; முடிவு இன்னும் தெரியாத நிலையையும் காக்கிறது.
- source_word: הָאִישׁ
  choice: அந்த மனிதர்
  rationale: சூழலில் இது போவாசைக் குறித்தாலும், மூலத்தில் பெயர் சொல்லப்படாமல் திட்டவட்டமான ‘அந்த மனிதன்’ என்ற பெயர்ச்சொல்லே உள்ளது. மரியாதையும் இயல்பும் கருதி ‘அந்த மனிதர்’ பயன்படுத்தப்பட்டது.
- source_word: יִשְׁקֹט
  choice: ஓயமாட்டார்
  rationale: காரியத்தை நிறைவேற்றாமல் அமைதியாகவோ செயலற்றோ இருக்கமாட்டார் என்ற உறுதியான செயல்பாட்டை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כִּי אִם כִּלָּה הַדָּבָר הַיּוֹם
  choice: இந்தக் காரியத்தை இன்றே முடித்துவிடாமல்
  rationale: ‘அவர் இன்றே காரியத்தை முடித்தாலன்றி ஓயமாட்டார்’ என்ற நிபந்தனை-விலக்கு அமைப்பை இயல்பான தமிழில் எதிர்மறை வினையெச்சமாகத் தருகிறது; כִּלָּה என்பதன் ‘முடித்தல்/நிறைவு செய்தல்’ என்ற அடிப்படைப் பொருளையும் காக்கிறது.
- source_word: הַיּוֹם
  choice: இன்றே
  rationale: ‘இன்று’ என்ற காலக் குறிப்புடன், அதே நாளிலேயே செய்து முடிப்பார் எனச் சூழல் உணர்த்தும் வலியுறுத்தலைத் தமிழின் ‘ஏ’ விகுதி இயல்பாக வெளிப்படுத்துகிறது.
