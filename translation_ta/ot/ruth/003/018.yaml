translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. நகோமியின் அன்பான அழைப்பு பாதுகாக்கப்பட்டுள்ளது. சட்ட-குடும்பச் சார்ந்த நிலுவைக் காரியத்தை தேவையற்ற விளக்கமின்றி ‘இந்தக் காரியம்’ என்றே வைத்துள்ளோம்; போவாசின் உறுதியான உடனடி நடவடிக்கை ‘இன்றே…முடித்துவிடாமல் ஓயமாட்டார்’ என்பதில் வெளிப்படுகிறது.
