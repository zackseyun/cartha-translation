base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/015.yaml
  text: Then he said[a], “Bring the cloak that is on you and hold it out.” So she held it out, and he measured six measures of barley and put it on her[b]. Then he went into the city.
translation:
  language: ta
  text: அப்போது அவன், “நீ போர்த்தியிருக்கும் மேலாடையை எடுத்து, அதை விரித்துப் பிடி” என்றான். அவள் அதை விரித்துப் பிடித்தாள். அவன் ஆறு அளவு வாற்கோதுமையை[a] அளந்து, அவள்மேல் வைத்தான். பின்பு அவன் நகரத்திற்குள் சென்றான்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘ஆறு வாற்கோதுமை’ என்று உள்ளது; அளவின் அலகு குறிப்பிடப்படவில்லை. தெளிவுக்காக ‘அளவு’ சேர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: சில பழங்கால மொழிபெயர்ப்புகளும் பல நவீன மொழிபெயர்ப்புகளும், ‘பின்பு அவள் நகரத்திற்குள் சென்றாள்’ என்று வாசிக்கின்றன. மசோரா உரையோ, ‘பின்பு அவன் நகரத்திற்குள் சென்றான்’ என்று வாசிக்கிறது.
    reason: textual_variant
lexical_decisions:
- source_word: הָבִי
  choice: எடுத்து
  rationale: பெண்பால் ஒருமை கட்டளை வடிவம்; ரூத் தன் மேல் போர்த்தியிருந்த ஆடையை போவாசிடம் நீட்டும்படி கேட்கப்படும் சூழலில், ‘எடுத்து’ என்பது இயல்பான தமிழாகும்.
- source_word: הַמִּטְפַּחַת
  choice: மேலாடை
  rationale: தானியத்தைத் தாங்கக்கூடிய போர்வை போன்ற வெளிப்புற ஆடையை இச்சொல் குறிக்கிறது. நவீன வாசகரைத் தவறாக வழிநடத்தக்கூடிய ‘முகத்திரை’ என்பதற்குப் பதிலாக ‘மேலாடை’ பொருத்தமானது.
- source_word: וְאֶחֳזִי בָהּ
  choice: அதை விரித்துப் பிடி
  rationale: אחז என்பதன் அடிப்படைப் பொருள் ‘பிடி’. தானியத்தை அதில் வைப்பதற்காக ஆடையைப் பிடித்து விரிக்கும் சூழலை ‘விரித்துப் பிடி’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיָּמָד
  choice: அளந்து
  rationale: தானியத்தை அளந்து ஒதுக்கிக் கொடுக்கும் செயலை நேரடியாகக் காக்கிறது.
- source_word: שֵׁשׁ שְׂעֹרִים
  choice: ஆறு அளவு வாற்கோதுமையை
  rationale: எபிரெயத்தில் அளவின் அலகு குறிப்பிடப்படாமல் ‘ஆறு வாற்கோதுமை’ என்று உள்ளது. தமிழில் பொருள் தெளிவாக இருக்க ‘அளவு’ சேர்க்கப்படுகிறது; குறிப்பிட்ட ஓர் அலகை ஊகிக்கவில்லை.
- source_word: וַיָּשֶׁת עָלֶיהָ
  choice: அவள்மேல் வைத்தான்
  rationale: அளக்கப்பட்ட தானியச் சுமையை ரூத் சுமப்பதற்காக அவள்மேல் வைத்த செயலை எளிமையாகவும் நேரடியாகவும் தெரிவிக்கிறது.
- source_word: וַיָּבֹא הָעִיר
  choice: அவன் நகரத்திற்குள் சென்றான்
  rationale: மசோரா உரையில் வினைச்சொல் ஆண்பாலில் உள்ளது; ஆகவே அதன் இயல்பான எழுவாய் ‘அவன்’ என முதன்மை உரை பின்பற்றுகிறது.
theological_decisions:
- issue: וַיָּבֹא הָעִיר என்ற இறுதி வாக்கியத்தின் எழுவாய்
  choice: அவன் நகரத்திற்குள் சென்றான்
  alternative: அவள் நகரத்திற்குள் சென்றாள்
  rationale: இது கோட்பாட்டுச் சிக்கல் அல்ல; உரைவேறுபாடும் விளக்கச் சிக்கலும் ஆகும். கொடுக்கப்பட்ட மசோரா உரையில் ஆண்பால் வினை இருப்பதால் முதன்மை உரை ‘அவன்’ என்று மொழிபெயர்க்கிறது; பழங்கால மொழிபெயர்ப்புகளில் காணப்படும் பெண்பால் வாசகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘மேலாடை’ ஆடையின் பயன்பாட்டைத் தெளிவாகக் காட்டுகிறது; எபிரெயத்தில் இல்லாத அளவின் குறிப்பிட்ட பெயர் சேர்க்கப்படவில்லை. உரைவேறுபாடு அடிக்குறிப்பில் வெளிப்படையாகத் தரப்பட்டுள்ளது.
