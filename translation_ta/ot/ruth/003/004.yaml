base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/004.yaml
  text: Then[a], when he lies down, note the place where he lies. Then go, uncover his feet, and lie down[b], and he will tell you what you should do.
translation:
  language: ta
  text: அவன் படுத்துக்கொள்ளும்போது, அவன் படுக்கும் இடத்தை நன்றாகக் கவனித்துக்கொள். பிறகு நீ போய், அவனுடைய கால்களை மூடியிருப்பதை விலக்கி[a], படுத்துக்கொள்[b]. நீ என்ன செய்ய வேண்டும் என்பதை அவன் உனக்குச் சொல்வான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு சாத்தியம்: எபிரேயச் சொல் அவனுடைய கால்களை மட்டும் அல்லாமல், அவனுடைய கால்களைச் சுற்றியுள்ள பகுதியையோ படுக்கையின் கீழ்ப்பகுதியையோ குறிக்கக்கூடும்.'
    reason: lexical_alternative
  - marker: b
    text: எழுதப்பட்ட எபிரேய வடிவம் “நான் படுத்துக்கொள்கிறேன்” என்று பொருள்படலாம்; ஆனால் பாரம்பரிய வாசிப்பும் சூழலும் “நீ படுத்துக்கொள்” என்று புரிந்துகொள்கின்றன.
    reason: textual_variant
lexical_decisions:
- source_word: וִיהִי בְשָׁכְבוֹ
  choice: அவன் படுத்துக்கொள்ளும்போது
  rationale: היה வடிவம் இங்கு அடுத்த அறிவுறுத்தலை அறிமுகப்படுத்துகிறது; ב + infinitive construct காலத்தைக் குறிக்கிறது. இயல்பான தமிழில் இரண்டையும் ஒன்றிணைத்து காலப் பொருளுடன் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְיָדַעַתְּ אֶת־הַמָּקוֹם
  choice: அவன் படுக்கும் இடத்தை நன்றாகக் கவனித்துக்கொள்
  rationale: ידע என்பதன் அடிப்படைப் பொருள் ‘அறி’; இச்சூழலில் ரூத் அந்த இடத்தை அடையாளம் கண்டு மனத்தில் வைத்துக்கொள்ள வேண்டும். ‘நன்றாகக் கவனித்துக்கொள்’ நடைமுறைப் பொருளை இயல்பாகத் தருகிறது.
- source_word: וּבָאת
  choice: பிறகு நீ போய்
  rationale: בוא பார்வைநிலைக்கேற்ப ‘வா’ அல்லது ‘போ’ என அமையும். நகோமி ரூத்துக்கு அங்கே செல்லும்படி கூறுவதால் ‘போய்’ இயல்பானது; தொடர்ச்சியை ‘பிறகு’ காட்டுகிறது.
- source_word: וְגִלִּית מַרְגְּלֹתָיו
  choice: அவனுடைய கால்பகுதியைத் திறந்து
  rationale: גלה என்பது ‘மூடியிருப்பதைத் திற/விலக்கு’ எனப் பொருள்படும். מַרְגְּלוֹתָיו என்பது கால்களையோ கால்களைச் சுற்றிய கீழ்ப்பகுதியையோ குறிக்கலாம்; ‘கால்பகுதி’ இந்தச் சொற்பொருள் பரப்பை அளவுக்கு மீறித் தீர்மானிக்காமல் காக்கிறது.
- source_word: וְשָׁכָבְתִּי / וְשָׁכַבְתְּ
  choice: அங்கே படுத்துக்கொள்
  rationale: எழுதப்பட்ட மெய்யெழுத்து வடிவம் முதலாம் நபராகப் புரியக்கூடும்; பாரம்பரிய வாசிப்பும் சூழலும் ரூத்தை நோக்கிய இரண்டாம் நபர் பெண்பால் கட்டளையை ஆதரிக்கின்றன. ‘அங்கே’ தமிழில் செயல் நடைபெறும் இடத்தை இயல்பாக இணைக்கிறது.
- source_word: וְהוּא יַגִּיד לָךְ אֵת אֲשֶׁר תַּעַשִׂין
  choice: நீ என்ன செய்ய வேண்டும் என்பதை அவன் உனக்குச் சொல்வான்
  rationale: נגד என்பதற்கு இங்கு ‘சொல்/தெரிவி’ என்பது நேரான பொருள். அடுத்துச் செய்ய வேண்டிய செயலைக் குறிக்கும் உட்பொருளை ‘செய்ய வேண்டும்’ இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: போவாசின் கால்பகுதியைத் திறந்து அருகே படுப்பதில் உள்ள பாலியல் சார்ந்திருக்கக்கூடிய மறைபொருள்
  choice: செயலை வெளிப்படையாகப் பாலியல் செயலாகவோ முற்றிலும் குற்றமற்ற நடைமுறைச் செயலாகவோ விளக்காமல், எபிரேய உரையின் தெளிவின்மையைத் தக்கவைத்தல்
  alternative: இதைப் பாலியல் அணுகுமுறைக்கான மறைமொழியாக விளக்குதல்; அல்லது போவாசை எழுப்புவதற்கான நடைமுறைச் செயலாக மட்டும் விளக்குதல்
  rationale: எபிரேயச் சொற்கள் கதையியல் பதற்றத்தையும் இருபொருள் வாய்ப்பையும் கொண்டுள்ளன. மொழிபெயர்ப்பு அவற்றில் ஒன்றைத் திணிக்காமல், ‘கால்பகுதியைத் திறந்து… படுத்துக்கொள்’ என்ற நேரடியான ஆனால் இயல்பான சொல்லாக்கத்தைக் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகருக்குப் புரியும் மரியாதையான நடையில் அமைக்கப்பட்டுள்ளது. ‘கால்பகுதி’ என்பது அரிதான உடற்கூறு சொல்லைத் தவிர்த்து மூலத்தின் பொருள் அகலத்தைக் காக்கிறது. நேரடி உரையில் உள்ள அறிவுறுத்தலுக்கேற்ற ஒருமை ‘நீ’ வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன.
