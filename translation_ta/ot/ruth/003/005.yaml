translation:
  language: ta
  text: அவள் அவளிடம், “நீ சொல்வதையெல்லாம் நான் செய்வேன்” என்றாள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: என்றாள்
  rationale: אמר என்பதன் wayyiqtol வடிவம் கதையை அடுத்த நிகழ்வுக்கு நகர்த்தும் எளிய இறந்தகால வினை. தமிழில் நேரடி உரைக்குப் பின் வரும் ‘என்றாள்’ இயல்பாக இதை வெளிப்படுத்துகிறது.
- source_word: אֵלֶיהָ
  choice: அவளிடம்
  rationale: אֶל முன்னிடைச்சொல்லும் மூன்றாம் நபர் பெண்பால் ஒருமை பின்னொட்டும் உரை யாரை நோக்கிச் சொல்லப்பட்டது என்பதைச் சுட்டுகின்றன. ‘அவளிடம்’ என்பது நவீன தமிழில் இயல்பான வடிவம்.
- source_word: כֹּל אֲשֶׁר
  choice: சொல்வதையெல்லாம்
  rationale: முழுமையைக் குறிக்கும் כֹּל மற்றும் தொடர்புத் தொடரான אֲשֶׁר ஆகியவற்றின் பொருளை ‘-வதையெல்லாம்’ இயல்பாகவும் முழுமையாகவும் தருகிறது.
- source_word: תֹּאמְרִי
  choice: நீ சொல்வதை
  rationale: אמר என்பதன் Qal imperfect இரண்டாம் நபர் பெண்பால் ஒருமை வடிவம் நகோமி கூறும் அறிவுறுத்தலைக் குறிக்கிறது. ‘நீ சொல்வதை’ வெளிப்படாத செயப்படுபொருளைச் சேர்க்காமல் மூலத்தைப் பின்பற்றுகிறது.
- source_word: אֶעֱשֶׂה
  choice: நான் செய்வேன்
  rationale: עשה என்பதன் Qal imperfect முதல் நபர் ஒருமை வடிவம் ரூத்தின் உறுதியான நோக்கத்தை வெளிப்படுத்துகிறது. ‘நான் செய்வேன்’ என்பது செயப்படுபொருளைத் தேவையின்றிச் சேர்க்காத நேரடியான மொழிபெயர்ப்பு.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான நேரடி உரை அமைப்பு பயன்படுத்தப்பட்டுள்ளது. ‘அவள் அவளிடம்’ என்பது சூழலைத் தனியே வாசிக்கும்போது சற்றே மீளுரைப்பாகத் தோன்றினாலும், எபிரெய மூலத்தில் உள்ள இரு பெண்பால் சுட்டுதல்களையும் பெயர்களை விளக்கமாகச் சேர்க்காமல் பாதுகாக்கிறது.
