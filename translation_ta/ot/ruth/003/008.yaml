base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/008.yaml
  text: And it happened at midnight that the man trembled and turned himself[a], and behold[b], a woman was lying at his feet.
translation:
  language: ta
  text: நள்ளிரவில் அந்த மனிதன் நடுங்கித் தன்னைத் திருப்பிக்கொண்டான்[a]. இதோ, ஒரு பெண் அவனுடைய காலடியில்[b] படுத்திருந்தாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு வரும் எபிரெய வினைச்சொல் அரிதானது; அவர் திடுக்கிட்டு உடலைத் திருப்பினார், முறுக்கினார் அல்லது வளைத்தார் என்ற பொருளைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘காலடியில்’ என்பதற்கான எபிரெயச் சொல், கால்கள் அல்லது கீழ்க்கால்கள் இருந்த பகுதியைச் சற்றுப் பரந்த விதத்திலும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: நள்ளிரவில்
  rationale: தொடர்ச்சியான எபிரெயக் கதைநடையில் வַיְהִי அடுத்த நிகழ்வை அறிமுகப்படுத்துகிறது. தமிழில் தனியே ‘அது நிகழ்ந்தது’ என்று மொழிபெயர்ப்பது செயற்கையாக இருப்பதால், காலக்குறிப்புடன் இயல்பான கதைத் தொடராக வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: בַּחֲצִי הַלַּיְלָה
  choice: நள்ளிரவில்
  rationale: ‘இரவின் நடுப்பகுதியில்’ என்ற பொருளை இயல்பாகவும் சுருக்கமாகவும் தருகிறது.
- source_word: וַיֶּחֱרַד
  choice: திடுக்கிட்டு
  rationale: חרד திடீர் அதிர்ச்சி அல்லது அச்சத்தால் ஏற்படும் உடல் எதிர்வினையைக் குறிக்கலாம். இச்சூழலில் ‘திடுக்கிட்டு’ இயல்பானது; குறிப்பிட்ட உணர்ச்சியை அளவுக்கு மீறி நிர்ணயிப்பதில்லை.
- source_word: הָאִישׁ
  choice: அந்த மனிதன்
  rationale: சூழலில் ஏற்கெனவே அறிமுகமான போவாசைக் குறிக்கும் குறிப்பிட்ட ஆண் என்பதைக் காட்டுகிறது.
- source_word: וַיִּלָּפֵת
  choice: தன் உடலைத் திருப்பினான்
  rationale: அரிதான இவ்வினைச்சொல் திரும்புதல், உடலை வளைத்தல் அல்லது முறுக்குதல் போன்ற திடீர் அசைவைக் குறிக்கக்கூடும். முதன்மை உரை எச்சரிக்கையான பொதுப் பொருளைத் தருகிறது; ஐயம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: திடீரெனக் கண்டறியும் வியப்பையும் கதைநடையின் கவனஈர்ப்பையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אִשָּׁה
  choice: ஒரு பெண்
  rationale: இச்சூழலில் אִשָּׁה என்பதன் நேரடியான பொருள் ‘பெண்’; ‘மனைவி’ என்பது பொருந்தாது.
- source_word: שֹׁכֶבֶת
  choice: படுத்திருந்தாள்
  rationale: கண்டறியப்பட்ட அந்த நேரத்தில் தொடர்ந்திருந்த உடல்நிலையை எபிரெயப் பெயரெச்ச வினை காட்டுகிறது; ‘படுத்திருந்தாள்’ அதனை இயல்பாகத் தருகிறது.
- source_word: מַרְגְּלֹתָיו
  choice: அவனுடைய கால்மாட்டில்
  rationale: கால்களின் அருகிலுள்ள இடத்தைக் குறிக்கும் சொல்லை இயல்பான தமிழில் தருகிறது; அது கால்கள் அல்லது கீழ்க்கால்களின் பகுதியை விரிவாகக் குறிக்கக்கூடும் என்ற நுணுக்கம் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
theological_decisions:
- issue: காட்சியைப் பாலியல் அல்லது மறைபொருள் சார்ந்து மிகையாக வாசிக்கும் சாத்தியம்
  choice: ரூத் போவாசின் கால்மாட்டில் படுத்திருந்ததாக நேரடியாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘அவனுடைய கால்கள் அல்லது கீழ்க்கால்கள் இருந்த பகுதியில்’ என்று விரிவாக மொழிபெயர்த்து மறைபொருள் சாத்தியத்தை முன்னிறுத்துதல்.
  rationale: எபிரெய உரை எந்தப் பாலியல் செயலையும் வெளிப்படையாகக் கூறவில்லை. ஆகவே கதைத் தளத்தில் உள்ள பதற்றத்தைப் பாதுகாத்து, உரையில் இல்லாத ஒழுக்கவியல் அல்லது கோட்பாட்டுத் தீர்ப்பைச் சேர்க்காமல் இடவியல் நுணுக்கத்தை மட்டும் அடிக்குறிப்பில் குறிப்பிடுகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘இதோ’ என்பது எபிரெய הנה-வின் திடீர் கண்டறிதல் மற்றும் வியப்புச் சக்தியைப் பாதுகாக்கிறது. அரிதான வினைச்சொல்லின் ஐயமும் கால்மாட்டைக் குறிக்கும் சொல்லின் பரப்பும் அடிக்குறிப்புகளில் வெளிப்படையாக வைக்கப்பட்டுள்ளன.
