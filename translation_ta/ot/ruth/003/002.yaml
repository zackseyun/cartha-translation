- source_word: הֲלֹא
  choice: தானே?
  rationale: ஒப்புதலை எதிர்பார்க்கும் எபிரெய வினாவை இயல்பான தமிழ் வினா அமைப்பில் பாதுகாக்கிறது.
- source_word: מֹדַעְתָּנוּ
  choice: நம் உறவினர்
  rationale: இச்சூழலில் வெறும் அறிமுகமானவர் என்பதைக் காட்டிலும் குடும்ப அல்லது குல உறவைக் குறிக்கிறது; சொல்லின் பரந்த பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: אֲשֶׁר הָיִית אֶת נַעֲרוֹתָיו
  choice: நீ யாருடைய இளம்பெண்களோடு இருந்தாயோ
  rationale: ரூத் போவாஸின் பெண் அறுவடைப் பணியாளர்களுடன் இருந்ததை உறவுச் சொல்லமைப்புடன் இயல்பாகத் தருகிறது; נַעֲרוֹתָיו என்பதன் பணியாளர் நுட்பம் அடிக்குறிப்பில் குறிப்பிடப்பட்டுள்ளது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: உடனடியான சூழ்நிலைக்குக் கவனத்தைத் திருப்பும் சுட்டும் வலிமையைத் தக்கவைக்கிறது.
- source_word: זֹרֶה
  choice: தூற்றிக்கொண்டிருக்கிறார்
  rationale: தானியத்திலிருந்து பதரைப் பிரிக்கும் செயலைக் குறிக்கும் சரியான வேளாண் சொல்; எபிரெயப் பங்கேற்பெயரின் நிகழ் அல்லது உடனடி செயற்பாட்டு நுணுக்கத்தையும் தருகிறது.
- source_word: אֶת גֹּרֶן הַשְּׂעֹרִים
  choice: களத்தில் வாற்கோதுமையை
  rationale: சொல்லுக்குச் சொல் அமைப்பில் உள்ள சிரமத்தை இயல்பான தமிழில் வெளிப்படுத்தி, தூற்றப்படுவது வாற்கோதுமை என்றும் செயல் நடைபெறும் இடம் களம் என்றும் தெளிவாக்குகிறது.
- source_word: הַלָּיְלָה
  choice: இன்று இரவு
  rationale: குறிப்பிட்ட இந்த இரவைக் குறிக்கும் காலப் பயன்பாட்டை நவீனத் தமிழில் இயல்பாகத் தருகிறது.
