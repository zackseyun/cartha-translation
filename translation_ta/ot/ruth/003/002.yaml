base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/002.yaml
  text: And now[a], is not Boaz our relative, with whose young women you have been? Look[b], he is winnowing barley at the threshing floor tonight.
translation:
  language: ta
  text: இப்போது, நீ யாருடைய இளம்பெண்களோடு[b] இருந்தாயோ, அந்தப் போவாஸ் நம் உறவினர்தானே?[a] இதோ, அவர் இன்று இரவு களத்தில் வாற்கோதுமையைத் தூற்றிக்கொண்டிருக்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நம் குலத்தைச் சேர்ந்தவர்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் வெறும் அறிமுகமானவரை மட்டுமல்லாமல், குடும்ப அல்லது குல உறவையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: “பெண் பணியாளர்களோடு” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் இச்சூழலில் போவாஸின் இளம் பெண் வேலையாட்கள் அல்லது உதவியாளர்களைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: இப்போது
