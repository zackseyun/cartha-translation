base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/001.yaml
  text: Then Naomi her mother-in-law said to her[a], “My daughter, should I not seek a resting place for you, that it may go well with you?”
translation:
  language: ta
  text: அப்போது அவளுடைய மாமியாரான நகோமி அவளிடம், “என் மகளே, உனக்கு நன்மை உண்டாகும்படி நான் உனக்காக ஓர் இளைப்பாறும் இடத்தைத் தேட வேண்டாமா?[a]” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஓய்வு,’ ‘பாதுகாப்பு’ அல்லது ‘ஒரு வீடு’ என்றும் பொருள்படலாம். இச்சூழலில், திருமணத்தின் மூலம் கிடைக்கக்கூடிய ரூத்தின் நிலையான நல்வாழ்வை நகோமி நாடுவதாகத் தெரிகிறது; ஆனால் எபிரெயத்தில் ‘இளைப்பாறும் இடம்’ என்றே உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: அப்போது ... என்றாள்
  rationale: வாவ் தொடர்வினை கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது; ‘அப்போது’ இயல்பான தமிழ் கதைநடையில் நிகழ்வுத் தொடரை வெளிப்படுத்துகிறது.
- source_word: נָעֳמִי
  choice: நகோமி
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்பட்ட பெயர்வடிவம்.
- source_word: חֲמוֹתָהּ
  choice: அவளுடைய மாமியாரான
  rationale: மூலத்தில் உள்ள உறவுமுறையையும் நகோமியே பேசுகிறாள் என்பதையும் தெளிவாகக் காட்டுகிறது.
- source_word: בִּתִּי
  choice: என் மகளே
  rationale: அன்பும் குடும்ப உறவுணர்வும் கொண்ட நேரடி அழைப்பைச் சேர்த்துப் பொருள் விரிக்காமல் பாதுகாக்கிறது.
- source_word: הֲלֹא
  choice: தேட வேண்டாமா?
  rationale: ஒப்புதலை எதிர்பார்க்கும் எபிரெய வினாவை இயல்பான தமிழ் எதிர்மறை வினாவாகத் தக்கவைக்கிறது.
- source_word: אֲבַקֶּשׁ
  choice: தேட
  rationale: נקשׁ என்பதன் பரந்த ‘தேடுதல்’ பொருளைப் பாதுகாத்து, நகோமியின் திட்டத்தை தேவையின்றி குறிப்பாக்கவில்லை.
- source_word: מָנוֹחַ
  choice: ஓர் இளைப்பாறும் இடம்
  rationale: ஓய்வு, நிலையான பாதுகாப்பு, குடியிருப்பு ஆகிய நுண்பொருள்களை உடைய உருவகத்தைப் பாதுகாக்கிறது; திருமணத்தை நேரடியாக மூலத்தில் சேர்க்கவில்லை.
- source_word: אֲשֶׁר יִיטַב לָךְ
  choice: உனக்கு நன்மை உண்டாகும்படி
  rationale: ரூத்தின் நலனை நோக்கிய பயனைக் குறிக்கும் உட்பொருளை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
