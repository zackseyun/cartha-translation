  register: நவீனத் தரத் தமிழில் எளிதில் புரியக்கூடிய, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘இளைப்பாறும் இடம்’ என்ற மூல உருவகம் முதன்மை உரையில் பாதுகாக்கப்பட்டு, அதன் சூழல்சார் நுண்பொருள்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
