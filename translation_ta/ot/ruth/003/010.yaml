  text: וַ/יֹּ֗אמֶר בְּרוּכָ֨ה אַ֤תְּ לַֽ/יהוָה֙ בִּתִּ֔/י הֵיטַ֛בְתְּ חַסְדֵּ֥/ךְ הָ/אַחֲר֖וֹן מִן הָ/רִאשׁ֑וֹן לְ/בִלְתִּי לֶ֗כֶת אַחֲרֵי֙ הַ/בַּ֣חוּרִ֔ים אִם דַּ֖ל וְ/אִם עָשִֽׁיר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/010.yaml
  text: And he said[a], “May you be blessed by Yahweh, my daughter. You have made this last kindness greater than the first by not going after the young men, whether poor or rich.”
translation:
  language: ta
  text: அவர் அவளிடம், “என் மகளே, நீ யாவேவினால் ஆசீர்வதிக்கப்படுவாயாக! ஏழையோ பணக்காரரோ என்ற வேறுபாடின்றி இளைஞர்களை நாடிச் செல்லாமல் இருந்ததனால், உன் முந்தைய தயவைக் காட்டிலும் இப்போது நீ காட்டிய தயவு இன்னும் சிறந்தது” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּרוּכָה אַתְּ לַיהוָה
  choice: நீ யாவேவினால் ஆசீர்வதிக்கப்படுவாயாக
  rationale: எபிரெய ஆசீர்வாத வாய்பாட்டின் வாழ்த்துத் தன்மையை இயல்பான தமிழில் வெளிப்படுத்துகிறது; தெய்வீகப் பெயர் பட்டப்பெயராக மாற்றப்படாமல் ‘யாவே’ என வழங்கப்படுகிறது.
- source_word: בִּתִּי
  choice: என் மகளே
  rationale: போவாஸ் ரூத்தை அன்போடும் சமூக மற்றும் வயது மூப்பின் நிலையிலிருந்தும் அழைப்பதைச் சொல்லர்த்தத்துடனும் இயல்பாகவும் காக்கிறது.
- source_word: הֵיטַבְתְּ חַסְדֵּךְ הָאַחֲרוֹן מִן הָרִאשׁוֹן
  choice: நீ முன்பு காட்டிய அன்பைவிட இப்போது இன்னும் மேன்மையான அன்பைக் காட்டியிருக்கிறாய்
  rationale: ரூத்தின் தற்போதைய செயலை அவளுடைய முந்தைய அன்புச் செயலோடு ஒப்பிடும் எபிரெயக் கட்டமைப்பைத் தெளிவான நவீன தமிழில் தருகிறது.
- source_word: חַסְדֵּךְ
  choice: அன்பு
  rationale: இங்கு நகோமியின் குடும்பத்திற்காக ரூத் செயலால் வெளிப்படுத்திய பற்றுறுதியும் தாராளமான நன்மையும் குறிக்கப்படுகின்றன. ‘அன்பு’ வாசிப்புக்கு இயல்பானது; சொல்லின் பிற நுணுக்கங்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: לְבִלְתִּי לֶכֶת אַחֲרֵי הַבַּחוּרִים
  choice: இளைஞர்களை நாடிச் செல்லாததால்
  rationale: திருமணத் துணையாக இளைஞர்களைப் பின்தொடராமல் இருந்ததையே காரணமாகக் காட்டும் மூலமொழியின் விளக்கத் தொடர்பையும் சூழல்சார் பொருளையும் வெளிப்படுத்துகிறது.
- source_word: אִם דַּל וְאִם עָשִׁיר
  choice: ஏழையோ பணக்காரனோ
  rationale: இளைஞர்களின் பொருளாதார நிலை எதுவாக இருந்தாலும் என்ற முழுமையான வரம்பைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: கதைச்சூழலில் חֶסֶד என்பதன் மொழிபெயர்ப்பு
  choice: அன்பு
  alternative: தயவு; மாறாத அன்பு; பற்றுறுதி
  rationale: ரூத்தின் செயலில் வெளிப்பட்ட உறவுசார் பற்றையும் தன்னலமற்ற நன்மையையும் ‘அன்பு’ இயல்பாக எடுத்துரைக்கிறது. உடன்படிக்கை சார்ந்த பொருளை அளவுக்கு மீறித் திணிக்காமல், மூலச்சொல்லின் செறிவை அடிக்குறிப்பு காக்கிறது.
- issue: יְהוָה என்ற தெய்வீகப் பெயர்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் நேரடியாக உள்ள நான்கெழுத்துத் தெய்வீகப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல் தமிழில் ஒலிபெயர்த்துக் காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் வடிவமைக்கப்பட்டுள்ளது. போவாஸின் அன்பான அழைப்பும் ஆசீர்வாதத் தொனியும், ரூத்தின் முந்தைய மற்றும் தற்போதைய செயல்களுக்கு இடையிலான ஒப்பீடும் காக்கப்பட்டுள்ளன.
