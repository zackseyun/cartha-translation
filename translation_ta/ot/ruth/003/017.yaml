  text: וַ/תֹּ֕אמֶר שֵׁשׁ הַ/שְּׂעֹרִ֥ים הָ/אֵ֖לֶּה נָ֣תַן לִ֑/י כִּ֚י אָמַ֣ר אַל תָּב֥וֹאִי רֵיקָ֖ם אֶל חֲמוֹתֵֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/017.yaml
  text: She said[a], “He gave me these six measures of barley, for he said, ‘Do not go to your mother-in-law empty-handed.’”
translation:
  language: ta
  text: அவள், “இந்த ஆறு அளவு[a] வாற்கோதுமையை அவர் எனக்குக் கொடுத்தார். ஏனெனில், ‘உன் மாமியாரிடம் வெறுங்கையோடு போகாதே’ என்று அவர் சொன்னார்” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் சொல்லுக்குச் சொல், “இந்த ஆறு வாற்கோதுமைகள்.” குறிப்பிட்ட அளவை அலகு கூறப்படாததால், தெளிவுக்காக “அளவு” சேர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: அவள் ... என்றாள்
  rationale: பெண்பால் ஒருமை வினைச்சொல் ரூத்தின் உரையை அறிமுகப்படுத்துகிறது. எபிரெய தொடர் இணைப்பைத் தமிழில் தனியே மொழிபெயர்க்காமல் இயல்பான கதைநடையில் வழங்கப்பட்டுள்ளது.
- source_word: שֵׁשׁ הַשְּׂעֹרִים הָאֵלֶּה
  choice: இந்த ஆறு அளவு வாற்கோதுமையை
  rationale: שֵׁשׁ என்பது ‘ஆறு’; שְׂעֹרִים என்பது ‘வாற்கோதுமை.’ மூலத்தில் அளவையின் குறிப்பிட்ட அலகு இல்லை. தமிழில் எண்ணிக்கையுடன் இயல்பாகப் புரிய ‘அளவு’ சேர்க்கப்பட்டு, அதன் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: נָתַן לִי
  choice: அவர் எனக்குக் கொடுத்தார்
  rationale: முற்றுப்பெற்ற கொடுத்தல் செயலை இயல்பான தமிழ் இறந்தகாலத்தில் வழங்குகிறது; போவாசைக் குறிக்கும் மரியாதை ஒருமை பயன்படுத்தப்பட்டுள்ளது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: இந்தப் பரிசு கொடுக்கப்பட்டதற்கான காரணத்தை அறிமுகப்படுத்தும் தொடர்பை வெளிப்படுத்துகிறது.
- source_word: אָמַר
  choice: அவர் சொன்னார்
  rationale: ரூத் மேற்கோளிடும் போவாசின் முந்தைய உரையை எளிய இறந்தகாலத்தில் இயல்பாக வழங்குகிறது.
- source_word: אַל תָּבֹאִי
  choice: போகாதே
  rationale: பெண்பால் ஒருமைக்குரிய எதிர்மறைக் கட்டளையைத் தமிழில் நேரடியாக வழங்குகிறது. போவாஸ் ரூத்திடம் அவளுடைய மாமியாரிடம் திரும்புவதைப் பற்றிப் பேசுவதால் ‘போகாதே’ இயல்பானது.
- source_word: רֵיקָם
  choice: வெறுங்கையோடு
  rationale: பரிசோ பொருளோ இல்லாமல் செல்லுதல் என்ற சூழல்சார் பொருளை இயல்பான தமிழ் மரபுத்தொடர் தெரிவிக்கிறது.
- source_word: אֶל חֲמוֹתֵךְ
  choice: உன் மாமியாரிடம்
  rationale: חֲמוֹת என்பது குறிப்பாக ‘மாமியார்’; אֶל இங்கு செல்லும் இலக்கைச் சுட்டுவதால் ‘-இடம்’ உருபால் வழங்கப்பட்டுள்ளது.
