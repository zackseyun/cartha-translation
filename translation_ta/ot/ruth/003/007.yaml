base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/007.yaml
  text: And Boaz ate and drank[a], and his heart was merry, and he went to lie down at the end of the grain heap. Then she came quietly, uncovered his feet[b], and lay down.
translation:
  language: ta
  text: போவாஸ் சாப்பிட்டார், குடித்தார்; அவரது மனம் மகிழ்ந்தது.[a] அவர் தானியக் குவியலின் ஓரத்தில் படுத்துக்கொள்ளச் சென்றார். அப்போது அவள் அமைதியாக வந்து, அவரது கால்களை வெளிப்படுத்தி,[b] படுத்துக்கொண்டாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவரது உள்ளம் களிப்படைந்தது,” அல்லது “அவர் உற்சாகமான மனநிலையில் இருந்தார்.” எபிரெய மரபுத்தொடர் மகிழ்ச்சியைக் குறிக்கிறது; அது தன்னிலேயே அவர் மதுபோதையில் இருந்தார் என்று கட்டாயமாகக் கூறுவதில்லை.
    reason: lexical_alternative
  - marker: b
    text: சொல்லர்த்தமாக, “அவரது கால்களை வெளிப்படுத்தினாள்.” சிலர் இதை ஒரு நேரடியான செயலாகப் புரிந்துகொள்கிறார்கள்; வேறு சிலர் இதில் மறைமுகமான பாலியல் குறிப்பும் இருக்கலாம் எனக் கருதுகிறார்கள். ஆனால் எபிரெய சொல்லாட்சி கட்டுப்படுத்தப்பட்டதாகவே உள்ளது; பாலியல் செயல் நடந்ததாக வெளிப்படையாகக் கூறுவதில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאכַל ... וַיֵּשְׁתְּ
  choice: சாப்பிட்டுக் குடித்தபின்
  rationale: எபிரெய தொடர் நிகழ்வுகளை இயல்பான தமிழ் கதைநடையில் இணைக்கிறது; குடித்ததை மறைக்கவோ, மதுபோதையைச் சேர்க்கவோ இல்லை.
- source_word: וַיִּיטַב לִבּוֹ
  choice: அவரது உள்ளம் மகிழ்ச்சியடைந்தது
  rationale: ‘இருதயம் நன்றாயிற்று/இனிமையாயிற்று’ என்ற எபிரெய மரபுத்தொடரின் மகிழ்ச்சியான மனநிலையைத் தெளிவாகக் காட்டுகிறது; மதுபோதையை அவசியமாகக் குறிக்கவில்லை.
- source_word: וַיָּבֹא לִשְׁכַּב
  choice: படுத்துக்கொள்ளச் சென்றார்
  rationale: இங்கு בוא குறிக்கும் நகர்வை தமிழ் கதைநடைக்கு ஏற்றவாறு ‘சென்றார்’ என்றும், שׁכב என்பதை உறங்கினார் என்று மிகைப்படுத்தாமல் ‘படுத்துக்கொள்ள’ என்றும் தருகிறது.
- source_word: בִּקְצֵה הָעֲרֵמָה
  choice: தானியக் குவியலின் ஓரத்தில்
  rationale: קצה என்பதன் ஓரம்/முனை என்ற பொருளையும், சூழலில் עֲרֵמָה என்பது தானியக் குவியல் என்பதையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בַלָּט
  choice: அமைதியாக
  rationale: மறைவாக அல்லது சத்தமின்றி அணுகியதைச் சொல்கிறது; தேவையற்ற ஒழுக்கத் தீர்ப்பைச் சேர்ப்பதில்லை.
- source_word: וַתְּגַל מַרְגְּלֹתָיו
  choice: அவரது கால்களை மூடியிருந்ததை விலக்கி
  rationale: ‘அவருடைய கால்களை வெளிப்படுத்தினாள்’ என்ற நேரடிப் பொருளை இயல்பான தமிழில் தருகிறது; பாலியல் செயலை வெளிப்படையாகச் சேர்க்காமல் மூலத்தின் கட்டுப்படுத்தப்பட்ட சொல்லாட்சியைப் பேணுகிறது.
- source_word: וַתִּשְׁכָּב
  choice: படுத்துக்கொண்டாள்
  rationale: שׁכב என்பதன் நேரடிப் பொருளைத் தருகிறது; இந்த வசனம் கூறாத பாலியல் தொடர்பை மொழிபெயர்ப்பில் சேர்ப்பதில்லை.
theological_decisions:
- issue: ரூத்தின் செயல் பாலியல் தொடர்பைக் குறிக்கிறதா
  choice: முதன்மை உரையில் நேரடியான செயல்களை மட்டும் கூறி, மூலத்தின் தெளிவின்மையைப் பேணுதல்
  alternative: மயக்குதல் அல்லது பாலியல் தொடர்பு நிகழ்ந்ததாக விளக்கமளிக்கும் மொழிபெயர்ப்பு
  rationale: எபிரெய உரை அவள் அமைதியாக வந்து, போவாசின் கால்களை வெளிப்படுத்தி, படுத்துக்கொண்டாள் என்றே கட்டுப்படுத்தப்பட்ட முறையில் கூறுகிறது. ஆகவே சாத்தியமான குறிப்புணர்வை மறுக்காமலும், வெளிப்படையான பாலியல் செயலைச் சேர்க்காமலும் மொழிபெயர்க்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையான கதைநடை பயன்படுத்தப்பட்டுள்ளது. போவாசைக் குறிக்க மரியாதைப் பன்மை வினைமுற்றுகளும் ‘அவரது’ என்பதும் பயன்படுத்தப்பட்டுள்ளன. மூலத்தின் வரிசை, அமைதி, மற்றும் விளக்கத் தெளிவின்மை இயன்றவரை காக்கப்பட்டுள்ளன.
