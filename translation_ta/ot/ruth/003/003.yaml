base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/003.yaml
  text: Wash yourself[a], anoint yourself, and put your cloak on; then go down to the threshing floor[c][b]. Do not make yourself known to the man until he has finished eating and drinking.
translation:
  language: ta
  text: நீ குளித்து[a], எண்ணெய் பூசிக்கொண்டு, உன் மேலாடையை அணிந்துகொள்[b]. பிறகு களத்துமேட்டிற்கு இறங்கிச் செல்[c]. அந்த மனிதன் உண்டு குடித்து முடிக்கும்வரை உன்னை வெளிப்படுத்தாதே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன்னைக் கழுவிக்கொண்டு.” எபிரெய வினைச்சொல் உடலைக் கழுவுவதையோ குளிப்பதையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உன் ஆடையை அணிந்துகொள்.” எபிரெயச் சொல் பொதுவாக ஓர் ஆடையையோ மேலாடையையோ குறிக்கிறது; சில மொழிபெயர்ப்புகள் இதை இன்னும் குறிப்பாக விழாக்கால ஆடை அல்லது சிறந்த ஆடை என்று பொருள்கொள்கின்றன.
    reason: lexical_alternative
  - marker: c
    text: இங்கே எபிரெய மெய்யெழுத்து வடிவம் வழக்கத்திற்கு மாறானது. சூழலின்படி, ரூத்துக்கு நகோமி தொடர்ந்து கூறும் “களத்துமேட்டிற்கு இறங்கிச் செல்” என்ற அறிவுறுத்தலாக இது பொதுவாகப் புரிந்துகொள்ளப்படுகிறது.
    reason: textual_variant
lexical_decisions:
- source_word: וְרָחַצְתְּ
  choice: நீ குளித்து
  rationale: רחץ உடலைக் கழுவுவதையோ குளிப்பதையோ குறிக்கலாம். இச்சூழலில் ‘குளித்து’ என்பது இயல்பான தமிழாகவும் முழு உடல் தூய்மைப்படுத்தலைக் குறிக்கும் சொல்லாகவும் உள்ளது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וָסַכְתְּ
  choice: எண்ணெய் பூசிக்கொண்டு
  rationale: סוך என்பது உடலில் எண்ணெய் அல்லது நறுமணத் தைலம் பூசுவதைக் குறிக்கிறது. ‘எண்ணெய் பூசிக்கொண்டு’ என்பது ‘நறுமணம் பூசு’ என்ற ஊகத்தைத் தவிர்த்து மூலச்சொல்லின் செயலைத் தெளிவாகக் காட்டுகிறது.
- source_word: וְשַׂמְתְּ שמלתך עָלַיִךְ
  choice: உன் மேலாடையை அணிந்துகொள்
  rationale: שִׂמְלָה பொதுவாக ஆடை அல்லது மேலாடையைக் குறிக்கிறது. ‘மேலாடை’ சாத்தியமான குறிப்பான பொருளைப் பாதுகாக்கிறது; ‘சிறந்த ஆடை’ அல்லது ‘விழா ஆடை’ என்பது எபிரெயத்தில் வெளிப்படையாக இல்லை.
- source_word: וירדתי הַגֹּרֶן
  choice: பிறகு களத்துமேட்டுக்குச் செல்
  rationale: மெய்யெழுத்து வடிவம் வழக்கத்திற்கு மாறானது; சூழலில் நகோமி ரூத்துக்குத் தொடர்ந்து கொடுக்கும் இரண்டாம் நபர் பெண்பால் கட்டளையாகவே பொதுவாகப் புரிந்துகொள்ளப்படுகிறது. גֹּרֶן என்பது தானியத்தைப் போரடிக்கும் களம்; தமிழில் வழக்கமான வேதாகமச் சொல்லான ‘களத்துமேடு’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: אַל תִּוָּדְעִי
  choice: உன்னை வெளிப்படுத்தாதே
  rationale: ידע என்பதன் நிபால் வடிவம் இங்கு தன்னை அறியச் செய்தல் அல்லது தன் இருப்பை வெளிப்படுத்துதல் என்ற பொருளைக் கொண்டுள்ளது. இந்தத் தேர்வு அவள் கவனிக்கப்படாமல் இருக்க வேண்டியதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: לָאִישׁ
  choice: அந்த மனிதனுக்கு
  rationale: சூழல் போவாசைக் குறிப்பிட்டாலும், எபிரெயம் அவரது பெயரைச் சொல்லாமல் ‘அந்த மனிதன்’ என்கிறது. மூலத்தின் சொற்பயன்பாடு பாதுகாக்கப்படுகிறது.
- source_word: עַד כַּלֹּתוֹ לֶאֱכֹל וְלִשְׁתּוֹת
  choice: அவன் உண்டு குடித்து முடிக்கும்வரை
  rationale: כלה மற்றும் வினையெச்சங்கள் செயல்கள் நிறைவடைவதைக் குறிக்கின்றன. ‘முடிக்கும்வரை’ கால எல்லையைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
