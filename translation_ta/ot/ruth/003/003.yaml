translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதில் புரியும், ஆனால் கண்ணியமான நடையைக் கடைப்பிடிக்கிறது. கட்டளைகளின் வரிசை இயல்பான தமிழ் வாக்கியங்களாக அமைக்கப்பட்டுள்ளது. மூலத்தில் இல்லாத ‘சிறந்த ஆடை,’ ‘நறுமணம்,’ அல்லது ‘போவாஸ்’ போன்ற விளக்கங்கள் முதன்மை உரையில் சேர்க்கப்படவில்லை. எல்லா அடிக்குறிப்பு குறிகளும் தொடர்புடைய சொற்றொடர்களுக்குப் பின் முதன்மை உரையில் இடம்பெற்றுள்ளன.
