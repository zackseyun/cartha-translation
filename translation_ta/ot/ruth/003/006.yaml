revisions:
- from: அவள் களத்துமேட்டுக்குச் சென்று, தன் மாமியார் தனக்குக் கட்டளையிட்ட அனைத்தின்படியும் செய்தாள்.[a]
  to: அவள் களத்துமேட்டுக்கு இறங்கி, தன் மாமியார் தனக்குக் கட்டளையிட்ட எல்லாவற்றின்படியும் செய்தாள்.[a]
  rationale: The revision restores the explicit downward movement of וַתֵּרֶד while maintaining clear modern Tamil. It also makes the comprehensive force of כְּכֹל אֲשֶׁר more idiomatic and preserves the stronger sense of צִוַּתָּה (‘commanded’).
