  edition: WLC
  text: וַ/תֵּ֖רֶד הַ/גֹּ֑רֶן וַ/תַּ֕עַשׂ כְּ/כֹ֥ל אֲשֶׁר צִוַּ֖תָּ/ה חֲמוֹתָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/006.yaml
  text: So she went down to the threshing floor and did according to all that her mother-in-law had commanded her[a].
translation:
  language: ta
  text: அவள் களத்துமேட்டுக்கு இறங்கி, தன் மாமியார் தனக்குக் கட்டளையிட்ட எல்லாவற்றின்படியும் செய்தாள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவள் களத்துமேட்டுக்கு இறங்கினாள்; தன் மாமியார் தனக்குக் கட்டளையிட்ட அனைத்தையும் செய்தாள்.”
    reason: ‘இறங்கி’ என்பதற்குப் பதிலாகத் தனி வினையாக ‘இறங்கினாள்’ என்றும், ‘எல்லாவற்றின்படியும்’ என்பதற்குப் பதிலாக ‘அனைத்தையும் செய்தாள்’ என்றும் தமிழில் இயல்பாகச் சொல்லலாம்; இரண்டும் எபிரேயத்தின் கீழ்நோக்கிய இயக்கத்தையும் முழுமையான கீழ்ப்படிதலையும் பேணுகின்றன.
lexical_decisions:
- source_word: וַתֵּרֶד
  choice: சென்று
  rationale: ירד என்பது கீழ்நோக்கிய இயக்கத்தைச் சுட்டுகிறது. தமிழில் இலக்கை நோக்கிச் செல்லும் இந்தச் சூழலில் ‘களத்துமேட்டுக்குச் சென்று’ என்பது இயல்பாக உள்ளது; ‘இறங்கிச் சென்று’ என்பது சாத்தியமானாலும், இங்கு நில அமைப்பு தெளிவாகக் குறிப்பிடப்படாததால் மிகைப்படுத்தப்படவில்லை.
- source_word: הַגֹּרֶן
  choice: களத்துமேடு
  rationale: גֹּרֶן என்பது தானியத்தைப் போரடித்து தூற்றும் வேளாண் இடம். நவீன வாசகருக்கும் புரியக்கூடிய மரபான தமிழ்ச் சொல்லாக ‘களத்துமேடு’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: וַתַּעַשׂ
  choice: செய்தாள்
  rationale: עשה என்ற பொதுவான ‘செய்’ வினை, தொடர்ந்து வரும் கட்டளைகளுக்கு இணங்க நடந்ததைக் குறிக்கும் சொற்றொடரில் நேரடியாகவும் இயல்பாகவும் அமைகிறது.
- source_word: כְּכֹל אֲשֶׁר
  choice: அனைத்தின்படியும்
  rationale: இந்த அமைப்பு முன்பு வழங்கப்பட்ட அறிவுறுத்தல்களின் முழுமைக்கும் இணங்கச் செய்ததைச் சுட்டுகிறது. ‘அனைத்தின்படியும்’ כֹל என்பதன் முழுமையைப் பேணுகிறது.
- source_word: צִוַּתָּה
  choice: கட்டளையிட்ட
  rationale: צוה என்பதன் அடிப்படை வலிமையான பொருள் ‘கட்டளையிடு.’ ‘அறிவுறுத்திய’ என்பதும் சூழலுக்கு ஏற்ற மாற்றாக இருந்தாலும், அது எபிரேயச் சொல்லின் வலிமையைச் சற்றுத் தணிக்கிறது.
- source_word: חֲמוֹתָהּ
  choice: தன் மாமியார்
  rationale: இந்த உறவுமுறைச் சொல் குறிப்பாக ‘அவளுடைய மாமியார்’ என்று பொருள்படுகிறது. தமிழில் எழுவாயான ரூத்தைத் தெளிவாகச் சுட்ட ‘தன்’ பயன்படுத்தப்பட்டது.
- source_word: וַ
  choice: அவள்
  rationale: தொடக்க வாவ் கதைத் தொடர்ச்சியைச் சுட்டுகிறது. தமிழில் தனியான ‘ஆகவே’ அல்லது ‘பின்பு’ சேர்க்காமல் வாக்கியத் தொடர்ச்சியால் அதை இயல்பாக வெளிப்படுத்தலாம்.
