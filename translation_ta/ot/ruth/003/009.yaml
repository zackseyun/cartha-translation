base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/009.yaml
  text: He said[a], “Who are you?” And she said, “I am Ruth, your servant. Spread your wing over your servant[b], for you are a redeemer.”
translation:
  language: ta
  text: அவன், “நீ யார்?” என்று கேட்டான். அதற்கு அவள், “நான் உம்முடைய பணிப்பெண் ரூத். உம்முடைய இறக்கையை உம்முடைய பணிப்பெண்ணின் மேல் விரித்துப் போர்த்துங்கள்[a]; ஏனெனில், நீர் மீட்பர்[b]” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உம்முடைய ஆடையின் ஓரத்தை உம்முடைய பணிப்பெண்ணின் மேல் விரித்துப் போர்த்துங்கள்.’ எபிரெயச் சொல் ‘இறக்கை’ அல்லது ஆடையின் ஓரம் எனப் பொருள்படலாம்; இங்கு அது பாதுகாப்பையும் திருமண வேண்டுகோளையும் ஒருசேர சுட்டக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘உறவுமுறை மீட்பர்’; அதாவது, உறவினருக்காகச் செயல்படும் அங்கீகரிக்கப்பட்ட குடும்பப் பொறுப்பைக் கொண்டவர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי אָתּ
  choice: நீ யார்?
  rationale: எபிரெயக் கேள்வியை இயல்பான நவீனத் தமிழில் நேரடியாகத் தருகிறது.
- source_word: אָנֹכִי רוּת
  choice: நான் உம்முடைய பணிப்பெண் ரூத்
  rationale: பெயர்ச்சொல் வாக்கியத்தைத் தமிழில் இயல்பாக அடையாளப்படுத்துகிறது; அடுத்துள்ள அֲמָתֶךָ என்பதையும் இணைத்துத் தருகிறது.
- source_word: אֲמָתֶךָ / אֲמָתְךָ
  choice: உம்முடைய பணிப்பெண்
  rationale: אמה என்பது பெண் பணியாளைக் குறிக்கிறது. ‘பணிப்பெண்’ ரூத்தின் தாழ்மையான தன்னடையாளத்தையும் பெண்பால் குறிப்பையும் இயல்பாகப் பாதுகாக்கிறது; இரு இடங்களிலும் ஒரேபடி வைக்கப்பட்டுள்ளது.
- source_word: וּפָרַשְׂתָּ
  choice: விரிப்பீராக
  rationale: ஒருவர்மேல் ஒன்றை விரித்துப் போர்த்தும் செயலைக் குறிக்கும் வினையை மரியாதையுடனான வேண்டுகோளாகத் தருகிறது.
- source_word: כְנָפֶךָ
  choice: உம்முடைய இறக்கையை
  rationale: כנף என்பதன் முதன்மையான ‘இறக்கை’ உருவகத்தைப் பாதுகாக்கிறது; ஆடையின் ஓரம் என்ற சாத்தியமான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: עַל
  choice: மேல்
  rationale: பாதுகாப்பாக மூடுதல் அல்லது போர்த்துதல் என்ற காட்சிக்கு இயல்பான தமிழ் இடைச்சொல்.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: ரூத்தின் வேண்டுகோளுக்கான காரணத்தைத் தெளிவாக அறிமுகப்படுத்துகிறது.
- source_word: גֹאֵל
  choice: ஒரு மீட்பர்
  rationale: குடும்ப உறவின் அடிப்படையில் மீட்கும் சட்டப்பூர்வப் பங்கைச் சுருக்காமல், முக்கியமான ‘மீட்பர்’ சொல்லைப் பாதுகாக்கிறது; உறவுமுறை சார்ந்த நுணுக்கம் அடிக்குறிப்பில் விளக்கப்படுகிறது.
theological_decisions:
- issue: ‘உம்முடைய இறக்கை’ என்ற உருவகத்தின் பலஅடுக்கு பொருள்
  choice: முதன்மை உரையில் ‘இறக்கை’ என்ற நேரடி உருவகத்தைத் தக்கவைத்தல்
  alternative: ‘உம்முடைய ஆடையின் ஓரத்தை’ என்று மொழிபெயர்த்து திருமணச் சுட்டை முன்னிலைப்படுத்துதல்
  rationale: எபிரெயச் சொல் பாதுகாப்பு என்ற இறக்கை உருவகத்தையும், உடனடி காட்சியில் ஆடையின் ஓரம் மற்றும் திருமண வேண்டுகோள் சார்ந்த சுட்டையும் ஒருசேர ஒலிக்கச் செய்யலாம். ஒரு பொருளை மட்டும் தீர்மானிக்காமல் முதன்மை உருவகத்தை உரையிலும் மற்ற பொருளை அடிக்குறிப்பிலும் பாதுகாக்கிறது.
- issue: גֹאֵל என்பவரின் குடும்பச் சட்டப்பூர்வப் பங்கு
  choice: முதன்மை உரையில் ‘மீட்பர்’ என்று வைத்து, குடும்ப உறவுப் பொருளை அடிக்குறிப்பில் விளக்குதல்
  alternative: ‘உறவுமுறை மீட்பர்’ அல்லது ‘குடும்ப மீட்பர்’
  rationale: ‘மீட்பர்’ மூலச்சொல்லின் மையமான மீட்பு கருத்தைத் தக்கவைக்கிறது; கூட்டுச்சொல் மூலம் உரையாடலைக் கனமாக்காமல் ரூத் நூலுக்குரிய குடும்பக் கடமை நுணுக்கத்தை அடிக்குறிப்பு வழங்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான உரையாடல் நடை பயன்படுத்தப்பட்டுள்ளது. போவாசை நோக்கிய ரூத்தின் மரியாதை ‘உம்முடைய’, ‘விரிப்பீராக’, ‘நீர்’ என்பவற்றால் வெளிப்படுத்தப்பட்டுள்ளது. மூலத்தின் உருவகத் தெளிவின்மை அடிக்குறிப்புகளுடன் பாதுகாக்கப்பட்டுள்ளது.
