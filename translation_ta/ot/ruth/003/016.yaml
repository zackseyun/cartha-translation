  source_fidelity: முதன்மை உரை எபிரெய வினைத் தொடரையும், மாமியார் என்ற உறவையும், ‘நீ யார்?’ என்ற திட்டமிட்ட தெளிவின்மையையும், பெயரிடப்படாத ‘அந்த மனிதன்’ என்பதையும் சரியாகக் காக்கிறது. ஆனால் இறுதி வாக்கியத்தில் ‘தனக்காக’ என்பது தமிழில் எழுவாயான ரூத்தையே சுட்டுவது போல் இலக்கணரீதியாகப் படிக்க வாய்ப்புள்ளது; மூலத்தில் לָהּ ரூத்தைச் சுட்டுவதைத் தெளிவுபடுத்துதல் பாதுகாப்பானது.
  naturalness: ‘மாமியார் அவளிடம்’ என்பதற்குப் பதில் ‘அவளுடைய மாமியார் அவளிடம்’ என அமைத்தால் உரையாடுபவர் தெளிவாகவும் நடை சீராகவும் இருக்கும். அடிக்குறிப்பின் மாற்று வாசகம் ‘உனக்கு எப்படி நடந்தது?’ என்பது ஆங்கில audit trail-இன் ‘How did it go with you?’ என்ற விளக்கத்தை இயல்பாகவும் குறைந்த அளவு விளக்கத்துடனும் தருகிறது.
