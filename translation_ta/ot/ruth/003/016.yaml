base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/016.yaml
  text: When she came to her mother-in-law[a], she said, “Who are you, my daughter?” Then she told her all that the man had done for her.
translation:
  language: ta
  text: அவள் தன் மாமியாரிடம் வந்தபோது, அவளுடைய மாமியார் அவளிடம், “என் மகளே, நீ யார்?”[a] என்று கேட்டாள். பின்பு அந்த மனிதன் அவளுக்காகச் செய்த அனைத்தையும் அவள் தன் மாமியாரிடம் சொன்னாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, பொருளை விளக்கிக் கூறினால், “என் மகளே, உனக்கு எப்படி நடந்தது?” எபிரெயத்தில் சொல்லுக்கு சொல், “என் மகளே, நீ யார்?” என்று உள்ளது. போவாசைச் சந்தித்த பிறகு ரூத்தின் நிலை மாறியுள்ளதா அல்லது அந்தச் சந்திப்பு எப்படி முடிந்தது என்பதைக் குறித்த கேள்வியாக இது இருக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתָּבוֹא אֶל חֲמוֹתָהּ
  choice: அவள் தன் மாமியாரிடம் வந்தபோது
  rationale: בוא வருதலைக் குறிக்கிறது; חמות என்பது குறிப்பாக ‘மாமியார்’. தொடரும் உரையுடன் இயல்பாக இணைக்க ‘வந்தபோது’ என மொழிபெயர்க்கப்பட்டது.
- source_word: וַתֹּאמֶר
  choice: மாமியார் அவளிடம் ... என்று கேட்டாள்
  rationale: எபிரெய உரையில் வினைச்சொல்லின் எழுவாய் சூழலிலிருந்து அறியப்படுகிறது. தமிழில் பேசுபவர் நகோமி என்பதைத் தெளிவுபடுத்த ‘மாமியார்’ மீண்டும் குறிப்பிடப்பட்டது; கேள்வி உரை என்பதால் ‘கேட்டாள்’ இயல்பானது.
- source_word: מִי אַתְּ
  choice: நீ யார்?
  rationale: சொற்களின் நேரடிப் பொருள் பாதுகாக்கப்பட்டது. இது சந்திப்பின் முடிவையோ ரூத்தின் நிலை மாற்றத்தையோ மறைமுகமாகக் கேட்கலாம்; அந்த விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בִּתִּי
  choice: என் மகளே
  rationale: அன்பும் குடும்ப நெருக்கமும் கொண்ட நேரடி அழைப்பை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: וַתַּגֶּד לָהּ אֵת כָּל אֲשֶׁר
  choice: செய்த அனைத்தையும் அவள் மாமியாரிடம் சொன்னாள்
  rationale: נגד என்பதன் ஹிஃபில் வடிவம் ‘தெரிவித்தல்/சொல்லுதல்’ என்று பொருள்படும்; אֵת כָּל אֲשֶׁר முழு விவரத்தையும் குறிக்கிறது.
- source_word: עָשָׂה לָהּ הָאִישׁ
  choice: அந்த மனிதன் தனக்காகச் செய்த
  rationale: עשה עם ל இச்சூழலில் அவளுக்காக அல்லது அவள் நலனுக்காகச் செய்ததைச் சுட்டுகிறது. הָאִישׁ என்பதற்கேற்ப போவாசின் பெயரைச் சேர்க்காமல் ‘அந்த மனிதன்’ என வைக்கப்பட்டது.
