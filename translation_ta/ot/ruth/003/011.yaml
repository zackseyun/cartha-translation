id: RUT.3.11
reference: Ruth 3:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/עַתָּ֗ה בִּתִּ/י֙ אַל תִּ֣ירְאִ֔י כֹּ֥ל אֲשֶׁר תֹּאמְרִ֖י אֶֽעֱשֶׂה לָּ֑/ךְ כִּ֤י יוֹדֵ֨עַ֙ כָּל שַׁ֣עַר עַמִּ֔/י כִּ֛י אֵ֥שֶׁת חַ֖יִל אָֽתְּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/011.yaml
  text: And now[a], my daughter, do not fear. All that you say, I will do for you[b], for all the gate of my people knows that you are a woman of noble character.
translation:
  language: ta
  text: இப்போது, என் மகளே, பயப்படாதே. நீ சொல்வதையெல்லாம் உனக்காகச் செய்வேன். ஏனெனில், நீ மாண்புமிக்க பெண்[b] என்பது என் மக்கள் அனைவருக்கும்[a] தெரியும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், ‘என் மக்களின் வாசல் முழுவதற்கும் தெரியும்.’ நகர வாசல் பொதுக்கூட்டம், சமூக அங்கீகாரம், சட்ட நடவடிக்கை ஆகியவை நடைபெற்ற இடமாக இருந்தது; எனவே இங்கு அது மக்களை ஆகுபெயராகக் குறிக்கிறது.
    reason: cultural_note
  - marker: b
    text: ‘தகுதிவாய்ந்த பெண்,’ ‘சிறந்த பெண்,’ அல்லது ‘வலிமைமிக்க பெண்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּתִּי
  choice: என் மகளே
  rationale: உறவுமுறை அழைப்பை நேரடியாகத் தக்கவைக்கிறது. இச்சூழலில் இது உயிரியல் உறவைக் கட்டாயமாகக் குறிக்காமல், போவாஸ் ரூத்தை அன்போடும் பாதுகாப்புணர்வோடும் அழைப்பதைக் காட்டுகிறது.
- source_word: אַל תִּירְאִי
  choice: பயப்படாதே
  rationale: எதிர்மறைத் துகளுடன் வரும் கட்டளையின் ஊக்கமளிக்கும் தன்மையை இயல்பான நவீனத் தமிழில் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: כֹּל אֲשֶׁר תֹּאמְרִי אֶעֱשֶׂה לָּךְ
  choice: நீ சொல்வதையெல்லாம் உனக்காகச் செய்வேன்
  rationale: ‘சொல்’ என்ற மூல வினையை ‘கேள்’ என்று குறுக்கிப் பொருள்கொள்ளாமல் தக்கவைக்கிறது; சூழலில் அது ரூத்தின் வேண்டுகோளைச் சுட்டினாலும், எபிரெயக் கூற்றின் பரந்த தன்மை பாதுகாக்கப்படுகிறது.
- source_word: כָּל שַׁעַר עַמִּי
  choice: என் மக்கள் அனைவருக்கும்
  rationale: ‘என் மக்களின் வாசல் முழுவதும்’ என்ற எபிரெய மரபுத்தொடர், நகர வாசலில் பிரதிநிதித்துவம் பெறும் பொதுச் சமூகத்தை ஆகுபெயராகக் குறிக்கிறது. தமிழில் இயல்பாகப் பொருளைத் தரும் வகையில் மொழிபெயர்த்து, ‘வாசல்’ என்ற பண்பாட்டுப் படிமத்தை அடிக்குறிப்பில் பாதுகாக்கிறது.
- source_word: אֵשֶׁת חַיִל
  choice: மாண்புமிக்க பெண்
  rationale: חַיִל என்பதில் மதிப்பு, வலிமை, திறமை, மேன்மை ஆகிய பொருள் நிழல்கள் உள்ளன. ‘மாண்புமிக்க’ என்பது ரூத்தின் நல்லொழுக்கம், தகுதி, சமூக மதிப்பு ஆகியவற்றைச் சுருக்கமாகக் கூறுகிறது; மாற்றுப் பொருள் நிழல்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
theological_decisions:
- issue: אֵשֶׁת חַיִל என்ற பாராட்டுச் சொல்லின் பொருள்
  choice: மாண்புமிக்க பெண்
  alternative: தகுதிவாய்ந்த பெண்; சிறந்த பெண்; வலிமைமிக்க பெண்
  rationale: இச்சொற்றொடரை நல்லொழுக்கம் மட்டும் என்றோ, போர்வீரத்தன்மை மட்டும் என்றோ சுருக்காமல், ரூத்தின் வலிமை, திறமை, நேர்மை, பொதுமதிப்பு ஆகியவற்றை உள்ளடக்கும் சொல்லைத் தேர்ந்தெடுக்கிறது. நீதிமொழிகள் 31-இல் காணப்படும் இதே சொற்றொடருடனான ஒலிப்பையும் முற்றிலும் மறைக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியக்கூடிய ஆனால் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘மகளே’ என்ற அன்பான அழைப்பும் ‘பயப்படாதே’ என்ற நேரடியான ஆறுதலும் பாதுகாக்கப்பட்டுள்ளன. எபிரெய ‘வாசல்’ ஆகுபெயர் தமிழில் இயல்பான முதன்மை உரைக்காக விளக்கிப் பெயர்க்கப்பட்டு, அதன் பண்பாட்டு வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
