base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/013.yaml
  text: Stay here tonight[a], and in the morning, if he will redeem you, good—let him redeem you. But if he does not desire to redeem you, then I myself will redeem you, as Yahweh lives. Lie down until the morning.
translation:
  language: ta
  text: இன்றிரவு இங்கே தங்கியிரு. காலையில் அவன் உன்னை மீட்டுக்கொண்டால்[a], நல்லது—அவன் உன்னை மீட்டுக்கொள்ளட்டும். ஆனால் உன்னை மீட்டுக்கொள்ள அவன் விரும்பாவிட்டால், யாவே உயிரோடிருக்கிறார் என்பதன்மேல், நானே உன்னை மீட்டுக்கொள்வேன். காலைவரை படுத்திரு.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கே ‘மீட்டுக்கொள்ளுதல்’ என்பது குடும்ப உறவின் அடிப்படையில் மீட்பவராகச் செயல்பட்டு, உறவினருக்குரிய கடமையை நிறைவேற்றுவதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִינִי הַלַּיְלָה
  choice: இன்றிரவு இங்கே தங்கியிரு
  rationale: לון என்பது இரவைக் கழிக்கத் தங்குவதைக் குறிக்கிறது. உடனடியான சூழலில் இடம் தெளிவாக இருப்பதால், இயல்பான தமிழுக்காக ‘இங்கே’ சேர்க்கப்பட்டுள்ளது; ‘இன்றிரவு’ என்பது הַלַּיְלָה என்பதன் சூழலுக்கேற்ற வடிவம்.
- source_word: וְהָיָה בַבֹּקֶר
  choice: காலையில்
  rationale: அடுத்த நாள் காலை நிகழவிருப்பதை அறிமுகப்படுத்தும் எபிரெயத் தொடரை சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: אִם יִגְאָלֵךְ
  choice: அவன் உன்னை மீட்டுக்கொள்ள முன்வந்தால்
  rationale: גאל இங்கு குடும்பச் சட்டப் பொறுப்பின் அடிப்படையில் உறவினராக மீட்பதைக் குறிக்கிறது. ‘மீட்டுக்கொள்ள’ என்ற மையச் சொல்லைத் தக்கவைத்து, יִגְאָל இன் இச்சை/செயற்பாட்டு நிபந்தனையை தமிழில் இயல்பாக வெளிப்படுத்த ‘முன்வந்தால்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: טוֹב יִגְאָל
  choice: நல்லது—அவன் உன்னை மீட்டுக்கொள்ளட்டும்
  rationale: טוֹב இங்கு அந்த முடிவை ஏற்றுக்கொள்ளும் சுருக்கமான இடைச்சொல்; அதைத் தொடர்ந்து வரும் வினை அனுமதி அல்லது ஒப்புதலின் நுணுக்கத்துடன் தரப்பட்டுள்ளது.
- source_word: לֹא יַחְפֹּץ לְגָאֳלֵךְ
  choice: உன்னை மீட்டுக்கொள்ள அவன் விரும்பாவிட்டால்
  rationale: חפץ என்பதிலுள்ள விருப்பம் அல்லது மனமுவந்த நிலையை ‘விரும்பு’ நேரடியாகத் தக்கவைக்கிறது.
- source_word: וּגְאַלְתִּיךְ אָנֹכִי
  choice: நானே உன்னை மீட்டுக்கொள்வேன்
  rationale: אָנֹכִי தரும் தனிப்பட்ட வலியுறுத்தலை ‘நானே’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: חַי יְהוָה
  choice: யாவே உயிரோடிருப்பது நிச்சயமென ஆணையிட்டுச் சொல்கிறேன்
  rationale: இது எபிரெய மொழியின் உறுதிமொழிச் சூத்திரம். சொற்சொல்லான வடிவத்தின் பொருளையும், தமிழில் அதன் ஆணையிடும் செயல்பாட்டையும் தெளிவாகத் தருகிறது.
- source_word: שִׁכְבִי עַד הַבֹּקֶר
  choice: காலைவரை படுத்திரு
  rationale: பெண்பால் ஒருமை கட்டளையையும் கால எல்லையையும் எளிய, நேரடியான தமிழில் தருகிறது.
theological_decisions:
- issue: ரூத் நூலின் குடும்பச் சட்டச் சூழலில் גאל என்பதன் மொழிபெயர்ப்பு
  choice: மீட்டுக்கொள்ள என்ற சொல்லை முதன்மைப் பனுவலில் தக்கவைத்தல்
  alternative: நெருங்கிய உறவினருக்குரிய மீட்புக் கடமையை நிறைவேற்றுதல்
  rationale: இந்த வினை குடும்ப உறவின் அடிப்படையிலான சட்டப்பூர்வ மீட்பைச் சுட்டுவதோடு, நூலின் விரிந்த மீட்புக் கருப்பொருளையும் சுமக்கிறது. முதன்மைப் பனுவலில் சுருக்கமான சொல்லைத் தக்கவைத்து, குறிப்பிட்ட குடும்பச் சட்ட நுணுக்கம் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் பட்டப்பெயர் அல்ல, நான்கெழுத்து இறைப்பெயரே உள்ளது. அதனைத் தமிழில் ஒலிபெயர்த்து தனிப்பட்ட உடன்படிக்கைப் பெயரைத் தக்கவைக்கிறது.
- issue: חַי יְהוָה என்ற உறுதிமொழிச் சூத்திரம்
  choice: யாவே உயிரோடிருப்பது நிச்சயமென ஆணையிட்டுச் சொல்கிறேன்
  alternative: யாவே உயிரோடிருப்பதுபோல்
  rationale: மூலத்தின் உறுதிமொழிச் செயல்பாட்டைத் தமிழ்வாசகர் தெளிவாக உணரும்படி தருகிறது; அதேவேளை யாவே உயிருள்ளவர் என்ற மூலக் கூற்றையும் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், போவாஸ் ரூத்திடம் பேசும் ஒருமை நெருக்கமான கட்டளை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. மொழிநடை கண்ணியமானதும் சாதாரண வாசகர்களுக்குப் புரியத்தக்கதுமாக வைக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறியீடு அது விளக்கும் ‘மீட்டுக்கொள்ள’ என்ற சொல்லுக்குப் பின் இடப்பட்டுள்ளது.
