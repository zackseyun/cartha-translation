base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/021.yaml
  text: When Rehoboam came to Jerusalem[a], he assembled all the house of Judah and the tribe of Benjamin, one hundred eighty thousand chosen warriors, to fight against the house of Israel, to restore the kingdom to Rehoboam son of Solomon.
translation:
  language: ta
  text: ரெகொபெயாம் எருசலேமுக்கு வந்தபோது, யூதா வம்சத்தார் அனைவரையும் பென்யமீன் கோத்திரத்தாரையும், போரிடத் தேர்ந்தெடுக்கப்பட்ட ஒரு லட்சத்து எண்பதாயிரம் வீரர்களை[a], இஸ்ரவேல் வம்சத்தாருக்கு எதிராகப் போரிட்டு அரசாட்சியைச் சாலொமோனின் மகன் ரெகொபெயாமுக்கு மீட்டுக்கொடுப்பதற்காக ஒன்றுகூட்டினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “போரிடும் ஒரு லட்சத்து எண்பதாயிரம் வாலிபர்களை.”
    reason: בָּחוּר இராணுவச் சூழலில் ‘தேர்ந்தெடுக்கப்பட்டவர்’ என்றும் ‘வாலிபர்’ என்றும் பொருள்படலாம்; முதன்மை உரை சூழலுக்கேற்ற ‘தேர்ந்தெடுக்கப்பட்ட’ என்னும் பொருளைத் தருகிறது.
lexical_decisions:
- source_word: וַיָּבֹאוּ / ויבאו
  choice: வந்தபோது
  rationale: בוא என்பது எருசலேமை இலக்காகக் கொண்ட வருகையைக் குறிக்கிறது. எழுத்து வடிவம் பன்மையாகத் தோன்றினாலும், சூழலும் அடுத்த ஒருமை வினைச்சொல்லும் ரெகொபெயாம் என்ற ஒருமை எழுவாயையே காட்டுகின்றன.
- source_word: וַיַּקְהֵל
  choice: ஒன்றுகூட்டினான் / திரட்டினான்
  rationale: Hiphil வடிவம் மக்களை ஒன்றாகக் கூட்டும் காரணவினைப் பொருளைக் கொண்டது. தமிழில் இயல்பான ஓட்டத்திற்காக இணைச்சொற்கள் பயன்படுத்தப்பட்டன.
- source_word: כָּל בֵּית יְהוּדָה
  choice: யூதா வம்சத்தார் அனைவரும்
  rationale: ‘வீடு’ என்ற அரசியல்-கூட்டுப் பொருளை சொற்சொல்லாக அல்லாமல், மக்களைக் குறிக்கும் இயல்பான தமிழில் ‘வம்சத்தார்’ என வழங்குகிறது; பின்னுள்ள ‘இஸ்ரவேல் வம்சத்தார்’ என்பதுடன் இணைநிலையும் காக்கப்படுகிறது.
- source_word: שֵׁבֶט בִּנְיָמִן
  choice: பென்யமீன் கோத்திரத்தார்
  rationale: שֵׁבֶט என்ற ‘கோத்திரம்’ என்னும் கூறை வெளிப்படையாகக் காத்து, மக்களைக் குறிக்க ‘கோத்திரத்தார்’ என வழங்கப்பட்டது.
- source_word: מֵאָה וּשְׁמֹנִים אֶלֶף
  choice: 1,80,000
  rationale: தமிழ் வாசகர்களுக்குப் பரிச்சயமான இந்திய இலக்கப் பிரிப்பு முறையில் எண்ணிக்கை தரப்பட்டது.
- source_word: בָּחוּר עֹשֵׂה מִלְחָמָה
  choice: போருக்குத் தேர்ந்தெடுக்கப்பட்ட வீரர்கள்
  rationale: இராணுவச் சூழலில் בָּחוּר என்பது தேர்ந்தெடுக்கப்பட்ட அல்லது சிறந்த ஆட்களைக் குறிக்கலாம்; עֹשֵׂה מִלְחָמָה அவர்களின் போரிடும் தகுதியைத் தெளிவுபடுத்துகிறது. ‘வாலிபர்கள்’ என்ற சாத்தியம் அடிக்குறிப்பில் காக்கப்பட்டது.
- source_word: לְהִלָּחֵם עִם
  choice: எதிராகப் போரிட்டு
  rationale: இங்கு עִם உடன் வரும் போரிடுதல் பகைமைச் செயலாக இருப்பதால், ‘எதிராக’ என்பது உறவைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: בֵּית יִשְׂרָאֵל
  choice: இஸ்ரவேல் வம்சத்தார்
  rationale: பிரிந்த அரசின் அரசியல்-மக்கள் கூட்டத்தைச் சுட்டும் ‘இஸ்ரவேல் வீடு’ என்ற எபிரெய மரபுத்தொடரை இயல்பான தமிழில் வழங்குகிறது.
- source_word: לְהָשִׁיב אֶת הַמְּלוּכָה
  choice: அரசாட்சியை மீட்டுக்கொடுக்க
  rationale: Hiphil வடிவம் மீண்டும் கொண்டுவருதல் அல்லது திருப்பிக் கொடுத்தல் என்ற பொருளைக் கொண்டது; அரசியல் ஆட்சியை ரெகொபெயாமிடம் மீண்டும் ஒப்படைப்பதே நோக்கம்.
- source_word: לִרְחַבְעָם בֶּן שְׁלֹמֹה
  choice: சாலொமோனின் மகன் ரெகொபெயாமுக்கு
  rationale: לְ பயனாளி அல்லது பெறுநரைக் குறிக்கிறது; தமிழ் சொல்வரிசைக்கேற்ப தந்தை-மகன் அடையாளம் பெயருக்கு முன் வைக்கப்பட்டது.
theological_decisions:
- issue: מַמְלָכָה என்பதன் அரசியல் பொருள்
  choice: அரசாட்சி
  alternative: அரசு / ராஜ்யம்
  rationale: இங்கு நிலப்பரப்பை மட்டும் அல்ல, பிரிவினைக்குப் பின் ரெகொபெயாமிடம் மீண்டும் கொண்டுவர வேண்டிய அரசுரிமையையும் ஆட்சியையும் குறிக்கிறது. ‘அரசாட்சி’ இந்த நுணுக்கத்தை இயல்பான நவீன தமிழில் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. அரசியல் கூட்டுப் பெயர்களின் இணைநிலை ‘யூதா வம்சத்தார் / இஸ்ரவேல் வம்சத்தார்’ எனக் காக்கப்பட்டது. ஆங்கில ஆலோசனை உரையில் அடிக்குறி எருசலேமுக்குப் பின் தவறாக இருந்ததால், அது சார்ந்திருக்கும் இராணுவச் சொற்றொடருக்குப் பின் சரியாக வைக்கப்பட்டது.
