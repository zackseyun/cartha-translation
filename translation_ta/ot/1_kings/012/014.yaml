base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/014.yaml
  text: He spoke to them according to the advice of the young men[a], saying, “My father made your yoke heavy, and I will add to your yoke. My father disciplined you with whips, but I will discipline you with scorpions.”
translation:
  language: ta
  text: அவன் அந்த இளைஞர்களின் ஆலோசனைப்படி அவர்களிடம் பேசி, “என் தந்தை உங்கள் நுகத்தைப் பாரமாக்கினார்; நானோ உங்கள் நுகத்தின்மேல் இன்னும் பாரத்தைச் சேர்ப்பேன். என் தந்தை உங்களைச் சவுக்குகளால் தண்டித்தார்; நானோ உங்களைத் தேள்களால்[a] தண்டிப்பேன்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தேள்-சவுக்குகளால்’ எனப் பொருள்படலாம்; அதாவது, கூர்முனைகள் அல்லது கொக்கிகள் பொருத்தப்பட்ட சவுக்குகள். எபிரெய மூலத்தில் நேரடியாக ‘தேள்களால்’ என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: அவர்களிடம் பேசி
  rationale: דבר என்பதன் அடிப்படைப் பொருளான ‘பேசுதல்’ என்பதைக் காக்கிறது; சூழலின்படி ‘பதில் கூறினான்’ என்று விளக்கமாக்கவில்லை.
- source_word: כַּעֲצַת הַיְלָדִים
  choice: அந்த இளைஞர்களின் ஆலோசனைப்படி
  rationale: עֵצָה என்பதற்கு ‘ஆலோசனை’ என்றும், இச்சூழலில் மூப்பர்களுக்கு எதிராக நிற்கும் இளம் ஆலோசகர்களை הַיְלָדִים குறிக்கிறது என்பதால் ‘இளைஞர்கள்’ என்றும் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: הִכְבִּיד אֶת עֻלְּכֶם
  choice: உங்கள் நுகத்தைப் பாரமாக்கினார்
  rationale: ‘நுகம்’ என்ற மூல உருவகத்தையும் כבד என்பதன் ‘பாரமாக்குதல்’ என்ற பொருளையும் நேரடியாகக் காக்கிறது.
- source_word: אֹסִיף עַל עֻלְּכֶם
  choice: உங்கள் நுகத்தின்மேல் இன்னும் பாரத்தைச் சேர்ப்பேன்
  rationale: יסף על என்பதன் ‘மேலும் சேர்த்தல்’ என்ற கருத்தை இயல்பான தமிழில் தெரிவித்து, நுக உருவகத்தையும் தொடர்கிறது.
- source_word: יִסַּר / אֲיַסֵּר
  choice: தண்டித்தார் / தண்டிப்பேன்
  rationale: יסר என்பது திருத்தும் ஒழுக்கத்தையும் தண்டனையையும் குறிக்கலாம்; அரசன் வலுக்கட்டாயமாக நடத்துவதாக மிரட்டும் இச்சூழலில் ‘தண்டித்தார்/தண்டிப்பேன்’ என்பது இயல்பாகவும் பொருத்தமாகவும் உள்ளது.
- source_word: בַּשּׁוֹטִים
  choice: சவுக்குகளால்
  rationale: שׁוֹט குறிக்கும் அடிக்கும் கருவிக்கு நவீனத் தமிழில் தெளிவான இணைச்சொல்.
- source_word: בָּעַקְרַבִּים
  choice: தேள்களால்
  rationale: எபிரெய மூலத்தில் உள்ள ‘தேள்கள்’ என்ற நேரடியான படிமத்தை முதன்மை உரையில் காக்கிறது; முள் அல்லது கொக்கிகள் பொருத்தப்பட்ட சவுக்குகளைக் குறிக்கக்கூடிய சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: ‘தேள்கள்’ என்ற தண்டனைப் படிமத்தின் தன்மை
  choice: முதன்மை உரையில் ‘தேள்களால்’ என்ற நேரடிப் படிமத்தை வைத்தல்
  alternative: ‘தேள்-சவுக்குகளால்’ அல்லது ‘முள் பதித்த சவுக்குகளால்’ என்று பொருள்விளக்கமாக மொழிபெயர்த்தல்
  rationale: עקרבים என்ற எபிரெயச் சொல் நேரடியாக ‘தேள்கள்’ என்கிறது. இது கொக்கிகள் அல்லது கூர்முனைகள் கொண்ட சவுக்குகளைக் குறிக்கலாம்; ஆனால் அந்தச் சாத்தியத்தை உறுதிப்படுத்தாமல், மூலத்தின் ambiguity-ஐ முதன்மை உரையில் காத்து அடிக்குறிப்பில் விளக்குவது சிறந்தது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘நுகம்,’ ‘சவுக்கு,’ ‘தேள்’ ஆகிய மூலப் படிமங்கள் காக்கப்பட்டுள்ளன; ‘நானோ’ என்பது தந்தைக்கும் மகனுக்கும் இடையிலான வலியுறுத்தப்பட்ட எதிர்மறை ஒப்பீட்டை இயல்பாக வெளிப்படுத்துகிறது.
