  text: וַ/יִּוָּעַ֞ץ הַ/מֶּ֣לֶךְ רְחַבְעָ֗ם אֶת הַ/זְּקֵנִים֙ אֲשֶׁר הָי֣וּ עֹמְדִ֗ים אֶת פְּנֵי֙ שְׁלֹמֹ֣ה אָבִ֔י/ו בִּֽ/הְיֹת֥/וֹ חַ֖י לֵ/אמֹ֑ר אֵ֚יךְ אַתֶּ֣ם נֽוֹעָצִ֔ים לְ/הָשִׁ֥יב אֶת הָֽ/עָם הַ/זֶּ֖ה דָּבָֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/006.yaml
  text: Then King Rehoboam consulted the elders who had stood before Solomon his father while he was still alive[a], saying[b], “How do you advise me to answer this people?”
translation:
  language: ta
  text: 'பின்பு அரசன் ரெகொபெயாம், தன் தந்தை சாலொமோன் உயிரோடிருந்தபோது அவர் முன்னிலையில் பணியாற்றிய மூப்பர்களிடம் ஆலோசனை கேட்டான்: “இந்த மக்களுக்குப் பதில் சொல்ல நான் எப்படிச் செய்ய வேண்டும் என்று நீங்கள் ஆலோசனை கூறுகிறீர்கள்?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּוָּעַץ
  choice: ஆலோசனை கேட்டான்
  rationale: நிஃபால் வடிவம் இங்கு பிறரிடம் அறிவுரை நாடுவதைக் குறிக்கிறது; நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: הַמֶּלֶךְ רְחַבְעָם
  choice: அரசன் ரெகொபெயாம்
  rationale: அரசப் பட்டத்தையும் பெயரையும் தமிழில் இயல்பான முறையில் வழங்குகிறது.
- source_word: הַזְּקֵנִים
  choice: மூப்பர்கள்
  rationale: வயதான ஆண்களை மட்டும் அல்லாமல், அரசவையின் அனுபவமிக்க மூத்த ஆலோசகர்களையும் குறிக்கும் சொல்லாக இச்சூழலில் பொருந்துகிறது.
- source_word: אֲשֶׁר הָיוּ עֹמְדִים אֶת־פְּנֵי שְׁלֹמֹה
  choice: சாலொமோன் முன்னிலையில் பணியாற்றிய
  rationale: ‘முன்னிலையில் நின்றவர்கள்’ என்ற எபிரெய அரசவை மரபுத்தொடரின் பணிவிடை அல்லது அரசவைச் சேவை என்ற பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אָבִיו
  choice: தன் தந்தை
  rationale: சாலொமோன் ரெகொபெயாமின் தந்தை என்பதைத் தெளிவாகக் காட்டுகிறது.
- source_word: בִּהְיֹתוֹ חַי
  choice: உயிரோடிருந்தபோது
  rationale: அந்த மூப்பர்கள் சாலொமோனின் வாழ்நாளில் பணியாற்றியவர்கள் என்ற காலத் தொடர்பை நேரடியாகத் தருகிறது.
- source_word: אֵיךְ אַתֶּם נוֹעָצִים
  choice: என்ன ... ஆலோசனை கூறுகிறீர்கள்
  rationale: אֵיךְ என்பதன் முறையைக் கேட்கும் நுணுக்கம் தமிழில் பதிலின் உள்ளடக்கத்தைப் பற்றிய ‘என்ன’ என்ற இயல்பான கேள்வியாக வெளிப்படுகிறது; ‘எனக்கு’ என்பது சூழலால் மறைமுகமாக உள்ள பெறுநரைத் தெளிவாக்குகிறது.
- source_word: לְהָשִׁיב ... דָּבָר
  choice: என்ன பதில் சொல்லும்படி
  rationale: சொல்லுக்கு சொல் ‘ஒரு வார்த்தையைத் திருப்பிக் கொடுக்க’ என்பதற்குப் பதிலாக, ஒருவருக்குப் பதிலளித்தல் என்ற எபிரெய மரபுத்தொடரின் பொருளைச் சீரான தமிழில் தருகிறது.
- source_word: הָעָם הַזֶּה
  choice: இந்த மக்களுக்கு
  rationale: עם என்ற ஒருமைத் தொகுப்புச் சொல்லையும் சுட்டுப்பெயரின் நுணுக்கத்தையும் இயல்பான தமிழில் காக்கிறது.
