translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான ஆனால் பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளக்கூடிய நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய அரசவை மரபுத்தொடரான ‘முன்னிலையில் நிற்றல்’ சொல்லுக்கு சொல் தரப்படாமல் அதன் சூழல்சார் பொருளான பணியாற்றுதல் என வழங்கப்பட்டுள்ளது; வசனத்தில் தனி அடிக்குறிப்பு தேவைப்படவில்லை.
