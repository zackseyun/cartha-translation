translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் தொடர்ச்சியான செயல்கள் இயல்பான தமிழ் நடையில் இணைக்கப்பட்டுள்ளன; நகரங்கள் ‘கட்டப்பட்டன’ என்பது மீள்கட்டுதலா அல்லது அரணாக்குதலா என்ற மூலத்தின் தெளிவின்மை காக்கப்பட்டுள்ளது.
