base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/025.yaml
  text: Then Jeroboam built Shechem in the hill country of Ephraim and lived there[a]; and he went out from there and built Penuel.
translation:
  language: ta
  text: அதன்பின் யெரொபெயாம் எப்பிராயீமின் மலைநாட்டில் சீகேமைக் கட்டினான்; அங்கே குடியிருந்தான். அவன் அங்கிருந்து புறப்பட்டுச் சென்று பெனுவேலை[a]க் கட்டினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: தொடர்புடைய சில வேதப்பகுதிகளில் இந்த இடப்பெயர் “பெனியேல்” என்றும் வழங்கப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: கட்டியெழுப்பினான்
  rationale: בנה என்பதன் அடிப்படைப் பொருள் ‘கட்டு.’ ஏற்கெனவே இருந்த நகரங்களைப் பற்றிய சூழலில் ‘கட்டியெழுப்பு’ என்பது இயல்பான தமிழாகவும், ‘அரண் அமைத்தான்’ அல்லது ‘மீண்டும் கட்டினான்’ என்று மூலத்தில் வெளிப்படையாக இல்லாத விவரத்தைச் சேர்க்காமலும் உள்ளது.
- source_word: שְׁכֶם
  choice: சீகேம்
  rationale: எபிரெய இடப்பெயரின் தமிழ்ச் சீரெழுத்தாக்கம்.
- source_word: בְּהַר אֶפְרַיִם
  choice: எப்பிராயீமின் மலைநாட்டில்
  rationale: הַר என்பது இங்கு ஒரு தனி மலையைவிட மலைப்பாங்கான பிரதேசத்தைக் குறிக்கிறது; ‘மலைநாடு’ அந்தப் புவியியல் பொருளை இயல்பாகத் தருகிறது.
- source_word: וַיֵּשֶׁב בָּהּ
  choice: அங்கே குடியிருந்தான்
  rationale: ישב என்பது இங்கு தங்கி வாழ்வதைக் குறிக்கிறது. பெண்பால் பின்னொட்டு நகரமான சீகேமைக் சுட்டுகிறது; தமிழில் இயல்பாக ‘அங்கே’ என வழங்கப்பட்டுள்ளது.
- source_word: וַיֵּצֵא מִשָּׁם
  choice: அங்கிருந்து புறப்பட்டுச் சென்றான்
  rationale: יצא என்பதிலுள்ள வெளியேறிச் செல்லும் இயக்கத்தைத் தெளிவாகவும் இயல்பாகவும் காக்கிறது.
- source_word: פְּנוּאֵל
  choice: பெனூவேல்
  rationale: இவ்வசனத்தின் எபிரெய மெய்யெழுத்து வடிவத்துக்கு நெருக்கமான தமிழ்ச் சீரெழுத்தாக்கம்; தொடர்புடைய வேதப்பகுதிகளில் காணப்படும் ‘பெனியேல்’ வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
