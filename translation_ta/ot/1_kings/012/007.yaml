base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/007.yaml
  text: And he spoke to him[a], saying, “If today you will be a servant to this people, and serve them, and answer them, and speak good words to them[b], then they will be your servants all your days.”
translation:
  language: ta
  text: 'அவர் அவனிடம் கூறினார்[a]: “இன்று நீ இந்த மக்களுக்குப் பணியாளனாக இருந்து, அவர்களுக்குப் பணிசெய்து, அவர்களுக்குப் பதிலளித்து, அவர்களிடம் நல்ல வார்த்தைகளைப் பேசினால்[b], அவர்கள் உன் வாழ்நாள் முழுவதும் உனக்குப் பணியாளர்களாக இருப்பார்கள்[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கொடுக்கப்பட்ட எபிரேய உரையில் “அவர் … கூறினார்” என்று ஒருமையில் உள்ளது; வழக்கமான மசோரா வாசகம் “அவர்கள் … கூறினார்கள்” என்று பன்மையில் உள்ளது.
    reason: textual_variant
  - marker: b
    text: அல்லது, “கனிவான வார்த்தைகளைப் பேசினால்.”
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “அவர்கள் உன் வாழ்நாள் முழுவதும் உனக்குப் பணிசெய்வார்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶבֶד / עֲבָדִים
  choice: பணியாளன் / பணியாளர்கள்
  rationale: இங்கு அரசன் மக்களுக்குச் சேவை செய்ய வேண்டும் என்ற அரசியல் உருவகம் உள்ளது. ‘அடிமை’ என்பதைக் காட்டிலும் ‘பணியாளன்’ இயல்பாகவும் சூழலுக்கு ஏற்றதாகவும் இருந்து, ஒரே எபிரேயச் சொல்லின் பரஸ்பரத் தொடர்பையும் காக்கிறது.
- source_word: וַעֲבַדְתָּם
  choice: அவர்களுக்குப் பணிசெய்து
  rationale: עבד என்ற வேர்ச்சொல்லுக்கும் முந்தைய ‘பணியாளன்’ என்பதற்கும் உள்ள சொல்லிணைப்பைக் காக்கிறது.
- source_word: וַעֲנִיתָם
  choice: அவர்களுக்குப் பதிலளித்து
  rationale: மக்களின் வேண்டுகோளுக்குப் பதில் கூறுதல் என்பதே இச்சூழலில் ענה என்பதன் பொருள்.
- source_word: דְּבָרִים טוֹבִים
  choice: நல்ல வார்த்தைகள்
  rationale: எபிரேயச் சொற்றொடரின் நேரடியான பொருளைக் காத்தபடியே தமிழில் தெளிவாக உள்ளது; ‘கனிவான வார்த்தைகள்’ என்பதும் சூழலுக்கேற்ற மாற்று.
- source_word: וְהָיוּ לְךָ עֲבָדִים
  choice: உனக்குப் பணியாளர்களாக இருப்பார்கள்
  rationale: அரசன் இப்போது மக்களுக்குப் பணிசெய்தால், பின்னர் அவர்கள் அவனுக்குப் பணியாளர்களாக இருப்பார்கள் என்ற பரஸ்பர முரணைத் தெளிவாகக் காக்கிறது.
- source_word: כָּל הַיָּמִים
  choice: எல்லாக் காலத்திலும்
  rationale: ‘எல்லா நாட்களிலும்’ என்ற எபிரேய மரபுத்தொடரின் தொடர்ச்சியான காலப் பொருளை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: אִם הַיּוֹם
  choice: இன்று … பேசினால்
  rationale: தற்போதைய நெருக்கடியில் உடனடியாக எடுக்க வேண்டிய முடிவை வலியுறுத்தும் ‘இன்று’ என்பதைத் தக்கவைக்கிறது.
- source_word: וַיְדַבֵּר אֵלָיו לֵאמֹר
  choice: அவர் அவனிடம் கூறினார்
  rationale: கொடுக்கப்பட்ட எபிரேய மூலத்தில் வினை ஒருமையில் இருப்பதால் முதன்மை உரை அதைப் பின்பற்றுகிறது; வழக்கமான மசோரா வாசகத்தில் பன்மை இருப்பது அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
theological_decisions:
- issue: அரசாட்சி மக்களுக்குச் சேவை செய்வதாகக் காட்டப்படும் அரசியல் உருவகம்
  choice: சேவை/பணியாளர் மொழியை நேரடியாகவும் பரஸ்பரமாகவும் காத்தல்
  alternative: ‘மக்களுக்கு இணங்கி நட’ அல்லது ‘அவர்களின் அமைச்சனாக இரு’ போன்ற அரசியல் விளக்கச் சொற்களைப் பயன்படுத்துதல்
  rationale: வசனம் அரசாட்சியைப் பற்றிய ஓர் நடைமுறை ஆலோசனையை வழங்குகிறது. பின்னாளைய கோட்பாட்டு பொருளைச் சேர்க்காமல், அரசன் மக்களுக்குப் பணிசெய்வதும் மக்கள் அவனுக்குப் பணியாளர்களாவதும் ஆகிய உரையின் திட்டமிட்ட முரணை மொழிபெயர்ப்பு காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்கு எளிதாகவும் கண்ணியமாகவும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘பணியாளன்/பணியாளர்கள்’ என்ற மீளுரை எபிரேயத்தில் உள்ள அரசியல் பரஸ்பரத்தன்மையைத் திட்டமிட்டு காக்கிறது. கொடுக்கப்பட்ட மூலத்தின் ஒருமை வாசகம் முதன்மை உரையில் வைக்கப்பட்டு, பரவலாக அறியப்படும் பன்மை வாசகம் அடிக்குறிப்பில் வெளிப்படையாகக் குறிப்பிடப்பட்டுள்ளது.
