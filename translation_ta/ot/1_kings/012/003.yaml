base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/003.yaml
  text: So they sent and called for him[a], and Jeroboam and all the assembly of Israel came and spoke to Rehoboam, saying[b],
translation:
  language: ta
  text: 'அதனால் அவர்கள் ஆளனுப்பி அவனை வரவழைத்தார்கள்[a]. யெரொபெயாமும் இஸ்ரவேலின் சபை முழுவதும்[b] வந்து, ரெகொபெயாமிடம் இவ்வாறு சொன்னார்கள்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'நேர்சொல்லாக்கம்: ‘அவர்கள் அனுப்பி அவனை அழைத்தார்கள்.’ இங்கு யெரொபெயாமை வருமாறு ஆளனுப்பி அழைத்ததையே எபிரெய மரபுத்தொடர் குறிக்கிறது.'
    reason: lexical_alternative
  - marker: b
    text: ‘சபை’ என்பதை ‘கூட்டம்’ என்றும் மொழிபெயர்க்கலாம். இங்கு அது பொது-அரசியல் நோக்கத்துக்காகக் கூடியிருந்த இஸ்ரவேல் மக்களின் அமைப்பைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ וַיִּקְרְאוּ לוֹ
  choice: அவர்கள் ஆளனுப்பி அவனை வரவழைத்தார்கள்
  rationale: இரண்டு எபிரெய வினைகளின் தொடரை இயல்பான தமிழில் தருகிறது. ஒருவரை அனுப்பி யெரொபெயாமை வருமாறு அழைத்த சூழலை ‘ஆளனுப்பி ... வரவழைத்தார்கள்’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וַיָּבֹאוּ
  choice: வந்து
  rationale: בוא என்பதன் வழக்கமான ‘வருதல்’ என்ற பொருளையும், அதைத் தொடர்ந்து நடைபெறும் பேச்சுச் செயலையும் இயல்பான தமிழ் வாக்கியத் தொடரில் காக்கிறது.
- source_word: יָרָבְעָם
  choice: யெரொபெயாம்
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் வழக்கமான வேதாகமப் பெயர்வடிவத்துக்கு நெருக்கமாக ஒலிபெயர்க்கிறது.
- source_word: וְכָל־קְהַל יִשְׂרָאֵל
  choice: இஸ்ரவேலின் சபை முழுவதும்
  rationale: קהל என்பது இங்கு பொதுவாகவும் அரசியல் நோக்கத்துடனும் கூடியிருந்த இஸ்ரவேல் மக்களின் பிரதிநிதிக் கூட்டத்தைக் குறிக்கிறது. ‘சபை முழுவதும்’ மூலத்தின் כול கருத்தைக் காக்கிறது.
- source_word: וַיְדַבְּרוּ אֶל־רְחַבְעָם לֵאמֹר
  choice: 'ரெகொபெயாமிடம் இவ்வாறு சொன்னார்கள்:'
  rationale: பின்வரும் நேரடிக் கூற்றை அறிமுகப்படுத்தும் எபிரெய அமைப்பை நவீனத் தமிழில் இயல்பான முறையில் தருகிறது; முக்காற்புள்ளி அடுத்த வசனத்திலுள்ள உரையை எதிர்நோக்குகிறது.
- source_word: רְחַבְעָם
  choice: ரெகொபெயாம்
  rationale: எபிரெய தனிப்பெயரைத் தமிழில் நிலைபெற்ற ஒலிவடிவத்துக்கு நெருக்கமாக ஒலிபெயர்க்கிறது.
