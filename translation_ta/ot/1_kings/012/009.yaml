  register: நவீன நிலையான தமிழில், உரையாடலுக்கேற்ற இயல்பும் வேதாகம உரைக்கேற்ற கண்ணியமும் பேணப்பட்டுள்ளன. மூலத்தின் ‘நுகம்’ உருவகம் பாதுகாக்கப்பட்டுள்ளது; எபிரெய மரபுத்தொடர் முதன்மை உரையில் இயல்பாக்கப்பட்டு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
