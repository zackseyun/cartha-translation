  text: וַ/יֹּ֣אמֶר אֲלֵי/הֶ֗ם מָ֚ה אַתֶּ֣ם נֽוֹעָצִ֔ים וְ/נָשִׁ֥יב דָּבָ֖ר אֶת הָ/עָ֣ם הַ/זֶּ֑ה אֲשֶׁ֨ר דִּבְּר֤וּ אֵלַ/י֙ לֵ/אמֹ֔ר הָקֵל֙ מִן הָ/עֹ֔ל אֲשֶׁר נָתַ֥ן אָבִ֖י/ךָ עָלֵֽי/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/009.yaml
  text: And he said to them[a], “What do you advise, that we may answer this people who have spoken to me, saying[b], ‘Lighten the yoke that your father put on us’?”
translation:
  language: ta
  text: அவன் அவர்களிடம், “என்ன ஆலோசனை கூறுகிறீர்கள்? ‘உன் தந்தை எங்கள்மேல் வைத்த நுகத்தை[b] இலகுவாக்குங்கள்’ என்று என்னிடம் கூறிய இந்த மக்களுக்கு நாம் என்ன பதில் சொல்லலாம்?[a]” என்று கேட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “நாம் ஒரு வார்த்தையைத் திருப்பிச் சொல்லலாம்.” இது “பதில் சொல்லுதல்” என்ற எபிரெய மரபுத்தொடர்.'
    reason: lexical_alternative
  - marker: b
    text: “நுகம்” என்பது அரசன் மக்கள் மீது சுமத்திய கடின உழைப்பையும் கடமைகளையும் குறிக்கும் உருவகம்.
    reason: cultural_note
lexical_decisions:
- source_word: מָה אַתֶּם נוֹעָצִים
  choice: என்ன ஆலோசனை சொல்கிறீர்கள்?
  rationale: நிகழ்கால ஆலோசனையைக் கேட்கும் எபிரெயப் பங்கேற்புவினையின் பொருளை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: וְנָשִׁיב דָּבָר
  choice: நாம் என்ன பதில் சொல்லலாம்?
  rationale: ‘ஒரு வார்த்தையைத் திருப்புதல்’ என்ற எபிரெய மரபுத்தொடரின் ‘பதில் அளித்தல்’ என்னும் பொருளை இயல்பாக வெளிப்படுத்துகிறது; சூழலில் கேட்கப்படும் ஆலோசனையின் நோக்கத்தையும் காக்கிறது.
- source_word: הָעָם הַזֶּה
  choice: இந்த மக்கள்
  rationale: עָם என்ற ஒருமைக் கூட்டுப்பெயரையும் சுட்டுப்பெயரின் சற்றே விலகிய தொனியையும் தமிழில் இயல்பாகப் பிரதிபலிக்கிறது.
- source_word: אֲשֶׁר דִּבְּרוּ אֵלַי לֵאמֹר
  choice: என்று என்னிடம் கூறிய
  rationale: மேற்கோளின் உள்ளடக்கத்தை அறிமுகப்படுத்தும் எபிரெயக் கட்டமைப்பை தமிழில் தேவையற்ற மீளுரையின்றி இயல்பாக வழங்குகிறது.
- source_word: הָקֵל
  choice: இலகுவாக்கும்
  rationale: சுமையைக் குறைக்கும்படி கேட்கும் கட்டளையைச் சுருக்கமாகவும் நுகம் என்ற உருவகத்துக்கு ஏற்றவாறும் தருகிறது.
- source_word: מִן הָעֹל
  choice: நுகத்தை
  rationale: அரசன் விதித்த உழைப்பும் கடமைகளும் குறித்த மூல உருவகத்தை ‘சுமை’ என்று பொதுமைப்படுத்தாமல் காக்கிறது.
- source_word: אֲשֶׁר נָתַן אָבִיךָ עָלֵינוּ
  choice: உன் தந்தை எங்கள்மேல் வைத்த
  rationale: נתן על என்பதன் நேரடியான உருவகத்தை இயல்பான தமிழில் பாதுகாக்கிறது.
