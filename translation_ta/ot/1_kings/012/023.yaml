translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட நடையைப் பயன்படுத்துகிறது. நீண்ட எபிரெய அழைப்புப் பட்டியலைத் தமிழில் இயல்பாக்க, அரசப் பட்டமும் வம்ச அடையாளமும் ரெகொபெயாமுக்கு முன் அமைக்கப்பட்டுள்ளன. ‘ராஜா’ என்பது பொதுவாக அறியப்படும் வேதாகமச் சொல்; ‘வம்சத்தார்’ என்பது בֵּית என்ற கூட்டுச் சமூகப் பொருளைப் பாதுகாக்கிறது.
