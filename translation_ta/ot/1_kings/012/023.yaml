  yaml_path: translation/ot/1_kings/012/023.yaml
  text: Speak to Rehoboam son of Solomon[a], king of Judah, and to all the house of Judah and Benjamin, and the rest of the people, saying[c][b],
translation:
  language: ta
  text: “சாலொமோனின் மகனும் யூதாவின் அரசனுமான ரெகொபெயாமிடமும், யூதா வம்சத்தார் அனைவரிடமும்[a], பென்யமீனிடமும், மீதமுள்ள மக்களிடமும்[b] இவ்வாறு கூறு[c]:”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “யூதா வம்சத்தார்” என்பது யூதாவைச் சேர்ந்த சமூகத்தையோ அரசியல் அமைப்பையோ குறிக்கும் எபிரெய மரபுத்தொடர்; “யூதா முழுவதிடமும்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இங்கே “மக்கள்” என்பது சூழலில் போருக்காகக் கூடியிருந்தவர்களைக் குறிக்கலாம்; ஆனால் எபிரெய மூலத்தில் “படை” என்று வெளிப்படையாகக் கூறப்படவில்லை.
    reason: lexical_alternative
  - marker: c
    text: “இவ்வாறு கூறு” என்பதற்குப் பதிலாக “பேசு” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱמֹר
  choice: நீ சொல்
  rationale: אמר என்பதன் ஆண்பால் ஒருமை கட்டளை வடிவம். அடுத்த வசனத்தில் வரும் செய்தியை உரியவர்களிடம் அறிவிக்கும்படி நேரடியாகக் கட்டளையிடுகிறது.
- source_word: רְחַבְעָם בֶּן שְׁלֹמֹה
  choice: சாலொமோனின் மகனுமான ரெகொபெயாம்
  rationale: பெயரைத் தமிழில் ஒலிபெயர்த்து, בֶּן שְׁלֹמֹה என்ற வம்ச அடையாளத்தை இயல்பான தமிழில் தருகிறது.
- source_word: מֶלֶךְ יְהוּדָה
  choice: யூதாவின் ராஜா
  rationale: அரசப் பட்டத்தை நேரடியாகவும் வழக்கமான வேதாகமத் தமிழிலும் வழங்குகிறது.
- source_word: כָּל בֵּית יְהוּדָה
  choice: யூதா வம்சத்தார் அனைவரும்
  rationale: בֵּית என்பதன் அரசியல்-கூட்டுச் சமூகப் பொருளை வெறும் குடும்பம் என்று குறுக்காமல், இயல்பான தமிழில் ‘வம்சத்தார்’ எனக் காட்டுகிறது.
- source_word: וּבִנְיָמִין
  choice: பென்யமீன்
  rationale: எபிரெயத்தில் கோத்திரப் பெயர் தனித்து நிற்பதால் அதையே கூட்டுச் சமூகத்தைக் குறிக்கும் பெயராக வைத்திருக்கிறது.
- source_word: וְיֶתֶר הָעָם
  choice: மீதமுள்ள மக்கள்
  rationale: יֶתֶר என்பதற்கு ‘மீதமுள்ளோர்’ என்றும் הָעָם என்பதற்கு ‘மக்கள்’ என்றும் நேரடியாகப் பொருள் தருகிறது; சூழல் போருக்குக் கூடியவர்களைக் குறிக்கலாம் என்றாலும் மூலத்தில் ‘படை’ என்று இல்லை.
- source_word: לֵאמֹר
  choice: 'நீ சொல்:'
  rationale: அடுத்த வசனத்தில் வரும் உரையை அறிமுகப்படுத்தும் எபிரெய மேற்கோள் அமைப்பை, தமிழில் தொடர்ச்சியைத் தெளிவாக்கும் கட்டளை மற்றும் முக்காற்புள்ளியால் இயல்பாக வழங்குகிறது.
