base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/028.yaml
  text: So the king took counsel and made two calves of gold[a], and he said to them, “It is too much for you to go up to Jerusalem. Behold your gods, O Israel[b], who brought you up from the land of Egypt.”
translation:
  language: ta
  text: அதனால் அரசன் ஆலோசனை செய்து, இரண்டு பொற்கன்றுகளைச் செய்தான். பின்பு அவன் மக்களிடம், “எருசலேமுக்கு ஏறிப்போவது உங்களுக்கு மிகுந்த சிரமம்.[a] இஸ்ரவேலே, உன்னை எகிப்து நாட்டிலிருந்து வெளியே கொண்டு வந்த உன் தெய்வங்கள் இதோ![b]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீங்கள் எருசலேமுக்கு ஏறிப்போனது போதும்.”
    reason: lexical_alternative
  - marker: b
    text: “இஸ்ரவேலே, உன் கடவுள் இதோ” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல்வடிவம் சில வேளைகளில் ஒருமைப் பட்டமாகச் செயல்படலாம்; மேலும் இச்சொற்றொடர் யாத்திராகமம் 32:4-ஐ எதிரொலிக்கிறது. ஆயினும், இங்கு இரண்டு கன்றுகள் குறிப்பிடப்படுவதும் பன்மை வினை பயன்படுத்தப்படுவதும் “உன் தெய்வங்கள்” என்ற மொழிபெயர்ப்பை ஆதரிக்கின்றன.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּוָּעַץ
  choice: ஆலோசனை செய்து
  rationale: நிப்அல் வினைவடிவம் அரசன் ஆலோசித்ததையோ கலந்து சிந்தித்ததையோ குறிக்கிறது; ‘ஆலோசனை செய்து’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: שְׁנֵי עֶגְלֵי זָהָב
  choice: இரண்டு பொற்கன்றுகளை
  rationale: எபிரெயக் கட்டமைப்பின் பொருளைச் சுருக்கமாகத் தந்து, யாத்திராகமம் 32-இன் சொல்லொலியையும் தக்கவைக்கிறது.
- source_word: רַב לָכֶם מֵעֲלוֹת יְרוּשָׁלִַם
  choice: எருசலேமுக்கு ஏறிப்போவது உங்களுக்கு மிகுந்த சிரமம்
  rationale: எருசலேமுக்குச் செல்வது அவர்களுக்குச் சுமையாக அல்லது அளவுக்கு மீறியதாக உள்ளது என்ற அரசனின் கூற்றை இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘போதும்’ என்ற மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: சுட்டிக்காட்டி அறிவிக்கும் சொல்லின் வலிமையை இயல்பான, கண்ணியமான தமிழில் தருகிறது.
- source_word: אֱלֹהֶיךָ יִשְׂרָאֵל
  choice: இஸ்ரவேலே ... உன் தெய்வங்கள்
  rationale: இரண்டு கன்றுகள் என்ற உடனடிச் சூழலும் பன்மை வினையும் பன்மைப் பொருளை ஆதரிக்கின்றன; அழைப்புவேற்றுமை ‘இஸ்ரவேலே’ எனத் தெளிவாகத் தரப்பட்டுள்ளது.
- source_word: הֶעֱלוּךָ
  choice: உன்னை ... அழைத்துக்கொண்டுவந்த
  rationale: எகிப்திலிருந்து வெளியே கொண்டுவந்த செயலை இயல்பாகக் கூறுகிறது; தமிழில் தொடர்பெயரெச்ச வடிவம் மேற்கோளுக்குள் சரளமாக அமைகிறது.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: எகிப்து நாட்டிலிருந்து
  rationale: எபிரெயத்தின் ‘எகிப்து நாடு’ என்ற வெளியேற்றச் சூத்திரத்தை நெருக்கமாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: אֱלֹהֶיךָ என்பதை ஒருமையாகவா பன்மையாகவா மொழிபெயர்ப்பது
  choice: 'பன்மை: ‘உன் தெய்வங்கள்’'
  alternative: 'ஒருமை: ‘உன் கடவுள்’'
  rationale: אֱלֹהִים வடிவம் சில இடங்களில் ஒருமைக் கடவுளைக் குறிக்கக்கூடும். ஆனால் இங்கு இரண்டு கன்றுகள் குறிப்பிடப்படுவதும் הֶעֱלוּ என்ற பன்மை வினை வருவதும் பன்மை மொழிபெயர்ப்பை வலுவாக ஆதரிக்கின்றன. ஒருமை வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘பொற்கன்றுகள்’, ‘எருசலேமுக்கு ஏறிப்போவது’, ‘இஸ்ரவேலே’ ஆகியவை மூலத்தின் இலக்கிய மற்றும் வேதாகம எதிரொலிகளைத் தக்கவைக்கின்றன.
