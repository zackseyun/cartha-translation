source:
  edition: WLC
  text: וַ/יֵּ֥לֶךְ רְחַבְעָ֖ם שְׁכֶ֑ם כִּ֥י שְׁכֶ֛ם בָּ֥א כָל יִשְׂרָאֵ֖ל לְ/הַמְלִ֥יךְ אֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/001.yaml
  text: Then Rehoboam went to Shechem, because all Israel had come to Shechem to make him king.
translation:
  language: ta
  text: ரெகொபெயாம் சீகேமுக்குச் சென்றான்; ஏனெனில் அவனை அரசனாக்குவதற்காக இஸ்ரவேலர் அனைவரும் சீகேமுக்கு வந்திருந்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: சென்றான்
  rationale: எபிரெயக் கதைநடையின் தொடர்ச்சியை இயல்பான தமிழில் எளிய இறந்தகால வினையாக வழங்குகிறது.
- source_word: שְׁכֶם
  choice: சீகேம்
  rationale: இடப்பெயரின் எபிரெய ஒலிவடிவத்தைத் தமிழில் தெளிவாக எழுத்துப்பெயர்க்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: ரெகொபெயாம் சென்றதற்கான காரணத்தை இங்கு அறிமுகப்படுத்துகிறது.
- source_word: כָל יִשְׂרָאֵל
  choice: இஸ்ரவேலர் அனைவரும்
  rationale: மக்கள் குழுவைக் குறிக்கும் கூட்டுப்பெயரை இயல்பான தமிழில் வெளிப்படுத்துகிறது; சூழலில் இது ஒவ்வொரு தனிநபரையும் கட்டாயமாகக் குறிக்க வேண்டியதில்லை.
- source_word: לְהַמְלִיךְ אֹתוֹ
  choice: அவனை அரசனாக்குவதற்காக
  rationale: ஹிஃபில் வினையின் காரணவினைப் பொருளான ‘ஒருவரை அரசனாக்குதல்/அரசராக நிறுவுதல்’ என்பதைக் காக்கிறது.
theological_decisions:
- issue: அரசாட்சியை நிறுவுவதில் மக்களின் பங்கு
  choice: அவனை அரசனாக்குவதற்காக
  alternative: அவனை அரசனாக அங்கீகரிப்பதற்காக
  rationale: மூலத்தின் காரணவினை வடிவத்தை நேரடியாகக் காக்கிறது; இதன் மூலம் இறையாட்சிக்கும் மக்களின் பொது அரசநிறுவல் செயலுக்கும் இடையிலான தொடர்பை விளக்கமாகத் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான கதைநடை. ‘ரெகொபெயாம்’, ‘சீகேம்’, ‘இஸ்ரவேலர்’ ஆகிய வழக்கமான வேதாகமப் பெயர்வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன.
