source:
  edition: WLC
  text: וַ/יְדַבְּר֣וּ אֵלָ֗י/ו הַ/יְלָדִים֙ אֲשֶׁ֨ר גָּדְל֣וּ אִתּ/וֹ֮ לֵ/אמֹר֒ כֹּֽה תֹאמַ֣ר לָ/עָ֣ם הַ/זֶּ֡ה אֲשֶׁר֩ דִּבְּר֨וּ אֵלֶ֜י/ךָ לֵ/אמֹ֗ר אָבִ֨י/ךָ֙ הִכְבִּ֣יד אֶת עֻלֵּ֔/נוּ וְ/אַתָּ֖ה הָקֵ֣ל מֵ/עָלֵ֑י/נוּ כֹּ֚ה תְּדַבֵּ֣ר אֲלֵי/הֶ֔ם קָֽטָנִּ֥/י עָבָ֖ה מִ/מָּתְנֵ֥י אָבִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/010.yaml
  text: 'The young men who had grown up with him spoke to him, saying, “This is what you shall say to this people who spoke to you, saying, ‘Your father made our yoke heavy, but you, make it lighter for us’: this is what you shall say to them, ‘My little finger is thicker than my father’s waist.’”'
translation:
  language: ta
  text: 'அவனோடு வளர்ந்த இளைஞர்கள் அவனிடம், “உன்னிடம், ‘உன் தந்தை எங்கள் நுகத்தைப் பாரமாக்கினார்; நீயோ அதை எங்களுக்கு இலகுவாக்கு’ என்று சொன்ன இந்த மக்களிடம் நீ இப்படிச் சொல்ல வேண்டும்: ‘என் சுண்டுவிரல்[a] என் தந்தையின் இடுப்பைவிடத் தடிமனானது’ என்று அவர்களிடம் சொல்” என்றார்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில், “என் சிறியது.” உடற்பாகம் வெளிப்படையாகக் குறிப்பிடப்படவில்லை; இச்சூழலில் இது பொதுவாக “சுண்டுவிரல்” என்று புரிந்துகொள்ளப்படுகிறது.
    reason: கָטָנִּי என்பதன் சொல்லாக்கச் சுருக்கத்தையும், ‘சுண்டுவிரல்’ என்பது சூழல்சார் பொதுவான விளக்கம் என்பதையும் பாதுகாக்கிறது.
lexical_decisions:
- source_word: הַיְלָדִים
  choice: இளைஞர்கள்
  rationale: இங்கு சிறுவர்களை அல்ல, ரெகொபெயாமோடு வளர்ந்த இளம் ஆலோசகர்களைக் குறிக்கிறது; நவீன தமிழில் ‘இளைஞர்கள்’ இயல்பானது.
- source_word: עֻלֵּנוּ
  choice: எங்கள் நுகம்
  rationale: ஆட்சி மற்றும் கட்டாய உழைப்பின் பாரத்தைச் சுட்டும் மூல உருவகத்தைத் தக்கவைக்கிறது.
- source_word: קָטָנִּי
  choice: என் சுண்டுவிரல்
  rationale: சொல்லுக்கு நேரடியாக ‘என் சிறியது’ என்ற வடிவம் இருந்தாலும், இச்சூழலில் வழக்கமாகப் புரிந்துகொள்ளப்படும் உடற்பாகம் சுண்டுவிரல்; மூலத்தின் சுருக்கம் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: מָתְנֵי אָבִי
  choice: என் தந்தையின் இடுப்பு
  rationale: מָתְנַיִם என்பதன் உடற்கூறு ஒப்பீட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘அரைக்கட்டு’ போன்ற பழமையான நடையைத் தவிர்க்கிறது.
theological_decisions: []
translation_notes:
  register: நவீன, தெளிவான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. மேற்கோளுக்குள் வரும் மேற்கோள் தெளிவாக வைக்கப்பட்டு, நுகம் என்ற ஆட்சிப் பார உருவகம் பாதுகாக்கப்பட்டுள்ளது.
