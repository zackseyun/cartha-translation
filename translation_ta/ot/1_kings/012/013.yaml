  text: And the king answered the people harshly, and he abandoned the counsel of the elders who had advised him.
translation:
  language: ta
  text: அரசன் மக்களுக்குக் கடுமையாகப் பதிலளித்தான்; மூப்பர்கள் தனக்கு அளித்த ஆலோசனையை அவன் கைவிட்டான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן
  choice: பதிலளித்தான்
  rationale: கால் வினையில் மனிதர்களை நோக்கிய ענה என்பது ‘பதிலளித்தல்’ என்று பொருள்படும்; முந்தைய வேண்டுகோளுக்கு அரசன் அளித்த பதிலை இது இயல்பாகக் குறிக்கிறது.
- source_word: הַמֶּלֶךְ
  choice: அரசன்
  rationale: சூழலில் ஏற்கெனவே அறியப்பட்ட அரசனைக் குறிக்கும் வரையறுக்கப்பட்ட பெயர்ச்சொல்; தமிழில் ‘அரசன்’ இயல்பான வடிவம்.
- source_word: הָעָם
  choice: மக்களுக்கு
  rationale: இங்கு עָם என்பது அரசனிடம் பேசிய இஸ்ரவேல் மக்களைக் குறிக்கிறது; எபிரெய நேரடி செயப்படுபொருள் தமிழில் இயல்பாக ‘மக்களுக்கு’ என்ற வேற்றுமையில் தரப்படுகிறது.
- source_word: קָשָׁה
  choice: கடுமையாக
  rationale: அரசன் பதிலளித்த விதத்தை விளக்கும் வினையடைப் பயன்பாடு; ‘கடுமையாக’ என்பது பொருளையும் தொனியையும் தெளிவாகத் தருகிறது.
- source_word: וַיַּעֲזֹב
  choice: புறக்கணித்தான்
  rationale: עזב என்பது விட்டுவிடுதல் அல்லது ஒதுக்கிவிடுதல் எனப் பொருள்படும்; ஆலோசனையை ஏற்காமல் ஒதுக்கிய செயலை ‘புறக்கணித்தான்’ நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עֲצַת
  choice: ஆலோசனையை
  rationale: עֵצָה என்பது ஆலோசனை அல்லது அறிவுரை; அரசவைக் கலந்தாலோசனைச் சூழலிலும் பொதுவாசிப்பிலும் ‘ஆலோசனை’ தெளிவான சொல்.
- source_word: הַזְּקֵנִים
  choice: மூப்பர்களின்
  rationale: இவர்கள் வயதான ஆண்கள் மட்டுமல்லாமல் அங்கீகரிக்கப்பட்ட மூத்த ஆலோசகர்கள்; ‘மூப்பர்கள்’ அவர்களுடைய சமூக-அரசியல் பங்கைப் பாதுகாக்கிறது.
- source_word: אֲשֶׁר יְעָצֻהוּ
  choice: தனக்கு ஆலோசனை கூறிய
  rationale: அரசன் அதை ஒதுக்குவதற்கு முன்பே மூப்பர்கள் அவனுக்கு ஆலோசனை கூறியதை உறவுப்பெயரெச்சத் தொடர் இயல்பாகக் காட்டுகிறது.
