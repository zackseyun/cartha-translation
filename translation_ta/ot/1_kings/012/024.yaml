base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/024.yaml
  text: 'Thus says Yahweh: ‘Do not go up or fight against your brothers[a], the sons of Israel. Return, each man to his house[c][b], for this thing is from me.’ So they listened to the word of Yahweh and turned back to go according to the word of Yahweh.'
translation:
  language: ta
  text: 'யாவே இவ்வாறு கூறுகிறார்: “நீங்கள் மேலே போக வேண்டாம்; உங்கள் சகோதரர்களாகிய இஸ்ரவேல் மக்களுக்கு எதிராகப் போரிடவும் வேண்டாம்.[a] ஒவ்வொருவரும் தன் வீட்டிற்குத் திரும்பிச் செல்லுங்கள்; ஏனெனில் இந்தக் காரியம் என்னிடமிருந்தே ஏற்பட்டது.” அப்போது அவர்கள் யாவேயின் வார்த்தைக்குச் செவிகொடுத்து, யாவேயின் வார்த்தையின்படி திரும்பிச் சென்றார்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் சொல்லுக்குச் சொல், “உங்கள் சகோதரர்களாகிய இஸ்ரவேல் மக்களுடன்” என உள்ளது; ஆனால் “போரிடு” என்ற வினையுடன் இங்கு “அவர்களுக்கு எதிராக” என்று பொருள்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: யாவே இவ்வாறு கூறுகிறார்
  rationale: தீர்க்கதரிசனத் தூதுச் சூத்திரத்தின் முறையான தன்மையை இயல்பான நவீனத் தமிழில் காக்கிறது; יְהוָה என்பது தனிப்பெயராக ‘யாவே’ என்று ஒலிபெயர்க்கப்படுகிறது.
- source_word: לֹא תַעֲלוּ וְלֹא תִלָּחֲמוּן
  choice: நீங்கள் மேலே போக வேண்டாம்; ... போரிடவும் வேண்டாம்
  rationale: עלה என்பதன் ‘மேலே போ’ என்ற இடவியல் கூறையும், לחם என்பதன் போரிடுதல் என்ற பொருளையும் பாதுகாக்கிறது.
- source_word: עִם אֲחֵיכֶם בְּנֵי יִשְׂרָאֵל
  choice: உங்கள் சகோதரர்களாகிய இஸ்ரவேல் மக்களுக்கு எதிராக
  rationale: לחם உடன் עִם எதிர்த்துப் போரிடுவதைக் குறிக்கிறது. אֲחֵיכֶם என்பதன் உறவுமுறை வலியுறுத்தல் ‘சகோதரர்கள்’ எனத் தக்கவைக்கப்படுகிறது; בְּנֵי יִשְׂרָאֵל இயல்பான தமிழில் ‘இஸ்ரவேல் மக்கள்’ என வழங்கப்படுகிறது.
- source_word: שׁוּבוּ אִישׁ לְבֵיתוֹ
  choice: ஒவ்வொருவரும் தங்கள் வீட்டிற்குத் திரும்பிச் செல்லுங்கள்
  rationale: אִישׁ இங்கு பகிர்வுப் பொருளில் ‘ஒவ்வொருவரும்’ என வருகிறது; தமிழ் மரியாதை/பொதுப்பயன்பாட்டு ஒருமைப்பாட்டுக்காக ‘தங்கள்’ பயன்படுத்தப்படுகிறது.
- source_word: כִּי מֵאִתִּי נִהְיָה הַדָּבָר הַזֶּה
  choice: ஏனெனில் இந்தக் காரியம் என்னிடமிருந்தே ஏற்பட்டது
  rationale: מֵאִתִּי என்பதன் மூலாதார வலிமையை ‘என்னிடமிருந்தே’ காக்கிறது; נִהְיָה என்பதற்கு ‘ஏற்பட்டது’ என்று கூறி நிகழ்வின் தெய்வீக மூலத்தை வெளிப்படுத்துகிறது, ஆனால் காரணவியல் விவரத்தை மிகைப்படுத்தவில்லை.
- source_word: וַיִּשְׁמְעוּ אֶת דְּבַר יְהוָה
  choice: அவர்கள் யாவேயின் வார்த்தைக்குச் செவிகொடுத்து
  rationale: שׁמע என்பதில் கேட்பதும் கீழ்ப்படிவதும் இணைந்துள்ளன; ‘செவிகொடுத்து’ இரு நுணுக்கங்களையும் இயல்பாகத் தாங்குகிறது.
- source_word: וַיָּשֻׁבוּ לָלֶכֶת כִּדְבַר יְהוָה
  choice: யாவேயின் வார்த்தையின்படி திரும்பிச் சென்றார்கள்
  rationale: எபிரெயச் சொற்றொடரின் திரும்புதல் மற்றும் செல்லுதல் ஆகிய இரு இயக்கங்களையும் சுருக்கமான இயல்பான தமிழில் வெளிப்படுத்துகிறது; கட்டளைக்கிணங்கியதையும் தெளிவாக்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் உள்ள உடன்படிக்கைத் தனிப்பெயரை ஒரு பொதுப் பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- issue: அரசியல் பிளவு கடவுளிடமிருந்து வந்தது எனும் கூற்றின் காரணவியல் வலிமை
  choice: இந்தக் காரியம் என்னிடமிருந்தே ஏற்பட்டது
  alternative: இந்தக் காரியம் என்னுடையது
  rationale: מֵאִתִּי נִהְיָה நிகழ்வின் மூலத்தை யாவேயிடம் வைக்கிறது. அனுமதி, நேரடி செயற்பாடு போன்ற விளக்கங்களில் ஒன்றைத் தேர்ந்து உரையின் இறையியல் நெருக்கடியைத் தீர்த்துவிடாமல் உள்ளது.
- issue: אֲחֵיכֶם என்ற உறவுமுறைச் சொல்லின் வலிமை
  choice: உங்கள் சகோதரர்களாகிய இஸ்ரவேல் மக்கள்
  alternative: உங்கள் சக இஸ்ரவேலர்கள்
  rationale: உள்நாட்டுப் போர் சொந்த சகோதரர்களுக்கு எதிரானது என்ற மூலத்தின் உடன்பிறப்பு வலியுறுத்தலைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில், தீர்க்கதரிசன அறிவிப்பின் முறையான தொனி காக்கப்பட்டுள்ளது. தேவையற்ற பழந்தமிழ் மற்றும் பிரிவுசார் சொற்பயன்பாடு தவிர்க்கப்பட்டுள்ளது.
