revisions:
- from: அரசன் மக்களுக்குச் செவிகொடுக்கவில்லை. ஏனெனில், இது யாவேவிடமிருந்து வந்த நிகழ்வுத் திருப்பமாக இருந்தது[a]. சீலோனியனான அகியா வழியாக[b] நேபாத்தின் மகன் யெரொபெயாமிடம் யாவே உரைத்த தமது வார்த்தையை நிலைநிறுத்துவதற்காகவே இவ்வாறு நடந்தது.
  to: அரசன் மக்களுக்குச் செவிகொடுக்கவில்லை; ஏனெனில், இது யாவேவிடமிருந்து வந்த நிகழ்வுகளின் ஒரு திருப்பமாக இருந்தது[a]. யாவே சீலோவைச் சேர்ந்த அகியா வழியாக[b] நேபாத்தின் மகன் யெரொபெயாமிடம் உரைத்திருந்த தமது வார்த்தையை நிலைநிறுத்துவதற்காகவே அது நிகழ்ந்தது.
  rationale: சீலோவைச் சேர்ந்தவரைக் குறிக்கும் எபிரெய அடைமொழி தவறான புவியியல் பொருளைத் தராதவாறு திருத்தப்பட்டுள்ளது. மேலும், சִבָּה-வின் காரணம்/சூழ்நிலை/நிகழ்வுத் திருப்பம் என்ற பொருள்-நெகிழ்வைத் தக்கவைத்தபடி வாசிப்பிற்கு இயல்பான சொல்லமைப்பு பயன்படுத்தப்பட்டுள்ளது. யாவேவின் செயலாட்சிக்கும் அரசனின் மறுப்புக்கும் இடையிலான உரையின் விளக்கப்படாத பதற்றம் மாற்றப்படவில்லை.
