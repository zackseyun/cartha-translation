source:
  edition: WLC
  text: וְ/לֹֽא שָׁמַ֥ע הַ/מֶּ֖לֶךְ אֶל הָ/עָ֑ם כִּֽי הָיְתָ֤ה סִבָּה֙ מֵ/עִ֣ם יְהוָ֔ה לְמַ֜עַן הָקִ֣ים אֶת דְּבָר֗/וֹ אֲשֶׁ֨ר דִּבֶּ֤ר יְהוָה֙ בְּ/יַד֙ אֲחִיָּ֣ה הַ/שִּׁילֹנִ֔י אֶל יָרָבְעָ֖ם בֶּן נְבָֽט־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/015.yaml
  text: So the king did not listen to the people[a], for it was a turn of events from Yahweh[b], in order to establish his word that Yahweh had spoken by the hand of Ahijah the Shilonite to Jeroboam son of Nebat.
translation:
  language: ta
  text: அரசன் மக்களுக்குச் செவிகொடுக்கவில்லை; ஏனெனில், இது யாவேவிடமிருந்து வந்த நிகழ்வுகளின் ஒரு திருப்பமாக இருந்தது[a]. யாவே சீலோவைச் சேர்ந்த அகியா வழியாக[b] நேபாத்தின் மகன் யெரொபெயாமிடம் உரைத்திருந்த தமது வார்த்தையை நிலைநிறுத்துவதற்காகவே அது நிகழ்ந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘காரணம் யாவேவிடமிருந்து வந்தது’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் סִבָּה என்பது ‘காரணம்’, ‘சூழ்நிலை’, அல்லது நிகழ்வுகளில் ஏற்பட்ட ஒரு திருப்பம் என்று பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், ‘சீலோவைச் சேர்ந்த அகியாவின் கையால்.’ இது ‘சீலோவைச் சேர்ந்த அகியா வழியாக’ என்று பொருள்படும் மரபுத்தொடர்.
    reason: source_idiom
lexical_decisions:
- source_word: שָׁמַע אֶל
  choice: செவிகொடு
  rationale: இங்கு வெறுமனே ஒலியைக் கேட்பதல்ல, மக்களின் வேண்டுகோளை ஏற்று அதன்படி நடப்பதே பொருள். ‘செவிகொடு’ இந்தச் சூழலில் இயல்பாக அதைக் காட்டுகிறது.
- source_word: הָעָם
  choice: மக்கள்
  rationale: இது கூடியிருந்த இஸ்ரவேல் மக்களைக் குறிக்கும் பொதுவான, நேரடியான சொல்.
- source_word: סִבָּה
  choice: நிகழ்வுத் திருப்பம்
  rationale: இந்த அரிய பெயர்ச்சொல் ‘காரணம்’, ‘சூழ்நிலை’, அல்லது நிகழ்வுகளில் ஏற்பட்ட திருப்பம் என்று பொருள்படலாம். கதையின் போக்கையும் எபிரெயச் சொல்லின் நெகிழ்வையும் ‘நிகழ்வுத் திருப்பம்’ நன்றாக வெளிப்படுத்துகிறது.
- source_word: מֵעִם יְהוָה
  choice: யாவேவிடமிருந்து
  rationale: מֵעִם இங்கு மூலத்தையோ தோற்றுவாயையோ குறிக்கிறது; இறைபெயர் יְהוָה ‘யாவே’ என்று ஒலிபெயர்க்கப்படுகிறது.
- source_word: לְמַעַן הָקִים
  choice: நிலைநிறுத்துவதற்காக
  rationale: לְמַעַן நோக்கத்தைக் குறிக்கிறது; הֵקִים, ‘வார்த்தை’ என்பதோடு வரும்போது அதை நிறைவேறச் செய்து உறுதிப்படுத்துதல் அல்லது நிலைநிறுத்துதல் என்ற பொருள் தருகிறது.
- source_word: דְּבָרוֹ
  choice: தமது வார்த்தை
  rationale: ‘வார்த்தை’ என்பது நேரடியான மொழிபெயர்ப்பு; ‘வாக்குறுதி’ என்று மொழிபெயர்ப்பது மூலத்தின் பொருளைத் தேவையின்றி குறுக்கிவிடும்.
- source_word: בְּיַד
  choice: வழியாக
  rationale: சொல்லுக்குச் சொல் ‘கையால்’ என்றாலும், தீர்க்கதரிசனச் செய்தியை ஒருவர்மூலம் வழங்கியதைக் குறிக்கும் எபிரெய மரபுத்தொடர் இது. நவீனத் தமிழில் ‘வழியாக’ அதன் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: הַשִּׁילֹנִי
  choice: சீலோனியனான
  rationale: அகியா சீலோவைச் சேர்ந்தவர் என்பதைக் காட்டும் இன/இடப்பெயர் சார்ந்த அடைமொழியைப் பாதுகாக்கிறது.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: நேபாத்தின் மகன் யெரொபெயாம்
  rationale: எபிரெயத் தந்தைவழி அடையாளத்தை இயல்பான தமிழ்ச் சொல்லமைப்பில் தருகிறது.
theological_decisions:
- issue: இறைச் செயலாட்சியும் அரசனின் மனிதச் செயலும்
  choice: அரசன் செவிகொடுக்காத நிகழ்வு யாவேவிடமிருந்து வந்த நிகழ்வுத் திருப்பம் என்றும், அது யாவேயின் முந்தைய வார்த்தையை நிலைநிறுத்தும் நோக்கமுடையது என்றும் மொழிபெயர்க்கப்பட்டது.
  alternative: யாவே இதை வெறுமனே அனுமதித்தார் என்று மென்மைப்படுத்துதல்; அல்லது அரசனின் மறுப்பை யாவே நேரடியாகக் கட்டாயப்படுத்தினார் என்று மூலத்தைவிட வலுவாகக் கூறுதல்.
  rationale: எபிரெய உரை நிகழ்வின் மூலத்தை யாவேவிடம் வைக்கிறது; அதேவேளை, அந்த இறைச் செயலின் இயங்குமுறையை விளக்கவில்லை. எனவே இறைச் செயலாட்சியையும் மனிதச் செயலையும் பற்றிய உரையின் பதற்றம் தீர்த்துவைக்கப்படாமல் பாதுகாக்கப்படுகிறது.
- issue: יְהוָה என்ற இறைபெயர்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் வரும் நான்கெழுத்து இறைபெயரை மறைக்காமல், அதன் பரவலாக ஏற்றுக்கொள்ளப்படும் உச்சரிப்பைத் தமிழில் தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. நீண்ட எபிரெய வாக்கியம் வாசிப்புத் தெளிவுக்காக மூன்று தொடர்புடைய தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது; காரணமும் நோக்கமும் இடையிலான தர்க்கத் தொடர்பு பாதுகாக்கப்பட்டுள்ளது.
