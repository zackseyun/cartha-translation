revisions:
- from: அரசன் தங்களுக்குச் செவிகொடுக்கவில்லை என்பதை இஸ்ரவேலர் அனைவரும் கண்டபோது, மக்கள் அரசனுக்கு மறுமொழியாக, “தாவீதிடம் நமக்கு என்ன பங்கு இருக்கிறது? ஈசாயின் மகனிடம் நமக்குச் சுதந்தரம் ஏதும் இல்லை. இஸ்ரவேலே, உன் கூடாரங்களுக்குப் போ[a]! தாவீதே, இப்போது உன் சொந்த வீட்டை நீயே பார்த்துக்கொள்[b]” என்றார்கள். ஆகவே, இஸ்ரவேலர் தங்கள் கூடாரங்களுக்குச் சென்றார்கள்.
  to: 'அரசன் தங்களுக்குச் செவிகொடுக்கவில்லை என்பதை இஸ்ரவேலர் அனைவரும் கண்டபோது, மக்கள் அரசனுக்குப் பதிலளித்துச் சொன்னார்கள்: “தாவீதோடு நமக்கு என்ன பங்கு இருக்கிறது? ஈசாயின் மகனில் நமக்குச் சுதந்தரப் பங்கு ஏதும் இல்லை. இஸ்ரவேலே, உன் கூடாரங்களுக்குப் போ[a]! தாவீதே, இப்போது உன் வீட்டைப் பார்த்துக்கொள்[b]!” ஆகவே, இஸ்ரவேலர் தங்கள் கூடாரங்களுக்குச் சென்றார்கள்.'
  rationale: The revision retains the Hebrew’s historical-political repudiation, its parallel terms for share and inheritance, and the deliberate ambiguity of David’s ‘house.’ It improves idiomatic Tamil and avoids introducing extra emphatic force not explicit in the source. Footnote anchors remain attached to the relevant expressions and the alternatives accurately explain the lexical and idiomatic nuances.
