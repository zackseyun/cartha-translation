base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/016.yaml
  text: When all Israel saw that the king had not listened to them[a], the people answered the king, saying, “What share do we have in David? We have no inheritance in the son of Jesse. To your tents, O Israel! Now see to your own house[b], David.” So Israel went to their tents.
translation:
  language: ta
  text: 'அரசன் தங்களுக்குச் செவிகொடுக்கவில்லை என்பதை இஸ்ரவேலர் அனைவரும் கண்டபோது, மக்கள் அரசனுக்குப் பதிலளித்துச் சொன்னார்கள்: “தாவீதோடு நமக்கு என்ன பங்கு இருக்கிறது? ஈசாயின் மகனில் நமக்குச் சுதந்தரப் பங்கு ஏதும் இல்லை. இஸ்ரவேலே, உன் கூடாரங்களுக்குப் போ[a]! தாவீதே, இப்போது உன் வீட்டைப் பார்த்துக்கொள்[b]!” ஆகவே, இஸ்ரவேலர் தங்கள் கூடாரங்களுக்குச் சென்றார்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்ரவேலே, உன் வீடுகளுக்குப் போ!” எபிரெயத்தில் சொல்லுக்குச் சொல் “உன் கூடாரங்களுக்கு” என்று உள்ளது; இது கலைந்து சென்று அரசியல் விசுவாசத்தை விலக்கிக்கொள்வதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: 'இங்கு “வீடு” என்பது “அரச வம்சம்” என்றும் பொருள்படலாம்: “தாவீதே, இப்போது உன் அரச வம்சத்தைப் பார்த்துக்கொள்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא כָּל יִשְׂרָאֵל
  choice: இஸ்ரவேலர் அனைவரும் கண்டபோது
  rationale: ראה என்பதன் அடிப்படைப் பொருளான ‘காணுதல்’ என்பதையும், அரசன் தங்கள் வேண்டுகோளை ஏற்கவில்லை என்பதை அவர்கள் உணர்ந்த சூழலையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: לֹא שָׁמַע ... אֲלֵיהֶם
  choice: தங்களுக்குச் செவிகொடுக்கவில்லை
  rationale: இங்கு שׁמע வெறுமனே ஒலி கேட்பதை அல்ல, வேண்டுகோளை ஏற்றுக் கேட்டு நடப்பதைக் குறிக்கிறது. ‘செவிகொடுக்கவில்லை’ அந்த மறுப்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: וַיָּשִׁבוּ הָעָם אֶת־הַמֶּלֶךְ דָּבָר
  choice: மக்கள் அரசனுக்கு மறுமொழியாக ... என்றார்கள்
  rationale: ‘ஒரு வார்த்தையைத் திருப்பினார்கள்’ என்ற எபிரெய மொழிமரபின் பொருளை இயல்பான தமிழில் பதிலுரையாக அளிக்கிறது.
- source_word: מַה לָּנוּ חֵלֶק בְּדָוִד
  choice: தாவீதிடம் நமக்கு என்ன பங்கு இருக்கிறது?
  rationale: חֵלֶק என்பதன் ‘பங்கு/பாகம்’ என்ற பொருளையும், தாவீதின் அரச வம்சத்துடனான அரசியல் உறவை நிராகரிக்கும் முழக்கத்தையும் தக்கவைக்கிறது.
- source_word: וְלֹא נַחֲלָה בְּבֶן־יִשַׁי
  choice: ஈசாயின் மகனிடம் நமக்குச் சுதந்தரம் ஏதும் இல்லை
  rationale: נַחֲלָה என்பதிலுள்ள சுதந்தரப் பங்கு மற்றும் உரிமை சார்ந்த எதிரொலியைப் பாதுகாக்கிறது; ‘ஈசாயின் மகன்’ என்ற சொற்றொடர் அரச பட்டத்தைத் தவிர்க்கும் இகழ்ச்சியான சொல்லாட்சியையும் தக்கவைக்கிறது.
- source_word: לְאֹהָלֶיךָ יִשְׂרָאֵל
  choice: இஸ்ரவேலே, உன் கூடாரங்களுக்குப் போ!
  rationale: ‘கூடாரங்கள்’ என்பது மூலச்சொல்லை நேரடியாகப் பாதுகாக்கிறது; ஒருமை அழைப்பும் கட்டளையும் இஸ்ரவேலை ஒரே கூட்டு அரசியல் உடலாக உரையாடுகின்றன.
- source_word: עַתָּה רְאֵה בֵיתְךָ דָּוִד
  choice: தாவீதே, இப்போது உன் சொந்த வீட்டை நீயே பார்த்துக்கொள்
  rationale: ראה இங்கு ‘கவனித்துக்கொள்’ என்ற பொருளுடையது. ‘வீடு’ என்பது குடும்பம் அல்லது அரச வம்சம் என்ற அடுக்குப் பொருளையும் திறந்தவாறே வைத்திருக்கிறது.
- source_word: וַיֵּלֶךְ יִשְׂרָאֵל לְאֹהָלָיו
  choice: இஸ்ரவேலர் தங்கள் கூடாரங்களுக்குச் சென்றார்கள்
  rationale: கூட்டு ஒருமையான ‘இஸ்ரவேல்’ தமிழில் இயல்பாகப் பன்மை மக்களாகக் கூறப்படுகிறது; முன் வந்த ‘கூடாரங்கள்’ என்ற முழக்கத்தையும் மீண்டும் தக்கவைக்கிறது.
theological_decisions:
- issue: தாவீதின் வீட்டுக்கு எதிரான அரசியல் முழக்கம்
  choice: தாவீதின் அரச வீட்டுடனான விசுவாச உறவை நிராகரிக்கும் வரலாற்று அரசியல் பேச்சாக நேரடியாக மொழிபெயர்க்கப்பட்டது.
  alternative: இதனை தாவீதிய உடன்படிக்கை அல்லது மேசியா நம்பிக்கைக்கு எதிரான வெளிப்படையான இறையியல் மறுப்பாக வலுப்படுத்துதல்.
  rationale: இவ்வசனம் ரெகொபெயாமுக்கும் தாவீதிய அரசாட்சிக்கும் எதிரான கோத்திரங்களின் கிளர்ச்சியை விவரிக்கிறது. மூலத்தில் வெளிப்படையாக இல்லாத பிற்கால இறையியல் தீர்ப்பை மொழிபெயர்ப்பில் சேர்க்காமல், அதன் அரசியல் தீவிரத்தையும் ‘வீடு’ என்பதன் வம்சப் பொருளையும் பாதுகாக்க வேண்டும்.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் மரியாதைமிக்க வரலாற்று உரைநடையிலும் வடிவமைக்கப்பட்டது. மக்களின் முழக்கத்தில் உள்ள கூர்மையான அரசியல் மறுப்பை மங்கச் செய்யாமல், ‘பங்கு’, ‘சுதந்தரம்’, ‘கூடாரங்கள்’, ‘வீடு’ ஆகிய மூல உருவகங்கள் பாதுகாக்கப்பட்டுள்ளன.
