  source_fidelity: மூல எபிரெயத்தின் காலக்குறிப்பு, யூதாவிலிருந்த பண்டிகையுடனான ஒப்புமை, பலிபீடம் தொடர்பான ஏறுதல், கன்றுக்குட்டிகளுக்குப் பலியிடுதல், பெத்தேலில் மேடுகளின் ஆசாரியர்களை நியமித்தல் ஆகியவை வரைவு உரையில் பெரும்பாலும் துல்லியமாக உள்ளன. ஆனால் ‘பெத்தேலிலும் அவ்வாறே செய்தான்’ என்பது தமிழில் முன்னுள்ள பலிபீடச் செயலோடு மட்டும் இணைவதுபோல் சிறிது தெளிவின்மையை உருவாக்குகிறது; ‘பெத்தேலில் அவன் இவ்வாறே செய்தான்’ என்ற சொல் வரிசை மூலத்தின் தொடர்ச்சியைத் தெளிவாகக் காட்டுகிறது.
  naturalness: நடை நவீன நிலையான தமிழில் கண்ணியமாகவும் புரியக்கூடியதாகவும் உள்ளது. ‘மேடுகளின் ஆசாரியர்கள்’ என்ற நிலைபெற்ற வேதாகமச் சொற்றொடர் பொருத்தமானது. ‘கன்றுக்குட்டிகளுக்குப் பலியிடுவதற்காக’ என்பதற்குப் பதிலாக ‘கன்றுக்குட்டிகளுக்குப் பலியிட’ என்பது நோக்கப் பொருளை இயல்பாகவும் சுருக்கமாகவும் தருகிறது.
  terminology: ‘பலிபீடம்,’ ‘கன்றுக்குட்டிகள்,’ ‘மேடுகள்,’ ‘ஆசாரியர்கள்’ ஆகியவை மூலத்தின் மதிப்பீடற்ற சொற்களைப் பாதுகாக்கின்றன. ‘தான் செய்த கன்றுக்குட்டிகள்’ மற்றும் ‘தான் அமைத்த மேடுகள்’ என்ற வேறுபாடு தமிழில் பொருத்தமானது. பண்டிகையை முதன்மை உரையில் கூடாரப் பண்டிகை எனப் பெயரிடாமல் வைத்திருப்பது சரியானது.
