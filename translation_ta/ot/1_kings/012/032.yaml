  revised_text: 'யெரொபெயாம் எட்டாம் மாதத்தின் பதினைந்தாம் நாளில், யூதாவில் கொண்டாடப்பட்ட பண்டிகையைப் போன்ற ஒரு பண்டிகையைக் கொண்டாடினான்[a]. அவன் பலிபீடத்தின்மேல் ஏறினான்[b]. பெத்தேலில் அவன் இவ்வாறே செய்தான்: தான் செய்த கன்றுக்குட்டிகளுக்குப் பலியிட, தான் அமைத்த மேடுகளின் ஆசாரியர்களைப் பெத்தேலில் பணியில் அமர்த்தினான்.'
