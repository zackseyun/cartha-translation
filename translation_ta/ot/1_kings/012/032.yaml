  text: וַ/יַּ֣עַשׂ יָרָבְעָ֣ם חָ֡ג בַּ/חֹ֣דֶשׁ הַ/שְּׁמִינִ֣י בַּ/חֲמִשָּֽׁה עָשָׂר֩ י֨וֹם לַ/חֹ֜דֶשׁ כֶּ/חָ֣ג אֲשֶׁ֣ר בִּ/יהוּדָ֗ה וַ/יַּ֨עַל֙ עַל הַ/מִּזְבֵּ֔חַ כֵּ֤ן עָשָׂה֙ בְּ/בֵֽית אֵ֔ל לְ/זַבֵּ֖חַ לָ/עֲגָלִ֣ים אֲשֶׁר עָשָׂ֑ה וְ/הֶעֱמִיד֙ בְּ/בֵ֣ית אֵ֔ל אֶת כֹּהֲנֵ֥י הַ/בָּמ֖וֹת אֲשֶׁ֥ר עָשָֽׂה׀־׀׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/032.yaml
  text: Jeroboam made a feast in the eighth month[a], on the fifteenth day of the month, like the feast that was in Judah, and he went up to the altar. So he did in Bethel, sacrificing to the calves that he had made[b]; and he installed in Bethel the priests of the high places that he had made.
translation:
  language: ta
  text: 'யெரொபெயாம் எட்டாம் மாதத்தின் பதினைந்தாம் நாளில், யூதாவில் கொண்டாடப்பட்ட பண்டிகையைப் போன்ற ஒரு பண்டிகையைக் கொண்டாடினான்[a]. அவன் பலிபீடத்தின்மேல் ஏறினான்[b]. பெத்தேலில் அவன் இவ்வாறே செய்தான்: தான் செய்த கன்றுக்குட்டிகளுக்குப் பலியிட, தான் அமைத்த மேடுகளின் ஆசாரியர்களைப் பெத்தேலில் பணியில் அமர்த்தினான்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: யூதாவின் இந்தப் பண்டிகை, ஏழாம் மாதத்தின் பதினைந்தாம் நாளில் நடைபெற்ற கூடாரப் பண்டிகையைக் குறித்திருக்கலாம்; யெரொபெயாம் அதற்குப் போட்டியான பண்டிகையை ஒரு மாதம் கழித்து வைத்தான்.
    reason: cross_reference
  - marker: b
    text: அல்லது, “பலிபீடத்திடம் ஏறிச் சென்றான்.” எபிரெயச் சொற்றொடரை நேரடியாக “பலிபீடத்தின்மேல் ஏறினான்” என்று மொழிபெயர்க்கலாம்; சூழலில், வழிபாட்டுச் சடங்கை நடத்த அவன் பலிபீடத்தை அணுகியதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ ... חָג
  choice: ஒரு பண்டிகையைக் கொண்டாடினான்
  rationale: עשה என்பதுடன் חג வரும்போது ‘பண்டிகையைக் கொண்டாடு/நடத்து’ என்பது இயல்பான பொருள். நவீன தமிழில் ‘பண்டிகையைச் செய்தான்’ என்பதைக் காட்டிலும் இது தெளிவானது.
- source_word: בַּחֹדֶשׁ הַשְּׁמִינִי בַּחֲמִשָּׁה עָשָׂר יוֹם לַחֹדֶשׁ
  choice: எட்டாம் மாதத்தின் பதினைந்தாம் நாளில்
  rationale: எபிரெய தேதிக் குறிப்பை இயல்பான, துல்லியமான தமிழில் தருகிறது.
- source_word: כֶּחָג אֲשֶׁר בִּיהוּדָה
  choice: யூதாவில் கொண்டாடப்பட்ட பண்டிகையைப் போன்ற
  rationale: ஒப்புமையை வெளிப்படையாகப் பாதுகாக்கிறது; பண்டிகையின் பெயரை மூலவசனம் குறிப்பிடாததால் அதை முதன்மை உரையில் சேர்க்கவில்லை.
- source_word: וַיַּעַל עַל הַמִּזְבֵּחַ
  choice: அவன் பலிபீடத்தின்மேல் ஏறினான்
  rationale: עלה על என்பதன் வடிவத்தையும் அதன் உண்மையான இடவியல் தெளிவின்மையையும் நெருக்கமாகப் பாதுகாக்கிறது; வழிபாட்டை நடத்தப் பலிபீடத்தை அணுகியதைக் குறிக்கலாம் என்பதைக் குறிப்பில் விளக்குகிறது.
- source_word: כֵּן עָשָׂה בְּבֵית אֵל
  choice: பெத்தேலிலும் அவ்வாறே செய்தான்
  rationale: כֵּן குறிக்கும் முன்செயலுடனான ஒத்திசைவை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: לְזַבֵּחַ לָעֲגָלִים
  choice: கன்றுக்குட்டிகளுக்குப் பலியிடுவதற்காக
  rationale: לְ வடிவின் நோக்கத்தையும் பலி கன்றுக்குட்டிகளை நோக்கியதாக இருப்பதையும் பாதுகாக்கிறது.
- source_word: הָעֲגָלִים
  choice: கன்றுக்குட்டிகள்
  rationale: சொல்லின் நேரடிப் பொருளைத் தருகிறது; ‘சிலைகள்’ என்று விளக்கத்தை முதன்மை உரைக்குள் சேர்க்கவில்லை.
- source_word: וְהֶעֱמִיד
  choice: பணியில் அமர்த்தினான்
  rationale: வழிபாட்டுப் பணியாளர்களை அதிகாரபூர்வமாக நிலைநிறுத்திய சூழலை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כֹּהֲנֵי הַבָּמוֹת
  choice: மேடுகளின் ஆசாரியர்கள்
  rationale: במות என்பதற்கான வழக்கமான வேதாகமத் தமிழ் இணையான ‘மேடுகள்’ என்பதையும், அவற்றுடன் தொடர்புடைய ஆசாரியர்களையும் சுருக்கமாகக் குறிக்கிறது.
- source_word: אֲשֶׁר עָשָׂה
  choice: தான் அமைத்த
  rationale: மேடுகளை யெரொபெயாமே ஏற்படுத்தியதைத் தெரிவிக்கிறது; பொருட்களை ‘செய்தல்’ என்பதிலிருந்து வழிபாட்டு இடங்களை ‘அமைத்தல்’ எனத் தமிழில் பொருத்தமாக வேறுபடுத்துகிறது.
theological_decisions:
- issue: ‘யூதாவில் இருந்த பண்டிகை’ எதைக் குறிக்கிறது
  choice: முதன்மை உரையில் பெயரிடாமல் பொதுவாக ‘யூதாவில் கொண்டாடப்பட்ட பண்டிகை’ என்று மொழிபெயர்த்தல்
  alternative: கூடாரப் பண்டிகை என்று வெளிப்படையாகப் பெயரிடுதல்
  rationale: ஏழாம் மாதம் பதினைந்தாம் நாளில் நடைபெற்ற கூடாரப் பண்டிகை வலுவாகச் சுட்டப்படுகிறதாயினும், இவ்வசனத்தின் எபிரெய உரை அதன் பெயரைச் சொல்லவில்லை.
- issue: யெரொபெயாமின் வழிபாட்டு நடவடிக்கைகளுக்கான மதிப்பீடு
  choice: கன்றுக்குட்டிகள், மேடுகள், ஆசாரியர்கள் என்று விளக்கமான ஆனால் மதிப்பீடு சேர்க்காத மொழி
  alternative: ‘விக்கிரகங்கள்’, ‘சட்டவிரோத ஆசாரியர்கள்’ போன்ற கண்டனச் சொற்களைச் சேர்த்தல்
  rationale: பெரிய கதைச்சூழல் இந்த வழிபாட்டைக் கண்டிக்கிறது; ஆனால் இவ்வசனம் செயல்களை விவரிக்கிறது. ஆகவே மதிப்பீட்டை மொழிபெயர்ப்பில் கூடுதலாகச் சேர்க்கவில்லை.
- issue: பலிபீடத்துடன் தொடர்புடைய ஏற்றச் செயல்
  choice: ‘பலிபீடத்தின்மேல் ஏறினான்’ என வடிவத்திற்கு நெருக்கமாக வைத்து குறிப்பில் சூழல் பொருளைத் தருதல்
  alternative: ‘பலிபீடத்தருகே சென்றான்’ அல்லது ‘பலிபீடத்தில் வழிபாட்டை நடத்தினான்’
  rationale: எபிரெய עלה על המזבח என்பதில் ‘மேல்/அருகே சென்று ஏறுதல்’ என்ற வெளிப்பாட்டுக்கும் வழிபாட்டை நடத்த அணுகுதல் என்ற சூழல் பொருளுக்கும் இடையிலான பதற்றத்தைச் சுமுகமாக அழிக்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதாகம நடை. ‘பண்டிகையைக் கொண்டாடினான்’, ‘பணியில் அமர்த்தினான்’ ஆகியவை இயல்பான தமிழை வழங்குகின்றன; ‘மேடுகள்’, ‘ஆசாரியர்கள்’, ‘பலிபீடம்’ ஆகிய நிலைபெற்ற வேதாகமச் சொற்கள் தொடர்ச்சிக்காகப் பயன்படுத்தப்பட்டுள்ளன.
