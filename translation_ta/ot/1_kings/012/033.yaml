base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/033.yaml
  text: And he went up to the altar that he had made in Bethel on the fifteenth day in the eighth month[a], in the month that he had devised from his own heart, and he made a feast for the sons of Israel[b]; and he went up to the altar to burn incense.
translation:
  language: ta
  text: அவன் பெத்தேலில் தான் செய்திருந்த பலிபீடத்தின்மேல், எட்டாம் மாதத்தின் பதினைந்தாம் நாளில் ஏறினான். அந்த மாதத்தை அவன் தன் உள்ளத்திலிருந்தே வகுத்திருந்தான்[a]. அவன் இஸ்ரவேல் மக்களுக்காக[b] ஒரு பண்டிகையை நடத்தி, தூபம் எரிப்பதற்காகப் பலிபீடத்தின்மேல் ஏறினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவன் தானே வகுத்துக்கொண்ட மாதத்தில்,” அல்லது “அவன் சொந்தமாகத் தேர்ந்தெடுத்த மாதத்தில்.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “இஸ்ரவேலின் மகன்கள்”; இது இஸ்ரவேல் மக்களைக் குறிக்கும் வழக்கமான தேசியப் பெயர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: ஏறினான்
  rationale: עלה என்பதன் அடிப்படைப் பொருள் ‘ஏறு’ அல்லது ‘மேலே செல்.’ பலிபீடச் சூழலில் அதை அணுகி ஏறிச் செல்வதை இது குறிக்கலாம்; வசனத்தில் வரும் இரு முறைகளிலும் ஒரே சொல்லைப் பயன்படுத்துவது எபிரெய உரையின் மீளுரையைப் பாதுகாக்கிறது.
- source_word: הַמִּזְבֵּחַ
  choice: பலிபீடம்
  rationale: מזבח என்பதற்கான இயல்பான, நிலைபெற்ற தமிழ் வழிபாட்டுச் சொல்.
- source_word: אֲשֶׁר עָשָׂה בְּבֵית־אֵל
  choice: பெத்தேலில் தான் செய்திருந்த
  rationale: முன்னரே செய்த பலிபீடத்தைக் குறிக்கும் சார்பு வாக்கியத்தை இயல்பான தமிழில் இறந்தகால நிறைவு வடிவில் தருகிறது.
- source_word: בַּחֲמִשָּׁה עָשָׂר יוֹם בַּחֹדֶשׁ הַשְּׁמִינִי
  choice: எட்டாம் மாதத்தின் பதினைந்தாம் நாளில்
  rationale: எபிரெய தேதிக் குறிப்பைத் தெளிவான நவீன தமிழ் வரிசையில் தருகிறது.
- source_word: בַּחֹדֶשׁ אֲשֶׁר בָּדָא מִלְּבַד
  choice: அந்த மாதத்தை அவன் தன் உள்ளத்திலிருந்தே வகுத்திருந்தான்
  rationale: בדא என்பது உருவாக்குதல் அல்லது வகுத்தல் என்ற கருத்தையும், உடன் வரும் சொற்றொடர் அவனுடைய சொந்த உள்ளத்திலிருந்து தோன்றிய முடிவு என்ற மதிப்பீட்டு நுணுக்கத்தையும் கொண்டுள்ளது. ‘வகுத்திருந்தான்’ என்பது விழா மாதத்தைத் தானே நிர்ணயித்ததை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיַּעַשׂ חָג
  choice: ஒரு பண்டிகையை நடத்தி
  rationale: עשה + חג என்பதைக் சொற்சொல்லாக ‘பண்டிகை செய்தான்’ என்று தருவது தமிழில் இயல்பற்றது; ‘பண்டிகையை நடத்தினான்’ என்பது விழாவை ஏற்படுத்திக் கொண்டாடிய செயலைத் தெளிவாகக் கூறுகிறது.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்களுக்காக
  rationale: சொற்சொல்லான பொருள் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இது முழு இஸ்ரவேல் தேச மக்களையும் குறிக்கும் நிலையான தேசியப் பெயர். ‘இஸ்ரவேல் மக்கள்’ என்பது அதன் பொருளை இயல்பான, உள்ளடக்கமான நவீன தமிழில் தருகிறது.
- source_word: לְהַקְטִיר
  choice: தூபம் எரிப்பதற்காக
  rationale: הקטיר என்பது வழிபாட்டுச் சூழலில் புகை எழும்பும்படி எரிப்பதைக் குறிக்கிறது; இச்சூழலில் ‘தூபம் எரித்தல்’ சுருக்கமானதும் இயல்பானதும் ஆகும்.
theological_decisions:
- issue: யெரொபெயாம் வகுத்த வழிபாட்டு மாதத்தை விவரிக்கும் மதிப்பீட்டு சொற்றொடர்
  choice: தன் உள்ளத்திலிருந்தே வகுத்திருந்தான்
  alternative: தானே வகுத்துக்கொண்டிருந்தான் / தன் விருப்பப்படி தேர்ந்தெடுத்திருந்தான்
  rationale: இந்த விழா மாதம் இறைவனால் நியமிக்கப்பட்டதல்ல, அரசனுடைய சொந்த எண்ணத்திலிருந்து வந்தது என்ற கதைசொல்லியின் மறைமுக விமர்சனத்தை இவ்வடிவம் பாதுகாக்கிறது; அதேவேளையில் உரையைவிட மேலான விளக்கத்தைச் சேர்ப்பதில்லை.
- issue: בני ישראל என்ற தேசிய அடையாளச் சொல்லின் மொழிபெயர்ப்பு
  choice: இஸ்ரவேல் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள் / இஸ்ரவேலர்
  rationale: இச்சொற்றொடர் ஆண்களை மட்டும் அல்லாமல் இஸ்ரவேல் சமூகத்தையே ஒட்டுமொத்தமாகக் குறிக்கிறது. ‘இஸ்ரவேல் மக்கள்’ என்பது தமிழில் இயல்பாக அந்த தேசியப் பொருளைத் தெரிவிக்கிறது; சொற்சொல்லான வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘பலிபீடம்,’ ‘தூபம்’ போன்ற நிலைபெற்ற வழிபாட்டுச் சொற்கள் வைக்கப்பட்டுள்ளன. நீண்ட எபிரெய வாக்கியம் வாசிப்புத் தெளிவுக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது; ஆனால் நிகழ்வுகளின் வரிசையும் மீளுரையும் பாதுகாக்கப்பட்டுள்ளன.
