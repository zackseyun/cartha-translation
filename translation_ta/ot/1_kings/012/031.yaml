  source_fidelity: மூல எபிரெயத்தின் இரு வினைச்சொற்களும் ஒரே עשה ஆக இருந்தாலும், இயல்பான தமிழில் முதல் இடத்தில் «அமைத்தான்», இரண்டாம் இடத்தில் «ஆசாரியர்களை ஆக்கினான்» என வேறுபடுத்துவது பொருளுக்கு உண்மையானது. ஆனால் வரைவில் உள்ள «லேவியின் மக்களில் இல்லாதவர்களைப் ... ஆசாரியர்களாக நியமித்தான்» என்ற சொற்றொடர் சார்பு வாக்கியத்தின் கவனத்தை மாற்றி, அவன் நியமித்தவர்கள் லேவியின் மக்களில் இல்லாதவர்கள் என்பதைக் குறைவாக நேரடியாக்குகிறது. மூலத்தின் தொடர்புச் சொற்றொடரைத் தெளிவாகப் பாதுகாக்க வேண்டும்.
  naturalness: «மேடைகளுக்கான வழிபாட்டிடங்கள்» இயல்பானதாயினும், «மேடைகளின் வழிபாட்டிடங்கள்» என்பது בֵּית בָּמוֹת என்ற கட்டமைப்புக்கு மேலும் நெருக்கமானதும் தமிழில் தெளிவானதும் ஆகும். «மக்கள் அனைவரிலிருந்தும்» என்பது «பொதுமக்கள் எல்லாரிடையிலிருந்தும்» என்பதைவிடச் சுருக்கமாகவும் இயல்பாகவும் உள்ளது. «லேவியின் மக்களாக இல்லாதவர்கள்» தமிழில் சற்றே அசட்டாக ஒலிக்கிறது; «லேவியின் வம்சத்தைச் சேர்ந்தவர்கள் அல்லாதவர்கள்» இயல்பானது.
  terminology: «ஆசாரியர்கள்» பொருத்தமான நிலையான சமயச் சொல். «மேடைகள்» உயர்ந்த இடத்திலான வழிபாட்டுத் தலங்களைக் குறிக்கும் மரபான பயன்பாடாக ஏற்கத்தக்கது. «லேவியின் வம்சத்தைச் சேர்ந்தவர்கள் அல்லாதவர்கள்» மூலத்தின் «லேவியின் மகன்களிலிருந்து» என்னும் வம்சக் குறியீட்டை தமிழில் தெளிவாகத் தருகிறது; அடிக்குறிப்பில் «லேவியரல்லாதவர்கள்» என்ற மாற்றும் பொருத்தமானது.
