- from: அவன் மேடைகளுக்கான வழிபாட்டிடங்களை அமைத்தான்[a]. மேலும், லேவியின் மக்களில் இல்லாதவர்களைப் பொதுமக்கள் எல்லாரிடையிலிருந்தும் ஆசாரியர்களாக நியமித்தான்[b].
  to: அவன் மேடைகளின் வழிபாட்டிடங்களை அமைத்தான்[a]. மேலும், மக்கள் அனைவரிலிருந்தும் ஆசாரியர்களை ஆக்கினான்; அவர்கள் லேவியின் வம்சத்தைச் சேர்ந்தவர்கள் அல்ல[b].
