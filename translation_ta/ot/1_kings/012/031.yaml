  text: He made houses of high places[a], and he appointed priests from among all the people[b], who were not from the sons of Levi.
translation:
  language: ta
  text: அவன் மேடைகளின் வழிபாட்டிடங்களை அமைத்தான்[a]. மேலும், மக்கள் அனைவரிலிருந்தும் ஆசாரியர்களை ஆக்கினான்; அவர்கள் லேவியின் வம்சத்தைச் சேர்ந்தவர்கள் அல்ல[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்கு சொல், “மேடைகளின் வீடு”; மேடைகளோடு தொடர்புடைய சன்னதிகள் அல்லது வழிபாட்டிடங்களைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “லேவியரல்லாதவர்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: அமைத்தான் / நியமித்தான்
  rationale: עָשָׂה என்பது பொதுவாக ‘செய்/உருவாக்கு’ எனும் பரந்த பொருளுடையது. முதல் இடத்தில் வழிபாட்டிடங்களை ஏற்படுத்தியதையும், இரண்டாம் இடத்தில் ஆசாரியர்களை ஏற்படுத்தியதையும் இயல்பான தமிழில் சூழலுக்கேற்ப வேறுபடுத்துகிறது.
- source_word: בֵּית בָּמוֹת
  choice: மேடைகளுக்கான வழிபாட்டிடங்கள்
  rationale: சொல்லுக்கு சொல் ‘மேடைகளின் வீடு’ என்றாலும், இது மேடைகளோடு தொடர்புடைய வழிபாட்டுச் சன்னதிகளைக் குறிக்கும் மரபுத்தொடர். ‘வழிபாட்டிடங்கள்’ என்பது அதன் சமயச் சூழலைத் தெளிவாகத் தருகிறது; ‘மேடைகளுக்கான’ என்பது எபிரெயக் கட்டமைப்பின் தொடர்பை மிகையாகத் தீர்மானிக்காமல் காக்கிறது.
- source_word: כֹּהֲנִים
  choice: ஆசாரியர்கள்
  rationale: வழிபாட்டு அலுவலைக் குறிக்கும் இச்சூழலில் நவீன தமிழ் வேதாகம நடையில் நிலைபெற்ற, புரிந்துகொள்ளத்தக்க சொல்.
- source_word: מִקְצוֹת הָעָם
  choice: பொதுமக்கள் எல்லாரிடையிலிருந்தும்
  rationale: சொல்லடியாக ‘மக்களின் முனைகளிலிருந்து’ என்றாலும், இங்கு அங்கீகரிக்கப்பட்ட ஆசாரியக் குலத்துக்கு மாறாக மக்களிடமிருந்து பரவலாகத் தேர்ந்தெடுத்ததைச் சுட்டும் மரபுத்தொடராகப் புரிகிறது.
- source_word: אֲשֶׁר לֹא הָיוּ מִבְּנֵי לֵוִי
  choice: லேவியின் மக்களில் இல்லாதவர்களை
  rationale: அவர்கள் லேவியின் வம்சத்தைச் சேர்ந்தவர்கள் அல்ல என்பதைக் குடும்ப/குல மொழியுடன் காக்கிறது.
theological_decisions:
- issue: யெரொபெயாம் ஏற்படுத்திய அங்கீகரிக்கப்படாத வழிபாட்டு அமைப்புகளை மொழிபெயர்த்தல்
  choice: மேடைகளுக்கான வழிபாட்டிடங்களை அமைத்தான்
  alternative: மேடைகளின் வீட்டைக் கட்டினான் / மேடைகளில் சன்னதிகளை அமைத்தான்
  rationale: சமய வழிபாட்டுச் சூழலைத் தெளிவாக்குகிறது; அதேவேளையில் ‘அங்கீகரிக்கப்படாத’ போன்ற மதிப்பீட்டு விளக்கத்தை வசனத்துக்குள் சேர்க்கவில்லை.
- issue: ஆசாரியர்களின் லேவியரல்லாத நிலை
  choice: லேவியின் மக்களில் இல்லாதவர்களை
  alternative: லேவியரல்லாதவர்களை
  rationale: மூலத்தின் வம்ச/குடும்பச் சொல்லாக்கத்தைப் பாதுகாத்து, வரலாற்று வழிபாட்டு வேறுபாட்டை விளக்கக் கோட்பாடின்றி தெரிவிக்கிறது.
translation_notes:
  register: நவீன, மரியாதையான, பொதுவாசகர்களுக்குப் புரியும் தமிழ். ‘மேடை’ என்பது உயர்ந்த இடத்திலிருந்த வழிபாட்டுத் தலத்தைக் குறிக்கும் மரபுச் சமயச் சொல்; அடிக்குறிப்பு அதன் பொருளை விளக்குகிறது.
