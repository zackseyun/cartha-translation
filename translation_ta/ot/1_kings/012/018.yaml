  to: அப்போது அரசன் ரெகொபெயாம், கட்டாய வேலைக்குப் பொறுப்பாயிருந்த அதோராமை[a] அனுப்பினான். இஸ்ரவேலர் அனைவரும் அவர்மேல் கற்களை எறிந்தார்கள்; அவர் இறந்தார்[b]. அரசன் ரெகொபெயாமோ எருசலேமுக்குத் தப்பியோடுவதற்காகத் தேரில் ஏறுவதற்கு விரைந்தான்[c].
