translation_notes:
  register: நவீனத் தரத் தமிழில், கண்ணியமான எளிய கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘கட்டாய வேலை’ என்பது corvée உழைப்பைத் தெளிவாக்குகிறது. ‘கற்களை எறிந்து கொன்றார்கள்’ என்பது எபிரெயத்தின் வெளிப்படையான கல் குறிப்பையும் மரண விளைவையும் இயல்பான தமிழில் இணைக்கிறது. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
