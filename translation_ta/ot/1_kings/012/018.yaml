base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/018.yaml
  text: Then King Rehoboam sent Adoram[a], who was over the forced labor, and all Israel stoned him with stones, and he died[c][b]. And King Rehoboam made haste to get up into the chariot to flee to Jerusalem.
translation:
  language: ta
  text: அப்போது அரசன் ரெகொபெயாம், கட்டாய வேலைக்குப் பொறுப்பாயிருந்த அதோராமை[a] அனுப்பினான். இஸ்ரவேலர் அனைவரும் அவர்மேல் கற்களை எறிந்தார்கள்; அவர் இறந்தார்[b]. அரசன் ரெகொபெயாமோ எருசலேமுக்குத் தப்பியோடுவதற்காகத் தேரில் ஏறுவதற்கு விரைந்தான்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘அதோராம்’; தொடர்புடைய வேறு சில வசனங்களில் இப்பெயர் ‘அதோனிராம்’ என்று வருகிறது.
    reason: alternative_reading
  - marker: b
    text: எபிரெயத்தில், ‘அவர்மேல் கல்லால் எறிந்தார்கள்’ என்று வெளிப்படையாக உள்ளது; இதன் பொருள் அவரைக் கல்லெறிந்தார்கள் என்பதாகும்.
    reason: lexical_alternative
  - marker: c
    text: எபிரெயச் சொற்றொடரைச் சொல்லர்த்தமாக, ‘தன்னைத் திடப்படுத்திக்கொண்டு தேரில் ஏறினான்’ என்றும் மொழிபெயர்க்கலாம்; இச்சூழலில் அது அவசரமாக முயன்றதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: அனுப்பினான்
  rationale: שלח என்பதன் வழக்கமான கதைநடைப் பொருள்; அதோராமை ஒரு பணிக்காக அனுப்பியதைக் குறிக்கிறது.
- source_word: אֲדֹרָם
  choice: அதோராம்
  rationale: WLC/MT இவ்வசனத்தில் உள்ள பெயர் வடிவத்தை நேரடியாகப் பின்பற்றுகிறது; தொடர்புடைய இடங்களிலுள்ள அதோனிராம் என்ற வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אֲשֶׁר עַל הַמַּס
  choice: கட்டாய வேலைக்குப் பொறுப்பாயிருந்த
  rationale: מַס இங்கு பணவரியைக் காட்டிலும் அரசால் கட்டாயப்படுத்தப்பட்ட உழைப்பைக் குறிக்கிறது; அதிகாரப் பொறுப்பையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וַיִּרְגְּמוּ ... אֶבֶן וַיָּמֹת
  choice: அவர்மேல் கற்களை எறிந்து கொன்றார்கள்
  rationale: எபிரெயத்தில் உள்ள கல் எறிதலைத் தெளிவாக வைத்துக்கொண்டு, அதன் விளைவான மரணத்தை இயல்பான சுருக்கமான தமிழில் சொல்கிறது.
- source_word: כָל יִשְׂרָאֵל
  choice: இஸ்ரவேலர் அனைவரும்
  rationale: சூழலில் வடக்குக் கோத்திர மக்களைச் சுட்டும் கூட்டு அரசியல் பெயரை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הִתְאַמֵּץ
  choice: விரைந்தான்
  rationale: Hitpael வடிவம் தன்னை வலுப்படுத்தி முயல்வதைச் சொன்னாலும், இச்சூழலில் தப்பிக்க அவசரமாகச் செயல்பட்டதைக் குறிக்கிறது; சொல்லர்த்த நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: לַעֲלוֹת בַּמֶּרְכָּבָה
  choice: தேரில் ஏற
  rationale: עלה என்பதன் மேலேறுதல்/வாகனத்தில் ஏறுதல் என்ற திசைநுணுக்கத்தை இயல்பான தமிழில் தருகிறது.
- source_word: לָנוּס יְרוּשָׁלָם
  choice: எருசலேமுக்குத் தப்பியோடுவதற்காக
  rationale: נוּס என்பது சாதாரணப் புறப்பாட்டை அல்ல, அபாயத்திலிருந்து தப்பியோடுதலைக் குறிக்கிறது.
