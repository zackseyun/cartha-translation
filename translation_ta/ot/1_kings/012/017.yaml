  yaml_path: translation/ot/1_kings/012/017.yaml
  text: But Rehoboam reigned over the Israelites who lived in the cities of Judah.
translation:
  language: ta
  text: ஆனால் யூதாவின் நகரங்களில் குடியிருந்த இஸ்ரவேலர்கள்மேல் ரெகொபெயாம் அரசாண்டான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலர்கள்
  rationale: ‘இஸ்ரவேலின் மகன்கள்’ என்ற சொல்லுக்குச் சூழலில் தேசிய மக்களைக் குறிக்கும் இயல்பான பொருள் இருப்பதால், நவீன தமிழில் ‘இஸ்ரவேலர்கள்’ என வழங்கப்பட்டது.
- source_word: הַ/יֹּשְׁבִים
  choice: குடியிருந்த
  rationale: ישב என்பதன் பங்கேற்புவினை வடிவம் இங்கு ஓர் இடத்தில் தொடர்ந்து வசித்தவர்களைக் குறிக்கிறது; ‘குடியிருந்த’ என்பது அந்த நிலையான வசிப்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּ/עָרֵי יְהוּדָה
  choice: யூதாவின் நகரங்களில்
  rationale: இடத்தைக் குறிக்கும் எபிரெயச் சொற்றொடரை நேரடியாகவும் இயல்பான தமிழிலும் தருகிறது; அரசியல் எல்லைகளை மேலதிகமாக வரையறுக்கவில்லை.
- source_word: וַ/יִּמְלֹךְ
  choice: அரசாண்டான்
  rationale: מלך இங்கு அரசனாக ஆட்சி செலுத்துவதைக் குறிக்கிறது; ‘அரசாண்டான்’ சுருக்கமான, dignified, வழக்கமான தமிழ் வடிவம்.
- source_word: עֲלֵי/הֶם
  choice: மேல்
  rationale: ஆட்சிக்குட்பட்ட உறவைத் தமிழில் ‘இஸ்ரவேலர்கள்மேல்’ என்ற இணைப்பால் தெளிவாகக் காட்டுகிறது.
- source_word: רְחַבְעָם
  choice: ரெகொபெயாம்
  rationale: எபிரெயப் பெயரின் ஒலிப்பைத் தமிழில் வேதாகமப் பயன்பாட்டிற்கு ஏற்ற வகையில் எழுத்துப்பெயர்க்கிறது.
- source_word: וּ
  choice: ஆனால்
  rationale: முந்தைய வசனங்களில் வடக்குக் கோத்திரங்கள் விலகிச் சென்றதற்கு மாறாக, யூதாவின் நகரங்களில் இருந்த இஸ்ரவேலர்கள் மட்டும் ரெகொபெயாமின் ஆட்சியில் இருந்ததைச் சூழல் காட்டுவதால் எதிர்மறை இணைப்பு பயன்படுத்தப்பட்டது.
