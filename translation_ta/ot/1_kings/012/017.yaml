translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் வரலாற்று உரைக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெயச் சொல் வரிசையை அப்படியே பின்பற்றாமல், தமிழின் இயல்பான வரிசையில் மக்கள் குழுவை முதலில் குறிப்பிட்டு அரசனையும் வினையையும் இறுதியில் அமைத்துள்ளது.
