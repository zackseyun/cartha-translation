  text: So Israel has rebelled against the house of David to this day[a].
translation:
  language: ta
  text: இவ்வாறு இஸ்ரவேல் இன்றுவரை தாவீதின் வம்சத்திற்கு எதிராகக் கலகம் செய்து வருகிறது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, இன்னும் சொற்சார்பாக: “இவ்வாறு இஸ்ரவேல் தாவீதின் வம்சத்திற்கு எதிராகக் கலகம் செய்தது, இன்றுவரை.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְשְׁעוּ
  choice: கலகம் செய்துவருகிறது
  rationale: அரசியல் சூழலில் פשע என்பது பொதுவான பாவத்தையல்ல, ஆட்சிக்கு எதிரான கலகம் அல்லது கிளர்ச்சியைக் குறிக்கிறது. எபிரேயக் கதைவினையும் தொடர்ந்து நிலவும் சூழலைக் காட்டும் ‘இன்றுவரை’ என்பதையும் தமிழில் இயல்பாக இணைக்க ‘செய்துவருகிறது’ பயன்படுத்தப்பட்டது.
- source_word: יִשְׂרָאֵל
  choice: இஸ்ரவேல்
  rationale: எபிரேயப் பெயர் நேரடியாகத் தக்கவைக்கப்பட்டது. இச்சூழலில் அது தாவீதின் அரச வம்சத்திலிருந்து பிரிந்த வடக்குக் கோத்திரங்களை ஒட்டுமொத்தமாகக் குறிக்கிறது.
- source_word: בְּבֵית דָּוִד
  choice: தாவீதின் வம்சத்திற்கு எதிராக
  rationale: פשע உடன் வரும் בְּ எதிர்க்கப்படும் தரப்பைக் குறிக்கிறது. בֵּית דָּוִד இங்கு ஒரு குடும்ப வீட்டை அல்ல, தாவீதின் அரச வம்சத்தைக் குறிப்பதால் ‘வம்சம்’ தெளிவான இயல்பான தேர்வாகும்.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: இன்றுவரை
  rationale: கதை நிகழ்ந்த காலத்திலிருந்து எழுத்தாளரின் காலம்வரை நிலை தொடர்வதைக் குறிக்கும் நிலையான எபிரேயச் சொற்றொடருக்கு இயல்பான தமிழ் இணை.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘தாவீதின் வீடு’ என்ற சொற்சார்ந்த ஆனால் தமிழில் குழப்பமளிக்கக்கூடிய வடிவத்துக்குப் பதிலாக அரச மரபைக் குறிக்கும் ‘தாவீதின் வம்சம்’ பயன்படுத்தப்பட்டது.
