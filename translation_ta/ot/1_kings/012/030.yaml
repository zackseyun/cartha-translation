source:
  edition: WLC
  text: וַ/יְהִ֛י הַ/דָּבָ֥ר הַ/זֶּ֖ה לְ/חַטָּ֑את וַ/יֵּלְכ֥וּ הָ/עָ֛ם לִ/פְנֵ֥י הָ/אֶחָ֖ד עַד דָּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/030.yaml
  text: And this thing became a sin[a], and the people went before the one as far as Dan.
translation:
  language: ta
  text: இந்தக் காரியம் பாவமாகியது; மக்கள் அந்த ஒன்றின் முன்பாகத் தாண் வரை சென்றார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில் எழுத்துப்படியாக, “அந்த ஒன்றின் முன்பாக.” இது யெரொபெயாம் நிறுவிய இரண்டு கன்றுக்குட்டிகளில் ஒன்றை—குறிப்பாகத் தாணிலிருந்த ஒன்றை—பெரும்பாலும் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ஆகியது
  rationale: לְחַטָּאת என்பதுடன் வரும் היה, வெறுமனே ‘இருந்தது’ என்பதைக் காட்டாமல் ஒரு விளைவு நிலையை, அதாவது ‘பாவமாக ஆனது’ என்பதைக் குறிக்கிறது.
- source_word: הַדָּבָר הַזֶּה
  choice: இந்தக் காரியம்
  rationale: דבר என்பது ‘சொல், விவகாரம், காரியம்’ எனப் பரந்த பொருளுடையது. இங்கு யெரொபெயாம் ஏற்படுத்திய வழிபாட்டு முறையைச் சுட்டுவதால், ‘இந்தக் காரியம்’ இயல்பாகவும் சுட்டுப்பொருளைத் தக்கவைத்தும் உள்ளது.
- source_word: לְחַטָּאת
  choice: பாவமாக
  rationale: இச்சூழலில் חַטָּאת என்பது ‘பாவம்’ என்பதே; ‘பாவபலியாக’ அல்ல. தமிழ் வாக்கியத்தில் ‘பாவமாகியது’ என்பது பெயர்ச்சொல் சார்ந்த எபிரேய கட்டமைப்பின் விளைவுப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיֵּלְכוּ הָעָם
  choice: மக்கள் சென்றார்கள்
  rationale: הלך என்ற வினை கதைநடையில் நேரடியாக ‘சென்றார்கள்’ என்று பொருள்படும். மூலத்தில் வெளிப்படையாக இல்லாத ‘வழிபடச் சென்றார்கள்’ போன்ற விளக்கம் சேர்க்கப்படவில்லை.
- source_word: לִפְנֵי
  choice: முன்பாக
  rationale: לפני என்பதன் அடிப்படைப் பொருள் ‘முன்பாக/முன்னிலையில்’ என்பதாகும். இது சிலைக்கு முன் வழிபடச் சென்றதைக் சூழல் உணர்த்தினாலும், முதன்மை உரை அந்த விளக்கத்தை விரிவுபடுத்தவில்லை.
- source_word: הָאֶחָד
  choice: அந்த ஒன்று
  rationale: எபிரேய உரை பெயர்ச்சொல்லைத் தவிர்த்து எழுத்துப்படியாக ‘அந்த ஒன்று’ என்கிறது. தமிழ் மொழியிலும் அதன் சுருக்கத்தையும் தெளிவின்மையையும் தக்கவைத்து, வாய்ப்புள்ள சுட்டுப்பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: עַד דָּן
  choice: தாண்வரை
  rationale: עַד இட எல்லையைக் குறிக்கிறது; ‘தாண்வரை’ என்பது அந்தப் புவியியல் முடிவிடத்தைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: யெரொபெயாமின் வழிபாட்டு ஏற்பாட்டின் பாவத் தன்மை
  choice: இந்தக் காரியம் பாவமாகியது என்று வசனம் கூறுகிறது; கதையின் கண்டனத்தைத் தாண்டி வேறு பிற்காலக் கோட்பாட்டு வகைப்படுத்தல் சேர்க்கப்படவில்லை.
  alternative: இந்தக் காரியம் பாவத்துக்கு ஏதுவாயிற்று.
  rationale: חַטָּאת சில இடங்களில் ‘பாவபலி’ என்று பொருள்பட்டாலும், இங்குள்ள முறைகேடான வழிபாட்டுச் சூழல் ‘பாவம்’ என்ற பொருளையே கோருகிறது. அதேவேளை, வசனம் சொல்லாத விரிவான இறையியல் விளக்கம் மொழிபெயர்ப்பில் சேர்க்கப்படவில்லை.
- issue: ‘அந்த ஒன்று’ என்பதன் சுட்டுப்பொருள்
  choice: முந்தைய வசனத்தில் கூறப்பட்ட இரண்டு கன்றுக்குட்டிச் சிலைகளில் ஒன்றை, அடுத்து வரும் ‘தாண்வரை’ என்பதன் அடிப்படையில் குறிப்பாகத் தாணிலிருந்த சிலையை, இது பெரும்பாலும் குறிக்கிறது.
  alternative: முதன்மை உரையிலேயே ‘அந்த ஒரு கன்றுக்குட்டிச் சிலை’ என்று வெளிப்படையாக்குதல்.
  rationale: எபிரேய நடை சுருக்கமாகவும் ஓரளவு கடினமாகவும் உள்ளது. அந்த உண்மையான தெளிவின்மையை முதன்மை உரை தக்கவைக்கிறது; வாய்ப்புள்ள சுட்டுப்பொருள் மட்டும் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘அந்த ஒன்று’ என்பது தமிழில் சற்றே அசாதாரணமாக இருந்தாலும், மூல எபிரேயத்தின் திட்டமிட்ட சுருக்கத்தையும் தெளிவின்மையையும் காக்கத் தேர்ந்தெடுக்கப்பட்டது.
