  text: אִֽם יַעֲלֶ֣ה הָ/עָ֣ם הַ/זֶּ֗ה לַ/עֲשׂ֨וֹת זְבָחִ֤ים בְּ/בֵית יְהוָה֙ בִּ/יר֣וּשָׁלִַ֔ם וְ֠/שָׁב לֵ֣ב הָ/עָ֤ם הַ/זֶּה֙ אֶל אֲדֹ֣נֵי/הֶ֔ם אֶל רְחַבְעָ֖ם מֶ֣לֶךְ יְהוּדָ֑ה וַ/הֲרָגֻ֕/נִי וְ/שָׁ֖בוּ אֶל רְחַבְעָ֥ם מֶֽלֶךְ יְהוּדָֽה־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/027.yaml
  text: If this people goes up to offer sacrifices in the house of Yahweh in Jerusalem[a], then the heart of this people will return to their lord, to Rehoboam king of Judah[c][b], and they will kill me and return to Rehoboam king of Judah.
translation:
  language: ta
  text: இந்த மக்கள் எருசலேமிலுள்ள யாவேவின் இல்லத்தில்[b] பலிகளைச் செலுத்துவதற்காக மேலே சென்றால்[a], இந்த மக்களின் மனம் தங்கள் ஆண்டவரான யூதாவின் அரசன் ரெகொபெயாமிடம் திரும்பும்[c]; அவர்கள் என்னைக் கொன்று, யூதாவின் அரசன் ரெகொபெயாமிடமே திரும்புவார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இந்த மக்கள் ... மேலே செல்லும்போது’ என்றும் மொழிபெயர்க்கலாம். எபிரெய நிபந்தனைச் சொல் சில சூழல்களில் காலப்பொருளை அணுகலாம்; இங்கு எரோபெயாம் அஞ்சிய நிபந்தனையாக எடுத்துக்கொள்வது பொருத்தமானது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் ‘யாவேவின் வீடு’; இங்கு எருசலேமிலிருந்த ஆலயத்தைக் குறிக்கிறது.
    reason: cultural_note
  - marker: c
    text: ‘தங்கள் எஜமானரிடம்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் ஆண்டவர் அல்லது எஜமானர் எனப் பொருள்படும்; அடுத்து வரும் விளக்கம் ரெகொபெயாமையே குறிக்கிறது என்பதைத் தெளிவாக்குகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: சென்றால்
  rationale: எரோபெயாமின் அச்சத்திற்குரிய நிபந்தனையைத் தெளிவாகக் காட்டுகிறது; எபிரெயச் சொல் சில சூழல்களில் காலப்பொருள் தரக்கூடியதால் மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: יַעֲלֶה
  choice: மேலே சென்றால்
  rationale: எருசலேமுக்குச் செல்லுதலைக் குறிக்கும் எபிரெய வழக்கின் நிலவியல் மற்றும் வழிபாட்டுப் பயண நுட்பத்தைப் பேணுகிறது.
- source_word: לַעֲשׂוֹת זְבָחִים
  choice: பலிகளைச் செலுத்துவதற்காக
  rationale: சொல்லுக்குச் சொல் ‘பலிகளைச் செய்ய’ என்பதற்குப் பதிலாக, தமிழில் இயல்பாகவும் வழிபாட்டுச் சூழலுக்கு ஏற்றவாறும் உள்ளது.
- source_word: בְּבֵית יְהוָה
  choice: யாவேவின் இல்லத்தில்
  rationale: ‘யாவேவின் வீடு/இல்லம்’ என்ற எபிரெய உருவகத்தைப் பேணுகிறது; அது எருசலேம் ஆலயத்தைக் குறிக்கிறது என்பதை அடிக்குறிப்பு விளக்குகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய வேதப்பெயரான YHWH-ஐ பட்டப்பெயராக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: וְשָׁב לֵב הָעָם הַזֶּה
  choice: இந்த மக்களின் மனம் ... திரும்பிவிடும்
  rationale: ‘மனம் திரும்புதல்’ என்ற மூலமொழி உருவகத்தையும், ரெகொபெயாமிடம் மீண்டும் விசுவாசம் செலுத்தும் அரசியல் பொருளையும் பேணுகிறது.
- source_word: אֶל אֲדֹנֵיהֶם
  choice: தங்கள் ஆண்டவராகிய
  rationale: ஆண்டவர்/எஜமானர் என்ற அதிகார உறவைப் பேணுகிறது; அடுத்து வரும் ரெகொபெயாமின் பெயர் அதன் ஒருமைச் சுட்டைத் தெளிவாக்குகிறது.
- source_word: וַהֲרָגֻנִי
  choice: அவர்கள் என்னைக் கொன்றுவிட்டு
  rationale: הרג என்பதன் நேரடியான பொருளை நவீன தமிழில் தெளிவாகத் தருகிறது; நிகழ்வுகளின் தொடர்ச்சியையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְשָׁבוּ
  choice: திரும்பிவிடுவார்கள்
  rationale: முன்னர் வந்த שׁוב வினையின் மறுபயன்பாட்டைப் பேணி, அஞ்சப்பட்ட அரசியல் மீள்சேர்க்கையை வலியுறுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் வரும் உடன்படிக்கைப் பெயரை ஒரு பொதுப் பட்டப்பெயராக மாற்றாமல் நேரடியாக ஒலிபெயர்க்கிறது.
- issue: ‘மனம் திரும்புதல்’ என்பதன் பொருள்
  choice: மூலமொழி உருவகத்தைப் பேணுதல்
  alternative: மீண்டும் விசுவாசம் செலுத்துவார்கள்
  rationale: இது அரசியல் விசுவாசத்தைக் குறித்தாலும், எபிரெய உரையின் உள்ளார்ந்த ‘மனம்’ என்ற உருவகத்தையும் அதன் சாத்தியமான பரந்த நுட்பத்தையும் அமைதியாகச் சுருக்காமல் வைத்திருக்கிறது.
