  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் மரியாதைமிக்க நடையிலும் வடிவமைக்கப்பட்டது. ‘மேலே செல்,’ ‘மனம் திரும்பு’ ஆகிய மூலமொழி நுட்பங்கள் இயன்றவரை இயல்பான தமிழில் பேணப்பட்டுள்ளன.
