id: 1KI.12.2
reference: 1 Kings 12:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יְהִ֞י כִּ/שְׁמֹ֣עַ יָרָבְעָ֣ם בֶּן נְבָ֗ט וְ/הוּא֙ עוֹדֶ֣/נּוּ בְ/מִצְרַ֔יִם אֲשֶׁ֣ר בָּרַ֔ח מִ/פְּנֵ֖י הַ/מֶּ֣לֶךְ שְׁלֹמֹ֑ה וַ/יֵּ֥שֶׁב יָרָבְעָ֖ם בְּ/מִצְרָֽיִם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/002.yaml
  text: When Jeroboam son of Nebat heard of it—while he was still in Egypt[a], where he had fled from King Solomon—Jeroboam was still living in Egypt.
translation:
  language: ta
  text: நேபாத்தின் மகன் யெரொபெயாம் இதைக் கேள்விப்பட்டபோது[a]—அவன் சாலொமோன் அரசனிடமிருந்து தப்பி ஓடியிருந்த எகிப்திலேயே இன்னும் இருந்தான்—யெரொபெயாம் எகிப்திலேயே தங்கியிருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், யெரொபெயாம் எதைக் கேள்விப்பட்டான் என்பது நேரடியாகச் சொல்லப்படவில்லை; முந்தைய நிகழ்வுகளைப் பற்றிய செய்தி சூழலிலிருந்து புரிந்துகொள்ளப்படுகிறது.
    reason: The source leaves the object of שׁמע implicit, while the Tamil rendering supplies ‘இதை’ for naturalness.
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: கேள்விப்பட்டபோது
  rationale: כִּ prefixed to the infinitive construct introduces a temporal clause. Natural Tamil can express the narrative transition and temporal relationship together without adding a separate ‘இப்போது’.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: நேபாத்தின் மகன் யெரொபெயாம்
  rationale: The patronymic is retained in clear modern Tamil, with the personal names transliterated in familiar Tamil biblical form.
- source_word: וְהוּא עוֹדֶנּוּ בְמִצְרַיִם
  choice: அவன் ... இன்னும் எகிப்தில் இருந்தான்
  rationale: This preserves the circumstantial statement that Jeroboam was still in Egypt when he heard.
- source_word: אֲשֶׁר בָּרַח מִפְּנֵי הַמֶּלֶךְ שְׁלֹמֹה
  choice: அவன் சாலொமோன் அரசனிடமிருந்து தப்பியோடி
  rationale: מִפְּנֵי in this flight context is naturally rendered ‘அரசனிடமிருந்து’; ‘தப்பியோடி’ conveys בָּרַח without adding that fear was necessarily the motive.
- source_word: וַיֵּשֶׁב יָרָבְעָם בְּמִצְרָיִם
  choice: யெரொபெயாம் எகிப்திலேயே தங்கியிருந்தான்
  rationale: ישׁב here denotes continued residence or staying. Repeating the name and location reflects the marked repetition in the Hebrew, while ‘தங்கியிருந்தான்’ is natural current Tamil.
- source_word: שְׁמֹעַ
  choice: இதைக் கேள்விப்பட்டபோது
  rationale: The Hebrew leaves the object of hearing unstated. Tamil benefits from an object, so ‘இதை’ points to the preceding narrative without specifying which report.
theological_decisions: []
translation_notes:
  register: Modern standard Tamil with a dignified narrative register. The parenthetical structure and the Hebrew repetition of Jeroboam and Egypt are retained rather than smoothed away completely.
