source:
  edition: WLC
  text: וַ/יָּ֥שֶׂם אֶת הָ/אֶחָ֖ד בְּ/בֵֽית אֵ֑ל וְ/אֶת הָ/אֶחָ֖ד נָתַ֥ן בְּ/דָֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/029.yaml
  text: He set one in Bethel[a], and the other he put in Dan.
translation:
  language: ta
  text: அவன் ஒன்றைப்[a] பெத்தேலில் வைத்தான்; மற்றொன்றைத் தாணில் வைத்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அதாவது, முந்தைய வசனத்தில் குறிப்பிடப்பட்ட இரண்டு கன்றுக்குட்டிகளில் ஒன்றை. மாற்றாக: “அவன் ஒரு கன்றுக்குட்டியைப் பெத்தேலில் வைத்தான்; மற்றொன்றைத் தாணில் வைத்தான்.”'
    reason: மூல எபிரெயத்தில் பொருளைக் குறிக்கும் பெயர்ச்சொல் இவ்வசனத்தில் விடுபட்டுள்ளது; அதன் குறிப்பு முந்தைய வசனத்திலிருந்து புரிகிறது.
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: வைத்தான்
  rationale: שׂוּם/שִׂים என்பது ‘வை, இடு, அமை’ என்ற பொருளுடைய பொதுவான வினைச்சொல். இங்கு ஓர் இடத்தில் பொருளை வைத்ததைக் குறிக்க ‘வைத்தான்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: אֶת הָאֶחָד
  choice: ஒன்றை
  rationale: சொல்லுக்கு நெருக்கமாக ‘அந்த ஒன்றை’ என இருந்தாலும், முன்பு குறிப்பிடப்பட்ட இரண்டு பொருட்களைப் பிரித்துக் காட்டும் இணையில் நவீன தமிழில் ‘ஒன்றை’ என்பது இயல்பான வடிவம். மூலத்தில் விடுபட்டுள்ள பெயர்ச்சொல் முதன்மை உரையில் சேர்க்கப்படவில்லை.
- source_word: בְּבֵית אֵל
  choice: பெத்தேலில்
  rationale: בְּ என்ற முன்னொட்டு இங்கு இடத்தைக் குறிக்கிறது. בֵּית־אֵל என்பது நிலைபெற்ற ஊர்ப்பெயர் என்பதால் அதன் சொற்பொருளை மொழிபெயர்க்காமல் ‘பெத்தேல்’ என்று ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְאֶת הָאֶחָד
  choice: மற்றொன்றை
  rationale: எழுத்துப்படி ‘அந்த ஒன்றை’ என்றாலும், இரண்டு பொருட்களில் இரண்டாவதை வேறுபடுத்தும் இத்தொடருக்கு ‘மற்றொன்றை’ என்பது தெளிவான, இயல்பான தமிழ்.
- source_word: נָתַן
  choice: வைத்தான்
  rationale: נָתַן என்பதன் அடிப்படைப் பொருள் ‘கொடு’; இடம் சார்ந்த இச்சூழலில் அது ‘வை/இடு’ என்று பொருள்படுகிறது. முதல் வினையோடு தமிழில் ஒரே சொல்லைப் பயன்படுத்துவது பொருளைத் துல்லியமாகவும் இயல்பாகவும் தருகிறது.
- source_word: בְּדָן
  choice: தாணில்
  rationale: בְּ இடத்தைக் குறிக்கிறது; דָּן ஊர்ப்பெயராக ‘தாண்’ என்று ஒலிபெயர்க்கப்பட்டு, இடவேற்றுமை உருபுடன் ‘தாணில்’ என வழங்கப்பட்டுள்ளது.
theological_decisions:
- issue: ‘ஒன்று’, ‘மற்றொன்று’ என்பவற்றின் குறிப்பு
  choice: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட இரண்டு கன்றுக்குட்டிகளையே இவை சுட்டுகின்றன; ஆனால் மூல எபிரெயத்தில் பெயர்ச்சொல் மீண்டும் வராததால் முதன்மை உரையிலும் அது மறைநிலையாகவே வைக்கப்பட்டுள்ளது.
  alternative: ‘அவன் ஒரு கன்றுக்குட்டியைப் பெத்தேலில் வைத்தான்; மற்றொன்றைத் தாணில் வைத்தான்.’
  rationale: சூழலில் குறிப்பு தெளிவாக இருந்தாலும், பெயர்ச்சொல்லைச் சேர்ப்பது மூலத்தின் சொல்விடுபாட்டை விளக்கமாக விரிவாக்கும். ஆகவே மூலத்தின் சுருக்கமும் உண்மையான இலக்கண அமைப்பும் முதன்மை உரையில் பாதுகாக்கப்பட்டு, வெளிப்படையான வாசிப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையான, கண்ணியமான வரலாற்று உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘ஒன்றை—மற்றொன்றை’ என்ற இணை அமைப்பு எபிரெயத்தின் பகிர்வுப் பொருளை இயல்பாக எடுத்துரைக்கிறது; ஊர்ப்பெயர்கள் மரபான தமிழ் வடிவங்களில் வழங்கப்பட்டுள்ளன.
