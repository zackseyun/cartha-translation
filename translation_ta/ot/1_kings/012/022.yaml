source:
  edition: WLC
  text: וַ/יְהִי֙ דְּבַ֣ר הָֽ/אֱלֹהִ֔ים אֶל שְׁמַעְיָ֥ה אִישׁ הָ/אֱלֹהִ֖ים לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/022.yaml
  text: And the word of God came to Shemaiah the man of God[a], saying,
translation:
  language: ta
  text: அப்போது கடவுளின் வார்த்தை கடவுளின் மனிதரான செமாயாவுக்கு வந்து, கூறியதாவது:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மூலத்தில் இவ்விரு இடங்களிலும் ‘கடவுள்’ (אֱלֹהִים) என்றே உள்ளது; தெய்வீகப் பெயரான யாவே (יהוה) இல்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: வந்து
  rationale: וַיְהִי דְּבַר ... אֶל என்ற தீர்க்கதரிசனச் செய்தி அறிமுகச் சொற்றொடரைத் தமிழில் இயல்பாகக் காட்ட, ‘வார்த்தை ... வந்து’ என மொழிபெயர்க்கப்பட்டது.
- source_word: דְּבַר
  choice: வார்த்தை
  rationale: இங்கு இது கடவுளிடமிருந்து வரும் வெளிப்படுத்தப்பட்ட செய்தியைக் குறிக்கிறது; ‘வார்த்தை’ என்பது மூலமொழியின் உருவகத்தையும் வேதாகமச் சொல்வழக்கையும் காக்கிறது.
- source_word: הָאֱלֹהִים
  choice: கடவுள் / இறைவன்
  rationale: இரு இடங்களிலும் אֱלֹהִים உண்மையான கடவுளைக் குறிக்கிறது. தமிழ் வாக்கியத்தில் இயல்புக்காக உடைமைத் தொடர்களில் ‘கடவுளின்’ மற்றும் ‘இறைவனுடைய’ பயன்படுத்தப்பட்டாலும், இரண்டும் ஒரே எபிரெயச் சொல்லையே குறிக்கின்றன.
- source_word: שְׁמַעְיָה
  choice: செமாயா
  rationale: தனிப்பெயர் தமிழில் வழக்கமான ஒலிபெயர்ப்பு மரபின்படி வழங்கப்பட்டது.
- source_word: אִישׁ הָאֱלֹהִים
  choice: இறைவனுடைய மனிதர்
  rationale: தீர்க்கதரிசனப் பணியாளருக்கான மரபுத் தலைப்பை நேரடியாகப் பாதுகாக்கிறது; ‘மனிதர்’ என்பது நவீனத் தமிழில் மரியாதையுடனும் இயல்பாகவும் உள்ளது.
- source_word: לֵאמֹר
  choice: கூறியதாவது
  rationale: அடுத்த வசனத்தில் தொடங்கும் நேரடி இறைச்சொல்லை அறிமுகப்படுத்தும் இணைப்பாகத் தமிழில் இயல்பாக அமைகிறது.
theological_decisions:
- issue: வெளிப்பாட்டு அறிமுகச் சொற்றொடரில் הָאֱלֹהִים என்பதன் மொழிபெயர்ப்பு
  choice: கடவுள் / இறைவன்
  alternative: ஆண்டவர்
  rationale: மூல எபிரெய உரையில் இங்கு אֱלֹהִים உள்ளது; தெய்வீகப் பெயரான יהוה இல்லை. ஆகவே வழக்கமான ஒத்த சொற்றொடருடன் இசைவாக்குவதற்காக ‘ஆண்டவர்’ என்று மாற்றப்படவில்லை.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ். தீர்க்கதரிசன அறிமுகச் சொற்றொடரின் வேதாகமத் தன்மையைப் பேணியபடியே வாக்கியம் இயல்பாக அமைக்கப்பட்டுள்ளது. அடிக்குறி குறியீடு முதன்மை உரையில் சேர்க்கப்பட்டுள்ளது.
