  text: וַ/יֹּ֥אמֶר יָרָבְעָ֖ם בְּ/לִבּ֑/וֹ עַתָּ֛ה תָּשׁ֥וּב הַ/מַּמְלָכָ֖ה לְ/בֵ֥ית דָּוִֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/026.yaml
  text: And Jeroboam said in his heart[a], “Now the kingdom will return to the house of David.”
translation:
  language: ta
  text: யெரொபெயாம் தன் உள்ளத்தில்[a], “இப்போது அரசாட்சி தாவீதின் வம்சத்திடம் திரும்பும்” என்று சொன்னான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தனக்குள்.” எபிரெயத்தில் சொல்லர்த்தமாக, “தன் இருதயத்தில்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: என்று சொன்னான்
  rationale: வாவ் தொடர்வினை கதையை முன்னெடுக்கிறது. தமிழில் மேற்கோளுக்குப் பின் வரும் ‘என்று சொன்னான்’ இயல்பான கதைநடையை வழங்குகிறது.
- source_word: יָרָבְעָם
  choice: யெரொபெயாம்
  rationale: எபிரெய தனிப்பெயரின் ஒலிப்பைத் தமிழ் வேதாகமப் பயன்பாட்டுக்கு ஏற்றவாறு எழுத்துப்பெயர்த்துள்ளது.
- source_word: בְּלִבּוֹ
  choice: தன் உள்ளத்தில்
  rationale: சொல்லர்த்தமான ‘அவனுடைய இருதயத்தில்’ என்ற உருவகத்தையும், உள்ளார்ந்த சிந்தனை என்ற பொருளையும் இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: עַתָּה
  choice: இப்போது
  rationale: யெரொபெயாமின் உடனடியான அச்சத்தையும் காலச் சுட்டையும் சுருக்கமாகக் காட்டுகிறது.
- source_word: תָּשׁוּב
  choice: திரும்பிவிடும்
  rationale: שׁוב என்பதன் ‘திரும்புதல்’ என்ற பொருளைத் தக்கவைத்து, இது யெரொபெயாம் எதிர்பார்க்கும் விளைவு என்பதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַמַּמְלָכָה
  choice: அரசாட்சி
  rationale: இங்கு சொல் நிலப்பரப்பைக் காட்டிலும் அரச அதிகாரமும் ஆட்சியுரிமையும் தாவீதின் வம்சத்துக்குத் திரும்புவதைச் சுட்டுகிறது; ஆகவே ‘அரசாட்சி’ சூழலுக்குப் பொருத்தமானது.
- source_word: לְבֵית דָּוִד
  choice: தாவீதின் வீட்டாரிடம்
  rationale: ‘தாவீதின் வீடு’ என்ற எபிரெய வம்சமரபுச் சொல்லாட்சியின் ஒலியை ஓரளவு காத்தபடி, நபர்களைக் குறிக்கும் இலக்கை தமிழில் தெளிவாக்குகிறது; ‘வம்சம்’ என்று முழுமையாக விளக்கிப் பெயர்ப்பதைத் தவிர்க்கிறது.
theological_decisions:
- issue: בְּלִבּוֹ என்ற உள்ளார்ந்த பேச்சுச் சொல்லாட்சியை மொழிபெயர்த்தல்
  choice: தன் உள்ளத்தில்
  alternative: தனக்குள்
  rationale: எபிரெய மூலத்தின் ‘இதயம்/உள்ளம்’ உருவகத்தைத் தக்கவைத்து, இது வெளிப்படையாகச் சொன்ன பேச்சல்ல, உள்ளார்ந்த சிந்தனை என்பதைக் காட்டுகிறது; எந்தக் கோட்பாட்டு விளக்கமும் சேர்க்கப்படவில்லை.
- issue: הַמַּמְלָכָה என்பதன் அரசியல் நுணுக்கம்
  choice: அரசாட்சி
  alternative: ராஜ்யம்
  rationale: சூழலில் யெரொபெயாம் அஞ்சுவது ஆட்சியுரிமை தாவீதின் வம்சத்திற்குத் திரும்புவதே. ‘அரசாட்சி’ இதைத் தெளிவாக்குகிறது; அதேவேளை எதிர்காலம் குறித்த அவனது எண்ணத்தை உண்மைக் கூற்றாக மாற்றவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் உள்ளார்ந்த-சிந்தனை உருவகம் அடிக்குறிப்புடன் பாதுகாக்கப்பட்டுள்ளது; வம்சச் சொல்லாட்சியும் மிகையாக விளக்கப்படவில்லை.
