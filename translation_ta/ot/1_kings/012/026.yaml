revisions:
- from: யெரொபெயாம் தன் உள்ளத்தில்[a], “இப்போது அரசாட்சி தாவீதின் வீட்டாரிடம் திரும்பிவிடும்” என்று சொன்னான்.
  to: யெரொபெயாம் தன் உள்ளத்தில்[a], “இப்போது அரசாட்சி தாவீதின் வம்சத்திடம் திரும்பும்” என்று சொன்னான்.
