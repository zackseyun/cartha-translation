source:
  edition: WLC
  text: ו/יבו יָרָבְעָ֧ם וְ/כָל הָ/עָ֛ם אֶל רְחַבְעָ֖ם בַּ/יּ֣וֹם הַ/שְּׁלִישִׁ֑י כַּ/אֲשֶׁ֨ר דִּבֶּ֤ר הַ/מֶּ֨לֶךְ֙ לֵ/אמֹ֔ר שׁ֥וּבוּ אֵלַ֖/י בַּ/יּ֥וֹם הַ/שְּׁלִישִֽׁי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/012.yaml
  text: So Jeroboam and all the people came to Rehoboam on the third day[a], just as the king had spoken, saying, “Return to me on the third day.”
translation:
  language: ta
  text: அரசன், “மூன்றாம் நாளில் என்னிடம் திரும்பி வாருங்கள்” என்று கூறியிருந்தபடியே, யெரொபெயாமும் மக்கள் அனைவரும் மூன்றாம் நாளில் ரெகொபெயாமிடம் வந்தார்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சென்றார்கள்.”
    reason: எபிரெய בוא என்ற வினைச்சொல் கதைசொல்லியின் பார்வைநிலையைப் பொறுத்து ‘வந்தார்கள்’ அல்லது ‘சென்றார்கள்’ என்று மொழிபெயர்க்கப்படலாம்.
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: வந்தார்கள்
  rationale: בוא என்பது பார்வைநிலையைப் பொறுத்து ‘வந்தார்கள்’ அல்லது ‘சென்றார்கள்’ என்று பொருள்படலாம். ரெகொபெயாமை நோக்கிச் சென்றதை விவரிக்கும் இச்சூழலில் ‘ரெகொபெயாமிடம் வந்தார்கள்’ என்பது இயல்பான தமிழ்.
- source_word: יָרָבְעָם
  choice: யெரொபெயாம்
  rationale: எபிரெய தனிப்பெயரின் ஒலிப்பை நவீனத் தமிழில் தெளிவாகக் காட்டும் வடிவம்.
- source_word: וְכָל הָעָם
  choice: மக்கள் அனைவரும்
  rationale: עָם இங்கு அரசனிடம் கோரிக்கை வைத்த மக்களை ஒட்டுமொத்தமாகக் குறிக்கிறது; இவ்வடிவம் இயல்பாகவும் விரிவைத் தக்கவைத்தும் உள்ளது.
- source_word: אֶל רְחַבְעָם
  choice: ரெகொபெயாமிடம்
  rationale: אֶל ஒரு நபரை நோக்கிய திசையைச் சுட்டுகிறது; தமிழில் ‘-இடம்’ இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: மூன்றாம் நாளில்
  rationale: எபிரெய காலக் குறிப்பின் வடிவத்தையும் பொருளையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: כַּאֲשֶׁר
  choice: கூறியிருந்தபடியே
  rationale: மக்களின் வருகைக்கும் அரசனின் முந்தைய அறிவுறுத்தலுக்கும் உள்ள துல்லியமான ஒத்திசைவைத் தெரிவிக்கிறது.
- source_word: דִּבֶּר הַמֶּלֶךְ
  choice: அரசன் கூறியிருந்த
  rationale: மக்கள் வருவதற்கு முன்பே அரசன் பேசியிருந்தான் என்பதை இறந்தகால நிறைவு அமைப்பு தெளிவாக்குகிறது.
- source_word: לֵאמֹר
  choice: என்று
  rationale: நேர்கூற்றை அறிமுகப்படுத்த எபிரெயத்தில் பயன்படும் சொல்லைத் தமிழின் இயல்பான மேற்கோள் அமைப்பால் வழங்குகிறது.
- source_word: שׁוּבוּ אֵלַי
  choice: என்னிடம் திரும்பி வாருங்கள்
  rationale: שׁוּב என்பதிலுள்ள திரும்புதல் கருத்தையும், பேசுகிற அரசனை நோக்கி வரவேண்டும் என்ற திசையையும் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
