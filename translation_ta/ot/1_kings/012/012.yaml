- from: எனவே, யெரொபெயாமும் மக்கள் அனைவரும் மூன்றாம் நாளில் ரெகொபெயாமிடம் வந்தார்கள்[a]. “மூன்றாம் நாளில் என்னிடம் திரும்பி வாருங்கள்” என்று அரசன் கூறியிருந்தபடியே அவர்கள் வந்தார்கள்.
  to: அரசன், “மூன்றாம் நாளில் என்னிடம் திரும்பி வாருங்கள்” என்று கூறியிருந்தபடியே, யெரொபெயாமும் மக்கள் அனைவரும் மூன்றாம் நாளில் ரெகொபெயாமிடம் வந்தார்கள்[a].
  rationale: 'The revision removes the duplicated main action and restores the Hebrew relationship: Jeroboam and all the people came on the third day in accordance with the king''s prior words. The lexical alternative for בוא remains anchored to ‘வந்தார்கள்.’'
