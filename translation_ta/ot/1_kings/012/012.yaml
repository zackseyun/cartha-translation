  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வசனத்தின் நீண்ட தொடரைத் தமிழில் தெளிவுக்காக இரண்டு வாக்கியங்களாக அமைத்தாலும், அரசனின் நேர்கூற்றும் ‘கூறியிருந்தபடியே’ என்ற தொடர்பும் முழுமையாகப் பாதுகாக்கப்பட்டுள்ளன.
