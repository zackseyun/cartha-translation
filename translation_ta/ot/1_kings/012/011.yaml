translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, நேரடியான நடை பயன்படுத்தப்பட்டுள்ளது. ‘நுகம்’ என்ற ஆட்சி/ஒடுக்குமுறை உருவகம் பாதுகாக்கப்பட்டுள்ளது; இரு வாக்கியங்களின் ஒப்பீட்டு மிரட்டலும் மீளுரையும் தக்கவைக்கப்பட்டுள்ளன. அடிக்குறிப்பு குறியீடு உரையில் தொடர்புடைய சொல்லுக்குப் பின் இடப்பட்டுள்ளது.
