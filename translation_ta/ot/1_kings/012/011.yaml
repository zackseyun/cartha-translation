source:
  edition: WLC
  text: וְ/עַתָּ֗ה אָבִ/י֙ הֶעְמִ֤יס עֲלֵי/כֶם֙ עֹ֣ל כָּבֵ֔ד וַ/אֲנִ֖י אוֹסִ֣יף עַֽל עֻלְּ/כֶ֑ם אָבִ֗/י יִסַּ֤ר אֶתְ/כֶם֙ בַּ/שּׁוֹטִ֔ים וַ/אֲנִ֕י אֲיַסֵּ֥ר אֶתְ/כֶ֖ם בָּ/עַקְרַבִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/011.yaml
  text: And now[a], my father made your yoke heavy, but I will add to your yoke. My father disciplined you with whips, but I will discipline you with scorpions.
translation:
  language: ta
  text: இப்போது, என் தந்தை உங்கள் நுகத்தை கனமாக்கினார்; நானோ உங்கள் நுகத்தின்மேல் மேலும் சுமையைச் சேர்ப்பேன். என் தந்தை உங்களைச் சாட்டைகளால் தண்டித்தார்; நானோ உங்களைத் தேள்களால்[a] தண்டிப்பேன்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தேள்-சாட்டைகளால்’; எபிரெயத்தில் சொல்லுக்கு சொல், ‘தேள்களால்.’ இது மிகுந்த வலியை உண்டாக்கும்படி செய்யப்பட்ட சாட்டைகள் அல்லது வாரைகளைக் குறித்திருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעְמִיס
  choice: சுமத்தினார்
  rationale: எபிரெய வினைச்சொல்லின் causative பொருளான ‘சுமையை ஏற்றுதல்/சுமத்துதல்’ என்பதைக் காட்டுகிறது; நுகம் என்ற உருவகத்தோடும் இயல்பாக அமைகிறது.
- source_word: עֹל / עֻלְּכֶם
  choice: நுகம் / உங்கள் நுகம்
  rationale: ஒடுக்குமுறை ஆட்சி அல்லது கட்டாய உழைப்பைக் குறிக்கும் மூலமொழியின் தெளிவான உருவகத்தை ‘சுமை’ என்று பொதுமைப்படுத்தாமல் காக்கிறது.
- source_word: כָּבֵד
  choice: பாரமான
  rationale: ‘கனமான/பாரமான’ என்ற நேரடிப் பொருளைத் தக்கவைத்து, நுகத்தின் உருவகத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אוֹסִיף עַל
  choice: இன்னும் பாரத்தைச் சேர்ப்பேன்
  rationale: ‘அதனுடன் மேலும் சேர்ப்பேன்’ என்ற எபிரெய அமைப்பையும், நுகம் இன்னும் கடுமையாக்கப்படும் என்ற சூழற்பொருளையும் தெளிவான தமிழில் தருகிறது.
- source_word: יִסַּר / אֲיַסֵּר
  choice: தண்டித்தார் / தண்டிப்பேன்
  rationale: இச்சொல் பயிற்றுவித்தல், கண்டித்துத் திருத்துதல், தண்டித்தல் ஆகிய பொருட்களைக் கொள்ளலாம்; அரசியல் அச்சுறுத்தலும் சாட்டையடியும் உள்ள இச்சூழலில் ‘தண்டித்தல்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: בַּשּׁוֹטִים
  choice: சாட்டைகளால்
  rationale: சாட்டை அல்லது வாரை என்ற மூலச்சொல்லின் நேரடியான, நவீன தமிழில் எளிதில் புரியும் மொழிபெயர்ப்பு.
- source_word: בָּעַקְרַבִּים
  choice: தேள்களால்
  rationale: மூலமொழி நேரடியாக ‘தேள்கள்’ என்று கூறுவதால் அந்த வலுவான உருவகம் முதன்மை உரையில் காக்கப்படுகிறது; சிறப்பாக வலி உண்டாக்கும் சாட்டைகளைக் குறித்திருக்கக்கூடிய மாற்றுப் புரிதல் அடிக்குறிப்பில் தரப்படுகிறது.
