base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/020.yaml
  text: And when all Israel heard that Jeroboam had returned[a], they sent and called him to the assembly and made him king over all Israel. None followed the house of David except the tribe of Judah alone.
translation:
  language: ta
  text: யெரொபெயாம் திரும்பி வந்துவிட்டான் என்று இஸ்ரவேலர் அனைவரும் கேள்விப்பட்டபோது, அவர்கள் ஆளனுப்பி அவனைச் சபைக்கு அழைத்து, இஸ்ரவேல் முழுவதற்கும் அரசனாக்கினார்கள். யூதா கோத்திரத்தைத் தவிர, தாவீதின் வம்சத்தாருக்கு ஆதரவாக இருந்தவர் வேறு யாரும் இல்லை[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘யூதா கோத்திரம் மட்டுமே தாவீதின் வம்சத்தாரோடு நிலைத்திருந்தது.’ எபிரெய மரபுத்தொடர் சொற்சொல்லாக ‘தாவீதின் வீட்டாருக்குப் பின்னால் இருந்தார்’ என்று கூறி, அவர்களுக்கான அரசியல் ஆதரவு அல்லது பற்றுறுதியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: கேள்விப்பட்டபோது
  rationale: எபிரெயக் கதைநடையின் காலத் தொடர்பை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; ‘அப்போது நிகழ்ந்தது’ என்ற சொற்சொல் அமைப்பைத் தேவையின்றி சேர்க்கவில்லை.
- source_word: כָּל יִשְׂרָאֵל
  choice: இஸ்ரவேலர் அனைவரும்
  rationale: இங்கு தேச மக்களைக் குறிக்கும் கூட்டுப்பெயரைத் தமிழில் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: כִּי שָׁב יָרָבְעָם
  choice: யெரொபெயாம் திரும்பி வந்துவிட்டான் என்று
  rationale: שׁוּב என்பதன் ‘திரும்புதல்’ என்ற பொருளையும், அடுத்த நிகழ்வுகளுக்கு முன்பே அவன் வந்திருந்ததையும் தெரிவிக்கிறது.
- source_word: וַיִּשְׁלְחוּ
  choice: அவர்கள் ஆளனுப்பி
  rationale: மூலத்தில் அனுப்பப்பட்டவர் வெளிப்படையாகக் குறிப்பிடப்படவில்லை. தமிழ் வழக்கில் செயலை இயல்பாகச் சொல்ல ‘ஆளனுப்பி’ பயன்படுத்தப்படுகிறது; குறிப்பிட்ட தூதர் அல்லது குழுவைச் சேர்க்கவில்லை.
- source_word: וַיִּקְרְאוּ אֹתוֹ אֶל הָעֵדָה
  choice: அவனைச் சபைக்கு அழைத்து
  rationale: அரசியல் நடவடிக்கைக்காகக் கூடிய மக்களின் சபைக்கு அவனை வரவழைத்ததைத் தெளிவாகக் கூறுகிறது; திருச்சபை சார்ந்த பிற்காலப் பொருளைத் திணிக்கவில்லை.
- source_word: וַיַּמְלִיכוּ אֹתוֹ עַל כָּל יִשְׂרָאֵל
  choice: இஸ்ரவேல் முழுவதற்கும் அரசனாக்கினார்கள்
  rationale: Hiphil வடிவிலுள்ள ‘அரசனாகச் செய்தார்கள்’ என்ற நேரடிப் பொருளையும் அவன் ஆட்சியின் பரப்பையும் காக்கிறது; முடிசூட்டும் சடங்கைச் சேர்க்கவில்லை.
- source_word: לֹא הָיָה אַחֲרֵי בֵית דָּוִד
  choice: வேறு யாரும் தாவீதின் வீட்டாரைப் பின்பற்றவில்லை
  rationale: ‘தாவீதின் வீட்டாருக்குப் பின்னால் இருத்தல்’ என்ற எபிரெய மரபுத்தொடரின் அரசியல் சார்பு அல்லது விசுவாசத்தை, உருவகத்தை ஓரளவு காத்தபடி இயல்பான தமிழில் தருகிறது.
- source_word: זוּלָתִי שֵׁבֶט יְהוּדָה לְבַדּוֹ
  choice: யூதா கோத்திரம் ஒன்றைத் தவிர
  rationale: விதிவிலக்கையும் לְבַדּוֹ தரும் ‘அது மட்டும்’ என்ற வலியுறுத்தலையும் சுருக்கமாகக் காக்கிறது.
theological_decisions:
- issue: அரசு பிளவுக்குப் பிந்தைய அரசியல் சார்பைக் குறிக்கும் சொற்றொடர்
  choice: தாவீதின் வீட்டாரைப் பின்பற்றவில்லை
  alternative: தாவீதின் வீட்டாரோடு நிலைத்திருக்கவில்லை
  rationale: மூலத்தின் אַחֲרֵי (‘பின்னால்/பின்பற்றி’) என்ற உருவகத்தை முதன்மை உரையில் காக்கிறது. மாற்று வாசிப்பு அதே சூழலில் தொடர்ந்து சேர்ந்திருத்தல் அல்லது விசுவாசமாக நிலைத்திருத்தலை வலியுறுத்தலாம்; எந்தக் குறிப்பிட்ட இறையியல் முடிவையும் உரைக்குள் திணிக்காமல் இந்த நுணுக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; வரலாற்றுக் கதைநடைக்கு ஏற்ற கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை. ‘சபை’, ‘அரசனாக்கினார்கள்’, ‘கோத்திரம்’ போன்ற பரவலாக அறியப்பட்ட வேதாகமச் சொற்கள் பயன்படுத்தப்பட்டுள்ளன; தேவையற்ற சமயப் பிரிவுச் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
