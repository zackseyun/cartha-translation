base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/008.yaml
  text: But he abandoned the advice of the elders that they had given him[a], and consulted with the young men who had grown up with him, who stood before him.
translation:
  language: ta
  text: ஆனால், முதியோர் அவனுக்குக் கொடுத்திருந்த ஆலோசனையை அவன் கைவிட்டு, தன்னுடன் வளர்ந்து அவன்முன் நின்று வந்த இளைஞர்களுடன் கலந்தாலோசித்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனுக்குப் பணிவிடை செய்த இளைஞர்கள்”; “ஒருவர்முன் நிற்றல்” என்ற எபிரெய மரபுத்தொடர் அரசவையில் பணியாற்றுவதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲזֹב
  choice: புறக்கணித்து
  rationale: עזב என்பது விட்டுவிடுதல் அல்லது கைவிடுதல் எனப் பொருள்படும். இங்கு முதியோரின் ஆலோசனையைத் திட்டமிட்டுப் பொருட்படுத்தாமல் ஒதுக்கியதை இயல்பான நவீன தமிழில் இது தெரிவிக்கிறது.
- source_word: עֲצַת
  choice: ஆலோசனையை
  rationale: עֵצָה இச்சூழலில் அரசனுக்குக் கொடுக்கப்பட்ட வழிகாட்டுதலைக் குறிக்கிறது; ‘ஆலோசனை’ தெளிவான, இயல்பான தமிழ்ச் சொல்.
- source_word: הַזְּקֵנִים
  choice: முதியோர்
  rationale: זקנים வயதில் மூத்தவர்களையும் அங்கீகரிக்கப்பட்ட மூத்த ஆலோசகர்களையும் குறிக்கலாம். ‘முதியோர்’ வயது வேறுபாட்டைக் காத்து, சூழலில் அவர்களின் ஆலோசகர் பங்கையும் ஏற்கிறது.
- source_word: אֲשֶׁר יְעָצֻהוּ
  choice: தனக்குக் கூறிய
  rationale: ‘அவர்கள் அவனுக்கு ஆலோசித்த’ என்ற சொல்லுக்குச் சொல் வடிவத்தைவிட, ‘ஆலோசனையை’ என்பதோடு ‘தனக்குக் கூறிய’ என்பது தமிழில் இயல்பாக அமைந்து உடைமைத் தொடர்பைத் தெளிவாக்குகிறது.
- source_word: וַיִּוָּעַץ
  choice: ஆலோசனை கேட்டான்
  rationale: יעץ என்பதன் நிபால் வடிவம் இங்கு பிறருடன் கலந்தாலோசிப்பதைக் குறிக்கிறது. ‘ஆலோசனை கேட்டான்’ என்பது அந்த இளைஞர்களின் கருத்தை நாடிய செயலை இயல்பாகத் தெரிவிக்கிறது.
- source_word: הַיְלָדִים
  choice: இளைஞர்கள்
  rationale: יְלָדִים என்பதற்கு பிள்ளைகள் அல்லது சிறுவர்கள் என்ற பொருள் இருக்கலாம்; ஆனால் இவர்கள் அரசனோடு வளர்ந்து அரண்மனையில் பணிபுரியும் வயதுடையவர்கள். ‘இளைஞர்கள்’ என்பது முதியோருக்கு எதிரான வயது வேறுபாட்டைத் தவறான குழந்தைப் பொருளின்றிக் காட்டுகிறது.
- source_word: אֲשֶׁר גָּדְלוּ אִתּוֹ
  choice: தன்னோடு வளர்ந்தவர்களும்
  rationale: இந்தச் சொற்றொடர் அவனுடன் சேர்ந்து வளர்ந்த சமவயதினரைச் சுட்டுகிறது. தமிழில் தொடர்புச் சொற்றொடராக இவ்வடிவம் இயல்பாக உள்ளது.
- source_word: אֲשֶׁר הָעֹמְדִים לְפָנָיו
  choice: தன்முன் நின்றவர்களுமான
  rationale: எபிரெயச் சொற்றொடரின் நேரடியான உருவகத்தை இது காக்கிறது. அதேவேளை ‘ஒருவர்முன் நிற்றல்’ என்பது அரசவையில் பணியாற்றுதல் அல்லது சேவை செய்தல் என்ற பொருளையும் தரலாம்; அந்த மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
