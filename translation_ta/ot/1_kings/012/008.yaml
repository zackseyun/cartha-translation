revisions:
- from: ஆனால், முதியோர் தனக்குக் கூறிய ஆலோசனையை அவன் புறக்கணித்து, தன்னோடு வளர்ந்தவர்களும் தன்முன் நின்றவர்களுமான இளைஞர்களிடம் ஆலோசனை கேட்டான்.[a]
  to: ஆனால், முதியோர் அவனுக்குக் கொடுத்திருந்த ஆலோசனையை அவன் கைவிட்டு, தன்னுடன் வளர்ந்து அவன்முன் நின்று வந்த இளைஞர்களுடன் கலந்தாலோசித்தான்.[a]
  rationale: The revision retains the Hebrew contrast between the elders and the young men, represents abandonment of counsel directly, and renders the consultation reciprocally. ‘அவன்முன் நின்று வந்த’ preserves the literal Hebrew idiom while reading naturally as an ongoing court role; the footnote supplies its possible functional sense.
