translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் இயல்பான ஆனால் கண்ணியமான கதையாடல் நடை பயன்படுத்தப்பட்டுள்ளது. அரசனைக் குறிக்கும் மூலமொழியின் மூன்றாம் நபர் ஒருமையை மரியாதை வடிவமாக மாற்றாமல் ‘அவன்/என்றான்’ என்று பாதுகாத்துள்ளது.
