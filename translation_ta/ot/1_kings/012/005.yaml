source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֲלֵי/הֶ֗ם לְכ֥וּ עֹ֛ד שְׁלֹשָׁ֥ה יָמִ֖ים וְ/שׁ֣וּבוּ אֵלָ֑/י וַ/יֵּלְכ֖וּ הָ/עָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/005.yaml
  text: He said to them[a], “Go away for three more days, then return to me.” So the people went away.
translation:
  language: ta
  text: அவன் அவர்களிடம், “நீங்கள் போய்விட்டு, இன்னும் மூன்று நாட்கள் கழித்து என்னிடம் திரும்பி வாருங்கள்[a]” என்றான். ஆகவே மக்கள் சென்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இன்னும் மூன்று நாட்களுக்குப் போங்கள்; பின்பு என்னிடம் திரும்பி வாருங்கள்.”
    reason: עוֹד שְׁלֹשָׁה יָמִים என்ற சொற்றொடரை முதல் கட்டளையுடன் நெருக்கமாக இணைத்துப் புரிந்துகொள்ளும் மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם
  choice: அவன் அவர்களிடம் … என்றான்
  rationale: எபிரெயக் கதையாடலில் வரும் வழக்கமான உரை அறிமுகத்தை இயல்பான நவீனத் தமிழில் தருகிறது. மூலத்தில் மரியாதைப் பன்மை இல்லை என்பதால் ‘அவன்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: לְכוּ
  choice: நீங்கள் போய்விட்டு
  rationale: இது הלך என்பதன் பன்மை ஏவல் வடிவம். இச்சூழலில் தூதுக்குழுவைத் தற்காலிகமாக அனுப்பிவைப்பதைக் குறிக்கிறது; ‘போய்விட்டு’ என்பது அடுத்து திரும்பிவர வேண்டும் என்பதையும் இயல்பாக இணைக்கிறது.
- source_word: עוֹד שְׁלֹשָׁה יָמִים
  choice: இன்னும் மூன்று நாட்கள் கழித்து
  rationale: עוֹד உடன் வரும் கால அளவு கூடுதலான மூன்று நாட்களைக் குறிக்கிறது. தமிழில் கால இடைவெளியை இயல்பாக வெளிப்படுத்தும் வகையில் இவ்வாறு தரப்பட்டுள்ளது; சொற்றொடரின் மாற்று இணைப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וְשׁוּבוּ אֵלָי
  choice: என்னிடம் திரும்பி வாருங்கள்
  rationale: שוב என்பதன் பன்மை ஏவல் வடிவத்தையும், אֵלַי என்பதன் திசைநோக்கையும் நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: וַיֵּלְכוּ הָעָם
  choice: ஆகவே மக்கள் சென்றார்கள்
  rationale: மக்கள் கட்டளைக்கிணங்கி அங்கிருந்து சென்றதைத் தொடர்கதையாகக் காட்டுகிறது. הָעָם இலக்கணத்தில் ஒருமையாக இருந்தாலும் கூட்டுப்பொருளுடையதால் தமிழில் பன்மை வினை இயல்பானது.
