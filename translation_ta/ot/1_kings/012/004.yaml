base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/004.yaml
  text: Your father made our yoke heavy[a]. So now, lighten the hard service of your father and his heavy yoke that he put on us[b], and we will serve you.
translation:
  language: ta
  text: “உன் தகப்பன் எங்கள் நுகத்தைப் பாரமாக்கினார்[a]. இப்போது, உன் தகப்பனின் கடினமான பணிச்சுமையையும், அவர் எங்கள் மீது சுமத்திய கனமான நுகத்தையும் இலகுவாக்கு[b]; அப்போது நாங்கள் உனக்குப் பணிசெய்வோம்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எங்கள் நுகத்தைக் கடினமாக்கினார்.” ஒடுக்குமுறையான கடமைகளுக்கான உருவகமாக எபிரெய மொழி ‘நுகம்’ என்பதைக் பயன்படுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: “கடினமான பணிச்சுமை” என்பதை “கடுமையான சேவை” அல்லது “கடின உழைப்பு” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִקְשָׁה אֶת עֻלֵּנוּ
  choice: எங்கள் நுகத்தை கடினமாக்கினார்
  rationale: எபிரெய வினையின் காரணவினைப் பொருளையும் ‘நுகம்’ என்ற ஆட்சிச் சுமை உருவகத்தையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: עֻלֵּנוּ / עֻלּוֹ הַכָּבֵד
  choice: எங்கள் நுகம் / கனமான நுகம்
  rationale: ஒடுக்குமுறையான கடமைகள், கட்டாயப்பணி, வரிச்சுமை ஆகியவற்றைக் குறிக்கும் மூல உருவகத்தை ‘நுகம்’ பாதுகாக்கிறது; இரண்டாவது இடத்தில் כבד என்பதற்கு ‘கனமான’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: הָקֵל
  choice: இலகுவாக்கு
  rationale: ‘கனமான’ என்பதற்கு எதிரான சொல்லுறவைப் பாதுகாத்து, சுமையைக் குறைக்கும்படியான கட்டளையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: מֵעֲבֹדַת אָבִיךָ הַקָּשָׁה
  choice: உன் தகப்பன் எங்கள்மேல் சுமத்திய கடினமான பணி
  rationale: עֲבֹדָה இங்கு உழைப்பு அல்லது அரசனுக்குச் செய்யவேண்டிய சேவைக் கடமையைக் குறிக்கலாம். ‘பணி’ அந்தப் பொருள் வரம்பை அளவுக்கு மீறிக் குறுக்காமல் காக்கிறது; அடுத்த தொடரோடு பகிரப்படும் ‘எங்கள்மேல் சுமத்திய’ என்பதையும் தமிழில் தெளிவாக்குகிறது.
- source_word: אֲשֶׁר נָתַן עָלֵינוּ
  choice: எங்கள்மேல் சுமத்திய
  rationale: நுகம் மற்றும் கடினப் பணியை மக்கள்மேல் விதித்தார் என்ற சூழல்சார் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְנַעַבְדֶךָּ
  choice: அப்போது நாங்கள் உனக்குப் பணிசெய்வோம்
  rationale: வாவ் இணைப்பு இங்கு கோரிக்கைக்கு இணங்கினால் விளையும் உறுதி அல்லது முடிவைக் குறிக்கிறது; ‘அப்போது’ அந்தத் தொடர்பைத் தெளிவாக்குகிறது.
- source_word: אָבִיךָ
  choice: உன் தகப்பன்
  rationale: ரெகொபெயாமை நேரடியாகச் சுட்டும் உறவுமுறையைப் பாதுகாக்கிறது; தமிழில் வேதாகம உரைக்கு ஏற்ற கண்ணியமான பொதுநடை.
