  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘நுகம்’ என்ற மூல உருவகம் பாதுகாக்கப்பட்டுள்ளது; ‘தகப்பன்’ மற்றும் ‘பணிசெய்வோம்’ ஆகியவை உயர்வானதாயினும் சாதாரண வாசகர்களுக்குப் புரியும் வேதாகமப் பதிவுநடையை வழங்குகின்றன. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் சேர்க்கப்பட்டுள்ளன.
