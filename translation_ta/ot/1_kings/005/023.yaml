source:
  edition: WLC
  text: עֲ֠בָדַ/י יֹרִ֨דוּ מִן הַ/לְּבָנ֜וֹן יָ֗מָּ/ה וַ֠/אֲנִי אֲשִׂימֵ֨/ם דֹּבְר֤וֹת בַּ/יָּם֙ עַֽד הַ/מָּק֞וֹם אֲשֶׁר תִּשְׁלַ֥ח אֵלַ֛/י וְ/נִפַּצְתִּ֥י/ם שָׁ֖ם וְ/אַתָּ֣ה תִשָּׂ֑א וְ/אַתָּה֙ תַּעֲשֶׂ֣ה אֶת חֶפְצִ֔/י לָ/תֵ֖ת לֶ֥חֶם בֵּיתִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/023.yaml
  text: My servants will bring them down from Lebanon to the sea[a], and I will make them into rafts on the sea to the place that you direct me, and I will break them apart there, and you will carry them away[b]. And you shall do what I desire by giving food for my household.
translation:
  language: ta
  text: என் பணியாளர்கள் அவற்றை லெபனோனிலிருந்து கடலுக்கு இறக்கிக் கொண்டுவருவார்கள். நீ எனக்குத் தெரிவிக்கும் இடம்வரை அவற்றைக் கடலில் தெப்பங்களாக[a] அமைப்பேன்; அங்கே அவற்றைப் பிரித்துவிடுவேன். பிறகு நீ அவற்றை எடுத்துச் செல்வாய். என் வீட்டாருக்கு உணவு[b] கொடுப்பதன் மூலம் என் விருப்பத்தை நிறைவேற்றுவாய்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மரக்கட்டைத் தெப்பங்களாக.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “என் வீட்டுக்கு அப்பம்.” இங்கு “அப்பம்” என்பது உணவு அல்லது உணவுப் பொருட்களைக் குறிக்கலாம்; “வீடு” என்பது ஈராமின் அரச குடும்பத்தாரையும் வீட்டாரையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדַי
  choice: என் பணியாளர்கள்
  rationale: அரச நிர்வாகம் மற்றும் மரம் கொண்டுவரும் வேலை ஆகியவற்றின் சூழலில், அடிமை நிலையை வலியுறுத்தாமல் ஈராமின் பணியாட்கள் அல்லது தொழிலாளர்களைக் குறிக்கிறது.
- source_word: יֹרִדוּ
  choice: கொண்டுவருவார்கள்
  rationale: இது ירד என்பதன் காரணவினை வடிவம்; லெபனோனிலிருந்து கடற்கரைக்குத் தாழ்வாக மரங்களை இறக்கிக் கொண்டுவரும் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: יָמָּה
  choice: கடலுக்கு
  rationale: இவ்வடிவம் ‘கடலை நோக்கி’ என்றும் பொருள்படலாம்; கடல்வழிப் போக்குவரத்துச் சூழலில் இலக்கைத் தெளிவாகக் காட்ட ‘கடலுக்கு’ என மொழிபெயர்க்கப்பட்டது.
- source_word: אֲשִׂימֵם דֹּבְרוֹת בַּיָּם
  choice: அவற்றைக் கடலில் தெப்பங்களாக மிதக்கச் செய்வேன்
  rationale: மரக்கட்டைகளை ஒன்றாகக் கட்டி கடலில் மிதக்கவிட்டுப் போக்குவரத்து செய்வதைக் கருத்துத் தெளிவோடு இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: עַד הַמָּקוֹם אֲשֶׁר תִּשְׁלַח אֵלַי
  choice: நீ எனக்குத் தெரிவிக்கும் இடம்வரை
  rationale: שׁלח என்பது இங்கு செய்தி அல்லது வழிமுறையை அனுப்பி இலக்கைக் குறிப்பிடுவதைக் குறிக்கலாம்; ‘தெரிவிக்கும்’ என்பது அந்த நடைமுறைப் பொருளைத் தருவதோடு மூலத்தின் சுருக்கத்தையும் காக்கிறது.
- source_word: וְנִפַּצְתִּים
  choice: அவற்றைப் பிரித்துவிடுவேன்
  rationale: தெப்பங்களாகக் கட்டப்பட்ட மரங்களை இலக்கில் அவிழ்த்து தனித்தனியாகப் பிரிப்பதே சூழலுக்கேற்ற பொருள்; ‘நொறுக்குவேன்’ என்ற சொற்சொல் மொழிபெயர்ப்பு தவறான படிமத்தை உருவாக்கும்.
- source_word: תִשָּׂא
  choice: அவற்றை எடுத்துச் செல்வாய்
  rationale: נשא என்பதன் விரிவான ‘தூக்கு, சும, எடுத்துச் செல்’ பொருள்களில், பிரிக்கப்பட்ட மரங்களை அங்கிருந்து கொண்டு செல்வது இச்சூழலுக்கு ஏற்றது.
- source_word: חֶפְצִי
  choice: என் விருப்பத்தை
  rationale: இந்தச் சொல் விருப்பம், ஆசை அல்லது மனவிருப்பத்தைக் குறிக்கிறது; ‘என் விருப்பம்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: לָתֵת לֶחֶם בֵּיתִי
  choice: என் வீட்டாருக்கு உணவு கொடுப்பதன் மூலம்
  rationale: ‘அப்பம்’ இங்கு பொதுவாக உணவு அல்லது provisions என்பதைக் குறிக்கும் ஆகுபெயர்; בֵּיתִי என்பது அரச குடும்பத்தையும் வீட்டாரையும் குறிக்கக்கூடும் என்பதால் ‘என் வீட்டார்’ தேர்ந்தெடுக்கப்பட்டது.
