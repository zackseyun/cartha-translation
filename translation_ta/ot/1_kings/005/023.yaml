translation_notes:
  register: நவீன நிலையான தமிழில், அரசர்களுக்கிடையேயான பணிவான ஆனால் நேரடியான ஒப்பந்த மொழிநடை பயன்படுத்தப்பட்டது. கடல்வழி மரப் போக்குவரத்தின் செயல்முறை சாதாரண வாசகருக்குத் தெளிவாக இருக்கும்படி கூறப்பட்டாலும், மூலத்தில் உள்ள இலக்கு தெரிவிக்கும் சொற்றொடரின் சுருக்கமும் ‘அப்பம்/வீடு’ என்ற ஆகுபெயர்ச்சார்ந்த நுணுக்கமும் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.
