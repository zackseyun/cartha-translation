translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் காக்கப்பட்டுள்ளன. சாலொமோனுக்கான மரியாதைப் பன்மை வினை பயன்படுத்தப்பட்டு, அதோனீராமைப் பற்றிய வினை இயல்பான ஒருமையில் தரப்பட்டுள்ளது. பணிக்குழுக்களின் மாறிமாறிச் செல்லும் அமைப்பும் கட்டாய உழைப்பின் வற்புறுத்தல் தன்மையும் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளன.
