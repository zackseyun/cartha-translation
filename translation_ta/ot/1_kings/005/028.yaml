  yaml_path: translation/ot/1_kings/005/028.yaml
  text: He sent them to Lebanon[a], ten thousand a month in shifts; they would be in Lebanon one month and two months at home[c][b], and Adoniram was over the forced labor.
translation:
  language: ta
  text: அவர்களை மாதத்திற்கு பத்தாயிரம் பேர் வீதம், மாறிமாறி லெபனோனுக்கு அனுப்பினார்; அவர்கள் ஒரு மாதம் லெபனோனிலும் இரண்டு மாதங்கள் தங்கள் வீடுகளிலும் இருப்பார்கள்.[a] கட்டாய உழைப்புக்கு அதோனீராம் பொறுப்பாளராக இருந்தான்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்பொருளாக, “தன் வீட்டில்”; இங்கு ஒவ்வொரு பணியாளரும் லெபனோனில் ஒரு மாதப் பணிக்குப் பின் இரண்டு மாதங்கள் தனது வீட்டில் இருந்ததைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “கட்டாய உழைப்பு” என்பதற்கு “உழைப்புக் கட்டாயவரி” என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் அரசால் கட்டாயமாக விதிக்கப்பட்ட உழைப்பைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלָחֵם
  choice: அவர்களை அனுப்பினார்
  rationale: שלח வினையின் நேரடியான பொருளையும் 3ஆம் நபர் ஆண்பால் பன்மை பின்னொட்டையும் இயல்பான தமிழில் தருகிறது.
- source_word: לְבָנוֹנָה
  choice: லெபனோனுக்கு
  rationale: இடப்பெயரிலுள்ள திசைவேற்றுமை இறுதி, லெபனோனை நோக்கிய இயக்கத்தைக் குறிக்கிறது; தமிழில் நான்காம் வேற்றுமை இயல்பானது.
- source_word: עֲשֶׂרֶת אֲלָפִים בַּחֹדֶשׁ
  choice: மாதத்திற்கு பத்தாயிரம் பேர் வீதம்
  rationale: எண்ணிக்கையுடன் வரும் בַּחֹדֶשׁ இங்கு ஒவ்வொரு மாதத்திற்குமான பகிர்வைக் குறிக்கிறது; சூழலால் எண்ணப்படுவது பணியாளர்கள் என்பதால் ‘பேர்’ சேர்க்கப்பட்டது.
- source_word: חֲלִיפוֹת
  choice: முறைமுறையாக
  rationale: மாறிமாறி வரும் குழுக்கள் அல்லது பணிமுறைகள் என்ற கருத்தைத் தெளிவான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: חֹדֶשׁ יִהְיוּ בַלְּבָנוֹן
  choice: அவர்கள் ஒரு மாதம் லெபனோனில் இருப்பார்கள்
  rationale: ஒருமை ‘மாதம்’ கால அளவாகப் பயன்படுகிறது; அடுத்துள்ள ‘இரண்டு மாதங்கள்’ என்பதுடன் தெளிவாக ஒத்திசைய ‘ஒரு’ சேர்க்கப்பட்டது.
- source_word: שְׁנַיִם חֳדָשִׁים בְּבֵיתוֹ
  choice: இரண்டு மாதங்கள் தங்கள் வீடுகளில்
  rationale: எபிரெயத்தில் சொற்பொருளாக ‘அவனுடைய வீட்டில்’ என்ற ஒருமை இருந்தாலும், கூட்டாகக் குறிப்பிடப்பட்ட ஒவ்வொரு பணியாளரின் சொந்த வீட்டைக் குறிக்கிறது; தமிழில் ‘தங்கள் வீடுகளில்’ இயல்பாக அந்தப் பொருளைத் தருகிறது.
- source_word: וַאֲדֹנִירָם
  choice: அதோனீராம்
  rationale: தனிநபர் பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: עַל הַמַּס
  choice: கட்டாயப் பணிக்கு பொறுப்பாளராக இருந்தான்
  rationale: מַס அரசால் விதிக்கப்பட்ட கட்டாய உழைப்பு அல்லது பணிச் சேவையைக் குறிக்கிறது; வற்புறுத்தலின் பொருளை மென்மையாக்காமல் தெளிவாகத் தருகிறது.
