  register: நவீன தரத் தமிழ்; எளிதில் புரியும் அதேவேளையில் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடை. ‘இளைப்பாறுதல்’ காரணவினைப் பொருளையும் அரசாட்சிசார் அமைதியையும் தக்கவைக்கிறது; அரிதான அல்லது மிகப் பழமையான சொற்கள் தவிர்க்கப்பட்டுள்ளன.
