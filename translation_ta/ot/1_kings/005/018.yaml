  text: ஆனால் இப்போது என் கடவுளாகிய யாவே எனக்குச் சுற்றிலும் அமைதியை அளித்திருக்கிறார்; எதிரியும்[a] இல்லை, தீங்கான நிகழ்வும்[b] இல்லை.
  philosophy: optimal-equivalence
