    text: அல்லது “எதிர்ப்பவன்.” இங்குள்ள எபிரெயச் சொல் பொதுப்பெயர்; “சாத்தான்” என்ற தனிப்பெயரை அவசியமாகக் குறிக்கவில்லை.
