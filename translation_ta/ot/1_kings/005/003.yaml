translation_notes:
  register: நவீனத் தரத் தமிழில், அரசவைக்கான தினசரி உணவுப் பொருட்களின் பட்டியலுக்கேற்ற சுருக்கமான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய உரையில் வினைச்சொல் வெளிப்படையாக இல்லாதபோதும், முந்தைய வசனத்தின் வழங்கல் சூழலை இயல்பான தமிழில் நிறைவு செய்ய ‘வழங்கப்பட்டன’ சேர்க்கப்பட்டுள்ளது. உறுதியற்ற விலங்கு மற்றும் பறவை இனங்கள் அடிக்குறிப்புகளில் வெளிப்படையாகக் குறிப்பிடப்பட்டுள்ளன.
