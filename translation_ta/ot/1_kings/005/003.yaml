  text: ten fattened cattle[a], and twenty pasture-fed cattle, and a hundred sheep[c][b], besides deer and gazelles and roebucks and fattened fowl.
translation:
  language: ta
  text: கொழுக்கவைக்கப்பட்ட மாடுகள் பத்து, மேய்ச்சலில் வளர்ந்த மாடுகள் இருபது, செம்மறியாடுகள் நூறு[a]; இவை தவிர, மான்களும், சிறுமான்களும், வேறொரு வகை மான்களும்[b], கொழுக்கவைக்கப்பட்ட பறவைகளும்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: צֹאן என்பது செம்மறியாடுகளை மட்டும் அல்லாமல், செம்மறியாடுகளையும் வெள்ளாடுகளையும் உள்ளடக்கிய சிறு கால்நடைகளைப் பொதுவாகக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: יַחְמוּר குறிக்கும் விலங்கினம் உறுதியாகத் தெரியவில்லை; இதை ஒருவகை மான் என்றும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
  - marker: c
    text: בַרְבֻּרִים குறிக்கும் பறவையினம் உறுதியாகத் தெரியவில்லை; ‘கொழுக்கவைக்கப்பட்ட வாத்துகள்’ என்பதும் சாத்தியம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָקָר בְּרִאִים
  choice: கொழுக்கவைக்கப்பட்ட மாடுகள்
  rationale: בָקָר என்பது மாடுகளைத் தொகுப்பாகக் குறிக்கிறது; בְּרִאִים இங்கு நன்கு உணவளித்துக் கொழுக்கவைக்கப்பட்டவற்றைக் குறிக்கிறது. தமிழில் இயல்பாகவும் உணவுப் பட்டியலின் பொருளுக்கு ஏற்றவாறும் உள்ளது.
- source_word: בָקָר רְעִי
  choice: மேய்ச்சலில் வளர்ந்த மாடுகள்
  rationale: רְעִי மேய்தல் அல்லது மேய்ச்சலுடன் தொடர்புடையது. முந்தைய கொழுக்கவைக்கப்பட்ட மாடுகளிலிருந்து வேறுபடும் வளர்ப்பு முறையை இந்த மொழிபெயர்ப்பு தெளிவாக்குகிறது.
- source_word: צֹאן
  choice: செம்மறியாடுகள்
  rationale: צֹאן சிறு கால்நடைகளை, குறிப்பாக செம்மறியாடுகளையும் வெள்ளாடுகளையும், தொகுப்பாகக் குறிக்கலாம். பட்டியலில் சுருக்கமாகவும் வழக்கமாகவும் இருக்க ‘செம்மறியாடுகள்’ பயன்படுத்தப்பட்டு, விரிவான பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: לְבַד
  choice: இவை தவிர
  rationale: முதன்மைப் பட்டியலுக்கு மேலாகச் சேர்க்கப்பட்டவற்றை இயல்பான தமிழில் அறிமுகப்படுத்துகிறது.
- source_word: אַיָּל
  choice: மான்கள்
  rationale: இச்சொல் மானை, சில சூழல்களில் குறிப்பாக ஆண் மானைக், குறிக்கிறது. இந்த உணவுப் பட்டியலில் பொதுவான ‘மான்கள்’ என்பது தெளிவான நவீனத் தமிழ்.
- source_word: צְבִי
  choice: சிறுமான்கள்
  rationale: צְבִי பொதுவாக gazelle இனத்தைக் குறிக்கிறது. ‘சிறுமான்’ என்பது அதற்கான புரிந்துகொள்ளத்தக்க தமிழ் விலங்குப் பெயர்.
- source_word: יַחְמוּר
  choice: ரோ மான்கள்
  rationale: இவ்விலங்கின் துல்லியமான இன அடையாளம் உறுதியில்லை. மரபாக முன்வைக்கப்படும் roebuck என்ற அடையாளத்தை ‘ரோ மான்’ பிரதிபலிக்கிறது; ஐயம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: בַרְבֻּרִים אֲבוּסִים
  choice: கொழுக்கவைக்கப்பட்ட பறவைகள்
  rationale: בַרְבֻּרִים எந்தப் பறவை இனத்தைக் குறிக்கிறது என்பது உறுதியில்லை; אֲבוּסִים உணவளித்துக் கொழுக்கவைக்கப்பட்டதைக் குறிக்கிறது. ‘பறவைகள்’ தேவையற்ற இனத் துல்லியத்தைத் தவிர்க்கிறது.
