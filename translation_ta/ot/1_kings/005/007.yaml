lexical_decisions:
- source_word: וְכִלְכְּלוּ
  choice: தேவையானவற்றை வழங்கினார்கள்
  rationale: פִּעֵל வடிவிலுள்ள כלכל இங்கு அரச நிர்வாகச் சூழலில் உணவு உள்ளிட்ட தேவைகளை அளித்துப் பராமரிப்பதைக் குறிக்கிறது. பொதுவாகப் புரியும் தமிழில் பொருளைத் தெளிவாகச் சொல்கிறது; வழங்கப்பட்டவை உணவு மட்டுமே என்று தேவையின்றி வரையறுக்கவில்லை.
- source_word: הַנִּצָּבִים
  choice: அதிகாரிகள்
  rationale: சாலொமோனின் நிர்வாக அமைப்பில் பகுதிகளுக்குப் பொறுப்பாக நியமிக்கப்பட்டவர்களை இச்சொல் குறிக்கிறது. “அதிகாரிகள்” என்பது இயல்பான நவீனத் தமிழ்; குறிப்பான மாற்றுச் சொற்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: הָאֵלֶּה
  choice: இந்த
  rationale: முன்னர் குறிப்பிடப்பட்ட அதிகாரிகளைச் சுட்டும் எளிய அண்மைச் சுட்டுப்பெயரடை.
- source_word: אֶת הַמֶּלֶךְ שְׁלֹמֹה
  choice: சாலொமோன் அரசனுக்கும்
  rationale: எபிரெய மொழியின் பெயரிணைப்பு அமைப்பை இயல்பான தமிழ்ச் சொல்லொழுங்கில் தருகிறது.
- source_word: וְאֵת כָּל הַקָּרֵב אֶל שֻׁלְחַן הַמֶּלֶךְ שְׁלֹמֹה
  choice: சாலொமோன் அரசனின் பந்தியை அணுகிய அனைவருக்கும்
  rationale: הַקָּרֵב என்பதன் “அணுகுதல்” என்ற படிமத்தையும் שֻׁלְחָן என்பதன் அரச பந்தி என்ற பொருளையும் காக்கிறது. அரச பந்தியில் உணவருந்த அனுமதி பெற்றவர்களைக் குறிக்கும் சூழற்பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: אִישׁ חָדְשׁוֹ
  choice: ஒவ்வொருவரும் தமக்குரிய மாதத்தில்
  rationale: ஒவ்வொரு அதிகாரியும் தமக்கு ஒதுக்கப்பட்ட மாதத்தில் முறைப்படி பொறுப்பேற்றார் என்ற பகிர்ந்தளிக்கும் ஒருமைத் தொடரின் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לֹא יְעַדְּרוּ דָּבָר
  choice: எதையும் குறைவாக விட்டுவைக்கவில்லை
  rationale: தேவையான எந்தப் பொருளும் இல்லாமல் போகும்படி அதிகாரிகள் விடவில்லை என்ற செயற்பாட்டு நுணுக்கத்தைப் பாதுகாக்கிறது.
