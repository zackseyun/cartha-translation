  text: These deputies provided for King Solomon and for all who came near the table of King Solomon[a], each in his month[b]; they lacked nothing.
translation:
  language: ta
  text: 'இந்த அதிகாரிகள்[a] சாலொமோன் அரசனுக்கும், சாலொமோன் அரசனின் மேசையை அணுகிய அனைவருக்கும்[b] தேவையானவற்றை வழங்கினார்கள். ஒவ்வொருவரும் தமக்குரிய மாதத்தில் வழங்கினார்கள்; எதுவும் குறையவில்லை.


    [a] “அதிகாரிகள்” என்பதற்கு “நியமிக்கப்பட்ட நிர்வாகிகள்” அல்லது “மாவட்டப் பொறுப்பாளர்கள்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல், குறிப்பிட்ட பகுதிகளுக்குப் பொறுப்பாக நியமிக்கப்பட்ட நிர்வாகிகளைக் குறிக்கிறது.


    [b] “சாலொமோன் அரசனின் மேசையை அணுகிய அனைவருக்கும்” என்பது சொல்லர்த்தமான மொழிபெயர்ப்பு. அரசனின் மேசையில் உணவருந்தும் உரிமை பெற்றிருந்தவர்களை இது குறிக்கிறது.'
  philosophy: optimal-equivalence
  footnotes:
