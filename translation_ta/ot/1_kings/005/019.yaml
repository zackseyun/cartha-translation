source:
  edition: WLC
  text: וְ/הִנְ/נִ֣י אֹמֵ֔ר לִ/בְנ֣וֹת בַּ֔יִת לְ/שֵׁ֖ם יְהוָ֣ה אֱלֹהָ֑/י כַּ/אֲשֶׁ֣ר דִּבֶּ֣ר יְהוָ֗ה אֶל דָּוִ֤ד אָבִ/י֙ לֵ/אמֹ֔ר בִּנְ/ךָ֗ אֲשֶׁ֨ר אֶתֵּ֤ן תַּחְתֶּ֨י/ךָ֙ עַל כִּסְאֶ֔/ךָ הֽוּא יִבְנֶ֥ה הַ/בַּ֖יִת לִ/שְׁמִֽ/י׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/019.yaml
  text: And behold[a], I intend to build a house for the name of Yahweh my God, just as Yahweh spoke to David my father, saying, ‘Your son, whom I will set in your place on your throne[c][b], he will build the house for my name.’
translation:
  language: ta
  text: இதோ, என் கடவுளாகிய யாவேயின் பெயருக்காக ஒரு வீட்டைக்[a][b] கட்ட நான் திட்டமிட்டுள்ளேன்; யாவே என் தந்தை தாவீதிடம், “உனக்குப் பதிலாக உன் அரியணையில் நான் அமர்த்தும் உன் மகனே[c] என் பெயருக்காக அந்த வீட்டைக் கட்டுவான்” என்று கூறியபடியே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஓர் ஆலயத்தைக் கட்ட.’ எபிரெய மொழியில் சொற்சொல்லாக, ‘ஒரு வீட்டைக் கட்ட.’
    reason: lexical_alternative
  - marker: b
    text: ‘யாவேயின் பெயருக்காக’ என்பது அந்த வீடு யாவேயின் திருநாமத்துக்கும் பிரசன்னத்துக்கும் அர்ப்பணிக்கப்பட்டது என்பதைக் குறிக்கும் எபிரெய ஆலயச் சொற்றொடர்.
    reason: cultural_note
  - marker: c
    text: அல்லது, ‘உனக்குப் பின் நான் நியமிக்கும் உன் மகன்.’ எபிரெய மொழியில் சொற்சொல்லாக, ‘உனக்குப் பதிலாக நான் வைக்கும் உன் மகன்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנְנִי אֹמֵר
  choice: இதோ, ... கட்ட நான் எண்ணியிருக்கிறேன்
  rationale: הִנְנִי என்பதன் கவன ஈர்ப்பு வலிமையை ‘இதோ’ தக்கவைக்கிறது; இச்சூழலில் אֹמֵר வெறும் ‘சொல்கிறேன்’ என்பதல்ல, சாலொமோனின் தற்போதைய நோக்கம் அல்லது உறுதியைக் குறிக்கிறது.
- source_word: לִבְנוֹת בַּיִת
  choice: ஒரு வீட்டைக் கட்ட
  rationale: בַּיִת என்பதன் அடிப்படைப் பொருளான ‘வீடு’ தக்கவைக்கப்படுகிறது. இங்கு குறிக்கப்படுவது ஆலயம் என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- source_word: לְשֵׁם יְהוָה אֱלֹהָי
  choice: என் கடவுளாகிய யாவேயின் பெயருக்காக
  rationale: ‘பெயருக்காக’ என்ற எபிரெய ஆலயச் சொற்றொடரை மரியாதை செலுத்துதல் போன்ற விளக்கவுரையாக மாற்றாமல் தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநாமமான יהוה-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், நவீன தமிழில் தெளிவான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: சொன்னபடியே
  rationale: சாலொமோனின் திட்டம் முந்தைய இறைவாக்குடன் ஒத்திருக்கிறது என்ற ஒப்புமைத் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר אֶתֵּן תַּחְתֶּיךָ עַל כִּסְאֶךָ
  choice: உனக்குப் பதிலாக உன் அரியணையில் நான் அமர்த்தும்
  rationale: அரச வாரிசைத் தாவீதின் இடத்தில் அரியணையில் அமர்த்துவதைத் தெளிவாகக் கூறுகிறது; ‘கொடுப்பேன்’ என்ற சொற்சொல்லான வடிவம் தமிழில் ஏற்படுத்தக்கூடிய குழப்பத்தைத் தவிர்க்கிறது.
- source_word: הוּא יִבְנֶה
  choice: அவனே ... கட்டுவான்
  rationale: הוּא தரும் வலியுறுத்தலை ‘அவனே’ என்பதால் தக்கவைக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைத் திருநாமத்தை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் ஒரு பொதுப் பட்டப்பெயர் அல்ல, இறைவனின் தனிப்பட்ட திருநாமமே உள்ளது; ஆகவே அதை ஒலிபெயர்த்து மூல வேறுபாட்டைத் தக்கவைக்கிறது.
- issue: ‘யாவேயின் பெயருக்காக’ என்ற ஆலயச் சொற்றொடர்
  choice: பெயருக்காக என்ற வடிவத்தைத் தக்கவைத்தல்
  alternative: யாவேயை மகிமைப்படுத்துவதற்காக
  rationale: இந்தச் சொற்றொடர் பெயர், அர்ப்பணிப்பு, இறைப் பிரசன்னம் ஆகியவற்றோடு தொடர்புடைய வளமான வேதாகமப் பொருளைக் கொண்டுள்ளது; அதை ‘மகிமைப்படுத்துதல்’ என்ற ஒரே விளக்கத்திற்குள் சுருக்கவில்லை.
- issue: தாவீதுக்குப் பின் மகனை அமர்த்துதல்
  choice: உனக்குப் பதிலாக உன் அரியணையில் நான் அமர்த்தும்
  alternative: உனக்குப் பின் நான் நியமிக்கும்
  rationale: அரச வாரிசுரிமையை இயல்பாக வெளிப்படுத்துவதோடு, תַּחְתֶּיךָ மற்றும் עַל כִּסְאֶךָ ஆகிய இரு கூறுகளையும் மொழிபெயர்ப்பில் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதைமிக்க நடை பயன்படுத்தப்பட்டுள்ளது. ‘இதோ’, ‘பெயருக்காக’, ‘அவனே’ ஆகியவை மூலத்தின் உரையாடல் வலிமை, ஆலயச் சொற்றொடர், வலியுறுத்தல் ஆகியவற்றைத் தக்கவைக்கின்றன. ‘அரியணை’ அரசச் சூழலுக்கேற்ற உயர்நடைச் சொல்; மற்ற வாக்கிய அமைப்பு இயல்பாக வைக்கப்பட்டுள்ளது.
