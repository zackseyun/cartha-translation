source:
  edition: WLC
  text: וַ/יְצַ֣ו הַ/מֶּ֡לֶךְ וַ/יַּסִּעוּ֩ אֲבָנִ֨ים גְּדֹל֜וֹת אֲבָנִ֧ים יְקָר֛וֹת לְ/יַסֵּ֥ד הַ/בָּ֖יִת אַבְנֵ֥י גָזִֽית׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/031.yaml
  text: Then the king commanded[a], and they quarried great stones, costly stones, cut stones[b], to lay the foundation of the house.
translation:
  language: ta
  text: அரசன் கட்டளையிட்டான்; அவர்கள் ஆலயத்திற்கு[a] அடித்தளம் அமைப்பதற்காகப் பெரிய கற்களையும், விலையுயர்ந்த கற்களையும், செதுக்கப்பட்ட கற்களையும் கொண்டுவந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “வீட்டிற்கு”; இங்கு அது ஆலயத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו הַמֶּלֶךְ
  choice: அரசன் கட்டளையிட்டான்
  rationale: தொடர்நிலை வினை வடிவம் அடுத்த நிகழ்வை அறிமுகப்படுத்துகிறது; தமிழில் இயல்பாகவும் நேரடியாகவும் இவ்வாறு மொழிபெயர்க்கப்படுகிறது.
- source_word: וַיַּסִּעוּ
  choice: கொண்டுவந்து
  rationale: נסע என்பதன் இக்காரணவினை வடிவம் கற்களைப் பெயர்த்து அல்லது எடுத்துவருவதைக் குறிக்கலாம். கற்கள் வெட்டியெடுக்கப்பட்டன என்று மூலத்தில் வெளிப்படையாகச் சொல்லப்படாததால், பரந்த பொருளைத் தக்கவைக்கும் 'கொண்டுவந்து' தேர்ந்தெடுக்கப்பட்டது.
- source_word: אֲבָנִים גְּדֹלוֹת
  choice: பெரிய கற்கள்
  rationale: பெயர்ச்சொல் மற்றும் பெயரடை இரண்டையும் நேராகவும் இயல்பான நவீனத் தமிழிலும் வழங்குகிறது.
- source_word: אֲבָנִים יְקָרוֹת
  choice: விலையுயர்ந்த கற்கள்
  rationale: יקר இங்கு இரத்தினக் கற்களைக் காட்டிலும் மதிப்பும் செலவும் மிக்க கட்டுமானக் கற்களைக் குறிக்கிறது.
- source_word: לְיַסֵּד
  choice: அடித்தளம் அமைத்தார்கள்
  rationale: கட்டுமானச் சூழலில் יסד அடித்தளம் இடுதல் அல்லது அமைத்தல் என்ற பொருளுடையது; தமிழில் 'அடித்தளம் அமைத்தல்' இயல்பான சொற்றொடர்.
- source_word: הַבַּיִת
  choice: ஆலயம்
  rationale: எபிரெயச் சொல் நேரடியாக 'வீடு' என்றாலும், இச்சூழலில் அது சாலொமோன் கட்டும் ஆண்டவரின் ஆலயத்தைக் குறிக்கிறது; நவீன வாசகருக்குத் தெளிவாக 'ஆலயம்' பயன்படுத்தப்பட்டது, மூலச் சொல்லை அடிக்குறிப்பு பதிவு செய்கிறது.
- source_word: אַבְנֵי גָזִית
  choice: செதுக்கப்பட்ட கற்கள்
  rationale: גזית வெட்டிச் செம்மைப்படுத்தப்பட்ட கட்டுமானக் கற்களைக் குறிக்கிறது. 'செதுக்கப்பட்ட' என்பது நவீனத் தமிழில் தெளிவானது. இந்த இறுதித் தொடர் முந்திய கற்களை மேலும் விவரிக்கும் இணைப்பாகக் கொள்ளப்பட்டது.
theological_decisions:
- issue: הַבַּיִת என்பதன் சூழல்சார் குறிப்பு
  choice: முதன்மை உரையில் 'ஆலயம்'
  alternative: '''வீடு'' அல்லது ''ஆண்டவரின் இல்லம்'''
  rationale: இங்கு கட்டப்படுவது ஆலயம் என்பது சூழலில் தெளிவு. 'ஆலயம்' தெளிவைக் கொடுக்கிறது; எனினும் எபிரெய மூலத்தின் சொற்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. எபிரெயச் செய்யுளில் திரும்பத் திரும்ப வரும் 'கற்கள்' என்ற சொல், மூன்று இணையான விளக்கங்களின் அழுத்தத்தைப் பாதுகாக்கத் தமிழிலும் வைக்கப்பட்டுள்ளது.
