revisions:
- from: அரசன் கட்டளையிட்டான்; அவர்கள் பெரிய கற்களையும் விலையுயர்ந்த கற்களையும் செதுக்கப்பட்ட கற்களையும் கொண்டுவந்து, ஆலயத்திற்கு[a] அடித்தளம் அமைத்தார்கள்.
  to: அரசன் கட்டளையிட்டான்; அவர்கள் ஆலயத்திற்கு[a] அடித்தளம் அமைப்பதற்காகப் பெரிய கற்களையும், விலையுயர்ந்த கற்களையும், செதுக்கப்பட்ட கற்களையும் கொண்டுவந்தார்கள்.
  rationale: The revision changes the final construction to “அடித்தளம் அமைப்பதற்காக” (“for laying the foundation”), reflecting the Hebrew infinitive of purpose. It retains the draft's appropriately cautious rendering of the stone-moving verb as “கொண்டுவந்தார்கள்,” preserves all three stone descriptions, and keeps the contextual rendering “ஆலயம்” with a footnote documenting the Hebrew “house.”
