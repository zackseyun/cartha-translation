  text: אַתָּ֨ה יָדַ֜עְתָּ אֶת דָּוִ֣ד אָבִ֗/י כִּ֣י לֹ֤א יָכֹל֙ לִ/בְנ֣וֹת בַּ֗יִת לְ/שֵׁם֙ יְהוָ֣ה אֱלֹהָ֔י/ו מִ/פְּנֵ֥י הַ/מִּלְחָמָ֖ה אֲשֶׁ֣ר סְבָבֻ֑/הוּ עַ֤ד תֵּת יְהוָה֙ אֹתָ֔/ם תַּ֖חַת כַּפּ֥וֹת רגל/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/017.yaml
  text: You know that David my father could not build a house for the name of Yahweh his God because of the warfare that surrounded him[a], until Yahweh put them under the soles of his feet.
translation:
  language: ta
  text: “என் தந்தையான தாவீது, தம் கடவுளாகிய யாவேயின் பெயருக்காக ஒரு இல்லத்தைக் கட்ட முடியவில்லை என்பதை நீர் அறிவீர்; அவரைச் சூழ்ந்திருந்த போர்நிலையின் காரணமாக, யாவே அவர்களை அவரது பாதங்களின் உள்ளங்கால்களுக்குக் கீழே வைக்கும்வரை அவரால் அவ்வாறு செய்ய முடியவில்லை.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவர்களை’ என்பது மூலத்தில் வெளிப்படையாகப் பெயரிடப்படாத பன்மைக் குறிப்பாகும். தாவீதைச் சூழ்ந்த போருடன் தொடர்புடைய எதிரிகளைக் குறிக்கலாம். ‘பாதங்களின் உள்ளங்கால்களுக்குக் கீழே’ என்பது முழுமையான அடக்கத்தைக் குறிக்கும் உருவகம்.
    reason: மூலத்தின் வெளிப்படையற்ற பன்மைக் குறிப்பையும் ‘பாதங்களின் உள்ளங்கால்கள்’ என்ற வெற்றி உருவகத்தையும் விளக்குதல்
lexical_decisions:
- source_word: אַתָּה יָדַעְתָּ
  choice: நீர் அறிவீர்
  rationale: நேரடியாக ஒருவரிடம் மரியாதையுடன் பேசும் நவீனத் தமிழில், நிறைவேற்றுவினை இங்கு நிகழ்கால அறிவைச் சுட்டுவதால் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: בַּיִת
  choice: ஓர் இல்லம்
  rationale: இது கட்டப்படவிருந்த ஆலயத்தைக் குறித்தாலும், எபிரேயச் சொல்லின் ‘வீடு/இல்லம்’ என்ற உருவகத்தையும் ‘யாவேயின் பெயருக்காக’ என்ற சொற்றொடரையும் காக்கிறது.
- source_word: לְשֵׁם יְהוָה אֱלֹהָיו
  choice: தம் கடவுளாகிய யாவேயின் பெயருக்காக
  rationale: ‘பெயருக்காக’ என்ற உடன்படிக்கைச் சொல்லாட்சியை ‘மகிமைக்காக’ போன்ற விளக்க மொழியாக மாற்றாமல் பாதுகாக்கிறது.
- source_word: מִפְּנֵי הַמִּלְחָמָה אֲשֶׁר סְבָבֻהוּ
  choice: அவரைச் சூழ்ந்தவர்கள் போர் செய்ததே அதற்குக் காரணம்
  rationale: ‘போர்’ என்பது ஒருமையாக இருந்தாலும், ‘சூழ்ந்தார்கள்’ என்ற வினையும் பின்னரும் வரும் ஆண்பால் பன்மைச் சுட்டுப்பெயரும் மனித எதிரிகளை மறைமுக எழுவாயாகக் காட்டுகின்றன; தமிழில் பொருள் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்தப்பட்டது.
- source_word: עַד תֵּת יְהוָה אֹתָם
  choice: யாவே அவர்களைக் ... கீழே கொண்டுவரும்வரை
  rationale: נתן என்பதன் அடிப்படை ‘கொடு/வை’ பொருளையும், பாதங்களுக்குக் கீழ்ப்படுத்துதல் என்ற வெற்றி உருவகத்தையும் இணைத்து வெளிப்படுத்துகிறது.
- source_word: תַּחַת כַּפּוֹת רַגְלוֹ
  choice: தாவீதின் உள்ளங்கால்களுக்குக் கீழே
  rationale: כַּפּוֹת என்பது பாதங்களின் அடிப்பகுதிகளைத் துல்லியமாகக் குறிக்கிறது. தமிழில் சுட்டுப்பெயரின் தொடர்பு குழப்பமடையாமல் இருக்க ‘தாவீதின்’ என்று பெயர் மீண்டும் சொல்லப்பட்டது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பொதுப் பட்டப்பெயர் அல்லாமல் நான்கெழுத்து உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது; ஆகவே தனிப்பட்ட இறைப் பெயரை ஒலிபெயர்த்து வழங்குகிறது.
- issue: ‘அவர்களை’ என்பதன் குறிப்பு
  choice: தாவீதைச் சூழ்ந்து போர் செய்தவர்கள்
  alternative: போர்கள்
  rationale: הַמִּלְחָמָה ‘போர்’ என்பது பெண்பால் ஒருமை; ஆனால் סְבָבֻהוּ என்பதன் எழுவாயும் אֹתָם என்பதும் பன்மையாக இருப்பதால், உரையில் வெளிப்படையாகப் பெயரிடப்படாத போரிடும் எதிரிகளைக் குறிப்பதாக எடுத்துக்கொள்ளப்பட்டது. மூலத்தின் சற்றே இறுக்கமான இலக்கண அமைப்பு அடிக்குறிப்பில் தெரிவிக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், அரசரிடம் பேசுவதற்கேற்ற மரியாதை ஒருமையான ‘நீர்’ பயன்படுத்தப்பட்டது. ‘ஆலயம்’ என்று விளக்கமாக்காமல் ‘இல்லம்’ என மூல உருவகம் காக்கப்பட்டது; அதேவேளை நீண்ட எபிரேய வாக்கியம் வாசிப்புத் தெளிவுக்காக மூன்று தமிழ்வாக்கியங்களாகப் பிரிக்கப்பட்டது.
