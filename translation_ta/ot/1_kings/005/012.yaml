  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘சொன்னார்’ என்பது மூல வினையைப் பாதுகாக்கிறது; ‘இயற்றினார்’ என்று விளக்கமாகத் தீர்மானிக்கவில்லை. அடிக்குறிப்பு குறியீடு முதன்மை உரையில் சேர்க்கப்பட்டுள்ளது.
