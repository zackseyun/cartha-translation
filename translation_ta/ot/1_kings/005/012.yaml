base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/012.yaml
  text: He spoke three thousand proverbs[a], and his songs were one thousand and five.
translation:
  language: ta
  text: அவர் மூவாயிரம் நீதிமொழிகளைச் சொன்னார்[a]; அவருடைய பாடல்கள் ஆயிரத்து ஐந்தாக இருந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “மூவாயிரம் ஞானவாக்குகளை” அல்லது “மூவாயிரம் உவமைகளை”; எபிரெய மָשָׁל என்ற சொல்லின் பொருள் வரம்பு “நீதிமொழி” என்பதைவிடப் பரந்தது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: சொன்னார்
  rationale: பியேல் வடிவிலுள்ள דבר என்பதன் நேரடியான பொருள் ‘பேசுதல்/சொல்லுதல்.’ சூழலால் ‘இயற்றினார்’ என்பது உட்கருத்தாக இருக்கலாம்; ஆனால் எபிரெய வினை அதை வெளிப்படையாகக் கூறவில்லை.
- source_word: שְׁלֹשֶׁת אֲלָפִים
  choice: மூவாயிரம்
  rationale: எண்ணிக்கையை இயல்பான நவீனத் தமிழில் நேரடியாகக் குறிக்கிறது.
- source_word: מָשָׁל
  choice: நீதிமொழிகளை
  rationale: இச்சொல் பழமொழி, ஞானவாக்கு, உவமை போன்ற பரந்த பொருள் வரம்பைக் கொண்டது. சாலொமோனின் ஞான மரபு சார்ந்த இச்சூழலில் ‘நீதிமொழிகள்’ முதன்மைப் பொருத்தமான தேர்வு; எண்ணிக்கைக்குப் பின் தமிழில் பன்மை வேற்றுமை உருபுடன் இயல்பாக வழங்கப்பட்டுள்ளது.
- source_word: וַיְהִי
  choice: (அவருடைய பாடல்கள்) ஆயிரத்து ஐந்து
  rationale: இங்கு היה எண்ணிக்கையின் மொத்தத்தைச் சுட்டும் இணைப்புவினையாக உள்ளது. தமிழில் தனி வினைச் சொல்லின்றி பெயர்ப் பயனிலையாக வழங்குவது இயல்பானது.
- source_word: שִׁירוֹ
  choice: அவருடைய பாடல்கள்
  rationale: மூலத்தில் ஒருமை வடிவம் இருந்தாலும் எண்ணிக்கையுடன் கூட்டுப் பொருளில் வருகிறது; தமிழில் எண்ணிக்கைக்கேற்ப பன்மையாக வழங்கப்பட்டுள்ளது.
- source_word: חֲמִשָּׁה וָאָלֶף
  choice: ஆயிரத்து ஐந்து
  rationale: எபிரெயத்தில் சொற்சொல்லாக ‘ஐந்தும் ஆயிரமும்’ என்ற வரிசை உள்ளது. அதே துல்லிய எண்ணிக்கையை இயல்பான தமிழ் எண் அமைப்பில் வழங்குகிறது.
