base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/026.yaml
  text: And Yahweh gave wisdom to Solomon[a], just as he had spoken to him. And there was peace between Hiram and Solomon[b], and the two of them made a covenant.
translation:
  language: ta
  text: யாவே சாலொமோனுக்குத் தாம் அவனிடம் கூறியபடியே[a] ஞானத்தைக் கொடுத்தார். ஈராமுக்கும் சாலொமோனுக்கும் இடையே சமாதானம் நிலவியது; அவர்கள் இருவரும் ஓர் உடன்படிக்கை செய்துகொண்டார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தாம் அவனுக்கு வாக்குறுதி அளித்தபடியே.” எபிரெய வினை நேரடியாக “கூறினார்” என்று பொருள்படும்; இச்சூழலில் அது யாவே முன்பு அளித்த வாக்குறுதியைக் குறிக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: எபிரெயத்தில் நேரடியாக, “ஓர் உடன்படிக்கையை வெட்டினார்கள்”; இது உடன்படிக்கை செய்துகொள்வதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெயத் தெய்வீகப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், அதன் பரவலான தமிழ் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: נָתַן חָכְמָה
  choice: ஞானத்தைக் கொடுத்தார்
  rationale: ‘கொடுத்தார்’ என்பது வினையின் எளிய பொருளையும், ‘ஞானம்’ என்பது חָכְמָה என்பதன் வழக்கமான பொருளையும் இயல்பான தமிழில் காக்கின்றன.
- source_word: כַּאֲשֶׁר דִּבֶּר לוֹ
  choice: தாம் அவனிடம் கூறியபடியே
  rationale: דִּבֶּר என்பதன் நேரடியான ‘பேசினார்/கூறினார்’ என்ற பொருளைக் காக்கிறது; அதை ‘வாக்குறுதி அளித்தார்’ என்று விளக்கமாகத் தீர்மானிப்பதைத் தவிர்க்கிறது.
- source_word: וַיְהִי שָׁלוֹם
  choice: சமாதானம் நிலவியது
  rationale: இரு அரசர்களுக்கும் இடையிலான அமைதியான உறவை நவீன தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: וַיִּכְרְתוּ בְרִית
  choice: ஓர் உடன்படிக்கை செய்துகொண்டார்கள்
  rationale: ‘உடன்படிக்கையை வெட்டினார்கள்’ என்ற எபிரெய மரபுத்தொடரின் பொருளை இயல்பான தமிழில் தருவதோடு, בְרִית என்பதன் உடன்படிக்கைச் சொல்லாட்சியையும் காக்கிறது.
- source_word: שְׁנֵיהֶם
  choice: அவர்கள் இருவரும்
  rationale: இரு தரப்பினரின் பரஸ்பரப் பங்கேற்பைத் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் உள்ள தனிப்பெயரைப் பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்த்து, மூல உரையின் வேறுபாட்டைக் காக்கிறது.
- issue: בְרִית என்பதை அரசியல் ‘ஒப்பந்தம்’ எனவா, ‘உடன்படிக்கை’ எனவா வழங்குவது
  choice: உடன்படிக்கை
  alternative: சமாதான ஒப்பந்தம்
  rationale: சூழல் அரசியல் சார்ந்ததாக இருந்தாலும், எபிரெயத்தில் வழக்கமான உடன்படிக்கைச் சொல் பயன்படுத்தப்பட்டுள்ளதால் அதன் சொல்லியல் தொடர்ச்சியைப் பாதுகாக்கிறது.
- issue: דִּבֶּר என்பதை ‘கூறினார்’ எனவா, ‘வாக்குறுதி அளித்தார்’ எனவா வழங்குவது
  choice: கூறினார்
  alternative: வாக்குறுதி அளித்தார்
  rationale: முந்தைய இறைவார்த்தை ஒரு வாக்குறுதியாகப் புரிந்துகொள்ளப்படலாம்; இருப்பினும் மூல வினை பொதுவாக ‘பேசுதல்/கூறுதல்’ என்பதால் அந்தத் திறந்த தன்மை முதன்மை உரையில் காக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பான, மரியாதையும் கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டது. இறைவனைக் குறிக்க ‘தாம்/கொடுத்தார்’ என்ற மரியாதை ஒருமை கையாளப்பட்டது. அரசியல் அமைதியை ‘சமாதானம் நிலவியது’ என்றும், பரஸ்பர உடன்படிக்கையை ‘செய்துகொண்டார்கள்’ என்றும் தெளிவாக வழங்குகிறது.
