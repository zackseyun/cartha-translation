- from: பின்பு சாலொமோன் ஈராமிடம்[a] ஆள் அனுப்பி, இவ்வாறு சொன்னார்:[b]
  to: 'பின்பு[a] சாலொமோன் ஈராமுக்கு[b] இவ்வாறு சொல்லி அனுப்பினார்:'
  rationale: The revision removes the unsupported specification ‘ஆள்’ and uses a single Tamil construction in which ‘இவ்வாறு சொல்லி’ introduces the content of Solomon’s sending, as לֵאמֹר does in Hebrew. Footnote anchors and wording have been aligned with the relevant textual features.
