lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: பின்பு ... ஆள் அனுப்பி
  rationale: שׁלח என்பதன் wayyiqtol வடிவம் கதையின் அடுத்தடுத்த செயலைக் குறிக்கிறது. தமிழில் ‘பின்பு’ தொடர்ச்சியை இயல்பாக வெளிப்படுத்துகிறது; ‘ஆள் அனுப்பி’ என்பது ஒருவரிடம் செய்தி அனுப்பும் சூழலைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: שְׁלֹמֹה
  choice: சாலொமோன்
  rationale: எபிரெயப் பெயருக்கான தமிழில் பரவலாக அறியப்பட்ட நிலையான வடிவம்.
- source_word: אֶל
  choice: ஈராமிடம்
  rationale: பெறுநரை நோக்கிய திசையைத் தமிழின் ‘-ிடம்’ வேற்றுமை உருபு இயல்பாகக் குறிக்கிறது.
- source_word: חִירָם
  choice: ஈராம்
  rationale: இவ்வசனத்திலுள்ள חִירָם என்ற எபிரெய வடிவை அணுகிய தமிழாக்கம்; வேறு இடங்களில் காணப்படும் חוּרָם வடிவத்திலிருந்து வேறுபடுத்தப்படுகிறது.
- source_word: לֵאמֹר
  choice: இவ்வாறு சொன்னார்
  rationale: செய்தியை அறிமுகப்படுத்தும் எபிரெய infinitive construct-ஐ இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது; அடுத்து வரும் நேரடிக் கூற்றோடு இணைக்கிறது.
