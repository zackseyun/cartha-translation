translation_notes:
  register: நவீன நிலையான தமிழ்; எளிமையான, கண்ணியமான கதைநடை. ‘அனுப்பினார், சொல்லி’ என்ற சொற்சொற் அமைப்பைத் தவிர்த்து, தமிழில் இயல்பான ‘ஆள் அனுப்பி, இவ்வாறு சொன்னார்’ என அமைக்கப்பட்டது. அடிக்குறிப்பு குறிகள் தொடர்புடைய சொற்றொடர்களுக்குப் பின் வைக்கப்பட்டுள்ளன.
