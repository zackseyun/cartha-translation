base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/022.yaml
  text: Then Hiram sent to Solomon[a], saying, “I have heard what you sent to me[b]. I will do all your desire concerning cedar timber and cypress timber.”
translation:
  language: ta
  text: அப்போது ஈராம் சாலொமோனுக்குச் செய்தி அனுப்பி, “நீர் எனக்கு அனுப்பிய செய்தியை நான் கேட்டேன்.[a] கேதுரு மரங்களையும் சைப்ரஸ் மரங்களையும் குறித்து உமது எல்லா விருப்பங்களையும் நான் நிறைவேற்றுவேன்” என்று சொன்னான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லர்த்தமாக, “நீர் எனக்கு அனுப்பியதை நான் கேட்டேன்.” இது சாலொமோனின் செய்தியையோ அதில் விடுக்கப்பட்ட வேண்டுகோளையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: அப்போது ... செய்தி அனுப்பி
  rationale: வாவ் தொடர்வினை கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது. தமிழில் இயல்பான நிகழ்வுத் தொடரை ‘அப்போது’ காட்டுகிறது; இச்சூழலில் அனுப்பப்பட்டது செய்தி என்பதையும் வெளிப்படுத்துகிறது.
- source_word: חִירָם
  choice: ஈராம்
  rationale: எபிரேயப் பெயரின் ஒலியைத் தமிழில் இயல்பாக எழுத்துப்பெயர்த்துள்ளது.
- source_word: לֵאמֹר
  choice: என்று சொன்னான்
  rationale: நேர்கூற்றை அறிமுகப்படுத்தும் எபிரேயச் சொல்லுக்கான இயல்பான தமிழ் வடிவம்.
- source_word: שָׁמַעְתִּי
  choice: நான் கேட்டேன்
  rationale: எபிரேய நிறைவுவினையின் எளிய பொருளைத் தக்கவைக்கிறது; வந்த செய்தியை ஏற்றுக்கொண்டதையும் சூழல் உணர்த்துகிறது.
- source_word: אֵת אֲשֶׁר שָׁלַחְתָּ אֵלַי
  choice: நீர் எனக்கு அனுப்பிய செய்தியை
  rationale: எபிரேயத்தில் சொல்லர்த்தமாக ‘நீர் எனக்கு அனுப்பியதை’ என்று உள்ளது. சூழலில் அது சாலொமோன் அனுப்பிய செய்தியைக் குறிப்பதால், தமிழில் தெளிவிற்காக ‘செய்தி’ சேர்க்கப்பட்டுள்ளது; சொல்லர்த்த வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: אֶעֱשֶׂה
  choice: நான் நிறைவேற்றுவேன்
  rationale: இங்கு ‘செய்வேன்’ என்பது ஈராம் சாலொமோனின் விருப்பத்தைச் செயல்படுத்துவதாகும். ‘நிறைவேற்றுவேன்’ என்பது தமிழில் இயல்பாக அந்த உறுதியைத் தெரிவிக்கிறது; வழங்குதல் என்ற குறுகிய பொருளுக்குள் அடைக்கவில்லை.
- source_word: כָּל חֶפְצְךָ
  choice: உமது விருப்பம் அனைத்தையும்
  rationale: חֵפֶץ என்பது விருப்பம் அல்லது விரும்பியதை குறிக்கிறது. மரியாதையான நேர்கூற்றுக்கு ‘உமது’ பொருத்தமானது.
- source_word: בַּעֲצֵי אֲרָזִים
  choice: கேதுரு மரக்கட்டைகளைக் குறித்து
  rationale: בְּ இங்கு ஈராம் நிறைவேற்றும் விருப்பத்தின் துறையைச் சுட்டுகிறது. கட்டுமானச் சூழலில் ‘மரக்கட்டைகள்’ என்பது ‘மரங்கள்’ என்பதைவிடத் தெளிவு.
- source_word: וּבַעֲצֵי בְרוֹשִׁים
  choice: சைப்ரஸ் மரக்கட்டைகளையும்
  rationale: בְּרוֹשִׁים என்ற மரவகையின் துல்லியமான அடையாளம் உறுதியில்லை. ‘சைப்ரஸ்’ பொதுவாகப் பயன்படுத்தப்படும் சாத்தியமான மொழிபெயர்ப்பு; நிச்சயமின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
