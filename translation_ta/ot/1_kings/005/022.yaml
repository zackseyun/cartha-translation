translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளக்கூடிய மரியாதையும் கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. அரசர்களுக்கிடையேயான உரையாடல் என்பதால் ‘நீர்/உமது’ வடிவங்கள் தேர்ந்தெடுக்கப்பட்டுள்ளன. எபிரேயத்தின் சொற்பொருளைத் தமிழின் இயல்புடன் இணைக்கும் உகந்த-சமநிலை அணுகுமுறை பின்பற்றப்பட்டுள்ளது.
