translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ். புவியியல் பரப்பு ‘ஆற்றிலிருந்து ... நாடுவரையிலும், ... எல்லைவரையிலும்’ எனத் தெளிவாக்கப்பட்டுள்ளது. ‘திறை’ என்ற அரசியல் சொல் பொதுவாசகருக்குப் புரியும் வகையில் அடிக்குறிப்புடன் தரப்பட்டுள்ளது.
