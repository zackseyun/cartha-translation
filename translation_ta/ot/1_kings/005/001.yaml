source:
  edition: WLC
  text: וּ/שְׁלֹמֹ֗ה הָיָ֤ה מוֹשֵׁל֙ בְּ/כָל הַ/מַּמְלָכ֔וֹת מִן הַ/נָּהָר֙ אֶ֣רֶץ פְּלִשְׁתִּ֔ים וְ/עַ֖ד גְּב֣וּל מִצְרָ֑יִם מַגִּשִׁ֥ים מִנְחָ֛ה וְ/עֹבְדִ֥ים אֶת שְׁלֹמֹ֖ה כָּל יְמֵ֥י חַיָּֽי/ו־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/001.yaml
  text: And Solomon was ruling over all the kingdoms from the River to the land of the Philistines and as far as the border of Egypt[b][a]. They were bringing tribute and serving Solomon all the days of his life.
translation:
  language: ta
  text: சாலொமோன் ஆற்றிலிருந்து[a] பெலிஸ்தியரின் நாடுவரை, எகிப்தின் எல்லைவரை இருந்த எல்லா அரசுகளின்மேலும் ஆட்சி செலுத்திவந்தார். அந்த அரசுகள் சாலொமோனுக்குத் திறை[b] செலுத்தி, அவருடைய வாழ்நாளெல்லாம் அவருக்குச் சேவை செய்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, யூபிராத்து ஆறு.
    reason: cross_reference
  - marker: b
    text: அல்லது, ‘பரிசுகள்.’ எபிரெயச் சொல் பரிசு, காணிக்கை அல்லது திறை எனப் பொருள்படலாம்; இங்குள்ள அரசியல் சூழலில் ‘திறை’ என்பதே பொருத்தமானது.
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹשֵׁל
  choice: ஆண்டுவந்தார்
  rationale: היה + participle கடந்தகாலத்தில் தொடர்ந்த ஆட்சிநிலையைச் சுட்டுகிறது; ‘ஆண்டுவந்தார்’ அந்த நீடித்த தன்மையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְּכָל הַמַּמְלָכוֹת
  choice: எல்லா அரசுகளையும்
  rationale: משל உடன் வரும் בְ ஆளுகையைச் சுட்டுகிறது; பன்மை வடிவம் சாலொமோனின் மேலாதிக்கத்திற்குட்பட்ட பல அரசுகளைக் குறிக்கிறது.
- source_word: מִן הַנָּהָר
  choice: ஆற்றிலிருந்து
  rationale: எபிரெயத்தில் ‘ஆறு’ குறிப்பிட்ட பெயரின்றி மரபுவழிப் புவியியல் குறிப்பாக வருகிறது; அதன் அடையாளம் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: אֶרֶץ פְּלִשְׁתִּים
  choice: பெலிஸ்தியரின் நாடுவரையிலும்
  rationale: ‘பெலிஸ்தியரின் நாடு’ என்ற எபிரெயக் கட்டமைப்பைத் தெளிவாகப் பிரதிபலித்து, מן ... ועד என்ற பரப்பெல்லையை இயல்பான தமிழில் காட்டுகிறது.
- source_word: וְעַד גְּבוּל מִצְרָיִם
  choice: எகிப்தின் எல்லைவரையிலும்
  rationale: ஆட்சிப் பரப்பின் இறுதி எல்லையை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: מַגִּשִׁים מִנְחָה
  choice: திறை செலுத்தி
  rationale: מִנְחָה என்பது பரிசு, காணிக்கை, திறை ஆகியவற்றைக் குறிக்கலாம்; கீழ்ப்பட்ட அரசுகளின் அரசியல் சூழலில் ‘திறை’ பொருத்தமானது.
- source_word: וְעֹבְדִים אֶת שְׁלֹמֹה
  choice: அவருக்குப் பணிபுரிந்தார்கள்
  rationale: ஒரு மேலதிகாரிக்குச் செய்யும் சேவையை עבד குறிக்கிறது; கட்டாய உழைப்பென்று மிகைப்படுத்தாமல் கீழ்ப்படிந்த சேவையின் பொருளைத் தருகிறது.
- source_word: כָּל יְמֵי חַיָּיו
  choice: அவருடைய வாழ்நாளெல்லாம்
  rationale: எபிரெய மரபுத்தொடரின் முழுக் கால அளவைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
