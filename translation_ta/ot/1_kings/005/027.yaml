  text: King Solomon conscripted forced labor from all Israel[b][a], and the forced labor was thirty thousand men.
translation:
  language: ta
  text: சாலொமோன் அரசன் இஸ்ரவேல் முழுவதிலுமிருந்து கட்டாய உழைப்புக்காக ஆட்களைத் திரட்டினான்[a]; கட்டாய உழைப்புக்காகத் திரட்டப்பட்டோர் முப்பதாயிரம் ஆண்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்ரவேல் முழுவதிலிருந்தும் ஒரு உழைப்பாளர் அணியைத் திரட்டினான்.” இங்குள்ள எபிரெயச் சொல் பணவரியைக் காட்டிலும் கட்டாய உழைப்புச் சேவையையே குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: ஆட்களைத் திரட்டினான்
  rationale: העלה என்பதன் ஹிஃபில் வடிவம் מַס உடன் நிர்வாகச் சூழலில் கட்டாயப் பணிக்கான ஆட்களை விதித்து அணிதிரட்டுவதைக் குறிக்கிறது. நவீன தமிழில் இந்தச் செயலை இயல்பாகத் தெரிவிக்க ‘ஆட்களைத் திரட்டினான்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: מַס
  choice: கட்டாய வேலை
  rationale: சாலொமோனின் கட்டுமானச் சூழலில் இச்சொல் பணவரி அல்ல, கட்டாய உழைப்புச் சேவையைக் குறிக்கிறது. ‘கட்டாய வேலை’ தொழில்நுட்பச் சொல்லின்றி பொருளைத் தெளிவாகத் தருகிறது.
- source_word: מִכָּל יִשְׂרָאֵל
  choice: இஸ்ரவேல் முழுவதிலுமிருந்து
  rationale: வேலையாட்கள் இஸ்ரவேல் மக்கள் அனைவரிடையிலிருந்தும் திரட்டப்பட்டனர் என்ற மூலத்தையும் அதன் முழுமையையும் இயல்பான தமிழில் காக்கிறது.
- source_word: וַיְהִי הַמַּס
  choice: அந்தக் கட்டாய வேலைக்குத் திரட்டப்பட்டவர்கள்
  rationale: எபிரெயச் சொற்றொடர் கட்டாய வேலைக் குழுவின் எண்ணிக்கையை அறிமுகப்படுத்துகிறது. தமிழில் மனிதர்களின் எண்ணிக்கையைத் தெளிவாகவும் இயல்பாகவும் கூற இவ்வாறு வடிவமைக்கப்பட்டது.
- source_word: שְׁלֹשִׁים אֶלֶף אִישׁ
  choice: முப்பதாயிரம் ஆண்கள்
  rationale: אִישׁ இங்கு எண்ணப்படும் வயது வந்த ஆண் வேலையாட்களைக் குறிக்கிறது; ஆகவே பொதுவான ‘பேர்’ என்பதற்குப் பதிலாக மூலத்தின் பாலினச் சிறப்பை ‘ஆண்கள்’ காக்கிறது.
