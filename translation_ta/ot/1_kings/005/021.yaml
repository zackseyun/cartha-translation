- from: சாலொமோனின் வார்த்தைகளை ஈராம் கேட்டபோது, அவன் மிகவும் மகிழ்ந்து, “தாவீதுக்கு இந்தப் பெரிய மக்கள்மீது ஆள ஒரு ஞானமுள்ள மகனைக் கொடுத்த ஆண்டவர் இன்று போற்றப்படுவாராக!” என்றான்.
  to: சாலொமோனின் வார்த்தைகளை ஈராம் கேட்டபோது, அவன் மிகவும் மகிழ்ந்து, “இந்தப் பெரும் மக்களை ஆள்வதற்கு தாவீதுக்கு ஞானமுள்ள ஒரு மகனைக் கொடுத்த ஆண்டவர் இன்று போற்றப்படுவாராக!” என்றான்.
