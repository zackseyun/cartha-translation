id: 1KI.5.21
reference: 1 Kings 5:21
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יְהִ֞י כִּ/שְׁמֹ֧עַ חִירָ֛ם אֶת דִּבְרֵ֥י שְׁלֹמֹ֖ה וַ/יִּשְׂמַ֣ח מְאֹ֑ד וַ/יֹּ֗אמֶר בָּר֤וּךְ יְהוָה֙ הַ/יּ֔וֹם אֲשֶׁ֨ר נָתַ֤ן לְ/דָוִד֙ בֵּ֣ן חָכָ֔ם עַל הָ/עָ֥ם הָ/רָ֖ב הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/021.yaml
  text: And when Hiram heard the words of Solomon, he rejoiced greatly and said, “Blessed be the LORD today, who has given David a wise son over this great people.”
translation:
  language: ta
  text: சாலொமோனின் வார்த்தைகளை ஈராம் கேட்டபோது, அவன் மிகவும் மகிழ்ந்து, “இந்தப் பெரும் மக்களை ஆள்வதற்கு தாவீதுக்கு ஞானமுள்ள ஒரு மகனைக் கொடுத்த ஆண்டவர் இன்று போற்றப்படுவாராக!” என்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דִּבְרֵי שְׁלֹמֹה
  choice: சாலொமோனின் வார்த்தைகளை
  rationale: எபிரேய இணைப்புத் தொடரின் நேரடியான பொருளைப் பாதுகாக்கும் இயல்பான தமிழ்.
- source_word: וַיִּשְׂמַח מְאֹד
  choice: மிகவும் மகிழ்ந்து
  rationale: மகிழ்ச்சியின் தீவிரத்தை מְאֹד தெளிவாகக் குறிக்கிறது.
- source_word: בָּרוּךְ יְהוָה הַיּוֹם
  choice: ஆண்டவர் இன்று போற்றப்படுவாராக
  rationale: בָּרוּךְ என்பதன் புகழ்ந்து வாழ்த்தும் பொருளையும் הַיּוֹם என்பதையும் காக்கிறது; יהוה என்பதற்கு மரியாதைமிக்க வழக்கமான தமிழ் வடிவம் பயன்படுத்தப்பட்டது.
- source_word: בֵּן חָכָם
  choice: ஒரு ஞானமுள்ள மகன்
  rationale: חָכָם என்பதன் ஆட்சி நடத்தும் விவேகம் உட்பட விரிந்த ‘ஞானம்’ என்ற பொருளைக் காக்கிறது.
- source_word: עַל הָעָם הָרָב הַזֶּה
  choice: இந்தப் பெரிய மக்கள்மீது ஆள
  rationale: עַל இங்கு மக்கள்மீது அரசனாக நியமிக்கப்பட்ட நிலையைக் குறிக்கிறது; இயல்பான தமிழுக்காக ‘ஆள’ வெளிப்படுத்தப்பட்டது.
theological_decisions:
- issue: தெய்வீகப் பெயர் יהוה-ஐத் தமிழில் வழங்குதல்
  choice: ஆண்டவர்
  alternative: யாவே
  rationale: தமிழ் வேதாகம நடையில் பரவலாகப் புரியப்படும் மரியாதைமிக்க பதிலீட்டைத் தேர்ந்தெடுக்கிறது; வசனம் ஈராமின் ஒப்புதலைக் கூறுவது தவிர அவரது முழுமையான சமயநிலையைத் தீர்மானிக்கவில்லை.
- issue: בָּרוּךְ என்ற ஆசீர்வாத/புகழ்ச்சி மொழி
  choice: போற்றப்படுவாராக
  alternative: ஆசீர்வதிக்கப்பட்டவர்
  rationale: மனிதர் கடவுளை ‘ஆசீர்வதிப்பது’ என்ற எபிரேய வழக்கின் செயல்பாட்டு பொருள் புகழ்ந்து போற்றுதலாகும்; தமிழில் தவறான தெய்வவியல் எண்ணத்தைத் தவிர்த்து அதைப் பிரதிபலிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான உரைநடை. எபிரேய வசனத்தின் தொடர்ச்சியான நிகழ்வோட்டமும் ஈராமின் நேரடி உரையின் வலிமையும் காக்கப்பட்டுள்ளன.
