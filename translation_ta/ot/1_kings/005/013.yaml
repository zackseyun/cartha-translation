  text: וַ/יְדַבֵּר֮ עַל הָֽ/עֵצִים֒ מִן הָ/אֶ֨רֶז֙ אֲשֶׁ֣ר בַּ/לְּבָנ֔וֹן וְ/עַד֙ הָ/אֵז֔וֹב אֲשֶׁ֥ר יֹצֵ֖א בַּ/קִּ֑יר וַ/יְדַבֵּר֙ עַל הַ/בְּהֵמָ֣ה וְ/עַל הָ/ע֔וֹף וְ/עַל הָ/רֶ֖מֶשׂ וְ/עַל הַ/דָּגִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/013.yaml
  text: He spoke about the trees[a], from the cedar that is in Lebanon to the hyssop that grows out of the wall; he also spoke about the animals and the birds and the creeping things and the fish.
translation:
  language: ta
  text: 'அவர் தாவரங்களைப் பற்றிப் பேசினார்: லெபனோனில் உள்ள கேதுருமரம் முதல் சுவரிலிருந்து வளரும் ஈசோப்புச் செடி[a] வரை. விலங்குகள், பறவைகள், ஊர்ந்து செல்லும் உயிரினங்கள், மீன்கள் ஆகியவற்றைப் பற்றியும் அவர் பேசினார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சிறிய நறுமணச் செடி’ என இருக்கலாம். எபிரெயச் சொல்லான אֵזוֹב எந்தத் தாவரத்தைக் குறிக்கிறது என்பது உறுதியாகத் தெரியவில்லை; ‘ஈசோப்பு’ என்பது மரபுவழி மொழிபெயர்ப்பு.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר עַל
  choice: பற்றிப் பேசினார்
  rationale: דבר உடன் עַל வரும்போது ஒரு பொருளைக் குறித்துப் பேசுதல் என்பதே இயல்பான பொருள்; தொழில்நுட்ப விளக்கவுரையாக மிகைப்படுத்தாமல் தலைப்புசார் அர்த்தத்தைப் பாதுகாக்கிறது.
- source_word: הָעֵצִים
  choice: மரங்கள்
  rationale: இங்கு עֵץ பன்மை, கேதுருமரம் முதல் ஈசோப்புச் செடி வரையிலான தாவர வகைகளைச் சுட்டுகிறது; தமிழில் ‘மரங்கள்’ மூலத்தின் பொதுவான சொல்லுக்கு மிக நெருக்கமானது.
- source_word: הָאֶרֶז אֲשֶׁר בַּלְּבָנוֹן
  choice: லெபனோனில் உள்ள கேதுருமரம்
  rationale: אֶרֶז என்பது லெபனோனுடன் சிறப்பாகத் தொடர்புடைய கேதுரு; இடத்தைக் குறிக்கும் בְּ என்பதற்கு ‘லெபனோனில்’ இயல்பான மொழிபெயர்ப்பு.
- source_word: מִן ... וְעַד
  choice: முதல் ... வரை
  rationale: எபிரெய இணை அமைப்பின் எல்லைச்சுட்டும் பொருளை இயல்பான தமிழில் தருகிறது; பெரியதிலிருந்து சிறியதுவரையிலான முழு வரம்பையும் உணர்த்துகிறது.
- source_word: הָאֵזוֹב
  choice: ஈசோப்புச் செடி
  rationale: துல்லியமான தாவரவியல் அடையாளம் உறுதியல்ல; மரபாக அறியப்படும் ‘ஈசோப்பு’ என்பதைக் பிரதான உரையில் வைத்து, ஐயத்தை அடிக்குறிப்பில் பாதுகாக்கிறது.
- source_word: יֹצֵא בַּקִּיר
  choice: சுவரிலிருந்து முளைத்து வளரும்
  rationale: יצא என்பதன் நேரடி ‘வெளியே வரும்’ படிமத்தைத் தாவரச் சூழலில் தெளிவான தமிழாக வெளிப்படுத்துகிறது.
- source_word: הַבְּהֵמָה
  choice: விலங்குகள்
  rationale: பறவைகள், ஊர்வன, மீன்கள் ஆகிய வகைகளுடன் வரும் பட்டியலில் இது கால்நடைகள் மட்டும் அல்லாமல் நிலவாழ் விலங்குகளைப் பொதுவாகக் குறிக்கிறது.
- source_word: הָעוֹף
  choice: பறவைகள்
  rationale: עוֹף பறக்கும் உயிரினங்களை விரிவாகக் குறிக்கக்கூடியதாயினும், இவ்வகைப்பாட்டுப் பட்டியலில் ‘பறவைகள்’ இயல்பான பொருள்.
- source_word: הָרֶמֶשׂ
  choice: ஊர்ந்து செல்லும் உயிரினங்கள்
  rationale: רֶמֶשׂ நவீன வகைப்பாட்டிலுள்ள ஊர்வனவற்றை மட்டும் குறிக்காமல், ஊரும் அல்லது தவழும் உயிரினங்களை விரிவாகக் குறிக்கிறது.
- source_word: הַדָּגִים
  choice: மீன்கள்
  rationale: דָּגִים என்பதன் இயல்பான பொதுவகைப் பன்மை.
