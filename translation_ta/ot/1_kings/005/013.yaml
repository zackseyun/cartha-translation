translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. ‘பற்றிப் பேசினார்’ என்ற மீள்வாக்கியம் எபிரெய மூலத்தின் கட்டமைப்பையும் வலியுறுத்தலையும் பாதுகாக்கிறது. தாவரவியல் ஐயம் பிரதான உரையில் தீர்க்கப்படாமல் அடிக்குறிப்பில் வெளிப்படையாகக் குறிப்பிடப்பட்டுள்ளது.
