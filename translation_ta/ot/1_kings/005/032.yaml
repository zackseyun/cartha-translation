base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/032.yaml
  text: So Solomon’s builders[a], Hiram’s builders[b], and the men of Gebal cut and prepared the timber and the stones to build the house.
translation:
  language: ta
  text: சாலொமோனின் கட்டுமானத் தொழிலாளர்களும், ஈராமின் கட்டுமானத் தொழிலாளர்களும், கேபாலைச் சேர்ந்தவர்களும்[a] மரப்பொருட்களையும் கற்களையும் வெட்டி, அவற்றை அந்த இல்லத்தைக்[b] கட்டுவதற்காக ஆயத்தப்படுத்தினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, கேபால் (பிப்லோஸ்) நகரத்தைச் சேர்ந்தவர்கள். இவர்களை “கேபாலியர்” அல்லது “கிப்லியர்” என்றும் குறிப்பிடலாம்.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, கர்த்தரின் இல்லமாகிய ஆலயம்.
    reason: contextual_clarification
lexical_decisions:
- source_word: וַיִּפְסְלוּ
  choice: வெட்டி
  rationale: פסל என்பது கட்டுமானப் பொருட்களை வெட்டுதல் அல்லது உரிய வடிவில் செதுக்குதல் என்று பொருள்படும். இங்கு மரங்களும் கற்களும் சேர்ந்து வருவதால், இரண்டுக்கும் இயல்பாகப் பொருந்தும் பொதுவான சொல்லாக “வெட்டி” பயன்படுத்தப்பட்டுள்ளது.
- source_word: בֹּנֵי שְׁלֹמֹה
  choice: சாலொமோனின் கட்டுமானப் பணியாளர்கள்
  rationale: בֹּנֵי என்ற வடிவம் இச்சூழலில் கட்டுகிறவர்கள் அல்லது கட்டுமானப் பணியாளர்கள் என்பதைக் குறிக்கிறது. நவீனத் தமிழில் தெளிவாக இருக்க “கட்டுமானப் பணியாளர்கள்” என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וּבֹנֵי חִירוֹם
  choice: ஈராமின் கட்டுமானப் பணியாளர்கள்
  rationale: முந்தைய தொடருக்கு இணையான எபிரெய அமைப்பைத் தமிழிலும் ஒரே சொல்லாட்சியால் காக்கிறது.
- source_word: וְהַגִּבְלִים
  choice: கேபாலைச் சேர்ந்தவர்கள்
  rationale: இது கேபால் நகரத்தைச் சேர்ந்த மக்களைக் குறிக்கும் இன/இடப்பெயரடை. தமிழில் புரியாத தனிப்பெயராக விடாமல், ஊருடன் அவர்களுக்குள்ள தொடர்பைத் தெளிவாகக் கூறுகிறது.
- source_word: וַיָּכִינוּ
  choice: ஆயத்தப்படுத்தினார்கள்
  rationale: Hiphil வடிவிலுள்ள כון இங்கு கட்டுமானத்திற்காகப் பொருட்களைத் தயாராக வைத்தல் அல்லது ஆயத்தப்படுத்துதல் என்று பொருள்படும்.
- source_word: הָעֵצִים
  choice: மரங்கள்
  rationale: எபிரெயச் சொல் மரம்/மரப்பொருள் என்பதைக் குறிக்கிறது. கட்டுமானச் சூழல் இதை மரப்பொருட்கள் எனப் புரியச் செய்கிறது; மூலத்தில் இல்லாத அளவுக்கு “மரக்கட்டைகள்” என்று குறிப்பாக்காமல் “மரங்கள்” என வைக்கப்பட்டுள்ளது.
- source_word: וְהָאֲבָנִים
  choice: கற்கள்
  rationale: மூலத்தின் பொதுவான “கற்கள்” என்ற பொருளைத் தக்கவைத்து, அவை கற்பாளங்களா அல்லது வேறு வடிவில் செதுக்கப்பட்ட கற்களா என்பதை மேலதிகமாக நிர்ணயிக்கவில்லை.
- source_word: לִבְנוֹת הַבָּיִת
  choice: அந்த இல்லத்தைக் கட்டுவதற்காக
  rationale: הַבָּיִת என்பதன் நேரடிப் பொருள் “அந்த வீடு/இல்லம்.” சூழலில் அது கர்த்தரின் ஆலயத்தைக் குறித்தாலும், மூலத்தின் இல்லம் என்ற உருவகத்தை முதன்மை உரையில் தக்கவைத்து விளக்கத்தை அடிக்குறிப்பில் கொடுக்கிறது.
theological_decisions:
- issue: הַבָּיִת என்பதைக் ‘ஆலயம்’ என்று நேரடியாக மொழிபெயர்ப்பதா, ‘இல்லம்’ என்று வைப்பதா
  choice: அந்த இல்லம்
  alternative: ஆலயம் / கர்த்தரின் ஆலயம்
  rationale: இச்சூழலில் குறிக்கப்படுவது கர்த்தரின் ஆலயமே. எனினும் எபிரெய மூலத்தில் בַּיִת என்ற “இல்லம்” சொல்லே இருப்பதால், அதன் ஆலயப் பயன்பாட்டை அழிக்காமல் முதன்மை உரையில் தக்கவைத்து, வாசகருக்கான தெளிவை அடிக்குறிப்பில் வழங்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் அமைக்கப்பட்டுள்ளது. எபிரெய வாக்கியத்தில் ‘வெட்டினார்கள்’ என்பதற்கான பொருட்கள் பின்னரே வருவதால் ஏற்படும் தமிழ்ச் சிக்கலைத் தவிர்க்க, மரங்களும் கற்களும் என்ற சொற்கள் இயல்பான இடத்துக்கு முன்வைக்கப்பட்டுள்ளன. கேபால் என்ற பண்டைய இடப்பெயர் ஒலிபெயர்க்கப்பட்டு, அதன் அடையாளம் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
