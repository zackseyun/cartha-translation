- source_word: לֶחֶם שְׁלֹמֹה
  choice: சாலொமோனின் ... உணவுத் தேவை
  rationale: לֶחֶם என்பதன் நேரடிப் பொருள் ‘அப்பம்’; ஆனால் மாவின் தினசரி அளவுகள் பட்டியலிடப்படும் இந்நிர்வாகச் சூழலில் அது அரச குடும்பத்திற்கான உணவு ஏற்பாட்டை விரிவாகக் குறிக்கிறது.
- source_word: לְיוֹם אֶחָד
  choice: ஒரு நாளுக்கான
  rationale: ஒவ்வொரு நாளுக்கும் தேவைப்பட்ட அளவு என்ற காலப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: שְׁלֹשִׁים כֹּר / שִׁשִּׁים כֹּר
  choice: முப்பது கோர் / அறுபது கோர்
  rationale: பண்டைய எபிரெய உலர் அளவையான כֹּר என்பதை உறுதியற்ற நவீன அளவாக மாற்றாமல் ஒலிபெயர்த்துப் பாதுகாக்கிறது.
- source_word: סֹלֶת
  choice: நைசான மாவு
