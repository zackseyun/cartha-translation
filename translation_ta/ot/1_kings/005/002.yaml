- source_word: קָמַח
  choice: மாவு
  rationale: பொதுவாக மாவைக் குறிக்கும் எபிரெயச் சொல்லை நேரடியாகத் தருகிறது; இதற்கு மூலத்தில் இல்லாத ‘சாதாரண’ என்ற பண்பைச் சேர்க்காமல், סֹלֶת உடனான வேறுபாட்டையும் சொல் தேர்வால் பாதுகாக்கிறது.
