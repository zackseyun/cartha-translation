  text: וַ/יְהִ֧י לִ/שְׁלֹמֹ֛ה שִׁבְעִ֥ים אֶ֖לֶף נֹשֵׂ֣א סַבָּ֑ל וּ/שְׁמֹנִ֥ים אֶ֖לֶף חֹצֵ֥ב בָּ/הָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/029.yaml
  text: And Solomon had seventy thousand burden-bearers[a], and eighty thousand stonecutters in the mountains.
translation:
  language: ta
  text: சாலொமோனுக்குச் சுமை சுமப்பவர்கள் எழுபதாயிரம் பேரும், மலைப்பகுதியில் கல் வெட்டுகிறவர்கள்[a] எண்பதாயிரம் பேரும் இருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் நேரடியாக, “மலையில் வெட்டுகிறவர்கள்.” கட்டுமானச் சூழலில் இது மலைப்பகுதியிலுள்ள கல் வெட்டும் தொழிலாளர்களைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לִשְׁלֹמֹה
  choice: சாலொமோனுக்கு ... இருந்தார்கள்
  rationale: היה + ל என்ற எபிரெய உடைமை/இருப்பு அமைப்பைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; பணியாளர்கள் மனிதர்கள் என்பதால் மரியாதைப் பன்மை வினை பயன்படுத்தப்பட்டுள்ளது.
- source_word: שִׁבְעִים אֶלֶף
  choice: எழுபதாயிரம் பேர்
  rationale: எண்ணிக்கையை நேரடியாகவும், மனிதர்களைக் குறிக்க ‘பேர்’ என்பதுடன் இயல்பாகவும் மொழிபெயர்க்கிறது.
- source_word: נֹשֵׂא סַבָּל
  choice: சுமை சுமப்பவர்கள்
  rationale: ‘சுமையைத் தூக்கிச் செல்பவர்கள்’ என்ற தொழில் சார்ந்த பொருளை நவீனத் தமிழில் தெளிவாகக் கூறுகிறது.
- source_word: וּשְׁמֹנִים אֶלֶף
  choice: எண்பதாயிரம் பேர்
  rationale: எண்ணிக்கையை நேரடியாக மொழிபெயர்க்கிறது.
- source_word: חֹצֵב
  choice: கல் வெட்டுகிறவர்கள்
  rationale: חצב என்பதன் ‘வெட்டி எடுப்பது/செதுக்கி எடுப்பது’ என்ற பொருளையும் கட்டுமானச் சூழலில் மறைந்திருக்கும் ‘கல்’ என்ற செயப்படுபொருளையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: בָּהָר
  choice: மலைப்பகுதியில்
  rationale: எபிரெய ஒருமைச் சொல் நிலப்பரப்பைத் தொகுப்பாகக் குறிக்கக்கூடும்; கற்கள் வெட்டப்பட்ட மலைநிலத்தைத் தமிழில் இயல்பாகக் குறிக்கிறது.
