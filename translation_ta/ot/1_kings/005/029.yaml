translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. மூலத்தின் எண்ணிக்கைகளும் இரு தொழிலாளர் குழுக்களும் அப்படியே காக்கப்பட்டுள்ளன; חֹצֵב மற்றும் בָּהָר ஆகியவற்றின் சொற்பொருள் அடிக்குறிப்பில் தெரிவிக்கப்பட்டுள்ளது.
