  text: וַ/יְהִ֨י חִיר֜וֹם נֹתֵ֣ן לִ/שְׁלֹמֹ֗ה עֲצֵ֧י אֲרָזִ֛ים וַ/עֲצֵ֥י בְרוֹשִׁ֖ים כָּל חֶפְצֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/024.yaml
  text: And Hiram was giving Solomon cedar timber and cypress timber[a], according to all his desire.
translation:
  language: ta
  text: ஈராம் சாலொமோனுக்கு அவர் விரும்பிய அனைத்தையும், கேதுரு மரக்கட்டைகளையும் சைப்பிரஸ் மரக்கட்டைகளையும்[a] கொடுத்துக்கொண்டிருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் பெரோஷீம் என்ற சொல் குறிக்கும் சரியான மரவகை உறுதியாகத் தெரியவில்லை; இதை ‘ஜூனிப்பர் மரம்’ அல்லது மரபுவழியாக ‘ஃபிர் மரம்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: கொடுத்துக்கொண்டிருந்தான்
  rationale: வினைச்சொல் தொடரின் கடந்தகாலக் கதை முன்னேற்றத்தைத் தமிழில் தனியாகச் சொற்சொல்லாக மாற்றாமல், தொடர்ச்சியான செயலைக் காட்டும் வினை வடிவத்துடன் இயல்பாக இணைக்கிறது.
- source_word: חִירוֹם
  choice: ஈராம்
  rationale: எபிரெய தனிப்பெயருக்கு நெருக்கமான, தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: נֹתֵן
  choice: கொடுத்துக்கொண்டிருந்தான்
  rationale: வַיְהִי என்பதற்குப் பின் வரும் பங்கேற்பு வடிவம் கடந்தகாலத்தில் தொடர்ந்த அல்லது வழக்கமான செயலைக் குறிக்கிறது; இத்தொடர் அதை இயல்பான தமிழில் காக்கிறது.
- source_word: לִשְׁלֹמֹה
  choice: சாலொமோனுக்கு
  rationale: לְ முன்னிடைச்சொல்லின் பெறுநர் பொருளைத் தமிழ் நான்காம் வேற்றுமை உருபு தெளிவாக வெளிப்படுத்துகிறது.
- source_word: עֲצֵי אֲרָזִים
  choice: கேதுரு மரக்கட்டைகள்
  rationale: கட்டுமானப் பொருட்கள் வழங்கப்படும் சூழலில் உயிருள்ள மரங்களைவிட வெட்டிப் பயன்படுத்தப்படும் மரப்பொருளைக் குறிக்க ‘மரக்கட்டைகள்’ பொருத்தமானது.
- source_word: וַעֲצֵי בְרוֹשִׁים
  choice: தேவதாரு மரக்கட்டைகள்
  rationale: בְּרוֹשִׁים என்பது கட்டுமானத்தில் பயன்படுத்தப்பட்ட ஓர் ஊசியிலை மரவகையைச் சுட்டுகிறது. சரியான இனத்தை உறுதியாக அடையாளம் காண முடியாததால் மாற்று அடையாளங்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: כָּל חֶפְצוֹ
  choice: அவர் விரும்பியபடியெல்லாம்
  rationale: சாலொமோனின் விருப்பம் அல்லது வேண்டுகோளின் முழு அளவையும் இயல்பான, மரியாதையான நவீனத் தமிழில் வெளிப்படுத்துகிறது; ‘அவர்’ என்பது அருகிலுள்ள சாலொமோனையே சுட்டுகிறது.
