revisions:
- from: ஈராம் சாலொமோனுக்கு அவர் விரும்பியபடியெல்லாம் கேதுரு மரக்கட்டைகளையும் தேவதாரு மரக்கட்டைகளையும்[a] கொடுத்துக்கொண்டிருந்தான்.
  to: ஈராம் சாலொமோனுக்கு அவர் விரும்பிய அனைத்தையும், கேதுரு மரக்கட்டைகளையும் சைப்பிரஸ் மரக்கட்டைகளையும்[a] கொடுத்துக்கொண்டிருந்தான்.
  rationale: The revision corrects the conflation of cedar and beroshim by rendering the latter as “சைப்பிரஸ்,” while retaining a footnote that reflects the disputed species identification. It also makes Solomon, rather than Hiram, explicitly the one whose wishes are in view.
