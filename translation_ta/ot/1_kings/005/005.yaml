base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/005.yaml
  text: And Judah and Israel lived in safety[a], each man under his vine and under his fig tree, from Dan to Beer-sheba[b], all the days of Solomon.
translation:
  language: ta
  text: யூதாவும் இஸ்ரவேலும் பாதுகாப்பாக வாழ்ந்தனர்; சாலொமோனின் நாட்கள் முழுவதும், தாண் முதல் பெயர்செபா வரை, அவனவன்[a] தன் திராட்சைக் கொடியின் கீழும் தன் அத்திமரத்தின் கீழும் இருந்தான்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய உரை பகிர்ந்தளிக்கும் பொருளில் ஆண்பால் ஒருமை வடிவத்தைப் பயன்படுத்துகிறது; இதை ‘ஒவ்வொருவனும்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘தன் திராட்சைக் கொடியின் கீழும் தன் அத்திமரத்தின் கீழும்’ என்பது நாட்டில் நிலவும் அமைதி, பாதுகாப்பு, வளம் ஆகியவற்றைக் குறிக்கும் மரபுவழிப் படிமம்.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: வாழ்ந்தனர்
  rationale: அடிப்படையில் ‘அமர்ந்தான்/குடியிருந்தான்’ என்று பொருள்படும் வினை, கூட்டு மக்களைக் குறிக்கும் எழுவாயுடனும் பாதுகாப்பைக் குறிக்கும் சொல்லுடனும் வந்து, நிலையாக வாழ்ந்ததைக் குறிக்கிறது. நவீன தமிழில் ‘வாழ்ந்தனர்’ இயல்பாக உள்ளது.
- source_word: יְהוּדָה וְיִשְׂרָאֵל
  choice: யூதாவும் இஸ்ரவேலும்
  rationale: எபிரெய உரையில் பெயரிடப்பட்டுள்ள இரு அரசியல்-உடன்படிக்கைச் சமூகங்களையும் பொதுமைப்படுத்தாமல் நேரடியாகப் பாதுகாக்கிறது.
- source_word: לָבֶטַח
  choice: பாதுகாப்புடன்
  rationale: அச்சுறுத்தலின்றி பாதுகாப்பாக இருக்கும் நிலையைக் குறிக்கிறது; சூழலின் அமைதியான, நிலையான வாழ்வையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: אִישׁ
  choice: அவனவன்
  rationale: ஆண்பால் ஒருமைச் சொல் பகிர்ந்தளிக்கும் பொருளில் பயன்படுத்தப்பட்டுள்ளது. ‘அவனவன்’ அதன் ஆண்பால் வடிவத்தையும் ‘ஒவ்வொருவனும்’ என்ற பகிர்ந்தளிக்கும் பொருளையும் சுருக்கமாகத் தக்கவைக்கிறது.
- source_word: תַּחַת גַּפְנוֹ וְתַחַת תְּאֵנָתוֹ
  choice: தன் திராட்சைக் கொடியின் கீழும் தன் அத்திமரத்தின் கீழும்
  rationale: அமைதி, பாதுகாப்பு, வளம் ஆகியவற்றின் மரபுவழிப் படிமத்தை விளக்கவுரையாக மாற்றாமல் அப்படியே தக்கவைக்கிறது.
- source_word: מִדָּן וְעַד בְּאֵר שָׁבַע
