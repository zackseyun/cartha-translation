  rationale: நாட்டின் வட எல்லை முதல் தென் எல்லை வரையிலான முழுப் பரப்பைக் குறிக்கும் புவியியல் இணைச்சொற்றொடர்; இடப்பெயர்கள் ஒலிபெயர்க்கப்பட்டுள்ளன.
- source_word: כֹּל יְמֵי שְׁלֹמֹה
  choice: சாலொமோனின் நாட்களெல்லாம்
  rationale: இந்த நிலை சாலொமோனின் காலம் முழுவதும் நீடித்ததைக் குறிக்கும் மூலமொழி அமைப்பை வாசிக்கத்தக்க தமிழில் நெருக்கமாகத் தருகிறது.
theological_decisions:
- issue: பகிர்ந்தளிக்கும் ஆண்பால் ஒருமையான אִישׁ என்பதன் மொழிபெயர்ப்பு
  choice: அவனவன்
  alternative: ஒவ்வொருவரும்
  rationale: மூலத்தின் ஆண்பால் ஒருமை வடிவத்தை பாலினப் பொதுமைப்படுத்தலால் மறைக்காமல், மக்கள் ஒவ்வொருவரையும் பகிர்ந்தளிக்கும் அதன் பயன்பாட்டையும் தக்கவைக்கிறது.
- issue: ‘தன் திராட்சைக் கொடியின் கீழும் தன் அத்திமரத்தின் கீழும்’ என்ற வளமைப் படிமம்
  choice: படிமத்தை முதன்மை உரையில் சொற்படியாகத் தக்கவைத்தல்
  alternative: ‘அமைதியுடனும் வளமுடனும் வாழ்ந்தான்’ என்று பொருளை மட்டும் கூறுதல்
  rationale: இது நாட்டில் நிலவும் அமைதி, பாதுகாப்பு, வளம் ஆகியவற்றை உணர்த்தும் இலக்கிய மற்றும் உடன்படிக்கைச் சார்புடைய படிமம். அதைத் தக்கவைப்பது அதன் வேதாகம இடையிணைப்பையும் பொருள் செறிவையும் காக்கிறது; குறிப்பிட்ட இறையியல் விளக்கத்தைத் திணிப்பதில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், எளிமையானதாயினும் கண்ணியமான நடையைக் கொண்டுள்ளது. ‘அவனவன்’ என்பது இங்கு இழிவான பேச்சுவழக்காக அல்லாமல், மூலத்தின் பகிர்ந்தளிக்கும் ஆண்பால் அமைப்பை இயல்பாக வெளிப்படுத்தப் பயன்படுத்தப்பட்டுள்ளது. இடப்பெயர்களுக்கு தமிழ் வேதாகமப் பயன்பாட்டில் அறியப்பட்ட ‘தாண்’, ‘பெயெர்செபா’ வடிவங்கள் தேர்ந்தெடுக்கப்பட்டுள்ளன.
