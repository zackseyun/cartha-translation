translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டது. ‘திருப்பொழிவு’ அரசரை அபிஷேகம் செய்து நிறுவும் மூலமொழிக் கருத்தைத் தக்கவைக்கிறது. அடிக்குறிப்பு குறியீடு மாற்றுப் பொருள் தொடர்புடைய இறுதி வாக்கியத்திற்குப் பின்னர் வைக்கப்பட்டுள்ளது.
