base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/015.yaml
  text: Then Hiram king of Tyre sent his servants to Solomon[a], because he had heard that they had anointed him king in place of his father, for Hiram had always loved David.
translation:
  language: ta
  text: தீருவின் அரசன் ஈராம் தன் பணியாளர்களைச் சாலொமோனிடம் அனுப்பினான்; ஏனெனில், சாலொமோனின் தந்தைக்குப் பதிலாக அவனை அரசனாக அபிஷேகம் செய்தார்கள் என்று அவன் கேள்விப்பட்டிருந்தான்; ஈராம் தாவீதிடம் எப்போதும் அன்புகொண்டிருந்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஈராம் தாவீதுக்கு வாழ்நாளெல்லாம் நண்பனாக இருந்தான்.” எபிரெய மூலத்தில், “ஈராம் தாவீதிடம் எல்லாக் காலமும் அன்புகொண்டிருந்தான்” என்று உள்ளது; இது தொடர்ந்து நிலைத்த நல்லுறவைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: அனுப்பினான்
  rationale: எபிரெயக் கதைநடையில் வரும் சாதாரண இறந்தகாலச் செயலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: חִירָם מֶלֶךְ צֹר
  choice: தீரின் அரசனான ஈராம்
  rationale: பெயரையும் அரசப் பதவியையும் இயல்பான நவீனத் தமிழில் தருகிறது; צֹר என்பதற்குப் பரவலாக அறியப்பட்ட தமிழ் வடிவமான ‘தீர்’ பயன்படுத்தப்பட்டது.
- source_word: עֲבָדָיו
  choice: தன் பணியாளர்களை
  rationale: அரசவையின் ஊழியர்கள் அல்லது அதிகாரிகள் என்ற இரு சாத்தியங்களையும் மிகையாகக் குறுக்காமல், இச்சூழலுக்கு ஏற்ற பரந்த பொருளைத் தருகிறது.
- source_word: אֶל שְׁלֹמֹה
  choice: சாலொமோனிடம்
  rationale: சாலொமோனை நோக்கி அனுப்பப்பட்டதை மட்டும் தெரிவித்து, மூலத்தில் இல்லாத நோக்கத்தைச் சேர்க்கவில்லை.
- source_word: כִּי שָׁמַע
  choice: ஏனெனில் ... கேள்விப்பட்டிருந்தான்
  rationale: அனுப்பியதற்கான காரணத்தையும், கேள்விப்பட்ட செயல் அதற்கு முன்னதாக நிகழ்ந்ததையும் இயல்பான தமிழில் காட்டுகிறது.
- source_word: מָשְׁחוּ לְמֶלֶךְ
  choice: அரசனாகத் திருப்பொழிவு செய்தார்கள்
  rationale: அரசராக நிறுவுவதுடன் தொடர்புடைய משׁח என்பதன் சடங்கு மற்றும் அரசியல் பொருளைத் தக்கவைக்கிறது.
- source_word: תַּחַת אָבִיהוּ
  choice: தந்தைக்குப் பதிலாக
  rationale: அரச வாரிசுரிமைச் சூழலில் ஒருவரின் இடத்தை மற்றவர் ஏற்றுக்கொள்வதைத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: אֹהֵב הָיָה חִירָם לְדָוִד כָּל הַיָּמִים
  choice: ஈராம் தாவீதிடம் எப்போதும் அன்புகொண்டிருந்தான்
  rationale: தொடர்ந்து நிலைத்த சாதகமான உறவையும் அன்பான மனப்பான்மையையும் தருகிறது; அதை வெறும் அரசியல் கூட்டணியாகக் குறுக்கவில்லை.
