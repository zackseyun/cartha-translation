  choice: எல்லா மக்களினங்களிலிருந்தும்
  rationale: עַמִּים என்பதன் பன்மையையும் தனித்தனி மக்கள் குழுக்கள் என்ற பொருளையும் தெளிவாகக் காக்கிறது; ‘நாடுகள்’ என்பதும் சாத்தியமான மாற்று.
- source_word: לִשְׁמֹעַ
  choice: கேட்பதற்காக
  rationale: வருகையின் நோக்கத்தைக் குறிக்கும் எபிரெய முடிவிலியை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: חָכְמַת שְׁלֹמֹה
  choice: சாலொமோனின் ஞானம்
  rationale: எபிரெய இணைப்புத் தொடரின் பொருளை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: מֵאֵת כָּל מַלְכֵי הָאָרֶץ
  choice: பூமியின் எல்லா அரசர்களிடமிருந்தும்
  rationale: மூலம் அல்லது தோற்றத்தைக் குறிக்கும் מֵאֵת என்பதைக் காக்கிறது; அரசர்களால் அனுப்பப்பட்டவர்கள் என்று உரையிலேயே தீர்மானித்து விடாமல் எபிரெயத்தின் சுருக்கத்தையும் தெளிவின்மையையும் பாதுகாக்கிறது.
- source_word: אֲשֶׁר שָׁמְעוּ אֶת חָכְמָתוֹ
  choice: அவனுடைய ஞானத்தைக் குறித்துக் கேள்விப்பட்டிருந்த
  rationale: நேரடியாக ஞானத்தின் ஒலியைக் கேட்டதாக அல்லாமல், அதன் புகழைப் பற்றிக் கேள்விப்பட்டதாக உள்ள சூழல் பொருளை இயல்பான தமிழில் தருகிறது.
