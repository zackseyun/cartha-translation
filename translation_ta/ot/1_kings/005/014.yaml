translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் வேதாகமக் கதைநடையின் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘மக்களினங்கள்’ என்பது எபிரெயப் பன்மையைப் பாதுகாக்கிறது. இரண்டாம் உட்பிரிவின் சுருக்கமான எபிரெய அமைப்பு முதன்மை உரையில் இயன்றவரை தக்கவைக்கப்பட்டு, சாத்தியமான பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
