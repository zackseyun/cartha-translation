base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/014.yaml
  text: And people from all the peoples came to hear the wisdom of Solomon[b][a], from all the kings of the earth who had heard of his wisdom.
translation:
  language: ta
  text: சாலொமோனின் ஞானத்தைக் கேட்பதற்காக எல்லா மக்களினங்களிலிருந்தும்[a] மக்கள் வந்தார்கள்; அவருடைய ஞானத்தைக் குறித்துக் கேள்விப்பட்டிருந்த பூமியின் எல்லா அரசர்களிடமிருந்தும் வந்தார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எல்லா நாடுகளிலிருந்தும்.” எபிரெயச் சொல் பன்மையில் உள்ளது; அது மக்களினங்களையோ நாடுகளையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “பூமியின் எல்லா அரசர்களிடமிருந்தும்.” சாலொமோனின் ஞானத்தைக் குறித்துக் கேள்விப்பட்டிருந்த பல்வேறு அரசர்களிடமிருந்து இவர்கள் வந்தார்கள் அல்லது அவர்களால் அனுப்பப்பட்டார்கள் என்பது இதன் பொருளாக இருக்கலாம்.
    reason: cultural_note
