revisions:
- from: அவன் எல்லா மனிதரையும்விட ஞானமுள்ளவனாக இருந்தான்—எஸ்ராகியனான ஏத்தானையும், ஏமானையும், கல்கோலையும், தர்தாவையும்விட; இவர்கள் மாகோலின் மகன்கள். அவனுடைய பெயர்[a] சுற்றிலுமிருந்த எல்லா நாடுகளிலும் பரவியிருந்தது.
