  text: וַ/יֶּחְכַּם֮ מִ/כָּל הָֽ/אָדָם֒ מֵ/אֵיתָ֣ן הָ/אֶזְרָחִ֗י וְ/הֵימָ֧ן וְ/כַלְכֹּ֛ל וְ/דַרְדַּ֖ע בְּנֵ֣י מָח֑וֹל וַ/יְהִֽי שְׁמ֥/וֹ בְ/כָֽל הַ/גּוֹיִ֖ם סָבִֽיב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/011.yaml
  text: He was wiser than every man—than Ethan the Ezrahite[a], and Heman, Kalkol, and Darda[c][b], the sons of Mahol—and his name was in all the surrounding nations.
translation:
  language: ta
  text: அவன் எல்லா மனிதரையும்விடவும், மாகோலின் மகன்களான எஸ்ராகியனான ஏத்தான், ஏமான், கல்கோல், தர்தா ஆகியோரைவிடவும் ஞானமுள்ளவனாக இருந்தான். அவனுடைய பெயர்[a] சுற்றியிருந்த எல்லா நாடுகளிலும் அறியப்பட்டிருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, சொல்லுக்கு சொல்: “அவனுடைய பெயர் சுற்றியிருந்த எல்லா நாடுகளிலும் இருந்தது.” இங்கே ‘பெயர்’ என்பது புகழைக் குறிக்கலாம்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחְכַּם מִכָּל הָאָדָם
  choice: அவன் எல்லா மனிதரையும்விட ஞானமுள்ளவனாக இருந்தான்
  rationale: חכם உடன் வரும் מן ஒப்பீட்டுச் சிறப்பைச் சுட்டுகிறது. אָדָם இங்கு மனிதகுலம் முழுவதையும் குறிக்கக்கூடியதாயினும், அடுத்து ஆண் ஞானிகள் பெயரிடப்படுவதால் ‘எல்லா மனிதரையும்விட’ என்பது இயல்பாகவும் மூலத்தின் விரிவையும் காக்கும் வகையிலும் உள்ளது.
- source_word: מֵאֵיתָן הָאֶזְרָחִי
  choice: எஸ்ராகியனான ஏத்தானையும்
  rationale: הָאֶזְרָחִי என்பது உறுதியற்ற குடும்ப/இன அடையாளப்பெயராக இருப்பதால், பொருளை ஊகிக்காமல் ஒலிபெயர்க்கப்பட்டது.
- source_word: וְהֵימָן וְכַלְכֹּל וְדַרְדַּע
  choice: ஏமானையும், கல்கோலையும், தர்தாவையும்விட
  rationale: தனிப்பட்ட பெயர்கள் எபிரெய ஒலிவடிவத்திற்கு அண்மையாகத் தமிழில் ஒலிபெயர்க்கப்பட்டன; ஒப்பீட்டு அமைப்பு தமிழில் தெளிவாக இருக்க இறுதியில் ‘விட’ சேர்க்கப்பட்டது.
- source_word: בְּנֵי מָחוֹל
  choice: இவர்கள் மாகோலின் மகன்கள்
  rationale: இது பெயரிடப்பட்ட ஞானிகளுக்கான குடும்ப/தந்தைவழி அடையாளம் என நேரடியாக எடுத்துக்கொள்ளப்பட்டது; ‘நடனத்தின் மகன்கள்’ போன்ற ஊக விளக்கங்கள் தவிர்க்கப்பட்டன.
- source_word: וַיְהִי שְׁמוֹ בְּכָל הַגּוֹיִם סָבִיב
  choice: அவனுடைய பெயர் சுற்றிலுமிருந்த எல்லா நாடுகளிலும் பரவியிருந்தது
  rationale: ‘அவனுடைய பெயர் இருந்தது’ என்ற எபிரெய மரபுத்தொடர் புகழ்/நற்பெயர் பரவியிருந்ததைக் குறிக்கிறது. ‘பெயர்’ என்பதைத் தக்கவைத்து, தமிழில் கருத்து இயல்பாகத் தெரிய ‘பரவியிருந்தது’ பயன்படுத்தப்பட்டது.
theological_decisions:
- issue: אָדָם என்பதன் பரப்பு
  choice: எல்லா மனிதரையும்
  alternative: மனிதகுலம் முழுவதையும் / ஒவ்வொரு ஆணையும்
  rationale: אָדָם பொதுவாக மனிதகுலத்தையும் குறிக்கலாம். இங்கு பெயரிடப்பட்ட ஆண் ஞானிகளுடன் ஒப்பிடப்படுவதால் ‘மனிதர்’ இயல்பானது; அதே நேரத்தில் உரையை ‘ஆண்கள்’ என்று தேவையின்றி குறுக்கவில்லை.
- issue: שֵׁם என்பதன் பொருள்
  choice: பெயர்
  alternative: புகழ்
  rationale: மூல உருவகத்தைத் தக்கவைத்து, ‘பரவியிருந்தது’ என்பதன் மூலம் புகழ் என்ற உட்பொருளையும் தெளிவாக்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. பெயர்கள் எபிரெய மூலத்துக்கு அண்மையாக ஒலிபெயர்க்கப்பட்டுள்ளன; உறுதியற்ற இன/குடும்ப அடையாளம் விளக்கமாக மாற்றப்படவில்லை.
