  text: וְ/הַ/שְּׂעֹרִ֣ים וְ/הַ/תֶּ֔בֶן לַ/סּוּסִ֖ים וְ/לָ/רָ֑כֶשׁ יָבִ֗אוּ אֶל הַ/מָּקוֹם֙ אֲשֶׁ֣ר יִֽהְיֶה שָּׁ֔ם אִ֖ישׁ כְּ/מִשְׁפָּטֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/008.yaml
  text: And the barley and the straw for the horses and the steeds were brought to the place where each man was[b][a], according to his duty.
translation:
  language: ta
  text: குதிரைகளுக்கும் தேர்ந்தெடுக்கப்பட்ட சவாரி விலங்குகளுக்கும்[a] வேண்டிய வாற்கோதுமையையும் வைக்கோலையும், ஒவ்வொருவரும்[b] இருந்த இடத்திற்கு அவரவர் பொறுப்பின்படி கொண்டுவந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல் சிறப்பாகத் தேர்ந்தெடுக்கப்பட்ட சவாரி விலங்குகளைக் குறிக்கலாம்; கோவேறு கழுதைகள் அல்லது தேர்க் குதிரைகளும் இதில் அடங்கியிருக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெய மொழியில், “ஒவ்வொரு மனிதனும்”; பொறுப்பேற்றிருந்த ஒவ்வொருவரையும் தனித்தனியாகக் குறிக்கும் பகிர்நிலைப் பயன்பாடு.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַשְּׂעֹרִים
  choice: வாற்கோதுமை
  rationale: இச்சூழலில் விலங்குகளுக்கான தீவனமாக வழங்கப்பட்ட barley தானியத்தைக் குறிக்கிறது; நவீனத் தமிழில் ‘வாற்கோதுமை’ தெளிவான பெயர்.
- source_word: וְהַתֶּבֶן
  choice: வைக்கோல்
  rationale: תֶּבֶן என்பது இங்கு தானியத்துடன் இணைந்து விலங்குகளுக்கான உலர் தீவனத்தைக் குறிக்கிறது; ‘வைக்கோல்’ இயல்பான தமிழாக்கம்.
- source_word: לַסּוּסִים
  choice: குதிரைகளுக்கு
  rationale: முன்னிடைச்சொல்லுடன் வரும் סוּסִים என்பதன் நேரடியான பொருளைத் தருகிறது.
- source_word: וְלָרָכֶשׁ
  choice: தேர்ந்தெடுக்கப்பட்ட சவாரி விலங்குகளுக்கு
  rationale: רֶכֶשׁ அரச அல்லது இராணுவப் பயன்பாட்டிலுள்ள சிறப்பான சவாரி விலங்குகளைக் குறிக்கலாம்; அவை கோவேறு கழுதைகளா, தேர்க் குதிரைகளா என்பது உறுதியல்ல. ஆகவே இனத்தைத் தேவையின்றி வரையறுக்காத மொழியாக இது தேர்ந்தெடுக்கப்பட்டது.
- source_word: יָבִיאוּ
  choice: கொண்டுவந்தார்கள்
  rationale: எபிரெயச் சொல் செயப்பாட்டு அல்ல, மூன்றாம் நபர் பன்மைச் செயல்வினை; பெயரிடப்படாத வழங்குநர்களின் செயலைத் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: אֶל־הַמָּקוֹם
  choice: இடத்திற்கு
  rationale: இலக்கைச் சுட்டும் எளிய இடவியல் தொடராக இயல்பாக மொழிபெயர்க்கப்பட்டது.
- source_word: אֲשֶׁר יִהְיֶה שָּׁם אִישׁ
  choice: ஒவ்வொருவரும் இருந்த இடத்திற்கு
  rationale: אִישׁ என்னும் ஒருமை இங்கு பகிர்நிலைப் பொருளில் ஒவ்வொரு பொறுப்பாளரையும் குறிக்கிறது; இடம்தோறும் இருந்தவர்களைத் தெளிவாகக் காட்டுகிறது.
- source_word: כְּמִשְׁפָּטוֹ
  choice: அவரவர் பொறுப்பின்படி
  rationale: இங்கு מִשְׁפָּט நீதித்தீர்ப்பைக் காட்டிலும் ஒவ்வொருவருக்கும் விதிக்கப்பட்ட நிர்வாகப் பொறுப்பு அல்லது ஒழுங்கைக் குறிக்கிறது; ‘பொறுப்பின்படி’ அந்தச் சூழலை இயல்பாக வெளிப்படுத்துகிறது.
