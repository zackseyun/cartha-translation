source:
  edition: WLC
  text: וַ/יִּתֵּן֩ אֱלֹהִ֨ים חָכְמָ֧ה לִ/שְׁלֹמֹ֛ה וּ/תְבוּנָ֖ה הַרְבֵּ֣ה מְאֹ֑ד וְ/רֹ֣חַב לֵ֔ב כַּ/ח֕וֹל אֲשֶׁ֖ר עַל שְׂפַ֥ת הַ/יָּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/009.yaml
  text: And God gave Solomon wisdom and very great understanding[a], and breadth of heart like the sand that is on the seashore.
translation:
  language: ta
  text: 'கடவுள் சாலொமோனுக்கு ஞானத்தையும் மிகுந்த பகுத்தறிவையும், கடற்கரை மணலைப்போல் பரந்த உள்ளத்தையும்[a] கொடுத்தார்.


    [a] எபிரேயத்தில், “இதயத்தின் அகலம்.” இங்கு “இதயம்” என்பது மனம், சிந்தனை அல்லது புரிந்துகொள்ளும் ஆற்றலைக் குறிக்கலாம்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில், “இதயத்தின் அகலம்.” இங்கு “இதயம்” என்பது மனம், சிந்தனை அல்லது புரிந்துகொள்ளும் ஆற்றலைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: கொடுத்தார்
  rationale: נתן என்பதன் நேரடியான பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: இங்கு ஒருமை வினையுடன் இஸ்ரவேலின் கடவுளைக் குறிக்கிறது.
- source_word: חָכְמָה
  choice: ஞானம்
  rationale: சாலொமோன் சூழலில் நடைமுறை மற்றும் அரசாட்சி சார்ந்த ஞானம் உட்பட சொல்லின் பரந்த பொருளைத் தக்கவைக்கிறது.
- source_word: לִשְׁלֹמֹה
  choice: சாலொமோனுக்கு
  rationale: பெயரை வழக்கமான தமிழ் வடிவில் தருவதோடு לְ முன்னிடைச்சொல்லின் பெறுநர் பொருளையும் காட்டுகிறது.
- source_word: וּתְבוּנָה
  choice: பகுத்தறிவு
  rationale: புரிதல், விவேகம், நுண்ணறிவு ஆகியவற்றை உள்ளடக்கும் תְּבוּנָה என்பதன் சூழல்சார் அறிவாற்றல் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַרְבֵּה מְאֹד
  choice: மிகுந்த
  rationale: அளவையும் தீவிரத்தையும் வலியுறுத்தும் எபிரேயச் சேர்க்கையை சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: וְרֹחַב לֵב
  choice: பரந்த உள்ளம்
  rationale: நேரடியான ‘இதயத்தின் அகலம்’ என்ற உருவகத்தைத் தமிழில் இயல்பாகத் தக்கவைத்து, அறிவாற்றல் மற்றும் புரிந்துகொள்ளும் திறனின் விரிவையும் உணர்த்துகிறது; நேரடி வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: כַּחוֹל אֲשֶׁר עַל שְׂפַת הַיָּם
  choice: கடற்கரை மணலைப்போல்
  rationale: கடலின் கரையிலுள்ள மணல் என்ற உருவகத்தை இயல்பான நவீன தமிழில் துல்லியமாகத் தருகிறது.
theological_decisions:
- issue: וְרֹחַב לֵב என்பதிலுள்ள மனித உள்ளம் சார்ந்த எபிரேய மரபுத்தொடர்
  choice: முதன்மை உரையில் ‘பரந்த உள்ளம்’ என்று உருவகத்தைத் தக்கவைத்தல்
  alternative: ‘விரிந்த மனம்’ அல்லது ‘மிகுந்த புரிந்துகொள்ளும் ஆற்றல்’
  rationale: לֵב என்பது உணர்ச்சியை மட்டும் அல்லாமல் மனம், சிந்தனை, புரிதல் ஆகியவற்றையும் குறிக்க முடியும். ‘உள்ளம்’ என்பது உருவகத்தையும் அதன் பொருள் பரப்பையும் தக்கவைக்கிறது; அடிக்குறிப்பு நேரடி வடிவத்தையும் அறிவாற்றல் சார்ந்த சாத்தியத்தையும் விளக்குகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் மரியாதைமிக்க நடையிலும் வடிவமைக்கப்பட்டது. ‘பரந்த உள்ளம்’ என்ற சொற்றொடர் எபிரேய உருவகத்தைத் தக்கவைக்கிறது; அது நவீன வாசகருக்கு உணர்ச்சி சார்ந்த பொருளாக மட்டும் தோன்றாதபடி அடிக்குறிப்பு சேர்க்கப்பட்டுள்ளது.
