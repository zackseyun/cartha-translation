translation_notes:
  register: நவீன தரத் தமிழில் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டது. ஆயினும், எபிரெய வாக்கிய அமைப்பைத் தெளிவுபடுத்தும் முயற்சியில் லְבַד தொடர்பை வசனத்துக்குள் மறுசீரமைத்துள்ளது.
