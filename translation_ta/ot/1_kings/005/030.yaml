  text: besides Solomon’s chief deputies who were over the work[a], three thousand three hundred[c][b], who ruled over the people doing the work.
translation:
  language: ta
  text: வேலைக்குப் பொறுப்பாயிருந்த சாலொமோனின் தலைமை அதிகாரிகளை[a]த் தவிர, அந்த வேலையைச் செய்த மக்கள்மேல்[c] அதிகாரம் செலுத்தியவர்கள்[b] மூவாயிரத்து முந்நூறு பேர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தலைமை அலுவலர்கள்’ அல்லது ‘தலைமைக் கண்காணிப்பாளர்கள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய நிர்வாகச் சொற்கள் பதவிநிலையையும் மேற்பார்வைப் பொறுப்பையும் ஒருங்கே குறிக்கின்றன.
    reason: lexical_alternative
  - marker: b
    text: ‘அதிகாரம் செலுத்தியவர்கள்’ என்பதற்கான எபிரெய வினைச்சொல் ஆளுகை செய்வதைக் குறிக்கலாம்; இச்சூழலில் அது தொழிலாளர்கள்மீது செலுத்தப்பட்ட மேற்பார்வை அதிகாரத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: எபிரெயத்தில் ‘மக்கள்’ என்று உள்ளது; இங்கு கட்டுமான வேலையில் ஈடுபட்ட வேலைக்குழுவை அது குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבַד מִשָּׂרֵי הַנִּצָּבִים
  choice: நியமிக்கப்பட்ட சாலொமோனின் தலைமை அதிகாரிகள் ... இவர்களைத் தவிர
  rationale: לְבַד מִן என்பதன் ‘தவிர’ என்ற பொருளையும், שׂרי הנצבים என்பதில் உள்ள பதவிநிலை மற்றும் நியமிக்கப்பட்ட மேற்பார்வை ஆகிய இரு கருத்துகளையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר עַל הַמְּלָאכָה
  choice: வேலையை மேற்பார்வையிட
  rationale: עַל இங்கு வேலைக்குப் பொறுப்பாக இருந்து அதைக் கண்காணிக்கும் நிர்வாகப் பங்கைச் சுட்டுகிறது.
- source_word: שְׁלֹשֶׁת אֲלָפִים וּשְׁלֹשׁ מֵאוֹת
  choice: மூவாயிரத்து முந்நூறு பேர்
  rationale: எண்ணிக்கையைத் தெளிவான இலக்கியத் தமிழில் தருகிறது.
- source_word: הָרֹדִים
  choice: அதிகாரம் செலுத்தியவர்கள்
  rationale: רדה என்பதன் வலுவான ‘ஆளுதல்/அதிகாரம் செலுத்துதல்’ பொருளைப் பாதுகாக்கிறது; தொழிலாளர்களைக் கண்காணித்த சூழலுக்கும் பொருந்துகிறது.
- source_word: בָּעָם
  choice: மக்கள்மேல்
  rationale: எபிரெய மூலத்தின் பொதுவான ‘மக்கள்’ என்ற சொல்லைப் பிரதான உரையில் தக்கவைத்து, இங்கு அது வேலைக்குழுவைக் குறிக்கிறது என்பதை அடிக்குறிப்பில் விளக்குகிறது.
- source_word: הָעֹשִׂים בַּמְּלָאכָה
  choice: வேலை செய்த
  rationale: வேலையில் ஈடுபட்டிருந்த மக்களை அடையாளப்படுத்தும் எளிய, நேரடியான பெயரெச்சத் தொடர்.
