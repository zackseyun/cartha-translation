  terminology: ‘தலைமை அதிகாரிகள்’ suitably represents the high-ranking administrative officials, while ‘அதிகாரம் செலுத்தியவர்கள்’ preserves the stronger force of רֹדִים. ‘மக்கள்’ is retained in the text, with contextual clarification in the footnote.
