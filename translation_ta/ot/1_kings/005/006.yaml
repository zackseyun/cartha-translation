translation:
  language: ta
  text: சாலொமோனுக்கு, அவரது தேர்களுக்கான குதிரைகளுக்காக நாற்பதாயிரம் பந்திகள் இருந்தன; பன்னிரண்டாயிரம் குதிரைவீரர்களும் இருந்தனர்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי לִשְׁלֹמֹה
  choice: சாலொமோனுக்கு ... இருந்தன/இருந்தனர்
  rationale: எபிரெய மொழியின் உடைமை அல்லது வசமிருத்தலைக் குறிக்கும் அமைப்பைத் தமிழில் இயல்பான ‘சாலொமோனுக்கு ... இருந்தன’ என்ற வடிவில் தருகிறது; உயிருள்ள ‘குதிரைவீரர்கள்’ அருகில் இருப்பதால் இறுதி வினை ‘இருந்தனர்’ என அமைந்தது.
- source_word: אַרְבָּעִים אֶלֶף
  choice: நாற்பதாயிரம்
  rationale: எண்ணிக்கையை நேரடியாகவும் இயல்பான தமிழிலும் தருகிறது.
- source_word: אֻרְוֺת
  choice: பந்திகள்
  rationale: இச்சொல் பெரிய குதிரை இலாயக் கட்டடங்களை விட, தனித்தனி குதிரைகள் நிறுத்தப்பட்டு தீனி அளிக்கப்படும் இடங்களைச் சுட்டுகிறது. ‘பந்திகள்’ அந்தக் குறிப்பான பொருளைத் தக்கவைக்கிறது.
- source_word: סוּסִים לְמֶרְכָּבוֹ
  choice: தனது தேர்களுக்கான குதிரைகளுக்கு
  rationale: מֶרְכָּב என்ற ஒருமை இங்கு சாலொமோனின் தேர்ப்படையைத் தொகுப்பாகக் குறிக்கிறது; தமிழில் ‘தனது தேர்களுக்கான குதிரைகள்’ என்பது உறவைக் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: וּשְׁנֵים עָשָׂר אֶלֶף
  choice: பன்னிரண்டாயிரம்
  rationale: எண்ணிக்கையை நேரடியாகத் தருகிறது; இணைப்பை ‘-உம்’ வடிவம் வெளிப்படுத்துகிறது.
- source_word: פָּרָשִׁים
  choice: குதிரைவீரர்கள்
  rationale: சொல் பொதுவாகக் குதிரைமேல் சவாரி செய்யும் படைவீரர்களைக் குறிக்கிறது. ‘தேரோட்டிகள்’ எனக் குறுக்காமல் மூலத்தின் பொருளைத் தக்கவைக்கிறது.
