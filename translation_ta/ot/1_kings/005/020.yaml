  rationale: עבד என்ற சொல்லை இங்குள்ள வேலைச் சூழலுக்கு ஏற்றவாறு இரு தரப்பிலும் ஒரே மாதிரியாக ‘பணியாளர்கள்’ என்று வழங்குகிறது; அவர்களின் சட்ட அல்லது சமூக நிலையைக் கூடுதலாக நிர்ணயிக்கவில்லை.
