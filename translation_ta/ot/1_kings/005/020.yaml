base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/020.yaml
  text: Now command that cedars from Lebanon be cut for me[a], and let my servants be with your servants, and I will give you the wages of your servants according to all that you say[b]; for you know that among us there is no man who knows how to cut timber like the Sidonians.
translation:
  language: ta
  text: இப்போது, லெபனோனிலிருந்து கேதுரு மரங்களை எனக்காக வெட்டும்படி கட்டளையிடுங்கள். என் பணியாளர்கள் உங்கள் பணியாளர்களுடன் இருக்கட்டும். உங்கள் பணியாளர்களின் கூலியை, நீங்கள் கூறுவதற்கேற்ப முழுவதும் உங்களுக்குக் கொடுப்பேன். ஏனெனில், சீதோனியரைப் போல மரங்களை வெட்டுவதில் திறமையுள்ள ஆண் எவரும்[a] எங்களிடையே இல்லை என்பது உங்களுக்குத் தெரியும்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில், ‘எங்களிடையே ஆண் ஒருவனும் இல்லை’ என்று உள்ளது. இங்கு ஒப்பான திறனுடைய எவரும் இல்லை என்பதே கருத்து; இது சமூகத்தில் பெண்கள் விலக்கப்பட்டனர் என்ற பொதுவான கூற்றாக இருக்க வேண்டியதில்லை.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘மரங்களை வெட்டத் தெரிந்தவர்.’ எபிரேயத்தில் சொற்பட ‘மரங்களை வெட்ட’ என்று உள்ளது; இச்சூழலில் கட்டுமானத்திற்காக மரங்களை வெட்டி எடுக்கும் திறன் குறிக்கப்படுகிறது.
    reason: lexical_alternative
