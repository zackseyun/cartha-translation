  text: For he was ruling over all the region beyond the River[a], from Tiphsah to Gaza, over all the kings beyond the River[b]; and he had peace on all sides around him.
translation:
  language: ta
  text: ஏனெனில், அவர் ஆற்றுக்கு[a] அப்பாலுள்ள பகுதி முழுவதையும்—திப்சா முதல் காசா வரை—ஆண்டுவந்தார்; ஆற்றுக்கு அப்பாலுள்ள எல்லா அரசர்களையும் ஆண்டுவந்தார்; அவரைச் சுற்றியிருந்த எல்லாத் திசைகளிலிருந்தும் அவருக்கு அமைதி இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு “ஆறு” என்பது யூப்ரடீஸ் ஆற்றைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: רֹדֶה
  choice: ஆண்டுவந்தார்
  rationale: எபிரெயப் பங்கேற்புவினை தொடர்ந்த ஆட்சியைச் சுட்டுவதால், இயல்பான தமிழில் அதன் நீடித்த தன்மையை வெளிப்படுத்துகிறது.
- source_word: בְּכָל עֵבֶר הַנָּהָר
  choice: ஆற்றுக்கு அப்பாலுள்ள பகுதி முழுவதையும்
  rationale: இது ஆற்றுக்கு அப்பாலுள்ள நிலப்பரப்பைக் குறிக்கும் புவியியல் சொற்றொடர்; தமிழில் தெளிவுக்காக ‘பகுதி’ சேர்க்கப்பட்டுள்ளது.
- source_word: הַנָּהָר
  choice: ஆறு
  rationale: மூலத்தில் குறிப்பிட்ட ஆற்றின் பெயருக்குப் பதிலாக ‘ஆறு’ என்ற பொதுப்பெயரே உள்ளது; அதன் சுட்டுப்பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: מִתִּפְסַח וְעַד עַזָּה
  choice: திப்சா முதல் காசா வரை
  rationale: சாலொமோனின் ஆட்சிப் பரப்பின் எல்லையை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: בְּכָל מַלְכֵי עֵבֶר הַנָּהָר
  choice: அங்கிருந்த எல்லா அரசர்களையும்
  rationale: முன்னர் குறிப்பிடப்பட்ட ஆற்றுக்கு அப்பாலுள்ள பகுதியின் அரசர்கள்மீதான மேலாட்சியைத் தமிழில் தேவையற்ற மறுபடியுரைத்தலின்றித் தெரிவிக்கிறது.
- source_word: וְשָׁלוֹם הָיָה לוֹ
  choice: அவருக்கு அமைதி இருந்தது
  rationale: சூழலில் உள்ள அரசியல் அமைதியையும் பாதுகாப்பையும் அளவுக்கு மீறி விளக்காமல் காக்கிறது.
- source_word: מִכָּל עֲבָרָיו מִסָּבִיב
  choice: அவரைச் சுற்றிலும் எல்லாப் பக்கங்களிலும்
  rationale: சுற்றியுள்ள எல்லாத் திசைகளிலிருந்தும் அமைதி நிலவியதைக் குறிக்கும் மூல மொழியின் இடவியல் வலியுறுத்தலைக் காக்கிறது.
