base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/025.yaml
  text: And Solomon gave Hiram twenty thousand cors of wheat as food for his household[a], and twenty cors of beaten oil[b]. Thus Solomon would give to Hiram year by year.
translation:
  language: ta
  text: சாலொமோன் ஈராமுக்கு, அவனுடைய வீட்டாருக்கான உணவாக[a] இருபதாயிரம் கோர் கோதுமையையும் இருபது கோர் இடித்தெடுத்த எண்ணெயையும்[b] கொடுத்தான். இவ்வாறு சாலொமோன் ஈராமுக்கு ஆண்டுதோறும் கொடுத்துவந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனுடைய வீட்டிற்கான உணவுப்பொருளாக.” எபிரெயச் சொற்றொடர் ஈராமின் அரச வீட்டாருக்கு வழங்கப்பட்ட உணவைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “இடித்தெடுத்த எண்ணெய்” என்பது ஒலிவக் கனிகளைப் பின்னர் அழுத்திப் பிழியும் முறைக்குப் பதிலாக இடித்து அல்லது நசுக்கி எடுக்கப்பட்ட உயர்தர எண்ணெயைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: נָתַן / יִתֵּן
  choice: கொடுத்தான் / கொடுத்துவந்தான்
  rationale: முதலில் நிறைவேற்றப்பட்ட ஏற்பாட்டை இறந்தகால வினையும், பின்னர் ஆண்டுதோறும் தொடர்ந்த வழக்கத்தை நிறைவுறா வினையும் குறிக்கின்றன.
- source_word: כֹּר
  choice: கோர்
  rationale: இது ஒரு குறிப்பிட்ட பண்டைய கொள்ளளவு அலகு; பொதுவான ‘அளவு’ என்பதற்குப் பதிலாக அலகின் பெயர் ஒலிபெயர்க்கப்பட்டது.
- source_word: חִטִּים
  choice: கோதுமை
  rationale: இந்தச் சொல் பொதுவான தானியத்தையல்ல, குறிப்பாகக் கோதுமையைக் குறிக்கிறது.
- source_word: מַכֹּלֶת לְבֵיתוֹ
  choice: அரண்மனை குடும்பத்தாரின் உணவுக்காக
  rationale: מַכֹּלֶת என்பது உணவு அல்லது உணவுப்பொருளைக் குறிக்கிறது; בֵּיתוֹ இங்கு ஈராமின் அரச வீட்டார் அல்லது அரண்மனை குடும்பத்தாரைக் குறிக்கும் வாய்ப்பு மிகுதி.
- source_word: שֶׁמֶן כָּתִית
  choice: இடித்தெடுத்த எண்ணெய்
  rationale: כָּתִית என்பது இடித்தல் அல்லது நசுக்குதல் மூலம் எடுக்கப்பட்ட உயர்தர எண்ணெயைக் குறிக்கிறது; எபிரெயத்தில் ‘ஒலிவ’ வெளிப்படையாக இல்லாததால் அது முதன்மை உரையில் சேர்க்கப்படவில்லை.
- source_word: כֹּה
  choice: இவ்வாறு
  rationale: முன் கூறிய அளவுகளின்படி ஏற்பாடு நடைமுறையில் தொடர்ந்த விதத்தைச் சுட்டுகிறது.
- source_word: שָׁנָה בְשָׁנָה
  choice: ஆண்டுதோறும்
  rationale: ஒவ்வோர் ஆண்டும் தவறாமல் நிகழ்ந்த தொடர்ச்சியை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
