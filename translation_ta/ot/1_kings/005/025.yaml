translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. பண்டைய அளவலகான ‘கோர்’ ஒலிபெயர்க்கப்பட்டுள்ளது; ‘இடித்தெடுத்த எண்ணெய்’ என்ற மொழிபெயர்ப்பு மூலத்தின் உற்பத்திமுறை சார்ந்த நுணுக்கத்தைப் பாதுகாக்கிறது.
