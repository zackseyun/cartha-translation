source:
  edition: WLC
  text: וַ/תֵּ֨רֶב֙ חָכְמַ֣ת שְׁלֹמֹ֔ה מֵֽ/חָכְמַ֖ת כָּל בְּנֵי קֶ֑דֶם וּ/מִ/כֹּ֖ל חָכְמַ֥ת מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/010.yaml
  text: And Solomon’s wisdom surpassed the wisdom of all the people of the east and all the wisdom of Egypt[a].
translation:
  language: ta
  text: சாலொமோனின் ஞானம் கிழக்கத்திய மக்கள் அனைவரின் ஞானத்தையும் எகிப்தின் எல்லா ஞானத்தையும் விஞ்சியது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்கு சொல், “கிழக்கின் மகன்கள்”; இது கிழக்கத்திய மக்களைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶב
  choice: விஞ்சியது
  rationale: רבה என்பதுடன் ஒப்பீட்டைக் குறிக்கும் מן வருவதால், இங்கு வெறும் அளவு அதிகரிப்பை அல்லாமல் மேன்மையைத் தெரிவிக்கிறது; ‘விஞ்சியது’ இயல்பாகவும் தெளிவாகவும் இதைக் காட்டுகிறது.
- source_word: חָכְמַת
  choice: ஞானம்
  rationale: இச்சூழலில் חָכְמָה என்பது ஞானம், அறிவு, கற்றறிவு ஆகியவற்றை விரிவாகக் குறிக்கிறது; ‘ஞானம்’ வழக்கமானதும் சூழலுக்கு ஏற்றதுமான மொழிபெயர்ப்பு.
- source_word: שְׁלֹמֹה
  choice: சாலொமோன்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் பெயர்வடிவம்.
- source_word: כָּל בְּנֵי קֶדֶם
  choice: கிழக்கத்திய மக்கள் அனைவரும்
  rationale: சொல்லுக்கு சொல் ‘கிழக்கின் மகன்கள்’ என்றாலும், இது ஒரு பிராந்திய மக்களைக் குறிக்கும் எபிரெய மரபுத்தொடர். நவீன தமிழில் ‘கிழக்கத்திய மக்கள்’ அதன் பொருளை இயல்பாகத் தருகிறது.
- source_word: וּמִכֹּל חָכְמַת מִצְרָיִם
  choice: எகிப்தின் எல்லா ஞானத்தையும்
  rationale: இரண்டாவது ஒப்பீட்டுப் பகுதியும் அதே வினைச்சொல்லைச் சார்ந்தது; தமிழில் வினையை மீண்டும் கூறாமல் இணைப்பது இயல்பானது.
- source_word: מִצְרָיִם
  choice: எகிப்து
  rationale: இடப்பெயரின் நிலையான தமிழ் வடிவம்.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய ஒப்பீட்டின் வலிமை ‘விஞ்சியது’ என்பதன் மூலம் காக்கப்பட்டது; மரபுத்தொடரின் சொற்படியான வடிவம் அடிக்குறிப்பில் தரப்பட்டது.
