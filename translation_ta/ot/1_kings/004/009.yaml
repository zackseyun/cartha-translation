translation_notes:
  register: நவீனத் தரத் தமிழில், பட்டியல் நடைக்கு ஏற்ற சுருக்கமானதும் கண்ணியமானதுமான மொழிநடை பயன்படுத்தப்பட்டுள்ளது. தமிழில் தனித்து நிற்கும் பெயர்த்தொடர் முழுமையற்றதாகத் தோன்றாதபடி, மூலத்தில் சூழலால் உணர்த்தப்படும் அதிகாரியின் தொடர்பை ‘இருந்தார்’ எனக் குறைந்த அளவில் வெளிப்படுத்தியுள்ளது; ‘ஆட்சி செய்தார்’ அல்லது ‘மேற்பார்வை செய்தார்’ போன்ற நிர்வாகப் பொருள் சேர்க்கப்படவில்லை.
