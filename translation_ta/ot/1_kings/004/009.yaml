    text: அல்லது, இன்னும் நேரடியாக, ‘தேக்கேரின் மகன்’; இங்கு எபிரெயப் பெயரமைப்பு ‘பென்-தேக்கேர்’ என்ற தனிநபர் அடையாளப்பெயராகப் பாதுகாக்கப்பட்டுள்ளது.
