  language: ta
  text: 'பென்-தேக்கேர்[a]: மாகாசிலும், சால்பீமிலும், பெத்-ஷெமேஷிலும், ஏலோன்-பெத்-ஹானானிலும்.'
  philosophy: optimal-equivalence
