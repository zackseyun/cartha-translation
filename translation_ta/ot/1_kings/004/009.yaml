lexical_decisions:
- source_word: בֶּן דֶּקֶר
  choice: பென்-தேக்கேர்
  rationale: நிர்வாக அதிகாரிகளின் இப்பட்டியலில், בֶּן + இயற்பெயர் என்பது முழுமையான விளக்கச் சொற்றொடரைவிட ஒருவரின் பெயர் அல்லது அடையாளப்பெயராகச் செயல்படுகிறது. ஆகவே எபிரெயப் பெயரமைப்பு ஒலிபெயர்க்கப்படுகிறது.
- source_word: בְּ/מָקַץ
  choice: மாக்காசிலும்
  rationale: בְ இங்கு அதிகாரியுடன் தொடர்புடைய இடத்தைச் சுட்டுகிறது. நிர்வாகப் பின்னணியைச் சொல்லுக்குள் சேர்த்து ‘மாக்காசுக்கு மேலானவர்’ என்று மொழிபெயர்க்காமல், நேரடியான இடப்பொருள் தரப்படுகிறது.
- source_word: וּ/בְ/שַׁעַלְבִים
  choice: சால்பீமிலும்
  rationale: இணைப்பிடைச்சொல்லும் இடப்பொருள் தரும் முன்னொட்டும் தமிழில் ‘-இலும்’ என இயல்பாக வெளிப்படுத்தப்படுகின்றன; இடப்பெயர் ஒலிபெயர்க்கப்படுகிறது.
- source_word: וּ/בֵית שָׁמֶשׁ
  choice: பெத்-செமேசிலும்
  rationale: இச்சொல்லுக்கு முன் בְ மீண்டும் வெளிப்படையாக வராவிட்டாலும், பட்டியலின் தொடர்ச்சியால் அதன் இடப்பொருள் இங்கும் நீடிக்கிறது. பெயரின் சொற்பொருளை மொழிபெயர்க்காமல் இடப்பெயராக ஒலிபெயர்க்கப்படுகிறது.
- source_word: וְ/אֵילֹון בֵּית חָנָן
  choice: ஏலோன்-பெத்-ஆனானிலும்
  rationale: இது பட்டியலில் வரும் கூட்டிடப்பெயராக எடுத்துக்கொள்ளப்படுகிறது. முந்தைய இடங்களிலிருந்து தொடரும் இடப்பொருளைத் தமிழின் ‘-இலும்’ வெளிப்படுத்துகிறது.
