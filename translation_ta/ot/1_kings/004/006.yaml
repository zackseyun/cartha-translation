  text: and Ahishar was over the household[b][a], and Adoniram son of Abda was over the forced labor.
translation:
  language: ta
  text: அகீஷார் அரண்மனை நிர்வாகத்திற்குப் பொறுப்பாளராக இருந்தார்[a]. அப்தாவின் மகன் அதோனீராம் கட்டாய உழைப்புக்குப் பொறுப்பாளராக இருந்தார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில் சொல்லுக்கு சொல், “வீட்டின்மேல்.” இது அரச இல்லம் அல்லது அரண்மனை நிர்வாகத்தை மேற்பார்வையிடும் அரசவைப் பதவியைக் குறிக்கிறது. “அரச இல்லத்திற்குப் பொறுப்பாளராக” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “கட்டாய உழைப்புச் சேவையின் பொறுப்பாளராக” அல்லது “உழைப்பு வரிக்குப் பொறுப்பாளராக” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் அரசால் விதிக்கப்பட்ட கட்டாய உழைப்புச் சேவையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲחִישָׁר
  choice: அகீஷார்
  rationale: தனிப்பட்ட பெயர் என்பதால், எபிரெய ஒலிப்புக்கு ஏற்றவாறு தமிழில் ஒலிபெயர்க்கப்பட்டது; பட்டியல் நடையில் வாவ் இணைப்பைத் தனியே ‘மற்றும்’ என்று மொழிபெயர்ப்பது இயல்பற்றதால் வாக்கியத் தொடர்ச்சியில் உணர்த்தப்பட்டுள்ளது.
- source_word: עַל הַבָּיִת
  choice: அரண்மனை நிர்வாகத்திற்குப் பொறுப்பாளராக
  rationale: சொல்லுக்கு சொல் ‘வீட்டின்மேல்’ என்றாலும், அரசவையின் அலுவலர் பட்டியலில் இது அரச குடும்பம் அல்லது அரண்மனை நிர்வாகத்தைக் கண்காணிக்கும் பதவியைக் குறிக்கிறது. நவீனத் தமிழில் பதவியின் பொருளை இயல்பாகத் தெரிவிக்க இவ்வாறு வழங்கப்பட்டது; மூலத்தின் விரிவான பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- source_word: וַאֲדֹנִירָם
  choice: அதோனீராம்
  rationale: தனிப்பட்ட பெயர் என்பதால் எபிரெய ஒலிப்பை அடிப்படையாகக் கொண்டு தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: בֶּן עַבְדָּא
  choice: அப்தாவின் மகன்
  rationale: அலுவலரை அவரது தந்தையின் பெயரால் அடையாளப்படுத்தும் வழக்கமான எபிரெய மரபுத்தொடர் தமிழில் இயல்பாக வழங்கப்பட்டது.
- source_word: עַל הַמַּס
  choice: கட்டாய உழைப்புக்குப் பொறுப்பாளராக
  rationale: מַס என்பது இவ்வரச நிர்வாகச் சூழலில் வெறும் வரியைக் காட்டிலும் அரசால் விதிக்கப்பட்ட கட்டாய உழைப்புச் சேவையைக் குறிக்கிறது. தொழில்நுட்பச் சொல் தவிர்க்கப்பட்டு, சாதாரண வாசகருக்குத் தெளிவான சொற்றொடர் தேர்ந்தெடுக்கப்பட்டது.
