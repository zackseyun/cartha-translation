translation_notes:
  register: நவீன நிலையான தமிழில், அரச அலுவலர் பட்டியலுக்கேற்ற கண்ணியமான மற்றும் தெளிவான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் வெளிப்படையாக உள்ள ‘இருந்தார்’ முதல் துணைவாக்கியத்தில் சேர்க்கப்பட்டு, இரண்டாவது துணைவாக்கியத்திலும் தமிழின் இயல்புக்காகத் திரும்பக் கூறப்பட்டுள்ளது. இரு அடிக்குறிப்பு குறியீடுகளும் உரிய சொற்றொடர்களுக்குப் பின் வைக்கப்பட்டுள்ளன.
