  yaml_path: translation/ot/1_kings/004/004.yaml
  text: Benaiah son of Jehoiada was over the army[a], and Zadok and Abiathar were priests.
translation:
  language: ta
  text: யோய்தாவின் மகன் பெனாயா படைக்குப் பொறுப்பாக இருந்தார்; சாதோக்கும் அபியத்தாரும் ஆசாரியர்களாக இருந்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஆசாரியர்கள்’ என்பதற்குப் பதிலாக, כֹּהֲנִים என்ற சொல் இங்கு அரசவையின் விரிவான நிர்வாகப் பொருளில் பயன்படுத்தப்பட்டதாகப் புரிந்துகொண்டால், ‘முதன்மை அமைச்சர்கள்’ அல்லது ‘உயர் அதிகாரிகள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: עַל הַצָּבָא
  choice: படைக்குப் பொறுப்பாக இருந்தார்
  rationale: עַל என்பது இங்கு ஒரு துறையின் மீதான அதிகாரத்தையோ மேற்பார்வையையோ குறிக்கிறது. எபிரெய உரையில் இல்லாத குறிப்பிட்ட படைத்துறைப் பட்டத்தைச் சேர்க்காமல், இயல்பான நவீனத் தமிழில் பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: הַצָּבָא
  choice: படை
  rationale: இச்சூழலில் צָבָא என்பது விண்ணுலகச் சேனையை அல்ல, ஒழுங்கமைக்கப்பட்ட அரச படையைக் குறிக்கிறது.
- source_word: כֹּהֲנִים
  choice: ஆசாரியர்கள்
  rationale: இச்சொல்லின் இயல்பான முதன்மைப் பொருள் ‘ஆசாரியர்கள்.’ சாதோக்கும் அபியத்தாரும் பிற இடங்களிலும் ஆசாரியர்களாக அறியப்படுவதால், அரசவையின் நிர்வாகச் சூழல் இருந்தாலும் முதன்மைப் பொருளே தக்கவைக்கப்படுகிறது.
- source_word: בְנָיָהוּ
  choice: பெனாயா
  rationale: எபிரெயத் தனிப்பெயரின் ஒலியை நவீனத் தமிழ் வேதாகமப் பெயரிடும் மரபுக்கு ஏற்றவாறு எழுத்துப்பெயர்த்தது.
- source_word: יְהוֹיָדָע
  choice: யோயாதா
  rationale: எபிரெயத் தனிப்பெயரைத் தமிழில் இயல்பாக எழுத்துப்பெயர்த்தது.
- source_word: צָדוֹק
  choice: சாதோக்
  rationale: எபிரெயத் தனிப்பெயரைத் தமிழில் இயல்பாக எழுத்துப்பெயர்த்தது.
- source_word: אֶבְיָתָר
  choice: அபியத்தார்
  rationale: எபிரெயத் தனிப்பெயரைத் தமிழில் இயல்பாக எழுத்துப்பெயர்த்தது.
theological_decisions:
- issue: כֹּהֲנִים என்பதை வழிபாட்டுப் பணியைக் குறிக்கும் ‘ஆசாரியர்கள்’ என்று மொழிபெயர்ப்பதா, அல்லது அரசவைச் சூழலை முன்னிட்டு ‘முதன்மை அமைச்சர்கள்’ போன்ற நிர்வாகப் பொருளில் மொழிபெயர்ப்பதா?
  choice: ஆசாரியர்கள்
  alternative: முதன்மை அமைச்சர்கள்; உயர் அதிகாரிகள்
  rationale: எபிரெயச் சொல்லின் வழக்கமான பொருள் ‘ஆசாரியர்கள்’; மேலும் சாதோக்கும் அபியத்தாரும் ஆசாரியப் பணியோடு தெளிவாகத் தொடர்புடையவர்கள். ஆகவே உரை கோராத நிர்வாக விளக்கத்தை முதன்மை உரையில் புகுத்தாமல், மாற்றுப் புரிதலை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் dignified நடையில் மொழிபெயர்க்கப்பட்டது. ‘படைக்குப் பொறுப்பாக’ என்பது அதிகாரப் பொருளை இயல்பாக வெளிப்படுத்துகிறது; தனிப்பெயர்கள் தமிழ் வேதாகம வாசிப்பு மரபுக்கு ஏற்ற வடிவங்களில் வழங்கப்பட்டுள்ளன.
