  text: And Solomon had twelve deputies over all Israel[a], and they provided for the king and his household; each one had to provide for one month in the year.
translation:
  language: ta
  text: சாலொமோனுக்கு இஸ்ரவேல் முழுவதற்கும் பொறுப்பாக இருந்த பன்னிரண்டு நிர்வாகிகள்[a] இருந்தார்கள். அவர்கள் அரசனுக்கும் அவருடைய வீட்டாருக்கும் தேவையானவற்றை வழங்கினார்கள்; ஆண்டில் ஒரு மாதம் அவற்றை வழங்கும் பொறுப்பு ஒவ்வொருவருக்கும் இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அதிகாரிகள்,’ ‘ஆளுநர்கள்’ அல்லது ‘அலுவலர்கள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் நியமிக்கப்பட்ட நிர்வாகப் பொறுப்பாளர்களைப் பொதுவாகக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִשְׁלֹמֹה
  choice: சாலொமோனுக்கு ... இருந்தார்கள்
  rationale: לְ இங்கு உடைமை அல்லது தொடர்பைக் குறிக்கிறது; தமிழில் இயல்பாக ‘சாலொமோனுக்கு ... இருந்தார்கள்’ என்று வழங்கப்படுகிறது.
- source_word: שְׁנֵים עָשָׂר
  choice: பன்னிரண்டு
  rationale: மூலத்தின் எண்ணிக்கையை நேரடியாகக் கொடுக்கிறது.
- source_word: נִצָּבִים
  choice: நிர்வாகிகள்
  rationale: நியமிக்கப்பட்ட அரச நிர்வாகப் பொறுப்பாளர்களைக் குறிக்கும் விரிவான எபிரெயச் சொல்லுக்கு இயல்பான தமிழ்ச் சொல்; குறிப்பிட்ட பதவிநிலையை அளவுக்கு மீறி வரையறுக்காது.
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: இஸ்ரவேல் முழுவதையும் மேற்பார்வையிட
  rationale: עַל இங்கு நிர்வாகப் பொறுப்பு அல்லது அதிகார வரம்பைக் குறிக்கிறது; ‘மேற்பார்வையிட’ என்பது தமிழில் அந்த உறவைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וְכִלְכְּלוּ
  choice: தேவையானவற்றை வழங்கினார்கள்
  rationale: כלכל இச்சூழலில் உணவு உள்ளிட்ட பராமரிப்புத் தேவைகளை வழங்குவதைக் குறிக்கிறது; பொதுவான ‘தேவையானவை’ என்பது மூலத்தின் பரந்த பொருளைப் பேணுகிறது.
- source_word: אֶת הַמֶּלֶךְ וְאֶת בֵּיתוֹ
  choice: அரசனுக்கும் அவனுடைய வீட்டாருக்கும்
  rationale: בֵּיתוֹ என்பது கட்டடத்தை அல்ல, அரசனின் குடும்பம் மற்றும் அரண்மனைச் சார்ந்த வீட்டாரைக் குறிக்கிறது.
- source_word: חֹדֶשׁ בַּשָּׁנָה
  choice: ஆண்டில் ஒரு மாதத்திற்குத்
  rationale: ஒவ்வொரு நிர்வாகிக்கும் ஆண்டுதோறும் ஒரு மாதம் என்ற முறைப்பங்கைக் குறிக்கும் சொற்றொடரை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יִהְיֶה עַל אֶחָד לְכַלְכֵּל
  choice: வழங்கும் பொறுப்பு ஒவ்வொருவருக்கும் இருந்தது
  rationale: சொல்லுக்குச் சொல் ‘ஒருவர்மேல் இருந்தது’ என்ற கடமை அமைப்பை, மாறிமாறி ஒவ்வொருவருக்கும் பொறுப்பு இருந்தது என இயல்பான தமிழில் தருகிறது.
