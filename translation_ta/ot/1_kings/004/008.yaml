lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: இவை
  rationale: இணைப்பிடைச்சொல்லான וְ பட்டியலின் தொடர்ச்சியைக் காட்டுகிறது; தமிழில் முந்தைய வசனத்துடன் இயல்பாகத் தொடரும் அமைப்பில் ‘இவை’ போதுமானது.
- source_word: שְׁמוֹתָם
  choice: அவர்களுடைய பெயர்கள்
  rationale: எபிரெய உரை வினைச்சொல் இல்லாத பெயர்ச்சொல் வாக்கியம்; தமிழில் ‘அவர்களுடைய பெயர்கள் இவை’ என இயல்பாகவும் மூல அமைப்புக்கு நெருக்கமாகவும் வழங்கப்பட்டுள்ளது.
- source_word: בֶּן חוּר
  choice: பென்-ஊர்
  rationale: மாவட்ட அதிகாரிகளின் பட்டியலில் இதை இயற்பெயராக எடுத்துக்கொண்டு ஒலிபெயர்க்கப்பட்டுள்ளது; ‘ஊரின் மகன்’ என்ற தந்தைவழிக் குறிப்பாகவும் புரிந்துகொள்ள இயலும் என்பதால் மாற்றுப் பொருள் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- source_word: בְּהַר אֶפְרָיִם
  choice: எப்பிராயீமின் மலைநாட்டுப் பகுதிக்கு
  rationale: הַר என்பது இங்கு தனி மலையை அல்ல, எப்பிராயீமின் உயர்நிலப் பிரதேசத்தைச் சுட்டுகிறது. பட்டியலின் சூழலில் அதிகாரிக்கு ஒதுக்கப்பட்ட மாவட்டம் எனத் தெளிவாகத் தமிழாக்கப்பட்டுள்ளது.
