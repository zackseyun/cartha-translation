lexical_decisions:
- source_word: בֶּן אֲבִינָדָב
  choice: அபினதாபின் மகன்
  rationale: எபிரேயச் சொற்றொடரின் இயல்பான பொருள் ‘அபினதாபின் மகன்’; அதிகாரியின் தனிப்பட்ட பெயர் வசனத்தில் தரப்படவில்லை.
- source_word: כָּל נָפַת דֹּאר
  choice: தோரின் பகுதி முழுவதற்கும்
  rationale: נָפָה என்பது இங்கு நிர்வாகப் பகுதி அல்லது மாவட்டத்தைக் குறிக்கிறது; ‘உயரம்’ என்பது இச்சூழலில் பொருந்தாது. כָּל என்பதன் முழுமையையும் ‘முழுவதற்கும்’ காக்கிறது.
- source_word: טָפַת
  choice: தாபத்
  rationale: எபிரேயப் பெண்பெயரின் ஒலிப்பெயர்ப்பு.
- source_word: הָיְתָה לּוֹ לְאִשָּׁה
  choice: அவனுடைய மனைவியாக இருந்தாள்
  rationale: சொற்றொடரின் திருமண உறவை இயல்பான நவீனத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
