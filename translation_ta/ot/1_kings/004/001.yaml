source:
  edition: WLC
  text: וַֽ/יְהִי֙ הַ/מֶּ֣לֶךְ שְׁלֹמֹ֔ה מֶ֖לֶךְ עַל כָּל יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/001.yaml
  text: King Solomon was king over all Israel.
translation:
  language: ta
  text: சாலொமோன் அரசர் இஸ்ரவேல் முழுவதற்கும் அரசராக இருந்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: இருந்தார்
  rationale: இங்கு היה என்பதன் தொடர்கதை வடிவம் புதிய பகுதியை அறிமுகப்படுத்துகிறது; தனியாக ‘நடந்தது’ என்று வலியுறுத்தவில்லை. தமிழில் இயல்பான வாக்கிய அமைப்பில் இறுதி வினையாக ‘இருந்தார்’ அதன் பயனைக் கொண்டுவருகிறது.
- source_word: הַמֶּלֶךְ
  choice: அரசர்
  rationale: வரையறைச் சுட்டியுடன் வரும் பெயர்ச்சொல் சாலொமோன் என்ற இயற்பெயருக்கு இணைநிலையான பட்டமாக உள்ளது; ‘சாலொமோன் அரசர்’ என்பது இயல்பான தமிழ்ப் பட்டப்பெயர் அமைப்பு.
- source_word: שְׁלֹמֹה
  choice: சாலொமோன்
  rationale: எபிரெய தனிப்பெயரின் தமிழில் நிலைபெற்ற வேதாகம வடிவம்.
- source_word: מֶלֶךְ
  choice: அரசராக இருந்தார்
  rationale: இரண்டாவது מֶלֶךְ சாலொமோனின் அரச நிலையைப் பயனிலையாகக் கூறுகிறது. ‘ஆட்சி செய்தார்’ என்பதைக் காட்டிலும் பெயர்ச்சொல் சார்ந்த மூல அமைப்பையும் மறுபடியும் வரும் ‘அரசர்’ என்ற வலியுறுத்தலையும் இது காக்கிறது.
- source_word: עַל
  choice: -க்கு
  rationale: அரசாட்சி சூழலில் עַל ஒரு மக்கள்மீதான அதிகாரத்தைக் குறிக்கிறது. ‘இஸ்ரவேல் முழுவதற்கும் அரசர்’ என்பது தமிழில் இயல்பாக அந்த ஆட்சியுறவை வெளிப்படுத்துகிறது.
- source_word: כָּל
  choice: முழுவதற்கும்
  rationale: சாலொமோனின் அரசாட்சிக்குள் இஸ்ரவேல் முழுமையும் இருந்ததைத் தெரிவிக்கும் முழுமைக் குறிப்பை இது காக்கிறது.
- source_word: יִשְׂרָאֵל
  choice: இஸ்ரவேல்
  rationale: தேசியப் பெயரின் தமிழில் பரவலாக நிலைபெற்ற வடிவம்.
theological_decisions:
- issue: இருமுறை வரும் מֶלֶךְ அமைப்பை மொழிபெயர்த்தல்
  choice: ‘சாலொமோன் அரசர் ... அரசராக இருந்தார்’ என்று இரு இடங்களிலும் அரசர் என்ற கருத்தைக் காத்தல்
  alternative: ‘சாலொமோன் இஸ்ரவேல் முழுவதையும் ஆட்சி செய்தார்’
  rationale: முதல் சொல் பட்டமாகவும் இரண்டாவது சொல் பயனிலையாகவும் வந்து சாலொமோனின் அரச நிலையை வலியுறுத்துகிறது. இரண்டையும் காப்பது ஒன்றுபட்ட இஸ்ரவேல் முழுவதின்மேலும் அவருக்கிருந்த அரசாட்சியை விளக்கவுரை சேர்க்காமல் பிரதிபலிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிதில் புரியும், கண்ணியமான உரைநடை. மூலத்தின் மறுபதிப்பு இயல்பாகக் காக்கப்பட்டுள்ளது; தேவையற்ற தொடக்க இணைப்புச் சொல் சேர்க்கப்படவில்லை.
