base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/013.yaml
  text: 'Ben-geber[a], in Ramoth-gilead—to him belonged the villages of Jair son of Manasseh, which are in Gilead; to him belonged the region of Argob[b], which is in Bashan: sixty large cities with walls and bronze bars.'
translation:
  language: ta
  text: கீலேயாத்திலுள்ள ராமோத்தில் பென்-கேபேர்[a] இருந்தான். மனாசேயின் மகன் யாயீரின் கீலேயாத்திலுள்ள குடியிருப்புகள் அவனுடைய பொறுப்பில் இருந்தன; பாசானிலுள்ள அர்கோபின் பிரதேசமும்[b], மதில்களும் வெண்கலக் குறுக்குக்கம்பிகளும் கொண்ட அறுபது பெரிய நகரங்களும் அவனுடைய பொறுப்பில் இருந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கேபேரின் மகன்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அர்கோபின் மாவட்டம்” அல்லது “அர்கோபின் நிலப்பகுதி.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן גֶּבֶר
  choice: பென்-கேபேர்
  rationale: நிர்வாக அதிகாரிகளின் பட்டியலில் இது ஒரு பெயரைப் போலச் செயல்படுகிறது; ஒலிபெயர்ப்பு அந்தப் பயன்பாட்டைப் பாதுகாக்கிறது. இதை ‘கேபேரின் மகன்’ என்றும் புரிந்துகொள்ள வாய்ப்புள்ளதால் அடிக்குறிப்பில் மாற்று தரப்பட்டுள்ளது.
- source_word: בְּרָמֹת גִּלְעָד
  choice: கீலேயாத்திலுள்ள ராமோத்தில்
  rationale: ב இங்கு இடத்தைக் குறிக்கிறது; இரண்டு இடப்பெயர்களுக்கிடையிலான உறவை இயல்பான தமிழில் தெளிவாக்குகிறது.
- source_word: לֹו
  choice: அவனுடைய பொறுப்பில் இருந்தன / இருந்தது
  rationale: நிர்வாகப் பட்டியலின் சூழலில் உடைமையை மட்டும் அல்லாமல் ஒதுக்கப்பட்ட அதிகார எல்லையையும் குறிக்கிறது; இயல்பான தமிழில் நிர்வாகப் பொறுப்பை வெளிப்படுத்துகிறது.
- source_word: חַוֺּת יָאִיר
  choice: யாயீரின் குடியிருப்புகள்
  rationale: חַוֺּת என்பது கிராமங்கள் அல்லது கூடாரக் குடியிருப்புகளைக் குறிக்கலாம். ‘குடியிருப்புகள்’ என்பது அதன் பரப்பைச் சுருக்காமல் நவீன வாசகருக்குப் புரியும் பொதுச் சொல்.
- source_word: חֶבֶל אַרְגֹּב
  choice: அர்கோபின் பிரதேசம்
  rationale: חֶבֶל இங்கு அளவிடப்பட்ட நிலப்பகுதி, மாவட்டம் அல்லது பிரதேசத்தைக் குறிக்கிறது; ‘பிரதேசம்’ இயல்பாகவும் போதிய பரப்புடனும் உள்ளது.
- source_word: שִׁשִּׁים עָרִים גְּדֹלוֹת
  choice: அறுபது பெரிய நகரங்கள்
  rationale: גְּדֹלוֹת என்பதன் அளவு அல்லது முக்கியத்துவ நுணுக்கத்தைத் தீர்மானிக்காமல் ‘பெரிய’ பாதுகாக்கிறது.
- source_word: חוֹמָה וּבְרִיחַ נְחֹשֶׁת
  choice: மதில்களும் வெண்கலத் தாழ்ப்பாள்களும் கொண்ட
  rationale: בְרִיחַ என்பது வாயில் அல்ல, கதவுகளைப் பாதுகாக்கும் தாழ்ப்பாள் அல்லது குறுக்குக் கம்பி. நகரங்களின் அரணமைப்பைத் தெளிவாகக் காட்டுகிறது.
