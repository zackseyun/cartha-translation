translation_notes:
  register: நவீன நிலையான தமிழில், நிர்வாகப் பட்டியலுக்கேற்ற கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் இருமுறை வரும் לֹו அமைப்பு ‘அவனுடைய பொறுப்பில்’ என்று மீட்டுரைக்கப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
