    issue: The added words “அவனுடைய பொறுப்பில் இருந்தன” are not explicit in the Hebrew text of this verse.
    rationale: They are inferable from the larger list of Solomon's officials, but this verse itself presents an elliptical entry. Removing the addition preserves the source form and avoids making the contextual inference part of the translated text.
