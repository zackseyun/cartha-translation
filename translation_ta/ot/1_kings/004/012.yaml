base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/012.yaml
  text: 'Baana son of Ahilud: Taanach and Megiddo[a], and all Beth-shean, which is beside Zarethan below Jezreel, from Beth-shean to Abel-meholah, as far as beyond Jokmeam.'
translation:
  language: ta
  text: 'அகிலூதின் மகன் பானா: தானாக், மெகிதோ, யெஸ்ரயேலுக்குக் கீழே, சாரேத்தானுக்கு அருகிலுள்ள பெத்-செயானின் பகுதி முழுவதும்—பெத்-செயானிலிருந்து ஆபேல்-மெகொலா வரையிலும், யொக்மெயாமுக்கு அப்பால் வரையிலும்[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யொக்மெயாமுக்கு அப்பாலுள்ள பகுதி வரையிலும்.” எபிரெய மொழியிலுள்ள இந்த எல்லைக் கூற்று சுருக்கமாகவும் சற்றுக் கடினமாகவும் உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּֽעֲנָא֙ בֶּן אֲחִיל֔וּד
  choice: அகிலூதின் மகன் பானா
  rationale: தனிநபர் பெயர்கள் எபிரெய ஒலிப்புக்கு அண்மையாகத் தமிழில் எழுத்துப்பெயர்க்கப்பட்டன; בַּעֲנָא என்பதில் இறுதி மெய்யொலி இல்லாததால் ‘பானா’ என வழங்கப்பட்டது.
- source_word: תַּעְנַךְ וּמְגִדּוֹ
  choice: தானாக், மெகிதோ
  rationale: இடப்பெயர்கள் எபிரெய வடிவங்களை அடிப்படையாகக் கொண்டு தமிழில் இயல்பாக எழுத்துப்பெயர்க்கப்பட்டன.
- source_word: וְכָל בֵּית שְׁאָן
  choice: பெத்-செயானின் பகுதி முழுவதும்
  rationale: כָל உடன் வரும் இடப்பெயர் இங்கு நகரத்தை மட்டும் அல்லாமல் அதனுடன் தொடர்புடைய முழு நிர்வாகப் பகுதியையும் குறிக்கலாம்; தமிழில் அந்த நிலப்பரப்பு உணர்வைத் தெளிவாக்க ‘பகுதி முழுவதும்’ பயன்படுத்தப்பட்டது.
- source_word: אֲשֶׁר אֵצֶל צָרְתַנָה
  choice: சாரேத்தானுக்கு அருகிலுள்ள
  rationale: אֵצֶל என்பது ‘அருகில்/பக்கத்தில்’ என்ற இடத்தொடர்பைக் குறிக்கிறது; தூரத்தை மிகத் துல்லியமாக நிர்ணயிக்காமல் ‘அருகிலுள்ள’ என மொழிபெயர்க்கப்பட்டது.
- source_word: מִתַּחַת לְיִזְרְעֶאל
  choice: யெஸ்ரயேலுக்குக் கீழே
  rationale: இது தாழ்வான நிலப்பகுதியைக் குறிக்கும் நிலவியல் சொல்லாக்கமாக இருக்கலாம். ‘தெற்கே’ என்று விளக்கமாக மாற்றாமல் மூலத்தின் உயர்நிலை சார்ந்த படிமம் பாதுகாக்கப்பட்டது.
- source_word: מִבֵּית שְׁאָן עַד אָבֵל מְחוֹלָה
  choice: பெத்-செயானிலிருந்து ஆபேல்-மெகொலா வரையிலும்
  rationale: מִן...עַד என்ற எல்லைச் சொல்லமைப்பு ‘இலிருந்து...வரை’ என நேரடியாகவும் இயல்பாகவும் வழங்கப்பட்டது.
- source_word: עַד מֵעֵבֶר לְיָקְמֳעָם
  choice: யொக்மெயாமுக்கு அப்பால் வரையிலும்
  rationale: எபிரெய எல்லைக் கூற்று சுருக்கமாகவும் பொருள் தீர்மானிக்கச் சற்றுக் கடினமாகவும் உள்ளது. ‘அப்பால் வரை’ என்பது அதன் இடவியல் தெளிவின்மையைத் தீர்க்காமல் பாதுகாக்கிறது; மென்மையான மாற்று அடிக்குறிப்பில் தரப்பட்டது.
