translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட நடையில் அமைக்கப்பட்டது. எபிரெய உரை அதிகாரியின் பெயரையும் நிலப்பகுதிகளையும் பட்டியலாக மட்டுமே தருகிறது; தமிழில் முழுமையான வாக்கியமாக இயங்க ‘அவனுடைய பொறுப்பில் இருந்தன’ என்பது சூழலிலிருந்து வெளிப்படையாகச் சேர்க்கப்பட்டது. இடப்பெயர்களுக்கு ஒரே மாதிரியான எபிரெய அடிப்படையிலான எழுத்துப்பெயர்ப்பு பின்பற்றப்பட்டது.
