  rationale: முந்தைய அதிகாரிகளின் வரிசையுடன் அகிமாஸையும் சேர்க்கும் வலியுறுத்தலைச் சுருக்கமாகப் பேணுகிறது.
- source_word: לָקַח ... לְאִשָּׁה
  choice: திருமணம் செய்துகொண்டான்
  rationale: சொல்லெழுத்தாக ‘மனைவியாக எடுத்துக்கொண்டான்’ என்றாலும், இது திருமணத்தைக் குறிக்கும் நிலையான எபிரெய மரபுத்தொடர்; நவீனத் தமிழில் பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: בָּשְׂמַת
  choice: பாஸ்மத்
  rationale: எபிரெய பெண்பெயரின் ஒலிப்பெயர்ப்பு.
- source_word: בַּת שְׁלֹמֹה
  choice: சாலொமோனின் மகளான
  rationale: தந்தை–மகள் உறவைத் தெளிவாகவும் இயல்பான தமிழ் அடைமொழித் தொடராகவும் தருகிறது.
