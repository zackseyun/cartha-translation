  text: Ahimaaz[a], in Naphtali; he too took Basemath, the daughter of Solomon[b], as a wife.
translation:
  language: ta
  text: நப்தலியில் அகிமாஸ்[a]; அவனும் சாலொமோனின் மகளான பாஸ்மத்தைத் திருமணம் செய்துகொண்டான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நப்தலியின் பொறுப்பாளராக” அல்லது “நப்தலிக்காக” என்றும் மொழிபெயர்க்கலாம்; இந்த நிர்வாக அதிகாரிகளின் பட்டியலில், எபிரெய முன்னிடைச்சொல் அகிமாஸுக்கு ஒதுக்கப்பட்ட நிர்வாகப் பகுதியைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லெழுத்தாக, “சாலொமோனின் மகளான பாஸ்மத்தை மனைவியாக எடுத்துக்கொண்டான்”; இது அவளைத் திருமணம் செய்துகொண்டான் என்று பொருள்படும் வழக்கமான எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
