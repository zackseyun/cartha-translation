base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/005.yaml
  text: Azariahu son of Nathan was over the governors[a], and Zabud son of Nathan was priest and the king’s friend.
translation:
  language: ta
  text: நாத்தானின் மகன் அசரியாஹூ மாகாண அதிகாரிகளை மேற்பார்வையிட்டான். நாத்தானின் மகன் சாபூத் ஆசாரியனாகவும்[a] அரசனின் நண்பனாகவும் இருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அரண்மனைச் சூழலில் இதை “முதன்மை அமைச்சர்” அல்லது “அரச ஆலோசகர்” என்றும் பொருள்கொள்ள வாய்ப்புள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲזַרְיָהוּ
  choice: அசரியாவு
  rationale: எபிரேயப் பெயரின் இறுதியில் உள்ள -யாஹு வடிவைத் தமிழில் நெருக்கமாக ஒலிபெயர்க்கிறது.
- source_word: בֶן
  choice: மகன்
  rationale: நிர்வாகப் பட்டியலில் உறவைக் குறிக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: עַל
  choice: பொறுப்பாக இருந்தான்
  rationale: இச்சூழலில் அதிகாரம் அல்லது மேற்பார்வையைக் குறிக்கும் எபிரேயச் சொல்லை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: הַנִּצָּבִים
  choice: மாகாண அதிகாரிகள்
  rationale: சாலொமோனின் நிர்வாக அமைப்பில் நியமிக்கப்பட்ட மாவட்ட அல்லது பிராந்திய அதிகாரிகளைக் குறிக்கும் பொருளைத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: זָבוּד
  choice: சாபூத்
  rationale: எபிரேயப் பெயரின் ஒலியமைப்பைப் பின்பற்றிய தமிழ் ஒலிபெயர்ப்பு.
- source_word: כֹּהֵן
  choice: ஆசாரியன்
  rationale: சொல்லின் முதன்மையான, நேரடியான பொருள்; அரண்மனைச் சூழலில் இருக்கக்கூடிய உயரதிகாரி என்ற மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: רֵעֶה הַמֶּלֶךְ
  choice: அரசனின் நண்பன்
  rationale: அரசனுக்கு நெருக்கமான நம்பிக்கைக்குரிய தோழர் அல்லது உடனிருப்பவர் என்ற கருத்தை நேரடியாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: அரச நிர்வாகச் சூழலில் כֹּהֵן என்பதன் பொருள்
  choice: முதன்மை உரையில் “ஆசாரியன்”
  alternative: “முதன்மை அமைச்சர்” அல்லது “அரச ஆலோசகர்”
  rationale: எபிரேயச் சொல்லின் வழக்கமான பொருள் “ஆசாரியன்.” இங்கு அரண்மனைப் பதவியைக் குறிக்கும் விரிவான பொருள் இருக்கக்கூடும் என்பதால் அதை முதன்மை உரையில் தீர்மானமாக்காமல் அடிக்குறிப்பில் குறிப்பிடுவது மூலத்தின் தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், நிர்வாகப் பட்டியலுக்கேற்ற சுருக்கமான மற்றும் கண்ணியமான நடை. இரு பதவிகளும் சாபூத்துக்கே உரியவை என்பதை “ஆசாரியனாகவும் … நண்பனாகவும்” என்ற இணை அமைப்பு தெளிவாக்குகிறது.
