  text: וְ/אֵ֥לֶּה הַ/שָּׂרִ֖ים אֲשֶׁר ל֑/וֹ עֲזַרְיָ֥הוּ בֶן צָד֖וֹק הַ/כֹּהֵֽן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/002.yaml
  text: 'And these were the officials who were his: Azariah son of Zadok[a], the priest[b];'
translation:
  language: ta
  text: 'அவனுடைய அதிகாரிகள்[a] இவர்களே: சாதோக்கின் மகன் அசரியா, ஆசாரியன்[b];'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தலைவர்கள்,’ ‘பிரபுக்கள்’ அல்லது ‘நிர்வாக அதிகாரிகள்’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் உயர்நிலை ஆட்சியாளர்களையோ நிர்வாகிகளையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயில், ‘சாதோக்கின் மகன் அசரியா, ஆசாரியன்’ என்று உள்ளது. ‘ஆசாரியன்’ என்பது சாதோக்கைக் குறிக்கிறது என்று சிலர் புரிந்துகொள்கிறார்கள்; வேறு சிலர் அதை அசரியாவின் பதவியாகப் புரிந்துகொள்கிறார்கள். மூலவாக்கியம் ‘பிரதான ஆசாரியன்’ என்று வெளிப்படையாகக் கூறவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: இவர்களே
  rationale: இணைப்புச் சொல்லுடன் வரும் சுட்டுப்பெயர், தொடர்ந்து வரும் பட்டியலை அறிமுகப்படுத்துகிறது. தமிழில் பட்டியல் தொடங்குவதை இயல்பாகக் காட்ட ‘இவர்களே’ என மொழிபெயர்க்கப்பட்டது.
- source_word: הַשָּׂרִים
  choice: அதிகாரிகள்
  rationale: இச்சொல் ஆட்சியாளர்கள், தலைவர்கள் அல்லது உயர்நிலை நிர்வாகிகளைக் குறிக்கலாம். அரச நிர்வாகப் பட்டியலான இச்சூழலில், மரபுவழி இளவரசர் என்ற பொருளைத் தேவையின்றி சேர்க்காமல் ‘அதிகாரிகள்’ என்பது பொருத்தமாக உள்ளது.
- source_word: אֲשֶׁר לוֹ
  choice: அவனுடைய
  rationale: இவர்கள் அரசனுடன் தொடர்புடைய, அவனது நிர்வாகத்தைச் சேர்ந்த அதிகாரிகள் என்பதை உடைமைத் தொடர்பின் வழியாகச் சுருக்கமாகக் காட்டுகிறது; அவர்களுடைய துல்லியமான பணியை ஊகித்துச் சேர்க்கவில்லை.
- source_word: עֲזַרְיָהוּ
  choice: அசரியா
  rationale: எபிரெய தனிப்பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: בֶן צָדוֹק
  choice: சாதோக்கின் மகன்
  rationale: தந்தை–மகன் உறவைக் குறிக்கும் எபிரெயக் கட்டமைப்பின் தெளிவான, இயல்பான தமிழ் வடிவம்.
- source_word: הַכֹּהֵן
  choice: ஆசாரியன்
  rationale: எபிரெயில் திட்டவட்டமாக ‘பிரதான ஆசாரியன்’ என்று இல்லை; ஒருமையில் குறிப்புச் சுட்டுடன் ‘ஆசாரியன்’ என்றே உள்ளது. ஆகவே பதவியை விரிவுபடுத்தாமல் மூலத்தின் சொல்வடிவம் காக்கப்பட்டது.
theological_decisions:
- issue: ‘ஆசாரியன்’ என்பது அசரியாவைக் குறிக்கிறதா, சாதோக்கைக் குறிக்கிறதா; மேலும் அது ‘பிரதான ஆசாரியன்’ என்ற பதவியைக் குறிக்கிறதா?
  choice: ‘சாதோக்கின் மகன் அசரியா, ஆசாரியன்’ என்று நேரடியாக மொழிபெயர்த்து, இலக்கணத் தொடர்பிலுள்ள தெளிவின்மையை அடிக்குறிப்பில் குறிப்பிடுதல்.
  alternative: ‘ஆசாரியனான சாதோக்கின் மகன் அசரியா’ அல்லது ‘பிரதான ஆசாரியனான சாதோக்கின் மகன் அசரியா’.
  rationale: எபிரெயத் தொடர் ‘ஆசாரியன்’ என்பதை அசரியாவின் பட்டமாகவும், சாதோக்கை அடையாளப்படுத்தும் இணைப்பாகவும் புரிந்துகொள்ள இடமளிக்கிறது. மேலும் மூலத்தில் ‘பிரதான ஆசாரியன்’ என்று வெளிப்படையாக இல்லை. எனவே மொழிபெயர்ப்பு எந்த ஒரு விளக்கத்தையும் இறுதியாகத் தீர்மானிப்பதில்லை.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க தமிழ் பயன்படுத்தப்பட்டுள்ளது. நிர்வாகச் சூழலுக்கு ‘அதிகாரிகள்’ என்றும், சமயப் பணியைச் சுட்ட ‘ஆசாரியன்’ என்றும் தேர்ந்தெடுக்கப்பட்டது. மூலத்திலுள்ள சுருக்கமும் ‘ஆசாரியன்’ என்பதன் தொடர்பு குறித்த தெளிவின்மையும் பாதுகாக்கப்பட்டுள்ளன.
