- source_word: עִדֹּא
  choice: இத்தோ
  rationale: தனிப்பட்ட பெயர்; எபிரெய உச்சரிப்பை அடிப்படையாகக் கொண்ட தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: מַחֲנָיְמָה
  choice: மகனாயீமில்
  rationale: இடப்பெயருடன் திசைநோக்குச் சுட்டும் ־ָה முடிவு உள்ளது; ஆனால் இந்நிர்வாகப் பட்டியலின் சூழலில் மகனாயீமை மையமாகக் கொண்ட பொறுப்புப் பகுதி அல்லது இருப்பிடம் என்பதே இயல்பான பொருள். உண்மையான வடிவியல் நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
