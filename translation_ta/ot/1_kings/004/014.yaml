    text: “மகனாயீம்” என்ற பெயருக்கு எபிரெயத்தில் திசைநோக்கைக் குறிக்கும் ஓர் இறுதி இணைக்கப்பட்டுள்ளது; சொல்லுக்கு சொல் மொழிபெயர்த்தால், “மகனாயீமை நோக்கி” என்று பொருள். ஆனால் இந்த நிர்வாகப் பட்டியலின் சூழலில், மகனாயீமில் அல்லது அதை மையமாகக் கொண்ட பகுதியில் என்பதே பெரும்பாலும் கருத்தாகும்.
