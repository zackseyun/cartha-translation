  text: Geber son of Uri[a], in the land of Gilead, the land of Sihon king of the Amorites and of Og king of Bashan; and he was the only governor who was in the land.
translation:
  language: ta
  text: ஊரியின் மகன் கேபேர், கீலேயாத் நாட்டில்—எமோரியரின் அரசனான சீகோனுக்கும் பாசானின் அரசனான ஓகுக்கும் உரிய நாடாகிய இடத்தில்—இருந்தான்; அந்த நாட்டில் இருந்த ஒரே ஆளுநர் அவனே.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்த நாட்டின்மேல் அதிகாரியாக இருந்த ஒரே ஆளுநர் அவனே.” எபிரெய உரை சொற்சொல்லாக “அந்த நாட்டில் இருந்த” என்று கூறுகிறது; சிலர் இதை நிர்வாக அதிகாரத்தைக் குறிக்கும் தொடராகப் புரிந்துகொள்கிறார்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֶּבֶר בֶּן אֻרִי
  choice: ஊரியின் மகன் கேபேர்
  rationale: தனிப்பெயர்கள் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளன; בֶּן எனும் தந்தைவழி உறவுமுறை இயல்பாக ‘மகன்’ என்று தரப்பட்டுள்ளது.
- source_word: בְּאֶרֶץ גִּלְעָד
  choice: கீலேயாத் நாட்டில்
  rationale: אֶרֶץ என்பதன் நிலப்பரப்பு சார்ந்த பொருளை ‘நாடு’ தெளிவாகத் தருகிறது; தொடரும் இணைவிளக்கத்துடனும் இயல்பாக அமைகிறது.
- source_word: אֶרֶץ סִיחוֹן מֶלֶךְ הָאֱמֹרִי וְעֹג מֶלֶךְ הַבָּשָׁן
  choice: எமோரியரின் ராஜாவான சீகோனின் நாடும் பாசானின் ராஜாவான ஓகின் நாடுமாகிய பகுதி
  rationale: கீலேயாத்தை சீகோன் மற்றும் ஓகின் நிலப்பகுதிகளால் மேலும் அடையாளப்படுத்தும் மூலமொழியின் இணைவிளக்கத் தொடர்பு பாதுகாக்கப்பட்டுள்ளது. வாசிப்பின் தெளிவுக்காக இறுதியில் ‘பகுதி’ சேர்க்கப்பட்டுள்ளது.
- source_word: נְצִיב
  choice: ஆளுநர்
  rationale: 1 இராஜாக்கள் 4-ன் நிர்வாகச் சூழலில், அரசனால் நியமிக்கப்பட்ட பிராந்திய அதிகாரியைச் சுட்டும் தெளிவான நவீனத் தமிழ்ச் சொல்.
- source_word: אֶחָד
  choice: ஒரே
  rationale: ஒருவர் மட்டுமே இருந்தார் என்னும் எண் சார்ந்த வலியுறுத்தலை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: אֲשֶׁר בָּאָרֶץ
  choice: அந்த நாட்டில் இருந்த
  rationale: בְּ என்பதன் நேரடியான இடப்பொருளைத் தக்கவைத்து, நிர்வாகப் பொருளான ‘நாட்டின்மேல் அதிகாரியாக இருந்த’ என்பதை முதன்மை உரையில் திணிக்காமல் விடுகிறது.
