  text: Ben-hesed[a], in Arubboth; Socoh and all the land of Hepher belonged to him.
translation:
  language: ta
  text: அருப்போத்தில் பென்-ஹெசேத்[a]; சோகோவும் ஹேப்பேர் நாடு முழுவதும் அவனுக்குரியவையாக இருந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இன்னும் நேரடியாக, “அருப்போத்தில் ஹெசேத்தின் மகன்; சோகோவும் ஹேப்பேர் நாடு முழுவதும் அவனுக்கு உரியவையாக இருந்தன.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן חֶסֶד
  choice: பென்-கேசேத்
  rationale: இந்த நிர்வாக அதிகாரிகளின் பட்டியலில் இச்சொற்றொடர் ஒருவரின் பெயராகச் செயல்படுகிறது. இருப்பினும், இதை ‘கேசேத்தின் மகன்’ என்றும் நேரடியாகப் புரிந்துகொள்ள முடிவதால் அந்த மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בָּאֲרֻבּוֹת
  choice: அருப்போத்தில்
  rationale: முன்னொட்டு ב இடத்தைக் குறிக்கிறது; இடப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டு, இயல்பான இடவேற்றுமை உருபு சேர்க்கப்பட்டுள்ளது.
- source_word: לֹו
  choice: அவனுக்கு ஒதுக்கப்பட்டிருந்தன
  rationale: இந்த மாவட்டப் பட்டியலின் சூழலில், இப்பகுதிகள் அந்த அதிகாரியின் நிர்வாகப் பொறுப்பில் இருந்ததைக் குறிக்கும் வகையில் இயல்பான தமிழில் வழங்கப்பட்டுள்ளது.
- source_word: שֹׂכֹה
  choice: சோகோ
  rationale: அதிகாரிக்கு ஒதுக்கப்பட்ட பிரதேசத்தின் ஒரு பகுதியாக வரும் இடப்பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְכָל אֶרֶץ חֵפֶר
  choice: கேப்பேர் நாட்டுப் பகுதி முழுவதும்
  rationale: אֶרֶץ இங்கு பூமியைக் குறிக்காமல் ஒரு நாட்டுப் பகுதி அல்லது பிரதேசத்தைக் குறிக்கிறது; כָל என்பதன் முழுமையும் பாதுகாக்கப்பட்டுள்ளது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், நிர்வாகப் பட்டியலுக்கேற்ற சுருக்கமான மற்றும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ஆள் மற்றும் இடப்பெயர்கள் ஒலிபெயர்க்கப்பட்டுள்ளன; בֶּן חֶסֶד என்பதிலுள்ள பெயர்/தந்தைவழிக் குறிப்பு ambiguity அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
