base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/003.yaml
  text: Elihoreph and Ahijah[a], the sons of Shisha, were secretaries[c][b]; Jehoshaphat the son of Ahilud was the recorder.
translation:
  language: ta
  text: ஷீஷாவின் மகன்களான எலிஹோரேப்பும் அகியாவும் அரசவைச் செயலாளர்களாக இருந்தார்கள்[a][b]; அகிலூதின் மகன் யெகோஷாபாத் அரசவைப் பதிவாளராக இருந்தார்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘ஷீஷாவின் மகன்கள்.’ இணை வசனமான 2 சாமுவேல் 8:17-ல் இதனுடன் தொடர்புடைய பெயர்வடிவம் ‘ஷவ்ஷா’ என்று உள்ளது.
    reason: alternative_reading
  - marker: b
    text: ‘அரசவைச் செயலாளர்கள்’ என்பதற்குப் பதிலாக ‘எழுத்தர்கள்’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் அரசவையின் எழுத்து மற்றும் ஆவணப் பணிகளைச் செய்த அலுவலர்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: ‘அரசவைப் பதிவாளர்’ என்பதற்கு ‘நினைவூட்டும் அலுவலர்’ அல்லது ‘வரலாற்றுப் பதிவாளர்’ என்றும் பொருள் கொள்ளலாம்; இவர் பதிவுகளைப் பேணி, காரியங்களை அரசனின் கவனத்திற்குக் கொண்டுவந்த அரசவை அலுவலர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלִיחֹרֶף
  choice: எலிகோரேப்பு
  rationale: எபிரெயத் தனிப்பெயரைத் தமிழில் ஒலிபெயர்த்துள்ளது.
- source_word: וַאֲחִיָּה
  choice: அகியா
  rationale: இணைப்பிடைச்சொல்லுடன் வரும் எபிரெயத் தனிப்பெயர்; தமிழில் இயல்பான ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: בְּנֵי שִׁישָׁא
  choice: சீசாவின் மகன்கள்
  rationale: மசோரா உரையின் பெயர் வடிவத்தைப் பின்பற்றி, உறவுமுறையை நேரடியாகத் தருகிறது.
- source_word: סֹפְרִים
  choice: அரசச் செயலர்கள்
  rationale: அரசவையில் எழுத்து மற்றும் ஆவணப் பணிகளை மேற்கொண்ட அதிகாரிகள் என்பதைக் நவீன தமிழில் தெளிவாகக் காட்டுகிறது; பின்னர் வரும் தனி அலுவலான பதிவாளருடன் குழப்பத்தையும் தவிர்க்கிறது.
- source_word: יְהוֹשָׁפָט
  choice: யோசபாத்
  rationale: எபிரெயத் தனிப்பெயரின் தமிழில் பரவலாக அறியப்பட்ட ஒலிபெயர்ப்பு.
- source_word: בֶּן אֲחִילוּד
  choice: அகிலூதின் மகன்
  rationale: தந்தை-மகன் உறவைக் குறிக்கும் எபிரெயக் கட்டமைப்பை இயல்பான தமிழில் தருகிறது.
- source_word: הַמַּזְכִּיר
  choice: அரசுப் பதிவாளர்
  rationale: அரசவையின் பதிவுகளைப் பேணியும் அரசனின் கவனத்திற்குரிய காரியங்களை முன்வைத்தும் வந்த அலுவலரைக் குறிக்கும் பதவிப்பெயர்; சூழலைத் தெளிவாக்க ‘அரசு’ சேர்க்கப்பட்டுள்ளது.
