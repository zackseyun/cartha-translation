lexical_decisions:
- source_word: בַּֽעֲנָא
  choice: பானா
  rationale: தனிப்பட்ட நபரின் பெயர்; எபிரெய உச்சரிப்பை நெருக்கமாகப் பின்பற்றி தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: בֶּן
  choice: மகன்
  rationale: வம்ச உறவைக் குறிக்கும் எபிரெய இணைப்புச் சொல்லுக்கான இயல்பான தமிழ் வடிவம்.
- source_word: חוּשָׁי
  choice: ஊசாய்
  rationale: தனிப்பட்ட நபரின் பெயர்; தொடக்க ח ஒலிக்கு தமிழில் துல்லியமான இணை இல்லாததால் வழக்கமான எளிய ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டது.
- source_word: בְּ/אָשֵׁר
  choice: ஆசேரில்
  rationale: בְ முன்னிடைச்சொல் இங்கு அதிகாரிக்கு ஒதுக்கப்பட்ட நிர்வாகப் பகுதியைக் குறிக்கிறது; எபிரெய வடிவத்திற்கு நெருக்கமாக ‘ஆசேரில்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: וּ/בְעָלֽוֹת
  choice: பெயாலோத்திலும்
  rationale: இரண்டாவது இடப்பெயராகப் புரிந்துகொள்ளப்பட்டது. இயல்பான தமிழுக்காக முந்தைய இடப்பெயரிலுள்ள இடவேற்றுமை உருபு இங்கும் சேர்க்கப்பட்டது; பெயரின் வாசிப்பிலுள்ள ஐயம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
