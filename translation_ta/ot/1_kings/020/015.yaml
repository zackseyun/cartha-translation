translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பும் கண்ணியமும் பேணப்பட்டுள்ளன. இராணுவச் சூழலை உணர்த்த ‘திரட்டினான்’ பயன்படுத்தப்பட்டுள்ளது. எபிரெயத்தின் இணைப்புரை அமைப்பைத் தக்கவைக்க ‘மக்கள் அனைவரையும், இஸ்ரவேலின் மகன்கள் அனைவரையும்’ என்று அமைக்கப்பட்டுள்ளது. வழங்கப்பட்ட ஆங்கில அடுக்கில் அடிக்குறி மாகாணத் தலைவர்களுக்குப் பின் இருந்தாலும், அதன் உள்ளடக்கம் כָּל בְּנֵי יִשְׂרָאֵל என்பதற்குரியது என்பதால் தமிழில் சரியான சொற்றொடருக்குப் பின் வைக்கப்பட்டுள்ளது.
