base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/015.yaml
  text: So he mustered the young men of the provincial commanders[a], and they were two hundred and thirty-two; and after them he mustered all the people, all the sons of Israel, seven thousand.
translation:
  language: ta
  text: அவன் மாகாணத் தலைவர்களின் இளைஞர்களைத் திரட்டினான்; அவர்கள் இருநூற்று முப்பத்திரண்டு பேர். அவர்களுக்குப் பிறகு, இஸ்ரவேலின் மகன்களாகிய மக்கள் அனைவரையும்[a] திரட்டினான்; அவர்கள் ஏழாயிரம் பேர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இஸ்ரவேலர் அனைவரையும்.’ எபிரெய மூலத்தில் ‘இஸ்ரவேலின் மகன்கள் அனைவரையும்’ என்று உள்ளது; இது இஸ்ரவேல் மக்களைக் குறிக்கும் ஆண்பால் குடும்பவழக்கான சொற்றொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְקֹד / פָּקַד
  choice: திரட்டினான்
  rationale: இராணுவச் சூழலில் படையினரை எண்ணிப் பணிக்காக ஒருங்கிணைப்பதை இச்சொல் குறிக்கிறது. தமிழில் ‘திரட்டினான்’ என்பது வெறும் எண்ணிக்கையிடுதலைவிட அந்த இராணுவச் செயல்பாட்டை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: נַעֲרֵי
  choice: இளைஞர்கள்
  rationale: மூலச்சொல் இளைஞர்கள், பணியாளர்கள் அல்லது உதவியாளர்கள் எனப் பொருள்படலாம். இங்கு சமூக அல்லது அலுவல் நிலையைத் தேவையின்றி குறிப்பாக்காமல் அதன் நேரடியான பொருளைத் தக்கவைக்கிறது.
- source_word: שָׂרֵי הַמְּדִינוֹת
  choice: மாகாணத் தலைவர்கள்
  rationale: שַׂר என்பது தலைவர் அல்லது அதிகாரி என்ற பரந்த பொருளையும், מְדִינָה என்பது நிர்வாக மாகாணத்தையும் குறிக்கிறது. ‘மாகாணத் தலைவர்கள்’ என்பது நிர்வாகப் பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது; அவர்களைப் படைத்தளபதிகள் என்று அளவுக்கு மீறிக் குறிப்பாக்கவில்லை.
- source_word: מָאתַיִם שְׁנַיִם וּשְׁלֹשִׁים
  choice: இருநூற்று முப்பத்திரண்டு பேர்
  rationale: மனிதர்களின் எண்ணிக்கையை நவீனத் தமிழில் இயல்பாகக் கூறும் வடிவம்.
- source_word: וְאַחֲרֵיהֶם
  choice: அவர்களுக்குப் பிறகு
  rationale: முதல் குழுவைத் தொடர்ந்து அடுத்த குழு திரட்டப்பட்ட வரிசையை மூலத்துக்கு நெருக்கமாகப் பாதுகாக்கிறது.
- source_word: כָּל הָעָם
  choice: மக்கள் அனைவரையும்
  rationale: இராணுவச் சூழல் இருந்தாலும், மூலத்தில் ‘மக்கள்’ என்றே உள்ளது; ‘படைவீரர்கள்’ என்று குறுக்காமல் அதையே தக்கவைக்கிறது.
- source_word: כָּל בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்கள் அனைவரையும்
  rationale: மூலத்தின் ஆண்பால் குடும்பவழக்கான ‘இஸ்ரவேலின் மகன்கள்’ என்ற வெளிப்பாட்டை வெளிப்படையாகத் தக்கவைக்கிறது. இயல்பான மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: שִׁבְעַת אֲלָפִים
  choice: ஏழாயிரம் பேர்
  rationale: இரண்டாவது குழுவின் எண்ணிக்கையைத் தெளிவான நவீனத் தமிழில் தருகிறது.
