  yaml_path: translation/ot/1_kings/020/016.yaml
  text: They went out at noon[a], while Ben-hadad was drinking himself drunk in the booths, he and the thirty-two kings who were helping him.
translation:
  language: ta
  text: அவர்கள் நண்பகலில் புறப்பட்டுச் சென்றார்கள். அப்போது பென்-அதாத் கூடாரங்களில்[a] குடித்துக்கொண்டு மதுபோதையில் இருந்தான்; அவனுடன், அவனுக்கு உதவி செய்த முப்பத்திரண்டு அரசர்களும் இருந்தனர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘குடில்களில்’ அல்லது ‘பந்தல்களில்.’ எபிரெயத்தில் நேரடியாக, ‘கூடாரங்களில்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: அவர்கள் புறப்பட்டுச் சென்றார்கள்
  rationale: יצא என்பதன் எளிய கதைநடைப் பொருள் ‘வெளியே செல்/புறப்படு.’ இங்குள்ள இராணுவச் சூழலில் ‘புறப்பட்டுச் சென்றார்கள்’ என்பது இயல்பாகவும் கூடுதல் கருத்தைச் சேர்க்காமலும் உள்ளது.
- source_word: בַּצָּהֳרָיִם
  choice: நண்பகலில்
  rationale: இச்சொல் நாளின் நடுப்பகுதியைக் குறிக்கிறது; ‘நண்பகலில்’ என்பது துல்லியமான நவீனத் தமிழ் வழக்கு.
- source_word: שֹׁתֶה שִׁכּוֹר
  choice: குடித்து மதுபோதையில் இருந்தார்கள்
  rationale: שֹׁתֶה தொடரும் குடிப்பையும் שִׁכּוֹר அதன் விளைவான போதை நிலையையும் காட்டுகிறது. பானம் எது என்று எபிரெயம் கூறாததால் ‘மது/திராட்சரசம்’ எனப் பொருளைச் சேர்க்கவில்லை.
- source_word: בַּסֻּכּוֹת
  choice: கூடாரங்களில்
  rationale: סֻכּוֹת தற்காலிகத் தங்குமிடங்கள் அல்லது கொட்டகை போன்ற கூடாரங்களைக் குறிக்கலாம். இராணுவ முகாம் சூழலில் ‘கூடாரங்கள்’ இயல்பானது; சொல் தரும் தற்காலிகத் தங்குமிடப் படிமத்தையும் காக்கிறது.
- source_word: הוּא וְהַמְּלָכִים שְׁלֹשִׁים וּשְׁנַיִם
  choice: பென்-அதாதும் ... முப்பத்திரண்டு அரசர்களும்
  rationale: எபிரெய உரை பென்-அதாதையும் முப்பத்திரண்டு அரசர்களையும் ஒரே கூட்டமாக இணைக்கிறது. தமிழில் ‘-உம் ... -உம்’ அமைப்பு இதைத் தெளிவாகத் தருகிறது.
- source_word: עֹזֵר אֹתוֹ
  choice: அவனுக்கு உதவிய
  rationale: עזר உதவி அல்லது ஆதரவைச் சுட்டுகிறது. அரசர்களை விவரிக்கும் தொடர்புச் சொல்லாக ‘அவனுக்கு உதவிய’ என்பது சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
