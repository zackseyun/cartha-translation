  text: וַ/יִּגַּ֞שׁ אִ֣ישׁ הָ/אֱלֹהִ֗ים וַ/יֹּאמֶר֮ אֶל מֶ֣לֶךְ יִשְׂרָאֵל֒ וַ/יֹּ֜אמֶר כֹּֽה אָמַ֣ר יְהוָ֗ה יַ֠עַן אֲשֶׁ֨ר אָמְר֤וּ אֲרָם֙ אֱלֹהֵ֤י הָרִים֙ יְהוָ֔ה וְ/לֹֽא אֱלֹהֵ֥י עֲמָקִ֖ים ה֑וּא וְ֠/נָתַתִּי אֶת כָּל הֶ/הָמ֨וֹן הַ/גָּ֤דוֹל הַ/זֶּה֙ בְּ/יָדֶ֔/ךָ וִֽ/ידַעְתֶּ֖ם כִּֽי אֲנִ֥י יְהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/028.yaml
  text: 'Then the man of God came near and said to the king of Israel[a], “Thus says Yahweh: Because Aram has said, ‘Yahweh is a god of the mountains, but he is not a god of the valleys,’ I will give all this great multitude into your hand[c][b], and you shall know that I am Yahweh.”'
translation:
  language: ta
  text: 'அப்போது தேவனுடைய மனிதன் அருகில் வந்து, இஸ்ரவேலின் அரசனிடம் கூறினார்: “யாவே இவ்வாறு கூறுகிறார்: ‘யாவே மலைகளின் தெய்வம்; பள்ளத்தாக்குகளின் தெய்வம் அல்ல’ என்று அராம்[a] கூறியதால், இந்தப் பெருந்திரள் முழுவதையும் உன் கையில் ஒப்புக்கொடுப்பேன்; அப்போது நான் யாவே என்பதை நீங்கள்[b] அறிந்துகொள்வீர்கள்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அராம்” என்பது எபிரெயப் பெயர்; சில பாரம்பரிய மொழிபெயர்ப்புகளில் “சிரியா” என்று வருகிறது.
    reason: alternative_reading
  - marker: b
    text: “நீங்கள்” என்பது பன்மை. செய்தி அரசனிடம் கூறப்பட்டாலும், இங்கு இஸ்ரவேல் மக்கள் கூட்டாகக் குறிக்கப்படுகின்றனர்.
    reason: grammatical_clarification
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  choice: தேவனுடைய மனிதர்
  rationale: எபிரெயச் சொற்றொடரின் திட்டவட்டத்தையும், தீர்க்கதரிசிக்குரிய அங்கீகரிக்கப்பட்ட அடையாளப் பெயரையும் காக்கிறது.
- source_word: וַיִּגַּשׁ
  choice: அருகில் வந்து
  rationale: נגשׁ என்பதன் நேரடியான அசைவு சார்ந்த பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: כֹּה אָמַר יְהוָה
  choice: யாவே கூறுவது இதுவே
  rationale: தீர்க்கதரிசனத் தூதுச் சூத்திரத்தை நவீன, இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பட்டத்தை மாற்றீடாக இடாமல், எபிரெய மூலத்திலுள்ள தனிப்பட்ட இறைப் பெயரை ஒலிபெயர்க்கிறது.
- source_word: יַעַן אֲשֶׁר
  choice: என்று ... கூறியதால்
  rationale: அடுத்து வரும் இறைச்செயலுக்கான காரணத்தைத் தெளிவாகவும் இயல்பாகவும் இணைக்கிறது.
- source_word: אֲרָם
  choice: அராம்
  rationale: பிற்காலப் புவியியல் பெயரான ‘சிரியா’ என்பதைப் பயன்படுத்தாமல், மூலப்பெயரை ஒலிபெயர்க்கிறது.
- source_word: אֱלֹהֵי הָרִים ... וְלֹא אֱלֹהֵי עֲמָקִים
  choice: மலைகளின் தெய்வம்; பள்ளத்தாக்குகளின் தெய்வம் அல்ல
  rationale: உயர்ந்த நிலப்பரப்புக்கும் தாழ்ந்த நிலப்பரப்புக்கும் இடையிலான எபிரெய எதிர்மறை ஒப்பீட்டைக் காக்கிறது; அராமியரின் உள்ளூர்மயமான தெய்வக் கருத்தாகவே மேற்கோளுக்குள் நிற்கிறது.
- source_word: כָּל הֶהָמוֹן הַגָּדוֹל הַזֶּה
  choice: இந்தப் பெருந்திரள் முழுவதையும்
  rationale: הָמוֹן என்பதன் ‘திரள்/பெருங்கூட்டம்’ என்ற பரந்த பொருளைக் காத்தபடியே போர்ச் சூழலுக்குப் பொருந்துகிறது.
- source_word: בְּיָדֶךָ
  choice: உன் கையில் ஒப்புக்கொடுப்பேன்
  rationale: வெற்றி அல்லது அதிகாரத்துக்குள் ஒப்படைப்பதைக் குறிக்கும் எபிரெய உருவகத்தைத் தமிழிலும் புரியத்தக்க வகையில் காக்கிறது.
- source_word: וִידַעְתֶּם
  choice: நீங்கள் அறிந்துகொள்வீர்கள்
  rationale: அரசனிடம் உரைக்கப்பட்டாலும், வினைச்சொல்லின் இரண்டாம் ஆண்பால் பன்மை வடிவம் இஸ்ரவேல் மக்களையும் உள்ளடக்குவதை வெளிப்படுத்துகிறது.
- source_word: כִּי אֲנִי יְהוָה
  choice: நான் யாவே என்பதை
  rationale: இறைவனின் தனிப்பட்ட பெயருடன் வரும் சுயஅடையாள அறிவிப்பை நேரடியாகக் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்ப்பது
  choice: யாவே
  alternative: ஆண்டவர் / யெகோவா
  rationale: மூலத்தில் வரும் தனிப்பட்ட உடன்படிக்கைப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: அராமியர் யாவேயை ஒரு குறிப்பிட்ட நிலப்பரப்புக்குரிய தெய்வமாகக் கருதும் கூற்று
  choice: “மலைகளின் தெய்வம்; பள்ளத்தாக்குகளின் தெய்வம் அல்ல” என்று மேற்கோளாக வழங்குதல்
  alternative: “மலைகளுக்குரிய ஒரு தெய்வம்; சமவெளிகளுக்குரிய தெய்வம் அல்ல”
  rationale: அவர்களுடைய தவறான, உள்ளூர்மயமான தெய்வக் கருத்தை மேற்கோள் அமைப்பு தெளிவாக்குகிறது; அதேவேளையில் ‘மலைகள்/பள்ளத்தாக்குகள்’ என்ற மூலத்தின் நிலவியல் எதிர்மறையைப் பாதுகாக்கிறது.
- issue: וִידַעְתֶּם என்பதன் எண்ணிக்கை
  choice: பன்மை ‘நீங்கள் அறிந்துகொள்வீர்கள்’
  alternative: ஒருமை ‘நீ அறிந்துகொள்வாய்’
  rationale: செய்தி அரசனிடம் சொல்லப்பட்டாலும், எபிரெய வினைச்சொல் பன்மையில் இருப்பதால் விளைவு இஸ்ரவேல் மக்களுக்கும் விரிகிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், பொதுவாசகர்களுக்குப் புரியக்கூடிய கண்ணியமான நடையில் அமைக்கப்பட்டது. தீர்க்கதரிசனத் தூதுச் சூத்திரம் இயல்பான தமிழில் தரப்பட்டுள்ளது; மூலத்தின் இறைப் பெயர், நிலவியல் எதிர்மறை, ஒருமை–பன்மை மாறுபாடு ஆகியவை பாதுகாக்கப்பட்டுள்ளன.
