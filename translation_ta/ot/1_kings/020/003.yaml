translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் அரச அறிவிப்புக்குரிய கண்ணியமான தொனியுடனும் மொழிபெயர்க்கப்பட்டது. הַטּוֹבִים என்பதன் சொல்வரிசை மற்றும் அது தரும் விளக்கநிலை முதன்மை உரையில் கோடுகளால் காட்டப்பட்டு, இயல்பான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
