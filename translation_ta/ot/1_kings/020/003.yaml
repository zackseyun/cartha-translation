  yaml_path: translation/ot/1_kings/020/003.yaml
  text: 'And he said to him[a], “Thus says Ben-hadad: Your silver and your gold are mine; your wives and your sons, the best, are mine.”'
translation:
  language: ta
  text: 'அவன் அவனிடம், “பென்-அதாத் கூறுவது இதுதான்: உன் வெள்ளியும் உன் தங்கமும் எனக்குரியவை; உன் மனைவிகளும் உன் சிறந்த மகன்களும் எனக்குரியவர்கள்” என்றான்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר לוֹ
  choice: அவன் அவனிடம் ... என்றான்
  rationale: எபிரெயக் கதைநடையின் வழக்கமான ‘அவன் அவனிடம் சொன்னான்’ என்ற அமைப்பைத் தமிழில் இயல்பாகவும் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: כֹּה אָמַר
  choice: கூறுவது இதுதான்
  rationale: தூதுவன் அறிவிக்கும் முறையான மேற்கோள் தொடக்கத்தை நவீனத் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: בֶּן הֲדַד
  choice: பென்-அதாத்
  rationale: தனிப்பெயரை எபிரெய உச்சரிப்புக்கு அண்மையாக ஒலிபெயர்க்கிறது.
- source_word: כַּסְפְּךָ וּזְהָבְךָ
  choice: உன் வெள்ளியும் உன் தங்கமும்
  rationale: பொதுவாக ‘செல்வம்’ என்று மாற்றாமல், மூலத்தில் குறிப்பிடப்பட்டுள்ள இரு மதிப்புப் பொருட்களையும் தனித்தனியாகப் பாதுகாக்கிறது.
- source_word: לִי הוּא
  choice: எனக்குரியவை
  rationale: இரண்டு பொருட்கள்மீதான உரிமைக் கோரிக்கையை இயல்பான தமிழ் பன்மையில் தெரிவிக்கிறது.
- source_word: וְנָשֶׁיךָ
  choice: உன் மனைவிகளும்
  rationale: குடும்ப உறவுச் சூழலில் נָשִׁים என்பது பொதுவாகப் பெண்களை அல்ல, மனைவிகளைக் குறிக்கிறது.
- source_word: וּבָנֶיךָ
  choice: உன் மகன்களும்
  rationale: ஆண்பால் சந்ததியைக் குறிக்கும் மூலச்சொல்லின் குறிப்பை ‘பிள்ளைகள்’ என்று பொதுமைப்படுத்தாமல் காக்கிறது.
- source_word: הַטּוֹבִים
  choice: சிறந்தவர்கள்
  rationale: இச்சூழலில் ‘நல்லவர்கள்’ என்ற ஒழுக்கப் பொருளைவிட, தேர்ந்த அல்லது மிக மதிப்புள்ளவர்களைக் குறிக்கும் பொருளைத் தருகிறது; மூலத்தின் பின்வரும் விளக்கநிலையும் பாதுகாக்கப்படுகிறது.
- source_word: לִי הֵם
  choice: எனக்குரியவர்கள்
  rationale: மனிதர்கள்மீதான உரிமைக் கோரிக்கையை மீண்டும் கூறும் எபிரெய இணைநிலையையும் வலியுறுத்தலையும் காக்கிறது.
