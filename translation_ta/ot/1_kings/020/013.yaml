  source_fidelity: 'மூலத்தின் பொருள் பெரும்பாலும் துல்லியமாகத் தரப்பட்டுள்ளது: பெயரிடப்படாத தீர்க்கதரிசி ஆகாபை அணுகுதல், யாவேயின் தூதுரைத்தல், பெருந்திரளை ஒப்படைத்தல், அதன் மூலம் யாவே என்பதை ஆகாப் அறிதல் ஆகியவை காக்கப்பட்டுள்ளன. ஆனால் தொடக்கத்தில் உள்ள “அப்போது” எபிரெய வாக்கியத்தில் இல்லாத காலத் தொடர்ச்சியைச் சேர்க்கிறது; இறுதி “அப்போது”வும் விளைவுத் தொடர்பைச் சற்றே அதிகப்படுத்துகிறது. மேலும் הֶהָמוֹן என்பதற்கு முதன்மை உரையில் “படைத்திரள்” எனத் தருவது போர்ச்சூழலுக்கு ஏற்றதாயினும், மூலத்தின் பொதுவான ‘பெருந்திரள்’ என்ற சொல்லைத் தேவையின்றி குறுக்குகிறது.'
