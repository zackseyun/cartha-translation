base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/013.yaml
  text: 'And behold[a], a certain prophet came near to Ahab king of Israel and said, “Thus says Yahweh: Have you seen all this great multitude? Behold, I am giving it into your hand today, and you shall know that I am Yahweh.”'
translation:
  language: ta
  text: 'இதோ, ஒரு தீர்க்கதரிசி இஸ்ரவேலின் அரசன் ஆகாபிடம் வந்து, “யாவே கூறுவது இதுவே: இந்த மாபெரும் பெருந்திரள் முழுவதையும் பார்த்தாயா?[a] இதோ, இன்று அதை உன் கையில் ஒப்புக்கொடுக்கிறேன்; நானே யாவே என்பதை நீ அறிந்துகொள்வாய்” என்றார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இந்த மாபெரும் படைத்திரள் முழுவதையும்” அல்லது “இந்தப் பெரும் கூட்டம் முழுவதையும்” என்றும் மொழிபெயர்க்கலாம். இங்குள்ள எபிரெயச் சொல் ஒரு பெருந்திரளையோ பெரும் படையையோ குறிக்கலாம்; இச்சூழலில் அது பகைவர் படைகளைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: அப்போது இதோ
  rationale: கதையில் திடீரென நிகழும் புதிய சம்பவத்தைக் குறிக்கும் உரையாடல் அடையாளத்தையும் ‘இதோ’ என்பதன் கவன ஈர்ப்பையும் காக்கிறது.
- source_word: נָבִיא אֶחָד
  choice: ஒரு தீர்க்கதரிசி
  rationale: குறிப்பிட்டுப் பெயர் சொல்லப்படாத ஒருவரை இயல்பான நவீன தமிழில் அறிமுகப்படுத்துகிறது; ‘ஒரு குறிப்பிட்ட தீர்க்கதரிசி’ என்பது இங்கு செயற்கையாக ஒலிக்கும்.
- source_word: נִגַּשׁ אֶל
  choice: அணுகி
  rationale: ஒருவரிடம் நெருங்கிச் செல்வதைக் குறிக்கும் எபிரெய வினையின் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: כֹּה אָמַר יְהוָה
  choice: யாவே கூறுவது இதுவே
  rationale: தீர்க்கதரிசியின் தூதர் அறிவிப்பு முறையை நவீன, கண்ணியமான தமிழில் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் நேரடியாக வரும் இறைப் பெயரை ஒரு பொதுப்பட்டமாக மாற்றாமல் ஒலிபெயர்க்கிறது.
- source_word: הֲרָאִיתָ
  choice: பார்த்தாயா?
  rationale: ஆகாபின் கண்முன் ஏற்கெனவே நிற்கும் பகைவர் கூட்டத்தைச் சுட்டும் நிறைவேற்ற வினையின் கேள்வி வலிமையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כָּל הֶהָמוֹן הַגָּדוֹל הַזֶּה
  choice: இந்த மாபெரும் படைத்திரள் முழுவதையும்
  rationale: הָמוֹן என்பதன் அடிப்படைப் பொருளான பெருந்திரளைப் பாதுகாத்தபடியே, உடனடி இராணுவச் சூழலைத் தமிழில் தெளிவாக்குகிறது; மாற்று விரிவான பொருள்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: הִנְנִי נֹתְנוֹ
  choice: இதோ, ... அதை ... ஒப்புக்கொடுக்கிறேன்
  rationale: הִנְנִי தரும் வலியுறுத்தலையும், நிகழப்போகும் உறுதியான தெய்வீகச் செயலின் உடனடித் தன்மையையும் காக்கிறது.
- source_word: בְיָדְךָ
  choice: உன் கையில்
  rationale: அதிகாரத்திற்குள் ஒப்படைத்தல் என்ற எபிரெய மொழிமரபைத் தமிழிலும் புரியத்தக்க உருவகமாகத் தக்கவைக்கிறது.
- source_word: וְיָדַעְתָּ כִּי אֲנִי יְהוָה
  choice: அப்போது நானே யாவே என்பதை நீ அறிந்துகொள்வாய்
  rationale: விடுதலையின் விளைவாக வரும் அறிதலை ‘அப்போது’ வெளிப்படுத்துகிறது; ‘நானே’ என்பது אֲנִי தரும் அடையாள வலியுறுத்தலைக் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் வரும் தனிப்பட்ட இறைப் பெயரைப் பொதுப்பட்டமாக மாற்றாமல் காக்கிறது; ஒரு தனிப்பட்ட கோட்பாட்டு விளக்கத்தைச் சேர்ப்பதில்லை.
- issue: וְיָדַעְתָּ כִּי אֲנִי יְהוָה என்ற அறிதல் வாய்பாட்டின் வலிமை
  choice: அப்போது நானே யாவே என்பதை நீ அறிந்துகொள்வாய்
  alternative: யாவேயின் இறையாண்மையை அனுபவபூர்வமாக ஏற்றுக்கொள்வாய்
  rationale: தெய்வீக வெற்றியின் மூலம் ஆகாப் அறிதலைப் பெறுவான் என்ற நேரடிப் பொருளைத் தருகிறது; அந்த அறிதல் முழுமையான விசுவாச ஒப்புதலா என்ற கேள்வியை மொழிபெயர்ப்பில் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியக்கூடிய கண்ணியமான நடையில் அமைக்கப்பட்டது. தீர்க்கதரிசன அறிவிப்பின் உயர்ந்த தொனிக்காக ‘யாவே கூறுவது இதுவே’ என்றும், எபிரெய உருவகத்தைப் பாதுகாக்க ‘உன் கையில்’ என்றும் பயன்படுத்தப்பட்டுள்ளது. அடிக்குறிப்பு குறியீடு அதனுடன் தொடர்புடைய ‘படைத்திரள்’ என்பதற்குப் பின் வைக்கப்பட்டுள்ளது.
