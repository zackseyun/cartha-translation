  verdict: revise
  source_fidelity: 'கருத்தில் மூலத்துக்கு நெருக்கமாக உள்ளது: பென்-அதாது செய்தியைக் கேட்கும்போது தானும் அரசர்களும் கூடாரங்களில் குடித்துக்கொண்டிருந்த நிலையும், நகருக்கு எதிரான படைநிலையெடுப்பும் தக்கவைக்கப்பட்டுள்ளன. ஆனால் கட்டளைக்கும் அதன் நிறைவேற்றத்திற்கும் பயன்படுத்தப்பட்டுள்ள “நிலைகளை எடுத்துக்கொள்ளுங்கள்” என்பது எபிரெயத்தின் சுருக்கமான இராணுவக் கட்டளையைத் தமிழில் இயல்பற்ற சொற்சொல் வடிவமாக்குகிறது.'
  naturalness: “நிலையெடுங்கள்” மற்றும் “நிலையெடுத்தார்கள்” என்பவை நவீனத் தரத் தமிழில் சுருக்கமாகவும் இயல்பான இராணுவச் சூழலுடனும் பொருந்துகின்றன. “அந்த அரசர்கள்” என்பதற்குப் பதிலாக “அரசர்கள்” போதுமானது; எபிரெயத்தில் சுட்டுப்பெயர் இல்லை.
  terminology: “செய்தி,” “கூடாரங்கள்,” மற்றும் “நகருக்கு எதிராக” ஆகியவை பொருத்தமானவை. இராணுவ நிலைநிறுத்தலைக் குறிக்க “நிலையெடு” என்பது தேவையற்ற முற்றுகை அல்லது தாக்குதல் விவரத்தைச் சேர்க்காமல் மூலத்தின் உட்குறிப்பைத் தெரிவிக்கிறது.
