  yaml_path: translation/ot/1_kings/020/012.yaml
  text: And when he heard this word[a], while he and the kings were drinking in the booths, he said to his servants[c][b], “Take your positions.” So they took their positions against the city.
translation:
  language: ta
  text: அவன் இந்தச் செய்தியைக் கேட்டபோது, அவனும் அரசர்களும் கூடாரங்களில் குடித்துக்கொண்டிருந்தார்கள். அவன் தன் பணியாளர்களிடம், “நிலையெடுங்கள்[a]!” என்றான். அவர்களும் நகருக்கு எதிராக நிலையெடுத்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயக் கட்டளை சொல்லுக்குச் சொல் “அமையுங்கள்!” அல்லது “வையுங்கள்!” என்பதாகும்; இது நகருக்கு எதிராகப் படைநிலை எடுக்கும்படி கொடுக்கப்பட்ட சுருக்கமான இராணுவக் கட்டளையாக இருக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: הַדָּבָר הַזֶּה
  choice: இந்தச் செய்தி
  rationale: דבר என்பது ‘சொல்,’ ‘காரியம்,’ அல்லது ‘செய்தி’ எனப் பொருள்படலாம். இங்கு ஆகாபின் பதில் பென்-அதாதுக்கு அறிவிக்கப்பட்டதைச் சுட்டுவதால், ‘இந்தச் செய்தி’ என்பது சூழலுக்கேற்ற இயல்பான தமிழ்.
- source_word: שֹׁתֶה הוּא וְהַמְּלָכִים
  choice: அவனும் அந்த அரசர்களும் ... குடித்துக்கொண்டிருந்தார்கள்
  rationale: எபிரெயப் பங்கேற்புவினை அச்சமயத்தில் தொடர்ந்துகொண்டிருந்த செயலைக் காட்டுகிறது; தமிழில் பன்மை அமைப்பு இயல்பாக உள்ளது.
- source_word: בַּסֻּכּוֹת
  choice: கூடாரங்களில்
  rationale: סֻכּוֹת என்பது தற்காலிகத் தங்குமிடங்கள் அல்லது பந்தல்கள் போன்றவற்றைக் குறிக்கிறது. அரசர்களின் படைமுகாம் சூழலில் ‘கூடாரங்கள்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: שִׂימוּ
  choice: நிலைகளை எடுத்துக்கொள்ளுங்கள்
  rationale: שׂים என்பதன் அடிப்படைப் பொருள் ‘வை/அமை’ என்பதாகும். இங்கு அது சுருக்கமான இராணுவக் கட்டளை; தாக்குதலின் விவரங்களைச் சேர்க்காமல் படையினர் தங்கள் நிலைகளில் அமர்வதை இத்தேர்வு உணர்த்துகிறது.
- source_word: וַיָּשִׂימוּ עַל הָעִיר
  choice: நகருக்கு எதிராகத் தங்கள் நிலைகளை எடுத்துக்கொண்டார்கள்
  rationale: எபிரெயத்தில் இச்சொற்றொடர் சுருக்கமாக உள்ளது. இராணுவச் சூழலில் עַל பகைமை நோக்கிய நிலைநிறுத்தலைக் குறிக்கிறது; தமிழ் மொழிபெயர்ப்பு அந்தச் சுருக்கத்தையும் எதிர்நிலையையும் காக்கிறது.
