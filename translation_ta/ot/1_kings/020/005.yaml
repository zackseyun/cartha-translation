  language: en
  yaml_path: translation/ot/1_kings/020/005.yaml
  text: 'The messengers returned and said[a], “Thus says Ben-hadad: ‘Though I sent to you, saying, “You shall give me your silver and your gold and your wives and your sons,”’”'
translation:
  language: ta
  text: 'தூதர்கள் திரும்பி வந்து சொன்னார்கள்: “பென்-அதாத் இவ்வாறு கூறுகிறார்: ‘நான் உன்னிடம், “உன் வெள்ளியையும் தங்கத்தையும் உன் மனைவிகளையும் மகன்களையும் எனக்குக் கொடுக்க வேண்டும்” என்று சொல்லியனுப்பினாலும்[a]—’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஏனெனில், நான் உன்னிடம் … என்று சொல்லியனுப்பினேன்.” எபிரெய மொழியிலுள்ள כִּי என்ற இடைச்சொல்லை பலவாறு மொழிபெயர்க்கலாம். இங்கு அடுத்த வசனத்தில் கோரிக்கை மேலும் தீவிரமடைவதைக் கருத்தில் கொண்டு, அது விட்டுக்கொடுப்பு உணர்வுடன் மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ הַמַּלְאָכִים
  choice: தூதர்கள் திரும்பிவந்து
  rationale: அரசியல் சூழலில் מַלְאָכִים என்பது மனிதத் தூதர்களைக் குறிக்கிறது. וַיָּשֻׁבוּ நிகழ்வின் அடுத்த கட்டமாக அவர்கள் திரும்பிவந்ததைச் சொல்கிறது.
- source_word: כֹּה אָמַר
  choice: கூறுவது இதுவே
  rationale: எபிரெயத் தூதர் அறிவிப்பு மரபுத்தொடரை இயல்பான, மரியாதையான நவீனத் தமிழில் தருகிறது.
- source_word: בֶּן הֲדַד
  choice: பென்-அதாத்
  rationale: எபிரெயப் பெயரின் ஒலிப்பைத் தமிழில் அணுக்கமாகப் பெயர்த்தெழுதுகிறது.
- source_word: כִּי שָׁלַחְתִּי אֵלֶיךָ
  choice: நான் முன்பு உன்னிடம் ... சொல்லியனுப்பியிருந்தாலும்
  rationale: כִּי என்பதைக் 6ஆம் வசனத்தில் நிறைவுபெறும் கோரிக்கையின் தீவிரப்படுத்தலுக்கேற்ப விட்டுக்கொடுப்பு நுணுக்கத்துடன் தருகிறது; שָׁלַחְתִּי என்பது முந்தைய செய்தியனுப்புதலைக் குறிக்கிறது.
- source_word: כַּסְפְּךָ וּזְהָבְךָ
  choice: உன் வெள்ளியையும் தங்கத்தையும்
  rationale: இரு மதிப்புமிக்க உலோகங்களையும் மூலத்தின் வரிசையிலும் பொருளிலும் காக்கிறது.
- source_word: וְנָשֶׁיךָ וּבָנֶיךָ
  choice: உன் மனைவிகளையும் மகன்களையும்
  rationale: இச்சூழலில் נָשִׁים என்பதற்கு ‘மனைவிகள்’ என்பதும் בָּנִים என்பதற்கு பாலினத் துல்லியமுள்ள ‘மகன்கள்’ என்பதும் பொருத்தம்.
- source_word: לִי תִתֵּן
  choice: எனக்குக் கொடுக்க வேண்டும்
  rationale: கோரிக்கையின் கட்டாய வலிமையை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: כִּי என்ற இடைச்சொல்லின் தொடர்பு
  choice: ‘இருந்தாலும்’ என்ற விட்டுக்கொடுப்பு பொருள்
  alternative: ‘ஏனெனில்’ அல்லது ‘நிச்சயமாக’
  rationale: 5ஆம் வசனத்தின் வாக்கியம் 6ஆம் வசனத்தில் வரும் மேலதிகக் கோரிக்கையை நோக்கித் தொடர்கிறது. எனவே விட்டுக்கொடுப்பு வாசிப்பு அந்தத் தீவிரப்படுத்தலைத் தெளிவாக்குகிறது; எனினும் எபிரெயச் சொல் பலவாறு பொருள்படக்கூடியதால் மாற்று அடிக்குறிப்பில் வைக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; கண்ணியமான வேதாகம நடையுடன் சாதாரண வாசகருக்கும் புரியும் சொற்கள் பயன்படுத்தப்பட்டுள்ளன. வசனம் அடுத்த வசனத்தில் இலக்கணரீதியாகத் தொடர்வதை இறுதி நீண்ட கோடு உணர்த்துகிறது.
