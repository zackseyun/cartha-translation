  text: וַ/יֵּצְא֗וּ נַעֲרֵ֛י שָׂרֵ֥י הַ/מְּדִינ֖וֹת בָּ/רִֽאשֹׁנָ֑ה וַ/יִּשְׁלַ֣ח בֶּן הֲדַ֗ד וַ/יַּגִּ֤ידוּ ל/וֹ֙ לֵ/אמֹ֔ר אֲנָשִׁ֕ים יָצְא֖וּ מִ/שֹּׁמְרֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/017.yaml
  text: Then the young men of the commanders of the provinces went out first[a], and Ben-hadad sent, and they reported to him, saying, “Men have come out from Samaria.”
translation:
  language: ta
  text: மாகாணத் தலைவர்களின் இளைஞர்கள் முதலில் புறப்பட்டுச் சென்றார்கள்; பென்-அதாத் அனுப்பினான்; அவர்கள் அவனிடம், “சமாரியாவிலிருந்து ஆட்கள் வெளியே வந்திருக்கிறார்கள்” என்று தெரிவித்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נַעֲרֵי
  choice: இளைஞர்கள்
  rationale: இந்தச் சொல் இளைஞர்கள், பணியாளர்கள் அல்லது உதவியாளர்கள் எனப் பொருள்படலாம். இங்கு அதன் அடிப்படைப் பொருளையும் இராணுவச் சூழலில் உள்ள தொடர்பையும் காக்க ‘இளைஞர்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: שָׂרֵי הַמְּדִינוֹת
  choice: மாகாணத் தலைவர்கள்
  rationale: שָׂרִים என்பது தலைவர்கள், அதிகாரிகள் அல்லது படைத்தலைவர்கள் எனவும், מְדִינוֹת என்பது நிர்வாக மாகாணங்கள் எனவும் பொருள்படும். எபிரெயக் கட்டமைப்புக்கு நெருக்கமாகவும் இயல்பாகவும் ‘மாகாணத் தலைவர்கள்’ பயன்படுத்தப்பட்டது.
- source_word: בָּרִאשֹׁנָה
  choice: முதலில்
  rationale: செயல் வரிசையில் இவர்களே முன்னதாகப் புறப்பட்டதைச் சுட்டுகிறது; ‘முதல் அணியாக’ என்ற கூடுதல் இராணுவ விளக்கத்தைத் தவிர்க்கிறது.
- source_word: וַיִּשְׁלַח
  choice: ஆட்களை அனுப்பினான்
  rationale: எபிரெயில் ‘அனுப்பினான்’ என்று மட்டும் இருந்து, அனுப்பப்பட்ட பொருள் வெளிப்படையாகக் கூறப்படவில்லை. அடுத்து அவர்கள் வந்து தகவல் தெரிவிப்பதால் மனிதர்களே அனுப்பப்பட்டனர் என்பது சூழலில் உட்கிடக்கிறது; ‘வேவுகாரர்களை’ என்பது அளவுக்கு மீறிய குறிப்பாக்கமாகும்.
- source_word: וַיַּגִּידוּ לוֹ לֵאמֹר
  choice: அவர்கள் அவனிடம் … என்று தெரிவித்தார்கள்
  rationale: நேரடிக் கூற்றை இயல்பான நவீன தமிழில் அறிமுகப்படுத்துவதோடு, נגד என்பதன் ‘தகவல் தெரிவித்தல்’ என்ற பொருளைக் காக்கிறது.
- source_word: אֲנָשִׁים
  choice: ஆட்கள்
  rationale: இங்கு நகரிலிருந்து வெளியே வந்த மனிதர்களை, பெரும்பாலும் போரில் ஈடுபடும் ஆண்களை, இயல்பான தமிழில் குறிக்கிறது.
- source_word: יָצְאוּ מִשֹּׁמְרוֹן
  choice: சமாரியாவிலிருந்து … புறப்பட்டு வந்திருக்கிறார்கள்
  rationale: நகரிலிருந்து வெளியேறிய நிறைவுற்ற செயலை அறிக்கையிடும் பார்வையில் காட்டுகிறது; ‘வந்திருக்கிறார்கள்’ என்பது தகவல் பெறுவோரின் நோக்குநிலைக்கு இயல்பானது.
- source_word: בֶּן הֲדַד
  choice: பென்-அதாத்
  rationale: எபிரெயப் பெயரின் ஒலிப்பெயர்ப்பு; தமிழ் வேதாகமப் பெயரிடும் மரபுக்கும் ஏற்ற வடிவம்.
