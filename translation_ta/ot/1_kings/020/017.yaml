translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான வரலாற்றுக் கதைநடையில் அமைக்கப்பட்டது. மூலத்தின் தொடர்ச்சியான வாக்கிய அமைப்பு வாசிப்புத் தெளிவுக்காக மூன்று வாக்கியங்களாகப் பிரிக்கப்பட்டது; ‘அனுப்பினான்’ என்பதின் மறைந்த செயப்படுபொருள் அடிக்குறிப்புடன் மிகக் குறைந்த அளவில் வெளிப்படுத்தப்பட்டது.
