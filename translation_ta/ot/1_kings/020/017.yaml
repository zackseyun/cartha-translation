revisions:
- from: மாகாணத் தலைவர்களின் இளைஞர்கள் முதலில் புறப்பட்டுச் சென்றார்கள். பென்-அதாத் ஆட்களை அனுப்பினான்[a]. அவர்கள் அவனிடம், “சமாரியாவிலிருந்து ஆட்கள் புறப்பட்டு வந்திருக்கிறார்கள்” என்று தெரிவித்தார்கள்.
  to: மாகாணத் தலைவர்களின் இளைஞர்கள் முதலில் புறப்பட்டுச் சென்றார்கள்; பென்-அதாத் அனுப்பினான்; அவர்கள் அவனிடம், “சமாரியாவிலிருந்து ஆட்கள் வெளியே வந்திருக்கிறார்கள்” என்று தெரிவித்தார்கள்.
  rationale: The revision removes the supplied object “ஆட்களை” so that Ben-hadad’s action remains as underspecified in Tamil as it is in Hebrew. Consequently, the explanatory footnote is no longer needed. The final report is adjusted to a direct, idiomatic rendering of the completed emergence from Samaria.
