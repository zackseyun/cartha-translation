translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பும் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘போர்க்கவசம்’ என்பது மூலத்தில் வெளிப்படையாக இல்லாவிட்டாலும் போர்ச் சூழலால் உணர்த்தப்படும் பொருள்; அடிக்குறிப்பு மூலத்தின் சுருக்கமான சொல் அமைப்பைப் பதிவு செய்கிறது. அடிக்குறி அது விளக்கும் மேற்கோளுக்குப் பின் வைக்கப்பட்டுள்ளது.
