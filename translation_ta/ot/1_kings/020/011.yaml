base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/011.yaml
  text: And the king of Israel answered and said[a], “Tell him, ‘Let not the one who girds on his armor boast like the one who takes it off.’”
translation:
  language: ta
  text: 'இஸ்ரவேலின் அரசன் பதிலளித்துச் சொன்னான்: “அவனிடம் சொல்லுங்கள்: ‘போர்க்கவசத்தை அணிகிறவன், அதைக் கழற்றுகிறவனைப்போல் பெருமைபாராட்ட வேண்டாம்.’”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயில் சொல்லுக்குச் சொல்: “கட்டிக்கொள்கிறவன், அவிழ்க்கிறவனைப்போல் பெருமைபாராட்ட வேண்டாம்.” போருக்குத் தயாராகிறவன், வெற்றியுடன் போரை முடித்தவனைப்போல் முன்கூட்டியே பெருமைபாராட்டக் கூடாது என்பதே இப்பழமொழியின் கருத்து.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן מֶלֶךְ יִשְׂרָאֵל וַיֹּאמֶר
  choice: இஸ்ரவேலின் அரசன் மறுமொழியாக ... என்றான்
  rationale: எபிரெய உரையாடல் அறிமுகத்தில் வரும் ‘பதிலளித்து சொன்னான்’ என்ற இரட்டைச் சொற்றொடரின் பொருளை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: דַּבְּרוּ
  choice: அவனிடம் சொல்லுங்கள்
  rationale: இது பன்மை இரண்டாம் நபர் கட்டளை; சூழலில் அரசன் தூதர்களிடம் பென்-அதாதுக்குச் செய்தியைச் சொல்லும்படி கூறுகிறான். எபிரெயில் மறைந்துள்ள இலக்கைத் தமிழில் தெளிவாக்குகிறது.
- source_word: אַל יִתְהַלֵּל
  choice: பெருமைபாராட்ட வேண்டாம்
  rationale: தன்னைப் பற்றிப் பெருமை பேசுதல் என்ற Hitpael வினையின் பொருளையும் எதிர்மறை அறிவுறுத்தலையும் இயல்பாகக் காட்டுகிறது.
- source_word: חֹגֵר
  choice: போர்க்கவசத்தை அணிகிறவன்
  rationale: சொல்லுக்குச் சொல் பொருள் ‘கட்டிக்கொள்கிறவன்’; போர்ச் சூழலில் போருக்கான ஆயுதம் அல்லது கவசத்தை அணிவது உட்பொருளாக உள்ளது.
- source_word: כִּמְפַתֵּחַ
  choice: அதைக் கழற்றுகிறவனைப்போல்
  rationale: פתח இங்கு அவிழ்த்தல் அல்லது கழற்றுதல் என்னும் பொருள் தருகிறது; போருக்குப் பின் உபகரணத்தைக் கழற்றுபவனோடு உள்ள பழமொழிசார் எதிர்மறை ஒப்புமையைப் பாதுகாக்கிறது.
