  source_fidelity: மொத்தத்தில் எபிரெய மூலத்தின் அரசியல்-உடன்படிக்கைச் சூழல் நன்றாகப் பிரதிபலிக்கப்படுகிறது. ஆனால் இறுதி இரண்டு வினைகளும் மூலத்தில் தொடர்ச்சியான நிறைவேற்றச் செயல்களாக உள்ளன; ‘செய்துகொண்டு’ என்பது அவற்றை ஒரேநேரச் செயலாகக் காட்டக்கூடும். ஒப்பீட்டுத் தொடரில் ‘தனக்காக’ என்பது பொருளில் அனுமானிக்கப்படலாம்; ஆயினும் மூலத்தில் மறைமுகமாக உள்ள பொருளைத் தேவையின்றி வெளிப்படுத்தாமல் விடுவது பாதுகாப்பானது.
  naturalness: நடை நவீன தரத் தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது. ‘உடன்படிக்கை செய்துகொண்டு’ என்பதற்குப் பதிலாக இரண்டு முடிவுற்ற வினைகளைப் பயன்படுத்துவது கதைநடையை மேலும் இயல்பாக்கும்.
  terminology: ‘நகரங்கள்,’ ‘கைப்பற்றிய,’ ‘வீதிகள்,’ ‘உடன்படிக்கை,’ ‘விடுவிப்பேன்’ ஆகியவை பொருத்தமானவை. ‘வீதிகள்’ என்பதன் சாத்தியமான வணிக/நகர்ப்புறப் பகுதி நுணுக்கம் அடிக்குறிப்பில் சரியாகப் பாதுகாக்கப்பட்டுள்ளது. அரசியல் בְּרִית-க்கு ‘உடன்படிக்கை’ ஏற்றது.
  issues:
  - severity: low
    issue: ‘தனக்காக’ என்ற சொல் ஒப்பீட்டுத் தொடரில் வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது.
    rationale: சமாரியாவில் தந்தை ஏற்படுத்திய வீதிகள்/பகுதிகளே பொருளில் தொடர்கின்றன; ‘தனக்காக’ என்பது இணைச் சொற்றொடரிலிருந்து ஊகிக்கப்படலாம், ஆனால் எபிரெய ஒப்பீட்டுத் தொடரில் வெளிப்படையாக மீண்டும் இல்லை.
  - severity: low
    issue: ‘அவனுடன் உடன்படிக்கை செய்துகொண்டு, அவனைப் போகவிட்டான்’ என்ற இணைப்பு.
    rationale: וַיִּכְרָת ... וַיְשַׁלְּחֵהוּ இரண்டு அடுத்தடுத்த கதைவினைகள். ‘உடன்படிக்கை செய்தான்; அவனைப் போகவிட்டான்’ என்பது அந்தத் தொடர்ச்சியை நேரடியாகக் காட்டும்.
  revised_text: அவன் ஆகாபிடம், “என் தந்தை உன் தந்தையிடமிருந்து கைப்பற்றிய நகரங்களை நான் திருப்பித் தருவேன். என் தந்தை சமாரியாவில் ஏற்படுத்தியதுபோல, நீயும் தமஸ்குவில் உனக்காக வீதிகளை[a] ஏற்படுத்திக்கொள்ளலாம்” என்றான். அதற்கு ஆகாப், “நானோ, இந்த உடன்படிக்கையின்படி[b] உன்னை விடுவிப்பேன்” என்றான். பின்பு ஆகாப் அவனுடன் உடன்படிக்கை செய்தான்[c]; அவனைப் போகவிட்டான்.
  revised_footnotes:
  - marker: a
    text: ‘வீதிகள்’ என்பதற்கு ‘சந்தைப் பகுதிகள்’ அல்லது ‘குடியிருப்புப் பகுதிகள்’ என்றும் பொருள் கொள்ளலாம். எபிரெயச் சொல் நேரடியாக வீதிகள் அல்லது திறந்த வெளிகளைக் குறிக்கிறது; இங்கு உடன்படிக்கையால் வழங்கப்பட்ட வணிகப் பகுதிகளை அது குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உன்னுடன் உடன்படிக்கை செய்து உன்னை விடுவிப்பேன்.” எபிரெயச் சொற்றொடர் உடன்படிக்கையின் அடிப்படையில் விடுவிப்பதை அல்லது உடன்படிக்கை செய்து விடுவிப்பதைச் சுட்டலாம்.
    reason: alternative_reading
  - marker: c
    text: எபிரெயத்தில் நேரடியாக, “உடன்படிக்கையை வெட்டினான்.” இது கட்டுப்படுத்தும் உடன்படிக்கையை முறைப்படி செய்வதற்கான வழக்கமான எபிரெய மரபுத்தொடர்.
    reason: cultural_note
  revision_rationale: 'இரண்டு சிறிய திருத்தங்கள் மட்டுமே செய்யப்பட்டுள்ளன: ஒப்பீட்டில் மூலத்தில் வெளிப்படையாக இல்லாத ‘தனக்காக’ நீக்கப்பட்டுள்ளது; இறுதி இரு எபிரெய கதைவினைகளின் தொடர்ச்சியைத் தக்கவைக்க ‘செய்துகொண்டு’ என்பதற்குப் பதிலாக இரண்டு தனி வினைத் தொடர்கள் பயன்படுத்தப்பட்டுள்ளன. பேச்சாளர் மாற்றத்தை ‘அதற்கு ஆகாப்’ என்று வெளிப்படுத்துவது சூழல் தெளிவுக்கான பாதுகாப்பான தமிழாக்கமாகத் தக்கவைக்கப்பட்டுள்ளது.'
