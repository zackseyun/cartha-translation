base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/034.yaml
  text: Then he said to him[a], “The cities that my father took from your father I will restore, and you may establish streets for yourself in Damascus, as my father established them in Samaria.” And I, in the treaty[c][b], will let you go.” So he made a treaty with him and let him go.
translation:
  language: ta
  text: அவன் ஆகாபிடம், “என் தந்தை உன் தந்தையிடமிருந்து கைப்பற்றிய நகரங்களை நான் திருப்பித் தருவேன். என் தந்தை சமாரியாவில் ஏற்படுத்தியதுபோல, நீயும் தமஸ்குவில் உனக்காக வீதிகளை[a] ஏற்படுத்திக்கொள்ளலாம்” என்றான். அதற்கு ஆகாப், “நானோ, இந்த உடன்படிக்கையின்படி[b] உன்னை விடுவிப்பேன்” என்றான். பின்பு ஆகாப் அவனுடன் உடன்படிக்கை செய்தான்[c]; அவனைப் போகவிட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வீதிகள்’ என்பதற்கு ‘சந்தைப் பகுதிகள்’ அல்லது ‘குடியிருப்புப் பகுதிகள்’ என்றும் பொருள் கொள்ளலாம். எபிரெயச் சொல் நேரடியாக வீதிகள் அல்லது திறந்த வெளிகளைக் குறிக்கிறது; இங்கு உடன்படிக்கையால் வழங்கப்பட்ட வணிகப் பகுதிகளை அது குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உன்னுடன் உடன்படிக்கை செய்து உன்னை விடுவிப்பேன்.” எபிரெயச் சொற்றொடர் உடன்படிக்கையின் அடிப்படையில் விடுவிப்பதை அல்லது உடன்படிக்கை செய்து விடுவிப்பதைச் சுட்டலாம்.
    reason: alternative_reading
  - marker: c
    text: எபிரெயத்தில் நேரடியாக, “உடன்படிக்கையை வெட்டினான்.” இது கட்டுப்படுத்தும் உடன்படிக்கையை முறைப்படி செய்வதற்கான வழக்கமான எபிரெய மரபுத்தொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: הֶעָרִים
  choice: நகரங்கள்
  rationale: עִיר என்பது நகரம் அல்லது ஊரைக் குறிக்கலாம்; அரசர்களுக்கிடையிலான நிலப்பகுதி மீட்பு பற்றிய இச்சூழலில் ‘நகரங்கள்’ பொருத்தமானது.
- source_word: לָקַח ... אָשִׁיב
  choice: கைப்பற்றிய ... திருப்பித் தருவேன்
  rationale: போர் அல்லது அரசியல் அதிகாரத்தால் எடுத்துக்கொண்டதையும், அதன் உரிமையை மீண்டும் ஒப்படைப்பதையும் இந்தச் சொற்கள் குறிக்கின்றன.
- source_word: וְחוּצוֹת
  choice: வீதிகள்
  rationale: חוּצוֹת என்பதன் நேரடிப் பொருள் வீதிகள் அல்லது திறந்த வெளிகள். உடன்படிக்கைச் சூழலில் வணிகப் பகுதிகள் என்ற சிறப்புப் பொருள் இருக்கலாம் என்பதால் அது அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: תָּשִׂים לְךָ בְדַמֶּשֶׂק
  choice: தமஸ்குவில் உனக்காக ... ஏற்படுத்திக்கொள்ளலாம்
  rationale: שׂוּם என்பது அமைத்தல் அல்லது ஏற்படுத்துதல். இங்கு ஒரு நகரத்தில் அங்கீகரிக்கப்பட்ட வீதிகள் அல்லது பகுதிகளை நிறுவும் உரிமையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: כַּאֲשֶׁר שָׂם אָבִי בְּשֹׁמְרוֹן
  choice: என் தந்தை சமாரியாவில் தனக்காக ஏற்படுத்திக்கொண்டதுபோல
  rationale: முன்னர் சமாரியாவில் பெற்றிருந்த ஒத்த நகர்ப்புற உரிமையை ஒப்பீடு சுட்டுகிறது; தமிழில் இயல்பாக அமைய ‘தனக்காக’ வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது.
- source_word: בַּבְּרִית
  choice: இந்த உடன்படிக்கையின்படி
  rationale: בְּרִית இங்கு அரசர்களுக்கிடையிலான அரசியல் ஒப்பந்தம். ‘உடன்படிக்கை’ அதன் பரந்த சொற்பொருளைத் தக்கவைக்கிறது; வேற்றுமை உருபு ஒப்பந்தத்தின் அடிப்படையில் விடுவிப்பதைத் தெரிவிக்கிறது.
- source_word: אֲשַׁלְּחֶךָּ
  choice: உன்னை விடுவிப்பேன்
  rationale: சிறைப்பட்ட அல்லது அதிகாரத்தின் கீழிருந்த அரசனை ஒப்பந்தத்தின் பேரில் செல்ல அனுமதிப்பதே இங்கு கருத்து.
- source_word: וַיִּכְרָת לוֹ בְרִית
  choice: அவனுடன் உடன்படிக்கை செய்துகொண்டு
  rationale: כרת ברית என்ற எபிரெய மரபுத்தொடரின் பொருள் முறையாக ஓர் உடன்படிக்கையை ஏற்படுத்துதல்; சொல்லுக்குச் சொல் ‘வெட்டுதல்’ என மொழிபெயர்ப்பது தமிழில் தவறான பொருளுணர்வைத் தரும்.
- source_word: וַיְשַׁלְּחֵהוּ
  choice: அவனைப் போகவிட்டான்
  rationale: முன்னர் கூறப்பட்ட விடுதலை வாக்குறுதி நிறைவேற்றப்பட்டதை இயல்பான கதைநடையில் தெரிவிக்கிறது.
theological_decisions:
- issue: அரசியல் சூழலில் בְּרִית என்பதன் மொழிபெயர்ப்பு
  choice: உடன்படிக்கை
  alternative: ஒப்பந்தம்
  rationale: இது தெய்வத்துக்கும் மனிதருக்கும் இடையிலான உடன்படிக்கை அல்ல, அரசர்களுக்கிடையிலான அரசியல் உடன்பாடு. இருப்பினும் எபிரெயச் சொல்லின் பரந்த உடன்படிக்கைத் தொடர்பைத் தக்கவைக்க ‘உடன்படிக்கை’ பயன்படுத்தப்பட்டுள்ளது; அரசியல் தன்மை சூழலாலும் அடிக்குறிப்பாலும் தெளிவாகிறது.
- issue: וַאֲנִי தொடங்கும் பேச்சின் உரையாளர்
  choice: ஆகாபின் பதிலாக வெளிப்படையாகக் காட்டப்பட்டது
  alternative: உரையாளரின் பெயரைச் சேர்க்காமல் ‘நானோ’ என்று மட்டும் தொடர்தல்
  rationale: எபிரெயத்தில் உரையாளர் மாற்றம் நேரடி பேச்சின் வழியே மட்டும் உணர்த்தப்படுகிறது. முந்தைய சூழலில் விடுவிக்கும் அதிகாரம் ஆகாபுக்கே இருப்பதால், தமிழில் குழப்பம் தவிர்க்க அவரது பெயர் சேர்க்கப்பட்டது; உரையின் கருத்து மாற்றப்படவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. அரசியல்-தூதரகச் சூழலைத் தெளிவாக்க ‘கைப்பற்றிய,’ ‘உடன்படிக்கை,’ ‘விடுவிப்பேன்’ ஆகிய சொற்கள் தேர்ந்தெடுக்கப்பட்டன. மூலத்தில் திடீரென மாறும் பேச்சாளரை தமிழில் தெளிவுபடுத்த ஆகாபின் பெயர் சேர்க்கப்பட்டுள்ளது.
