  text: וַ/יִּשְׁלַ֤ח אֵלָי/ו֙ בֶּן הֲדַ֔ד וַ/יֹּ֕אמֶר כֹּֽה יַעֲשׂ֥וּ/ן לִ֛/י אֱלֹהִ֖ים וְ/כֹ֣ה יוֹסִ֑פוּ אִם יִשְׂפֹּק֙ עֲפַ֣ר שֹׁמְר֔וֹן לִ/שְׁעָלִ֕ים לְ/כָל הָ/עָ֖ם אֲשֶׁ֥ר בְּ/רַגְלָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/010.yaml
  text: Ben-hadad sent to him and said[a], “May the gods do so to me, and more also, if the dust of Samaria will be enough for handfuls for all the people who are at my feet.”
translation:
  language: ta
  text: பென்-அதாத் அவனுக்குச் செய்தி அனுப்பி, “தெய்வங்கள் எனக்கு இப்படியும் அதற்கும் மேலாகவும் செய்யட்டும்; சமாரியாவின் புழுதி என்னைப் பின்தொடரும் மக்கள் அனைவருக்கும் கைப்பிடி அளவு கிடைக்குமளவுக்குப் போதுமானதாக இருந்தால்!” என்று சொன்னான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில் நேரடியாக: “என் காலடியில் இருக்கும் மக்கள் அனைவருக்கும் கைப்பிடிகளுக்காகச் சமாரியாவின் புழுதி போதுமானதாக இருந்தால்.” ‘என் காலடியில் இருக்கும் மக்கள்’ என்பது அரசனுக்குக் கீழிருப்பவர்களைக் குறிக்கும் மரபுத்தொடர். சமாரியாவின் புழுதி, தன்னைப் பின்தொடரும் ஒவ்வொருவருக்கும் ஒரு கைப்பிடி அளவு கிடைக்குமளவுக்குக்கூடப் போதாது என்று பென்-அதாத் தற்பெருமையாகக் கூறுகிறான்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח אֵלָיו
  choice: அவனிடம் ஆள் அனுப்பி
  rationale: தூதரையோ செய்தியையோ அனுப்பியதாகச் சூழல் காட்டுகிறது; எபிரெயத்தில் வெளிப்படையாக இல்லாத குறிப்பிட்ட பொருளைச் சேர்க்காமல், இயல்பான தமிழில் தொடர்புச் செயலை வெளிப்படுத்துகிறது.
- source_word: בֶּן הֲדַד
  choice: பென்-அதாத்
  rationale: எபிரெயப் பெயரின் ஒலிபெயர்ப்பு; தமிழ் வேதாகமப் பெயர் மரபுக்கும் ஏற்றது.
- source_word: כֹּה יַעֲשׂוּן לִי אֱלֹהִים וְכֹה יוֹסִפוּ
  choice: தெய்வங்கள் எனக்கு இப்படியும் இதற்கு மேலும் செய்யட்டும்
  rationale: சாபத்துடன் கூடிய வழக்கமான ஆணைச் சூத்திரத்தின் வலிமையையும், புறஇன அரசன் பயன்படுத்தும் பன்மை வடிவத்தையும் காக்கிறது.
- source_word: אִם
  choice: …இருந்தால் … செய்யட்டும்
  rationale: ஆணைச் சூழலில் אִם அறிமுகப்படுத்தும் மறைமுகச் சாப நிபந்தனையைத் தமிழில் நிபந்தனை வாக்கியமாகவே காக்கிறது; வாக்கிய வரிசை இயல்புக்காக நிபந்தனை முதலில் அமைக்கப்பட்டுள்ளது.
- source_word: יִשְׂפֹּק
  choice: போதுமானதாக
  rationale: வினைச்சொல்லின் ‘போதுதல்’ என்ற அடிப்படைப் பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: עֲפַר שֹׁמְרוֹן
  choice: சமாரியாவின் புழுதி
  rationale: இணைப்புத் தொடரின் நேரடியான பொருளைத் தெளிவாகக் காக்கிறது.
- source_word: לִשְׁעָלִים
  choice: கைப்பிடியளவுகூட
  rationale: இங்கு சொல்லின் சூழல்சார் பொருள் கைகளின் குழிகள் அல்லது கைப்பிடிகள் என்பதாகும்; எண்ணற்ற படையினருக்கு தலா ஒரு கைப்பிடியும் கிடைக்காது என்ற மிகைப்படுத்தலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לְכָל הָעָם אֲשֶׁר בְּרַגְלָי
  choice: என்னைப் பின்தொடரும் மக்கள் அனைவருக்கும்
  rationale: ‘என் காலடியில் இருப்பவர்கள்’ என்ற எபிரெய மரபுத்தொடர் அரசனின் பரிவாரத்தையும் படையையும் குறிக்கிறது; பொருளைத் தெளிவாகக் கூறுகிறது, அதேவேளை ‘மக்கள்’ என்ற விரிந்த சொல்லை ‘படைவீரர்கள்’ எனச் சுருக்கவில்லை.
theological_decisions:
- issue: புறஇன அரசனின் ஆணையில் אֱלֹהִים என்பதன் பொருள்
  choice: தெய்வங்கள்
  alternative: தேவன்
  rationale: பேசுபவன் பென்-அதாத் என்பதாலும், வினையும் பெயரும் இங்கு பன்மைச் சூழலைக் காட்டுவதாலும், அவன் வழிபட்ட தெய்வங்களைக் குறிக்கும் பன்மை மொழிபெயர்ப்பு பொருத்தமானது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடை. ஆணையின் சாப வலிமை காக்கப்பட்டுள்ளது. ‘காலடியில்’ என்ற மூல மரபுத்தொடரின் சொற்பொருள் அடிக்குறிப்பில் தரப்பட்டு, முதன்மை உரையில் அதன் சூழல்சார் பொருள் தெளிவுபடுத்தப்பட்டுள்ளது.
