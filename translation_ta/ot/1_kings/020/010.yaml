  source_fidelity: 'முதன்மை உரையின் பொருள் பெரும்பாலும் எபிரெய மூலத்துக்கு உண்மையாக உள்ளது: புறஇன அரசனின் ஆணைச் சாபம், ‘தெய்வங்கள்’ என்ற பன்மை, சமாரியாவின் புழுதியைக் குறித்த தற்பெருமை, மற்றும் அரசனின் கீழிருப்பவர்களைக் குறிக்கும் மரபுத்தொடர் ஆகியவை காக்கப்பட்டுள்ளன. ஆனால் ‘ஆள் அனுப்பி’ என்பது மூலத்தில் குறிப்பிடப்படாத மனிதத் தூதரைத் தெளிவாகச் சேர்க்கிறது; தொடர்புச் செய்தி அனுப்பியதாகச் சொல்வது குறைவான குறிப்பாக்கம். மேலும் ‘கைப்பிடியளவுகூடப் போதுமானதாக’ என்பதற்குப் பதிலாக ஒவ்வொருவருக்கும் கைப்பிடி அளவு வழங்கும் அளவுக்குப் போதாது என்ற உறவைத் தெளிவாகக் கூறுதல் மூலத்தின் மிகைப்படுத்தலைத் துல்லியமாகக் காட்டும்.'
