  text: And he sent messengers into the city[a], to Ahab king of Israel.
translation:
  language: ta
  text: அவன் தூதர்களை நகரத்துக்கு, இஸ்ரவேலின் அரசன் ஆகாபிடம் அனுப்பினான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நகரத்துக்குள்.” எபிரெயச் சொல்லின் இறுதியில் உள்ள திசைச்சுட்டு இறுதி நகரை நோக்கிய நகர்வைக் குறிக்கிறது; அது நகருக்குள் நுழைவதைத் தனியாகத் தெளிவுபடுத்துவதில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: அனுப்பினான்
  rationale: வழக்கமான எபிரெயக் கதைநடைத் தொடர்வினை; தமிழில் இறந்தகால வினையாக இயல்பாகக் கொடுக்கப்பட்டுள்ளது. தொடக்க ‘וַ’ தனியே ‘மேலும்’ என்று மொழிபெயர்க்கப்படாமல், தொடர்ச்சியான கதைநடையில் இயல்பாகப் பிரதிபலிக்கிறது.
- source_word: מַלְאָכִים
  choice: தூதர்களை
  rationale: அரசியல் மற்றும் போர்ச் சூழலில் இச்சொல் செய்தி கொண்டு செல்லும் மனிதத் தூதர்களைக் குறிக்கிறது; வானதூதர்களை அல்ல.
- source_word: אֶל אַחְאָב
  choice: ஆகாபிடம்
  rationale: அனுப்பப்பட்ட தூதர்கள் சென்றடைய வேண்டிய நபரை אֶל குறிக்கிறது; தமிழில் நபரை நோக்கிய இலக்கை ‘-இடம்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: இஸ்ரவேலின் அரசன்
  rationale: ஆகாபின் அரச பதவியைச் சுட்டும் எபிரெய இணைப்புத் தொடரைத் தெளிவான நவீன தமிழில் வழங்குகிறது.
- source_word: הָעִירָה
  choice: நகரத்துக்குள்
  rationale: ‘நகர்’ என்ற சொல்லோடு சேர்ந்த திசைசுட்டும் இறுதி, நகரை நோக்கிய நகர்வைக் குறிக்கிறது. சூழலில் தூதர்கள் நகருக்குள் சென்று ஆகாபை அடைவதால் ‘நகரத்துக்குள்’ இயல்பான முதன்மை மொழிபெயர்ப்பு; ‘நகரத்துக்கு’ என்ற விரிவான பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions: []
translation_notes:
  register: நவீன பொதுத்தமிழில், சுருக்கமானதும் கண்ணியமானதும் ஆன கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயச் சொல்வரிசையை அப்படியே பின்பற்றாமல், ஆகாப் இலக்கு நபர் என்பதையும் நகரம் பயண இலக்கு என்பதையும் தெளிவாக வைத்திருக்கத் தமிழ் சொல்வரிசை அமைக்கப்பட்டுள்ளது.
