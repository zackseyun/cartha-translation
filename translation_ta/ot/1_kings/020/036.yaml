  text: וַ/יֹּ֣אמֶר ל֗/וֹ יַ֚עַן אֲשֶׁ֤ר לֹֽא שָׁמַ֨עְתָּ֙ בְּ/ק֣וֹל יְהוָ֔ה הִנְּ/ךָ֤ הוֹלֵךְ֙ מֵֽ/אִתִּ֔/י וְ/הִכְּ/ךָ֖ הָ/אַרְיֵ֑ה וַ/יֵּ֨לֶךְ֙ מֵֽ/אֶצְל֔/וֹ וַ/יִּמְצָאֵ֥/הוּ הָ/אַרְיֵ֖ה וַ/יַּכֵּֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/036.yaml
  text: Then he said to him, “Because you have not listened to the voice of the LORD, look, when you depart from me, the lion will strike you down.” And when he departed from him, the lion found him and struck him down.
translation:
  language: ta
  text: அப்போது அவன் அவனிடம், “நீ ஆண்டவரின் குரலுக்குச் செவிகொடுக்காததால், இதோ, நீ என்னை விட்டு புறப்படும்போது, சிங்கம் உன்னைத் தாக்கும்” என்றான். அவன் அவனை விட்டு புறப்பட்டபோது, சிங்கம் அவனைக் கண்டு, அவனைத் தாக்கியது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁמַעְתָּ בְּקוֹל
  choice: குரலுக்குச் செவிகொடுக்காததால்
  rationale: எபிரேயச் சொற்றொடர் வெறுமனே கேட்பதை அல்ல, சொல்லுக்குக் கீழ்ப்படிவதையும் குறிக்கிறது; ‘செவிகொடு’ இரு நுணுக்கங்களையும் இயல்பாகத் தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: ஆண்டவர்
  rationale: தமிழ் வேதாகம நடைமுறையில் திருநாமத்தைச் சுட்டும் மரியாதையான, பரவலாகப் புரியக்கூடிய வடிவம்.
- source_word: הִנְּךָ
  choice: இதோ
  rationale: வரவிருக்கும் தீர்ப்பின்மீது கவனத்தை ஈர்க்கும் மூலமொழியின் சுட்டும் வலிமையைப் பாதுகாக்கிறது.
- source_word: הִכְּךָ / וַיַּכֵּהוּ
  choice: அடித்துக் கொல்லும் / அடித்துக் கொன்றது
  rationale: נכה தனியாக ‘அடி/தாக்கு’ எனினும், இச்சூழலில் சிங்கத்தின் தாக்குதல் மரணத்தை விளைவித்தது என்பது அடுத்த கதைத்தொடரால் தெளிவாகிறது; தமிழில் நிகழ்வின் பொருளை இயல்பாகக் கூறுகிறது.
- source_word: הָאַרְיֵה
  choice: சிங்கம்
  rationale: குறிப்பிட்ட சிங்கத்தைச் சுட்டும் எபிரேய வடிவை, தமிழில் இயல்பான பெயர்ச்சொல் பயன்பாட்டால் அளிக்கிறது.
theological_decisions:
- issue: தீர்ப்பு ஆண்டவரின் குரலுக்குச் செவிகொடுக்காததன் விளைவாகக் கூறப்படுதல்
  choice: காரணத் தொடர்பை நேரடியாகப் பாதுகாத்தல்
  alternative: இது வெறும் முன்னறிவிப்பு என்று மங்கலாக்குதல்
  rationale: יַעַן אֲשֶׁר கட்டமைப்பு தெளிவாக ‘...ஆதலால்/காரணமாக’ எனத் தீர்ப்புக்கான காரணத்தை அளிக்கிறது.
- issue: தீர்க்கதரிசன அறிவிப்பின் உறுதி
  choice: “சிங்கம் உன்னை அடித்துக் கொல்லும்”
  alternative: “சிங்கம் உன்னைத் தாக்கக்கூடும்”
  rationale: எபிரேய வினை வடிவம் சாத்தியத்தை அல்ல, உறுதியான வரவிருக்கும் நிகழ்வை அறிவிக்கிறது.
translation_notes:
  register: நவீன தரத்தமிழில், கண்ணியமான கதைநடை. எபிரேயத்தின் மீளுரைப்பையும் காரண–விளைவு அமைப்பையும் காக்கிறது; தெளிவுக்காக தேவையற்ற விளக்கங்கள் சேர்க்கப்படவில்லை.
