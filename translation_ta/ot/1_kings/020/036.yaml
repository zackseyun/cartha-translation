revisions:
- from: அப்போது அவன் அவனிடம், “நீ ஆண்டவரின் குரலுக்குச் செவிகொடுக்காததால், இதோ, நீ என்னைவிட்டுப் போனதும் சிங்கம் உன்னை அடித்துக் கொல்லும்” என்றான். அவன் அவனைவிட்டுப் போனதும், சிங்கம் அவனைக் கண்டு, அடித்துக் கொன்றது.
  to: அப்போது அவன் அவனிடம், “நீ ஆண்டவரின் குரலுக்குச் செவிகொடுக்காததால், இதோ, நீ என்னை விட்டு புறப்படும்போது, சிங்கம் உன்னைத் தாக்கும்” என்றான். அவன் அவனை விட்டு புறப்பட்டபோது, சிங்கம் அவனைக் கண்டு, அவனைத் தாக்கியது.
  rationale: The revision preserves the source’s causal judgment, emphatic ‘இதோ,’ and intentionally unresolved pronoun references, while rendering נכה as ‘தாக்கு’ rather than adding an explicit death claim. It also slightly regularizes the departure clauses for source fidelity and modern Tamil flow.
