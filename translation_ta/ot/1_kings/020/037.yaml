  text: Then he found another man and said[a], “Please strike me.” So the man struck him and wounded him.
translation:
  language: ta
  text: பின்பு அவன் மற்றொரு மனிதனைக் கண்டான். அவனிடம், “தயவுசெய்து என்னை அடியுங்கள்” என்றான். அந்த மனிதன் அவனை அடித்து காயப்படுத்தினான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில் ‘அடி’ என்ற வினை வலியுறுத்தலுக்காக மீண்டும் வருகிறது; நேரடியாக: “அந்த மனிதன் அவனை அடித்தான்—அடித்து காயப்படுத்தினான்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְצָא
  choice: பின்பு அவன் ... கண்டுபிடித்து
  rationale: தொடர்ச்சியான எபிரெயக் கதைநடையை இயல்பான நவீனத் தமிழில் முன்னெடுக்கிறது; מצא என்பதன் ‘கண்டுபிடி/கண்டு’ என்ற அடிப்படைப் பொருளையும் காக்கிறது.
- source_word: אִישׁ אַחֵר
  choice: வேறொரு மனிதன்
  rationale: אִישׁ என்ற ஆண்பால் ஒருமையையும் אַחֵר என்ற ‘மற்றொரு/வேறொரு’ பொருளையும் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: הַכֵּינִי נָא
  choice: தயவுசெய்து என்னை அடி
  rationale: נכה கட்டளை வடிவமும் முதல் நபர் ஒருமைச் சுட்டுப்பின்னொட்டும் ‘என்னை அடி’ என மொழிபெயர்க்கப்பட்டுள்ளன; நָא குறிக்கும் வேண்டுகோள் தொனி ‘தயவுசெய்து’ என்பதால் வெளிப்படுகிறது.
- source_word: וַיַּכֵּהוּ הָאִישׁ
  choice: அந்த மனிதன் அவனை அடித்து
  rationale: வினையின் மூன்றாம் நபர் ஆண்பால் பொருள் சுட்டுப்பின்னொட்டை ‘அவனை’ என்றும், குறிக்கப்பட்ட செய்பவரை ‘அந்த மனிதன்’ என்றும் தெளிவாகக் காக்கிறது.
- source_word: הַכֵּה וּפָצֹעַ
  choice: அடித்துக் காயப்படுத்தினான்
  rationale: சொல்லுக்குச் சொல் வரும் வினைமறுபடியை இயல்பற்ற தமிழில் திணிக்காமல், அடித்ததையும் அதன் விளைவான காயத்தையும் தெளிவாகக் கூறுகிறது; மூலத்தின் வலியுறுத்தல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
