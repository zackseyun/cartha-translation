  text: So the king of Israel went to his house sullen and angry[a], and he came to Samaria.
translation:
  language: ta
  text: ஆகவே, இஸ்ரவேலின் ராஜா முகம் சுளித்தவராகவும் கோபமடைந்தவராகவும்[a] தன் வீட்டுக்குச் சென்று, சமாரியாவை வந்தடைந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மனக்கசப்புடனும் கோபத்துடனும்.” சַר וְזָעֵף என்ற எபிரெய இரட்டைச் சொற்றொடர் உள்ளார்ந்த அதிருப்தியையும் வெளிப்படையான எரிச்சலையும் ஒருங்கிணைக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: சென்று
  rationale: הלך என்பதன் தொடர்கதை வடிவத்தை இயல்பான தமிழ் கதைநடையில் எளிய இயக்கவினையாகத் தருகிறது.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: இஸ்ரவேலின் ராஜா
  rationale: எழுவாயைத் தெளிவாகக் காட்டும், மரியாதையும் இயல்பும் கொண்ட தமிழ்ச் சொற்றொடர்.
- source_word: עַל בֵּיתוֹ
  choice: தன் வீட்டுக்கு
  rationale: இயக்கவினையுடன் עַל இலக்கைச் சுட்டுகிறது; அரச மாளிகை என மிகையாக விளக்காமல் எபிரெய உருவகத்தைப் பாதுகாக்கிறது.
- source_word: סַר
  choice: முகம் சுளித்தவராக
  rationale: இச்சூழலில் உள்ளார்ந்த அதிருப்தி வெளிப்படும் சிடுசிடுப்பான மனநிலையை இயல்பான தமிழில் உணர்த்துகிறது.
- source_word: וְזָעֵף
  choice: கோபமடைந்தவராக
  rationale: கசப்பும் சீற்றமும் கொண்ட நிலையைக் காட்டி, முதல் பண்புச் சொல்லோடு உள்ள இரட்டை வருணனையைப் பாதுகாக்கிறது.
- source_word: וַיָּבֹא
  choice: வந்தடைந்தார்
  rationale: בוא குறிக்கும் வருகையை இலக்கிடமான சமாரியாவுடன் இயல்பான தமிழில் இணைக்கிறது.
- source_word: שֹׁמְרוֹנָה
  choice: சமாரியாவை
  rationale: இறுதியில் உள்ள திசைசுட்டும் ה சமாரியாவை நோக்கிய இயக்கத்தைக் குறிக்கிறது; ‘வந்தடைந்தார்’ என்பதுடன் வேற்றுமை இயல்பாக அமைகிறது.
