- from: ஒவ்வொருவனும் தனக்கு எதிரே இருந்தவனை வீழ்த்தினான்[a]. அராமியர்கள் தப்பியோட, இஸ்ரவேலர் அவர்களைத் துரத்தினார்கள். ஆனால் அராம் அரசன் பென்-அதாத் குதிரைமேல் ஏறி, குதிரைவீரர்களுடன் தப்பித்தான்[b].
  to: ஒவ்வொருவனும் தனக்கு எதிரே இருந்தவனை வீழ்த்தினான்[a]. அராமியர்கள் ஓடிப்போனார்கள்; இஸ்ரவேலர் அவர்களைத் துரத்தினார்கள். ஆனால் அராம் அரசன் பென்-அதாத் குதிரையில், குதிரைவீரர்களுடன் தப்பித்தான்[b].
  rationale: 'இரு பாதுகாப்பான சிறுதிருத்தங்கள் செய்யப்பட்டன: எபிரெய தொடர்வினைநடையைச் சுட்டும் வகையில் அராமின் ஓட்டம் தனி வாக்கியமாக்கப்பட்டது; மேலும் மூலத்தில் இல்லாத ‘ஏறி’ என்ற நிகழ்ச்சிக்குறிப்பை நீக்கி, ‘குதிரையில்’ எனத் தரப்பட்டது. அடிக்குறிப்பு ஆ-வும் உரையின் கட்டமைப்பு நுணுக்கத்தைத் தெளிவாகவும் நடுநிலையாகவும் வெளிப்படுத்தத் திருத்தப்பட்டது.'
