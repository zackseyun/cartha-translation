base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/020.yaml
  text: And each man struck down his man[a], and Aram fled, and Israel pursued them[b]. But Ben-hadad king of Aram escaped on a horse with horsemen.
translation:
  language: ta
  text: ஒவ்வொருவனும் தனக்கு எதிரே இருந்தவனை வீழ்த்தினான்[a]. அராமியர்கள் ஓடிப்போனார்கள்; இஸ்ரவேலர் அவர்களைத் துரத்தினார்கள். ஆனால் அராம் அரசன் பென்-அதாத் குதிரையில், குதிரைவீரர்களுடன் தப்பித்தான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் சொல்லுக்குச் சொல், “ஒவ்வொருவனும் தன் மனிதனை வீழ்த்தினான்”; அதாவது, ஒவ்வொருவனும் தனக்கு எதிரே நின்றவனை வீழ்த்தினான்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “குதிரைமேலும் குதிரைவீரர்களுடனும் தப்பித்தான்.” எபிரெய வாசகம் பென்-அதாத் குதிரையில் தப்பியதையும், குதிரைவீரர்கள் அவனுடன் இருந்ததையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: வீழ்த்தினான்
  rationale: נכה என்பது போர்ச் சூழலில் தாக்கி முறியடிப்பதைக் குறிக்கிறது. ‘வீழ்த்தினான்’ என்பது வெறும் அடியைவிட வலிமையானது; ஆனால் கொன்றதாகத் தேவையின்றி குறிப்பதில்லை.
- source_word: אִישׁ אִישׁוֹ
  choice: ஒவ்வொருவனும் தனக்கு எதிரே இருந்தவனை
  rationale: எபிரெய மொழியின் சொற்பொருள் ‘ஒவ்வொருவனும் தன் மனிதனை’ என்பதாக இருந்தாலும், இங்கு ஒவ்வொரு போர்வீரனும் தன்னை எதிர்த்து நின்றவனைத் தாக்கினான் என்பதே இயல்பான பொருள்.
- source_word: אֲרָם
  choice: அராமியர்கள்
  rationale: இங்கு அராம் என்ற நாட்டுப்பெயர் அதன் படைவீரர்களைக் குறிக்கிறது. தமிழில் பன்மை வினையோடு ‘அராமியர்கள்’ என்பது தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: וַיָּנֻסוּ
  choice: தப்பியோட
  rationale: போர்க்களத்திலிருந்து உயிர்தப்ப ஓடுவதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וַיִּרְדְּפֵם
  choice: அவர்களைத் துரத்தினார்கள்
  rationale: רדף என்பதன் வழக்கமான போர்ச் சூழல் பொருள் ‘துரத்து’ என்பதாகும்.
- source_word: וַיִּמָּלֵט
  choice: தப்பித்தான்
  rationale: போர்க்கள ஆபத்திலிருந்து வெளியேறியதைக் குறிக்கிறது; தேவையற்ற இறையியல் நுணுக்கத்தைச் சேர்ப்பதில்லை.
- source_word: בֶּן הֲדַד
  choice: பென்-அதாத்
  rationale: தனிப்பெயர் தமிழ் ஒலிபெயர்ப்பில் தரப்பட்டுள்ளது.
- source_word: עַל סוּס
  choice: குதிரைமேல் ஏறி
  rationale: சொற்பொருள் ‘ஒரு குதிரையின்மேல்’ என்பதாகும்; தப்பிச் சென்ற விதத்தைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: וּפָרָשִׁים
  choice: குதிரைவீரர்களுடன்
  rationale: פָרָשִׁים என்பது குதிரையில் செல்லும் வீரர்களைக் குறிக்கிறது; இங்கு இணைந்து சென்றவர்களாகப் புரிந்துகொள்ளப்பட்டுள்ளது.
