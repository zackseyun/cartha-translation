base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/027.yaml
  text: And the sons of Israel were mustered and supplied[a], and they went to meet them. The sons of Israel camped opposite them like two little flocks of goats[c][b], but Aram filled the land.
translation:
  language: ta
  text: இஸ்ரவேல் மக்கள் படைக்காகத் திரட்டப்பட்டு, அவர்களுக்குத் தேவையான பொருள்கள் வழங்கப்பட்டு[a], அவர்களை எதிர்கொள்ளச் சென்றார்கள். இஸ்ரவேல் மக்கள் அவர்களுக்கு எதிரே இரண்டு சிறிய ஆட்டு மந்தைகளைப்போல்[b] முகாமிட்டிருந்தார்கள்; அராமியர்களோ தேசம் முழுவதும் நிறைந்திருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “போருக்குத் தேவையான பொருள்களால் ஆயத்தப்படுத்தப்பட்டு.” எபிரெய வினைச்சொல் படையெடுப்புக்குத் தேவையான பொருள்கள் அல்லது ஆதரவு வழங்கப்பட்டதைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “சிறிய ஆட்டு மந்தைகள்” என்று மொழிபெயர்க்கப்பட்டுள்ள எபிரெயச் சொல் அரிதானது. அராமியரின் பெரும்படைக்கு எதிராக மிகச் சிறிய இரண்டு குழுக்களாக இஸ்ரவேலர் தோன்றியதை இந்த உவமை சுட்டுகிறது.
    reason: cultural_note
lexical_decisions:
- source_word: הָתְפָּקְדוּ
  choice: படைக்காகத் திரட்டப்பட்டு
  rationale: இப்போர்ச் சூழலில், படை நடவடிக்கைக்காக ஆட்கள் கணக்கெடுக்கப்பட்டு அணிவகுக்கப்பட்டதைக் குறிக்கிறது; வெறும் ‘எண்ணப்பட்டு’ என்பதைவிட இது இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: וְכָלְכְּלוּ
  choice: தேவையான பொருள்களும் வழங்கப்பட்டனர்
  rationale: படையெடுப்புக்குத் தேவையான உணவு அல்லது பிற ஆதாரங்கள் அளிக்கப்பட்டதைக் குறிக்கிறது. எவை வழங்கப்பட்டன என்பதை எபிரெயம் குறிப்பிடாததால் பொதுவான சொல்லாட்சி வைக்கப்பட்டுள்ளது.
- source_word: לִקְרָאתָם
  choice: அவர்களை எதிர்கொள்ள
  rationale: לִקְרַאת் என்பது சந்திக்கச் செல்வதைக் குறித்தாலும், இங்கு போர்ச் சூழல் எதிர்கொள்ளும் பொருளைத் தெளிவாக்குகிறது.
- source_word: נֶגְדָּם
  choice: அவர்களுக்கு எதிரே
  rationale: இரு படைகளும் ஒன்றுக்கொன்று எதிரான இடத்தில் முகாமிட்டிருந்த நிலையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: כִּשְׁנֵי חֲשִׂפֵי עִזִּים
  choice: இரண்டு சிறிய ஆட்டு மந்தைகளைப்போல்
  rationale: חֲשִׂפֵי என்பது அரிதான சொல்; சூழலில் சீரியப் படையின் பெருந்திரளுக்கு மாறாக இஸ்ரவேலரின் இரண்டு மிகச் சிறிய அணிகளைச் சித்தரிக்கிறது.
- source_word: וַאֲרָם מִלְאוּ אֶת־הָאָרֶץ
  choice: சீரியர்களோ அந்தப் பகுதி முழுவதையும் நிரப்பியிருந்தார்கள்
  rationale: מלא என்ற மூல உருவகத்தைப் பாதுகாத்து, ‘நாடு’ என்று மிக விரிவாகப் புரிந்துகொள்ளாமல் கண்ணுக்குத் தெரிந்த நிலப்பரப்பைச் சுட்டும் வகையில் ‘அந்தப் பகுதி’ என வழங்குகிறது; ‘-ஓ’ வலுவான ஒப்பீட்டை இயல்பாகக் காட்டுகிறது.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: சொல்லுக்குச் சொல் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இந்தக் கூட்டுப் பெயரை நவீன தமிழில் இயல்பாகவும் மரியாதையாகவும் ‘இஸ்ரவேல் மக்கள்’ என வழங்குவது பொருளைத் துல்லியமாகக் கொண்டுசெல்கிறது.
