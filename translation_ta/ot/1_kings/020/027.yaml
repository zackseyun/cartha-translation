translation_notes:
  register: நவீன பொதுத்தமிழில், வேதாகமச் சூழலுக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘இஸ்ரவேலின் மகன்கள்’ என்ற எபிரெய மரபுத்தொடர் இயல்பான ‘இஸ்ரவேல் மக்கள்’ என வழங்கப்பட்டுள்ளது. அரிதான חֲשִׂפֵי என்பதிலுள்ள நிச்சயமின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
