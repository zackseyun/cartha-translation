base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/030.yaml
  text: The survivors fled to Aphek[a], into the city, and the wall fell on twenty-seven thousand of the remaining men. Ben-hadad also fled and entered the city, into an inner room.
translation:
  language: ta
  text: தப்பிப் பிழைத்தவர்கள் ஆப்பெக்கிலுள்ள நகருக்குள் ஓடிப்போனார்கள். எஞ்சியிருந்த இருபத்தேழாயிரம் ஆண்கள்மேல் மதில் விழுந்தது. பென்-அதாதும் தப்பியோடி நகருக்குள் சென்று, ஓர் உள்ளறைக்குள்[a] புகுந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “அறைக்குள் அறை”; அதாவது, உட்புறமான அல்லது மிகவும் உட்புறமான அறை.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנּוֹתָרִים
  choice: தப்பிப் பிழைத்தவர்கள் / எஞ்சியிருந்த ஆண்கள்
  rationale: போரில் உயிரோடு மீந்தவர்களைக் குறிக்கிறது. முதல் இடத்தில் இயல்பான தமிழுக்காக ‘தப்பிப் பிழைத்தவர்கள்’ என்றும், இரண்டாம் இடத்தில் எபிரெயச் சொல்லின் மீளுரையைத் தக்கவைத்தபடி சீரான நடைக்காக ‘எஞ்சியிருந்த ஆண்கள்’ என்றும் மொழிபெயர்க்கப்பட்டது.
- source_word: אֲפֵקָה
  choice: ஆப்பெக்கிற்கு
  rationale: இடப்பெயருடன் சேர்ந்துள்ள திசைகாட்டும் -ה, ஆப்பெக்கை நோக்கிய இயக்கத்தைக் குறிக்கிறது.
- source_word: הָעִיר
  choice: நகருக்குள்
  rationale: עיר என்பதன் பொருளைத் தந்து, אֶל என்னும் முன்னிடைச்சொல் காட்டும் உள்ளே செல்லும் இயக்கத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது; இரு நிகழ்வுகளிலும் நகருக்குள் நுழைதல் தக்கவைக்கப்பட்டது.
- source_word: וַתִּפֹּל הַחוֹמָה
  choice: மதில் விழுந்தது
  rationale: הַחוֹמָה என்பது குறிப்பிட்ட நகர மதிலையோ அதன் ஒரு பகுதியையோ சுட்டுகிறது. சூழலில் ‘மதில்’ இயல்பாகவே குறிப்பிட்டதாகப் புரிவதால் தமிழில் தனிக் குறிப்புச்சொல் தேவையில்லை.
- source_word: עַל עֶשְׂרִים וְשִׁבְעָה אֶלֶף אִישׁ
  choice: இருபத்தேழாயிரம் பேர்மேல்
  rationale: எண்ணிக்கை இயல்பான தமிழில் தரப்பட்டது; איש இங்கு போர்ச் சூழலில் ஆண்களைக் குறிப்பதால் முந்தைய தொடரில் ‘ஆண்களில்’ என்று தெளிவுபடுத்தப்பட்டுள்ளது.
- source_word: וּבֶן הֲדַד נָס
  choice: பென்-அதாதும் தப்பியோடி
  rationale: இணைப்புச்சொல் பென்-அதாதின் இணையான தப்பிப்பையும் காட்டுவதால் ‘-உம்’ பயன்படுத்தப்பட்டது. נס என்பதன் அவசரமான பின்வாங்கும் பொருளை ‘தப்பியோடி’ தருகிறது.
- source_word: חֶדֶר בְּחָדֶר
  choice: ஓர் உள்ளறைக்குள்
  rationale: சொல்லுக்குச் சொல் ‘அறைக்குள் ஓர் அறை’; மறைவான உட்புற அறைக்குச் செல்வதை இயல்பான நவீன தமிழில் ‘உள்ளறை’ வெளிப்படுத்துகிறது. நேரடி வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
