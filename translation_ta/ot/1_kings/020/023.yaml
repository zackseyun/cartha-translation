  text: וְ/עַבְדֵ֨י מֶֽלֶךְ אֲרָ֜ם אָמְר֣וּ אֵלָ֗י/ו אֱלֹהֵ֤י הָרִים֙ אֱלֹ֣הֵי/הֶ֔ם עַל כֵּ֖ן חָזְק֣וּ מִמֶּ֑/נּוּ וְ/אוּלָ֗ם נִלָּחֵ֤ם אִתָּ/ם֙ בַּ/מִּישׁ֔וֹר אִם לֹ֥א נֶחֱזַ֖ק מֵ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/023.yaml
  text: And the servants of the king of Aram said to him[a], “Their gods are gods of the hills; therefore they were stronger than we were. But if we fight against them on the plain, surely we will be stronger than they are.”
translation:
  language: ta
  text: அராம் அரசனின் பணியாளர்கள் அவனிடம், “அவர்களுடைய தெய்வங்கள் மலைகளின் தெய்வங்கள்[a]. அதனால்தான் அவர்கள் நம்மைவிட வலிமையானவர்களாக இருந்தார்கள். ஆனால் நாம் அவர்களைச் சமவெளியில் எதிர்த்துப் போரிட்டால், நிச்சயமாக அவர்களைவிட வலிமையானவர்களாக இருப்போம்” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுடைய கடவுள் மலைகளின் கடவுள்.” இஸ்ரவேலின் ஒரே கடவுளைப் பற்றி அராமியர்கள் தங்கள் புறமதக் கண்ணோட்டத்தில் பேசுவதைப் பிரதிபலிக்கும் வகையில், எபிரெயத்தில் பன்மை வடிவங்கள் (“தெய்வங்கள்”) பயன்படுத்தப்பட்டுள்ளன.
    reason: alternative_reading
lexical_decisions:
- source_word: עַבְדֵי
  choice: பணியாளர்கள்
  rationale: அரசவையின் சூழலில் இச்சொல் அரசனுக்குப் பணிபுரிபவர்களையோ அதிகாரிகளையோ குறிக்கலாம். பதவிநிலையை அளவுக்கு மீறிக் குறிப்பாக்காமல், மூலச்சொல்லின் நேரடியான பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: אֲרָם
  choice: அராம்
  rationale: பிற்கால அரசியல் பெயரான ‘சிரியா’ என்பதற்குப் பதிலாக, மூலமொழியிலுள்ள நாட்டுப் பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: אֱלֹהֵי הָרִים / אֱלֹהֵיהֶם
  choice: அவர்களுடைய தெய்வங்கள் மலைகளின் தெய்வங்கள்
  rationale: அராமியர்கள் இஸ்ரவேலின் கடவுளைப் பன்மைத்துவக் கண்ணோட்டத்தில் பேசுவதை எபிரெயப் பன்மை வடிவங்கள் வெளிப்படுத்துகின்றன; அந்தப் பேச்சுக் கண்ணோட்டம் தமிழிலும் பன்மையாகப் பாதுகாக்கப்பட்டுள்ளது.
- source_word: עַל כֵּן
  choice: அதனால்தான்
  rationale: முந்தைய கூற்றைத் தொடர்ந்து வரும் காரணவிளைவை நவீனத் தமிழில் இயல்பாகவும் வலியுறுத்தலுடனும் காட்டுகிறது.
- source_word: חָזְקוּ מִמֶּנּוּ
  choice: அவர்கள் நம்மைவிட வலிமையானவர்களாக இருந்தார்கள்
  rationale: חזק உடன் מן வருவது ஒப்பீட்டு வலிமையைக் குறிக்கிறது; ‘வென்றார்கள்’ என்று விளக்கமாக்காமல் அந்த ஒப்பீடு நேரடியாகப் பாதுகாக்கப்பட்டுள்ளது.
- source_word: וְאוּלָם
  choice: ஆனால்
  rationale: முந்தைய விளக்கத்திற்கும் அடுத்த போர்த் திட்டத்திற்கும் இடையிலான முரண்பாட்டைச் சுருக்கமாகக் காட்டுகிறது.
- source_word: נִלָּחֵם אִתָּם
  choice: நாம் அவர்களை எதிர்த்துப் போரிட்டால்
  rationale: சூழலில் முன்மொழியப்படும் போர்நடவடிக்கையை நிபந்தனை வடிவில் இயல்பாகத் தருகிறது.
- source_word: בַּמִּישׁוֹר
  choice: சமவெளியில்
  rationale: மேடான மலைப்பகுதிக்கு எதிரான தட்டையான நிலப்பரப்பைத் தெளிவாகக் குறிக்கிறது.
- source_word: אִם לֹא
  choice: நிச்சயமாக
  rationale: இங்கு சொற்றொடர் சொற்பொருளிலான மறுப்பு நிபந்தனையாக அல்லாமல் உறுதியான வலியுறுத்தலாகச் செயல்படுகிறது.
- source_word: נֶחֱזַק מֵהֶם
  choice: அவர்களைவிட வலிமையானவர்களாக இருப்போம்
  rationale: முந்தைய חזק வடிவத்துடன் உள்ள சொற்பொருள் மீளுருவாக்கத்தையும் ஒப்பீட்டையும் ஒரேவிதமாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: இஸ்ரவேலின் இறைவனைப் பற்றிய அராமியர்களின் விளக்கம்
  choice: அவர்களுடைய தெய்வங்கள் மலைகளின் தெய்வங்கள்
  alternative: அவர்களுடைய கடவுள் மலைகளின் கடவுள்
  rationale: இது உரையாசிரியரின் இறையியல் அறிவிப்பு அல்ல; அராமியர்களின் புறமதப் பேச்சு. எபிரெயப் பன்மை வடிவங்களைப் பாதுகாப்பது அவர்களுடைய தவறான புரிதலையும் கதையின் இறையியல் பதற்றத்தையும் திருத்தமின்றி வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் இயல்பான ஆனால் கண்ணியமான நடை. அரண்மனைச் சூழலுக்கு ‘பணியாளர்கள்’ என்றும், நிலவியல் எதிர்மறையைத் தெளிவுபடுத்த ‘மலைகள்/சமவெளி’ என்றும் பயன்படுத்தப்பட்டுள்ளது.
