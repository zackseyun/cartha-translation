  text: וְ/אֶת הַ/דָּבָ֥ר הַ/זֶּ֖ה עֲשֵׂ֑ה הָסֵ֤ר הַ/מְּלָכִים֙ אִ֣ישׁ מִ/מְּקֹמ֔/וֹ וְ/שִׂ֥ים פַּח֖וֹת תַּחְתֵּי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/024.yaml
  text: 'And do this thing: remove the kings[a], each from his place, and put governors in their place.'
translation:
  language: ta
  text: 'இதைச் செய்: அரசர்களை ஒவ்வொருவரையும் அவரவர் இடத்திலிருந்து நீக்கி, அவர்களுக்குப் பதிலாக ஆளுநர்களை நியமி.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுக்குப் பதிலாக மாகாண ஆளுநர்களை நியமி.”
    reason: ஆங்கில POB ஆய்வுத் தடத்தில் உள்ள சொற்தேர்வு மாற்றைத் தமிழிலும் இணைக்கிறது; פַּחוֹת என்பதன் மாகாண-நிர்வாக நுணுக்கத்தை மாற்று வாசிப்பில் காட்டுகிறது.
lexical_decisions:
- source_word: וְאֶת הַדָּבָר הַזֶּה עֲשֵׂה
  choice: நீ இதைச் செய்
  rationale: முன்னிலைப்படுத்தப்பட்ட பொருளையும் கட்டளை வினையையும் இயல்பான நவீன தமிழில் சுருக்கமாகத் தருகிறது; דָּבָר இங்கு செயலை அல்லது காரியத்தைக் குறிக்கிறது.
- source_word: הָסֵר
  choice: நீக்கிவிட்டு
  rationale: ஹிஃபில் கட்டளை வடிவின் ‘அகற்றச் செய்’ என்ற பொருளைத் தருகிறது; முழுமையாகப் பதவிநீக்கம் செய்தார்களா, படைத்தலைமையிலிருந்து மட்டும் மாற்றப்பட்டார்களா என்பதைத் தேவையின்றி முடிவுசெய்யவில்லை.
- source_word: הַמְּלָכִים אִישׁ מִמְּקֹמוֹ
  choice: அரசர்கள் ஒவ்வொருவரையும் அவரவர் பதவியிலிருந்து
  rationale: பன்மைக்குப் பின் வரும் אִישׁ என்பதன் பகிர்ந்தளிக்கும் பொருளை ‘ஒவ்வொருவரையும்’ எனக் காட்டுகிறது. சூழலில் מָקוֹם புவியிடத்தைவிட நியமிக்கப்பட்ட நிலை அல்லது பொறுப்பைக் குறிப்பதால் ‘பதவி’ இயல்பாக உள்ளது.
- source_word: וְשִׂים
  choice: நியமி
  rationale: שים என்பதன் அடிப்படைப் பொருள் ‘வை’ என்றாலும், நிர்வாகப் பொறுப்பில் மாற்று அதிகாரிகளை அமர்த்தும் இச்சூழலில் ‘நியமி’ தெளிவான இயல்பான தமிழ்.
- source_word: פַּחוֹת
  choice: ஆளுநர்கள்
  rationale: இச்சொல் நிர்வாக அதிகாரிகள் அல்லது மாகாண ஆளுநர்களைக் குறிக்கிறது; ‘படைத்தலைவர்கள்’ என்பது பொருளை அளவுக்கு மீறிக் குறுக்கும்.
- source_word: תַּחְתֵּיהֶם
  choice: அவர்களுக்குப் பதிலாக
  rationale: சொல்லளவில் ‘அவர்களுக்குக் கீழே’ என்றும் வரக்கூடிய வடிவம் இங்கு பதிலீட்டைக் குறிக்கிறது; தமிழில் ‘பதிலாக’ அதனைத் தெளிவாகத் தருகிறது.
