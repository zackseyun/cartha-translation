source:
  edition: WLC
  text: וַ/יֹּאמְר֣וּ אֵלָי/ו֮ עֲבָדָי/ו֒ הִנֵּֽה נָ֣א שָׁמַ֔עְנוּ כִּ֗י מַלְכֵי֙ בֵּ֣ית יִשְׂרָאֵ֔ל כִּֽי מַלְכֵ֥י חֶ֖סֶד הֵ֑ם נָשִׂ֣ימָה נָּא֩ שַׂקִּ֨ים בְּ/מָתְנֵ֜י/נוּ וַ/חֲבָלִ֣ים בְּ/רֹאשֵׁ֗/נוּ וְ/נֵצֵא֙ אֶל מֶ֣לֶךְ יִשְׂרָאֵ֔ל אוּלַ֖י יְחַיֶּ֥ה אֶת נַפְשֶֽׁ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/031.yaml
  text: And his servants said to him, “Look, please, we have heard that the kings of the house of Israel are merciful kings. Please let us put sackcloth around our waists and ropes on our heads, and let us go out to the king of Israel; perhaps he will let you live.”
translation:
  language: ta
  text: அவனுடைய பணியாளர்கள் அவனிடம், “இதோ, தயவுசெய்து, இஸ்ரவேல் நாட்டின் அரசர்கள் இரக்கமுள்ள அரசர்கள் என்று கேள்விப்பட்டிருக்கிறோம். தயவுசெய்து, நம் இடுப்புகளில் சாக்குத்துணிகளையும் நம் தலைகளில் கயிறுகளையும் போட்டுக்கொண்டு, இஸ்ரவேல் அரசனிடம் செல்வோம்; ஒருவேளை அவர் உங்கள் உயிரைக் காப்பாற்றலாம்” என்றார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַלְכֵי חֶסֶד
  choice: இரக்கமுள்ள அரசர்கள்
  rationale: חֶסֶד இங்கு உடன்படிக்கைச் சொல்லாகத் தனியே வலியுறுத்தப்படாமல், தோற்ற அரசனுக்கு உயிர்ப்பிச்சை அளிக்கும் கருணை அல்லது இரக்கத்தைக் குறிக்கிறது.
- source_word: שַׂקִּים
  choice: துக்கவுடைகள்
  rationale: சாக்குத் துணியால் ஆன உடைகளை மட்டும் குறிக்கும் சொல்லாக இல்லாமல், தாழ்மையும் துயரமும் சரணடைவுமாகிய அடையாளத்தை இயல்பான தமிழில் உணர்த்துகிறது.
- source_word: בְּמָתְנֵינוּ
  choice: நம் இடுப்புகளில் ... சுற்றிக்கொண்டு
  rationale: உடைகளை இடுப்பைச் சுற்றி அணிவதைக் குறிக்கும் எபிரெய உருவத்தைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: וַחֲבָלִים בְּרֹאשֵׁנוּ
  choice: நம் தலைகளில் கயிறுகளைப் போட்டுக்கொண்டு
  rationale: சரணடைதல் அல்லது உயிர்ப்பிச்சை வேண்டுதலின் வெளிப்புற அடையாளமான மூலமொழியின் வியப்பூட்டும் உருவகத்தை விளக்கிச் சீராக்காமல் பாதுகாக்கிறது.
- source_word: יְחַיֶּה אֶת נַפְשֶׁךָ
  choice: உம் உயிரைக் காப்பாற்றலாம்
  rationale: சொல்லாட்சியில் ‘உமது உயிரை வாழவைக்கலாம்’; சூழலில் பென்-அதாதைக் கொல்லாமல் உயிரோடு விடுவதை இயல்பாகக் குறிக்கிறது.
theological_decisions:
- issue: חֶסֶד என்பதன் பொருள்
  choice: இரக்கம்
  alternative: உடன்படிக்கைப் பேரன்பு / மாறாத அன்பு
  rationale: இங்கு இஸ்ரவேல் அரசர்கள் தோற்ற எதிரிகளுக்கு காட்டுவதாக அறியப்பட்ட மன்னிப்பும் கருணையுமே சூழலுக்குப் பொருத்தம்; குறிப்பிட்ட ஓர் இறையியல் கருத்தை இறக்குமதி செய்யவில்லை.
- issue: ‘ஒருவேளை’ என்ற உறுதியின்மை
  choice: ஒருவேளை அவர் உம் உயிரைக் காப்பாற்றலாம்
  alternative: அவர் உம்மை நிச்சயமாக உயிரோடு விடுவார்
  rationale: אוּלַי வெளிப்படுத்தும் உண்மையான நிச்சயமின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; அரசவைக் காட்சிக்கேற்ற கண்ணியமான நடை. பென்-அதாதை நோக்கிய மரியாதைப் பன்மையை ‘உம்’ எனக் காத்து, பணியாளர்கள் தங்களை உள்ளடக்கும் வேண்டுகோளை ‘நம்’ என இயல்பாக்கியுள்ளது.
