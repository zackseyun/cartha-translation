base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/032.yaml
  text: So they tied sackcloth around their waists and ropes on their heads[a], and they came to the king of Israel and said, “Your servant Ben-hadad says, ‘Please let me live.’” And he said[b], “Is he still alive? He is my brother.”
translation:
  language: ta
  text: 'அவர்கள் தங்கள் இடுப்புகளில் சாக்குத் துணிகளைக் கட்டிக்கொண்டு, தங்கள் தலைகளின்மேல் கயிறுகளை வைத்துக்கொண்டு, இஸ்ரவேலின் அரசனிடம் வந்தார்கள். அவர்கள், “உமது அடியானாகிய பென்-ஆதாத் கூறுவது: ‘தயவுசெய்து என்னை வாழவிடுங்கள்’[a]” என்றார்கள். அதற்கு அரசன், “அவன் இன்னும் உயிரோடிருக்கிறானா? அவன் என் சகோதரன்[b]” என்றான்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தயவுசெய்து என் உயிரைக் காப்பாற்றுங்கள்.” சொல்லுக்குச் சொல், “தயவுசெய்து என் உயிர் வாழட்டும்.”
    reason: lexical_alternative
  - marker: b
    text: “என் சகோதரன்” என்பது அநேகமாக நேரடி குடும்ப உறவைக் குறிக்காமல், அரசியல் அல்லது உடன்படிக்கை சார்ந்த சகோதரத்துவத்தைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּחְגְּרוּ שַׂקִּים בְּמָתְנֵיהֶם
  choice: தங்கள் இடுப்புகளில் சாக்குத் துணிகளைக் கட்டிக்கொண்டு
  rationale: חגר என்பது இடுப்பைச் சுற்றிக் கட்டுதல் அல்லது அணிதல் என்பதைக் குறிக்கிறது. ‘சாக்குத் துணி’ தாழ்மையையும் அவமானத்தையும் வெளிப்படுத்தும் உடைப் பொருளை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: וַחֲבָלִים בְּרָאשֵׁיהֶם
  choice: தங்கள் தலைகளின்மேல் கயிறுகளை வைத்துக்கொண்டு
  rationale: חֲבָלִים என்பதற்கு ‘கயிறுகள்’ என்பது நேரான பொருள். בְּרָאשֵׁיהֶם என்பது அவை தலைகளின்மேல் இருந்ததாகக் கூறுகிறது; அவை எவ்வாறு சுற்றப்பட்டிருந்தன என்பதை மொழிபெயர்ப்பு தேவையின்றி நிர்ணயிக்கவில்லை.
- source_word: עַבְדְּךָ
  choice: உமது அடியானாகிய
  rationale: அரசனிடம் தன்னைத் தாழ்த்திப் பேசும் அரசியல் தூதுமொழியை ‘அடியான்’ இயல்பாகவும் மரியாதையுடனும் வெளிப்படுத்துகிறது.
- source_word: בֶן הֲדַד
  choice: பென்-ஆதாத்
  rationale: தனிப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: תְּחִי נָא נַפְשִׁי
  choice: தயவுசெய்து என்னை வாழவிடுங்கள்
  rationale: சொல்லுக்குச் சொல் ‘தயவுசெய்து என் உயிர் வாழட்டும்’ என்ற வேண்டுகோள், சூழலில் உயிரைப் பாதுகாக்குமாறு மன்றாடுகிறது. தேர்ந்த வடிவம் அதன் வேண்டுகோள் வலிமையை இயல்பான தமிழில் தருகிறது.
- source_word: הַעוֹדֶנּוּ חַי
  choice: அவன் இன்னும் உயிரோடிருக்கிறானா?
  rationale: עוד மற்றும் חַי இணைந்து பென்-ஆதாத் தொடர்ந்து உயிருடன் இருக்கிறானா என்று கேட்கின்றன; ‘இன்னும் உயிரோடு’ என்பது தெளிவான நவீன தமிழ்.
- source_word: אָחִי הוּא
  choice: அவன் என் சகோதரன்
  rationale: אָחִי என்ற உறவுமுறைச் சொல்லை நேரடியாகத் தக்கவைத்து, அது உடன்படிக்கை அல்லது அரசியல் சகோதரத்துவத்தைக் குறிக்கிறதா என்ற சூழல்சார் தெளிவின்மையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: ஆகாபின் பதிலில் ‘சகோதரன்’ என்பதன் பொருள்
  choice: ‘அவன் என் சகோதரன்’ என்று உறவுமுறைச் சொல்லை நேரடியாகத் தக்கவைத்தல்
  alternative: ‘அவன் என் கூட்டாளி’ அல்லது ‘அவன் எனக்குச் சகோதரனைப் போன்றவன்’
  rationale: எபிரெய உரை אָחִי என்ற சாதாரண உறவுமுறைச் சொல்லையே பயன்படுத்துகிறது. சூழலில் அது நேரடி இரத்த உறவைக் காட்டிலும் அரசியல் அல்லது உடன்படிக்கை சார்ந்த சகோதரத்துவத்தைக் குறிக்கக்கூடும்; ஆனாலும் உரை அந்த நுணுக்கத்தைத் தீர்மானிக்காததால் மொழிபெயர்ப்பும் அதைத் திறந்தே வைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், அரசவைக் காட்சிக்கேற்ற கண்ணியமான நடையும் பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் சொற்களும் பயன்படுத்தப்பட்டுள்ளன. அரசனை நோக்கிய மரியாதைப் பேச்சில் ‘உமது’ என்றும், அரசனின் பதிலில் இயல்பான ஒருமை வடிவங்களும் பயன்படுத்தப்பட்டுள்ளன.
