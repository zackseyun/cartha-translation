base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/014.yaml
  text: 'And Ahab said[a], “By whom?” And he said, “Thus says Yahweh: By the young men of the provincial officials.” Then he said, “Who will begin the battle?” And he said, “You.”'
translation:
  language: ta
  text: 'ஆகாப், “யார் மூலம்?” என்று கேட்டான். அதற்கு அவர், “யாவே இவ்வாறு கூறுகிறார்: மாகாண அதிகாரிகளின் இளைஞர்கள்[a] மூலம்” என்றார். பின்பு ஆகாப், “போரைத் தொடங்குவது யார்?” என்று கேட்டான். அதற்கு அவர், “நீயே” என்றார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மாகாண அதிகாரிகளின் பணியாளர்கள்/உதவியாளர்கள்.” “இளைஞர்கள்” என்பதற்கான எபிரெயச் சொல், அதிகாரிகளிடம் பணிபுரியும் பணியாளர்களையோ உதவியாளர்களையும்கூட குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּמִי
  choice: யார் மூலம்?
  rationale: בְּ முன்னொட்டு இங்கு செயலை நிறைவேற்றும் நபர் அல்லது கருவியை விசாரிக்கிறது. ‘யார் மூலம்?’ என்பது இந்தக் கருவிப்பொருளை இயல்பான தமிழில் காக்கிறது.
- source_word: כֹּה אָמַר יְהוָה
  choice: யாவே கூறுவது இதுவே
  rationale: இது இறைத்தூதுச் செய்தியை அறிமுகப்படுத்தும் நிலையான எபிரெயச் சொற்றொடர். நவீன தமிழில் இயல்பாகவும் அதன் அதிகாரமிக்க தொனியைத் தக்கவைத்தும் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் உள்ள இறைப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், அதன் வழக்கமான தமிழ் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: בְּנַעֲרֵי
  choice: இளைஞர்கள் மூலம்
  rationale: נַעַר என்பதன் அடிப்படைப் பொருள் ‘இளைஞன்’; சூழலில் அதிகாரிகளிடம் பணிபுரியும் உதவியாளர்கள் அல்லது பணியாளர்களையும் குறிக்கலாம். முதன்மைப் பொருள் உரையில் வைக்கப்பட்டு, பணிசார் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: שָׂרֵי הַמְּדִינוֹת
  choice: மாகாண அதிகாரிகள்
  rationale: שָׂרִים என்பது அதிகாரிகள் அல்லது தலைவர்கள்; מְדִינוֹת என்பது நிர்வாக மாகாணங்கள். குறிப்பிட்ட இராணுவப் பதவியைத் தேவையின்றி சேர்க்காமல் நிர்வாகச் சூழலைத் தெளிவாகச் சொல்கிறது.
- source_word: מִי יֶאְסֹר הַמִּלְחָמָה
  choice: போரைத் தொடங்குவது யார்?
  rationale: אָסַר என்பதன் நேரடிப் பொருள் ‘கட்டு’ என்றாலும், מִלְחָמָה உடன் வரும் இச்சொல்லாட்சி போரை ஆரம்பிப்பதை அல்லது மோதலில் இறங்குவதைச் சுட்டுகிறது. ‘போரைத் தொடங்குவது’ தமிழில் தெளிவான இணை.
- source_word: אָתָּה
  choice: நீயே
  rationale: தனித்து வந்த இரண்டாம் நபர் ஒருமைப் பெயர்ச்சொல்லின் வலியுறுத்தலை ‘-ஏ’ விகுதி இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூல உரையில் தனிப்பட்ட இறைப் பெயரான நான்கெழுத்துப் பெயர் நேரடியாக வருகிறது. ‘யாவே’ என்பது அதை ஒரு பட்டமாக மாற்றாமல், ‘Jehovah’ என்ற பிற்கால வடிவத்தையும் ஏற்காமல் ஒலிபெயர்க்கிறது.
- issue: נַעַר என்பவர்களின் சமூக அல்லது பணிசார் நிலை
  choice: இளைஞர்கள்
  alternative: பணியாளர்கள்; உதவியாளர்கள்
  rationale: சொல் வயதையும் பணிசார் நிலையையும் குறிக்கக்கூடும். உரையில் அதன் நேரடியான வயதுசார் பொருளை வைத்து, சூழலுக்குரிய பணிசார் சாத்தியத்தை அடிக்குறிப்பில் காப்பது தேவையற்ற தீர்மானத்தைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் தெளிவான, கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டது. உரையாடலின் சுருக்கமும் ‘நீயே’ என்பதன் வலியுறுத்தலும் காக்கப்பட்டுள்ளன. எபிரெயில் பேச்சாளர்கள் சுட்டுப்பெயர்களால் மட்டுமே குறிக்கப்படுவதால், தேவையற்ற பெயர் அல்லது பதவி சேர்க்காமல் ‘அவர்’ பயன்படுத்தப்பட்டுள்ளது.
