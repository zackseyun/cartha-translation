base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/033.yaml
  text: The men were watching for an omen[a], and they quickly seized on it from him and said, “Ben-hadad is your brother.” And he said, “Come, take him.” Then Ben-hadad came out to him[c][b], and he had him come up into the chariot.
translation:
  language: ta
  text: அந்த மனிதர்கள் ஒரு நற்சகுனத்திற்காக உற்றுக் கவனித்துக்கொண்டிருந்தார்கள்[a]. அவர்கள் உடனே அவன் சொன்ன வார்த்தையைப் பிடித்துக்கொண்டு[b], “பென்-அதாத் உன் சகோதரன்” என்றார்கள். அதற்கு அவன், “அவனை அழைத்து வாருங்கள்” என்றான். அப்போது பென்-அதாத் அவனிடம் வெளியே வந்தான்; ஆகாப் அவனைத் தேரில் ஏறச் செய்தான்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “குறி பார்க்கிறவர்களைப்போல் உற்றுக் கவனித்தார்கள்” அல்லது “அதைச் சகுனமாக எடுத்துக்கொண்டார்கள்.” எபிரெய வினைச்சொல் சகுனம் பார்த்தல் அல்லது ஒன்றைச் சகுனமாகக் கொள்ளுதல் என்று பொருள்படலாம். இங்கு ஆகாபின் வார்த்தையில் தங்களுக்குச் சாதகமான குறிப்புக்காக அவர்கள் விழிப்புடன் இருந்தார்கள்.
    reason: lexical_alternative
  - marker: b
    text: “அவன் சொன்ன வார்த்தையைப் பிடித்துக்கொண்டு” என்பதற்கான எபிரெயச் சொற்றொடர் பொருள் காண்பதற்குக் கடினமானது. ஆகாபின் வார்த்தையைத் தங்களுக்குச் சாதகமான ஒப்புதலாக அவர்கள் உடனே பிடித்துக்கொண்டார்கள் என்பதே இங்குள்ள கருத்து.
    reason: lexical_alternative
  - marker: c
    text: நேரடியாக, “அவனைத் தேரில் ஏறச் செய்தான்.” எபிரெய வினை காரணவினை வடிவில் உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְנַחֲשׁוּ
  choice: அதை ஒரு நற்சகுனமாக எடுத்துக்கொள்ளக் காத்திருந்தார்கள்
  rationale: פיעל வடிவிலுள்ள נחשׁ சகுனம் பார்த்தல் அல்லது ஒன்றைச் சகுனமாகக் கொள்ளுதல் என்னும் பொருளைக் கொண்டது. இங்கு முறையான குறிசொல்லும் சடங்கு அல்ல; ஆகாபின் வார்த்தையில் தங்களுக்குச் சாதகமான குறிப்பைக் கண்டுபிடிக்க அவர்கள் விழிப்புடன் இருந்தார்கள். ‘நற்சகுனம்’ என்பது அந்தச் சூழ்நிலையையும் மூலச்சொல்லின் சகுனப் பொருளையும் தக்கவைக்கிறது.
- source_word: וַיְמַהֲרוּ
  choice: உடனே
  rationale: அவர்கள் சாதகமான வார்த்தையைக் கேட்டவுடன் தாமதமின்றி செயல்பட்டதை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: וַיַּחְלְטוּ הֲמִמֶּנּוּ
  choice: அவன் சொன்னதைப் பற்றிக்கொண்டு
  rationale: கடினமான எபிரெயச் சொற்றொடர், ஆகாபின் ‘சகோதரன்’ என்ற வார்த்தையை அவர்கள் உடனே தங்களுக்குச் சாதகமான உறுதிமொழியாகப் பிடித்துக்கொண்டதைக் குறிக்கிறது. மூலத்தில் மறைந்துள்ள பொருள் சூழலிலிருந்து ‘அவன் சொன்னதை’ என வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: אָחִיךָ
  choice: உன் சகோதரன்
  rationale: நேரடியான பொருளைத் தக்கவைக்கிறது; இது தூதர்கள் பயன்படுத்திக்கொண்ட அரசியல் மரியாதை அல்லது உறவுமுறை மொழியாகும்.
- source_word: בֹּאוּ קָחֻהוּ
  choice: போய், அவனை அழைத்து வாருங்கள்
  rationale: சொல்லுக்குச் சொல் ‘வாருங்கள், அவனை எடுத்துக்கொள்ளுங்கள்’ என இருந்தாலும், சூழலில் பென்-அதாதை ஆகாபின் முன்னிலையில் அழைத்து வரும்படி கட்டளையிடுவதே பொருள். தமிழில் தெளிவான, இயல்பான கட்டளையாக வழங்கப்பட்டுள்ளது.
- source_word: וַיַּעֲלֵהוּ עַל הַמֶּרְכָּבָה
  choice: அவனைத் தேரில் ஏற்றிக்கொண்டான்
  rationale: 'עלה என்பதன் ஹிஃபில் வடிவம் காரணவினைப் பொருளைக் கொண்டது: ஆகாப் பென்-அதாதைத் தேரில் ஏறச் செய்தான். ‘ஏற்றிக்கொண்டான்’ என்பது உடலால் தூக்கினான் என்று தேவையின்றி உணர்த்தாமல், தமிழில் இயல்பாக அந்தப் பொருளை வழங்குகிறது.'
- source_word: הַמֶּרְכָּבָה
  choice: தேர்
  rationale: மூலத்தில் குறிப்பிட்ட சுட்டு உள்ளது; உடைமைச் சுட்டு வெளிப்படையாக இல்லை. சூழலில் அது ஆகாபின் தேர் என்பது தெளிவாக இருந்தாலும், மொழிபெயர்ப்பு ‘அவனுடைய’ என்பதைச் சேர்க்கவில்லை.
