translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் அரசவைக் காட்சிக்கேற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘நற்சகுனம்’ மூலத்தின் சகுனம் சார்ந்த நுணுக்கத்தைத் தக்கவைக்கிறது; அடிக்குறிப்பு மாற்றுப் பொருளை விளக்குகிறது. பென்-அதாத் என்ற பெயர் தமிழில் பரவலாகப் புரியும் ஒலிபெயர்ப்பில் வழங்கப்பட்டுள்ளது.
