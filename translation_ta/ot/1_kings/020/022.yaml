  text: וַ/יִּגַּ֤שׁ הַ/נָּבִיא֙ אֶל מֶ֣לֶךְ יִשְׂרָאֵ֔ל וַ/יֹּ֤אמֶר ל/וֹ֙ לֵ֣ךְ הִתְחַזַּ֔ק וְ/דַ֥ע וּ/רְאֵ֖ה אֵ֣ת אֲשֶֽׁר תַּעֲשֶׂ֑ה כִּ֚י לִ/תְשׁוּבַ֣ת הַ/שָּׁנָ֔ה מֶ֥לֶךְ אֲרָ֖ם עֹלֶ֥ה עָלֶֽי/ךָ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/022.yaml
  text: Then the prophet came near to the king of Israel and said to him[a], “Go, strengthen yourself, and know and see what you should do[c][b], because at the turn of the year the king of Aram will come up against you.”
translation:
  language: ta
  text: பின்பு இறைவாக்கினர் இஸ்ரவேலின் அரசனிடம் வந்து அவனிடம், “நீ போய், உன்னைப் பலப்படுத்திக்கொள்; நீ என்ன செய்ய வேண்டும்[a] என்பதை அறிந்து பார். ஏனெனில், ஆண்டு திரும்பும் காலத்தில்[b] அராமின் அரசன் உனக்கு எதிராகப் படையெடுத்து வருவான்[c]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீ என்ன செய்வாய்.” எபிரேய வினை வடிவம் சொல்லுக்கு சொல் எதிர்காலத்தைக் குறிக்கிறது; இச்சூழலில், அரசன் ஆயத்தமாக என்ன செய்ய வேண்டும் என்பதைக் கருத்தில் கொள்ளும்படி கூறுவதாகவும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: “ஆண்டு திரும்பும் காலம்” என்பது போர் நடவடிக்கைகள் மீண்டும் தொடங்கும் பருவத்தைக் குறிக்கும் எபிரேய வழக்கு; சில மொழிபெயர்ப்புகள் இதை “அடுத்த இளவேனிற்காலத்தில்” என்று பொருள்விளக்கமாக வழங்குகின்றன.
    reason: cultural_note
  - marker: c
    text: பாரம்பரியமாக, “சிரியாவின் அரசன்” என்றும் மொழிபெயர்க்கப்படுகிறது; எபிரேயத்தில் “அராம்” என்று உள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: வந்து
  rationale: נגשׁ என்பது அணுகுதல் அல்லது அருகில் வருதல் என்று பொருள்படும். தமிழ்க் கதைநடையில் ‘அரசனிடம் வந்து’ என்பது இயல்பாகவும் மூலத்தின் இயக்கத்தையும் காக்கும் வகையிலும் உள்ளது.
- source_word: הַנָּבִיא
  choice: இறைவாக்கினர்
  rationale: தீர்க்கதரிசனச் செய்தியை அறிவிப்பவரைக் குறிக்கும் நபி என்ற சொல்லுக்கு, நவீனத் தரமான தமிழில் கண்ணியமாகவும் எளிதில் புரியுமாறும் ‘இறைவாக்கினர்’ பயன்படுத்தப்பட்டது.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: இஸ்ரவேலின் அரசன்
  rationale: எபிரேய இணைப்புத் தொடரை இயல்பான தமிழில் உடைமை வேற்றுமையுடன் வழங்குகிறது.
- source_word: לֵךְ
  choice: நீ போய்
  rationale: הלך என்பதன் கட்டளை வடிவின் நேரடியான பொருளைத் தருகிறது; தொடரும் கட்டளைகளோடு தமிழில் இயல்பாக இணைய ‘நீ’ சேர்க்கப்பட்டது.
- source_word: הִתְחַזַּק
  choice: உன்னை வலுப்படுத்திக்கொள்
  rationale: חזק என்பதன் ஹித்பயேல் கட்டளை வடிவிலுள்ள தற்சார்பு வலிமையைப் பாதுகாக்கிறது; வரவிருக்கும் போருக்குத் தன்னை ஆயத்தப்படுத்தும் பொருளையும் உள்ளடக்குகிறது.
- source_word: וְדַע וּרְאֵה
  choice: அறிந்து ஆராய்ந்து பார்
  rationale: ‘அறி’ மற்றும் ‘பார்’ என்ற இரு எபிரேய வினைகளின் இணைப்பை முழுவதுமாக ஒன்றாக்காமல் காக்கிறது; தமிழில் வெறும் ‘அறிந்து பார்’ என்பதைக் காட்டிலும் திட்டமிட்டு கவனிப்பதைக் ‘ஆராய்ந்து பார்’ இயல்பாக உணர்த்துகிறது.
- source_word: אֵת אֲשֶׁר תַּעֲשֶׂה
  choice: நீ என்ன செய்ய வேண்டும்
  rationale: சொல்லுக்கு சொல் வடிவம் ‘நீ என்ன செய்வாய்’ என்றாலும், சூழலில் வரவிருக்கும் தாக்குதலுக்கான நடைமுறைத் தயாரிப்பைக் குறிக்கும் ஆலோசனைப் பொருள் உள்ளது. மூலத்தின் எதிர்கால வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கட்டளைகளுக்கான காரணத்தை அறிமுகப்படுத்தும் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: לִתְשׁוּבַת הַשָּׁנָה
  choice: ஆண்டு திரும்பும் காலத்தில்
  rationale: ஆண்டின் திரும்புதல் என்ற எபிரேய வழக்கை அதிகமாக விளக்கிப் பொருளுரைக்காமல் காக்கிறது; அதன் பருவகாலப் பின்னணி அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: מֶלֶךְ אֲרָם
  choice: அராமின் அரசன்
  rationale: பிற்காலப் புவியியல் பெயரான ‘சிரியா’ என்பதைப் பதிலிடாமல், எபிரேயப் பெயரான אֲרָם என்பதை நேரடியாக ஒலிபெயர்க்கிறது.
- source_word: עֹלֶה עָלֶיךָ
  choice: உனக்கு எதிராகப் படையெடுத்து வருவான்
  rationale: போர்ச் சூழலில் עלה על என்பது ஒருவருக்கு எதிராக அணிவகுத்து அல்லது படையெடுத்து வருவதைக் குறிக்கும். தமிழில் தெளிவான இராணுவப் பொருளையும் பங்கேற்பு வடிவின் எதிர்கால முன்னறிவிப்பையும் வழங்குகிறது.
