translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. கட்டளைத் தொடரின் வலிமையும் ‘அறி/பார்’ என்ற இரட்டைச் சொல்லாட்சியும் இயன்றவரை காக்கப்பட்டுள்ளன. ‘அராம்’ என்ற மூலப்பெயர் பயன்படுத்தப்பட்டு, போர்ச் சூழல் தமிழில் தெளிவுபடுத்தப்பட்டுள்ளது. அனைத்து அடிக்குறிப்பு குறிகளும் உரையில் இடம்பெற்றுள்ளன.
