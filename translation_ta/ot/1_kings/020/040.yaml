base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/040.yaml
  text: And as your servant was busy here and there[a], he was gone. Then the king of Israel said to him, “So shall your judgment be[c][b]; you yourself have decided it.”
translation:
  language: ta
  text: உமது அடியான் இங்கும் அங்கும் வேலைகளில் ஈடுபட்டிருந்தபோது[a], அவன் இல்லை[b]. அப்போது இஸ்ரவேலின் அரசன் அவனை நோக்கி, “உன் தீர்ப்பு அப்படியே[c]; நீயே அதைத் தீர்மானித்தாய்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இங்கும் அங்கும் பல காரியங்களைச் செய்துகொண்டிருந்தபோது.” எபிரெய மரபுத்தொடர் பல திசைகளிலோ பல வேலைகளிலோ ஈடுபட்டிருப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், “அவன் இல்லை.” காவலில் இருந்த மனிதன் இனி அங்கு இல்லாதிருப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: “தீர்ப்பு” என்பதற்கு “தண்டனைத் தீர்ப்பு” அல்லது “நீதிமுடிவு” என்றும் மொழிபெயர்க்கலாம். பேசியவன் தானே கூறிய நீதிநெறி அவனுக்கே பொருந்தும் என்று அரசன் அறிவிக்கிறான்.
    reason: lexical_alternative
