base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/029.yaml
  text: And these camped opposite those for seven days[a]. Then on the seventh day the battle drew near[c][b], and the sons of Israel struck down Aram—one hundred thousand foot soldiers in one day.
translation:
  language: ta
  text: இரு படைகளும் ஒன்றுக்கொன்று எதிரே ஏழு நாட்கள் முகாமிட்டன. ஏழாம் நாளில் போர் நெருங்கியது; இஸ்ரவேலின் மகன்கள்[a] ஒரே நாளில் ஆராமின்[b] ஒரு இலட்சம் காலாட்படை வீரர்களை[c] வீழ்த்தினர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்ரவேலர்கள்.” எபிரெயத்தில் சொற்படி, “இஸ்ரவேலின் மகன்கள்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “ஆராமியர்களின்.” எபிரெயத்தில் “ஆராம்” என்பது நாட்டையோ அதன் மக்களையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “காலாட்படையினரை.” எபிரெயத்தில் சொற்படி, “காலால் நடப்பவர்கள்”; இராணுவச் சூழலில் காலாட்படை வீரர்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲנוּ
  choice: முகாமிட்டிருந்தன
  rationale: חנה என்பது முகாம் அமைத்துத் தங்குவதைக் குறிக்கிறது. ஏழு நாட்கள் நீடித்த நிலையை இயல்பான தமிழில் தெரிவிக்க இவ்வடிவம் பயன்படுத்தப்பட்டது.
- source_word: אֵלֶּה נֹכַח אֵלֶּה
  choice: இரு படைகளும் ஒன்றுக்கொன்று எதிரே
  rationale: எபிரெயத்தின் சொற்படி வடிவம் ‘இவர்கள் அவர்களுக்கு எதிரே’ என்றாலும், சூழலில் இரு படைகளே குறிக்கப்படுவதால் தெளிவான, இயல்பான தமிழில் இவ்வாறு தரப்பட்டது; எதிரெதிர் நிலை பாதுகாக்கப்படுகிறது.
- source_word: שִׁבְעַת יָמִים
  choice: ஏழு நாட்கள்
  rationale: கால அளவை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וַיְהִי בַּיּוֹם הַשְּׁבִיעִי
  choice: ஏழாம் நாளில்
  rationale: ויהי என்னும் எபிரெயக் கதைத் தொடரை தேவையற்ற பழமையான நிரப்புச் சொற்களின்றி, காலக் குறிப்பை முழுமையாகப் பாதுகாத்து வழங்குகிறது.
- source_word: וַתִּקְרַב הַמִּלְחָמָה
  choice: போர் தொடங்கியது
  rationale: சொற்படி ‘போர் நெருங்கியது’ என்றாலும், இச்சூழலில் இரு படைகளும் போரில் மோதத் தொடங்கியதை குறிக்கிறது. ‘போர் தொடங்கியது’ என்பது தெளிவான நவீனத் தமிழ்; சொற்படி உருவகம் குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וַיַּכּוּ
  choice: வீழ்த்தினார்கள்
  rationale: נכה போர்ச் சூழலில் தாக்கி வீழ்த்துவதைக் குறிக்கிறது. ‘வீழ்த்தினார்கள்’ என்பது மரண விளைவைச் சூழலுக்கேற்றவாறு உணர்த்தினாலும், ‘கொன்றார்கள்’ என்பதைவிட மூல வினையின் பரந்த பொருளை நன்றாகப் பாதுகாக்கிறது.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்கள்
  rationale: மூலத்தின் ஆண்பால் பன்மையான ‘இஸ்ரவேலின் மகன்கள்’ என்ற வடிவம் பாதுகாக்கப்படுகிறது; இங்கு அது இஸ்ரவேலின் போர்வீரர்களைக் கூட்டாகக் குறிக்கிறது.
- source_word: אֲרָם
  choice: ஆராமைச் சேர்ந்த
  rationale: אֲרָם என்ற பண்டைய இயற்பெயர் பாதுகாக்கப்படுகிறது. அதனை நவீன அரசியல் பெயரான ‘சிரியா’ என்று மாற்றாமல், அந்நாட்டு படையினருடனான தொடர்பு தமிழில் தெளிவாக்கப்படுகிறது.
- source_word: מֵאָה אֶלֶף
  choice: ஒரு இலட்சம்
  rationale: தமிழில் எண்ணைக் குறிக்கும் இயல்பான, துல்லியமான வடிவம்.
- source_word: רַגְלִי
  choice: காலாட்படை வீரர்கள்
  rationale: இராணுவச் சூழலில் நடந்து போரிடும் படைவீரர்களை இச்சொல் குறிக்கிறது; ‘காலாட்படை வீரர்கள்’ நவீன வாசகர்களுக்குத் தெளிவானது.
- source_word: בְּיוֹם אֶחָד
  choice: ஒரே நாளில்
  rationale: அனைத்தும் ஒரு நாளுக்குள் நிகழ்ந்தது என்ற எபிரெயச் சொல்லின் வலியுறுத்தலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: בְנֵי יִשְׂרָאֵל என்பதிலுள்ள ஆண்பால் வடிவம்
  choice: இஸ்ரவேலின் மகன்கள்
  alternative: இஸ்ரவேலர்கள் / இஸ்ரவேல் மக்கள்
  rationale: மூலத்தில் வெளிப்படையாக உள்ள ஆண்பால் பன்மை வடிவத்தை, குறிப்பாக ஆண் போர்வீரர்கள் இடம்பெறும் இச்சூழலில், மறைக்காமல் பாதுகாக்கிறது.
- issue: אֲרָם என்பதை இயற்பெயராகவா மக்களினப் பெயராகவா வழங்குவது
  choice: ஆராமைச் சேர்ந்த
  alternative: ஆராமியர் / சிரியர்
  rationale: மூலத்தில் உள்ள ஆராம் என்ற இயற்பெயரைத் தக்கவைத்து, இங்கு தாக்கப்பட்டவர்கள் அந்நாட்டின் காலாட்படை வீரர்கள் என்பதைத் தமிழில் தெளிவாக்குகிறது; பிற்காலப் பெயரான ‘சிரியா’ தவிர்க்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான வரலாற்றுக் கதைநடையாக வடிவமைக்கப்பட்டது. ‘இவர்கள்… அவர்கள்…’ என்ற எபிரெயச் சுட்டுப்பெயர் அமைப்பு தமிழில் குழப்பமளிக்கக்கூடியதால் ‘இரு படைகளும்’ என்று சூழலுக்கேற்றவாறு தெளிவாக்கப்பட்டது. ‘ஒரு இலட்சம்’ என்பது தமிழ்ப் பயன்பாட்டுக்கு இயல்பான எண்ணுரு.
