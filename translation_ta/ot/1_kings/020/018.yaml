translation_notes:
  register: நவீன நிலையான தமிழ்; கண்ணியமான, எளிதில் புரியும் கதைநடை. மூலத்தின் இணையான இரு நிபந்தனைகளும், இருமுறை வரும் ‘உயிரோடு பிடியுங்கள்’ என்ற கட்டளையும் காக்கப்பட்டுள்ளன.
