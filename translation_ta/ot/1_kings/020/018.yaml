  text: וַ/יֹּ֛אמֶר אִם לְ/שָׁל֥וֹם יָצָ֖אוּ תִּפְשׂ֣וּ/ם חַיִּ֑ים וְ/אִ֧ם לְ/מִלְחָמָ֛ה יָצָ֖אוּ חַיִּ֥ים תִּפְשֽׂוּ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/018.yaml
  text: And he said[a], “If they have come out for peace, seize them alive; and if they have come out for battle, seize them alive.”
translation:
  language: ta
  text: அவன், “அவர்கள் சமாதான நோக்கத்தோடு வெளியே வந்திருந்தால், அவர்களை உயிரோடு பிடியுங்கள்; அவர்கள் போரிடுவதற்காக வெளியே வந்திருந்தால், அவர்களை உயிரோடு பிடியுங்கள்” என்றான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள் சமாதானமாக வெளியே வந்திருந்தால் … அவர்கள் போருக்காக வெளியே வந்திருந்தால்.”
    reason: לְשָׁלוֹם என்பதற்கு ‘சமாதானமாக’ என்றும் לְמִלְחָמָה என்பதற்கு ‘போருக்காக’ என்றும் கொள்ளக்கூடிய சொற்பொருள் மாற்றைச் சுட்டுகிறது.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அவன் … என்றான்
  rationale: எபிரெயக் கதைநடையில் நேரடிக் கூற்றை அறிமுகப்படுத்தும் வழக்கமான வடிவம்; இயல்பான தமிழ் வாக்கிய அமைப்புக்காகக் கூற்றின் முடிவில் ‘என்றான்’ என அமைக்கப்பட்டது.
- source_word: אִם
  choice: …இருந்தால்
  rationale: இரண்டு மாற்றுச் சூழல்களையும் அறிமுகப்படுத்தும் நிபந்தனைப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: לְשָׁלוֹם
  choice: சமாதான நோக்கத்தோடு
  rationale: இங்கு שָׁלוֹם என்பது வெறும் அமைதி நிலையைக் காட்டாமல், அவர்கள் வந்ததன் அமைதியான நோக்கத்தைக் குறிக்கிறது; לְ முன்னிடைச்சொல்லின் நோக்கப் பொருளும் வெளிப்படுகிறது.
- source_word: יָצָאוּ
  choice: புறப்பட்டு வந்திருந்தால்
  rationale: பேசுகிறவனின் பார்வையில் அவர்கள் வெளியே வந்து கொண்டிருப்பதைத் தமிழில் இயல்பாகக் காட்டுகிறது; நிறைவேறிய செயலின் தற்போதைய விளைவையும் உணர்த்துகிறது.
- source_word: תִּפְשׂוּם
  choice: அவர்களை … பிடியுங்கள்
  rationale: இராணுவச் சூழலில் ஆட்களைப் பிடித்துக் காவலில் கொண்டுவரும் வலிமையான கட்டளையைத் தெளிவாகத் தருகிறது.
- source_word: חַיִּים
  choice: உயிரோடு
  rationale: அவர்கள் பிடிக்கப்பட வேண்டிய நிலையைக் குறிக்கும் வினையடைப் பயன்பாட்டை இயல்பாகப் பிரதிபலிக்கிறது.
- source_word: וְאִם
  choice: …இருந்தாலும்
  rationale: இரண்டாம் மாற்றுச் சூழலை இணைக்கிறது; இரு சூழல்களிலும் ஒரே கட்டளை என்பதால், தமிழில் ‘இருந்தாலும்’ அந்த வலியுறுத்தலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לְמִלְחָמָה
  choice: போரிடுவதற்காக
  rationale: מִלְחָמָה-வின் போர்/சண்டைப் பொருளையும் לְ-யின் நோக்கப் பொருளையும் தெளிவான நவீன தமிழில் தருகிறது.
- source_word: חַיִּים תִּפְשׂוּם
  choice: அவர்களை உயிரோடு பிடியுங்கள்
  rationale: எபிரெயத்தில் இரண்டாம் முறையாக வரும் கட்டளையைச் சுருக்காமல் மீண்டும் தருகிறது; தமிழின் இயல்பான சொல் வரிசை பயன்படுத்தப்பட்டுள்ளது.
