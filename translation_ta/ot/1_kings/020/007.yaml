translation_notes:
  register: நவீனத் தரத் தமிழில், அரசவைக் காட்சிக்கேற்ற கண்ணியமான ஆனால் சாதாரண வாசகருக்குப் புரியும் நடை. ‘தயவுசெய்து கவனித்துப் பாருங்கள்’ என்பது דְּעוּ נָא וּרְאוּ என்ற இரட்டை வலியுறுத்தலை இயல்பாகப் பாதுகாக்கிறது.
