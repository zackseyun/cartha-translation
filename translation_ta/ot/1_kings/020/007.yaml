  text: וַ/יִּקְרָ֤א מֶֽלֶךְ יִשְׂרָאֵל֙ לְ/כָל זִקְנֵ֣י הָ/אָ֔רֶץ וַ/יֹּ֨אמֶר֙ דְּעֽוּ נָ֣א וּ/רְא֔וּ כִּ֥י רָעָ֖ה זֶ֣ה מְבַקֵּ֑שׁ כִּֽי שָׁלַ֨ח אֵלַ֜/י לְ/נָשַׁ֤/י וּ/לְ/בָנַ/י֙ וּ/לְ/כַסְפִּ֣/י וְ/לִ/זְהָבִ֔/י וְ/לֹ֥א מָנַ֖עְתִּי מִמֶּֽ/נּוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/007.yaml
  text: Then the king of Israel called all the elders of the land and said, “Please know and see that this man is seeking trouble, for he sent to me for my wives, my sons, my silver, and my gold, and I did not withhold them from him.”
translation:
  language: ta
  text: அப்போது இஸ்ரவேலின் அரசன் நாட்டின் மூப்பர்கள் அனைவரையும் அழைத்து, “தயவுசெய்து இதை அறிந்துகொண்டு பாருங்கள்; இந்த மனிதன் கேடு விளைவிக்கவே நாடுகிறான். என் மனைவிகளையும் என் மகன்களையும் என் வெள்ளியையும் என் தங்கத்தையும் கேட்டு அவன் என்னிடம் ஆள் அனுப்பினான்; நான் அவனுக்கு அவற்றைக் கொடுக்க மறுக்கவில்லை” என்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָעָה
  choice: தீமை
  rationale: எபிரெயச் சொல் ‘தீமை, கேடு, துன்பம்’ ஆகிய பொருள்களைக் கொண்டது. ‘தொல்லை’ என்று மட்டும் குறுக்காமல், மூலத்தின் ஒழுக்க மற்றும் தீங்கிழைக்கும் பரப்பைத் தக்கவைக்க ‘தீமை’ பயன்படுத்தப்பட்டது.
- source_word: מְבַקֵּשׁ
  choice: நாடுகிறான்
  rationale: தொடர்ந்து தேடுதல் அல்லது நோக்கமாகக் கொண்டிருத்தல் என்ற பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: שָׁלַח אֵלַי לְ־
  choice: கேட்டு அவன் என்னிடம் ஆள் அனுப்பினான்
  rationale: சொல்லுக்கு சொல் அமைப்பான ‘என்னிடம் ... பொருட்டு அனுப்பினான்’ என்பதை விட, கோரிக்கையுடன் தூதர்களை அனுப்பிய சூழலைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וְלֹא מָנַעְתִּי מִמֶּנּוּ
  choice: நான் அவனுக்கு அவற்றை மறுக்கவில்லை
  rationale: ‘அவனிடமிருந்து தடுத்து வைக்கவில்லை’ என்ற மூலக் கருத்தை இயல்பான தமிழில் தருகிறது; முந்தைய பட்டியலே ‘அவற்றை’ என்பதன் சுட்டுப்பொருள்.
