- from: அப்போது இஸ்ரவேலின் அரசன் நாட்டின் மூப்பர்கள் அனைவரையும் அழைத்து, “தயவுசெய்து கவனித்துப் பாருங்கள்; இந்த மனிதன் தீமையையே நாடுகிறான். என் மனைவிகளையும் என் மகன்களையும் என் வெள்ளியையும் என் தங்கத்தையும் கேட்டு அவன் என்னிடம் ஆள் அனுப்பினான்; நான் அவனுக்கு அவற்றை மறுக்கவில்லை” என்றான்.
  to: அப்போது இஸ்ரவேலின் அரசன் நாட்டின் மூப்பர்கள் அனைவரையும் அழைத்து, “தயவுசெய்து இதை அறிந்துகொண்டு பாருங்கள்; இந்த மனிதன் கேடு விளைவிக்கவே நாடுகிறான். என் மனைவிகளையும் என் மகன்களையும் என் வெள்ளியையும் என் தங்கத்தையும் கேட்டு அவன் என்னிடம் ஆள் அனுப்பினான்; நான் அவனுக்கு அவற்றைக் கொடுக்க மறுக்கவில்லை” என்றான்.
  rationale: The revision preserves the Hebrew’s paired appeal to know and see, renders the hostile intent of רָעָה in context without over-specifying it as solely moral evil, and makes the final ‘did not withhold’ clause idiomatic and explicit in Tamil. No footnotes are required.
