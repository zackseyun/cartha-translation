base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/026.yaml
  text: At the turn of the year[c][b][a], Ben-hadad mustered Aram and went up to Aphek for battle with Israel.
translation:
  language: ta
  text: ஆண்டு மீண்டும் வந்தபோது[a], பென்-அதாத் அராமியப் படைகளை[b] அணிதிரட்டிக் கொண்டு, இஸ்ரவேலுடன்[c] போரிட ஆப்பெக்கிற்குப் புறப்பட்டுச் சென்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் சொல்லுக்குச் சொல், ‘ஆண்டு திரும்பியபோது.’ இது ஆண்டுச் சுழற்சி மீண்டும் வந்ததைக் குறிக்கும் மரபுத்தொடர்; சிலர் இதை ‘வசந்தகாலத்தில்’ என்று மொழிபெயர்க்கின்றனர்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் ‘அராம்’ என்று உள்ளது. அது நாட்டையோ அதன் மக்களையோ படையையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘இஸ்ரவேலுக்கு எதிராக.’ எபிரெய முன்னிடைச்சொல்லின் நேரடிப் பொருள் ‘உடன்’; இங்கு அது போர்ச் சூழலில் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִתְשׁוּבַת הַשָּׁנָה
  choice: ஆண்டு மீண்டும் வந்தபோது
  rationale: எபிரெய மொழியின் ‘ஆண்டு திரும்புதல்’ என்ற காலச்சுழற்சி மரபுத்தொடரை இயல்பான தமிழில் தருகிறது; அதைத் திட்டவட்டமாக ‘வசந்தகாலம்’ என்று பொருள் குறுக்கவில்லை.
- source_word: וַיִּפְקֹד
  choice: படைத்திரட்டி
  rationale: இராணுவச் சூழலில் פקד என்பது படைகளைத் திரட்டுதல் அல்லது அணிவகுத்துச் சரிபார்த்தல் என்னும் பொருளைத் தருகிறது; இங்கு ‘படைத்திரட்டி’ சூழலுக்கு இயல்பாகப் பொருந்துகிறது.
- source_word: אֶת אֲרָם
  choice: அராமை
  rationale: மூலத்தில் நாட்டின்/மக்களின் பெயரான ‘அராம்’ உள்ளது. இச்சூழலில் அது அராமியப் படையைக் குறிக்கக்கூடும்; அந்த இருபொருள் வாய்ப்பை முதன்மை உரை காக்கிறது.
- source_word: וַיַּעַל
  choice: புறப்பட்டுச் சென்றான்
  rationale: עלה என்பதன் அடிப்படைப் பொருள் ‘மேலே செல்லுதல்.’ தமிழில் இலக்கை நோக்கிய இராணுவ நகர்வை இயல்பாகச் சொல்ல ‘புறப்பட்டுச் சென்றான்’ எனத் தரப்பட்டுள்ளது; நில அமைப்பு பற்றிய உறுதியற்ற நுணுக்கம் சேர்க்கப்படவில்லை.
- source_word: אֲפֵקָה
  choice: ஆப்பெக்கிற்கு
  rationale: இடப்பெயருடன் சேர்ந்த திசைச்சுட்டு -ה, ஆப்பெக்கை நோக்கிய நகர்வைக் குறிக்கிறது; தமிழில் நான்காம் வேற்றுமை இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לַמִּלְחָמָה
  choice: போரிட
  rationale: מִלְחָמָה இங்கு உடனடியான போர்ச்செயலைக் குறிக்கிறது; ‘போரிட’ என்பது நோக்கத்தைத் தெளிவாகவும் சுருக்கமாகவும் தருகிறது.
- source_word: עִם יִשְׂרָאֵל
  choice: இஸ்ரவேலுடன்
  rationale: עִם என்பதன் நேரடிப் பொருள் ‘உடன்.’ போர்ச் சூழலில் இது ‘எதிராக’ என்ற உறவைக் குறித்தாலும், மூலத்தின் வடிவத்தைப் பாதுகாக்க ‘இஸ்ரவேலுடன்’ எனத் தரப்பட்டுள்ளது.
