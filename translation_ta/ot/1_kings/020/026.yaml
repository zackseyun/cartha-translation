translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் மதிப்புமிக்க நடையிலும் வடிவமைக்கப்பட்டது. ‘பென்-அதாத்,’ ‘அராம்,’ ‘ஆப்பெக்,’ ‘இஸ்ரவேல்’ ஆகியவை வேதாகமப் பெயர்களின் பரவலான தமிழ் வடிவங்களாக வைக்கப்பட்டுள்ளன. மூலத்தின் காலமரபுத் தொடர், ‘அராம்’ என்பதன் நாடு/மக்கள்/படை இருபொருள், மற்றும் עִם என்பதன் ‘உடன்/எதிராக’ நுணுக்கம் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
