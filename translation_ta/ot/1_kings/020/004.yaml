base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/004.yaml
  text: The king of Israel answered and said[a], “According to your word, my lord the king, I am yours, and all that is mine.”
translation:
  language: ta
  text: இஸ்ரவேலின் ராஜா பதிலளித்து, “உமது வார்த்தையின்படியே, என் ஆண்டவராகிய அரசே, நான் உமக்குரியவன்; எனக்குள்ள அனைத்தும் உம்முடையவை” என்றான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் ஆண்டவராகிய அரசே, நீர் சொன்னபடியே, நானும் எனக்குள்ள அனைத்தும் உம்முடையவை.”
    reason: כִּדְבָרְךָ என்பதற்கு இயல்பான மாற்றாக “நீர் சொன்னபடியே” என்பதையும், முழு வாக்கியத்தின் சுருக்கமான மாற்று அமைப்பையும் காட்டுகிறது.
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: பதிலளித்து ... என்றான்
  rationale: எபிரெய உரையாடல் அறிமுகத்தின் இரு வினைகளையும் இயல்பான நவீனத் தமிழில் தக்கவைக்கிறது; ‘பதிலளித்து’ என்பது முந்தைய கோரிக்கைக்கான மறுமொழியைத் தெளிவாக்குகிறது.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: இஸ்ரவேலின் ராஜா
  rationale: எளிய construct தொடரைத் தெளிவாகவும் வழக்கமான வேதாகமக் கதைநடைத் தமிழிலும் வழங்குகிறது.
- source_word: כִּדְבָרְךָ
  choice: உமது வார்த்தையின்படியே
  rationale: כ plus דָּבָר என்பதன் வடிவத்தையும், பணிவான ஒப்புதலின் முறையான தொனியையும் பாதுகாக்கிறது.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: என் ஆண்டவராகிய ராஜாவே
  rationale: மனித அரசனுக்குரிய மரியாதை விளியைத் தெய்வீகப் பட்டமாக மாற்றாமல் வெளிப்படுத்துகிறது.
- source_word: לְךָ אֲנִי
  choice: நான் ... உமக்குரியவன்
  rationale: உடைமை அல்லது கீழ்ப்படிதலைக் குறிக்கும் எபிரெய தத்திவ் அமைப்பைச் சுருக்கமாக வெளிப்படுத்துகிறது; இணைந்த எழுவாயால் இறுதியில் பன்மை வடிவில் அமைக்கப்பட்டுள்ளது.
- source_word: וְכָל אֲשֶׁר לִי
  choice: எனக்குள்ள அனைத்தும்
  rationale: பேசுபவருக்குச் சொந்தமான அனைத்தையும் உள்ளடக்கும் மூலத்தின் பரந்த பொருளை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: אֲדֹנִי என்பது மனித அரசனை நோக்கிய விளி
  choice: என் ஆண்டவராகிய ராஜாவே
  alternative: என் எஜமானாகிய ராஜாவே
  rationale: இங்கு குறிக்கப்படுபவர் பெனாதாத் என்னும் மனித அரசர்; ஆகவே இது அரண்மனை மரியாதைப் பட்டமாக மொழிபெயர்க்கப்பட்டதே அன்றி தெய்வீகப் பொருள் ஏற்றப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; அரசவைக்குரிய பணிவான, கண்ணியமான தொனி. ‘உமது/உமக்குரிய’ வடிவங்கள் மரியாதை ஒருமையைப் பேணுகின்றன. அடிக்குறிப்பு குறி முதன்மை உரையில் சேர்க்கப்பட்டுள்ளது.
