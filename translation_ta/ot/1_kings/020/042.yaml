source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלָ֗י/ו כֹּ֚ה אָמַ֣ר יְהוָ֔ה יַ֛עַן שִׁלַּ֥חְתָּ אֶת אִישׁ חֶרְמִ֖/י מִ/יָּ֑ד וְ/הָיְתָ֤ה נַפְשְׁ/ךָ֙ תַּ֣חַת נַפְשׁ֔/וֹ וְ/עַמְּ/ךָ֖ תַּ֥חַת עַמּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/042.yaml
  text: 'And he said to him[a], “Thus says Yahweh: Because you have let go from your hand the man I had devoted to destruction, your life shall be for his life, and your people for his people.”'
translation:
  language: ta
  text: 'அவன் அவனிடம்[a], “யாவே கூறுவது இதுவே: அழிவுக்கென நான் ஒதுக்கிவைத்த மனிதனை நீ உன் கையிலிருந்து விடுவித்ததால், உன் உயிர் அவனுடைய உயிருக்குப் பதிலாகும்; உன் மக்கள் அவனுடைய மக்களுக்குப் பதிலாகும்” என்றான்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவனிடம்” என்பது ஆகாபைக் குறிக்கிறது.
    reason: referent_clarification
lexical_decisions:
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தெய்வீக உடன்படிக்கைப் பெயரை பொதுப்பட்டமான ‘ஆண்டவர்’ என்று மாற்றாமல், தமிழில் பரவலாக அறியப்படும் பெயர்வடிவில் தருகிறது.
- source_word: יַעַן
  choice: …விடுவித்ததால்
  rationale: தீர்ப்புக்கான காரணத்தை இயல்பான நவீனத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: שִׁלַּחְתָּ ... מִיָּד
  choice: நீ உன் கையிலிருந்து விடுவித்ததால்
  rationale: பிடியில் அல்லது அதிகாரத்தில் இருந்தவரை விடுவித்தல் என்ற சூழல்சார் பொருளையும், ‘கையிலிருந்து’ என்ற எபிரெய உருவகத்தையும் காக்கிறது; மூலத்தில் இல்லாத ‘தப்பிச் செல்ல’ என்ற கருத்தைச் சேர்க்கவில்லை.
- source_word: אִישׁ חֶרְמִי
  choice: அழிவுக்கென நான் ஒதுக்கிவைத்த மனிதனை
  rationale: முதல் நபர் உரிமைப் பின்னொட்டை ‘நான்’ என்பதால் வெளிப்படுத்தி, חֵרֶם என்பதன் தெய்வீகத் தீர்ப்பின்கீழ் அழிவுக்கு ஒதுக்கப்பட்ட நிலையைத் தெளிவாகக் கூறுகிறது.
- source_word: נַפְשְׁךָ ... נַפְשׁוֹ
  choice: அவனுடைய உயிருக்கு ஈடாக உன் உயிரும்
  rationale: נֶפֶשׁ இங்கு ‘ஆத்துமா’ அல்ல, உயிரைக் குறிக்கிறது; תַּחַת என்பதன் பதிலீட்டு அல்லது ஈடுசெய்யும் கருத்தை ‘ஈடாக’ தெரிவிக்கிறது.
- source_word: עַמְּךָ תַּחַת עַמּוֹ
  choice: அவனுடைய மக்களுக்கு ஈடாக உன் மக்களும்
  rationale: முந்தைய உயிர்–உயிர் அமைப்புடன் உள்ள எபிரெய இணைநிலையைத் தமிழிலும் காக்கிறது.
- source_word: כֹּה אָמַר
  choice: கூறுவது இதுவே
  rationale: தீர்க்கதரிசனத் தூதர் வாய்ப்பாட்டை dignified ஆனாலும் இயல்பான நவீனத் தமிழில் வழங்குகிறது.
theological_decisions:
- issue: தீர்ப்புரையில் חֵרֶם சொல்லின் பொருள்
  choice: அழிவுக்கென நான் ஒதுக்கிவைத்த
  alternative: என் தடைக்குள் இருந்த / அழிவுக்குத் தீர்ப்பளிக்கப்பட்ட
  rationale: இது வெறும் தனிப்பட்ட பகைமையையோ பொதுவான மரணத் தீர்ப்பையோ அல்லாமல், தெய்வீகத் தீர்ப்பின்கீழ் அழிவுக்கு அர்ப்பணிக்கப்பட்ட அல்லது ஒதுக்கப்பட்ட நிலையைக் குறிக்கிறது. ‘ஒதுக்கிவைத்த’ என்பது முதல் நபர் பின்னொட்டையும் நோக்கத்தையும் வெளிப்படுத்துகிறது.
- issue: תַּחַת என்பதன் தீர்ப்புச் சார்ந்த பதிலீடு
  choice: ஈடாக
  alternative: பதிலாக
  rationale: உயிருக்குப் பதில் உயிர், மக்களுக்குப் பதில் மக்கள் என்ற சமச்சீர் தீர்ப்பைத் தெளிவுபடுத்துகிறது; அது எவ்வாறு நிறைவேறும் என்பதை மேலதிகமாக விளக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; தீர்க்கதரிசனத் தீர்ப்புரைக்கேற்ற கண்ணியமான நடை. எபிரெய இணைநிலையும் ‘உன் கையிலிருந்து’ என்ற உருவகமும் பாதுகாக்கப்பட்டுள்ளன. ‘விடுவித்தாய்’ என்பது செயலை மட்டும் கூறுகிறது; அவர் தப்பிச் சென்றார் என்ற மூலத்தில் இல்லாத நுணுக்கத்தைச் சேர்ப்பதில்லை.
