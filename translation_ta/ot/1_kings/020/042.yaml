revisions:
- from: 'அவன் அவனிடம்[a], “யெகோவா கூறுவது இதுவே: அழிவுக்கென நான் ஒதுக்கிவைத்த மனிதனை நீ உன் கையிலிருந்து விடுவித்ததால், அவனுடைய உயிருக்கு ஈடாக உன் உயிரும், அவனுடைய மக்களுக்கு ஈடாக உன் மக்களும் இருக்கும்” என்றான்.'
  to: 'அவன் அவனிடம்[a], “யாவே கூறுவது இதுவே: அழிவுக்கென நான் ஒதுக்கிவைத்த மனிதனை நீ உன் கையிலிருந்து விடுவித்ததால், உன் உயிர் அவனுடைய உயிருக்குப் பதிலாகும்; உன் மக்கள் அவனுடைய மக்களுக்குப் பதிலாகும்” என்றான்.'
  rationale: The revision changes only the divine-name form to align with Yahweh in the source audit trail and smooths the two final substitution clauses into direct modern Tamil. It retains the pronoun footnote, the custody metaphor “உன் கையிலிருந்து,” and the explicit ḥerem sense without adding that the captive escaped.
