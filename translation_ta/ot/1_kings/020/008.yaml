translation:
  language: ta
  text: அப்போது அனைத்து மூப்பர்களும், மக்கள் அனைவரும் அவனிடம், “கேட்காதீர்; சம்மதிக்காதீர்” என்றார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: அப்போது ... என்றார்கள்
  rationale: வய்யிக்தோல் வடிவம் கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது; நவீன தமிழில் அதன் தொடர்ச்சியை ‘அப்போது’ இயல்பாகக் காட்டுகிறது.
- source_word: אֵלָיו
  choice: அவனிடம்
  rationale: எபிரெய உரையில் பெயருக்குப் பதிலாக ஆண்பால் ஒருமைச் சுட்டுப்பெயரே உள்ளது; சூழலில் அது அரசனைக் குறித்தாலும், வசனத்தின் வெளிப்பாட்டைப் பாதுகாக்க ‘அவனிடம்’ என மொழிபெயர்க்கப்படுகிறது.
- source_word: כָּל הַזְּקֵנִים
  choice: மூப்பர்கள் அனைவரும்
  rationale: இச்சூழலில் זְקֵנִים என்பது வயதான ஆண்களை மட்டும் அல்லாமல் சமூகத் தலைவர்களான மூப்பர்களைக் குறிக்கிறது.
- source_word: וְכָל הָעָם
  choice: மக்கள் அனைவரும்
  rationale: மூப்பர்களுடன் சேர்ந்து குறிப்பிடப்படும் பரந்த மக்கள் கூட்டத்தை עָם குறிக்கிறது; ‘மக்கள் அனைவரும்’ இயல்பான தமிழ் இணை.
- source_word: אַל תִּשְׁמַע
  choice: அவன் சொல்வதைக் கேட்காதீர்
  rationale: שׁמע என்பதற்கு கேட்பது, செவிசாய்ப்பது, கீழ்ப்படிவது ஆகிய பொருள்கள் உண்டு. இங்கு கோரிக்கையை ஏற்க வேண்டாமென்ற அறிவுரை என்பதால், தமிழில் நோக்கம் தெளிவாகவும் மூலத்தின் பொருள் அகலம் ஓரளவு காக்கப்படவும் இவ்வாறு தரப்படுகிறது.
- source_word: וְלֹא תֹאבֶה
  choice: அதற்கு உடன்படாதீர்
  rationale: אבה விருப்பமாயிருத்தல் அல்லது சம்மதித்தல் என்ற பொருளைக் கொண்டது; அரசியல் கோரிக்கைக்கான மறுப்பை இங்கு ‘உடன்படாதீர்’ இயல்பாக வெளிப்படுத்துகிறது.
