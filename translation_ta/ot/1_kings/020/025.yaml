  source_fidelity: 'மொத்தத்தில் மூல எபிரெய வாக்கிய அமைப்பும் பொருளும் நன்றாகக் காக்கப்பட்டுள்ளன: படையை மீளத் திரட்டுதல், குதிரை/தேர் இழப்புகளுக்குச் சமமான மாற்றீடு, சமவெளியில் போர், உறுதியான ஒப்பீட்டுக் கூற்று, அரசன் ஆலோசனையை ஏற்றுக்கொண்டது ஆகியவை துல்லியமாக உள்ளன. ஆனால் ‘உன்னிடமிருந்து வீழ்ந்த படை’ என்பது הַנֹּפֵל מֵאוֹתָךְ என்பதன் போரில் இழந்த படை என்ற பொருளைத் தமிழில் இயல்பாகத் தரவில்லை.'
