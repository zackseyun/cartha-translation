base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/025.yaml
  text: And you, muster for yourself an army like the army that fell from you, and horse for horse and chariot for chariot; then let us fight against them on the plain. Surely we will be stronger than they are.” So he listened to their voice and did so.
translation:
  language: ta
  text: நீ உனக்காக, உன்னிடமிருந்து இழந்துபோன படையைப் போன்ற ஒரு படையைத் திரட்டு; குதிரைக்குக் குதிரையையும், தேருக்குத் தேரையும் திரட்டு. பிறகு சமவெளியில் அவர்களோடு போரிடுவோம்; நிச்சயமாக நாம் அவர்களைவிட வலிமைமிக்கவர்களாக இருப்போம்.” அவன் அவர்களுடைய பேச்சைக் கேட்டு, அவ்வாறே செய்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִמְנֶה לְךָ חַיִל
  choice: உனக்காக ... ஒரு படையை ... திரட்டு
  rationale: מנה என்பதன் அடிப்படைப் பொருள் ‘எண்ணு/நியமி’; இச்சூழலில் இழந்த படைக்கு மாற்றாகப் படையைத் திரட்டுதல் அல்லது அணிவகுத்தல் என்பதே இயல்பான பொருள்.
- source_word: כַחַיִל הַנֹּפֵל מֵאוֹתָךְ
  choice: உன்னிடமிருந்து வீழ்ந்த படையைப் போன்ற ஒரு படை
  rationale: נפל என்பதிலுள்ள ‘வீழ்ந்த’ என்ற போர்ச் சூழல் படிமத்தையும், מֵאוֹתָךְ என்பதிலுள்ள ‘உன்னிடமிருந்து/உன் பக்கத்திலிருந்து’ என்ற தொடர்பையும் காக்கிறது.
- source_word: וְסוּס כַּסּוּס וְרֶכֶב כָּרֶכֶב
  choice: குதிரைக்குக் குதிரையையும், தேருக்குத் தேரையும்
  rationale: இழந்த ஒவ்வொரு வகை இராணுவ வளத்துக்கும் சமமான மாற்றீடு என்ற எபிரெய இணை அமைப்பைச் சுருக்கமாகக் காக்கிறது.
- source_word: בַּמִּישׁוֹר
  choice: சமவெளியில்
  rationale: מִישׁוֹר என்பது இங்கு மலைப்பகுதிக்கு எதிரான தட்டையான திறந்த நிலத்தைக் குறிக்கிறது.
- source_word: אִם לֹא נֶחֱזַק מֵהֶם
  choice: நிச்சயமாக நாம் அவர்களைவிட வலிமையுள்ளவர்களாக இருப்போம்
  rationale: אִם לֹא என்ற உறுதியான சத்தியவாக்கிய நடை இங்கு வலுவான நிச்சயத்தை வெளிப்படுத்துகிறது; נֶחֱזַק מֵהֶם ஒப்பீட்டை நேரடியாகக் காக்கிறது.
- source_word: וַיִּשְׁמַע לְקוֹלָם
  choice: அவர்களுடைய பேச்சைக் கேட்டு
  rationale: சொல்லுக்கு சொல் ‘அவர்களுடைய குரலுக்குச் செவிகொடுத்தான்’; தமிழில் ஆலோசனையை ஏற்றுக்கொண்ட பொருளை இயல்பாகத் தரும் நடை.
theological_decisions:
- issue: அராமிய ஆலோசகர்களின் வெற்றி உறுதி
  choice: ‘நிச்சயமாக’ என்று அவர்களுடைய உறுதியான கூற்றாக மொழிபெயர்க்கப்பட்டது
  alternative: ‘ஒருவேளை நாம் அவர்களைவிட வலிமையாவோம்’
  rationale: எபிரெய אִם לֹא இங்கு சந்தேகத்தை அல்ல, வலியுறுத்தப்பட்ட உறுதியைக் குறிக்கிறது; அந்தக் கூற்று உரையாடுவோருடைய நம்பிக்கையாகவே விடப்பட்டுள்ளது, விவரிப்பாளரின் அங்கீகாரமாக மாற்றப்படவில்லை.
translation_notes:
  register: நவீன தரநிலைத் தமிழ்; அரசவைக் கதையாடலுக்கேற்ற மரியாதைமிக்க ஆனால் எளிதில் புரியும் நடை. மூலத்தின் இராணுவ இணை அமைப்பும் உறுதியான உரையாடல் தொனியும் காக்கப்பட்டுள்ளன.
