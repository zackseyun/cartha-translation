  text: Then the king of Israel went out and struck the horses and the chariots[a], and inflicted a great blow on Aram.
translation:
  language: ta
  text: அப்போது இஸ்ரவேல் அரசன் வெளியே சென்று, குதிரைகளையும் தேர்களையும் தாக்கி, அராமுக்கு[a] ஒரு பெரும் அடியைக் கொடுத்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அராமியர்களுக்கு.’ எபிரெயத்தில் ‘அராம்’ என்பது அராம் நாட்டையோ அதன் படைகளையோ குறிக்கலாம். சில பாரம்பரிய மொழிபெயர்ப்புகள் ‘சிரியா’ என்று வழங்குகின்றன; ஆனால் எபிரெயப் பெயர் ‘அராம்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: புறப்பட்டுச் சென்று
  rationale: יצא என்பதன் ‘வெளியே செல்/புறப்படு’ என்ற இயக்கத்தை இயல்பான தமிழ் நடையில் தருகிறது; ‘படையெடுத்துச் சென்றான்’ என்று எபிரெயத்தில் வெளிப்படையாக இல்லாத இராணுவ நுட்பத்தைச் சேர்க்கவில்லை.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: இஸ்ரவேலின் ராஜா
  rationale: எழுவாயை அடையாளப்படுத்தும் எளிய இணைப்புத் தொடரைத் தெளிவாகப் பிரதிபலிக்கிறது.
- source_word: וַיַּךְ
  choice: தாக்கி
  rationale: נכה என்பதன் விரிவான ‘அடி/தாக்கு’ பொருளைப் பேணுகிறது; இங்கேயே ‘தோற்கடித்து’ என்று முடிவை மிகைப்படுத்தவில்லை.
- source_word: הַסּוּס
  choice: குதிரைகளை
  rationale: ஒருமை வடிவம் இருந்தாலும், இராணுவச் சூழலில் இது குதிரைகளைத் தொகுதியாகக் குறிக்கிறது; ஆகவே தமிழில் பன்மை இயல்பானது.
- source_word: הָרָכֶב
  choice: தேர்களை
  rationale: רכב இங்கு தேர்களையோ தேர்ப்படையையோ தொகுதியாகக் குறிக்கிறது; ‘தேர்கள்’ என்பது சாதாரண வாசகருக்குத் தெளிவானதும் மூலத்தின் சுருக்கத்தைப் பேணுவதுமாகும்.
- source_word: בַאֲרָם
  choice: அராமுக்கு
  rationale: மூலத்திலுள்ள அராம் என்ற பெயரை ‘சிரியா’ என்று மாற்றாமல் வைத்திருக்கிறது; அரசையோ அதன் படைகளையோ குறிக்கக்கூடிய கூட்டுப் பொருள் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: מַכָּה גְדוֹלָה
  choice: ஒரு பெரும் அடியைக் கொடுத்தான்
  rationale: ‘பெரும் அடி’ என்ற மூல உருவகத்தைப் பேணி, உயிரிழப்பின் அளவையோ முழுத் தோல்வியையோ உரை கூறுவதைக் காட்டிலும் அதிகமாகக் குறிப்பிடாமல் இருக்கிறது.
