base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/006.yaml
  text: No[a], but about this time tomorrow I will send my servants to you, and they will search your house and the houses of your servants; and whatever is desirable in your eyes[b], they will put into their hands and take away.
translation:
  language: ta
  text: “இல்லை; நாளை இதே நேரத்தில் என் பணியாளர்களை உன்னிடம் அனுப்புவேன். அவர்கள் உன் வீட்டையும் உன் பணியாளர்களின் வீடுகளையும் தேடிப் பார்ப்பார்கள். உன் கண்களுக்கு விருப்பமான எல்லாவற்றையும்[a] அவர்கள் கைப்பற்றி எடுத்துச் செல்வார்கள்[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் கண்களுக்கு அருமையான எல்லாவற்றையும்”; அதாவது, நீ மிகவும் மதிக்கும் அனைத்தையும்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “தங்கள் கைகளில் வைத்து எடுத்துக்கொள்வார்கள்”; இச்சொற்றொடர் அவற்றைக் கைப்பற்றி எடுத்துச் செல்வதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: இல்லை;
  rationale: முந்தைய வரம்பை மறுத்து அச்சுறுத்தலைத் தீவிரப்படுத்தும் எதிர்மறைத் திருப்பத்தைச் சூழல் காட்டுகிறது. நவீன தமிழில் ‘இல்லை;’ என்பது அந்தத் திருத்தும் வலியுறுத்தலையும் அடுத்த கூற்றுடனான தொடர்பையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כָּעֵת מָחָר
  choice: நாளை ஏறக்குறைய இதே நேரத்தில்
  rationale: அடுத்த நாளின் இதே நேரத்தைச் சற்றே தோராயமாகக் குறிக்கும் எபிரெய காலச் சொற்றொடரைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: עֲבָדַי
  choice: என் பணியாளர்களை
  rationale: இங்கு அரசனின் கட்டளையை நிறைவேற்ற அனுப்பப்படும் ஆட்களைக் குறிக்கிறது; அவர்களது அடிமைநிலையை வலியுறுத்தாமல் அரசப் பணியில் ஈடுபடும் நபர்களை ‘பணியாளர்கள்’ இயல்பாகக் குறிக்கிறது.
- source_word: וְחִפְּשׂוּ
  choice: தேடிப் பார்ப்பார்கள்
  rationale: முழுமையாகத் தேடுதல் அல்லது ஆராய்தல் என்ற பொருளைப் பாதுகாக்கிறது; மூல வினை தானாகக் குறிப்பிடாத வன்முறையைத் தேவையின்றி கூட்டுவதில்லை.
- source_word: בֵּיתְךָ ... בָּתֵּי עֲבָדֶיךָ
  choice: உன் வீட்டையும் உன் பணியாளர்களின் வீடுகளையும்
  rationale: בַּיִת என்பதன் ‘வீடு’ என்ற உருவகத்தை இரு இணையான பகுதிகளிலும் காக்கிறது; சூழலில் முதலாவது அரச மாளிகையைக் குறிக்கக்கூடும் என்ற வாய்ப்பையும் மறுப்பதில்லை.
- source_word: כָּל מַחְמַד עֵינֶיךָ
  choice: உன் கண்களுக்கு விருப்பமான எல்லாவற்றையும்
  rationale: ஒருவருக்கு விருப்பமான, அருமையான அல்லது மதிப்புமிக்க பொருட்கள் என்ற எபிரெய மொழிப்படிமத்தை நவீன வாசகர் புரிந்துகொள்ளும் வகையில் நெருக்கமாகப் பாதுகாக்கிறது.
- source_word: יָשִׂימוּ בְיָדָם וְלָקָחוּ
  choice: அவர்கள் கைப்பற்றி எடுத்துச் செல்வார்கள்
  rationale: சொல்லுக்கு சொல் ‘தங்கள் கைகளில் வைத்து எடுத்துக்கொள்வார்கள்’ என்பதன் உடைமையாக்கி அகற்றும் பொருளை இயல்பான தமிழில் ஒருங்கிணைக்கிறது; நேரடி வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
