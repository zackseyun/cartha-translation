translation_notes:
  register: நவீன நிலையான தமிழில், நேரடியான அரச அச்சுறுத்தலுக்கேற்ற கண்ணியமான ஆனால் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘உன்’ என்ற ஒருமை உருபு எபிரெய இரண்டாம் நபர் ஒருமையைப் பாதுகாக்கிறது. மூலத்தின் கண் மற்றும் கை சார்ந்த மொழிப்படிமங்கள் பிரதான உரையிலும் அடிக்குறிப்புகளிலும் இயன்றவரை காக்கப்பட்டுள்ளன.
