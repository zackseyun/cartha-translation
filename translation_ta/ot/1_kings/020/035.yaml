reference: 1 Kings 20:35
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/אִ֨ישׁ אֶחָ֜ד מִ/בְּנֵ֣י הַ/נְּבִיאִ֗ים אָמַ֧ר אֶל רֵעֵ֛/הוּ בִּ/דְבַ֥ר יְהוָ֖ה הַכֵּ֣י/נִי נָ֑א וַ/יְמָאֵ֥ן הָ/אִ֖ישׁ לְ/הַכֹּתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/035.yaml
  text: A certain man from the sons of the prophets said to his companion by the word of Yahweh[b][a], “Please strike me.” But the man refused to strike him.
translation:
  language: ta
  text: தீர்க்கதரிசிகளின் மகன்களில் ஒருவன்[a], யாவேயின் வார்த்தையின்படி[b] தன் தோழனிடம், “தயவுசெய்து என்னை அடி” என்றான். ஆனால் அந்த மனிதன் அவனை அடிக்க மறுத்துவிட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “தீர்க்கதரிசிகளின் குழுவினரில் ஒருவன்,” அல்லது “தீர்க்கதரிசிகளின் சீடர்களில் ஒருவன்.” எபிரெயத்தில் “தீர்க்கதரிசிகளின் மகன்களில் ஒருவன்” என்று உள்ளது; இது ஒரு தீர்க்கதரிசிக் குழுவைக் குறிக்கும் வழக்கமான சொற்றொடர்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது “யாவேயின் வார்த்தையால்,” அல்லது “யாவேயின் கட்டளையின்படி.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ אֶחָד
  choice: ஒருவன்
  rationale: எபிரெயக் கதைநடையில் குறிப்பிட்ட ஒருவரை அறிமுகப்படுத்தும் இயல்பான தொடர். தொடக்க וְ-ஐ செயற்கையாக ‘மேலும்’ என்று மொழிபெயர்க்காமல், தமிழ்க் கதைநடைக்கு ஏற்றவாறு விடப்பட்டுள்ளது.
- source_word: מִבְּנֵי הַנְּבִיאִים
  choice: தீர்க்கதரிசிகளின் மகன்களில்
  rationale: ‘தீர்க்கதரிசிகளின் மகன்கள்’ என்ற எபிரெய மரபுத்தொடரின் வடிவம் முதன்மை உரையில் பாதுகாக்கப்படுகிறது; அது ஒரு தீர்க்கதரிசிக் குழுவைக் குறிக்கக்கூடும் என்பதைக் காலடிக்குறிப்பு விளக்குகிறது.
- source_word: רֵעֵהוּ
  choice: தன் தோழனிடம்
  rationale: ரֵעַ என்பது நண்பன், தோழன் அல்லது உடனிருப்பவன் எனப் பொருள்படலாம். உணர்வுபூர்வமான நெருக்கத்தை மிகைப்படுத்தாமல் ‘தோழன்’ சூழலுக்குப் பொருந்துகிறது.
- source_word: בִּדְבַר יְהוָה
  choice: யாவேயின் வார்த்தையின்படி
  rationale: இது யாவேயிடமிருந்து வந்த தீர்க்கதரிசன வார்த்தை அல்லது கட்டளையின் அதிகாரத்தைக் குறிக்கிறது. ‘வார்த்தையின்படி’ மூல மொழியின் சொல்லாட்சியையும் தமிழின் இயல்பையும் பேணுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மெய்யெழுத்துப் பெயரான YHWH, ஒரு பட்டப்பெயரால் மாற்றப்படாமல் தனிப்பெயராக ‘யாவே’ என்று ஒலிபெயர்க்கப்படுகிறது.
- source_word: הַכֵּינִי נָא
  choice: தயவுசெய்து என்னை அடி
  rationale: נכה என்பதன் நேரடிப் பொருள் ‘அடி/தாக்கு’; அடுத்த வசனத்தில் வரும் காயப்படுத்தும் விளைவை இங்கே முன்கூட்டியே சேர்க்காமல் ‘அடி’ என மொழிபெயர்க்கப்பட்டுள்ளது. נָא-வின் வேண்டுகோள் நயம் ‘தயவுசெய்து’ என்பதால் வெளிப்படுகிறது.
- source_word: וַיְמָאֵן
  choice: மறுத்துவிட்டான்
  rationale: இவ்வினைச்சொல் வெறும் தயக்கத்தை அல்ல, திட்டவட்டமான மறுப்பைக் குறிக்கிறது.
- source_word: לְהַכֹּתוֹ
  choice: அவனை அடிக்க
  rationale: முந்தைய கட்டளையில் பயன்படுத்தப்பட்ட נכה என்பதோடு சொற்பொருள் ஒற்றுமையைப் பேணுகிறது; ‘காயப்படுத்த’ என்ற விளைவை உரைக்குள் முன்கூட்டியே சேர்ப்பதில்லை.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: இவ்வசனத்தில் தனிப்பெயரான יהוה நேரடியாக உள்ளது. அதை ஒரு பட்டப்பெயரால் மாற்றாமல் ‘யாவே’ என்று வழங்குவது மூலத்தின் தனிப்பெயர் தன்மையைப் பாதுகாக்கிறது.
- issue: בְּנֵי הַנְּבִיאִים என்பதை எவ்வளவு விளக்கமாக மொழிபெயர்ப்பது
  choice: தீர்க்கதரிசிகளின் மகன்கள்
  alternative: தீர்க்கதரிசிகளின் குழுவினர் / தீர்க்கதரிசிகளின் சீடர்கள்
  rationale: இத்தொடர் ஒரு தீர்க்கதரிசிக் குழுவையோ பயிற்சி மரபைச் சேர்ந்தவர்களையோ குறிக்கலாம்; ஆனால் அந்த சமூக உறவை மூலவசனம் வெளிப்படையாகத் தீர்மானிக்காததால், அதன் உருவகம் முதன்மை உரையில் பாதுகாக்கப்பட்டு மாற்றுப் புரிதல்கள் காலடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘தீர்க்கதரிசிகளின் மகன்கள்’ என்ற மூலமொழி உருவகம் வெளிப்படைத்தன்மைக்காகத் தக்கவைக்கப்பட்டு, அதன் இயல்பான மாற்றுப் பொருள்கள் காலடிக்குறிப்பில் வழங்கப்பட்டுள்ளன. ‘அடி’ என்பது இச்சூழலில் நேரடியும் பொதுமக்களுக்கு எளிதில் புரியக்கூடியதுமான சொல்.
