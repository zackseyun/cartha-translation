base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/019.yaml
  text: 'These went out from the city: the young men of the commanders of the provinces[a], and the army that was behind them.'
translation:
  language: ta
  text: 'இவர்கள் நகரத்திலிருந்து புறப்பட்டுச் சென்றார்கள்: மாகாணங்களின் தலைவர்களின் இளைஞர்களும்[a] அவர்களுக்குப் பின்னால் இருந்த படையும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மாகாணங்களின் தலைவர்களின் பணியாளர்கள்/உதவியாளர்கள்.” எபிரேயச் சொல் נַעֲרֵי என்பது இளைஞர்களையோ தனிப்பட்ட பணியாளர்கள் அல்லது உதவியாளர்களையோ குறிக்கலாம்; இச்சூழலில் இரு கருத்துகளும் ஒன்றிணைந்திருக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: இவர்களே
  rationale: முந்தைய வசனத்தில் எண்ணப்பட்ட குழுவையே சுட்டுகிறது; ஏகார வலியுறுத்தல் எபிரெயச் சுட்டுச் சொல்லின் குறிப்புத்தன்மையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יָצְאוּ
  choice: புறப்பட்டுச் சென்றார்கள்
  rationale: நகரிலிருந்து வெளியே செல்லுதலைத் தெளிவாகக் காட்டுகிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘அணிவகுத்துச் சென்றார்கள்’ என்ற இராணுவ நுட்பத்தைச் சேர்க்கவில்லை.
- source_word: מִן הָעִיר
  choice: நகரத்திலிருந்து
  rationale: புறப்பட்ட இடத்தைக் குறிக்கும் நேரடியான, இயல்பான தமிழ் வடிவம்.
- source_word: נַעֲרֵי
  choice: இளைஞர்கள்
  rationale: נַעַר என்பதன் முதன்மையான வயதுசார் பொருளைப் பாதுகாக்கிறது; ‘பணியாளர்கள்/உதவியாளர்கள்’ என்ற சூழலுக்குப் பொருந்தக்கூடிய மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: שָׂרֵי הַמְּדִינוֹת
  choice: மாகாணங்களின் தலைவர்கள்
  rationale: שַׂר என்பது தலைவர், அதிகாரி அல்லது தளபதி எனப் பொருள்படலாம். இவர்கள் மாகாணங்களோடு தொடர்புடைய நிர்வாகத் தலைவர்கள் என்பதைக் காட்டும் பொதுவான சொல், தேவையற்ற இராணுவத் துல்லியத்தைத் தவிர்க்கிறது.
- source_word: וְהַחַיִל
  choice: படையும்
  rationale: இச்சூழலில் חַיִל ஒரு போர்ப்படையைக் குறிக்கிறது; ‘படை’ தெளிவானவும் இயல்பானவும் உள்ளது.
- source_word: אֲשֶׁר אַחֲרֵיהֶם
  choice: அவர்களுக்குப் பின்னால் வந்த
  rationale: இளைஞர்களுக்குப் பின்னால் படை இருந்ததையும் அவர்களைத் தொடர்ந்து நகர்ந்ததையும் இயல்பாக வெளிப்படுத்துகிறது.
