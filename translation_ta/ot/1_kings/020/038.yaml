  yaml_path: translation/ot/1_kings/020/038.yaml
  text: So the prophet went and stood by the road for the king[a], and disguised himself with a bandage over his eyes.
translation:
  language: ta
  text: அப்போது அந்தத் தீர்க்கதரிசி சென்று, அரசனுக்காகச் சாலையோரத்தில் நின்றான். தன் கண்கள்மேல் ஒரு கட்டைப் போட்டுத் தன்னை மாறுவேடமிட்டுக்கொண்டான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொற்றொடரைச் சொற்படியாக, “தன் கண்கள்மேல் சாம்பலுடன்” என்றும் மொழிபெயர்க்கலாம். இங்கு அது உண்மையான சாம்பலைக் குறிக்கலாம்; அல்லது சூழலின்படி, மாறுவேடத்திற்காகப் பயன்படுத்தப்பட்ட ஒரு மூடுகட்டு அல்லது கட்டைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: அப்போது ... புறப்பட்டுச் சென்று
  rationale: வாவ் தொடர்வினை கதையை அடுத்த நிகழ்வுக்கு நகர்த்துகிறது; ‘அப்போது’ இயல்பான தமிழ் கதைநடையைத் தருகிறது.
- source_word: הַנָּבִיא
  choice: அந்தத் தீர்க்கதரிசி
  rationale: எபிரெய வரையறைச் சுட்டைச் சூழலுக்கேற்ற ‘அந்த’ என்பதால் வெளிப்படுத்தி, נָבִיא என்பதற்கு தமிழில் பரவலாக அறியப்படும் சொல்லைப் பயன்படுத்துகிறது.
- source_word: וַיַּעֲמֹד
  choice: நின்றான்
  rationale: செயலை எளிமையாகக் கூறுகிறது; ‘தன்னை நிலைநிறுத்திக்கொண்டான்’ போன்ற தேவையற்ற விளக்கத்தைத் தவிர்க்கிறது.
- source_word: לַמֶּלֶךְ
  choice: அரசனுக்காக
  rationale: தீர்க்கதரிசி அரசனைச் சந்திக்க அவன் வரும் பாதையில் நிலைகொண்ட நோக்கத்தைத் தெரிவிக்கிறது; எனினும் மூலத்தின் சுருக்கத்தன்மையைப் பாதுகாக்கிறது.
- source_word: עַל הַדָּרֶךְ
  choice: சாலையோரத்தில்
  rationale: அரசன் கடந்து வரும் இடத்தில் தீர்க்கதரிசி நின்ற காட்சியை இயல்பான தமிழில் தருகிறது.
- source_word: וַיִּתְחַפֵּשׂ
  choice: தன்னை மாறுவேடமிட்டுக்கொண்டான்
  rationale: ஹித்பயேல் வடிவம் ஒருவர் தன்னை அடையாளம் தெரியாதபடி மாற்றிக்கொள்வதைக் குறிக்கிறது.
- source_word: בָּאֲפֵר
  choice: ஒரு கட்டைப் போட்டுத்
  rationale: אֵפֶר வழக்கமாக ‘சாம்பல்’ எனப் பொருள்பட்டாலும், ‘கண்கள்மேல்’ என்ற உடனடிச் சூழலும் அடையாளம் மறைக்கும் செயலும் முகத்தை மூடும் கட்டு என்ற அரிதான பொருளுக்கு இடமளிக்கின்றன; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: עַל עֵינָיו
  choice: தன் கண்கள்மேல்
  rationale: மூலத்தின் உடற்பகுதி குறிப்பை நேரடியாகவும் இயல்பாகவும் வைத்திருக்கிறது.
