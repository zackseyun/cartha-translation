  text: וַ/יֹּ֜אמֶר לְ/מַלְאֲכֵ֣י בֶן הֲדַ֗ד אִמְר֞וּ לַֽ/אדֹנִ֤/י הַ/מֶּ֨לֶךְ֙ כֹּל֩ אֲשֶׁר שָׁלַ֨חְתָּ אֶל עַבְדְּ/ךָ֤ בָ/רִֽאשֹׁנָה֙ אֶעֱשֶׂ֔ה וְ/הַ/דָּבָ֣ר הַ/זֶּ֔ה לֹ֥א אוּכַ֖ל לַ/עֲשׂ֑וֹת וַ/יֵּֽלְכוּ֙ הַ/מַּלְאָכִ֔ים וַ/יְשִׁבֻ֖/הוּ דָּבָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/009.yaml
  text: So he said to the messengers of Ben-hadad[a], “Say to my lord the king, ‘All that you sent to your servant the first time, I will do; but this thing I cannot do.’” And the messengers went and brought back word to him.
translation:
  language: ta
  text: 'அப்போது அவன் பென்-அதாதின் தூதர்களிடம், “என் ஆண்டவராகிய அரசரிடம் சொல்லுங்கள்: ‘நீர் முதலில் உமது அடியேனுக்குச் சொல்லியனுப்பிய அனைத்தையும் நான் செய்வேன்; ஆனால் இந்தக் காரியத்தை என்னால் செய்ய முடியாது’” என்றான். தூதர்கள் சென்று, அவனிடம் மறுமொழியைத் தெரிவித்தார்கள்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַלְאֲכֵי
  choice: தூதர்கள்
  rationale: அரசியல் சூழலில் இது இயற்கைக்கு அப்பாற்பட்ட தூதர்களை அல்ல, அரசரின் செய்தியைக் கொண்டுசெல்லும் பிரதிநிதிகளைக் குறிக்கிறது.
- source_word: בֶן הֲדַד
  choice: பென்-அதாத்
  rationale: எபிரெய தனிப்பெயரின் ஒலிப்பெயர்ப்பு; தமிழ் வேதாகமப் பயன்பாட்டுக்கு ஏற்ற வடிவம்.
- source_word: אִמְרוּ
  choice: சொல்லுங்கள்
  rationale: நேரடியான பன்மை ஏவல் வினையின் பொருளையும் மரியாதையான நவீன தமிழ் நடையையும் காக்கிறது.
- source_word: לַאדֹנִי הַמֶּלֶךְ
  choice: என் ஆண்டவராகிய அரசரிடம்
  rationale: அரசவைக்குரிய பணிவான மரியாதைப் பட்டத்தைத் தெய்வீகக் குறிப்பாக மாற்றாமல் வெளிப்படுத்துகிறது.
- source_word: כֹּל אֲשֶׁר שָׁלַחְתָּ
  choice: நீர் ... சொல்லியனுப்பிய அனைத்தையும்
  rationale: שׁלח என்பதன் ‘அனுப்புதல்’ கருத்தைச் செய்தி அனுப்பும் இச்சூழலில் இயல்பான தமிழாகத் தருகிறது; ‘கோரிய’ என்று விளக்கமாகத் தீர்மானிப்பதைத் தவிர்க்கிறது.
- source_word: עַבְדְּךָ
  choice: உமது அடியேன்
  rationale: அரசரிடம் தன்னைத் தாழ்த்திக் கூறும் வழக்கமான அரசியல் மொழியை இயல்பான மரியாதைத் தமிழில் காட்டுகிறது; அடிமை நிலையை அளவுக்கு மீறி வலியுறுத்தவில்லை.
- source_word: בָרִאשֹׁנָה
  choice: முதலில்
  rationale: முந்தைய செய்தியைச் சுட்டும் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: אֶעֱשֶׂה
  choice: நான் செய்வேன்
  rationale: எபிரெய வினையின் நேரடியான வலிமையைக் காக்கிறது; இணங்குதல் என்பது சூழலில் புரிகிறது.
- source_word: וְהַדָּבָר הַזֶּה
  choice: ஆனால் இந்தக் காரியத்தை
  rationale: דָּבָר என்பதன் இச்சூழலுக்குரிய ‘காரியம்/விஷயம்’ என்ற பரந்த பொருளைக் காக்கிறது; ‘கோரிக்கை’ என்று மிகையாக விளக்கவில்லை.
- source_word: לֹא אוּכַל לַעֲשׂוֹת
  choice: என்னால் செய்ய முடியாது
  rationale: இயலாமையைத் தெளிவாகவும் இயல்பான நவீன தமிழிலும் தெரிவிக்கிறது.
- source_word: וַיְשִׁבֻהוּ דָּבָר
  choice: அவனிடம் மறுமொழியைத் தெரிவித்தார்கள்
  rationale: ‘ஒரு வார்த்தை/பதிலைத் திருப்பிக் கொண்டுவந்தார்கள்’ என்ற எபிரெய மரபுத்தொடரின் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
