translation_notes:
  register: நவீன நிலையான தமிழ்; அரசவைக்குரிய பணிவும் நேரடியான உரையாடல் நடையும் காக்கப்பட்டுள்ளன. மூலத்தின் இரட்டை நேரடி உரை தெளிவாகப் பேணப்பட்டுள்ளது. இவ்வசனத்தில் விளக்கம் தேவைப்படும் முக்கிய இறையியல் சிக்கல் இல்லை; דָּבָר என்பதன் சூழல்சார் பரந்த தன்மை ‘காரியம்’ மற்றும் ‘மறுமொழி’ எனத் தனித்தனியாக இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது.
