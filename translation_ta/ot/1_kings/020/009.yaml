  naturalness: நவீன நிலையான தமிழில் வாசிப்பு இயல்பாகவும் தெளிவாகவும் உள்ளது. ‘என் ஆண்டவராகிய அரசர்,’ ‘உமது அடியேன்,’ ஆகியவை அரசவைக்குரிய பணிவான பதிவைச் சரியாகக் காக்கின்றன; நேரடி மேற்கோளின் அமைப்பும் தெளிவானது.
