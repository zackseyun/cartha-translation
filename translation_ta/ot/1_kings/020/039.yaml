base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/039.yaml
  text: As the king was passing by[a], he cried out to the king and said, “Your servant went out into the midst of the battle, and behold, a man turned aside and brought a man to me and said, ‘Guard this man. If he is ever missing, then your life shall be for his life[b], or you shall weigh out a talent of silver.’”
translation:
  language: ta
  text: அரசன் அவ்வழியாகச் சென்றுகொண்டிருந்தபோது, அவன் அரசனை நோக்கிக் கூக்குரலிட்டு, “உமது அடியேன் போரின் நடுவே சென்றேன். இதோ, ஒருவன் வழிவிலகி, ஒரு மனிதனை என்னிடம் அழைத்து வந்து, ‘இந்த மனிதனைக் காவல் செய். இவன் எப்படியாவது காணாமற்போனால்[a], இவனுடைய உயிருக்கு ஈடாக உமது உயிர் இருக்கும்[b]; அல்லது ஒரு தாலந்து வெள்ளியை எடைபோட்டுக் கொடுக்க வேண்டும்[c]’ என்றான்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இவன் நிச்சயமாகக் காணாமல் போனால்” / “இவனைப் பற்றிய கணக்கு எவ்வகையிலாவது இல்லாமற்போனால்.” எபிரெயத்தில் வினையெச்சமும் அதே வேர்ச்சொல்லின் வினைமுற்றும் இணைந்து கருத்தை வலியுறுத்துகின்றன.
    reason: lexical_alternative
  - marker: b
    text: சொல்லெழுத்தாக, “உமது உயிர் அவன் உயிரின் இடத்தில் இருக்கும்”; இது பதிலீட்டைக் குறிக்கும் சட்டச் சூத்திரம்.
    reason: lexical_alternative
  - marker: c
    text: “தாலந்து” என்பது பண்டைக்காலத்தின் பெரிய எடை அலகு; இங்கு அந்த எடையளவு வெள்ளி குறிக்கப்படுகிறது.
    reason: historical_context
lexical_decisions:
- source_word: עֹבֵר
  choice: கடந்து சென்றுகொண்டிருந்தபோது
  rationale: வַיְהִי என்பதுடன் வரும் நிகழ்காலப் பெயரெச்சம் பின்னணியில் நீடித்துக்கொண்டிருந்த செயலைக் குறிக்கிறது; இந்தத் தமிழ் வடிவம் அந்த நீடித்த தன்மையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: צָעַק
  choice: கூக்குரலிட்டு
  rationale: இவ்வினைச்சொல் உரத்த, அவசரமான அழைப்பைக் குறிக்கிறது; சூழலுக்குரிய தீவிரத்தை அளவுக்கு மீறாமல் தெரிவிக்கிறது.
- source_word: עַבְדְּךָ
  choice: உமது அடியேன்
  rationale: அரசனிடம் ஒருவர் தம்மைத் தாழ்த்திக் குறிப்பிடும் அரசவை மரபுச் சொல்லாக இது பொருத்தமானது; அடிமை என்ற சமூக நிலையைக் கட்டாயமாகக் குறிப்பதில்லை.
- source_word: בְּקֶרֶב הַמִּלְחָמָה
  choice: போரின் நடுவே
  rationale: קֶרֶב குறிக்கும் போரின் மையப்பகுதி அல்லது கடுமையான களச்சூழலைச் சுருக்கமாகவும் தெளிவாகவும் காக்கிறது.
- source_word: וְהִנֵּה
  choice: அப்போது
  rationale: எபிரெயச் சொல் நிகழ்வைத் திடீரெனவும் தெளிவாகவும் முன்வைக்கிறது. நவீன தமிழில் செயற்கையாக ஒலிக்கும் ‘இதோ’ என்பதற்குப் பதிலாக ‘அப்போது’ கதைநடையின் திருப்பத்தை இயல்பாகக் காட்டுகிறது.
- source_word: אִישׁ סָר
  choice: ஒரு மனிதன் விலகி வந்து
  rationale: סוּר என்பதன் அடிப்படை விலகுதல் அல்லது வழியிலிருந்து திரும்புதல் என்ற பொருளைக் காக்கிறது; அடுத்த செயலில் அவன் பேசுபவரிடம் வந்தது சூழலால் தெளிவாகிறது.
- source_word: וַיָּבֵא אֵלַי אִישׁ
  choice: வேறொரு மனிதனை என்னிடம் கொண்டுவந்து
  rationale: இரண்டாவது אִישׁ முதலாவது மனிதனிலிருந்து வேறுபட்ட நபர் என்பதையும், அவன் பேசுபவரின் காவலில் ஒப்படைக்கப்பட்டதையும் தெளிவாக்குகிறது.
- source_word: שְׁמֹר
  choice: காவல் செய்
  rationale: இராணுவச் சூழலில் ஒருவரைப் பொறுப்புடன் கண்காணித்துக் காப்பதைக் குறிக்கும் கட்டளையை நேரடியாக வெளிப்படுத்துகிறது.
- source_word: אִם הִפָּקֵד יִפָּקֵד
  choice: இவன் எப்படியாவது காணாமற்போனால்
  rationale: ஒரே வேர்ச்சொல்லின் வினையெச்ச–வினை அமைப்பு தரும் வலியுறுத்தலை ‘எப்படியாவது’ வெளிப்படுத்துகிறது; காணாமல் போதல் அல்லது கணக்கில் இல்லாமற்போதல் என்ற உண்மையான பொருள் விரிவை அடிக்குறிப்பு காக்கிறது.
- source_word: נַפְשְׁךָ תַּחַת נַפְשׁוֹ
  choice: இவனுடைய உயிருக்கு ஈடாக உன் உயிர் இருக்கும்
  rationale: נֶפֶשׁ இங்கு ‘ஆத்துமா’ அல்ல, உயிரைக் குறிக்கிறது; תַּחַת காட்டும் சட்டரீதியான பதிலீட்டு அமைப்பைத் தீர்த்துவிடாமல் காக்கிறது.
- source_word: כִּכַּר כֶּסֶף
  choice: ஒரு தாலந்து வெள்ளி
  rationale: כִּכַּר என்பது பண்டைய எடை அலகு; மரபாக அறியப்பட்ட ‘தாலந்து’ என்ற வடிவம் மூலத்தின் அளவீட்டுச் சொல்லைக் காக்கிறது.
- source_word: תִּשְׁקוֹל
  choice: நிறுத்துக் கொடுக்க வேண்டும்
  rationale: வெள்ளி நாணயமாக அல்லாமல் எடையால் செலுத்தப்பட்ட concrete imagery-ஐ ‘நிறுத்தல்’ காக்கிறது; ‘கொடுக்க வேண்டும்’ என்பதால் தமிழில் பொருள் இயல்பாகிறது.
theological_decisions:
- issue: נֶפֶשׁ என்பதன் பொருள்
  choice: உயிர்
  alternative: ஆத்துமா
  rationale: இது காவலில் இருந்த மனிதன் தப்பினால் காவலாளியின் உயிரை மாற்றீடாகக் கோரும் சட்டச் சூழல். ஆகவே உடல் வாழ்வு/உயிர் என்பதே பொருத்தம்; தனித்த ஆன்மீகக் கூறு இங்கு நோக்கமல்ல.
- issue: தண்டனையின் பதிலீட்டு மொழி
  choice: இவனுடைய உயிருக்கு ஈடாக உன் உயிர் இருக்கும்
  alternative: இவனுக்காக நீ உயிரால் செலுத்த வேண்டும்
  rationale: மூலத்தின் சுருக்கமான சட்டச் சூத்திரத்தையும் அதன் பதிலீட்டு வலிமையையும் காக்கிறது; அதன் செயல்முறையை விளக்கி உரையில் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், அரசனிடம் பேசுவதற்குரிய மரியாதையும் கதைப்பகுதியின் சட்ட–இராணுவத் தீவிரமும் காக்கப்பட்டுள்ளன. ‘உமது அடியேன்’ போன்ற உயர்நடைச் சொல் சூழலுக்காக மட்டும் பயன்படுத்தப்பட்டுள்ளது; மற்ற வாக்கிய அமைப்பு பொதுவாசகருக்கு இயல்பாக வைக்கப்பட்டுள்ளது. ஆங்கில ஆலோசனை உரையில் [a] குறி தவறாக ‘king was passing by’ என்பதுடன் அமைந்திருந்தாலும், அதன் அடிக்குறிப்பு אִם הִפָּקֵד יִפָּקֵד பற்றியது என்பதால் தமிழில் உரிய இடத்தில் பொருத்தப்பட்டுள்ளது.
