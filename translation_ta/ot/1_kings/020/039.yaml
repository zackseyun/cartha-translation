revisions:
- from: அரசன் அவ்வழியாகக் கடந்து சென்றுகொண்டிருந்தபோது, அவன் அரசனை நோக்கிக் கூக்குரலிட்டு, “உமது அடியேன் போரின் நடுவே சென்றேன். அப்போது ஒரு மனிதன் விலகி வந்து, வேறொரு மனிதனை என்னிடம் கொண்டுவந்து, ‘இந்த மனிதனைக் காவல் செய். இவன் எப்படியாவது காணாமற்போனால்[a], இவனுடைய உயிருக்கு ஈடாக உன் உயிர் இருக்கும்[b]; இல்லையெனில் ஒரு தாலந்து வெள்ளியை நிறுத்துக் கொடுக்க வேண்டும்[c]’ என்றான்.”
  to: அரசன் அவ்வழியாகச் சென்றுகொண்டிருந்தபோது, அவன் அரசனை நோக்கிக் கூக்குரலிட்டு, “உமது அடியேன் போரின் நடுவே சென்றேன். இதோ, ஒருவன் வழிவிலகி, ஒரு மனிதனை என்னிடம் அழைத்து வந்து, ‘இந்த மனிதனைக் காவல் செய். இவன் எப்படியாவது காணாமற்போனால்[a], இவனுடைய உயிருக்கு ஈடாக உமது உயிர் இருக்கும்[b]; அல்லது ஒரு தாலந்து வெள்ளியை எடைபோட்டுக் கொடுக்க வேண்டும்[c]’ என்றான்.”
  rationale: The revision preserves the Hebrew narrative and legal ambiguity while correcting the alternative penalty, regularizing respectful address, and using idiomatic Tamil for silver weighed out as payment. It also slightly smooths the background narrative expression without weakening its durative sense.
