- from: அராம்[a] அரசனான பென்-அதாத் தன் படை முழுவதையும் திரட்டினான்.[b] முப்பத்திரண்டு அரசர்களும் குதிரைகளும் தேர்களும் அவனுடன் இருந்தன. பின்பு அவன் புறப்பட்டுச் சென்று, சமாரியாவை முற்றுகையிட்டு அதற்கு எதிராகப் போரிட்டான்.
  to: அராம்[a] அரசனான பென்-அதாத் தன் படை முழுவதையும், அவனுடன் இருந்த முப்பத்திரண்டு அரசர்களையும், குதிரைகளையும் தேர்களையும் திரட்டினான்.[b] பின்பு அவன் மேலே சென்று சமாரியாவை முற்றுகையிட்டு, அதற்கு எதிராகப் போரிட்டான்.
