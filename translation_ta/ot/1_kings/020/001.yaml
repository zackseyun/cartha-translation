base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/001.yaml
  text: Ben-hadad king of Aram gathered all his army[a], and thirty-two kings with him, and horses and chariots[b]; then he went up and besieged Samaria and fought against it.
translation:
  language: ta
  text: அராம்[a] அரசனான பென்-அதாத் தன் படை முழுவதையும், அவனுடன் இருந்த முப்பத்திரண்டு அரசர்களையும், குதிரைகளையும் தேர்களையும் திரட்டினான்.[b] பின்பு அவன் மேலே சென்று சமாரியாவை முற்றுகையிட்டு, அதற்கு எதிராகப் போரிட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அராம்’ என்பது எபிரெய இடப்பெயர்; மரபாக ‘சிரியா’ என்று மொழிபெயர்க்கப்படுகிறது.
    reason: alternative_reading
  - marker: b
    text: எபிரெய உரை இவ்வாக்கியத்தை ‘மேலும்’ அல்லது ‘மற்றும்’ என மொழிபெயர்க்கக்கூடிய ஓர் இணைப்புச் சொல்லுடன் தொடங்குகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בֶן הֲדַד
  choice: பென்-அதாத்
  rationale: பெயர் எபிரெய உச்சரிப்பை நெருக்கமாகப் பின்பற்றி ஒலிபெயர்க்கப்பட்டது. தொடக்க ו தனியாக மொழிபெயர்க்கப்படாமல், தமிழின் இயல்பான கதைநடையில் விடப்பட்டது; அதன் நேரடி வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: מֶלֶךְ אֲרָם
  choice: அராம் அரசனான
  rationale: אֲרָם என்பதைக் காலப்பிந்தைய புவியியல் பெயரான ‘சிரியா’ என்று மாற்றாமல், எபிரெய இடப்பெயராகவே வழங்குகிறது.
- source_word: קָבַץ אֶת כָּל חֵילוֹ
  choice: தன் படை முழுவதையும் திரட்டினான்
  rationale: קבץ என்பது திரட்டுதல் அல்லது ஒன்றுகூட்டுதல்; חַיִל இச்சூழலில் படைத்திறனை அல்ல, ஒட்டுமொத்த இராணுவப் படையைக் குறிக்கிறது.
- source_word: וּשְׁלֹשִׁים וּשְׁנַיִם מֶלֶךְ אִתּוֹ
  choice: முப்பத்திரண்டு அரசர்களும் ... அவனுடன் இருந்தனர்
  rationale: அந்த அரசர்கள் பென்-அதாத்துடன் வந்த கூட்டாளிகள் என்பதை இயல்பான தமிழில் வெளிப்படுத்துகிறது; எபிரெய இணைப்பின் தொடர்ச்சியும் காக்கப்படுகிறது.
- source_word: וְסוּס וָרָכֶב
  choice: குதிரைகளும் தேர்களும் அவனுடன் இருந்தன
  rationale: எபிரெயில் ஒருமைத் தொகுப்புச் சொற்களாக வரும் குதிரை, தேர் ஆகியவை தமிழில் இயல்பாகப் பன்மையில் வழங்கப்பட்டுள்ளன.
- source_word: וַיַּעַל
  choice: பின்பு அவன் புறப்பட்டுச் சென்று
  rationale: עלה என்பதன் அடிப்படைப் பொருள் ‘மேலே செல்லுதல்’; இங்கு இராணுவ முன்னேற்றத்தைக் குறிக்கும் சூழலில், இலக்கு அல்லது உயர்நிலை பற்றிய தேவையற்ற விளக்கத்தைச் சேர்க்காமல் இயல்பான தமிழில் வழங்கப்பட்டுள்ளது. ‘பின்பு’ தொடர்ச்சியான நிகழ்வைக் காட்டுகிறது.
- source_word: וַיָּצַר עַל שֹׁמְרוֹן
  choice: சமாரியாவை முற்றுகையிட்டு
  rationale: צור על என்ற இராணுவச் சொற்றொடருக்கு நேரான, வழக்கிலுள்ள தமிழ் இணை ‘முற்றுகையிடுதல்’ ஆகும்.
- source_word: וַיִּלָּחֶם בָּהּ
  choice: அதற்கு எதிராகப் போரிட்டான்
  rationale: לחם உடன் வரும் ב எதிரான போர்ச் செயலைக் குறிக்கிறது; ‘போரிட்டான்’ தாக்குதலின் தன்மையை மிகைப்படுத்தாமல் வினையின் பொதுவான பொருளைக் காக்கிறது.
