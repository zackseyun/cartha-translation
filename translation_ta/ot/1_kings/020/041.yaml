base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/041.yaml
  text: Then he quickly removed the bandage from over his eyes[a], and the king of Israel recognized him, that he was one of the prophets.
translation:
  language: ta
  text: அப்போது அவன் தன் கண்கள்மேல் இருந்த கட்டுத்துணியை[a] விரைவாக அகற்றினான். அவன் தீர்க்கதரிசிகளில் ஒருவன் என்பதை இஸ்ரயேலின் ராஜா அடையாளம் கண்டுகொண்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல் הָאֲפֵר சிலரால் மரபாக ‘சாம்பல்’ என்று புரிந்துகொள்ளப்படுகிறது. ஆனால் இச்சூழலில் அது வேடமறைப்பதற்காகக் கண்கள்மேல் அணிந்திருந்த ஒரு மறைப்பு அல்லது கட்டுத்துணியைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַהֵר
  choice: விரைவாக
  rationale: מהר என்ற வினை அவசரத்தையும் வேகத்தையும் குறிக்கிறது; ‘விரைவாக’ என்பது கதையோட்டத்தில் இயல்பாக அந்தப் பொருளைத் தருகிறது.
- source_word: וַיָּסַר
  choice: அகற்றினான்
  rationale: இங்கு இந்த வினை மேலிருந்த ஒன்றை நீக்குவதைக் குறிக்கிறது; ‘அகற்றினான்’ என்பது தெளிவான நவீனத் தமிழ்.
- source_word: הָאֲפֵר
  choice: கட்டுத்துணியை
  rationale: இந்தச் சொல் வழக்கமாக ‘சாம்பல்’ என்று புரிந்துகொள்ளப்பட்டாலும், 1 இராஜாக்கள் 20:38–41 சூழலில் கண்கள்மேல் மறைப்பாக அணிந்து பின்னர் அகற்றக்கூடிய பொருளைக் குறிக்கிறது. ‘கட்டுத்துணி’ அதன் செயல்பாட்டை இயல்பாக வெளிப்படுத்துகிறது; சொற்பொருள் மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: מֵעַל עֵינָיו
  choice: தன் கண்கள்மேல் இருந்த
  rationale: מֵעַל என்பது ‘மேலிருந்து’ என்ற இடவியல் நுணுக்கத்தைக் கொண்டது; தமிழில் பொருளின் இருப்பிடத்தை ‘கண்கள்மேல் இருந்த’ என்று இயல்பாகக் காட்டுகிறது. உடைமைப் பின்னொட்டு காரணமாக ‘தன்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: וַיַּכֵּר אֹתוֹ
  choice: அவனை அடையாளம் கண்டுகொண்டான்
  rationale: הכיר என்பது ஒருவரை அறிந்து அடையாளம் காண்பதைக் குறிக்கிறது; ‘அடையாளம் கண்டுகொண்டான்’ தமிழ்க் கதையாடலில் தெளிவாக உள்ளது.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: இஸ்ரயேலின் ராஜா
  rationale: எபிரெயக் கூட்டு அமைப்பைத் தெளிவாகவும் மரியாதையான பொதுத் தமிழ் நடையிலும் தருகிறது.
- source_word: כִּי
  choice: என்பதை
  rationale: இங்கு כִּי காரணத்தைக் காட்டாமல், ராஜா அறிந்துகொண்ட செய்தியின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது; தமிழில் ‘என்பதை’ அதனை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מֵהַנְּבִאִים
  choice: தீர்க்கதரிசிகளில் ஒருவன்
  rationale: מן இங்கு ஒரு குழுவில் உறுப்பினராக இருப்பதைக் குறிக்கும் பகுதிப்பொருளில் வருகிறது; ‘தீர்க்கதரிசிகளில் ஒருவன்’ அதனைத் தெளிவாகக் காட்டுகிறது.
- source_word: הוּא
  choice: ஒருவன் என்பதை
  rationale: எபிரெயில் வெளிப்படையான இணைப்பு வினையில்லாத பெயர்ச்சொல் வாக்கியம் உள்ளது; தமிழில் அடையாளம் காணப்பட்ட உள்ளடக்கமாக இயல்பாக அமைக்கப்பட்டுள்ளது.
