  register: நவீனத் தரத் தமிழில், மரியாதைக்குரிய ராஜாவை நோக்கி ‘நீர்/உமது/உம்முடன்’ என்ற ஒருமை மரியாதை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. வாக்கியம் கண்ணியமாகவும் சாதாரண வாசகர்களுக்குப் புரியும்படியும் அமைக்கப்பட்டுள்ளது; எபிரெயத்தின் மறுப்பு வலிமையும் இணைநடையும் பாதுகாக்கப்பட்டுள்ளன.
