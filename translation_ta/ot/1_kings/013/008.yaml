base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/008.yaml
  text: But the man of God said to the king[a], “If you were to give me half your house, I would not go with you, nor would I eat bread or drink water in this place.”
translation:
  language: ta
  text: ஆனால் தேவனுடைய மனிதன் ராஜாவிடம், “நீர் உமது வீட்டின் பாதியை எனக்குக் கொடுத்தாலும்[a], நான் உம்முடன் வரமாட்டேன்; இந்த இடத்தில் அப்பம் உண்ணவும் தண்ணீர் குடிக்கவும் மாட்டேன்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் நேரடியாக, “உமது வீட்டின் பாதி.” இந்தச் சொற்றொடர் மிகப் பெரிய வெகுமதியையோ சொத்தின் பெரும் பகுதியையோ குறிக்கலாம்; மொழிபெயர்ப்பு மூலத்தின் நேரடி சொல்லாட்சியைத் தக்கவைக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  choice: தேவனுடைய மனிதன்
  rationale: இது தேவனால் நியமிக்கப்பட்ட தூதரைக் குறிக்கும் வழக்கமான எபிரெயச் சொற்றொடர். ‘தேவனுடைய தீர்க்கதரிசி’ என்று விளக்கமாக்காமல், மூலத்தின் தனித்துவமான சொல்லாட்சியைப் பாதுகாக்கிறது.
- source_word: אִם תִּתֶּן לִי אֶת חֲצִי בֵיתֶךָ
  choice: நீர் உமது வீட்டில் பாதியை எனக்குக் கொடுத்தாலும்
  rationale: நிறைவேறினாலும் முடிவு மாறாது என்ற வலுவான நிபந்தனையை ‘கொடுத்தாலும்’ இயல்பாக வெளிப்படுத்துகிறது; ‘வீட்டில் பாதி’ என்ற எபிரெய உருவகத்தையும் தக்கவைக்கிறது.
- source_word: בֵיתֶךָ
  choice: உமது வீடு
  rationale: בַּיִת என்பதற்கு வீடு, வீட்டார், உடைமை அல்லது அரண்மனைச் சொத்து போன்ற பொருள்கள் இருக்கலாம். இங்கு பெரும் வெகுமதியைக் குறிக்கக்கூடியதாக இருந்தாலும், மூலத்தின் திட்டமிட்ட சொல்லாட்சியைத் தீர்மானமாக விரிவுபடுத்தாமல் ‘வீடு’ என வைக்கப்பட்டுள்ளது.
- source_word: לֹא אָבֹא עִמָּךְ
  choice: நான் உம்முடன் வரமாட்டேன்
  rationale: ஆழ்மொழியில் ‘வருதல்’ என்ற திசைநிலையைக் காத்து, ராஜாவின் அழைப்புக்கு அளிக்கப்படும் உறுதியான மறுப்பை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: לֹא אֹכַל לֶחֶם
  choice: அப்பம் உண்ணவும் மாட்டேன்
  rationale: לֶחֶם பொதுவாக உணவு அல்லது சாப்பாட்டையும் குறிக்கலாம்; ‘அப்பம்’ என்பது மூலச் சொல்லின் நேரடி உருவத்தைப் பாதுகாக்கிறது.
- source_word: לֹא אֶשְׁתֶּה מַיִם
  choice: தண்ணீர் குடிக்கவும் மாட்டேன்
  rationale: மூலத்தின் இணை அமைப்பையும் தெளிவான பொருளையும் இயல்பான தமிழில் தருகிறது.
- source_word: בַּמָּקוֹם הַזֶּה
  choice: இந்த இடத்தில்
  rationale: ‘இங்கே’ என்பதைவிட, மூலத்திலுள்ள இடப்பெயரும் சுட்டுச் சொல்லும் அளிக்கும் வலியுறுத்தலை நெருக்கமாகப் பாதுகாக்கிறது.
