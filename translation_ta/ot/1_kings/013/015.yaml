base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/015.yaml
  text: Then he said to him[a], “Come home with me and eat bread.”
translation:
  language: ta
  text: அப்போது அவன் அவரிடம், “என்னுடன் வீட்டுக்கு வந்து உணவருந்துங்கள்” என்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றான்
  rationale: வாவ் தொடர்வினை கதைநிகழ்வை முன்னெடுத்துச் செல்கிறது; நவீனத் தமிழில் ‘அப்போது’ அதன் தொடர்ச்சியை இயல்பாகக் காட்டுகிறது.
- source_word: אֵלָיו
  choice: அவரிடம்
  rationale: முன்னிலைச் சொல் மற்றும் மூன்றாம் நபர் ஆண்பால் ஒருமை பின்னொட்டின் இயல்பான தமிழாக்கம்; சூழலில் தேவனுடைய மனிதரைக் குறிக்க மரியாதை ஒருமை பயன்படுத்தப்படுகிறது.
- source_word: לֵךְ אִתִּי
  choice: என்னுடன் ... வந்து
  rationale: לֵךְ என்பதன் அடிப்படைப் பொருள் ‘போ’; ஆனால் பேச்சாளர் தன்னுடன் தன் வீட்டுக்கு அழைக்கும் சூழலில் தமிழில் ‘என்னுடன் வந்து’ என்பதே இயல்பான அழைப்புமுறை.
- source_word: הַבָּיְתָה
  choice: வீட்டுக்கு
  rationale: ‘வீடு’ என்ற சொல்லுடன் சேர்ந்த திசைகாட்டும் ה, வீட்டை நோக்கிய இயக்கத்தைக் குறிக்கிறது. ‘என் வீடு’ என்பது சூழலால் உணரப்பட்டாலும் மூலத்தில் உடைமை வெளிப்படையாக இல்லை.
- source_word: וֶאֱכֹל לָחֶם
  choice: உணவு அருந்தும்
  rationale: לָחֶם அடிப்படையில் ‘அப்பம்’ என்றாலும், இங்கு அது பொதுவாக உணவு அல்லது உணவுவேளையைக் குறிக்கலாம். மரியாதை ஒருமை அழைப்பில் ‘உணவு அருந்தும்’ என்பது நவீனத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் உள்ளது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான மரியாதை ஒருமையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய அழைப்பின் சுருக்கமும் நேர்மையும் காக்கப்பட்டுள்ளன; ‘அப்பம் சாப்பிடும்’ என்பதற்குப் பதிலாக இச்சூழலில் அதன் விரிவான பொருளை இயல்பாக வெளிப்படுத்த ‘உணவு அருந்தும்’ தேர்ந்தெடுக்கப்பட்டது.
