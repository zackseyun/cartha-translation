  verdict: revise
  source_fidelity: The narrative sequencing, indirect object, invitation, and directional sense of ‘houseward’ are conveyed accurately. Rendering לֶחֶם as ‘food/a meal’ is contextually defensible, but a note should retain the Hebrew’s more specific wording, ‘bread.’
  naturalness: The draft’s honorific imperative ‘உணவு அருந்தும்’ is not standard modern Tamil imperative usage. ‘உணவருந்துங்கள்’ is natural, polite, and preserves the invitation’s concise form. ‘வீட்டுக்கு வந்து’ is idiomatic in this context.
  terminology: No doctrinal terminology is involved. Honorific reference to the man of God (‘அவரிடம்’) fits the immediate context and is consistent with modern Tamil register.
  issues:
  - severity: medium
    issue: The imperative ‘உணவு அருந்தும்’ is grammatically/register-wise unsuitable for a modern polite invitation.
    rationale: Modern standard Tamil normally uses the honorific imperative ending ‘-ுங்கள்’; ‘உணவருந்துங்கள்’ gives the intended respectful invitation without altering the sense.
  - severity: low
    issue: The Hebrew noun לֶחֶם (‘bread’) is broadened in the main text without a note.
    rationale: ‘Food/a meal’ is a valid contextual sense, but a lexical footnote should preserve the source wording and its possible broader metonymic use.
