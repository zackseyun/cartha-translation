base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/014.yaml
  text: So he went after the man of God and found him sitting under the terebinth[a], and he said to him, “Are you the man of God who came from Judah?” And he said, “I am.”
translation:
  language: ta
  text: அவன் தேவனுடைய மனிதரைப் பின்தொடர்ந்து சென்று, அவர் ஒரு டெரிபிந்த் மரத்தின் கீழ் உட்கார்ந்திருப்பதைக் கண்டான்.[a] அவன் அவரிடம், “யூதாவிலிருந்து வந்த தேவனுடைய மனிதர் நீர்தானா?” என்று கேட்டான். அதற்கு அவர், “நான்தான்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒரு ஓக் மரத்தின் கீழ்.” எபிரெயச் சொல் אֵלָה இன்னும் குறிப்பாக டெரிபிந்த் வகை மரத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ אַחֲרֵי
  choice: பின்தொடர்ந்து சென்று
  rationale: הלך אחרי என்ற சொற்றொடர் ஒருவருக்குப் பின்னால் அவரைத் தேடிச் செல்வதைக் குறிக்கிறது. சூழலிலுள்ள தொடர்ச்சியான பயணத்தையும் நோக்கமுள்ள பின்தொடர்தலையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אִישׁ הָאֱלֹהִים
  choice: தேவனுடைய மனிதர்
  rationale: இது இப்பகுதி முழுவதும் பயன்படுத்தப்படும் நிலையான எபிரெயத் தலைப்பு. ‘தேவனுடைய தீர்க்கதரிசி’ என்று அலுவலை விளக்கிப் பொருள்கொள்ளாமல், மூலத்தின் வடிவத்தைப் பாதுகாக்கிறது.
- source_word: וַיִּמְצָאֵהוּ
  choice: அவரைக் கண்டான்
  rationale: מצא என்ற வினை கதைநடையில் பொதுவாக ‘கண்டுபிடித்தல்/காணுதல்’ என்று பொருள்படும்; இங்கு இயல்பான தமிழில் ‘கண்டான்’ போதுமானது.
- source_word: יֹשֵׁב
  choice: உட்கார்ந்திருப்பதை
  rationale: அவர் கண்டுபிடிக்கப்பட்ட தருணத்திலிருந்த உடல் நிலையைக் குறிக்கும் வினையெச்சம்; ‘உட்கார்ந்திருப்பது’ நேரடியான சூழற்பொருள்.
- source_word: תַּחַת הָאֵלָה
  choice: ஒரு கருங்காலி மரத்தின் கீழ்
  rationale: אֵלָה என்பது பொதுவாக terebinth மரத்தைக் குறிக்கிறது. தமிழில் வாசகருக்குப் புரியும் தாவரவியல் பெயராக ‘கருங்காலி மரம்’ பயன்படுத்தப்பட்டு, மாற்றுப் பெயர் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: הַאַתָּה
  choice: நீர்தானா?
  rationale: வினாவிடைத் துகளுடன் வந்த தனிப்பெயர் அடையாளத்தை உறுதிசெய்யும் கேள்வியாக உள்ளது. மரியாதை ஒருமையுடன் ‘நீர்தானா?’ என்பது இயல்பான, கண்ணியமான தமிழ்.
- source_word: אֲשֶׁר בָּאתָ מִיהוּדָה
  choice: யூதாவிலிருந்து வந்த
  rationale: மனிதரை அவர் வந்த இடத்தால் அடையாளப்படுத்தும் தொடர்புச் சொற்றொடர்; מן என்பதன் இடப்பொருளை ‘-இலிருந்து’ துல்லியமாகத் தருகிறது.
- source_word: אָנִי
  choice: நான்தான்
  rationale: எபிரெயத்தில் வினையில்லாமல் ‘நான்’ எனும் சுருக்கமான உறுதிப்பதில் உள்ளது. தமிழில் கேள்விக்கான இயல்பான அடையாள உறுதிப்பதில் ‘நான்தான்’.
theological_decisions:
- issue: אִישׁ הָאֱלֹהִים என்ற தலைப்பின் மொழிபெயர்ப்பு
  choice: தேவனுடைய மனிதர்
  alternative: தேவனுடைய தீர்க்கதரிசி
  rationale: மூலத்தில் உள்ள பரந்த, அங்கீகரிக்கப்பட்ட தலைப்பை நேரடியாகப் பாதுகாக்கிறது; ‘தீர்க்கதரிசி’ என்று குறிப்பிட்ட அலுவலை மொழிபெயர்ப்புக்குள் சேர்ப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. வயதான தீர்க்கதரிசி தேவனுடைய மனிதரிடம் பேசுவதால் ‘நீர்/அவர்’ என்னும் மரியாதை ஒருமை அமைக்கப்பட்டுள்ளது; கதைசொல்லியில் பின்தொடர்ந்த நபருக்கு ‘அவன்’ பயன்படுத்தப்பட்டுள்ளது. அடிக்குறிப்பு குறி தொடர்புடைய மரப்பெயர் வாக்கியத்துக்குப் பின் இடப்பட்டுள்ளது.
