translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் எளிமையும் கொண்ட கதைநடை. நேர்பேச்சில் இயல்பான தமிழ் வாக்கிய ஒழுங்கு பயன்படுத்தப்பட்டுள்ளது; ‘அப்பம்’ போன்ற மூலத்தின் முக்கியச் சொற்கள் தக்கவைக்கப்பட்டுள்ளன.
