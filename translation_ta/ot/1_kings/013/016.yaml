source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר לֹ֥א אוּכַ֛ל לָ/שׁ֥וּב אִתָּ֖/ךְ וְ/לָ/ב֣וֹא אִתָּ֑/ךְ וְ/לֹֽא אֹ֣כַל לֶ֗חֶם וְ/לֹֽא אֶשְׁתֶּ֤ה אִתְּ/ךָ֙ מַ֔יִם בַּ/מָּק֖וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/016.yaml
  text: And he said[a], “I cannot return with you or go with you, and I will not eat bread or drink water with you in this place.”
translation:
  language: ta
  text: அவர், “நான் உன்னோடு திரும்பி வரவோ உன்னோடு போகவோ முடியாது; இந்த இடத்தில் உன்னோடு அப்பம் சாப்பிடவோ தண்ணீர் குடிக்கவோ மாட்டேன்” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அதற்கு அவர் … என்றார்
  rationale: எபிரெயக் கதைநடையின் wayyiqtol வடிவை இயல்பான நவீனத் தமிழ் நேர்பேச்சு அமைப்பில் தருகிறது; சூழலில் இது பதிலுரையாக இருப்பதால் ‘அதற்கு’ பொருத்தமானது.
- source_word: לֹא אוּכַל
  choice: என்னால் … முடியாது
  rationale: மறுப்புடன் வரும் יכל இயலாமையைக் குறிக்கிறது; தமிழில் ‘முடியாது’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: לָשׁוּב
  choice: திரும்பி வர
  rationale: שׁוב என்பதன் ‘திரும்புதல்’ என்ற அடிப்படைப் பொருளைத் தக்கவைத்து, அழைப்பவருடன் மீண்டும் செல்வதைத் தமிழில் இயல்பாகக் கூறுகிறது.
- source_word: וְלָבוֹא
  choice: போக
  rationale: בוא சூழலின்படி வருதல் அல்லது போதலைக் குறிக்கலாம். இங்கு மற்றவருடன் அவரது இடத்திற்குச் செல்லும் இயக்கம் என்பதால் ‘போக’ இயல்பானது; எபிரெயத்தில் கட்டாயமாக ‘உள்ளே’ என்ற பொருள் இல்லை.
- source_word: וְלֹא אֹכַל לֶחֶם
  choice: அப்பம் சாப்பிடவோ … மாட்டேன்
  rationale: לֶחֶם என்பதை பொதுவான ‘உணவு’ என்று விரிவுபடுத்தாமல் ‘அப்பம்’ எனப் பாதுகாக்கிறது; சுற்றியுள்ள வசனங்களின் மறுமொழியுடனும் பொருந்துகிறது.
- source_word: וְלֹא אֶשְׁתֶּה ... מַיִם
  choice: தண்ணீர் குடிக்கவோ மாட்டேன்
  rationale: ‘தண்ணீர்’ என்ற நேரடிப் பொருளைத் தக்கவைத்து, இணையான எதிர்மறை வினைகளைத் தமிழில் இயல்பான ‘-வோ … -வோ மாட்டேன்’ அமைப்பில் இணைக்கிறது.
- source_word: אִתָּךְ / אִתְּךָ
  choice: உன்னோடு
  rationale: இரு வடிவங்களும் ‘உன்னோடு’ என்று பொருள்படும்; அவற்றின் இலக்கணப் பாலின வேறுபாட்டை நவீனத் தமிழின் இரண்டாம் நபர் ஒருமை வடிவத்தில் இயல்பாக வெளிப்படுத்த முடியாததால் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: בַּמָּקוֹם הַזֶּה
  choice: இந்த இடத்தில்
  rationale: இடத்தைக் குறிக்கும் எபிரெயச் சொற்றொடரை நேரடியாகவும் இயல்பாகவும் தருகிறது.
