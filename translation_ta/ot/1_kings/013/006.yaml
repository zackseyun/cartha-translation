- from: அப்போது ராஜா இறைமனிதனிடம், “தயவுசெய்து உன் இறைவனாகிய யாவேயின் தயவை மன்றாடி[a], என் கை பழைய நிலைக்குத் திரும்பும்படி எனக்காக வேண்டிக்கொள்” என்று கூறினான். இறைமனிதனும் யாவேயின் தயவை மன்றாடினான்; ராஜாவின் கை அவனுக்குத் திரும்பக் கிடைத்து, முன்பிருந்தபடியே ஆனது.
  to: அப்போது ராஜா இறைவனுடைய மனிதனிடம், “தயவுசெய்து உன் இறைவனாகிய யாவேயின் தயவை மன்றாடி[a], என் கை மீண்டும் பழைய நிலைக்கு வரும்படி எனக்காக வேண்டிக்கொள்” என்று கூறினான். இறைவனுடைய மனிதனும் யாவேயின் தயவை மன்றாடினான்; ராஜாவின் கை மீண்டும் பழைய நிலைக்கு வந்தது.
  rationale: The revision retains the Hebrew idiom’s sense of entreating Yahweh's favor and the king's distancing phrase “your God.” It replaces the unclear restoration wording with idiomatic Tamil that explicitly conveys the hand's return to its former condition, while using a transparent rendering of the title “man of God.”
