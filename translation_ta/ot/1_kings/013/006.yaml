base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/006.yaml
  text: Then the king answered and said to the man of God[a], “Please entreat the favor of Yahweh your God, and pray for me, that my hand may be restored to me.” So the man of God entreated the favor of Yahweh, and the king’s hand was restored to him and became as it was before.
translation:
  language: ta
  text: அப்போது ராஜா இறைவனுடைய மனிதனிடம், “தயவுசெய்து உன் இறைவனாகிய யாவேயின் தயவை மன்றாடி[a], என் கை மீண்டும் பழைய நிலைக்கு வரும்படி எனக்காக வேண்டிக்கொள்” என்று கூறினான். இறைவனுடைய மனிதனும் யாவேயின் தயவை மன்றாடினான்; ராஜாவின் கை மீண்டும் பழைய நிலைக்கு வந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேயின் ஆதரவை நாடி.” இந்த எபிரெய மரபுத்தொடரின் சொற்பொருள், “யாவேயின் முகத்தை மன்றாடி” என்பதாகும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: அப்போது ... என்று கூறினான்
  rationale: எபிரெயக் கதைநடையில் வழக்கமான இரட்டை வினைச்சொல்லைத் தமிழில் சொற்சுமையின்றி இயல்பாக வெளிப்படுத்துகிறது; சூழலில் இது ராஜாவின் மறுமொழி என்பதை ‘அப்போது’ காட்டுகிறது.
- source_word: אִישׁ הָאֱלֹהִים
  choice: இறைமனிதன்
  rationale: ‘இறைவனுடைய மனிதன்’ என்ற தீர்க்கதரிசனப் பட்டத்தை ‘தீர்க்கதரிசி’ என்று விளக்கி மாற்றாமல், இயல்பான சுருக்கமான தமிழில் காக்கிறது.
- source_word: חַל ... אֶת־פְּנֵי יְהוָה / וַיְחַל ... אֶת־פְּנֵי יְהוָה
  choice: யாவேயின் தயவை மன்றாடு / யாவேயின் தயவை மன்றாடினான்
  rationale: ‘முகத்தை மன்றாடுதல்’ என்ற எபிரெய மரபுத்தொடரின் பொருள் ஒருவரின் தயவை நாடி மன்றாடுவது. ‘சமாதானப்படுத்து’ என்பது இச்சூழலைவிட அதிகமான பரிகாரப் பொருளைச் சேர்க்கக்கூடும்.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், எபிரெய நான்கெழுத்துப் பெயரின் பரவலான தமிழ் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֱלֹהֶיךָ
  choice: உன் இறைவனாகிய
  rationale: ராஜா யாவேயை இறைமனிதனுடைய இறைவன் என்று குறிப்பிடும் இரண்டாம் நபர் ஒருமையை அப்படியே காக்கிறது.
- source_word: וְהִתְפַּלֵּל בַּעֲדִי
  choice: எனக்காக வேண்டிக்கொள்
  rationale: பிறருக்காகச் செய்யப்படும் விண்ணப்ப ஜெபத்தை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: וְתָשֹׁב יָדִי אֵלָי / וַתָּשָׁב יַד־הַמֶּלֶךְ אֵלָיו
  choice: என் கை பழைய நிலைக்குத் திரும்பும்படி / ராஜாவின் கை அவனுக்குத் திரும்பக் கிடைத்து
  rationale: ‘கை திரும்புதல்’ என்ற மூல உருவகத்தை ஓரளவு காத்தபடியே, முந்தைய பாதிப்பிலிருந்து கை மீண்டதைக் தெளிவாக்குகிறது.
- source_word: וַתְּהִי כְּבָרִאשֹׁנָה
  choice: முன்பிருந்தபடியே ஆனது
  rationale: கை தனது முந்தைய நிலைக்கு முழுமையாக மீண்டதைத் தெளிவான, இயல்பான தமிழில் கூறுகிறது.
theological_decisions:
- issue: ராஜா யாவேயை ‘உன் இறைவன்’ என்று குறிப்பிடுதல்
  choice: ‘உன் இறைவனாகிய யாவே’ என்று இரண்டாம் நபர் வடிவத்தையே வைத்தல்
  alternative: ‘நம் இறைவனாகிய யாவே’
  rationale: ராஜாவின் சொற்களில் காணப்படும் இடைவெளியையும் இறைமனிதனுக்கு யாவேயோடு உள்ள சிறப்பான தொடர்பையும் மூலத்தில் உள்ளபடியே காக்கிறது; இல்லாத உடன்படிக்கை ஒற்றுமையை உரையில் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘இறைமனிதன்’ என்ற மூலப் பட்டமும் ‘யாவே’ என்ற தனிப்பெயரும் காக்கப்பட்டுள்ளன; ராஜாவின் நேரடி பேச்சில் உள்ள ஒருமை வடிவங்களும் தேவையற்ற இறையியல் விளக்கமின்றி தக்கவைக்கப்பட்டுள்ளன.
