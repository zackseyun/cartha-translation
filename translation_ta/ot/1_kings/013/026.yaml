  text: וַ/יִּשְׁמַ֣ע הַ/נָּבִיא֮ אֲשֶׁ֣ר הֱשִׁיב֣/וֹ מִן הַ/דֶּרֶךְ֒ וַ/יֹּ֨אמֶר֙ אִ֣ישׁ הָ/אֱלֹהִ֣ים ה֔וּא אֲשֶׁ֥ר מָרָ֖ה אֶת פִּ֣י יְהוָ֑ה וַ/יִּתְּנֵ֨/הוּ יְהוָ֜ה לָ/אַרְיֵ֗ה וַֽ/יִּשְׁבְּרֵ֨/הוּ֙ וַ/יְמִתֵ֔/הוּ כִּ/דְבַ֥ר יְהוָ֖ה אֲשֶׁ֥ר דִּבֶּר לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/026.yaml
  text: When the prophet who had brought him back from the way heard it[a], he said, “It is the man of God who rebelled against the word of Yahweh; therefore Yahweh gave him to the lion, and it mauled him and killed him, according to the word of Yahweh that he spoke to him.”
translation:
  language: ta
  text: அவனை வழியிலிருந்து திரும்ப அழைத்துவந்த தீர்க்கதரிசி இதைக் கேள்விப்பட்டபோது, “யாவேவின் வார்த்தைக்குக் கீழ்ப்படியாமல் நடந்துகொண்ட தேவனுடைய மனிதன் அவர்தான்.[a] அதனால் யாவே அவரைச் சிங்கத்திடம் ஒப்புக்கொடுத்தார்; யாவே அவரிடம் சொன்ன வார்த்தையின்படியே, அது அவரைக் குதறிக் கொன்றது” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில் சொற்சார்ந்து, “யாவேவின் வாய்க்கு எதிராகக் கலகம் செய்தவன்.” இதை “யாவேவின் கட்டளையை மீறியவன்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֱשִׁיבוֹ מִן־הַדֶּרֶךְ
  choice: அவனை வழியிலிருந்து திரும்ப அழைத்துவந்த
  rationale: שׁוב என்பதன் Hiphil வடிவிலுள்ள காரணவினைப் பொருளையும், דֶּרֶךְ என்ற கதையோட்டத்தின் ‘வழி’ உருவகத்தையும் இயல்பான தமிழில் காக்கிறது.
- source_word: אִישׁ הָאֱלֹהִים
  choice: தேவனுடைய மனிதன்
  rationale: இது தெய்வீகப் பணிக்காக அனுப்பப்பட்டவரைக் குறிக்கும் தொடர்ச்சியான கதைப்பட்டம்; அதனை விளக்கிச் சுருக்காமல் நேரடியாகக் காக்கிறது.
- source_word: מָרָה אֶת־פִּי יְהוָה
  choice: யாவேவின் வார்த்தைக்குக் கீழ்ப்படியாமல் நடந்துகொண்ட
  rationale: מָרָה என்பதன் எதிர்ப்பு அல்லது கீழ்ப்படியாமை உணர்வையும், ‘யாவேவின் வாய்’ என்ற எபிரெய மரபுத்தொடரின் பேசப்பட்ட கட்டளைப் பொருளையும் இயல்பான தமிழில் தருகிறது; சொற்சார்ந்த வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் வரும் தனிப்பெயரான நான்கெழுத்துத் திருப்பெயரை ஒரு பட்டமாக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: וַיִּתְּנֵהוּ ... לָאַרְיֵה
  choice: அவனைச் சிங்கத்திடம் ஒப்புக்கொடுத்தார்
  rationale: נתן + ל இங்கு சிங்கத்தின் அதிகாரத்திற்குள் ஒருவரை ஒப்படைத்தல் என்ற பொருளைக் கொண்டதால், ‘ஒப்புக்கொடுத்தார்’ என்பது பொருத்தமான இயல்பான தமிழ்.
- source_word: וַיִּשְׁבְּרֵהוּ
  choice: அவனைக் குதறி
  rationale: שׁבר என்பதன் அடிப்படைப் பொருள் ‘உடைத்தல்’; சிங்கம் எழுவாயாக உள்ள இச்சூழலில் வன்மையாகத் தாக்கி உடலைச் சிதைத்தல் என்ற பொருளை ‘குதறி’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וַיְמִיתֵהוּ
  choice: கொன்றது
  rationale: מות என்பதன் Hiphil வடிவமான ‘சாகச் செய்தல்/கொல்லுதல்’ என்பதை நேரடியாக வழங்குகிறது.
- source_word: כִּדְבַר יְהוָה אֲשֶׁר דִּבֶּר לוֹ
  choice: யாவே அவனிடம் சொன்ன வார்த்தையின்படியே
  rationale: முன்னர் யாவே அறிவித்த வார்த்தை நிறைவேறியதைச் சுருக்கமாகவும் தெளிவாகவும் காட்டுகிறது; பிரதிப்பெயரின் குறிப்பு தமிழில் தெளிவுபடுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரை தனிப்பெயரைப் பயன்படுத்துவதால், அதை பொதுப்பட்டமாக மாற்றாமல் ஒலிபெயர்த்துள்ளது.
- issue: פִּי יְהוָה என்ற மரபுத்தொடர்
  choice: யாவேவின் வார்த்தை
  alternative: யாவேவின் வாய் / யாவேவின் கட்டளை
  rationale: சொல்லப்பட்ட தெய்வீகக் கட்டளையைக் குறிக்கும் எபிரெய மரபுத்தொடரை இயல்பான தமிழில் வழங்குகிறது; ‘வாய்’ என்ற மூல உருவமும் ‘கட்டளை’ என்ற பொருளும் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- issue: சிங்கத்திடம் ஒப்புக்கொடுத்தவர் யார் என்பதற்கான உரையின் வலியுறுத்தல்
  choice: யாவே அவனைச் சிங்கத்திடம் ஒப்புக்கொடுத்தார்
  alternative: அவன் சிங்கத்திடம் அகப்பட்டான்
  rationale: மூல உரை நிகழ்வை யாவேவின் நேரடி செயலாகக் கூறுகிறது; அந்த இறையியல் வலியுறுத்தலை மென்மைப்படுத்தாமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘தேவனுடைய மனிதன்’ என்ற கதைப்பட்டம் தொடர்ச்சிக்காகக் காக்கப்பட்டுள்ளது; ‘குதறிக் கொன்றது’ இரு எபிரெய வினைகளின் வன்முறை மற்றும் மரணம் ஆகிய தனித்த கூறுகளையும் சுருக்கமாகப் பாதுகாக்கிறது.
