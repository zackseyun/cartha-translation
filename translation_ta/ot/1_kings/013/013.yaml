  text: And he said to his sons[a], “Saddle the donkey for me.” So they saddled the donkey for him, and he rode on it.
translation:
  language: ta
  text: அவன் தன் மகன்களிடம், “எனக்காகக் கழுதைக்குச் சேணம் பூட்டுங்கள்” என்றான். அவர்கள் அவனுக்காகக் கழுதைக்குச் சேணம் பூட்டினார்கள்; அவன் அதன்மேல் ஏறிச் சென்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֶל־בָּנָיו
  choice: அவன் தன் மகன்களிடம் ... என்றான்
  rationale: வழக்கமான எபிரெயக் கதைத் தொடரை இயல்பான நவீனத் தமிழில் தருகிறது; בָּנָיו என்பது ஆண்பால் பன்மை என்பதால் ‘மகன்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: חִבְשׁוּ לִי הַחֲמוֹר
  choice: எனக்காகக் கழுதைக்குச் சேணம் பூட்டுங்கள்
  rationale: חבש என்பது இச்சூழலில் சவாரிக்காக விலங்குக்குச் சேணம் பூட்டுவதைக் குறிக்கிறது. கட்டளையின் பன்மை வடிவமும் மரியாதையற்றதாக ஒலிக்காமல் இயல்பாகத் தக்கவைக்கப்பட்டுள்ளது.
- source_word: וַיַּחְבְּשׁוּ לוֹ הַחֲמוֹר
  choice: அவர்கள் அவனுக்காகக் கழுதைக்குச் சேணம் பூட்டினார்கள்
  rationale: கட்டளையில் வந்த அதே வினை நிறைவேற்றப்பட்டதைத் தெளிவாகக் காட்ட அதே தமிழ்ச் சொல்லாட்சி மீண்டும் பயன்படுத்தப்பட்டுள்ளது.
- source_word: וַיִּרְכַּב עָלָיו
  choice: அவன் அதன்மேல் ஏறிச் சென்றான்
  rationale: רכב על என்பது விலங்கின்மேல் ஏறிச் சவாரி செய்வதைக் குறிக்கிறது. தமிழில் ‘அதன்மேல் ஏறிச் சென்றான்’ என்பது செயலை இயல்பாகவும் முழுமையாகவும் தெரிவிக்கிறது.
