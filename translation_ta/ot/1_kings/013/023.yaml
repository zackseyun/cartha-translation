translation_notes:
  register: நவீனச் செந்தமிழ் நடை பயன்படுத்தப்பட்டுள்ளது. ‘இறைவாக்கினர்’ என்ற பெயர்ச்சொல்லை இவ்வசனத்தில் மீண்டும் வெளிப்படையாகச் சேர்க்காமல், உறவுச் சொற்றொடரும் மரியாதைப் பன்மைச் சுட்டுப்பெயர்களும் இரு நபர்களின் பங்குகளைத் தெளிவாக்குகின்றன. எபிரெயக் கதைநடையின் தொடர்ச்சி தமிழில் இயல்பான காலவாக்கியமாக வழங்கப்பட்டுள்ளது.
