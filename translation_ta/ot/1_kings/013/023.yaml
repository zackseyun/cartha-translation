base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/023.yaml
  text: And it happened[a], after he had eaten bread and after he had drunk, that he saddled the donkey for him, for the prophet whom he had brought back.
translation:
  language: ta
  text: அவர் அப்பம் உண்டு, குடித்து முடித்தபின், அவரைத் திரும்ப அழைத்து வந்தவர்[a], அந்த இறைவாக்கினருக்காகக் கழுதைக்குச் சேணம் பூட்டினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவரைத் திரும்பிவரச் செய்தவர்.”
    reason: שׁוב என்பதன் Hiphil வடிவிலுள்ள காரணவினைப் பொருளை இன்னும் சொற்சொல்லாகக் காட்டும் மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: וַיְהִי
  choice: …முடித்தபின்
  rationale: இது அடுத்த நிகழ்வை அறிமுகப்படுத்தும் எபிரெயக் கதைநடை வடிவம். தமிழில் தனியே ‘அது நிகழ்ந்தது’ என்று கூறுவதைவிட, காலத் தொடரை ‘…பின்’ என்ற இயல்பான அமைப்பில் வெளிப்படுத்துவது பொருத்தமானது.
- source_word: אַחֲרֵי אָכְלוֹ לֶחֶם
  choice: அவர் அப்பம் உண்டு
  rationale: לֶחֶם என்பதைக் கைவிடாமல் ‘அப்பம்’ என்று வெளிப்படுத்துகிறது; infinitive construct உடனான காலத் தொடர்பு அடுத்துள்ள ‘முடித்தபின்’ என்பதில் நிறைவு பெறுகிறது.
- source_word: וְאַחֲרֵי שְׁתוֹתוֹ
  choice: குடித்து முடித்தபின்
  rationale: முந்தைய காலச் சொற்றொடருக்கு இணையான தொடரை இயல்பான தமிழில் தருகிறது. எபிரெயத்தில் குடித்தது என்ன என்பது சொல்லப்படாததால் எந்தப் பானமும் சேர்க்கப்படவில்லை.
- source_word: וַיַּחֲבָשׁ
  choice: சேணம் பூட்டினார்
  rationale: இந்தச் சூழலில் חבש என்பது விலங்கின்மேல் சேணத்தைப் பொருத்துவதைக் குறிக்கிறது; ‘சேணம் பூட்டினார்’ என்பது துல்லியமும் இயல்பும் கொண்ட தமிழ் வழக்கு.
- source_word: לוֹ
  choice: அவருக்காக
  rationale: לְ־ உடனான சுட்டுப்பெயர், கழுதை மற்றவரின் பயன்பாட்டுக்காக ஆயத்தப்படுத்தப்பட்டது என்பதைக் காட்டுகிறது.
- source_word: הַחֲמוֹר
  choice: கழுதை
  rationale: חֲמוֹר என்பதற்கான பொதுவான நவீனத் தமிழ் இணைச்சொல்.
- source_word: לַנָּבִיא
  choice: அவருக்காக
  rationale: இங்கு பயனாளி ‘இறைவாக்கினர்’ என்பவர் என்பதைச் சுற்றியுள்ள உறவுச் சொற்றொடர் தெளிவுபடுத்துகிறது. தமிழில் பெயர்ச்சொல்லை மறுபடியும் சேர்ப்பது கனமாக இருப்பதால் சுட்டுப்பெயர் பயன்படுத்தப்பட்டது.
- source_word: אֲשֶׁר הֱשִׁיבוֹ
  choice: அவரைத் திரும்ப அழைத்து வந்தவர்
  rationale: שׁוב என்பதன் Hiphil வடிவம் ஒருவரைத் திரும்பச் செய்வது அல்லது திரும்ப அழைத்து வருவது எனப் பொருள்படும். சூழலில் ‘திரும்ப அழைத்து வந்தவர்’ இயல்பாக உள்ளது; செய்பவர் மாறுவதைத் தமிழில் தெளிவாகவும் காட்டுகிறது.
