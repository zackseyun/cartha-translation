translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான மற்றும் எளிதில் புரியும் கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘இதோ’ என்ற கவன ஈர்ப்புச் சொல் மூலத்தின் திடீர்த் தன்மையைத் தக்கவைக்கிறது. ‘தீர்க்கதரிசி’ என்பது பரவலாக அறியப்பட்ட வேதாகமச் சொற்பயன்பாடாக வைக்கப்பட்டுள்ளது.
