  text: וְ/הִנֵּ֧ה אֲנָשִׁ֣ים עֹבְרִ֗ים וַ/יִּרְא֤וּ אֶת הַ/נְּבֵלָה֙ מֻשְׁלֶ֣כֶת בַּ/דֶּ֔רֶךְ וְ/אֶת הָ֣/אַרְיֵ֔ה עֹמֵ֖ד אֵ֣צֶל הַ/נְּבֵלָ֑ה וַ/יָּבֹ֨אוּ֙ וַ/יְדַבְּר֣וּ בָ/עִ֔יר אֲשֶׁ֛ר הַ/נָּבִ֥יא הַ/זָּקֵ֖ן יֹשֵׁ֥ב בָּֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/025.yaml
  text: And behold[a], men were passing by and saw the corpse thrown on the road, and the lion standing beside the corpse; and they came and reported it in the city where the old prophet lived.
translation:
  language: ta
  text: இதோ, சில ஆண்கள் அவ்வழியே கடந்துபோகையில், சடலம் சாலையில் வீசப்பட்டுக் கிடப்பதையும், சிங்கம் சடலத்தின் அருகே நிற்பதையும் கண்டார்கள். அவர்கள் வந்து, முதிய தீர்க்கதரிசி வாழ்ந்த நகரத்தில் அதைப் பற்றிப் பேசினார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: எபிரேயக் கதைநடையில் திடீரெனக் கவனத்தை ஈர்க்கும் சொல்லின் வலிமையை இயல்பான நவீனத் தமிழில் தக்கவைக்கிறது.
- source_word: אֲנָשִׁים עֹבְרִים
  choice: சில ஆண்கள் அவ்வழியே கடந்துபோகையில்
  rationale: אֲנָשִׁים என்பதன் ஆண்பால் பன்மையையும், עֹבְרִים என்பதன் தொடர்நிலைச் செயலையும் வெளிப்படுத்துகிறது.
- source_word: הַנְּבֵלָה מֻשְׁלֶכֶת בַּדֶּרֶךְ
  choice: சடலம் சாலையில் வீசப்பட்டுக் கிடப்பதை
  rationale: மனித உடலைக் குறிக்கும் நְבֵלָה என்பதற்கு ‘சடலம்’ பொருத்தமானது; மֻשְׁלֶכֶת என்பதன் எறியப்பட்ட அல்லது வீசப்பட்ட நிலையை ‘வீசப்பட்டுக் கிடப்பது’ தெளிவாகக் காட்டுகிறது.
- source_word: הָאַרְיֵה עֹמֵד אֵצֶל הַנְּבֵלָה
  choice: சிங்கம் சடலத்தின் அருகே நிற்பதை
  rationale: עֹמֵד மற்றும் אֵצֶל காட்டும் நிலை மற்றும் அண்மையை நேரடியாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: וַיְדַבְּרוּ בָעִיר
  choice: நகரத்தில் அதைப் பற்றிப் பேசினார்கள்
  rationale: எபிரேய வினைச்சொல் நேரடியாக ‘பேசினார்கள்’ என்றே கூறுவதால், சூழலில் அது செய்தியை அறிவித்ததைக் குறித்தாலும் மூலத்தின் சொற்பொருள் விரிவைத் தக்கவைக்கிறது.
- source_word: אֲשֶׁר הַנָּבִיא הַזָּקֵן יֹשֵׁב בָּהּ
  choice: முதிய தீர்க்கதரிசி வாழ்ந்த நகரத்தில்
  rationale: יֹשֵׁב בָּהּ குறிக்கும் குடியிருத்தலை நவீனத் தமிழில் ‘வாழ்ந்த’ என்று தெளிவாக வழங்குகிறது; ‘முதிய தீர்க்கதரிசி’ பெயரடையின் பொருளைப் பாதுகாக்கிறது.
