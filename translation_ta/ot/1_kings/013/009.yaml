  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: כִּֽי כֵ֣ן צִוָּ֣ה אֹתִ֗/י בִּ/דְבַ֤ר יְהוָה֙ לֵ/אמֹ֔ר לֹא תֹ֥אכַל לֶ֖חֶם וְ/לֹ֣א תִשְׁתֶּה מָּ֑יִם וְ/לֹ֣א תָשׁ֔וּב בַּ/דֶּ֖רֶךְ אֲשֶׁ֥ר הָלָֽכְתָּ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/009.yaml
  text: For this is what he commanded me by the word of the LORD, saying, ‘You shall not eat bread, nor drink water, nor return by the way that you went.’
translation:
  language: ta
  text: 'ஏனெனில், கர்த்தருடைய வார்த்தையினால் அவர் எனக்கு இவ்வாறு கட்டளையிட்டார்: ‘நீ அப்பம் உண்ணக்கூடாது; தண்ணீர் குடிக்கக்கூடாது; நீ சென்ற வழியாகத் திரும்பிவரவும் கூடாது.’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּדְבַר יְהוָה
  choice: கர்த்தருடைய வார்த்தையினால்
  rationale: בְּ கருவி அல்லது வழிமுறையைக் குறிக்கிறது; דְבַר יְהוָה என்பது இறைவனிடமிருந்து வந்த அதிகாரமுள்ள செய்தி/வார்த்தை. தமிழ் வேதாகம நடையில் பரிச்சயமானதும் இயல்பானதுமான வடிவம்.
- source_word: לֹא תֹאכַל לֶחֶם
  choice: நீ அப்பம் உண்ணக்கூடாது
  rationale: לֶחֶם என்பதன் நேரடிப் பொருள் ‘அப்பம்’; தடை விதிக்கும் לֹא + imperfect வடிவத்தை ‘கூடாது’ எனத் தெளிவாகக் கொடுக்கிறது.
- source_word: וְלֹא תָשׁוּב בַּדֶּרֶךְ אֲשֶׁר הָלָכְתָּ
  choice: நீ சென்ற வழியாகத் திரும்பிவரவும் கூடாது
  rationale: הלך என்பது ‘செல்/நட’; ‘வந்த’ என்று மாற்றாமல் ‘சென்ற’ என மூலத்தின் பார்வையைப் பாதுகாக்கிறது. שוב இங்கு திரும்பிச் செல்வதைக் குறிக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: கர்த்தர்
  alternative: யெகோவா / யாவே
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்பட்ட மரியாதைமிக்க பிரதிநிதித்துவம்; இந்த வசனத்தின் பொருளில் எந்தச் சமயப்பிரிவு சார்ந்த விளக்கத்தையும் சேர்ப்பதில்லை.
- issue: கட்டளையிட்டவரின் எழுவாய்
  choice: அவர்
  alternative: ‘கர்த்தர்’ என்பதை மீண்டும் வெளிப்படையாகச் சொல்வது
  rationale: எபிரெய மூலத்தில் צִוָּה என்பது மறைமுகமான ஆண்பால் ஒருமை எழுவாயைக் கொண்டுள்ளது; சூழலில் அது கர்த்தரைக் குறித்தாலும், மூலத்தின் இலக்கண வடிவத்தைப் பாதுகாக்க ‘அவர்’ பயன்படுத்தப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; மரியாதைமிக்க வேதாகம நடை. மூன்று தடைகளின் இணை அமைப்பும், ‘சென்ற வழி’ என்ற மூலச் சொற்பொருளும் பாதுகாக்கப்பட்டுள்ளன.
