  text: Then he spoke to his sons[a], saying, “Saddle the donkey for me.” So they saddled it.
translation:
  language: ta
  text: பின்பு அவர் தம் மகன்களிடம், “எனக்காகக் கழுதைக்குச் சேணம் பூட்டுங்கள்” என்றார். அவர்கள் அதற்குச் சேணம் பூட்டினார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள் கழுதைக்குச் சேணம் பூட்டினார்கள்.”
    reason: எபிரெய இறுதி வினையில் செயப்படுபொருள் வெளிப்படையாகக் கூறப்படவில்லை; தமிழில் அதைச் சுட்டுப்பெயரால் தருவதற்குப் பதிலாக, முன் வந்த ‘கழுதை’ என்ற பெயர்ச்சொல்லை மீண்டும் கூறலாம்.
lexical_decisions:
- source_word: וַיְדַבֵּר אֶל־בָּנָיו לֵאמֹר
  choice: பின்பு அவர் தம் மகன்களிடம் … என்றார்
  rationale: வாவ் தொடர்வினை கதைநிகழ்வை முன்னெடுத்துச் செல்வதால் ‘பின்பு’ என மொழிபெயர்க்கப்பட்டது. לֵאמֹר நேரடி கூற்றை அறிமுகப்படுத்துவதால், தமிழில் இயல்பான ‘என்றார்’ அமைப்பில் இணைக்கப்பட்டது; בָּנָיו சூழலில் ஆண் பிள்ளைகளைக் குறிக்கும் என்பதால் ‘மகன்கள்’ பயன்படுத்தப்பட்டது.
- source_word: חִבְשׁוּ לִי אֶת־הַחֲמוֹר
  choice: எனக்காகக் கழுதைக்குச் சேணம் பூட்டுங்கள்
  rationale: חבשׁ என்பது கழுதையைப் பயணத்துக்குத் தயார் செய்ய சேணம் இடுவதைக் குறிக்கிறது. לִי செயல் அவருக்காகவும் அவரது பயன்பாட்டுக்காகவும் செய்யப்படுவதைச் சுட்டுவதால் ‘எனக்காக’ எனத் தரப்பட்டது.
- source_word: וַיַּחֲבֹשׁוּ
  choice: அவர்களும் அதற்குச் சேணம் பூட்டினார்கள்
  rationale: முந்தைய חבשׁ வினை மீண்டும் வருவதால் ‘சேணம் பூட்டினார்கள்’ என்று ஒரே சொல்லாட்சி காக்கப்பட்டது. எபிரெய இறுதி வினையில் செயப்படுபொருள் வெளிப்படையாக இல்லை; தமிழில் தெளிவுக்காக முன் குறிப்பிடப்பட்ட கழுதையைச் சுட்டும் ‘அதற்கு’ சேர்க்கப்பட்டது.
