translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் மரியாதையான கதைநடைத் தொனியிலும் வடிவமைக்கப்பட்டது. ‘சேணம் பூட்டுதல்’ என்பது கழுதையைச் சவாரிக்குத் தயார் செய்வதைக் தெளிவாகக் கூறும் வழக்கமான சொற்றொடர். நேரடி கூற்றைச் சுற்றியுள்ள எபிரெய ‘பேசி, சொல்லி’ அமைப்பு தமிழில் தேவையற்ற இரட்டிப்பைத் தவிர்க்க ‘என்றார்’ என இயல்பாக்கப்பட்டது.
