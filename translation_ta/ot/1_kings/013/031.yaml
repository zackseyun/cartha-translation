translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் இரண்டு ஆண் சுட்டுப்பெயர்களால் தமிழிலும் ‘அவன் அவனை’ என்ற இயல்பான அளவிலான குறிப்பு தெளிவின்மை பேணப்பட்டுள்ளது; சூழல் அவர்களை அடையாளப்படுத்துகிறது. தெய்வீகப் பட்டமாக ‘இறைவனுடைய மனிதர்’ பயன்படுத்தப்பட்டு, அதை ‘தீர்க்கதரிசி’ என விளக்கிச் சுருக்குவது தவிர்க்கப்பட்டுள்ளது.
