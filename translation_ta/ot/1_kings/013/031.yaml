- from: அவன் அவனை அடக்கம் செய்தபின், தன் மகன்களிடம், “நான் இறக்கும்போது, இறைவனுடைய மனிதர் அடக்கம் செய்யப்பட்டிருக்கும் கல்லறையில் என்னையும் அடக்கம் செய்யுங்கள்; அவருடைய எலும்புகளுக்குப் பக்கத்தில் என் எலும்புகளை வையுங்கள்” என்று சொன்னான்.
