base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/031.yaml
  text: And it happened, after he had buried him, that he said to his sons, “When I die, bury me in the tomb where the man of God is buried; lay my bones beside his bones.”
translation:
  language: ta
  text: அதன்பின், அவன் அவனை அடக்கம் செய்தபோது, தன் மகன்களிடம், “நான் இறக்கும்போது, கடவுளின் மனிதர் அடக்கம் செய்யப்பட்டிருக்கும் கல்லறையில் என்னையும் அடக்கம் செய்யுங்கள்; அவருடைய எலும்புகளின் அருகில் என் எலும்புகளை வையுங்கள்” என்று சொன்னான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי קָבְרוֹ אֹתוֹ
  choice: அவன் அவனை அடக்கம் செய்தபின்
  rationale: எபிரெயக் கதைத் தொடரின் வַיְהִי வடிவத்தைத் தமிழில் இயல்பாகத் தனியே மொழிபெயர்க்காமல், அடுத்த காலவாக்கியத்துடன் இணைத்துள்ளது; செயல் அடுத்த உரைக்கு முன் முடிந்ததைத் தெளிவாக்குகிறது.
- source_word: בָּנָיו
  choice: தன் மகன்களிடம்
  rationale: மூலத்தில் ஆண்பால் பன்மையான ‘மகன்கள்’ என்பதே இருப்பதால் அதைக் குறிப்பாகப் பேணுகிறது; ‘தன்’ என்பது தமிழ் உரையில் தொடர்பை இயல்பாகத் தெளிவாக்குகிறது.
- source_word: בְּמוֹתִי
  choice: நான் இறக்கும்போது
  rationale: முதல் நபர் பின்னொட்டுடன் கூடிய காலப் பொருளை நவீன தமிழில் இயல்பாகவும் எதிர்கால நோக்குடனும் தருகிறது.
- source_word: וּקְבַרְתֶּם אֹתִי
  choice: என்னையும் அடக்கம் செய்யுங்கள்
  rationale: சூழலில் மகன்களுக்குக் கொடுக்கப்படும் கட்டளையை மரியாதைமிக்க பன்மை ஏவல் வடிவில் தருகிறது; ‘-யும்’ முன்பு அடக்கம் செய்யப்பட்ட மனிதருடன் இணைந்த அடக்கத்தை வெளிப்படுத்துகிறது.
- source_word: בַּקֶּבֶר
  choice: கல்லறையில்
  rationale: பலருடைய எலும்புகள் வைக்கக்கூடிய குறிப்பிட்ட அடக்க இடத்தைச் சுட்டும் இயல்பான தமிழ் சொல்.
- source_word: אִישׁ הָאֱלֹהִים
  choice: இறைவனுடைய மனிதர்
  rationale: இப்பகுதியின் நிலையான எபிரெயப் பட்டத்தை நேரடியாகப் பேணுகிறது; ‘தீர்க்கதரிசி’ என்று குறுகலாக விளக்கவில்லை.
- source_word: קָבוּר בּוֹ
  choice: அடக்கம் செய்யப்பட்டிருக்கும்
  rationale: எபிரெயச் செயல்பாட்டு பெயரெச்சத்தின் நிலைமையைத் தமிழ் தொடர்புவாக்கியத்தில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֵצֶל עַצְמֹתָיו
  choice: அவருடைய எலும்புகளுக்குப் பக்கத்தில்
  rationale: இடநெருக்கத்தைக் குறிக்கும் אֵצֶל என்பதையும், மூலத்தின் தெளிவான ‘எலும்புகள்’ என்ற உருவகத்தையும் பேணுகிறது.
- source_word: הַנִּיחוּ אֶת עַצְמֹתָי
  choice: என் எலும்புகளை வையுங்கள்
  rationale: நேரடியான பன்மை ஏவலைத் தெளிவாகவும் கண்ணியமாகவும் தருகிறது; ‘எச்சங்கள்’ என்று பொதுமைப்படுத்தாமல் மூலத்தின் சொல்லை வைத்திருக்கிறது.
