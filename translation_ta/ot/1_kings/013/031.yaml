review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the temporal sequence, the reference to his sons, the burial instruction, the specific tomb, and the concrete term “bones.” However, the opening omits the Hebrew narrative transition וַיְהִי (“And it happened/Then it happened”).
  naturalness: The Tamil is generally natural and dignified. “இறைவனுடைய மனிதர்” is understandable but somewhat literal and less idiomatic as a recurring biblical title; “தேவனுடைய மனுஷன்” is conventional but “மனுஷன்” is less modern. “கடவுளின் மனிதர்” is modern and natural enough while retaining the title’s breadth.
  terminology: Use “கடவுளின் மனிதர்” for אִישׁ הָאֱלֹהִים, preserving the title without narrowing it to “prophet.” “கல்லறை” appropriately renders the tomb/grave site in this context. The polite plural imperatives appropriately represent the plural address to the sons.
  issues:
  - severity: low
    issue: Narrative opening omitted
    rationale: וַיְהִי introduces the next event in the Hebrew narrative. Tamil need not reproduce it mechanically, but “அதன்பின்” or “அப்போது” should retain the transition in an optimal-equivalence rendering.
  - severity: low
    issue: Divine-title wording could be more idiomatic
    rationale: “இறைவனுடைய மனிதர்” is intelligible, but “கடவுளின் மனிதர்” is more natural modern standard Tamil and retains the formal biblical designation without interpretive expansion.
  revised_text: அதன்பின், அவன் அவனை அடக்கம் செய்தபோது, தன் மகன்களிடம், “நான் இறக்கும்போது, கடவுளின் மனிதர் அடக்கம் செய்யப்பட்டிருக்கும் கல்லறையில் என்னையும் அடக்கம் செய்யுங்கள்; அவருடைய எலும்புகளின் அருகில் என் எலும்புகளை வையுங்கள்” என்று சொன்னான்.
