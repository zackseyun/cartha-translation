reference: 1 Kings 13:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/נָתַן֩ בַּ/יּ֨וֹם הַ/ה֤וּא מוֹפֵת֙ לֵ/אמֹ֔ר זֶ֣ה הַ/מּוֹפֵ֔ת אֲשֶׁ֖ר דִּבֶּ֣ר יְהוָ֑ה הִנֵּ֤ה הַ/מִּזְבֵּ֨חַ֙ נִקְרָ֔ע וְ/נִשְׁפַּ֖ךְ הַ/דֶּ֥שֶׁן אֲשֶׁר עָלָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/003.yaml
  text: 'And on that day he gave a sign[a], saying, “This is the sign that Yahweh has spoken: behold, the altar will be torn apart[b], and the ashes that are on it will be poured out.”'
translation:
  language: ta
  text: 'அன்றைய நாளில் அவர் ஓர் அடையாளத்தைக்[a] கொடுத்து, “யாவே உரைத்த அடையாளம் இதுவே: இதோ, பலிபீடம் பிளந்துபோகும்; அதன்மேல் உள்ள சாம்பல்[b] கொட்டப்படும்” என்றார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அதிசயம்’ அல்லது ‘முன்னறிகுறி’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இங்கு ‘சாம்பல்’ என்பதற்கான எபிரெயச் சொல், பலிகளிலிருந்து எஞ்சிய கொழுப்பு கலந்த சாம்பலைக் குறிப்பாகக் குறிக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: וְנָתַן
  choice: கொடுத்து
  rationale: נתן என்பதன் அடிப்படைப் பொருள் ‘கொடு/வை’ என்பதாகும். מוֹפֵת உடன் வரும் இச்சொற்றொடரில், தீர்க்கதரிசனத்தை உறுதிப்படுத்தும் அடையாளத்தை அளித்தார் என்ற பொருளை ‘அடையாளத்தைக் கொடுத்து’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מוֹפֵת
  choice: அடையாளம்
  rationale: இந்தச் சொல் அடையாளம், அதிசயம், முன்னறிகுறி ஆகிய பொருள்களைத் தரலாம். இங்கு தீர்க்கதரிசன வார்த்தையை உடனடியாக உறுதிப்படுத்தும் நிகழ்வைக் குறிப்பதால் ‘அடையாளம்’ பொருத்தமானது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: לֵאמֹר
  choice: என்றார்
  rationale: நேர்க் கூற்றை அறிமுகப்படுத்தும் எபிரெயச் சொல்லை இயல்பான தமிழ் கதைநடை அமைப்பில் மேற்கோளின் முடிவில் ‘என்றார்’ என்று வழங்குகிறது.
- source_word: דִּבֶּר יְהוָה
  choice: யாவே உரைத்த
  rationale: ஏற்கெனவே அறிவிக்கப்பட்ட தெய்வீக வார்த்தையைச் சுட்டுகிறது. தமிழில் ‘யாவே உரைத்த அடையாளம்’ என்பது சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் வரும் கடவுளின் தனிப்பெயரான יהוה என்பதை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: அறிவிக்கப்படும் அடையாளத்தின்மீது கவனத்தை ஈர்க்கும் தீர்க்கதரிசன வலிமையையும் உடனடித் தன்மையையும் காக்கிறது.
- source_word: הַמִּזְבֵּחַ נִקְרָע
  choice: பலிபீடம் பிளந்துபோகும்
  rationale: קרע என்பதன் நிபால் வடிவிலுள்ள பிளத்தல்/கிழிதல் என்ற விளைவையும், சூழலில் உள்ள எதிர்கால அறிவிப்பையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְנִשְׁפַּךְ
  choice: கொட்டப்படும்
  rationale: שׁפך என்பதன் நிபால் வடிவம் சிந்தப்படுதல் அல்லது கொட்டப்படுதல் என்பதைக் குறிக்கிறது. பலிபீடத்தின் மேல் உள்ள சாம்பல் கீழே விழுவதை ‘கொட்டப்படும்’ தெளிவாகக் கூறுகிறது.
- source_word: הַדֶּשֶׁן
  choice: சாம்பல்
  rationale: பலிச்சடங்குச் சூழலில் இச்சொல் கொழுப்பு கலந்த சாம்பல் அல்லது பலியின் எஞ்சிய பொருளைக் குறிப்பாகக் குறிக்கலாம். பொதுவாசகருக்குத் தெளிவான ‘சாம்பல்’ முதன்மை உரையில் வைக்கப்பட்டு, நுட்பமான பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: אֲשֶׁר עָלָיו
  choice: அதன்மேல் உள்ள
  rationale: சாம்பல் பலிபீடத்தின் மேல் இருப்பதை இயல்பான தமிழில் தெளிவாகக் குறிக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல உரையில் தனிப்பெயரான יהוה நேரடியாக வருகிறது. ஆகவே அதைப் பட்டப்பெயராக மாற்றாமல், பரவலாக அறியப்பட்ட தமிழ் ஒலிபெயர்ப்பான ‘யாவே’ என்று வழங்குகிறது.
- issue: אֲשֶׁר דִּבֶּר יְהוָה என்ற தொடர்பின் பொருள்
  choice: யாவே உரைத்த அடையாளம்
  alternative: யாவே உரைத்ததற்கான அடையாளம்
  rationale: எபிரெயத் தொடர்புச் சொற்றொடர், யாவே முன்பே கூறிய அடையாளத்தைச் சுட்டுவதாகவும், அவர் உரைத்த வார்த்தையை உறுதிப்படுத்தும் அடையாளமாகவும் புரிந்துகொள்ளப்படலாம். முதன்மை உரை முதலாவது தொடர்பை இயல்பாகக் காக்கிறது; அதற்கு அப்பாற்பட்ட இறையியல் விளக்கத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில், ஆனால் தீர்க்கதரிசன உரைக்கேற்ற கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘இதோ’ என்ற சொல் மூலத்தின் வலியுறுத்தலைக் காக்கிறது. நீண்ட எபிரெய வாக்கியத்தின் இரண்டு விளைவுகளும் அரைப்புள்ளியால் இணைக்கப்பட்டுள்ளன; இதனால் அடையாளத்தின் ஒற்றுமையும் வாசிப்பின் தெளிவும் நிலைக்கின்றன.
