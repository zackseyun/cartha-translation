source:
  edition: WLC
  text: וַ/יְדַבֵּ֤ר הַ/מֶּ֨לֶךְ֙ אֶל אִ֣ישׁ הָ/אֱלֹהִ֔ים בֹּאָ/ה אִתִּ֥/י הַ/בַּ֖יְתָ/ה וּֽ/סְעָ֑דָ/ה וְ/אֶתְּנָ֥ה לְ/ךָ֖ מַתָּֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/007.yaml
  text: Then the king said to the man of God[a], “Come home with me and eat, and I will give you a gift.”
translation:
  language: ta
  text: அப்போது அரசன் இறைவனுடைய மனிதரிடம், “என்னோடு வீட்டுக்கு வாருங்கள், உணவருந்துங்கள்[a]; நான் உங்களுக்கு ஒரு பரிசு தருவேன்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உணவால் உங்களைப் பலப்படுத்திக்கொள்ளுங்கள்”; எபிரெய வினைச்சொல் தன்னைத் தாங்கிக்கொள்ளுதல் அல்லது பலப்படுத்திக்கொள்ளுதல் என்ற பொருள்படும்; இங்கு அது பொதுவாக உணவு உட்கொள்வதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: அப்போது ... என்றான்
  rationale: வாவ் தொடர்வினை கதைநிகழ்வை முன்னோக்கி நகர்த்துகிறது; நவீன தமிழில் ‘அப்போது’ அதன் தொடர்ச்சியை இயல்பாகக் காட்டுகிறது. நேரடி உரைக்கு ‘என்றான்’ பொருத்தமானது.
- source_word: אִישׁ הָאֱלֹהִים
  choice: இறைவனுடைய மனிதர்
  rationale: எபிரெயச் சொல்லாட்சியை ‘இறைவாக்கினர்’ என்று விளக்கிவிடாமல், அதன் தனித்துவமான ‘இறைவனுடைய மனிதர்’ என்ற வடிவில் பாதுகாக்கிறது.
- source_word: בֹּאָה אִתִּי הַבַּיְתָה
  choice: என்னோடு வீட்டுக்கு வந்து
  rationale: திசையைக் குறிக்கும் הַבַּיְתָה என்பதையும் அழைப்பின் இயல்பான தமிழ்நடையையும் இணைக்கிறது; வீடு அரசனுடையது என்பது சூழலில் தெளிவு.
- source_word: וּסְעָדָה
  choice: உணவருந்தி உங்களைப் பலப்படுத்திக்கொள்ளுங்கள்
  rationale: סעד என்பது உணவால் ஒருவரைத் தாங்குதல் அல்லது பலப்படுத்துதல் என்னும் பரந்த பொருளுடையது. இங்கு உணவு உட்கொள்வது உட்பொருளாக இருப்பதால் இரு நுணுக்கங்களையும் மொழிபெயர்ப்பு வெளிப்படுத்துகிறது.
- source_word: וְאֶתְּנָה לְךָ
  choice: நான் உங்களுக்கு ... தருகிறேன்
  rationale: அரசனின் முன்வருகையையும் வாக்குறுதியையும் இயல்பான தமிழ் நிகழ்கால வடிவில் வெளிப்படுத்துகிறது.
- source_word: מַתָּת
  choice: ஓர் அன்பளிப்பு
  rationale: ‘வெகுமதி’ என மொழிபெயர்த்தால் மூலத்தில் வெளிப்படையாக இல்லாத ஊதிய அல்லது கைம்மாறு கருத்து தோன்றலாம்; ‘அன்பளிப்பு’ நடுநிலையான கொடையைக் குறிக்கிறது.
theological_decisions:
- issue: אִישׁ הָאֱלֹהִים என்ற பட்டத்தின் பொருள்
  choice: இறைவனுடைய மனிதர்
  alternative: இறைவாக்கினர்
  rationale: அந்த நபர் இறைவாக்கினராகச் செயல்பட்டாலும், மூலத்தின் தனித்துவமான சொல்லாட்சியை விளக்கப் பெயராக மாற்றாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன, கண்ணியமான பொதுத்தமிழ் பயன்படுத்தப்பட்டுள்ளது. அரசன் தன்னைவிட மதிப்புக்குரியவரிடம் பேசுவதற்கு ஏற்றவாறு ‘உங்களை’, ‘உங்களுக்கு’ என்ற மரியாதைப் பன்மை தேர்ந்தெடுக்கப்பட்டுள்ளது; ‘இறைவனுடைய மனிதர்’ என்ற எபிரெயச் சொல்லாட்சி விளக்கமாக மாற்றப்படாமல் பாதுகாக்கப்பட்டுள்ளது.
