revisions:
- from: அப்போது அரசன் இறைவனுடைய மனிதரிடம், “என்னோடு வீட்டுக்கு வந்து, உணவருந்தி உங்களைப் பலப்படுத்திக்கொள்ளுங்கள்[a]; நான் உங்களுக்கு ஓர் அன்பளிப்பு தருகிறேன்” என்றான்.
  to: அப்போது அரசன் இறைவனுடைய மனிதரிடம், “என்னோடு வீட்டுக்கு வாருங்கள், உணவருந்துங்கள்[a]; நான் உங்களுக்கு ஒரு பரிசு தருவேன்” என்றான்.
  rationale: The revision renders the contextually natural meal sense of סעד in the text and reserves its broader strengthening/sustaining sense for the anchored lexical note. It also makes the king’s promised gift explicitly future, while preserving the Hebrew idiom ‘man of God’ and the respectful Tamil register.
