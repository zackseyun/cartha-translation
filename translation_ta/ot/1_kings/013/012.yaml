base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/012.yaml
  text: And their father said to them, “Which way did he go?” For his sons had seen the way that the man of God, who came from Judah, had gone.
translation:
  language: ta
  text: அவர்களுடைய தந்தை அவர்களிடம், “அவர் எந்த வழியாகப் போனார்?” என்று சொன்னார். ஏனெனில், யூதாவிலிருந்து வந்த தேவனுடைய மனிதர் சென்ற வழியை அவருடைய மகன்கள் பார்த்திருந்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: என்று கேட்டார்
  rationale: வினாவைக் கொண்ட நேரடிக் கூற்றை அறிமுகப்படுத்துவதால், எபிரெய வினையின் கதைசார் செயல்பாட்டை இயல்பான தமிழில் ‘கேட்டார்’ என்று வழங்குகிறது.
- source_word: אֲבִיהֶם
  choice: அவர்களுடைய தந்தை
  rationale: மூன்றாம் நபர் ஆண்பால் பன்மை உடைமை விகுதி, முன்சூழலில் குறிப்பிடப்பட்ட மகன்களைக் குறிக்கிறது; ‘தந்தை’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: אֵי זֶה הַדֶּרֶךְ
  choice: எந்த வழியாக
  rationale: இங்கு கேள்வி ஓர் இடத்தை மட்டுமல்ல, அவர் சென்ற பாதையை அடையாளம் காண்கிறது; தமிழில் ‘எந்த வழியாக’ இதைத் தெளிவாகச் சொல்கிறது.
- source_word: הָלָךְ
  choice: போனார் / சென்ற
  rationale: ஒரே எபிரெய வினை இருமுறை வருகிறது. கேள்வியில் ‘போனார்’ இயல்பாகவும், சார்பு வாக்கியத்தில் ‘சென்ற’ செம்மையாகவும் உள்ளது; இரண்டும் இயக்கத்தின் ஒரே அடிப்படைப் பொருளைப் பேணுகின்றன.
- source_word: וַיִּרְאוּ
  choice: பார்த்திருந்தார்கள்
  rationale: வடிவில் எளிய இறந்தகாலமாக இருந்தாலும், மகன்கள் வழியைப் பார்த்தது தந்தையின் கேள்விக்கு முன்பு நிகழ்ந்தது என்பதைத் தமிழின் இறந்தகால நிறைவுவடிவம் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אִישׁ הָאֱלֹהִים
  choice: தேவனுடைய மனிதர்
  rationale: எபிரெய நிலையான சொற்றொடரின் வடிவத்தையும் பரப்பையும் பேணுகிறது; அதை விளக்கமாக ‘தீர்க்கதரிசி’ என்று குறுக்கவில்லை.
- source_word: מִיהוּדָה
  choice: யூதாவிலிருந்து வந்த
  rationale: தோற்ற இடத்தைக் குறிக்கும் מִן முன்னிடைச்சொல்லை இயல்பான தமிழில் துல்லியமாக வழங்குகிறது.
