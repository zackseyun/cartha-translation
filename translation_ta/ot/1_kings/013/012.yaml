translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட கதைநடை பயன்படுத்தப்பட்டுள்ளது. இரண்டாம் வாக்கியத்தின் வாவ் இணைப்பு, தந்தை ஏன் வழியைக் கேட்டார் என்பதை விளக்கும் தொடர்பாக ‘ஏனெனில்’ என்று வழங்கப்பட்டுள்ளது. அடிக்குறிப்புகள் தேவையில்லை.
