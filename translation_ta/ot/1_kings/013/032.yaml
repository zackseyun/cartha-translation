  rationale: 'திருத்தம் மூலத்தின் கட்டமைப்பையும் பொருளையும் காக்கிறது: யாவேயின் வார்த்தையால் அறிவிக்கப்பட்ட வார்த்தை உறுதியாக நிறைவேறும்; அதன் இலக்குகள் பெத்தேலின் பலிபீடமும் சமாரிய நகரங்களில் உள்ள மேடைவழிபாட்டு இடங்களின் வழிபாட்டு இல்லங்களும் ஆகும். ‘வழிபாட்டு இல்லங்கள்’ என்பது தேவையற்ற குறிப்பிட்ட சமய விளக்கத்தைச் சேர்க்காமல் בָּתֵּי என்ற சொல்லையும் வழிபாட்டுச் சூழலையும் வெளிப்படுத்துகிறது.'
