  yaml_path: translation/ot/1_kings/013/032.yaml
  text: For the word that he cried out by the word of Yahweh against the altar that is in Bethel[a], and against all the houses of the high places that are in the cities of Samaria[b], will surely come to pass.
translation:
  language: ta
  text: ஏனெனில், பெத்தேலில் உள்ள பலிபீடத்துக்கு எதிராகவும், சமாரியாவின் பட்டணங்களில் உள்ள மேடைவழிபாட்டு இடங்களின் எல்லா வழிபாட்டு இல்லங்களுக்கும்[b] எதிராகவும், யாவேயின் வார்த்தையால் அவன் உரக்க அறிவித்த வார்த்தை நிச்சயமாக நிறைவேறும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நிச்சயமாக நடந்தேறும்” என்றும் மொழிபெயர்க்கலாம். எபிரெயத்தில் வலியுறுத்தும் வினைவடிவமும் எதிர்கால வினையும் இணைந்து, இது உறுதியாக நிகழும் என்பதைச் சுட்டுகின்றன.
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்கு சொல்: “மேடைவழிபாட்டு இடங்களின் வீடுகள்.” இவை அந்த இடங்களோடு தொடர்புடைய வழிபாட்டு இல்லங்களைக் குறிக்கின்றன.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட அடக்க வேண்டுகோளுக்கான காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: הָיֹה יִהְיֶה
  choice: நிச்சயமாக நிறைவேறும்
  rationale: இன்ஃபினிட்டிவ் அப்சலூட் மற்றும் இம்பர்ஃபெக்ட் வினைச்சொல் இணைந்து நிறைவேறுதலின் உறுதியை வலியுறுத்துகின்றன.
- source_word: הַדָּבָר
  choice: வார்த்தை
  rationale: தீர்க்கதரிசனச் சூழலில் இது நடந்த நிகழ்வை மட்டும் அல்ல, அறிவிக்கப்பட்ட இறைச்செய்தியைக் குறிக்கிறது.
- source_word: אֲשֶׁר קָרָא
  choice: அவன் உரக்க அறிவித்த
  rationale: கָרָא என்பதன் பொதுமக்கள் முன் உரத்த குரலில் அறிவிக்கும் தன்மையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בִּדְבַר יְהוָה
  choice: யாவேயின் வார்த்தையின்படி
  rationale: தீர்க்கதரிசி தன் சொந்த அதிகாரத்தில் அல்லாமல் யாவேயிடமிருந்து பெற்ற வார்த்தையின் அடிப்படையில் பேசியதைத் தெரிவிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்திலுள்ள இறைப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் ஒலிபெயர்க்கிறது.
- source_word: עַל
  choice: எதிராக
  rationale: இங்கு தீர்ப்பை அறிவிக்கும் உரையின் இலக்கைச் சுட்டுவதால் ‘எதிராக’ பொருத்தமானது.
- source_word: הַמִּזְבֵּחַ
  choice: பலிபீடம்
  rationale: வழிபாட்டுக்குரிய altar என்பதற்கான தெளிவான, நிலைபெற்ற தமிழ் சொல்.
- source_word: בְּבֵית אֵל
  choice: பெத்தேலில்
  rationale: בית אל என்ற இடப்பெயரை வழக்கமான தமிழாக்கத்தில் தருகிறது.
- source_word: כָּל בָּתֵּי הַבָּמוֹת
  choice: மேடைவழிபாட்டிடங்களின் ஆலயங்கள் அனைத்தும்
  rationale: ‘மேடைகளின் வீடுகள்’ என்ற மூல அமைப்பிலுள்ள இரு கூறுகளையும் புரியக்கூடிய தமிழில் காக்கிறது; ‘ஆலயங்கள்’ என்பது இங்குள்ள cultic houses-ஐக் குறிக்கிறது.
- source_word: הַבָּמוֹת
  choice: மேடைவழிபாட்டிடங்கள்
  rationale: במות என்பது உயரமான நிலப்பகுதிகளை மட்டும் அல்லாமல் அங்கிருந்த உள்ளூர் வழிபாட்டுத் தலங்களைக் குறிக்கிறது.
- source_word: בְּעָרֵי שֹׁמְרוֹן
  choice: சமாரியாவின் பட்டணங்களில்
  rationale: மூலத்தின் தொடர்புநிலையை நேரடியாகக் காக்கிறது; வரலாற்றுப் பதற்றத்தை மொழிபெயர்ப்பில் நீக்கவில்லை.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் நேரடியாக வரும் உடன்படிக்கைப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: הָיֹה יִהְיֶה என்பதிலுள்ள தீர்க்கதரிசன உறுதி
  choice: நிச்சயமாக நிறைவேறும்
  alternative: கண்டிப்பாக நடக்கும்
  rationale: எபிரெய வலியுறுத்தலைக் காத்து, தீர்க்கதரிசன வார்த்தை நிறைவேறுவதை இயல்பான தமிழில் தெரிவிக்கிறது.
- issue: בָּתֵּי הַבָּמוֹת என்பதன் வழிபாட்டு குறிப்பு
  choice: மேடைவழிபாட்டிடங்களின் ஆலயங்கள்
  alternative: மேடைகளின் வீடுகள்
  rationale: சொல்லாட்சியின் இரண்டு கூறுகளையும் காத்தபடி, இவை குடியிருப்பு வீடுகள் அல்ல, வழிபாட்டு ஆலயங்கள் என்பதைத் தெளிவாக்குகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. தீர்க்கதரிசன வார்த்தையின் உறுதியும், வழிபாட்டிடங்களுக்கு எதிரான தீர்ப்பின் தொனியும் காக்கப்பட்டுள்ளன. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
