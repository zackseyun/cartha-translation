  text: וַ/יְהִי֩ כִ/שְׁמֹ֨עַ הַ/מֶּ֜לֶךְ אֶת דְּבַ֣ר אִישׁ הָ/אֱלֹהִ֗ים אֲשֶׁ֨ר קָרָ֤א עַל הַ/מִּזְבֵּ֨חַ֙ בְּ/בֵֽית אֵ֔ל וַ/יִּשְׁלַ֨ח יָרָבְעָ֧ם אֶת יָד֛/וֹ מֵ/עַ֥ל הַ/מִּזְבֵּ֖חַ לֵ/אמֹ֣ר תִּפְשֻׂ֑/הוּ וַ/תִּיבַ֤שׁ יָד/וֹ֙ אֲשֶׁ֣ר שָׁלַ֣ח עָלָ֔י/ו וְ/לֹ֥א יָכֹ֖ל לַ/הֲשִׁיבָ֥/הּ אֵלָֽי/ו־־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/004.yaml
  text: And when the king heard the word of the man of God[a], who cried out against the altar at Bethel, Jeroboam stretched out his hand from the altar, saying, “Seize him!” But his hand, which he stretched out against him, dried up, and he could not draw it back to himself.
translation:
  language: ta
  text: அரசன் பெத்தேலில் உள்ள பலிபீடத்துக்கு எதிராக தேவனுடைய மனிதர் உரக்கக் கூவிய வார்த்தையைக் கேட்டபோது, யெரொபெயாம் பலிபீடத்திலிருந்து தன் கையை நீட்டி, “அவனைப் பிடியுங்கள்!” என்றான். ஆனால், அவன்மேல் நீட்டிய அவன் கை உலர்ந்துபோனது; அதை மீண்டும் தன்னிடம் இழுத்துக்கொள்ள அவனால் முடியவில்லை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דְּבַר
  choice: வார்த்தை
  rationale: தீர்க்கதரிசன உரையின் தனித்த செய்தியைச் சுட்டும் எபிரேய ஒருமையைப் பாதுகாக்கிறது; ‘செய்தி’ என்பதும் சாத்தியம்.
- source_word: אִישׁ הָאֱלֹהִים
  choice: இறைவனுடைய மனிதர்
  rationale: ‘தீர்க்கதரிசி’ என்று விளக்கமாக மாற்றாமல், எபிரேய மரபுத் தலைப்பை நெருக்கமாகப் பாதுகாக்கிறது.
- source_word: קָרָא עַל
  choice: எதிராக ... உரக்க அறிவித்த
  rationale: קרא என்பதின் குரல் வலிமையையும் על என்பதின் எதிர்ப்புப் பொருளையும் சூழலுக்கேற்ற இயல்பான தமிழில் தருகிறது.
- source_word: בְּבֵית אֵל
  choice: பெத்தேலில்
  rationale: இடப்பெயரை வழக்கமான தமிழ் ஒலிபெயர்ப்பில் அளித்து, பலிபீடம் அமைந்த இடத்தைக் குறிக்கிறது.
- source_word: וַיִּשְׁלַח ... אֶת יָדוֹ מֵעַל הַמִּזְבֵּחַ
  choice: பலிபீடத்தருகிலிருந்து தன் கையை நீட்டி
  rationale: שלח יד என்ற கை நீட்டும் செயலை இயல்பாகத் தருகிறது. מעל המזבח அரசன் பலிபீடத்தின் அருகில் அல்லது அதன் மேற்புறத்தில் இருந்ததைக் குறிக்கலாம்; தமிழில் ‘பலிபீடத்தருகிலிருந்து’ என்பது காட்சியை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: תִּפְשֻׂהוּ
  choice: அவனைப் பிடியுங்கள்!
  rationale: பன்மை கட்டளையைப் பாதுகாத்து, உதவியாளர்களை நோக்கிய அரசனின் வலிமையான நேரடிக் கட்டளையைத் தருகிறது; நவீன சட்டப் பொருளைச் சேர்க்கவில்லை.
- source_word: וַתִּיבַשׁ יָדוֹ
  choice: கை உலர்ந்துபோனது
  rationale: יבש என்பதின் அடிப்படை ‘உலர்தல்’ உருவகத்தை நேரடியாகப் பாதுகாக்கிறது; நிகழ்ந்த உடல் செயலிழப்புக்கு மருத்துவ விளக்கம் சேர்க்கவில்லை.
- source_word: אֲשֶׁר שָׁלַח עָלָיו
  choice: அவனுக்கு எதிராக அவன் நீட்டிய
  rationale: על என்பதின் பகைமையான திசையை ‘எதிராக’ எனத் தெளிவுபடுத்தி, முன்னைய கை நீட்டும் செயலை மீண்டும் சுட்டுகிறது.
- source_word: לַהֲשִׁיבָהּ אֵלָיו
  choice: அதைத் தன்னிடம் திரும்ப இழுக்க
  rationale: שוב என்பதின் திரும்பச் செய்தல் பொருளையும், செயலிழந்த கையை மீண்டும் தன்னருகே கொண்டுவர இயலாத உடல் நிலையையும் இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: யெரொபெயாமின் கைக்கு ஏற்பட்ட தீர்ப்பின் தன்மை
  choice: கை திடீரென ‘உலர்ந்துபோனது’ என்று உடல் விளைவை நேரடியாக மொழிபெயர்த்தல்
  alternative: ‘வாடிப்போனது’ அல்லது மருத்துவ ரீதியான செயலிழப்பாக விளக்குதல்
  rationale: உரை இதை அரசனின் பகைச் செயலுக்குப் பின்வரும் உடனடி அற்புதத் தீர்ப்பாகக் காட்டுகிறது. குறிப்பிட்ட மருத்துவ நோயையோ கூடுதல் இறையியல் விளக்கத்தையோ சேர்க்காமல் நிகழ்வின் வலிமையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதையான நடையில் வடிவமைக்கப்பட்டது. எபிரேய வாக்கியத்தின் தொடர்ச்சியான நிகழ்வோட்டம் பாதுகாக்கப்பட்டாலும், தமிழ் வாசிப்பின் இயல்பிற்காக துணைவாக்கிய அமைப்பு தெளிவுபடுத்தப்பட்டுள்ளது. ‘இறைவன்’ என்பது אֱלֹהִים என்பதற்கான சூழல்சார் மரியாதையான ஒருமைத் தெரிவு.
