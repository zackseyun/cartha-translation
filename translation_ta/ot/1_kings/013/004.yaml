revisions:
- from: அரசன், பெத்தேலில் இருந்த பலிபீடத்துக்கு எதிராக இறைவனுடைய மனிதர்[a] உரக்க அறிவித்த வார்த்தையைக் கேட்டபோது, யெரொபெயாம் பலிபீடத்தருகிலிருந்து தன் கையை நீட்டி, “அவனைப் பிடியுங்கள்!” என்றான். ஆனால் அவனுக்கு எதிராக அவன் நீட்டிய கை உலர்ந்துபோனது; அதைத் தன்னிடம் திரும்ப இழுக்க அவனால் முடியவில்லை.
  to: அரசன் பெத்தேலில் உள்ள பலிபீடத்துக்கு எதிராக தேவனுடைய மனிதர் உரக்கக் கூவிய வார்த்தையைக் கேட்டபோது, யெரொபெயாம் பலிபீடத்திலிருந்து தன் கையை நீட்டி, “அவனைப் பிடியுங்கள்!” என்றான். ஆனால், அவன்மேல் நீட்டிய அவன் கை உலர்ந்துபோனது; அதை மீண்டும் தன்னிடம் இழுத்துக்கொள்ள அவனால் முடியவில்லை.
