  to: அவன் அந்த மனிதனின் சடலத்தைத் தன் கல்லறையில் வைத்தான். அவர்கள் அவனுக்காகப் புலம்பி[a], “ஐயோ, என் சகோதரனே![b]” என்றார்கள்.
