base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/030.yaml
  text: And he laid his corpse in his own tomb[a], and they mourned over him, saying, “Alas[b], my brother!”
translation:
  language: ta
  text: அவன் அந்த மனிதனின் சடலத்தைத் தன் கல்லறையில் வைத்தான். அவர்கள் அவனுக்காகப் புலம்பி[a], “ஐயோ, என் சகோதரனே![b]” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனுக்காகத் துக்கம் கொண்டனர்.” எபிரெய வினைச்சொல் இறந்தவருக்காகப் புலம்புவதைக் குறிக்கிறது; இது பல வேளைகளில் முறையான இரங்கலையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “என் சகோதரனே” என்பது உயிரியல் உறவை அவசியம் குறிப்பதாக இல்லாமல், உறவுணர்வையோ ஒருமைப்பாட்டையோ வெளிப்படுத்தும் புலம்பல் மரபுத் தொடராக இருக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּנַּח
  choice: வைத்தான்
  rationale: நוח என்பதன் ஹிஃபில் வடிவம் இங்கு ஒன்றை ஓரிடத்தில் வைப்பதைக் குறிக்கிறது; அடக்கச் சூழலில் ‘வைத்தான்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: נִבְלָתוֹ
  choice: அவனுடைய சடலத்தை
  rationale: נְבֵלָה உயிரற்ற உடலை நேரடியாகக் குறிக்கிறது. ‘சடலம்’ அதன் வலிமையைத் தக்கவைத்து, மனித உடலைக் குறிப்பிடுவதற்கு நவீனத் தமிழில் பொருத்தமாக உள்ளது.
- source_word: בְּקִבְרוֹ
  choice: தனது கல்லறையில்
  rationale: קֶבֶר கல்லறையையோ அடக்க இடத்தையோ குறிக்கலாம். எபிரெயச் சொலிலுள்ள உடைமை விகுதியையும், வாக்கியத்தின் எழுவாயான முதிய தீர்க்கதரிசியின் சொந்தக் கல்லறை என்ற இயல்பான தொடர்பையும் ‘தனது’ வெளிப்படுத்துகிறது.
- source_word: וַיִּסְפְּדוּ
  choice: புலம்பி
  rationale: ספד இறந்தவருக்காகத் துக்கம் அனுசரிப்பதையும், பல வேளைகளில் முறையான இரங்கற்பா அல்லது புலம்பலையும் குறிக்கிறது. தொடர்ந்து வரும் நேரடிக் கூற்றுடன் ‘புலம்பி’ இயல்பாக இணைகிறது.
- source_word: עָלָיו
  choice: அவனுக்காக
  rationale: ספד உடன் வரும் עַל, இறந்த ஒருவருக்காகப் புலம்புவதைக் குறிக்கிறது. தமிழில் ‘அவனுக்காக’ இயல்பான பொருத்தம்.
- source_word: הוֹי
  choice: ஐயோ
  rationale: הוֹי இங்கு துயரத்தை வெளிப்படுத்தும் இடைச்சொல். ‘ஐயோ’ தீர்ப்பைச் சுட்டும் கூடுதல் நிழற்பொருளைச் சேர்க்காமல் இறப்புக்குரிய புலம்பலை இயல்பாகத் தெரிவிக்கிறது.
- source_word: אָחִי
  choice: என் சகோதரனே
  rationale: אָח என்பதன் நேரடிப் பொருள் ‘சகோதரன்’. அழைப்புமுறையான ‘சகோதரனே’ அன்பையும் ஒருமைப்பாட்டையும் வெளிப்படுத்தும் புலம்பல் மொழியின் உணர்ச்சியைத் தக்கவைக்கிறது.
