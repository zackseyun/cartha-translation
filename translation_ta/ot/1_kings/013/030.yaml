translation_notes:
  register: நவீனச் செந்தமிழுக்கு நெருக்கமான, பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘சடலம்’ மூலத்தின் நேரடியான உயிரற்ற-உடல் பொருளைத் தக்கவைக்கிறது; ‘ஐயோ’ இயல்பான துயர இடைச்சொல்லாக உள்ளது. ஆங்கில ஆலோசனை உரையில் அடிக்குறிப்புக் குறிகள் விளக்கும் சொற்களுடன் பொருந்தாத இடங்களில் இருந்ததால், [a] ‘புலம்பி’ என்பதற்குப் பின்னும் [b] ‘என் சகோதரனே’ என்பதற்குப் பின்னும் பொருளுக்கேற்றவாறு வைக்கப்பட்டுள்ளன.
