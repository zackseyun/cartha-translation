  text: וַ/יִּקְרָ֞א אֶל אִ֣ישׁ הָ/אֱלֹהִ֗ים אֲשֶׁר בָּ֤א מִֽ/יהוּדָה֙ לֵ/אמֹ֔ר כֹּ֖ה אָמַ֣ר יְהוָ֑ה יַ֗עַן כִּ֤י מָרִ֨יתָ֙ פִּ֣י יְהוָ֔ה וְ/לֹ֤א שָׁמַ֨רְתָּ֙ אֶת הַ/מִּצְוָ֔ה אֲשֶׁ֥ר צִוְּ/ךָ֖ יְהוָ֥ה אֱלֹהֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/021.yaml
  text: 'And he cried out to the man of God who had come from Judah[a], saying, “Thus says Yahweh: Because you have rebelled against the word of Yahweh and have not kept the command that Yahweh your God commanded you,”'
translation:
  language: ta
  text: 'அவர் யூதாவிலிருந்து வந்த இறைவனுடைய மனிதரை நோக்கி உரக்கக் கூறினார்: “யாவே இவ்வாறு கூறுகிறார்: நீ யாவேயின் சொல்லுக்கு எதிராகக் கலகம் செய்ததாலும்[a], உன் இறைவனாகிய யாவே உனக்குக் கொடுத்த கட்டளையைக் கடைப்பிடிக்காததாலும்,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லர்த்தமாக, “யாவேயின் வாய்க்கு எதிராகக் கலகம் செய்ததாலும்”; இது யாவே பேசியதற்கு எதிராகக் கலகம் செய்ததைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: உரக்கக் கூறினார்
  rationale: קרא என்பதற்கு அழைத்தல், அறிவித்தல், உரக்கக் கூறுதல் ஆகிய பொருள்கள் உண்டு. இங்கு தீர்க்கதரிசனக் கண்டனத்தின் வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אִישׁ הָאֱלֹהִים
  choice: இறைவனின் மனிதர்
  rationale: எபிரெயச் சொல்லின் நிலையான பட்டத்தை விளக்கவுரையாக ‘இறைவாக்கினர்’ என்று மாற்றாமல், அதன் வடிவத்தைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: מִיהוּדָה
  choice: யூதாவிலிருந்து வந்த
  rationale: புவியியல் தொடக்க இடத்தை இயல்பான நவீன தமிழில் குறிக்கிறது.
- source_word: כֹּה אָמַר יְהוָה
  choice: யாவே கூறுவது இதுவே
  rationale: தீர்க்கதரிசனத் தூதுரையின் வழக்கமான அறிமுகச் சூத்திரத்தை இயல்பாகவும் நேரடியாகவும் தருகிறது.
- source_word: יַעַן כִּי
  choice: …தால்
  rationale: வரவிருக்கும் தீர்ப்புக்கான காரணத்தை அறிமுகப்படுத்தும் எபிரெயச் சொற்றொடரைத் தமிழ் காரண விகுதியால் இயல்பாக இணைக்கிறது.
- source_word: מָרִיתָ
  choice: கலகம் செய்து
  rationale: מרה சாதாரண கீழ்ப்படியாமையை விட வலுவான எதிர்ப்பையும் கலகத்தையும் குறிக்கிறது.
- source_word: פִּי יְהוָה
  choice: யாவேயின் சொல்லுக்கு
  rationale: சொல்லர்த்தமாக ‘யாவேயின் வாய்’; அவர் பேசியதைக் குறிக்கும் எபிரெய மரபுத்தொடரை இயல்பான தமிழில் தருகிறது. சொல்லர்த்த வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: שָׁמַרְתָּ
  choice: கடைப்பிடிக்காததால்
  rationale: கட்டளையுடன் வரும் שׁמר என்பது அதைக் காத்து நடப்பதையோ கடைப்பிடிப்பதையோ குறிக்கிறது.
- source_word: הַמִּצְוָה
  choice: கட்டளை
  rationale: ஒருமையில் உள்ள தெய்வீக ஆணையை நவீன தமிழில் நேரடியாகக் குறிக்கிறது.
- source_word: צִוְּךָ
  choice: உனக்குக் கட்டளையிட்ட
  rationale: צוה என்ற வினையின் நேரடியான கட்டளையிடுதல் என்ற பொருளைப் பாதுகாக்கிறது.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: உன் இறைவனாகிய யாவே
  rationale: உடன்படிக்கைச் சொற்றொடரையும் தனிப்பட்ட இறைப்பெயரையும் தெளிவாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர் / யெகோவா
  rationale: மூலத்தில் வரும் நான்கு எழுத்து இறைப்பெயரை ஒரு பட்டமாக மாற்றாமல், ‘Yahweh’ என்பதன் வழக்கமான தமிழ் ஒலிபெயர்ப்பாகத் தருகிறது.
- issue: מָרִיתָ என்பதன் வலிமை
  choice: கலகம் செய்து
  alternative: கீழ்ப்படியாமல் / எதிர்த்து
  rationale: இச்சொல் வெறும் கட்டளை மீறலைவிடத் தெய்வீக வார்த்தைக்கு எதிரான வலுவான கிளர்ச்சியைக் குறிக்கிறது; கூடுதல் கோட்பாட்டு விளக்கமின்றி அந்தக் கடுமையைப் பாதுகாக்கிறது.
- issue: אִישׁ הָאֱלֹהִים என்ற பட்டம்
  choice: இறைவனின் மனிதர்
  alternative: இறைவாக்கினர்
  rationale: அந்த நபர் தீர்க்கதரிசியாகச் செயல்பட்டாலும், மூலத்தின் தனித்துவமான பட்டத்தை விளக்கவுரையாக மாற்றாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன, கண்ணியமான பொதுத் தமிழ் பயன்படுத்தப்பட்டுள்ளது. தீர்க்கதரிசன அறிவிப்பின் வலிமைக்காக ‘உரக்கக் கூறினார்’ என்றும், மூல வசனம் அடுத்த வசனத்தில் தொடருவதால் இறுதியில் நிறைவுறாத காரணத் தொடர் மற்றும் காற்புள்ளியும் பாதுகாக்கப்பட்டுள்ளன.
