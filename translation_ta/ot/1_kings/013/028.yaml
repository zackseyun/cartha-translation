base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/028.yaml
  text: He went and found his corpse thrown on the road[a], with the donkey and the lion standing beside the corpse. The lion had not eaten the corpse[b], nor had it torn apart the donkey.
translation:
  language: ta
  text: அவன் சென்று, அவனுடைய சடலம்[a] பாதையில் எறியப்பட்டுக் கிடப்பதைக் கண்டான். அந்தச் சடலத்தின் அருகே கழுதையும் சிங்கமும் நின்றுகொண்டிருந்தன. சிங்கம் சடலத்தைத் தின்றிருக்கவில்லை; கழுதையைக் கிழித்துச் சிதைக்கவும்[b] இல்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சடலம்” என்பதற்கான எபிரெயச் சொல் נְבֵלָה; இதை “இறந்த உடல்” அல்லது “பிணம்” என்றும் மொழிபெயர்க்கலாம். அந்தச் சொல் மரணத்தின் உண்மையைத் தீவிரமாக வெளிப்படுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயில் நேரடியாக, “கழுதையை உடைக்கவில்லை.” இச்சூழலில் அது கழுதையைக் கிழிக்கவோ நொறுக்கவோ இல்லை என்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִבְלָתוֹ / הַנְּבֵלָה
  choice: அவனுடைய சடலம் / சடலம்
  rationale: נְבֵלָה என்பது இறந்த உடலைக் குறிக்கும் நேரடியும் கடுமையானதுமான சொல். மனிதரைக் குறிக்கும் இச்சூழலில் ‘சடலம்’ இயல்பாகவும் மரணத்தின் உண்மையைத் தணிக்காமலும் உள்ளது.
- source_word: מֻשְׁלֶכֶת
  choice: எறியப்பட்டுக் கிடப்பது
  rationale: שׁלך வேரின் செயல்பாட்டு வலிமையை ‘எறியப்பட்டு’ காக்கிறது; தமிழ் வாக்கியத்தில் சடலம் காணப்பட்ட நிலையைக் கூற ‘கிடப்பது’ இயல்பாக இணைக்கப்பட்டுள்ளது.
- source_word: בַּדֶּרֶךְ
  choice: பாதையில்
  rationale: דֶּרֶךְ இங்கு பயணப் பாதை அல்லது சாலையைக் குறிக்கிறது. பண்டைய சூழலுக்கும் நவீனத் தமிழுக்கும் ‘பாதையில்’ இயல்பானது.
- source_word: עֹמְדִים אֵצֶל
  choice: அருகே ... நின்றுகொண்டிருந்தன
  rationale: கழுதையும் சிங்கமும் சடலத்துக்கு அருகில் அசையாமல் இருந்த காட்சியைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: לֹא אָכַל
  choice: தின்றிருக்கவில்லை
  rationale: אָכַל என்பதன் சாதாரண ‘தின்’ என்ற பொருளைத் தக்கவைக்கிறது; அவன் வந்தபோது கண்ட விளைவு நிலையை தமிழ் நிறைவுவினை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: שָׁבַר אֶת הַחֲמוֹר
  choice: கழுதையைக் கிழித்துச் சிதைக்கவும் இல்லை
  rationale: שׁבר என்பதன் அடிப்படைப் பொருள் ‘உடைத்தல்/நொறுக்குதல்’. சிங்கம் ஒரு கழுதையைத் தாக்கும் சூழலில், உடலைக் கிழித்து அழித்துவிடுதல் என்ற காட்சியை ‘கிழித்துச் சிதைத்தல்’ இயல்பாகத் தருகிறது.
- source_word: וַיֵּלֶךְ וַיִּמְצָא
  choice: அவன் சென்று ... கண்டான்
  rationale: தொடர்ச்சியான எபிரெயக் கதை வினைகளின் எளிய முன்னேற்றத்தை அலங்காரமின்றிப் பாதுகாக்கிறது.
