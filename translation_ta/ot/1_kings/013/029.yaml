base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/029.yaml
  text: Then the prophet lifted up the corpse of the man of God and laid it on the donkey and brought it back[a]. And he came to the city of the old prophet to mourn and to bury him.
translation:
  language: ta
  text: அப்போது அந்தத் தீர்க்கதரிசி இறைவனின் மனிதரின் சடலத்தைத் தூக்கிக் கழுதையின்மேல் வைத்து, அதைத் திரும்பக் கொண்டுவந்தார். புலம்பவும்[a] அவரைப் புதைக்கவும் முதிய தீர்க்கதரிசியின் நகரத்துக்கு வந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “துக்கங்கொள்ளவும் அவரைப் புதைக்கவும்.” எபிரெய வினைச்சொல் இறுதிச் சடங்கில் செய்யப்படும் புலம்பலைக் குறிப்பாகக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא
  choice: தூக்கி
  rationale: נשא என்பதன் தூக்குதல்/எடுத்தல் என்ற நேரடியான செயலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הַנָּבִיא
  choice: அந்தத் தீர்க்கதரிசி
  rationale: கதைச் சூழலில் முன்பே குறிப்பிடப்பட்ட முதிய தீர்க்கதரிசியைக் குறிக்கும் எபிரெய definite article-ஐ தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: נִבְלַת
  choice: சடலத்தை
  rationale: இது இறந்த உடலைத் துல்லியமாகக் குறிக்கிறது; ‘உடல்’ என்பதைவிட மரணம் தெளிவாகிறது.
- source_word: אִישׁ הָאֱלֹהִים
  choice: இறைவனுடைய மனிதர்
  rationale: தெய்வீகப் பணிக்காக அனுப்பப்பட்டவரைக் குறிக்கும் வேதாகமப் பட்டத்தை நேரடியாகப் பாதுகாக்கிறது.
- source_word: וַיַּנִּחֵהוּ אֶל הַחֲמוֹר
  choice: கழுதையின்மேல் வைத்து
  rationale: Hiphil வடிவின் வைப்பது/அமர்த்துவது என்ற பொருளையும் இலக்கிடப்பட்ட இடத்தையும் இயல்பாக வழங்குகிறது.
- source_word: וַיְשִׁיבֵהוּ
  choice: அதைத் திரும்பக் கொண்டுவந்தார்
  rationale: שוב என்பதன் Hiphil வடிவான ‘திரும்பக் கொண்டுவருதல்’ என்பதை வெளிப்படுத்துகிறது; அண்மையில் குறிப்பிடப்பட்ட சடலத்துடன் ‘அதை’ இயல்பாக ஒத்திசைகிறது.
- source_word: וַיָּבֹא אֶל עִיר הַנָּבִיא הַזָּקֵן
  choice: முதிய தீர்க்கதரிசியின் நகரத்துக்கு வந்தார்
  rationale: எபிரெய construct தொடரை ‘முதிய தீர்க்கதரிசியின் நகரம்’ என்று நேரடியாகவும் வாசிக்க எளிதாகவும் வழங்குகிறது.
- source_word: הַזָּקֵן
  choice: முதிய
  rationale: இங்கு பதவியைக் காட்டாமல் வயதை விவரித்து, அந்த மனிதரை இறைவனுடைய மனிதரிடமிருந்து வேறுபடுத்துகிறது.
- source_word: לִסְפֹּד
  choice: புலம்பவும்
  rationale: ספד என்பதில் உள்ள இறுதிச் சடங்கு சார்ந்த வாய்மொழிப் புலம்பலின் குறிப்பான நுண்ணர்த்தத்தைப் பாதுகாக்கிறது.
- source_word: וּלְקָבְרוֹ
  choice: அவரை அடக்கம் செய்யவும்
  rationale: קבר என்பதன் புதைத்தல்/அடக்கம் செய்தல் என்ற பொருளை மரியாதையான நவீன தமிழில் தருகிறது; பின்னொட்டு இறைவனுடைய மனிதரைக் குறிக்கிறது.
