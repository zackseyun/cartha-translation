translation_notes:
  register: நவீன பொதுத்தமிழில், கண்ணியமான வேதாகம நடையுடன் மொழிபெயர்க்கப்பட்டது. ‘சடலம்’ என்ற சொல்லுக்குப் பின் பொருள் சார்ந்து ‘அதை’ என்றும், இறந்த மனிதரை நோக்கும்போது மரியாதையாக ‘அவரை’ என்றும் பயன்படுத்தப்பட்டுள்ளது. எபிரெய வாக்கியத் தொடரைத் தமிழில் இயல்பாக்க இரண்டாவது வாக்கியத்தில் வெளிப்படையான எழுவாய் மீண்டும் சேர்க்கப்படவில்லை.
