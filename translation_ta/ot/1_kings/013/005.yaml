  to: பலிபீடமும் பிளந்தது; பலிபீடத்திலிருந்து சாம்பல் சிந்தப்பட்டது; யாவேயின் வார்த்தையினால் தேவனுடைய மனிதன் அளித்த அடையாளத்தின்படியே இது நிகழ்ந்தது.[a]
  rationale: எபிரெய வாக்கியத்தின் நிகழ்வுவரிசை மீட்டமைக்கப்பட்டது. நிக்ரா மற்றும் வையிஷ்ஷாபேக் ஆகியவற்றின் விளைவுநிலை/செயப்பாட்டுப் பொருளை முறையே “பிளந்தது,” “சிந்தப்பட்டது” எனத் தருகிறது. “இது நிகழ்ந்தது” என்பது தமிழில் கப்மோஃபேத் சொற்றொடர் முழு நிகழ்வையும் ஒட்டுவதைத் தெளிவாக்கும் மென்மையான இணைப்பாகும்; புதிய விளக்கத்தைச் சேர்ப்பதில்லை. “யாவே,” “தேவனுடைய மனிதன்,” மற்றும் “அளித்த” ஆகியவை பெயர், தலைப்பு, நடை ஆகியவற்றில் மூலத்திற்கும் POB audit trail-க்கும் நெருக்கமானவை.
