  choice: யெகோவா
  alternative: யாவே; ஆண்டவர்
  rationale: மூலத்தில் நேரடியாக வரும் உடன்படிக்கைத் திருநாமத்தை தனிப்பெயராகப் பாதுகாக்கிறது. 'யாவே' மூல உச்சரிப்பை மீட்டுருவாக்கும் மாற்று; 'ஆண்டவர்' என்பது வாசிப்பு மரபின் பட்டப்பெயர்.
- issue: מוֹפֵת என்பதன் பொருள் வரம்பு
  choice: அடையாளம்
  alternative: அற்புதம்; முன்னறிகுறி
  rationale: இந்த நிகழ்வு முன்பு அறிவிக்கப்பட்டதை உறுதிப்படுத்தும் அடையாளமாகச் செயல்படுகிறது; சொல்லின் விரிவான பொருள் வரம்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான, வாசிக்க எளிய நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் நிகழ்வுவரிசை பாதுகாக்கப்பட்டுள்ளது; தமிழின் இயல்பிற்காக திருநாமம் சார்ந்த சொற்றொடர் முன்வைக்கப்பட்டது. அடிக்குறி குறியீடு தொடர்புடைய கருத்தின் முடிவில் இடப்பட்டுள்ளது.
