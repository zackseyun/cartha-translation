source:
  edition: WLC
  text: וְ/הִנֵּ֣ה אִ֣ישׁ אֱלֹהִ֗ים בָּ֧א מִ/יהוּדָ֛ה בִּ/דְבַ֥ר יְהוָ֖ה אֶל בֵּֽית אֵ֑ל וְ/יָרָבְעָ֛ם עֹמֵ֥ד עַל הַ/מִּזְבֵּ֖חַ לְ/הַקְטִֽיר׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/001.yaml
  text: And behold[a], a man of God came from Judah to Bethel by the word of Yahweh[b], while Jeroboam was standing by the altar to burn incense.
translation:
  language: ta
  text: இதோ,[a] யூதாவிலிருந்து தேவனுடைய மனிதர் ஒருவர் யாவேயின் வார்த்தையின்படி பெத்தேலுக்கு வந்தார்; யெரொபெயாம் தூபங்காட்டுவதற்காகப் பலிபீடத்தருகே நின்றுகொண்டிருந்தான்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இதோ” என்பது வாசகரின் கவனத்தைத் திடீரென நிகழ்வின்மேல் திருப்பும் எபிரெயக் கதைச்சொல்.
    reason: discourse_feature
  - marker: b
    text: அல்லது, “யெரொபெயாம் பலிபீடத்தினிடத்தில் நின்றுகொண்டிருந்தான்.” எபிரெய இணைப்புச்சொல்லை வெறுமனே “மேலும்” என்றும், “பலிபீடத்தருகே” என்பதை “பலிபீடத்தினிடத்தில்” என்றும் வழங்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: கவனத்தை ஈர்த்து நிகழ்வை உயிரோட்டமாக அறிமுகப்படுத்தும் எபிரெயச் சொல்லின் உரையாடல் செயல்பாட்டை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: אִישׁ אֱלֹהִים
  choice: கடவுளின் மனிதர் ஒருவர்
  rationale: இது இறைத்தூதர் அல்லது தீர்க்கதரிசியைக் குறிக்கும் மரபுத்தொடராக இருந்தாலும், மூலத்தின் நேரடியான சொல்லாட்சியைத் தக்கவைக்கிறது.
- source_word: מִיהוּדָה
  choice: யூதாவிலிருந்து
  rationale: புறப்பட்ட இடத்தைக் குறிக்கும் முன்னொட்டின் நேரடியான, இயல்பான தமிழ் வடிவம்.
- source_word: בִּדְבַר יְהוָה
  choice: யெகோவாவின் வார்த்தையின்படி
  rationale: அவர் வந்தது யெகோவாவின் வார்த்தையால் கட்டளையிடப்பட்டதும் அதற்கிணங்கியதும் என்பதைச் சொல்கிறது; எபிரெய முன்னிடைச்சொல்லின் கருவி, கட்டளை, இணக்கம் ஆகிய நுணுக்கங்களில் ஒன்றை மட்டும் மிகையாக உறுதிப்படுத்தாது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: நான்கெழுத்துத் திருப்பெயரை பொதுப்பட்டமான ‘ஆண்டவர்’ என்று மாற்றாமல் தனிப்பெயராக வழங்குகிறது; தமிழில் பரவலாக அறியப்படும் வடிவம்.
- source_word: אֶל בֵּית אֵל
  choice: பெத்தேலுக்கு
  rationale: செல்லுமிடத்தைக் குறிக்கும் אֶל என்பதையும் இடப்பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பையும் இயல்பாக வழங்குகிறது.
- source_word: וְיָרָבְעָם עֹמֵד
  choice: அப்போது யெரொபெயாம் ... நின்றுகொண்டிருந்தான்
  rationale: பின்னணியில் ஒரே நேரத்தில் தொடர்ந்துகொண்டிருந்த செயலை எபிரெயப் பங்கேற்புவினை உணர்த்துவதால், தமிழ் தொடர்நிலை வடிவம் பயன்படுத்தப்பட்டது.
- source_word: עַל הַמִּזְבֵּחַ
  choice: பலிபீடத்தருகே
  rationale: עמד உடனான இச்சூழலில் עַל என்பது பலிபீடத்தின் மேல் நின்றான் என்பதைக் காட்டிலும் அதன் அருகில் அல்லது அதனிடம் நின்றான் என்பதைக் குறிக்கிறது.
- source_word: לְהַקְטִיר
  choice: தூபங்காட்டுவதற்காக
  rationale: வழிபாட்டுச் சூழலில் புகையெழச் செய்யும் செயலைக் குறிக்கும் வினையை, இவ்வசனத்தில் இயல்பாகப் புரியக்கூடிய குறிப்பான தமிழ்ச் சொல்லால் வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே; ஆண்டவர்
  rationale: மூலத்தில் பொதுப்பட்டம் அல்ல, நான்கெழுத்துத் தனிப்பெயர் உள்ளது. ஆகவே அதைத் தனிப்பெயராகவே தக்கவைத்து, தமிழில் பரவலாக அறியப்படும் ‘யெகோவா’ என்ற வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- issue: אִישׁ אֱלֹהִים என்ற அடையாளத்தின் பொருள்
  choice: கடவுளின் மனிதர்
  alternative: தீர்க்கதரிசி
  rationale: அவர் தீர்க்கதரிசியாகச் செயல்படுகிறார் என்றாலும், இந்த வசனம் பயன்படுத்தும் மரபுப்பெயரை விளக்கமாக மாற்றாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் கதைநடை உயிரோட்டமும் காக்கப்பட்டுள்ளன. ‘கடவுளின் மனிதர்’ போன்ற மூலத்தின் முக்கிய மரபுத்தொடர் நேரடியாக வைக்கப்பட்டுள்ளது; தெளிவுக்காக இரண்டு குறிப்பு அடையாளங்களும் பிரதான உரையில் சேர்க்கப்பட்டுள்ளன.
