revisions:
- from: இதோ,[a] யூதாவிலிருந்து கடவுளின் மனிதர் ஒருவர் யெகோவாவின் வார்த்தையின்படி பெத்தேலுக்கு வந்தார். அப்போது யெரொபெயாம் தூபங்காட்டுவதற்காகப் பலிபீடத்தருகே நின்றுகொண்டிருந்தான்.[b]
