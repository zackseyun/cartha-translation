  text: So he went back with him and ate bread in his house and drank water[a].
translation:
  language: ta
  text: அவன் அவருடன் திரும்பிச் சென்று, அவருடைய வீட்டில் அப்பம் சாப்பிட்டு, தண்ணீர் குடித்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “அப்பம் சாப்பிட்டான்.” இது உணவு உட்கொள்வதைக் குறிக்கும் மரபுத்தொடராகவும் இருக்கலாம். ஆனால் சுற்றியுள்ள கதையில் “அப்பம்,” “தண்ணீர்” ஆகியவை கருப்பொருள் முக்கியத்துவம் உடையவை என்பதால் சொல்லுக்கு நெருக்கமான வடிவம் இங்கே தக்கவைக்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: திரும்பிச் சென்று
  rationale: שׁוב என்பதன் wayyiqtol வடிவம் கதையின் அடுத்த நிறைவுற்ற செயலாகத் திரும்பிச் சென்றதைக் குறிக்கிறது; நவீனத் தமிழில் இயல்பாகவும் இயக்கத்தைத் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: אִתּוֹ
  choice: அவருடன்
  rationale: மூன்றாம் நபர் ஆண்பால் ஒருமை பின்னொட்டுடன் உள்ள முன்னிடைச்சொல் உடன்செல்லுதலை நேரடியாகக் குறிக்கிறது. சூழலில் முதிய தீர்க்கதரிசியைக் குறிப்பதால் மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது.
- source_word: וַיֹּאכַל לֶחֶם
  choice: அப்பம் சாப்பிட்டு
  rationale: சொல்லுக்கு நெருக்கமாக ‘அப்பம் சாப்பிட்டான்’ என்று பொருள். இது பொதுவாக உணவு உட்கொள்வதைக் குறிக்கும் மரபுத்தொடராக அமையக்கூடும்; ஆனால் சுற்றியுள்ள கதையில் அப்பமும் தண்ணீரும் முக்கியமானதால் ‘அப்பம்’ தக்கவைக்கப்படுகிறது.
- source_word: בְּבֵיתוֹ
  choice: அவருடைய வீட்டில்
  rationale: ‘அவனுடைய வீட்டில்’ என்ற நேரடிப் பொருளை இயல்பான தமிழில் தருகிறது; பின்னொட்டு சூழலில் முதிய தீர்க்கதரிசியைக் குறிக்கிறது.
- source_word: וַיֵּשְׁתְּ מָיִם
  choice: தண்ணீர் குடித்தான்
  rationale: வினைச்சொல் தொடரின் நேரடியான மொழிபெயர்ப்பு. பெரிய கதைத்தொடரில் தடைசெய்யப்பட்ட குறிப்பிட்ட செயலை மீண்டும் எடுத்துரைப்பதால் ‘தண்ணீர்’ வெளிப்படையாகத் தக்கவைக்கப்படுகிறது.
