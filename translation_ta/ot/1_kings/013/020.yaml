id: 1KI.13.20
reference: 1 Kings 13:20
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יְהִ֕י הֵ֥ם יֹשְׁבִ֖ים אֶל הַ/שֻּׁלְחָ֑ן וַֽ/יְהִי֙ דְּבַר יְהוָ֔ה אֶל הַ/נָּבִ֖יא אֲשֶׁ֥ר הֱשִׁיבֽ/וֹ־פ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/020.yaml
  text: And it happened, as they were sitting at the table, that the word of Yahweh came to the prophet who had brought him back.
translation:
  language: ta
  text: அவர்கள் மேசையருகே அமர்ந்திருந்தபோது, அவரைத் திரும்பக் கொண்டுவந்த இறைவாக்கினருக்கு யாவேயின் வார்த்தை வந்தது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: வந்தது
  rationale: எபிரெயக் கதைநடையின் நிகழ்வுத் தொடரைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; தனியாக ‘அப்போது நிகழ்ந்தது’ என்று மொழிபெயர்த்தால் வாக்கியம் தேவையின்றி கனமாகும்.
- source_word: הֵם יֹשְׁבִים
  choice: அவர்கள் … அமர்ந்திருந்தபோது
  rationale: சுட்டுப்பெயருடன் வரும் நிகழ்காலப் பெயரெச்சம் தொடர்ந்துகொண்டிருந்த பின்னணி நிலையைக் குறிக்கிறது.
- source_word: אֶל הַשֻּׁלְחָן
  choice: மேசையருகே
  rationale: יֹשְׁבִים என்பதுடன் சேர்ந்த אֶל, உணவுக்காக மேசையருகே அமர்ந்திருப்பதைக் குறிக்கும் இயல்பான பயன்பாடு.
- source_word: דְּבַר יְהוָה
  choice: யெகோவாவின் வார்த்தை
  rationale: தீர்க்கதரிசன வெளிப்பாட்டைக் குறிக்கும் நிலையான எபிரெயச் சொற்றொடரின் நேர்த்தியான தமிழ் வடிவம்.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: நான்கு எழுத்துகளாலான இறைப்பெயரைப் பொதுப்பட்டமான ‘கர்த்தர்’ என்று மாற்றாமல், தமிழில் பரவலாக அறியப்படும் தனிப்பெயர் வடிவில் தருகிறது.
- source_word: אֶל הַנָּבִיא
  choice: இறைவாக்கினருக்கு
  rationale: இறைவார்த்தையைப் பெற்ற நபரை אֶל குறிக்கிறது; ‘-க்கு’ என்னும் வேற்றுமை உருபு தமிழில் இயல்பானது.
- source_word: אֲשֶׁר הֱשִׁיבוֹ
  choice: அவரைத் திரும்ப அழைத்து வந்த
  rationale: שׁוב என்பதன் ஹிபில் வடிவம் ஒருவரைத் திரும்பச் செய்த causative பொருளைக் கொண்டது; சூழலில் முதிய இறைவாக்கினர் தேவமனிதரைத் தமது வீட்டுக்குத் திரும்ப அழைத்து வந்தார்.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே
  rationale: மூலத்தில் பொதுப்பட்டப் பெயர் அல்ல, தனித்த இறைப்பெயரே உள்ளது. அதன் உச்சரிப்பு முழுமையாக உறுதிப்படுத்த முடியாததால், தமிழ் வாசகர்களிடையே பரவலாக அறியப்படும் ‘யெகோவா’ வடிவம் தேர்ந்தெடுக்கப்பட்டது; ‘யாவே’ என்பதும் சாத்தியமான ஒலிபெயர்ப்பு.
- issue: הַנָּבִיא என்பதன் தமிழ் வடிவம்
  choice: இறைவாக்கினர்
  alternative: தீர்க்கதரிசி
  rationale: இவ்விடத்தில் அவர் இறைவார்த்தையைப் பெறுபவர் என்பதே முன்னிலைப்படுகிறது; ‘இறைவாக்கினர்’ அதை நேரடியாகவும் சமயப்பிரிவு சார்பின்றியும் தெரிவிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மதிப்புமிக்க கதைநடை. எபிரெயத்தின் பின்னணி நிகழ்வும் முதன்மை நிகழ்வும் ஒரே இயல்பான தமிழ் வாக்கியத்தில் பாதுகாக்கப்பட்டுள்ளன.
