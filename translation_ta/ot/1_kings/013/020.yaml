- from: அவர்கள் மேசையருகே அமர்ந்திருந்தபோது, அவரைத் திரும்ப அழைத்து வந்த இறைவாக்கினருக்கு யெகோவாவின் வார்த்தை வந்தது.
  to: அவர்கள் மேசையருகே அமர்ந்திருந்தபோது, அவரைத் திரும்பக் கொண்டுவந்த இறைவாக்கினருக்கு யாவேயின் வார்த்தை வந்தது.
  rationale: The revision preserves the Hebrew narrative sequence implicitly, its ongoing mealtime setting, and the referential ambiguity resolved by the immediate context ('him' = the man of God). It updates the divine-name transliteration to align with the project's Yahweh policy and slightly sharpens the causative force of the Hiphil verb.
