  yaml_path: translation/ot/1_kings/013/010.yaml
  text: So he went by another way and did not return by the way he had come to Bethel.
translation:
  language: ta
  text: அவன் வேறொரு வழியாகச் சென்றான்; பெத்தேலுக்கு வந்த வழியாக அவன் திரும்பிச் செல்லவில்லை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: எனவே, அவன் சென்றான்
  rationale: வாவ் தொடர்வினை கதையை முன்னெடுத்துச் செல்கிறது; முந்தைய கட்டளைக்கு இணங்க நிகழ்ந்த விளைவை இச்சூழலில் ‘எனவே’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּדֶרֶךְ אַחֵר
  choice: வேறொரு வழியாக
  rationale: דֶּרֶךְ என்பது வழி, சாலை அல்லது பயணப்பாதை எனப் பொருள்படும்; முன்பு வந்த பாதைக்கு மாறான பாதையை இச்சொற்றொடர் தெளிவாகக் காட்டுகிறது.
- source_word: וְלֹא שָׁב
  choice: திரும்பிச் செல்லவில்லை
  rationale: שׁוּב இப்பயணச் சூழலில் திரும்புதல் அல்லது மீண்டும் செல்லுதல் என்று பொருள்படுகிறது; தமிழில் ‘திரும்பிச் செல்லவில்லை’ இயல்பாக உள்ளது.
- source_word: בַּדֶּרֶךְ אֲשֶׁר בָּא בָהּ
  choice: தான் வந்த வழியாக
  rationale: உறவுப்பெயர் வாக்கியம் அவன் முதலில் பயணித்த பாதையைக் குறிக்கிறது; בָהּ என்ற பெண்பால் பின்னொட்டு דֶּרֶךְ-ஐச் சுட்டுவது தமிழில் ‘வழியாக’ என்பதில் இயல்பாக அடங்குகிறது.
- source_word: אֶל בֵּית אֵל
  choice: பெத்தேலுக்கு
  rationale: בֵּית אֵל என்பது இடப்பெயர்; தமிழ் வேதாகமப் பயன்பாட்டில் பரிச்சயமான ‘பெத்தேல்’ என்ற ஒலிபெயர்ப்பு வைக்கப்பட்டு, אֶל குறிக்கும் இலக்கு ‘-க்கு’ மூலம் வெளிப்படுத்தப்படுகிறது.
