translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையானதாயும் கண்ணியமானதாயும் உள்ள உரைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மூலத்தின் பயணப்பாதை சார்ந்த மீளுரைப்பை அர்த்தத் தெளிவுக்காகத் தக்கவைத்துள்ளது.
