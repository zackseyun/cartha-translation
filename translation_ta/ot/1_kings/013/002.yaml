  naturalness: உரை பொதுவாக நவீன நிலையான தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது. ‘மேடுகளின் பூசாரிகள்’ என்பது இயல்பாக மேடுகளில் வாழும் அல்லது மேடுகளுக்குரிய பூசாரிகள் என்ற பொருளைத் தரக்கூடும்; ‘உயர்ந்த வழிபாட்டு இடங்களின் பூசாரிகள்’ என்பது பொருளைத் தெளிவுபடுத்துகிறது. ‘யாவேயின் வார்த்தையினால்’ என்பது இச்சூழலில் மூலத்தின் அதிகார/ஏவல் நுணுக்கத்திற்கு இயல்பானது.
  terminology: ‘யாவே,’ ‘பலிபீடம்,’ ‘பலியிடுவான்,’ மற்றும் ‘மனித எலும்புகள்’ பொருத்தமானவை. מַקְטִירִים என்பதன் பலிசார் புகை-ஏற்றும் பொருளை மிகக் குறுகலாக்காமல் ‘புகை எழுப்புகிற’ என வழங்கப்பட்டுள்ளது. அடிக்குறிப்பு c-யில் எபிரெயச் சொல்லை விளக்கும்போது ‘ஆதாமின்’ என்ற தவறான தனிப்பட்ட பெயர்ப் புரிதலைத் தவிர்த்து, பொதுமையான மனிதர் என்ற பொருளைத் தெளிவாகக் குறிப்பிட வேண்டும்.
