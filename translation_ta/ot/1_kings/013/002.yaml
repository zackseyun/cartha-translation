base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/002.yaml
  text: 'And he cried out against the altar by the word of Yahweh and said[a], “Altar, altar, thus says Yahweh: Behold, a son will be born to the house of David, Josiah by name, and he will sacrifice on you the priests of the high places who burn incense on you[c][b], and human bones will be burned on you.”'
translation:
  language: ta
  text: 'அவன் யாவேயின் வார்த்தையினால்[a] பலிபீடத்திற்கு எதிராக உரத்த குரலில் அறிவித்தான்: “பலிபீடமே, பலிபீடமே! யாவே கூறுவது இதுவே: இதோ, தாவீதின் வம்சத்தில் ஒரு மகன் பிறப்பான்; அவன் பெயர் யோசியா. உன்மேல் புகை எழுப்புகிற உயர்ந்த வழிபாட்டு இடங்களின் பூசாரிகளை அவன் உன்மேல் பலியிடுவான்[b]; மனித எலும்புகளும் உன்மேல் எரிக்கப்படும்[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “யாவேயின் வார்த்தையின்படி” அல்லது “யாவேயின் வார்த்தையின் பேரில்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “அவர்களை உன்மேல் வெட்டுவான்” என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல் பலிக்காகக் கொல்வதைக் குறிக்கும் தொனியுடையது; பலிபீடம் தீட்டுப்படுத்தப்படுவதை இது திட்டமிட்டு வலியுறுத்தலாம்.
    reason: lexical_alternative
  - marker: c
    text: எபிரெயில் “மனிதரின் எலும்புகள்”; இங்கு אָדָם பொதுவாக மனிதர்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא עַל הַמִּזְבֵּחַ
  choice: அந்தப் பலிபீடத்திற்கு எதிராக உரத்த குரலில் அறிவித்தான்
  rationale: קרא על என்பதில் உரத்த தீர்க்கதரிசன அறிவிப்பும் எதிரான திசையும் உள்ளன; இயல்பான நவீனத் தமிழில் இரண்டையும் வெளிப்படுத்துகிறது.
- source_word: בִּדְבַר יְהוָה
  choice: யாவேயின் வார்த்தையின்படி
  rationale: ב முன்னொட்டு வழி, ஆணை, அல்லது அதிகாரத்தைச் சுட்டலாம். ‘வார்த்தையின்படி’ தீர்க்கதரிசன ஆணையைக் காட்டுகிறது; பிற சாத்தியங்கள் அடிக்குறிப்பில் காக்கப்படுகின்றன.
- source_word: מִזְבֵּחַ מִזְבֵּחַ
  choice: பலிபீடமே, பலிபீடமே
  rationale: நேரடி அழைப்பையும் வலியுறுத்தும் இரட்டிப்பையும் அப்படியே காக்கிறது.
- source_word: כֹּה אָמַר יְהוָה
  choice: யாவே கூறுவது இதுவே
  rationale: தீர்க்கதரிசனத் தூதர் சூத்திரத்தைத் தெளிவான, கண்ணியமான நவீனத் தமிழில் தருகிறது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் அறிவிப்புச் சொல்லின் உயர்ந்த தொனியை இயல்பாகக் காக்கிறது.
- source_word: בֵן נוֹלָד לְבֵית דָּוִד
  choice: தாவீதின் குடும்பத்தில் ஒரு மகன் பிறப்பான்
  rationale: பங்கேற்பு வடிவம் தீர்க்கதரிசனச் சூழலில் வருங்காலப் பிறப்பைக் குறிக்கிறது. בית என்பதன் வம்ச/குடும்பப் பொருளை ‘குடும்பம்’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: יֹאשִׁיָּהוּ שְׁמוֹ
  choice: அவன் பெயர் யோசியா
  rationale: எபிரெயப் பெயரிடும் சுருக்கமான கட்டமைப்பை இயல்பான தமிழில் வழங்குகிறது.
- source_word: וְזָבַח עָלֶיךָ
  choice: அவன் உன்மேல் பலியிடுவான்
  rationale: זבח என்பதிலுள்ள பலிசார் தொனியையும் பலிபீடத்தைத் தீட்டுப்படுத்தும் கொடூரமான பரிகாசத்தையும் காக்கிறது.
- source_word: כֹּהֲנֵי הַבָּמוֹת
  choice: மேடுகளின் பூசாரிகள்
  rationale: במות என்பது உயர்ந்த இடங்களில் அமைந்த உள்ளூர் வழிபாட்டுத் தலங்களைக் குறிக்கிறது; ‘மேடுகள்’ சுருக்கமாக மூல உருவகத்தை காக்கிறது.
- source_word: הַמַּקְטִרִים עָלֶיךָ
  choice: உன்மேல் நறுமணப்புகை எழுப்புகிற
  rationale: קטר என்பது தூபம் மட்டுமல்லாமல் பலிப்பொருளைப் புகையாக்குவதையும் குறிக்கலாம். ‘நறுமணப்புகை எழுப்புகிற’ என்பது அந்தச் சாத்திய அகலத்தைக் ஓரளவு காக்கிறது.
- source_word: וְעַצְמוֹת אָדָם
  choice: மனித எலும்புகள்
  rationale: אָדָם இங்கு தனிப்பட்ட ஆணை அல்ல, பொதுவாக மனிதரைச் சுட்டுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
