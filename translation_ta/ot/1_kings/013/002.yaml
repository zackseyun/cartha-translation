  choice: பலியிடுவான்
  alternative: கொன்று போடுவான்; வெட்டுவான்
  rationale: சாதாரணக் கொலையைவிட மூல வினைச்சொல்லின் சடங்கு சார்ந்த தொனியையும் பலிபீட அவமதிப்பின் திட்டமிட்ட பரிகாசத்தையும் காக்கிறது.
- issue: עצמות אדם வாக்கியத்தின் செயப்பாட்டு நிலை
  choice: மனித எலும்புகளும் உன்மேல் எரிக்கப்படும்
  alternative: அவன் மனித எலும்புகளை உன்மேல் எரிப்பான்
  rationale: எபிரெய வினை பன்மைச் செய்பாட்டில் இருந்து செய்பவரை வெளிப்படையாகக் குறிப்பிடவில்லை; தமிழிலும் அந்தத் தெளிவின்மையை காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் கண்ணியமான தீர்க்கதரிசனத் தொனி பயன்படுத்தப்பட்டுள்ளது. நேரடி அழைப்பின் இரட்டிப்பு, இறைப்பெயர், சடங்கு சார்ந்த சொல்விளையாட்டு, மற்றும் இறுதி வாக்கியத்தின் குறிப்பிடப்படாத செய்பவர் ஆகியவை காக்கப்பட்டுள்ளன. அனைத்து அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
