  revised_text: 'அவன் யாவேயின் வார்த்தையினால்[a] பலிபீடத்திற்கு எதிராக உரத்த குரலில் அறிவித்தான்: “பலிபீடமே, பலிபீடமே! யாவே கூறுவது இதுவே: இதோ, தாவீதின் வம்சத்தில் ஒரு மகன் பிறப்பான்; அவன் பெயர் யோசியா. உன்மேல் புகை எழுப்புகிற உயர்ந்த வழிபாட்டு இடங்களின் பூசாரிகளை அவன் உன்மேல் பலியிடுவான்[b]; மனித எலும்புகளும் உன்மேல் எரிக்கப்படும்[c].”'
