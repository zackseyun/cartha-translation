base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/011.yaml
  text: An old prophet was living in Bethel[a], and his sons came and told him all the deed that the man of God had done that day in Bethel, and the words that he had spoken to the king[b]; they told them to their father.
translation:
  language: ta
  text: பெத்தேலில் முதிய தீர்க்கதரிசி ஒருவர்[a] வாழ்ந்துவந்தார். அவருடைய மகன் வந்து, தேவனுடைய மனிதர் அன்று பெத்தேலில் செய்த அந்தச் செயல் முழுவதையும், அவர் அரசனிடம் பேசிய வார்த்தைகளையும் அவரிடம் சொன்னான்; அவற்றை அவர்கள் தங்கள் தந்தையிடம் சொன்னார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘குறிப்பிட்ட ஒரு முதிய தீர்க்கதரிசி.’
    reason: lexical_alternative
  - marker: b
    text: எபிரெய உரை முதலில் ஒருமையில், ‘அவருடைய மகன் வந்து … சொன்னான்’ என்று கூறி, பின்னர் பன்மையில், ‘அவர்கள் … சொன்னார்கள்’ என்று மாறுகிறது. இது ஒன்றுக்கு மேற்பட்ட மகன்களைக் குறிக்கலாம் அல்லது கதையாடலில் உள்ள எண்ணின் மாற்றமாக இருக்கலாம்; மொழிபெயர்ப்பு இந்த மாற்றத்தை ஒத்திசைக்காமல் பாதுகாக்கிறது.
    reason: textual_variant
lexical_decisions:
- source_word: נָבִיא אֶחָד זָקֵן
  choice: முதிய தீர்க்கதரிசி ஒருவர்
  rationale: אֶחָד இங்கு குறிப்பிட்ட ஆனால் பெயரிடப்படாத ஒருவரை அறிமுகப்படுத்துகிறது. ‘ஒருவர்’ என்பது இந்தத் தீர்மானமின்மையை இயல்பான நவீன தமிழில் தருகிறது; ‘குறிப்பிட்ட ஒருவர்’ என்ற வலியுறுத்தலை முதன்மை உரையில் தேவையின்றி சேர்க்கவில்லை.
- source_word: יֹשֵׁב בְּבֵית־אֵל
  choice: பெத்தேலில் … வாழ்ந்துவந்தார்
  rationale: יֹשֵׁב என்பதன் அடிப்படைப் பொருள் ‘அமர்ந்திருத்தல்’ என்றாலும், இச்சூழலில் அது குடியிருப்பதைக் குறிக்கிறது. ‘வாழ்ந்துவந்தார்’ நிலைத்த குடியிருப்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיָּבֹא בְנוֹ וַיְסַפֶּר לוֹ
  choice: அவருடைய மகன் வந்து … அவரிடம் விவரித்தான்
  rationale: בְנוֹ மற்றும் முதல் வினைச்சொல் ஒருமையில் இருப்பதால், ‘மகன்’ என்றும் ‘விவரித்தான்’ என்றும் ஒருமை பாதுகாக்கப்பட்டுள்ளது.
- source_word: אֶת כָּל הַמַּעֲשֶׂה
  choice: அந்தச் செயல் முழுவதையும்
  rationale: מַעֲשֶׂה ஒருமையில் இருந்து, இறைவனின் மனிதர் செய்த குறிப்பிடத்தக்க செயலை மொத்தமாகக் குறிக்கிறது. ‘செயல் முழுவதையும்’ ஒருமையையும் முழுமையையும் காக்கிறது.
- source_word: אִישׁ הָאֱלֹהִים
  choice: இறைவனின் மனிதர்
  rationale: இது முன்னைய தீர்க்கதரிசன நூல்களில் வரும் நிலையான தீர்க்கதரிசனப் பட்டம். சொற்றொடரின் தனித்தன்மையைப் பாதுகாக்க நேரடியாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: הַיּוֹם
  choice: அன்று
  rationale: கடந்தகாலக் கதையாடலில் הַיּוֹם இயல்பாக ‘அன்று’ என அமைகிறது.
- source_word: אֶת הַדְּבָרִים אֲשֶׁר דִּבֶּר אֶל הַמֶּלֶךְ
  choice: அவர் அரசனிடம் பேசிய வார்த்தைகளையும்
  rationale: דְּבָרִים என்பதன் ‘வார்த்தைகள்’ என்ற உருவைத் தக்கவைத்து, செய்த செயலிலிருந்து தீர்க்கதரிசனப் பேச்சைத் தனியே காட்டுகிறது.
- source_word: וַיְסַפְּרוּם לַאֲבִיהֶם
  choice: அவற்றை அவர்கள் தங்கள் தந்தையிடம் விவரித்தார்கள்
  rationale: எபிரெய உரையிலுள்ள பன்மை வினை, பன்மை எழுவாய் உணர்வு, பன்மை பொருள் பின்னொட்டு ஆகியவை ஒத்திசைக்கப்படாமல் அப்படியே பாதுகாக்கப்பட்டுள்ளன.
