base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/024.yaml
  text: And he went[a], and a lion found him on the road and killed him. And his corpse was cast on the road, and the donkey was standing beside it, and the lion was standing beside the corpse.
translation:
  language: ta
  text: அவன் சென்றான். வழியில் ஒரு சிங்கம் அவனைக் கண்டு கொன்றது. அவனுடைய சடலம் வழியில் எறியப்பட்டிருந்தது[a]. கழுதை அதன் அருகில் நின்றுகொண்டிருந்தது; சிங்கமும் அந்தச் சடலத்தின் அருகில் நின்றுகொண்டிருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனுடைய இறந்த உடல் வழியில் வீசியெறியப்பட்டுக் கிடந்தது.” எபிரெயச் செயப்பாட்டு வினையெச்சம், உடல் வெறுமனே அங்கே கிடந்தது என்பதைவிட, அது அங்கே எறியப்பட்ட நிலையில் இருந்ததை வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: அவன் சென்றான்
  rationale: வாவ் தொடர்வினை கதையை அடுத்த நிகழ்வுக்கு நகர்த்துகிறது. தமிழில் இயல்பான கதைத் தொடராக எளிமையாக மொழிபெயர்க்கப்பட்டது.
- source_word: וַיִּמְצָאֵהוּ
  choice: அவனைக் கண்டு
  rationale: מצא என்பதன் நேரடிப் பொருள் ‘காணுதல்/கண்டடைதல்’. திடீர் சந்திப்பை மிகையாக விளக்காமல் ‘கண்டு’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אַרְיֵה
  choice: ஒரு சிங்கம்
  rationale: இவ்வாக்கியத்தில் முதன்முறையாக அறிமுகப்படுத்தப்படும் விலங்கு என்பதால் வரையறையற்ற பொருளை ‘ஒரு’ வெளிப்படுத்துகிறது.
- source_word: בַּדֶּרֶךְ
  choice: வழியில்
  rationale: பயணச் சூழலில் דרך என்பதற்கான இயல்பான நவீனத் தமிழ் இணை; வசனத்தின் இரு இடங்களிலும் ஒரேபடி வைக்கப்பட்டது.
- source_word: וַיְמִיתֵהוּ
  choice: கொன்றது
  rationale: מות என்பதன் ஹிஃபில் வடிவம் மரணத்தை ஏற்படுத்துவதைக் குறிக்கிறது; ‘கொன்றது’ நேரடியும் இயல்புமான மொழிபெயர்ப்பு.
- source_word: נִבְלָתוֹ
  choice: அவனுடைய சடலம்
  rationale: נבלה இறந்த உடலைக் குறிக்கிறது. ‘சடலம்’ தெளிவாகவும் மாண்பான நடையிலும் பொருளைத் தருகிறது.
- source_word: מֻשְׁלֶכֶת
  choice: எறியப்பட்டிருந்தது
  rationale: שלך வேரின் ஹோஃபால் செயப்படுபொருள் வினையெச்சம், உடல் அங்கே எறியப்பட்ட நிலையில் இருந்ததைச் சுட்டுகிறது. ‘எறியப்பட்டிருந்தது’ அந்தச் செயப்பாட்டு வலிமையையும் விளைவுநிலையையும் காக்கிறது.
- source_word: וְהַחֲמוֹר עֹמֵד אֶצְלָהּ
  choice: கழுதை அதன் அருகில் நின்றுகொண்டிருந்தது
  rationale: עֹמֵד என்னும் வினையெச்சம் தொடரும் காட்சிநிலையை அமைக்கிறது; ‘நின்றுகொண்டிருந்தது’ அதனை இயல்பாக வெளிப்படுத்துகிறது. பின்னொட்டு சடலத்தைக் குறிப்பதால் ‘அதன்’ பயன்படுத்தப்பட்டது.
- source_word: וְהָאַרְיֵה עֹמֵד אֵצֶל הַנְּבֵלָה
  choice: சிங்கமும் அந்தச் சடலத்தின் அருகில் நின்றுகொண்டிருந்தது
  rationale: எபிரெய உரை ‘சடலம்’ என்ற பெயர்ச்சொல்லை மீண்டும் வெளிப்படையாகக் கூறுகிறது; தமிழிலும் அதை மீண்டும் கூறி, வினையெச்சத்தின் காட்சிநிலையை ‘நின்றுகொண்டிருந்தது’ எனக் காக்கிறது.
