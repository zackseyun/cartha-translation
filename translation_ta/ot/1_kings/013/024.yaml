translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் மாண்பான கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய உரையின் தொடர்ச்சியான நிகழ்வுகளும், இறுதியில் கழுதையும் சிங்கமும் சடலத்தருகே நிற்கும் அசாதாரண காட்சியும் விளக்கச் சேர்க்கைகளின்றி பாதுகாக்கப்பட்டுள்ளன.
