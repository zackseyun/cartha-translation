  yaml_path: translation/ot/1_kings/013/022.yaml
  text: but you came back and ate bread and drank water in the place about which he said to you[a], ‘Do not eat bread, and do not drink water’—your corpse shall not come to the tomb of your fathers.
translation:
  language: ta
  text: ஆனால் நீ திரும்பிவந்து, ‘அப்பம் சாப்பிடாதே; தண்ணீர் குடிக்காதே’ என்று அவர் உன்னிடம் சொன்ன அந்த இடத்தில் அப்பம் சாப்பிட்டுத் தண்ணீர் குடித்தாய்; உன் சடலம் உன் தந்தையரின் கல்லறைக்கு வந்து சேராது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் சடலம் உன் தந்தையரின் கல்லறைக்குள் செல்லாது.” எபிரெயில் சொல்லுக்குச் சொல், “உன் தந்தையரின் கல்லறைக்கு வராது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּשָׁב
  choice: நீ திரும்பிவந்து
  rationale: שׁוב என்பதன் நேரடியான திரும்புதல் பொருளையும், தொடர்ச்சியான நிகழ்வோட்டத்தையும் இயல்பான தமிழில் காக்கிறது.
- source_word: וַתֹּאכַל לֶחֶם
  choice: அப்பம் சாப்பிட்டாய்
  rationale: לֶחֶם என்ற குறிப்பான சொல்லை ‘உணவு’ என்று பொதுமைப்படுத்தாமல், முன் கூறப்பட்ட தடையின் சொற்களை எதிரொலிக்கிறது.
- source_word: וַתֵּשְׁתְּ מַיִם
  choice: தண்ணீர் குடித்தாய்
  rationale: தடையில் மீண்டும் வரும் அதே செயலும் பொருளும் தெளிவாகப் பாதுகாக்கப்படுகின்றன.
- source_word: בַּמָּקוֹם אֲשֶׁר דִּבֶּר אֵלֶיךָ
  choice: அவர் உன்னிடம் சொன்ன அந்த இடத்தில்
  rationale: எபிரெய உறவுத்தொடரின் பொருளை இயல்பான தமிழில் தருகிறது; அடுத்துவரும் நேரடிக் கூற்று அந்த இடத்தைப் பற்றிய கட்டளையாகத் தெளிவுபடுத்துகிறது.
- source_word: אַל תֹּאכַל לֶחֶם וְאַל תֵּשְׁתְּ מָיִם
  choice: ‘அப்பம் சாப்பிடாதே; தண்ணீர் குடிக்காதே’
  rationale: இரு தனித்தடை வடிவங்களையும் மீளுரையையும் காக்கிறது; அரைப்புள்ளி தமிழில் அவற்றைத் தெளிவாக இணைக்கிறது.
- source_word: נִבְלָתְךָ
  choice: உன் சடலம்
  rationale: נְבֵלָה குறிக்கும் இறந்த உடலின் கடுமையான, நேரடியான பொருளை கண்ணியமான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: לֹא תָבֹא נִבְלָתְךָ אֶל קֶבֶר אֲבֹתֶיךָ
  choice: உன் சடலம் உன் தந்தையரின் கல்லறைக்கு வந்து சேராது
  rationale: ‘வருதல்’ என்ற எபிரெய உருவகத்தைத் தக்கவைத்தபடி, தமிழில் இலக்கிடத்தை அடைதல் என்ற பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֲבֹתֶיךָ
  choice: உன் தந்தையர்
  rationale: ஆண்பால் பன்மையையும் குடும்ப முன்னோரின் அடக்க இடம் என்ற குறிப்பையும் பாதுகாக்கிறது; பொதுவான ‘முன்னோர்’ என விரிவுபடுத்தவில்லை.
theological_decisions:
- issue: தீர்ப்புரையின் தன்மை
  choice: இறைவனுடைய மனிதனின் சடலம் அவன் தந்தையரின் குடும்பக் கல்லறையை வந்து சேராது என்ற நேரடியான அறிவிப்பு
  alternative: இறப்புக்குப் பிந்தைய அவமதிப்பைக் குறிக்கும் பரந்த உருவகக் கூற்று
  rationale: எபிரெய உரை சடலம் தந்தையரின் கல்லறைக்கு வராததிலேயே கவனம் செலுத்துகிறது. மொழிபெயர்ப்பு இதை குடும்ப அடக்கத்தை இழத்தல் என்ற konkreட்டான தீர்ப்பாக வைத்திருக்கிறது; உரை கூறாத மேலதிக இறையியல் விளக்கத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; நேரடியும் கண்ணியமுமான தீர்க்கதரிசனக் கண்டன நடை. ‘அப்பம்’, ‘சடலம்’, ‘தந்தையர்’ ஆகியவை மூலத்தின் குறிப்புத்தன்மையையும் மீளுரையையும் காக்கின்றன.
