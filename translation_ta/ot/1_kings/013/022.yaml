  naturalness: The Tamil is clear and suitably direct. A semicolon provides a more natural connection between the rebuke and the pronouncement without introducing an added causal word.
  terminology: “அப்பம்,” “தண்ணீர்,” “சடலம்,” and “தந்தையர்” appropriately preserve the concrete and dignified wording. “கல்லறைக்கு வந்து சேராது” is a natural Tamil expression for the Hebrew image of the corpse not coming to the ancestral tomb.
