source:
  edition: WLC
  text: וַ/יְהִי֙ בַּ/דָּבָ֣ר הַ/זֶּ֔ה לְ/חַטַּ֖את בֵּ֣ית יָרָבְעָ֑ם וּ/לְ/הַכְחִיד֙ וּ/לְ/הַשְׁמִ֔יד מֵ/עַ֖ל פְּנֵ֥י הָ/אֲדָמָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/034.yaml
  text: And this matter became sin for the house of Yarovam[b][a], to cut it off and to destroy it from the face of the ground.
translation:
  language: ta
  text: இந்தக் காரியம்[a] யெரொபெயாமின் வம்சத்துக்குப் பாவமாகி, அந்த வம்சத்தை நிலத்தின் முகத்திலிருந்து[b] அறவே ஒழித்து அழிக்க வழிவகுத்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இந்தக் காரியம்’ என்பதை ‘இந்த விஷயம்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் ஒரு காரியம், விவகாரம் அல்லது பொருளைப் பரந்த விதத்தில் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘நிலத்தின் முகத்திலிருந்து’ என்பது பூமி அல்லது நாட்டிலிருந்து முற்றிலும் அகற்றப்படுவதைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ஆகி ... வழிவகுத்தது
  rationale: இங்கு היה முன் விவரிக்கப்பட்ட காரியம் எத்தகைய விளைவுக்கு வந்தது என்பதைக் காட்டுகிறது. தமிழில் இயல்பாகவும் விளைவு சார்ந்த தொடர்பைத் தெளிவாகவும் சொல்ல இந்த அமைப்பு பயன்படுத்தப்பட்டது.
- source_word: בַּדָּבָר הַזֶּה
  choice: இந்தக் காரியம்
  rationale: דָּבָר இங்கு ஒரு சொல்லை மட்டும் அல்லாமல், முன்பு விவரிக்கப்பட்ட செயல் அல்லது விவகாரத்தைச் சுட்டுகிறது. ‘காரியம்’ அதன் பரந்த பொருளைத் தக்கவைக்கிறது.
- source_word: לְחַטַּאת
  choice: பாவமாகி
  rationale: היה לְחַטָּאת என்ற அமைப்பு பாவமாக அல்லது பாவத்துக்குக் காரணமாக ஆனதைக் குறிக்கலாம். ‘பாவமாகி’ அதன் சுருக்கத்தையும் பொருள் நெகிழ்வையும் காக்கிறது.
- source_word: בֵּית יָרָבְעָם
  choice: யெரொபெயாமின் குடும்பம்
  rationale: בֵּית என்பது இங்கு கட்டடமான வீட்டை விட யெரொபெயாமின் குடும்ப வழி அல்லது வம்சத்தைக் குறிக்கிறது. சாதாரண வாசகருக்கு ‘குடும்பம்’ இயல்பாக இருந்து, அந்தக் கூட்டுப் பொருளையும் தக்கவைக்கிறது.
- source_word: וּלְהַכְחִיד
  choice: அகற்றி
  rationale: כחד என்பதன் ஹிஃபில் வடிவம் மறையச் செய்தல் அல்லது இல்லாமல் செய்தல் என்ற கருத்தைக் கொண்டது. அடுத்துள்ள வலுவான அழிவு வினையிலிருந்து இதை வேறுபடுத்த ‘அகற்றி’ என மொழிபெயர்க்கப்பட்டது.
- source_word: וּלְהַשְׁמִיד
  choice: அழித்தொழிக்க
  rationale: שׁמד என்பதன் ஹிஃபில் வடிவம் முழுமையான அழிவைக் குறிக்கிறது. ‘அழித்தொழிக்க’ எபிரெய இணை வினைகளின் தீவிரத்தையும் வேறுபாட்டையும் வெளிப்படுத்துகிறது.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: நிலத்தின் முகத்திலிருந்து
  rationale: எபிரெய மொழியின் உருவகச் சொல்லாட்சியைத் தக்கவைத்து, நிலத்திலிருந்து முற்றிலும் நீக்கப்படுதல் என்ற கருத்தை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: அகற்றுதல் மற்றும் அழித்தொழித்தல் ஆகிய வினைகளின் மறைமுகச் செயப்படுபொருள்
  choice: யெரொபெயாமின் குடும்பமே செயப்படுபொருள் என்பதை ‘அந்தக் குடும்பத்தை’ என்று வெளிப்படுத்துதல்
  alternative: அந்த வினைகள் பாவமான காரியத்தையே பொதுவாகக் குறிப்பதாகப் புரிந்துகொள்ளுதல்
  rationale: இலக்கண ரீதியாக அருகிலுள்ள ‘யெரொபெயாமின் குடும்பம்’ என்பதே மிகவும் இயல்பான செயப்படுபொருள்; கதைச்சூழலும் அவனுடைய குடும்ப வழிக்கு வரும் தீர்ப்பைப் பற்றியது. எபிரெயத்தில் மறைந்துள்ள செயப்படுபொருளைத் தமிழில் மட்டும் தெளிவுபடுத்துகிறது.
- issue: לְ தொடர்களின் நோக்கம் அல்லது விளைவு சார்ந்த தன்மை
  choice: தீர்ப்பின் விளைவாக ‘வழிவகுத்தது’ என்று மொழிபெயர்த்தல்
  alternative: ‘அகற்றுவதற்கும் அழித்தொழிப்பதற்கும்’ என்று நோக்கத்தை மட்டும் முறையாகப் பிரதிபலித்தல்
  rationale: இவ்வசனத்தின் சூழலில் அந்தப் பாவம் குடும்பத்தின் அழிவில் முடியும் விளைவைச் சுட்டுகிறது. ‘வழிவகுத்தது’ காரண-விளைவு உறவை இயல்பான தமிழில் தருகிறது; தீர்ப்பை யார் நிறைவேற்றுகிறார் என்பதை உரையில் புதிதாகச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘குடும்பம்’ வம்சத்தையும் குடும்ப வழியையும் உள்ளடக்குகிறது; ‘நிலத்தின் முகம்’ என்ற மூல உருவகம் அடிக்குறிப்பு விளக்கத்துடன் தக்கவைக்கப்பட்டது.
