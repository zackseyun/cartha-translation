  naturalness: திருத்தப்பட்ட உரை நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் உள்ளது. ‘விரும்பிய எவரையும்’ என்பது ‘விரும்பியவன் எவனோ’ என்பதைக் காட்டிலும் வழக்கமான உரைநடை.
  terminology: ‘உயர்ந்த வழிபாட்டு இடங்கள்’ என்பது בָמוֹת-இன் வழிபாட்டுச் சூழலைப் பாதுகாக்கிறது; கூடுதலான சட்டவிரோதம் அல்லது இறையியல் விளக்கத்தைச் சேர்ப்பதில்லை. ‘ஆசாரியப் பணியில் அமர்த்தினான்’ நிறுவுதல் மரபுத்தொடரின் செயல்பாட்டுப் பொருளை இயல்பாகத் தருகிறது.
