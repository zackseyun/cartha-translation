  text: אַחַר֙ הַ/דָּבָ֣ר הַ/זֶּ֔ה לֹֽא שָׁ֥ב יָרָבְעָ֖ם מִ/דַּרְכּ֣/וֹ הָ/רָעָ֑ה וַ֠/יָּשָׁב וַ/יַּ֜עַשׂ מִ/קְצ֤וֹת הָ/עָם֙ כֹּהֲנֵ֣י בָמ֔וֹת הֶֽ/חָפֵץ֙ יְמַלֵּ֣א אֶת יָד֔/וֹ וִ/יהִ֖י כֹּהֲנֵ֥י בָמֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/033.yaml
  text: After this event[a], Jeroboam did not turn from his evil way, but again made priests of high places from among all the people. Whoever desired it, he ordained him, and he became one of the priests of the high places.
translation:
  language: ta
  text: இந்த நிகழ்ச்சிக்குப் பிறகும்[a] யெரொபெயாம் தன் தீய வழியை விட்டுத் திரும்பவில்லை. அவன் மீண்டும் மக்களிடமிருந்து எவரையும்[b] உயர்ந்த வழிபாட்டு இடங்களின் ஆசாரியர்களாக நியமித்தான். விரும்பிய எவரையும் அவன் ஆசாரியப் பணியில் அமர்த்தினான்[c]; அப்படிப்பட்டவன் உயர்ந்த வழிபாட்டு இடங்களின் ஆசாரியர்களில் ஒருவனானான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நிகழ்ச்சி’ என்பதற்கான எபிரெயச் சொல் ‘காரியம்’, ‘விஷயம்’ அல்லது ‘சொல்’ என்றும் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், ‘மக்களின் கடைகளிலிருந்து’ என்று நேரடியாக உள்ளது. இது ‘மக்களிடமிருந்து எவரையும்,’ ‘மக்களில் சிலரை,’ அல்லது ‘மக்களின் கீழ்நிலையிலிருந்தவர்களை’ எனப் புரிந்துகொள்ளப்படலாம்.
    reason: lexical_alternative
  - marker: c
    text: நேரடியாக, ‘அவனுடைய கையை நிரப்பினான்.’ இது ஒருவரை ஆசாரியப் பணியில் நிறுவுவதைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַר הַדָּבָר הַזֶּה
  choice: இந்த நிகழ்ச்சிக்குப் பிறகும்
  rationale: דָּבָר இங்கு முந்திய நிகழ்வைச் சுட்டுகிறது. அடுத்துள்ள மறுப்புடன் தொடர்ச்சியான எதிர்மறை வலியுறுத்தலை இயல்பாக வெளிப்படுத்த ‘பிறகும்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: לֹא שָׁב ... מִדַּרְכּוֹ הָרָעָה
  choice: தன் தீய வழியைவிட்டுத் திரும்பவில்லை
  rationale: שׁוּב என்பதன் ‘திரும்புதல்’ உருவகத்தைப் பாதுகாக்கிறது; விளக்கமான ‘மனந்திரும்பவில்லை’ என்பதைத் தவிர்க்கிறது.
- source_word: וַיָּשָׁב וַיַּעַשׂ
  choice: மறுபடியும் நியமித்தான்
  rationale: שׁוּב இங்கு அடுத்த செயலை மீண்டும் செய்ததைக் குறிக்கிறது; தமிழில் இயல்பாக ‘மறுபடியும்’ என வழங்கப்பட்டுள்ளது.
- source_word: מִקְצוֹת הָעָם
  choice: மக்களில் எவரையும்
  rationale: சொற்றொடர் கடினமும் பொருள் விவாதத்திற்குரியதும் ஆகும். சூழலில், மக்களிடையே தகுந்த குல வரையறையின்றி ஆட்களைத் தேர்ந்தெடுத்த கருத்தை இது இயல்பாகத் தெரிவிக்கிறது; மாற்று நேரடி புரிதல் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: כֹּהֲנֵי בָמוֹת
  choice: மேடைகளுக்கான ஆசாரியர்கள் / மேடைகளின் ஆசாரியர்கள்
  rationale: בָּמוֹת என்பது இச்சூழலில் வழிபாட்டுக்கான உயர்ந்த மேடைகளைக் குறிக்கிறது. முதல் இடத்தில் பணிக்குரிய உறவையும், இறுதியில் அந்தக் குழுவில் சேர்ந்ததையும் இயல்பான தமிழில் காட்டுகிறது.
- source_word: הֶחָפֵץ
  choice: விரும்பியவன் எவனோ
  rationale: ஒருமை வினையெச்சம் பொதுப்படையாக ‘விரும்புகிற எவனும்’ என்ற திறந்த, கட்டுப்பாடற்ற பொருளைக் கொடுக்கிறது.
- source_word: יְמַלֵּא אֶת יָדוֹ
  choice: அவனை ஆசாரியப் பணியில் அமர்த்தினான்
  rationale: ‘அவனுடைய கையை நிரப்பினான்’ என்ற எபிரெய மரபுத்தொடர் ஆசாரியப் பணியில் நிறுவுதலைக் குறிக்கிறது. செயல்பொருள் முதன்மை உரையில் தெளிவாக்கப்பட்டு, நேரடி வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: וִיהִי כֹּהֲנֵי בָמוֹת
  choice: அவனும் மேடைகளின் ஆசாரியர்களில் ஒருவனானான்
  rationale: ஒருமை வினையுடன் வரும் பன்மைப் பயனிலை, அந்த ஆசாரியர் வகுப்பில் ஒருவன் சேர்ந்ததைக் குறிக்கிறது; தமிழில் அதனை வெளிப்படையாக வழங்குகிறது.
theological_decisions:
- issue: שׁוּב என்பதை சமயவியல் சொல்லான ‘மனந்திரும்புதல்’ என்று மொழிபெயர்ப்பதா
  choice: தன் தீய வழியைவிட்டுத் திரும்பவில்லை
  alternative: தன் தீய வழிக்காக மனந்திரும்பவில்லை
  rationale: ஒழுக்க மாற்றம் கருத்தில் இருந்தாலும், எபிரெயச் சொல் நேரடியாக ‘திரும்புதல்’ என்பதே. மூலத்தின் வழி உருவகத்தையும் இறையியல் பதற்றத்தையும் பாதுகாக்கப்பட்டது.
- issue: יְמַלֵּא אֶת יָדוֹ என்ற ஆசாரிய நிறுவுதல் மரபுத்தொடரை எவ்வாறு வழங்குவது
  choice: அவனை ஆசாரியப் பணியில் அமர்த்தினான்
  alternative: அவனைப் பிரதிஷ்டை செய்தான் / அவனுடைய கையை நிரப்பினான்
  rationale: இது ஆசாரியப் பணியில் நிறுவுதலைக் குறிக்கிறது. ‘பிரதிஷ்டை’ பல வாசகர்களுக்கு வேறு சமயச் சாயலை ஏற்படுத்தக்கூடும்; ஆகவே தெளிவான செயல்பாட்டு மொழிபெயர்ப்பு முதன்மை உரையில் பயன்படுத்தப்பட்டு, நேரடி மரபுத்தொடர் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- issue: מִקְצוֹת הָעָם என்பதன் தெளிவற்ற பொருள்
  choice: மக்களில் எவரையும்
  alternative: மக்களின் கடைநிலையிலிருந்தவர்களை / மக்களில் சிலரை
  rationale: அரசன் ஆசாரியர்களை வரையறையின்றி பொதுமக்களிடமிருந்து நியமித்தான் என்ற சூழல்சார் பொருள் முதன்மை உரையில் தரப்பட்டுள்ளது. சொற்றொடரின் நேரடியான மாற்றுப் புரிதல் அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘மேடைகள்’ என்பது அரசர்கள் நூலின் வழிபாட்டு இடங்களுக்குரிய சொல்லாகவும், ‘ஆசாரியர்’ என்பது வாசகர்களுக்குப் பழக்கமான வேதாகமப் பதமாகவும் வைக்கப்பட்டுள்ளது. மூலத்தின் கடினமான מִקְצוֹת הָעָם சொற்றொடரின் மாற்றுப் புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
