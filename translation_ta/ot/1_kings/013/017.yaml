reference: 1 Kings 13:17
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: כִּֽי דָבָ֤ר אֵלַ/י֙ בִּ/דְבַ֣ר יְהוָ֔ה לֹֽא תֹאכַ֣ל לֶ֔חֶם וְ/לֹֽא תִשְׁתֶּ֥ה שָׁ֖ם מָ֑יִם לֹא תָשׁ֣וּב לָ/לֶ֔כֶת בַּ/דֶּ֖רֶךְ אֲשֶׁר הָלַ֥כְתָּ בָּֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/017.yaml
  text: 'For a word came to me by the word of the LORD: ‘You shall not eat bread, and you shall not drink water there; you shall not return by going on the way by which you went.’'
translation:
  language: ta
  text: 'ஏனெனில், கர்த்தருடைய வார்த்தையினால் எனக்கு இவ்வாறு சொல்லப்பட்டது: ‘நீ அங்கே அப்பம் உண்ணக் கூடாது; தண்ணீர் குடிக்கவும் கூடாது. நீ சென்ற வழியாகத் திரும்பிச் செல்லவும் கூடாது.’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דָבָר אֵלַי בִּדְבַר יְהוָה
  choice: கர்த்தருடைய வார்த்தையினால் எனக்கு இவ்வாறு சொல்லப்பட்டது
  rationale: எபிரெயச் சொற்றொடரில் ‘வார்த்தை’ இருமுறை வரும் அமைப்பைத் தமிழில் இயல்பாகவும் அதன் பொருளைத் தெளிவாகவும் வெளிப்படுத்துகிறது; செய்தி கர்த்தரிடமிருந்து வந்தது என்பதைக் காக்கிறது.
- source_word: לֹא תֹאכַל לֶחֶם
  choice: நீ அங்கே உணவு உண்ணக் கூடாது
  rationale: לֶחֶם என்பதன் அடிப்படைப் பொருள் ‘அப்பம்’ என்றாலும், இச்சூழலில் பொதுவாக உண்பதைக் குறிக்கிறது; ‘உணவு’ என்பது நவீனத் தமிழில் இயல்பான சூழல்சார் மொழிபெயர்ப்பு.
- source_word: וְלֹא תִשְׁתֶּה שָׁם מָיִם
  choice: தண்ணீர் குடிக்கவும் கூடாது
  rationale: ‘அங்கே’ என்பதை முந்தைய இணை வாக்கியத்தில் வைத்து, இரு தடைகளுக்கும் பொருந்துமாறு தமிழில் இயல்பாக அமைக்கப்பட்டது.
- source_word: לֹא תָשׁוּב לָלֶכֶת
  choice: திரும்பிச் செல்லவும் கூடாது
  rationale: ‘திரும்பி செல்வதில்லை’ என்ற எபிரெய வினை அமைப்பின் இயக்கப் பொருளைத் தெளிவாகக் காக்கிறது.
- source_word: בַּדֶּרֶךְ אֲשֶׁר הָלַכְתָּ בָּהּ
  choice: நீ சென்ற வழியாக
  rationale: ‘நீ எந்த வழியில் சென்றாயோ, அந்த வழியில்’ என்ற பொருளைச் சுருக்கமான, இயல்பான தமிழில் வழங்குகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: கர்த்தர்
  alternative: யெகோவா / யாவே
  rationale: தமிழ் வேதாகம நடையில் பரவலாக அறியப்படும் மரியாதைமிக்க வடிவத்தைப் பயன்படுத்துகிறது; குறிப்பிட்ட உச்சரிப்பைத் தீர்மானித்து விடாமல் உள்ளது.
- issue: தெய்வீகச் செய்தி வந்த விதம்
  choice: கர்த்தருடைய வார்த்தையினால் எனக்கு இவ்வாறு சொல்லப்பட்டது
  alternative: கர்த்தருடைய வார்த்தையாக ஒரு வார்த்தை என்னிடம் வந்தது
  rationale: மூலத்தின் தெய்வீக ஆதாரத்தைத் தக்கவைத்து, தமிழில் குழப்பமூட்டும் சொல் மறுபடியையும் செயற்கையான நடையையும் தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; மரியாதைமிக்க வேதாகம நடை, ஆனால் பழமையான வினைமுற்றுகள் தவிர்க்கப்பட்டுள்ளன. நேரடி உரையின் கட்டளைத் தடைகள் ஒரே மாதிரியான ‘கூடாது’ அமைப்பில் வழங்கப்பட்டுள்ளன.
