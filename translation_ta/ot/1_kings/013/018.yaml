  text: וַ/יֹּ֣אמֶר ל֗/וֹ גַּם אֲנִ֣י נָבִיא֮ כָּמוֹ/ךָ֒ וּ/מַלְאָ֡ךְ דִּבֶּ֣ר אֵלַ/י֩ בִּ/דְבַ֨ר יְהוָ֜ה לֵ/אמֹ֗ר הֲשִׁבֵ֤/הוּ אִתְּ/ךָ֙ אֶל בֵּיתֶ֔/ךָ וְ/יֹ֥אכַל לֶ֖חֶם וְ/יֵ֣שְׁתְּ מָ֑יִם כִּחֵ֖שׁ לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/018.yaml
  text: And he said to him[a], “I also am a prophet like you, and an angel spoke to me by the word of Yahweh, saying, ‘Bring him back with you to your house, that he may eat bread and drink water.’” But he lied to him.
translation:
  language: ta
  text: அவன் அவனிடம், “நானும் உன்னைப் போன்ற ஒரு தீர்க்கதரிசி. யாவேயின் வார்த்தையால் ஒரு வானதூதன்[a] என்னிடம், ‘அவன் அப்பம் சாப்பிட்டுத் தண்ணீர் குடிக்கும்படி, அவனை உன்னுடன் உன் வீட்டுக்கு அழைத்துக்கொண்டு வா’ என்று பேசினான்” என்றான். ஆனால் அவன் அவனிடம் பொய் சொன்னான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒரு தூதுவர் யாவேயின் வார்த்தையால் என்னிடம் பேசினார்.” எபிரெயச் சொல் வானதூதனையோ மனிதத் தூதுவரையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָבִיא
  choice: தீர்க்கதரிசி
  rationale: கடவுளின் செய்தியை அறிவிப்பவரைக் குறிக்கும் வழக்கமான, பரவலாகப் புரிந்துகொள்ளப்படும் தமிழ் சொல்.
- source_word: מַלְאָךְ
  choice: தூதன்
  rationale: எபிரெயச் சொல் வானதூதனையோ செய்தியைக் கொண்டுவரும் தூதனையோ குறிக்கக்கூடும்; ‘தூதன்’ அந்தச் சொற்பொருள் அகலத்தைத் தக்கவைக்கிறது.
- source_word: דִּבֶּר אֵלַי
  choice: என்னிடம் பேசி
  rationale: நேரடியான தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בִּדְבַר יְהוָה
  choice: யாவேயின் வார்த்தையின்படி
  rationale: בְּ என்பதன் அடிப்படையில், யாவேயின் வார்த்தையே செய்தியின் அதிகாரமும் அடிப்படையும் என்பதைக் காட்டும் தீர்க்கதரிசன வழக்கைத் தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: மூலத்தில் இடம்பெறும் தனிப்பட்ட இறைப்பெயரைப் பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்க்கிறது.
- source_word: הֲשִׁיבֵהוּ
  choice: அவனை … திரும்ப அழைத்துக்கொண்டு வா
  rationale: שׁוב என்பதன் ஹிஃபில் வடிவிலுள்ள காரணவினைப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְיֹאכַל לֶחֶם וְיֵשְׁתְּ מָיִם
  choice: அவன் அப்பம் சாப்பிட்டுத் தண்ணீர் குடிக்கட்டும்
  rationale: கட்டளையைத் தொடரும் நோக்கம் அல்லது அனுமதிப் பொருளை இயல்பாகக் காட்டி, ‘அப்பம்’ மற்றும் ‘தண்ணீர்’ என்ற உறுதியான சொற்களையும் காக்கிறது.
- source_word: כִּחֵשׁ לוֹ
  choice: அவன் அவரிடம் பொய் சொன்னான்
  rationale: கதையாளன் முந்தைய கூற்றைப் பொய்யென நேரடியாக வெளிப்படுத்துவதைக் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல எபிரெய உரை நான்கெழுத்து இறைப்பெயரை நேரடியாகப் பயன்படுத்துவதால், அதை ஒரு பட்டப்பெயரால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- issue: מַלְאָךְ என்பது வானதூதனா அல்லது மனிதத் தூதனா
  choice: தூதன் என்று பொதுவாக மொழிபெயர்த்து மாற்றுப் பொருளை அடிக்குறிப்பில் குறிப்பிடுதல்
  alternative: தேவதூதன்
  rationale: இந்தச் சூழல் வானதூதனைச் சுட்டக்கூடும்; என்றாலும் எபிரெயச் சொல்லே இரு பொருள்களையும் ஏற்கும் என்பதால் மூலத்தின் உண்மையான தெளிவின்மை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரநிலைத் தமிழில் இயல்பான, கண்ணியமான நடையைக் கடைப்பிடிக்கிறது. உரையாடலில் மரியாதையைக் காட்ட ‘உம்மைப்’ பயன்படுத்தப்பட்டாலும், மேற்கோளுக்குள் தூதன் பேசுவதாகக் கூறப்படும் இடத்தில் மூலத்தின் நேரடி ஒருமையை இயல்பாகக் காட்ட ‘உன்/உன்னுடன்’ பயன்படுத்தப்பட்டுள்ளது. இறுதி வாக்கியத்தில் கதையாளனின் எதிர்மறைத் திருப்பத்தைத் தெளிவாக்க ‘ஆனால்’ சேர்க்கப்பட்டுள்ளது.
