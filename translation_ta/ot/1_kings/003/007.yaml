source:
  edition: WLC
  text: וְ/עַתָּה֙ יְהוָ֣ה אֱלֹהָ֔/י אַתָּה֙ הִמְלַ֣כְתָּ אֶֽת עַבְדְּ/ךָ֔ תַּ֖חַת דָּוִ֣ד אָבִ֑/י וְ/אָֽנֹכִי֙ נַ֣עַר קָטֹ֔ן לֹ֥א אֵדַ֖ע צֵ֥את וָ/בֹֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/007.yaml
  text: And now[a], O Yahweh my God, you have made your servant king in place of David my father, though I am a little child[b]; I do not know how to go out or come in.
translation:
  language: ta
  text: இப்போது, என் கடவுளாகிய யாவே, நீர் உமது அடியவனை என் தந்தை தாவீதுக்குப் பதிலாக அரசனாக்கியிருக்கிறீர். நானோ ஒரு சிறு பிள்ளை[a]; வெளியே போகவும் உள்ளே வரவும் எனக்குத் தெரியாது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஓர் இளைஞன்’ என்றும் மொழிபெயர்க்கலாம்; இந்த எபிரெயச் சொற்றொடர் வயதையும் அனுபவமின்மையையும் வலியுறுத்தும் பணிவான தற்குறிப்பு.
    reason: lexical_alternative
  - marker: b
    text: ‘வெளியே போகவும் உள்ளே வரவும்’ என்பது ஒருவருடைய கடமைகளை, குறிப்பாகப் பொதுத் தலைமைப் பொறுப்புகளை, நிறைவேற்றுவதைக் குறிக்கும் எபிரெய மொழிமரபு.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: தேவனுடைய தனிப்பெயரான நான்கெழுத்துப் பெயரைப் பொதுவான தமிழ் ஒலிபெயர்ப்பில் நேரடியாக வழங்குகிறது.
- source_word: אֱלֹהַי
  choice: என் கடவுளாகிய
  rationale: முதல் நபர் உடைமைப் பொருளையும், யாவே என்ற அழைப்புடன் அதன் இயல்பான தமிழ் தொடர்பையும் காக்கிறது.
- source_word: הִמְלַכְתָּ
  choice: அரசனாக்கியிருக்கிறீர்
  rationale: מלך என்பதன் ஹிஃபில் வடிவிலுள்ள ‘அரசனாகச் செய்தீர்’ என்ற காரணவினைப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: עַבְדְּךָ
  choice: உமது அடியவனை
  rationale: அரச ஜெபத்தில் சாலொமோன் தன்னைத் தாழ்த்திக் குறிப்பிடும் பணிவையும், தேவனுக்குச் செய்யும் சேவையையும் ‘அடியவன்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: תַּחַת
  choice: பதிலாக
  rationale: தாவீதின் இடத்தில் அவரது வாரிசாக அரசனாக்கப்பட்டதைத் தெளிவாகக் காட்டுகிறது.
- source_word: נַעַר קָטֹן
  choice: ஒரு சிறு பிள்ளை
  rationale: இச்சொற்றொடரின் இளமை, அனுபவமின்மை, தன்னைத் தாழ்த்தும் தொனி ஆகியவற்றைக் காக்கிறது; துல்லியமான வயதை வற்புறுத்தவில்லை.
- source_word: לֹא אֵדַע
  choice: எனக்குத் தெரியாது
  rationale: பின்வரும் இரட்டை வினையுடன் இணைந்து நடைமுறை அனுபவமின்மையை இயல்பான தமிழில் கூறுகிறது.
- source_word: צֵאת וָבֹא
  choice: வெளியே போகவும் உள்ளே வரவும்
  rationale: எபிரெய மொழிமரபின் உருவகத்தை முதன்மை உரையில் வெளிப்படையாகக் காத்து, அதன் தலைமைப் பொறுப்பு சார்ந்த பொருளை அடிக்குறிப்பில் விளக்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூல உரையில் தனிப்பெயர் நேரடியாக இருப்பதால், பொதுப்பட்டப் பெயராக மாற்றாமல் உடன்படிக்கைப் பெயரை ஒலிபெயர்க்கிறது.
- issue: சாலொமோனின் ‘சிறு பிள்ளை’ என்ற தற்குறிப்பின் பொருள்
  choice: உருவகத்தையும் பணிவான தொனியையும் முதன்மை உரையில் காத்தல்
  alternative: நான் மிகவும் இளைஞன், அனுபவமற்றவன்
  rationale: நַעַר קָטֹן வயதையும் அனுபவமின்மையையும் உணர்த்தலாம்; ஆனால் மூலத்தின் படிமத்தை விளக்கவுரையாக மாற்றாமல், உண்மையான சொற்பொருள் நெகிழ்வை அடிக்குறிப்பில் குறிப்பிடுகிறது.
- issue: ‘வெளியே போகவும் உள்ளே வரவும்’ என்ற மொழிமரபு
  choice: சொற்படிமத்தை முதன்மை உரையில் வைத்தல்
  alternative: மக்களை வழிநடத்த எனக்குத் தெரியாது
  rationale: தலைமைப் பொறுப்பை நிறைவேற்றுதல் என்பது சூழலுக்கேற்ற உட்பொருள்; எனினும் ‘வழிநடத்துதல்’ என்ற சொல் எபிரெய உரையில் நேரடியாக இல்லாததால் அதை அடிக்குறிப்பில் விளக்குகிறது.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க, எளிதில் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. தேவனை நோக்கும் இடங்களில் ‘நீர்/உமது’ என்ற உயர்திணை மரியாதை வடிவங்கள் உள்ளன. மூலத்தின் பணிவான தொனியும் மொழிமரபும் காக்கப்பட்டு, அவற்றின் நுணுக்கங்கள் அடிக்குறிப்புகளில் விளக்கப்பட்டுள்ளன.
