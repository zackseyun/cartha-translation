  text: וַ/יֹּ֨אמֶר אֱלֹהִ֜ים אֵלָ֗י/ו יַעַן֩ אֲשֶׁ֨ר שָׁאַ֜לְתָּ אֶת הַ/דָּבָ֣ר הַ/זֶּ֗ה וְ/לֹֽא שָׁאַ֨לְתָּ לְּ/ךָ֜ יָמִ֣ים רַבִּ֗ים וְ/לֹֽא שָׁאַ֤לְתָּ לְּ/ךָ֙ עֹ֔שֶׁר וְ/לֹ֥א שָׁאַ֖לְתָּ נֶ֣פֶשׁ אֹיְבֶ֑י/ךָ וְ/שָׁאַ֧לְתָּ לְּ/ךָ֛ הָבִ֖ין לִ/שְׁמֹ֥עַ מִשְׁפָּֽט־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/011.yaml
  text: And God said to him, “Because you have asked for this thing, and have not asked for yourself many days, nor have asked for yourself riches, nor have asked for the life of your enemies, but have asked for yourself understanding to hear justice,”
translation:
  language: ta
  text: கடவுள் அவனிடம், “நீ இதைக் கேட்டதாலும், உனக்காக நீண்ட ஆயுளைக் கேட்காமலும், உனக்காகச் செல்வத்தைக் கேட்காமலும், உன் பகைவர்களின் உயிரைக் கேட்காமலும், நீதிநியாயத்தைச் செவிமடுத்து உணர்ந்துகொள்ளும் பகுத்தறிவை உனக்காகக் கேட்டதாலும்—” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָמִים רַבִּים
  choice: நீண்ட ஆயுள்
  rationale: சொல்லுக்குச் சொல் ‘பல நாட்கள்’ என்றாலும், இங்கு நீண்ட காலம் உயிர்வாழ்வதைக் குறிக்கும் எபிரேய மரபுத்தொடரை இயல்பான தமிழில் வழங்குகிறது.
- source_word: נֶפֶשׁ אֹיְבֶיךָ
  choice: உன் பகைவர்களின் உயிர்
  rationale: נֶפֶשׁ இங்கு பகைவர்களின் ‘உயிரை’, அதாவது அவர்களின் மரணத்தை வேண்டுவதைக் குறிக்கிறது; மூலத்தின் நேரடியான வடிவம் பாதுகாக்கப்படுகிறது.
- source_word: הָבִין לִשְׁמֹעַ מִשְׁפָּט
  choice: நீதியைப் பகுத்தறியும் திறன்
  rationale: ‘நியாயத்தீர்ப்பைக் கேட்பதற்கான புரிந்துணர்வு’ என்ற நேரடி அமைப்பின் பொருளை, அரசன் வழக்குகளைக் கேட்டு நீதியை உணர்ந்து தீர்மானிக்கும் சூழலில் இயல்பாகத் தருகிறது; ‘நீதி’ என்பது מִשְׁפָּט என்பதன் ஒழுக்க மற்றும் நீதித்துறை பரப்பைத் தக்கவைக்கிறது.
theological_decisions:
- issue: மன்னன் கேட்ட வரத்தின் இயல்பு
  choice: நீதியைப் பகுத்தறியும் திறன்
  alternative: ஞானம்
  rationale: இந்த வசனம் பொதுவாக ‘ஞானம்’ என்று சுருக்கப்படக்கூடிய கருத்தைக் கொண்டிருந்தாலும், மூலத்தில் உள்ள ‘புரிந்துகொள்ளுதல்/கேட்டறிதல்’ மற்றும் ‘நீதி’ என்ற குறிப்பிட்ட சொற்களை மொழிபெயர்ப்பு வெளிப்படையாகப் பாதுகாக்கிறது.
- issue: வசனத்தின் முடிவிலுள்ள தொடரும் வாக்கிய அமைப்பு
  choice: ‘ஆகையால்—’ என்று முடித்தல்
  alternative: முழுமையான தனி வாக்கியமாக முடித்தல்
  rationale: எபிரேய வாக்கியம் அடுத்த வசனத்தில் கடவுளின் பதிலுக்குத் தொடர்கிறது. கோடு இந்த இலக்கணத் தொடர்ச்சியை மறைக்காமல் காட்டுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் தெளிவும் கொண்ட நடை. மூலத்தின் மறுமொழி அமைப்பு அளவோடு பாதுகாக்கப்பட்டுள்ளது; தமிழில் இயல்பாக இருக்க ‘உனக்காக’ ஒவ்வொரு கூறிலும் மீண்டும் இடப்படவில்லை. அடுத்த வசனத்துடன் தொடரும் அமைப்பு இறுதிக் கோட்டால் சுட்டப்பட்டுள்ளது.
