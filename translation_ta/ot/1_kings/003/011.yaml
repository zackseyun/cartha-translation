  source_fidelity: 'வரைவில் மையப் பொருள் பெரும்பாலும் சரியாக உள்ளது: நீண்ட ஆயுள், செல்வம், பகைவர்களின் உயிர் ஆகியவற்றைக் கேட்காமல், מִשְׁפָּט தொடர்பான புரிந்துணர்வைக் கேட்டதைச் சொல்கிறது. ஆனால் ‘ஆகையால்—’ என்பது இவ்வசனத்தின் எபிரேய உரையில் இல்லாத இணைப்புச்சொல்லைச் சேர்க்கிறது. எபிரேய வாக்கியம் ‘நீ ... கேட்டதால்’ எனத் தொடங்கி அடுத்த வசனத்தில் தொடர்கிறது; அதனைத் தமிழிலும் காரணத் தொடராகவே காட்ட வேண்டும். மேலும் הָבִין לִשְׁמֹעַ מִשְׁפָּט என்பதில் ‘கேட்க/செவிமடுக்க’ என்ற நீதித்துறைச் சூழல் வரைவின் ‘நீதியைப் பகுத்தறியும் திறன்’ என்பதில் சற்றே மங்குகிறது.'
