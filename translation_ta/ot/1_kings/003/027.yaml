  terminology: “அரசன்,” “உயிரோடிருக்கும் குழந்தை,” and “தாய்” are appropriate. “அந்தக் குழந்தையின் தாய்” avoids the slightly impersonal Tamil neuter possessive “அதன்,” while retaining the Hebrew clause’s identifying force without importing an unnecessary gendered interpretation.
