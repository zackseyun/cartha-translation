translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. அரசவைக் கட்டளையின் மரியாதைப் பன்மை ஏவல் வடிவம் பேணப்பட்டுள்ளது; எபிரெய வலியுறுத்தல் அடிக்குறிப்புடன் தரப்பட்டுள்ளது.
