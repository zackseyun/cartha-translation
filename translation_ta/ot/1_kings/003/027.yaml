  yaml_path: translation/ot/1_kings/003/027.yaml
  text: Then the king answered and said[a], “Give her the living child, and by no means put him to death; she is his mother.”
translation:
  language: ta
  text: 'பதிலளித்த அரசன் கூறினான்: “உயிரோடிருக்கும் குழந்தையை அவளிடம் கொடுங்கள். அவனைக் எக்காரணம் கொண்டும் கொல்லாதீர்கள்[a]. அவளே அந்தக் குழந்தையின் தாய்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “சாகும்படி அவனைச் சாகடிக்காதீர்கள்” என்ற வலியுறுத்தும் இலக்கண அமைப்பு உள்ளது; இதன் பொருள், “அவனை நிச்சயமாகக் கொல்லாதீர்கள்” அல்லது “அவனை எக்காரணம் கொண்டும் கொல்லாதீர்கள்” என்பதாகும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן הַמֶּלֶךְ וַיֹּאמֶר
  choice: அப்போது அரசன் மறுமொழியாகச் சொன்னான்
  rationale: ‘பதிலளித்து சொன்னான்’ என்ற சொற்சொறான அமைப்பு தமிழில் செயற்கையாக ஒலிக்கும். ‘மறுமொழியாகச் சொன்னான்’ என்பது ענה + אמר என்ற உரையாடல் சூத்திரத்தின் பதிலுரைக்கும் தன்மையையும் சொல்லுதல் என்ற பொருளையும் இயல்பாகத் தக்கவைக்கிறது.
- source_word: תְּנוּ לָהּ
  choice: அவளிடம் கொடுங்கள்
  rationale: נתן என்ற வினையின் பன்மை ஏவல் வடிவத்தையும் பெண்பால் மறைமுகச் செயப்படுபொருளையும் இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: הַיָּלוּד הַחַי
  choice: உயிரோடிருக்கும் குழந்தை
  rationale: יַלּוּד என்பது இச்சூழலில் பிறந்த குழந்தையையும், חַי அது உயிருடன் இருப்பதையும் குறிக்கிறது. ‘உயிரோடிருக்கும் குழந்தை’ எதிரிலுள்ள இறந்த குழந்தையோடு உள்ள வேறுபாட்டைத் தெளிவாகக் காட்டுகிறது.
- source_word: וְהָמֵת לֹא תְמִיתֻהוּ
  choice: குழந்தையைச் சாகடிக்கவே வேண்டாம்
  rationale: מות என்ற வேரின் வினையெச்சப் பெயரும் காரணவினை வடிவமும் சேர்ந்துள்ள வலியுறுத்தப்பட்ட தடையை ‘வே வேண்டாம்’ இயல்பாக வெளிப்படுத்துகிறது. ‘சாகடிக்க’ என்பது காரணவினைப் பொருளையும் தக்கவைக்கிறது.
- source_word: הִיא אִמּוֹ
  choice: அவளே அதன் தாய்
  rationale: எபிரெயச் சுட்டுப்பெயரின் வலியுறுத்தலை ‘அவளே’ தக்கவைக்கிறது. தமிழில் ‘குழந்தை’ அஃறிணையாக இயல்பாகக் குறிப்பிடப்படுவதால் ஆண்பால் இலக்கணப் பின்னொட்டைக் கட்டாயமாக உயிர்ப்பால் குறிப்பாக மாற்றாமல் ‘அதன்’ என வழங்கப்பட்டுள்ளது.
