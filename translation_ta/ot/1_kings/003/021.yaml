source:
  edition: WLC
  text: וָ/אָקֻ֥ם בַּ/בֹּ֛קֶר לְ/הֵינִ֥יק אֶת בְּנִ֖/י וְ/הִנֵּה מֵ֑ת וָ/אֶתְבּוֹנֵ֤ן אֵלָי/ו֙ בַּ/בֹּ֔קֶר וְ/הִנֵּ֛ה לֹֽא הָיָ֥ה בְנִ֖/י אֲשֶׁ֥ר יָלָֽדְתִּי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/021.yaml
  text: When I got up in the morning to nurse my son[a], behold, he was dead. But when I looked closely at him in the morning, behold, he was not my son[b], whom I had borne.
translation:
  language: ta
  text: 'காலையில் என் மகனுக்குப் பாலூட்ட நான் எழுந்தபோது, இதோ, அவன் இறந்திருந்தான். காலையில் அவனை உற்றுப் பார்த்தபோது[a], இதோ, அவன் நான் பெற்றெடுத்த என் மகன் அல்ல.


    [a] அல்லது, “அவனை கவனமாக ஆராய்ந்தபோது.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனை கவனமாக ஆராய்ந்தபோது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָקֻם בַּבֹּקֶר לְהֵינִיק
  choice: காலையில் ... பாலூட்ட நான் எழுந்தபோது
  rationale: קום என்பதன் தொடர்கதை வடிவத்தையும், ינק என்பதன் ஹிஃபில் வடிவமான ‘பாலூட்டுதல்’ என்ற பொருளையும் இயல்பான தமிழ் காலவாக்கியமாக அளிக்கிறது.
- source_word: אֶת־בְּנִי
  choice: என் மகனுக்கு
  rationale: בן ஆண்பாலைக் குறிப்பாகச் சுட்டுவதால் ‘குழந்தை’ என்று பொதுமைப்படுத்தாமல் ‘மகன்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְהִנֵּה מֵת
  choice: இதோ, அவன் இறந்திருந்தான்
  rationale: הִנֵּה தரும் திடீர் கண்டுணர்வை ‘இதோ’ பாதுகாக்கிறது; מֵת குழந்தை அப்போது இறந்த நிலையில் இருந்ததைத் தெரிவிக்கிறது.
- source_word: וָאֶתְבּוֹנֵן אֵלָיו
  choice: அவனை உற்றுப் பார்த்தேன்
  rationale: התבונן குறிக்கும் கவனமான, ஆராயும் பார்வையை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: וְהִנֵּה לֹא הָיָה בְנִי
  choice: இதோ, அவன் ... என் மகன் அல்ல
  rationale: மூலத்தின் இரண்டாவது הִנֵּה-யையும் அதன் நாடகத் தாக்கத்தையும் தக்கவைத்து, குழந்தையை ஆளாகக் குறிப்பிடுகிறது.
- source_word: אֲשֶׁר יָלָדְתִּי
  choice: நான் பெற்றெடுத்த
  rationale: ילד என்பதன் முதலாம் நபர் வடிவம் தாய் குழந்தையைப் பெற்றெடுத்த செயலை நேரடியாகக் குறிக்கிறது.
