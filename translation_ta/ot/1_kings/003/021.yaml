translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. மூல எபிரெயத்தில் இருமுறை வரும் ‘காலையில்’ மற்றும் ‘இதோ’ ஆகியவை கதைநடையின் மீளுருவத்தையும் திடீர் உணர்வையும் காக்கத் தக்கவைக்கப்பட்டுள்ளன.
