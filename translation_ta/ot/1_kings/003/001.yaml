- source_word: וַיִּקַּח אֶת בַּת פַּרְעֹה
  choice: பார்வோனின் மகளை மணந்துகொண்டு
  rationale: ஒரு பெண்ணை 'எடுத்தல்' என்ற எபிரெய மரபுத்தொடர் இங்கு திருமணம் செய்துகொள்வதைக் குறிக்கிறது; சொற்சொல் மொழிபெயர்ப்பைவிட பொருளை இயல்பாகத் தெரிவிக்கிறது.
- source_word: וַיְבִיאֶהָ אֶל עִיר דָּוִד
  choice: அவளைத் தாவீதின் நகரத்துக்கு அழைத்து வந்தான்
  rationale: வருமிடத்தை நோக்கி ஒருவரைக் கொண்டுவரும் செயலைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: עַד כַּלֹּתוֹ לִבְנוֹת
  choice: கட்டி முடிக்கும்வரை
  rationale: עַד குறிக்கும் கால எல்லையையும், கட்டுமானம் நிறைவடைந்ததையும் சுருக்கமான தமிழில் துல்லியமாக வழங்குகிறது.
- source_word: בֵּיתוֹ
  choice: தன் அரண்மனை
  rationale: அடிப்படைப் பொருள் 'அவன் வீடு' என்றாலும், அரசனான சாலொமோனின் கட்டிடத்தை இச்சூழலில் 'அரண்மனை' என்பது தெளிவாகக் குறிக்கிறது.
- source_word: בֵּית יְהוָה
  choice: யாவேவின் ஆலயம்
  rationale: சொற்சொல்லாக 'யாவேவின் வீடு'; இங்கு வழிபாட்டுக் கட்டிடத்தைக் குறிக்கும் காரணத்தால் 'ஆலயம்' நவீன வாசகருக்குத் தெளிவானது. சொற்சொல் மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மெய்யெழுத்துப் பெயரான YHWH-ஐ ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: חוֹמַת יְרוּשָׁלִַם סָבִיב
  choice: எருசலேமைச் சுற்றிய மதில்
  rationale: ஒற்றை மதிலும் அது நகரைச் சுற்றியிருந்ததுமாகிய இரு கூறுகளையும் இயல்பான தமிழில் தக்கவைக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட இறைப் பெயர் நேரடியாக இடம்பெறுவதால், பட்டப்பெயரான 'கர்த்தர்' என்பதற்கு மாற்றாமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
- issue: בֵּית יְהוָה என்பதன் பொருள்
  choice: யாவேவின் ஆலயம்
  alternative: யாவேவின் வீடு
  rationale: சொற்சொல் வடிவம் 'வீடு' என்றாலும், இங்கு சாலொமோன் கட்டிய வழிபாட்டுக் கட்டிடமே குறிக்கப்படுவதால் 'ஆலயம்' தெளிவாக உள்ளது; சொற்சொல் வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. நீண்ட எபிரெய வாக்கியம் தமிழில் தெளிவுக்காக மூன்று வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது. கடைசி காலவாக்கியத்தில் உள்ள மறைபொருளை இயல்பாகத் தெரிவிக்க “அவள் அங்கே இருந்தாள்” சேர்க்கப்பட்டுள்ளது; இது அவளைத் தாவீதின் நகரத்துக்குக் கொண்டுவந்த நிலை கட்டுமானம் முடியும் வரை நீடித்ததைக் குறிக்கிறது.
