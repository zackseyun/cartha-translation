base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/001.yaml
  text: Solomon formed a marriage alliance with Pharaoh king of Egypt[a], and he took Pharaoh’s daughter and brought her into the city of David until he had finished building his own house, and the house of Yahweh[b], and the wall around Jerusalem.
translation:
  language: ta
  text: சாலொமோன் எகிப்தின் அரசனான பார்வோனுடன் திருமண உறவை ஏற்படுத்திக்கொண்டான்[a]. பார்வோனின் மகளைத் தன் மனைவியாக ஏற்றுக்கொண்டு, தன் வீட்டையும் யாவேவின் வீட்டையும்[b] எருசலேமைச் சுற்றிய மதிலையும் கட்டி முடிக்கும்வரை அவளைத் தாவீதின் நகரத்துக்கு அழைத்து வந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பார்வோனுக்குத் திருமணத்தின் மூலம் உறவினனானான்.” எபிரெய வினை திருமண உறவுக்குள் வருவதைக் குறிக்கிறது; இங்கு அரசியல் கூட்டணியின் நிழலும் இருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “யாவேவின் ஆலயம்.” சொற்சொல்லாக, “யாவேவின் வீடு.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְחַתֵּן
  choice: திருமண உறவை ஏற்படுத்திக்கொண்டான்
  rationale: இந்த வினை திருமணத்தின் மூலம் உறவினனாதலைக் குறிக்கிறது; அரச குடும்பச் சூழலில் உள்ள அரசியல் கூட்டணி நிழலையும் இத்தேர்வு இயல்பாகத் தக்கவைக்கிறது.
- source_word: אֶת פַּרְעֹה מֶלֶךְ מִצְרָיִם
  choice: எகிப்தின் அரசனான பார்வோனுடன்
