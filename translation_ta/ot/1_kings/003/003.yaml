  rationale: இது இறைப்பட்டத்தை மாற்றீடாக இடாமல், எபிரெய தனிப்பெயரான יהוה-ஐ தமிழில் ஒலிபெயர்க்கிறது.
- source_word: לָלֶכֶת
  choice: நடந்துவந்தான்
