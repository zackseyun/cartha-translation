  register: நவீன பொதுத்தமிழில், கண்ணியமான வேதாகம நடையைப் பேணும் மொழியாக்கம். ‘நடந்துவந்தான்’, ‘பலியிட்டும் ... வந்தான்’ என்பவை எபிரெய உரையிலுள்ள தொடர்ச்சியான வாழ்க்கை முறை மற்றும் வழக்கமான செயல்களின் நுண்பொருளை இயல்பாகத் தருகின்றன.
