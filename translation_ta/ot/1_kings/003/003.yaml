  rationale: חֻקּוֹת என்பதிலுள்ள விதிக்கப்பட்ட ஒழுங்குகள் அல்லது சட்டத்திட்டங்கள் என்ற உடன்படிக்கைச் சார்ந்த நுண்பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: דָּוִד אָבִיו
  choice: தன் தந்தை தாவீதின்
  rationale: எபிரெய உரையின் உறவையும் பெயரையும் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: רַק
  choice: ஆனால்
  rationale: முந்தைய நேர்மறை மதிப்பீட்டை நிராகரிக்காமல் அதற்கு ஒரு வரம்பைச் சேர்க்கும் எதிர்மறைத் திருப்பத்தை இயல்பான தமிழில் காட்டுகிறது.
- source_word: בַּבָּמוֹת
  choice: மேடான வழிபாட்டுத் தலங்களில்
  rationale: בָּמוֹת என்பது உள்ளூர் உயர்நிலை வழிபாட்டு இடங்களைக் குறிக்கும்; வாசகர்கள் பொருளை உடனே புரிந்துகொள்ளும் வகையில் அதன் வழிபாட்டுச் சார்பை வெளிப்படுத்துகிறது.
- source_word: מְזַבֵּחַ
  choice: பலியிட்டும் வந்தான்
  rationale: நிகழ்காலப் பங்கேற்பெயரின் வழக்கமான அல்லது தொடர்ச்சியான செயல் நுண்பொருளை ‘வந்தான்’ என்பதன் மூலம் காக்கிறது.
- source_word: וּמַקְטִיר
  choice: தூபம் எரித்தும் வந்தான்
  rationale: வழிபாட்டுச் சூழலில் קטר என்பதன் பொதுவான பொருளைத் தெளிவாகக் காட்டுவதுடன், தொடர்ச்சியான செயல் தன்மையையும் காக்கிறது.
theological_decisions:
- issue: சாலொமோனின் வழிபாட்டு நடைமுறையைப் பற்றிய கதைசொல்லியின் மதிப்பீடு
  choice: சாலொமோன் யாவேவை நேசித்தான் என்ற உண்மையான பாராட்டை முதலில் கூறி, மேடான வழிபாட்டுத் தலங்களில் அவன் வழிபட்டதை ‘ஆனால்’ என்று வரம்புபடுத்துதல்
  alternative: தொடக்கப் பாராட்டை நையாண்டியாகவோ மிகவும் மங்கிய பாராட்டாகவோ எடுத்துக்கொள்வது; அல்லது மேடான வழிபாட்டுத் தலங்களில் நடந்த வழிபாட்டை முழுமையாக அங்கீகரிப்பது
  rationale: எபிரெய வாக்கிய அமைப்பு முதலில் பாராட்டைத் தருகிறது; பின்னர் רַק மூலம் அதற்கு ஒரு வரம்பைச் சேர்க்கிறது. மொழிபெயர்ப்பு இந்த இறையியல் பதற்றத்தை எந்த ஒரு திசையிலும் தீர்த்துவிடாமல் காக்கிறது.
