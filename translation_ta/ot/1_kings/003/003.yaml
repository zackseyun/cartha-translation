base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/003.yaml
  text: Solomon loved Yahweh[a], walking in the statutes of David his father; only[b], he was sacrificing and burning incense at the high places.
translation:
  language: ta
  text: சாலொமோன் யாவேவை நேசித்து, தன் தந்தை தாவீதின் நியமங்களின்படி நடந்துவந்தான். ஆனால்[a], அவன் மேடான வழிபாட்டுத் தலங்களில்[b] பலியிட்டும் தூபம் எரித்தும் வந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதைத் தவிர, அவன் மேடான வழிபாட்டுத் தலங்களில் பலியிட்டும் தூபம் எரித்தும் வந்தான்.”
    reason: רַק என்பது முந்தைய பாராட்டுக்கு வரம்பு விதிப்பதை ‘ஆனால்’ என்றும் ‘அதைத் தவிர’ என்றும் வெளிப்படுத்த முடியும்.
  - marker: b
    text: “மேடான வழிபாட்டுத் தலங்கள்” என்பது பொதுவாக உயர்ந்த அல்லது மேடான இடங்களில் அமைந்த, பல ஊர்களில் இருந்த உள்ளூர் வழிபாட்டு இடங்களைக் குறிக்கிறது.
    reason: בָּמוֹת என்பதன் இடவியல் மற்றும் பண்பாட்டுச் சார்பை விளக்கும் குறிப்பு.
lexical_decisions:
- source_word: וַיֶּאֱהַב
  choice: நேசித்து
  rationale: אהב என்பதன் நேரடியான அன்பு சார்ந்த பொருளையும், சாலொமோனைப் பற்றிய கதைசொல்லியின் நேர்மறையான மதிப்பீட்டையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
