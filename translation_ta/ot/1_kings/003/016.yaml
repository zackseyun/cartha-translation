  yaml_path: translation/ot/1_kings/003/016.yaml
  text: Then two women who were prostitutes came to the king and stood before him[a].
translation:
  language: ta
  text: அப்போது விபச்சாரிகளான இரண்டு பெண்கள் அரசனிடம் வந்து, அரசனுக்கு முன்பாக நின்றார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அப்போது இரண்டு விபச்சாரிகள் அரசனிடம் வந்து, அரசனுக்கு முன்பாக நின்றார்கள்.” எபிரெயச் சொல்லான זֹנוֹת என்பதை நேரடியாக “விபச்சாரிகள்” என்றும், விரிவாக “விபச்சாரிகளான பெண்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: அப்போது
  rationale: அடுத்த நிகழ்வை அறிமுகப்படுத்தும் காலக் குறியீடு; கதைத் தொடரை இயல்பாகப் பேணுகிறது.
- source_word: תָּבֹאנָה
  choice: வந்து
  rationale: בוא என்பதன் Qal வடிவம் அரசனை நோக்கிய வருகையைக் குறிக்கிறது; தமிழில் தொடர்வினை அமைப்பு இயல்பானது.
- source_word: שְׁתַּיִם נָשִׁים
  choice: இரண்டு பெண்கள்
  rationale: எண்ணும் பெயர்ச்சொல்லும் கொண்ட நேரடியான அமைப்பைத் தெளிவாக வழங்குகிறது.
- source_word: זֹנוֹת
  choice: விபச்சாரிகளான
  rationale: பெண்களை விவரிக்கும் எபிரெயப் பங்கேற்பு வடிவத்தின் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது; பழமையான அல்லது இழிவூட்டும் சொல்லாட்சியைத் தவிர்க்கிறது.
- source_word: אֶל הַמֶּלֶךְ
  choice: அரசனிடம்
  rationale: אֶל குறிக்கும் அரசனை நோக்கிய இயக்கத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וַתַּעֲמֹדְנָה
  choice: நின்றார்கள்
  rationale: עמד என்பதன் அடிப்படைப் பொருளையும் கதைத் தொடரையும் பேணுகிறது; ‘தங்களை முன்னிலைப்படுத்தினார்கள்’ என விளக்கமாக்கவில்லை.
- source_word: לְפָנָיו
  choice: அவனுக்கு முன்பாக
  rationale: அரசனின் முன்னிலையில் நிற்பதைக் குறிக்கும் எபிரெய மரபுத்தொடரை நேரடியாகவும் தெளிவாகவும் தருகிறது.
