translation_notes:
  register: நவீன பொதுத்தமிழில், கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. அரசரைக் குறிக்கும் சூழலில் இயல்பாகப் பயன்படும் ‘அரசன்’ தேர்ந்தெடுக்கப்பட்டுள்ளது; மூலத்தின் எளிய நீதிமன்றக் காட்சியும் சொற்பொருள் மாற்றுவாய்ப்பும் பேணப்பட்டுள்ளன.
