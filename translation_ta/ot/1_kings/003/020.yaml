base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/020.yaml
  text: She got up in the middle of the night and took my son from beside me while your servant was sleeping[a], and she laid him in her bosom, and laid her dead son in my bosom.
translation:
  language: ta
  text: அவள் நடுராத்திரியில் எழுந்து, உமது அடியாளாகிய நான் தூங்கிக்கொண்டிருந்தபோது என் அருகிலிருந்து என் மகனை எடுத்து, தன் மடியில்[a] கிடத்தினாள்; இறந்துபோன தன் மகனையோ என் மடியில் கிடத்தினாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மார்பில்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் חֵיק மடியையோ மார்போடு நெருக்கமாக அணைத்திருக்கும் பகுதியையோ குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּתוֹךְ הַלַּיְלָה
  choice: நடுராத்திரியில்
  rationale: இச்சொற்றொடர் இரவின் பொதுவான நேரத்தை மட்டுமல்ல, இரவின் நடுப்பகுதியைக் குறிக்கிறது; ‘நடுராத்திரியில்’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: מֵאֶצְלִי
  choice: என் அருகிலிருந்த
  rationale: אֵצֶל ஒருவரின் பக்கத்தில் அல்லது அருகில் இருப்பதைக் குறிக்கிறது; உறங்கும் இடத்தின் நெருக்கத்தை இத்தொடர் தெளிவாகத் தருகிறது.
- source_word: וַאֲמָתְךָ יְשֵׁנָה
  choice: உமது அடியாளாகிய நான் தூங்கிக்கொண்டிருந்தபோது
  rationale: அரசனிடம் பேசும் பெண்ணின் தாழ்மையான தன்னைக் குறிக்கும் வழக்கை ‘உமது அடியாள்’ காக்கிறது; ‘நான்’ என்பதைச் சேர்ப்பது நவீனத் தமிழில் பொருளை இயல்பாகத் தெளிவாக்குகிறது. தொடர்ந்த பின்னணி நிலையை ‘தூங்கிக்கொண்டிருந்தபோது’ வெளிப்படுத்துகிறது.
- source_word: וַתַּשְׁכִּיבֵהוּ / הִשְׁכִּיבָה
  choice: கிடத்தினாள்
  rationale: שׁכב என்பதன் ஹிஃபில் வடிவம் ஒருவரைப் படுக்கவைத்தல் அல்லது கிடத்துதல் எனப் பொருள்படும்; குழந்தைகள் இடமாற்றப்பட்ட சூழலுக்கு ‘கிடத்தினாள்’ பொருத்தமானது.
- source_word: בְּחֵיקָהּ / בְחֵיקִי
  choice: தன் மடியில் / என் மடியில்
  rationale: חֵיק என்பது மடி, மார்பருகு அல்லது உடலோடு நெருக்கமாக அணைக்கும் பகுதியைக் குறிக்கலாம். ‘மடி’ இயல்பான தமிழில் தாய்மையின் நெருக்கத்தையும் இரு இணைத் தொடர்களையும் காக்கிறது; பொருள் வரம்பு அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: בְּנָהּ הַמֵּת
  choice: இறந்துபோன தன் மகன்
  rationale: הַמֵּת இங்கு ‘மகன்’ என்பதைக் குறிப்பாக்கும் பெயரடைப் பயன்பாட்டில் உள்ளது; ‘இறந்துபோன தன் மகன்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
