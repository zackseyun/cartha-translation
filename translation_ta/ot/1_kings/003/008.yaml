source:
  edition: WLC
  text: וְ/עַ֨בְדְּ/ךָ֔ בְּ/ת֥וֹךְ עַמְּ/ךָ֖ אֲשֶׁ֣ר בָּחָ֑רְתָּ עַם רָ֕ב אֲשֶׁ֧ר לֹֽא יִמָּנֶ֛ה וְ/לֹ֥א יִסָּפֵ֖ר מֵ/רֹֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/008.yaml
  text: And your servant is in the midst of your people whom you have chosen[a], a great people[b], too numerous to be counted or numbered.
translation:
  language: ta
  text: உமது அடியேன், நீர் தேர்ந்தெடுத்த உமது மக்களாகிய பெருந்திரளான மக்களிடையே இருக்கிறேன்; அவர்கள் மிகுதியால் எண்ணவோ கணக்கிடவோ முடியாதவர்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַבְדְּךָ
  choice: உமது அடியேனும்
  rationale: சாலொமோன் கடவுளிடம் தாழ்மையுடன் பேசும் சூழலில் עֶבֶד என்பதற்கு ‘அடியேன்’ என்பது கீழ்ப்படிதலையும் மரியாதையான தன்னடக்கத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது; இங்கு சொத்தாகிய அடிமை என்ற பொருளைத் திணிக்கவில்லை.
- source_word: בְּתוֹךְ עַמְּךָ
  choice: உமது மக்களின் நடுவில்
  rationale: בְּתוֹךְ என்பது ஒருவருக்குள் அல்ல, மக்களிடையே அமைந்திருப்பதைக் குறிக்கிறது. ‘நடுவில்’ மூலத்தின் இடவியல் உருவகத்தைக் காக்கிறது.
- source_word: אֲשֶׁר בָּחָרְתָּ
  choice: நீர் தேர்ந்தெடுத்த
  rationale: கடவுள் தமது மக்களைத் தேர்ந்தெடுத்தார் என்ற எபிரேய வாக்கியத்தை நேரடியாகவும், பின்னைய கோட்பாட்டு விளக்கங்களைச் சேர்க்காமலும் தருகிறது.
- source_word: עַם רָב
  choice: பெருந்திரளான மக்கள்
  rationale: רַב என்பதற்கு ‘பெரிய’ என்றும் ‘எண்ணிக்கையில் மிகுந்த’ என்றும் பொருள் இருக்கலாம். அடுத்துவரும் எண்ண முடியாமை இங்கு எண்ணிக்கையே முதன்மை என்பதைத் தெளிவாக்குவதால் ‘பெருந்திரளான’ என மொழிபெயர்க்கப்பட்டது; மாற்றுப் பொருள் அடிக்குறிப்பில் வைக்கப்பட்டது.
- source_word: לֹא יִמָּנֶה וְלֹא יִסָּפֵר
  choice: எண்ணவும் கணக்கிடவும் முடியாது
  rationale: מנה, ספר ஆகிய இணையான இரண்டு வினைகளின் வலியுறுத்தலை இரண்டு தமிழ் வினைகளால் காக்கிறது. சூழலில் இது மக்கள் மிகுதியால் எண்ண இயலாத நிலையைக் குறிக்கிறது.
- source_word: מֵרֹב
  choice: மிகுதியால்
  rationale: מִן + רֹב என்பது எண்ணவும் கணக்கிடவும் முடியாததற்கான காரணத்தை, அதாவது பெரும் எண்ணிக்கை காரணமாக என்பதை வெளிப்படையாகக் குறிக்கிறது.
theological_decisions:
- issue: இஸ்ரவேல் கடவுளால் தேர்ந்தெடுக்கப்பட்ட அவருடைய மக்கள் என அடையாளப்படுத்தப்படுதல்
  choice: நீர் தேர்ந்தெடுத்த உமது மக்கள்
  alternative: உமது மக்கள்
  rationale: மூல எபிரேயம் உடைமை உறவையும் கடவுளின் தேர்ந்தெடுத்தலையும் வெளிப்படையாகக் கூறுகிறது. ஆகவே இரண்டும் காக்கப்பட்டன; அவற்றை விரிவுபடுத்தி குறிப்பிட்ட பிற்கால இறையியல் அமைப்புடன் இணைக்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் மரியாதையும் ஜெபத்திற்குரிய கண்ணியமும் காக்கப்பட்டுள்ளன. கடவுளை நோக்கிய ஒருமை மரியாதை வடிவமான ‘நீர்/உமது’ பயன்படுத்தப்பட்டது. மூலத்தில் உள்ள எண்ணுதல்–கணக்கிடுதல் என்ற இணைநிலையும், மக்கள் மிகுதியே அதற்குக் காரணம் என்பதும் வெளிப்படையாகத் தக்கவைக்கப்பட்டன.
