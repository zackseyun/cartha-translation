  source_fidelity: 'மூலத்தின் முக்கியக் கூறுகள் அனைத்தும் உள்ளன: பேச்சாளர் தம்மை இறைவனின் பணிவான ஊழியனாகக் குறிப்பிடுதல், தேர்ந்தெடுக்கப்பட்ட மக்களிடையே இருத்தல், அவர்களுடைய பெரும் எண்ணிக்கை, மிகுதியால் எண்ணவோ கணக்கிடவோ இயலாமை. ஆயினும், “அவர்கள் பெருந்திரளான மக்கள்” என்பது எபிரேயத்தின் ஒரே தொடர்ச்சியான இணைப்பெயர் அமைப்பை இரண்டு வாக்கியங்களாகப் பிரித்து, தமிழில் சற்றே இயல்பற்ற முன்னிலைப்பெயர்-பெயர்ச்சொல் மீளுருவாக்கத்தை உருவாக்குகிறது.'
