base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/014.yaml
  text: And if you walk in my ways[a], keeping my statutes and my commandments, as David your father walked, then I will lengthen your days.
translation:
  language: ta
  text: நீ என் வழிகளில் நடந்து, உன் தந்தையான தாவீது நடந்ததுபோல், என் சட்டங்களையும் கட்டளைகளையும் கடைப்பிடித்தால், உன் வாழ்நாளை நீட்டிப்பேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேரடியாக, “உன் நாட்களை நீட்டிப்பேன்.”
    reason: எபிரெய மொழியின் நேரடி சொற்றொடரைப் பதிவு செய்யும் சொற்பொருள் மாற்று.
lexical_decisions:
- source_word: וְאִם
  choice: நீ ... கடைப்பிடித்தால்
  rationale: எபிரெய நிபந்தனைத் தொடரைத் தமிழில் இயல்பான ‘-ஆல்’ வடிவில் தருகிறது; முந்தைய வசனத்துடனான தொடர்ச்சி சூழலால் விளங்குகிறது.
- source_word: תֵּלֵךְ בִּדְרָכַי
  choice: நீ என் வழிகளில் நடந்து
  rationale: உடன்படிக்கைச் சூழலிலுள்ள வாழ்வியல் உருவகமான ‘வழிகளில் நட’ என்பதையும் மூலத்தின் சொற்சித்திரத்தையும் காக்கிறது.
- source_word: לִשְׁמֹר
  choice: கடைப்பிடித்தால்
  rationale: இறைவனுடைய சட்டங்களையும் கட்டளைகளையும் அனுசரித்து வாழ்வதை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: חֻקַּי
  choice: என் சட்டங்கள்
  rationale: சட்ட/உடன்படிக்கை சார்ந்த חֹק என்ற சொல்லை அடுத்துள்ள ‘கட்டளைகள்’ என்பதிலிருந்து வேறுபடுத்துகிறது.
- source_word: וּמִצְוֺתַי
  choice: என் கட்டளைகள்
  rationale: מִצְוָה என்பதன் நேரான உடன்படிக்கைச் சார்ந்த பொருளைத் தருகிறது.
- source_word: כַּאֲשֶׁר הָלַךְ דָּוִיד אָבִיךָ
  choice: உன் தந்தையான தாவீது நடந்ததுபோல்
  rationale: தாவீதுடனான ஒப்பீட்டையும், முன் வந்த ‘நடந்து’ என்ற எபிரெய வினையின் மறுபயன்பாட்டையும் காக்கிறது.
- source_word: וְהַאַרַכְתִּי אֶת יָמֶיךָ
  choice: உன் வாழ்நாளை நீட்டிப்பேன்
  rationale: சொல்லுக்குச் சொல் ‘உன் நாட்களை நீட்டிப்பேன்’ என்பதன் இயல்பான தமிழ் பொருளைத் தெளிவாகக் கொடுக்கிறது; மாற்று நேரடி வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: உடன்படிக்கைக்குக் கீழ்ப்படிவதோடு இணைக்கப்பட்ட நீண்ட ஆயுளுக்கான நிபந்தனை வாக்குறுதி
  choice: தாவீதுபோல் இறைவனுடைய வழிகளில் நடந்து சட்டங்களையும் கட்டளைகளையும் கடைப்பிடித்தால் வாழ்நாள் நீட்டிக்கப்படும் என்ற நிபந்தனையை நேரடியாகத் தருதல்
  alternative: இதை நிபந்தனையற்ற வம்ச வாக்குறுதியாகவோ பொதுவான ஆசீர்வாதமாகவோ விளக்குதல்
  rationale: மூல உரை சாலொமோனுக்கான தெளிவான நிபந்தனையையும், அதற்குரிய நீண்ட ஆயுள் வாக்குறுதியையும் முன்வைக்கிறது; பிற்கால இறையியல் வகைப்பாடுகளை மொழிபெயர்ப்பில் சேர்க்கக்கூடாது.
translation_notes:
  register: நவீன பொதுத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘என் வழிகளில் நட’ என்ற வேதாகம வாழ்வியல் உருவகம் காக்கப்பட்டுள்ளது; ‘சட்டங்கள்’ மற்றும் ‘கட்டளைகள்’ ஆகிய சட்டச் சொற்களின் வேறுபாடும் பேணப்பட்டுள்ளது.
