revisions:
- from: அப்போது, உயிரோடிருந்த மகனின் தாய் அரசனிடம் சொன்னாள். தன் மகனுக்காக அவளுடைய தாயுள்ளம் உருகியதால்[a], அவள், “என் அரசே, உயிருள்ள குழந்தையை அவளிடமே கொடுத்துவிடுங்கள்; அவனை ஒருபோதும் கொன்றுவிடாதீர்கள்[b]!” என்று மன்றாடினாள். ஆனால் மற்றவளோ, “அவன் எனக்கும் உரியவனாக இருக்க வேண்டாம், உனக்கும் உரியவனாக இருக்க வேண்டாம்; அவனை இரண்டாக வெட்டுங்கள்!” என்றாள்.
