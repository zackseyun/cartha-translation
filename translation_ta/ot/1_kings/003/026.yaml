base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/026.yaml
  text: Then the woman whose son was alive said to the king[a], because her compassion was stirred for her son, and she said, "Please, my lord, give her the living child, and do not put him to death." But the other said, "It shall be neither mine nor yours[b]; cut him in two."
translation:
  language: ta
  text: அப்போது, உயிரோடிருந்த மகனின் தாய், தன் மகனுக்காக அவளுடைய இரக்கம் பொங்கியதால், அரசனிடம், “தயவுசெய்து, என் அரசே, உயிருள்ள குழந்தையை அவளிடமே கொடுத்துவிடுங்கள்; அவனை எக்காரணத்தாலும் கொல்லாதீர்கள்!” என்று சொன்னாள். ஆனால் மற்றவளோ, “அவன் எனக்கோ உனக்கோ உரியவனாக இருக்கக் கூடாது; அவனை இரண்டாக வெட்டுங்கள்!” என்றாள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נִכְמְרוּ רַחֲמֶיהָ
  choice: அவளுடைய தாயுள்ளம் உருகியதால்
  rationale: כמר உடன் רחמים சேர்ந்துள்ள எபிரெய மரபுத்தொடர், உள்ளார்ந்த இரக்கமும் தாய்ப்பாசமும் தீவிரமாகக் கிளர்ந்ததை உணர்த்துகிறது. சொற்படியான உடல்-உறுப்பு மொழியைத் தவிர்த்து, நவீனத் தமிழில் இயல்பாக அதன் உணர்ச்சி வலிமையைப் பாதுகாக்கிறது.
- source_word: בִּי אֲדֹנִי
  choice: என் அரசே
  rationale: בִּי இங்கு வேண்டுதலை அறிமுகப்படுத்தும் இடைச்சொல்; אֲדֹנִי அரசனை நோக்கிய மரியாதைமிக்க விளிப்பு. தொடர்ந்து வரும் வேண்டுகோளின் அவசரத்துடன் இயல்பாகப் பொருந்தும் தமிழாக்கம்.
- source_word: הַיָּלוּד הַחַי
  choice: உயிருள்ள குழந்தை
  rationale: יַלוּד பிறந்த குழந்தையைக் குறிக்கிறது; வயதை தேவையின்றி மிகத் துல்லியப்படுத்தாமல், உயிரோடிருப்பதன் எதிர்மறை ஒப்பீட்டைத் தெளிவாக வைத்திருக்கிறது.
- source_word: וְהָמֵת אַל תְּמִיתֻהוּ
  choice: அவனை ஒருபோதும் கொன்றுவிடாதீர்கள்
  rationale: வினையெச்சப்பெயருடன் வினைச்சொல் வரும் எபிரெய அமைப்பு தடையை வலியுறுத்துகிறது. ‘ஒருபோதும்’ என்பது அந்த வலியுறுத்தலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְזֹאת אֹמֶרֶת
  choice: ஆனால் மற்றவளோ ... என்றாள்
  rationale: ‘இந்தவள்’ என்ற சொற்படியான வடிவத்தைவிட, இரண்டாவது பெண்ணை முரண்பாட்டுடன் சுட்டும் இயல்பான தமிழ் வடிவம்.
- source_word: גַּם לִי גַם לָךְ לֹא יִהְיֶה
  choice: அவன் எனக்கும் உரியவனாக இருக்க வேண்டாம், உனக்கும் உரியவனாக இருக்க வேண்டாம்
  rationale: குழந்தையே மறைமுக எழுவாய் என்பதைத் தெளிவாக்கி, இரு பெண்களுக்கும் அவன் உரியவனாகக் கூடாது என்ற கொடூரமான உரிமைப் போட்டியைப் பாதுகாக்கிறது.
- source_word: גְּזֹרוּ
  choice: அவனை இரண்டாக வெட்டுங்கள்
  rationale: கட்டளை திடீரும் கொடூரமுமானது. முந்தைய வசனத்தில் கூறப்பட்ட தீர்ப்பின் அடிப்படையில் மறைந்துள்ள செயப்படுபொருளையும் ‘இரண்டாக’ என்பதையும் வெளிப்படுத்துவது தமிழில் கருத்தைத் தெளிவாக்குகிறது.
