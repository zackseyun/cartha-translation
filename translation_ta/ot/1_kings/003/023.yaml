base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/023.yaml
  text: Then the king said[a], “This one says, ‘This is my son, the living one, and your son is the dead one,’ and this one says, ‘No, for your son is the dead one, and my son is the living one.’”
translation:
  language: ta
  text: அப்போது அரசன் கூறினான்:[a] “இவள், ‘இவன்தான் என் மகன், உயிரோடிருப்பவன்; உன் மகனோ இறந்தவன்’ என்கிறாள். இவளோ, ‘இல்லை! உன் மகன்தான் இறந்தவன்; என் மகனே உயிரோடிருப்பவன்’ என்கிறாள்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் இரு பெண்களையும் சுட்டும் பெண்பால் சுட்டுச்சொல் இருமுறை வருகிறது; சொல்லுக்குச் சொல், ‘இவள் சொல்கிறாள் ... இவள் சொல்கிறாள்’ என்று அமைந்துள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... கூறினான்
  rationale: வாவ் தொடர்வினை கதை நிகழ்வை அடுத்த கட்டத்துக்கு நகர்த்துகிறது; ‘அப்போது’ இயல்பான தமிழ் கதைநடையைத் தருகிறது.
- source_word: הַמֶּלֶךְ
  choice: அரசன்
  rationale: எபிரெய உரையில் பெயருக்குப் பதிலாகப் பட்டமே பயன்படுத்தப்பட்டுள்ளது; தமிழிலும் அதையே தக்கவைக்கிறது.
- source_word: זֹאת ... וְזֹאת
  choice: இவள் ... இவளோ
  rationale: பெண்பால் சுட்டுப்பெயர்கள் முன்பு குறிப்பிடப்பட்ட இரு பெண்களையும் குறிக்கின்றன. ‘இவளோ’ இரண்டாவது கூற்றின் முரண்பாட்டை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֹמֶרֶת
  choice: என்கிறாள்
  rationale: நிகழ்காலப் பங்கேற்புவினை அரசன் இருவருடைய கூற்றுகளையும் உயிரோட்டமாகச் சுருக்கிக் கூறுவதை வெளிப்படுத்துகிறது.
- source_word: זֶה בְּנִי הַחַי
  choice: இவன்தான் என் மகன், உயிரோடிருப்பவன்
  rationale: ஆண் குழந்தையைச் சுட்டும் זֶה என்பதையும், பின்னிணைப்பாக வரும் ‘உயிரோடிருப்பவன்’ என்பதையும் தக்கவைத்து, அடையாளப்படுத்தும் வலியுறுத்தலை ‘தான்’ வெளிப்படுத்துகிறது.
- source_word: בְּנִי / בְּנֵךְ
  choice: என் மகன் / உன் மகன்
  rationale: בֵּן என்பதன் வழக்கமான பொருள் ‘மகன்’; சூழலும் ஆண் குழந்தையைக் குறிக்கிறது.
- source_word: הַחַי / הַמֵּת
  choice: உயிரோடிருப்பவன் / இறந்தவன்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் இவ்வடிவங்களின் நேரடியான எதிர்மறை இணைப்பைத் தமிழிலும் காக்கிறது.
- source_word: לֹא כִי
  choice: இல்லை!
  rationale: இச்சொற்றொடர் முதல் பெண்ணின் கூற்றை உறுதியாக மறுத்துத் திருத்துவதை வெளிப்படுத்துகிறது; தொடரும் கூற்றே அந்தத் திருத்தத்தைத் தெளிவாக்குவதால் தமிழில் ‘இல்லை!’ இயல்பாக உள்ளது.
