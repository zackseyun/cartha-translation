  register: நவீன நிலையான தமிழில், நீதிமன்றச் சூழலுக்கேற்ற கண்ணியமான ஆனால் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. இரு பெண்களின் முரண்பட்ட கூற்றுகளில் உள்ள இணை அமைப்பும் ‘உயிரோடிருப்பவன் / இறந்தவன்’ என்ற எதிர்மறை இணையும் தக்கவைக்கப்பட்டுள்ளன.
