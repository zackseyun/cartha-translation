translation:
  language: ta
  text: அப்போது அரசன், “என்னிடம் ஒரு வாளைக் கொண்டு வாருங்கள்” என்றான். அவர்கள் வாளை அரசன் முன் கொண்டுவந்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றான்
  rationale: வாவ் தொடர்வினை கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது; ‘அப்போது’ அதன் தொடர்ச்சியை இயல்பான நவீனத் தமிழில் காட்டுகிறது.
- source_word: הַמֶּלֶךְ
  choice: அரசன்
  rationale: குறிப்பிட்ட அரசனைக் குறிக்கும் உருபுடைய பெயர்ச்சொல்லுக்கு இயல்பான தமிழாக்கம்.
- source_word: קְחוּ לִי
  choice: என்னிடம் ... கொண்டுவாருங்கள்
  rationale: לקח என்பதன் அடிப்படைப் பொருள் ‘எடு’ என்றாலும், இச்சூழலில் பேச்சாளரிடம் ஒரு பொருளைக் கொண்டுவரும்படி கட்டளையிடுகிறது. மரியாதைப் பன்மை வடிவம் அரசன் பலரிடம் கூறும் கட்டளையைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: חָרֶב
  choice: ஒரு வாள்
  rationale: முதல் இடத்தில் எபிரெயச் சொல் சுட்டுருபின்றி வருவதால், குறிப்பிடப்படாத ஒரு வாளைக் குறிக்கும் ‘ஒரு வாள்’ பொருத்தமானது.
- source_word: וַיָּבִאוּ
  choice: அவர்கள் ... கொண்டுவந்தார்கள்
  rationale: பன்மை வினை வடிவத்தையும், கட்டளைக்குப் பின்வரும் நிகழ்வின் தொடர்ச்சியையும் நேரடியாகக் காட்டுகிறது.
- source_word: הַחֶרֶב
  choice: அந்த வாள்
  rationale: இரண்டாம் இடத்தில் சுட்டுருபுடன் வருவதால், ஏற்கெனவே கேட்ட வாளையே மீண்டும் சுட்டுகிறது.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: அரசனுக்கு முன்பாக
  rationale: அரசனின் முன்னிலைக்குக் கொண்டுவரப்பட்டதைக் குறிக்கும் எபிரெயத் தொடரின் இயல்பான, கண்ணியமான தமிழாக்கம்.
