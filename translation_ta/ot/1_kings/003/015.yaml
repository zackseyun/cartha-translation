base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/015.yaml
  text: Then Solomon awoke[a], and behold, it was a dream. And he came to Jerusalem and stood before the ark of the covenant of the LORD, and offered up burnt offerings and made peace offerings, and made a feast for all his servants.
translation:
  language: ta
  text: அப்போது சாலொமோன் விழித்தெழுந்தான்; இதோ, அது ஒரு கனவு! பின்பு அவன் எருசலேமுக்கு வந்து, ஆண்டவரின் உடன்படிக்கைப் பெட்டிக்கு முன்பாக நின்றான். அவன் தகனபலிகளைச் செலுத்தி, சமாதானப் பலிகளையும்[a] செலுத்தினான்; தன் பணியாளர்கள் அனைவருக்கும் ஒரு விருந்து அளித்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஐக்கியப் பலிகள்.” இந்தப் பலிவகை, பலியோடு தொடர்புடைய பகிர்ந்துண்ணும் விருந்தையும் ஐக்கியத்தையும் வலியுறுத்தியிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַץ
  choice: விழித்தெழுந்தான்
  rationale: தூக்கத்திலிருந்து விழிப்பதைக் குறிக்கும் எளிய கதைநடை வினை; நவீனத் தமிழில் இயல்பாக உள்ளது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: திடீர் உணர்வை நோக்கிக் கவனத்தை ஈர்க்கும் எபிரெய உரையாடல் துகளின் வலிமையைப் பாதுகாக்கிறது.
- source_word: חֲלוֹם
  choice: அது ஒரு கனவு
  rationale: எபிரெய மொழியில் உள்ள சுருக்கமான ‘இதோ, ஒரு கனவு’ என்ற அமைப்பைத் தமிழில் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: וַיָּבֹא יְרוּשָׁלִַם
  choice: எருசலேமுக்கு வந்து
  rationale: בוא என்பதன் நேரடியான ‘வருதல்/நுழைதல்’ பொருளைப் பேணுகிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘திரும்பி’ என்பதைச் சேர்க்கவில்லை.
- source_word: וַיַּעֲמֹד לִפְנֵי
  choice: முன்பாக நின்றான்
  rationale: ஒருவரின் அல்லது புனிதப் பொருளின் முன்னிலையில் நிற்பதைக் குறிக்கும் எபிரெய மரபுத்தொடரை நேரடியாகவும் வாசிக்க எளிதாகவும் தருகிறது.
- source_word: אֲרוֹן בְּרִית אֲדֹנָי
  choice: ஆண்டவரின் உடன்படிக்கைப் பெட்டி
  rationale: எபிரெய இணைப்புச் சொற்றொடரின் உறவைத் தெளிவான, இயல்பான தமிழில் வழங்குகிறது.
- source_word: עֹלוֹת
  choice: தகனபலிகள்
  rationale: முழுமையாக எரிக்கப்படும் பலிவகைக்கான நிலைபெற்ற தமிழ்ச் சமயச் சொல்.
- source_word: וַיַּעַל
  choice: செலுத்தி
  rationale: பலியைப் பலிபீடத்தில் அர்ப்பணிக்கும் சூழலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: שְׁלָמִים
  choice: சமாதானப் பலிகள்
  rationale: இந்தப் பலிவகைக்கான பாரம்பரியமான நேரடி இணைச்சொல்; அதன் ஐக்கிய விருந்து அம்சத்தை மட்டும் முன்னிறுத்தாமல் மூலத்தின் பரந்த பொருளைத் தக்கவைக்கிறது.
- source_word: מִשְׁתֶּה
  choice: ஒரு விருந்து
  rationale: கொண்டாட்ட உணவு அல்லது விருந்தைக் குறிக்கும் பெயர்ச்சொல்லுக்கு இயல்பான நவீனத் தமிழ் இணை.
- source_word: לְכָל עֲבָדָיו
  choice: தன் பணியாளர்கள் அனைவருக்கும்
  rationale: עבדים என்பது ஊழியர்கள், பணியாளர்கள் அல்லது அரச அலுவலர்களைக் குறிக்கலாம்; ‘பணியாளர்கள்’ என்பது மிகக் குறுகிய நிர்வாகப் பொருளைத் திணிக்காமல் அரசனுக்குச் சேவை செய்தவர்களை இயல்பாகக் குறிக்கிறது.
theological_decisions:
- issue: אֲרוֹן בְּרִית אֲדֹנָי என்பதில் உள்ள தெய்வீகப் பெயர்/பட்டத்தை மொழிபெயர்த்தல்
  choice: ஆண்டவர்
  alternative: கர்த்தர்
  rationale: வழங்கப்பட்ட எபிரெய உரையில் אֲדֹנָי (‘ஆண்டவர்’) இருப்பதால், அதனை நவீனத் தமிழில் நேரடியாகவும் மரியாதையுடனும் வழங்குகிறது; மூலத்தில் இங்கு அச்சிடப்படாத יהוה என்ற வடிவத்தைத் தமிழில் தனியாகக் குறியிடவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘இதோ’ என்பது மூலத்தின் திடீர் உணர்வு வலிமையைப் பேணுகிறது. அடிக்குறிப்புக் குறி அதற்குரிய שְׁלָמִים என்ற சொல்லின் மொழிபெயர்ப்புக்குப் பின்னரே வைக்கப்பட்டுள்ளது.
