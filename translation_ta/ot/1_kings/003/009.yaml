  text: וְ/נָתַתָּ֨ לְ/עַבְדְּ/ךָ֜ לֵ֤ב שֹׁמֵ֨עַ֙ לִ/שְׁפֹּ֣ט אֶֽת עַמְּ/ךָ֔ לְ/הָבִ֖ין בֵּֽין ט֣וֹב לְ/רָ֑ע כִּ֣י מִ֤י יוּכַל֙ לִ/שְׁפֹּ֔ט אֶת עַמְּ/ךָ֥ הַ/כָּבֵ֖ד הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/009.yaml
  text: So give your servant a listening heart to judge your people[a], to discern between good and evil[b], for who is able to judge this great people of yours?
translation:
  language: ta
  text: ஆகையால், உமது மக்களை நியாயந்தீர்க்கவும், நன்மைக்கும் தீமைக்கும் இடையே பகுத்தறியவும், செவிசாய்க்கும் இருதயத்தை உமது அடியேனுக்குத் தந்தருளும்.[a] ஏனெனில், இந்தப் பெருமைமிக்க[b] உமது மக்களை நியாயந்தீர்க்க யாரால் முடியும்?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘புரிந்துகொள்ளும் இருதயம்’; சொல்லுக்குச் சொல், ‘கேட்கிற/செவிசாய்க்கும் இருதயம்.’
    reason: lexical_alternative
  - marker: b
    text: ‘பெருமைமிக்க’ என்பதற்கான எபிரெயச் சொல் சொல்லுக்குச் சொல் ‘கனமான’ அல்லது ‘பாரமுள்ள’ என்று பொருள்படும். இங்கு அது மக்களின் முக்கியத்துவத்தையோ அவர்களை ஆளும் பொறுப்பின் பாரத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּ
  choice: ஆகையால் ... தந்தருளும்
  rationale: முந்தைய சூழலிலிருந்து தொடரும் வேண்டுதலை வாவ் இணைப்பும் நிறைவுவினையும் வெளிப்படுத்துகின்றன. தமிழில் மரியாதையான வேண்டுதலாகவும் விளைவுச் சார்பைக் காட்டவும் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: לְעַבְדְּךָ
  choice: உமது அடியேனுக்கு
  rationale: தேவனாகிய அரசருக்கு முன் சாலொமோன் தன்னைத் தாழ்மையுடன் குறிப்பிடும் வழக்கமான அரசவைக் கூற்று. நவீனத் தமிழிலும் ஜெபச் சூழலிலும் ‘அடியேன்’ அந்தத் தாழ்மையையும் முதல் நபர் குறிப்பையும் இயல்பாகக் காக்கிறது.
- source_word: לֵב שֹׁמֵעַ
  choice: செவிகொடுக்கிற இருதயம்
  rationale: எபிரெய உருவகத்தைப் பாதுகாத்து, கேட்பதோடு கவனம், ஏற்றுக்கொள்ளுதல், கீழ்ப்படிதல் ஆகிய பொருள் பரப்பையும் திறந்துவைக்கிறது.
- source_word: לִשְׁפֹּט
  choice: நியாயந்தீர்க்க
  rationale: שפט என்பதன் நீதித்துறைச் சார்ந்த அடிப்படைப் பொருளைத் தக்கவைக்கிறது; அரசாளுதல் என்ற விரிந்த அரசப் பொறுப்பு சூழலில் மறைமுகமாக உள்ளது.
- source_word: עַמְּךָ
  choice: உமது மக்கள்
  rationale: இரண்டாம் நபர் உரிமை விகுதியுடன் வரும் עם என்பதன் நேரான பொருளைத் தருகிறது; உடன்படிக்கை மற்றும் அரசியல் நுணுக்கங்கள் இரண்டும் காக்கப்படுகின்றன.
- source_word: לְהָבִין
  choice: பகுத்தறிய
  rationale: ஹிஃபில் வடிவிலுள்ள בין, வேறுபாட்டை உணர்ந்து தீர்மானிக்கும் அறிவைக் குறிக்கிறது; நீதித்தீர்ப்புச் சூழலுக்கு ‘பகுத்தறிய’ பொருத்தமானது.
- source_word: בֵּין טוֹב לְרָע
  choice: நன்மைக்கும் தீமைக்கும் இடையே
  rationale: எபிரெயின் ஒழுக்க மற்றும் மதிப்பீட்டு மொழியை நேரடியாகக் காக்கிறது; அதனை ‘சரி, தவறு’ என்று குறுக்கவில்லை.
- source_word: כִּי מִי יוּכַל
  choice: ஏனெனில் ... யாரால் முடியும்?
  rationale: வேண்டுதலுக்கான காரணத்தையும், பணியின் முன்னிலையில் மனித இயலாமையை வெளிப்படுத்தும் வினாவையும் இயல்பான தமிழில் காக்கிறது.
- source_word: הַכָּבֵד
  choice: பெருமைமிக்க
  rationale: ‘கனமான’ என்ற அடிப்படைப் பொருளிலிருந்து வரும் முக்கியத்துவம், மகத்துவம், ஆட்சிப் பொறுப்பின் பாரம் ஆகிய நுணுக்கங்களுக்கு இடமளிக்கிறது; வெறும் எண்ணிக்கையை மட்டும் சுட்டவில்லை.
theological_decisions:
- issue: சாலொமோனின் வேண்டுதலில் உள்ள மனித இயல்பு சார்ந்த ‘இருதயம்’ உருவகம்
  choice: செவிகொடுக்கிற இருதயம்
  alternative: புரிந்துகொள்ளும் இருதயம்
  rationale: எபிரெயில் ‘இருதயம்’ சிந்தனை, சித்தம், ஒழுக்கத் தீர்மானம் ஆகியவற்றின் மையமாக உள்ளது. அதைத் தக்கவைப்பது வேதாகம மனித இயல்புக் கருத்தைச் சுருக்காமல் காக்கிறது; ‘செவிகொடுக்கிற’ என்பது வெறும் அறிவுத்திறனைவிட ஏற்புத்தன்மையையும் பதிலளிப்பையும் வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. தேவனை நோக்கிய உரையில் ‘உமது’, ‘தந்தருளும்’, ‘அடியேன்’ ஆகிய மரியாதை வடிவங்கள் வைக்கப்பட்டுள்ளன. எபிரெயின் ‘கேட்கிற இருதயம்’ உருவகம் இயல்பான தமிழில் ‘செவிகொடுக்கிற இருதயம்’ எனக் காக்கப்பட்டுள்ளது; உண்மையான பொருள் பரப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
