  text: And all Israel heard of the judgment that the king had rendered[a], and they feared the king[b], because they saw that the wisdom of God was within him to administer justice.
translation:
  language: ta
  text: அரசன் வழங்கிய தீர்ப்பைப் பற்றி இஸ்ரவேலர் அனைவரும் கேள்விப்பட்டார்கள். நீதி வழங்குவதற்குக் கடவுளின் ஞானம் அவனுக்குள் இருப்பதை அவர்கள் கண்டதால், அரசனுக்கு அஞ்சினார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அரசனைப் பயபக்தியுடன் மதித்தார்கள்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் அச்சம், மரியாதை, வியப்பு ஆகிய பொருள் நுணுக்கங்களைக் கொண்டிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: கேள்விப்பட்டார்கள்
  rationale: தீர்ப்புச் செய்தி மக்களுக்குத் தெரியவந்ததை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; எபிரெயச் சொல்லின் ‘கேட்டார்கள்’ என்ற அடிப்படைப் பொருளையும் சூழலில் காக்கிறது.
- source_word: כָל יִשְׂרָאֵל
  choice: இஸ்ரவேலர் அனைவரும்
  rationale: தேச மக்களைக் கூட்டாகக் குறிக்கும் எபிரெய மரபுத்தொடரைத் தெளிவான தமிழில் வழங்குகிறது.
- source_word: הַמִּשְׁפָּט אֲשֶׁר שָׁפַט הַמֶּלֶךְ
  choice: அரசன் வழங்கிய தீர்ப்பு
  rationale: ஒரே வேர் மீளுருவைத் தமிழில் இயல்பான சட்ட மொழியாக மாற்றி, அரசன் அளித்த நீதித்துறைத் தீர்ப்பைக் குறிக்கிறது.
- source_word: וַיִּרְאוּ מִפְּנֵי הַמֶּלֶךְ
  choice: அரசனுக்கு அஞ்சினார்கள்
  rationale: ירא என்பதன் முதன்மையான ‘அஞ்சுதல்’ பொருளைக் காக்கிறது; இச்சூழலில் அதில் மரியாதையும் வியப்பும் கலந்திருக்கலாம் என்பதைக் குறிப்பில் தெரிவிக்கிறது.
- source_word: חָכְמַת אֱלֹהִים
  choice: கடவுளின் ஞானம்
  rationale: אֱלֹהִים என்பதைக் குணப்பெயராக மங்கலாக்காமல், கடவுளை வெளிப்படையாகக் குறிப்பிடும் உடைமைத் தொடராக மொழிபெயர்க்கிறது.
- source_word: בְּקִרְבּוֹ
  choice: அவனுக்குள் இருப்பதை
  rationale: ஞானம் அரசனுக்குள் இருப்பதாகச் சொல்லும் எபிரெய உள்ளிட உருவகத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: לַעֲשׂוֹת מִשְׁפָּט
  choice: நீதி வழங்குவதற்கான
  rationale: ‘நியாயத்தைச் செய்தல்’ என்ற சொற்சொல் வடிவத்தை, அரசனின் நீதித்துறைச் செயலைக் குறிக்கும் இயல்பான தமிழாக வழங்குகிறது; ‘தீர்ப்பு வழங்குதல்’ என்பதும் சாத்தியம்.
theological_decisions:
- issue: אֱלֹהִים என்பதன் மொழிபெயர்ப்பு
  choice: கடவுள்
  alternative: தெய்வீக
  rationale: மூலமொழி கடவுளை நேரடியாகப் பெயரிடுகிறது; ஆகவே அதை ஓர் impersonal பண்பாக மாற்றாமல், சாலொமோனின் ஞானம் கடவுளோடு தொடர்புடையது என்பதைத் தெளிவாகக் காக்கிறது.
- issue: וַיִּרְאוּ מִפְּנֵי הַמֶּלֶךְ என்பதிலுள்ள உணர்வு
  choice: அரசனுக்கு அஞ்சினார்கள்
  alternative: அரசனைப் பயபக்தியுடன் மதித்தார்கள்
  rationale: எபிரெயச் சொல் அச்சம், பயபக்தி, வியப்புடன் கூடிய மரியாதை ஆகிய நிழற்பொருள்களைக் கொள்ள முடியும். முதன்மை உரை நேரடியான ‘அஞ்சினார்கள்’ என்பதை வைத்துக்கொண்டு, பரந்த நிழற்பொருளை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ். ‘அரசன்’, ‘தீர்ப்பு’, ‘நீதி வழங்குதல்’ ஆகியவை கதையின் அரச மற்றும் நீதித்துறைச் செறிவைத் தக்கவைக்கின்றன.
