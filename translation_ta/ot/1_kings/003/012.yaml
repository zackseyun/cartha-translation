base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/012.yaml
  text: Behold[a], I have done according to your words. Behold, I have given you a wise and discerning heart, such that no one like you has been before you, and no one like you shall arise after you.
translation:
  language: ta
  text: இதோ, உன் சொற்களின்படியே நான் செய்தேன். இதோ, ஞானமும் பகுத்தறிவும் உடைய இதயத்தை[a] உனக்குக் கொடுத்தேன்; உனக்கு முன் உன்னைப் போன்ற எவரும் இருந்ததில்லை; உனக்குப் பின் உன்னைப் போன்ற எவரும் எழும்பமாட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சிந்தனையில் ‘இதயம்’ என்பது உணர்ச்சியை மட்டும் அல்லாமல், சிந்தனை, தீர்மானம், பகுத்தறிவு ஆகியவற்றின் உள்ளார்ந்த மையத்தையும் குறிக்கிறது. இதை ‘புரிந்துகொள்ளும் இதயம்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் எபிரெய உரைத்துணுக்கின் வலியுறுத்தலையும் இறைவாக்கின் மாண்பையும் இயல்பான நவீன தமிழில் தக்கவைக்கிறது.
- source_word: עָשִׂיתִי
  choice: நான் செய்தேன்
  rationale: சாலொமோனின் சொற்களுக்கு மறுமொழியாக நிறைவேற்றப்பட்ட இறைச்செயலை நேரடியாகக் காட்டுகிறது.
- source_word: כִּדְבָרֶיךָ
  choice: உன் சொற்களின்படியே
  rationale: சூழலில் இது வேண்டுகோளைக் குறித்தாலும், எபிரெய மூலத்தின் ‘உன் சொற்கள்’ என்ற வெளிப்பாட்டை விளக்கமாக மாற்றாமல் காக்கிறது.
- source_word: נָתַתִּי לְךָ
  choice: உனக்குக் கொடுத்தேன்
  rationale: נתן என்பதன் நேரடிப் பொருளையும், அளிக்கப்பட்ட பரிசை நிறைவேற்றப்பட்ட செயலாகக் கூறும் வினைவடிவையும் பாதுகாக்கிறது.
- source_word: לֵב חָכָם וְנָבוֹן
  choice: ஞானமும் பகுத்தறிவும் உள்ள இதயம்
  rationale: ‘இதயம்’ என்ற எபிரெய உருவகத்தைத் தக்கவைத்து, חָכָם மற்றும் נָבוֹן ஆகிய இணைச் சொற்களின் ஞானம் மற்றும் நுண்ணறிந்து தீர்மானிக்கும் திறன் என்ற வேறுபட்ட நுணுக்கங்களையும் வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר כָּמוֹךָ לֹא הָיָה לְפָנֶיךָ
  choice: ஆகவே, உன்னைப் போன்றவன் உனக்கு முன் இருந்ததில்லை
  rationale: அளிக்கப்பட்ட ஞானத்தின் விளைவாக சாலொமோன் ஒப்பற்றவனாக இருப்பதை இயல்பான தமிழில் காட்டுகிறது; אֲשֶׁר இங்கு அறிமுகப்படுத்தும் விளைவு அல்லது விளக்கத் தொடர்பை ‘ஆகவே’ வெளிப்படுத்துகிறது.
- source_word: וְאַחֲרֶיךָ לֹא יָקוּם כָּמוֹךָ
  choice: உனக்குப் பின் உன்னைப் போன்றவன் எழும்புவதுமில்லை
  rationale: קום என்பதன் ‘எழும்புதல்’ என்ற உருவகத்தைத் தக்கவைத்து, இனி வரலாற்றில் தோன்றுதல் என்ற எதிர்கால நோக்கை உணர்த்துகிறது.
theological_decisions:
- issue: சாலொமோனின் ஒப்பற்ற தன்மையின் வரம்பு
  choice: ஒப்பீட்டை இந்த வசனத்தில் வழங்கப்பட்ட ஞானமும் பகுத்தறிவும் உள்ள இதயத்தின் சூழலில் வாசிக்குமாறு மொழிபெயர்க்கப்பட்டுள்ளது.
  alternative: எல்லா அம்சங்களிலும் சாலொமோன் முற்றிலும் ஒப்பற்றவர் என்ற விரிவான கூற்று.
  rationale: உடனடிச் சூழல் ஆட்சி மற்றும் நியாயத்தீர்ப்புக்காக வழங்கப்பட்ட ஞானத்தையும் பகுத்தறிவையும் மையப்படுத்துகிறது. பிரதான உரை ஒப்பீட்டின் வலிமையைத் தக்கவைக்கிறது; ஆனால் மூலத்தில் இல்லாத பரந்த கோட்பாட்டுக் கூற்றைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் மாண்புடனும் அமைக்கப்பட்டுள்ளது. இறைவாக்கின் இருமுறை வரும் הִנֵּה என்பதற்கு இரு இடங்களிலும் ‘இதோ’ பயன்படுத்தப்பட்டு மூலத்தின் வலியுறுத்தல் காக்கப்பட்டுள்ளது. ‘நெஞ்சம்’ என்பதைக் காட்டிலும் வேதாகம உருவகத்தையும் அறிவாற்றல் சார்ந்த பரந்த பொருளையும் தெளிவாகத் தாங்குவதால் ‘இதயம்’ தேர்ந்தெடுக்கப்பட்டது.
