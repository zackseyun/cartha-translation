source:
  edition: WLC
  text: וַ/יָּ֛מָת בֶּן הָ/אִשָּׁ֥ה הַ/זֹּ֖את לָ֑יְלָה אֲשֶׁ֥ר שָׁכְבָ֖ה עָלָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/019.yaml
  text: And this woman's son died in the night[b][a], because she lay on him.
translation:
  language: ta
  text: இந்தப் பெண்ணின் மகன் இரவில்[a] இறந்துபோனான்; ஏனெனில் அவள் அவன்மேல் படுத்துக்கொண்டாள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இரவின்போது.’
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்குச் சொல்: ‘அவள் அவன்மேல் படுத்துக்கொண்டபோது’ அல்லது ‘அவள் அவன்மேல் படுத்துக்கொண்டது’; சூழல் இதை மரணத்திற்கான காரணமாகக் காட்டுவதால் மூல உரை இங்கே காரணப் பொருளில் மொழிபெயர்க்கப்பட்டுள்ளது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: இறந்துபோனான்
  rationale: மூத் வினையின் wayyiqtol வடிவம் கடந்தகாலக் கதை நிகழ்வைக் குறிக்கிறது; தமிழில் இயல்பான நிறைவுற்ற நிகழ்வாக மொழிபெயர்க்கப்பட்டது.
- source_word: בֶּן
  choice: மகன்
  rationale: எபிரெயச் சொல் பாலினத்தைக் குறிப்பாகச் சுட்டுவதால், பொதுவான ‘குழந்தை’ என்பதற்குப் பதிலாக ‘மகன்’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: הָאִשָּׁה הַזֹּאת
  choice: இந்தப் பெண்ணின்
  rationale: ‘இந்தப் பெண்ணின் மகன்’ என்பது எபிரெயக் கட்டமைப்பின் பொருளை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: לָיְלָה
  choice: இரவில்
  rationale: காலத்தைக் குறிக்கும் இச்சொல் மரணம் எப்போது நிகழ்ந்தது என்பதைத் தெரிவிக்கிறது.
- source_word: אֲשֶׁר
  choice: ஏனெனில்
  rationale: இணைப்புச் சொல்லுக்கு தொடர்பு அல்லது காலப் பொருள் இருக்கக்கூடியபோதிலும், சூழலில் அடுத்து வரும் செயல் மரணத்திற்கான காரணமாகத் தரப்படுகிறது.
- source_word: שָׁכְבָה עָלָיו
  choice: அவள் அவன்மேல் படுத்துக்கொண்டாள்
  rationale: שָׁכַב என்பது படுத்தல் அல்லது கிடத்தலைக் குறிக்கிறது; עַל உடன் வருவதால் மகன்மேல் உடலாகப் படுத்துக்கொண்ட செயல் வெளிப்படுகிறது.
