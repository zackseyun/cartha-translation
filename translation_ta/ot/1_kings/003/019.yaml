translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் இயல்பானதும் கண்ணியமானதுமான நடையில் அமைக்கப்பட்டது. காரணப் பொருள் முதன்மை உரையில் தெளிவாக்கப்பட்டாலும், אֲשֶׁר என்பதிலுள்ள இலக்கண நெகிழ்வு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
