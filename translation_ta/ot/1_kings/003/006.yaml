revisions:
- from: 'சாலொமோன் கூறினார்: “என் தந்தையாகிய உமது ஊழியன் தாவீதுக்கு நீர் மிகுந்த உடன்படிக்கைப் பற்றுறுதியைக்[a] காட்டினீர். ஏனெனில் அவர் உமக்கு முன்பாக உண்மையுடனும்[b] நீதியுடனும், உம்மோடு நேர்மையான உள்ளத்துடனும் நடந்தார். இந்த மிகுந்த உடன்படிக்கைப் பற்றுறுதியை அவருக்காகக் காத்து, அவருடைய அரியணையில் வீற்றிருக்கும் ஒரு மகனை அவருக்குக் கொடுத்தீர்; இன்று இருப்பதுபோலவே[c].”'
  to: 'சாலொமோன் கூறினார்: “என் தந்தையாகிய உமது ஊழியன் தாவீதுக்கு, அவர் உமக்கு முன்பாக உண்மையுடனும்[b] நீதியுடனும் உம்மோடு நேர்மையான உள்ளத்துடனும் நடந்தபடியே, நீர் மிகுந்த உடன்படிக்கைப் பற்றுறுதியைக்[a] காட்டினீர். இந்த மிகுந்த உடன்படிக்கைப் பற்றுறுதியை அவருக்காக நிலைநிறுத்தி, அவருடைய அரியணையில் வீற்றிருக்கும் ஒரு மகனை அவருக்குக் கொடுத்தீர்; இன்று காணப்படுவது போலவே[c].”'
