  text: וַ/יֹּ֣אמֶר שְׁלֹמֹ֗ה אַתָּ֨ה עָשִׂ֜יתָ עִם עַבְדְּ/ךָ֙ דָוִ֣ד אָבִ/י֮ חֶ֣סֶד גָּדוֹל֒ כַּ/אֲשֶׁר֩ הָלַ֨ךְ לְ/פָנֶ֜י/ךָ בֶּ/אֱמֶ֧ת וּ/בִ/צְדָקָ֛ה וּ/בְ/יִשְׁרַ֥ת לֵבָ֖ב עִמָּ֑/ךְ וַ/תִּשְׁמָר ל֗/וֹ אֶת הַ/חֶ֤סֶד הַ/גָּדוֹל֙ הַ/זֶּ֔ה וַ/תִּתֶּן ל֥/וֹ בֵ֛ן יֹשֵׁ֥ב עַל כִּסְא֖/וֹ כַּ/יּ֥וֹם הַ/זֶּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/006.yaml
  text: And Solomon said[a], “You have shown great covenant faithfulness to your servant David my father, because he walked before you in faithfulness, in righteousness, and in uprightness of heart with you; and you have kept for him this great covenant faithfulness and have given him a son sitting on his throne[c][b], as it is this day.”
translation:
  language: ta
  text: 'சாலொமோன் கூறினார்: “என் தந்தையாகிய உமது ஊழியன் தாவீதுக்கு, அவர் உமக்கு முன்பாக உண்மையுடனும்[b] நீதியுடனும் உம்மோடு நேர்மையான உள்ளத்துடனும் நடந்தபடியே, நீர் மிகுந்த உடன்படிக்கைப் பற்றுறுதியைக்[a] காட்டினீர். இந்த மிகுந்த உடன்படிக்கைப் பற்றுறுதியை அவருக்காக நிலைநிறுத்தி, அவருடைய அரியணையில் வீற்றிருக்கும் ஒரு மகனை அவருக்குக் கொடுத்தீர்; இன்று காணப்படுவது போலவே[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உடன்படிக்கைப் பற்றுறுதி” என்று மொழிபெயர்க்கப்பட்ட எபிரேயச் சொல் “மாறாத அன்பு,” “பற்றுள்ள அன்பு,” அல்லது “தயவு” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: “உண்மையுடன்” என்பதை “உண்மையுள்ளவராக,” “நம்பகத்தன்மையுடன்,” அல்லது “கபடமின்றி” என்றும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
  - marker: c
    text: “இன்று காணப்படுவது போலவே” என்பது, இப்போது காணப்படும் நிலையே கூறப்பட்ட பற்றுறுதியை உறுதிப்படுத்துகிறது என்று பொருள்படும் எபிரேய மரபுத்தொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: חֶסֶד
  choice: உடன்படிக்கைப் பற்றுறுதி
  rationale: தாவீதுடனான இறை உறவும் அரச வம்ச வாக்குறுதியும் பின்னணியாக இருப்பதால், வெறும் இரக்கம் அல்லது தயவு என்பதைக் காட்டிலும் உறவுசார், உடன்படிக்கைக்குரிய மாறாத பற்றுறுதியை இச்சொல் தெரிவிக்கிறது.
- source_word: עָשִׂיתָ עִם
  choice: காட்டினீர்
  rationale: חֶסֶד உடன் வரும் எபிரேய மரபுத்தொடரை இயல்பான தமிழில் ஒருவரிடம் பற்றுறுதியைக் ‘காட்டுதல்’ என்று வழங்குகிறது.
- source_word: עַבְדְּךָ
  choice: உமது ஊழியன்
  rationale: இறைவனுக்கு முன்பான தாவீதின் பணிவான நிலையைக் காட்டும் அரச மன்ற மொழிநடைக்கு ‘ஊழியன்’ பொருத்தமானது.
- source_word: כַּאֲשֶׁר
  choice: ஏனெனில்
  rationale: தாவீதின் வாழ்க்கைமுறையையும் இறைவன் அவரிடம் காட்டிய பற்றுறுதியையும் இணைக்கும் காரணத் தொடர்பை இங்கு தெளிவாக எடுத்துரைக்கிறது; ‘எப்படியோ அப்படியே’ என்ற ஒப்புமை நிழலும் மூலத்தில் சாத்தியம்.
- source_word: הָלַךְ לְפָנֶיךָ
  choice: உமக்கு முன்பாக ... நடந்தார்
  rationale: இறைவனுடைய முன்னிலையில் ஒருவர் வாழ்ந்த வாழ்க்கைமுறையைக் குறிக்கும் எபிரேய உருவகத்தைத் தமிழிலும் புரியத்தக்க வகையில் காக்கிறது.
- source_word: בֶּאֱמֶת
  choice: உண்மையுடன்
  rationale: אֱמֶת என்பதன் ‘உண்மை, நம்பகத்தன்மை, உண்மைத்தன்மை’ ஆகிய பொருள் பரப்பைச் சுருக்காமல் காக்கிறது.
- source_word: בִּצְדָקָה
  choice: நீதியுடன்
  rationale: இங்கு தாவீதின் ஒழுக்க நேர்மையையும் சரியான நடத்தையையும் குறிக்கும் צְדָקָה என்பதற்கான நேரடியான தமிழ் இணை.
- source_word: וּבְיִשְׁרַת לֵבָב
  choice: நேர்மையான உள்ளத்துடன்
  rationale: உள்ளார்ந்த செம்மையையும் கபடமின்மையையும் இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: עִמָּךְ
  choice: உம்மோடு
  rationale: மூலத்திலுள்ள ‘உடன்’ என்ற உறவுசார் நுணுக்கத்தை, ‘உமக்கு முன்பாக’ என்பதிலிருந்து வேறுபடுத்திக் காக்கிறது.
- source_word: וַתִּשְׁמָר לוֹ
  choice: அவருக்காகக் காத்து
  rationale: முன்னர் கூறப்பட்ட பற்றுறுதியைத் தொடர்ந்து நிலைநிறுத்திப் பாதுகாத்தார் என்ற שׁמר வினையின் கருத்தைத் தெரிவிக்கிறது.
- source_word: בֵן יֹשֵׁב עַל כִּסְאוֹ
  choice: அவருடைய அரியணையில் வீற்றிருக்கும் ஒரு மகன்
  rationale: יֹשֵׁב என்ற நிகழ்காலப் பங்கேற்புச் சொல்லின் நிறைவேறிய, தற்போதைய அரியணை அமர்வைத் தெளிவாகக் காக்கிறது.
- source_word: כַּיּוֹם הַזֶּה
  choice: இன்று இருப்பதுபோலவே
  rationale: இப்போது கண்முன் இருக்கும் நிலை இறைப் பற்றுறுதியை உறுதிப்படுத்துகிறது என்ற எபிரேய மரபுத்தொடரின் சுட்டுப் பொருளைக் காக்கிறது.
theological_decisions:
- issue: அரச உடன்படிக்கைச் சூழலில் חֶסֶד என்பதன் மொழிபெயர்ப்பு
  choice: உடன்படிக்கைப் பற்றுறுதி
  alternative: மாறாத அன்பு; பற்றுள்ள அன்பு; தயவு
  rationale: தாவீதுக்கான இறைவனின் உறவுசார் பற்றும், அரியணையில் மகனை அமர்த்தியதன் மூலம் வாக்குறுதியைத் தொடர்ந்து நிறைவேற்றியதும் இங்கு மையமாக உள்ளன. இந்தத் தேர்வு அன்பின் நுணுக்கத்தை மறுக்காமல் உடன்படிக்கை மற்றும் வாக்குறுதி சார்ந்த பரிமாணத்தை முன்னிறுத்துகிறது.
- issue: כַּאֲשֶׁר என்பதில் காரணமா அல்லது ஒப்புமையா
  choice: ஏனெனில்
  alternative: அவர் நடந்தபடியே; எவ்வாறு நடந்தாரோ அவ்வாறே
  rationale: இச்சூழலில் தாவீதின் நடை இறைவன் காட்டிய பற்றுறுதியுடன் காரணரீதியாக இணைக்கப்படுகிறது. ஆயினும் இறை அருள் சம்பாதிக்கப்பட்டது என்ற முடிவை உரை கட்டாயப்படுத்தாதபடி, தாவீதின் நடத்தைக்கும் இறை பற்றுறுதிக்கும் இடையிலான பதற்றம் விளக்கத்தில் திறந்தே வைக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், ஜெபத்திற்குரிய கண்ணியமான ‘நீர்/உமது/உமக்கு’ மரியாதை நடையும் அரசச் சூழலுக்கேற்ற ‘அரியணையில் வீற்றிருக்கும்’ என்ற சொல்லாட்சியும் பயன்படுத்தப்பட்டுள்ளன. எபிரேய ‘நடத்தல்’ உருவகம் காக்கப்பட்டாலும், வாக்கிய அமைப்பு சாதாரண வாசகர்களுக்குப் புரியும்படி இயல்பாக்கப்பட்டுள்ளது.
