  text: בְּ/גִבְע֗וֹן נִרְאָ֧ה יְהֹוָ֛ה אֶל שְׁלֹמֹ֖ה בַּ/חֲל֣וֹם הַ/לָּ֑יְלָה וַ/יֹּ֣אמֶר אֱלֹהִ֔ים שְׁאַ֖ל מָ֥ה אֶתֶּן לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/005.yaml
  text: At Gibeon Yahweh appeared to Solomon in a dream at night[a], and God said, “Ask what I should give you.”
translation:
  language: ta
  text: கிபியோனில் யாவே சாலொமோனுக்கு இரவில் ஒரு கனவில்[a] தோன்றினார்; மேலும் கடவுள், “நான் உனக்கு என்ன கொடுக்க வேண்டும் என்று கேள்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “இரவின் கனவில்”; அதாவது, இரவில் ஏற்பட்ட ஒரு கனவில்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/גִבְעוֹן
  choice: கிபியோனில்
  rationale: בְּ இடத்தைக் குறிக்கிறது; தமிழில் ஊர்ப்பெயருடன் ‘-இல்’ இயல்பான இடவேற்றுமை உருபாகும்.
- source_word: נִרְאָה
  choice: தோன்றினார்
  rationale: ראה என்பதன் நிஃபால் வடிவம் இங்கு தெய்வீகத் தோற்றத்தைக் குறிக்கும் வழக்கமான சொற்பயன்பாடு; வெளிப்பாட்டின் முறையை மேலதிகமாக விளக்காமல் பொருளைப் பாதுகாக்கிறது.
- source_word: יְהֹוָה
  choice: யெகோவா
  rationale: மூலத்தில் உள்ள தனிப்பட்ட தெய்வீகப் பெயரை பொதுப்பட்டமான ‘கர்த்தர்’ என்று மாற்றாமல் பெயராகவே வழங்குகிறது.
- source_word: אֶל שְׁלֹמֹה
  choice: சாலொமோனுக்கு
  rationale: אֶל இங்கு தோற்றத்தின் திசை அல்லது பெறுநரைக் குறிக்கிறது; தமிழில் ‘-க்கு’ இயல்பான இணை.
- source_word: בַּ/חֲלֹם הַ/לָּיְלָה
  choice: இரவில் ஒரு கனவில்[a]
  rationale: சொல்லுக்கு சொல் ‘இரவின் கனவில்’; இயல்பான தமிழில் இரவின்போது ஏற்பட்ட கனவு என்ற பொருளைத் தருகிறது. மூல அமைப்பு அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: וַ/יֹּאמֶר
  choice: அப்போது ... என்றார்
  rationale: வாவ் தொடர்வினை கதையை முன்னெடுக்கிறது; தமிழில் ‘அப்போது’ இயல்பான நிகழ்வுத் தொடர்ச்சியை வெளிப்படுத்துகிறது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: முதலில் יהוה என்றும் பின்னர் אֱלֹהִים என்றும் வரும் மூலத்தின் சொல் மாற்றத்தைப் பாதுகாக்கிறது.
- source_word: שְׁאַל
  choice: கேள்
  rationale: நேரடியான கட்டளை வடிவத்தின் திறந்த தன்மையை எளிய, இயல்பான தமிழில் தருகிறது.
- source_word: מָה אֶתֶּן לָךְ
  choice: நான் உனக்கு என்ன கொடுக்க வேண்டும் என்று
  rationale: எபிரெயத்தில் நேரடியாக ‘நான் உனக்கு என்ன கொடுப்பேன்?’ என்ற அமைப்பு; שְׁאַל என்பதுடன் தமிழில் இயல்பாக இணையும் மறைமுக வினா வடிவம் பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: יהוה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக வருகிறது. அதை பொதுப்பட்டமாக்காமல் தமிழ் வாசகர்களுக்கு அறிமுகமான பெயர்வடிவத்தில் பாதுகாக்கிறது.
- issue: ஒரே வசனத்தில் יהוה என்பதிலிருந்து אֱלֹהִים என்பதற்கான சொல் மாற்றம்
  choice: ‘யெகோவா’ என்றும் பின்னர் ‘கடவுள்’ என்றும் வேறுபடுத்துதல்
  alternative: இரண்டையும் ‘கடவுள்’ என ஒருமைப்படுத்துதல்; இரண்டாவதையும் ‘யெகோவா’ என மாற்றுதல்
  rationale: மூலத்தில் அடுத்தடுத்து வரும் இரு வேறு தெய்வீகக் குறிப்புகளையும் வெளிப்படையாகப் பாதுகாத்து, விளக்க நோக்கில் அவற்றை ஒருமைப்படுத்துவதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீனச் செந்தமிழ் சார்ந்த, ஆனால் சாதாரண வாசகர்களுக்கும் எளிதில் புரியும் கண்ணியமான உரைநடை. ‘சாலொமோன்’ என்ற பரவலான தமிழ் வேதாகமப் பெயர்வடிவம் பயன்படுத்தப்பட்டுள்ளது; வாக்கியத் தொடரை இயல்பாக்க இரண்டு வாக்கியங்களாக அமைக்கப்பட்டுள்ளது.
