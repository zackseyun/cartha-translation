  yaml_path: translation/ot/1_kings/003/004.yaml
  text: And the king went to Gibeon to sacrifice there[a], for that was the great high place. Solomon offered a thousand burnt offerings on that altar.
translation:
  language: ta
  text: அரசன் அங்கே பலி செலுத்துவதற்காக கிபியோனுக்குச் சென்றான்; ஏனெனில் அதுவே பெரிய மேட்டு வழிபாட்டு இடம்.[a] சாலொமோன் அந்தப் பலிபீடத்தின் மேல் ஆயிரம் தகனபலிகளைச் செலுத்தினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “முதன்மையான மேட்டு வழிபாட்டு இடம்.” எபிரெயப் பெயரடை அளவில் பெரியது என்பதையோ முக்கியத்துவத்தில் முதன்மையானது என்பதையோ குறிக்கலாம்.
    reason: lexical_alternative
