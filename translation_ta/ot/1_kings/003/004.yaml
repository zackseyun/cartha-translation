  choice: அரசன் கிபியோனுக்குச் சென்றான்
  rationale: הלך என்பதன் அடிப்படை நகர்வுப் பொருளையும், இடப்பெயருடன் சேர்ந்த திசைகாட்டும் ה־ என்பதையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: לִזְבֹּחַ שָׁם
  choice: அங்கே பலி செலுத்துவதற்காக
  rationale: זבח குறிக்கும் பலியிடும் செயலைத் தெளிவாகவும் வழிபாட்டுச் சூழலுக்கேற்ற தமிழிலும் தருகிறது.
- source_word: הַבָּמָה הַגְּדוֹלָה
  choice: முதன்மையான மேட்டுவழிபாட்டிடம்
  rationale: במה என்பதன் வரலாற்று வழிபாட்டிடப் பொருளைத் தக்கவைத்து, גדולה இங்கு அளவையோ முக்கியத்துவத்தையோ குறிக்கக்கூடிய நிலையில் சூழலுக்கேற்ற முக்கியத்துவப் பொருளை முதன்மை உரையில் தருகிறது.
- source_word: אֶלֶף עֹלוֹת
  choice: ஆயிரம் தகனபலிகள்
  rationale: עֹלוֹת என்பது பொதுவான பலிகள் அல்ல, முழுவதும் எரிக்கப்படும் பலிகளைக் குறிப்பதால் வழக்கமான வேதாகமத் தமிழ்ச் சொல்லான ‘தகனபலிகள்’ பயன்படுத்தப்படுகிறது.
- source_word: יַעֲלֶה שְׁלֹמֹה
  choice: சாலொமோன் ... செலுத்தினான்
  rationale: இக்கதைச் சூழலில் yiqtol வடிவம் நடந்த நிகழ்வைச் சுட்டுகிறது; ஆதாரமற்ற வழக்கச் செயல் நுணுக்கத்தைச் சேர்க்காமல் எளிய இறந்தகாலமாக மொழிபெயர்க்கப்படுகிறது.
- source_word: עַל הַמִּזְבֵּחַ הַהוּא
  choice: அந்தப் பலிபீடத்தின் மேல்
  rationale: முன்னர் குறிப்பிடப்பட்ட குறிப்பிட்ட பலிபீடத்தைச் சுட்டும் demonstrative வலியுறுத்தலையும் עַל என்பதன் இடப்பொருளையும் காக்கிறது.
theological_decisions:
- issue: ஆலயம் கட்டப்படுவதற்கு முந்தைய சூழலில் בָּמָה என்பதன் மொழிபெயர்ப்பு
  choice: மேட்டுவழிபாட்டிடம்
  alternative: வழிபாட்டிடம் / உயர்ந்த இடம்
  rationale: வெறும் ‘வழிபாட்டிடம்’ என்று பொதுமைப்படுத்தாமல், இஸ்ரவேலின் வழிபாட்டு வரலாற்றில் இச்சொல்லுக்குள்ள தனித்தன்மையையும் அத்தகைய இடங்களைப் பற்றிய வேதாகமத் த tension-ஐயும் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘மேட்டுவழிபாட்டிடம்’ வரலாற்று-வழிபாட்டு சொல்லின் தன்மையைத் தெளிவுபடுத்துகிறது; அடிக்குறிப்பு எபிரெயச் சொல்லின் உண்மையான இருபொருள் வாய்ப்பைக் காக்கிறது.
