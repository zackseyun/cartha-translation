revisions:
- from: ஆனால், அந்த நாட்களில் யெகோவாவின் பெயருக்கென்று ஓர் ஆலயம் கட்டப்பட்டிருக்கவில்லை; அதனால் மக்கள் மேடைகளில்[a] பலியிட்டு வந்தார்கள்.
  to: ஆயினும், அந்த நாட்களில் யெகோவாவின் பெயருக்காக ஒரு ஆலயம் இன்னும் கட்டப்படாததால், மக்கள் உயர்ந்த வழிபாட்டு இடங்களில்[a] பலியிட்டு வந்தார்கள்.
  rationale: The revision retains the contextual rendering “ஆலயம்” and the named rendering “யெகோவா,” while more clearly representing the concessive force of רַק, the ongoing/customary sense of the participle, the causal כִּי clause, and the cultic sense of בַּבָּמוֹת. No evaluative or denominational interpretation has been added.
