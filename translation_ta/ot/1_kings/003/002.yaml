source:
  edition: WLC
  text: רַ֣ק הָ/עָ֔ם מְזַבְּחִ֖ים בַּ/בָּמ֑וֹת כִּ֠י לֹא נִבְנָ֥ה בַ֨יִת֙ לְ/שֵׁ֣ם יְהוָ֔ה עַ֖ד הַ/יָּמִ֥ים הָ/הֵֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/002.yaml
  text: Only the people were sacrificing at the high places[a], because no house had yet been built for the name of Yahweh in those days.
translation:
  language: ta
  text: ஆயினும், அந்த நாட்களில் யெகோவாவின் பெயருக்காக ஒரு ஆலயம் இன்னும் கட்டப்படாததால், மக்கள் உயர்ந்த வழிபாட்டு இடங்களில்[a] பலியிட்டு வந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல் உயரமான இடங்களில் அமைந்த பலிபீடங்கள் அல்லது உள்ளூர் வழிபாட்டு நிலையங்களைக் குறிக்கலாம்.
    reason: בָּמוֹת என்பதன் வழிபாட்டுச் சூழல்சார் பொருளை விளக்குகிறது.
lexical_decisions:
- source_word: רַק
  choice: ஆனால்
  rationale: முந்தைய வசனத்தின் நேர்மறையான மதிப்பீட்டுக்கு ஒரு வரம்பை அறிமுகப்படுத்துவதால், நவீன தமிழில் ‘ஆனால்’ இயல்பாக உள்ளது.
- source_word: הָעָם
  choice: மக்கள்
  rationale: பொதுவாக வழிபாட்டில் ஈடுபட்ட மக்களைக் குறிக்கிறது; தலைவர்களுக்கு எதிரான தொழில்நுட்ப வேறுபாட்டைத் திணிக்கவில்லை.
- source_word: מְזַבְּחִים
  choice: பலியிட்டு வந்தார்கள்
  rationale: எபிரெயப் பங்கேற்புவினையின் தொடர்ச்சியான அல்லது வழக்கமான செயற்பாட்டைத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: בַּבָּמוֹת
  choice: மேடைகளில்
  rationale: வழிபாட்டுக்காகப் பயன்படுத்தப்பட்ட உயர்ந்த இடங்கள் அல்லது உள்ளூர் வழிபாட்டுத் தலங்களைக் குறிக்கும் மரபான வேதாகமச் சொல்லாக்கம்; அடிக்குறிப்பில் பொருள் விளக்கப்படுகிறது.
- source_word: כִּי
  choice: அதனால்
  rationale: ஆலயம் இன்னும் கட்டப்படாததே மக்கள் மேடைகளில் பலியிட்டதற்கான காரணம் என்பதை இயல்பான தமிழ் வாக்கிய அமைப்பில் காட்டுகிறது.
- source_word: לֹא נִבְנָה בַיִת
  choice: ஓர் ஆலயம் கட்டப்பட்டிருக்கவில்லை
  rationale: בַיִת என்பதன் அடிப்படைப் பொருள் ‘வீடு’ என்றாலும், யெகோவாவின் பெயருக்கான கட்டிடம் இங்கு ஆலயத்தையே குறிக்கிறது; தமிழில் ‘வீடு’ தெளிவின்மையை ஏற்படுத்துவதால் சூழல்சார் பொருள் தேர்ந்தெடுக்கப்பட்டது.
- source_word: לְשֵׁם יְהוָה
  choice: யெகோவாவின் பெயருக்கென்று
  rationale: பெயருக்காகக் கட்டப்படும் ஆலயம் என்ற அரசர்கள் நூலின் முக்கிய இறையியல் மொழியைச் சுருக்காமல் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: திருநாமத்தை ஒரு பட்டப்பெயராக மாற்றாமல் பெயராகவே வழங்குகிறது; தமிழில் பரவலாக அறியப்பட்ட வடிவம்.
- source_word: עַד הַיָּמִים הָהֵם
  choice: அந்த நாட்களில் ... கட்டப்பட்டிருக்கவில்லை
  rationale: அந்தக் காலம் வரையிலும் ஆலயம் கட்டப்படாத நிலையை இயல்பான தமிழில் கூறுகிறது; ‘அந்த நாட்கள் வரை’ என்ற செயற்கையான சொல்லமைப்பைத் தவிர்க்கிறது.
theological_decisions:
- issue: יְהוָה என்ற திருநாமத்தை எவ்வாறு வழங்குவது
  choice: யெகோவா
  alternative: கர்த்தர்
  rationale: மூலத்தில் திருநாமம் நேரடியாக இருப்பதால், அதை பொதுப் பட்டப்பெயராக மாற்றாமல் பெயராகவே வைத்திருக்கிறது.
- issue: בַיִת என்பதை ‘வீடு’ என்றா ‘ஆலயம்’ என்றா மொழிபெயர்ப்பது
  choice: ஆலயம்
  alternative: வீடு
  rationale: சொல்லின் நேரடிப் பொருள் ‘வீடு’ என்றாலும், ‘யெகோவாவின் பெயருக்கென்று’ என்ற தொடரால் இங்கு ஆலயம் குறிப்பாகச் சுட்டப்படுகிறது. நவீன தமிழில் பொருளைத் தெளிவாகக் கூற ‘ஆலயம்’ தேர்ந்தெடுக்கப்பட்டது.
- issue: மேடைகளில் பலியிட்டதற்கான மதிப்பீடு
  choice: செயலை மட்டும் விவரித்தல்
  alternative: அதை வெளிப்படையாகக் கண்டித்தல்
  rationale: இவ்வசனம் ஆலயம் கட்டப்படாமையை காரணமாகக் கூறுகிறது; இந்த இடத்தில் மூல உரை அளிப்பதைக் கடந்த கண்டனத்தை மொழிபெயர்ப்பில் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழ்; எளிதில் புரியக்கூடியதாகவும் மரியாதைமிக்கதாகவும் வடிவமைக்கப்பட்டது. தொடர்ச்சியான செயலை ‘பலியிட்டு வந்தார்கள்’ என்பதும், ஆலயம் இல்லாத காலநிலையை ‘கட்டப்பட்டிருக்கவில்லை’ என்பதும் வெளிப்படுத்துகின்றன.
