base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/022.yaml
  text: But the other woman said[a], “No! My son is the living one, and your son is the dead one.” And this one said, “No! Your son is the dead one, and my son is the living one.” So they spoke before the king.
translation:
  language: ta
  text: ஆனால் மற்ற பெண்[a], “இல்லை! உயிரோடிருப்பவன் என் மகன்; இறந்தவன் உன் மகன்” என்றாள். இந்தப் பெண்ணோ, “இல்லை! இறந்தவன் உன் மகன்; உயிரோடிருப்பவன் என் மகன்” என்றாள். இவ்வாறு அவர்கள் அரசனுக்கு முன்பாகப் பேசினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் வழக்கமான நடையில், “என் மகன் உயிரோடிருக்கிறான்; உன் மகன் இறந்துவிட்டான் … உன் மகன் இறந்துவிட்டான்; என் மகன் உயிரோடிருக்கிறான்” என மொழிபெயர்க்கலாம். எபிரெய மூலத்தில் உள்ள ‘உயிரோடிருப்பவன் / இறந்தவன்’ என்ற நேரெதிர் அமைப்பை முதன்மை உரை பேணுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: என்றாள்
  rationale: பொதுவான எபிரெயக் கதைநடைப் பேச்சுவினை; தமிழில் மேற்கோளுக்குப் பின் வரும் ‘என்றாள்’ இயல்பாகவும் பெண்பால் எழுவாயைத் தெளிவாகவும் காட்டுகிறது.
- source_word: הָאִשָּׁה הָאַחֶרֶת
  choice: மற்ற பெண்
  rationale: வழக்கில் உள்ள இரு பெண்களில் மற்றவளைக் குறிக்கிறது; திருமண உறவைக் குறிக்கும் பொருளைத் தேவையின்றி சேர்க்கவில்லை.
- source_word: לֹא כִי
  choice: இல்லை!
  rationale: கூர்மையான மறுப்பையும் எதிர்ப்பையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְּנִי הַחַי
  choice: உயிரோடிருப்பவன் என் மகன்
  rationale: ‘உயிருள்ளவன்/இறந்தவன்’ என்ற எபிரெய எதிர்நிலையைப் பேணுகிறது; தமிழின் இயல்பான வாக்கிய ஒழுங்கில் உரிமைக் கோரிக்கையையும் வலியுறுத்துகிறது.
- source_word: וּבְנֵךְ הַמֵּת
  choice: இறந்தவன் உன் மகன்
  rationale: குறிப்பிட்ட இரு குழந்தைகளை வேறுபடுத்தும் பெயரடைத் தன்மையையும் முந்தைய சொற்றொடருடனான இணை அமைப்பையும் காக்கிறது.
- source_word: וְזֹאת אֹמֶרֶת
  choice: இவளோ ... என்றாள்
  rationale: זֹאת என்பதன் சுட்டுப்பொருளை ‘இவள்’ எனப் பேணி, ‘-ஓ’ மூலம் மாறுபட்ட எதிர்கூற்றை இயல்பாகக் காட்டுகிறது.
- source_word: וַתְּדַבֵּרְנָה
  choice: இவ்வாறு அவர்கள் ... பேசினார்கள்
  rationale: பெண்கள் இருவரின் பரிமாற்றத்தைச் சுருக்கிக் கூறும் பன்மை வினையைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: அரசனுக்கு முன்பாக
  rationale: எபிரெயின் ‘அரசன் முன்னிலையில்’ என்ற பொருளை நேரடியாகவும் இயல்பாகவும் தருகிறது; ‘சாலொமோன்’ என்பதைச் சேர்க்கவில்லை.
