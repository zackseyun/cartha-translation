translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. இரு பெண்களின் கூற்றுகளிலுள்ள திட்டமிட்ட இணை அமைப்பும் கூர்மையான மறுப்பும் பேணப்பட்டுள்ளன.
