  source_fidelity: The translation accurately preserves the two sharply opposing claims, the Hebrew contrast between ‘the living one’ and ‘the dead one,’ the alternation marked by ‘this one,’ and the concluding plural statement that both women spoke before the king. ‘அரசனுக்கு முன்பாக’ faithfully renders ‘before the king’ without adding Solomon’s name.
