revisions:
- from: சாலொமோ இந்தக் காரியத்தைக் கேட்டதால், அது ஆண்டவரின் பார்வையில் நன்றாயிருந்தது[a].
  to: சாலொமோன் இந்தக் காரியத்தை வேண்டிக்கேட்டதால், அது ஆண்டவரின் பார்வையில் நன்றாயிருந்தது[a].
  rationale: The revision retains the source’s causal structure and broad reference to ‘this matter,’ while clarifying in idiomatic Tamil that Solomon requested it rather than merely inquired about it. The conventional Tamil form of Solomon’s name is restored. The footnote remains a valid lexical alternative for the Hebrew evaluative expression.
