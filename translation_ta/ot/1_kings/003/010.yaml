source:
  edition: WLC
  text: וַ/יִּיטַ֥ב הַ/דָּבָ֖ר בְּ/עֵינֵ֣י אֲדֹנָ֑/י כִּ֚י שָׁאַ֣ל שְׁלֹמֹ֔ה אֶת הַ/דָּבָ֖ר הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/010.yaml
  text: And the matter was good in the eyes of the Lord[a], because Solomon had asked this thing.
translation:
  language: ta
  text: சாலொமோன் இந்தக் காரியத்தை வேண்டிக்கேட்டதால், அது ஆண்டவரின் பார்வையில் நன்றாயிருந்தது[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அது ஆண்டவருக்கு மகிழ்ச்சியளித்தது.”
    reason: וַיִּיטַב בְּעֵינֵי என்ற எபிரெயத் தொடரை ஒரு மதிப்பீடாகவும், ‘மகிழ்ச்சியளித்தது’ என்றும் இயல்பாக மொழிபெயர்க்கலாம்.
lexical_decisions:
- source_word: וַיִּיטַב
  choice: நன்றாயிருந்தது
  rationale: இது அந்தக் காரியத்தை ஆண்டவர் நல்லதாக மதிப்பிட்டதைக் குறிக்கிறது. எபிரெயச் சொல்லின் அடிப்படைப் பொருளையும் மதிப்பீட்டு நுட்பத்தையும் காக்கிறது; ‘மகிழ்ச்சியளித்தது’ என்பது இயல்பான மாற்று, ஆனால் சற்றே விளக்கமானது.
- source_word: הַדָּבָר / הַדָּבָר הַזֶּה
  choice: இந்தக் காரியம் / அது
  rationale: דבר என்பதன் ‘காரியம், விஷயம், சொல்’ என்ற பரந்த பொருளை ‘காரியம்’ காக்கிறது. தமிழில் தேவையற்ற மறுபடியுரைத்தலைத் தவிர்க்க இரண்டாவது குறிப்பை ‘அது’ என வழங்குகிறது.
- source_word: בְּעֵינֵי
  choice: பார்வையில்
  rationale: ‘கண்களில்’ என்ற சொற்சொறான வடிவத்தைவிட நவீனத் தமிழில் இயல்பாக இருந்து, எபிரெய மொழியின் மதிப்பீட்டு மரபுத்தொடரையும் காக்கிறது.
- source_word: אֲדֹנָי
  choice: ஆண்டவர்
  rationale: மூலத்தில் இருப்பது אֲדֹנָי (‘ஆண்டவர்’); יהוה அல்ல. எனவே தனித்த தெய்வீகப் பட்டத்தைத் துல்லியமாக வழங்குகிறது.
- source_word: כִּי
  choice: கேட்டதால்
  rationale: כִּי இங்கு காரணத்தை அறிமுகப்படுத்துகிறது. தமிழ் வாக்கிய அமைப்பில் ‘-தால்’ என்ற காரண விகுதி இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: שָׁאַל שְׁלֹמֹה
  choice: சாலொமோ ... கேட்டதால்
  rationale: שׁאל என்பது ‘கேள்/கேட்டுக்கொள்/வேண்டு’ எனப் பொருள்படலாம். ‘கேட்டார்’ என்பது சூழலில் வேண்டுதலை உணர்த்துவதோடு, மூலத்தின் பரப்பையும் தேவையின்றிக் குறுக்காது.
theological_decisions:
- issue: אֲדֹנָי என்ற தெய்வீகப் பட்டத்தின் மொழிபெயர்ப்பு
  choice: ஆண்டவர்
  alternative: யெகோவா / கர்த்தராகிய யெகோவா
  rationale: இந்த இடத்தில் நான்கு எழுத்துத் திருப்பெயரான יהוה இல்லை; אֲדֹנָי மட்டுமே உள்ளது. ஆகவே மூலமொழி வேறுபாட்டைக் காக்க ‘ஆண்டவர்’ பயன்படுத்தப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை. காரணக் கூறு தமிழுக்கேற்றவாறு முதலில் வைக்கப்பட்டுள்ளது. ‘ஆண்டவரின் பார்வையில்’ என்பது எபிரெய மதிப்பீட்டு மரபுத்தொடரைத் தெளிவாகவும் இயல்பாகவும் காக்கிறது.
