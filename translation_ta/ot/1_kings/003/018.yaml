base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/018.yaml
  text: And on the third day after I gave birth[a], this woman also gave birth. And we were together; there was no stranger with us in the house, only the two of us were in the house.
translation:
  language: ta
  text: நான் குழந்தை பெற்ற பின்பு மூன்றாம் நாளில், இந்தப் பெண்ணும் குழந்தை பெற்றாள். நாங்கள் ஒன்றாக இருந்தோம்; வீட்டில் எங்களுடன் அந்நியர்[a] யாரும் இல்லை. வீட்டில் நாங்கள் இருவர் மட்டுமே இருந்தோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வெளியாள்.’ எபிரெயச் சொல் அந்தக் குழுவையோ வீட்டையோ சாராத ஒருவரைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּיּוֹם הַשְּׁלִישִׁי לְלִדְתִּי
  choice: நான் குழந்தை பெற்ற பின்பு மூன்றாம் நாளில்
  rationale: לְ உடன் வரும் வினையெச்சப் பெயரும் முதலாம் நபர் ஒருமை பின்னொட்டும் இங்கு கால உறவைக் குறிக்கின்றன. இயல்பான தமிழில், குழந்தை பெற்றதைத் தொடர்ந்து வந்த மூன்றாம் நாள் என்று தெளிவாகக் கூறுகிறது.
- source_word: וַתֵּלֶד גַּם הָאִשָּׁה הַזֹּאת
  choice: இந்தப் பெண்ணும் குழந்தை பெற்றாள்
  rationale: הַזֹּאת என்பதன் சுட்டும் வலிமையை ‘இந்த’ என்பதும், גַּם என்பதைக் ‘-உம்’ என்பதும் இயல்பாகத் தக்கவைக்கின்றன.
- source_word: וַאֲנַחְנוּ יַחְדָּו
  choice: நாங்கள் ஒன்றாக இருந்தோம்
  rationale: יַחְדָּו என்பதன் நேரடியான பொருள் ‘ஒன்றாக’. அடுத்த கூற்றே வேறு யாரும் அங்கு இல்லை என்பதை விளக்குவதால், இங்கேயே ‘தனியாக’ என்று சேர்க்கப்படவில்லை.
- source_word: אֵין זָר אִתָּנוּ בַּבַּיִת
  choice: வீட்டில் எங்களுடன் அந்நியர் யாரும் இல்லை
  rationale: זָר என்பது அந்தக் குழுவையோ வீட்டையோ சாராத அந்நியரை அல்லது வெளியாளைக் குறிக்கலாம். ‘அந்நியர்’ மூலச்சொல்லின் தனித்துவமான பொருளைத் தக்கவைக்கிறது.
- source_word: זוּלָתִי שְׁתַּיִם אֲנַחְנוּ בַּבָּיִת
  choice: வீட்டில் நாங்கள் இருவர் மட்டுமே இருந்தோம்
  rationale: זוּלָתִי இங்கு மற்றவர்களை விலக்கும் பொருளைத் தருகிறது. ‘இருவர் மட்டுமே’ என்பது அந்தத் தனிப்படுத்தலை இயல்பான தமிழில் வெளிப்படுத்துகிறது; மீண்டும் வரும் ‘வீட்டில்’ என்பதும் மூலத்தைப் போலவே தக்கவைக்கப்பட்டுள்ளது.
