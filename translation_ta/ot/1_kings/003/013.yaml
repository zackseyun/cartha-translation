base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/013.yaml
  text: And I have also given you what you did not ask for[a], both riches and honor, so that there has been no man like you among the kings all your days.
translation:
  language: ta
  text: மேலும், நீ கேட்காததையும்—செல்வத்தையும் கௌரவத்தையும்—நான் உனக்குக் கொடுத்திருக்கிறேன்; அதனால், உன் வாழ்நாளெல்லாம் அரசர்களில் உன்னைப் போன்ற ஒருவன் இருக்கமாட்டான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் வாழ்நாளெல்லாம் அரசர்களில் உன்னைப் போன்ற ஒருவனும் இருந்ததில்லை.”
    reason: לֹא הָיָה என்ற எபிரெய நிறைவு வினை வடிவத்தை கடந்த/நிறைவு நிலையாக நேரடியாகப் புரிந்துகொள்ளவும் முடியும்.
lexical_decisions:
- source_word: וְגַם
  choice: மேலும்
  rationale: முந்தைய வாக்குறுதியுடன் இன்னொரு கொடையைச் சேர்க்கும் இணைப்பு மற்றும் கூட்டல் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: אֲשֶׁר לֹא שָׁאַלְתָּ
  choice: நீ கேட்காததையும்
  rationale: எபிரெய உறவுத்தொடரின் ‘நீ கேட்காதது’ என்ற பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: נָתַתִּי לָךְ
  choice: நான் உனக்குக் கொடுத்திருக்கிறேன்
  rationale: நிறைவேற்றப்பட்ட தெய்வீகக் கொடையின் தற்போதைய பொருத்தத்தைத் தமிழின் நிகழ்கால நிறைவு வடிவில் வெளிப்படுத்துகிறது.
- source_word: גַּם עֹשֶׁר גַּם כָּבוֹד
  choice: செல்வத்தையும் கௌரவத்தையும்
  rationale: மீண்டும் வரும் גַּם இரண்டு தனித்த கொடைகளையும் வலியுறுத்துகிறது. இச்சூழலில் כָּבוֹד என்பது தெய்வீக ‘மகிமை’ என்பதைவிட அரசருக்குரிய ‘கௌரவம்’ என்பதற்கே பொருந்துகிறது.
- source_word: אֲשֶׁר לֹא הָיָה כָמוֹךָ אִישׁ
  choice: ஆகவே ... உன்னைப் போன்ற ஒருவன் இருக்கமாட்டான்
  rationale: אֲשֶׁר என்பதை கொடுக்கப்பட்ட செல்வமும் கௌரவமும் விளைவிக்கும் முடிவாக எடுத்துக்கொள்கிறது; אִישׁ என்பதன் ஆண்பால் ஒருமையை ‘ஒருவன்’ காக்கிறது. வாழ்நாள் முழுவதையும் நோக்கும் வாக்குறுதி என்பதால் தமிழில் எதிர்காலம் இயல்பாகிறது.
- source_word: בַּמְּלָכִים
  choice: அரசர்களில்
  rationale: அரசர்களின் குழுவுக்குள் சாலொமோனின் ஒப்பற்ற நிலையைத் தெரிவிக்கும் ஒப்பீட்டு/பகுதிப்பொருளைச் சுருக்கமாகக் காட்டுகிறது.
- source_word: כָּל יָמֶיךָ
  choice: உன் வாழ்நாளெல்லாம்
  rationale: ‘உன் எல்லா நாட்களும்’ என்ற எபிரெய மரபுத்தொடரை நவீனத் தமிழில் தெளிவாகத் தருகிறது.
theological_decisions:
- issue: אִישׁ என்ற சொல்லை ஒப்பீட்டு வாக்கியத்தில் மொழிபெயர்த்தல்
  choice: உன்னைப் போன்ற ஒருவன்
  alternative: உன்னைப் போன்ற ஒருவர்; உன்னைப் போன்ற அரசன்
  rationale: மூலத்தில் ஆண்பால் ஒருமையான אִישׁ வெளிப்படையாக இருப்பதால் ‘ஒருவன்’ அதைத் தக்கவைக்கிறது. ‘அரசன்’ என்பது அடுத்துள்ள ‘அரசர்களில்’ என்பதைக் கொண்டு மூலத்தில் இல்லாத சொல்லை முன்னதாகச் சேர்த்துவிடும்.
- issue: לֹא הָיָה என்பதன் காலம் மற்றும் முடிவுப்பொருள்
  choice: இருக்கமாட்டான்
  alternative: இருந்ததில்லை
  rationale: எபிரெய நிறைவு வடிவம் அப்படியே பார்த்தால் கடந்த/நிறைவு நிலையைச் சுட்டலாம்; ஆனால் ‘உன் வாழ்நாளெல்லாம்’ என்ற எதிர்நோக்கிய வாக்குறுதிச் சூழலில் எதிர்காலத் தமிழ் இயல்பானது. மூலத்தின் கால/பார்வைத் தெளிவின்மை அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘செல்வம்’, ‘கௌரவம்’, ‘வாழ்நாளெல்லாம்’ ஆகிய சொற்கள் பொதுவாசகர்களுக்குப் புரியும்படியும் அரசருக்குரிய சூழலைத் தக்கவைக்கும்படியும் தேர்ந்தெடுக்கப்பட்டன.
