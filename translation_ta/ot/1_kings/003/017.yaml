  yaml_path: translation/ot/1_kings/003/017.yaml
  text: Then one woman said, “Please, my lord, I and this woman live in one house, and I gave birth while she was in the house with me.
translation:
  language: ta
  text: அப்போது அந்தப் பெண்களில் ஒருத்தி, “ஐயா, தயவுசெய்து! நானும் இந்தப் பெண்ணும் ஒரே வீட்டில் வசிக்கிறோம். இவள் என்னுடன் அந்த வீட்டில் இருந்தபோது நான் பெற்றெடுத்தேன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּי אֲדֹנִי
  choice: ஐயா, தயவுசெய்து கேளுங்கள்!
  rationale: அரசரிடம் பணிவுடன் முறையிடுவதைக் குறிக்கும் எபிரெய மரபுத்தொடரை, நவீன தமிழில் இயல்பாகவும் மரியாதையுடனும் வெளிப்படுத்துகிறது.
- source_word: יֹשְׁבֹת בְּבַיִת אֶחָד
  choice: ஒரே வீட்டில் வசிக்கிறோம்
  rationale: יֹשְׁבֹת என்பது வடிவில் நிகழ்காலப் பெண்பால் பன்மை; இருவரும் ஒரே வீட்டில் வசிப்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וָאֵלֵד
  choice: நான் ஒரு குழந்தையைப் பெற்றெடுத்தேன்
  rationale: எபிரெய வினைச்சொல்லின் ‘பெற்றெடுத்தேன்’ என்ற பொருளைத் தெளிவாகத் தருகிறது; தமிழில் தேவைப்படும் மறைபொருளான குழந்தை என்பதைக் இயல்பாகச் சேர்க்கிறது.
- source_word: עִמָּהּ בַּבָּיִת
  choice: இவள் என்னுடன் அந்த வீட்டில் இருந்தபோது
  rationale: பிரசவ நேரத்தில் மற்ற பெண் அதே வீட்டில் அவளுடன் இருந்தாள் என்ற சூழலைத் தெளிவாகப் பாதுகாக்கிறது.
