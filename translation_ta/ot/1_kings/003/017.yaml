revisions:
- from: அப்போது அந்தப் பெண்களில் ஒருத்தி, “ஐயா, தயவுசெய்து கேளுங்கள்! நானும் இந்தப் பெண்ணும் ஒரே வீட்டில் வசிக்கிறோம். இவள் என்னுடன் அந்த வீட்டில் இருந்தபோது நான் ஒரு குழந்தையைப் பெற்றெடுத்தேன்.
  to: அப்போது அந்தப் பெண்களில் ஒருத்தி, “ஐயா, தயவுசெய்து! நானும் இந்தப் பெண்ணும் ஒரே வீட்டில் வசிக்கிறோம். இவள் என்னுடன் அந்த வீட்டில் இருந்தபோது நான் பெற்றெடுத்தேன்.
  rationale: The revision removes the unsupported imperative “கேளுங்கள்” and avoids adding “ஒரு குழந்தையை,” while retaining the deferential appeal, shared residence, and the other woman’s presence in the house at the time of birth. The quotation remains open because the speech continues in the next verse.
