base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/025.yaml
  text: Then the king said[a], “Cut the living child in two, and give half to the one and half to the other.”
translation:
  language: ta
  text: அப்போது அரசன், “உயிரோடிருக்கும் குழந்தையை இரண்டாக வெட்டி, ஒரு பாதியை ஒருத்திக்கும் மறு பாதியை மற்றவளுக்கும் கொடுங்கள்” என்றான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “ஒருத்திக்கு ... ஒருத்திக்கு” என்று பெண்பால் வடிவங்கள் வருகின்றன; அவை இக்கதையிலுள்ள இரண்டு பெண்களைக் குறிக்கின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றான்
  rationale: வாவ் தொடர்வினை கதைநிகழ்வை முன்னெடுக்கிறது; ‘அப்போது’ அதன் தொடர்ச்சியை இயல்பான நவீன தமிழில் காட்டுகிறது.
- source_word: הַמֶּלֶךְ
  choice: அரசன்
  rationale: குறிப்பிட்ட அரசனைக் குறிக்கும் பெயர்ச்சொல்; தமிழ் சூழலில் இயல்பாகத் திட்டவுருபின்றி வழங்கப்படுகிறது.
- source_word: גִּזְרוּ
  choice: வெட்டி
  rationale: גזר என்பதன் பன்மை ஏவல் இங்கு உடலைத் துண்டிக்கச் சொல்லும் நேரடியான கட்டளை; ‘வெட்டி’ அதன் வன்மையான உடற்பொருளைப் பாதுகாக்கிறது.
- source_word: הַיֶּלֶד הַחַי
  choice: உயிரோடிருக்கும் குழந்தையை
  rationale: இறந்த குழந்தையிலிருந்து வேறுபடுத்தும் הַחַי என்ற பெயரடைத் தொடரைத் தெளிவான, இயல்பான தமிழில் தருகிறது.
- source_word: לִשְׁנָיִם
  choice: இரண்டாக
  rationale: இரண்டு பகுதிகளாகப் பிரிப்பதைச் சுருக்கமாகவும் மூலத்துக்கு நெருக்கமாகவும் தெரிவிக்கிறது.
- source_word: וּתְנוּ
  choice: '... கொடுங்கள்'
  rationale: முந்தைய பன்மை ஏவலுடன் இணைந்த இரண்டாவது பன்மை ஏவல்; தமிழில் வினையெச்சத் தொடரும் இறுதி ஏவல் வடிவமும் கட்டளைகளின் வரிசையை இயல்பாகத் தருகின்றன.
- source_word: הַחֲצִי
  choice: ஒரு பாதி / மறு பாதி
  rationale: குழந்தையின் இரு பாதிகளையும் பகிர்ந்தளிக்கும் பொருளைத் தமிழில் இயல்பாகவும் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: לְאַחַת ... לְאֶחָת
  choice: ஒருத்திக்கும் ... மற்றவளுக்கும்
  rationale: எபிரெயப் பெண்பால் வடிவங்கள் முன் சூழலிலுள்ள இரு பெண்களைக் குறிக்கின்றன; ‘ஒருத்தி ... மற்றவள்’ அந்தப் பெண்பால் மற்றும் பகிர்ந்தளிப்பு உறவைத் தெளிவாகப் பாதுகாக்கிறது.
