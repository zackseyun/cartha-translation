translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளக்கூடிய கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. அரசனின் கட்டளையின் நேரடித்தன்மையும் அதிர்ச்சியூட்டும் வன்மையும் மென்மையாக்கப்படவில்லை. அடிக்குறிப்பு குறியீடு முதன்மை உரையில் இடம்பெற்றுள்ளது.
