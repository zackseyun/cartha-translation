base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/052.yaml
  text: And Solomon said[a], “If he proves to be a worthy man, not one of his hairs will fall to the ground; but if evil is found in him[b], he shall die.”
translation:
  language: ta
  text: சாலொமோன், “அவன் தகுதியுள்ளவனாக இருந்தால்[a], அவனுடைய ஒரு முடிகூட தரையில் விழாது[b]. ஆனால் அவனிடத்தில் தீமை காணப்பட்டால், அவன் சாவான்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'நேர்ப்பொருள்: ‘வலிமையின்/திறமையின் மகன்.’ இந்த எபிரெய மரபுத்தொடர் சூழலுக்கேற்ப தகுதியுள்ளவன், திறமைமிக்கவன் அல்லது வீரமுள்ளவன் என்று பொருள்படலாம்.'
    reason: lexical_alternative
  - marker: b
    text: ‘அவனுடைய ஒரு முடிகூட தரையில் விழாது’ என்பது அவனுக்கு எந்தத் தீங்கும் நேராது என்று பொருள்படும் எபிரெய மரபுத்தொடர்.
    reason: idiom_explanation
lexical_decisions:
- source_word: בֶן־חַיִל
  choice: தகுதியுள்ளவன்
  rationale: இதன் நேர்ப்பொருள் ‘வலிமையின்/திறமையின் மகன்.’ இச்சூழலில் இது இராணுவ வீரத்தைவிட ஆதோனியாவின் தகுந்த நடத்தையையும் நற்பண்பையும் குறிக்கிறது.
- source_word: יִהְיֶה
  choice: நடந்துகொண்டால்
  rationale: எபிரெய வினைச்சொல்லின் அடிப்படைப் பொருள் ‘இருப்பான்’ என்றாலும், இந்த நிபந்தனை இனி அவன் காட்டப்போகும் நடத்தையைப் பற்றியது. இயல்பான தமிழில் அந்தச் சூழற்பொருளை இச்சொல் வெளிப்படுத்துகிறது.
- source_word: מִשַּׂעֲרָתוֹ
  choice: அவனுடைய தலைமுடியில் ஒன்றுகூட
  rationale: எபிரெயத்தில் ‘அவனுடைய முடியில் இருந்து’ என்று ஒருமைத் தொகுப்புப்பெயர் வருகிறது. தமிழில் முழுமையான பாதுகாப்பைக் குறிக்கும் மரபுத்தொடராக இயல்பாக அமைய இவ்வாறு மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: לֹא יִפֹּל ... אָרְצָה
  choice: தரையில் விழாது
  rationale: ‘தரையை நோக்கி விழாது’ என்பதே நேர்ப்பொருள்; இங்கு ஒருவித தீங்கும் நேராது என்பதைக் குறிக்கும் மரபுத்தொடரின் உருவகம் தக்கவைக்கப்பட்டுள்ளது.
- source_word: רָעָה
  choice: தீமை
  rationale: நீதித்தீர்ப்புச் சூழலில் ஒழுக்கக்கேடு அல்லது குற்றத்தைக் குறிக்கும் பரந்த எபிரெயச் சொல்லின் வலிமையையும் தெளிவின்மையையும் ‘தீமை’ காக்கிறது.
- source_word: תִמָּצֵא בוֹ
  choice: அவனிடம் ... காணப்பட்டால்
  rationale: அந்தத் தீமை அவனுக்குரியதாகக் கண்டறியப்படுவதை இயல்பான தமிழில் கூறுகிறது; குறிப்பிட்ட ஒரு குற்றமாக இதை தேவையின்றி சுருக்கவில்லை.
- source_word: וָמֵת
  choice: அவன் சாவான்
  rationale: தீமை கண்டறியப்பட்டால் ஏற்படும் கடுமையான விளைவை எபிரெயத்தைப் போலச் சுருக்கமாகக் கூறுகிறது; இது முன்னறிவிப்பா அல்லது நீதித்தீர்ப்பா என்பதைத் தேவையின்றி முடிவுசெய்யவில்லை.
theological_decisions:
- issue: וָמֵת என்பதன் தீர்ப்பியல் நுட்பம்
  choice: அவன் சாவான்
  alternative: அவன் சாகவேண்டும் / அவன் கொல்லப்படுவான்
  rationale: மாற்றுகள் கட்டளை அல்லது மனிதச் செயற்பாட்டை இன்னும் வெளிப்படையாகச் சேர்க்கின்றன. எபிரெய உரையின் சுருக்கத்தையும் முன்னறிவிப்பு–தீர்ப்பு இடையிலான நுட்பத்தையும் தேர்ந்த வடிவம் காக்கிறது.
translation_notes:
  register: நவீனத் தரமான தமிழில் இயல்பாகவும் அரசத் தீர்ப்புக்குரிய கண்ணியமான தொனியுடனும் வடிவமைக்கப்பட்டது. உருவக மரபுத்தொடர் முதன்மை உரையில் தக்கவைக்கப்பட்டு அதன் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
