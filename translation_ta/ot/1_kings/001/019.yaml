base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/019.yaml
  text: And he sacrificed oxen[a], fattened cattle, and sheep in abundance, and he invited all the king’s sons, Abiathar the priest, and Joab the commander of the army[b]; but he did not invite Solomon your servant.
translation:
  language: ta
  text: அவன் மாடுகளையும், கொழுத்த கால்நடைகளையும், ஆடுமந்தைகளையும்[b] ஏராளமாகப் பலியிட்டான். அரசனுடைய மகன்கள் அனைவரையும், ஆசாரியனாகிய அபியத்தாரையும், படைத்தளபதியாகிய யோவாபையும் அழைத்தான்[a]; ஆனால் உமது அடியான் சாலொமோனை அவன் அழைக்கவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இரு இடங்களிலும் வரும் எபிரெய வினைச்சொல்லை ‘கூப்பிட்டான்’ அல்லது ‘வரவழைத்தான்’ என்றும் மொழிபெயர்க்கலாம்; பலியுணவில் கலந்துகொள்வதற்கான அழைப்பைச் சூழல் குறிப்பதால் இங்கு ‘அழைத்தான்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: ‘ஆடுமந்தைகள்’ என்று மொழிபெயர்க்கப்பட்ட எபிரெயச் சொல், செம்மறியாடுகள் மட்டுமல்லாமல் வெள்ளாடுகளையும் உள்ளடக்கிய மந்தை விலங்குகளைப் பொதுவாகக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבַּח
  choice: பலியிட்டான்
  rationale: זבח இச்சூழலில் சாதாரணமாகக் கொல்வதைக் குறிக்காமல், பலிக்காக விலங்குகளைக் கொடுப்பதைக் குறிக்கிறது; ‘பலியிட்டான்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: שׁוֹר
  choice: மாடுகள்
  rationale: இந்தப் பொதுப்பெயர் பசுவினத்தைக் குறிக்கிறது; பாலினத்தையோ உழவுப் பயன்பாட்டையோ தேவையின்றிக் குறிப்பாக்காமல் ‘மாடுகள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: מְרִיא
  choice: கொழுத்த கால்நடைகள்
  rationale: மனிதர்களால் கொழுக்கவைக்கப்பட்ட அல்லது நன்கு கொழுத்த கால்நடைகளைக் குறிக்கும் சொல்லின் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: צֹאן
  choice: ஆடுமந்தைகள்
  rationale: இது செம்மறியாடுகளையும் வெள்ளாடுகளையும் உள்ளடக்கக்கூடிய மந்தை விலங்குகளுக்கான தொகுப்புச் சொல்; பரந்த பொருளை ஓரளவு காக்கும் இயல்பான தமிழ் தெரிவாக ‘ஆடுமந்தைகள்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: לָרֹב
  choice: ஏராளமாக
  rationale: பலிக்கொடுக்கப்பட்ட விலங்குகளின் மிகுந்த அளவைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וַיִּקְרָא / קָרָא
  choice: அழைத்தான் / அழைக்கவில்லை
  rationale: קרא என்பதன் அடிப்படைப் பொருள் ‘அழைத்தல்’; இங்கு பலிவிருந்தில் கலந்துகொள்ள அழைப்பதைச் சூழல் உணர்த்துவதால், இரு இடங்களிலும் ஒரே தமிழ் வேர்ச்சொல் வைக்கப்பட்டது.
- source_word: לְכָל בְּנֵי הַמֶּלֶךְ
  choice: அரசனுடைய மகன்கள் அனைவரையும்
  rationale: எபிரெயச் சொற்றொடரின் ஆண்பால் குறிப்பையும் ‘அனைவரும்’ என்ற முழுமையையும் காக்கிறது.
- source_word: אֶבְיָתָר הַכֹּהֵן
  choice: ஆசாரியனாகிய அபியத்தார்
  rationale: பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டு, பதவி வழக்கமான வேதாகமத் தமிழில் தெளிவாக மொழிபெயர்க்கப்பட்டது.
- source_word: יֹאָב שַׂר הַצָּבָא
  choice: படைத்தளபதியாகிய யோவாப்
  rationale: שַׂר הַצָּבָא குறிக்கும் இராணுவத் தலைமைப் பொறுப்பைச் சுருக்கமாகவும் நவீனமாகவும் தெரிவிக்கிறது.
- source_word: וְלִשְׁלֹמֹה עַבְדְּךָ לֹא קָרָא
  choice: ஆனால் உமது அடியான் சாலொமோனை அவன் அழைக்கவில்லை
  rationale: முன்னர் அழைக்கப்பட்டவர்களுடனான முரண்பாட்டை ‘ஆனால்’ வெளிப்படுத்துகிறது; ‘உமது அடியான்’ என்பதிலுள்ள மரியாதைமிக்க அரசவைக் குறிப்பும் காக்கப்படுகிறது.
