translation_notes:
  register: நவீனத் தரத் தமிழில், அரசவைக்குரிய மரியாதையை காக்கும் வகையில் ‘உமது அடியான்’ பயன்படுத்தப்பட்டுள்ளது. வாக்கிய ஓட்டம் இயல்பாக இருக்க இரண்டு வாக்கியங்களாக அமைக்கப்பட்டது; எபிரெய மூலத்தின் பட்டியல், எதிர்மறை மாறுபாடு, மற்றும் அழைக்கப்படாத சாலொமோனின் வலியுறுத்தல் காக்கப்பட்டுள்ளன.
