base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/053.yaml
  text: Then King Solomon sent[a], and they brought him down from the altar. And he came and bowed down to King Solomon, and Solomon said to him, “Go to your house.”
translation:
  language: ta
  text: அப்போது சாலொமோன் அரசர் ஆட்களை அனுப்பினார்; அவர்கள் அதோனியாவைப் பலிபீடத்திலிருந்து இறக்கிவிட்டார்கள். அவன் வந்து சாலொமோன் அரசருக்கு முன்பாக வணங்கினான். சாலொமோன் அவனிடம், “உன் வீட்டுக்குப் போ” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: ஆட்களை அனுப்பினார்
  rationale: எபிரெய வினை பொதுவாக ‘அனுப்பினார்’ எனப் பொருள்படும். யாரை அனுப்பினார் என்பது கூறப்படாவிட்டாலும், அடுத்த வாக்கியத்தின் பன்மைச் செயப்பொருள் அரசரால் அனுப்பப்பட்ட ஆட்களைக் குறிக்கிறது; இயல்பான தமிழுக்காக ‘ஆட்களை’ வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: וַיֹּרִדֻהוּ
  choice: அவர்கள் அதோனியாவை ... கீழே அழைத்து வந்தார்கள்
  rationale: காரணப்பொருள் கொண்ட வடிவம், பெயர் குறிப்பிடப்படாத பன்மைச் செய்பவர்கள் அவனை இறங்கச் செய்ததைக் காட்டுகிறது. சூழலிலிருந்து ‘அவன்’ அதோனியா என்பதால் தெளிவுக்காக பெயர் பயன்படுத்தப்பட்டுள்ளது.
- source_word: מֵעַל הַמִּזְבֵּחַ
  choice: பலிபீடத்தருகிலிருந்து
  rationale: מֵעַל என்பதன் அடிப்படை உணர்வு ‘மேலிருந்து/அதன் இடத்திலிருந்து’ என்பதாகும். முந்தைய சூழலில் அதோனியா பலிபீடத்தின் கொம்புகளைப் பற்றியிருந்ததால், அவன் பலிபீடத்தின் மேற்பரப்பில் நின்றான் என்று தவறாக உணர்த்தாமல் இயல்பான தமிழில் ‘பலிபீடத்தருகிலிருந்து’ என வழங்கப்பட்டுள்ளது; நேரடியான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: וַיָּבֹא
  choice: அவன் வந்து
  rationale: בוא என்ற பொதுவான இயக்க வினையின் தொடர்கதைப் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் காக்கிறது.
- source_word: וַיִּשְׁתַּחוּ
  choice: தலைவணங்கினான்
  rationale: இந்த வினை குனிந்து வணங்குதல் அல்லது பணிந்து மரியாதை செலுத்துதலைக் குறிக்கிறது. முழுமையாகத் தரையில் விழுந்தானா என்பதைத் தீர்மானிக்காமல், அரசருக்கு அளித்த பணிவான மரியாதையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לַמֶּלֶךְ שְׁלֹמֹה
  choice: சாலொமோன் அரசருக்கு முன்பாக
  rationale: ל இங்கு வணக்கம் செலுத்தப்பட்ட நபரைக் குறிக்கிறது. தமிழில் ‘அரசருக்கு முன்பாகத் தலைவணங்கினான்’ என்பது தெளிவானதும் இயல்பானதும் ஆகும்.
- source_word: לֵךְ לְבֵיתֶךָ
  choice: உன் வீட்டுக்குப் போ
  rationale: கட்டளையையும் குறிப்பிட்ட இலக்கான ‘உன் வீடு’ என்பதையும் நேரடியாகக் காக்கிறது; ‘வீட்டுக்குப் போ’ என்பதைவிட உரிமைச் சொல்லை விடாமல் வைத்துள்ளது.
