translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் ஆனால் கண்ணியமான வரலாற்று நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. அரசரைக் குறிக்க மரியாதை வினைமுற்றும், அதோனியாவைக் குறிக்க ஒருமை இயல்பு வினைமுற்றும் பயன்படுத்தப்பட்டுள்ளன.
