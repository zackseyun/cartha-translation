base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/034.yaml
  text: There Zadok the priest and Nathan the prophet shall anoint him king over Israel[a], and you shall blow the trumpet and say, ‘Long live King Solomon!’
translation:
  language: ta
  text: அங்கே ஆசாரியரான சாதோக்கும் இறைவாக்கினரான நாத்தானும் அவனை இஸ்ரவேலின்மேல் அரசனாக அபிஷேகம் செய்யுங்கள். பின்னர் நீங்கள் கொம்பை[a] ஊதி, ‘சாலொமோன் அரசர் நீடூழி வாழ்க!’ என்று சொல்லுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ஷோஃபார்; பொது அறிவிப்பு அல்லது சமிக்ஞைக்காக ஊதப்படும் ஒரு கொம்பு. மரபாக இது ‘எக்காளம்’ என்றும் மொழிபெயர்க்கப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָשַׁח
  choice: திருப்பொழிவு செய்யட்டும்
  rationale: அறிவுறுத்தல் தொடரில் வரும் வினை வடிவத்தின் கட்டளைப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது; அரசராக நியமிக்கும் சடங்கையும் குறிக்கிறது.
- source_word: שָׁם
  choice: அங்கே
  rationale: முன்னர் குறிப்பிடப்பட்ட இடத்தைச் சுட்டும் எளிய, இயல்பான இடவினையடை.
- source_word: צָדוֹק הַכֹּהֵן
  choice: ஆசாரியனாகிய சாதோக்கு
  rationale: தனிப்பெயர் ஒலிபெயர்க்கப்பட்டு, பதவிப்பெயர் வழக்கமான வேதாகமத் தமிழில் தரப்பட்டுள்ளது.
- source_word: וְנָתָן הַנָּבִיא
  choice: இறைவாக்கினராகிய நாத்தான்
  rationale: נָבִיא என்பதற்கு நவீன வாசகருக்குப் புரியும், கண்ணியமான ‘இறைவாக்கினர்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: לְמֶלֶךְ עַל יִשְׂרָאֵל
  choice: இஸ்ரவேலின்மேல் அரசனாக
  rationale: לְ பதவியாக நியமிக்கப்படுவதைவும் עַל ஆட்சியதிகாரத்தையும் குறிக்கின்றன; இரண்டையும் தமிழ் சொற்றொடர் காக்கிறது.
- source_word: וּתְקַעְתֶּם בַּשּׁוֹפָר
  choice: நீங்கள் கொம்பை ஊதி
  rationale: שׁוֹפָר என்பது பொதுவாக அறிவிப்புக்கும் அடையாளத்திற்கும் ஊதப்படும் கொம்பு; ‘கொம்பு’ மூலச் சொல்லின் பொருளை நேரடியாகக் காக்கிறது.
- source_word: וַאֲמַרְתֶּם
  choice: என்று சொல்லுங்கள்
  rationale: இரண்டாம் நபர் பன்மைக் கட்டளையைத் தெளிவான நவீன தமிழில் தொடர்கிறது.
- source_word: יְחִי הַמֶּלֶךְ שְׁלֹמֹה
  choice: சாலொமோன் அரசர் நீடூழி வாழ்க!
  rationale: அரசரை வாழ்த்தும் எபிரெயச் சூத்திரத்தின் வேண்டுதல்/வாழ்த்து வலிமையை இயல்பான தமிழ் முழக்கமாக வெளிப்படுத்துகிறது.
