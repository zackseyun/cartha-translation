translation_notes:
  register: நவீன நிலையான தமிழில், அரண்மனைச் செய்தி அறிவிப்பின் மரியாதையான தொனியைப் பேணும் சுருக்கமான நடை. 'அரியணை' என்பது சாதாரண இருக்கையை அல்ல, அரசாட்சியின் அதிகார இருக்கையைத் தெளிவுபடுத்துகிறது.
