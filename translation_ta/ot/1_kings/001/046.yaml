  text: And Solomon has also sat on the royal throne.
translation:
  language: ta
  text: மேலும் சாலொமோன் அரச அரியணையில் அமர்ந்துவிட்டார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְגַם
  choice: மேலும்
  rationale: முந்தைய செய்தியுடன் இன்னொரு முக்கிய நிகழ்வைச் சேர்க்கும் இணைப்புத் தொடரை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יָשַׁב
  choice: அமர்ந்துவிட்டார்
  rationale: எபிரெய நிறைவுற்ற வினையை, இப்போது நிகழ்ந்துவிட்ட சம்பவமாக அறிவிக்கும் இச்சூழலில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: כִּסֵּא הַמְּלוּכָה
  choice: அரச அரியணை
  rationale: சொல்லுக்கு சொல் 'அரசாட்சியின் அரியணை' என்பதற்குப் பதிலாக, அரச அதிகாரத்திற்குரிய அரியணை என்ற பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
