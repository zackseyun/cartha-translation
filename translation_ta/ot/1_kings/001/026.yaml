base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/026.yaml
  text: But me—your servant—and Zadok the priest[a], and Benaiah son of Jehoiada, and Solomon your servant, he did not call.
translation:
  language: ta
  text: ஆனால், உமது அடியேனாகிய என்னையும், ஆசாரியனான சாதோக்கையும், யோயாதாவின் மகன் பெனாயாவையும், உமது ஊழியனான சாலொமோனையும் அவன் அழைக்கவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவன் வரவழைக்கவில்லை” அல்லது “அவன் விருந்துக்கு அழைக்கவில்லை.” இங்குள்ள எபிரெய வினைச்சொல் அழைத்தல், வரவழைத்தல், அல்லது அழைப்பு விடுத்தல் என்பதைக் குறிக்கலாம்; அதோனியா நடத்திய பலி விருந்தின் சூழலில், “விருந்துக்கு அழைத்தல்” என்பதும் பொருந்தும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִי אֲנִי עַבְדֶּךָ
  choice: ஆனால், உமது அடியேனாகிய என்னையும்
  rationale: முன்னர் அழைக்கப்பட்டவர்களுடன் உள்ள முரண்பாட்டை וְ இங்கு உணர்த்துகிறது; முன்னிலைப்படுத்தப்பட்ட לִי மற்றும் אֲנִי ஆகியவற்றின் வலியுறுத்தலை இயல்பான தமிழில் காக்கிறது. ‘அடியேன்’ அரசரிடம் பேசும் பணிவான அரண்மனை மொழிநடையை வெளிப்படுத்துகிறது.
- source_word: צָדֹק הַכֹּהֵן
  choice: ஆசாரியனான சாதோக்கையும்
  rationale: தனிப்பெயரையும் திட்டவட்டமான பதவிப்பெயரையும் இயல்பான தமிழில் வழங்குகிறது.
- source_word: בְנָיָהוּ בֶן יְהוֹיָדָע
  choice: யோய்தாவின் மகன் பெனாயாவையும்
  rationale: எபிரெயத் தந்தைவழி அடையாளத்தைத் தெளிவான, வழக்கமான தமிழ் அமைப்பில் தருகிறது.
- source_word: שְׁלֹמֹה עַבְדְּךָ
  choice: உமது அடியவனான சாலொமோனையும்
  rationale: சாலொமோனுக்கும் அரசருக்கும் இடையிலான பணிவுக்குரிய உறவை மீண்டும் வரும் עַבְדְּךָ என்பதற்கேற்ப காக்கிறது.
- source_word: לֹא קָרָא
  choice: அவன் அழைக்கவில்லை
  rationale: קרא என்பது அழைத்தல், வரவழைத்தல் அல்லது விருந்துக்கு அழைத்தல் ஆகிய பொருள்களைக் கொள்ளலாம். ‘அழைக்கவில்லை’ உடனடிச் சூழலுக்கும் சொற்பொருள் அகலத்திற்கும் ஏற்றது.
