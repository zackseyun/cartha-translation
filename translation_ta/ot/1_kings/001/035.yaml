  text: וַ/עֲלִיתֶ֣ם אַחֲרָ֗י/ו וּ/בָא֙ וְ/יָשַׁ֣ב עַל כִּסְאִ֔/י וְ/ה֥וּא יִמְלֹ֖ךְ תַּחְתָּ֑/י וְ/אֹת֤/וֹ צִוִּ֨יתִי֙ לִֽ/הְי֣וֹת נָגִ֔יד עַל יִשְׂרָאֵ֖ל וְ/עַל יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/035.yaml
  text: Then you shall go up after him[a], and he shall come and sit on my throne, and he shall reign in my place; and I have appointed him to be ruler over Israel and over Judah.
translation:
  language: ta
  text: பின்பு நீங்கள் அவனுக்குப் பின்னால் ஏறிச் செல்லுங்கள்; அவன் வந்து என் அரியணையில் அமர்வான். அவன் எனக்குப் பதிலாக அரசாள்வான். இஸ்ரவேலின்மேலும் யூதாவின்மேலும் ஆட்சியாளனாக இருக்கும்படி அவனை நியமித்திருக்கிறேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்ரவேலின்மேலும் யூதாவின்மேலும் தலைவனாக (அல்லது, அதிபதியாக) இருக்கும்படி அவனைக் கட்டளையிட்டிருக்கிறேன்.” எபிரெய வினைச்சொல் பொதுவாக “கட்டளையிடு” என்றும், נָגִיד என்பது “தலைவன்” அல்லது “அதிபதி” என்றும் பொருள்படலாம்.
    reason: צִוִּיתִי மற்றும் נָגִיד ஆகியவற்றின் உண்மையான சொற்பொருள் மாற்றுகளைப் பாதுகாக்கிறது; மாற்று வாசகத்தில் எபிரெய நேரடிப் பொருளும் வினைத் தொடரும் தெளிவாகப் பிரதிபலிக்கப்படுகின்றன.
lexical_decisions:
- source_word: וַעֲלִיתֶם
  choice: நீங்கள் ஏறிச் செல்லுங்கள்
  rationale: עלה என்பதன் அடிப்படை திசைப் பொருளான ‘மேலே செல்லுதல்/ஏறிச் செல்லுதல்’ என்பதைக் காக்கிறது. கட்டளைகளின் தொடரில் வரும் வடிவம் என்பதால் தமிழில் இயல்பான கட்டளை வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: אַחֲרָיו
  choice: அவனுக்குப் பின்னால்
  rationale: அரச ஊர்வலத்தில் அவனைப் பின்தொடர்வதைக் குறிக்கிறது; ‘பின்னால்’ என்பது இடம் மற்றும் ஊர்வல வரிசை ஆகிய இரண்டையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וּבָא
  choice: அவன் வந்து
  rationale: בוא என்பதன் பரந்த பொருள் ‘வருதல்/உள்ளே செல்லுதல்.’ அடுத்த வினை அரியணையில் அமர்வதைத் தெளிவுபடுத்துவதால், அதிக விளக்கமின்றி ‘வந்து’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְיָשַׁב עַל כִּסְאִי
  choice: என் அரியணையில் அமர்வான்
  rationale: இது அரியணை ஏறுதலைக் குறிக்கும் வழக்கமான அரச மரபுச் சொற்றொடர். ‘அரியணையில் அமர்வான்’ என்பது நவீன தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது.
- source_word: וְהוּא יִמְלֹךְ תַּחְתָּי
  choice: அவன் எனக்குப் பதிலாக அரசாள்வான்
  rationale: תַּחְתָּי இங்கு அரச பதவியில் மாற்றாக வருதலைக் குறிக்கிறது. ‘எனக்குப் பதிலாக’ என்பது வெறும் காலவரிசையான ‘எனக்குப் பின்பு’ என்பதைவிட இந்தப் பதவி மாற்றத்தைத் துல்லியமாகக் காட்டுகிறது.
- source_word: צִוִּיתִי
  choice: நியமித்திருக்கிறேன்
  rationale: צוה பொதுவாக ‘கட்டளையிடு’ என்று பொருள்பட்டாலும், இச்சூழலில் சாலொமோனை ஓர் ஆட்சிப் பொறுப்புக்கு அதிகாரபூர்வமாகத் தேர்ந்தெடுக்கும் செயல்பாட்டுப் பொருள் உள்ளது. அடிப்படைச் சொற்பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: לִהְיוֹת נָגִיד
  choice: ஆட்சியாளனாக இருக்கும்படி
  rationale: נָגִיד என்பது மக்கள்மேல் நியமிக்கப்பட்ட தலைவர், அதிபதி அல்லது ஆட்சியாளரைக் குறிக்கலாம். ‘ஆட்சியாளன்’ என்பது அரச அதிகாரத்தைத் தெளிவாகக் காட்டுகிறது; அதேவேளையில் מלך என்பதற்குப் பயன்படுத்தப்பட்ட ‘அரசாள்’ என்ற சொல்லோடு இதை ஒன்றாக்கவில்லை.
- source_word: עַל יִשְׂרָאֵל וְעַל יְהוּדָה
  choice: இஸ்ரவேலின்மேலும் யூதாவின்மேலும்
  rationale: எபிரெயத்தில் עַל இருமுறை வருவதைப் போல, இரு மக்கள்/அரசியல் பிரிவுகள்மேலும் உள்ள அதிகாரம் தமிழிலும் தனித்தனியாகக் குறிக்கப்பட்டுள்ளது.
theological_decisions:
- issue: מלך மற்றும் נָגִיד ஆகிய இரு அரசப் பதவிசார் சொற்களுக்கிடையிலான வேறுபாடு
  choice: מלך என்பதற்கு ‘அரசாள்வான்’ என்றும் נָגִיד என்பதற்கு ‘ஆட்சியாளன்’ என்றும் வேறுபடுத்தி மொழிபெயர்க்கப்பட்டது.
  alternative: נָגִיד என்பதற்கு ‘தலைவன்’ அல்லது ‘அதிபதி’ என்று மொழிபெயர்க்கலாம்.
  rationale: மூல வசனம் அரசாளுதலையும் நியமிக்கப்பட்ட தலைமைப் பொறுப்பையும் இரு வேறு சொற்களால் குறிப்பிடுகிறது. அவற்றை ஒரே சொல்லாக மாற்றாமல் வேறுபாட்டைக் காப்பது அரச அதிகாரத்தின் நுணுக்கத்தைப் பாதுகாக்கிறது; எந்தக் குறிப்பிட்ட சமயக் கோட்பாட்டையும் இதில் புகுத்தவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான அரச மரபு நடையில் வடிவமைக்கப்பட்டது. ‘அரியணை,’ ‘அரசாள்வான்,’ ‘ஆட்சியாளன்’ ஆகியவை மூலத்தின் அரசியல் சொற்களுக்கிடையிலான வேறுபாட்டைக் காக்கின்றன; வாக்கியங்கள் வாசிப்புத் தெளிவுக்காக இயல்பான தமிழ்த் தொடராகப் பிரிக்கப்பட்டுள்ளன.
