translation_notes:
  register: நவீன தரத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. ‘அரசர்’ என்பது அரசவைக் காட்சிக்கு ஏற்ற மரியாதைமிக்க பொதுவழக்கு; ‘பணிவிடை செய்துகொண்டிருந்தாள்’ என்பது திருச்சபைச் சார்ந்த நுண்பொருளைச் சேர்க்காமல் தொடர்ச்சியான சேவையை வெளிப்படுத்துகிறது. முதன்மை உரையில் உள்ள [a] குறி அறை மற்றும் அரசரை நோக்கிய இயக்கத்தின் எபிரேயச் சொற்றொடரமைப்புக்கான மாற்று மொழியாக்கத்தைச் சுட்டுகிறது.
