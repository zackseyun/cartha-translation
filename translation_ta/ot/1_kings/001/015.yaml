base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/015.yaml
  text: So Bathsheba went in to the king in the chamber[a]. Now the king was very old[b], and Abishag the Shunammite was attending the king.
translation:
  language: ta
  text: பத்சேபாள் அரசரிடம், அவர் இருந்த அறைக்குள் சென்றாள்.[a] அரசர் மிகவும் முதியவராக இருந்தார்; சூனேமைச் சேர்ந்த அபிசாக் அரசருக்குப் பணிவிடை செய்து கொண்டிருந்தாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பத்சேபாள் அரசர் இருந்த அறைக்குள் நுழைந்தாள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹא
  choice: சென்று ... வந்தாள்
  rationale: בוא என்பதன் இயக்கப் பொருளையும் தொடர்கதைச் செயலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது; பத்சேபாள் அரசரின் தனியறைக்குள் நுழைந்து அவரிடம் சென்றதைச் சூழல் தெளிவாக்குகிறது.
- source_word: בַת שֶׁבַע
  choice: பத்சேபாள்
  rationale: எபிரேயத் தனிப்பெயரின் தமிழில் நிலைபெற்ற வடிவம்.
- source_word: אֶל הַמֶּלֶךְ הַחַדְרָה
  choice: அரசர் இருந்த அறைக்குள் சென்று அவரிடம்
  rationale: אֶל குறிக்கும் அரசரை நோக்கிய இயக்கத்தையும், திசைச் சுட்டு ה உடைய חֶדֶר குறிக்கும் அறைக்குள் நுழைதலையும் இயல்பான தமிழில் ஒருங்கிணைக்கிறது.
- source_word: וְהַמֶּלֶךְ זָקֵן מְאֹד
  choice: அரசர் மிகவும் முதிர்ந்த வயதுடையவராக இருந்தார்
  rationale: பின்னணித் தகவலாக வரும் வாக்கியத்தைத் தெளிவாகக் காட்டுகிறது; זָקֵן מְאֹד என்பதன் தீவிரத்தையும் மதிப்பான நவீன தமிழில் காக்கிறது.
- source_word: וַאֲבִישַׁג הַשּׁוּנַמִּית
  choice: சூனேமைச் சேர்ந்த அபிசாக்
  rationale: பெண்பால் ஊர்ப்பெயர் அடைமொழியான הַשּׁוּנַמִּית என்பதை தமிழில் இயல்பாக ‘சூனேமைச் சேர்ந்த’ என்று மொழிபெயர்த்து, பெயரை ஒலிபெயர்க்கிறது.
- source_word: מְשָׁרַת
  choice: பணிவிடை செய்துகொண்டிருந்தாள்
  rationale: நிகழ்ந்துகொண்டிருந்த தொடர்ச்சியான சேவையைப் பங்கேற்புவினை வடிவம் குறிக்கிறது; முதிய அரசரைப் பராமரித்து சேவித்த அரண்மனைச் சூழலுக்கு இச்சொற்றொடர் பொருந்துகிறது.
- source_word: אֶת הַמֶּלֶךְ
  choice: அரசருக்கு
  rationale: ישרת என்ற சேவை வினையுடன் தமிழில் இயல்பாக வரும் நான்காம் வேற்றுமை வடிவம்.
