revisions:
- from: பத்சேபாள் அரசர் இருந்த அறைக்குள் சென்று அவரிடம் வந்தாள்.[a] அரசர் மிகவும் முதிர்ந்த வயதுடையவராக இருந்தார்; சூனேமைச் சேர்ந்த அபிசாக் அரசருக்குப் பணிவிடை செய்துகொண்டிருந்தாள்.
  to: பத்சேபாள் அரசரிடம், அவர் இருந்த அறைக்குள் சென்றாள்.[a] அரசர் மிகவும் முதியவராக இருந்தார்; சூனேமைச் சேர்ந்த அபிசாக் அரசருக்குப் பணிவிடை செய்து கொண்டிருந்தாள்.
