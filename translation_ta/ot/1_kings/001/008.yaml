base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/008.yaml
  text: But Zadok the priest[a], Benaiah son of Jehoiada, Nathan the prophet, Shimei, Rei, and the mighty men who belonged to David were not with Adonijah.
translation:
  language: ta
  text: ஆனால் சாதோக் என்னும் ஆசாரியரும், யோய்தாவின் மகன் பெனாயாவும், நாத்தான் என்னும் தீர்க்கதரிசியும், சிமேயியும், ரேயியும், தாவீதுக்குரிய வலிமைமிக்க வீரர்களும்[a] அதோனியாவுடன் இருக்கவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'நேரடி பொருள்: “தாவீதுக்குரிய வலிமைமிக்கவர்கள்.” இது தாவீதின் சிறப்புப் படைவீரர்களைக் குறிக்கலாம்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/צָדוֹק הַכֹּהֵן
  choice: ஆனால் சாதோக் என்னும் ஆசாரியரும்
  rationale: முன்வசனத்தில் அதோனியாவை ஆதரித்தவர்களின் பட்டியலுக்கு மாறான குழுவை இவ்வசனம் குறிப்பிடுவதால், וְ என்பதன் சூழல்சார் எதிர்மறைத் தொடர்பை ‘ஆனால்’ இயல்பாக வெளிப்படுத்துகிறது. הַכֹּהֵן என்பது சாதோக்கின் பணியை அடையாளப்படுத்தும் இணைப்புப் பட்டம்.
- source_word: וּ/בְנָיָהוּ בֶן יְהוֹיָדָע
  choice: யோய்தாவின் மகன் பெனாயாவும்
  rationale: எபிரெயப் பெயர்களும் தந்தை-மகன் உறவும் தெளிவாகப் பாதுகாக்கப்படுகின்றன; தமிழின் இயல்பான உறவுமுறை வரிசை பயன்படுத்தப்படுகிறது.
- source_word: וְ/נָתָן הַנָּבִיא
  choice: நாத்தான் என்னும் தீர்க்கதரிசியும்
  rationale: הַנָּבִיא நாத்தானின் பணியை அடையாளப்படுத்தும் பட்டம்; ‘என்னும்’ தமிழில் பெயருடன் பட்டத்தை இயல்பாக இணைக்கிறது.
- source_word: וְ/שִׁמְעִי וְ/רֵעִי
  choice: சிமேயியும், ரேயியும்
  rationale: இரண்டும் தனிப்பட்ட பெயர்களாக ஒலிபெயர்க்கப்பட்டு, எபிரெயப் பட்டியலின் இணைப்பு அமைப்பு தமிழில் இயல்பாகத் தக்கவைக்கப்படுகிறது.
- source_word: וְ/הַגִּבּוֹרִים אֲשֶׁר לְ/דָוִד
  choice: தாவீதுக்குரிய வலிமைமிக்க வீரர்களும்
  rationale: גִּבּוֹרִים என்பது வலிமை அல்லது போர்த்திறனுக்குப் பெயர்பெற்ற வீரர்களைக் குறிக்கிறது. אֲשֶׁר לְדָוִד என்ற உறவுநிலையை ‘தாவீதுக்குரிய’ என்று சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது; உரிமை, சேவை, அல்லது அணிச் சார்பு ஆகியவற்றில் ஒன்றை மட்டும் தேவையின்றி நிர்ணயிக்கவில்லை.
- source_word: לֹא הָיוּ עִם אֲדֹנִיָּהוּ
  choice: அதோனியாவுடன் இருக்கவில்லை
  rationale: எபிரெயத்தின் எளிய ‘உடன் இருக்கவில்லை’ என்ற மொழியைப் பாதுகாக்கிறது. சூழலில் இது அரசியல் ஆதரவின்மையைக் குறித்தாலும், ‘ஆதரிக்கவில்லை’ என்று விளக்கமாக மாற்றாமல் மூலத்தின் கட்டுப்பாடு தக்கவைக்கப்படுகிறது.
