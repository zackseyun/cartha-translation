translation_notes:
  register: நவீனத் தரத் தமிழ்; மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட நடை. ‘ஆசாரியர்’, ‘தீர்க்கதரிசி’ ஆகிய பரவலாக அறியப்பட்ட வேதாகமப் பதவிச் சொற்கள் பயன்படுத்தப்பட்டுள்ளன. பட்டியலில் மரியாதைப் பன்மை விகுதிகள் ஒருமையாகப் பேணப்பட்டு, இறுதி வினை பன்மையில் அமைக்கப்பட்டுள்ளது.
