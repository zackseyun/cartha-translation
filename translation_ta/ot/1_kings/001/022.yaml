  yaml_path: translation/ot/1_kings/001/022.yaml
  text: And behold[a], while she was still speaking with the king, Nathan the prophet came in.
translation:
  language: ta
  text: இதோ[a], அவள் இன்னும் அரசருடன் பேசிக்கொண்டிருந்தபோதே, தீர்க்கதரிசி நாத்தான் உள்ளே வந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பாருங்கள்”; காட்சியில் திடீரென ஏற்படும் புதிய திருப்பத்திற்குக் கவனம் ஈர்க்கும் எபிரெய உரையாடல் அடையாளம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: காட்சியில் திடீரென நிகழும் புதிய திருப்பத்திற்குக் கவனம் ஈர்க்கும் எபிரெய உரையாடல் அடையாளத்தை இயல்பான, சுருக்கமான தமிழில் தக்கவைக்கிறது.
- source_word: עוֹדֶנָּה מְדַבֶּרֶת
  choice: அவள் இன்னும் … பேசிக்கொண்டிருந்தபோதே
  rationale: பெண்பால் பின்னொட்டும் தொடர்ச்சியான செயலைக் குறிக்கும் பங்கேற்புவினையும் காட்டும் கால ஒத்திசைவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: עִם הַמֶּלֶךְ
  choice: அரசருடன்
  rationale: עִם என்பதன் அடிப்படைப் பொருளான ‘உடன்’ என்பதைப் பாதுகாத்து, நேரடியான அரசவைக் கலந்துரையாடலை உணர்த்துகிறது.
- source_word: וְנָתָן
  choice: நாத்தான்
  rationale: எபிரெயத் தனிப்பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: הַנָּבִיא
  choice: தீர்க்கதரிசி
  rationale: நாத்தானின் பங்கை அடையாளப்படுத்தும் נָבִיא என்பதற்குப் பொதுவாகப் புரிந்துகொள்ளப்படும் தமிழ் வேதாகமச் சொல்.
- source_word: בָּא
  choice: உள்ளே வந்தார்
  rationale: அரசரைச் சந்திக்கும் அறைக்குள் அல்லது அரசவைக்குள் அவர் வந்தார் என்பதைச் சூழலுக்கேற்ற இயல்பான தமிழில் தெரிவிக்கிறது.
