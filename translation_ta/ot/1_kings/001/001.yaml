  yaml_path: translation/ot/1_kings/001/001.yaml
  text: King David was old[a], advanced in days; and they covered him with garments, but he could not get warm.
translation:
  language: ta
  text: தாவீது ராஜா முதியவராகவும், வயதில் மிகவும் முதிர்ந்தவராகவும் இருந்தார்[a]. அவரை ஆடைகளால் போர்த்தினார்கள்; ஆனால் அவருக்கு வெப்பம் வரவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில், “நாட்களில் வந்தவர்” என்பது சொல்லுக்குச் சொல் மொழிபெயர்ப்பு; இது மிகவும் முதிர்ந்த வயதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַ/מֶּלֶךְ דָּוִד
  choice: தாவீது ராஜா
  rationale: மֶלֶךְ என்பதன் நேரடிப் பொருளான ‘ராஜா’வை இயற்பெயருடன் இயல்பான தமிழ் வரிசையில் அமைத்துள்ளது. தொடக்க וְ தனியான காலச்சுட்டுச் சொல்லாக மொழிபெயர்க்கப்படவில்லை.
- source_word: זָקֵן
  choice: முதுமையடைந்து
  rationale: தாவீது முதியவராக இருந்தார் என்ற எளிய பொருளை இயல்பான தமிழில் தருகிறது; அடுத்துவரும் வயது முதிர்வைக் குறிக்கும் மரபுத்தொடருடனான வேறுபாடும் காக்கப்படுகிறது.
- source_word: בָּא בַּ/יָּמִים
  choice: வயது மிகவும் முதிர்ந்திருந்தார்[a]
  rationale: சொல்லுக்குச் சொல் ‘நாட்களில் வந்தவர்’ எனும் எபிரெய மரபுத்தொடர் மிகவும் முன்னேறிய வயதைக் குறிக்கிறது. தமிழ் வாசகருக்குப் பொருள் தெளிவாக இருக்க இயக்கநிகராக்கம் செய்யப்பட்டு, மூல உருவகம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: וַ/יְכַסֻּהוּ
  choice: அவரை ... போர்த்தினார்கள்
  rationale: வினையின் பெயரிடப்படாத பன்மை எழுவாயைத் தமிழிலும் பெயரிடாமல் காக்கிறது.
- source_word: בַּ/בְּגָדִים
  choice: ஆடைகளால்
  rationale: בְּגָדִים என்பதன் வழக்கமான பொருள் ஆடைகள்; ‘போர்வைகள்’ என்பது மூலத்தில் இல்லாத விளக்கத்தைச் சேர்க்கும் என்பதால் தவிர்க்கப்பட்டது.
- source_word: וְ/לֹא יִחַם ל/וֹ
  choice: ஆனால் அவருக்கு வெப்பம் உண்டாகவில்லை
  rationale: חם இங்கு வெப்பமடைதலைக் குறிக்கிறது. לֹא ... לוֹ அமைப்பை இயல்பான தமிழில் தருவதோடு, முந்தைய முயற்சி பலனளிக்காத எதிர்மறை முடிவை ‘ஆனால்’ தெளிவாக்குகிறது.
