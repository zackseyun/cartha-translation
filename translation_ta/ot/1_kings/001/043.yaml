  text: Jonathan answered and said to Adonijah[a], “On the contrary, our lord King David has made Solomon king.”
translation:
  language: ta
  text: 'யோனத்தான் அதோனியாவுக்குப் பதிலளித்துச் சொன்னான்: “மாறாக, நம் ஆண்டவரான தாவீது ராஜா சாலொமோனை ராஜாவாக்கியிருக்கிறார்.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן וַיֹּאמֶר
  choice: பதிலளித்துச் சொன்னான்
  rationale: எபிரெய மொழியின் இரட்டை உரையாடல் அறிமுகத்தையும் இயல்பான தமிழில் காக்கிறது.
- source_word: לַאֲדֹנִיָּהוּ
  choice: அதோனியாவுக்கு
  rationale: ל முன்னொட்டைத் தமிழின் நான்காம் வேற்றுமையால் தெரிவித்து, பெயரை ஒலிபெயர்க்கிறது.
- source_word: אֲבָל
  choice: மாறாக
  rationale: இங்கு அதோனியாவின் எதிர்பார்ப்பைத் திருத்தும் வலுவான முரண்பாட்டைக் குறிக்கிறது; வெறும் ‘ஆனால்’ என்பதைவிடச் சூழலுக்குப் பொருத்தமானது.
- source_word: אֲדֹנֵינוּ הַמֶּלֶךְ דָּוִד
  choice: நம் ஆண்டவராகிய தாவீது ராஜா
  rationale: அரசவைக் சூழலிலுள்ள மரியாதைத் தலைப்பையும் தாவீதின் அரசப் பதவியையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הִמְלִיךְ אֶת שְׁלֹמֹה
  choice: சாலொமோனை ராஜாவாக்கியிருக்கிறார்
  rationale: מלך என்பதன் ஹிஃபில் வடிவிலுள்ள ‘ஒருவரை ராஜாவாக ஏற்படுத்துதல்’ என்ற காரணவினைப் பொருளைத் துல்லியமாகக் காக்கிறது; ‘அபிஷேகம் செய்தார்’ என்று தேவையற்ற குறிப்பைச் சேர்ப்பதில்லை.
