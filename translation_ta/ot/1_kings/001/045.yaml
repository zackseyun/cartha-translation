base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/045.yaml
  text: And Zadok the priest and Nathan the prophet have anointed him king at Gihon[a], and they have come up from there rejoicing, and the city is in an uproar. That is the sound that you heard.
translation:
  language: ta
  text: ஆசாரியனாகிய சாதோக்கும் தீர்க்கதரிசியாகிய நாத்தானும் கீகோனில் அவனை அரசனாக அபிஷேகம் செய்தார்கள். அவர்கள் அங்கிருந்து மகிழ்ச்சியுடன் மேலே வந்தார்கள்; நகரம் முழுவதும் ஆரவாரம் எழுந்தது.[a] நீங்கள் கேட்ட ஓசை அதுதான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நகரம் முழுவதும் அதிர்ந்தது” அல்லது “நகரம் பரபரப்புக்குள்ளானது”; எபிரெய வினைச்சொல் இரைச்சலோடு கூடிய கலக்கத்தையும் பரபரப்பையும் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְשְׁחוּ אֹתוֹ
  choice: அவனை ... திருப்பொழிவு செய்தார்கள்
  rationale: מָשַׁח என்பது அரச பதவிக்காக எண்ணெய் ஊற்றி நியமிப்பதைக் குறிக்கிறது. தமிழில் வேதாகமச் சூழலுக்கு ஏற்ற, புரிந்துகொள்ளக்கூடிய மரபுச் சொலாக ‘திருப்பொழிவு செய்தார்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: צָדוֹק הַכֹּהֵן
  choice: குருவாகிய சாதோக்கு
  rationale: தனிப்பெயர் ஒலிபெயர்க்கப்பட்டு, כֹּהֵן என்பதற்கு இயல்பான நவீனத் தமிழில் ‘குரு’ பயன்படுத்தப்பட்டது.
- source_word: נָתָן הַנָּבִיא
  choice: இறைவாக்கினராகிய நாத்தான்
  rationale: נָבִיא என்பதன் வழக்கமான பொருளான கடவுளின் செய்தியை உரைப்பவர் என்பதை ‘இறைவாக்கினர்’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: לְמֶלֶךְ
  choice: அரசனாக
  rationale: லாமேத் முன்னொட்டு இங்கு அவன் நியமிக்கப்பட்ட பதவியைச் சுட்டுவதால் ‘அரசனாக’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: בְּגִחוֹן
  choice: கீகோனில்
  rationale: இடப்பெயர் ஒலிபெயர்க்கப்பட்டு, நிகழ்வு நடந்த இடத்தைக் குறிக்க ‘-இல்’ பயன்படுத்தப்பட்டது.
- source_word: וַיַּעֲלוּ מִשָּׁם
  choice: அவர்கள் அங்கிருந்து ... மேலே வந்தார்கள்
  rationale: עָלָה என்பதன் மேல்நோக்கிய நகர்வை ‘மேலே வந்தார்கள்’ காக்கிறது; பேச்சாளரின் நகரத்தை நோக்கிய பார்வையும் வெளிப்படுகிறது.
- source_word: שְׂמֵחִים
  choice: மகிழ்ச்சியோடு
  rationale: அவர்கள் வந்த விதத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וַתֵּהֹם הַקִּרְיָה
  choice: நகரமே பேரொலி எழுப்பியது
  rationale: הום குறிக்கும் இரைச்சலான பரபரப்பைத் தொடர்ந்து வரும் ‘ஓசை’ என்பதோடு இணைத்து வெளிப்படுத்துகிறது; ‘நகரமே’ அந்த ஒட்டுமொத்த விளைவை வலியுறுத்துகிறது.
- source_word: הוּא הַקּוֹל אֲשֶׁר שְׁמַעְתֶּם
  choice: நீங்கள் கேட்ட ஓசை அதுதான்
  rationale: הוּא-வின் சுட்டுப் பயன்பாட்டையும் קוֹל என்பதன் பரந்த ‘ஓசை’ பொருளையும் இயல்பான தமிழ் சொல்வரிசையில் காக்கிறது.
