  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. தொடர் வாவ் வினை வடிவங்கள் தமிழ் நிகழ்வுவரிசைக்கேற்ப இறந்தகாலத்தில் தரப்பட்டுள்ளன; எபிரெயச் சொல்லின் ஒலியும் பரபரப்பும் கலந்த பொருள் முதன்மை உரையிலும் அடிக்குறிப்பிலும் பாதுகாக்கப்பட்டுள்ளது.
