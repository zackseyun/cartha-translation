base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/007.yaml
  text: And he conferred with Joab son of Zeruiah and with Abiathar the priest[a], and they helped Adonijah.
translation:
  language: ta
  text: அவன் செருயாவின் மகன் யோவாபோடும் ஆசாரியனாகிய அபியத்தாரோடும் ஆலோசனை செய்தான். அவர்கள் அதோனியாவுக்கு ஆதரவளித்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “அதோனியாவுக்குப் பின்னால் அவர்கள் உதவினார்கள்”; அதாவது, அவர்கள் அவரைப் பின்பற்றி ஆதரித்தார்கள்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דְבָרָיו עִם
  choice: ஆலோசனை செய்தான்
  rationale: ‘அவனுடைய வார்த்தைகள் ... உடன் இருந்தன’ என்ற எபிரெயச் சொற்றொடர் இச்சூழலில் கலந்துபேசுதல் அல்லது ஆலோசனை செய்தலைக் குறிக்கிறது. இயல்பான நவீனத் தமிழில் அதன் கருத்தைத் தெளிவாகத் தருகிறது.
- source_word: בֶּן צְרוּיָה
  choice: செருயாவின் மகன்
  rationale: வம்ச உறவை நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: הַכֹּהֵן
  choice: ஆசாரியனாகிய
  rationale: அபியத்தாரின் பதவியைத் திட்டவட்டமாகக் குறிக்கும் எபிரெயச் சொல்லின் பொருளைத் தருகிறது.
- source_word: וַיַּעְזְרוּ אַחֲרֵי
  choice: ஆதரவளித்தார்கள்
  rationale: עזר என்பது உதவுதல் அல்லது ஆதரித்தலைக் குறிக்கும்; אַחֲרֵי என்பதுடன் சேர்ந்த இச்சூழலில் அதோனியாவைப் பின்பற்றி அவரது தரப்பை ஆதரித்தார்கள் என்ற அரசியல் பொருள் இயல்பாக அமைகிறது. சொல்லுக்குச் சொல் வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: אֲדֹנִיָּה
  choice: அதோனியா
  rationale: தனிப்பெயர் நவீனத் தமிழில் வாசிக்க ஏற்ற ஒலிபெயர்ப்பாக வழங்கப்பட்டுள்ளது.
