  text: Look[a], while you are still speaking there with the king, I will come in after you and confirm your words.
translation:
  language: ta
  text: இதோ, நீ இன்னும் அங்கே அரசருடன் பேசிக்கொண்டிருக்கும்போதே, நான் உனக்குப் பிறகு உள்ளே வந்து, நீ சொல்வதை உறுதிப்படுத்துவேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீ சொல்வதை நிறைவுசெய்வேன்,” அல்லது “நீ சொல்வதற்குக் கூடுதல் விவரம் சேர்ப்பேன்.” இந்த எபிரெய மரபுத்தொடர், ஒருவரின் கூற்றை ஆதரிக்கும் விவரங்களைச் சேர்ப்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: இதோ
  rationale: திட்டத்தின் உடனடி நிகழ்வை நோக்கிக் கவனத்தை ஈர்க்கும் சுட்டிடைச்சொல்லை இயல்பாகவும் கண்ணியமாகவும் வெளிப்படுத்துகிறது.
- source_word: עוֹדָךְ מְדַבֶּרֶת
  choice: நீ இன்னும் ... பேசிக்கொண்டிருக்கும்போதே
  rationale: இரண்டாம் நபர் பெண்பால் ஒருமை பின்னொட்டுடன் வரும் தொடர்ச்சியான செயலைத் தமிழில் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: שָׁם עִם הַמֶּלֶךְ
  choice: அங்கே அரசருடன்
  rationale: இடத்தைக் குறிக்கும் שָׁם என்பதையும், עִם என்பதன் அடிப்படை ‘உடன்’ பொருளையும் தக்கவைக்கிறது.
- source_word: וַאֲנִי אָבוֹא אַחֲרַיִךְ
  choice: நான் உனக்குப் பின்னால் உள்ளே வந்து
  rationale: அரசரின் முன்னிலைக்குள் நாத்தான் நுழைவதைச் சூழல் உணர்த்துவதால், בוא என்பதன் இயக்கத்தை ‘உள்ளே வந்து’ என இயல்பாக வெளிப்படுத்துகிறது; אַחֲרַיִךְ என்பதையும் தக்கவைக்கிறது.
- source_word: וּמִלֵּאתִי אֶת דְּבָרָיִךְ
  choice: நீ சொல்வதை உறுதிப்படுத்துவேன்
  rationale: ஒருவரின் கூற்றுக்கு ஆதரவான விவரத்தைச் சேர்த்து அதை நிறைவு செய்யும் அல்லது உறுதிப்படுத்தும் எபிரெய மரபுத்தொடரின் இச்சூழலுக்குரிய நடைமுறைப் பொருளைத் தருகிறது.
