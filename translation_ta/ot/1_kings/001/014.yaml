translation_notes:
  register: நவீன நிலையான தமிழில், அரசவைக் காட்சிக்கேற்ற கண்ணியமான ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் பெண்பால் ஒருமை தமிழ் வினைவடிவத்தில் வெளிப்படாததால், சூழலால் அறியப்படுகிறது.
