base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/031.yaml
  text: Then Bathsheba bowed with her face to the ground and prostrated herself before the king[a], and said, “May my lord King David live forever.”
translation:
  language: ta
  text: அப்போது பத்சேபாள் முகம் தரையில் படும்படி குனிந்து, அரசர்முன் விழுந்து வணங்கி, “என் ஆண்டவராகிய தாவீது அரசர் என்றென்றும் வாழ்வாராக!”[a] என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இயல்பான வாழ்த்துத் தொடராக, “என் ஆண்டவராகிய தாவீது அரசர் என்றென்றும் வாழ்க!”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקֹּד
  choice: குனிந்து
  rationale: קָדַד என்பது உடலைத் தாழ்த்திக் குனிவதைக் குறிக்கிறது. அடுத்துவரும் வணக்கச் செயலைத் தனியாக வைத்துக்கொண்டே இயல்பான தமிழில் இவ்வாறு மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: אַפַּיִם אֶרֶץ
  choice: முகம் தரையில் படும்படி
  rationale: ‘முகம்/மூக்கு—தரை’ என்ற எபிரேய மரபுத்தொடர் ஆழமாகத் தாழ்ந்து பணிவதைக் காட்டுகிறது; அதன் உடல்சார்ந்த படிமத்தைத் தமிழில் தெளிவாகப் பாதுகாக்கிறது.
- source_word: וַתִּשְׁתַּחוּ
  choice: பணிந்து வணங்கி
  rationale: இந்த வினை மரியாதையுடன் மிகவும் தாழ்ந்து வணங்குவதைக் குறிக்கிறது. முந்தைய ‘குனிந்து’ என்பதிலிருந்து வேறுபாட்டையும் செயல் தீவிரத்தையும் இது இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לַמֶּלֶךְ
  choice: அரசர்முன்
  rationale: எபிரேய முன்னிடைச்சொல் சொற்படியாக ‘அரசருக்கு’ என இருந்தாலும், வணங்கும் செயலைத் தமிழில் ‘அரசர்முன்’ என்பது இயல்பாகக் கூறுகிறது.
- source_word: יְחִי
  choice: வாழ்வாராக
  rationale: இந்த விருப்பவினை வாழ்த்து அல்லது வேண்டுதலை வெளிப்படுத்துகிறது. ‘வாழ்வாராக’ என்பது அதன் இலக்கண வலிமையையும் அரசவைக்குரிய மரியாதையையும் காக்கிறது.
- source_word: אֲדֹנִי
  choice: என் ஆண்டவர்
  rationale: அரசரை மரியாதையுடன் அழைக்கும் பட்டமாக இச்சொல் வருகிறது; ‘என் ஆண்டவர்’ என்பது உடைமைத் தொடர்பையும் அரசவை மரியாதையையும் காக்கிறது.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: தாவீது அரசர்
  rationale: பெயரையும் அரசப் பட்டத்தையும் இயல்பான தமிழ்ச் சொல்வரிசையில் இணைக்கிறது.
- source_word: לְעֹלָם
  choice: என்றென்றும்
  rationale: அரசருக்கான வாழ்த்தில் நீடித்த காலத்தைக் குறிக்கும் עוֹלָם என்பதன் வலிமையை ‘என்றென்றும்’ நேரடியாக வெளிப்படுத்துகிறது.
