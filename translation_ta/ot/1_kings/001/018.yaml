  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/עַתָּ֕ה הִנֵּ֥ה אֲדֹנִיָּ֖ה מָלָ֑ךְ וְ/עַתָּ֛ה אֲדֹנִ֥/י הַ/מֶּ֖לֶךְ לֹ֥א יָדָֽעְתָּ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/018.yaml
  text: And now, look, Adonijah has become king, and now, my lord the king, you do not know it.
translation:
  language: ta
  text: இப்போதோ, இதோ, அதோனியா அரசனாகிவிட்டான்; இப்போது, என் ஆண்டவராகிய அரசரே, உங்களுக்கு அது தெரியாது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: இப்போதோ
  rationale: சூழலில் நிகழ்ந்துள்ள அவசரமான திருப்பத்தை இயல்பான நவீனத் தமிழில் முன்னிறுத்துகிறது; இரண்டாவது பயன்பாடு தமிழில் இயல்பிற்காக தனியே மீண்டும் மொழிபெயர்க்கப்படவில்லை.
- source_word: הִנֵּה
  choice: பாரும்
  rationale: கவனத்தை ஈர்க்கும் எபிரெய இடைச்சொல்லின் வலிமையைப் பேச்சு நடையில் தக்கவைக்கிறது.
- source_word: אֲדֹנִיָּה
  choice: அதோனியா
  rationale: எபிரெயப் பெயரின் ஒலிப்பைத் தமிழில் நெருக்கமாக வழங்குகிறது.
- source_word: מָלָךְ
  choice: அரசனாகிவிட்டான்
  rationale: அதோனியா அரச பதவியை ஏற்றுக்கொண்டதாக அல்லது அரசனாய் ஆட்சி செய்யத் தொடங்கியதாகக் கூறும் நிறைவேற்றுப் பொருளை வெளிப்படுத்துகிறது; சட்டபூர்வத்தன்மையைத் தீர்மானிக்கவில்லை.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: என் ஆண்டவராகிய அரசரே
  rationale: பத்சேபாள் தாவீதை மரியாதையுடன் நேரடியாக அழைக்கும் சொல்லமைப்பையும் அழைப்புவேற்றுமையையும் பாதுகாக்கிறது.
- source_word: לֹא יָדָעְתָּ
  choice: இது உங்களுக்குத் தெரியாது
  rationale: எபிரெய வாக்கியத்தின் நேரடியான கூற்றை மரியாதைப் பன்மையுடன் இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: அதோனியாவின் அரசுரிமை
  choice: அரசனாகிவிட்டான்
  alternative: தன்னை அரசனாக்கிக்கொண்டான்
  rationale: மூலத்தில் அதோனியா தானே தன்னை அரசனாக்கிக்கொண்டான் என்று வெளிப்படையாக இல்லை. ஆகவே அவன் உரிமையின் சட்டபூர்வத்தன்மையையோ செயற்பாட்டாளரையோ மொழிபெயர்ப்பு கூடுதலாக நிர்ணயிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; அரசவைக்குரிய மரியாதைத் தொனியுடன், சாதாரண வாசகர்களுக்கும் தெளிவான நேரடி உரை. எபிரெயத்தில் וְעַתָּה இருமுறை வந்தாலும், தமிழில் சொற்சொல்லான மீளுரை கடினமாக இருப்பதால் இரண்டாவது இடம் இயல்பாக உட்கொள்ளப்பட்டுள்ளது.
