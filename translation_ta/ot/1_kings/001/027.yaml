  text: אִ֗ם מֵ/אֵת֙ אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ נִהְיָ֖ה הַ/דָּבָ֣ר הַ/זֶּ֑ה וְ/לֹ֤א הוֹדַ֨עְתָּ֙ אֶֽת עבדי/ך מִ֗י יֵשֵׁ֛ב עַל כִּסֵּ֥א אֲדֹנִֽ/י הַ/מֶּ֖לֶךְ אַחֲרָֽי/ו־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/027.yaml
  text: If this thing has come from my lord the king[a], have you not made known to your servants who will sit on the throne of my lord the king after him?
translation:
  language: ta
  text: “இந்தக் காரியம்[a] என் ஆண்டவராகிய அரசரிடமிருந்து வந்திருந்தால், என் ஆண்டவராகிய அரசருக்குப் பிறகு அவரது அரியணையில் யார் அமரப்போகிறார் என்பதை உமது அடியார்களுக்கு நீர் அறிவிக்கவில்லையா?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இந்த விவகாரம்” அல்லது “இந்த நிகழ்வு.”
    reason: דבר என்ற சொல்லின் சூழலுக்கேற்ற மாற்று மொழிபெயர்ப்புகளைப் பதிவு செய்து அதன் பொருள் பரப்பைக் காக்கிறது.
lexical_decisions:
- source_word: אִם
  choice: …வந்ததா?
  rationale: எபிரெயச் சொல்லின் நிபந்தனை அல்லது வினாவுரைப் பயன்பாட்டைச் சூழலுக்கேற்ற நேரடி கேள்வியாகத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; கேள்வியின் கூர்மையை அளவுக்கு மீறி விளக்கவில்லை.
- source_word: מֵאֵת ... נִהְיָה
  choice: …இடமிருந்துதான் வந்ததா
  rationale: இந்த நடவடிக்கை அரசரிடமிருந்து தோன்றியதா அல்லது அவரது அதிகாரப்பூர்வ ஒப்புதலோடு நடந்ததா என்ற மூலத்தின் பொருளைத் தருகிறது. ‘தான்’ வினாவுரையின் அழுத்தத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: என் ஆண்டவராகிய அரசர்
  rationale: அரசவைக்குரிய மரியாதையான விளிப்பையும் அரசரின் பட்டத்தையும் காக்கும் நவீனத் தமிழ் நடை.
- source_word: הַדָּבָר הַזֶּה
  choice: இந்தக் காரியம்
  rationale: דבר இங்கு குறிப்பிடும் அரச நடவடிக்கை அல்லது விவகாரத்தை இயல்பாகக் குறிக்கிறது; அதன் பரந்த சொற்பொருளை அடிக்குறிப்பில் காக்கிறது.
- source_word: וְלֹא הוֹדַעְתָּ
  choice: நீர் அறிவிக்கவில்லையே?
  rationale: Hiphil வடிவின் ‘அறியச் செய்தல்/அறிவித்தல்’ என்ற பொருளையும், சூழலிலுள்ள மறைமுகக் குற்றச்சாட்டுடன் கூடிய வினாவுரையையும் இயல்பாகத் தருகிறது.
- source_word: עֲבָדֶיךָ
  choice: உமது அடியார்களுக்கு
  rationale: அரசவையில் அதிகாரிகள் தங்களைத் தாழ்மையுடன் குறிக்கும் மரபுச் சொல்லாக இருப்பதால், அடிமை நிலையை முன்னிறுத்தாமல் அரசவைக் கீழ்ப்படிதலை வெளிப்படுத்துகிறது.
- source_word: מִי יֵשֵׁב עַל כִּסֵּא
  choice: அரியணையில் யார் அமரப்போகிறார்
  rationale: ‘அரியணையில் அமருதல்’ என்ற மூல உருவகத்தை ‘ஆட்சி செய்தல்’ என்று சுருக்காமல் காக்கிறது; எதிர்கால வாரிசுரிமையையும் தெளிவாகத் தருகிறது.
- source_word: אַחֲרָיו
  choice: அவருக்குப் பிறகு
  rationale: தற்போதைய அரசருக்குப் பின்னான வாரிசுரிமையை நேரடியாகக் குறிக்கிறது; ‘அவரது இடத்தில்’ என்ற விளக்கவுரையைத் தவிர்க்கிறது.
theological_decisions:
- issue: அரசவைத் தாழ்மைக் குறிப்பில் עבד என்பதன் மொழிபெயர்ப்பு
  choice: உமது அடியார்கள்
  alternative: உமது அடிமைகள்
  rationale: இங்கு இச்சொல் அரசர்முன் அதிகாரிகள் பயன்படுத்தும் மரியாதைமிக்க தாழ்மைக் குறிப்பாகும்; உடைமை அடிமைத்தனத்தை முன்னிறுத்துவது சூழலின் நோக்கம் அல்ல.
- issue: அரசரிடமிருந்து காரியம் வந்தது என்பதன் நுட்பம்
  choice: அரசரிடமிருந்துதான் வந்ததா?
  alternative: அரசரால் கட்டளையிடப்பட்டதா?
  rationale: மூலம் தோற்றம் அல்லது அங்கீகாரம் ஆகிய இரண்டிற்கும் இடமளிக்கிறது. ‘கட்டளையிடப்பட்டதா’ என்பது அரசர் நேரடியாக உத்தரவிட்டார் என்று ambiguity-ஐ முன்கூட்டியே தீர்த்துவிடும்.
translation_notes:
  register: நவீனத் தரத் தமிழில், அரசவைக்குரிய மரியாதையும் நாத்தானின் கூர்மையான வினாவுரையும் காக்கப்பட்டுள்ளன. ‘நீர்/உமது’ என்ற மரியாதை ஒருமை பயன்படுத்தப்பட்டுள்ளது; ‘அரியணையில் அமருதல்’ என்ற மூல உருவகம் அப்படியே பாதுகாக்கப்பட்டுள்ளது.
