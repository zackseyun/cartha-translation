translation_notes:
  register: நவீன நிலையான தமிழில், அரண்மனைச் சூழலுக்கேற்ற கண்ணியமான நடை. தொடர்ச்சிக் கதைநடையை இயல்பாக்க தொடக்கத்தில் ‘அப்போது’ பயன்படுத்தப்பட்டுள்ளது; மூலத்தின் அறிவித்தல் மற்றும் முழுமையான பணிவு தெளிவாகப் பாதுகாக்கப்பட்டுள்ளன.
