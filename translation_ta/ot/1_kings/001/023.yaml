base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/023.yaml
  text: And they told the king, saying, “Look, Nathan the prophet is here.” And he came before the king and bowed down to the king with his face to the ground.
translation:
  language: ta
  text: அவர்கள் அரசனிடம், “இதோ, தீர்க்கதரிசி நாத்தான் இங்கே இருக்கிறார்” என்று தெரிவித்தார்கள். அவர் அரசன் முன் வந்து, முகம் தரையில் படுமாறு அரசனை வணங்கினார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் எபிரெயச் சொல்லின் இயல்பான, கண்ணியமான தமிழ் இணை.
- source_word: נָתָן הַנָּבִיא
  choice: தீர்க்கதரிசி நாத்தான்
  rationale: பெயருடன் வரும் பதவிப் பெயரைத் தமிழில் இயல்பான வரிசையில் வழங்குகிறது.
- source_word: עַל אַפָּיו אָרְצָה
  choice: தரைமட்டும் முகங்குப்புற விழுந்து
  rationale: முகம் தரையை நோக்கி முழுமையாகப் பணிந்த உடல் நிலையைக் காட்டும் எபிரெய மரபுத்தொடரின் பொருளைப் பாதுகாக்கிறது.
- source_word: וַיִּשְׁתַּחוּ
  choice: வணங்கினார்
  rationale: இச்சூழலில் அரசனுக்கு முன் உடலைத் தாழ்த்தி மரியாதை செலுத்துவதைக் குறிக்கிறது; வழிபாடு என்ற இறையியல் பொருளைத் தேவையின்றி இறக்குமதி செய்யவில்லை.
