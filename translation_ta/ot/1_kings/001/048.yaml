reference: 1 Kings 1:48
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/גַם כָּ֖כָה אָמַ֣ר הַ/מֶּ֑לֶךְ בָּר֨וּךְ יְהוָ֜ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל אֲשֶׁ֨ר נָתַ֥ן הַ/יּ֛וֹם יֹשֵׁ֥ב עַל כִּסְאִ֖/י וְ/עֵינַ֥/י רֹאֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/048.yaml
  text: 'And the king also said thus: ‘Blessed be Yahweh[a], the God of Israel, who today has given one to sit on my throne, and my eyes see it.’'
translation:
  language: ta
  text: 'அரசர் மேலும் இவ்வாறு சொன்னார்: “இன்று என் அரியணையில் அமர[a] ஒருவரைத் தந்த இஸ்ரவேலின் கடவுளாகிய யாவே வாழ்த்தப்படுவாராக! என் கண்கள் காண்கின்றன.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இன்று என் அரியணையில் அமர்ந்திருக்கும் ஒருவரைத் தந்தார்; என் கண்கள் காண்கின்றன.” எபிரெயத்தில் ‘காண்கின்றன’ என்பதற்கான செயப்படுபொருள் வெளிப்படையாகக் கூறப்படவில்லை.
    reason: எபிரெயப் பங்கேற்புவினையின் மாற்று வாசிப்பையும், இறுதி வினைக்கூற்றின் கூறப்படாத செயப்படுபொருளையும் சுட்டுகிறது.
lexical_decisions:
- source_word: וְגַם כָּכָה אָמַר הַמֶּלֶךְ
  choice: அரசர் மேலும் இவ்வாறு சொன்னார்
  rationale: וְגַם என்பதன் கூடுதல் பொருளை ‘மேலும்’ என்பதும், כָּכָה என்பதன் முன்னோக்கிச் சுட்டும் பணியை ‘இவ்வாறு’ என்பதும் இயல்பான தமிழில் வெளிப்படுத்துகின்றன.
- source_word: בָּרוּךְ
  choice: வாழ்த்தப்படுவாராக
  rationale: இது கடவுளைப் போற்றும் ஆசீர்வாத வாய்பாட்டின் மரியாதையையும் வேண்டுதல் நயத்தையும் தக்கவைக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெயத் தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் அறியத்தக்க ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கடவுளாகிய
  rationale: எபிரெயக் கட்டமைப்பைத் தெளிவான, இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר נָתַן הַיּוֹם יֹשֵׁב
  choice: இன்று ... அமர ஒருவரைத் தந்த
  rationale: נתן என்பதன் பொதுவான ‘தந்த’ பொருளைத் தக்கவைத்து, அரியணையில் அமரச் செய்யப்பட்ட நபர் என்ற சூழ்நிலைப் பொருளை இயல்பாகக் கூறுகிறது; நபரின் பெயரை வசனத்தில் சேர்க்கவில்லை.
- source_word: עַל כִּסְאִי
  choice: என் அரியணையில்
  rationale: அரசாட்சிச் சூழலில் כִּסֵּא என்பதற்கான இயல்பான தமிழ் இணைச்சொல் ‘அரியணை’ ஆகும்.
- source_word: וְעֵינַי רֹאוֹת
  choice: அதை என் கண்களே காண்கின்றன
  rationale: தாவீது நிகழ்வைத் தானே நேரில் கண்டதைக் காட்டுகிறது. தமிழில் வாக்கியத்தைத் தெளிவாக்க ‘அதை’ சேர்க்கப்பட்டுள்ளது; எபிரெயத்தில் காணப்படும் பொருள் வெளிப்படையாகக் கூறப்படவில்லை.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலவசனம் கடவுளின் தனிப்பெயரான நான்கு எழுத்துப் பெயரை நேரடியாகப் பயன்படுத்துவதால், அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்துக்கு நெருக்கமானது.
- issue: יֹשֵׁב என்பதன் பங்கேற்புவினை நயம்
  choice: அமர ஒருவரை
  alternative: அமர்ந்திருக்கும் ஒருவரை
  rationale: சூழலில் அரியணையை ஏற்க நியமிக்கப்பட்டவர் என்ற விளைவு நயம் இயல்பாக வெளிப்படுகிறது; எனினும் எபிரெய வடிவை ‘அமர்ந்திருக்கும் ஒருவர்’ என்றும் புரிந்துகொள்ளலாம் என்பதால் மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதில் புரியும், அதேவேளை அரசவைக் கூற்றுக்கும் இறைபோற்றுதலுக்கும் ஏற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘அரியணை’, ‘வாழ்த்தப்படுவாராக’ ஆகியவை உயர்ந்த நயத்தைத் தக்கவைக்கின்றன; தேவையற்ற பழமையான சொற்கள் தவிர்க்கப்பட்டுள்ளன.
