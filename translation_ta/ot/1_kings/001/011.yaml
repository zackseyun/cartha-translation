base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/011.yaml
  text: Then Nathan said to Bathsheba[a], Solomon’s mother, “Have you not heard that Adonijah son of Haggith has become king, and our lord David does not know it?”
translation:
  language: ta
  text: 'அப்போது நாத்தான், சாலொமோனின் தாயான பத்சேபாவிடம், “ஆகீத்தின் மகன் அதோனியா ராஜாவாகிவிட்டான்[a] என்றும், நம் ஆண்டவர் தாவீதுக்கு இது தெரியாது என்றும் நீ கேள்விப்படவில்லையா?” என்றார்.


    [a] அல்லது, “தன்னைத்தானே ராஜாவாக்கிக்கொண்டான்.” எபிரெயச் சொல் நேரடியாக “ராஜாவானான்/ஆட்சி செய்தான்” என்று பொருள்படும். இச்சூழலில் அதோனியா தன்னையே உயர்த்தி ராஜாவாக்கிக்கொண்டான் என்ற கருத்து இருக்கலாம்; ஆனால் இங்கு பயன்படுத்தப்பட்டுள்ள சொல் அதை வெளிப்படையாகக் கூறவில்லை.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தன்னைத்தானே ராஜாவாக்கிக்கொண்டான்.” எபிரெயச் சொல் நேரடியாக “ராஜாவானான்/ஆட்சி செய்தான்” என்று பொருள்படும். இச்சூழலில் அதோனியா தன்னையே உயர்த்தி ராஜாவாக்கிக்கொண்டான் என்ற கருத்து இருக்கலாம்; ஆனால் இங்கு பயன்படுத்தப்பட்டுள்ள சொல் அதை வெளிப்படையாகக் கூறவில்லை.
    reason: מָלַךְ என்பதன் நேரடிப் பொருளையும், சூழலால் சாத்தியமாகும் ஆனால் வினைச்சொல்லில் வெளிப்படையாக இல்லாத சுய-அரசுரிமைக் கருத்தையும் வேறுபடுத்திக் காட்டுகிறது.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றார்
  rationale: தொடர்நிகழ்வைக் குறிக்கும் வாவ் வடிவத்தை இயல்பான தமிழ் கதைநடையில் ‘அப்போது’ எனக் கொடுத்து, மரியாதைப் பன்மையுடன் பேச்சை அறிமுகப்படுத்துகிறது.
- source_word: בַּת שֶׁבַע אֵם שְׁלֹמֹה
  choice: சாலொமோனின் தாயான பத்சேபா
  rationale: பெயரையும் உறவுமுறையையும் தெளிவாகவும் இயல்பான தமிழ் தொடராகவும் வழங்குகிறது.
- source_word: לֵאמֹר
  choice: நேரடி மேற்கோளில் தனியாக மொழிபெயர்க்கப்படவில்லை
  rationale: எபிரெயப் பேச்சு அறிமுக மரபுச் சொல் தமிழில் ‘என்றார்’ மற்றும் மேற்கோள் குறிகளால் ஏற்கெனவே வெளிப்படுகிறது.
- source_word: הֲלוֹא שָׁמַעַתְּ
  choice: நீ கேள்விப்படவில்லையா?
  rationale: உறுதிப்படுத்தும் பதிலை எதிர்பார்க்கும் வினாவின் வலிமையையும் ‘கேள்’ என்ற வேர்ச்சொல்லின் செய்தியறிதல் பொருளையும் காக்கிறது.
- source_word: מָלַךְ
  choice: ராஜாவாகிவிட்டான்
  rationale: ராஜாவாகுதல் அல்லது ராஜாவாக ஆட்சி செய்தல் என்ற நிகழ்வுப் பொருளைத் தருகிறது; ‘தன்னை ராஜாவாக்கிக்கொண்டான்’ என்று மூலத்தில் வெளிப்படையாக இல்லாத நோக்கத்தை முதன்மை உரையில் சேர்க்கவில்லை.
- source_word: אֲדֹנִיָּהוּ בֶן חַגִּית
  choice: ஆகீத்தின் மகன் அதோனியா
  rationale: மகன் உறவை இயல்பான தமிழில் வழங்கி, பெயர்களை எபிரெய வடிவங்களுக்கு நெருக்கமாக ஒலிபெயர்க்கிறது.
- source_word: וַאֲדֹנֵינוּ דָוִד
  choice: நம் ஆண்டவராகிய தாவீது
  rationale: இங்கு அரசருக்குரிய மனித மரியாதைப் பட்டத்தைப் பாதுகாக்கிறது; ‘தாவீது’ என்ற பெயர் அதன் மனிதக் குறிப்பைத் தெளிவாக்குகிறது.
- source_word: לֹא יָדָע
  choice: அது தெரியாது
  rationale: எபிரெயத்தில் மறைமுகமாக உள்ள செய்தியை ‘அது’ எனத் தெளிவுபடுத்தி, தற்போதும் தொடரும் அறியாமையை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: தாவீதைக் குறிக்கும் אֲדֹנֵינוּ என்ற மரியாதைப் பட்டம்
  choice: நம் ஆண்டவராகிய தாவீது
  alternative: நம் எஜமானாகிய தாவீது
  rationale: இது இறைவனைக் குறிக்கும் பட்டமல்ல; அரசனான தாவீதுக்குரிய அரண்மனை மரியாதைச் சொல். பெயருடன் சேர்த்துக் கூறுவது மனிதக் குறிப்பைத் தெளிவாக்குகிறது; அதேவேளையில் மூலத்தின் மரியாதைத் தொனியையும் காக்கிறது.
- issue: מָלַךְ என்பதில் தன்னைத்தானே ராஜாவாக்கிக்கொண்டான் என்ற பொருள் உள்ளதா
  choice: ராஜாவாகிவிட்டான்
  alternative: தன்னை ராஜாவாக்கிக்கொண்டான்
  rationale: சூழல் சுய உயர்வை உணர்த்தினாலும், இவ்வினைச்சொல் மட்டும் அதை வெளிப்படையாகக் கூறவில்லை. ஆகவே அந்த விளக்கத்தை முதன்மை உரையில் கட்டாயப்படுத்தாமல் அடிக்குறிப்பில் குறிப்பிடுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, மரியாதைமிக்க கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘ராஜா’ என்பது பொதுவாக எளிதில் புரியும் சொல்; ‘நம் ஆண்டவராகிய தாவீது’ அரண்மனை மரியாதைத் தொனியைப் பாதுகாக்கிறது. வினா, பத்சேபா செய்தியை அறிந்திருக்க வேண்டும் என்ற நாத்தானின் எதிர்பார்ப்பைத் தக்கவைக்கிறது.
