revisions:
- from: அதோனியா, என்ரோகேலுக்கு அருகிலுள்ள சோகெலேத் கல்லண்டையில் ஆடுமாடுகளையும் கொழுக்கவைக்கப்பட்ட கால்நடைகளையும் பலியிட்டான். அவன் தன் சகோதரர்களான அரசனின் மகன்கள் அனைவரையும், அரசனின் ஊழியர்களான யூதாவின் ஆண்கள் அனைவரையும் அழைத்தான்.[a]
  to: அதோனியா செம்மறியாடுகளையும், மாடுகளையும், கொழுக்கவைக்கப்பட்ட கால்நடைகளையும் என்-ரோகேலுக்கு அருகிலுள்ள சொகெலேத் கல்லின் அருகில் பலியிட்டான். அவன் அரசனின் மகன்களாகிய தன் சகோதரர்கள் அனைவரையும், அரசனின் ஊழியர்களாகிய யூதாவின் ஆண்கள் அனைவரையும் அழைத்தான்.[a]
  rationale: The revision separately renders the first two animal categories and replaces an awkward locative expression with natural modern Tamil. It retains the likely appositional relationship between ‘the men of Judah’ and ‘the king’s servants,’ while preserving the less likely list reading in a footnote.
