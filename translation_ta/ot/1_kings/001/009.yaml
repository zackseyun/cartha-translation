base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/009.yaml
  text: Adonijah sacrificed sheep[a], cattle, and fattened animals by the stone of Zoheleth, which is beside En-rogel, and he invited all his brothers, the king’s sons, and all the men of Judah[e][d][c][b], the king’s servants.
translation:
  language: ta
  text: அதோனியா செம்மறியாடுகளையும், மாடுகளையும், கொழுக்கவைக்கப்பட்ட கால்நடைகளையும் என்-ரோகேலுக்கு அருகிலுள்ள சொகெலேத் கல்லின் அருகில் பலியிட்டான். அவன் அரசனின் மகன்களாகிய தன் சகோதரர்கள் அனைவரையும், அரசனின் ஊழியர்களாகிய யூதாவின் ஆண்கள் அனைவரையும் அழைத்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அரசனின் ஊழியர்களாகிய யூதாவின் ஆண்கள்” என்பதை “யூதாவின் ஆண்கள் அனைவரையும், அரசனின் ஊழியர்கள் அனைவரையும்” என்றும் புரிந்துகொள்ளலாம். “ஊழியர்கள்” என்பது அரசவைக் பணியாளர்களையோ அதிகாரிகளையோ குறிக்கலாம்.
    reason: syntactic_and_lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבַּח
  choice: பலியிட்டான்
  rationale: זבח என்பது இச்சூழலில் விருந்துக்கான சாதாரண விலங்கறுப்பை மட்டுமல்ல, பலிச் சடங்கோடு தொடர்புடைய அறுப்பைக் குறிக்கிறது.
- source_word: צֹאן וּבָקָר
  choice: ஆடுமாடுகள்
  rationale: צֹאן சிறிய கால்நடைகளையும் בָקָר மாட்டினத்தையும் கூட்டுப்பெயர்களாகக் குறிக்கின்றன; இயல்பான தமிழில் இரண்டையும் இணைத்து வழங்குகிறது.
- source_word: וּמְרִיא
  choice: கொழுக்கவைக்கப்பட்ட கால்நடைகள்
  rationale: מְרִיא என்பது குறிப்பாகக் கன்றுகளை மட்டும் அல்லாமல், சிறப்பு விருந்துக்காகக் கொழுக்கவைக்கப்பட்ட கால்நடைகளைப் பொதுவாகக் குறிக்கக்கூடும்.
- source_word: עִם אֶבֶן הַזֹּחֶלֶת
  choice: சோகெலேத் கல்லண்டையில்
  rationale: עִם இங்கு இடஞ்சுட்டும் பொருளில் வருகிறது; ஸோகெலேத் என்பது பொருள் உறுதியற்ற இடப்பெயர் என்பதால் ஒலிபெயர்க்கப்படுகிறது.
- source_word: עֵין רֹגֵל
  choice: என்ரோகேல்
  rationale: அறியப்பட்ட இடப்பெயர் என்பதால் மொழிபெயர்ப்பதற்குப் பதிலாகத் தமிழில் ஒலிபெயர்க்கப்படுகிறது.
- source_word: וַיִּקְרָא
  choice: அழைத்தான்
  rationale: பலிவிருந்துச் சூழலில் வருமாறு அழைத்தல் என்ற பொருளைத் தருகிறது; ‘அழைத்தான்’ என்பது ‘வரவழைத்தான்/அழைப்பு விடுத்தான்’ என்ற நுணுக்கத்தைத் திறந்தவையாக வைத்திருக்கிறது.
- source_word: אֶת כָּל אֶחָיו בְּנֵי הַמֶּלֶךְ
  choice: தன் சகோதரர்களான அரசனின் மகன்கள் அனைவரையும்
  rationale: ‘அரசனின் மகன்கள்’ என்பது ‘தன் சகோதரர்கள்’ என்பதன் விளக்க இணைப்பாக இருப்பதைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: אַנְשֵׁי יְהוּדָה
  choice: யூதாவின் ஆண்கள்
  rationale: எபிரெயச் சொற்றொடர் வெளிப்படையாக ஆண்பால் பன்மையில் இருப்பதால் அதைத் துல்லியமாகப் பாதுகாக்கிறது.
- source_word: עַבְדֵי הַמֶּלֶךְ
  choice: அரசனின் ஊழியர்கள்
  rationale: அரச சேவையில் இருந்த பணியாளர்கள் அல்லது அதிகாரிகள் என்ற இரு சாத்தியங்களையும் ‘ஊழியர்கள்’ ஓரளவு தக்கவைக்கிறது.
theological_decisions:
- issue: אַנְשֵׁי יְהוּדָה என்பதிலுள்ள பாலினக் குறிப்பு
  choice: யூதாவின் ஆண்கள்
  alternative: யூதா மக்கள்
  rationale: மூல எபிரெயம் ஆண்பால் சொல்லைப் பயன்படுத்துகிறது. பரந்த சமூகக் குழுவைக் குறித்திருக்கலாம் என்ற சாத்தியம் இருந்தாலும், அதை முதன்மை உரையில் பாலினநீக்கம் செய்யவில்லை.
- issue: עַבְדֵי הַמֶּלֶךְ என்பதன் தொடர்பு
  choice: யூதாவின் ஆண்கள் அனைவரையும் விளக்கும் இணைப்பாக அமைத்தல்
  alternative: ‘அரசனின் ஊழியர்கள்’ என்பதை தனியான மூன்றாவது அழைக்கப்பட்ட குழுவாகப் புரிந்துகொள்ளுதல்
  rationale: எபிரெய தொடரமைப்பில் ‘யூதாவின் ஆண்கள், அரசனின் ஊழியர்கள்’ என்பது விளக்க இணைப்பாக இயல்பாக வாசிக்கிறது; எனினும் பட்டியல் வாசிப்பும் இலக்கண ரீதியில் முற்றிலும் நீக்க முடியாததால் அடிக்குறிப்பில் பதிவு செய்யப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. இடப்பெயர்கள் ஒலிபெயர்க்கப்பட்டுள்ளன; பலிவிருந்து, உறவுமுறை, அரச சேவை ஆகிய மூலத்தின் அரசியல்-சடங்கு நுணுக்கங்கள் எளிமைப்படுத்தப்படவில்லை.
