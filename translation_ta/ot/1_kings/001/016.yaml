base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/016.yaml
  text: Bathsheba bowed down and prostrated herself before the king[a], and the king said, “What do you want?”
translation:
  language: ta
  text: பத்சேபாள் குனிந்து, அரசர் முன் ஆழமாக வணங்கினாள். அப்போது அரசர் அவளிடம், “உனக்கு என்ன வேண்டும்?[a]” என்று கேட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “உனக்கு என்ன?” இது “உனக்கு என்ன வேண்டும்?” அல்லது “உன்னை வருத்துவது என்ன?” என்று பொருள்படக்கூடிய ஓர் இடியம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקֹּד
  choice: குனிந்து
  rationale: קָדַד உடலைத் தாழ்த்திக் குனிவதைக் குறிக்கிறது. முழங்காலிடுதல் என்று மிகையாகக் குறிப்பாக்காமல் உடல் அசைவைப் பாதுகாக்கிறது.
- source_word: בַּת שֶׁבַע
  choice: பத்சேபாள்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் பெயர்வடிவம்.
- source_word: וַתִּשְׁתַּחוּ
  choice: தரைமட்டும் பணிந்தாள்
  rationale: שׁחה என்பதன் இவ்வடிவம் ஆழ்ந்து பணிதல் அல்லது சாஷ்டாங்க வணக்கத்தைக் குறிக்கிறது. முந்தைய குனிதலிலிருந்து இதை வேறுபடுத்தி, இரட்டைச் செய்கையின் தீவிரத்தைக் காக்கிறது.
- source_word: לַמֶּלֶךְ
  choice: அரசர்முன்
  rationale: மரியாதை செலுத்தும் செய்கையின் இலக்கை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: அப்போது அரசர் அவளிடம் ... என்று கேட்டார்
  rationale: எபிரெயக் கதைத் தொடரை இயல்பான தமிழில் இணைக்கிறது; கேள்வி உரை என்பதால் ‘கேட்டார்’ பொருத்தமானது.
- source_word: מַה לָּךְ
  choice: உனக்கு என்ன வேண்டும்?
  rationale: சொல்லுக்குச் சொல் ‘உனக்கு என்ன?’ என்ற இடியத்தின் இச்சூழலுக்குரிய மரியாதையான வேண்டுகோள் விசாரணையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
