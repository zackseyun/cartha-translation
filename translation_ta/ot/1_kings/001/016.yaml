revisions:
- from: பத்சேபாள் குனிந்து, அரசர்முன் தரைமட்டும் பணிந்தாள். அப்போது அரசர் அவளிடம், “உனக்கு என்ன வேண்டும்?[a]” என்று கேட்டார்.
  to: பத்சேபாள் குனிந்து, அரசர் முன் ஆழமாக வணங்கினாள். அப்போது அரசர் அவளிடம், “உனக்கு என்ன வேண்டும்?[a]” என்று கேட்டார்.
  rationale: 'The revision improves idiomatic modern Tamil and distinguishes the two consecutive Hebrew acts of obeisance more clearly: first bowing, then deeper reverential homage. It also regularizes spacing, while preserving the contextual rendering and explanatory footnote for the Hebrew idiom.'
  reviewer_model: gpt-5.6-terra
