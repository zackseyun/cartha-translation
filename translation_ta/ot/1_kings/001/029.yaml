  text: 'அரசன் சத்தியம் செய்து சொன்னான்: “எல்லா நெருக்கடியிலிருந்தும் என் உயிரை[a] மீட்ட யாவே உயிரோடிருப்பதன்மேல் ஆணையாக—”'
  philosophy: optimal-equivalence
