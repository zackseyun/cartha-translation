lexical_decisions:
- source_word: וַיִּשָּׁבַע
  choice: ஆணையிட்டுச்
  rationale: நிபால் வடிவிலுள்ள שׁבע, உறுதிமொழி அல்லது சத்தியம் செய்வதைக் குறிக்கிறது. கதைநடையில் ‘ஆணையிட்டுச்’ என்பது சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: הַמֶּלֶךְ
  choice: அரசன்
  rationale: எபிரெயத்தில் பெயருக்குப் பதிலாகத் திட்டவட்டமான பட்டம் பயன்படுத்தப்பட்டுள்ளதால், தாவீது என்று வெளிப்படுத்தாமல் ‘அரசன்’ எனப் பாதுகாக்கப்படுகிறது.
- source_word: וַיֹּאמַר
  choice: சொன்னான்
  rationale: אמר என்பதன் வழக்கமான கதைநடைப் பொருளை, கூடுதல் வலியுறுத்தல் சேர்க்காமல் தருகிறது.
- source_word: חַי יְהוָה
  choice: யாவே உயிரோடிருப்பது எவ்வளவு உறுதியோ, அவ்வளவு உறுதியாக
  rationale: இது வழக்கமான எபிரெய உறுதிமொழிச் சூத்திரம். சொற்களின் கருத்தையும் உறுதிமொழியின் செயல்பாட்டையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தனிப்பட்ட இறைப்பெயராகத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: פָּדָה
  choice: மீட்ட
  rationale: பדה ஆபத்திலிருந்து விலைகொடுத்து அல்லது வல்லமையுடன் விடுவித்தல், மீட்டல் ஆகிய பொருள்களைக் கொண்டது; இச்சூழலில் ‘மீட்ட’ இயல்பாகவும் அதன் அடிப்படைப் பொருளுக்கு நெருக்கமாகவும் உள்ளது.
- source_word: נַפְשִׁי
