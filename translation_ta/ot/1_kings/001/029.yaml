theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக இருப்பதால், அதை ஒரு பட்டமாக மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்க்கிறது.
- issue: נַפְשִׁי என்பதன் சூழல்சார் பொருள்
  choice: என் உயிரை
  alternative: என் ஆத்துமாவை; என்னை
  rationale: இந்த வசனம் ஆபத்துகளிலிருந்து தாவீதின் உயிர் காக்கப்பட்டதைப் பற்றியது. ஆகவே பின்னாளைய உடல்–ஆத்துமா இருமைப் புரிதலைத் தேவையின்றி இறக்குமதி செய்யாமல் சூழல்சார் பொருள் தரப்படுகிறது.
