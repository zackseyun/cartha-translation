    text: அல்லது, “என் ஆத்துமாவை” அல்லது “என்னை.” எபிரெயச் சொல்லான நெஃபெஷ் உயிர், ஒருவர் தாமே, அல்லது ஆத்துமா என்று பொருள்படலாம்; இங்கு ஆபத்திலிருந்து காக்கப்பட்ட தாவீதின் உயிரையே இயல்பாகக் குறிக்கிறது.
