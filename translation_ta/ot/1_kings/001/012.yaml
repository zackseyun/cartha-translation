source:
  edition: WLC
  text: וְ/עַתָּ֕ה לְכִ֛י אִיעָצֵ֥/ךְ נָ֖א עֵצָ֑ה וּ/מַלְּטִי֙ אֶת נַפְשֵׁ֔/ךְ וְ/אֶת נֶ֥פֶשׁ בְּנֵ֖/ךְ שְׁלֹמֹֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/012.yaml
  text: Now come[a], please let me advise you[c][b], and save your life and the life of your son Solomon.
translation:
  language: ta
  text: இப்போது வா[a]; நான் உனக்கு ஓர் ஆலோசனை சொல்லட்டும்[b]. உன் உயிரையும் உன் மகன் சாலொமோனின் உயிரையும் காப்பாற்றிக்கொள்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல் ‘போ’; ஆனால் இங்கு நேரடி உரையில் அவசர அழைப்பாக இருப்பதால் ‘வா’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் ஒரே வேர்ச்சொல்லை மீண்டும் பயன்படுத்தி, சொல்லுக்குச் சொல் ‘உனக்கு ஆலோசனை ஆலோசிக்கட்டும்’ என்ற அமைப்பு உள்ளது; அதன் பொருள் ‘உனக்கு ஓர் ஆலோசனை சொல்லட்டும்.’
    reason: lexical_alternative
  - marker: c
    text: ‘காப்பாற்றிக்கொள்’ என்பது பத்சேபா தானும் நடவடிக்கை எடுத்து, தன் உயிரையும் சாலொமோனின் உயிரையும் ஆபத்திலிருந்து தப்புவிக்க வேண்டும் என்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: இப்போது
  rationale: உரையாடலில் அவசரமான அடுத்த நடவடிக்கையை அறிமுகப்படுத்துகிறது; இணைப்பிடைச்சொல்லான וְ-ஐத் தமிழில் தனியே மொழிபெயர்க்க வேண்டியதில்லை.
- source_word: לְכִי
  choice: வா
  rationale: அடிப்படையில் ‘போ/நட’ என்ற பொருளுள்ள பெண்பால் ஒருமை கட்டளைச்சொல்; இங்கு நேரடி உரையில் அவசர அழைப்பாகச் செயல்படுவதால் இயல்பான தமிழில் ‘வா’ என வழங்கப்படுகிறது.
- source_word: אִיעָצֵךְ נָא עֵצָה
  choice: நான் உனக்கு ஓர் ஆலோசனை சொல்லட்டும்
  rationale: ‘ஆலோசனை ஆலோசித்தல்’ என்ற ஒரே வேர்ச்சொல் சார்ந்த எபிரெயக் கட்டமைப்பை இயல்பான தமிழில் பொருளுடன் வழங்குகிறது; נָא குறிக்கும் பணிவான வேண்டுகோள் ‘சொல்லட்டும்’ என்பதில் வெளிப்படுகிறது.
- source_word: וּמַלְּטִי
  choice: காப்பாற்றிக்கொள்
  rationale: பெண்பால் ஒருமை கட்டளை வடிவம்; பத்சேபா நடவடிக்கை எடுத்து உயிர்களைத் தப்புவிக்க வேண்டும் என்ற சூழல்சார் வலிமையைத் தருகிறது.
- source_word: נַפְשֵׁךְ
  choice: உன் உயிரை
  rationale: נֶפֶשׁ இங்கு உடலற்ற ‘ஆத்துமா’ அல்ல, ஆபத்தில் உள்ள உயிரைக் குறிக்கிறது.
- source_word: וְאֶת נֶפֶשׁ בְּנֵךְ שְׁלֹמֹה
  choice: உன் மகன் சாலொமோனின் உயிரையும்
  rationale: முதல் ‘உயிர்’ என்பதுடனான இணைத்தொடரைப் பேணுவதோடு, எபிரெயத்தில் உள்ள சாலொமோனின் பெயரையும் தெளிவாக வைத்திருக்கிறது.
