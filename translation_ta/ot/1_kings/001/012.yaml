translation_notes:
  register: நவீனத் தரத் தமிழில், அவசரமும் மரியாதையும் கொண்ட நேரடி உரையாக அமைக்கப்பட்டுள்ளது. ‘ஆத்துமா’ போன்ற இறையியல் சார்ந்த சொல்லைத் தவிர்த்து, சூழலுக்கேற்ற ‘உயிர்’ பயன்படுத்தப்பட்டுள்ளது. ‘சாலொமோன்’ என்ற பெயர்வடிவம் பொதுவான தமிழ் வேதாகம மரபுடன் ஒத்திருக்கிறது.
