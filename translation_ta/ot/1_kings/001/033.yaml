base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/033.yaml
  text: And the king said to them[a], “Take with you the servants of your lord, and have my son Solomon ride on the mule that is mine, and bring him down to Gihon.”
translation:
  language: ta
  text: அப்போது அரசர் அவர்களிடம், “உங்கள் ஆண்டவரின் பணியாளர்களை உங்களோடு அழைத்துக்கொண்டு, என் மகன் சாலொமோனை எனக்குச் சொந்தமான கோவேறுகழுதையின்மேல் ஏற்றி[a], அவனைக் கீகோனுக்குக் கீழே அழைத்துச் செல்லுங்கள்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் மகன் சாலொமோனை எனக்குச் சொந்தமான கோவேறுகழுதையின்மேல் ஏற்றுங்கள்.” எபிரெய வினை காரணவினை வடிவில் உள்ளது; பணியாளர்கள் சாலொமோனை அந்தக் கோவேறுகழுதையின்மேல் ஏற்றி, அவன் அதில் சவாரி செய்யும்படி செய்ய வேண்டும் என்பதே பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדֵי
  choice: பணியாளர்கள்
  rationale: அரசவையின் சூழலில் அரசரின் கீழ் பணியாற்றுவோரைக் குறிக்கிறது; அவர்களின் அடிமைநிலையைத் தேவையின்றி குறிப்பாக்காமல் இயல்பான தமிழில் தருகிறது.
- source_word: אֲדֹנֵיכֶם
  choice: உங்கள் ஆண்டவர்
  rationale: அரசர் தம்மை உயர்வான மூன்றாம் நபர் முறையில் குறிப்பிடும் அரசவை மொழிநடையைப் பாதுகாக்கிறது.
- source_word: וְהִרְכַּבְתֶּם
  choice: ஏற்றி
  rationale: רכב என்பதன் ஹிஃபில் வடிவிலுள்ள காரணவினைப் பொருளை, சாலொமோனை விலங்கின்மேல் அமர்த்தி சவாரி செய்யச் செய்வதாக இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַפִּרְדָּה
  choice: கோவேறுகழுதை
  rationale: פִּרְדָּה குறிக்கும் mule என்பதற்கான தெளிவான நவீனத் தமிழ் சொல்; எபிரெய இலக்கணப் பாலினம் இங்கு கருத்துக்கு முக்கியமல்ல.
- source_word: אֲשֶׁר לִי
  choice: எனக்குச் சொந்தமான
  rationale: அந்தக் கோவேறுகழுதை அரசருக்கே உரியது என்ற வலியுறுத்தலையும் அரச அங்கீகாரத்தின் அடையாளத்தையும் பாதுகாக்கிறது.
- source_word: וְהוֹרַדְתֶּם
  choice: இறங்கிப்போகச் செய்யுங்கள்
  rationale: ירד என்பதன் ஹிஃபில் காரணவினையையும் கீகோனை நோக்கிய நிலவியல் இறக்கத்தையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: גִּחוֹן
  choice: கீகோன்
  rationale: இடப்பெயரை மொழிபெயர்க்காமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: בְנִי
  choice: என் மகன்
  rationale: மூலத்தில் வெளிப்படையாக உள்ள உறவையும் உடைமைப் பின்னொட்டையும் முழுமையாகத் தருகிறது.
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: அப்போது அரசர் ... என்றார்
  rationale: தொடர்கதை முன்னேற்றத்தை நவீனத் தமிழில் இயல்பாகக் காட்டி, அரசவைச் சூழலுக்குரிய மதிப்புமிக்க நடையைப் பேணுகிறது.
