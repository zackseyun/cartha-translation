  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான அரசவை மொழிநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மூலத்தின் காரணவினைத் தன்மை, அரசர் தம்மை ‘உங்கள் ஆண்டவர்’ என்று குறிப்பிடும் மூன்றாம் நபர் நடை, அரசருக்குச் சொந்தமான கோவேறுகழுதையின் முக்கியத்துவம், கீகோனை நோக்கிய இறக்கம் ஆகியவை பாதுகாக்கப்பட்டுள்ளன.
