source:
  edition: WLC
  text: וַ/אֲדֹ֣נִיָּ֔הוּ יָרֵ֖א מִ/פְּנֵ֣י שְׁלֹמֹ֑ה וַ/יָּ֣קָם וַ/יֵּ֔לֶךְ וַֽ/יַּחֲזֵ֖ק בְּ/קַרְנ֥וֹת הַ/מִּזְבֵּֽחַ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/050.yaml
  text: And Adonijah was afraid because of Solomon[a], so he arose and went and took hold of the horns of the altar.
translation:
  language: ta
  text: அதோனியா சாலொமோனுக்குப் பயந்து, எழுந்து சென்று பலிபீடத்தின் கொம்புகளைப் பற்றிக்கொண்டான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: பலிபீடத்தின் கொம்புகளைப் பற்றிக்கொள்வது, பலிபீடத்தில் அடைக்கலம் அல்லது இரக்கம் நாடுவதற்கான ஒரு செய்கையாக இருந்தது.
    reason: cultural_note
lexical_decisions:
- source_word: יָרֵא מִפְּנֵי
  choice: சாலொமோனைக் கண்டு பயந்தான்
  rationale: יָרֵא உடன் வரும் מִפְּנֵי இங்கு பயத்தின் காரணத்தையோ பொருளையோ குறிக்கிறது. ‘சாலொமோனைக் கண்டு பயந்தான்’ என்பது நேரடியும் இயல்பானதுமான நவீனத் தமிழ்; வெறும் இடவியல் பொருளைத் திணிக்காது.
- source_word: וַיָּקָם וַיֵּלֶךְ
  choice: எழுந்து சென்றான்
  rationale: எபிரெயக் கதைநடையின் தொடர்ச்சியான செயல்களை இயல்பான தமிழில் சுருக்கமின்றி வழங்குகிறது.
- source_word: וַיַּחֲזֵק
  choice: பற்றிக்கொண்டான்
  rationale: உறுதியாகப் பிடித்துக்கொள்ளும் செயலைக் குறிக்கிறது; ‘கைப்பற்றினான்’ போன்ற வன்முறை நுணுக்கத்தை தேவையின்றிச் சேர்க்கவில்லை.
- source_word: קַרְנוֹת הַמִּזְבֵּחַ
  choice: பலிபீடத்தின் கொம்புகள்
  rationale: பலிபீடத்தின் நீட்டிய மூலைப்பகுதிகளுக்கான வழக்கமான வழிபாட்டுச் சொல்லாட்சியை நேரடியாகப் பாதுகாக்கிறது.
- source_word: וַאֲדֹנִיָּהוּ
  choice: அதோனியா
  rationale: தனிப்பெயரைத் தமிழில் ஒலிபெயர்த்துள்ளது; தொடக்க வாவ் தமிழின் இயல்பான தொடர்ச்சியில் தனியாக மொழிபெயர்க்கப்படவில்லை.
theological_decisions:
- issue: பலிபீடத்தின் கொம்புகளைப் பற்றிக்கொள்ளும் அடைக்கலச் செய்கை
  choice: உடல் செயலை முதன்மை உரையில் நேரடியாக மொழிபெயர்த்து, அதன் பண்பாட்டு பொருளை அடிக்குறிப்பில் விளக்குதல்
  alternative: ‘அடைக்கலம் தேடி பலிபீடத்திடம் ஓடினான்’ என்று விரிவாகப் பொருளுரைத்தல்
  rationale: எபிரெய உரை செய்த உடல் செயலை மட்டுமே வெளிப்படையாகக் கூறுகிறது. அடைக்கலம் அல்லது இரக்கம் நாடும் உட்பொருளை முதன்மை உரையில் உறுதிப்படுத்தாமல், அடிக்குறிப்பில் பண்பாட்டுப் பின்னணியாக வழங்குவது மூலத்தின் அளவையும் இறையியல் பதற்றத்தையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘பலிபீடம்’, ‘கொம்புகள்’ ஆகிய நிலையான வேதாகம வழிபாட்டுச் சொற்கள் தக்கவைக்கப்பட்டுள்ளன; பண்பாட்டு விளக்கம் முதன்மை உரையில் சேர்க்கப்படாமல் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
