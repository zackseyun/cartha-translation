source:
  edition: WLC
  text: וְֽ/אֶת נָתָן֩ הַ/נָּבִ֨יא וּ/בְנָיָ֜הוּ וְ/אֶת הַ/גִּבּוֹרִ֛ים וְ/אֶת שְׁלֹמֹ֥ה אָחִ֖י/ו לֹ֥א קָרָֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/010.yaml
  text: But he did not invite Nathan the prophet[a], Benaiah, the mighty men, or Solomon his brother.
translation:
  language: ta
  text: ஆனால், இறைவாக்கினரான நாத்தானையும்[a], பெனாயாவையும், மாவீரர்களையும், தன் சகோதரனான சாலொமோனையும் அவன் அழைக்கவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இறைவாக்கினரான நாத்தானையும், பெனாயாவையும், மாவீரர்களையும், தன் சகோதரனான சாலொமோனையும் அவன் அழைக்கவில்லை.” எபிரேய வினைச்சொல்லின் நேரடிப் பொருள் “அழைத்தல்”; இங்கு அது அதோனியாவின் விருந்துக்கு அழைப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: ஆனால் ... -ஐயும்
  rationale: முந்தைய வசனத்தில் அதோனியா அழைத்தவர்களுக்கும் இங்கு அழைக்காதவர்களுக்கும் உள்ள மாறுபாட்டை ‘ஆனால்’ இயல்பாக வெளிப்படுத்துகிறது; אֶת என்பது நேரடி செயப்படுபொருள் குறியீடாகத் தமிழின் வேற்றுமை உருபில் வெளிப்படுகிறது.
- source_word: נָתָן הַנָּבִיא
  choice: இறைவாக்கினரான நாத்தான்
  rationale: נָבִיא என்பதற்கு நவீனத் தமிழில் மரியாதையுடனும் தெளிவுடனும் ‘இறைவாக்கினர்’ பயன்படுத்தப்பட்டுள்ளது; பெயர் ‘நாத்தான்’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וּבְנָיָהוּ
  choice: பெனாயா
  rationale: எபிரேயப் பெயர் தமிழில் எளிதாக வாசிக்கக்கூடிய வகையில் ஒலிபெயர்க்கப்பட்டுள்ளது; இணைப்புச் சொல் பட்டியலின் ‘-உம்’ அமைப்பில் வெளிப்படுகிறது.
- source_word: הַגִּבּוֹרִים
  choice: மாவீரர்கள்
  rationale: அரச மற்றும் இராணுவச் சூழலில் வலிமையும் போர்த்திறனும் கொண்ட சிறப்புப் போர்வீரர்களைக் குறிக்கும் சொல்லை இயல்பான, சுருக்கமான தமிழில் தருகிறது.
- source_word: שְׁלֹמֹה אָחִיו
  choice: தன் சகோதரன் சாலொமோன்
  rationale: சூழலில் பின்னொட்டு அதோனியாவைக் குறிக்கிறது. தமிழில் உரிமைத் தொடர்பு தெளிவாக இருக்க ‘தன் சகோதரன்’ என்று பெயருக்கு முன் அமைக்கப்பட்டுள்ளது.
- source_word: לֹא קָרָא
  choice: அவன் அழைக்கவில்லை
  rationale: קרא என்பதன் அடிப்படைப் பொருள் ‘அழைத்தல்’; இவ்விருந்துச் சூழலில் அது அழைப்பு விடுத்தல் அல்லது விருந்துக்கு அழைத்தல் என்ற பொருளைத் தருகிறது. தமிழ் ‘அழைக்கவில்லை’ இவ்விரு நுணுக்கங்களையும் இயல்பாகத் தக்கவைக்கிறது.
