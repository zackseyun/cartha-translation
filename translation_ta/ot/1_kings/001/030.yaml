- from: “இஸ்ரவேலின் கடவுளாகிய யாவேமேல் ஆணையிட்டு, ‘உன் மகன் சாலொமோன் எனக்குப் பிறகு அரசாள்வான்; அவனே எனக்குப் பதிலாக என் அரியணையில் அமர்வான்’ என்று நான் உனக்குச் சத்தியம் செய்தபடியே, இன்று அதை நிறைவேற்றுவேன்.”
