source:
  edition: WLC
  text: כִּ֡י כַּ/אֲשֶׁר֩ נִשְׁבַּ֨עְתִּי לָ֜/ךְ בַּ/יהוָ֨ה אֱלֹהֵ֤י יִשְׂרָאֵל֙ לֵ/אמֹ֔ר כִּֽי שְׁלֹמֹ֤ה בְנֵ/ךְ֙ יִמְלֹ֣ךְ אַחֲרַ֔/י וְ/ה֛וּא יֵשֵׁ֥ב עַל כִּסְאִ֖/י תַּחְתָּ֑/י כִּ֛י כֵּ֥ן אֶעֱשֶׂ֖ה הַ/יּ֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/030.yaml
  text: As I swore to you by Yahweh[a], the God of Israel, saying, ‘Surely Solomon your son will reign after me[b], and he will sit on my throne in my place,’ so I will do this today.
translation:
  language: ta
  text: “இஸ்ரவேலின் கடவுளாகிய யாவே மீது ஆணையிட்டு, ‘உன் மகன் சாலொமோன் எனக்குப் பிறகு அரசாள்வான்; அவன் எனக்குப் பதிலாக என் அரியணையில் அமர்வான்’ என்று நான் உனக்குச் சத்தியம் செய்தபடியே, இன்று அப்படியே செய்வேன்.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי כַּאֲשֶׁר
  choice: செய்தபடியே
  rationale: தொடக்க ஒப்பீட்டுக் கட்டமைப்பு இறுதியிலுள்ள ‘அப்படியே செய்வேன்’ என்ற பொருளுடன் நிறைவடைகிறது; தமிழில் வாக்கியத்தை இயல்பாக அமைக்க ‘செய்தபடியே’ என இணைக்கப்பட்டது.
- source_word: נִשְׁבַּעְתִּי לָךְ
  choice: நான் உனக்குச் சத்தியம் செய்தேன்
  rationale: முன்னர் நிறைவேற்றப்பட்ட உறுதிமொழியைக் குறிக்கும் எபிரெய நிறைநிலை வினையை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: בַּיהוָה
  choice: யாவேமேல் ஆணையிட்டு
  rationale: ב முன்னிடைச்சொல் ஆணை யார்மேல் இடப்பட்டது என்பதைக் காட்டுகிறது; יהוה என்ற தனிப்பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டது.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கடவுளாகிய
  rationale: இணைப்புநிலைத் தொடரை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: לֵאמֹר
  choice: என்று
  rationale: சத்தியத்தின் உள்ளடக்கத்தை அறிமுகப்படுத்தும் எபிரெயச் சொல்லுக்கு இயல்பான தமிழ் மேற்கோள் இணைப்பு.
- source_word: כִּי
  choice: மேற்கோளின் உறுதியான கூற்றாக
  rationale: இங்கு சத்தியத்தின் உள்ளடக்கத்தை வலியுறுத்துகிறது; தமிழில் எதிர்கால உறுதியான வினை வடிவமே அந்த அழுத்தத்தை இயல்பாக வெளிப்படுத்துவதால் தனியாக ‘நிச்சயமாக’ சேர்க்கப்படவில்லை.
- source_word: שְׁלֹמֹה בְנֵךְ
  choice: உன் மகன் சாலொமோன்
  rationale: பெயரையும் உறவையும் மூலத்தின் வரிசைக்கு நெருக்கமாகவும் தமிழில் தெளிவாகவும் தருகிறது.
- source_word: יִמְלֹךְ אַחֲרַי
  choice: எனக்குப் பிறகு அரசாள்வான்
  rationale: அரசாட்சியையும் தாவீதுக்குப் பிந்தைய வாரிசுரிமையையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: וְהוּא יֵשֵׁב עַל כִּסְאִי תַּחְתָּי
  choice: அவனே எனக்குப் பதிலாக என் அரியணையில் அமர்வான்
  rationale: הוּא-வின் வலியுறுத்தலை ‘அவனே’ என்றும், תַּחְתָּי-யின் பதிலீடு/வாரிசுரிமைப் பொருளை ‘எனக்குப் பதிலாக’ என்றும் தருகிறது.
- source_word: כִּי כֵן אֶעֱשֶׂה
  choice: அதை நிறைவேற்றுவேன்
  rationale: முன்னர் செய்த சத்தியத்தின்படி செயல்படுவதை இயல்பான தமிழில் தெளிவாக்குகிறது; ‘நிறைவேற்றுதல்’ சத்தியத்தைச் செயலில் கொண்டுவரும் பொருளை வெளிப்படுத்துகிறது.
- source_word: הַיּוֹם הַזֶּה
  choice: இன்று
  rationale: உடனடியான காலக் குறிப்பை நவீனத் தமிழில் இயல்பாகத் தருகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பொதுப்பட்டம் அல்ல, நான்கெழுத்து உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது; எனவே அதை மறைக்காமல் தமிழில் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டது.
- issue: תַּחְתָּי என்பதிலுள்ள பதிலீடு மற்றும் வாரிசுரிமை
  choice: எனக்குப் பதிலாக
  alternative: எனக்குப் பிறகு
  rationale: முந்தைய ‘எனக்குப் பிறகு அரசாள்வான்’ என்பது காலவரிசையை ஏற்கெனவே கூறுகிறது; இங்கு அரியணையில் தாவீதின் இடத்தை சாலொமோன் ஏற்கும் பொருளை ‘எனக்குப் பதிலாக’ தெளிவாகப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; அரசவைக் சூழலுக்கேற்ற கண்ணியமான நடை. ‘அரியணை’, ‘அரசாள்வான்’, ‘சத்தியம்’ ஆகியவை பொதுவாகப் புரியும் இலக்கியச் சொற்களாகத் தேர்ந்தெடுக்கப்பட்டன. மூலத்தில் உண்மையான உரைமாற்று தேவைப்படும் இடம் இல்லாததால் அடிக்குறிப்புகள் சேர்க்கப்படவில்லை.
