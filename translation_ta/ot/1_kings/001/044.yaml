base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/044.yaml
  text: And the king sent with him Zadok the priest[a], Nathan the prophet, Benaiah son of Jehoiada, and the Cherethites and the Pelethites; and they mounted him on the king’s mule.
translation:
  language: ta
  text: அரசன் அவனுடன் ஆசாரியரான சாதோக்கையும், தீர்க்கதரிசியான நாத்தானையும், யோய்தாவின் மகன் பெனாயாவையும், கிரேத்தியரையும் பிலேத்தியரையும் அனுப்பினார். அவர்கள் அவனை அரசனுடைய கோவேறு கழுதையின்மேல்[a] ஏற்றினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, மேலும் குறிப்பாக, “அரசனுடைய பெண் கோவேறு கழுதையின்மேல்” என்றும் மொழிபெயர்க்கலாம். இங்குள்ள எபிரெயப் பெயர்ச்சொல் பெண் கோவேறு கழுதையைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח אִתּוֹ הַמֶּלֶךְ
  choice: அரசன் அவனுடன் ... அனுப்பினார்
  rationale: எபிரெய உரையின் கதைநடை இறந்தகாலத்தையும், אִתּוֹ என்பதன் உடன்செல்லும் பொருளையும் இயல்பான தமிழில் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: צָדוֹק הַכֹּהֵן
  choice: ஆசாரியரான சாதோக்
  rationale: பெயர் ஒலிபெயர்க்கப்பட்டு, பணிப்பெயர் நவீனத் தமிழில் இயல்பான இணைப்புடன் தரப்பட்டுள்ளது.
- source_word: נָתָן הַנָּבִיא
  choice: தீர்க்கதரிசியான நாத்தான்
  rationale: נָבִיא என்பதற்கு தமிழ்வேதாகமப் பயன்பாட்டில் நன்கு அறியப்பட்ட ‘தீர்க்கதரிசி’ பயன்படுத்தப்பட்டு, பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: בְּנָיָהוּ בֶּן יְהוֹיָדָע
  choice: யோய்தாவின் மகன் பெனாயா
  rationale: எபிரெய தந்தைவழிப் பெயரடையாளத்தைத் தமிழின் இயல்பான சொல்வரிசையில் தருகிறது.
- source_word: הַכְּרֵתִי וְהַפְּלֵתִי
  choice: கிரேத்தியரையும் பிலேத்தியரையும்
  rationale: இவை குறிப்பிட்ட மக்கள் அல்லது அரச மெய்க்காவல் குழுக்களின் பெயர்கள் என்பதால், விளக்கவுரையாக மாற்றாமல் ஒலிபெயர்க்கப்பட்டுள்ளன.
- source_word: וַיַּרְכִּבוּ אֹתוֹ
  choice: அவர்கள் அவனை ... ஏற்றினார்கள்
  rationale: רכב என்பதன் ஹிஃபில் வடிவிலுள்ள காரணவினைப் பொருளை ‘ஏற்றினார்கள்’ தெளிவாகவும் இயல்பாகவும் காக்கிறது.
- source_word: עַל פִּרְדַּת הַמֶּלֶךְ
  choice: அரசனுடைய கோவேறு கழுதையின்மேல்
  rationale: פִּרְדָּה என்பதற்கு பொதுவாகப் புரியும் ‘கோவேறு கழுதை’ பயன்படுத்தப்பட்டுள்ளது; பெண்பால் குறிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
