translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் தெளிவும் கொண்ட கதைநடை பயன்படுத்தப்பட்டுள்ளது. பெயர்கள் பரவலாக அறியப்பட்ட தமிழ் வேதாகம ஒலிவடிவங்களுக்கு நெருக்கமாக வைக்கப்பட்டுள்ளன; மூலத்தில் உள்ள பட்டியல் அமைப்பும் காரணவினையும் காக்கப்பட்டுள்ளன. அடிக்குறி அது விளக்கும் ‘கோவேறு கழுதை’ என்பதற்குப் பின்னர் வைக்கப்பட்டுள்ளது.
