    issue: “திறமைமிக்கவன்” is too semantically narrow for אִישׁ חַיִל.
    rationale: The Hebrew can refer to valor, capability, substance, or standing. In this context, Adonijah’s favorable assessment of Jonathan is best conveyed by a term such as “மதிப்புக்குரியவன்,” with narrower alternatives preserved in the note.
