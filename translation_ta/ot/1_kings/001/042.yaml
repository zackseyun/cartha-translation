  text: עוֹדֶ֣/נּוּ מְדַבֵּ֔ר וְ/הִנֵּ֧ה יוֹנָתָ֛ן בֶּן אֶבְיָתָ֥ר הַ/כֹּהֵ֖ן בָּ֑א וַ/יֹּ֤אמֶר אֲדֹנִיָּ֨הוּ֙ בֹּ֔א כִּ֣י אִ֥ישׁ חַ֛יִל אַ֖תָּה וְ/ט֥וֹב תְּבַשֵּֽׂר־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/042.yaml
  text: While he was still speaking[a], behold, Jonathan son of Abiathar the priest came. And Adonijah said, “Come in, for you are a worthy man and bring good news.”
translation:
  language: ta
  text: அவன் இன்னும் பேசிக்கொண்டிருக்கும்போதே, இதோ, ஆசாரியனாகிய அபியத்தாரின் மகன் யோனத்தான் வந்தான். அப்போது அதோனியா, “உள்ளே வா; நீ மதிப்புக்குரியவன்[a], நல்ல செய்தி கொண்டுவருவாய்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“வீரமுள்ளவன்,” “திறமைமிக்கவன்,” அல்லது “தகுதியுள்ளவன்” என்றும் மொழிபெயர்க்கலாம் (எபிரெயம்: אִישׁ חַיִל). சூழலுக்கேற்ப இச்சொற்றொடர் வீரம், திறமை, செல்வாக்கு அல்லது சமூக மதிப்புநிலையைக் குறிக்கலாம்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹדֶנּוּ מְדַבֵּר
  choice: அவன் இன்னும் பேசிக்கொண்டிருக்கும்போதே
  rationale: தொடர்ந்து நடந்துகொண்டிருந்த பேச்சின் நடுவில் அடுத்த நிகழ்வு ஏற்பட்டது என்ற காலத் தொடர்பை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: திடீரென அல்லது கவனிக்கத்தக்க வகையில் நிகழும் புதிய சம்பவத்துக்கு கவனத்தை ஈர்க்கும் எபிரெய உரையாடல் குறியைப் பாதுகாக்கிறது.
- source_word: בֶּן אֶבְיָתָר הַכֹּהֵן
  choice: ஆசாரியனாகிய அபியத்தாரின் மகன்
  rationale: ‘ஆசாரியன்’ என்பது யோனத்தானை அல்ல, அபியத்தாரையே குறிக்கிறது என்பதைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: בֹּא
  choice: உள்ளே வா
  rationale: கூடியிருந்த இடத்துக்குள் யோனத்தானை வரவேற்கும் சூழ்நிலைக்கேற்ற அழைப்பாக உள்ளது.
- source_word: אִישׁ חַיִל
  choice: திறமைமிக்கவன்
  rationale: חַיִל என்பதன் வீரம், ஆற்றல், தகுதி, மதிப்புநிலை ஆகிய பொருள் வீச்சில், இங்கு நம்பத்தகுந்த செய்தியாளன் என்ற சூழலுக்கு ‘திறமைமிக்கவன்’ பொருந்துகிறது; சொல்லின் பிற சாத்தியங்களை அடிக்குறிப்பு பாதுகாக்கிறது.
- source_word: וְטוֹב תְּבַשֵּׂר
  choice: நல்ல செய்தி கொண்டுவருவாய்
  rationale: அதோனியா யோனத்தானிடமிருந்து நல்ல செய்தியை எதிர்பார்ப்பதை இயல்பான தமிழில் வெளிப்படுத்துகிறது; இது உறுதியான நிகழ்வைவிட பேச்சாளரின் எதிர்பார்ப்பாகவும் வாசிக்க இடமளிக்கிறது.
