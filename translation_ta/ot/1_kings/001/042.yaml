translation_notes:
  register: நவீன பொதுத்தமிழில், வேதாகமக் கதைநடைக்கேற்ற கண்ணியமான பாணி பயன்படுத்தப்பட்டுள்ளது. ‘இதோ’ என்ற உயர்நடைச் சாயல் கொண்ட சொல் மூலத்தின் திடீர் கவன ஈர்ப்பைத் தக்கவைக்கிறது. பெயர்கள் தமிழ் வேதாகம வழக்குக்கு ஏற்ப ‘அபியத்தார்,’ ‘யோனத்தான்,’ ‘அதோனியா’ என வழங்கப்பட்டுள்ளன.
