- from: என் ஆண்டவராகிய அரசே, இஸ்ரவேலர் அனைவரின் கண்களும் உங்கள்மேல் இருக்கின்றன; என் ஆண்டவராகிய அரசருக்குப் பிறகு அவருடைய அரியணையில் யார் அமர்வார் என்பதை அவர்களுக்கு அறிவிக்க வேண்டியது நீங்களே.[a]
  to: என் ஆண்டவராகிய அரசே, இஸ்ரவேலர் அனைவரின் கண்களும் உங்கள்மேல் இருக்கின்றன; என் ஆண்டவராகிய அரசருக்குப் பிறகு அவருடைய அரியணையில் யார் அமர்வார் என்பதை அவர்களுக்கு அறிவிப்பதற்காக.[a]
  rationale: The revision removes the added sense of obligation and exclusivity, preserving the Hebrew purpose infinitive with ‘அறிவிப்பதற்காக.’ It also moves the footnote anchor to the immediately relevant phrase and makes the antecedent explicit without altering the main text’s personal pronoun.
