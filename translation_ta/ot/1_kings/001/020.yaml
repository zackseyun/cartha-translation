  text: וְ/אַתָּה֙ אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ עֵינֵ֥י כָל יִשְׂרָאֵ֖ל עָלֶ֑י/ךָ לְ/הַגִּ֣יד לָ/הֶ֔ם מִ֗י יֵשֵׁ֛ב עַל כִּסֵּ֥א אֲדֹנִֽ/י הַ/מֶּ֖לֶךְ אַחֲרָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/020.yaml
  text: And you[a], my lord the king, the eyes of all Israel are on you[b], to tell them who will sit on the throne of my lord the king after him.
translation:
  language: ta
  text: என் ஆண்டவராகிய அரசே, இஸ்ரவேலர் அனைவரின் கண்களும் உங்கள்மேல் இருக்கின்றன; என் ஆண்டவராகிய அரசருக்குப் பிறகு அவருடைய அரியணையில் யார் அமர்வார் என்பதை அவர்களுக்கு அறிவிப்பதற்காக.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “என் ஆண்டவராகிய அரசருக்குப் பிறகு” என்பது தாவீது அரசருக்குப் பிறகு என்பதைக் குறிக்கிறது.
    reason: referent_clarification
lexical_decisions:
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: என் ஆண்டவராகிய அரசே / என் ஆண்டவராகிய அரசர்
  rationale: אֲדֹנִי என்பது மரியாதைக்குரிய ‘என் ஆண்டவர்’ என்றும் הַמֶּלֶךְ என்பது ‘அரசர்’ என்றும் பொருள்படும். முதல் இடத்தில் இது நேரடி விளியாக இருப்பதால் ‘அரசே’ என்றும், பின்னர் இலக்கணத் தொடர்புக்கு ஏற்றவாறு ‘அரசர்’ என்றும் வழங்கப்பட்டுள்ளது.
- source_word: עֵינֵי כָל יִשְׂרָאֵל עָלֶיךָ
  choice: இஸ்ரவேலர் அனைவரின் கண்களும் உங்கள்மேல் இருக்கின்றன
  rationale: அரசரின் அறிவிப்பை எதிர்பார்த்து நாடு முழுவதும் அவரை நோக்கியிருக்கிறது என்ற எபிரேய உருவகத்தைத் தமிழிலும் இயல்பாகப் பாதுகாக்கிறது.
- source_word: לְהַגִּיד לָהֶם
  choice: அவர்களுக்கு அறிவிக்க
  rationale: נגד என்பதன் Hiphil வடிவம் தகவலைத் தெரியப்படுத்துதல் அல்லது அறிவித்தல் என்பதைக் குறிக்கிறது. அரசரின் அதிகாரபூர்வ அறிவிப்புச் சூழலுக்கு ‘அறிவிக்க’ பொருத்தமானது.
- source_word: מִי יֵשֵׁב
  choice: யார் அமர்வார்
  rationale: அரியணைச் சூழலில் ישב என்பது அமர்வதையும் அதன்மூலம் ஆட்சிப் பொறுப்பேற்பதையும் குறிக்கிறது. மூல உருவகத்தை ‘அமர்வார்’ நேரடியாகப் பாதுகாக்கிறது.
- source_word: עַל כִּסֵּא
  choice: அவருடைய அரியணையில்
  rationale: כִּסֵּא என்பது அரசரின் ‘அரியணை’; עַל உடன் தமிழில் இயல்பாக ‘அரியணையில்’ என்று வழங்கப்படுகிறது. உடைமைத் தொடர்பு தமிழில் தெளிவாக இருக்க ‘அவருடைய’ சேர்க்கப்பட்டுள்ளது.
- source_word: אַחֲרָיו
  choice: அவருக்குப் பிறகு
  rationale: மூன்றாம் ஆண்பால் ஒருமை பின்னொட்டு முன்பு குறிப்பிடப்பட்ட அரசராகிய தாவீதைக் குறிக்கிறது; வாரிசுரிமைச் சூழலை மிகைப்படுத்தாமல் தனிப்பட்ட சுட்டைத் தக்கவைக்கிறது.
theological_decisions:
- issue: אַחֲרָיו என்பதிலுள்ள பிரதிப்பெயரின் குறிப்பு
  choice: அவருக்குப் பிறகு—அதாவது தாவீது அரசருக்குப் பிறகு
  alternative: அதற்குப் பிறகு / பின்னர்
  rationale: எபிரேயச் சொல்லில் மூன்றாம் ஆண்பால் ஒருமை பின்னொட்டு உள்ளது; அது நேரடியாக அழைக்கப்படும் அரசரையே இயல்பாகக் குறிக்கிறது. சூழலும் தாவீதுக்குப் பிந்தைய அரச வாரிசைப் பற்றியது. மூலத்தின் பிரதிப்பெயரை முதன்மை உரையில் தக்கவைத்து, அதன் குறிப்பை அடிக்குறிப்பு விளக்குகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், அரசவைக்குரிய மரியாதையைத் தக்கவைக்கும் உயர்ந்த ஆனால் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘கண்களும் உங்கள்மேல்’ என்ற மூல உருவகம் பாதுகாக்கப்பட்டுள்ளது; ஒருமை மரியாதைப் பொருளுக்காக ‘நீங்களே’ பயன்படுத்தப்பட்டுள்ளது.
