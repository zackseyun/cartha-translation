base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/041.yaml
  text: Adonijah and all the invited guests who were with him heard it as they finished eating[a]. And when Joab heard the sound of the trumpet, he said[b], “Why is the sound of the city in an uproar?”
translation:
  language: ta
  text: அதோனியாவும் அவனோடு இருந்த அழைக்கப்பட்ட விருந்தினர்கள் அனைவரும் சாப்பிட்டு முடித்தபோது அந்தச் சத்தத்தைக் கேட்டார்கள்.[a] யோவாப் கொம்பின் ஒலியைக் கேட்டபோது,[b] “நகரத்தில் இவ்வளவு ஆரவாரச் சத்தம் ஏன்?” என்று சொன்னான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள் சாப்பிட்டு முடித்துக்கொண்டிருந்தபோது.” எபிரெயக் கூற்று உணவு முடிந்த நிலையையோ, அவர்கள் அதை முடித்துக்கொண்டிருந்த தருணத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் ‘ஷோஃபார்’; பொதுச் சமிக்ஞை கொடுக்கப் பயன்படுத்தப்பட்ட கொம்பினால் செய்யப்பட்ட ஊதுகருவி.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: அந்தச் சத்தத்தைக் கேட்டார்கள்
  rationale: எபிரெய வினைச்சொல் ‘கேட்டான்/கேட்டார்கள்’ என்று பொருள்படும். தமிழில் இயல்பாக அமைய, முந்தைய நிகழ்வால் எழுந்த சத்தம் என்பது சூழலிலிருந்து நிரப்பப்பட்டுள்ளது.
- source_word: הַקְּרֻאִים
  choice: அழைக்கப்பட்ட விருந்தினர்கள்
  rationale: קרא என்பதன் செயப்பாட்டு வினையெச்சம் ‘அழைக்கப்பட்டவர்கள்’ எனப் பொருள்படும்; விருந்து நிகழும் சூழலில் ‘அழைக்கப்பட்ட விருந்தினர்கள்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: וְהֵם כִּלּוּ לֶאֱכֹל
  choice: தாங்கள் சாப்பிட்டு முடிக்கும் வேளையில்
  rationale: அவர்கள் உணவை முடித்துக்கொண்டிருந்த நேரத்தை இக்கூற்று குறிக்கலாம்; நிறைவு பெற்ற தருணத்தையும் முடிவை நெருங்கிய நிலையையும் உள்ளடக்கும் எபிரெய மொழியின் காலத் தெளிவின்மையை இந்தத் தமிழ் மொழிபெயர்ப்பு காக்கிறது.
- source_word: קוֹל הַשּׁוֹפָר
  choice: கொம்பின் முழக்கம்
  rationale: שׁוֹפָר என்பது பொதுச் சமிக்ஞைக்குப் பயன்படுத்தப்பட்ட கொம்புக் கருவி. ‘கொம்பின் முழக்கம்’ என்பது அதன் பொருளையும் ஒலியையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: מַדּוּעַ
  choice: ஏன்
  rationale: நேரடியான வினாவிற்கு இயல்பான, சுருக்கமான தமிழ் இணைச்சொல்.
- source_word: קוֹל הַקִּרְיָה הוֹמָה
  choice: நகரத்தில் ஏன் இவ்வளவு ஆரவாரம்?
  rationale: சொல்லுக்கு சொல் அமைப்பைத் திணிக்காமல், நகரின் சத்தமிகு கிளர்ச்சியை הוֹמָה உணர்த்துவதால் நவீன தமிழில் இயல்பாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: אֲדֹנִיָּהוּ
  choice: அதோனியா
  rationale: தனிப்பெயர் வழக்கமான தமிழ் வேதாகம ஒலிபெயர்ப்பு வடிவத்தில் தரப்பட்டுள்ளது.
- source_word: יוֹאָב
  choice: யோவாப்
  rationale: தனிப்பெயர் வழக்கமான தமிழ் வேதாகம ஒலிபெயர்ப்பு வடிவத்தில் தரப்பட்டுள்ளது.
