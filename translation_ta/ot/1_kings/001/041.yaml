- from: அதோனியாவும் அவனோடு இருந்த அழைக்கப்பட்ட விருந்தினர்கள் அனைவரும் தாங்கள் சாப்பிட்டு முடிக்கும் வேளையில் அந்தச் சத்தத்தைக் கேட்டார்கள்.[a] யோவாப் கொம்பின் முழக்கத்தைக் கேட்டபோது,[b] “நகரத்தில் ஏன் இவ்வளவு ஆரவாரம்?” என்று கேட்டான்.
  to: அதோனியாவும் அவனோடு இருந்த அழைக்கப்பட்ட விருந்தினர்கள் அனைவரும் சாப்பிட்டு முடித்தபோது அந்தச் சத்தத்தைக் கேட்டார்கள்.[a] யோவாப் கொம்பின் ஒலியைக் கேட்டபோது,[b] “நகரத்தில் இவ்வளவு ஆரவாரச் சத்தம் ஏன்?” என்று சொன்னான்.
  rationale: மூலத்தின் பேச்சு-வினை (‘சொன்னான்’) மற்றும் நகரத்தின் ‘சத்தம்’ ஆகியவை வெளிப்படையாகக் காக்கப்பட்டன. உணவு முடிவைப் பற்றிய எபிரெயக் கூற்றின் காலநுணுக்கம் முதன்மை உரல் மற்றும் அடிக்குறிப்பின் இணைப்பால் பாதுகாக்கப்படுகிறது. பொருளில் எந்தக் கோட்பாட்டு விளக்கமும் சேர்க்கப்படவில்லை.
