  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை. பாரம்பரியமாக அறியப்பட்ட வேதாகமப் பெயர் வடிவங்களும் ‘ஆசாரியன்’, ‘தீர்க்கதரிசி’ ஆகிய பதவிச் சொற்களும் பயன்படுத்தப்பட்டுள்ளன.
