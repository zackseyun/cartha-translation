source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר הַ/מֶּ֣לֶךְ דָּוִ֗ד קִרְאוּ לִ֞/י לְ/צָד֤וֹק הַ/כֹּהֵן֙ וּ/לְ/נָתָ֣ן הַ/נָּבִ֔יא וְ/לִ/בְנָיָ֖הוּ בֶּן יְהוֹיָדָ֑ע וַ/יָּבֹ֖אוּ לִ/פְנֵ֥י הַ/מֶּֽלֶךְ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/032.yaml
  text: Then King David said, “Call Zadok the priest, Nathan the prophet, and Benaiah son of Jehoiada to me.” And they came before the king.
translation:
  language: ta
  text: அப்போது தாவீது அரசர், “ஆசாரியனாகிய சாதோக்கையும், தீர்க்கதரிசியாகிய நாத்தானையும், யோய்தாவின் மகன் பெனாயாவையும் என்னிடம் அழைத்து வாருங்கள்” என்றார். அவர்கள் அரசரின் முன்னிலையில் வந்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றார்
  rationale: தொடர்ச்சியான கதைநடையைச் சுட்டும் waw-consecutive-ஐ இயல்பான நவீன தமிழில் ‘அப்போது’ என வெளிப்படுத்துகிறது.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: தாவீது அரசர்
  rationale: தாவீதின் அரசப் பதவியை இயல்பான தமிழ் பெயர்-பட்ட அமைப்பில் தருகிறது.
- source_word: קִרְאוּ לִי
  choice: என்னிடம் அழைத்து வாருங்கள்
  rationale: பன்மை ஏவலைக் காத்து, குறிப்பிடப்பட்டவர்களைப் பேச்சாளரின் முன்னிலைக்கு வரவழைக்கும் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: לְצָדוֹק הַכֹּהֵן
  choice: ஆசாரியனாகிய சாதோக்கை
  rationale: தனிப்பெயரையும் அவருடைய உறுதியான அலுவல் அடையாளத்தையும் காக்கிறது.
- source_word: וּלְנָתָן הַנָּבִיא
  choice: தீர்க்கதரிசியாகிய நாத்தானை
  rationale: נָבִיא என்பதற்கான பரவலாக அறியப்பட்ட வேதாகமத் தமிழ் சொல்லைப் பயன்படுத்தி, பெயருடன் பட்டத்தை இணைக்கிறது.
- source_word: וְלִבְנָיָהוּ בֶּן יְהוֹיָדָע
  choice: யோய்தாவின் மகன் பெனாயாவை
  rationale: בן என்பதன் வம்ச அடையாளப் பொருளை இயல்பான தமிழ்ச் சொல் வரிசையில் தருகிறது.
- source_word: וַיָּבֹאוּ
  choice: அவர்கள் ... வந்தார்கள்
  rationale: பன்மை வினையையும் தொடர்ச்சியான நிகழ்வையும் நேரடியாகக் காக்கிறது.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: அரசரின் முன்னிலையில்
  rationale: ஒருவரின் சந்நிதி அல்லது முன்னிலை என்ற எபிரெயச் சொற்றொடரின் பொருளை dignified modern Tamil-இல் இயல்பாகத் தருகிறது.
