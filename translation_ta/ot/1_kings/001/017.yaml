base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/017.yaml
  text: She said to him, “My lord, you swore by the LORD your God to your female servant, ‘Surely Solomon your son will reign after me, and he will sit on my throne.’”
translation:
  language: ta
  text: அவள் அவரிடம், “என் ஆண்டவரே, ‘உமக்குப் பிறகு உமது மகன் சாலொமோன் அரசாளுவான்; அவனே என் அரியணையில் அமருவான்’ என்று உமது அடியாளாகிய எனக்கு உமது கடவுளாகிய ஆண்டவர்மேல் ஆணையிட்டு உறுதியளித்தீரே,” என்றாள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנִי
  choice: என் ஆண்டவரே
  rationale: அரசனை மரியாதையுடன் நேரடியாக அழைக்கும் எபிரெயச் சொல்லின் பொருளையும் உரையாடல் இயல்பையும் காக்கிறது.
- source_word: בַּיהוָה
  choice: ஆண்டவர் மேல்
  rationale: தெய்வீகப் பெயரைத் தமிழ் வேதாகம மரபுக்கு ஏற்ற ‘ஆண்டவர்’ என வழங்கி, בְּ குறிக்கும் ஆணையின் அடிப்படையை ‘மேல்’ எனத் தெளிவாக்குகிறது.
- source_word: לַאֲמָתֶךָ
  choice: உமது அடியாளாகிய எனக்கு
  rationale: பெண் பேசுபவர் தன்னைத் தாழ்மையுடன் குறிப்பதைக் காட்டுகிறது; தமிழில் ‘பெண் அடியாள்’ என்று இயல்பற்ற வகையில் பாலினத்தை வெளிப்படையாகச் சொல்லாமல், சூழலில் அது தெளிவாக உள்ளது.
- source_word: כִּי
  choice: என்று
  rationale: இங்கு ஆணையின் உள்ளடக்கத்தை அறிமுகப்படுத்தும் உருபாக எடுத்துக்கொள்ளப்படுகிறது; ஆங்கிலத்தின் ‘Surely’ போன்ற வலியுறுத்தலை எபிரெயம் கட்டாயப்படுத்தாததால் சேர்க்கப்படவில்லை.
- source_word: יִמְלֹךְ אַחֲרָי
  choice: எனக்குப் பிறகு அரசாளுவான்
  rationale: கால வரிசையையும் அரசுரிமைத் தொடர்ச்சியையும் நேரடியாகக் காக்கிறது.
- source_word: וְהוּא
  choice: அவனே
  rationale: தனிப்பட்ட சுட்டுப்பெயரின் வலியுறுத்தலைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: தெய்வீகப் பெயர் יהוה
  choice: ஆண்டவர்
  alternative: யாவே
  rationale: பெயரை மறுக்கும் நோக்கமின்றி, நவீனத் தமிழ் வேதாகம வாசிப்பில் பரவலாக அறியப்படும் மரியாதைமிக்க வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- issue: כִּי என்பதன் வலியுறுத்தல்
  choice: மேற்கோளின் உள்ளடக்கத்தைக் குறிக்கும் ‘என்று’
  alternative: ‘நிச்சயமாக’ என்று வலியுறுத்துதல்
  rationale: இந்த இடத்தில் כִּי மேற்கோள் அல்லது ஆணையின் உள்ளடக்கத்தை அறிமுகப்படுத்த இயலும்; மூலத்தில் இல்லாத உறுதியூட்டும் நுணுக்கத்தை கட்டாயமாகச் சேர்க்காமல் அதன் இலக்கணத் திறப்பை மதிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், அரசவைக்குரிய மரியாதையும் பத்சேபாள் தன்னைத் தாழ்த்திப் பேசும் தொனியும் காக்கப்பட்டுள்ளன. மேற்கோள் அடுக்குகள் தெளிவாகவும் வாய்மொழியில் இயல்பாகவும் அமைக்கப்பட்டுள்ளன.
