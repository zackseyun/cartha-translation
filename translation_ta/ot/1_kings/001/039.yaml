base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/039.yaml
  text: Then Zadok the priest took the horn of oil from the tent and anointed Solomon[a]. Then they blew the ram’s horn, and all the people said[b], “Long live King Solomon!”
translation:
  language: ta
  text: அப்போது ஆசாரியரான சாதோக் கூடாரத்திலிருந்து[b] எண்ணெய்க் கொம்பை எடுத்து, சாலொமோனை அபிஷேகம் செய்தார். பின்னர் அவர்கள் ஷோஃபாரை[a] ஊதினார்கள்; மக்கள் அனைவரும், “சாலொமோன் அரசர் நீடூழி வாழ்க!” என்று சொன்னார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ஷோஃபார்; பொதுவாக ஆட்டுக்கடாவின் கொம்பால் செய்யப்பட்ட ஊதுகருவி. இதை “எக்காளம்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “திருக்கூடாரத்திலிருந்து” என்றும் மொழிபெயர்க்கலாம்; எபிரெயத்தில் நேரடியாக “கூடாரத்திலிருந்து” என்றே உள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקַּח
  choice: எடுத்து
  rationale: לקח என்பதன் தொடர்கதை வடிவம் அடுத்த செயலைக் குறிக்கிறது; இச்சூழலில் ‘எடுத்து’ என்பது இயல்பான, நேரடியான தமிழாக்கம்.
- source_word: צָדוֹק הַכֹּהֵן
  choice: ஆசாரியனாகிய சாதோக்கு
  rationale: தனிப்பெயர் ஒலிபெயர்க்கப்பட்டு, הַכֹּהֵן என்ற பட்டம் தெளிவான இணைப்புடன் வழங்கப்படுகிறது.
- source_word: קֶרֶן הַשֶּׁמֶן
  choice: எண்ணெய்க் கொம்பை
  rationale: קֶרֶן என்பதன் ‘கொம்பு’ என்ற திடமான உருவகத்தைப் பாதுகாக்கிறது; சடங்கில் எண்ணெய் வைக்கப்பட்ட கொம்பே குறிக்கப்படுகிறது.
- source_word: מִן הָאֹהֶל
  choice: கூடாரத்திலிருந்து
  rationale: אֹהֶל என்பதன் பொதுவான பொருள் ‘கூடாரம்’; மூலத்தில் இல்லாத தொழில்நுட்பச் சிறப்புப்பெயரை முதன்மை உரையில் சேர்க்கவில்லை.
- source_word: וַיִּמְשַׁח
  choice: அபிஷேகம் செய்தார்
  rationale: משׁח குறிக்கும் அரச அர்ப்பணிப்பு சார்ந்த எண்ணெய்பூசும் சடங்கிற்கு நவீன தமிழ் வேதாகம நடையில் புரிந்துகொள்ளத்தக்க நிலையான சொற்றொடர்.
- source_word: וַיִּתְקְעוּ בַּשּׁוֹפָר
  choice: கொம்பு எக்காளத்தை ஊதினார்கள்
  rationale: שׁוֹפָר என்பது கொம்பால் செய்யப்பட்ட ஊதுகருவி; ‘கொம்பு எக்காளம்’ பொருளையும் கருவியின் தன்மையையும் இயல்பாகத் தெரிவிக்கிறது, அதனை எப்போதும் ஆட்டுக்கடாவின் கொம்பு என மிகுதியாகக் குறிப்பதில்லை.
- source_word: כָּל הָעָם
  choice: மக்கள் அனைவரும்
  rationale: பொதுவான மக்கள் கூட்டத்தின் முழுமையையும் இயல்பான தமிழில் நேரடியாகக் காட்டுகிறது.
- source_word: יְחִי הַמֶּלֶךְ שְׁלֹמֹה
  choice: சாலொமோன் அரசர் நீடூழி வாழ்க!
  rationale: יְחִי என்ற வாழ்த்துரை/விருப்ப வினையின் அரச வாழ்த்தொலியை இயல்பான தமிழில் பாதுகாக்கிறது.
theological_decisions:
- issue: அரச அபிஷேகச் சூழலில் הָאֹהֶל என்பதன் குறிப்புத்தன்மை
  choice: கூடாரம்
  alternative: திருக்கூடாரம்
  rationale: எபிரெய உரை definite article உடன் பொதுப்பெயரான ‘கூடாரம்’ என்பதையே பயன்படுத்துகிறது. அது வழிபாட்டுக்குரிய பரிசுத்தக் கூடாரத்தைச் சுட்டியிருக்கலாம்; எனினும் முதன்மை உரையில் மூலத்தைவிடத் தொழில்நுட்பமாகக் குறிப்பிடாமல், மாற்றை அடிக்குறிப்பில் தருவது ambiguity-ஐப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வரலாற்று-வழிபாட்டு நடை பயன்படுத்தப்பட்டுள்ளது. ‘அபிஷேகம்’ பரவலாக அறியப்பட்ட சடங்குச் சொல்லாக வைக்கப்பட்டுள்ளது; ‘கொம்பு எக்காளம்’ ஷோஃபாரின் பொருளை விளக்குகிறது. அனைத்து அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
