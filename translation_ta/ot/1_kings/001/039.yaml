revisions:
- from: அப்போது ஆசாரியனாகிய சாதோக்கு கூடாரத்திலிருந்து எண்ணெய்க் கொம்பை எடுத்து, சாலொமோனை அபிஷேகம் செய்தார். பின்பு அவர்கள் கொம்பு எக்காளத்தை[a] ஊதினார்கள்; மக்கள் அனைவரும், “சாலொமோன் அரசர் நீடூழி வாழ்க!” என்று முழங்கினார்கள்.[b]
  to: அப்போது ஆசாரியரான சாதோக் கூடாரத்திலிருந்து[b] எண்ணெய்க் கொம்பை எடுத்து, சாலொமோனை அபிஷேகம் செய்தார். பின்னர் அவர்கள் ஷோஃபாரை[a] ஊதினார்கள்; மக்கள் அனைவரும், “சாலொமோன் அரசர் நீடூழி வாழ்க!” என்று சொன்னார்கள்.
  rationale: 'திருத்தம் மூல எபிரெயத்தின் சொல்லளவையும் செயல்வரிசையையும் காக்கிறது: சாதோக் எண்ணெய்க் கொம்பை கூடாரத்திலிருந்து எடுக்கிறார், சாலொமோனை அபிஷேகம் செய்கிறார், பின்னர் ஷோஃபார் ஊதப்படுகிறது, மக்கள் அரச வாழ்த்துரையைக் கூறுகிறார்கள். கூடாரத்தின் அடையாளம் குறித்து மூலத்தில் உள்ள குறைந்த குறிப்புத்தன்மை முதன்மை உரையில் பாதுகாக்கப்பட்டு, மாற்று வாசிப்பு சரியான இடத்தில் அடிக்குறிப்பாகத் தரப்பட்டுள்ளது.'
