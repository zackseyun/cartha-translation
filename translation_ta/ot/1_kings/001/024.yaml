base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/024.yaml
  text: Then Nathan said[a], “My lord the king, have you said, ‘Adonijah will reign after me, and he will sit on my throne’?”
translation:
  language: ta
  text: அப்போது நாத்தான், “என் ஆண்டவராகிய அரசே, ‘எனக்குப் பிறகு அதோனியா அரசாளுவான்; அவன் என் அரியணையில் அமருவான்’ என்று நீங்கள் சொன்னீர்களா?[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என்று நீங்கள் சொல்லியிருக்கிறீர்களா?” எபிரெய நிறைவுவினையை இக்கேள்வியில் தமிழில் சாதாரண இறந்தகாலமாகவோ, நிகழ்காலத்துடன் தொடர்புடைய நிறைவாகவோ மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றார்
  rationale: வாவ் தொடர்வினை கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது. நவீனத் தமிழில் ‘அப்போது’ நிகழ்வுகளின் தொடர்ச்சியை இயல்பாகக் காட்டுகிறது.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: என் ஆண்டவராகிய அரசே
  rationale: தாவீதை நோக்கிய அரசவை மரியாதை விளிப்பாகிய உடைமைச் சிறப்புப்பெயரையும் அரச பட்டத்தையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: אַתָּה אָמַרְתָּ
  choice: நீங்கள் சொன்னீர்களா?
  rationale: எபிரெய நிறைவுவினை இங்கு கேள்வியாக வந்து, தாவீது உண்மையில் இத்தகைய ஆணையைச் சொன்னாரா என்று விசாரிக்கிறது. தமிழில் இறந்தகாலக் கேள்வி இயல்பானது; ‘சொல்லியிருக்கிறீர்களா?’ என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பு தரப்பட்டுள்ளது.
- source_word: אֲדֹנִיָּהוּ
  choice: அதோனியா
  rationale: எபிரெயப் பெயரின் வடிவத்தை நவீனத் தமிழ் வேதாகமப் பெயரெழுத்து மரபுக்கு ஏற்றவாறு ஒலிபெயர்க்கிறது.
- source_word: יִמְלֹךְ
  choice: அரசாளுவான்
  rationale: ‘அரசனாக இருத்தல்/ஆட்சி செய்தல்’ என்ற வினையின் அரசுரிமைச் சூழலை நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: אַחֲרָי
  choice: எனக்குப் பிறகு
  rationale: அரசுரிமைத் தொடர்ச்சியைச் சுட்டும் சுருக்கமான எபிரெயச் சொற்றொடரை மேலதிக விளக்கமின்றி தக்கவைக்கிறது.
- source_word: וְהוּא יֵשֵׁב עַל־כִּסְאִי
  choice: அவனே என் அரியணையில் அமருவான்
  rationale: וְהוּא என்பதில் வெளிப்படும் வலியுறுத்தலை ‘அவனே’ எனக் காட்டி, அரசுரிமையைக் குறிக்கும் அரியணை உருவகத்தையும் தக்கவைக்கிறது.
