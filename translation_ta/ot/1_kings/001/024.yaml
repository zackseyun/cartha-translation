translation_notes:
  register: நவீனத் தரத் தமிழில், அரசவைக்குரிய மரியாதையையும் நேரடியான கேள்வியின் தொனியையும் காக்கும் கண்ணியமான நடை. ‘நீங்கள்’ மற்றும் மரியாதை வினைமுற்று அரசனை நோக்கிய உரைக்கு ஏற்றவாறு பயன்படுத்தப்பட்டுள்ளன.
