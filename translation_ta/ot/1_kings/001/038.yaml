  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יֵּ֣רֶד צָד֣וֹק הַ֠/כֹּהֵן וְ/נָתָ֨ן הַ/נָּבִ֜יא וּ/בְנָיָ֣הוּ בֶן יְהוֹיָדָ֗ע וְ/הַ/כְּרֵתִי֙ וְ/הַ/פְּלֵתִ֔י וַ/יַּרְכִּ֨בוּ֙ אֶת שְׁלֹמֹ֔ה עַל פִּרְדַּ֖ת הַ/מֶּ֣לֶךְ דָּוִ֑ד וַ/יֹּלִ֥כוּ אֹת֖/וֹ עַל גִּחֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/038.yaml
  text: So Zadok the priest[a], Nathan the prophet, Benaiah son of Jehoiada, and the Cherethites and the Pelethites went down and had Solomon ride on King David’s mule[c][b], and they brought him to Gihon.
translation:
  language: ta
  text: ஆகவே சாதோக் என்னும் ஆசாரியனும், நாத்தான் என்னும் தீர்க்கதரிசியும், யோய்தாவின் மகன் பெனாயாவும், கிரேத்தியரும் பிலேத்தியரும் கீழே சென்று, சாலொமோனைத் தாவீது அரசரின் கோவேறு கழுதையின்மேல்[a] ஏற்றி, அவரைக் கீகோனுக்குக் கொண்டுசென்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கோவேறு கழுதை” என்பதற்கான எபிரெயச் சொல் இலக்கணத்தில் பெண்பாலாக உள்ளது; அது பெண் கோவேறு கழுதையைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: கீழே சென்று
  rationale: ירד என்பதன் திசை சார்ந்த ‘இறங்கிச் செல்’ என்ற பொருளை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: הַכֹּהֵן
  choice: ஆசாரியன்
  rationale: כהן என்பதற்கான வழக்கமான வேதாகமத் தமிழ் சொல்; சாதோக்கின் பதவியைத் தெளிவாகக் காட்டுகிறது.
- source_word: הַנָּבִיא
  choice: தீர்க்கதரிசி
  rationale: נביא என்பதற்கான பரவலாக அறியப்படும் தமிழ் இணைச்சொல்.
- source_word: בֶן יְהוֹיָדָע
  choice: யோய்தாவின் மகன்
  rationale: எபிரெயப் பிறப்புறவுச் சொல்லை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: הַכְּרֵתִי וְהַפְּלֵתִי
  choice: கிரேத்தியரும் பிலேத்தியரும்
  rationale: மூலத்தில் குழுக்களின் பெயர்களே உள்ளதால், விவாதத்திற்குரிய ‘அரச மெய்க்காவலர்’ என்ற செயல்பாட்டு விளக்கத்தை உரைக்குள் சேர்க்காமல் பெயர்களாகவே ஒலிபெயர்க்கிறது.
- source_word: וַיַּרְכִּבוּ
  choice: ஏற்றி
  rationale: רכב என்பதன் ஹிஃபில் வடிவிலுள்ள ‘சவாரி செய்ய வைத்தல்/மேல் ஏற்றுதல்’ என்ற காரணவினைப் பொருளைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: פִּרְדַּת
  choice: கோவேறு கழுதை
  rationale: פִּרְדָּה குறிக்கும் mule என்பதற்கான தெளிவான நவீனத் தமிழ் பெயர்; பெண்பால் வடிவம் குறித்த தகவல் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: தாவீது அரசரின்
  rationale: ‘தாவீது அரசருடைய’ என்ற உடைமைத் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וַיֹּלִכוּ אֹתוֹ
  choice: அவரைக் ... கொண்டுசென்றார்கள்
  rationale: הלך என்பதன் காரணவினை இச்சூழலில் ‘அவரைச் செல்லச் செய்தனர்/கொண்டுசென்றனர்’ எனப் பொருள்படும்; ஊர்வலம் நடந்த விதத்தை தேவையின்றி குறிப்பாக்காமல் இலக்கை நோக்கிய நகர்வைக் காட்டுகிறது.
- source_word: עַל גִּחוֹן
  choice: கீகோனுக்கு
  rationale: இயக்கத்தையும் இடப்பெயரையும் சார்ந்த עַל இங்கு இலக்கைக் குறிக்கும் வகையில் இயல்பான தமிழ் நான்காம் வேற்றுமையால் தரப்படுகிறது.
