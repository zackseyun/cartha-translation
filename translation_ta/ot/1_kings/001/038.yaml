translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க வேதாகமத் தமிழ் பயன்படுத்தப்பட்டுள்ளது. தனிப்பெயர்கள் தமிழில் நிலைபெற்ற வேதாகம ஒலிப்புகளுக்கு நெருக்கமாகத் தரப்பட்டுள்ளன. ‘கிரேத்தியரும் பிலேத்தியரும்’ என்பவை மூலத்தில் உள்ள குழுப்பெயர்களாகவே வைக்கப்பட்டுள்ளன; அவற்றை ‘அரச மெய்க்காவலர்’ என்று உரைக்குள் விளக்கவில்லை.
