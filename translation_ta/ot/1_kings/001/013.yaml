source:
  edition: WLC
  text: לְכִ֞י וּ/בֹ֣אִי אֶל הַ/מֶּ֣לֶךְ דָּוִ֗ד וְ/אָמַ֤רְתְּ אֵלָי/ו֙ הֲ/לֹֽא אַתָּ֞ה אֲדֹנִ֣/י הַ/מֶּ֗לֶךְ נִשְׁבַּ֤עְתָּ לַ/אֲמָֽתְ/ךָ֙ לֵ/אמֹ֔ר כִּֽי שְׁלֹמֹ֤ה בְנֵ/ךְ֙ יִמְלֹ֣ךְ אַחֲרַ֔/י וְ/ה֖וּא יֵשֵׁ֣ב עַל כִּסְאִ֑/י וּ/מַדּ֖וּעַ מָלַ֥ךְ אֲדֹנִיָֽהוּ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/013.yaml
  text: Please go in to King David and say to him[a], ‘My lord the king, did you not swear to your servant, saying, “Solomon your son shall reign after me, and he shall sit on my throne”? Why then has Adonijah become king?’
translation:
  language: ta
  text: நீ அரசர் தாவீதிடம் சென்று அவரிடம், ‘என் ஆண்டவராகிய அரசரே, உமது பணிப்பெண்ணாகிய எனக்குச் சத்தியம் செய்து, “உமக்குப் பின் உமது மகன் சாலொமோன் அரசாள்வான்; அவன் என் அரியணையில் அமர்வான்” என்று கூறினீர் அல்லவா? அப்படியானால் அதோனியா ஏன் அரசனானான்?’ என்று சொல்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְכִי וּבֹאִי
  choice: நீ ... போய்
  rationale: பெண்பால் ஒருமை கட்டளைகளான ‘போ, உள்ளே செல்’ என்ற தொடரை, தமிழில் இயல்பாக ‘போய்’ என வழங்குகிறது; அரசரிடம் செல்வது சூழலிலேயே தெளிவாகிறது.
- source_word: אֶל הַמֶּלֶךְ דָּוִד
  choice: தாவீது அரசரிடம்
  rationale: எபிரெயத் தலைப்பையும் பெயரையும் இயல்பான நவீனத் தமிழ் வரிசையில் தருகிறது.
- source_word: וְאָמַרְתְּ אֵלָיו
  choice: அவரிடம் ... என்று சொல்
  rationale: தொடர்ச்சிக் கட்டளையின் வலிமையை இயல்பான நேரடிக் கூற்றாகப் பேணுகிறது.
- source_word: הֲלֹא
  choice: அல்லவா?
  rationale: ஒப்புதலை எதிர்பார்க்கும் எபிரெய வினாவைத் தமிழின் இயல்பான சொல்லாட்சியில் வெளிப்படுத்துகிறது.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: என் ஆண்டவராகிய அரசரே
  rationale: மனித அரசருக்குரிய மரியாதை விளிப்பைத் தெளிவாகப் பேணுகிறது; இது இறைநாமத்தைக் குறிக்கவில்லை.
- source_word: נִשְׁבַּעְתָּ
  choice: ஆணையிட்டுச் சத்தியம் செய்தீர்
  rationale: இது சாதாரண வாக்குறுதி அல்ல, உறுதிமொழி என்பதை வெளிப்படுத்துகிறது; ‘ஆணையிட்டு’ என்பது இச்சூழலில் solemn oath என்ற கருத்தை இயல்பாகத் தருகிறது.
- source_word: לַאֲמָתְךָ
  choice: உமது பணிப்பெண்ணாகிய எனக்கு
  rationale: மூலத்தில் உள்ள பெண்பால் தாழ்மையான சுயக்குறிப்பை மறைக்காமல், பத்சேபாளின் அரண்மனைப் பேச்சுக்கேற்றவாறு வழங்குகிறது.
- source_word: לֵאמֹר כִּי
  choice: என்று
  rationale: சத்தியத்தின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது; இங்கு כִּי-க்கு தேவையற்ற ‘நிச்சயமாக’ என்ற வலியுறுத்தலைச் சேர்க்கவில்லை.
- source_word: שְׁלֹמֹה בְנֵךְ
  choice: உமது மகன் சாலொமோன்
  rationale: தமிழில் இயல்பான பெயர்ச்சொல் வரிசையைப் பயன்படுத்துகிறது.
- source_word: יִמְלֹךְ אַחֲרַי
  choice: உமக்குப் பின் ... அரசாள்வான்
  rationale: அரச வாரிசுரிமையையும் ஆட்சிசெய்தலையும் பொருள் கூட்டாமல் பேணுகிறது.
- source_word: וְהוּא יֵשֵׁב עַל כִּסְאִי
  choice: அவனே என் அரியணையில் அமர்வான்
  rationale: தனி எழுவாய்ச் சுட்டின் வலியுறுத்தலை ‘அவனே’ என்றும், அரியணை ஏறும் அரசாட்சிப் படிமத்தை நேரடியாகவும் தருகிறது.
- source_word: וּמַדּוּעַ מָלַךְ אֲדֹנִיָהוּ
  choice: அப்படியானால் அதோனியா அரசனானது ஏன்?
  rationale: முந்தைய சத்தியத்திலிருந்து எழும் விளைவுக் கேள்வியை ‘அப்படியானால்’ வெளிப்படுத்துகிறது; perfect வினையின் நிகழ்ந்த நிலையை ‘அரசனானது’ எனப் பேணுகிறது.
theological_decisions:
- issue: சாலொமோனின் வாரிசுரிமை பற்றிய சத்தியத்தின் உரை
  choice: சத்தியமாக அறிவிக்கப்பட்ட எதிர்கால ஆட்சியாக நேரடியாக மொழிபெயர்க்கப்பட்டது
  alternative: இறைத் தேர்வு அல்லது தீர்க்கதரிசன நிறைவேற்றம் என்று விளக்கமாக விரிவாக்குதல்
  rationale: இந்த வசனம் அரசரின் சத்தியத்தை மட்டுமே மேற்கோள் காட்டுகிறது; அதன் இறையியல் அடிப்படையை மொழிபெயர்ப்புக்குள் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; அரசவைக்குரிய மரியாதையை ‘உமது’, ‘செய்தீர்’, ‘அரசரே’ ஆகிய வடிவங்கள் பேணுகின்றன. மூலத்தின் பெண்பால் சுயக்குறிப்பு பிரதான உரையிலேயே வெளிப்படையாக வைக்கப்பட்டுள்ளது.
