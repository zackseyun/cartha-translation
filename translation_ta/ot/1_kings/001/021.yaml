translation_notes:
  register: நவீன பொதுத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. அரசவை மரியாதைக்கு ‘என் ஆண்டவராகிய அரசர்’ என்பதும், மரணத்தைச் சுட்டும் மூல உருவகத்திற்கு ‘முன்னோர்களோடு துயில்கொள்ளுதல்’ என்பதும் பயன்படுத்தப்பட்டுள்ளன. ‘குற்றவாளிகள்’ சூழலின் அரசியல் ஆபத்தை வெளிப்படுத்துகிறது; ‘பாவிகள்’ என்ற உண்மையான மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
