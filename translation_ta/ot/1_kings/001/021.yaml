base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/021.yaml
  text: And when my lord the king lies down with his fathers[a], I and my son Solomon will be counted as offenders.
translation:
  language: ta
  text: என் ஆண்டவராகிய அரசர் தம் முன்னோர்களோடு துயில்கொள்ளும்போது, நானும் என் மகன் சாலொமோனும் குற்றவாளிகளாகக் கருதப்படுவோம்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பாவிகளாக.” இதற்கான எபிரேயச் சொல் குற்றமுள்ளவர்களாக அல்லது பழிக்குரியவர்களாகக் கருதப்படுவோரைக் குறிக்கலாம்; இங்கு பொதுவான ஒழுக்கநிலையைவிடச் சட்டம் மற்றும் அரசியல் சார்ந்த நிலையே சூழலுக்குப் பொருத்தமாகத் தெரிகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: கருதப்படுவோம்
  rationale: இது பத்சேபாள் அஞ்சும் விளைவை அறிமுகப்படுத்துகிறது; தமிழில் தனியே ‘அப்போது நிகழும்’ என்று மரபுத்தொடரைப் பின்பற்றாமல், இயல்பான எதிர்கால வாக்கியமாகத் தரப்பட்டுள்ளது.
- source_word: כִּשְׁכַב
  choice: துயில்கொள்ளும்போது
  rationale: שׁכב என்பது ‘முன்னோர்களோடு’ என்ற தொடருடன் மரணத்தைக் குறிக்கும் மரபுத்தொடர். ‘துயில்கொள்ளுதல்’ மூல உருவகத்தையும் மரியாதையான தொனியையும் காக்கிறது.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: என் ஆண்டவராகிய அரசர்
  rationale: தாவீதிடம் பேசும் அரசவை மரியாதையையும் தனிப்பட்ட பணிவையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: עִם אֲבֹתָיו
  choice: தம் முன்னோர்களோடு
  rationale: இறந்த மூதாதையரோடு சேர்வதைக் குறிக்கும் எபிரேய மரபுத்தொடரின் குடும்ப மற்றும் மரணப் பொருளைத் தெளிவாகக் காக்கிறது.
- source_word: וְהָיִיתִי אֲנִי
  choice: நானும் ... கருதப்படுவோம்
  rationale: இங்கு ‘இருப்போம்’ என்பது சமூக அல்லது அரசியல் நிலையாக மதிக்கப்படுதலைக் குறிக்கிறது; ‘கருதப்படுவோம்’ அந்த மறைபொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וּבְנִי שְׁלֹמֹה
  choice: என் மகன் சாலொமோனும்
  rationale: உறவையும் பெயரையும் நேரடியாகக் காக்கிறது; ‘-உம்’ இணைப்பால் பத்சேபாளும் சாலொமோனும் ஒரே ஆபத்துக்கு உட்படுவது தெளிவாகிறது.
- source_word: חַטָּאִים
  choice: குற்றவாளிகள்
  rationale: சொல் ‘பாவிகள்’ என்றும் பொருள்படலாம்; ஆனால் அரச வாரிசுரிமைச் சூழலில் குற்றஞ்சாட்டப்பட்டு தண்டனைக்கு உரியவர்களாக நடத்தப்படும் சட்ட-அரசியல் நிலையே முன்னிலையில் உள்ளது.
