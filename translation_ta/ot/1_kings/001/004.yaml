  source_fidelity: 'முதன்மை உரை எபிரெய மூலத்தை நன்றாகப் பின்பற்றுகிறது: இளம்பெண்ணின் மிகுந்த அழகு, அரசனுக்கான சேவைப் பங்கு, அவனுக்குப் பணிவிடை செய்தல், மற்றும் பாலுறவைக் குறிக்கும் ‘அறிதல்’ மறைமுகச் சொல்லாட்சி ஆகியவை காக்கப்பட்டுள்ளன. ‘பணிப்பெண்’ என்பது סֹכֶנֶת என்பதன் சேவை/அருகிருப்பு சார்ந்த பங்கிற்கு ஏற்ற பாதுகாப்பான தெரிவாகும்.'
