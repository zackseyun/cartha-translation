base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/004.yaml
  text: The young woman was very beautiful[a], and she became the king’s attendant and served him, but the king did not know her.
translation:
  language: ta
  text: அந்த இளம்பெண் மிகவும் அழகாக இருந்தாள். அவள் அரசனின் பணிப்பெண்ணாக இருந்து, அவனுக்குப் பணிவிடை செய்தாள். ஆனால் அரசன் அவளை அறியவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, ‘அவளுடன் பாலுறவு கொள்ளவில்லை.’ இங்கு எபிரெய வினைச்சொல் பாலுறவைக் குறிக்கும் மறைமுகச் சொல்லாட்சியாகப் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּעֲרָה
  choice: அந்த இளம்பெண்
  rationale: נַעֲרָה என்பது இளம் பெண்ணைக் குறிக்கிறது. ‘இளம்பெண்’ என்பது வயதைத் தேவையின்றிக் குறைத்துக் காட்டாமலும் பழமையான நடையின்றியும் இயல்பாக உள்ளது.
- source_word: יָפָה עַד מְאֹד
  choice: மிகவும் அழகாக இருந்தாள்
  rationale: עַד מְאֹד அழகின் அளவை வலுப்படுத்துகிறது; ‘மிகவும் அழகாக’ என்பது அந்த வலியுறுத்தலை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: סֹכֶנֶת
  choice: பணிப்பெண்
  rationale: இச்சொல் அரசனுக்கு அருகிருந்து உதவி செய்யும் சேவைப் பொறுப்பைக் குறிக்கிறது. ‘பணிப்பெண்’ சூழலுக்கேற்றது; ‘செவிலி’ மருத்துவப் பராமரிப்பைத் தேவையின்றி குறிப்பாக்கிவிடும்.
- source_word: וַתְּשָׁרְתֵהוּ
  choice: அவனுக்குப் பணிவிடை செய்தாள்
  rationale: שרת என்பது சேவை செய்வதைக் குறிக்கிறது. ‘பணிவிடை செய்தாள்’ அரசவைக் கதைநடைக்கு ஏற்ற, தெளிவான தமிழ்.
- source_word: יְדָעָהּ
  choice: அவளை அறியவில்லை
  rationale: ידע இங்கு பாலுறவைக் குறிக்கும் மறைமுகச் சொல்லாட்சி. மூலத்தின் இலக்கியச் சொல்லாட்சியை முதன்மை உரையில் காத்து, அதன் பொருளை அடிக்குறிப்பு தெளிவாக்குகிறது.
theological_decisions:
- issue: கதை விவரிப்பில் பாலுறவைக் குறிக்கும் மறைமுகச் சொல்லாட்சி
  choice: ‘அவளை அறியவில்லை’ என்பதை முதன்மை உரையில் வைத்து, அடிக்குறிப்பில் பாலியல் பொருளை விளக்குதல்
  alternative: ‘அவளுடன் பாலுறவு கொள்ளவில்லை’ என்று முதன்மை உரையிலேயே வெளிப்படையாக மொழிபெயர்த்தல்
  rationale: இது எபிரெய மூலத்தின் மறைமுகச் சொல்லாட்சியையும் இலக்கிய இறுக்கத்தையும் காக்கிறது; அதேவேளையில் தாவீதுக்கும் அபிஷாகுக்கும் பாலுறவு நிகழவில்லை என்ற கதைசார் கருத்தை அடிக்குறிப்பு ஐயமின்றித் தெளிவாக்குகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் பாலியல் மறைமுகச் சொல்லாட்சி முதன்மை உரையில் பாதுகாக்கப்பட்டு, அதன் நோக்கப்பட்ட பொருள் அடிக்குறிப்பில் தெளிவுபடுத்தப்பட்டுள்ளது.
