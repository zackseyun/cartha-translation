base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/025.yaml
  text: For he has gone down today and sacrificed oxen[a], fattened calves, and sheep in abundance, and he has invited all the king’s sons, the commanders of the army, and Abiathar the priest. And look, they are eating and drinking before him, and they are saying[b], ‘Long live King Adonijah!’
translation:
  language: ta
  text: ஏனெனில், அவன் இன்று கீழே இறங்கி[a], காளைகளையும் கொழுத்த கால்நடைகளையும் ஆடுகளையும் ஏராளமாகப் பலியிட்டிருக்கிறான். அரசனுடைய மகன்கள் அனைவரையும், படைத்தலைவர்களையும், ஆசாரியனாகிய அபியத்தாரையும் அழைத்திருக்கிறான். இதோ, அவர்கள் அவனுக்கு முன்பாக உண்டும் குடித்தும், “அதோனியா அரசர் நீடூழி வாழ்க!” என்று சொல்லிக்கொண்டிருக்கிறார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கீழே இறங்கி” என்பது எபிரேய வினைச்சொல்லிலுள்ள கீழ்நோக்கிய இடப்பெயர்ச்சியைப் பாதுகாக்கிறது; “இன்று கீழே சென்றான்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரேயத்தில் சொற்சொல்லாக, “அதோனியா என்னும் அரசன் வாழ்வாராக” என்ற அரச வாழ்த்து. தமிழில் இயல்பாக, “அதோனியா அரசர் நீடூழி வாழ்க!” என்று தரப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட எச்சரிக்கைக்கான காரணத்தை அறிமுகப்படுத்துவதால், காரணத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יָרַד הַיּוֹם
  choice: இன்று கீழே இறங்கிப்போய்
  rationale: יָרַד என்பதிலுள்ள கீழ்நோக்கிய இடப்பெயர்ச்சியை மறைக்காமல், நவீன தமிழில் இயல்பாகத் தருகிறது.
- source_word: וַיִּזְבַּח
  choice: பலியிட்டிருக்கிறான்
  rationale: இது விருந்துக்காக விலங்குகளைக் கொல்வதை மட்டும் அல்லாமல் பலிச் சடங்கையும் குறிக்கிறது; அண்மையில் நடந்த செயலின் தற்போதைய பொருத்தத்தையும் தமிழ் நிறைவுவினை உணர்த்துகிறது.
- source_word: שׁוֹר וּמְרִיא וְצֹאן
  choice: காளைகளையும் கொழுத்த மாடுகளையும் ஆடுகளையும்
  rationale: பட்டியலின் மூன்று பிரிவுகளையும் தனித்தனியாக வைத்திருக்கிறது. מְרִיא என்பது கொழுக்கவைக்கப்பட்ட கால்நடையைக் குறிக்கிறது; கன்று என்று வயதைத் தேவையின்றிக் குறிப்பதில்லை. צֹאן என்பதன் விரிவான பொருள் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: לָרֹב
  choice: ஏராளமாக
  rationale: பலிக்கான விலங்குகள் மிகுந்த எண்ணிக்கையில் இருந்ததைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וַיִּקְרָא
  choice: அழைத்திருக்கிறான்
  rationale: לְ உடன் வரும் קרא இங்கு விருந்துக்கு வருமாறு அழைத்தல் அல்லது வரவழைத்தல் என்னும் பொருளைக் கொண்டுள்ளது.
- source_word: שָׂרֵי הַצָּבָא
  choice: படைத்தலைவர்கள்
  rationale: இராணுவத்தின் தலைமை அதிகாரிகளைக் குறிக்கும் தெளிவான நவீனத் தமிழ் சொல்.
- source_word: וְהִנָּם
  choice: இதோ, அவர்கள்
  rationale: அப்போது நடைபெறும் காட்சியின்மீது கவனத்தை ஈர்க்கும் எபிரேயச் சொல்லின் உரையாடல் வலிமையைப் பாதுகாக்கிறது.
- source_word: יְחִי הַמֶּלֶךְ אֲדֹנִיָּהוּ
  choice: அதோனியா அரசர் நீடூழி வாழ்க!
  rationale: அரசரை வாழ்த்தும் எபிரேய விருப்பவாக்கியத்தை இயல்பான தமிழ் அரச வாழ்த்தாகத் தருகிறது.
theological_decisions:
- issue: அதோனியாவை அரசனாக வாழ்த்துதல்
  choice: “அதோனியா அரசர் நீடூழி வாழ்க!” என்ற நேரடி வாழ்த்தாகவே மொழிபெயர்க்கப்பட்டது.
  alternative: அதோனியா உண்மையிலேயே சட்டபூர்வ அரசன் என்று விளக்கமாகச் சேர்த்தல் அல்லது அவன் போலி அரசன் என்று குறித்தல்.
  rationale: மூலவசனம் விருந்தினர்கள் கூறிய அரச வாழ்த்தை மட்டும் பதிவு செய்கிறது; அதோனியாவின் உரிமைக் கோரிக்கையை இங்கே ஆதரிக்கவோ மறுக்கவோ மொழிபெயர்ப்பு கூடுதல் தீர்ப்பைச் சேர்க்கக்கூடாது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கண்ணியமான ஆனால் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. தொடர்ச்சியான எபிரேய வாக்கியத்தை வாசிப்புத் தெளிவுக்காக மூன்று தமிழ் வாக்கியங்களாகப் பிரித்துள்ளோம். “இதோ” என்பது கவன ஈர்ப்பைத் தக்கவைக்கிறது; “ஆசாரியனாகிய அபியத்தார்” வேதாகமத் தமிழ் மரபையும் இயல்பான அடையாள அமைப்பையும் இணைக்கிறது.
