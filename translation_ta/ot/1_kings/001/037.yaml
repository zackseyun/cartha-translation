source:
  edition: WLC
  text: כַּ/אֲשֶׁ֨ר הָיָ֤ה יְהוָה֙ עִם אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ כֵּ֖ן יהי עִם שְׁלֹמֹ֑ה וִֽ/יגַדֵּל֙ אֶת כִּסְא֔/וֹ מִ֨/כִּסֵּ֔א אֲדֹנִ֖/י הַ/מֶּ֥לֶךְ דָּוִֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/037.yaml
  text: Just as Yahweh has been with my lord the king[a], so may he be with Solomon and make his throne greater than the throne of my lord King David.
translation:
  language: ta
  text: யாவே என் ஆண்டவராகிய அரசரோடு இருந்ததுபோல, அவர் சாலொமோனோடும் இருப்பாராக[a]; அவருடைய அரியணையை என் ஆண்டவராகிய தாவீது அரசரின் அரியணையைவிட மேலானதாக ஆக்குவாராக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவர்” என்பதற்குப் பதிலாக, “யாவே சாலொமோனோடும் இருப்பாராக” என்றும் வெளிப்படையாக மொழிபெயர்க்கலாம். எபிரேய விருப்பவினையில் எழுவாய் கூறப்படாமல் உள்ளது; அது முந்தைய கூறிலுள்ள யாவேயைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் இயல்பாக ஒலிபெயர்த்துள்ளது.
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: இருந்ததுபோல ... இருப்பாராக
  rationale: கடந்த காலத்தில் தாவீதோடு இருந்த இறைத் துணையையும் சாலொமோனுக்கான வாழ்த்தையும் ஒப்பிடும் எபிரேய இணை அமைப்பைப் பாதுகாக்கிறது.
- source_word: הָיָה ... עִם
  choice: '...ஓடு இருந்ததுபோல'
  rationale: ஒருவருடன் இருந்து துணைநிற்கும் பொருளை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: என் ஆண்டவராகிய அரசர்
  rationale: அரண்மனைச் சூழலுக்குரிய மரியாதைச் சொல்லையும் அரச பட்டத்தையும் இரண்டையும் தக்கவைக்கிறது.
- source_word: יהי
  choice: அவர் ... இருப்பாராக
  rationale: வாழ்த்து அல்லது வேண்டுதலைக் குறிக்கும் எபிரேய விருப்பவினையைத் தமிழின் ‘-ஆராக’ வடிவில் தருகிறது; எழுவாய் முந்தைய கூறிலுள்ள யாவேயைக் குறிக்கும் வகையில் சுட்டுப்பெயராக விடப்பட்டுள்ளது.
- source_word: וִיגַדֵּל
  choice: மேன்மைப்படுத்துவாராக
  rationale: ஹிபில் வடிவின் ‘பெரிதாக்கு/உயர்த்திவை’ என்ற காரணப் பொருளை அரியணை மற்றும் ஆட்சிச் சூழலுக்கு ஏற்றவாறு வெளிப்படுத்துகிறது.
- source_word: כִּסְאוֹ
  choice: அவனுடைய அரியணை
  rationale: ஆட்சியைக் குறிப்பதற்கான உருவகப் பொருள் இருந்தாலும், மூலத்தின் நேரடியான ‘அரியணை’ உருவத்தைப் பாதுகாக்கிறது.
- source_word: מִכִּסֵּא
  choice: அரியணையைவிட
  rationale: מן முன்னிடைச்சொல் குறிக்கும் ஒப்பீட்டைத் தமிழில் தெளிவான ‘-விட’ அமைப்பால் வெளிப்படுத்துகிறது.
- source_word: אֲדֹנִי הַמֶּלֶךְ דָּוִד
  choice: என் ஆண்டவராகிய தாவீது அரசர்
  rationale: தாவீதுக்கான பணிவான அழைப்பையும் அவரது அரச பட்டத்தையும் இயல்பான தமிழ் சொல்வரிசையில் தக்கவைக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: ஆண்டவர் / யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட இறைத் திருப்பெயர் நேரடியாக வருவதால், அதை ஒரு பட்டத்தால் மாற்றாமல் ஒலிபெயர்ப்பாக வழங்குகிறது.
- issue: יהי மற்றும் וִיגַדֵּל ஆகிய விருப்பவினைகளின் மறைமுக எழுவாய்
  choice: இரண்டிற்கும் யாவேயே எழுவாய் எனச் சுட்டுப்பெயரால் தொடர்தல்
  alternative: இரண்டாவது வினைக்கு சாலொமோனை எழுவாயாகப் புரிந்துகொள்ளுதல்
  rationale: முந்தைய கூறில் வெளிப்படையாக வரும் யாவே இயல்பாகத் தொடரும் எழுவாய்; வினை வடிவங்களும் வாழ்த்து/வேண்டுதல் தொடராக அமைகின்றன. எனினும் எபிரேயத்தில் எழுவாய் மீண்டும் வெளிப்படையாகக் கூறப்படவில்லை என்பதைக் குறிப்பில் தெரிவிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் அரசவைக் கூற்றுக்குரிய கண்ணியத்துடனும் அமைக்கப்பட்டுள்ளது. ‘ஆண்டவர்’ மரியாதை அழைப்பாகவும் ‘அரசர்’ பட்டமாகவும் வேறுபடுத்தப்பட்டுள்ளன; இறைத் திருப்பெயருக்கு ‘யாவே’ பயன்படுத்தப்பட்டுள்ளது.
