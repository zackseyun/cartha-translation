base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/047.yaml
  text: And the king’s servants also came to bless our lord King David[a], saying, ‘May your God make Solomon’s name better than your name[b], and may he make his throne greater than your throne.’ And the king bowed himself on the bed.
translation:
  language: ta
  text: அரசரின் பணியாளர்களும் நம் ஆண்டவரான தாவீது அரசருக்கு ஆசி கூற வந்தனர். அவர்கள், “உங்கள் கடவுள் சாலொமோனின் பெயரை[a] உங்கள் பெயரைவிடச் சிறப்புமிக்கதாகவும், அவனுடைய அரியணையை உங்கள் அரியணையைவிட மேன்மையானதாகவும் ஆக்குவாராக” என்றனர். அரசரும் படுக்கையின்மேல் பணிந்தார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு ‘பெயர்’ என்பது புகழ் அல்லது நற்பெயரையும் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘அரசர் படுக்கையின்மேல் வழிபட்டார்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய வினை, சூழலைப் பொறுத்து பணிதலையோ வழிபாட்டையோ குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם
  choice: …உம்
  rationale: முந்தைய செய்தியுடன் இதை இணைக்கும் எபிரெயச் சேர்க்கைப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: עַבְדֵי הַמֶּלֶךְ
  choice: அரசரின் பணியாளர்கள்
  rationale: அரண்மனைச் சூழலில் அரசருக்குப் பணிபுரிபவர்கள் அல்லது அதிகாரிகள் என்ற பரந்த பொருளைத் தருகிறது; இங்கு அடிமைநிலையைத் தேவையின்றி முன்னிறுத்தவில்லை.
- source_word: לְבָרֵךְ
  choice: ஆசி கூற
  rationale: தாவீதிடம் சொல்லப்பட்ட முறையான நல்வாழ்த்தின் ஆசிப்பொருளைப் பாதுகாக்கிறது; வெறும் பாராட்டாகக் குறுக்கவில்லை.
- source_word: אֲדֹנֵינוּ הַמֶּלֶךְ דָּוִד
  choice: நம் ஆண்டவரான தாவீது அரசர்
  rationale: அரசவைக்குரிய மரியாதை அடைமொழியை இயல்பான, கண்ணியமான தமிழில் தருகிறது.
- source_word: יֵיטֵב אֱלֹהֶיךָ אֶת שֵׁם שְׁלֹמֹה מִשְּׁמֶךָ
  choice: உங்கள் கடவுள் சாலொமோனின் பெயரை உங்கள் பெயரைவிடச் சிறப்புமிக்கதாக ஆக்குவாராக
  rationale: காரணவினை மற்றும் ஒப்பீட்டுப் பொருளைப் பாதுகாப்பதோடு, ‘பெயர்’ என்ற மூல உருவகத்தையும் தக்கவைக்கிறது.
- source_word: וִיגַדֵּל אֶת כִּסְאוֹ מִכִּסְאֶךָ
  choice: அவனுடைய அரியணையை உங்கள் அரியணையைவிட மேன்மையானதாக ஆக்குவாராக
  rationale: அரசாட்சி மற்றும் வம்சத் தொடர்ச்சியின் உருவகமான ‘அரியணை’யையும் ஒப்பீட்டையும் தெளிவாகத் தருகிறது.
- source_word: וַיִּשְׁתַּחוּ הַמֶּלֶךְ
  choice: அரசர் … தலைவணங்கினார்
  rationale: வினை குறிக்கும் உடல் செயலைத் தருகிறது; இச்சொற்றொடரில் வெளிப்படையாகக் கூறப்படாத வழிபாட்டின் இலக்கை மொழிபெயர்ப்பில் சேர்க்கவில்லை.
- source_word: עַל הַמִּשְׁכָּב
  choice: படுக்கையின்மேல்
  rationale: எபிரெயச் சொல்லின் நேரடியான இடப்பொருளைத் தக்கவைக்கிறது; மூலத்தில் இல்லாத உடைமைச் சொல்லைச் சேர்க்கவில்லை.
theological_decisions:
- issue: וַיִּשְׁתַּחוּ என்பது உடலைத் தாழ்த்துவதையா அல்லது கடவுளை வழிபடுவதையா குறிக்கிறது?
  choice: அரசர் படுக்கையின்மேல் தலைவணங்கினார்
  alternative: அரசர் படுக்கையின்மேல் கடவுளை வழிபட்டார்
  rationale: எபிரெய வினை தலைவணங்குதல் அல்லது வழிபடுதல் ஆகிய இரண்டையும் குறிக்கலாம். இவ்வாக்கியத்தில் அதன் இலக்கு வெளிப்படையாகக் கூறப்படாததால், உடல் செயலை மொழிபெயர்த்து, வழிபாட்டுப் பொருளை அடிக்குறிப்பில் திறந்தவாறு வைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் அரசவைக் காட்சிக்கேற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘பெயர்’, ‘அரியணை’ ஆகிய மூல உருவகங்கள் பாதுகாக்கப்பட்டுள்ளன; தெளிவுக்காக தேவையற்ற இறையியல் விளக்கம் உரைக்குள் சேர்க்கப்படவில்லை.
