base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/005.yaml
  text: Adonijah the son of Haggith exalted himself[a], saying, “I will reign.” So he made for himself a chariot, horsemen[b], and fifty men running before him.
translation:
  language: ta
  text: ஆகீத்தின் மகன் அதோனியா, “நான் அரசாளுவேன்” என்று சொல்லித் தன்னை உயர்த்திக்கொண்டான்.[a] அவன் தனக்காக ஒரு தேரையும் குதிரைவீரர்களையும், தனக்கு முன்னால் ஓடும் ஐம்பது ஆண்களையும் ஏற்பாடு செய்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தன்னை முன்னிறுத்திக்கொண்டான்,” அல்லது “தன்னைப் பெரியவனாக்கிக்கொண்டான்.” எபிரெய வினைச்சொல் தன்னைத்தானே உயர்த்திக்கொள்ளும் கருத்தைக் கொண்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִתְנַשֵּׂא
  choice: தன்னை உயர்த்திக்கொண்டான்
  rationale: התפעל வடிவின் தன்முனைப்பு மற்றும் தன்னைத்தானே உயர்த்தும் எதிர்மறை நுண்ணுணர்வை நேரடியாகப் பாதுகாக்கிறது.
- source_word: לֵאמֹר אֲנִי אֶמְלֹךְ
  choice: “நான் அரசாளுவேன்” என்று சொல்லி
  rationale: מלך என்பதன் வினைச்சொல் இயல்பையும், அரசாட்சியைத் தனக்கெனக் கோரும் கூற்றையும் காக்கிறது.
- source_word: וַיַּעַשׂ לוֹ
  choice: தனக்காக ... ஏற்பாடு செய்தான்
  rationale: עשה என்பதன் சூழல்சார் பொருளை இயல்பான தமிழில் அளிக்கிறது; அவற்றை அவன் எவ்வாறு பெற்றான் என்று தேவையின்றி தீர்மானிப்பதில்லை.
- source_word: רֶכֶב
  choice: ஒரு தேர்
  rationale: எபிரெய ஒருமையைப் பாதுகாத்து, அரச அணிவகுப்பில் பயன்படுத்தப்பட்ட வாகனத்தைச் சுட்டுகிறது.
- source_word: פָרָשִׁים
  choice: குதிரைவீரர்கள்
  rationale: ஏறிச் செல்லும் குதிரை வீரர்களைக் குறிக்கும் பன்மையை இயல்பாகவும் தெளிவாகவும் தருகிறது.
- source_word: חֲמִשִּׁים אִישׁ
  choice: ஐம்பது ஆண்கள்
  rationale: אִישׁ என்பதன் ஆண்பால் குறிப்பைத் தக்கவைக்கிறது.
- source_word: רָצִים לְפָנָיו
  choice: தனக்கு முன்னால் ஓடுவதற்கு
  rationale: அவனுக்கு முன்னால் ஓடும் அரச அணிவகுப்புப் பணியை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: அதோனியாவின் செயல் எவ்வாறு சித்தரிக்கப்படுகிறது
  choice: தன்னை உயர்த்திக்கொண்டான்
  alternative: தன்னை முன்னிறுத்திக்கொண்டான் / தன்னைப் பெரியவனாக்கிக்கொண்டான்
  rationale: அவனுடைய தவறான அரச ஆசையை உரை மறைமுகமாக விமர்சிப்பதைப் பாதுகாக்கிறது; ஆனால் மூலத்தில் இல்லாத வெளிப்படையான நெறித்தீர்ப்பைச் சேர்ப்பதில்லை.
- issue: அரச அணிவகுப்பில் பாலினக் குறிப்பு
  choice: ஐம்பது ஆண்கள்
  alternative: ஐம்பது பேர் / ஐம்பது ஓட்டக்காரர்கள்
  rationale: மூலத்திலுள்ள אִישׁ என்ற வெளிப்படையான ஆண்பால் சொல்லைத் துல்லியமாகத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ஆரம்ப வாவுக்கு தனியாக ‘இப்போது’ போன்ற காலச்சொல் சேர்க்கப்படவில்லை. ‘நான் அரசாளுவேன்’ என்பது வினைச்சொல் வடிவத்தைப் பாதுகாக்கிறது. அடிக்குறிப்பு குறியீடு உரையில் சரியாக இடம்பெற்றுள்ளது.
