base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/040.yaml
  text: And all the people went up after him[a], and the people were playing flutes and rejoicing with great joy[b], and the earth split apart at their sound.
translation:
  language: ta
  text: மக்கள் அனைவரும் அவனுக்குப் பின்னால் ஏறிச் சென்றார்கள்; அவர்கள் குழல்களை ஊதிக்கொண்டு[a] மிகுந்த மகிழ்ச்சியுடன் களிகூர்ந்தார்கள்; அவர்களுடைய ஒலியால் பூமி பிளந்தது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘குழல்கள்’ என்பதற்கு ‘ஊதுகுழல்கள்’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் குழல் போன்ற பலவகைக் காற்றிசைக் கருவிகளைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: ‘பூமி பிளந்தது’ என்பது கொண்டாட்டத்தின் அளவுகடந்த ஒலியை விவரிக்கும் மிகைப்படுத்தலாக இருக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: ஏறிச் சென்றார்கள்
  rationale: עלה என்பதன் அடிப்படைப் பொருளான மேல்நோக்கிய இயக்கத்தைப் பேணுகிறது; ஊர்வலச் சூழலில் இயல்பான தமிழாகவும் உள்ளது.
- source_word: כָל הָעָם
  choice: மக்கள் அனைவரும்
  rationale: כָל உடன் வரும் கூட்டுப்பெயரின் முழுமையைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: אַחֲרָיו
  choice: அவனுக்குப் பின்னால்
  rationale: ஊர்வலத்தில் ஒருவரைப் பின்தொடர்வதைக் குறிக்கும் எபிரெயச் சொல்லின் இடவியல் தன்மையைப் பேணுகிறது.
- source_word: מְחַלְּלִים בַּחֲלִלִים
  choice: குழல்களை ஊதிக்கொண்டு
  rationale: இங்கு வினையெச்சம் காற்றிசைக் கருவிகளை வாசிப்பதையும் חֲלִילִים குழல் வகைக் கருவிகளையும் குறிக்கின்றன; தமிழில் குழலை ‘ஊதுதல்’ இயல்பான சொல்லாட்சி.
- source_word: וּשְׂמֵחִים שִׂמְחָה גְדוֹלָה
  choice: மிகுந்த மகிழ்ச்சியுடன் களிகூர்ந்தார்கள்
  rationale: ஒரே வேரிலிருந்து வரும் வினை–பெயர் அமைப்பின் வலியுறுத்தலை இயல்பான தமிழில் ‘மிகுந்த மகிழ்ச்சியுடன்’ என்பதன் மூலம் காக்கிறது.
- source_word: וַתִּבָּקַע הָאָרֶץ
  choice: பூமியே பிளந்துபோனது
  rationale: בקע என்பதன் வலுவான ‘பிளத்தல்’ படிமத்தைத் தணிக்காமல் தருகிறது; ‘-ஏ’ கொண்ட வலியுறுத்தல் கொண்டாட்டத்தின் பேரொலியைச் சித்தரிக்கும் மிகைப்படுத்தலை வெளிப்படுத்துகிறது.
- source_word: בְּקוֹלָם
  choice: அவர்களுடைய பேரொலியால்
  rationale: קוֹל என்பது குரல், இசைக்கருவிகளின் ஓசை, மொத்தச் சத்தம் ஆகியவற்றைக் குறிக்கலாம்; இச்சூழலில் ‘பேரொலி’ கூட்டத்தையும் குழல்களையும் உள்ளடக்குகிறது.
