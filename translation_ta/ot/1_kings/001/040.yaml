translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய உரையின் தொடர்ச்சியான வாக்கிய ஓட்டம் தமிழில் வாசிப்புத் தெளிவுக்காக மூன்று வாக்கியங்களாகப் பிரிக்கப்பட்டது; மேல்நோக்கிய இயக்கம், இசைக் கொண்டாட்டம், பூமி பிளக்கும் படிமம் ஆகியவை பேணப்பட்டுள்ளன.
