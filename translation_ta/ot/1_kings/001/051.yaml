source:
  edition: WLC
  text: וַ/יֻּגַּ֤ד לִ/שְׁלֹמֹה֙ לֵ/אמֹ֔ר הִנֵּה֙ אֲדֹ֣נִיָּ֔הוּ יָרֵ֖א אֶת הַ/מֶּ֣לֶךְ שְׁלֹמֹ֑ה וְ֠/הִנֵּה אָחַ֞ז בְּ/קַרְנ֤וֹת הַ/מִּזְבֵּ֨חַ֙ לֵ/אמֹ֔ר יִשָּֽׁבַֽע לִ֤/י כַ/יּוֹם֙ הַ/מֶּ֣לֶךְ שְׁלֹמֹ֔ה אִם יָמִ֥ית אֶת עַבְדּ֖/וֹ בֶּ/חָֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/051.yaml
  text: And it was reported to Solomon, saying, “Look, Adonijah fears King Solomon, and look, he has taken hold of the horns of the altar, saying, ‘Let King Solomon swear to me today that he will not put his servant to death with the sword.’”
translation:
  language: ta
  text: 'அப்போது சாலொமோனிடம் இவ்வாறு தெரிவிக்கப்பட்டது: “இதோ, அதோனியா சாலொமோன் அரசருக்குப் பயப்படுகிறான்; இதோ, அவன் பலிபீடத்தின் கொம்புகளைப் பற்றிக்கொண்டிருக்கிறான். ‘சாலொமோன் அரசர் இன்று எனக்குச் சத்தியம் செய்யட்டும்; தம் அடியவனை வாளால் கொல்லமாட்டேன் என்று’ என்கிறான்.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் எபிரேயச் சொல்லின் வலிமையை இயல்பான, dignified Tamil வடிவில் இரு இடங்களிலும் பிரதிபலிக்கிறது; இரண்டாவது இடத்தில் தமிழ் ஓட்டத்திற்காக தனியே மீண்டும் இடாமல் வாக்கிய அமைப்பில் உட்பொருளாக்கப்பட்டுள்ளது.
- source_word: יָרֵא אֶת
  choice: …க்குப் பயந்து
  rationale: அதோனியா சாலொமோனைக் குறித்து அஞ்சுகிறான் என்ற நேரடியான பொருளைப் பாதுகாக்கிறது.
- source_word: קַרְנוֹת הַמִּזְבֵּחַ
  choice: பலிபீடத்தின் கொம்புகள்
  rationale: பலிபீடத்தின் மூலைகளிலிருந்த கொம்புப் போன்ற நீட்சிகளைக் குறிக்கும் வரலாற்று-வழிபாட்டு சொல்லாட்சியை முறையாகப் பாதுகாக்கிறது.
- source_word: יִשָּׁבַע לִי כַיּוֹם
  choice: இன்று எனக்கு ஆணையிட்டு
  rationale: சத்தியம் செய்து உறுதியளிக்க வேண்டும் என்ற கோரிக்கையையும் כַיּוֹם என்பதன் ‘இன்று/இப்போதே’ என்ற அவசரத்தையும் இயல்பான தமிழில் தருகிறது.
- source_word: אִם יָמִית
  choice: கொல்லமாட்டேன் என்று
  rationale: ஆணைச் சூத்திரத்திற்குப் பின் வரும் எபிரேய אִם எதிர்மறை உறுதிமொழியைக் குறிக்கிறது; தமிழில் அதன் செயல்பாட்டு பொருளைத் தெளிவாகக் கொடுக்கிறது.
- source_word: עַבְדּוֹ
  choice: தம் அடியவனை
  rationale: அதோனியா தன்னை அரசரின் கீழ்ப்பட்ட அடியவனாக மூன்றாம் நபரில் குறிப்பிடும் பணிவான சொல்லாட்சியைப் பாதுகாக்கிறது.
theological_decisions:
- issue: பலிபீடத்தின் கொம்புகளைப் பற்றிக்கொண்ட செயலின் பொருள்
  choice: செயலை மட்டும் நேரடியாக மொழிபெயர்த்தல்
  alternative: இது அடைக்கலம் கோருதல் என்று உரையிலேயே விளக்குதல்
  rationale: மூல வசனம் செயலை விவரிக்கிறது; அதன் சட்ட அல்லது வழிபாட்டு விளக்கத்தை வெளிப்படையாகச் சேர்ப்பதில்லை. ஆகவே விளக்கத்தை மொழிபெயர்ப்பில் இறக்குமதி செய்யவில்லை.
- issue: அதோனியாவின் பயம்
  choice: ‘சாலொமோன் அரசருக்குப் பயந்து’
  alternative: ‘சாலொமோன் அரசரை மதித்து’
  rationale: יָרֵא இச்சூழலில் உயிருக்கு அஞ்சும் பயத்தைக் குறிக்கிறது; ‘மதிப்பு’ என்று மென்மையாக்குவது நிகழ்ச்சியின் பதற்றத்தை இழக்கும்.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் வடிவமைக்கப்பட்டது. அரசவைக் சூழலைப் பிரதிபலிக்க ‘அரசர்’, பணிவான தன்னைக்குறிப்பதற்கு ‘அடியவன்’, உறுதிமொழிக்கு ‘ஆணையிட்டு’ பயன்படுத்தப்பட்டுள்ளன. நேரடி உரையின் அடுக்குகள் தெளிவாக வைக்கப்பட்டுள்ளன.
