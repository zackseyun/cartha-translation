  rationale: மூலத்தில் இறைவனின் தனிப்பெயர் நேரடியாக உள்ளது; ஆகவே அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது.
