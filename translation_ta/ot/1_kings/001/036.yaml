  text: Benaiah son of Jehoiada answered the king and said[a], “Amen! May Yahweh, the God of my lord the king, say so.”
translation:
  language: ta
  text: யெகோயாதாவின் மகன் பெனாயா அரசனுக்குப் பதிலளித்து, “ஆமென்! என் ஆண்டவராகிய அரசனின் கடவுளான யாவே அவ்வாறே சொல்லட்டும்[a]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆமென்! என் ஆண்டவராகிய அரசனின் கடவுளான யாவே அவ்வாறே சொல்வாராக.” எபிரேய வினைச்சொல் சொற்படியாக ‘சொல்’ எனப் பொருள்படும்; இங்கு அரசனின் விருப்பத்தை உறுதிப்படுத்துதல் அல்லது ஆணையிடுதல் என்ற கருத்தையும் தரலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן
  choice: பதிலளித்து
  rationale: ענה என்பதன் வழக்கமான கதைநடைப் பொருள் ‘பதில் அளித்தல்’; அரசவைக் கலந்துரையாடலில் இயல்பாக அமைகிறது.
- source_word: בְּנָיָהוּ בֶן יְהוֹיָדָע
  choice: யெகோயாதாவின் மகன் பெனாயா
  rationale: எபிரேயப் பெயர்கள் தமிழில் ஒலிபெயர்க்கப்பட்டு, தந்தை–மகன் உறவு இயல்பான தமிழ் உடைமைத் தொடரால் தரப்படுகிறது.
- source_word: אֶת הַמֶּלֶךְ
  choice: அரசனுக்கு
  rationale: ענה வினையின் உரையாடல் சூழலைத் தமிழில் இயல்பாக வெளிப்படுத்த நான்காம் வேற்றுமை பயன்படுத்தப்படுகிறது.
- source_word: וַיֹּאמֶר
  choice: என்றான்
  rationale: எபிரேய கதைநடைத் தொடரை தமிழில் தேவையற்ற இரட்டிப்பின்றி இயல்பான மேற்கோள் முடிப்பு வினையாக அளிக்கிறது.
- source_word: אָמֵן
  choice: ஆமென்!
  rationale: இங்கு இசைவும் விருப்பமும் கலந்த உறுதியான வாழ்த்தொலி; பரவலாக அறியப்பட்ட ‘ஆமென்’ அதன் சமய மற்றும் வலியுறுத்தல் தன்மையைப் பாதுகாக்கிறது.
- source_word: כֵּן
  choice: அவ்வாறே
  rationale: அரசன் முன்பு கூறிய நோக்கத்தைக் குறிப்பிட்டு அதற்கு இசைவைக் காட்டுகிறது.
- source_word: יֹאמַר
  choice: சொல்லட்டும்
  rationale: வடிவில் imperfect ஆனாலும், ‘ஆமென்’ என்பதற்குப் பின் இங்கு விருப்பம் அல்லது வேண்டுதலைக் குறிக்கும் jussive நுணுக்கம் உள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எழுத்துகளைக் கொண்ட இறைப்பெயரைப் பட்டத்தால் மாற்றாமல், தமிழில் அதன் தனிப்பெயராக ஒலிபெயர்க்கிறது.
- source_word: אֱלֹהֵי
  choice: கடவுளான
