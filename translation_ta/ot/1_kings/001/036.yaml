  rationale: ‘ஆமென்’ என்ற இசைவு மொழிக்குப் பிந்தைய சூழல் இதை வெறும் எதிர்காலக் கூற்றாக அல்லாமல், அரசனின் எண்ணத்தை யாவே உறுதிப்படுத்த வேண்டும் என்ற விருப்பமாகக் காட்டுகிறது.
