- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: என் ஆண்டவராகிய அரசன்
  rationale: அரசனைக் குறித்த மரியாதைமிக்க அரசவைச் சொல்லாட்சியையும் முதல் நபர் உடைமையையும் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
