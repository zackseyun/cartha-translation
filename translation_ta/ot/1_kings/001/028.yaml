  yaml_path: translation/ot/1_kings/001/028.yaml
  text: Then King David answered and said[a], “Call Bathsheba to me.” So she came before the king and stood before the king.
translation:
  language: ta
  text: 'அப்போது தாவீது ராஜா மறுமொழியாகச் சொன்னார்[a]: “பத்சேபாளை என்னிடம் அழைத்து வாருங்கள்.” அவள் ராஜாவின் முன்னிலையில் வந்து, ராஜாவின் முன்னிலையில் நின்றாள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பதிலளித்துச் சொன்னார்.” எபிரெயக் கதைநடையில் “பதிலளித்தார்” என்பது, நேரடியான கேள்வி முன்பாக இல்லாதபோதும், பேச்சை அறிமுகப்படுத்த அடிக்கடி பயன்படுத்தப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן
  choice: மறுமொழியாக
  rationale: ענה என்ற எபிரெய வினை இங்கு உரையை அறிமுகப்படுத்தும் கதைநடைச் சூத்திரமாக ‘பதிலளித்தார்/மறுமொழியாகச் சொன்னார்’ என்ற பொருள் தருகிறது; உடனடியாக ஒரு கேள்வி இல்லாவிட்டாலும் மூலத்தின் வழக்கைத் தக்கவைக்கிறது.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: தாவீது ராஜா
  rationale: அரசப் பட்டத்தையும் பெயரையும் இயல்பான நவீனத் தமிழில் இணைக்கிறது.
- source_word: וַיֹּאמֶר
  choice: சொன்னார்
  rationale: אמר என்பதற்கான நேரடியான, இயல்பான பேச்சு வினை.
- source_word: קִרְאוּ לִי
  choice: என்னிடம் அழைத்து வாருங்கள்
  rationale: קרא + לְ என்பது ஒருவரை அழைத்து வரும்படி கட்டளையிடுவதைக் குறிக்கிறது; அரச கட்டளையின் நேரடித்தன்மையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: לְבַת שָׁבַע
  choice: பத்சேபாள்
  rationale: எபிரெய தனிப்பெயரைத் தமிழில் வழக்கமான வேதாகமப் பெயர்வடிவில் தருகிறது.
- source_word: וַתָּבֹא לִפְנֵי הַמֶּלֶךְ
  choice: அவள் ராஜாவின் முன்னிலையில் வந்து
  rationale: בוא + לפני என்பது ராஜாவின் சமூகத்திற்குள் அல்லது முன்னிலைக்கு வருதலைக் குறிக்கிறது.
- source_word: וַתַּעֲמֹד לִפְנֵי הַמֶּלֶךְ
  choice: ராஜாவின் முன்னிலையில் நின்றாள்
  rationale: עמד என்பதன் அடிப்படைப் பொருளான ‘நின்றாள்’ என்பதையும், முறையான அரசவைச் சூழலைச் சுட்டும் எபிரெய மறுபடியுரைத்தலையும் தக்கவைக்கிறது.
