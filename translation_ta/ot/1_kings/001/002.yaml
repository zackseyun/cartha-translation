base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/002.yaml
  text: So his servants said to him[a], “Let them seek for my lord the king a young virgin woman, and let her attend the king and be his caregiver, and let her lie in your bosom[c][b], so that my lord the king may be warm.”
translation:
  language: ta
  text: அவனுடைய பணியாளர்கள் அவனிடம், “என் ஆண்டவராகிய அரசருக்காக ஓர் இளம் கன்னிப்பெண்ணைத் தேடட்டும். அவள் அரசருக்குப் பணிவிடை செய்து[a], அவரைப் பராமரிப்பவளாக[b] இருக்கட்டும்; உமது மடியில்[c] படுத்துக்கொள்ளட்டும். அப்போது என் ஆண்டவராகிய அரசருக்கு வெப்பம் உண்டாகும்” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லர்த்தமாக, ‘அரசருக்கு முன்பாக நின்று’; இவ்வெபிரேய மரபுத்தொடர் ஒருவருக்குப் பணிவிடை செய்வதையோ அவருக்குச் சேவை செய்வதையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘உதவியாளராக’ அல்லது ‘கவனித்துக்கொள்பவளாக’ என்றும் மொழிபெயர்க்கலாம். இங்கு வரும் எபிரேயச் சொல் அரிதானது; அது மற்றொருவருக்குப் பணிவிடை செய்து அவரைப் பராமரிப்பவரைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: சொல்லர்த்தமாக, ‘உமது மடியில்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדָיו
  choice: அவனுடைய பணியாளர்கள்
  rationale: அரசவையின் சூழலில் இச்சொல் அரசருக்குச் சேவை செய்யும் பணியாளர்கள் அல்லது ஏவலர்களைக் குறிக்கலாம். இங்கு அடிமை நிலையைத் தேவையின்றி வலியுறுத்தாமல் சூழலுக்கு ஏற்ற பொதுவான சொல்லாக ‘பணியாளர்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: יְבַקְשׁוּ
  choice: தேடட்டும்
  rationale: மூன்றாம் நபர் பன்மை வடிவிலுள்ள முன்மொழிவு அல்லது கட்டளைத் தன்மையைப் பாதுகாக்கிறது; ‘நாம் தேடுவோம்’ என்று மூலத்தில் இல்லாத முதலாம் நபரைச் சேர்க்கவில்லை.
- source_word: לַאדֹנִי הַמֶּלֶךְ
  choice: என் ஆண்டவராகிய அரசருக்காக
  rationale: மூலத்தின் முதலாம் நபர் ஒருமை உடைமையையும் அரசவையின் மரியாதைமிக்க அழைப்பையும் இயல்பான தமிழில் காக்கிறது.
- source_word: נַעֲרָה בְתוּלָה
  choice: ஓர் இளம் கன்னிப்பெண்
  rationale: נַעֲרָה என்பதிலுள்ள இளமை மற்றும் பெண் என்ற இரு கூறுகளையும், בְתוּלָה குறிப்பிடும் கன்னித்தன்மையையும் வெளிப்படுத்துகிறது.
- source_word: וְעָמְדָה לִפְנֵי הַמֶּלֶךְ
  choice: அரசருக்குப் பணிவிடை செய்து
  rationale: சொல்லர்த்தமாக ‘அரசருக்கு முன்பாக நின்று’ என்றாலும், அரசவைச் சூழலில் ஒருவருக்குச் சேவை செய்ய அல்லது காத்திருந்து பணியாற்றுவதைக் குறிக்கும் மரபுத்தொடரின் பொருள் முதன்மைப்படுத்தப்பட்டது.
- source_word: סֹכֶנֶת
  choice: அவரைப் பராமரிப்பவளாக
  rationale: அரிதாக வரும் இச்சொல் ஒருவருக்குப் பணிவிடை செய்து அவரைக் கவனிப்பவளைக் குறிக்கிறது. உடனடிச் சூழலுக்குப் பொருந்தும் வகையில், தேவையற்ற பாலியல் பொருளைச் சேர்க்காமல் மொழிபெயர்க்கப்பட்டது.
- source_word: וְשָׁכְבָה בְחֵיקֶךָ
  choice: உமது மார்போடு அணைந்தபடி படுத்துக்கொள்ளட்டும்
  rationale: חֵיק குறிக்கும் மடி அல்லது மார்புப் பகுதியின் உடல் நெருக்கத்தையும், அரசருக்கு வெப்பம் அளிக்கும் நோக்கத்தையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וְחַם
  choice: அப்போது ... வெப்பம் உண்டாகும்
  rationale: முன்னர் கூறப்பட்ட செயல்களின் நோக்கத்தால் விளையும் முடிவைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
