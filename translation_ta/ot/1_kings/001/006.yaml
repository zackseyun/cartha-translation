base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/006.yaml
  text: His father had never displeased him at any time by saying[a], “Why have you done thus?” He was also very handsome[b], and his mother had borne him after Absalom.
translation:
  language: ta
  text: அவனுடைய தந்தை, “நீ ஏன் இப்படிச் செய்தாய்?” என்று சொல்லி, அவனுடைய வாழ்நாளில்[b] ஒருபோதும் அவனை வருத்தியதே இல்லை.[a] அவன் மிகவும் அழகான தோற்றமுடையவனாகவும் இருந்தான்; அப்சலோமுக்குப் பிறகு அவனுடைய தாய் அவனைப் பெற்றெடுத்தாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனைத் துயரப்படுத்தியதே இல்லை” அல்லது “அவனைக் கடிந்துகொண்டதே இல்லை.” எபிரெய வினை வேதனை அல்லது மனவருத்தம் உண்டாக்குவதைக் குறிக்கலாம்; இச்சூழலில் தாவீது அதோனியாவைத் தடுத்து நிறுத்தவோ, எதிர்கொண்டு திருத்தவோ தவறியதை இது சுட்டுகிறது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், “அவனுடைய நாட்களிலிருந்து”; இது அவனுடைய வாழ்க்கையில் எந்தக் காலத்திலும் என்பதைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲצָבוֹ
  choice: அவனை வருத்தியதே இல்லை
  rationale: עצב என்பது வேதனை, மனவருத்தம் அல்லது எரிச்சல் உண்டாக்குவதைக் குறிக்கலாம். தொடர்ந்து வரும் தந்தையின் கேள்வி கண்டிப்பைச் சுட்டினாலும், மூலச்சொல்லைவிடக் குறிப்பாக ‘கடிந்துகொண்டதே இல்லை’ என்று பொருளைச் சுருக்காமல், அதன் பரந்த அர்த்தத்தை ‘வருத்தியதே இல்லை’ எனப் பாதுகாக்கிறது.
- source_word: מִיָּמָיו
  choice: அவனுடைய வாழ்நாளில் ஒருபோதும்
  rationale: சொல்லுக்குச் சொல் ‘அவனுடைய நாட்களிலிருந்து’ என்ற எபிரெய மரபுத்தொடர், அவனுடைய வாழ்க்கையில் எந்தக் காலத்திலும் அப்படிச் செய்யவில்லை என்பதைக் குறிக்கிறது.
- source_word: לֵאמֹר
  choice: என்று கேட்டு
  rationale: தந்தை சொல்லாதிருந்த திருத்தக் கேள்வியின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது. தமிழில் நேரடி உரையுடன் ‘என்று கேட்டு’ இயல்பாக உள்ளது.
- source_word: מַדּוּעַ כָּכָה עָשִׂיתָ
  choice: நீ ஏன் இப்படிச் செய்தாய்?
  rationale: ככה என்பதன் ‘இவ்வாறு/இப்படி’ என்ற சுட்டுப் பொருளையும் தந்தையின் நேரடியான விசாரணையையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: טוֹב תֹּאַר מְאֹד
  choice: மிகவும் அழகான தோற்றமுடையவன்
  rationale: இந்தச் சொற்றொடர் உடல் தோற்றத்தைக் குறிக்கிறது. ஆண் நபரைப் பற்றிய சூழலில் இத்தமிழாக்கம் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: וְאֹתוֹ יָלְדָה
  choice: அவனுடைய தாய் அவனைப் பெற்றெடுத்தாள்
  rationale: எபிரெய வினையில் பெண்பால் எழுவாய் மறைமுகமாக உள்ளது. ‘அவனுடைய தாய்’ என்பது பெற்றெடுத்த செயலில் உள்ள சூழல்சார் எழுவாயைத் தமிழில் தெளிவுபடுத்துகிறது.
- source_word: אַחֲרֵי אַבְשָׁלוֹם
  choice: அப்சலோமுக்குப் பிறகு
  rationale: இது இயல்பாகப் பிறப்பு வரிசையைக் குறிக்கிறது; மூலத்தின் சுருக்கத்தையும் சிறிய அளவிலான பொருள் நெகிழ்வையும் இந்த வடிவம் காக்கிறது.
