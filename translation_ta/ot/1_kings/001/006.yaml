translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் மரியாதைமிக்க நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘வருத்தியதே இல்லை’ என்பது மூலவினையின் உணர்ச்சி சார்ந்த பரப்பைத் தக்கவைக்கிறது; சூழலில் உள்ள பெற்றோரின் கண்டிப்பு அல்லது கட்டுப்படுத்தல் என்ற கருத்து அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது. ஆங்கில ஆலோசனை உரையில் [b] குறியின் இடம் பொருந்தாமல் இருந்ததால், அதன் உண்மையான பொருளான מִיָּמָיו உடன் தமிழில் குறி வைக்கப்பட்டுள்ளது.
