  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יְבַקְשׁוּ֙ נַעֲרָ֣ה יָפָ֔ה בְּ/כֹ֖ל גְּב֣וּל יִשְׂרָאֵ֑ל וַֽ/יִּמְצְא֗וּ אֶת אֲבִישַׁג֙ הַ/שּׁ֣וּנַמִּ֔ית וַ/יָּבִ֥אוּ אֹתָ֖/הּ לַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/003.yaml
  text: So they searched throughout all the territory of Israel for a beautiful young woman[b][a], and they found Abishag the Shunammite and brought her to the king.
translation:
  language: ta
  text: அவர்கள் இஸ்ரவேலின் எல்லாப் பகுதிகளிலும் ஓர் அழகிய இளம்பெண்ணைத் தேடினார்கள். சூனேமைச் சேர்ந்த அபிசாகை[a] கண்டுபிடித்து, அரசனிடம் அழைத்து வந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சூனேமைச் சேர்ந்தவள்” என்பதே “சூனேமியப் பெண்” என்ற எபிரெயப் பெயரடை வடிவத்தின் பொருள்.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְבַקְשׁוּ
  choice: தேடினார்கள்
  rationale: בקשׁ இங்கு திட்டமிட்டுத் தேடுவதைக் குறிக்கிறது; நவீனத் தமிழில் இயல்பாகவும் நேரடியாகவும் உள்ளது.
- source_word: נַעֲרָה יָפָה
  choice: ஓர் அழகிய இளம்பெண்ணை
  rationale: נַעֲרָה என்பது இளம் பெண்ணைக் குறிக்கிறது; ‘இளம்பெண்’ வயதைத் தேவையின்றிக் குறுக்காமல் மரியாதையாகத் தெரிவிக்கிறது. יָפָה என்பதற்கு ‘அழகிய’ நேரான இணை.
- source_word: בְּכֹל גְּבוּל יִשְׂרָאֵל
  choice: இஸ்ரவேலின் எல்லாப் பகுதிகளிலும்
  rationale: גְּבוּל இங்கு எல்லைக்கோட்டை மட்டும் அல்லாமல் நாட்டின் பரப்பு அல்லது பிரதேசத்தைக் குறிக்கிறது; தேடல் நாடெங்கும் நடந்ததை இச்சொற்றொடர் இயல்பாகக் காட்டுகிறது.
- source_word: וַיִּמְצְאוּ
  choice: கண்டுபிடித்து
  rationale: מצא என்பதன் எளிய கதைநடைப் பொருளைத் தருகிறது; அடுத்த வினையுடன் தமிழில் இயல்பாக இணைக்கப்பட்டுள்ளது.
- source_word: אֲבִישַׁג הַשּׁוּנַמִּית
  choice: சூனேமைச் சேர்ந்த அபிசாகை
  rationale: הַשּׁוּנַמִּית என்பது சூனேம் ஊரைச் சேர்ந்த பெண் என்பதைக் குறிக்கும் இன/இடப்பெயர் வடிவம்; தமிழில் ஊர்ச் சார்பை நேரடியாகச் சொல்வது தெளிவானது.
- source_word: וַיָּבִאוּ אֹתָהּ לַמֶּלֶךְ
  choice: அரசனிடம் அழைத்து வந்தார்கள்
  rationale: בוא என்பதன் ஹிஃபில் வடிவம் ‘கொண்டுவருதல்’ என்பதைக் குறிக்கிறது; ஒரு நபரைப் பற்றிய தமிழ்ச் சூழலில் ‘அழைத்து வந்தார்கள்’ இயல்பாகவும் கண்ணியமாகவும் உள்ளது.
