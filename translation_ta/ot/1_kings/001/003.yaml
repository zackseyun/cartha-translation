  terminology: “இளம்பெண்” and “அழகிய” are suitable contemporary equivalents for נַעֲרָה and יָפָה. “அபிசாகை” and “சூனேம்” are consistently transliterated, and the cultural footnote accurately explains the place-derived designation.
