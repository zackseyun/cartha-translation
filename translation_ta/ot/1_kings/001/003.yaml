translation_notes:
  register: நவீன நிலையான தமிழில், எளிய ஆனால் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் தொடர் நிகழ்வுகள் இரண்டு தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளன; பொருள் மாற்றப்படவில்லை. அடிக்குறிப்பு குறியீடு உரையில் பெயருக்குப் பின் இடப்பட்டுள்ளது.
