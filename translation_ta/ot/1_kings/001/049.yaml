  yaml_path: translation/ot/1_kings/001/049.yaml
  text: Then all Adonijah’s invited guests trembled and rose[a], and each man went his way.
translation:
  language: ta
  text: அப்போது அதோனியாவால் அழைக்கப்பட்டிருந்த அனைவரும் நடுங்கி எழுந்தார்கள்; ஒவ்வொருவரும் அவரவர் வழியே சென்றார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “ஒவ்வொருவனும் தன் வழிக்கு”; அவர்கள் தனித்தனியாகப் பிரிந்து சென்றார்கள் என்பதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחֶרְדוּ
  choice: நடுங்கி
  rationale: חרד என்பது அச்சம் அல்லது திடுக்கிடுதலால் நடுங்குவதைக் குறிக்கிறது. ‘நடுங்கி’ என்பது அதன் உடல்சார்ந்த மற்றும் உணர்ச்சிசார்ந்த வலிமையை மிகைப்படுத்தாமல் தக்கவைக்கிறது.
- source_word: וַיָּקֻמוּ
  choice: எழுந்தார்கள்
  rationale: קום என்பதன் இயல்பான கதைநடைப் பொருள் ‘எழுதல்’. விருந்திலிருந்தவர்கள் உடனே எழுந்ததை நவீனத் தமிழில் தெளிவாகக் கூறுகிறது.
- source_word: כָּל הַקְּרֻאִים אֲשֶׁר לַאֲדֹנִיָּהוּ
  choice: அதோனியாவால் அழைக்கப்பட்டிருந்த அனைவரும்
  rationale: הַקְּרֻאִים என்பது ‘அழைக்கப்பட்டவர்கள்’ என்ற செயல்பாட்டு பெயரெச்சம். அதோனியாவுடன் வரும் ל இங்கு அவருடைய அழைப்பைச் சார்ந்தவர்களைக் குறிக்கிறது; ஆகவே இந்த வடிவம் மூலத்தின் அழைப்பு கருத்தை நேரடியாகப் பாதுகாக்கிறது.
- source_word: וַיֵּלְכוּ
  choice: சென்றார்கள்
  rationale: הלך என்பதன் அடிப்படை இயக்கப் பொருளை எளிய கதைநடைத் தமிழில் தருகிறது; அடுத்த சொற்றொடர் அவர்கள் தனித்தனியே பிரிந்து சென்றதைத் தெரிவிக்கிறது.
- source_word: אִישׁ לְדַרְכּוֹ
  choice: ஒவ்வொருவரும் அவரவர் வழியே
  rationale: ‘ஒருவன் தன் வழிக்கு’ என்ற எபிரெய விநியோக மரபுத்தொடரை இயல்பான தமிழில் ‘ஒவ்வொருவரும் அவரவர் வழியே’ என வழங்கி, அவர்கள் தனித்தனியாகப் பிரிந்து சென்ற கருத்தைப் பாதுகாக்கிறது.
