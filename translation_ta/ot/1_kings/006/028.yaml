revisions:
- from: அவன் அந்தக் கேருபீன்களைத் தங்கத்தால் மேற்பூச்சிட்டான்[a].
  to: அவன் கேருபீன்களைத் தங்கத்தால் போர்த்தினான்[a].
  rationale: The revision replaces a paint-like expression with ‘தங்கத்தால் போர்த்தினான்,’ which directly conveys the Hebrew sense of covering or overlaying the cherubim with gold. It also removes the unnecessary demonstrative while retaining the established term ‘கேருபீன்கள்.’ The footnote preserves legitimate lexical alternatives without resolving the precise technical method beyond the source text.
