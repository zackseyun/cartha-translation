lexical_decisions:
- source_word: וַיְצַף
  choice: மேற்பூச்சிட்டான்
  rationale: צפה என்பது ஆலயக் கட்டுமானச் சூழலில் ஓர் பொருளின் மேற்பரப்பை, குறிப்பாக உலோகத் தகடு அல்லது படலத்தால், மூடுவதைக் குறிக்கிறது. ‘மேற்பூச்சிட்டான்’ என்பது தங்கத்தால் வெளிப்புறம் மூடிய செயலை இயல்பாகத் தெரிவிக்கிறது.
- source_word: אֶת
  choice: தனியாக மொழிபெயர்க்கப்படவில்லை
  rationale: אֶת என்பது ‘கேருபீன்களை’ திட்டவட்டமான நேரடிச் செயப்படுபொருளாகக் குறிக்கும் இலக்கண உருபு; தமிழில் இதற்குத் தனிச் சொல் தேவையில்லை. ‘-ஐ’ வேற்றுமை உருபின் பன்மை வடிவமான ‘-களை’ மூலம் அதன் பணி வெளிப்படுகிறது.
- source_word: הַכְּרוּבִים
  choice: அந்தக் கேருபீன்களை
  rationale: ‘கேருபீன்கள்’ என்பது ஆலயத்துடன் தொடர்புடைய சிறகுள்ள பரலோக உருவங்களைக் குறிக்கும் மரபான வேதாகமப் பதம். எபிரெயச் சொல்லின் திட்டவட்டத் தன்மை ‘அந்த’ என்பதால் வெளிப்படுத்தப்படுகிறது.
- source_word: זָהָב
  choice: தங்கத்தால்
  rationale: இச்சொல் மேற்பூச்சிற்குப் பயன்படுத்தப்பட்ட பொருளைக் குறிக்கிறது. தமிழில் கருவி அல்லது பொருள் சார்ந்த ‘-ஆல்’ உருபு இந்த உறவை இயல்பாக வெளிப்படுத்துகிறது.
