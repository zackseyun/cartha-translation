base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/027.yaml
  text: He placed the cherubim inside the inner house[a], and the cherubim spread out their wings, so that the wing of the one touched the wall, and the wing of the second cherub touched the other wall; and their wings toward the middle of the house were touching wing to wing.
translation:
  language: ta
  text: அவர் கேருபீன்களை ஆலயத்தின் உட்புற அறைக்குள்[a] வைத்தார். கேருபீன்கள் தங்கள் சிறகுகளை விரித்தன. ஒரு கேருபீனின் சிறகு ஒரு சுவரைத் தொட்டது; இரண்டாவது கேருபீனின் சிறகு மற்ற சுவரைத் தொட்டது. ஆலயத்தின் நடுப்பகுதியை நோக்கிய அவற்றின் சிறகுகள் சிறகுடன் சிறகு தொட்டுக்கொண்டிருந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆலயத்தின் உள்ளார்ந்த பரிசுத்த இடத்தில்.” எபிரெயத்தில் சொற்சொல்லாக, “உட்புற வீட்டுக்குள்”; இது ஆலயத்தின் மிக உட்புறப் பகுதியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: வைத்தார்
  rationale: נתן என்பதன் ‘வைத்தல்/நிறுத்துதல்’ என்ற பொருள் இங்குள்ள உருவங்களை நிலைநிறுத்தும் கட்டடச் சூழலுக்கு இயல்பாகப் பொருந்துகிறது.
- source_word: הַכְּרוּבִים
  choice: கேருபீன்கள்
  rationale: வழக்கமான வேதாகமத் திருப்பெயர்ப்பைப் பேணி, இவை சிறப்புவகை விண்ணுலக உயிரினங்கள் என்பதைத் தெளிவாக வைத்திருக்கிறது.
- source_word: בְּתוֹךְ הַבַּיִת הַפְּנִימִי
  choice: ஆலயத்தின் உட்புற அறைக்குள்
  rationale: ‘உள் வீடு’ என்ற எபிரெயச் சொல்லாட்சியைச் சொற்சொல்லாக அல்லாமல், ஆலயத்தின் மிக உட்புறப் பகுதியைக் குறிக்கும் இயல்பான நவீனத் தமிழில் தருகிறது; ‘அறை’ என்பது இடவமைப்பைத் தெளிவாக்குகிறது.
- source_word: וַיִּפְרְשׂוּ אֶת כַּנְפֵי הַכְּרֻבִים
  choice: கேருபீன்கள் தங்கள் சிறகுகளை விரித்திருந்தன
  rationale: எபிரெய இலக்கண வடிவம் ‘கேருபீன்களின் சிறகுகளை அவர்கள் விரித்தார்கள்’ எனப் படிக்கக்கூடியதாயினும், சூழலில் கேருபீன்களே இயல்பான எழுவாய்; உருவங்கள் நிலைநிறுத்தப்பட்ட அமைப்பைத் தமிழில் ‘விரித்திருந்தன’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וַתִּגַּע / נֹגַעַת / נֹגְעֹת
  choice: தொட்டது / தொட்டுக்கொண்டிருந்தன
  rationale: נגע உண்மையான தொடுகையைச் சுட்டுகிறது. ஒருமைச் செயல்களுக்கு ‘தொட்டது’ என்றும், நடுவிலுள்ள இரு சிறகுகளின் தொடர்ந்த நிலைக்கு ‘தொட்டுக்கொண்டிருந்தன’ என்றும் சூழலுக்கேற்ப தரப்பட்டுள்ளது.
- source_word: כְּנַף הָאֶחָד
  choice: ஒன்றின் சிறகு
  rationale: ‘முதலாவது’ என்று மூலத்தில் இல்லாத வரிசையைக் கூட்டாமல், ‘ஒன்றின்’ என்ற எபிரெய அமைப்பைப் பேணுகிறது.
- source_word: הַכְּרוּב הַשֵּׁנִי
  choice: இரண்டாவது கேருபீன்
  rationale: எபிரெய மொழியிலுள்ள வரிசை எண்ணை நேரடியாகப் பேணுகிறது.
- source_word: הַקִּיר הַשֵּׁנִי
  choice: மறுசுவர்
  rationale: இரு எதிர்ச் சுவர்களைப் பற்றிய சூழலில் ‘இரண்டாவது சுவர்’ என்பதைவிட ‘மறுசுவர்’ இயல்பாகவும் அதே பொருளுடனும் உள்ளது.
- source_word: וְכַנְפֵיהֶם אֶל תּוֹךְ הַבַּיִת
  choice: ஆலயத்தின் நடுப்புறம் நோக்கிய அவற்றின் சிறகுகள்
  rationale: תוך இங்கு உட்பகுதி அல்லது நடுப்பகுதியைக் குறிக்கிறது; அடுத்ததாகச் சிறகுகள் சந்திப்பதால் ‘நடுப்புறம் நோக்கிய’ என்பது இடவமைப்பைத் தெளிவாக்குகிறது.
- source_word: נֹגְעֹת כָּנָף אֶל כָּנָף
  choice: ஒன்றையொன்று தொட்டுக்கொண்டிருந்தன
  rationale: சொற்சொல்லான ‘சிறகோடு சிறகு’ என்பதன் பொருளை இயல்பான தமிழில் தருகிறது; இரு சிறகுகளும் நேரடியாகச் சந்தித்த அமைப்பு பேணப்படுகிறது.
