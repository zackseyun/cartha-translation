  text: So he built the house and finished it, and he covered the house with beams and rows of cedar.
translation:
  language: ta
  text: இவ்வாறு அவன் ஆலயத்தைக் கட்டி முடித்தான்; தேவதாரு மர உத்தரங்களாலும் வரிசைகளாலும் ஆலயத்தை மூடினான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உத்தரங்களாலும் வரிசைகளாலும்” என்பதற்கான எபிரெயச் சொற்றொடரின் துல்லியமான கட்டிடக்கலைப் பொருள் உறுதியற்றது; “உத்தரங்களாலும் தேவதாருப் பலகைகளாலும்” என்றும் மொழிபெயர்க்கலாம்.
    reason: גֵבִים וּשְׂדֵרֹת என்ற அரிதான கட்டிடக்கலைச் சொற்களின் பொருள் மற்றும் தொடர்பு தெளிவற்றவை; அந்த உண்மையான தெளிவின்மையை வாசகருக்குத் தெரிவிக்கிறது.
lexical_decisions:
- source_word: הַבַּיִת
  choice: ஆலயம்
  rationale: இச்சூழலில் இந்தச் சொல் சாலொமோன் கட்டிய ஆண்டவரின் ஆலயத்தைக் குறிக்கிறது; தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: וַיְכַלֵּהוּ
  choice: அதைக் கட்டி முடித்தான்
  rationale: முன்னுள்ள ‘கட்டினான்’ என்பதோடு இயல்பாக இணைந்து, கட்டுமானப் பணியை நிறைவு செய்தான் என்ற பொருளைத் தருகிறது.
- source_word: וַיִּסְפֹּן
  choice: மூடினான்
  rationale: கட்டிடத்தின் மேற்பகுதியை மர அமைப்பால் மூடிய செயலைக் குறிக்கும் பொதுவான வினை; எந்தத் திசையிலிருந்து மூடப்பட்டது என்பதைச் சேர்த்து விளக்கவில்லை.
- source_word: גֵבִים וּשְׂדֵרֹת בָּאֲרָזִים
  choice: தேவதாரு மர உத்தரங்களாலும் வரிசைகளாலும்
  rationale: அரிதான கட்டிடக்கலைச் சொற்களின் அடிப்படை உருவகங்களைத் தக்கவைக்கிறது; ‘வரிசைகள்’ என்பதன் கட்டுமானப் பொருள் தெளிவற்றிருப்பதால் குறிப்பில் மாற்று விளக்கம் தரப்படுகிறது.
