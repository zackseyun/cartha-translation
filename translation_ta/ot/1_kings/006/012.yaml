revisions:
- from: நீ கட்டிக்கொண்டிருக்கிற இந்த ஆலயத்தைப் பொறுத்தவரை, நீ என் சட்டதிட்டங்களின்படி நடந்து, என் நீதிநியமங்களைச் செயல்படுத்தி, என் கட்டளைகள் அனைத்தையும் கடைப்பிடித்து அவற்றின்படி நடந்தால், நான் உன் தந்தையான தாவீதிடம் சொன்ன என் வார்த்தையை உன்னுடன் நிலைநிறுத்துவேன்.[a]
  to: நீ கட்டிக்கொண்டிருக்கிற இந்த வீட்டைப் பொறுத்தவரை, நீ என் சட்டதிட்டங்களின்படி நடந்து, என் நீதிநியமங்களைப் பின்பற்றி, என் கட்டளைகள் அனைத்தையும் கடைப்பிடித்து அவற்றின்படி நடந்தால், நான் உன் தந்தையான தாவீதிடம் சொன்ன என் வார்த்தையை உன்னுடன் நிலைநிறுத்துவேன்.[a]
  rationale: The revision preserves the Hebrew's conditional syntax and covenant vocabulary while rendering “house” without prematurely replacing it with “temple.” It also clarifies that Solomon is to obey God's judgments rather than enforce them, and it corrects the footnote's rendering of “with you.”
