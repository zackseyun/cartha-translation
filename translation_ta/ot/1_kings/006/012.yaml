base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/012.yaml
  text: As for this house that you are building[a], if you walk in my statutes, carry out my judgments, and keep all my commandments by walking in them, then I will establish my word with you, which I spoke to David your father.
translation:
  language: ta
  text: நீ கட்டிக்கொண்டிருக்கிற இந்த வீட்டைப் பொறுத்தவரை, நீ என் சட்டதிட்டங்களின்படி நடந்து, என் நீதிநியமங்களைப் பின்பற்றி, என் கட்டளைகள் அனைத்தையும் கடைப்பிடித்து அவற்றின்படி நடந்தால், நான் உன் தந்தையான தாவீதிடம் சொன்ன என் வார்த்தையை உன்னுடன் நிலைநிறுத்துவேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் வார்த்தையை உன்னுடன் உறுதிப்படுத்துவேன்” அல்லது “என் வாக்குறுதியை உன்னுடன் நிறைவேற்றுவேன்.” “வார்த்தையை நிலைநிறுத்துதல்” என்ற எபிரெய மரபுத்தொடர், முன்பு சொல்லப்பட்டதை உறுதிப்படுத்துவதையோ நிறைவேற்றுவதையோ குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבַּיִת הַזֶּה
  choice: இந்த ஆலயம்
  rationale: בַּיִת என்பதன் அடிப்படைப் பொருள் ‘வீடு’ என்றாலும், இச்சூழலில் சாலொமோன் கட்டும் இறை ஆலயத்தைக் குறிக்கிறது. நவீனத் தமிழில் ‘இந்த ஆலயம்’ என்பது குறிப்பைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: אֲשֶׁר אַתָּה בֹנֶה
  choice: நீ கட்டிக்கொண்டிருக்கிற
  rationale: בֹנֶה என்னும் பங்கேற்புவினை தொடர்ந்து நடைபெற்றுக்கொண்டிருக்கும் செயலைக் குறிக்கிறது; ‘கட்டிக்கொண்டிருக்கிற’ அந்த நிகழ்காலத் தொடர்ச்சியை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אִם תֵּלֵךְ בְּחֻקֹּתַי
  choice: நீ என் சட்டதிட்டங்களின்படி நடந்து
  rationale: הלך ב என்பது வாழ்க்கை நடத்தை அல்லது ஒழுகுமுறையைக் குறிக்கிறது. ‘நடந்து’ என்ற உருவகம் காக்கப்படுகிறது; חֻקֹּתַי என்பதற்கு ‘என் சட்டதிட்டங்கள்’ உடன்படிக்கை சார்ந்த விதிகளின் கருத்தைத் தருகிறது.
- source_word: מִשְׁפָּטַי תַּעֲשֶׂה
  choice: என் நீதிநியமங்களைச் செயல்படுத்தி
  rationale: מִשְׁפָּטִים என்பது தீர்ப்புகள், நீதிநியமங்கள் அல்லது ஒழுங்குவிதிகள் எனப் பொருள்படலாம். ‘நீதிநியமங்கள்’ அதன் சட்ட மற்றும் நீதி சார்ந்த பரப்பைத் தக்கவைக்கிறது; תעשה என்பது அவற்றை நடைமுறைப்படுத்துவதைக் குறிக்கிறது.
- source_word: וְשָׁמַרְתָּ אֶת כָּל מִצְוֺתַי
  choice: என் கட்டளைகள் அனைத்தையும் கடைப்பிடித்து
  rationale: שׁמר என்பது கட்டளைகளோடு வரும்போது அவற்றைக் கவனமாகக் காத்து அனுசரிப்பதைக் குறிக்கிறது. ‘கடைப்பிடித்து’ நவீனத் தமிழில் இயல்பான கீழ்ப்படிதல் மொழி.
- source_word: לָלֶכֶת בָּהֶם
  choice: அவற்றின்படி நடந்தால்
  rationale: கட்டளைகளை நடைமுறை வாழ்வில் பின்பற்றுவதை இந்த இறந்தொழில் வடிவம் விளக்குகிறது. ‘அவற்றின்படி நட’ என்பது எபிரெயத்தின் மீண்டும் வரும் நடத்தல் உருவகத்தைத் தக்கவைக்கிறது.
- source_word: וַהֲקִמֹתִי אֶת דְּבָרִי אִתָּךְ
  choice: நான் என் வார்த்தையை உன்னுடன் நிலைநிறுத்துவேன்
  rationale: הקים דבר என்பது முன்பு சொல்லப்பட்ட வார்த்தையை உறுதிப்படுத்துதல் அல்லது நிறைவேற்றுதல் என்ற மரபுத்தொடர். ‘நிலைநிறுத்துவேன்’ மூல உருவகத்தைக் காக்கிறது; ‘உன்னுடன்’ என்பது אִתָּךְ என்பதை நேரடியாகப் பிரதிபலிக்கிறது.
- source_word: דְּבָרִי
  choice: என் வார்த்தை
  rationale: דבר என்பது வார்த்தை, காரியம் அல்லது வாக்குறுதி எனப் பொருள்படலாம். தொடர்ந்து ‘சொன்ன’ என்று வருவதால் ‘வார்த்தை’ என்னும் சொல் தொடர்பைத் தக்கவைக்கிறது; வாக்குறுதியின் பொருள் சூழலில் விளங்குகிறது.
- source_word: אֲשֶׁר דִּבַּרְתִּי אֶל דָּוִד אָבִיךָ
  choice: உன் தந்தையான தாவீதிடம் சொன்ன
  rationale: דִּבַּרְתִּי என்பதன் நேரடிப் பொருளான ‘சொன்ன’ என்பதைப் பயன்படுத்துவது דְּבָרִי உடனான சொல்லிணைப்பைப் பாதுகாக்கிறது; ‘வாக்குறுதி அளித்தேன்’ என்று முதன்மை உரையிலேயே பொருளைச் சுருக்கவில்லை.
theological_decisions:
- issue: ஆலயக் கட்டுமானம், சாலொமோனின் கீழ்ப்படிதல், தாவீதுக்குச் சொல்லப்பட்ட வார்த்தை ஆகியவற்றுக்கிடையிலான நிபந்தனை உறவு
  choice: சாலொமோன் உடன்படிக்கைக்குக் கீழ்ப்படிந்தால், கடவுள் தாவீதிடம் சொன்ன வார்த்தையை அவனுடன் நிலைநிறுத்துவார் என்ற நிபந்தனை அமைப்பை வெளிப்படையாக வைத்தல்.
  alternative: இதை முற்றிலும் நிபந்தனையற்ற தாவீதிய உடன்படிக்கையின் மறுஉறுதிப்படுத்தலாக மட்டும் வாசித்தல்; அல்லது முந்தைய வாக்குறுதியை முழுமையாக மாற்றும் நிபந்தனை வாக்குறுதியாக வாசித்தல்.
  rationale: எபிரெய உரையில் אִם மூலம் தெளிவான ‘என்றால்’ நிபந்தனை உள்ளது. தாவீதிய வாக்குறுதியின் நிபந்தனையுள்ள மற்றும் நிபந்தனையற்ற அம்சங்கள் பற்றிய விரிவான இறையியல் கேள்வியை வசனம் தீர்க்கவில்லை; மொழிபெயர்ப்பும் அந்த இழுபறியைத் தீர்க்காமல் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, மரியாதைமிக்க நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. ‘ஆலயம்’ சூழல் குறிப்பைத் தெளிவாக்குகிறது; ‘நட’ மற்றும் ‘வார்த்தையை நிலைநிறுத்து’ ஆகிய மூல மொழி உருவகங்கள் இயன்றவரை காக்கப்பட்டுள்ளன. நிபந்தனை அமைப்பு தெளிவாக விடப்பட்டுள்ளது.
