translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட கட்டிடவியல் நடையைப் பயன்படுத்துகிறது. ‘பிரதான மண்டபம்’ பொதுவாசகர்களுக்குத் தெளிவானதாகவும், ‘பரிசுத்த ஸ்தலம்’ போன்ற பின்னாளைய சமயத் தொழில்நுட்பச் சொல்லாக்கத்தைத் தவிர்ப்பதாகவும் உள்ளது.
