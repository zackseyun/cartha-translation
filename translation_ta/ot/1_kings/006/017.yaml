reference: 1 Kings 6:17
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/אַרְבָּעִ֥ים בָּ/אַמָּ֖ה הָיָ֣ה הַ/בָּ֑יִת ה֖וּא הַ/הֵיכָ֥ל לִ/פְנָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/017.yaml
  text: And the house[a], that is, the nave before the inner sanctuary, was forty cubits long.
translation:
  language: ta
  text: மேலும், ஆலயக் கட்டிடம்[a]—அதாவது, உட்புற அறைக்கு முன்னிருந்த பிரதான மண்டபம்—நாற்பது முழம் நீளமாக இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதற்கு முன்னிருந்த பிரதான மண்டபம்.” எபிரெய உரையில், ‘ஆலயக் கட்டிடம்’ என்பது הֵיכָל (ஹேகால்), அதாவது உட்புற அறைக்கு முன்னுள்ள ஆலயத்தின் முக்கிய அறை, என மேலும் குறிப்பாக அடையாளப்படுத்தப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַרְבָּעִים
  choice: மேலும் ... நாற்பது
  rationale: இணைப்புச்சொல் முந்தைய கட்டிட விவரிப்புடன் இவ்வசனத்தைத் தொடர்புபடுத்துகிறது; אַרְבָּעִים என்ற எண்ணுக்கு இயல்பான தமிழ் ‘நாற்பது’.
- source_word: בָּ/אַמָּה
  choice: முழம் நீளம்
  rationale: אַמָּה என்பது பழங்கால நீள அளவான ‘முழம்.’ கட்டிடத்தின் பரிமாணத்தை இயல்பான தமிழில் தெரிவிக்க ‘நீளம்’ சேர்க்கப்பட்டுள்ளது.
- source_word: הָיָה
  choice: நீளமாயிருந்தது
  rationale: எபிரெய வினை இருப்பைச் சுட்டுகிறது; அளவை விவரிக்கும் தமிழ் வாக்கியத்தில் ‘நீளமாயிருந்தது’ இயல்பாக அமைகிறது.
- source_word: הַ/בָּיִת
  choice: ஆலயக் கட்டிடம்
  rationale: בַּיִת என்பதன் அடிப்படைப் பொருள் ‘வீடு/கட்டிடம்’; இச்சூழலில் அது ஆலயத்தைக் குறிக்கிறது. ‘ஆலயக் கட்டிடம்’ என்பது பொருளைத் தெளிவாக்குவதோடு அடுத்த விளக்கச் சொல்லுடனான வேறுபாட்டையும் காக்கிறது.
- source_word: ה֖וּא
  choice: அதாவது
  rationale: இங்கு சுட்டுப்பெயர் முன்சொல்லப்பட்ட ‘கட்டிடம்’ எது என்பதை விளக்கும் இணைப்பாகச் செயல்படுகிறது.
- source_word: הַ/הֵיכָל
  choice: பிரதான மண்டபம்
  rationale: הֵיכָל இச்சூழலில் உட்பரிசுத்த அறையிலிருந்து வேறுபட்ட ஆலயத்தின் முக்கிய அறையைக் குறிக்கிறது. ‘பிரதான மண்டபம்’ என்பது பொதுவாசகர்களுக்குப் புரியும் கட்டிடவியல் சொல்; பிற்காலத் தொழில்நுட்பப் பொருளை இறக்குமதி செய்வதில்லை.
- source_word: לִ/פְנָֽ/י
  choice: உட்பரிசுத்த அறைக்கு முன்னிருந்த
  rationale: சொல் நேரடியாக ‘முன்னால்’ என்பதைக் குறிக்கிறது. முந்தைய வசனத்தின் சூழலை அடிப்படையாகக் கொண்டு அதன் தொடர்புப்பொருள் ‘உட்பரிசுத்த அறை’ என்று வெளிப்படையாகக் கொடுக்கப்பட்டுள்ளது.
