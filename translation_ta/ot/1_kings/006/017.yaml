- from: மேலும், ஆலயக் கட்டிடம்[a], அதாவது உட்பரிசுத்த அறைக்கு முன்னிருந்த பிரதான மண்டபம், நாற்பது முழம் நீளமாயிருந்தது.
  to: மேலும், ஆலயக் கட்டிடம்[a]—அதாவது, உட்புற அறைக்கு முன்னிருந்த பிரதான மண்டபம்—நாற்பது முழம் நீளமாக இருந்தது.
