translation_notes:
  register: நவீன தரத் தமிழில், ஆலயக் கட்டட விவரத்தை எளிதில் புரிந்துகொள்ளும் வகையில் மொழிபெயர்க்கப்பட்டது. ‘உள் பரிசுத்த அறை’ கண்ணியமான சமயத் தொனியைத் தக்கவைத்தாலும், குறிப்பிட்ட சமய மரபின் தொழில்நுட்பச் சொல்லைத் திணிக்காது. மூலத்தின் இறுதித் தொடரிலுள்ள உண்மையான கட்டடக்கலைத் தெளிவின்மை அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
