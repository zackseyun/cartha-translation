  text: וְ/אֵת֙ פֶּ֣תַח הַ/דְּבִ֔יר עָשָׂ֖ה דַּלְת֣וֹת עֲצֵי שָׁ֑מֶן הָ/אַ֥יִל מְזוּז֖וֹת חֲמִשִֽׁית־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/031.yaml
  text: For the entrance of the inner sanctuary he made doors of olivewood[a]; the doorposts and jambs were five-sided.
translation:
  language: ta
  text: உள் பரிசுத்த அறையின் நுழைவாயிலுக்காக ஒலிவ மரத்தினால் கதவுகளைச் செய்தான்; கதவுச் சட்டமும் கதவுநிலைகளும் ஐந்து பக்கங்கள் கொண்டவையாக இருந்தன.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கதவுச் சட்டமும் கதவுநிலைகளும் ஐந்தில் ஒரு பங்காக இருந்தன.” இது மரபுவழி மொழிபெயர்ப்பு; ஆனால் இங்கு குறிக்கப்படும் கட்டட அமைப்பு தெளிவாக இல்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: פֶּתַח
  choice: நுழைவாயில்
  rationale: இச்சொல் கதவுப் பலகைகளைக் குறிக்காமல், உள்ளே செல்லும் திறப்பையோ வாயிலையோ குறிக்கிறது; தொடர்ந்து வரும் דַּלְתּוֹת என்பதிலிருந்து இதை வேறுபடுத்துகிறது.
- source_word: הַדְּבִיר
  choice: உள் பரிசுத்த அறை
  rationale: ஆலயத்தின் மிக உட்புறமான புனித அறையை இச்சொல் குறிக்கிறது. பின்னாளைய குறிப்பிட்ட வழிபாட்டுச் சொல்லைத் திணிக்காமல், அதன் இடத்தையும் புனிதத் தன்மையையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: דַּלְתּוֹת
  choice: கதவுகள்
  rationale: எபிரெயப் பன்மை இணைக் கதவுப் பலகைகளைக் குறிக்கிறது; தமிழில் ‘கதவுகள்’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: עֲצֵי שָׁמֶן
  choice: ஒலிவ மரம்
  rationale: சொல்லுக்குச் சொல் ‘எண்ணெய் மரத்தின் மரக்கட்டை’ என்ற அமைப்பு; இச்சூழலில் ஒலிவ மரத்தைக் குறிக்கும் வழக்குச் சொற்றொடர்.
- source_word: הָאַיִל
  choice: கதவுச் சட்டம்
  rationale: கட்டடக்கலைப் பயன்பாட்டில் אַיִל கதவின் சட்டம் அல்லது தாங்கும் கட்டமைப்பைக் குறிக்கலாம்; அடுத்து வரும் מְזוּזוֹת இலிருந்து வேறுபடுத்த ‘கதவுச் சட்டம்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: מְזוּזוֹת
  choice: பக்க நிலைகள்
  rationale: கதவின் இருபுற நிலைக்கால்களைக் குறிக்கிறது. முந்தைய சொல்லான הָאַיִל-ஐ ‘கதவுச் சட்டம்’ எனக் கொண்டதால், இரு கட்டடப் பகுதிகளையும் ஒன்றாக்காமல் ‘பக்க நிலைகள்’ எனத் தரப்பட்டது.
- source_word: חֲמִשִׁית
  choice: ஐந்து பக்கங்கள் கொண்டவையாக இருந்தன
  rationale: எபிரெய வாசகம் மிகச் சுருக்கமாகவும் கட்டட அமைப்பில் தெளிவற்றதாகவும் உள்ளது. சூழலில் சட்டத்தின் ஐந்து பக்க அமைப்பைக் குறிப்பதாகப் புரிந்துகொள்ளலாம்; மாற்று புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
