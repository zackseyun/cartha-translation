base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/038.yaml
  text: And in the eleventh year[a], in the month of Bul (that is, the eighth month), the house was finished in all its parts and according to all its specifications[b]. So he built it in seven years.
translation:
  language: ta
  text: பதினொன்றாம் ஆண்டில், பூல் மாதத்தில்[a]—அதாவது எட்டாம் மாதத்தில்—ஆலயம் அதன் எல்லா விவரங்களுக்கும் அதற்குரிய எல்லா விதிமுறைகளுக்கும் ஏற்ப கட்டி முடிக்கப்பட்டது[b]. இவ்வாறு அவன் அதை ஏழு ஆண்டுகளில் கட்டி முடித்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: பூல் என்பது இஸ்ரவேலரின் நாட்காட்டியில் எட்டாம் மாதத்திற்குரிய பழைய பெயர்.
    reason: cultural_note
  - marker: b
    text: அல்லது, “அதன் எல்லா விவரங்களுக்கும், அதற்குரிய முழு நிர்ணயிக்கப்பட்ட திட்டத்தின்படியும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּשָּׁנָה הָאַחַת עֶשְׂרֵה
  choice: பதினொன்றாம் ஆண்டில்
  rationale: எபிரெய எண்ணிக்கைக் கூற்றை இயல்பான நவீனத் தமிழில் வரிசை எண்ணாக வழங்குகிறது.
- source_word: בְּיֶרַח בּוּל
  choice: பூல் மாதத்தில்
  rationale: יֶרַח என்பதன் ‘மாதம்’ என்ற பொருளையும், பழைய மாதப் பெயரான בּוּל என்பதன் ஒலிபெயர்ப்பையும் காக்கிறது.
- source_word: הוּא הַחֹדֶשׁ הַשְּׁמִינִי
  choice: அதாவது எட்டாம் மாதத்தில்
  rationale: பூல் என்ற பழைய பெயரை விளக்கும் எபிரெய மொழியின் இடைச்சேர்க்கைத் தன்மையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כָּלָה הַבַּיִת
  choice: ஆலயம் ... கட்டி முடிக்கப்பட்டது
  rationale: כָּלָה இங்கு கட்டுமானம் நிறைவடைந்ததைக் குறிக்கிறது; சூழலில் הַבַּיִת என்பது ஆலயத்தைக் குறிப்பதால் வாசகருக்குத் தெளிவான ‘ஆலயம்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: לְכָל דְּבָרָיו
  choice: அதன் எல்லாப் பகுதிகளும்
  rationale: דְּבָרָיו இங்கு சொற்களை அல்ல, கட்டிடத்தின் கூறுகள் அல்லது விவரங்களைக் குறிக்கிறது.
- source_word: וּלְכָל מִשְׁפָּטוֹ
  choice: அதன் எல்லா வரையறைகளின்படியும்
  rationale: கட்டுமானச் சூழலில் מִשְׁפָּטוֹ சட்டத் தீர்ப்பை அல்ல, நிர்ணயிக்கப்பட்ட முறை, திட்டவிவரம் அல்லது கட்டுமான வரையறையைக் குறிக்கிறது; ‘வரையறைகள்’ அந்தப் பொருள் பரப்பை ஓரளவு காக்கிறது.
- source_word: וַיִּבְנֵהוּ
  choice: இவ்வாறு அவன் அதை ... கட்டி முடித்தான்
  rationale: கட்டுமானக் காலத்தைச் சுருக்கிக் கூறும் தொடர்ச்சியான வினையின் தொகுப்புத் தன்மையை ‘இவ்வாறு’ வெளிப்படுத்துகிறது.
- source_word: שֶׁבַע שָׁנִים
  choice: ஏழு ஆண்டுகளில்
  rationale: முடிவுற்ற கட்டுமானத்துக்கு எடுத்த மொத்தக் காலத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
