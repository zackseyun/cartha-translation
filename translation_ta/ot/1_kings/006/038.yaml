translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியும் அதேவேளையில் வரலாற்று உரைக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘வீடு’ என்ற சொற்பொருளுக்குப் பதிலாக சூழல் தெளிவுக்காக ‘ஆலயம்’ பயன்படுத்தப்பட்டுள்ளது; எபிரெய உரையிலுள்ள கட்டிட விவரங்களுக்கும் நிர்ணயிக்கப்பட்ட முறைக்கும் இடையிலான சிறு வேறுபாடு முதன்மை உரையிலும் அடிக்குறிப்பிலும் காக்கப்பட்டுள்ளது.
