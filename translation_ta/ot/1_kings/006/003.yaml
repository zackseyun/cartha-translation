  text: The portico in front of the nave of the house was twenty cubits long[a], across the width of the house[c][b], and ten cubits deep in front of the house.
translation:
  language: ta
  text: ஆலயக் கட்டடத்தின் பிரதான மண்டபத்திற்கு[b] முன்பாக இருந்த முகப்பு மண்டபம்[a], ஆலயத்தின் அகலம் முழுவதும் இருபது முழம் நீளமும், ஆலயத்தின் முன்புறமாகப் பத்து முழம் ஆழமும்[c] கொண்டிருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘முகப்பு மண்டபம்’ என்பதற்கு ‘முன்கூடம்’ அல்லது ‘தாழ்வாரம்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், ‘இல்லத்தின் மண்டபம்’; அதாவது ஆலயக் கட்டடத்தின் பிரதான மண்டபம்.
    reason: lexical_alternative
  - marker: c
    text: சொல்லர்த்தமாக, ‘அதன் அகலம்.’ இங்கு அது ஆலயத்தின் முன்புறத்திலிருந்து வெளியே நீளும் முகப்பு மண்டபத்தின் ஆழத்தைக் குறிக்கிறது.
    reason: lexical_alternative
