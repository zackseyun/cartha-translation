  rationale: הֵיכַל என்பது இங்கு உட்புறத் திருத்தலத்திலிருந்தும் முகப்பு மண்டபத்திலிருந்தும் வேறுபட்ட ஆலயத்தின் முதன்மை மண்டபத்தைக் குறிக்கிறது; עַל־פְּנֵי அதன் முன்புற இடத்தொடர்பைக் காட்டுகிறது.
