  source_fidelity: 'மூல எபிரெயத்தின் கட்டடக்கலை அமைப்பும் அளவுகளும் துல்லியமாகக் காக்கப்பட்டுள்ளன: முகப்பு மண்டபம் பிரதான மண்டபத்தின் முன் அமைந்தது; அதன் நீளம் ஆலயத்தின் அகலத்துக்கு நெடுகிலும் இருபது முழம்; அதன் முன்-பின் அளவு ஆலயத்தின் முன்புறமாகப் பத்து முழம். רָחְבּוֹ என்பதற்கான சொல்லர்த்தமான ‘அகலம்’ இச்சூழலில் கட்டடத்தின் வெளியே நீளும் ‘ஆழம்’ எனத் தெளிவுபடுத்தப்படுவது நியாயமானது.'
  naturalness: நடை நவீன நிலையான தமிழில் இயல்பாகவும் வாசிக்கத் தெளிவாகவும் உள்ளது. ‘முகப்பு மண்டபம்,’ ‘பிரதான மண்டபம்,’ ‘ஆழம்’ ஆகியவை கண்ணியமான, புரிந்துகொள்ளக்கூடிய கட்டடக்கலைச் சொற்கள். வாக்கியத்தின் அளவியல் இணைப்பும் இயல்பானது.
  terminology: ‘முகப்பு மண்டபம்’ אוּלָם என்பதற்கு பொருத்தமான நடுநிலையான தேர்வு. הֵיכַל-ஐ ‘பிரதான மண்டபம்’ என்றும், הַבַּיִת-ஐச் சூழலுக்கேற்ப ‘ஆலயம்/ஆலயக் கட்டடம்’ என்றும் வழங்குவது பொருளைத் தெளிவாக்குகிறது; ‘முழம்’ மூலத்தின் அளவீட்டைத் தக்கவைக்கிறது. அடிக்குறிப்புகள் மாற்றுச் சொற்களையும் ‘அதன் அகலம்’ என்ற சொல்லர்த்தத்தையும் சரியாக விளக்குகின்றன.
