  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘வீடு’ என்பதற்குப் பதிலாக சூழலுக்கேற்ற ‘ஆலயம்’ பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் உள்ள அலங்காரத் தாவர வடிவங்களின் சொற்பொருள் நிச்சயமின்மை அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளது.
