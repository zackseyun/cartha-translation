  yaml_path: translation/ot/1_kings/006/018.yaml
  text: The cedar on the inside of the house was carved with gourds and open flowers[a]. Everything was cedar[b]; no stone was visible.
translation:
  language: ta
  text: ஆலயத்தின் உட்புறம் கேதுரு மரத்தால் மூடப்பட்டு, அதில் சுரைக்காய் வடிவங்களும்[a] விரிந்த மலர்களும்[b] செதுக்கப்பட்டிருந்தன. அனைத்தும் கேதுரு மரமாகவே இருந்தது; கல் எதுவும் கண்ணுக்குத் தெரியவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மொட்டுகள்.’ இதற்கான எபிரெயச் சொல் உருண்டையான அலங்கார வடிவங்களைக் குறிக்கிறது; இந்த ஆலயச் சூழலில் அது சுரைக்காய் போன்ற வடிவச் செதுக்கல்களைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘மலர்ந்த பூக்கள்.’ இங்கு எபிரெயச் சொற்றொடர் செதுக்கப்பட்ட மலர் வடிவங்களைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶז
  choice: கேதுரு மரம்
  rationale: இச்சொல் கேதுரு மரத்தையும் அதனால் செய்யப்பட்ட பலகை மூடுதலையும் குறிக்கிறது; நவீனத் தமிழில் பொருளைத் தெளிவாகக் காட்ட ‘கேதுரு மரம்’ இயல்பானது.
- source_word: אֶל־הַבַּיִת פְּנִימָה
  choice: ஆலயத்தின் உட்புறம்
  rationale: கேதுரு மர வேலை ஆலயத்தின் உள்ளே இருந்தது என்பதை மட்டுமல்லாமல், அதன் உட்பரப்பை மூடியிருந்ததையும் சூழல் காட்டுகிறது.
- source_word: מִקְלַעַת
  choice: செதுக்கப்பட்டிருந்தன
  rationale: கட்டட அலங்காரத்தில் பொறித்து அல்லது செதுக்கி உருவாக்கப்பட்ட வேலைப்பாட்டை இச்சொல் குறிக்கிறது; ‘செதுக்கப்பட்டிருந்தன’ தமிழில் இயல்பாக உள்ளது.
- source_word: פְּקָעִים
  choice: காய்கள்
  rationale: இது உருண்டையான தாவர வடிவ அலங்காரங்களைக் குறிக்கும் அரிய சொல்; ஆலயச் சூழலில் சுரைக்காய் போன்ற வடிவங்கள் எனப் புரிந்துகொள்ளலாம், ஆனால் ‘மொட்டுகள்’ என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: וּפְטוּרֵי צִצִּים
  choice: மலர்ந்த பூக்கள்
  rationale: விரிந்த அல்லது மலர்ந்த பூ வடிவச் செதுக்கல்களைக் குறிக்கும் சொற்றொடராக எடுத்துக்கொள்ளப்பட்டுள்ளது; ‘பூ மலர்கள்’ என்ற மாற்றுப் பொருளும் அடிக்குறிப்பில் சுட்டப்பட்டுள்ளது.
- source_word: הַכֹּל אֶרֶז
  choice: அனைத்தும் கேதுரு மரமாகவே இருந்ததால்
  rationale: கண்ணுக்குத் தெரிந்த உட்பரப்பு முழுவதும் கேதுரு மரத்தால் மூடப்பட்டிருந்தது என்ற சுருக்கக் கூற்றைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: אֵין אֶבֶן נִרְאָה
  choice: கல் எதுவும் கண்ணுக்குத் தெரியவில்லை
  rationale: எபிரெய மொழியின் எதிர்மறை நிலையையும் காணப்படுதல் என்ற பொருளையும் இயல்பான தமிழில் காக்கிறது.
