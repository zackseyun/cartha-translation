translation_notes:
  register: நவீன செந்தமிழ் நடையில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கட்டுமானச் சொற்கள் பயன்படுத்தப்பட்டுள்ளன. ‘வீடு’ என்ற நேரடி பொருளுக்குப் பதிலாக இச்சூழலில் சாலச் சரியான ‘ஆலயம்’ பயன்படுத்தப்பட்டது. வசனத்தின் இரண்டாம் வினையில் எபிரெயச் செயப்பாட்டு வடிவம் காக்கப்பட்டு, மாற்று செயப்படுவினை வாசிப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
