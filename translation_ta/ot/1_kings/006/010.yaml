base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/010.yaml
  text: He built the side structure against the whole house[a], five cubits high[b], and it was fastened to the house with cedar timbers.
translation:
  language: ta
  text: அவன் முழு ஆலயத்தையும் ஒட்டி, ஐந்து முழம் உயரமுள்ள பக்கக் கட்டமைப்பைக்[a] கட்டினான்; கேதுரு மரக் கட்டைகளால் ஆலயத்தை அதனோடு இணைத்தான்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பக்க அறைகளை.” எபிரெயச் சொல் ஆலயத்தை ஒட்டிச் சென்ற பக்கக் கட்டுமானத்தைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அது கேதுரு மரக் கட்டைகளால் ஆலயத்தோடு இணைக்கப்பட்டது.”
    reason: voice_and_lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: அவன் ... கட்டி
  rationale: בנה என்பதன் wayyiqtol வடிவம் தொடர்ச்சியான இறந்தகால நிகழ்வைக் குறிக்கிறது. அடுத்த வினையுடன் இயல்பாக இணைக்கத் தமிழில் வினையெச்சம் பயன்படுத்தப்பட்டது.
- source_word: היצוע
  choice: பக்கக் கட்டமைப்பு
  rationale: ஆலயத்தை ஒட்டிச் சென்ற இணைப்புக் கட்டுமானத்தை இச்சொல் குறிக்கிறது; தனித்தனி அறைகள் என்று அளவுக்கு மீறிக் குறிப்பாக்காமல் கட்டுமானத் தொகுதியைக் குறிக்கும் பரந்த சொல் தேர்ந்தெடுக்கப்பட்டது.
- source_word: עַל כָּל הַבַּיִת
  choice: ஆலயம் முழுவதையும் ஒட்டி
  rationale: עַל இங்கு இடம்சார் பொருளில் முதன்மைக் கட்டிடத்தை ஒட்டிய அமைப்பைக் குறிக்கிறது. כָּל என்பதன் முழுமைப் பொருளும் காக்கப்படுகிறது.
- source_word: חָמֵשׁ אַמּוֹת קוֹמָתוֹ
  choice: ஐந்து முழம் உயரமுள்ள
  rationale: சொல்லாட்சிப்படி ‘அதன் உயரம் ஐந்து முழம்’; தமிழில் இயல்பான அளவுக் குறிப்பாகப் பெயரெச்சத் தொடரில் தரப்பட்டது.
- source_word: וַיֶּאֱחֹז
  choice: இணைத்தான்
  rationale: אחז அடிப்படையில் ‘பற்றிக்கொள்’ எனினும், இக்கட்டுமானச் சூழலில் உறுதியான கட்டமைப்பு இணைப்பைக் குறிக்கிறது. எபிரெய வினை இலக்கணரீதியாகச் செயப்பாட்டு வடிவிலுள்ளதால் தமிழ் மொழிபெயர்ப்பிலும் செயப்பாட்டு வடிவம் காக்கப்பட்டது.
- source_word: אֶת הַבַּיִת
  choice: ஆலயத்தோடு
  rationale: இக்கட்டுமானச் சூழலில் வினையுடன் சேர்ந்து பக்கக் கட்டமைப்பு முதன்மை ஆலயக் கட்டிடத்துடன் இணைக்கப்பட்டதைத் தெரிவிக்கிறது.
- source_word: בַּעֲצֵי אֲרָזִים
  choice: கேதுரு மர உத்திரங்களால்
  rationale: עֲצֵי אֲרָזִים என்பது கேதுரு மரக் கட்டுமானப் பொருட்களைக் குறிக்கிறது. இணைப்புக்கு உரிய கட்டுமான உறுப்புகளைத் தெளிவுபடுத்த ‘உத்திரங்கள்’ பயன்படுத்தப்பட்டது; ‘மரக்கட்டைகள்’ என்பதும் சாத்தியம்.
