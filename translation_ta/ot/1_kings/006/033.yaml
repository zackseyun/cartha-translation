  yaml_path: translation/ot/1_kings/006/033.yaml
  text: And so he made for the entrance of the nave doorposts of olivewood[a], four-sided.
translation:
  language: ta
  text: அவ்வாறே, பிரதான மண்டபத்தின் நுழைவாயிலுக்கு ஒலிவ மரத்தினால் கதவு நிலைக்கால்களைச் செய்தான்; நான்கில் ஒரு பங்கிலிருந்து.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “நான்கில் ஒரு பங்கிலிருந்து.” இந்தக் கட்டடவியல் சொற்றொடரின் பொருள் தெளிவற்றது; அல்லது, “நான்கு பக்கச் சட்டத்துடன்” அல்லது “சதுர வடிவில்.” இது நுழைவாயிலின் வடிவத்தைக் குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וְכֵן
  choice: அவ்வாறே
  rationale: முந்தைய கட்டுமான விவரத்துடன் உள்ள ஒப்புமையையும் தொடர்ச்சியையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: עָשָׂה
  choice: செய்தான்
  rationale: கட்டுமானச் சூழலில் எளிமையானதும் நேரடியானதுமான வினைச்சொல்.
- source_word: לְפֶתַח הַהֵיכָל
  choice: பிரதான மண்டபத்தின் நுழைவாயிலுக்கு
  rationale: הֵיכָל என்பது உட்புறத் திருத்தலத்திலிருந்து வேறுபட்ட கோயிலின் பிரதான அறையைக் குறிக்கிறது; ‘பிரதான மண்டபம்’ பொதுவாசகருக்குத் தெளிவாக உள்ளது.
- source_word: מְזוּזוֹת
  choice: கதவு நிலைக்கால்கள்
  rationale: வாசலின் இருபுறமுள்ள செங்குத்தான தூண்களைத் துல்லியமாகக் குறிக்கும் இயல்பான தமிழ் கட்டடச் சொல்.
- source_word: עֲצֵי שָׁמֶן
  choice: ஒலிவ மரம்
  rationale: இச்சூழலில் இக்கூட்டு மொழி ஒலிவ மரக்கட்டையைக் குறிக்கிறது.
- source_word: מֵאֵת רְבִעִית
  choice: நான்கு பக்க அமைப்புடையவை
  rationale: கட்டடவியல் பொருள் தெளிவில்லாத எபிரெயச் சொற்றொடருக்கு சாத்தியமான வடிவவியல் பொருளை வாசிக்கத்தக்க தமிழில் தருகிறது; உறுதியின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
