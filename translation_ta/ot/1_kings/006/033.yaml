translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான கட்டடவியல் நடையில் மொழிபெயர்க்கப்பட்டது. மூலத்தின் தெளிவற்ற இறுதிச் சொற்றொடர் முதன்மை உரையில் வாசிக்கத்தக்க வகையில் தரப்பட்டு, அதன் உண்மையான மாற்றுப் பொருள்கள் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளன.
