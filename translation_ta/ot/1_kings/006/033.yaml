- from: அவ்வாறே, பிரதான மண்டபத்தின் நுழைவாயிலுக்கு ஒலிவ மரத்தால் கதவு நிலைக்கால்களைச் செய்தான்; அவை நான்கு பக்க அமைப்புடையவையாக இருந்தன.[a]
  to: அவ்வாறே, பிரதான மண்டபத்தின் நுழைவாயிலுக்கு ஒலிவ மரத்தினால் கதவு நிலைக்கால்களைச் செய்தான்; நான்கில் ஒரு பங்கிலிருந்து.[a]
