revisions:
- from: நான்காம் ஆண்டில், சிவ் மாதத்தில், யெகோவாவின் ஆலயத்திற்கு அடித்தளம் போடப்பட்டது.
  to: நான்காம் ஆண்டில், சிவ் மாதத்தில், யாவேவின் ஆலயத்தின் அடித்தளம் போடப்பட்டது.
  rationale: The revision aligns the divine name with project policy and clarifies that the foundation laid was that of Yahweh’s house. It retains the source’s limited temporal information and does not supply Solomon’s name, reign, or the ordinal number of Ziv.
