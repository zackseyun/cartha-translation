id: 1KI.6.37
reference: 1 Kings 6:37
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: בַּ/שָּׁנָה֙ הָֽ/רְבִיעִ֔ית יֻסַּ֖ד בֵּ֣ית יְהוָ֑ה בְּ/יֶ֖רַח זִֽו׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/037.yaml
  text: In the fourth year[a], the house of Yahweh was founded in the month of Ziv.
translation:
  language: ta
  text: நான்காம் ஆண்டில், சிவ் மாதத்தில், யாவேவின் ஆலயத்தின் அடித்தளம் போடப்பட்டது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּשָּׁנָה הָרְבִיעִית
  choice: நான்காம் ஆண்டில்
  rationale: எபிரெயச் சொற்றொடர் நேரடியாகக் காலத்தைக் குறிக்கிறது. சூழலில் இது சாலொமோனின் ஆட்சியாண்டு என்றாலும், இவ்வசனத்தில் அது மீண்டும் சொல்லப்படாததால் மொழிபெயர்ப்பிலும் சேர்க்கப்படவில்லை.
- source_word: יֻסַּד
  choice: அடித்தளம் போடப்பட்டது
  rationale: יסד என்பதன் செயப்பாட்டு வடிவம் கட்டடத்தின் அடித்தளம் இடப்படுதல் அல்லது நிறுவப்படுதலைக் குறிக்கிறது. தமிழ் கட்டடச் சூழலில் ‘அடித்தளம் போடப்பட்டது’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: בֵּית יְהוָה
  choice: யெகோவாவின் ஆலயம்
  rationale: בַּיִת என்பதன் நேரடிப் பொருள் ‘வீடு’ என்றாலும், இங்கு அது யெகோவாவுக்காகக் கட்டப்பட்ட ஆலயத்தைக் குறிக்கிறது. நவீனத் தமிழில் ‘ஆலயம்’ பொருளைத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: எபிரெய மூலத்தில் உள்ள இறைபெயரைப் பொதுப்பட்டமான ‘கர்த்தர்’ என்று மாற்றாமல் தனிப்பெயராகப் பாதுகாக்கிறது; தமிழில் பரவலாக அறியப்பட்ட வடிவம் ‘யெகோவா’.
- source_word: בְּיֶרַח זִו
  choice: சிவ் மாதத்தில்
  rationale: יֶרַח என்பது ‘மாதம்’; זִו என்பது அந்த மாதத்தின் பெயர். ‘இரண்டாம் மாதம்’ என்பது முந்தைய சூழலில் இருந்தாலும் இவ்வசனத்தில் இல்லாததால் சேர்க்கப்படவில்லை.
theological_decisions:
- issue: יְהוָה என்ற இறைபெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: யாவே / கர்த்தர்
  rationale: மூலத்தில் இறைபெயர் நேரடியாக இடம்பெறுவதால் அதைத் தனிப்பெயராகவே வழங்குகிறது. ‘யெகோவா’ என்பது நவீன தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அடையாளம் காணப்படும் வடிவம்; ‘கர்த்தர்’ என்பது பெயரைப் பட்டமாக மாற்றிவிடும்.
- issue: בֵּית יְהוָה என்பதிலுள்ள உருவகத்தை வழங்குதல்
  choice: யெகோவாவின் ஆலயம்
  alternative: யெகோவாவின் வீடு
  rationale: ‘வீடு’ என்பது சொற்பொருள் என்றாலும், இக்கட்டடச் சூழலில் ‘ஆலயம்’ குறிக்கப்படும் பொருளை சாதாரண வாசகருக்குத் தெளிவாக்குகிறது; எந்தப் பிரிவுசார் விளக்கமும் இதில் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் சுருக்கமான, கண்ணியமான வரலாற்று நடையைப் பயன்படுத்தியுள்ளது. எபிரெயச் சொல் வரிசையை அப்படியே பின்பற்றாமல், ‘சிவ் மாதத்தில்’ என்பதை அடித்தளம் போடப்பட்ட நிகழ்வுடன் இயல்பாக இணைத்துள்ளது. மூலத்தில் இல்லாத ‘சாலொமோனின் ஆட்சியின்’ மற்றும் ‘இரண்டாம்’ ஆகிய விளக்கங்கள் சேர்க்கப்படவில்லை.
