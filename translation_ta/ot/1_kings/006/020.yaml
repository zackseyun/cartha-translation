  text: וְ/לִ/פְנֵ֣י הַ/דְּבִ֡יר עֶשְׂרִים֩ אַמָּ֨ה אֹ֜רֶךְ וְ/עֶשְׂרִ֧ים אַמָּ֣ה רֹ֗חַב וְ/עֶשְׂרִ֤ים אַמָּה֙ קֽוֹמָת֔/וֹ וַ/יְצַפֵּ֖/הוּ זָהָ֣ב סָג֑וּר וַ/יְצַ֥ף מִזְבֵּ֖חַ אָֽרֶז׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/020.yaml
  text: In front of the inner sanctuary was twenty cubits in length[a], twenty cubits in width, and twenty cubits in its height. He overlaid it with pure gold[b], and he overlaid the cedar altar.
translation:
  language: ta
  text: உள்திருத்தலம்[a] இருபது முழம் நீளமும், இருபது முழம் அகலமும், இருபது முழம் உயரமும் கொண்டிருந்தது. அவன் அதைத் தூய தங்கத்தால் மூடினான்[b]; கேதுரு மரப் பலிபீடத்தையும் தங்கத்தால் மூடினான்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்சார்ந்து, “உள்திருத்தலத்தின் முன்பாக” என்றும் வாசிக்கலாம். இச்சுருக்கமான தொடரின் துல்லியமான தொடரியல் உறவு தெளிவற்றது; சூழலில் இது உள்திருத்தலத்தின் அளவுகளை அறிமுகப்படுத்துவதாகப் புரிந்துகொள்ளப்படுகிறது.
    reason: source_ambiguity
  - marker: b
    text: “நயமான தங்கம்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொற்றொடர் உயர்தரமாகச் சுத்திகரிக்கப்பட்ட தங்கத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “கேதுரு மரத்தாலான ஒரு பலிபீடத்தையும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי הַדְּבִיר
  choice: உள்திருத்தலத்தின் உட்புறம்
  rationale: לִפְנֵי என்பதன் அடிப்படைப் பொருள் ‘முன்/முன்பாக’ என்றாலும், இங்குள்ள சுருக்கமான கட்டமைப்பும் தொடர்ந்து வரும் கனசதுர அளவுகளும் உள்திருத்தலத்தின் உள்ளிடத்தையே குறிக்கின்றன. இயல்பான தமிழுக்காக ‘உட்புறம்’ என மொழிபெயர்த்து, சொற்சார்ந்த மாற்றுப் பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: הַדְּבִיר
  choice: உள்திருத்தலம்
  rationale: ஆலயத்தின் மிக உள்ளார்ந்த புனித அறையைக் குறிக்கிறது. பிற்காலத் தொழில்நுட்பப் பெயரை வலுக்கட்டாயமாகப் புகுத்தாமல், இடத்தின் தன்மையைத் தெளிவாகக் காட்டும் சொல்.
- source_word: עֶשְׂרִים אַמָּה ... אֹרֶךְ / רֹחַב / קוֹמָתוֹ
  choice: இருபது முழம் நீளமும், இருபது முழம் அகலமும், இருபது முழம் உயரமும்
  rationale: மூலத்தின் மூன்று சம அளவுகளையும் அதன் பழங்கால அளவலகான ‘முழம்’ என்பதையும் அப்படியே காக்கும் இயல்பான தமிழ் அளவுக் கூறு.
- source_word: וַיְצַפֵּהוּ
  choice: அதற்குத் ... தகடு பதித்தான்
  rationale: צפה என்பது மேற்பரப்பை ஒரு பொருளால் மூடுதல் அல்லது தகடு பதித்தலைக் குறிக்கிறது; உலோக வேலைப்பாட்டுச் சூழலில் ‘தகடு பதித்தான்’ துல்லியமானது.
- source_word: זָהָב סָגוּר
  choice: தூய தங்கம்
  rationale: உயர்தரமாகச் சுத்திகரிக்கப்பட்ட தங்கத்தைக் குறிக்கும் சொற்றொடர்; ‘தூய தங்கம்’ தெளிவான நவீன தமிழ். ‘நயமான தங்கம்’ என்ற மாற்றும் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וַיְצַף מִזְבֵּחַ אָרֶז
  choice: கேதுரு மரப் பலிபீடத்திற்கும் தங்கத் தகடு பதித்தான்
  rationale: מִזְבֵּחַ אָרֶז என்பது கேதுரு மரத்தால் செய்யப்பட்ட பலிபீடத்தைச் சுருக்கமாகக் குறிக்கிறது. இரண்டாம் வினையில் பொருள் வெளிப்படையாகச் சொல்லப்படாவிட்டாலும் முந்தைய ‘தங்கம்’ இயல்பாகத் தொடர்வதால் தமிழில் தெளிவுபடுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: לִפְנֵי הַדְּבִיר என்ற சுருக்கமான தொடரின் இடவியல் பொருள்
  choice: உள்திருத்தலத்தின் உட்புறம்
  alternative: உள்திருத்தலத்தின் முன்புறம் / உள்திருத்தலத்துக்கு முன்பாக
  rationale: அளவுகள் உள்திருத்தலத்தை ஒரு இருபது முழக் கனசதுர இடமாக விவரிப்பதே சூழலுக்கு மிகவும் பொருந்துகிறது. ஆயினும் לִפְנֵי என்பதன் சொற்சார்ந்த ‘முன்’ பொருள் முற்றிலும் மறைக்கப்படாமல் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத்தமிழில், ஆலயக் கட்டுமானச் சூழலுக்கேற்ற கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘முழம்’ என்ற மூல அளவலகு மாற்றமின்றிக் காக்கப்பட்டது; பழைய அல்லது சமயப்பிரிவுக்கே உரிய தொழில்நுட்பச் சொற்கள் தவிர்க்கப்பட்டன.
