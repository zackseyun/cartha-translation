  yaml_path: translation/ot/1_kings/006/026.yaml
  text: The height of the one cherub was ten cubits[a], and so it was with the second cherub.
translation:
  language: ta
  text: ஒரு கேருபின் உயரம் பத்து முழம்[a]; இரண்டாவது கேருபின் உயரமும் அதே அளவுதான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: முழம் என்பது முழங்கையிலிருந்து விரல் நுனிவரையுள்ள தூரத்தை அடிப்படையாகக் கொண்ட ஒரு பழங்கால நீள அலகு.
    reason: cultural_note
lexical_decisions:
- source_word: קוֹמַת
  choice: உயரம்
  rationale: கோவில் அமைப்பின் அளவுகளை விவரிக்கும் இச்சூழலில், இச்சொல் உருவத்தின் செங்குத்தான அளவைக் குறிக்கிறது; நவீன தமிழில் ‘உயரம்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: הַכְּרוּב
  choice: கேருபு
  rationale: ஒரே ஒரு கேருபு உருவத்தைக் குறிக்கும் எபிரேய ஒருமையைத் தமிழிலும் ஒருமையாகப் பாதுகாக்கிறது.
- source_word: הָאֶחָד
  choice: ஒரு
  rationale: இரு கேருபுகளில் ஒன்றை மற்றொன்றிலிருந்து வேறுபடுத்தும் எபிரேய சொல்லை இயல்பான தமிழில் தருகிறது; ‘முதலாவது’ என்று மொழிபெயர்த்து வரிசைமுறையைச் சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: עֶשֶׂר בָּאַמָּה
  choice: பத்து முழம்
  rationale: ‘உயரம்’ ஏற்கெனவே கூறப்பட்டுள்ளதால் அளவை நேரடியாகத் தருகிறது. ‘முழம்’ என்பது முழங்கையிலிருந்து விரல் நுனிவரை அடிப்படையாகக் கொண்ட பழங்கால நீள அலகுக்கான நிலைபெற்ற தமிழ் சொல்.
- source_word: וְכֵן
  choice: அதே அளவுதான்
  rationale: இரண்டாவது கேருபின் உயரமும் முதலாவதின் உயரத்துக்குச் சமம் என்ற ஒப்புமையைத் தெளிவான, இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: הַכְּרוּב הַשֵּׁנִי
  choice: இரண்டாவது கேருபு
  rationale: எபிரேய மூலத்தில் உள்ள ‘இரண்டாவது’ என்ற வெளிப்படையான வரிசைச் சொல்லைப் பாதுகாக்கிறது.
