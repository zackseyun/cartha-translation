base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/021.yaml
  text: Solomon overlaid the inside of the house with pure gold[a], and he drew gold chains across the front of the inner sanctuary[c][b], and overlaid it with gold.
translation:
  language: ta
  text: சாலொமோன் ஆலயத்தின் உட்புறத்தைத் தூய தங்கத்தால்[a] பொதிந்தான். உள்தூயகத்தின்[c] முன்பாகத் தங்கச் சங்கிலிகளை நீட்டினான்[b]; அதைத் தங்கத்தால் பொதிந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘புடமிடப்பட்ட தங்கத்தால்.’ எபிரெயச் சொற்றொடரைச் சொல்லுக்குச் சொல் மொழிபெயர்த்தால் ‘மூடப்பட்ட தங்கம்’ என்று வரும்; அது உயர்தரமான தங்கத்தைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘உள்தூயகத்தின் முன்பாகத் தங்கச் சங்கிலிகளை வைத்தான்.’ எபிரெயம் சங்கிலிகள் உள்தூயகத்தின் முன் வைக்கப்பட்டதைக் குறிக்கலாம்; ‘நீட்டினான்’ என்பது ‘கடக்கச் செய்தான்’ என்ற வினையின் சாத்தியமான பொருளைப் பிரதிபலிக்கிறது.
    reason: alternative_reading
  - marker: c
    text: ‘உள்தூயகம்’ என்பது ஆலயத்தின் மிக உள்ளார்ந்த அறையான தெபீரைக் குறிக்கிறது; பின்னாளில் இது ‘மகா பரிசுத்த ஸ்தலம்’ என அழைக்கப்பட்டது.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְצַף
  choice: பொதிந்தான்
  rationale: ஆலயக் கட்டுமானச் சூழலில் צפה என்பது ஒரு மேற்பரப்பை உலோகம் போன்ற பொருளால் மூடுவதைக் குறிக்கிறது; ‘பொதிந்தான்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: הַבַּיִת
  choice: ஆலயம்
  rationale: எபிரெயத்தில் சொற்பொருளாக ‘வீடு’ என்றாலும், உடனடிச் சூழலில் அது கர்த்தருடைய ஆலயத்தையே குறிக்கிறது; நவீனத் தமிழில் ‘ஆலயம்’ தெளிவானது.
- source_word: מִפְּנִימָה
  choice: உட்புறத்தை
  rationale: ஆலயத்தின் உள்ளமைந்த மேற்பரப்பைக் குறிக்கும் இடவியல் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: זָהָב סָגוּר
  choice: தூய தங்கம்
  rationale: சொல்லுக்கு சொல் ‘மூடப்பட்ட தங்கம்’ என இருந்தாலும், இந்த மரபுத்தொடர் உயர்தரமான அல்லது புடமிடப்பட்ட தங்கத்தைக் குறிக்கிறது.
- source_word: וַיְעַבֵּר
  choice: இழுத்துக் கட்டினான்
  rationale: ஹிஃபில் வடிவம் ‘கடக்கச் செய்தான்’ எனும் அடிப்பொருளுடையது; சங்கிலிகளை முன்புறம் குறுக்காக நீட்டிய அமைப்பைத் தமிழில் தெளிவுபடுத்துகிறது.
- source_word: בְּרַתּוּקוֹת
  choice: சங்கிலிகளை
  rationale: அரிதான இப்பெயர்ச்சொல்லுக்கு இச்சூழலில் மிகவும் பொருத்தமானதும் பரவலாக ஏற்கப்பட்டதுமான பொருள் ‘சங்கிலிகள்’.
- source_word: לִפְנֵי הַדְּבִיר
  choice: உள்தூயகத்தின் முன்புறம் முழுவதும்
  rationale: לִפְנֵי என்பது ‘முன்பாக’ என்றும், வினைச்சொல் சங்கிலிகளை அந்த முன்பகுதியில் குறுக்காக நீட்டியதையும் சுட்டுகிறது; ‘முழுவதும்’ அந்த அமைப்பின் திசையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַדְּבִיר
  choice: உள்தூயகம்
  rationale: ஆலயத்தின் மிக உள்ளார்ந்த அறையைக் குறிக்கிறது; பின்னாளைய தொழில்நுட்பப் பெயரை முதன்மை உரையில் திணிக்காமல் சுருக்கமாகவும் புரியும்படியும் வழங்குகிறது.
- source_word: וַיְצַפֵּהוּ
  choice: அதையும் தங்கத்தால் பொதிந்தான்
  rationale: ஆண்பால் ஒருமை பின்னொட்டை ‘அது’ என்று வைத்திருப்பதால், அது உள்தூயகத்தையா அதன் முன்புற அமைப்பையா குறிக்கிறது என்பதைத் தேவையின்றி தீர்மானிக்கவில்லை.
theological_decisions:
- issue: הַדְּבִיר என்பதற்கு பின்னாளில் பயன்பட்ட ‘மகா பரிசுத்த ஸ்தலம்’ என்ற பெயரை முதன்மை உரையில் பயன்படுத்துதல்
  choice: உள்தூயகம்
  alternative: மகா பரிசுத்த ஸ்தலம்
  rationale: இவ்வசனத்தின் எபிரெயச் சொல் ஆலயத்தின் உள்ளார்ந்த அறையைச் சுட்டுகிறது; பின்னாளைய பெயரை விளக்கக் குறிப்பில் தருவது மூலத்தின் காலச்சூழலையும் சொல்வடிவையும் சிறப்பாகக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கட்டுமானச் சொல்லாட்சி பயன்படுத்தப்பட்டுள்ளது. அரிதான ஆலயச் சொல் ‘தெபீர்’ முதன்மை உரையில் ஒலிபெயர்க்கப்படாமல் ‘உள்தூயகம்’ என வழங்கப்பட்டு, அதன் பின்னணி அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது. மூலத்திலுள்ள இறுதி ஒருமைப் பெயர்ச்சுட்டின் தெளிவின்மை ‘அதையும்’ என்பதால் பாதுகாக்கப்பட்டுள்ளது.
