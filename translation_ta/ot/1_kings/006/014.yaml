lexical_decisions:
- source_word: וַיִּבֶן
  choice: கட்டி
  rationale: בנה என்பதன் Qal wayyiqtol வடிவம் தொடர்ச்சியான கடந்தகாலச் செயலைக் குறிக்கிறது. அடுத்துள்ள ‘முடித்தான்’ என்பதோடு இயல்பாக இணைவதற்காக ‘கட்டி’ என மொழிபெயர்க்கப்பட்டது.
- source_word: שְׁלֹמֹה
  choice: சாலொமோன்
  rationale: எபிரெய தனிப்பெயரின் தமிழில் வழக்கமாக நிலைபெற்றுள்ள ஒலிபெயர்ப்பு.
- source_word: הַבַּיִת
  choice: அந்த ஆலயம்
  rationale: בַּיִת என்பதன் நேர்ப்பொருள் ‘வீடு’ என்றாலும், இச்சூழலில் அது ஆண்டவரின் ஆலயத்தைக் குறிக்கிறது. நவீனத் தமிழில் ‘அந்த ஆலயம்’ என்பது முந்தைய சூழலைத் தெளிவாகச் சுட்டி இயல்பாகப் புரிகிறது; நேர்ப்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וַיְכַלֵּהוּ
  choice: முடித்தான்
  rationale: Piel வடிவிலுள்ள כלה மற்றும் மூன்றாம் ஆண்பால் ஒருமை பொருள் பின்னொட்டு, முன் கூறப்பட்ட கட்டிடத்தை முழுமைப்படுத்தியதைக் குறிக்கின்றன. தமிழில் ‘கட்டி முடித்தான்’ என்பது சுருக்கமான, இயல்பான இணைவு.
