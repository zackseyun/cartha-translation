source:
  edition: WLC
  text: וְ/עֶ֨שֶׂר֙ בָּֽ/אַמָּ֔ה הַ/כְּר֖וּב הַ/שֵּׁנִ֑י מִדָּ֥ה אַחַ֛ת וְ/קֶ֥צֶב אֶחָ֖ד לִ/שְׁנֵ֥י הַ/כְּרֻבִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/025.yaml
  text: And the second cherub was ten cubits[a]; both cherubim had one measure and one form.
translation:
  language: ta
  text: இரண்டாவது கேருபும் பத்து முழம் இருந்தது; இரண்டு கேருபுகளுக்கும் ஒரே அளவும் ஒரே வடிவமும் இருந்தன.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעֶשֶׂר בָּאַמָּה
  choice: பத்து முழம் இருந்தது
  rationale: எபிரெயச் சொற்றொடர் அளவை மட்டும் குறிப்பிடுகிறது; உயரம் என்று வெளிப்படையாகச் சொல்லவில்லை. ஆகவே சூழலுக்கேற்ற இயல்பான தமிழில், ஆனால் தேவையற்ற விளக்கத்தைச் சேர்க்காமல் மொழிபெயர்க்கப்பட்டது.
- source_word: הַכְּרוּב הַשֵּׁנִי
  choice: இரண்டாவது கேருபும்
  rationale: திட்டவட்டமான பெயர்ச்சொல்லும் வரிசை எண்ணும் நேரடியாகப் பிரதிபலிக்கப்படுகின்றன. முந்தைய கேருபுடன் ஒப்பிடப்படுவதைக் காட்ட இணைப்புப் பொருளில் ‘உம்’ பயன்படுத்தப்பட்டது.
- source_word: מִדָּה אַחַת
  choice: ஒரே அளவு
  rationale: מִדָּה என்பது அளவு அல்லது பரிமாணத்தைக் குறிக்கிறது. இரண்டு கேருபுகளுக்கும் அது ஒன்றே என்பதே இங்கு இயல்பான பொருள்.
- source_word: וְקֶצֶב אֶחָד
  choice: ஒரே வடிவம்
  rationale: קֶצֶב இங்கு வடிவம், விகிதம் அல்லது ஒட்டுமொத்த அமைப்பைக் குறிக்கலாம். ‘வடிவம்’ என்பது மூலத்தின் பரந்த பொருளைக் காக்கும் தெளிவான நவீனத் தமிழ் சொல்.
- source_word: לִשְׁנֵי הַכְּרֻבִים
  choice: இரண்டு கேருபுகளுக்கும்
  rationale: எபிரெயத்தில் உள்ள ‘இரண்டு கேருபுகளுக்கு’ என்ற உறவு இயல்பான தமிழில் உரிமை/பொருந்துதலைக் காட்டும் வகையில் அமைக்கப்பட்டது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘கேருபு’ என்பது குறிப்பிட்ட விண்ணுலக உயிரினத்தைக் குறிக்கும் வேதாகமப் பெயராக ஒலிபெயர்க்கப்பட்டது; ‘உயரம்’ போன்ற மூலத்தில் வெளிப்படையாக இல்லாத விவரம் சேர்க்கப்படவில்லை.
