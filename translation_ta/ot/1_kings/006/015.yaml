  text: He built the walls of the house on the inside with cedar boards[a]; from the floor of the house to the walls of the ceiling he covered them with wood on the inside[b], and he overlaid the floor of the house with boards of cypress.
translation:
  language: ta
  text: அவன் ஆலயத்தின் சுவர்களை உட்புறத்தில் கேதுரு மரப்பலகைகளால் அமைத்தான். ஆலயத்தின் தரைமுதல் மேற்கூரையின் சுவர்ப்பகுதி வரை[a] உட்புறச் சுவர்களை மரத்தால் மூடினான்; ஆலயத்தின் தரையைச் சைப்ரஸ் மரப்பலகைகளால்[b] மூடினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மேற்கூரையின் சுவர்ப்பகுதி” என்பதற்கான எபிரெயச் சொற்றொடர் வழக்கத்திற்கு மாறானது; இது உட்புற மேற்கூரை அல்லது கூரையின் கீழுள்ள மரப்பூச்சு வரை என்பதைக் குறிக்கலாம்.
    reason: textual_ambiguity
  - marker: b
    text: “சைப்ரஸ்” என மொழிபெயர்க்கப்பட்டுள்ள எபிரெய மரப்பெயர் உறுதியாக அடையாளம் காணப்படவில்லை; அது ஜூனிப்பர் போன்ற வேறோர் ஊசியிலை மரத்தையும் குறிக்கலாம். பாரம்பரியமாக “ஃபர் மரம்” என மொழிபெயர்க்கப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן אֶת קִירוֹת הַבַּיִת מִבַּיְתָה
  choice: அவன் ஆலயத்தின் உட்புறச் சுவர்களை ... அமைத்தான்
  rationale: בנה என்பது கட்டுதல் அல்லது அமைத்தல் எனப் பொருள்படும். இங்கு மரப்பலகைகளால் உட்புறச் சுவர்களை அமைக்கும் பணி குறிக்கப்படுவதால், இயல்பான கட்டடக்கலைச் சொல்லாக ‘அமைத்தான்’ பயன்படுத்தப்பட்டது. הַבַּיִת என்பதற்கு சூழலின்படி ‘ஆலயம்’ எனத் தெளிவுபடுத்தப்பட்டது.
- source_word: בְּצַלְעוֹת אֲרָזִים
  choice: கேதுரு மரப்பலகைகளால்
  rationale: צלעות என்பதன் அடிப்படைப் பொருள் பக்கத்துண்டுகள் அல்லது விலாப்பகுதிகள் என்றாலும், இந்தக் கட்டடச் சூழலில் மரப்பலகைகளைக் குறிக்கிறது. אֲרָזִים என்பது கேதுரு மரங்கள்.
- source_word: מִקַּרְקַע הַבַּיִת
  choice: ஆலயத்தின் தரைமுதல்
  rationale: קַרְקַע என்பது நிலப்பரப்பு அல்லது தரை; கட்டடத்தின் உட்புறச் சூழலில் ‘தரை’ பொருத்தமானது.
- source_word: עַד קִירוֹת הַסִּפֻּן
  choice: மேற்கூரையின் சுவர்ப்பகுதி வரை
  rationale: சொற்றொடர் நேரடியாக ‘மூடப்பட்ட மேற்பகுதியின்/மேற்கூரையின் சுவர்கள் வரை’ என வருகிறது; அதன் வழக்கத்திற்கு மாறான கட்டடக்கலைச் சொல்லாட்சியை முற்றிலும் நீக்காமல் புரியத்தக்க தமிழில் வழங்கப்பட்டது.
- source_word: צִפָּה עֵץ מִבָּיִת
  choice: உட்புறத்தை மரத்தால் மூடினான்
  rationale: צפה இங்கு ஒரு மேற்பரப்பை வேறொரு பொருளால் மூடுதல் அல்லது பதித்தல் எனப் பொருள்படும். எபிரெயத்தில் விடப்பட்டுள்ள செயப்படுபொருள் முந்தைய உட்புறப் பகுதியிலிருந்து தெளிவாகிறது.
- source_word: בְּצַלְעוֹת בְּרוֹשִׁים
  choice: சைப்ரஸ் மரப்பலகைகளால்
  rationale: צלעות இங்கும் பலகைகளைக் குறிக்கிறது. ברוש என்பது சரியாக அடையாளம் காணப்படாத ஓர் ஊசியிலை மரப்பெயர்; ‘சைப்ரஸ்’ பொதுவான நவீன இணையாகப் பயன்படுத்தப்பட்டு, மாற்றுகள் அடிக்குறிப்பில் தரப்பட்டன.
