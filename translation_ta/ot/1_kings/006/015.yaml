translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளக்கூடிய மதிப்புமிக்க நடை பயன்படுத்தப்பட்டது. கட்டடக்கலைச் சொற்றொடரின் எபிரெயத் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டது; ஒரே வேரிலிருந்து வரும் இரு வினைகளும் தமிழில் இயல்பாக ‘அமைத்தான்’ மற்றும் ‘மூடினான்’ என வேறுபடுத்தப்பட்டன.
