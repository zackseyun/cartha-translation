  yaml_path: translation/ot/1_kings/006/032.yaml
  text: Also[a], the two doors were of olivewood, and he carved on them engravings of cherubim and palm trees and open flowers, and overlaid them with gold[b]; and he spread the gold over the cherubim and over the palm trees.
translation:
  language: ta
  text: மேலும், இரண்டு கதவுகளும் ஒலிவ மரத்தால் செய்யப்பட்டிருந்தன. அவற்றில் கேருபீன்கள், பேரீச்சமரங்கள், விரிந்த மலர்கள் ஆகியவற்றின் உருவங்களைச் செதுக்கினான்[a]. அந்தக் கதவுகளைத் தங்கத்தால் மூடி, கேருபீன்கள்மேலும் பேரீச்சமரங்கள்மேலும் தங்கத்தைப் பரப்பினான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கேருபீன்கள், பேரீச்சமரங்கள், மலர்ந்த பூக்கள் ஆகியவற்றின் செதுக்குவேலைப்பாடுகளை.”
    reason: lexical_alternative
  - marker: b
    text: இறுதி வாக்கியத்திலுள்ள எபிரெய வினைச்சொல் சொற்பொருளில் “கீழிறங்கச் செய்தான்” அல்லது “கீழ்நோக்கிப் பரப்பினான்” எனப் பொருள்படும்; செதுக்கப்பட்ட உருவங்கள்மேல் தங்கத்தைப் பதித்த செயலை இது விவரிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁתֵּי דַּלְתוֹת עֲצֵי שֶׁמֶן
  choice: மேலும், இரண்டு கதவுகளும் ஒலிவ மரத்தால் செய்யப்பட்டிருந்தன
  rationale: வ என்பது முந்தைய கட்டிட விவரிப்புடன் இணைக்கும் சேர்க்கைப் பொருளைத் தருகிறது. דַּלְתוֹת என்பது கதவுகள் அல்லது கதவுத் தகடுகள்; עֲצֵי שֶׁמֶן இச்சூழலில் ஒலிவ மரத்தைக் குறிக்கிறது. எபிரெயில் வெளிப்படையாக இல்லாத இணைப்புவினை தமிழில் இயல்புக்காகச் சேர்க்கப்பட்டுள்ளது.
- source_word: וְקָלַע עֲלֵיהֶם מִקְלְעוֹת
  choice: அவற்றில் ... உருவங்களைச் செதுக்கினான்
  rationale: கோவில் அலங்காரச் சூழலில் வினையும் பெயர்ச்சொல்லும் மரத்தில் செதுக்கிய அலங்கார உருவங்கள் அல்லது வேலைப்பாடுகளைக் குறிக்கின்றன. மீளுரையைத் தவிர்த்து இயல்பான தமிழில் பொருள் தெரிவிக்கப்பட்டுள்ளது.
- source_word: כְּרוּבִים
  choice: கேருபீன்கள்
  rationale: கோவில் சார்ந்த விண்ணுலகக் காவல் உருவங்களுக்கான மரபான ஒலிபெயர்ப்பைப் பேணுகிறது; சாதாரண தேவதூதர்கள் என்று பொருள் குறுக்கப்படவில்லை.
- source_word: תִמֹרוֹת
  choice: பேரீச்சமரங்கள்
  rationale: இது அலங்காரத்தில் இடம்பெற்ற பனைவகை மர உருவங்களைக் குறிக்கிறது. வேதாகம நிலப்பரப்பில் குறிப்பான மரத்தைத் தெளிவாகக் காட்ட ‘பேரீச்சமரங்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: פְּטוּרֵי צִצִּים
  choice: விரிந்த மலர்கள்
  rationale: மலர்ந்தோ விரிந்தோ காணப்படும் பூ வடிவ அலங்காரங்களை இச்சொற்றொடர் குறிக்கிறது; தாவரவகையைத் தேவையின்றி குறிப்பாக்காமல் காட்சிப் பொருளைப் பேணுகிறது.
- source_word: וְצִפָּה זָהָב
  choice: அவற்றைத் தங்கத்தால் மூடி
  rationale: צפה என்பது ஒரு மேற்பரப்பை உலோகத்தால் பொதிதல் அல்லது மூடுதல். ‘தங்கத்தால் மூடி’ என்பது தற்போதைய தமிழில் தெளிவாகவும் கட்டிடச் சூழலுக்கு ஏற்றதாகவும் உள்ளது.
- source_word: וַיָּרֶד ... אֶת־הַזָּהָב
  choice: தங்கத்தைப் பரப்பினான்
  rationale: வினைச்சொல் சொற்பொருளில் ‘கீழே செல்லச் செய்தான்’ எனினும், இங்குள்ள அரிய காரணவினைக் கட்டமைப்பு செதுக்கப்பட்ட உருவங்கள்மேல் தங்கத்தைப் பதித்துப் பரப்பிய செயலை விவரிக்கிறது. ‘பரப்பினான்’ மூல உருவகத்தின் திசை உணர்வை ஓரளவு பேணுகிறது.
- source_word: עַל הַכְּרוּבִים וְעַל הַתִּמֹרוֹת
  choice: கேருபீன்கள்மேலும் பேரீச்சமரங்கள்மேலும்
  rationale: மீண்டும் வரும் עַל இருவகைச் செதுக்குருவங்களும் தனித்தனியாகத் தங்கத்தால் மூடப்பட்டதை வலியுறுத்துகிறது; தமிழிலும் ‘மேலும்’ மீண்டும் வழங்கப்பட்டுள்ளது.
