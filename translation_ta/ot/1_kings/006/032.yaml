translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified நடையில் மொழிபெயர்க்கப்பட்டது. கட்டிடக் கலைச் சொற்களில் மிகத் தொழில்நுட்பமான நடையைத் தவிர்த்து, ‘செதுக்கினான்’, ‘மூடி’, ‘பரப்பினான்’ போன்ற தெளிவான சொற்கள் பயன்படுத்தப்பட்டன. மூலத்தின் தொடர்ச்சியை ‘மேலும்’ பேணுகிறது.
