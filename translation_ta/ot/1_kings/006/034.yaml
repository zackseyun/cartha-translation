  text: and two doors of cypress wood[a]; the one door had two folding leaves[b], and the second door had two folding leaves.
translation:
  language: ta
  text: மேலும், சைப்ரஸ் மரத்தால்[a] செய்யப்பட்ட இரண்டு கதவுகள் இருந்தன. முதல் கதவு இரண்டு மடிப்புப் பலகைகளைக்[b] கொண்டிருந்தது; இரண்டாம் கதவும் இரண்டு மடிப்புப் பலகைகளைக் கொண்டிருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: பாரம்பரியமாக, ‘ஃபிர் மரம்’ என்றும் மொழிபெயர்க்கப்படுகிறது. எபிரெயச் சொல் சைப்ரஸ் அல்லது அதற்கு ஒத்த ஓர் ஊசியிலை மரத்தைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயக் கட்டடக்கலைச் சொற்கள் அரிதானவை. மாற்றாக, ‘இரண்டு பக்கப் பலகைகள் சுழலக்கூடியவையாக இருந்தன’ என்றும் மொழிபெயர்க்கலாம்; பொதுவாக இவை மடிப்புக் கதவுப் பலகைகள் எனப் புரிந்துகொள்ளப்படுகின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַלְתוֹת
  choice: கதவுகள்
  rationale: இரண்டு கதவு அமைப்புகளைக் குறிக்கும் பன்மைச் சொல்; இயல்பான நவீனத் தமிழில் ‘கதவுகள்’ தெளிவாக உள்ளது.
- source_word: עֲצֵי בְרוֹשִׁים
  choice: தேவதாரு போன்ற மரம்
  rationale: בְּרוֹשׁ எந்த மரவகையைக் குறிக்கிறது என்பது உறுதியல்ல; சைப்ரஸ், ஃபிர் அல்லது அதற்கு ஒத்த ஊசியிலை மரமாக இருக்கலாம். ஆகவே குறிப்பிட்ட இனத்தைத் தீர்மானிக்காமல் ஒப்புமை வடிவம் பயன்படுத்தப்பட்டது.
- source_word: צְלָעִים
  choice: மடிப்புப் பலகைகள்
  rationale: அடிப்படைப் பொருள் ‘பக்கங்கள்/விலாப்பகுதிகள்’; இக்கட்டடச் சூழலில் கதவின் இணைக்கப்பட்ட பகுதிகளைச் சுட்டுகிறது. ‘மடிப்புப் பலகைகள்’ அதன் செயல்பாட்டை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: גְּלִילִים
  choice: மடிப்பு அமைப்புடைய
  rationale: இச்சொல் சுழலுதல் அல்லது திரும்புதல் சார்ந்த அரிய கட்டடப் பயன்பாடு; கதவுப் பகுதிகள் நகரும் அமைப்பைச் சுட்டுவதாகப் புரிந்துகொள்ளப்படுகிறது.
- source_word: קְלָעִים
  choice: மடிப்புப் பலகைகள்
  rationale: அரிதான சொல்லாக இருந்தாலும் முதல் கதவை விவரிக்கும் சொல்லுக்கு இணையாக இரண்டாம் கதவின் பகுதிகளைக் குறிக்கிறது; இணை அமைப்பைத் தமிழில் ஒரே சொற்றொடரால் காக்கிறது.
- source_word: הַדֶּלֶת הָאַחַת / הַדֶּלֶת הַשֵּׁנִית
  choice: முதல் கதவு / இரண்டாம் கதவு
  rationale: இரண்டு கதவுகளுக்கிடையேயான எபிரெய எதிர்மறை இணைப்பை நவீனத் தமிழில் தெளிவாகக் காட்டுகிறது.
