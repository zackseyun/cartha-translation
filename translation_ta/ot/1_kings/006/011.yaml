  text: And the word of Yahweh came to Solomon[a], saying[b],
translation:
  language: ta
  text: 'யாவேயின் வார்த்தை சாலொமோனுக்கு வந்தது:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: வந்தது
  rationale: இங்கு היה என்பதன் தொடர்கதை வடிவம் நிகழ்வின் முன்னேற்றத்தைக் குறிக்கிறது. தமிழில் ‘வார்த்தை ... வந்தது’ என்பதே இயல்பாகவும் மூல மொழியின் சொற்றொடருக்கு நெருக்கமாகவும் உள்ளது.
- source_word: דְּבַר
  choice: வார்த்தை
  rationale: דְּבַר יְהוָה என்ற இறைச்செய்தி சூத்திரத்தில் ‘வார்த்தை’ என்பது மரபானதும் பொருளுக்கு ஏற்றதுமான மொழிபெயர்ப்பு; இது தெய்வீகத் தகவலைக் குறிக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: எபிரெய மூலத்தில் வரும் நான்கெழுத்துத் திருப்பெயரை ஒரு பட்டமாக மாற்றாமல், தமிழில் பரவலாக அறியப்படும் தனிப்பெயர் வடிவில் தருகிறது.
- source_word: אֶל
  choice: -க்கு
  rationale: இறைவார்த்தையைப் பெறுபவரைச் சுட்டும் எபிரெய முன்னிடைச்சொல்லுக்கு இயல்பான தமிழ் வேற்றுமை உருபு.
- source_word: שְׁלֹמֹה
  choice: சாலொமோன்
  rationale: தனிப்பெயர் தமிழில் நிலைபெற்ற வேதாகமப் பெயர் வடிவில் வழங்கப்படுகிறது.
- source_word: לֵאמֹר
  choice: ':'
  rationale: அடுத்த வசனத்தில் தொடங்கும் நேரடி உரையை அறிமுகப்படுத்தும் எபிரெய வினையெச்சத்தின் பணியைத் தமிழில் முக்காற்புள்ளி இயல்பாக நிறைவேற்றுகிறது; ‘சொல்லியதாவது’ என்பதைக் காட்டிலும் நடப்புத் தமிழுக்கு ஏற்றது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: யாவே
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக உள்ளது. அதை ‘கர்த்தர்’ போன்ற பட்டமாக மாற்றாமல் தனிப்பெயராகப் பாதுகாக்கிறது; தமிழில் பரவலாக அறியப்படும் வடிவம் தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; எளிமையான, கண்ணியமான நடையில், அடுத்த வசனத்தின் நேரடி உரையை முக்காற்புள்ளி மூலம் இணைக்கிறது.
