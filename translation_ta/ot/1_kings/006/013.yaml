base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/013.yaml
  text: And I will dwell among the children of Israel[a], and I will not forsake my people Israel.
translation:
  language: ta
  text: நான் இஸ்ரவேல் மக்களிடையே[a] குடியிருப்பேன்; என் மக்களாகிய இஸ்ரவேலைக் கைவிடமாட்டேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லடியாக, ‘இஸ்ரவேலின் பிள்ளைகள்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁכַנְתִּי
  choice: நான் … குடியிருப்பேன்
  rationale: שׁכן என்பது தங்கி வாழ்வதையும் குடியிருப்பதையும் குறிக்கிறது; கடவுள் தம் மக்களிடையே நிலையாக இருப்பார் என்ற உடன்படிக்கைச் சார்ந்த பொருளை ‘குடியிருப்பேன்’ இயல்பாகத் தக்கவைக்கிறது.
- source_word: בְּתוֹךְ
  choice: மக்களிடையே
  rationale: பன்மையான மனிதக் குழுவுடன் வரும் בְּתוֹךְ என்பதற்கு ‘நடுவில்’ என்ற சொல்லடியான பொருளை இயல்பான நவீனத் தமிழில் ‘இடையே’ வெளிப்படுத்துகிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: எபிரெயச் சொற்றொடர் சொல்லடியாக ‘இஸ்ரவேலின் பிள்ளைகள்’ என்று பொருள்படும்; இங்கு முழு உடன்படிக்கைச் சமூகத்தையும் குறிப்பதால் பாலின வேறுபாடின்றி இயல்பாகப் புரியும் ‘இஸ்ரவேல் மக்கள்’ முதன்மை உரையில் பயன்படுத்தப்படுகிறது.
- source_word: וְלֹא אֶעֱזֹב
  choice: கைவிடமாட்டேன்
  rationale: עזב இங்கு வெறுமனே இடத்தைவிட்டு நீங்குவதை அல்ல, உறவு மற்றும் உடன்படிக்கை சார்ந்த முறையில் கைவிடுதல் அல்லது துறத்தலைக் குறிக்கிறது; ‘கைவிடமாட்டேன்’ அந்த வலிமையைத் தெளிவாக வழங்குகிறது.
- source_word: עַמִּי
  choice: என் மக்களாகிய
  rationale: ‘என் மக்கள்’ என்ற உடைமை மற்றும் உடன்படிக்கை உறவைத் தக்கவைத்து, அதைத் தொடர்ந்து வரும் ‘இஸ்ரவேல்’ என்பதுடன் இயல்பான தமிழில் இணைக்கிறது.
- source_word: יִשְׂרָאֵל
  choice: இஸ்ரவேல்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நன்கு அறியப்பட்ட முறையில் பெயர் ஒலிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: ஆலயச் சூழலில் கடவுள் குடியிருப்பதாகக் கூறும் மொழி
  choice: ‘இஸ்ரவேல் மக்களிடையே குடியிருப்பேன்’
  alternative: ‘இஸ்ரவேலரின் நடுவில் வாழ்வேன்’
  rationale: வசனம் ஆலயத்துடன் தொடர்புடைய கடவுளின் பிரசன்னத்தைப் பேசினாலும், அவரை ஆலயத்துக்குள் மட்டும் வரையறுப்பதில்லை; அவர் தம் மக்களிடையே இருப்பதை வலியுறுத்துகிறது. மொழிபெயர்ப்பு இந்த இறையியல் பதற்றத்தை மேலதிக விளக்கமின்றித் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிதில் புரியும், கண்ணியமான நடை. ‘குடியிருப்பேன்’ மற்றும் ‘கைவிடமாட்டேன்’ என்பவை மூலத்தின் உடன்படிக்கைச் சார்ந்த வலிமையைத் தக்கவைக்கின்றன.
