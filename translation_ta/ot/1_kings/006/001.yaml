base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/001.yaml
  text: And it came about in the four hundred eightieth year after the sons of Israel came out from the land of Egypt[a], in the fourth year, in the month of Ziv (that is, the second month), of Solomon’s reign over Israel[c][b], that he built the house for Yahweh.
translation:
  language: ta
  text: இஸ்ரவேலின் மகன்கள் எகிப்து நாட்டிலிருந்து புறப்பட்டதிலிருந்து நானூற்று எண்பதாம் ஆண்டில்[a], சாலொமோன் இஸ்ரவேலின்மேல் ஆட்சி செய்த நான்காம் ஆண்டின் சீவ் மாதத்தில்—அதாவது இரண்டாம் மாதத்தில்[b]—அவர் யாவேக்காக ஆலயத்தைக் கட்டினார்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் நேரடியாக, ‘இஸ்ரவேலின் மகன்கள்’; இது இஸ்ரவேல் மக்களை ஒட்டுமொத்தமாகக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘சீவ்’ என்பது எபிரெய நாட்காட்டியின் இரண்டாம் மாதத்திற்குரிய பழைய பெயர்.
    reason: cultural_note
  - marker: c
    text: எபிரெய மூலத்தில் ‘வீட்டைக் கட்டினார்’ என்று உள்ளது. இங்கு ‘வீடு’ என்பது யாவேக்கான ஆலயத்தைக் குறிக்கிறது. சூழலின்படி, ‘ஆலயத்தைக் கட்டத் தொடங்கினார்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: '[தனி மொழிபெயர்ப்பின்றி காலக் குறிப்பின் இயல்பான தொடக்கத்தில் இணைக்கப்பட்டது]'
  rationale: எபிரெயக் கதைநடைத் தொடர் வடிவத்தைத் தமிழில் ‘அப்போது நிகழ்ந்ததாவது’ என்று கனமாக்காமல், காலக் குறிப்புடன் இயல்பாகத் தொடங்குவது நவீன தமிழுக்கு ஏற்றது.
- source_word: בִּשְׁמוֹנִים שָׁנָה וְאַרְבַּע מֵאוֹת שָׁנָה
  choice: நானூற்று எண்பதாம் ஆண்டில்
  rationale: இது வெறும் 480 ஆண்டுகள் கடந்த காலஅளவைக் காட்டாமல், குறிப்பிட்ட ஆண்டைக் குறிக்கும் எபிரெயத் தொடரைத் துல்லியமாகப் பிரதிபலிக்கிறது.
- source_word: לְצֵאת בְּנֵי יִשְׂרָאֵל מֵאֶרֶץ מִצְרַיִם
  choice: இஸ்ரவேலின் மகன்கள் எகிப்து நாட்டிலிருந்து புறப்பட்ட
  rationale: ‘புறப்பட்ட’ என்பது காலத்தின் தொடக்கப் புள்ளியைக் காட்டும் infinitive construction-ஐ இயல்பாக வெளிப்படுத்துகிறது; ‘இஸ்ரவேலின் மகன்கள்’ என்பது மூலத்தின் குடும்ப/உடன்படிக்கைச் சொல்லாட்சியைப் பாதுகாக்கிறது.
- source_word: בַּשָּׁנָה הָרְבִיעִית ... לִמְלֹךְ שְׁלֹמֹה עַל יִשְׂרָאֵל
  choice: சாலொமோன் இஸ்ரவேலின்மேல் அரசாளத் தொடங்கிய நான்காம் ஆண்டில்
  rationale: அரசாட்சியை அடிப்படையாகக் கொண்ட ஆண்டுக் கணக்கைத் தெளிவான நவீன தமிழில் தருகிறது.
- source_word: בְּחֹדֶשׁ זִו הוּא הַחֹדֶשׁ הַשֵּׁנִי
  choice: சீவ் மாதத்தில்—அதாவது இரண்டாம் மாதத்தில்
  rationale: வரலாற்றுச் சிறப்புப்பெயரையும் மூலத்திலுள்ள விளக்கத்தையும் இரண்டையும் பாதுகாக்கிறது.
- source_word: וַיִּבֶן
  choice: கட்டினார்
  rationale: எபிரெய வினை நேரடியாக ‘கட்டினார்’ என்று கூறுகிறது. சூழலில் பணியின் தொடக்கம் குறிக்கப்பட்டாலும், ‘கட்டத் தொடங்கினார்’ என்பதை முதன்மை உரையில் சேர்க்காமல் அடிக்குறிப்பில் தெரிவிப்பது மூலத்திற்கு நெருக்கமானது.
- source_word: הַבַּיִת
  choice: ஆலயம்
  rationale: சொற்பொருள் ‘வீடு’ என்றாலும், இங்கு யாவேக்கான வழிபாட்டுக் கட்டிடமே தெளிவான குறிப்பு; தமிழில் ‘ஆலயம்’ இயல்பாகவும் மரியாதையாகவும் உள்ளது. மூலச் சொல்லாட்சி அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: לַיהוָה
  choice: யாவேக்காக
  rationale: தெய்வீகப் பெயரான יהוה-ஐ பட்டப்பெயராக மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்த்து, ל முன்னொட்டின் பயன்/நோக்குப் பொருளை ‘-க்காக’ எனக் காட்டுகிறது.
