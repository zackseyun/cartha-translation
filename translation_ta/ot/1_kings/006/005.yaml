  text: He built against the wall of the house a structure all around[a], against the walls of the house all around, around both the nave and the inner sanctuary[c][b]; and he made side rooms all around.
translation:
  language: ta
  text: அவன் ஆலயத்தின் சுவரை ஒட்டி, ஆலயத்தின் சுவர்களைச் சுற்றிலும்—பிரதான மண்டபத்தையும்[b] உட்புறத் திருத்தலத்தையும்[c] சுற்றி—ஒரு கட்டமைப்பைக் கட்டினான்[a]. அவன் சுற்றிலும் பக்க அறைகளை அமைத்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அரிதான எபிரெயச் சொல்லான יצוע என்பதற்கு, “சுற்றிலும் இணைக்கப்பட்ட துணைக் கட்டிடம்” என்றும் மொழிபெயர்க்கலாம்; இது ஆலயச் சுவர்களைச் சுற்றிக் கட்டப்பட்ட அமைப்பைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயச் சொல்லான הֵיכָל, உட்புறத் திருத்தலத்திலிருந்து வேறுபட்ட ஆலயத்தின் பிரதான மண்டபத்தைக் குறிக்கிறது.
    reason: cultural_note
  - marker: c
    text: “உட்புறத் திருத்தலம்” என்பதற்கு, “மகா பரிசுத்த இடம்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: அவன் கட்டினான்
  rationale: எபிரெய வழக்குத் தொடர்கதை வினையை நவீன தமிழில் இயல்பான இறந்தகால வினையாகத் தருகிறது.
- source_word: עַל קִיר הַבַּיִת
  choice: ஆலயத்தின் சுவரை ஒட்டி
  rationale: இங்கு עַל என்பது சுவரின் மேல் என்பதைக் காட்டிலும், சுவரை அடுத்தோ அதனுடன் இணைந்தோ கட்டப்பட்டதைக் குறிக்கிறது; הַבַּיִת சூழலில் ஆலயத்தைக் குறிக்கிறது.
- source_word: יצוע
  choice: ஒரு கட்டமைப்பு
  rationale: அரிதான இச்சொல்லின் துல்லியமான கட்டட வடிவம் உறுதியற்றது. ஆலயத்தைச் சுற்றிய இணைப்புக் கட்டுமானம் என்ற பொதுவான பொருளை, அறைகள் என்று முன்கூட்டியே தீர்மானிக்காமல் வழங்குகிறது.
- source_word: סָבִיב
  choice: சுற்றிலும் / சுற்றி
  rationale: சுற்றியமைந்த கட்டுமானத்தை வலியுறுத்தும் மூலத்தின் மீளுரையை இயன்றவரை இயல்பான தமிழில் காக்கிறது.
- source_word: אֶת קִירוֹת הַבַּיִת
  choice: ஆலயத்தின் சுவர்களை
  rationale: மூலத்திலுள்ள பன்மையான ‘சுவர்கள்’ என்பதைத் தெளிவாகக் காக்கிறது.
- source_word: לַהֵיכָל
  choice: பிரதான மண்டபம்
  rationale: உட்புறத் திருத்தலத்திலிருந்து வேறுபட்ட ஆலயத்தின் முதன்மை மண்டபத்தை, பொதுவாசகர்களுக்குப் புரியும் கட்டடச் சொல்லால் குறிக்கிறது.
- source_word: וְלַדְּבִיר
  choice: உட்புறத் திருத்தலம்
  rationale: ஆலயத்தின் அகத்திலுள்ள புனித அறையைக் குறிக்கிறது; பின்னாளைய குறிப்பிட்ட வழிபாட்டுச் சொல்லை தேவையின்றி திணிக்கவில்லை.
- source_word: וַיַּעַשׂ צְלָעוֹת
  choice: அவன் பக்க அறைகளை அமைத்தான்
  rationale: צְלָעוֹת என்பதன் அடிப்படைப் பொருள் ‘பக்கங்கள்/விலா எலும்புகள்’ ஆக இருக்கலாம்; ஆனால் இக்கட்டடச் சூழலில் ஆலயத்தை ஒட்டிய பக்க அறைகளைக் குறிக்கிறது.
