translation_notes:
  register: நவீன பொதுத் தமிழில், மரியாதையும் கட்டடவியல் தெளிவும் கொண்ட நடை பயன்படுத்தப்பட்டது. ‘ஆலய வீடு’ போன்ற சொற்சொற் மொழிபெயர்ப்பைத் தவிர்த்து, சூழலுக்கேற்ற ‘ஆலயம்’ பயன்படுத்தப்பட்டது. அரிதான יצוע என்பதன் உறுதியற்ற தன்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டது; הֵיכָל மற்றும் דְּבִיר ஆகிய இரு பகுதிகளின் வேறுபாடும் தெளிவாக வைக்கப்பட்டது.
