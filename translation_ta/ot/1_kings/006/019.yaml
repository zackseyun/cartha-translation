  source_fidelity: மூல எபிரெயத்தின் வாக்கிய அமைப்பும் பொருளும் நன்றாகப் பாதுகாக்கப்பட்டுள்ளன. דְבִיר என்பதற்கான ‘உட்புறத் திருத்தலம்’ தேர்வு, ஆலயத்தின் உள்ளார்ந்த அறையைக் குறிக்கும் சூழல்பொருளைத் துல்லியமாகத் தருகிறது. בְּתוֹךְ הַבַּיִת מִפְּנִימָה என்பதன் உள்ளேயும் உள்புறமாயும் உள்ள இடக்குறிப்பும், הֵכִין மற்றும் நோக்கவினை לְתִתֵּן שָׁם ஆகியவையும் சரியாக வெளிப்படுத்தப்பட்டுள்ளன.
