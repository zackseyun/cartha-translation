  text: וּ/דְבִ֧יר בְּ/תוֹךְ הַ/בַּ֛יִת מִ/פְּנִ֖ימָה הֵכִ֑ין לְ/תִתֵּ֣ן שָׁ֔ם אֶת אֲר֖וֹן בְּרִ֥ית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/019.yaml
  text: And he prepared the inner sanctuary within the house[a], to place there the ark of the covenant of Yahweh.
translation:
  language: ta
  text: ஆலயக் கட்டடத்தின் உள்ளே இருந்த உட்புறத் திருத்தலத்தை[a], யாவேயின் உடன்படிக்கைப் பெட்டியை அங்கே வைப்பதற்காக அவன் ஆயத்தப்படுத்தினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் தெபீர்; மரபாக இது ‘திருவாக்கிடம்’ என மொழிபெயர்க்கப்பட்டுள்ளது. இங்கே ஆலயத்தின் மிக உள்ளார்ந்த அறையை, அதாவது உட்புறத் திருத்தலத்தை, குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: דְבִיר
  choice: உட்புறத் திருத்தலம்
  rationale: ஆலயத்தின் மிக உள்ளார்ந்த அறையை இச்சொல் குறிக்கிறது. மரபுவழி நேரடிப் பெயர்ப்பு தெளிவற்றதாக இருப்பதால், அதன் இடத்தையும் புனிதச் செயல்பாட்டையும் இயல்பான நவீனத் தமிழில் தெரிவிக்கும் வகையில் இச்சொற்றொடர் தேர்ந்தெடுக்கப்பட்டது.
- source_word: בְּתוֹךְ הַבַּיִת מִפְּנִימָה
  choice: ஆலயக் கட்டடத்தின் உள்ளே இருந்த உட்புற
  rationale: בַּיִת என்பதன் அடிப்படைப் பொருள் ‘வீடு/கட்டடம்’; இச்சூழலில் அது ஆலயத்தைக் குறிக்கிறது. מִפְּנִימָה வலியுறுத்தும் உள்நோக்கிய இருப்பிடத்தையும் தமிழில் வெளிப்படுத்த ‘உள்ளே இருந்த உட்புற’ என அமைக்கப்பட்டது.
- source_word: הֵכִין
  choice: ஆயத்தப்படுத்தினான்
  rationale: ஒரு குறிப்பிட்ட நோக்கத்திற்காகத் தயாராக்குதல் அல்லது ஏற்பாடு செய்தல் என்னும் வினையின் பொருளை இது இயல்பாகத் தருகிறது; கட்டுமான விவரங்களைத் தேவையின்றி சேர்ப்பதில்லை.
- source_word: לְתִתֵּן שָׁם
  choice: அங்கே வைப்பதற்காக
  rationale: எபிரெய நோக்கவினையெச்சத்தையும் ‘அங்கே’ என்ற இடக்குறிப்பையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: யாவேயின் உடன்படிக்கைப் பெட்டி
  rationale: எபிரெய இணைப்புத் தொடரை இயல்பான தமிழில் மாற்றி, பெட்டி யாவேயின் உடன்படிக்கையுடன் தொடர்புடையது என்பதைத் தெளிவாகக் காட்டுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், எபிரெய நான்கெழுத்துப் பெயரின் பரவலாக ஏற்றுக்கொள்ளப்பட்ட தமிழ்ப் பெயரெழுத்தாக்கமாக வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக வருவதால், அதை ஒரு பட்டமாக மாற்றாமல் பெயரெழுத்தாக்கமாகத் தக்கவைக்கப்பட்டது.
- issue: דְבִיר குறிக்கும் ஆலயப் பகுதி
  choice: உட்புறத் திருத்தலம்
  alternative: திருவாக்கிடம்; மகா பரிசுத்த இடம்; உள் அறை
  rationale: இச்சூழலில் அது ஆலயத்தின் மிக உள்ளார்ந்த அறையைக் குறிக்கிறது. பிற்கால சமயவழக்குச் சொல்லை மூலத்தில் திணிக்காமலும், ‘திருவாக்கிடம்’ என்ற தெளிவற்ற மரபுப் பெயர்ப்பைத் தவிர்த்தும் அதன் இடம் மற்றும் புனிதப் பணி வெளிப்படுத்தப்பட்டன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘ஆலயக் கட்டடம்’ என்பது בַּיִת என்ற சொல்லின் கட்டடப் பொருளையும் ஆலயச் சூழலையும் இணைக்கிறது; ‘ஆயத்தப்படுத்தினான்’ நோக்கத்திற்காகத் தயாராக்குதல் என்ற வினைப் பொருளைப் பாதுகாக்கிறது.
