revisions:
- from: வீடு முழுவதையும், வீடு முழுமையாக முடிக்கப்படும்வரை, தங்கத்தால் அவன் மூடினான்; உட்பரிசுத்த இடத்துக்குரிய[a] பலிபீடம் முழுவதையும் தங்கத்தால் மூடினான்.
  to: முழு வீட்டையும், வீடு முழுவதும் முடிக்கப்படும் வரை, அவன் தங்கத்தால் போர்த்தினான்; உட்பரிசுத்த இடத்துக்குரிய[a] முழுப் பலிபீடத்தையும் தங்கத்தால் போர்த்தினான்.
  rationale: The revision replaces the general verb “மூடினான்” with “தங்கத்தால் போர்த்தினான்” to represent gold overlaying more faithfully, and it lightly recasts the first clause for idiomatic modern Tamil. The altar’s relationship to the inner sanctuary remains intentionally ambiguous, with the footnote correctly anchored to that phrase.
