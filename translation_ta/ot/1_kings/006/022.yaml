base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/022.yaml
  text: He overlaid the whole house with gold[a], until the whole house was finished[b]; and he overlaid with gold the whole altar that belonged to the inner sanctuary.
translation:
  language: ta
  text: முழு வீட்டையும், வீடு முழுவதும் முடிக்கப்படும் வரை, அவன் தங்கத்தால் போர்த்தினான்; உட்பரிசுத்த இடத்துக்குரிய[a] முழுப் பலிபீடத்தையும் தங்கத்தால் போர்த்தினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உட்பரிசுத்த இடத்தோடு தொடர்புடைய’; எபிரெயத் தொடர் பலிபீடம் அந்த இடத்துக்குரியது என்பதையோ, அதனோடு கொண்டிருந்த இடவியல் தொடர்பையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבַּיִת
  choice: வீடு
  rationale: இச்சூழலில் இது ஆலயக் கட்டிடத்தைக் குறித்தாலும், ‘வீடு’ என்பது எபிரெயச் சொல்லின் நேரடிப் பொருளையும் அரசர்கள் நூலில் வரும் ‘கர்த்தருடைய வீடு’ என்ற சொல்லாட்சியின் எதிரொலியையும் காக்கிறது.
- source_word: צִפָּה
  choice: மூடினான்
  rationale: ஒரு மேற்பரப்பைத் தங்கத்தால் முழுமையாகப் போர்த்துவதைக் குறிக்கும் கட்டுமானச் சூழலுக்கு இயல்பான நவீனத் தமிழ்ச் சொல்.
- source_word: זָהָב
  choice: தங்கம்
  rationale: மூலத்தின் பொருட்பெயரை நேரடியாகவும் தெளிவாகவும் தருகிறது.
- source_word: עַד תֹּם כָּל הַבָּיִת
  choice: வீடு முழுமையாக முடிக்கப்படும்வரை
  rationale: עַד תֹּם என்ற நிறைவு குறிக்கும் தொடரையும், כָּל என்பதன் முழுமை வலியுறுத்தலையும் இயல்பான தமிழில் காக்கிறது.
- source_word: הַמִּזְבֵּחַ
  choice: பலிபீடம்
  rationale: מִזְבֵּחַ என்பதற்கான நிலையான, பொதுவாகப் புரிந்துகொள்ளப்படும் தமிழாக்கம்.
- source_word: אֲשֶׁר לַדְּבִיר
  choice: உட்பரிசுத்த இடத்துக்குரிய
  rationale: லாமேத் முன்னிடைச்சொல் இடம், தொடர்பு அல்லது உரிமை சார்ந்த உறவைச் சுட்டலாம்; ‘க்குரிய’ என்பது துல்லியமான இடநிலையைத் தேவையின்றி நிர்ணயிக்காமல் அந்த உறவைப் பாதுகாக்கிறது.
- source_word: דְּבִיר
  choice: உட்பரிசுத்த இடம்
  rationale: ஆலயத்தின் உள் பரிசுத்த அறையை நவீன வாசகருக்குத் தெளிவாகக் குறிக்கிறது; ‘மகா பரிசுத்த ஸ்தலம்’ போன்ற மரபுசார் சொல்லாட்சியை மூலத்தில் இருப்பதைவிடக் குறிப்பாக்குவதைத் தவிர்க்கிறது.
theological_decisions:
- issue: பலிபீடத்துக்கும் உட்பரிசுத்த இடத்துக்கும் இடையிலான உறவு
  choice: ‘உட்பரிசுத்த இடத்துக்குரிய’ என்று தொடர்பை மட்டும் குறிப்பிட்டல்
  alternative: ‘உட்பரிசுத்த இடத்தில் இருந்த’ அல்லது ‘உட்பரிசுத்த இடத்துக்கு முன்பாக இருந்த’
  rationale: אֲשֶׁר לַדְּבִיר என்ற எபிரெயத் தொடர் பலிபீடத்தின் தொடர்பையோ இருப்பிட உறவையோ குறிக்கலாம்; மொழிபெயர்ப்பு அந்தத் தெளிவின்மையைத் தீர்மானமாக மாற்றவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், ஆலயக் கட்டுமானச் சூழலுக்கு ஏற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘வீடு’ மூலம் எபிரெய மூலத்தின் உருவகம் காக்கப்படுகிறது; தெளிவில்லாத இடவியல் உறவு அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
