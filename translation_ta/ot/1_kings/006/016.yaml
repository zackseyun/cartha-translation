  text: וַ/יִּבֶן֩ אֶת עֶשְׂרִ֨ים אַמָּ֜ה מ/ירכותי הַ/בַּ֨יִת֙ בְּ/צַלְע֣וֹת אֲרָזִ֔ים מִן הַ/קַּרְקַ֖ע עַד הַ/קִּיר֑וֹת וַ/יִּ֤בֶן ל/וֹ֙ מִ/בַּ֣יִת לִ/דְבִ֔יר לְ/קֹ֖דֶשׁ הַ/קֳּדָשִֽׁים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/016.yaml
  text: He built twenty cubits at the rear of the house with cedar boards[a], from the floor to the walls, and he built it within as an inner sanctuary[c][b], as the Most Holy Place.
translation:
  language: ta
  text: அவர் ஆலயத்தின் பின்புறத்தில் இருபது முழம் அளவுள்ள பகுதியைத் தேவதாருப் பலகைகளைக் கொண்டு, தரையிலிருந்து சுவர்கள் வரை[a] அமைத்தார். அதை ஆலயத்தின் உட்புறத்தில் திருவறையாக[b], அதாவது மகா பரிசுத்த இடமாக[c], அமைத்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தரையிலிருந்து விட்டங்கள் அல்லது உத்திரங்கள் வரை.” எபிரெய உரையில் “சுவர்கள் வரை” என்பதே உள்ளது; அதுவே இங்கு தக்கவைக்கப்பட்டுள்ளது.
    reason: alternative_reading
  - marker: b
    text: எபிரெயத்தில் தேபீர்; இது ஆலயத்தின் மிக உள்ளார்ந்த திருவறையைக் குறிக்கிறது.
    reason: cultural_note
  - marker: c
    text: 'மரபுவழி மொழிபெயர்ப்பு: “பரிசுத்தத்திலும் பரிசுத்தமான இடம்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִירְכְּתֵי הַבַּיִת
  choice: ஆலயத்தின் பின்புறத்தில்
  rationale: இந்த எபிரெயச் சொற்றொடர் ஒரு கட்டடத்தின் தொலைவான அல்லது பின்புறப் பகுதியைக் குறிக்கிறது. இங்கு ‘வீடு’ என்பது ஆலயத்தைச் சுட்டுவதால், தமிழில் இயல்பாக ‘ஆலயத்தின் பின்புறத்தில்’ என வழங்கப்பட்டது.
- source_word: אֶת עֶשְׂרִים אַמָּה
  choice: இருபது முழம் நீளமுள்ள பகுதியை
  rationale: எபிரெயத்தில் அளவு சுருக்கமாகக் கூறப்பட்டுள்ளது. தமிழில் வாக்கிய உறவைத் தெளிவாக்க ‘நீளமுள்ள பகுதி’ சேர்க்கப்பட்டது; ‘முழம்’ என்ற பழங்கால அளவு மாற்றமின்றித் தக்கவைக்கப்பட்டது.
- source_word: בְּצַלְעוֹת אֲרָזִים
  choice: தேவதாருப் பலகைகளால்
  rationale: צלעות என்பது சூழலுக்கு ஏற்ப பக்க அமைப்புகள், விலா வடிவத் துண்டுகள் அல்லது பலகைகள் எனப் பொருள்படலாம். இங்கு உட்புற அறையை அமைக்கும் கட்டுமானப் பொருள் என்பதால் ‘பலகைகள்’ இயல்பும் தெளிவும் உடையது.
- source_word: מִן הַקַּרְקַע עַד הַקִּירוֹת
  choice: தரையிலிருந்து சுவர்கள்வரை
  rationale: மசோரெட்டிக் உரை சொற்பட ‘தரையிலிருந்து சுவர்கள்வரை’ என வாசிக்கிறது. கட்டடவியல் நோக்கில் கடினமாக இருந்தாலும் உரையைத் திருத்தாமல் முதன்மை மொழிபெயர்ப்பில் தக்கவைத்து, மாற்று புரிதல் அடிக்குறிப்பில் தரப்பட்டது.
- source_word: וַיִּבֶן לוֹ מִבַּיִת
  choice: அதை ஆலயத்தின் உட்புறத்தில் ... அமைத்தார்
  rationale: மூலத்தின் சுருக்கமான தொடரமைப்பு ஆலயத்துக்குள் ஓர் அக அறை உருவாக்கப்பட்டதை உணர்த்துகிறது. தமிழில் குறிப்பிடுபொருளைத் தெளிவாக்க ‘அதை’ மற்றும் ‘ஆலயத்தின்’ சேர்க்கப்பட்டன.
- source_word: לִדְבִיר
  choice: திருவறையாக
  rationale: דביר என்பது ஆலயத்தின் மிக உள்ளார்ந்த திருப்பகுதியைக் குறிக்கும் தொழில்நுட்பச் சொல். ‘திருவறை’ அதன் இடவியல் மற்றும் புனிதப் பண்புகளைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: לְקֹדֶשׁ הַקֳּדָשִׁים
  choice: மகா பரிசுத்த இடமாக
  rationale: இந்த எபிரெயக் கட்டமைப்பு மிக உயர்ந்த பரிசுத்தத் தன்மையைக் காட்டும் உயர்நிலைச் சொற்றொடர். ‘மகா பரிசுத்த இடம்’ நவீன தமிழில் தெளிவாகவும் மரியாதைமிக்கதாகவும் உள்ளது.
theological_decisions:
- issue: דביר மற்றும் קֹדֶשׁ הַקֳּדָשִׁים ஆகியவற்றின் உறவு
  choice: ‘திருவறையாக, அதாவது மகா பரிசுத்த இடமாக’ என்று விளக்க உறவாக மொழிபெயர்த்தல்
  alternative: ‘திருவறைக்காகவும் மகா பரிசுத்த இடத்திற்காகவும்’ என்று இரண்டு தனித்த நோக்கங்களாக வழங்குதல்
  rationale: இரண்டாவது சொற்றொடர் முதலாவது அறையின் அடையாளத்தையும் புனிதச் செயல்பாட்டையும் விளக்குவதாகச் சூழல் காட்டுகிறது. ஆயினும் எந்தச் சமயப்பிரிவுக்குரிய தனிப்பட்ட விளக்கமும் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன செந்தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதைமிக்க நடையில் மொழிபெயர்க்கப்பட்டது. ‘ஆலயம்’, ‘திருவறை’, ‘மகா பரிசுத்த இடம்’ ஆகிய சொற்கள் கட்டடவியல் மற்றும் வழிபாட்டு சூழலைத் தெளிவாக்குகின்றன. மூல உரையின் கட்டடவியல் சிரமம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
