base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/029.yaml
  text: He carved all the walls of the house all around with engraved figures of cherubim[a], palm trees, and open flowers[c][b], on the inner and outer walls.
translation:
  language: ta
  text: அவன் ஆலயத்தின்[b] எல்லாச் சுவர்களிலும் சுற்றிலும், உட்புறத்திலும் வெளிப்புறத்திலும்[d], கேருபீன்கள்[a], பேரீச்சமர வடிவங்கள், விரிந்த மலர்கள்[c] ஆகியவற்றின் செதுக்கப்பட்ட உருவங்களைச் செதுக்கினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கேருபீன்கள்” என்பது தேவனுடைய சிங்காசனத்துடனும் பரிசுத்த இடத்துடனும் தொடர்புபடுத்தப்படும் விண்ணுலக உயிரினங்களைக் குறிக்கிறது.
    reason: cultural_note
  - marker: b
    text: எபிரெயத்தில் “வீடு”; இச்சூழலில் அது ஆலயக் கட்டிடத்தைக் குறிக்கிறது.
    reason: cultural_note
  - marker: c
    text: “மலர்ந்த பூக்கள்” அல்லது “விரியும் மலர்கள்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொற்றொடர் மலர் அலங்கார வடிவங்களைக் குறிக்கிறது; அதன் துல்லியமான கலைவடிவம் உறுதியில்லை.
    reason: lexical_alternative
  - marker: d
    text: “உள்ளேயும் வெளியேயும்” என்றும் பொதுவாகப் புரிந்துகொள்ளலாம்; இச்சூழலில் இது பரிசுத்த இடத்தின் உட்புற மற்றும் வெளிப்புறப் பகுதிகளைக் குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: קִירוֹת הַבַּיִת
  choice: ஆலயத்தின் சுவர்கள்
  rationale: בַּיִת என்பதன் நேர்ப்பொருள் ‘வீடு’; இங்கு சாலொமோன் கட்டிய ஆலயத்தைக் குறிப்பதால், நவீனத் தமிழில் இயல்பாகவும் சூழலுக்குத் தெளிவாகவும் ‘ஆலயம்’ என மொழிபெயர்க்கப்பட்டது. நேர்ப்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: מֵסַב
  choice: சுற்றிலும்
  rationale: சுவர்களை எல்லாப் பக்கங்களிலும் அலங்கரித்த பரப்பளவை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: קָלַע / פִּתּוּחֵי מִקְלְעוֹת
  choice: செதுக்குருவங்களை அவன் செதுக்கினான்
  rationale: வினைச்சொல்லும் அதனோடு தொடர்புடைய பெயர்ச்சொற்களும் அலங்காரச் செதுக்குவேலையை வலியுறுத்துகின்றன. உருவங்களைக் கொண்ட செதுக்கல்களைத் தெளிவாகக் காட்ட இச்சொற்றொடர் தேர்ந்தெடுக்கப்பட்டது.
- source_word: כְּרוּבִים
  choice: கேருபீன்கள்
  rationale: ஆலயத்துடன் தொடர்புடைய விண்ணுலக உயிரினங்களுக்கான எபிரெயப் பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு; குழந்தைத் தேவதைகள் என்ற தவறான எண்ணத்தைத் தவிர்க்கிறது.
- source_word: תִמֹרֹת
  choice: பேரீச்சமர வடிவங்கள்
  rationale: இங்கு உண்மையான மரங்கள் அல்ல, அலங்காரக் கலைப்பாங்கில் அமைந்த பனைவகை மர உருவங்கள் குறிக்கப்படுகின்றன. அந்தக் கலைச்சூழலை ‘வடிவங்கள்’ தெளிவாக்குகிறது.
- source_word: פְטוּרֵי צִצִּים
  choice: விரிந்த மலர்கள்
  rationale: மலர் அலங்கார வடிவங்களைக் குறிக்கும் இச்சொற்றொடரில் மலர்கள் திறந்தோ விரிந்தோ காணப்படுவது போன்ற பொருள் உள்ளது; துல்லியமான கலைவடிவம் உறுதியில்லை என்பதால் மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: מִלִּפְנִים וְלַחִיצוֹן
  choice: உட்புறத்திலும் வெளிப்புறத்திலும்
  rationale: எபிரெயச் சொற்றொடரின் இடவியல் எதிர்மறையை அறைகள் அல்லது சுவர்கள் என்று தேவையின்றி மிகத் துல்லியப்படுத்தாமல் பாதுகாக்கிறது; ஆலயத்தின் உள் மற்றும் வெளிப் பகுதிகள் என்ற சூழல்சார் புரிதல் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
