  text: And he built the inner court with three rows of cut stone and a row of cedar beams[a].
translation:
  language: ta
  text: அவர் உள் முற்றத்தை வெட்டியெடுக்கப்பட்ட கற்களின் மூன்று வரிசைகளாலும் கேதுரு மர உத்தரங்களின் ஒரு வரிசையாலும் கட்டினார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவர் உள் முற்றத்தை வெட்டியெடுக்கப்பட்ட கற்களின் மூன்று அடுக்குகளாலும் கேதுரு மர உத்தரங்களின் ஓர் அடுக்காலும் கட்டினார்.’
    reason: טוּר என்பது கட்டுமானச் சூழலில் ‘வரிசை’ என்றும் ‘அடுக்கு’ என்றும் பொருள்படக்கூடியதால் இந்தச் சொல்லியல் மாற்று தரப்படுகிறது.
lexical_decisions:
- source_word: וַיִּבֶן
  choice: அவர் கட்டினார்
  rationale: בנה என்பதன் தொடர்கதை வடிவம் அடுத்த கட்டுமானச் செயலைக் குறிக்கிறது. தமிழில் இயல்பான வாக்கிய ஓட்டத்திற்காக வினைமுற்று இறுதியில் வைக்கப்பட்டுள்ளது.
- source_word: הֶחָצֵר הַפְּנִימִית
  choice: உள் முற்றம்
  rationale: חָצֵר என்பது முற்றம் அல்லது சுற்றுச்சுவரால் வரையறுக்கப்பட்ட திறந்த வெளியைக் குறிக்கிறது; פְּנִימִית அதன் உள்புற இருப்பிடத்தைக் குறிப்பிடுகிறது. ‘உள் முற்றம்’ நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: שְׁלֹשָׁה טוּרֵי
  choice: மூன்று வரிசைகள்
  rationale: טוּר கட்டுமானத்தில் வரிசை அல்லது அடுக்கு என்ற இரு நெருங்கிய பொருள்களைக் கொள்ளலாம். பொதுவாசகருக்கு எளிதான ‘வரிசைகள்’ முதன்மை உரையில் பயன்படுத்தப்பட்டு, ‘அடுக்குகள்’ அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: גָזִית
  choice: செதுக்கப்பட்ட கற்கள்
  rationale: גָזִית கட்டுமானத்திற்காக வெட்டிச் செதுக்கப்பட்ட கல்லைக் குறிக்கிறது. இந்தத் தமிழாக்கம் கல் இயற்கை நிலையில் அல்லாமல் வேலை செய்யப்பட்டதைக் தெளிவாக்குகிறது.
- source_word: וְטוּר
  choice: ஒரு வரிசை
  rationale: எபிரெயத்தில் எண் ‘ஒன்று’ வெளிப்படையாக இல்லாவிட்டாலும், ஒருமை வடிவிலுள்ள טוּר மூன்று வரிசைகளுக்கு அடுத்த தனி வரிசையைக் குறிக்கிறது. தமிழில் ‘ஒரு வரிசை’ இயல்பானதும் தேவையானதும் ஆகும்.
- source_word: כְּרֻתֹת אֲרָזִים
  choice: கேதுரு மர உத்தரங்கள்
  rationale: இந்தச் சொற்றொடர் வெட்டித் தயாரிக்கப்பட்ட கேதுரு மரக்கட்டைகளைக் குறிக்கிறது. கட்டுமானச் சூழலில் அவற்றின் பயன்பாட்டை ‘உத்தரங்கள்’ தெளிவாகக் காட்டுகிறது; மரம் வெட்டித் தயாரிக்கப்பட்டது என்பதும் ‘உத்தரம்’ என்ற சொல்லில் இயல்பாக உட்பொருளாகிறது.
