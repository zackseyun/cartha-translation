translation_notes:
  register: நவீன நிலையான தமிழில், கட்டுமான விவரத்திற்கேற்ற கண்ணியமான மற்றும் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டது. ‘முழம்’ மற்றும் ‘கேருபு’ ஆகிய மரபான வேதாகமச் சொற்கள் தக்கவைக்கப்பட்டன.
