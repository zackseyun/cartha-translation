  text: וְ/חָמֵ֣שׁ אַמּ֗וֹת כְּנַ֤ף הַ/כְּרוּב֙ הָֽ/אֶחָ֔ת וְ/חָמֵ֣שׁ אַמּ֔וֹת כְּנַ֥ף הַ/כְּר֖וּב הַ/שֵּׁנִ֑ית עֶ֣שֶׂר אַמּ֔וֹת מִ/קְצ֥וֹת כְּנָפָ֖י/ו וְ/עַד קְצ֥וֹת כְּנָפָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/024.yaml
  text: And five cubits was the one wing of the cherub[a], and five cubits the second wing of the cherub; ten cubits from the end of its wings to the end of its wings.
translation:
  language: ta
  text: கேருபின் ஒரு சிறகு ஐந்து முழமும், அதன் இரண்டாவது சிறகு ஐந்து முழமும் இருந்தது. அதன் சிறகுகளின் ஒரு முனையிலிருந்து மறு முனைவரை பத்து முழம் இருந்தது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்படியாக, “அதன் சிறகுகளின் முனைகளிலிருந்து அதன் சிறகுகளின் முனைகள்வரை”; அதாவது, ஒரு சிறகின் வெளிப்புற முனையிலிருந்து மற்ற சிறகின் வெளிப்புற முனைவரையிலான முழு விரிப்பு.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָמֵשׁ אַמּוֹת
  choice: ஐந்து முழம்
  rationale: கோவில் கட்டுமான அளவுகளைக் குறிக்கும் אַמָּה என்பதற்குத் தமிழில் வழக்கமான வேதாகம அளவுச்சொல் ‘முழம்’; எண்ணுக்குப் பின் இயல்பாக ஒருமை வடிவம் பயன்படுத்தப்பட்டது.
- source_word: כְּנַף
  choice: சிறகு
  rationale: கேருபின் உருவத்தை விவரிக்கும் இச்சூழலில் כָּנָף என்பது சிறகையே தெளிவாகக் குறிக்கிறது.
- source_word: הַכְּרוּב
  choice: கேருபு
  rationale: கோவில் அமைப்பிலுள்ள ஒவ்வொரு வானுலக உயிரின உருவத்தையும் குறிக்கும் ஒருமைச் சொல்லுக்கான மரபான, தெளிவான தமிழ் வடிவம்.
- source_word: הָאֶחָת
  choice: ஒரு
  rationale: எபிரெயச் சொல் நேரடியாக ‘முதலாவது’ என்று அல்லாமல் ‘ஒன்று/ஒரு’ என்று கூறுவதால் அந்த வேறுபாடு காக்கப்பட்டது.
- source_word: הַשֵּׁנִית
  choice: இரண்டாவது
  rationale: ‘சிறகு’ என்பதோடு இயல்பாக இணையும் நேரடி வரிசைச்சொல்.
- source_word: עֶשֶׂר אַמּוֹת
  choice: பத்து முழம்
  rationale: இரு சிறகுகளின் முழு விரிப்புக்கான அளவை நேரடியாகத் தருகிறது.
- source_word: מִקְצוֹת ... וְעַד קְצוֹת
  choice: ஒரு முனையிலிருந்து மறு முனைவரை
  rationale: ஒரு சிறகின் வெளிப்புற முனையிலிருந்து மற்ற சிறகின் வெளிப்புற முனைவரையிலான முழு விரிப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது; எபிரெயத்தின் சொற்படியான அமைப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: כְּנָפָיו
  choice: அதன் சிறகுகள்
  rationale: ஆண்பால் ஒருமை பின்னொட்டு கேருபின் உருவத்தைக் குறிக்கிறது; தமிழில் பாலினத்தைத் தேவையின்றி சுட்டாத ‘அதன்’ பொருத்தமானது.
