base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/008.yaml
  text: The entrance to the middle side chamber was on the right side of the house[a], and by winding stairs they went up to the middle story[b], and from the middle to the third.
translation:
  language: ta
  text: நடுப்பக்க அறையின் நுழைவாயில் ஆலயத்தின் வலப்பக்கத்தில் இருந்தது. சுழல் படிக்கட்டுகள்[a] வழியாக நடுத்தளத்துக்கு ஏறிச் சென்றனர்; நடுத்தளத்திலிருந்து மூன்றாம் தளத்துக்கு ஏறிச் சென்றனர்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வளைந்து செல்லும் படிக்கட்டுகள்.” இதற்கான எபிரெயச் சொல் சுழல் அல்லது வளைந்து மேலே செல்லும் படிக்கட்டுகளைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “நடுவிலிருந்து மூன்றாவதற்கு”; அதாவது, நடுத்தளத்திலிருந்து மூன்றாம் தளத்துக்கு.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּתַח
  choice: நுழைவாயில்
  rationale: இச்சொல் திறப்பு அல்லது உள்ளே செல்லும் வழியைக் குறிக்கிறது; கட்டட அமைப்பைப் பற்றிய இச்சூழலில் ‘நுழைவாயில்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: הַצֵּלָע הַתִּיכֹנָה
  choice: நடுப்பக்க அறை
  rationale: ஆலயக் கட்டடச் சூழலில் צֵלָע என்பது சொல்லுக்குச் சொல் ‘விலா’ என்பதல்ல, பக்க அறை அல்லது பக்கக் கட்டமைப்பைக் குறிக்கிறது. תִּיכֹנָה என்பதன் ‘நடு’ என்ற பொருளும் பாதுகாக்கப்படுகிறது.
- source_word: אֶל כֶּתֶף הַבַּיִת הַיְמָנִית
  choice: ஆலயத்தின் வலப்பக்கத்தில்
  rationale: כֶּתֶף என்பதன் அடிப்படைப் பொருள் ‘தோள்’; கட்டடச் சூழலில் அது ‘பக்கம்’ என இயல்பாக மொழிபெயர்க்கப்படுகிறது. יְמָנִית என்பதை ஊகித்து ‘தெற்கு’ என மாற்றாமல் ‘வலப்பக்கம்’ என்றே வழங்குகிறது.
- source_word: וּבְלוּלִּים
  choice: சுழன்று செல்லும் படிக்கட்டுகள்
  rationale: அரிதான இச்சொல் இக்கட்டடச் சூழலில் சுழல் அல்லது வளைந்து செல்லும் படிக்கட்டுகளைக் குறிக்கும் என்று பொதுவாகப் புரிந்துகொள்ளப்படுகிறது; அதன் lexical uncertainty அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: יַעֲלוּ
  choice: மக்கள் ... ஏறிச் சென்றார்கள்
  rationale: எபிரெய வினை மூன்றாம் நபர் பன்மையில் உள்ளது. குறிப்பிட்ட நபர்களைச் சுட்டாமல், கட்டடத்தில் மேலே செல்லும் முறையை விவரிப்பதால் தமிழில் ‘மக்கள்’ என்று பொதுப்படையாகக் கூறுவது இயல்பானது.
- source_word: עַל הַתִּיכֹנָה
  choice: நடுத்தளத்துக்கு
  rationale: அடுத்ததாக மூன்றாம் தளம் குறிப்பிடப்படுவதால், இங்கு ‘நடு’ என்பது கட்டடத்தின் நடுத்தளத்தைச் சுட்டுகிறது. ‘நடுத்தளம்’ தமிழில் கட்டட அமைப்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: וּמִן הַתִּיכֹנָה אֶל הַשְּׁלִשִׁים
  choice: அங்கிருந்து மூன்றாம் தளத்துக்கு
  rationale: எபிரெயத்தில் ‘நடுவிலிருந்து மூன்றாவதற்கு’ என்று சுருக்கமாக உள்ளது. தமிழில் குறிக்கப்படும் தளங்களைத் தெளிவுபடுத்தி, இயல்பான தொடராக வழங்கப்பட்டுள்ளது.
