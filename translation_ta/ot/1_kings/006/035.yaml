translation:
  language: ta
  text: அவன் கேருபீன்களையும் பேரீச்சமரங்களையும் விரிந்த மலர்களையும் செதுக்கி, செதுக்கப்பட்ட வேலைப்பாட்டின்மேல் பொருந்துமாறு தங்கத்தைப் பதித்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְרוּבִים
  choice: கேருபீன்கள்
  rationale: எபிரேய சமயக் கலைச்சொல்லை ஒலிபெயர்த்து, அவற்றின் தனித்துவத்தைப் பாதுகாக்கிறது.
- source_word: תִמֹרוֹת
  choice: பேரீச்சமரங்கள்
  rationale: பேரீச்சை வடிவ அலங்காரங்களைக் குறிக்கும் சொல்லை இயல்பான நவீனத் தமிழில் வழங்குகிறது.
- source_word: פְטֻרֵי צִצִּים
  choice: மலர்ந்த பூக்கள்
  rationale: இதழ்கள் விரிந்து திறந்துள்ள மலர் வடிவங்களைக் குறிக்கும் எபிரேய தொடரின் பொருளைச் சுருக்கமாகத் தருகிறது.
- source_word: וְצִפָּה זָהָב
  choice: தங்கத் தகடு பதித்தான்
  rationale: கட்டிட அலங்காரச் சூழலில் தங்கத்தால் மேல்பூச்சிடுதல் அல்லது மூடுதல் என்பதைக் காட்டும் இயல்பான தமிழ் நடை.
- source_word: מְיֻשָּׁר עַל הַמְחֻקֶּה
  choice: அந்தச் செதுக்குவேலைக்கு ஏற்றவாறு
  rationale: தங்கம் செதுக்கப்பட்ட வடிவங்களோடு பொருந்துமாறு பதிக்கப்பட்டது என்ற அரிய எபிரேய சொற்றொடரின் கருத்தைப் பாதுகாக்கிறது.
