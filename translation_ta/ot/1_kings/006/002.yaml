base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/002.yaml
  text: The house that King Solomon built for Yahweh was sixty cubits long[a], twenty cubits wide[c][b], and thirty cubits high.
translation:
  language: ta
  text: சாலொமோன் அரசன் யாவேக்காகக் கட்டிய இல்லம் அறுபது முழம் நீளமும், இருபது முழம் அகலமும், முப்பது முழம் உயரமும் கொண்டிருந்தது.[a][c][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “மேலும், அந்த இல்லம் …” என்று தொடங்குகிறது. தொடக்க இணைப்புச்சொல்லை “மேலும்” அல்லது “மற்றும்” என வழங்கலாம்; தமிழில் இயல்பாக அதை வெளிப்படுத்தாமலும் விடலாம்.
    reason: lexical_alternative
  - marker: b
    text: 'எபிரெயத்தில் இவ்விடத்தில் “முழம்” என்ற அலகு மீண்டும் இடம்பெறவில்லை; முன் மற்றும் பின் வரும் அளவுகளிலிருந்து அது புரிந்துகொள்ளப்படுகிறது. சொல்லுக்குச் சொல்: “அதன் அகலம் இருபது.”'
    reason: lexical_alternative
  - marker: c
    text: “யாவே” என்பது יהוה (YHWH) என்ற இறைநாமத்தைக் குறிக்கிறது. தமிழ் வேதாகம மொழிபெயர்ப்பு மரபில் இது பெரும்பாலும் “கர்த்தர்” என்றும் வழங்கப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהַבַּיִת
  choice: இல்லத்தின்
  rationale: בַּיִת என்பதன் அடிப்படைப் பொருள் ‘இல்லம்/வீடு.’ இங்கு அது ஆலயத்தைக் குறித்தாலும், ‘இல்லம்’ என்பது எபிரெயச் சொல்லின் உருவக மற்றும் இறையியல் ஒலிவைத் தக்கவைக்கிறது. தொடக்க וְ தமிழில் இயல்பான தொடரோட்டத்திற்காக முதன்மை உரையில் வெளிப்படையாக மொழிபெயர்க்கப்படவில்லை.
- source_word: אֲשֶׁר בָּנָה הַמֶּלֶךְ שְׁלֹמֹה
  choice: சாலொமோன் அரசன் கட்டிய
  rationale: உறவுப்பெயரால் தொடங்கும் எபிரெயத் தொடரை இயல்பான தமிழ் பெயரெச்சத் தொடராக மாற்றுகிறது; בָּנָה நிறைவுற்ற கட்டுமானச் செயலைக் குறிக்கிறது.
- source_word: לַיהוָה
  choice: யாவேக்காக
  rationale: לְ இங்கு அர்ப்பணிப்பு அல்லது நோக்கத்தைக் குறிக்கிறது. יהוה என்ற தனிப்பெயர் ‘யாவே’ என்று ஒலிபெயர்க்கப்படுகிறது.
- source_word: שִׁשִּׁים אַמָּה אָרְכּוֹ
  choice: நீளம் அறுபது முழம்
  rationale: அளவு, அலகு, ‘அதன் நீளம்’ என்ற எபிரெய அமைப்பின் பொருளைத் தெளிவான தமிழ் அளவுக் கூற்றாக வழங்குகிறது. אַמָּה என்பதற்கு வழக்கமான வேதாகமத் தமிழ் அளவுப்பெயரான ‘முழம்’ பயன்படுத்தப்படுகிறது.
- source_word: וְעֶשְׂרִים רָחְבּוֹ
  choice: அதன் அகலம் இருபது முழம்
  rationale: எபிரெயத்தில் ‘முழம்’ இத்தொடரில் மீண்டும் சொல்லப்படவில்லை; முன் மற்றும் பின் அளவுகளிலிருந்து அது இயல்பாகப் புரிகிறது. தமிழில் குழப்பமின்றி வாசிக்க அலகு வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது.
- source_word: וּשְׁלֹשִׁים אַמָּה קוֹמָתוֹ
  choice: அதன் உயரம் முப்பது முழம்
  rationale: קוֹמָה இங்கு கட்டிடத்தின் உயரத்தைக் குறிக்கிறது; எபிரெய அளவை நேரடியாகவும் இயல்பாகவும் வழங்குகிறது.
theological_decisions:
- issue: יהוה என்ற இறைநாமத்தை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரையில் பொதுப்பட்டமல்ல, יהוה என்ற உடன்படிக்கைத் தனிப்பெயரே உள்ளது. ஆகவே அதன் தனிப்பெயர்த் தன்மையைத் தக்கவைக்க ‘யாவே’ பயன்படுத்தப்படுகிறது; தமிழ் மரபில் காணப்படும் ‘கர்த்தர்’ மாற்று வாசிப்பாகக் குறிப்பிடப்படுகிறது.
- issue: בַּיִת என்பதைக் ‘இல்லம்’ அல்லது ‘ஆலயம்’ என்று வழங்குதல்
  choice: இல்லம்
  alternative: ஆலயம்
  rationale: சூழலில் கட்டிடம் ஆலயமே என்றாலும், மூலச்சொல் ‘இல்லம்’ என்பதாகும். இது யாவேக்காகக் கட்டப்பட்ட ‘இல்லம்’ என்ற மூலத்தின் இறையியல் ஒலிவைத் தீர்மானித்து விடாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சுருக்கமான ஆனால் கண்ணியமான கட்டிட அளவீட்டு நடையில் வடிவமைக்கப்பட்டுள்ளது. ‘ஆலயம்’ என்பதற்குப் பதிலாக ‘இல்லம்’ மூலம் மூலச்சொல்லின் உருவகத் தன்மை பாதுகாக்கப்படுகிறது. அளவுகளைத் தெளிவுபடுத்த இணை அமைப்பும் அரைப்புள்ளிகளும் பயன்படுத்தப்பட்டுள்ளன.
