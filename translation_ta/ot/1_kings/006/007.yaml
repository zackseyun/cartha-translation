  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. எபிரெய மொழியின் மீளுரையை இயன்றவரை காத்து, தமிழில் இயல்பான வாக்கிய ஓட்டம் வழங்கப்பட்டுள்ளது. ‘வீடு’ என்பதற்குப் பதிலாகச் சூழல் தெளிவுக்காக ‘ஆலயம்’ பயன்படுத்தப்பட்டுள்ளது; מַסָּע என்பதிலுள்ள உண்மையான சொற்பொருள் நிச்சயமின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
