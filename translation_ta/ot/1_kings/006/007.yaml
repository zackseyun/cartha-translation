  text: The house[a], when it was built, was built of finished stone quarried in advance; and no hammer or axe or any iron tool was heard in the house while it was being built.
translation:
  language: ta
  text: அந்த வீடு கட்டப்பட்டபோது, கல் வெட்டுமிடத்திலேயே முழுமையாகச் செப்பனிடப்பட்ட கற்களால் அது கட்டப்பட்டது.[a] அது கட்டப்பட்டுக்கொண்டிருந்தபோது, சுத்தியலோ, கோடரியோ, எந்த இரும்புக் கருவியோ அந்த வீட்டில் ஒலிக்கவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கல் வெட்டுமிடத்திலிருந்து முன்கூட்டியே தயாராகக் கொண்டுவரப்பட்ட கற்களால்.” מַסָּע என்ற எபிரெயச் சிறப்புச் சொல், கல் வெட்டியெடுப்பதையோ, கற்கள் கல் வெட்டுமிடத்திலேயே தயாரிக்கப்பட்டதையோ, அங்கிருந்து தயாராகக் கொண்டுவரப்பட்டதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבַּיִת
  choice: ஆலயம்
  rationale: எபிரெயச் சொல் பொதுவாக ‘வீடு’ எனப் பொருள்பட்டாலும், இச்சூழலில் அது கர்த்தருக்காகக் கட்டப்படும் ஆலயத்தைக் குறிக்கிறது. நவீனத் தமிழில் ‘ஆலயம்’ உடனடியாகவும் இயல்பாகவும் பொருளைத் தெளிவுபடுத்துகிறது.
- source_word: בְּהִבָּנֹתוֹ
  choice: கட்டப்பட்டபோது / கட்டப்பட்டுக்கொண்டிருந்தபோது
  rationale: ב முன்னொட்டுடன் வரும் வினையெச்சப் பெயர்வடிவம் காலச் சூழலைக் குறிக்கிறது. முதலிடத்தில் சுருக்கமான காலவாக்கியமாகவும், இரண்டாமிடத்தில் கட்டுமானம் நடைபெற்ற காலநீட்சியை உணர்த்தும் வடிவமாகவும் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: אֶבֶן שְׁלֵמָה
  choice: செப்பனிடப்பட்ட கற்கள்
  rationale: שְׁלֵמָה என்பதன் அடிப்படை உணர்வு முழுமை அல்லது பூர்த்தி. கட்டுமானச் சூழலில், கட்டிடத்தளத்துக்கு வருவதற்கு முன்பே முழுமையாக வடிவமைத்துத் தயாரிக்கப்பட்ட கற்களைக் குறிக்க ‘செப்பனிடப்பட்ட கற்கள்’ இயல்பான தமிழ்.
- source_word: מַסָּע
  choice: முன்கூட்டியே
  rationale: இச்சிறப்புச் சொல் கற்கள் வெட்டியெடுக்கப்பட்ட இடத்தையோ, அங்கிருந்து ஏற்கெனவே தயாராகக் கொண்டுவரப்பட்ட நிலையையோ சுட்டக்கூடும். கற்கள் கட்டிடத்தளத்திற்கு வருமுன் தயாரிக்கப்பட்டன என்ற நடைமுறைப் பொருளை ‘முன்கூட்டியே’ தெரிவிக்கிறது; சொற்பொருள் நிச்சயமின்மை அடிக்குறிப்பில் காக்கப்பட்டுள்ளது.
- source_word: נִבְנָה
  choice: கட்டப்பட்டது
  rationale: நிஃபால் நிறைவுவினை கட்டுமானம் நிகழ்ந்த விதத்தைச் சொல்கிறது; தமிழில் இயல்பான செயப்பாட்டு வடிவம் ‘கட்டப்பட்டது’.
- source_word: מַקָּבוֹת
  choice: சுத்தியல்
  rationale: வடிவில் பன்மையாக இருந்தாலும், கருவி வகைகளைப் பட்டியலிடும் சூழலில் தமிழில் ஒருமை வகைப்பெயர் இயல்பாக உள்ளது.
- source_word: הַגַּרְזֶן
  choice: கோடரி
  rationale: சொல்லின் வழக்கமான பொருள் ‘கோடரி’. மரவேலைக்கான வேறு வெட்டுக் கருவி என்ற சாத்தியம் இருந்தாலும், ‘கோடரி’ நேரடியான பொதுத் தமிழ் இணை.
- source_word: כָּל כְּלִי בַרְזֶל
  choice: வேறு எந்த இரும்புக் கருவியும்
  rationale: כָּל உடன் வரும் ஒருமை அமைப்பு ஒவ்வொன்றையும் உள்ளடக்கும் பரவலான பொருளைத் தருகிறது. முன் குறிப்பிடப்பட்ட கருவிகளுக்கு அப்பாற்பட்ட அனைத்தையும் ‘வேறு எந்த இரும்புக் கருவியும்’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: לֹא נִשְׁמַע
  choice: ஒலிக்கவில்லை
  rationale: சொல்லுக்கு நேரடியாக ‘கேட்கப்படவில்லை’ என்ற செயப்பாட்டுப் பொருள் உண்டு. கருவிகளின் சத்தத்தைப் பற்றிய தமிழ்ச் சொல்லாக்கத்தில் ‘ஒலிக்கவில்லை’ இயல்பாகவும் அதே விளைவைத் தருவதாகவும் உள்ளது.
