- source_word: היצוע
  choice: பக்க அறைக் கட்டமைப்பு
  rationale: ஆலயத்தைச் சுற்றி அடுக்குகளாக அமைந்திருந்த பக்கக் கட்டமைப்பை இச்சொல் குறிக்கிறது. ‘பக்க அறைக் கட்டமைப்பு’ என்பது அதன் இடத்தையும் கட்டட அமைப்பையும் தெளிவாகக் காட்டுகிறது.
- source_word: הַתַּחְתֹּנָה / הַתִּיכֹנָה / הַשְּׁלִישִׁית
  choice: கீழ் அடுக்கு / நடு அடுக்கு / மூன்றாம் அடுக்கு
  rationale: மூன்று உயர்மட்டங்களின் வரிசையை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; இரண்டாவது பெயர்ச்சொல் எபிரெயத்தில் முன்சொல்லைச் சார்ந்திருந்தாலும் தமிழில் ‘அடுக்கு’ என்பதைத் திரும்பக் கூறுவது தெளிவளிக்கிறது.
