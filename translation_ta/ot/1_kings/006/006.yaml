  rationale: சொற்சொல்லாக ‘வீட்டிற்கு வெளியே சுற்றிலும் கொடுத்தான்’ என்பதன் கட்டடவியல் பொருளை இயல்பான தமிழில் தருகிறது; இச்சூழலில் ‘வீடு’ என்பது ஆலயக் கட்டடம்.
