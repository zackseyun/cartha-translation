  choice: உத்திரங்கள் ஆலயச் சுவர்களில் பதிக்கப்படாதபடி
  rationale: ‘சுவர்களில் பற்றிக்கொள்ளாதபடி’ என்ற சொற்சொல் வாக்கியத்தின் கட்டடவியல் நோக்கத்தைத் தெளிவாக்க ‘உத்திரங்கள்’ சூழலிலிருந்து வெளிப்படுத்தப்பட்டுள்ளது; இதை அடிக்குறிப்பு பதிவு செய்கிறது.
