  yaml_path: translation/ot/1_kings/006/006.yaml
  text: The lowest story was five cubits wide[a], the middle one six cubits wide, and the third seven cubits wide; for he made offsets around the outside of the temple[b], so that the beams would not be inserted into the walls of the temple.
translation:
  language: ta
  text: பக்க அறைக் கட்டமைப்பின் கீழடுக்கு ஐந்து முழம் அகலமாகவும், நடு அடுக்கு ஆறு முழம் அகலமாகவும், மூன்றாம் அடுக்கு ஏழு முழம் அகலமாகவும் இருந்தது. ஏனெனில், பக்க அறைக் கட்டமைப்பின் உத்திரங்கள் ஆலயச் சுவர்களில் பதிக்கப்படாதபடி, அவன் ஆலயத்தின் வெளிப்புறத்தைச் சுற்றிலும் சுவர் ஒதுக்கங்களை[b] அமைத்தான்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: அதாவது, சுவரில் அமைக்கப்பட்ட பின்னடைவுகள், ஒதுக்கங்கள் அல்லது தாங்கும் ஓரங்கள்.
    reason: lexical_alternative
  - marker: c
    text: சொற்சொல்லாக, “ஆலயத்தின் சுவர்களில் பற்றிக்கொள்ளாதபடி.” “உத்திரங்கள்” என்பது கட்டடச் சூழலிலிருந்து வெளிப்படுத்தப்பட்டுள்ளது.
    reason: implicit_information
