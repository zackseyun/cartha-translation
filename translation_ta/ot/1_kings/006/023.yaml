  terminology: “கேருபீன்கள்” preserves the biblical creature term appropriately. “ஒலிவ மரத்தினால்” makes the material sense explicit and reads more naturally than “ஒலிவ மரத்தால்.” The alternative “மகா பரிசுத்த இடம்” is retained in a footnote rather than imposed in the text.
