  register: நவீனத் தரத் தமிழில், எளிதில் புரியக்கூடிய அதேவேளையில் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ஆலயச் சூழலைத் தெளிவாக்க 'உள் பரிசுத்த அறை' தேர்ந்தெடுக்கப்பட்டு, மரபுச் சிறப்புப் பெயரான 'கேருபீன்கள்' தக்கவைக்கப்பட்டுள்ளது.
