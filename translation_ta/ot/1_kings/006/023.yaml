  - severity: low
    issue: “ஒலிவ மரத்தால்” can sound as though the tree itself, rather than its wood, is the material.
    rationale: “ஒலிவ மரத்தினால்” more clearly expresses the material sense of the Hebrew phrase while retaining the audit trail’s olivewood decision.
