base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/023.yaml
  text: In the inner sanctuary he made two cherubim of olivewood[b][a], each ten cubits high.
translation:
  language: ta
  text: உட்புறப் பரிசுத்த அறையில்[a] ஒலிவ மரத்தினால் இரண்டு கேருபீன்களைச் செய்தான்; ஒவ்வொன்றும் பத்து முழம் உயரமாயிருந்தது.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மகா பரிசுத்த இடத்தில்.”
    reason: lexical_alternative
  - marker: b
    text: எபிரேயத்தில் சொல்லர்த்தமாக, “அதன் உயரம் பத்து முழம்.” இங்குள்ள ஒருமை, இரண்டு கேருபீன்களில் ஒவ்வொன்றையும் தனித்தனியாகக் குறிப்பதாகப் புரிந்துகொள்ளப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּדְּבִיר
  choice: உள் பரிசுத்த அறையில்
  rationale: דְּבִיר என்பது ஆலயத்தின் மிக உட்புறமான பரிசுத்த அறையைக் குறிக்கிறது. இச்சொற்றொடர் பின்னாளைய தொழில்நுட்பப் பெயரை நேரடியாகத் திணிக்காமல் இடத்தின் தன்மையைத் தெளிவாகக் கூறுகிறது.
- source_word: כְרוּבִים
  choice: கேருபீன்களை
  rationale: எபிரேயப் பன்மை வடிவத்தின் தனித்த வேதாகம உயிரினப் பெயரைத் தமிழில் ஒலிபெயர்த்துப் பாதுகாக்கிறது.
- source_word: עֲצֵי שָׁמֶן
  choice: ஒலிவ மரத்தால்
  rationale: இச்சொற்றொடர் ஒலிவ மரத்தின் மரப்பொருளைக் குறிக்கிறது; நவீனத் தமிழில் இயல்பாகப் பொருளைத் தெரிவிக்கிறது.
- source_word: עֶשֶׂר אַמּוֹת
  choice: பத்து முழம்
  rationale: אַמָּה என்னும் பழங்கால நீள அலகுக்கு நிலைபெற்ற தமிழ் வேதாகமச் சமமான சொல் 'முழம்' ஆகும்.
- source_word: קוֹמָתוֹ
  choice: ஒவ்வொன்றும் பத்து முழம் உயரமாயிருந்தது
  rationale: மூலத்தில் 'அதன் உயரம்' என்று ஒருமை வந்தாலும், முன்னர் கூறப்பட்ட இரண்டு கேருபீன்களுக்கும் பகிர்ந்தளிக்கும் பொருளில் அது பயன்படுகிறது. இயல்பான தமிழில் இதனை வெளிப்படையாகக் கூறுகிறது.
- source_word: וַיַּעַשׂ
  choice: செய்தான்
  rationale: עשה என்ற பொதுவான 'செய்/உருவாக்கு' வினையின் நேரடியான, சூழலுக்கேற்ற தமிழ் வடிவம்.
