  text: He made for the house windows with recessed frames[a].
translation:
  language: ta
  text: அவர் ஆலயத்திற்காக உள்சாய்வான சட்டங்களையுடைய, மூடப்பட்ட ஜன்னல்களை அமைத்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்குள்ள எபிரேயக் கட்டடக்கலைச் சொற்கள் அரிதானவை; அவற்றின் துல்லியமான பொருள் உறுதியில்லை. இத்தொடரை “மூடப்பட்ட உள்சாய்வான சட்டங்களையுடைய ஜன்னல்கள்,” “சாய்வாக வெட்டப்பட்ட சட்டங்களையுடைய ஜன்னல்கள்,” “குறுகிவரும் பக்கங்களையுடைய ஜன்னல்கள்,” அல்லது “வெளிப்புறத்தில் குறுகியும் உட்புறத்தில் அகன்றும் இருந்த ஜன்னல்கள்” என்றும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: அவர் ... அமைத்தார்
  rationale: עשה என்பதன் வழக்கமான தொடர் நிகழ்வைக் குறிக்கும் வடிவம். கட்டடச் சூழலில் ‘அமைத்தார்’ என்பது இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: לַבָּיִת
  choice: ஆலயத்திற்காக
  rationale: ל என்ற முன்னிடைச்சொல்லின் நோக்கப் பொருளை ‘-க்காக’ காட்டுகிறது. சூழலில் בית என்பது பொதுவான வீட்டை அல்ல, கர்த்தருடைய ஆலயத்தைக் குறிக்கிறது; ஆகவே நவீனத் தமிழில் ‘ஆலயம்’ தெளிவானது.
- source_word: חַלּוֹנֵי
  choice: சன்னல்களை
  rationale: חלון என்பதன் பன்மை இணைநிலை வடிவம்; கட்டடத்தில் உள்ள சன்னல்கள் அல்லது சன்னல் திறப்புகளைக் குறிக்கிறது.
- source_word: שְׁקֻפִים
  choice: உள்சாய்வான சட்டங்களைக் கொண்ட
  rationale: அரிதான இக்கட்டடக்கலைச் சொல் சாய்ந்த, உள்ளொடுங்கிய அல்லது அகலம் மாறும் சட்டங்கள்/பக்கங்களைச் சுட்டலாம். ‘உள்சாய்வான சட்டங்கள்’ சாத்தியமான வடிவை வாசிக்கத் தகுந்த முறையில் தருகிறது; உறுதியின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: אֲטֻמִים
  choice: சன்னல் அமைப்பின் ஒரு பகுதியாகக் கருதப்பட்டது; தனியாக மொழிபெயர்க்கப்படவில்லை
  rationale: אטם என்பதிலிருந்து வந்த இச்சொல் ‘மூடப்பட்ட/அடைக்கப்பட்ட’ என்ற கருத்தைக் கொண்டிருக்கலாம். ஆனால் இவ்விரு அரிய கட்டடக்கலைச் சொற்களின் தொடரைத் துல்லியமாகப் பிரிப்பது உறுதியற்றது; இயல்பற்ற இரட்டை விளக்கத்தைத் தவிர்த்து, அதன் சாத்தியமான கருத்து அடிக்குறிப்பில் தரப்படுகிறது.
