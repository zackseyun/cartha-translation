  source_fidelity: திருத்தம் தேவை. எபிரேயத்தில் חַלּוֹנֵי என்பதற்குப் பின்வரும் שְׁקֻפִים மற்றும் אֲטֻמִים ஆகிய இரு அரிய கட்டடக்கலைச் சொற்களும் உள்ளன. வரைவு முதன்மை உரையில் முதல் கூறான உள்சாய்வான/உள்ளொடுங்கிய சட்டங்களையே வெளிப்படுத்தி, அֲטֻמִים-இன் ‘மூடப்பட்ட/அடைக்கப்பட்ட’ கூறை அடிக்குறிப்புக்கு மட்டும் மாற்றுகிறது. அதன் துல்லியமான தொடரியல் உறுதியற்றதாயினும், அந்தக் கூறை முதன்மை உரையிலும் எச்சரிக்கையுடன் வைத்திருப்பது சிறந்தது.
