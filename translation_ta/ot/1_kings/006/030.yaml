translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கட்டுமானச் சொல்லாட்சி பயன்படுத்தப்பட்டது. எபிரெயத்தின் சொற்படியான ‘வீடு’ பிரதான உரையில் சூழலுக்கேற்ற ‘ஆலயம்’ எனத் தெளிவாக்கப்பட்டு, அடிக்குறிப்பில் பாதுகாக்கப்பட்டது; இறுதிச் சொற்றொடரின் சுருக்கமான மூலவடிவமும் அதன் சாத்தியமான பொருளும் குறிப்பில் தெரிவிக்கப்பட்டன.
