source:
  edition: WLC
  text: וְ/אֶת קַרְקַ֥ע הַ/בַּ֖יִת צִפָּ֣ה זָהָ֑ב לִ/פְנִ֖ימָה וְ/לַ/חִיצֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/030.yaml
  text: He overlaid the floor of the house with gold[b][a], on the inside and on the outside.
translation:
  language: ta
  text: ஆலயத்தின் தரையை[a] உள்ளேயும் வெளியேயும்[b] தங்கத்தால் மூடினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்படியாக, “வீட்டின் தரை.” இங்கு “வீடு” என்பது ஆலயத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் சொற்படியாக, “உள்ளே மற்றும் வெளியே.” இந்தச் சொற்றொடர், உட்பகுதியிலிருந்து வெளிப்பகுதிவரை தரை முழுவதும் தங்கத்தால் மூடப்பட்டிருந்ததைக் குறிக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: קַרְקַע
  choice: தரை
  rationale: ஆலயக் கட்டுமானச் சூழலில் இது பொதுவான நிலத்தைக் குறிக்காமல், கட்டிடத்தின் தரைப்பரப்பைக் குறிக்கிறது.
- source_word: הַבַּיִת
  choice: ஆலயம்
  rationale: எபிரெயச் சொல் சொற்படியாக ‘வீடு’ என்றாலும், இச்சூழலில் அது ஆலயத்துக்கான வழக்கமான குறிப்பு; நவீன தமிழில் ‘ஆலயம்’ இயல்பாகவும் தெளிவாகவும் உள்ளது. சொற்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: צִפָּה
  choice: மேற்பூச்சிட்டான்
  rationale: ஒரு பரப்பை வேறொரு பொருளால் மூடுதல் அல்லது பதித்தல் என்பதே வினையின் பொருள்; தங்கத்தால் செய்யப்பட்ட கட்டுமானப் பணியை ‘மேற்பூச்சிட்டான்’ தெளிவாகக் காட்டுகிறது.
- source_word: זָהָב
  choice: தங்கம்
  rationale: பொருளைக் குறிக்கும் நேரடியான சொல்; சூழலில் வேறுபடுத்த வேண்டிய காரணம் இல்லை.
- source_word: לִפְנִימָה
  choice: உள்ளிருந்து
  rationale: உட்புறத்தை அல்லது உள்நோக்கிய பரப்பளவைச் சுட்டுகிறது; அடுத்த சொல்லுடன் இணைத்து எல்லையைத் தெரிவிக்கிறது.
- source_word: וְלַחִיצוֹן
  choice: வெளியேவரை
  rationale: வெளிப்புறத்தைச் சுட்டும் இச்சொல், முன்வரும் ‘உள்ளே’ என்பதுடன் இடவியல் எதிரிணையாக உள்ளது; ‘உள்ளிருந்து வெளியேவரை’ என்பது தரை முழுவதும் மூடப்பட்டிருக்கலாம் என்ற பொருளை இயல்பாகத் தருகிறது, அதேவேளை குறிப்பு மூலம் மூலத்தின் சுருக்கத்தன்மை பாதுகாக்கப்படுகிறது.
