base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/021.yaml
  text: Then he stretched himself out over the boy three times[a], and he cried out to Yahweh and said, “Yahweh my God, please let this boy’s life return to him.”
translation:
  language: ta
  text: பின்பு அவன் அந்தச் சிறுவன்மேல் மூன்று முறை தன் உடலை நீட்டிப் படுத்தான். அவன் யாவேயை நோக்கிக் கூப்பிட்டு, “என் கடவுளாகிய யாவேயே, தயவுசெய்து இந்தச் சிறுவனின் உயிர்[a] அவனுக்குள் திரும்பி வரட்டும்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, “இந்தச் சிறுவனின் ஆத்துமா அவனுக்குள் திரும்பி வரட்டும்.” எபிரெய மொழியில் சொல்லுக்குச் சொல்: “இந்தச் சிறுவனின் נֶפֶשׁ அவனுடைய உள்ளான பகுதிக்குத் திரும்பி வரட்டும்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְמֹדֵד
  choice: தன் உடலை நீட்டிப் படுத்தான்
  rationale: அரிதான இவ்வினைச்சொல், எலியா சிறுவன்மேல் தன் உடலை நீட்டிப் படுத்த செயலை இச்சூழலில் குறிக்கிறது. ‘அளந்தான்’ என்ற சொற்பொருள் சார்ந்த மொழிபெயர்ப்பைவிட இது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: עַל הַיֶּלֶד
  choice: அந்தச் சிறுவன்மேல்
  rationale: עַל இங்கு உடல் அமைந்திருந்த நிலையைக் குறிக்கிறது. ஆண்பால் ஒருமையும் கதையின் சூழலும் காரணமாக יֶלֶד என்பது ‘சிறுவன்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: שָׁלֹשׁ פְּעָמִים
  choice: மூன்று முறை
  rationale: எண்ணிக்கையையும் செயல் மீண்டும் நிகழ்ந்ததையும் இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: וַיִּקְרָא אֶל יְהוָה
  choice: யாவேயை நோக்கிக் கூப்பிட்டு
  rationale: கடவுளிடம் செய்யப்படும் அவசரமான, ஆழ்ந்த வேண்டுதலை קרא אל இங்கு வெளிப்படுத்துகிறது; ‘நோக்கிக் கூப்பிட்டு’ அந்த வேண்டுதலின் தீவிரத்தை மிகைப்படுத்தாமல் காட்டுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைபெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் அறியப்பட்ட ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: יְהוָה אֱלֹהָי
  choice: என் கடவுளாகிய யாவேயே
  rationale: தனிப்பட்ட இறைபெயரையும் ‘என் கடவுள்’ என்ற முதலாம் நபர் உடைமை உறவையும் நேரடி அழைப்பின் இயல்போடு காக்கிறது.
- source_word: תָּשָׁב נָא
  choice: தயவுசெய்து … திரும்பி வரட்டும்
  rationale: வேண்டுகோள் வினைநிலையையும் נָא தரும் பணிவான, அவசரமான மன்றாட்டையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது; காரணவினை அர்த்தத்தை தேவையின்றி சேர்க்கவில்லை.
- source_word: נֶפֶשׁ
  choice: உயிர்
  rationale: இறந்த சிறுவன் மீண்டும் உயிர்பெறும் இச்சூழலில், נֶפֶשׁ அவனுக்கு உயிரூட்டும் வாழ்வைக் குறிக்கிறது. ‘உயிர்’ என்பது தெளிவான சூழல்சார் மொழிபெயர்ப்பு; ‘ஆத்துமா’ என்ற சாத்தியமான மாற்று அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: עַל קִרְבּוֹ
  choice: அவனுக்குள்
  rationale: சொல்லுக்குச் சொல் எனில் ‘அவனுடைய உள்ளான பகுதியில்’ என்று வரும் இந்த எபிரெயச் சொல்லமைப்பு, உயிர் அந்த நபருக்குள் திரும்புவதைச் சுட்டுகிறது. ‘அவனுக்குள்’ என்பது அதன் உருவகத்தை ஓரளவு காத்து இயல்பான தமிழில் பொருளைத் தெரிவிக்கிறது.
theological_decisions:
- issue: உயிர்த்தெழுதல் சூழலில் נֶפֶשׁ என்பதன் மொழிபெயர்ப்பு
  choice: உயிர்
  alternative: ஆத்துமா
  rationale: இவ்வசனத்தின் மன்றாட்டு, சிறுவனுக்கு உயிரூட்டும் வாழ்வு திரும்புவதை முதன்மையாகக் குறிக்கிறது. ‘உயிர்’ என்பது குறிப்பிட்ட மனித இயல்பியல் கோட்பாட்டைத் திணிக்காமல் கதையின் பொருளைத் தருகிறது. அதேவேளை, ‘ஆத்துமா’ என்பது சொற்பொருள் அடிப்படையில் சாத்தியமான பாரம்பரிய மொழிபெயர்ப்பு என்பதால் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. கதைச் செயலும் ஜெபத்தின் அவசரமான பணிவும் தெளிவாக வைக்கப்பட்டுள்ளன; இறைபெயர் பட்டமாக மாற்றப்படாமல் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
