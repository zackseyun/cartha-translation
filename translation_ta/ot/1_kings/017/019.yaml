  yaml_path: translation/ot/1_kings/017/019.yaml
  text: And he said to her[a], “Give me your son.” Then he took him from her bosom, carried him up to the upper room where he was staying[b], and laid him on his own bed.
translation:
  language: ta
  text: அவர் அவளிடம், “உன் மகனை என்னிடம் கொடு” என்றார். பின்பு அவளுடைய மடியிலிருந்து[a] அவனைத் தூக்கிக்கொண்டு, தான் தங்கியிருந்த மேல்மாடி அறைக்கு[b] ஏறிச் சென்று, தமது கட்டிலின்மேல் அவனைக் கிடத்தினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல் மார்பு அல்லது மடிப் பகுதியைக் குறிக்கும்; தாய் மகனைத் தன்னோடு நெருக்கமாகத் தாங்கியிருந்ததை இது உணர்த்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘மேலறை’ அல்லது ‘கூரையறை’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּנִי לִי
  choice: என்னிடம் கொடு
  rationale: נתן என்ற வினையின் பெண்பால் ஒருமை கட்டளை வடிவமும் לִי என்பதும் நேரடியாகவும் இயல்பாகவும் ‘என்னிடம் கொடு’ என்று பொருள்படுகின்றன.
- source_word: בְּנֵךְ
  choice: உன் மகனை
  rationale: בֵּן என்பது பொதுவான ‘பிள்ளை’ என்பதைக் காட்டிலும் குறிப்பாக ‘மகன்’ என்பதைக் குறிக்கிறது.
- source_word: מֵחֵיקָהּ
  choice: அவளுடைய மடியிலிருந்து
  rationale: חֵיק என்பது மார்பு அல்லது மடிப் பகுதியைக் குறிக்கிறது; இச்சூழலில் தாய் மகனை நெருக்கமாகத் தாங்கியிருந்ததை இயல்பான நவீன தமிழில் ‘மடி’ தெரிவிக்கிறது.
- source_word: וַיַּעֲלֵהוּ
  choice: அவனைத் தூக்கிக்கொண்டு ... ஏறிச் சென்று
  rationale: עלה இங்கு அவனை மேலே எடுத்துச் சென்ற செயலைக் குறிக்கிறது. சிறுவனை உடலால் சுமந்து மேல்மாடிக்குச் சென்றதை இந்தத் தமிழ் நடை தெளிவாக வெளிப்படுத்துகிறது.
- source_word: הָעֲלִיָּה
  choice: மேல்மாடி அறை
  rationale: עֲלִיָּה என்பது வீட்டின் மேற்பகுதியிலுள்ள அறை அல்லது கூரையறையைக் குறிக்கிறது; ‘மேல்மாடி அறை’ தெளிவான, இயல்பான இணைச்சொல்.
- source_word: אֲשֶׁר הוּא יֹשֵׁב שָׁם
  choice: தான் தங்கியிருந்த
  rationale: ישב என்பதன் அடிப்படைப் பொருள் ‘உட்கார்’ என்றாலும், இச்சூழலில் வசித்தல் அல்லது தங்கியிருத்தலைக் குறிக்கிறது. ‘தான்’ என்பது அறையில் தங்கியிருந்தவர் எலியா என்பதைத் தெளிவாக்குகிறது.
- source_word: וַיַּשְׁכִּבֵהוּ
  choice: அவனைக் கிடத்தினார்
  rationale: שׁכב என்பதன் ஹிஃபில் வடிவம் ஒருவரைப் படுக்கச் செய்வதைக் குறிக்கிறது; ‘கிடத்தினார்’ சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: עַל מִטָּתוֹ
  choice: தமது கட்டிலின்மேல்
  rationale: மூன்றாம் நபர் ஆண்பால் ஒருமை பின்னொட்டு எலியாவையே சுட்டுகிறது. மரியாதை ஒருமையுடன் வரும் ‘தமது’ அது எலியாவின் சொந்தக் கட்டில் என்பதைத் தெளிவாக்குகிறது.
