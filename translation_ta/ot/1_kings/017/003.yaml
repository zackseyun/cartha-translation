language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: לֵ֣ךְ מִ/זֶּ֔ה וּ/פָנִ֥יתָ לְּ/ךָ֖ קֵ֑דְמָ/ה וְ/נִסְתַּרְתָּ֙ בְּ/נַ֣חַל כְּרִ֔ית אֲשֶׁ֖ר עַל פְּנֵ֥י הַ/יַּרְדֵּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/003.yaml
  text: Go from here and turn yourself eastward[a], and hide yourself by the Wadi Cherith[c][b], which is east of the Jordan.
translation:
  language: ta
  text: “நீ இங்கிருந்து புறப்பட்டு, கிழக்கு நோக்கித் திரும்பி, யோர்தானுக்கு எதிரே[c] உள்ள கேரீத்[b] ஓடையருகே[a] ஒளிந்துகொள்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஓடை” என்பதற்கான எபிரெயச் சொல், பருவகால நீரோடையையோ அது பாயும் பள்ளத்தாக்கையையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இந்த இடப்பெயரை “கெரீத்” என்றும் பெயரெழுத்தாக்கலாம்.
    reason: alternative_reading
  - marker: c
    text: எபிரெயில், “யோர்தானின் முன்பாக.” இங்கு “யோர்தானுக்கு எதிரே” அல்லது, புவியியல் சூழலில், “யோர்தானுக்குக் கிழக்கே” என்று பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵךְ מִזֶּה
  choice: இங்கிருந்து புறப்பட்டு
  rationale: கட்டளையின் நேரடியான பொருளையும், எலியா தன் தற்போதைய இடத்தைவிட்டு செல்ல வேண்டும் என்பதையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וּפָנִיתָ לְּךָ קֵדְמָה
  choice: கிழக்கு நோக்கித் திரும்பி
  rationale: קֵדְמָה என்பது கிழக்குத் திசையைச் சுட்டுகிறது. לְךָ-வின் இடைநிலைத் தன்மையைத் தமிழில் தேவையற்ற ‘உன்னைத் திருப்பி’ என வலியுறுத்தாமல், இயல்பான கட்டளை நடையில் வழங்குகிறது.
- source_word: וְנִסְתַּרְתָּ
  choice: ஒளிந்துகொள்
  rationale: סתר என்ற வேரின் நிஃபால் வடிவம் இங்கு தன்னை மறைத்துக்கொண்டு இருக்கும்படியான கட்டளையைக் குறிக்கிறது; ‘ஒளிந்துகொள்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: בְּנַחַל
  choice: ஓடையருகே
  rationale: נחל என்பது ஓடை, பருவகால நீரோடை, அல்லது அது பாயும் பள்ளத்தாக்கைக் குறிக்கலாம். ‘ஓடை’ வாசிக்க எளிதானது; சொல்லின் பரந்த பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: כְּרִית
  choice: கேரீத்
  rationale: எபிரெய இடப்பெயரின் தமிழ்ப் பெயரெழுத்தாக்கம்; நீண்ட இறுதி உயிரொலியையும் பெயரின் அடையாளத்தையும் தக்கவைக்கிறது.
- source_word: אֲשֶׁר עַל פְּנֵי הַיַּרְדֵּן
  choice: யோர்தானுக்கு எதிரே உள்ள
  rationale: עַל־פְּנֵי என்பதன் அடிப்படை இடவியல் நுணுக்கமான ‘எதிரே/முன்பாக’ என்பதைப் பாதுகாக்கிறது; உறுதியாகத் தீர்மானிக்க முடியாத ‘யோர்தானுக்குக் கிழக்கே’ என்ற விளக்கத்தை முதன்மை உரையில் திணிக்கவில்லை.
