base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/018.yaml
  text: She said to Elijah[a], “What do I have to do with you, man of God? Have you come to me to bring my iniquity to remembrance and to cause my son to die?”
translation:
  language: ta
  text: அவள் எலியாவிடம், “தேவனுடைய மனிதரே, உமக்கும் எனக்கும் என்ன சம்பந்தம்? என் அக்கிரமத்தை[a] நினைவுக்குக் கொண்டுவந்து, என் மகனைச் சாகச் செய்வதற்காகவா என்னிடம் வந்தீரா?” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “என் பாவத்தை” அல்லது “என் குற்றப்பொறுப்பை.” எபிரெயச் சொல் தவறான செயல், குற்றப்பொறுப்பு, அல்லது அந்தக் குற்றப்பொறுப்பின் சுமை அல்லது விளைவு ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה לִּי וָלָךְ
  choice: உமக்கும் எனக்கும் என்ன தொடர்பு?
  rationale: இந்த எபிரெய மரபுத்தொடர் விலகல், எதிர்ப்பு, அல்லது குற்றச்சாட்டை வெளிப்படுத்துகிறது. நவீன தமிழில் இயல்பாகவும் அதன் மோதல் தொனியைத் தக்கவைத்தும் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: אִישׁ הָאֱלֹהִים
  choice: தேவனுடைய மனிதரே
  rationale: இது தீர்க்கதரிசி அல்லது தெய்வீகத் தூதருக்கான நிலைபெற்ற எபிரெயப் பட்டம். விளக்கவுரையாக மாற்றாமல் பட்டத்தின் வடிவமும் வேதாகமத் தொனியும் காக்கப்பட்டுள்ளன.
- source_word: בָּאתָ אֵלַי
  choice: என்னிடம் வந்தீர்?
  rationale: நேரடிப் பேச்சில் உள்ள நிறைவு வினை குற்றஞ்சாட்டும் வினாவாகச் செயல்படுகிறது; தமிழில் சூழலால் அந்த வினாவலிமை தெளிவாகிறது.
- source_word: לְהַזְכִּיר
  choice: நினைவுக்குக் கொண்டுவந்து
  rationale: זכר என்பதன் ஹிஃபில் வடிவம் ஒன்றை நினைவில் எழச் செய்வதை அல்லது கவனத்திற்குக் கொண்டுவருவதைச் சுட்டுகிறது. யாருடைய நினைவுக்கு என்பது மூலத்தில் சொல்லப்படாததால் தமிழிலும் குறிப்பிடப்படவில்லை.
- source_word: עֲוֺנִי
  choice: என் அக்கிரமத்தை
  rationale: עָוֹן தவறான செயல், அதனால் உண்டாகும் குற்றப்பழி, அல்லது அதன் விளைவு ஆகியவற்றைக் குறிக்கலாம். ‘அக்கிரமம்’ அதன் அறநெறிசார் கனத்தைத் தக்கவைக்கிறது; சொல்லின் பரந்த பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וּלְהָמִית
  choice: என் மகனைச் சாகச் செய்வதற்காக
  rationale: מות என்பதன் ஹிஃபில் வடிவம் காரணவினைப் பொருளுடையது. நேரடியாக ‘கொல்ல’ என்று குறுக்காமல், மரணத்தை ஏற்படுத்தும் பொருளை இவ்வடிவம் காக்கிறது.
- source_word: בְּנִי
  choice: என் மகனை
  rationale: בֵּן குறிப்பாக ‘மகன்’ என்று பொருள்படுவதால் பாலினத்தைக் குறிப்பிடும் மூலச்சொல் துல்லியமாகக் காக்கப்பட்டது.
theological_decisions:
- issue: விதவையின் குற்றச்சாட்டில் עֲוֺנִי என்பதன் பொருள்
  choice: என் அக்கிரமத்தை
  alternative: என் பாவத்தை; என் குற்றப்பழியை
  rationale: விதவை தன் மகனின் மரணத்தைத் தன்னுடைய அறநெறிசார் தவறு அல்லது அதனால் வந்த குற்றப்பழியுடன் தொடர்புபடுத்துகிறாள். எபிரெயச் சொல் செயல் மற்றும் அதற்கான குற்றப்பொறுப்பு இரண்டையும் உள்ளடக்கக்கூடும்; மொழிபெயர்ப்பு அவற்றில் ஒன்றை மட்டும் முடிவாகத் தேர்ந்தெடுக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையுடனும் வேதாகமச் சூழலுக்கேற்ற கண்ணியத்துடனும் அமைக்கப்பட்டுள்ளது. ‘உமக்கும் எனக்கும்’ மற்றும் ‘வந்தீர்’ ஆகியவை பெண்ணின் தீவிரமான நேரடி உரைக்கு ஏற்ற மரியாதை ஒருமை வடிவங்கள்; மொழி மிகப் பழமையானதாகாமல் வைக்கப்பட்டுள்ளது.
