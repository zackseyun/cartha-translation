  text: And the word of Yahweh came to him[a], saying,
translation:
  language: ta
  text: 'யாவேயின் வார்த்தை அவனுக்கு வந்து, இவ்வாறு கூறியது:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: பின்பு ... கூறியதாவது
  rationale: வாவ்-தொடர்நிலை கதையின் அடுத்த நிகழ்வை அறிமுகப்படுத்துகிறது. ‘பின்பு’ என்பது எபிரேயக் கதைத் தொடரை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: דְבַר יְהוָה
  choice: யாவே ... கூறியதாவது
  rationale: இது தீர்க்கதரிசன வெளிப்பாட்டைக் குறிக்கும் நிலையான எபிரேயச் சொற்றொடர். ‘யாவேயின் வார்த்தை வந்தது’ என்று சொற்சொல்லாக மொழிபெயர்ப்பதைவிட, தமிழில் இயல்பாக ‘யாவே ... கூறியதாவது’ என வழங்கப்பட்டுள்ளது; நேரடியாகத் தொடர்ந்து வரும் உரையையும் இது தெளிவாக அறிமுகப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: יהוה என்ற இறைப் பெயர் ஒரு பட்டப்பெயரால் மாற்றப்படாமல், அதன் பரவலாக ஏற்றுக்கொள்ளப்பட்ட ஒலிபெயர்ப்பான ‘யாவே’ என்று வழங்கப்படுகிறது.
- source_word: אֵלָיו
  choice: அவனிடம்
  rationale: אֶל என்பதும் மூன்றாம் நபர் ஆண்பால் ஒருமை பின்னொட்டும் சேர்ந்து, செய்தி அவனை நோக்கி வந்ததைக் குறிக்கின்றன. ‘அவனிடம்’ என்பது இயல்பான தமிழ் இணை.
- source_word: לֵאמֹר
  choice: 'கூறியதாவது:'
  rationale: இந்த வினையெச்ச வடிவம் தொடர்ந்து வரும் நேரடி உரையை அறிமுகப்படுத்துகிறது. தமிழில் ‘கூறியதாவது:’ என்பது அந்தச் செயல்பாட்டைத் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூல உரையில் பட்டப்பெயர் அல்ல, יהוה என்ற தனிப்பட்ட இறைப் பெயரே உள்ளது. ஆகவே அதை ‘ஆண்டவர்’ என்று மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன, தெளிவான, மரியாதைமிக்க தமிழ் பயன்படுத்தப்பட்டுள்ளது. எபிரேயத்தின் சொற்சொல்லான ‘யாவேயின் வார்த்தை அவனுக்கு வந்தது’ என்பதன் தீர்க்கதரிசனப் பொருள் காக்கப்பட்டு, தமிழில் இயல்பாக நேரடி உரையை அறிமுகப்படுத்தும் வடிவில் வழங்கப்பட்டுள்ளது.
