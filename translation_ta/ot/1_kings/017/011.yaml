    text: அல்லது, “அவளுக்குப் பின்னால் இருந்து கூப்பிட்டான்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “ஒரு கவளம் அப்பத்தை.”
    reason: lexical_alternative
