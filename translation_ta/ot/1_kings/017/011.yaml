translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்கு எளிதில் புரியும் மரியாதையான நடையைக் கையாளுகிறது. ‘அப்பம்’ வேதாகமச் சூழலில் பரவலாக அறியப்படும் சொல்லாகத் தக்கவைக்கப்பட்டுள்ளது; சொற்சொற் கடினத்தன்மையைத் தவிர்க்க ‘எடுத்துக்கொண்டு வா’ பயன்படுத்தப்பட்டுள்ளது.
