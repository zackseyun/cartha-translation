source:
  edition: WLC
  text: וַ/תֵּ֖לֶךְ לָ/קַ֑חַת וַ/יִּקְרָ֤א אֵלֶ֨י/הָ֙ וַ/יֹּאמַ֔ר לִֽקְחִי נָ֥א לִ֛/י פַּת לֶ֖חֶם בְּ/יָדֵֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/011.yaml
  text: As she went to get it[a], he called to her and said[b], “Please bring me a piece of bread in your hand.”
translation:
  language: ta
  text: அவள் அதை எடுக்கச் சென்றபோது, அவன் அவளை நோக்கிக் கூப்பிட்டு[a], “தயவுசெய்து, எனக்காக ஒரு துண்டு அப்பத்தை[b] உன் கையில் எடுத்துக்கொண்டு வா” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவளுக்குப் பின்னால் இருந்து கூப்பிட்டான்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “ஒரு கவளம் அப்பத்தை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶךְ לָקַחַת
  choice: அவள் அதை எடுக்கச் சென்றபோது
  rationale: הלך என்பதன் தொடர்கதை வடிவமும் அதைத் தொடர்ந்து வரும் לקח என்பதன் நோக்க வினையெச்சமும், அவள் முன்பு கேட்ட தண்ணீரை எடுக்கச் சென்றுகொண்டிருந்தபோது எலியா அழைத்தான் என்ற நிகழ்வுத் தொடரைத் தருகின்றன. ‘அதை’ என்பது முந்தைய வசனத்திலுள்ள தண்ணீரைக் குறிக்கிறது.
- source_word: וַיִּקְרָא אֵלֶיהָ
  choice: அவன் அவளைக் கூப்பிட்டு
  rationale: קרא + אֶל என்பது ஒருவரை நோக்கிக் கூப்பிடுவதைக் குறிக்கிறது. ‘அவளைக் கூப்பிட்டு’ என்பது நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது; சூழலின் அடிப்படையில் ‘அவள் பின்னால் கூப்பிட்டு’ என்றும் புரிந்துகொள்ளலாம்.
- source_word: לִקְחִי נָא לִי
  choice: தயவுசெய்து, எனக்காக … எடுத்துக்கொண்டு வா
  rationale: לקח என்பதன் கட்டளை வடிவம் அடிப்படையில் ‘எடு’ என்றாலும், இங்கு எடுத்து வந்து கொடுப்பதே நோக்கம். נָא வேண்டுகோளை மென்மையாக்குவதால் ‘தயவுசெய்து’ என்றும், לִי பயனாளியைச் சுட்டுவதால் ‘எனக்காக’ என்றும் மொழிபெயர்க்கப்பட்டது.
- source_word: פַּת לֶחֶם
  choice: ஒரு துண்டு அப்பம்
  rationale: இந்தச் சொற்றொடர் அப்பத்தின் ஒரு சிறிய துண்டை அல்லது கவளத்தைக் குறிக்கிறது. ‘ஒரு துண்டு அப்பம்’ பொதுவான, இயல்பான தமிழாக இருப்பதுடன் மூலத்தின் பொருளையும் காக்கிறது.
- source_word: בְּיָדֵךְ
  choice: உன் கையில்
  rationale: எபிரெயச் சொற்றொடரின் நேரடியான கை உருவகத்தைத் தக்கவைக்கிறது. தமிழிலும் இது புரியக்கூடியதாக உள்ளது; இங்கு அப்பத்தை கையில் எடுத்துக்கொண்டு வருவதைச் சுட்டுகிறது.
