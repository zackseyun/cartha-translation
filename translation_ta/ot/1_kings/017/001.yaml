  revision_rationale: 'திருத்தம் இரண்டு பாதுகாப்பான மாற்றங்களையே செய்கிறது: எபிரெய ஆணைமொழியின் செயல்பாட்டைத் தமிழில் வெளிப்படையாக்குகிறது; “திஸ்பே” என்ற ஊர்ப்பெயருடன் ஒத்த வடிவமான “திஸ்பேயன்” என்பதைப் பயன்படுத்துகிறது. அடிக்குறிப்பு c ஆணைமொழியுடன் இணைக்கப்பட்டுள்ளது; b விதிவிலக்குச் சொற்றொடருடன் இணைக்கப்பட்டுள்ளது. வேறு எந்த இறையியல் விரிவாக்கமும் சேர்க்கப்படவில்லை.'
