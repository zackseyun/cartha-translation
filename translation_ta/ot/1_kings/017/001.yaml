base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/001.yaml
  text: And Elijah the Tishbite[a], from the inhabitants of Gilead, said to Ahab, “As Yahweh, the God of Israel, lives, before whom I stand, there will be neither dew nor rain in these years[c][b], except by my word.”
translation:
  language: ta
  text: 'கீலேயாத்தின் குடியிருப்பாளர்களில் ஒருவனான திஸ்பேயன் எலியா[a] ஆகாபிடம், “நான் எவருடைய முன்னிலையில் நிற்கிறேனோ, அந்த இஸ்ரவேலின் கடவுளாகிய யாவே உயிரோடிருக்கிறார் என்பதன்மேல் ஆணையாகச் சொல்கிறேன்[c]: என் வார்த்தையின்படி அன்றி[b], இந்த ஆண்டுகளில் பனித்துளியோ மழையோ இருக்காது” என்றான்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “திஸ்பேயன்” என்பது “திஸ்பே ஊரைச் சேர்ந்தவன்” என்று பொருள்படலாம். இங்கு வரும் எபிரெயச் சொற்றொடரை “கீலேயாத்தின் குடியிருப்பாளர்களில் ஒருவன்” அல்லது “கீலேயாத்தின் குடியேறிகளில் ஒருவன்” என்றும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது “என் வார்த்தைக்கேற்ப” / “என் சொல்லின்போது அன்றி.”
    reason: lexical_alternative
  - marker: c
    text: 'எபிரெயில் இது ஆணைமொழிக்குரிய சொல்முறை: நேரடியாக “இருக்குமானால் …” என்று தொடங்கி, “நிச்சயமாக இருக்காது” என்ற பொருளைத் தருகிறது.'
    reason: cultural_note
lexical_decisions:
- source_word: הַתִּשְׁבִּי
  choice: திஸ்பியன்
  rationale: எலியாவின் ஊர் அல்லது இனப்பெயர் சார்ந்த அடையாளத்தைச் சுருக்கமாகப் பாதுகாக்கிறது; ‘திஸ்பே ஊரைச் சேர்ந்தவன்’ என்ற பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: מִתֹּשָׁבֵי גִלְעָד
  choice: கீலேயாத்தில் குடியிருந்தவர்களில் ஒருவன்
  rationale: תּוֹשָׁבֵי என்பது வெறுமனே பிறப்பிடத்தை மட்டுமல்லாமல் அங்கு வசித்தவர்கள் அல்லது குடியேறியவர்களையும் குறிக்கலாம்; அந்த நுணுக்கத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: חַי יְהוָה
  choice: யாவே உயிரோடிருப்பது நிச்சயம்
  rationale: இது எபிரெய ஆணைமொழி. அதன் உறுதியான சத்தியப்பிரமாணத் தன்மையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் நேரடியாக உள்ள இறைத் திருப்பெயரை ஒலிபெயர்த்துப் பாதுகாக்கிறது.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கடவுள்
  rationale: கட்டமைப்பையும் உடன்படிக்கைச் சார்ந்த அடையாளத்தையும் நேரடியாகக் காக்கிறது.
- source_word: אֲשֶׁר עָמַדְתִּי לְפָנָיו
  choice: நான் யாருடைய முன்னிலையில் நிற்கிறேனோ
  rationale: இறைமுன்னிலையில் நிற்றல் என்ற உருவகத்தைப் பாதுகாக்கிறது; அதை விளக்கமாக ‘சேவை செய்கிறேன்’ என்று மட்டும் மாற்றவில்லை.
- source_word: אִם יִהְיֶה
  choice: இருக்காது
  rationale: ஆணைமொழியில் אִם எதிர்மறையான உறுதியை உணர்த்துவதால், தமிழில் மறுப்பு வெளிப்படையாகத் தரப்படுகிறது.
- source_word: טַל וּמָטָר
  choice: பனித்துளியோ மழையோ
  rationale: டַל குறிக்கும் இரவுப் பனி அல்லது பனித்துளியையும் மָטָר குறிக்கும் மழையையும் தனித்தனியாகத் தெளிவாக்குகிறது.
- source_word: הַשָּׁנִים הָאֵלֶּה
  choice: இந்த ஆண்டுகளில்
  rationale: நீடிக்கும் காலப்பகுதியை இயல்பான காலவினையடையாக வழங்குகிறது.
- source_word: כִּי אִם
  choice: அன்றி
  rationale: கூற்றின் விதிவிலக்கைச் சுருக்கமாகவும் தெளிவாகவும் குறிக்கிறது.
- source_word: לְפִי דְבָרִי
  choice: என் வார்த்தையின்படி
  rationale: சொல்லுக்குச் சற்றே நெருக்கமாக இருந்து, ‘என் வார்த்தையால்’ என்று சுயாதீன ஆற்றலை அதிகமாக உணர்த்தாமல் தீர்க்கதரிசன அதிகாரத்தைக் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் உள்ள உடன்படிக்கைத் திருப்பெயரை பொதுப்பட்டமாக மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: לְפִי דְבָרִי என்பதில் எலியாவின் தீர்க்கதரிசன அதிகாரம்
  choice: என் வார்த்தையின்படி அன்றி
  alternative: என் வார்த்தையால் அன்றி / என் சொல்லுக்குப் பிறகே
  rationale: வறட்சியின் முடிவு எலியாவின் அறிவிப்புடன் இணைக்கப்படுவதைப் பாதுகாக்கிறது; அவர் கடவுளிடமிருந்து சுயாதீனமான ஆற்றல் கொண்டவர் என்று விரிவுபடுத்தவில்லை.
- issue: אֲשֶׁר עָמַדְתִּי לְפָנָיו என்ற இறைமுன்னிலைச் சொற்றொடர்
  choice: நான் யாருடைய முன்னிலையில் நிற்கிறேனோ
  alternative: நான் யாருக்குப் பணிசெய்கிறேனோ
  rationale: முன்னிலையில் நிற்றல், பணிசெய்தல் ஆகிய இரு சாத்தியமான ஒலிப்புகளையும் கொண்ட மூல உருவகத்தைத் தீர்மானமாகச் சுருக்காமல் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் வடிவமைக்கப்பட்டுள்ளது. ஆணைமொழியின் தீவிரம் காக்கப்பட்டுள்ளது; ‘முன்னிலையில் நிற்கிறேன்’ என்ற மூல உருவகம் விளக்கவுரையாக மாற்றப்படவில்லை. ‘பனித்துளி’ என்பது தமிழில் ‘பனி பெய்யாது’ எனும் குழப்பத்தைத் தவிர்த்து டַל என்பதைக் தெளிவாகக் குறிக்கிறது.
