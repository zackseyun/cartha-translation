  revised_text: 'கீலேயாத்தின் குடியிருப்பாளர்களில் ஒருவனான திஸ்பேயன் எலியா[a] ஆகாபிடம், “நான் எவருடைய முன்னிலையில் நிற்கிறேனோ, அந்த இஸ்ரவேலின் கடவுளாகிய யாவே உயிரோடிருக்கிறார் என்பதன்மேல் ஆணையாகச் சொல்கிறேன்[c]: என் வார்த்தையின்படி அன்றி[b], இந்த ஆண்டுகளில் பனித்துளியோ மழையோ இருக்காது” என்றான்.'
