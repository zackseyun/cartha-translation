  text: וְ/הָ/עֹרְבִ֗ים מְבִיאִ֨ים ל֜/וֹ לֶ֤חֶם וּ/בָשָׂר֙ בַּ/בֹּ֔קֶר וְ/לֶ֥חֶם וּ/בָשָׂ֖ר בָּ/עָ֑רֶב וּ/מִן הַ/נַּ֖חַל יִשְׁתֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/006.yaml
  text: And the ravens were bringing him bread and meat in the morning[a], and bread and meat in the evening, and he would drink from the wadi.
translation:
  language: ta
  text: அண்டங்காக்கைகள் காலையில் அவனுக்கு அப்பமும் இறைச்சியும், மாலையில் அப்பமும் இறைச்சியும் கொண்டு வந்தன; அவன் அந்த நீரோடையிலிருந்து[a] குடித்து வந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பருவகால நீர்ப்பாதை,” “சிற்றோடை” என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் נַחַל ஓர் ஓடையையோ, மழைக்காலத்தில் நீர் ஓடும் பள்ளத்தாக்குப் பாதையையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָעֹרְבִים
  choice: அண்டங்காக்கைகள்
  rationale: עֹרְבִים என்பதன் இயல்பான பொருள் ‘ravens’; பொதுவான ‘காகங்கள்’ என்பதைவிட ‘அண்டங்காக்கைகள்’ மூலச்சொல்லின் குறிப்பிட்ட பறவையினத்தைத் துல்லியமாகக் காட்டுகிறது.
- source_word: מְבִיאִים לוֹ
  choice: அவனுக்கு ... கொண்டுவந்துகொண்டிருந்தன
  rationale: எபிரெயப் பங்கேற்புவினை கதைச் சூழலில் தொடர்ந்து அல்லது வழக்கமாக நிகழ்ந்த செயலைக் குறிக்கிறது; தமிழ் தொடர்வினை வடிவம் அந்த மீள்நிகழ்வை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לֶחֶם וּבָשָׂר
  choice: அப்பமும் இறைச்சியும்
  rationale: மூலத்தின் concrete nouns மற்றும் இணைப்பை விரிவாக்காமல் நேரடியாகப் பேணுகிறது.
- source_word: בַּבֹּקֶר ... בָּעָרֶב
  choice: காலையில் ... மாலையில்
  rationale: இரு நேரங்களையும் குறிக்கும் இயல்பான நவீனத் தமிழ் வடிவம்; மூலத்தில் உள்ள முழு சொற்றொடரின் மறுபடியுரைத்தலும் பேணப்பட்டுள்ளது.
- source_word: וּמִן הַנַּחַל
  choice: அந்த நீரோடையிலிருந்து
  rationale: נַחַל என்பது ஓடும் நீரையோ, பருவகால நீர்ப்பாதையையோ குறிக்கலாம். ‘நீரோடை’ வாசிக்க இயல்பாக இருப்பதுடன், மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: יִשְׁתֶּה
  choice: குடித்துவந்தான்
  rationale: இங்கு imperfect வடிவம் வழக்கமாகத் தொடர்ந்த செயலைக் குறிக்கிறது; ‘குடித்துவந்தான்’ அந்த habitual sense-ஐ இயல்பாகத் தருகிறது.
theological_decisions:
- issue: עֹרְבִים மூலம் எலியாவுக்கு உணவு கிடைத்ததன் இயல்பு
  choice: சொல்லின் இயல்பான பொருளான அண்டங்காக்கைகள்
  alternative: அரேபியர்கள், வணிகர்கள் அல்லது வேறு மனித முகவர்கள்
  rationale: עֹרְבִים என்பதன் நேரடியான, வழக்கமான சொற்பொருள் ravens ஆகும்; அற்புதக் கூறைத் தவிர்ப்பதற்காக இதை மனித முகவர்களாக மாற்ற உடனடி சூழலில் ஆதாரம் இல்லை.
translation_notes:
  register: நவீன, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. காலையும் மாலையும் வழங்கப்பட்ட உணவை முழுமையாக மறுபடியும் சொல்லும் எபிரெய நடையும், தொடர்ச்சியான செயலின் உணர்வும் பேணப்பட்டுள்ளன.
