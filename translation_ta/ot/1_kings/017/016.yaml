  text: כַּ֤ד הַ/קֶּ֨מַח֙ לֹ֣א כָלָ֔תָה וְ/צַפַּ֥חַת הַ/שֶּׁ֖מֶן לֹ֣א חָסֵ֑ר כִּ/דְבַ֣ר יְהוָ֔ה אֲשֶׁ֥ר דִּבֶּ֖ר בְּ/יַ֥ד אֵלִיָּֽהוּ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/016.yaml
  text: The jar of flour was not used up[a], and the jug of oil did not run out, according to the word of Yahweh that he had spoken by the hand of Elijah.
translation:
  language: ta
  text: யாவே எலியாவின் வாயிலாக[a] உரைத்த வார்த்தையின்படி, பானையிலிருந்த மாவு தீர்ந்துபோகவில்லை; குடுவையிலிருந்த எண்ணெய் குறையவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில் சொல்லுக்குச் சொல்: “எலியாவின் கையால்”; இதன் பொருள் “எலியாவின் வாயிலாக.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּד הַקֶּמַח
  choice: பானையிலிருந்த மாவு
  rationale: כַּד என்பது வீட்டில் பொருள்களை வைத்திருக்கும் பானை; தமிழில் இயல்பாக இடவுறவை வெளிப்படுத்த ‘பானையிலிருந்த மாவு’ என மொழிபெயர்க்கப்பட்டது.
- source_word: לֹא כָלָתָה
  choice: தீர்ந்துபோகவில்லை
  rationale: כלה இச்சூழலில் முழுவதும் செலவாகி முடிவதைக் குறிக்கிறது; ‘தீர்ந்துபோகவில்லை’ என்பது தொடர்ந்த உணவளிப்பை இயல்பாகச் சொல்கிறது.
- source_word: צַפַּחַת הַשֶּׁמֶן
  choice: குடுவையிலிருந்த எண்ணெய்
  rationale: צַפַּחַת என்பது எண்ணெய் போன்ற திரவத்தை வைக்கும் சிறிய பாத்திரம்; மாவுப் பானையிலிருந்து வேறுபடுத்த ‘குடுவை’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: לֹא חָסֵר
  choice: குறையவில்லை
  rationale: חסר என்பது குறைவுபடுதல் அல்லது பற்றாக்குறையாகுதல் என்ற பொருளுடையது; எபிரெய வினையின் நுணுக்கத்தைப் பாதுகாக்க ‘குறையவில்லை’ பயன்படுத்தப்பட்டது.
- source_word: כִּדְבַר יְהוָה
  choice: யாவே உரைத்த வார்த்தையின்படியே
  rationale: כִּדְבַר என்பதன் ‘வார்த்தையின்படி’ என்ற நிறைவேற்ற உறவு காக்கப்படுகிறது; יהוה தனிப்பெயர் தமிழில் ‘யாவே’ என ஒலிபெயர்க்கப்படுகிறது.
- source_word: בְּיַד אֵלִיָּהוּ
  choice: எலியாவின் வாயிலாக
  rationale: ‘எலியாவின் கையால்’ என்ற எபிரெய மரபுத்தொடர் இங்கு தீர்க்கதரிசியின் வழியாகச் செய்தி உரைக்கப்பட்டதைக் குறிக்கிறது; நவீன தமிழில் தெளிவான ‘வாயிலாக’ முதன்மை உரையில் இடப்பட்டது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரை ஒரு பட்டத்தை அல்ல, நான்கெழுத்து இறைப் பெயரையே பயன்படுத்துகிறது; அதனால் தனிப்பெயர் ஒலிபெயர்க்கப்பட்டது.
- issue: தீர்க்கதரிசி வழியான உரையின் செயற்பாட்டு மரபுத்தொடர்
  choice: எலியாவின் வாயிலாக
  alternative: எலியாவின் கையால்
  rationale: வார்த்தையின் மூலமாக யாவேயையும், அதை எடுத்துரைத்த மனித முகவராக எலியாவையும் வேறுபடுத்திக் காட்டும் எபிரெய பொருள் பாதுகாக்கப்படுகிறது; சொல்லுக்குச் சொல் வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: வாக்குறுதியின் நிறைவேற்ற உறவு
  choice: வார்த்தையின்படியே இது நடந்தது
  alternative: வார்த்தையின்படி
  rationale: தமிழில் முழுமையான, இயல்பான வாக்கியமாக அமைய ‘இது நடந்தது’ வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது; இது மூலத்தின் பொருளை விளக்குகிறதே தவிர புதிய இறையியல் கருத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன செந்தமிழ் சார்ந்த, பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. ‘தீர்ந்துபோகவில்லை’ மற்றும் ‘குறையவில்லை’ என்பவை இணைநிலைச் சொற்றொடர்களாக இருந்தாலும், இரண்டு வேறு எபிரெய வினைகளின் நுணுக்கத்தைப் பாதுகாக்கின்றன.
