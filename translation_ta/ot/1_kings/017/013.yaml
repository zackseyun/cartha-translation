base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/013.yaml
  text: And Elijah said to her[a], “Do not fear. Go, do as you have said. But first make me a small cake from there and bring it out to me[b], and afterward make some for yourself and for your son.”
translation:
  language: ta
  text: அப்போது எலியா அவளிடம், “பயப்படாதே. போய், நீ சொன்னபடியே செய். ஆனால் முதலில் அதிலிருந்து எனக்காக ஒரு சிறிய அப்பம் செய்து, அதை என்னிடம் கொண்டுவா; அதன்பிறகு உனக்காகவும் உன் மகனுக்காகவும் அப்பம் செய்” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל תִּירְאִי
  choice: பயப்படாதே
  rationale: எதிர்மறைக் கட்டளையுடன் வரும் ירא அச்சப்பட வேண்டாம் என்பதைக் குறிக்கிறது; நவீன தமிழில் இயல்பாகவும் நேரடியாகவும் உள்ளது.
- source_word: בֹּאִי
  choice: போய்
  rationale: சொல்லாட்சியின்படி ‘வா’ என்றாலும், தொடரும் கட்டளைகளுடன் இங்கு செயலில் இறங்கும்படி தூண்டும் இடைமொழியாக உள்ளது; சூழலில் ‘போய்’ என்பது இயல்பான தமிழ்.
- source_word: עֲשִׂי כִדְבָרֵךְ
  choice: நீ சொன்னபடியே செய்
  rationale: அவள் முன்பு கூறிய திட்டத்தின்படி செயல்பட வேண்டும் என்ற பொருளை இயல்பாகப் பாதுகாக்கிறது.
- source_word: אַךְ
  choice: ஆனால்
  rationale: முந்தைய கட்டளைக்கு ஒரு வரையறையைச் சேர்க்கும் எதிர்மறைத் திருப்பத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: מִשָּׁם
  choice: அதிலிருந்து
  rationale: சூழலில் அவளிடம் மீதமுள்ள மாவு மற்றும் எண்ணெயைக் குறிக்கிறது; எபிரெயச் சொல்லின் ‘அங்கிருந்து/அதிலிருந்து’ என்ற தொடர்பையும் காக்கிறது.
- source_word: עֻגָה קְטַנָּה
  choice: ஒரு சிறிய அப்பம்
  rationale: עֻגָה என்பது சுடப்பட்ட சிறிய அப்பம் அல்லது தட்டையான அப்பத்தைக் குறிக்கலாம். தமிழில் ‘அப்பம்’ உணவுச் சூழலுக்கு இயல்பாக உள்ளது; வடிவத்தை தேவையின்றி குறிப்பாக்கவில்லை.
- source_word: בָרִאשֹׁנָה
  choice: முதலில்
  rationale: எலியாவுக்குரிய பங்கு மற்றவர்களுக்கான உணவுக்கு முன் தயாரிக்கப்பட வேண்டிய கால முன்னுரிமையை நேரடியாகக் காட்டுகிறது.
- source_word: וְהוֹצֵאתְ לִי
  choice: அதை என்னிடம் கொண்டுவா
  rationale: יצא என்பதன் ஹிஃபில் வடிவம் ‘வெளியே கொண்டுவரு’ என்ற நுணுக்கம் உடையது; தமிழில் இலக்கிடத்தைக் குறிக்கும் ‘என்னிடம் கொண்டுவா’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: וְלָךְ וְלִבְנֵךְ תַּעֲשִׂי
  choice: உனக்காகவும் உன் மகனுக்காகவும் செய்
  rationale: முந்தைய ‘அப்பம்’ என்ற செயப்படுபொருள் இங்கு மறைமுகமாகத் தொடர்கிறது; அதை மீண்டும் சேர்க்காமல் எபிரெய அமைப்பையும் இயல்பான தமிழையும் காக்கிறது.
- source_word: בָאַחֲרֹנָה
  choice: பிறகு
  rationale: முழுமையான இறுதிநிலையை அல்லாமல், அடுத்தடுத்த கால வரிசையை இங்கு குறிக்கிறது.
theological_decisions:
- issue: எலியாவுக்கு முதலில் உணவு அளிக்கும்படி கூறுவதால் எழக்கூடிய அறவியல் அல்லது இறையியல் பதற்றம்
  choice: கால முன்னுரிமையை மென்மைப்படுத்தாமல் ‘முதலில்’ என்றும், விதவைக்கும் அவள் மகனுக்கும் ‘பிறகு’ என்றும் நேரடியாக மொழிபெயர்த்தல்
  alternative: எலியாவின் கோரிக்கையின் வலிமையைக் குறைக்கும் விளக்கமொழிபெயர்ப்பு
  rationale: எபிரெய உரை எலியாவுக்கான சிறிய அப்பத்தை முதலில் செய்யவும், அதன் பிறகு அவளுக்கும் அவள் மகனுக்கும் செய்யவும் தெளிவாகக் கூறுகிறது. அந்தப் பதற்றத்தை மொழிபெயர்ப்பு விளக்கித் தீர்க்காமல் அப்படியே பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், மரியாதையும் எளிய புரிதலும் இணையும் நடை. பெண்ணிடம் ஒருமை நெருக்கக் கட்டளை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன; உரையாடலின் நேரடித்தன்மை காக்கப்பட்டுள்ளது.
