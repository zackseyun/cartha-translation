  text: And it shall be that you will drink from the brook[c][b][a], and I have commanded the ravens to provide for you there.
translation:
  language: ta
  text: நீ அந்த ஓடையிலிருந்து குடிப்பாய்[a]; அங்கே உன்னைப் பராமரிக்கும்படி அண்டங்காக்கைகளுக்குக் கட்டளையிட்டிருக்கிறேன்[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஓடை’ என்பதற்கு ‘காட்டாறு’ அல்லது ‘நீரோடை’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘உன்னைப் பராமரிக்கும்படி’ என்பதற்கு ‘உனக்கு உணவளிக்கும்படி’ அல்லது ‘உனக்குத் தேவையானதை வழங்கும்படி’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: ‘அண்டங்காக்கைகள்’ என்பதற்கு பொதுவாக ‘காக்கைகள்’ என்றும் கூறலாம். சிலர் இச்சொல்லுக்குப் பறவையல்லாத வேறு வாசிப்பை முன்வைத்துள்ளனர்; ஆனால் எபிரெயச் சொல்லின் வழக்கமான பொருளும் தொடர்ந்து வரும் சூழலும் பறவைகளையே ஆதரிக்கின்றன.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה
  choice: தமிழில் தனியாக மொழிபெயர்க்காமல், அடுத்துவரும் எதிர்கால வாக்கியத்தின் இயல்பான அமைப்பில் உட்பொருளாக்கப்பட்டது
  rationale: இங்கு வரும் எபிரெய முன்னுரை அடுத்த சூழ்நிலையை அறிமுகப்படுத்துகிறது. அதைச் சொற்குச் சொல் மொழிபெயர்த்தால் நவீனத் தமிழில் செயற்கையாக ஒலிக்கும்; எதிர்கால வினை வடிவம் அதன் கருத்தைத் தாங்குகிறது.
- source_word: מֵהַנַּחַל
  choice: அந்த ஓடையிலிருந்து
  rationale: נחל என்பது நீரோடை, காட்டாறு அல்லது பருவகால ஓடை எனப் பொருள்படலாம். இச்சூழலில் எளிதாகப் புரியும் ‘ஓடை’ பொருத்தமானது; சுட்டுக்குறியுடன் உள்ள பெயர்ச்சொல்லை ‘அந்த ஓடை’ என வழங்குகிறது.
- source_word: תִּשְׁתֶּה
  choice: நீ ... குடிப்பாய்
  rationale: இரண்டாம் நபர் ஆண்பால் ஒருமை எதிர்காலச் செயலைக் குறிக்கிறது; ‘குடிப்பாய்’ இயல்பான நேரடி தமிழ் வடிவம்.
- source_word: הָעֹרְבִים
  choice: காக்கைகள்
  rationale: எபிரெயச் சொல் பொதுவாக raven வகை பறவைகளைக் குறிக்கிறது. தமிழில் இயல்பாக அறியப்படும் corvid பெயரான ‘காக்கைகள்’ பயன்படுத்தப்படுகிறது; மாற்று பறவையல்லாத வாசிப்பு அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: צִוִּיתִי
  choice: கட்டளையிட்டிருக்கிறேன்
  rationale: முன்பே நிறைவேற்றப்பட்டு தற்போதும் விளைவுடைய ஏற்பாட்டை இந்த வடிவம் உணர்த்துகிறது.
- source_word: לְכַלְכֶּלְךָ
  choice: உனக்கு உணவளிக்கும்படி
  rationale: வினைச்சொல் தாங்குதல், பராமரித்தல், தேவையை வழங்குதல் ஆகிய பரந்த பொருள்களைக் கொண்டது. அடுத்த வசனத்தில் உணவு கொண்டுவரப்படுவதால் ‘உணவளிக்க’ இச்சூழலில் தெளிவாகவும் இயல்பாகவும் உள்ளது; பரந்த மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: שָׁם
  choice: அங்கே
  rationale: இடத்தைக் குறிக்கும் எளிய வினையடை; முந்தைய வசனத்தில் கூறப்பட்ட இடத்தை இயல்பாகச் சுட்டுகிறது.
theological_decisions:
- issue: கட்டளை பெற்றவற்றின் அடையாளம்
  choice: காக்கைகள் என்ற பறவைகளே தேவனால் கட்டளையிடப்பட்டன
  alternative: ஒரு இடப்பெயர் அல்லது மனிதக் குழு என்று வாசித்தல்
  rationale: הָעֹרְבִים என்பதன் வழக்கமான எபிரெயப் பொருள் பறவைகளாகிய ravens; தொடர்ந்து வரும் நிகழ்வில் அவை அப்பமும் இறைச்சியும் கொண்டுவருவது இதை ஆதரிக்கிறது. ஆகவே பறவையல்லாத விளக்கத்தை முதன்மை உரையில் ஏற்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதைமிக்க ஆனால் எளிதில் புரியும் நடையில் வடிவமைக்கப்பட்டது. எபிரெய முன்னுரையைச் சொற்குச் சொல் பின்பற்றாமல் இயல்பான தமிழ் எதிர்கால வாக்கியமாக வழங்கியுள்ளது. அடிக்குறி குறிகள் சம்பந்தப்பட்ட சொற்றொடர்களுக்குப் பின்னரே இடப்பட்டுள்ளன.
