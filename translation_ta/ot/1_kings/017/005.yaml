base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/005.yaml
  text: So he went and did according to the word of Yahweh[a], and he went and stayed by the Wadi Cherith[b], which is before the Jordan.
translation:
  language: ta
  text: அவர் சென்று, யாவேயின் வார்த்தையின்படியே செய்தார். அவர் சென்று, யோர்தானுக்கு எதிரே[b] உள்ள கேரீத் ஓடையோரம்[a] தங்கினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல் ஓடை, வறண்ட பள்ளத்தாக்கு (வாடி), அல்லது பருவகாலத்தில் மட்டும் நீர் பாயும் நீர்வழியைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்குச் சொல்: ‘யோர்தானுக்கு முன்பாக’ அல்லது ‘யோர்தானுக்கு எதிரே.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: அவர் போய்
  rationale: வாவ் தொடர்வினை கதைநிகழ்வை முன்னெடுக்கிறது. எபிரெய மூலத்தில் இச்சொல் இருமுறை வருவதால், அந்த மறுபயன்பாடு தமிழிலும் காக்கப்பட்டுள்ளது.
- source_word: וַיַּעַשׂ כִּדְבַר יְהוָה
  choice: யாவேயின் வார்த்தையின்படியே செய்தார்
  rationale: கடவுள் கூறிய கட்டளைக்குக் கீழ்ப்படிந்து நடந்தார் என்ற முறையான பொருளை இது இயல்பான தமிழில் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தலைப்புச் சொல்லால் மாற்றாமல், எபிரெய நான்கெழுத்துத் திருப்பெயரைத் தமிழில் ஒலிபெயர்த்து வழங்குகிறது.
- source_word: וַיֵּשֶׁב
  choice: தங்கினார்
  rationale: இச்சூழலில் ישב என்பது ஓர் இடத்தில் தற்காலிகமாகத் தங்கி இருப்பதைக் குறிக்கிறது; ‘குடியேறினார்’ என்பதைக் காட்டிலும் ‘தங்கினார்’ பொருத்தமானது.
- source_word: בְּנַחַל כְּרִית
  choice: கேரீத் ஓடையின் அருகே
  rationale: נחל என்பது ஓடை, பள்ளத்தாக்கு அல்லது பருவகால நீர்வழியைக் குறிக்கலாம். வாசிக்க இயல்பான ‘ஓடை’ முதன்மை உரையில் பயன்படுத்தப்பட்டு, சொல்லின் பரந்த பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: אֲשֶׁר עַל פְּנֵי הַיַּרְדֵּן
  choice: யோர்தானுக்கு எதிரே உள்ள
  rationale: עַל־פְּנֵי என்பதன் ‘முன்பாக/எதிரே’ என்ற இடவியல் நெகிழ்வைத் திசை நிர்ணயமின்றிக் காக்கிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘யோர்தானுக்குக் கிழக்கே’ என்பதை உரையில் சேர்க்கவில்லை.
- source_word: הַיַּרְדֵּן
  choice: யோர்தான்
  rationale: ஆற்றின் வழக்கமான தமிழ்ப் பெயர்; இங்கு ‘ஆறு’ என்று கூடுதலாகச் சேர்க்கத் தேவையில்லை.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரை இறைவனின் தனிப்பெயரான நான்கெழுத்துப் பெயரை நேரடியாகப் பயன்படுத்துகிறது. அதனை ஒரு பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்ப்பது மூல வேறுபாட்டைக் காக்கிறது.
- issue: עַל פְּנֵי הַיַּרְדֵּן என்பதன் இடவியல் பொருள்
  choice: யோர்தானுக்கு எதிரே
  alternative: யோர்தானுக்குக் கிழக்கே
  rationale: ‘கிழக்கே’ என்பது சாத்தியமான புவியியல் விளக்கம் என்றாலும், அந்தத் திசை மூலச்சொற்றொடரில் வெளிப்படையாக இல்லை. ஆகவே அதன் உண்மையான இடவியல் நெகிழ்வு காக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. எபிரெய உரையிலுள்ள ‘அவர் போய்’ என்ற மறுபயன்பாடு கதைநடையின் அமைப்பைக் காக்கத் திட்டமிட்டு விடப்பட்டுள்ளது. அடிக்குறி [a] ‘ஓடை’ என்பதற்கும் [b] இடவியல் சொற்றொடருக்கும் நேரடியாக இணைக்கப்பட்டுள்ளன.
