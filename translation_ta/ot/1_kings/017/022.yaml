id: 1KI.17.22
reference: 1 Kings 17:22
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֥ע יְהוָ֖ה בְּ/ק֣וֹל אֵלִיָּ֑הוּ וַ/תָּ֧שָׁב נֶֽפֶשׁ הַ/יֶּ֛לֶד עַל קִרְבּ֖/וֹ וַ/יֶּֽחִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/022.yaml
  text: And Yahweh listened to the voice of Elijah[a], and the life of the child returned to his inner being, and he lived.
translation:
  language: ta
  text: யாவே எலியாவின் குரலுக்குச் செவிகொடுத்தார். குழந்தையின் உயிர்[a] அவனுக்குள் திரும்பியது; அவன் உயிர்பெற்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “குழந்தையின் ஆத்துமா அவனுக்குள் திரும்பியது.” எபிரெயச் சொல்லான נֶפֶשׁ (நெஃபெஷ்), சூழலுக்கேற்ப “உயிர்,” “ஆத்துமா,” அல்லது “தன்னையே” என்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: செவிகொடுத்தார்
  rationale: இங்கு שׁמע என்பது வெறுமனே கேட்டதைக் காட்டாமல், எலியாவின் வேண்டுதலை ஏற்று அதற்குப் பதிலளித்ததையும் குறிக்கிறது. ‘செவிகொடுத்தார்’ என்பது அந்தப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்திலுள்ள தேவனுடைய தனிப்பெயரான יהוה-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் ஒலிபெயர்த்திருக்கிறது.
- source_word: בְּקוֹל אֵלִיָּהוּ
  choice: எலியாவின் குரலுக்கு
  rationale: மூலத்தின் ‘எலியாவின் குரலுக்கு’ என்ற நேரடியான உருவகத்தைப் பாதுகாக்கிறது; ‘ஜெபத்திற்கு’ அல்லது ‘வேண்டுதலுக்கு’ என்று விளக்கி விரிவுபடுத்தவில்லை.
- source_word: נֶפֶשׁ
  choice: உயிர்
  rationale: இறந்த குழந்தை மீண்டும் உயிர்பெறும் இச்சூழலில் נֶפֶשׁ என்பது உயிரைக் குறிப்பது இயல்பானது. ‘ஆத்துமா’ என்ற சாத்தியமான பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: עַל קִרְבּוֹ
  choice: அவனுக்குள்
  rationale: קֶרֶב குறிக்கும் உட்புறம் அல்லது அகப்பகுதி என்ற கருத்தை, தமிழில் இயல்பாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: וַיֶּחִי
  choice: அவன் உயிர்பெற்றான்
  rationale: குழந்தை மீண்டும் வாழத் தொடங்கியதைக் குறிக்கும் எபிரெய வினையின் முடிவைத் தெளிவான நவீன தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: உயிர்த்தெழுதல் சூழலில் נֶפֶשׁ என்பதன் மொழிபெயர்ப்பு
  choice: உயிர்
  alternative: ஆத்துமா
  rationale: இவ்வசனத்தின் உடனடி கருத்து குழந்தையின் உயிர் மீட்கப்பட்டதே. ‘உயிர்’ என்பது குறிப்பிட்ட ஒரு மனித இயல்பியல் கோட்பாட்டை உரைக்குள் திணிக்காமல் அந்த நிகழ்வைத் தெரிவிக்கிறது. அதேவேளையில், ‘ஆத்துமா’ என்பது சொல்லியல் ரீதியாகச் சாத்தியமான பாரம்பரிய மொழிபெயர்ப்பு என்பதால் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் கண்ணியமும் கொண்ட எளிய நடை பயன்படுத்தப்பட்டுள்ளது. ‘செவிகொடுத்தார்’ என்பது ஜெபத்திற்கான சாதகமான பதிலை இயல்பாக உணர்த்துகிறது; ‘அவனுக்குள்’ என்பது எபிரெயச் சொல்லின் அகப்பகுதி என்ற கருத்தைத் தேவையற்ற உடற்கூறு மொழியின்றி வழங்குகிறது.
