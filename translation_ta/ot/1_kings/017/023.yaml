source:
  edition: WLC
  text: וַ/יִּקַּ֨ח אֵלִיָּ֜הוּ אֶת הַ/יֶּ֗לֶד וַ/יֹּרִדֵ֤/הוּ מִן הָ/עֲלִיָּה֙ הַ/בַּ֔יְתָ/ה וַֽ/יִּתְּנֵ֖/הוּ לְ/אִמּ֑/וֹ וַ/יֹּ֨אמֶר֙ אֵ֣לִיָּ֔הוּ רְאִ֖י חַ֥י בְּנֵֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/023.yaml
  text: Then Elijah took the boy[a], brought him down from the upper room into the house, and gave him to his mother. And Elijah said, “See, your son is alive.”
translation:
  language: ta
  text: பிறகு எலியா அந்தச் சிறுவனை எடுத்து, மேலறையிலிருந்து வீட்டுக்குள் இறக்கிக் கொண்டுவந்து, அவனுடைய தாயிடம் கொடுத்தார். எலியா அவளிடம், “பார், உன் மகன் உயிரோடு இருக்கிறான்[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் மகன் வாழ்கிறான்.”
    reason: חַי என்ற நிலைப்பொருளைத் தமிழில் ‘உயிரோடு இருக்கிறான்’ என்றும் ‘வாழ்கிறான்’ என்றும் இயல்பாக மொழிபெயர்க்கலாம்.
lexical_decisions:
- source_word: וַיִּקַּח
  choice: எடுத்து
  rationale: לקח என்பதன் இயல்பான கதைநடைப் பொருளான ‘எடுத்தல்’ என்பதைக் காட்டுகிறது; தூக்கிச் சென்ற விதத்தைத் தேவையின்றி குறிப்பிடவில்லை.
- source_word: הַיֶּלֶד
  choice: அந்தச் சிறுவனை
  rationale: יֶלֶד என்பது குழந்தை அல்லது சிறுவன் எனப் பொருள்படலாம். இச்சூழலில் ‘சிறுவன்’ இயல்பாக உள்ளது; வயதை அளவுக்கு மீறித் துல்லியப்படுத்துவதில்லை.
- source_word: וַיֹּרִדֵהוּ
  choice: இறக்கிக் கொண்டுவந்து
  rationale: இது ירד என்பதன் காரணவினை வடிவம்; மேலறையிலிருந்து கீழே கொண்டுவந்த இயக்கத்தைத் தெளிவாகக் காட்டுகிறது, ஆனால் எப்படிச் சுமந்தார் என்பதைச் சேர்க்கவில்லை.
- source_word: הָעֲלִיָּה
  choice: மேலறை
  rationale: עֲלִיָּה என்பது வீட்டின் மேல்தளத்திலுள்ள அறை அல்லது மேல் அறையைக் குறிக்கிறது; ‘மேலறை’ சுருக்கமான, தெளிவான நவீனத் தமிழ்.
- source_word: הַבַּיְתָה
  choice: வீட்டுக்குள்
  rationale: இடத்தை நோக்கிய இயக்கத்தைக் காட்டும் -ה முடிவை ‘வீட்டுக்குள்’ என்பது இயல்பாகப் பிரதிபலிக்கிறது.
- source_word: וַיִּתְּנֵהוּ לְאִמּוֹ
  choice: அவனுடைய தாயிடம் கொடுத்தார்
  rationale: נתן என்பதன் நேரான பொருளான ‘கொடுத்தார்’ என்பதையே வைத்துள்ளது; சூழலில் மீண்டும் ஒப்படைத்தல் மறைமுகமாக இருந்தாலும், ‘திருப்பிக் கொடுத்தார்’ என்று விரிவாக்கவில்லை.
- source_word: רְאִי
  choice: பார்
  rationale: தாயை நோக்கிச் சொல்லப்பட்ட நேரடி ஒருமை ஏவலை இயல்பான தமிழில் காட்டுகிறது. எபிரெயத்தில் உள்ள பெண்பால் குறியீட்டைத் தமிழில் தனியாகக் காட்ட இயலாது.
- source_word: חַי בְּנֵךְ
  choice: உன் மகன் உயிரோடு இருக்கிறான்
  rationale: மகன் உயிருள்ள நிலையில் இருப்பதை நேரடியாகவும் நாடகத் தாக்கத்துடனும் தெரிவிக்கிறது; ‘மீண்டும் உயிர்பெற்றான்’ என்ற விளக்கத்தை மூலத்தில் இல்லாமல் சேர்க்கவில்லை.
theological_decisions:
- issue: உயிர்த்தெழுதல் அற்புதத்தை எந்த அளவு வெளிப்படையாகக் கூறுவது
  choice: “உன் மகன் உயிரோடு இருக்கிறான்” என்று மூலவாக்கியத்தின் எளிய உறுதிப்பாட்டைப் பேணுதல்
  alternative: “உன் மகன் மீண்டும் உயிர்பெற்றான்”
  rationale: சூழல் அற்புதத்தைத் தெளிவாக்கினாலும், எபிரெய உரை மகன் உயிரோடு இருப்பதையே நேரடியாகச் சொல்கிறது. ‘மீண்டும்’ அல்லது ‘உயிர்ப்பிக்கப்பட்டான்’ என்று சேர்ப்பது மூலத்தைவிட அதிகமான விளக்கமாகிவிடும்.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. மரியாதை வினைமுற்றுகள் எலியாவைக் குறிக்கின்றன; நேரடி உரை தாயிடம் சொல்லப்பட்டதற்கேற்ற எளிய வடிவில் உள்ளது.
