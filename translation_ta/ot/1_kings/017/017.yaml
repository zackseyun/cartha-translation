source:
  edition: WLC
  text: וַ/יְהִ֗י אַחַר֙ הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה חָלָ֕ה בֶּן הָ/אִשָּׁ֖ה בַּעֲלַ֣ת הַ/בָּ֑יִת וַ/יְהִ֤י חָלְי/וֹ֙ חָזָ֣ק מְאֹ֔ד עַ֛ד אֲשֶׁ֥ר לֹא נֽוֹתְרָה בּ֖/וֹ נְשָׁמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/017.yaml
  text: After these things[a], the son of the woman who owned the house became sick, and his illness became very severe, until no breath was left in him.
translation:
  language: ta
  text: இவற்றுக்குப் பிறகு, அந்த வீட்டின் உரிமையாளரான பெண்ணின் மகன் நோயுற்றான். அவனுக்குள் மூச்சே மீந்திருக்காத அளவுக்கு அவனுடைய நோய் மிகவும் கடுமையாகியது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனுக்குள் உயிர் எதுவும் மீந்திருக்கவில்லை.” எபிரெய மொழியில் சொல்லுக்கு சொல், “அவனுக்குள் மூச்சு எதுவும் மீந்திருக்கவில்லை.”
    reason: נְשָׁמָה என்பது நேரடியாக ‘மூச்சு’ என்றும், இச்சூழலில் ‘உயிர்’ என்றும் புரிந்துகொள்ளப்படக்கூடிய சொல்லாதலால் மாற்றுப் பொருள் தரப்படுகிறது.
lexical_decisions:
- source_word: וַיְהִי אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: இவற்றுக்குப் பிறகு
  rationale: எபிரெயக் கதைநடையின் காலமாற்றச் சூத்திரத்தையும் הַדְּבָרִים என்பதன் பன்மையையும் இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: חָלָה
  choice: நோயுற்றான்
  rationale: நோய்வாய்ப்படும் நிகழ்வைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது; வெறும் நிலையை மட்டும் குறிப்பிடுவதில்லை.
- source_word: בֶּן הָאִשָּׁה בַּעֲלַת הַבָּיִת
  choice: அந்த வீட்டின் உரிமையாளரான பெண்ணின் மகன்
  rationale: בַּעֲלַת הַבָּיִת என்பதிலுள்ள வீட்டின் பெண் உரிமையாளர் அல்லது தலைவி என்ற பொருளை, பழமையான சொல்லாட்சியின்றித் தெளிவாகக் கூறுகிறது.
- source_word: וַיְהִי חָלְיוֹ חָזָק מְאֹד
  choice: அவனுடைய நோய் மிகவும் கடுமையாகியது
  rationale: நோயின் தீவிரம் அதிகரித்ததைத் தமிழில் இயல்பாக வெளிப்படுத்தி, חָזָק מְאֹד என்பதன் மிகுதியையும் காக்கிறது.
- source_word: עַד אֲשֶׁר לֹא נוֹתְרָה בוֹ נְשָׁמָה
  choice: அவனுக்குள் மூச்சே மீந்திருக்காத அளவுக்கு
  rationale: נְשָׁמָה என்பதன் அடிப்படைப் பொருளான ‘மூச்சு’ என்பதைத் தக்கவைத்து, அந்த நிலை நோயின் உச்சத்தைக் குறிக்கிறது என்பதைத் தமிழ் வாக்கிய அமைப்பில் இயல்பாக இணைக்கிறது.
theological_decisions:
- issue: இறுதி சொற்றொடரை நேரடியாக மரணம் என்று மொழிபெயர்ப்பதா, அல்லது எபிரெய உருவகச் சொல்லாட்சியைத் தக்கவைப்பதா
  choice: ‘மூச்சே மீந்திருக்காத’ என்ற மூலச் சொல்லாட்சியைத் தக்கவைத்தல்
  alternative: ‘அவன் இறந்துபோனான்’ அல்லது ‘அவனுக்குள் உயிர் எதுவும் மீந்திருக்கவில்லை’
  rationale: மூலம் நְשָׁמָה, ‘மூச்சு’, எதுவும் மீந்திருக்கவில்லை என்றே கூறுகிறது. மரணம் நிகழ்ந்தது என்ற கருத்து சூழலில் வலுவாக இருந்தாலும், மூலத்தின் தனிப்பட்ட சொல்லாட்சியை நேரடியாக ‘இறந்தான்’ என்று தீர்மானித்து விரிவுபடுத்தாமல் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குத் தெளிவாகவும் வேதாகமக் கதைநடைக்கு ஏற்ற கண்ணியமான தொனியுடனும் அமைக்கப்பட்டுள்ளது. மூலத்தின் இறப்பைக் குறிக்கும் மறைமுகச் சொல்லாட்சி விளக்கித் தீர்க்கப்படாமல் காக்கப்பட்டுள்ளது.
