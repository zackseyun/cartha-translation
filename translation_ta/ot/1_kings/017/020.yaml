  text: וַ/יִּקְרָ֥א אֶל יְהוָ֖ה וַ/יֹּאמַ֑ר יְהוָ֣ה אֱלֹהָ֔/י הֲ֠/גַם עַל הָ/אַלְמָנָ֞ה אֲשֶׁר אֲנִ֨י מִתְגּוֹרֵ֥ר עִמָּ֛/הּ הֲרֵע֖וֹתָ לְ/הָמִ֥ית אֶת בְּנָֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/020.yaml
  text: Then he cried out to Yahweh and said[a], “O Yahweh my God, have you also brought harm on the widow with whom I am staying[b], by causing her son to die?”
translation:
  language: ta
  text: பின்பு அவர் யாவேயை நோக்கிக் கூக்குரலிட்டு, “யாவே, என் கடவுளே, நான் விருந்தினனாகத் தங்கியிருக்கும் அந்த விதவையின் மகனை இறக்கச் செய்வதன் மூலம், அவளுக்கும் தீங்கு விளைவித்தீரா?” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא אֶל יְהוָה
  choice: யாவேயை நோக்கிக் கூக்குரலிட்டு
  rationale: வேண்டுதல் சூழலில் קרא ஒரு சாதாரண அழைப்பை விட அவசரமும் வேதனையும் நிறைந்த முறையீட்டைக் குறிக்கிறது; ‘கூக்குரலிட்டு’ அந்த உணர்வை இயல்பான தமிழில் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான יהוה என்பதை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் அறியப்பட்ட ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: יְהוָה אֱלֹהָי
  choice: யாவே, என் கடவுளே
  rationale: தெய்வீகப் பெயரையும் முதலாம் நபர் உரிமைப்பொருளுடன் உள்ள நேரடி விளியையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: הֲגַם
  choice: அவளுக்கும் ... செய்தீரா?
  rationale: வினாவுடன் சேர்ந்துள்ள ‘மேலும்/கூட’ என்ற அதிர்ச்சிமிக்க சேர்க்கைப் பொருளை ‘அவளுக்கும்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מִתְגּוֹרֵר עִמָּהּ
  choice: நான் யாரிடம் விருந்தினனாகத் தங்கியிருக்கிறேனோ
  rationale: גור என்பதன் ஹித்பயேல் வடிவம் நிரந்தரக் குடியிருப்பை விட அந்நியர், விருந்தினர் அல்லது சார்ந்திருப்பவர் போல் தங்குவதை உணர்த்துகிறது.
- source_word: הֲרֵעוֹתָ
  choice: தீங்கு வரச் செய்தீரா
  rationale: רעע என்பதன் ஹிஃபீல் வடிவம் இங்கு தார்மீகத் தீமையைச் செய்தல் என்று கட்டாயமாகக் குறிக்காமல், தீங்கு அல்லது பேரிடரை ஏற்படுத்துதல் என்றும் பொருள்படலாம்; காரணவினைத் தன்மையும் காக்கப்படுகிறது.
- source_word: לְהָמִית אֶת בְּנָהּ
  choice: அவளின் மகனைச் சாகச் செய்ததன் மூலம்
  rationale: இறப்பை ஏற்படுத்திய செயலை எபிரெய உரை நேரடியாகக் கடவுளோடு தொடர்புபடுத்துகிறது; ‘கொன்றீர்’ என்று மேலும் கூர்மையாக்காமலும், ‘சாக அனுமதித்தீர்’ என்று காரணத்தைக் குறைக்காமலும் மொழிபெயர்க்கிறது.
theological_decisions:
- issue: எலியாவின் முறையீடு கடவுள் தார்மீகத் தீமை செய்ததாகக் குற்றஞ்சாட்டுகிறதா, அல்லது அவர் தீங்கைக் கொண்டுவந்ததாகக் கூறுகிறதா?
  choice: ‘தீங்கு வரச் செய்தீரா’ என்று மொழிபெயர்த்து, இறப்புக்கான தெய்வீகக் காரணத்தைத் தொடர்ந்து வைத்தல்
  alternative: ‘விதவைக்குத் தீமை செய்தீரா, அவளின் மகனைக் கொன்றதன் மூலம்?’
  rationale: הֲרֵעוֹתָ தார்மீகத் தீமையையும் தீங்கு அல்லது பேரிடரையும் குறிக்கக்கூடியது. தேர்ந்த மொழிபெயர்ப்பு எலியாவின் துணிவான கேள்வியையும் கடவுளின் செயற்பாட்டை நோக்கிய பதற்றத்தையும் மறைக்காமல், எபிரெயம் கட்டாயப்படுத்தாத தார்மீகத் தீர்ப்பைச் சேர்ப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், வேண்டுதலுக்குரிய கண்ணியமான நேரடி விளியுடன் மொழிபெயர்க்கப்பட்டது. ‘விருந்தினனாகத் தங்கியிருக்கிறேன்’ என்பது மூலத்தின் தற்காலிக அல்லது சார்பு வசிப்பை வெளிப்படுத்துகிறது; ‘தீங்கு வரச் செய்தீர்’ என்பது மூலத்தின் காரணவினைத் தன்மையையும் இறையியல் பதற்றத்தையும் பாதுகாக்கிறது.
