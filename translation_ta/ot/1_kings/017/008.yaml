  text: וַ/יְהִ֥י דְבַר יְהוָ֖ה אֵלָ֥י/ו לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/008.yaml
  text: Then the word of Yahweh came to him[a], saying,
translation:
  language: ta
  text: 'பின்பு யாவேயின் வார்த்தை அவனுக்கு வந்தது:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: பின்பு ... வந்தது
  rationale: தொடர்ந்து நிகழும் அடுத்த சம்பவத்தை இயல்பான நவீனத் தமிழில் காட்டுகிறது; பழமையான ‘சம்பவித்ததாவது’ போன்ற வடிவத்தைத் தவிர்க்கிறது.
- source_word: דְבַר
  choice: வார்த்தை
  rationale: דְבַר יְהוָה என்ற தீர்க்கதரிசன அறிவிப்பு மரபுத்தொடரின் பொருளையும் இறையியல் நிறையையும் காக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: எபிரெய மூலத்தில் உள்ள தேவனுடைய தனிப்பெயரை ஒரு பொதுப் பட்டமாக மாற்றாமல் தமிழில் பரவலாக அறியப்பட்ட ஒலிபெயர்ப்பால் வழங்குகிறது.
- source_word: אֵלָיו
  choice: அவனிடம்
  rationale: மூன்றாம் நபர் ஆண்பால் ஒருமைச் சுட்டைத் தெளிவாகவும் இயல்பாகவும் மொழிபெயர்க்கிறது.
- source_word: לֵאמֹר
  choice: 'வந்தது:'
  rationale: அடுத்து வரும் நேரடிக் கூற்றைத் தமிழில் இயல்பாக அறிமுகப்படுத்த இரட்டைப்புள்ளி பயன்படுத்தப்படுகிறது; ‘சொல்லி’ எனத் தனியாகச் சேர்ப்பது தமிழில் தேவையற்ற மீளுரைப்பாக அமையும்.
theological_decisions:
- issue: יְהוָה என்ற தேவனுடைய பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக உள்ளது. ‘கர்த்தர்’ என்ற பட்டத்தைப் பதிலிடாமல் பெயரின் தன்மையைப் பாதுகாக்கிறது; ‘யெகோவா’ நவீனத் தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்பட்ட வடிவம்.
translation_notes:
  register: நவீன நிலையான தமிழில் சுருக்கமான, கண்ணியமான கதைநடை. அடுத்த வசனத்தில் தொடங்கும் நேரடிப் பேச்சை இரட்டைப்புள்ளி இயல்பாக இணைக்கிறது.
