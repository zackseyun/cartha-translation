source:
  edition: WLC
  text: ק֣וּם לֵ֤ךְ צָרְפַ֨תָ/ה֙ אֲשֶׁ֣ר לְ/צִיד֔וֹן וְ/יָשַׁבְתָּ֖ שָׁ֑ם הִנֵּ֨ה צִוִּ֥יתִי שָׁ֛ם אִשָּׁ֥ה אַלְמָנָ֖ה לְ/כַלְכְּלֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/009.yaml
  text: Get up[a], go to Zarephath, which belongs to Sidon, and stay there. Look[b], I have commanded a widow there to provide for you.
translation:
  language: ta
  text: “எழுந்து, சீதோனைச் சேர்ந்த சாரிபாத்துக்குப் போய்[a], அங்கே தங்கியிரு. இதோ, அங்கே ஒரு விதவைக்கு உன்னைப் பராமரிக்கும்படி நான் கட்டளையிட்டிருக்கிறேன்[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சீதோனில் உள்ள சாரிபாத்’ அல்லது ‘சீதோனுக்கு அருகிலுள்ள சாரிபாத்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயம் சாரிபாத்தை சீதோனுடன் தொடர்புபடுத்துகிறது; இது பிராந்திய அல்லது அரசியல் தொடர்பைக் குறிக்க வாய்ப்புள்ளது.
    reason: lexical_alternative
  - marker: b
    text: ‘அங்கே ஒரு விதவையை உன்னைப் பராமரிக்க நியமித்திருக்கிறேன்’ என்றும் புரிந்துகொள்ளலாம். எபிரெயம் நேரடியாக ‘கட்டளையிட்டிருக்கிறேன்’ என்று கூறுகிறது; அந்த விதவை இதை ஏற்கெனவே உணர்ந்திருந்ததாகக் கதை காட்டாவிட்டாலும், இது கடவுளின் ஆளுகையுள்ள வழிநடத்துதலைக் குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ק֣וּם
  choice: எழுந்து
  rationale: קום என்பதன் கட்டளை வடிவம் எழுதல் அல்லது எழுந்து நிற்றல் என்பதைக் குறிக்கிறது. அடுத்த கட்டளையுடன் இயல்பாக இணையும் நவீனத் தமிழ் வடிவம்.
- source_word: לֵ֤ךְ
  choice: போய்
  rationale: הלך என்பதன் கட்டளை வடிவம் இங்கு ஓர் இடத்துக்குச் செல்லும்படி கூறுகிறது. தொடர்ச்சியான தமிழ் கட்டளை வாக்கியத்தில் ‘போய்’ இயல்பாக அமைகிறது.
- source_word: צָרְפַתָ/ה֙
  choice: சாறிபாத்துக்கு
  rationale: இடப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது; திசைநோக்குப் பொருளை எபிரெய இறுதி -ה காட்டுவதால் ‘-க்கு’ சேர்க்கப்பட்டுள்ளது.
- source_word: אֲשֶׁ֣ר לְ/צִיד֔וֹן
  choice: சீதோனைச் சேர்ந்த
  rationale: לְ என்ற முன்னிடைச்சொல் சீதோனுடன் உள்ள பிராந்திய அல்லது அரசியல் தொடர்பைக் குறிக்கலாம். அந்த உறவைத் தீர்மானமாகக் குறுக்காமல் ‘சேர்ந்த’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְ/יָשַׁבְתָּ֖ שָׁ֑ם
  choice: அங்கே தங்கியிரு
  rationale: முந்தைய கட்டளைகளைத் தொடர்ந்து கட்டளைப் பொருளில் வரும் வடிவம். இங்கு சில காலம் வசிப்பதைக் குறிக்கும் இயல்பான நவீனத் தமிழ்.
- source_word: הִנֵּ֨ה
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் எபிரெயச் சுட்டிடைச்சொல்லின் உரையாடல் செயல்பாட்டைத் தக்கவைக்கிறது.
- source_word: צִוִּ֥יתִי
  choice: நான் கட்டளையிட்டிருக்கிறேன்
  rationale: צוה என்பதன் பியேல் வடிவத்தின் நேரடிப் பொருள் ‘கட்டளையிடுதல்.’ விதவை முன்பே இதை உணர்ந்திருந்தாளா என்ற கேள்வியை மொழிபெயர்ப்பு தீர்க்காமல் விடுகிறது.
- source_word: אִשָּׁ֥ה אַלְמָנָ֖ה
  choice: ஒரு விதவையிடம்
  rationale: ‘ஒரு பெண், ஒரு விதவை’ என்ற எபிரெய இணைப்பை பொருள் இழப்பின்றி இயல்பான தமிழில் ‘ஒரு விதவை’ என வழங்குகிறது; கட்டளையின் பெறுநரைக் காட்ட ‘-யிடம்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: לְ/כַלְכְּלֶֽ/ךָ
  choice: உன்னைப் பராமரிக்கும்படி
  rationale: כלכל உணவளிப்பது உட்பட ஒருவரைத் தொடர்ந்து பேணுதல் அல்லது தேவைகளை வழங்குதல் என்ற பரந்த பொருளைக் கொண்டது. ‘பராமரிக்க’ அந்தப் பரப்பைத் தக்கவைக்கிறது.
theological_decisions:
- issue: விதவைக்குக் கடவுள் ‘கட்டளையிட்டேன்’ என்று கூறுவதன் பொருள்
  choice: ‘நான் கட்டளையிட்டிருக்கிறேன்’ என்ற நேரடி சொல்லாட்சியைத் தக்கவைத்தல்
  alternative: ‘ஒரு விதவையை ஏற்பாடு செய்திருக்கிறேன்’ அல்லது ‘நியமித்திருக்கிறேன்’
  rationale: எபிரெய צוה பொதுவாக ‘கட்டளையிடு’ என்பதே. அடுத்த நிகழ்வில் விதவை முன்கூட்டியே அந்தக் கட்டளையை அறிந்ததாகத் தெளிவாகக் காட்டப்படாதபோதிலும், அதை ‘நியமித்தேன்’ என்று மென்மையாக்காமல் மூல உரையின் இறையியல் பதற்றம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. தொடர்ச்சியான கட்டளைகள் இயல்பான தமிழுக்காக வினையெச்சம் மற்றும் கட்டளை வடிவத்தில் இணைக்கப்பட்டுள்ளன. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்றொடர்களுக்குப் பின்னரே வைக்கப்பட்டுள்ளன.
