  text: So she went and did according to the word of Elijah[a], and she ate—he and she and her household—for many days.
translation:
  language: ta
  text: அவள் போய், எலியாவின் வார்த்தையின்படி செய்தாள். அவள் உண்டாள்—அவனும் அவளும் அவளுடைய வீட்டாரும்—பல நாட்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொல்லுக்கு நெருக்கமாக, “அவள் உண்டாள்—அவனும் அவளும் அவளுடைய வீட்டாரும்—நாட்கள்.” எபிரெயத்தில் ஒருமை வினைச்சொல்லைத் தொடர்ந்து உண்டவர்கள் வெளிப்படையாகப் பட்டியலிடப்படுகிறார்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶךְ
  choice: அவள் போய்
  rationale: வழக்கமான எபிரெயக் கதைத் தொடரை இயல்பான தமிழில் அடுத்த செயலை நோக்கி நகர்த்துகிறது.
- source_word: וַתַּעֲשֶׂה
  choice: செய்தாள்
  rationale: עשה இங்கு எலியாவின் அறிவுறுத்தலை நிறைவேற்றுவதைக் குறிக்கிறது; குறிப்பாக ஒன்றை உருவாக்கினாள் என்ற குறுகிய பொருள் அல்ல.
- source_word: כִּדְבַר אֵלִיָּהוּ
  choice: எலியாவின் வார்த்தையின்படி
  rationale: דבר இங்கு எலியா சொன்ன அறிவுறுத்தல் அல்லது கட்டளையைக் குறிக்கிறது; இந்த வடிவம் மூலத்தின் அமைப்பையும் தமிழின் தெளிவையும் காக்கிறது.
- source_word: וַתֹּאכַל
  choice: அவள் உண்டாள்
  rationale: வினைச்சொல் மூன்றாம் நபர் பெண்பால் ஒருமையில் உள்ளது. அதற்குப் பின் உண்பவர்களின் பட்டியல் வந்தாலும், மூலத்தின் குறிப்பிடத்தக்க ஒருமை அமைப்பு பாதுகாக்கப்படுகிறது.
- source_word: הוא וְהִיא וּבֵיתָהּ
  choice: அவனும் அவளும் அவளுடைய வீட்டாரும்
  rationale: மூலத்தின் வரிசை காக்கப்படுகிறது. சூழலில் ‘அவன்’ என்பது எலியாவைக் குறிக்கிறது; בַּיִת இங்கு கட்டிடத்தைவிட குடும்பம் அல்லது வீட்டைச் சேர்ந்தவர்களைக் குறிக்கிறது.
- source_word: יָמִים
  choice: பல நாட்கள்
  rationale: காலநீட்சியைக் குறிக்கும் பன்மைச் சொல்; நவீன தமிழில் இயல்பாகவும் பொருளுக்கேற்றவாறும் ‘பல நாட்கள்’ என வழங்கப்படுகிறது.
