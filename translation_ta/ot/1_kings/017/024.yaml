  text: וַ/תֹּ֤אמֶר הָֽ/אִשָּׁה֙ אֶל אֵ֣לִיָּ֔הוּ עַתָּה֙ זֶ֣ה יָדַ֔עְתִּי כִּ֛י אִ֥ישׁ אֱלֹהִ֖ים אָ֑תָּה וּ/דְבַר יְהוָ֥ה בְּ/פִ֖י/ךָ אֱמֶֽת־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/024.yaml
  text: Then the woman said to Elijah[a], “Now I know that you are a man of God, and that the word of Yahweh in your mouth is truth.”
translation:
  language: ta
  text: அப்போது அந்தப் பெண் எலியாவிடம், “நீர் தேவனுடைய மனிதர் என்பதையும், உமது வாயில் இருக்கும் யாவேயின் வார்த்தை உண்மையானது[a] என்பதையும் இப்போது எனக்குத் தெரிகிறது” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உண்மை” அல்லது “நம்பகமானது.” எபிரெயப் பெயர்ச்சொல் உண்மை, உண்மைத்தன்மை, அல்லது நம்பகத்தன்மையைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר הָאִשָּׁה
  choice: அப்போது அந்தப் பெண் ... என்றாள்
  rationale: வாவ் தொடர் கதையை அடுத்த நிகழ்வுக்கு நகர்த்துவதால் ‘அப்போது’ இயல்பான தமிழ்க் கதைநடையைத் தருகிறது; הָאִשָּׁה என்பதன் நேரடிப் பொருளான ‘அந்தப் பெண்’ என்பதே பயன்படுத்தப்பட்டது.
- source_word: עַתָּה זֶה יָדַעְתִּי
  choice: இப்போது அறிந்துகொண்டேன்
  rationale: சமீப நிகழ்வின் விளைவாக ஏற்பட்ட தற்போதைய உறுதியான உணர்தலை இச்சொற்றொடர் வலியுறுத்துகிறது.
- source_word: אִישׁ אֱלֹהִים
  choice: கடவுளின் மனிதர்
  rationale: இது தீர்க்கதரிசி அல்லது கடவுளுக்குரியவர் என்பதைக் குறிக்கும் நிலையான எபிரெயச் சொற்றொடர்; அதன் உருவகத்தையும் மரியாதையையும் தமிழ் மொழிபெயர்ப்பு காக்கிறது.
- source_word: וּדְבַר יְהוָה
  choice: யாவேயின் வார்த்தை
  rationale: דבר என்பதன் ‘வார்த்தை/செய்தி’ பொருள்களில், தீர்க்கதரிசனச் சொற்றொடரின் ஒலியையும் இறையியல் செறிவையும் ‘வார்த்தை’ காக்கிறது; יהוה உடன்படிக்கைப் பெயராக ‘யாவே’ என ஒலிபெயர்க்கப்பட்டது.
- source_word: בְּפִיךָ
  choice: உமது வாயிலுள்ள
  rationale: தீர்க்கதரிசியின் வாயில் உரைக்கப்படும் இறைவார்த்தை என்ற எபிரெயப் படிமத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: אֱמֶת
  choice: உண்மை
  rationale: பெயர்ச்சொல் வடிவத்தைப் பாதுகாத்து, உண்மை, உண்மைத்தன்மை, நம்பகத்தன்மை ஆகிய பொருள் நிழல்களுக்கு இடமளிக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் நான்கெழுத்து உடன்படிக்கைப் பெயர் நேரடியாக இருப்பதால், பட்டப்பெயராக மாற்றாமல் அதன் பொதுவாக ஏற்கப்பட்ட ஒலிப்பைத் தமிழில் தருகிறது.
- issue: אֱמֶת என்பதன் வாக்கியப் பயன்
  choice: வார்த்தை உண்மை
  alternative: வார்த்தை உண்மையானது / நம்பகமானது
  rationale: மூலத்தின் பெயர்ச்சொல் அமைப்பையும் வலுவான உறுதிப்பாட்டையும் காக்கிறது; அதேவேளை உண்மைத்தன்மை மற்றும் நம்பகத்தன்மை ஆகிய நிழற்பொருள்களை அடிக்குறிப்பு தெரிவிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதை ஒருமையான ‘நீர்/உமது’ வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. உரை கண்ணியமானதாகவும் சாதாரண வாசகர்களுக்கு எளிதில் புரியத்தக்கதாகவும் வைக்கப்பட்டுள்ளது; எபிரெய மொழியின் தீர்க்கதரிசனப் படிமமும் பொருள் தெளிவின்மையும் இயன்றவரை பாதுகாக்கப்பட்டுள்ளன.
