base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/012.yaml
  text: And she said[a], “As Yahweh your God lives, I have no bread-cake, only a handful of flour in the jar and a little oil in the jug. And look, I am gathering two sticks, so that I may go in and prepare it for myself and for my son, and we may eat it and die.”
translation:
  language: ta
  text: 'அவள், “உங்கள் கடவுளாகிய யாவே உயிரோடிருக்கிறார் என்பதன்மேல் ஆணையாகச் சொல்கிறேன்: என்னிடம் ஒரு சிறிய ரொட்டிகூட இல்லை[a]. பானையில் ஒரு கைப்பிடி மாவும் குடுவையில் சிறிது எண்ணெயும்தான் இருக்கின்றன. இதோ, நான் இரண்டு விறகுத் துண்டுகளைப் பொறுக்கிக்கொண்டிருக்கிறேன். உள்ளே சென்று, எனக்கும் என் மகனுக்கும் அதைத் தயாரிப்பேன்; நாங்கள் அதைச் சாப்பிட்டு இறந்துபோவோம்” என்றாள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு விதமாக: “என்னிடம் ஒரு ரொட்டித் துண்டுகூட இல்லை” அல்லது “சுட்ட ரொட்டி எதுவும் இல்லை.” எபிரெயச் சொல் சிறிய வட்டமான ரொட்டியைக் குறிக்கிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי יְהוָה אֱלֹהֶיךָ
  choice: உங்கள் கடவுளாகிய யாவே உயிரோடிருப்பது உறுதி!
  rationale: இது ஓர் ஆணைச் சூத்திரம். தமிழில் அதன் உறுதியையும் இயல்பான உரையாடல் நடையையும் காக்கிறது; אֱלֹהֶיךָ என்பது எலியாவை மரியாதையாக ஒருமையில் சுட்டுவதால் ‘உங்கள் கடவுள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான நான்கெழுத்துத் திருப்பெயரை ஒரு பட்டத்தால் மாற்றாமல் ஒலிபெயர்க்கிறது.
- source_word: אִם יֶשׁ לִי מָעוֹג
  choice: என்னிடம் ஒரு சிறிய அப்பம்கூட இல்லை
  rationale: ஆணையுடன் வரும் אִם வலிய மறுப்பைக் குறிக்கிறது; מָעוֹג சுடப்பட்ட சிறிய அப்பத்தைக் குறிக்கிறது.
- source_word: מְלֹא כַף קֶמַח
  choice: ஒரு கைப்பிடி மாவு
  rationale: சொல்லாட்சியின் சிறிய அளவை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: כַּד / צַפַּחַת
  choice: பானை / குடுவை
  rationale: மாவுக்கான சேமிப்புப் பாத்திரத்தையும் எண்ணெய்க்கான சிறிய பாத்திரத்தையும் வேறுபடுத்துகிறது.
- source_word: וְהִנְנִי מְקֹשֶׁשֶׁת
  choice: இதோ, நான் ... பொறுக்கிக்கொண்டிருக்கிறேன்
  rationale: הִנֵּה தரும் உடனடித் தன்மையையும், நிகழ்ந்துகொண்டிருக்கும் செயலைக் காட்டும் பங்கேற்பு வினையின் நுணுக்கத்தையும் காக்கிறது.
- source_word: שְׁנַיִם עֵצִים
  choice: இரண்டு விறகுகள்
  rationale: அடுப்பெரிக்கப் பயன்படும் மிகச் சிறிய அளவிலான மரத்துண்டுகள் என்ற சூழல்சார்ந்த பொருளைத் தருகிறது.
- source_word: וַעֲשִׂיתִיהוּ
  choice: அதைச் சமைப்பேன்
  rationale: சொற்பொருள் ‘அதைச் செய்வேன்/தயாரிப்பேன்’; உணவுச் சூழலில் ‘சமைப்பேன்’ என்பது இயல்பான சமமான மொழிபெயர்ப்பு.
theological_decisions:
- issue: சீதோனிய விதவை கூறும் ஆணையில் יְהוָה என்ற இறைப்பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டமாக மாற்றாமல் ‘யாவே’ என வழங்குவது மூலத்தின் தனிப்பெயர்த் தன்மையைப் பாதுகாக்கிறது.
- issue: ‘சாப்பிட்டுவிட்டு இறந்துபோவோம்’ என்பதன் பொருள்
  choice: எதிர்பார்க்கப்படும் பட்டினிச் சாவைக் குறிக்கும் சொல்லாகத் திறந்தே வைக்கப்பட்டது
  alternative: ‘அதுவே எங்கள் கடைசி உணவு’ என்று விளக்கமாக்குதல்
  rationale: மூலம் உணவு முடிந்தவுடன் உடனடி மரணம் என்று விளக்கவில்லை; விதவை எதிர்நோக்கும் தவிர்க்கமுடியாத முடிவை வலுவாகச் சொல்கிறது. மொழிபெயர்ப்பு அந்த இறுக்கத்தையும் மிகைப்படுத்திய நேரவரிசையையும் தீர்மானிக்காமல் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையான ஒருமை முகவரியுடன் மொழிபெயர்க்கப்பட்டது. ‘இதோ’, ‘பொறுக்கிக்கொண்டிருக்கிறேன்’, ‘இறந்துபோவோம்’ ஆகியவை உரையின் உடனடித் தன்மை, கடும் பற்றாக்குறை, நம்பிக்கையின்மை ஆகியவற்றை இயல்பாகத் தருகின்றன.
