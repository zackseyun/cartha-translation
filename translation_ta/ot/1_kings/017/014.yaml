revisions:
- from: 'ஏனெனில், இஸ்ரவேலின் கடவுளாகிய யாவே கூறுவது இதுவே: “யாவே நிலத்தின் மேற்பரப்பில் மழை கொடுக்கும் நாள்வரை, மாவுப் பானை காலியாகாது; எண்ணெய்க் குடுவை வற்றாது.”'
  to: 'ஏனெனில், இஸ்ரவேலின் கடவுளான யாவே இவ்வாறு கூறுகிறார்: “யாவே நிலத்தின்மேல் மழையைக் கொடுக்கும் நாள்வரை, மாவுப் பானையிலுள்ள மாவு தீர்ந்துபோகாது; எண்ணெய்க் குடுவையிலுள்ள எண்ணெய் வற்றாது.”'
  rationale: 'The revision retains all source elements and the direct rendering of the divine name. It improves the naturalness of the prophetic formula, replaces a technical spatial expression with standard Tamil, and makes explicit that it is the flour in the jar that will not be exhausted. No footnote is needed: the Hebrew spatial idiom is translated clearly, and the lexical nuances are adequately represented in the main text.'
  reviewer_model: gpt-5.6-terra
