id: 1KI.17.14
reference: 1 Kings 17:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: כִּ֣י כֹה֩ אָמַ֨ר יְהוָ֜ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל כַּ֤ד הַ/קֶּ֨מַח֙ לֹ֣א תִכְלָ֔ה וְ/צַפַּ֥חַת הַ/שֶּׁ֖מֶן לֹ֣א תֶחְסָ֑ר עַ֠ד י֧וֹם תתן יְהוָ֛ה גֶּ֖שֶׁם עַל פְּנֵ֥י הָ/אֲדָמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/014.yaml
  text: 'For this is what Yahweh[a], the God of Israel, says: ‘The jar of flour will not be used up, and the jug of oil will not run dry[c][b], until the day Yahweh gives rain on the face of the ground.’'
translation:
  language: ta
  text: 'ஏனெனில், இஸ்ரவேலின் கடவுளான யாவே இவ்வாறு கூறுகிறார்: “யாவே நிலத்தின்மேல் மழையைக் கொடுக்கும் நாள்வரை, மாவுப் பானையிலுள்ள மாவு தீர்ந்துபோகாது; எண்ணெய்க் குடுவையிலுள்ள எண்ணெய் வற்றாது.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், எபிரெய நான்கெழுத்துப் பெயரின் பரவலாக ஏற்கப்பட்ட ஒலிபெயர்ப்பைத் தமிழில் தருகிறது.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கடவுள்
  rationale: எபிரெய இணைப்புத் தொடரை நேராகவும் இயல்பான நவீனத் தமிழிலும் தருகிறது.
- source_word: כַּד הַקֶּמַח
  choice: மாவுப் பானை
  rationale: மாவை வைத்திருக்கும் வீட்டுப் பயன்பாட்டுப் பாத்திரத்தைக் குறிக்கிறது; வாக்கியத்தில் அதன் உள்ளடக்கம் தீர்ந்துபோகாது என்னும் பொருள் இயல்பாகப் புரிகிறது.
- source_word: לֹא תִכְלָה
  choice: காலியாகாது
  rationale: כלה என்பதன் ‘முடிவுறுதல், தீர்ந்துபோதல்’ என்ற பொருளை உணவுப் பொருள் வைக்கப்பட்ட பாத்திரத்திற்கு இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: צַפַּחַת הַשֶּׁמֶן
  choice: எண்ணெய்க் குடுவை
  rationale: எண்ணெயை வைத்திருக்கும் சிறிய பாத்திரத்தைக் குறிக்கும் இயல்பான சொல்; மாவுப் பானையிலிருந்து வேறுபடுத்தியும் காட்டுகிறது.
- source_word: לֹא תֶחְסָר
  choice: வற்றாது
  rationale: חסר என்பதன் ‘குறைதல், இல்லாமற்போதல்’ என்ற கருத்தை திரவம் உள்ள குடுவைக்குப் பொருத்தமான சுருக்கமான தமிழில் தருகிறது.
- source_word: עַד יוֹם
  choice: நாள்வரை
  rationale: எபிரெய காலக்குறிப்பில் உள்ள ‘நாள்’ என்பதை நீக்காமல் இயல்பான தமிழ்த் தொடராகப் பாதுகாக்கிறது.
- source_word: תתן יְהוָה גֶּשֶׁם
  choice: யாவே மழை கொடுக்கும்
  rationale: נתן என்பதன் அடிப்படைப் பொருளான ‘கொடு’ என்பதைப் பாதுகாத்து, தமிழிலும் இயல்பாக அமைகிறது.
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: நிலத்தின் மேற்பரப்பில்
  rationale: ‘நிலத்தின் முகத்தின்மேல்’ என்ற எபிரெய உருவகத்தைப் புரியத்தக்க நவீனத் தமிழில், அதன் மேற்பரப்பு என்ற கருத்தைத் தக்கவைத்துத் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூல உரை இறைவனின் தனிப்பட்ட திருப்பெயரையே பயன்படுத்துவதால், அதை ஒரு பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியக்கூடிய கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘மாவுப் பானை காலியாகாது; எண்ணெய்க் குடுவை வற்றாது’ என்பது இரு எபிரெய வினைகளின் நுண்ணிய வேறுபாட்டை இயல்பான தமிழில் பேணுகிறது.
