  text: וַ/יְהִ֛י מִ/קֵּ֥ץ יָמִ֖ים וַ/יִּיבַ֣שׁ הַ/נָּ֑חַל כִּ֛י לֹֽא הָיָ֥ה גֶ֖שֶׁם בָּ/אָֽרֶץ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/007.yaml
  text: And it happened after some days that the wadi dried up[a], because there was no rain in the land.
translation:
  language: ta
  text: சில நாட்களுக்குப் பிறகு அந்த ஓடை வற்றிப்போனது[a]; ஏனெனில் நாட்டில் மழை இல்லாததால்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சிற்றோடை.’ எபிரெயச் சொல் பருவகாலத்தில் மட்டும் நீர் ஓடும் ஓடையையோ அதன் படுகையையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: நிகழ்வை இயல்பான தமிழ்ச் சொல்லமைப்பில் உட்பொருளாக வெளிப்படுத்தப்பட்டது
  rationale: இது அடுத்த நிகழ்வை அறிமுகப்படுத்தும் எபிரெயக் கதைத் தொடர் வடிவம். ‘அப்போது நிகழ்ந்ததாவது’ என்று சொற்சொல்லாக மொழிபெயர்ப்பது நவீன தமிழில் செயற்கையாக இருக்கும்; காலத் தொடரும் அடுத்த நிகழ்வும் சேர்ந்து அதன் செயல்பாட்டைத் தெளிவாக வெளிப்படுத்துகின்றன.
- source_word: מִקֵּץ יָמִים
  choice: சில நாட்களுக்குப் பிறகு
  rationale: இந்த மரபுத்தொடர் குறிப்பிடப்படாத ஒரு காலப்பகுதி கடந்ததைக் குறிக்கிறது. ‘சில நாட்களுக்குப் பிறகு’ என்பது ‘நாட்கள்’ என்ற மூலக் கூறையும் காலத்தின் வரையறையற்ற தன்மையையும் இயல்பாகப் பாதுகாக்கிறது.
- source_word: וַיִּיבַשׁ
  choice: வற்றிப்போனது
  rationale: நீரோட்டம் நின்று நீர்நிலை உலர்ந்ததைத் தமிழில் இயல்பாகக் குறிக்கும் வினைச்சொல்.
- source_word: הַנָּחַל
  choice: அந்த ஓடை
  rationale: נחל என்பது பருவகால நீரோடை அல்லது அதன் படுகையைக் குறிக்கலாம். சூழலில் முன்பு குறிப்பிடப்பட்ட நீர்நிலையைச் சுட்டுவதால் ‘அந்த ஓடை’ இயல்பானது; புவியியல் நுட்பம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: ஓடை வற்றியதற்கான காரணத்தை இச்சொல் அறிமுகப்படுத்துகிறது.
- source_word: לֹא הָיָה גֶשֶׁם
  choice: மழை பெய்யவில்லை
  rationale: மழையின்மையைத் தமிழில் தெளிவாகவும் இயல்பாகவும் கூறுகிறது; காரண விளக்கத்தின் எளிய தன்மையைப் பாதுகாக்கிறது.
- source_word: בָּאָרֶץ
  choice: நாட்டில்
  rationale: இங்கு אֶרֶץ என்பது முழு பூமியையல்ல, வறட்சியால் பாதிக்கப்பட்ட நாட்டையோ பிரதேசத்தையோ குறிக்கிறது.
