base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/010.yaml
  text: So he arose and went to Zarephath. When he came to the entrance of the city[a], behold, a widow was there gathering sticks. He called to her and said, “Please bring me a little water in a vessel, so that I may drink.”
translation:
  language: ta
  text: அவன் எழுந்து சாரிபாத்துக்குப் போனான். அவன் நகரத்தின் நுழைவிடத்திற்கு[a] வந்தபோது, அங்கே ஒரு விதவை சுள்ளிகளைப் பொறுக்கிக்கொண்டிருந்தாள். அவன் அவளை நோக்கிக் கூப்பிட்டு, “தயவுசெய்து, நான் குடிப்பதற்காக ஒரு பாத்திரத்தில் கொஞ்சம் தண்ணீர் கொண்டு வாருங்கள்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நகரத்தின் வாசலுக்கு.” எபிரேயச் சொல் (פֶּתַח) குறிப்பிட்ட நகரவாசலைக் குறிக்கும் சொல்லைவிடப் பொதுவாக “நுழைவிடம்/திறப்பு” என்று பொருள்படும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם וַיֵּלֶךְ
  choice: அவன் எழுந்து ... போனான்
  rationale: קום தொடர்ந்து הלך வருவது செயலில் இறங்கிச் சென்றதைக் குறிக்கிறது; எபிரெயக் கதைநடையின் இரு வினைகளையும் இயல்பான தமிழில் காக்கிறது.
- source_word: צָרְפַתָה
  choice: சாரிபாத்துக்கு
  rationale: இடப்பெயருடன் சேர்ந்த திசைச் சுட்டும் ה இலக்கை நோக்கிய இயக்கத்தைக் குறிக்கிறது; தமிழில் நான்காம் வேற்றுமை இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: פֶּתַח הָעִיר
  choice: நகரத்தின் நுழைவிடம்
  rationale: פֶּתַח என்பது குறிப்பாகக் 'கதவு/வாசல்' என்பதைக் காட்டிலும் பொதுவான 'திறப்பு/நுழைவிடம்'; மூலத்தின் பொதுத்தன்மை காக்கப்படுகிறது.
- source_word: וְהִנֵּה
  choice: அங்கே
  rationale: הִנֵּה காட்சியை வாசகரின் கவனத்திற்குக் கொண்டுவருகிறது. தமிழில் தனியே 'இதோ' என்பது இச்சூழலில் செயற்கையாக இருக்கக்கூடும்; 'அங்கே' மற்றும் வாக்கிய அமைப்பு அந்தக் காட்சிப்படுத்தும் செயல்பாட்டை இயல்பாக வழங்குகின்றன.
- source_word: אִשָּׁה אַלְמָנָה
  choice: ஒரு விதவை
  rationale: சொல்லுக்குச் சொல் 'ஒரு பெண், ஒரு விதவை'; தமிழில் 'ஒரு விதவை' என்பதே சுருக்கமான இயல்பான இணை.
- source_word: מְקֹשֶׁשֶׁת עֵצִים
  choice: சுள்ளிகளைப் பொறுக்கிக்கொண்டிருந்தாள்
  rationale: קשׁשׁ சிறு விறகுத் துண்டுகள் அல்லது சுள்ளிகளைச் சேகரிப்பதைக் குறிக்கலாம்; 'சுள்ளிகள்' பெரிய விறகு என்ற தவறான எண்ணத்தைத் தவிர்க்கிறது, தொடர்நிலை வடிவம் அப்போது நடந்த செயலைக் காட்டுகிறது.
- source_word: וַיִּקְרָא אֵלֶיהָ
  choice: அவன் அவளைக் கூப்பிட்டு
  rationale: קרא אל என்பது ஒருவரை நோக்கிக் கூப்பிடுதல்; அடுத்த பேச்சுடன் இயல்பாக இணைக்க வினையெச்சம் பயன்படுத்தப்பட்டது.
- source_word: קְחִי נָא
  choice: தயவுசெய்து ... கொண்டுவா
  rationale: לקח அடிப்படையில் 'எடு' என்றாலும், பேச்சாளருக்காகத் தண்ணீர் பெறும் வேண்டுகோளில் தமிழின் இயல்பான திசை வினை 'கொண்டுவா'; נָא-வின் பணிவை 'தயவுசெய்து' வெளிப்படுத்துகிறது.
- source_word: מְעַט מַיִם
  choice: கொஞ்சம் தண்ணீர்
  rationale: மிகக் குறைந்த அளவைப் பேசுவழக்கிலும் தரமான நவீன தமிழிலும் இயல்பாகக் குறிக்கிறது.
- source_word: בַּכְּלִי
  choice: ஒரு பாத்திரத்தில்
  rationale: כְּלִי என்பது குடுவை என்று குறிப்பிட்டுவிடாத பொதுவான கொள்கலச் சொல்; 'பாத்திரம்' அந்தப் பொதுத்தன்மையை காக்கிறது.
- source_word: וְאֶשְׁתֶּה
  choice: நான் குடிக்க
  rationale: cohortative வடிவத்தின் நோக்கம்/விருப்பப் பொருளைத் தமிழில் சுருக்கமாகவும் தெளிவாகவும் வெளிப்படுத்துகிறது.
