  yaml_path: translation/ot/1_kings/016/015.yaml
  text: In the twenty-seventh year of Asa king of Judah[a], Zimri became king for seven days in Tirzah, while the people were camped against Gibbethon, which belonged to the Philistines.
translation:
  language: ta
  text: யூதாவின் அரசன் ஆசாவின் ஆட்சியின் இருபத்தேழாம் ஆண்டில், சிம்ரி திர்சாவில் ஏழு நாட்கள் அரசாண்டான். அப்போது மக்கள் பெலிஸ்தியருக்குச் சொந்தமான கிபெத்தோனுக்கு எதிராக[a] முகாமிட்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கிபெத்தோனில்” என்றும் மொழிபெயர்க்கலாம். இந்தப் படைத்துறைச் சூழலில், மக்கள் அந்த நகரத்திற்கு எதிராக முகாமிட்டிருந்தார்கள் என்பதே அதிக வாய்ப்புள்ளது.
    reason: lexical_alternative
