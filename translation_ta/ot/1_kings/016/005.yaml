base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/005.yaml
  text: The rest of the acts of Baasha[a], and what he did, and his might—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: ta
  text: பாஷாவின் மற்ற செயல்களும், அவன் செய்தவையும், அவனுடைய வல்லமையும் இஸ்ரவேல் அரசர்களின் நாளாகமப் புத்தகத்தில்[a] எழுதப்பட்டிருக்கின்றன அல்லவா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது ‘இஸ்ரவேல் அரசர்களின் ஆண்டுக் குறிப்புப் புத்தகத்தில்.’
    reason: דִּבְרֵי הַיָּמִים என்ற தொடர் ‘நாளாகமம்’ என்றும் ‘ஆண்டுக் குறிப்புகள்’ என்றும் பொருள்படக்கூடிய ஆட்சிப் பதிவைக் குறிக்கிறது.
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי בַעְשָׁא
  choice: பாஷாவின் மற்ற செயல்களும்
  rationale: יֶתֶר என்பது மீதமுள்ளவற்றைக் குறிக்கிறது; அரசனின் ஆட்சிப் பதிவைப் பற்றிய இச்சூழலில் דִּבְרֵי என்பது பேச்சுகளை அல்ல, செயல்கள் அல்லது நிகழ்வுகளைக் குறிக்கிறது. எபிரெயத்தில் தனியான ‘இப்போது’ என்ற காலச் சொல் இல்லாததால் அது சேர்க்கப்படவில்லை.
- source_word: וַאֲשֶׁר עָשָׂה
  choice: அவன் செய்தவையும்
  rationale: உறவுப்பெயர் வாக்கியத்தை நேரடியாகவும் இயல்பாகவும் மொழிபெயர்க்கிறது; மூலத்தில் இல்லாத ‘எல்லாவற்றையும்’ சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: וּגְבוּרָתוֹ
  choice: அவனுடைய வல்லமையும்
  rationale: גְּבוּרָה என்பதன் வல்லமை/வீரம் என்ற அருவப் பொருளைப் பாதுகாக்கிறது; ‘வீரச் செயல்கள்’ என்பது சாத்தியமானாலும் அதிக விளக்கமளிக்கும் மொழிபெயர்ப்பு.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: எழுதப்பட்டிருக்கின்றன அல்லவா?
  rationale: அரசர்கள் நூலில் திரும்பத் திரும்ப வரும் எதிர்மறை வினா வடிவத்தையும் அதன் உறுதிப்படுத்தும் தொனியையும் பாதுகாக்கிறது.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் அரசர்களின் நாளாகமப் புத்தகத்தில்
  rationale: ஆட்சிக்கால நிகழ்வுகளைப் பதிவு செய்த ஆவணத்தைக் குறிக்கும் பெயராக இயல்பாக அமைகிறது. עַל இச்சொற்றொடரில் எழுதப்பட்ட ஆவணத்துக்குள் இருப்பதைத் தமிழில் ‘புத்தகத்தில்’ எனக் குறிக்கிறது; לְ என்பது அரசர்களுடன் தொடர்புடைய பதிவைக் காட்டுகிறது.
