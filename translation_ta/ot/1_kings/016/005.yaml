translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க தமிழ் பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் பட்டியல் அமைப்பும் சொல்லளவிலான மீளுரையும், இறுதியிலுள்ள எதிர்மறை வினா வடிவமும் பாதுகாக்கப்பட்டுள்ளன. ‘ராஜாக்கள்’ என்பதற்குப் பதிலாக இன்றைய பொதுவழக்கில் தெளிவான ‘அரசர்கள்’ பயன்படுத்தப்பட்டுள்ளது.
