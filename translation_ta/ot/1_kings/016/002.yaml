  text: יַ֗עַן אֲשֶׁ֤ר הֲרִימֹתִ֨י/ךָ֙ מִן הֶ֣/עָפָ֔ר וָ/אֶתֶּנְ/ךָ֣ נָגִ֔יד עַ֖ל עַמִּ֣/י יִשְׂרָאֵ֑ל וַ/תֵּ֣לֶךְ בְּ/דֶ֣רֶךְ יָרָבְעָ֗ם וַֽ/תַּחֲטִא֙ אֶת עַמִּ֣/י יִשְׂרָאֵ֔ל לְ/הַכְעִיסֵ֖/נִי בְּ/חַטֹּאתָֽ/ם־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/002.yaml
  text: Because I raised you up from the dust and made you ruler over my people Israel[a], and you walked in the way of Jeroboam and caused my people Israel to sin, provoking me to anger by their sins,
translation:
  language: ta
  text: “நான் உன்னைப் புழுதியிலிருந்து உயர்த்தி, என் மக்களாகிய இஸ்ரவேலின்மேல் தலைவனாக வைத்ததாலும், நீ யெரொபெயாமின் வழியில் நடந்து, என் மக்களாகிய இஸ்ரவேலைப் பாவம் செய்யவைத்து[a], அவர்களுடைய பாவங்களால் எனக்குக் கோபமூட்டியதாலும்,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் மக்களாகிய இஸ்ரவேல் பாவம் செய்யும்படி செய்தாய்.” எபிரேய வினைச்சொல் காரணவினை வடிவில் உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  choice: …வைத்ததாலும் … கோபமூட்டியதாலும்
  rationale: அடுத்த வசனத்தில் வரும் தீர்ப்புக்கான காரணங்களை அறிமுகப்படுத்தும் எபிரேயத் தொடரை, தமிழில் இயல்பாகத் தொடரும் காரணவினை அமைப்பால் வெளிப்படுத்துகிறது.
- source_word: הֲרִימֹתִיךָ מִן הֶעָפָר
  choice: நான் உன்னைப் புழுதியிலிருந்து உயர்த்தி
  rationale: தாழ்ந்த நிலையிலிருந்து அரசியல் உயர்நிலைக்கு உயர்த்தியதையும், மூலத்தின் ‘புழுதி’ என்ற உருவகத்தையும் காக்கிறது.
- source_word: וָאֶתֶּנְךָ נָגִיד
  choice: தலைவனாக வைத்தேன்
  rationale: נָגִיד என்பது இச்சூழலில் ஆட்சித் தலைவரைக் குறிக்கிறது; ‘தலைவன்’ நவீன தமிழில் தெளிவாகவும் அரசச் சூழலுக்கு ஏற்றவாறும் உள்ளது.
- source_word: וַתֵּלֶךְ בְּדֶרֶךְ יָרָבְעָם
  choice: நீ யெரொபெயாமின் வழியில் நடந்து
  rationale: ஒருவரின் நடத்தை முறையைப் பின்பற்றுவதைக் குறிக்கும் ‘வழியில் நட’ என்ற மூல உருவகத்தைப் பாதுகாக்கிறது.
- source_word: וַתַּחֲטִא אֶת עַמִּי יִשְׂרָאֵל
  choice: என் மக்களாகிய இஸ்ரவேலைப் பாவம் செய்யவைத்து
  rationale: חטא என்பதன் ஹிஃபில் காரணவினை வடிவை நேரடியாக வெளிப்படுத்தி, அரசன் மக்களைப் பாவத்திற்கு வழிநடத்திய பொறுப்பைக் காட்டுகிறது.
- source_word: לְהַכְעִיסֵנִי
  choice: எனக்குக் கோபமூட்டி
  rationale: தேவனுக்கு எதிரான தனிப்பட்ட தூண்டுதலையும் அதன் விளைவான கோபத்தையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: בְּחַטֹּאתָם
  choice: அவர்களுடைய பாவங்களால்
  rationale: בְ என்பதன் கருவிப் பொருளையும், பன்மை மூன்றாம் நபர் பின்னொட்டு மக்களைக் குறிப்பதையும் காக்கிறது.
theological_decisions:
- issue: ‘அவர்களுடைய பாவங்கள்’ என்பதில் ‘அவர்கள்’ யாரைக் குறிக்கிறது?
  choice: பாகாஷா பாவம் செய்யவைத்த இஸ்ரவேல் மக்களைக் குறிக்கிறது.
  alternative: யெரொபெயாமின் வழியோடு தொடர்புடைய பாவச்செயல்களைப் பொதுவாகக் குறிக்கலாம்; அதில் பாகாஷாவின் பங்கும் அடங்கலாம்.
  rationale: உடனடியாக முந்தும் ‘என் மக்களாகிய இஸ்ரவேலைப் பாவம் செய்யவைத்து’ என்ற தொடரால், பன்மை பின்னொட்டின் இயல்பான முன்னிலைச் சொல் இஸ்ரவேல் மக்களே. இது அரசனின் வழிநடத்தும் குற்றத்தையும் மக்களின் சொந்தப் பங்கேற்பையும் ஒருசேர விடுகிறது.
- issue: தெய்வீக உயர்த்துதலுக்கும் பாகாஷாவின் பாவத்திற்கும் இடையிலான தொடர்பு
  choice: மூலத்தில் உள்ள இணைப்புகளை காரணங்களை வரிசைப்படுத்தும் வடிவில் வழங்குதல்
  alternative: ‘இருந்தும்’ அல்லது ‘ஆனால்’ என வெளிப்படையான முரண்பாட்டைச் சேர்த்தல்
  rationale: சூழலில் நன்றிகெட்ட முரண்பாடு உணரப்பட்டாலும், எபிரேய இணைப்புச் சொல் அதை வெளிப்படையாகக் குறிக்கவில்லை. ஆகவே தமிழில் கூடுதல் எதிர்மறை இணைப்பைச் சேர்க்காமல் காரணத் தொடரை வைத்திருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. வசனம் அடுத்த வசனத்தில் நிறைவுபெறும் காரணவாக்கியம் என்பதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது; ‘என் மக்களாகிய இஸ்ரவேல்’ என்ற உடைமை வலியுறுத்தலும் ‘வழியில் நட’ என்ற மூல உருவகமும் காக்கப்பட்டுள்ளன.
