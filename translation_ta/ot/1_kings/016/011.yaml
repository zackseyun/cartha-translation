- from: அவன் அரசனாகி, தன் அரியணையில் அமர்ந்தவுடனே, பாஷாவின் குடும்பத்தார் அனைவரையும் கொன்றுபோட்டான். பாஷாவுக்கு ஓர் ஆணைக்கூட[a] உயிரோடு விட்டுவைக்கவில்லை; அவனுடைய உறவினர்களையோ[b] நண்பர்களையோகூட விட்டுவைக்கவில்லை.
