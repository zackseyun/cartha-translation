base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/011.yaml
  text: And it happened that when he became king[a], as soon as he sat on his throne, he struck down all the house of Baasha. He did not leave him a single male[b], or any of his kinsmen or his friends.
translation:
  language: ta
  text: அவன் அரசனாகி, தன் அரியணையில் அமர்ந்தவுடனே, பாஷாவின் குடும்பத்தினர் அனைவரையும் கொன்றான். பாஷாவுக்கு ஒரு ஆணைக்கூட[a], அவனுடைய உறவினரையோ நண்பரையோ உயிரோடு விடவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “சுவரை நோக்கிச் சிறுநீர் கழிப்பவன்”; இது ‘ஆண்’ என்பதைக் குறிக்கும் கொச்சையான மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בְמָלְכוֹ
  choice: அவன் அரசனாகி
  rationale: இது கதையின் அடுத்த நிகழ்வை அறிமுகப்படுத்தி, அவன் ஆட்சியேற்ற காலத்தைக் குறிக்கிறது. நவீன தமிழில் இயல்பாக இருக்கும்படி தனியான ‘அது நிகழ்ந்தது’ என்ற தொடர் தவிர்க்கப்பட்டது.
- source_word: כְשִׁבְתּוֹ עַל כִּסְאוֹ
  choice: தன் அரியணையில் அமர்ந்தவுடனே
  rationale: כְּ என்ற காலவியல் அமைப்பும் சூழலும் செயல் உடனடியாக நடந்ததை உணர்த்துகின்றன.
- source_word: הִכָּה
  choice: கொன்றுபோட்டான்
  rationale: இச்சூழலில் נכה என்பது வெறுமனே அடித்ததை அல்ல, உயிரைக் கொன்றதைத் தெளிவாகக் குறிக்கிறது.
- source_word: כָּל בֵּית בַּעְשָׁא
  choice: பாஷாவின் குடும்பத்தார் அனைவரையும்
  rationale: ‘வீடு’ என்பது கட்டடத்தை அல்ல, பாஷாவின் குடும்பத்தையும் அரச வம்சத்தையும் குறிக்கிறது; தமிழில் ‘குடும்பத்தார்’ அந்தப் பொருளை இயல்பாகத் தருகிறது.
- source_word: לֹא הִשְׁאִיר לוֹ
  choice: பாஷாவுக்கு ... உயிரோடு விட்டுவைக்கவில்லை
  rationale: யாரையும் தப்பிப் பிழைக்க விடாமல் பாஷாவின் வழியை அழித்ததையே எபிரெயச் சொற்றொடர் குறிக்கிறது. தெளிவுக்காகப் பிரதிப்பெயருக்குப் பதில் பெயர் மீண்டும் வழங்கப்பட்டது.
- source_word: מַשְׁתִּין בְּקִיר
  choice: ஓர் ஆணைக்கூட
  rationale: இது ஆணைக் குறிக்கும் கொச்சையான எபிரெய மரபுத்தொடர். வாசிக்க இயல்பான முதன்மை உரையில் அதன் பொருள் தரப்பட்டு, சொல்லுக்கு நெருக்கமான வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- source_word: וְגֹאֲלָיו
  choice: அவனுடைய உறவினர்களையோ
  rationale: גאל குடும்பக் கடமைகளை உடைய நெருங்கிய உறவினரைக் குறிக்கலாம்; இங்கு ஒரு குறிப்பிட்ட சட்டப்பூர்வப் பங்கைத் தீர்மானிக்காமல் குடும்ப உறவுப் பொருள் பாதுகாக்கப்படுகிறது.
- source_word: וְרֵעֵהוּ
  choice: நண்பர்களையோ
  rationale: רֵעַ என்பதன் நேரடியான பொருள் நண்பர் அல்லது தோழர்; சூழலில் கூட்டாளிகளும் அடங்கலாம் என்றாலும், ‘நண்பர்கள்’ இயல்பான விரிவைத் தக்கவைக்கிறது.
theological_decisions:
- issue: גֹאֲלָיו என்பவர்களின் துல்லியமான குடும்பப் பங்கு
  choice: உறவினர்கள்
  alternative: பழிவாங்குவோர் / மீட்புரிமையுள்ள உறவினர்கள்
  rationale: இச்சொல் இரத்தப்பழி வாங்குதல், குடும்பச் சொத்தை மீட்டல் போன்ற பல உறவுக் கடமைகளைக் குறிக்கக்கூடும். சூழல் எந்த ஒரு பங்கையும் உறுதியாகத் தேர்ந்தெடுக்காததால், முதன்மை உரை அந்தத் தெளிவின்மையைத் தீர்த்துவிடவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய மூலத்தின் கொச்சையான ஆண் குறிப்பு முதன்மை உரையில் இயல்பான பொருளாகவும் அடிக்குறிப்பில் நேரடி வடிவமாகவும் தரப்பட்டுள்ளது. குடும்பக் கடமை சார்ந்த גאל என்ற சொல்லின் பல்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
