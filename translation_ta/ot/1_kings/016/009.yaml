  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் வரலாற்று உரைக்கு ஏற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் சதி, தேர்ப்படைப் பதவி, தொடர்ந்து குடித்துப் போதையடைந்த நிலை, அர்சாவின் நிர்வாகப் பதவி ஆகியவை தெளிவாகத் தக்கவைக்கப்பட்டுள்ளன.
