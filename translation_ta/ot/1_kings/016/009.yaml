base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/009.yaml
  text: But his servant Zimri[a], commander of half the chariots, conspired against him while he was in Tirzah, drinking himself drunk in the house of Arza[b], who was over the household in Tirzah.
translation:
  language: ta
  text: அவனுடைய பணியாளனும் தேர்ப்படையின் பாதிக்குத் தளபதியான சிம்ரி, அவனுக்கு எதிராகச் சதி செய்தான். அப்போது ஏலா திர்சாவில், அரண்மனை நிர்வாகியாக[b] இருந்த அர்சாவின் வீட்டில் குடித்துப் போதையேறிக்கொண்டிருந்தான்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “குடித்துக் குடித்து வெறித்துக்கொண்டிருந்தான்.” எபிரெயச் சொற்றொடர், குடித்ததன் விளைவாகப் போதை ஏற்பட்டுக்கொண்டிருந்த செயலை உயிரோட்டமாகச் சித்தரிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “அரண்மனை நிர்வாகி” என்பதற்கான எபிரெயச் சொற்றொடரின் நேரடிப் பொருள் “வீட்டின்மேல் இருந்தவன்.” இது அரச வீட்டையோ அரண்மனையையோ நிர்வகித்த அதிகாரியின் பதவிப் பெயராக இருக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקְשֹׁר עָלָיו
  choice: அவனுக்கு எதிராகச் சதி செய்தான்
  rationale: அரச வரலாற்றுச் சூழலில் קשר + עַל என்பது ஆட்சியாளருக்கு எதிரான அரசியல் சதியைக் குறிக்கிறது; இயல்பான தமிழில் அதன் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: עַבְדּוֹ
  choice: அவனுடைய பணியாளன்
  rationale: עבד என்பதன் அடிப்படைப் பொருள் ‘பணியாளன்’; அரசவைக் சூழலில் அதிகாரியையும் குறிக்கக்கூடும். மூலத்தின் பொதுவான சொல்லாட்சியைத் தக்கவைக்கிறது.
- source_word: זִמְרִי
  choice: சிம்ரி
  rationale: எபிரெய தனிப்பெயரின் தமிழாக்க ஒலிபெயர்ப்பு.
- source_word: שַׂר מַחֲצִית הָרָכֶב
  choice: தேர்ப்படையின் பாதிக்குத் தலைவன்
  rationale: רכב இங்கு தேர்ப்படையைக் குறிக்கிறது; שַׂר கட்டளை அல்லது தலைமைப் பொறுப்பைக் குறிக்கிறது. படைப்பிரிவின் பாதியின்மீது இருந்த அதிகாரத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְתִרְצָה
  choice: திர்சாவில்
  rationale: இடப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டு, இருப்பிட வேற்றுமை இயல்பாகக் கொடுக்கப்பட்டுள்ளது.
- source_word: שֹׁתֶה שִׁכּוֹר
  choice: குடித்துப் போதையேறிக்கொண்டிருந்தான்
  rationale: வினையெச்சத் தன்மையுள்ள שֹׁתֶה மற்றும் போதையைக் குறிக்கும் שִׁכּוֹר ஆகியவை, குடிப்பதால் போதை ஏறிக்கொண்டிருந்த தொடர்ச்சியான செயலைக் காட்சிப்படுத்துகின்றன.
- source_word: בֵּית אַרְצָא
  choice: அர்சாவின் வீட்டில்
  rationale: בית + தனிப்பெயர் என்பதன் நேரடியான, இயல்பான தமிழ் வடிவம்.
- source_word: אֲשֶׁר עַל הַבַּיִת
  choice: அரண்மனை நிர்வாகியாக இருந்த
  rationale: עַל־הַבַּיִת என்பது அரச வீடு அல்லது அரண்மனை நிர்வாகத்திற்குப் பொறுப்பான அதிகாரப் பதவியைக் குறிக்கும் மரபுத்தொடர்; சொற்சொறான தெளிவின்மையைத் தவிர்த்து பதவியின் செயல்பாட்டைத் தெரிவிக்கிறது.
