base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/023.yaml
  text: In the thirty-first year of Asa king of Judah[a], Omri became king over Israel for twelve years; he reigned in Tirzah six years.
translation:
  language: ta
  text: யூதாவின் அரசன் ஆசாவின் ஆட்சியின் முப்பத்தோராம் ஆண்டில், உம்ரி இஸ்ரவேலின்மேல் அரசனாகி, பன்னிரண்டு ஆண்டுகள் ஆட்சி செய்தான்; திர்சாவில் அவன் ஆறு ஆண்டுகள் ஆட்சி செய்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, இன்னும் நேரடியாக: “உம்ரி இஸ்ரவேலின்மேல் பன்னிரண்டு ஆண்டுகள் ஆட்சி செய்தான்; திர்சாவில் அவன் ஆறு ஆண்டுகள் ஆட்சி செய்தான்.” பன்னிரண்டு ஆண்டுகள் அவனுடைய மொத்த ஆட்சிக்காலத்தைக் குறிக்கிறது; அதில் ஆறு ஆண்டுகள் திர்சாவில் ஆட்சி செய்தான்.'
    reason: எபிரெய வாக்கிய அமைப்பின் மாற்று நேரடித் தரவையும் மொத்த ஆட்சிக்காலத்துக்கும் திர்சாவில் இருந்த ஆறு ஆண்டுகளுக்கும் உள்ள வேறுபாட்டையும் காட்டுதல்
lexical_decisions:
- source_word: בִּ/שְׁנַת שְׁלֹשִׁים וְ/אַחַת שָׁנָה
  choice: ஆட்சியின் முப்பத்தோராம் ஆண்டில்
  rationale: இது அரசர்களின் ஆட்சிக்காலத்தைக் கொண்டு தேதியிடும் எபிரெய வழக்கு. இயல்பான நவீனத் தமிழில் அதன் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: לְ/אָסָא מֶלֶךְ יְהוּדָה
  choice: யூதாவின் அரசன் ஆசாவின்
  rationale: לְ என்ற முன்னொட்டு இங்கு ஆசாவின் ஆட்சியாண்டைக் குறிக்கிறது; சொற்களின் தொடர்பை இயல்பான தமிழில் இவ்வாறு வெளிப்படுத்தலாம்.
- source_word: מָלַךְ
  choice: அரசனாகி
  rationale: முதல் பயன்பாடு உம்ரி அரசாட்சியை ஏற்றதைச் சுட்டுவதால், வெறும் தொடர்ச்சியான ஆட்சியைக் காட்டும் ‘ஆட்சி செய்தான்’ என்பதைக் காட்டிலும் தொடக்கப் பொருளை இது நன்றாக வெளிப்படுத்துகிறது.
- source_word: עַל יִשְׂרָאֵל
  choice: இஸ்ரவேல்மேல்
  rationale: מָלַךְ உடன் வரும் עַל ஒரு மக்கள்மீது செலுத்தும் அரசாட்சியைக் குறிக்கிறது.
- source_word: שְׁתֵּים עֶשְׂרֵה שָׁנָה
  choice: பன்னிரண்டு ஆண்டுகள்
  rationale: உம்ரியின் மொத்த ஆட்சிக்காலத்தைக் குறிக்கிறது; தமிழில் காலநீளத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּ/תִרְצָה
  choice: திர்சாவில்
  rationale: בְּ இங்கு இடப்பொருளில் வந்து, அவன் ஆட்சி செய்த மையத்தைக் குறிப்பிடுகிறது.
- source_word: מָלַךְ שֵׁשׁ שָׁנִים
  choice: அவன் ஆறு ஆண்டுகள் ஆட்சி செய்தான்
  rationale: מָלַךְ என்பதன் இரண்டாவது பயன்பாடு திர்சாவில் ஆட்சி செய்த காலநீளத்தை விவரிக்கிறது.
