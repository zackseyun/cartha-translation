source:
  edition: WLC
  text: הִנְ/נִ֥י מַבְעִ֛יר אַחֲרֵ֥י בַעְשָׁ֖א וְ/אַחֲרֵ֣י בֵית֑/וֹ וְ/נָֽתַתִּי֙ אֶת בֵּ֣יתְ/ךָ֔ כְּ/בֵ֖ית יָרָבְעָ֥ם בֶּן נְבָֽט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/003.yaml
  text: Behold[a], I am sweeping away Baasha and his house, and I will make your house like the house of Jeroboam son of Nebat.
translation:
  language: ta
  text: இதோ, நான் பாஷாவையும் அவனுடைய வீட்டாரையும் முற்றிலும் அழித்துவிடப் போகிறேன்[a]. உன் வீட்டாரை நேபாத்தின் மகன் யெரொபெயாமின் வீட்டாரைப் போலாக்குவேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் இன்னும் சொல்லுக்குச் சொல்லாக, “பாஷாவுக்குப் பின்னாலும் அவன் வீட்டாருக்குப் பின்னாலும் நான் எரித்துக்கொண்டிருக்கிறேன்.” இந்த எபிரெய மரபுத்தொடர், பாஷாவையும் அவனுடைய வழித்தோன்றல்களையும் முற்றிலும் அகற்றுவதைச் சுட்டுகிறது.
    reason: மூலத்தின் எரித்தல் உருவகத்தையும் ‘பின்னால்’ என்ற மரபுத்தொடர் அமைப்பையும் சொல்லுக்குச் சொல்லாகக் காட்டி, அதன் idiomatic பொருளைத் தனியே விளக்குகிறது.
lexical_decisions:
- source_word: הִנְנִי
  choice: இதோ
  rationale: கடவுளின் கடுமையான தீர்ப்பறிவிப்பை அறிமுகப்படுத்தும் தீர்க்கதரிசன வலிமையையும் கண்ணியத்தையும் இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: מַבְעִיר אַחֲרֵי
  choice: முற்றிலும் அழித்துவிடப் போகிறேன்
  rationale: சொல்லுக்குச் சொல்லாக ‘பின்னால் எரித்தல்/ஒழித்தல்’ எனத் தோன்றும் எபிரெய மரபுத்தொடர், இங்கு பாஷாவையும் அவனுக்குப் பின்வரும் அரசகுலத்தையும் முழுமையாக அகற்றும் தீர்ப்பைக் குறிக்கிறது. தமிழில் தெளிவாகப் பொருளைத் தருகிறது; நெருப்பே அழிவின் வழிமுறை என்று தேவையின்றிக் குறிப்பிடவில்லை.
- source_word: בֵיתוֹ / בֵיתְךָ
  choice: அவனுடைய வீட்டார் / உன் வீட்டார்
  rationale: அரச குடும்பம், குடும்பத்தினர், வம்சவழி ஆகிய பொருள் பரப்பைத் திறந்துவைத்தபடி, மூலத்தின் ‘வீடு’ உருவகத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: וְנָתַתִּי
  choice: போலாக்குவேன்
  rationale: இந்த அமைப்பில் נתן என்பது வெறுமனே ‘கொடுப்பேன்’ என்பதல்ல; ஒன்றை மற்றொன்றைப் போலச் செய்வதைக் குறிக்கிறது.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: நேபாத்தின் மகன் யெரொபெயாம்
  rationale: தமிழில் வழக்கமான வேதாகமப் பெயர் வடிவங்களையும் இயல்பான தந்தைவழிக் குறிப்பையும் பயன்படுத்துகிறது.
theological_decisions:
- issue: பாஷாவின் வீட்டார்மீது வரும் தீர்ப்பின் இயல்பு
  choice: நெருப்பை நேரடியான அழிவு முறையாகக் குறிப்பிடாமல், பாஷாவின் அரசகுலம் முற்றிலும் அகற்றப்படும் தீர்ப்பாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘பாஷாவுக்குப் பின்னால் எரித்துக்கொண்டிருக்கிறேன்’ அல்லது ‘பாஷாவுக்குப் பின்வருவோரைச் சுட்டெரிக்கிறேன்’ என்று சொல்லுக்குச் சொல்லாக மொழிபெயர்த்தல்.
  rationale: எபிரெய மரபுத்தொடரின் மையம் அழிப்பின் கருவியைச் சுட்டுவது அல்ல; பாஷாவையும் அவன் குடும்ப/அரச வம்சத்தையும் முழுமையாக அகற்றும் இறைத்தீர்ப்பை அறிவிப்பதே. அடிக்குறிப்பு சொல்லுக்குச் சொல்லான உருவகத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதில் புரியும், ஆனால் தீர்க்கதரிசனத் தீர்ப்புக்குரிய கண்ணியமும் தீவிரமும் கொண்ட நடை. ‘வீட்டார்’ என்பது குடும்பம் அல்லது அரச வம்சம் என்ற இரு தொடர்புடைய பொருள்களையும் தேவையின்றி ஒன்றாக மட்டுப்படுத்தாமல் காக்கிறது.
