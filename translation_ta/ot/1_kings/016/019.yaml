  text: עַל חטאת/ו אֲשֶׁ֣ר חָטָ֔א לַ/עֲשׂ֥וֹת הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה לָ/לֶ֨כֶת֙ בְּ/דֶ֣רֶךְ יָרָבְעָ֔ם וּ/בְ/חַטָּאת/וֹ֙ אֲשֶׁ֣ר עָשָׂ֔ה לְ/הַחֲטִ֖יא אֶת יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/019.yaml
  text: because of his sins that he committed[a], doing what was evil in the eyes of Yahweh, walking in the way of Jeroboam and in the sin that he caused Israel to commit.
translation:
  language: ta
  text: அவன் செய்த பாவங்களினால்[a] இது நிகழ்ந்தது. அவன் யாவேயின் பார்வையில் தீமையானதைச் செய்து, யெரொபெயாமின் வழியில் நடந்தான்; மேலும், இஸ்ரவேலைப் பாவம் செய்யவைத்த அவனுடைய பாவத்திலும் நடந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ஒருமையாக, “அவன் செய்த அவனுடைய பாவத்தினால்” என்று உள்ளது; இதில் ஒரே வேர்ச்சொல் மீண்டும் வருகிறது.
    reason: எபிரெய மூலத்தின் ஒருமை வடிவத்தையும் ஒரே வேர்ச்சொல் மீளுரையையும் காட்டுவதற்காக.
lexical_decisions:
- source_word: עַל
  choice: நிமித்தமே இது நிகழ்ந்தது
  rationale: עַל முந்தைய வசனத்தில் கூறப்பட்ட அவனுடைய அழிவுக்கான காரணத்தை அறிமுகப்படுத்துகிறது. தமிழில் வசனம் தனித்தும் தெளிவாக இருக்க, காரணப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: חטאתו אֲשֶׁר חָטָא
  choice: அவன் செய்த பாவங்கள்
  rationale: எபிரெயத்தில் ஒரே வேர்ச்சொல்லை மீண்டும் பயன்படுத்தும் ‘அவன் பாவம் செய்த அவனுடைய பாவம்’ என்ற அமைப்பு உள்ளது. சூழலில் அதன் கூட்டுப்பொருளை இயல்பான தமிழில் ‘பாவங்கள்’ என வழங்குகிறது; நேரடியான ஒருமை வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: לַעֲשׂוֹת הָרַע
  choice: தீமையானதைச் செய்து
  rationale: அவனுடைய பாவத்தின் உள்ளடக்கத்தை விளக்கும் வினையெச்சத் தொடராக இயல்பான தமிழில் தரப்பட்டுள்ளது.
- source_word: בְּעֵינֵי יְהוָה
  choice: யாவேயின் பார்வையில்
  rationale: எபிரெய மதிப்பீட்டு மரபுத்தொடரின் ‘கண்களில்’ என்ற உருவகத்தை, நவீன தமிழில் தெளிவான ‘பார்வையில்’ என்று வழங்குகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் அறியத்தக்க ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: לָלֶכֶת בְּדֶרֶךְ יָרָבְעָם
  choice: யெரொபெயாமின் வழியில் நடந்தான்
  rationale: ஒருவருடைய நடத்தை அல்லது வாழ்க்கை முறையை ‘வழியில் நடப்பது’ எனச் சொல்லும் எபிரெய உருவகத்தைத் தமிழிலும் பாதுகாக்கிறது.
- source_word: וּבְחַטָּאתוֹ אֲשֶׁר עָשָׂה לְהַחֲטִיא אֶת יִשְׂרָאֵל
  choice: இஸ்ரவேலைப் பாவம் செய்யவைத்த அவனுடைய பாவத்திலும் நடந்தான்
  rationale: לְהַחֲטִיא என்பதன் காரணவினைப் பொருளான ‘பாவம் செய்யவைத்தல்’ என்பதையும், ‘அவனுடைய பாவத்தில்’ என்ற இரண்டாம் בְ தொடரையும் ஒன்றாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் பொதுப்பட்டம் அல்ல, இஸ்ரவேலின் தேவனுடைய தனிப்பெயர் நேரடியாக உள்ளது; ஆகவே அதை ஒலிபெயர்த்து வழங்குகிறது.
- issue: யெரொபெயாமின் பாவத்தின் இயல்பு
  choice: பொதுவாக ‘பாவம்’ என்றே விடப்பட்டுள்ளது
  alternative: ஒரு குறிப்பிட்ட வழிபாட்டு அல்லது சமயக் குற்றமாக விளக்குதல்
  rationale: இவ்வசனம் அந்தப் பாவத்தை இங்கு விரிவாக வரையறுக்கவில்லை; எனவே எந்தச் சமய மரபின் தனிப்பட்ட விளக்கத்தையும் உரைக்குள் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. முந்தைய வசனத்துடன் உள்ள காரணத் தொடர்பைத் தெளிவாக்க ‘இது நிகழ்ந்தது’ சேர்க்கப்பட்டுள்ளது; புதிய நிகழ்வு எதுவும் அறிமுகப்படுத்தப்படவில்லை. ‘வழியில் நடந்தான்’ என்ற வேதாகம உருவகம் இயல்பாக இருப்பதால் பாதுகாக்கப்பட்டுள்ளது.
