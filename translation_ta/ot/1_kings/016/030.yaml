source:
  edition: WLC
  text: וַ/יַּ֨עַשׂ אַחְאָ֧ב בֶּן עָמְרִ֛י הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה מִ/כֹּ֖ל אֲשֶׁ֥ר לְ/פָנָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/030.yaml
  text: Ahab son of Omri did what was evil in the sight of Yahweh[b][a], more than all who were before him.
translation:
  language: ta
  text: உம்ரியின் மகன் ஆகாப், தனக்கு முன்பிருந்த அனைவரையும்விட[b] யாவேயின் பார்வையில்[a] தீமையானதைச் செய்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில் சொல்லுக்குச் சொல்: ‘யாவேயின் கண்களில்.’'
    reason: lexical_alternative
  - marker: b
    text: 'அல்லது: ‘தனக்கு முன் வாழ்ந்த அனைவரையும்விட.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: செய்தான்
  rationale: עשה என்ற வினைச்சொல் இங்கு ‘தீமையானதை’ என்ற பொருளுடன் வந்து தீமை செய்வதைக் குறிக்கிறது; ‘செய்தான்’ என்பது எபிரெய வழக்கை இயல்பான தமிழில் காக்கிறது.
- source_word: הָרַע
  choice: தீமையானதை
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் இந்த உரிச்சொல், ‘தீமையானது’ அல்லது ‘தீமை’ என்பதைக் குறிக்கிறது. ‘தீமையானதைச் செய்தான்’ என்பது பொருளையும் இயல்பான தமிழ் நடையையும் காக்கிறது.
- source_word: בְּעֵינֵי יְהוָה
  choice: யாவேயின் பார்வையில்
  rationale: சொல்லுக்குச் சொல் ‘யாவேயின் கண்களில்’ என்றாலும், இது யாவேயின் மதிப்பீட்டின்படி என்பதைக் குறிக்கும் எபிரெய மரபுத்தொடர்; ‘பார்வையில்’ என்பது தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் கடவுளின் தனிப்பெயரான நான்கெழுத்துப் பெயர் நேரடியாக உள்ளது; அதை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ‘யாவே’ என்று ஒலிபெயர்க்கிறது.
- source_word: מִכֹּל אֲשֶׁר לְפָנָיו
  choice: தனக்கு முன்பிருந்த அனைவரையும்விட
  rationale: ஒப்பீட்டைக் குறிக்கும் מִן மற்றும் காலப்பொருளில் வரும் ‘அவனுக்கு முன்’ ஆகியவற்றை இணைத்து, ஆகாப் தனக்கு முன்பிருந்த அனைவரையும் தீமையில் மிஞ்சினான் என்ற பொருளை இயல்பாகத் தருகிறது.
- source_word: לְפָנָיו
  choice: தனக்கு முன்பிருந்த
  rationale: சொல்லுக்குச் சொல் ‘அவனுக்கு முன்’ என்றாலும், இங்கு கால வரிசையில் முன்னிருந்தவர்களைக் குறிக்கிறது; அந்தத் தொடர்பைத் தமிழில் தெளிவாக்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலவசனம் தனிப்பட்ட இறைப் பெயரையே பயன்படுத்துகிறது. அதனைப் பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் தன்மையைப் பாதுகாக்கிறது.
- issue: ‘அவனுக்கு முன்பிருந்த அனைவரும்’ என்பவர்கள் யார் என்பது
  choice: அனைவரும் என்று பொதுவாகவே வைத்தல்
  alternative: முந்தைய அரசர்கள் என்று வெளிப்படுத்துதல்
  rationale: சூழலில் முந்தைய இஸ்ரவேல் அரசர்கள் குறிக்கப்படலாம்; ஆனாலும் இந்த வசனத்தின் எபிரெய உரை ‘அரசர்கள்’ என்று வெளிப்படையாகச் சொல்லாததால், அந்தத் தெளிவின்மையை மொழிபெயர்ப்பில் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் மதிப்பீட்டு மரபுத்தொடர் இயல்பான தமிழாக்கமாக வழங்கப்பட்டு, அதன் நேரடிச் சொல்வடிவு அடிக்குறிப்பில் காக்கப்பட்டுள்ளது.
