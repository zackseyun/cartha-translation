  yaml_path: translation/ot/1_kings/016/006.yaml
  text: Baasha slept with his fathers and was buried in Tirzah[a], and Elah his son reigned in his place.
translation:
  language: ta
  text: பாஷா தன் மூதாதையரோடு நித்திரையடைந்து, திர்சாவில் அடக்கம் செய்யப்பட்டான். அவனுக்குப் பதிலாக அவன் மகன் ஏலா அரசனானான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: தன் மூதாதையரோடு நித்திரையடைந்து
  rationale: அரசனின் மரணத்தைக் குறிக்கும் வழக்கமான எபிரெய மறைவுச் சொற்றொடரைப் பாதுகாக்கிறது. தமிழில் ‘தந்தையரோடு’ என்பது உடனடி தந்தையரை மட்டும் குறிப்பதுபோல் புரியக்கூடும் என்பதால் אֲבֹתָיו என்பதற்கு இயல்பான ‘மூதாதையர்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: וַיִּקָּבֵר
  choice: அடக்கம் செய்யப்பட்டான்
  rationale: நிஃபால் வடிவத்தின் செயப்பாட்டு பொருளை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: בְּתִרְצָה
  choice: திர்சாவில்
  rationale: בְּ என்ற இடப்பொருளையும் திர்சா என்ற ஊர்ப்பெயரையும் நேரடியாகத் தருகிறது.
- source_word: וַיִּמְלֹךְ
  choice: அரசனானான்
  rationale: இந்த அரசுரிமைத் தொடர்ச்சி அறிவிப்பில் வினைச்சொல் புதிய அரசன் ஆட்சியை ஏற்றதைச் சுருக்கமாகக் குறிக்கிறது; ‘அரசாண்டான்’ என்பதும் சாத்தியம், ஆனால் இங்கு பதவியேற்ற தொடர்ச்சியை ‘அரசனானான்’ தெளிவுபடுத்துகிறது.
- source_word: אֵלָה בְנוֹ
  choice: அவன் மகன் ஏலா
  rationale: எபிரெய உரையின் உறவைத் தெளிவாகப் பாதுகாத்து, தமிழின் இயல்பான சொல் வரிசையைப் பின்பற்றுகிறது.
- source_word: תַּחְתָּיו
  choice: அவனுக்குப் பதிலாக
  rationale: அரசுரிமைத் தொடர்ச்சியில் ஒருவரின் இடத்தை மற்றொருவர் ஏற்றுக்கொள்வதைத் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘மூதாதையரோடு நித்திரையடைந்தான்’ என்ற மரண மரபுத்தொடரின் பொருள்
  choice: மரபுத்தொடரை உரையில் பாதுகாத்தல்
  alternative: ‘இறந்தான்’ என்று விளக்கமாக மொழிபெயர்த்தல்
  rationale: மூலத்தின் அரச மறைவுச் சூத்திரத்தையும் அதன் உருவகத் தன்மையையும் காக்கிறது; மறுமை நிலை குறித்த கூடுதல் கோட்பாட்டை மொழிபெயர்ப்பு சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான வரலாற்று நடை. தமிழில் தவறாகக் குறுகிய பொருள் தரக்கூடிய ‘தந்தையர்’ என்பதற்குப் பதிலாக ‘மூதாதையர்’ பயன்படுத்தப்பட்டது. தேவையற்ற அடிக்குறிப்பு இன்றி மூல மரபுத்தொடர் தெளிவாக வைக்கப்பட்டது.
