source:
  edition: WLC
  text: וַ/יַּעֲלֶ֥ה עָמְרִ֛י וְ/כָל יִשְׂרָאֵ֥ל עִמּ֖/וֹ מִֽ/גִּבְּת֑וֹן וַ/יָּצֻ֖רוּ עַל תִּרְצָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/017.yaml
  text: Then Omri and all Israel with him went up from Gibbethon[a], and they laid siege to Tirzah.
translation:
  language: ta
  text: அப்போது ஒம்ரியும் அவனோடு இருந்த இஸ்ரவேலர் அனைவரும் கிபெத்தோனிலிருந்து ஏறிச் சென்று[a], திர்சாவை முற்றுகையிட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “புறப்பட்டுச் சென்று.” எபிரெயச் சொல் நேரடியாக “மேலே சென்று” என்று பொருள்படலாம்; இங்கு அது நில அமைப்பையோ படையின் முன்னேற்றத்தையோ சுட்டக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלֶה
  choice: ஏறிச் சென்று
  rationale: עלה என்பதன் அடிப்படை இயக்கப் பொருளான ‘மேலே செல்லுதல்/ஏறிச் செல்லுதல்’ என்பதைக் காக்கிறது. இது நில அமைப்பையோ படை முன்னேற்றத்தையோ குறிக்கலாம் என்பதால், ‘படையெடுத்துச் சென்று’ என்று மிகையாகக் குறிப்பாக்கவில்லை.
- source_word: עָמְרִי
  choice: ஒம்ரி
  rationale: எபிரெய தனிப்பெயரின் தமிழில் எளிதில் அறியத்தக்க ஒலிபெயர்ப்பு.
- source_word: וְכָל יִשְׂרָאֵל עִמּוֹ
  choice: அவனோடு இருந்த இஸ்ரவேலர் அனைவரும்
  rationale: எபிரெயத்தில் உள்ள ‘அவனோடு’ மற்றும் ‘இஸ்ரவேல் முழுவதும்’ என்ற கூட்டுப் பொருளை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது; இச்சூழலில் ஒம்ரியுடன் இருந்த மக்களையோ படையினரையோ குறிக்கும் நுட்பத்தைத் தேவையின்றி ஒன்றாகத் தீர்மானிக்கவில்லை.
- source_word: מִגִּבְּתוֹן
  choice: கிபெத்தோனிலிருந்து
  rationale: מן என்ற முன்னொட்டின் ‘இலிருந்து’ என்ற பொருளையும் இடப்பெயரையும் நேரடியாகத் தருகிறது.
- source_word: וַיָּצֻרוּ
  choice: முற்றுகையிட்டார்கள்
  rationale: צור என்ற வினையின் இங்குள்ள இராணுவப் பொருளான ஒரு நகரத்தைச் சூழ்ந்து முற்றுகையிடுதலைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: עַל תִּרְצָה
  choice: திர்சாவை
  rationale: முற்றுகை வினையுடன் עַל செயல் நோக்கிச் செலுத்தப்படும் இலக்கைக் குறிக்கிறது; தமிழில் இரண்டாம் வேற்றுமை உருபு இயல்பான அமைப்பு.
