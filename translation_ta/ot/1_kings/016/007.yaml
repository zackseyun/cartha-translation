  source_fidelity: வரைவில் எபிரெய மூலத்தின் முக்கிய கூறுகள்—யெகூ வழியான தீர்க்கதரிசன வார்த்தை, பாஷாவுக்கும் அவன் வீட்டாருக்கும் எதிரான கண்டனம், யாவேயைக் கோபமூட்டுதல், யெரொபெயாமின் வீட்டைப் போன்ற நிலை, மற்றும் இறுதி ஆண்பால் ஒருமைச் சுட்டின் தெளிவின்மை—பெரும்பாலும் காக்கப்பட்டுள்ளன. ஆனால் ‘குடும்பம்’ மட்டும் בֵּיתוֹ/בֵּית יָרָבְעָם என்பதன் இச்சூழலிலுள்ள வம்சக் குறிப்பை போதியளவு வெளிப்படுத்தவில்லை. மேலும், இறுதித் தமிழ்ச் சொற்றொடர் கூட்டுப்பொருள் வாசிப்பை முதன்மைப்படுத்தலாம்; ஆயினும் அடிக்குறிப்பு தனிப்பட்ட வாசிப்பையும் தெளிவாகப் பாதுகாக்க வேண்டும்.
  naturalness: ‘பொல்லாப்பான அனைத்தையும் செய்து’ என்பதைவிட ‘எல்லாத் தீமைகளையும் செய்து’ நவீனத் தரத் தமிழில் இயல்பானது. ‘அவனுடைய குடும்பத்துக்கும்’ என்பதற்குப் பதில் ‘அவன் வம்சத்துக்கும்’ அரசவம்சச் சூழலுக்கு நேர்த்தியானது. நீண்ட காரணத் தொடரை ஒரே வாக்கியமாக இணைப்பது மூலத்தின் தொடர்பையும் தமிழின் ஓட்டத்தையும் மேம்படுத்துகிறது.
  terminology: யாவே, தீர்க்கதரிசி, வார்த்தை ஆகியவை பொருத்தமானவை. பெயர்கள் யெகூ, அனானி, பாஷா, யெரொபெயாம் என ஒரே முறையில் வைக்கப்படுகின்றன. בַּיִת என்பதற்கு இவ்விடத்தில் ‘வம்சம்’ பயன்படுத்தப்படுகிறது; இறுதி சுட்டுக்கு அதே வம்சத்தைச் சுட்டும் கூட்டுப்பொருள் வாசிப்பு முதன்மையாகத் தரப்படுகிறது; மாற்று வாசிப்பு அடிக்குறிப்பில் உள்ளது.
  issues:
  - severity: medium
    issue: ‘குடும்பம்’ என்ற சொல் அரசவம்சக் குறிப்பை மங்கலாக்குகிறது.
    rationale: בֵּיתוֹ மற்றும் בֵּית יָרָבְעָם இங்கு வெறும் வீட்டாரை மட்டும் அல்ல, ஆளும் வம்சத்தையும் குறிக்கின்றன. ‘வம்சம்’ என்பது தமிழில் சூழலுக்கேற்றும் தெளிவானதுமாகும்.
  - severity: low
    issue: ‘பொல்லாப்பான அனைத்தையும்’ என்ற நடை இயல்பாக இல்லை.
    rationale: ‘எல்லாத் தீமைகளையும்’ என்பது மூலத்தின் כָּל־הָרָעָה என்பதற்கு இயல்பான நவீனத் தமிழ் இணையாகும்.
  - severity: low
    issue: மூலத்தின் காரணத் தொடர் இரண்டு தனி வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது.
    rationale: அரைப்புள்ளியால் இணைத்தால், ‘வார்த்தை வந்தது’ என்பதற்கான இரு காரணங்களும் தெளிவாக இணையும்.
  revised_text: மேலும், அனானியின் மகனான தீர்க்கதரிசி யெகூவின் மூலம் பாஷாவுக்கும் அவன் வம்சத்துக்கும் எதிராக யாவேயின் வார்த்தை வந்தது; யாவேயின் பார்வையில் அவன் செய்த எல்லாத் தீமைகளினாலும், தன் கைகளின் செயல்களால் அவருக்குக் கோபமூட்டி, யெரொபெயாமின் வம்சத்தைப் போல ஆனதினாலும், மேலும் அந்த வம்சத்தை அழித்ததினாலும் அது வந்தது.[a]
  revised_footnotes:
  - marker: a
    text: எபிரெயில் ‘அதை’ என வரும் ஆண்பால் ஒருமைச் சுட்டுப்பெயரை, ‘அவனைக் கொன்றதினாலும்’ என்றும் மொழிபெயர்க்கலாம். அது யெரொபெயாமையே குறிக்கலாம்; ஆனால் சூழலில் யெரொபெயாமின் வம்சத்தை ஒரு கூட்டுப்பொருளாகக் குறிப்பதே அதிகம் பொருந்துகிறது.
    reason: אֹתוֹ என்ற ஆண்பால் ஒருமைச் சுட்டுப்பெயர் யெரொபெயாமையா அல்லது அவன் வம்சத்தை கூட்டுப்பொருளாகவா குறிக்கிறது என்ற உண்மையான தெளிவின்மையைப் பேணுகிறது.
  revision_rationale: அரசவம்சச் சூழலிலுள்ள ‘வீடு’ என்பதன் பொருளை ‘வம்சம்’ எனத் தெளிவுபடுத்தி, தமிழ்நடையை இயல்பாக்கி, தீர்ப்புச் செய்தி வருவதற்கான காரணத் தொடரை மூலத்திற்கு நெருக்கமாக ஒரே வாக்கியத்தில் இணைத்துள்ளேன். இறுதிப் பொருளில் உடனடி முன்னோடியான யெரொபெயாமின் வம்சத்தை முதன்மை வாசிப்பாக வைத்துள்ள போதும், தனிப்பட்ட யெரொபெயாமைக் குறிக்கும் இலக்கணச் சாத்தியத்தை அடிக்குறிப்பில் பாதுகாத்துள்ளேன்.
