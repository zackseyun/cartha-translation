  to: மேலும், அனானியின் மகனான தீர்க்கதரிசி யெகூவின் மூலம் பாஷாவுக்கும் அவன் வம்சத்துக்கும் எதிராக யாவேயின் வார்த்தை வந்தது; யாவேயின் பார்வையில் அவன் செய்த எல்லாத் தீமைகளினாலும், தன் கைகளின் செயல்களால் அவருக்குக் கோபமூட்டி, யெரொபெயாமின் வம்சத்தைப் போல ஆனதினாலும், மேலும் அந்த வம்சத்தை அழித்ததினாலும் அது வந்தது.[a]
