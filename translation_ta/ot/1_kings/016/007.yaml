base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/007.yaml
  text: And also through Jehu son of Hanani the prophet[a], the word of Yahweh came against Baasha and against his house, both because of all the evil that he did in the sight of Yahweh, provoking him to anger by the work of his hands, by becoming like the house of Jeroboam, and because he struck him down.
translation:
  language: ta
  text: மேலும், அனானியின் மகனான தீர்க்கதரிசி யெகூவின் மூலம் பாஷாவுக்கும் அவன் வம்சத்துக்கும் எதிராக யாவேயின் வார்த்தை வந்தது; யாவேயின் பார்வையில் அவன் செய்த எல்லாத் தீமைகளினாலும், தன் கைகளின் செயல்களால் அவருக்குக் கோபமூட்டி, யெரொபெயாமின் வம்சத்தைப் போல ஆனதினாலும், மேலும் அந்த வம்சத்தை அழித்ததினாலும் அது வந்தது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில் ‘அதை’ என வரும் ஆண்பால் ஒருமைச் சுட்டுப்பெயரை, ‘அவனைக் கொன்றதினாலும்’ என்றும் மொழிபெயர்க்கலாம். அது யெரொபெயாமையே குறிக்கலாம்; ஆனால் சூழலில் யெரொபெயாமின் வம்சத்தை ஒரு கூட்டுப்பொருளாகக் குறிப்பதே அதிகம் பொருந்துகிறது.
    reason: אֹתוֹ என்ற ஆண்பால் ஒருமைச் சுட்டுப்பெயர் யெரொபெயாமையா அல்லது அவன் வம்சத்தை கூட்டுப்பொருளாகவா குறிக்கிறது என்ற உண்மையான தெளிவின்மையைப் பேணுகிறது.
lexical_decisions:
- source_word: וְגַם
  choice: மேலும்
  rationale: முந்தைய நியாயத்தீர்ப்புச் செய்தியுடன் இவ்வசனத்தை இணைத்து, கூடுதல் கருத்தை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: בְּיַד
  choice: மூலம்
  rationale: தீர்க்கதரிசியான யெகூ, யாவேயின் வார்த்தையை எடுத்துரைக்கும் இடைநிலையாளர் என்பதை எபிரெயச் சொற்றொடரின் கருவிப்பொருளுக்கு ஏற்றவாறு தெரிவிக்கிறது.
- source_word: דְּבַר יְהוָה
  choice: யாவேயின் வார்த்தை
  rationale: தீர்க்கதரிசனச் சூத்திரத்தைப் பேணுகிறது; יהוה என்ற உடன்படிக்கைப் பெயரை ‘யாவே’ என்று ஒலிபெயர்க்கிறது.
- source_word: אֶל ... וְאֶל
  choice: '...க்கும் ...க்கும் எதிராக'
  rationale: אֶל என்பதன் அடிப்படைப் பொருள் ‘நோக்கி/இடம்’ என்றாலும், இங்கு வரும் கண்டனமும் நியாயத்தீர்ப்பும் காரணமாக எதிர்ப்பொருள் சூழலுக்கு ஏற்றது.
- source_word: בֵּיתוֹ
  choice: அவனுடைய குடும்பம்
  rationale: בַּיִת என்பதன் ‘வீடு/குடும்பம்/வம்சம்’ என்ற விரிவை வாசிக்க எளிதான தமிழில் தருகிறது; இச்சூழலில் ஆளும் வம்சமும் இதில் அடங்கும்.
- source_word: וְעַל כָּל הָרָעָה
  choice: ஏனெனில் ... பொல்லாப்பான அனைத்தையும்
  rationale: עַל இங்கு நியாயத்தீர்ப்புக்கான காரணத்தை அறிமுகப்படுத்துவதால் காரணப்பொருளை வெளிப்படையாகத் தருகிறது.
- source_word: בְּעֵינֵי יְהוָה
  choice: யாவேயின் பார்வையில்
  rationale: தெய்வீக மதிப்பீட்டைக் குறிக்கும் எபிரெயச் சொற்றொடரின் உருவகத்தை இயல்பான தமிழில் பேணுகிறது.
- source_word: לְהַכְעִיסוֹ
  choice: அவருக்குக் கோபமூட்டி
  rationale: வினையின் காரணவினைப் பொருளைத் தெளிவாகத் தெரிவிக்கிறது; மரியாதைப் பயன்பாட்டால் சுட்டுப்பெயர் யாவேயைக் குறிக்கிறது என்பதும் தெளிவாகிறது.
- source_word: בְּמַעֲשֵׂה יָדָיו
  choice: தன் கைகளின் செயல்களால்
  rationale: வெறும் ‘செயல்கள்’ என்று பொதுமைப்படுத்தாமல், மூலத்தின் உயிரோட்டமான உடல்-உறுப்பு மரபுத்தொடரைப் பேணுகிறது.
- source_word: לִהְיוֹת כְּבֵית יָרָבְעָם
  choice: யெரொபெயாமின் குடும்பத்தைப் போல ஆனான்
  rationale: பாஷா யெரொபெயாமின் குடும்பத்தைப் போன்ற நிலைக்கு வந்ததை இயல்பாகவும் தெளிவாகவும் கூறுகிறது.
- source_word: וְעַל אֲשֶׁר הִכָּה אֹתוֹ
  choice: மேலும், அந்தக் குடும்பத்தை அழித்துப்போட்டான்
  rationale: הכה என்பதன் தாக்கி வீழ்த்தும்/அழிக்கும் பொருளையும், அருகிலுள்ள ‘யெரொபெயாமின் குடும்பம்’ என்பதைக் கூட்டுப் பொருளில் சுட்டும் சாத்தியத்தையும் முதன்மை வாசிப்பாகத் தருகிறது; ஆண்பால் ஒருமை பின்னொட்டின் உண்மையான மாற்றுச் சாத்தியம் அடிக்குறிப்பில் பேணப்படுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் நான்கு எழுத்துகளைக் கொண்ட தனிப்பெயர் நேரடியாக இருப்பதால், பட்டப்பெயராக மாற்றாமல் பொதுவாக ஏற்றுக்கொள்ளப்படும் தமிழ் ஒலிபெயர்ப்பில் வழங்கப்படுகிறது.
- issue: אֹתוֹ என்ற ஆண்பால் ஒருமைச் சுட்டின் குறிப்பு
  choice: யெரொபெயாமின் குடும்பத்தை கூட்டுப் பொருளில் சுட்டுகிறது
  alternative: யெரொபெயாமையே தனிப்பட்ட முறையில் சுட்டுகிறது
  rationale: உடனடி சூழலில் ‘யெரொபெயாமின் குடும்பம்’ உள்ளது; எபிரெயில் ‘வீடு/குடும்பம்’ ஆண்பால் ஒருமை என்பதால் பின்னொட்டு அதனுடன் இலக்கண ரீதியாகப் பொருந்துகிறது. இருப்பினும் ஒருவரைச் சுட்டும் வாசிப்பும் இலக்கண ரீதியாக சாத்தியமானதால் அதைத் தீர்மானமாக நீக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகருக்குப் புரியும் வகையிலும் தீர்க்கதரிசன நியாயத்தீர்ப்பின் கண்ணியமான தொனியைப் பேணும் வகையிலும் வடிவமைக்கப்பட்டது. ‘குடும்பம்’ என்பது வீட்டார் மற்றும் ஆளும் வம்சம் ஆகிய இரு நிழற்பொருள்களையும் சுமக்கிறது; அடிக்குறிப்பு குறி தெளிவின்மை உள்ள இறுதிச் சொற்றொடரிலேயே வைக்கப்பட்டுள்ளது.
