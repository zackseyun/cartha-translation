  text: וַ/יְהִי֙ הֲ/נָקֵ֣ל לֶכְתּ֔/וֹ בְּ/חַטֹּ֖אות יָרָבְעָ֣ם בֶּן נְבָ֑ט וַ/יִּקַּ֨ח אִשָּׁ֜ה אֶת אִיזֶ֗בֶל בַּת אֶתְבַּ֨עַל֙ מֶ֣לֶךְ צִידֹנִ֔ים וַ/יֵּ֨לֶךְ֙ וַֽ/יַּעֲבֹ֣ד אֶת הַ/בַּ֔עַל וַ/יִּשְׁתַּ֖חוּ לֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/031.yaml
  text: And as if it were a light thing for him to walk in the sins of Jeroboam son of Nebat[a], he took Jezebel daughter of Ethbaal, king of the Sidonians, as his wife, and went and served Baal and bowed down to him.
translation:
  language: ta
  text: நேபாத்தின் மகன் யெரொபெயாமின் பாவங்களில் நடப்பது அவனுக்கு அற்பமான காரியமாயிருந்தது போல,[a] சீதோனியரின் அரசனான எத்பாகாலின் மகள் யேசபேலைத் தனக்கு மனைவியாக எடுத்துக்கொண்டான். பிறகு அவன் போய் பாகாலுக்குப் பணிசெய்து, அவனை வணங்கினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நேபாத்தின் மகன் யெரொபெயாமின் பாவங்களில் நடப்பது அவனுக்கு அற்பமான காரியமாயிருந்ததா?” எபிரெயத் தொடக்கம் கேள்வியாகவும் புரிந்துகொள்ளப்படலாம்; ஆகாப் அந்தப் பாவங்களை அற்பமாகக் கருதி, அதைவிட மேலும் சென்றதை இது வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲנָקֵל
  choice: அவனுக்கு அற்பமான காரியமாக இருந்ததுபோல்
  rationale: இந்த எபிரெய மொழிநடை, யெரொபெயாமின் பாவங்களை ஆகாப் அற்பமாகக் கருதியதையும், அதற்கு அப்பால் அவன் இன்னும் மோசமாகச் சென்றதையும் உணர்த்துகிறது. கேள்வி வடிவத்தின் சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: לֶכְתּוֹ בְּחַטֹּאות
  choice: பாவங்களின்படி நடப்பது
  rationale: הלך என்பதன் வாழ்க்கைநடத்தை குறிக்கும் உருவகத்தை ‘நடப்பது’ காக்கிறது; தமிழ் வழக்கில் ‘பாவங்களில் நடப்பது’ என்பதைக் காட்டிலும் ‘பாவங்களின்படி நடப்பது’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: וַיִּקַּח אִשָּׁה אֶת אִיזֶבֶל
  choice: யேசபேலைத் தனக்கு மனைவியாக எடுத்துக்கொண்டான்
  rationale: ‘ஒரு மனைவியாக எடுத்தான்’ என்ற எபிரெய அமைப்பை இயல்பான தமிழில் காக்கிறது; வெறுமனே ‘திருமணம் செய்தான்’ என்று சுருக்கவில்லை.
- source_word: אֶתְבַּעַל
  choice: எத்பாகால்
  rationale: எபிரெய பெயரின் ஒலிப்பெயர்ப்பு; பெயருக்குள் தெளிவாகத் தோன்றும் ‘பாகால்’ கூறையும் பாதுகாக்கிறது.
- source_word: צִידֹנִים
  choice: சீதோனியர்
  rationale: பன்மை இனப்பெயரை இயல்பான தமிழ் வடிவில் தருகிறது.
- source_word: וַיַּעֲבֹד אֶת הַבַּעַל
  choice: பாகாலுக்குப் பணிசெய்து
  rationale: עבד என்பதன் வழிபாட்டு சார்ந்த ‘சேவை செய்தல்’ பொருளைத் தருகிறது; அடுத்து வரும் பணிதல் செயலில் இருந்து இதை வேறுபடுத்துகிறது.
- source_word: וַיִּשְׁתַּחוּ לוֹ
  choice: அவனைப் பணிந்துகொண்டான்
  rationale: உடலைத் தாழ்த்திப் பணியும் செயலைக் குறிக்கும் வினையின் குறிப்பான பொருளைக் காக்கிறது; பொதுவான ‘வழிபட்டான்’ என்று இரு வினைகளையும் ஒன்றாக்கவில்லை.
theological_decisions:
- issue: யெரொபெயாமின் பாவங்களிலிருந்து பாகால் வழிபாட்டுக்குச் செல்லும் ஆகாபின் விசுவாசத் துரோகத்தின் தீவிரமாதல்
  choice: யெரொபெயாமின் பாவங்கள் அற்பமானவைபோல் ஆகாப் நடந்துகொண்டு, திருமண உறவுக்குப் பின் பாகாலுக்குப் பணிசெய்து பணிந்தான் என்ற தீவிரமாதலை வெளிப்படுத்துதல்
  alternative: தொடக்கத்தை ‘யெரொபெயாமின் பாவங்களின்படி நடப்பது அவனுக்கு அற்பமான காரியமாயிருந்ததா?’ என்ற நேரடி வினாவாக மொழிபெயர்த்தல்
  rationale: הֲנָקֵל என்ற சொல்லின் வினா/மொழிநடைத் தன்மையும் அரசர்கள் நூலின் சூழலும், முந்தைய பாவத்தைச் சிறிதாகக் கருதி அதைவிட மேலான விசுவாசத் துரோகத்துக்குச் சென்றதை வலியுறுத்துகின்றன. முதன்மை உரை இந்த ஓட்டத்தை இயல்பாகத் தருகிறது; மாற்று இலக்கண வடிவம் அடிக்குறிப்பில் வைக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘நடப்பது,’ ‘பணிசெய்து,’ ‘பணிந்துகொண்டான்’ என்பவை மூலத்தின் தனித்தனி உருவகங்களையும் செயல்களையும் காக்கின்றன. பெயர்கள் தமிழ் வேதாகமப் பயன்பாட்டுக்கு நெருக்கமான ஒலிப்பெயர்ப்பில் தரப்பட்டுள்ளன.
