base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/033.yaml
  text: Ahab also made the Asherah[a], and Ahab went on to do more to provoke Yahweh, the God of Israel, than all the kings of Israel who were before him.
translation:
  language: ta
  text: ஆகாப் அசேராவையும்[a] செய்தான். தனக்கு முன்பு இருந்த இஸ்ரவேலின் எல்லா அரசர்களையும் விட, இஸ்ரவேலின் கடவுளாகிய யாவேக்குக் கோபமூட்டுவதில் ஆகாப் மேலும் அதிகமாகச் செய்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அசேரா கம்பம்.’ எபிரெயச் சொல் அசேரா தேவியையோ அவளுடன் தொடர்புடைய வழிபாட்டுப் பொருளையோ குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: செய்தான்
  rationale: עשה என்பதன் நேரடியான பொருள் ‘செய்/உருவாக்கு.’ வழிபாட்டுப் பொருளை ‘நிறுவினான்’ என்பது சூழலுக்குப் பொருந்தக்கூடியதாயினும், எபிரெய வினை அதைவிடப் பொதுவானது; ஆகவே ‘செய்தான்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: הָאֲשֵׁרָה
  choice: அசேரா
  rationale: אֲשֵׁרָה என்பது அசேரா தேவியையோ அவளுடன் தொடர்புடைய வழிபாட்டுப் பொருளையோ குறிக்கலாம். ஒலிபெயர்ப்பு மூலத்தின் தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: וַיּוֹסֶף ... לַעֲשׂוֹת
  choice: இன்னும் அதிகமாகச் செய்தான்
  rationale: יסף + வினையெச்சக் கட்டமைப்பு தொடர்ச்சியையோ கூடுதலையோ குறிக்கிறது; தொடர்ந்து வரும் ஒப்பீட்டுச் சொற்றொடருடன் சேர்ந்து, முந்தைய அரசர்களைவிட அதிகமாகச் செய்தான் என்ற தீவிரத்தை இது இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לְהַכְעִיס
  choice: கோபமூட்டும்
  rationale: כעס என்பதன் ஹிஃபில் வடிவம் ‘கோபப்படுத்துதல்/கோபமூட்டுதல்’ என்ற காரணவினைப் பொருளைக் கொண்டது. ‘கோபமூட்டும்’ என்பது அதைச் சுருக்கமாகவும் தெளிவாகவும் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநாமமான יהוה ஒரு பொதுப் பட்டமாக மாற்றப்படாமல், தமிழில் தெளிவான ஒலிபெயர்ப்பாக வழங்கப்படுகிறது.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கடவுள்
  rationale: இந்த இணைப்புச் சொற்றொடர் யாவேவை இஸ்ரவேலின் கடவுளாக அடையாளப்படுத்துகிறது.
- source_word: מִכֹּל מַלְכֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் எல்லா அரசர்களையும்விட
  rationale: ஒப்பீட்டைக் குறிக்கும் מִן தமிழில் இயல்பாக ‘எல்லா ... விட’ என்று தரப்பட்டுள்ளது.
- source_word: אֲשֶׁר הָיוּ לְפָנָיו
  choice: தனக்கு முன்பு இருந்த
  rationale: இச்சொற்றொடர் ஆகாபுக்கு முன்னிருந்த அரசர்களைக் குறிக்கிறது; ‘தனக்கு முன்பு இருந்த’ என்பது மூலத்திற்கு நெருக்கமாகவும் நவீன தமிழில் தெளிவாகவும் உள்ளது.
theological_decisions:
- issue: אֲשֵׁרָה என்பதன் குறிப்பு
  choice: முதன்மை உரையில் ‘அசேரா’ என்ற சொல்லைத் தக்கவைத்து, அது தேவியையா வழிபாட்டுப் பொருளையா குறிக்கிறது என்பதைத் தீர்மானிக்காமல் விடுதல்
  alternative: ‘அசேரா கம்பம்’ அல்லது ‘அசேரா தேவி’
  rationale: இந்த எபிரெயச் சொல் தேவியையோ அவளுடன் தொடர்புடைய வழிபாட்டுச் சின்னத்தையோ குறிக்கக்கூடும். வசனம் எந்தப் பொருளை நோக்குகிறது என்பதைத் தெளிவாகக் குறிப்பிடாததால், மொழிபெயர்ப்பு அந்த உண்மையான தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified நடையில் மொழிபெயர்க்கப்பட்டது. ‘அரசர்கள்,’ ‘கோபமூட்டும் செயல்கள்’ போன்ற இயல்பான சொற்கள் பயன்படுத்தப்பட்டுள்ளன; மூலத்தில் உள்ள அசேரா குறித்த தெளிவின்மை அடிக்குறிப்புடன் பாதுகாக்கப்பட்டுள்ளது.
