  yaml_path: translation/ot/1_kings/016/018.yaml
  text: And when Zimri saw that the city had been captured[a], he went into the citadel of the king’s house and burned the king’s house over himself with fire[b], and died.
translation:
  language: ta
  text: சிம்ரி நகரம் கைப்பற்றப்பட்டதைக் கண்டபோது, அரசனின் அரண்மனைக் கோட்டைக்குள்[a] சென்று, அரசனின் மாளிகையைத் தன்மேல் நெருப்பால் எரித்து[b] இறந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அரண்மனைக் கோட்டை” என்பதற்கான எபிரெயச் சொல் அரண்மனை, பாதுகாப்புடைய அரசக் கட்டடம், அல்லது கோட்டை ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்கு சொல்: “அரசனின் வீட்டைத் தன்மேல் நெருப்பால் எரித்தான்.” மாளிகையை எரியவைத்து, அதில் தானும் இருந்து சிம்ரி தன்னை அழித்துக்கொண்டதை இது விவரிக்கிறது.'
    reason: cultural_note
lexical_decisions:
- source_word: כִּ/רְאוֹת
  choice: கண்டபோது
  rationale: כ־ உடன் வரும் வினையெச்சக் கட்டமைப்பு இங்கு காலச் சூழலைக் குறிக்கிறது; நவீன தமிழில் இயல்பான காலத் தொடர்பைத் தருகிறது.
- source_word: נִלְכְּדָה הָעִיר
  choice: நகரம் கைப்பற்றப்பட்டதை
  rationale: לכד என்பதன் நிஃபால் வடிவம் நகரம் எதிரிகளால் பிடிக்கப்பட்டதைக் குறிக்கிறது; தமிழில் செயப்பாட்டு பொருள் தெளிவாகப் பாதுகாக்கப்படுகிறது.
- source_word: אַרְמוֹן בֵּית הַמֶּלֶךְ
  choice: அரண்மனையின் கோட்டை
  rationale: אַרְמוֹן என்பது அரண்மனை, கோட்டை அல்லது பாதுகாப்புடைய அரசக் கட்டடத்தைக் குறிக்கலாம். தொடர்ந்து வரும் בֵּית הַמֶּלֶךְ என்பதிலிருந்து இதை வேறுபடுத்தவும், அரச இல்லத்தின் பாதுகாப்புடைய உட்பகுதி என்ற சாத்தியத்தைப் பாதுகாக்கவும் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: בֵּית מֶלֶךְ
  choice: அரசனின் மாளிகை
  rationale: சொல்லுக்கு சொல் ‘அரசனின் வீடு’; சூழலில் அரச இருப்பிடத்தைக் குறிக்கும் இயல்பான, கண்ணியமான தமிழாக ‘மாளிகை’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: וַיִּשְׂרֹף עָלָיו ... בָּאֵשׁ
  choice: தன்மேல் தீவைத்து
  rationale: எபிரெயச் சொற்றொடர் மாளிகையைத் தன்னைச் சூழ எரியவிட்டு தற்கொலை செய்த செயலைக் குறிக்கிறது. தமிழில் சுருக்கமாகவும் இயல்பாகவும் கூறப்பட்டாலும் ‘தன்மேல்’ என்பது மூலத்தின் עָלָיו கூறைத் தக்கவைக்கிறது.
- source_word: וַיָּמֹת
  choice: இறந்தான்
  rationale: முந்தைய செயலின் முடிவாக வரும் எளிய கதைத் தொடர்ச்சியைப் பாதுகாக்கிறது.
