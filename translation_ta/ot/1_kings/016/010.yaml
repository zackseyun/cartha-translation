translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான வரலாற்று உரைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் தொடர் நிகழ்வுகள் காக்கப்பட்டாலும், நீண்ட ஒரே வாக்கியத்தால் தமிழில் ஏற்படும் சுமையைத் தவிர்க்க மூன்று வாக்கியங்களாக அமைக்கப்பட்டுள்ளது. ‘அவன்’ என்ற மூலச் சுட்டுப்பெயரின் குறிப்பு தெளிவாக இருக்க இறுதி வாக்கியத்தில் ‘சிம்ரி’ மீண்டும் கூறப்பட்டுள்ளது.
