base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/010.yaml
  text: Then Zimri came in, struck him down, and killed him, in the twenty-seventh year of Asa king of Judah; and he reigned in his place.
translation:
  language: ta
  text: அப்போது சிம்ரி உள்ளே வந்து, அவனைத் தாக்கிக் கொன்றான். இது யூதாவின் அரசனான ஆசாவின் ஆட்சியின் இருபத்தேழாம் ஆண்டில் நடந்தது. பின்பு அவனுக்குப் பதிலாக சிம்ரி ஆட்சி செய்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: அப்போது ... உள்ளே வந்து
  rationale: בוא என்பது ‘வருதல்’ அல்லது ‘உள்ளே நுழைதல்’ எனப் பொருள்படும். கொலை நிகழும் சூழலில் இடத்தை ஊகித்துச் சேர்க்காமல், நுழைவை இயல்பாகக் காட்ட ‘உள்ளே வந்து’ என்று மொழிபெயர்க்கப்பட்டது; தொடர் நிகழ்வைக் காட்ட வாவ் வடிவம் ‘அப்போது’ என வெளிப்படுத்தப்பட்டது.
- source_word: זִמְרִי
  choice: சிம்ரி
  rationale: எபிரெய தனிப்பெயரின் ஒலியை நவீனத் தமிழில் இயல்பாக எழுத்துப்பெயர்த்த வடிவம்.
- source_word: וַיַּכֵּהוּ וַיְמִיתֵהוּ
  choice: அவனைத் தாக்கிக் கொன்றான்
  rationale: נכה என்பது ‘தாக்குதல்/அடித்தல்,’ מות என்பதன் ஹிஃபீல் வடிவம் ‘கொல்லுதல்.’ தமிழில் இரண்டு செயல்களின் நெருங்கிய தொடரைச் சுருக்கமின்றியும் செயற்கையான மறுபடியுரைத்தலின்றியும் ‘தாக்கிக் கொன்றான்’ இயல்பாகத் தருகிறது.
- source_word: בִּשְׁנַת עֶשְׂרִים וָשֶׁבַע לְאָסָא מֶלֶךְ יְהוּדָה
  choice: யூதாவின் அரசனான ஆசாவின் ஆட்சியின் இருபத்தேழாம் ஆண்டில்
  rationale: அரசாட்சிக் காலத்தைக் குறிக்கும் வழக்கமான காலக்குறிப்பு. לְ முன்மொழி ஆசாவின் ஆட்சியை அளவுகோலாகக் காட்டுவதால், தமிழில் ‘ஆசாவின் ஆட்சியின் ... ஆண்டில்’ என்பது தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: וַיִּמְלֹךְ
  choice: ஆட்சி செய்தான்
  rationale: מלך என்பது ‘அரசாளுதல்/ஆட்சி செய்தல்’ அல்லது ‘அரசனாதல்’ எனப் பொருள்படலாம். תחתיו உடன் வருவதால் பதவியேற்பு தெளிவாகிறது; அதேவேளை மூல வினைச்சொல்லைப் பேண ‘ஆட்சி செய்தான்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: תַּחְתָּיו
  choice: அவனுக்குப் பதிலாக
  rationale: அரச வாரிசுரிமைச் சூழலில் תחתיו என்பது முந்தைய அரசனின் இடத்தை ஏற்றதைக் குறிக்கிறது. ‘அவனுக்குப் பதிலாக’ நவீனத் தமிழில் இதைத் தெளிவாகக் காட்டுகிறது.
