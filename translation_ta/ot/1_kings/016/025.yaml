source:
  edition: WLC
  text: וַ/יַּעֲשֶׂ֥ה עָמְרִ֛י הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יָּ֕רַע מִ/כֹּ֖ל אֲשֶׁ֥ר לְ/פָנָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/025.yaml
  text: Omri did what was evil in the eyes of Yahweh[a], and he did more evil than all who were before him.
translation:
  language: ta
  text: ஒம்ரி யாவேவின் பார்வையில் தீமையானதைச் செய்தான்; தனக்கு முன்பிருந்த அனைவரையும்விட அதிகத் தீமை செய்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தனக்கு முன்பிருந்த அனைவரையும்விட அவன் அதிகத் தீயவனாக இருந்தான்.” எபிரெய வினை ஒம்ரியையே வருணிப்பதாகவோ அவனுடைய செயல்களைக் குறிப்பதாகவோ புரிந்துகொள்ளப்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשֶׂה
  choice: செய்தான்
  rationale: עשה என்பதுடன் הָרַע பொருளாக வரும் வழக்கமான மதிப்பீட்டுத் தொடரை இயல்பான தமிழில் ‘செய்தான்’ என்று வழங்குகிறது.
- source_word: הָרַע
  choice: தீமையானதை
  rationale: குறிப்புச் சுட்டியுடன் வரும் הָרַע இங்கு பெயர்ச்சொல் தன்மையில் ‘தீமையானது’ என்பதைக் குறிக்கிறது; தமிழில் வேற்றுமை உருபுடன் ‘தீமையானதை’ என்பது இயல்பானது.
- source_word: בְּעֵינֵי
  choice: பார்வையில்
  rationale: சொல்லர்த்தத்தில் ‘கண்களில்’ என்ற எபிரெய உருவகத்தை, ஒருவரின் மதிப்பீட்டின்படி என்ற பொருள் தெளிவாகத் தெரிய நவீன தமிழில் ‘பார்வையில்’ என வழங்குகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருப்பெயரான יהוה-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் அதன் தனிப்பெயர் ஒலிப்பை ‘யாவே’ என்று வழங்குகிறது.
- source_word: וַיָּרַע
  choice: அதிகத் தீமை செய்தான்
  rationale: முன் வாக்கியத்தின் செயல் சார்ந்த மதிப்பீட்டுடன் தொடர்ச்சியைப் பேணி, ஒப்பீட்டுச் சூழலில் வினையின் பொருளை இயல்பாக வெளிப்படுத்துகிறது; ‘அதிகத் தீயவனாக இருந்தான்’ என்பதும் இலக்கணரீதியாகச் சாத்தியம்.
- source_word: מִכֹּל אֲשֶׁר לְפָנָיו
  choice: தனக்கு முன்பிருந்த அனைவரையும்விட
  rationale: ‘அவனுக்கு முன்பிருந்த அனைவரையும்விட’ என்ற ஒப்பீட்டை நேரடியாகப் பேணுகிறது; எபிரெயத்தில் இவ்வசனத்திலேயே ‘அரசர்கள்’ என்பது வெளிப்படையாக இல்லாததால் அதைச் சேர்க்கவில்லை.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பெயரான திருநான்கெழுத்து நேரடியாக உள்ளது; ஆகவே பட்டப்பெயரைப் பதிலிடாமல் அதன் பெயர்த் தன்மையைப் பேணுகிறது.
- issue: וַיָּרַע என்பதன் செயல் அல்லது நபர் சார்ந்த பொருள்
  choice: அதிகத் தீமை செய்தான்
  alternative: அதிகத் தீயவனாக இருந்தான்
  rationale: சூழலில் முன் வரும் ‘தீமையானதைச் செய்தான்’ என்ற அரசர் மதிப்பீட்டுத் தொடருடன் செயல் சார்ந்த வாசிப்பு நன்றாக இணைகிறது; இருப்பினும் எபிரெய வினை உம்ரியையே தீயவன் என வருணிப்பதாகவும் புரிந்துகொள்ள முடிவதால் மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, எளிதில் புரியும், கண்ணியமான தமிழ். எபிரெய மதிப்பீட்டு மொழியின் வலிமையும் ஒப்பீட்டுத் தன்மையும் பேணப்பட்டுள்ளன; தேவையற்ற வகையில் ‘அரசர்கள்’ என்று விளக்கிச் சேர்க்கப்படவில்லை.
