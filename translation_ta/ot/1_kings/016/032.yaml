base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/032.yaml
  text: He set up an altar for Baal in the house of Baal[a], which he had built in Samaria.
translation:
  language: ta
  text: அவன் சமாரியாவில் கட்டியிருந்த பாகாலின் ஆலயத்தில்[a], பாகாலுக்காக ஒரு பலிபீடத்தை நிறுவினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பாகாலின் வீடு.” எபிரேய மூலத்தில் சொற்பட இவ்வாறே உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: நிறுவினான்
  rationale: קום என்பதன் ஹிஃபில் வடிவம் இங்கு ஒரு பலிபீடத்தை நிலைநிறுத்துதல் அல்லது அமைத்தல் எனப் பொருள்படுகிறது. ‘நிறுவினான்’ என்பது செயலைத் தெளிவாகவும் கண்ணியமான நவீன தமிழிலும் தெரிவிக்கிறது.
- source_word: מִזְבֵּחַ
  choice: ஒரு பலிபீடத்தை
  rationale: מזבח என்பதற்கான வழக்கமான தமிழ் இணைச்சொல்; பலி செலுத்தும் பீடத்தைக் குறிக்கிறது.
- source_word: לַבָּעַל
  choice: பாகாலுக்காக
  rationale: ל முன்னொட்டு இங்கு அர்ப்பணிப்பு அல்லது நோக்கத்தைக் குறிக்கிறது. பலிபீடம் பாகாலுக்கென நிறுவப்பட்டதை ‘பாகாலுக்காக’ இயல்பாகக் காட்டுகிறது.
- source_word: בֵּית הַבַּעַל
  choice: பாகாலின் ஆலயத்தில்
  rationale: எபிரெயில் சொற்பட ‘பாகாலின் வீடு.’ இச்சூழலில் அது வழிபாட்டுக்குரிய கோவிலைச் சுட்டுவதால், நவீன தமிழில் ‘ஆலயம்’ இயல்பாகவும் தெளிவாகவும் உள்ளது; சொற்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: אֲשֶׁר בָּנָה
  choice: அவன் ... கட்டியிருந்த
  rationale: தொடர்புச் சொற்றொடர் பாகாலின் ஆலயத்தையே சுட்டுகிறது. பலிபீடத்தை நிறுவுவதற்கு முன்பே ஆலயம் கட்டப்பட்டிருந்ததை ‘கட்டியிருந்த’ தெளிவாக்குகிறது.
- source_word: בְּשֹׁמְרוֹן
  choice: சமாரியாவில்
  rationale: שֹׁמְרוֹן என்ற இடப்பெயரின் வழக்கமான தமிழ் வடிவம்; בְּ இங்கு இடத்தைக் குறிக்கிறது.
theological_decisions:
- issue: בֵּית הַבַּעַל என்பதன் மொழிபெயர்ப்பு
  choice: பாகாலின் ஆலயம்
  alternative: பாகாலின் வீடு
  rationale: மூலத்தின் சொற்பொருள் ‘பாகாலின் வீடு’ என்றாலும், இச்சூழலில் அது பாகால் வழிபாட்டுக்கான கோவிலைக் குறிக்கிறது. ‘ஆலயம்’ நவீன தமிழ் வாசகருக்கு அந்தச் செயல்பாட்டைத் தெளிவாகத் தெரிவிக்கிறது; மூலத்தின் சொற்பட வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய் வாக்கியத்தின் தகவல் உறவுகள் பாதுகாக்கப்பட்டுள்ளன; தமிழில் இயல்பான சொல் வரிசைக்காக இடவுரை மற்றும் தொடர்புச் சொற்றொடர் முன்னே கொண்டுவரப்பட்டுள்ளன.
