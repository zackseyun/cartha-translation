base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/020.yaml
  text: The rest of the acts of Zimri[a], and his conspiracy that he carried out—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: ta
  text: சிம்ரியின் மற்ற செயல்களும், அவன் செய்த சதியும்[a], இஸ்ரவேல் அரசர்களின் நாளாகமப் புத்தகத்தில் எழுதப்பட்டிருக்கின்றன அல்லவா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேர்ச்சொல் வடிவில், “அவன் சதி செய்த சதி.” வலியுறுத்துவதற்காக எபிரெய மொழியில் ஒரே வேரிலிருந்து வந்த பெயர்ச்சொல்லும் வினைச்சொல்லும் பயன்படுத்தப்பட்டுள்ளன.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי זִמְרִי
  choice: சிம்ரியின் மற்ற செயல்களும்
  rationale: அரசர் வரலாற்றுச் சுருக்கங்களில் דִּבְרֵי என்பது வெறும் ‘வார்த்தைகள்’ என்பதைக் காட்டிலும் செயல்கள் அல்லது நிகழ்வுகளைக் குறிக்கிறது; ‘மற்ற செயல்கள்’ இயல்பான தமிழில் மீதமுள்ள ஆட்சிச் செயல்களைத் தெரிவிக்கிறது.
- source_word: וְקִשְׁרוֹ אֲשֶׁר קָשָׁר
  choice: அவன் தீட்டிய சதியும்
  rationale: קֶשֶׁר அரசியல் சூழலில் சதி அல்லது அரசுக்கு எதிரான சூழ்ச்சியைக் குறிக்கிறது. எபிரெய மூலத்தின் ஒரே வேர்ச்சொல் மீளுரையை தமிழில் இயல்பாகச் சுருக்கி, அதன் வலியுறுத்தலை அடிக்குறிப்பில் பதிவு செய்துள்ளது.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: எழுதப்பட்டிருக்கின்றன அல்லவா?
  rationale: הֲלֹא அறிமுகப்படுத்தும் எதிர்பார்க்கப்பட்ட உறுதிப்பதில் கொண்ட வினாவை ‘அல்லவா?’ என்ற தமிழ்ச் சொல்லாக்கம் வடிவத்துடனும் செயல்பாட்டுடனும் பாதுகாக்கிறது.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים
  choice: நாளாகமப் புத்தகத்தில்
  rationale: இது அரசர்களைப் பற்றிய ஆண்டு நிகழ்வுப் பதிவைக் குறிக்கும் நிலையான தலைப்புச் சொற்றொடர்; ‘நாளாகமப் புத்தகம்’ தமிழில் தெளிவான, மரபான வடிவம்.
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் அரசர்களின்
  rationale: இங்குள்ள לְ நூலின் தலைப்பில் உடைமை அல்லது தொடர்பைக் குறிக்கிறது; ‘இஸ்ரவேல் அரசர்களின்’ என்பது பொருத்தமான தமிழாக்கம்.
