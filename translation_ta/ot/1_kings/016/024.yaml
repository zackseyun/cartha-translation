base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/024.yaml
  text: He bought the hill of Samaria from Shemer for two talents of silver[a], built on the hill, and called the name of the city that he built Samaria, after the name of Shemer[b], the owner of the hill.
translation:
  language: ta
  text: அவர் சமாரியா மலையைச் சேமேரிடமிருந்து இரண்டு தாலந்து வெள்ளிக்கு[a] வாங்கினார். அந்த மலையின்மேல் கட்டி, தான் கட்டிய நகரத்துக்குச் மலையின் உரிமையாளனான சேமேரின் பெயரின்படி “சமாரியா”[b] என்று பெயரிட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ஒரு தாலந்து என்பது எடையை அடிப்படையாகக் கொண்ட பெரிய அலகு; இங்கு இரண்டு தாலந்து வெள்ளி பெருந்தொகையைக் குறிக்கிறது.
    reason: cultural_note
  - marker: b
    text: எபிரெயத்தில் நகரத்தின் பெயர் சேமேரின் பெயரை அடிப்படையாகக் கொண்டு விளக்கப்படுகிறது.
    reason: lexical_note
lexical_decisions:
- source_word: וַיִּקֶן
  choice: வாங்கினார்
  rationale: קנה என்பது இங்கு விலை கொடுத்து நிலத்தைப் பெற்றுக்கொள்வதைக் குறிக்கிறது; நவீன தமிழில் இயல்பான சொல் ‘வாங்கினார்’.
- source_word: הָהָר
  choice: மலை
  rationale: הַר என்பதற்கு மலை அல்லது குன்று என்று பொருள் வரலாம். நகரம் அமைந்த உயர்நிலத்தைக் குறிக்கும் இவ்விடத்தில் பொதுவான தமிழ் வேதாகம இடப்பெயர் வழக்கோடு ‘மலை’ பொருந்துகிறது.
- source_word: שֹׁמְרוֹן
  choice: சமாரியா
  rationale: இந்த இடத்துக்கும் பின்னர் கட்டப்பட்ட நகரத்துக்கும் வழங்கப்பட்ட பெயரின் வழக்கமான தமிழ் வடிவம்.
- source_word: מֵאֵת שֶׁמֶר
  choice: சேமேரிடமிருந்து
  rationale: מֵאֵת என்பது வாங்கப்பட்ட பொருளின் விற்பனையாளர் அல்லது மூலத்தைச் சுட்டுகிறது.
- source_word: בְּכִכְּרַיִם כָּסֶף
  choice: இரண்டு தாலந்து வெள்ளிக்கு
  rationale: כִּכָּר என்பது இங்கு விலைமதிப்புள்ள உலோகத்தின் பெரிய எடை அலகான தாலந்தைக் குறிக்கிறது; இருமை வடிவம் இரண்டு என்பதைக் காட்டுகிறது.
- source_word: וַיִּבֶן אֶת הָהָר
  choice: அந்த மலையில் கட்டுமானம் செய்து
  rationale: சொல்லுக்குச் சொல் ‘மலையைக் கட்டினார்’ என்பது தமிழில் இயல்பற்றது. மலைமேல் கட்டடங்களையோ நகரையோ அமைத்தார் என்ற சூழல்சார்ந்த பொருளை, உரையில் இல்லாத ‘கோட்டை கட்டினார்’ போன்ற கூடுதல் விவரமின்றி இவ்வாறு தருகிறது.
- source_word: וַיִּקְרָא אֶת שֵׁם הָעִיר
  choice: நகரத்துக்கு … என்று பெயரிட்டார்
  rationale: ‘நகரத்தின் பெயரை அழைத்தார்’ என்ற எபிரெய மரபுத்தொடரின் இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: עַל שֵׁם שֶׁמֶר
  choice: சேமேரின் பெயரின்படி
  rationale: நகரம் சேமேரின் பெயரை அடிப்படையாகக் கொண்டு பெயரிடப்பட்டதைக் கூறுகிறது.
- source_word: אֲדֹנֵי הָהָר
  choice: மலையின் உரிமையாளனான
  rationale: אָדוֹן என்பது இங்கு அதிகாரப் பட்டத்தையோ தெய்வீக ஆண்டவரையோ அல்ல, சொத்தின் உரிமையாளரைக் குறிக்கிறது.
