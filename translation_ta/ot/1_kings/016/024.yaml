translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய வாக்கியத்தின் தொடர்ச்சியைத் தக்கவைத்தபடியே தமிழில் இயல்பான இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது. ‘மலை’ என்ற பொதுப்பொருள் காக்கப்பட்டு, ‘குன்று’ என்ற சாத்தியமான மாற்றுப் பொருள் கட்டாயப்படுத்தப்படவில்லை.
