base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/022.yaml
  text: But the people who followed Omri prevailed over the people who followed Tibni son of Ginath. So Tibni died[a], and Omri became king.
translation:
  language: ta
  text: ஆனால் ஒம்ரியைப் பின்பற்றிய மக்கள், கீனாத்தின் மகன் திப்னியைப் பின்பற்றிய மக்களைவிட மேலோங்கினர்[a]. திப்னி இறந்தான்; ஒம்ரி அரசனானான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வலிமையில் மிஞ்சினர்” அல்லது “வலுப்பெற்றனர்.” எபிரெய வினைச்சொல் வலிமைபெறுவதையோ மற்றவர்களைவிட வலியவர்களாக இருப்பதையோ குறிக்கலாம்; இங்கு ஒம்ரியின் தரப்பு உள்நாட்டுப் போட்டியில் மேலாதிக்கம் பெற்றதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחֱזַק
  choice: மேலோங்கினர்
  rationale: חזק என்ற வினைச்சொல் இங்கு אֶת என்பதுடன் வந்து, உள்நாட்டுப் போட்டியில் ஒரு தரப்பு மற்றொரு தரப்பைவிட வலிமைபெற்று வெற்றிநிலை அடைந்ததைக் குறிக்கிறது. ‘மேலோங்கினர்’ என்பது அந்த அரசியல் சூழலை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: הָעָם אֲשֶׁר אַחֲרֵי עָמְרִי
  choice: ஒம்ரியைப் பின்பற்றிய மக்கள்
  rationale: אַחֲרֵי என்பதன் அடிப்படைப் பொருள் ‘பின்னால்’ என்றாலும், இங்கு அது ஒருவரை ஆதரித்து அவரது தரப்பில் நிற்பதைக் குறிக்கிறது.
- source_word: אֶת הָעָם אֲשֶׁר אַחֲרֵי תִּבְנִי
  choice: திப்னியைப் பின்பற்றிய மக்களைவிட
  rationale: חזק உடன் வரும் אֶת எதிர்த்தரப்பின்மீது பெற்ற மேலாதிக்கத்தைக் குறிக்கிறது. ‘மக்களைவிட’ என்பது தமிழில் ஒப்பீட்டையும் மேலோங்குதலையும் தெளிவாக இணைக்கிறது.
- source_word: תִּבְנִי בֶן גִּינַת
  choice: கீனாத்தின் மகன் திப்னி
  rationale: בן என்பது வம்ச அடையாளத்தில் ‘மகன்’ என வழங்கப்பட்டுள்ளது; தனிப்பெயர்கள் ஒலிபெயர்க்கப்பட்டுள்ளன.
- source_word: וַיָּמָת תִּבְנִי
  choice: திப்னி இறந்தான்
  rationale: தொடர்கதை வடிவம் அடுத்த நிகழ்வை முன்வைக்கிறது. எபிரெயம் காரணத்தை வெளிப்படையாகக் கூறாததால், தமிழிலும் மரணத்தை முந்தைய நிகழ்வின் தவிர்க்கமுடியாத விளைவாகச் சேர்த்து விளக்கவில்லை.
- source_word: וַיִּמְלֹךְ עָמְרִי
  choice: ஒம்ரி அரசனானான்
  rationale: מלך இங்கு போட்டியாளனின் மரணத்துக்குப் பின் ஒம்ரி அரசாட்சியை ஏற்றதைக் குறிக்கிறது; ‘அரசனானான்’ அரியணையேற்றத்தைத் தெளிவாகத் தெரிவிக்கிறது.
