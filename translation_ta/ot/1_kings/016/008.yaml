source:
  edition: WLC
  text: בִּ/שְׁנַ֨ת עֶשְׂרִ֤ים וָ/שֵׁשׁ֙ שָׁנָ֔ה לְ/אָסָ֖א מֶ֣לֶךְ יְהוּדָ֑ה מָ֠לַךְ אֵלָ֨ה בֶן בַּעְשָׁ֧א עַל יִשְׂרָאֵ֛ל בְּ/תִרְצָ֖ה שְׁנָתָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/008.yaml
  text: In the twenty-sixth year of Asa king of Judah, Elah son of Baasha became king over Israel in Tirzah for two years.
translation:
  language: ta
  text: யூதாவின் அரசன் ஆசாவின் ஆட்சியின் இருபத்தாறாம் ஆண்டில், பாஷாவின் மகன் ஏலா திர்சாவில் இஸ்ரவேலின்மேல் அரசனாகி, இரண்டு ஆண்டுகள் ஆட்சி செய்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת עֶשְׂרִים וָשֵׁשׁ שָׁנָה
  choice: ஆட்சியின் இருபத்தாறாம் ஆண்டில்
  rationale: எபிரெய அரசாண்டுக் கணக்கீட்டு மரபை இயல்பான தமிழில் தெளிவாக வெளிப்படுத்துகிறது; மூலத்திலுள்ள சொல்லளவிலான மறுபதிப்பைத் தவிர்க்கிறது.
- source_word: לְאָסָא מֶלֶךְ יְהוּדָה
  choice: யூதாவின் அரசன் ஆசாவின்
  rationale: לְ இங்கு ஆசாவின் ஆட்சியாண்டைக் குறிக்கிறது. தமிழ் வேற்றுமைத் தொடர் அந்தத் தொடர்பை இயல்பாகக் காட்டுகிறது.
- source_word: מָלַךְ
  choice: அரசனாகி, ... ஆட்சி செய்தான்
  rationale: இந்த அரசேற்றச் செய்தியில் வினை அரசனான தொடக்கத்தையும், இறுதியில் வரும் இரண்டு ஆண்டுகள் என்ற கால அளவோடு சேர்ந்து ஆட்சிக் காலத்தையும் குறிக்கிறது. தமிழ் வாக்கியத்தில் இரு அம்சங்களையும் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: אֵלָה
  choice: ஏலா
  rationale: எபிரெய தனிப்பெயரின் ஒலிப்பெயர்ப்பு.
- source_word: בֶן בַּעְשָׁא
  choice: பாஷாவின் மகன்
  rationale: தந்தை–மகன் உறவைக் குறிக்கும் வழக்கமான எபிரெய கட்டமைப்புக்கு நேரான, இயல்பான தமிழ்.
- source_word: עַל יִשְׂרָאֵל
  choice: இஸ்ரவேலின்மேல்
  rationale: עַל உடன் வரும் מלך, ஒரு மக்களின்மேல் அல்லது நாட்டின்மேல் ஆளுகை செய்வதைக் குறிக்கிறது; மூலத்தில் இல்லாத ‘ராஜ்யம்’ என்பதைக் கூட்டவில்லை.
- source_word: בְּתִרְצָה
  choice: திர்சாவில்
  rationale: בְּ இங்கு ஆட்சி நடைபெற்ற இடத்தைக் குறிக்கிறது; ‘திர்சாவில்’ என்பது நேரான தமிழ் இடவெற்றுமை வடிவம்.
- source_word: שְׁנָתָיִם
  choice: இரண்டு ஆண்டுகள்
  rationale: எபிரெய இருமை வடிவத்தின் சரியான கால அளவைத் தெளிவாக வழங்குகிறது.
