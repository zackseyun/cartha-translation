translation_notes:
  register: நவீனத் தரத் தமிழில், வரலாற்று அரசேற்றப் பதிவுக்கேற்ற கண்ணியமான மற்றும் பொதுவாசகர்களுக்குப் புரியும் நடை. ‘அரசன்’, ‘ஆட்சி செய்தான்’ ஆகிய சொற்கள் ஒரே வேரின் தேவையற்ற மறுமொழியாக இல்லாமல், அரசேற்றத்தையும் இரண்டாண்டு ஆட்சிக்காலத்தையும் தனித்தனியாகத் தெளிவுபடுத்துகின்றன.
