  text: וְ/אַחְאָ֣ב בֶּן עָמְרִ֗י מָלַךְ֙ עַל יִשְׂרָאֵ֔ל בִּ/שְׁנַ֨ת שְׁלֹשִׁ֤ים וּ/שְׁמֹנֶה֙ שָׁנָ֔ה לְ/אָסָ֖א מֶ֣לֶךְ יְהוּדָ֑ה וַ֠/יִּמְלֹךְ אַחְאָ֨ב בֶּן עָמְרִ֤י עַל יִשְׂרָאֵל֙ בְּ/שֹׁ֣מְר֔וֹן עֶשְׂרִ֥ים וּ/שְׁתַּ֖יִם שָׁנָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/029.yaml
  text: And Ahab son of Omri became king over Israel in the thirty-eighth year of Asa king of Judah, and Ahab son of Omri reigned over Israel in Samaria twenty-two years.
translation:
  language: ta
  text: யூதாவின் அரசன் ஆசாவின் ஆட்சியின் முப்பத்தெட்டாம் ஆண்டில், ஒம்ரியின் மகன் ஆகாப் இஸ்ரவேலின் அரசனானான். ஒம்ரியின் மகன் ஆகாப் சமாரியாவில் இஸ்ரவேலை இருபத்திரண்டு ஆண்டுகள் ஆட்சி செய்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָלַךְ
  choice: அரசனானான்
  rationale: அரச ஆட்சிக்காலக் குறிப்புகளில் இந்த வினை இங்கு அரியணை ஏற்றதைச் சுட்டுகிறது; பின்னர் வரும் ஆட்சிக்காலத்தின் நீளத்திலிருந்து இதை வேறுபடுத்துகிறது.
- source_word: בִּשְׁנַת שְׁלֹשִׁים וּשְׁמֹנֶה שָׁנָה
  choice: ஆட்சியின் முப்பத்தெட்டாம் ஆண்டில்
  rationale: எபிரெய எண்ணிக்கைத் தொடரின் வரிசைஎண் பொருளையும், ஆசாவின் ஆட்சியோடு அமைந்த கால ஒத்திசைவையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: לְאָסָא מֶלֶךְ יְהוּדָה
  choice: யூதாவின் அரசன் ஆசாவின் ஆட்சியின்
  rationale: לְ குறிக்கும் அரசாண்டுக் காலத்தைத் தெளிவாக்கி, எபிரெய அரசகாலக் கணக்கீட்டின் தொடர்பைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיִּמְלֹךְ
  choice: ஆட்சி செய்தான்
  rationale: தொடர்ந்து வரும் இருபத்திரண்டு ஆண்டுகள் என்ற கால அளவுடன் சேர்ந்து, ஆட்சியின் நீடிப்பைக் குறிக்கிறது.
- source_word: בְּשֹׁמְרוֹן
  choice: சமாரியாவில் இருந்து
  rationale: בְּ இடத்தைக் குறிக்கிறது; சமாரியா அரச ஆட்சியின் மையம் என்பதால், தமிழில் 'சமாரியாவில் இருந்து ... ஆட்சி செய்தான்' என்பது இயல்பாகவும் மூலப்பொருளுக்கு உண்மையாகவும் உள்ளது.
- source_word: עֶשְׂרִים וּשְׁתַּיִם שָׁנָה
  choice: இருபத்திரண்டு ஆண்டுகள்
  rationale: ஆட்சிக்காலத்தின் நீளத்தை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וְ
  choice: வாக்கியத் தொடர்ச்சியால் வெளிப்படுத்தப்பட்டது
  rationale: மூலத்தின் இணைப்புச் சொல் முந்தைய அரச வரலாற்றுக் குறிப்புடன் தொடர்ச்சியை ஏற்படுத்துகிறது. தனியாக 'மேலும்' என்று தொடங்குவது தமிழில் செயற்கையாக ஒலிப்பதால், தொடர்ச்சியான உரைநடையிலேயே அதன் பணி வெளிப்படுத்தப்பட்டுள்ளது.
