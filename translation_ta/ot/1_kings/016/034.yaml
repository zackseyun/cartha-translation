revisions:
- from: 'அவனுடைய நாட்களில், பெத்தேலைச் சேர்ந்த ஈயேல் எரிகோவைத் திரும்பக் கட்டினான்[a]. தன் முதற்பேறான அபிராமை இழந்த விலையில் அதன் அடித்தளத்தை அமைத்தான்; தன் இளைய மகனான செகூபை இழந்த விலையில் அதன் வாசல்களை நிறுவினான்[b]. நூனின் மகன் யோசுவா மூலம் யாவே உரைத்த வார்த்தையின்படியே இது நடந்தது.


    [a] சொல்லுக்குச் சொல்: “எரிகோவைக் கட்டினான்.” எரிகோ முன்பு அழிக்கப்பட்டிருந்த சூழலைக் கருத்தில் கொண்டு “திரும்பக் கட்டினான்” என்று மொழிபெயர்க்கப்பட்டுள்ளது.


    [b] சொல்லுக்குச் சொல்: “தன் முதற்பேறான அபிராமில்/அபிராமோடு அதன் அடித்தளத்தை அமைத்தான்; தன் இளையவனான செகூபில்/செகூபோடு அதன் வாசல்களை நிறுவினான்.” யோசுவா 6:26-இல் கூறப்பட்டதன் நிறைவேற்றமாக, இந்தக் கட்டுமானம் அந்த மகன்களின் இழப்பை விலையாகக் கொண்டது என்பதே இங்கு இயல்பான பொருள்.'
  to: அவனது நாட்களில், பெத்தேலைச் சேர்ந்த ஈயேல் எரிகோவைத் திரும்பக் கட்டினான்[a]. தன் மூத்த மகன் அபிராமின் விலையாக அதன் அடித்தளத்தை அமைத்தான்; தன் இளைய மகன் செகூபின் விலையாக அதன் வாயில்களை அமைத்தான்[b]. நூனின் மகன் யோசுவா வழியாக யாவே உரைத்த வார்த்தையின்படியே அவன் இவ்வாறு செய்தான்.
  rationale: திருத்தம் மூலத்தில் உள்ள ‘வார்த்தையின்படி’ என்ற தொடரை ஈயேலின் செயலில் நேரடியாக இணைக்கிறது; செயற்கையான “இழந்த விலையில்” என்பதை இயல்பான இணை வடிவமாக மாற்றுகிறது; நகரின் கதவுகளைக் குறிக்கும் சொல்லுக்கு “வாயில்களை அமைத்தான்” என வழங்குகிறது. மகன்களின் மரணம் மூலத்தில் நேரடியாக விவரிக்கப்படாததால், முக்கிய உரை ‘விலையாக’ என்ற சுருக்கமான விளக்கத்தைப் பாதுகாக்கிறது; எபிரெய முன்னிடைச்சொல்லின் மாற்று நேரடி வாசிப்பு அடிக்குறிப்பில் உள்ளது.
