  source_fidelity: மூலத்தின் காலக் குறிப்பு, இடப்பெயர், மறுகட்டுமானச் சூழல், இரு மகன்களோடு இணைந்த சாப-நிறைவேற்றத் தொடர், யோசுவா வழியாக யாவே உரைத்த வார்த்தை ஆகியவை வரைவில் பெரும்பாலும் உண்மையாக உள்ளன. ஆனால் இறுதி வாக்கியத்தில் உள்ள “இது நடந்தது” மூலத்தில் வெளிப்படையாக இல்லாத நிகழ்வுரையாக உள்ளது; மூலத்தின் கட்டுமானச் செயலோடு ‘வார்த்தையின்படி’ என்ற தொடரை நேரடியாக இணைப்பது துல்லியமானது.
  naturalness: “இழந்த விலையில்” என்பது நவீன நிலையான தமிழில் ஓரளவு செயற்கையாக ஒலிக்கிறது. “...இன் விலையாக” என்ற இணை வடிவமும், நகரச் சூழலுக்கேற்ற “வாயில்களை அமைத்தான்” என்பதும் இயல்பான கண்ணியமான நடையைத் தருகின்றன.
