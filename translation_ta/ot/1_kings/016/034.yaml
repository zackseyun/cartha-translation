base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/034.yaml
  text: In his days Hiel of Bethel rebuilt Jericho[a]. At the cost of Abiram his firstborn he laid its foundation, and at the cost of Segub his youngest he set up its gates[b], according to the word of Yahweh that he had spoken through Joshua son of Nun.
translation:
  language: ta
  text: அவனது நாட்களில், பெத்தேலைச் சேர்ந்த ஈயேல் எரிகோவைத் திரும்பக் கட்டினான்[a]. தன் மூத்த மகன் அபிராமின் விலையாக அதன் அடித்தளத்தை அமைத்தான்; தன் இளைய மகன் செகூபின் விலையாக அதன் வாயில்களை அமைத்தான்[b]. நூனின் மகன் யோசுவா வழியாக யாவே உரைத்த வார்த்தையின்படியே அவன் இவ்வாறு செய்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “எரிகோவைக் கட்டினான்.” எரிகோ முன்பு அழிக்கப்பட்டிருந்த சூழலைக் கருத்தில் கொண்டு “திரும்பக் கட்டினான்” என்று மொழிபெயர்க்கப்பட்டுள்ளது.'
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்குச் சொல்: “தன் மூத்த மகன் அபிராமில்/அபிராமோடு அதன் அடித்தளத்தை அமைத்தான்; தன் இளைய மகன் செகூபில்/செகூபோடு அதன் வாயில்களை அமைத்தான்.” யோசுவா 6:26-இன் நிறைவேற்றமாக, இந்தக் கட்டுமானம் அந்த மகன்களின் இழப்பை விலையாகக் கொண்டது என்பதே இங்கு இயல்பான பொருள்.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּיָמָיו
  choice: அவனுடைய நாட்களில்
  rationale: முன்னர் குறிப்பிடப்பட்ட அரசனின் காலத்தைக் குறிக்கும் எபிரெயக் காலவழக்கை இயல்பான தமிழில் நெருக்கமாகப் பாதுகாக்கிறது.
- source_word: בָּנָה
  choice: திரும்பக் கட்டினான்
  rationale: வினைச்சொல் நேரடியாக ‘கட்டினான்’ என்றாலும், முன்பு அழிக்கப்பட்ட எரிகோ நகரம் மீண்டும் கட்டப்பட்டதைச் சூழல் காட்டுகிறது; நேரடி வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: חִיאֵל בֵּית הָאֱלִי
  choice: பெத்தேலைச் சேர்ந்த ஈயேல்
  rationale: பெத்தேல் ஊருடனான தோற்றம் அல்லது தொடர்பைக் குறிக்கும் இனப்பெயரடைத் தொடரை நவீன தமிழில் தெளிவாக வழங்குகிறது.
- source_word: בַּאֲבִירָם בְּכֹרוֹ
  choice: தன் முதற்பேறான அபிராமை இழந்த விலையில்
  rationale: ב முன்னிடைச்சொல்லின் வடிவத்தை மிகையாகத் தெளிவுபடுத்தாமல், யோசுவா 6:26-ஐ எதிரொலிக்கும் மகனின் இழப்பு என்ற சூழற்பொருளை எடுத்துரைக்கிறது.
- source_word: יִסְּדָהּ
  choice: அதன் அடித்தளத்தை அமைத்தான்
  rationale: நகரைக் கட்டும் சூழலில் יסד என்பது அடித்தளம் இடுவதைக் குறிக்கிறது.
- source_word: וּבִשְׂגוּב צְעִירוֹ
  choice: தன் இளைய மகனான செகூபை இழந்த விலையில்
  rationale: முந்தைய இணைத் தொடருக்கு ஒத்தவாறு மொழிபெயர்க்கப்பட்டுள்ளது; குடும்பப் பிறப்புவரிசையில் צעיר இளைய மகனைக் குறிக்கிறது.
- source_word: הִצִּיב דְּלָתֶיהָ
  choice: அதன் வாசல்களை நிறுவினான்
  rationale: நகரச் சூழலில் דלתות என்பது நகரின் வாசல்களையோ வாசற்கதவுகளையோ குறிக்கிறது; ‘வாசல்கள்’ இயல்பான தமிழ்.
- source_word: כִּדְבַר יְהוָה
  choice: யாவே உரைத்த வார்த்தையின்படியே
  rationale: உடன்படிக்கைச் சூழலிலுள்ள சூத்திரத்தைப் பாதுகாத்து, יהוה என்ற தனிப்பெயரை ‘யாவே’ என ஒலிபெயர்க்கிறது.
- source_word: אֲשֶׁר דִּבֶּר בְּיַד
  choice: மூலம் ... உரைத்த
  rationale: ‘கையால்’ என்ற எபிரெய முகவர் மரபுத்தொடரை இயல்பான தமிழில் தீர்க்கதரிசன இடைமுகத்தைக் குறிக்கும் ‘மூலம்’ என வழங்குகிறது.
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: நூனின் மகன் யோசுவா
  rationale: தந்தைப்பெயருடன் கூடிய எபிரெய வடிவத்தைத் தெளிவான வழக்குத் தமிழில் தருகிறது.
theological_decisions:
- issue: ஈயேலின் மகன்களை உட்படுத்தும் சாபநிறைவேற்றத் தொடரின் இயல்பு
  choice: எரிகோவின் மறுகட்டுமானம் ஈயேலின் முதற்பேறான மகனும் இளைய மகனும் இழக்கப்பட்ட விலையில் நடந்ததாக வசனம் கூறுகிறது.
  alternative: மகன்களின் மரணத்தைச் சுட்டாமல், கட்டுமானத்தின் இரு கட்டங்களும் அவர்களோடு அல்லது அவர்களுடைய வாழ்நாளில் நிகழ்ந்ததாக முன்னிடைச்சொற்களை நேரடியாக வாசிக்கலாம்.
  rationale: இந்தச் சொற்கள் யோசுவா 6:26-ஐ நேரடியாக எதிரொலிப்பதால் மகன்களின் உயிரிழப்புடன் கூடிய சாபநிறைவேற்றமே இயல்பான வாசிப்பு. இருப்பினும் எபிரெய முன்னிடைச்சொல்லின் நேரடி வடிவமும் அதன் சுருக்கமான தன்மையும் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘இழந்த விலையில்’ என்பது மரணத்தை நேரடியாகச் சேர்க்காமல் சாபநிறைவேற்றத்தின் செலவை உணர்த்துகிறது; மூலத்தின் சுருக்கமும் மாற்று நேரடி வாசிப்பும் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளன.
