  text: וַ/יְהִ֤י דְבַר יְהוָה֙ אֶל יֵה֣וּא בֶן חֲנָ֔נִי עַל בַּעְשָׁ֖א לֵ/אמֹֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/001.yaml
  text: Then the word of Yahweh came to Jehu son of Hanani against Baasha[a], saying,
translation:
  language: ta
  text: 'அப்போது, அனானியின் மகன் யெகூவிடம் பாஷாவுக்கு எதிராக[a] யாவேயின் வார்த்தை வந்தது:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பாஷாவைக் குறித்து.” எபிரெய முன்னிடைச்சொல் விரிந்த பொருளைக் கொண்டிருக்கலாம்; ஆனால் இங்கே அது ஒரு தீர்ப்புரையை அறிமுகப்படுத்துவதால் “எதிராக” என்பது விரும்பப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: அப்போது ... வந்தது
  rationale: வாவ் தொடர் வடிவம் கதையில் அடுத்த நிகழ்வை அறிமுகப்படுத்துகிறது. தமிழில் இயல்பாக நிகழ்வின் தொடர்ச்சியைக் காட்ட ‘அப்போது’ பொருத்தமானது; דְבַר ... אֶל என்ற முழுச் சொற்றொடருடன் ‘வந்தது’ இணைகிறது.
- source_word: דְבַר יְהוָה
  choice: யாவேயின் வார்த்தை
  rationale: இது தீர்க்கதரிசன வெளிப்பாட்டுக்கான நிலையான எபிரெயச் சொற்றொடர். ‘வார்த்தை’ என்பது அதன் முறையான மற்றும் இறையியல் ஒலிப்பைத் தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தேவனுடைய தனிப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், நவீன தமிழில் பரவலாகப் புரிந்துகொள்ளக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֶל
  choice: -இடம்
  rationale: வெளிப்பாட்டு வாய்ப்பாட்டில் தெய்வீக வார்த்தையைப் பெறுபவரைக் குறிக்கிறது; தமிழில் ‘யெகூவிடம்’ என்பது இயல்பான அமைப்பு.
- source_word: יֵהוּא בֶן חֲנָנִי
  choice: அனானியின் மகன் யெகூ
  rationale: எபிரெயப் பெயர்கள் தமிழில் ஒலிபெயர்க்கப்படுகின்றன. தமிழின் இயல்பான உறவுமுறை அமைப்புக்கேற்ப ‘அனானியின் மகன்’ பெயருக்கு முன் வருகிறது.
- source_word: עַל
  choice: எதிராக
  rationale: தொடர்ந்து வரும் தீர்ப்புரையின் சூழலில், இது பாஷாவைப் பற்றிய நடுநிலையான செய்தியைவிட அவருக்கு விரோதமான தீர்ப்பை அறிமுகப்படுத்துகிறது.
- source_word: בַּעְשָׁא
  choice: பாஷா
  rationale: தனிப்பெயரின் எபிரெய உச்சரிப்பை நெருங்கிய தமிழொலிபெயர்ப்பு.
- source_word: לֵאמֹר
  choice: 'வந்தது:'
  rationale: இந்த எபிரெய இறைவினை அடுத்த வசனத்தில் வரும் நேரடிக் கூற்றை அறிமுகப்படுத்துகிறது. தமிழில் இரட்டைப்புள்ளி இதே பணியை இயல்பாகச் செய்கிறது; ‘சொல்லி’ என்று இடுவது இங்கு செயற்கையாக இருக்கும்.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக உள்ளது. ஆகவே அதை ஒரு பட்டத்தால் மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் தனிப்பெயர் தன்மையைப் பாதுகாக்கிறது.
- issue: தீர்க்கதரிசன வாய்ப்பாட்டில் עַל என்பதன் வலிமை
  choice: பாஷாவுக்கு எதிராக
  alternative: பாஷாவைக் குறித்து
  rationale: இது தீர்ப்புரையை அறிமுகப்படுத்துவதால் ‘எதிராக’ என்பது நீதித்தீர்ப்பின் வலிமையைத் தக்கவைக்கிறது. இருப்பினும் எபிரெய முன்னிடைச்சொல் விரிந்த பொருளில் ‘குறித்து’ என்றும் அமையலாம்; அது அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான தீர்க்கதரிசன நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. לֵאמֹר என்பதன் உரை-அறிமுகப் பணியை தமிழில் இயல்பான இரட்டைப்புள்ளி வெளிப்படுத்துகிறது; அடிக்குறி சம்பந்தப்பட்ட ‘எதிராக’ என்பதற்குப் பின் அல்லாமல் முழு அறிமுகக் கூற்றின் முடிவில் வைக்கப்பட்டுள்ளது.
