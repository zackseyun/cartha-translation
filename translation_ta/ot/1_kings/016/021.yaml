source:
  edition: WLC
  text: אָ֧ז יֵחָלֵ֛ק הָ/עָ֥ם יִשְׂרָאֵ֖ל לַ/חֵ֑צִי חֲצִ֨י הָ/עָ֜ם הָ֠יָה אַחֲרֵ֨י תִבְנִ֤י בֶן גִּינַת֙ לְ/הַמְלִיכ֔/וֹ וְ/הַ/חֲצִ֖י אַחֲרֵ֥י עָמְרִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/021.yaml
  text: 'Then the people of Israel were divided into two parts: half of the people followed Tibni son of Ginath[a], to make him king, and half followed Omri.'
translation:
  language: ta
  text: அப்போது இஸ்ரவேல் மக்கள் இரு பகுதிகளாகப் பிரிந்தார்கள். மக்களில் பாதிப்பேர் கீனாத்தின் மகன் திப்னியை அரசனாக்குவதற்காக அவனைப் பின்பற்றினார்கள்; மற்றப் பாதிப்பேர் ஒம்ரியைப் பின்பற்றினார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மக்களில் பாதிப்பேர் கீனாத்தின் மகன் திப்னியை அரசனாக்குவதற்காக அவன் தரப்பில் இருந்தார்கள்; மற்றப் பாதிப்பேர் ஒம்ரியின் தரப்பில் இருந்தார்கள்.”
    reason: הָיָה אַחֲרֵי என்ற எபிரெய மரபுத்தொடர் ‘பின்பற்றுதல்’ என்றும் ‘ஒருவருடைய தரப்பில் இருத்தல்’ என்றும் புரிந்துகொள்ளப்படலாம்.
lexical_decisions:
- source_word: יֵחָלֵק
  choice: பிரிந்தார்கள்
  rationale: חלק என்பதன் நிஃபால் வடிவம் பிரிக்கப்படுதல் அல்லது பிளவுபடுதல் என்ற பொருளைத் தருகிறது. ‘மக்கள்’ என்ற கூட்டுப் பெயருடன் இயல்பான நவீன தமிழில் ‘பிரிந்தார்கள்’ பொருத்தமானது.
- source_word: הָעָם יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: தேசிய மக்களைக் குறிக்கும் எபிரெய இணைப்பை இயல்பான தமிழ்ச் சொல் வரிசையில் தருகிறது.
- source_word: לַחֵצִי
  choice: இரு பகுதிகளாக
  rationale: மக்கள் இரு பாதிகளாகப் பிரிந்ததைக் குறிக்கிறது; தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: חֲצִי הָעָם
  choice: மக்களில் பாதிப்பேர்
  rationale: மக்கள்தொகையின் ஒரு பாதியினரைத் தெளிவாகக் குறிக்கும் இயல்பான தமிழாக்கம்.
- source_word: הָיָה אַחֲרֵי
  choice: பின்பற்றினார்கள்
  rationale: இந்த அரசியல் சூழலில் ஒருவருக்குப் பின்னால் இருப்பது அவரை ஆதரித்து அவருடைய தரப்பில் சேர்வதைக் குறிக்கிறது. ‘பின்பற்றினார்கள்’ அந்தத் தொடர்பைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: תִבְנִי בֶן גִּינַת
  choice: கீனாத்தின் மகன் திப்னி
  rationale: பெயர்கள் தமிழில் ஒலிபெயர்க்கப்பட்டு, எபிரெய வம்ச உறவு இயல்பான தமிழில் தரப்பட்டுள்ளது.
- source_word: לְהַמְלִיכוֹ
  choice: அவனை அரசனாக்குவதற்காக
  rationale: מלך என்பதன் ஹிஃபில் வினையெச்சம் ஒருவனை ஆட்சி செய்யச் செய்வது, அதாவது அரசனாக்குவது என்று பொருள்படும்; மூலத்தில் இல்லாத முடிசூட்டு விழாவை இது சேர்ப்பதில்லை.
- source_word: וְהַחֲצִי אַחֲרֵי עָמְרִי
  choice: மற்றப் பாதிப்பேர் ஒம்ரியைப் பின்பற்றினார்கள்
  rationale: இணையான முந்தைய கூறிலிருந்து வினை வழங்கப்படுகிறது. ‘மற்ற’ என்பது தமிழில் இரு பாதிகளுக்கிடையேயான எதிரிணையைத் தெளிவாக்குகிறது.
