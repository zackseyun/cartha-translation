base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/028.yaml
  text: And Omri slept with his fathers and was buried in Samaria[a], and Ahab his son reigned in his place.
translation:
  language: ta
  text: ஒம்ரி தன் முன்னோர்களோடு துயிலடைந்தான்[a]; அவன் சமாரியாவில் அடக்கம் செய்யப்பட்டான். அவனுக்குப் பதிலாக அவன் மகன் ஆகாப் அரசாண்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தன் முன்னோர்களோடு துயிலடைந்தான்” என்பது அரசர்களின் வரலாற்றில் மரணத்தைக் குறிக்க வழக்கமாகப் பயன்படுத்தப்படும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב עָמְרִי עִם אֲבֹתָיו
  choice: உம்ரி தன் முன்னோர்களோடு துயிலடைந்து
  rationale: அரசர்களைப் பற்றிய வரலாற்றில் இது மரணத்தைக் குறிக்கும் வழக்கமான எபிரெய மரபுத்தொடர். ‘துயிலடைந்து’ என்பது அதன் உருவகத்தையும் சூத்திரத் தன்மையையும் காக்கிறது; ‘முன்னோர்கள்’ என்பது நவீனத் தமிழில் இயல்பாக வம்சத் தொடர்ச்சியைத் தெரிவிக்கிறது.
- source_word: וַיִּקָּבֵר
  choice: அடக்கம் செய்யப்பட்டான்
  rationale: நிஃபால் வடிவிலுள்ள செயப்பாட்டு பொருளை இயல்பான நவீனத் தமிழில் தெளிவாகத் தருகிறது.
- source_word: בְּשֹׁמְרוֹן
  choice: சமாரியாவில்
  rationale: בְּ முன்னிடைச்சொல் இங்கு அடக்கம் செய்யப்பட்ட இடத்தைக் குறிக்கிறது.
- source_word: וַיִּמְלֹךְ
  choice: அரசாண்டான்
  rationale: அரசுரிமைத் தொடர்ச்சிக்கான இந்தச் சூழலில் வினையைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது; ‘அரசாளத் தொடங்கினான்’ என்று மூலத்தில் கட்டாயமில்லாத தொடக்க நுணுக்கத்தைச் சேர்க்கவில்லை.
- source_word: תַּחְתָּיו
  choice: அவனுக்குப் பதிலாக
  rationale: ஒருவரின் இடத்தை அடுத்தவர் ஏற்று அரசாளும் வம்சவழி வாரிசுரிமையை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. எபிரெய மரண மரபுத்தொடரின் உருவகம் முதன்மை உரையில் பாதுகாக்கப்பட்டு, அதன் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
