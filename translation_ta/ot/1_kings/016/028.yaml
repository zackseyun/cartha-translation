  to: ஒம்ரி தன் முன்னோர்களோடு துயிலடைந்தான்[a]; அவன் சமாரியாவில் அடக்கம் செய்யப்பட்டான். அவனுக்குப் பதிலாக அவன் மகன் ஆகாப் அரசாண்டான்.
  rationale: The revision standardizes Omri's Tamil name and uses a finite verb for the first event, while preserving the Hebrew death idiom, the burial location, the passive sense of burial, and the succession formula. The footnote remains anchored to the idiom and explains it without expanding its meaning.
