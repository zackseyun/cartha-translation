base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/004.yaml
  text: Whoever belonging to Baasha dies in the city[a], the dogs will eat; and whoever belonging to him dies in the field[b], the birds of the heavens will eat.
translation:
  language: ta
  text: பாஷாவைச் சேர்ந்த யாராவது நகரத்தில் இறந்தால்,[a] அவரை நாய்கள் தின்னும்; பாஷாவைச் சேர்ந்த யாராவது வயல்வெளியில் இறந்தால், அவரை வானத்துப் பறவைகள் தின்னும்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பாஷாவுக்குரியவர்’ அல்லது ‘பாஷாவின் ஒருவர்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொற்றொடர் பாஷாவுடன் தொடர்புடையவர்களைக் குறிக்கிறது; பெரும்பாலும் அவனுடைய வீட்டார் அல்லது வம்சத்தினர் குறிக்கப்படுகின்றனர்.
    reason: lexical_alternative
  - marker: b
    text: ‘வானத்தின் பறவைகள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמֵּת
  choice: எவனாவது ... இறந்தால்
  rationale: ஒருமை வினையெச்சம் இங்கு பொதுப்படையாக, பாஷாவைச் சேர்ந்த எந்த நபரையும் குறிக்கிறது. தமிழில் நிபந்தனைத் தொடர்புடைய இந்த அமைப்பு இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: לְבַעְשָׁא
  choice: பாஷாவைச் சேர்ந்த
  rationale: לְ இங்கு உறவு அல்லது உடைமையைக் குறிக்கிறது. எபிரெயம் வீட்டார் அல்லது வம்சம் என்று வெளிப்படையாகக் கூறாததால், அவ்வாறு மிகைத்துக் குறிப்பிடாமல் உறவைப் பாதுகாக்கிறது.
- source_word: בָּעִיר
  choice: நகரத்தில்
  rationale: בְ முன்னொட்டுடன் வரும் עִיר என்பதன் நேரான இடப்பொருள்.
- source_word: יֹאכְלוּ הַכְּלָבִים
  choice: அவனை நாய்கள் தின்னும்
  rationale: אָכַל என்பதன் அடிப்படைப் பொருளான ‘தின்னும்’ என்பதைக் காக்கிறது; தமிழில் செயப்படுபொருளை வெளிப்படுத்த ‘அவனை’ சேர்க்கப்பட்டுள்ளது.
- source_word: וְהַמֵּת לוֹ
  choice: அவனைச் சேர்ந்த எவனாவது ... இறந்தால்
  rationale: לְבַעְשָׁא என்பதிலிருந்த உறவுச் சுட்டு இங்கு ஆண்பால் ஒருமைப் பெயர்ச்சுட்டாக மாறுகிறது; அது இன்னும் பாஷாவையே குறிக்கிறது. இணைவாக்கியத்தின் ஒத்த அமைப்பும் காக்கப்படுகிறது.
- source_word: בַּשָּׂדֶה
  choice: வயல்வெளியில்
  rationale: שָׂדֶה என்பது வயல் அல்லது திறந்த வெளி எனப் பொருள்படும். ‘வயல்வெளி’ நகரம்–வெளி எதிர்நிலையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: עוֹף הַשָּׁמָיִם
  choice: வானத்துப் பறவைகள்
  rationale: கூட்டுப்பொருளுடைய עוֹף என்பதைக் தமிழில் பன்மையான ‘பறவைகள்’ என்று இயல்பாக மொழிபெயர்த்து, הַשָּׁמַיִם உடனான தொடர்பையும் காக்கிறது.
