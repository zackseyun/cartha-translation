source:
  edition: WLC
  text: וַ/יַּשְׁמֵ֣ד זִמְרִ֔י אֵ֖ת כָּל בֵּ֣ית בַּעְשָׁ֑א כִּ/דְבַ֤ר יְהוָה֙ אֲשֶׁ֣ר דִּבֶּ֣ר אֶל בַּעְשָׁ֔א בְּ/יַ֖ד יֵה֥וּא הַ/נָּבִֽיא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/012.yaml
  text: So Zimri destroyed all the house of Baasha[b][a], according to the word of Yahweh that he had spoken against Baasha through Jehu the prophet.
translation:
  language: ta
  text: அவ்வாறு சிம்ரி, பாஷாவின் வம்சம் முழுவதையும்[a] அழித்துப்போட்டான். யெகூ தீர்க்கதரிசியின் மூலம் பாஷாவுக்கு எதிராக[b] யாவே உரைத்திருந்த வார்த்தையின்படியே இது நடந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் நேரடியாக ‘பாஷாவின் வீடு முழுவதையும்’ என்று உள்ளது. இங்கு ‘வீடு’ என்பது பாஷாவின் அரச குடும்பத்தை அல்லது வம்சத்தைக் குறிக்கிறது; அவரது குடியிருப்பை மட்டும் அல்ல.
    reason: cultural_note
  - marker: b
    text: அல்லது, ‘பாஷாவிடம்.’ எபிரெய முன்னிடைச்சொல் பொதுவாக ‘இடம்/நோக்கி’ என்ற பொருளைத் தருகிறது; இங்கு அது பாஷாவை நோக்கி அறிவிக்கப்பட்ட தண்டனைத் தீர்ப்பை அறிமுகப்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁמֵד
  choice: அழித்துப்போட்டான்
  rationale: שׁמד என்பதன் ஹிஃபில் வடிவம் முற்றிலுமாக அழிக்கச் செய்வதைக் குறிக்கிறது. ‘அழித்துப்போட்டான்’ என்பது அதன் வலிமையையும் இயல்பான நவீனத் தமிழ் நடையையும் காக்கிறது.
- source_word: כָּל בֵּית בַּעְשָׁא
  choice: பாஷாவின் வம்சம் முழுவதையும்
  rationale: அரச வரலாற்றுச் சூழலில் בֵּית என்பது கட்டடத்தையோ உடனடி வீட்டாரையோ மட்டும் அல்லாமல் அரச குடும்பத்தையும் வம்சத்தையும் குறிக்கிறது. தமிழில் ‘வம்சம்’ அந்தச் சூழல்சார் பொருளைத் தெளிவாக வழங்குகிறது; כָּל என்பதற்கு ‘முழுவதையும்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: כִּדְבַר
  choice: வார்த்தையின்படியே
  rationale: இந்தச் சொற்றொடர் முன்னர் அறிவிக்கப்பட்ட யாவேயின் வார்த்தைக்கு ஏற்ப நிகழ்வு நடந்ததைக் காட்டுகிறது. ‘-இன்படியே’ நிறைவேற்றம் அல்லது ஒத்திசைவு சார்ந்த வலியுறுத்தலை இயல்பாகத் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான יהוה பட்டப்பெயராக மாற்றப்படாமல், தமிழில் பரவலாகப் புரிந்துகொள்ளக்கூடிய ஒலிபெயர்ப்பாக வழங்கப்பட்டுள்ளது.
- source_word: אֲשֶׁר דִּבֶּר
  choice: உரைத்திருந்த
  rationale: தீர்க்கதரிசன வார்த்தை சிம்ரியின் செயலுக்கு முன்னரே உரைக்கப்பட்டது என்பதைக் கடந்தகால நிறைவுநிலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֶל בַּעְשָׁא
  choice: பாஷாவுக்கு எதிராக
  rationale: אֶל என்பதன் அடிப்படைப் பொருள் ‘நோக்கி/இடம்’ என்றாலும், இங்கு பாஷாவை நோக்கிச் சொல்லப்பட்ட தண்டனைத் தீர்ப்பின் எதிர்மறைத் தன்மையை ‘எதிராக’ தெளிவுபடுத்துகிறது; நேரடி மாற்று அடிக்குறிப்பில் காக்கப்பட்டுள்ளது.
- source_word: בְּיַד יֵהוּא הַנָּבִיא
  choice: யெகூ தீர்க்கதரிசியின் மூலம்
  rationale: ‘கையால்’ என்ற எபிரெய மரபுத்தொடர் இடைமுகம் அல்லது கருவித்தன்மையைக் குறிக்கிறது. ‘மூலம்’ என்பது யெகூ தீர்க்கதரிசியாகச் செய்தி வழங்கிய பங்கை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பட்டப்பெயர் அல்ல, உடன்படிக்கையின் தனிப்பெயர் நேரடியாக உள்ளது. ஆகவே அதை ஒரு பட்டப்பெயரால் பதிலிடாமல் ஒலிபெயர்த்துள்ளது.
- issue: אֶל בַּעְשָׁא என்பதன் பொருள்
  choice: பாஷாவுக்கு எதிராக
  alternative: பாஷாவிடம்
  rationale: இலக்கண ரீதியில் ‘பாஷாவிடம்’ சாத்தியம். ஆனால் சூழலில் அது அவர்மீது அறிவிக்கப்பட்ட தண்டனைத் தீர்ப்பு என்பதால் ‘எதிராக’ அதன் கருத்துவலிமையை வெளிப்படுத்துகிறது; மூலத்தின் மாற்றுச் சாத்தியம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- issue: בֵּית בַּעְשָׁא என்பதன் அரச வம்சப் பொருள்
  choice: பாஷாவின் வம்சம்
  alternative: பாஷாவின் வீடு
  rationale: இங்கு அழிக்கப்பட்டது ஒரு கட்டடம் அல்ல; பாஷாவின் அரச குடும்பத் தொடரே. ‘வம்சம்’ அந்த வரலாற்று மற்றும் அரசியல் பொருளை வாசகருக்கு தெளிவாக்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், வரலாற்று விவரிப்புக்கேற்ற கண்ணியமான மற்றும் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘அழித்துப்போட்டான்’ மூல வினையின் தீவிரத்தைக் காக்கிறது; ‘வம்சம்’ அரச ‘வீடு’ என்ற மரபுத்தொடரின் சூழல்சார் பொருளைத் தெளிவாக்குகிறது. மூலத்தில் உள்ள אֶל என்பதன் உண்மையான இருபொருள் சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
