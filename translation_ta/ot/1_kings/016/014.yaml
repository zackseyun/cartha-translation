source:
  edition: WLC
  text: וְ/יֶ֛תֶר דִּבְרֵ֥י אֵלָ֖ה וְ/כָל אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֽוֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/014.yaml
  text: The rest of the acts of Elah[a], and all that he did—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: ta
  text: ஏலாவின் மற்ற செயல்களும், அவன் செய்த அனைத்தும், இஸ்ரவேல் அரசர்களின் வரலாற்றுப் பதிவேட்டில்[a] எழுதப்பட்டிருக்கின்றன அல்லவா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்ரவேல் அரசர்களின் நாளாகமப் புத்தகத்தில்.”
    reason: דִּבְרֵי הַיָּמִים என்பதற்கு மரபான ‘நாளாகமம்’ என்ற மாற்று மொழிபெயர்ப்பை வழங்குகிறது.
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי אֵלָה
  choice: ஏலாவின் மற்ற செயல்களும்
  rationale: יֶתֶר என்பது ‘மீதியானவை/மற்றவை’ என்றும், דִּבְרֵי என்பது இவ்வரச வரலாற்றுச் சூத்திரத்தில் ‘செயல்கள்’ என்றும் பொருள்படுகிறது. தொடக்க וְ தமிழில் பட்டியலைத் தொடரும் ‘-உம்’ மூலம் இயல்பாக வெளிப்படுகிறது.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: அவன் செய்த அனைத்தும்
  rationale: עָשָׂה என்ற பரந்த பொருளுடைய வினையை ‘செய்த’ என்று நேரடியாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: எழுதப்பட்டிருக்கின்றன அல்லவா?
  rationale: הֲלוֹא உறுதியான ஆம் என்ற பதிலை எதிர்பார்க்கும் வினாவை அறிமுகப்படுத்துகிறது; தமிழில் ‘அல்லவா?’ அதே வினாவியல் வலிமையைத் தக்கவைக்கிறது. பன்மை எழுவாய்க்கேற்ப ‘எழுதப்பட்டிருக்கின்றன’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים
  choice: வரலாற்றுப் பதிவேட்டில்
  rationale: இந்தச் சூழலில் סֵפֶר דִּבְרֵי הַיָּמִים அரசர்களைப் பற்றிய அதிகாரபூர்வ நிகழ்வுப் பதிவைக் குறிக்கிறது. ‘வரலாற்றுப் பதிவேடு’ நவீன வாசகருக்கு தெளிவானதும், வேதாகமத்தின் ‘நாளாகமம்’ என்ற நூலுடன் தேவையற்ற குழப்பத்தைத் தவிர்ப்பதும் ஆகும்.
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் அரசர்களின்
  rationale: இங்கு לְ தொடர்பையோ உடைமையையோ குறிக்கிறது; பதிவேடு இஸ்ரவேலின் அரசர்களைப் பற்றியது என்பதை இவ்வடிவம் இயல்பாகத் தெரிவிக்கிறது.
