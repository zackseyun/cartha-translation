  yaml_path: translation/ot/1_kings/016/026.yaml
  text: For he walked in all the way of Jeroboam son of Nebat[a], and in his sins by which he caused Israel to sin, provoking Yahweh, the God of Israel, with their idols.
translation:
  language: ta
  text: அவன் நேபாத்தின் மகன் யெரொபெயாமின் வழிமுறைகளையெல்லாம் பின்பற்றி, இஸ்ரவேலைப் பாவம் செய்யவைத்த அவனுடைய பாவங்களையும் பின்பற்றினான்; அவர்களுடைய சிலைகளால்[a] இஸ்ரவேலின் கடவுளாகிய யாவேக்குக் கோபமூட்டினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “அவர்களுடைய வீணானவற்றால்” அல்லது “அவர்களுடைய பயனற்றவற்றால்.” சிலைகளைக் குறிப்பிட இச்சொல் இழிவுப்பொருளுடன் அடிக்கடி பயன்படுத்தப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּכָל דֶּרֶךְ
  choice: வழியிலெல்லாம் நடந்தான்
  rationale: הלך ... בדרך என்பது உடல்ரீதியான பயணத்தைக் காட்டாமல் வாழ்க்கை நடத்தை அல்லது பின்பற்றிய முறையைக் குறிக்கும் உருவகம். தமிழிலும் “வழியில் நடத்தல்” என்ற உருவகத்தை இயல்பாகத் தக்கவைக்கிறது.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: நேபாத்தின் மகன் யெரொபெயாம்
  rationale: எபிரெயத் தனிப்பெயர்களைத் தமிழில் வழக்கமான ஒலிபெயர்ப்பு வடிவில் தருகிறது.
- source_word: וּבְחַטֹּאתָיו
  choice: அவனுடைய பாவங்களிலும்
  rationale: மூன்றாம் நபர் ஆண்பால் ஒருமை உடைமை விகுதியுடன் உள்ள பன்மைப் பெயர்ச்சொல்லை நேரடியாகப் பிரதிபலிக்கிறது; இது யெரொபெயாமின் பாவங்களைக் குறிக்கிறது.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: இஸ்ரவேலைப் பாவம் செய்யவைத்த
  rationale: חטא என்பதன் ஹிஃபில் வடிவிலுள்ள காரணவினைப் பொருளைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: לְהַכְעִיס
  choice: கோபமூட்டினான்
  rationale: முந்தைய நடத்தையின் நோக்கம் அல்லது விளைவாக யாவே தூண்டப்பட்டதைக் காட்டுகிறது; தமிழில் இயல்பான வினைமுற்றாக வாக்கியத்தை நிறைவு செய்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கடவுள்
  rationale: இணைப்புநிலைத் தொடரை நேரடியாகவும் இயல்பான தமிழிலும் வழங்குகிறது.
- source_word: בְּהַבְלֵיהֶם
  choice: அவர்களுடைய சிலைகளால்
  rationale: הבל என்பதன் அடிப்படைப் பொருள் ஆவி, வெறுமை அல்லது பயனின்மை; இச்சூழலில் இழிவாகக் குறிப்பிடப்படும் பொய்த் தெய்வங்கள் அல்லது வழிபாட்டுச் சிலைகளே நோக்கப்பட்டுள்ளதால் “சிலைகள்” சூழற்பொருளைத் தெளிவாக்குகிறது. நேரடியான உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலவசனம் தெய்வீகத் தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. அதைப் பொதுப் பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் தனிப்பெயர் தன்மையைப் பாதுகாக்கிறது.
- issue: הבל என்பதன் சிலைவழிபாட்டு சார்ந்த இழிவுப்பொருள்
  choice: சிலைகள்
  alternative: வீணானவை / பயனற்றவை
  rationale: சூழலில் யெரொபெயாமின் வழிபாட்டுப் பாவங்களே குறிப்பிடப்படுகின்றன. “சிலைகள்” குறிப்பைத் தெளிவாக்குகிறது; எனினும் எபிரெயச் சொல்லின் வெறுமை/பயனின்மை உருவகம் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதில் புரியும், ஆனால் வேதாகம வரலாற்றுரைக்கு ஏற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மொழியின் “வழியில் நடத்தல்” என்ற நடத்தைசார் உருவகம் தக்கவைக்கப்பட்டு, நீண்ட எபிரெய வாக்கியம் தமிழின் இயல்புக்காக இரு வாக்கியங்களாக அமைக்கப்பட்டுள்ளது. அடிக்குறி அது விளக்கும் “சிலைகளால்” என்பதன் பின்னரே வைக்கப்பட்டுள்ளது.
