base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/013.yaml
  text: because of all the sins of Baasha and the sins of Elah his son[a], which they committed and by which they caused Israel to sin, provoking Yahweh, the God of Israel, with their idols.
translation:
  language: ta
  text: பாஷாவின் எல்லாப் பாவங்களினாலும், அவன் மகன் ஏலாவின் பாவங்களினாலும்—அவர்கள் தாங்களே பாவம் செய்து, இஸ்ரவேலைப் பாவம் செய்யவைத்து, தங்கள் சிலைகளால்[a] இஸ்ரவேலின் கடவுளாகிய யாவேக்குக் கோபமூட்டியதினாலும்—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேர்ச்சொல்லாக, “தங்கள் வீண்மைகளால்” அல்லது “தங்கள் பயனற்ற பொருள்களால்”; இது சிலைகளைக் குறிக்கும் இகழ்ச்சியான சொல்லாட்சி.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶל
  choice: நிமித்தமும்
  rationale: இங்கு முந்தைய தீர்ப்புக்கான காரணத்தை அறிமுகப்படுத்துவதால், திசையைக் காட்டாமல் காரணப் பொருளைத் தருகிறது.
- source_word: כָּל חַטֹּאות בַּעְשָׁא וְחַטֹּאות אֵלָה בְנוֹ
  choice: பாஷாவும் அவன் மகன் ஏலாவும் செய்த எல்லாப் பாவங்கள்
  rationale: இருவருடைய பாவங்களையும் உள்ளடக்கும் எபிரேயக் கட்டமைப்பை இயல்பான நவீனத் தமிழில் தெளிவாகத் தருகிறது.
- source_word: אֲשֶׁר חָטְאוּ
  choice: அவர்கள் ... செய்த
  rationale: ‘பாவங்களைப் பாவஞ்செய்தனர்’ என்ற இயல்பற்ற சொல்லாட்சியைத் தவிர்த்து, உறவுத் தொடரின் பொருளைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַאֲשֶׁר הֶחֱטִיאוּ אֶת יִשְׂרָאֵל
  choice: அவர்கள் இஸ்ரவேலைப் பாவம் செய்யவைத்தது
  rationale: חטא என்பதன் ஹிஃபில் வடிவிலுள்ள காரணவினைப் பொருளைப் பாதுகாக்கிறது.
- source_word: לְהַכְעִיס
  choice: கோபமூட்டிய
  rationale: அவர்களுடைய செயல்கள் யாவேயைக் கோபப்படுத்திய விளைவு அல்லது நோக்கத்தைச் சுருக்கமாகத் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரேய இறைப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கடவுள்
  rationale: எபிரேய இணைப்புச் சொற்றொடரை நேராகவும் இயல்பாகவும் தருகிறது.
- source_word: בְּהַבְלֵיהֶם
  choice: தங்கள் சிலைகளால்
  rationale: הֶבֶל என்பதன் அடிப்படைப் பொருள் ‘மூச்சு, ஆவி, வீண்மை’; இச்சிலை வழிபாட்டுச் சூழலில் அது பயனற்ற வழிபாட்டுப் பொருள்களாகிய சிலைகளைக் குறிக்கிறது. வாசகருக்குத் தெளிவாக ‘சிலைகள்’ எனத் தரப்பட்டு, நேரடியான சொல்லாட்சி அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: யெகோவா அல்லது ஆண்டவர்
  rationale: மூல வசனத்தில் தனிப்பட்ட இறைப் பெயரான நான்கெழுத்துப் பெயர் நேரடியாக உள்ளது; ஆகவே பட்டப்பெயரைப் பதிலிடாமல் ஒலிபெயர்க்கப்பட்டது.
- issue: בְּהַבְלֵיהֶם என்பதன் சிலைவழிபாட்டு உட்பொருள்
  choice: தங்கள் சிலைகளால்
  alternative: தங்கள் வீணான பொருள்களால்
  rationale: சூழல் சிலைவழிபாட்டைக் குறித்தாலும், மூலச் சொல்லின் ‘வீண்மை/பயனின்மை’ என்ற இகழ்ச்சிப் பொருள் அடிக்குறிப்பில் வைக்கப்படுகிறது; இதனால் உருவகத்தின் இறையியல் கூர்மை முற்றிலும் மறைவதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரேய வசனம் முந்தைய தீர்ப்பு வாக்கியத்துடன் காரணத் தொடராக இணைந்திருப்பதால், தனித்து வாசிக்கத் தெளிவாக ‘இது நிகழ்ந்தது’ சேர்க்கப்பட்டுள்ளது; இது புதிய நிகழ்வைச் சேர்ப்பதல்ல, மூலத்தின் வாக்கியத் தொடர்பை வெளிப்படுத்தும் நிரப்புச் சொற்றொடர்.
