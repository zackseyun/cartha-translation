revisions:
- from: பாஷாவும் அவன் மகன் ஏலாவும் செய்த எல்லாப் பாவங்களினிமித்தமும், அவர்கள் இஸ்ரவேலைப் பாவம் செய்யவைத்ததினிமித்தமும், தங்கள் சிலைகளால்[a] இஸ்ரவேலின் கடவுளாகிய யாவேக்குக் கோபமூட்டியதினிமித்தமும் இது நிகழ்ந்தது.
  to: பாஷாவின் எல்லாப் பாவங்களினாலும், அவன் மகன் ஏலாவின் பாவங்களினாலும்—அவர்கள் தாங்களே பாவம் செய்து, இஸ்ரவேலைப் பாவம் செய்யவைத்து, தங்கள் சிலைகளால்[a] இஸ்ரவேலின் கடவுளாகிய யாவேக்குக் கோபமூட்டியதினாலும்—
