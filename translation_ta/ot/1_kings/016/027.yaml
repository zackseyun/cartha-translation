translation_notes:
  register: இயல்பான, நவீன, மரியாதைமிக்க பொதுத் தமிழ் பயன்படுத்தப்பட்டுள்ளது. அரசர்காலச் சுருக்கத்தின் முறையான தொனியும், மூலத்தின் மறைமுக வினாவும் காக்கப்பட்டுள்ளன. பெயர் ‘உம்ரி’ எனத் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
