  edition: WLC
  text: וְ/יֶ֨תֶר דִּבְרֵ֤י עָמְרִי֙ אֲשֶׁ֣ר עָשָׂ֔ה וּ/גְבוּרָת֖/וֹ אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֹֽא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/027.yaml
  text: The rest of the acts of Omri[a], what he did[b], and his might that he showed—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: ta
  text: உம்ரியின் மற்ற செயல்களும், அவர் செய்த அனைத்தும், அவர் வெளிப்படுத்திய வல்லமையும்[a] இஸ்ரவேல் அரசர்களின் நாள்குறிப்பு நூலில் எழுதப்பட்டிருக்கின்றன அல்லவா?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “வல்லமை” என்பதற்கான எபிரெயச் சொல் வலிமையையோ, அந்த வலிமையை வெளிப்படுத்திய வீரச் செயல்களையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “இஸ்ரவேல் அரசர்களின் நாள்குறிப்பு நூல்” என்பது அரசவையின் ஆண்டுவாரி வரலாற்றுப் பதிவைக் குறிக்கிறது; இது வேதாகமத்தின் நாளாகமப் புத்தகம் அல்ல.
    reason: cultural_note
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי עָמְרִי
  choice: உம்ரியின் மற்ற செயல்களும்
  rationale: அரசரின் ஆட்சிச் சுருக்கச் சூத்திரத்தில் דִּבְרֵי என்பது வெறும் ‘வார்த்தைகள்’ அல்ல, அவருடைய செயல்கள் அல்லது நிகழ்வுகளைக் குறிக்கிறது; וְיֶתֶר என்பது மீதமுள்ளவற்றைக் குறிக்கிறது.
- source_word: אֲשֶׁר עָשָׂה
  choice: அவர் செய்தவையும்
  rationale: எபிரெய உரையின் தொடர்புப்பெயர் வாக்கியத்தையும், முந்தைய ‘செயல்கள்’ என்பதுடன் காணப்படும் மீளுரைப்பையும் சுருக்காமல் காக்கிறது.
- source_word: וּגְבוּרָתוֹ אֲשֶׁר עָשָׂה
  choice: அவர் வெளிப்படுத்திய வல்லமையும்
  rationale: גְּבוּרָה என்பது வலிமையையோ அந்த வலிமையை வெளிக்காட்டும் வீரச் செயல்களையோ குறிக்கலாம். ‘வெளிப்படுத்திய வல்லமை’ என்ற மொழிபெயர்ப்பு இரு சாத்தியங்களுக்கும் இடமளித்து, தொடர்ந்துள்ள אֲשֶׁר עָשָׂה என்பதன் செயற்பாட்டு உணர்வையும் வழங்குகிறது.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: எழுதப்பட்டிருக்கின்றன அல்லவா?
  rationale: உறுதியான பதிலை எதிர்பார்க்கும் எபிரெய மறைமுக வினாவின் வலிமையை இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים
  choice: நாள்குறிப்பு நூலில்
  rationale: இங்கு סֵפֶר என்பது எழுத்துப் பதிவையும் דִּבְרֵי הַיָּמִים என்பது அரசர்கால நிகழ்வுகளின் ஆண்டுவாரிப் பதிவுகளையும் குறிக்கின்றன. ‘நாள்குறிப்பு நூல்’ என்பது வரலாற்று ஆவணத்தின் தன்மையைத் தெளிவாக உணர்த்துகிறது.
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் அரசர்களின்
  rationale: לְ இங்கு நன்மைப் பொருளைக் குறிக்காமல், அந்தப் பதிவு இஸ்ரவேலின் அரசர்களைப் பற்றியது என்ற உறவைக் குறிக்கிறது.
