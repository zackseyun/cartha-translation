  text: And the people who were camped there heard it said, “Zimri has conspired and has also struck down the king.” So all Israel made Omri, the commander of the army over Israel, king that day in the camp.
translation:
  language: ta
  text: முகாமிட்டிருந்த மக்கள், “சிம்ரி சதி செய்து, அரசனையும் கொன்றான்” என்று சொல்லப்படுவதைக் கேட்டார்கள். ஆகவே, இஸ்ரவேலர் அனைவரும் படைத்தலைவனான ஒம்ரியை அன்றே முகாமில் இஸ்ரவேலின் அரசனாக்கினார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעָם הַחֹנִים
  choice: முகாமிட்டிருந்த மக்கள்
  rationale: חנה என்பதன் இங்கு பொருத்தமான பொருள் முகாமிடுதல்; பங்கேற்பு வடிவம் அப்போது முகாமிட்டிருந்த மக்களைக் குறிக்கிறது.
- source_word: קָשַׁר
  choice: சதிசெய்து
  rationale: அரசனுக்கு எதிராக சதித்திட்டம் தீட்டி செயல்பட்டதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: הִכָּה אֶת־הַמֶּלֶךְ
  choice: அரசனையும் கொன்றுவிட்டான்
  rationale: נכה தனியாக ‘அடித்தான்/வீழ்த்தினான்’ என அமையலாம்; இந்த அரசியல் கொலைச் சூழலில் அரசனைக் கொன்றது என்பதே நோக்குப்பொருள், וגם என்பதைக் ‘-யும்’ காட்டுகிறது.
- source_word: שַׂר צָבָא
  choice: படைத்தலைவன்
  rationale: இராணுவத்தின் தலைமைத் தளபதியைக் குறிக்கும் சுருக்கமான, வழக்கமான தமிழ் பதம்.
- source_word: וַיַּמְלִכוּ ... אֶת־עָמְרִי
  choice: ஒம்ரியை ... அரசனாக்கினார்கள்
  rationale: ஹிப்ரு causative அரசராக்கும் செயலை நேரடியாகக் காட்டுகிறது.
