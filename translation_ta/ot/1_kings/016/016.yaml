translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளது. ‘כל ישראל’ என்பது சூழலிலுள்ள கூட்டுப்படையை அரசியல் ஒருமைப்பாட்டுடன் சுட்டுவதால் ‘இஸ்ரவேலர் அனைவரும்’ என வழங்கப்பட்டது. மூலத்தின் நிகழ்வுவரிசையும் ‘அன்றே முகாமில்’ என்ற வலியுறுத்தலும் காக்கப்பட்டுள்ளன.
