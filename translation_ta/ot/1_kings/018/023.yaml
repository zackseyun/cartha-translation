base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/023.yaml
  text: Let them give us two bulls[a], and let them choose one bull for themselves, cut it into pieces, and place it on the wood, but put no fire under it. And I will prepare the other bull and place it on the wood, and I will put no fire under it.
translation:
  language: ta
  text: அவர்கள் நமக்கு இரண்டு காளைகளைக் கொடுக்கட்டும். அவற்றில் ஒரு காளையை அவர்கள் தங்களுக்காகத் தேர்ந்தெடுத்து, அதைத் துண்டுகளாக வெட்டி, விறகின்மேல் வைக்கட்டும்; ஆனால் நெருப்பு வைக்கக் கூடாது.[a] நான் மற்ற காளையை ஆயத்தப்படுத்தி, விறகின்மேல் வைப்பேன்; நானும் நெருப்பு வைக்கமாட்டேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “நெருப்பு வைக்கக் கூடாது” என்று உள்ளது. நெருப்பு எங்கு வைக்கப்பட வேண்டும் என்பது வெளிப்படையாகக் கூறப்படவில்லை; பலிக்கான அமைப்பில் அது விறகில் மூட்டப்படுவதைச் சூழல் உணர்த்துகிறது.
    reason: மூலத்தில் இடக்குறிப்பு இல்லாததைத் தெளிவுபடுத்தும் சொற்பொருள் குறிப்பு.
lexical_decisions:
- source_word: וְיִתְּנוּ לָנוּ
  choice: அவர்கள் நமக்கு ... கொடுக்கட்டும்
  rationale: இணைப்புடன் வரும் imperfect இங்கு முன்மொழிவு அல்லது சவாலைக் குறிக்கிறது; ‘கொடுக்கட்டும்’ அதன் வலிமையை இயல்பான தமிழில் காக்கிறது.
- source_word: שְׁנַיִם פָּרִים
  choice: இரண்டு காளைகள்
  rationale: פַּר பலியிடும் சூழலில் மந்தையிலுள்ள ஆண் மாட்டைக் குறிக்கிறது; வயது பற்றிய கூடுதல் குறிப்பைச் சேர்க்காமல் ‘காளை’ துல்லியமாக உள்ளது.
- source_word: וְיִבְחֲרוּ לָהֶם הַפָּר הָאֶחָד
  choice: அவற்றில் ஒரு காளையை அவர்கள் தங்களுக்காகத் தேர்ந்தெடுத்து
  rationale: בחר என்பதன் ‘தேர்ந்தெடு’ என்ற பொருளையும், לָהֶם காட்டும் தங்கள் தரப்பிற்கான தேர்வையும் வெளிப்படுத்துகிறது. ‘அவற்றில்’ என்பது இரண்டு காளைகளில் ஒன்றைச் சுட்டும் எபிரெய அமைப்பைத் தமிழில் தெளிவாக்குகிறது.
- source_word: וִינַתְּחֻהוּ
  choice: அதைத் துண்டுகளாக வெட்டி
  rationale: נתח பலிக்கான விலங்கைப் பகுதிகளாகப் பிரிப்பதைக் குறிக்கிறது; துண்டுகளின் எண்ணிக்கை அல்லது வடிவத்தைத் தேவையின்றி குறிப்பிடவில்லை.
- source_word: וְיָשִׂימוּ עַל־הָעֵצִים
  choice: விறகின்மேல் வைக்கட்டும்
  rationale: הָעֵצִים இங்கு பலிக்காக அடுக்கப்பட்ட எரிபொருள் மரக்கட்டைகளைக் குறிக்கிறது; இயல்பான தமிழில் ‘விறகு’ பொருத்தமான கூட்டுப்பெயர்.
- source_word: וְאֵשׁ לֹא יָשִׂימוּ
  choice: ஆனால் நெருப்பு வைக்கக் கூடாது
  rationale: எபிரெயம் நேரடியாக ‘நெருப்பு வைக்க வேண்டாம்’ என்கிறது. மூலத்தில் இல்லாத ‘அதன் கீழ்’ என்பதை முதன்மை உரையில் சேர்க்காமல் கட்டளையின் பொருள் காக்கப்படுகிறது.
- source_word: וַאֲנִי אֶעֱשֶׂה אֶת־הַפָּר הָאֶחָד
  choice: நான் மற்ற காளையை ஆயத்தப்படுத்தி
  rationale: பலிச் சூழலில் עשה வெறும் ‘செய்’ என்பதைக் காட்டிலும் விலங்கை ஆயத்தப்படுத்துவதைக் குறிக்கிறது. முதல் காளை அவர்களுக்கு ஒதுக்கப்பட்டதால் הָאֶחָד இங்கு மீதமுள்ள ‘மற்ற’ காளை என இயல்பாக வெளிப்படுகிறது.
- source_word: וְנָתַתִּי עַל־הָעֵצִים
  choice: விறகின்மேல் வைப்பேன்
  rationale: נתן இங்கு ‘வை’ என்ற பொருளில் முன் சொற்றொடருடன் இணையான செயலைக் குறிக்கிறது.
- source_word: וְאֵשׁ לֹא אָשִׂים
  choice: நானும் நெருப்பு வைக்கமாட்டேன்
  rationale: எலியாவும் அதே நிபந்தனையைப் பின்பற்றுவார் என்ற இணை அமைப்பை ‘நானும்’ இயல்பாக வெளிப்படுத்துகிறது; ‘கீழே’ போன்ற வெளிப்படையாக இல்லாத இடக்குறிப்பு சேர்க்கப்படவில்லை.
theological_decisions:
- issue: பலிக்கான ஆயத்த மொழியைப் பிற்கால இறையியல் வகைப்பாடுகள் இன்றி மொழிபெயர்த்தல்
  choice: ‘துண்டுகளாக வெட்டி,’ ‘விறகின்மேல் வைத்து,’ ‘நெருப்பு வைக்காமல்’ என்ற நேரடியான செயல்முறைச் சொற்களைப் பயன்படுத்துதல்
  alternative: முழுவதும் தொழில்நுட்பமான பலிபாட்டு மொழியைப் பயன்படுத்துதல் அல்லது இதை ஒரு குறிப்பிட்ட பலிவகையாக அடையாளப்படுத்துதல்
  rationale: வசனம் கர்மேல் மலையில் நடைபெறும் சோதனைக்கான நடைமுறை ஆயத்தத்தை விவரிக்கிறது; பலியின் வகையையோ அதற்கான தனிப்பட்ட இறையியல் விளக்கத்தையோ உரை இங்கே கூறவில்லை.
translation_notes:
  register: நவீன தரமான, மரியாதைமிக்க, பொதுவாசகர்களுக்குப் புரியும் தமிழ். சவாலின் கட்டளைத் தன்மையை ‘கொடுக்கட்டும் / வைக்கட்டும் / கூடாது’ என்ற வடிவங்கள் காக்கின்றன; ‘ஆயத்தப்படுத்தி’ என்பது பலிச் சூழலைத் தெளிவாக்கினாலும் தேவையற்ற சமயத் தொழில்நுட்பச் சொல்லாக்கத்தைத் தவிர்க்கிறது.
