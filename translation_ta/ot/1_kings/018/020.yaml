translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘இஸ்ரவேலின் மகன்கள்’ என்ற சொற்படியான ஆனால் தமிழில் இயல்பற்ற கூட்டுப் பெயருக்குப் பதிலாக ‘இஸ்ரவேல் மக்கள்’ முதன்மை உரையில் பயன்படுத்தப்பட்டுள்ளது; மூல வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
