  text: וַ/יִּשְׁלַ֥ח אַחְאָ֖ב בְּ/כָל בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/יִּקְבֹּ֥ץ אֶת הַ/נְּבִיאִ֖ים אֶל הַ֥ר הַ/כַּרְמֶֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/020.yaml
  text: So Ahab sent to all the sons of Israel and gathered the prophets to Mount Carmel[a].
translation:
  language: ta
  text: ஆகவே ஆகாப் இஸ்ரவேல் மக்கள் அனைவருக்கும்[a] செய்தி அனுப்பி, தீர்க்கதரிசிகளைக் கர்மேல் மலையில் ஒன்றுகூட்டினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்படியாக, “இஸ்ரவேலின் மகன்கள் அனைவருக்கும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: செய்தி அனுப்பி
  rationale: שׁלח என்பதன் அடிப்படைப் பொருள் ‘அனுப்பு.’ இங்கு அனுப்பப்பட்ட பொருள் எபிரெயத்தில் வெளிப்படையாகக் கூறப்படவில்லை; தமிழில் இயல்பாகவும் முழுமையாகவும் அமைய ‘செய்தி அனுப்பி’ என்று வழங்கப்பட்டுள்ளது. ‘அழைப்புவிடுத்து’ என்பது சூழலுக்குப் பொருந்தினாலும், மூலத்தைவிட அதிக விளக்கத்தைச் சேர்க்கும்.
- source_word: בְּכָל בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள் அனைவருக்கும்
  rationale: בְּ என்பது இங்கு செய்தி சென்றவர்களைக் குறிக்கிறது. בְּנֵי יִשְׂרָאֵל என்பதன் சொற்பொருள் ‘இஸ்ரவேலின் மகன்கள்’; ஆனால் இவ்விடத்தில் அது இஸ்ரவேல் மக்களைக் கூட்டாகக் குறிக்கும் வழக்குச் சொற்றொடர். இயல்பான நவீன தமிழுக்காக ‘இஸ்ரவேல் மக்கள்’ என வழங்கி, சொற்படியான வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: וַיִּקְבֹּץ
  choice: ஒன்றுகூட்டினான்
  rationale: קבץ என்பது சிதறியிருப்பவர்களை ஓரிடத்தில் கூட்டுதல் அல்லது ஒன்றுதிரட்டுதல். மனிதர்களைப் பற்றிய இச்சூழலில் ‘ஒன்றுகூட்டினான்’ இயல்பாக உள்ளது.
- source_word: הַנְּבִיאִים
  choice: தீர்க்கதரிசிகளை
  rationale: נְבִיאִים என்பதற்கான நிலையான, பரவலாகப் புரிந்துகொள்ளப்படும் தமிழ் வேதாகமச் சொல் ‘தீர்க்கதரிசிகள்.’ மூலத்தில் உள்ள குறிப்பிட்ட பன்மை வடிவம் பாதுகாக்கப்பட்டுள்ளது.
- source_word: אֶל הַר הַכַּרְמֶל
  choice: கர்மேல் மலையில்
  rationale: இலக்கு நோக்கிய இயக்கத்தைக் குறிக்கும் אֶל, ‘ஒன்றுகூட்டினான்’ என்பதுடன் தமிழில் இயல்பாக இடவெற்றுமையால் வழங்கப்படுகிறது. הַר הַכַּרְמֶל என்பது ‘கர்மேல் மலை.’
