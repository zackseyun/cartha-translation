source:
  edition: WLC
  text: וְ/הָיָ֞ה אֲנִ֣י אֵלֵ֣ךְ מֵ/אִתָּ֗/ךְ וְ/ר֨וּחַ יְהוָ֤ה יִֽשָּׂאֲ/ךָ֙ עַ֚ל אֲשֶׁ֣ר לֹֽא אֵדָ֔ע וּ/בָ֨אתִי לְ/הַגִּ֧יד לְ/אַחְאָ֛ב וְ/לֹ֥א יִֽמְצָאֲ/ךָ֖ וַ/הֲרָגָ֑/נִי וְ/עַבְדְּ/ךָ֛ יָרֵ֥א אֶת יְהוָ֖ה מִ/נְּעֻרָֽ/י׀׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/012.yaml
  text: And when I go away from you[a], the Spirit of Yahweh may carry you where I do not know. Then when I come and tell Ahab and he does not find you, he will kill me—though your servant has feared Yahweh from my youth.
translation:
  language: ta
  text: நான் உம்மைவிட்டுப் போனபின், யாவேயின் ஆவி[a] நான் அறியாத ஓர் இடத்துக்கு உம்மைக் கொண்டுபோகலாம். நான் போய் ஆகாபிடம் தெரிவித்த பிறகு, அவன் உம்மைக் காணாவிட்டால் என்னைக் கொன்றுவிடுவான். ஆனால், உமது அடியவனான நான் இளமையிலிருந்தே யாவேக்குப் பயந்து வந்திருக்கிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேயின் காற்று”; எபிரெயச் சொல்லான «ரூவாக்» ஆவி, காற்று, அல்லது மூச்சு என்று பொருள்படலாம். இச்சூழலில் «ஆவி» என்பது அதிகம் பொருந்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה אֲנִי אֵלֵךְ מֵאִתָּךְ
  choice: நான் உம்மைவிட்டுப் போனவுடன்
  rationale: எதிர்காலத்தில் நிகழக்கூடிய சூழலை அறிமுகப்படுத்தும் எபிரெயத் தொடரை இயல்பான தமிழ் காலத் தொடராக அளிக்கிறது.
- source_word: רוּחַ יְהוָה
  choice: யாவேயின் ஆவி
  rationale: தீர்க்கதரிசியைத் தெய்வீக வல்லமை கொண்டு வேறிடத்துக்குக் கொண்டுசெல்லும் சூழலில் ‘ஆவி’ முதன்மைப் பொருளாகப் பொருந்துகிறது; இருப்பினும் ‘காற்று’ என்ற மொழியியல் வாய்ப்பு அடிக்குறிப்பில் வைக்கப்படுகிறது.
- source_word: יִשָּׂאֲךָ
  choice: உம்மைக் கொண்டுபோகலாம்
  rationale: נשא என்பதன் சுமத்துதல்/தூக்கிச் செல்லுதல் பொருளை இயல்பாகத் தருகிறது; ஒபதியாவின் அச்சத்தில் உள்ள சாத்தியநிலையை ‘லாம்’ வெளிப்படுத்துகிறது.
- source_word: עַל אֲשֶׁר לֹא אֵדָע
  choice: நான் அறியாத ஓர் இடத்துக்கு
  rationale: சொல்லுக்குச் சொல் அமைப்பைத் தவிர்த்து, தெரியாத இலக்கிடத்தைக் குறிக்கும் எபிரெயப் பொருளை தெளிவான தமிழில் தருகிறது.
- source_word: וּבָאתִי לְהַגִּיד לְאַחְאָב
  choice: நான் போய் ஆகாபிடம் தெரிவித்த பிறகு
  rationale: ஆகாபிடம் சென்று செய்தி தெரிவிக்கும் தொடர்ச்சியான செயலை இயல்பான தமிழில் காட்டுகிறது.
- source_word: וְלֹא יִמְצָאֲךָ וַהֲרָגָנִי
  choice: அவன் உம்மைக் காணாவிட்டால் என்னைக் கொன்றுவிடுவான்
  rationale: நிபந்தனையையும் அதனால் ஏற்படும் உயிர்க்கொலை விளைவையும் தெளிவாக இணைக்கிறது.
- source_word: וְעַבְדְּךָ
  choice: உமது அடியவனாகிய நான்
  rationale: இங்கு அடிமை நிலையை வலியுறுத்துவதற்குப் பதிலாக, எலியாவிடம் பேசும் மரியாதையான தாழ்மைக் குறிப்பை வெளிப்படுத்துகிறது.
- source_word: יָרֵא אֶת יְהוָה מִנְּעֻרָי
  choice: என் இளமைமுதல் யாவேக்குப் பயந்து நடப்பவன்
  rationale: יִרֵא என்பதில் உள்ள பயபக்தியையும், இளமையிலிருந்து இன்றுவரை தொடரும் வாழ்வியல் நிலைப்பாட்டையும் இயல்பான தமிழில் காட்டுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
theological_decisions:
- issue: רוּחַ יְהוָה என்பதன் பொருள்
  choice: யாவேயின் ஆவி
  alternative: யாவேயின் காற்று
  rationale: எலியா திடீரென வேறிடத்துக்குக் கொண்டுசெல்லப்படலாம் என்ற தீர்க்கதரிசனச் சூழல் தனிப்பட்ட தெய்வீகச் செயல்பாட்டைக் குறிக்கும் ‘ஆவி’ என்ற வாசிப்பை ஆதரிக்கிறது; ஆனாலும் רוּחַ என்பதன் ‘காற்று’ பொருள் உண்மையான மொழியியல் மாற்றாக அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் உள்ள தனிப்பெயரைப் பட்டமாக மாற்றாமல் ஒலிபெயர்த்து வழங்குகிறது.
- issue: יָרֵא என்பதிலுள்ள பயமும் பக்தியும்
  choice: யாவேக்குப் பயந்து நடப்பவன்
  alternative: யாவேயை வணங்கி வந்தவன்
  rationale: மூலத்தின் ‘பயம்’ சார்ந்த சொற்பொருளை மறைக்காமல், தமிழில் அது வாழ்க்கைமுறையைக் குறிக்க ‘நடப்பவன்’ என இயல்பாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில் மரியாதையான இரண்டாம் நபர் வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. உரை கண்ணியமானதாகவும் பொதுவாசகர்களுக்கு எளிதாகவும் வைக்கப்பட்டுள்ளது; ‘அடியவன்’, ‘பயந்து நடப்பவன்’ ஆகியவை அரண்மனைச் சூழலையும் பயபக்தியின் தொடர்ச்சியையும் பாதுகாக்கின்றன.
