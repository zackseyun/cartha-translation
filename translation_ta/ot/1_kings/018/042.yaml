base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/042.yaml
  text: So Ahab went up to eat and to drink[a], but Elijah went up to the top of Carmel[c][b], and he bent down to the ground and put his face between his knees.
translation:
  language: ta
  text: ஆகாப் சாப்பிடவும் குடிக்கவும் மேலே சென்றான். ஆனால் எலியா கர்மேலின் உச்சிக்கு[a] ஏறினான்; அவன் தரையை நோக்கிக் குனிந்து, தன் முகத்தைத் தன் முழங்கால்களுக்கு நடுவே வைத்தான்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறுவிதமாக: ‘கர்மேல் சிகரத்திற்கு’ அல்லது ‘கர்மேல் மலையின் உச்சிக்கு.’ இங்கு எபிரெய உரையில் ‘மலை’ என்ற சொல் வெளிப்படையாக இல்லை.'
    reason: lexical_alternative
  - marker: b
    text: எபிரெய உரை எலியாவின் உடல் நிலையை மட்டுமே விவரிக்கிறது. விரிவான சூழல் அவர் ஜெபித்ததைச் சுட்டுகிறது; ஆனால் இவ்வசனம் அதை வெளிப்படையாகக் கூறவில்லை.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעֲלֶה
  choice: மேலே சென்றான்
  rationale: עלה என்பதன் திசை உணர்வைப் பாதுகாக்கும் இயல்பான நவீனத் தமிழ் நடை.
- source_word: לֶאֱכֹל וְלִשְׁתּוֹת
  choice: சாப்பிடவும் குடிக்கவும்
  rationale: நோக்கத்தைக் குறிக்கும் இரண்டு எச்சவினைகளையும் தெளிவாக இணைக்கிறது; சாதாரண வாசகருக்குப் புரியும் இயல்பான நடை.
- source_word: וְאֵלִיָּהוּ
  choice: ஆனால் எலியா
  rationale: எபிரெய இணைப்புச்சொல் அடிப்படையில் ‘மற்றும்/அப்பொழுது’ என்றாலும், ஆகாபின் செயலுக்கும் எலியாவின் செயலுக்கும் இடையிலான உரைநடை எதிர்மறையைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עָלָה אֶל רֹאשׁ הַכַּרְמֶל
  choice: கர்மேலின் உச்சிக்கு ஏறிச் சென்று
  rationale: רֹאשׁ என்பதன் இடவியல் பொருளான ‘உச்சி’யையும் עלה என்பதன் ஏறுதல் உணர்வையும் காக்கிறது; ‘மலை’ என்பது இவ்வசனத்தில் வெளிப்படையாக இல்லாததால் சேர்க்கப்படவில்லை.
- source_word: וַיִּגְהַר אַרְצָה
  choice: தரைமட்டும் குனிந்து
  rationale: அரிதான גהר வினை குறிக்கும் மிகவும் தாழ்ந்து குனியும் உடல் நிலையை, வழிபாடு அல்லது ஜெபம் என்று விளக்கிச் சேர்க்காமல் தெரிவிக்கிறது.
- source_word: וַיָּשֶׂם פָּנָיו בֵּין בִּרְכָּיו
  choice: தன் முகத்தைத் தன் முழங்கால்களுக்கு நடுவே வைத்தான்
  rationale: எலியாவின் உடல் நிலையை எபிரெய மூலத்தைப் போலவே உறுதியான, நேரடியான மொழியில் விவரிக்கிறது.
theological_decisions:
- issue: எலியாவின் உடல் நிலையை வசனத்தின் முதன்மை உரையிலேயே ஜெபம் என்று விளக்க வேண்டுமா?
  choice: உடல் நிலையை மட்டும் விவரித்து, ‘ஜெபித்தான்’ என்று சேர்க்கவில்லை.
  alternative: ‘ஜெபத்தில் குனிந்தான்’ அல்லது ‘முழங்கால்களுக்கு நடுவே முகத்தை வைத்து ஜெபித்தான்.’
  rationale: சுற்றுப்புறச் சூழல் ஜெபத்தைச் சுட்டினாலும், இவ்வசனம் தானாகவே அதை வெளிப்படையாகச் சொல்லவில்லை. ஆகவே மூலத்தின் விவரிப்பையும் அதன் மறைமுகத் தன்மையையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகருக்குப் புரியும், கண்ணியமான உரைநடை. ‘சாப்பிட’ என்பது இயல்பான பொதுத்தமிழுக்காகத் தேர்ந்தெடுக்கப்பட்டது; உடல் நிலை விளக்கமின்றி நேரடியாகப் பாதுகாக்கப்பட்டது. அனைத்து அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெறுகின்றன.
