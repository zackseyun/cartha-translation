revisions:
- from: ஆகாப் சாப்பிடவும் குடிக்கவும் மேலே சென்றான். ஆனால் எலியா கர்மேலின் உச்சிக்கு[a] ஏறிச் சென்று, தரைமட்டும் குனிந்து, தன் முகத்தைத் தன் முழங்கால்களுக்கு நடுவே வைத்தான்.[b]
  to: ஆகாப் சாப்பிடவும் குடிக்கவும் மேலே சென்றான். ஆனால் எலியா கர்மேலின் உச்சிக்கு[a] ஏறினான்; அவன் தரையை நோக்கிக் குனிந்து, தன் முகத்தைத் தன் முழங்கால்களுக்கு நடுவே வைத்தான்.[b]
  rationale: The revision makes one limited idiomatic correction to the rendering of Elijah's earthward bending and slightly clarifies the sequence of actions. It preserves all source-level ambiguity, the contrast marked by the conjunction, and both existing footnote anchors and contents.
