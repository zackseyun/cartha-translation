base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/008.yaml
  text: And he said to him[a], “I am he. Go, say to your master, ‘Look, Elijah is here.’”
translation:
  language: ta
  text: அவன் அவனிடம், “நான்தான்.[a] நீ போய் உன் எஜமானிடம், ‘இதோ, எலியா இங்கே இருக்கிறார்’ என்று சொல்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நானே.” எபிரெயத்தில் வலியுறுத்தப்பட்ட “நான்” என்ற சுட்டுப்பெயர் மட்டுமே உள்ளது; இங்கு அது பேசுபவர் தம்மை அடையாளம் காட்டுவதற்குப் பயன்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לוֹ
  choice: அவன் அவனிடம் … என்றான்
  rationale: எபிரெயக் கதைநடையின் தொடர்ச்சியையும், பேச்சு ஒருவரிடம் சொல்லப்பட்டதையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אָנִי
  choice: நான்தான்
  rationale: தனித்து நிற்கும் வலியுறுத்தப்பட்ட முதலாம் நபர் சுட்டுப்பெயர், முந்தைய வசனத்தில் ஒபதியா எலியாவை அடையாளம் கண்டதற்கான உறுதிப்படுத்தலாக உள்ளது. ‘நான்தான்’ என்பது அந்தத் தன்-அடையாளப்படுத்தலை இயல்பான தமிழில் காக்கிறது.
- source_word: לֵךְ אֱמֹר
  choice: நீ போய் … சொல்
  rationale: இரு கட்டளை வினைகளையும் சுருக்கமாகவும் இயல்பாகவும் பிரதிபலிக்கிறது.
- source_word: לַאדֹנֶיךָ
  choice: உன் எஜமானிடம்
  rationale: இங்கு குறிக்கப்படுவது ஒபதியாவின் மனித அதிகாரியான ஆகாப்; ‘எஜமான்’ என்பது இறைவனுக்குரிய ஆண்டவர் என்ற பட்டத்துடன் குழப்பம் ஏற்படாமல் அந்த உறவைத் தெளிவாக்குகிறது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் எபிரெயச் சுட்டிடைச்சொல்லின் வலிமையை, நவீனத் தமிழில் சுருக்கமாகக் காக்கிறது.
- source_word: אֵלִיָּהוּ
  choice: எலியா
  rationale: தனிப்பெயர் வழக்கமான தமிழ் ஒலிபெயர்ப்பில் தரப்பட்டுள்ளது; வாக்கியம் இயல்பாக அமைய ‘இங்கே இருக்கிறார்’ என்பது சூழலிலுள்ள இருப்புப் பொருளை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: אָדוֹן என்பது மனித அதிகாரியைக் குறிக்கும் இடத்தில் அதன் மொழிபெயர்ப்பு
  choice: எஜமான்
  alternative: ஆண்டவன் / தலைவர்
  rationale: இங்கு ஆகாப் என்னும் பூமிக்குரிய அதிகாரியே குறிக்கப்படுகிறார். ‘எஜமான்’ என்பது எஜமான்–பணியாளர் உறவை வெளிப்படுத்துவதோடு, இறைவனுக்கான ‘ஆண்டவர்’ என்ற பட்டத்திலிருந்து வேறுபடுத்துகிறது.
translation_notes:
  register: நவீன, தெளிவான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயத்தின் சுருக்கமான தன்-அடையாளப்படுத்தல் ‘நான்தான்’ எனவும், הִנֵּה என்பதன் கவன ஈர்ப்பு ‘இதோ’ எனவும் காக்கப்பட்டுள்ளது.
