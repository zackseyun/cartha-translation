- source_word: פֹּסְחִים עַל שְׁתֵּי הַסְּעִפִּים
  choice: இரண்டு கிளைகளுக்கு இடையே நொண்டிக்கொண்டிருப்பீர்கள்
  rationale: פסח என்பதிலுள்ள நொண்டுதல் என்ற உருவகத்தையும், סעפים என்பதிலுள்ள கிளைகள் அல்லது கிளைப்பிரிவுகள் என்ற தெளிவற்ற உருவகத்தையும் விளக்கவுரையாக மாற்றாமல் காக்கிறது.
- source_word: אִם יְהוָה הָאֱלֹהִים
  choice: யாவேதான் கடவுள் என்றால்
  rationale: தெய்வீகப் பெயரை ஒலிபெயர்த்து, வாக்கியத்தின் தனித்த உரிமைக் கோரிக்கையைத் தமிழின் வலியுறுத்தும் ‘தான்’ மூலம் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לְכוּ אַחֲרָיו
  choice: அவரைப் பின்பற்றுங்கள்
  rationale: ஒருவருக்குப் பின்னால் செல்லுதல் என்ற எபிரெயச் சொற்றொடரின் விசுவாசம் மற்றும் பற்றுறுதியைக் குறிக்கும் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: הַבַּעַל
  choice: பாகால்
  rationale: எபிரெயில் சுட்டு உருபு இருந்தாலும், இங்கு வழிபாட்டு தெய்வத்தின் பெயராக வருவதால் தமிழில் பெயராக ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְלֹא עָנוּ הָעָם אֹתוֹ דָּבָר
  choice: ஆனால் மக்கள் அவருக்கு ஒரு வார்த்தைகூடப் பதில் சொல்லவில்லை
  rationale: மக்களின் முழுமையான மௌனத்தை வலியுறுத்தும் எபிரெய மரபுத்தொடரை வாசிக்க இயல்பான தமிழில் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூலத்தில் வரும் உடன்படிக்கைப் பெயரை பொதுப்பட்டமாக மாற்றாமல், பரவலாக ஏற்கப்பட்ட Yahweh என்ற உச்சரிப்புக்கு ஏற்ப தமிழில் ஒலிபெயர்க்கிறது.
- issue: פֹּסְחִים עַל שְׁתֵּי הַסְּעִפִּים என்பதிலுள்ள பிளவுபட்ட பற்றுறுதியின் உருவகம்
  choice: இரண்டு கிளைகளுக்கு இடையே நொண்டிக்கொண்டிருப்பீர்கள்
  alternative: இரண்டு கருத்துகளுக்கு இடையே தடுமாறிக்கொண்டிருப்பீர்கள்
  rationale: பிளவுபட்ட பற்றுறுதி என்பது சூழல்சார் பொருளாக இருந்தாலும், மூலத்தின் நொண்டுதல் மற்றும் கிளைகள் என்ற உயிருள்ள, ஓரளவு தெளிவற்ற உருவகத்தை முதன்மை உரையில் பாதுகாக்கிறது; விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: யாவே மற்றும் பாகாலைச் சுட்டும் ஒரே ஆண்பால் ஒருமைப் பிரதிப்பெயர்
  choice: இரண்டுக்கும் ‘அவரைப்’
  alternative: யாவேக்கு ‘அவரைப்’, பாகாலுக்கு ‘அவனை’
  rationale: மூல எபிரெயம் இரு இடங்களிலும் ஒரே வடிவமான אַחֲרָיו என்பதையே பயன்படுத்துகிறது. தமிழில் வேறுபட்ட மரியாதை நிலைகளைப் பயன்படுத்தி மூலத்தில் இல்லாத இலக்கண வேறுபாட்டைச் சேர்க்காமல் ஒரே வடிவம் காக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன பொதுத் தமிழில், கண்ணியமான ஆனால் எளிதில் புரியும் நடையில் வடிவமைக்கப்பட்டுள்ளது. மூல உருவகத்தின் அசாதாரண தன்மை திட்டமிட்டே காக்கப்பட்டு, அதன் கருத்துசார் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
