base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/021.yaml
  text: Then Elijah came near to all the people and said[a], “How long will you keep limping between two opinions? If Yahweh is God, follow him; but if Baal, follow him.” But the people did not answer him a word.
translation:
  language: ta
  text: பின்பு எலியா மக்கள் அனைவரிடமும் நெருங்கிவந்து, “நீங்கள் இன்னும் எவ்வளவு காலம் இரண்டு கிளைகளின்மேல் நொண்டிக்கொண்டிருப்பீர்கள்?[a] யாவேதான் கடவுள் என்றால், அவரைப் பின்பற்றுங்கள்; பாகால்தான் கடவுள் என்றால், அவரைப் பின்பற்றுங்கள்” என்றார். ஆனால் மக்கள் அவருக்கு ஒரு வார்த்தைகூடப் பதில் சொல்லவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இரண்டு நிலைப்பாடுகளுக்கு இடையே தடுமாறிக்கொண்டிருப்பீர்கள்’ என்றும் பொருள் கொள்ளலாம். எபிரெயத்தில் ‘இரண்டு கிளைகள் அல்லது கிளைப்பிரிவுகளின்மேல் நொண்டுதல்’ என்ற சற்றே தெளிவற்ற உருவகம் உள்ளது; இது பிளவுபட்ட பற்றுறுதியைக் குறிக்கிறது.
    reason: lexical_alternative
