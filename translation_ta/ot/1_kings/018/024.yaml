  yaml_path: translation/ot/1_kings/018/024.yaml
  text: Then call on the name of your god[a], and I will call on the name of Yahweh; and the God who answers by fire, he is God." And all the people answered and said[b], "The word is good.
translation:
  language: ta
  text: “நீங்கள் உங்கள் தெய்வத்தின் பெயரைச் சொல்லிக் கூப்பிடுங்கள்[a]; நானோ யாவேவின் பெயரைச் சொல்லிக் கூப்பிடுவேன். நெருப்பினால் பதிலளிக்கும் தெய்வமே கடவுள்.” மக்கள் அனைவரும் பதிலளித்து, “இந்த யோசனை நல்லது” என்றார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உங்கள் தெய்வங்களின் பெயர்களை” என்றும் மொழிபெயர்க்கலாம். אֱלֹהֵיכֶם என்ற எபிரெயச் சொல் இங்கு உண்மையான பன்மையாக எடுத்துக்கொள்ளப்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் “இந்தச் சொல் நல்லது” அல்லது “இந்தக் காரியம் நல்லது” என்றும் நேரடியாக மொழிபெயர்க்கலாம். דָּבָר என்பது சொல், காரியம் அல்லது முன்மொழிவு எனப் பொருள்படும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּקְרָאתֶם בְּשֵׁם
  choice: பெயரைச் சொல்லிக் கூப்பிடுங்கள்
  rationale: קרא בְּשֵׁם என்பது ஒரு தெய்வத்தின் பெயரை உச்சரித்து அதை நோக்கிக் கூப்பிடுவதைக் குறிக்கிறது. தமிழில் இயல்பாகவும் வழிபாட்டுச் சூழலின் பொருளைத் தெளிவாகவும் தருகிறது.
- source_word: אֱלֹהֵיכֶם
  choice: உங்கள் தெய்வத்தின்
  rationale: வடிவில் பன்மையாக இருக்கக்கூடிய போதிலும், இச்சூழலில் பாகால் என்ற ஒரே தெய்வத்தைச் சுட்டும் ஒருமைப் பொருள் இயல்பானது; உண்மையான கடவுளோடு குழப்பாமல் இருக்க ‘தெய்வம்’ பயன்படுத்தப்படுகிறது.
- source_word: וַאֲנִי אֶקְרָא
  choice: நானோ ... கூப்பிடுவேன்
  rationale: וְ இணைப்பைக் காக்கும் அதேவேளையில், எலியாவுக்கும் பாகாலின் தீர்க்கதரிசிகளுக்கும் இடையிலான எதிர்மறை ஒப்பீட்டை ‘நானோ’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான יהוה-ஐ ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பில் தருகிறது.
- source_word: הָאֱלֹהִים אֲשֶׁר יַעֲנֶה בָאֵשׁ
  choice: நெருப்பினால் பதிலளிக்கும் தெய்வம்
  rationale: בָאֵשׁ இங்கு பதில் வெளிப்படும் கருவி அல்லது வழிமுறையைக் குறிக்கிறது; ‘நெருப்பினால்’ அதைத் துல்லியமாகக் காட்டுகிறது.
- source_word: הוּא הָאֱלֹהִים
  choice: அந்தத் தெய்வமே உண்மையான கடவுள்
  rationale: הוּא தரும் வலியுறுத்தலை ‘-மே’ காக்கிறது. எபிரெயத்தில் வெளிப்படையாக இல்லாத ‘உண்மையான’ என்பது போட்டியின் தீர்ப்புப் பொருளைத் தமிழில் தெளிவாக்குகிறது; இது எந்தத் தெய்வம் உண்மையில் கடவுள் என்பதைக் குறிக்கிறது.
- source_word: וַיַּעַן כָּל הָעָם וַיֹּאמְרוּ
  choice: மக்கள் அனைவரும் அதற்குப் பதிலாக ... என்றார்கள்
  rationale: ענה மற்றும் אמר ஆகிய இரு வினைகளையும் தேவையற்ற மீளுரையின்றி இயல்பான தமிழில் பிரதிபலிக்கிறது.
- source_word: טוֹב הַדָּבָר
  choice: இந்த யோசனை நல்லது
  rationale: דָּבָר என்பதற்கு சொல், காரியம், முன்மொழிவு எனப் பொருள் வரலாம்; இங்கு மக்கள் எலியாவின் முன்வைத்த சோதனையை ஏற்றுக்கொள்வதால் ‘யோசனை’ சூழலுக்கேற்ற இயல்பான தமிழ்.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக இருப்பதால், பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்க்கப்படுகிறது.
- issue: אֱלֹהֵיכֶם ஒருமையா பன்மையா
  choice: உங்கள் தெய்வம்
  alternative: உங்கள் தெய்வங்கள்
  rationale: சொல் வடிவம் பன்மையை அனுமதித்தாலும், இப்போட்டி பாகாலை எதிர்த்து யாவேவை நிறுத்துகிறது; ஆகவே உடனடிச் சூழலில் ஒருமை பொருந்துகிறது. மூலத்தின் மாற்று வாய்ப்பு அடிக்குறிப்பில் காக்கப்படுகிறது.
- issue: הוּא הָאֱלֹהִים என்பதன் அடையாளத் தீர்ப்பு
  choice: அந்தத் தெய்வமே உண்மையான கடவுள்
  alternative: அவரே கடவுள் / அதுவே கடவுள்
  rationale: எபிரெய வலியுறுத்தலையும், நெருப்பினால் பதிலளிப்பவர்தான் கடவுள் எனத் தீர்மானிக்கப்படும் கருத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது; பாலினமுள்ள சுட்டுப்பெயரைத் தமிழில் திணிப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பானதும் கண்ணியமானதும். ‘பெயரைச் சொல்லிக் கூப்பிடுதல்’ வழிபாட்டு அழைப்பின் பொருளைக் காக்கிறது. உரையாடல் குறிகளும் முழுமையான வாக்கிய நிறுத்தமும் சீரமைக்கப்பட்டுள்ளன.
