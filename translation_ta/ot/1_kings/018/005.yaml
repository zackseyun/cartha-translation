base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/005.yaml
  text: And Ahab said to Obadiah[a], “Go through the land to all the springs of water and to all the wadis. Perhaps we may find grass and keep horse and mule alive[b], so that we do not have to cut off some of the livestock.”
translation:
  language: ta
  text: ஆகாப் ஒபதியாவிடம், “நீ தேசமெங்கும் சென்று, எல்லா நீரூற்றுகளையும் எல்லா ஓடைகளையும்[a] பார். ஒருவேளை புல் கிடைத்தால், குதிரைகளையும் கோவேறு கழுதைகளையும் உயிரோடு காப்பாற்றலாம்; கால்நடைகளில் சிலவற்றை அழித்துவிட வேண்டியிருக்காது[b]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதற்கான எபிரெயச் சொல் பருவகால நீரோடை, ஓடைப்படுகை அல்லது ஓடை எனப் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லர்த்தமாக, “கால்நடைகளிலிருந்து வெட்டியகற்றாதபடி.” தீவனம் போதாததால் கால்நடைகளில் சிலவற்றை அகற்றுவது அல்லது கொல்வது இங்கு குறிக்கப்பட்டிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּאָרֶץ
  choice: தேசமெங்கும் சென்று
  rationale: ב முன்ஒட்டு இங்கு தேசத்தின் வழியாகத் தேடிச் செல்வதைக் குறிக்கிறது; ‘தேசத்தில்’ என்ற நிலையான பொருளைவிட ‘தேசமெங்கும் சென்று’ சூழலுக்கு இயல்பானது.
- source_word: מַעְיְנֵי הַמַּיִם
  choice: நீரூற்றுகள்
  rationale: இயற்கையான நீராதாரங்களைக் குறிக்கும் எபிரெயக் கட்டமைப்பை நவீன தமிழில் சுருக்கமாகவும் தெளிவாகவும் வழங்குகிறது.
- source_word: הַנְּחָלִים
  choice: ஓடைகள்
  rationale: נחל என்பது பருவகால நீரோடை, ஓடைப்படுகை அல்லது ஓடை எனப் பொருள்படலாம். ‘ஓடைகள்’ சாதாரண தமிழ் வாசகருக்குப் புரியக்கூடியது; வறட்சிச் சூழலில் அதன் பருவகாலத் தன்மையை அடிக்குறிப்பு விளக்குகிறது.
- source_word: אוּלַי נִמְצָא
  choice: ஒருவேளை ... கிடைத்தால்
  rationale: தேடலின் நிச்சயமின்மையையும் அதன் அடிப்படையிலான எதிர்பார்ப்பையும் இயல்பான தமிழில் காக்கிறது.
- source_word: חָצִיר
  choice: புல்
  rationale: விலங்குகளுக்குத் தீவனமாகும் தாவர வளர்ச்சியை இயல்பாகக் குறிக்கிறது; ‘வைக்கோல்’ என்பது அறுத்து உலர்த்தப்பட்ட தீவனம் என்ற கூறைத் தேவையின்றி சேர்க்கும்.
- source_word: וּנְחַיֶּה
  choice: உயிரோடு காப்பாற்றலாம்
  rationale: ஹிஃபில் வடிவத்தின் ‘வாழவைத்தல்/உயிரைக் காத்தல்’ என்ற காரணவினைப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: סוּס וָפֶרֶד
  choice: குதிரைகளையும் கோவேறு கழுதைகளையும்
  rationale: எபிரெயத்தில் ஒருமைத் தொகுப்புப் பெயர்கள் வந்தாலும், தமிழில் விலங்கு வகைகளைப் பன்மையில் குறிப்பிடுவது இயல்பானது. פֶּרֶד என்பதற்கு துல்லியமான வழக்குச் சொல் ‘கோவேறு கழுதை’.
- source_word: וְלֹא נַכְרִית מֵהַבְּהֵמָה
  choice: கால்நடைகளில் சிலவற்றை அழித்துவிட வேண்டியிருக்காது
  rationale: כרת என்பதன் அடிப்படை ‘வெட்டியகற்றுதல்/ஒழித்தல்’; இங்கு தீவனமின்மையால் கால்நடை எண்ணிக்கையைக் குறைப்பதைக் குறிக்கலாம். מן பகுதியைக் குறிக்கும் என்பதால் ‘சிலவற்றை’ சேர்க்கப்பட்டுள்ளது; தமிழில் ‘அழித்துவிட’ இயல்பாக இருந்தாலும் மூலத்தின் பொருள் நெருக்கடியை அடிக்குறிப்பு காக்கிறது.
