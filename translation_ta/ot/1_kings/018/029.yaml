base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/029.yaml
  text: And it happened[a], when noon had passed, that they kept prophesying until the offering up of the grain offering, but there was no voice, no one answering[b], and no one paying attention.
translation:
  language: ta
  text: நண்பகல் கடந்தபின், அவர்கள் தானியக் காணிக்கை செலுத்தும் நேரம்வரை[a] தொடர்ந்து தீர்க்கதரிசனம் உரைத்தார்கள்[b]. ஆனால் எந்தக் குரலும் இல்லை; பதிலளிப்பவர் எவரும் இல்லை; செவிகொடுத்தவரும் எவரும் இல்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தானியக் காணிக்கை செலுத்தும் நேரம்” என்பது வழக்கமான மாலை காணிக்கை செலுத்தும் நேரத்தையும் குறிக்கக்கூடும்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “அவர்கள் வெறிகொண்டு நடந்துகொண்டார்கள்.” எபிரெய மொழியில் வழக்கமாக ‘தீர்க்கதரிசனம் உரைத்தல்’ என்பதற்குப் பயன்படுத்தப்படும் வினை இங்கும் பயன்படுத்தப்பட்டுள்ளது; இச்சூழலில் அது பாகாலின் தீர்க்கதரிசிகளின் பரவசமான நடத்தையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּעֲבֹר הַצָּהֳרַיִם
  choice: நண்பகல் கடந்தபின்
  rationale: எபிரெயக் கதைநடையின் அடுத்த கட்டத்தை இயல்பான நவீனத் தமிழில் அறிமுகப்படுத்துகிறது; தனியாக ‘அது நிகழ்ந்தது’ என்று மொழிபெயர்ப்பது தமிழில் செயற்கையாக இருக்கும்.
- source_word: וַיִּתְנַבְּאוּ
  choice: தொடர்ந்து தீர்க்கதரிசனம் உரைத்தார்கள்
  rationale: נבא என்பதன் வழக்கமான ‘தீர்க்கதரிசனம் உரைத்தல்’ என்ற தொடர்பைப் பாதுகாத்து, சூழலில் காணப்படும் நீடித்த பரவசச் செயலை ‘தொடர்ந்து’ என்பதால் வெளிப்படுத்துகிறது.
- source_word: עַד לַעֲלוֹת הַמִּנְחָה
  choice: காணிக்கை செலுத்தப்படும் நேரம்வரை
  rationale: מִנְחָה காணிக்கை, குறிப்பாக தானியக் காணிக்கை, என்பதைக் குறிக்கலாம்; לַעֲלוֹת என்பது அது செலுத்தப்படுவதைச் சுட்டுகிறது. இங்கு நேரக் குறிப்பாக இயல்பாக வழங்கப்பட்டுள்ளது; ‘மாலை’ என்பதை மூலத்தில் இல்லாதபடி சேர்க்கவில்லை.
- source_word: וְאֵין קוֹל
  choice: எந்தக் குரலும் இல்லை
  rationale: எதிர்பார்க்கப்பட்ட தெய்வீகப் பதிலின் குரல் அல்லது ஒலி எதுவும் இல்லாததை நேரடியாகக் காட்டுகிறது.
- source_word: וְאֵין עֹנֶה
  choice: பதிலளிப்பவர் எவரும் இல்லை
  rationale: ענה என்ற நிகழ்காலப் பங்கேற்புவினையின் ‘பதிலளிப்பவர் இல்லை’ என்ற தொடர்நிலை நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: וְאֵין קָשֶׁב
  choice: கவனிப்பவரும் எவரும் இல்லை
  rationale: קָשֶׁב குறிக்கும் செவிகொடுத்தல் அல்லது கவனம் செலுத்துதலை இயல்பான தமிழில் ஆளைக் குறிக்கும் வாக்கியமாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: பாகாலின் தீர்க்கதரிசிகளுடைய பரவசச் செயலை மொழிபெயர்த்தல்
  choice: தொடர்ந்து தீர்க்கதரிசனம் உரைத்தார்கள்
  alternative: வெறிகொண்டு கூச்சலிட்டார்கள்
  rationale: எபிரெயத்தில் தீர்க்கதரிசனம் உரைப்பதற்கான வழக்கமான வினையே பயன்படுத்தப்பட்டுள்ளது. சூழல் அதன் பரவசமான, பயனற்ற தன்மையை வெளிப்படுத்த அனுமதித்து, அதிக விளக்கமளிக்கும் மாற்றை அடிக்குறிப்பில் வைத்திருக்கிறது.
- issue: מִנְחָה என்பதன் நேர மற்றும் பலி சார்ந்த பொருள்
  choice: காணிக்கை செலுத்தப்படும் நேரம்வரை
  alternative: மாலை நேர வழக்கமான காணிக்கை செலுத்தப்படும் நேரம்வரை
  rationale: இச்சொற்றொடர் காணிக்கை மேலே செலுத்தப்படுதலை நேரக் குறியீடாகப் பயன்படுத்துகிறது. மாலை வழக்கமான பலியைக் குறிக்கக்கூடும் என்றாலும், ‘மாலை’ மூலத்தில் வெளிப்படையாக இல்லாததால் அதை முதன்மை உரையில் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. மூலத்தின் மூன்று மடங்கு மறுப்பு—குரல் இல்லை, பதிலளிப்பவர் இல்லை, கவனிப்பவர் இல்லை—பாதுகாக்கப்பட்டுள்ளது. அடிக்குறி [a] தொடர்புடைய சொற்றொடரின் பின்னும், [b] வசன முடிவிலும் இடப்பட்டுள்ளது.
