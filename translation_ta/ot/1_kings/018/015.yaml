source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ אֵֽלִיָּ֔הוּ חַ֚י יְהוָ֣ה צְבָא֔וֹת אֲשֶׁ֥ר עָמַ֖דְתִּי לְ/פָנָ֑י/ו כִּ֥י הַ/יּ֖וֹם אֵרָאֶ֥ה אֵלָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/015.yaml
  text: And Elijah said[a], “As Yahweh of hosts lives, before whom I stand, today I will surely present myself to him.”
translation:
  language: ta
  text: எலியா, “நான் யாருடைய முன்னிலையில் நிற்கிறேனோ அந்தச் சேனைகளின் யாவே வாழ்கிறபடியால், இன்று நான் அவனுக்குமுன் தோன்றுவேன்[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனிடம் என்னைக் காட்டுவேன்” / “அவனுக்குமுன் காணப்படுவேன்.” எபிரெய வினைச்சொல் ‘காணப்படுதல்,’ ‘தோன்றுதல்,’ அல்லது ‘தன்னைக் காட்டுதல்’ என்று பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי יְהוָה
  choice: யாவே உயிரோடிருப்பது உறுதி
  rationale: இது எபிரெய மொழியின் ஆணையுறுதி வாய்ப்பாடு. தமிழில் அதன் உறுதியையும் solemn oath force-ஐயும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைவனின் தனிப்பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டப்பெயராக மாற்றாமல், தமிழில் ஒலிபெயர்த்துள்ளது.
- source_word: צְבָאוֹת
  choice: சேனைகளின்
  rationale: இறைப்பட்டத்தின் பரந்த பொருளை ‘பரலோகச் சேனைகள்’ அல்லது மனிதப் படைகள் என்று குறுக்காமல், மரபறிந்தும் புரிந்துகொள்ளத்தக்கதுமான சொல்லால் காக்கிறது.
- source_word: אֲשֶׁר עָמַדְתִּי לְפָנָיו
  choice: நான் யாருடைய திருமுன் நிற்கிறேனோ
  rationale: மேலானவரின் முன்னிலையில் நின்று பணியாற்றுவதைக் குறிக்கும் தீர்க்கதரிசன அரசவைப் படிமத்தை விளக்கவுரையாக மாற்றாமல் காக்கிறது; ‘திருமுன்’ மரியாதையையும் இயல்பான தமிழையும் தருகிறது.
- source_word: כִּי הַיּוֹם
  choice: இன்று நிச்சயமாக
  rationale: כִּי இங்கு ஆணையுறுதியின் உள்ளடக்கத்தை அறிமுகப்படுத்தி உறுதியையும் தருகிறது; ‘நிச்சயமாக’ சூழலிலுள்ள வலியுறுத்தலைத் தெளிவாக்குகிறது.
- source_word: אֵרָאֶה אֵלָיו
  choice: அவனுக்குமுன் தோன்றுவேன்
  rationale: ראה என்பதன் நிபால் வடிவிலுள்ள ‘காணப்படுதல்/தோன்றுதல்/தன்னை முன்னிலைப்படுத்துதல்’ என்ற பொருள் வரம்பை இயன்றவரை காக்கிறது; அகாபிடம் நேரில் செல்வதற்கான எலியாவின் நோக்கத்தையும் இயல்பாக உணர்த்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைபெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல வசனம் இறைவனின் தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. அதை ஒரு பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் பெயர்சார் தன்மையைக் காக்கிறது.
- issue: ‘அவருடைய திருமுன் நிற்கிறேன்’ என்பதன் சேவைப் பொருள்
  choice: எபிரெயப் படிமத்தை அப்படியே காத்தல்
  alternative: நான் யாருக்குப் பணிபுரிகிறேனோ
  rationale: இந்தச் சொற்றொடர் இறைச் சேவையைக் குறிக்கக்கூடும்; ஆனால் ‘பணிபுரிகிறேன்’ என்று மட்டும் மொழிபெயர்ப்பது முன்னிலையில் நிற்கும் அரசவைப் படிமத்தையும் அதன் இறையியல் நுணுக்கத்தையும் மறைத்துவிடும்.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘திருமுன்’ என்பது இறைமுன்னிலைக்குரிய மரியாதைநிலையைத் தருகிறது; ‘சேனைகளின் யாவே’ மூல இறைப்பட்டத்தின் பரப்பைச் சுருக்காமல் காக்கிறது. அடிக்குறி குறியீடு பொருந்தும் வினைத்தொடருக்குப் பின்பு வைக்கப்பட்டுள்ளது.
