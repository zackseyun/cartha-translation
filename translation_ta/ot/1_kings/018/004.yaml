source:
  edition: WLC
  text: וַ/יְהִי֙ בְּ/הַכְרִ֣ית אִיזֶ֔בֶל אֵ֖ת נְבִיאֵ֣י יְהוָ֑ה וַ/יִּקַּ֨ח עֹבַדְיָ֜הוּ מֵאָ֣ה נְבִאִ֗ים וַֽ/יַּחְבִּיאֵ֞/ם חֲמִשִּׁ֥ים אִישׁ֙ בַּ/מְּעָרָ֔ה וְ/כִלְכְּלָ֖/ם לֶ֥חֶם וָ/מָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/004.yaml
  text: When Jezebel was cutting off the prophets of Yahweh[a], Obadiah took a hundred prophets and hid them, fifty men to a cave[b], and provided them with bread and water.
translation:
  language: ta
  text: யேசபேல் யாவேவின் தீர்க்கதரிசிகளை அழித்துக்கொண்டிருந்தபோது[a], ஒபதியா நூறு தீர்க்கதரிசிகளை அழைத்துக்கொண்டு, குகை ஒன்றுக்கு ஐம்பது பேராக[b] அவர்களை மறைத்துவைத்து, அவர்களுக்கு அப்பமும் தண்ணீரும் வழங்கிவந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அழித்துக்கொண்டிருந்த’ என்பதற்கு ‘கொன்று ஒழித்துக்கொண்டிருந்த’ என்றும் மொழிபெயர்க்கலாம்; சொல்லுக்கு நெருக்கமாக, ‘வெட்டிக்கொண்டு இருந்த’ என்பது பொருள்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்கு நெருக்கமாக, ‘குகையில் ஐம்பது பேர்’. நூறு பேரை ஐம்பது பேர் கொண்ட குழுக்களாக, தனித்தனி குகைகளில் மறைத்ததாக இத்தொடர் பெரும்பாலும் பொருள்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בְּהַכְרִית
  choice: அழித்துக்கொண்டிருந்தபோது
  rationale: היה உடன் வரும் infinitive construct காலச் சூழலை அறிமுகப்படுத்துகிறது. כרת என்பதன் அடிப்படைப் படிமம் ‘வெட்டித் துண்டித்தல்’; இச்சூழலில் தீர்க்கதரிசிகளைக் கொன்று ஒழித்தலைக் குறிக்கிறது. இயல்பான தமிழில் தொடர்ந்த செயலை வெளிப்படுத்த ‘அழித்துக்கொண்டிருந்தபோது’ பயன்படுத்தப்பட்டது; மூலப் படிமம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: אִיזֶבֶל
  choice: யேசபேல்
  rationale: தமிழ் வேதாகமப் பெயர் மரபுக்கு ஏற்ற ஒலிபெயர்ப்பு.
- source_word: נְבִיאֵי יְהוָה
  choice: யாவேவின் தீர்க்கதரிசிகள்
  rationale: எபிரெயக் கட்டமைப்பு இயல்பான தமிழ் உடைமைத் தொடராக வழங்கப்பட்டது; יהוה என்ற தனிப்பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டது.
- source_word: וַיִּקַּח
  choice: அழைத்துக்கொண்டு
  rationale: לקח என்பதன் ‘எடுத்துக்கொள்/கூட்டிக்கொள்’ என்ற பொருள், மனிதர்களைப் பாதுகாப்புக்காகத் தன்னுடன் சேர்த்துக்கொண்ட இச்சூழலில் இயல்பான தமிழாக வழங்கப்பட்டது.
- source_word: עֹבַדְיָהוּ
  choice: ஒபதியா
  rationale: தமிழ் வாசகர்களுக்குப் பரிச்சயமான வேதாகமப் பெயர் வடிவம்.
- source_word: מֵאָה נְבִאִים
  choice: நூறு தீர்க்கதரிசிகள்
  rationale: எண்ணிக்கையும் பெயர்ச்சொல்லும் நேரடியாகத் தக்கவைக்கப்பட்டன.
- source_word: וַיַּחְבִּיאֵם
  choice: அவர்களை மறைத்துவைத்து
  rationale: Hiphil வினையின் ‘மறைத்தல்’ என்ற நேரடியான பொருளையும், பாதுகாப்பாக மறைத்து வைத்த நிலைப்பாட்டையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: חֲמִשִּׁים אִישׁ בַּמְּעָרָה
  choice: குகை ஒன்றுக்கு ஐம்பது பேராக
  rationale: சொல்லுக்கு சொல் வடிவம் ‘குகையில் ஐம்பது பேர்’. நூறு பேரைப் பற்றிய சூழலில் இது ஐம்பது பேர் கொண்ட இரண்டு குழுக்கள் வெவ்வேறு குகைகளில் மறைக்கப்பட்டதைக் குறிக்கும் பகிர்வுப் பயன்பாடாகப் புரிந்துகொள்ளப்படுகிறது; அந்தப் பொருள் தெளிவான தமிழில் தரப்பட்டு, மொழிநடை ambiguity அடிக்குறிப்பில் சுட்டப்பட்டுள்ளது.
- source_word: וְכִלְכְּלָם
  choice: அவர்களுக்கு ... வழங்கிவந்தான்
  rationale: כלכל என்பதன் ‘பராமரி/தேவையானதை வழங்கு’ என்ற தொடர்ச்சியான பொருள், அடுத்து வரும் அப்பமும் தண்ணீரும் என்பவற்றோடு இயல்பாக இணைக்கப்பட்டது.
- source_word: לֶחֶם וָמָיִם
  choice: அப்பமும் தண்ணீரும்
  rationale: இரு பொருட்களும் நேரடியான, பொதுவாகப் புரியும் தமிழில் தக்கவைக்கப்பட்டன.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் பொதுப்பட்டமல்ல, יהוה என்ற தனிப்பெயரே உள்ளது. அதன் பெயர்த்தன்மையைத் தக்கவைக்கவும், எபிரெய ஒலியமைப்பை நெருக்கமாகக் காட்டவும் ‘யாவே’ பயன்படுத்தப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்கு எளிதாகவும் மரியாதைமிக்க வரலாற்று நடையிலும் வடிவமைக்கப்பட்டது. ‘வழங்கிவந்தான்’ தொடர்ந்த பராமரிப்பை வெளிப்படுத்துகிறது. மூலத்தின் சொற்படிமமும் குகைகள் பற்றிய இலக்கணச் சுருக்கமும் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டன.
