  text: So they cried out with a loud voice and cut themselves according to their custom with swords and spears until the blood gushed out on them[a][b].
translation:
  language: ta
  text: அப்போது அவர்கள் உரத்த குரலில் கூப்பிட்டு, தங்கள் வழக்கத்தின்படி[b] வாள்களாலும் ஈட்டிகளாலும் இரத்தம் அவர்கள்மேல் வழியும் வரை தங்களைத் தாங்களே வெட்டிக்கொண்டார்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தங்களைக் கீறிக்கொண்டார்கள்.’ எபிரெயச் சொல் சடங்கின் ஒரு பகுதியாகத் தங்களையே காயப்படுத்திக்கொள்வதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘தங்கள் நடைமுறையின்படி’ அல்லது ‘தங்கள் முறைப்படி.’
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְרְאוּ
  choice: அவர்கள் உரத்த குரலில் கூப்பிட்டு
  rationale: இந்தச் சூழலில் קרא என்பது பாகாலை நோக்கித் தீவிரமாகக் கூப்பிடுவதைக் குறிக்கிறது; ‘கூப்பிட்டு’ என்பது நவீன தமிழில் இயல்பாகவும் சூழலுக்கு ஏற்றவாறும் உள்ளது.
- source_word: בְּקוֹל גָּדוֹל
  choice: உரத்த குரலில்
  rationale: எபிரெயச் சொல்லாட்சியின் தெளிவான உருவகத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: וַיִּתְגֹּדְדוּ
  choice: தங்களைத் தாங்களே வெட்டிக்கொண்டார்கள்
  rationale: வினையின் தற்சுட்டுப் பொருளையும் சடங்கு சார்ந்த சுய உடற்கீறலையும் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: כְּמִשְׁפָּטָם
  choice: தங்கள் வழக்கத்தின்படி
  rationale: இங்கு מִשְׁפָּט சட்டத் தீர்ப்பைக் காட்டிலும் நிலைபெற்ற சடங்கு வழக்கத்தைக் குறிக்கிறது.
- source_word: בַּחֲרָבוֹת וּבָרְמָחִים
  choice: வாள்களாலும் ஈட்டிகளாலும்
  rationale: בְּ கருவியைக் குறிக்கிறது; חֶרֶב மற்றும் רֹמַח ஆகியவற்றின் பொதுவான நவீனத் தமிழ் இணைகள் முறையே ‘வாள்’, ‘ஈட்டி’ ஆகும்.
- source_word: עַד שְׁפָךְ דָּם עֲלֵיהֶם
  choice: இரத்தம் அவர்கள்மேல் வழிந்தோடும் வரை
  rationale: עַד எல்லை அல்லது நீடிப்பைக் குறிக்கிறது; שׁפך என்பதன் ஊற்றப்படுதல் அல்லது வழிந்தோடுதல் என்ற காட்சியை மிகைப்படுத்தாமல் இயல்பான தமிழில் தருகிறது.
