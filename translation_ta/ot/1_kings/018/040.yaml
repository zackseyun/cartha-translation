source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ אֵלִיָּ֨הוּ לָ/הֶ֜ם תִּפְשׂ֣וּ אֶת נְבִיאֵ֣י הַ/בַּ֗עַל אִ֛ישׁ אַל יִמָּלֵ֥ט מֵ/הֶ֖ם וַֽ/יִּתְפְּשׂ֑וּ/ם וַ/יּוֹרִדֵ֤/ם אֵלִיָּ֨הוּ֙ אֶל נַ֣חַל קִישׁ֔וֹן וַ/יִּשְׁחָטֵ֖/ם שָֽׁם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/040.yaml
  text: Then Elijah said to them[a], “Seize the prophets of Baal; let not one of them escape.” And they seized them[b], and Elijah brought them down to the Kishon Wadi and slaughtered them there.
translation:
  language: ta
  text: அப்போது எலியா அவர்களிடம், “பாகாலின் தீர்க்கதரிசிகளைப் பிடியுங்கள்; அவர்களில் ஒருவன்கூட தப்பிச் செல்லக்கூடாது.[a]” என்றார். அவர்கள் அவர்களைப் பிடித்தார்கள். எலியா அவர்களைக் கீசோன் ஓடைக்கு[b] இறக்கிக் கொண்டுபோய், அங்கே அவர்களை அறுத்துக் கொன்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “அவர்களில் ஒரு மனிதனும் தப்பக்கூடாது.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது “கீசோன் நீரோடைக்கு.” எபிரெயச் சொல் ஓடை, நீரோடை, அல்லது பருவகால நீர்ப்படுகையைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפְשׂוּ
  choice: பிடியுங்கள்
  rationale: பலருக்கான வலியுறுத்தப்பட்ட கட்டளை. சூழலில் இது வெறுமனே தொடுவதைக் குறிக்காமல், தப்பவிடாமல் பிடித்துக் காவலில் கொள்வதைக் குறிக்கிறது.
- source_word: נְבִיאֵי הַבַּעַל
  choice: பாகாலின் தீர்க்கதரிசிகள்
  rationale: எபிரெயக் கட்டமைப்பை இயல்பான தமிழில் நேரடியாகக் காட்டுகிறது; அந்தக் குழுவின் அடையாளத்தை மாற்றாமல் வைத்திருக்கிறது.
- source_word: אִישׁ אַל יִמָּלֵט מֵהֶם
  choice: அவர்களில் ஒருவன்கூட தப்பிச் செல்லக்கூடாது
  rationale: אִישׁ இங்கு பகிர்வு ஒருமையாக இருந்து, அந்த ஆண்களில் ஒருவர்கூட தப்பக்கூடாது என்ற பொருளைத் தருகிறது. ‘ஒருவன்கூட’ என்பது ஆண்பால் குறிப்பையும் வலியுறுத்தலையும் இயல்பான தமிழில் காக்கிறது.
- source_word: וַיִּתְפְּשׂוּם
  choice: அவர்கள் அவர்களைப் பிடித்தார்கள்
  rationale: கட்டளையில் வந்த அதே תפשׂ வேரின் தொடர்ச்சியை ‘பிடி’ என்ற சொல்லால் காக்கிறது.
- source_word: וַיּוֹרִדֵם
  choice: அவர்களை இறக்கிக் கொண்டுபோய்
  rationale: ירד என்பதன் காரணவினை வடிவம் ‘கீழே செல்லச் செய்தல்/கொண்டுபோதல்’ என்று பொருள்படும்; நில அமைப்பில் கீழ்நோக்கிய இயக்கத்தை இத்தொடர் காக்கிறது.
- source_word: נַחַל קִישׁוֹן
  choice: கீசோன் ஓடை
  rationale: נַחַל என்பது ஓடை, நீரோடை அல்லது பருவகால நீர்ப்படுகையைக் குறிக்கலாம். ‘ஓடை’ பொதுவாசகருக்கு இயல்பாகவும், மூலத்தின் புவியியல் பரப்பை அளவுக்கு மீறிக் குறுக்காமலும் உள்ளது.
- source_word: וַיִּשְׁחָטֵם
  choice: அவர்களை அறுத்துக் கொன்றார்
  rationale: שׁחט என்பது பொதுவான ‘கொல்’ என்பதைவிட அறுத்துக் கொல்லும் கடுமையான செயலைக் குறிக்கிறது. இந்தச் சொற்றொடர் வன்முறையை மென்மைப்படுத்தாமல் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: שָׁם
  choice: அங்கே
  rationale: எளிய இடக்குறிப்பு வினையடை; முந்தைய கீசோன் ஓடையைக் குறிக்கிறது.
theological_decisions:
- issue: பாகாலின் தீர்க்கதரிசிகளுக்கு எதிரான வன்முறைச் செயலை மொழிபெயர்த்தல்
  choice: எலியாவின் கட்டளையையும் அறுத்துக் கொன்ற செயலையும் வசனம் கூறியபடியே நேரடியாகத் தருதல்
  alternative: ‘மரண தண்டனை நிறைவேற்றினார்’ அல்லது ‘கொன்றார்’ என்று செயலை மென்மைப்படுத்துதல்; அல்லது இந்த வசனத்தில் வெளிப்படையாக இல்லாத தெய்வீக அங்கீகாரத்தைச் சேர்த்தல்
  rationale: எபிரெய உரை பிடித்தலையும் שׁחט எனும் கடுமையான கொலைச் செயலையும் வெளிப்படையாக விவரிக்கிறது. ஆகவே வன்முறையை மறைக்காமலும், வசனத்தில் இல்லாத அறநெறி அல்லது இறையியல் விளக்கத்தைச் சேர்க்காமலும் மொழிபெயர்க்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகருக்கு எளிதில் புரியும் வகையிலும் வேதாகமக் கதைநடைக்கு ஏற்ற கண்ணியத்துடனும் அமைக்கப்பட்டுள்ளது. ‘பாகால்’, ‘தீர்க்கதரிசி’ ஆகிய பரவலாக அறியப்பட்ட வேதாகமச் சொற்கள் தொடரப்பட்டுள்ளன. மூலத்தின் வன்முறை ‘அறுத்துக் கொன்றார்’ என்று மென்மைப்படுத்தப்படாமல் காக்கப்பட்டுள்ளது; எந்தத் தனிப்பட்ட சமயப்பிரிவு விளக்கமும் சேர்க்கப்படவில்லை.
