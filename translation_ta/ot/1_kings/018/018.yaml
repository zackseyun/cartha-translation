base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/018.yaml
  text: And he said[a], “I have not troubled Israel, but you and your father's house have[c][b], because you have forsaken the commandments of Yahweh and have gone after the Baals.”
translation:
  language: ta
  text: அதற்கு அவர், “இஸ்ரவேலைத் துன்பத்துக்கு உள்ளாக்கியது நான் அல்ல; நீயும் உன் தந்தையின் வீட்டாரும்தான். நீங்கள் யாவேயின் கட்டளைகளைக் கைவிட்டு, பாகால்களை[a]ப் பின்பற்றிச் சென்றதால், இஸ்ரவேலைத் துன்பத்துக்கு உள்ளாக்கியது நீங்கள்தான்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெய மூலத்தில் இது பன்மை: “பாகால்கள்.” பாகால் வழிபாட்டின் பல்வேறு உள்ளூர் வடிவங்கள் அல்லது வெளிப்பாடுகளை இது குறிக்கலாம்.'
    reason: cultural_note
lexical_decisions:
- source_word: עָכַרְתִּי
  choice: துன்பத்துக்கு உள்ளாக்கியது
  rationale: இச்சொல் ஒரு சமூகத்தின்மீது தொல்லை, பேரிடர் அல்லது கேடு வரச் செய்வதைக் குறிக்கிறது. முந்தைய வசனத்தில் ஆகாப் சுமத்திய குற்றச்சாட்டை எலியா மறுத்துத் திருப்பிச் சொல்வதையும் இந்தத் தேர்வு இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: כִּי אִם
  choice: நான் அல்ல; நீயும்...மே
  rationale: எபிரெய மொழியின் மறுத்து எதிர்மறையாகச் சுட்டும் அமைப்பைத் தமிழில் வலியுறுத்தும் முரண் அமைப்பாக வெளிப்படுத்துகிறது.
- source_word: וּבֵית אָבִיךָ
  choice: உன் தந்தையின் வீட்டார்
  rationale: சொல்லாட்சிப்படி ‘உன் தந்தையின் வீடு’; இங்கு குடும்பம் அல்லது வம்சக் குடும்பத்தாரைக் குறிக்கும் எபிரெய மரபுத்தொடரின் குடும்ப மற்றும் வம்சப் பொறுப்புணர்வை ‘வீட்டார்’ தக்கவைக்கிறது.
- source_word: בַּעֲזָבְכֶם
  choice: நீங்கள்...கைவிட்டு...சென்றதால்தான்
  rationale: முன்னொட்டுடன் வரும் வினையெச்சப் பெயர் குற்றச்சாட்டிற்கான காரணத்தைத் தருகிறது. எபிரெய மொழியிலுள்ள பன்மை ‘நீங்கள்’ என்பதில் பாதுகாக்கப்படுகிறது.
- source_word: מִצְוֺת
  choice: கட்டளைகள்
  rationale: உடன்படிக்கை சார்ந்த சட்டக் கட்டளைகளின் வலிமையைத் தெளிவாகவும் வழக்கமான தமிழிலும் தெரிவிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைவனின் தனிப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: וַתֵּלֶךְ אַחֲרֵי
  choice: பின்பற்றிச் சென்றீர்கள்
  rationale: வேறு தெய்வங்களுக்கு விசுவாசமும் வழிபாடும் செலுத்துவதை உணர்த்தும் ‘பின்னே செல்’ என்ற உருவகத்தை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: הַבְּעָלִים
  choice: பாகால்கள்
  rationale: மூலத்தில் வெளிப்படையாக உள்ள பன்மையைப் பாதுகாத்து, பாகால் வழிபாட்டின் பல உள்ளூர் வடிவங்கள் அல்லது வெளிப்பாடுகளைக் குறிக்க இடமளிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூல வசனம் இறைவனின் தனிப்பெயரை நேரடியாகப் பயன்படுத்துவதால், அதை ஒரு பொதுப் பட்டமாக மாற்றாமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
- issue: הַבְּעָלִים என்பதன் பன்மை
  choice: பாகால்கள்
  alternative: பாகால்
  rationale: எபிரெய மூலத்தின் பன்மையை ஒருமையாக்காமல் பாதுகாக்கிறது; இதனால் பல உள்ளூர் வழிபாட்டு வடிவங்கள் அல்லது வெளிப்பாடுகள் குறித்த சாத்தியமும் நிலைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், நேரடியான குற்றச்சாட்டின் வலிமையையும் மரியாதைமிக்க வேதாகம நடையையும் இணைக்கிறது. ‘வீட்டார்’ என்பது வம்சக் குடும்பத்தைக் குறிக்கும் பழமையான மரபுத்தொடரை சாதாரண வாசகருக்கும் புரியும் வகையில் பாதுகாக்கிறது. இறுதி ‘இப்படிச் செய்தீர்கள்’ என்பது தமிழில் காரண வாக்கியத்தை இயல்பாக நிறைவு செய்கிறது; அது மூலத்தில் தனி வினையாக இல்லை.
