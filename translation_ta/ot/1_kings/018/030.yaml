  text: וַ/יֹּ֨אמֶר אֵלִיָּ֤הוּ לְ/כָל הָ/עָם֙ גְּשׁ֣וּ אֵלַ֔/י וַ/יִּגְּשׁ֥וּ כָל הָ/עָ֖ם אֵלָ֑י/ו וַ/יְרַפֵּ֛א אֶת מִזְבַּ֥ח יְהוָ֖ה הֶ/הָרֽוּס־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/030.yaml
  text: Then Elijah said to all the people[a], “Come near to me.” So all the people came near to him, and he repaired the altar of Yahweh that had been torn down.
translation:
  language: ta
  text: 'அப்போது எலியா மக்கள் அனைவரையும் நோக்கி, “என்னருகே வாருங்கள்” என்றார். மக்கள் அனைவரும் அவரருகே வந்தார்கள். இடிக்கப்பட்டிருந்த யாவேயின் பலிபீடத்தை அவர் பழுதுபார்த்தார்.[a]


    [a] “பழுதுபார்த்தார்” என்பதற்கு “மீட்டமைத்தார்” என்றும் மொழிபெயர்க்கலாம்; எபிரெய வினைச்சொல்லின் நேர்ப்பொருள் “குணப்படுத்தினார்” என்பதாகும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பழுதுபார்த்தார்” என்பதற்கு “மீட்டமைத்தார்” என்றும் மொழிபெயர்க்கலாம்; எபிரெய வினைச்சொல்லின் நேர்ப்பொருள் “குணப்படுத்தினார்” என்பதாகும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּשׁוּ
  choice: என்னருகே வாருங்கள்
  rationale: இந்தக் கட்டளை மக்கள் எலியாவுக்கு அருகில் உடலளவில் வருமாறு அழைக்கிறது; திசையுணர்வையும் இயல்பான தமிழையும் இச்சொற்றொடர் காக்கிறது.
- source_word: וַיִּגְּשׁוּ
  choice: அவரருகே வந்தார்கள்
  rationale: முந்தைய கட்டளைக்குப் பதிலாக மக்கள் செய்ததை அதே ‘அருகே வருதல்’ சொல்லமைப்பால் வெளிப்படுத்துகிறது.
- source_word: וַיְרַפֵּא
  choice: பழுதுபார்த்தார்
  rationale: רפא என்பதன் நேர்ப்பொருள் ‘குணப்படுத்துதல்.’ ஆனால் பலிபீடத்தைப் பொருளாகக் கொண்ட இவ்விடத்தில், சேதமடைந்ததைச் சீர்செய்தார் என்பதே இயல்பான பொருள். நேர்ப்பொருளும் ‘மீட்டமைத்தார்’ என்ற மாற்றும் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.
- source_word: מִזְבַּח יְהוָה
  choice: யாவேயின் பலிபீடம்
  rationale: எபிரெய இணைப்புநிலையை இயல்பான தமிழ் உடைமை அமைப்பில் அளித்து, தெய்வீகப் பெயரையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எழுத்துகளைக் கொண்ட எபிரெய இறைப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரிந்துகொள்ளக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: הֶהָרוּס
  choice: இடிக்கப்பட்டிருந்த
  rationale: הרס என்ற வேரின் செயப்பாட்டு வினையெச்சம் முன்பே தகர்க்கப்பட்ட அல்லது இடிக்கப்பட்ட நிலையைக் குறிக்கிறது; இத்தமிழ் வடிவம் அந்த முந்திய அழிவைத் தெளிவாகக் காட்டுகிறது.
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றார்
  rationale: வாவ் தொடர்வினை கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது; ‘அப்போது’ நவீன தமிழில் அந்த வரிசையை இயல்பாகக் காட்டுகிறது.
- source_word: כָל הָעָם
  choice: மக்கள் அனைவரும்
  rationale: கூட்டுத் தொகையான எபிரெய சொற்றொடரை இயல்பான நவீன தமிழில் முழுமையாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் இறைவனின் தனிப்பெயரான יהוה நேரடியாக உள்ளது. அதை ஒரு பட்டத்தால் மாற்றாமல் ‘யாவே’ என ஒலிபெயர்ப்பது மூலத்தின் தனிப்பெயர் தன்மையைப் பாதுகாக்கிறது; ‘யெகோவா’ என்பது வேறொரு பாரம்பரிய ஒலிவடிவம்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் வேதாகம உரைக்கேற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. கட்டளையும் அதன் நிறைவேற்றமும் ‘அருகே வாருங்கள்/அருகே வந்தார்கள்’ என்ற ஒத்த சொல்லமைப்பால் இணைக்கப்பட்டுள்ளன. மூலத்தின் ‘குணப்படுத்துதல்’ உருவகம் பிரதான உரையில் இயல்பான ‘பழுதுபார்த்தார்’ எனவும், அடிக்குறிப்பில் நேர்ப்பொருளுடனும் பாதுகாக்கப்பட்டுள்ளது.
