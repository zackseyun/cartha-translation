  text: וַ/יִּבְנֶ֧ה אֶת הָ/אֲבָנִ֛ים מִזְבֵּ֖חַ בְּ/שֵׁ֣ם יְהוָ֑ה וַ/יַּ֣עַשׂ תְּעָלָ֗ה כְּ/בֵית֙ סָאתַ֣יִם זֶ֔רַע סָבִ֖יב לַ/מִּזְבֵּֽחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/032.yaml
  text: And with the stones he built an altar in the name of Yahweh[a], and he made a trench around the altar, like the capacity for two seahs of seed.
translation:
  language: ta
  text: அந்தக் கற்களைக் கொண்டு அவர் யாவேயின் பெயரில் ஒரு பலிபீடத்தைக் கட்டினார். பலிபீடத்தைச் சுற்றிலும் இரண்டு சேயா விதைக்கான அளவைப் போன்ற ஓர் அகழியையும் அமைத்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “இரண்டு சேயா விதையின் அளவைப்போல்.” இது அகழியின் பரப்பையோ கொள்ளளவையோ குறிக்கக்கூடிய தெளிவற்ற பழங்கால அளவீட்டுச் சொல்லாட்சி. சேயா என்பது ஓர் உலர் அளவை அலகு.
    reason: பழங்கால அளவீட்டுச் சொல்லாட்சியையும் அதன் பொருள் தெளிவின்மையையும் விளக்குதல்
lexical_decisions:
- source_word: וַיִּבְנֶה אֶת־הָאֲבָנִים מִזְבֵּחַ
  choice: அந்தக் கற்களைக் கொண்டு அவர் ஒரு பலிபீடத்தைக் கட்டினார்
  rationale: எபிரெயச் சொற்றொடர் சொற்படியாக ‘அந்தக் கற்களை ஒரு பலிபீடமாகக் கட்டினார்’ என அமைகிறது. இயல்பான தமிழில் கருவிப்பொருளைத் தெளிவாக்கும் இவ்வடிவம் பொருளைப் பாதுகாக்கிறது; ‘மீண்டும் கட்டினார்’ என்பது முந்தைய வசனத்தின் தகவலை இவ்வசனத்திற்குள் சேர்த்துவிடும்.
- source_word: בְּשֵׁם יְהוָה
  choice: யாவேயின் பெயரில்
  rationale: בְּשֵׁם என்பதன் இயல்பான பொருள் ‘பெயரில்’. இது வழிபாட்டு மற்றும் உடன்படிக்கைச் சூழலை விளக்கவுரையாக்காமல் தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், அதன் வழக்கமான நவீனத் தமிழ் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: וַיַּעַשׂ תְּעָלָה
  choice: ஓர் அகழியையும் அமைத்தார்
  rationale: תְּעָלָה என்பது அகழி அல்லது கால்வாயைக் குறிக்கலாம். பலிபீடத்தைச் சுற்றியுள்ள அமைப்பிற்கு ‘அகழி’ தெளிவான நவீனத் தமிழாகும்; וַיַּעַשׂ என்பதற்கான ‘அமைத்தார்’ தேவையற்ற செயற்பாட்டு விவரத்தைச் சேர்க்காது.
- source_word: כְּבֵית סָאתַיִם זֶרַע
  choice: இரண்டு சேயா விதையின் அளவைப்போன்ற
  rationale: மூலத்தில் உள்ள கடினமான, சுருக்கமான அளவீட்டுச் சொல்லாட்சியை முற்றிலும் ‘கொள்ளளவு’ அல்லது ‘விதைக்கப்படும் பரப்பு’ என்று தீர்மானிக்காமல் காக்கிறது. பழங்கால அலகான ‘சேயா’வும் தக்கவைக்கப்படுகிறது; அதன் தெளிவின்மை அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: סָבִיב לַמִּזְבֵּחַ
  choice: பலிபீடத்தைச் சுற்றிலும்
  rationale: சுற்றியுள்ள இடநிலையை இயல்பாகவும் சுருக்கமாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: இங்கு மூல உரை தெய்வீகத் தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. ‘யாவே’ என்பது அதை ஒரு பட்டமாக மாற்றாமல், நவீனத் தமிழில் ஏற்ற ஒலிபெயர்ப்பாகத் தருகிறது.
- issue: בְּשֵׁם என்பதிலுள்ள வழிபாட்டு பொருள்
  choice: பெயரில்
  alternative: பெயருக்காக; பெயரால்
  rationale: ‘பெயரில்’ என்பது மூலத்தின் இயல்பான உறவைக் காக்கிறது; பலிபீடம் யாருக்கு அர்ப்பணிக்கப்பட்டது அல்லது எந்த அதிகாரத்தால் கட்டப்பட்டது என்பதை மட்டும் தனியாகத் தீர்மானிக்காமல் அதன் பொருள் விரிவைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன, பொதுவாகப் புரியும், கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘பலிபீடம்’, ‘அகழி’ ஆகிய பரவலாக அறியப்பட்ட வேதாகமச் சொற்கள் தக்கவைக்கப்பட்டுள்ளன. கடினமான எபிரெய அளவீட்டுச் சொல்லாட்சி உரையில் சுருக்கமாகவும் அடிக்குறிப்பில் அதன் மாற்றுப் பொருள் வாய்ப்புகளுடனும் வழங்கப்பட்டுள்ளது.
