  text: And when Ahab saw Elijah[a], Ahab said to him, “Is that you, troubler of Israel?”
translation:
  language: ta
  text: ஆகாப் எலியாவைக் கண்டபோது, ஆகாப் அவனை நோக்கி, “இஸ்ரவேலுக்குத் துன்பம் விளைவிப்பவன் நீதானா?” என்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כִּרְאוֹת
  choice: கண்டபோது
  rationale: வַיְהִי கதையின் தொடர்ச்சியைச் சுட்டுகிறது; כִּרְאוֹת காலச் சூழலைக் குறிக்கிறது. நவீன தமிழில் இரண்டையும் இயல்பாக இணைத்து ‘கண்டபோது’ என வழங்குவது போதுமானது.
- source_word: אַחְאָב
  choice: ஆகாப்
  rationale: எபிரெயத் தனிப்பெயரின் தமிழில் நிலைபெற்ற வடிவம்.
- source_word: אֶת
  choice: தனியாக மொழிபெயர்க்கப்படவில்லை
  rationale: இது நேரடிச் செயப்படுபொருளைக் குறிக்கும் இலக்கணச் சுட்டி; தமிழின் வேற்றுமை உருபு மற்றும் சொற்றொடரமைப்பால் அதன் பணி வெளிப்படுகிறது.
- source_word: אֵלִיָּהוּ
  choice: எலியா
  rationale: எபிரெயத் தனிப்பெயரின் தமிழில் நிலைபெற்ற வடிவம்; ‘எலியாவைக்’ என வேற்றுமை உருபுடன் வருகிறது.
- source_word: וַיֹּאמֶר ... אֵלָיו
  choice: அவரிடம் ... என்று கேட்டான்
  rationale: וַיֹּאמֶר என்பதன் அடிப்படைப் பொருள் ‘சொன்னான்’ என்றாலும், தொடர்ந்து நேரடிக் கேள்வி வருவதால் தமிழில் ‘என்று கேட்டான்’ என்பது உரையாடலின் செயல்பாட்டை இயல்பாகத் தெரிவிக்கிறது. אֵלָיו ‘அவரிடம்’ என வழங்கப்பட்டுள்ளது.
- source_word: הַאַתָּה זֶה
  choice: நீதானா?
  rationale: வினாச்சுட்டி, தனிப்பெயர்ச்சொல், சுட்டுப்பெயர் ஆகியவற்றின் வலியுறுத்தலுடனான நேரடி மோதல் தொனியைத் தமிழின் ‘தான்’ வலியுறுத்தல் இயல்பாகக் கொண்டுவருகிறது.
- source_word: עֹכֵר
  choice: துன்பம் வரச் செய்கிறவன்
  rationale: עכר வேரின் பங்கேற்புப்பெயர் ஒருவர்மீது துன்பம் அல்லது கேடு வரச் செய்பவனைச் சுட்டுகிறது. ஒரே சொல்லாகக் கட்டாயப்படுத்தாமல், குற்றச்சாட்டின் செயற்பொருளைத் தெளிவாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: יִשְׂרָאֵל
  choice: இஸ்ரவேல்
  rationale: தேசியப் பெயரின் தமிழில் பரவலாக நிலைபெற்ற வேதாகம வடிவம்.
theological_decisions:
- issue: ஆகாபின் குற்றச்சாட்டின் தொனியும் வலிமையும்
  choice: “இஸ்ரவேலுக்குத் துன்பம் வரச் செய்கிறவன்” என்ற நேரடியான குற்றச்சாட்டு
  alternative: “இஸ்ரவேலைக் கலங்கடிக்கிறவன்” அல்லது “இஸ்ரவேலுக்குப் பேரழிவு வரச் செய்கிறவன்”
  rationale: ஆகாப், இஸ்ரவேலின் துயரத்திற்குக் காரணம் எலியா எனக் குற்றஞ்சாட்டுவதை உரை பதிவு செய்கிறது. மொழிபெயர்ப்பு அந்தக் குற்றச்சாட்டை ஆதரிக்காமலும், அதன் பொருளைத் தேவையின்றித் தீவிரப்படுத்தாமலும், עֹכֵר என்பதிலுள்ள துன்பம்/கேடு விளைவித்தல் என்ற பொருள் வரம்பைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ஆகாபின் மோதலான வினாவை ‘நீதானா?’ என்ற இயல்பான வலியுறுத்தல் காக்கிறது. அரசனான ஆகாபைக் குறிப்பிட ‘அவரிடம்’ என்ற மரியாதை வடிவமும், உரையாசிரியரின் கதைக்கூற்றில் ‘கேட்டான்’ என்ற வழக்கமான வடிவமும் பயன்படுத்தப்பட்டுள்ளன.
