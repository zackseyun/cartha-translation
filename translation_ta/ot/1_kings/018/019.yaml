base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/019.yaml
  text: Now send and gather to me all Israel at Mount Carmel[a], along with the prophets of Baal, four hundred and fifty, and the prophets of Asherah, four hundred[c][b], who eat at Jezebel’s table.
translation:
  language: ta
  text: இப்போது ஆட்களை அனுப்பி, இஸ்ரவேல் முழுவதையும், பாகாலின் தீர்க்கதரிசிகளான நானூற்று ஐம்பது பேரையும், அசேராவின்[c] தீர்க்கதரிசிகளான நானூறு பேரையும்—யேசபேலின் பந்தியில் உண்பவர்களையும்[b]—கர்மேல் மலைக்கு[a] என்னிடம் ஒன்றுகூட்டு.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்கு சொல்: ‘கர்மேல் மலையை நோக்கி’ அல்லது ‘கர்மேல் மலைக்கு.’ எபிரெய முன்னிடைச்சொல் ஒன்றுகூடும் இடத்தை நோக்கிய இயக்கத்தைக் குறிக்கிறது.'
    reason: lexical_alternative
  - marker: b
    text: ‘யேசபேலின் பந்தியில் விருந்துண்பவர்கள்’ என்றும் மொழிபெயர்க்கலாம்; இது அரசியாகிய அவளுடைய ஆதரவில் பராமரிக்கப்பட்டவர்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: ‘அசேரா’ என்பது அசேரா என்னும் பெண் தெய்வத்தையோ, சில சூழல்களில் அவளுடன் தொடர்புடைய வழிபாட்டுப் பொருளையோ குறிக்கலாம். இங்கு ‘பாகால்’ என்பதுடன் உள்ள இணைநிலை, தெய்வத்தைக் குறிப்பதற்குச் சாதகமாக உள்ளது.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: இப்போது
  rationale: எலியா உடனடியாக விடுக்கும் கட்டளையை அறிமுகப்படுத்தும் உரையாடல் குறியீடு; நவீன தமிழில் இயல்பான வடிவம்.
- source_word: שְׁלַח קְבֹץ
  choice: ஆட்களை அனுப்பி ... ஒன்றுகூட்டு
  rationale: 'இரண்டு கட்டளைகளின் தொடர்பைத் தெளிவாக்குகிறது: ஆகாப் ஆட்களை அல்லது ஆணையை அனுப்பி மக்களை ஒன்றுகூட்ட வேண்டும். எபிரெயச் சொற்களின் சுருக்கமான கட்டளை வலிமையும் காக்கப்படுகிறது.'
- source_word: אֵלַי
  choice: என்னிடம்
  rationale: எலியாவை நோக்கிய திசையைக் குறிக்கும் முன்னிடைச்சொல்லின் நேரடியான பொருள்.
- source_word: כָּל יִשְׂרָאֵל
  choice: இஸ்ரவேல் முழுவதையும்
  rationale: தேசியக் கூட்டுத்தொகையைக் குறிக்கும் எபிரெய மரபுத்தொடரின் சொல்லாட்சிப் பரப்பைத் தக்கவைக்கிறது.
- source_word: אֶל הַר הַכַּרְמֶל
  choice: கர்மேல் மலைக்கு
  rationale: אֶל இயக்கத்தையும் இலக்கிடத்தையும் குறிக்கிறது; ஆகவே மூலமொழியின் திசை உணர்வை நேரடியாகப் பாதுகாக்கிறது.
- source_word: נְבִיאֵי הַבַּעַל
  choice: பாகாலின் தீர்க்கதரிசிகள்
  rationale: பாகாலுடன் தொடர்புடைய தீர்க்கதரிசிகளைச் சுட்டும் இணைப்புத் தொடரின் இயல்பான தமிழ் வடிவம்.
- source_word: נְבִיאֵי הָאֲשֵׁרָה
  choice: அசேராவின் தீர்க்கதரிசிகள்
  rationale: பாகாலின் தீர்க்கதரிசிகளோடு அமைந்த இணைநிலை காரணமாக அசேராவைத் தெய்வத்தின் பெயராக முதன்மையாக எடுத்துக்கொள்கிறது; விவாதத்துக்குரிய வழிபாட்டுப் பொருள் என்ற விளக்கத்தை முதன்மை உரைக்குள் திணிக்கவில்லை.
- source_word: אֹכְלֵי שֻׁלְחַן אִיזָבֶל
  choice: யேசபேலின் பந்தியில் உண்பவர்கள்
  rationale: சொல்லுருவை நெருக்கமாகப் பேணுவதோடு, அரசியின் உணவு மற்றும் ஆதரவில் வாழ்ந்தவர்கள் என்ற மறைபொருளையும் இயல்பாகத் தாங்குகிறது.
theological_decisions:
- issue: இந்த வசனத்தில் אֲשֵׁרָה என்பதன் பொருள்
  choice: தெய்வத்தின் பெயராக ‘அசேரா’
  alternative: அசேராவுடன் தொடர்புடைய வழிபாட்டுக் கம்பம் அல்லது வழிபாட்டுப் பொருள்
  rationale: ‘பாகாலின் தீர்க்கதரிசிகள்’ என்பதற்கு இணையாக வருவதால் இங்கு தனிப்பட்ட தெய்வத்தைக் குறிப்பது வலுவான வாசிப்பு. எனினும் வேறு சூழல்களில் வழிபாட்டுப் பொருளையும் குறிக்கக்கூடிய சொல் என்பதால் அந்தத் தெளிவின்மை அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- issue: ‘இஸ்ரவேல் முழுவதும்’ என்பதன் பரப்பு
  choice: தேசியக் கூட்டுத்தொகையாக ‘இஸ்ரவேல் முழுவதையும்’
  alternative: ஒவ்வொரு இஸ்ரவேலரையும் தனித்தனியாகக் குறிக்கும் பொருள்
  rationale: மூலத்தின் சொல்லாட்சிப் பரப்பைத் தக்கவைத்து, ஒவ்வொரு தனிநபரும் தவறாமல் வந்தார் என்ற தேவையற்ற முடிவை உரையில் சேர்க்காமல் விடுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் வேதாகம உரைக்குரிய கண்ணியமும் கொண்ட நடை. ‘பந்தி’ என்பது புரிந்துகொள்ளத்தக்க இலக்கியச் சொலாகத் தேர்ந்தெடுக்கப்பட்டது; கட்டளையின் தீவிரத்தைக் காக்க ‘ஒன்றுகூட்டு’ பயன்படுத்தப்பட்டது. அசேரா பற்றிய உண்மையான பொருள் வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
