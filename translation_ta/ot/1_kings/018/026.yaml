  register: நவீனத் தரத் தமிழில் எளிதாகப் புரியும், ஆனால் வழிபாட்டு மற்றும் கதைநடைச் சூழலுக்கு ஏற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பாகால்’ என்ற நிலைபெற்ற தமிழ் பெயர்வடிவமும், இரட்டை மறுப்பின் வலிமையும் பாதுகாக்கப்பட்டுள்ளன.
