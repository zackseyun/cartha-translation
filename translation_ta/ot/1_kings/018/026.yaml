base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/026.yaml
  text: So they took the bull that had been given to them[a], prepared it, and called on the name of Baal from morning until noon, saying, “O Baal, answer us!” But there was no voice, and no one answered. And they limped around the altar that had been made.
translation:
  language: ta
  text: அவர்கள் தங்களுக்குக் கொடுக்கப்பட்ட காளையை எடுத்து ஆயத்தப்படுத்தினார்கள். காலையிலிருந்து நண்பகல்வரை, “பாகாலே, எங்களுக்குப் பதிலளியும்!” என்று சொல்லி, பாகாலின் பெயரைச் சொல்லி அழைத்தார்கள். ஆனால் குரல் எதுவும் இல்லை; பதிலளிக்க யாரும் இல்லை. அவர்கள் அமைக்கப்பட்ட பலிபீடத்தைச் சுற்றி நொண்டினார்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள் பலிபீடத்தைச் சுற்றி நடனமாடினார்கள்,” அல்லது “தத்தித் தாவினார்கள்.” எபிரெய வினைச்சொல் நொண்டுதல் அல்லது தத்தித் தாவுதல் போன்ற சடங்கு அசைவைக் குறிக்கலாம்; வசனம் 21-இல் எலியா பயன்படுத்தும் அதே வேர்ச்சொல்லை இது வேண்டுமென்றே எதிரொலிக்கச் செய்யக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ אֶת הַפָּר
  choice: காளையை எடுத்தார்கள்
  rationale: לקח என்பதன் நேரடியான கதைநடைப் பொருள் ‘எடுத்தார்கள்’; פַּר பலிக்கான காளையைக் குறிக்கிறது.
- source_word: אֲשֶׁר נָתַן לָהֶם
  choice: தங்களுக்குக் கொடுக்கப்பட்ட
  rationale: முந்தைய வசனத்தில் எலியா அவர்களுக்குக் கொடுத்த காளையைக் குறிக்கிறது; இயல்பான தமிழுக்காகச் செயப்பாட்டு வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: וַיַּעֲשׂוּ
  choice: தயார்செய்தார்கள்
  rationale: பலியிடும் சூழலில் עשׂה இங்கு காளையை ஆயத்தப்படுத்துவதைக் குறிக்கிறது; ‘பலியிட்டார்கள்’ என்பது உரையில் இல்லாத அடுத்த கட்டச் செயலைச் சேர்த்துவிடும்.
- source_word: וַיִּקְרְאוּ בְשֵׁם הַבַּעַל
  choice: பாகாலின் பெயரைச் சொல்லிக் கூப்பிட்டார்கள்
  rationale: קרא בשם என்ற தெய்வத்தை நோக்கிக் கூப்பிடும் மரபுத்தொடரின் பொருளையும், பெயர் குறித்த எபிரெய வடிவத்தையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: מֵהַבֹּקֶר וְעַד הַצָּהֳרַיִם
  choice: காலையிலிருந்து நண்பகல்வரை
  rationale: குறிப்பிடப்பட்ட கால அளவின் தெளிவான, இயல்பான தமிழ் வடிவம்.
- source_word: הַבַּעַל עֲנֵנוּ
  choice: பாகாலே, எங்களுக்குப் பதிலளியும்!
  rationale: நேரடி அழைப்பையும், வேண்டுதல் சூழலில் ענה என்பதன் ‘பதிலளி’ என்ற பொருளையும் தக்கவைக்கிறது.
- source_word: וְאֵין קוֹל וְאֵין עֹנֶה
  choice: குரல் எதுவும் இல்லை; பதிலளிப்பவரும் யாரும் இல்லை
  rationale: எபிரெய உரையின் இரு மடங்கு மறுப்பையும் ‘குரல்’ மற்றும் ‘பதிலளிப்பவர்’ என்ற வேறுபாட்டையும் பாதுகாக்கிறது.
- source_word: וַיְפַסְּחוּ
  choice: நொண்டியபடி சென்றார்கள்
  rationale: פסח குறிக்கக்கூடிய நொண்டுதல் அல்லது தத்தித் தாவுதல் போன்ற சடங்கு அசைவை வெளிப்படுத்துகிறது; வசனம் 21-இல் அதே வேர்ச்சொல்லால் உருவாகும் இலக்கிய எதிரொலியையும் பாதுகாக்க உதவுகிறது.
- source_word: עַל הַמִּזְבֵּחַ
  choice: பலிபீடத்தைச் சுற்றி
  rationale: இந்தச் சடங்கு அசைவின் சூழலில் עַל என்பது பலிபீடத்தின் மேல் ஏறிச் செல்வதைவிட அதைச் சுற்றியோ அதன் அருகிலோ நிகழும் அசைவைக் குறிக்கிறது.
- source_word: אֲשֶׁר עָשָׂה
  choice: அமைக்கப்பட்டிருந்த
  rationale: எபிரெயில் வினை ஒருமையில் இருந்தாலும் வெளிப்படையான எழுவாய் இல்லை. யார் அமைத்தார் என்று தீர்மானிக்காமல் தமிழில் செயப்பாட்டு வடிவம் அந்தத் தெளிவின்மையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: பாகாலின் பெயரை அழைக்கும் மரபுத்தொடர்
  choice: பாகாலின் பெயரைச் சொல்லிக் கூப்பிட்டார்கள்
  alternative: பாகாலை வேண்டிக்கொண்டார்கள்
  rationale: தெய்வத்தை அழைக்கும் வேதாகம மரபுத்தொடரைப் பாதுகாக்கிறது; அதேவேளை அந்த வழிபாட்டை நியாயமானதாக மொழிபெயர்ப்பு ஏற்றுக்கொள்வதில்லை.
- issue: וַיְפַסְּחוּ என்பதன் சடங்கு அசைவு
  choice: நொண்டியபடி சென்றார்கள்
  alternative: நடனமாடினார்கள் / தத்தித் தாவினார்கள்
  rationale: சொல்லின் அரிதான உடல் அசைவையும் வசனம் 21 உடனான சாத்தியமான சொல்விளையாட்டையும் தக்கவைத்து, அதை பொதுவான ‘நடனம்’ என்று மட்டும் தீர்மானிப்பதைத் தவிர்க்கிறது.
- issue: பலிபீடத்தை அமைத்தவரின் அடையாளம்
  choice: அமைக்கப்பட்டிருந்த பலிபீடம்
  alternative: அவன் அமைத்திருந்த பலிபீடம்
  rationale: மூலத்தில் வினையின் எழுவாய் வெளிப்படையாகக் குறிப்பிடப்படாததால், மொழிபெயர்ப்பு ஓர் அடையாளத்தை ஊகித்துச் சேர்க்கவில்லை.
