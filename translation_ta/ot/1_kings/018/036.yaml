base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/036.yaml
  text: And it happened[a], at the offering up of the grain offering, that Elijah the prophet came near and said, “O Yahweh, God of Abraham, Isaac, and Israel, let it be known today that you are God in Israel, and that I am your servant[b], and that by your word I have done all these things.”
translation:
  language: ta
  text: தானியக் காணிக்கை செலுத்தப்படும் நேரத்தில், இறைவாக்கினரான எலியா அருகே வந்து, “ஆபிரகாம், ஈசாக்கு, இஸ்ரவேல் ஆகியோரின் கடவுளாகிய யாவே, நீரே இஸ்ரவேலில் கடவுள் என்றும், நான் உமது பணியாளன் என்றும், உமது வார்த்தையின்படியே[a] இவை அனைத்தையும் செய்தேன் என்றும் இன்று அறியப்படட்டும்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உமது வார்த்தையால்” அல்லது “உமது கட்டளைக்கிணங்க.”
    reason: בִדְבָרֶךָ என்பதில் கருவி, அடிப்படை அல்லது நெறி ஆகிய பொருள் நிழல்கள் இருக்கலாம்.
lexical_decisions:
- source_word: בַּעֲלוֹת הַמִּנְחָה
  choice: தானியக் காணிக்கை செலுத்தப்படும் நேரத்தில்
  rationale: מִנְחָה என்பதன் அடிப்படைப் பொருளான தானியக் காணிக்கையைத் தெளிவாகக் காட்டுகிறது; עלה இங்குக் காணிக்கையைச் செலுத்துதல் என்ற வழிபாட்டுச் சூழல் பொருளில் வருகிறது.
- source_word: וַיִּגַּשׁ
  choice: அருகே வந்து
  rationale: நגשׁ குறிக்கும் நேரடியான அணுகுதலையும் அதன் சடங்குசார் மரியாதைத் தொனியையும் இயல்பான தமிழில் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பட்டமாக மாற்றாமல், எபிரெய மூலத்திலுள்ள உடன்படிக்கைப் பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אֱלֹהֵי אַבְרָהָם יִצְחָק וְיִשְׂרָאֵל
  choice: ஆபிரகாம், ஈசாக்கு, இஸ்ரவேல் ஆகியோரின் கடவுள்
  rationale: மூலத்தில் ‘யாக்கோபு’ அல்ல, ‘இஸ்ரவேல்’ என்றே இருப்பதால் அதை ஒத்திசைக்காமல் அப்படியே காக்கிறது.
- source_word: הַיּוֹם יִוָּדַע
  choice: இன்று அறியப்படட்டும்
  rationale: நிஃபால் வினையின் வேண்டுதல் சார்ந்த கட்டளைப் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: אֱלֹהִים בְּיִשְׂרָאֵל
  choice: இஸ்ரவேலில் கடவுள்
  rationale: ב என்ற முன்னிடைச்சொல்லின் நேரான ‘இல்’ பொருளைக் காத்து, ‘இஸ்ரவேலின்மேல்’ போன்ற விளக்க விரிவாக்கத்தைத் தவிர்க்கிறது.
- source_word: עַבְדֶּךָ
  choice: உமது பணியாளன்
  rationale: தீர்க்கதரிசியின் இறைப்பணியையும் கட்டளைக்குக் கீழ்ப்படிந்த நிலையையும் நவீன தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: וּבִדְבָרֶךָ
  choice: உமது வார்த்தையின்படியே
  rationale: ב இங்கு நெறி அல்லது ஆதாரத்தைக் குறிக்கலாம்; ‘வார்த்தையின்படி’ என்பது கட்டளைக்கு இணங்கச் செய்ததைக் காட்டி, மூலத்தின் பரப்பை மிகையாகக் குறுக்காது.
- source_word: עָשִׂיתִי אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: இவை அனைத்தையும் செய்தேன்
  rationale: דברים இங்கு சொற்களை அல்ல, செயல்கள் அல்லது காரியங்களைக் குறிக்கிறது; முடிந்த செயலை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: יהוה என்ற உடன்படிக்கைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர் / யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட இறைப்பெயர் நேரடியாக உள்ளது; அதை ஒரு பட்டமாக மாற்றாமல், தமிழுக்கு ஏற்ற ஒலிபெயர்ப்பில் காக்கிறது.
- issue: முற்பிதாக்களின் வரிசையில் ‘இஸ்ரவேல்’ என்பதைக் காத்தல்
  choice: ஆபிரகாம், ஈசாக்கு, இஸ்ரவேல்
  alternative: ஆபிரகாம், ஈசாக்கு, யாக்கோபு
  rationale: எபிரெய உரை இவ்விடத்தில் திட்டவட்டமாக ‘இஸ்ரவேல்’ என்கிறது; பழக்கமான வாய்பாட்டோடு ஒத்திசைப்பது மூலத்தின் சொல்லாட்சியை மாற்றிவிடும்.
- issue: בְּיִשְׂרָאֵל என்பதன் உறவு
  choice: இஸ்ரவேலில் கடவுள்
  alternative: இஸ்ரவேலின்மேல் கடவுள் / இஸ்ரவேலின் நடுவே கடவுள்
  rationale: முன்னிடைச்சொல்லின் உண்மையான இடம் அல்லது வட்டாரம் சார்ந்த தெளிவின்மையை ‘இல்’ காக்கிறது; ஆட்சி அல்லது உடனிருப்பு என்ற ஒரே விளக்கத்தைத் திணிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் மரியாதையும் வேதாகமச் செறிவும் காக்கப்பட்டுள்ளன. இறைவனிடம் உரையாடும் இடத்தில் ‘நீர்/உமது’ பயன்படுத்தப்பட்டுள்ளது. தேவையற்ற பழமொழிநடை தவிர்க்கப்பட்டு, ‘இறைவாக்கினர்’, ‘தானியக் காணிக்கை’, ‘பணியாளன்’ போன்ற பொதுவாகப் புரியும் சொற்கள் தேர்ந்தெடுக்கப்பட்டுள்ளன.
