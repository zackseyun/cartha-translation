  text: וַ/יְהִ֨י בַֽ/צָּהֳרַ֜יִם וַ/יְהַתֵּ֧ל בָּ/הֶ֣ם אֵלִיָּ֗הוּ וַ/יֹּ֨אמֶר֙ קִרְא֤וּ בְ/קוֹל גָּדוֹל֙ כִּֽי אֱלֹהִ֣ים ה֔וּא כִּ֣י שִׂ֧יחַ וְ/כִֽי שִׂ֛יג ל֖/וֹ וְ/כִֽי דֶ֣רֶךְ ל֑/וֹ אוּלַ֛י יָשֵׁ֥ן ה֖וּא וְ/יִקָֽץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/027.yaml
  text: And it happened at noon that Elijah mocked them and said[a], “Cry out with a loud voice, for he is a god. For he is musing, or he has gone aside, or he is on a journey. Perhaps he is sleeping and will awake.”
translation:
  language: ta
  text: நண்பகலில் எலியா அவர்களைக் கேலி செய்து, “உரத்த குரலில் கூப்பிடுங்கள்! அவன் ஒரு தெய்வம்தானே! ஒருவேளை அவன் ஆழ்ந்த சிந்தனையில் இருக்கலாம்; அல்லது தனியே ஒதுங்கிச் சென்றிருக்கலாம்[a]; அல்லது பயணத்தில் இருக்கலாம். ஒருவேளை அவன் தூங்கிக்கொண்டிருக்கலாம்; விழித்துக்கொள்வான்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மலம் கழிக்கச் சென்றிருக்கலாம்.” எபிரெயச் சொல்லாட்சி மறைமுகமான நாசூக்குச் சொல்லாக இருக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַצָּהֳרַיִם
  choice: நண்பகலில்
  rationale: எபிரெயக் கதைத் தொடர் வடிவத்தைத் தமிழில் தேவையற்ற ‘அது நிகழ்ந்தது’ எனச் சுமத்தாமல், கால மாற்றத்தை இயல்பாகக் குறிக்கிறது.
- source_word: וַיְהַתֵּל בָּהֶם
  choice: அவர்களைக் கேலி செய்து
  rationale: வினைச்சொல்லின் இகழ்ச்சியும் ஏளனமும் நிறைந்த பொருளை, நவீனத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் தெரிவிக்கிறது.
- source_word: קִרְאוּ בְקוֹל גָּדוֹל
  choice: உரத்த குரலில் கூப்பிடுங்கள்
  rationale: கட்டளையின் வலிமையையும் ‘பெரிய/உரத்த குரலில்’ என்ற எபிரெய மொழிப்படிமத்தையும் காக்கிறது.
- source_word: כִּי אֱלֹהִים הוּא
  choice: அவன் ஒரு தெய்வம்தானே
  rationale: பாகாலைப் பற்றிய எலியாவின் கேலிப் பேச்சு என்பதைத் தெளிவாக்கி, இஸ்ரவேலின் தேவனோடு அடையாளப்படுத்தாமல் நையாண்டித் தொனியை வெளிப்படுத்துகிறது.
- source_word: שִׂיחַ
  choice: ஆழ்ந்த சிந்தனையில் இருக்கலாம்
  rationale: உள்ளார்ந்த சிந்தனை அல்லது மனத்தில் ஆழ்ந்திருத்தல் என்ற சாத்தியமான பொருளை அளவுக்கு மீறி குறிப்பாக்காமல் தருகிறது.
- source_word: שִׂיג לוֹ
  choice: தனியே ஒதுங்கிச் சென்றிருக்கலாம்
  rationale: அரிதான, மறைமுகமான எபிரெயச் சொல்லாட்சியின் நாசூக்கான தன்மையை முதன்மை உரையில் காக்கிறது; சாத்தியமான வெளிப்படையான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: דֶרֶךְ לוֹ
  choice: பயணத்தில் இருக்கலாம்
  rationale: அவன் வழிப்பயணமாக வெளியே சென்றிருக்கிறான் என்ற கருத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: אוּלַי יָשֵׁן הוּא וְיִקָץ
  choice: ஒருவேளை அவன் தூங்கிக்கொண்டிருக்கலாம்; அப்போது விழித்துக்கொள்வான்
  rationale: இறுதி வினைச்சொல்லைச் செயப்பாட்டு வடிவமாக மாற்றாமல், அவனே விழிப்பான் என்ற எபிரெயச் சொல்லின் நேரடியான இயக்கத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: பாகாலைக் குறிக்கும் אֱלֹהִים என்பதன் மொழிபெயர்ப்பு
  choice: ஒரு தெய்வம்
  alternative: தேவன்
  rationale: இது பாகாலைப் பற்றிய நையாண்டிப் பேச்சு; இஸ்ரவேலின் தேவனைப் பற்றிய விசுவாச அறிக்கை அல்ல. ‘ஒரு தெய்வம்’ என்பது அந்த வேறுபாட்டையும் கேலியையும் காக்கிறது.
- issue: שִׂיג לוֹ என்ற மறைமுகச் சொல்லாட்சியைக் கையாளுதல்
  choice: தனியே ஒதுங்கிச் சென்றிருக்கலாம்
  alternative: மலம் கழிக்கச் சென்றிருக்கலாம்
  rationale: மூலத்தின் நாசூக்கான மறைமுகத்தன்மையை முதன்மை உரையில் காத்து, அதற்கான சாத்தியமான வெளிப்படையான விளக்கத்தை அடிக்குறிப்பில் பதிவு செய்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடை. எலியாவின் கூர்மையான நையாண்டித் தொனி காக்கப்பட்டுள்ளது. அரிதான எபிரெயச் சொல்லாட்சியின் தெளிவின்மை முதன்மை உரையிலும் அடிக்குறிப்பிலும் பாதுகாக்கப்பட்டுள்ளது.
