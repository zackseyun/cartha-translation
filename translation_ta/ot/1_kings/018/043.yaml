  text: וַ/יֹּ֣אמֶר אֶֽל נַעֲר֗/וֹ עֲלֵֽה נָא֙ הַבֵּ֣ט דֶּֽרֶךְ יָ֔ם וַ/יַּ֨עַל֙ וַ/יַּבֵּ֔ט וַ/יֹּ֖אמֶר אֵ֣ין מְא֑וּמָה וַ/יֹּ֕אמֶר שֻׁ֖ב שֶׁ֥בַע פְּעָמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/043.yaml
  text: Then he said to his servant[a], “Please go up and look toward the sea.” So he went up and looked, and said, “There is nothing.” Then he said[c][b], “Go back seven times.”
translation:
  language: ta
  text: பின்பு அவர் தம் பணியாளனிடம்[a], “தயவுசெய்து மேலே போய், கடல் இருக்கும் திசையை நோக்கிப் பார்” என்றார். அவன் மேலே போய்ப் பார்த்துவிட்டு, “ஒன்றும் இல்லை” என்றான். அதற்கு அவர், “ஏழு முறை திரும்பிப் போ” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “தம் இளைஞனிடம்” அல்லது “தம் உதவியாளனிடம்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעֲרוֹ
  choice: தம் பணியாளனிடம்
  rationale: נַעַר என்பது இளைஞன், பணியாளன் அல்லது உதவியாளர் எனப் பொருள்படலாம். இங்கு எலியாவின் அறிவுறுத்தலின்படி செயல்படுகிறவரைக் குறிக்கும் சூழலில் ‘பணியாளன்’ இயல்பான தேர்வு.
- source_word: עֲלֵה נָא
  choice: நீ மேலே போய்
  rationale: עֲלֵה மேலே செல்லும்படியான கட்டளை. נָא கட்டளையை மென்மையாக்கலாம்; நவீனத் தமிழில் மரியாதையற்ற கடுமையைத் தவிர்க்க ‘நீ ... போய்’ என்ற இயல்பான கட்டளை வடிவம் பயன்படுத்தப்பட்டது.
- source_word: הַבֵּט דֶּרֶךְ יָם
  choice: கடல் திசையை நோக்கிப் பார்
  rationale: הביט என்பது நோக்கிப் பார்ப்பதையும், דֶּרֶךְ יָם என்பது கடல் இருக்கும் திசையையும் குறிக்கிறது. இந்தத் தேர்வு எபிரெயச் சொல்லமைப்பின் திசை சார்ந்த நுட்பத்தைப் பாதுகாக்கிறது.
- source_word: אֵין מְאוּמָה
  choice: ஒன்றும் இல்லை
  rationale: கண்ணுக்குப் புலப்படும் எதுவுமே இல்லை என்ற வலுவான மறுப்பைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: שֻׁב
  choice: திரும்பிப் போ
  rationale: שׁוּב என்பதன் அடிப்படைப் பொருள் திரும்புதல். இங்கு முன்பு செய்த பயணத்தையும் பார்வையிடுதலையும் மீண்டும் செய்யச் சொல்வதால் ‘திரும்பிப் போ’ பொருத்தமானது.
- source_word: שֶׁבַע פְּעָמִים
  choice: ஏழு முறை
  rationale: எபிரெய மூலத்தின் நேரடியான எண்ணிக்கை வெளிப்பாடு.
