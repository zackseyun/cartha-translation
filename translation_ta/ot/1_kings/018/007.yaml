  source_fidelity: 'வரைவின் நிகழ்வுவரிசையும் முக்கியச் செயல்களும் எபிரெய மூலத்துடன் பொருந்துகின்றன: ஒபதியா வழியில் இருந்தார்; எலியா அவரைச் சந்திக்க வந்தார்; ஒபதியா அவரை அறிந்து முகங்குப்புற விழுந்தார்; பின்னர் அடையாளம் உறுதிப்படுத்தும் கேள்வியைக் கேட்டார். ஆனால் אֲדֹנִי என்பதற்கு ‘என் தலைவராகிய’ என்பது மனிதருக்கான மரியாதை அழைப்பைத் தரினும், ‘தலைவர்’ என்ற பதவி/தலைமைப் பொருளை தேவையின்றி சேர்க்கிறது. ‘என் ஆண்டவரான’ என்பது மூலத்தின் ‘my lord’ என்ற மரியாதை விளியை நெருக்கமாகக் காக்கிறது; இச்சூழலில் அது எலியாவுக்கான மனித மரியாதை அழைப்பே.'
  naturalness: ‘ஒபதியா அவரை அடையாளம் கண்டதும்’ மற்றும் ‘முகங்குப்புற விழுந்து’ ஆகியவை இயல்பான கதைநடையாக உள்ளன. அழைப்பில் ‘என் தலைவராகிய எலியாவே’ என்பதற்குப் பதிலாக ‘என் ஆண்டவரான எலியாவே’ என்பது மூலத்தின் விளித்தொடரையும் நவீன கண்ணியமான தமிழ்நடையையும் சிறப்பாகப் பிரதிபலிக்கிறது.
