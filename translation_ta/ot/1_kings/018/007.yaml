  text: As Obadiah was on the way, behold, Elijah came to meet him. When he recognized him, he fell on his face and said, “Is that you, my lord Elijah?”
translation:
  language: ta
  text: ஒபதியா வழியில் போய்க்கொண்டிருந்தபோது, இதோ, எலியா அவரைச் சந்திக்க வந்தார். ஒபதியா அவரை அடையாளம் கண்டதும், முகங்குப்புற விழுந்து, “என் ஆண்டவரான எலியாவே, நீங்கள்தானா?” என்று கேட்டார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: திடீரெனக் காட்சியில் தோன்றுவதைச் சுட்டும் எபிரெயச் சொல்லின் கவன ஈர்ப்பு வலிமையைத் தக்கவைக்கிறது.
- source_word: לִקְרָאתוֹ
  choice: அவரைச் சந்திக்க வந்தார்
  rationale: எலியா ஒபதியாவை எதிர்கொண்டு சந்திக்க வந்தார் என்ற திசை சார்ந்த பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וַיַּכִּרֵהוּ
  choice: அவரை அடையாளம் கண்டதும்
  rationale: כּנר வேரின் இச்சூழலுக்குரிய ‘அடையாளம் காணுதல்’ என்ற பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: וַיִּפֹּל עַל־פָּנָיו
  choice: முகங்குப்புற விழுந்து
  rationale: மரியாதையையும் பணிவையும் காட்டும் உடல் செயலை இயல்பான தமிழில் நேரடியாகச் சொல்கிறது.
- source_word: אֲדֹנִי
  choice: என் தலைவராகிய
  rationale: இங்கு மனிதரிடம் மரியாதையுடன் பயன்படுத்தப்படும் ‘என் ஆண்டவர்/தலைவர்’ என்ற அழைப்பை, இறைப்பட்டமாகத் தவறாகப் புரிந்துகொள்ளாத வகையில் வழங்குகிறது.
- source_word: הַאַתָּה זֶה
  choice: நீங்கள்தானா?
  rationale: அடையாளத்தை உறுதிப்படுத்தும் எபிரெயக் கேள்வியை மரியாதைப் பன்மையுடன் இயல்பான நவீன தமிழில் தருகிறது.
theological_decisions:
- issue: אֲדֹנִי என்பது இங்கு இறைப்பட்டமா அல்லது மனித மரியாதைச் சொல்லா
  choice: என் தலைவராகிய
  alternative: என் ஆண்டவராகிய
  rationale: ஒபதியா எலியாவிடம் பேசுவதால் இது மனிதருக்கான மரியாதை அழைப்பு; ‘ஆண்டவர்’ என்பது தமிழில் இறைப்பட்டமாகப் புரியக்கூடியதால் ‘தலைவர்’ தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழ்; கண்ணியமான கதைநடை. ஒபதியா எலியாவை மரியாதையுடன் அழைப்பதை வெளிப்படுத்த ‘நீங்கள்’ வடிவம் பயன்படுத்தப்பட்டுள்ளது. ‘இதோ’ என்ற எபிரெயக் கவன ஈர்ப்புச் சொல் உரையில் தக்கவைக்கப்பட்டுள்ளது.
