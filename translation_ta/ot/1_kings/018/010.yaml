  text: חַ֣י יְהוָ֣ה אֱלֹהֶ֗י/ךָ אִם יֶשׁ גּ֤וֹי וּ/מַמְלָכָה֙ אֲ֠שֶׁר לֹֽא שָׁלַ֨ח אֲדֹנִ֥/י שָׁם֙ לְ/בַקֶּשְׁ/ךָ֔ וְ/אָמְר֖וּ אָ֑יִן וְ/הִשְׁבִּ֤יעַ אֶת הַ/מַּמְלָכָה֙ וְ/אֶת הַ/גּ֔וֹי כִּ֖י לֹ֥א יִמְצָאֶֽ/כָּה׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/010.yaml
  text: As Yahweh your God lives, there is no nation or kingdom where my lord has not sent to seek you. When they said, ‘He is not here,’ he made the kingdom and the nation swear that they could not find you.
translation:
  language: ta
  text: 'உன் இறைவனாகிய யாவே உயிரோடிருக்கிறார் என்பதன்மேல் ஆணையாகச் சொல்கிறேன்: உன்னைத் தேட அங்கே என் ஆண்டவர் அனுப்பாத தேசமோ அரசாட்சியோ இல்லை. ‘அவர் அங்கே இல்லை’ என்று அவர்கள் சொன்னபோது, உன்னைக் கண்டுபிடிக்க முடியவில்லை என்று அந்த அரசாட்சியையும் தேசத்தையும் அவர் சத்தியம் செய்யவைத்தார்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַי יְהוָה אֱלֹהֶיךָ
  choice: உன் இறைவனாகிய யாவே உயிரோடிருப்பது உறுதியாக இருப்பதுபோல
  rationale: எபிரெய உறுதிமொழிச் சூத்திரம் யாவேயின் உயிரை முன்வைத்து சொல்லப்படும் ஆணையை வெளிப்படுத்துகிறது; தமிழில் அதன் சத்திய வலிமையைத் தெளிவாகக் காக்கும் இயல்பான வடிவம்.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரை ஒரு பட்டப்பெயராக மாற்றாமல், எபிரெய தனிப்பெயரின் பரவலான தமிழ் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אִם יֶשׁ גּוֹי וּמַמְלָכָה אֲשֶׁר לֹא
  choice: ஒரு தேசமோ அரசோ இல்லை
  rationale: உறுதிமொழிச் சூழலில் אִם நேரடியான நிபந்தனையை விட வலியுறுத்தும் மறுப்பாகச் செயல்படுகிறது; ஆகாப் எங்கும் தேடியதை இவ்வடிவம் தெளிவாக்குகிறது.
- source_word: גּוֹי וּמַמְלָכָה
  choice: தேசமோ அரசோ
  rationale: இணையாக வரும் இரு அரசியல் சொற்களின் வேறுபாட்டைக் காக்கிறது; ‘அரசு’ என்பது இங்கு ஆட்சி நிலப்பரப்பையும் அரசியல் அமைப்பையும் இயல்பாகக் குறிக்கிறது.
- source_word: שָׁלַח ... לְבַקֶּשְׁךָ
  choice: உன்னைத் தேடுவதற்காக ... ஆள் அனுப்பாத
  rationale: தமிழில் ‘அனுப்புதல்’ என்பதற்கு இயல்பாக தேவைப்படும் மறைமுகச் செயப்படுபொருளை ‘ஆள்’ என்று பொதுவாக வெளிப்படுத்தி, குறிப்பிட்ட எண்ணிக்கையையோ குழுவையோ சேர்க்காமல் மூலத்தின் பொருளைக் காக்கிறது.
- source_word: אֲדֹנִי
  choice: என் ஆண்டவர்
  rationale: ஒபதியா ஆகாப் அரசனை மரியாதையுடன் குறிப்பிடுகிறார்; இது இங்கே கடவுளைக் குறிக்கவில்லை.
- source_word: וְאָמְרוּ אָיִן
  choice: ‘அவர் இங்கே இல்லை’ என்று அவர்கள் சொன்னபோது
  rationale: ஆயின் என்பதன் சூழல்சார் பொருள் ‘அவர் அங்கே/இங்கே இல்லை’; தமிழில் மேற்கோள் பேசுவோரின் நோக்கிலிருந்து ‘இங்கே’ இயல்பாக உள்ளது.
- source_word: וְהִשְׁבִּיעַ
  choice: சத்தியம் செய்யவைத்தார்
  rationale: שבע என்பதன் ஹிஃபில் வடிவமான ‘சத்தியம் செய்யும்படி செய்தல்’ என்ற காரணவினைப் பொருளை நேரடியாகக் காக்கிறது.
- source_word: כִּי לֹא יִמְצָאֶךָ
  choice: உன்னைக் கண்டுபிடிக்க முடியவில்லை என்று
  rationale: כִּי சத்தியத்தின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது; சூழலில் இறந்தகாலத் தேடலின் தோல்வியை ‘முடியவில்லை’ இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் உள்ள இஸ்ரவேலின் கடவுளுடைய தனிப்பெயரைப் பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்க்கிறது; ‘யெகோவா’வைக் காட்டிலும் எபிரெயப் பெயரின் ஏற்றுக்கொள்ளப்பட்ட மறுகட்டமைப்புக்கு நெருக்கமானது.
- issue: உறுதிமொழியில் אִם என்பதன் பொருள்
  choice: 'வலியுறுத்தும் முழுமையான மறுப்பு: ‘... இல்லை’'
  alternative: 'நிபந்தனை வடிவம்: ‘... இருந்தால்’'
  rationale: חַי־יְהוָה உறுதிமொழிக்குப் பின் வரும் אִם இங்கு நிறைவேறாத நிபந்தனையாக அல்லாமல், மறுப்பை வலியுறுத்தும் உறுதிமொழிச் சொற்றொடராகச் செயல்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் உரைநடைத் தெளிவும் கொண்ட நடை பயன்படுத்தப்பட்டது. ‘என் ஆண்டவர்’ அரசன் ஆகாபைக் குறிக்கும் மரியாதைச் சொல்லாக வைக்கப்பட்டது; ‘யாவே’ தனிப்பெயராகத் தெளிவுபடுத்தப்பட்டது. வசனத்தின் தீவிரமான உறுதிமொழியும் பரந்த தேடலின் வலிமையும் காக்கப்பட்டுள்ளன.
