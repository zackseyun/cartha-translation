base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/038.yaml
  text: Then the fire of Yahweh fell and consumed the burnt offering[a], the wood, the stones, the dust, and licked up the water that was in the trench.
translation:
  language: ta
  text: அப்போது யாவேயின் நெருப்பு[a] விழுந்து, தகனபலியையும் விறகுகளையும் கற்களையும் புழுதியையும் விழுங்கியது; அகழியில் இருந்த தண்ணீரையும் நக்கித் தீர்த்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேயிடமிருந்து வந்த நெருப்பு.” எபிரெயச் சொற்றொடர், நெருப்பின் தெய்வீக மூலத்தை வலியுறுத்துவதாகவும் புரிந்துகொள்ளப்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵשׁ יְהוָה
  choice: யாவேயின் நெருப்பு
  rationale: எபிரெயச் சொற்றொடரின் நேரடியான தொடர்பையும், தெய்வீகச் செயலின் வலிமையையும் காக்கிறது. வெளிப்படுத்தப்பட்ட தனிப்பெயரான יהוה என்பதை ‘யாவே’ என்று ஒலிபெயர்க்கிறது.
- source_word: וַתִּפֹּל
  choice: விழுந்து
  rationale: נפל என்பதன் அடிப்படைப் பொருளான ‘விழுதல்’ என்ற உயிரோட்டமான படிமத்தைப் பாதுகாக்கிறது.
- source_word: וַתֹּאכַל
  choice: விழுங்கியது
  rationale: வினைச்சொல்லின் நேரடிப் பொருள் ‘சாப்பிடுதல்’; நெருப்பைக் குறிக்கும் சூழலில் ‘விழுங்கியது’ இயல்பாகவும் தீவிரமாகவும் உள்ளது.
- source_word: הָעֹלָה
  choice: தகனபலி
  rationale: முழுமையாக எரித்துச் செலுத்தப்படும் பலியைக் குறிக்கும் வழக்கமான, தெளிவான பலியியல் சொல்.
- source_word: הָעֵצִים
  choice: விறகுகள்
  rationale: பலிபீடத்தில் அடுக்கப்பட்ட எரிபொருள் மரக்கட்டைகளை நவீன தமிழில் தெளிவாகக் குறிக்கிறது.
- source_word: הָאֲבָנִים
  choice: கற்கள்
  rationale: மூலத்தின் நேரடியான பொருளைக் காத்து, நெருப்பின் அசாதாரண வல்லமையை வெளிப்படுத்துகிறது.
- source_word: הֶעָפָר
  choice: புழுதி
  rationale: עפר குறிக்கும் உலர்ந்த, தளர்வான மண் அல்லது தூசி என்ற காட்சிப்படிமத்தைப் பாதுகாக்கிறது.
- source_word: לִחֵכָה
  choice: நக்கித் தீர்த்தது
  rationale: ‘நக்குதல்’ என்ற மூல உருவகத்தை இயல்பான தமிழில் காத்து, தண்ணீர் முழுவதும் மறைந்ததை உணர்த்துகிறது.
- source_word: הַמַּיִם אֲשֶׁר בַּתְּעָלָה
  choice: அகழியில் இருந்த தண்ணீர்
  rationale: பலிபீடத்தைச் சுற்றித் தோண்டப்பட்ட பள்ளம் அல்லது வாய்க்காலை ‘அகழி’ தெளிவாகக் குறிக்கிறது.
- source_word: וַ
  choice: அப்போது
  rationale: தொடர்ச்சியாக நிகழும் கதைச் சம்பவத்தின் அடுத்த கட்டத்தை நவீன தமிழில் இயல்பாகக் காட்டுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் வரும் உடன்படிக்கைத் தனிப்பெயரை பொதுப்பட்டமாக மாற்றாமல், தமிழில் அறியத்தக்க ஒலிவடிவத்தில் தருகிறது.
- issue: אֵשׁ יְהוָה என்பதில் உள்ள உறவு
  choice: யாவேயின் நெருப்பு
  alternative: யாவேயிடமிருந்து வந்த நெருப்பு
  rationale: எபிரெயச் சொற்றொடரின் சுருக்கத்தையும் அதன் உண்மையான உறவுநிலைத் தெளிவின்மையையும் பிரதான உரையில் காக்கிறது; தெய்வீக மூலத்தை வலியுறுத்தும் மாற்றுப் புரிதல் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும், வேதவாக்கியத்திற்கேற்ற கண்ணியத்துடனும் அமைக்கப்பட்டது. ‘விழுந்து,’ ‘விழுங்கியது,’ ‘நக்கித் தீர்த்தது’ ஆகிய சொற்கள் மூலத்தின் வலிமையான நெருப்புப் படிமங்களைப் பாதுகாக்கின்றன.
