  text: וַֽ/יְחַלְּק֥וּ לָ/הֶ֛ם אֶת הָ/אָ֖רֶץ לַֽ/עֲבָר בָּ֑/הּ אַחְאָ֞ב הָלַ֨ךְ בְּ/דֶ֤רֶךְ אֶחָד֙ לְ/בַדּ֔/וֹ וְ/עֹֽבַדְיָ֛הוּ הָלַ֥ךְ בְּ/דֶרֶךְ אֶחָ֖ד לְ/בַדּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/006.yaml
  text: 'So they divided the land between themselves to pass through it: Ahab went one way by himself[a], and Obadiah went another way by himself.'
translation:
  language: ta
  text: அவர்கள் அந்த நாட்டினூடே செல்வதற்காக அதைத் தங்களுக்குள் பிரித்துக்கொண்டார்கள். ஆகாப் ஒரு வழியாகத் தனியே சென்றான்; ஒபதியா வேறொரு வழியாகத்[a] தனியே சென்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெய மூலத்தில் இருவரைப் பற்றியும் சொல்லும்போது “ஒரு வழி” என்பதே திரும்ப வருகிறது: “ஆகாப் ஒரு வழியாகத் தனியே சென்றான்; ஒபதியா ஒரு வழியாகத் தனியே சென்றான்.” இருவரும் தனித்தனி வழிகளில் சென்றார்கள் என்பதை இயல்பான தமிழில் தெளிவாக்க, இரண்டாவது இடத்தில் “வேறொரு வழியாக” என்று மொழிபெயர்க்கப்பட்டுள்ளது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַלְּקוּ לָהֶם
  choice: அதைத் தங்களுக்குள் பிரித்துக்கொண்டார்கள்
  rationale: பியேல் வினைச்சொல் செயற்படப் பிரித்தல் அல்லது பங்கிட்டுக்கொள்ளுதல் என்ற பொருளைத் தருகிறது; לָהֶם இச்சூழலில் இருவருக்கிடையேயான பகிர்வைக் குறிக்கிறது. இந்தத் தமிழ் வடிவம் இரண்டையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֶת הָאָרֶץ
  choice: அந்த நாட்டை
  rationale: இங்கு אֶרֶץ என்பது அவர்கள் செல்லவிருந்த நிலப்பரப்பைக் குறிக்கிறது; உலகம் அல்லது மண் என்ற பொருள் அல்ல. சூழலில் “அந்த நாடு” இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: לַעֲבָר בָּהּ
  choice: அந்த நாட்டினூடே செல்வதற்காக
  rationale: עבר என்பதன் வினையெச்ச வடிவமும் בָּהּ என்பதும் அந்த நிலப்பரப்பினூடே நகர்ந்து செல்வதைக் குறிக்கின்றன. பயணத்தின் நோக்கத்தை மிகைப்படுத்தாமல் இவ்வடிவம் காக்கிறது.
- source_word: הָלַךְ
  choice: சென்றான்
  rationale: வழி அல்லது திசையை விவரிக்கும் இக்கதைச் சூழலில் הלך என்பதற்கு பொதுவான “சென்றான்” என்பது இயல்பானது; நடந்தே சென்றான் என்று தேவையின்றி வரையறுப்பதில்லை.
- source_word: בְּדֶרֶךְ אֶחָד
  choice: ஒரு வழியாக / வேறொரு வழியாக
  rationale: எபிரெயம் இரு உட்பிரிவுகளிலும் “ஒரு வழி” என்று மீண்டும் கூறுகிறது. நவீன தமிழில் இருவரும் வெவ்வேறு வழிகளில் சென்ற எதிர்மறை இணைப்பைத் தெளிவாக்க இரண்டாவது இடத்தில் “வேறொரு வழியாக” பயன்படுத்தப்பட்டுள்ளது; மூலத்தின் சொற்சார்ந்த வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לְבַדּוֹ
  choice: தனியே
  rationale: ஒவ்வொருவரும் மற்றவரிடமிருந்து பிரிந்து சென்றார் என்ற வலியுறுத்தலைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: אַחְאָב / עֹבַדְיָהוּ
  choice: ஆகாப் / ஒபதியா
  rationale: தமிழில் வழக்கிலுள்ள வேதாகமப் பெயர் வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன.
