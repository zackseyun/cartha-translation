source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֵלִיָּ֨הוּ֙ לְ/אַחְאָ֔ב עֲלֵ֖ה אֱכֹ֣ל וּ/שְׁתֵ֑ה כִּי ק֖וֹל הֲמ֥וֹן הַ/גָּֽשֶׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/041.yaml
  text: And Elijah said to Ahab[a], “Go up, eat and drink, for there is the sound of the abundance of rain.”
translation:
  language: ta
  text: எலியா ஆகாபிடம், “நீர் மேலே போய், சாப்பிட்டுக் குடியுங்கள்; ஏனெனில் பெருமழையின் இரைச்சல் கேட்கிறது[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொற்சொல்லான மொழிபெயர்ப்பு: “மழையின் பேரிரைச்சல் கேட்கிறது.” எபிரெயச் சொற்றொடர் மழையின் மிகுதியையும் அதன் ஆரவாரமான ஒலியையும் குறிக்கக்கூடும்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: என்றார்
  rationale: வாவ்-தொடர்ச்சி கதையை முன்னெடுத்தாலும், தமிழில் உரையாடலுக்குப் பின் வரும் ‘என்றார்’ இயல்பாகவும் கண்ணியமாகவும் உள்ளது.
- source_word: אֵלִיָּהוּ לְאַחְאָב
  choice: எலியா ஆகாபிடம்
  rationale: பெயர்கள் வழக்கமான தமிழ் ஒலிபெயர்ப்பில் தரப்பட்டுள்ளன; לְ பேச்சின் இலக்கைக் குறிக்கும் ‘-இடம்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: עֲלֵה
  choice: மேலே போய்
  rationale: עלה என்பதன் இடம்சார்ந்த ‘மேலே செல்/ஏறு’ என்ற பொருளைப் பேணுகிறது; அடுத்த கட்டளைகளுடன் இயல்பாக இணைய வினையெச்ச வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: אֱכֹל וּשְׁתֵה
  choice: சாப்பிட்டுக் குடியும்
  rationale: இரு கட்டளைகளையும் நேரடியாகவும் இயல்பான நவீன தமிழிலும் தருகிறது; அரசனை நோக்கிய உரையாதலால் மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்திய கட்டளைக்கான காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: קוֹל הֲמוֹן הַגָּשֶׁם
  choice: பெருமழையின் இரைச்சல் கேட்கிறது
  rationale: קוֹל-ஐ தமிழில் இயல்பான கேள்வுணர்வு வாக்கியமாகவும், הֲמוֹן-ன் ‘ஆரவாரம்/பேரொலி/மிகுதி’ சார்ந்த உயிரோட்டத்தை ‘இரைச்சல்’ மற்றும் ‘பெருமழை’ மூலம் பேணியும் தருகிறது.
theological_decisions:
- issue: மழை இன்னும் கண்முன் தோன்றாத நிலையில் எலியாவின் கூற்று
  choice: ‘பெருமழையின் இரைச்சல் கேட்கிறது’ என்று உறுதிக் கூற்றாகப் பேணப்பட்டது
  alternative: ‘பெருமழை வரப்போகும் ஓசை கேட்கிறது’
  rationale: எபிரெய உரை வருங்காலத்தை வெளிப்படையாகச் சேர்க்கவில்லை; ஆகவே தீர்க்கதரிசன முன்னறிவை விளக்கமாக விரிவாக்காமல் அதன் பதற்றத்தையும் உறுதியையும் பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில், ஆகாபை நோக்கிய கட்டளைகளில் மரியாதை விகுதி பயன்படுத்தப்பட்டுள்ளது.
