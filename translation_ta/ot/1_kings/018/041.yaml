review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents Elijah speaking to Ahab, the upward movement, the paired commands, and the asserted audible indication of rain. ‘பெருமழையின் இரைச்சல் கேட்கிறது’ is an acceptable idiomatic rendering of קוֹל הֲמוֹן הַגָּשֶׁם, though the Hebrew compactly allows both the sense of a great roar and an abundance/heavy onset of rain.
  naturalness: The wording is generally natural modern standard Tamil. However, with the respectful pronoun ‘நீர்,’ ‘சாப்பிட்டுக் குடியும்’ is less idiomatic and uneven in polite address. ‘சாப்பிட்டுக் குடியுங்கள்’ is clear, standard, and preserves the two imperatives.
  terminology: ‘எலியா’ and ‘ஆகாப்’ are established Tamil biblical name forms. ‘பெருமழையின் இரைச்சல்’ appropriately retains the vivid auditory force without inserting an explicit future prediction. The note responsibly records the lexical breadth of הֲמוֹן.
  issues:
  - severity: low
    issue: Polite imperative form is uneven.
    rationale: ‘நீர்’ establishes respectful singular address, for which ‘சாப்பிட்டுக் குடியுங்கள்’ is the normal modern standard imperative. The draft’s ‘குடியும்’ is possible in elevated usage but is less natural here and sits awkwardly after ‘சாப்பிட்டுக்’.
  revised_text: எலியா ஆகாபிடம், “நீர் மேலே போய், சாப்பிட்டுக் குடியுங்கள்; ஏனெனில் பெருமழையின் இரைச்சல் கேட்கிறது[a]” என்றார்.
