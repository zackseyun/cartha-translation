base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/039.yaml
  text: When all the people saw it[a], they fell on their faces and said, “Yahweh, he is God! Yahweh, he is God!”
translation:
  language: ta
  text: மக்கள் அனைவரும் அதைக் கண்டபோது, முகங்குப்புற விழுந்து, “யாவே, அவரே கடவுள்! யாவே, அவரே கடவுள்!” என்றார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּרְא כָּל הָעָם
  choice: மக்கள் அனைவரும் அதைக் கண்டபோது
  rationale: וַיַּרְא என்பதன் அடிப்படைப் பொருள் ‘கண்டார்கள்’. எபிரெயத்தில் செயப்படுபொருள் வெளிப்படையாக இல்லாவிட்டாலும், தமிழில் இயல்பாக அமைய ‘அதை’ சேர்க்கப்பட்டுள்ளது; இது முந்தைய வசனத்தில் மக்கள் கண்ட நெருப்பையும் நிகழ்வையும் குறிக்கிறது.
- source_word: וַיִּפְּלוּ עַל־פְּנֵיהֶם
  choice: முகங்குப்புற விழுந்து
  rationale: ‘தங்கள் முகங்கள்மேல் விழுந்தார்கள்’ என்ற எபிரெய உருவகத்தை, உடல்நிலையையும் பணிவையும் இயல்பான நவீனத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וַיֹּאמְרוּ
  choice: என்றார்கள்
  rationale: பொதுவான பேச்சுவினையான אמר-ஐ, மூலத்தில் இல்லாத ஒலி அளவையோ உணர்ச்சி விளக்கத்தையோ சேர்க்காமல் மொழிபெயர்க்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைவனின் தனிப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: הוּא
  choice: அவரே
  rationale: எபிரெயத்தில் வெளிப்படையாகவும் வலியுறுத்தலுடனும் வரும் மூன்றாம் நபர் ஒருமைப் பெயர்ச்சொல்லைத் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: הָאֱלֹהִים
  choice: கடவுள்
  rationale: இங்குள்ள குறிப்புச் சுட்டு யாவேயே பாகாலுக்கு மாறாக உண்மையான கடவுள் என்று அடையாளப்படுத்துகிறது. தமிழில் ‘கடவுள்’ என்பதே இப்பயனிலையை இயல்பாகத் தருகிறது; ‘அந்தக் கடவுள்’ என்பது தவறான சுட்டுப் பொருளை உண்டாக்கலாம்.
- source_word: יְהוָה הוּא הָאֱלֹהִים
  choice: யாவே, அவரே கடவுள்!
  rationale: பெயர், வலியுறுத்தும் பெயர்ச்சொல், பயனிலை ஆகிய எபிரெய அமைப்பையும், இருமுறை கூறப்படும் உச்சக்கட்ட அறிக்கையின் வலிமையையும் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூல உரை ஒரு பொதுப் பட்டத்தை அல்ல, இறைவனின் தனிப்பெயரையே பயன்படுத்துகிறது. எனவே அந்தப் பெயரை ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைக் காக்கிறது.
- issue: הָאֱלֹהִים என்பதிலுள்ள குறிப்புச் சுட்டு
  choice: கடவுள்
  alternative: மெய்யான கடவுள்
  rationale: பாகாலுடனான எதிர்மறை ஒப்பீட்டில் ‘உண்மையான கடவுள்’ என்ற பொருள் சூழலில் வெளிப்படுகிறது. ஆனால் ‘மெய்யான’ என்பது மூலத்தில் தனிச்சொல்லாக இல்லாததால், முதன்மை உரையில் அதைச் சேர்க்காமல் கட்டுரையின் அடையாளப்படுத்தும் வலிமையை ‘அவரே’ என்பதுடன் காக்கப்பட்டுள்ளது.
- issue: הוּא என்பதன் வலியுறுத்தல்
  choice: அவரே
  alternative: தான்
  rationale: ‘அவரே’ என்பது வெளிப்படையான பெயர்ச்சொல் வலியுறுத்தலைக் காக்கிறது. ‘தான்’ இன்னும் தீவிரமான தனித்துவப் பொருளைத் தரக்கூடும் என்பதால், மூலத்தில் உள்ள வலிமையை மீறாமல் இருக்க ‘அவரே’ தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்கு எளிதாகவும், வழிபாட்டு நிகழ்வின் கண்ணியத்துக்கு ஏற்றவாறும் அமைக்கப்பட்டுள்ளது. மூலத்தின் இருமுறை கூறும் அமைப்பும் ஆச்சரியக்குறிகளும் பாதுகாக்கப்பட்டுள்ளன.
