source:
  edition: WLC
  text: וַ/יִּקַּ֣ח אֵלִיָּ֗הוּ שְׁתֵּ֤ים עֶשְׂרֵה֙ אֲבָנִ֔ים כְּ/מִסְפַּ֖ר שִׁבְטֵ֣י בְנֵֽי יַעֲקֹ֑ב אֲשֶׁר֩ הָיָ֨ה דְבַר יְהוָ֤ה אֵלָי/ו֙ לֵ/אמֹ֔ר יִשְׂרָאֵ֖ל יִהְיֶ֥ה שְׁמֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/031.yaml
  text: And Elijah took twelve stones[a], according to the number of the tribes of the sons of Jacob, to whom the word of Yahweh had come, saying[b], “Israel shall be your name.”
translation:
  language: ta
  text: 'எலியா யாக்கோபின் மகன்களுடைய[a] கோத்திரங்களின் எண்ணிக்கைக்கு ஏற்ப பன்னிரண்டு கற்களை எடுத்தார். யாவே தம்முடைய வார்த்தையை யாக்கோபிடம் கூறியிருந்தார்: “உன் பெயர் இஸ்ரவேல் ஆகும்.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாக்கோபின் பிள்ளைகளுடைய.” எபிரெயத்தில் நேரடியாக “யாக்கோபின் மகன்கள்” என்று உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: இது கடவுள் யாக்கோபுக்கு “இஸ்ரவேல்” என்று மறுபெயரிட்ட நிகழ்வுகளை நினைவூட்டுகிறது; காண்க ஆதியாகமம் 32:28; 35:10.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּקַּח
  choice: எடுத்தார்
  rationale: לקח என்பதன் வழக்கமான கதைநடைப் பொருளை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: שְׁתֵּים עֶשְׂרֵה אֲבָנִים
  choice: பன்னிரண்டு கற்கள்
  rationale: எண்ணையும் பெயர்ச்சொல்லையும் நேரடியாகவும் தெளிவாகவும் பிரதிபலிக்கிறது.
- source_word: כְּמִסְפַּר
  choice: எண்ணிக்கைக்கு ஏற்ப
  rationale: כְּ என்பதன் ஒப்புமை/பொருத்த உணர்வையும் מִסְפָּר என்பதன் ‘எண்ணிக்கை’ பொருளையும் இயல்பான தமிழில் காக்கிறது.
- source_word: שִׁבְטֵי
  choice: கோத்திரங்கள்
  rationale: இஸ்ரவேலின் வம்ச-தேசியப் பிரிவுகளைக் குறிக்கும் שׁבט என்பதற்கான பரவலாக அறியப்பட்ட வேதாகமத் தமிழ்ச் சொல்.
- source_word: בְנֵי יַעֲקֹב
  choice: யாக்கோபின் மகன்கள்
  rationale: எபிரெய மூலத்தின் ‘யாக்கோபின் மகன்கள்’ என்ற ஆண்பால் குடும்பச் சொல்லாட்சியை நேரடியாகக் காக்கிறது; ‘பிள்ளைகள்’ என்பது இயல்பான விரிவான மாற்று.
- source_word: אֲשֶׁר הָיָה דְבַר־יְהוָה אֵלָיו
  choice: அந்த யாக்கோபிடம் யாவேவின் வார்த்தை வந்திருந்தது
  rationale: אֵלָיו மற்றும் பின்னுள்ள ஒருமை שְׁמֶךָ ஆகியவற்றின் அடிப்படையில் தொடர்புச் சொற்றொடர் யாக்கோபைக் குறிப்பதைத் தெளிவாக்குகிறது; ‘வார்த்தை வந்தது’ என்ற எபிரெய வெளிப்பாட்டையும் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநான்கெழுத்துப் பெயரை ஒரு பொதுப்பட்டமாக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: יִשְׂרָאֵל יִהְיֶה שְׁמֶךָ
  choice: இஸ்ரவேல் என்பது உன் பெயராக இருக்கும்
  rationale: ‘இஸ்ரவேல்’ என்பதை முன்வைக்கும் எபிரெயச் சொல்வரிசையையும் எதிர்காலப் பெயரிடல் அறிவிப்பையும் காக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் உடன்படிக்கைப் பெயரான יהוה நேரடியாக இருப்பதால், அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்த்துள்ளது.
- issue: אֲשֶׁר தொடங்கும் தொடர்புச் சொற்றொடரின் முன்னிலைச் சொல்
  choice: யாக்கோபைக் குறிக்கிறது
  alternative: யாக்கோபின் மகன்கள் அல்லது கோத்திரங்களைக் குறிக்கிறது
  rationale: אֵלָיו (‘அவனிடம்’) என்பதும் שְׁמֶךָ (‘உன் பெயர்’) என்பதும் எபிரெயில் ஆண்பால் ஒருமையாக இருப்பதால் யாக்கோபே இலக்கண ரீதியாக இயல்பான குறிப்பு; இது அவரது மறுபெயரிடலை நினைவூட்டுகிறது.
translation_notes:
  register: நவீன, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ்நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயின் நீண்ட தொடர்புச் சொற்றொடர் தமிழில் தெளிவாக வாசிக்க இரு வாக்கியங்களாக அமைக்கப்பட்டுள்ளது; ஆயினும் அதன் தர்க்கத் தொடர்பும் பெயரிடல் அறிவிப்பின் வலியுறுத்தலும் காக்கப்பட்டுள்ளன.
