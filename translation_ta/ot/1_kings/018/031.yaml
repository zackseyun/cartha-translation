- from: 'பின்பு எலியா, யாக்கோபின் மகன்களுடைய[a] கோத்திரங்களின் எண்ணிக்கைக்கு ஏற்ப பன்னிரண்டு கற்களை எடுத்தார். அந்த யாக்கோபிடம் யாவேவின் வார்த்தை வந்திருந்தது: “இஸ்ரவேல் என்பது உன் பெயராக இருக்கும்.”[b]'
  to: 'எலியா யாக்கோபின் மகன்களுடைய[a] கோத்திரங்களின் எண்ணிக்கைக்கு ஏற்ப பன்னிரண்டு கற்களை எடுத்தார். யாவே தம்முடைய வார்த்தையை யாக்கோபிடம் கூறியிருந்தார்: “உன் பெயர் இஸ்ரவேல் ஆகும்.”[b]'
  rationale: சிறிய நடை மற்றும் துல்லியத் திருத்தங்கள் மட்டுமே செய்யப்பட்டுள்ளன. யாக்கோபையே குறிக்கும் ஒருமைச் சுட்டுமொழியும் பெயரிடல் அறிவிப்பும் தெளிவாகக் காக்கப்பட்டுள்ளன; மூலத்தில் இல்லாத விளக்கமோ இறையியல் விளக்கமோ சேர்க்கப்படவில்லை.
