  text: וַ/יֹּ֤אמֶר אֵלִיָּ֨הוּ֙ אֶל הָ/עָ֔ם אֲנִ֞י נוֹתַ֧רְתִּי נָבִ֛יא לַ/יהוָ֖ה לְ/בַדִּ֑/י וּ/נְבִיאֵ֣י הַ/בַּ֔עַל אַרְבַּע מֵא֥וֹת וַ/חֲמִשִּׁ֖ים אִֽישׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/022.yaml
  text: Then Elijah said to the people[a], “I, I alone, am left as a prophet of Yahweh, but the prophets of Baal are four hundred and fifty men.”
translation:
  language: ta
  text: அப்போது எலியா மக்களிடம், “யாவேக்குரிய தீர்க்கதரிசியாக நான் மட்டுமே மீந்திருக்கிறேன்[a]; ஆனால் பாகாலின் தீர்க்கதரிசிகள் நானூற்று ஐம்பது பேர் இருக்கிறார்கள்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேக்குரிய தீர்க்கதரிசியாக நான் ஒருவன் மட்டுமே எஞ்சியிருக்கிறேன்.” இந்த மோதலில் எலியா வெளிப்படையாக வகித்த அப்போதைய நிலையை அவரது கூற்று பிரதிபலிக்கிறது; எனினும் ஒபதியா வேறு தீர்க்கதரிசிகளை மறைத்து வைத்திருந்ததாக இதே நிகழ்வுரை கூறுகிறது (1 இராஜாக்கள் 18:4, 13).
    reason: மாற்று மொழிபெயர்ப்பையும் நிகழ்வுரையில் நிலவும் பதற்றத்தையும் சுட்டிக்காட்டுதல்
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றார்
  rationale: வாவ் தொடர்வினை கதையை அடுத்த நிகழ்வுக்கு நகர்த்துகிறது; ‘அப்போது’ அதன் தொடர்ச்சியை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֶל הָעָם
  choice: மக்களிடம்
  rationale: இங்கு עָם கூடியிருந்த இஸ்ரவேல் மக்களைக் குறிக்கிறது; ‘மக்களிடம்’ நேரடியும் இயல்பானதும் ஆகும்.
- source_word: אֲנִי ... לְבַדִּי
  choice: நான் மட்டுமே
  rationale: வெளிப்படையாகக் கூறப்பட்ட אֲנִי மற்றும் לְבַדִּי தரும் வலியுறுத்தலைத் தமிழில் ‘நான் மட்டுமே’ இயல்பாகக் காக்கிறது.
- source_word: נוֹתַרְתִּי
  choice: மீந்திருக்கிறேன்
  rationale: இந்த வினை மீதியாக இருத்தல் அல்லது விடப்பட்டிருத்தல் என்ற தற்போதைய நிலையைச் சுட்டுகிறது; ‘மீந்திருக்கிறேன்’ இரு நுணுக்கங்களையும் சூழலுக்கேற்றவாறு தாங்குகிறது.
- source_word: נָבִיא לַיהוָה
  choice: யாவேக்குரிய தீர்க்கதரிசியாக
  rationale: לַיהוָה என்பது தீர்க்கதரிசி யாவேக்கு உரியவராகவும் அவருக்காகப் பேசுபவராகவும் இருப்பதைக் குறிக்கிறது; ‘யாவேக்குரிய’ இதைச் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெயத் தெய்வீகப் பெயரான YHWH-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் அதன் வழக்கமான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: וּנְבִיאֵי הַבַּעַל
  choice: ஆனால் பாகாலின் தீர்க்கதரிசிகள்
  rationale: வாவ் இங்கு எலியாவின் தனிமைக்கும் பாகாலின் தீர்க்கதரிசிகளின் பெரும் எண்ணிக்கைக்கும் இடையிலான முரண்பாட்டைக் காட்டுவதால் ‘ஆனால்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: אַרְבַּע מֵאוֹת וַחֲמִשִּׁים אִישׁ
  choice: நானூற்று ஐம்பது பேர்
  rationale: எண்ணிக்கைக்குப் பின் வரும் אִישׁ மனிதர்களை எண்ணும் சொல்லாக உள்ளது; தமிழில் ‘பேர்’ இதை இயல்பாகவும் துல்லியமாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயரே நேரடியாக உள்ளது. ஆகவே அதை ஒரு பட்டப்பெயராக மாற்றாமல் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
- issue: எலியா மட்டுமே மீந்த தீர்க்கதரிசி என்ற கூற்று
  choice: யாவேக்குரிய தீர்க்கதரிசியாக நான் மட்டுமே மீந்திருக்கிறேன்
  alternative: யாவேக்குரிய தீர்க்கதரிசியாக நான் ஒருவன் மட்டுமே எஞ்சியிருக்கிறேன்
  rationale: எலியா கூறிய வலியுறுத்தலை அப்படியே காக்கிறது; 1 இராஜாக்கள் 18:4, 13-ல் ஒபதியா மறைத்து வைத்த பிற தீர்க்கதரிசிகள் குறிப்பிடப்படுவதால் எழும் பதற்றத்தை முதன்மை உரையில் ஒத்திசைத்து நீக்கவில்லை.
translation_notes:
  register: மொழிநடை நவீனத் தரத் தமிழாகவும், பொதுவாசகர்களுக்குப் புரியக்கூடியதாகவும், அதே நேரத்தில் வேதாகமப் பொதுவாசிப்பிற்கு ஏற்ற கண்ணியத்துடனும் அமைக்கப்பட்டுள்ளது. ‘தீர்க்கதரிசி’ மற்றும் ‘பாகால்’ போன்ற பரவலாக அறியப்பட்ட வேதாகமச் சொற்கள் தக்கவைக்கப்பட்டுள்ளன.
