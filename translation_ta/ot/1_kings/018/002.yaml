  text: So Elijah went to show himself to Ahab[b][a]. Now the famine was severe in Samaria.
translation:
  language: ta
  text: எனவே எலியா ஆகாபின் முன் தோன்றச் சென்றார்.[a] அப்போது சமாரியாவில் பஞ்சம் மிகக் கடுமையாக இருந்தது.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆகாபுக்குத் தன்னைக் காண்பிக்க” அல்லது “ஆகாபின் முன்னிலையில் ஆஜராக.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “சமாரியாவில் பஞ்சம் மிகவும் தீவிரமாக இருந்தது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: எனவே ... சென்றார்
  rationale: தொடர்கதை வாவ் முந்தைய வசனத்தில் கொடுக்கப்பட்ட கட்டளையைத் தொடர்ந்து நடந்த செயலைக் குறிக்கிறது. ‘எனவே’ என்பது அந்தத் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֵלִיָּהוּ
  choice: எலியா
  rationale: எபிரெயப் பெயரின் தமிழில் நிலைபெற்ற வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: לְהֵרָאוֹת אֶל אַחְאָב
  choice: ஆகாபின் முன் தோன்ற
  rationale: ראה என்பதன் நிஃபால் வினையெச்சம் இங்கு ‘தோன்றுதல்’, ‘தன்னைக் காண்பித்தல்’, அல்லது ‘முன்னிலையில் ஆஜராதல்’ என்ற பொருளைத் தருகிறது. ‘முன் தோன்ற’ என்பது அந்தப் பொருளை இயல்பாகவும், நோக்கத்தை மிகையாக விளக்காமலும் தெரிவிக்கிறது.
- source_word: וְהָרָעָב
  choice: அப்போது ... பஞ்சம்
  rationale: இங்குள்ள வாவ் அடுத்த செயலை மட்டும் அல்லாமல் அந்நேரச் சூழ்நிலையை அறிமுகப்படுத்துகிறது. ‘அப்போது’ அந்தப் பின்னணித் திருப்பத்தைத் தெளிவாக்குகிறது.
- source_word: חָזָק
  choice: மிகக் கடுமையாக இருந்தது
  rationale: பஞ்சத்துடன் சேர்ந்து வரும் חָזָק அதன் தீவிரத்தைக் குறிக்கிறது; ‘மிகக் கடுமையாக’ என்பது நவீனத் தமிழில் இயல்பான இணைச்சொல்.
- source_word: בְּשֹׁמְרוֹן
  choice: சமாரியாவில்
  rationale: בְּ இங்கு இடத்தைக் குறிக்கிறது. ‘சமாரியா’ நகரத்தையோ அதன் சுற்றுப்பகுதியையோ குறிக்கக்கூடிய தெளிவின்மையை ‘சமாரியாவில்’ தக்கவைக்கிறது.
