  text: עֲנֵ֤/נִי יְהוָה֙ עֲנֵ֔/נִי וְ/יֵֽדְעוּ֙ הָ/עָ֣ם הַ/זֶּ֔ה כִּֽי אַתָּ֥ה יְהוָ֖ה הָ/אֱלֹהִ֑ים וְ/אַתָּ֛ה הֲסִבֹּ֥תָ אֶת לִבָּ֖/ם אֲחֹרַנִּֽית־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/037.yaml
  text: Answer me[a], O Yahweh, answer me, so that this people may know that you, O Yahweh, are God[b], and that you have turned their heart back.
translation:
  language: ta
  text: “யாவே, எனக்குப் பதிலளியும்; எனக்குப் பதிலளியும். யாவேவாகிய நீரே கடவுள்[a] என்றும், நீரே இந்த மக்களின் இதயத்தை[b] மீண்டும் திருப்பினீர்[c] என்றும் இந்த மக்கள் அறியும்படியாகப் பதிலளியும்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்தக் கடவுள்.”
    reason: הָאֱלֹהִים என்பதில் உள்ள குறிப்புத்தன்மையை வெளிப்படுத்தும் மாற்று மொழிபெயர்ப்பு.
  - marker: b
    text: எபிரெயத்தில் “அவர்களுடைய இதயம்” என்று ஒருமையில் உள்ளது; இது மக்களை ஒட்டுமொத்தமாகக் குறிக்கும் கூட்டுச் சொல்லாட்சி.
    reason: மூலத்தின் ஒருமை இலக்கண எண்ணையும் கூட்டுப்பொருளையும் விளக்குகிறது.
  - marker: c
    text: எபிரெயத்தில் நேரடியாக, “அவர்களுடைய இதயத்தைப் பின்னோக்கித் திருப்பினீர்.” சூழல் யாவேவிடம் மீண்டும் திரும்புதலைக் குறிக்கலாம்; ஆனால் திரும்பும் திசை வசனத்தில் வெளிப்படையாகச் சொல்லப்படவில்லை.
    reason: אֲחֹרַנִּית என்பதன் திரும்புதல்/பின்நோக்கிய மாற்றம் என்ற பொருளையும், குறிப்பிடப்படாத திசையையும் காக்கிறது.
lexical_decisions:
- source_word: עֲנֵנִי
  choice: எனக்குப் பதிலளியும்
  rationale: இது செயலில் வெளிப்படும் இறைமறுமொழிக்கான வேண்டுதல். தமிழில் இயல்பாகவும் மரியாதையுடனும் அமைய இவ்வாறு மொழிபெயர்க்கப்பட்டது; மூலத்தின் வலியுறுத்தலைக் காக்கத் திரும்பவருதல் அப்படியே வைக்கப்பட்டது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத்திருப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், எபிரெய மெய்யெழுத்துப் பெயரின் பொதுவாக ஏற்கப்படும் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: וְיֵדְעוּ
  choice: அப்போது ... அறிந்துகொள்வார்கள்
  rationale: இணைப்புச் சொல்லும் நிறைவுறா வினையும் இங்கு வேண்டுதலின் நோக்கம் அல்லது விளைவைச் சுட்டுகின்றன. தமிழில் இயல்பாக அமைய விளைவு வடிவம் பயன்படுத்தப்பட்டது.
- source_word: הָעָם הַזֶּה
  choice: இந்த மக்கள் / இவர்கள்
  rationale: עם என்ற ஒருமைக் கூட்டுப்பெயரின் பொருளை நவீனத் தமிழில் இயல்பாகத் தருகிறது; ஒரே வாக்கியத்தில் தேவையற்ற மறுபடியுரையைத் தவிர்க்க பின்னர் ‘இவர்கள்’ பயன்படுத்தப்பட்டது.
- source_word: כִּי אַתָּה יְהוָה הָאֱלֹהִים
  choice: நீரே யாவே, கடவுள்
  rationale: பாகாலுக்கு மாறாக யாவேதான் கடவுள் என்ற அடையாளப்படுத்தலையும் வலியுறுத்தலையும் ‘நீரே’ காக்கிறது. הָאֱלֹהִים என்பதிலுள்ள சுட்டுத்தன்மை அடிக்குறிப்பில் குறிப்பிடப்பட்டது.
- source_word: הֲסִבֹּתָ
  choice: திரும்பச் செய்தீர்
  rationale: ஹிஃபில் காரணவினை வடிவம் கடவுளுடைய செயற்பாட்டைத் தெளிவாகக் காட்டுகிறது; வெறும் அனுமதியாக மென்மைப்படுத்தப்படவில்லை.
- source_word: אֶת לִבָּם
  choice: இந்த மக்களின் இதயத்தை
  rationale: மூலத்தில் ‘இதயம்’ ஒருமையில் வந்து மக்களை ஒரே கூட்டாகக் குறிக்கிறது. அதைத் தமிழிலும் ஒருமையாகக் காத்துள்ளது.
- source_word: אֲחֹרַנִּית
  choice: திரும்ப
  rationale: பின்நோக்கிய திருப்பம் அல்லது முந்தைய நிலைக்குத் திரும்புதல் என்ற கருத்தைச் சுருக்கமாக வழங்குகிறது. திரும்பும் திசையை வெளிப்படையாகச் சேர்க்காமல் மூலத்தின் நுண்ணிய தெளிவின்மையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: மக்களின் இதயம் திரும்புவதில் கடவுளுடைய செயல்
  choice: நீரே ... இதயத்தைத் திரும்பச் செய்தீர்
  alternative: நீரே ... இதயம் திரும்பும்படி அனுமதித்தீர்
  rationale: மூலத்தின் காரணவினையும் நிறைவுற்ற வினை வடிவமும் கடவுளுடைய நேரடி செயலை வலியுறுத்துகின்றன. இதை அனுமதி அல்லது மனிதச் செயல் மட்டுமாக மாற்றாமல், வசனத்திலுள்ள இறையியல் அழுத்தம் பாதுகாக்கப்பட்டது.
- issue: இதயம் எதை நோக்கித் திருப்பப்பட்டது
  choice: திரும்பச் செய்தீர்
  alternative: உம்மிடம் திரும்பச் செய்தீர்
  rationale: சூழல் யாவேவிடம் மீண்டும் திரும்புதலை வலுவாக உணர்த்தினாலும், ‘உம்மிடம்’ என்பது எபிரெய வசனத்தில் வெளிப்படையாக இல்லை. ஆகவே முதன்மை உரையில் அதைச் சேர்க்காமல், அடிக்குறிப்பில் நேரடி சொல்லமைப்பும் சூழற்பொருளும் தரப்பட்டன.
- issue: யாவே கடவுளாக அடையாளப்படுத்தப்படுதல்
  choice: நீரே யாவே, கடவுள்
  alternative: யாவேவாகிய நீரே அந்தக் கடவுள்
  rationale: வாக்கியம் பாகாலுக்கு எதிராக யாவேயின் தனித்த இறைத்தன்மையை அறிவிக்கிறது. தமிழில் இயல்பான முதன்மை உரையுடன், எபிரெயக் கட்டுரையின் சாத்தியமான ‘அந்தக் கடவுள்’ வாசிப்பு அடிக்குறிப்பில் காக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு புரியும் வகையிலும் ஜெபத்திற்குரிய கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. இறைவனை நோக்கி மரியாதைப் பன்மையான ‘நீர்/செய்தீர்’ பயன்படுத்தப்பட்டது. மூலத்தின் இருமுறை வேண்டுதல், இறைப்பெயர், கூட்டொருமை ‘இதயம்’, கடவுளுடைய காரணச் செயல் ஆகியவை பாதுகாக்கப்பட்டன.
