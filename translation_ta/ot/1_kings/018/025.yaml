base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/025.yaml
  text: Then Elijah said to the prophets of Baal[a], “Choose one bull for yourselves and prepare it first, because you are many; then call on the name of your god[b], but put no fire under it.”
translation:
  language: ta
  text: அப்போது எலியா பாகாலின் தீர்க்கதரிசிகளிடம், “நீங்கள் உங்களுக்காக ஒரு காளையைத் தேர்ந்தெடுத்து, அதை முதலில் ஆயத்தப்படுத்துங்கள்; ஏனெனில் நீங்கள் பலர். பின்பு உங்கள் தெய்வத்தின் பெயரைச் சொல்லி வேண்டிக்கொள்ளுங்கள்; ஆனால் நெருப்பு வைக்காதீர்கள்[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “நெருப்பு வைக்காதீர்கள்”; எங்கே வைக்கக் கூடாது என்பது வெளிப்படையாகச் சொல்லப்படவில்லை. பலியிடும் சூழலில், பலியின் கீழ் நெருப்பு வைக்க வேண்டாம் என்பது உட்கருத்து.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றார்
  rationale: வாவ் தொடர்வினை கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது; நவீன தமிழில் ‘அப்போது’ அதன் தொடர் உணர்வை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לִנְבִיאֵי הַבַּעַל
  choice: பாகாலின் தீர்க்கதரிசிகளிடம்
  rationale: எபிரெயக் கட்டமைப்பு பாகாலுக்குரிய தீர்க்கதரிசிகள் என்பதைத் தெளிவாகக் குறிக்கிறது.
- source_word: בַּחֲרוּ לָכֶם הַפָּר הָאֶחָד
  choice: நீங்கள் உங்களுக்காக ஒரு காளையைத் தேர்ந்தெடுத்து
  rationale: முந்தைய சூழலில் குறிப்பிடப்பட்ட இரு காளைகளில் ஒன்றைத் தேர்ந்தெடுப்பதே பொருள்; לָכֶם என்பதையும் ‘உங்களுக்காக’ என்று காக்கிறது.
- source_word: וַעֲשׂוּ רִאשֹׁנָה
  choice: அதை முதலில் ஆயத்தப்படுத்துங்கள்
  rationale: பலிச் சூழலில் עשה என்பது காளையைப் பலிக்காகத் தயாரிப்பதைக் குறிக்கிறது; רִאשֹׁנָה செயல்களின் வரிசையில் அவர்கள் முதலில் செய்ய வேண்டும் என்கிறது.
- source_word: כִּי אַתֶּם הָרַבִּים
  choice: ஏனெனில் நீங்கள் பலர்
  rationale: அவர்கள் முதலில் செயல்பட வேண்டிய காரணத்தை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: וְקִרְאוּ בְּשֵׁם אֱלֹהֵיכֶם
  choice: பின்பு உங்கள் தெய்வத்தின் பெயரைச் சொல்லிக் கூப்பிடுங்கள்
  rationale: קרא בשם என்பது ஒரு தெய்வத்தின் பெயரைச் சொல்லி அழைத்தல் அல்லது வேண்டுதல் என்ற மரபுத்தொடர்; ‘பெயர்’ என்ற மூலப்படிமத்தையும் தமிழில் காக்கிறது.
- source_word: וְאֵשׁ לֹא תָשִׂימוּ
  choice: ஆனால் நெருப்பு வைக்காதீர்கள்[a]
  rationale: எபிரெயத்தில் ‘அதன் கீழ்’ என்பதுபோன்ற இடக்குறிப்பு வெளிப்படையாக இல்லை; ஆகவே அதை உரையில் சேர்க்காமல், பலிச் சூழலில் புரியும் வகையில் நேரடியாக மொழிபெயர்க்கிறது.
theological_decisions:
- issue: אֱלֹהֵיכֶם என்பது பாகாலைக் குறித்தல்
  choice: உங்கள் தெய்வத்தின்
  alternative: உங்கள் தெய்வங்களின்
  rationale: אֱלֹהִים வடிவத்தில் பன்மையாக இருக்கக்கூடியதாயினும், உடனடிச் சூழலில் ஒருமையான பாகாலே குறிக்கப்படுகிறார்; எனவே ஒருமை பொருத்தமானது.
translation_notes:
  register: இயல்பான நவீனத் தரத் தமிழ்; கதையுரைக்கு உரிய கண்ணியமான நடை. ‘பாகால்’ என்ற வழக்கமான பெயர்ப்பெயரும், சமயச் சூழலுக்குரிய ‘தீர்க்கதரிசிகள்’, ‘தெய்வம்’ ஆகிய சொற்களும் பயன்படுத்தப்பட்டுள்ளன. மூலத்தில் வெளிப்படையாக இல்லாத ‘கீழ்’ உரையில் சேர்க்கப்படாமல் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
