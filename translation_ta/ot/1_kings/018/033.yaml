translation:
  language: ta
  text: பின்பு அவர் விறகுகளை ஒழுங்காக அடுக்கி, காளையைத் துண்டுகளாக வெட்டி, அவற்றை விறகுகளின்மேல் வைத்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲרֹךְ
  choice: ஒழுங்காக அடுக்கி
  rationale: ערך என்பது இப்பலிச் சூழலில் விறகுகளை முறைப்படி அமைத்தல் அல்லது அடுக்குதல் என்று பொருள்படுகிறது. ‘ஒழுங்காக அடுக்கி’ என்பது செயலை இயல்பாகவும் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: הָעֵצִים
  choice: விறகுகளை
  rationale: எபிரெயத்தில் பன்மை வடிவம் இருந்தாலும், பலிபீடத்தில் எரிப்பதற்காக அடுக்கப்படும் மரக்கட்டைகளைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொல் ‘விறகுகள்’ ஆகும்.
- source_word: וַיְנַתַּח
  choice: துண்டுகளாக வெட்டி
  rationale: נתח என்பது பலிக்குரிய விலங்கைப் பகுதிகளாக வெட்டுவதைக் குறிக்கிறது. ‘துண்டுகளாக வெட்டி’ என்பது தொழில்நுட்பச் சுமையின்றி மூலத்தின் குறிப்பான பொருளைத் தருகிறது.
- source_word: הַפָּר
  choice: காளையை
  rationale: פַּר பலிச் சூழலில் பொதுவாகக் காளையைக் குறிக்கிறது. இவ்வசனத்தில் அதன் வயதைத் தனியாகக் குறிப்பிட வேண்டிய கட்டாயம் இல்லை.
- source_word: וַיָּשֶׂם
  choice: வைத்தார்
  rationale: שׂים என்பதன் அடிப்படைச் செயலை ‘வைத்தார்’ இயல்பாகத் தருகிறது; தமிழ் வாக்கியத்தில் மரியாதை ஒருமையும் தொடர்ச்சியான நிகழ்ச்சிநடையும் பேணப்படுகின்றன.
- source_word: עַל הָעֵצִים
  choice: விறகுகளின்மேல்
  rationale: עַל இங்கு நேரடியான இடத்தொடர்பைக் குறிக்கிறது. ‘விறகுகளின்மேல்’ என்பது பொருத்தமான, தெளிவான தமிழ் வடிவம்.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் வேதாகம நிகழ்ச்சிநடைக்குரிய கண்ணியமும் இணைந்த நடை. இறுதி வினையில் ‘அவற்றை’ சேர்க்கப்பட்டது; காளை முழுவதையும் அல்ல, வெட்டப்பட்ட துண்டுகளையே விறகுகளின்மேல் வைத்தார் என்பதைத் தமிழில் இயல்பாகத் தெளிவுபடுத்துகிறது.
