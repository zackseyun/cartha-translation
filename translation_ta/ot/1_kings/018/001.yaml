source:
  edition: WLC
  text: וַ/יְהִי֙ יָמִ֣ים רַבִּ֔ים וּ/דְבַר יְהוָ֗ה הָיָה֙ אֶל אֵ֣לִיָּ֔הוּ בַּ/שָּׁנָ֥ה הַ/שְּׁלִישִׁ֖ית לֵ/אמֹ֑ר לֵ֚ךְ הֵרָאֵ֣ה אֶל אַחְאָ֔ב וְ/אֶתְּנָ֥ה מָטָ֖ר עַל פְּנֵ֥י הָ/אֲדָמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/001.yaml
  text: And it happened after many days that the word of Yahweh came to Elijah in the third year[a], saying, “Go, show yourself to Ahab, and I will give rain upon the face of the land.”
translation:
  language: ta
  text: 'பல நாட்கள் கடந்தபின், மூன்றாம் ஆண்டில் யாவேயின் வார்த்தை எலியாவுக்கு வந்து இவ்வாறு கூறியது: “நீ போய் ஆகாபின் முன் உன்னை வெளிப்படுத்திக்கொள்; நான் நிலத்தின் மேல் மழையைத் தருவேன்[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நிலத்தின் மேல் மழையை அனுப்புவேன்” என்றும் மொழிபெயர்க்கலாம். எபிரெயத்தில் சொல்லுக்குச் சொல், “நிலத்தின் முகத்தின்மேல் மழையைத் தருவேன்.”
    reason: மூலத்தின் ‘தரு’ என்ற வினைச்சொல்லையும் ‘நிலத்தின் முகத்தின்மேல்’ என்ற எபிரெய மரபுத்தொடரையும் தெளிவுபடுத்துகிறது.
lexical_decisions:
- source_word: וַיְהִי יָמִים רַבִּים
  choice: பல நாட்களுக்குப் பிறகு
  rationale: நீண்ட கால இடைவெளிக்குப் பின் புதிய நிகழ்வு தொடங்குவதை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: וּדְבַר יְהוָה הָיָה אֶל אֵלִיָּהוּ
  choice: யாவேயின் வார்த்தை எலியாவுக்கு வந்தது
  rationale: தீர்க்கதரிசன வெளிப்பாட்டைக் குறிக்கும் எபிரெய வழக்குச் சொற்றொடரின் அமைப்பையும் பொருளையும் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தலைப்புப் பெயரைப் பதிலிடாமல், எபிரெய இறைப்பெயரான நான்கு எழுத்துப் பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: בַּשָּׁנָה הַשְּׁלִישִׁית
  choice: மூன்றாம் ஆண்டில்
  rationale: காலத்தைக் குறிக்கும் மூலமொழிச் சொற்றொடரின் நேரடியான, இயல்பான மொழிபெயர்ப்பு.
- source_word: הֵרָאֵה אֶל אַחְאָב
  choice: ஆகாபுக்கு உன்னைக் காண்பி
  rationale: ‘காணப்படு’ என்ற நிபால் வடிவத்தின் தன்னை வெளிப்படுத்தும் பொருளைக் காத்து, ஆகாபின் பார்வைக்கு வரும்படியான கட்டளையைத் தெரிவிக்கிறது.
- source_word: וְאֶתְּנָה מָטָר עַל פְּנֵי הָאֲדָמָה
  choice: நான் நிலமெங்கும் மழையைத் தருவேன்
  rationale: נתן என்பதன் ‘தருவேன்’ என்ற பொருளையும், ‘நிலத்தின் முகத்தின்மேல்’ என்பதன் பரப்பைக் குறிக்கும் கருத்தையும் இயல்பான தமிழில் இணைக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பொதுப் பட்டப்பெயர் அல்ல, இறைவனின் தனிப்பெயரே உள்ளது; எனவே அதைத் தமிழில் ஒலிபெயர்ப்பது மூல வேறுபாட்டைக் காக்கிறது.
- issue: மழையை இறைவன் ‘தருவது’
  choice: மழையைத் தருவேன்
  alternative: மழை பெய்யச் செய்வேன்
  rationale: மழை இறைவனிடமிருந்து வரும் கொடை என்ற மூலத்தின் נתן (‘கொடு’) வினைச்சொல் உருவகத்தைப் பாதுகாக்கிறது; இயல்பான மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; மரியாதையும் வேதாகம உரைக்குரிய கண்ணியமும் காக்கப்பட்டுள்ளன. தேவையற்ற பழமையான நடையும் சமயப் பிரிவுக்கே உரிய சொற்களும் தவிர்க்கப்பட்டுள்ளன. ஆங்கில ஆலோசனை உரையில் அடிக்குறி ‘மூன்றாம் ஆண்டு’ என்பதற்குப் பின் இருந்தாலும், அதன் உள்ளடக்கம் மழை குறித்ததால் தமிழில் பொருத்தமான இடத்துக்கு மாற்றப்பட்டுள்ளது.
