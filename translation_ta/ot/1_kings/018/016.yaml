lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: சென்றார்
  rationale: הלך என்பதன் வழக்கமான கதைத் தொடர்ச்சி வடிவம் இங்கு எளிய நகர்வைக் குறிக்கிறது; ‘சென்றார்’ இயல்பாகவும் மூலத்தின் சுருக்கத்தைப் பேணுவதாகவும் உள்ளது.
- source_word: עֹבַדְיָהוּ
  choice: ஒபதியா
  rationale: தனிப்பெயர் தமிழில் வழக்கமான வேதாகம ஒலிபெயர்ப்பு முறையில் வழங்கப்பட்டது.
- source_word: לִקְרַאת
  choice: சந்திக்க
  rationale: לקראת என்பது ஒருவரை நோக்கிச் சென்று எதிர்கொள்வதைக் குறிக்கிறது; இரு இடங்களிலும் ‘சந்திக்க’ என்பது இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: אַחְאָב
  choice: ஆகாப்
  rationale: தனிப்பெயர் தமிழில் வழக்கமான வேதாகம ஒலிபெயர்ப்பு முறையில் வழங்கப்பட்டது; வேற்றுமை உருபு சேரும் இடத்தில் ‘ஆகாபை’ என வருகிறது.
- source_word: וַיַּגֶּד לוֹ
  choice: அவரிடம் செய்தியைத் தெரிவித்தார்
  rationale: נגד என்பதன் ஹிப்ஃபீல் வடிவம் ‘சொல், அறிவி, செய்தி தெரிவி’ எனப் பொருள்படும். சொல்லப்பட்ட உள்ளடக்கத்தை வெளிப்படையாகச் சேர்க்காமல், தமிழில் இயல்பாக அமைய ‘செய்தியைத் தெரிவித்தார்’ என வழங்கப்பட்டது.
- source_word: וַיֵּלֶךְ אַחְאָב
  choice: பின்னர் ஆகாப் சென்றார்
  rationale: மீண்டும் வரும் வழக்கமான கதைத் தொடர்ச்சி வடிவம் அடுத்த நிகழ்வை முன்வைக்கிறது; தமிழில் இயல்பான தொடர் ஓட்டத்திற்காக ‘பின்னர்’ பயன்படுத்தப்பட்டது.
- source_word: אֵלִיָּהוּ
  choice: எலியா
  rationale: தனிப்பெயர் தமிழில் வழக்கமான வேதாகம ஒலிபெயர்ப்பு முறையில் வழங்கப்பட்டது; வேற்றுமை உருபுடன் ‘எலியாவை’ என வருகிறது.
