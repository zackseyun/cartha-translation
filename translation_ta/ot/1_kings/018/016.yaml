  text: So Obadiah went to meet Ahab and told him[a], and Ahab went to meet Elijah.
translation:
  language: ta
  text: ஒபதியா ஆகாபைச் சந்திக்கச் சென்று, அவருக்குத் தெரிவித்தார்[a]. ஆகாப் எலியாவைச் சந்திக்கச் சென்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவருக்குச் சொன்னார்” அல்லது “அவருக்கு அறிவித்தார்.” எபிரெய வினைச்சொல் “சொல்,” “அறிவி,” அல்லது “தெரிவி” எனப் பொருள்படலாம்.
