lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: பாய்ந்தது
  rationale: எபிரெய வினைச்சொல்லின் அடிப்படைப் பொருள் ‘சென்றது’ என்றாலும், தண்ணீரின் இயக்கத்தைச் சொல்லும் இச்சூழலில் ‘பாய்ந்தது’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: הַמַּיִם
  choice: தண்ணீர்
  rationale: எபிரெயத்தில் பன்மை வடிவிலுள்ள நீரைக் குறிக்கும் பெயர்ச்சொல்லுக்கு இயல்பான தமிழ் ஒருமைத் திரள்பெயர்.
- source_word: סָבִיב לַמִּזְבֵּחַ
  choice: பலிபீடத்தைச் சுற்றிலும்
  rationale: பலிபீடத்தைச் சூழ்ந்து எல்லாப் பக்கங்களிலும் தண்ணீர் சென்றதைத் தெளிவாகக் காட்டுகிறது.
- source_word: וְגַם
  choice: அது ... -யும்
  rationale: இரண்டாம் செயலையும் சேர்த்துக் கூறும் எபிரெய வலியுறுத்தலை இயல்பான தமிழ் இணைப்பும்மையால் வெளிப்படுத்துகிறது.
- source_word: אֶת־הַתְּעָלָה
  choice: வாய்க்காலை
  rationale: பலிபீடத்தைச் சுற்றித் தோண்டப்பட்ட நீர் செல்லும் பள்ளம் அல்லது கால்வாயை இச்சொல் குறிக்கிறது; ‘வாய்க்கால்’ இச்சூழலில் இயல்பாகவும் புரியும்படியாகவும் உள்ளது.
- source_word: מִלֵּא מָיִם
  choice: தண்ணீரால் நிரப்பியது
  rationale: ‘தண்ணீரால் நிறைத்தது’ என்ற பொருளை நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் வழங்குகிறது.
