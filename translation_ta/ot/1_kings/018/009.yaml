  yaml_path: translation/ot/1_kings/018/009.yaml
  text: And he said[a], “What have I sinned, that you are giving your servant into Ahab’s hand to put me to death?”
translation:
  language: ta
  text: அவன், “நான் என்ன பாவம் செய்தேன், என்னைக் கொல்லும்படி நீரே உமது அடியவனான என்னை ஆகாபின் கையில் ஒப்படைக்கிறீரே?” என்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அதற்கு அவன் ... என்றான்
  rationale: எபிரெயக் கதைநடையின் தொடர்ச்சியையும், இது முந்தைய பேச்சுக்கான பதில் என்பதையும் இயல்பான தமிழில் காட்டுகிறது.
- source_word: מֶה חָטָאתִי
  choice: நான் என்ன பாவம் செய்தேன்?
  rationale: חטא என்பதன் ஒழுக்க மற்றும் சமயப் பொருளை ‘பாவம்’ தக்கவைக்கிறது; கேள்வியின் துயரமும் எதிர்ப்பும் இயல்பாக வெளிப்படுகின்றன.
- source_word: אַתָּה נֹתֵן
  choice: நீரே ... ஒப்படைக்கிறீரே
  rationale: வெளிப்படையாகக் கொடுக்கப்பட்ட אַתָּה என்பதன் வலியுறுத்தலை ‘நீரே’ காட்டுகிறது. தொடரும் செயப்பெயரெச்சத்தின் நிகழ் அல்லது உடனடி உணர்வை ‘ஒப்படைக்கிறீரே’ தருகிறது.
- source_word: עַבְדְּךָ
  choice: உமது அடியவனை
  rationale: மேலானவரிடம் தன்னைத் தாழ்த்திக் குறிப்பிடும் சூழலில் ‘அடியவன்’ என்பது இயல்பான, மரியாதைமிக்க தமிழ்; அடிமைநிலையை தேவையின்றி முன்னிறுத்துவதில்லை.
- source_word: בְּיַד אַחְאָב
  choice: ஆகாபின் கையில்
  rationale: ஒருவரின் அதிகாரம் அல்லது கட்டுப்பாட்டுக்குள் கொடுத்தலைக் குறிக்கும் எபிரெய உருவகத்தைத் தெளிவான தமிழில் தக்கவைக்கிறது.
- source_word: לַהֲמִיתֵנִי
  choice: என்னைக் கொல்லும்படி
  rationale: מות என்பதன் காரணவினை வடிவம் இங்கு உயிரிழக்கச் செய்வதைக் குறிக்கிறது; ‘கொல்லும்படி’ நேரடியானதும் இயல்பானதும் ஆகும்.
