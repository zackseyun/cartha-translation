  source_fidelity: 'The Tamil accurately represents the Hebrew sequence: the speaker''s present challenge (''you are saying''), the imperative to go and report to Obadiah''s master, the demonstrative announcement that Elijah is present, and the anticipated result that the master will kill the speaker. The explicit subject ‘அவரோ’ naturally identifies the implied subject of the final verb as Obadiah’s master.'
  naturalness: The wording is fluent modern standard Tamil. Respectful singular address (‘நீர்/உம்/என்கிறீர்’) appropriately reflects Obadiah speaking to Elijah, while the nested quotation is clear and readable.
  terminology: ‘எஜமான்’ correctly denotes the human master/lord in this context and avoids confusing the referent with the divine title. ‘இதோ’ suitably conveys הִנֵּה, and ‘கொன்றுவிடுவார்’ naturally expresses the feared outcome.
