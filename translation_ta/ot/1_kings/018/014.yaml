source:
  edition: WLC
  text: וְ/עַתָּה֙ אַתָּ֣ה אֹמֵ֔ר לֵ֛ךְ אֱמֹ֥ר לַֽ/אדֹנֶ֖י/ךָ הִנֵּ֣ה אֵלִיָּ֑הוּ וַ/הֲרָגָֽ/נִי׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/014.yaml
  text: And now you are saying, ‘Go, tell your lord, “Look, Elijah is here,”’ and he will kill me.’
translation:
  language: ta
  text: இப்போதோ நீர் என்னிடம், ‘போய் உம் எஜமானிடம், “இதோ, எலியா இங்கே இருக்கிறார்” என்று சொல்’ என்கிறீர்; அவரோ என்னைக் கொன்றுவிடுவார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנֶיךָ
  choice: உம் எஜமானிடம்
  rationale: இங்கு மனிதத் தலைவரான ஆகாபைக் குறிக்கும் ‘உன் ஆண்டவன்/எஜமான்’ என்ற பொருள்; ‘எஜமான்’ சூழலில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் எபிரெயச் சுட்டுச்சொல்லின் வலிமையை இயல்பான தமிழ் வடிவில் காக்கிறது.
- source_word: וַהֲרָגָנִי
  choice: அவரோ என்னைக் கொன்றுவிடுவார்
  rationale: வாவ் தொடர்ச்சியுடன் வரும் அச்சமூட்டும் விளைவைக் காட்டுகிறது; தமிழில் கர்த்தாவைத் தெளிவாக்க ‘அவரோ’ சேர்க்கப்பட்டுள்ளது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில் மரியாதை ஒருமை பயன்படுத்தப்பட்டுள்ளது. ஒபதியா எலியாவிடம் பேசுவதால் ‘நீர்/உம்/என்கிறீர்’ என்றும், ஆகாபைக் குறிப்பதால் ‘அவர்’ என்றும் அமைக்கப்பட்டுள்ளது. நேரடி உரையின் அடுக்கை மேற்கோள் குறிகளால் தெளிவாகக் காட்டியுள்ளோம்.
