base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/046.yaml
  text: And the hand of Yahweh was on Elijah[b][a], and he tucked up his loins and ran ahead of Ahab as far as the entrance to Jezreel.
translation:
  language: ta
  text: யாவேயின் கை எலியாவின்மேல் இருந்தது[a]. அவர் தமது ஆடையை இடுப்பில் வரிந்துகட்டிக்கொண்டு[b], ஆகாபுக்கு முன்னால் யெஸ்ரயேலின் நுழைவிடம் வரை ஓடினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மரபுவழியாக, “யாவேயின் கை எலியாவின்மேல் வந்தது” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொற்சொல்லாக, “தமது இடுப்பை வரிந்துகட்டிக்கொண்டு”; அதாவது, ஓடுவதற்காகத் தமது நீண்ட ஆடையைத் தூக்கி இடுப்பில் இறுக்கிக் கட்டிக்கொண்டு.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: தேவனுடைய தனிப்பட்ட பெயரை எபிரெய உச்சரிப்புக்கு நெருக்கமான, நவீனத் தமிழ் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: וְיָד יְהוָה הָיְתָה אֶל
  choice: யாவேயின் கை எலியாவின்மேல் இருந்தது
  rationale: தெய்வீக வல்லமை அல்லது செயலாற்றலைக் குறிக்கும் எபிரெய மரபுத்தொடரின் உருவகத்தையும், ‘இருந்தது’ என்ற வினையின் நிலை உணர்வையும் காக்கிறது.
- source_word: וַיְשַׁנֵּס מָתְנָיו
  choice: தமது ஆடையை இடுப்பில் வரிந்துகொண்டு
  rationale: ஓடுவதற்காக நீண்ட ஆடையைத் தூக்கி இடுப்பில் இறுக்கிக் கட்டும் செயலை நவீனத் தமிழ் வாசகருக்குத் தெளிவாகக் கூறுகிறது; சொற்சொல்லான வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וַיָּרָץ לִפְנֵי
  choice: ஆகாபுக்கு முன்னால் ... ஓடினார்
  rationale: ஆகாபுக்கு முன்புறமாக ஓடிய இடவியல் பொருளைப் பாதுகாக்கிறது; சடங்குசார் பணிவிடையைத் தேவையின்றி உட்புகுத்தவில்லை.
- source_word: עַד בֹּאֲכָה
  choice: நுழைவிடம் வரை
  rationale: ஓட்டம் யெஸ்ரயேலை அணுகும் அல்லது அதற்குள் நுழையும் இடம் வரை நீடித்ததை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: יִזְרְעֶאלָה
  choice: யெஸ்ரயேல்
  rationale: இடப்பெயரின் தமிழில் நிலைபெற்ற வேதாகம ஒலிபெயர்ப்பைப் பயன்படுத்துகிறது.
theological_decisions:
- issue: எலியா பெற்ற தெய்வீக செயலாற்றலின் இயல்பு
  choice: ‘யாவேயின் கை எலியாவின்மேல் இருந்தது’ என்ற உருவகம் அப்படியே பாதுகாக்கப்படுகிறது.
  alternative: இது அற்புதமான உடல் வலிமை அல்லது தீர்க்கதரிசனத் தூண்டுதல் என்று வெளிப்படையாக விளக்குவது.
  rationale: இது யாவேயின் செயலாற்றலைக் குறித்தாலும், அந்த வல்லமையின் துல்லியமான இயல்பை எபிரெய உரை வரையறுக்கவில்லை. ஆகவே அற்புத வேகமா, தீர்க்கதரிசனத் தூண்டுதலா, இரண்டுமா என்ற இறையியல் இழுபறி தீர்க்கப்படாமல் விடப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்கு எளிதாகவும் வேதாகம உரைக்கேற்ற கண்ணியத்துடனும் அமைக்கப்பட்டுள்ளது. எபிரெய உருவகமான ‘யாவேயின் கை’ பாதுகாக்கப்பட்டு, பழங்கால ஆடைச் செயல் பொருள் சார்ந்த இயல்பான தமிழில் வழங்கப்பட்டுள்ளது.
