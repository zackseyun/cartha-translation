  text: וַֽ/יְהִי֙ בַּ/שְּׁבִעִ֔ית וַ/יֹּ֗אמֶר הִנֵּה עָ֛ב קְטַנָּ֥ה כְּ/כַף אִ֖ישׁ עֹלָ֣ה מִ/יָּ֑ם וַ/יֹּ֗אמֶר עֲלֵ֨ה אֱמֹ֤ר אֶל אַחְאָב֙ אֱסֹ֣ר וָ/רֵ֔ד וְ/לֹ֥א יַעַצָרְ/כָ֖ה הַ/גָּֽשֶׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/044.yaml
  text: And it happened on the seventh time that he said[a], “Look, a small cloud, like a man’s palm, is rising from the sea.” Then he said, “Go up, say to Ahab, ‘Harness your chariot and go down[c][b], so that the rain does not stop you.’”
translation:
  language: ta
  text: ஏழாவது முறை அவன், “இதோ, ஒரு மனிதனுடைய உள்ளங்கையைப் போன்ற சிறிய மேகம் ஒன்று கடலிலிருந்து எழும்பி வருகிறது”[a] என்றான். அப்போது எலியா, “நீ மேலே போய் ஆகாபிடம், ‘தேரைப் பூட்டிக்கொண்டு கீழே போ; மழை உன்னைத் தடுத்துவிடாதபடி’[b] என்று சொல்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஒரு மனிதனுடைய உள்ளங்கை அளவுள்ள சிறிய மேகம் ஒன்று” என்றும் மொழிபெயர்க்கலாம்.
    reason: எபிரெயத்தில் நேரடியாக ‘ஒரு மனிதனுடைய உள்ளங்கையைப் போன்ற’ என்ற ஒப்புமை உள்ளது; சூழலில் அது மேகத்தின் சிறிய அளவைக் குறிக்கிறது.
  - marker: b
    text: “தேரைப் பூட்டு” என்பது குதிரைகளைத் தேரோடு கட்டி, பயணத்திற்குத் தேரை ஆயத்தப்படுத்துவதைக் குறிக்கிறது.
    reason: பண்டைய தேர்ப் பயணத்தைச் சார்ந்த மரபுத்தொடரை நவீன வாசகர் புரிந்துகொள்ள உதவுகிறது.
lexical_decisions:
- source_word: וַיְהִי בַּשְּׁבִעִית
  choice: ஏழாவது முறை
  rationale: முன்னைய வசனங்களின் சூழலில் பணியாள் சென்று பார்த்த ஏழாவது தடவையை இது குறிக்கிறது. தமிழில் இயல்பாக அமைய, எபிரெயக் கதைத் தொடர் அமைப்பைத் தனியே மொழிபெயர்க்காமல் நிகழ்வின் காலச் சூழலை நேரடியாகக் கூறுகிறது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: கண்ணில் படும் ஒன்றின்மீது உடனடியாகக் கவனத்தை ஈர்க்கும் எபிரெயச் சுட்டிடைச்சொல்லின் உயிரோட்டத்தைப் பாதுகாக்கிறது.
- source_word: עָב קְטַנָּה
  choice: சிறிய மேகம் ஒன்று
  rationale: மேகத்தின் சிறிய தோற்றத்தைத் தெளிவாகவும் இயல்பான நவீன தமிழிலும் தெரிவிக்கிறது.
- source_word: כְּכַף אִישׁ
  choice: ஒரு மனிதனுடைய உள்ளங்கை அளவுள்ள
  rationale: כַּף என்பதன் அடிப்படைப் பொருளான ‘உள்ளங்கை’யையும், இச்சூழலில் உள்ள அளவு ஒப்புமையையும் தெளிவுபடுத்துகிறது.
- source_word: עֹלָה מִיָּם
  choice: கடலிலிருந்து எழும்பி வருகிறது
  rationale: நடந்துகொண்டிருக்கும் செயலைக் குறிக்கும் எபிரெயப் பெயரெச்சத்தின் தொடர்நிலையை வெளிப்படுத்துகிறது.
- source_word: עֲלֵה
  choice: மேலே போய்
  rationale: கட்டளையின் திசைநுட்பத்தைப் பாதுகாக்கிறது; பணியாள் செய்தியை எடுத்துச் செல்லும்படி அனுப்பப்படுகிறான்.
- source_word: אֱמֹר אֶל אַחְאָב
  choice: ஆகாபிடம் ... என்று சொல்
  rationale: நேரடிப் பேச்சை இயல்பான தமிழில் அறிமுகப்படுத்துகிறது.
- source_word: אֱסֹר
  choice: தேரைப் பூட்டிக்கொண்டு
  rationale: அடிப்படையில் ‘கட்டு/பூட்டு’ என்று பொருள்படும் வினை, இங்கு பயணத்திற்காகத் தேரையும் குதிரைகளையும் ஆயத்தப்படுத்துவதைக் குறிக்கும் மரபுத்தொடராக உள்ளது.
- source_word: וָרֵד
  choice: கீழே போ
  rationale: கர்மேல் உயரத்திலிருந்து இறங்கிச் செல்லும் நிலவியல் திசையைப் பாதுகாக்கிறது.
- source_word: וְלֹא יַעֲצָרְכָה הַגָּשֶׁם
  choice: மழை உன்னைத் தடுத்துவிடாதபடி
  rationale: עצר என்பதன் ‘தடுத்து நிறுத்து/செல்லவிடாமல் செய்’ என்ற பொருளை இயல்பாகக் கூறி, மழை பயணத்திற்கு இடையூறு செய்யும் அபாயத்தை வெளிப்படுத்துகிறது.
