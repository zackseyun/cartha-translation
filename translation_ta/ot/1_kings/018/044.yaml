translation_notes:
  register: நவீனத் தரத்தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. பேச்சாளர்கள் தெளிவாகத் தெரிய ‘எலியா’ என்பது சூழலிலிருந்து வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது. ‘இதோ’ என்ற உடனடி கவன ஈர்ப்புச் சொல் நேரடிப் பேச்சுக்குள் வைக்கப்பட்டுள்ளது; உள்ளங்கை ஒப்புமையின் வடிவமும் அளவும் குறித்த நுட்பம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
