lexical_decisions:
- source_word: וְעַתָּה
  choice: இப்போதோ
  rationale: சூழலில் ஒபதியாவின் எதிர்மறைத் திருப்பத்தையும் தற்போதைய நிலையைச் சுட்டுவதையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לַאדֹנֶיךָ
  choice: உன் தலைவனிடம்
  rationale: אָדוֹן இங்கு மனித அதிகாரியான ஆகாபைக் குறிக்கிறது; ‘ஆண்டவர்’ என மொழிபெயர்த்தால் இறைச்சுட்டாகத் தவறாகப் புரியலாம்.
- source_word: הִנֵּה
  choice: இதோ
  rationale: எலியா இங்கே இருப்பதை நேரடியாகச் சுட்டும் எபிரேய அறிவிப்புச் சொல்லின் வலிமையைப் பாதுகாக்கிறது.
