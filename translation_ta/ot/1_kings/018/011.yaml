review_pass:
  verdict: revise
  source_fidelity: The Hebrew directly says, “And now you are saying, ‘Go, say to your lord, ‘Look, Elijah [is here].’’” The draft accurately conveys the temporal/adversative opening, the imperative sequence, the human referent of אָדוֹן, and הִנֵּה. However, the Hebrew addressee is singular throughout (אַתָּה, לֵךְ, אַדֹנֶיךָ), whereas the draft uses plural-respectful “நீங்கள் ... என்கிறீர்கள்.” Tamil can naturally retain respectful singular address with “நீர் ... என்கிறீர்,” preserving the source number without loss of register.
  naturalness: 'The current wording is understandable and idiomatic. A small adjustment to singular respectful forms makes the dialogue more coherent: Obadiah is speaking to Elijah individually. “உமது தலைவனிடம்” is natural in formal respectful direct speech and avoids mixing “நீர்” with informal “உன்.”'
  terminology: “தலைவன்” is appropriate here for Ahab as Obadiah’s human master and avoids the divine associations that “ஆண்டவர்” can carry. “இதோ” properly represents הִנֵּה. “எலியா” is the standard Tamil biblical form.
  issues:
  - severity: medium
    issue: Second-person number is shifted from singular to plural.
    rationale: 'The source has singular forms: אַתָּה (“you”), לֵךְ (“go”), and אַדֹנֶיךָ (“your lord”). The Tamil plural-respectful forms can be understood as respectful singular, but they formally obscure the source’s singular address. Use singular respectful Tamil consistently.'
  - severity: low
    issue: Pronoun-register mismatch within the quoted command.
    rationale: The draft combines respectful “நீங்கள்” with informal singular possessive “உன்.” Using “நீர்” and “உமது” maintains a consistent respectful-singular register.
  revised_text: இப்போதோ நீர் என்னிடம், ‘நீர் போய் உமது தலைவனிடம், “இதோ, எலியா இங்கே இருக்கிறார்” என்று சொல்’ என்கிறீர்.
