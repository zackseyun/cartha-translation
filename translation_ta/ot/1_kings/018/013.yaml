source:
  edition: WLC
  text: הֲ/לֹֽא הֻגַּ֤ד לַֽ/אדֹנִ/י֙ אֵ֣ת אֲשֶׁר עָשִׂ֔יתִי בַּ/הֲרֹ֣ג אִיזֶ֔בֶל אֵ֖ת נְבִיאֵ֣י יְהוָ֑ה וָ/אַחְבִּא֩ מִ/נְּבִיאֵ֨י יְהוָ֜ה מֵ֣אָה אִ֗ישׁ חֲמִשִּׁ֨ים חֲמִשִּׁ֥ים אִישׁ֙ בַּ/מְּעָרָ֔ה וָ/אֲכַלְכְּלֵ֖/ם לֶ֥חֶם וָ/מָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/013.yaml
  text: Has it not been told to my lord what I did when Jezebel was killing the prophets of Yahweh—how I hid a hundred of the prophets of Yahweh[a], fifty men in each cave, and provided them with bread and water?
translation:
  language: ta
  text: யேசபேல் யாவேயின் தீர்க்கதரிசிகளைக் கொன்றுகொண்டிருந்தபோது நான் செய்தது என்னவென்று என் ஆண்டவருக்குச் சொல்லப்படவில்லையா? யாவேயின் தீர்க்கதரிசிகளில் நூறு பேரை, குகை ஒன்றுக்கு ஐம்பது பேர் வீதம்[a] மறைத்துவைத்து, அவர்களுக்கு அப்பமும் தண்ணீரும் கொடுத்து அவர்களைப் பராமரித்தேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஐம்பது பேர் வீதம் ஒரு குகையில்” அல்லது “குகைகளில் ஐம்பது பேர் கொண்ட இரு குழுக்களாக.” எபிரெயச் சொற்றொடர் ஐம்பது பேர் கொண்ட குழுக்களாகப் பிரித்ததைக் குறிக்கிறது; ‘குகை’ என்பதற்கான சொல் ஒருமையில் உள்ளது.
    reason: எபிரெயப் பகிர்வு அமைப்பையும் ‘குகை’ என்ற ஒருமை வடிவத்தையும் காட்டி, ஒரே குகை அல்லது குகைகள் என்ற விளக்க நுணுக்கத்தைத் திறந்தவாறே வைக்கிறது.
lexical_decisions:
- source_word: הֲלֹא הֻגַּד לַאדֹנִי
  choice: என் ஆண்டவருக்குச் சொல்லப்படவில்லையா?
  rationale: הֲלֹא நேர்மறையான பதிலை எதிர்பார்க்கும் வினாவைச் சுட்டுகிறது; הֻגַּד என்பதன் செயப்பாட்டு வடிவமும், எலியாவை மரியாதையுடன் அழைக்கும் לַאדֹנִי என்பதும் பாதுகாக்கப்பட்டுள்ளன.
- source_word: בַּהֲרֹג אִיזֶבֶל
  choice: யேசபேல் ... கொன்றுகொண்டிருந்தபோது
  rationale: முன்னிடைச்சொல்லுடன் வரும் infinitive construct காலச் சூழலைக் குறிக்கிறது; தொடர்ந்துகொண்டிருந்த கொலை நடவடிக்கையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: נְבִיאֵי יְהוָה
  choice: யாவேயின் தீர்க்கதரிசிகள்
  rationale: இணைப்பு அமைப்பை நேரடியாகப் பிரதிபலிக்கிறது; יהוה தனிப்பட்ட உடன்படிக்கைப் பெயராக ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: מִנְּבִיאֵי יְהוָה מֵאָה אִישׁ
  choice: யாவேயின் தீர்க்கதரிசிகளில் நூறு பேரை
  rationale: מִן பகுதியிலிருந்து எடுத்தல் என்ற பொருளை ‘தீர்க்கதரிசிகளில்’ எனத் தெளிவாகக் காட்டுகிறது; אִישׁ எண்ணப்படும் நபர்களைக் குறிக்கும் இயல்பான ‘பேர்’ மூலம் வெளிப்படுகிறது.
- source_word: חֲמִשִּׁים חֲמִשִּׁים אִישׁ בַּמְּעָרָה
  choice: குகை ஒன்றுக்கு ஐம்பது பேர் வீதம்
  rationale: எண்ணின் இரட்டிப்பு ஐம்பது ஐம்பதாகப் பிரித்த பகிர்வைக் குறிக்கிறது. ஒரே குகையா, தனித்தனி குகைகளா என்ற எபிரெய வடிவத்தின் வெளிப்பாட்டு இறுக்கத்தைத் தவறாக ஒரே குகை எனப் புரியவிடாமல் இயல்பான தமிழில் தருகிறது.
- source_word: וָאֲכַלְכְּלֵם לֶחֶם וָמָיִם
  choice: அவர்களுக்கு அப்பமும் தண்ணீரும் கொடுத்து பராமரித்தேன்
  rationale: כלכל என்பது வெறுமனே உணவளித்தல் அல்ல, தேவைகளை அளித்துப் பேணுதல் என்பதையும் குறிக்கிறது; அப்பமும் தண்ணீரும் என்ற தெளிவான பொருட்கள் அப்படியே வைக்கப்பட்டுள்ளன.
theological_decisions:
- issue: יהוה என்ற இறைபெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் உள்ள நான்கு எழுத்து இறைபெயரை பொதுப்பட்டமாக மாற்றாமல், உடன்படிக்கைப் பெயராக ஒலிபெயர்க்கிறது.
- issue: אֲדֹנִי என்பது இங்கு இறைப்பட்டமா?
  choice: என் ஆண்டவர்
  alternative: என் எஜமான்
  rationale: இது ஒபதியா எலியாவிடம் காட்டும் மரியாதை அழைப்பு; தெய்வத்தைக் குறிக்கும் பட்டமாக அல்ல. ‘என் ஆண்டவர்’ அந்த மரியாதைத் தொனியைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் உரையாடலின் அவசரத் தொனியும் காக்கப்பட்டுள்ளன. இறுதியில் வரும் ‘பராமரித்தேனே’ முன் கேட்கப்பட்ட எதிர்பார்ப்புவினாவின் வலியுறுத்தலை இயல்பாகத் தொடர்கிறது.
