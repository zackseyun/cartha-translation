base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/034.yaml
  text: Then he said[a], “Fill four jars with water and pour it on the burnt offering and on the wood.” Then he said, “Do it a second time,” and they did it a second time. Then he said, “Do it a third time,” and they did it a third time.
translation:
  language: ta
  text: அப்போது அவர், “நான்கு குடங்களில்[a] தண்ணீரை நிரப்பி, அதைத் தகனபலியின்மேலும் விறகுகளின்மேலும் ஊற்றுங்கள்” என்றார். பிறகு, “இரண்டாம் முறையும் அப்படியே செய்யுங்கள்” என்றார்; அவர்களும் இரண்டாம் முறையும் அப்படியே செய்தார்கள். பின்னர், “மூன்றாம் முறையும் செய்யுங்கள்” என்றார்; அவர்களும் மூன்றாம் முறையும் செய்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “நான்கு சாடிகளில்”; எபிரெயச் சொல் திரவங்களை எடுத்துச் செல்லும் ஒரு பாத்திரத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது அவர் … என்றார்
  rationale: வாவ் தொடர்வினை கதைநிகழ்வை முன்னெடுத்துச் செல்கிறது; ‘அப்போது’ என்பது அதன் தொடர் இயல்பை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מִלְאוּ
  choice: நிரப்பி
  rationale: பன்மை ஏவல் வினை; அடுத்த கட்டளையுடன் இணைந்த இயல்பான தமிழ் வினையெச்சத் தொடராக வழங்கப்பட்டுள்ளது.
- source_word: אַרְבָּעָה כַדִּים
  choice: நான்கு குடங்கள்
  rationale: כַּד என்பது திரவத்தை எடுத்துச் செல்லப் பயன்படும் குடம் அல்லது சாடி போன்ற பாத்திரம்; ‘குடம்’ தமிழ்ச் சூழலில் தெளிவானதும் வடிவத்தை அளவுக்கு மீறி வரையறுக்காததும் ஆகும்.
- source_word: מַיִם
  choice: தண்ணீர்
  rationale: பொதுமக்கள் இயல்பாகப் பயன்படுத்தும் நவீன தமிழ்ச் சொல்.
- source_word: וְיִצְקוּ
  choice: ஊற்றுங்கள்
  rationale: முன்னுள்ள பன்மை ஏவலின் தொடர்ச்சியான கட்டளை; தண்ணீரைக் குறிக்கும் ஒருமைச் சுட்டுப்பெயருடன் தமிழில் இயல்பாக வழங்கப்படுகிறது.
- source_word: עַל הָעֹלָה
  choice: தகனபலியின்மேல்
  rationale: עֹלָה என்பதற்கான நிலைபெற்ற பலியியல் இணைச்சொல் ‘தகனபலி’; עַל இங்கு மேலே ஊற்றும் உடல்சார் தொடர்பைக் குறிக்கிறது.
- source_word: וְעַל הָעֵצִים
  choice: விறகுகளின்மேல்
  rationale: இச்சூழலில் עֵצִים பலிக்காக அடுக்கப்பட்ட எரிவிறகுகளைக் குறிக்கிறது; ‘விறகுகள்’ என்பது ‘மரம்’ என்பதைக் காட்டிலும் துல்லியமானது.
- source_word: שְׁנוּ / וַיִּשְׁנוּ
  choice: இரண்டாம் முறையும் அப்படியே செய்யுங்கள் / இரண்டாம் முறையும் அப்படியே செய்தார்கள்
  rationale: மீண்டும் செய்வதை மட்டுமல்ல, எண்ணப்பட்ட இரண்டாம் நிகழ்வையும் எபிரெய வினைகள் சுட்டுவதால் அந்த வரிசை வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
- source_word: שַׁלֵּשׁוּ / וַיְשַׁלֵּשׁוּ
  choice: மூன்றாம் முறையும் செய்யுங்கள் / மூன்றாம் முறையும் செய்தார்கள்
  rationale: இரண்டாம் முறைக்குப் பின்வரும் மூன்றாம் நிகழ்வைத் தெளிவாகக் குறிக்கும் எபிரெயச் சொல்விளையாட்டு மற்றும் கதை அமைப்பு பாதுகாக்கப்பட்டுள்ளது.
theological_decisions:
- issue: עֹלָה என்ற பலியியல் சொல்லின் மொழிபெயர்ப்பு
  choice: தகனபலி
  alternative: முழுத் தகனபலி
  rationale: பலிமுழுவதும் எரிக்கப்படும் இஸ்ரவேலரின் வழக்கமான பலிவகையை இச்சொல் குறிக்கிறது. ‘தகனபலி’ என்பது மூலத்தில் வெளிப்படையாக இல்லாத விளக்கச் சொல்லைச் சேர்க்காமல் நிலைபெற்ற தமிழ்ச் சமயச் சொல்லாக உள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. கட்டளைகளிலும் அவற்றின் நிறைவேற்றத்திலும் உள்ள இரண்டாம்–மூன்றாம் முறை வரிசை திட்டமிட்டே மீளுரைக்கப்பட்டுள்ளது.
