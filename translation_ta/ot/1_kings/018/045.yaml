base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/045.yaml
  text: And in a little while[a], the sky grew black with clouds and wind, and there was a heavy rain[c][b]. Then Ahab mounted his chariot and went to Jezreel.
translation:
  language: ta
  text: சிறிது நேரத்தில்[a] வானம் மேகங்களாலும் காற்றினாலும் இருண்டது; பெருமழை பெய்தது[b]. ஆகாப் தன் தேரில் ஏறி யெஸ்ரயேலுக்குச் சென்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேய மரபுத்தொடர் சொற்சொல்லாக, “இவ்வாறு வரை, இவ்வாறு வரை”; இங்கு “இதற்குள்” அல்லது “சிறிது நேரத்தில்” என்று பொருள்.
    reason: lexical_alternative
  - marker: b
    text: சொற்சொல்லாக, “பெரிய மழை உண்டானது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי עַד כֹּה וְעַד כֹּה
  choice: சிறிது நேரத்திற்குள்
  rationale: ‘அதற்குள்’ அல்லது ‘சிறிது நேரத்தில்’ என்னும் காலப்பொருளைத் தரும் எபிரேய மரபுத்தொடரை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הַשָּׁמַיִם הִתְקַדְּרוּ
  choice: வானம் ... இருண்டது
  rationale: புயல் சூழலில் காணக்கூடிய வானம் மேகமூட்டத்தால் இருண்டதைத் தெளிவாகவும் இயல்பாகவும் சொல்கிறது.
- source_word: עָבִים וְרוּחַ
  choice: மேகங்களாலும் காற்றாலும்
  rationale: வானம் இருண்டதற்கான காரணம் அல்லது உடன்நிகழ்வாக மேகங்களையும் காற்றையும் மூலத்தின் வரிசைப்படி காட்டுகிறது.
- source_word: וַיְהִי גֶּשֶׁם גָּדוֹל
  choice: பெருமழை பெய்தது
  rationale: சொல்லளவில் ‘பெரிய மழை’ என்றாலும், வலுவான மழையைக் குறிக்கும் இயல்பான நவீனத் தமிழ் வழக்கு ‘பெருமழை பெய்தது’ ஆகும்.
- source_word: וַיִּרְכַּב אַחְאָב
  choice: ஆகாப் தன் தேரில் ஏறி
  rationale: வினையின் ‘ஏறுதல்/சவாரி செய்தல்’ பொருளைச் சூழலில் மறைந்துள்ள தேருடன் இயல்பாக வெளிப்படுத்துகிறது; ‘தன்’ என்பது தமிழில் இயல்புக்காகச் சேர்க்கப்பட்டது.
- source_word: יִזְרְעֶאלָה
  choice: யெஸ்ரயேலுக்கு
  rationale: இடப்பெயருடன் சேர்ந்த திசைவேற்றுமை முடிவைத் தமிழின் ‘-க்கு’ மூலம் வெளிப்படுத்துகிறது.
