source:
  edition: WLC
  text: וַ/יִּקְרָ֣א אַחְאָ֔ב אֶל עֹבַדְיָ֖הוּ אֲשֶׁ֣ר עַל הַ/בָּ֑יִת וְ/עֹבַדְיָ֗הוּ הָיָ֥ה יָרֵ֛א אֶת יְהוָ֖ה מְאֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/003.yaml
  text: And Ahab called Obadiah[a], who was over the household. Now Obadiah feared Yahweh greatly.
translation:
  language: ta
  text: ஆகாப், அரசவீட்டு நிர்வாகத்திற்குப் பொறுப்பாக இருந்த ஒபதியாவை[a] அழைத்தான். ஒபதியா யாவேக்கு மிகவும் பயந்தவனாய் இருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லளவில், “வீட்டின்மேல் இருந்தவன்.” இது அரசவீடு அல்லது அரண்மனை நிர்வாகத்திற்குப் பொறுப்பான தலைமை அதிகாரியைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא ... אֶל
  choice: அழைத்தான்
  rationale: קרא + אֶל என்பது இங்கு ஆகாப் ஒபதியாவை அழைத்த செயலைக் குறிக்கிறது. அரச அதிகாரத்தால் ‘வரவழைத்தான்’ என்றும் கூறலாம்; ஆனால் எபிரெயச் சொல் அந்த வலுவான நுணுக்கத்தை கட்டாயப்படுத்தாததால் இயல்பான ‘அழைத்தான்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: עֹבַדְיָהוּ
  choice: ஒபதியா
  rationale: தனிப்பெயர் நவீனத் தமிழில் எளிதாக உச்சரிக்கத்தக்க வகையில் ஒலிபெயர்க்கப்பட்டது.
- source_word: אֲשֶׁר עַל הַבָּיִת
  choice: அரண்மனை நிர்வாகப் பொறுப்பில் இருந்த
  rationale: சொல்லளவில் ‘வீட்டின்மேல் இருந்த’ என்றாலும், அரசவைக் சூழலில் இது அரச குடும்பம் அல்லது அரண்மனை நிர்வாகத்தின் தலைமை அதிகாரியைக் குறிக்கும் மரபுத்தொடர். தமிழில் பதவியின் பொருள் தெளிவாகுமாறு மொழிபெயர்க்கப்பட்டது; மாற்று சொல்லளவு வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: הָיָה יָרֵא אֶת יְהוָה
  choice: யாவேக்குப் ... பயந்து நடந்தவன்
  rationale: இந்த அமைப்பு ஒரு தருண உணர்ச்சியை அல்ல, ஒபதியாவின் நிலையான பண்பையும் வாழ்க்கை நடத்தையையும் குறிக்கிறது. ‘பயந்தான்’ என்பதைவிட ‘பயந்து நடந்தவன்’ என்ற தமிழ் வடிவம் அந்த பண்புநிலையை இயல்பாக வெளிப்படுத்துகிறது; ‘பயம்’ என்பதிலுள்ள இறைமரியாதை சார்ந்த அர்த்தத்தையும் மென்மையாக்காமல் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எழுத்துகளைக் கொண்ட இறைப் பெயர் ஒரு பட்டத்தால் மாற்றப்படாமல், தமிழில் வழக்கமான ‘யாவே’ என ஒலிபெயர்க்கப்பட்டது.
- source_word: מְאֹד
  choice: பெரிதும்
  rationale: ஒபதியாவின் இறைப்பயத்தை வலுப்படுத்தும் வினையடை; dignified modern Tamil-இல் இயல்பான தீவிரத்தைக் காட்ட ‘பெரிதும்’ பயன்படுத்தப்பட்டது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலவசனம் தனிப்பட்ட இறைப் பெயரை நேரடியாகப் பயன்படுத்துவதால், அதனை ஒரு பட்டமாக மாற்றாமல் தமிழில் ஒலிபெயர்ப்பது மூலத்துக்கு நெருக்கமானது.
- issue: יָרֵא என்பதின் ‘பயம்’ மற்றும் ‘பக்தி/மரியாதை’ சார்ந்த பொருள்
  choice: யாவேக்குப் பெரிதும் பயந்து நடந்தவன்
  alternative: யாவேமீது மிகுந்த பக்தியுள்ளவன்
  rationale: ‘பக்தியுள்ளவன்’ என்பது மரியாதை சார்ந்த பொருளை மட்டும் முன்னிறுத்தி, எபிரெயச் சொல்லின் உண்மையான ‘பயம்’ கூறை மறைக்கக்கூடும். தேர்ந்தெடுக்கப்பட்ட வடிவம் அந்த வேதாகமத் தத்துவச் செறிவையும் பண்புநிலையையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. ‘அரண்மனை நிர்வாகப் பொறுப்பு’ என்பது தெளிவுக்கான பொருள்சார் மொழிபெயர்ப்பு; சொல்லளவு உருவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
