source:
  edition: WLC
  text: וְ/נָתַתִּ֣י אֶת בֵּיתְ/ךָ֗ כְּ/בֵית֙ יָרָבְעָ֣ם בֶּן נְבָ֔ט וּ/כְ/בֵ֖ית בַּעְשָׁ֣א בֶן אֲחִיָּ֑ה אֶל הַ/כַּ֨עַס֙ אֲשֶׁ֣ר הִכְעַ֔סְתָּ וַֽ/תַּחֲטִ֖א אֶת יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/022.yaml
  text: And I will make your house like the house of Jeroboam son of Nebat and like the house of Baasha son of Ahijah[a], because of the provocation with which you have provoked me and caused Israel to sin.
translation:
  language: ta
  text: “நேபாத்தின் மகன் யெரொபெயாமின் வீட்டைப் போலவும், அகியாவின் மகன் பாஷாவின் வீட்டைப் போலவும் உன் வீட்டை[a] ஆக்குவேன். ஏனெனில், நீ என்னைக் கோபமூட்டி, இஸ்ரவேலைப் பாவம் செய்ய வைத்தாய்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் அரச வம்சத்தை.” இங்கு “வீடு” என்பது ஆகாபின் அரச வழிமரபைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: ஆக்குவேன்
  rationale: נתן என்பதன் அடிப்படைப் பொருள் ‘கொடு’ என்றாலும், அழிக்கப்பட்ட முந்தைய அரச வம்சங்களோடு ஆகாபின் வீட்டை ஒப்பிடும் இந்தத் தீர்ப்புச் சூத்திரத்தில் விளையும் நிலையைத் தெரிவிக்க ‘ஆக்குவேன்’ என்பது இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: בֵּיתְךָ
  choice: உன் வீட்டை
  rationale: בַּיִת என்பது வீடு, குடும்பம் அல்லது அரச வம்சம் ஆகியவற்றைக் குறிக்கலாம். இங்கு அரச வழிமரபைக் குறித்தாலும், எபிரெய உருவகத்தைப் பாதுகாக்க முதன்மை உரையில் ‘வீடு’ வைக்கப்பட்டு விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: כְּבֵית ... וּכְבֵית
  choice: வீட்டைப் போலவும் ... வீட்டைப் போலவும்
  rationale: כְ ஒப்புமையைக் குறிக்கிறது; இரு அரச வம்சங்களுடனான இணையான ஒப்புமையைத் தமிழில் தெளிவாகப் பாதுகாக்க இந்த அமைப்பு பயன்படுத்தப்பட்டது.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: நெபாத்தின் மகன் யெரொபெயாம்
  rationale: எபிரெய தந்தைவழி அடையாளச் சூத்திரம் இயல்பான தமிழ் உடைமைத் தொடராக மொழிபெயர்க்கப்பட்டது.
- source_word: בַּעְשָׁא בֶן אֲחִיָּה
  choice: அகியாவின் மகன் பாஷா
  rationale: பெயர்கள் ஒலிபெயர்க்கப்பட்டு, தந்தைவழி அடையாளம் நேரடியாகத் தமிழாக்கப்பட்டது.
- source_word: אֶל הַכַּעַס אֲשֶׁר הִכְעַסְתָּ
  choice: ஏனெனில், நீ என்னைக் கோபமூட்டி
  rationale: כעס தொடர்பான பெயர்ச்சொல் மற்றும் வினைச்சொல் இணைப்பு, தீர்ப்புக்கான காரணத்தைச் சுட்டுகிறது. எபிரெயச் சொற்புனருருவை இயற்கையற்ற முறையில் மீளுரைக்காமல், அதன் காரணப் பொருளும் ‘கோபமூட்டுதல்’ என்ற வலிமையும் தமிழில் பாதுகாக்கப்பட்டன.
- source_word: וַתַּחֲטִא אֶת יִשְׂרָאֵל
  choice: இஸ்ரவேலைப் பாவம் செய்ய வைத்தாய்
  rationale: חטא என்பதன் ஹிஃபில் வடிவம் மற்றொருவரைப் பாவம் செய்யச் செய்வதைக் குறிக்கிறது; ‘பாவம் செய்ய வைத்தாய்’ அந்தக் காரணவினைப் பொருளை நேரடியாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘கோபமூட்டினாய்’ என்பதன் மறைந்துள்ள தெய்வீகச் செயப்படுபொருள்
  choice: ‘என்னைக் கோபமூட்டி’ என்று வெளிப்படையாக மொழிபெயர்த்தல்
  alternative: செயப்படுபொருளைக் குறிப்பிடாமல் ‘கோபமூட்டி’ என்று விடுதல்
  rationale: எபிரெயத்தில் செயப்படுபொருள் வெளிப்படையாக இல்லாவிட்டாலும், பேசுபவர் ஆண்டவர் என்பதால் அவர் கோபமூட்டப்பட்டார் என்பது சூழலில் தெளிவு. ‘என்னை’ என்பது தமிழில் வாக்கியத்தைத் தெளிவாக்குகிறது; புதிய இறையியல் கருத்தைச் சேர்ப்பதில்லை.
- issue: அரச தீர்ப்பில் בֵּית என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘வீடு’ என்ற உருவகத்தைத் தக்கவைத்தல்
  alternative: ‘அரச வம்சம்’ என்று நேரடியாக மொழிபெயர்த்தல்
  rationale: இங்கு ஆகாபின் அரச வழிமரபே குறிக்கப்பட்டாலும், ‘வீடு’ என்ற எபிரெய உருவகம் முந்தைய அரச குடும்பங்களுடன் செய்யப்படும் ஒப்புமையையும் தீர்ப்புரையின் இலக்கிய ஒலியையும் பாதுகாக்கிறது. நோக்குப்பொருள் அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
translation_notes:
  register: நவீன செந்தமிழ் நடையில், பொதுவாசகர்களுக்கு எளிதில் புரியும் அதே நேரத்தில் தீர்ப்புரைக்கேற்ற கண்ணியமும் வலிமையும் கொண்ட மொழி பயன்படுத்தப்பட்டுள்ளது. எபிரெய ‘வீடு’ உருவகம் பாதுகாக்கப்பட்டு, அதன் அரச வம்சப் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
