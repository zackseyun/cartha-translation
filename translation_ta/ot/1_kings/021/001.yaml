base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/001.yaml
  text: After these things[a], Naboth the Jezreelite had a vineyard in Jezreel, beside the palace of Ahab king of Samaria.
translation:
  language: ta
  text: இந்த நிகழ்ச்சிகளுக்குப் பிறகு, யிஸ்ரயேலைச் சேர்ந்த நாபோத்துக்கு[a] யிஸ்ரயேலில் ஒரு திராட்சைத்தோட்டம் இருந்தது. அது சமாரியாவின் அரசன் ஆகாபின் அரண்மனைக்கு அருகில் இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யிஸ்ரயேலைச் சேர்ந்த நாபோத்துக்குச் சொந்தமான ஒரு திராட்சைத்தோட்டம் இருந்தது.” எபிரெய மொழியில் உடைமை, “நாபோத்துக்கு ... இருந்தது” என்ற அமைப்பில் தெரிவிக்கப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: '[தனி வார்த்தையாக மொழிபெயர்க்கப்படவில்லை]'
  rationale: இது புதிய கதைப்பகுதியை அறிமுகப்படுத்தும் எபிரெயக் கதைநடை வடிவம். தமிழில் அடுத்துவரும் காலக் குறிப்பே மாற்றத்தை இயல்பாக உணர்த்துவதால், ‘அப்போது’ போன்ற மூலத்தில் வெளிப்படையாக இல்லாத சொல்லைச் சேர்க்கவில்லை.
- source_word: אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: இந்த நிகழ்ச்சிகளுக்குப் பிறகு
  rationale: எபிரெய பன்மைத் தொடர் முந்தைய சம்பவங்களைக் குறிக்கிறது. ‘காரியங்கள்’ என்பதைவிட ‘நிகழ்ச்சிகள்’ நவீனத் தமிழ்க் கதைநடையில் இயல்பாக உள்ளது.
- source_word: כֶּרֶם
  choice: திராட்சைத்தோட்டம்
  rationale: இச்சொல்லின் வழக்கமான பொருள் திராட்சைக் கொடிகள் பயிரிடப்படும் தோட்டம்.
- source_word: הָיָה לְנָבוֹת
  choice: நாபோத்துக்கு ... இருந்தது
  rationale: எபிரெய மொழியின் இருப்பு-உடைமை அமைப்பைத் தமிழிலும் இயல்பாகவும் நெருக்கமாகவும் பிரதிபலிக்கிறது; இதன் மாற்று வெளிப்பாடு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: נָבוֹת
  choice: நாபோத்
  rationale: தனிப்பெயர் தமிழில் தெளிவாக ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: הַיִּזְרְעֵאלִי
  choice: யிஸ்ரயேலைச் சேர்ந்த
  rationale: இந்த இன/இடச் சார்புப்பெயர் நாபோத்தின் ஊர் அல்லது தொடர்பைச் சுட்டுகிறது; தமிழில் இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: אֲשֶׁר בְּיִזְרְעֶאל
  choice: யிஸ்ரயேலில்
  rationale: தொடர்புச் சொற்றொடர் திராட்சைத்தோட்டத்தின் இருப்பிடத்தைக் குறிப்பிடுகிறது.
- source_word: אֵצֶל
  choice: அருகில்
  rationale: இட நெருக்கத்தைக் குறிக்கிறது. ‘பக்கத்தில்’ என்பதும் சாத்தியம்; ‘அருகில்’ கண்ணியமான நவீன நடைக்கு ஏற்றது.
- source_word: הֵיכַל
  choice: அரண்மனை
  rationale: அரசச் சூழலில் இச்சொல் ஆலயத்தை அல்ல, அரசனின் மாளிகை அல்லது அரண்மனையைக் குறிக்கிறது.
- source_word: אַחְאָב
  choice: ஆகாப்
  rationale: தனிப்பெயர் வழக்கமான தமிழ்ச் சொல்வடிவத்தில் தரப்பட்டுள்ளது.
- source_word: מֶלֶךְ שֹׁמְרוֹן
  choice: சமாரியாவின் அரசன்
  rationale: இணைப்புத் தொடர் ஆகாபின் அரசாட்சிப் பகுதியை அடையாளப்படுத்துகிறது.
