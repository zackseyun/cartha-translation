revisions:
- from: ஆகாப் இந்த வார்த்தைகளைக் கேட்டபோது, தன் உடைகளைக் கிழித்து, தன் உடல்மேல் துக்கவுடையை அணிந்து, நோன்பிருந்து, துக்கவுடையிலேயே படுத்து, அடக்கமாக நடந்துகொண்டான்.[a]
  to: ஆகாப் இந்த வார்த்தைகளைக் கேட்டபோது, தன் உடைகளைக் கிழித்து, தன் உடலில் சாக்குத்துணியை அணிந்து, நோன்பிருந்து, சாக்குத்துணியிலேயே படுத்து, மெதுவாக நடந்தான்.[a]
  rationale: The revision replaces the interpretively functional “துக்கவுடை” with the concrete “சாக்குத்துணி,” retains each of the Hebrew actions without judging Ahab's sincerity, and renders the final verb as walking rather than general conduct. The footnote preserves the lexical range of אַט without importing a definite inward emotional assessment.
