base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/027.yaml
  text: And it happened[a], when Ahab heard these words, that he tore his clothes and put sackcloth on his flesh and fasted and lay in sackcloth and went about softly.
translation:
  language: ta
  text: ஆகாப் இந்த வார்த்தைகளைக் கேட்டபோது, தன் உடைகளைக் கிழித்து, தன் உடலில் சாக்குத்துணியை அணிந்து, நோன்பிருந்து, சாக்குத்துணியிலேயே படுத்து, மெதுவாக நடந்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அமைதியாக நடந்தான்,’ ‘மென்மையாக நடந்தான்,’ அல்லது ‘தாழ்ந்த நிலையில் நடந்தான்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் மெதுவான அல்லது அடங்கிய நடையைச் சுட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִשְׁמֹעַ
  choice: ஆகாப் ... கேட்டபோது
  rationale: וַיְהִי என்னும் எபிரெயக் கதைத் தொடர் சூத்திரத்தைத் தமிழில் தனியே மொழிபெயர்த்தால் நடை செயற்கையாகும். காலத்தைக் குறிக்கும் כִשְׁמֹעַ என்பதன் பொருளை இயல்பான தமிழில் ‘கேட்டபோது’ எனத் தருகிறது.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: இந்த வார்த்தைகள்
  rationale: இங்கு எலியா கூறிய நியாயத்தீர்ப்புச் செய்தி சுட்டப்படுகிறது; דְּבָרִים என்பதன் பேச்சுசார்ந்த பொருளை ‘வார்த்தைகள்’ காக்கிறது.
- source_word: וַיִּקְרַע בְּגָדָיו
  choice: தன் உடைகளைக் கிழித்து
  rationale: துக்கத்தைக் காட்டும் வழக்கமான செயலைத் தெளிவான நவீன தமிழில் நேரடியாகத் தருகிறது.
- source_word: וַיָּשֶׂם שַׂק עַל בְּשָׂרוֹ
  choice: தன் உடல்மேல் துக்கவுடையை அணிந்து
  rationale: שַׂק என்பது துக்கத்திலும் தாழ்மையிலும் அணியும் கரடுமுரடான ஆடை. ‘துக்கவுடை’ அதன் செயல்பாட்டைத் தெளிவாக்குகிறது; עַל בְּשָׂרוֹ என்பதன் உடலோடு நேரடியான தொடர்பை ‘உடல்மேல்’ காக்கிறது.
- source_word: וַיָּצֹם
  choice: நோன்பிருந்து
  rationale: צוּם என்பதன் நேரான, இயல்பான தமிழாக்கம்.
- source_word: וַיִּשְׁכַּב בַּשָּׂק
  choice: துக்கவுடையிலேயே படுத்து
  rationale: שׁכב இங்கு படுத்திருப்பதைக் குறிக்கிறது; தூங்கினான் என்று மூலத்தைவிடக் கூடுதலாகக் குறிப்பிடாமல் உள்ளது.
- source_word: וַיְהַלֵּךְ אַט
  choice: அடக்கமாக நடந்துகொண்டான்
  rationale: אַט மெதுவான, அமைதியான அல்லது தாழ்ந்த நடத்தை/நடையைச் சுட்டலாம். ‘அடக்கமாக நடந்துகொண்டான்’ தொடர்ந்த தாழ்வான நடத்தையை இயல்பான தமிழில் தருகிறது; மாற்று நுணுக்கங்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
theological_decisions:
- issue: ஆகாபின் எதிர்வினையின் தன்மை
  choice: வெளிப்படையான துக்கம் மற்றும் தாழ்மையின் செயல்களை மட்டும் விவரித்தல்
  alternative: அவன் உண்மையாக மனந்திரும்பினான் அல்லது வெறும் வெளிப்புறச் சடங்கைச் செய்தான் என்று தீர்மானித்துக் கூறுதல்
  rationale: எபிரெய வசனம் அவனுடைய செயல்களை மட்டுமே தெரிவிக்கிறது; அவனுடைய உள்ளார்ந்த மனநிலையின் உண்மைத்தன்மையை இவ்வசனம் தனியாகத் தீர்மானிக்கவில்லை. எனவே அந்த இறையியல் பதற்றம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கேற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டது. ‘சாக்குத்துணி’ என்பதற்குப் பதிலாக அதன் துக்கப் பயன்பாட்டைத் தெளிவாக்கும் ‘துக்கவுடை’ பயன்படுத்தப்பட்டது.
