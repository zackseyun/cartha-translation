    text: அல்லது, “யெஸ்ரயேலின் அரணருகே.” இங்குள்ள எபிரெயச் சொல் பொருள் தெளிவற்றது; அது நகரத்தின் பாதுகாப்பு அரணையோ அதன் வெளிப்புற அரண்பகுதியையோ இன்னும் குறிப்பாகச் சுட்டலாம்.
