  yaml_path: translation/ot/1_kings/021/011.yaml
  text: So the men of his city—the elders and the nobles who lived in his city—did as Jezebel had sent to them[a], as it was written in the letters that she had sent to them.
translation:
  language: ta
  text: ஆகவே, அவனுடைய நகரத்து ஆட்கள்—அந்த நகரத்தில் வாழ்ந்த மூப்பர்களும் பிரமுகர்களும்[a]—யேசபேல் தங்களுக்கு அனுப்பியிருந்தபடியே, அவள் தங்களுக்கு அனுப்பிய கடிதங்களில் எழுதப்பட்டிருந்தபடியே செய்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உயர் நிலையிலிருந்தவர்கள்.” இங்கு “பிரமுகர்கள்” என்று மொழிபெயர்க்கப்பட்டுள்ள எபிரெயச் சொல், சமூகத்தில் செல்வாக்குப் பெற்றவர்களையோ உயர் பதவியிலிருந்த அதிகாரிகளையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: செய்தார்கள்
  rationale: இச்சூழலில் עשה என்பது யேசபேலின் எழுத்துப்பூர்வமான கட்டளைகளுக்கு அவர்கள் கீழ்ப்படிந்து செயல்பட்டதைக் குறிக்கிறது; எபிரெய உரையின் எளிய கதைநடையை ‘செய்தார்கள்’ இயல்பாகக் காக்கிறது.
- source_word: אַנְשֵׁי עִירוֹ
  choice: அவனுடைய நகரத்து ஆட்கள்
  rationale: சொல்லளவில் ‘அவனுடைய நகரத்தின் ஆண்கள்’ எனப் பொருள்படும். அடுத்து மூப்பர்களும் பிரமுகர்களும் என்று ஆண் நகரத் தலைவர்கள் விளக்கப்படுவதால், பொதுவான ‘மக்கள்’ என்பதற்குப் பதிலாக ‘ஆட்கள்’ பொருத்தமானது.
- source_word: הַזְּקֵנִים
  choice: மூப்பர்கள்
  rationale: இது வெறுமனே வயதானவர்களை அல்ல, நகரத்தின் அங்கீகரிக்கப்பட்ட தலைவர்களைக் குறிக்கிறது; ‘மூப்பர்கள்’ அந்தக் குடிமைத் தலைமைப் பொருளைக் காக்கிறது.
- source_word: הַחֹרִים
  choice: பிரமுகர்கள்
  rationale: இங்கே חֹרִים என்பது சமூகத்தில் உயர்ந்த நிலையையோ அதிகாரப் பொறுப்பையோ கொண்டவர்களைக் குறிக்கிறது. சாதி அல்லது பிறப்புவழி உயர்வைத் தேவையின்றி உணர்த்தக்கூடிய ‘உயர்குடியினர்’ என்பதைக் காட்டிலும் ‘பிரமுகர்கள்’ இன்றைய தமிழில் இயல்பாக உள்ளது.
- source_word: הַיֹּשְׁבִים בְּעִירוֹ
  choice: அந்த நகரத்தில் வாழ்ந்த
  rationale: ישב என்பதன் அடிப்படைப் பொருள் ‘அமர்தல்/குடியிருத்தல்’; இங்கே நகரில் வசித்தவர்களைக் குறிப்பதால் ‘வாழ்ந்த’ என்பது இயல்பான தமிழாக்கம்.
- source_word: כַּאֲשֶׁר שָׁלְחָה אֲלֵיהֶם אִיזָבֶל
  choice: யேசபேல் தங்களுக்கு அனுப்பியிருந்தபடியே
  rationale: மூலத்தில் ‘அனுப்பினாள்’ என்பதற்கான நேரடிப் பொருள் குறிப்பிடப்படாமல், அடுத்த சொற்றொடரில் கடிதங்கள் தெளிவுபடுத்தப்படுகின்றன. எனவே ‘செய்தி/கட்டளை’ என்பதை முன்கூட்டியே சேர்க்காமல் மூலத்தின் சுருக்கமும் சிறிய மறைபொருளும் காக்கப்படுகின்றன.
- source_word: כָּתוּב בַּסְּפָרִים
  choice: கடிதங்களில் எழுதியிருந்தபடியே
  rationale: סְפָרִים இச்சூழலில் யேசபேல் அனுப்பிய எழுத்துப்பூர்வமான கடிதங்களைக் குறிக்கிறது; ‘கடிதங்கள்’ என்பது ‘சுருள்கள்’ அல்லது ‘ஆவணங்கள்’ என்பதைக் காட்டிலும் சூழலுக்குத் துல்லியமானது.
- source_word: אֲשֶׁר שָׁלְחָה אֲלֵיהֶם
  choice: அவள் தங்களுக்கு அனுப்பிய
  rationale: இந்த உறவுச்சொற்றொடர் கடிதங்களை அடையாளப்படுத்துகிறது; தமிழில் இயல்பாகவும் மூலத்துக்கு நெருக்கமாகவும் உள்ளது.
