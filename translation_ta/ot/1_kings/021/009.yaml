  text: וַ/תִּכְתֹּ֥ב בַּ/סְּפָרִ֖ים לֵ/אמֹ֑ר קִֽרְאוּ צ֔וֹם וְ/הוֹשִׁ֥יבוּ אֶת נָב֖וֹת בְּ/רֹ֥אשׁ הָ/עָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/009.yaml
  text: She wrote in the letters[a], saying, “Proclaim a fast, and seat Naboth at the head of the people.”
translation:
  language: ta
  text: 'அவள் அந்தக் கடிதங்களில் இவ்வாறு எழுதினாள்: “உபவாசம் ஒன்றை அறிவித்து, நாபோத்தை மக்களுக்கு முன்பாக[a] அமரச் செய்யுங்கள்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “மக்களின் தலைப்பகுதியில்.” இது மக்களின் முன்னிலையையோ, கூட்டத்தில் முதன்மையான அல்லது அனைவருக்கும் தென்படும் இடத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּכְתֹּב
  choice: அவள் ... எழுதினாள்
  rationale: כתב என்பதன் தொடர்நிலை இறந்தகால மூன்றாம் நபர் பெண்பால் ஒருமை வடிவம்; சூழலில் செய்பவர் யேசபேல். தமிழில் பெண்பால் எழுவாயை வெளிப்படையாகக் காட்டுகிறது.
- source_word: בַּסְּפָרִים
  choice: அந்தக் கடிதங்களில்
  rationale: இங்கு ספרים என்பது நவீன பொருளிலான புத்தகங்களை அல்ல, நகரத் தலைவர்களுக்கு அனுப்பப்பட்ட கடிதங்களைக் குறிக்கிறது. முன்சூழலில் குறிப்பிடப்பட்ட கடிதங்கள் என்பதால் ‘அந்தக் கடிதங்களில்’ இயல்பானது.
- source_word: לֵאמֹר
  choice: இவ்வாறு
  rationale: மேற்கோளை அறிமுகப்படுத்தும் எபிரெய வழக்கை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: קִרְאוּ צוֹם
  choice: உபவாசம் ஒன்றை அறிவித்து
  rationale: பொதுமக்கள் கடைப்பிடிக்க வேண்டிய உபவாசத்தை அதிகாரப்பூர்வமாகப் பிரகடனம் செய்வதே இக்கட்டளையின் பொருள். பன்மைக் கட்டளையின் தொடர் தமிழில் ‘அறிவித்து’ என இயல்பாக இணைக்கப்படுகிறது.
- source_word: וְהוֹשִׁיבוּ
  choice: அமரச் செய்யுங்கள்
  rationale: ישב என்பதன் ஹிஃபில் பன்மைக் கட்டளை வடிவத்தின் காரணவினைப் பொருளைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: אֶת נָבוֹת
  choice: நாபோத்தை
  rationale: நேரடி செயப்படுபொருளான இயற்பெயர் தமிழில் வழக்கமான ஒலிபெயர்ப்புடனும் வேற்றுமை உருபுடனும் தரப்பட்டுள்ளது.
- source_word: בְּרֹאשׁ הָעָם
  choice: மக்களுக்கு முன்பாக
  rationale: சொல்லுக்குச் சொல் ‘மக்களின் தலைப்பகுதியில்’ என்றாலும், கூட்டத்தில் அனைவருக்கும் தென்படும் முன் அல்லது முதன்மையான இடத்தைக் குறிக்கலாம். ‘மக்களுக்கு முன்பாக’ இயல்பான தமிழாக இருந்து இடத்தின் வெளிப்படையான தன்மையைத் தெரிவிக்கிறது; துல்லியமான சமூக நிலையை அடிக்குறிப்பு திறந்துவைக்கிறது.
