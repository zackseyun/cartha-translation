base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/002.yaml
  text: And Ahab spoke to Naboth[a], saying, “Give me your vineyard, so that it may become a vegetable garden for me, because it is near my house; and in its place I will give you a better vineyard than it. Or, if it seems good in your eyes, I will give you its price in silver.”
translation:
  language: ta
  text: ஆகாப் நாபோத்திடம், “உன் திராட்சைத்தோட்டம் என் வீட்டுக்கு அருகில் இருப்பதால், அதை எனக்குக் கொடு; அது எனக்குக் காய்கறித் தோட்டமாக இருக்கட்டும். அதற்குப் பதிலாக, அதைவிடச் சிறந்த ஒரு திராட்சைத்தோட்டத்தை உனக்குத் தருவேன். அல்லது, அது உன் பார்வைக்கு நல்லதாக இருந்தால்[a], அதற்குரிய விலையை வெள்ளியாக உனக்குத் தருவேன்” என்று சொன்னான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில், “அது உன் கண்களில் நல்லதாக இருந்தால்”; இது “அது உனக்கு ஏற்றதாக இருந்தால்” அல்லது “நீ அதை ஒப்புக்கொண்டால்” என்று பொருள்படும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר אַחְאָב אֶל נָבוֹת לֵאמֹר
  choice: ஆகாப் நாபோத்திடம் … என்று சொன்னான்
  rationale: דבר + אֶל என்பது ஒருவரிடம் உரையாடுவதைக் குறிக்கிறது; தமிழில் மேற்கோள் உரையுடன் ‘என்று சொன்னான்’ இயல்பாகவும் மூலத்தின் உரையாடல் அறிமுகத்துக்கு உண்மையாகவும் உள்ளது.
- source_word: תְּנָה לִּי אֶת כַּרְמְךָ
  choice: உன் திராட்சைத்தோட்டத்தை எனக்குக் கொடு
  rationale: நேரடியான கட்டளையையும், כֶּרֶם என்பதன் வழக்கமான பொருளான திராட்சைத்தோட்டத்தையும் தெளிவாகக் காக்கிறது.
- source_word: וִיהִי לִי לְגַן יָרָק
  choice: அது எனக்குக் காய்கறித் தோட்டமாக இருக்கட்டும்
  rationale: היה வடிவிலுள்ள நோக்கம்/விருப்ப நுணுக்கத்தையும், גַן יָרָק என்பதன் பயிரிடும் தோட்டப் பொருளையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: כִּי הוּא קָרוֹב אֵצֶל בֵּיתִי
  choice: அது என் வீட்டுக்கு அருகில் இருப்பதால்
  rationale: כִּי தரும் காரணத் தொடர்பையும் இட நெருக்கத்தையும் தெளிவாகக் காட்டுகிறது.
- source_word: וְאֶתְּנָה לְךָ תַּחְתָּיו
  choice: அதற்குப் பதிலாக … உனக்குத் தருகிறேன்
  rationale: תַּחְתָּיו இங்கு மாற்றீடு அல்லது பரிமாற்றத்தைக் குறிக்கிறது; ‘அதற்குப் பதிலாக’ அதனை இயல்பாகக் காக்கிறது.
- source_word: כֶּרֶם טוֹב מִמֶּנּוּ
  choice: அதைவிடச் சிறந்த ஒரு திராட்சைத்தோட்டம்
  rationale: מן உடன் வரும் ஒப்பீட்டுப் பொருளைத் துல்லியமாக வெளிப்படுத்துகிறது.
- source_word: אִם טוֹב בְּעֵינֶיךָ
  choice: அது உன் பார்வைக்கு நல்லதாக இருந்தால்
  rationale: எபிரெய மொழியின் உருவகச் சொல்லாட்சியைத் தமிழில் புரியக்கூடிய வடிவில் காக்கிறது; வெறும் ‘நீ விரும்பினால்’ என்று பொருளைச் சுருக்கவில்லை.
- source_word: כֶּסֶף מְחִיר זֶה
  choice: அதன் விலையை வெள்ளியாக
  rationale: כֶּסֶף என்பதன் ‘வெள்ளி’ பொருளையும், מְחִיר என்பதன் விலை/ஈட்டுத்தொகைப் பொருளையும் நேரடியாகக் காக்கிறது.
