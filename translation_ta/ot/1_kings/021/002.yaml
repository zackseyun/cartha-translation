translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. அரசனின் கோரிக்கையின் நேரடித்தன்மையும், நிலப் பரிமாற்றம் அல்லது வெள்ளிக் கட்டணம் என்ற இரு மாற்றுகளும் அப்படியே காக்கப்பட்டுள்ளன. ஆங்கில ஆலோசனை உரையில் [a] குறி ‘நாபோத்’ என்பதற்குப் பின் இருந்தாலும், அதன் அடிக்குறிப்பு אִם טוֹב בְּעֵינֶיךָ என்ற மரபுத்தொடரை விளக்குவதால், தமிழில் அந்தச் சொற்றொடருக்குப் பின்னர் சரியாக வைக்கப்பட்டுள்ளது.
