base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/013.yaml
  text: Then the two worthless men came in and sat opposite him[a], and the worthless men testified against Naboth before the people, saying, “Naboth cursed God and the king.” So they brought him outside the city and stoned him with stones[b], and he died.
translation:
  language: ta
  text: அப்பொழுது அந்த இரண்டு தீய மனிதர்கள் வந்து, அவனுக்கு எதிரே உட்கார்ந்தார்கள்[a]. அந்தத் தீய மனிதர்கள் மக்கள் முன்னிலையில் நாபோத்துக்கு எதிராகச் சாட்சி சொல்லி, “நாபோத் கடவுளையும் அரசனையும் சபித்தான்[b]” என்றார்கள். பிறகு அவர்கள் அவனை நகரத்துக்கு வெளியே கொண்டுபோய், கற்களால் எறிந்தார்கள்; அவன் இறந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில் நேரடியாக, “பெலியாலின் மகன்கள்” அல்லது “பெலியாலின் மனிதர்கள்”; இது ஒழுக்கங்கெட்ட அல்லது தீய மனிதர்களைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: எபிரேயத்தில் நேரடியாக, “ஆசீர்வதித்தான்.” இங்கு அது “சபித்தான்” என்பதற்காகப் பயன்படுத்தப்பட்ட மரியாதை நிமித்தமான மறைமுகச் சொல்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי בְלִיַּעַל / אַנְשֵׁי הַבְּלִיַּעַל
  choice: கொடியவர்கள்
  rationale: இந்த எபிரேய மரபுத்தொடர் உயிரியல் வழித்தோன்றலை அல்ல, ஒழுக்கக்கேடும் சட்டமீறலும் உடைய மனிதர்களைக் குறிக்கிறது. நவீன தமிழில் ‘கொடியவர்கள்’ சூழலுக்கேற்ற இயல்பான சொல்லாக இருந்து அவர்களின் தீய தன்மையைத் தெளிவாகக் காட்டுகிறது.
- source_word: נֶגְדּוֹ
  choice: அவனுக்கு எதிரே
  rationale: நாபோத்தை நோக்கி எதிரில் அமர்ந்த இடநிலையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וַיְעִדֻהוּ
  choice: நாபோத்துக்கு எதிராகச் சாட்சி சொல்லி
  rationale: இங்கு עוּד என்பதன் ஹிஃபீல் வடிவம் நீதிமுறைச் சாட்சியத்தைக் குறிக்கிறது; வெறும் குற்றச்சாட்டைவிட ‘எதிராகச் சாட்சி சொல்லுதல்’ மூலத்தின் சட்டச் சூழலைப் பாதுகாக்கிறது.
- source_word: נֶגֶד הָעָם
  choice: மக்கள் முன்னிலையில்
  rationale: குற்றச்சாட்டு பொதுமக்கள் முன்னே வெளிப்படையாகக் கூறப்பட்டதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: בֵּרַךְ
  choice: சபித்தான்
  rationale: சொல்லின் நேரடிப் பொருள் ‘ஆசீர்வதித்தான்’ என்றாலும், இங்கு கடவுளை நிந்தித்ததாகச் சாட்டப்படும் குற்றத்தில் மரியாதை நிமித்தமான இடக்கரடக்கலாக ‘சபித்தான்’ என்ற பொருளில் வருகிறது. உண்மையான சூழற்பொருள் முதன்மை உரையில் தரப்பட்டு, நேரடிப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: אֱלֹהִים
  choice: கடவுளை
  rationale: இஸ்ரவேலிய நீதிச் சூழலில் இது பன்மைக் கடவுள்களை அல்ல, இஸ்ரவேலின் கடவுளையே குறிக்கிறது.
- source_word: וָמֶלֶךְ
  choice: அரசனையும்
  rationale: இணைப்புச்சொல்லும் வேற்றுமையும், சபிக்கப்பட்டதாகக் கூறப்படும் இரண்டாவது நபர் அரசன் என்பதைத் தெளிவாகக் காட்டுகின்றன.
- source_word: וַיֹּצִאֻהוּ מִחוּץ לָעִיר
  choice: அவனை நகரத்துக்கு வெளியே கொண்டுபோய்
  rationale: மரணதண்டனை நிறைவேற்றுவதற்காக நாபோத் நகரத்திற்கு வெளியே அழைத்துச் செல்லப்பட்டதைத் தெளிவாகவும் இயல்பாகவும் சொல்கிறது.
- source_word: וַיִּסְקְלֻהוּ בָאֲבָנִים וַיָּמֹת
  choice: கற்களால் எறிந்து கொன்றார்கள்
  rationale: எபிரேயத்தில் ‘கற்களால் எறிந்தார்கள்; அவன் இறந்தான்’ என்று நிகழ்வும் விளைவும் தொடராக வருகின்றன. தமிழில் ‘கற்களால் எறிந்து கொன்றார்கள்’ என்பது செயலின் உயிர்க்கொல்லும் விளைவைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: தேவநிந்தைக் குற்றச்சாட்டில் வரும் בֵּרַךְ என்ற இடக்கரடக்கலை மொழிபெயர்த்தல்
  choice: முதன்மை உரையில் சூழற்பொருளின்படி ‘சபித்தான்’ என்று மொழிபெயர்த்தல்
  alternative: ‘ஆசீர்வதித்தான்’ என்று நேரடியாக மொழிபெயர்த்து, அது ‘சபித்தான்’ என்பதற்கான இடக்கரடக்கல் என்று அடிக்குறிப்பில் விளக்குதல்
  rationale: குற்றச்சாட்டின் உண்மையான பொருள் நாபோத் கடவுளையும் அரசனையும் சபித்தான் என்பதே. ‘ஆசீர்வதித்தான்’ என்று மட்டும் தருவது நவீன வாசகரைத் தவறாக வழிநடத்தும்; ஆகவே பொருள் முதன்மை உரையிலும், எபிரேயத்தின் நேரடி வடிவம் அடிக்குறிப்பிலும் தரப்படுகிறது.
translation_notes:
  register: நவீன தரமான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. நீதிமுறைச் சூழலைக் காட்ட ‘எதிராகச் சாட்சி சொல்லி’ என்பதும், அரசியல் பதவிக்குப் பொதுவான ‘அரசன்’ என்பதும் தேர்ந்தெடுக்கப்பட்டுள்ளன. இரு அடிக்குறிப்பு சுட்டிகளும் உரையில் பொருத்தமான இடங்களில் இடம்பெற்றுள்ளன.
