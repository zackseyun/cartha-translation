base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/010.yaml
  text: And seat two worthless men opposite him[a], and let them testify against him, saying, ‘You have cursed God and the king.’ Then bring him out and stone him, so that he dies.
translation:
  language: ta
  text: 'இரண்டு கயவர்களை அவனுக்கு எதிரே அமர்த்தி, அவர்கள் அவனுக்கு எதிராகச் சாட்சி சொல்லட்டும்: “நீ கடவுளையும் அரசனையும் சபித்தாய்[a].” பிறகு அவனை வெளியே கொண்டுபோய்க் கல்லெறிந்து கொல்லுங்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் சொல்லுக்கு நேராக, “நீ கடவுளையும் அரசனையும் ஆசீர்வதித்தாய்.” இங்கே “ஆசீர்வதித்தாய்” என்பது “சபித்தாய்” என்பதைக் குறிக்கும் மரியாதைநிமித்த மறைசொல்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹשִׁיבוּ
  choice: உட்காரவைத்து
  rationale: ישׁב என்பதன் ஹிஃபில் வடிவம் ஒருவரை உட்காரச் செய்வதைக் குறிக்கிறது; தமிழில் காரணவினைத் தன்மையை இயல்பாகப் பாதுகாக்கிறது.
- source_word: שְׁנַיִם אֲנָשִׁים
  choice: மனிதர்கள் இருவரை
  rationale: எபிரெய மூலத்தில் ஆண்களைக் குறிக்கும் சொல் இருந்தாலும், இச்சட்டச் சூழலில் இரு சாட்சிகள் என்பதே மையம்; இத்தொடர் எண்ணிக்கையையும் நபர்களையும் தெளிவாகக் காட்டுகிறது.
- source_word: בְּנֵי בְלִיַּעַל
  choice: பயனற்ற மனிதர்கள்
  rationale: இது ஒழுக்கக்கேடான, நேர்மையற்ற ஆட்களைக் குறிக்கும் எபிரெய மரபுத்தொடர்; பிற்காலத்தில் உருவான தனிப்பெயர் அல்லது பேயியல் கருத்தை இங்கு புகுத்தாமல் அதன் கண்டனத் தொனியைப் பாதுகாக்கிறது.
- source_word: נֶגְדּוֹ
  choice: அவனுக்கு எதிரே
  rationale: நாபோத்தை நேருக்கு நேர் எதிர்கொள்ளும் வகையில் அமர்த்தப்படுவதைச் சுட்டுகிறது; விசாரணைச் சூழலுக்கு ஏற்ற இயல்பான தமிழ்.
- source_word: וִיעִדֻהוּ
  choice: அவனுக்கு எதிராகச் சாட்சி சொல்லச் செய்யுங்கள்
  rationale: עוד என்பதன் ஹிஃபில் சட்டச் சூழலில் சாட்சி கூறுதல் என்ற பொருள் தருகிறது; எதிரான சாட்சியையும் காரணவினைத் தன்மையையும் வெளிப்படுத்துகிறது.
- source_word: בֵּרַכְתָּ
  choice: சபித்தாய்
  rationale: ברך என்பதன் சொற்பொருள் ‘ஆசீர்வதித்தாய்’ என்றாலும், கடவுள் பொருளாக வரும் இச்சூழலில் அது மரியாதைநிமித்தமான மறைசொல்லாக ‘சபித்தாய்’ என்று பொருள்படுகிறது.
- source_word: אֱלֹהִים
  choice: கடவுளை
  rationale: அரசனுடன் இணைத்துக் கூறப்படும் இந்தக் குற்றச்சாட்டில் ஒருமையான இஸ்ரவேலின் கடவுளே குறிக்கப்படுகிறார்.
- source_word: וָמֶלֶךְ
  choice: அரசனையும்
  rationale: கடவுளுக்கு எதிரான குற்றத்தோடு அரச அதிகாரத்திற்கு எதிரான குற்றத்தையும் நேரடியாக இணைக்கிறது.
- source_word: וְהוֹצִיאֻהוּ
  choice: அவனை வெளியே கொண்டுபோய்
  rationale: வினைச்சொல் ஒருவரை வெளியே கொண்டுசெல்வதைக் குறிக்கிறது; மரணதண்டனை நடைபெறும் இடத்திற்குக் கொண்டுபோவதை இயல்பாகத் தெரிவிக்கிறது.
- source_word: וְסִקְלֻהוּ
  choice: கல்லெறிந்து
  rationale: கற்களால் தாக்கி நிறைவேற்றப்படும் சட்டரீதியான மரணதண்டனையைத் துல்லியமாகக் குறிக்கிறது.
- source_word: וְיָמֹת
  choice: கொல்லுங்கள்
  rationale: சொல்லுக்கு நெருக்கமாக ‘அவன் சாகட்டும்’ என்றாலும், தொடரின் முடிவான நோக்கம் கல்லெறிதலால் அவன் இறப்பதே; தமிழில் ‘கல்லெறிந்து கொல்லுங்கள்’ என்பது இயல்பாகவும் தெளிவாகவும் விளங்குகிறது.
theological_decisions:
- issue: கடவுளைச் சார்ந்த בֵּרַכְתָּ என்ற சொல்லின் மரியாதைநிமித்த மறைபொருள்
  choice: முதன்மை உரையில் ‘சபித்தாய்’ என்று மொழிபெயர்த்தல்
  alternative: சொல்லுக்கு நேராக ‘ஆசீர்வதித்தாய்’ என்று மொழிபெயர்த்து அடிக்குறிப்பில் விளக்குதல்
  rationale: போலியாகச் சுமத்தப்படும் மரணதண்டனைக்குரிய குற்றச்சாட்டு கடவுளையும் அரசனையும் சபித்ததாகும். ‘ஆசீர்வதித்தாய்’ என்று முதன்மை உரையில் இடுவது சூழலின் பொருளைத் தவறாக உணர்த்தும்; ஆயினும் எபிரெய சொல்லின் நேர்பொருள் அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்படுகிறது.
- issue: בְּנֵי בְלִיַּעַל என்ற மரபுத்தொடரின் பொருள்
  choice: ‘பயனற்ற மனிதர்கள்’
  alternative: ‘பெலியாலின் மகன்கள்’ அல்லது ‘கயவர்கள்’
  rationale: இங்கு இத்தொடர் ஊழலான, நேர்மையற்ற மனிதர்களைக் குறிக்கிறது; அதைத் தனிப்பெயராக வழங்குவது பிற்காலப் பேயியல் தொடர்பை தேவையின்றிப் புகுத்தக்கூடும்.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் வகையிலும் வேதாகம வரலாற்றுரைக்கு ஏற்ற கண்ணியமான தொனியிலும் வடிவமைக்கப்பட்டது. நீதிமன்றச் சூழலின் சாட்சிமொழியும் கட்டளைகளின் வலிமையும் பாதுகாக்கப்பட்டுள்ளன.
