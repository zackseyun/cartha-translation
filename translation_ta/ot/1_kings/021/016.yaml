base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/016.yaml
  text: And when Ahab heard that Naboth was dead[a], Ahab arose to go down to the vineyard of Naboth the Jezreelite[b], to take possession of it.
translation:
  language: ta
  text: நாபோத் இறந்துவிட்டான்[a] என்று ஆகாப் கேள்விப்பட்டபோது, ஆகாப் யிஸ்ரயேலியனான நாபோத்தின் திராட்சைத்தோட்டத்தைத் தன் உடைமையாக்கிக்கொள்ளுவதற்காக[b] எழுந்து இறங்கிச் சென்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இறந்திருந்தான்.’ எபிரெய வினைச்சொல் நிறைவுற்ற மரண நிகழ்வையோ அதன் விளைவான நிலையையோ இங்கே குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அதை உடைமையாக வைத்துக்கொள்ள’ அல்லது ‘அதைச் சுதந்தரித்துக்கொள்ள.’ எபிரெய வினைச்சொல் சூழலுக்கேற்ப உடைமையாக்குதல், உடைமையாக வைத்திருத்தல், அல்லது சுதந்தரித்தல் ஆகிய பொருள்களைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: கேள்விப்பட்டபோது
  rationale: விவரிப்பின் தொடர்ச்சியையும் כ + infinitive construct குறிக்கும் கால உறவையும் இயல்பான நவீன தமிழில் தருகிறது; தனியாக ‘அப்பொழுது நிகழ்ந்தது’ என்று மொழிபெயர்ப்பது தேவையற்ற விறைப்பை உண்டாக்கும்.
- source_word: כִּי
  choice: என்று
  rationale: ஆகாப் கேள்விப்பட்ட செய்தியின் உள்ளடக்கத்தை அறிமுகப்படுத்துவதால், தமிழில் மேற்கோள்/உள்ளடக்க இணைப்பான ‘என்று’ பொருத்தமானது.
- source_word: מֵת
  choice: இறந்துவிட்டான்
  rationale: מות என்பதன் நிறைவுற்ற நிகழ்வையும் அதனால் ஏற்பட்ட நிலையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘இறந்திருந்தான்’ என்பதும் சாத்தியம்.
- source_word: וַיָּקָם
  choice: எழுந்து
  rationale: קום விவரிப்பில் நோக்கமுள்ள அடுத்த செயலைத் தொடங்குவதைச் சுட்டுகிறது; ‘எழுந்து’ மூலத்தின் வடிவத்தையும் dignified narrative register-ஐயும் காக்கிறது.
- source_word: לָרֶדֶת
  choice: இறங்கிச் சென்றான்
  rationale: ירד-இன் கீழ்நோக்கிய திசை நுணுக்கத்தைக் காக்கும் அதேவேளையில், தமிழில் பயணச் செயலை இயல்பாகத் தெரிவிக்கிறது.
- source_word: כֶּרֶם
  choice: திராட்சைத்தோட்டம்
  rationale: திராட்சைக் கொடிகள் பயிரிடப்படும் தோட்டத்தைக் குறிக்கும் வழக்கமான, தெளிவான தமிழ் இணை.
- source_word: הַיִּזְרְעֵאלִי
  choice: யெஸ்ரயேலியனான
  rationale: நாபோத்தின் ஊர் அல்லது குடியியல் அடையாளத்தைக் குறிக்கும் எபிரெய இன/இடப்பெயரடை வடிவத்தை நேரடியாகப் பிரதிபலிக்கிறது.
- source_word: לְרִשְׁתּוֹ
  choice: அதைக் கைப்பற்றுவதற்காக
  rationale: ירשׁ இச்சூழலில் அந்தத் தோட்டத்தைத் தன் உடைமையாக்கிக் கட்டுப்பாட்டுக்குள் கொண்டுவரும் செயலைக் குறிக்கிறது; வினைக்குள் வெளிப்படையாக இல்லாத கூடுதல் வன்முறையைச் சேர்க்கவில்லை.
