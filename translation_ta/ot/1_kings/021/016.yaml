translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான வரலாற்று விவரிப்பு நடை பயன்படுத்தப்பட்டுள்ளது. ‘எழுந்து’ மற்றும் ‘இறங்கிச் சென்றான்’ ஆகியவை மூலத்தின் இயக்க வரிசையைப் பாதுகாக்கின்றன; அடிக்குறிப்புகள் உண்மையான சொற்பொருள் மாற்றுவாய்ப்புகளைத் தெளிவாக வைத்திருக்கின்றன.
