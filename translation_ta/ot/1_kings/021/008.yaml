  edition: WLC
  text: וַ/תִּכְתֹּ֤ב סְפָרִים֙ בְּ/שֵׁ֣ם אַחְאָ֔ב וַ/תַּחְתֹּ֖ם בְּ/חֹתָמ֑/וֹ וַ/תִּשְׁלַ֣ח ה/ספרים אֶל הַ/זְקֵנִ֤ים וְ/אֶל הַֽ/חֹרִים֙ אֲשֶׁ֣ר בְּ/עִיר֔/וֹ הַ/יֹּשְׁבִ֖ים אֶת נָבֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/008.yaml
  text: So she wrote letters in Ahab’s name[a], sealed them with his seal, and sent the letters to the elders and to the nobles who were in his city, who were living with Naboth.
translation:
  language: ta
  text: எனவே அவள் ஆகாபின் பெயரில் கடிதங்களை எழுதி, அவனுடைய முத்திரையால் அவற்றை முத்திரையிட்டு, அவனுடைய நகரத்தில்[a] நாபோத்துடன் குடியிருந்த மூப்பர்களுக்கும் உயர்குடியினருக்கும் அந்தக் கடிதங்களை அனுப்பினாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவனுடைய நகரத்தில்’ என்பது ஆகாபின் நகரத்தையும் குறிக்கலாம். எபிரெய மொழியிலுள்ள உரிமைப் பின்னொட்டு நாபோத்தையோ ஆகாபையோ குறிக்கக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּכְתֹּב
  choice: எனவே அவள் ... எழுதி
  rationale: வாவ் தொடர்வினை கதைநிகழ்வை முன்னெடுக்கிறது; முந்தைய சூழலின் விளைவையும் இயல்பான தமிழ் கதைநடையையும் ‘எனவே’ வெளிப்படுத்துகிறது. பெண்பால் ஒருமை எழுவாய் சூழலிலுள்ள யெசபேலைக் குறிக்கிறது.
- source_word: סְפָרִים / הַסְּפָרִים
  choice: கடிதங்கள் / அந்தக் கடிதங்கள்
  rationale: சֵפֶר என்பது எழுதப்பட்ட ஆவணத்தைக் குறிக்கலாம்; இங்கு நகரத் தலைவர்களுக்கு அனுப்பப்பட்ட அதிகாரபூர்வ தகவல் என்பதால் ‘கடிதங்கள்’ இயல்பும் துல்லியமும் உடையது.
- source_word: בְּשֵׁם אַחְאָב
  choice: ஆகாபின் பெயரில்
  rationale: ஆகாபின் அதிகாரத்தைப் பிரதிநிதித்துவப்படுத்தி செயல்பட்டதை இந்த எபிரெய மரபுத்தொடர் குறிக்கிறது; ‘பெயரில்’ அதனை நேரடியாகப் பாதுகாக்கிறது.
- source_word: וַתַּחְתֹּם בְּחֹתָמוֹ
  choice: அவனுடைய முத்திரையால் அவற்றுக்கு முத்திரையிட்டு
  rationale: חתם மற்றும் חותם இணைவு அதிகாரபூர்வ முத்திரையைக் கொண்டு ஆவணங்களை முத்திரையிடுவதைக் குறிக்கிறது; கருவிப் பொருளும் செயலும் தமிழில் தெளிவாகத் தரப்படுகின்றன.
- source_word: הַזְּקֵנִים
  choice: மூப்பர்கள்
  rationale: நகரின் மூத்த குடிமைத் தலைவர்களைக் குறிக்கும் வழக்கமான வேதாகமத் தமிழ்ச் சொல்; தொடர்ந்து வரும் இடக்குறிப்பு உள்ளூர் சூழலை விளக்குகிறது.
- source_word: הַחֹרִים
  choice: உயர்குடியினர்
  rationale: חֹרִים உயர்ந்த சமூக நிலையும் செல்வாக்கும் கொண்டவர்களைக் குறிக்கிறது; ‘உயர்குடியினர்’ அதை நவீனத் தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: אֲשֶׁר בְּעִירוֹ
  choice: அவனுடைய நகரத்தில்
  rationale: மூன்றாம் ஆண்பால் ஒருமை பின்னொட்டைத் தீர்மானிக்காமல் ‘அவனுடைய’ எனத் தக்கவைக்கிறது; அது நாபோத்தையோ ஆகாபையோ குறிக்கக்கூடிய மூலமொழி தெளிவின்மையை அடிக்குறிப்பு விளக்குகிறது.
- source_word: הַיֹּשְׁבִים אֶת נָבוֹת
  choice: நாபோத்துடன் ... குடியிருந்த
  rationale: ישב உடன் வரும் אֶת, ஒருவருடன் அல்லது அவரருகில் வசிப்பதைக் குறிக்கிறது; ‘குடியிருந்த’ பங்கேற்புவினையின் நீடித்த குடியிருப்பு உணர்வைக் காக்கிறது.
theological_decisions:
- issue: בְּעִירוֹ என்பதிலுள்ள ஆண்பால் ஒருமை உரிமைப் பின்னொட்டின் குறிப்பு
  choice: முதன்மை வாசிப்பில் ‘அவனுடைய நகரம்’ என்பது நாபோத்தின் நகரத்தைக் குறிக்கிறது
  alternative: ‘அவனுடைய நகரம்’ என்பது ஆகாபின் நகரத்தைக் குறிக்கலாம்
  rationale: ‘நாபோத்துடன் குடியிருந்தவர்கள்’ என்ற உடனடியான தொடரும் உள்ளூர் தலைவர்களைக் குறிக்கும் சூழலும் நாபோத்தைச் சார்ந்த வாசிப்பை ஆதரிக்கின்றன. ஆயினும் ஆகாபின் பெயர் முன்னதாக வருவதால் ஆகாபைக் குறிக்கும் வாய்ப்பும் உண்மையான இலக்கணத் தெளிவின்மையாக உள்ளது; ஆகவே மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘மூப்பர்கள்’, ‘உயர்குடியினர்’, ‘முத்திரை’ ஆகியவை வரலாற்று-நிர்வாகச் சூழலை எளிதில் புரியுமாறு தருகின்றன. மூலத்தின் நீண்ட ஒருங்கிணைந்த வாக்கிய அமைப்பு தமிழில் வாசிக்கத்தக்க வகையில் காக்கப்பட்டுள்ளது; [a] குறி தெளிவின்மை தொடர்புடைய ‘உயர்குடியினருக்கும்’ என்பதற்குப் பின் வைக்கப்பட்டுள்ளது.
