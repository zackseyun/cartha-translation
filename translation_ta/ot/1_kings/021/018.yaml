  register: நவீன தரத் தமிழில் இயல்பானதும் கண்ணியமானதுமான தீர்க்கதரிசனக் கட்டளை நடை பயன்படுத்தப்பட்டுள்ளது. ‘இதோ’ என்ற சொல் மூலத்தின் உடனடிக் கவன ஈர்ப்பைப் பாதுகாக்கிறது. அடிக்குறிப்பு குறியீடு அதனுடன் தொடர்புடைய ‘கைப்பற்றுவதற்காக’ என்பதற்குப் பின்னரே வைக்கப்பட்டுள்ளது.
