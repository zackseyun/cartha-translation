source:
  edition: WLC
  text: ק֣וּם רֵ֗ד לִ/קְרַ֛את אַחְאָ֥ב מֶֽלֶךְ יִשְׂרָאֵ֖ל אֲשֶׁ֣ר בְּ/שֹׁמְר֑וֹן הִנֵּה֙ בְּ/כֶ֣רֶם נָב֔וֹת אֲשֶׁר יָ֥רַד שָׁ֖ם לְ/רִשְׁתּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/018.yaml
  text: Arise[a], go down to meet Ahab king of Israel, who is in Samaria. Look, he is in the vineyard of Naboth, where he has gone down to take possession of it.
translation:
  language: ta
  text: “எழுந்து, சமாரியாவில் இருக்கும் இஸ்ரவேலின் அரசன் ஆகாபைச் சந்திக்க இறங்கிச் செல். இதோ, அவன் நாபோத்தின் திராட்சைத்தோட்டத்தில் இருக்கிறான்; அதைத் தன் உடைமையாக்கிக் கொள்வதற்காக[a] அவன் அங்கே இறங்கிச் சென்றிருக்கிறான்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதை உரிமையாகப் பெறுவதற்காக.” எபிரெய வினைச்சொல் சூழலுக்கு ஏற்ப உடைமையாக்கிக்கொள்ளுதல், உடைமையாக வைத்திருத்தல், அல்லது உரிமையாகப் பெறுதல் ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֣וּם
  choice: எழுந்திரு
  rationale: קום என்பதன் ஒருமை ஆண்பால் கட்டளை வடிவத்தை இயல்பான, நேரடியான தமிழ்க் கட்டளையாகக் கொடுக்கிறது.
- source_word: רֵד
  choice: கீழே போ
  rationale: ירד என்பதிலுள்ள திசை சார்ந்த ‘இறங்கிச் செல்’ என்ற பொருளைப் பேச்சு வழக்காகத் தாழ்த்தாமல் இயல்பான நவீன தமிழில் பாதுகாக்கிறது.
- source_word: לִקְרַאת
  choice: சந்திக்க
  rationale: ஒருவரை எதிர்கொண்டு சந்திக்கச் செல்வதைக் குறிக்கிறது; ‘எதிர்த்து நிற்க’ என்று மொழிபெயர்ப்பது உரையில் வெளிப்படையாக இல்லாத மோதல் நோக்கத்தைச் சேர்த்துவிடும்.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: இஸ்ரவேலின் அரசன்
  rationale: எபிரெயக் கூட்டுநிலை அரசப் பட்டத்தை நேரடியாகவும் தற்போதைய தரமான தமிழிலும் வழங்குகிறது.
- source_word: אֲשֶׁר בְּשֹׁמְרוֹן
  choice: சமாரியாவில் இருக்கும்
  rationale: வினைச்சொல் வெளிப்படையாக இல்லாத எபிரெய உறவுத்தொடரைத் தமிழில் இயல்பாக நிறைவு செய்கிறது; ‘சமாரியாவைச் சேர்ந்த’ என்று நிரந்தர அடையாளமாக மாற்றவில்லை.
- source_word: הִנֵּה
  choice: இதோ
  rationale: கவனத்தை உடனடியாக ஈர்க்கும் எபிரெயச் சுட்டிடைச்சொல்லின் வலிமையையும் கண்ணியமான நடையையும் காக்கிறது.
- source_word: בְּכֶרֶם נָבוֹת
  choice: நாபோத்தின் திராட்சைத்தோட்டத்தில்
  rationale: בְּ குறிக்கும் இடத்தையும் நாபோத்தின் உரிமைத் தொடர்பையும் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר יָרַד שָׁם
  choice: அவன் அங்கே இறங்கிப் போயிருக்கிறான்
  rationale: முன்னர் நிகழ்ந்த இறங்கிச் செல்லுதல் இப்போதைய இருப்புடன் தொடர்புடையது என்பதைத் தமிழ் நிறைவு வினை இயல்பாகக் காட்டுகிறது.
- source_word: לְרִשְׁתּוֹ
  choice: அதைக் கைப்பற்றுவதற்காக
  rationale: ירשׁ இச்சூழலில் திராட்சைத்தோட்டத்தைத் தனது உடைமையாக ஏற்றுக்கொள்வதைக் குறிக்கிறது. ‘கைப்பற்று’ சட்ட-உடைமைச் செயலைத் தெளிவாக்குகிறது; இருப்பினும் வினையின் பொருள் பரப்பை அடிக்குறிப்பு பாதுகாக்கிறது.
