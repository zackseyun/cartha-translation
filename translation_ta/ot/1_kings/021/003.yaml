revisions:
- from: ஆனால் நாபோத் ஆகாபிடம், “யாவே முன்னிலையில், என் தந்தையரின் பரம்பரைச் சொத்தை உமக்குக் கொடுப்பதை என்னால் நினைத்துக்கூடப் பார்க்க முடியாது!” என்றார்.[a]
  to: ஆனால் நாபோத் ஆகாபிடம், “யாவே அதற்கு விலக்குவாராக! என் தந்தையரின் பரம்பரைச் சொத்தை உமக்குக் கொடுப்பதா!” என்றார்.[a]
  rationale: ‘யாவே அதற்கு விலக்குவாராக’ என்பது மூலத்தின் Yahweh-தொடர்புடைய கடுமையான மறுப்பைத் தமிழில் இயல்பாகத் தருகிறது. இறைநாமம், பரம்பரை உரிமை, மற்றும் அரசனுக்குரிய மரியாதை ஆகியவை காக்கப்பட்டுள்ளன. மாற்று வாசகத்தை விளக்கும் குறிப்பு, மூலத்தில் இல்லாத ‘காப்பாராக’ என்ற செயலைச் சேர்க்காமல் திருத்தப்பட்டுள்ளது.
