base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/003.yaml
  text: But Naboth said to Ahab[a], “Far be it from me by Yahweh to give you the inheritance of my fathers.”
translation:
  language: ta
  text: ஆனால் நாபோத் ஆகாபிடம், “யாவே அதற்கு விலக்குவாராக! என் தந்தையரின் பரம்பரைச் சொத்தை உமக்குக் கொடுப்பதா!” என்றார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “யாவேயிடமிருந்து அது எனக்குத் தூரமாக இருக்கட்டும்; என் தந்தையரின் பரம்பரைச் சொத்தை உமக்குக் கொடுப்பது” என்று உள்ளது. இது கடுமையான மறுப்பைக் குறிக்கும் மரபுத்தொடர்.
    reason: חָלִילָה לִּי מֵיהוָה என்ற எபிரெய மரபுத்தொடரின் சொற்சொல்லான அமைப்பையும் அதன் மறுப்பின் வலிமையையும் விளக்குகிறது.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ஆனால் ... என்றார்
  rationale: தொடர்கதை இணைப்பான waw நிகழ்வை முன்னெடுத்தாலும், முந்தைய வசனத்தில் ஆகாப் வைத்த முன்மொழிவுக்கு நாபோத் தெரிவிக்கும் எதிர்ப்பைத் தமிழில் இயல்பாக வெளிப்படுத்த ‘ஆனால்’ பொருத்தமானது.
- source_word: נָבוֹת אֶל־אַחְאָב
  choice: நாபோத் ஆகாபிடம்
  rationale: ஆட்பெயர்கள் தமிழில் ஒலிபெயர்க்கப்பட்டன; אֶל குறிக்கும் உரையாடலின் முகவரி ‘ஆகாபிடம்’ என இயல்பாகத் தரப்பட்டது.
- source_word: חָלִילָה לִּי מֵיהוָה
  choice: யாவே முன்னிலையில் ... என்னால் நினைத்துக்கூடப் பார்க்க முடியாது
  rationale: இந்த எபிரெய மரபுத்தொடர் கடும் மறுப்பையும் இறைவனோடு தொடர்புடைய மனச்சாட்சிக் கட்டுப்பாட்டையும் தெரிவிக்கிறது. தமிழில் சொற்சொல்லான, தெளிவற்ற அமைப்பைத் தவிர்த்து அதன் வலிமையைப் பாதுகாக்கும் இயல்பான வடிவம் தேர்ந்தெடுக்கப்பட்டது; ‘யாவே தடைசெய்வாராக’ என்று மூலத்தில் இல்லாத நேரடி வினையைச் சேர்க்கவில்லை.
- source_word: מִתִּתִּי
  choice: கொடுப்பதை
  rationale: மறுக்கப்படும் செயலைத் தமிழில் பெயரெச்ச வினைப்பெயர் அமைப்பாக இயல்பாகக் காட்டுகிறது.
- source_word: נַחֲלַת אֲבֹתַי
  choice: என் தந்தையரின் பரம்பரைச் சொத்து
  rationale: נַחֲלָה என்பது பொதுவான சொத்து மட்டுமல்ல, தலைமுறை வழியாக வந்த குடும்ப உரிமை நிலத்தைக் குறிக்கிறது. ‘பரம்பரைச் சொத்து’ அதன் சட்ட மற்றும் குடும்பத் தொடர்பைத் தெளிவாகக் காக்கிறது; אֲבֹתַי என்பதற்கு ‘தந்தையர்’ என ஆண்பால் பன்மை பேணப்பட்டது.
- source_word: לָךְ
  choice: உமக்கு
  rationale: அரசனிடம் பேசும் சூழலுக்கு ஏற்ற மரியாதையான ஒருமை வடிவம்; எபிரெய மறைமுகச் செயப்படுபொருளைத் துல்லியமாகக் காட்டுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் உடன்படிக்கைக்குரிய தனிப்பெயரான நான்கெழுத்து இறைப்பெயர் நேரடியாக உள்ளது. அதை பொதுப்பட்டமான ‘ஆண்டவர்’ என்று மாற்றாமல் தமிழில் ஒலிபெயர்த்தது.
- issue: חָלִילָה לִּי מֵיהוָה என்ற மரபுத்தொடரின் பொருள்
  choice: யாவே முன்னிலையில் ... என்னால் நினைத்துக்கூடப் பார்க்க முடியாது
  alternative: யாவே இதைத் தடைசெய்வாராக
  rationale: இந்தச் சொற்றொடர் நாபோத்தின் கடும் மறுப்பை யாவேயுடனான உறவின் அடிப்படையில் தெரிவிக்கிறது. ‘தடைசெய்வாராக’ என்பது இயல்பான விளக்கமாயினும், மூலத்தில் வெளிப்படையாக இல்லாத இறைச் செயலைச் சேர்க்கும்; தேர்ந்த வடிவம் அந்த இறையியல் தொடர்பையும் மூலத்தின் ஓரளவு திறந்த தன்மையையும் காக்கிறது.
translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, எளிதில் புரியும் ஆனால் கண்ணியமான நடை பயன்படுத்தப்பட்டது. அரசனிடம் உரையாடுவதால் ‘உமக்கு’ என்ற மரியாதை ஒருமை தேர்ந்தெடுக்கப்பட்டது. வாக்கியத்தின் வியப்புக்குறி நாபோத்தின் கடுமையான மறுப்பை வெளிப்படுத்துகிறது.
