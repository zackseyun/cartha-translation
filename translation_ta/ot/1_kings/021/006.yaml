  text: וַ/יְדַבֵּ֣ר אֵלֶ֗י/הָ כִּֽי אֲ֠דַבֵּר אֶל נָב֨וֹת הַ/יִּזְרְעֵאלִ֜י וָ/אֹ֣מַר ל֗/וֹ תְּנָ/ה לִּ֤/י אֶֽת כַּרְמְ/ךָ֙ בְּ/כֶ֔סֶף א֚וֹ אִם חָפֵ֣ץ אַתָּ֔ה אֶתְּנָה לְ/ךָ֥ כֶ֖רֶם תַּחְתָּ֑י/ו וַ/יֹּ֕אמֶר לֹֽא אֶתֵּ֥ן לְ/ךָ֖ אֶת כַּרְמִֽ/י־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/006.yaml
  text: And he spoke to her, because I spoke to Naboth the Jezreelite and said to him, ‘Give me your vineyard for silver, or, if you prefer, I will give you a vineyard in place of it,’ but he said, ‘I will not give you my vineyard.’
translation:
  language: ta
  text: அவன் அவளிடம், “நான் யிஸ்ரயேலைச் சேர்ந்த நாபோத்திடம் பேசி, ‘உன் திராட்சைத்தோட்டத்தை வெள்ளிக்காக எனக்குக் கொடு; அல்லது உனக்கு விருப்பமானால், அதற்குப் பதிலாக ஒரு திராட்சைத்தோட்டத்தை உனக்குக் கொடுப்பேன்’ என்று சொன்னேன். ஆனால் அவன், ‘என் திராட்சைத்தோட்டத்தை உனக்குக் கொடுக்கமாட்டேன்’ என்றான்” என்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: காரணம் இதுதான்
  rationale: இங்கு அரசன் தன் மனவருத்தத்திற்கான காரணத்தை விளக்குகிறான். எபிரேய இணைப்புச்சொல்லின் காரணப் பொருளைத் தக்கவைத்தபடி, தமிழில் இயல்பாக முழுமையான தொடக்கமாக அமைக்கப்பட்டது.
- source_word: הַיִּזְרְעֵאלִי
  choice: யிஸ்ரயேலைச் சேர்ந்த
  rationale: நாபோத்தின் ஊர்சார் அடையாளத்தை நவீனத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: בְּכֶסֶף
  choice: வெள்ளிக்கு
  rationale: כֶּסֶף என்பதன் நேரடிப் பொருள் ‘வெள்ளி’; பொதுவான ‘பணம்’ என்று மாற்றாமல் பண்டைய பரிமாற்ற முறையின் மொழியைப் பாதுகாக்கிறது.
- source_word: כֶרֶם
  choice: திராட்சைத்தோட்டம்
  rationale: சூழலில் குறிப்பாக திராட்சை பயிரிடும் தோட்டத்தைக் குறிக்கும் நிலையான, எளிதில் புரியும் தமிழ் சொல்.
- source_word: תַּחְתָּיו
  choice: அதற்குப் பதிலாக
  rationale: மாற்றீட்டைக் குறிக்கும் எபிரேயச் சொல்லின் உறவுப்பொருளை இயல்பான தமிழில் தருகிறது.
