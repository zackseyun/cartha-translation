translation_notes:
  register: நவீன நிலையான தமிழில், அரசரின் விளக்கத்தையும் இரட்டை நேரடி மேற்கோள்களையும் தெளிவாகப் பிரிக்கும் வகையில் வடிவமைக்கப்பட்டது. மொழிநடை கண்ணியமானதும் பொதுவாசகர்களுக்கு எளிதானதும் ஆகும்; மூலத்தின் காரணவிளக்கத் தன்மை பாதுகாக்கப்பட்டுள்ளது.
