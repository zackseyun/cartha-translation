lexical_decisions:
- source_word: קָרְאוּ
  choice: அறிவித்து
  rationale: צוֹם என்பதுடன் வரும் קרא, பொதுமக்கள் கடைப்பிடிக்க வேண்டிய உபவாசத்தை அதிகாரப்பூர்வமாக அறிவிப்பதைக் குறிக்கிறது.
- source_word: צוֹם
  choice: ஓர் உபவாசத்தை
  rationale: இது தனிப்பட்ட உண்ணாமையைக் காட்டிலும் பொதுவாக அறிவிக்கப்பட்ட முறையான உபவாசத்தைக் குறிக்கிறது.
- source_word: וְהֹשִׁיבוּ
  choice: அமரச்செய்தார்கள்
  rationale: ישב என்பதன் ஹிஃபில் வடிவம் ஒருவரை ஒரு குறிப்பிட்ட இடத்தில் அமரச் செய்வதைக் குறிக்கிறது; தமிழில் இச்சொல் காரணவினைப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: אֶת נָבוֹת
  choice: நாபோத்தை
  rationale: אֶת நேரடிச் செயப்படுபொருளைக் குறிக்கிறது; நָבוֹת என்ற பெயர் நவீனத் தமிழில் இயல்பாக ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: בְּרֹאשׁ
  choice: தலைமையிடத்தில்
  rationale: எபிரெயச் சொற்றொடர் எழுத்துப்படியே ‘தலையில்/தலைப்பகுதியில்’ எனினும், இச்சூழலில் மக்களிடையே முதன்மையான அல்லது முன்னிலையான இடத்தைக் குறிக்கிறது. ‘தலைமையிடத்தில்’ மூல உருவகத்தை ஓரளவு காத்து இயல்பான தமிழையும் தருகிறது.
- source_word: הָעָם
  choice: மக்களின்
  rationale: עַם என்பதன் நேரடிப் பொருள் ‘மக்கள்’; இங்கு கூடிவந்த பொதுமக்களையோ குடிமக்கள் கூட்டத்தையோ குறிக்கலாம்.
