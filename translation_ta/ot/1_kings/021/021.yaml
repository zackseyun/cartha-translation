source:
  edition: WLC
  text: הִנְ/נִ֨י מבי אֵלֶ֨י/ךָ֙ רָעָ֔ה וּ/בִעַרְתִּ֖י אַחֲרֶ֑י/ךָ וְ/הִכְרַתִּ֤י לְ/אַחְאָב֙ מַשְׁתִּ֣ין בְּ/קִ֔יר וְ/עָצ֥וּר וְ/עָז֖וּב בְּ/יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/021.yaml
  text: Behold[a], I am bringing disaster upon you, and I will sweep away after you, and I will cut off from Ahab every male, both bond and free in Israel.
translation:
  language: ta
  text: “இதோ, நான் உன்மேல் பேரழிவைக் கொண்டுவருகிறேன்; உனக்குப் பின் வருபவர்களை முற்றிலும் அகற்றிவிடுவேன். இஸ்ரயேலில் ஆகாபைச் சேர்ந்த ஒவ்வொரு ஆணையும்[a]—அடிமையாயினும் சுதந்திரமானவனாயினும்[b]—அறுத்தொழிப்பேன்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்சொல்லாக, “சுவரை நோக்கிச் சிறுநீர் கழிக்கிற ஒவ்வொருவனையும்.” இது ஒவ்வொரு ஆணையும் குறிக்கும் முரட்டுத்தனமான மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயச் சொல் இணை சொற்சொல்லாக, “கட்டுப்படுத்தப்பட்டவனும் விடப்பட்டவனும்” எனப் பொருள்படும். இது அடிமை மற்றும் சுதந்திரமானவர் உட்பட எவரையும் குறிக்கும் முழுமைச் சொற்றொடராகப் பொதுவாகப் புரிந்துகொள்ளப்படுகிறது; அதன் துல்லியமான சமூகப் பொருள் உறுதியற்றது.
    reason: ambiguity
lexical_decisions:
- source_word: הִנְנִי
  choice: இதோ
  rationale: தீர்க்கதரிசன அறிவிப்பின் உடனடித் தன்மையையும் வலிமையையும் இயல்பான, கண்ணியமான தமிழில் தக்கவைக்கிறது.
- source_word: מֵבִיא אֵלֶיךָ רָעָה
  choice: நான் உன்மேல் பேரழிவைக் கொண்டுவருகிறேன்
  rationale: நியாயத்தீர்ப்புச் சூழலில் רָעָה ஒழுக்கத் தீமையை அல்ல, அழிவை உண்டாக்கும் பேரிடர் அல்லது கேட்டைச் சுட்டுகிறது. நிகழ்கால வடிவம் எபிரெய அறிவிப்பின் உடனடி உறுதியைத் தக்கவைக்கிறது.
- source_word: וּבִעַרְתִּי אַחֲרֶיךָ
  choice: உனக்குப் பின்வரும் அனைவரையும் முற்றிலும் அகற்றிவிடுவேன்
  rationale: בּער என்பதன் முற்றாக அகற்றுதல் என்ற வலிமையையும், אַחֲרֶיךָ என்பதன் ‘உனக்குப் பின்’ என்ற அமைப்பையும் காக்கிறது; ‘சந்ததி’ என்று மட்டும் பொருளைச் சுருக்காமல் மனிதர்களைக் குறிக்கும் மறைபொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְהִכְרַתִּי לְאַחְאָב
  choice: ஆகாபைச் சேர்ந்த ... அழித்தொழிப்பேன்
  rationale: לְאַחְאָב என்பதன் உடைமை அல்லது தொடர்புப் பொருளை இயல்பான தமிழில் தருகிறது; כרת என்பதன் முழுமையான ஒழிப்பு உணர்வை ‘அழித்தொழிப்பேன்’ வெளிப்படுத்துகிறது.
- source_word: מַשְׁתִּין בְּקִיר
  choice: ஆண்கள் அனைவரையும்
  rationale: இது ஒவ்வொரு ஆணையும் குறிக்கும் முரட்டுத்தனமான எபிரெய மரபுத்தொடர். தெளிவான பொருள் முதன்மை உரையில் தரப்பட்டு, சொற்சொல் வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וְעָצוּר וְעָזוּב
  choice: கட்டுப்பாட்டில் இருப்பவர்களையும் சுதந்திரமாக இருப்பவர்களையும்
  rationale: சொல் இணையிலுள்ள கட்டுப்படுத்தப்பட்டவர்/விடப்பட்டவர் என்ற எதிர்மறை அமைப்பைத் தக்கவைத்து, எந்த நிலையிலுள்ள ஆணும் தப்பமாட்டான் என்ற முழுமையை நவீன தமிழில் தெரிவிக்கிறது; சொற்றொடரின் துல்லிய நுணுக்கம் உறுதியற்றது என்பதும் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: בְּיִשְׂרָאֵל
  choice: இஸ்ரயேலில்
  rationale: இடத்தைக் குறிக்கும் எபிரெய முன்னிடைச்சொல்லின் நேரான, இயல்பான தமிழ் வடிவம்.
theological_decisions:
- issue: தெய்வீக நியாயத்தீர்ப்பில் רָעָה என்பதன் பொருள்
  choice: பேரழிவு
  alternative: தீமை
  rationale: இங்கு அறிவிக்கப்படுவது ஒழுக்கத் தீமை அல்ல, தண்டனையாக வரும் அழிவு. ‘பேரழிவு’ வசனத்தின் கடுமையைத் தக்கவைத்தபடியே கடவுள் ஒழுக்கத் தீமை செய்கிறார் என்ற தேவையற்ற பொருளைத் தவிர்க்கிறது.
- issue: אַחֲרֶיךָ குறிக்கும் நபர்கள்
  choice: உனக்குப் பின்வரும் அனைவரும்
  alternative: உன் சந்ததியினர்
  rationale: சூழலில் ஆகாபின் வம்சம் குறிக்கப்படுவது தெளிவாயினும், எபிரெயத்தில் ‘சந்ததி’ என்ற பெயர்ச்சொல் வெளிப்படையாக இல்லை. தேர்ந்த வடிவம் வம்சத் தொடர்ச்சியை உணர்த்தியபடியே மூலத்தின் மறைமுகத்தன்மையை ஓரளவு காக்கிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழ்; தீர்க்கதரிசன நியாயத்தீர்ப்பின் கண்ணியமும் கடுமையும் காக்கப்பட்டுள்ளன. அரிதான எபிரெய மரபுத்தொடர்கள் வாசிக்கத் தெளிவாக முதன்மை உரையில் பொருளாக்கப்பட்டு, அவற்றின் சொற்சொல் வடிவமும் உறுதியின்மையும் அடிக்குறிப்புகளில் தரப்பட்டுள்ளன.
