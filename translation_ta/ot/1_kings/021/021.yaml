- from: “இதோ, நான் உன்மேல் பேரழிவைக் கொண்டுவருகிறேன். உனக்குப் பின்வரும் அனைவரையும் முற்றிலும் அகற்றிவிடுவேன். இஸ்ரயேலில் ஆகாபைச் சேர்ந்த ஆண்கள் அனைவரையும்[a]—கட்டுப்பாட்டில் இருப்பவர்களையும் சுதந்திரமாக இருப்பவர்களையும்[b]—அழித்தொழிப்பேன்.”
  to: “இதோ, நான் உன்மேல் பேரழிவைக் கொண்டுவருகிறேன்; உனக்குப் பின் வருபவர்களை முற்றிலும் அகற்றிவிடுவேன். இஸ்ரயேலில் ஆகாபைச் சேர்ந்த ஒவ்வொரு ஆணையும்[a]—அடிமையாயினும் சுதந்திரமானவனாயினும்[b]—அறுத்தொழிப்பேன்.”
  rationale: The revision removes an unnecessary explicit universal from the idiom “after you,” while retaining its contextual reference to Ahab’s continuing line. It also replaces an opaque and potentially misleading status contrast with the conventional, intelligible “bond and free” sense, explicitly noting the Hebrew pair’s uncertainty in the footnote. No doctrinal interpretation is added.
