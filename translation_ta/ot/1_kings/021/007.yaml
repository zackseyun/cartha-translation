  text: וַ/תֹּ֤אמֶר אֵלָי/ו֙ אִיזֶ֣בֶל אִשְׁתּ֔/וֹ אַתָּ֕ה עַתָּ֛ה תַּעֲשֶׂ֥ה מְלוּכָ֖ה עַל יִשְׂרָאֵ֑ל ק֤וּם אֱכָל לֶ֨חֶם֙ וְ/יִטַ֣ב לִבֶּ֔/ךָ אֲנִי֙ אֶתֵּ֣ן לְ/ךָ֔ אֶת כֶּ֖רֶם נָב֥וֹת הַ/יִּזְרְעֵאלִֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/007.yaml
  text: Then Jezebel his wife said to him[a], “Do you now govern Israel as king? Get up, eat bread, and let your heart be cheerful[b]; I will give you the vineyard of Naboth the Jezreelite.”
translation:
  language: ta
  text: அப்போது, அவனுடைய மனைவி யேசபேல் அவனிடம், “இப்போது இஸ்ரவேலின்மேல் அரசாட்சி செலுத்துவது நீங்கள்தானே?[a] எழுந்திருங்கள், உணவருந்துங்கள்; உங்கள் மனம் மகிழட்டும். யெஸ்ரயேலியனான நாபோத்தின் திராட்சைத்தோட்டத்தை நான் உங்களுக்குக் கொடுப்பேன்” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதை, “இப்போது இஸ்ரவேலின்மேல் அரசாட்சி செலுத்துவது நீங்கள்தான்” என்ற உறுதிக்கூற்றாகவோ ஏளனக் கூற்றாகவோவும் புரிந்துகொள்ளலாம்; எபிரெயத்தில் இது வினாவா கூற்றா என்பது வெளிப்படையாகக் குறிக்கப்படவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתֹּאמֶר אֵלָיו
  choice: அப்போது ... அவனிடம் ... என்றாள்
  rationale: வாவ் தொடர்வினை கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது; தமிழில் இயல்பான கதைத் தொடர்ச்சிக்காக ‘அப்போது’ பயன்படுத்தப்பட்டது.
- source_word: אִיזֶבֶל אִשְׁתּוֹ
  choice: அவனுடைய மனைவி யேசபேல்
  rationale: பேசுகிறவரின் பெயரையும் ஆகாபுடன் உள்ள உறவையும் எபிரெய மூலத்தின் இணைப்பமைப்புக்கு ஏற்றவாறு தெளிவாகக் காட்டுகிறது.
- source_word: אַתָּה עַתָּה תַּעֲשֶׂה מְלוּכָה עַל יִשְׂרָאֵל
  choice: இப்போது இஸ்ரவேலின்மேல் அரசாட்சி நடத்துகிறவர் நீர்தானே?
  rationale: ‘அரசாட்சியைச் செய்’ என்ற எபிரெய மரபுத்தொடர் அரச அதிகாரத்தைச் செலுத்துவதைக் குறிக்கிறது. சூழலில் உள்ள ஏளனமான வினாவின் வலிமையையும் אַתָּה עַתָּה என்பதன் வலியுறுத்தலையும் ‘நீர்தானே?’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: קוּם
  choice: எழுந்து
  rationale: கூம் என்ற கட்டளையின் நேரடியான, இயல்பான தமிழ் வடிவம்.
- source_word: אֱכָל לֶחֶם
  choice: உணவருந்தி
  rationale: சொல்லுக்கு சொல் ‘அப்பம் சாப்பிடு’ என்றாலும், இங்கு அது உணவு உட்கொள்வதைக் குறிக்கும் எபிரெய மரபுத்தொடர்; தமிழில் இயல்பான பொருள் வழங்கப்பட்டுள்ளது.
- source_word: וְיִטַב לִבֶּךָ
  choice: மனமகிழ்ச்சியாயிரும்
  rationale: சொல்லுக்கு சொல் ‘உன் இருதயம் நன்றாயிருக்கட்டும்’; உள்ளத்தின் மகிழ்ச்சியையும் ஊக்கமான மனநிலையையும் சுருக்கமாகவும் கண்ணியமாகவும் தெரிவிக்கிறது.
- source_word: אֲנִי אֶתֵּן לְךָ
  choice: நான் உமக்குக் கொடுப்பேன்
  rationale: வெளிப்படையாக வரும் ‘நான்’ என்பதன் வலியுறுத்தலையும் எதிர்கால வாக்குறுதியையும் தக்கவைக்கிறது.
- source_word: כֶּרֶם נָבוֹת הַיִּזְרְעֵאלִי
  choice: யெஸ்ரயேலனான நாபோத்தின் திராட்சைத்தோட்டம்
  rationale: எபிரெய உடைமைத் தொடரையும் நாபோத்தின் ஊர்சார் அடையாளத்தையும் இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: யேசபேலின் தொடக்கக் கூற்றின் வலிமை
  choice: ‘இப்போது இஸ்ரவேலின்மேல் அரசாட்சி நடத்துகிறவர் நீர்தானே?’ என்ற ஏளனத் தொனியுள்ள வினாவாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘இப்போது இஸ்ரவேலின்மேல் அரசாட்சி நடத்துவது நீர்தான்’ என்ற உறுதிக்கூற்று அல்லது ஏளனக் கூற்று.
  rationale: எபிரெயத்தில் வெளிப்படையான வினாக்குறி உருபு இல்லை. ஆயினும், ஆகாபின் செயலற்ற நிலையை யேசபேல் கடிந்துகொள்ளும் சூழல் சொல்லாட்சியை வினாவாகப் புரிந்துகொள்ள ஆதரிக்கிறது; இலக்கண ரீதியான மாற்று வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. அரசரை மனைவி நேரடியாக அழைக்கும் இடத்தில் ‘நீர்/உமக்கு’ என்ற மரியாதை ஒருமை பயன்படுத்தப்பட்டுள்ளது; ஏளனத் தொனி ‘நீர்தானே?’ என்பதில் தக்கவைக்கப்பட்டுள்ளது.
