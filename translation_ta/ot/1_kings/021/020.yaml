base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/020.yaml
  text: Ahab said to Elijah[a], “Have you found me, O my enemy?” And he said, “I have found you, because you have sold yourself to do what is evil in the eyes of Yahweh.”
translation:
  language: ta
  text: ஆகாப் எலியாவிடம், “என் பகைவனே, என்னைக் கண்டாயா?” என்று கேட்டான். அதற்கு எலியா, “உன்னைக் கண்டேன். ஏனெனில், யாவே[a]யின் பார்வையில் தீமையானதைச் செய்வதற்கு நீ உன்னை நீயே விற்றுக்கொண்டாய்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில்: ‘YHWH.’ இது பாரம்பரியமாக ‘கர்த்தர்’ என மொழிபெயர்க்கப்படுகிறது; ‘யெகோவா’ என்பதும் ஒரு மாற்று ஒலிபெயர்ப்பு.'
    reason: யாவே என்ற திருநாமத்தின் எபிரெய வடிவத்தையும் பாரம்பரிய மொழிபெயர்ப்பு மற்றும் மாற்று ஒலிபெயர்ப்பையும் குறிப்பிடுகிறது.
lexical_decisions:
- source_word: הַמְצָאתַנִי
  choice: என்னைக் கண்டுபிடித்தாயா?
  rationale: מצא என்பதன் நேரடியான கேள்வி வடிவம். ‘கண்டுபிடித்தாயா’ என்பது ஆகாபின் மோதல் தொனியையும், எலியா அவனைக் கண்டடைந்தார் என்ற பொருளையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֹיְבִי
  choice: என் பகைவனே
  rationale: முதல் நபர் ஒருமை உடைமைப் பின்னொட்டுடன் உள்ள பெயர்ச்சொல்லை விளிவேற்றுமையில் வழங்கி, ஆகாப் எலியாவை பகைவனாக அழைக்கும் பகைமைத் தொனியைப் பாதுகாக்கிறது.
- source_word: מָצָאתִי
  choice: உன்னைக் கண்டுபிடித்தேன்
  rationale: முந்தைய கேள்வியிலுள்ள מצא வினையை அதே சொல்லால் மீண்டும் வழங்கி, உரையாடலின் சொல் எதிரொலியைப் பாதுகாக்கிறது.
- source_word: יַעַן
  choice: ஏனெனில்
  rationale: எலியா ஆகாபைக் கண்டுபிடித்ததற்கான காரணத்தை அறிமுகப்படுத்தும் காரண இணைப்பாகத் தெளிவாக உள்ளது.
- source_word: הִתְמַכֶּרְךָ
  choice: நீ உன்னையே விற்றுவிட்டாய்
  rationale: מכר என்பதன் தற்சார்பு வடிவிலுள்ள ‘தன்னையே விற்றுக்கொள்ளுதல்’ என்ற உருவகத்தைத் தளர்த்தாமல் பாதுகாக்கிறது; தீமைக்கு ஆகாப் தன்னை முழுமையாக ஒப்படைத்ததையும் உணர்த்துகிறது.
- source_word: לַעֲשׂוֹת הָרַע
  choice: தீமையானதைச் செய்வதற்கு
  rationale: தீமையைச் செய்தல் என்ற எபிரெய வழக்கை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: בְּעֵינֵי יְהוָה
  choice: யாவே தம் பார்வையில்
  rationale: ‘யாவேயின் கண்களில்’ என்ற சொற்படி உருவகம் தமிழில் கடினமாக இருப்பதால், தேவ மதிப்பீட்டைக் குறிக்கும் எபிரெய மரபுத்தொடரை ‘தம் பார்வையில்’ என இயல்பாகவும் மரியாதையாகவும் வழங்குகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநாமத்தின் எபிரெய மெய்யெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாக அறியத்தக்க ஒலிபெயர்ப்பாக வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருநாமத்தின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல உரை YHWH என்ற தனிப்பட்ட திருநாமத்தையே பயன்படுத்துவதால், அதை பட்டமாக மாற்றாமல் ஒலிபெயர்க்கிறது. உச்சரிப்பைப் பற்றிய வரலாற்று நிச்சயமின்மை அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- issue: ‘உன்னையே விற்றுவிட்டாய்’ என்ற உருவகத்தின் பொருள்
  choice: உருவகத்தை அப்படியே பாதுகாத்தல்
  alternative: தீமைக்கு உன்னை முழுமையாக ஒப்புக்கொடுத்துவிட்டாய்
  rationale: மூலத்தின் தற்சார்பு ‘தன்னை விற்றுக்கொள்ளுதல்’ உருவகம் ஆகாபின் பொறுப்பையும் தீமைக்கான முழு அர்ப்பணிப்பையும் வலியுறுத்துகிறது; அதை விளக்க மொழிபெயர்ப்பால் ஒரே பொருளுக்குள் கட்டுப்படுத்தவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், உரையாடலின் மோதல் தொனியும் מצא வினையின் மறுபயன்பாடும் பாதுகாக்கப்பட்டுள்ளன. ஆகாபுக்கு ‘என்றான்’ என்றும் எலியாவுக்கு மரியாதை ஒருமையான ‘என்றார்’ என்றும் இயல்பான தமிழ் நடைக்கேற்ப வழங்கப்பட்டுள்ளது; மூலத்தின் பாலினம் மற்றும் பேச்சாளர் வேறுபாடு தெளிவாக இருக்க பெயர்கள் மீண்டும் குறிப்பிடப்பட்டுள்ளன.
