  text: הֲֽ/רָאִ֔יתָ כִּֽי נִכְנַ֥ע אַחְאָ֖ב מִ/לְּ/פָנָ֑/י יַ֜עַן כִּֽי נִכְנַ֣ע מִ/פָּנַ֗/י לֹֽא אבי הָֽ/רָעָה֙ בְּ/יָמָ֔י/ו בִּ/ימֵ֣י בְנ֔/וֹ אָבִ֥יא הָ/רָעָ֖ה עַל בֵּיתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/029.yaml
  text: Have you seen that Ahab has humbled himself before me? Because he has humbled himself before me[a], I will not bring the disaster in his days[b]; in his son's days I will bring the disaster on his house.
translation:
  language: ta
  text: “ஆகாப் எனக்கு முன்பாகத் தன்னைத் தாழ்த்திக்கொண்டதைப் பார்த்தாயா? அவன் எனக்கு முன்பாகத் தன்னைத் தாழ்த்திக்கொண்டதால், அவனுடைய நாட்களில் நான் அந்தப் பேரழிவைக்[a] கொண்டுவர மாட்டேன்; அவனுடைய மகனின் நாட்களில் அவனுடைய வீட்டின்மேல்[b] அந்தப் பேரழிவைக் கொண்டுவருவேன்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பேரிடர்’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயத்தில் ‘தீமை/பேரழிவு’ என்று உள்ளது. இந்தத் தீர்ப்புச் சூழலில் அது ஒழுக்கத் தீமையை அல்ல, தண்டனையாக வரும் பேரழிவைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘வீடு’ என்பது அவனுடைய குடும்பத்தாரையோ அரச வம்சத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲרָאִיתָ
  choice: பார்த்தாயா?
  rationale: ראה என்பதன் Qal நிறைவுவினை இரண்டாம் நபர் ஆண்பால் ஒருமை வடிவம். முடிந்த ஒரு கவனிப்பை நிகழ்காலத் தொடர்புடன் காட்டும் இயல்பான தமிழ் வினாவாக மொழிபெயர்க்கப்பட்டது.
- source_word: נִכְנַע
  choice: தன்னைத் தாழ்த்திக்கொண்டதை / தன்னைத் தாழ்த்திக்கொண்டதால்
  rationale: כנע என்பதன் Niphal வடிவம் இங்கு கடவுளின் தீர்ப்புக்கு முன் தன்னைத் தாழ்த்தி அடங்குவதைக் குறிக்கிறது. ‘மனந்திரும்பினான்’ என்று உரையில் இல்லாத முழுமையான இறையியல் கருத்தைச் சேர்க்காமல், தற்சார்புப் பொருள் பாதுகாக்கப்பட்டது.
- source_word: מִלְּפָנַי / מִפָּנַי
  choice: எனக்கு முன்பாக
  rationale: ‘என் முகத்திற்கு/சந்நிதிக்கு முன்பாக’ என்னும் எபிரெய மொழிமரபை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: יַעַן כִּי
  choice: …தால்
  rationale: தீர்ப்பு தாமதிக்கப்படுவதற்கான காரணத்தைத் தெளிவாகக் காட்டும் இயல்பான தமிழ் காரண விகுதி.
- source_word: לֹא אָבִיא
  choice: நான் … கொண்டுவர மாட்டேன்
  rationale: בוא என்பதன் Hiphil வடிவத்தின் காரணவினைப் பொருளைச் சுருக்கமாகவும் நேரடியாகவும் தருகிறது.
- source_word: הָרָעָה
  choice: அந்தப் பேரழிவு
  rationale: இந்தத் தீர்ப்புச் சூழலில் רָעָה என்பது ஒழுக்கத் தீமையை அல்ல, தண்டனைக்குரிய அழிவை அல்லது பேரிடரைக் குறிக்கிறது. ‘பேரழிவு’ அந்தச் சூழற்பொருளைத் தெளிவாகத் தருகிறது.
- source_word: בְּיָמָיו
  choice: அவனுடைய நாட்களில்
  rationale: ஆகாபின் வாழ்நாளைக் குறிக்கும் எபிரெய கால மொழிமரபையும் அடுத்த இணையான தொடருடனான அமைப்பையும் பாதுகாக்கிறது.
- source_word: בִּימֵי בְנוֹ
  choice: அவனுடைய மகனின் நாட்களில்
  rationale: முந்தைய ‘அவனுடைய நாட்களில்’ என்ற தொடருடன் உள்ள எபிரெய இணை அமைப்பையும் கால வேறுபாட்டையும் பாதுகாக்கிறது.
- source_word: עַל בֵּיתוֹ
  choice: அவனுடைய வீட்டார்மேல்
  rationale: அரச மரபுச் சூழலில் בַּיִת குடும்பத்தாரையோ அரச வம்சத்தையோ குறிக்கலாம். ‘வீட்டார்’ என்ற சொல் அடிப்படை உருவகத்தைத் தக்கவைத்து, குறிப்பில் இரு வாய்ப்புகளும் தெரிவிக்கப்படுகின்றன.
theological_decisions:
- issue: ஆகாபின் பதிலின் தன்மை
  choice: ‘தன்னைத் தாழ்த்திக்கொண்டான்’ என்ற பொருளையே வழங்குதல்
  alternative: ‘மனந்திரும்பினான்’ அல்லது ‘அடங்கினான்’
  rationale: ஆகாப் கடவுளுக்கு முன்பாகத் தன்னைத் தாழ்த்தியதால் தீர்ப்பு தாமதிக்கிறது என்றே வசனம் கூறுகிறது. மனந்திரும்புதலுக்குரிய தனிச் சொல்லை மூலவுரை பயன்படுத்தாததால், அதற்கு மேலான இறையியல் முடிவு மொழிபெயர்ப்பில் சேர்க்கப்படவில்லை.
- issue: கடவுள் கொண்டுவரும் הָרָעָה என்பதன் பொருள்
  choice: ‘பேரழிவு’
  alternative: ‘தீமை’ அல்லது ‘பேரிடர்’
  rationale: இங்கு சொல் ஒழுக்கத் தீமையைக் குறிக்காமல், ஆகாபின் வீட்டாருக்கு எதிராக அறிவிக்கப்பட்ட தண்டனைத் தீர்ப்பைக் குறிக்கிறது. கடவுள் ஒழுக்கத் தீமையைச் செய்கிறார் என்ற தவறான எண்ணத்தைத் தவிர்த்து, நீதித்தீர்ப்பின் கடுமையை ‘பேரழிவு’ வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் அமைக்கப்பட்டது. எபிரெயத்தின் இணை அமைப்பைப் பாதுகாக்க ‘அவனுடைய நாட்களில் / அவனுடைய மகனின் நாட்களில்’ என்ற ஒத்த தொடர்கள் பயன்படுத்தப்பட்டன; ‘மனந்திரும்புதல்’ மற்றும் ‘அரச வம்சம்’ போன்ற விளக்கத் தீர்மானங்கள் பிரதான உரையில் கட்டாயப்படுத்தப்படவில்லை.
