  yaml_path: translation/ot/1_kings/021/026.yaml
  text: He acted very abominably by going after idols[a], according to all that the Amorites had done[b], whom Yahweh drove out before the sons of Israel.
translation:
  language: ta
  text: யாவே இஸ்ரவேல் மக்களுக்கு முன்பாக வெளியேற்றிய எமோரியர் செய்த எல்லாவற்றின்படியும், அவன் சிலைகளைப் பின்பற்றி மிகவும் அருவருப்பாக நடந்துகொண்டான்[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சிலைகள்” என்பதற்கான எபிரெயச் சொல் גִּלֻּלִים, சிலைகளை மிக இழிவாகவும் அருவருப்பாகவும் குறிப்பிடும் சொல்; “அருவருப்பான சிலைகள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “இஸ்ரவேல் மக்கள்” என்பது சொல்லுக்குச் சொல் “இஸ்ரவேலின் மகன்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּתְעֵב מְאֹד
  choice: மிகவும் அருவருப்பாக நடந்துகொண்டான்
  rationale: תעב என்ற வினையின் செயற்பாட்டு வலிமையையும் מְאֹד என்ற தீவிரப்படுத்தலையும் இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: לָלֶכֶת אַחֲרֵי
  choice: பின்பற்றிச் சென்று
  rationale: ஒருவரையோ ஒன்றையோ பின்தொடர்ந்து அதற்கு விசுவாசம் செலுத்தும் எபிரெய உருவகத்தைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַגִּלֻּלִים
  choice: சிலைகள்
  rationale: முதன்மை உரையில் தெளிவான பொதுச்சொல் பயன்படுத்தப்பட்டுள்ளது; மூலத்தின் கடுமையான இழிவுப்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: כְּכֹל אֲשֶׁר עָשׂוּ
  choice: செய்த எல்லாவற்றின்படியும்
  rationale: ஆகாபின் நடத்தையை எமோரியரின் செயல்கள் அனைத்தோடும் ஒப்பிடும் כְּכֹל אֲשֶׁר என்ற அமைப்பை நெருக்கமாகக் காக்கிறது.
- source_word: הָאֱמֹרִי
  choice: எமோரியர்
  rationale: எபிரெயத்தில் ஒருமை வடிவம் இருந்தாலும் இங்கு அது ஒரு மக்களினத்தைக் கூட்டாகக் குறிக்கிறது; தமிழ் கூட்டுப் பன்மை இயல்பானது.
- source_word: הוֹרִישׁ
  choice: துரத்திய
  rationale: நிலத்திலிருந்து அகற்றி உரிமையிழக்கச் செய்த வெற்றிகொள்ளல் சூழலை வாசிக்க எளிய தமிழில் தெரிவிக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: நான்கு எழுத்துத் தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாக அறியப்படும் தனிப்பெயர் வடிவில் வழங்குகிறது.
- source_word: מִפְּנֵי
  choice: முன்பாக இருந்து
  rationale: இஸ்ரவேல் மக்களின் முன்னிலையிலிருந்து அகற்றப்பட்டதைக் காட்டும் இடச்சார்ந்த பொருளை வெளிப்படுத்துகிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மக்கள்
  rationale: சொல்லுக்குச் சொல் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு முழு உடன்படிக்கை மக்களையும் குறிக்கும் மரபுத்தொடரை இயல்பான மற்றும் உள்ளடக்கமான தமிழில் வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக உள்ளது; ‘கர்த்தர்’ போன்ற பட்டத்தால் மாற்றாமல் பெயராகவே காக்கப்பட்டது. தமிழில் பரவலாக அறியப்படும் ‘யெகோவா’ தேர்ந்தெடுக்கப்பட்டது; ‘யாவே’ என்பதும் சாத்தியமான ஒலிபெயர்ப்பு.
- issue: בְּנֵי יִשְׂרָאֵל என்ற பாலின வடிவம்
  choice: இஸ்ரவேலின் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரெய ஆண்பால் பன்மை இங்கு ஆண்களை மட்டும் அல்லாமல் இஸ்ரவேல் மக்களைக் கூட்டாகக் குறிக்கிறது. பொருளைத் தெளிவாகவும் இயல்பாகவும் வழங்க ‘மக்கள்’ பயன்படுத்தப்பட்டது; நேரடி வடிவம் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
