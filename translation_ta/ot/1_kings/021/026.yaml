  source_fidelity: வரைவில் மூலத்தின் முக்கிய கூறுகள் உள்ளன. ஆனால் எபிரெய வாக்கியத்தில் உள்ள ஒப்பீட்டுத் தொடர் (‘எமோரியர் செய்த எல்லாவற்றின்படியும்’) சிலைகளைப் பின்பற்றிய அவனது அருவருப்பான நடத்தையை நேரடியாக விளக்குகிறது; அதை இரு தனி வாக்கியங்களாகப் பிரிப்பது தொடர்பைத் தளர்த்துகிறது. மேலும் יְהוָה-க்கு ஆங்கில POB audit trail நிர்ணயிக்கும் ‘Yahweh’ வடிவத்துக்கு ஏற்ப ‘யாவே’ பயன்படுத்தப்பட வேண்டும்; ‘யெகோவா’ அந்தத் தேர்வுடன் ஒத்துப்போவதில்லை.
