  yaml_path: translation/ot/1_kings/021/024.yaml
  text: Anyone belonging to Ahab who dies in the city the dogs will eat[b][a], and anyone who dies in the field the birds of the sky will eat.
translation:
  language: ta
  text: ஆகாபைச் சேர்ந்தவர்களில் நகரத்தில் இறப்பவனை நாய்கள் தின்னும்; வயல்வெளியில் இறப்பவனை வானத்துப் பறவைகள் தின்னும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמֵּת לְאַחְאָב
  choice: ஆகாபைச் சேர்ந்தவர்களில் ... சாகிற எவனையும்
  rationale: குறிப்பிட்ட ஒரே இறந்த நபரை அல்லாமல், ஆகாபின் வீட்டார் அல்லது வம்சத்தைச் சேர்ந்தவர்களில் யார் இறந்தாலும் என்பதைக் குறிக்கும் பொதுப்படையான பெயரெச்சத் தொடரை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בָּעִיר
  choice: நகரத்தில்
  rationale: இடத்தைக் குறிக்கும் எபிரெய முன்னிடைச்சொல்லின் நேரான, இயல்பான மொழிபெயர்ப்பு.
- source_word: יֹאכְלוּ הַכְּלָבִים
  choice: நாய்கள் தின்னும்
  rationale: אכל என்பதன் அடிப்படைப் பொருளையும், உடலை விலங்குகள் உண்பதன் இழிவான கடுமையையும் காக்கிறது.
- source_word: וְהַמֵּת בַּשָּׂדֶה
  choice: வயல்வெளியில் சாகிற எவனையும்
  rationale: முதல் அரையடியின் பொதுப்படையான அமைப்பைத் தொடர்ந்து, நகரம்–வயல்வெளி என்ற மாறுபாட்டைப் பாதுகாக்கிறது.
- source_word: עוֹף הַשָּׁמָיִם
  choice: வானத்துப் பறவைகள்
  rationale: எபிரெய மொழியின் ‘வானங்களின் பறவைகள்’ என்ற வழக்குத் தொடரை நவீன தமிழில் இயல்பாகவும் உருவகத்தைத் தக்கவைத்தும் தருகிறது.
theological_decisions: []
translation_notes:
  register: நவீன தரத் தமிழ்; தீர்க்கதரிசனத் தீர்ப்பின் கடுமையையும் இரு அரையடிகளின் இணை அமைப்பையும் காக்கும் கண்ணியமான, நேரடியான நடை. ‘ஆகாபைச் சேர்ந்தவர்கள்’ என்பது அடிமை உரிமையை அல்ல, அவனுடைய வீட்டார்/வம்சத்துடனான உறவைச் சுட்டுகிறது.
