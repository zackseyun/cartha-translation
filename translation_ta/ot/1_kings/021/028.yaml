  text: וַֽ/יְהִי֙ דְּבַר יְהוָ֔ה אֶל אֵלִיָּ֥הוּ הַ/תִּשְׁבִּ֖י לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/028.yaml
  text: And the word of Yahweh came to Elijah the Tishbite[a], saying,
translation:
  language: ta
  text: 'யாவே[a]யின் வார்த்தை திஸ்பியனான எலியாவிடம் வந்து கூறியது:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில்: ‘YHWH’; மரபாக ‘கர்த்தர்’ என்று மொழிபெயர்க்கப்படுகிறது.'
    reason: இறைநாமத்தின் மூல வடிவத்தையும் மரபு மொழிபெயர்ப்பையும் தெரிவிக்கும் மாற்று வாசிப்பு குறிப்பு.
lexical_decisions:
- source_word: וַיְהִי
  choice: உரைத்து
  rationale: וַיְהִי דְבַר־יְהוָה אֶל என்ற தீர்க்கதரிசனச் செய்தி வருகைச் சூத்திரத்தைத் தமிழில் இயல்பாக வெளிப்படுத்த, דְבַר மற்றும் אֶל ஆகியவற்றோடு இணைத்து ‘தமது வார்த்தையை உரைத்து’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: דְּבַר יְהוָה
  choice: யாவே தமது வார்த்தையை
  rationale: דָּבָר என்பதன் ‘வார்த்தை/செய்தி’ என்ற பொருளை ‘வார்த்தை’ எனப் பாதுகாத்து, தமிழில் இயல்பான உடைமை உறவைத் தற்சுட்டுப் பெயரால் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது எபிரெய தனிப்பெயரான YHWH-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பாகத் தருகிறது.
- source_word: אֶל
  choice: எலியாவிடம்
  rationale: வெளிப்பாடு சென்றடைந்த நபரைக் குறிக்கும் אֶל என்பதற்கு இச்சூழலில் இயல்பான தமிழ் வேற்றுமை வடிவம் ‘-இடம்’ ஆகும்.
- source_word: אֵלִיָּהוּ
  choice: எலியா
  rationale: எபிரெய நபர்பெயரின் தமிழில் நிலைபெற்ற வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: הַתִּשְׁבִּי
  choice: திஸ்பியனான
  rationale: திஸ்பியைச் சேர்ந்தவர் என்பதைக் குறிக்கும் குடிப்பெயர்/அடையாளப் பெயரைச் சுருக்கமாகவும் தெளிவாகவும் தருகிறது.
- source_word: לֵאמֹר
  choice: (அடுத்த வசனத்தின் நேர்கூற்றை அறிமுகப்படுத்தும் தொடராக) உரைத்து,
  rationale: לֵאמֹר அடுத்த வசனத்தில் வரும் இறைவாக்கை அறிமுகப்படுத்துகிறது. வசன எல்லையில் தொடர்ச்சி துண்டிக்கப்படாதபடி ‘உரைத்து,’ என்ற வினையெச்சமும் இறுதிக் காற்புள்ளியும் பயன்படுத்தப்பட்டுள்ளன.
theological_decisions:
- issue: יְהוָה என்ற இறைநாமத்தின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பெயரான நான்கெழுத்து இறைநாமம் நேரடியாக உள்ளது. அதை ஒரு பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்த்திருப்பது மூலத்தின் தனிப்பெயர் தன்மையைப் பாதுகாக்கிறது.
- issue: דְּבַר יְהוָה என்பதில் வார்த்தையின் தன்மை
  choice: யாவே தமது வார்த்தையை உரைத்தார் என்ற நேரடி இறைச்செயல்
  alternative: யாவேயிடமிருந்து ஒரு செய்தி வந்தது
  rationale: ‘வார்த்தை’ என்ற மூலச் சொல்லையும் தீர்க்கதரிசன வெளிப்பாட்டின் சூத்திரத்தையும் பாதுகாக்கிறது; அதேவேளை வார்த்தையைத் தனி ஆளாக விளக்கும் கோட்பாட்டை வசனத்துக்குள் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. அடுத்த வசனத்தின் நேர்கூற்றுடன் தொடரும் எபிரெய வாக்கிய அமைப்பை உணர்த்த வினையெச்ச முடிவு பயன்படுத்தப்பட்டுள்ளது; [a] குறி அது விளக்கும் ‘யாவே’ என்பதன் உடனேயே வைக்கப்பட்டுள்ளது.
