base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/019.yaml
  text: 'And you shall speak to him[a], saying, ‘Thus says Yahweh: Have you murdered and also taken possession?’ And you shall speak to him, saying, ‘Thus says Yahweh: In the place where the dogs licked the blood of Naboth[b], the dogs shall lick your blood—you also.’'
translation:
  language: ta
  text: 'நீ அவனிடம் இவ்வாறு கூறு: ‘யாவே கூறுவது இதுவே: நீ கொலை செய்ததோடு, கைப்பற்றிக்கொண்டாயா?[a]’ மேலும் அவனிடம் இவ்வாறு கூறு: ‘யாவே கூறுவது இதுவே: நாபோத்தின் இரத்தத்தை நாய்கள் நக்கின இடத்திலேயே, உன் இரத்தத்தையும் நாய்கள் நக்கும்—உன்னுடையதையும்![b]’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கொலை செய்ததோடு’ என்பதற்கு ‘கொன்றதோடு’ என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல் சில இடங்களில் விரிவாக ‘கொல்’ எனப் பொருள்படலாம்; ஆனால் இங்கு ‘கொலை செய்’ என்ற வலுவான பொருள் பொருத்தமானது.
    reason: lexical_alternative
  - marker: b
    text: ‘உன்னுடையதையும்’ என்று மொழிபெயர்க்கப்பட்டுள்ள இறுதிச் சொற்கள் எபிரெயத்தில் வலியுறுத்தப்பட்டுள்ளன. நாபோத்தின் இரத்தத்துக்கு நேர்ந்த அதே இழிவான நிலை ஆகாபின் இரத்தத்துக்கும் நேரும் என்பதை அவை அழுத்திக் கூறுகின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְדִבַּרְתָּ אֵלָיו לֵאמֹר
  choice: நீ அவனிடம் பேசி, … என்று சொல்
  rationale: தீர்க்கதரிசனப் பணிப்புரையின் முறையான அமைப்பையும், வசனத்தில் அது இருமுறை வருவதையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: כֹּה אָמַר יְהוָה
  choice: யாவே கூறுவது இதுவே
  rationale: வழக்கமான தீர்க்கதரிசனத் தூதுச் சூத்திரத்தை இயல்பான நவீனத் தமிழில் தருகிறது; יהוה என்ற தனிப்பெயர் பட்டப்பெயராக மாற்றப்படாமல் ‘யாவே’ என ஒலிபெயர்க்கப்படுகிறது.
- source_word: הֲרָצַחְתָּ
  choice: நீ கொலை செய்துவிட்டு
  rationale: רצח என்பது பொதுவாக உயிரைக் கொல்வதை மட்டும் அல்லாமல் சட்டவிரோதமான கொலையைக் குறிக்கிறது; ஆகவே குற்றச்சாட்டின் அறநெறி மற்றும் சட்ட வலிமையை ‘கொலை’ பாதுகாக்கிறது.
- source_word: וְגַם יָרָשְׁתָּ
  choice: அதையும் கைப்பற்றிக்கொண்டாயா?
  rationale: இச்சூழலில் ירש என்பது நாபோத்தின் திராட்சைத்தோட்டத்தைத் தன்வசப்படுத்துவதைக் குறிக்கிறது. ‘கைப்பற்றிக்கொண்டாய்’ தவறான உரிமையாக்கத்தை இயல்பாக வெளிப்படுத்துகிறது; ‘அதையும்’ என்பது சூழலில் புரிந்துகொள்ளப்படும் பொருளைச் சுட்டுகிறது.
- source_word: בִּמְקוֹם אֲשֶׁר
  choice: … நக்கின இடத்திலேயே
  rationale: தீர்ப்பு அதே இடத்தில் நிகழும் என்ற இடச்சார்ந்த ஒப்புமையையும் வலியுறுத்தலையும் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: לָקְקוּ … יָלֹקּוּ
  choice: நக்கின … நக்கும்
  rationale: எபிரெயத்தில் கடந்தகாலத்திலும் எதிர்காலத்திலும் ஒரே வினைவேர் மீள வருவதால், தமிழிலும் ‘நக்கு’ என்ற ஒரே வினை மீண்டும் பயன்படுத்தப்பட்டுள்ளது.
- source_word: הַכְּלָבִים
  choice: நாய்கள்
  rationale: தீர்ப்பின் இழிவான, கொடூரமான படிமத்திற்கு மையமான சொல்லை நேரடியாக மொழிபெயர்க்கிறது.
- source_word: דַּם נָבוֹת
  choice: நாபோத்தின் இரத்தம்
  rationale: எபிரெயச் சொற்றொடரை நேரடியாகத் தருகிறது; נבות என்பது ‘நாபோத்’ என ஒலிபெயர்க்கப்படுகிறது.
- source_word: אֶת דָּמְךָ גַּם אָתָּה
  choice: உன் இரத்தத்தையும் … ஆம், உன்னுடையதையே!
  rationale: இறுதியிலுள்ள גם אתה என்ற திடீர் தனிப்பட்ட வலியுறுத்தலை இயல்பான தமிழில் பாதுகாக்கிறது; தீர்ப்பு ஆகாப்மீதே வரும் என்பது மழுங்கவிடப்படவில்லை.
theological_decisions:
- issue: הֲרָצַחְתָּ என்ற சொல்லிலுள்ள குற்றச்சாட்டின் அறநெறி வலிமை
  choice: ‘கொலை செய்துவிட்டு’ என்று மொழிபெயர்த்தல்
  alternative: ‘கொன்றுவிட்டு’
  rationale: רצח இங்கு நாபோத்தின் சட்டவிரோதக் கொலையில் ஆகாபின் குற்றப்பொறுப்பைச் சுட்டுகிறது. ‘கொலை’ என்பது பொதுவான ‘கொல்’ என்பதைவிட அந்தக் குற்ற வலிமையைத் துல்லியமாகக் காக்கிறது.
- issue: גם אָתָּה என்ற இறுதி வலியுறுத்தல்
  choice: ‘ஆம், உன்னுடையதையே!’ என்று வெளிப்படையாகப் பாதுகாத்தல்
  alternative: ‘உன் இரத்தத்தையும் நக்கும்’ என்று மட்டும் கூறுதல்
  rationale: எபிரெய வசனம் தனிப்பட்ட தீர்ப்பை வலியுறுத்தும் திடீர் சேர்க்கையுடன் முடிகிறது. அதை நீக்காமல் தமிழிலும் வலியுறுத்துவது உரையின் தீர்க்கதரிசனத் தாக்கத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரநிலைத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. தீர்க்கதரிசனத் தூதுச் சூத்திரத்தின் இருமுறை மீளுரைத்தல், ‘நக்கின/நக்கும்’ என்ற வினைச்சொல் மீட்சி, மற்றும் வசன முடிவின் தனிப்பட்ட வலியுறுத்தல் ஆகியவை பாதுகாக்கப்பட்டுள்ளன. தெய்வீகப் பெயர் יהוה ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
