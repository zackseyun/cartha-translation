revisions:
- from: 'நீ அவனிடம் பேசி, ‘யாவே கூறுவது இதுவே: நீ கொலை செய்துவிட்டு, அதையும் கைப்பற்றிக்கொண்டாயா?[a]’ என்று சொல். மேலும் நீ அவனிடம் பேசி, ‘யாவே கூறுவது இதுவே: நாபோத்தின் இரத்தத்தை நாய்கள் நக்கின இடத்திலேயே, நாய்கள் உன் இரத்தத்தையும் நக்கும்—ஆம், உன்னுடையதையே![b]’ என்று சொல்.'
  to: 'நீ அவனிடம் இவ்வாறு கூறு: ‘யாவே கூறுவது இதுவே: நீ கொலை செய்ததோடு, கைப்பற்றிக்கொண்டாயா?[a]’ மேலும் அவனிடம் இவ்வாறு கூறு: ‘யாவே கூறுவது இதுவே: நாபோத்தின் இரத்தத்தை நாய்கள் நக்கின இடத்திலேயே, உன் இரத்தத்தையும் நாய்கள் நக்கும்—உன்னுடையதையும்![b]’'
  rationale: The revision improves idiomatic modern Tamil while retaining the Hebrew’s repeated commission, accusatory question, repeated ‘dogs/lick’ wording, and climactic personal emphasis. It avoids making the implicit object of ‘taken possession’ unnecessarily explicit and renders גם אתה as an emphatic inclusion rather than as an added affirmative statement.
