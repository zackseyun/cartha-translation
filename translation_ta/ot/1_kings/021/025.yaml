reference: 1 Kings 21:25
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: רַ֚ק לֹֽא הָיָ֣ה כְ/אַחְאָ֔ב אֲשֶׁ֣ר הִתְמַכֵּ֔ר לַ/עֲשׂ֥וֹת הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה אֲשֶׁר הֵסַ֥תָּה אֹת֖/וֹ אִיזֶ֥בֶל אִשְׁתּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/025.yaml
  text: Surely there was no one like Ahab, who sold himself to do what was evil in the sight of Yahweh, because Jezebel his wife incited him.
translation:
  language: ta
  text: உண்மையாகவே, யாவேயின் பார்வையில் தீமை செய்யத் தன்னையே விற்றுக்கொண்ட ஆகாபைப் போல் வேறு யாரும் இருந்ததில்லை; அவனை அவன் மனைவி யெசபெல் தூண்டினாள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவனை அவன் மனைவி யெசபெல் தூண்டினாள்” என்பதற்கான எபிரெயத் தொடரை, “ஏனெனில் அவன் மனைவி யெசபெல் அவனைத் தூண்டினாள்” என்றும் புரிந்துகொள்ளலாம்.
    reason: எபிரெய உறவுத்தொடர் ஆகாபை விவரிப்பதாக நேரடியாக வாசிக்கப்படலாம்; சூழலில் அது காரண நுணுக்கத்தையும் கொண்டிருக்கலாம். இந்தத் தெளிவின்மையைப் பதிவு செய்கிறது.
lexical_decisions:
- source_word: רַק
  choice: உண்மையிலேயே
  rationale: இங்கு இந்த இடைச்சொல் வெறும் ‘மட்டும்’ என்ற கட்டுப்பாட்டுப் பொருளைவிட, ஆகாபின் ஒப்பற்ற தீமையை வலியுறுத்துகிறது.
- source_word: לֹא הָיָה כְאַחְאָב
  choice: ஆகாபைப் போல் ... யாரும் இருந்ததில்லை
  rationale: ஒப்பிடத்தக்க வேறு எவரும் இல்லை என்ற எபிரெய மரபுத்தொடரின் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: הִתְמַכֵּר
  choice: தன்னையே விற்றுப்போட்ட
  rationale: Hitpael வடிவிலுள்ள உருவகத்தின் வலிமையைத் தக்கவைத்து, ஆகாப் தீமைக்கு முழுமையாகத் தன்னை ஒப்படைத்ததை வெளிப்படுத்துகிறது.
- source_word: לַעֲשׂוֹת הָרַע
  choice: தீமையானதைச் செய்வதற்கு
  rationale: தீயதாக மதிப்பிடப்பட்டவற்றைச் செயல்படுத்துதல் என்ற பொருளைத் தெளிவான நவீன தமிழில் தருகிறது.
- source_word: בְּעֵינֵי יְהוָה
  choice: யாவேயின் பார்வையில்
  rationale: இறைவனுடைய மதிப்பீட்டைக் குறிக்கும் எபிரெய உருவகத்தை இயல்பாகத் தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், இறைநாமமாகத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: הֵסַתָּה
  choice: தூண்டினாள்
  rationale: ஒருவரைத் தீய செயலை நோக்கித் தூண்டுதல் அல்லது உந்துதல் என்ற causative பொருளைச் சுருக்கமாகத் தருகிறது.
- source_word: אֲשֶׁר הֵסַתָּה אֹתוֹ אִיזֶבֶל אִשְׁתּוֹ
  choice: அவனை அவன் மனைவி யெசபெல் தூண்டினாள்
  rationale: எபிரெய உறவுநிலைத் தொடரைத் தனி உட்பிரிவாகப் பாதுகாத்து, யெசபெலின் தூண்டுதலைத் தெளிவாகக் கூறுகிறது; அதனை வெளிப்படையாகக் காரணவாக்கியமாக மாற்றவில்லை.
theological_decisions:
- issue: יְהוָה என்ற இறைநாமத்தின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக வருவதால், பட்டப்பெயரால் மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டது.
- issue: யெசபெலின் தூண்டுதலுக்கும் ஆகாபின் குற்றப்பொறுப்புக்கும் உள்ள தொடர்பு
  choice: ஆகாப் தன்னையே விற்றுப்போட்டான்; யெசபெல் அவனைத் தூண்டினாள்
  alternative: யெசபெல் தூண்டியதால் மட்டுமே ஆகாப் தீமை செய்தான்
  rationale: மூலம் ஆகாபின் விருப்பப்பூர்வமான தீய அர்ப்பணிப்பையும் யெசபெலின் செயற்பாட்டையும் அருகருகே வைக்கிறது; அவனுடைய பொறுப்பை நீக்கும் விதமாக காரணத்தை மிகைப்படுத்தவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதவாக்கியத்திற்கேற்ற கண்ணியமான நடையிலும் அமைக்கப்பட்டது. ‘தன்னையே விற்றுப்போட்ட’ என்ற உயிருள்ள மூல உருவகம் தட்டையாக்கப்படாமல் பாதுகாக்கப்பட்டது.
