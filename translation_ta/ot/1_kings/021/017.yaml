  edition: WLC
  text: וַ/יְהִי֙ דְּבַר יְהוָ֔ה אֶל אֵלִיָּ֥הוּ הַ/תִּשְׁבִּ֖י לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/017.yaml
  text: Then the word of Yahweh came to Elijah the Tishbite[a], saying,
translation:
  language: ta
  text: 'பின்பு யாவேயின் வார்த்தை திஸ்பியைச் சேர்ந்த எலியாவுக்கு வந்து, இவ்வாறு கூறியது[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, “அது நிகழ்ந்தது: யாவேயின் வார்த்தை திஸ்பியைச் சேர்ந்த எலியாவுக்கு வந்து, இவ்வாறு கூறியது:”'
    reason: וַיְהִי என்ற கதைத் தொடக்க வாய்பாட்டை இன்னும் சொற்சார்பாகக் காட்டும் மாற்று வடிவம்.
lexical_decisions:
- source_word: וַיְהִי
  choice: பின்பு ... வந்தது
  rationale: வாவ் தொடர்வினையுடன் வரும் היה, கதையின் அடுத்த நிகழ்வை அறிமுகப்படுத்துகிறது. தமிழில் பழமையான ‘சம்பவித்ததாவது’ என்பதற்குப் பதிலாக ‘பின்பு ... வந்தது’ இயல்பாக நிகழ்வின் தொடர்ச்சியைத் தெரிவிக்கிறது.
- source_word: דְּבַר יְהוָה
  choice: யாவேயின் வார்த்தை
  rationale: இது தீர்க்கதரிசன உரைகளில் வழக்கமான வெளிப்பாட்டு வாய்பாடு. ‘செய்தி’ என்பதைவிட ‘வார்த்தை’ என்பது எபிரெயச் சொல்லின் நேரடித் தன்மையையும் இறைவெளிப்பாட்டின் வலிமையையும் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எழுத்துகளைக் கொண்ட இறைப்பெயர் பட்டப்பெயராக மாற்றப்படாமல், தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பாக வழங்கப்படுகிறது.
- source_word: אֶל
  choice: எலியாவுக்கு
  rationale: ஒருவரை நோக்கி வார்த்தை அல்லது வெளிப்பாடு வருவதைத் தமிழில் இயல்பாகக் குறிக்க நான்காம் வேற்றுமை உருபு பயன்படுத்தப்பட்டுள்ளது.
- source_word: אֵלִיָּהוּ
  choice: எலியா
  rationale: தனிப்பெயர் தமிழில் நிலைபெற்ற வேதாகமப் பெயர் வடிவில் வழங்கப்படுகிறது.
- source_word: הַתִּשְׁבִּי
  choice: திஸ்பியைச் சேர்ந்த
  rationale: இடத்தைச் சார்ந்த அடையாளத்தைக் குறிக்கும் எபிரெயச் சொல்லை, இன்றைய வாசகர்களுக்குத் தெளிவாகவும் இயல்பாகவும் ‘திஸ்பியைச் சேர்ந்த’ என்று மொழிபெயர்க்கிறது.
- source_word: לֵאמֹר
  choice: ':'
  rationale: அடுத்த வசனத்தில் வரும் நேரடி உரையை அறிமுகப்படுத்தும் இச்சொல்லின் செயல்பாட்டைத் தமிழில் முக்காற்புள்ளி இயல்பாக நிறைவேற்றுகிறது; ‘சொல்லியதாவது’ என்று சேர்ப்பது தேவையற்ற கனத்தை உண்டாக்கும்.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது. ஆகவே அதை ஒரு பட்டப்பெயரான ‘கர்த்தர்’ என்று மாற்றாமல், ‘Yahweh’ என்பதற்குரிய தமிழ் ஒலிபெயர்ப்பான ‘யாவே’ என்று வழங்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வேதாகம உரைக்குரிய கண்ணியமும் காக்கப்பட்டுள்ளன. தேவையற்ற பழமொழிநடையைத் தவிர்த்து, தீர்க்கதரிசன வாய்பாட்டின் ‘வார்த்தை’ என்ற முக்கிய சொல் தக்கவைக்கப்பட்டுள்ளது.
