translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகருக்குப் புரியும் வகையிலும் கதைநடைக்குரிய கண்ணியமான தொனியிலும் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் ஒரே காரணவினா இயல்பான தமிழ் வாக்கியமாக அமைக்கப்பட்டு, அதன் அசாதாரண சொற்படியான அமைப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
