id: 1KI.21.5
reference: 1 Kings 21:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/תָּבֹ֥א אֵלָ֖י/ו אִיזֶ֣בֶל אִשְׁתּ֑/וֹ וַ/תְּדַבֵּ֣ר אֵלָ֗י/ו מַה זֶּה֙ רוּחֲ/ךָ֣ סָרָ֔ה וְ/אֵינְ/ךָ֖ אֹכֵ֥ל לָֽחֶם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/005.yaml
  text: Then Jezebel his wife came to him and said to him[a], “Why is your spirit so sullen that you are not eating bread?”
translation:
  language: ta
  text: அப்போது அவனுடைய மனைவி யேசபேல் அவனிடம் வந்து, “உன் மனம் இப்படி சுணங்கிப்போய், நீ உணவு உண்ணாமல் இருப்பது ஏன்?” என்று கேட்டாள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்படியாக, “இது என்ன—உன் ஆவி சுணங்கியிருக்கிறது—நீ அப்பம் சாப்பிடாமலும் இருக்கிறாய்?”
    reason: மூலத்தின் வாக்கிய அமைப்பையும் ‘ஆவி’, ‘அப்பம்’ என்ற சொற்பொருள்களையும் காட்டும் மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: וַתָּבֹא
  choice: அப்போது ... வந்து
  rationale: வாவ் தொடர்வினை கதைநிகழ்வை அடுத்த கட்டத்துக்கு நகர்த்துகிறது; ‘அப்போது’ இயல்பான தமிழ் கதைநடையில் அந்த வரிசையைக் காட்டுகிறது.
- source_word: אִיזֶבֶל אִשְׁתּוֹ
  choice: அவனுடைய மனைவி யேசபேல்
  rationale: உறவையும் தனிப்பெயரையும் எபிரெய மூலத்தின் பொருளுக்கு ஏற்ப தெளிவாகத் தருகிறது; יִזֶבֶל என்ற பெயருக்கு வழக்கிலுள்ள தமிழ் வடிவம் ‘யேசபேல்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: וַתְּדַבֵּר אֵלָיו
  choice: அவனிடம் ... என்று கேட்டாள்
  rationale: நேரடிக் கேள்வியை அறிமுகப்படுத்தும் இடத்தில், சொற்படியான ‘பேசினாள்’ என்பதைக் காட்டிலும் ‘என்று கேட்டாள்’ நவீன தமிழில் இயல்பாக உள்ளது.
- source_word: מַה זֶּה
  choice: ஏன் ...?
  rationale: சொற்படியாக ‘இது என்ன?’ என்றாலும், இங்கு ஆகாபின் நிலையைக் குறித்த காரணவினாவாகச் செயல்படுவதால் தமிழில் ‘ஏன்?’ என்று இயல்பாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: רוּחֲךָ סָרָה
  choice: உன் மனம் இப்படி சுணங்கிப்போய்
  rationale: רוּחַ இங்கு உள்ளார்ந்த மனநிலையைக் குறிக்கிறது; סָרָה விலகிய, முகச்சுணக்கமான, மந்தமான நிலையைக் காட்டுகிறது. ‘மனம் ... சுணங்கிப்போய்’ என்பது உருவகத்தை ஓரளவு காத்து இயல்பான தமிழில் உணர்வுநிலையைத் தெரிவிக்கிறது.
- source_word: וְאֵינְךָ אֹכֵל לָחֶם
  choice: நீ உணவு உண்ணாமல் இருப்பது
  rationale: ‘அப்பம் சாப்பிடுதல்’ என்பது உணவருந்துதலைக் குறிக்கும் எபிரெய வழக்கு. நவீன தமிழில் பொருள் தெளிவாக இருக்க ‘உணவு உண்ணுதல்’ பயன்படுத்தப்பட்டுள்ளது; சொற்பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
