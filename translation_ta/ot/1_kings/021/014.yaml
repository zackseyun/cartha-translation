lexical_decisions:
- source_word: וַיִּשְׁלְחוּ
  choice: அப்போது அவர்கள் ... செய்தி அனுப்பி
  rationale: வாவ் தொடர்வினை கதை நிகழ்வை முன்னெடுத்துச் செல்வதால் ‘அப்போது’ என இயல்பாகத் தரப்பட்டுள்ளது. לֵאמֹר அறிமுகப்படுத்தும் செய்தியை அனுப்பிய சூழலில், வெறும் ‘அனுப்பினார்கள்’ என்பதைவிட ‘செய்தி அனுப்பி’ என்பது தமிழில் தெளிவானது.
- source_word: אֶל אִיזֶבֶל
  choice: யேசபேலிடம்
  rationale: אֶל என்பதன் திசை/பெறுநர் பொருளை இயல்பான தமிழ் வேற்றுமை உருபான ‘-இடம்’ தருகிறது; பெயர் வழக்கமான தமிழாக்கத்தில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: לֵאמֹר
  choice: என்று சொன்னார்கள்
  rationale: செய்தியின் உள்ளடக்கத்தை அறிமுகப்படுத்தும் எபிரெய அறிக்கைச் சூத்திரத்திற்கு இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: סֻקַּל
  choice: கல்லெறியப்பட்டு
  rationale: புவால் வினையின் செயப்பாட்டு பொருளைத் தக்கவைக்கிறது. மரணம் இவ்வினையிலேயே வெளிப்படையாகச் சொல்லப்படாததால் ‘கல்லெறிந்து கொல்லப்பட்டார்’ என விரிவாக்கப்படவில்லை.
- source_word: נָבוֹת
  choice: நாபோத்
  rationale: தனிப்பெயர் தமிழ் வேதாகமப் பயன்பாட்டிற்கு ஏற்றவாறு ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וַיָּמֹת
  choice: இறந்துவிட்டார்
  rationale: முறையாக ‘அவர் இறந்தார்’ என்ற தொடர்நிகழ்வைக் குறித்தாலும், உடனடி செய்தி அறிவிப்பில் விளைந்த நிலையையும் நிறைவுற்ற நிகழ்வையும் இயல்பாக வெளிப்படுத்த ‘இறந்துவிட்டார்’ எனத் தரப்பட்டுள்ளது.
