translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. அரசனிடம் பேசுவதால் ‘உமக்கு’ என்ற மரியாதை ஒருமையும் அதற்கேற்ற ‘எழுந்திரும்’, ‘உரிமையாக்கிக்கொள்ளும்’ என்ற ஏவல் வடிவங்களும் பயன்படுத்தப்பட்டுள்ளன. பெயர்கள் ‘யேசபேல்’, ‘ஆகாப்’, ‘நாபோத்’, ‘யெஸ்ரயேல்’ என பொதுவான தமிழ் வேதாகம ஒலிபெயர்ப்பு மரபுக்கு அண்மையாக வைக்கப்பட்டுள்ளன.
