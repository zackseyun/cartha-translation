base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/015.yaml
  text: When Jezebel heard that Naboth had been stoned and had died[a], Jezebel said to Ahab, “Get up, take possession of the vineyard of Naboth the Jezreelite, which he refused to give you for silver, because Naboth is not alive; he is dead.”
translation:
  language: ta
  text: நாபோத் கல்லெறியப்பட்டு இறந்துவிட்டான் என்று யேசபேல் கேள்விப்பட்டபோது, அவள் ஆகாபிடம், “எழுந்திருங்கள்! வெள்ளிக்காக உமக்குக் கொடுக்க மறுத்த[a] யெஸ்ரயேலைச் சேர்ந்த நாபோத்தின் திராட்சைத்தோட்டத்தை உரிமையாக்கிக்கொள்ளுங்கள்; ஏனெனில் நாபோத் உயிரோடு இல்லை; அவன் இறந்துவிட்டான்” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “வெள்ளிக்காக உமக்குக் கொடுக்க மறுத்த” என்பதற்கு, “பணத்திற்கு உமக்கு விற்க மறுத்த” என்றும் மொழிபெயர்க்கலாம். எபிரெய மொழியில் சொல்லுக்குச் சொல், “வெள்ளிக்காக உமக்குக் கொடுக்க மறுத்த” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: கேள்விப்பட்டபோது
  rationale: எபிரெயக் கதைநடைத் தொடக்கச் சூத்திரத்தின் காலத் தொடர்பை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: סֻקַּל
  choice: கல்லெறியப்பட்டு
  rationale: செயப்பாட்டு வடிவத்தையும், கற்களால் தாக்கப்பட்ட குறிப்பிட்ட தண்டனை முறையையும் பாதுகாக்கிறது.
- source_word: וַיָּמֹת
  choice: இறந்துவிட்டான்
  rationale: யேசபேல் பேசுவதற்கு முன்பே நிறைவுற்ற மரணத்தைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: קוּם
  choice: எழுந்திரும்
  rationale: உடனடிக் கட்டளையின் வலிமையைத் தக்கவைக்கும், கண்ணியமான தமிழ் ஒருமை ஏவல் வடிவம்.
- source_word: רֵשׁ
  choice: உரிமையாக்கிக்கொள்ளும்
  rationale: இச்சூழலில் தோட்டத்தைக் கைப்பற்றி உடைமையாக்கும் பொருளைத் தெரிவிக்கிறது; ‘சுதந்தரித்துக்கொள்ளும்’ என்று வாரிசுரிமையை முன்கூட்டியே நிர்ணயிப்பதைத் தவிர்க்கிறது.
- source_word: כֶּרֶם
  choice: திராட்சைத்தோட்டம்
  rationale: இச்சொல்லுக்கான தெளிவான, வழக்கமான தமிழ் இணை.
- source_word: הַיִּזְרְעֵאלִי
  choice: யெஸ்ரயேலனான
  rationale: நாபோத்தின் ஊர் அல்லது இனவிட அடையாளத்தைக் குறிக்கும் எபிரெயப் பெயரடைப் பொருளை நேரடியாகத் தருகிறது.
- source_word: מֵאֵן לָתֵת לְךָ בְכֶסֶף
  choice: பணத்திற்கு உமக்குக் கொடுக்க மறுத்த
  rationale: ‘கொடுக்க’ என்ற மூல வினையைப் பாதுகாக்கிறது; כֶּסֶף என்பதன் பரிமாற்றச் சூழலுக்கேற்ற ‘பணம்’ நவீன வாசகருக்கு இயல்பாக உள்ளது. ‘விற்க’ என்பது தெளிவாக்கும் மாற்றாக அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אֵין נָבוֹת חַי
  choice: நாபோத் உயிரோடு இல்லை
  rationale: அடுத்து வரும் ‘இறந்துவிட்டான்’ என்பதோடு உள்ள மூலத்தின் இருபகுதி வலியுறுத்தலைப் பாதுகாக்கிறது.
- source_word: כִּי מֵת
  choice: அவன் இறந்துவிட்டான்
  rationale: யேசபேலின் கடுமையான இறுதி அறிவிப்பை நேரடியாகத் தருகிறது.
