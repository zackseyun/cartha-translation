base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/004.yaml
  text: So Ahab went into his house sullen and angry because of the word that Naboth the Jezreelite had spoken to him[a], saying, “I will not give you the inheritance of my fathers.” And he lay down on his bed and turned his face away[c][b], and he would not eat bread.
translation:
  language: ta
  text: யெஸ்ரயேலைச் சேர்ந்த நாபோத் தன்னிடம் கூறிய வார்த்தையால் ஆகாப் மனக்கசப்புடனும் கோபத்துடனும் தன் வீட்டிற்குள் சென்றான்[a]; “என் தந்தையரின் உரிமைச் சொத்தை[b] உமக்குக் கொடுக்கமாட்டேன்” என்று அவன் கூறியிருந்தான். ஆகாப் தன் படுக்கையில் படுத்து, முகத்தைத் திருப்பிக்கொண்டான்; உணவு உண்ண மறுத்தான்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தன்னிடம் கூறிய விஷயத்தினால்” என்றும் மொழிபெயர்க்கலாம். இங்குள்ள எபிரெயச் சொல் ‘வார்த்தை,’ ‘விஷயம்,’ அல்லது ‘காரியம்’ எனப் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயில், “என் தந்தையரின் உரிமைச் சொத்து.” “என் முன்னோரின் உரிமைச் சொத்து” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: எபிரெயில், “அப்பம் சாப்பிடவில்லை.” ‘அப்பம்’ என்பது இங்கு பொதுவாக உணவைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: סַר וְזָעֵף
  choice: முகம் சுளித்துக் கோபத்துடன்
  rationale: முதல் சொல் உள்ளடங்கிய, முரட்டுத்தனமான மனக்கசப்பையும் அடுத்த சொல் கோபம் அல்லது எரிச்சலையும் குறிக்கிறது. இவ்விரண்டையும் இயல்பான நவீன தமிழில் இணைத்துக் காட்டுகிறது.
- source_word: עַל הַדָּבָר אֲשֶׁר דִּבֶּר אֵלָיו
  choice: தன்னிடம் கூறிய வார்த்தையினால்
  rationale: דבר என்பது ‘வார்த்தை,’ ‘விஷயம்,’ அல்லது ‘காரியம்’ எனப் பொருள்படலாம்; இங்கு நாபோத்தின் கூற்றைக் குறிப்பிடுவதால் ‘வார்த்தை’ என மொழிபெயர்க்கப்பட்டது.
- source_word: נָבוֹת הַיִּזְרְעֵאלִי
  choice: யெஸ்ரயேலைச் சேர்ந்த நாபோத்
  rationale: இடத்தோடு தொடர்புடைய எபிரெய அடைமொழியை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: נַחֲלַת אֲבוֹתָי
  choice: என் தந்தையரிடமிருந்து வந்த உரிமைச் சொத்து
  rationale: נחלה சாதாரண உடைமையைவிட, தலைமுறையாகக் குடும்பத்துக்குக் கிடைத்த நிலம் அல்லது பரம்பரை உரிமையைச் சுட்டுகிறது. אבות என்பதன் ஆண்பால் பன்மையும் ‘தந்தையர்’ என்பதில் தக்கவைக்கப்படுகிறது.
- source_word: וַיִּשְׁכַּב עַל מִטָּתוֹ
  choice: தன் படுக்கையில் படுத்து
  rationale: படுக்கைக்குச் சென்று படுத்துக்கொண்ட தொடர்ச்சியான நிகழ்வை இயல்பாகக் காட்டுகிறது.
- source_word: וַיַּסֵּב אֶת פָּנָיו
  choice: முகத்தைத் திருப்பிக்கொண்டு
  rationale: வெறும் உடல் அசைவாக மட்டுமல்லாமல், பிறரிடமிருந்து விலகிக்கொள்ளும் சைகையையும் இயல்பாக உணர்த்துகிறது.
- source_word: וְלֹא אָכַל לָחֶם
  choice: உணவு உண்ண மறுத்தான்
  rationale: לחם என்பதன் நேர்ப்பொருள் ‘அப்பம்’; இங்கு அது பொதுவாக உணவைக் குறிக்கும் ஆகுபெயராக வருகிறது. வினைச்சூழல் சாதாரணமாக உண்ணாமல் இருந்ததைவிட வேண்டுமென்றே மறுத்ததை உணர்த்துகிறது.
theological_decisions:
- issue: நாபோத்தின் பரம்பரை உரிமையை விவரிக்கும் ஆண்பால் மூதாதையர் மொழி
  choice: என் தந்தையரிடமிருந்து வந்த உரிமைச் சொத்து
  alternative: என் முன்னோரிடமிருந்து வந்த உரிமைச் சொத்து
  rationale: எபிரெய மூலத்தில் אבות என்ற ஆண்பால் பன்மை உள்ளது. நிலம் தந்தை வழியாக வந்த குடும்ப உரிமை என்ற வரலாற்று மற்றும் குடும்பச் சூழலை ‘தந்தையர்’ தெளிவாகப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. அரசன் என்பதால் மேற்கோளில் மரியாதைப் பன்மையான ‘உமக்கு’ பயன்படுத்தப்பட்டது. மூலத்தின் உணர்ச்சி வரிசையும், குடும்ப நில உரிமையின் வலிமையும், உணவை வேண்டுமென்றே மறுத்த செயலும் பாதுகாக்கப்பட்டுள்ளன.
