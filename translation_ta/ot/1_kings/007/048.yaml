revisions:
- from: 'சாலொமோன் யெகோவாவின் ஆலயத்திலிருந்த எல்லாப் பொருட்களையும் செய்தான்: தங்கப் பலிபீடத்தையும், திருமுகத்து அப்பம் வைக்கப்பட்டிருந்த தங்க மேசையையும் செய்தான்.[a]'
  to: 'சாலொமோன் யெகோவாவின் ஆலயத்திற்குரிய எல்லாப் பொருட்களையும் செய்தான்: தங்கப் பலிபீடத்தையும், சந்நிதி அப்பம்[a] வைக்கப்பட்டிருந்த தங்க மேசையையும்.'
  rationale: The revision avoids an unnecessarily narrow locative reading of the Hebrew relation to Yahweh’s house, restores the single-verb inventory construction, and uses clearer contemporary Tamil for the bread of the Presence. The footnote remains anchored directly to the technical term and supplies both the literal sense and the traditional alternative.
  reviewer_model: gpt-5.6-terra
