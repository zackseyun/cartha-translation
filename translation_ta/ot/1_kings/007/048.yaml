source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ שְׁלֹמֹ֔ה אֵ֚ת כָּל הַ/כֵּלִ֔ים אֲשֶׁ֖ר בֵּ֣ית יְהוָ֑ה אֵ֚ת מִזְבַּ֣ח הַ/זָּהָ֔ב וְ/אֶת הַ/שֻּׁלְחָ֗ן אֲשֶׁ֥ר עָלָ֛י/ו לֶ֥חֶם הַ/פָּנִ֖ים זָהָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/048.yaml
  text: 'And Solomon made all the vessels that were in the house of Yahweh: the golden altar[a], and the table on which was the bread of the Presence[b], of gold.'
translation:
  language: ta
  text: 'சாலொமோன் யெகோவாவின் ஆலயத்திற்குரிய எல்லாப் பொருட்களையும் செய்தான்: தங்கப் பலிபீடத்தையும், சந்நிதி அப்பம்[a] வைக்கப்பட்டிருந்த தங்க மேசையையும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “திருமுகத்து அப்பம்.” எபிரெயத்தில், “சந்நிதியின் அப்பம்”; யெகோவாவின் சந்நிதியில் வைக்கப்பட்ட அப்பம். மரபாக, “சமுகத்தப்பம்” என்றும் அழைக்கப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: செய்தான்
  rationale: עשה என்பது பொதுவாக ‘செய்/உருவாக்கு’ எனப் பொருள்படும்; ஆலயப் பொருட்களின் பட்டியல் சூழலில் ‘செய்தான்’ இயல்பாகவும் மூலத்தின் பரந்த பொருளைத் தக்கவைத்தும் உள்ளது.
- source_word: כָּל הַכֵּלִים
  choice: எல்லாப் பொருட்களையும்
  rationale: כֵּלִים ஆலயத்தில் பயன்படும் பாத்திரங்கள், கருவிகள், பொருட்கள் ஆகியவற்றைக் குறிக்கலாம். இங்கு பலிபீடமும் மேசையும் பட்டியலிடப்படுவதால், ‘பாத்திரங்கள்’ என்பதைவிட ‘பொருட்கள்’ பொருளளவில் பொருத்தமானது.
- source_word: בֵּית יְהוָה
  choice: யெகோவாவின் ஆலயம்
  rationale: בַּיִת என்பதன் நேர்ப்பொருள் ‘வீடு’; இச்சூழலில் அது ஆலயத்தைக் குறிப்பதால் நவீனத் தமிழில் ‘ஆலயம்’ தெளிவானது. יהוה என்ற தனிப்பெயர் ‘யெகோவா’ என ஒலிபெயர்க்கப்படுகிறது.
- source_word: מִזְבַּח הַזָּהָב
  choice: தங்கப் பலிபீடம்
  rationale: எபிரெயச் சேர்க்கை இயல்பான தமிழில் பெயரடைத்தொடராக வழங்கப்பட்டுள்ளது; இது பொன்னோடு தொடர்புடைய பலிபீடத்தைக் குறிக்கிறது.
- source_word: הַשֻּׁלְחָן ... זָהָב
  choice: தங்க மேசை
  rationale: வசனத்தின் இறுதியில் உள்ள זָהָב, மேசையைத் தங்க மேசை என விளக்குகிறது; தமிழில் பெயருக்கு முன் அமைப்பது இயல்பானது.
- source_word: לֶחֶם הַפָּנִים
  choice: திருமுகத்து அப்பம்
  rationale: מִים என்ற பன்மை வடிவம் இங்கு இறைமுகம் அல்லது இறைசந்நிதி என்ற வழிபாட்டுச் சொல்லாட்சியைக் கொண்டுள்ளது. ‘திருமுகத்து அப்பம்’ அந்தச் சொல்லுறவைச் சுருக்கமாகப் பாதுகாக்கிறது; அதன் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: கர்த்தர் / யாவே
  rationale: மூலத்தில் பொதுப்பட்டம் அல்ல, நான்கெழுத்து இறைத் தனிப்பெயர் நேரடியாக உள்ளது. தமிழில் பரவலாக அறியப்பட்ட தனிப்பெயர் வடிவமான ‘யெகோவா’ பயன்படுத்தப்பட்டு, பெயரின் தன்மை பாதுகாக்கப்படுகிறது.
- issue: לֶחֶם הַפָּנִים என்பதிலுள்ள ‘முகம்/சந்நிதி’ கருத்து
  choice: திருமுகத்து அப்பம்
  alternative: சந்நிதி அப்பம் / படையல் அப்பம்
  rationale: மூலத்தின் ‘முகம்/சந்நிதி’ உருவகத்தை அழிக்காமல் வைத்திருக்க ‘திருமுகத்து’ தேர்ந்தெடுக்கப்பட்டது. இது இறைமுகத்துக்கு முன் வைக்கப்படும் அப்பம் என்ற வழிபாட்டுச் சார்பைச் சுட்டுகிறது; ‘படையல்’ என்பது மூலத்தில் வெளிப்படையாக இல்லாத விளக்கத்தைச் சேர்க்கக்கூடும்.
translation_notes:
  register: நவீனத் தரத் தமிழ், எளிதில் புரியும் ஆனால் வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமான நடை. எபிரெய வாக்கியத்தின் பட்டியல் அமைப்பு தமிழில் இயல்பாக அமைய இரண்டாவது ‘செய்தான்’ சேர்க்கப்பட்டது. ‘ஆலயம்’ என்பது நேர்ப்பொருளான ‘வீடு’ என்பதற்கான சூழல்சார் மொழிபெயர்ப்பு.
