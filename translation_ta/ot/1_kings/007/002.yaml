base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/002.yaml
  text: He built the House of the Forest of Lebanon[a], one hundred cubits long, fifty cubits wide, and thirty cubits high, on four rows of cedar pillars[c][b], with cedar beams on the pillars.
translation:
  language: ta
  text: அவர் ‘லெபனோன் வன இல்ல’த்தைக் கட்டினார். அது நூறு முழம் நீளமும், ஐம்பது முழம் அகலமும், முப்பது முழம் உயரமும் கொண்டிருந்தது.[c] அது கேதுரு மரத் தூண்களின் நான்கு வரிசைகளின்மேல்[a] அமைக்கப்பட்டிருந்தது; அந்தத் தூண்களின்மேல் கேதுரு மர உத்தரங்கள்[b] வைக்கப்பட்டிருந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கேதுரு மரத் தூண்களின் நான்கு வரிசைகளுடன்”; இங்குள்ள எபிரெய முன்னிடைச்சொல் கட்டிடம் அவற்றின்மேல் தாங்கப்பட்டிருந்ததையோ, அவற்றுடன் அமைக்கப்பட்டிருந்ததையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “உத்தரங்கள்” என்று மொழிபெயர்க்கப்பட்டுள்ள எபிரெயச் சொல், சொற்பட “வெட்டப்பட்ட கேதுரு மரத் துண்டுகள்” எனப் பொருள்படும்; அது உத்தரங்கள், கூரைச் சட்டங்கள் அல்லது வேறொரு செதுக்கப்பட்ட கேதுரு மரக் கட்டுமான உறுப்பைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: சொற்பட, “அதன் நீளம் நூறு முழம், அதன் அகலம் ஐம்பது முழம், அதன் உயரம் முப்பது முழம்.”
    reason: previous_rendering
lexical_decisions:
- source_word: וַיִּבֶן
  choice: அவர் கட்டினார்
  rationale: வாவ் தொடர்வினை கதையை முன்னெடுக்கும் எளிய இறந்தகாலச் செயலைக் குறிக்கிறது; தமிழில் இயல்பான உரைநடைக்காகத் தொடக்கத்தில் ‘மேலும்’ சேர்க்கப்படவில்லை.
- source_word: בֵּית יַעַר הַלְּבָנוֹן
  choice: ‘லெபனோன் வன மாளிகை’
  rationale: இது கட்டிடத்தின் பெயர். בֵּית என்பதன் அடிப்படைப் பொருள் ‘வீடு’ என்றாலும், அரச வளாகத்திலுள்ள இப்பெரிய கட்டிடத்தைக் குறிக்கும் பெயரில் ‘மாளிகை’ என்பது நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது; ‘லெபனோன் வனம்’ என்ற பெயரமைப்பும் தக்கவைக்கப்படுகிறது.
- source_word: מֵאָה אַמָּה אָרְכּוֹ וַחֲמִשִּׁים אַמָּה רָחְבּוֹ וּשְׁלֹשִׁים אַמָּה קוֹמָתוֹ
  choice: நூறு முழம் நீளமும், ஐம்பது முழம் அகலமும், முப்பது முழம் உயரமும் கொண்டிருந்தது
  rationale: மூலத்தின் மூன்று இணையான அளவீடுகளும் பாதுகாக்கப்படுகின்றன. பழங்கால அளவான אַמָּה என்பதற்கு வழக்கமான வேதாகமத் தமிழ் சொல்லான ‘முழம்’ பயன்படுத்தப்படுகிறது.
- source_word: עַל אַרְבָּעָה טוּרֵי עַמּוּדֵי אֲרָזִים
  choice: கேதுரு மரத் தூண்களின் நான்கு வரிசைகள்மீது
  rationale: טוּרֵי என்பது ‘வரிசைகள்’, עַמּוּדֵי என்பது ‘தூண்கள்’. עַל என்பதன் அடிப்படை இடவியல் பொருளை ‘மீது’ தக்கவைக்கிறது; அது ஆதரவையோ அமைப்பையோ குறிக்கக்கூடியதால் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וּכְרֻתוֹת אֲרָזִים
  choice: கேதுரு மர உத்தரங்கள்
  rationale: כְרֻתוֹת என்பது சொற்பட ‘வெட்டப்பட்ட துண்டுகள்’; கட்டிடச் சூழலில் தூண்கள்மீது இடப்படும் செதுக்கப்பட்ட மர உத்தரங்கள் எனப் பொருள்படுவது சாத்தியம். ‘உத்தரங்கள்’ என்பது கிடைமட்ட கட்டுமான மரக்கட்டைகளைக் குறிக்கும் துல்லியமான தமிழ் சொல்.
- source_word: עַל הָעַמּוּדִים
  choice: அந்தத் தூண்கள்மீது
  rationale: உத்தரங்கள் தூண்களின் மேல் வைக்கப்பட்டிருந்த இடவியல் உறவை நேரடியாகக் காட்டுகிறது.
