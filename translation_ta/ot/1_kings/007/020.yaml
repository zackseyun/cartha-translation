  source_fidelity: 'மூல எபிரெயத்தின் கடினமான கட்டடக்கலை இடவியல் அமைப்பை மொழிபெயர்ப்பு நம்பகமாகப் பாதுகாக்கிறது: தூண்களின்மேலுள்ள தூண்முடிகள், வலைப்பின்னலோடு தொடர்புடைய புடைப்பு, மாதுளை அலங்காரங்கள், இருநூறு, வரிசைகள், மற்றும் இரண்டாவது தூண்முடி ஆகிய எல்லா கூறுகளும் உள்ளன. ‘அருகிலிருந்த’ என்பது לְעֵבֶר என்பதன் இச்சூழலில் உறுதியற்ற இடவுறவை அளவுக்கு மீறித் துல்லியப்படுத்தாமல் கையாள்கிறது.'
  naturalness: நவீன தரமான தமிழில் வாசிக்கத்தக்கதும் கண்ணியமானதும் ஆக உள்ளது. நீளமான, கட்டடக்கலை விவரிப்பான எபிரெய வாக்கியத்தை இரண்டு வாக்கியங்களாகப் பிரித்திருப்பது தெளிவுக்கு உதவுகிறது. ‘தூண்முடி,’ ‘புடைப்பு,’ ‘வலைப்பின்னல்,’ ‘மாதுளை வடிவங்கள்’ ஆகியவை சூழலுக்கேற்ற இயல்பான சொற்கள்.
