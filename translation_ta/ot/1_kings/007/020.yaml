  text: וְ/כֹתָרֹ֗ת עַל שְׁנֵי֙ הָֽ/עַמּוּדִ֔ים גַּם מִ/מַּ֨עַל֙ מִ/לְּ/עֻמַּ֣ת הַ/בֶּ֔טֶן אֲשֶׁ֖ר לְ/עֵ֣בֶר שבכה וְ/הָ/רִמּוֹנִ֤ים מָאתַ֨יִם֙ טֻרִ֣ים סָבִ֔יב עַ֖ל הַ/כֹּתֶ֥רֶת הַ/שֵּׁנִֽית־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/020.yaml
  text: And the capitals were on the two pillars[a], also above, opposite the bulge that was beside the latticework; and the pomegranates were two hundred, in rows all around[c][b], on the second capital.
translation:
  language: ta
  text: இரண்டு தூண்களின்மேல் இருந்த தூண்முடிகள், வலைப்பின்னலுக்கு அருகிலிருந்த புடைப்புக்கு நேராக மேலேயும் அமைந்திருந்தன.[a] இரண்டாவது தூண்முடியைச் சுற்றிலும் வரிசைகளாக இருநூறு மாதுளை வடிவங்கள் இருந்தன.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “புடைப்பு” என்பதற்கான எபிரெயச் சொல் நேரடியாக “வயிறு” என்று பொருள்படும்; இங்கு தூண்முடியின் வட்டமாகப் பருத்த பகுதியைக் குறிக்கலாம். “வலைப்பின்னல்” என்பது தூண்முடியோடு இணைக்கப்பட்ட அலங்கார வலை அமைப்பு.
    reason: lexical_and_cultural_note
  - marker: b
    text: “இரண்டாவது தூண்முடி” என்பதை “மற்ற தூண்முடி” என்றும் மொழிபெயர்க்கலாம். இக்கட்டட விவரிப்பில் எபிரெயச் சொல் இரண்டாவது தூணிலுள்ள இணையான தூண்முடியை வேறுபடுத்திக் காட்டலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: כֹתָרֹת / הַכֹּתֶרֶת
  choice: தூண்முடிகள் / தூண்முடி
  rationale: தூணின் உச்சியில் அமைந்த அலங்காரக் கட்டமைப்பைக் குறிக்கும் கட்டடக்கலைச் சொல்லை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: עַל שְׁנֵי הָעַמּוּדִים
  choice: இரண்டு தூண்களின்மேல்
  rationale: இரு தூண்களுக்கும் மேலுள்ள நிலையை நேரடியாகக் காட்டுகிறது.
- source_word: גַּם מִמַּעַל
  choice: மேலேயும்
  rationale: גַּם என்பதன் சேர்க்கைப் பொருளையும் מִמַּעַל என்பதன் உயர்நிலைப் பொருளையும் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: מִלְעֻמַּת הַבֶּטֶן
  choice: புடைப்புக்கு நேராக
  rationale: הַבֶּטֶן என்பதன் சொற்பொருள் ‘வயிறு’; இங்கு தூண்முடியின் வட்டமான பருத்த பகுதியைக் குறிக்கும் உருவகத்தை ‘புடைப்பு’ என இயல்பாகத் தருகிறது. לְעֻמַּת என்பதற்கு ‘நேராக’ என இடவுறவைத் தெரிவிக்கிறது.
- source_word: אֲשֶׁר לְעֵבֶר שבכה
  choice: வலைப்பின்னலுக்கு அருகிலிருந்த
  rationale: שבכה என்பது அலங்கார வலை அல்லது பின்னல். சிக்கலான இடவமைப்பில் לְעֵבֶר என்பதற்குரிய ‘அருகில்/அப்புறத்தில்’ என்ற சாத்தியங்களில், உறுதியற்ற துல்லியத்தைத் திணிக்காமல் வாசிக்கத்தக்க இடவுறவைத் தருகிறது.
- source_word: הָרִמּוֹנִים
  choice: மாதுளை வடிவங்கள்
  rationale: இச்சூழலில் உண்மையான பழங்களல்ல, மாதுளை உருவ அலங்காரங்களே குறிக்கப்படுவதால் அதைத் தெளிவுபடுத்துகிறது.
- source_word: מָאתַיִם
  choice: இருநூறு
  rationale: எண்ணிக்கையின் நேரடி மொழிபெயர்ப்பு.
- source_word: טֻרִים סָבִיב
  choice: சுற்றிலும் வரிசைகளாக
  rationale: அலங்காரங்கள் வளையமாகப் பல வரிசைகளில் அமைந்திருந்ததை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: עַל הַכֹּתֶרֶת הַשֵּׁנִית
  choice: இரண்டாவது தூண்முடியைச் சுற்றிலும்
  rationale: הַשֵּׁנִית என்பதன் நேரடியான ‘இரண்டாவது’ என்ற பொருளைப் பாதுகாக்கிறது; עַל மற்றும் סָבִיב இணைந்து அலங்காரங்களின் சுற்றியமைப்பைக் காட்டுகின்றன.
