translation_notes:
  register: நவீன தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. சிக்கலான எபிரெயக் கட்டடக்கலை வாக்கிய அமைப்பு வாசிப்புத் தெளிவுக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டது. ‘தூண்முடி,’ ‘புடைப்பு,’ ‘வலைப்பின்னல்’ ஆகியவை பொதுவாசகர்களுக்குப் புரியக்கூடிய கட்டட விளக்கச் சொற்களாகத் தேர்ந்தெடுக்கப்பட்டன; மூலத்தின் இடவியல் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
