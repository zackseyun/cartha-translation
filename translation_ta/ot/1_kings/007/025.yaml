base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/025.yaml
  text: 'It stood on twelve oxen: three facing north[a], three facing west, three facing south, and three facing east; and the Sea was on them above[b], and all their rear parts were inward.'
translation:
  language: ta
  text: அது பன்னிரண்டு காளைகளின்மேல் நின்றது. அவற்றில் மூன்று வடக்கை நோக்கியும், மூன்று மேற்கை நோக்கியும்[a], மூன்று தெற்கை நோக்கியும், மூன்று கிழக்கை நோக்கியும் இருந்தன. கடல் அவற்றின்மேல் இருந்தது; அவற்றின் பின்பகுதிகள் அனைத்தும் உட்புறத்தை நோக்கியிருந்தன.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மேற்கு” என்பதற்கான எபிரெயச் சொல் நேரடியாக “கடலை நோக்கி” என்று பொருள்படும்; வேதாகம எபிரெயத்தில் இது மேற்கைக் குறிக்கும் வழக்கமான சொற்றொடர்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவற்றின் எல்லாப் பின்புறங்களும் உள்ளே நோக்கியிருந்தன.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹמֵד
  choice: நின்றது
  rationale: עמד என்பதன் Qal நிகழ்காலப் பெயரெச்சம், முந்தைய வசனத்திலுள்ள கடலைக் குறிக்கும் பயனிலை விளக்கமாக வருகிறது; தமிழ் வரலாற்று நடையில் “நின்றது” இயல்பானது.
- source_word: בָּקָר
  choice: காளைகள்
  rationale: இந்த ஆலயக் கட்டமைப்பு விவரிப்பில் பாத்திரத்தைத் தாங்கும் பன்னிரண்டு மாட்டு உருவங்களைச் சுட்டுகிறது; பாலினத்தைத் தெளிவாக நிர்ணயிக்க இயலாவிட்டாலும், தமிழ் வேதாகமக் கட்டடச் சூழலில் “காளைகள்” தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: פֹנִים
  choice: நோக்கியும்
  rationale: சொற்பொருளில் “முகங்கள்” என்றாலும், மீண்டும் வரும் திசை அமைப்பில் உருவங்கள் எந்தத் திசையை நோக்கியிருந்தன என்பதைக் குறிக்கிறது.
- source_word: צָפוֹנָה
  choice: வடக்கை
  rationale: திசைச் சுட்டும் -ה வடிவம் வடக்கு நோக்கிய அமைப்பைக் குறிக்கிறது.
- source_word: יָמָּה
  choice: மேற்கை
  rationale: சொற்பொருளில் “கடலை நோக்கி” என்றாலும், நான்கு திசைகளின் பட்டியலில் இது வழக்கமான எபிரெய திசைப்பெயராக மேற்கைக் குறிக்கிறது.
- source_word: נֶגְבָּה
  choice: தெற்கை
  rationale: இங்கு நெகேப் நிலப்பகுதியை அல்ல, நான்கு முதன்மைத் திசைகளில் தெற்கைக் குறிக்கிறது.
- source_word: מִזְרָחָה
  choice: கிழக்கை
  rationale: கிழக்கு நோக்கிய அமைப்பைக் குறிக்கும் திசை வடிவம்.
- source_word: הַיָּם
  choice: கடல்
  rationale: சூழலில் இது பெரிய வார்ப்புப் பாத்திரத்துக்கான சிறப்புப் பெயர்; எபிரெய உருவகப் பெயரைத் தமிழிலும் தக்கவைக்கிறது.
- source_word: עֲלֵיהֶם מִלְמָעְלָה
  choice: அவற்றின்மேல் மேலே இருந்தது
  rationale: கடல் காளைகளுக்கு மேலாக அவற்றின்மேல் இருந்ததை எபிரெய உரைக்கு நெருக்கமாகச் சொல்கிறது; “வைக்கப்பட்டிருந்தது” என்ற செயப்பாட்டை தேவையின்றி சேர்க்கவில்லை.
- source_word: אֲחֹרֵיהֶם
  choice: அவற்றின் பின்பகுதிகள்
  rationale: விலங்கு உருவங்களின் பின்னுள்ள உடற்பகுதிகளை மரியாதையான, தெளிவான தமிழில் குறிக்கிறது.
- source_word: בָּיְתָה
  choice: உட்புறத்தை நோக்கி
  rationale: திசை வடிவம் மையத்தை அல்லது உள்ளே இருக்கும் பகுதியை நோக்கிய அமைப்பைக் குறிக்கிறது.
