base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/004.yaml
  text: There were three rows of window frames[a], with window opposite window three times.
translation:
  language: ta
  text: சாளரச் சட்டங்கள்[a] மூன்று வரிசைகளில் இருந்தன; சாளரத்திற்கு எதிரே சாளரம் மூன்று முறை அமைந்திருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மூன்று தளங்களிலும் சாளரத்திற்கு எதிரே சாளரம் அமைந்திருந்தது.” எபிரெய மொழியில் நேரடியாக, “சாளரத்திற்கு சாளரம் மூன்று முறை” என்று உள்ளது; இது மூன்று அடுக்குகளில் மீண்டும் அமைக்கப்பட்ட ஒரே மாதிரியான கட்டமைப்பைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁקֻפִים
  choice: சாளரச் சட்டங்கள்
  rationale: இச்சொல் வெறும் சாளரங்களைக் காட்டிலும் சட்டமிடப்பட்ட திறப்புகளை அல்லது சாளரக் கட்டமைப்புகளைக் குறிக்கிறது; கட்டடக்கலைச் சூழலில் ‘சாளரச் சட்டங்கள்’ பொருத்தமானது.
- source_word: שְׁלֹשָׁה טוּרִים
  choice: மூன்று வரிசைகளாக
  rationale: טוּר என்பது தொடர்ச்சியான வரிசை அல்லது ஒழுங்கமைப்பைக் குறிக்கிறது; இங்கு இயல்பான கட்டடக்கலைச் சொல்லாக்கம் ‘மூன்று வரிசைகள்’ என்பதாகும்.
- source_word: מֶחֱזָה
  choice: சாளரம்
  rationale: பார்வைக்காக அல்லது வெளிச்சத்திற்காக அமைந்த திறப்பைக் குறிக்கும் இச்சொல்லுக்கு, இணை கட்டடக்கலைச் சூழலில் ‘சாளரம்’ தெளிவான மொழிபெயர்ப்பு.
- source_word: אֶל מֶחֱזָה
  choice: சாளரத்திற்கு எதிரே சாளரம்
  rationale: אֶל இங்கு திறப்புகளுக்கிடையிலான எதிரெதிர் அமைப்பையோ நோக்குநிலையையோ குறிக்கிறது; இத்தொடர் அந்தப் பரஸ்பர அமைப்பைத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: שָׁלֹשׁ פְּעָמִים
  choice: மூன்று முறை
  rationale: எபிரெயில் நேரடியாக ‘மூன்று முறை’ என்று உள்ளது. கட்டட அமைப்பில் இது மூன்று தளங்களில் மீண்டும் அமைந்ததைக் குறிக்கக்கூடும்; முதன்மை உரை நேரடிப் பொருளை வைத்திருக்கிறது.
