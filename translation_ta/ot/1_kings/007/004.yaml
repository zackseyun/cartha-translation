translation_notes:
  register: நவீன நிலையான தமிழில், கட்டடக்கலை விவரத்தைத் தெளிவாகவும் கண்ணியமாகவும் வழங்கப்பட்டுள்ளது. எபிரெய் உரையின் ‘மூன்று முறை’ என்ற தெளிவின்மை முதன்மை உரையில் காக்கப்பட்டு, சாத்தியமான ‘மூன்று தளங்கள்’ என்ற பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
