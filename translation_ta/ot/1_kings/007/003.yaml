  text: It was paneled with cedar above[a], over the side chambers that were on the pillars, forty-five in all, fifteen to a row.
translation:
  language: ta
  text: தூண்களின் மேல் இருந்த பக்கவாட்டு அமைப்புகளுக்கு மேலே, அது கேதுரு மரத்தால் மூடப்பட்டிருந்தது.[a] அவை மொத்தம் நாற்பத்தைந்து; ஒவ்வொரு வரிசையிலும் பதினைந்து இருந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தூண்களின் மேல் இருந்த பக்கவாட்டு அறைகளுக்கு மேலே, அது கேதுரு மரப் பலகைகளால் மூடப்பட்டிருந்தது’ என்றும் மொழிபெயர்க்கலாம். இங்குள்ள எபிரேயக் கட்டடக்கலைச் சொற்களின் துல்லியமான பொருள் தெளிவில்லை; குறிப்பாக צלעות என்பது ‘பக்கங்கள்,’ ‘பக்கவாட்டு அமைப்புகள்,’ அல்லது ‘பக்க அறைகள்’ எனப் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָפֻן
  choice: மூடப்பட்டிருந்தது
  rationale: ספן என்ற செயலின் செயப்பாட்டு வடிவம் ஒரு பொருளால் மேற்பரப்பை மூடுதல் அல்லது பலகையிடுதலைக் குறிக்கிறது. கட்டடத்தின் துல்லிய அமைப்பு உறுதியில்லாததால், ‘பலகையிடப்பட்டிருந்தது’ என்பதைவிட ‘மூடப்பட்டிருந்தது’ மூலத்தின் பொருள் வரம்பை நன்றாகப் பாதுகாக்கிறது.
- source_word: בָּאֶרֶז
  choice: கேதுரு மரத்தால்
  rationale: בְּ இங்கு கட்டுமானப் பொருளைக் குறிக்கிறது. ‘கேதுரு மரத்தால்’ என்பது நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: מִמַּעַל
  choice: மேற்பகுதி
  rationale: இந்த இடவியல் சொல் கட்டடத்தின் மேலுள்ள பகுதியைக் குறிக்கிறது. தமிழில் ‘அதன் மேற்பகுதி’ என வழங்குவது வாக்கியத் தொடர்பை இயல்பாக்குகிறது.
- source_word: עַל הַצְּלָעוֹת
  choice: பக்கவாட்டு அமைப்புகளுக்கு மேலாக
  rationale: צלעות என்பதன் அடிப்படைப் பொருள் ‘பக்கங்கள்/விலா எலும்புகள்’; கட்டடச் சூழலில் அது பக்க அறைகள், பக்கவாட்டு கட்டமைப்புகள் அல்லது தாங்கு உறுப்புகளைக் குறிக்கலாம். குறிப்பிட்ட ஓர் அமைப்பை உறுதிப்படுத்தாமல் ‘பக்கவாட்டு அமைப்புகள்’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: אֲשֶׁר עַל הָעַמּוּדִים
  choice: தூண்கள்மேல் இருந்த
  rationale: உறவுப்பெயர் தொடர், அந்த அமைப்புகள் தூண்களின் மேல் இருந்ததை நேரடியாகக் குறிப்பிடுகிறது.
- source_word: אַרְבָּעִים וַחֲמִשָּׁה
  choice: மொத்தம் நாற்பத்தைந்து
  rationale: இந்த எண்ணிக்கை முன் குறிப்பிடப்பட்ட பக்கவாட்டு அமைப்புகளின் மொத்த எண்ணிக்கையாகப் புரிகிறது; ‘மொத்தம்’ என்பது அடுத்துள்ள வரிசை விநியோகத்துடன் அதன் தொடர்பைத் தெளிவாக்குகிறது.
- source_word: חֲמִשָּׁה עָשָׂר הַטּוּר
  choice: ஒவ்வொரு வரிசையிலும் பதினைந்து
  rationale: טור என்பது வரிசை அல்லது அடுக்கு. மொத்தம் நாற்பத்தைந்து என்ற எண்ணிக்கையை வரிசைக்கு பதினைந்து எனப் பகுத்துக் கூறும் பொருள் தமிழில் இயல்பாக வழங்கப்பட்டுள்ளது.
