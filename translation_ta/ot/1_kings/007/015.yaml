  text: וַ/יָּ֛צַר אֶת שְׁנֵ֥י הָ/עַמּוּדִ֖ים נְחֹ֑שֶׁת שְׁמֹנֶ֨ה עֶשְׂרֵ֜ה אַמָּ֗ה קוֹמַת֙ הָ/עַמּ֣וּד הָ/אֶחָ֔ד וְ/חוּט֙ שְׁתֵּים עֶשְׂרֵ֣ה אַמָּ֔ה יָסֹ֖ב אֶת הָ/עַמּ֥וּד הַ/שֵּׁנִֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/015.yaml
  text: He cast the two bronze pillars; the height of the one pillar was eighteen cubits[a], and a line of twelve cubits measured around it.
translation:
  language: ta
  text: அவன் வெண்கலத்தால் இரண்டு தூண்களை வார்த்தான். ஒரு தூணின் உயரம் பதினெட்டு முழம்; பன்னிரண்டு முழம் நீளமுள்ள ஒரு கயிறு இரண்டாவது தூணைச் சுற்றியிருந்தது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய உரை சொற்பட, “இரண்டாவது தூணை” என்று கூறுகிறது. இதை, “பன்னிரண்டு முழமுள்ள ஒரு கயிறு அதைச் சுற்றியிருந்தது” என்று சிலர் பொருள்படுத்துகின்றனர்; சூழலில் இரு தூண்களும் ஒரே அளவுடையவை என்பது உட்குறிப்பாக இருக்கலாம்.
    reason: எபிரெய உரையின் நேரடி சொற்றொடருக்கும், இரு தூண்களின் ஒரே அளவை உணர்த்தும் சூழல்சார் புரிதலுக்கும் இடையிலான பதற்றத்தைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: וַיָּצַר
  choice: வார்த்தான்
  rationale: வெண்கலப் பொருட்களை உருவாக்கும் இச்சூழலில், உலோகத்தை உருக்கி அச்சில் வார்ப்பதைக் குறிக்கும் இயல்பான தமிழ் சொல்.
- source_word: שְׁנֵי הָעַמּוּדִים
  choice: இரண்டு தூண்கள்
  rationale: ஆலயக் கட்டுமானச் சூழலில் עַמּוּד என்பதற்கு தெளிவான, வழக்கமான தமிழ் இணைச்சொல் ‘தூண்’.
- source_word: נְחֹשֶׁת
  choice: வெண்கலம்
  rationale: பண்டைய உலோகப் பயன்பாட்டுச் சூழலில் இச்சொல் பொதுவாக வெண்கலத்தைக் குறிக்கிறது; ‘பித்தளை’ காலப்பொருத்தமற்றதாகவும் ‘செம்பு’ மிகக் குறுகியதாகவும் அமையலாம்.
- source_word: שְׁמֹנֶה עֶשְׂרֵה אַמָּה
  choice: பதினெட்டு முழம்
  rationale: பண்டைய அளவலகை மாற்றாமல், தமிழில் மரபாகவும் புரியத்தக்கதாகவும் உள்ள ‘முழம்’ பயன்படுத்தப்பட்டது.
- source_word: קוֹמַת הָעַמּוּד הָאֶחָד
  choice: ஒரு தூணின் உயரம்
  rationale: எபிரெய பெயர்ச்சொல் அமைப்பின் பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: וְחוּט
  choice: ஒரு கயிறு
  rationale: חוּט என்பது நூல், கயிறு அல்லது அளவுக்கயிறு எனப் பொருள்படும்; சுற்றளவை அளக்கும் சூழலில் ‘கயிறு’ இயல்பான தேர்வு.
- source_word: שְׁתֵּים עֶשְׂרֵה אַמָּה
  choice: பன்னிரண்டு முழ நீளமுள்ள
  rationale: கயிற்றின் அளவைத் தமிழில் தெளிவாக இணைக்கும் இயல்பான வடிவம்.
- source_word: יָסֹב
  choice: சுற்றியிருந்தது
  rationale: வினைச்சொல்லின் நேரடிப் பொருளான ‘சுற்றுதல்’ பாதுகாக்கப்படுகிறது; அளவிடும் நோக்கத்தைத் தேவையின்றி உரைக்குள் சேர்க்கவில்லை.
- source_word: הָעַמּוּד הַשֵּׁנִי
  choice: இரண்டாவது தூணை
  rationale: மசோரா எபிரெய உரையில் உள்ள வரிசை எண்ணை நேரடியாகப் பாதுகாக்கிறது; அதை ‘அதை’ அல்லது ‘ஒவ்வொரு தூணையும்’ என்று அமைதியாக மாற்றவில்லை.
