  text: And the capitals that were on the tops of the pillars were made like a lily blossom in the portico[c][b][a], four cubits.
translation:
  language: ta
  text: தூண்களின் உச்சியில் இருந்த தலைப்பகுதிகள், முகமண்டபத்தில்[a] அல்லி மலர் வடிவில் செய்யப்பட்டிருந்தன[b]; அவை நான்கு முழம்[c] அளவுடையவை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நுழைவு மண்டபத்தில்” அல்லது “முன்மண்டபத்தில்.” எபிரெயச் சொல் ஆலயக் கட்டடத்தின் நுழைவு மண்டபத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அல்லியைப் போல.” இங்குள்ள எபிரெயச் சொல் தாமரை வடிவ அலங்காரத்தைக் குறிக்கலாம் என்றும் சிலர் கருதுகின்றனர்.
    reason: lexical_alternative
  - marker: c
    text: எபிரெயத்தில், “நான்கு முழம்.” இது தலைப்பகுதியின் அல்லி மலர் வடிவப் பகுதியின் உயரத்தைக் குறிக்கலாம்; ஆனால் பரிமாணம் வெளிப்படையாகக் குறிப்பிடப்படவில்லை.
    reason: lexical_alternative
