  yaml_path: translation/ot/1_kings/007/018.yaml
  text: He made the pillars[a], and two rows all around on the one latticework, to cover the capitals that were on top of the pomegranates[b]; and so he did for the second capital.
translation:
  language: ta
  text: அவன் தூண்களைச் செய்தான்; ஒரு வலைப்பின்னல் அலங்காரத்தைச் சுற்றி இரண்டு வரிசைகளையும் அமைத்தான்; மாதுளைகளின்[a] மேலிருந்த தூண் தலைப்பகுதிகளை மூடுவதற்காக. இரண்டாவது தூண் தலைப்பகுதிக்கும் அவ்வாறே செய்தான்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் நேரடியாக, “மாதுளைகள்.” இவை தூண் தலைப்பகுதிகளில் இருந்த மாதுளை வடிவ அலங்காரங்களைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இந்த வசனத்தின் எபிரெயச் சொற்றொடர் கடினமானது. சிலர், ஒவ்வொரு தூண் தலைப்பகுதியின் வலைப்பின்னல் அலங்காரத்தைச் சுற்றியிருந்த மாதுளை அலங்கார வரிசைகளையே இது விவரிப்பதாகப் புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: செய்தான்
  rationale: கதைத் தொடரில் வரும் பொதுவான வினைச்சொல்லின் நேரடியான, இயல்பான மொழிபெயர்ப்பு.
- source_word: הָעַמּוּדִים
  choice: தூண்களை
  rationale: கட்டடக்கலைச் சூழலில் עַמּוּדִים என்பது தூண்களைக் குறிக்கிறது; நவீனத் தமிழில் தெளிவான வழக்கு.
- source_word: שְׁנֵי טוּרִים
  choice: இரண்டு வரிசைகளை
  rationale: טוּר என்பது தொடராக அமைந்த வரிசையைக் குறிக்கிறது; அலங்கார அமைப்புக்கு இது பொருத்தமானது.
- source_word: סָבִיב
  choice: சுற்றிலும்
  rationale: அமைப்பு முழுவதையும் வளைத்துச் சூழ்ந்திருக்கும் இடவியல் பொருளைப் பாதுகாக்கிறது.
- source_word: הַשְּׂבָכָה
  choice: வலைப்பின்னல் அலங்காரம்
  rationale: வலை போன்ற கட்டட அலங்கார வேலையை வாசகருக்குத் தெளிவாகவும் இயல்பாகவும் எடுத்துரைக்கிறது.
- source_word: לְכַסּוֹת
  choice: மூடினான்
  rationale: நோக்கத்தைக் குறிக்கும் எபிரெய infinitive-இன் அடிப்படைப் பொருள் ‘மூடுதல்’; தமிழில் வாக்கியம் இயல்பாக அமைய finite verb ஆக வழங்கப்பட்டது.
- source_word: הַכֹּתָרֹת
  choice: தூண் தலைப்பகுதிகளை
  rationale: கட்டடக்கலையில் தூணின் மேலுள்ள capital-ஐக் குறிக்கிறது; தொழில்நுட்பச் சொல்லைவிடப் பொதுவாசகருக்குப் புரியும் விளக்கமான சொற்றொடர்.
- source_word: הָרִמֹּנִים
  choice: மாதுளம்பழங்களின்
  rationale: எபிரெயச் சொல்லின் நேரடிப் பொருளைத் தக்கவைக்கிறது; இவை மாதுளை வடிவ அலங்காரங்களாக இருக்கலாம் என்பது அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: וְכֵן עָשָׂה
  choice: அவ்வாறே செய்தான்
  rationale: அதே வேலையை இணையான மற்றொரு அமைப்பிலும் திரும்பச் செய்ததைக் குறிக்கும் இயல்பான தமிழ்.
- source_word: לַכֹּתֶרֶת הַשֵּׁנִית
  choice: இரண்டாவது தூண் தலைப்பகுதிக்கும்
  rationale: இரண்டாம் தூணின் இணையான capital-ஐ நேரடியாகக் குறிக்கிறது.
