  register: நவீன நிலையான தமிழில், கட்டடக்கலை விவரத்தைப் பொதுவாசகர் புரிந்துகொள்ளும் வகையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய உரையின் சிக்கலான சொற்றொடர் அமைப்பைத் தமிழில் வாசிக்கத்தக்கதாக மாற்றியபோதும், அதன் உறுதியற்ற தொடர்புகள் அடிக்குறிப்புகளில் வெளிப்படையாகப் பாதுகாக்கப்பட்டன.
