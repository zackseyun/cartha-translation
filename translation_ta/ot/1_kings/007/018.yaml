- from: அவன் தூண்களைச் செய்தான்.[a] ஒரு வலைப்பின்னல் அலங்காரத்தைச் சுற்றிலும் இரண்டு வரிசைகளை அமைத்து, மாதுளம்பழங்களின் மேலிருந்த தூண் தலைப்பகுதிகளை மூடினான்; இரண்டாவது தூண் தலைப்பகுதிக்கும் அவ்வாறே செய்தான்.[b]
  to: அவன் தூண்களைச் செய்தான்; ஒரு வலைப்பின்னல் அலங்காரத்தைச் சுற்றி இரண்டு வரிசைகளையும் அமைத்தான்; மாதுளைகளின்[a] மேலிருந்த தூண் தலைப்பகுதிகளை மூடுவதற்காக. இரண்டாவது தூண் தலைப்பகுதிக்கும் அவ்வாறே செய்தான்.[b]
  rationale: மூல உரையின் ‘தூண்கள்’ என்பதை மாற்றும் தவறான அடிக்குறிப்பு நீக்கப்பட்டு, ‘மாதுளைகள்’ என்ற சொல்லின் அலங்காரப் பயன்பாடு அதற்குரிய இடத்தில் விளக்கப்பட்டுள்ளது. நோக்கத்தைக் குறிக்கும் எபிரெய infinitive ‘மூடுவதற்காக’ எனத் தரப்பட்டுள்ளது. கடினமான கட்டடக்கலைத் தொடர்பின் மாற்றுப் புரிதல் அடிக்குறிப்பு b-இல், உரையின் உறுதியற்ற தன்மையை மீறாமல் பாதுகாக்கப்பட்டுள்ளது.
