    rationale: எபிரெய உரையில் הָעַמּוּדִים (‘தூண்கள்’) உள்ளது; ‘மாதுளை வடிவ அலங்காரங்களைச் செய்தான்’ என்பது இவ்வசனத்தில் அதற்கான சொல் மாற்றல்ல. அடிக்குறிப்பு ‘எபிரெய உரையில் தூண்கள் என்றே உள்ளது’ என்று கூறிக்கொண்டே அந்த முரணான மாற்றை முன்வைப்பதும் குழப்பமாகும்.
