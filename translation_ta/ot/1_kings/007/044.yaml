  text: and the one Sea[a], and the twelve oxen under the Sea;
translation:
  language: ta
  text: மேலும், அந்த ஒரே கடல்தொட்டியையும்[a], கடல்தொட்டிக்குக் கீழிருந்த பன்னிரண்டு எருதுகளையும்;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்த ஒரே கடலையும், கடலின் கீழிருந்த பன்னிரண்டு எருதுகளையும்.” எபிரெயத்தில் பெரிய நீர்த்தேக்கத் தொட்டி “கடல்” என்று அழைக்கப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיָּם
  choice: கடல்தொட்டி
  rationale: ஆலயப் பொருட்களின் சூழலில் יָם என்பது தண்ணீரைத் தேக்கிவைக்கும் பெரிய வார்ப்புத் தொட்டியைக் குறிக்கிறது. ‘கடல்தொட்டி’ என்பது எபிரெய உருவகப் பெயரையும் பொருளின் நடைமுறைச் செயலையும் ஒருங்கே தெளிவுபடுத்துகிறது.
- source_word: הָאֶחָד
  choice: அந்த ஒரே
  rationale: உறுப்புடன் வந்துள்ள எண்ணுப்பெயர், சுற்றியுள்ள பல தாங்கிகளுக்கும் தொட்டிகளுக்கும் மாறாக இது ஒன்றே என்பதை வலியுறுத்துகிறது.
- source_word: הַבָּקָר
  choice: எருதுகள்
  rationale: இங்கு கடல்தொட்டியைத் தாங்கும் மாட்டுருவச் சிலைகள் குறிக்கப்படுகின்றன; ‘எருதுகள்’ என்பது இக்கட்டடச் சூழலுக்கு இயல்பான, மரபான சொல்.
- source_word: שְׁנֵים עָשָׂר
  choice: பன்னிரண்டு
  rationale: எபிரெய மூலத்தின் நேரடியான எண்ணிக்கை.
- source_word: תַּחַת
  choice: கீழிருந்த
  rationale: எருதுகள் கடல்தொட்டியின் அடியில் அமைந்து அதைத் தாங்கிய உடல்சார் நிலையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וְאֶת
  choice: மேலும் … -ஐயும்
  rationale: மீண்டும் வரும் இணைப்புச்சொல்லும் நேரடி செயப்படுபொருள் குறியும் முந்தைய பட்டியலைத் தொடர்கின்றன; தமிழில் ‘மேலும்’ மற்றும் ‘-ஐயும்’ அதைப் பிரதிபலிக்கின்றன.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான ஆலயப் பொருட்பட்டியல் நடை பயன்படுத்தப்பட்டுள்ளது. இது முந்தைய வாக்கியத்திலிருந்து தொடரும் துணைப்பகுதி என்பதால் தொடக்க இணைப்பும் இறுதி அரைப்புள்ளியும் பேணப்பட்டுள்ளன; தமிழில் முழுமையான வாசிப்புக்காகச் சூழலில் மறைந்திருக்கும் ‘செய்தான்’ சேர்க்கப்பட்டுள்ளது.
