translation_notes:
  register: நவீன நிலையான தமிழில், ஆலயத் தளவாடத்தின் தொழில்நுட்ப விளக்கத்துக்கு ஏற்ற கண்ணியமான உரைநடை பயன்படுத்தப்பட்டது. மூலத்தில் வினை மறைந்துள்ள இடத்தில் தமிழின் இயல்புக்காக ‘நீண்டிருந்தது’ சேர்க்கப்பட்டது; ஒன்றரை முழம் எந்தப் பரிமாணம் என்பதை மூலம் குறிப்பிடாததால் அது திட்டவட்டமாக்கப்படவில்லை. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
