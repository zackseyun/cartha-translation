base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/031.yaml
  text: Its opening projected upward from within the capital by a cubit[a], and its opening was round, like the work of a pedestal, a cubit and a half; and also on its opening were carvings, and their panels were square[c][b], not round.
translation:
  language: ta
  text: அதன் திறப்பு[a], தலைப்பகுதியின் உட்புறத்திலிருந்து ஒரு முழம் மேல்நோக்கி நீண்டிருந்தது. அந்தத் திறப்பு வட்டமாக இருந்தது; அது தாங்குதளத்தின் வேலைப்பாட்டைப் போல[b] அமைந்து, ஒன்றரை முழம் அளவுடையதாக இருந்தது. அதன் திறப்பின்மேல் செதுக்கல் அலங்காரங்களும்[c] இருந்தன; அவற்றின் சட்டப்பகுதிகள் சதுரமாக, வட்டமாக அல்ல, இருந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: ‘அதன் வாய்’; எபிரெயத்தில் திறப்பைக் குறிக்க கட்டட உருவகம் பயன்படுத்தப்பட்டுள்ளது.'
    reason: lexical_alternative
  - marker: b
    text: ‘தாங்குதளத்தின் வேலைப்பாட்டைப் போல’ என்ற எபிரெயச் சொற்றொடர் தொழில்நுட்ப ரீதியில் தெளிவற்றது; ‘ஒரு தாங்கியைப் போலச் செய்யப்பட்டு’ அல்லது ‘அடித்தளத்தின் வேலைப்பாட்டைப் போல’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: இங்குள்ள அலங்காரச் சொல்லை ‘செதுக்கப்பட்ட வேலைப்பாடுகள்’, ‘வளையல்கள்’ அல்லது ‘மாலைகள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִיהוּ / פִיהָ
  choice: திறப்பு
  rationale: கட்டட அமைப்பைக் குறிக்கும் இச்சூழலில் எபிரெயச் சொல் உருவகமாக ‘வாய்’ என்பதைக் குறித்தாலும், பொருளில் அமைப்பின் திறப்பையே சுட்டுகிறது. ‘திறப்பு’ நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: מִבֵּית לַכֹּתֶרֶת
  choice: தலைப்பகுதியின் உட்புறத்திலிருந்து
  rationale: בַּיִת இங்கு ‘உட்புறம்’ என்ற இடப்பொருளிலும், כֹּתֶרֶת தாங்கியின் மேலுள்ள தலை போன்ற அமைப்பையும் குறிக்கிறது.
- source_word: וָמַעְלָה
  choice: மேல்நோக்கி நீண்டிருந்தது
  rationale: மூலத்தில் வெளிப்படையான வினை இல்லாத சுருக்கமான அளவீட்டு நடை உள்ளது; தமிழில் இயல்பாக அமைய, மேல்நோக்கிய நீட்சியை மட்டும் தெளிவாக்குகிறது.
- source_word: בָּאַמָּה
  choice: ஒரு முழம்
  rationale: மேல்நோக்கிய நீட்சியின் அளவைத் தரும் அளவீட்டுச் சொற்றொடர்.
- source_word: עָגֹל
  choice: வட்டமாக
  rationale: வடிவத்தைக் குறிக்கும் நேரடியான சொல்.
- source_word: מַעֲשֵׂה כֵן
  choice: தாங்குதளத்தின் வேலைப்பாட்டைப் போல
  rationale: כֵּן என்பது தாங்கி, அடித்தளம் அல்லது தாங்குதளம் எனப் பொருள்படக்கூடும். கடினமான தொழில்நுட்பச் சொற்றொடரின் ஒப்புமைத் தன்மையைத் தீர்மானிக்காமல் வைத்திருக்கிறது.
- source_word: אַמָּה וַחֲצִי הָאַמָּה
  choice: ஒன்றரை முழம் அளவுள்ளதாக
  rationale: மூலம் எந்தப் பரிமாணம் என்பதை வெளிப்படையாகக் கூறாததால், ‘விட்டம்’ போன்ற விளக்கத்தைச் சேர்க்காமல் பொதுவான அளவாக மொழிபெயர்க்கப்பட்டது.
- source_word: מִקְלָעוֹת
  choice: செதுக்கல் அலங்காரங்கள்
  rationale: அலங்கார வேலைப்பாட்டைக் குறிக்கிறது; துல்லியமான வடிவம் உறுதியில்லாததால் மாலைகள் அல்லது வளையல்கள் என்று குறிப்பாக்கவில்லை.
- source_word: מִסְגְּרֹתֵיהֶם
  choice: அவற்றின் சட்டப்பகுதிகள்
  rationale: சட்டமிடப்பட்ட பகுதிகள், சட்டங்கள் அல்லது பலகைகள் எனப் பொருள்படக்கூடிய சொல்லை கட்டடச் சூழலுக்கு ஏற்ற பொதுவான வடிவில் தருகிறது.
- source_word: מְרֻבָּעוֹת לֹא עֲגֻלּוֹת
  choice: வட்டமாக அல்ல, சதுரமாக
  rationale: நான்கு பக்க வடிவுக்கும் வட்ட வடிவுக்கும் இடையிலான மூலத்தின் நேரடியான முரண்பாட்டைப் பாதுகாக்கிறது.
