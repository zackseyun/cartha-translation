base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/026.yaml
  text: Its thickness was a handbreadth[a], and its rim was made like the rim of a cup, like a lily blossom[b]. It could hold two thousand baths.
translation:
  language: ta
  text: அதன் தடிமன் ஒரு உள்ளங்கை அகலம். அதன் விளிம்பு, ஒரு கிண்ணத்தின் விளிம்பைப் போல, லீலி மலரைப் போல வடிவமைக்கப்பட்டிருந்தது. அது இரண்டாயிரம் பத் அளவு கொள்ளக்கூடியது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 2 நாளாகமம் 4:5-இல் இதே தொட்டி மூவாயிரம் பத் கொள்ளும் என்று கூறப்படுகிறது. இது உரைமரபு, பரிமாற்றம், அல்லது கொள்ளளவுக்கும் வழக்கமாக நிரப்பப்பட்ட அளவுக்கும் இடையிலான வேறுபாட்டை பிரதிபலிக்கலாம்.
    reason: cross_reference
lexical_decisions:
- source_word: עָבְיוֹ
  choice: அதன் தடிமன்
  rationale: இந்தச் சொல் கடல் எனப்படும் பெரிய தொட்டியின் பொருள்தடிமனைக் குறிக்கிறது; மூன்றாம் நபர் ஒருமை பின்னொட்டு தொட்டியைக் குறிக்கிறது.
- source_word: טֶפַח
  choice: ஒரு உள்ளங்கை அகலம்
  rationale: טֶפַח என்பது விரல்களின் அடிப்பகுதியில் அளக்கப்படும் பழங்கால ‘handbreadth’ அளவு; நவீனத் தமிழில் எளிதில் புரியும்படி ‘உள்ளங்கை அகலம்’ என வழங்கப்பட்டது.
- source_word: שְׂפָתוֹ
  choice: அதன் விளிம்பு
  rationale: பெரிய உலோகத் தொட்டியின் மேற்புற ஓரத்தை இங்கு שׂפה குறிக்கிறது; ‘விளிம்பு’ இயல்பானதும் தெளிவானதும் ஆகும்.
- source_word: כְּמַעֲשֵׂה
  choice: போல ... வடிவமைக்கப்பட்டிருந்தது
  rationale: ஒப்பிடப்படும் கைவினை வடிவத்தை இயல்பான தமிழில் எடுத்துரைக்கிறது; வெறும் தோற்றம் மட்டுமல்லாமல் செய்யப்பட்ட வடிவத்தையும் உணர்த்துகிறது.
- source_word: שְׂפַת כּוֹס
  choice: ஒரு கிண்ணத்தின் விளிம்பு
  rationale: தொட்டியின் ஓரம் கிண்ணத்தின் வடிவமைக்கப்பட்ட வாய்விளிம்புடன் ஒப்பிடப்படுகிறது; முன்சொல்லுடன் சொற்பொருள் ஒற்றுமை பேணப்படுகிறது.
- source_word: פֶּרַח שׁוֹשָׁן
  choice: விரிந்த அல்லரி மலர்
  rationale: שׁוֹשָׁן குறிக்கும் மலரின் துல்லியமான தாவரவியல் அடையாளம் உறுதியில்லை. ‘அல்லரி’ மரபான தமிழ் வேதாகமப் பயன்பாட்டைத் தக்கவைக்கிறது; ‘விரிந்த’ என்பது இங்கு சித்தரிக்கப்படும் மலர்ந்த, வெளியே வளைந்த வடிவத்தை இயல்பாக உணர்த்துகிறது.
- source_word: אַלְפַּיִם בַּת
  choice: இரண்டாயிரம் பத்கள் அளவு
  rationale: בַּת என்பது பழங்கால திரவ அளவை; நவீன அளவாக ஊகித்து மாற்றாமல் ‘பத்’ என ஒலிபெயர்த்து, அது அளவலகு என்பதை ‘அளவு’ தெளிவுபடுத்துகிறது.
- source_word: יָכִיל
  choice: கொள்ளும்
  rationale: ஹிஃபில் வடிவம் தொட்டியின் கொள்ளளவைக் குறிக்கிறது; உண்மையில் அப்போது நிரம்பியிருந்த அளவாக அல்லாமல் கொள்ளக்கூடிய திறனாக மொழிபெயர்க்கப்பட்டது.
theological_decisions:
- issue: 1 இராஜாக்கள் 7:26-இன் இரண்டாயிரம் பத் மற்றும் 2 நாளாகமம் 4:5-இன் மூவாயிரம் பத் என்ற எண்ணிக்கை வேறுபாடு
  choice: மூல எபிரெய உரையிலுள்ள ‘இரண்டாயிரம்’ என்பதையே முதன்மை உரையில் வைத்தல்
  alternative: நாளாகம இணைப்பகுதியுடன் ஒத்திசைத்து ‘மூவாயிரம்’ என மாற்றுதல் அல்லது இரண்டையும் விளக்கமாக ஒருங்கிணைத்தல்
  rationale: இவ்வசனத்தின் WLC உரை தெளிவாக ‘இரண்டாயிரம் பத்’ என்கிறது. இணைப்பகுதியின் வேறுபாட்டை உரைக்குள் தீர்த்துவிடாமல் அடிக்குறிப்பில் வெளிப்படையாகக் குறிப்பிடுவது உரைச்சான்றையும் உண்மையான பதற்றத்தையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. பழங்கால அளவுகளான טֶפַח மற்றும் בַּת முறையே விளக்கமான தமிழ் சொற்றொடராலும் ஒலிபெயர்ப்பாலும் வழங்கப்பட்டன. மலரின் தாவரவியல் அடையாளம் உறுதியற்றதால் மிகத் துல்லியமான நவீன இனப்பெயரைத் திணிக்காமல் மரபான ‘அல்லரி’ பயன்படுத்தப்பட்டது. [a] குறி எண்ணிக்கை வேறுபாட்டை விளக்கும் வாக்கியத்தின் முடிவில் வைக்கப்பட்டது.
