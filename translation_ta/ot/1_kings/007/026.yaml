  source_fidelity: 'முதன்மையான பொருள் சரியாக உள்ளது: தொட்டியின் தடிமன் ஒரு டெஃபக்/உள்ளங்கை அகலம்; அதன் விளிம்பு கிண்ணத்தின் விளிம்பைப் போல் மலர் வடிவில் செய்யப்பட்டிருந்தது; கொள்ளளவு இரண்டாயிரம் பத். எனினும், எபிரெயப் பாடத்தில் இல்லாத ‘விரிந்த’ என்ற விளக்கச் சொல்லை நீக்க வேண்டும். שׁוֹשָׁן என்பதன் தாவரவியல் அடையாளத்தைத் தீர்மானிக்காமல் ‘லீலி மலர்’ என வழங்குவது பாதுகாப்பானது.'
  naturalness: ‘அதன் தடிமன் ஒரு உள்ளங்கை அகலம்’ இயல்பானது. ஆனால் ‘இரண்டாயிரம் பத்கள் அளவு கொள்ளும்’ என்பதைவிட ‘இரண்டாயிரம் பத் அளவு கொள்ளக்கூடியது’ என்பது அளவலகின் பெயரையும் கொள்ளளவையும் நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
  terminology: ‘விளிம்பு,’ ‘கிண்ணம்,’ மற்றும் ‘உள்ளங்கை அகலம்’ பொருத்தமானவை. பத் என்பது ஒலிபெயர்க்கப்பட்ட பழங்காலத் திரவ அளவலகாகத் தக்கவைக்கப்பட வேண்டும். ‘அல்லரி’ என்பதற்குப் பதிலாக ‘லீலி மலர்’ என்பது שׁוֹשָׁן-இன் பொதுவான, தீர்மானிக்கப்படாத மலர் அடையாளத்தைச் சிறப்பாகப் பாதுகாக்கிறது.
