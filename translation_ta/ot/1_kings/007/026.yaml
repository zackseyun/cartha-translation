  to: அதன் தடிமன் ஒரு உள்ளங்கை அகலம். அதன் விளிம்பு, ஒரு கிண்ணத்தின் விளிம்பைப் போல, லீலி மலரைப் போல வடிவமைக்கப்பட்டிருந்தது. அது இரண்டாயிரம் பத் அளவு கொள்ளக்கூடியது.[a]
  rationale: மூல எபிரெய உரையின் அளவு, வடிவ ஒப்புமை, மற்றும் கொள்ளளவு ஆகியவை பாதுகாக்கப்பட்டுள்ளன. மூலத்தில் இல்லாத ‘விரிந்த’ நீக்கப்பட்டுள்ளது; மலரின் அடையாளம் குறித்த தேவையற்ற துல்லியத்தைத் தவிர்க்க ‘லீலி மலர்’ பயன்படுத்தப்பட்டுள்ளது. அடிக்குறிப்புக் குறி எண்ணிக்கை வேறுபாட்டுடன் தொடர்புடைய கொள்ளளவு வாக்கியத்தில் வைக்கப்பட்டுள்ளது.
