  rationale: எபிரெய மொழியின் மிகைநிலைப் பொருளைத் தெளிவான நவீன தமிழில் தருகிறது; எந்தப் பிரிவுசார் விளக்கத்தையும் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், ஆலயப் பொருட்களின் பட்டியலை வாசிக்க எளிதான தொடராக அமைத்துள்ளோம். எபிரெயில் வெளிப்படையாக இல்லாத ‘செய்தான்’ என்பது முந்தைய வசனங்களிலிருந்து தொடரும் வினையைத் தமிழில் நிறைவு செய்வதற்காக வழங்கப்பட்டுள்ளது. ‘மகா பரிசுத்த இடம்’, ‘பிரதான மண்டபம்’ ஆகியவை ஆலயத்தின் இரண்டு பகுதிகளையும் தெளிவாக வேறுபடுத்துகின்றன.
