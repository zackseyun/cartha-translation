base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/050.yaml
  text: and the basins[a], the snuffers, the bowls, the cups, and the firepans, of pure gold; and the hinges for the doors of the inner house, for the Most Holy Place, and for the doors of the house, that is, the nave[d][c][b], of gold.
translation:
  language: ta
  text: தூய தங்கத்தால் செய்யப்பட்ட தொட்டிகள், திரி கத்தரிகள், கிண்ணங்கள்[a], கோப்பைகள், நெருப்புத் தட்டுகள் ஆகியவற்றையும்; மகா பரிசுத்த இடமாகிய உட்புற அறையின் கதவுகளுக்கான சுழல் பொருத்திகளையும்[b], ஆலயத்தின் பிரதான மண்டபக் கதவுகளுக்கான சுழல் பொருத்திகளையும் தங்கத்தால் செய்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தெளிப்புக் கிண்ணங்கள்.’
    reason: lexical_alternative
  - marker: b
    text: இவை நவீன பக்கக் கீல்களாக இல்லாமல், கதவுகள் சுழல்வதற்கான அச்சுகள் அல்லது குழிப் பொருத்திகளாக இருந்திருக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: הַסִּפּוֹת
  choice: பாத்திரங்கள்
  rationale: ஆலயப் பொருட்களின் பட்டியலில் இது ஒரு கொள்கலனைக் குறிக்கிறது. அடுத்து வரும் מִזְרָקוֹת என்பதிலிருந்து வேறுபடுத்த பொதுவான ‘பாத்திரங்கள்’ பயன்படுத்தப்பட்டது.
- source_word: הַמְזַמְּרוֹת
  choice: திரி கத்தரிகள்
  rationale: ஆலயச் சூழலில் விளக்குத் திரிகளை வெட்டித் திருத்தும் கருவிகளை இது குறிக்கிறது; வேளாண்மைச் சூழலிலுள்ள ‘கிளை கத்தரிகள்’ என்ற பொருள் இங்கே பொருந்தாது.
- source_word: הַמִּזְרָקוֹת
  choice: தெளிப்புக் கிண்ணங்கள்
  rationale: சடங்கில் திரவத்தைத் தெளிக்க அல்லது கையாளப் பயன்பட்ட கிண்ணங்கள் என்ற குறிப்பான பொருளைத் தமிழில் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: הַכַּפּוֹת
  choice: கிண்ணங்கள்
  rationale: சிறிய குழிவான பாத்திரங்களை இது குறிக்கிறது. வடிவத்தை அளவுக்கு மீறி வரையறுக்காமல் இயல்பான தமிழில் தரப்பட்டது.
- source_word: הַמַּחְתּוֹת
  choice: நெருப்புத் தட்டுகள்
  rationale: நெருப்பையோ தணலையோ எடுத்துச் செல்லும் வழிபாட்டுப் பயன்பாட்டுப் பாத்திரங்களைக் குறிக்கிறது; ‘தூபக்கலசங்கள்’ என்பது பயன்பாட்டை தேவையின்றிக் குறுக்கிவிடும்.
- source_word: זָהָב סָגוּר
  choice: தூய தங்கம்
  rationale: உயர்தரமாகச் சுத்திகரிக்கப்பட்ட தங்கத்தைக் குறிக்கும் எபிரெயச் சொற்றொடருக்கு இயல்பான தமிழ்.
- source_word: הַפֹּתוֹת
  choice: சுழல் பொருத்திகள்
  rationale: நவீன பக்கக் கீல்களை அல்லாமல், கதவுகள் சுழலும் அச்சு அல்லது அதற்கான குழிப் பொருத்திகளை இச்சொல் குறித்திருக்கலாம். மூலத்தின் கட்டடவியல் நுணுக்கத்தையும் நிச்சயமின்மையையும் இது காக்கிறது.
- source_word: הַבַּיִת הַפְּנִימִי לְקֹדֶשׁ הַקֳּדָשִׁים
  choice: மகா பரிசுத்த இடமாகிய உட்புற அறை
  rationale: ‘உட்புற வீடு’ என்ற சொற்சொறான ஆனால் தமிழில் இயல்பற்ற வடிவத்தைத் தவிர்த்து, ஆலயத்தின் உள்ளறையைக் குறிக்கிறது; எபிரெயச் சிறப்புயர்வு அமைப்பு ‘மகா பரிசுத்த இடம்’ என வழங்கப்பட்டது.
- source_word: לְדַלְתֵי הַבַּיִת לַהֵיכָל
  choice: ஆலயத்தின் பிரதான மண்டபக் கதவுகள்
  rationale: הֵיכָל என்பது உட்புற அறையிலிருந்து வேறுபட்ட ஆலயத்தின் பிரதான கூடத்தைக் குறிக்கிறது. தமிழில் தெளிவாகவும் கட்டடவியல் வேறுபாடு காக்கப்படுமாறும் மொழிபெயர்க்கப்பட்டது.
- source_word: זָהָב
  choice: தங்கத்தால்
  rationale: இறுதியில் வரும் பொருள் குறிப்பைத் தமிழ் வாக்கியத்தில் இயல்பாக இணைக்கிறது.
theological_decisions:
- issue: קֹדֶשׁ הַקֳּדָשִׁים என்ற சிறப்புயர்வு சொற்றொடர்
  choice: மகா பரிசுத்த இடம்
