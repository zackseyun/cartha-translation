  edition: WLC
  text: וַ/יַּ֧עַשׂ אֶת הַ/מְּכֹנ֛וֹת עֶ֖שֶׂר נְחֹ֑שֶׁת אַרְבַּ֣ע בָּ/אַמָּ֗ה אֹ֚רֶךְ הַ/מְּכוֹנָ֣ה הָֽ/אֶחָ֔ת וְ/אַרְבַּ֤ע בָּֽ/אַמָּה֙ רָחְבָּ֔/הּ וְ/שָׁלֹ֥שׁ בָּ/אַמָּ֖ה קוֹמָתָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/027.yaml
  text: He made ten bronze stands. The length of each stand was four cubits[a], its width four cubits, and its height three cubits.
translation:
  language: ta
  text: அவன் வெண்கலத்தால் பத்துத் தாங்கிகளை[a] செய்தான். ஒவ்வொரு தாங்கியும் நான்கு முழம் நீளமும், நான்கு முழம் அகலமும், மூன்று முழம் உயரமும் கொண்டிருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அடித்தளங்கள்.’ எபிரெயச் சொல் ஆலய வளாகத்திலிருந்த தொட்டிகளைத் தாங்குவதற்காகச் செய்யப்பட்ட வெண்கல அமைப்புகளைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: அவன் ... செய்தான்
  rationale: עשה என்பதன் தொடர்நிகழ்வைக் குறிக்கும் வடிவம் அடுத்த செயலை விவரிக்கிறது. நவீன தமிழில் இயல்பான இறந்தகால வினை போதுமானது; எபிரெய இணைப்பைத் தனியாக ‘பின்பு’ அல்லது ‘மேலும்’ என்று சேர்க்க வேண்டியதில்லை.
- source_word: הַמְּכֹנוֹת
  choice: தாங்கிகள்
  rationale: ஆலயத் தொட்டிகளைத் தாங்கிய வெண்கல அமைப்புகளை இச்சொல் குறிக்கிறது. ‘தாங்கிகள்’ அவற்றின் பயன்பாட்டைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது; மாற்றுச் சொல்லான ‘அடித்தளங்கள்’ அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: עֶשֶׂר
  choice: பத்து
  rationale: தாங்கிகளின் எண்ணிக்கையைக் குறிக்கும் நேரடியான எண்ணுப்பெயர்.
- source_word: נְחֹשֶׁת
  choice: வெண்கலத்தால்
  rationale: ஆலயப் பொருட்கள் பற்றிய சூழலில் נְחֹשֶׁת பொதுவாக வேலைப்பாடுடைய வெண்கலத்தைக் குறிக்கிறது. கருவிப்பொருளைக் காட்ட தமிழில் ‘வெண்கலத்தால்’ இயல்பானது.
- source_word: הַמְּכוֹנָה הָאֶחָת
  choice: ஒவ்வொரு தாங்கியும்
  rationale: சொல்லுக்குச் சொல் ‘அந்த ஒரு தாங்கி’ என்றிருந்தாலும், இது ஒவ்வொரு தனிப்பட்ட தாங்கிக்கும் ஒரே அளவு என்பதைக் குறிக்கும் பகிர்வுப் பொருள் கொண்ட எபிரெய வழக்கு.
- source_word: אַרְבַּע בָּאַמָּה אֹרֶךְ
  choice: நான்கு முழம் நீளமும்
  rationale: அளவைத் துல்லியமாகப் பாதுகாத்து, தமிழில் பல பரிமாணங்களை இயல்பாக ஒரே தொடரில் அமைக்கிறது.
- source_word: וְאַרְבַּע בָּאַמָּה רָחְבָּהּ
  choice: நான்கு முழம் அகலமும்
  rationale: உடைமைப் பின்னொட்டின் பொருள் ‘ஒவ்வொரு தாங்கியும்’ என்ற எழுவாயால் தமிழில் தெளிவாகிறது.
- source_word: וְשָׁלֹשׁ בָּאַמָּה קוֹמָתָהּ
  choice: மூன்று முழம் உயரமும்
  rationale: קוֹמָה இங்கு செங்குத்தான பரிமாணத்தைக் குறிக்கிறது; ‘உயரம்’ அதன் நேரடியான சூழல்சார் இணை.
- source_word: אַמָּה
  choice: முழம்
  rationale: பண்டைய அளவான cubit-க்கு மரபாகவும் பொதுவாகவும் புரியக்கூடிய தமிழ் இணை ‘முழம்’; துல்லியமற்ற நவீன அலகு மாற்றம் தவிர்க்கப்படுகிறது.
