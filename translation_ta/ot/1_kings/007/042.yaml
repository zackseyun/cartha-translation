translation:
  language: ta
  text: இரண்டு பின்னல் வேலைப்பாடுகளுக்காக[a] நானூறு மாதுளை வடிவங்களையும் செய்தான்; ஒவ்வொரு பின்னல் வேலைப்பாட்டுக்கும் இரண்டு வரிசை மாதுளை வடிவங்கள், தூண்களின் மேல் இருந்த தலைப்பகுதிகளின் இரண்டு கிண்ணவடிவப் பகுதிகளை மூடுவதற்காக[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பின்னல் வேலைப்பாடுகள்’ என்பதற்குப் பதிலாக ‘வலை வேலைப்பாடுகள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் தூண் தலைப்பகுதிகளில் இருந்த திறந்த அலங்காரப் பின்னலைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: சொற்பட, ‘தலைப்பகுதிகளின் இரண்டு கிண்ணங்களை.’
    reason: lexical_alternative
lexical_decisions:
- source_word: רִמֹּנִים
  choice: மாதுளை வடிவங்கள்
  rationale: சொல் நேரடியாக மாதுளைகளைக் குறித்தாலும், இங்கு கோவில் அலங்காரத்தில் செய்யப்பட்ட உருவங்கள் என்பதால், இயல்பான தமிழில் பொருளைத் தெளிவுபடுத்த ‘மாதுளை வடிவங்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: שְׂבָכוֹת
  choice: பின்னல் வேலைப்பாடுகள்
  rationale: தூண் தலைப்பகுதிகளில் இருந்த வலை அல்லது பின்னல் போன்ற திறந்த அலங்கார அமைப்பை நவீன தமிழில் இயல்பாகக் குறிக்கிறது.
- source_word: טוּרִים
  choice: வரிசைகள்
  rationale: மாதுளை வடிவங்கள் ஒழுங்காக அமைக்கப்பட்டிருந்த விதத்தைத் தெளிவாகக் குறிக்கிறது.
- source_word: לַשְּׂבָכָה הָאֶחָת
  choice: ஒவ்வொரு பின்னல் வேலைப்பாட்டிலும்
  rationale: எபிரெய உரை சொற்பட ‘அந்த ஒரு பின்னல் வேலைப்பாட்டுக்கு’ என்றாலும், இரண்டு வேலைப்பாடுகளுக்கும் தலா இரண்டு வரிசைகள் என்பதே சூழலின் பகிர்ந்தளிக்கும் பொருள்.
- source_word: לְכַסּוֹת
  choice: மூடியிருந்தன
  rationale: நோக்கம் அல்லது செயல்பாட்டைக் குறிக்கும் எபிரெய வினையெச்சத்தின் அடிப்படைப் பொருளான ‘மூடுதல்’ பாதுகாக்கப்பட்டது.
- source_word: גֻּלֹּת הַכֹּתָרֹת
  choice: கிண்ண வடிவத் தலைப்பகுதிகள்
  rationale: சொற்பட ‘தலைப்பகுதிகளின் இரண்டு கிண்ணங்கள்’; கட்டட அமைப்பில் இது வட்டமான அல்லது கிண்ணம் போன்ற தூண் தலைப்பகுதிகளைக் குறிப்பதால், வாசகருக்குத் தெளிவாக வடிவம் வெளிப்படுத்தப்பட்டது.
- source_word: כֹּתָרֹת
  choice: தலைப்பகுதிகள்
  rationale: இங்கு அரச மகுடங்கள் அல்ல, தூண்களின் மேலுள்ள கட்டடக்கலைத் தலைப்பகுதிகள் குறிக்கப்படுகின்றன.
- source_word: עַל פְּנֵי הָעַמּוּדִים
  choice: தூண்களின் உச்சியில்
  rationale: சொற்பட ‘தூண்களின் முகத்தின்/மேற்பரப்பின் மீது’; கட்டட விவரணையில் தலைப்பகுதிகள் தூண்களின் மேலே இருந்த இடத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
