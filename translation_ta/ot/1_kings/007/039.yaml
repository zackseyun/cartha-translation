source:
  edition: WLC
  text: וַ/יִּתֵּן֙ אֶת הַ/מְּכֹנ֔וֹת חָמֵ֞שׁ עַל כֶּ֤תֶף הַ/בַּ֨יִת֙ מִ/יָּמִ֔ין וְ/חָמֵ֛שׁ עַל כֶּ֥תֶף הַ/בַּ֖יִת מִ/שְּׂמֹאל֑/וֹ וְ/אֶת הַ/יָּ֗ם נָתַ֞ן מִ/כֶּ֨תֶף הַ/בַּ֧יִת הַ/יְמָנִ֛ית קֵ֖דְמָ/ה מִ/מּ֥וּל נֶֽגֶב־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/039.yaml
  text: He placed five stands on the right side of the house and five on the left side of the house[a], and he placed the Sea on the southeast side of the house.
translation:
  language: ta
  text: அவன் வீட்டின் வலப்பக்கத்தில் ஐந்து தாங்கிகளையும், வீட்டின் இடப்பக்கத்தில் ஐந்து தாங்கிகளையும் வைத்தான். கடலை வீட்டின் வலப்பக்கத்தில், கிழக்கு நோக்கி, தெற்குக்கு எதிரே வைத்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் இவ்விடம், “வீட்டின் வலப்பக்கத்தில், கிழக்கு நோக்கி, தெற்குக்கு எதிரே” என்று செறிவாக விவரிக்கப்படுகிறது; இது வீட்டின் தென்கிழக்குப் பகுதியைக் குறிப்பதாகப் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְּכֹנוֹת
  choice: தாங்கிகள்
  rationale: இந்தச் சூழலில், கழுவும் தொட்டிகளைத் தாங்கிய சக்கரங்களுள்ள வெண்கல அமைப்புகளை இச்சொல் குறிக்கிறது. ‘தாங்கிகள்’ அவற்றின் செயல்பாட்டை இயல்பான தமிழில் தெரிவிக்கிறது; ‘வண்டிகள்’ இயக்கத்தை அளவுக்கு மீறி வலியுறுத்தக்கூடும்.
- source_word: כֶּתֶף
  choice: பக்கம்
  rationale: சொல்லுக்கு நேரான பொருள் ‘தோள்’; கட்டட அமைவிடத்தை விவரிக்கும் இச்சூழலில் ‘பக்கம்’ என்பதே இயல்பான இடவியல் பொருள்.
- source_word: הַבַּיִת
  choice: வீடு
  rationale: எபிரெய உரை ‘வீடு’ என்று கூறுகிறது; சூழலில் அது ஆலயத்தைக் குறித்தாலும், மூலத்தின் வழக்குச் சொல்லாட்சியைப் பேண ‘வீடு’ பயன்படுத்தப்படுகிறது.
- source_word: מִיָּמִין / מִשְּׂמֹאלוֹ
  choice: வலப்பக்கத்தில் / இடப்பக்கத்தில்
  rationale: மூலத்தில் உள்ள உடல்-சார்ந்த திசைச்சொற்களை உடனடியாக தெற்கு/வடக்கு என்று மாற்றாமல் நேரடியாகப் பேணுகிறது.
- source_word: הַיָּם
  choice: கடல்
  rationale: ஆலய வளாகத்திலிருந்த பெரிய வார்ப்புத் தொட்டிக்குரிய மரபுப் பெயர் இது. ‘கடல்’ என்ற பெயரைப் பேணுவது மூலச்சொல்லையும் ஆலயப் பொருளின் தனிப்பெயரையும் காக்கிறது.
- source_word: הַיְמָנִית קֵדְמָה מִמּוּל נֶגֶב
  choice: வலப்பக்கத்தில், கிழக்கு நோக்கி, தெற்குக்கு எதிரே
  rationale: எபிரெய உரையின் செறிவான, ஓரளவு தெளிவின்மை கொண்ட இடவியல் வரிசையைச் சீராக்கி ஒரே ‘தென்கிழக்கு’ என்ற சொல்லாக மாற்றாமல் பேணுகிறது.
