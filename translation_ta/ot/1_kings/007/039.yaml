translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியக்கூடியதாயும் கண்ணியமானதாயும் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் ‘வீடு’, ‘வலம்/இடம்’ என்ற இடவியல் சொல்லாட்சி பேணப்பட்டுள்ளது; கடலின் அமைவிடம் உரையில் சுருக்கி தீர்மானிக்கப்படாமல், விளக்கம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
