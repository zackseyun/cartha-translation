base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/017.yaml
  text: 'There were lattices of latticework and twisted cords of chainwork for the capitals that were on the tops of the pillars: seven for the one capital[a], and seven for the second capital.'
translation:
  language: ta
  text: 'தூண்களின் உச்சியில் இருந்த தூண்முடிகளுக்காக வலைவேலைப்பாடான வலைப்பின்னல்களும், சங்கிலி வேலைப்பாடான முறுக்குக் கயிறுகளும் இருந்தன: ஒரு தூண்முடிக்கு ஏழும்[a], இரண்டாவது தூண்முடிக்கு ஏழும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வலை வேலைப்பாடுள்ள வலைகளும், சங்கிலி வேலைப்பாடுள்ள பின்னப்பட்ட இழைகளும்.” தூண்முடிகளின் அலங்கார உலோக வேலைப்பாட்டை விவரிக்க எபிரெய மொழி தொடர்புடைய கைவினைச் சொற்களை இணையாகப் பயன்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂבָכִים מַעֲשֵׂה שְׂבָכָה
  choice: வலைப்பின்னல் வேலைப்பாடுள்ள சல்லடைகள்
  rationale: இணைச் சொற்களால் விவரிக்கப்படும் வலை போன்ற உலோக அலங்கார அமைப்பைத் தமிழில் தெளிவாகவும் கட்டடச் சூழலுக்கு ஏற்றவாறும் காட்டுகிறது.
- source_word: גְּדִלִים מַעֲשֵׂה שַׁרְשְׁרוֹת
  choice: சங்கிலி வேலைப்பாடுள்ள முறுக்கப்பட்ட கயிறுகள்
  rationale: முறுக்கப்பட்ட அல்லது பின்னப்பட்ட இழைகள் சங்கிலி வடிவில் செய்யப்பட்டிருந்ததைச் சொல்கிறது; மலர்மாலை போன்ற உறுதியற்ற பொருளைத் திணிக்கவில்லை.
- source_word: כֹּתָרֹת
  choice: தூண்முடிகள்
  rationale: தூண்களின் அலங்கார உச்சிப் பகுதிகளைக் குறிக்கும் கட்டடக்கலைப் பொருளைச் சுருக்கமாகவும் சாதாரண வாசகருக்குப் புரியும் வகையிலும் தருகிறது.
- source_word: אֲשֶׁר עַל רֹאשׁ הָעַמּוּדִים
  choice: தூண்களின் உச்சியிலிருந்த
  rationale: ‘தலை’ என்ற சொல்லின் இடவியல் பொருளை இயல்பான தமிழ் கட்டட மொழியில் ‘உச்சி’ என வழங்குகிறது.
- source_word: שִׁבְעָה לַכֹּתֶרֶת הָאֶחָת וְשִׁבְעָה לַכֹּתֶרֶת הַשֵּׁנִית
  choice: ஒரு தூண்முடிக்கு ஏழும், இரண்டாவது தூண்முடிக்கு ஏழும்
  rationale: ஒவ்வொரு தூண்முடிக்கும் ஏழு என்ற எபிரெயப் பகிர்ந்தளிக்கும் எண்ணிக்கையை, எண்ணப்படுவது எது என்பதைத் தேவையின்றி நிர்ணயிக்காமல் காக்கிறது.
