translation_notes:
  register: நவீனத் தரத் தமிழில், கட்டட விவரணைக்கு ஏற்ற கண்ணியமான நடையைப் பயன்படுத்துகிறது. அரிதான தொழில்நுட்பச் சொல்லான ‘தூண்முடி’ அதன் பொருளை உடனே விளக்கும் ‘தூண்களின் உச்சி’ என்ற தொடருடன் வருகிறது; மூலத்தின் கைவினைச் சொல் மீளுருவாக்கமும் எண்ணிக்கையின் தெளிவின்மையும் இயன்றவரை பாதுகாக்கப்பட்டுள்ளன.
