base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/014.yaml
  text: He was the son of a widow from the tribe of Naphtali[a], and his father was a man of Tyre, a worker in bronze. He was filled with wisdom, understanding, and knowledge to do every kind of work in bronze[b]. So he came to King Solomon and did all his work.
translation:
  language: ta
  text: அவன் நப்தலி கோத்திரத்தைச் சேர்ந்த ஒரு விதவையின் மகன்; அவனுடைய தந்தை தீருவைச் சேர்ந்த[a] வெண்கலக் கைவினைஞர். வெண்கலத்தில்[b] எல்லாவகையான வேலைகளையும் செய்வதற்கு வேண்டிய ஞானம், புரிந்துகொள்ளும் திறன், அறிவு ஆகியவற்றால் அவன் நிரப்பப்பட்டிருந்தான். அவன் சாலொமோன் அரசனிடம் வந்து, தன் வேலைகள் அனைத்தையும் செய்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில், ‘தீரியர்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரேய நெகோஷெத் என்ற சொல் செம்பையையோ வெண்கலத்தையோ குறிக்கலாம்; இங்கு ஆலயப் பொருட்களைச் செய்யும் சூழலுக்கு ‘வெண்கலம்’ பொருத்தமாக உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אִשָּׁה אַלְמָנָה
  choice: ஒரு விதவையின் மகன்
  rationale: எபிரேயச் சொற்றொடர் தாய் விதவையாக இருந்ததை வலியுறுத்துகிறது; இச்சொல்லாக்கம் அதை இயல்பான நவீனத் தமிழில் நேரடியாகத் தருகிறது.
- source_word: מִמַּטֵּה נַפְתָּלִי
  choice: நப்தலி கோத்திரத்தைச் சேர்ந்த
  rationale: מַטֶּה இங்கு வம்ச/சமூக அடையாளமான ‘கோத்திரம்’ என்பதைக் குறிக்கிறது.
- source_word: אִישׁ צֹרִי
  choice: தீரைச் சேர்ந்தவர்
  rationale: צֹרִי என்பது தீரு நகரைச் சேர்ந்தவரைக் குறிக்கும் இனப்பெயர்; இடம்சார்ந்த அடையாளத்தை இயல்பான தமிழில் தருகிறது.
- source_word: חֹרֵשׁ נְחֹשֶׁת
  choice: வெண்கலக் கைவினைஞர்
  rationale: חֹרֵשׁ என்பது சாதாரணத் தொழிலாளியை விடத் திறமையான கைவினைஞரைக் குறிக்கிறது; ஆலயப் பொருட்களின் சூழலில் נְחֹשֶׁת என்பதற்கு ‘வெண்கலம்’ பொருத்தமானது.
- source_word: וַיִּמָּלֵא
  choice: நிரப்பப்பட்டிருந்தான்
  rationale: எபிரேய நிபால் வடிவின் செயப்பாட்டு உணர்வைத் தக்கவைத்து, அவனுடைய திறமைகள் வெறும் சுயசாதனையாகக் கூறப்படாமல் இருப்பதைப் பாதுகாக்கிறது; நிரப்பியவர் யார் என்று மூலத்தில் சொல்லப்படாததால் தமிழிலும் குறிப்பிடப்படவில்லை.
- source_word: הַחָכְמָה וְאֶת הַתְּבוּנָה וְאֶת הַדַּעַת
  choice: ஞானத்தாலும் புரிந்துகொள்ளும் திறனாலும் அறிவாலும்
  rationale: மூலத்தின் மூன்று வேறுபட்ட திறன்களையும் காத்து, கைவினைச் சூழலில் תְּבוּנָה குறிக்கும் நடைமுறைப் புரிதலைத் தெளிவாகச் சொல்கிறது.
- source_word: לַעֲשׂוֹת כָּל מְלָאכָה בַּנְּחֹשֶׁת
  choice: வெண்கலத்தில் எல்லாவிதமான வேலைகளையும் செய்வதற்கான
  rationale: כָּל מְלָאכָה என்பதன் விரிவான எல்லையை ‘எல்லாவிதமான வேலைகள்’ என்று இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיָּבוֹא אֶל הַמֶּלֶךְ שְׁלֹמֹה
  choice: அவன் சாலொமோன் அரசனிடம் வந்து
  rationale: கதைத் தொடர்ச்சியை இயல்பான தமிழில் தருகிறது; אֶל என்பதன் இலக்கு உணர்வு ‘அரசனிடம்’ என்பதில் காக்கப்படுகிறது.
- source_word: וַיַּעַשׂ אֶת כָּל מְלַאכְתּוֹ
  choice: தன் வேலை அனைத்தையும் செய்தான்
  rationale: மூன்றாம் நபர் பின்னொட்டு இயல்பாகக் குறிக்கும் கைவினைஞனின் வேலையைத் தருகிறது; ‘முடித்தான்’ அல்லது ‘ஒப்படைக்கப்பட்ட’ என்று மூலத்தை மீறி விளக்கவில்லை.
theological_decisions:
- issue: திறமைகளால் நிரப்பப்பட்டதற்கான செய்பவர்
  choice: செயப்பாட்டு வடிவை வைத்துக்கொண்டு செய்பவரைப் பெயரிடவில்லை
  alternative: ‘தேவன் அவனை நிரப்பினார்’ என்று வெளிப்படையாகச் சொல்வது
  rationale: மூல எபிரேய வசனம் செய்பவரை வெளிப்படையாகப் பெயரிடவில்லை; ஆகவே மறைமுகமான இறைச் செயலைத் தீர்மானமாக்காமல் அதன் திறந்த தன்மை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘கைவினைஞர்’ திறமையான உலோகப் பணியாளரைச் சுட்டுகிறது; ‘புரிந்துகொள்ளும் திறன்’ என்பது இச்சூழலில் நடைமுறை நுண்ணறிவையும் உள்ளடக்குகிறது. எல்லா அடிக்குறிப்புக் குறிகளும் தொடர்புடைய சொற்களின் பின்னர் முதன்மை உரையில் இடப்பட்டுள்ளன.
