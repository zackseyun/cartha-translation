  text: וְ/אוּלָ֤ם הַ/כִּסֵּא֙ אֲשֶׁ֣ר יִשְׁפָּט שָׁ֔ם אֻלָ֥ם הַ/מִּשְׁפָּ֖ט עָשָׂ֑ה וְ/סָפ֣וּן בָּ/אֶ֔רֶז מֵ/הַ/קַּרְקַ֖ע עַד הַ/קַּרְקָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/007.yaml
  text: And he made the Hall of the Throne[a], where he was to judge—the Hall of Judgment—and it was paneled with cedar from floor to floor.
translation:
  language: ta
  text: அவர் அங்கே தீர்ப்பு வழங்கவிருந்த அரியணை மண்டபத்தை—நியாயத்தீர்ப்பு மண்டபத்தை—அமைத்தார்; அது தரையிலிருந்து தரை வரை[a] கேதுரு மரப் பலகைகளால் மூடப்பட்டிருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, பொருள் விளக்கமாக, ‘தரையிலிருந்து கூரை வரை.’ எபிரெய மொழியில் சொல்லுக்குச் சொல் ‘தரையிலிருந்து தரை வரை’ என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאוּלָם הַכִּסֵּא
  choice: அரியணை மண்டபத்தை
  rationale: אוּלָם என்பது மண்டபம் அல்லது முகப்பு மண்டபம் போன்ற கட்டடப் பகுதியைக் குறிக்கிறது; அரச அரண்மனைச் சூழலில் הַכִּסֵּא என்பதன் அரசாட்சிசார் பொருளை ‘அரியணை’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר יִשְׁפָּט שָׁם
  choice: அவர் அங்கே தீர்ப்பு வழங்கவிருந்த
  rationale: יִשְׁפָּט இங்குப் பழக்கமான அல்லது நோக்கமாக நிர்ணயிக்கப்பட்ட செயலைக் குறிக்கலாம். மண்டபத்தின் பயன்பாட்டைத் தெளிவாகவும் இயல்பாகவும் கூற ‘தீர்ப்பு வழங்கவிருந்த’ என மொழிபெயர்க்கப்பட்டது.
- source_word: אֻלָם הַמִּשְׁפָּט
  choice: நியாயத்தீர்ப்பு மண்டபத்தை
  rationale: இந்த இணைப்புச் சொற்றொடர் மண்டபத்தை அதன் பணியால் பெயரிடுகிறது. ‘நியாயத்தீர்ப்பு’ என்பது מִשְׁפָּט என்பதிலுள்ள நீதித்துறைப் பொருளைப் பேணுகிறது; நவீன அமைப்பைக் குறிக்கக்கூடிய ‘நீதிமன்றம்’ தவிர்க்கப்பட்டது.
- source_word: עָשָׂה
  choice: அமைத்தார்
  rationale: עָשָׂה என்பதன் அடிப்படைப் பொருள் ‘செய்தார்’ என்றாலும், கட்டடப் பட்டியல் சூழலில் ‘அமைத்தார்’ என்பது இயல்பாகவும் மூலத்தின் பரந்த பொருளுக்கு ஏற்றதாகவும் உள்ளது.
- source_word: וְסָפוּן בָּאֶרֶז
  choice: கேதுரு மரப் பலகைகளால் மூடப்பட்டிருந்தது
  rationale: סָפוּן என்பது மரத்தால் மூடுதல், பதித்தல் அல்லது பலகையிடுதலைக் குறிக்கிறது. ‘மரப் பலகைகளால் மூடப்பட்டிருந்தது’ கட்டடத்தின் உட்புறப் பூச்சை சாதாரண வாசகருக்குத் தெளிவாக எடுத்துரைக்கிறது.
- source_word: מֵהַקַּרְקַע עַד הַקַּרְקָע
  choice: தரையிலிருந்து தரை வரை
  rationale: எபிரெய உரை ‘தரை’ என்ற சொல்லை இருமுறை பயன்படுத்துகிறது. அதன் சிக்கலையும் தெளிவின்மையையும் முதன்மை உரையில் பேணி, பொதுவான சூழல்சார் விளக்கம் அடிக்குறிப்பில் தரப்பட்டது.
