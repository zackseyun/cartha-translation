  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கட்டடவியல் நடையில் வடிவமைக்கப்பட்டது. மூலத்தின் இடைச்செருகல் போன்ற இணைநிலையை நீண்ட கோடுகள் பேணுகின்றன; தெளிவில்லாத இறுதித் தொடர் விளக்கமாக மாற்றப்படாமல் அடிக்குறிப்புடன் வைக்கப்பட்டுள்ளது.
