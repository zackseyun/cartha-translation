- source_word: כְרוּבִים
  choice: கேருபீன்கள்
  rationale: இது குறிப்பிட்ட வகை விண்ணுலக உயிர்களைக் குறிக்கும் மரபான ஒலிபெயர்ப்பு; சாதாரண உருவகமாக மாற்றப்படவில்லை.
- source_word: כֵּן
  choice: அவ்வாறே
  rationale: பலகைகளில் இருந்த அலங்காரத்துக்கும் சட்டங்களின் மேல்பகுதியில் இருந்த அலங்காரத்துக்கும் உள்ள ஒப்புமையை வாசிக்கத்தக்க தமிழில் தெரிவிக்கிறது.
- source_word: מִמַּעַל
  choice: மேல்பகுதியில்
  rationale: அலங்காரம் அமைந்திருந்த இடத்தை இயல்பான தமிழில் தெளிவுபடுத்துகிறது.
- source_word: מִתַּחַת
  choice: கீழே
  rationale: מִמַּעַל என்பதற்கு இணையான எதிர்திசை இடக்குறிப்பை எளிமையாகத் தருகிறது.
- source_word: לֹיוֹת
  choice: மாலை வடிவ அணிகள்
  rationale: அரிதான இச்சொல் மலர்மாலை அல்லது தோரணம் போன்ற அலங்காரத்தைக் குறிக்கலாம்; அதன் துல்லிய வடிவம் உறுதியில்லாததால் பொதுவான விளக்கச் சொற்றொடர் பயன்படுத்தப்பட்டது.
- source_word: מַעֲשֵׂה מוֹרָד
  choice: தொங்கும் புடைப்புவேலை
  rationale: கீழ்நோக்கித் தொங்கும் அல்லது இறங்கும் வடிவில் செய்யப்பட்ட அலங்கார வேலையை இக்கடினமான சொற்றொடர் குறிக்கக்கூடும்; கலைவடிவத்தையும் இடநிலையையும் அளவாக வெளிப்படுத்துகிறது.
