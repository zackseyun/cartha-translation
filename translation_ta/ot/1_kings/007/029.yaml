  text: And on the panels that were between the frames were lions[a], oxen, and cherubim; and on the frames likewise above, and beneath the lions and the oxen were wreaths[b], a work of hanging relief.
translation:
  language: ta
  text: சட்டகங்களுக்கு இடையில் இருந்த பலகைகளின்மேல் சிங்கங்கள், மாடுகள், கேருபீன்கள் ஆகியவற்றின் உருவங்கள் இருந்தன. சட்டகங்களின் மேல்பகுதியிலும் அவ்வாறே இருந்தன. சிங்கங்களுக்கும் மாடுகளுக்கும் கீழே, மாலை வடிவ அலங்காரங்கள்[a] தொங்கும் புடைப்பு வேலைப்பாடாக[b] அமைந்திருந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தோரணங்கள்’ என்றும் மொழிபெயர்க்கலாம்; இதற்கான எபிரெயச் சொல் அரிதானது, அலங்காரத்தின் துல்லிய வடிவம் உறுதியாகத் தெரியவில்லை.
    reason: lexical_alternative
  - marker: b
    text: ‘தொங்கும் புடைப்பு வேலைப்பாடு’ என்று மொழிபெயர்க்கப்பட்டுள்ள எபிரெயச் சொற்றொடர் பொருள் தெளிவற்றது; சிங்கங்களுக்கும் மாடுகளுக்கும் கீழே தொங்கிய அல்லது கீழ்நோக்கி இறங்கிய அலங்கார வேலையை இது குறிக்கலாம்.
    reason: lexical_alternative
