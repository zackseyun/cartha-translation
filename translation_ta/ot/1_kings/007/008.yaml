translation_notes:
  register: நவீன செந்தமிழ் நடையில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான சொற்கள் பயன்படுத்தப்பட்டுள்ளன. அரச கட்டடச் சூழலில் בַּיִת என்பதற்கு ‘அரண்மனை’, אוּלָם என்பதற்கு ‘மண்டபம்’, חָצֵר என்பதற்கு ‘முற்றம்’ என ஒருமையான கட்டடச் சொல்லாட்சி பின்பற்றப்பட்டுள்ளது. தெளிவில்லாத எபிரெய இடவியல் தொடர்பு முதன்மை உரையில் வாசிக்க எளிதாகவும் அடிக்குறிப்பில் அதன் உண்மையான ஐயப்பாட்டுடனும் வழங்கப்பட்டுள்ளது.
