base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/008.yaml
  text: His house where he was to live[a], in the other court farther back from the Hall, was of the same workmanship. He also made a house like this Hall for Pharaoh’s daughter[b], whom Solomon had taken as wife.
translation:
  language: ta
  text: அவன் குடியிருக்கவிருந்த அவனுடைய அரண்மனை[a], மண்டபத்திற்குப் பின்னால் இருந்த மற்ற முற்றத்தில் அமைந்திருந்தது; அதுவும் அதேவிதமான வேலைப்பாட்டில் கட்டப்பட்டிருந்தது. சாலொமோன் மணந்துகொண்ட பார்வோனின் மகளுக்காகவும்[b] இந்த மண்டபத்தைப் போன்ற ஓர் அரண்மனையைக் கட்டினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவன் குடியிருக்கவிருந்த அரண்மனை, மண்டபத்திலிருந்து இன்னும் உட்புறமாக இருந்த வேறொரு முற்றத்தில் அமைந்திருந்தது.” இந்த எபிரெய இடவியல் சொற்றொடரின் பொருள் தெளிவில்லை.
    reason: alternative_reading
  - marker: b
    text: எபிரெயத்தில், “சாலொமோன் எடுத்துக்கொண்ட பார்வோனின் மகள்”; அதாவது, சாலொமோன் திருமணம் செய்துகொண்டவள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֵיתוֹ
  choice: அவனுடைய அரண்மனை
  rationale: בַּיִת என்பதன் அடிப்படைப் பொருள் ‘வீடு’; ஆனால் அரச கட்டடத் தொகுதியை விவரிக்கும் இச்சூழலில் ‘அரண்மனை’ என்பது இயல்பாகவும் துல்லியமாகவும் உள்ளது. தொடக்க ו தமிழ் வாக்கிய ஓட்டத்தில் தனியே மொழிபெயர்க்கப்படவில்லை.
- source_word: אֲשֶׁר יֵשֶׁב שָׁם
  choice: அவன் குடியிருக்கவிருந்த
  rationale: יָשַׁב என்பது ‘உட்கார்/வசித்திரு’ எனப் பொருள்படும். இங்கு கட்டடத்தின் நோக்கத்தைச் சுட்டுவதால் வருங்கால நோக்குடைய ‘குடியிருக்கவிருந்த’ தேர்ந்தெடுக்கப்பட்டது; שָׁם என்பதன் இடப்பொருள் தொடர்புச் சொல்லில் இயல்பாக அடங்குகிறது.
- source_word: חָצֵר הָאַחֶרֶת
  choice: மற்ற முற்றத்தில்
  rationale: חָצֵר என்பது அரண்மனை வளாகத்தின் ‘முற்றம்’. பெயரடையுடன் உள்ள சுட்டு உருபு குறிப்பிட்ட மற்றொரு முற்றத்தைக் குறிக்கிறது.
- source_word: מִבֵּית לָאוּלָם
  choice: மண்டபத்திற்குப் பின்னால் இருந்த
  rationale: இது பொருள் தெளிவில்லாத இடவியல் சொற்றொடர். மண்டபத்திலிருந்து உட்புறமாக அல்லது பின்னால் இருந்த இடத்தை இயல்பான தமிழில் குறிக்கிறது; மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: כַּמַּעֲשֶׂה הַזֶּה הָיָה
  choice: அதுவும் அதேவிதமான வேலைப்பாட்டில் கட்டப்பட்டிருந்தது
  rationale: מַעֲשֶׂה இங்கு செயலைவிட கட்டுமான வேலைப்பாடு அல்லது வடிவமைப்பைக் குறிக்கிறது. ஒப்புமையை ‘அதேவிதமான’ என்பதன் மூலம் வெளிப்படுத்துகிறது.
- source_word: וּבַיִת יַעֲשֶׂה
  choice: ஓர் அரண்மனையைக் கட்டினான்
  rationale: கட்டுமானச் சுருக்கத்தின் தொடர்ச்சியில் yiqtol கடந்தகால விவரிப்பாகப் புரிந்துகொள்ளப்படுகிறது. வினையின் செய்பவன் சூழலிலிருந்து சாலொமோன் எனத் தெளிவாகிறது.
- source_word: לְבַת פַּרְעֹה
  choice: பார்வோனின் மகளுக்காக
  rationale: எபிரெயக் கட்டமைப்பின் நேரடியான, இயல்பான தமிழாக்கம்.
- source_word: אֲשֶׁר לָקַח שְׁלֹמֹה
  choice: சாலொமோன் மணந்துகொண்ட
  rationale: ஒரு பெண்ணைச் செயப்படுபொருளாகக் கொண்ட לָקַח திருமணத்தில் ‘எடுத்துக்கொள்’ என்ற வழக்குப் பொருளைக் கொண்டிருக்கலாம். இயல்பான தமிழில் அதன் நோக்குப்பொருள் வெளிப்படுத்தப்பட்டுள்ளது; சொல்லடிப்படையான வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: כָּאוּלָם הַזֶּה
  choice: இந்த மண்டபத்தைப் போன்ற
  rationale: אוּלָם என்பது இங்கு முக்கியமான அரண்மனைக் கூடம் அல்லது மண்டபம். ‘மண்டபம்’ தமிழில் கட்டடச் சூழலுக்கு ஏற்றது; כ ஒப்புமையைச் சுட்டுகிறது.
