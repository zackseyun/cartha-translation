source:
  edition: WLC
  text: וַ/יַּנַּ֤ח שְׁלֹמֹה֙ אֶת כָּל הַ/כֵּלִ֔ים מֵ/רֹ֖ב מְאֹ֣ד מְאֹ֑ד לֹ֥א נֶחְקַ֖ר מִשְׁקַ֥ל הַ/נְּחֹֽשֶׁת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/047.yaml
  text: And Solomon left all the vessels unweighed because they were exceedingly many[a]; the weight of the bronze was not determined.
translation:
  language: ta
  text: சாலொமோன் அந்தப் பாத்திரங்கள் அனைத்தையும் எடைபோடாமல் விட்டுவிட்டான்; ஏனெனில் அவை மிகமிக ஏராளமாக இருந்தன.[a] வெண்கலத்தின் எடை கணக்கிடப்படவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சாலொமோன் அந்தப் பாத்திரங்கள் அனைத்தையும் அப்படியே விட்டுவிட்டான்; ஏனெனில் அவை மிகமிக ஏராளமாக இருந்தன; வெண்கலத்தின் எடை ஆராய்ந்து கண்டறியப்படவில்லை.”
    reason: וַיַּנַּח என்பதை வெறுமனே ‘விட்டுவிட்டான்’ என்றும், לֹא נֶחְקַר என்பதை இன்னும் சொற்சார்பாக ‘ஆராய்ந்து கண்டறியப்படவில்லை’ என்றும் மொழிபெயர்க்கலாம்.
lexical_decisions:
- source_word: וַיַּנַּח
  choice: எடைபோடாமல் விட்டுவிட்டான்
  rationale: வினைச்சொல் அடிப்படையில் ‘விட்டுவைத்தான்/அப்படியே விட்டான்’ என்று பொருள்படும். அடுத்த கூற்று வெண்கலத்தின் எடை கண்டறியப்படவில்லை என விளக்குவதால், இயல்பான தமிழில் என்ன செய்யப்படாமல் விடப்பட்டது என்பதைச் சூழலின் அடிப்படையில் வெளிப்படுத்துகிறது.
- source_word: כָּל הַכֵּלִים
  choice: அந்தப் பாத்திரங்கள் அனைத்தையும்
  rationale: כֵּלִים என்பது கருவிகள், பொருட்கள், பாத்திரங்கள் ஆகியவற்றைக் குறிக்கக்கூடிய பரந்த சொல். ஆலயப் பொருட்களின் இச்சூழலில் ‘பாத்திரங்கள்’ தெளிவானதும் மரபாகப் பொருத்தமானதும் ஆகும்.
- source_word: מֵרֹב מְאֹד מְאֹד
  choice: ஏனெனில் அவை மிகமிக ஏராளமாக இருந்தன
  rationale: מִן + רֹב காரணத்தைக் காட்டுகிறது; இருமுறை வரும் מְאֹד வலுவான மிகுதியை வலியுறுத்துகிறது. ‘மிகமிக ஏராளமாக’ அந்த அழுத்தத்தை எளிய நவீன தமிழில் காக்கிறது.
- source_word: לֹא נֶחְקַר
  choice: கணக்கிடப்படவில்லை
  rationale: חקר என்பதன் நிபால் வடிவம் இங்கு எடை தீர்மானிக்கப்படவில்லை அல்லது துல்லியமாகக் கண்டறியப்படவில்லை என்பதைக் குறிக்கிறது. எடையைப் பற்றிய சூழலில் ‘கணக்கிடப்படவில்லை’ இயல்பாக உள்ளது.
- source_word: מִשְׁקַל
  choice: எடை
  rationale: இந்தப் பெயர்ச்சொல் எடையையோ எடையின்படி அளவையையோ நேரடியாகக் குறிக்கிறது.
- source_word: הַנְּחֹשֶׁת
  choice: வெண்கலம்
  rationale: ஆலயம் மற்றும் அதன் பொருட்கள் குறித்த சூழல்களில் נְחֹשֶׁת வழக்கமாகத் தூய செம்பை விட வெண்கலத்தைக் குறிக்கிறது.
