  register: நவீன தரத் தமிழில், ஆலயப் பொருளின் கண்ணியமான விளக்க நடையைப் பேணுகிறது. ‘கடல்’ என்பது பெரிய வார்ப்புப் பாத்திரத்தின் சிறப்புப் பெயராகத் தக்கவைக்கப்பட்டுள்ளது; அளவீட்டிற்கு வழக்கமான வேதாகமத் தமிழ் சொல்லான ‘முழம்’ பயன்படுத்தப்பட்டுள்ளது.
