base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/024.yaml
  text: And gourds were under its rim all around[a], encircling it, ten to the cubit, surrounding the Sea all around. The gourds were in two rows, cast in one piece with it.
translation:
  language: ta
  text: அதன் விளிம்புக்குக் கீழே சுற்றிலும் சுரைக்காய் வடிவ அலங்காரங்கள்[a] இருந்தன. ஒரு முழத்திற்கு பத்து என்ற கணக்கில் அவை அந்தக் கடலைச் சுற்றி வளைத்திருந்தன. அந்தச் சுரைக்காய் வடிவ அலங்காரங்கள் இரண்டு வரிசைகளாக, கடல் வார்க்கப்பட்டபோதே அதனுடன் ஒன்றாக வார்க்கப்பட்டிருந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மொட்டுகள்” அல்லது “புடைப்புகள்”; எபிரெயச் சொல் சுரைக்காய் போன்ற வடிவுடைய அலங்காரங்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְקָעִים
  choice: காய்வடிவ அலங்காரங்கள்
  rationale: פְקָעִים என்பது இச்சூழலில் சுரைக்காய் போன்ற வடிவுடைய புடைப்பு அலங்காரங்களைக் குறிக்கிறது. குறிப்பிட்ட தாவர இனத்தை உறுதிப்படுத்தாமல், அவற்றின் வடிவத்தையும் அலங்காரப் பண்பையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: מִתַּחַת לִשְׂפָתוֹ
  choice: அதன் விளிம்புக்குக் கீழே
  rationale: שָׂפָה என்பதன் அடிப்படைப் பொருள் ‘உதடு/ஓரம்’; பெரிய பாத்திரத்தின் மேல் ஓரத்தை நவீன தமிழில் ‘விளிம்பு’ இயல்பாகக் குறிக்கிறது.
- source_word: סָבִיב סֹבְבִים אֹתוֹ
  choice: சுற்றிலும் ... சுற்றி வளைத்திருந்தன
  rationale: எபிரெயத்தில் ஒரே வேர் சார்ந்த சொற்கள் மீண்டும் வந்து சுற்றியிருப்பதை வலியுறுத்துகின்றன; தமிழில் இயல்பாக இருக்கும்படியும் அந்த வலியுறுத்தலை முற்றிலும் இழக்காமலும் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: עֶשֶׂר בָּאַמָּה
  choice: ஒரு முழத்திற்கு பத்து என்ற கணக்கில்
  rationale: சுற்றளவில் ஒவ்வொரு முழத்திற்கும் பத்து அலங்காரங்கள் இருந்த அடர்த்தி அல்லது எண்ணிக்கையைத் தெளிவான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: מַקִּפִים אֶת הַיָּם סָבִיב
  choice: அவை அந்தக் கடலைச் சுற்றி வளைத்திருந்தன
  rationale: הַיָּם என்பது இங்கு பெரிய வார்ப்புப் பாத்திரத்திற்கான சிறப்புப் பெயர்; ‘அந்தக் கடல்’ என்று கூறுவது அதன் குறிப்பிட்ட பொருளைத் தக்கவைக்கிறது.
- source_word: שְׁנֵי טוּרִים
  choice: இரண்டு வரிசைகளாக
  rationale: טוּרִים என்பதன் நேரடியான பொருள் ‘வரிசைகள்’; அடுத்துவரும் வார்ப்பு விவரத்துடன் தமிழில் இயல்பாக இணைகிறது.
- source_word: יְצֻקִים בִּיצֻקָתוֹ
  choice: கடல் வார்க்கப்பட்டபோதே அதனுடன் ஒன்றாக வார்க்கப்பட்டிருந்தன
  rationale: ஒரே வேரிலிருந்து வந்த வினை வடிவமும் பெயர்ச்சொல்லும், அலங்காரங்கள் பின்னர் பொருத்தப்படாமல் பாத்திரத்தோடு ஒரே வார்ப்பாக உருவாக்கப்பட்டதைச் சுட்டுகின்றன.
