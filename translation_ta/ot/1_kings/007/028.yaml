  text: 'And this was the construction of the stand: they had frames[b][a], and there were frames between the supports.'
translation:
  language: ta
  text: 'அந்தத் தாங்கியின் அமைப்பு இதுவே: அதில் சட்டகப் பகுதிகள்[a] இருந்தன; இணைப்புக் கம்பிகளுக்கு[b] இடையிலும் சட்டகப் பகுதிகள் இருந்தன.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சட்டகப் பகுதிகள்’ என்பதற்கான எபிரெயச் சொல் ‘பலகைகள்’ அல்லது ‘சட்டங்கள்’ என்றும் மொழிபெயர்க்கப்படலாம்; தாங்கியின் சட்டமிடப்பட்ட பகுதிகளையே இது குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: இங்கு ‘இணைப்புக் கம்பிகள்’ என்று மொழிபெயர்க்கப்பட்ட எபிரெயச் சொல் ‘குறுக்குக் கம்பிகள்,’ ‘செங்குத்துக் கம்பிகள்,’ அல்லது ‘நீளக் கம்பிகள்’ என்றும் பொருள்படலாம்; குறிப்பிடப்படும் கட்டுமான உறுப்பு எது என்பது உறுதியாகத் தெரியவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֶה
  choice: இதுவே
  rationale: விளக்கப்படவிருக்கும் அமைப்பைச் சுட்டும் எபிரெயச் சொற்றொடரின் உரையாடல் ஓட்டத்தை இயல்பான தமிழில் தருகிறது; தொடக்க וְ தமிழில் தனியாக மொழிபெயர்க்கப்படாமல் வாக்கியத் தொடரில் உணர்த்தப்படுகிறது.
- source_word: מַעֲשֵׂה
  choice: அமைப்பு
  rationale: இங்கு பொதுவான ‘வேலை’ அல்ல, தாங்கி எவ்வாறு வடிவமைக்கப்பட்டிருந்தது என்பதே பொருள்; ‘அமைப்பு’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: הַמְּכוֹנָה
  choice: அந்தத் தாங்கி
  rationale: இப்பகுதியில் கழுவும் தொட்டிகளைத் தாங்கிய நகர்த்தக்கூடிய அடித்தள அமைப்பைக் குறிக்கிறது. ‘தாங்கி’ அதன் செயல்பாட்டைத் தெளிவாகக் காட்டுகிறது.
- source_word: מִסְגְּרֹת
  choice: சட்டகப் பகுதிகள்
  rationale: இந்தச் சொல் சட்டமிட்ட பகுதிகளையோ பலகைகளையோ குறிக்கலாம். கட்டுமானச் சூழலுக்கு ஏற்றவாறு, குறிப்பிட்ட வடிவை மிகையாக நிர்ணயிக்காமல் ‘சட்டகப் பகுதிகள்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: לָהֶם
  choice: அதில் ... இருந்தன
  rationale: உடைமையைக் குறிக்கும் எபிரெய அமைப்பு தமிழில் இயல்பாக இடவியல் உடைமையாக வழங்கப்படுகிறது. எபிரெயில் பன்மை பின்னொட்டு இருந்தாலும், உடனடி சூழலில் வரும் ஒருமை ‘தாங்கி’யோடு தமிழ் வாக்கியம் ஒத்திசைக்கப்பட்டுள்ளது.
- source_word: וּמִסְגְּרֹת
  choice: இடையிலும் சட்டகப் பகுதிகள் இருந்தன
  rationale: மீண்டும் வரும் பெயர்ச்சொல்லைத் தக்கவைத்து கட்டுமான விவரத்தின் இணை அமைப்பைப் பாதுகாக்கிறது.
- source_word: בֵּין
  choice: இடையில்
  rationale: கட்டுமான உறுப்புகளுக்கிடையேயான இடத்தைக் குறிக்கும் நேரடியான இடவியல் பொருள்.
- source_word: הַשְׁלַבִּים
  choice: இணைப்புக் கம்பிகள்
  rationale: இவை கட்டமைப்பை இணைக்கும் உறுப்புகள் என்பதைக் காட்டும் எச்சரிக்கையான மொழிபெயர்ப்பு. அவை குறுக்குக் கம்பிகளா, செங்குத்துக் கம்பிகளா, தண்டவாளங்களா என்பது உறுதியாகத் தெரியவில்லை.
