  text: And the foundation was of costly stones[a], large stones, stones of ten cubits and stones of eight cubits.
translation:
  language: ta
  text: அஸ்திவாரம் விலையுயர்ந்த, பெரிய கற்களால்[a]—பத்து முழ அளவுள்ள கற்களாலும் எட்டு முழ அளவுள்ள கற்களாலும்—அமைக்கப்பட்டிருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மதிப்புமிக்க கற்களால்.’ எபிரெயச் சொல் கற்களின் உயர்ந்த மதிப்பையோ தரத்தையோ வலியுறுத்துகிறது; இந்தக் கட்டடச் சூழலில் அது இரத்தினக் கற்களைக் குறிப்பது குறைவாகச் சாத்தியமானது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמְיֻסָּד
  choice: அஸ்திவாரம் ... அமைக்கப்பட்டிருந்தது
  rationale: יסד என்பதன் செயப்பாட்டு வடிவத்தை கட்டடச் சூழலுக்கு ஏற்ற இயல்பான தமிழில் தருகிறது. முன்னுள்ள சூழல் உணர்த்தும் அஸ்திவாரத்தை வெளிப்படையாகக் குறிப்பிட்டாலும் தேவையற்ற விவரத்தைச் சேர்க்கவில்லை.
- source_word: אֲבָנִים יְקָרוֹת
  choice: விலையுயர்ந்த கற்கள்
  rationale: יקרות இங்கு கற்களின் உயர்ந்த மதிப்பு அல்லது செலவைச் சுட்டுகிறது. கட்டடச் சூழலில் ‘விலையுயர்ந்த’ என்பது இரத்தினக் கற்கள் என்ற தவறான எண்ணத்தைத் தவிர்க்கிறது.
- source_word: אֲבָנִים גְּדֹלוֹת
  choice: பெரிய கற்கள்
  rationale: גדלות இங்கு கற்களின் உடல் அளவைக் குறிக்கிறது; ‘பெரிய’ என்பது நவீனத் தமிழில் நேரடியும் இயல்புமான சொல்.
- source_word: אַבְנֵי עֶשֶׂר אַמּוֹת
  choice: பத்து முழ அளவுள்ள கற்கள்
  rationale: கற்களின் அளவைச் சொல்லும் எபிரெயக் கட்டமைப்பைத் தெளிவாகத் தருகிறது. எந்தத் திசையின் அளவு என்பது மூலத்தில் குறிப்பிடப்படாததால் நீளம், அகலம் அல்லது உயரம் எனச் சேர்க்கப்படவில்லை.
- source_word: וְאַבְנֵי שְׁמֹנֶה אַמּוֹת
  choice: எட்டு முழ அளவுள்ள கற்கள்
  rationale: முந்தைய சொற்றொடருக்கு இணையான அமைப்பைத் தமிழிலும் காத்து, குறிப்பிடப்படாத அளவுத் திசையை நிரப்பாமல் விடுகிறது.
- source_word: אַמּוֹת
  choice: முழ
  rationale: אַמָּה என்ற பழங்கால அளவுக்கான வழக்கமான தமிழ் வேதாகம அளவுச்சொல். நவீன அலகாக ஊகித்து மாற்றாமல் மூலத்தின் அளவைப் பாதுகாக்கிறது.
