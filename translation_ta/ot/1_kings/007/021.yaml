base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/021.yaml
  text: He set up the pillars at the portico of the temple[a]. He set up the right pillar and called its name Jachin; then he set up the left pillar and called its name Boaz.
translation:
  language: ta
  text: அவன் ஆலயத்தின் முன்மண்டபத்தில் தூண்களை நிறுவினான். வலப்பக்கத் தூணை நிறுவி, அதற்கு யாக்கீன்[a] என்று பெயரிட்டான்; இடப்பக்கத் தூணை நிறுவி, அதற்கு போவாஸ் என்று பெயரிட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: யாக்கீன், போவாஸ் என்பவை எபிரெய மொழியிலுள்ள தூண்களின் பெயர்களின் ஒலிபெயர்ப்புகள்; அவற்றின் சாத்தியமான பொருள்களின் மொழிபெயர்ப்புகள் அல்ல.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: நிறுவினான்
  rationale: ஹிபில் வடிவில் ‘நிற்கச் செய்தல், நிலைநிறுத்துதல்’ என்பதே இங்கு பொருள்; கட்டிடத் தூண்களை அவற்றின் இடத்தில் எழுப்பி நிலைநிறுத்திய செயலை ‘நிறுவினான்’ இயல்பாகக் காட்டுகிறது.
- source_word: הָעַמֻּדִים
  choice: தூண்களை
  rationale: עַמּוּד என்பது கட்டிடத் தூண்களைக் குறிக்கிறது; ஆலயக் கட்டுமானச் சூழலில் ‘தூண்கள்’ தெளிவான நவீனத் தமிழ்ச் சொல்.
- source_word: לְאֻלָם הַהֵיכָל
  choice: ஆலயத்தின் முன்மண்டபத்தில்
  rationale: אוּלָם என்பது ஆலயத்தின் முன்புற மண்டபம் அல்லது முகப்பு மண்டபம்; לְ இங்கு சூழலின்படி இடப்பொருளில் எடுத்துக்கொள்ளப்பட்டுள்ளது.
- source_word: הָעַמּוּד הַיְמָנִי
  choice: வலப்பக்கத் தூணை
  rationale: יְמָנִי என்பதன் நேரடிப் பொருள் வலப்புறம் சார்ந்தது; திசையை ஊகிக்காமல் இடவமைப்பை அப்படியே காக்கிறது.
- source_word: וַיִּקְרָא אֶת שְׁמוֹ
  choice: அதற்கு … என்று பெயரிட்டான்
  rationale: எபிரெய மொழிமரபின் நேரடிப் பொருள் ‘அதன் பெயரை அழைத்தான்’; நவீனத் தமிழில் ‘பெயரிட்டான்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: יָכִין
  choice: யாகீன்
  rationale: தூணின் எபிரெயப் பெயர் மொழிபெயர்க்கப்படாமல் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: הָעַמּוּד הַשְּׂמָאלִי
  choice: இடப்பக்கத் தூணை
  rationale: שְׂמָאלִי என்பது இடப்புறம் சார்ந்தது; வலப்பக்கத் தூணுடன் உள்ள இணை அமைப்பைத் தக்கவைக்கிறது.
- source_word: בֹּעַז
  choice: போவாஸ்
  rationale: தூணின் எபிரெயப் பெயர் மொழிபெயர்க்கப்படாமல் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது; ע ஒலி தமிழில் தனியாகத் துல்லியமாகக் குறிக்க முடியாததால் வழக்கமான எளிய ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டது.
