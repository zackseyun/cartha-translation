translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய வாக்கியத்தின் மூன்று முறை வரும் ‘நிறுவினான்’ என்ற இணை அமைப்பு பாதுகாக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறியீடு இரு பெயர்களுக்கும் பொருந்தும் வகையில் முதல் பெயருக்குப் பின் இடப்பட்டுள்ளது.
