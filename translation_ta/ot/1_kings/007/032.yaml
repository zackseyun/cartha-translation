base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/032.yaml
  text: And the four wheels were underneath the panels[a], and the axles of the wheels were on the stand[b]; and the height of each wheel was a cubit and a half.
translation:
  language: ta
  text: நான்கு சக்கரங்களும் சட்டங்களுக்குக் கீழே இருந்தன[a]; சக்கரங்களின் அச்சுகள் தாங்கியில் இருந்தன[b]. ஒவ்வொரு சக்கரமும் ஒன்றரை முழம் உயரமாயிருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது ‘பலகைகள்’ அல்லது ‘விளிம்புகள்’ (எபிரெயம்: מִסְגְּרוֹת).'
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் சொல்லுக்குச் சொல் ‘சக்கரங்களின் கைகள்’; சூழலில் இது சக்கர அச்சுகளை அல்லது அவற்றைத் தாங்கும் தண்டுகளைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֹפַנִּים / הָאוֹפַן
  choice: சக்கரங்கள் / சக்கரம்
  rationale: இந்தக் கட்டுமான விவரிப்பில், இச்சொல் வெண்கலத் தாங்கியுடன் இணைக்கப்பட்ட உண்மையான சக்கரங்களைக் குறிக்கிறது.
- source_word: לְמִתַּחַת
  choice: கீழே
  rationale: சட்டங்களின் அடிப்புறத்தில் சக்கரங்கள் இருந்த இடத்தொடர்பை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: הַמִּסְגְּרוֹת
  choice: சட்டங்கள்
  rationale: இந்தச் சூழலில் தாங்கியின் பக்கங்களில் அமைந்த சட்டம் அல்லது விளிம்புடன் கூடிய பகுதிகளைக் குறிக்கலாம்; மூலச்சொல்லின் கட்டமைப்புச் சார்ந்த பொருளைத் தக்கவைக்கிறது.
- source_word: וִידוֹת
  choice: அச்சுகள்
  rationale: எழுத்துப்பொருள் ‘கைகள்’ என்றாலும், இயந்திரச் சூழலில் சக்கரங்களைத் தாங்கிய அல்லது இணைத்த நீட்சிகளைக் குறிக்கிறது; ‘அச்சுகள்’ அதன் செயல்பாட்டைத் தெளிவாகக் காட்டுகிறது.
- source_word: בַּמְּכוֹנָה
  choice: தாங்கியின் மேல் பொருத்தப்பட்டிருந்தன
  rationale: מְכוֹנָה என்பது சக்கரங்களையுடைய வெண்கலத் தாங்கியைக் குறிக்கிறது; בְּ இணைப்பை மட்டும் அல்லாமல் தாங்கியுடன் அச்சுகள் பொருத்தப்பட்டிருந்த உறவையும் இங்கு தெரிவிக்கிறது.
- source_word: קוֹמַת
  choice: உயரம்
  rationale: செங்குத்தான அளவைக் குறிக்கும் நேரடியான, இயல்பான தமிழ் இணைச்சொல்.
- source_word: הָאֶחָד
  choice: ஒவ்வொரு
  rationale: எழுத்துப்படி ‘ஒன்று’ என்றாலும், எல்லாச் சக்கரங்களுக்கும் தனித்தனியாகப் பொருந்தும் அளவை இங்கு பகிர்வாகக் குறிக்கிறது.
- source_word: אַמָּה וַחֲצִי הָאַמָּה
  choice: ஒன்றரை முழம்
  rationale: பண்டைய அளவான முழத்தை அப்படியே தக்கவைத்து, தமிழில் இயல்பாக ஒன்றரை என்ற அளவை வழங்குகிறது.
