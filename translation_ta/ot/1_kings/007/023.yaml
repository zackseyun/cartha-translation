translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘கடல்’ என்ற எபிரெயப் பெயர் மேற்கோள் குறிகளுடன் பாதுகாக்கப்பட்டு, அதன் செயல்பாட்டு பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது. அளவுகள் மாற்றப்படாமல் ‘முழம்’ என வைக்கப்பட்டுள்ளன.
