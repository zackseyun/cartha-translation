  text: Then he made the cast sea[a], ten cubits from brim to brim, round all around; its height was five cubits[c][b], and a line of thirty cubits went around it all around.
translation:
  language: ta
  text: பின்பு அவன் வார்க்கப்பட்ட ‘கடலை’[a] செய்தான். அது ஒரு விளிம்பிலிருந்து மறு விளிம்பு வரை பத்து முழம் அகலமாகவும், சுற்றிலும் வட்டமாகவும் இருந்தது. அதன் உயரம் ஐந்து முழம். முப்பது முழ நீளமுள்ள ஒரு அளவுக்கயிறு[c] அதைச் சுற்றி வந்தது.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீர்த்தொட்டி.” எபிரேயத்தில் ஆலயத்திலிருந்த இந்தப் பெரிய பாத்திரம் முறையாக ‘கடல்’ என்று அழைக்கப்படுகிறது; அந்தப் பெயர் முதன்மை உரையில் தக்கவைக்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: எபிரேயத்தில், “முப்பது முழமுள்ள ஒரு கயிறு அதைச் சுற்றி வந்தது”; அதாவது, அதன் சுற்றளவு முப்பது முழம்.
    reason: cultural_note
  - marker: c
    text: இங்கு எழுதப்பட்டுள்ள வடிவம் קוה; மசோரேத்திய வாசிப்பு மரபில் இது அளவிடும் கயிறு என்ற பொருளில் வாசிக்கப்படுகிறது. 2 நாளாகமம் 4:2-இல் உள்ள இணைப் பகுதியையும் காண்க.
    reason: textual_variant
