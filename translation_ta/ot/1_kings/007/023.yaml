- from: பின்பு அவன் வார்ப்பினால் செய்யப்பட்ட ‘கடலை’[a] உருவாக்கினான். அது ஒரு விளிம்பிலிருந்து மறு விளிம்புவரை பத்து முழம் அகலமும், சுற்றிலும் வட்ட வடிவமும் கொண்டிருந்தது. அதன் உயரம் ஐந்து முழம். முப்பது முழ நீளமுள்ள ஒரு கயிறு[c] அதைச் சுற்றியிருந்தது.[b]
  to: பின்பு அவன் வார்க்கப்பட்ட ‘கடலை’[a] செய்தான். அது ஒரு விளிம்பிலிருந்து மறு விளிம்பு வரை பத்து முழம் அகலமாகவும், சுற்றிலும் வட்டமாகவும் இருந்தது. அதன் உயரம் ஐந்து முழம். முப்பது முழ நீளமுள்ள ஒரு அளவுக்கயிறு[c] அதைச் சுற்றி வந்தது.[b]
  rationale: சிறிய நடைத்திருத்தங்கள் மட்டுமே செய்யப்பட்டுள்ளன. இவை வார்க்கப்பட்ட உலோகப் பொருள், வட்ட அளவு, மற்றும் அளவுக்கயிறு சுற்றிவருதல் ஆகிய மூல உரையின் விவரங்களைத் தெளிவாகவும் நவீனத் தமிழுக்கு இயல்பாகவும் வெளிப்படுத்துகின்றன. அடிக்குறிப்பு அடையாளங்கள் [a], [c], [b] உரையில் தொடர்புடைய சொற்களுக்குப் பிறகு அப்படியே பாதுகாக்கப்பட்டுள்ளன.
