- source_word: קוֹמָתוֹ
  choice: அதன் உயரம்
  rationale: கட்டமைப்பின் செங்குத்தான அளவைக் குறிக்கும் நேரடியான, இயல்பான சொல்.
- source_word: וקוה
  choice: ஒரு கயிறு
  rationale: சுற்றளவை அளக்கப் பயன்படும் கோடு அல்லது அளவுக் கயிறு என்ற பொருளைத் தருகிறது; எழுத்து–வாசிப்பு விவரம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: יָסֹב אֹתוֹ סָבִיב
  choice: அதைச் சுற்றியிருந்தது
  rationale: கயிறு பாத்திரத்தை முழுமையாகச் சுற்றியிருந்ததை இயல்பான தமிழில் கூறுகிறது; எபிரெயில் உள்ள சுற்றுதல் சார்ந்த மீளுரையை தமிழில் தேவையின்றி இரட்டிக்கவில்லை.
- source_word: אַמָּה
  choice: முழம்
  rationale: பழங்கால முழங்கை நீளத்தை அடிப்படையாகக் கொண்ட அளவுக்கு தமிழில் நிலைபெற்ற வேதாகமச் சொல்.
