  source_fidelity: திருத்தம் தேவை. வரைவில் ‘அலங்காரத் தலைப்பகுதிகள் மீதுள்ள ... கிண்ண வடிவப் பகுதிகள்’ என்று இருப்பது கிண்ணவடிவப் பகுதிகள் தலைப்பகுதிகளின் மேல் இருப்பதுபோல் காட்டுகிறது. எபிரெயத்தில் גֻלֹּת הַכֹּתָרֹת என்பது தலைப்பகுதிகளுக்குரிய/அவற்றின் கிண்ணவடிவப் பகுதிகள் என்ற தொடர்பைக் குறிக்கிறது. அவற்றின் சரியான கட்டடக்கலை அமைப்பை இதைவிடத் துல்லியப்படுத்தக் கூடாது.
  naturalness: ‘தலைப்பகுதிகளின் இரண்டு கிண்ணவடிவப் பகுதிகள்’ என்பது பட்டியல் நடையில் இயல்பாகவும் தெளிவாகவும் உள்ளது. அரைப்புள்ளிகளால் பிரிக்கப்பட்ட பொருட்பட்டியல் நவீன நிலையான தமிழுக்கு ஏற்றது.
