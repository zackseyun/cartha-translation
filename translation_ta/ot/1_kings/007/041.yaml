translation:
  language: ta
  text: இரண்டு தூண்கள்; தூண்களின் உச்சியிலிருந்த அலங்காரத் தலைப்பகுதிகளின்[c] இரண்டு கிண்ணவடிவப் பகுதிகள்[a]; தூண்களின் உச்சியிலிருந்த அந்த அலங்காரத் தலைப்பகுதிகளின் இரண்டு கிண்ணவடிவப் பகுதிகளை மூடுவதற்கான இரண்டு வலைப்பின்னல் வேலைப்பாடுகள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கிண்ண வடிவப் பகுதிகள்’ என்பதற்கு ‘உருண்டை வடிவங்கள்’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் வட்டமான அமைப்பைக் குறிக்கிறது, ஆனால் அதன் துல்லியமான கட்டடக்கலை வடிவம் உறுதியல்ல.
    reason: lexical_alternative
  - marker: b
    text: ‘வலைப்பின்னல் வேலைப்பாடுகள்’ என்பதற்கு ‘வலை வடிவ வேலைப்பாடுகள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: இது தூணின் உச்சியிலுள்ள அலங்காரக் கட்டடக்கலைப் பகுதியைக் குறிக்கிறது; இதற்கான தொழில்நுட்பச் சொல் ‘தூண் தலைப்பகம்’.
    reason: lexical_alternative
