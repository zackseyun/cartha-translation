- source_word: עַמֻּדִים
  choice: தூண்கள்
  rationale: ஆலயத்தின் முன் நிறுவப்பட்டிருந்த இரண்டு பெரிய கட்டடக்கலைத் தூண்களைக் குறிக்கும் இயல்பான, துல்லியமான தமிழ்ச் சொல்.
- source_word: גֻלֹּת
  choice: கிண்ண வடிவப் பகுதிகள்
  rationale: தூண்களின் அலங்காரத் தலைப்பகுதிகளுடன் இணைந்த வட்டமான அல்லது கிண்ணம் போன்ற வடிவங்களைக் குறிக்கிறது. துல்லியமான வடிவம் உறுதியல்ல என்பதால் ‘பகுதிகள்’ என்று கூறி வடிவத்தை அளவுக்கு மீறி நிர்ணயிக்காமல் விடப்பட்டுள்ளது.
- source_word: כֹּתָרֹת
  choice: அலங்காரத் தலைப்பகுதிகள்
  rationale: கட்டடக்கலைச் சூழலில் தூணின் மேலுள்ள அலங்காரப் பகுதியைக் குறிக்கிறது. தொழில்நுட்பச் சொல்லை மட்டும் பயன்படுத்தாமல் சாதாரண வாசகருக்கும் புரியும் வகையில் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: רֹאשׁ
  choice: உச்சி
  rationale: சொல்லின் நேரடிப் பொருள் ‘தலை’ என்றாலும், தூண்களைக் குறிக்கும் இக்கட்டடக்கலைச் சூழலில் ‘உச்சி’ இயல்பான தமிழ்.
- source_word: שְּׂבָכוֹת
  choice: வலைப்பின்னல் வேலைப்பாடுகள்
