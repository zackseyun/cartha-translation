  text: וּ/שְׁתֵּ֨י כֹתָרֹ֜ת עָשָׂ֗ה לָ/תֵ֛ת עַל רָאשֵׁ֥י הָֽ/עַמּוּדִ֖ים מֻצַ֣ק נְחֹ֑שֶׁת חָמֵ֣שׁ אַמּ֗וֹת קוֹמַת֙ הַ/כֹּתֶ֣רֶת הָ/אֶחָ֔ת וְ/חָמֵ֣שׁ אַמּ֔וֹת קוֹמַ֖ת הַ/כֹּתֶ֥רֶת הַ/שֵּׁנִֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/016.yaml
  text: He made two capitals of cast bronze to set on the tops of the pillars. The height of the one capital was five cubits[a], and the height of the second capital was five cubits.
translation:
  language: ta
  text: தூண்களின் உச்சியில் வைப்பதற்காக, வார்ப்பு வெண்கலத்தால் இரண்டு அலங்காரத் தலைப்பகுதிகளை[a] அவன் செய்தான். ஒரு தலைப்பகுதியின் உயரம் ஐந்து முழம்; இரண்டாவது தலைப்பகுதியின் உயரமும் ஐந்து முழம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல்லை “மகுடங்கள்” என்றும் மொழிபெயர்க்கலாம்; இங்கே அது தூணின் உச்சியிலுள்ள அலங்காரப் பகுதியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹתָרֹת / הַכֹּתֶרֶת
  choice: அலங்காரத் தலைப்பகுதிகள் / அலங்காரத் தலைப்பகுதி
  rationale: தூண்களின் உச்சியில் பொருத்தப்படும் அலங்கார அமைப்பைச் சூழல் குறிக்கிறது. கட்டடக்கலைச் சிறப்புச் சொல்லைவிட, சாதாரண வாசகருக்குத் தெளிவான இச்சொற்றொடர் பொருளை இயல்பாகத் தெரிவிக்கிறது; ‘மகுடங்கள்’ என்ற நேரடி மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: עָשָׂה
  choice: செய்தான்
  rationale: எபிரெயப் பொதுவினையின் நேரடியான, இயல்பான தமிழ் இணை; தேவையற்ற கலைநயப் பொருளைச் சேர்ப்பதில்லை.
- source_word: לָתֵת
  choice: வைப்பதற்காக
  rationale: 'இந்த இறந்தவினையெச்ச வடிவம் நோக்கத்தைச் சுட்டுகிறது: தலைப்பகுதிகள் தூண்களின் உச்சியில் வைக்கப்படுவதற்காகச் செய்யப்பட்டன.'
- source_word: רָאשֵׁי הָעַמּוּדִים
  choice: தூண்களின் உச்சியில்
  rationale: ‘தூண்களின் தலைகள்’ என்ற சொற்சொல் மொழிபெயர்ப்பைவிட, கட்டடச் சூழலில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: מֻצַק נְחֹשֶׁת
  choice: வார்ப்பு வெண்கலத்தால்
  rationale: வெண்கலம் என்ற பொருளையும் அதை வார்த்து உருவாக்கிய செய்முறையையும் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: חָמֵשׁ אַמּוֹת
  choice: ஐந்து முழம்
  rationale: மூலத்தில் உள்ள பண்டைய அளவலகை நவீன அளவாக மாற்றாமல், தமிழில் வழக்கமான வேதாகம அளவுச் சொல்லால் தருகிறது.
- source_word: קוֹמַת
  choice: உயரம்
  rationale: கட்டட அமைப்பின் செங்குத்து அளவைக் குறிக்கும் இயல்பான, துல்லியமான தமிழ் சொல்.
- source_word: הָאֶחָת
  choice: ஒரு
  rationale: மூலம் ‘முதலாவது’ என்று சொல்லாமல் இணையில் ஒன்றைக் குறிக்கிறது; அதைத் தமிழ் இயல்புடன் பாதுகாக்கிறது.
- source_word: הַשֵּׁנִית
  choice: இரண்டாவது
  rationale: இணையின் இரண்டாவது பகுதியை எபிரெயம் வெளிப்படையாகக் குறிப்பிடுவதால் அதையே துல்லியமாக வழங்குகிறது.
