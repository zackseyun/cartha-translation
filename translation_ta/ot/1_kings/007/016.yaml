  register: நவீனத் தரத் தமிழில், சாதாரண வாசகருக்குப் புரியும் கண்ணியமான கட்டடவியல் விளக்க நடையைப் பயன்படுத்துகிறது. இரு தலைப்பகுதிகளின் அளவும் ஒன்றே என்பதை இயல்பாகக் காட்ட இரண்டாவது வாக்கியத்தில் ‘உயரமும்’ பயன்படுத்தப்பட்டுள்ளது.
