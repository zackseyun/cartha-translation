translation:
  language: ta
  text: ஒரு தாங்கியின் நான்கு மூலைகளிலும் நான்கு தாங்கு உறுப்புகள் இருந்தன; அதன் தாங்கு உறுப்புகள் தாங்கியின் ஒரு பகுதியாகவே இருந்தன.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְתֵפוֹת / כְתֵפֶיהָ
  choice: தாங்குறுப்புகள்
  rationale: இங்கு ‘தோள்கள்’ என்ற சொல்லின் கட்டட/உலோக அமைப்புசார் பொருள் நோக்கப்படுகிறது; சாதாரண வாசகருக்குப் புரியும்படி, தாங்கியின் மூலைகளில் சுமையைத் தாங்கும் உறுப்புகள் என மொழிபெயர்க்கப்பட்டது.
- source_word: מְכוֹנָה
  choice: தாங்கி
  rationale: முந்தைய சூழலில் வெண்கலத் தொட்டியைத் தாங்கும் நகர்த்தக்கூடிய அடித்தள அமைப்பைக் குறிக்கிறது; ‘தாங்கி’ சுருக்கமாகவும் இயல்பாகவும் அதன் செயல்பாட்டைத் தெரிவிக்கிறது.
- source_word: הָאֶחָת
  choice: அந்த ஒரே
  rationale: எபிரெய உரையின் ஒருமை வடிவத்தைப் பாதுகாக்கிறது; ‘ஒவ்வொரு’ என்று பொதுமைப்படுத்தாமல், குறிப்பிட்ட ஒரு தாங்கியைச் சுட்டுகிறது.
- source_word: מִן הַמְּכֹנָה
  choice: தாங்கியோடு ஒரே அமைப்பாக
  rationale: מִן இங்கு பொருளின் மூலத்தையோ அதனுடனான ஒருங்கிணைப்பையோ குறிக்கிறது; தாங்குறுப்புகள் தனியாக இணைக்கப்பட்டவை அல்ல, தாங்கியின் உட்பகுதியாக உருவாக்கப்பட்டவை என்ற கருத்தை இயல்பான தமிழில் தருகிறது.
