  yaml_path: translation/ot/1_kings/007/046.yaml
  text: In the plain of the Jordan the king cast them[c][b][a], in the clay ground between Sukkoth and Zarethan.
translation:
  language: ta
  text: யோர்தான் சமவெளியில்[a], சுக்கோத்துக்கும் சாரெத்தானுக்கும் இடையிலிருந்த களிமண் நிலத்தில்[c], அரசன் அவற்றை வார்த்தான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘யோர்தான் பள்ளத்தாக்கில்.’ எபிரெயச் சொற்றொடர் சொல்லர்த்தமாக யோர்தானின் நிலப்பகுதியையோ சமவெளியையோ குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘ஊற்றினான்’; இங்குள்ள வினைச்சொல் உலோகப் பொருட்களை வார்ப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: சொல்லர்த்தமாக, ‘நிலத்தின் அடர்த்தியில்’; வார்ப்புச் செய்வதற்கு ஏற்ற அடர்ந்த களிமண் மண்ணைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכִכַּר הַיַּרְדֵּן
  choice: யோர்தான் சமவெளியில்
  rationale: புவியியல் சூழலில் כִּכָּר என்பது யோர்தானைச் சார்ந்த பரந்த சமவெளிப் பகுதியைக் குறிக்கிறது. ‘சமவெளி’ என்பது இயல்பான தமிழாகவும் எபிரெயச் சொல்லின் உருவகத்தை மிகைப்படுத்தாமலும் உள்ளது.
- source_word: יְצָקָם
  choice: அவற்றை வார்த்தான்
  rationale: יצק என்பது உலோகத்தை உருக்கி ஊற்றி வடிவமைப்பதைக் குறிக்கலாம். முந்தைய சூழலில் கூறப்பட்ட வெண்கலப் பொருட்களைச் சுட்டும் பன்மை விகுதி ‘அவற்றை’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: הַמֶּלֶךְ
  choice: அரசன்
  rationale: மூலத்தில் தனிப்பெயர் இல்லாமல் பொதுப்பெயரே உள்ளது; ஆகவே ‘சாலொமோன்’ என்று வெளிப்படையாகச் சேர்க்காமல் ‘அரசன்’ எனப் பாதுகாக்கப்பட்டுள்ளது.
- source_word: בְּמַעֲבֵה הָאֲדָמָה
  choice: களிமண் நிலத்தில்
  rationale: מַעֲבֶה என்பதன் அடிப்படைப் பொருள் தடிமன் அல்லது அடர்த்தி. இச்சூழலில் வார்ப்புக்கு ஏற்ற அடர்ந்த களிமண் நிலம் குறிக்கப்படுவதாகத் தெரிகிறது; அதனை இயல்பான தமிழில் ‘களிமண் நிலம்’ என வழங்குகிறது.
- source_word: בֵּין סֻכּוֹת וּבֵין צָרְתָן
  choice: சுக்கோத்துக்கும் சாரெத்தானுக்கும் இடையில்
  rationale: இரு இடப்பெயர்களும் எபிரெய ஒலிப்பை நெருக்கமாகப் பின்பற்றி தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளன.
