  text: On the panels of its supports and on its frames he engraved cherubim[a], lions, and palm trees, according to the space on each[b], with wreaths all around.
translation:
  language: ta
  text: அதன் தாங்கிகளின் பலகைகளிலும் அதன் சட்டங்களிலும் கேருபீன்கள், சிங்கங்கள், பனைமரங்கள் ஆகிய உருவங்களையும், ஒவ்வொன்றுக்கும் கிடைத்த இடத்திற்கேற்ப[a], சுற்றிலும் மாலை வடிவ அலங்காரங்களையும்[b] அவன் செதுக்கினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒவ்வொரு உருவத்துக்கும் இடமிருந்த இடங்களில்.” எபிரெயச் சொற்றொடரின் பொருள் கடினமானது; கிடைத்த இடவசதிக்கு ஏற்ப செதுக்கல்கள் அமைக்கப்பட்டதை இது குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “மாலை வடிவ அலங்காரங்கள்” என்பதற்கு “தோரணங்கள்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் சுற்றிலும் அமைந்திருந்த மாலை அல்லது தோரணம்போன்ற அலங்காரங்களைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְפַתַּח
  choice: செதுக்கினான்
  rationale: அலங்கார உருவங்களை ஒரு மேற்பரப்பில் பதிக்கும் கைவினைச் சூழலில், ‘செதுக்கினான்’ என்பது வினையின் பொருளை இயல்பாகத் தெரிவிக்கிறது.
- source_word: הַלֻּחֹת
  choice: பலகைகள்
  rationale: இங்கு எழுதும் பலகைகள் அல்ல, தாங்கியின் அமைப்பிலுள்ள அலங்காரத் தளங்களைக் குறிக்கிறது.
- source_word: יְדֹתֶיהָ
  choice: அதன் தாங்கிகள்
  rationale: சொல்லடியாக ‘அதன் கைகள்’ என்றாலும், இக்கட்டுமானச் சூழலில் நீளும் துணைப்பகுதிகள் அல்லது தாங்கும் உறுப்புகளைக் குறிக்கிறது.
- source_word: מַסְגְּרֹתֶיהָ
  choice: அதன் சட்டங்கள்
  rationale: பலகைகளைச் சூழ்ந்து அல்லது பிரித்து அமைந்த கட்டமைப்புச் சட்டங்களைக் குறிக்க இயல்பான தமிழ்ச் சொல்.
- source_word: כְּרוּבִים
  choice: கேருபீன்கள்
  rationale: ஆலய அலங்காரத்தில் வரும் சிறகுடைய காவல் உயிரினங்களுக்கான மரபான வேதாகமப் பெயரைப் பேணுகிறது.
- source_word: אֲרָיוֹת
  choice: சிங்கங்கள்
  rationale: செதுக்கப்பட்ட உருவங்களின் பட்டியலில் வரும் நேரடியான விலங்குப் பெயர்.
- source_word: תִמֹרֹת
  choice: பனைமரங்கள்
  rationale: ஆலய அலங்காரச் சூழலில் பனைமர வடிவங்களைத் தெளிவாகக் குறிக்கிறது.
- source_word: כְּמַעַר אִישׁ
  choice: ஒவ்வொன்றுக்கும் கிடைத்த இடத்திற்கேற்ப
  rationale: கடினமான எபிரெய சொற்றொடர், ஒவ்வொரு உருவத்துக்கும் இருந்த இடவசதிக்கு ஏற்ப அவை அமைக்கப்பட்டதைச் சுட்டுவதாகத் தோன்றுகிறது; மொழிபெயர்ப்பு அந்தச் சாத்தியத்தைத் தெளிவாகவும் அளவுக்கு மீறாமல் விளக்குகிறது.
- source_word: לֹיֹת
  choice: மாலை வடிவ அலங்காரங்கள்
  rationale: சுற்றி அமைக்கப்பட்ட அலங்காரத் தோரணங்கள், மாலைகள் அல்லது கொடிப்பிணைப்புகள் போன்ற வடிவங்களைக் குறிக்கும் அரிய சொல்லின் அலங்காரப் பொருளை இயல்பாகத் தருகிறது.
- source_word: סָבִיב
  choice: சுற்றிலும்
  rationale: அலங்காரங்கள் உருவங்களைச் சூழ அமைந்திருந்ததைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
