translation_notes:
  register: நவீனத் தரத் தமிழில், கைவினை மற்றும் கட்டுமானச் சொற்கள் சாதாரண வாசகர்களுக்குப் புரியும் வகையில் வழங்கப்பட்டுள்ளன. கடினமான எபிரெயச் சொற்றொடரின் நிச்சயமின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது; அரிய அலங்காரச் சொல்லுக்கு விளக்கத் தன்மையுள்ள தமிழ் பயன்படுத்தப்பட்டுள்ளது.
