base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/038.yaml
  text: He made ten bronze basins[a]. Each basin held forty baths, and each basin was four cubits across[c][b]. One basin stood on each of the ten stands.
translation:
  language: ta
  text: அவர் வெண்கலத் தொட்டிகள்[a] பத்தைச் செய்தார். ஒவ்வொரு தொட்டியும் நாற்பது பாத்[b] கொள்ளளவு கொண்டது; ஒவ்வொரு தொட்டியும் குறுக்கே நான்கு முழம்[c] இருந்தது. பத்துத் தாங்கிகளிலும் ஒவ்வொன்றின் மேல் ஒரு தொட்டி இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கழுவுதொட்டிகள்.’
    reason: lexical_alternative
  - marker: b
    text: ‘பாத்’ என்பது எபிரெய திரவ அளவை அலகு.
    reason: cultural_note
  - marker: c
    text: அல்லது, ‘நான்கு முழம்.’ எபிரெயத்தில் இங்கு ‘குறுக்கே’ அல்லது ‘விட்டம்’ என்பதற்கான சொல் இல்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִיֹּרוֹת
  choice: தொட்டிகள்
  rationale: ஆலயப் பயன்பாட்டுக்குரிய பெரிய நீர்க் கொள்கலன்களைக் குறிக்கிறது. ‘தொட்டிகள்’ என்பது நவீன தமிழில் தெளிவானதும் இயல்பானதும் ஆகும்; கழுவும் பயன்பாட்டைச் சூழல் விளக்குகிறது.
- source_word: נְחֹשֶׁת
  choice: வெண்கலம்
  rationale: ஆலயப் பொருட்களின் சூழலில் உலோகம் அல்லது கலப்புலோகத்தைக் குறிக்கும் மரபானதும் பொருத்தமானதும் ஆன தமிழ்ச் சொல்.
- source_word: בַּת
  choice: பாத்
  rationale: இது எபிரெய திரவ அளவை அலகு. துல்லியமற்ற நவீன மாற்றுக் கணக்கைத் தவிர்க்க, மூல அலகு ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: יָכִיל
  choice: கொள்ளளவு கொண்டது
  rationale: வினைச்சொல் ஒரு பாத்திரத்தின் கொள்ளளவைக் குறிக்கிறது; தமிழில் இச்சொற்றொடர் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: אַרְבַּע בָּאַמָּה
  choice: குறுக்கே நான்கு முழம்
  rationale: எபிரெயம் நேரடியாக ‘நான்கு முழம்’ என்று மட்டுமே கூறுகிறது. வட்டத் தொட்டியின் ஒரு பக்கத்திலிருந்து மறுபக்கம் வரையிலான அளவே உத்தேசிக்கப்பட்டிருக்கலாம்; ‘குறுக்கே’ என்பது ‘விட்டம்’ எனத் தொழில்நுட்பமாக மிகைத் துல்லியம் அளிக்காமல் வாசிப்பை இயல்பாக்குகிறது.
- source_word: מְכוֹנָה
  choice: தாங்கிகள்
  rationale: சுற்றியுள்ள வசனங்களில் விவரிக்கப்படும் தொட்டிகளைத் தாங்கும் அமைப்புகளைக் குறிக்கிறது. ‘தாங்கிகள்’ அவற்றின் செயல்பாட்டைத் தெளிவாகக் கூறுகிறது; இவ்வசனத்தில் தேவையற்ற விவரத்தைச் சேர்ப்பதில்லை.
- source_word: כִּיּוֹר אֶחָד עַל הַמְּכוֹנָה הָאַחַת לְעֶשֶׂר הַמְּכֹנוֹת
  choice: பத்துத் தாங்கிகளிலும் ஒவ்வொன்றின்மேல் ஒரு தொட்டி இருந்தது
  rationale: எபிரெயப் பகிர்வுக் கட்டமைப்பு, பத்துத் தாங்கிகளில் ஒவ்வொன்றுக்கும் ஒரு தொட்டி இருந்ததைத் தெரிவிக்கிறது. தமிழில் அந்தப் பொருள் இயல்பாகவும் வெளிப்படையாகவும் தரப்பட்டுள்ளது.
