  text: And the one stand had four bronze wheels and bronze axles[a], and its four corners had supports for them; beneath the basin the supports were cast[c][b], each beside wreathwork.
translation:
  language: ta
  text: ஒவ்வொரு தாங்கிக்கும் நான்கு வெண்கலச் சக்கரங்களும் வெண்கல அச்சுகளும் இருந்தன. அதன் நான்கு அடிப்பகுதிகளுக்கும் தாங்கும் நீட்சிகள் இருந்தன. தொட்டிக்குக் கீழே, அந்தத் தாங்கும் நீட்சிகள் ஒவ்வொன்றும் மாலை அலங்காரத்தின் அருகில் வார்க்கப்பட்டிருந்தன.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மாலை அலங்காரம்” என்று மொழிபெயர்க்கப்பட்டுள்ள எபிரெயச் சொல் அரிதானது; அது அலங்கார மாலைகள் அல்லது தொங்கல் மாலை வடிவங்களைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹפַנֵּי נְחֹשֶׁת
  choice: வெண்கலச் சக்கரங்கள்
  rationale: אוֹפַנִּים என்பது சக்கரங்களைக் குறிக்கிறது; ஆலய உலோகவேலைச் சூழலில் נְחֹשֶׁת என்பதற்கு ‘வெண்கலம்’ இயல்பான பொருத்தம்.
- source_word: לַמְּכוֹנָה הָאַחַת
  choice: ஒவ்வொரு தாங்கிக்கும்
  rationale: எபிரெய வடிவம் தனித்தனியான ஒவ்வொரு தாங்கியையும் விவரிக்கிறது; தமிழில் ‘ஒவ்வொரு தாங்கிக்கும்’ என்பது அந்தப் பகிர்வுப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: סַרְנֵי נְחֹשֶׁת
  choice: வெண்கல அச்சுகள்
  rationale: சக்கரங்கள் குறித்த இயந்திரவியல் சூழலில் סַרְנִים என்பது சக்கர அச்சுகளைக் குறிப்பதாகப் புரிந்துகொள்வது சிறந்தது.
- source_word: פַעֲמֹתָיו
  choice: அதன் நான்கு மூலைகளிலும்
  rationale: சொல் பாதங்கள் அல்லது அடிப்பகுதிகளைச் சுட்டக்கூடும்; இங்கு தாங்கியின் நான்கு கட்டமைப்பு இடங்களைச் சுட்டுவதால் ‘மூலைகள்’ வாசகருக்குத் தெளிவாக உள்ளது.
- source_word: כְּתֵפֹת
  choice: தாங்குபகுதிகள்
  rationale: நேர்ப்பொருள் ‘தோள்கள்’; பொருளமைப்புச் சூழலில் தொட்டியைத் தாங்கும் நீட்சிப் பகுதிகள் என்பதே நோக்கம்.
- source_word: מִתַּחַת לַכִּיֹּר
  choice: தொட்டிக்குக் கீழே
  rationale: כִּיּוֹר என்பது நீர் வைக்கும் பெரிய பாத்திரம் அல்லது தொட்டி; இடவுறவைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: יְצֻקוֹת
  choice: வார்க்கப்பட்டிருந்தன
  rationale: உலோகத்தை உருக்கி அச்சில் வார்த்துச் செய்ததை குறிக்கும் வழக்கமான தமிழ் தொழில்நுட்பச் சொல்.
- source_word: מֵעֵבֶר אִישׁ
  choice: ஒவ்வொன்றின் பக்கத்திலும்
  rationale: பகிர்வான அமைவிடத்தை வெளிப்படுத்துகிறது; துல்லியமான வடிவவியலை தேவையின்றி நிர்ணயிக்கவில்லை.
- source_word: לֹיוֹת
  choice: மாலைவேலைப்பாடு
  rationale: அரிதான இச்சொல் அலங்கார மாலைகள் அல்லது தொங்கல் மாலை வடிவ வேலைப்பாட்டைக் குறிக்கலாம்; அதன் உறுதியின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
