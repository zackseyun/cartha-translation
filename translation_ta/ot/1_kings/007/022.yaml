  text: And on the top of the pillars was lily-work[b][a], and the work of the pillars was finished.
translation:
  language: ta
  text: தூண்களின் உச்சியில் அல்லிப்பூ வடிவ வேலைப்பாடு[a] இருந்தது. தூண்களின் வேலை முடிவடைந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அல்லிப்பூ போன்ற அலங்கார வேலைப்பாடு”; எபிரெயச் சொல் அல்லி அல்லது தாமரை போன்ற மலரைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאשׁ
  choice: உச்சி
  rationale: கட்டடக்கலைச் சூழலில் தூண்களின் மேல்பகுதியைக் குறிக்கிறது; தொழில்நுட்பச் சொல்லைத் தேவையின்றி புகுத்தாமல் இயல்பாக உள்ளது.
- source_word: הָעַמּוּדִים
  choice: தூண்கள்
  rationale: ஆலயக் கட்டுமானச் சூழலில் עַמּוּדִים என்பதற்கான இயல்பான நவீனத் தமிழ் சொல்.
- source_word: מַעֲשֵׂה שׁוֹשָׁן
  choice: அல்லிப்பூ வடிவ வேலைப்பாடு
  rationale: מַעֲשֵׂה என்பது செய்யப்பட்ட வேலை அல்லது வேலைப்பாட்டையும், שׁוֹשָׁן என்பது அல்லி போன்ற மலரையும் குறிக்கிறது; இங்கு அலங்கார வடிவம் என்பதைக் கருத்துத் தெளிவுடன் தருகிறது.
- source_word: וַתִּתֹּם
  choice: முடிவடைந்தது
  rationale: תמם வேரின் நிறைவு என்ற பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: מְלֶאכֶת הָעַמּוּדִים
  choice: தூண்களின் வேலை
  rationale: தூண்களின் உருவாக்கமும் அலங்காரமும் அடங்கக்கூடிய மூலமொழியின் விரிந்த பொருளைத் தக்கவைக்கிறது.
