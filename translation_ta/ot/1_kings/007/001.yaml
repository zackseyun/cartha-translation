  text: சாலொமோன் தனது அரண்மனையை[a] பதின்மூன்று ஆண்டுகள் கட்டினான்; தன் அரண்மனை முழுவதையும் கட்டி முடித்தான்.
  philosophy: optimal-equivalence
  footnotes:
