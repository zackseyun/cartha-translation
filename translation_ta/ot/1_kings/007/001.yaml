    text: எபிரெயச் சொல் நேரடியாக ‘வீடு’ என்று பொருள்படும்; இச்சூழலில் அது அரசரின் குடியிருப்பையோ அரண்மனை வளாகத்தையோ குறிக்கலாம்.
