lexical_decisions:
- source_word: בֵּיתוֹ
  choice: தனது சொந்த அரண்மனையை
  rationale: בַּיִת என்பதன் அடிப்படைப் பொருள் ‘வீடு’; ஆனால் அரசனைப் பற்றிய இச்சூழலில் அது அரச குடியிருப்பையோ அரண்மனை வளாகத்தையோ குறிக்கிறது. இயல்பான நவீனத் தமிழில் ‘அரண்மனை’ சூழற்பொருளைத் தெளிவாகக் கொடுக்கிறது; ‘சொந்த’ என்பது ஆலயக் கட்டுமானத்துடன் உள்ள வேறுபாட்டை வெளிப்படுத்துகிறது.
- source_word: בָּנָה
  choice: கட்டி
  rationale: Qal perfect இங்கு கடந்தகாலக் கட்டுமானச் செயலைக் குறிக்கிறது; அடுத்துள்ள முடித்தலைக் கூறும் வினையுடன் இயல்பாக இணைய வினையெச்ச வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: שְׁלֹשׁ עֶשְׂרֵה שָׁנָה
  choice: பதின்மூன்று ஆண்டுகளாக
  rationale: கட்டுமானப் பணியின் காலநீளத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וַיְכַל
  choice: கட்டி முடித்தான்
  rationale: כלה என்னும் வேரிலிருந்து வந்த இவ்வினை, பணி நிறைவடைந்ததைச் சொல்லி நிகழ்வை முன்னெடுக்கிறது. தமிழில் கட்டுமானச் சூழலுக்கு ‘கட்டி முடித்தான்’ இயல்பானது.
- source_word: כָּל בֵּיתוֹ
  choice: அரண்மனை முழுவதையும்
  rationale: כָּל முழுமையைக் குறிக்கிறது. இங்கு குடித்தனத்தாரை அல்ல, அரச குடியிருப்பு அல்லது அரண்மனை வளாகம் முழுவதையும் குறிக்கிறது.
- source_word: וְאֶת
  choice: சாலொமோன் தனது சொந்த…
  rationale: இணைப்புச் சொல் மற்றும் நேரடி செயப்படுபொருள் குறியீடு, ஆலய விவரத்திலிருந்து தொடர்புடைய புதிய பொருளுக்கு மாறும் வேறுபாட்டைக் காட்டுகின்றன; தமிழில் சொல்வரிசையும் ‘சொந்த’ என்பதும் அதை வெளிப்படுத்துகின்றன.
