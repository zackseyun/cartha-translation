  yaml_path: translation/ot/1_kings/007/009.yaml
  text: All these were costly stones[a], cut according to measure, sawed with a saw on the inside and on the outside, from the foundation to the coping[b], and on the outside as far as the great court.
translation:
  language: ta
  text: இவை அனைத்தும் விலையுயர்ந்த கற்களாக இருந்தன[a]; அவை அளவுக்கேற்ப வெட்டப்பட்டு, உட்புறத்திலும் வெளிப்புறத்திலும் ரம்பத்தால் அறுக்கப்பட்டவை; அடித்தளத்திலிருந்து மேல்புற முடிப்புவரையும்[b], வெளியே பெரிய முற்றம்வரையும் இருந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘விலைமதிப்புள்ள கற்கள்’ என்றும் மொழிபெயர்க்கலாம். இங்கு இரத்தினக் கற்கள் அல்ல, விலையுயர்ந்த உயர்தரக் கட்டுமானக் கற்களே பெரும்பாலும் குறிக்கப்படுகின்றன.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயச் சொல்லின் துல்லியமான கட்டிடக்கலைப் பொருள் உறுதியில்லை. அது சுவரின் மேல் முடிப்பு அல்லது உச்சிக் கல் வரிசையைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבָנִים יְקָרֹת
  choice: விலையுயர்ந்த கற்கள்
  rationale: יְקָרֹת என்பதற்கு விலைமிக்க அல்லது அருமையான என்று பொருள் கொள்ளலாம். இங்கு இரத்தினக் கற்கள் அல்ல, உயர்தரமும் அதிக விலையும் கொண்ட கட்டுமானக் கற்களே குறிக்கப்படுவதால் ‘விலையுயர்ந்த கற்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: כְּמִדֹּת גָּזִית
  choice: அளவுப்படி வெட்டப்பட்டு
  rationale: מִדּוֹת அளவுகளையும் גָּזִית வெட்டிச் செப்பனிடப்பட்ட கல்லையும் குறிக்கிறது. துல்லியமான அளவுகளுக்கு ஏற்ப கற்கள் வடிவமைக்கப்பட்டதை இயல்பான தமிழில் இச்சொற்றொடர் தெரிவிக்கிறது.
- source_word: מְגֹרָרוֹת בַּמְּגֵרָה
  choice: ரம்பத்தால் அறுக்கப்பட்டிருந்தன
  rationale: வினைச்சொல்லும் கருவிப் பெயரும் இணைந்து கற்கள் ரம்பத்தால் அறுக்கப்பட்டதை வெளிப்படையாகக் கூறுகின்றன. தமிழில் தேவையற்ற சொல் மடக்கைத் தவிர்த்து, அந்தக் கருவிசார் விவரம் காக்கப்பட்டுள்ளது.
- source_word: מִבַּיִת וּמִחוּץ
  choice: உட்புறத்திலும் வெளிப்புறத்திலும்
  rationale: எபிரெயச் சொற்கள் நேரடியாக உள்ளேயும் வெளியேயும் என்பதைக் குறிக்கின்றன. கட்டிடத்தின் இரு புறங்களிலும் கற்கள் செப்பனிடப்பட்டதை இந்த மொழியாக்கம் இயல்பாகக் காட்டுகிறது.
- source_word: מִמַּסָּד
  choice: அடித்தளத்திலிருந்து
  rationale: מַסָּד கட்டிடத்தின் அஸ்திவாரம் அல்லது அடிப்பகுதியைக் குறிக்கிறது. பொதுவாகப் புரியும் நவீன தமிழ்ச் சொல்லாக ‘அடித்தளம்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: עַד הַטְּפָחוֹת
  choice: மேல் விளிம்புவரையிலும்
  rationale: הַטְּפָחוֹת என்பதன் துல்லியமான கட்டிடக்கலைப் பொருள் உறுதியற்றது; கட்டிடத்தின் மேல்புற முடிப்பு அல்லது உச்சிக் கல் வரிசையை இது குறிக்கக்கூடும். மிகையாகக் குறிப்பாக்காமல் ‘மேல் விளிம்பு’ என வழங்கி, ஐயம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: וּמִחוּץ עַד הֶחָצֵר הַגְּדוֹלָה
  choice: வெளியே பெரிய முற்றம்வரையிலும்
  rationale: கட்டுமான விவரம் வெளிப்புறமாகப் பெரிய முற்றம் வரை நீள்வதை எபிரெய உரை கூறுகிறது. חָצֵר הַגְּדוֹלָה என்பதற்கு ‘பெரிய முற்றம்’ என்பது தெளிவான, இயல்பான கட்டிடக்கலைச் சொற்றொடர்.
