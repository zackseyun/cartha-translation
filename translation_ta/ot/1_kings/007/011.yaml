    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִלְמַעְלָה
  choice: அதற்கு மேலே
  rationale: கட்டடத்தின் முந்தைய அடுக்குகளைத் தொடர்ந்து, அவற்றுக்கு மேலிருந்த பொருட்களைச் சுட்டும் இயல்பான தமிழாக்கம்.
- source_word: אֲבָנִים יְקָרוֹת
  choice: விலையுயர்ந்த கற்கள்
  rationale: יְקָרוֹת என்பது இங்கு இரத்தினக் கற்களை அல்ல, உயர்ந்த மதிப்பும் தரமும் கொண்ட கட்டுமானக் கற்களைக் குறிக்கிறது.
- source_word: כְּמִדּוֹת גָּזִית
  choice: அளவுப்படி செதுக்கப்பட்ட
  rationale: சொற்றொடர் எழுத்துப்படி ‘செதுக்கப்பட்ட கல்லின் அளவுகளின்படி’ என அமையலாம்; கட்டுமானச் சூழலில் குறிப்பிட்ட அளவுகளுக்கேற்ப கற்கள் செதுக்கப்பட்டதை இயல்பான தமிழில் தெரிவிக்கிறது. மூலத்தின் வடிவியல் மாற்று அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- source_word: וָאָרֶז
  choice: கேதுரு மரமும்
  rationale: אֶרֶז என்பது கேதுருவைக் குறிக்கிறது; தமிழில் கட்டுமானப் பொருள் என்பது தெளிவாக இருக்க ‘மரம்’ சேர்க்கப்பட்டுள்ளது. வாவ் இணைப்பை ‘-உம்’ தக்கவைக்கிறது.
