base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/040.yaml
  text: And Hiram made the basins[a], the shovels, and the bowls. So Hiram finished doing all the work that he did for King Solomon for the house of Yahweh.
translation:
  language: ta
  text: 'ஈராம் கழுவும் தொட்டிகளையும், சாம்பல் அள்ளும் மண்வாரிகளையும், கிண்ணங்களையும்[a] செய்தான். இவ்வாறு, யாவேவின் ஆலயத்துக்கான எல்லாப் பணிகளையும் சாலொமோன் அரசனுக்காக ஈராம் செய்து முடித்தான்.


    [a] அல்லது, “தெளிப்புக் கிண்ணங்கள்”; பலியிடும் சடங்குகளில் திரவங்களைப் பெறுவதற்கோ தெளிப்பதற்கோ பயன்படுத்தப்பட்ட பாத்திரங்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தெளிப்புக் கிண்ணங்கள்”; பலியிடும் சடங்குகளில் திரவங்களைப் பெறுவதற்கோ தெளிப்பதற்கோ பயன்படுத்தப்பட்ட பாத்திரங்கள்.
    reason: מִּזְרָקוֹת என்ற சொல்லின் சடங்கு சார்ந்த குறிப்பான பொருளை, முதன்மை உரையைச் சுமையாக்காமல் பாதுகாக்கிறது.
lexical_decisions:
- source_word: כִּיֹּרוֹת
  choice: கழுவும் தொட்டிகள்
  rationale: ஆலயப் பணியில் கழுவுவதற்குப் பயன்படுத்தப்பட்ட பெரிய நீர்ப்பாத்திரங்களை இச்சொல் குறிக்கிறது; நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் இருக்க ‘கழுவும் தொட்டிகள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: יָּעִים
  choice: சாம்பல் அள்ளும் கரண்டிகள்
  rationale: பலிபீடத்திலிருந்து சாம்பல் அல்லது தணலை அகற்றும் கருவிகள் என்பதைக் குறிப்பாகவும் சாதாரண வாசகருக்குப் புரியுமாறும் தெரிவிக்கிறது.
- source_word: מִּזְרָקוֹת
  choice: கிண்ணங்கள்
  rationale: பலியின் இரத்தம் அல்லது பிற திரவங்களைப் பெறவும் தெளிக்கவும் பயன்படுத்தப்பட்ட பாத்திரங்களைக் குறிக்கும் பரந்த, வாசிக்க எளிய சொல்; சடங்கு சார்ந்த குறிப்பான பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- source_word: וַיְכַל
  choice: செய்து முடித்தான்
  rationale: ஒப்படைக்கப்பட்ட வேலை முழுமை பெற்றதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: כָּל הַמְּלָאכָה
  choice: எல்லா வேலைகளையும்
  rationale: கலைத்திறனை மட்டும் குறுக்காமல், மொத்தப் பணியையும் குறிக்கும் எபிரெயச் சொல்லின் பரந்த பொருளைப் பாதுகாக்கிறது.
- source_word: בֵּית יְהוָה
  choice: யாவேவின் ஆலயம்
  rationale: ‘யாவேவின் வீடு’ என்பதே சொற்சொல் வடிவம் என்றாலும், இங்கு குறிக்கப்படுவது ஆலயம் என்பதால் நவீனத் தமிழில் தெளிவாக ‘ஆலயம்’ பயன்படுத்தப்பட்டது; இறைப்பெயர் பெயராகவே ஒலிபெயர்க்கப்பட்டது.
- source_word: חִירוֹם / חִירָם
  choice: ஈராம்
  rationale: ஒரே நபரின் எபிரெய எழுத்துவடிவ வேறுபாடுகள் தமிழில் வழக்கமான ஒரே பெயர்வடிவமாக வழங்கப்பட்டன.
- source_word: עָשָׂה ... לַמֶּלֶךְ שְׁלֹמֹה
  choice: சாலொமோன் அரசனுக்குச் செய்த
  rationale: வேலை அரசனுக்காகச் செய்யப்பட்டதைக் காட்டுகிறது; எபிரெய வினையின் ‘செய்/உருவாக்கு’ என்ற பரந்த பொருளையும் காக்கிறது.
theological_decisions:
- issue: இறைப்பெயர் יְהוָה-வை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் நான்கெழுத்து இறைப்பெயர் நேரடியாக இருப்பதால், பொதுப்பட்டமான ‘ஆண்டவர்’ என்பதற்குப் பதிலாக உடன்படிக்கைப் பெயரைத் தமிழில் ஒலிபெயர்த்து வழங்குகிறது.
- issue: בֵּית יְהוָה என்பதிலுள்ள ‘வீடு’ உருவகத்தை வழங்குதல்
  choice: யாவேவின் ஆலயம்
  alternative: யாவேவின் வீடு
  rationale: இங்கு சாலொமோன் கட்டிய ஆலயமே தெளிவான குறிப்பு. ‘ஆலயம்’ சாதாரண வாசகருக்கு உடனடியாகப் புரியும்; இருப்பினும் உரையின் உரிமைத் தொடர்பும் புனிதப் பொருளும் காக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் வகையிலும் ஆலயச் சூழலுக்கேற்ற கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. பட்டியலின் இணை அமைப்பும், வேலை ஆலயத்துக்காகச் செய்யப்பட்டது என்ற எபிரெய நோக்குறவும் பாதுகாக்கப்பட்டுள்ளன.
