- from: சட்டிகளையும், சாம்பல் அள்ளும் கருவிகளையும், கிண்ணங்களையும்—யெகோவாவின் ஆலயத்திற்காக சாலொமோன் அரசருக்கு ஈராம் செய்த இந்தப் பாத்திரங்கள் அனைத்தையும்—செய்தான். அவை மெருகூட்டப்பட்ட வெண்கலத்தால் ஆனவை.[a]
  to: சட்டிகள், சாம்பல் அள்ளும் கருவிகள், கிண்ணங்கள், மேலும் ஈராம் சாலொமோன் அரசருக்காக யாவேயின் ஆலயத்திற்காகச் செய்த இந்தப் பாத்திரங்கள் அனைத்தும் மெருகூட்டப்பட்ட வெண்கலத்தால் செய்யப்பட்டவை.[a]
