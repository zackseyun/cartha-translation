  text: and the pots[a], the shovels, the basins[c][b], and all these vessels that Hiram made for King Solomon for the house of Yahweh were of burnished bronze.
translation:
  language: ta
  text: சட்டிகள், சாம்பல் அள்ளும் கருவிகள், கிண்ணங்கள், மேலும் ஈராம் சாலொமோன் அரசருக்காக யாவேயின் ஆலயத்திற்காகச் செய்த இந்தப் பாத்திரங்கள் அனைத்தும் மெருகூட்டப்பட்ட வெண்கலத்தால் செய்யப்பட்டவை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மெருகூட்டப்பட்ட’ என்பதற்கு ‘பளபளப்பாக்கப்பட்ட’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסִּירוֹת
  choice: சட்டிகள்
  rationale: சִירוֹת என்பது பொதுவாகச் சட்டிகள் அல்லது பெரிய பாத்திரங்களைக் குறிக்கிறது. பயன்பாட்டைத் தேவையின்றி மிகத் துல்லியமாக்காமல், ஆலயப் பொருள்களின் பட்டியலுக்கு இயல்பான சொல்லாக ‘சட்டிகள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: הַיָּעִים
  choice: சாம்பல் அள்ளும் கருவிகள்
  rationale: יָעִים பலிபீடத்திலிருந்து சாம்பல் போன்றவற்றை அகற்றப் பயன்படும் கருவிகளைக் குறிக்கிறது. நவீனத் தமிழில் அதன் பணியைத் தெளிவாக உணர்த்தும் வகையில் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: הַמִּזְרָקוֹת
  choice: கிண்ணங்கள்
  rationale: מִזְרָקוֹת திரவத்தை ஏந்தவோ தெளிக்கவோ பயன்படுத்தப்பட்ட பாத்திரங்கள். ‘கிண்ணங்கள்’ என்பது இயல்பானதும், மூலத்தில் நேரடியாகக் கூறப்படாத குறிப்பிட்ட பயன்பாட்டைத் திணிக்காததும் ஆகும்.
- source_word: כָּל־הַכֵּלִים הָאֵלֶּה
  choice: இந்தப் பாத்திரங்கள் அனைத்தும்
  rationale: כֵּלִים என்பது கருவிகள், பாத்திரங்கள், பொருள்கள் ஆகியவற்றைக் குறிக்கும் பரந்த சொல். இங்கு பட்டியலிடப்பட்ட உலோகப் பொருள்களுக்கு ‘பாத்திரங்கள்’ பொருத்தமாக உள்ளது; הָאֵלֶּה-ன் சுட்டுப்பொருள் ‘இந்த’ எனக் காக்கப்பட்டது.
- source_word: חִירָם
  choice: ஈராம்
  rationale: எபிரெயப் பெயரின் ஒலிப்பை நவீனத் தமிழில் தெளிவாகப் பிரதிபலிக்கிறது.
- source_word: לַמֶּלֶךְ שְׁלֹמֹה
  choice: சாலொமோன் அரசருக்கு
  rationale: לְ முன்னொட்டு இங்கு வேலை யாருக்காகச் செய்யப்பட்டது என்பதைக் காட்டுகிறது; தமிழில் இயல்பாக ‘அரசருக்கு’ என வழங்கப்பட்டது.
- source_word: בֵּית יְהוָה
  choice: யெகோவாவின் ஆலயத்திற்காக
  rationale: בַּיִת என்பதன் நேர்ப்பொருள் ‘வீடு’ என்றாலும், இச்சூழலில் அது ஆலயத்தைக் குறிக்கிறது. இலக்கு வாசகருக்குத் தெளிவாக ‘ஆலயம்’ பயன்படுத்தப்பட்டது; பொருள்கள் அங்கு பயன்படுவதற்காகச் செய்யப்பட்டவை என்பதால் ‘ஆலயத்திற்காக’ என வழங்கப்பட்டது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட பெயர்வடிவமான ‘யெகோவா’ என வழங்குகிறது.
- source_word: נְחֹשֶׁת
  choice: வெண்கலம்
  rationale: ஆலய உலோகப் பொருள்களின் இச்சூழலில் נְחֹשֶׁת என்பதற்குப் பொருத்தமான வரலாற்று மற்றும் வழக்கமான இணை ‘வெண்கலம்’ ஆகும்.
- source_word: מְמֹרָט
  choice: மெருகூட்டப்பட்ட
  rationale: இந்தச் சொல் உலோகம் தேய்த்து வழுவழுப்பாகவும் ஒளிருமாறும் செய்யப்பட்டிருப்பதைக் குறிக்கிறது; ‘மெருகூட்டப்பட்ட’ அந்தப் பொருளை இயல்பாகக் காட்டுகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: கர்த்தர் / யாவே
  rationale: மூலத்தில் ஒரு தனிப்பட்ட தெய்வீகப் பெயர் நேரடியாக உள்ளது. அதை பொதுப் பட்டமான ‘கர்த்தர்’ என்று மாற்றாமல் பெயராகவே காக்கிறது; ‘யெகோவா’ தமிழில் பரவலாக அடையாளம் காணப்படும் வடிவம்.
- issue: இறுதி נְחֹשֶׁת מְמֹרָט என்பதன் வாக்கியத் தொடர்பு
  choice: பட்டியலிலுள்ள பாத்திரங்கள் அனைத்தையும் விவரிக்கும் தனி பயனிலை வாக்கியமாக வழங்குதல்
  alternative: ‘மெருகூட்டப்பட்ட வெண்கலப் பாத்திரங்கள்’ என்று பெயரடைக் கட்டமைப்பாக இணைத்தல்
  rationale: எபிரெயத்தில் வெளிப்படையான இணைப்பு வினை இல்லாத பெயர்வாக்கியம் உள்ளது. அது முழுப் பட்டியலின் பொருளையும் மேற்பரப்பையும் விவரிப்பதாக இயல்பாகப் புரிகிறது; தமிழில் ‘அவை ... ஆனவை’ என்பது அந்தத் தொடர்பைத் தெளிவாக்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், ஆலயப் பொருள்களின் பட்டியலுக்கேற்ற கண்ணியமான ஆனால் பொதுவாசகருக்குப் புரியும் நடை பயன்படுத்தப்பட்டது. இவ்வசனம் முந்தைய வசனத்தின் வினையுடன் தொடரும் பட்டியல் என்பதால், தமிழில் நிறைவு பெற ‘செய்தான்’ வெளிப்படையாக வழங்கப்பட்டது; பின்னர் வரும் எபிரெயப் பெயர்வாக்கியம் தனி வாக்கியமாக அமைக்கப்பட்டது.
