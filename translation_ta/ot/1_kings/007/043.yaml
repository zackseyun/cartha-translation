source:
  edition: WLC
  text: וְ/אֶת הַ/מְּכֹנ֖וֹת עָ֑שֶׂר וְ/אֶת הַ/כִּיֹּרֹ֥ת עֲשָׂרָ֖ה עַל הַ/מְּכֹנֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/043.yaml
  text: and the ten stands[a], and the ten basins on the stands,
translation:
  language: ta
  text: பத்து தாங்கு மேடைகளையும்,[a] தாங்கு மேடைகளின் மேல் இருந்த பத்துக் கழுவும் தொட்டிகளையும் செய்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அடிப்பீடங்கள்.”
    reason: மְכֹנוֹת என்பதற்கு இச்சூழலில் கழுவும் தொட்டிகளைத் தாங்கும் மேடைகள் அல்லது அடிப்பீடங்கள் என்ற பொருள் உண்டு.
lexical_decisions:
- source_word: וְ/אֶת
  choice: -ஐயும்
  rationale: אֵת என்பது குறிப்பிட்ட நேரடி செயப்படுபொருளைக் குறிக்கிறது; וְ பட்டியலின் தொடர்ச்சியைக் காட்டுவதால், தமிழில் செயப்படுபொருள் உருபுடன் இணைந்த ‘-உம்’ மூலம் இயல்பாகத் தரப்பட்டது.
- source_word: הַ/מְּכֹנוֹת
  choice: தாங்கிகள்
  rationale: ஆலயப் பொருட்களின் இச்சூழலில் מְכוֹנוֹת என்பது கழுவும் தொட்டிகளைத் தாங்கிய, சுற்றியுள்ள வசனங்களில் விவரிக்கப்படும் அமைப்புகளைக் குறிக்கிறது. ‘தாங்கிகள்’ அவற்றின் செயல்பாட்டைத் தெளிவாகவும் மிகைப்படுத்தாமலும் தெரிவிக்கிறது.
- source_word: עָשֶׂר
  choice: பத்து
  rationale: מְכֹנוֹת என்பதன் எண்ணிக்கையைக் குறிக்கும் எளிய எண்ணுப்பெயர்.
- source_word: הַ/כִּיֹּרֹת
  choice: கழுவும் தொட்டிகள்
  rationale: כִּיּוֹר என்பது கழுவுவதற்கான பெரிய பாத்திரம் அல்லது தொட்டியைக் குறிக்கிறது. ‘கழுவும் தொட்டிகள்’ நவீன வாசகருக்கு அதன் பயன்பாட்டைத் தெளிவாகக் காட்டுகிறது.
- source_word: עֲשָׂרָה
  choice: பத்து
  rationale: כִּיּוֹרוֹת என்பதன் எண்ணிக்கையைக் குறிக்கும் எளிய எண்ணுப்பெயர்.
- source_word: עַל
  choice: -இன்மேல்
  rationale: தொட்டிகள் தாங்கிகளின் மேல் வைக்கப்பட்டிருந்த இடத்தொடர்பை இயல்பான தமிழில் குறிக்கிறது.
- source_word: הַ/מְּכֹנוֹת
  choice: தாங்கிகள்
  rationale: ஒரே வசனத்தில் மீண்டும் வரும் சொல்லை ஒரே விதமாக மொழிபெயர்த்து சொற்பொருள் தொடர்ச்சி காக்கப்பட்டது.
- source_word: עָשָׂה (ellipsis from the continuing inventory context)
  choice: செய்தான்
  rationale: எபிரெய உரை முந்தைய பட்டியலின் வினைச்சொல்லை இங்கு வெளிப்படையாக மீண்டும் சொல்லாமல் தொடர்கிறது. தனி வசனமாகத் தமிழில் வாசிக்க இயலுமாறு சூழலிலிருந்து ‘செய்தான்’ நிறைவு வினையாக வழங்கப்பட்டது.
