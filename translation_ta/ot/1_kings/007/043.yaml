translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டது. வசனம் தனியாகவும் தெளிவாக இருக்க, தொடரும் பட்டியலிலிருந்து புரிந்துகொள்ளப்படும் ‘செய்தான்’ சேர்க்கப்பட்டது. ‘லேவர்கள்’ போன்ற வழக்கொழிந்த திருச்சபைச் சொல்லுக்குப் பதிலாக ‘கழுவும் தொட்டிகள்’ தேர்ந்தெடுக்கப்பட்டது.
