base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/051.yaml
  text: So all the work that King Solomon did for the house of Yahweh was finished. And Solomon brought in the holy things of David his father—the silver[a], the gold, and the vessels—and put them in the treasuries of the house of Yahweh.
translation:
  language: ta
  text: யாவேவின் ஆலயத்துக்காகச் சாலொமோன் அரசன் செய்த எல்லாப் பணியும் முடிவடைந்தது. பின்னர் சாலொமோன் தன் தந்தை தாவீதின் புனிதப் பொருட்களான[a] வெள்ளியையும் தங்கத்தையும் பாத்திரங்களையும் கொண்டுவந்து, அவற்றை யாவேவின் ஆலயக் கருவூலங்களில் வைத்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தன் தந்தை தாவீதின் அர்ப்பணிக்கப்பட்ட பொருட்கள்.” எபிரெயச் சொல் யாவேவுக்கெனப் புனிதமாகப் பிரித்து வைக்கப்பட்ட பொருட்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשְׁלַם
  choice: நிறைவடைந்தன
  rationale: שלם என்பதன் இச்சூழல் பொருள் ‘முழுமை அடைதல்/முடிவடைதல்.’ எழுவாயான ‘எல்லா வேலைகளும்’ என்பதோடு இயல்பாகப் பொருந்தும் நவீனத் தமிழ் வடிவம்.
- source_word: כָּל הַמְּלָאכָה
  choice: எல்லா வேலைகளும்
  rationale: ஆலயக் கட்டுமானம் மற்றும் அதன் உபகரணங்களைச் செய்வது உள்ளிட்ட மொத்தப் பணியையும் குறிக்கிறது.
- source_word: בֵּית יְהוָה
  choice: யாவேவின் ஆலயம்
  rationale: בֵּית என்பதன் நேரடிப் பொருள் ‘வீடு’ என்றாலும், இங்கு இயல்பான தமிழில் கடவுளின் ஆலயத்தைக் குறிக்கிறது; יְהוָה உடன்படிக்கைப் பெயராக ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டது.
- source_word: וַיָּבֵא
  choice: கொண்டுவந்து
  rationale: בוא என்பதன் ஹிஃபில் வடிவம் ‘உள்ளே கொண்டுவருதல்’ எனப் பொருள்படும்; இலக்கான ஆலயக் கருவூலங்கள் பின்னர் குறிப்பிடப்படுவதால் ‘கொண்டுவந்து’ இயல்பாக உள்ளது.
- source_word: קָדְשֵׁי דָּוִד אָבִיו
  choice: தன் தந்தை தாவீது அர்ப்பணித்த புனிதப் பொருட்கள்
  rationale: קָדְשֵׁי என்பது புனிதமானவையாகப் பிரித்து அர்ப்பணிக்கப்பட்ட பொருட்களைக் குறிக்கிறது. தமிழ் வாசகருக்கு அர்ப்பணிப்பு மற்றும் புனிதத் தன்மை இரண்டையும் தெளிவாக்க இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: הַכֶּסֶף ... הַזָּהָב ... הַכֵּלִים
  choice: வெள்ளி, தங்கம், மற்ற பொருட்கள்
  rationale: כֵּלִים என்பது பாத்திரங்கள், கருவிகள், உபகரணங்கள் உள்ளிட்ட பலவகைப் பொருட்களைக் குறிக்கும் பரந்த சொல்; செயல்பாட்டை அளவுக்கு மீறிக் குறிப்பாக்காமல் ‘மற்ற பொருட்கள்’ என வழங்கப்பட்டது.
- source_word: נָתַן
  choice: வைத்தான்
  rationale: נתן இங்கு பொருட்களைச் சேமிப்பிடங்களில் இடுதல் என்ற பொருளில் வருகிறது; ‘வைத்தான்’ இயல்பானதும் துல்லியமானதும்.
- source_word: בְּאֹצְרוֹת
  choice: கருவூலங்களில்
  rationale: பன்மை வடிவம் ஆலயத்துடன் இணைந்த சேமிப்பு அறைகள் அல்லது பொக்கிஷ அறைகளைக் குறிக்கிறது; ‘கருவூலங்கள்’ இரு நுணுக்கங்களையும் ஏற்கும்.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / ஆண்டவர்
  rationale: எபிரெய மூலத்தில் உடன்படிக்கைப் பெயரான நான்கு எழுத்துப் பெயர் நேரடியாக உள்ளது. அதை பொதுப்பட்டப் பெயராக மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்ப்பது மூலத்தின் தனிப்பெயர்த் தன்மையைப் பாதுகாக்கிறது.
- issue: קָדְשֵׁי என்பதில் புனிதத்தன்மையா அர்ப்பணிப்பா
  choice: அர்ப்பணித்த புனிதப் பொருட்கள்
  alternative: தாவீதின் புனிதப் பொருட்கள்
  rationale: இந்தச் சொல் யாவேவுக்கெனப் பிரித்து வைக்கப்பட்ட பொருட்களைக் குறிக்கலாம். தமிழ் உரையில் புனிதத்தன்மையையும் அர்ப்பணிக்கப்பட்ட நிலையையும் இணைத்து வெளிப்படுத்தி, மாற்று நுணுக்கத்தை அடிக்குறிப்பில் குறிப்பிடுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘ஆலயம்,’ ‘கருவூலம்,’ ‘புனிதப் பொருட்கள்’ ஆகிய சொற்கள் சூழலுக்குரிய மதிப்பையும் மூலத்தின் பொருளையும் காக்கின்றன.
