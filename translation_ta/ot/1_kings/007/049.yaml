translation_notes:
  register: நவீன நிலையான தமிழில், ஆலயப் பொருட்களின் பட்டியல் நடையைப் பேணும் கண்ணியமான மற்றும் எளிதில் புரியக்கூடிய மொழிநடை. மூலத்தின் வலது/இடது இடக்குறிப்பும், உள் அறைக்கான சொல்லின் நுணுக்கமும் பாதுகாக்கப்பட்டுள்ளன. [b] குறிப்பு ‘தூய தங்கத்தால்’ என்பதன் உடனே வர வேண்டும் என்பதால், தமிழ்ச் சொற்றொடரின் நிறைவில் வைக்கப்பட்டுள்ளது.
