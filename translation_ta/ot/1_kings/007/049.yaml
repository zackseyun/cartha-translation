- from: தூய தங்கத்தால் செய்யப்பட்ட விளக்குத்தண்டுகள்—உள் திருத்தலத்தின்[a] முன்பாக வலப்புறத்தில் ஐந்தும் இடப்புறத்தில் ஐந்தும்—அவற்றின் மலர் அலங்காரங்கள், விளக்குகள், இடுக்கிகள்[c] ஆகியவையும் தங்கத்தால் செய்யப்பட்டவை.[b]
