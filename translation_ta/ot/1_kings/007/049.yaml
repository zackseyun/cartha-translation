  yaml_path: translation/ot/1_kings/007/049.yaml
  text: and the lampstands[a], five on the right and five on the left, before the inner sanctuary, of pure gold; and the flowers, the lamps, and the tongs[c][b], of gold.
translation:
  language: ta
  text: தூய தங்கத்தாலான[b] விளக்குத்தாங்கிகள்—உள் திருத்தலத்தின் முன்பாக வலப்புறம் ஐந்தும் இடப்புறம் ஐந்தும்—அவற்றின் மலர் அலங்காரங்கள், விளக்குகள், இடுக்கிகள் ஆகியவை தங்கத்தாலானவை.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ‘தூய தங்கம்’ என்பதற்கு, ‘புடமிடப்பட்ட தங்கம்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘திரிவெட்டிகள்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: מְּנֹרוֹת
  choice: விளக்குத்தண்டுகள்
  rationale: இச்சொல் தனித்தனி விளக்குகளை அல்ல, எண்ணெய் விளக்குகளைத் தாங்கும் தண்டுகளைக் குறிக்கிறது; ‘மெழுகுவர்த்தித் தண்டுகள்’ என்பது காலத்திற்குப் பொருந்தாத கருத்தைத் தரும்.
- source_word: מִיָּמִין ... מִשְּׂמֹאול
  choice: வலப்புறத்தில் ... இடப்புறத்தில்
  rationale: எபிரெய மூலத்தின் தொடர்புநிலை இடக்குறிப்பை நேரடியாகப் பேணுகிறது; ஆலயத் திசையமைப்பின் அடிப்படையில் தெற்கு/வடக்கு என்று விளக்கிப் பதிப்பதைத் தவிர்க்கிறது.
- source_word: לִפְנֵי הַדְּבִיר
  choice: உள் திருத்தலத்தின் முன்பாக
  rationale: דְּבִיר ஆலயத்தின் மிக உட்புற அறையைக் குறிக்கிறது. ‘உள் திருத்தலம்’ தெளிவான, இயல்பான தமிழாக இருந்து பிற்காலத் தொழில்நுட்பச் சொல்லாக்கத்தை முதன்மை உரையில் திணிக்காது.
- source_word: זָהָב סָגוּר
  choice: தூய தங்கத்தால்
  rationale: இந்தச் சொற்றொடர் உயர்தரமாகப் புடமிடப்பட்ட தங்கத்தைக் குறிக்கிறது; ‘தூய தங்கம்’ தமிழில் இயல்பாக அதன் பொருளைத் தருகிறது.
- source_word: הַפֶּרַח
  choice: மலர் அலங்காரங்கள்
  rationale: ஒருமை வடிவிலுள்ள எபிரெயச் சொல் இங்கு விளக்குத்தண்டுகளிலுள்ள மலர் வடிவ அலங்காரங்களைத் தொகுப்பாகக் குறிக்கிறது; தமிழில் பன்மை இயல்பாக அமைகிறது.
- source_word: הַנֵּרֹת
  choice: விளக்குகள்
  rationale: விளக்குத்தண்டுகளோடு இணைந்த தனித்தனி எண்ணெய் விளக்குகளை நேரடியாகக் குறிக்கிறது.
- source_word: הַמֶּלְקַחַיִם
  choice: இடுக்கிகள்
  rationale: விளக்குகளைப் பராமரிக்கப் பயன்படுத்தப்பட்ட பிடிப்புக் கருவிக்கான நேரடியான பொதுத் தமிழ் இணை; ‘திரிவெட்டிகள்’ என்பது அதன் குறிப்பிட்ட பயன்பாட்டை ஊகிக்கிறது.
- source_word: זָהָב
  choice: தங்கத்தால் செய்யப்பட்டவை
  rationale: இறுதியில் வரும் ‘தங்கம்’ மலர் அலங்காரங்கள், விளக்குகள், இடுக்கிகள் ஆகிய அனைத்துக்கும் பொருந்துகிறது; தமிழில் முழுமையான வாக்கியமாக இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது.
