  text: Then King Solomon sent and brought Hiram from Tyre.
translation:
  language: ta
  text: பின்பு அரசன் சாலொமோன் அனுப்பி, ஈராமைத் தீருவிலிருந்து அழைத்துவந்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: ஆட்களை அனுப்பி
  rationale: எபிரெய வினைச்சொல் நேரடியாக ‘அனுப்பினான்’ எனப் பொருள்படும்; அடுத்த வினையுடன் இயல்பாக இணைக்க, அனுப்பப்பட்டவர்களை மறைமுகமாகக் குறிக்கும் ‘ஆட்களை’ சேர்த்தது தமிழில் செயலைத் தெளிவாக்குகிறது.
- source_word: וַיִּקַּח
  choice: அழைத்துவரச் செய்தான்
  rationale: לקח என்பதன் அடிப்படைப் பொருள் ‘எடுத்தான்/கொண்டான்’; இங்கு அரசன் அனுப்பியவர்கள் ஈராமை தீருவிலிருந்து அழைத்து வந்தார்கள் என்பதே சூழல். ‘அழைத்துவரச் செய்தான்’ என்பது அரசனின் ஏற்பாட்டையும் மூலத்தின் காரணவினை சார்ந்த நடைமுறைப் பொருளையும் இயல்பான தமிழில் தருகிறது.
- source_word: חִירָם
  choice: ஈராம்
  rationale: எபிரெயப் பெயர் חִירָם (Ḥîrām) என்பதற்கு நெருக்கமான, தமிழில் வாசிக்க இயல்பான ஒலிபெயர்ப்பு.
- source_word: מִצֹּר
  choice: தீருவிலிருந்து
  rationale: צֹר என்பது Tyre நகரத்தின் எபிரெயப் பெயர்; מִן முன்னொட்டு புறப்படும் இடத்தைக் குறிப்பதால் ‘தீருவிலிருந்து’ என மொழிபெயர்க்கப்பட்டது.
