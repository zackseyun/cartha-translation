base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/012.yaml
  text: And the great court all around had three rows of cut stone and a row of cedar beams[c][b][a], like the inner court of the house of Yahweh and the vestibule of the house.
translation:
  language: ta
  text: பெரிய முற்றத்தைச் சுற்றிலும் செதுக்கப்பட்ட கற்களால் மூன்று வரிசைகளும், கேதுரு மர உத்தரங்களால் ஒரு வரிசையும் இருந்தன[b]. அது யாவேவின் ஆலயத்தின் உள்முற்றத்தையும், ஆலயத்தின் நுழைவு மண்டபத்தையும்[c] போல அமைந்திருந்தது[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேவின் ஆலயத்தின் உள்முற்றத்திற்கும் ஆலயத்தின் நுழைவு மண்டபத்திற்கும் அவ்வாறே செய்யப்பட்டிருந்தது.” எபிரெய முன்னொட்டு ஒப்புமையையோ தொடர்பையோ குறிக்கலாம்; இங்கு அது “போல” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “செதுக்கப்பட்ட கற்களால் மூன்று அடுக்குகளும், கேதுரு மர உத்தரங்களால் ஓர் அடுக்கும்.”
    reason: lexical_alternative
  - marker: c
    text: அதாவது, ஆலயக் கட்டடத்தின் முன்புற நுழைவுக் கூடம்.
    reason: cultural_note
lexical_decisions:
- source_word: חָצֵר הַגְּדוֹלָה
  choice: பெரிய முற்றம்
  rationale: חָצֵר என்பது சுற்றிலும் அடைக்கப்பட்ட முற்றத்தைக் குறிக்கிறது; ‘பெரிய முற்றம்’ என்பது இயல்பான, தெளிவான கட்டடக்கலைச் சொற்றொடர்.
- source_word: סָבִיב
  choice: சுற்றிலும்
  rationale: முற்றத்தின் எல்லாப் பக்கங்களிலும் அமைந்திருந்ததைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: שְׁלֹשָׁה טוּרִים גָּזִית
  choice: செதுக்கப்பட்ட கற்களால் மூன்று வரிசைகள்
  rationale: கட்டுமானச் சூழலில் טוּר என்பது கற்களின் வரிசை அல்லது அடுக்கைக் குறிக்கும்; גָּזִית என்பது வெட்டிச் செதுக்கி வடிவமைக்கப்பட்ட கல்லைக் குறிக்கும்.
- source_word: וְטוּר כְּרֻתֹת אֲרָזִים
  choice: கேதுரு மர உத்தரங்களால் ஒரு வரிசை
  rationale: כְּרֻתֹת என்பதன் நேர்ப்பொருள் ‘வெட்டப்பட்டவை’; இக்கட்டுமானச் சூழலில் அவை கேதுரு மர உத்தரங்களாகச் செயல்படுகின்றன. ‘உத்தரங்கள்’ என்பது கட்டடத்தில் குறுக்காக இடப்படும் தாங்கு மரங்களைத் தெளிவாகக் குறிக்கிறது.
- source_word: וְלַחֲצַר בֵּית יְהוָה הַפְּנִימִית
  choice: யாவேவின் ஆலயத்தின் உள்முற்றத்தைப் போல
  rationale: לְ முன்னொட்டை இங்கு ஒப்புமையைக் குறிப்பதாக எடுத்துக்கொள்வது தொடரின் சுருக்கப்பட்ட கட்டமைப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது; அதன் மாற்று தொடர்புப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: אֻלָם הַבָּיִת
  choice: ஆலயத்தின் நுழைவு மண்டபம்
  rationale: אֻלָם என்பது கட்டடத்தின் முன்புற நுழைவு மண்டபத்தைக் குறிக்கிறது. ‘நுழைவு மண்டபம்’ சாதாரண வாசகருக்குத் தெளிவாகவும் கட்டடச் சூழலுக்கு ஏற்றதாகவும் உள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் உள்ள கடவுளின் தனிப்பெயரை பொதுப்பட்டமான ‘ஆண்டவர்’ என்பதற்குப் பதிலாக ஒலிபெயர்த்து வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூல உரையில் நான்கெழுத்து இறைப்பெயர் நேரடியாக உள்ளது; ‘யாவே’ என்பது அந்த உடன்படிக்கைப் பெயரைப் பொதுப்பட்டமாக மாற்றாமல் பாதுகாக்கிறது.
- issue: לְ முன்னொட்டின் பொருள்
  choice: 'ஒப்புமை: ‘போல’'
  alternative: 'தொடர்பு அல்லது நோக்கம்: ‘…க்காகவும் / …க்கும்’'
  rationale: இவ்வசனத்தின் சுருக்கப்பட்ட கட்டட விவரிப்பில் பெரிய முற்றத்தின் அமைப்பு ஆலய உள்முற்றம் மற்றும் நுழைவு மண்டபத்தின் அமைப்புடன் ஒப்பிடப்படுவதாக வாசிப்பது தொடர்ச்சியான பொருளை அளிக்கிறது; எனினும் எபிரெய முன்னொட்டு வேறுவிதமாகவும் புரிந்துகொள்ளப்படலாம் என்பதால் மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகருக்குப் புரியும் வகையில் கட்டடக்கலைச் சொற்கள் பயன்படுத்தப்பட்டுள்ளன. ‘முற்றம்’, ‘வரிசை’, ‘நுழைவு மண்டபம்’ ஆகியவை தெளிவுக்காகத் தேர்ந்தெடுக்கப்பட்டன; ‘உத்தரம்’ என்ற கட்டடச் சொல் ‘beam’ என்பதன் பணியைத் துல்லியமாகக் காட்டுகிறது. மூல எபிரெயத்தின் சுருக்கப்பட்ட வாக்கிய அமைப்பு தமிழில் தேவையான வினைச்சொற்களுடன் இயல்பாக்கப்பட்டுள்ளது; לְ முன்னொட்டின் உண்மையான இருபொருள் தன்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
