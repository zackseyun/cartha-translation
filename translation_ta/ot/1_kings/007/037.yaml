lexical_decisions:
- source_word: כָּזֹאת
  choice: இவ்வாறே
  rationale: முன்னர் விவரிக்கப்பட்ட வடிவமைப்பையும் செய்முறையையும் சுட்டும் தொகுப்புரையாக இயல்பாக அமைகிறது.
- source_word: עָשָׂה
  choice: செய்தான்
  rationale: கைவினைச் சூழலில் எளிமையான, நேரடியான பொருளைத் தருகிறது.
- source_word: עֶשֶׂר הַמְּכֹנוֹת
  choice: பத்துத் தாங்கிகளையும்
  rationale: இவை தொட்டிகளைத் தாங்கிய நகர்த்தக்கூடிய அடித்தள அமைப்புகள்; ‘தாங்கிகள்’ அவற்றின் செயல்பாட்டைத் தெளிவாகக் கூறுகிறது.
- source_word: מוּצָק אֶחָד
  choice: ஒரே வார்ப்பு
  rationale: உலோகத்தை உருக்கி வார்த்த செய்முறையையும் பத்தும் ஒரே விதமாகச் செய்யப்பட்டதையும் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: מִדָּה אַחַת
  choice: ஒரே அளவு
  rationale: அனைத்திற்கும் ஒரே பரிமாணம் இருந்ததை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: קֶצֶב אֶחָד
  choice: ஒரே வடிவம்
  rationale: இங்கு குறிக்கப்படும் உருவமைப்பு அல்லது வடிவமைப்பை வெளிப்படுத்தி, எபிரெய இணைநிலையைப் பேணுகிறது.
- source_word: לְכֻלָּהְנָה
  choice: அவை அனைத்துக்கும்
  rationale: பத்துத் தாங்கிகள் ஒவ்வொன்றுக்கும் ஒரே விவரக்குறிப்புகள் பொருந்தின என்பதைத் தெளிவாக்குகிறது.
