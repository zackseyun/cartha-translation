  text: The workmanship of the wheels was like the workmanship of a chariot wheel[a]; their axles, their rims, their spokes[b], and their hubs were all cast metal.
translation:
  language: ta
  text: சக்கரங்களின் வேலைப்பாடு தேர்ச் சக்கரத்தின் வேலைப்பாட்டைப் போல இருந்தது. அவற்றின் அச்சுகளும்[a] விளிம்புகளும் ஆரக்கால்களும் மையக் குடங்களும்[b] அனைத்தும் உலோகத்தில் வார்க்கப்பட்டவையாக இருந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அச்சுகள்’ என்பதற்குப் பதிலாக ‘கைப்பிடிகள்’ அல்லது ‘தாங்கிகள்’ என்றும் மொழிபெயர்க்கலாம். יְדוֹתָם என்ற எபிரெயச் சொல் சொல்லடிப்படையில் ‘கைகள்’ என்பதோடு தொடர்புடையது; ஆனால் சக்கரத்தைப் பற்றிய இச்சூழலில் அது அச்சுப் பகுதிகளையோ தாங்கிகளையோ குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: ‘ஆரக்கால்கள்’ என்பதற்குப் பதிலாக ‘பட்டைகள்’ என்றும், ‘மையக் குடங்கள்’ என்பதற்குப் பதிலாக ‘மையப் பகுதிகள்’ அல்லது ‘இணைப்புப் பகுதிகள்’ என்றும் மொழிபெயர்க்கலாம். இவ்விரு எபிரெயச் சொற்களும் அரியவை; அவற்றின் துல்லியமான தொழில்நுட்பப் பொருள் சக்கரக் கட்டமைப்புச் சூழலிலிருந்து ஊகிக்கப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲשֵׂה
  choice: வடிவமைப்பு
  rationale: இங்கு இச்சொல் சக்கரங்களின் வேலைப்பாட்டையும் அவை அமைக்கப்பட்ட விதத்தையும் குறிக்கிறது; நவீனத் தமிழில் ‘வடிவமைப்பு’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: הָאֹפַנִּים / אוֹפַן
  choice: சக்கரங்கள் / சக்கரம்
  rationale: கட்டமைப்பு சார்ந்த இச்சூழலில் இதுவே சொல்லின் வழக்கமான பொருள்; ஒப்பீட்டிலுள்ள ஒருமையும் தமிழில் இயல்பாகப் பாதுகாக்கப்படுகிறது.
- source_word: כְּמַעֲשֵׂה
  choice: வடிவமைப்பைப் போல
  rationale: כְּ என்னும் ஒப்புமைப் பொருளைப் பாதுகாத்து, சுருக்கமான இயல்பான தமிழில் வழங்குகிறது.
- source_word: הַמֶּרְכָּבָה
  choice: தேர்
  rationale: பண்டைய சூழலில் இச்சொல் பொதுவாகத் தேரைக் குறிக்கிறது; ‘தேர்ச் சக்கரம்’ தெளிவான தமிழ்ச் சேர்க்கை.
- source_word: יְדוֹתָם
  choice: அச்சுகள்
  rationale: יָד என்பதன் அடிப்படைப் பொருள் ‘கை’ என்றாலும், சக்கரப் பகுதிகளின் பட்டியலில் இது அச்சுகளையோ அவற்றோடு தொடர்புடைய தாங்கிகளையோ குறிக்கலாம்; ‘அச்சுகள்’ சூழலுக்கு மிகவும் பொருத்தமானது.
- source_word: גַבֵּיהֶם
  choice: விளிம்புகள்
  rationale: சக்கரத்தின் உயர்ந்த வெளிப்புறப் பகுதியைக் குறிக்கும் சூழல்சார் பொருளை எளிய நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: חִשֻּׁקֵיהֶם
  choice: ஆரங்கள்
  rationale: சக்கரத்தின் மையத்தையும் வெளிவிளிம்பையும் இணைக்கும் பகுதிகள் என்ற சூழல்சார் புரிதலைத் தெளிவாகக் காட்டுகிறது; எபிரெயச் சொல்லின் துல்லியமான தொழில்நுட்பப் பொருள் உறுதியற்றது.
- source_word: חִשֻּׁרֵיהֶם
  choice: சக்கரக் குடங்கள்
  rationale: சக்கரத்தின் அச்சைச் சுற்றியுள்ள மையப் பகுதியைத் தமிழில் குறிக்கும் தொழில்நுட்பச் சொல்; அரிய எபிரெயச் சொல்லின் பொருள் சூழலிலிருந்து ஊகிக்கப்படுகிறது.
- source_word: הַכֹּל
  choice: அனைத்தும்
  rationale: முன்னர் பட்டியலிடப்பட்ட எல்லாப் பகுதிகளையும் தொகுத்துக் குறிக்கிறது.
- source_word: מוּצָק
  choice: உலோக வார்ப்பில் செய்யப்பட்டிருந்தன
  rationale: יצק வேரிலிருந்து வந்த இவ்வடிவம் உருக்கி வார்க்கப்பட்ட பொருளைக் குறிக்கிறது; தமிழில் செய்முறையையும் உலோகத் தன்மையையும் தெளிவாகத் தெரிவிக்கிறது.
