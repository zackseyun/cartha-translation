  text: He made the Hall of Pillars fifty cubits long and thirty cubits wide[a], with a porch in front of them[b], and pillars and a threshold in front of them.
translation:
  language: ta
  text: அவன் தூண்களின் மண்டபத்தை அமைத்தான். அது ஐம்பது முழம் நீளமும் முப்பது முழம் அகலமும் கொண்டிருந்தது. அவற்றின் முன்பாக ஒரு முகப்பு மண்டபம்[a] இருந்தது; அவற்றின் முன்பாகத் தூண்களும் ஒரு மேற்கூரை அமைப்பும்[b] இருந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மண்டபம்” என்றும் “முகப்பு மண்டபம்” என்றும் மொழிபெயர்க்கப்பட்ட இரண்டு இடங்களிலும் எபிரெய மொழியில் ஒரே சொல்லே (אוּלָם) வருகிறது. இரண்டாவது இடத்தில் அது தூண்களின் மண்டபத்தோடு இணைந்த முன்புறக் கட்டமைப்பைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இங்கு “மேற்கூரை அமைப்பு” என்று மொழிபெயர்க்கப்பட்ட எபிரெயச் சொல்லின் (עָב) பொருள் இந்தக் கட்டடவியல் சூழலில் உறுதியற்றது. “வாசற்படி,” “தடித்த உத்தர அமைப்பு,” அல்லது வேறொரு மூடப்பட்ட கட்டமைப்புக் கூறு என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
