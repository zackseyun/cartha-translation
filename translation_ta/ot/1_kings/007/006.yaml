  rationale: மீண்டும் வரும் אוּלָם என்பதற்கு ‘மண்டபம்’ என்பதையே தக்கவைத்து, இங்கு முன்புற அமைப்பைக் குறிக்க ‘முகப்பு’ என்று சேர்க்கப்பட்டுள்ளது. பன்மைச் சுட்டுப்பெயரின் தெளிவின்மையும் ‘அவற்றின்’ என்பதால் பாதுகாக்கப்படுகிறது.
