translation_notes:
  register: நவீன பொதுத்தமிழில், கட்டட விவரிப்புக்கு ஏற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. தெளிவற்ற எபிரெயக் கட்டடக்கலைச் சொல்லும் ‘மூன்று முறை’ என்ற அமைப்பும் முதன்மை உரையில் அளவுக்கு மீறி விளக்கப்படாமல், மாற்று விளக்கங்கள் அடிக்குறிப்புகளில் வழங்கப்பட்டுள்ளன.
