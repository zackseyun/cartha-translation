  text: All the doorways and the doorposts had square frames[b][a], and window was opposite window three times.
translation:
  language: ta
  text: எல்லா வாசல் திறப்புகளும் நிலைக்கால்களும் சதுர வடிவச் சட்டங்களுடன் இருந்தன[a]. சாளரத்துக்கு எதிரே சாளரம், மூன்று முறை[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எல்லா வாசல் திறப்புகளும் நிலைக்கால்களும் சதுர உத்தரங்களுடன் இருந்தன.” இங்குள்ள எபிரெயக் கட்டடக்கலைச் சொல் சட்டத்தின் மேல்பகுதியை, அல்லது உத்தரத்தை, இன்னும் குறிப்பாகக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எழுத்துப்படி, “சாளரத்துக்கு எதிரே சாளரம், மூன்று முறை.” இது ஒன்றுக்கொன்று நேரெதிராக மூன்று வரிசைகளிலோ மூன்று தளங்களிலோ அமைந்த சாளரங்களைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּתָחִים
  choice: வாசல்கள்
  rationale: இச்சொல் பொதுவாகத் திறப்பு அல்லது நுழைவிடத்தைக் குறிக்கிறது. இங்குள்ள கட்டடச் சூழலில் நகர்த்தக்கூடிய கதவுப் பலகைகளைவிட வாசல் திறப்புகளைக் குறிக்கும் இயல்பான தமிழ்ச் சொல் ‘வாசல்கள்’ ஆகும்.
- source_word: מְּזוּזוֹת
  choice: நிலைக்கால்கள்
  rationale: வாசலின் இருபுறமும் செங்குத்தாக நிற்கும் சட்டத் தூண்களை இச்சொல் குறிக்கிறது; ‘நிலைக்கால்கள்’ என்பது தெளிவான கட்டடக்கலைச் சொல்.
- source_word: רְבֻעִים
  choice: சதுர
  rationale: நான்கு மூலைகளைக் கொண்ட வடிவத்தைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: שָׁקֶף
  choice: சட்டங்கள்
  rationale: இது சட்டத்தின் மேல்பகுதி அல்லது உத்தரத்தைக் குறிப்பாகக் குறிக்கக்கூடிய அரிதான கட்டடக்கலைச் சொல். ‘சட்டங்கள்’ என்பது அதன் கட்டமைப்புப் பொருளைக் காக்கிறது; குறிப்பான மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: מוּל
  choice: எதிரே
  rationale: ஒன்றுக்கு எதிராக அல்லது அதற்கு நேர்நேர் அமைந்திருப்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: מֶחֱזָה
  choice: சாளரம்
  rationale: கட்டட விவரிப்பில் இது பார்வைக்கான திறப்பு அல்லது சாளரத்தைக் குறிக்கலாம்; ‘சாளரம்’ சூழலுக்கு ஏற்ற தெளிவான சொல்.
- source_word: שָׁלֹשׁ פְּעָמִים
  choice: மூன்று முறை
  rationale: எபிரெயச் சொற்றொடரின் நேரடிப் பொருளைக் காத்து, அது மூன்று வரிசைகள் அல்லது தளங்களைக் குறிக்கிறதா என்ற விளக்கத்தை முதன்மை உரையில் தீர்மானிக்காமல் விடுகிறது.
