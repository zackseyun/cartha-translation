  text: And on the top of the stand there was a round rim all around[a], half a cubit high[b]; and on the top of the stand its supports and its panels were of one piece with it.
translation:
  language: ta
  text: தாங்கியின் மேற்பகுதியில், சுற்றிலும் வட்டமாக அமைந்த, அரை முழம் உயரமுள்ள ஒரு விளிம்பு இருந்தது; தாங்கியின் மேற்பகுதியில் அதன் தாங்குறுப்புகளும்[a] பலகைகளும்[b] அதனுடன் ஒரே பகுதியாக இருந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கைப்பிடிகளும்.” இதற்கான எபிரெயச் சொல் நேர்ப்பொருளில் “அதன் கைகள்” என்று பொருள்படும்; தாங்கியிலிருந்து நீண்டிருந்த உறுப்புகளை இது குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “சட்டங்களும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְרֹאשׁ הַמְּכוֹנָה
  choice: தாங்கியின் மேற்பகுதியில்
  rationale: רֹאשׁ என்பது இங்கு ஒரு பொருளின் ‘மேல் பகுதி’யைக் குறிக்கிறது; מְכוֹנָה இந்த அதிகாரத்தில் வெண்கலத் தாங்கியைக் குறிக்கிறது.
- source_word: חֲצִי הָאַמָּה קוֹמָה
  choice: அரை முழம் உயரமுள்ள
  rationale: அசல் அளவான אַמָּה ‘முழம்’ எனத் தக்கவைக்கப்பட்டது; קוֹמָה குறிப்பிடும் செங்குத்தான உயரமும் இயல்பான தமிழில் வெளிப்படுத்தப்பட்டது.
- source_word: עָגֹל סָבִיב
  choice: வட்ட விளிம்பு சுற்றிலும்
  rationale: עָגֹל மற்றும் סָבִיב முறையே வட்ட வடிவத்தையும் சுற்றியிருப்பதையும் குறிக்கின்றன. எபிரெயில் அமைப்புக்கான பெயர்ச்சொல் வெளிப்படையாக இல்லாவிட்டாலும், கட்டடச் சூழலில் ‘விளிம்பு’ என நிரப்புவது தெளிவான வாசிப்பைத் தருகிறது.
- source_word: יְדֹתֶיהָ
  choice: அதன் தாங்குறுப்புகள்
  rationale: יָד என்பதன் நேர்ப்பொருள் ‘கை’; பொருட்களின் விவரிப்பில் நீட்டியிருக்கும் கைப்பிடி அல்லது தாங்குறுப்பைக் குறிக்கலாம். இங்கு கட்டமைப்புச் சூழலுக்கு ‘தாங்குறுப்புகள்’ பொருத்தமானது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: וּמִסְגְּרֹתֶיהָ
  choice: பலகைச் சட்டங்கள்
  rationale: מִסְגְּרוֹת என்பது சட்டமிடப்பட்ட பகுதிகள், சட்டங்கள் அல்லது பலகைகளைக் குறிக்கலாம். ‘பலகைச் சட்டங்கள்’ என்பது வடிவமைப்பையும் காணக்கூடிய பகுதிகளையும் தெளிவாக உணர்த்துகிறது.
- source_word: מִמֶּנָּה
  choice: அதனுடன் ஒரே பகுதியாக இருந்தன
  rationale: מן மற்றும் பெண்பால் பின்னொட்டு இவ்வுறுப்புகள் தனியாக இணைக்கப்பட்டவை அல்லாமல் தாங்கியிலிருந்தே அமைந்தவை என்பதைக் காட்டுகின்றன; வார்ப்புமுறை குறித்து தேவையற்ற கூடுதல் குறிப்பைச் சேர்க்காமல் ஒருங்கிணைந்த தன்மை வெளிப்படுத்தப்பட்டது.
