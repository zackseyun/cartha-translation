translation_notes:
  register: நவீன நிலையான தமிழில், தொழில்நுட்ப விவரிப்பின் கண்ணியத்தையும் தெளிவையும் காக்கும் நடை பயன்படுத்தப்பட்டது. ‘தாங்கி,’ ‘வட்ட விளிம்பு,’ ‘தாங்குறுப்புகள்,’ ‘பலகைச் சட்டங்கள்’ ஆகிய சொற்கள் சாதாரண வாசகருக்குப் புரியுமாறும் எபிரெயக் கட்டமைப்பின் நிச்சயமின்மையை மிகையாகத் தீர்மானிக்காதவாறும் தேர்ந்தெடுக்கப்பட்டன.
