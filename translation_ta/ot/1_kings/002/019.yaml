  verdict: revise
  source_fidelity: 'செயல்களின் வரிசையும் முக்கிய சொற்களும் எபிரெய மூலத்துடன் நன்றாக ஒத்துள்ளன: பத்சேபா அதோனியாவுக்காகப் பேச வருதல், அரசர் எழுந்து எதிர்கொள்ளுதல், பணிதல், தமது அரியணையில் அமர்தல், அரசரின் தாய்க்கு அரியணை வைக்கச் செய்தல், வலப்பக்கத்தில் அமர்தல் ஆகியவை காக்கப்பட்டுள்ளன. עַל אֲדֹנִיָּהוּ என்பதற்கான சூழல்சார் ‘அதோனியாவுக்காக’ என்ற தெரிவும் ஆங்கில POB audit trail-உடன் ஒத்துள்ளது.'
