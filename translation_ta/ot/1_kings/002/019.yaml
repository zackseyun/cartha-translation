base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/019.yaml
  text: So Bathsheba went to King Solomon to speak to him on behalf of Adonijah. The king rose to meet her and bowed down before her. Then he sat on his throne and had a throne placed for the king's mother, and she sat at his right hand.
translation:
  language: ta
  text: பத்சேபா அதோனியாவுக்காகப் பேச சாலொமோன் அரசரிடம் சென்றார். அரசர் அவரை எதிர்கொள்ள எழுந்து, அவருக்கு முன்பாகத் தலைவணங்கினார். பின்பு அவர் தமது அரியணையில் அமர்ந்து, அரசரின் தாய்க்காக ஓர் அரியணையை வைக்கச் செய்தார்; பத்சேபா அரசரின் வலப்பக்கத்தில் அமர்ந்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַל אֲדֹנִיָּהוּ
  choice: அதோனியாவுக்காக
  rationale: עַל இங்கு வெறுமனே ‘அதோனியாவைப் பற்றி’ என்பதைக் காட்டிலும், அவனுக்காக வேண்டுகோள் வைக்க வந்த சூழலைக் குறிக்கிறது; இருப்பினும் வசனத்தில் வேண்டுகோளின் முடிவு சேர்க்கப்படவில்லை.
- source_word: וַיִּשְׁתַּחוּ לָהּ
  choice: அவருக்கு முன்பாகத் தலைவணங்கினார்
  rationale: שׁחה என்ற வினை உடலைத் தாழ்த்தி மரியாதை செலுத்துவதைக் குறிக்கிறது. ‘வழிபட்டார்’ என்ற இறையியல் சார்ந்த பொருளைத் திணிக்காமல் அரசர் தாய்க்குச் செலுத்திய மரியாதையை வெளிப்படுத்துகிறது.
- source_word: כִּסֵּא
  choice: அரியணை
  rationale: அரசருடைய இருக்கைக்கும் அவரது தாய்க்காக வைக்கப்பட்ட இருக்கைக்கும் ஒரே எபிரெயச் சொல் பயன்படுத்தப்பட்டுள்ளதால், இரு இடங்களிலும் ஒரே தமிழ்ச் சொல் வைக்கப்பட்டது.
- source_word: לִימִינוֹ
  choice: அரசரின் வலப்பக்கத்தில்
  rationale: சொற்பொருளான இடத்தைக் காக்கிறது; மரியாதை அல்லது அதிகாரத்தின் அளவை விளக்கமாகச் சேர்க்கவில்லை.
theological_decisions:
- issue: சாலொமோன் பத்சேபாவுக்கு முன்பாக வணங்கிய செயலின் தன்மை
  choice: ‘தலைவணங்கினார்’ என்று உடல்சார்ந்த மரியாதைச் செயலை மொழிபெயர்த்தல்
  alternative: ‘வழிபட்டார்’ அல்லது பொதுவாக ‘வணங்கினார்’
  rationale: மூல வினை பல சூழல்களில் பணிதல், மரியாதை செலுத்துதல், அல்லது வழிபாடு ஆகியவற்றைக் குறிக்கலாம். இந்த அரசவைக் சூழலில் தாய்க்குச் செலுத்திய மரியாதை தெளிவாக இருப்பதால், வழிபாடு என்ற கருத்தை இறையியல் ரீதியாகச் சேர்க்காமல் செயலைக் குறிப்பாகத் தருகிறது.
- issue: அரசரின் தாய்க்கான כִּסֵּא என்பதன் நிலை
  choice: அதையும் ‘அரியணை’ என மொழிபெயர்த்தல்
  alternative: ‘இருக்கை’ அல்லது ‘நாற்காலி’
  rationale: மூலத்தில் சாலொமோனின் அரியணைக்கும் அவரது தாயின் இருக்கைக்கும் ஒரே சொல் உள்ளது. அதனால் உரை வழங்கும் அரச மரியாதையைச் சுருக்காமல் ஒரே சொல்லைத் தக்கவைக்கிறது; இதிலிருந்து தனிப்பட்ட ஆட்சியதிகாரக் கோட்பாடு எதுவும் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதைப் பன்மை வினைமுற்றுகளுடன் இயல்பான அரசவை நடையில் மொழிபெயர்க்கப்பட்டது. நீண்ட எபிரெய இணைப்புத் தொடரை வாசிப்புக்கு ஏற்ற மூன்று வாக்கியங்களாகப் பிரித்தாலும், செயல்களின் வரிசை முழுமையாகக் காக்கப்பட்டது.
