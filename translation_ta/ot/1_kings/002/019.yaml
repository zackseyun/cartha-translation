  terminology: ‘அரியணை’ இரண்டு כִּסֵּא நிகழ்வுகளுக்கும் ஒரேபோல் பயன்படுத்தப்பட்டுள்ளது; இது மூலத்தின் சொல்லாட்சியை நன்றாகப் பிரதிபலிக்கிறது. ‘தலைவணங்கினார்’ அரசவையில் செலுத்தப்படும் உடல்சார் மரியாதையைத் தருகிறது; வழிபாட்டு விளக்கத்தைச் சேர்ப்பதில்லை. பெயர்கள் ஏற்கத்தக்க தமிழாக்கத்தில் உள்ளன.
