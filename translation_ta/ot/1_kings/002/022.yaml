base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/022.yaml
  text: King Solomon answered and said to his mother[a], “Why are you asking for Abishag the Shunammite for Adonijah? Ask for the kingship for him as well, since he is my older brother—and for him, for Abiathar the priest, and for Joab son of Zeruiah!”
translation:
  language: ta
  text: 'ராஜா சாலொமோன் தன் தாய்க்குப் பதிலளித்துச் சொன்னான்: “அதோனியாவுக்காகச் சூனேமைச் சேர்ந்த அபிஷாகை நீ ஏன் கேட்கிறாய்? அவனுக்காக அரசாட்சியையும்[a] கேள்; ஏனெனில் அவன் என்னைவிட மூத்த என் சகோதரன்—அவனுக்காகவும், ஆசாரியனான அபியத்தாருக்காகவும், செருயாவின் மகன் யோவாபுக்காகவும்!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அரசுரிமை” அல்லது “ராஜ்யம்.” எபிரெயச் சொல் அரச ஆட்சி, அரசுரிமை, அல்லது ராஜ்யத்தைக் குறிக்கலாம்; இங்கே அதோனியாவின் வேண்டுகோள் அரச வம்சம் சார்ந்த உட்பொருளைக் கொண்டதாகச் சாலொமோன் காட்டுகிறார்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: பதிலளித்துச் சொன்னான்
  rationale: எபிரெய உரையின் பதிலுரைக் கட்டமைப்பைத் தக்கவைத்தபடி தமிழில் இயல்பாக வழங்குகிறது.
- source_word: אֲבִישַׁג הַשֻּׁנַמִּית
  choice: சூனேமைச் சேர்ந்த அபிஷாக்
  rationale: இன/ஊர் அடையாளப் பெயரைத் தமிழில் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: וְשַׁאֲלִי לוֹ
  choice: அவனுக்காக ... கேள்
  rationale: கட்டளையையும் வேண்டுகோளின் பயனாளியையும் தக்கவைக்கிறது; சூழலிலுள்ள கிண்டலான வலிமையையும் விடாமல் வைத்திருக்கிறது.
- source_word: הַמְּלוּכָה
  choice: அரசுரிமை
  rationale: இங்கு நிலப்பரப்பைக் காட்டிலும் ஆட்சி செய்யும் அரச நிலை அல்லது உரிமையே கருத்தாக இருப்பதால் இந்தச் சொல் தேர்ந்தெடுக்கப்பட்டது; பிற சாத்தியங்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: אָחִי הַגָּדוֹל מִמֶּנִּי
  choice: என்னைவிட மூத்த என் சகோதரன்
  rationale: பிறப்பு வரிசைக்கான ஒப்பீட்டைத் துல்லியமாகவும் இயல்பான தமிழிலும் தருகிறது.
- source_word: וְלוֹ וּלְאֶבְיָתָר הַכֹּהֵן וּלְיוֹאָב בֶּן צְרוּיָה
  choice: —அவனுக்காகவும், ஆசாரியனான அபியத்தாருக்காகவும், செருயாவின் மகன் யோவாபுக்காகவும்!
  rationale: ‘கேள்’ என்ற வினை இறுதிப் பட்டியலில் விடுபட்டிருக்கும் எபிரெய மொழியின் திடீர், உணர்ச்சிமிக்க அமைப்பை கோடு மற்றும் இணை வடிவங்கள் மூலம் பாதுகாக்கிறது.
theological_decisions:
- issue: அபிஷாகைக் கேட்பதன் அரசியல் மற்றும் வம்ச உரிமை சார்ந்த உட்பொருள்
  choice: அபிஷாகைப் பற்றிய வேண்டுகோளை அரசுரிமைக்கான கோரிக்கையுடன் சாலொமோன் நேரடியாக இணைப்பதாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘ராஜ்யத்தையும் கேள்’ என்று பரந்த பொருளில் வழங்கி, அரசுரிமை சார்ந்த குறிப்பை மறைமுகமாக விடுதல்.
  rationale: הַמְּלוּכָה என்ற எபிரெயச் சொல்லை உரையே வெளிப்படையாகப் பயன்படுத்துகிறது. ‘அரசுரிமை’ என்பது அதோனியாவின் கோரிக்கையில் சாலொமோன் கண்ட அரச வம்சக் கோரிக்கையைத் தெளிவாக்குகிறது; அதேவேளை சொல்லின் பரந்த மாற்றுப் பொருள்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. பெயர்கள் வழக்கமான தமிழ் வேதாகம ஒலிப்பெயர்ப்பு மரபுக்கு ஏற்ப தரப்பட்டுள்ளன. இறுதிப் பகுதியின் எபிரெய நீள்வாக்கியமும் விடுபட்ட வினையும் அளிக்கும் திடீர் சினத் தொனி தேவையின்றி மென்மையாக்கப்படவில்லை.
