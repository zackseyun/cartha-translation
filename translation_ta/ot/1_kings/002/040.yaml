  text: וַ/יָּ֣קָם שִׁמְעִ֗י וַֽ/יַּחֲבֹשׁ֙ אֶת חֲמֹר֔/וֹ וַ/יֵּ֤לֶךְ גַּ֨תָ/ה֙ אֶל אָכִ֔ישׁ לְ/בַקֵּ֖שׁ אֶת עֲבָדָ֑י/ו וַ/יֵּ֣לֶךְ שִׁמְעִ֔י וַ/יָּבֵ֥א אֶת עֲבָדָ֖י/ו מִ/גַּֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/040.yaml
  text: Then Shimei arose[a], saddled his donkey, and went to Gath, to Achish, to look for his servants. Shimei went and brought his servants back from Gath.
translation:
  language: ta
  text: அப்போது சிமெயி எழுந்து, தன் கழுதைக்குச் சேணம் கட்டி, தன் அடிமைகளை[a]த் தேடுவதற்காகக் காத்துக்கு, ஆகீசிடம் சென்றான். சிமெயி சென்று, தன் அடிமைகளைக் காத்திலிருந்து அழைத்து வந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பணியாளர்களை.” எபிரெயச் சொல் பணியாளர்களையோ அடிமைகளையோ குறிக்கலாம்; இங்கு அவர்கள் தப்பிச் சென்றதையும் சிமெயி அவர்களை அழைத்து வந்ததையும் சூழல் காட்டுவதால், “அடிமைகள்” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: எழுந்து
  rationale: קום என்பதன் அடிப்படைப் பொருளான ‘எழுதல்’ என்பதையும் தொடர்ச்சியான எபிரெய கதைநடையையும் இயல்பான தமிழில் காக்கிறது.
- source_word: וַיַּחֲבֹשׁ אֶת חֲמֹרוֹ
  choice: தன் கழுதைக்குச் சேணம் கட்டி
  rationale: பயணச் சூழலில் חבש என்பது கழுதையைச் சவாரிக்காகச் சேணமிடுவதைக் குறிக்கிறது; இச்சொற்றொடர் தெளிவான, இயல்பான தமிழாக உள்ளது.
- source_word: גַּתָה
  choice: காத்துக்கு / காத்திலிருந்து
  rationale: இடப்பெயருடன் இணைந்த திசைச்சுட்டு ה, காத்தை நோக்கிய இயக்கத்தைக் காட்டுகிறது; இரண்டாம் இடத்தில் מִן புறப்படும் இடத்தைச் சுட்டுவதால் ‘காத்திலிருந்து’ என மொழிபெயர்க்கப்பட்டது.
- source_word: אָכִישׁ
  choice: ஆகீசு
  rationale: தனிப்பெயர் நவீனத் தமிழ் ஒலிபெயர்ப்பு மரபுக்கு ஏற்றவாறு ஒலிபெயர்க்கப்பட்டது; வேற்றுமை உருபுடன் ‘ஆகீசிடம்’ என வருகிறது.
- source_word: לְבַקֵּשׁ
  choice: தேடுவதற்காக
  rationale: בקש இங்கு காணாமல் சென்றவர்களைத் தேடும் திட்டமிட்ட செயலைக் குறிக்கிறது; ‘தேடுவதற்காக’ என்பது எளிய, துல்லியமான நவீனத் தமிழ்.
- source_word: עֲבָדָיו
  choice: தன் அடிமைகள்
  rationale: עבד என்பதற்கு ‘பணியாளர்’ அல்லது ‘அடிமை’ ஆகிய பொருள்கள் இருக்கலாம். இவர்கள் சிமெயியிடமிருந்து தப்பிச் சென்றதும் அவன் அவர்களை மீட்டுக் கொண்டுவருவதும் அவர்களுடைய கட்டுப்பட்ட அடிமை நிலையைக் குறிப்பதால், முதன்மை உரையில் ‘அடிமைகள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: וַיָּבֵא אֶת עֲבָדָיו מִגַּת
  choice: தன் அடிமைகளைக் காத்திலிருந்து அழைத்து வந்தான்
  rationale: Hiphil வடிவிலுள்ள בוא ‘அழைத்து வருதல்’ எனப் பொருள்படும். எபிரெயத்தில் தனியாக இல்லாத ‘திரும்ப’ என்ற சொல்லைச் சேர்க்காமல், தமிழில் வருகையைக் காட்டும் ‘அழைத்து வந்தான்’ பயன்படுத்தப்பட்டது.
