translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் மரியாதையான கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயத்தில் மீண்டும் வரும் ‘சிமெயி சென்று’ என்ற அமைப்பு நிகழ்வின் வரிசையைப் பாதுகாக்க வைக்கப்பட்டுள்ளது. ‘காத்திலிருந்த ஆகீசிடம்’ என்பது இலக்கு இடத்தையும் நபரையும் தமிழில் இயல்பாக இணைக்கிறது.
