base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/038.yaml
  text: Shimei said to the king[a], “The word is good. Just as my lord the king has spoken, so your servant will do.” And Shimei lived in Jerusalem many days.
translation:
  language: ta
  text: சிமெயி அரசனிடம், “நீர் சொன்னது நல்லது.[a] என் ஆண்டவராகிய அரசர் சொன்னபடியே உமது அடியவனான நான் செய்வேன்” என்றான். பின்பு சிமெயி எருசலேமில் பல நாட்கள் வாழ்ந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இந்தச் சொல் நல்லது” அல்லது “இந்தக் காரியம் நல்லது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב הַדָּבָר
  choice: நீர் சொன்னது நல்லது
  rationale: דָּבָר என்பதற்கு ‘சொல்,’ ‘காரியம்,’ ‘விஷயம்’ ஆகிய பொருள்கள் உண்டு. இங்கு சிமெயி அரசரின் கட்டளைக்குப் பதிலளிப்பதால், நவீன தமிழில் இயல்பாகவும் நேரடியாகவும் ‘நீர் சொன்னது நல்லது’ என்று மொழிபெயர்க்கப்பட்டுள்ளது; மூலத்தின் பிற சாத்தியங்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: என் ஆண்டவராகிய அரசர்
  rationale: அரசவையில் மரியாதையுடன் பயன்படுத்தப்படும் ‘என் ஆண்டவர்’ என்ற அழைப்பையும் ‘அரசர்’ என்ற பட்டத்தையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: כֵּן יַעֲשֶׂה עַבְדֶּךָ
  choice: உமது அடியவன் செய்வேன்
  rationale: ‘உமது அடியவன்’ என்பது அரசருக்கு முன் பணிவாகத் தன்னைக் குறிப்பிடும் வழக்குச் சொல்; அடிமைப்பட்ட நிலையைத் தேவையின்றி வலியுறுத்தாது. சூழலில் יַעֲשֶׂה எதிர்கால உறுதிமொழியைக் குறிக்கிறது.
- source_word: וַיֵּשֶׁב
  choice: வாழ்ந்தான்
  rationale: יָשַׁב என்பதன் குடியிருப்பு சார்ந்த பொருள் இங்கு ‘வாழ்தல்’; இது நவீன தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: יָמִים רַבִּים
  choice: பல நாட்கள்
  rationale: கால அளவைத் துல்லியமாகக் குறிப்பிடாமல் நீண்ட காலத்தைக் குறிக்கும் எபிரெய மொழிநடையை நேரடியாகப் பாதுகாக்கிறது.
- source_word: שִׁמְעִי
  choice: சிமெயி
  rationale: தனிப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: בִּירוּשָׁלִַם
  choice: எருசலேமில்
  rationale: இடப்பெயரின் வழக்கமான தமிழ் வடிவத்துடன் எபிரெய முன்னிடைச்சொல்லின் பொருள் ‘-இல்’ எனத் தரப்பட்டுள்ளது.
