translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் மரியாதையுடனும் அமைக்கப்பட்டுள்ளது. ‘ஏறிச் சென்று’ என்பது மூல வினையின் இடவியல் நுணுக்கத்தைப் பேணுகிறது; ‘தாக்கி, கொன்றுபோட்டான்’ என்பது எபிரெயத்தில் உள்ள இரண்டு செயல்களையும் ஒன்றாக்காமல் வைத்திருக்கிறது. ‘தன் வீட்டில்’ என்ற மூலத்தின் ambiguity குறிப்பின் மூலம் பாதுகாக்கப்படுகிறது.
