base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/034.yaml
  text: Then Benaiah son of Jehoiada went up[a], struck him down, and put him to death[b]; and he was buried at his house in the wilderness.
translation:
  language: ta
  text: பின்பு யோய்தாவின் மகன் பெனாயா ஏறிச் சென்று, அவனைத் தாக்கி[a], கொன்றான்; அவன் வனாந்தரத்தில் இருந்த தன் வீட்டில்[b] அடக்கம் செய்யப்பட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தாக்கி” என மொழிபெயர்க்கப்பட்ட எபிரெயச் சொல், “எதிர்கொண்டு” அல்லது “அவன்மேல் பாய்ந்து” என்றும் பொருள்படலாம். தாக்குதலையும் கொலையையும் எபிரெயம் இரண்டு தனித்தனி வினைகளால் கூறுகிறது.
    reason: lexical_alternative
  - marker: b
    text: “தன் வீட்டில்” என்பது, வனாந்தரத்தில் இருந்த அவனுடைய குடும்பச் சொத்தில் அல்லது குடியிருப்புப் பகுதியில் அடக்கம் செய்யப்பட்டதையும் குறிக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַל
  choice: ஏறிச் சென்று
  rationale: עלה என்பதன் அடிப்படைப் பொருளான ‘மேலே போதல்/ஏறிச் செல்லுதல்’ என்பதைக் காக்கிறது; சூழலில் அரச கட்டளையை நிறைவேற்றச் சென்றதையும் இயல்பாக உணர்த்துகிறது.
- source_word: וַיִּפְגַּע בּוֹ
  choice: அவனைத் தாக்கி
  rationale: פגע + ב hostile encounter அல்லது தாக்குதலைக் குறிக்கலாம். அடுத்ததாக வரும் கொலை வினையுடன் இதை ஒன்றாக்காமல், தாக்குதலைத் தனிச் செயலாகக் காட்டுகிறது.
- source_word: וַיְמִתֵהוּ
  choice: கொன்றுபோட்டான்
  rationale: מות என்பதன் ஹிஃபில் வடிவிலுள்ள ‘சாகச் செய்தல்’ என்ற causative பொருளை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது; முந்தைய தாக்குதல் வினையிலிருந்து கொலையைத் தனியாக வைக்கிறது.
- source_word: וַיִּקָּבֵר
  choice: அடக்கம் செய்யப்பட்டான்
  rationale: நிஃபால் வடிவின் செயப்பாட்டு பொருளைத் தெளிவாகப் பேணுகிறது; செய்பவர் பெனாயாவிலிருந்து அடக்கம் செய்யப்பட்ட யோவாபுக்கு மாறுவதை உணர்த்துகிறது.
- source_word: בְּבֵיתוֹ
  choice: தன் வீட்டில்
  rationale: בית என்பதன் நேரடிப் பொருளான ‘வீடு’ என்பதைக் காக்கிறது. இங்கு அது வீட்டுக் கட்டடத்தை மட்டுமல்லாமல் குடும்பச் சொத்து அல்லது குடியிருப்புப் பகுதியையும் குறிக்கக்கூடும் என்பதால் குறிப்பில் அந்த விரிவு தரப்படுகிறது.
- source_word: בַּמִּדְבָּר
  choice: வனாந்தரத்தில்
  rationale: מדבר குறிக்கும் குடியிருப்புகள் குறைந்த வறண்ட அல்லது திறந்த நிலப்பகுதியை மிகையாகக் குறிப்பாக்காமல், மரியாதையான வழக்குத் தமிழில் தருகிறது.
