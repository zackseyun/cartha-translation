  yaml_path: translation/ot/1_kings/002/014.yaml
  text: Then he said[a], “I have something to say to you.” And she said, “Speak.”
translation:
  language: ta
  text: அப்போது அவன் அவளிடம், “உன்னிடம் சொல்ல எனக்கு ஒரு காரியம் இருக்கிறது[a]” என்றான். அதற்கு அவள், “சொல்” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் சொல்லுக்குச் சொல், ‘எனக்கு உன்னிடம் ஒரு வார்த்தை/காரியம் இருக்கிறது.’ இந்த மரபுத்தொடரின் பொருள், ‘உன்னிடம் சொல்ல எனக்கு ஒரு காரியம் இருக்கிறது.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது அவன் ... என்றான்
  rationale: வழக்குரையைத் தொடர்ந்து வரும் wayyiqtol வடிவம் அடுத்த நிகழ்வை அறிமுகப்படுத்துகிறது; ‘அப்போது’ என்பது தொடர்ச்சியை இயல்பான தமிழில் காட்டுகிறது.
- source_word: דָּבָר לִי אֵלָיִךְ
  choice: உன்னிடம் ஒரு காரியம் சொல்ல வேண்டும்
  rationale: சொல்லுக்குச் சொல் பார்த்தால் ‘என்னிடத்தில் உன்னிடம் ஒரு சொல்/காரியம் உள்ளது’ என்ற அமைப்பு. தமிழில் உரையாடலுக்கேற்ற இயல்பான இணை ‘உன்னிடம் ஒரு காரியம் சொல்ல வேண்டும்’; இது தனிப்பட்ட நோக்கத்தையும் சொல்ல வேண்டிய விஷயம் இருப்பதையும் காக்கிறது.
- source_word: וַתֹּאמֶר
  choice: அதற்கு அவள் ... என்றாள்
  rationale: பெண் ஒருவரின் உடனடியான பதிலைத் தொடரும் narrative wayyiqtol; ‘அதற்கு’ தமிழில் பதிலுரையின் தொடர்பைத் தெளிவாக்குகிறது.
- source_word: דַּבֵּר
  choice: சொல்
  rationale: דבר என்ற வினையின் ஆண்பால் ஒருமை கட்டளை வடிவம். இச்சூழலில் சுருக்கமான தமிழ் கட்டளை ‘சொல்’ இயல்பாகவும் நேர்மையாகவும் உள்ளது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான ஆனால் இயல்பான உரையாடல் நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மொழியின் பாலினக் குறியீடுகளுக்கு ஏற்ப ‘அவன்/அவள்’ மற்றும் ‘என்றான்/என்றாள்’ அமைப்புகள் காக்கப்பட்டுள்ளன.
