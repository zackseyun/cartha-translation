    issue: The main rendering uses “சொல்ல வேண்டும்.”
    rationale: This may convey necessity or obligation beyond the Hebrew idiom. “எனக்கு ... ஒரு காரியம் இருக்கிறது” better reflects the Hebrew’s possession/intention idiom.
  - severity: low
