  text: וְ/גַ֣ם אַתָּ֣ה יָדַ֡עְתָּ אֵת֩ אֲשֶׁר עָ֨שָׂה לִ֜/י יוֹאָ֣ב בֶּן צְרוּיָ֗ה אֲשֶׁ֣ר עָשָׂ֣ה לִ/שְׁנֵֽי שָׂרֵ֣י צִבְא֣וֹת יִ֠שְׂרָאֵל לְ/אַבְנֵ֨ר בֶּן נֵ֜ר וְ/לַ/עֲמָשָׂ֤א בֶן יֶ֨תֶר֙ וַ/יַּ֣הַרְגֵ֔/ם וַ/יָּ֥שֶׂם דְּמֵֽי מִלְחָמָ֖ה בְּ/שָׁלֹ֑ם וַ/יִּתֵּ֞ן דְּמֵ֣י מִלְחָמָ֗ה בַּ/חֲגֹֽרָת/וֹ֙ אֲשֶׁ֣ר בְּ/מָתְנָ֔י/ו וּֽ/בְ/נַעֲל֖/וֹ אֲשֶׁ֥ר בְּ/רַגְלָֽי/ו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/005.yaml
  text: 'And you also know what Joab son of Zeruiah did to me[a], what he did to the two commanders of the armies of Israel, to Abner son of Ner and to Amasa son of Jether: he killed them and put the blood of war in peace[b], and put the blood of war on the belt that was around his waist and on the sandals that were on his feet.'
translation:
  language: ta
  text: மேலும், செருயாவின் மகன் யோவாப் எனக்கு என்ன செய்தான் என்பதையும், இஸ்ரவேலின் படைகளின் இரு தளபதிகளான நேரின் மகன் அப்னேருக்கும் ஏத்தேரின் மகன் அமாசாவுக்கும் அவன் என்ன செய்தான் என்பதையும் நீயும் அறிந்திருக்கிறாய். அவன் அவர்களைக் கொன்று, சமாதானக் காலத்தில் போரின் இரத்தத்தைச் சிந்தினான்[a]; போரின் இரத்தத்தைத் தன் இடுப்பில் இருந்த கச்சையிலும் தன் கால்களில் இருந்த காலணிகளிலும் படியச் செய்தான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதை இன்னும் சொல்லுக்குச் சொல்லாக, “சமாதானத்தில் போரின் இரத்தத்தை வைத்தான்” என்றும் மொழிபெயர்க்கலாம். போர் நடைபெறாத சமாதானக் காலத்தில் யோவாப் போர்க்கால இரத்தச்செயலைச் செய்தான் என்பது இதன் பொருள்.
    reason: lexical_alternative
  - marker: b
    text: யோவாபின் கச்சையிலும் காலணிகளிலும் இரத்தம் படிந்திருக்கும் இந்தக் காட்சி, இக்கொலைகளுக்கான இரத்தப்பழி அவனைப் பற்றியிருந்ததைச் சுட்டிக்காட்டலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: וְגַם אַתָּה יָדַעְתָּ
  choice: மேலும் ... நீ அறிவாய்
  rationale: இணைப்பையும் வலியுறுத்தப்பட்ட நேரடி அழைப்பையும் இயல்பான நவீனத் தமிழில் தருகிறது; நிறைவேற்றுக் கால வினை இங்கு தொடரும் அறிவுநிலையைக் குறிக்கிறது.
- source_word: אֵת אֲשֶׁר עָשָׂה לִי
  choice: எனக்கு என்ன செய்தான் என்பதை
  rationale: לִי என்பதன் பாதகப் பொருளைத் தீர்மானமாக விரிவாக்காமல், எபிரெயச் சொல்லமைப்பின் ‘எனக்கு’ என்ற உறவைக் காக்கிறது.
- source_word: לִשְׁנֵי שָׂרֵי צִבְאוֹת יִשְׂרָאֵל
  choice: இஸ்ரவேலின் படைகளுடைய இரண்டு தளபதிகளான
  rationale: שָׂרֵי என்பதை இராணுவத் தலைவர்களாகவும் צִבְאוֹת என்ற பன்மையை ‘படைகள்’ என்றும் பிரதிபலிக்கிறது.
- source_word: וַיַּהַרְגֵם
  choice: அவன் அவர்களைக் கொன்று
  rationale: வினையின் நேரடியான வன்முறையையும் பன்மை பொருள் பின்னொட்டையும் தெளிவாகக் காக்கிறது.
- source_word: וַיָּשֶׂם דְּמֵי מִלְחָמָה בְּשָׁלֹם
  choice: சமாதானக் காலத்தில் போரின் இரத்தத்தைச் சிந்தினான்
  rationale: சொல்லுக்குச் சொல் ‘வைத்தான்’ என்பது தமிழில் தெளிவற்றதாகும்; போர் நிலைக்குரிய இரத்தப்பழியை அமைதியான சூழலில் நிகழ்த்தினான் என்ற எதிர்மறை இணைப்பை இயல்பாக வெளிப்படுத்துகிறது. அடிக்குறிப்பு நேரடி உருவகத்தைத் தருகிறது.
- source_word: וַיִּתֵּן דְּמֵי מִלְחָמָה בַּחֲגֹרָתוֹ ... וּבְנַעֲלוֹ
  choice: போரின் இரத்தத்தைத் தன் ... வார்ப்பட்டையிலும் ... காலணிகளிலும் படியச் செய்தான்
  rationale: இரத்தம் அவனுடைய அணிகலன்களில் படிந்திருக்கும் காட்சியை இயல்பான தமிழில் பாதுகாக்கிறது; חֲגוֹרָה என்பதற்கு ‘வார்ப்பட்டை’ சூழலுக்கு ஏற்றது.
theological_decisions:
- issue: ‘போரின் இரத்தத்தைச் சமாதானத்தில் வைத்தான்’ என்ற உருவகத்தின் பொருள்
  choice: சமாதானக் காலத்தில் போரின் இரத்தத்தைச் சிந்தினான்
  alternative: சமாதானத்தில் போரின் இரத்தத்தை வைத்தான்
  rationale: யோவாப் போர் நடைபெறாத சூழலில் போர்க்காலக் கொலையைச் செய்தான் என்ற முரண்பாட்டைத் தெளிவாக்குகிறது; அதேவேளை நேரடி எபிரெய உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: வார்ப்பட்டையிலும் காலணிகளிலும் இரத்தம் இருப்பதன் குறிப்பு
  choice: காட்சியை மொழிபெயர்ப்பில் அப்படியே வைத்தல்
  alternative: அதை வெளிப்படையாக ‘இரத்தப்பழி அவனைச் சார்ந்தது’ என்று விளக்குதல்
  rationale: மூல உரை தரும் உறுதியான காட்சியைத் தாண்டி அதன் குறியீட்டுப் பொருளை முதன்மை உரையில் தீர்மானிக்காமல் இருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் உரையின் கடுமையும் காக்கப்பட்டுள்ளன. பெயர்கள் தமிழ் வேதாகமப் பயன்பாட்டுக்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டுள்ளன. ‘சமாதானக் காலம்’, ‘தளபதி’, ‘வார்ப்பட்டை’ போன்ற சொற்கள் சாதாரண வாசகர்களுக்குப் புரியுமாறும் மூல இராணுவ மற்றும் உருவகச் சூழலைக் காக்குமாறும் தேர்ந்தெடுக்கப்பட்டன.
