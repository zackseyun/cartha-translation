  text: וְ/הַ/מֶּ֥לֶךְ שְׁלֹמֹ֖ה בָּר֑וּךְ וְ/כִסֵּ֣א דָוִ֗ד יִהְיֶ֥ה נָכ֛וֹן לִ/פְנֵ֥י יְהוָ֖ה עַד עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/045.yaml
  text: But King Solomon will be blessed[a], and the throne of David will be established before Yahweh forever.
translation:
  language: ta
  text: ஆனால் அரசர் சாலொமோன் ஆசீர்வதிக்கப்படுவார்[a]; தாவீதின் அரியணை யாவேவின் முன்னிலையில் என்றென்றும் உறுதியாக நிலைநிற்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அரசர் சாலொமோன் ஆசீர்வதிக்கப்பட்டவர்.” எபிரேயப் பெயரெச்சக் கூற்றை நிகழ்கால அறிவிப்பாகவும் வாசிக்கலாம்; எனினும், சூழல் முதன்மை உரையில் உள்ள எதிர்கால நோக்கையும் ஆதரிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַ/מֶּלֶךְ
  choice: ஆனால் … அரசர்
  rationale: וְ என்பதன் அடிப்படைப் பொருள் ‘மற்றும்’ என்றாலும், முந்தைய வசனத்தில் சிமெய்மீது வரும் தண்டனைக்கும் இங்கே சாலொமோனுக்குக் கூறப்படும் ஆசீர்வாதத்திற்கும் இடையிலான முரண்பாட்டைச் சூழல் காட்டுவதால் ‘ஆனால்’ இயல்பானது. מֶלֶךְ என்பதற்கு மரியாதையும் நவீனத் தமிழின் இயல்பும் கொண்ட ‘அரசர்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: שְׁלֹמֹה
  choice: சாலொமோன்
  rationale: எபிரேயப் பெயருக்கான தமிழில் பரவலாக அறியப்பட்ட வடிவம்.
- source_word: בָּרוּךְ
  choice: ஆசீர்வதிக்கப்பட்டிருப்பார்
  rationale: இச்சொல் ‘ஆசீர்வதிக்கப்பட்டவர்’ என்ற பெயரெச்சப் பொருளைக் கொண்டது. அடுத்துள்ள எதிர்கால வினையுடன் இணையும் அரச அறிவிப்புச் சூழலைக் கருத்தில் கொண்டு எதிர்கால நோக்கு முதன்மை உரையில் வெளிப்படுத்தப்பட்டுள்ளது; நிகழ்கால வாசிப்பும் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: וְ/כִסֵּא דָוִד
  choice: தாவீதின் அரியணை
  rationale: כִסֵּא என்பது அரசரின் ‘அரியணை’; தாவீதுடன் உள்ள construct உறவு தமிழில் உரிமை வேற்றுமையால் இயல்பாகத் தரப்பட்டுள்ளது. வாக்கிய இணைப்பு தமிழில் அரைப்புள்ளியால் தெளிவாகிறது.
- source_word: יִהְיֶה נָכוֹן
  choice: உறுதியாக நிலைநிற்கும்
  rationale: היה + נכון என்ற கூட்டமைப்பு நிறுவப்பட்டு உறுதியாக இருப்பதையோ நிலைத்திருப்பதையோ குறிக்கிறது. ‘உறுதியாக நிலைநிற்கும்’ என்பது அரியணை மற்றும் அரச வம்சச் சூழலுக்கு இயல்பாக இருந்து, அந்த நிலைத்தன்மையை வெளிப்படுத்துகிறது.
- source_word: לִ/פְנֵי יְהוָה
  choice: யாவே முன்னிலையில்
  rationale: לִפְנֵי என்பது ‘முன்பாக’ அல்லது ‘முன்னிலையில்’ என்று பொருள்படும். ‘முன்னிலையில்’ என்பது தேவனுடைய சந்நிதியையும் அங்கீகாரத்தையும் மிகைப்படுத்தாமல் இயல்பாக வெளிப்படுத்துகிறது; יְהוָה என்பது ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: עַד עוֹלָם
  choice: என்றென்றும்
  rationale: காலவரையற்ற நிலைத்தன்மையைத் தெரிவிக்கும் இச்சொற்றொடருக்கு தெளிவான, வழக்கமான தமிழ் இணை.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயரான நான்கெழுத்துப் பெயர் நேரடியாக உள்ளது. அதை பொதுப் பட்டமாக மாற்றாமல், தமிழில் தெளிவான ஒலிபெயர்ப்பாக ‘யாவே’ பயன்படுத்தப்பட்டுள்ளது.
- issue: בָּרוּךְ என்பதன் காலநிலை
  choice: எதிர்கால நோக்குடைய ‘ஆசீர்வதிக்கப்பட்டிருப்பார்’
  alternative: நிகழ்கால அறிவிப்பான ‘ஆசீர்வதிக்கப்பட்டவர்’
  rationale: எபிரேய மொழியில் இது வினையில்லா பெயரெச்சக் கூற்று என்பதால் நிகழ்காலமாகவும் புரிந்துகொள்ளலாம். ஆயினும், அடுத்துள்ள ‘நிலைநிற்கும்’ என்ற எதிர்காலக் கூற்றும் சாலொமோனின் நீதித் தீர்ப்பு அறிவிப்பும் எதிர்கால நோக்கை ஆதரிக்கின்றன. உண்மையான இலக்கணத் தெளிவின்மை அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- issue: தாவீதின் அரியணை நிலைநிறுத்தப்படுதல்
  choice: ‘உறுதியாக நிலைநிற்கும்’ என்று வம்ச ஆட்சியின் நிலைத்தன்மையைத் திறந்த நிலையில் வைத்தல்
  alternative: ஒரு குறிப்பிட்ட பிற்கால அரசர் அல்லது நிறைவேற்றத்தைக் குறிப்பதாக விரிவாக்குதல்
  rationale: வசனம் அரியணை யாவே முன்னிலையில் நிலைத்திருப்பதாகக் கூறுகிறது; அது எவ்வாறு நிறைவேறும் என்பதை இங்கே விளக்கவில்லை. ஆகவே எந்த ஒரு தனிப்பட்ட சமய விளக்கத்தையும் உரைக்குள் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிதில் புரியும், அதேவேளை அரச அறிவிப்புக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘அரசர்’, ‘அரியணை’, ‘முன்னிலையில்’, ‘என்றென்றும்’ ஆகிய சொற்கள் இயல்பான உயர்நடையைத் தருகின்றன; தேவையற்ற சமய மரபுச் சொற்களும் விளக்க விரிவாக்கங்களும் தவிர்க்கப்பட்டுள்ளன.
