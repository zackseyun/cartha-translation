base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/013.yaml
  text: Then Adonijah son of Haggith came to Bathsheba[a], the mother of Solomon, and she said, “Do you come in peace?” And he said, “In peace.”
translation:
  language: ta
  text: அப்போது ஆகீத்தின் மகன் அதோனியா, சாலொமோனின் தாயான பத்சேபாளிடம் வந்தான். அவள் அவனிடம், “நீ சமாதானமாக[a] வருகிறாயா?” என்று கேட்டாள். அவன், “சமாதானமாக,” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இன்னும் சொல்லுக்கு சொல், “உன் வருகை சமாதானமானதா?”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: வந்தான்
  rationale: בוא என்பது பார்வைநிலைக்கேற்ப ‘வருதல்’ அல்லது ‘செல்லுதல்’ எனப் பொருள்படும்; பத்சேபாளை நோக்கிய கதைப்பார்வையில் ‘வந்தான்’ இயல்பானது.
- source_word: אֲדֹנִיָּהוּ
  choice: அதோனியா
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் இயல்பாக எழுத்துப்பெயர்த்த வடிவம்.
- source_word: בֶן חַגִּית
  choice: ஆகீத்தின் மகன்
  rationale: தாயின் பெயரால் அதோனியாவை அடையாளப்படுத்தும் எபிரெய உறவுநிலைக் கட்டமைப்பைத் தெளிவாகப் பேணுகிறது.
- source_word: בַּת שֶׁבַע
  choice: பத்சேபாள்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் அறிமுகமான தனிப்பெயர் வடிவம்.
- source_word: אֵם שְׁלֹמֹה
  choice: சாலொமோனின் தாயான
  rationale: பத்சேபாளைச் சாலொமோனுடனான அரச குடும்ப உறவால் அடையாளப்படுத்தும் இடைச்சொல் தொடரை இயல்பான தமிழில் தருகிறது.
- source_word: הֲשָׁלוֹם בֹּאֶךָ
  choice: நீ சமாதான நோக்கத்துடன்தான் வருகிறாயா?
  rationale: சொல்லுக்குச் சொல் ‘உன் வருகை சமாதானமா?’ என்றாலும், இச்சூழலில் שָׁלוֹם வருகையின் அமைதியான அல்லது தீங்கற்ற நோக்கத்தைக் கேட்கிறது; ‘நோக்கத்துடன்’ என்பது அந்த எபிரெய மரபுத்தொடரின் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: שָׁלוֹם
  choice: சமாதான நோக்கத்துடன்தான்
  rationale: அதோனியாவின் சுருக்கமான பதில் பத்சேபாளின் கேள்விச் சொல்லையே எதிரொலிக்கிறது; தமிழிலும் அதே பொருளைச் சுருக்கமாகப் பேணுகிறது.
