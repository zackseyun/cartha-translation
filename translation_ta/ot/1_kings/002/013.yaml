translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமானவும் எளிதில் புரியக்கூடியவும் உரைநடை பயன்படுத்தப்பட்டுள்ளது. சந்தேகம் கலந்த கேள்வியும் அதோனியாவின் சுருக்கமான பதிலும் பேணப்பட்டுள்ளன. மூலத்தில் வெளிப்படையான வேறுபாட்டு வாசகம் இல்லாததால் அடிக்குறிப்பு சேர்க்கப்படவில்லை.
