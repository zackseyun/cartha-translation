  text: וַ/יֹּ֧אמֶר ל֣/וֹ הַ/מֶּ֗לֶךְ עֲשֵׂה֙ כַּ/אֲשֶׁ֣ר דִּבֶּ֔ר וּ/פְגַע בּ֖/וֹ וּ/קְבַרְתּ֑/וֹ וַ/הֲסִירֹ֣תָ דְּמֵ֣י חִנָּ֗ם אֲשֶׁר֙ שָׁפַ֣ךְ יוֹאָ֔ב מֵ/עָלַ֕/י וּ/מֵ/עַ֖ל בֵּ֥ית אָבִֽ/י־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/031.yaml
  text: Then the king said to him[a], “Do as he has said, and strike him down and bury him[b], and remove from me and from my father’s house the innocent blood that Joab shed.”
translation:
  language: ta
  text: அப்போது அரசன் அவனிடம், “அவன் சொன்னபடியே செய்; அவனைக் கொன்று[a] அடக்கம் செய். யோவாப் நியாயமின்றிச் சிந்திய இரத்தத்தை[b] என்மேலிருந்தும் என் தந்தையின் வீட்டின்மேலிருந்தும் அகற்று” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், “அவன்மேல் பாய்ந்து தாக்கு.” இச்சூழலில் இந்த எபிரெய மரபுத்தொடர் அவனைக் கொல்வதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “நியாயமின்றிச் சிந்திய இரத்தம்” என்பது நியாயமான காரணமின்றி நிகழ்த்தப்பட்ட கொலையையும் அதனால் உண்டாகும் இரத்தப்பழியையும் குறிக்கும் எபிரெய சட்ட-அறநெறிச் சொல்லாட்சி.
    reason: cultural_note
lexical_decisions:
- source_word: עֲשֵׂה כַּאֲשֶׁר דִּבֶּר
  choice: அவன் சொன்னபடியே செய்
  rationale: முந்தைய பேச்சில் கூறப்பட்டதை நிறைவேற்றும்படி இடப்படும் நேரடியான கட்டளையை இயல்பான தமிழில் தருகிறது.
- source_word: וּפְגַע בּוֹ
  choice: அவனை வெட்டிக் கொன்று
  rationale: פגע ב என்ற எபிரெய மரபுத்தொடர் இச்சூழலில் தாக்கிக் கொல்வதைக் குறிக்கிறது; மரணதண்டனை நிறைவேற்றப்படுவதைத் தெளிவாகவும் நேரடியாகவும் தெரிவிக்கிறது.
- source_word: וּקְבַרְתּוֹ
  choice: அடக்கம் செய்
  rationale: கொல்லப்பட்டவனைப் புதைக்க வேண்டும் என்ற அடுத்த கட்டளையை நவீனத் தமிழில் கண்ணியமாகத் தருகிறது.
- source_word: וַהֲסִירֹתָ
  choice: அகற்று
  rationale: முன்னுள்ள கட்டளைகளுடன் இணைந்த தொடர்ச்சியான கட்டளையாக எபிரெய வடிவத்தை நேரடியாகப் பிரதிபலிக்கிறது; அதேவேளையில் அவற்றின் விளைவையும் சூழல் உணர்த்துகிறது.
- source_word: דְּמֵי חִנָּם
  choice: குற்றமற்றவர்களின் இரத்தம்
  rationale: நியாயமான காரணமின்றிக் கொல்லப்பட்டவர்களின் இரத்தத்தையும் அதனால் ஏற்படும் பழியையும் குறிக்கும் சட்ட-அறநெறி சார்ந்த எபிரெய சொல்லாட்சியைத் தமிழில் இயல்பாகத் தக்கவைக்கிறது.
- source_word: מֵעָלַי וּמֵעַל בֵּית אָבִי
  choice: என்னிடமிருந்தும் என் தந்தையின் வீட்டிலிருந்தும்
  rationale: இரத்தப்பழி ஒருவர்மீதும் அவரது அரசகுடியின்மீதும் இருப்பதாகக் காட்டும் மூலமொழியின் உருவகத்தை அதிக விளக்கமின்றித் தக்கவைக்கிறது.
theological_decisions:
- issue: யோவாபின் அநியாயக் கொலைகளுக்கான இரத்தப்பழியும் அரச வீட்டின் பொறுப்பும்
  choice: குற்றமற்றவர்களின் இரத்தத்தை அரசனிடமிருந்தும் அவன் தந்தையின் வீட்டிலிருந்தும் அகற்றுதல்
  alternative: ‘இரத்தப்பழியை நீக்குதல்’ என்று கருத்தை வெளிப்படையாக மொழிபெயர்த்தல்
  rationale: மூல எபிரெயம் ‘இரத்தப்பழி’ என்ற கருத்துப் பெயரைப் பயன்படுத்தாமல், குற்றமற்ற இரத்தம் மனிதர்கள்மீதும் வீட்டின்மீதும் இருப்பதாக உருவகமாகக் கூறுகிறது. அந்தச் சட்ட-இறையியல் அழுத்தத்தையும் தெளிவின்மையையும் மொழிபெயர்ப்பு தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் நேரடியான அரச கட்டளைத் தொனி பயன்படுத்தப்பட்டுள்ளது. ‘அரசன்’, ‘அடக்கம் செய்’, ‘தந்தையின் வீடு’ ஆகியவை கண்ணியமான வேதாகம நடையைத் தக்கவைத்தபடியே பொதுவாசகருக்குப் புரியும் வகையில் உள்ளன. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்றொடர்களுக்குப் பின்னரே வைக்கப்பட்டுள்ளன.
