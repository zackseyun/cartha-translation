translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையான ஆனால் கண்ணியமான வரலாற்றுக் கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மூலத்தின் தொடர்ச்சியான செயல்கள் தனித்தனியாக வைக்கப்பட்டுள்ளன; சுட்டுப்பெயர் குழப்பத்தைத் தவிர்க்க அதோனியாவின் பெயர் வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது.
