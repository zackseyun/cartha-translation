  yaml_path: translation/ot/1_kings/002/025.yaml
  text: So King Solomon sent Benaiah son of Jehoiada[a], and he struck him down, and he died.
translation:
  language: ta
  text: அப்போது சாலொமோன் அரசன் யெகோயாதாவின் மகன் பெனாயாவை அனுப்பினான்.[a] அவன் அதோனியாவைத் தாக்கினான்; அதோனியா இறந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்கு சொல், “யெகோயாதாவின் மகன் பெனாயாவின் கையால் அனுப்பினான்.” இது பெனாயாவைத் தன் சார்பில் செயல்படும் நபராக அனுப்பினான் என்பதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: அனுப்பினான்
  rationale: שׁלח என்பதன் இயல்பான கதைநடைப் பொருள் ‘அனுப்பினான்’; மரணதண்டனையை நிறைவேற்ற அனுப்பிய சூழலை அடுத்த வாக்கியம் தெளிவாக்குகிறது.
- source_word: הַמֶּלֶךְ שְׁלֹמֹה
  choice: சாலொமோன் அரசன்
  rationale: அரச பட்டத்தையும் பெயரையும் நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் வழங்குகிறது.
- source_word: בְּיַד
  choice: பெனாயாவை அனுப்பினான்
  rationale: சொல்லுக்கு சொல் ‘பெனாயாவின் கையால்’ என்றாலும், இங்கு בְּיַד முகவர் வழியாகச் செயலை நிறைவேற்றுவதைக் குறிக்கும் மரபுத்தொடர். தமிழில் நேரடி செயப்படுபொருள் அமைப்பு இயல்பானது; நேரடியான வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בְּנָיָהוּ בֶן יְהוֹיָדָע
  choice: யெகோயாதாவின் மகன் பெனாயா
  rationale: தந்தை–மகன் உறவைத் தெளிவாகக் காட்டும் இயல்பான தமிழ்ப் பெயரமைப்பு.
- source_word: וַיִּפְגַּע בּוֹ
  choice: அவன் அதோனியாவை வெட்டி வீழ்த்தினான்
  rationale: פגע ב hostile encounter or striking என்பதைக் குறிக்கிறது. மரணத்தை அடுத்த கூறு தனியாகச் சொல்வதால் ‘கொன்றான்’ என்று ஒன்றிணைக்காமல், உயிர்க்கொல்லும் தாக்குதலை ‘வெட்டி வீழ்த்தினான்’ என வழங்குகிறது. தமிழில் சுட்டுப்பெயர் குழப்பம் தவிர்க்க ‘அதோனியாவை’ என முந்தைய சூழலின் நபர் வெளிப்படையாகக் குறிப்பிடப்படுகிறார்.
- source_word: וַיָּמֹת
  choice: அதோனியா இறந்தான்
  rationale: எபிரெயக் கதைத் தொடரில் மரணம் தனிக் கூறாக இருப்பதைப் பாதுகாக்கிறது; தமிழில் ‘அவன்’ யாரைக் குறிக்கிறது என்ற குழப்பத்தைத் தவிர்க்க பெயர் மீண்டும் தரப்படுகிறது.
