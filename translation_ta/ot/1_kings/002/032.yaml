  choice: அவனுடைய இரத்தப்பழியை அவன் தலையின்மேலேயே
  rationale: இது சிந்தப்பட்ட இரத்தத்திற்கான குற்றப்பொறுப்பு குற்றவாளியையே வந்தடைவதைக் குறிக்கும் எபிரேய மரபுத்தொடர். ‘இரத்தப்பழி’ பொருளைத் தெளிவாக்குகிறது; ‘தலையின்மேல்’ மூல உருவகத்தைக் காக்கிறது.
