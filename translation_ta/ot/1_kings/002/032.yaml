theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே / கர்த்தர்
  rationale: மூலத்தில் பட்டம் அல்ல, நான்கு எழுத்துகளைக் கொண்ட தனிப்பெயர் வருகிறது. தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பு மூலம் அதைத் தனிப்பெயராகவே காக்கிறது.
- issue: தலையின்மேல் இரத்தம் திரும்பும் மரபுத்தொடரின் பொருள்
  choice: இரத்தப்பழிக்கான பொறுப்பும் தண்டனையும் குற்றவாளியையே வந்தடைவது
  alternative: அவனுடைய இரத்தம் அவன் தலையின்மேல் திரும்புவது என்ற சொற்சொல் மொழிபெயர்ப்பு
  rationale: இங்கு உடல்சார்ந்த இரத்தத்தைவிட கொலைக்கான குற்றப்பொறுப்பும் நீதியான கைம்மாறும் முதன்மை. அதேவேளை ‘தலையின்மேல்’ என்ற எபிரேய உருவகம் காக்கப்படுகிறது.
- issue: அப்னேரும் அமாசாவும் யோவாபைவிட צַדִּקִים וְטֹבִים எனப்படுதல்
  choice: ‘நீதியும் நற்குணமும் கொண்ட’ என்ற ஒப்பீட்டு மதிப்பீட்டை அப்படியே காத்தல்
  alternative: ‘குற்றமற்றவர்கள்’ என்று சட்டரீதியாக மட்டும் விளக்குதல்
  rationale: மூலம் நீதியையும் நன்மையையும் இணைத்து ஒப்பிடுகிறது; அவர்களை எல்லா வகையிலும் முழுமையாகக் குற்றமற்றவர்கள் என விரிவுபடுத்தாமல் அந்தத் தார்மீக ஒப்பீட்டைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் தெளிவான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘இரத்தப்பழி’ போன்ற வேதாகமச் சட்டநெறிசார் சொல் விளங்கும் சூழலில் வைக்கப்பட்டுள்ளது; இராணுவப் பட்டங்கள் ‘படைத்தலைவன்’ என ஒரேமாதிரியாக மொழிபெயர்க்கப்பட்டுள்ளன.
