base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/032.yaml
  text: 'And Yahweh will return his blood on his own head[a], because he struck down two men more righteous and better than he, and killed them with the sword while my father David did not know it: Abner son of Ner, commander of Israel’s army, and Amasa son of Jether, commander of Judah’s army.'
translation:
  language: ta
  text: 'யாவே அவனுடைய இரத்தத்தை அவன் தலையின்மேல் திருப்பிவிடுவார்[a]; ஏனெனில், அவன் தன்னைவிட நீதிமான்களும் நல்லவர்களுமான இரண்டு மனிதர்களைத் தாக்கி, என் தந்தையான தாவீது அறியாதபோது அவர்களை வாளால் கொன்றான்: இஸ்ரவேலின் படைத்தளபதியான நேரின் மகன் அப்னேரையும், யூதாவின் படைத்தளபதியான ஏத்தேரின் மகன் அமாசாவையும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனுடைய இரத்தப்பழியை அவன் தலையின்மேல் திருப்பிவிடுவார்.” சிந்தப்பட்ட இரத்தத்திற்கான குற்றப்பொறுப்பு குற்றவாளியிடமே திரும்புவதை இந்த எபிரேய மரபுத்தொடர் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
