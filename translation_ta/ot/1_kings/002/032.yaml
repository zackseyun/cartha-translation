  choice: என் தந்தை தாவீதுக்குத் தெரியாமல்
  rationale: இணைப்பைச் சூழ்நிலைப் பொருளில் எடுத்துக் கொண்டு, யோவாபின் செயலுக்கு தாவீது உடந்தையல்ல, அதை அறியவில்லை என்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
