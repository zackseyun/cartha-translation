  choice: திரும்பச் செய்வார்
  rationale: שוב என்பதன் ஹிஃபில் வடிவம் இங்கு செய்த இரத்தப்பழி குற்றவாளியிடமே திரும்புமாறு செய்வதைச் சுட்டுகிறது; எபிரேய உருவகத்தையும் தெய்வீகப் பதிலீட்டையும் காக்கிறது.
