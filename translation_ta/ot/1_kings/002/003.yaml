base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/003.yaml
  text: And keep the charge of Yahweh your God by walking in his ways and by keeping his statutes[a], his commandments, his judgments, and his testimonies, as it is written in the Law of Moses, so that you may act wisely in all that you do and wherever you turn.
translation:
  language: ta
  text: 'உன் கடவுளாகிய யாவேயின் கடமையைக் கைக்கொள்: அவருடைய வழிகளில் நடந்து, மோசேயின் சட்டநூலில் எழுதப்பட்டிருக்கிறபடி அவருடைய நியமங்களையும், கட்டளைகளையும், நீதித்தீர்ப்புகளையும், சாட்சிகளையும் கடைப்பிடி. அதனால், நீ செய்யும் அனைத்திலும், நீ எங்கு திரும்பினாலும், விவேகத்துடன் செயல்படுவாய்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “விவேகத்துடன் செயல்படுவாய்” என்பதற்கு “வெற்றி பெறுவாய்” என்றும் மொழிபெயர்க்கலாம். எபிரெய வினை விவேகமான நடத்தையையோ, அதனால் விளையும் வெற்றியையோ வலியுறுத்தக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַרְתָּ אֶת־מִשְׁמֶרֶת
  choice: உனக்குக் கொடுத்த பொறுப்பைக் காத்துக்கொள்
  rationale: מִשְׁמֶרֶת என்பது ஒப்படைக்கப்பட்ட கடமை அல்லது பொறுப்பைக் குறிக்கிறது. தமிழில் இயல்பாக இருக்கவும், שׁמר என்ற ‘காத்தல்/கடைப்பிடித்தல்’ கருத்தைத் தக்கவைக்கவும் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: உன் கடவுளாகிய யாவே
  rationale: தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்த்து, உடைமைப் பின்னொட்டையும் நேரடியாகக் காட்டுகிறது.
- source_word: לָלֶכֶת בִּדְרָכָיו
  choice: அவருடைய வழிகளில் நடந்து
  rationale: எபிரெய உருவகத்தைத் தக்கவைக்கும் அதே வேளையில் நவீனத் தமிழிலும் தெளிவாக உள்ளது.
- source_word: חֻקֹּתָיו מִצְוֺתָיו וּמִשְׁפָּטָיו וְעֵדְוֺתָיו
  choice: அவருடைய நியமங்களையும், கட்டளைகளையும், நீதித்தீர்ப்புகளையும், சாட்சிக் கட்டளைகளையும்
  rationale: 'சட்டச்சொற்களின் தனித்தனி நுணுக்கங்களை இயன்றவரைத் தக்கவைக்கிறது: நிலைநிறுத்தப்பட்ட நியமங்கள், ஆணைகள், நீதிசார் தீர்ப்புகள், உடன்படிக்கைச் சாட்சியாக நிற்கும் கட்டளைகள்.'
- source_word: בְּתוֹרַת מֹשֶׁה
  choice: மோசேயின் திருச்சட்டத்தில்
  rationale: இங்கு תּוֹרָה எழுதப்பட்ட மோசேயின் சட்டப் போதனையைச் சுட்டுவதால், பரவலாகப் புரியக்கூடிய ‘திருச்சட்டம்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: לְמַעַן תַּשְׂכִּיל
  choice: அப்போது … விவேகத்துடன் செயல்படுவாய்
  rationale: שׂכל வினை ஞானமாக அல்லது விவேகமாகச் செயல்படுதலையும் அதனால் விளையும் வெற்றியையும் குறிக்கலாம். முதன்மை உரையில் செயல்முறை நுணுக்கம் முன்னிலைப்படுத்தப்பட்டு, மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְאֵת כָּל־אֲשֶׁר תִּפְנֶה שָׁם
  choice: நீ எங்கு திரும்பினாலும்
  rationale: ‘நீ திரும்பும் எல்லா இடங்களிலும்’ என்ற எபிரெயச் சொற்றொடரின் இயல்பான தமிழாக்கம்.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயர்
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக இருப்பதால் அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது உரையின் உடன்படிக்கைச் சிறப்பைத் தக்கவைக்கிறது.
- issue: תַּשְׂכִּיל என்பதன் நுணுக்கம்
  choice: விவேகத்துடன் செயல்படுவாய்
  alternative: வெற்றி பெறுவாய்; செழிப்படைவாய்
  rationale: இவ்வினை விவேகமான நடத்தையையும் அதனால் வரும் வெற்றியையும் உள்ளடக்கக்கூடும். பொருளாதாரச் செழிப்பை மட்டும் உணர்த்தாமல் இருக்க முதன்மை உரையில் ‘விவேகத்துடன் செயல்படுதல்’ தேர்ந்தெடுக்கப்பட்டு உண்மையான இரட்டைப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் வேதாகமத்துக்குரிய கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டது. சட்டச்சொற்களின் பட்டியல் ஒன்றோடொன்று கலக்காமல் வேறுபடுத்தப்பட்டுள்ளது; அரிதான ‘சாட்சிகள்’ என்பதற்குப் பதிலாக வாசகருக்குத் தெளிவான ‘சாட்சிக் கட்டளைகள்’ பயன்படுத்தப்பட்டது.
