translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் மரியாதைமிக்க வரலாற்று நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரேயச் சொற்றொடரின் பொருள் காக்கப்பட்டாலும், தமிழில் இயல்பற்ற ‘நாட்கள்’ என்ற காலவழக்கு தவிர்க்கப்பட்டுள்ளது.
