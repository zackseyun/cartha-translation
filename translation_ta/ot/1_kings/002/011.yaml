  text: וְ/הַ/יָּמִ֗ים אֲשֶׁ֨ר מָלַ֤ךְ דָּוִד֙ עַל יִשְׂרָאֵ֔ל אַרְבָּעִ֖ים שָׁנָ֑ה בְּ/חֶבְר֤וֹן מָלַךְ֙ שֶׁ֣בַע שָׁנִ֔ים וּ/בִ/ירוּשָׁלִַ֣ם מָלַ֔ךְ שְׁלֹשִׁ֥ים וְ/שָׁלֹ֖שׁ שָׁנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/011.yaml
  text: The days that David reigned over Israel were forty years. In Hebron he reigned seven years, and in Jerusalem he reigned thirty-three years.
translation:
  language: ta
  text: தாவீது இஸ்ரவேலை ஆட்சி செய்த காலம் நாற்பது ஆண்டுகள். எப்ரோனில் அவர் ஏழு ஆண்டுகளும், எருசலேமில் முப்பத்து மூன்று ஆண்டுகளும் ஆட்சி செய்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַיָּמִים אֲשֶׁר מָלַךְ
  choice: ஆட்சி செய்த காலம்
  rationale: எபிரேய மொழியின் சொற்படியான ‘ஆட்சி செய்த நாட்கள்’ என்பது தமிழில் இயல்பற்றதாக இருப்பதால், ஆட்சியின் கால அளவைக் குறிக்கும் அதன் பொருள் இயல்பான நவீன தமிழில் தரப்படுகிறது.
- source_word: דָּוִד עַל יִשְׂרָאֵל
  choice: தாவீது இஸ்ரவேலை ஆட்சி செய்த
  rationale: מָלַךְ עַל என்ற அமைப்பு ஒரு மக்கள்மீது அரசராக ஆட்சி செய்வதைக் குறிக்கிறது; ‘இஸ்ரவேலை ஆட்சி செய்த’ என்பது தெளிவான, இயல்பான தமிழ்.
- source_word: אַרְבָּעִים שָׁנָה
  choice: நாற்பது ஆண்டுகள்
  rationale: எண்ணிக்கையும் கால அளவும் நேரடியாகவும் துல்லியமாகவும் மொழிபெயர்க்கப்படுகின்றன.
- source_word: בְּחֶבְרוֹן מָלַךְ שֶׁבַע שָׁנִים
  choice: எப்ரோனில் அவர் ஏழு ஆண்டுகளும் ... ஆட்சி செய்தார்
  rationale: இடத்தைக் குறிக்கும் בְ ‘-இல்’ எனத் தரப்பட்டு, எபிரேயத்தில் மீண்டும் வரும் ஆட்சிக் கருத்து தமிழிலும் வெளிப்படையாக வைக்கப்படுகிறது; இணை அமைப்புக்காக ‘-உம்’ பயன்படுத்தப்படுகிறது.
- source_word: וּבִירוּשָׁלִַם מָלַךְ שְׁלֹשִׁים וְשָׁלֹשׁ שָׁנִים
  choice: எருசலேமில் முப்பத்து மூன்று ஆண்டுகளும் ஆட்சி செய்தார்
  rationale: கூட்டு எண் நவீன தமிழில் ‘முப்பத்து மூன்று’ என வழங்கப்படுகிறது; இடமும் ஆட்சிக்காலமும் மூலத்துக்கு ஏற்ப பாதுகாக்கப்படுகின்றன.
