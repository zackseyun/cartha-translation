base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/037.yaml
  text: For on the day you go out and cross the Kidron Valley[a], know for certain that you shall surely die[b]; your blood shall be on your own head.
translation:
  language: ta
  text: நீ வெளியேறிக் கீதரோன் பள்ளத்தாக்கை[a] கடக்கும் நாளில், நீ நிச்சயமாகச் சாவாய் என்பதை உறுதியாக அறிந்துகொள்; உன் இரத்தம் உன் தலையின்மேலேயே இருக்கும்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கீதரோன் ஓடையைக் கடக்கும்.’ எபிரெயச் சொல் பள்ளத்தாக்கு, வறண்ட ஓடைப்பள்ளம் அல்லது பருவகால நீரோடை ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘உன் இரத்தம் உன் தலையின்மேல் இருக்கும்’ என்பது, உன் மரணத்திற்கான பொறுப்பை நீயே ஏற்க வேண்டும் என்று பொருள்படும் எபிரெயச் சொல்வழக்கு.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה בְּיוֹם
  choice: நாளில்
  rationale: எபிரெய காலத் தொடர் எச்சரிக்கையின் நிபந்தனை நிறைவேறும் நேரத்தைக் குறிக்கிறது. ‘நாளில்’ என்பது அதன் முறைசார், கடுமையான தொனியைத் தக்கவைக்கிறது.
- source_word: צֵאתְךָ
  choice: நீ வெளியேறி
  rationale: குறிக்கப்பட்ட எல்லையைவிட்டு சீமேயி வெளியேறும் செயலை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: וְעָבַרְתָּ אֶת נַחַל קִדְרוֹן
  choice: கீதரோன் பள்ளத்தாக்கைக் கடக்கும்
  rationale: נחל என்பது பள்ளத்தாக்கு, வறண்ட ஓடைப்பள்ளம் அல்லது பருவகால நீரோடையைக் குறிக்கலாம். நிலவியல் பெயராக ‘கீதரோன் பள்ளத்தாக்கு’ இயல்பாக உள்ளது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: יָדֹעַ תֵּדַע
  choice: உறுதியாக அறிந்துகொள்
  rationale: வினையெச்சத்தின் முழுவடிவமும் வினைமுற்றும் இணைந்து அறிவுறுத்தலை வலியுறுத்துகின்றன; ‘உறுதியாக’ அந்த அழுத்தத்தைத் தெளிவாக எடுத்துரைக்கிறது.
- source_word: כִּי מוֹת תָּמוּת
  choice: நீ நிச்சயமாகச் சாவாய்
  rationale: முழுவடிவ வினையும் வினைமுற்றும் சேர்ந்த அமைப்பு மரணத்தின் நிச்சயத்தை வலியுறுத்துகிறது. ‘நிச்சயமாகச் சாவாய்’ அந்த வலிமையையும் தீர்ப்புத் தொனியையும் காக்கிறது.
- source_word: דָּמְךָ יִהְיֶה בְרֹאשֶׁךָ
  choice: உன் இரத்தப்பழி உன் தலையின்மேலேயே இருக்கும்
  rationale: மரணத்திற்கான பொறுப்பு அவனையே சாரும் என்னும் எபிரெய சட்டவழக்கை அதன் உடல் உருவகத்துடன் தக்கவைக்கிறது. ‘இரத்தப்பழி’ தமிழில் குற்றப்பொறுப்பை இயல்பாக உணர்த்துகிறது.
theological_decisions:
- issue: மரணத்திற்கான தனிப்பட்ட பொறுப்பைக் குறிக்கும் சட்டவழக்கு
  choice: ‘உன் இரத்தப்பழி உன் தலையின்மேலேயே இருக்கும்’ என்ற உருவகச் சொல்லாட்சியை முதன்மை உரையில் தக்கவைத்தல்
  alternative: ‘உன் மரணத்திற்கு நீயே பொறுப்பாவாய்’
  rationale: இது தனிப்பட்ட பொறுப்பை விதிக்கும் நீதித்துறை எச்சரிக்கை. உருவகத்தைத் தக்கவைப்பது மூலத்தின் சட்ட மற்றும் அறநெறி வலிமையைப் பாதுகாக்கிறது; அதன் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், அரசரின் கடுமையான சட்ட எச்சரிக்கைக்கேற்ற கண்ணியமான தொனி பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் இரு வலியுறுத்தல் அமைப்புகளும் ‘உறுதியாக’ மற்றும் ‘நிச்சயமாக’ என வேறுபடுத்திக் காக்கப்பட்டுள்ளன; அரிதான நிலவியல் பொருளும் சட்டவழக்கும் அடிக்குறிப்புகளில் விளக்கப்பட்டுள்ளன.
