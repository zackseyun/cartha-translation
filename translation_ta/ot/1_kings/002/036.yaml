  yaml_path: translation/ot/1_kings/002/036.yaml
  text: Then the king sent and called for Shimei and said to him[a], “Build yourself a house in Jerusalem and live there, and do not go out from there anywhere.”
translation:
  language: ta
  text: பின்பு அரசன் ஆள் அனுப்பி சிமெயியை அழைத்து, அவனிடம், “நீ எருசலேமில் உனக்காக ஒரு வீட்டைக் கட்டி, அங்கேயே குடியிரு; அங்கிருந்து எங்கும்[a] போகாதே” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மரபுத்தொடர் நேரடியாக, “இங்கும் அங்கும்”; அதாவது, “எங்கும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח הַמֶּלֶךְ וַיִּקְרָא לְשִׁמְעִי
  choice: அரசன் ஆள் அனுப்பி சிமெயியை அழைத்து
  rationale: 'இரண்டு எபிரெய வினைகளையும் இயல்பான தமிழில் தக்கவைக்கிறது: அரசன் ஒருவரை அனுப்பினான்; அதன் மூலம் சிமெயியைத் தன்னிடம் வரவழைத்தான்.'
- source_word: בְּנֵה לְךָ בַיִת
  choice: உனக்காக ஒரு வீட்டைக் கட்டி
  rationale: நேரடிக் கட்டளையையும் לְךָ என்பதன் தனிப்பயன் பொருளையும் தெளிவாகக் காட்டுகிறது; בית இங்கு வசிப்பதற்கான வீட்டைக் குறிக்கிறது.
- source_word: וְיָשַׁבְתָּ שָׁם
  choice: அங்கேயே குடியிரு
  rationale: ישׁב என்பதன் தொடர்ந்த வசிப்பு என்ற பொருளை நவீனத் தமிழில் இயல்பாகத் தருகிறது; ‘-ஏ’ எருசலேமிலேயே தங்க வேண்டும் என்ற கட்டுப்பாட்டைச் சூழலுக்கு ஏற்ப வெளிப்படுத்துகிறது.
- source_word: וְלֹא תֵצֵא מִשָּׁם
  choice: அங்கிருந்து ... எங்கும் போகாதே
  rationale: יצא என்பதன் ‘அங்கிருந்து வெளியேறுதல்’ என்ற கருத்தையும் தடைக் கட்டளையையும் இயல்பான தமிழில் தருகிறது.
- source_word: אָנֶה וָאָנָה
  choice: இங்கோ அங்கோ எங்கும்
  rationale: சொற்றொடரின் ‘இந்தப் பக்கமோ அந்தப் பக்கமோ’ என்ற பகிர்வு நுணுக்கத்தைத் தக்கவைத்தபடி, தடையின் நோக்கம் ‘எங்கும் செல்லக்கூடாது’ என்பதைத் தெளிவாக்குகிறது.
