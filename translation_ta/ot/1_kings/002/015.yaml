base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/015.yaml
  text: And he said[a], “You know that the kingdom was mine, and that all Israel had set their faces on me to reign; but the kingdom turned and became my brother’s[b], for it was his from Yahweh.”
translation:
  language: ta
  text: அவன் அவளிடம், “அரசாட்சி எனக்கு இருந்தது என்றும், நான் அரசாள வேண்டும் என்று இஸ்ரவேலர் அனைவரும் என்னையே எதிர்நோக்கியிருந்தார்கள்[a] என்றும் உனக்குத் தெரியும். ஆனால் அரசாட்சி கைமாறி என் சகோதரனுடையதாயிற்று; ஏனெனில் அது யாவேவிடமிருந்து அவனுக்கு வந்தது[b]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “இஸ்ரவேலர் அனைவரும் தங்கள் முகங்களை என்மேல் வைத்திருந்தார்கள்.” அதாவது, நான் அரசாள வேண்டும் என்று என்னையே நோக்கி எதிர்பார்த்திருந்தார்கள்.'
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “ஏனெனில் அது யாவேவால் அவனுக்குரியதாயிருந்தது.”
    reason: alternative_reading
lexical_decisions:
- source_word: הַמְּלוּכָה
  choice: அரசாட்சி
  rationale: இங்கு அரசனுடைய ஆட்சிப் பதவியையும் அரசாளும் உரிமையையும் குறிக்கிறது. ‘அரசாட்சி’ என்பது சூழலுக்கு ஏற்ற இயல்பான தமிழ்ச் சொல்; ‘அரசுரிமை’ என்று மொழிபெயர்த்தால் அதோனியாவுக்கு நியாயப்படியான உரிமை இருந்ததாகக் கூடுதலாக உணர்த்தக்கூடும்.
- source_word: וְעָלַי שָׂמוּ כָל־יִשְׂרָאֵל פְּנֵיהֶם
  choice: இஸ்ரவேலர் அனைவரும் என்னையே எதிர்நோக்கியிருந்தார்கள்
  rationale: முகத்தை ஒருவர்மேல் வைப்பது என்ற எபிரெய மரபுத்தொடர், எதிர்பார்ப்போடும் நோக்கத்தோடும் அவரை நோக்கியிருப்பதைக் குறிக்கிறது. தமிழில் இயல்பாக அமைய அதன் பொருள் தரப்பட்டுள்ளது; மூல உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: לִמְלֹךְ
  choice: நான் அரசாள வேண்டும் என்று
  rationale: இச்சூழலில் מלך வினையின் முடிவிலி வடிவம் அரசனாக ஆட்சி செய்வதைக் குறிக்கிறது. தமிழில் முந்தைய எதிர்பார்ப்பு கருத்துடன் இயல்பாக இணைய இவ்வாறு தரப்பட்டுள்ளது.
- source_word: וַתִּסֹּב
  choice: கைமாறி
  rationale: ஆட்சி வேறொருவரிடம் திரும்பியதையோ மாறிச் சென்றதையோ குறிக்கிறது. ‘கைமாறி’ என்பது ஆட்சிப் பரிமாற்றத்தைத் தெளிவாகவும் இயல்பாகவும் கூறுகிறது; அது எவ்வாறு நிகழ்ந்தது என்பதைச் சேர்த்து விளக்கவில்லை.
- source_word: וַתְּהִי לְאָחִי
  choice: என் சகோதரனுடையதாயிற்று
  rationale: அரசாட்சி சகோதரனுக்கு உரியதாக ஆனது என்ற לְ-இன் உடைமைப் பொருளைப் பாதுகாக்கிறது.
- source_word: כִּי מֵיְהוָה הָיְתָה לּוֹ
  choice: ஏனெனில் அது யாவேவிடமிருந்து அவனுக்கு வந்தது
  rationale: அரசாட்சி யாவேவிடமிருந்து அவனுக்கு ஏற்பட்டது என்ற தெய்வீக மூலத்தைத் தெரிவிக்கிறது. மூலத்தில் இல்லாத ‘கொடுத்தார்’ என்ற வினையைச் சேர்க்காமல், இயல்பான தமிழில் உறவை வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், அதன் வழக்கமான தமிழாக்க ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אָחִי
  choice: என் சகோதரன்
  rationale: அதோனியாவின் பார்வையில் சாலொமோனைக் குறிக்கும் நேரடியான உறவுமுறைச் சொல்.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூல உரை தெய்வீகத் தனிப்பெயரை நேரடியாகப் பயன்படுத்துவதால், அதை ஒரு பட்டமாக மாற்றாமல் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- issue: இறுதிக் கூற்றில் தெய்வீக நியமனத்தை எவ்வளவு வெளிப்படையாக்குவது
  choice: அது யாவேவிடமிருந்து அவனுக்கு வந்தது
  alternative: யாவே அதை அவனுக்குக் கொடுத்தார் / அது யாவேவால் அவனுக்குரியதாயிருந்தது
  rationale: எபிரெயம் அரசாட்சி ‘யாவேவிடமிருந்து அவனுக்கு இருந்தது’ எனக் கூறுகிறது; கொடுத்தல் என்ற வினையை வெளிப்படையாகக் கூறவில்லை. தேர்ந்த வடிவம் தெய்வீக மூலத்தைப் பாதுகாக்கிறது, ஆனால் செயற்பாட்டை மூலத்தைவிடத் துல்லியமாக நிர்ணயிக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. பெண்பால் ஒருமை முகவரியைத் தமிழில் சூழலுக்கு இயல்பான ‘அவளிடம்’ மற்றும் ‘உனக்கு’ என்பவற்றால் காட்டுகிறது. எபிரெய மரபுத்தொடரின் பொருள் முதன்மை உரையில் இயல்பாகவும், அதன் சொற்படிமம் அடிக்குறிப்பிலும் தரப்பட்டுள்ளது.
