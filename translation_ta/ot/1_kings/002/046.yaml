  text: Then the king commanded Benaiah son of Jehoiada[a], and he went out and struck him down, and he died. So the kingdom was established in the hand of Solomon.
translation:
  language: ta
  text: அப்போது அரசன் யோயாதாவின் மகன் பெனாயாவுக்குக் கட்டளையிட்டான். பெனாயா புறப்பட்டுச் சென்று, அவனைத் தாக்கி வீழ்த்தினான்; அவன் இறந்தான். இவ்வாறு அரசாட்சி சாலொமோனின் கையில் உறுதிப்பட்டது[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அரசாட்சி சாலொமோனின் கட்டுப்பாட்டில் உறுதியாக நிலைநிறுத்தப்பட்டது.” “கையில்” என்ற எபிரேய மரபுத்தொடர் கட்டுப்பாடு அல்லது அதிகாரத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו הַמֶּלֶךְ
  choice: அப்போது அரசன் … கட்டளையிட்டான்
  rationale: צוה என்பதன் அரச அதிகாரத்துடனான ‘கட்டளையிடு’ என்ற பொருளை நேரடியாகத் தருகிறது; தொடக்க வாவ் தொடர்கதை வரிசையை இயல்பாகக் காட்ட ‘அப்போது’ என மொழிபெயர்க்கப்பட்டது.
- source_word: בְּנָיָהוּ בֶן יְהוֹיָדָע
  choice: யோயாதாவின் மகன் பெனாயா
  rationale: எபிரேயப் பெயர்கள் தமிழில் ஒலிபெயர்க்கப்பட்டு, construct உறவு இயல்பான தமிழ் உடைமைத் தொடரால் தரப்பட்டுள்ளது.
- source_word: וַיֵּצֵא
  choice: அவன் புறப்பட்டுச் சென்று
  rationale: יצא என்பதன் ‘வெளியே/புறப்பட்டுச் செல்லுதல்’ என்ற இயக்கத்தை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: וַיִּפְגַּע בּוֹ
  choice: அவனை வெட்டி வீழ்த்தினான்
  rationale: פגע ב இச்சூழலில் தாக்கி வீழ்த்துவதைக் குறிக்கிறது. அடுத்துள்ள ‘அவன் இறந்தான்’ என்ற தனி விளைவை அழிக்காமல், மரணதண்டனையின் வன்முறையைத் தெளிவாகத் தருகிறது.
- source_word: וַיָּמֹת
  choice: அவன் இறந்தான்
  rationale: செயலைத் தொடர்ந்து வரும் மரண விளைவை எபிரேயக் கதை வரிசைப்படியே தனியாக வைத்துள்ளது.
- source_word: וְהַמַּמְלָכָה
  choice: இவ்வாறு அரசாட்சி
  rationale: ממלכה இங்கு நாட்டின் புவியியல் எல்லையைவிட சாலொமோனின் அரச ஆட்சி அல்லது ராஜ அதிகாரத்தை மையப்படுத்துகிறது; ‘இவ்வாறு’ முந்தைய நிகழ்வுகளின் விளைவைக் காட்டுகிறது.
- source_word: נָכוֹנָה
  choice: உறுதிப்பட்டது
  rationale: Niphal வடிவிலுள்ள כון, நிலைநிறுத்தப்படுதல் அல்லது உறுதியாக்கப்படுதல் என்ற பொருளைத் தருகிறது.
- source_word: בְּיַד שְׁלֹמֹה
  choice: சாலொமோனின் கையில்
  rationale: ஆட்சி ஒருவரின் கட்டுப்பாட்டில் இருப்பதைக் குறிக்கும் எபிரேய ‘கையில்’ என்ற உருவகத்தைத் தக்கவைக்கிறது.
