base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/004.yaml
  text: so that Yahweh may establish his word that he spoke concerning me[a], saying, ‘If your sons keep their way by walking before me in truth with all their heart and with all their soul,’ saying[c][b], ‘A man of yours shall not be cut off from upon the throne of Israel.’
translation:
  language: ta
  text: 'யாவே என்னைக் குறித்து இவ்வாறு கூறிய தமது வார்த்தையை நிலைநிறுத்தும்படியாக: “உன் மகன்கள் தங்கள் வழியைக் காத்து, தங்கள் முழு இருதயத்தோடும் முழு ஆத்துமாவோடும் எனக்கு முன்பாக உண்மையுடன் நடந்தால், இஸ்ரவேலின் அரியணையிலிருந்து உனக்குரிய ஒருவன் நீக்கப்படமாட்டான்.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמַעַן
  choice: நிலைநிறுத்துவதற்காகவே
  rationale: நோக்கம் அல்லது விளைவை அறிமுகப்படுத்தும் எபிரெயச் சொல்லின் வலிமையைத் தமிழில் இயல்பாகக் காட்டுகிறது; முந்தைய வசனத்துடன் உள்ள தொடர்ச்சியையும் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் நேரடியாக ஒலிபெயர்க்கிறது.
- source_word: יָקִים אֶת־דְּבָרוֹ
  choice: தமது வார்த்தையை நிலைநிறுத்த
  rationale: קום என்பதன் ஹிஃபில் வடிவிலுள்ள ‘நிற்கச் செய்தல், உறுதிப்படுத்துதல்’ என்ற பொருளையும், דָּבָר என்பதன் ‘வார்த்தை’ என்ற வடிவத்தையும் காக்கிறது.
- source_word: דִּבֶּר עָלַי
  choice: என்னைக் குறித்து உரைத்த
  rationale: עַל என்பதன் இயல்பான ‘குறித்து’ என்ற பொருளை முதன்மைப்படுத்துகிறது; ‘என்னிடம் உரைத்த’ என்ற சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: יִשְׁמְרוּ ... אֶת־דַּרְכָּם
  choice: தங்கள் வழியைக் காத்து
  rationale: ‘வழி’ என்ற வாழ்வியல் உருவகத்தையும் שׁמר என்பதன் காத்தல்/கடைப்பிடித்தல் நுணுக்கத்தையும் பாதுகாக்கிறது.
- source_word: לָלֶכֶת לְפָנַי
  choice: எனக்கு முன்பாக ... நடந்தால்
  rationale: தேவனுடைய முன்னிலையில் வாழ்வதைச் சுட்டும் ‘நடத்தல்’ உருவகத்தை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: בֶּאֱמֶת
  choice: உண்மையுடன்
  rationale: אֱמֶת என்பதிலுள்ள உண்மை, உண்மைத்தன்மை, நம்பகத்தன்மை ஆகிய பொருள் பரப்பை அதிகமாகச் சுருக்காமல் வைத்திருக்கிறது.
- source_word: בְּכָל־לְבָבָם וּבְכָל־נַפְשָׁם
  choice: தங்கள் முழு இருதயத்தோடும் முழு ஆத்துமாவோடும்
  rationale: முழுமையான உள்ளார்ந்த அர்ப்பணிப்பை வெளிப்படுத்தும் இரட்டை எபிரெயச் சொல்லமைப்பைத் தக்கவைக்கிறது.
- source_word: לֹא־יִכָּרֵת לְךָ אִישׁ מֵעַל כִּסֵּא יִשְׂרָאֵל
  choice: இஸ்ரவேலின் அரியணையிலிருந்து உனக்குரிய ஓர் ஆண் நீக்கப்படமாட்டான்
  rationale: כרת என்பதன் நிஃபால் செயல்பாட்டையும் מֵעַל என்பதன் ‘மேலிருந்து/இருந்து’ வலிமையையும் வெளிப்படையாகப் பாதுகாக்கிறது; இது வம்ச ஆண் வாரிசைக் குறிக்கிறது.
theological_decisions:
- issue: தாவீதுக்கான வாக்குறுதியின் நிபந்தனைத்தன்மை
  choice: ‘உன் மகன்கள் ... நடந்தால்’ என்ற வெளிப்படையான நிபந்தனை அப்படியே வைக்கப்பட்டது.
  alternative: வேறு தாவீதிய உடன்படிக்கை உரைகளோடு ஒத்திசைக்க, இதை வெறும் பொதுவான அறிவுரையாக மென்மைப்படுத்துதல்.
  rationale: எபிரெய உரை אִם மூலம் தெளிவான நிபந்தனையை முன்வைக்கிறது. நிபந்தனை மற்றும் பிற இடங்களிலுள்ள நிபந்தனையற்ற வாக்குறுதி மொழிக்கிடையிலான இறையியல் இழுபறி மொழிபெயர்ப்பில் தீர்க்கப்படவில்லை.
- issue: அரியணை வாக்குறுதியின் சொல்லமைப்பு
  choice: ‘அரியணையிலிருந்து உனக்குரிய ஓர் ஆண் நீக்கப்படமாட்டான்’ என்ற எபிரெய வடிவத்துக்கு நெருக்கமான மொழிபெயர்ப்பு பயன்படுத்தப்பட்டது.
  alternative: ‘இஸ்ரவேலின் அரியணையில் அமர உனக்கு ஓர் ஆண் இல்லாமற்போகமாட்டான்’ என்ற இயல்பான தமிழ்ச் சொற்றொடர்.
  rationale: மாற்று வடிவம் பொருளைத் தெளிவாக்கினாலும், நிஃபால் வினையின் செயல்பாடும் מֵעַל என்பதன் ‘அரியணையிலிருந்து’ என்ற கூறும் மறைந்துவிடும்; ஆகவே அது அடிக்குறிப்பில் தரப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. ‘வழி’, ‘நடத்தல்’, ‘முழு இருதயம்’, ‘முழு ஆத்துமா’ போன்ற மூல உருவகங்கள் காக்கப்பட்டுள்ளன. மூலத்தில் இருமுறை வரும் לֵאמֹר என்பதின் மேற்கோள் அடுக்கை ‘அவர் இப்படிச் சொன்னார் ... என்று கூறினார்’ என்ற வடிவில் காட்டி, தமிழில் வாசிக்கத்தக்கவாறு அமைக்கப்பட்டுள்ளது.
