  text: וַ/יִּשָּׁבַע֙ הַ/מֶּ֣לֶךְ שְׁלֹמֹ֔ה בַּֽ/יהוָ֖ה לֵ/אמֹ֑ר כֹּ֣ה יַֽעֲשֶׂה לִּ֤/י אֱלֹהִים֙ וְ/כֹ֣ה יוֹסִ֔יף כִּ֣י בְ/נַפְשׁ֔/וֹ דִּבֶּר֙ אֲדֹ֣נִיָּ֔הוּ אֶת הַ/דָּבָ֖ר הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/023.yaml
  text: Then King Solomon swore by Yahweh[a], saying, “May God do so to me, and more also[b], for Adonijah has spoken this word against his own life.”
translation:
  language: ta
  text: அப்போது சாலொமோன் அரசன் யாவேயின் பெயரில்[a] சத்தியம் செய்து, “கடவுள் எனக்கு இவ்வாறே செய்யட்டும்; இன்னும் அதிகமாகவும் செய்யட்டும்! அதோனியா தன் உயிருக்கே கேடாக இந்த வார்த்தையைப் பேசியிருக்கிறான்[b]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மூலத்தில் உடன்படிக்கையின் இறைப்பெயரான יהוה (YHWH) வருகிறது; அது இங்கே ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது. சொல்லர்த்தமாக, ‘யாவேயால்/யாவேயைக் கொண்டு சத்தியம் செய்து.’
    reason: divine_name
  - marker: b
    text: சொல்லர்த்தமாக, ‘அதோனியா தன் உயிரோடு/தன் உயிருக்கே எதிராக இந்த வார்த்தையைப் பேசினான்.’ இது அவன் சொன்னது அவன் உயிரை ஆபத்துக்குள்ளாக்கியது அல்லது அவன் உயிரை விலையாகக் கோரியது என்பதைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׁבַע
  choice: ஆணையிட்டு
  rationale: வினைச்சொல் ஆணையிடுதல் அல்லது சத்தியம் செய்தல் என்பதைக் குறிக்கிறது; அரசவைக் கதைநடையில் ‘ஆணையிட்டு’ என்பது இயல்பாகவும் சுருக்கமாகவும் உள்ளது.
- source_word: בַּיהוָה
  choice: யாவேமீது
  rationale: בְ முன்னிடைச்சொல் யார்மீது ஆணையிடப்பட்டது என்பதைக் குறிக்கிறது; יהוה என்ற தனிப்பட்ட இறைப்பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்படுகிறது.
- source_word: כֹּה יַעֲשֶׂה לִּי אֱלֹהִים וְכֹה יוֹסִיף
  choice: கடவுள் எனக்கு இப்படிச் செய்யட்டும்; இதற்கும் அதிகமாகச் செய்யட்டும்
  rationale: இது தண்டனை என்னவென்று குறிப்பிடாமல், அதைத் தன்மீது வரவழைக்கும் மரபான ஆணை மொழி. இரு இணை உறுப்புகளையும் தமிழில் தெளிவாகப் பாதுகாக்கிறது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: வடிவத்தில் பன்மையாக இருந்தாலும் இங்கு ஒருமை இறைவனைக் குறிக்கிறது.
- source_word: כִּי
  choice: சொன்னதன் மூலம்
  rationale: இங்கு כִּי நிபந்தனையை அல்ல, சாலொமோனின் ஆணைக்கான காரணத்தை அல்லது உறுதியான அடிப்படையை அறிமுகப்படுத்துகிறது.
- source_word: בְנַפְשׁוֹ
  choice: தன் உயிருக்கே ஆபத்தை வரவழைத்துக்கொண்டான்
  rationale: சொல்லர்த்தத்தில் ‘தன் உயிரோடு/தன் உயிருக்கு’ என வரும் இந்த மரபுத்தொடர், அதோனியாவின் பேச்சு அவன் உயிரைப் பறிக்கக்கூடியதாக அமைந்தது என்பதைக் குறிக்கிறது.
- source_word: דִּבֶּר ... אֶת־הַדָּבָר הַזֶּה
  choice: இந்தக் காரியத்தைச் சொன்னதன் மூலம்
  rationale: דָּבָר என்பது ‘வார்த்தை’ அல்லது ‘காரியம்’ எனப் பொருள்படலாம்; இங்கு பத்சேபாளிடம் முன்வைத்த வேண்டுகோளாகிய முழுக் காரியத்தைக் குறிக்கும் ‘காரியம்’ இயல்பானது.
- source_word: אֲדֹנִיָּהוּ
  choice: அதோனியா
  rationale: எபிரெய தனிப்பட்ட பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலவசனம் உடன்படிக்கையின் தனிப்பட்ட இறைப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. பொதுப்பட்டமான ‘கர்த்தர்’ என்று மாற்றாமல், பெயரைத் தமிழ் ஒலிமுறையில் தருவது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: כִּי என்பதன் தொடர்பு
  choice: காரண/உறுதிப்படுத்தும் பொருள்
  alternative: நிபந்தனைப் பொருள் (‘என்றால்’ அல்லது ‘இல்லாவிட்டால்’)
  rationale: இச்சூழலில் சாலொமோன் அதோனியாவின் கோரிக்கையை மரணத்திற்குரிய செயலாக உடனே தீர்மானிக்கிறான். எபிரெயத்தில் மறுப்பு இல்லாததால் ‘அவன் சொல்லவில்லை என்றால்’ என்ற மறைநிபந்தனையைச் சேர்க்காமல் காரணத் தொடர்பைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ஆணை மொழியின் பழமையான தீவிரம் காக்கப்பட்டாலும், ‘தன் உயிருக்கு எதிராகப் பேசினான்’ என்ற தமிழில் இயல்பற்ற நேரடி வடிவத்திற்குப் பதிலாக அதன் பொருள் முதன்மை உரையில் தெளிவாகத் தரப்பட்டு, சொல்லர்த்தம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
