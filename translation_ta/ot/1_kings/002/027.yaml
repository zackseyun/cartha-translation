revisions:
- from: அதனால் சாலொமோன், அபியத்தார் யாவேக்குக் குருவாக இருப்பதிலிருந்து அவரை நீக்கிவிட்டார். இவ்வாறு, சீலோவில் ஏலியின் குடும்பத்தைக் குறித்து யாவே பேசியிருந்த அவருடைய வார்த்தை நிறைவேறியது.[a][b]
  to: சாலொமோன் அபியத்தாரை யாவேக்குரிய ஆசாரியராக இருப்பதிலிருந்து நீக்கிவிட்டார். இவ்வாறு, சீலோவில் ஏலியின் வீட்டாரைக் குறித்து யாவே பேசியிருந்த வார்த்தை நிறைவேறியது.[a][b]
  rationale: The revision corrects the direct-object construction, uses ‘ஆசாரியர்’ for the Israelite priestly office, and removes an unnecessary explicit causal connective. The result reading remains in the main text, while the footnote preserves the viable purpose reading without asserting Solomon’s motive.
