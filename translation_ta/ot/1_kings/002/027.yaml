base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/027.yaml
  text: So Solomon drove Abiathar out from being priest to Yahweh[b][a], fulfilling the word of Yahweh that he had spoken concerning the house of Eli in Shiloh.
translation:
  language: ta
  text: சாலொமோன் அபியத்தாரை யாவேக்குரிய ஆசாரியராக இருப்பதிலிருந்து நீக்கிவிட்டார். இவ்வாறு, சீலோவில் ஏலியின் வீட்டாரைக் குறித்து யாவே பேசியிருந்த வார்த்தை நிறைவேறியது.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேயின் வார்த்தையை நிறைவேற்றுவதற்காக.” எபிரெயச் சொற்றொடர் நோக்கத்தையோ விளைவையோ குறிக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: ஏலியின் வீட்டாருக்கு எதிராக உரைக்கப்பட்ட வார்த்தையைப் பற்றி 1 சாமுவேல் 2:27–36; 3:11–14-ஐப் பார்க்கவும்.
    reason: cross_reference
lexical_decisions:
- source_word: וַיְגָרֶשׁ
  choice: நீக்கிவிட்டார்
  rationale: גרשׁ என்பது வலுக்கட்டாயமாக வெளியேற்றுதல் அல்லது ஒரு நிலையிலிருந்து அகற்றுதல் எனப் பொருள்படும். இங்கு அபியத்தாரை நாட்டிலிருந்து நாடுகடத்தியதாக அல்லாமல் குருத்துவப் பதவியிலிருந்து அகற்றியதே வெளிப்படையாகக் கூறப்படுவதால், ‘நீக்கிவிட்டார்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: מִהְיוֹת כֹּהֵן
  choice: குருவாக இருப்பதிலிருந்து
  rationale: מן + היה என்ற அமைப்பு ஒரு நிலை அல்லது பொறுப்பிலிருந்து அகற்றப்படுவதைக் குறிக்கிறது; தமிழில் இந்த அமைப்பு மூலத்தின் கருத்தை நெருக்கமாகப் பாதுகாக்கிறது.
- source_word: כֹּהֵן לַיהוָה
  choice: யாவேக்குக் குரு
  rationale: לְ இங்கு யாவேக்குச் செய்யப்படும் குருத்துவச் சேவையின் உறவைச் சுட்டுகிறது. ‘யாவேக்குக் குரு’ என்பது அந்தத் தொடர்பை இயல்பான தமிழில் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எழுத்துகளைக் கொண்ட இறைப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: לְמַלֵּא
  choice: இவ்வாறு ... நிறைவேறியது
  rationale: לְ உடன் வரும் infinitive purpose அல்லது result ஆகிய இரண்டையும் குறிக்கலாம். முதன்மை உரையில் விளைவை இயல்பாகக் காட்டி, நோக்கப் பொருளை அடிக்குறிப்பில் பாதுகாக்கிறது.
- source_word: דְּבַר יְהוָה
  choice: யாவே ... அவருடைய வார்த்தை
  rationale: தெய்வீக அறிவிப்பைக் குறிக்கும் דָּבָר என்பதற்கு ‘வார்த்தை’ மரபார்ந்ததும் சூழலுக்கு ஏற்றதும் ஆகும்; தமிழ் வாக்கியத்தில் உரிமைத் தொடர்பு தெளிவாக அமைகிறது.
- source_word: אֲשֶׁר דִּבֶּר
  choice: பேசியிருந்த
  rationale: சாலொமோனின் நடவடிக்கைக்கு முன்பே அந்த இறைவார்த்தை சொல்லப்பட்டிருந்ததைத் தமிழின் இறந்தகால நிறைவு வடிவம் தெளிவாக்குகிறது.
- source_word: עַל בֵּית עֵלִי
  choice: ஏலியின் குடும்பத்தைக் குறித்து
  rationale: עַל என்பது ‘குறித்து’ என்றும் நியாயத்தீர்ப்புச் சூழலில் ‘எதிராக’ என்றும் அமையலாம். ‘குறித்து’ என்பது சொல்லின் பரந்த பொருளை வைத்திருந்து, தீர்ப்பின் தன்மையைச் சுற்றியுள்ள வேதாகமச் சூழல் வெளிப்படுத்த அனுமதிக்கிறது.
- source_word: בְּשִׁלֹה
  choice: சீலோவில்
  rationale: בְּ இடத்தைக் குறிக்கிறது; ‘சீலோவில்’ என்பது நேரடியான, இயல்பான தமிழ் வடிவம்.
theological_decisions:
- issue: சாலொமோனின் நடவடிக்கைக்கும் முன்பு உரைக்கப்பட்ட இறைவார்த்தைக்கும் உள்ள உறவு
  choice: சாலொமோன் அபியத்தாரை நீக்கியதன் விளைவாக ஏலியின் குடும்பத்தைக் குறித்த யாவேயின் வார்த்தை நிறைவேறியது என்று முதன்மை உரை காட்டுகிறது.
  alternative: ‘யாவேயின் வார்த்தையை நிறைவேற்றுவதற்காக’ என்று நோக்கத்தைக் குறிக்கும் வகையிலும் எபிரெயச் சொற்றொடரைப் புரிந்துகொள்ளலாம்.
  rationale: לְמַלֵּא என்பது நோக்கம் அல்லது விளைவு இரண்டையும் வெளிப்படுத்தக்கூடும். ‘நிறைவேறியது’ தீர்க்கவாக்கின் நிறைவேற்றத்தைத் தெளிவாக்குகிறது; ஆனால் சாலொமோனின் உள்ளார்ந்த நோக்கத்தை உரை கூறுவதைவிட அதிகமாகத் தீர்மானிக்காது. மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘குரு’ என்பது இஸ்ரவேலின் ஆசாரியப் பணியைக் குறிக்க இங்கு பயன்படுத்தப்பட்டுள்ளது. இறைப் பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது; நோக்கம்/விளைவு என்ற உண்மையான எபிரெய இருமை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
