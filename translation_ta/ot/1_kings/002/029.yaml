base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/029.yaml
  text: And it was reported to King Solomon that Joab had fled to the tent of Yahweh[a], and behold, he was beside the altar. So Solomon sent Benaiah son of Jehoiada, saying, “Go[b], strike him down.”
translation:
  language: ta
  text: யோவாப் யாவேயின் கூடாரத்திற்குத் தப்பியோடினான் என்றும், இதோ, அவன் பலிபீடத்தின் அருகில் இருப்பதாகவும் சாலொமோன் அரசனுக்குத் தெரிவிக்கப்பட்டது. அப்போது சாலொமோன் யோயாதாவின் மகன் பெனாயாவை அனுப்பி, “போய், அவனைத் தாக்கு[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவன்மேல் பாய்” அல்லது “அவனைத் தாக்கி வீழ்த்து” என்றும் மொழிபெயர்க்கலாம். எபிரெய வினை தாக்குதல் அல்லது அவன்மேல் பாய்தலைக் குறிக்கலாம்; இச்சூழலில் அது உயிரைப் பறிக்கும் தாக்குதலைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: தெரிவிக்கப்பட்டது
  rationale: ஹொஃபால் செயப்பாட்டு வடிவத்தின் ‘தகவல் அறியச் செய்யப்பட்டது’ என்ற பொருளை இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: לַמֶּלֶךְ שְׁלֹמֹה
  choice: சாலொமோன் அரசருக்கு
  rationale: பட்டத்தையும் பெயரையும் தமிழின் இயல்பான வரிசையில் வழங்குகிறது.
- source_word: נָס
  choice: தப்பியோடி
  rationale: தகவல் தெரிவிக்கப்படுவதற்கு முன்பே நிகழ்ந்த தப்பிச் செல்லுதலைச் சூழலுக்கேற்ற வினையெச்சமாகக் காட்டுகிறது.
- source_word: אֶל אֹהֶל יְהוָה
  choice: யாவேவின் கூடாரத்திற்கு
  rationale: אֹהֶל என்பதன் நேரடியான ‘கூடாரம்’ என்ற பொருளையும், יהוה என்ற இறைப்பெயரையும் காக்கிறது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: கவனத்தைத் திடீரென ஈர்க்கும் எபிரெய உரையாடல் இடைச்சொல்லின் உயிரோட்டத்தைப் பாதுகாக்கிறது.
- source_word: אֵצֶל הַמִּזְבֵּחַ
  choice: பலிபீடத்தின் அருகில்
  rationale: אֵצֶל குறிக்கும் அண்மையைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וַיִּשְׁלַח
  choice: ஆகவே சாலொமோன் ... அனுப்பி
  rationale: அறிக்கையைத் தொடர்ந்து நிகழும் விளைவுசார் கதைநகர்வைக் காட்டுகிறது.
- source_word: בְּנָיָהוּ בֶן יְהוֹיָדָע
  choice: யோய்தாவின் மகன் பெனாயா
  rationale: எபிரெய தந்தைவழிப் பெயரடையாளத்தை இயல்பான தமிழில் வழங்குகிறது.
- source_word: לֵאמֹר
  choice: என்றார்
  rationale: நேர்கூற்றை அறிமுகப்படுத்தும் எபிரெயக் கட்டமைப்பை இயல்பான தமிழ் உரையாடல் வடிவில் மாற்றுகிறது.
- source_word: לֵךְ
  choice: போய்
  rationale: அடுத்த கட்டளையுடன் இயல்பாக இணையும் நேரடி கட்டளை வடிவம்.
- source_word: פְּגַע בּוֹ
  choice: அவனை வெட்டி வீழ்த்து
  rationale: ב உடன் வரும் פגע இங்கு தாக்கி மரணமடையச் செய்யும் பொருளைக் கொண்டுள்ளது; ‘வெட்டி வீழ்த்து’ மரண அடி என்ற சூழலை வெளிப்படுத்துகிறது, ஆனால் ‘கொன்றுவிடு’ என்று முழுமையாக விளக்கிப் பதிலிடுவதைக் தவிர்க்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் நேரடியாக வரும் உடன்படிக்கைப் பெயரை ஒரு பொதுப் பட்டமாக மாற்றாமல், தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பால் வழங்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான வரலாற்றுக் கதைநடையுடன் மொழிபெயர்க்கப்பட்டது. ‘இதோ’ என்பது மூலத்தின் கவன ஈர்ப்பு வலிமையைப் பாதுகாக்கிறது. இறைப்பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டது; ‘கூடாரம்’ என்பது பாரம்பரியமான ஆனால் அதிக விளக்கமுள்ள ‘திருக்கூடாரம்’ என்பதற்குப் பதிலாக மூலச் சொல்லின் எளிய பொருளைக் காக்கிறது.
