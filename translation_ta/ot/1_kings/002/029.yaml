revisions:
- from: யோவாப் யாவேவின் கூடாரத்திற்குத் தப்பியோடி, இதோ, பலிபீடத்தின் அருகில் இருக்கிறார் என்று சாலொமோன் அரசருக்குத் தெரிவிக்கப்பட்டது. ஆகவே சாலொமோன், யோய்தாவின் மகன் பெனாயாவை அனுப்பி, “போய், அவனை வெட்டி வீழ்த்து[a]” என்றார்.
