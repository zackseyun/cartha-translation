source:
  edition: WLC
  text: אָנֹכִ֣י הֹלֵ֔ךְ בְּ/דֶ֖רֶךְ כָּל הָ/אָ֑רֶץ וְ/חָזַקְתָּ֖ וְ/הָיִ֥יתָֽ לְ/אִֽישׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/002.yaml
  text: I am going the way of all the earth. So be strong[a], and be a man,
translation:
  language: ta
  text: “நான் பூமியிலுள்ள எல்லாரும் போகும் வழியில் போகிறேன். ஆகவே நீ வலிமையாக இரு; ஓர் ஆணாக இரு[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீ ஓர் ஆண் என்பதைச் செயலால் காட்டு,” அல்லது “ஆண்மையுடன் இரு.” எபிரேயச் சொற்றொடர் ஓர் ஆணாக இருப்பதையும் துணிவுடனும் பொறுப்புடனும் செயல்படுவதையும் இணைத்துக் கூறுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָנֹכִי
  choice: நான்
  rationale: தனி முதலாம் நபர் ஒருமைப் பெயர்ச்சொல்; சூழலில் கூடுதல் வலியுறுத்தல் தேவையில்லாததால் இயல்பான தமிழில் ‘நான்’ போதுமானது.
- source_word: הֹלֵךְ
  choice: போகிறேன்
  rationale: பெயரெச்ச வடிவம் அண்மையில் நிகழவிருக்கும் மரணத்தை நோக்கிய செல்வதைச் சுட்டுகிறது; ‘போகிறேன்’ காலநிலையை மிகையாக விளக்காமல் தொடர்ச்சியான உணர்வைப் பாதுகாக்கிறது.
- source_word: בְּדֶרֶךְ כָּל הָאָרֶץ
  choice: பூமியிலுள்ள எல்லாரும் போகும் வழியில்
  rationale: எபிரேய மொழிப்படிமம் எல்லா மனிதருக்கும் பொதுவான மரணப் பாதையைக் குறிக்கிறது. சொற்சொறான ‘பூமி முழுவதின் வழி’ தமிழில் தெளிவில்லாததால், உருவகத்தையும் பொருளையும் காக்கும் இயல்பான வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- source_word: וְחָזַקְתָּ
  choice: ஆகவே நீ வலிமையாயிருந்து
  rationale: இணைப்புடன் கூடிய நிறைவுவினை இச்சூழலில் அறிவுறுத்தலாகச் செயல்படுகிறது. ‘ஆகவே’ தாவீதின் நெருங்கிய மரணத்திற்கும் சாலொமோனுக்கான கட்டளைக்கும் உள்ள தொடர்பைக் காட்டுகிறது.
- source_word: וְהָיִיתָ לְאִישׁ
  choice: ஓர் ஆணாக இரு
  rationale: ஆண்பால் ஒருமை பெயர்ச்சொல்லையும் சாலொமோனுக்குரிய நேரடி அறிவுறுத்தலையும் பாதுகாக்கிறது. துணிவுடனும் பொறுப்புடனும் நடப்பது என்ற உட்குறிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: அறிவுறுத்தலில் பாலினம் குறித்த சொற்றொடர்
  choice: ஓர் ஆணாக இரு
  alternative: ஆண்மையுடன் இரு; நீ ஓர் ஆண் என்பதைச் செயலால் காட்டு
  rationale: இச்சொல் குறிப்பாக சாலொமோன் என்ற ஆணை நோக்கி உரைக்கப்படுகிறது. மூலத்தின் ஆண்பால் வடிவத்தையும் தந்தை மகனுக்குக் கொடுக்கும் அறிவுறுத்தலின் வலிமையையும் காக்கிறது; நவீன பாலின வார்ப்புருக்களை முதன்மை உரைக்குள் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான நேரடி உரைநடை பயன்படுத்தப்பட்டுள்ளது. மரணத்தைக் குறிக்கும் மூல உருவகம் பாதுகாக்கப்பட்டு, தமிழில் தெளிவாக இருக்க ‘பூமியிலுள்ள எல்லாரும் போகும் வழி’ என வழங்கப்பட்டுள்ளது.
