source:
  edition: WLC
  text: וַ/יָּבֹ֨א בְנָיָ֜הוּ אֶל אֹ֣הֶל יְהוָ֗ה וַ/יֹּ֨אמֶר אֵלָ֜י/ו כֹּֽה אָמַ֤ר הַ/מֶּ֨לֶךְ֙ צֵ֔א וַ/יֹּ֥אמֶר לֹ֖א כִּ֣י פֹ֣ה אָמ֑וּת וַ/יָּ֨שֶׁב בְּנָיָ֤הוּ אֶת הַ/מֶּ֨לֶךְ֙ דָּבָ֣ר לֵ/אמֹ֔ר כֹּֽה דִבֶּ֥ר יוֹאָ֖ב וְ/כֹ֥ה עָנָֽ/נִי־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/030.yaml
  text: 'Then Benaiah came to the tent of Yahweh and said to him[a], “Thus says the king: ‘Come out.’” But he said, “No, for I will die here.” And Benaiah brought word back to the king, saying, “Thus Joab spoke, and thus he answered me.”'
translation:
  language: ta
  text: 'பின்பு பெனாயா யாவேயின் கூடாரத்துக்கு[a] வந்து, யோவாபிடம், “அரசர் இவ்வாறு கூறுகிறார்: ‘வெளியே வா’” என்றான். ஆனால் யோவாப், “இல்லை; நான் இங்கேயே இறப்பேன்[b]” என்றான். பெனாயா திரும்பி அரசரிடம் சென்று, “யோவாப் இப்படிச் சொன்னான்; அவன் எனக்கு இப்படிப் பதிலளித்தான்” என்று செய்தி அறிவித்தான்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேயின் திருக்கூடாரத்துக்கு.” எபிரெயச் சொல் நேரடியாக “கூடாரம்” என்று பொருள்படும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “இல்லை; ஏனெனில் நான் இங்கேயே இறப்பேன்,” அல்லது “இல்லை; மாறாக, நான் இங்கேயே இறப்பேன்.”
    reason: source_ambiguity
lexical_decisions:
- source_word: אֹהֶל יְהוָה
  choice: யாவேயின் கூடாரம்
  rationale: אֹהֶל என்பதன் நேரடிப் பொருள் ‘கூடாரம்.’ இங்கு ‘ஆலயம்’ அல்லது ‘வீடு’ என்று விளக்கமாக மாற்றாமல், மூலத்தின் சொல் வடிவமும் சரணாலயச் சூழலும் காக்கப்படுகின்றன.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், நவீன தமிழில் தெளிவான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: כֹּה אָמַר הַמֶּלֶךְ
  choice: அரசர் கூறுவது இதுதான்
  rationale: இது தூதுச் செய்திக்கான முறையான வாய்பாடு. தமிழில் இயல்பாகவும் மரியாதையான நடையிலும் அதன் அறிவிப்பு வலிமையைத் தருகிறது.
- source_word: צֵא
  choice: வெளியே வா
  rationale: உள்ளே இருப்பவரிடம் நேரடியாகக் கூறப்படும் கட்டளைக்கு இயல்பான தமிழ் வடிவம்.
- source_word: לֹא כִּי פֹה אָמוּת
  choice: இல்லை; நான் இங்கேயே சாவேன்
  rationale: யோவாபின் மறுப்பையும் அந்த இடத்திலேயே மரிக்கத் தீர்மானித்திருப்பதையும் தெளிவாகக் காட்டுகிறது; כִּי என்பதன் தொடர்பு விளக்க அல்லது எதிர்மறை நுணுக்கம் கொண்டிருக்கலாம் என்பதால் அடிக்குறிப்பில் மாற்று தரப்பட்டுள்ளது.
- source_word: וַיָּשֶׁב ... דָּבָר
  choice: திரும்பிச் சென்று ... செய்தி அறிவித்தான்
  rationale: செய்தியை மீண்டும் அரசரிடம் கொண்டுசென்று அறிவித்தல் என்ற எபிரெய மரபுத்தொடரின் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: כֹּה דִבֶּר יוֹאָב וְכֹה עָנָנִי
  choice: யோவாப் இப்படிச் சொன்னான்; அவன் எனக்கு இப்படிப் பதிலளித்தான்
  rationale: மீண்டும் வரும் כֹּה என்பதின் அறிக்கை நடையை ‘இப்படி ... இப்படி’ என்ற மீளுருவாக்கத்தின் மூலம் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட தெய்வீகப் பெயர் நேரடியாக உள்ளது. எனவே பட்டப்பெயரான ‘கர்த்தர்’ என்பதைப் பதிலீடு செய்யாமல் பெயரை ஒலிபெயர்ப்பது மூல வேறுபாட்டைக் காக்கிறது.
- issue: பலிபீடத்தருகே மரிக்க யோவாப் கூறியதன் நோக்கம்
  choice: நோக்கத்தை விளக்கிச் சேர்க்காமல், ‘நான் இங்கேயே சாவேன்’ என்று மட்டும் மொழிபெயர்த்தல்
  alternative: அங்கே கொல்லப்படுவதன் மூலம் பாதுகாப்பு அல்லது மதச்சார்ந்த பயன் பெற நினைத்ததாக விளக்குதல்
  rationale: இவ்வசனம் யோவாபின் மறுப்பையும் அங்கே மரிப்பேன் என்ற கூற்றையும் மட்டுமே தெரிவிக்கிறது; அவனுடைய உள்நோக்கத்தைத் தெளிவாகக் கூறவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் ஆனால் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. முறையான தூதுச் செய்தி வாய்பாடு இயல்பான தமிழாக்கத்துடன் காக்கப்பட்டுள்ளது; யோவாபின் கூற்றில் மூலத்தில் உள்ள இணைப்புச் சொல்லின் நுணுக்கம் அடிக்குறிப்பில் திறந்தவாறு வைக்கப்பட்டுள்ளது.
