  text: וַ/יִּתֵּ֨ן הַ/מֶּ֜לֶךְ אֶת בְּנָיָ֧הוּ בֶן יְהוֹיָדָ֛ע תַּחְתָּ֖י/ו עַל הַ/צָּבָ֑א וְ/אֶת צָד֤וֹק הַ/כֹּהֵן֙ נָתַ֣ן הַ/מֶּ֔לֶךְ תַּ֖חַת אֶבְיָתָֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/035.yaml
  text: And the king appointed Benaiah son of Jehoiada in his place over the army[a], and the king appointed Zadok the priest in place of Abiathar.
translation:
  language: ta
  text: அரசன், யோய்தாவின் மகன் பெனாயாவை அவனுடைய இடத்தில்[a] படைக்குத் தலைவனாக நியமித்தான். அபியத்தாரின் இடத்தில் ஆசாரியனான சாதோக்கை அரசன் நியமித்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில், “அவனுடைய இடத்தில்”; உடனடி முன்சூழலில் இது முன்பு படைத்தலைவனாக இருந்த யோவாபைக் குறிக்கிறது.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּתֵּן / נָתַן
  choice: நியமித்தான்
  rationale: வினைச்சொல்லின் அடிப்படைப் பொருள் ‘வைத்தான்/கொடுத்தான்’ என்றாலும், இங்கு ஒருவரை ஓர் அதிகாரப் பொறுப்பில் அமர்த்துவது குறிக்கப்படுவதால் ‘நியமித்தான்’ என்பது இயல்பான சூழற்பொருள் மொழிபெயர்ப்பு.
- source_word: בְּנָיָהוּ בֶן־יְהוֹיָדָע
  choice: யோய்தாவின் மகன் பெனாயா
  rationale: எபிரெயப் பிதாவழிப் பெயரமைப்பை நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் வழங்குகிறது.
- source_word: תַּחְתָּיו
  choice: யோவாபின் இடத்தில்
  rationale: எபிரெயில் ‘அவனுடைய இடத்தில்’ என்று உள்ளது; உடனடி முன்சூழலில் அந்தச் சுட்டுப்பெயர் பதவியிலிருந்து அகற்றப்பட்ட யோவாபைக் குறிக்கிறது. முதன்மை உரையில் பெயரை வெளிப்படுத்தி, அடிக்குறிப்பில் நேரடி வடிவம் பாதுகாக்கப்படுகிறது.
- source_word: עַל הַצָּבָא
  choice: படைக்குத் தலைவனாக
  rationale: சொல்லுக்கு நேராக ‘படையின் மேல்’ என்றாலும், இச்சூழலில் பெனாயா படைக்குத் தலைமை வகிக்க நியமிக்கப்பட்டதைத் தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: צָדוֹק הַכֹּהֵן
  choice: சாதோக்கை ஆசாரியராக
  rationale: צָדוֹק என்ற பெயர் ஒலிபெயர்க்கப்படுகிறது; הַכֹּהֵן என்பது அவர் ஏற்ற ஆசாரியப் பதவியை இச்சூழலில் குறிக்கிறது.
- source_word: תַּחַת אֶבְיָתָר
  choice: அபியத்தாரின் இடத்தில்
  rationale: ஒருவருக்குப் பதிலாக மற்றொருவர் அந்தப் பொறுப்பை ஏற்ற மாற்றீட்டுப் பொருளைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: הַמֶּלֶךְ
  choice: அரசன்
  rationale: வரையறுக்கப்பட்ட பட்டத்தை நேரடியாக வழங்குகிறது; எபிரெயில் இரண்டாம் கூறிலும் மீண்டும் வருவதால் தமிழிலும் மீளுரைக்கப்படுகிறது.
