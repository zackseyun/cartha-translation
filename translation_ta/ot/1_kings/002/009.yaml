source:
  edition: WLC
  text: וְ/עַתָּה֙ אַל תְּנַקֵּ֔/הוּ כִּ֛י אִ֥ישׁ חָכָ֖ם אָ֑תָּה וְ/יָֽדַעְתָּ֙ אֵ֣ת אֲשֶׁ֣ר תַּֽעֲשֶׂה לּ֔/וֹ וְ/הוֹרַדְתָּ֧ אֶת שֵׂיבָת֛/וֹ בְּ/דָ֖ם שְׁאֽוֹל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/009.yaml
  text: But now[a], do not hold him guiltless, for you are a wise man, and you will know what you should do to him; and you shall bring his gray head down to Sheol with blood.
translation:
  language: ta
  text: ஆனால் இப்போது, அவனைத் தண்டனையின்றி விட்டுவிடாதே. ஏனெனில், நீ ஞானமுள்ளவன்; அவனுக்கு என்ன செய்ய வேண்டும் என்பதை நீ அறிவாய். அவனுடைய நரைத்த தலையை இரத்தத்தோடு ஷியோலுக்கு[a] இறங்கச் செய்வாய்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கல்லறைக்கு”; அல்லது, “இறந்தோரின் உலகத்துக்கு.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּנַקֵּהוּ
  choice: அவனைத் தண்டனையின்றி விட்டுவிடாதே
  rationale: פיעל வடிவிலுள்ள נקה இச்சூழலில் ஒருவனைத் தண்டிக்காமல் விடுதல் அல்லது குற்றமற்றவனாகக் கருதுதல் என்ற நீதித்துறை சார்ந்த பொருளைக் கொண்டுள்ளது. தேர்ந்தெடுத்த தமிழ் நடை இதை இயல்பாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: אִישׁ חָכָם
  choice: நீ ஞானமுள்ளவன்
  rationale: சாலொமோன் என்ற ஆண் நபருக்கு நேரடியாகச் சொல்லப்படுவதால், மூலத்தின் பாலினத்தையும் தனிப்பட்ட அழைப்பையும் துல்லியமாகப் பேணுகிறது.
- source_word: וְיָדַעְתָּ אֵת אֲשֶׁר תַּעֲשֶׂה לוֹ
  choice: அவனுக்கு என்ன செய்ய வேண்டும் என்பதை நீ அறிவாய்
  rationale: சாலொமோனின் பகுத்தறிவில் தாவீதுக்கு உள்ள நம்பிக்கையையும், அரசநீதி சார்ந்த கடமையின் நுணுக்கத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְהוֹרַדְתָּ
  choice: இறங்கச் செய்வாய்
  rationale: ירד என்பதன் ஹிஃபில் வடிவிலுள்ள ‘கீழே இறங்கச் செய்தல்’ என்ற காரணவினைப் பொருளையும், தொடரும் உறுதியான அறிவுறுத்தலின் எதிர்காலத் தோற்றத்தையும் பேணுகிறது.
- source_word: שֵׂיבָתוֹ
  choice: அவனுடைய நரைத்த தலை
  rationale: நரை அல்லது முதுமையைக் குறிக்கும் எபிரெய உருவகத்தை ‘நரைத்த தலை’ என்று நேரடியாகப் பேணுகிறது.
- source_word: בְּדָם
  choice: இரத்தத்தோடு
  rationale: வன்முறையான, இரத்தம் சிந்தும் மரணத்தைச் சுட்டும் மூலத்தின் கடுமையான உருவகத்தை மென்மையாக்காமல் பேணுகிறது.
- source_word: שְׁאוֹל
  choice: ஷியோல்
  rationale: இதை வெறும் கல்லறை என்று குறுக்காமல், இறந்தோரின் உலகம் சார்ந்த எபிரெயக் கருத்தின் பரப்பை ஒலிபெயர்ப்பு காக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: שְׁאוֹל என்பதன் மொழிபெயர்ப்பு
  choice: ஷியோல்
  alternative: கல்லறை; இறந்தோரின் உலகம்
  rationale: ஒலிபெயர்ப்பு, சொல்லை வெறும் புதைகுழியாகக் கட்டுப்படுத்தாமல் அதன் எபிரெய அண்டவியல் மற்றும் இறையியல் நுணுக்கத்தைப் பாதுகாக்கிறது. வாசகர்கள் பொருள் வரம்பை அறிய அடிக்குறிப்பு மாற்றுகளை வழங்குகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், நேரடியான ஆனால் கண்ணியமான அரச அறிவுறுத்தல் நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் ‘நரைத்த தலை,’ ‘இரத்தத்தோடு,’ ‘ஷியோல்’ ஆகிய கடுமையான உருவகங்கள் விளக்கமாக மாற்றப்படாமல் பேணப்பட்டுள்ளன.
