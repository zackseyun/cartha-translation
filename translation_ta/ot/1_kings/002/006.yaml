  yaml_path: translation/ot/1_kings/002/006.yaml
  text: Act according to your wisdom[b][a], and do not let his gray head go down to Sheol in peace.
translation:
  language: ta
  text: உன் ஞானத்தின்படி செய்; அவனுடைய நரைத்த தலை சமாதானமாக ஷியோலுக்கு இறங்காதபடி செய்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனுடைய நரைத்த தலையைச் சமாதானமாக ஷியோலுக்கு இறக்கிவிடாதே.”
    reason: lexical_alternative
  - marker: b
    text: “ஷியோல்” என்பது இறந்தோரின் உலகத்தைக் குறிக்கும் எபிரெயச் சொல்; “கல்லறை” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: செயல்படு
  rationale: עשה என்பது பொதுவாக ‘செய்’ எனப் பொருள்படும்; இங்கு சாலொமோனுக்குக் கொடுக்கப்படும் நடைமுறைக் கட்டளையின் வலிமையை இயல்பான தமிழில் ‘செயல்படு’ வெளிப்படுத்துகிறது.
- source_word: כְּחָכְמָתֶךָ
  choice: உன் ஞானத்தின்படி
  rationale: כְּ முன்னிடைச்சொல், சாலொமோன் தன் பகுத்தறிவுக்கு ஏற்ப நடவடிக்கை எடுக்க வேண்டும் என்பதைக் குறிக்கிறது.
- source_word: וְלֹא תוֹרֵד
  choice: இறங்கவிடாதே
  rationale: ירד என்பதன் ஹிஃபில் வடிவம் காரணவினைப் பொருளாக ‘இறங்கச் செய்’ என்பதைக் கொண்டது. ‘இறங்கவிடாதே’ தமிழில் இயல்பாக இருந்து அந்தக் காரணப் பொருளையும் தக்கவைக்கிறது; ‘இறக்காதே’ என்பது மரணம் என்ற பொருளுடன் குழப்பமளிக்கலாம்.
- source_word: שֵׂיבָתוֹ
  choice: அவனுடைய நரைத்த தலை
  rationale: இந்தச் சொல் நரை அல்லது முதுமையைக் குறிக்கிறது. ‘நரைத்த தலை’ என்பது எபிரெய உருவகத்தைத் தெளிவாகத் தக்கவைக்கிறது.
- source_word: בְּשָׁלֹם
  choice: சமாதானமாக
  rationale: שָׁלוֹם இங்கு தண்டனைத் தீர்ப்பின்றி அமைதியான முடிவை அடைவதைக் குறிக்கிறது; ‘சமாதானமாக’ மூலத்தின் கருத்தை இயல்பான தமிழில் தருகிறது.
- source_word: שְׁאֹל
  choice: பாதாளம்
  rationale: எபிரெயச் சொல்லான שְׁאוֹל இறந்தோரின் உலகை அல்லது மரண நிலையைச் சுட்டுகிறது. நவீனத் தமிழ் வேதாகம நடையில் ‘பாதாளம்’ அந்தக் கருத்தை ‘கல்லறை’ என்று குறுக்காமல் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: שְׁאֹל என்பதன் மொழிபெயர்ப்பு
  choice: பாதாளம்
  alternative: கல்லறை / இறந்தோரின் உலகம்
  rationale: ‘பாதாளம்’ மூலச்சொல்லின் பரந்த கருத்தைத் தக்கவைக்கிறது; வெறும் புதைக்கப்படும் இடம் எனக் குறுக்கவோ, பிற்கால நரகக் கருத்தை வெளிப்படையாகத் திணிக்கவோ இல்லை.
- issue: וְלֹא תוֹרֵד என்பதிலுள்ள காரணவினை
  choice: இறங்கவிடாதே
  alternative: இறக்கிவிடாதே / இறங்கச் செய்யாதே
  rationale: இந்த வாசகம் யோவாப் அமைதியாக இறக்க அனுமதிக்கப்படக் கூடாது என்ற கருத்தைக் கொண்டிருந்தாலும், மரணத்தை நேரடியாகச் சொல்லாமல் மூலத்திலுள்ள ‘கீழே இறங்குதல்’ என்ற உருவகத்தையும் காரணவினையையும் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘நரைத்த தலை’ மற்றும் ‘பாதாளத்தில் இறங்குதல்’ ஆகிய எபிரெய உருவகங்கள் பாதுகாக்கப்பட்டுள்ளன. பிரதான உரையிலுள்ள [a] குறி தொடர்புடைய மாற்று மொழிபெயர்ப்பைச் சுட்டுகிறது.
