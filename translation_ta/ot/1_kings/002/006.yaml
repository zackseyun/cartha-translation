review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the charge to act with wisdom and the causative force of וְלֹא תוֹרֵד. However, rendering שְׁאוֹל as “பாதாளம்” can readily evoke a later, more specifically punitive underworld in modern Tamil. Retaining the Hebrew term with an explanatory note better preserves the source term's deliberate breadth.
  naturalness: “அவனுடைய நரைத்த தலை ... இறங்கவிடாதே” is understandable, but the inanimate subject plus “விடாதே” is somewhat stiff. “இறங்காதபடி செய்” is natural, dignified Tamil and clearly retains the causative sense.
  terminology: “ஷியோல்” preserves the Hebrew term without selecting either “கல்லறை” or a doctrinally narrowed sense of “பாதாளம்.” “நரைத்த தலை” appropriately retains the Hebrew idiom.
  issues:
  - severity: medium
    issue: “பாதாளம்” may over-specify Sheol.
    rationale: In current Tamil usage it can suggest hell or a punitive netherworld. The Hebrew שְׁאוֹל may denote the realm of the dead more broadly; transliteration plus a note preserves this ambiguity.
  - severity: low
    issue: The Sheol terminology lacks an explanatory footnote.
    rationale: Since the main text retains a source-world term, readers need a brief non-doctrinal explanation, comparable to the English audit trail.
  - severity: low
    issue: “இறங்கவிடாதே” is less idiomatic with “நரைத்த தலை.”
    rationale: “இறங்காதபடி செய்” expresses the causative prohibition smoothly while preserving the Hebrew imagery.
  revised_text: உன் ஞானத்தின்படி செய்; அவனுடைய நரைத்த தலை சமாதானமாக ஷியோலுக்கு இறங்காதபடி செய்.[a][b]
