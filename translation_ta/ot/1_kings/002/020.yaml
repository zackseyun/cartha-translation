  yaml_path: translation/ot/1_kings/002/020.yaml
  text: She said, “I am asking one small request of you; do not turn away my face.” And the king said to her, “Ask, my mother, for I will not turn away your face.”
translation:
  language: ta
  text: அவள், “ஒரே ஒரு சிறிய வேண்டுகோளை உம்மிடம் கேட்கிறேன்; என் வேண்டுகோளை மறுக்காதீர்[a]” என்றாள். அதற்கு அரசன் அவளிடம், “என் தாயே, கேளுங்கள்; நான் உங்கள் வேண்டுகோளை மறுக்கமாட்டேன்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில் சொல்லுக்குச் சொல், “என் முகத்தைத் திருப்பாதீர்.” இது ஒருவரின் வேண்டுகோளை மறுக்காதிருப்பதைக் குறிக்கும் மரபுத்தொடர்; வசனத்தின் இறுதியிலும் இதே சொல்லாட்சி மீண்டும் வருகிறது.
    reason: தமிழ் உரையில் சூழலுக்கேற்ற பொருளைத் தெளிவாகத் தருகிறது; அதேவேளையில் மூல எபிரேய உருவகமும் இருமுறை வரும் இணை அமைப்பும் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
lexical_decisions:
- source_word: שְׁאֵלָה אַחַת קְטַנָּה
  choice: ஒரே ஒரு சிறிய வேண்டுகோள்
  rationale: ‘ஒரு சிறிய வேண்டுகோள்’ என்ற மூலத்தின் தாழ்மையான கோரிக்கை நடையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; אַחַת என்பதன் ‘ஒன்று’ என்ற வலியுறுத்தலை ‘ஒரே ஒரு’ காக்கிறது.
- source_word: אַל תָּשֶׁב אֶת פָּנָי / לֹא אָשִׁיב אֶת פָּנָיִךְ
  choice: என் முகத்தைத் திருப்பி அனுப்பிவிடாதீர் / உங்கள் முகத்தைத் திருப்பி அனுப்பமாட்டேன்
  rationale: ‘ஒருவரின் முகத்தைத் திருப்பி அனுப்புதல்’ என்ற எபிரேய உருவகத்தை இரு இடங்களிலும் இணையாகக் காக்கிறது; சூழலில் இது வேண்டுகோளை மறுக்காதிருப்பதைக் குறிக்கிறது.
- source_word: אִמִּי
  choice: என் தாயே
  rationale: ‘என் தாய்’ என்ற நேரடியான உறவுமுறையையும் அழைப்புமுறையையும் காக்கிறது.
