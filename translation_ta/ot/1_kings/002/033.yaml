base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/033.yaml
  text: So their blood shall return on the head of Joab and on the head of his offspring forever[a], but for David and for his offspring and for his house and for his throne, there shall be peace forever from Yahweh.
translation:
  language: ta
  text: அவர்களுடைய இரத்தம் யோவாபின் தலையின்மேலும் அவன் சந்ததியின் தலையின்மேலும் என்றென்றும் திரும்பிவரும்[a]. ஆனால் தாவீதுக்கும் அவன் சந்ததிக்கும் அவன் வீட்டுக்கும் அவன் அரியணைக்கும் யாவேயிடமிருந்து என்றென்றும் சமாதானம் உண்டாகும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில் நேரடியாக, “அவர்களுடைய இரத்தம்.” இது சிந்தப்பட்ட இரத்தத்திற்கான குற்றப்பொறுப்பும் அதன் விளைவும் குற்றவாளியின்மேல் வருவதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁבוּ
  choice: திரும்பும்
  rationale: இச்சூழலில் இது நீதித்தீர்ப்பை அறிவிக்கும் எதிர்காலப் பொருளைத் தருகிறது. குற்றத்தின் விளைவு குற்றவாளியிடமே திரும்பிவருவதைக் குறிக்கும் எபிரேய உருவகத்தையும் காக்கிறது.
- source_word: דְמֵיהֶם
  choice: அவர்களுடைய இரத்தப்பழி
  rationale: சொல்லுக்கு நேரான பொருள் ‘அவர்களுடைய இரத்தம்’; இங்கு கொல்லப்பட்டவர்களின் இரத்தத்திற்கான பொறுப்பைக் குறிக்கும் மரபுத்தொடர் என்பதால், நவீனத் தமிழில் புரியும்படி ‘இரத்தப்பழி’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: בְּרֹאשׁ
  choice: தலையின்மேல்
  rationale: குற்றப்பொறுப்பும் அதன் விளைவும் ஒருவர்மீது விழுவதைக் குறிக்கும் சட்டநீதிசார் உருவகத்தைத் தக்கவைக்கிறது.
- source_word: זַרְעוֹ
  choice: அவன் சந்ததி / அவர் சந்ததி
  rationale: பின்வரும் தலைமுறைகளை ஒட்டுமொத்தமாகக் குறிக்கும் சொல்லாக ‘சந்ததி’ இயல்பாகவும் சுருக்கமாகவும் உள்ளது; யோவாபுக்கும் தாவீதுக்கும் உரிய மரியாதை நிலைக்கு ஏற்ப சுட்டுப்பெயர் வேறுபடுத்தப்பட்டுள்ளது.
- source_word: לְעֹלָם / עַד עוֹלָם
  choice: என்றென்றும்
  rationale: நீதித்தீர்ப்பும் அரச வம்சத்துக்கான சமாதானமும் நீடித்திருப்பதை வலிமையாக வெளிப்படுத்துகிறது.
- source_word: יִהְיֶה שָׁלוֹם
  choice: சமாதானம் உண்டாகும்
  rationale: שָׁלוֹם என்பதன் சமாதானம், நல்வாழ்வு, நிலைத்தன்மை ஆகிய விரிந்த பொருட்களைச் சுருக்காமல், தமிழில் இயல்பான இருப்புநிலை வாக்கியமாக வழங்குகிறது.
- source_word: לְדָוִד וּלְזַרְעוֹ וּלְבֵיתוֹ וּלְכִסְאוֹ
  choice: தாவீதுக்கும், அவர் சந்ததிக்கும், அவர் குடும்பத்துக்கும், அவர் அரியணைக்கும்
  rationale: மீண்டும் மீண்டும் வரும் לְ என்பதன் பயனுறு உறவை ‘-க்கும்’ எனக் காக்கிறது. בַּיִת இங்கு அரச வம்சக் குடும்பத்தையும், כִּסֵּא அரசாட்சியையும் குறித்தாலும், அவற்றின் உருவகத் தன்மையை முறையே ‘குடும்பம்’, ‘அரியணை’ என்று தக்கவைக்கிறது.
- source_word: מֵעִם יְהוָה
  choice: யாவேயிடமிருந்து
  rationale: சமாதானத்தின் மூலமாக உடன்படிக்கையின் தேவன் வெளிப்படையாகக் குறிப்பிடப்படுகிறார்; தெய்வீகப் பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: யோவாபின் வம்சத்துக்கான தீர்ப்புக்கும் தாவீதின் வம்சத்துக்கான சமாதானத்துக்கும் இடையிலான மாறுபாடு
  choice: ‘ஆனால் தாவீதுக்கும்...’ என்று வெளிப்படையான எதிர்மறை இணைப்பைப் பயன்படுத்துதல்
  alternative: ‘தாவீதுக்கும்...’ என்று எளிய இணைப்பை மட்டும் பயன்படுத்துதல்
  rationale: எபிரேய இணைப்புச்சொல் வடிவத்தில் ‘மற்றும்’ என்றாலும், இங்கு யோவாபின்மீதான தீர்ப்புக்கும் தாவீதுக்கான சமாதானத்துக்கும் தெளிவான மாறுபாடு உள்ளது. ‘ஆனால்’ என்பது புதிய இறையியல் கருத்தைச் சேர்க்காமல் அந்த உரைநடை உறவைத் தெளிவாக்குகிறது.
- issue: அரச வம்சச் சூழலில் שָׁלוֹם என்பதன் பொருள்
  choice: ‘சமாதானம்’ என்று மொழிபெயர்த்து அதன் விரிந்த உடன்படிக்கை மற்றும் வம்சநிலைப் பொருளைத் திறந்தவாறே விடுதல்
  alternative: ‘நல்வாழ்வு’ அல்லது ‘செழிப்பு’
  rationale: இச்சொல் அமைதி மட்டுமன்றி நலம், நிலைத்தன்மை, பாதுகாப்பு ஆகியவற்றையும் உள்ளடக்கலாம். ‘சமாதானம்’ அதன் இறையியல் அகலத்தை குறுகச் செய்யாது.
- issue: யோவாபின் சந்ததியின்மீது இரத்தப்பழி நீடிப்பதாக வரும் கடினமான கூற்று
  choice: மூலத்தின் கூற்றை மென்மைப்படுத்தாமல் ‘அவன் சந்ததியின் தலையின்மேலும் என்றென்றும்’ என்று காக்குதல்
  alternative: யோவாபின் தனிப்பட்ட குற்றவிளைவாக மட்டும் மாற்றிக் கூறுதல்
  rationale: மூல உரை வம்சத் தொடர்ச்சியை வெளிப்படையாகக் குறிப்பிடுகிறது. அதன் இறையியல் மற்றும் அறநெறிசார் பதற்றத்தை மொழிபெயர்ப்பு தானாகத் தீர்க்கக் கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘தலையின்மேல் திரும்பும்’, ‘குடும்பம்’, ‘அரியணை’ ஆகிய மூல உருவகங்கள் காக்கப்பட்டுள்ளன; கடினமான வம்சத் தீர்ப்பும் சமாதான வாக்குறுதியும் மென்மைப்படுத்தப்படவில்லை.
