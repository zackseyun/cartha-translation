  yaml_path: translation/ot/1_kings/002/010.yaml
  text: Then David slept with his fathers and was buried in the city of David[a].
translation:
  language: ta
  text: பின்பு தாவீது தன் முன்னோர்களோடு துயில்கொண்டார்;[a] தாவீதின் நகரத்தில் அடக்கம் செய்யப்பட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தன் முன்னோர்களோடு துயில்கொண்டார்” என்பது இறந்ததைக் குறிக்கும் வழக்கமான எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: நித்திரையடைந்து
  rationale: שׁכב என்பதன் அடிப்படைப் பொருள் ‘படுத்துக்கொள்/உறங்கு.’ அரசர்களின் மரண அறிவிப்புகளில் இது இறப்பைக் குறிக்கும் மரபுவழக்காக வருகிறது. ‘நித்திரையடைந்தார்’ என்பது அந்த எபிரெய உருவகத்தைத் தமிழில் இயல்பாகத் தக்கவைக்கிறது.
- source_word: עִם אֲבֹתָיו
  choice: தன் மூதாதையரோடு
  rationale: இது மரண அறிவிப்புகளில் வரும் நிலையான எபிரெய சொற்றொடர். ‘பிதாக்களோடு’ என்பதைவிட ‘மூதாதையரோடு’ என்பது இன்றைய பொதுத் தமிழில் வம்ச முன்னோர்களைக் குழப்பமின்றி உணர்த்துகிறது.
- source_word: וַיִּקָּבֵר
  choice: அடக்கம் செய்யப்பட்டார்
  rationale: நிஃபால் வடிவம் இங்கு செயப்பாட்டு பொருளில் ‘அடக்கம் செய்யப்பட்டார்’ எனப் பொருள்படுகிறது; இது இயல்பான, கண்ணியமான தமிழ் நடை.
- source_word: בְּעִיר דָּוִד
  choice: தாவீதின் நகரத்தில்
  rationale: இது தாவீதோடு தொடர்புடைய கோட்டைநகரப் பகுதிக்கான நிலையான இடப்பெயர். எபிரெய கட்டமைப்பைத் தெளிவாகப் பிரதிபலிக்கிறது.
- source_word: וַ
  choice: பின்பு
  rationale: முன்னொட்டு வாவ் கதைநிகழ்வை அடுத்த கட்டத்துக்கு நகர்த்துகிறது; ‘பின்பு’ தமிழில் இயல்பான நிகழ்வரிசையைக் காட்டுகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான வரலாற்று நடையைப் பயன்படுத்துகிறது. எபிரெய மரண மரபுத்தொடரின் உருவகம் அடிக்குறிப்புடன் பாதுகாக்கப்பட்டுள்ளது.
