base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/039.yaml
  text: At the end of three years[a], two servants of Shimei ran away to Achish son of Maacah, king of Gath. And they told Shimei, saying, “Look, your servants are in Gath.”
translation:
  language: ta
  text: மூன்று ஆண்டுகளின் முடிவில், சிமெயியின் அடிமைகள்[a] இருவர் காத்தின் அரசனான மாக்காவின் மகன் ஆகீஷிடம் தப்பியோடினார்கள். சிமெயியிடம், “இதோ, உன் அடிமைகள் காத்தில் இருக்கிறார்கள்” என்று தெரிவித்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பணியாளர்கள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் இரு பொருள்களையும் தரக்கூடும்; இங்கு அவர்கள் தங்கள் எஜமானிடமிருந்து தப்பியோடியதால் ‘அடிமைகள்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקֵּץ שָׁלֹשׁ שָׁנִים
  choice: மூன்று ஆண்டுகளின் முடிவில்
  rationale: மூன்றாண்டுக் காலப்பகுதியின் முடிவுப் புள்ளியைக் குறிக்கும் எபிரெயச் சொற்றொடரைத் தெளிவாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: וַיִּבְרְחוּ
  choice: தப்பியோடினார்கள்
  rationale: ברח என்பதிலுள்ள ஓடிப்போதல் மற்றும் எஜமானிடமிருந்து தப்பித்தல் ஆகிய இரு கருத்துகளையும் சூழலுக்கேற்றவாறு வெளிப்படுத்துகிறது.
- source_word: עֲבָדִים / עֲבָדֶיךָ
  choice: அடிமைகள் / உன் அடிமைகள்
  rationale: עבד என்பது பணியாளர் அல்லது அடிமை என இருவகையில் பொருள்படலாம்; இங்கு அவர்கள் எஜமானிடமிருந்து தப்பியோடியதும் பின்னர் மீட்கப்படுவதும் பிணைக்கப்பட்ட அடிமை நிலையைக் குறிப்பதால் ‘அடிமைகள்’ பொருத்தமானது.
- source_word: אֶל אָכִישׁ
  choice: ஆகீஷிடம்
  rationale: ஒரு நபரை நோக்கிய இயக்கத்தைத் தமிழில் இயல்பாகக் குறிக்கிறது.
- source_word: בֶּן מַעֲכָה מֶלֶךְ גַּת
  choice: காத்தின் அரசனான மாக்காவின் மகன்
  rationale: ஆகீஷின் தந்தையையும் அரசப் பதவியையும் தெளிவான இயல்பான தமிழ் அடைமொழித் தொடரில் வழங்குகிறது.
- source_word: וַיַּגִּידוּ לְשִׁמְעִי לֵאמֹר
  choice: அப்போது சிலர் சிமெயியிடம் … என்று தெரிவித்தார்கள்
  rationale: வினையின் குறிப்பிடப்படாத மூன்றாம் நபர் பன்மை எழுவாயை ‘சிலர்’ என்று வெளிப்படுத்தி, எபிரெய நேர்கூற்று அறிமுகத்தை இயல்பான தமிழில் தருகிறது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் எபிரெயச் சுட்டிடைச்சொல்லின் உடனடித் தன்மையை மரியாதையான நவீன தமிழில் பாதுகாக்கிறது.
- source_word: בְּגַת
  choice: காத்தில்
  rationale: நகருக்குள் இருப்பிடத்தைக் குறிக்கும் ב முன்னிடைச்சொல்லை இயல்பாக வழங்குகிறது.
