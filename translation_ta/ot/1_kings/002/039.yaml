translation_notes:
  register: நவீன நிலையான தமிழில், இயல்பானதாயும் கண்ணியமானதாயும் மொழிபெயர்க்கப்பட்டது. எபிரெயக் கதைநடையின் தேவையற்ற தொடக்க இணைப்பைத் தமிழில் சேர்க்காமல், நிகழ்வுகளின் தொடரை ‘அப்போது’ மூலம் இயல்பாகக் காட்டுகிறது. பெயர்கள் எபிரெய உச்சரிப்பை அணுகும் வகையில் சிமெயி, ஆகீஷ், மாக்கா, காத் என ஒலிபெயர்க்கப்பட்டுள்ளன.
