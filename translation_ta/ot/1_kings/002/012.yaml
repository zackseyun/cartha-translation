  source_fidelity: 'முதன்மை உரை எபிரேய மூலத்தின் வரிசையையும் பொருளையும் நன்றாகப் பின்பற்றுகிறது: சாலொமோன் தாவீதின் அரியணையில் அமர்ந்ததும், அவனுடைய מַלְכוּת மிகுந்த உறுதியுடன் நிலைபெற்றதும் தெளிவாக உள்ளது. எனினும், ‘நிலைநிறுத்தப்பட்டது’ என்பது வெளிப்படையான செயற்படுத்துபவரைச் சற்றே உணர்த்துகிறது; நிஃபால் வடிவத்தின் நிலைபெற்ற/உறுதிப்பட்ட விளைவு நுணுக்கத்தை ‘நிலைபெற்றது’ இயல்பாகக் காட்டுகிறது.'
