  text: וּ/שְׁלֹמֹ֕ה יָשַׁ֕ב עַל כִּסֵּ֖א דָּוִ֣ד אָבִ֑י/ו וַ/תִּכֹּ֥ן מַלְכֻת֖/וֹ מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/012.yaml
  text: And Solomon sat on the throne of David his father[a], and his kingdom was firmly established.
translation:
  language: ta
  text: சாலொமோன் தன் தந்தை தாவீதின் அரியணையில் அமர்ந்தான்; அவனுடைய அரசாட்சி மிகவும் உறுதியாக நிலைபெற்றது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனுடைய ஆட்சி மிகுந்த பாதுகாப்புடன் நிலைபெற்றது”; அல்லது, “அவனுடைய அரசுரிமை மிகவும் உறுதியாக நிலைபெற்றது.”
    reason: מַלְכוּת என்பதற்கு ஆட்சி அல்லது அரசுரிமை என்ற பொருளும், כון மற்றும் מְאֹד இணைந்து தரும் மிகுந்த உறுதி/பாதுகாப்பு நுணுக்கமும் இருப்பதைச் சுட்டுகிறது.
lexical_decisions:
- source_word: יָשַׁב
  choice: அமர்ந்தான்
  rationale: עַל כִּסֵּא என்பதுடன் வரும் அரச வாரிசுரிமைச் சூழலில், அரியணையை ஏற்று அதில் ஆட்சி செய்யத் தொடங்கியதைக் குறிக்கிறது; மூலத்தின் அரியணை உருவகத்தையும் நேரடியாகப் பேணுகிறது.
- source_word: כִּסֵּא
  choice: அரியணை
  rationale: தாவீதின் அரச பதவியையும் அரச வாரிசுரிமையையும் குறிக்கும் சூழலில், பொதுவான ‘இருக்கை’ என்பதைவிட ‘அரியணை’ என்பதே தெளிவான பொருள்.
- source_word: אָבִיו
  choice: தன் தந்தை
  rationale: தாவீது சாலொமோனின் நேரடியான தந்தை; ‘தன்’ என்பது தமிழில் எழுவாயான சாலொமோனுடனான உறவை இயல்பாகத் தெளிவுபடுத்துகிறது.
- source_word: וַתִּכֹּן
  choice: உறுதியாக நிலைநிறுத்தப்பட்டது
  rationale: כון என்பதன் நிஃபால் வடிவம் உறுதிப்படுத்தப்பட்ட, நிலைபெற்ற முடிவுநிலையைக் குறிக்கிறது; செயப்படுபொருள் சார்ந்த நுணுக்கமும் பாதுகாக்கப்படுகிறது.
- source_word: מַלְכֻתוֹ
  choice: அவனுடைய அரசாட்சி
  rationale: מַלְכוּת என்பது ராஜ்யம், அரசாட்சி, ஆட்சிக்காலம் ஆகிய தொடர்புடைய பொருள்களைக் கொள்ளலாம். இங்கு சாலொமோனின் அரச அதிகாரமும் ஆட்சியும் நிலைபெற்றதை ‘அரசாட்சி’ இயல்பாகக் காட்டுகிறது; பிற சாத்தியங்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: מְאֹד
  choice: மிகவும் உறுதியாக
  rationale: מְאֹד தரும் வலியுறுத்தலைத் தமிழில் இயல்பாக வினையடைத் தொடரால் வெளிப்படுத்துகிறது; வெறும் நிலைபெறுதல் அல்ல, மிகுந்த உறுதிப்பாடு என்பதைக் காட்டுகிறது.
theological_decisions:
- issue: தாவீதின் அரியணை தொடர்பான அரச வாரிசுரிமை மொழி
  choice: சாலொமோன் தாவீதின் அரியணையில் அமர்ந்து, அவனுடைய அரசாட்சி உறுதியாக நிலைபெற்றது என்ற வரலாற்றுக் கூற்றாக மொழிபெயர்க்கப்பட்டது.
  alternative: வம்சத்தின் இறையியல் சட்டப்பூர்வத்தையோ பிற்கால மேசியா சார்ந்த பொருளையோ வெளிப்படையாக வலியுறுத்துதல்.
  rationale: இந்த வசனம் நேரடியாகச் சாலொமோனின் அரியணையேற்றத்தையும் அவனது ஆட்சியின் உறுதிப்பாட்டையுமே விவரிக்கிறது. தாவீதின் அரியணைக்கு விரிந்த வேதாகம முக்கியத்துவம் இருந்தாலும், இவ்வசனம் கூறாத பிற்கால இறையியல் முடிவுகள் முதன்மை உரையில் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘அரியணை’ என்ற அரச உருவகம் பேணப்பட்டு, ‘அரசாட்சி’ என்பதன் மூலம் ஆட்சி, அரசுரிமை, ராஜ்யம் ஆகியவற்றுக்கிடையிலான மூலமொழியின் பொருள் பரப்பு முற்றிலும் ஒரே விளக்கமாகக் குறுக்கப்படாமல் வைக்கப்பட்டுள்ளது.
