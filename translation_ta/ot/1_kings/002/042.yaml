base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/042.yaml
  text: Then the king sent and called for Shimei and said to him[a], “Did I not make you swear by Yahweh and warn you, saying, ‘On the day you go out and go anywhere at all, know for certain that you shall surely die’? And you said to me, ‘The word is good[c][b]; I have heard.’”
translation:
  language: ta
  text: அப்போது அரசன் ஆளனுப்பி சிமெயியை வரவழைத்து, அவனிடம், “நான் யாவேவின் பெயரில் உன்னை ஆணையிடச் செய்து, ‘நீ வெளியேறி எங்கேயாவது செல்லும் நாளில்[b], நீ நிச்சயமாகச் சாவாய் என்பதை உறுதியாக அறிந்துகொள்’ என்று உன்னை எச்சரிக்கவில்லையா[a]? நீ என்னிடம், ‘இந்த வார்த்தை நல்லது[c]; நான் கேட்டேன்’ என்று சொன்னாயே” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உனக்கு எதிராகச் சாட்சியளிக்கவில்லையா?” அல்லது, “உன்னைக் கடுமையாகக் கட்டளையிடவில்லையா?”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “இங்கேயோ அங்கேயோ சென்றால்”; இது எங்கேயாவது செல்வதைக் குறிக்கும் மொழிமரபு.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “இந்தக் காரியம் நல்லது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשְׁבַּעְתִּיךָ בַיהוָה
  choice: உன்னை யாவேமீது ஆணையிடச் செய்து
  rationale: שבע என்பதன் ஹிப்இல் வடிவிலுள்ள காரணவினைப் பொருளையும், בַיהוָה என்ற ஆணைச் சூத்திரத்தையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: וָאָעִד בְּךָ
  choice: உன்னை எச்சரிக்கவில்லையா
  rationale: இங்கு עוד என்பதன் ஹிப்இல் வடிவம் முறையான எச்சரிக்கை அல்லது கடுமையான கட்டளையைக் குறிக்கலாம்; சூழலுக்கு இயல்பாக ‘எச்சரித்தல்’ பொருந்துகிறது, சட்டரீதியான மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְהָלַכְתָּ אָנֶה וָאָנָה
  choice: எங்கேயாவது சென்றால்
  rationale: ‘இங்கேயோ அங்கேயோ செல்’ என்ற எபிரெய மொழிமரபின் வரம்பற்ற இடப்பொருளை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: יָדֹעַ תֵּדַע
  choice: உறுதியாக அறிந்துகொள்
  rationale: வினையெச்ச முழுவடிவமும் வினைமுற்றும் சேர்ந்துள்ள வலியுறுத்தலை தமிழில் ‘உறுதியாக’ என்பதன் மூலம் காக்கிறது.
- source_word: מוֹת תָּמוּת
  choice: நிச்சயமாகச் சாவாய்
  rationale: எபிரெய வலியுறுத்தல் அமைப்பின் மரண நிச்சயத்தை இயல்பாகவும் கடுமையாகவும் தெரிவிக்கிறது.
- source_word: טוֹב הַדָּבָר
  choice: இந்த வார்த்தை நல்லது
  rationale: דבר என்பதன் ‘வார்த்தை/கூற்று’ என்ற பேச்சுச் செயல் பொருளைப் பாதுகாக்கிறது; ‘இந்தக் காரியம் நல்லது’ என்பதும் சாத்தியம்.
- source_word: שָׁמָעְתִּי
  choice: நான் கேட்டேன்
  rationale: ‘கேட்டேன்’ என்ற நேரடிப் பொருளைக் காக்கிறது; ஏற்றுக்கொள்ளுதல் அல்லது கீழ்ப்படிதல் என்ற உட்குறிப்பை உரைக்குள் வெளிப்படையாகச் சேர்க்கவில்லை.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: யெகோவா
  rationale: மெய்யெழுத்துகளால் எழுதப்பட்ட உடன்படிக்கைப் பெயரை ஒரு பட்டப்பெயராக மாற்றாமல், ஏற்றுக்கொள்ளப்பட்ட ஒலிபெயர்ப்பின் மூலம் தனிப்பெயராகப் பாதுகாக்கிறது.
- issue: שָׁמָעְתִּי என்பதில் ஏற்றுக்கொள்ளுதல் அல்லது கீழ்ப்படிதல் உள்ளதா
  choice: நான் கேட்டேன்
  alternative: நான் கேட்டு ஏற்றுக்கொண்டேன்
  rationale: சட்ட மற்றும் உடன்படிக்கைச் சூழலில் ‘கேட்பது’ ஏற்றுக்கொள்ளுதலைக் குறிக்கக்கூடும்; இருப்பினும் மூல உரையின் சொற்பொருளை வைத்திருந்து அந்த உட்குறிப்பைத் தீர்மானித்து விடாமல் விடுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், அரசரின் முறையான குற்றச்சாட்டு மற்றும் மரண எச்சரிக்கையின் கடுமை காக்கப்பட்டுள்ளது. மேற்கோளுக்குள் உள்ள மேற்கோள் தெளிவாக அமைக்கப்பட்டு, மூலத்தின் வலியுறுத்தல் அமைப்புகள் இயல்பான தமிழ் வினையடைகளால் வெளிப்படுத்தப்பட்டுள்ளன.
