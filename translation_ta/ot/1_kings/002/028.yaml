base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/028.yaml
  text: And the report came to Joab[a], for Joab had turned after Adonijah, though he had not turned after Absalom[b]. So Joab fled to the tent of Yahweh and took hold of the horns of the altar.
translation:
  language: ta
  text: அந்தச் செய்தி யோவாபுக்கு எட்டியது. ஏனெனில், யோவாப் அதோனியாவின் பக்கம் சாய்ந்திருந்தான்; ஆனால் அப்சலோமின் பக்கம் சாய்ந்திருக்கவில்லை[a]. ஆகவே யோவாப் யாவேயின் கூடாரத்துக்கு ஓடிப்போய், பலிபீடத்தின் கொம்புகளைப் பற்றிக்கொண்டான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதோனியாவை ஆதரித்திருந்தான்; ஆனால் அப்சலோமை ஆதரித்திருக்கவில்லை.” எபிரெய மொழியில் சொல்லுக்குச் சொல், “பின்னால் சாய்ந்திருந்தான்” என்று உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: ‘கொம்புகள்’ என்பவை பலிபீடத்தின் மூலைகளிலிருந்த கொம்பு போன்ற நீட்சிகள். அவற்றைப் பற்றிக்கொள்வது அடைக்கலம் அல்லது இரக்கம் கோரும் செயலாக இருந்தது.
    reason: cultural_note
lexical_decisions:
- source_word: הַשְּׁמֻעָה
  choice: அந்தச் செய்தி
  rationale: இச்சொல் ஒருவரை வந்தடையும் செய்தி அல்லது தகவலைக் குறிக்கிறது. சூழலில் உறுதியற்ற வதந்தி என்பதைக் காட்டிலும் ‘செய்தி’ இயல்பாகப் பொருந்துகிறது.
- source_word: בָּאָה עַד
  choice: எட்டியது
  rationale: ‘ஒருவர்வரை வந்தது’ என்ற எபிரெய மரபுத்தொடரை நவீன தமிழில் இயல்பாகவும் அதன் இயக்க உணர்வைத் தக்கவைத்தும் தெரிவிக்கிறது.
- source_word: נָטָה אַחֲרֵי
  choice: பக்கம் சாய்ந்திருந்தான்
  rationale: சொல்லின் ‘பின்னால்/பக்கம் திரும்புதல் அல்லது சாய்தல்’ என்ற உருவகத்தையும், இங்கு குறிக்கப்படும் அரசியல் சார்பையும் இணைத்துக் காட்டுகிறது. அதோனியா மற்றும் அப்சலோம் பற்றிய இரு கூறுகளிலும் ஒரே சொற்றொடர் மீண்டும் பயன்படுத்தப்பட்டுள்ளது.
- source_word: אֲדֹנִיָּה
  choice: அதோனியா
  rationale: தனிப்பெயர் நவீனத் தமிழில் அடையாளம் காணத்தக்க வகையில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: אַבְשָׁלוֹם
  choice: அப்சலோம்
  rationale: தனிப்பெயர் தமிழில் வழக்கமான, அடையாளம் காணத்தக்க வடிவில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וַיָּנָס
  choice: ஓடிப்போய்
  rationale: அச்சுறுத்தலிலிருந்து அவசரமாகத் தப்பிச் செல்வதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: אֹהֶל יְהוָה
  choice: யாவேயின் கூடாரம்
  rationale: ‘யாவேயின் கூடாரம்’ என்ற மூலத்தின் நேரடியான பொருளைத் தக்கவைத்து, இச்சூழலில் தேவையில்லாத தொழில்நுட்பச் சொல்லைச் சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய நான்கெழுத்துத் திருப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், அதன் பரவலான தமிழ் ஒலிபெயர்ப்பில் வழங்குகிறது.
- source_word: וַיַּחֲזֵק בְּקַרְנוֹת הַמִּזְבֵּחַ
  choice: பலிபீடத்தின் கொம்புகளைப் பற்றிக்கொண்டான்
  rationale: உடல்சார்ந்த செயலை நேரடியாகத் தெரிவிக்கிறது; அதன் சட்ட அல்லது சமயப் பொருளை முதன்மை உரையில் தேவையின்றி விளக்கவில்லை.
- source_word: קַרְנוֹת הַמִּזְבֵּחַ
  choice: பலிபீடத்தின் கொம்புகள்
  rationale: பலிபீடத்தின் மூலைகளிலிருந்த கொம்பு போன்ற நீட்சிகளுக்கான நேரடி மொழிபெயர்ப்பு; அறியாத வாசகர்களுக்கான விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட இறைப்பெயர் நேரடியாக உள்ளது. அதைப் பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் தன்மையைப் பாதுகாக்கிறது.
- issue: נָטָה אַחֲרֵי என்ற அரசியல் மரபுத்தொடரை உருவகமாக வைத்திருப்பதா அல்லது விளக்கமாக மொழிபெயர்ப்பதா
  choice: பக்கம் சாய்ந்திருந்தான்
  alternative: ஆதரித்திருந்தான்; பின்பற்றியிருந்தான்
  rationale: ‘சாய்தல்’ என்ற உருவகத்தையும் அரசியல் சார்பையும் தமிழில் புரியத்தக்கவாறு தக்கவைக்கிறது; இரு அரச குமாரர்களைப் பற்றிய கூறுகளிலும் மூலத்தின் மீளுரையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘பக்கம் சாய்தல்’ அரசியல் ஆதரவை உணர்த்துவதோடு எபிரெய உருவகத்தையும் மீளுரையையும் பாதுகாக்கிறது. வாக்கியங்களின் நீளம் இயல்பான வாசிப்புக்காகச் சுருக்கப்பட்டுள்ளது.
