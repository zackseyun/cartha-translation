translation:
  language: ta
  text: அதற்கு அவள், “சூனேமைச் சேர்ந்த அபிஷாகை உங்கள் சகோதரரான அதோனியாவுக்கு மனைவியாகக் கொடுக்கட்டும்” என்றாள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: அதற்கு அவள் ... என்றாள்
  rationale: வாவ் தொடர்கதை ஓட்டத்தை முன்னெடுக்கிறது; முந்தைய உரையாடலுக்கான பதிலாக இயல்பான நவீனத் தமிழில் ‘அதற்கு’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: יֻתַּן
  choice: கொடுக்கட்டும்
  rationale: செயப்பாட்டு வேண்டுகோள் வினைமுறையின் முன்மொழிவு/வேண்டுகோள் நுணுக்கத்தைத் தமிழின் வியங்கோள் வடிவம் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֲבִישַׁג
  choice: அபிஷாகை
  rationale: தனிப்பெயர் ஒலிபெயர்க்கப்பட்டு, நேர்ச்செயப்படுபொருளைக் குறிக்க ‘ஐ’ வேற்றுமை உருபு சேர்க்கப்பட்டுள்ளது.
- source_word: הַשֻּׁנַמִּית
  choice: சூனேமைச் சேர்ந்த
  rationale: பெண்ணின் ஊர்சார்பைக் குறிக்கும் எபிரெயப் பெயரடை, சாதாரண வாசகருக்குத் தெளிவான இயல்பான தமிழில் இடப்பிறப்பாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: לַאֲדֹנִיָּהוּ
  choice: அதோனியாவுக்கு
  rationale: לְ பெறுநரைக் குறிக்கிறது; தமிழில் நான்காம் வேற்றுமை உருபு இதை நேராக வெளிப்படுத்துகிறது.
- source_word: אָחִיךָ
  choice: உங்கள் சகோதரன்
  rationale: இரண்டாம் நபர் ஆண்பால் ஒருமை பின்னொட்டு சாலொமோனை நேரடியாகக் குறிக்கிறது; அரசரிடம் பேசும் சூழலுக்கேற்ப மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது.
- source_word: לְאִשָּׁה
  choice: மனைவியாக
  rationale: திருமண உறவைக் குறிக்கும் கட்டமைப்பைத் தெளிவாகவும் சுருக்கமாகவும் நவீனத் தமிழில் வழங்குகிறது.
