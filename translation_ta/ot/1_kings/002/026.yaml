base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/026.yaml
  text: And to Abiathar the priest the king said[a], “Go to Anathoth, to your field, for you are a man deserving death; but on this day I will not put you to death, because you carried the ark of the Lord GOD before David my father, and because you shared in all the affliction with which my father was afflicted.”
translation:
  language: ta
  text: அரசன் ஆசாரியனான அபியத்தாரிடம், “ஆனதோத்துக்கு, உன் நிலத்திற்குப் போ. நீ மரணத்திற்குரியவன்[a]. ஆனாலும் இன்று நான் உன்னைக் கொல்லமாட்டேன். ஏனெனில் நீ என் தந்தையான தாவீதின் முன்னிலையில் ஆண்டவராகிய யாவேயின் பெட்டியைச் சுமந்தாய்; மேலும், என் தந்தை பட்ட துன்பங்களிலெல்லாம் நீயும் துன்பப்பட்டாய்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் சொல்லர்த்தமாக, “மரணத்தின் மனிதன்”; அதாவது, மரணதண்டனைக்கு உரியவன் அல்லது கொல்லப்பட வேண்டிய நிலையில் உள்ளவன்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲנָתֹת
  choice: ஆனதோத்து
  rationale: இது ஓர் இடப்பெயர்; எபிரெய ஒலிப்புக்கு ஏற்றவாறு தமிழில் ஒலிபெயர்க்கப்பட்டது. வேற்றுமை உருபுடன் ‘ஆனதோத்திலுள்ள’ என்று இயல்பாக அமைக்கப்பட்டது.
- source_word: עַל שָׂדֶיךָ
  choice: உன் நிலத்துக்கு
  rationale: சொல்லர்த்தம் ‘உன் வயல்/நிலத்தின்மேல்’. சூழலில் அபியத்தார் தமது சொந்த நிலத்திற்குத் திருப்பி அனுப்பப்படுவதால், நவீன தமிழில் இயல்பான ‘உன் நிலத்துக்கு’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: אִישׁ מָוֶת
  choice: மரணத்திற்குரியவன்
  rationale: சொல்லர்த்தமான ‘மரணத்தின் மனிதன்’ என்பது மரணதண்டனைக்கு உரியவன் அல்லது கொல்லப்படத் தகுந்தவன் என்ற எபிரெய மரபுத்தொடர். அதன் நீதித்துறைச் சார்ந்த பொருளைத் தெளிவாகவும் சுருக்கமாகவும் தருகிறது.
- source_word: אֲמִיתֶךָ
  choice: நான் உன்னைக் கொல்லமாட்டேன்
  rationale: מות என்பதன் ஹிஃபில் வடிவம் ‘மரணமடையச் செய்/கொல்’ என்று பொருள்படும். தமிழில் நேரடியும் இயல்புமான வடிவம் பயன்படுத்தப்பட்டது; சூழல் இது அரசனால் விதிக்கப்படும் மரணதண்டனை என்பதைத் தெளிவாக்குகிறது.
- source_word: נָשָׂאתָ אֶת אֲרוֹן אֲדֹנָי יְהוִה
  choice: ஆண்டவராகிய யாவேயின் பெட்டியைச் சுமந்தாய்
  rationale: נשא என்பது இங்கு பெட்டியை உடலால் சுமந்ததைக் குறிக்கிறது. אֲדֹנָי יְהוִה என்ற இரட்டைப் பெயர்ப்பாட்டை மறைக்காமல், இயல்பான தமிழில் ‘ஆண்டவராகிய யாவே’ எனத் தரப்பட்டது.
- source_word: לִפְנֵי דָוִד אָבִי
  choice: என் தந்தை தாவீதுக்கு முன்பாக
  rationale: לִפְנֵי என்பதன் இட/உறவு சார்ந்த ‘முன்பாக, முன்னிலையில்’ என்ற பொருள் பாதுகாக்கப்பட்டது.
- source_word: הִתְעַנִּיתָ ... הִתְעַנָּה
  choice: என் தந்தை பட்ட துன்பங்களிலெல்லாம் நீயும் துன்பப்பட்டாய்
  rationale: இரு தொடர்புடைய வினைவடிவங்களின் திட்டமிட்ட எதிரொலியை ‘துன்பம் ... துன்பப்பட்டாய்’ எனப் பாதுகாக்கிறது; அதேவேளையில் அபியத்தார் தாவீதோடு துன்பத்தைப் பகிர்ந்துகொண்ட கருத்தையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כִּי ... וְכִי
  choice: ஏனெனில் ... மேலும்
  rationale: இரண்டு காரணங்களும் ஒரே ‘ஏனெனில்’ கட்டமைப்புக்குள் இணைக்கப்படுகின்றன; இரண்டாவது காரணத்தை ‘மேலும்’ இயல்பாகத் தொடர்கிறது.
theological_decisions:
- issue: אֲדֹנָי יְהוִה என்ற இணைந்த இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: ஆண்டவராகிய யாவே
  alternative: ஆண்டவராகிய கர்த்தர் / ஆண்டவர் யாவே
  rationale: மூலத்தில் உள்ள אֲדֹנָי (‘ஆண்டவர்’) மற்றும் יהוה (தனிப்பட்ட இறைப்பெயர் ‘யாவே’) இரண்டையும் வெளிப்படையாக வைத்திருக்கிறது; ‘ஆண்டவர் ஆண்டவர்’ போன்ற இயல்பற்ற மறுபடியுரைத்தலைத் தவிர்க்கிறது.
- issue: אִישׁ מָוֶת என்பதிலுள்ள மரணத் தீர்ப்பின் வலிமை
  choice: மரணத்திற்குரியவன்
  alternative: மரணதண்டனைக்கு உரியவன் / மரணத்தின் மனிதன்
  rationale: அபியத்தாரின் குற்றத்திற்கான தண்டனைத் தகுதியைத் தெரிவிக்கிறது; ஆனால் அரசன் அன்றே கொல்லாமல் விடுவது குற்றமின்மையின் அறிவிப்பு என்று மாற்றிப் பொருள்கொள்ளவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் மரியாதையும் வாசிப்புத் தெளிவும் காக்கப்பட்டுள்ளன. அரசனின் நேரடியான தீர்ப்புரையின் கடுமையும், அபியத்தாருக்குக் காட்டப்படும் தற்காலிக இரக்கத்திற்கான இரு காரணங்களும் பாதுகாக்கப்பட்டுள்ளன. ‘பெட்டி’ என்பது אֲרוֹן என்பதற்கான எளிய, பொதுவாகப் புரியும் சொல்; சூழலில் அது உடன்படிக்கைப் பெட்டியைக் குறிக்கிறது.
