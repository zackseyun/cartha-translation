source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר אִמְרִי נָא֙ לִ/שְׁלֹמֹ֣ה הַ/מֶּ֔לֶךְ כִּ֥י לֹֽא יָשִׁ֖יב אֶת פָּנָ֑יִ/ךְ וְ/יִתֶּן לִ֛/י אֶת אֲבִישַׁ֥ג הַ/שּׁוּנַמִּ֖ית לְ/אִשָּֽׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/017.yaml
  text: And he said[a], “Please speak to King Solomon, for he will not refuse you, and let him give me Abishag the Shunammite as a wife.”
translation:
  language: ta
  text: அவன், “தயவுசெய்து சாலொமோன் அரசரிடம் பேசுங்கள்; ஏனெனில் அவர் உங்கள் வேண்டுகோளை மறுக்கமாட்டார்.[a] சூனேம் ஊராளான அபிஷாகை எனக்கு மனைவியாகத் தருமாறு அவரிடம் கேளுங்கள்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லாட்சியாக, “அவர் உங்கள் முகத்தைத் திருப்பமாட்டார்.” இது “அவர் உங்களையோ உங்கள் வேண்டுகோளையோ மறுக்கமாட்டார்” என்று பொருள்படும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִמְרִי נָא
  choice: தயவுசெய்து ... பேசுங்கள்
  rationale: பெண்பால் ஒருமை கட்டளையுடன் வரும் נָא பணிவான வேண்டுகோளை வெளிப்படுத்துகிறது. நவீனத் தமிழில் மரியாதையும் இயல்பும் காக்க இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: לִשְׁלֹמֹה הַמֶּלֶךְ
  choice: சாலொமோன் அரசரிடம்
  rationale: எபிரெயப் பெயரும் அரச பட்டமும் தமிழின் இயல்பான சொல் வரிசையில் தரப்பட்டுள்ளன.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: அவன் பத்சேபாளிடம் வேண்டுவதற்கான காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: לֹא יָשִׁיב אֶת פָּנָיִךְ
  choice: அவர் உங்கள் வேண்டுகோளை மறுக்கமாட்டார்
  rationale: சொல்லாட்சியாக ‘உங்கள் முகத்தைத் திருப்பி அனுப்பமாட்டார்’ என்பது ஒருவரின் விண்ணப்பத்தை மறுக்கமாட்டார் என்ற எபிரெய மரபுத்தொடர். தமிழில் பொருள் தெளிவாக வெளிப்படுத்தப்பட்டுள்ளது; நேரடி உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וְיִתֶּן לִי
  choice: எனக்கு ... தரும்படி அவரிடம் கேளுங்கள்
  rationale: முந்தைய ‘பேசுங்கள்’ என்ற வேண்டுகோளின் உள்ளடக்கத்தை இந்த வினைத் தொடர் கூறுகிறது. தமிழில் வேண்டுகோளின் நோக்கம் தெளிவாகவும் இயல்பாகவும் அமைய இவ்வாறு வடிவமைக்கப்பட்டது.
- source_word: אֲבִישַׁג הַשּׁוּנַמִּית
  choice: சூனேமியப் பெண்ணான அபிஷாகை
  rationale: தனிப்பெயர் ஒலிபெயர்க்கப்பட்டு, ஊர்சார் அடையாளம் நவீனத் தமிழில் புரியும் வகையில் பெயரடைத் தொடராக வழங்கப்பட்டுள்ளது.
- source_word: לְאִשָּׁה
  choice: மனைவியாக
  rationale: இந்த எபிரெயக் கட்டமைப்பு திருமண உறவுக்காக ஒரு பெண்ணைக் கொடுப்பதைக் குறிக்கிறது; ‘மனைவியாக’ என்பது சுருக்கமாகவும் தெளிவாகவும் உள்ளது.
