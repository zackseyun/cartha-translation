translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான ஆனால் பொதுவாசகருக்கு எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. பத்சேபாளை நோக்கிய பெண்பால் ஒருமை வடிவம் தமிழில் மரியாதைப் பன்மையான ‘பேசுங்கள்/கேளுங்கள்’ மூலம் இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது.
