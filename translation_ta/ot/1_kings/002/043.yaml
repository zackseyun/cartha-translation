  text: וּ/מַדּ֕וּעַ לֹ֣א שָׁמַ֔רְתָּ אֵ֖ת שְׁבֻעַ֣ת יְהוָ֑ה וְ/אֶת הַ/מִּצְוָ֖ה אֲשֶׁר צִוִּ֥יתִי עָלֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/043.yaml
  text: Why then have you not kept the oath of Yahweh and the command that I commanded you?[a][b]
translation:
  language: ta
  text: அப்படியானால், நீ ஏன் யாவேயின் பெயரில் நீ செய்த உறுதிமொழியையும்[a] நான் உன்மேல் விதித்த கட்டளையையும்[b] கடைப்பிடிக்கவில்லை?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்பட, “யாவேயின் உறுதிமொழி.” இது யாவேயின் பெயரில் செய்யப்பட்ட அல்லது யாவேக்கு உட்பட்ட உறுதிமொழியைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நான் உனக்குக் கட்டளையிட்ட கட்டளையையும்.” எபிரெயில் சொற்பட, “நான் உன்மேல் கட்டளையிட்ட கட்டளை” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַדּוּעַ
  choice: அப்படியானால், ... ஏன்
  rationale: முன்னுள்ள குற்றச்சாட்டோடு கேள்வியை இயல்பாக இணைக்கிறது; வாவ் இணைப்பையும் מַדּוּעַ என்பதன் ‘ஏன்’ என்ற பொருளையும் வெளிப்படுத்துகிறது.
- source_word: לֹא שָׁמַרְתָּ
  choice: நீ ... கடைப்பிடிக்கவில்லை
  rationale: שׁמר என்பதன் ‘காத்தல்/கடைப்பிடித்தல்’ என்ற கடமை சார்ந்த பொருளை, ஆணைக்கும் கட்டளைக்கும் பொருந்தும் இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: אֵת שְׁבֻעַת יְהוָה
  choice: யாவேக்கு முன்பாகச் செய்த ஆணையை
  rationale: எபிரெயக் கட்டமைப்பு சொற்பட ‘யாவேயின் ஆணை’ என்றாலும், சூழலில் இது யாவே செய்த ஆணை அல்ல; அவருடைய முன்னிலையில் அல்லது பெயரில் செய்யப்பட்ட ஆணை. முதன்மை உரை அந்தச் சூழற்பொருளைத் தெளிவாகக் கூறி, சொற்படியான மாற்றை அடிக்குறிப்பில் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பாகத் தருகிறது.
- source_word: וְאֶת הַמִּצְוָה
  choice: கட்டளையையும்
  rationale: מִצְוָה என்பதன் நேரடியான பொருள் ‘கட்டளை’; அரசரின் ஆணையைக் குறிக்கும் இச்சூழலில் இயல்பாக உள்ளது.
- source_word: אֲשֶׁר צִוִּיתִי עָלֶיךָ
  choice: நான் உனக்கு விதித்த
  rationale: צוה என்பதன் கட்டளையிடுதல் என்ற கருத்தையும், עַל என்பதன் ‘உன்மேல் சுமத்தப்பட்ட கடமை’ என்ற நுணுக்கத்தையும் சுருக்கமாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: שְׁבֻעַת יְהוָה என்ற தொடர்பின் பொருள்
  choice: யாவேக்கு முன்பாகச் செய்த ஆணை
  alternative: யாவேயின் ஆணை
  rationale: சூழலில் சிமேயி அரசனிடம் யாவேயின் பெயரில் அல்லது முன்னிலையில் உறுதியளித்த ஆணையே குறிக்கப்படுகிறது; யாவே தாமே செய்த ஆணை என்று புரிந்துகொள்ளாமல் இருக்க முதன்மை உரை தெளிவுபடுத்துகிறது, அதேவேளை எபிரெயின் சுருக்கமான அமைப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட தெய்வீகப் பெயர் நேரடியாக உள்ளது; ஆகவே பட்டத்தைப் பதிலிடாமல் பெயரை ஒலிபெயர்க்கிறது.
- issue: צִוִּיתִי עָלֶיךָ என்பதிலுள்ள மீளுரையும் עַל நுணுக்கமும்
  choice: நான் உனக்கு விதித்த
  alternative: நான் உனக்குக் கட்டளையிட்ட
  rationale: ‘கட்டளை—கட்டளையிட்டேன்’ என்ற மூலத்தின் வேர்ச்சொல் மீளுரையை விட, தமிழில் இயல்பாகவும் ‘உன்மேல் விதிக்கப்பட்ட கடமை’ என்ற கருத்தை வெளிப்படுத்தவும் ‘விதித்த’ தேர்ந்தெடுக்கப்பட்டது; மாற்று அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், அரசரின் கண்டிப்புக்குரிய கண்ணியமான நேரடி நடையைப் பயன்படுத்துகிறது. ஒருமை ஆண்பால் முகவரியை இயல்பான ‘நீ/உனக்கு’ வடிவில் தருகிறது; இரு அடிக்குறிப்புகளின் குறியீடுகளும் உரையில் இடம்பெற்றுள்ளன.
