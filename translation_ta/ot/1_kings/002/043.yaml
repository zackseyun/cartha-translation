- from: அப்படியானால், நீ ஏன் யாவேக்கு முன்பாகச் செய்த ஆணையையும்[a] நான் உனக்கு விதித்த கட்டளையையும்[b] கடைப்பிடிக்கவில்லை?
  to: அப்படியானால், நீ ஏன் யாவேயின் பெயரில் நீ செய்த உறுதிமொழியையும்[a] நான் உன்மேல் விதித்த கட்டளையையும்[b] கடைப்பிடிக்கவில்லை?
  rationale: The revision preserves the Hebrew’s interrogative accusation and the distinction between the oath and the command. It renders the divine-name construct without overcommitting to “before Yahweh,” while the footnote retains the literal construction and its contextual range. The revised wording remains modern, direct, and appropriate to Solomon’s rebuke.
