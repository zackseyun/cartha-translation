revisions:
- from: இப்போது நான் உன்னிடம் ஒரு வேண்டுகோள் கேட்கிறேன்; என் முகத்தைத் திருப்பிவிடாதே.[a] அதற்கு அவள் அவனிடம், “சொல்” என்றாள்.
  to: இப்போது, நான் உன்னிடம் ஒரு வேண்டுகோள் விடுக்கிறேன்; என்னை மறுக்காதே.[a] அவள் அவனிடம், “சொல்” என்றாள்.
  rationale: The revision renders the Hebrew refusal idiom by its clear Tamil sense in the main text and preserves the source-language image in the footnote. It also removes an unnatural narrative connective and clarifies that the speaker is making, not requesting, a petition.
