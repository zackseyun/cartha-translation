reference: 1 Kings 2:16
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/עַתָּ֗ה שְׁאֵלָ֤ה אַחַת֙ אָֽנֹכִי֙ שֹׁאֵ֣ל מֵֽ/אִתָּ֔/ךְ אַל תָּשִׁ֖בִי אֶת פָּנָ֑/י וַ/תֹּ֥אמֶר אֵלָ֖י/ו דַּבֵּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/016.yaml
  text: And now I am asking one request of you; do not turn away my face. And she said to him[a], “Speak.”
translation:
  language: ta
  text: இப்போது, நான் உன்னிடம் ஒரு வேண்டுகோள் விடுக்கிறேன்; என்னை மறுக்காதே.[a] அவள் அவனிடம், “சொல்” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “என் முகத்தைத் திருப்பாதே” என்று உள்ளது; இது “என்னை மறுக்காதே” அல்லது “என் வேண்டுகோளை நிராகரிக்காதே” என்ற பொருள்படும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: இப்போது
  rationale: உரையாடலின் அடுத்த கட்டத்தை அறிமுகப்படுத்தும் இணைப்பு-காலக் குறிப்பு; தமிழில் ‘இப்போது’ இயல்பாக அந்தச் செயல்பாட்டை வெளிப்படுத்துகிறது.
- source_word: שְׁאֵלָה אַחַת
  choice: ஒரு வேண்டுகோள்
  rationale: שְׁאֵלָה என்பது வேண்டுகோள் அல்லது விண்ணப்பத்தைக் குறிக்கிறது; எண்ணிக்கையைக் காட்டும் אַחַת ‘ஒரு’ எனப் பாதுகாக்கப்பட்டுள்ளது.
- source_word: אָנֹכִי שֹׁאֵל מֵאִתָּךְ
  choice: நான் உன்னிடம் ... கேட்கிறேன்
  rationale: தனிப்பட்ட சுட்டுப்பெயரும் நிகழ்காலத் தன்மையுள்ள வினையெச்ச வடிவமும் கோரிக்கையின் உடனடி தன்மையை வலியுறுத்துகின்றன; இவ்வமைப்பு நவீன தமிழில் இயல்பானது.
- source_word: אַל תָּשִׁיבִי אֶת פָּנָי
  choice: என் முகத்தைத் திருப்பிவிடாதே
  rationale: ‘என் முகத்தைத் திருப்பாதே’ என்ற எபிரெய உருவகத்தைத் தக்கவைத்து, அதன் பொருளான ‘என்னை/என் வேண்டுகோளை மறுக்காதே’ என்பதை அடிக்குறிப்பில் விளக்குகிறது.
- source_word: וַתֹּאמֶר אֵלָיו
  choice: அதற்கு அவள் அவனிடம் ... என்றாள்
  rationale: கதைத் தொடர்ச்சியை இயல்பான தமிழில் காட்டுகிறது; பெண்பால் எழுவாயும் ஆண்பால் பெறுநரும் தெளிவாகப் பாதுகாக்கப்பட்டுள்ளனர்.
- source_word: דַּבֵּר
  choice: சொல்
  rationale: வேண்டுகோளைத் தெரிவிக்க அழைக்கும் சுருக்கமான ஆண்பால் ஒருமை கட்டளை; தமிழில் ‘சொல்’ இயல்பாகவும் நேரடியாகவும் உள்ளது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையான ஆனால் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மரபுத்தொடரின் உருவகம் முதன்மை உரையில் பாதுகாக்கப்பட்டு, அதன் இயல்பான பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
