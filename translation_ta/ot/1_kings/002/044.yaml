  yaml_path: translation/ot/1_kings/002/044.yaml
  text: Then the king said to Shimei[a], “You know all the evil that your heart knows, which you did to David my father[b]; and Yahweh has returned your evil on your own head.”
translation:
  language: ta
  text: பின்பு அரசன் சிமெயியிடம், “என் தந்தை தாவீதுக்கு நீ செய்த, உன் உள்ளம் அறிந்திருக்கிற எல்லாத் தீமையையும் நீ அறிவாய்[a]; யாவே உன் தீமையை உன் தலைமேல் திரும்ப வரச் செய்திருக்கிறார்[b]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “உன் இதயம் அறிந்திருக்கிற எல்லாத் தீமையையும் நீ அறிவாய்.” இது சிமெயி தன் குற்றத்தை உள்ளார்ந்து அறிந்திருந்ததை வலியுறுத்துகிறது.'
    reason: lexical_alternative
  - marker: b
    text: “திரும்ப வரச் செய்திருக்கிறார்” என்பதை “திருப்பிச் செலுத்தியிருக்கிறார்” அல்லது “திரும்பக் கொண்டுவந்திருக்கிறார்” என்றும் மொழிபெயர்க்கலாம். சிமெயியின் தீமை அவன்மீதே திரும்புவதைக் குறிக்கும் உருவகம் எபிரெயத்தில் உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר הַמֶּלֶךְ אֶל שִׁמְעִי
  choice: பின்பு அரசன் சிமெயியிடம் ... என்றான்
  rationale: வாவ் தொடர்கதை நிகழ்வை முன்னெடுப்பதால் ‘பின்பு’ இயல்பான தமிழ் கதைநடையை அளிக்கிறது; எபிரெய வாக்கிய அமைப்புக்கு ஏற்ப பேசுபவர் குறிப்பு முடிவில் வைக்கப்பட்டது.
- source_word: אַתָּה יָדַעְתָּ אֵת כָּל הָרָעָה אֲשֶׁר יָדַע לְבָבְךָ
  choice: தீமையெல்லாம் உன் உள்ளத்திற்குத் தெரியும்
  rationale: எபிரெயம் அறிவை ‘உன் இதயம்’ என்பதற்கே உரித்தாக்குகிறது. நவீன தமிழில் ‘உள்ளம்’ உள்ளார்ந்த மனச்சாட்சி மற்றும் குற்றவுணர்வை இயல்பாகத் தக்கவைக்கிறது; இருமுறை வரும் ‘அறிதல்’ தமிழில் தேவையற்ற மறுபடியாகிவிடாதபடி ஒருங்கிணைக்கப்பட்டது.
- source_word: אֲשֶׁר עָשִׂיתָ לְדָוִד אָבִי
  choice: என் தந்தை தாவீதுக்கு நீ செய்த
  rationale: உறவையும் தீச்செயலின் இலக்கையும் நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரை ஒரு பட்டப்பெயராக மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: וְהֵשִׁיב ... אֶת רָעָתְךָ בְּרֹאשֶׁךָ
  choice: உன் தீமையை உன் தலையின்மேல் திரும்பச் செய்திருக்கிறார்
  rationale: שוב என்பதன் காரணவினை வடிவிலுள்ள ‘திரும்பும்படி செய்தல்’ என்ற உருவகத்தையும், பழி செய்பவர்மீதே திரும்பும் ‘தலையின்மேல்’ என்ற எபிரெய மரபுத்தொடரையும் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட தெய்வீகப் பெயர் நேரடியாக உள்ளது; அதை பொதுப் பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்ப்பது மூல வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: தெய்வீக நீதித்தீர்ப்பின் செயற்பாடு
  choice: யாவே உன் தீமையை உன் தலையின்மேல் திரும்பச் செய்திருக்கிறார்
  alternative: யாவே உன் தீமைக்குப் பதிலளித்திருக்கிறார்
  rationale: தீமை குற்றவாளியிடமே திரும்பும்படி யாவே செய்கிறார் என்று மூலவாக்கியம் நேரடியாகக் கூறுகிறது. அதை மென்மையாக்காமலும் கூடுதல் கோட்பாட்டைச் சேர்க்காமலும் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டது. ‘உள்ளம்’, ‘தலையின்மேல்’ ஆகியவை மூலத்தின் உள்ளார்ந்த அறிவு மற்றும் திரும்பிவரும் நீதித்தீர்ப்பு என்ற உருவகங்களைத் தக்கவைக்கின்றன. வசனத்திலுள்ள ‘இப்போது’ வெளிப்படையான காலச் சொல்லின் மொழிபெயர்ப்பு அல்ல; தொடர்ச்சியான வாவ் மற்றும் உரையின் விளைவுநிலையை இயல்பாகக் காட்டும் உரையாடல் இணைப்பாகும்.
