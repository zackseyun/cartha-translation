  text: And it was reported to Solomon that Shimei had gone from Jerusalem to Gath and had returned.
translation:
  language: ta
  text: சிமெயி எருசலேமிலிருந்து காத் நகருக்குப் போய்த் திரும்பிவந்த செய்தி சாலொமோனுக்கு அறிவிக்கப்பட்டது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: அறிவிக்கப்பட்டது
  rationale: நிகழ்த்துபவர் குறிப்பிடப்படாத எபிரெயச் செயப்பாட்டு வடிவத்தை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: לִשְׁלֹמֹה
  choice: சாலொமோனுக்கு
  rationale: ל முன்னொட்டு செய்தியைப் பெறுபவரைக் குறிக்கிறது.
- source_word: כִּי
  choice: செய்தி
  rationale: அறிவிக்கப்பட்ட தகவலின் உள்ளடக்கத்தைத் தமிழில் இயல்பான பெயர்ச்சொல் அமைப்பாக அறிமுகப்படுத்துகிறது.
- source_word: הָלַךְ
  choice: போய்
  rationale: הלך இங்கு ஓர் இடத்துக்குச் சென்றதைக் குறிக்கிறது; தொடரும் திரும்பிவந்த செயலை இணைக்க வினையெச்சம் இயல்பாக உள்ளது.
- source_word: שִׁמְעִי
  choice: சிமெயி
  rationale: ஆள்பெயர் எபிரெய உச்சரிப்புக்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: מִירוּשָׁלִַם
  choice: எருசலேமிலிருந்து
  rationale: מ முன்னொட்டு எருசலேமிலிருந்து புறப்பட்ட நகர்வைக் குறிக்கிறது.
- source_word: גַּת
  choice: காத் நகருக்கு
  rationale: முன்னொட்டு வெளிப்படையாக இல்லாவிட்டாலும், இடப்பெயர் הלך வினையின் இலக்காகச் செயல்படுகிறது; 'நகருக்கு' என்பது தமிழில் தெளிவளிக்கிறது.
- source_word: וַיָּשֹׁב
  choice: திரும்பிவந்த
  rationale: שׁוב திரும்புதலைக் குறிக்கிறது; செய்தி அறிவிக்கப்படுவதற்கு முன்பே முடிந்த செயல் என்பதைத் தொடர்பெயர் வடிவம் இயல்பாக வெளிப்படுத்துகிறது.
