  text: As the days of David drew near for him to die[a], he commanded Solomon his son, saying,
translation:
  language: ta
  text: 'தாவீது மரணமடையும் நாட்கள் நெருங்கியபோது[a], அவர் தம் மகன் சாலொமோனுக்குக் கட்டளையிட்டுக் கூறினார்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “தாவீதின் நாட்கள் இறப்பதற்கு நெருங்கின”; தாவீது இறக்கும் காலம் நெருங்கியதை இந்த எபிரெய மரபுத்தொடர் குறிக்கிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְבוּ
  choice: நெருங்கியபோது
  rationale: קרב என்ற வினையின் ‘நெருங்குதல்’ உருவகத்தைத் தக்கவைத்து, காலம் அணுகுவதை நவீனத் தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: יְמֵי דָוִד
  choice: தாவீது ... நாட்கள்
  rationale: ‘தாவீதின் நாட்கள்’ என்ற எபிரெயக் காலமரபை முடிந்தவரை காத்து, தமிழில் புரியும்படி வாக்கியத்தில் இணைக்கப்பட்டுள்ளது.
- source_word: לָמוּת
  choice: இறப்பதற்கான
  rationale: מות என்பதன் மரணக் குறிப்பையும் ל முன்னொட்டின் தொடர்பு/நோக்கு நுணுக்கத்தையும் வெளிப்படுத்துகிறது; இறப்பவர் தாவீது என்பது சூழலால் தெளிவு.
- source_word: וַיְצַו
  choice: கட்டளையிட்டுச் சொன்னது
  rationale: צוה என்பதன் வலிமையான ‘கட்டளையிடுதல்’ பொருளைத் தக்கவைத்து, அடுத்துவரும் நேரடிக் கூற்றுக்கான இயல்பான தமிழ்த் தொடர்பை உருவாக்குகிறது.
- source_word: אֶת שְׁלֹמֹה בְנוֹ
  choice: தம் மகன் சாலொமோனுக்கு
  rationale: எபிரெயத்தில் ‘சாலொமோன், அவன் மகன்’ என்ற அமைப்பு இருந்தாலும், நவீனத் தமிழில் உறவையும் பெறுநரையும் இயல்பாகக் காட்டும் சொல்வரிசை பயன்படுத்தப்பட்டுள்ளது.
- source_word: לֵאמֹר
  choice: சொன்னது
  rationale: அடுத்துவரும் நேரடிப் பேச்சை அறிமுகப்படுத்தும் எபிரெயச் சொல்லை இயல்பான தமிழில் பிரதிபலிக்கிறது.
