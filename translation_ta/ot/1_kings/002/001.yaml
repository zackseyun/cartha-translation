  register: நவீன நிலையான தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘நாட்கள் நெருங்குதல்’ என்ற மூல உருவகம் தக்கவைக்கப்பட்டுள்ளதுடன், அடிக்குறிப்பில் எபிரெய மரபுத்தொடரின் சொற்சார்ந்த வடிவம் தரப்பட்டுள்ளது.
