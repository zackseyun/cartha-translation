base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/007.yaml
  text: But show kindness to the sons of Barzillai the Gileadite[a], and let them be among those who eat at your table[c][b], for this is how they came near to me when I fled from Absalom your brother.
translation:
  language: ta
  text: ஆனால் கிலேயாத்தியனான பர்சில்லாயின் மகன்களுக்குத் தயவு காட்டு[a]. அவர்களை உன் மேசையில் உண்பவர்களுள் இருக்கச் செய்[b]. ஏனெனில், உன் சகோதரன் அப்சலோமிடமிருந்து நான் தப்பியோடியபோது, அவர்கள் இப்படித்தான் என்னிடம் நெருங்கி வந்தார்கள்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பர்சில்லாயின் மகன்களிடம் பற்றுறுதியுடன் நடந்துகொள்’ என்றும் மொழிபெயர்க்கலாம். ‘தயவு காட்டு’ என்பதற்கான எபிரெயச் சொற்றொடர், வெறும் கனிவை மட்டுமல்லாமல் உண்மையுள்ள பற்றையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எழுத்துப்பூர்வமாக, ‘உன் மேசையில் உண்பவர்களுள் அவர்கள் இருப்பார்களாக.’ இது அரசனின் தொடர்ந்த ஆதரவையும் நன்மதிப்பையும் பெறுவதைக் குறிக்கும் வழக்கு.
    reason: cultural_note
  - marker: c
    text: ‘அவர்கள் என்னிடம் வந்தார்கள்’ அல்லது ‘அவர்கள் எனக்குத் துணையாக நின்றார்கள்’ என்றும் பொருள் கொள்ளலாம். எபிரெய வினை எழுத்துப்பூர்வமாக ‘நெருங்கி வந்தார்கள்’ எனப் பொருள்பட்டு, இச்சூழலில் தாவீது தப்பியோடியபோது அவர்கள் அவருக்கு ஆதரவளித்ததை உணர்த்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִבְנֵי
  choice: ஆனால் ... மகன்களுக்கு
  rationale: முந்தைய கட்டளைக்கு மாறான, இப்போது செய்ய வேண்டிய நன்மையை וְ அறிமுகப்படுத்துவதால் சூழலுக்கேற்ற வகையில் ‘ஆனால்’ என மொழிபெயர்க்கப்பட்டது. בְּנֵי என்பது இங்கு பர்சில்லாயின் ஆண் வழியினரைக் குறிக்கும் ‘மகன்கள்’ என வழங்கப்பட்டது.
- source_word: בַרְזִלַּי הַגִּלְעָדִי
  choice: கிலேயாத்தியனான பர்சில்லாய்
  rationale: தனிப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டு, கிலேயாதைச் சேர்ந்தவர் என்பதைக் குறிக்கும் அடைமொழி இயல்பான தமிழில் மொழிபெயர்க்கப்பட்டது.
- source_word: תַּעֲשֶׂה חֶסֶד
  choice: உண்மையுள்ள அன்பு காட்டு
  rationale: עשה חסד என்பது வெறும் உணர்ச்சிப்பூர்வமான கனிவை அல்லாமல், உறுதியான பற்றும் நன்மை செய்வதும் கலந்த செயலைக் குறிக்கலாம். ‘உண்மையுள்ள அன்பு’ அந்த விசுவாசமான நற்குணத்தை வெளிப்படுத்துகிறது; தேவையற்ற உடன்படிக்கைச் சொல்லாடலைத் திணிப்பதில்லை.
- source_word: וְהָיוּ
  choice: இருக்கச் செய்
  rationale: வடிவில் நிறைவேற்ற வினையாக இருந்தாலும், தாவீது சாலொமோனுக்குக் கொடுக்கும் அறிவுறுத்தலில் இது கட்டளை அல்லது விருப்பக் கருத்தைத் தருகிறது.
- source_word: בְּאֹכְלֵי שֻׁלְחָנֶךָ
  choice: உன் மேசையில் உண்பவர்களுள்
  rationale: எழுத்துப்பூர்வமான மேசை உருவகத்தைத் தக்கவைத்து, அரசனிடமிருந்து தொடர்ந்து உணவும் ஆதரவும் நன்மதிப்பும் பெறுவோருள் அவர்கள் இருக்க வேண்டும் என்ற கருத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: כִּי כֵן
  choice: ஏனெனில் ... இப்படித்தான்
  rationale: כִּי காரணத்தை அறிமுகப்படுத்துகிறது; כֵן அவர்கள் தாவீதிடம் நடந்துகொண்ட விதத்துக்கும் இப்போது அவர்களிடம் காட்டப்பட வேண்டிய நன்மைக்கும் இடையிலான ஒப்புமையைத் திறந்தவாறே வைக்கிறது.
- source_word: קָרְבוּ אֵלַי
  choice: என்னிடம் நெருங்கி வந்தார்கள்
  rationale: קרב என்பதன் அடிப்படைப் பொருளான ‘நெருங்கி வருதல்’ பாதுகாக்கப்பட்டது. சூழலில் அது தாவீதுக்கு ஆதரவாக வந்து சேர்ந்ததை உணர்த்தினாலும், அந்த விளக்கம் பிரதான உரைக்குள் முழுமையாகச் சேர்க்கப்படவில்லை.
- source_word: בְבָרְחִי מִפְּנֵי
  choice: நான் ... இடமிருந்து தப்பியோடியபோது
  rationale: முன்னொட்டுடன் கூடிய வினையெச்ச அமைப்பு காலத்தைக் குறிக்கிறது. துரத்தப்பட்ட நிலையில் ஒருவரிடமிருந்து ஓடிச் சென்ற கருத்தை ‘தப்பியோடியபோது’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אַבְשָׁלוֹם אָחִיךָ
  choice: உன் சகோதரன் அப்சலோம்
  rationale: தனிப்பெயர் ஒலிபெயர்க்கப்பட்டு, சாலொமோனுக்கும் அப்சலோமுக்கும் இடையிலான குடும்ப உறவை வலியுறுத்தும் சொல் வெளிப்படையாகத் தக்கவைக்கப்பட்டது.
theological_decisions:
- issue: חֶסֶד என்பதின் பொருள் வரம்பு
  choice: உண்மையுள்ள அன்பு
  alternative: தயவு / உடன்படிக்கைப் பற்றுறுதி
  rationale: இச்சூழலில் நன்மையும் விசுவாசமான பதிலளிப்பும் இரண்டும் உள்ளன. ‘தயவு’ மட்டும் கருத்தைச் சுருக்கும்; ‘உடன்படிக்கைப் பற்றுறுதி’ என்பது உரை வெளிப்படையாகக் கூறாத குறிப்பிட்ட இறையியல் அமைப்பைத் திணிக்கக்கூடும்.
- issue: כֵן எதைக் குறிக்கிறது
  choice: ‘இப்படித்தான்’ என்று குறிப்பைத் திறந்தவாறே வைத்தல்
  alternative: ‘அவர்கள் எனக்கு நன்மை செய்ததால்’ என்று தெளிவாக்குதல்
  rationale: எபிரெயச் சொற்றொடர் முன் கூறிய அன்புச் செயலோடு ஒப்பிடலாம்; அதேவேளை அவர்கள் தாவீதிடம் வந்த விதத்தையும் குறிக்கலாம். மொழிபெயர்ப்பு இந்த உண்மையான இருபொருள் வாய்ப்பைத் தீர்மானித்து விடவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் வேதாகம உரைக்கேற்ற கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டது. அரிதான இறையியல் கலைச்சொற்கள் தவிர்க்கப்பட்டுள்ளன; மேசை உருவகமும் குடும்ப உறவுச் சொல்லும் மூலத்துக்கு நெருக்கமாகத் தக்கவைக்கப்பட்டுள்ளன.
