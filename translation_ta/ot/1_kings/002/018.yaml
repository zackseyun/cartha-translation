  yaml_path: translation/ot/1_kings/002/018.yaml
  text: Bathsheba said[a], “Good; I will speak to the king for you.”
translation:
  language: ta
  text: அதற்கு பத்சேபாள், “நல்லது; உனக்காக நான் அரசரிடம் பேசுவேன்[a]” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன்னைப் பற்றி” அல்லது “உன் சார்பாக.” எபிரேயச் சொற்றொடர் ஒருவரைக் குறித்துப் பேசுவதைக் குறிக்கலாம்; இச்சூழலில் அது அதோனியாவுக்காகப் பரிந்துபேசுவதைப் பெரும்பாலும் உணர்த்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: என்றாள்
  rationale: אמר என்பதன் வழக்கமான தொடர்கதை வடிவம் நேரடி உரையை அறிமுகப்படுத்துகிறது; தமிழில் மேற்கோளின் முடிவில் ‘என்றாள்’ என்பது இயல்பான கதைநடை. சூழலிலுள்ள பதிலுரையைத் தெளிவாக்க ‘அதற்கு’ சேர்க்கப்பட்டுள்ளது.
- source_word: בַּת שֶׁבַע
  choice: பத்சேபாள்
  rationale: தனிப்பெயர் பொருளாக்கப்படாமல் தமிழில் நிலைபெற்ற வேதாகம ஒலிபெயர்ப்பு வடிவில் தரப்பட்டுள்ளது.
- source_word: טוֹב
  choice: நல்லது
  rationale: இங்கு இது சுருக்கமான ஒப்புதலைக் குறிக்கிறது; ‘நல்லது’ எபிரேயச் சொல்லின் சுருக்கத்தையும் இயல்பான உரையாடல் நடையையும் காக்கிறது.
- source_word: אָנֹכִי
  choice: நான்
  rationale: தனிநிலைப் பிரதிப்பெயர் வெளிப்படையான எழுவாயைக் குறிக்கிறது; தமிழிலும் ‘நான்’ எனத் தருவது அதன் முன்னிலையைப் பாதுகாக்கிறது.
- source_word: אֲדַבֵּר
  choice: பேசுகிறேன்
  rationale: דבר என்பதன் நேரடியான பொருள் ‘பேசுதல்’; வேண்டுகோள் வைப்பது சூழலில் உட்பொருளாக இருந்தாலும் அதை மூலத்தில் இல்லாத அளவுக்கு வெளிப்படையாக்கவில்லை. உறுதியான எதிர்கால நோக்கத்தை இயல்பான தமிழ் நிகழ்கால வடிவம் வெளிப்படுத்துகிறது.
- source_word: עָלֶיךָ
  choice: உனக்காக
  rationale: דבר உடன் வரும் על ‘உன்னைப் பற்றி’ என்றும் ‘உன் சார்பாக’ என்றும் பொருள்படலாம்; இச்சூழலில் அதோனியாவுக்காகப் பரிந்துபேசுதல் பெரும்பாலும் நோக்கமாக இருப்பதால் ‘உனக்காக’ தேர்ந்தெடுக்கப்பட்டது, மாற்றுப் பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: אֶל הַמֶּלֶךְ
  choice: அரசரிடம்
  rationale: அரசரை நோக்கிப் பேசுவதை இயல்பான நவீனத் தமிழில் ‘அரசரிடம்’ எனக் கூறுவது பொருத்தமானது; இது தெய்வீகப் பட்டம் அல்ல, அரச பதவியைக் குறிக்கிறது.
