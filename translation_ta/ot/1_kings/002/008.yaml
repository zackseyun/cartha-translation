base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/008.yaml
  text: And behold[a], with you is Shimei son of Gera, the Benjaminite from Bahurim, and he cursed me with a grievous curse on the day I went to Mahanaim. But he came down to meet me at the Jordan, and I swore to him by Yahweh, saying, ‘I will not put you to death with the sword.’
translation:
  language: ta
  text: இதோ, பகூரீமைச் சேர்ந்த பென்யமீன் கோத்திரத்தைச் சேர்ந்த கேராவின் மகன் சிமேயி உன்னுடன் இருக்கிறான். நான் மகனாயீமுக்குப் போன நாளில் அவன் கடுமையான சாபத்தால் என்னைச் சபித்தான். ஆனால் அவன் யோர்தானுக்கு என்னைச் சந்திக்க இறங்கி வந்தான்; நான் யாவேயின் பெயரில் அவனிடம், “நான் உன்னை வாளால் கொல்லமாட்டேன்”[a] என்று ஆணையிட்டேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்சொல்லாக, “நான் உன்னை வாளால் கொன்றால்.” இது விளைவுச் சாபம் சொல்லப்படாமல் விடப்பட்ட ஓர் ஆணைச் சூத்திரம்; இதன் பொருள், “நான் உன்னை வாளால் கொல்லமாட்டேன்.”
    reason: எபிரெய நிறைவுபெறாத ஆணைச் சூத்திரத்தின் நேரடி வடிவத்தையும், சூழலால் தெளிவாகும் மறுப்புப் பொருளையும் விளக்குகிறது.
lexical_decisions:
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் எபிரெயச் சொல்லின் சுட்டும் வலிமையை இயல்பான நவீனத் தமிழில் தக்கவைக்கிறது.
- source_word: עִמְּךָ
  choice: உன்னுடன் இருக்கிறான்
  rationale: சிமேயி சாலொமோனின் அருகிலும் ஆளுகை வட்டத்திலும் இருப்பதைத் தெளிவாகவும் இயல்பாகவும் கூறுகிறது.
- source_word: שִׁמְעִי בֶן־גֵּרָא בֶן־הַיְמִינִי מִבַּחֻרִים
  choice: பகூரீமைச் சேர்ந்த பென்யமீனியனான கேராவின் மகன் சிமேயி
  rationale: பெயர்களையும் ஊரையும் ஒலிபெயர்த்து, הַיְמִינִי என்பதை இனக்குழு அடையாளமாக ‘பென்யமீனியன்’ என்று இயல்பாக வழங்குகிறது.
- source_word: קִלְלַנִי קְלָלָה נִמְרֶצֶת
  choice: என்னைக் கடுமையாகச் சபித்தான்
  rationale: எபிரெய மூலத்தின் ஒரே வேர்ச்சொல் மீளுரையால் வரும் வலியுறுத்தலை செயற்பாங்கான ‘கடுமையாக’ என்பதன் மூலம் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְּיוֹם לֶכְתִּי מַחֲנָיִם
  choice: நான் மகனாயீமுக்குப் போன நாளில்
  rationale: காலத்தையும் செல்லும் திசையையும் நேரடியாகத் தக்கவைக்கிறது.
- source_word: יָרַד לִקְרָאתִי הַיַּרְדֵּן
  choice: யோர்தானில் என்னைச் சந்திக்க இறங்கி வந்தபோது
  rationale: ירד என்பதன் கீழ்நோக்கிய இயக்கத்தையும், சந்திக்க வந்த நோக்கத்தையும் தக்கவைக்கிறது.
- source_word: וָאֶשָּׁבַע לוֹ בַיהוָה
  choice: யாவேமேல் ஆணையிட்டு அவனிடம் சொன்னேன்
  rationale: தெய்வீகப் பெயரை ‘யாவே’ என ஒலிபெயர்த்து, ஆணையின் உறுதியையும் சொல்லப்பட்ட உரையையும் இயல்பாக இணைக்கிறது.
- source_word: אִם אֲמִיתְךָ בֶּחָרֶב
  choice: நான் உன்னை வாளால் கொல்லமாட்டேன்
  rationale: אִם என்று தொடங்கும் நிறைவுபெறாத எபிரெய ஆணைச் சூத்திரம் இங்கு வலுவான மறுப்பைக் குறிக்கிறது; அதன் பொருளைத் தவறாகப் புரிந்துகொள்ளாத வகையில் வெளிப்படையாக மொழிபெயர்க்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் நேரடியாக வரும் உடன்படிக்கைப் பெயரை ஒரு பட்டப்பெயராக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- issue: אִם אֲמִיתְךָ בֶּחָרֶב என்ற ஆணைச் சூத்திரத்தின் பொருள்
  choice: நான் உன்னை வாளால் கொல்லமாட்டேன்
  alternative: நான் உன்னை வாளால் கொன்றால்
  rationale: இது விளைவுச் சாபம் விடுபட்டுள்ள எபிரெய ஆணை மரபு; வடிவத்தின் தெளிவின்மையை அடிக்குறிப்பில் பதிவு செய்து, சூழலில் நோக்கப்பட்ட மறுப்பு உறுதியை முதன்மை உரையில் அளிக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைக் கடைப்பிடிக்கிறது. இடப்பெயர்களும் ஆட்பெயர்களும் எபிரெய வடிவங்களுக்கு அண்மையாக ஒலிபெயர்க்கப்பட்டுள்ளன; அரசியல் மற்றும் ஆணைச் சூழலுக்கேற்ற மிதமான முறையான நடை பயன்படுத்தப்பட்டுள்ளது.
