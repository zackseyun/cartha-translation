theological_decisions:
- issue: அரச உடன்படிக்கை மொழியில் ‘வீடு’ என்பதன் பொருள்
  choice: பிரதான உரையில் ‘வீடு’ என்ற உருவகத்தைத் தக்கவைத்து, வம்சப் பொருளை அடிக்குறிப்பில் தெரிவிப்பது
  alternative: ‘அரச வம்சம்’ அல்லது ‘நிலையான வம்சம்’ என்று நேரடியாக மொழிபெயர்ப்பது
  rationale: தாவீதின் அரச குடும்பச் சூழலில் בַּיִת என்பது நீடிக்கும் வம்சத்தைக் குறிக்கக்கூடும். எனினும், மூல உரையின் உருவகத்தையும் தாவீதுக்குக் கொடுக்கப்பட்ட வாக்குறுதியுடனான இலக்கியத் தொடர்பையும் காக்க ‘வீடு’ பிரதான உரையில் வைக்கப்படுகிறது; பொருள் தவறாகப் புரியாதபடி அடிக்குறிப்பு சேர்க்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், அரச ஆணையின் கண்ணியத்தையும் வலிமையையும் காக்கும் நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய ஆணைச் சூத்திரம் தமிழில் இயல்பாகப் புரியும்படி விரித்து வழங்கப்பட்டாலும், யாவேயின் பெயரும் அவர் உயிரோடிருப்பதை அடிப்படையாகக் கொண்ட ஆணையின் வடிவமும் தக்கவைக்கப்பட்டுள்ளன.
