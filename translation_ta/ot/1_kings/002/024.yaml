base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/024.yaml
  text: And now[a], as Yahweh lives, who has established me and seated me on the throne of David my father, and who has made for me a house as he promised, surely Adonijah shall be put to death today.
translation:
  language: ta
  text: இப்போது, என்னை நிலைநிறுத்தி, என் தந்தை தாவீதின் அரியணையில் என்னை அமர்த்தி, தாம் கூறியபடியே எனக்காக ஒரு வீட்டை[a] ஏற்படுத்திய யாவே உயிரோடிருக்கிறபடியால், அதோனியா இன்று கொல்லப்படுவான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வீடு’ என்பதற்கு அரச வம்சம் அல்லது நீடித்த குடும்ப வரிசை என்றும் பொருள் இருக்கலாம்; இது கட்டடத்தை மட்டும் குறிக்க வேண்டியதில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי יְהוָה
  choice: யாவே உயிரோடிருப்பது எவ்வளவு உறுதியோ, அவ்வளவு உறுதியாகச் சொல்கிறேன்
  rationale: இது எபிரெய மொழியின் வழக்கமான ஆணைச் சூத்திரம். சொற்சொல் வடிவை விட அதன் ஆணையுறுதி இயல்பான நவீனத் தமிழில் தெளிவாக வெளிப்படுகிறது; அதேவேளையில் யாவேயின் உயிருள்ள தன்மையை வெளிப்படையாகத் தக்கவைக்கிறது.
