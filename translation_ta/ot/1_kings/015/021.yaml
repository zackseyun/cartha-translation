  text: And when Baasha heard of it[a], he stopped building Ramah and remained in Tirzah.
translation:
  language: ta
  text: பாஷா இதைக் கேள்விப்பட்டபோது, ராமாவைக் கட்டுவதை நிறுத்திவிட்டு திர்சாவில் தங்கியிருந்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: இதைக் கேள்விப்பட்டபோது
  rationale: வַיְהִי + שׁמע என்பதன் வினையெச்ச அமைப்பு காலத்தைக் குறிக்கும் துணைவாக்கியத்தை அறிமுகப்படுத்துகிறது. முந்தைய சூழலில் கூறப்பட்ட செய்தியே கேட்கப்பட்டதன் உள்ளடக்கம் என்பதால், இயல்பான தமிழுக்காக ‘இதை’ சேர்க்கப்பட்டுள்ளது.
- source_word: בַּעְשָׁא
  choice: பாஷா
  rationale: எபிரெயத் தனிப்பெயரின் ஒலிப்பெயர்ப்பு.
- source_word: וַיֶּחְדַּל מִבְּנוֹת
  choice: கட்டுவதை நிறுத்திவிட்டு
  rationale: חדל + מִן மற்றும் வினையெச்சம் ஓர் செயலைச் செய்வதை நிறுத்துவதைக் குறிக்கிறது; இவ்வமைப்பு நவீன தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: אֶת הָרָמָה
  choice: ராமாவை
  rationale: இங்கு הָרָמָה என்பது இடப்பெயர்; אֶת நேரடிச் செயப்படுபொருளைக் குறிக்கிறது. தமிழ் வேற்றுமை உருபுடன் ‘ராமாவை’ என வழங்கப்பட்டுள்ளது.
- source_word: וַיֵּשֶׁב
  choice: தங்கியிருந்தான்
  rationale: ישׁב என்பதற்கு உட்காருதல், குடியிருத்தல், தங்குதல் போன்ற பொருள்கள் உண்டு. இச்சூழலில் நிரந்தரமாகக் குடியேறினான் என்று தேவையின்றி வலியுறுத்தாமல், திர்சாவில் தொடர்ந்து இருந்ததைக் ‘தங்கியிருந்தான்’ தெரிவிக்கிறது.
- source_word: בְּתִרְצָה
  choice: திர்சாவில்
  rationale: בְּ என்னும் இடப்பொருள் முன்னொட்டு தமிழில் ‘-இல்’ வேற்றுமையாகவும், இடப்பெயர் ‘திர்சா’ என ஒலிப்பெயர்க்கப்பட்டும் உள்ளது.
