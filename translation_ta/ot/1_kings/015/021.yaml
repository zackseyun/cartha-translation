translation_notes:
  register: நவீன பொதுத்தரத் தமிழில், வரலாற்று விவரணத்திற்கேற்ற கண்ணியமான, எளிதில் புரியும் நடை. எபிரெயக் கதையாடல் சூத்திரத்தைச் சொற்சொல்லாகப் பின்பற்றாமல் அதன் காலத் தொடர்பு இயல்பான தமிழில் தரப்பட்டுள்ளது.
