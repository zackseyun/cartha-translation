  yaml_path: translation/ot/1_kings/015/009.yaml
  text: In the twentieth year of Jeroboam king of Israel[b][a], Asa became king over Judah.
translation:
  language: ta
  text: இஸ்ரவேலின் அரசனாகிய யெரொபெயாமின் இருபதாம் ஆண்டில், ஆசா யூதாவின் அரசனானார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இன்னும் முறையாக, “ஆசா யூதாவின் அரசராக ஆட்சி செய்யத் தொடங்கினார்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בִ/שְׁנַת עֶשְׂרִים
  choice: இருபதாம் ஆண்டில்
  rationale: இது அரசாட்சிக் காலத்தைக் கணக்கிடும் வழக்கமான எபிரெய காலக்குறிப்பு. தொடக்க வாவைத் தமிழில் தனியாக மொழிபெயர்க்காமல் இருப்பது இயல்பான நடை; ‘இருபது’ என்பதன் வரிசைமுறைப் பொருள் ‘இருபதாம்’ எனத் தெளிவாகிறது.
- source_word: לְ/יָרָבְעָם
  choice: யெரொபெயாமின்
  rationale: இங்குள்ள לְ அரசாட்சியாண்டுக்கான தொடர்புப் புள்ளியைக் குறிக்கிறது; தமிழில் உடைமை வேற்றுமை இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: இஸ்ரவேலின் அரசனாகிய
  rationale: அரசப் பட்டத்தை மூலத்துக்கு நெருக்கமாகவும், அடுத்துவரும் பெயருடன் இயல்பாக இணையுமாறும் மொழிபெயர்க்கிறது.
- source_word: מָלַךְ
  choice: அரசனானார்
  rationale: அரசர் காலக்குறிப்பு அமைப்பில் இந்த வினை ஆட்சியேற்றதைக் குறிக்கிறது; ‘அரசனானார்’ என்பது அதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: אָסָא
  choice: ஆசா
  rationale: எபிரெய தனிப்பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: מֶלֶךְ יְהוּדָה
  choice: யூதாவின் அரசனானார்
  rationale: எபிரெய கட்டமைப்பின் நேரடியான பொருள் ‘யூதாவின் அரசன்’; தமிழில் ‘யூதாவின் அரசனானார்’ என்பது ஆட்சியேற்றத்தை இயல்பாகச் சொல்கிறது.
