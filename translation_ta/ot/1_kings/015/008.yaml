base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/008.yaml
  text: And Abijam lay down with his fathers[a], and they buried him in the city of David[b]. Then Asa his son became king in his place.
translation:
  language: ta
  text: அபியாம்[b] தன் முன்னோர்களோடு துயிலடைந்தான்[a]. அவர்கள் அவனைத் தாவீதின் நகரத்தில் அடக்கம் செய்தார்கள். பின்னர் அவன் மகன் ஆசா அவனுக்குப் பதிலாக அரசனானான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தன் முன்னோர்களோடு துயிலடைந்தான்” என்பது ஒருவரின் மரணத்தைக் குறிக்கும் வழக்கமான எபிரெய மரபுத்தொடர்.
    reason: cultural_note
  - marker: b
    text: சில இணை அல்லது தொடர்புடைய பகுதிகளில் அபியாம் “அபியா” என அழைக்கப்படுகிறான்; ஆனால் இங்கு எபிரெய உரை “அபியாம்” என்றே வாசிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: தன் முன்னோர்களோடு துயிலடைந்தான்
  rationale: இது மரணத்தைக் குறிக்கும் வழக்கமான எபிரெய மரபுத்தொடர். ‘இறந்தான்’ என்று பொருளை மட்டும் கூறாமல், மூலத்தின் உருவகத்தையும் குடும்ப/வம்சத் தொடர்பையும் இயல்பான தமிழில் காக்கிறது.
- source_word: אֲבִיָּם
  choice: அபியாம்
  rationale: இவ்வசனத்தின் எபிரெய உரையில் உள்ள பெயர்வடிவத்தையே ஒலிபெயர்க்கிறது.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: அவனை ... அடக்கம் செய்தார்கள்
  rationale: எபிரெய வினை செயப்பாட்டு அல்ல; குறிப்பிடப்படாத பன்மை எழுவாயைக் கொண்ட செயல்வினை. தமிழ் நடையில் அதைப் பாதுகாக்கிறது.
- source_word: בְּעִיר דָּוִד
  choice: தாவீதின் நகரத்தில்
  rationale: இடப்பெயருக்குரிய மரபான, தெளிவான தமிழ் வடிவம்.
- source_word: וַיִּמְלֹךְ
  choice: அரசனானான்
  rationale: இங்கு வினை ஆட்சியின் காலநீளத்தை அல்ல, அரியணை ஏறிய நிகழ்வைக் குறிக்கிறது.
- source_word: אָסָא בְנוֹ
  choice: அவன் மகன் ஆசா
  rationale: மூலத்தின் உறவுத்தகவலைத் தெளிவாகவும் இயல்பான தமிழ் சொல் வரிசையிலும் தருகிறது.
- source_word: תַּחְתָּיו
  choice: அவனுக்குப் பதிலாக
  rationale: அரசப் பதவியில் ஒருவருக்குப் பின் மற்றொருவர் இடமேற்பதைத் துல்லியமாகக் குறிக்கிறது.
