    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִלְחָמָה הָיְתָה
  choice: போர் இருந்தது
  rationale: இணைப்புச் சொல்லுடன் வரும் எபிரெய இருப்புநிலைக் கட்டமைப்பைத் தமிழில் இயல்பாகக் காட்டுகிறது; ‘தொடர்ந்தது’ என்று வினையின் பொருளை மிகைப்படுத்தவில்லை.
- source_word: בֵּין ... וּ/בֵין
  choice: '...க்கும் ...க்கும் இடையே'
  rationale: இரு தரப்புகளுக்கிடையேயான உறவை நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: אָסָא
  choice: ஆசா
  rationale: எபிரெய தனிப்பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: בַּעְשָׁא
  choice: பாஷா
  rationale: எபிரெய தனிப்பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: இஸ்ரவேலின் அரசனான
  rationale: பாஷாவை அடையாளப்படுத்தும் எபிரெய இணைப்புத் தொடரைத் தமிழில் இயல்பான பெயரடைத் தொடராக வழங்குகிறது.
- source_word: כָּל יְמֵי/הֶם
  choice: அவர்களுடைய நாட்களெல்லாம்
  rationale: ‘அவர்களுடைய எல்லா நாட்களும்’ என்ற எபிரெய மொழிநடையைப் பாதுகாக்கிறது; அது வாழ்நாள் முழுவதையும் குறிக்கலாம் என்ற நுட்பத்தை அடிக்குறிப்பில் தருகிறது.
