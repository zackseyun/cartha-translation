id: 1KI.15.34
reference: 1 Kings 15:34
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יֵּ֨לֶךְ֙ בְּ/דֶ֣רֶךְ יָרָבְעָ֔ם וּ֨/בְ/חַטָּאת֔/וֹ אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵֽל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/034.yaml
  text: He did what was evil in the eyes of Yahweh and walked in the way of Jeroboam and in his sin by which he caused Israel to sin.
translation:
  language: ta
  text: அவன் யாவேயின் பார்வையில் தீயதைச் செய்தான்; யெரொபெயாமின் வழியிலும், யெரொபெயாம் இஸ்ரவேலைப் பாவம் செய்யவைத்த பாவத்திலும் நடந்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: தீமையானதைச் செய்தான்
  rationale: ‘தீமையைச் செய்தான்’ என்பதைக் காட்டிலும், அரசர்களை மதிப்பிடும் எபிரெய வழக்குச் சூத்திரத்தின் பொருளான ‘தீமையானதைச் செய்தான்’ என்பதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּעֵינֵי יְהוָה
  choice: யாவேயின் பார்வையில்
  rationale: இறைவனின் மதிப்பீட்டைக் குறிக்கும் எபிரெய உருவகத்தைத் தெளிவான நவீன தமிழில் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: உரையில் நேரடியாக வரும் உடன்படிக்கைப் பெயரைப் பட்டப்பெயராக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ יָרָבְעָם
  choice: யெரொபெயாமின் வழியில் நடந்தான்
  rationale: வாழ்க்கை நடத்தை மற்றும் முன்மாதிரியைச் சுட்டும் ‘வழியில் நடத்தல்’ என்ற மூல உருவகத்தை இயல்பாகப் பாதுகாக்கிறது.
- source_word: וּבְחַטָּאתוֹ
  choice: அவன் பாவத்தில்
  rationale: எபிரெய ஒருமை பெயர்ச்சொல்லையும் மூன்றாம் நபர் உரிமைச் சுட்டையும் காக்கிறது; இது யெரொபெயாமின் அடையாளமான பாவத்தைக் குறிக்கிறது.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: அவன் இஸ்ரவேலைப் பாவம் செய்யவைத்த
  rationale: חטא வினையின் ஹிஃபில் வடிவிலுள்ள காரணவினைப் பொருளை நேரடியாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் வரும் தனிப்பட்ட உடன்படிக்கைப் பெயரைப் பொதுவான பட்டப்பெயரால் மாற்றாமல் வெளிப்படுத்துகிறது.
- issue: இஸ்ரவேலின் பாவத்திற்கான யெரொபெயாமின் காரணப் பொறுப்பு
  choice: பாவம் செய்யவைத்த
  alternative: பாவத்திற்கு வழிநடத்தினான்
  rationale: மூலத்தின் காரணவினையைத் தெளிவாகக் காக்கிறது; அதேவேளையில் இஸ்ரவேலரின் சொந்த நெறிப்பொறுப்பைப் பற்றி மூலத்தைவிட மேலதிக முடிவொன்றையும் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், அரசர்களைப் பற்றிய மதிப்பீட்டுச் சூத்திரத்தின் கண்ணியமான தொனியும் ‘வழியில் நடந்தான்’ என்ற நடத்தை உருவகமும் காக்கப்பட்டுள்ளன. அரைப்புள்ளி இரண்டு இணையான குற்றச்சாட்டுகளையும் தெளிவுபடுத்துகிறது.
