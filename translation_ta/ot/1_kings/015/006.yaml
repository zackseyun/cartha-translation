source:
  edition: WLC
  text: וּ/מִלְחָמָ֨ה הָיְתָ֧ה בֵין רְחַבְעָ֛ם וּ/בֵ֥ין יָרָבְעָ֖ם כָּל יְמֵ֥י חַיָּֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/006.yaml
  text: And there was war between Rehoboam and Jeroboam all the days of his life[a].
translation:
  language: ta
  text: ரெகொபெயாமுக்கும் யெரொபெயாமுக்கும் இடையே அவன் வாழ்நாளெல்லாம் போர் நடந்தது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ரெகொபெயாமின் வாழ்நாளெல்லாம்.” சுற்றியுள்ள சூழலையும் உரைச்சான்றுகள் குறித்த விவாதத்தையும் கருத்தில் கொண்டு, சிலர் இந்தச் சுட்டுப்பெயர் அபியாவை (அபியாம்) குறிக்கிறது என்று புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/מִלְחָמָה
  choice: போர்
  rationale: மִלְחָמָה என்பதன் அடிப்படைப் பொருள் ‘போர்’ அல்லது ‘போராட்டம்’. முன்சூழலோடு உள்ள இணைப்பு தமிழில் இயல்பான வாக்கியத் தொடரால் வெளிப்படுவதால் தனியாக ‘மேலும்’ சேர்க்கப்படவில்லை.
- source_word: הָיְתָה
  choice: நடந்தது
  rationale: היה என்ற வினை இங்கு போர் நிலவியதைச் சொல்கிறது. தமிழில் ‘போர் நடந்தது’ என்பது இயல்பாகவும் தொடர்ந்த பகைமையைக் கூடுதலாக வலியுறுத்தாமலும் உள்ளது.
- source_word: בֵין ... וּ/בֵין
  choice: …க்கும் …க்கும் இடையே
  rationale: மோதலில் ஈடுபட்ட இரு தரப்புகளையும் குறிக்கும் எபிரெய இணை அமைப்பை இயல்பான நவீனத் தமிழில் இவ்வாறு வழங்குகிறது.
- source_word: רְחַבְעָם
  choice: ரெகொபெயாம்
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் அணுக்கமாக எழுத்துப்பெயர்த்த வடிவம்.
- source_word: יָרָבְעָם
  choice: யெரொபெயாம்
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் அணுக்கமாக எழுத்துப்பெயர்த்த வடிவம்.
- source_word: כָּל יְמֵי
  choice: வாழ்நாளெல்லாம்
  rationale: ஒருவருடைய வாழ்நாள் முழுவதையும் குறிக்கும் எபிரெய மரபுத்தொடருக்கு இயல்பான, தெளிவான தமிழாக்கம்.
- source_word: חַיָּיו
  choice: அவன் வாழ்நாள்
  rationale: மூன்றாம் நபர் ஆண்பால் ஒருமை பின்னொட்டை ‘அவன்’ என்று வெளிப்படையாக வைத்ததால், மூலத்தில் உள்ள முன்னிலைச் சுட்டின் தெளிவின்மை பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: ‘அவன் வாழ்நாளெல்லாம்’ என்பதில் ‘அவன்’ யாரைக் குறிக்கிறது?
  choice: முதன்மை உரையில் ‘அவன்’ என்ற சுட்டுப்பெயரை மட்டும் வைத்து, யாரைக் குறிக்கிறது என்பதைத் தீர்மானிக்கவில்லை.
  alternative: ‘ரெகொபெயாமின் வாழ்நாளெல்லாம்’ அல்லது ‘அபியாவின் (அபியாம்) வாழ்நாளெல்லாம்’ என்று வெளிப்படுத்துதல்.
  rationale: எபிரெயில் ஆண்பால் ஒருமை உடைமைப் பின்னொட்டு மட்டுமே உள்ளது; இவ்வாக்கியத்திலேயே அதன் முன்னிலைப் பெயர் வெளிப்படையாகக் குறிப்பிடப்படவில்லை. சுற்றியுள்ள சூழலும் உரைச்சான்றுகள் குறித்த விவாதமும் வேறு புரிதல்களுக்கு இடமளிப்பதால், மூலத்தின் தெளிவின்மையை முதன்மை உரை பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘போர் நடந்தது’ இயல்பான தமிழை வழங்குகிறது; ‘அவன்’ என்பது மூல எபிரெயின் குறிப்புத் தெளிவின்மையைப் பாதுகாக்கிறது.
