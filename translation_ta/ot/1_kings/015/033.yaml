base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/033.yaml
  text: In the third year of Asa king of Judah, Baasha son of Ahijah became king over all Israel in Tirzah, and he reigned twenty-four years.
translation:
  language: ta
  text: யூதாவின் அரசனான ஆசாவின் ஆட்சியின் மூன்றாம் ஆண்டில், அகியாவின் மகன் பாஷா திர்சாவில் இஸ்ரவேல் முழுவதின்மேலும் அரசனாகி, இருபத்துநான்கு ஆண்டுகள் ஆட்சி செய்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת שָׁלֹשׁ
  choice: ஆட்சியின் மூன்றாம் ஆண்டில்
  rationale: ב prefixed temporal construct phrase gives the regnal-year setting. In Tamil, adding ‘ஆட்சியின்’ makes the dating formula clear and natural without changing its sense.
- source_word: לְאָסָא מֶלֶךְ יְהוּדָה
  choice: யூதாவின் அரசன் ஆசாவின்
  rationale: The lamed relates the year to Asa's reign. This Tamil genitive construction naturally expresses ‘in the third year of Asa, king of Judah.’
- source_word: מָלַךְ
  choice: அரசனாகி
  rationale: The first occurrence denotes Baasha's accession. ‘அரசனாகி’ preserves the ingressive sense and avoids repeating ‘ஆட்சி செய்தான்,’ which appropriately expresses the stated duration.
- source_word: בַּעְשָׁא בֶן אֲחִיָּה
  choice: அகியாவின் மகன் பாசா
  rationale: The patronymic is retained in natural Tamil order, with the personal names transliterated from the Hebrew forms.
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: இஸ்ரவேல் முழுவதற்கும்
  rationale: With מלך, עַל indicates the people over whom he ruled. This wording preserves the scope of כָּל while sounding natural in Tamil.
- source_word: בְּתִרְצָה
  choice: திர்சாவில்
  rationale: The prefixed ב marks location; the Tamil locative suffix accurately renders ‘in Tirzah.’
- source_word: עֶשְׂרִים וְאַרְבַּע שָׁנָה
  choice: இருபத்துநான்கு ஆண்டுகள்
  rationale: The numeral phrase states the duration of the reign; ‘ஆட்சி செய்தான்’ supplies the durative verbal sense in idiomatic Tamil.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. எபிரேய அரசாண்டுக் கணக்கீட்டு வாய்பாடு தெளிவாகப் பாதுகாக்கப்பட்டு, முதலில் வரும் מָלַךְ அரசனாகும் நிகழ்வாகவும் பின்னர் வரும் கால அளவு ஆட்சியின் நீடிப்பாகவும் வேறுபடுத்தப்பட்டுள்ளது.
