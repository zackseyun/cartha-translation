base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/007.yaml
  text: The rest of the acts of Abijam[a], and all that he did[b], are they not written in the Book of the Chronicles of the Kings of Judah? And there was war between Abijam and Jeroboam.
translation:
  language: ta
  text: அபியாமின்[a] மற்ற செயல்களும், அவன் செய்த அனைத்தும், யூதா அரசர்களின் நாளாகமப் புத்தகத்தில்[b] எழுதப்பட்டிருக்கின்றன அல்லவா? அபியாமுக்கும் யெரொபெயாமுக்கும் இடையே போர் நடந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: தொடர்புடைய சில வசனங்களில் இவர் ‘அபியா’ என்று அழைக்கப்படுகிறார்; இங்கே எபிரெய மூலவுரை ‘அபியாம்’ என்று வாசிக்கிறது.
    reason: alternative_reading
  - marker: b
    text: அல்லது, ‘யூதா அரசர்களின் ஆண்டுக் குறிப்பேடு.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶתֶר דִּבְרֵי אֲבִיָּם
  choice: அபியாம் செய்த மற்ற செயல்களும்
  rationale: அரச வரலாற்றுச் சுருக்கங்களில் דִּבְרֵי என்பது வெறும் சொற்களை அல்ல, அரசனைச் சார்ந்த செயல்களையும் நிகழ்வுகளையும் குறிக்கிறது; யֶתֶר என்பதன் ‘மற்றவை’ என்ற பொருளும் இயல்பாகத் தக்கவைக்கப்பட்டுள்ளது.
- source_word: אֲבִיָּם
  choice: அபியாம்
  rationale: இவ்வசனத்தின் எபிரெய மசோரா உரையில் உள்ள பெயர்வடிவம் நேரடியாக ஒலிபெயர்க்கப்பட்டுள்ளது; தொடர்புடைய இடங்களிலுள்ள ‘அபியா’ என்ற வடிவத்துடன் ஒத்திசைக்கப்படவில்லை.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: அவன் செய்த அனைத்தும்
  rationale: எபிரெயச் சொற்றொடரின் பொதுவான, விரிவான பொருளை இயல்பான தமிழில் நேரடியாக வழங்குகிறது.
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: எழுதப்பட்டிருக்கின்றன அல்லவா?
  rationale: அரச வரலாற்றுச் சுருக்கத்திற்குரிய வினாவடிவத்தையும் அதன் உறுதிப்படுத்தும் சொல்லாட்சியையும் தீர்மான வாக்கியமாக மாற்றாமல் காக்கிறது.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: யூதா அரசர்களின் நாளாகமப் புத்தகம்
  rationale: இது யூதா அரசர்களைப் பற்றிய வரலாற்றுப் பதிவைக் குறிக்கும் ஆவணத் தலைப்பு. ‘நாளாகமம்’ என்பது காலவரிசைப் பதிவின் கருத்தைத் தெளிவாக வழங்குகிறது.
- source_word: וּמִלְחָמָה הָיְתָה
  choice: போர் நடந்தது
  rationale: எபிரெய இருப்புக் கூற்றை இயல்பான நவீன தமிழில் தருகிறது; மூலத்தில் வெளிப்படையாக இல்லாத தொடர்ச்சிக் காலக் கருத்தைச் சேர்க்கவில்லை.
- source_word: בֵּין אֲבִיָּם וּבֵין יָרָבְעָם
  choice: அபியாமுக்கும் யெரொபெயாமுக்கும் இடையே
  rationale: இரு அரசர்களுக்கிடையிலான எதிர்ப்பைச் சுட்டும் இணை முன்னிடைச்சொல் அமைப்பைத் தெளிவாகக் காக்கிறது.
