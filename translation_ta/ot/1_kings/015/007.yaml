translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வரலாற்று நடையைப் பயன்படுத்துகிறது. மூலத்தின் சொல்லாட்சியில் இல்லாத தொடக்கக் கால இணைப்புச் சொல் சேர்க்கப்படவில்லை. ஆவணத் தலைப்புக்கான மாற்று மொழிபெயர்ப்பு உரிய இடத்தில் அடிக்குறிப்பாக வழங்கப்பட்டுள்ளது.
