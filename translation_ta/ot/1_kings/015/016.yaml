base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/016.yaml
  text: And there was war between Asa and Baasha king of Israel all their days[a].
translation:
  language: ta
  text: ஆசாவுக்கும் இஸ்ரவேலின் அரசனான பாஷாவுக்கும் இடையே அவர்களுடைய எல்லா நாட்களிலும்[a] போர் நிலவியது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லடியாக, “அவர்களுடைய எல்லா நாட்களிலும்.” இது “அவர்களுடைய வாழ்நாள் முழுவதும்” அல்லது, சூழலின்படி, “அவர்களது ஆட்சிக்காலம் முழுவதும்” எனப் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִלְחָמָה הָיְתָה
  choice: போர் நடந்தது
  rationale: இது போர் நிலவியதைச் சொல்லும் எபிரெய இருப்புநிலைக் கூற்று. நவீனத் தமிழில் ‘போர் நடந்தது’ என்பது இயல்பாகவும் நேரடியாகவும் உள்ளது; தொடர்ச்சியான நிலையைச் சூழல் உணர்த்துகிறது.
- source_word: בֵּין ... וּ/בֵין
  choice: '...க்கும் ...க்கும் இடையே'
  rationale: இரு தரப்புகளுக்கிடையேயான பரஸ்பர எதிர்ப்பைத் தமிழில் இயல்பாகக் குறிக்கிறது.
- source_word: אָסָא
  choice: ஆசா
  rationale: எபிரெய தனிப்பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: בַּעְשָׁא
  choice: பாஷா
  rationale: எபிரெய தனிப்பெயரின் ஒலியமைப்பை நெருக்கமாகக் காட்டும் தமிழ் ஒலிபெயர்ப்பு.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: இஸ்ரவேலின் அரசன்
  rationale: பாஷாவின் அரச பதவியைத் தெளிவாகவும் இயல்பான தமிழிலும் தெரிவிக்கிறது.
- source_word: כָּל יְמֵי/הֶם
  choice: அவர்கள் வாழ்நாளெல்லாம்
  rationale: சொல்லடியாக ‘அவர்களுடைய எல்லா நாட்களும்’ என்ற எபிரெய மரபுத்தொடரின் காலநீட்சிப் பொருளை நவீனத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது; இது அவர்களது ஆயுள் அல்லது ஆட்சிக்காலம் எனச் சூழலில் புரிந்துகொள்ளப்படக்கூடிய சிறு தெளிவின்மையை அடிக்குறிப்பு பதிவு செய்கிறது.
