  text: He removed the male cult prostitutes from the land[d][c][b][a], and he took away all the idols that his fathers had made.
translation:
  language: ta
  text: அவன் வழிபாட்டு பாலியல் நடைமுறைகளுடன் தொடர்புடைய ஆண்களை[b] நாட்டிலிருந்து அகற்றினான்[a]; தன் முன்னோர்கள்[d] செய்திருந்த எல்லா விக்கிரகங்களையும்[c] நீக்கினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வெளியேற்றினான்’ என்றும் மொழிபெயர்க்கலாம். இங்கு வரும் வினைச்சொல், ஒருவரை ஓர் இடத்திலிருந்து அகற்றுவதையோ வெளியேற்றுவதையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயச் சொல் קְדֵשִׁים. இது வழிபாட்டுச் சூழலோடு தொடர்புடைய ஆண்களைக் குறிக்கிறது; பாலியல் நடைமுறையுடனான அதன் தொடர்பு இச்சூழலில் சாத்தியமானது. அவர்களுடைய துல்லியமான பங்கு குறித்து இச்சொல் முழுமையாக விளக்கவில்லை.
    reason: lexical_alternative
  - marker: c
    text: ‘விக்கிரகங்கள்’ என்பதற்கான எபிரெயச் சொல் கடுமையான இகழ்ச்சித் தொனியுடையது; ‘அருவருப்பான விக்கிரகங்கள்’ அல்லது ‘சாண விக்கிரகங்கள்’ என்ற கருத்தையும் தரக்கூடும்.
    reason: lexical_alternative
  - marker: d
    text: எபிரெயத்தில் ‘அவனுடைய தந்தையர்.’ இது முந்திய தலைமுறையினரை, அதாவது அவனுடைய மூதாதையரை அல்லது முன்னோர்களைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֵר
  choice: அகற்றினான்
  rationale: இங்கு עבר என்பதன் ஹிஃபீல் வடிவம், ஒருவரை ஓர் இடத்திலிருந்து நீக்குதல் அல்லது வெளியேற்றுதல் என்ற பொருளைக் கொண்டது. ‘அகற்றினான்’ என்பது செய்முறையை அளவுக்கு மீறிக் குறிப்பிடாமல் அந்தப் பொருளை இயல்பாகத் தருகிறது.
- source_word: הַקְּדֵשִׁים
  choice: வழிபாட்டுடன் தொடர்புடைய ஆண் விபச்சாரிகளை
  rationale: இந்தச் சூழலில் இச்சொல் ‘பரிசுத்தமானவர்கள்’ என்பதைக் குறிக்காமல், தகாத வழிபாட்டு நடைமுறைகளுடன் தொடர்புடைய பாலியல் செயலில் ஈடுபட்ட ஆண்களைக் குறிக்கிறது. பாலினத்தையும் வழிபாட்டுத் தொடர்பையும் மொழிபெயர்ப்பு வெளிப்படையாகப் பாதுகாக்கிறது.
- source_word: מִן הָאָרֶץ
  choice: நாட்டிலிருந்து
  rationale: இது யூதாவின் நிலப்பரப்பை அல்லது நாட்டைச் சுட்டுகிறது. நவீன தமிழில் ‘நாட்டிலிருந்து’ என்பது தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: וַיָּסַר
  choice: நீக்கினான்
  rationale: סור என்பதன் ஹிஃபீல் வடிவம் இங்கு அகற்றுதல் அல்லது ஒழித்தல் என்ற பொருளில் வருகிறது. முதல் வினையுடன் தேவையற்ற சொல் மறுபடியும் வருவதைத் தவிர்க்க ‘நீக்கினான்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: כָּל הַגִּלֻּלִים
  choice: எல்லா விக்கிரகங்களையும்
  rationale: גִּלּוּלִים என்பது விக்கிரகங்களைக் குறிப்பிடும் இகழ்ச்சியான சொல். பிரதான உரையில் ‘விக்கிரகங்கள்’ தெளிவாக உள்ளது; அதன் கடுமையான இகழ்ச்சித் தொனி அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אֲשֶׁר עָשׂוּ אֲבֹתָיו
  choice: தன் முன்னோர்கள் செய்திருந்த
  rationale: ‘அவனுடைய தந்தையர்’ என்பது முந்திய தலைமுறையினரைக் குறிக்கும் எபிரெய மரபுத்தொடர். தமிழில் ‘முன்னோர்கள்’ அந்தக் கருத்தை இயல்பாகத் தெரிவிக்கிறது; ‘செய்திருந்த’ என்பது ஆசாவின் நடவடிக்கைக்கு முன்பே அவர்கள் செய்த செயலைக் காட்டுகிறது.
theological_decisions:
- issue: הַקְּדֵשִׁים என்பதன் வழிபாட்டு மற்றும் பாலியல் தொடர்பு
  choice: வழிபாட்டுடன் தொடர்புடைய ஆண் விபச்சாரிகள்
  alternative: பரிசுத்தமானவர்கள் / ஆண் கோவில் விபச்சாரிகள்
  rationale: சொல்லின் சொற்பிறப்பை மட்டும் பின்பற்றி ‘பரிசுத்தமானவர்கள்’ என்று மொழிபெயர்ப்பது இச்சூழலைத் தவறாகக் காட்டும். ‘கோவில்’ என்பது மூலத்தில் நேரடியாக இல்லாத இடவியல் விவரத்தை உறுதியாக்கக்கூடும்; ஆகவே வழிபாட்டுத் தொடர்பை மட்டும் பிரதான உரை வெளிப்படுத்துகிறது.
- issue: אֲבֹתָיו என்பதன் தலைமுறை சார்ந்த பொருள்
  choice: தன் முன்னோர்கள்
  alternative: அவனுடைய தந்தையர்
  rationale: எபிரெய ஆண்பால் பன்மை வடிவம் முந்திய தந்தைவழித் தலைமுறையினரைக் குறிக்கிறது. தமிழில் ‘தந்தையர்’ என்பது பல நேரங்களில் நேரடியான தந்தைகளைப் போலப் புரியக்கூடும்; ‘முன்னோர்கள்’ மரபுத்தொடரின் சூழல்பொருளைத் தெளிவாகப் பாதுகாக்கிறது.
