  text: בְּרִית֙ בֵּינִ֣/י וּ/בֵינֶ֔/ךָ בֵּ֥ין אָבִ֖/י וּ/בֵ֣ין אָבִ֑י/ךָ הִנֵּה֩ שָׁלַ֨חְתִּֽי לְ/ךָ֥ שֹׁ֨חַד֙ כֶּ֣סֶף וְ/זָהָ֔ב לֵ֣ךְ הָפֵ֗רָ/ה אֶת בְּרִֽיתְ/ךָ֙ אֶת בַּעְשָׁ֣א מֶֽלֶךְ יִשְׂרָאֵ֔ל וְ/יַעֲלֶ֖ה מֵ/עָלָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/019.yaml
  text: There is a covenant between me and you, between my father and your father. Look, I have sent you a bribe of silver and gold. Go, break your covenant with Baasha king of Israel, so that he may withdraw from me.
translation:
  language: ta
  text: “எனக்கும் உனக்கும் இடையே, என் தந்தைக்கும் உன் தந்தைக்கும் இடையே உடன்படிக்கை இருக்கிறது. இதோ, வெள்ளியையும் தங்கத்தையும் உனக்கு லஞ்சமாக அனுப்பியிருக்கிறேன். நீ போய் இஸ்ரவேலின் அரசன் பாஷாவோடு உனக்குள்ள உடன்படிக்கையை முறித்துவிடு; அப்போது அவன் என்னிடமிருந்து விலகிப் போவான்.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּרִית
  choice: உடன்படிக்கை
  rationale: தரப்புகளுக்கிடையிலான கட்டுப்படுத்தும் ஒப்பந்தத்தை இயல்பாகவும் துல்லியமாகவும் குறிக்கிறது.
- source_word: שֹׁחַד
  choice: லஞ்சம்
  rationale: இச்சொல்லின் வழக்கமான எதிர்மறை பொருளையும், வெள்ளி தங்கம் கொடுத்து மற்றொரு உடன்படிக்கையை முறிக்கச் செய்யும் சூழலையும் நேரடியாகப் பிரதிபலிக்கிறது.
- source_word: הָפֵרָה
  choice: முறித்துவிடு
  rationale: உடன்படிக்கையைச் செல்லாததாக்குதல் அல்லது மீறுதல் என்ற ஹிப்ரு வினையின் வலிமையைப் பாதுகாக்கிறது.
- source_word: וְיַעֲלֶה מֵעָלָי
  choice: அப்போது அவன் என்னைவிட்டு விலகிச் செல்வான்
  rationale: பாஷா தன் அழுத்தத்தையோ முற்றுகையையோ நீக்கி அகல்வதைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: கொடுப்பனவின் ஒழுக்கத் தன்மை
  choice: லஞ்சம்
  alternative: பரிசு
  rationale: שֹׁחַד என்பதன் எதிர்மறை நிழற்பொருளை மென்மைப்படுத்தாமல் வைத்திருக்கிறது; விவரிக்கப்படும் செயலை உரை நீதிப்படுத்துவதாகவும் மாற்றவில்லை.
- issue: முடிவைக் குறிக்கும் வினை வடிவம்
  choice: அப்போது அவன் என்னைவிட்டு விலகிச் செல்வான்
  alternative: அவன் என்னைவிட்டு விலகிச் செல்லும்படி
  rationale: ஹிப்ருவின் தொடர்வினை இங்கு எதிர்பார்க்கப்படும் விளைவைச் சுட்டலாம்; அதனை உறுதியான நோக்கவாக்கியமாக மட்டுமே கட்டுப்படுத்தாமல் மொழிபெயர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், அரசியல் உடன்படிக்கைச் சூழலுக்கேற்ற கண்ணியமான நேரடி உரை. ‘இதோ’ என்பது הִנֵּה-வின் கவன ஈர்ப்பைத் தக்கவைக்கிறது; ‘அரசன்’ என்பது பொதுவாசகர்களுக்கு இயல்பான அரசப் பட்டமாகப் பயன்படுத்தப்பட்டுள்ளது.
