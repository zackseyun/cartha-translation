base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/027.yaml
  text: Then Baasha son of Ahijah[a], of the house of Issachar, conspired against him, and Baasha struck him down at Gibbethon, which belonged to the Philistines[c][b], while Nadab and all Israel were besieging Gibbethon.
translation:
  language: ta
  text: இசக்கார் வம்சத்தைச் சேர்ந்த அகியாவின் மகன் பாஷா, நாதாபுக்கு எதிராகச் சதி செய்தான்.[a] பெலிஸ்தியருக்குச் சொந்தமான[c] கிபெத்தோனில் பாஷா அவனைத் தாக்கி வீழ்த்தினான்.[b] அப்போது நாதாபும் இஸ்ரவேலர் அனைவரும் கிபெத்தோனை முற்றுகையிட்டுக்கொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனுக்கு எதிராகத் திட்டம் தீட்டினான்” / “அவனுக்கு எதிராகச் சதிக்கூட்டம் அமைத்தான்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவனை அடித்து வீழ்த்தினான்” / “அவனைக் கொன்றான்”; எபிரேய மொழியில் சொல்லுக்கு சொல், “அவனை அடித்தான்.”
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “பெலிஸ்தியரின் கட்டுப்பாட்டில் இருந்த.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְשֹׁר עָלָיו
  choice: அவனுக்கு எதிராகச் சதிசெய்தான்
  rationale: קשר עם עַל என்பது ஒருவருக்கு எதிராக அரசியல் சதி அமைப்பதைக் குறிக்கிறது; நவீனத் தமிழில் ‘எதிராகச் சதிசெய்தான்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: בַּעְשָׁא בֶן אֲחִיָּה
  choice: அகியாவின் மகன் பாஷா
  rationale: எபிரேயப் பெயர்கள் தமிழில் ஒலிபெயர்க்கப்பட்டு, בֶּן இயல்பான உறவுமுறைச் சொல்லான ‘மகன்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: לְבֵית יִשָּׂשכָר
  choice: இசக்கார் வம்சத்தைச் சேர்ந்த
  rationale: இங்கு בַּיִת என்பது குடியிருப்பை அல்ல, குடும்ப/குல வழியைச் சுட்டுகிறது; ‘வம்சத்தைச் சேர்ந்த’ என்பது சாதாரண வாசகருக்குத் தெளிவாக உள்ளது.
- source_word: וַיַּכֵּהוּ
  choice: அவனை வெட்டி வீழ்த்தினான்
  rationale: נכה என்பதன் அடிப்படைத் தாக்குதல் உருவகத்தைத் தக்கவைத்து, இச்சூழலில் உயிரிழப்பை உணர்த்தும் இயல்பான தமிழ்ச் சொற்றொடர் தேர்ந்தெடுக்கப்பட்டது; ஆயினும் எபிரேயத்தில் ஆயுதம் வெளிப்படையாகக் குறிப்பிடப்படவில்லை என்பதால் மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בְּגִבְּתוֹן
  choice: கிபெத்தோனில்
  rationale: நகரத்தில் நிகழ்ந்த சம்பவத்தின் இடத்தைக் குறிக்க தமிழில் ‘-இல்’ இயல்பானது.
- source_word: אֲשֶׁר לַפְּלִשְׁתִּים
  choice: பெலிஸ்தியருக்குச் சொந்தமான
  rationale: லாமேத் அமைப்பு உடைமை அல்லது கட்டுப்பாட்டைக் குறிக்கலாம்; நேரடியான பொருள் முதன்மை உரையில் வைக்கப்பட்டு, இராணுவக் கட்டுப்பாடு என்ற சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- source_word: וְנָדָב וְכָל יִשְׂרָאֵל
  choice: அப்போது நாதாபும் இஸ்ரவேலர் அனைவரும்
  rationale: இங்குள்ள இணைப்புச்சொல் பின்னணியில் நடந்துகொண்டிருந்த சூழலை அறிமுகப்படுத்துகிறது; ‘அப்போது’ தமிழில் அந்தச் சூழ்நிலைத் தொடர்பைத் தெளிவாக்குகிறது.
- source_word: צָרִים עַל גִּבְּתוֹן
  choice: கிபெத்தோனை முற்றுகையிட்டுக்கொண்டிருந்தார்கள்
  rationale: צור על இராணுவச் சூழலில் முற்றுகையிடுதலைக் குறிக்கிறது; எபிரேயப் பங்கேற்பு வடிவத்தின் தொடர்நிலையை ‘-க்கொண்டிருந்தார்கள்’ வெளிப்படுத்துகிறது.
