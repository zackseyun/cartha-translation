translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான வரலாற்று உரைநடை பயன்படுத்தப்பட்டது. ‘நாதாபுக்கு எதிராக’ எனப் பெயர் வெளிப்படையாகத் தரப்பட்டது; எபிரேயத்தின் ஆண்பால் ஒருமைச் சுட்டுப்பெயர் முந்தைய வசனத்திலுள்ள நாதாபைக் குறிக்கிறது. அடிக்குறிப்பு குறியீடுகள் அவை விளக்கும் சொற்றொடர்களுக்குப் பின் வைக்கப்பட்டுள்ளன.
