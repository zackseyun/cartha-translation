revisions:
- from: 'அப்போது ஆசா, யாவேவின் ஆலயக் கருவூலங்களிலும் அரசனின் அரண்மனைக் கருவூலங்களிலும்[a] மீதியாயிருந்த வெள்ளி, தங்கம் அனைத்தையும் எடுத்து, அவற்றைத் தன் பணியாளர்களிடம் ஒப்படைத்தான். பின்பு ஆசா அரசன் அந்தப் பணியாளர்களைத் தமஸ்குவில் குடியிருந்த ஆராம்[b] அரசனான பென்-அதாதிடம் அனுப்பினான். பென்-அதாத் தப்ரிம்மோனின் மகன்; தப்ரிம்மோன் எசியோனின் மகன். ஆசா அவர்களிடம் இவ்வாறு சொல்லியனுப்பினான்: [c]'
  to: 'அப்போது ஆசா, யாவேவின் ஆலயக் கருவூலங்களிலும் அரச அரண்மனையின் கருவூலங்களிலும்[a] மீதியாக இருந்த வெள்ளி, தங்கம் அனைத்தையும் எடுத்து, அவற்றைத் தன் பணியாளர்களிடம் ஒப்படைத்தான். பின்னர் ஆசா அரசன் அவற்றைத் தமஸ்குவில் குடியிருந்த ஆராமின் அரசனாகிய, ஹெஸியோனின் மகன் தப்ரிம்மோனின் மகன் பென்-ஹதாத்திடம் அனுப்பி, இவ்வாறு கூறினான்:'
  rationale: The revision restores the silver and gold as the items sent to Ben-hadad, as indicated by the narrative sequence and corroborated by the parallel account. It removes the unsupported statement that Asa addressed the servants, preserves the direct-speech introduction, and regularizes the personal-name transliterations. The former ambiguity footnote is removed because the revised wording follows the contextually best-supported antecedent rather than elevating a less likely grammatical possibility.
