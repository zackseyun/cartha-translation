  text: וַ/יִּקַּ֣ח אָ֠סָא אֶת כָּל הַ/כֶּ֨סֶף וְ/הַ/זָּהָ֜ב הַֽ/נּוֹתָרִ֣ים בְּ/אוֹצְר֣וֹת בֵּית יְהוָ֗ה וְ/אֶת אֽוֹצְרוֹת֙ בֵּ֣ית מלך וַֽ/יִּתְּנֵ֖/ם בְּ/יַד עֲבָדָ֑י/ו וַ/יִּשְׁלָחֵ֞/ם הַ/מֶּ֣לֶךְ אָסָ֗א אֶל בֶּן הֲ֠דַד בֶּן טַבְרִמֹּ֤ן בֶּן חֶזְיוֹן֙ מֶ֣לֶךְ אֲרָ֔ם הַ/יֹּשֵׁ֥ב בְּ/דַמֶּ֖שֶׂק לֵ/אמֹֽר־־׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/018.yaml
  text: Then Asa took all the silver and the gold that remained in the treasuries of the house of Yahweh and in the treasuries of the king’s house[a], and put them into the hand of his servants. Then King Asa sent them to Ben-hadad son of Tabrimmon, son of Hezion, king of Aram, who lived in Damascus, saying[b],
translation:
  language: ta
  text: 'அப்போது ஆசா, யாவேவின் ஆலயக் கருவூலங்களிலும் அரச அரண்மனையின் கருவூலங்களிலும்[a] மீதியாக இருந்த வெள்ளி, தங்கம் அனைத்தையும் எடுத்து, அவற்றைத் தன் பணியாளர்களிடம் ஒப்படைத்தான். பின்னர் ஆசா அரசன் அவற்றைத் தமஸ்குவில் குடியிருந்த ஆராமின் அரசனாகிய, ஹெஸியோனின் மகன் தப்ரிம்மோனின் மகன் பென்-ஹதாத்திடம் அனுப்பி, இவ்வாறு கூறினான்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்கு சொல்: ‘அரசனின் வீட்டின் கருவூலங்கள்.’ இங்கு ‘வீடு’ என்பது அரச அரண்மனையைக் குறிக்கிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח אָסָא
  choice: அப்போது ஆசா ... எடுத்து
  rationale: வாவ் தொடர்வினை கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது; ‘அப்போது’ இயல்பான தமிழ் நிகழ்வோட்டத்தை அளிக்கிறது.
- source_word: כָּל הַכֶּסֶף וְהַזָּהָב הַנּוֹתָרִים
  choice: மீதியாயிருந்த வெள்ளி, தங்கம் அனைத்தையும்
  rationale: כָּל என்பதன் முழுமையையும் הַנּוֹתָרִים என்பதன் ‘எஞ்சியிருந்த’ பொருளையும் இயல்பான தமிழில் காக்கிறது.
- source_word: בְּאוֹצְרוֹת בֵּית יְהוָה
  choice: யாவேவின் ஆலயக் கருவூலங்களில்
  rationale: בֵּית יְהוָה இச்சூழலில் ஆலயத்தைக் குறிக்கிறது; אֹצָרוֹת விலைமதிப்புள்ள பொருட்கள் வைக்கப்பட்ட கருவூலங்கள். יְהוָה தனிப்பெயராக ‘யாவே’ என ஒலிபெயர்க்கப்படுகிறது.
- source_word: וְאֶת אֹצְרוֹת בֵּית מֶלֶךְ
  choice: அரசனின் அரண்மனைக் கருவூலங்களிலும்
  rationale: எபிரெயச் சொற்றொடர் சொல்லுக்கு சொல் ‘அரசனின் வீடு’; இச்சூழலில் அது அரச அரண்மனையைக் குறிக்கிறது. ‘-இலும்’ இரண்டு இடங்களிலும் இருந்தவற்றைத் தெளிவாக இணைக்கிறது.
- source_word: וַיִּתְּנֵם בְּיַד עֲבָדָיו
  choice: அவற்றைத் தன் பணியாளர்களிடம் ஒப்படைத்தான்
  rationale: ‘கையில் கொடுத்தான்’ என்ற எபிரெய மரபுத்தொடர் பொறுப்பாக ஒப்படைப்பதைக் குறிக்கிறது. இங்கு עֲבָדִים அரசனின் பணியாளர்கள் அல்லது அதிகாரிகள் என்பதால் ‘பணியாளர்கள்’ பொருத்தமானது.
- source_word: וַיִּשְׁלָחֵם
  choice: அந்தப் பணியாளர்களை ... அனுப்பினான்
  rationale: ஆண்பால் பன்மை பின்னொட்டு மிக அண்மையில் வரும் עֲבָדָיו என்பதைக் குறிக்கலாம்; தூதுச் செய்தியை எடுத்துச் செல்லும் சூழலும் இதை ஆதரிக்கிறது. இருப்பினும் அது வெள்ளி, தங்கத்தைக் கூட்டாகக் குறிக்கக்கூடிய இலக்கண வாய்ப்பை அடிக்குறிப்பு பதிவு செய்கிறது.
- source_word: בֶּן הֲדַד בֶּן טַבְרִמֹּן בֶּן חֶזְיוֹן
  choice: பென்-அதாத் தப்ரிம்மோனின் மகன்; தப்ரிம்மோன் எசியோனின் மகன்
  rationale: பெயர்களையும் இரண்டு தலைமுறை வம்ச அடையாளத்தையும் காக்கிறது; நீண்ட அடுக்கை நவீன தமிழில் தெளிவாக இரு உட்பிரிவுகளாக வழங்குகிறது.
- source_word: מֶלֶךְ אֲרָם
  choice: ஆராம் அரசன்
  rationale: பிற்கால வழக்கமான ‘சிரியா’ என்பதற்குப் பதிலாக மூலத்தின் வரலாற்றுப் புவியியல் பெயரான אֲרָם ஒலிபெயர்க்கப்படுகிறது.
- source_word: הַיֹּשֵׁב בְּדַמֶּשֶׂק
  choice: தமஸ்குவில் குடியிருந்த
  rationale: יֹשֵׁב இங்கு இருப்பிடம் அல்லது குடியிருப்பைக் குறிக்கிறது; ‘குடியிருந்த’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: לֵאמֹר
  choice: 'இவ்வாறு சொல்லியனுப்பினான்:'
  rationale: அடுத்த வசனத்தில் வரும் நேரடிக் கூற்றை அறிமுகப்படுத்துகிறது. தமிழில் ‘சொல்லியனுப்பினான்’ தூதர்கள் வழியான செய்தியையும் தொடரும் உரையையும் இயல்பாக இணைக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூலத்தில் பட்டப்பெயர் அல்ல, நான்கெழுத்து இறைத் தனிப்பெயர் உள்ளது. அதை மறைக்காமல் தமிழில் ஒலிபெயர்க்கிறது.
- issue: אֲרָם என்ற வரலாற்றுப் பெயர்
  choice: ஆராம்
  alternative: சிரியா
  rationale: மூல மொழியின் வரலாற்று-புவியியல் அடையாளத்தைப் பாதுகாக்கிறது; ‘சிரியா’ என்பது வழக்கமான பிற்காலப் பெயர்.
- issue: וַיִּשְׁלָחֵם என்பதிலுள்ள பன்மைப் பெயர்ச்சுட்டியின் முன்னிலை
  choice: அந்தப் பணியாளர்களை அனுப்பினான்
  alternative: வெள்ளி, தங்கத்தை அனுப்பினான்
  rationale: அண்மையிலுள்ள ஆண்பால் பன்மையான ‘பணியாளர்கள்’ இயல்பான முன்னிலை; ஆனால் விலைமதிப்புள்ள பொருட்களைக் குறிக்கும் வாசிப்பும் இலக்கண ரீதியாகச் சாத்தியமானதால் அடிக்குறிப்பில் ambiguity காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் மரியாதைமிக்க நடையிலும் வடிவமைக்கப்பட்டது. ‘ஆலயம்,’ ‘கருவூலம்,’ ‘அரண்மனை’ போன்ற பொதுவாகப் புரியும் சொற்கள் பயன்படுத்தப்பட்டுள்ளன. வம்ச அடையாளம் தெளிவுக்காக இரண்டு குறுங்கூற்றுகளாகப் பிரிக்கப்பட்டது; வசன முடிவிலுள்ள இரட்டைப் புள்ளி அடுத்த வசனத்தின் நேரடிக் கூற்றை எதிர்நோக்குகிறது.
