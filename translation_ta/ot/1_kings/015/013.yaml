base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/013.yaml
  text: He also removed Maacah his mother from being queen mother[a], because she had made an abominable image for Asherah[c][b]. Asa cut down her image and burned it in the Kidron Valley.
translation:
  language: ta
  text: அவர் தம் தாயான மாக்காவையும் அரச அன்னை பதவியிலிருந்து நீக்கினார்[a]; ஏனெனில், அவள் அசேராவுக்காக[b] அருவருப்பான ஒரு வழிபாட்டுப் பொருளைச் செய்திருந்தாள்[c]. ஆசா அவளுடைய அந்தப் பொருளை வெட்டி, கீதரோன் பள்ளத்தாக்கில் எரித்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “அவருடைய தாய்.” அரச குடும்ப வழக்கில் இது சில சமயங்களில் பாட்டி அல்லது வேறொரு பெண் மூதாதையைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “அசேரா” என்பது அசேரா என்னும் தேவதையையோ அவளுடைய வழிபாட்டுச் சின்னத்தையோ குறிக்கலாம்.
    reason: alternative_reading
  - marker: c
    text: மூலச்சொல் அருவருப்பான அல்லது திகிலூட்டும் ஒன்றைக் குறிக்கிறது. அந்த வழிபாட்டுப் பொருளின் துல்லியமான வடிவம் உறுதியாகத் தெரியவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: அவரும் / ...யும்
  rationale: முந்தைய சீர்திருத்தச் செயல்களுடன் இதையும் இணைக்கும் கூட்டுப்பொருளை இயல்பான தமிழில் காட்டுகிறது; எழுவாய் வினைச்சூழலிலிருந்து தரப்படுகிறது.
- source_word: מַעֲכָה אִמּוֹ
  choice: தம் தாயான மாக்கா
  rationale: எபிரெயச் சொல்லின் நேரடிப் பொருளான ‘அவருடைய தாய்’ என்பதைக் காக்கிறது; அரச மரபில் இது பாட்டி அல்லது பெண் மூதாதையையும் குறிக்கக்கூடும் என்பதால் அடிக்குறிப்பு தரப்படுகிறது.
- source_word: וַיְסִרֶהָ מִגְּבִירָה
  choice: அரச அன்னை பதவியிலிருந்து நீக்கினார்
  rationale: הַגְּבִירָה அரசவையின் அதிகாரபூர்வமான முதன்மைப் பெண் அல்லது அரச அன்னைப் பதவியைக் குறிக்கிறது; ‘பதவியிலிருந்து நீக்கினார்’ என்பது causative வினையையும் பதவிச் சூழலையும் தெளிவாகக் காட்டுகிறது.
- source_word: אֲשֶׁר עָשְׂתָה
  choice: ஏனெனில், அவள் ... செய்திருந்தாள்
  rationale: இங்கு உறவுப்பெயர் மாக்கா நீக்கப்பட்டதற்கான காரணத்தை அறிமுகப்படுத்துவதாகப் புரிந்துகொள்ளப்படுகிறது; முற்கால நிறைவு வினை நிகழ்வுகளின் வரிசையை இயல்பாக்குகிறது.
- source_word: מִפְלֶצֶת
  choice: அருவருப்பான ஒரு வழிபாட்டுப் பொருள்
  rationale: சொல்லின் வெறுக்கத்தக்க அல்லது திகிலூட்டும் மதப்பொருள் நுணுக்கத்தைக் காட்டுகிறது; அதன் துல்லியமான வடிவத்தை ‘சிலை’ என்று அளவுக்கு மீறி நிர்ணயிக்காமல் விடுகிறது.
- source_word: לָאֲשֵׁרָה
  choice: அசேராவுக்காக
  rationale: அசேரா என்பது தெய்வத்தையோ அதன் வழிபாட்டுச் சின்னத்தையோ குறிக்கலாம்; பெயரை ஒலிபெயர்ப்பதால் மூலத்தின் தெளிவின்மை பாதுகாக்கப்படுகிறது.
- source_word: וַיִּכְרֹת ... אֶת מִפְלַצְתָּהּ
  choice: அவளுடைய அந்தப் பொருளை வெட்டி வீழ்த்தி
  rationale: כרת என்பதன் நேரடியான வெட்டுதல் அல்லது வெட்டி வீழ்த்துதல் என்ற செயலுணர்வைக் காக்கிறது; முன் குறிப்பிடப்பட்ட பொருளையே சுட்டுகிறது.
- source_word: וַיִּשְׂרֹף
  choice: எரித்துப்போட்டார்
  rationale: முழுமையாக எரித்த செயலை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: בְּנַחַל קִדְרוֹן
  choice: கீதரோன் பள்ளத்தாக்கில்
  rationale: נחל என்பது ஓடை, வறண்ட ஓடைப்படுகை அல்லது பள்ளத்தாக்கைக் குறிக்கலாம்; எருசலேம் நிலவியலுக்கு ஏற்ற, பொதுவாசகருக்குப் புரியும் சொல்லாக்கம்.
theological_decisions:
- issue: אֲשֵׁרָה என்பதன் குறிப்பு
  choice: ‘அசேரா’ என்று குறிப்பிட்டுப் பொருளைத் தீர்மானிக்காமல் வைத்தல்
  alternative: ‘அசேரா தேவதை’ அல்லது ‘அசேரா கம்பம்/வழிபாட்டுச் சின்னம்’
  rationale: இச்சொல் தேவதையையோ அவளுடன் தொடர்புடைய வழிபாட்டுச் சின்னத்தையோ குறிக்கக்கூடும். வசனம் தயாரிக்கப்பட்ட வேறொரு பொருளையும் குறிப்பிடுவதால், இவற்றில் ஒன்றை மட்டும் தேர்வு செய்வது மூலத்தின் உண்மையான தெளிவின்மையை அகற்றிவிடும்.
- issue: מִפְלֶצֶת என்பதன் துல்லிய வடிவம்
  choice: ‘அருவருப்பான ஒரு வழிபாட்டுப் பொருள்’
  alternative: ‘அருவருப்பான சிலை’, ‘திகிலூட்டும் பொருள்’
  rationale: இது கண்டிக்கப்படும் வழிபாட்டுப் பொருள் என்பது தெளிவு; ஆனால் அது சிலையா, செதுக்கப்பட்ட உருவமா, வேறு வகைப் பொருளா என்பது உறுதியில்லை. எனவே வடிவத்தை நிர்ணயிக்காத சொல்லாக்கம் தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில் dignified ஆனால் பொதுவாசகருக்கு எளிதான நடை பயன்படுத்தப்பட்டுள்ளது. ‘அரச அன்னை’ அதிகாரபூர்வ அரசவைப் பதவியை உணர்த்துகிறது. ‘அசேரா’ ஒலிபெயர்க்கப்பட்டு, தெய்வம்/வழிபாட்டுச் சின்னம் என்ற மூலத் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
