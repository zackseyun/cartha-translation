  text: וְ/נָדָ֣ב בֶּן יָרָבְעָ֗ם מָלַךְ֙ עַל יִשְׂרָאֵ֔ל בִּ/שְׁנַ֣ת שְׁתַּ֔יִם לְ/אָסָ֖א מֶ֣לֶךְ יְהוּדָ֑ה וַ/יִּמְלֹ֥ךְ עַל יִשְׂרָאֵ֖ל שְׁנָתָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/025.yaml
  text: Nadab son of Jeroboam became king over Israel in the second year of Asa king of Judah, and he reigned over Israel two years.
translation:
  language: ta
  text: யூதாவின் அரசன் ஆசாவின் ஆட்சியின் இரண்டாம் ஆண்டில், யெரொபெயாமின் மகன் நாதாப் இஸ்ரவேலின் அரசனானான். அவன் இஸ்ரவேலை இரண்டு ஆண்டுகள் ஆட்சி செய்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/נָדָב בֶּן יָרָבְעָם
  choice: யெரொபெயாமின் மகன் நாதாப்
  rationale: வம்ச அடையாளத்தை இயல்பான நவீனத் தமிழில் தருகிறது. தொடக்க வாவ் அடுத்த அரசாட்சிப் பதிவை இணைக்கிறது; தனியான காலவினையடை ஒன்றைச் சேர்க்காமல் தமிழின் தொடர்ச்சியால் அதன் பணி வெளிப்படுகிறது.
- source_word: מָלַךְ עַל יִשְׂרָאֵל
  choice: இஸ்ரவேலின் அரசனானான்
  rationale: முதல் מָלַךְ அரசேற்றத்தைக் குறிக்கிறது. எனவே காலநீடிப்பைக் குறிக்கும் ‘ஆட்சி செய்தான்’ என்பதற்குப் பதிலாக ‘அரசனானான்’ பயன்படுத்தப்பட்டது.
- source_word: בִּ/שְׁנַת שְׁתַּיִם לְ/אָסָא מֶלֶךְ יְהוּדָה
  choice: யூதாவின் அரசன் ஆசாவின் ஆட்சியின் இரண்டாம் ஆண்டில்
  rationale: எபிரேய அரசாண்டுக் கணக்கீட்டு மரபைத் தெளிவான தமிழ் வரிசையில் வெளிப்படுத்துகிறது; לְ ஆசாவின் ஆட்சியை ஒப்பீட்டுக் காலக்குறிப்பாகச் சுட்டுகிறது.
- source_word: וַ/יִּמְלֹךְ עַל יִשְׂרָאֵל
  choice: அவன் இஸ்ரவேலை ... ஆட்சி செய்தான்
  rationale: இரண்டாவது வினைச்சொல் ஆட்சியின் காலநீடிப்புடன் வருகிறது; ஆகவே ‘ஆட்சி செய்தான்’ என்பது இங்கு பொருத்தமானது.
- source_word: שְׁנָתָיִם
  choice: இரண்டு ஆண்டுகள்
  rationale: இருமை வடிவத்தின் நேரடியான கால அளவை இயல்பான தமிழில் வழங்குகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், வரலாற்று அரசாட்சி பதிவுக்கேற்ற சுருக்கமானதும் கண்ணியமானதும் எளிதில் புரியக்கூடியதுமான நடை. ‘அரசனானான்’ மற்றும் ‘ஆட்சி செய்தான்’ என்ற வேறுபாடு அரசேற்றத்தையும் ஆட்சிக்காலத்தையும் தனித்தனியாகப் பாதுகாக்கிறது.
