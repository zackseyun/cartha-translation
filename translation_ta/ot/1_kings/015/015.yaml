reference: 1 Kings 15:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יָּבֵא֙ אֶת קָדְשֵׁ֣י אָבִ֔י/ו ו/קדש/ו בֵּ֣ית יְהוָ֑ה כֶּ֥סֶף וְ/זָהָ֖ב וְ/כֵלִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/015.yaml
  text: And he brought into the house of Yahweh the holy things of his father and his own holy things[a], silver and gold and vessels.
translation:
  language: ta
  text: அவன் தன் தந்தையின் பரிசுத்தப் பொருள்களையும், தன்னுடைய பரிசுத்தப் பொருள்களையும்—அதாவது வெள்ளி, தங்கம், பாத்திரங்கள் ஆகியவற்றை—யாவேயின் ஆலயத்திற்குள் கொண்டுவந்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֵא
  choice: கொண்டுவந்தான்
  rationale: בוא என்பதன் ஹிஃபில் வடிவம் ‘கொண்டுவருதல்’ என்று பொருள்படும்; இலக்கு வெளிப்படையாகக் கூறப்படுவதால் இச்சொல் இயல்பாக உள்ளது.
- source_word: קָדְשֵׁי אָבִיו
  choice: தன் தந்தையின் பரிசுத்தப் பொருள்கள்
  rationale: קדשׁ இங்கு அருவமான பரிசுத்தத்தைக் குறிக்காமல், கடவுளுக்கெனப் பிரித்துவைக்கப்பட்ட பொருள்களைக் குறிக்கிறது. ‘பரிசுத்தப் பொருள்கள்’ வழிபாட்டுச் சூழலைப் பாதுகாக்கிறது.
- source_word: וְקָדְשׁוֹ
  choice: தன்னுடைய பரிசுத்தப் பொருள்கள்
  rationale: ஒருமை வடிவிலுள்ள பெயர்ச்சொல் இங்கு தொகுப்புப் பொருளில் வருகிறது; முந்தைய சொற்றொடருடனான இணை அமைப்பைப் பாதுகாக்க இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: בֵּית יְהוָה
  choice: யெகோவாவின் ஆலயம்
  rationale: சொல்லாட்சிப்படி ‘யெகோவாவின் வீடு’ என்றாலும், இச்சூழலில் அது வழிபாட்டு ஆலயத்தைக் குறிக்கிறது; நவீன தமிழில் ‘ஆலயம்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: எபிரெய மூலத்தில் உள்ள தனிப்பெயரான יהוה என்பதை பொதுப்பட்டமாக மாற்றாமல், தமிழில் நிலைபெற்ற ‘யெகோவா’ என ஒலிபெயர்க்கிறது.
- source_word: כֶּסֶף וְזָהָב וְכֵלִים
  choice: வெள்ளி, தங்கம், பாத்திரங்கள்
  rationale: இவை பரிசுத்தமாக அர்ப்பணிக்கப்பட்ட பொருள்களை விளக்கும் இணைப்புப் பட்டியல். כלים ஆலயச் சூழலில் பாத்திரங்கள் அல்லது பயன்பாட்டுப் பொருள்களைக் குறிக்கலாம்; ‘பாத்திரங்கள்’ அந்தச் சூழலுக்கு ஏற்றது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: ஆண்டவர்; யாவே
  rationale: மூலத்தில் இறைவனின் தனிப்பெயர் நேரடியாக இருப்பதால் அதை ‘ஆண்டவர்’ என்ற பட்டமாக மாற்றாமல் ஒலிபெயர்க்கப்பட்டது. தமிழில் பரவலாக அறியப்படும் வடிவமாக ‘யெகோவா’ தேர்ந்தெடுக்கப்பட்டது.
- issue: קדשׁ என்பதன் வழிபாட்டுச் சார்ந்த பொருள்
  choice: பரிசுத்தப் பொருள்கள்
  alternative: அர்ப்பணித்த பொருள்கள்
  rationale: இவை இயல்பாகவே புனிதமானவையா அல்லது கடவுளுக்கென அர்ப்பணிக்கப்பட்டதால் புனித நிலை பெற்றவையா என்ற சொற்பொருள் இடைவெளியை முதன்மை உரை திறந்துவைக்கிறது; அடிக்குறிப்பு செயற்பாட்டுச் சார்ந்த மாற்றை வழங்குகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், கண்ணியமான வேதாகம நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய இணை அமைப்பு பாதுகாக்கப்பட்டுள்ளது; வெள்ளி, தங்கம், பாத்திரங்கள் என்பவை முன்கூறிய பரிசுத்தப் பொருள்களை விளக்கும் வகையில் இடைக்கோடுகளுக்குள் அமைக்கப்பட்டுள்ளன.
