- from: அவன் தன் தந்தையின் பரிசுத்தப் பொருள்களையும், தன்னுடைய பரிசுத்தப் பொருள்களையும்[a]—வெள்ளி, தங்கம், பாத்திரங்கள் ஆகியவற்றை—யெகோவாவின் ஆலயத்திற்குள் கொண்டுவந்தான்.
