base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/014.yaml
  text: But the high places were not removed; nevertheless[a], Asa’s heart was wholly devoted to Yahweh all his days.
translation:
  language: ta
  text: ஆனால் உயர்ந்த வழிபாட்டு இடங்கள் அகற்றப்படவில்லை. இருந்தபோதிலும், ஆசாவின் இதயம் அவரது வாழ்நாளெல்லாம் யாவேவுக்கு முழுமையாக அர்ப்பணிக்கப்பட்டிருந்தது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆசாவின் இதயம் அவரது வாழ்நாளெல்லாம் யாவேவுடன் பிளவுபடாததாக இருந்தது.” எபிரெய மொழியில் நேரடியாக, “ஆசாவின் இதயம் யாவேவுடன் முழுமையாக இருந்தது.”
    reason: שָׁלֵם மற்றும் עִם ஆகியவற்றின் நேரடியான சொல்லமைப்பையும், பிளவுபடாத பற்றுறுதி என்ற மாற்று அர்த்த வெளிப்பாட்டையும் பாதுகாக்கிறது.
lexical_decisions:
- source_word: וְהַבָּמוֹת
  choice: வழிபாட்டு மேடைகள்
  rationale: בָּמוֹת என்பது உள்ளூர் வழிபாட்டுக்காக அமைக்கப்பட்ட உயர்ந்த இடங்கள் அல்லது வழிபாட்டிடங்களைக் குறிக்கிறது. வெறும் ‘மேடைகள்’ என்ற சொல்லின் தெளிவின்மையைத் தவிர்க்க ‘வழிபாட்டு’ சேர்க்கப்பட்டது.
- source_word: לֹא סָרוּ
  choice: அகற்றப்படவில்லை
  rationale: இந்தச் சூழலில் סוּר என்பது அவை அங்கிருந்து நகரவில்லை என்பதல்ல; சீர்திருத்த நடவடிக்கையால் ஒழிக்கப்படவில்லை என்பதைக் குறிக்கிறது.
- source_word: רַק
  choice: இருந்தபோதிலும்
  rationale: רַק இங்கு வழிபாட்டு மேடைகள் அகற்றப்படாததற்கும் ஆசாவின் உள்ளார்ந்த உண்மைப்பற்றுக்கும் இடையிலான விட்டுக்கொடுக்கும் எதிர்மறைத் தொடர்பைக் காட்டுகிறது.
- source_word: לְבַב אָסָא
  choice: ஆசாவின் இதயம்
  rationale: לְבַב இங்கு உள்ளார்ந்த மனநிலை, விருப்பம், பற்றுறுதி ஆகியவற்றைக் குறிக்கிறது; தமிழில் இயல்பான உடைமைத் தொடராக மொழிபெயர்க்கப்பட்டது.
- source_word: שָׁלֵם
  choice: முழுமையாக அர்ப்பணிக்கப்பட்டிருந்தது
  rationale: ‘இதயம்’ மற்றும் யாவேவுடனான உறவு ஆகிய இச்சூழலில் שָׁלֵם குற்றமற்ற முழுநிறைவை அல்ல, முழுமையான அல்லது பிளவுபடாத பற்றுறுதியைக் குறிக்கிறது.
- source_word: עִם יְהוָה
  choice: யாவேவுக்கு
  rationale: עִם என்பதன் நேர்ப்பொருள் ‘உடன்’ என்றாலும், ‘அர்ப்பணிக்கப்பட்டிருந்தது’ என்பதோடு தமிழில் ‘யாவேவுக்கு’ என்பது இயல்பான இணைவு. நேரடியான வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய வேதாகமத்தின் தனிப்பெயரான יהוה, ஒரு பட்டப்பெயரால் மாற்றப்படாமல் தமிழில் ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டது.
- source_word: כָּל יָמָיו
  choice: அவரது வாழ்நாளெல்லாம்
  rationale: எபிரெய மொழியின் கால அளவைக் குறிக்கும் சொற்றொடரைத் தெளிவாகவும் இயல்பாகவும் எடுத்துரைக்கிறது.
theological_decisions:
- issue: வழிபாட்டு மேடைகள் அகற்றப்படாதபோதும் ஆசாவின் இதயம் ‘முழுமையாக’ இருந்ததாகக் கூறப்படுதல்
  choice: ஆசாவின் அடிப்படை உடன்படிக்கைப் பற்றுறுதி முழுமையானதாக இருந்தது; இது பாவமற்ற தன்மையையோ குறைபாடற்ற சீர்திருத்தத்தையோ குறிக்கவில்லை.
  alternative: ஆசா எல்லா வகையிலும் ஒழுக்கக் குற்றமற்றவர் என்று இவ்வசனம் அறிவிக்கிறது.
  rationale: அகற்றப்படாத வழிபாட்டு மேடைகளையும் שָׁלֵם இதயத்தையும் வசனம் அருகருகே வைப்பதால், செயல்களில் முழுக் குறையின்மையைவிட அடிப்படை விசுவாசப் பற்றுறுதியே வலியுறுத்தப்படுகிறது. மொழிபெயர்ப்பு இந்த இறையியல் இழுபறியைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் மரியாதைமிக்க நடையிலும் வடிவமைக்கப்பட்டது. ‘வழிபாட்டு மேடைகள்’ என்பது பண்டைய உள்ளூர் வழிபாட்டிடங்களைச் சுட்டுகிறது; ‘முழுமையாக அர்ப்பணிக்கப்பட்டிருந்தது’ என்பது பாவமற்ற நிறைவை அல்ல, முழு உள்ளப் பற்றுறுதியைக் குறிக்கிறது.
