  source_fidelity: ஆட்சிக்காலம், இடம், தாயின் பெயரைக் குறிப்பிடும் அரசர்-அறிவிப்பு, மற்றும் ‘மகள்’ என்ற நேரடியான உறவுச்சொல் ஆகியவை மூல எபிரெய உரைக்குத் துல்லியமாக உள்ளன. ஆனால் אֲבִישָׁלוֹם என்பதில் உள்ள שׁ (/ஷ்/) ஒலி முதன்மை உரையிலும் அடிக்குறிப்பிலும் ‘ச’ எனத் தவறாக வழங்கப்பட்டுள்ளது; அதனை ‘அபிஷாலோம்’ எனத் திருத்த வேண்டும்.
  naturalness: உரை நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் உள்ளது. ‘மூன்று ஆண்டுகள் அரசாண்டார்’ மற்றும் ‘அவருடைய தாயின் பெயர் ...’ ஆகியவை தெளிவான, பொருத்தமான நடையாகும்.
  terminology: ‘அரசாண்டார்,’ ‘எருசலேமில்,’ ‘மாகா,’ மற்றும் ‘மகள்’ ஆகிய தேர்வுகள் பொருத்தமானவை. வம்சவழிச் சாத்தியத்துக்கான அடிக்குறிப்பு உதவிகரமானது; ‘பெண் வழித்தோன்றல்’ என்பதற்குப் பதிலாக, பெண்-வழி வம்சத்தைத் தேவையின்றிக் குறிக்காத ‘பெண் சந்ததி’ பயன்படுத்தப்பட வேண்டும்.
