  yaml_path: translation/ot/1_kings/015/002.yaml
  text: He reigned three years in Jerusalem[b][a], and his mother’s name was Maacah daughter of Abishalom.
translation:
  language: ta
  text: அவர் எருசலேமில் மூன்று ஆண்டுகள் அரசாண்டார். அவருடைய தாயின் பெயர் மாகா; அவள் அபிஷாலோமின் மகள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய வம்சப்பட்டியல் பயன்பாட்டில் “மகள்” என்பது சில சூழல்களில் பேத்தி அல்லது பெண் சந்ததி என்ற விரிவான பொருளையும் குறிக்கலாம். இங்குள்ள பெயரின் எபிரெய வடிவம் “அபிஷாலோம்”; இது பொதுவாக அறியப்படும் “அப்சலோம்” என்ற பெயரின் மாற்று வடிவம்.
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁלֹשׁ שָׁנִים
  choice: மூன்று ஆண்டுகள்
  rationale: எண்ணுப்பெயரும் பன்மை பெயர்ச்சொல்லும் சேர்ந்து ஆட்சிக்காலத்தின் நீளத்தைக் குறிக்கின்றன; தமிழில் இயல்பாக இவ்வாறு வழங்கப்படுகிறது.
- source_word: מָלַךְ
  choice: அரசாண்டார்
  rationale: இங்கு Qal வினை அரியணை ஏறிய நிகழ்வை அல்ல, அரசராக ஆட்சி செய்ததைக் குறிக்கிறது.
- source_word: בִּירוּשָׁלִָם
  choice: எருசலேமில்
  rationale: בְּ முன்னொட்டு இடத்தைக் குறிக்கிறது; நகரப்பெயருடன் ‘-இல்’ இயல்பான தமிழ் வடிவம்.
- source_word: וְשֵׁם אִמּוֹ
  choice: அவருடைய தாயின் பெயர்
  rationale: அரசர்களைப் பற்றிய வழக்கமான குறிப்புச் சூத்திரத்தைப் பொருள் மாறாமல் இயல்பான தமிழில் வழங்குகிறது.
- source_word: מַעֲכָה
  choice: மாகா
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் இயன்றவரை தெளிவாக எழுத்துப்பெயர்க்கிறது.
- source_word: בַּת
  choice: மகள்
  rationale: சொல்லின் நேரடிப் பொருள் ‘மகள்’; வம்சப்பட்டியல் சூழலில் உள்ள விரிவான சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: אֲבִישָׁלוֹם
  choice: அபிசாலோம்
  rationale: இவ்வசனத்தில் காணப்படும் எபிரெய பெயர்வடிவமான אֲבִישָׁלוֹם என்பதை நேரடியாகத் தமிழில் எழுத்துப்பெயர்க்கிறது.
theological_decisions:
- issue: בַּת אֲבִישָׁלוֹם என்ற வம்ச உறவுச் சொற்றொடர்
  choice: முதன்மை உரையில் ‘அபிசாலோமின் மகள்’ என்ற நேரடிப் பொருளை வைத்தல்
  alternative: அபிசாலோமின் பேத்தி அல்லது பெண் வழித்தோன்றல்
  rationale: எபிரெய உரை நேரடியாக ‘மகள்’ என்கிறது. ஆனால் வம்சப்பட்டியல் பயன்பாட்டில் அது விரிவான பெண் வழித்தோன்றல் உறவையும் குறிக்கக்கூடும் என்பதால், அந்தத் தெளிவின்மையைத் தீர்த்துவிடாமல் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வரலாற்று நடையைப் பயன்படுத்துகிறது. ‘அரசாண்டார்’ என்பது அரசாட்சிச் சூழலுக்கு இயல்பான சொல். மூலத்தின் ஒரே வம்ச உறவுச் சொல்லை முதன்மை உரையில் காத்து, அதன் பரந்த சாத்தியத்தையும் பெயர்வடிவ வேறுபாட்டையும் ஒரே அடிக்குறிப்பில் தெளிவுபடுத்துகிறது.
