base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/004.yaml
  text: Nevertheless[a], for David’s sake Yahweh his God gave him a lamp in Jerusalem, to raise up his son after him and to establish Jerusalem.
translation:
  language: ta
  text: ஆனாலும், தாவீதின் பொருட்டு, அவனுடைய கடவுளான யாவே அவனுக்கு எருசலேமில் ஒரு விளக்கை[a] கொடுத்தார்; அவனுக்குப் பின் அவனுடைய மகனை எழும்பச் செய்வதற்கும் எருசலேமை நிலைநிறுத்துவதற்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஒளி’ என்றும் மொழிபெயர்க்கலாம். ‘எருசலேமில் அவனுக்கு ஒரு விளக்கைக் கொடுத்தார்’ என்பது அங்கே தாவீதின் அரச மரபைத் தொடர்ந்து நிலைக்கச் செய்வதைக் குறிக்கும் உருவகம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஆனாலும்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட அபியாமின் பாவநிலைக்கு மாறாக, தாவீதின் பொருட்டு அவனது அரச மரபு முற்றிலும் துண்டிக்கப்படவில்லை என்பதை இவ்வாக்கியம் காட்டுகிறது. ஆகவே, இங்கு உள்ள உரையாடல் தொடர்பை ‘ஆனாலும்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לְמַעַן דָּוִד
  choice: தாவீதின் பொருட்டு
  rationale: ஒருவரை முன்னிட்டு அல்லது அவருக்காகச் செய்யப்படும் செயலைக் குறிக்கும் எபிரேயச் சொற்றொடரின் பொருளைத் துல்லியமாகவும் கண்ணியமான நவீன தமிழிலும் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது ஒரு பட்டப்பெயர் அல்ல, இஸ்ரவேலின் கடவுளுடைய தனிப்பெயர்; எனவே தமிழில் ஒலிபெயர்த்து வழங்கப்படுகிறது.
- source_word: אֱלֹהָיו
  choice: அவனுடைய கடவுளாகிய
  rationale: எபிரேய உரையின் உடைமைப் பெயர்ச்சொல் அமைப்பை இயல்பான தமிழில் வழங்குகிறது; சூழலில் ‘அவன்’ அபியாமைக் குறிக்கிறது, ஆனால் பெயரைச் சேர்த்து பொருளை மிகுதியாகத் தீர்மானிக்கவில்லை.
- source_word: נִיר
  choice: விளக்கு
  rationale: சொல்லின் நேரடியான உருவகத்தைத் தக்கவைக்கிறது. இங்கு அது எருசலேமில் தொடர்ந்து நிலைக்கும் தாவீதின் அரச மரபைக் குறிக்கிறது.
- source_word: בִּירוּשָׁלָם
  choice: எருசலேமில்
  rationale: இடத்தைக் குறிக்கும் ב முன்னிடைச்சொல்லின் இயல்பான தமிழ் வடிவம்.
- source_word: לְהָקִים אֶת בְּנוֹ אַחֲרָיו
  choice: அவனுக்குப் பின் அவனுடைய மகனை எழும்பச் செய்வதற்கு
  rationale: மகன் தந்தைக்குப் பின் வாரிசாக எழும்புவதைச் சுட்டும் அரச மரபுச் சொல்லாட்சியைத் தக்கவைக்கிறது; ‘ஆட்சியாளனாக்க’ என்று வெளிப்படையாகச் சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: וּלְהַעֲמִיד אֶת יְרוּשָׁלָם
  choice: எருசலேமை நிலைநிறுத்துவதற்கு
  rationale: ‘நிற்கச் செய்தல், நிலைபெறச் செய்தல்’ என்ற வினையின் காரணவினைப் பொருளை வழங்கி, நகரத்தின் தொடர்ந்த நிலைப்பாட்டை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: נִיר என்ற உருவகம் தாவீதின் உடன்படிக்கை மற்றும் அரச மரபுடன் கொண்டுள்ள தொடர்பு
  choice: முதன்மை உரையில் ‘விளக்கு’ என்ற உருவகத்தைத் தக்கவைத்தல்
  alternative: அரச மரபு; வம்சம்; ஒளி
  rationale: ‘அரச மரபு’ என்று நேரடியாக மாற்றினால் எபிரேய உருவகமும் பிற தாவீதிய உரைகளுடனான ஒலிப்பும் மறைந்துவிடும். ‘விளக்கு’ அவற்றைத் தக்கவைக்கிறது; அடிக்குறிப்பு உருவகப் பொருளை விளக்குகிறது.
- issue: ‘அவனுடைய கடவுள்’ என்பதில் ‘அவன்’ யாரைக் குறிக்கிறது
  choice: சூழலில் அபியாம்/தற்போதைய அரசனைக் குறிக்கும் வகையில் பெயரைச் சேர்க்காமல் ‘அவனுடைய கடவுள்’ என வைத்தல்
  alternative: தாவீதின் கடவுள் என்று வெளிப்படையாக வழங்குதல்
  rationale: உடனடி சூழலின் முதன்மைச் சுட்டுப்பொருள் அபியாம். எனினும் எபிரேய உரையில் பெயர் மீண்டும் சொல்லப்படாததால், தமிழ் உரையும் சுட்டுப்பெயரைத் தக்கவைத்து தேவையற்ற மிகைத் தீர்மானத்தைத் தவிர்க்கிறது.
- issue: இரண்டு לְ வினையெச்சங்களின் தொடர்பு
  choice: யாவே விளக்கைக் கொடுத்ததன் நோக்கமாக இரண்டையும் வழங்குதல்
  alternative: விளக்கின் விளைவுகளாக அல்லது தொடர்ச்சியான நிகழ்வுகளாக வழங்குதல்
  rationale: לְהָקִים மற்றும் וּלְהַעֲמִיד ஆகிய இரண்டும் நோக்கத்தைக் குறிக்கும் இணையான வினையெச்சங்கள். தமிழில் ‘…செய்வதற்கும் …நிலைநிறுத்துவதற்கும்’ என்று வழங்குவது அந்த அமைப்பைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘யாவே’ தனிப்பெயராகவும், ‘விளக்கு’ மூல உருவகமாகவும் தக்கவைக்கப்பட்டுள்ளன; வாக்கியத்தின் நோக்கவியல் அமைப்பு தெளிவாக இருக்க இறுதியில் ‘அப்படிச் செய்தார்’ என்பது தமிழின் இயல்புக்காகச் சேர்க்கப்பட்டுள்ளது.
