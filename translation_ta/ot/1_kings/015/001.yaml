source:
  edition: WLC
  text: וּ/בִ/שְׁנַת֙ שְׁמֹנֶ֣ה עֶשְׂרֵ֔ה לַ/מֶּ֖לֶךְ יָרָבְעָ֣ם בֶּן נְבָ֑ט מָלַ֥ךְ אֲבִיָּ֖ם עַל יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/001.yaml
  text: In the eighteenth year of King Jeroboam son of Nebat[a], Abijam became king over Judah.
translation:
  language: ta
  text: நேபாத்தின் மகனான யெரொபெயாம் அரசனின் பதினெட்டாம் ஆண்டில், அபியாம்[a] யூதாவின்மேல் அரசனானான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெய மூலத்தில்: “அபியாம்”; இதே அரசன் மற்ற பகுதிகளில் “அபியா” என்று அழைக்கப்படுகிறார்.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/בִ/שְׁנַת
  choice: ஆண்டில்
  rationale: எபிரெயக் கதைநடையில் வரும் வழக்கமான காலக்குறிப்பை இயல்பான தமிழில் தருகிறது; தொடக்க இணைப்புச் சொல் தனியாக மொழிபெயர்க்கப்படவில்லை.
- source_word: שְׁמֹנֶה עֶשְׂרֵה
  choice: பதினெட்டாம்
  rationale: அரசாட்சிக் காலத்தைக் குறிக்கும் சூழலில் எண்ணிக்கையை வரிசை எண்ணாகத் தருவது தமிழில் இயல்பானது.
- source_word: לַ/מֶּלֶךְ
  choice: அரசனின்
  rationale: குறிப்பிடப்பட்ட ஆண்டு யெரொபெயாமின் ஆட்சியாண்டு என்பதைக் குறிக்கும் எபிரெய உறவைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: நேபாத்தின் மகனான யெரொபெயாம்
  rationale: தந்தை–மகன் அடையாளத்தை இயல்பான நவீன தமிழில் பாதுகாத்து, பெயர்களை வழக்கமான தமிழ் ஒலிபெயர்ப்பில் தருகிறது.
- source_word: מָלַךְ
  choice: அரசனானான்
  rationale: இங்கு வினைச்சொல் முழு ஆட்சிக்காலத்தை அல்ல, அரியணையேறி அரசனான நிகழ்வைக் குறிக்கிறது.
- source_word: אֲבִיָּם
  choice: அபியாம்
  rationale: மசோரா மூலப்பாடத்தில் இவ்வசனத்தில் உள்ள பெயர்வடிவத்தை நேரடியாகப் பாதுகாக்கிறது.
- source_word: עַל יְהוּדָה
  choice: யூதாவின்மேல்
  rationale: யூதா எனும் மக்கள் அல்லது நாட்டின்மீது செலுத்திய அரசாட்சியை עַל என்ற முன்னிடைச்சொல்லுக்கு நெருக்கமாகத் தருகிறது.
