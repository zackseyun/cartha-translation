  text: אֲשֶׁ֨ר עָשָׂ֥ה דָוִ֛ד אֶת הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה וְ/לֹֽא סָ֞ר מִ/כֹּ֣ל אֲשֶׁר צִוָּ֗/הוּ כֹּ֚ל יְמֵ֣י חַיָּ֔י/ו רַ֕ק בִּ/דְבַ֖ר אוּרִיָּ֥ה הַ/חִתִּֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/005.yaml
  text: because David had done what was right in the eyes of Yahweh and had not turned aside from anything that he had commanded him all the days of his life[a], except in the matter of Uriah the Hittite.
translation:
  language: ta
  text: ஏனெனில், தாவீது யாவேயின் பார்வையில் சரியானதைச் செய்தான்; தன் வாழ்நாளெல்லாம் அவர் தனக்குக் கட்டளையிட்ட எதிலிருந்தும் விலகவில்லை, இத்தியனான உரியாவின் விவகாரத்தைத் தவிர[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இத்தியனான உரியாவின் காரியத்தில்.’
    reason: בִּדְבַר என்பதற்கு இச்சூழலில் ‘விவகாரம்’ அல்லது ‘காரியம்’ என்ற பொருள் கொள்ள இயலும் என்பதைக் காட்டும் சொற்பொருள் மாற்று.
lexical_decisions:
- source_word: אֲשֶׁר
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்தின் கூற்றுக்கான காரணத்தை இங்கு தொடர்புச்சொல் அறிமுகப்படுத்துவதால், தமிழில் காரணத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עָשָׂה ... אֶת הַיָּשָׁר
  choice: நேர்மையானதைச் செய்தான்
  rationale: நன்மை அல்லது நேர்மை என மதிப்பிடப்படுவதைச் செய்தல் என்ற எபிரெய மொழிப்பயன்பாட்டைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: בְּעֵינֵי יְהוָה
  choice: யாவேயின் பார்வையில்
  rationale: மூலத்தின் ‘கண்களில்’ என்ற மதிப்பீட்டு உருவகத்தை, தமிழில் புரியக்கூடிய ‘பார்வையில்’ என்று பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகத் திருப்பெயரான நான்கு எழுத்துப் பெயரை பொதுவாக ஏற்கப்படும் தமிழ் ஒலிபெயர்ப்பில் தருகிறது.
- source_word: וְלֹא סָר
  choice: விலகவில்லை
  rationale: கட்டளையிடப்பட்ட வழியிலிருந்து பிறழாதிருத்தல் என்ற பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מִכֹּל אֲשֶׁר צִוָּהוּ
  choice: அவர் தனக்குக் கட்டளையிட்ட எதிலிருந்தும்
  rationale: ‘அவர் அவனுக்குக் கட்டளையிட்ட அனைத்திலிருந்தும்’ என்ற மொத்தத்தன்மையை எதிர்மறை வாக்கியத்தில் இயல்பான தமிழாகத் தருகிறது; சுட்டுப்பெயர்களின் தொடர்பும் தெளிவாக உள்ளது.
- source_word: כֹּל יְמֵי חַיָּיו
  choice: தன் வாழ்நாளெல்லாம்
  rationale: முழு வாழ்க்கைக் காலத்தையும் குறிக்கும் எபிரெய காலவழக்கைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: רַק
  choice: மட்டும் விதிவிலக்கு
  rationale: முந்தைய முழுமையான பாராட்டிலிருந்து ஒரே விதிவிலக்கைச் சுட்டும் செயல்பாட்டைத் தெளிவுபடுத்துகிறது.
- source_word: בִּדְבַר אוּרִיָּה
  choice: உரியாவின் விவகாரத்தில்
  rationale: דבר இக்கட்டமைப்பில் ‘விவகாரம்/சம்பவம்’ என்ற பொருளைக் கொண்டதால், முதன்மை உரையில் பரந்ததும் இயல்பானதுமான ‘விவகாரம்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: אוּרִיָּה הַחִתִּי
  choice: இத்தியனான உரியா
  rationale: தனிப்பெயரையும் இன அடையாளத்தையும் நேரடியாகத் தருகிறது.
theological_decisions:
- issue: தாவீதின் அறியப்பட்ட பாவங்களுக்கிடையிலும் அவனுடைய கீழ்ப்படிதலைப் பற்றிய விரிவான பாராட்டு
  choice: வசனத்தின் விரிவான பாராட்டையும் அது குறிப்பிடும் ஒரே விதிவிலக்கையும் அப்படியே வைத்தல்
  alternative: தாவீது பொதுவாக உண்மையுள்ளவனாக இருந்தான் என்ற விளக்கத்தையோ, மனந்திரும்புதல் அல்லது உடன்படிக்கை உண்மைத்தன்மை பற்றிய விரிவுரையையோ சேர்த்தல்
  rationale: மூல உரை தாவீதை வலுவாகப் பாராட்டியபடியே உரியாவைப் பற்றிய விவகாரத்தை மட்டும் விதிவிலக்காகக் கூறுகிறது. அந்த இறையியல் பதற்றத்தை மொழிபெயர்ப்பு விளக்கிச் சமப்படுத்தாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் வகையிலும் வேதாகம உரைக்கேற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘யாவே’ என்ற திருப்பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது; எபிரெய உரையின் காரணத் தொடர்பு, முழுமையான பாராட்டு, வெளிப்படையான விதிவிலக்கு ஆகியவை பாதுகாக்கப்பட்டுள்ளன.
