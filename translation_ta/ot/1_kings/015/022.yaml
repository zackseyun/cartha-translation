translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. அரசாணை சார்ந்த அழைப்புக்கு ‘ஆள் அனுப்பி அழைத்தான்’ என்றும், கட்டாயப் பணியிலிருந்து விலக்கு இல்லாததைத் தெளிவாகவும் வழங்குகிறது. இடப்பெயர்கள் ராமா, கேபா, மிஸ்பா என்றும், பெயர்கள் ஆசா, பாஷா, பென்யமீன் என்றும் ஒலிபெயர்க்கப்பட்டுள்ளன.
