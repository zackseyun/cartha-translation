base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/022.yaml
  text: Then King Asa summoned all Judah—no one was exempt—and they carried away the stones of Ramah and its timber[a], with which Baasha had built[c][b], and King Asa built with them Geba of Benjamin and Mizpah.
translation:
  language: ta
  text: பின்பு ஆசா அரசன் யூதா முழுவதிலும் அறிவித்தான்; ஒருவருக்கும் விலக்கு அளிக்கப்படவில்லை.[a] அவர்கள் ராமாவின் கற்களையும் அதன் மரப்பொருட்களையும் எடுத்துச் சென்றார்கள்; அவற்றைக் கொண்டு பாஷா ராமாவைக் கட்டியிருந்தான்.[b] ஆசா அரசன் அவற்றைக் கொண்டு பென்யமீனிலுள்ள கேபாவையும் மிஸ்பாவையும் கட்டினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில், “விலக்குப் பெற்றவர் ஒருவரும் இல்லை”; அதாவது, இந்தப் பணியிலிருந்து யாரும் விடுவிக்கப்படவில்லை.
    reason: lexical_alternative
  - marker: b
    text: “அவற்றைக் கொண்டு பாஷா ராமாவைக் கட்டியிருந்தான்” என்பது, பாஷா ராமாவைக் கட்டுவதற்கு அந்தக் கற்களையும் மரப்பொருட்களையும் பயன்படுத்தினான் என்பதைக் குறிக்கிறது.
    reason: referent_clarification
lexical_decisions:
- source_word: הִשְׁמִיעַ
  choice: ஆள் அனுப்பி அழைத்தான்
  rationale: ஹிஃபில் வடிவம் நேரடியாக ‘கேட்கச் செய்தான்’ என்றாலும், இச்சூழலில் யூதா முழுவதற்கும் அரசாணை விடுத்து மக்களைப் பணிக்கு அழைத்த நடைமுறைப் பொருளை இது இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: אֵין נָקִי
  choice: ஒருவருக்கும் விலக்கு அளிக்கப்படவில்லை
  rationale: இங்கு נָקִי அறநெறிசார் ‘குற்றமற்றவர்’ என்பதல்ல; கட்டாயப் பணியிலிருந்து விடுபட்டவர் அல்லது விலக்குப் பெற்றவர் என்பதே சூழலுக்குரிய பொருள்.
- source_word: וַיִּשְׂאוּ
  choice: எடுத்துச் சென்றார்கள்
  rationale: ராமாவிலிருந்து கட்டுமானப் பொருட்களை அகற்றி வேறிடத்துக்குக் கொண்டு சென்ற செயலை இயல்பாகக் குறிக்கிறது.
- source_word: אַבְנֵי הָרָמָה
  choice: ராமாவின் கற்கள்
  rationale: எபிரெயக் கட்டுநிலைத்தொடரை நெருக்கமாகப் பின்பற்றி, ராமாவின் கட்டுமானத்தில் இருந்த கற்களைக் குறிக்கிறது.
- source_word: עֵצֶיהָ
  choice: அதன் மரங்கள்
  rationale: עֵצִים என்பது இங்கு கட்டுமானத்திற்கான மரப்பொருட்களைக் குறிக்கிறது; ‘மரங்கள்’ என்பது எளிய, இயல்பான தமிழ், சூழல் அதன் பயன்பாட்டைத் தெளிவாக்குகிறது.
- source_word: אֲשֶׁר בָּנָה בַּעְשָׁא
  choice: அவற்றைக் கொண்டுதான் பாஷா கட்டியிருந்தான்
  rationale: தொடர்புப்பெயர் கற்களையும் மரங்களையும் சேர்த்துக் குறிக்கிறது என்பதைத் தெளிவாக்கி, பாஷா அவற்றை கட்டுமானப் பொருட்களாகப் பயன்படுத்தியதாக மொழிபெயர்க்கிறது; ‘தான்’ எபிரெய மூலத்தில் உள்ளதல்ல, தொடர்பைத் தெளிவுபடுத்தும் தமிழ் வலியுறுத்தல்.
- source_word: וַיִּבֶן בָּם
  choice: அவற்றைக் கொண்டு ... கட்டினான்
  rationale: בָּם என்பது முன் கூறப்பட்ட கற்களையும் மரங்களையும் கட்டுமானப் பொருட்களாகக் குறிக்கிறது.
- source_word: גֶּבַע בִּנְיָמִן
  choice: பென்யமீனிலுள்ள கேபா
  rationale: பென்யமீன் கோத்திரப் பகுதியில் இருந்த கேபா என்ற இடத்தைக் குறிக்கும் உறவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הַמִּצְפָּה
  choice: மிஸ்பா
  rationale: இடப்பெயராக இருப்பதால் எபிரெயக் குறிப்புச் சுட்டை தனியே மொழிபெயர்க்காமல், வழக்கமான ஒலிபெயர்ப்பு பயன்படுத்தப்படுகிறது.
