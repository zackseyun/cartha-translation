base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/024.yaml
  text: And Asa slept with his fathers and was buried with his fathers in the city of David his father[b][a], and Jehoshaphat his son reigned in his place.
translation:
  language: ta
  text: ஆசா தன் முன்னோர்களோடு துயிலடைந்து[a], தன் தந்தை தாவீதின் நகரத்தில்[b] அவர்களோடு அடக்கம் செய்யப்பட்டான். அவனுக்குப் பதிலாக அவன் மகன் யோசபாத் அரசாண்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் சொல்லுக்குச் சொல், ‘தன் தந்தையரோடு.’ இது மரணத்தையும் அடக்கத்தையும் குறிக்கும் வழக்கமான அரச மரபுத்தொடர்; ‘தன் முன்னோர்களோடு’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இங்கே ‘தன் தந்தை’ என்பது ஆசாவின் உடனடி தந்தையை அல்ல, அவனுடைய அரச வம்ச முன்னோரான தாவீதைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: துயிலடைந்து
  rationale: அரசர்களின் மரணத்தைக் குறிக்கும் எபிரெய மரபுத்தொடரின் உருவகத்தைப் பாதுகாக்கிறது; சூழல் இது மரணத்தைக் குறிக்கிறது என்பதைத் தெளிவாக்குகிறது.
- source_word: עִם אֲבֹתָיו
  choice: தன் முன்னோர்களோடு
  rationale: சொல்லுக்குச் சொல் ‘தன் தந்தையரோடு’ என்றாலும், நவீனத் தமிழில் வம்ச முன்னோர்களைக் குறிக்கும் பொருளை இயல்பாகவும் தெளிவாகவும் தருகிறது; நேரடி வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: וַיִּקָּבֵר
  choice: அடக்கம் செய்யப்பட்டான்
  rationale: எபிரெய நிஃபால் வினையின் செயப்பாட்டு பொருளை இயல்பான தமிழில் வழங்குகிறது.
- source_word: בְּעִיר דָּוִד אָבִיו
  choice: தன் தந்தை தாவீதின் நகரத்தில்
  rationale: எபிரெய தொடரமைப்பையும் அரச வம்சத் தொடர்பையும் பாதுகாக்கிறது; ‘தந்தை’ என்பது உடனடி தந்தை அல்ல என்பதைக் குறிப்புரை விளக்குகிறது.
- source_word: וַיִּמְלֹךְ
  choice: அரசாண்டான்
  rationale: அரச வாரிசுரிமை அறிவிப்புக்குப் பொருத்தமான, சுருக்கமான நவீனத் தமிழ் வடிவம்.
- source_word: תַּחְתָּיו
  choice: அவனுக்குப் பதிலாக
  rationale: வெறும் கால வரிசையை அல்லாமல், அரசப் பதவியில் அவனது இடத்தை மகன் ஏற்றதைத் துல்லியமாகக் காட்டுகிறது.
theological_decisions:
- issue: ‘தன் தந்தை தாவீது’ என்ற வம்ச மொழியின் பொருள்
  choice: மூலத்தின் ‘தந்தை’ என்ற உறவுச்சொல்லை முதன்மை உரையில் வைத்துக் குறிப்புரையில் அதன் வம்சப் பொருளை விளக்குதல்
  alternative: ‘தன் முன்னோரான தாவீது’ என்று முதன்மை உரையிலேயே விளக்கமாக மொழிபெயர்த்தல்
  rationale: தாவீதை ஆசாவின் உடனடி தந்தை என்று தவறாகப் புரிந்துகொள்ளாமல் உதவுவதோடு, அரச வம்சத்தை வலியுறுத்தும் எபிரெய மொழிநடையையும் மாற்றாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘துயிலடைந்து’ என்ற மரபுருவகம் காக்கப்பட்டு, ‘முன்னோர்கள்’ மூலம் அதன் உண்மையான வம்சப் பொருள் தெளிவாக்கப்பட்டுள்ளது.
