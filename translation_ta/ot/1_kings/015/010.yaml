  yaml_path: translation/ot/1_kings/015/010.yaml
  text: He reigned forty-one years in Jerusalem[b][a], and his mother’s name was Maacah daughter of Abishalom.
translation:
  language: ta
  text: அவன் எருசலேமில் நாற்பத்தொன்று ஆண்டுகள் ஆட்சி செய்தான். அவனுடைய தாயின் பெயர் மாக்கா; அவள் அபிஷாலோமின்[a] மகள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘அபிஷாலோம்’; இப்பெயர் ‘அப்சாலோம்’ என்றும் வழங்கப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் ‘மகள்’; வம்சவரிசைச் சூழல்களில் இச்சொல் பேத்தி அல்லது தொலைவான பெண் வழித்தோன்றலையும் குறிக்கக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאַרְבָּעִים וְאַחַת שָׁנָה
  choice: நாற்பத்தொன்று ஆண்டுகள்
  rationale: எபிரெய மொழியில் உள்ள ‘நாற்பதும் ஒன்றும் ஆண்டு’ என்ற எண்ணமைப்பை இயல்பான நவீனத் தமிழில் ‘நாற்பத்தொன்று ஆண்டுகள்’ என்று வழங்குகிறது.
- source_word: מָלַךְ
  choice: ஆட்சி செய்தான்
  rationale: இச்சூழலில் அரசனாக இருந்த கால அளவைக் குறிக்கிறது; ‘ஆட்சி செய்தான்’ என்பது நவீனத் தமிழில் தெளிவான இயல்பான சொற்றொடர்.
- source_word: בִּירוּשָׁלִָם
  choice: எருசலேமில்
  rationale: בְּ முன்னொட்டு இடத்தைக் குறிக்கிறது; தமிழில் ‘-இல்’ வேற்றுமை உருபு அதனை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְשֵׁם אִמּוֹ
  choice: அவனுடைய தாயின் பெயர்
  rationale: ‘அவனுடைய தாயின் பெயர்’ என்ற எபிரெய கட்டமைப்பின் பொருளைத் தெளிவாகவும் இயல்பாகவும் காக்கிறது.
- source_word: מַעֲכָה
  choice: மாக்கா
  rationale: தனிப்பெயர் மொழிபெயர்க்கப்படாமல், எபிரெய ஒலிவடிவத்தை நெருக்கமாகப் பின்பற்றி எழுத்துப்பெயர்க்கப்பட்டுள்ளது.
- source_word: בַּת
  choice: மகள்
  rationale: இதன் நேரடியான சொற்பொருள் ‘மகள்.’ வம்சவரிசைச் சூழல்களில் இது தொலைவான பெண் வழித்தோன்றலையும் குறிக்கக்கூடும் என்பதால் அந்த வாய்ப்பு அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- source_word: אֲבִישָׁלוֹם
  choice: அபிசாலோம்
  rationale: இவ்வசனத்தின் எபிரெய வடிவமான אֲבִישָׁלוֹם என்பதற்கு நெருக்கமான தமிழ் எழுத்துப்பெயர்ப்பு.
theological_decisions:
- issue: மாக்காவின் உறவுமுறை அடையாளம்
  choice: மூலத்தில் உள்ள ‘அபிசாலோமின் மகள்’ என்ற நேரடியான வம்சவரிசைச் சொல்லாட்சியை முதன்மை உரையில் வைத்தல்.
  alternative: ‘அபிசாலோமின் பேத்தி’ அல்லது ‘அபிசாலோமின் பெண் வழித்தோன்றல்.’
  rationale: எபிரெய உரை வெளிப்படையாக ‘மகள்’ என்கிறது. வரலாற்று அல்லது வம்சவரிசை ஒப்பீட்டின் அடிப்படையில் இதை மொழிபெயர்ப்பிலேயே தீர்மானிக்காமல், உள்ளார்ந்த பதற்றத்தைக் காத்து விரிவான பொருள் வாய்ப்பை அடிக்குறிப்பில் தெரிவிக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. எபிரெய வாக்கியத்தின் தகவல் வரிசை காக்கப்பட்டாலும், தமிழில் தெளிவுக்காக இரு வாக்கியங்களாகவும் ‘அவள்’ என்ற சுட்டுப்பெயருடனும் வழங்கப்பட்டுள்ளது.
