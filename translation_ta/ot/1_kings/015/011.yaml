base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/011.yaml
  text: Asa did what was right in the eyes of Yahweh[a], as David his father had done.
translation:
  language: ta
  text: ஆசா, தன் தந்தை தாவீதைப் போல, யாவேயின் பார்வையில் சரியானதைச் செய்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தன் மூதாதை தாவீதைப் போல.” இங்கு “தந்தை” என்பது உடனடித் தந்தையை அல்ல, அரச வம்சத்தின் முன்னோரைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: செய்தான்
  rationale: עשה என்ற வினைச்சொல்லின் அடிப்படைப் பொருள் ‘செய்’. அரசரை மதிப்பிடும் இச்சூத்திரத்தில் ‘சரியானதைச் செய்தான்’ என்பது இயல்பான தமிழ்.
- source_word: אָסָא
  choice: ஆசா
  rationale: எபிரெயத் தனிப்பெயர் தமிழில் வழக்கமான வடிவில் ஒலிபெயர்க்கப்பட்டது.
- source_word: הַיָּשָׁר
  choice: சரியானதை
  rationale: יָשָׁר என்பது ‘நேரானது, சரியானது, செம்மையானது’ எனப் பொருள்படும்; இங்கு ஒழுக்க மதிப்பீட்டை இயல்பாகத் தெரிவிக்க ‘சரியானதை’ என மொழிபெயர்க்கப்பட்டது.
- source_word: בְּעֵינֵי
  choice: பார்வையில்
  rationale: சொல்லுக்கு சொல் ‘கண்களில்’ என்ற எபிரெய உருவகத்தை, மதிப்பீட்டுக் கோணத்தைக் குறிக்கும் இயல்பான தமிழான ‘பார்வையில்’ என வழங்குகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: திருநான்கெழுத்துத் தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் நிலைபெற்றுள்ள தனிப்பெயர் வடிவமான ‘யெகோவா’ என ஒலிபெயர்க்கிறது.
- source_word: כְּדָוִד
  choice: தாவீதைப் போல
  rationale: כְּ என்ற ஒப்புமை முன்னொட்டை இயல்பான தமிழில் ‘போல’ எனக் காட்டுகிறது.
- source_word: אָבִיו
  choice: தன் தந்தையாகிய
  rationale: אָבִיו என்பதன் நேரடிப் பொருளான ‘அவனுடைய தந்தை’ பாதுகாக்கப்படுகிறது; இங்கு அது உடனடித் தந்தையை அல்ல, வம்ச மூதாதையைக் குறிக்கிறது என்பதை அடிக்குறிப்பு விளக்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழியாக்கம்
  choice: யெகோவா
  alternative: யாவே
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக இருப்பதால் அதைப் ‘கர்த்தர்’ போன்ற பட்டத்தால் மாற்றவில்லை. தமிழ் வாசகர்களிடையே நிலைபெற்ற ஒலிபெயர்ப்பு ‘யெகோவா’ பயன்படுத்தப்பட்டது.
- issue: ஆசாவுடன் தொடர்புடைய ‘தாவீது அவனுடைய தந்தை’ என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘தந்தை’ என்பதைத் தக்கவைத்தல்
  alternative: மூதாதை
  rationale: எபிரெய வேதாகம அரசவம்ச மொழிநடையில் אָב என்பது வம்ச முன்னோரையும் குறிக்கலாம். மூலச் சொல்லை முதன்மை உரையில் காத்து, உடனடித் தந்தை என்ற தவறான புரிதலை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
translation_notes:
  register: நவீனத் தரநிலைத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. எபிரெய மதிப்பீட்டு மொழியை இயல்பாக வழங்கியுள்ளதுடன், ‘தந்தை’ என்ற வம்சப் பயன்பாட்டை அடிக்குறிப்பில் தெளிவுபடுத்துகிறது.
