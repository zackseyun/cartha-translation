  text: Then Baasha king of Israel went up against Judah and built Ramah[b][a], so as not to allow anyone to go out or come in to Asa king of Judah.
translation:
  language: ta
  text: அப்போது இஸ்ரவேலின் அரசன் பாஷா யூதாவுக்கு எதிராகப் படையெடுத்தான்; யூதாவின் அரசன் ஆசாவிடம் யாரும் வெளியே செல்லவோ உள்ளே வரவோ முடியாதபடி ராமாவைக் கட்டினான்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ராமாவை அரணாக்கினான்” என்றும் மொழிபெயர்க்கலாம். எபிரேய வினைச்சொல் நேரடியாக “கட்டினான்” என்றே கூறுகிறது; ஆனால் சூழல் இராணுவ நோக்கமுள்ள கட்டுமானத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “வெளியே செல்லவும் உள்ளே வரவும்” என்பது இயல்பான நடமாட்டத்தையும் அணுகலையும் குறிக்கும் எபிரேய சொற்றொடர். ஆசாவிடம் செல்லும் போக்குவரத்தைத் தடுக்க பாஷா முயன்றான் என்பதே இங்குள்ள கருத்து.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַל ... עַל־יְהוּדָה
  choice: யூதாவுக்கு எதிராகப் படையெடுத்து வந்து
  rationale: עלה உடன் עַל என்பது இங்குள்ள இராணுவச் சூழலில் யூதாவுக்கு எதிரான முன்னேற்றத்தைக் குறிக்கிறது; பொதுவான வாசகருக்கு பகைமையான நடவடிக்கையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בַּעְשָׁא מֶלֶךְ יִשְׂרָאֵל
  choice: இஸ்ரவேலின் அரசன் பாஷா
  rationale: அரசப் பதவியையும் நாட்டையும் நேரடியாகக் காட்டி, பெயரைத் தமிழில் வழக்கமான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: וַיִּבֶן אֶת־הָרָמָה
  choice: ராமாவைக் கட்டினான்
  rationale: בנה என்பதன் அடிப்படைப் பொருள் ‘கட்டு’ என்பதால் அதை முதன்மை உரையில் காக்கிறது; இராணுவச் சூழல் சுட்டும் ‘அரணாக்கினான்’ என்ற பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לְבִלְתִּי תֵּת
  choice: முடியாதபடி
  rationale: ஒருவரையும் அனுமதிக்காத தடுப்பு நோக்கத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יֹצֵא וָבָא
  choice: வெளியே செல்லவோ உள்ளே வரவோ
  rationale: இயக்கம் அல்லது அணுகலைக் குறிக்கும் எபிரேய இணைச்சொல்லின் இரு கூறுகளையும் வெளிப்படையாகக் காக்கிறது.
- source_word: לְאָסָא מֶלֶךְ יְהוּדָה
  choice: யூதாவின் அரசன் ஆசாவிடம்
  rationale: לְ குறிக்கும் ஆசாவுடனான திசை/தொடர்பை உரையின் அளவுக்குள் காக்கிறது; தடையின் பரந்த போக்குவரத்து விளைவு அடிக்குறிப்பில் விளக்கப்படுகிறது.
