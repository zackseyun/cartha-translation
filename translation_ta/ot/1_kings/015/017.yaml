translation_notes:
  register: நவீனத் தரத் தமிழில், dignified ஆனால் எளிதில் புரியும் நடையில் மொழிபெயர்க்கப்பட்டது. எபிரேய மூலத்தின் ‘கட்டினான்’ என்ற சொல் முதன்மை உரையில் பாதுகாக்கப்பட்டு, சூழலால் சாத்தியமான ‘அரணாக்கினான்’ அடிக்குறிப்பில் வைக்கப்பட்டது. அடிக்குறிப்பு குறிகள் உரையில் அவை விளக்கும் சொற்றொடர்களுக்குப் பின் [a][b] என இடப்பட்டுள்ளன.
