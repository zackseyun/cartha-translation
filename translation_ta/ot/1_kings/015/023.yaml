base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/023.yaml
  text: The rest of all the acts of Asa[a], and all his might, and all that he did[b], and the cities that he built—are they not written in the Book of the Chronicles of the Kings of Judah? Yet in the time of his old age he became diseased in his feet.
translation:
  language: ta
  text: ஆசாவின் மற்ற செயல்கள் அனைத்தும், அவனுடைய வல்லமை அனைத்தும், அவன் செய்தவை அனைத்தும், அவன் கட்டிய நகரங்களும் யூதாவின் அரசர்களுடைய நாள்குறிப்பு நூலில்[a] எழுதப்பட்டிருக்கின்றன அல்லவா? ஆனால் அவன் முதிர்வயதில் அவனுடைய கால்களில் நோய் ஏற்பட்டது.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யூதாவின் அரசர்களுடைய ஆண்டுக் குறிப்புகள் அடங்கிய நூலில்.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெய உரை பாதிக்கப்பட்ட உடற்பகுதியாகக் கால்களைக் குறிப்பிடுகிறது; ஆனால் நோய் எது என்று கூறவில்லை. “அவனுடைய கால்களில் அவன் நோயுற்றான்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר כָּל דִּבְרֵי אָסָא
  choice: ஆசாவின் மற்ற செயல்கள் அனைத்தும்
  rationale: அரசாட்சி நிறைவுச் சூத்திரத்தில் דִּבְרֵי என்பது பேச்சுச் சொற்களை அல்ல, அரசனைப் பற்றிய செயல்களையும் நிகழ்வுகளையும் குறிக்கிறது; וְיֶתֶר என்பது மீதமுள்ளவற்றைச் சுட்டுகிறது.
- source_word: וְכָל גְּבוּרָתוֹ
  choice: அவனுடைய வல்லமை அனைத்தும்
  rationale: גְּבוּרָה என்பதன் வலிமை அல்லது ஆற்றல் என்ற பொதுவான பொருளைத் தக்கவைத்து, அடுத்து வரும் ‘அவன் செய்தவை’ என்பதிலிருந்து இதை வேறுபடுத்துகிறது.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: அவன் செய்தவை அனைத்தும்
  rationale: எபிரெய உறவுநிலைத் தொடரின் பரந்த பொருளை இயல்பான தமிழில் நேரடியாக வழங்குகிறது.
- source_word: וְהֶעָרִים אֲשֶׁר בָּנָה
  choice: அவன் கட்டிய நகரங்களும்
  rationale: בָּנָה என்பதற்கு ‘கட்டினான்’ என்பதே நேரடிப் பொருள்; சூழலில் அரண் அமைத்தல் உட்படலாம் என்றாலும், அதை உரைக்குள் சேர்க்கவில்லை.
- source_word: הֲלֹא הֵמָּה כְתוּבִים
  choice: எழுதப்பட்டிருக்கின்றன அல்லவா?
  rationale: மூலத்தின் எதிர்பார்க்கப்படும் உடன்பாட்டைக் கொண்ட வினாவடிவத்தையும் செயப்பாட்டு நிலையையும் தக்கவைக்கிறது.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: யூதாவின் அரசர்களுடைய நாள்குறிப்பு நூலில்
  rationale: அரசர்களின் அதிகாரப்பூர்வ நிகழ்வுப் பதிவைக் குறிக்கும் தலைப்பை இயல்பாக வழங்குகிறது; עַל என்பதற்கு இச்சூழலில் தமிழின் இடவேற்றுமை ‘நூலில்’ பொருத்தமானது.
- source_word: רַק
  choice: ஆனால்
  rationale: முந்தைய வழக்கமான அரசாட்சி நிறைவுச் செய்தியுடன் அடுத்த குறிப்பை வேறுபடுத்தும் வரையறை/மாறுபாட்டுத் தொடர்பை இயல்பான தமிழில் காட்டுகிறது.
- source_word: לְעֵת זִקְנָתוֹ
  choice: அவன் முதிர்வயதில்
  rationale: ‘அவனுடைய முதுமையின் காலத்தில்’ என்ற மூலப் பொருளைச் சுருக்கமான, மரியாதையான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: חָלָה אֶת רַגְלָיו
  choice: அவனுடைய கால்களில் நோய் ஏற்பட்டது
  rationale: חָלָה நோயுற்ற நிலையைக் குறிக்கிறது; אֶת רַגְלָיו பாதிக்கப்பட்ட உடற்பகுதியைக் குறிப்பிடுகிறது. நோயின் தன்மையை மூலமே சொல்லாததால் அதைக் குறிப்பாக்கவில்லை.
