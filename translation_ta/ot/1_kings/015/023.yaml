  register: நவீன தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளக்கூடிய கண்ணியமான வரலாற்று நடையைப் பயன்படுத்துகிறது. அரசாட்சி நிறைவுச் சூத்திரத்தின் வினாவடிவம் பாதுகாக்கப்பட்டுள்ளது; மூலத்தில் குறிப்பிடப்படாத நோயறிதல் எதுவும் சேர்க்கப்படவில்லை.
