base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/030.yaml
  text: because of the sins of Jeroboam that he committed and by which he caused Israel to sin[a], and because of his provocation by which he provoked Yahweh, the God of Israel.
translation:
  language: ta
  text: யெரொபெயாம் தானும் செய்து, இஸ்ரவேலையும் பாவம் செய்ய வைத்த பாவங்களின் காரணமாகவும், அவன் இஸ்ரவேலின் கடவுளாகிய யாவேவை கோபமூட்டிய அவனுடைய கோபமூட்டலின் காரணமாகவும்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனுடைய கோபத்தின் காரணமாகவும்.” எபிரெயச் சொல் ‘கோபம்’ அல்லது ‘கோபமூட்டல்’ என்று பொருள்படலாம்; இங்கு அடுத்து வரும் “கோபமூட்டிய” என்ற வினையுடன் இரண்டாவது பொருள் நன்றாகப் பொருந்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל
  choice: காரணமாகவும்
  rationale: முந்தைய நிகழ்வுக்கான காரணத்தை இந்த இடைச்சொல் அறிமுகப்படுத்துகிறது; தொடர்வாக்கியத்தின் அமைப்பையும் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: חַטֹּאות ... חָטָא
  choice: தான் செய்த பாவங்கள்
  rationale: பெயர்ச்சொல்லின் பன்மையைப் பேணுவதோடு, ஒரே வேர்ச்சொல்லைத் தேவையின்றி மீண்டும் கூறாமல் இயல்பான தமிழில் பொருளைத் தருகிறது.
- source_word: הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: இஸ்ரவேலைப் பாவம் செய்ய வைத்தது
  rationale: எபிரெய வினையின் காரணவினைப் பொருளை நேரடியாகப் பேணுகிறது; எவ்வாறு அவ்வாறு செய்தான் என்பதை மேலதிகமாக விளக்கவில்லை.
- source_word: בְּכַעְסוֹ
  choice: அவனுடைய கோபமூட்டும் செயல்
  rationale: כעס என்பது கோபத்தையோ கோபமூட்டுதலையோ குறிக்கலாம். அடுத்துவரும் הִכְעִיס என்ற வினையோடு இங்கு ‘கோபமூட்டும் செயல்’ பொருத்தமாக உள்ளது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: הִכְעִיס
  choice: கோபமூட்டிய
  rationale: யாவே கோபங்கொள்ளும்படி செய்தான் என்ற காரணவினைப் பொருளைத் தெளிவாகவும் சுருக்கமாகவும் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பட்டத்தால் மாற்றாமல், எபிரெய வேதாகமத்திலுள்ள தனிப்பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கடவுள்
  rationale: எபிரெய இணைப்புத் தொடரைத் தெளிவான, நவீன தமிழில் நேரடியாகக் காட்டுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக இருப்பதால், அதை ஒரு பட்டத்தால் மாற்றாமல் ஒலிபெயர்த்துள்ளது.
- issue: כעס என்பதிலுள்ள கோபம்/கோபமூட்டுதல் என்ற பொருள் வேறுபாடு
  choice: கோபமூட்டும் செயல்
  alternative: அவனுடைய கோபம்
  rationale: உடனே வரும் הִכְעִיס (‘கோபமூட்டினான்’) என்ற வினை, இங்கு யெரொபெயாமின் உள்ளார்ந்த கோபத்தைவிட அவன் கடவுளைக் கோபமூட்டிய செயலைக் குறிப்பதாகச் சூழல் காட்டுகிறது; இருப்பினும் உண்மையான சொற்பொருள் வேறுபாடு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் வேதாகம வரலாற்று நடையும் காக்கப்பட்டுள்ளன. இது முந்தைய வசனத்தின் வாக்கியத்தைத் தொடரும் காரணத் தொடராக இருப்பதால் இறுதியில் முழுமையான தனிவாக்கியமாக மாற்றப்படவில்லை.
