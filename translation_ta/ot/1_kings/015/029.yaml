base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/029.yaml
  text: And when he became king[a], he struck down all the house of Jeroboam. He did not leave to Jeroboam a single living thing, until he had destroyed him[b], according to the word of Yahweh that he had spoken by the hand of his servant Ahijah the Shilonite.
translation:
  language: ta
  text: அவன் அரசனானதும், யெரொபெயாமின் வீட்டார் அனைவரையும் அடித்துக் கொன்றான். யெரொபெயாமுக்கு உயிரோடு எவரையும் அவன் விட்டுவைக்கவில்லை; அவனை முற்றிலும் அழித்தான். யாவே தம் ஊழியரான சீலோவைச் சேர்ந்த அகியா மூலம் உரைத்த வார்த்தையின்படியே அவன் இதைச் செய்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כְמָלְכוֹ
  choice: அவன் அரசனானதும்
  rationale: וַיְהִי என்பதுடன் வரும் כְמָלְכוֹ இங்கு அரியணையேற்றத்தைத் தொடர்ந்து நிகழ்ந்த செயலைக் குறிக்கிறது. ‘அரசனானதும்’ என்பது காலத் தொடர்பையும் உடனடியான தொடர்ச்சியையும் இயல்பான தமிழில் தருகிறது.
- source_word: הִכָּה
  choice: வெட்டி வீழ்த்தினான்
  rationale: נכה இச்சூழலில் வெறுமனே ‘அடித்தான்’ என்பதல்ல, கொன்று ஒழித்ததைக் குறிக்கிறது. ‘வெட்டி வீழ்த்தினான்’ அதன் வன்மையான பொருளை மிகையாக விளக்காமல் வெளிப்படுத்துகிறது.
- source_word: אֶת כָּל בֵּית יָרָבְעָם
  choice: யெரொபெயாமின் வீட்டார் அனைவரையும்
  rationale: בֵּית என்பது அரச வம்சம், குடும்பம், வீட்டார் ஆகிய தொடர்புடைய கருத்துகளை உள்ளடக்குகிறது. ‘வீட்டார்’ என்பது அந்தக் கூட்டு மனிதக் குழுவைக் குறிக்கும் இயல்பான தமிழாகவும், ‘வம்சம்’ என்று பொருளை மிகக் குறுகலாகத் தீர்மானிக்காததாகவும் உள்ளது.
- source_word: לֹא הִשְׁאִיר כָּל נְשָׁמָה
  choice: உயிருள்ள ஒருவரைக்கூட மீதியாக வைக்காமல்
  rationale: נְשָׁמָה என்பதன் அடிப்படைப் படிமம் ‘மூச்சு’; இங்கு உயிரோடு இருக்கும் எந்த மனிதரும் தப்பவில்லை என்ற மரபுத்தொடர் பொருளில் வருகிறது. தெளிவான நவீன தமிழை முதன்மை உரையில் கொடுத்து, மூலப் படிமத்தை அடிக்குறிப்பில் பாதுகாக்கிறது.
- source_word: לְיָרָבְעָם
  choice: யெரொபெயாமுக்கு
  rationale: 'לְ என்னும் முன்னொட்டின் உறவு அல்லது உடைமை நுணுக்கத்தை நேரடியாக வைத்துள்ளது: யெரொபெயாமுக்குரியவர்களில் உயிருடன் எவரும் விடப்படவில்லை.'
- source_word: עַד הִשְׁמִידוֹ
  choice: அவனை அழித்துத் தீரும்வரை
  rationale: ஆண்பால் ஒருமை பின்னொட்டை ‘அவனை’ என்று காத்துள்ளது. இது யெரொபெயாமை அவரது வீட்டாரோடு கூட்டு அடையாளமாகச் சுட்டக்கூடும்; அந்தத் தெளிவின்மை அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: כִּדְבַר יְהוָה
  choice: யாவே ... உரைத்த வார்த்தையின்படியே
  rationale: இது தீர்க்கதரிசன நிறைவேற்றத்தைக் குறிக்கும் நிலையான அமைப்பு. ‘வார்த்தையின்படியே’ என்பது மூலத்தின் ஒப்புமை/இணக்கப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר דִּבֶּר בְּיַד עַבְדּוֹ
  choice: தம் ஊழியரான ... மூலம் உரைத்த
  rationale: בְיַד என்பதன் சொற்பொருள் ‘கையால்’ என்றாலும், இங்கு தீர்க்கதரிசியின் வழியாகச் செய்தி வழங்கப்பட்டதைக் குறிக்கிறது. ‘மூலம்’ நவீன தமிழில் அந்தக் கருவி அல்லது இடைநிலைப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: אֲחִיָּה הַשִּׁילֹנִי
  choice: சீலோவைச் சேர்ந்த அகியா
  rationale: הַשִּׁילֹנִי என்பது சீலோ ஊரைச் சேர்ந்தவர் என்பதைக் குறிக்கிறது. தமிழில் செயற்கையான இனப்பெயர் வடிவத்தைவிட இந்த உரையாக்கம் தெளிவானது.
theological_decisions:
- issue: יהוה என்ற இறைநாமத்தின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / ஆண்டவர்
  rationale: மூலத்தில் பொதுப் பட்டப்பெயர் அல்ல, நான்கு எழுத்துகளைக் கொண்ட தனிப்பட்ட இறைநாமம் நேரடியாக உள்ளது. எனவே அதை பட்டப்பெயராக மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்த்துள்ளது.
- issue: עַד הִשְׁמִידוֹ என்பதிலுள்ள ஒருமைச் சுட்டுப்பெயரின் குறிப்பு
  choice: அவனை
  alternative: அதை—யெரொபெயாமின் வீட்டை ஒரு கூட்டாகக் குறித்தல்
  rationale: எபிரெய வடிவம் ஆண்பால் ஒருமை என்பதால் ‘அவனை’ முதன்மை உரையில் காக்கப்படுகிறது. ஆனால் அது யெரொபெயாமின் வீட்டை அதன் தலைவனின் பெயரால் கூட்டாகக் குறிக்க வாய்ப்புள்ளதால் மாற்று புரிதல் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘வீட்டார்’ என்ற சொல் குடும்பம் மற்றும் அரச வம்சம் ஆகிய இரு நுணுக்கங்களையும் தாங்குகிறது. எபிரெயத்தின் ஒருமைச் சுட்டுப்பெயர் ஏற்படுத்தும் உண்மையான தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
