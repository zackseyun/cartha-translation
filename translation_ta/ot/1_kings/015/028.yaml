base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/028.yaml
  text: Baasha put him to death in the third year of Asa king of Judah[a], and reigned in his place.
translation:
  language: ta
  text: யூதாவின் அரசன் ஆசாவின் ஆட்சியின் மூன்றாம் ஆண்டில் பாசா அவனைக் கொன்றான்[a]; அவனுக்குப் பதிலாக அரசாண்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனைச் சாகச் செய்தான்.” எபிரெய வினைச்சொல் காரணவினை வடிவில் உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמִתֵהוּ
  choice: அவனைக் கொன்றுபோட்டு
  rationale: מות என்பதன் ஹிஃபில் வடிவம் ‘சாகச் செய்தான்’ என்ற காரணவினைப் பொருளைக் கொண்டது. ‘கொன்றுபோட்டு’ என்பது அந்தச் செயற்படுத்தும் வலிமையையும் கதையின் தீவிரத்தையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: בַעְשָׁא
  choice: பாசா
  rationale: தனிப்பட்ட பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: בִּשְׁנַת שָׁלֹשׁ
  choice: ஆட்சியின் மூன்றாம் ஆண்டில்
  rationale: ב முன்னொட்டு காலத்தைக் குறிக்கிறது; அரசாண்டு கணக்கிடும் சூழலைத் தமிழில் தெளிவாக்க ‘ஆட்சியின் மூன்றாம் ஆண்டில்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: לְאָסָא מֶלֶךְ יְהוּדָה
  choice: யூதாவின் அரசன் ஆசாவின்
  rationale: ל என்பது இங்கு அரசாண்டைக் கணக்கிடுவதற்கான குறிப்பு நபரைக் காட்டுகிறது. தமிழ் சொல் வரிசைக்கேற்ப பட்டமும் நாட்டுப்பெயரும் இயல்பாக அமைக்கப்பட்டுள்ளன.
- source_word: וַיִּמְלֹךְ
  choice: அரசாண்டான்
  rationale: מלך என்பதன் கால் வடிவம் இங்கு அரசனாக ஆட்சி செய்ததைக் குறிக்கிறது; ‘அரசாண்டான்’ சுருக்கமான, இயல்பான தமிழ் வடிவம்.
- source_word: תַּחְתָּיו
  choice: அவனுக்குப் பதிலாக
  rationale: תחת suffix உடன் வரும்போது ஒருவரின் இடத்தை மற்றொருவர் ஏற்றுக்கொள்ளும் வாரிசுரிமை அல்லது மாற்றீட்டைக் குறிக்கிறது; ‘அவனுக்குப் பதிலாக’ தமிழில் அந்தப் பொருளைத் தெளிவாக வழங்குகிறது.
