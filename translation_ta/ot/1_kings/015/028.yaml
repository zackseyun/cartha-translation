  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் அரச வரலாற்றுக் குறிப்புக்கேற்ற கண்ணியமான நடையிலும் அமைக்கப்பட்டுள்ளது. ‘கொன்றுபோட்டு’ என்பது காரணவினையின் வலிமையை இயல்பாகக் காட்டுகிறது; அடிக்குறிப்பு அதன் சொற்படியான மாற்றைத் தருகிறது.
