id: 1KI.15.26
reference: 1 Kings 15:26
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יֵּ֨לֶךְ֙ בְּ/דֶ֣רֶךְ אָבִ֔י/ו וּ֨/בְ/חַטָּאת֔/וֹ אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/026.yaml
  text: He did what was evil in the sight of Yahweh and walked in the way of his father and in his sin with which he caused Israel to sin.
translation:
  language: ta
  text: அவன் யாவேவின் பார்வையில் தீமையானதைச் செய்தான். தன் தந்தையின் வழியிலும், அவர் இஸ்ரவேலைப் பாவம் செய்யவைத்த பாவத்திலும் நடந்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: தீமையானதைச் செய்தான்
  rationale: அரசர்களை மதிப்பிடும் வழக்கமான எபிரெயச் சொற்றொடரின் பொருளையும் எளிய வினை அமைப்பையும் இயல்பான தமிழில் காக்கிறது.
- source_word: בְּעֵינֵי יְהוָה
  choice: யாவேவின் பார்வையில்
  rationale: ‘யாவேவின் கண்களில்’ என்ற எபிரெய உருவகத்தின் மதிப்பீட்டுப் பொருளை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; יהוה என்பது பட்டமாக அல்ல, ‘யாவே’ என்ற பெயராக ஒலிபெயர்க்கப்படுகிறது.
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ אָבִיו
  choice: தன் தந்தையின் வழியில் நடந்தான்
  rationale: வாழ்க்கை நடத்தை குறிக்கும் ‘வழியில் நடத்தல்’ என்ற மூல உருவகத்தைத் தமிழிலும் காக்கிறது.
- source_word: וּבְחַטָּאתוֹ
  choice: அவர் ... பாவத்திலும்
  rationale: ஒருமையில் உள்ள ‘பாவம்’ என்பதையும், உடனடியாக முன்வரும் தந்தையோடு இயல்பாக இணையும் மூன்றாம் நபர் சுட்டையும் காக்கிறது.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: அவர் இஸ்ரவேலைப் பாவம் செய்யவைத்த
  rationale: חטא என்பதன் ஹிஃபில் வடிவிலுள்ள காரணவினைப் பொருளை நேரடியாகவும் தெளிவாகவும் தருகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் வரும் உடன்படிக்கைப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு வடிவில் வழங்குகிறது.
- issue: ‘அவனுடைய பாவம்’ என்பதன் சுட்டுப்பொருள்
  choice: தந்தையைச் சுட்டும் ‘அவர்’
  alternative: முதன்மை எழுவாயைச் சுட்டும் ‘அவன்’
  rationale: אָבִיו என்பதற்குப் பின் தொடரும் חַטָּאתוֹ மற்றும் அடுத்த உறவுச்சொற்றொடர், தந்தையின் வழியையும் இஸ்ரவேலைப் பாவம் செய்யவைத்த அவரது பாவத்தையும் இணைக்கின்றன; தமிழில் தேவையற்ற குழப்பத்தைத் தவிர்க்க ‘அவர்’ பயன்படுத்தப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையில் dignified நடையில் அமைக்கப்பட்டுள்ளது. எபிரெய ‘வழியில் நடந்தான்’ என்ற நெறிவாழ்வு உருவகம் பாதுகாக்கப்பட்டுள்ளது.
