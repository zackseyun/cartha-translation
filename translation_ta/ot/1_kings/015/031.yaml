source:
  edition: WLC
  text: וְ/יֶ֛תֶר דִּבְרֵ֥י נָדָ֖ב וְ/כָל אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/031.yaml
  text: The rest of the acts of Nadab[a], and all that he did, are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: ta
  text: நாதாபின் மற்ற செயல்களும், அவன் செய்த அனைத்தும், இஸ்ரவேல் அரசர்களின் நாள்குறிப்பு நூலில்[a] எழுதப்பட்டுள்ளன அல்லவா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்ரவேல் அரசர்களின் ஆண்டுக் குறிப்பேட்டில்.” இந்த எபிரெயச் சொற்றொடர் அரச ஆவணப் பதிவைக் குறிக்கிறது; அது வேதாகமத்தின் நாளாகம நூல்களைக் கட்டாயமாகக் குறிக்காது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי נָדָב
  choice: நாதாபின் மற்ற செயல்களும்
  rationale: יֶתֶר என்பது ‘மீதியானவை/மற்றவை’ என்றும், דִּבְרֵי என்பது இந்த அரசர் வரலாற்றுச் சூத்திரத்தில் அவருடைய செயல்களைப் பற்றிய பதிவுகள் என்றும் பொருள்படுகிறது. இயல்பான தமிழில் சூத்திரத்தின் கருத்தைத் தெளிவாக வழங்குகிறது.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: அவன் செய்த அனைத்தும்
  rationale: எபிரெய உறவுப்பெயர் வாக்கியத்தின் முழுமையையும், முந்தைய சொற்றொடருடன் உள்ள திட்டமிட்ட மீளுரையையும் காக்கிறது.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: எழுதப்பட்டுள்ளன அல்லவா?
  rationale: நேர்மறையான பதிலை எதிர்பார்க்கும் எபிரெய வினாவைத் தமிழின் இயல்பான ‘அல்லவா?’ அமைப்பில் காக்கிறது; ‘எழுதப்பட்டுள்ளன’ என்பது כְּתוּבִים என்பதன் நேரடியான பொருளை வழங்குகிறது.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים
  choice: நாள்குறிப்பு நூலில்
  rationale: இங்கு דִּבְרֵי הַיָּמִים என்பது அரச ஆட்சிக்கால நிகழ்வுகளின் பதிவைக் குறிக்கிறது. ‘நாள்குறிப்பு நூல்’ என்பது வேதாகமத்தின் நாளாகமப் புத்தகங்களுடன் தேவையற்ற குழப்பத்தைத் தவிர்த்து, ஆவணப் பதிவின் தன்மையை வெளிப்படுத்துகிறது.
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் அரசர்களின்
  rationale: לְ இங்கு அந்தப் பதிவு யாரைச் சார்ந்தது என்பதைக் குறிக்கிறது; தமிழில் உடைமைத் தொடர்பு இயல்பாக உள்ளது.
theological_decisions:
- issue: குறிப்பிடப்படும் நூலின் அடையாளம்
  choice: இதை இஸ்ரவேல் அரசர்களைப் பற்றிய தனி அரச ஆவணமாக மொழிபெயர்த்தல்
  alternative: வேதாகமத்தின் ‘நாளாகமம்’ என்ற நூலாகப் புரிந்துகொள்ளக்கூடிய தலைப்பைப் பயன்படுத்துதல்
  rationale: எபிரெய அரசர் வரலாற்றுச் சூத்திரம் ஒரு மூல ஆவணத்தைச் சுட்டுகிறது; அது வேதாகமத்தின் நாளாகம நூலே என்று உரை கூறவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், அரச வரலாற்றுப் பதிவின் மரியாதையான நடையைத் தக்கவைத்து மொழிபெயர்க்கப்பட்டது. மூலத்தின் சூத்திரவடிவ மீளுரையும் வினாவடிவமும் பாதுகாக்கப்பட்டுள்ளன.
