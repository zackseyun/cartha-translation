base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/020.yaml
  text: Ben-hadad listened to King Asa and sent the commanders of the armies that were his against the cities of Israel[a], and he struck Ijon, Dan, Abel-beth-maacah, and all Chinneroth[b], against all the land of Naphtali.
translation:
  language: ta
  text: பென்-அதாத் ஆசா அரசனுக்குச் செவிகொடுத்து[a], தன் படைகளின் தளபதிகளை இஸ்ரயேலின் நகரங்களுக்கு எதிராக அனுப்பினான். அவன் ஈயோன், தாண், ஆபேல்-பெத்-மாக்கா, கின்னரோத் முழுவதையும்[b], நப்தலி நாடு முழுவதையும் தாக்கினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஆசா அரசனின் வேண்டுகோளுக்கு இணங்கினான்.’ எபிரெயச் சொற்றொடர், ஒருவருக்குச் சாதகமாகச் செவிகொடுத்து அவரது வேண்டுகோளின்படி செயல்படும் பொருளையும் தரலாம்.
    reason: lexical_alternative
  - marker: b
    text: இங்கு ‘கின்னரோத்’ என்பது ஓர் இடப்பெயர்; அது ஒரு மாவட்டத்தையோ நிலப்பகுதியையோ குறிக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁמַע אֶל
  choice: சொன்னதைக் கேட்டு
  rationale: இந்த எபிரெயச் சொற்றொடர் ஒருவருக்குச் செவிகொடுத்து, அவரது வேண்டுகோளுக்கு ஏற்றபடி செயல்படுவதைக் குறிக்கலாம். அடுத்த செயல் அதனைத் தெளிவாக்குவதால், ஆசா பென்-அதாத்மீது அதிகாரம் செலுத்தினான் என்ற மிகைப்படுத்தலைத் தவிர்த்து இயல்பான தமிழில் வழங்கப்பட்டுள்ளது.
- source_word: שָׂרֵי הַחֲיָלִים אֲשֶׁר לוֹ
  choice: தன் படைகளின் தளபதிகளை
  rationale: שָׂרֵי என்பது தலைவர்கள் அல்லது தளபதிகள் என்றும், இராணுவச் சூழலில் חֲיָלִים என்பது படைகள் என்றும் பொருள்படும். אֲשֶׁר לוֹ காட்டும் உடைமை அல்லது கட்டுப்பாட்டு உறவைத் தமிழ் தற்சுட்டுப் பெயரடையான ‘தன்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עַל עָרֵי יִשְׂרָאֵל
  choice: இஸ்ரயேலின் நகரங்களுக்கு எதிராக
  rationale: அனுப்புதல் மற்றும் அடுத்துவரும் தாக்குதல் ஆகிய இராணுவச் சூழலில் עַל இலக்காக்கப்பட்ட பகைநோக்கைச் சுட்டுகிறது.
- source_word: וַיַּךְ
  choice: தாக்கினான்
  rationale: נכה என்பது அடித்தல், தாக்குதல் அல்லது முறியடித்தல் ஆகிய பரந்த பொருள்களைக் கொண்டது. வெற்றியின் அளவை உரை குறிப்பிடாததால் ‘தாக்கினான்’ என்பது மிகைப்படுத்தாமல் இராணுவச் செயலைத் தெளிவாக்குகிறது.
- source_word: עִיּוֹן
  choice: ஈயோன்
  rationale: எபிரெய இடப்பெயரின் தமிழாக்க ஒலிபெயர்ப்பு.
- source_word: דָּן
  choice: தாண்
  rationale: எபிரெய இடப்பெயரின் தமிழாக்க ஒலிபெயர்ப்பு.
- source_word: אָבֵל בֵּית מַעֲכָה
  choice: ஆபேல்-பெத்-மாக்கா
  rationale: கூட்டு இடப்பெயரை அதன் கூறுகள் தெளிவாகத் தெரியுமாறு ஒலிபெயர்த்து இணைப்புக்குறிகளுடன் வழங்குகிறது.
- source_word: כָּל כִּנְרוֹת
  choice: கின்னரோத் முழுவதையும்
  rationale: இங்கு כִּנְרוֹת பொதுப்பெயரான இசைக்கருவிகளைக் குறிக்காமல் ஓர் இடப்பெயராக வருகிறது. כָּל காட்டும் முழுமை ‘முழுவதையும்’ எனப் பாதுகாக்கப்பட்டுள்ளது.
- source_word: עַל כָּל אֶרֶץ נַפְתָּלִי
  choice: நப்தலி நாடு முழுவதையும்
  rationale: இறுதி சொற்றொடர் தாக்குதலின் பரப்பை நப்தலியின் முழு நிலப்பகுதிக்கும் விரிவாக்குகிறது. தமிழில் வினையின் தாக்கத்தைப் பட்டியலின் ஒவ்வொரு உறுப்புக்கும் இயல்பாகப் பொருந்தச் செய்வதற்காக வேற்றுமை உருபு வெளிப்படையாக வழங்கப்பட்டுள்ளது.
