translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் நீண்ட தொடர், தமிழின் இயல்புக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டது. இடப்பெயர்கள் நேரடியாக ஒலிபெயர்க்கப்பட்டுள்ளன; தெளிவில்லாத இடங்களில் அடிக்குறிப்புகள் மூலம் மாற்றுப் பொருள் பாதுகாக்கப்பட்டுள்ளது.
