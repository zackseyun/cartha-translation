source:
  edition: WLC
  text: וַ/יֵּ֕לֶךְ בְּ/כָל חַטֹּ֥אות אָבִ֖י/ו אֲשֶׁר עָשָׂ֣ה לְ/פָנָ֑י/ו וְ/לֹא הָיָ֨ה לְבָב֤/וֹ שָׁלֵם֙ עִם יְהוָ֣ה אֱלֹהָ֔י/ו כִּ/לְבַ֖ב דָּוִ֥ד אָבִֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/003.yaml
  text: He walked in all the sins of his father that he had committed before him[a], and his heart was not wholly devoted to Yahweh his God[c][b], like the heart of David his father.
translation:
  language: ta
  text: அவன் தன் தந்தை அவனுக்கு முன்பாகச் செய்த எல்லாப் பாவங்களிலும் நடந்தான்; அவனுடைய இருதயம், அவன் தந்தையாகிய தாவீதின் இருதயத்தைப் போல, அவன் கடவுளாகிய யாவேக்கு முழுமையாக அர்ப்பணிக்கப்பட்டிருக்கவில்லை.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவனுக்கு முன்பாக” என்பது “அவன் முன்னிலையில்” அல்லது “அவனுக்கு முன்னதாக” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: “முழுமையாக அர்ப்பணிக்கப்பட்டிருக்கவில்லை” என்பதற்கு, “முழு இருதயத்தோடு பற்றுறுதியுள்ளதாய் இருக்கவில்லை” என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּכָל חַטֹּאות
  choice: எல்லாப் பாவங்களிலும் நடந்து
  rationale: הלך + בְּ என்ற எபிரேயச் சொற்றொடர் ஒழுக்க நடத்தையையோ வாழ்க்கைப் போக்கையையோ குறிக்கிறது. ‘நடந்து’ என்பது மூல உருவகத்தையும் அதன் அறநெறிப் பொருளையும் காக்கிறது.
- source_word: אֲשֶׁר עָשָׂה לְפָנָיו
  choice: தனக்கு முன்பாகச் செய்த
  rationale: לְפָנָיו என்பது ‘அவன் முன்னிலையில்’ அல்லது ‘அவனுக்கு முன்னதாக’ என்று பொருள்படக்கூடியது. ‘தனக்கு முன்பாக’ என்பது தமிழிலும் இவ்விரு சாத்தியங்களையும் ஓரளவு திறந்தவையாக வைத்திருக்கிறது.
- source_word: לְבָבוֹ
  choice: அவனுடைய இருதயம்
  rationale: לֵבָב என்பது மனவுறுதி, உள்ளார்ந்த விருப்பம், விசுவாசம் ஆகியவற்றை உள்ளடக்கும். வேதாகம நடையில் இயல்பான ‘இருதயம்’ இந்த விரிவைத் தக்கவைக்கிறது.
- source_word: שָׁלֵם עִם יְהוָה אֱלֹהָיו
  choice: அவன் கடவுளாகிய யாவேக்கு முழுமையாக உண்மையுள்ளதாய்
  rationale: שָׁלֵם இங்கு பாவமற்ற பரிபூரணத்தைக் காட்டிலும் பிரிவுபடாத முழு விசுவாசத்தைக் குறிக்கிறது. ‘முழுமையாக உண்மையுள்ளதாய்’ என்பது உடன்படிக்கைச் சார்ந்த விசுவாசத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எழுத்துத் தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தனிப்பெயராக ஒலிபெயர்க்கிறது.
- source_word: כִּלְבַב דָּוִד אָבִיו
  choice: தன் தந்தையாகிய தாவீதின் இருதயத்தைப் போல
  rationale: ஒப்பீடு தாவீது என்ற நபருடன் மட்டும் அல்லாமல் குறிப்பாக அவரது ‘இருதயத்துடன்’ செய்யப்படுவதால், மூலத்தின் கவனமையம் காக்கப்படுகிறது.
theological_decisions:
- issue: שָׁלֵם என்ற சொல்லின் இறையியல் நுணுக்கம்
  choice: முழுமையாக உண்மையுள்ளதாய்
  alternative: முழுமையானதாய் / குறையற்றதாய்
  rationale: இவ்வசனம் முழுமையான பாவமின்மையை அல்ல, யாவேக்கு உள்ள பிரிவுபடாத விசுவாசத்தை மதிப்பிடுகிறது. அதேவேளை ‘முழுமையாக’ என்ற சொல் மூலத்தின் தீவிரத்தைத் தக்கவைக்கிறது.
- issue: יְהוָה என்ற தெய்வீகப் பெயர்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் வரும் உடன்படிக்கைத் தனிப்பெயரைத் தெளிவாகக் காட்ட, பட்டமான ‘கர்த்தர்’ என்பதற்குப் பதிலாக ‘யாவே’ பயன்படுத்தப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான வேதாகம நடை பயன்படுத்தப்பட்டுள்ளது. ‘பாவங்களில் நடந்து’ மற்றும் ‘இருதயம்’ ஆகிய மூல உருவகங்கள் புரிந்துகொள்ளத்தக்கவையாக இருப்பதால் காக்கப்பட்டுள்ளன; ‘யாவே’ தனிப்பெயராக வழங்கப்பட்டுள்ளது.
