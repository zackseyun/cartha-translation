base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/018.yaml
  text: They buried him[a], and all Israel mourned for him, according to the word of Yahweh that he had spoken through his servant Ahijah the prophet.
translation:
  language: ta
  text: அவர்கள் அவனை அடக்கம் செய்தார்கள்; இஸ்ரவேலர் அனைவரும் அவனுக்காகத் துக்கம் அனுசரித்தார்கள். யாவே தம் ஊழியரான அகியா இறைவாக்கினர் மூலமாக[a] உரைத்த வார்த்தையின்படியே இது நடந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “தம் ஊழியரான அகியா இறைவாக்கினரின் கையால்”; இது அவர் வழியாக என்று பொருள்படும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: அவனை அடக்கம் செய்தார்கள்
  rationale: קבר என்பதன் நேரடியான அடக்கச் செயலை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; தொடர்ச்சியான எபிரெய இணைப்பைத் தமிழில் தனியே மொழிபெயர்க்கத் தேவையில்லை.
- source_word: וַיִּסְפְּדוּ לוֹ
  choice: அவனுக்காகத் துக்கம் அனுசரித்தார்கள்
  rationale: ספד மரணத்தைத் தொடர்ந்து நடைபெறும் பொதுத் துக்கத்தைக் குறிக்கிறது; ஒப்பாரி அல்லது உரத்த அழுகை என்ற அளவுக்கு பொருளை மிகைப்படுத்தாமல் சமூகத் துக்கத்தை வெளிப்படுத்துகிறது.
- source_word: כָּל יִשְׂרָאֵל
  choice: இஸ்ரவேலர் அனைவரும்
  rationale: மக்கள் சமூகத்தைக் குறிக்கும் கூட்டு வெளிப்பாட்டை இயல்பான தமிழில் தருகிறது.
- source_word: כִּדְבַר יְהוָה
  choice: யெகோவா ... உரைத்த வார்த்தையின்படியே
  rationale: כְּ முன்னொட்டு உரைக்கப்பட்ட வார்த்தைக்கு ஏற்ப நிகழ்ந்த நிறைவேற்றத்தைக் காட்டுகிறது; தமிழில் வாக்கிய முடிவில் இவ்வுறவைத் தெளிவாக அமைக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தெய்வீகப் பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டப்பெயராக மாற்றாமல், தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பால் வழங்குகிறது.
- source_word: אֲשֶׁר דִּבֶּר
  choice: உரைத்த
  rationale: முந்திய தீர்க்கதரிசன உரையைச் சுட்டும் தொடர்பு வினையைச் சுருக்கமான, கண்ணியமான தமிழில் தருகிறது.
- source_word: בְּיַד
  choice: மூலம்
  rationale: சொல்லுக்கு சொல் 'கையால்' என்பதற்குப் பதிலாக, இங்கு தீர்க்கதரிசியின் வழியாகச் செய்தி தெரிவிக்கப்பட்ட முகமைப் பொருளை இயல்பாகக் காட்டுகிறது.
- source_word: עַבְדּוֹ
  choice: தமது ஊழியரான
  rationale: தீர்க்கதரிசனப் பணிச் சூழலில் עבד குறிக்கும் இறைச் சேவையையும் நியமிக்கப்பட்ட பணியையும் 'ஊழியர்' இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֲחִיָּהוּ הַנָּבִיא
  choice: இறைவாக்கினர் அகியா
  rationale: பெயரைத் தமிழில் ஒலிபெயர்த்து, நביא என்ற பணிப்பட்டத்தை நவீனமும் கண்ணியமுமான 'இறைவாக்கினர்' என வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: ஆண்டவர்; யாவே
  rationale: மூலத்தில் தனிப்பட்ட தெய்வீகப் பெயர் நேரடியாக இருப்பதால், அதை பொதுப் பட்டப்பெயரால் மாற்றாமல் தமிழில் நன்கு அறியப்பட்ட ஒலிபெயர்ப்பில் தருகிறது. எபிரெய உச்சரிப்பின் துல்லியமான வடிவம் உறுதியற்றது என்பதால் வேறு ஒலிபெயர்ப்புகளும் சாத்தியம்.
- issue: בְּיַד עַבְדּוֹ என்ற தீர்க்கதரிசன முகமைச் சொற்றொடர்
  choice: தமது ஊழியரான ... மூலம்
  alternative: தமது ஊழியரான ... கையால்
  rationale: மூலத்தின் சொல் வடிவம் 'கையால்' என்றாலும், இங்கு செய்தி தீர்க்கதரிசி வழியாக உரைக்கப்பட்டதைச் சுட்டும் எபிரெய மரபுத்தொடராக உள்ளது; 'மூலம்' அந்த முகமை உறவைத் தெளிவாகப் பாதுகாக்கிறது.
- issue: தீர்க்கதரிசன வார்த்தைக்கும் நிகழ்வுக்கும் உள்ள தொடர்பு
  choice: வார்த்தையின்படியே நடந்தது
  alternative: வார்த்தையின்படி
  rationale: כִּדְבַר என்பது நிகழ்வு முன்பு உரைக்கப்பட்ட வார்த்தைக்கு ஏற்ப நடந்ததைக் குறிக்கிறது. 'நடந்தது' தமிழில் மறைமுகமாக உள்ள வினையை வெளிப்படுத்தினாலும், உரையில் இல்லாத கூடுதல் காரணவியல் அல்லது கோட்பாட்டைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பான சொற்றொடரமைப்பு, அதேவேளை வேதாகம வரலாற்றுரைக்கு ஏற்ற கண்ணியமான நடை. மூலத்தின் தீர்க்கதரிசன நிறைவேற்ற அமைப்பும் முகமைப் பொருளும் பாதுகாக்கப்பட்டுள்ளன.
