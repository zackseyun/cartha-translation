id: 1KI.14.3
reference: 1 Kings 14:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/לָקַ֣חַתְּ בְּ֠/יָדֵ/ךְ עֲשָׂרָ֨ה לֶ֧חֶם וְ/נִקֻּדִ֛ים וּ/בַקְבֻּ֥ק דְּבַ֖שׁ וּ/בָ֣את אֵלָ֑י/ו ה֚וּא יַגִּ֣יד לָ֔/ךְ מַה יִּֽהְיֶ֖ה לַ/נָּֽעַר־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/003.yaml
  text: And take in your hand ten loaves of bread, some cakes, and a jar of honey, and go to him. He will tell you what will happen to the boy.
translation:
  language: ta
  text: உன் கையில் பத்து அப்பங்களையும், சில சிறு அடைகளையும், ஒரு குடுவை தேனையும் எடுத்துக்கொண்டு அவனிடம் போ. அந்தப் பையனுக்கு என்ன நேரிடும் என்பதை அவன் உனக்குச் சொல்வான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲשָׂרָה לֶחֶם
  choice: பத்து அப்பங்கள்
  rationale: எபிரெயச் சொற்றொடர் எண்ணிக்கையுடன் அப்பங்களைக் குறிக்கிறது; தமிழில் இயல்பாகப் பன்மையில் தரப்பட்டது.
- source_word: נִקֻּדִים
  choice: சில சிறு அடைகள்
  rationale: இச்சொல் புள்ளிகள் அல்லது துளைகளுள்ள சிறிய சுடுபண்டங்களைக் குறிக்கலாம்; அதன் துல்லிய வகை உறுதியில்லாததால் பொதுவாகவும் இயல்பாகவும் மொழிபெயர்க்கப்பட்டது.
- source_word: בַּקְבֻּק דְּבַשׁ
  choice: ஒரு குடுவை தேன்
  rationale: தேனை எடுத்துச் செல்லும் சிறிய பாத்திரத்தை இயல்பான தமிழில் குறிக்கிறது.
- source_word: מַה יִּהְיֶה לַנָּעַר
  choice: அந்தப் பையனுக்கு என்ன நேரிடும்
  rationale: வருங்காலத்தில் பையனுக்கு ஏற்படப்போவதைச் சுட்டும் எபிரெயச் சொல்லாட்சியைத் தெளிவாகவும் அதன் திறந்த பொருளைப் பாதுகாத்தும் தருகிறது.
theological_decisions:
- issue: தீர்க்கதரிசி பையனின் எதிர்காலத்தை அறிவிப்பது
  choice: அவனுக்கு என்ன நேரிடும் என்பதை அவன் சொல்வான்
  alternative: அவன் உயிர் பிழைப்பானா என்பதை அவன் சொல்வான்
  rationale: மூலத்தில் பொதுவான מַה יִּהְיֶה உள்ளது; நோயின் முடிவை ‘உயிர் பிழைப்பானா’ என்று குறுக்காமல் அதன் உண்மையான விரிவைத் தக்கவைத்தது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; நேரடியான கட்டளைத் தொனியும் கண்ணியமான வேதாகம நடையும் பேணப்பட்டுள்ளன. பெண்ணை நோக்கிய எபிரெய வினை வடிவத்தின் பாலினம் தமிழில் இயல்பாக வெளிப்படாததால் கூடுதல் சொல் சேர்க்கப்படவில்லை.
