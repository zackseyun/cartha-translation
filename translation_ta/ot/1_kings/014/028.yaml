translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. வழக்கமாகத் திரும்ப நிகழ்ந்த செயலை ‘போதெல்லாம்’ மற்றும் ‘செல்வார்கள்/கொண்டுபோவார்கள்’ என்பவை வெளிப்படுத்துகின்றன. அடிக்குறிப்புக் குறிகள் தொடர்புடைய சொற்களுக்கு மிக அருகில் அமைக்கப்பட்டுள்ளன.
