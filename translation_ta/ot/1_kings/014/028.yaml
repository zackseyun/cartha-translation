  text: וַ/יְהִ֛י מִ/דֵּי בֹ֥א הַ/מֶּ֖לֶךְ בֵּ֣ית יְהוָ֑ה יִשָּׂאוּ/ם֙ הָֽ/רָצִ֔ים וֶ/הֱשִׁיב֖וּ/ם אֶל תָּ֥א הָ/רָצִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/028.yaml
  text: And whenever the king entered the house of Yahweh[b][a], the guards would carry them and then return them to the guards’ chamber.
translation:
  language: ta
  text: அரசன் யாவேயின் ஆலயத்திற்குள் செல்லும் போதெல்லாம், காவலர்கள்[b] அவற்றை[a]ச் சுமந்துசென்று, பின்னர் அவற்றைக் காவலர்களின் அறைக்குத் திரும்பக் கொண்டுபோவார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவற்றை” என்பது, சீஷாக் எடுத்துச் சென்ற தங்கக் கேடயங்களுக்குப் பதிலாக ரெகொபெயாம் செய்த வெண்கலக் கேடயங்களைக் குறிக்கிறது (1 இராஜாக்கள் 14:27 பார்க்கவும்).
    reason: cross_reference
  - marker: b
    text: எபிரெயத்தில் “ஓடுபவர்கள்”; அரசவைக் சூழலில் இச்சொல் அரசனின் காவலர்களை அல்லது மெய்க்காவலர்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִדֵּי בֹא
  choice: செல்லும் போதெல்லாம்
  rationale: מִדֵּי + infinitive திரும்பத் திரும்ப நிகழ்ந்த வழக்கத்தைக் குறிக்கிறது; தமிழில் ‘போதெல்லாம்’ அந்த இயல்பைத் தெளிவாக வெளிப்படுத்துகிறது. וַיְהִי என்பதைத் தனியே மரப்போக்காக மொழிபெயர்க்காமல் வாக்கிய ஓட்டத்தில் இயல்பாக இணைக்கிறது.
- source_word: הַמֶּלֶךְ
  choice: அரசன்
  rationale: சூழலில் ரெகொபெயாமைக் குறிக்கும் திட்டவட்டமான பெயர்ச்சொல்.
- source_word: בֵּית יְהוָה
  choice: யெகோவாவின் ஆலயம்
  rationale: בֵּית என்பதன் சொற்பொருள் ‘வீடு’ என்றாலும், இச்சூழலில் வழிபாட்டுக் கட்டடமான ஆலயத்தைக் குறிக்கிறது; ‘ஆலயம்’ நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: இறைத் திருப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் பரவலாக அறியப்படும் பெயர்வடிவில் தருகிறது.
- source_word: יִשָּׂאוּם
  choice: அவற்றைச் சுமந்து செல்வார்கள்
  rationale: முற்பட்ட தொடர்ச்சியான செயலை imperfect வடிவம் குறிக்கிறது; பொருள் பின்னொட்டு முந்தைய வசனத்திலுள்ள வெண்கலக் கேடயங்களைக் குறிக்கிறது.
- source_word: הָרָצִים
  choice: காவலர்கள்
  rationale: சொற்பட ‘ஓடுபவர்கள்’ என்றாலும், அரசவைக் சூழலில் அரசனோடு செல்லும் மெய்க்காவலர்களைக் குறிக்கிறது; செயல்பாட்டு பொருளை ‘காவலர்கள்’ தெளிவாக வழங்குகிறது.
- source_word: וֶהֱשִׁיבוּם
  choice: பிறகு அவற்றைத் திரும்பக் கொண்டுபோவார்கள்
  rationale: שוב என்பதன் Hiphil வடிவம் ‘திரும்பச் செய்யுதல்/திரும்பக் கொண்டுபோதல்’ என்பதைக் குறிக்கிறது; இங்குள்ள வழக்கமான அடுத்த செயலை ‘பிறகு’ தெளிவுபடுத்துகிறது.
- source_word: אֶל תָּא הָרָצִים
  choice: காவலர்களின் அறைக்கு
  rationale: תָּא என்பது அறை அல்லது சிற்றறையைக் குறிக்கிறது; உடைமைத் தொடர்பை இயல்பான தமிழில் காக்கிறது.
