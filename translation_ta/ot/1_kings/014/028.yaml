- from: அரசன் யெகோவாவின் ஆலயத்திற்குள் செல்லும் போதெல்லாம், காவலர்கள் அவற்றைச் சுமந்து செல்வார்கள்; பிறகு அவற்றைக் காவலர்களின் அறைக்குத் திரும்பக் கொண்டுபோவார்கள்.[a][b]
  to: அரசன் யாவேயின் ஆலயத்திற்குள் செல்லும் போதெல்லாம், காவலர்கள்[b] அவற்றை[a]ச் சுமந்துசென்று, பின்னர் அவற்றைக் காவலர்களின் அறைக்குத் திரும்பக் கொண்டுபோவார்கள்.
