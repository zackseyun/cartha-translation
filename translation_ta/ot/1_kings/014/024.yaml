  terminology: ‘யாவே,’ ‘இஸ்ரவேல் மக்கள்,’ ‘அருவருப்பான செயல்கள்’ ஆகியவை பொருத்தமானவை. קָדֵשׁ குறித்த அடிக்குறிப்பு, குறிப்பிட்ட கோவில் அமைப்பு அல்லது நவீன அர்த்தத்திலான பாலியல் தொழில் என்று உறுதிப்படுத்தாமல், மாற்று மொழிபெயர்ப்புகளைச் சுட்ட வேண்டும்.
