  rationale: இது ஆண் சந்ததியினரை மட்டும் தனிப்படுத்தாமல் இஸ்ரவேல் இனக்குழுவை மொத்தமாகக் குறிக்கும் மரபுத்தொடர்; நவீன தமிழில் இயல்பும் துல்லியமும் உள்ள இனப்பெயர் தேர்ந்தெடுக்கப்பட்டுள்ளது.
- issue: יהוה என்ற உடன்படிக்கைப் பெயர்
  choice: யாவே
  alternative: யெகோவா; கர்த்தர்
  rationale: மூலத்தில் உள்ள தனிப்பட்ட இறைபெயரைப் பட்டப்பெயரால் மறைக்காமல், ஏற்றுக்கொள்ளப்பட்ட ஒலிப்புக்கு நெருக்கமாக வழங்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. பாலியல் சீர்கேட்டை மறைக்காமலும் தேவையற்ற வெளிப்படையான சொற்களைச் சேர்க்காமலும் கூறப்பட்டுள்ளது. ‘அவர்கள்’ என்பதன் உடனடி குறிப்பு யார் என்பது மூலத்தில் முழுமையாக விளக்கப்படாததால் அந்தச் சுட்டுப்பெயர் அப்படியே பாதுகாக்கப்பட்டுள்ளது.
