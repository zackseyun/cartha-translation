  text: There were also cult prostitutes in the land[a]. They did according to all the abominations of the nations that Yahweh had driven out before the sons of Israel.
translation:
  language: ta
  text: வழிபாட்டுடன் தொடர்புடைய பாலியல் நடைமுறைகளில் ஈடுபட்ட ஆண்களும் நாட்டில் இருந்தார்கள்[a]. யாவே இஸ்ரவேல் மக்களுக்கு முன்பாகத் துரத்தியிருந்த பிற இனத்தவர்கள் செய்த எல்லா அருவருப்பான செயல்களையும் போலவே அவர்கள் செய்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வழிபாட்டுச் சடங்கு விபசார ஆண்கள்’ அல்லது ‘கோவில் விபசார ஆண்கள்’ என்றும் மொழிபெயர்க்கலாம். קָדֵשׁ (காதேஷ்) என்ற எபிரெயச் சொல், தடைசெய்யப்பட்ட வழிபாட்டுச் சூழலோடு தொடர்புடைய பாலியல் நடைமுறையில் ஈடுபட்ட ஓர் ஆணைக் குறிக்கிறது; இங்கு அது அத்தகைய ஆட்களை ஒரு வகுப்பாகக் கூட்டுப் பொருளில் சுட்டுகிறது.
    reason: lexical_alternative
