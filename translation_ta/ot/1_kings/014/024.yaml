  rationale: இச்சொல் ஆண்பால் ஒருமையில் இருந்தாலும், இங்கு ஒரு வகுப்பினரின் இருப்பைக் கூட்டாகக் குறிக்கிறது. தடைசெய்யப்பட்ட வழிபாட்டுச் சூழலோடு தொடர்புடைய பாலியல் செயலைத் தெளிவுபடுத்துகிறது; ‘சோதோமியர்’ போன்ற தவறாக வழிநடத்தும் மரபுச் சொல்லைத் தவிர்க்கிறது.
