base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/023.yaml
  text: They too built for themselves high places[a], pillars, and Asherah poles on every high hill and under every green tree.
translation:
  language: ta
  text: அவர்களும் தங்களுக்காக உயர்ந்த வழிபாட்டு இடங்களையும், வழிபாட்டுத் தூண்களையும், அசேரா கம்பங்களையும்[a] ஒவ்வொரு உயரமான குன்றின்மேலும் ஒவ்வொரு பசுமையான மரத்தின் கீழும் அமைத்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அசேரீம்’ அல்லது ‘புனிதக் கம்பங்கள்’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் அசேராவுடன் தொடர்புடைய வழிபாட்டுப் பொருட்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְנוּ
  choice: கட்டினார்கள்
  rationale: בנה என்பதன் இயல்பான பொருள் ‘கட்டு’; வழிபாட்டிடங்களையும் அவற்றுடன் தொடர்புடைய அமைப்புகளையும் நிறுவியதை இங்கு இயல்பாகக் குறிக்கிறது.
- source_word: גַם הֵמָּה
  choice: அவர்களும்
  rationale: முந்தைய சூழலுடன் தொடர்ச்சியையும், யூதா மக்களும் அதே பாவத்தில் ஈடுபட்டார்கள் என்ற சேர்க்கைப் பொருளையும் தக்கவைக்கிறது.
- source_word: לָהֶם
  choice: தங்களுக்காக
  rationale: இங்குள்ள முன்னிடைச்சொல் மற்றும் சுட்டுப்பெயர் தங்கள் பயன்பாட்டுக்காக இவற்றை ஏற்படுத்திக்கொண்டார்கள் என்ற தற்சுட்டுப் பொருளைக் கொண்டுள்ளது.
- source_word: בָּמוֹת
  choice: மேடைகள்
  rationale: במות என்பது உள்ளூர் வழிபாட்டுக்காக அமைக்கப்பட்ட உயரிடங்களையோ வழிபாட்டு மேடைகளையோ குறிக்கிறது; ‘மேடைகள்’ சுருக்கமாகவும் சூழலில் புரியத்தக்கதாகவும் உள்ளது.
- source_word: מַצֵּבוֹת
  choice: வழிபாட்டுத் தூண்கள்
  rationale: מצבות என்பது நிறுத்தப்பட்ட வழிபாட்டுக் கற்கள் அல்லது தூண்களைக் குறிக்கிறது; வெறும் கட்டிடத் தூண்களாகத் தவறாகப் புரிந்துகொள்ளப்படாதபடி வழிபாட்டுச் சூழல் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: אֲשֵׁרִים
  choice: அசேரா கம்பங்கள்
  rationale: இந்தப் பன்மை வடிவம் அசேராவுடன் தொடர்புடைய வழிபாட்டுப் பொருட்களைக் குறிக்கிறது. ‘அசேரா கம்பங்கள்’ பொருளின் தன்மையையும் சமயத் தொடர்பையும் தக்கவைக்கிறது.
- source_word: עַל כָּל גִּבְעָה גְבֹהָה
  choice: ஒவ்வொரு உயரமான குன்றின்மேலும்
  rationale: இடத்தையும், சட்டவிரோத வழிபாடு எங்கும் பரவியிருந்தது என்ற சொற்றொடரின் வலியுறுத்தலையும் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: וְתַחַת כָּל עֵץ רַעֲנָן
  choice: ஒவ்வொரு செழிப்பான மரத்தின் கீழும்
  rationale: רענן என்பது பசுமை, இலைச்செழிப்பு, உயிர்ப்புடன் வளர்தல் ஆகியவற்றைக் குறிக்கிறது; ‘செழிப்பான மரம்’ இயல்பான நவீனத் தமிழில் அந்தப் பொருளை வழங்குகிறது.
theological_decisions:
- issue: אֲשֵׁרִים என்பது அசேரா தேவியையே குறிக்கிறதா அல்லது அவளுடன் தொடர்புடைய வழிபாட்டுப் பொருட்களைக் குறிக்கிறதா
  choice: அசேராவுடன் தொடர்புடைய வழிபாட்டுப் பொருட்கள் என ‘அசேரா கம்பங்கள்’
  alternative: ‘அசேரீம்’, ‘அசேராக்கள்’, அல்லது ‘அசேராவின் உருவங்கள்’
  rationale: ‘மேடைகள்’, ‘வழிபாட்டுத் தூண்கள்’ ஆகிய பொருட்களுடன் பட்டியலிடப்பட்டிருப்பதால், இங்கு தேவியைவிட வழிபாட்டுப் பொருட்களே இயல்பான குறிப்பு. அதே நேரத்தில் ‘அசேரா’ என்ற பெயரைத் தக்கவைத்ததால் அதன் சமயத் தொடர்பு மறைக்கப்படவில்லை.
