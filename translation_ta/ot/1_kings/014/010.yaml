  text: לָ/כֵ֗ן הִנְ/נִ֨י מֵבִ֤יא רָעָה֙ אֶל בֵּ֣ית יָרָבְעָ֔ם וְ/הִכְרַתִּ֤י לְ/יָֽרָבְעָם֙ מַשְׁתִּ֣ין בְּ/קִ֔יר עָצ֥וּר וְ/עָז֖וּב בְּ/יִשְׂרָאֵ֑ל וּ/בִֽעַרְתִּי֙ אַחֲרֵ֣י בֵית יָרָבְעָ֔ם כַּ/אֲשֶׁ֛ר יְבַעֵ֥ר הַ/גָּלָ֖ל עַד תֻּמּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/010.yaml
  text: Therefore[a], behold, I am bringing disaster on the house of Jeroboam, and I will cut off from Jeroboam every male, bond and free in Israel, and I will burn away after the house of Jeroboam[b], just as one burns away dung until it is all gone.
translation:
  language: ta
  text: ஆகையால், இதோ, நான் யெரொபெயாமின் வீட்டார்மேல் பேரழிவைக் கொண்டுவருவேன். யெரொபெயாமைச் சேர்ந்த ஆண்கள் அனைவரையும்[a]—இஸ்ரவேலில் அடிமையையும் சுதந்திரனையும்[b]—அழித்தொழிப்பேன். சாணத்தை முற்றிலும் அகற்றுவதுபோல, யெரொபெயாமின் வீட்டாரை அகற்றிப்போடுவேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “சுவர்மேல் சிறுநீர் கழிப்பவன்”; இது ஆணைக் குறிக்கும் கரடுமுரடான மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “அடைக்கப்பட்டவனும் விடப்பட்டவனும்.” இதன் துல்லியமான சுட்டுப்பொருள் உறுதியற்றது; அடிமை, சுதந்திரன் என வேறுபாடின்றி அனைவரையும் குறிக்கும் முழுமைத் தொடராக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָעָה
  choice: பேரழிவு
  rationale: தீர்ப்புரையின் சூழலில் இது ஒழுக்கத் தீமையை அல்ல, கடவுள் கொண்டுவரும் கடும் கேட்டை அல்லது பேரிடரைச் சுட்டுகிறது.
- source_word: וְהִכְרַתִּי
  choice: அழித்தொழிப்பேன்
  rationale: כרת இங்கு ஒருவரின் வம்சத்திலுள்ளவர்களை முற்றிலும் இல்லாமலாக்கும் தீர்ப்பைக் குறிக்கிறது; இயல்பான தமிழில் அதன் கடுமையை இச்சொல் வெளிப்படுத்துகிறது.
- source_word: מַשְׁתִּין בְּקִיר
  choice: ஆண்கள் அனைவரையும்
  rationale: சுவர்மேல் சிறுநீர் கழிப்பவன் என்ற கரடுமுரடான எபிரெய மரபுத்தொடர் ஆண்களைக் குறிக்கிறது; பொருள் முதன்மை உரையில் தெளிவாகவும் சொல்லாட்சியின் தன்மை அடிக்குறிப்பிலும் பாதுகாக்கப்படுகிறது.
- source_word: עָצוּר וְעָזוּב
  choice: அடிமையாயிருப்பவனையும் சுதந்திரனாயிருப்பவனையும்
  rationale: இணைச்சொல்லின் துல்லியமான பொருள் விவாதத்திற்குரியது; இங்கு எந்த வகுப்பினரும் தப்பமாட்டார்கள் என்பதைக் குறிக்கும் முழுமைத் தொடராக எடுத்துக்கொள்ளப்பட்டுள்ளது.
- source_word: וּבִעַרְתִּי אַחֲרֵי בֵית יָרָבְעָם
  choice: யெரொபெயாமின் வீட்டாரில் எஞ்சியிருப்பவர்களை அகற்றிப்போடுவேன்
  rationale: பின்வரும் சாண உவமை முழுமையான அகற்றுதலை விளக்குகிறது; אַחֲרֵי என்பதை வீட்டாரில் பின்னால் எஞ்சியிருப்பவர்கள் எனப் பொருள்படுத்துகிறது.
- source_word: הַגָּלָל
  choice: சாணம்
  rationale: மூலத்தின் இழிவும் அருவருப்பும் மென்மைப்படுத்தப்படாமல் இயல்பான தமிழில் காக்கப்படுகிறது.
- source_word: עַד תֻּמּוֹ
  choice: முற்றிலும்
  rationale: எதுவும் எஞ்சாத முழுமையான அகற்றுதலைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: தெய்வீகத் தீர்ப்பின் கடுமை
  choice: ‘பேரழிவு’, ‘அழித்தொழிப்பேன்’, ‘சாணம்’, ‘அகற்றிப்போடுவேன்’ என்ற நேரடியான சொற்களைப் பயன்படுத்துதல்
  alternative: ‘துன்பம்’ அல்லது ‘நீக்குவேன்’ போன்ற மென்மையான சொற்களைப் பயன்படுத்துதல்
  rationale: எபிரெயத் தீர்ப்புரை வேண்டுமென்றே கடுமையாகவும் இழிவுணர்த்துவதாகவும் உள்ளது; அதன் வலிமையை மொழிபெயர்ப்பு தணிக்கக்கூடாது.
- issue: עָצוּר וְעָזוּב என்பதன் தெளிவற்ற இணைச்சொல்
  choice: அனைத்து சமூக நிலைகளையும் உள்ளடக்கும் முழுமைத் தொடராக ‘அடிமை—சுதந்திரன்’ என வழங்குதல்
  alternative: சொல்லுக்குச் சொல் ‘அடைக்கப்பட்டவன்—விடப்பட்டவன்’ என வழங்குதல்
  rationale: மரபுத்தொடரின் சரியான சுட்டுப்பொருள் உறுதியற்றிருந்தாலும், யாரும் விதிவிலக்கல்ல என்ற அதன் செயல்பாடு சூழலில் தெளிவாகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான ஆனால் தீர்ப்புரையின் கடுமையைத் தணிக்காத நடை. ‘இதோ’ தீர்க்கதரிசன அறிவிப்பின் வலியுறுத்தலைக் காக்கிறது; மூலத்தின் கரடுமுரடான ஆண்-மரபுத்தொடர் முதன்மை உரையில் இயல்பாக்கப்பட்டு அடிக்குறிப்பில் வெளிப்படுத்தப்பட்டுள்ளது.
