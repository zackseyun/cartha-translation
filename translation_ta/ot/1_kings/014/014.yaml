  text: וְ/הֵקִים֩ יְהוָ֨ה ל֥/וֹ מֶ֨לֶךְ֙ עַל יִשְׂרָאֵ֔ל אֲשֶׁ֥ר יַכְרִ֛ית אֶת בֵּ֥ית יָרָבְעָ֖ם זֶ֣ה הַ/יּ֑וֹם וּ/מֶ֖ה גַּם עָֽתָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/014.yaml
  text: And Yahweh will raise up for himself a king over Israel who will cut off the house of Jeroboam this day[a]. But what? Even now.
translation:
  language: ta
  text: யாவே தமக்காக இஸ்ரவேலின்மேல் ஒரு ராஜாவை எழுப்புவார். அவன் யெரொபெயாமின் வீட்டாரை இன்றே அழித்தொழிப்பான்.[a] ஆனால் என்ன? இப்போதே கூட.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேய வசனத்தின் முடிவு திடீரென்றும் பொருள் காண்பதற்குக் கடினமாகவும் உள்ளது; சொற்சார்ந்து, “ஆனால் என்ன? இப்போதே கூட” என வருகிறது. தீர்ப்பு உடனடியாக நிகழப்போவதை வலியுறுத்தும் வியப்புரையாகவும் இதைப் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהֵקִים
  choice: எழுப்புவார்
  rationale: קום என்பதன் ஹிஃபில் வடிவம் ஒருவரை ஆட்சிக்குக் கொண்டுவருதல் அல்லது ஏற்படுத்துதல் என்ற பொருளைத் தருகிறது. ‘எழுப்புவார்’ என்பது இறைவன் ஒரு அரசனை வரலாற்றில் தோன்றச் செய்வதைக் குறிக்கும் எபிரேய மரபுத்தொடரைப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருப்பெயரான יהוה ஒரு பட்டமாக மாற்றப்படாமல், அதன் ஏற்ற தமிழ் ஒலிபெயர்ப்பான ‘யாவே’ என்று வழங்கப்படுகிறது.
- source_word: לוֹ
  choice: தமக்காக
  rationale: பின்னொட்டு வாக்கியத்தின் எழுவாயான யாவேவையே இயல்பாகச் சுட்டுகிறது. தமிழில் இறைவனைக் குறிக்கும் மரியாதைப் பன்மையுடன் ‘தமக்காக’ என வழங்கப்பட்டுள்ளது.
- source_word: מֶלֶךְ עַל יִשְׂרָאֵל
  choice: இஸ்ரவேலின்மேல் ஒரு ராஜா
  rationale: அரசாட்சியுடன் வரும் עַל, ‘மேல் ஆட்சி செய்தல்’ என்ற பொருளைத் தருவதால் ‘இஸ்ரவேலின்மேல்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: אֲשֶׁר יַכְרִית
  choice: அவன் ... அழித்தொழிப்பான்
  rationale: כרת என்பதன் ஹிஃபில் வடிவம் இங்கு முற்றாக அகற்றுதல் அல்லது அழித்தல் என்ற தீர்ப்புப் பொருளைக் கொண்டது. ‘அழித்தொழிப்பான்’ அந்த வலிமையைக் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בֵּית יָרָבְעָם
  choice: யெரொபெயாமின் வீட்டார்
  rationale: בֵּית என்பது இங்கு கட்டடத்தையல்ல, குடும்பத்தையும் அரச வம்சத்தையும் குறிக்கிறது. ‘வீட்டார்’ அந்தக் கூட்டு மனிதப் பொருளைத் தெளிவாக்குகிறது; ‘வம்சம்’ என்று மட்டும் கூறி பொருளை மிகையாகக் குறுக்கவில்லை.
- source_word: זֶה הַיּוֹם
  choice: இன்றே
  rationale: ‘இந்த நாள்’ என்ற சொற்சார்ந்த பொருள் தமிழில் காலவினையடையாக ‘இன்று’ ஆகிறது; ‘-ஏ’ எபிரேயத்தின் சுட்டுவலியுறுத்தலை வெளிப்படுத்துகிறது.
- source_word: וּמֶה גַּם עָתָּה
  choice: ஆனால் என்ன? இப்போதேகூட.
  rationale: இறுதித் தொடர் சுருக்கமாகவும் இலக்கண ரீதியில் கடினமாகவும் உள்ளது. அதன் திடீர், முறிந்த தொனியைத் தீர்மானமான விளக்கவுரையாக மாற்றாமல் இந்த வடிவம் பாதுகாக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைத்திருப்பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட திருப்பெயர் நேரடியாக இருப்பதால், அதை ஒரு பொதுப் பட்டத்தால் மாற்றாமல் ஒலிபெயர்ப்பாக வழங்குவது மூல வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: וּמֶה גַּם עָתָּה என்ற கடினமான இறுதித் தொடரைக் கையாளுதல்
  choice: 'அதன் திடீர், தெளிவற்ற அமைப்பைப் பாதுகாத்தல்: ‘ஆனால் என்ன? இப்போதேகூட.’'
  alternative: ‘தீர்ப்பு ஏற்கெனவே இப்போதே தொடங்கிவிட்டது’ என்று விளக்கிப் பொருளுரைத்தல்
  rationale: எபிரேயத் தொடர் நீக்கவாக்கியமாகவும் பொருள் உறுதியற்றதாகவும் உள்ளது. ஒரு குறிப்பிட்ட விளக்கத்தை வசனத்துக்குள் புகுத்தாமல் அதன் உண்மையான தெளிவின்மையை மொழிபெயர்ப்பு தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘ராஜா’ என்பது சாதாரண வாசகர்களுக்கு தெளிவான வேதாகம அரசாட்சிச் சொல். கடினமான இறுதித் தொடரின் முறிந்த தொனி திட்டமிட்டே பாதுகாக்கப்பட்டுள்ளது.
