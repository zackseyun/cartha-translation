base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/017.yaml
  text: Then Jeroboam’s wife arose and went and came to Tirzah. As she came to the threshold of the house[a], the boy died.
translation:
  language: ta
  text: அப்போது யெரொபெயாமின் மனைவி எழுந்து புறப்பட்டு, திர்சாவுக்கு வந்தாள். அவள் வீட்டின் வாசற்படியை வந்தடைந்தபோது[a], சிறுவன் இறந்துபோனான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவள் வீட்டின் வாசற்படிக்கு வந்துகொண்டிருந்தபோது.”
    reason: எபிரெயத்தில் உள்ள வினையெச்ச அமைப்பு, வாசற்படியை வந்தடைந்த தருணத்தையோ அங்கு வந்துகொண்டிருந்த காலச் சூழலையோ குறிக்கலாம்.
lexical_decisions:
- source_word: וַתָּקָם
  choice: எழுந்து புறப்பட்டு
  rationale: קום என்பதன் தொடர்கதை வடிவம் அடுத்த செயலைத் தொடங்குவதைச் சுட்டுகிறது. தமிழில் ‘எழுந்தாள்’ என்று மட்டும் சொல்வதைவிட, பயணம் தொடங்கிய சூழலில் ‘எழுந்து புறப்பட்டு’ என்பது இயல்பாகவும் பொருள் மிகைப்படுத்தாமலும் உள்ளது.
- source_word: אֵשֶׁת יָרָבְעָם
  choice: யெரொபெயாமின் மனைவி
  rationale: எபிரெயக் கட்டமைப்பு திருமண உறவை நேரடியாகக் குறிக்கிறது; உடைமை வேற்றுமையுடன் அமைந்த இச்சொற்றொடர் நவீன தமிழில் இயல்பானது.
- source_word: וַתֵּלֶךְ
  choice: புறப்பட்டு
  rationale: הלך இங்கு தொடர்ச்சியான பயணச் செயலைக் குறிக்கிறது. முந்தைய ‘எழுந்து’ என்பதுடன் இணைத்து ‘புறப்பட்டு’ என மொழிபெயர்ப்பது இயல்பான தமிழ் நடையை அளிக்கிறது.
- source_word: וַתָּבֹא תִרְצָתָה
  choice: திர்சாவுக்கு வந்தாள்
  rationale: בוא மற்றும் திசையைக் குறிக்கும் ־ָה முடிவு திர்சாவை நோக்கிய வருகையைச் சுட்டுகின்றன. நகருக்குள் நுழைந்தாள் என்று தேவையின்றி குறிப்பாக்காமல் இலக்கைத் தெளிவாகக் கூறுகிறது.
- source_word: הִיא בָּאָה
  choice: அவள் … வந்தடைந்தபோது
  rationale: தனிப்பட்ட சுட்டுப்பெயருடன் வரும் வினையெச்ச வடிவம் தீர்மானமான நிகழ்வு நடந்த காலச் சூழலை அறிமுகப்படுத்துகிறது. தமிழில் ‘வந்தடைந்தபோது’ அந்தக் காலத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது; நடந்துகொண்டிருந்த செயல் என்ற நிழற்பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: בְסַף הַבַּיִת
  choice: வீட்டின் வாசற்படியை
  rationale: סַף என்பது வாசற்படி அல்லது கதவுநிலையைக் குறிக்கிறது. ‘வாசற்படி’ துல்லியமான, பொதுவாகப் புரியும் தமிழ்ச் சொல்.
- source_word: וְהַנַּעַר
  choice: சிறுவன்
  rationale: נַעַר பல வயது மற்றும் சமூக நிலைகளைக் குறிக்கக்கூடியது; இச்சூழலில் அது யெரொபெயாமின் இளம் மகனைக் குறிக்கிறது. ‘சிறுவன்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: מֵת
  choice: இறந்துபோனான்
  rationale: מות என்பதன் நிறைவுற்ற வடிவம் இங்கு முந்தைய வசனத்தின் முன்னறிவிப்பு நிறைவேறும் நிகழ்வைக் குறிக்கிறது. ‘இறந்துபோனான்’ அந்த நிகழ்வுத் தன்மையை இயல்பான தமிழில் தெரிவிக்கிறது.
