source:
  edition: WLC
  text: וָ/אֶקְרַ֤ע אֶת הַ/מַּמְלָכָה֙ מִ/בֵּ֣ית דָּוִ֔ד וָ/אֶתְּנֶ֖/הָ לָ֑/ךְ וְ/לֹֽא הָיִ֜יתָ כְּ/עַבְדִּ֣/י דָוִ֗ד אֲשֶׁר֩ שָׁמַ֨ר מִצְוֺתַ֜/י וַ/אֲשֶׁר הָלַ֤ךְ אַחֲרַ/י֙ בְּ/כָל לְבָב֔/וֹ לַ/עֲשׂ֕וֹת רַ֖ק הַ/יָּשָׁ֥ר בְּ/עֵינָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/008.yaml
  text: and I tore the kingdom away from the house of David and gave it to you[a]. But you have not been like my servant David, who kept my commandments and who walked after me with all his heart[b], to do only what was right in my eyes.
translation:
  language: ta
  text: தாவீதின் அரச வம்சத்திடமிருந்து[a] அரசைக் கிழித்தெடுத்து, அதை உனக்குக் கொடுத்தேன். ஆனாலும், என் கட்டளைகளைக் கடைப்பிடித்து, தன் முழு இதயத்தோடும் என்னைப் பின்பற்றி நடந்து[b], என் பார்வையில் சரியானதை மட்டுமே செய்த என் ஊழியன் தாவீதைப் போல நீ இருக்கவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லர்த்தமாக, ‘தாவீதின் வீட்டிலிருந்து.’ இது தாவீதின் அரச வம்சத்தைக் குறிக்கும் மரபுத்தொடர்.
    reason: cultural_note
  - marker: b
    text: எபிரெயத்தில் சொல்லர்த்தமாக, ‘எனக்குப் பின்னால் நடந்தான்’; அதாவது, ‘என்னைப் பின்பற்றினான்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶקְרַע
  choice: கிழித்தெடுத்து
  rationale: קרע என்பதன் ‘கிழித்தல்’ என்ற வலிமையான உருவகத்தைத் தக்கவைத்து, அரசைத் தாவீதின் வீட்டாரிடமிருந்து வலுக்கட்டாயமாகப் பிரித்தெடுத்ததைக் காட்டுகிறது.
- source_word: הַמַּמְלָכָה
  choice: அரசு
  rationale: இங்கு அரசாட்சி சார்ந்த அரசியல் ஆட்சிப்பரப்பையும் ஆளுகையையும் இயல்பான நவீன தமிழில் குறிக்கிறது.
- source_word: מִבֵּית דָּוִד
  choice: தாவீதின் வீட்டாரிடமிருந்து
  rationale: ‘தாவீதின் வீடு’ என்ற எபிரெய மரபுத்தொடரின் குடும்ப/வம்சக் கருத்தை இயன்றவரைத் தக்கவைக்கிறது; அடிக்குறிப்பு அதன் அரச வம்சப் பொருளை விளக்குகிறது.
- source_word: וָאֶתְּנֶהָ לָךְ
  choice: அதை உனக்குக் கொடுத்தேன்
  rationale: கடந்தகால நிகழ்வை நேரடியாகக் கூறுகிறது; ‘அதை’ என்பது முன் சொல்லப்பட்ட அரசைக் குறிக்கிறது.
- source_word: עַבְדִּי
  choice: என் ஊழியன்
  rationale: עבד என்பதன் சேவை உறவைக் காட்டுகிறது; இங்கு அடிமை நிலையைக் காட்டிலும் கடவுளுக்குச் சேவை செய்யும் தாவீதின் மரியாதைக்குரிய நிலையே முன்னிலைப்படுகிறது.
- source_word: שָׁמַר מִצְוֺתַי
  choice: என் கட்டளைகளைக் கடைப்பிடித்து
  rationale: கட்டளைகளைக் காத்தல்/பின்பற்றுதல் என்ற உடன்படிக்கைச் சார்ந்த கீழ்ப்படிதலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: הָלַךְ אַחֲרַי
  choice: என்னைப் பின்பற்றி நடந்து
  rationale: ‘எனக்குப் பின்னால் நடந்தான்’ என்ற மூல உருவகத்தையும், அதிலுள்ள உண்மையுடன் பின்பற்றுதல் என்ற பொருளையும் ஒன்றாகத் தக்கவைக்கிறது.
- source_word: בְּכָל לְבָבוֹ
  choice: தன் முழு இதயத்தோடும்
  rationale: பிளவுபடாத உள்ளார்ந்த அர்ப்பணிப்பைக் குறிக்கும் எபிரெய மரபுத்தொடரை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לַעֲשׂוֹת רַק הַיָּשָׁר בְּעֵינָי
  choice: என் பார்வையில் நேர்மையானதை மட்டுமே செய்த
  rationale: רק என்பதன் ‘மட்டுமே’ என்ற கட்டுப்பாட்டையும், ‘என் கண்களில் நேரானது’ என்ற தெய்வீக மதிப்பீட்டையும் தெளிவாகத் தக்கவைக்கிறது; தமிழில் இயல்புக்காக பெயரெச்சத் தொடராக அமைக்கப்பட்டுள்ளது.
theological_decisions:
- issue: தாவீதின் அறியப்பட்ட பாவங்கள் இருந்தபோதிலும் இவ்வசனம் அவரை முன்மாதிரியாக மதிப்பிடுதல்
  choice: வசனம் தாவீதைப் பற்றி அளிக்கும் முழுமையான நேர்மறை மதிப்பீட்டை எந்தத் தணிப்புச் சொல்லும் சேர்க்காமல் அப்படியே வைத்தல்
  alternative: ‘பொதுவாக’ அல்லது ‘பெரும்பாலும்’ போன்ற தகுதிப்படுத்தும் சொல்லைச் சேர்த்தல்
  rationale: இவ்வசனம் யெரொபெயாமுக்கு மாறாகத் தாவீதை முழு இதயத்தோடு கீழ்ப்படிந்தவராக முன்வைக்கிறது. வேறு பகுதிகள் தாவீதின் பாவங்களைக் குறிப்பிடினும், இங்கு உள்ள இறையியல் பதற்றத்தை மொழிபெயர்ப்பாளர் அமைதியாகத் தீர்க்கக்கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘கிழித்தெடுத்து,’ ‘முழு இதயத்தோடும்,’ ‘என் பார்வையில்’ ஆகிய மூல உருவகங்கள் தெளிவாக இருப்பதால் தக்கவைக்கப்பட்டுள்ளன. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்றொடர்களுக்குப் பின்பே இடப்பட்டுள்ளன.
