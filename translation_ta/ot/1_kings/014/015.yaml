- source_word: מַכְעִיסִים אֶת יְהוָה
  choice: யாவேக்குக் கோபமூட்டினார்கள்
  rationale: விக்கிரக வழிபாடு யாவேயின் கோபத்தைத் தூண்டியது என்ற வினையின் வெளிப்படையான பொருளைத் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலம் பட்டப்பெயரை அல்ல, தேவனுடைய தனிப்பெயரைப் பயன்படுத்துவதால் ஒலிபெயர்ப்பு தேர்ந்தெடுக்கப்பட்டது.
- issue: ‘நதி’ என்பதன் குறிப்பு
  choice: முதன்மை உரையில் ‘நதி’; அடிக்குறிப்பில் யூப்ரட்டீஸ் என விளக்கம்
  alternative: முதன்மை உரையிலேயே ‘யூப்ரட்டீஸ் நதி’
  rationale: மூலத்தின் மரபுவழிச் சுட்டை அப்படியே காத்து, நவீன வாசகருக்குத் தேவையான புவியியல் விளக்கத்தை அடிக்குறிப்பு தருகிறது.
- issue: אֲשֵׁרֵיהֶם என்பதன் தன்மை
  choice: அசேரீம் என்ற எபிரெயப் பன்மை வடிவத்தின் ஒலிபெயர்ப்பு
  alternative: அசேரா கம்பங்கள் / அசேரா சிலைகள்
  rationale: இந்த வழிபாட்டுப் பொருட்களின் துல்லியமான வடிவம் எல்லாச் சூழல்களிலும் உறுதியல்ல; ஆகவே மூலத்தின் தெளிவின்மையைப் பாதுகாத்து அடிக்குறிப்பில் விளக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. நாணல் மற்றும் வேரோடு பிடுங்குதல் ஆகிய மூல உருவகங்கள் காக்கப்பட்டுள்ளன; ‘அசேரீம்’ குறித்த உண்மையான சொற்பொருள் தெளிவின்மை அடிக்குறிப்புடன் பாதுகாக்கப்பட்டுள்ளது.
