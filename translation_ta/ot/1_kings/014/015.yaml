  rationale: தேவனுடைய தனிப்பெயரான நான்கெழுத்துப் பெயரைப் பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்க்கிறது.
- source_word: כַּאֲשֶׁר יָנוּד הַקָּנֶה בַּמַּיִם
  choice: தண்ணீரில் நாணல் அசைவதுபோல்
  rationale: நீரில் நிலையின்றி அசையும் நாணலின் ஒப்புமையை இயல்பான தமிழில் காக்கிறது.
- source_word: וְנָתַשׁ
  choice: வேரோடு பிடுங்கி
  rationale: நிலத்திலிருந்து அகற்றப்படுவதை வேரோடு பிடுங்கும் உருவகத்தின் மூலம் தெளிவாகக் காட்டுகிறது.
- source_word: הָאֲדָמָה הַטּוֹבָה הַזֹּאת
  choice: இந்த நல்ல நிலம்
  rationale: உடன்படிக்கைச் சூழலில் கொடுக்கப்பட்ட நாட்டைச் சுட்டும் மூலத்தின் எளிய மதிப்பீட்டுச் சொற்றொடரைப் பாதுகாக்கிறது.
- source_word: אֲשֶׁר נָתַן לַאֲבוֹתֵיהֶם
