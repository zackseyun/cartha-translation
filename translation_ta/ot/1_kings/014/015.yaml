  choice: அடிப்பார்
  rationale: தீர்க்கதரிசன உரையில் எதிர்காலத் தண்டனையைக் குறிக்கும் வினை; நவீனத் தமிழில் நேரடியாகவும் இயல்பாகவும் உள்ளது.
- source_word: יְהוָה
