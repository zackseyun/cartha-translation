base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/015.yaml
  text: And Yahweh will strike Israel[a], as a reed sways in the water, and he will uproot Israel from this good land that he gave to their fathers, and scatter them beyond the River, because they made their Asherim[b], provoking Yahweh.
translation:
  language: ta
  text: தண்ணீரில் நாணல் அசைவதுபோல் யாவே இஸ்ரவேலை அடிப்பார்; அவர்களுடைய முன்னோர்களுக்கு அவர் கொடுத்த இந்த நல்ல நிலத்திலிருந்து இஸ்ரவேலை வேரோடு பிடுங்கி, அந்த நதிக்கு அப்பால்[a] அவர்களைச் சிதறடிப்பார். ஏனெனில், அவர்கள் தங்கள் அசேரீம்களைச் செய்து யாவேக்குக் கோபமூட்டினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘யூப்ரட்டீஸ் நதிக்கு அப்பால்’; இச்சூழலில் ‘அந்த நதி’ என்பது யூப்ரட்டீஸ் நதியைக் குறிக்கிறது.
    reason: cross_reference
lexical_decisions:
