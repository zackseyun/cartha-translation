  yaml_path: translation/ot/1_kings/014/025.yaml
  text: In the fifth year of King Rehoboam[a], Shishak king of Egypt came up against Jerusalem.
translation:
  language: ta
  text: ரெகொபெயாம் அரசனுடைய ஆட்சியின் ஐந்தாம் ஆண்டில், எகிப்தின் அரசனான சீஷாக் எருசலேமுக்கு எதிராகப் படையெடுத்து வந்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: தனியாக மொழிபெயர்க்கப்படவில்லை
  rationale: இந்தத் தொடர் கதைநடையில் அடுத்த நிகழ்வை அறிமுகப்படுத்துகிறது. நவீனத் தமிழில் தனியாக ‘அப்போது நிகழ்ந்தது’ என்று சேர்ப்பது இயல்பற்றதாக இருப்பதால், காலக் குறிப்புடன் நேரடியாக வாக்கியம் தொடங்குகிறது.
- source_word: בַּשָּׁנָה הַחֲמִישִׁית
  choice: ஐந்தாம் ஆண்டில்
  rationale: அரசாட்சி ஆண்டைக் குறிக்கும் வழக்கமான கால நிர்ணயச் சொற்றொடரை இயல்பான தமிழில் தருகிறது.
- source_word: לַמֶּלֶךְ רְחַבְעָם
  choice: ரெகொபெயாம் அரசனுடைய ஆட்சியின்
  rationale: לְ இங்கு ரெகொபெயாமின் ஆட்சிக்காலத்தைச் சுட்டுகிறது. ‘ஆட்சியின்’ என்பதை வெளிப்படையாகச் சேர்ப்பது தமிழில் காலக் குறிப்பைத் தெளிவாக்குகிறது.
- source_word: עָלָה ... עַל
  choice: எதிராகப் படையெடுத்து வந்தான்
  rationale: இராணுவச் சூழலில் இந்தச் சொற்றொடர் ஒரு நகருக்கு எதிராக முன்னேறுவதைக் குறிக்கிறது. ‘படையெடுத்து வந்தான்’ பகைமைச் சூழலையும் திசைநோக்கையும் இயல்பான தமிழில் தெரிவிக்கிறது; நகரம் தாக்கப்பட்டுவிட்டதாக அளவுக்கு மீறி கூறுவதில்லை.
- source_word: שושק
  choice: சீஷாக்
  rationale: எபிரெய வடிவத்தை அடிப்படையாகக் கொண்ட, தமிழில் பயன்படும் வேதாகமப் பெயர்ப்பெயர்ப்பு; எகிப்திய வரலாற்றுப் பெயரான ‘ஷோஷெங்க்’ இங்கு இறக்குமதி செய்யப்படவில்லை.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: எகிப்தின் அரசனான
  rationale: சீஷாக்கின் பதவியையும் நாட்டையும் குறிக்கும் இணைப்பை இயல்பான தமிழ் பெயரடைக் கட்டமைப்பில் தருகிறது.
- source_word: עַל יְרוּשָׁלִָם
  choice: எருசலேமுக்கு எதிராக
  rationale: இராணுவப் பயன்பாட்டில் עַל பகைமையான முன்னேற்றத்தைக் குறிக்கிறது; ‘எதிராக’ அந்த நுணுக்கத்தைத் தெளிவாகக் காக்கிறது.
