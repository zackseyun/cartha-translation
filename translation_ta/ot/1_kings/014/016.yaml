  text: And he will give up Israel because of the sins of Jeroboam[a], which he committed and by which he caused Israel to sin.
translation:
  language: ta
  text: யெரொபெயாம் செய்ததும், இஸ்ரவேலைப் பாவம் செய்யவைத்ததுமான பாவங்களின் காரணமாக அவர் இஸ்ரவேலை ஒப்புக்கொடுப்பார்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இஸ்ரவேலைக் கைவிடுவார்.’ எபிரெய வினைச்சொல்லின் நேரடிப் பொருள் ‘கொடுப்பார்’; இங்கு தீர்ப்பின் சூழலில், ஒரு மக்களைப் பேரழிவுக்கோ எதிரிகளின் கையிலோ ஒப்புக்கொடுப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִתֵּן
  choice: அவர் இஸ்ரவேலைக் கைவிட்டுவிடுவார்
  rationale: נתן என்பதன் அடிப்படைப் பொருள் ‘கொடு.’ இங்கு தண்டனைத் தீர்ப்பின் சூழலில், இஸ்ரவேலைப் பேரழிவுக்கு ஒப்புக்கொடுப்பதையோ கைவிடுவதையோ குறிக்கிறது. யாரிடம் ஒப்புக்கொடுப்பார் என்பதை வசனம் குறிப்பிடாததால், ‘கைவிட்டுவிடுவார்’ என்பது அதைச் சேர்க்காமல் தீர்ப்பின் வலிமையை வெளிப்படுத்துகிறது.
- source_word: אֶת יִשְׂרָאֵל
  choice: இஸ்ரவேலை
  rationale: நேர்செயப்படுபொருள் குறியீட்டுடன் வரும் நாட்டுப் பெயர்; இங்கு வடக்கு அரசையும் அதன் மக்களையும் கூட்டாகக் குறிக்கிறது.
- source_word: בִּגְלַל
  choice: காரணமாக
  rationale: இச்சொல் காரணத்தைச் சுட்டுகிறது; நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: חַטֹּאות יָרָבְעָם
  choice: யெரொபெயாம் செய்த பாவங்கள்
  rationale: பன்மையான ‘பாவங்கள்’ என்பதையும் அவற்றுக்கான யெரொபெயாமின் தனிப்பட்ட பொறுப்பையும் தெளிவாகக் காட்டுகிறது.
- source_word: אֲשֶׁר חָטָא
  choice: அவன் தானும் பாவம் செய்து
  rationale: யெரொபெயாம் தானே பாவம் செய்தான் என்ற முதல் குற்றப்பொறுப்பைப் பாதுகாக்கிறது; தமிழ் நடையில் ‘தானும்’ என்பது அடுத்த causative கூறுடன் இயல்பான இணைப்பை உருவாக்குகிறது.
- source_word: וַאֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: இஸ்ரவேலையும் பாவம் செய்யவைத்தான்
  rationale: חטא என்பதன் ஹிஃபில் வடிவிலுள்ள காரணவினைப் பொருளை நேரடியாகப் பாதுகாத்து, யெரொபெயாம் இஸ்ரவேலைப் பாவத்திற்கு வழிநடத்திய பொறுப்பைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: இறைத்தீர்ப்பின் செயல்பாடு
  choice: அவர் இஸ்ரவேலைக் கைவிட்டுவிடுவார்
  alternative: அவர் இஸ்ரவேலை ஒப்புக்கொடுத்துவிடுவார்
  rationale: எபிரெய உரை தீர்ப்பை அறிவித்தாலும், இந்தக் கூறில் அழிவை நிகழ்த்தும் மனித முகவரையோ எதிரியையோ குறிப்பிடவில்லை. தேர்ந்த வாசகம் அந்த இடைவெளியை நிரப்பாமல் தீர்ப்பின் தீவிரத்தைத் தக்கவைக்கிறது.
- issue: யெரொபெயாமின் சொந்தப் பாவமும் பிறரைப் பாவம் செய்யவைத்த பொறுப்பும்
  choice: அவன் தானும் பாவம் செய்து, இஸ்ரவேலையும் பாவம் செய்யவைத்தான்
  alternative: அவன் செய்ததும் இஸ்ரவேலைச் செய்யவைத்ததுமான பாவங்கள்
  rationale: மூல உரையில் உள்ள சாதாரண வினையையும் காரணவினையையும் வேறுபடுத்திக் காட்டி, தனிப்பட்ட குற்றத்தையும் நாட்டின்மீது செலுத்திய தீய செல்வாக்கையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்கு எளிதில் புரியும் அதேவேளையில் தீர்க்கதரிசனத் தீர்ப்பின் கண்ணியமும் தீவிரமும் நிலைக்குமாறு வடிவமைக்கப்பட்டது. நீண்ட எபிரெய தொடர்புச் சொற்றொடர் தமிழில் இரண்டு சமநிலை கூறுகளாகப் பிரிக்கப்பட்டுள்ளது; பொருள் விரிவாக்கப்படவில்லை.
