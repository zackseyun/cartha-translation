source:
  edition: WLC
  text: וְ/יֶ֛תֶר דִּבְרֵ֥י רְחַבְעָ֖ם וְ/כָל אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֹא הֵ֣מָּה כְתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/029.yaml
  text: The rest of the acts of Rehoboam[a], and all that he did, are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: ta
  text: ரெகொபெயாமின் மற்ற செயல்களும், அவன் செய்த அனைத்தும், யூதாவின் அரசர்களுடைய நாளேட்டுப் புத்தகத்தில்[a] எழுதப்பட்டிருக்கின்றன அல்லவா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘யூதாவின் அரசர்களுடைய வரலாற்றுப் பதிவுப் புத்தகம்.’ இங்கு ‘நாளேடு’ என மொழிபெயர்க்கப்பட்டுள்ள எபிரேயச் சொற்றொடர், அரச நிகழ்வுகள் பதிவு செய்யப்பட்ட ஆவணத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי רְחַבְעָם
  choice: ரெகொபெயாமின் மற்ற செயல்களும்
  rationale: יֶתֶר என்பது மீதியையோ மற்றவற்றையோ குறிக்கிறது; அரச வரலாற்றுச் சூத்திரத்தில் דִּבְרֵי என்பது சொற்களை மட்டும் அல்லாமல் அரசனின் செயல்கள் அல்லது விவகாரங்களைக் குறிக்கிறது. தொடக்க וְ- தமிழில் இயல்பாக இணைப்பு விகுதி ‘-உம்’ மூலம் வெளிப்படுகிறது.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: அவன் செய்த அனைத்தும்
  rationale: עשה என்பதன் பரந்த பொருளை மதிப்பீடு அல்லது சாதனை என்ற கூடுதல் கருத்தின்றி நேரடியாகப் பாதுகாக்கிறது.
- source_word: הֲלֹא הֵמָּה כְתוּבִים
  choice: எழுதப்பட்டிருக்கின்றன அல்லவா?
  rationale: உறுதிப்படுத்தும் பதிலை எதிர்பார்க்கும் எபிரேய எதிர்மறை வினாவையும் பன்மை அமைப்பையும் தக்கவைக்கிறது.
- source_word: עַל סֵפֶר
  choice: புத்தகத்தில்
  rationale: சொற்படியாக ‘புத்தகத்தின்/சுருளின் மேல்’ என்றாலும், ஓர் ஆவணத்தில் பதிவு செய்யப்பட்டதைக் குறிக்க நவீன தமிழில் ‘புத்தகத்தில்’ இயல்பானது.
- source_word: דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: யூதாவின் அரசர்களுடைய நாளேட்டுப் புத்தகம்
  rationale: இச்சூழலில் דִּבְרֵי הַיָּמִים அரச நிகழ்வுகளின் தொடர்ச்சியான பதிவை, அதாவது நாளேட்டை, குறிக்கிறது; לְ- ஆவணத் தலைப்பில் அரசர்களோடு உள்ள உரிமை/தொடர்பைச் சுட்டுகிறது.
