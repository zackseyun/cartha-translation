translation_notes:
  register: நவீன நிலையான தமிழில், அரச வரலாற்றுப் பதிவு நடையைக் காக்கும் வகையில் கண்ணியமானதும் எளிதில் புரியக்கூடியதுமான சொற்கள் பயன்படுத்தப்பட்டுள்ளன. வசனத் தொடக்கத்தில் எபிரேய וְ-க்கு தேவையற்ற காலச்சுட்டுச் சொல்லைச் சேர்க்காமல், தமிழ் இணைப்பு விகுதி மூலம் அதன் தொடர்பு வெளிப்படுத்தப்பட்டுள்ளது.
