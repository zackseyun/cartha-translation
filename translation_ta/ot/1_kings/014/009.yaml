  register: நவீனத் தரத் தமிழில் இயல்பானதும் கண்ணியமானதுமான நடை. ‘வார்ப்புச் சிலைகள்’ உற்பத்தி முறையைத் துல்லியமாகக் காட்டுகிறது; ‘முதுகுக்குப் பின்னால் எறிந்துவிட்டாய்’ என்ற உருவகம் திட்டமிட்டு அப்படியே பாதுகாக்கப்பட்டுள்ளது.
