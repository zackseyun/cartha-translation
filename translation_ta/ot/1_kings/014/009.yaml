base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/009.yaml
  text: and have done evil above all who were before you. You went and made for yourself other gods and molten images to provoke me to anger[a], and you have cast me behind your back.
translation:
  language: ta
  text: உனக்கு முன் இருந்த அனைவரையும்விட நீ அதிகத் தீமை செய்தாய். நீ போய், எனக்குக் கோபமூட்டுவதற்காக உனக்கென வேறு தெய்வங்களையும் வார்ப்புச் சிலைகளையும்[a] உண்டாக்கினாய்; என்னையோ உன் முதுகுக்குப் பின்னால் எறிந்துவிட்டாய்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உருக்கி வார்த்த சிலைகள்’; எபிரெயச் சொல் வார்ப்புமுறையில் செய்யப்பட்ட, பெரும்பாலும் உலோகத்தாலான வழிபாட்டுப் படிமங்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּרַע לַעֲשׂוֹת מִכֹּל
  choice: அனைவரையும்விட நீ அதிகத் தீமை செய்தாய்
  rationale: רעה + לעשות என்ற சொற்றொடர் ‘தீமை செய்தல்’ எனப் பொருள்படுகிறது; מִכֹּל வெளிப்படுத்தும் ஒப்பீட்டை ‘அனைவரையும்விட அதிக’ என்று இயல்பாகத் தக்கவைக்கிறது.
- source_word: אֲשֶׁר הָיוּ לְפָנֶיךָ
  choice: உனக்கு முன் இருந்த அனைவரையும்
  rationale: לְפָנֶיךָ இங்கு இடத்தைக் காட்டாமல் கால வரிசையைக் காட்டுகிறது; ஆகவே ‘உனக்கு முன் இருந்த’ என்பது இயல்பான நேரடிப் பெயர்ப்பு.
- source_word: וַתֵּלֶךְ
  choice: நீ போய்
  rationale: அடுத்த செயலை வலியுறுத்தி அறிமுகப்படுத்தும் எபிரெய தொடர் நடையைத் தமிழில் ‘நீ போய்’ எனப் பாதுகாக்கிறது.
- source_word: וַתַּעֲשֶׂה לְּךָ
  choice: உனக்கென ... உண்டாக்கினாய்
  rationale: לְּךָ என்பதிலுள்ள தனக்காகச் செய்துகொண்ட பயனிலைப் பொருளை ‘உனக்கென’ வெளிப்படுத்துகிறது.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: வேறு தெய்வங்கள்
  rationale: உடன்படிக்கைச் சூழலில் தடைசெய்யப்பட்ட பிற தெய்வங்களைக் குறிக்கும் நேரடியான சொற்றொடர்; ‘அந்நிய’ என்ற மூலத்தில் வெளிப்படாத நுண்பொருளைச் சேர்க்கவில்லை.
- source_word: מַסֵּכוֹת
  choice: வார்ப்புச் சிலைகள்
  rationale: உலோகத்தை உருக்கி வார்த்து உருவாக்கப்பட்ட வழிபாட்டுப் படிமங்களைச் சுட்டும் உற்பத்தி முறையைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: לְהַכְעִיסֵנִי
  choice: எனக்குக் கோபமூட்டுவதற்காக
  rationale: כעס என்பதன் ஹிஃபில் வடிவிலுள்ள காரணவினை வலிமையையும் முதல் நபர் பொருளையும் வெளிப்படுத்துகிறது.
- source_word: וְאֹתִי הִשְׁלַכְתָּ אַחֲרֵי גַוֶּךָ
  choice: என்னையோ உன் முதுகுக்குப் பின்னால் எறிந்துவிட்டாய்
  rationale: கடவுளை அவமதித்துப் புறக்கணித்ததைச் சித்தரிக்கும் வலுவான உடல்சார் உருவகத்தை அருவமான விளக்கமாக மாற்றாமல் தக்கவைக்கிறது; ‘என்னையோ’ என்ற அமைப்பு எதிர்மறை முரணை இயல்பாகக் காட்டுகிறது.
theological_decisions:
- issue: சிலைவழிபாட்டின் உடன்படிக்கை மீறலை மென்மைப்படுத்தாமல் மொழிபெயர்த்தல்
  choice: வேறு தெய்வங்களையும் வார்ப்புச் சிலைகளையும்
  alternative: அந்நிய தெய்வங்களையும் விக்கிரகங்களையும்
  rationale: ‘வேறு தெய்வங்கள்’ என்ற இறையியல் வகையையும் வார்க்கப்பட்ட வழிபாட்டுப் பொருட்கள் என்ற காட்சிப்பூர்வ தன்மையையும் தனித்தனியாகப் பாதுகாக்கிறது; பொதுவான ‘விக்கிரகங்கள்’ என்பதில் இரண்டையும் ஒன்றாக்கவில்லை.
- issue: கடவுளை நிராகரிக்கும் உருவகத்தின் வலிமையைப் பாதுகாத்தல்
  choice: என்னையோ உன் முதுகுக்குப் பின்னால் எறிந்துவிட்டாய்
  alternative: என்னைப் புறக்கணித்துவிட்டாய்
  rationale: மூலத்தின் கடுமையான உருவகத்தை விளக்கவுரையாகச் சுருக்காமல், அதன் அவமதிப்பும் உறவுசார் பதற்றமும் தொடருமாறு மொழிபெயர்க்கிறது.
