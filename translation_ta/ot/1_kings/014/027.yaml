base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/027.yaml
  text: So King Rehoboam made bronze shields in their place and committed them into the hand of the commanders of the runners[b][a], who guarded the entrance of the king’s house.
translation:
  language: ta
  text: அப்போது அரசன் ரெகொபெயாம் அவற்றுக்குப் பதிலாக வெண்கலக் கேடயங்களைச் செய்து, அரசனின் மாளிகையின் நுழைவாயிலைக்[b] காவல் காத்த ஓட்டக்காரர்களின் தலைவர்களிடம்[a] அவற்றை ஒப்படைத்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதைப் பொருள் விளக்கமாக, ‘மெய்க்காவலர் படையின் தலைவர்கள்’ என்றும் மொழிபெயர்க்கலாம். எபிரேயத்தில் சொல்லுக்குச் சொல் ‘ஓட்டக்காரர்களின் தலைவர்கள்’; இவர்கள் அரச மெய்க்காவலர் அல்லது தூதர் குழுவாக இருந்திருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரேயத்தில் ‘அரசனின் வீடு’ என்று உள்ளது; அது அரச மாளிகையைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: செய்து
  rationale: עשה என்ற வினை இச்சூழலில் பொருட்களைச் செய்தல் அல்லது உருவாக்குதல் என்று நேரடியாகப் பொருள்படுகிறது; இயல்பான தமிழில் ‘செய்து’ பொருத்தமானது.
- source_word: הַמֶּלֶךְ רְחַבְעָם
  choice: ரெகொபெயாம் அரசன்
  rationale: எபிரேய வரிசையையும் இயல்பான தமிழ் வேதாகம நடையையும் இணைக்கும் தலைப்பு-பெயர் அமைப்பு.
- source_word: תַּחְתָּם
  choice: அவற்றுக்குப் பதிலாக
  rationale: முந்தைய வசனத்தில் எடுத்துச் செல்லப்பட்ட பொற்கேடயங்களைப் பிரதிப்பெயர் சுட்டுகிறது; மாற்றீட்டைக் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: מָגִנֵּי נְחֹשֶׁת
  choice: வெண்கலக் கேடயங்கள்
  rationale: נְחֹשֶׁת செம்பையோ வெண்கலத்தையோ குறிக்கலாம்; பழங்கால உலோகப் பொருட்கள் என்ற இச்சூழலில் ‘வெண்கலம்’ ஏற்ற பொதுவான தெரிவாகும்.
- source_word: וְהִפְקִיד עַל יַד
  choice: ஒப்படைத்தான்
  rationale: ஒருவரின் பொறுப்பில் வைப்பது என்ற இணைந்த கருத்தை இயல்பான தமிழில் ‘ஒப்படைத்தான்’ துல்லியமாகத் தருகிறது.
- source_word: שָׂרֵי הָרָצִים
  choice: ஓட்டக்காரர்களின் தலைவர்கள்
  rationale: மூலத்தின் ‘ஓடுகிறவர்கள்’ என்ற சொற்பொருளை மறைக்காமல் பாதுகாக்கிறது; இவர்கள் அரச மெய்க்காவலர் அல்லது தூதர் படையினராக இருந்திருக்கலாம் என்பதைக் குறிப்பில் விளக்குகிறது.
- source_word: הַשֹּׁמְרִים
  choice: காவல்காத்த
  rationale: தொடர்ந்து மேற்கொண்ட காவல் பணியை இயல்பான தமிழ் பெயரெச்ச வடிவில் வெளிப்படுத்துகிறது.
- source_word: פֶּתַח בֵּית הַמֶּלֶךְ
  choice: அரச மாளிகையின் நுழைவாயில்
  rationale: ‘அரசனின் வீடு’ என்பது இச்சூழலில் அரண்மனை அல்லது அரச மாளிகையைக் குறிக்கிறது; வாசகருக்கு உடனே புரியும் பொருளைத் தருகிறது.
