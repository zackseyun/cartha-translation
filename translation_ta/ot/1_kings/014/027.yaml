translation_notes:
  register: நவீனத் தரத் தமிழில், கண்ணியமானதும் பொதுவாசகருக்கு எளிதில் புரியக்கூடியதுமான நடை. மூலத்தில் உள்ள ‘ஓட்டக்காரர்கள்’ என்ற பணிப்பெயர் முதன்மை உரையில் பாதுகாக்கப்பட்டு, அதன் சாத்தியமான அரச மெய்க்காவல்/தூதர் பணி அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
