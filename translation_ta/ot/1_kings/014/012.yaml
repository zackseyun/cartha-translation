source:
  edition: WLC
  text: וְ/אַ֥תְּ ק֖וּמִי לְכִ֣י לְ/בֵיתֵ֑/ךְ בְּ/בֹאָ֥ה רַגְלַ֛יִ/ךְ הָ/עִ֖ירָ/ה וּ/מֵ֥ת הַ/יָּֽלֶד׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/012.yaml
  text: But as for you[a], arise, go to your house. When your feet enter the city, the child will die.
translation:
  language: ta
  text: ஆனால் நீ எழுந்து உன் வீட்டுக்குப் போ. உன் கால்கள் நகருக்குள் நுழையும்போது[a], குழந்தை இறந்துவிடும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேர்ச்சொல்லாக, “உன் கால்கள் நகருக்குள் நுழையும்போது.” வருகையின் தருணத்தைக் குறிக்க எபிரெயம் “உன் கால்கள்” என்ற மரபுத்தொடரைப் பயன்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתְּ
  choice: ஆனால் நீ
  rationale: இணைப்புச்சொல்லும் தனிப்பட்ட இரண்டாம் நபர் பெண்பால் பதிலிடுபெயரும் சேர்ந்து, அந்தப் பெண்ணை வலியுறுத்தி அவளிடம் கவனத்தைத் திருப்புகின்றன. ‘ஆனால் நீ’ இந்த மாறுதலையும் வலியுறுத்தலையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ק֖וּמִי
  choice: எழுந்து
  rationale: קום என்பதன் பெண்பால் ஒருமை கட்டளை வடிவம். தொடர்ச்சியாக வரும் ‘போ’ என்பதுடன் தமிழில் இயல்பாக அமைய ‘எழுந்து’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: לְכִ֣י
  choice: போ
  rationale: הלך என்பதன் பெண்பால் ஒருமை கட்டளை வடிவம். எளிய, நேரடியான கட்டளையை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: לְ/בֵיתֵ֑/ךְ
  choice: உன் வீட்டுக்குப்
  rationale: בַּיִת இங்கு செல்லவேண்டிய இடமாகிய வீட்டைக் குறிக்கிறது. உடைமை மற்றும் திசைப் பொருளை ‘உன் வீட்டுக்குப்’ தெளிவாகக் கொண்டுவருகிறது.
- source_word: בְּ/בֹאָ֥ה
  choice: நுழையும்போது
  rationale: ב முன்சொல்லுடன் வரும் בוא வினையின் infinitive construct காலத்தைக் குறிக்கும் உட்பிரிவை உருவாக்குகிறது. நகருக்குள் வரும் தருணத்தை ‘நுழையும்போது’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: רַגְלַ֛יִ/ךְ
  choice: உன் கால்கள்
  rationale: எபிரெயம் வருகையைக் குறிக்கும் மரபுத்தொடராக ‘உன் கால்கள்’ என்று வெளிப்படையாகக் கூறுகிறது. மூலத்தின் உடல்-உறுப்பு உருவகத்தைத் தக்கவைக்கப்பட்டுள்ளது.
- source_word: הָ/עִ֖ירָ/ה
  choice: நகருக்குள்
  rationale: திசையைக் குறிக்கும் இறுதி உருபு நகரை நோக்கிய அல்லது நகருக்குள் நிகழும் இயக்கத்தைச் சுட்டுகிறது. ‘நுழை’ என்பதுடன் ‘நகருக்குள்’ தமிழில் தெளிவாக அமைகிறது.
- source_word: וּ/מֵ֥ת
  choice: இறந்துவிடும்
  rationale: தீர்க்கதரிசனச் சூழலில் இணைப்புடன் வரும் Qal perfect எதிர்காலத்தில் உறுதியாக நிகழும் விளைவைக் குறிக்கிறது. ‘இறந்துவிடும்’ அந்த முடிவையும் உறுதியையும் இயல்பாகத் தருகிறது.
- source_word: הַ/יָּֽלֶד
  choice: குழந்தை
  rationale: יֶלֶד என்பதற்கு குழந்தை அல்லது சிறுவன் என்று பொருள் வரலாம். இங்கு பாலினத்தை வலியுறுத்தாமல் குறிப்பிட்ட குழந்தையைச் சுட்டுவதால் ‘குழந்தை’ பொருத்தமானது.
