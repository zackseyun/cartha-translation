base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/026.yaml
  text: He took the treasures of the house of Yahweh and the treasures of the king’s house; he took everything[a]. He also took all the gold shields that Solomon had made.
translation:
  language: ta
  text: அவன் யாவேயின் ஆலயத்தின்[a] செல்வங்களையும் அரசனின் அரண்மனையின் செல்வங்களையும் எடுத்தான்; எல்லாவற்றையும் எடுத்தான். சாலொமோன் செய்திருந்த தங்கக் கேடயங்கள் அனைத்தையும் அவன் எடுத்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரேயம்: “யாவேயின் வீடு”; அதாவது, ஆலயம்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח / לָקָח
  choice: எடுத்துக்கொண்டான்
  rationale: לקח என்பதன் அடிப்படைப் பொருளான ‘எடுத்தல்’ என்பதையும், இச்சூழலில் செல்வங்களைத் தன்வசப்படுத்தியதையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘கொள்ளையடித்தான்’ என்ற கூடுதல் தீவிரத்தை மூலச்சொல்லுக்குள் திணிக்கவில்லை.
- source_word: אֹצְרוֹת
  choice: செல்வங்கள்
  rationale: இங்கு எடுத்துச் செல்லப்பட்டவை கருவூலக் கட்டடங்கள் அல்ல, அவற்றிலிருந்த மதிப்புமிக்க பொருட்கள். ஆகவே ‘செல்வங்கள்’ சூழலுக்குப் பொருத்தமானது.
- source_word: בֵּית יְהוָה
  choice: யாவேயின் ஆலயம்
  rationale: எழுத்துப்படி ‘யாவேயின் வீடு’ என்றாலும், இச்சூழலில் அது ஆலயத்தைக் குறிக்கிறது. ‘ஆலயம்’ நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது; יְהוָה என்பது ‘யாவே’ எனப் பெயராகவே தரப்பட்டுள்ளது.
- source_word: בֵּית הַמֶּלֶךְ
  choice: அரசனின் அரண்மனை
  rationale: எழுத்துப்படி ‘அரசனின் வீடு’; இங்கு அரச இருப்பிடத்தையும் அதன் கருவூலத்தையும் குறிக்கும் என்பதால் ‘அரண்மனை’ தெளிவான சூழல்சார் மொழிபெயர்ப்பு.
- source_word: וְאֶת הַכֹּל לָקָח
  choice: எல்லாவற்றையும் எடுத்துக்கொண்டான்
  rationale: முழுமையாக எடுத்துச் சென்றதை வலியுறுத்தும் எபிரேயச் சுருக்கக் கூற்றின் மொத்தப்படுத்தும் வலிமையையும் வினைச்சொல் மீளுரைப்பையும் காக்கிறது.
- source_word: מָגִנֵּי הַזָּהָב
  choice: தங்கக் கேடயங்கள்
  rationale: ‘தங்கத்தால் ஆன கேடயங்கள்’ என்பதன் இயல்பான, சுருக்கமான நவீனத் தமிழ் வடிவம்.
- source_word: אֲשֶׁר עָשָׂה שְׁלֹמֹה
  choice: சாலொமோன் செய்திருந்த
  rationale: முன்னதாகச் சாலொமோன் செய்த கேடயங்களையே இப்போது எடுத்துக்கொண்டான் என்ற காலத் தொடர்பை ‘செய்திருந்த’ தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயரான நான்கு எழுத்துப் பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்த்து வழங்குவது மூலத்தின் வேறுபாட்டைக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குத் தெளிவான கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரேயத்தில் வரும் ‘எடுத்தான் ... எல்லாவற்றையும் எடுத்தான் ... எடுத்தான்’ என்ற மீளுரைப்பும் வலியுறுத்தலும் தமிழில் இயன்றவரை காக்கப்பட்டுள்ளன.
