base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/019.yaml
  text: The rest of the acts of Jeroboam[a], how he fought and how he reigned, behold[c][b], they are written in the Book of the Chronicles of the Kings of Israel.
translation:
  language: ta
  text: யெரொபெயாமின் ஏனைய செயல்கள்[a]—அவர் எவ்வாறு போர் புரிந்தார், எவ்வாறு ஆட்சி செய்தார் என்பவை—இதோ[b], இஸ்ரவேல் அரசர்களின் நாள்குறிப்பு நூலில்[c] எழுதப்பட்டுள்ளன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொற்சொல்லாக, ‘யெரொபெயாமின் ஏனைய காரியங்கள்.’ அரசர்களின் ஆட்சிச் சுருக்கங்களில் இந்தச் சொற்றொடர் அவர்களுடைய செயல்களையும் ஆட்சிக்கால நிகழ்வுகளையும் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், ‘இதோ, அவை எழுதப்பட்டுள்ளன.’ ‘இதோ’ என்பது எழுதப்பட்ட பதிவின் பக்கம் கவனத்தை ஈர்க்கும் சொல்.
    reason: lexical_alternative
  - marker: c
    text: இது அதிகாரப்பூர்வ அரச நாளேடு அல்லது வரலாற்றுப் பதிவைக் குறிக்கிறது; வேதாகமத்தின் 1–2 நாளாகமம் நூல்களைக் குறிக்கவில்லை.
    reason: cross_reference
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יָרָבְעָם
  choice: யெரொபெயாமின் மற்ற செயல்கள்
  rationale: דִּבְרֵי என்பதற்கு சொற்சொல்லாக ‘விஷயங்கள்’ என்று பொருள் கொள்ளலாம்; ஆனால் அரசரின் ஆட்சிச் சுருக்கத்தில் இது அவரது செயல்களையும் ஆட்சிக்கால நிகழ்வுகளையும் குறிக்கிறது. ‘மற்ற செயல்கள்’ என்பது அந்தச் சூழலுக்கேற்ற இயல்பான தமிழ்.
- source_word: אֲשֶׁר נִלְחַם
  choice: அவர் எவ்வாறு போர் புரிந்தார்
  rationale: נלחם என்பது ‘போரிடுதல்/போர் புரிதல்’ என்று பொருள். אֲשֶׁר இங்கு பதிவில் அடங்கியவற்றை விளக்குவதால், ‘எவ்வாறு’ என்ற அமைப்பு இயல்பாக உள்ளது; கூடுதல் விவரத்தைச் சேர்ப்பதில்லை.
- source_word: וַאֲשֶׁר מָלָךְ
  choice: எவ்வாறு ஆட்சி செய்தார்
  rationale: מלך என்பதன் பொருள் ‘அரசராக இருத்தல், ஆட்சி செய்தல்.’ முந்தைய தொடருக்கு இணையாக ‘எவ்வாறு ஆட்சி செய்தார்’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: הִנָּם
  choice: இதோ
  rationale: இந்த முன்னிலைப்படுத்தும் இடைச்சொல் அடுத்து வரும் எழுத்துப்பதிவை வாசகரின் கவனத்துக்குக் கொண்டுவருகிறது. ‘இதோ’ அதன் உரையாடல் வலிமையைச் சுருக்கமாகத் தக்கவைக்கிறது.
- source_word: כְּתוּבִים
  choice: எழுதப்பட்டுள்ளன
  rationale: செயப்பாட்டு வினையெச்சத்தின் ‘எழுதப்பட்ட’ என்ற நேரடியான பொருளையும், பதிவு இன்றும் நூலில் இருப்பதைக் காட்டும் நிலையையும் தக்கவைக்கிறது.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים
  choice: நாள்குறிப்பு நூலில்
  rationale: சொற்சொல்லாக ‘நாட்களின் நிகழ்வுகளின் நூல்’ என்றாலும், இச்சூழலில் அரசருக்குரிய அதிகாரப்பூர்வ வரலாற்றுப் பதிவைக் குறிக்கிறது. ‘நாள்குறிப்பு நூல்’ என்பது இயல்பானதும் குறிப்பிட்ட வேதாகம நாளாகம நூலுடன் குழப்பத்தைக் குறைப்பதும் ஆகும்.
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் அரசர்களின்
  rationale: לְ இங்கு அந்த அரசர்களுக்குரிய அரச வரலாற்றுப் பதிவைக் குறிக்கும் உறவைக் காட்டுகிறது; தமிழில் உடைமை வேற்றுமை இயல்பானது.
