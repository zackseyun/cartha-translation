  rationale: எபிரெயச் சூழல் இது இஸ்ரவேல் அரசர்களைப் பற்றிய அரச ஆவணம் அல்லது வரலாற்றுப் பதிவு என்பதைக் காட்டுகிறது; வேதாகம 1–2 நாளாகமத்தை இது குறிக்கவில்லை.
