  text: וּ/רְחַבְעָם֙ בֶּן שְׁלֹמֹ֔ה מָלַ֖ךְ בִּֽ/יהוּדָ֑ה בֶּן אַרְבָּעִ֣ים וְ/אַחַ֣ת שָׁנָה֩ רְחַבְעָ֨ם בְּ/מָלְכ֜/וֹ וּֽ/שֲׁבַ֨ע עֶשְׂרֵ֥ה שָׁנָ֣ה מָלַ֣ךְ בִּ/ירוּשָׁלִַ֗ם הָ֠/עִיר אֲשֶׁר בָּחַ֨ר יְהוָ֜ה לָ/שׂ֨וּם אֶת שְׁמ֥/וֹ שָׁם֙ מִ/כֹּל֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל וְ/שֵׁ֣ם אִמּ֔/וֹ נַעֲמָ֖ה הָ/עַמֹּנִֽית־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/021.yaml
  text: Rehoboam the son of Solomon reigned in Judah[a]. Rehoboam was forty-one years old when he became king, and he reigned seventeen years in Jerusalem, the city that Yahweh had chosen from all the tribes of Israel to put his name there[b]. And his mother’s name was Naamah the Ammonite woman.
translation:
  language: ta
  text: சாலொமோனின் மகன் ரெகொபெயாம் யூதாவில் அரசாண்டான்[a]. ரெகொபெயாம் அரசனானபோது அவனுக்கு நாற்பத்தொரு வயது. இஸ்ரவேலின் எல்லாக் கோத்திரங்களிலிருந்தும் தமது பெயரை அங்கே வைப்பதற்காக யாவே தேர்ந்தெடுத்த நகரமான எருசலேமில் அவன் பதினேழு ஆண்டுகள் அரசாண்டான்[b]. அவனுடைய தாயின் பெயர் நாமா; அவள் அம்மோனியப் பெண்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யூதாவின்மேல் அரசாண்டான்.”
    reason: lexical_alternative
  - marker: b
    text: “தமது பெயரை அங்கே வைக்க” என்பது, யாவேயின் சிறப்புப் பிரசன்னத்துடனும் அவருக்குரிய வழிபாட்டுடனும் தொடர்புடைய இடத்தைக் குறிக்கும் எபிரெய உடன்படிக்கைச் சொற்றொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: מָלַךְ
  choice: அரசாண்டான்
  rationale: அரசனாக ஆட்சி செய்ததைக் குறிக்கும் வினை; இரு இடங்களிலும் இயல்பான, துல்லியமான தமிழாக உள்ளது.
- source_word: בִּיהוּדָה
  choice: யூதாவில்
  rationale: ב முன்னிடைச்சொல்லின் அடிப்படை இடப்பொருளைத் தக்கவைக்கிறது; அரசாட்சிச் சூழலில் ‘யூதாவின்மேல்’ என்பதும் சாத்தியம்.
- source_word: בְּמָלְכוֹ
  choice: அரசனானபோது
  rationale: அரியணை ஏற்ற காலத்தைச் சுட்டும் முன்னிடைச்சொல் மற்றும் வினைபெயர் அமைப்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பட்டத்தால் மாற்றாமல், எபிரெய தனிப்பெயரான நான்கு மெய்யெழுத்துப் பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: לָשׂוּם אֶת־שְׁמוֹ שָׁם
  choice: தமது பெயரை அங்கே வைப்பதற்காக
  rationale: எபிரெய மூலத்தின் ‘பெயரை அங்கே வைக்க’ என்ற உடன்படிக்கை சார்ந்த சொற்றொடரை விரிவான விளக்கமாக மாற்றாமல் தக்கவைக்கிறது.
- source_word: מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் எல்லாக் கோத்திரங்களிலிருந்தும்
  rationale: கோத்திரங்களின் நடுவிலிருந்து நிகழ்ந்த தேர்வைக் குறிக்கும் מִן என்பதன் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: הָעַמֹּנִית
  choice: அம்மோனியப் பெண்
  rationale: பெண்பால் இனப்பெயரை இன்றைய வாசகர்களுக்குத் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: யெகோவா
  rationale: மூலத்தில் பட்டம் அல்ல, இறைவனின் தனிப்பெயர் நேரடியாக உள்ளது; ஆகவே அதைத் தமிழில் ஒலிபெயர்த்து வழங்குகிறது.
- issue: ‘தமது பெயரை அங்கே வைக்க’ என்ற சொற்றொடர்
  choice: மூல உருவகத்தை அப்படியே தக்கவைத்தல்
  alternative: தமது பிரசன்னத்தையும் வழிபாட்டையும் அங்கே நிலைநாட்ட
  rationale: இது இறைவனின் சிறப்புப் பிரசன்னத்தையும் வழிபாட்டு இடத்தையும் குறிக்கும் உடன்படிக்கை மொழி; ஆனால் விளக்கத்தை முதன்மை உரைக்குள் சேர்ப்பது மூலத்தின் செறிவையும் மறைமுகத் தன்மையையும் தீர்த்துவிடும்.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட வரலாற்று நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. அரசரைக் குறிக்க ஒருமை இயல்பான வடிவமும், யாவேயைக் குறிக்க மரியாதைப் பன்மை வடிவமும் பயன்படுத்தப்பட்டுள்ளன; மூலத்தின் ‘பெயரை வைக்க’ என்ற உருவகம் விளக்கவுரையால் மாற்றப்படவில்லை.
