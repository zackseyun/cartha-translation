  source_fidelity: 'மூல எபிரெயத்தின் முக்கியக் கூறுகள் அனைத்தும் துல்லியமாகத் தரப்பட்டுள்ளன: ரெகொபெயாமின் வம்ச அடையாளம், யூதாவில் அரசாண்டமை, அரசனானபோதைய வயது, எருசலேமில் பதினேழு ஆண்டுகள் ஆட்சி, இஸ்ரவேலின் கோத்திரங்களிலிருந்து யாவே தேர்ந்தெடுத்த நகரம், ‘தமது பெயரை அங்கே வைப்பதற்காக’ என்ற உருவகத் தொடர், மற்றும் நாமா அம்மோனியப் பெண் என்பதும் பாதுகாக்கப்பட்டுள்ளன. வாக்கியப் பிரிப்பு மூலத்தின் பொருளையோ காலவரிசையையோ மாற்றவில்லை.'
