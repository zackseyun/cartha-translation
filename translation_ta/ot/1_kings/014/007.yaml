  text: לְכִ֞י אִמְרִ֣י לְ/יָרָבְעָ֗ם כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל יַ֛עַן אֲשֶׁ֥ר הֲרִימֹתִ֖י/ךָ מִ/תּ֣וֹךְ הָ/עָ֑ם וָ/אֶתֶּנְ/ךָ֣ נָגִ֔יד עַ֖ל עַמִּ֥/י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/007.yaml
  text: 'Go and say to Jeroboam[a], ‘Thus says Yahweh[b], the God of Israel: Because I raised you up from among the people and made you ruler over my people Israel,’'
translation:
  language: ta
  text: 'நீ போய் யெரொபெயாமிடம் சொல்: ‘இஸ்ரவேலின் கடவுளாகிய யாவே இவ்வாறு கூறுகிறார்: ஏனெனில், நான் உன்னை மக்களிலிருந்து உயர்த்தி[a], என் மக்களாகிய இஸ்ரவேலின்மேல் உன்னை ஆட்சியாளனாக நியமித்தேன்[b],’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன்னை மேன்மைப்படுத்தி.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உன்னைத் தலைவனாக வைத்தேன்.” எபிரெயத்தில் சொல்லுக்கு சொல், “உன்னை ஆட்சியாளனாகக் கொடுத்தேன்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכִי אִמְרִי
  choice: நீ போய் ... சொல்
  rationale: பெண்பால் ஒருமை கட்டளை வடிவங்கள் சூழலில் அகியாவின் மனைவியைக் குறிக்கின்றன; நவீனத் தமிழில் இயல்பான கட்டளைத் தொடராக மொழிபெயர்க்கப்பட்டது.
- source_word: לְיָרָבְעָם
  choice: யெரொபெயாமிடம்
  rationale: לְ முன்னொட்டு செய்தி கூறப்பட வேண்டிய நபரைக் குறிக்கிறது; தமிழில் ‘-ிடம்’ இயல்பாக உள்ளது.
- source_word: כֹּה אָמַר
  choice: கூறுவது இதுவே
  rationale: தீர்க்கதரிசனத் தூதர் சூத்திரத்தின் அதிகாரப்பூர்வத் தன்மையைத் தக்கவைத்துக்கொண்டு, நவீனத் தமிழில் இயல்பாக ஒலிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், எபிரெய மெய்யெழுத்துப் பெயரின் வழக்கமான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கடவுள்
  rationale: இணைநிலைப் பெயர்த்தொடரைத் தெளிவாகவும் நேரடியாகவும் பிரதிபலிக்கிறது.
- source_word: יַעַן אֲשֶׁר
  choice: என்பதால் வெளிப்படும் காரணத் தொடர்பு
  rationale: மூலத்தில் காரணத்தை அறிமுகப்படுத்தும் தொடர். தமிழ்ச் செய்தியின் தொடர்ச்சியில் அடுத்த வசனங்களோடு இணையும் அமைப்பைத் தக்கவைக்க, தனி ‘ஏனெனில்’ சேர்க்காமல் உட்பொருளாக வைக்கப்பட்டது.
- source_word: הֲרִימֹתִיךָ
  choice: நான் உன்னை உயர்த்தி
  rationale: רוּם என்பதன் உயர்த்துதல் என்ற உருவகத்தையும், பதவி உயர்வின் அரசியல் பொருளையும் காக்கிறது.
- source_word: מִתּוֹךְ הָעָם
  choice: மக்களிடையிலிருந்து
  rationale: மக்கள் கூட்டத்தின் நடுவிலிருந்து ஒருவரைத் தேர்ந்தெடுத்து உயர்த்தியதைக் குறிக்கும் இயல்பான தமிழ்.
- source_word: וָאֶתֶּנְךָ נָגִיד
  choice: உன்னை ஆட்சியாளனாக நியமித்தேன்
  rationale: சொல்லுக்கு சொல் ‘உன்னை ஆட்சியாளனாகக் கொடுத்தேன்’; இங்கு נתן + பதவிப்பெயர் நியமித்தலைக் குறிக்கிறது. ‘நியமித்தேன்’ தமிழில் அந்தச் செயல்பாட்டைத் தெளிவுபடுத்துகிறது.
- source_word: עַל עַמִּי יִשְׂרָאֵל
  choice: என் மக்களாகிய இஸ்ரவேலின்மேல்
  rationale: இறைவனின் ‘என் மக்கள்’ என்ற உரிமைத் தொடர்பையும், ஆட்சியின் பொருளையும் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூல வசனம் தனிப்பட்ட இறைத் திருப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைக் காக்கிறது.
- issue: נָגִיד என்பதன் அரசியல் பொருள்
  choice: ஆட்சியாளன்
  alternative: தலைவன் / இளவரசன்
  rationale: இங்கு தேவனால் அளிக்கப்பட்ட ஆட்சி அதிகாரமே மையம். ‘ஆட்சியாளன்’ அதிகாரப்பூர்வப் பொருளைத் தெளிவாகக் காட்டுகிறது; மரபுரிமை சார்ந்த ‘இளவரசன்’ என்ற கூடுதல் கருத்தைச் சேர்ப்பதில்லை.
- issue: יַעַן אֲשֶׁר தொடங்கும் முடிவுறாத காரண வாக்கியம்
  choice: வசன முடிவில் தொடரும் வாக்கியத் தன்மையைப் பேணுதல்
  alternative: இந்த வசனத்திலேயே காரண–விளைவு வாக்கியத்தை முடித்தல்
  rationale: எபிரெய உரையில் காரணப் பகுதி அடுத்த வசனங்களில் தொடர்கிறது. ஆகவே இவ்வசனத்தைத் தனியே முழுமையான தீர்ப்பாக மாற்றவில்லை.
translation_notes:
  register: நவீன நிலையான, மரியாதைமிக்க தமிழ். தீர்க்கதரிசனச் செய்தியின் அதிகாரத் தொனி காக்கப்பட்டுள்ளது; தேவையற்ற பழமையான சொற்கள் தவிர்க்கப்பட்டுள்ளன. இவ்வசனம் அடுத்த வசனத்துடன் இலக்கண ரீதியாகத் தொடர்வதால் இறுதியில் முற்றுப்புள்ளி வைத்தாலும் மேற்கோள் செய்தியின் தொடர்ச்சிப் பொருள் பாதுகாக்கப்பட்டுள்ளது.
