base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/006.yaml
  text: And when Ahijah heard the sound of her feet as she came in at the doorway[a], he said, “Come in, wife of Jeroboam[b]. Why are you disguising yourself? For I am sent to you with a hard message.”
translation:
  language: ta
  text: அவள் வாசலில் வந்தபோது, அவளுடைய காலடிச் சத்தத்தை அகியா கேட்டு, “உள்ளே வா, யெரொபெயாமின் மனைவியே. நீ ஏன் மாறுவேடமிட்டிருக்கிறாய்?[a] கடுமையான செய்தியோடு உன்னிடம் அனுப்பப்பட்டிருக்கிறேன்[b]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீ ஏன் வேறொருவரைப் போல நடிக்கிறாய்?”
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்குச் சொல்: “நான் உன்னிடம் கடுமையானதாக அனுப்பப்பட்டிருக்கிறேன்.” எபிரெயத்தில் பெயர்ச்சொல் கூறப்படவில்லை; கடுமையான செய்தி அல்லது துயரமான செய்தி என்பது உட்கருத்து.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל רַגְלֶיהָ
  choice: அவளுடைய காலடிச் சத்தம்
  rationale: எபிரெய மொழியின் ‘அவளுடைய கால்களின் சத்தம்’ என்ற உருவகத்தை இயல்பான நவீன தமிழில் ‘காலடிச் சத்தம்’ எனத் தருகிறது.
- source_word: בָּאָה בַפֶּתַח
  choice: அவள் வாசலில் வந்தபோது
  rationale: פֶּתַח என்பது கதவுப் பலகையைவிட நுழைவிடம் அல்லது வாசலைக் குறிக்கிறது; தொடரும் செயலைத் தமிழில் இயல்பான காலவாக்கியமாகத் தருகிறது.
- source_word: בֹּאִי
  choice: உள்ளே வா
  rationale: பெண்ணை நோக்கிய ஒருமை கட்டளை; காட்சிச் சூழலுக்கு இயல்பான நேரடி அழைப்பு.
- source_word: אֵשֶׁת יָרָבְעָם
  choice: யெரொபெயாமின் மனைவியே
  rationale: நேரடி விளியில் உள்ள எபிரெய இணைப்பைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: לָמָּה זֶּה אַתְּ מִתְנַכֵּרָה
  choice: நீ ஏன் மாறுவேடமிட்டிருக்கிறாய்?
  rationale: התפעל வடிவம் தன்னை அடையாளம் காண முடியாதபடி காட்டுவதையோ வேறொருவரைப் போல நடிப்பதையோ குறிக்கிறது; முந்தைய கதைச் சூழலுக்கு ‘மாறுவேடமிடுதல்’ பொருந்துகிறது.
- source_word: שָׁלוּחַ אֵלַיִךְ
  choice: உனக்கு … அறிவிக்க நான் அனுப்பப்பட்டிருக்கிறேன்
  rationale: செயப்பாட்டு வினையெச்சம் அனுப்பப்பட்டதன் விளைவாக நீடிக்கும் தற்போதைய நிலையைச் சுட்டுகிறது; அனுப்பியவர் யார் என்பதை இவ்வாக்கியம் வெளிப்படையாகச் சொல்லாததை மொழிபெயர்ப்பும் காக்கிறது.
- source_word: קָשָׁה
  choice: கடுமையான செய்தி
  rationale: ‘கடுமையான’ என்ற பெயரடை எபிரெயத்தில் பெயர்ச்சொல் இன்றி வருகிறது. தமிழில் பொருள் நிறைவுற ‘செய்தி’ சேர்க்கப்படுகிறது; அதன் மறைபொருள் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
theological_decisions:
- issue: קָשָׁה என்பதற்குப் பின் மறைந்துள்ள பெயர்ச்சொல்
  choice: ‘கடுமையான செய்தி’ என்று ‘செய்தி’யை நிரப்புதல்
  alternative: ‘துயரமான செய்தி’ அல்லது ‘கடினமான காரியம்’
  rationale: தீர்க்கதரிசனச் சூழலில் அகியா அவளுக்குக் கடுமையான வார்த்தை அல்லது செய்தியை அறிவிக்க அனுப்பப்பட்டவர் என்பதே மிக இயல்பான பொருள். ஆயினும் எபிரெயம் பெயர்ச்சொல்லைக் கூறாததால், அந்தத் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் கதைநடையின் தெளிவும் காக்கப்பட்டுள்ளன. அகியாவின் நேரடி உரையில் ஒருமை அணுக்க விளியான ‘நீ/உனக்கு/வா’ பயன்படுத்தப்பட்டுள்ளது. ‘வாசல்’, ‘காலடிச் சத்தம்’, ‘மாறுவேடம்’ ஆகியவை பொதுவாகப் புரியும் இயல்பான சொற்கள்.
