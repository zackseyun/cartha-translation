base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/030.yaml
  text: And there was war between Rehoboam and Jeroboam all their days[a].
translation:
  language: ta
  text: ரெகொபெயாமுக்கும் யெரொபெயாமுக்கும் இடையே அவர்களுடைய எல்லா நாட்களிலும் போர் இருந்தது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் நேரடியாக, “எல்லா நாட்களிலும்.” இந்த எபிரெய மரபுத்தொடர், அவர்களுடைய வாழ்நாள் அல்லது ஆட்சிக்காலம் முழுவதும் மோதல் நீடித்ததைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִלְחָמָה הָיְתָה
  choice: போர் இருந்தது
  rationale: מִלְחָמָה என்பது ‘போர்’; היה வினை இங்கு இருப்பைக் குறிக்கிறது. ஆகவே, தொடர்ச்சியை வினைக்குள்ளேயே சேர்க்காமல், இயல்பான தமிழில் ‘போர் இருந்தது’ என மொழிபெயர்க்கப்படுகிறது.
- source_word: בֵין ... וּבֵין
  choice: '...க்கும் ...க்கும் இடையே'
  rationale: இரு தரப்பினருக்கு இடையிலான பரஸ்பர எதிர்ப்பைத் தமிழில் இயல்பாகவும் துல்லியமாகவும் தெரிவிக்கிறது.
- source_word: רְחַבְעָם
  choice: ரெகொபெயாம்
  rationale: எபிரெயப் பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: יָרָבְעָם
  choice: யெரொபெயாம்
  rationale: எபிரெயப் பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: כָּל הַיָּמִים
  choice: அவர்கள் வாழ்நாளெல்லாம்
  rationale: சொல்லுக்கு மிக நெருக்கமாக ‘எல்லா நாட்களும்’ என்றிருந்தாலும், இச்சூழலில் இரு அரசர்களின் வாழ்நாள் அல்லது ஆட்சிக்காலம் முழுவதும் மோதல் நீடித்தது என்பதே எபிரெய மரபுத்தொடரின் பொருள். ‘அவர்கள் வாழ்நாளெல்லாம்’ என்பது அதை இயல்பான தமிழில் தருகிறது; அடிக்குறிப்பு நேரடியான வடிவத்தையும் ஆட்சிக்காலச் சாத்தியத்தையும் பாதுகாக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. எபிரெயச் சொல்லமைப்பைத் தேவையின்றி கடினமாக்காமல், அதன் காலநீடிப்பு சார்ந்த நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
