base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/013.yaml
  text: All Israel will mourn for him and bury him[a], because he alone of Jeroboam’s house will come to the grave, since in him something good toward Yahweh, the God of Israel[c][b], has been found in the house of Jeroboam.
translation:
  language: ta
  text: இஸ்ரயேலர் அனைவரும் அவனுக்காகப் புலம்பி, அவனை அடக்கம் செய்வார்கள். ஏனெனில், யெரொபெயாமின் வீட்டாரில் இவன் ஒருவன் மட்டுமே கல்லறைக்குச் செல்வான்[a]. யெரொபெயாமின் வீட்டில் இவனிடத்தில் இஸ்ரயேலின் கடவுளாகிய யாவேயை நோக்கிய ஏதோ ஒரு நன்மை காணப்பட்டது[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'நேரடி வடிவில்: “யெரொபெயாமுக்குரியவர்களில் இவன் ஒருவன் மட்டுமே கல்லறைக்குச் செல்வான்.” அதாவது, யெரொபெயாமின் வீட்டாரில் இவன் மட்டுமே அடக்கம் செய்யப்படுவான்.'
    reason: lexical_alternative
  - marker: b
    text: “ஏதோ ஒரு நன்மை” என்பதற்கு மாற்றாக, “ஒரு நல்ல காரியம்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: எபிரெயத்தில், “யாவேயை நோக்கிய நன்மை.” இது யாவேயை நோக்கிய மனப்பாங்கையோ, யாவே தொடர்பில் நல்லதாக அல்லது அவருக்கு உகந்ததாக இருந்த ஒன்றையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָפְדוּ לוֹ
  choice: அவனுக்காகத் துக்கம் அனுசரித்து
  rationale: ספד என்பது இறந்தவருக்காகத் துக்கப்படுதல் அல்லது புலம்புதலைக் குறிக்கிறது. நவீனத் தமிழில் பொதுவான துக்க நிகழ்வை இயல்பாகச் சொல்கிறது.
- source_word: וְקָבְרוּ אֹתוֹ
  choice: அவனை அடக்கம் செய்வார்கள்
  rationale: வினைச்சொல் நேரடியாக அவனை அடக்கம் செய்வதைக் குறிக்கிறது; முந்தைய ‘இஸ்ரயேலர் அனைவரும்’ என்பதே எழுவாயாகத் தொடர்கிறது.
- source_word: כִּי זֶה לְבַדּוֹ
  choice: இவன் ஒருவன் மட்டுமே
  rationale: எபிரெயச் சொற்றொடரின் தனித்துவ வலியுறுத்தலை இயல்பான தமிழில் காக்கிறது.
- source_word: יָבֹא לְיָרָבְעָם אֶל קָבֶר
  choice: யெரொபெயாமின் வீட்டாரில் இவன் ஒருவன் மட்டுமே கல்லறைக்குச் செல்வான்
  rationale: சொல்லுக்குச் சொல் அமைப்பு தெளிவற்றதாக இருப்பதால், சூழலில் குறிக்கப்படும் யெரொபெயாமின் குடும்பத்தை வெளிப்படுத்துகிறது; ‘கல்லறைக்குச் செல்வான்’ என்ற மூல உருவகத்தைத் தக்கவைக்கிறது.
- source_word: נִמְצָא בוֹ
  choice: இவனிடத்தில் ... காணப்பட்டது
  rationale: நிபால் வினை வடிவின் செயப்பாட்டு உணர்வைத் தக்கவைத்து, அந்த நன்மை அவனிடம் கண்டறியப்பட்டதாகக் கூறுகிறது.
- source_word: דָּבָר טוֹב
  choice: ஏதோ ஒரு நன்மை
  rationale: குறிப்பிடப்படாத நல்ல பண்பு அல்லது அம்சம் என்ற பரந்த, உறுதியற்ற பொருளை இயல்பான தமிழில் காக்கிறது.
- source_word: אֶל יְהוָה
  choice: யாவேக்கு உகந்த
  rationale: אֶל என்பதன் ‘யாவே நோக்கிய/யாவே தொடர்பான’ தெளிவின்மையை வாசிக்கத்தக்க தமிழில் தருகிறது; இது யாவேக்கு ஏற்ற அல்லது அவரை நோக்கிய பண்பாக இருக்கலாம் என்பதை அடிக்குறிப்பு பதிவு செய்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநாமத்தின் மெய்யெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பொதுவாகப் புரியக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: בְּבֵית יָרָבְעָם
  choice: யெரொபெயாமின் வீட்டாரில்
  rationale: בֵּית என்பது இங்கு கட்டிடத்தை அல்ல, குடும்பம் அல்லது வம்ச வீட்டாரைக் குறிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைநாமத்தை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட இறைநாமம் நேரடியாக உள்ளது; அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூல வேறுபாட்டைக் காக்கிறது.
- issue: אֶל יְהוָה என்பதன் உறவு
  choice: யாவேக்கு உகந்த
  alternative: யாவேயை நோக்கிய
  rationale: இந்தச் சொற்றொடர் யாவே நோக்கிய மனப்பாங்கையோ, யாவே தொடர்பில் நல்லதாக அல்லது அவருக்கு உகந்ததாக இருப்பதையோ குறிக்கலாம். முதன்மை உரை இயல்பான தமிழைத் தேர்ந்தெடுக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
- issue: ‘நல்ல காரியம்’ என்பதன் தன்மை
  choice: ஏதோ ஒரு நன்மை
  alternative: ஒரு நல்ல காரியம்
  rationale: דָּבָר טוֹב என்பது ஒரு குறிப்பிட்ட செயலை மட்டும் கட்டாயப்படுத்தாது; நல்ல பண்பு, மனப்பாங்கு அல்லது காரியம் என்ற திறந்த பொருளைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘வீட்டார்’ குடும்ப/வம்சப் பொருளை இயல்பாக வெளிப்படுத்துகிறது. மூலத்தின் காரணத் தொடர் இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டாலும் அதன் தர்க்க உறவு காக்கப்பட்டுள்ளது; உண்மையான சொற்பொருள் தெளிவின்மைகள் அடிக்குறிப்புகளில் பதிவு செய்யப்பட்டுள்ளன.
