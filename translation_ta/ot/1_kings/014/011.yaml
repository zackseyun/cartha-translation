source:
  edition: WLC
  text: הַ/מֵּ֨ת לְ/יָֽרָבְעָ֤ם בָּ/עִיר֙ יֹאכְל֣וּ הַ/כְּלָבִ֔ים וְ/הַ/מֵּת֙ בַּ/שָּׂדֶ֔ה יֹאכְל֖וּ ע֣וֹף הַ/שָּׁמָ֑יִם כִּ֥י יְהוָ֖ה דִּבֵּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/011.yaml
  text: Anyone belonging to Jeroboam who dies in the city[a], the dogs will eat; and anyone who dies in the field, the birds of the sky will eat[b], for Yahweh has spoken.
translation:
  language: ta
  text: யெரொபெயாமின் வீட்டாரில் நகரத்தில் இறப்பவர் எவரையும் நாய்கள் தின்னும்; வயலில் இறப்பவர் எவரையும் வானத்துப் பறவைகள் தின்னும்[b]. ஏனெனில், யாவே பேசியிருக்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: அல்லது, “வானத்தின் பறவைகள்”; மரபுவழியாக, “ஆகாயத்துப் பறவைகள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמֵּת לְיָרָבְעָם
  choice: யெரொபெயாமைச் சேர்ந்தவர்களில் ... சாகிற எவனையும்
  rationale: எபிரெயச் சொற்றொடர் யெரொபெயாம் தனிப்பட்ட முறையில் சாவதைக் குறிக்காமல், அவனுடைய குடும்பம் அல்லது வம்சத்தைச் சேர்ந்த எவரையும் பகிர்ந்தளிக்கும் பொருளில் குறிக்கிறது.
- source_word: בָּעִיר
  choice: நகரத்தில்
  rationale: இது நேரடியான இடப்பொருள்; குறிப்பிட்ட நகரம் எதுவென்று சொல்லப்படாததால் பொதுவான ஒருமையாக மொழிபெயர்க்கப்பட்டது.
- source_word: יֹאכְלוּ הַכְּלָבִים
  choice: நாய்கள் தின்னும்
  rationale: אָכַל என்பதன் அடிப்படைப் பொருளான ‘தின்’ என்பதைத் தக்கவைத்து, மூலத்தின் கடுமையான காட்சியை மிகைப்படுத்தாமல் வழங்குகிறது.
- source_word: וְהַמֵּת בַּשָּׂדֶה
  choice: வயல்வெளியில் சாகிற எவனையும்
  rationale: முந்தைய கூற்றுக்கு இணையான பகிர்ந்தளிக்கும் அமைப்பு காக்கப்பட்டுள்ளது; שָׂדֶה நகரத்திற்கு வெளியிலுள்ள வயல் அல்லது திறந்த வெளியைக் குறிக்கிறது.
- source_word: עוֹף הַשָּׁמַיִם
  choice: வானத்துப் பறவைகள்
  rationale: עוֹף என்பது கூட்டுப்பொருளில் பறக்கும் உயிரினங்களை, இங்கு இயல்பாகப் பறவைகளை, குறிக்கிறது; שָׁמַיִם என்பதற்கு ‘வானம்’ நேரடியான இணை.
- source_word: כִּי יְהוָה דִּבֵּר
  choice: ஏனெனில், யெகோவா பேசியிருக்கிறார்
  rationale: כִּי தீர்ப்பின் உறுதியையும் காரணத்தையும் அறிமுகப்படுத்துகிறது; perfect வினை வடிவம் நிறைவேறிய, உறுதியான இறையுரையைத் தெரிவிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: யாவே
  rationale: மூலத்தில் இறைப் பெயர் நேரடியாக இடம்பெறுவதால் பொதுப்பட்டமான ‘கர்த்தர்’ என்று மாற்றாமல் தனிப்பெயராக வழங்கப்பட்டது. தமிழில் பரவலாக அறியப்படும் ‘யெகோவா’ வடிவம் தேர்ந்தெடுக்கப்பட்டது; ‘யாவே’ என்பது சாத்தியமான ஒலிபெயர்ப்பு மாற்று.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் தீர்க்கதரிசனத் தீர்ப்பின் கண்ணியமான கடுமையைத் தக்கவைத்தும் வடிவமைக்கப்பட்டது. ‘சாகிற’ மற்றும் ‘தின்னும்’ என்பவை மூலத்தின் நேரடியான, கூர்மையான சொல்லாட்சியை இயல்பான தமிழில் காக்கின்றன.
