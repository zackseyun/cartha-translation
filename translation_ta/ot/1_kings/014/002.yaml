  text: וַ/יֹּ֨אמֶר יָרָבְעָ֜ם לְ/אִשְׁתּ֗/וֹ ק֤וּמִי נָא֙ וְ/הִשְׁתַּנִּ֔ית וְ/לֹ֣א יֵֽדְע֔וּ כִּי אתי אֵ֣שֶׁת יָרָבְעָ֑ם וְ/הָלַ֣כְתְּ שִׁלֹ֗ה הִנֵּה שָׁם֙ אֲחִיָּ֣ה הַ/נָּבִ֔יא הֽוּא דִבֶּ֥ר עָלַ֛/י לְ/מֶ֖לֶךְ עַל הָ/עָ֥ם הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/002.yaml
  text: Jeroboam said to his wife[a], “Please get up and disguise yourself, so that they will not know that you are the wife of Jeroboam, and go to Shiloh. Behold, Ahijah the prophet is there; he is the one who spoke concerning me[b], that I would be king over this people.”
translation:
  language: ta
  text: யெரொபெயாம் தன் மனைவியிடம், “தயவுசெய்து எழுந்து, மாறுவேடம் அணிந்துகொள். நீ யெரொபெயாமின் மனைவி என்று அறியாதபடி[a] சீலோவுக்குப் போ. இதோ, இறைவாக்கினர் அகியா அங்கே இருக்கிறார். இந்த மக்களுக்கு நான் அரசனாவேன் என்று என்னைப்பற்றிச் சொன்னவர்[b] அவர்தான்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்கு நெருக்கமாக, “அவர்கள் அறியாதபடி”; எபிரெயில் அறிபவரின் எழுவாய் குறிப்பாகச் சொல்லப்படவில்லை.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “இந்த மக்களுக்கு அரசனாக இருப்பதைக் குறித்து.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר יָרָבְעָם לְאִשְׁתּוֹ
  choice: யெரொபெயாம் தன் மனைவியிடம் ... என்றான்
  rationale: எபிரெயக் கதைநடையின் இயல்பான வினைச்சொல்லையும் உறவுச் சொல்லையும் தெளிவான நவீனத் தமிழில் தருகிறது.
- source_word: קוּמִי נָא
  choice: தயவுசெய்து எழுந்து
  rationale: பெண்பால் கட்டளையையும் נָא தரும் வேண்டுகோள் அல்லது பணிவுத் தொனியையும் காக்கிறது.
- source_word: וְהִשְׁתַּנִּית
  choice: மாறுவேடம் அணிந்துகொள்
  rationale: இச்சூழலில் தன்னை அடையாளம் காண முடியாதபடி தோற்றத்தை மாற்றிக்கொள்வதைக் குறிக்கும் இயல்பான தமிழ் வழக்கு.
- source_word: וְלֹא יֵדְעוּ כִּי אַתְּ אֵשֶׁת יָרָבְעָם
  choice: நீ யெரொபெயாமின் மனைவி என்று யாரும் அறியாதபடி
  rationale: வேடமாற்றத்தின் நோக்கத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது; எபிரெயில் எழுவாய் குறிப்பற்ற பன்மையாக இருப்பது அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: וְהָלַכְתְּ שִׁלֹה
  choice: சீலோவுக்குப் போ
  rationale: முந்தைய கட்டளையைத் தொடரும் அறிவுறுத்தலாக இதன் செயல்பாட்டைத் தெளிவாகக் காட்டுகிறது.
- source_word: הִנֵּה שָׁם
  choice: இதோ ... அங்கே இருக்கிறார்
  rationale: הִנֵּה என்பதன் கவன ஈர்ப்புத் தன்மையையும் שָׁם என்பதன் இடக்குறிப்பையும் காக்கிறது.
- source_word: אֲחִיָּה הַנָּבִיא
  choice: இறைவாக்கினர் அகியா
  rationale: பெயரை ஒலிபெயர்த்து, נָבִיא என்பதை நவீனத் தமிழில் புரியக்கூடிய மரியாதையான சொல்லால் மொழிபெயர்க்கிறது.
- source_word: הוּא דִבֶּר
  choice: சொன்னவர் அவர்தான்
  rationale: தனித்த சுட்டுப்பெயர் הוּא தரும் வலியுறுத்தலைத் தமிழில் காக்கிறது.
- source_word: עָלַי לְמֶלֶךְ עַל הָעָם הַזֶּה
  choice: இந்த மக்களுக்கு நான் அரசனாவேன் என்று என்னைப்பற்றிச் சொன்னவர்
  rationale: எரொபெயாமைக் குறித்த இறைவாக்கு அவன் அரசனாவதைப் பற்றியது என்ற இயல்பான சூழல்பொருளைத் தருகிறது; לְמֶלֶךְ அமைப்பின் மாற்று வாசிப்பு அடிக்குறிப்பில் காக்கப்படுகிறது.
theological_decisions:
- issue: עָלַי לְמֶלֶךְ என்ற தொடரின் தொடர்பும் பொருளும்
  choice: இந்த மக்களுக்கு நான் அரசனாவேன் என்று என்னைப்பற்றிச் சொன்னவர்
  alternative: இந்த மக்களுக்கு அரசனாகும்படி என்னிடம் சொன்னவர்
  rationale: முதன்மை வாசிப்பு எரொபெயாமைப் பற்றிய முன் இறைவாக்கைச் சுட்டுகிறது; ஆனால் எபிரெய் முன்னிடைச்சொற்களின் சுருக்கமான அமைப்பு மற்றொரு தொடர்பை அனுமதிப்பதால் அதை அடிக்குறிப்பில் விடுகிறது.
translation_notes:
  register: நவீன, மரியாதையான கதைநடை பயன்படுத்தப்பட்டுள்ளது. “தயவுசெய்து,” “மாறுவேடம் அணிந்துகொள்,” “இதோ” ஆகியவை மூலத்தின் வேண்டுகோள், செயற்பொருள், கவன ஈர்ப்பு ஆகியவற்றைக் காக்கின்றன; தேவையற்ற பழமையான நடையும் சமயப்பிரிவு சார்ந்த சொற்பயன்பாடும் தவிர்க்கப்பட்டுள்ளன.
