source:
  edition: WLC
  text: וַ/יַּ֧עַשׂ יְהוּדָ֛ה הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יְקַנְא֣וּ אֹת֗/וֹ מִ/כֹּל֙ אֲשֶׁ֣ר עָשׂ֣וּ אֲבֹתָ֔/ם בְּ/חַטֹּאתָ֖/ם אֲשֶׁ֥ר חָטָֽאוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/022.yaml
  text: And Judah did what was evil in the eyes of Yahweh[a], and they provoked him to jealousy more than all that their fathers had done, by the sins that they committed.
translation:
  language: ta
  text: யூதா கர்த்தரின் பார்வையில் தீமையானதைச் செய்தது. அவர்கள் செய்த பாவங்களால், தங்கள் முன்னோர்கள் செய்த எல்லாவற்றையும்விட அதிகமாக அவருடைய பொறாமையைத் தூண்டினார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவரைப் பொறாமைகொள்ளச் செய்தார்கள்” அல்லது “அவருடைய பொறாமையை மூட்டினார்கள்.” எபிரெயச் சொல், யூதாவின் உண்மையின்மைக்கு கர்த்தர் காட்டிய உடன்படிக்கை உறவுக்குரிய பொறாமையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוּדָה
  choice: யூதா
  rationale: தெற்கு அரசையும் அதன் மக்களையும் குறிக்கும் கூட்டுப்பொருளுடைய தனிப்பெயர். பின்னர் வரும் பன்மை வினைச்சொல்லுக்கு ஏற்ப இரண்டாவது வாக்கியத்தில் ‘அவர்கள்’ பயன்படுத்தப்பட்டது.
- source_word: הָרַע
  choice: தீமையானதை
  rationale: עשה + הרע என்ற எபிரெய மரபுத்தொடரை நவீன தமிழில் இயல்பாகவும் அதன் ஒழுக்க மதிப்பீட்டைத் தெளிவாகவும் தருகிறது.
- source_word: בְּעֵינֵי יְהוָה
  choice: கர்த்தரின் பார்வையில்
  rationale: எபிரெய மொழியின் மதிப்பீட்டு உருவகத்தை இயல்பான தமிழில் காக்கிறது; יהוה என்பதற்கு மரபாகப் புரிந்துகொள்ளப்படும் ‘கர்த்தர்’ பயன்படுத்தப்பட்டது.
- source_word: וַיְקַנְאוּ אֹתוֹ
  choice: அவருக்கு எரிச்சலைத் தூண்டினார்கள்
  rationale: கடவுளின் உடன்படிக்கைச் சார்ந்த பொறாமை/வைராக்கிய எதிர்வினையை, பாவமுள்ள பொறாமையாகத் தவறாகப் புரிந்துகொள்ளாமல் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; மாற்றுச் சொற்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: מִכֹּל אֲשֶׁר עָשׂוּ אֲבֹתָם
  choice: தங்கள் முன்னோர்கள் செய்த எல்லாவற்றையும்விட அதிகமாக
  rationale: ஒப்பீட்டுப் பொருளை முழுமையாகக் காத்து, אֲבֹתָם என்பதைக் காலந்தாழ்ந்த ‘பிதாக்கள்’ என்பதற்குப் பதிலாக தெளிவான ‘முன்னோர்கள்’ என்று வழங்குகிறது.
- source_word: בְּחַטֹּאתָם אֲשֶׁר חָטָאוּ
  choice: அவர்கள் செய்த பாவங்களால்
  rationale: பெயர்ச்சொல்–வினைச்சொல் ஒரே வேரிலிருந்து வரும் எபிரெய வலியுறுத்தலைத் தமிழில் தேவையற்ற மறுபடியும் கூறலின்றி வழங்கி, בְּ-இன் காரண/கருவிப் பொருளையும் காக்கிறது.
theological_decisions:
- issue: தெய்வீகப் பொறாமை அல்லது வைராக்கிய மொழி
  choice: அவருக்கு எரிச்சலைத் தூண்டினார்கள்
  alternative: அவரைப் பொறாமைகொள்ளச் செய்தார்கள் / அவருடைய பொறாமையைத் தூண்டினார்கள்
  rationale: இது யூதாவின் உடன்படிக்கைத் துரோகத்துக்கு கர்த்தர் காட்டும் உரிமைமிக்க தீவிர எதிர்வினையைச் சுட்டுகிறது. தமிழில் ‘பொறாமை’ மட்டும் பயன்படுத்தினால் பாவமுள்ள மனிதப் பொறாமை என்ற தவறான எண்ணம் தோன்றலாம்; ஆகவே முதன்மை உரையில் இயல்பான சொல்லாக்கமும், மூலத்தின் பதற்றத்தைப் பாதுகாக்க அடிக்குறிப்பில் நேரடியான மாற்றுகளும் தரப்பட்டுள்ளன.
translation_notes:
  register: நவீன, பொதுவாகப் புரியும், மரியாதைமிக்க தமிழ். ‘யூதா’ முதலில் கூட்டுப்பொருளில் ஒருமையாகவும் பின்னர் மூல எபிரெயைப் போல மக்களைக் குறிக்கும் ‘அவர்கள்’ என்ற பன்மையுடனும் வழங்கப்பட்டுள்ளது. அடிக்குறிப்பு குறியீடு தொடர்புடைய வாக்கியத்தின் முடிவில் இடப்பட்டுள்ளது.
