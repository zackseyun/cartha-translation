base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/004.yaml
  text: Jeroboam’s wife did so. She arose and went to Shiloh[a], and came to Ahijah’s house. Now Ahijah could not see, because his eyes were dim because of his old age.
translation:
  language: ta
  text: யெரொபெயாமின் மனைவி அப்படியே செய்தாள். அவள் எழுந்து சீலோவுக்குப் போய், அகியாவின் வீட்டுக்கு வந்தாள். அகியாவால் பார்க்க முடியவில்லை; முதுமையால் அவனுடைய கண்கள் மங்கிப்போயிருந்தன.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லர்த்தமாக, “முதுமையால் அவனுடைய கண்கள் நின்றுவிட்டன.” இது வயது முதிர்வால் ஏற்பட்ட பார்வைக் குறைபாட்டைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעַשׂ כֵּן
  choice: அப்படியே செய்தாள்
  rationale: முந்தைய அறிவுறுத்தலின்படி அவள் நடந்துகொண்டதைக் குறிக்கும் எபிரெயக் கதைநடைச் சொற்றொடரை இயல்பாகவும் சுருக்கமாகவும் தருகிறது.
- source_word: אֵשֶׁת יָרָבְעָם
  choice: யெரொபெயாமின் மனைவி
  rationale: எபிரெய இணைப்புப் பெயர்த்தொடரைத் தெளிவான தமிழ் உடைமைத் தொடராக வழங்குகிறது.
- source_word: וַתָּקָם
  choice: அவள் எழுந்து
  rationale: தொடர்ச்சியான கதைநடையின் அடுத்த செயலைப் பாதுகாக்கிறது; தமிழில் அடுத்த வினையுடன் இணைப்பது இயல்பானது.
- source_word: וַתֵּלֶךְ שִׁלֹה
  choice: சீலோவுக்குப் போய்
  rationale: இலக்கை நோக்கிய எளிய நகர்வை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: וַתָּבֹא בֵּית אֲחִיָּה
  choice: அகியாவின் வீட்டுக்கு வந்தாள்
  rationale: வீட்டினுள் நுழைந்தாள் என்று தேவையின்றி வலியுறுத்தாமல், அங்கு வந்து சேர்ந்தாள் என்ற மூலத்தின் பரந்த பொருளைப் பாதுகாக்கிறது.
- source_word: לֹא יָכֹל לִרְאוֹת
  choice: அகியாவால் பார்க்க முடியவில்லை
  rationale: திறனின்மையைக் குறிக்கும் எபிரெய அமைப்பை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: קָמוּ עֵינָיו
  choice: அவனுடைய கண்கள் செயலிழந்திருந்தன
  rationale: சொல்லர்த்தமான ‘கண்கள் நின்றன’ என்பது தமிழில் தவறாகப் புரியக்கூடும். சூழலில் முதுமையால் பார்வைச் செயல்பாடு இழந்ததைக் குறிக்கும் மரபுத்தொடரின் பொருளைத் தெளிவுபடுத்துகிறது; மூல உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: מִשֵּׂיבוֹ
  choice: முதுமையின் காரணமாக
  rationale: முதுமையே பார்வையின்மைக்குக் காரணம் என்பதைக் காரணவியல் உறவுடன் தெளிவாகக் காட்டுகிறது.
