translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வினைத் தொடரின் வரிசை காக்கப்பட்டாலும், தமிழில் இயல்பாக அமைய இணைவினை அமைப்பு பயன்படுத்தப்பட்டுள்ளது. ‘கண்கள் நின்றன’ என்ற உண்மையான மூல உருவகம் பிரதான உரையில் குழப்பம் தராதவாறு பொருள்வழியாக மொழிபெயர்க்கப்பட்டு, அடிக்குறிப்பில் வெளிப்படையாகத் தரப்பட்டுள்ளது.
