  text: וַ/יהוָ֞ה אָמַ֣ר אֶל אֲחִיָּ֗הוּ הִנֵּ֣ה אֵ֣שֶׁת יָרָבְעָ֡ם בָּאָ֣ה לִ/דְרֹשׁ֩ דָּבָ֨ר מֵ/עִמְּ/ךָ֤ אֶל בְּנָ/הּ֙ כִּֽי חֹלֶ֣ה ה֔וּא כָּ/זֹ֥ה וְ/כָ/זֶ֖ה תְּדַבֵּ֣ר אֵלֶ֑י/הָ וִ/יהִ֣י כְ/בֹאָ֔/הּ וְ/הִ֖יא מִתְנַכֵּרָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/005.yaml
  text: And Yahweh said to Ahijah[a], “Look, Jeroboam’s wife is coming to ask you about her son, because he is sick. You shall speak to her like this and like that. And when she comes[b], she will be disguising herself.”
translation:
  language: ta
  text: யாவே அகியாவிடம், “இதோ, யெரொபெயாமின் மனைவி தன் மகனைப் பற்றி உன்னிடம் விசாரிக்க வருகிறாள்; ஏனெனில் அவன் நோயுற்றிருக்கிறான். நீ அவளிடம் இன்னின்னவாறு[a] பேச வேண்டும். அவள் வரும்போது, அவள் மாறுவேடம் பூண்டிருப்பாள்[b]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேய மொழியில், “இப்படியும் அப்படியும்” என்பது சொல்லப்பட வேண்டிய குறிப்பிட்ட செய்தியை அதன் விவரங்களை இங்கே கூறாமல் சுட்டும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “வேறொருத்தியாகத் தன்னைக் காட்டிக்கொண்டிருப்பாள்.” எபிரேய வினை, தன்னை அடையாளம் காண முடியாதபடி மாற்றிக்கொள்வதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה
  choice: யாவே
  rationale: יהוה என்ற இறைப்பெயரை ஒலிபெயர்த்து, மூலத்தின் தனிப்பெயர் தன்மையைப் பாதுகாக்கிறது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் எபிரேய இடைச்சொல்லை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֵשֶׁת יָרָבְעָם
  choice: யெரொபெயாமின் மனைவி
  rationale: எபிரேய உடைமைத் தொடரை இயல்பான தமிழில் நேரடியாகக் கொடுக்கிறது.
- source_word: בָּאָה
  choice: வருகிறாள்
  rationale: சூழலில் உடனடியாக நிகழவிருக்கும் வருகையை நிகழ்காலத் தொடர்நிலையால் உணர்த்துகிறது.
- source_word: לִדְרֹשׁ דָּבָר מֵעִמְּךָ אֶל בְּנָהּ
  choice: தன் மகனைப் பற்றி உன்னிடம் விசாரிக்க
  rationale: தீர்க்கதரிசியிடம் செய்தி அல்லது பதில் தேடிவரும் பொருளை எளிய தமிழில் தருகிறது; ‘דָּבָר’ என்பதைக் கட்டாயமாகத் தனிச்சொல்லாக விரிவாக்காமல் இயல்பான வினைத்தொடரில் உள்ளடக்குகிறது.
- source_word: כִּי חֹלֶה הוּא
  choice: ஏனெனில் அவன் நோயுற்றிருக்கிறான்
  rationale: காரண உறவையும் நோயின் தொடரும் நிலையையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: כָּזֹה וְכָזֶה
  choice: இன்னின்னவாறு
  rationale: பின்னர் தெரிவிக்கப்படவிருக்கும் குறிப்பிட்ட செய்தியை இப்போதைக்கு விவரிக்காமல் சுட்டும் எபிரேய மரபுத்தொடருக்கு இயல்பான தமிழ் இணை.
- source_word: תְּדַבֵּר אֵלֶיהָ
  choice: நீ அவளிடம் … பேச வேண்டும்
  rationale: இரண்டாம் நபருக்கான அறிவுறுத்தல் வலிமையை நவீனத் தமிழில் இயல்பாகத் தருகிறது.
- source_word: וִיהִי כְבֹאָהּ
  choice: அவள் வரும்போது
  rationale: எபிரேயக் கதைநடைச் சூத்திரத்தைச் சுருக்கமாகவும் பொருள் மாறாமலும் தமிழாக்குகிறது.
- source_word: וְהִיא מִתְנַכֵּרָה
  choice: தன்னை அடையாளம் தெரியாதபடி மறைத்துக்கொண்டிருப்பாள்
  rationale: נכר வினையின் தன்வினை வடிவத்தில் உள்ள, தன்னை அறிய முடியாதபடி மாற்றிக்கொள்ளும் நுணுக்கத்தையும் வருகை நேரத்தில் தொடரும் நிலையையும் பாதுகாக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பொதுப்பட்டப் பெயர் அல்லாமல் வரும் இறைத்தனிப்பெயரை வெளிப்படையாக வைத்திருக்கிறது; மரபுவழிப் பட்டப்பெயரை மூலத்திற்குப் பதிலாகச் சேர்க்கவில்லை.
- issue: தீர்க்கதரிசியிடம் விசாரித்தலின் தன்மை
  choice: தன் மகனைப் பற்றி உன்னிடம் விசாரிக்க
  alternative: தன் மகனைப் பற்றி உன்னிடமிருந்து ஒரு இறைவாக்கைக் கேட்க
  rationale: דָּבָר என்பது ‘சொல்/செய்தி’ எனப் பொருள்படக்கூடும்; சூழல் தீர்க்கதரிசன ஆலோசனையைச் சுட்டினாலும், ‘இறைவாக்கு’ என்று வெளிப்படையாகச் சேர்த்து மூலத்தின் சொல் அளவை மீறாமல் இருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் கதைநடைத் தெளிவும் கொண்ட பதிவு. ‘இதோ’, ‘விசாரிக்க’, ‘நோயுற்றிருக்கிறான்’ போன்ற சொற்கள் dignified ஆனால் பழமையற்ற நடையைப் பேணுகின்றன. அடிக்குறிப்பு [a] அதற்குரிய ‘இன்னின்னவாறு’ என்பதற்குப் பின் வைக்கப்பட்டுள்ளது; வழங்கப்பட்ட ஆங்கில ஆலோசனை உரையில் அது தவறாக ‘Ahijah’ என்பதற்குப் பின் இருந்தது.
