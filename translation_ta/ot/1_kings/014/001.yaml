  text: בָּ/עֵ֣ת הַ/הִ֔יא חָלָ֖ה אֲבִיָּ֥ה בֶן יָרָבְעָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/001.yaml
  text: At that time Abijah son of Jeroboam became sick.
translation:
  language: ta
  text: அந்தக் காலத்தில் யெரொபெயாமின் மகன் அபியா நோயுற்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: அந்தக் காலத்தில்
  rationale: கதை நிகழும் காலத்தைக் குறிக்கும் எபிரெயச் சொற்றொடரை இயல்பான நவீனத் தமிழில் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: חָלָה
  choice: நோயுற்றான்
  rationale: இந்த வினை நோயடைதலை அல்லது நோயுற்ற நிலையைச் சுட்டலாம். இங்கு கதை நகர்வில் நோய் ஏற்பட்டதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: אֲבִיָּה
  choice: அபியா
  rationale: எபிரெயப் பெயரின் ஒலியமைப்பைத் தமிழில் தெளிவாகப் பெயர்த்தெழுதுகிறது.
- source_word: בֶן יָרָבְעָם
  choice: யெரொபெயாமின் மகன்
  rationale: எபிரெய இணைப்புத் தொடரில் கூறப்படும் தந்தை–மகன் உறவை இயல்பான தமிழ் உடைமைத் தொடரால் வெளிப்படுத்துகிறது.
