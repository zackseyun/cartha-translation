translation_notes:
  register: நவீனத் தரத் தமிழில் சுருக்கமான, கண்ணியமான கதைநடை. எபிரெயச் சொல் வரிசையை இறுக்கமாகப் பின்பற்றாமல், தமிழில் இயல்பாகத் தந்தை–மகன் அடையாளம் பெயருக்கு முன் வைக்கப்பட்டுள்ளது.
