translation_notes:
  register: நவீனத் தரத்தமிழில், அரச மரணமும் வாரிசுரிமையும் குறித்த எபிரெய வாய்பாடுகளின் கண்ணியமான தொனியைப் பேணும் நடை. ஆங்கில ஆலோசனை உரையில் இடம் மாறியிருந்த அடிக்குறி சுட்டிகள், அவை விளக்கும் சொற்களான ‘நாமா’ மற்றும் ‘அபியாம்’ என்பவற்றோடு சரியாக இணைக்கப்பட்டுள்ளன.
