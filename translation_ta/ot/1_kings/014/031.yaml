base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/031.yaml
  text: And Rehoboam slept with his fathers and was buried with his fathers in the city of David[a]. And his mother's name was Naamah the Ammonite[b]. And Abijam his son reigned in his place.
translation:
  language: ta
  text: ரெகொபெயாம் தன் முன்னோர்களோடு துயிலடைந்தான்; தாவீதின் நகரத்தில் தன் முன்னோர்களோடு அடக்கம் செய்யப்பட்டான். அவனுடைய தாயின் பெயர் அம்மோனியப் பெண்ணான நாமா[a]. அவனுக்குப் பதிலாக அவன் மகன் அபியாம்[b] அரசாண்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் இங்கு பெண்பால் இனப்பெயர் பயன்படுத்தப்பட்டு, நாமா அம்மோனியப் பெண் என்று வெளிப்படையாக அடையாளப்படுத்தப்படுகிறாள்.
    reason: lexical_alternative
  - marker: b
    text: வேறு சில பகுதிகளில் இவர் ‘அபியா’ என்று அழைக்கப்படுகிறார்; இந்த வசனத்தின் எபிரெய உரையில் ‘அபியாம்’ என்று உள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁכַּב ... עִם אֲבֹתָיו
  choice: தன் முன்னோர்களோடு துயிலடைந்தான்
  rationale: அரசர்களின் மரணத்தைக் குறிக்கும் எபிரெய வழக்குச் சொல்லின் உருவகத்தையும் மரண அறிவிப்பு மரபையும் காக்கிறது; தமிழில் ‘தந்தையரோடு’ என்பதைக் காட்டிலும் ‘முன்னோர்களோடு’ என்பது நோக்குப்பொருளைத் தெளிவாகத் தருகிறது.
- source_word: וַיִּקָּבֵר עִם אֲבֹתָיו
  choice: தன் முன்னோர்களோடு அடக்கம் செய்யப்பட்டான்
  rationale: קבר என்ற செயப்பாட்டுவினையை இயல்பான நவீனத் தமிழில் நேரடியாகத் தருகிறது.
- source_word: בְּעִיר דָּוִד
  choice: தாவீதின் நகரத்தில்
  rationale: எபிரெய இடப்பெயர்த் தொடரைத் தெளிவாகவும் மரபான தமிழ்நடையிலும் வழங்குகிறது.
- source_word: נַעֲמָה הָעַמֹּנִית
  choice: அம்மோனியப் பெண்ணான நாமா
  rationale: பெண்பால் இன அடையாளத்தை வெளிப்படையாகக் காட்டும் הָעַמֹּנִית என்பதையும் நாமா என்ற பெயரையும் தெளிவான நவீனத் தமிழில் காக்கிறது.
- source_word: וַיִּמְלֹךְ
  choice: அரசாண்டான்
  rationale: מלך என்பதையும் அரச மரபுரிமைச் சூழலையும் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: אֲבִיָּם
  choice: அபியாம்
  rationale: இந்த வசனத்தின் மசோரா உரையில் உள்ள அֲבִיָּם என்ற பெயர்வடிவத்தையே பிரதிபலிக்கிறது.
- source_word: תַּחְתָּיו
  choice: அவனுக்குப் பதிலாக
  rationale: அரச பதவியில் ஒருவன் மற்றொருவனைத் தொடர்ந்து ஏற்றுக்கொள்வதைக் குறிக்கும் எபிரெய மரபுத்தொடரை இயல்பாகத் தருகிறது.
