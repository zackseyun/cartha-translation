base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/020.yaml
  text: The days that Jeroboam reigned were twenty-two years. Then he lay down with his fathers[a], and Nadab his son became king in his place.
translation:
  language: ta
  text: யெரொபெயாம் இருபத்திரண்டு ஆண்டுகள் அரசாண்டான். பின்பு அவன் தன் முன்னோர்களோடு துயிலடைந்தான்[a]. அவனுக்குப் பதிலாக அவன் மகன் நாதாப் அரசனானான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் சொல்லுக்குச் சொல் நெருக்கமாக, “தன் தந்தையரோடு படுத்துக்கொண்டான்.” அரச வாரிசுத் தொடர் பற்றிய இத்தகைய செய்திகளில் இந்த மரபுத்தொடர் மரணத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַיָּמִים אֲשֶׁר מָלַךְ יָרָבְעָם
  choice: யெரொபெயாம் ... அரசாண்டான்
  rationale: எபிரெய அரசாட்சிக் காலச் சுருக்கத்தின் பொருளை இயல்பான நவீன தமிழில் தருகிறது; தொடக்க இணைப்புச்சொல்லை விறைப்பாகப் பிரதிபலிக்கவில்லை.
- source_word: עֶשְׂרִים וּשְׁתַּיִם שָׁנָה
  choice: இருபத்திரண்டு ஆண்டுகள்
  rationale: எபிரெய எண்ணுத் தொடரின் இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: அவன் தன் முன்னோர்களோடு துயிலடைந்தான்
  rationale: அரசர் மரணத்தைக் குறிக்கும் எபிரெய மரபுத்தொடரின் உறக்க உருவகத்தைப் பாதுகாக்கிறது. אֲבֹתָיו என்பதைக் குடும்ப முன்னோர்களைக் குறிக்கும் சூழல்சார் பொருளில் மொழிபெயர்க்கிறது.
- source_word: וַיִּמְלֹךְ נָדָב בְּנוֹ
  choice: அவன் மகன் நாதாப் அரசனானான்
  rationale: வெறுமனே ஆட்சி செய்தான் என்று அல்லாமல், அரியணையேற்ற வாரிசுரிமையைத் தெளிவாகக் காட்டுகிறது.
- source_word: תַּחְתָּיו
  choice: அவனுக்குப் பதிலாக
  rationale: அரச வாரிசுத் தொடரில் ஒருவரின் இடத்தை மற்றொருவர் ஏற்றதை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: அரசர் மரணத்தைக் குறிக்கும் மரபுத்தொடர்
  choice: தன் முன்னோர்களோடு துயிலடைந்தான்
  alternative: இறந்தான்
  rationale: மூலத்தின் உறக்க உருவகத்தையும் அரசாட்சிச் சுருக்கத்தின் இலக்கியத் தன்மையையும் காக்கிறது; மறுமை குறித்த கோட்பாட்டை இச்சொற்றொடருக்குள் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் வகையில் கண்ணியமான அரச வரலாற்று நடையில் அமைக்கப்பட்டுள்ளது. ‘துயிலடைந்தான்’ என்பது மூல உருவகத்தைத் தக்கவைத்தபடியே தமிழில் ஏற்படக்கூடிய பாலியல் தவறுபுரிதலைத் தவிர்க்கிறது.
