  source_fidelity: திருத்தம் தேவை. வரைவு וַיְהִי எனும் பின்னணிக் கதைத் தொடக்கத்தைத் தனியாக வெளிப்படுத்தவில்லை; இது தமிழில் ஏற்கத்தக்க சுருக்கமாக இருக்கலாம். ஆனால் בַּעֲלוֹת யோவாப் என்ற காலவினையெச்சத்தை முற்றுவினை ‘போனான்’ என மாற்றி, பின்னர் வரும் செயலை வெறும் தொடர்ச்சிச் செயலாகக் காட்டுகிறது. ‘ஏறிச் சென்றபோது’ என்பது காலத் தொடர்பையும் עלה (‘ஏறிச் செல்’) என்ற கூறையும் பாதுகாக்கிறது. וַיַּךְ இச்சூழலில் உயிர்க்கொலையைக் குறிக்கிறது; ‘கொன்றான்’ துல்லியமானது.
