base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/015.yaml
  text: And it happened[a], when David was in Edom, when Joab the commander of the army had gone up to bury the slain[b], that he struck down every male in Edom—
translation:
  language: ta
  text: தாவீது ஏதோமில் இருந்தபோது[a], படைத்தலைவனான யோவாப் கொல்லப்பட்டவர்களை அடக்கம் செய்ய ஏறிச் சென்றபோது, அவன் ஏதோமில் உள்ள ஆண்கள் அனைவரையும் கொன்றான்—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், ‘தாவீது ஏதோமுடன் இருந்தபோது’ என்று சொற்சொல்லாக உள்ளது. இச்சூழலில் இது தாவீது ஏதோமில் இருந்ததையோ, ஏதோமுக்கு எதிரான படையெடுப்பில் ஈடுபட்டிருந்ததையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: அப்போது
  rationale: இது பின்னணி விளக்கத்தை அறிமுகப்படுத்தும் பொதுவான எபிரெயக் கதைத் தொடர். தமிழில் தனியாகச் சொற்சொல்லாக மொழிபெயர்ப்பதைவிட, அடுத்த காலவாக்கியத்துடன் இணைந்த ‘அப்போது’ இயல்பாக அதன் கதைப்பணி வெளிப்படுத்துகிறது.
- source_word: בִּהְיוֹת דָּוִד אֶת אֱדוֹם
  choice: தாவீது ஏதோமில் இருந்தபோது
  rationale: ב உடனான היה வினையெச்ச வடிவம் காலவாக்கியத்தைக் குறிக்கிறது. אֶת אֱדוֹם என்ற சற்று அசாதாரணமான தொடர் இச்சூழலில் தாவீதின் ஏதோம் தொடர்பான இருப்பையோ படையெடுப்பையோ குறிக்கிறது; ‘ஏதோமில் இருந்தபோது’ இயல்பானது, ஆனால் மூலத்தின் சிக்கலைக் குறிப்பில் பாதுகாக்கிறது.
- source_word: בַּעֲלוֹת יוֹאָב
  choice: யோவாப் ... போனான்
  rationale: ב உடனான עלה வினையெச்சம் இன்னொரு காலச் சூழலை அளிக்கிறது. இலக்கிடம் இவ்வசனத்தில் சொல்லப்படாததால், தமிழில் இயல்பான ‘போனான்’ பயன்படுத்தப்படுகிறது.
- source_word: שַׂר הַצָּבָא
  choice: படைத்தலைவன்
  rationale: அதிகாரப்பூர்வமான இராணுவப் பதவியை நவீனத் தமிழில் தெளிவாகவும் சுருக்கமாகவும் தருகிறது.
- source_word: לְקַבֵּר
  choice: அடக்கம் செய்ய
  rationale: யோவாப் போனதன் நோக்கத்தைச் சுட்டும் வினையெச்சம். ‘அடக்கம் செய்ய’ என்பது இயல்பான, கண்ணியமான நவீனத் தமிழ்.
- source_word: הַחֲלָלִים
  choice: கொல்லப்பட்டவர்கள்
  rationale: பொதுவாக இறந்தவர்களை அல்ல, குறிப்பாக வன்முறையிலோ போரிலோ கொல்லப்பட்டவர்களைக் குறிக்கும் சொல்லின் பொருளைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: וַיַּךְ
  choice: அவன் ... கொன்றுபோட்டான்
  rationale: נכה இங்கு அடுத்து வரும் ‘ஆண்கள் அனைவரையும்’ என்பதுடன் உயிரைக் கொல்லும் இராணுவச் செயலைக் குறிக்கிறது. ‘கொன்றுபோட்டான்’ அதன் கடுமையை மழுங்கடிக்காமல் இயல்பான தமிழில் தருகிறது.
- source_word: כָּל זָכָר
  choice: ஆண்கள் அனைவரையும்
  rationale: זָכָר பாலினத்தைக் குறிப்பாகச் சுட்டுகிறது. ‘ஆண்கள் அனைவரையும்’ அதன் முழுமையான பரப்பையும் பாலினத் தன்மையையும் பாதுகாக்கிறது.
- source_word: בֶּאֱדוֹם
  choice: ஏதோமிலிருந்த
  rationale: ב இங்கு இடப்பொருளில் உள்ளது. ‘ஏதோமிலிருந்த’ என்பது அங்கிருந்த ஆண்களைக் குறிக்கிறது; ‘ஏதோம் முழுவதிலும்’ என மூலத்தைவிட விரிவாக்கவில்லை.
theological_decisions:
- issue: கடுமையான வரலாற்று வன்முறையை மழுங்கடிக்காமல் மொழிபெயர்த்தல்
  choice: ஏதோமிலிருந்த ஆண்கள் அனைவரையும் அவன் கொன்றுபோட்டான் என்ற நேரடியான அறிக்கையைத் தக்கவைத்தல்
  alternative: ‘ஏதோமியரைத் தோற்கடித்தான்’ என்று மென்மைப்படுத்துதல் அல்லது பிரதான உரையில் முழுமையான அழிப்பு என விரிவுபடுத்துதல்
  rationale: மூலம் உயிர்க்கொலைக்கான இராணுவச் செயலை நேரடியாகக் கூறுகிறது. அதன் கடுமையை மறைக்காமலும், வசனம் கூறுவதைத் தாண்டி விளக்காமலும் மொழிபெயர்க்கப்படுகிறது.
