  edition: WLC
  text: וַ/יֵּ֣לֶךְ שְׁלֹמֹ֔ה אַחֲרֵ֣י עַשְׁתֹּ֔רֶת אֱלֹהֵ֖י צִדֹנִ֑ים וְ/אַחֲרֵ֣י מִלְכֹּ֔ם שִׁקֻּ֖ץ עַמֹּנִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/005.yaml
  text: Solomon went after Ashtoreth[a], the god of the Sidonians, and after Milcom[c][b], the abomination of the Ammonites.
translation:
  language: ta
  text: சாலொமோன் சீதோனியரின் தெய்வமாகிய அஷ்தரோத்தை[a] பின்பற்றினார்; அம்மோனியரின் அருவருப்பாகிய மில்கோமையும்[b] பின்பற்றினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அஷ்தரோத் என்பது ‘அஸ்தார்த்தே’ என்றும் பரவலாக அறியப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: சிலர் மில்கோமை மோலேக்குடன் தொடர்புபடுத்துகின்றனர்; ஆனால் இங்குள்ள எபிரெய மூலபாடம் ‘மில்கோம்’ என்றே வாசிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּלֶךְ ... אַחֲרֵי
  choice: பின்பற்றினார்
  rationale: הלך אחרי என்ற எபிரெய மரபுத்தொடர் வெறும் உடல்சார் நகர்வை அல்ல, பற்றுறுதி அல்லது வழிபாட்டில் ஒருவரைப் பின்பற்றுவதைக் குறிக்கிறது. ‘பின்பற்றினார்’ என்பது உருவகத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: עַשְׁתֹּרֶת
  choice: அஷ்தரோத்
  rationale: இந்த வசனத்தின் எபிரெய வடிவத்தை ஒலிபெயர்க்கிறது; பரவலாக அறியப்படும் ‘அஸ்தார்த்தே’ என்ற வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אֱלֹהֵי צִדֹנִים
  choice: சீதோனியரின் தெய்வம்
  rationale: אֱלֹהֵי என்பதன் மூல வடிவத் தெளிவின்மையைப் பாதுகாக்கவும், பெண்பால் என விளக்கமாகச் சேர்க்காமல் இருக்கவும் பொதுவான ‘தெய்வம்’ பயன்படுத்தப்படுகிறது.
- source_word: מִלְכֹּם
  choice: மில்கோம்
  rationale: மெய்யெழுத்து மூலபாடம் இங்கு மில்கோம் என வாசிப்பதால் அந்தப் பெயரே ஒலிபெயர்க்கப்படுகிறது; மோலேக்குடன் அதை ஒன்றாக்கவில்லை.
- source_word: שִׁקֻּץ עַמֹּנִים
  choice: அம்மோனியரின் அருவருப்பான தெய்வம்
  rationale: שִׁקֻּץ என்பது கடுமையாக வெறுக்கத்தக்க ஒன்றைக் குறிக்கும் இழிவுச்சொல்; இங்கு மில்கோம் எனும் வழிபாட்டுத் தெய்வமே சுட்டப்படுவதால், இயல்பான தமிழுக்காக ‘அருவருப்பான தெய்வம்’ என வழங்கப்படுகிறது.
theological_decisions:
- issue: சாலொமோனின் செயலை வழிபாடு என்று வெளிப்படையாகக் கூறுவதா
  choice: பின்பற்றினார்
  alternative: வழிபட்டார்
  rationale: சூழல் விக்கிரக வழிபாட்டைக் குறித்தாலும், வசனம் הלך אחרי என்ற ‘பின்பற்றுதல்’ மரபுத்தொடரையே பயன்படுத்துகிறது. ஆகவே மூலத்தின் உருவகமும் அதன் அளவான மறைபொருளும் காக்கப்படுகின்றன.
- issue: அஷ்தரோத்தை ‘தேவி’ என்று பாலினத்துடன் குறிப்பிடுவதா
  choice: தெய்வம்
  alternative: தேவி
  rationale: அஷ்தரோத் பெண் தெய்வம் என்ற வரலாற்றுத் தகவல் இருந்தாலும், இங்குள்ள אֱלֹהֵי என்ற சொல் இலக்கண வடிவில் பாலினத்தை வெளிப்படையாகக் குறிக்கவில்லை; எனவே மூலப்பாடத்தின் வடிவத்தை மீறிய விளக்கத்தை முதன்மை உரையில் தவிர்க்கிறது.
translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, கண்ணியமான மற்றும் பொதுவாசகர்களுக்குப் புரியும் நடை. ‘பின்பற்றினார்’ என்ற சொல்லை இருமுறை பயன்படுத்துவது எபிரெய இணை அமைப்பையும் இரு தெய்வங்களிடத்திலான பற்றுறுதியையும் தெளிவாக்குகிறது.
