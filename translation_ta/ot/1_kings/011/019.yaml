base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/019.yaml
  text: Hadad found great favor in Pharaoh’s eyes[a], and he gave him as a wife the sister of his own wife[b], the sister of Tahpenes the queen mother.
translation:
  language: ta
  text: ஆதாத் பார்வோனின் பார்வையில் மிகுந்த தயவு பெற்றான். பார்வோன் தன் மனைவியின் சகோதரியை[a]—அரசவையின் தலைமைப் பெண்மணியான தக்பெனேசின் சகோதரியை[b]—ஆதாத்துக்கு மனைவியாகக் கொடுத்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தன் மனைவி’ என்பது பார்வோனின் மனைவியைக் குறிப்பதாகச் சூழல் காட்டுகிறது. குறைவான சாத்தியமுள்ள மற்றொரு புரிதலின்படி, அது ஆதாத்தின் மனைவியைக் குறிக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: எபிரெயத்தில், ‘தலைமைப் பெண்மணி.’ இது பொதுவாக அரச அன்னையையோ அரசவையின் முதன்மைப் பெண்மணியையோ குறிக்கும் பட்டம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְצָא ... חֵן בְּעֵינֵי ... מְאֹד
  choice: பார்வையில் மிகுந்த தயவு பெற்றான்
  rationale: ‘ஒருவரின் கண்களில் தயவு காணுதல்’ என்ற எபிரெய மரபுத்தொடரின் உருவகத்தை இயல்பான நவீன தமிழில் காக்கிறது; מְאֹד என்பதன் வலியுறுத்தலை ‘மிகுந்த’ வெளிப்படுத்துகிறது.
- source_word: פַרְעֹה
  choice: பார்வோன்
  rationale: எகிப்திய அரச பட்டத்திற்கான தமிழில் நிலைபெற்ற வேதாகமப் பெயர்ப்பு.
- source_word: וַיִּתֶּן לוֹ אִשָּׁה
  choice: ஆதாத்துக்கு மனைவியாகக் கொடுத்தான்
  rationale: கொடுப்பது திருமணத்திற்காக என்பதைக் கட்டுமானம் குறிக்கிறது. தெளிவுக்காக לוֹ என்ற பிரதிப்பெயருக்குப் பதிலாக ‘ஆதாத்துக்கு’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: אֶת אֲחוֹת אִשְׁתּוֹ
  choice: தன் மனைவியின் சகோதரியை
  rationale: சூழலில் ‘தன்’ என்பது பார்வோனைக் குறிப்பதாக இயல்பாகப் புரிகிறது; அதேவேளையில் மூலத்தின் பிரதிப்பெயர் அமைப்பையும் காக்கிறது.
- source_word: אֲחוֹת תַּחְפְּנֵיס
  choice: தக்பெனேசின் சகோதரியை
  rationale: முன்னர் கூறப்பட்ட பெண் யார் என்பதை இணைநிலையாக விளக்கும் சொற்றொடர்.
- source_word: הַגְּבִירָה
  choice: அரசகுலத்தின் தலைவியான
  rationale: இந்தப் பெண் உயர்ந்த அரசகுலப் பதவி வகித்ததைத் தெரிவிக்கிறது; ‘அரச அன்னை’ என்று மட்டும் மொழிபெயர்த்து, எகிப்திய அரசவையில் துல்லியமாக நிரூபிக்க முடியாத பதவியைத் தீர்மானிப்பதைத் தவிர்க்கிறது.
theological_decisions:
- issue: ‘அவனுடைய மனைவி’ என்பதிலுள்ள பிரதிப்பெயரின் குறிப்பு
  choice: பார்வோனின் மனைவி
  alternative: ஆதாத்தின் மனைவி
  rationale: வாக்கியத்தின் செய்பவர் பார்வோன் என்பதும், தொடர்ந்து வரும் ‘தக்பெனேசின் சகோதரி’ என்ற அடையாளமும் பார்வோனையே குறிப்பதாக வலுவாகச் சுட்டுகின்றன. குறைவான சாத்தியமுள்ள மாற்றுப் புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- issue: הַגְּבִירָה என்ற அரசகுலப் பட்டத்தின் பொருள்
  choice: அரசகுலத்தின் தலைவி
  alternative: அரச அன்னை; முதன்மை அரசப் பெண்; அரசி
  rationale: இச்சொல் உயர்ந்த அரசகுலப் பெண்ணைக் குறிக்கும் பட்டம்; பல வேதாகமச் சூழல்களில் ‘அரச அன்னை’ எனப் பொருள்படலாம். ஆனால் எகிப்திய அரசவையில் அதன் துல்லியமான பதவி நிச்சயமில்லாததால் முதன்மை உரை பரந்த பொருளை வைத்திருக்கிறது.
translation_notes:
  register: நவீனத் தரத்தமிழில், பொதுவாசகருக்குப் புரியும் மரியாதைமிக்க நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘பார்வையில் தயவு பெற்றான்’ என்ற சொற்றொடர் எபிரெய உருவகத்தையும் இயல்பான தமிழையும் சமநிலைப்படுத்துகிறது. பெயர்கள் ‘ஆதாத்,’ ‘பார்வோன்,’ ‘தக்பெனேஸ்’ எனத் தமிழில் வாசிக்க ஏற்றவாறு ஒலிபெயர்க்கப்பட்டுள்ளன.
