  text: וַ/יֹּ֨אמֶר יְהוָ֜ה לִ/שְׁלֹמֹ֗ה יַ֚עַן אֲשֶׁ֣ר הָֽיְתָה זֹּ֣את עִמָּ֔/ךְ וְ/לֹ֤א שָׁמַ֨רְתָּ֙ בְּרִיתִ֣/י וְ/חֻקֹּתַ֔/י אֲשֶׁ֥ר צִוִּ֖יתִי עָלֶ֑י/ךָ קָרֹ֨עַ אֶקְרַ֤ע אֶת הַ/מַּמְלָכָה֙ מֵֽ/עָלֶ֔י/ךָ וּ/נְתַתִּ֖י/הָ לְ/עַבְדֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/011.yaml
  text: So Yahweh said to Solomon[a], “Because this has been with you, and you have not kept my covenant and my statutes that I commanded you, I will surely tear the kingdom away from you and give it to your servant.”
translation:
  language: ta
  text: அப்போது யாவே சாலொமோனிடம், “இது உன்னோடு இருந்ததாலும்[a], நான் உனக்குக் கட்டளையிட்ட என் உடன்படிக்கையையும் என் சட்டங்களையும் நீ கடைப்பிடிக்காததாலும், நான் ராஜ்யத்தை உன்னிடமிருந்து நிச்சயமாகக் கிழித்தெடுத்து, அதை உன் பணியாளனுக்குக் கொடுப்பேன்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொல்லுக்குச் சொல்: “இது உன்னோடு இருந்ததால்.” இந்த எபிரெயச் சொற்றொடர் சாலொமோனிடம் நிலைபெற்றிருந்த நடத்தை அல்லது நிலையைக் குறிப்பதாக இருக்கலாம்.'
    reason: மூலச் சொற்றொடரின் சுருக்கத்தையும் அதன் சாத்தியமான சூழல்சார் பொருளையும் காட்டும் மொழியியல் மாற்றுவாசிப்பு.
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பட்டத்தைப் பதிலிடாமல், எபிரெயத் திருப்பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பைப் பயன்படுத்துகிறது.
- source_word: יַעַן אֲשֶׁר
  choice: —தால் / —தாலும்
  rationale: தீர்ப்புக்கான காரணத்தை இயல்பான தமிழ் காரண விகுதிகளால் தெளிவாகக் காட்டுகிறது.
- source_word: הָיְתָה זֹּאת עִמָּךְ
  choice: இது உன்னிடம் இருந்ததாலும்
  rationale: எபிரெய மொழியின் சுருக்கமான, தெளிவுபடுத்தப்படாத சொற்றொடரை மிகையாக விளக்காமல் நெருக்கமாகப் பாதுகாக்கிறது; அதன் சூழல்சார் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: שָׁמַרְתָּ
  choice: கடைப்பிடிக்காததாலும்
  rationale: உடன்படிக்கையையும் சட்டங்களையும் காத்து நடப்பது என்ற உடன்படிக்கைச் சூழலுக்கேற்ற இயல்பான நவீன தமிழ்.
- source_word: בְּרִיתִי
  choice: என் உடன்படிக்கை
  rationale: בְּרִית என்பதன் உறவுசார் மற்றும் சட்டப்பூர்வமான கனத்தைப் பாதுகாக்கும் நிலையான தமிழ் சொல்.
- source_word: חֻקֹּתַי
  choice: என் சட்டங்கள்
  rationale: கடவுள் விதித்த கட்டுப்பாடுகளைக் குறிக்கும் தெளிவான, பொதுவாகப் புரியும் தமிழ்.
- source_word: צִוִּיתִי עָלֶיךָ
  choice: நான் உனக்குக் கட்டளையிட்ட
  rationale: எபிரெய முன்னிடைச்சொல் அமைப்பை இயல்பான தமிழில் வழங்கி, கட்டளையின் வலிமையைப் பாதுகாக்கிறது.
- source_word: קָרֹעַ אֶקְרַע
  choice: நிச்சயமாகக் கிழித்தெடுத்து
  rationale: வினைமுற்றுக்கு முன் வரும் வினையெச்சத்தின் வலியுறுத்தலை ‘நிச்சயமாக’ என்பதும், קרע என்பதன் கிழித்தல் உருவகத்தை ‘கிழித்தெடுத்து’ என்பதும் பாதுகாக்கின்றன.
- source_word: הַמַּמְלָכָה
  choice: ராஜ்யம்
  rationale: இங்கு சாலொமோனின் ஆட்சிப்பரப்பையும் அரசுரிமையையும் குறிக்கும் பரவலாக அறியப்பட்ட சொல்.
- source_word: מֵעָלֶיךָ
  choice: உன்னிடமிருந்து
  rationale: சாலொமோனின் ஆளுகையிலிருந்து ராஜ்யம் அகற்றப்படுவதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: לְעַבְדֶּךָ
  choice: உன் பணியாளனுக்கு
  rationale: இங்கு அரசவைக்குக் கீழ்ப்பட்ட ஒருவரைக் குறிப்பதால், அடிமைத்தனத்தைத் தேவையின்றி வலியுறுத்தாத நவீன சொல் தேர்ந்தெடுக்கப்பட்டது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை வழங்குதல்
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட இறைப்பெயர் நேரடியாக வருவதால், பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்க்கப்படுகிறது.
- issue: הָיְתָה זֹּאת עִמָּךְ என்ற சொற்றொடரின் பொருள்
  choice: இது உன்னிடம் இருந்ததாலும்
  alternative: இது உன் வழக்கமாக இருந்ததாலும்; இப்படிப்பட்ட நிலை உன்னிடம் இருந்ததாலும்
  rationale: சூழலில் இது சாலொமோனின் நிலை அல்லது தொடர்ந்த நடத்தையைக் குறிக்கலாம்; ஆனால் மூலத்தின் சுருக்கத்தையும் உண்மையான பொருள் விரிவையும் பிரதான உரை தீர்த்துவிடாமல் பாதுகாக்கிறது.
- issue: ராஜ்யத்தை ‘கிழித்தெடுக்கும்’ உருவகம்
  choice: நிச்சயமாகக் கிழித்தெடுத்து
  alternative: நிச்சயமாகப் பறித்து
  rationale: தீர்ப்பின் உறுதியையும், ராஜ்யம் பிளக்கப்படப்போவதை முன்குறிக்கும் மூல உருவகத்தையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடையில் அமைக்கப்பட்டது. உடன்படிக்கைச் சொற்களின் கனமும், தீர்ப்பின் வலியுறுத்தலும், ‘கிழித்தெடுக்கும்’ உருவகமும் காக்கப்பட்டுள்ளன; தெளிவில்லாத எபிரெயச் சொற்றொடர் பிரதான உரையில் மிகையாக விளக்கப்படவில்லை.
