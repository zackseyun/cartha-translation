revisions:
- from: 'அவன் யெரொபெயாமிடம், “உனக்காகப் பத்துத் துண்டுகளை எடுத்துக்கொள்[a]. ஏனெனில் இஸ்ரவேலின் கடவுளாகிய யாவே கூறுவது இதுவே: ‘இதோ, நான் சாலொமோனின் கையிலிருந்து அரசைப் பிய்த்து, பத்துக் கோத்திரங்களை உனக்குக் கொடுப்பேன்’” என்றான்.'
  to: 'அவன் யெரொபெயாமிடம், “உனக்காகப் பத்துத் துண்டுகளை எடுத்துக்கொள்[a]. ஏனெனில் இஸ்ரவேலின் கடவுளாகிய யாவே கூறுவது இதுவே: ‘இதோ, நான் சாலொமோனின் கையிலிருந்து அரசாட்சியைப் பிய்த்தெடுக்கிறேன்; பத்துக் கோத்திரங்களை உனக்குக் கொடுப்பேன்’” என்றான்.'
  rationale: The revision retains all lexical and theological choices of the draft while restoring the Hebrew contrast between the vivid tearing action and the future gift. It also replaces the potentially ambiguous «அரசு» with «அரசாட்சி» for the kingdom/royal-rule sense.
