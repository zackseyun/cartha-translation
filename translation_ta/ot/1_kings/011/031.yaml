  text: וַ/יֹּ֨אמֶר֙ לְ/יָֽרָבְעָ֔ם קַח לְ/ךָ֖ עֲשָׂרָ֣ה קְרָעִ֑ים כִּ֣י כֹה֩ אָמַ֨ר יְהוָ֜ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל הִנְ/נִ֨י קֹרֵ֤עַ אֶת הַ/מַּמְלָכָה֙ מִ/יַּ֣ד שְׁלֹמֹ֔ה וְ/נָתַתִּ֣י לְ/ךָ֔ אֵ֖ת עֲשָׂרָ֥ה הַ/שְּׁבָטִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/031.yaml
  text: 'And he said to Jeroboam[a], “Take for yourself ten pieces, for this is what Yahweh, the God of Israel, says: ‘Look, I am tearing the kingdom out of the hand of Solomon, and I will give you ten tribes.’”'
translation:
  language: ta
  text: 'அவன் யெரொபெயாமிடம், “உனக்காகப் பத்துத் துண்டுகளை எடுத்துக்கொள்[a]. ஏனெனில் இஸ்ரவேலின் கடவுளாகிய யாவே கூறுவது இதுவே: ‘இதோ, நான் சாலொமோனின் கையிலிருந்து அரசாட்சியைப் பிய்த்தெடுக்கிறேன்; பத்துக் கோத்திரங்களை உனக்குக் கொடுப்பேன்’” என்றான்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கிழிக்கப்பட்ட பத்துத் துண்டுகளை எடுத்துக்கொள்.” எபிரெயப் பெயர்ச்சொல் கிழிப்பதால் உருவான துண்டுகளைக் குறிக்கிறது; இது அகியா ஆடையைக் கிழித்த அடையாளச் செயலுடன் தொடர்புடையது.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח לְךָ
  choice: உனக்காகப் ... எடுத்துக்கொள்
  rationale: கַח என்ற கட்டளைச் சொல்லின் ‘எடுத்துக்கொள்’ என்ற பொருளையும், לְךָ தரும் தனிப்பட்ட ‘உனக்காக’ என்ற நுட்பத்தையும் இயல்பான தமிழில் காக்கிறது.
- source_word: קְרָעִים
  choice: துண்டுகள்
  rationale: קרע (‘பிய்/கிழி’) என்ற வேரிலிருந்து வந்த இச்சொல், அகியாவின் அடையாளச் செயலில் கிழிக்கப்பட்ட ஆடையின் துண்டுகளைக் குறிக்கிறது; ‘துண்டுகள்’ என்பது சூழலில் இயல்பான தமிழ்.
- source_word: כִּי כֹה אָמַר
  choice: ஏனெனில் ... கூறுவது இதுவே
  rationale: தீர்க்கதரிசன அறிவிப்பு வாய்பாட்டின் பொருளை நவீன, வாசிக்க எளிய தமிழில் தருகிறது; כִּי-யின் காரணத் தொடர்பையும் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பட்டத்தால் மாற்றாமல், எபிரெய தனிப்பெயரான நான்கெழுத்துப் பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கடவுளாகிய
  rationale: யாவேவை இஸ்ரவேலின் கடவுளாக அடையாளப்படுத்தும் இணைப்புச் சொற்றொடரை இயல்பான தமிழில் தருகிறது.
- source_word: הִנְנִי
  choice: இதோ, நான்
  rationale: கவனத்தை ஈர்த்து உடனடியான செயலை முன்வைக்கும் எபிரெயச் சொல்லின் வலிமையை, பழமையான நடையின்றி காக்கிறது.
- source_word: קֹרֵעַ
  choice: பிய்த்து
  rationale: தீர்க்கதரிசன உரையில் நிகழ்காலப் பங்கேற்புச் சொல் தரும் உயிரோட்டமான, நிச்சயமான செயலைக் காட்டுகிறது; அரசை ஒருவரின் பிடியிலிருந்து வலுக்கட்டாயமாகப் பிரிக்கும் உருவகத்துக்கும் பொருந்துகிறது.
- source_word: הַמַּמְלָכָה
  choice: அரசை
  rationale: இங்கு ஆட்சிக்குட்பட்ட ராஜ்யம் அல்லது அரசு என்பதைக் குறிக்கிறது; ‘அரசு’ நவீன தமிழில் சுருக்கமாகவும் தெளிவாகவும் உள்ளது.
- source_word: מִיַּד שְׁלֹמֹה
  choice: சாலொமோனின் கையிலிருந்து
  rationale: அதிகாரம் அல்லது உடைமையிலிருந்து அகற்றுவதைக் குறிக்கும் எபிரெய உருவகத்தில் உள்ள ‘கை’ என்பதைக் காக்கிறது.
- source_word: וְנָתַתִּי לְךָ
  choice: உனக்குக் கொடுப்பேன்
  rationale: முதல் நபர் எதிர்காலச் செயலையும் அதன் பெறுநரையும் இயல்பான தமிழில் நேரடியாகத் தருகிறது.
- source_word: עֲשָׂרָה הַשְּׁבָטִים
  choice: பத்துக் கோத்திரங்களை
  rationale: இஸ்ரவேலின் பத்து குல-அரசியல் பிரிவுகளைக் குறிக்கும் நிலைபெற்ற வேதாகமச் சொல்லாக ‘கோத்திரங்கள்’ பயன்படுத்தப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூல வசனம் இறைவனின் தனிப்பெயரை நேரடியாகப் பயன்படுத்துவதால், பட்டப்பெயரால் மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டது.
- issue: קֹרֵעַ என்பதன் காலத் தன்மை
  choice: நான் ... பிய்த்து ... கொடுப்பேன்
  alternative: நான் ... பிய்த்துக்கொண்டிருக்கிறேன்
  rationale: எபிரெயப் பங்கேற்புச் சொல் நிகழும் அல்லது மிக அண்மையில் நிச்சயமாக நிகழவிருக்கும் தீர்க்கதரிசனச் செயலை உயிரோட்டமாகக் காட்டுகிறது. தமிழில் அடுத்துள்ள ‘கொடுப்பேன்’ என்பதோடு இயல்பாக இணைக்க, செயற்பெயரெச்ச வடிவம் பயன்படுத்தப்பட்டது; செயல் வெறும் தொலைதூர வாய்ப்பாக மாற்றப்படவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பான, கண்ணியமான வேதாகம நடை பயன்படுத்தப்பட்டுள்ளது. ‘இதோ’ தீர்க்கதரிசன அறிவிப்பின் உடனடித் தன்மையைத் தக்கவைக்கிறது; ‘கையிலிருந்து’ என்ற எபிரெய உருவகம் பாதுகாக்கப்பட்டுள்ளது. வசனத்தின் பேச்சாளர் முந்தைய சூழலில் தெளிவாக இருப்பதால், மூலத்தின் ‘அவன்’ அப்படியே வைக்கப்பட்டுள்ளது.
