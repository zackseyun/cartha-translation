base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/041.yaml
  text: The rest of the acts of Solomon[a], and all that he did, and his wisdom—are they not written in the Book of the Acts of Solomon?
translation:
  language: ta
  text: சாலொமோனின் மற்ற செயல்களும், அவர் செய்த அனைத்தும், அவருடைய ஞானமும் சாலொமோனின் செயல்களின் நூலில்[a] எழுதப்பட்டிருக்கின்றன அல்லவா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சாலொமோனின் வரலாற்றுப் பதிவுகளின் நூல்.” எபிரேயத் தலைப்பில் சொல்லளவில் “சாலொமோனின் வார்த்தைகள்/காரியங்கள்” என்று உள்ளது; இது அவரது செயல்களைப் பற்றிய பதிவைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי שְׁלֹמֹה
  choice: சாலொமோனின் மற்ற செயல்களும்
  rationale: יֶתֶר என்பது மீதமுள்ளவற்றைக் குறிக்கிறது. அரசாட்சி நிறைவுச் சுருக்கங்களில் דִּבְרֵי என்பது வெறும் ‘வார்த்தைகள்’ அல்லாமல் அரசனின் செயல்கள் அல்லது ஆட்சிச் சம்பவங்களைக் குறிக்கும் மரபுத்தொடராக இருப்பதால் ‘மற்ற செயல்கள்’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: அவர் செய்த அனைத்தும்
  rationale: עשה என்ற பொதுவான வினையின் பரந்த பொருளைச் சுருக்காமலும் சாதனை என்ற கூடுதல் கருத்தைச் சேர்க்காமலும் நேரடியாகக் கூறுகிறது.
- source_word: וְחָכְמָתוֹ
  choice: அவருடைய ஞானமும்
  rationale: பெயர்ச்சொல்லையும் அதனுடன் இணைந்த மூன்றாம் நபர் உரிமைப் பின்னொட்டையும் நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: הֲלוֹא הֵם כְּתֻבִים
  choice: எழுதப்பட்டிருக்கின்றன அல்லவா?
  rationale: உறுதிப்படுத்தும் பதிலை எதிர்பார்க்கும் எபிரேய வினாவடிவத்தைத் தமிழிலும் சொல்லாட்சிச் சிறப்புடைய வினாவாகப் பாதுகாக்கிறது. பன்மை எழுவாய்களுக்கு ஏற்ப ‘எழுதப்பட்டிருக்கின்றன’ பயன்படுத்தப்பட்டது.
- source_word: עַל סֵפֶר
  choice: நூல் … என்பதில்
  rationale: சொல்லளவில் ‘நூல்/சுருளின் மேல்’ என்றிருந்தாலும், ஓர் ஆவணத்தில் பதிவு செய்யப்பட்டிருப்பதை நவீன தமிழில் இயல்பாக ‘நூலில்’ எனக் கூறுவது பொருத்தமானது.
- source_word: סֵפֶר דִּבְרֵי שְׁלֹמֹה
  choice: “சாலொமோனின் செயல்களின் நூல்”
  rationale: இது சாலொமோனின் ஆட்சியைப் பதிவு செய்த ஆதார ஆவணத்தின் தலைப்பாகத் தெரிகிறது. דִּבְרֵי என்பதற்கு இச்சூழலில் ‘செயல்கள்’ என்பது வெளிப்படையான, புரிந்துகொள்ளத்தக்க இணைச்சொல்; ‘நாளாகமம்’ என்று மொழிபெயர்த்தால் வேதாகமத்தின் நாளாகம நூல்களோடு குழப்பம் ஏற்படலாம்.
