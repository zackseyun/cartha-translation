translation_notes:
  register: நவீன பொதுத்தமிழில், வரலாற்று நூலுக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரேய வாக்கியத்தின் சொல்லாட்சிச் சிறப்புடைய வினா வடிவமும், சாலொமோனின் செயல்கள் மற்றும் ஞானம் தனித்தனி முக்கியப் பொருட்களாகக் குறிப்பிடப்படுவதும் பாதுகாக்கப்பட்டுள்ளன.
