- source_word: יַטּוּ אֶת לְבַבְכֶם אַחֲרֵי אֱלֹהֵיהֶם
  choice: உங்கள் உள்ளத்தைத் தங்கள் தெய்வங்களைப் பின்பற்றும்படி திருப்பிவிடுவார்கள்
  rationale: ‘உள்ளத்தைத் திருப்புதல்’ என்ற உருவகத்தையும், אַחֲרֵי என்பதிலுள்ள பின்செல்லும் பக்திசார் கருத்தையும் தெளிவான தமிழில் ஒருங்கிணைக்கிறது.
- source_word: בָּהֶם דָּבַק שְׁלֹמֹה לְאַהֲבָה
  choice: அந்த நாட்டுப் பெண்கள்மீது சாலொமோன் அன்புகொண்டு அவர்களோடு பற்றிக்கொண்டான்
  rationale: דבק என்பதன் வலுவான பற்றுதலை ‘பற்றிக்கொண்டான்’ என்றும், לְאַהֲבָה என்பதன் அன்புசார் நோக்கு/முறையை ‘அன்புகொண்டு’ என்றும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: தடை திருமணத்தை நேரடியாகக் குறிக்கிறதா?
  choice: மூலத்தின் பொதுவான ‘அவர்களுக்குள் செல்லுதல் / உங்களுக்குள் வருதல்’ என்ற மொழியை முதன்மை உரையில் வைத்தல்
  alternative: ‘அவர்களோடு கலப்புத் திருமணம் செய்யாதீர்கள்; அவர்களும் உங்களோடு செய்யக்கூடாது’ என்று வெளிப்படையாக மொழிபெயர்த்தல்
  rationale: சூழல் அந்நியத் திருமணங்களைத் தெளிவாகக் குறித்தாலும், இவ்வசனத்தின் எபிரெயச் சொற்கள் பொதுவான உருவக மொழியையே பயன்படுத்துகின்றன. ஆகவே அந்த விரிவையும் இறையியல் அழுத்தத்தையும் முதன்மை உரை காக்கிறது; சூழல்சார் விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: בְּנֵי יִשְׂרָאֵל என்பதன் பாலின மற்றும் சமூகக் குறிப்பு
  choice: இஸ்ரவேல் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரெய வழக்கில் இது தேசமாகிய உடன்படிக்கை மக்களைக் கூட்டாகக் குறிக்கிறது. தமிழில் சொற்படியான ‘மகன்கள்’ பெண்களைத் தவறாக விலக்கிக் காட்டக்கூடும்; ‘மக்கள்’ என்பது இங்குள்ள குறிப்பு எல்லையை நம்பிக்கையுடன் வழங்குகிறது.
- issue: בָּהֶם என்பதன் குறிப்பு
  choice: சூழலின் அடிப்படையில் அந்த நாட்டுப் பெண்கள் என்று வெளிப்படுத்தல்
  alternative: ‘அவர்களோடு’ என்று மட்டும் வைத்து அது நாட்டினரையா பெண்களையா குறிக்கிறது என்பதைத் திறந்துவைத்தல்
  rationale: இது முந்தைய வசனத்தில் பட்டியலிடப்பட்ட பெண்களைத் தொடர்ந்து குறிக்கிறது; தமிழில் தனி வசனமாக வாசிக்கும்போது குழப்பம் வராதபடி உடனடி சூழலின் குறிப்புப் பொருள் வெளிப்படுத்தப்பட்டது.
translation_notes:
  register: நவீன செந்தமிழை அடிப்படையாகக் கொண்ட, பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. வசனம் முந்தைய வசனத்தின் இலக்கணத் தொடராக இருந்தாலும், தமிழில் வாசிக்க இயல்பாக வாக்கிய அமைப்பு மறுசீரமைக்கப்பட்டது. மூலத்தின் உருவகத் தடையை முதன்மை உரை பாதுகாக்கிறது; திருமணச் சூழல் அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
