  yaml_path: translation/ot/1_kings/011/002.yaml
  text: from the nations about which Yahweh had said to the sons of Israel[a], “You shall not go in among them, and they shall not come in among you; surely they will turn your heart after their gods”—to these Solomon clung in love.
translation:
  language: ta
  text: யாவே இஸ்ரவேல் மக்களிடம்[a], “நீங்கள் அவர்களிடையே செல்லக்கூடாது; அவர்களும் உங்களிடையே வரக்கூடாது; நிச்சயமாக அவர்கள் உங்கள் இதயத்தைத் தங்கள் தெய்வங்களைப் பின்பற்றும்படி திருப்பிவிடுவார்கள்” என்று கூறியிருந்த அந்த நாட்டினரிடமே சாலொமோன் அன்போடு பற்றிக்கொண்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சூழலுக்கு ஏற்ப இதை இன்னும் வெளிப்படையாக, “நீங்கள் அவர்களோடு திருமணம் செய்துகொள்ளக்கூடாது; அவர்களும் உங்களோடு திருமணம் செய்துகொள்ளக்கூடாது” என்று புரிந்துகொள்ளலாம். எபிரெயத்தில் சொல்லுக்குச் சொல், “நீங்கள் அவர்களிடையே செல்லக்கூடாது; அவர்களும் உங்களிடையே வரக்கூடாது” என்று உள்ளது.
    reason: lexical_alternative
