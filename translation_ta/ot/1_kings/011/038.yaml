  text: וְ/הָיָ֗ה אִם תִּשְׁמַע֮ אֶת כָּל אֲשֶׁ֣ר אֲצַוֶּ/ךָ֒ וְ/הָלַכְתָּ֣ בִ/דְרָכַ֗/י וְ/עָשִׂ֨יתָ הַ/יָּשָׁ֤ר בְּ/עֵינַ/י֙ לִ/שְׁמ֤וֹר חֻקּוֹתַ/י֙ וּ/מִצְוֺתַ֔/י כַּ/אֲשֶׁ֥ר עָשָׂ֖ה דָּוִ֣ד עַבְדִּ֑/י וְ/הָיִ֣יתִי עִמָּ֗/ךְ וּ/בָנִ֨יתִי לְ/ךָ֤ בַֽיִת נֶאֱמָן֙ כַּ/אֲשֶׁ֣ר בָּנִ֣יתִי לְ/דָוִ֔ד וְ/נָתַתִּ֥י לְ/ךָ֖ אֶת יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/038.yaml
  text: And it shall be[a], if you listen to all that I command you, and walk in my ways, and do what is right in my eyes by keeping my statutes and my commandments, as David my servant did, then I will be with you and build for you a faithful house, just as I built for David, and I will give Israel to you.
translation:
  language: ta
  text: நான் உனக்குக் கட்டளையிடும் அனைத்திற்கும் நீ செவிகொடுத்து, என் வழிகளில் நடந்து, என் ஊழியனாகிய தாவீது செய்ததுபோல் என் நியமங்களையும் கட்டளைகளையும் கடைப்பிடித்து, என் பார்வையில் நேர்மையானதைச் செய்தால், நான் உன்னோடு இருந்து, தாவீதுக்குக் கட்டியதுபோல் உனக்கும் நிலையான ஒரு வீட்டைக்[a] கட்டுவேன்; இஸ்ரவேலை உனக்குத் தருவேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு “வீடு” என்பது நிலைத்திருக்கும் அரச வம்சத்தைக் குறிக்கிறது. “நிலையான ஒரு வீடு” என்பதை “உறுதியான ஒரு வீடு” அல்லது “நம்பத்தகுந்த ஒரு வீடு” என்றும் மொழிபெயர்க்கலாம்.
    reason: בַּיִת נֶאֱמָן என்ற சொற்றொடரில் ‘வீடு’ அரச வம்சத்தைச் சுட்டுகிறது; נֶאֱמָן என்பதன் உறுதி, நம்பகத்தன்மை, நீடித்திருத்தல் ஆகிய பொருள் நிழல்களை அடிக்குறிப்பு விளக்குகிறது.
lexical_decisions:
- source_word: תִּשְׁמַע
  choice: செவிகொடுத்து
  rationale: שׁמע என்பதில் கேட்பதும் அதற்குக் கீழ்ப்படிவதும் இணைந்துள்ளன. தொடர்ந்து வரும் கீழ்ப்படிதல் சார்ந்த கூறுகள் அதன் வலிமையை வெளிப்படுத்துவதால், செவிசாய்த்துக் கேட்பதைக் குறிக்கும் உருவகம் தமிழிலும் காக்கப்படுகிறது.
- source_word: וְהָלַכְתָּ בִדְרָכַי
  choice: என் வழிகளில் நடந்து
  rationale: உடன்படிக்கைச் சூழலின் வாழ்க்கைநெறி உருவகத்தை நேரடியாகவும் இயல்பாகவும் காக்கிறது.
- source_word: הַיָּשָׁר בְּעֵינַי
  choice: என் பார்வையில் நேர்மையானதை
  rationale: தேவனுடைய மதிப்பீட்டின்படி சரியானதைச் செய்வது என்ற எபிரெய மரபுத்தொடரின் பொருளையும் பார்வை உருவகத்தையும் காக்கிறது.
- source_word: לִשְׁמֹר
  choice: கடைப்பிடித்து
  rationale: நியமங்களையும் கட்டளைகளையும் கவனமாகப் பேணி நடப்பது என்ற சூழல்சார் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: חֻקּוֹתַי
  choice: என் நியமங்கள்
  rationale: உடன்படிக்கை மற்றும் சட்டச் சூழலில் நிலைநாட்டப்பட்ட விதிமுறைகளைக் குறிக்கும் மரியாதையான, புரியக்கூடிய தமிழ்ச் சொல்.
- source_word: מִצְוֺתַי
  choice: என் கட்டளைகள்
  rationale: தெய்வீக ஆணைகளைக் குறிக்கும் தெளிவான வழக்குச் சொல்; முன் வரும் வினைச்சொல்லுடனான தொடர்பையும் காக்கிறது.
- source_word: עַבְדִּי
  choice: என் பணியாளன்
  rationale: தாவீதின் தேவசேவையையும் மரியாதைக்குரிய உடன்படிக்கை நிலையையும் வெளிப்படுத்துகிறது; இங்கு முதன்மையல்லாத சமூக அடிமைத்தனப் பொருளைத் தவிர்க்கிறது.
- source_word: בַיִת נֶאֱמָן
  choice: நிலையான ஒரு வீடு
  rationale: בַיִת என்ற வேதாகம உருவகத்தை காத்தபடி, נֶאֱמָן தரும் உறுதி மற்றும் நீடித்திருக்கும் தன்மையை வெளிப்படுத்துகிறது. அரச வம்சம் என்ற பொருள் அடிக்குறிப்பில் தெளிவாக்கப்படுகிறது.
- source_word: וְנָתַתִּי לְךָ אֶת יִשְׂרָאֵל
  choice: இஸ்ரவேலை உனக்குத் தருவேன்
  rationale: இஸ்ரவேல் தேவனால் அரசாட்சிக்காக அளிக்கப்படுவது என்ற நேரடியான இலக்கண அமைப்பையும் வலியுறுத்தலையும் காக்கிறது.
theological_decisions:
- issue: வாக்குத்தத்தத்தில் ‘வீடு’ என்பதன் பொருள்
  choice: மூலத்தின் ‘வீடு’ உருவகத்தை முதன்மை உரையில் காத்து, அது நிலையான அரச வம்சத்தைக் குறிக்கிறது என்று அடிக்குறிப்பில் விளக்குதல்
  alternative: அரண்மனை அல்லது கட்டிடம் என்ற நேரடிப் பொருள்; அல்லது முதன்மை உரையிலேயே ‘அரச வம்சம்’ என்று மாற்றுதல்
  rationale: தாவீதுக்குக் கட்டிய ‘வீடு’ என்பதுடனான ஒப்பீடும் அரச வாரிசுரிமைச் சூழலும் வம்சத்தையே சுட்டுகின்றன. அதேவேளையில், ‘வீடு’ என்ற மூல உருவகத்தையும் தாவீதிய வாக்குத்தத்தத்துடனான தொடர்பையும் மொழிபெயர்ப்பு காக்கிறது.
- issue: வாக்குத்தத்தத்தின் நிபந்தனைத் தன்மை
  choice: யெரொபெயாமின் செவிகொடுத்தல், நடத்தல், கடைப்பிடித்தல் ஆகியவற்றைத் தொடர்ந்து வரும் உண்மையான நிபந்தனை வாக்குத்தத்தமாக மொழிபெயர்த்தல்
  alternative: கீழ்ப்படிதலைப் பொருட்படுத்தாத நிபந்தனையற்ற அருள்வாக்காக மொழிபெயர்த்தல்
  rationale: אִם என்ற நிபந்தனைச் சொல்லும் அதனைத் தொடரும் கீழ்ப்படிதல் கூறுகளும் வாக்குத்தத்தத்தின் நிபந்தனையை வெளிப்படையாகக் காட்டுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதையான வேதாகம நடையைப் பயன்படுத்துகிறது. ‘வழிகளில் நடந்து’, ‘வீட்டைக் கட்டுவேன்’ போன்ற மூல உருவகங்கள் அவற்றின் வேதாகமத் தொடர்புகளுக்காகக் காக்கப்பட்டுள்ளன; ‘வீடு’ என்ற உருவகத்தின் வம்சப் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
