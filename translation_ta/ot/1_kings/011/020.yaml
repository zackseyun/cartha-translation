base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/020.yaml
  text: And the sister of Tahpenes bore him Genubath his son[a], and Tahpenes weaned him within Pharaoh’s house[b]; and Genubath was in Pharaoh’s house among the sons of Pharaoh.
translation:
  language: ta
  text: தக்பெனேசின் சகோதரி அவனுக்குக் கெனுபாத் என்னும் மகனைப் பெற்றாள்[a]. தக்பெனேஸ் பார்வோனின் அரண்மனையில் அவனுக்குப் பால்குடியை மறக்கச் செய்தாள்[b]. கெனுபாத் பார்வோனின் அரண்மனையில் பார்வோனின் மகன்களிடையே இருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதை, “தக்பெனேசின் சகோதரி அவனுக்கு கெனுபாத் என்ற மகனைப் பெற்றாள்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் வரிசை இரு வடிவங்களுக்கும் இடமளிக்கிறது; பொருள் மாறுவதில்லை.
    reason: lexical_alternative
  - marker: b
    text: “பால்குடியை மறக்கச் செய்தாள்” என்பது குழந்தை தாய்ப்பால் குடிப்பதை நிறுத்தும் பருவத்துக்குக் கொண்டுவரப்பட்டதைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וַתֵּלֶד לוֹ אֲחוֹת תַּחְפְּנֵיס
  choice: தக்பெனேசின் சகோதரி அவனுக்கு ... பெற்றாள்
  rationale: ילד உடன் வரும் לֹו என்பதன் பயனாளி/உறவு நுணுக்கத்தை ‘அவனுக்கு’ எனக் காத்து, இயல்பான தமிழ் வாக்கிய அமைப்பில் வழங்குகிறது.
- source_word: גְּנֻבַת בְּנוֹ
  choice: அவன் மகனாகிய கெனுபாத்
  rationale: בנו என்பதில் உள்ள வெளிப்படையான மகன் உறவைத் தக்கவைத்து, பெயரை நவீனத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: וַתִּגְמְלֵהוּ
  choice: அவனைப் பால்மறக்கச் செய்தாள்
  rationale: גמל இச்சூழலில் குழந்தையைத் தாய்ப்பாலிலிருந்து மறக்கச் செய்வதைக் குறிக்கிறது; பொதுவான ‘வளர்த்தாள்’ என்பதைக் காட்டிலும் மூலத்தின் குறிப்பான பொருளை இது காக்கிறது.
- source_word: בְּתוֹךְ בֵּית פַּרְעֹה
  choice: பார்வோனின் அரண்மனையில்
  rationale: בית־פרעה என்பது இங்கு அரச இருப்பிடத்தையும் அரச குடும்பச் சூழலையும் குறிக்கிறது; ‘அரண்மனை’ நவீனத் தமிழில் இடவுணர்வைத் தெளிவாக்குகிறது.
- source_word: וַיְהִי גְנֻבַת בֵּית פַּרְעֹה בְּתוֹךְ בְּנֵי פַרְעֹה
  choice: கெனுபாத் பார்வோனின் அரண்மனையில் பார்வோனின் மகன்களோடு வளர்ந்தான்
  rationale: எபிரெய உரையில் ‘இருந்தான்’ என்பதே நேரடி வடிவம்; ஆனால் குழந்தைப் பருவச் சூழலில் மகன்களிடையே அரண்மனையில் இருந்த நிலையை இயல்பான தமிழில் ‘வளர்ந்தான்’ என வெளிப்படுத்துகிறது. அடிக்குறிப்பு நேரடி வடிவைச் சுட்டுகிறது.
