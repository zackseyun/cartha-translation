translation_notes:
  register: நவீன, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘பார்வோனின் வீடு’ என்பதற்குப் பதிலாக சூழலுக்கேற்ற ‘பார்வோனின் அரண்மனை’ பயன்படுத்தப்பட்டது. இயல்பான தமிழுக்காக இறுதி היה ‘வளர்ந்தான்’ என வழங்கப்பட்டாலும், மூலத்தின் நேரடி ‘இருந்தான்’ வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
