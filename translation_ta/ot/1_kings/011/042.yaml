source:
  edition: WLC
  text: וְ/הַ/יָּמִ֗ים אֲשֶׁר֩ מָלַ֨ךְ שְׁלֹמֹ֤ה בִ/ירוּשָׁלִַ֨ם֙ עַל כָּל יִשְׂרָאֵ֔ל אַרְבָּעִ֖ים שָׁנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/042.yaml
  text: And the days that Solomon reigned in Jerusalem over all Israel were forty years.
translation:
  language: ta
  text: சாலொமோன் எருசலேமில் இஸ்ரவேல் முழுவதையும் அரசாண்ட காலம் நாற்பது ஆண்டுகள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/הַ/יָּמִים אֲשֶׁר
  choice: காலம்
  rationale: எபிரெய மொழியின் ‘அவர் அரசாண்ட நாட்கள்’ என்ற காலஅளவு மரபுத்தொடரை, இயல்பான நவீனத் தமிழில் ‘அரசாண்ட காலம்’ என்று வழங்குகிறது. தொடக்க வாவ் இங்கு முந்தைய உரையோடு இணைக்கும் பணியுடையது; தமிழில் தனியே ‘மேலும்’ எனச் சேர்ப்பது இயல்பற்றதால் வாக்கியத் தொடர்ச்சியிலேயே அது வெளிப்படுகிறது.
- source_word: מָלַךְ
  choice: அரசாண்ட
  rationale: கால் வினை இங்கு அரசராக ஆட்சி செய்ததைக் குறிக்கிறது; ‘அரசாண்ட’ என்பது சுருக்கமான, கண்ணியமான தமிழ் இணை.
- source_word: שְׁלֹמֹה
  choice: சாலொமோன்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் பெயர்வடிவம்.
- source_word: בִ/ירוּשָׁלִַם
  choice: எருசலேமில்
  rationale: בְּ இங்கு இடத்தைக் குறிக்கிறது; ‘-இல்’ அதற்கான இயல்பான தமிழ் வேற்றுமை உருபு.
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: இஸ்ரவேல் முழுவதையும்
  rationale: עַל அரச அதிகாரம் செலுத்தப்பட்ட மக்களைக் குறிக்கிறது. ‘இஸ்ரவேல் முழுவதையும் அரசாண்ட’ என்பது தேசியக் கூட்டுப்பொருளையும் முழுமையையும் இயல்பாகப் பாதுகாக்கிறது.
- source_word: אַרְבָּעִים שָׁנָה
  choice: நாற்பது ஆண்டுகள்
  rationale: ஆட்சிக்காலத்தின் நீளத்தைக் குறிக்கும் எண்-பெயர்ச்சொல் தொடரின் நேரான தமிழ் மொழிபெயர்ப்பு.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான அரசகாலச் சுருக்கமாக வடிவமைக்கப்பட்டது. மூலத்தின் பொருளையும் வாக்கிய உறவுகளையும் காக்கும் அதேவேளையில், ‘நாட்கள்’ என்ற எபிரெய மரபுத்தொடரை சொற்சொல்லாகக் கொடுக்காமல் தமிழில் இயல்பான ‘காலம்’ என வழங்குகிறது.
