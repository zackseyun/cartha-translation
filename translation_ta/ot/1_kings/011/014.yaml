source:
  edition: WLC
  text: וַ/יָּ֨קֶם יְהוָ֤ה שָׂטָן֙ לִ/שְׁלֹמֹ֔ה אֵ֖ת הֲדַ֣ד הָ/אֲדֹמִ֑י מִ/זֶּ֧רַע הַ/מֶּ֛לֶךְ ה֖וּא בֶּ/אֱדֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/014.yaml
  text: Then Yahweh raised up an adversary against Solomon[a], Hadad the Edomite; he was of the royal line in Edom.
translation:
  language: ta
  text: பின்பு யாவே சாலொமோனுக்கு எதிராக ஓர் எதிரியை எழுப்பினார்[a]. அவன் ஏதோமியனான ஆதாத்; அவன் ஏதோமின் அரச வம்சத்தைச் சேர்ந்தவன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சாத்தான் (satan) என்ற சொல் உள்ளது; இங்கு அது தனிப்பெயரான “சாத்தான்” என்பதைக் குறிக்காமல், “எதிரி” அல்லது “எதிர்ப்பவன்” என்று பொருள்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: எழுப்பினார்
  rationale: קום என்பதன் ஹிஃபில் வடிவம் ஒருவரை எழும்பச் செய்வதை அல்லது எதிர்ப்பாளராகத் தோன்றச் செய்வதை உணர்த்துகிறது. “எழுப்பினார்” என்பது இறைச் செயலைத் தெளிவாகக் காக்கிறது; முறையான நியமனம் என்று மிகையாக விளக்குவதில்லை.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கெழுத்துத் திருப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் இயல்பாக ஒலிபெயர்த்து இறைவனின் தனிப்பெயராக வழங்குகிறது.
- source_word: שָׂטָן
  choice: ஓர் எதிரி
  rationale: இங்கு இச்சொல் தனிப்பெயரான “சாத்தான்” அல்ல; எதிர்ப்பவன் அல்லது பகைவன் என்ற பொதுப்பெயர். “ஓர் எதிரி” என்பது அந்தப் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: לִשְׁלֹמֹה
  choice: சாலொமோனுக்கு எதிராக
  rationale: שָׂטָן என்பதுடன் வரும் לְ, யாருக்கு எதிரானவன் என்பதைச் சுட்டுகிறது. தமிழில் “சாலொமோனுக்கு எதிராக” என்பது உறவைத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: הֲדַד הָאֲדֹמִי
  choice: ஏதோமியனான ஆதாத்
  rationale: தனிப்பெயரும் இன/நாட்டுச் சார்பும் தமிழில் இயல்பான அடைமொழித் தொடராக வழங்கப்படுகின்றன.
- source_word: מִזֶּרַע הַמֶּלֶךְ
  choice: அரச வம்சத்தைச் சேர்ந்தவன்
  rationale: சொல்லுக்குச் சொல் “அரசனின் விதையிலிருந்து” என்றாலும், இது அரச மரபுவழிப் பிறப்பைக் குறிக்கும் எபிரெய மரபுத்தொடர். தேர்ந்தெடுத்த வடிவம் அதன் மரபியல் கருத்தை நவீன தமிழில் தெளிவாகக் கூறுகிறது.
- source_word: הוּא בֶּאֱדוֹם
  choice: அவன் ஏதோமின் ... சேர்ந்தவன்
  rationale: வலியுறுத்தும் הוּא தனியே “அவன்” எனக் காக்கப்படுகிறது; בֶּאֱדוֹם முந்திய அரச வம்சம் ஏதோமுக்குரியது என்பதை இயல்பான தமிழில் இணைத்துக் காட்டுகிறது.
theological_decisions:
- issue: இந்த வசனத்தில் שָׂטָן என்பதன் பொருள்
  choice: தனிப்பெயர் அல்லாத “எதிரி”
  alternative: “சாத்தான்” என்ற தனிப்பெயர்
  rationale: இலக்கணமும் சூழலும் ஆதாத் என்னும் மனித அரசியல் எதிரியையே சுட்டுகின்றன. ஆகவே பிற்கால இறையியல் தொடர்பை உரைக்குள் புகுத்தாமல் பொதுப்பெயரின் பொருள் காக்கப்படுகிறது.
- issue: ஆதாதை எழுப்பியதில் யாவேயின் செயல்பாடு
  choice: “எழுப்பினார்” என்று நேரடியாகக் கூறுதல்
  alternative: “எழும்ப அனுமதித்தார்” என்று விளக்குதல்
  rationale: எபிரெய ஹிஃபில் வடிவம் காரணச் செயலை நேரடியாகக் கூறுகிறது. இறை இறையாண்மை மற்றும் மனித எதிர்ப்பு இடையிலான பதற்றத்தைத் தளர்த்தாமல் மொழிபெயர்ப்பு காக்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. “யாவே” தனிப்பெயராக ஒலிபெயர்க்கப்பட்டுள்ளது; அரச மரபைக் குறிக்கும் எபிரெய மரபுத்தொடர் இயல்பான தமிழில் வழங்கப்பட்டுள்ளது.
