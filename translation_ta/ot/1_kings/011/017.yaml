translation:
  language: ta
  text: அதாத் தன் தந்தையின் பணியாளர்களில் சிலரான ஏதோமியர்களுடன் எகிப்துக்குத் தப்பியோடினான்[a]. அப்போது அதாத் மிக இளம் சிறுவனாக இருந்தான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “எகிப்துக்கு வரும்படி.” இலக்கை நோக்கிச் செல்வதை எபிரெய மொழி இங்கு “வருதல்” என்ற வினையால் குறிப்பிடுகிறது.'
    reason: lexical_alternative
  - marker: b
    text: “சிறு பையன்” என்றும் மொழிபெயர்க்கலாம். எபிரெயத் தொடர் அதாத் இன்னும் மிகவும் இளவயதுடையவனாக இருந்ததை வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְרַח
  choice: தப்பியோடினார்கள்
  rationale: ברח என்பது ஆபத்திலிருந்து தப்பி ஓடுவதைக் குறிக்கிறது. அதாதோடு வந்தவர்களையும் தமிழில் இயல்பாக இணைத்துச் சொல்ல பன்மை வினை பயன்படுத்தப்பட்டுள்ளது.
- source_word: אֲדַד
  choice: அதாத்
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் இயன்றவரை நெருக்கமாகப் பெயர்த்தெழுதுகிறது.
- source_word: וַאֲנָשִׁים אֲדֹמִיִּים
  choice: சில ஏதோமிய ஆண்கள்
  rationale: அவர்கள் ஏதோமைச் சேர்ந்த ஆண்கள் என்பதையும், எண்ணிக்கை குறிப்பிடப்படாத ஒரு பகுதியினர் என்பதையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מֵעַבְדֵי אָבִיו
  choice: அவன் தந்தையின் பணியாளர்களில்
  rationale: מן என்பதன் பகுதிப்பொருளை ‘பணியாளர்களில் சிலர்’ என்ற அமைப்பு காக்கிறது; עבד இச்சூழலில் வீட்டார் அல்லது அரசப் பணியில் இருந்தவர்களைக் குறிக்கலாம் என்பதால் பொதுவான ‘பணியாளர்கள்’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
- source_word: אִתּוֹ
  choice: அவனுடன்
  rationale: அந்த ஏதோமிய ஆண்கள் அதாதுடன் சென்றார்கள் என்பதை நேரடியாகக் காட்டுகிறது.
- source_word: לָבוֹא מִצְרָיִם
  choice: எகிப்துக்கு
  rationale: இலக்கைச் சுட்டும் இத்தொடரை ‘தப்பியோடினார்கள்’ என்பதுடன் இணைத்து இயல்பான தமிழில் வழங்குகிறது; ‘வர’ என்ற மூலச்சொல் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: נַעַר קָטָן
  choice: மிக இளம் சிறுவன்
  rationale: נער உடன் קטן சேர்வது அதாத் இன்னும் மிகவும் இளவயதுடையவன் என்பதை வலியுறுத்துகிறது; உடல் அளவை மட்டும் குறிக்கும் தவறான புரிதலைத் தவிர்க்க ‘மிக இளம்’ என வழங்கப்பட்டுள்ளது.
