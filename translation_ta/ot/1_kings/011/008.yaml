  text: וְ/כֵ֣ן עָשָׂ֔ה לְ/כָל נָשָׁ֖י/ו הַ/נָּכְרִיּ֑וֹת מַקְטִיר֥וֹת וּֽ/מְזַבְּח֖וֹת לֵ/אלֹהֵי/הֶֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/008.yaml
  text: And so he did for all his foreign wives[a], who were burning incense and sacrificing to their gods.
translation:
  language: ta
  text: அவ்வாறே அவர் தமது அயல்நாட்டைச் சேர்ந்த மனைவிகள் அனைவருக்காகவும் செய்தார்[a]; அவர்கள் தங்கள் தெய்வங்களுக்குத் தூபங்காட்டியும் பலியிட்டும் வந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தமது அயல்நாட்டைச் சேர்ந்த மனைவிகள் அனைவருக்கும் அவர் இதேபோல் செய்தார்.” அவர் செய்த குறிப்பிட்ட செயலை எபிரெய உரை வெளிப்படையாகக் கூறாமல், முந்தைய வசனத்தைச் சுட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֵן
  choice: அவ்வாறே
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட செயலைச் சுட்டிக்காட்டி, அதேபோலத் தொடர்ந்து செய்தார் என்ற இணைப்புப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עָשָׂה
  choice: செய்தார்
  rationale: எதைச் செய்தார் என்பதை எபிரெய உரை வெளிப்படையாகக் கூறாமல் முந்தைய வசனத்திலிருந்து புரிந்துகொள்ள விடுகிறது; தமிழிலும் அந்த மறைபொருள் காக்கப்படுகிறது.
- source_word: לְכָל נָשָׁיו הַנָּכְרִיּוֹת
  choice: தமது அந்நிய நாட்டுப் பெண்கள் அனைவருக்காகவும்
  rationale: לְ என்ற முன்னொட்டின் பயனாளிப் பொருளையும், נָשִׁים என்பதன் சூழல்சார் ‘மனைவிகள்’ பொருளையும் வெளிப்படுத்துகிறது. இங்கு அரசனின் மனைவிகளைக் குறிக்கும் மரியாதைமிக்க தமிழ் மரபுச் சொல்லாக ‘பெண்கள்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: מַקְטִירוֹת
  choice: தூபங்காட்டி
  rationale: வழிபாட்டுச் சூழலில் קטר என்பது தூபம் அல்லது நறுமணப்புகை செலுத்துதலைக் குறிக்கிறது; ‘தூபங்காட்டுதல்’ இயல்பான நவீனத் தமிழ் வழக்கு.
- source_word: וּמְזַבְּחוֹת
  choice: பலியிட்டுக்கொண்டிருந்தார்கள்
  rationale: பெண்பால் பன்மை வினையெச்சங்களின் தொடர்ச்சியான வழிபாட்டுச் செயலைத் தமிழ் தொடர்நிலை வினை வடிவில் காக்கிறது.
- source_word: לֵאלֹהֵיהֶן
  choice: தங்கள் தெய்வங்களுக்கு
  rationale: பெண்பால் பன்மை உரிமைப்பின்னொட்டை ‘தங்கள்’ என்றும், இஸ்ரவேலின் தேவன் அல்லாத அவர்கள் வழிபட்ட தெய்வங்களைப் பன்மையில் ‘தெய்வங்கள்’ என்றும் தருகிறது.
theological_decisions:
- issue: מַקְטִירוֹת וּמְזַבְּחוֹת என்ற வினையெச்சங்களின் எழுவாய்
  choice: தூபங்காட்டிப் பலியிடுகிறவர்கள் அந்நிய நாட்டுப் பெண்களே
  alternative: சாலொமோன் அவர்களுக்காக அமைத்த வழிபாட்டிடங்களில் நடைபெற்ற வழிபாட்டுச் செயல்களைப் பொதுவாகக் குறிப்பதாகக் கொள்ளுதல்
  rationale: பெண்பால் பன்மை வினையெச்சங்கள் ‘அந்நிய நாட்டுப் பெண்கள்’ என்பதோடு நேரடியாக இலக்கண ஒத்திசைவு பெறுகின்றன; ஆகவே செயலைச் சாலொமோனுக்கு மாற்றாமல் அந்தப் பெண்களுக்கே உரியதாக மொழிபெயர்க்கப்பட்டுள்ளது.
- issue: சாலொமோன் என்ன ‘செய்தார்’ என்பது விடுபட்டிருத்தல்
  choice: ‘செய்தார்’ என்று மட்டும் வைத்து, குறிப்பிட்ட செயலை முந்தைய வசனம் நிரப்புமாறு விடுதல்
  alternative: ‘அவர்களுக்காக மேடைகளைக் கட்டினார்’ அல்லது ‘அதையே செய்தார்’ என்று வெளிப்படையாக நிரப்புதல்
  rationale: எபிரெய உரை செயலை வெளிப்படையாக மீண்டும் சொல்லாமல் சூழலைச் சார்ந்துள்ளது. மூலத்தில் இல்லாத குறிப்பைச் சேர்க்காமல் அந்தத் திட்டமிட்ட விடுபாட்டைத் தமிழ் உரையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘அவ்வாறே ... செய்தார்’ என்பது எபிரெய மொழியின் விடுபட்ட செயப்பொருளைக் காக்கிறது. தொடர்ச்சியான வழிபாட்டுச் செயலைக் காட்ட ‘பலியிட்டுக்கொண்டிருந்தார்கள்’ என்ற வடிவம் பயன்படுத்தப்பட்டுள்ளது; அதனுடன் இணைந்த ‘தூபங்காட்டி’ இரு செயல்களையும் ஒரே தொடர்நிலை அமைப்பில் இயல்பாகத் தருகிறது.
