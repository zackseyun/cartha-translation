revisions:
- from: அவ்வாறே அவர் தமது அந்நிய நாட்டுப் பெண்கள் அனைவருக்காகவும் செய்தார்[a]; அவர்கள் தங்கள் தெய்வங்களுக்குத் தூபங்காட்டிப் பலியிட்டுக்கொண்டிருந்தார்கள்.
  to: அவ்வாறே அவர் தமது அயல்நாட்டைச் சேர்ந்த மனைவிகள் அனைவருக்காகவும் செய்தார்[a]; அவர்கள் தங்கள் தெய்வங்களுக்குத் தூபங்காட்டியும் பலியிட்டும் வந்தார்கள்.
  rationale: The revision changes the overly broad ‘women’ to ‘wives,’ as required by the Hebrew and immediate context. It also uses balanced coordinated verbal forms to represent both feminine plural participles as worship practices of the wives, while retaining the source’s ellipsis concerning what Solomon did. The footnote keeps the legitimate ‘for/to’ alternative and explains the contextual ellipsis.
