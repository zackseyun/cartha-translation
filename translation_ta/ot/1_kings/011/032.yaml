source:
  edition: WLC
  text: וְ/הַ/שֵּׁ֥בֶט הָ/אֶחָ֖ד יִֽהְיֶה לּ֑/וֹ לְמַ֣עַן עַבְדִּ֣/י דָוִ֗ד וּ/לְמַ֨עַן֙ יְר֣וּשָׁלִַ֔ם הָ/עִיר֙ אֲשֶׁ֣ר בָּחַ֣רְתִּי בָ֔/הּ מִ/כֹּ֖ל שִׁבְטֵ֥י יִשְׂרָאֵֽל־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/032.yaml
  text: But one tribe will remain his[a], for the sake of my servant David and for the sake of Jerusalem, the city that I have chosen from all the tribes of Israel.
translation:
  language: ta
  text: ஆனால், என் ஊழியனான தாவீதுக்காகவும், இஸ்ரவேலின் எல்லாக் கோத்திரங்களிலிருந்தும் நான் தேர்ந்தெடுத்த நகரமான எருசலேமுக்காகவும், ஒரு கோத்திரம்[a] அவனுக்குச் சொந்தமாக இருக்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “ஒரு கோத்திரம்.” குறிப்பாக எருசலேமின் அமைவிடத்தை முன்னிட்டு, பென்யமீன் யூதாவுடன் இணைந்ததாக இது பல சமயங்களில் புரிந்துகொள்ளப்படுகிறது. ஆனால் மூல உரை “ஒரு கோத்திரம்” என்றே கூறுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהַשֵּׁבֶט הָאֶחָד
  choice: ஆனால், ஒரு கோத்திரம்
  rationale: שֵׁבֶט இங்கு கோத்திர மக்களைக் குறிக்கும். முந்தைய வசனத்தில் அரசாட்சி பிரிக்கப்படுவதற்கு எதிர்மறையான விதிவிலக்கை அறிமுகப்படுத்துவதால் וְ என்பது ‘ஆனால்’ என மொழிபெயர்க்கப்பட்டது. הָאֶחָד என்பதன் எண்ணியல் பொருளான ‘ஒரு’ அப்படியே பாதுகாக்கப்பட்டது.
- source_word: יִהְיֶה לּוֹ
  choice: அவனுக்குச் சொந்தமாக இருக்கும்
  rationale: ‘அவனுக்கு இருக்கும்’ என்ற எபிரெயச் சொற்றொடர் இச்சூழலில் உடைமை அல்லது தொடர்ந்து வைத்திருத்தலைக் குறிக்கிறது. தமிழ் வாசகருக்கு இயல்பாக இருக்க ‘அவனுக்குச் சொந்தமாக இருக்கும்’ என வழங்கப்பட்டது.
- source_word: לְמַעַן
  choice: …க்காகவும்
  rationale: தாவீதையும் எருசலேமையும் கருத்தில்கொண்டு செய்யப்படும் செயலைக் குறிக்கும் நோக்கம் அல்லது காரணத்தைப் பாதுகாக்கிறது. இருமுறை வரும் சொல்லமைப்பு தமிழிலும் இரு ‘க்காகவும்’ வடிவங்களால் பிரதிபலிக்கப்பட்டது.
- source_word: עַבְדִּי דָוִד
  choice: என் ஊழியனான தாவீது
  rationale: עֶבֶד இங்கு அரசருக்குரிய உடன்படிக்கைச் சிறப்புப் பெயராக வருகிறது; அடிமைத்தனத்தை முன்னிறுத்தாமல், நவீன வேதாகமத் தமிழில் புரிந்துகொள்ளக்கூடிய ‘ஊழியன்’ பயன்படுத்தப்பட்டது.
- source_word: יְרוּשָׁלִַם הָעִיר
  choice: நகரமான எருசலேம்
  rationale: எருசலேமை ‘நகரம்’ என்று அடையாளப்படுத்தும் இணைப்புச் சொல்லமைப்பு தமிழில் இயல்பான பெயரெச்ச அமைப்பாக வழங்கப்பட்டது.
- source_word: אֲשֶׁר בָּחַרְתִּי בָהּ
  choice: நான் தேர்ந்தெடுத்த
  rationale: בָהּ என்பதிலுள்ள இடப்பொருள் தமிழில் ‘நகரமான எருசலேம்’ என்ற அமைப்போடு இயல்பாக உள்ளடங்குகிறது; தேவனுடைய நிறைவுற்ற தேர்வு தெளிவாகப் பாதுகாக்கப்படுகிறது.
- source_word: מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் எல்லாக் கோத்திரங்களிலிருந்தும்
  rationale: בחר உடன் வரும் מִן, ஒரு பெரிய தொகுதியிலிருந்து செய்யப்படும் தேர்வைக் குறிக்கிறது; ‘எல்லாக் கோத்திரங்களிலிருந்தும்’ அந்த உறவைத் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘ஒரு கோத்திரம்’ என்பதற்கும், யூதாவுடன் பென்யமீனும் இருந்ததாகத் தோன்றும் பிற பகுதிகளுக்கும் இடையிலான எண்ணியல் பதற்றம்
  choice: எபிரெய மூலத்தில் உள்ளபடியே ‘ஒரு கோத்திரம்’ என்று மொழிபெயர்த்தல்
  alternative: பென்யமீன் யூதாவுக்குள் அடங்கியதாகக் கருதி ‘ஒரு ராஜ்யம்’ என்றோ ‘இரண்டு கோத்திரங்கள்’ என்றோ ஒத்திசைத்து மொழிபெயர்த்தல்
  rationale: எபிரெய உரை வெளிப்படையாக ‘ஒரு கோத்திரம்’ என்று கூறுகிறது. அந்த உண்மையான உரைப் பதற்றத்தை முதன்மை உரையில் தீர்த்துவிடாமல் பாதுகாத்து, வழக்கமான விளக்கத்தை அடிக்குறிப்பில் தருவது பொருத்தமானது.
translation_notes:
  register: நவீன நிலையான தமிழில், இயல்பான ஆனால் கண்ணியமான நடை பயன்படுத்தப்பட்டது. எபிரெய வாக்கியத்தின் நீண்ட கட்டமைப்பு வாசிப்புக்கு ஏற்ற தமிழ்ச் சொல் வரிசையில் அமைக்கப்பட்டது; அதே நேரத்தில் தாவீதும் எருசலேமும் தனித்தனியாகக் குறிப்பிடப்படும் לְמַעַן அமைப்பு பாதுகாக்கப்பட்டது.
