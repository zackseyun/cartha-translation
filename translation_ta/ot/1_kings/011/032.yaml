  source_fidelity: மூல எபிரெய உரையின் ‘ஒரு கோத்திரம்’ (הַשֵּׁבֶט הָאֶחָד), ‘அவனுக்குச் சொந்தமாக இருக்கும்’ (יִהְיֶה לּוֹ), தாவீதுக்கும் எருசலேமுக்கும் உரிய இரட்டை לְמַעַן (‘க்காகவும்’) அமைப்பு, மேலும் இஸ்ரவேலின் எல்லாக் கோத்திரங்களிலிருந்தும் தேர்ந்தெடுக்கப்பட்ட நகரம் என்ற கருத்து அனைத்தும் துல்லியமாகப் பிரதிபலிக்கின்றன. சொல்லமைப்பு மாற்றம் தமிழில் இயல்பாக இருக்கிறது; பொருளை மாற்றவில்லை.
