  text: וַ/יְהִ֗י לְ/עֵת֙ זִקְנַ֣ת שְׁלֹמֹ֔ה נָשָׁי/ו֙ הִטּ֣וּ אֶת לְבָב֔/וֹ אַחֲרֵ֖י אֱלֹהִ֣ים אֲחֵרִ֑ים וְ/לֹא הָיָ֨ה לְבָב֤/וֹ שָׁלֵם֙ עִם יְהוָ֣ה אֱלֹהָ֔י/ו כִּ/לְבַ֖ב דָּוִ֥יד אָבִֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/004.yaml
  text: And when Solomon was old[a], his wives turned his heart after other gods, and his heart was not fully devoted to Yahweh his God, like the heart of David his father.
translation:
  language: ta
  text: சாலொமோனுக்கு முதுமை வந்தபோது, அவனுடைய மனைவிகள் அவனுடைய இருதயத்தை வேறு தெய்வங்களைப் பின்பற்றும்படி திருப்பினார்கள். அவனுடைய இருதயம் அவனுடைய தந்தை தாவீதின் இருதயத்தைப்போல், அவனுடைய கடவுளாகிய யாவேவுக்கு முழுமையாக உண்மையுள்ளதாக இருக்கவில்லை[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்பட, “அவனுடைய இருதயம் யாவேவுடன் முழுமையானதாக இருக்கவில்லை.” “முழு ஈடுபாடுடையதாக இருக்கவில்லை” என்றும் மொழிபெயர்க்கலாம்.
    reason: שָׁלֵם עִם என்ற சொற்றொடரின் சொற்படியான உருவகத்தையும் இயல்பான மாற்று மொழிபெயர்ப்பையும் காட்டுகிறது.
lexical_decisions:
- source_word: לְעֵת זִקְנַת שְׁלֹמֹה
  choice: சாலொமோனுக்கு முதுமை வந்தபோது
  rationale: ‘சாலொமோனின் முதுமைக் காலத்தில்’ என்ற சொற்படி அமைப்பின் காலப்பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: נָשָׁיו
  choice: அவனுடைய மனைவிகள்
  rationale: எபிரெயப் பன்மை உடைமை வடிவை நேரடியாகவும் தெளிவாகவும் மொழிபெயர்க்கிறது.
- source_word: הִטּוּ אֶת־לְבָבוֹ
  choice: அவனுடைய இருதயத்தை ... திருப்பினார்கள்
  rationale: נטה என்பதன் Hiphil வடிவிலுள்ள ‘திரும்பச் செய்தல்’ என்ற காரணவினைப் பொருளையும் மூலத்தின் இருதய உருவகத்தையும் காக்கிறது.
- source_word: אַחֲרֵי אֱלֹהִים אֲחֵרִים
  choice: வேறு தெய்வங்களைப் பின்பற்றும்படி
  rationale: אַחֲרֵי என்பதிலுள்ள பின்தொடர்தல் பொருளை இயல்பான தமிழில் வெளிப்படுத்தி, விக்கிரக வழிபாட்டை வெறும் திசைமாற்றமாகச் சுருக்காமல் காக்கிறது.
- source_word: לְבָבוֹ
  choice: அவனுடைய இருதயம்
  rationale: சிந்தனை, விருப்பம், பற்றுறுதி ஆகியவற்றை உள்ளடக்கும் எபிரெய வேதாகமத்தின் ‘இருதயம்’ உருவகத்தைப் பாதுகாக்கிறது.
- source_word: שָׁלֵם
  choice: முழுமையாக உண்மையுள்ளதாக
  rationale: பிரிக்கப்படாத முழுமையையும் உடன்படிக்கைச் சார்ந்த உண்மைத்தன்மையையும் இயல்பான தமிழில் இணைத்துத் தருகிறது; ‘குற்றமற்ற’ என்ற அளவுக்கு பொருளை மிகைப்படுத்தவில்லை.
- source_word: עִם יְהוָה אֱלֹהָיו
  choice: அவனுடைய கடவுளாகிய யாவேவுக்கு
  rationale: עִם குறிக்கும் உறவுசார் இணக்கத்தையும் பற்றுறுதியையும் தமிழில் இயல்பான வேற்றுமை அமைப்பால் தருகிறது; יְהוָה தனிப்பெயர் ‘யாவே’ என்று ஒலிபெயர்க்கப்படுகிறது.
- source_word: כִּלְבַב דָּוִיד אָבִיו
  choice: அவனுடைய தந்தை தாவீதின் இருதயத்தைப்போல்
  rationale: ஒப்பீடு நபர்களுக்கு மட்டுமல்ல, அவர்களுடைய இருதயங்களுக்கு இடையிலானது என்பதை மூலத்தைப் போலவே வெளிப்படையாக வைக்கிறது.
theological_decisions:
- issue: שָׁלֵם என்ற சொல்லால் சாலொமோனின் இருதயம் விவரிக்கப்படுதல்
  choice: முழுமையாக உண்மையுள்ளதாக
  alternative: முழுமையானதாக; முழு ஈடுபாடுடையதாக; பிரிவுபடாததாக
  rationale: தாவீதின் இருதயத்துடன் செய்யப்படும் ஒப்பீட்டில் உடன்படிக்கைப் பற்றுறுதியே கருத்தாக உள்ளது. இந்த மொழிபெயர்ப்பு ஒழுக்கரீதியான பூரணத்துவத்தை உரையில் திணிக்காமல், முழுமை மற்றும் உண்மைத்தன்மை ஆகிய இரு நுணுக்கங்களையும் காக்கிறது.
- issue: אֱלֹהִים אֲחֵרִים குறிப்பு
  choice: வேறு தெய்வங்கள்
  alternative: அந்நிய தெய்வங்கள்
  rationale: மூலத்தின் வழக்கமான ‘வேறு தெய்வங்கள்’ என்ற சொல்லாட்சியை நேரடியாகத் தருகிறது; அதை இன அல்லது தேச அடையாளம் சார்ந்த ‘அந்நிய’ என்ற கருத்தாக மாற்றவில்லை.
- issue: יְהוָה என்ற தெய்வீகப் பெயர்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் உள்ள தனிப்பெயரை ஒரு பட்டத்தால் மாற்றாமல் ஒலிபெயர்த்து வழங்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘இருதயம்’ என்ற வேதாகம உருவகமும் ‘யாவே’ என்ற தெய்வீகத் தனிப்பெயரும் காக்கப்பட்டுள்ளன; வாக்கிய நீளத்தை இயல்பாக்க இரண்டு வாக்கியங்களாக அமைக்கப்பட்டுள்ளது.
