source:
  edition: WLC
  text: וַ/יִּתְפֹּ֣שׂ אֲחִיָּ֔ה בַּ/שַּׂלְמָ֥ה הַ/חֲדָשָׁ֖ה אֲשֶׁ֣ר עָלָ֑י/ו וַ/יִּ֨קְרָעֶ֔/הָ שְׁנֵ֥ים עָשָׂ֖ר קְרָעִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/030.yaml
  text: Then Ahijah took hold of the new cloak that was on him and tore it into twelve pieces[a].
translation:
  language: ta
  text: அப்போது அகியா தன்மேல் இருந்த புதிய மேலாடையைப் பிடித்து, அதை பன்னிரண்டு துண்டுகளாகக் கிழித்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தான் அணிந்திருந்த புதிய மேலாடையை.” எபிரெய மொழியில் சொல்லுக்குச் சொல், “தன்மேல் இருந்த புதிய மேலாடையை” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפֹּשׂ
  choice: பிடித்து
  rationale: இச்சொல் ஒன்றை உடலால் பற்றிப்பிடிக்கும் செயலைக் குறிக்கிறது. வன்முறையைத் தேவையின்றி வலியுறுத்தாமல், செயலை இயல்பான தமிழில் தெளிவாகக் கூறுகிறது.
- source_word: שַׂלְמָה
  choice: மேலாடை
  rationale: இது உடலின் மேல் அணியும் வெளிப்புற ஆடையைக் குறிக்கிறது. ‘மேலாடை’ என்பது நவீனத் தமிழில் தெளிவாகவும் சூழலுக்கு ஏற்றதாகவும் உள்ளது.
- source_word: הַחֲדָשָׁה
  choice: புதிய
  rationale: எபிரெயச் சொல்லின் நேரடியான பொருளைத் தக்கவைக்கிறது; கதையில் குறிப்பிடப்படும் முக்கிய விவரத்தை விடாமல் தருகிறது.
- source_word: אֲשֶׁר עָלָיו
  choice: தன்மேல் இருந்த
  rationale: ‘அவர்மேல் இருந்தது’ என்ற எபிரெயச் சொற்றொடரின் இயல்பான தமிழ் வடிவம். அது அவர் அணிந்திருந்தார் என்பதைக் குறிக்கக்கூடும்; ஆனால் மூலத்தில் உள்ள வெளிப்பாட்டை விளக்கமாக மாற்றாமல் தக்கவைக்கிறது.
- source_word: וַיִּקְרָעֶהָ
  choice: அதைக் ... கிழித்தார்
  rationale: வினைச்சொல்லின் ‘கிழித்தல்’ என்ற நேரடிப் பொருளையும், பெண்பால் ஒருமை பொருள் பின்னொட்டால் மேலாடையே சுட்டப்படுவதையும் தெளிவாகக் காட்டுகிறது.
- source_word: שְׁנֵים עָשָׂר קְרָעִים
  choice: பன்னிரண்டு துண்டுகளாக
  rationale: சொற்றொடர் கிழிக்கப்பட்ட பன்னிரண்டு பகுதிகளைக் குறிக்கிறது. செயல்விளைவை இயல்பான தமிழில் கூறி, எண்ணிக்கையையும் அடையாளச் செயலின் வலிமையையும் காக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. அகியா பற்றிய மரியாதைப் பன்மை வினைமுற்று பயன்படுத்தப்பட்டுள்ளது. மூல எபிரெயத்தில் ஆடை யார்மேல் இருந்தது என்பது இலக்கணப்படி அகியாவைக் குறிப்பதாகத் தோன்றினாலும், ‘அணிந்திருந்த’ என்று முழுமையாக விளக்காமல் பிரதான உரையில் மூலத்தின் அமைப்பு காக்கப்பட்டு, இயல்பான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
