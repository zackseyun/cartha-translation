base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/010.yaml
  text: and had commanded him concerning this matter[a], not to go after other gods, but he did not keep what Yahweh had commanded.
translation:
  language: ta
  text: மேலும், இந்தக் காரியத்தைக் குறித்து, வேறு தெய்வங்களைப் பின்பற்றிச் செல்லக் கூடாது[a] என்று அவனுக்குக் கட்டளையிட்டிருந்தார்; ஆனால் யாவே கட்டளையிட்டதை அவன் கடைப்பிடிக்கவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “வேறு தெய்வங்களைப் பின்பற்றிச் செல்லுதல்” என்பது, அவற்றை நாடி அவற்றை வழிபடுவதைக் குறிக்கும் வழக்கமான எபிரெய உடன்படிக்கைச் சொல்வழக்கு.
    reason: cultural_note
lexical_decisions:
- source_word: וְצִוָּה אֵלָיו
  choice: அவனுக்குக் கட்டளையிட்டிருந்தார்
  rationale: வாவ் இணைப்புடன் வரும் நிறைவுற்ற வினை, சுற்றியுள்ள கதைச் சூழலில் முன்பே நிகழ்ந்த கட்டளையைக் குறிக்கிறது. ‘அவனுக்குக் கட்டளையிட்டிருந்தார்’ என்பது அந்தக் காலத் தொடர்பையும் மறைமுகச் செயப்படுபொருளையும் இயல்பான தமிழில் தருகிறது.
- source_word: עַל הַדָּבָר הַזֶּה
  choice: இந்தக் காரியத்தைக் குறித்து
  rationale: דבר இங்கு வெறும் ‘சொல்’ என்பதைவிட முன் குறிப்பிடப்பட்ட விவகாரத்தைக் குறிக்கிறது; ‘இந்தக் காரியத்தைக் குறித்து’ என்பது துல்லியமும் dignified register-உம் உடைய இயல்பான தமிழ்.
- source_word: לְבִלְתִּי לֶכֶת
  choice: செல்லக் கூடாது என்று
  rationale: இந்த எபிரெயக் கட்டமைப்பு தடை அல்லது எதிர்மறை நோக்கத்தை வெளிப்படுத்துகிறது. தமிழில் கட்டளையின் உள்ளடக்கத்தைத் தெளிவாகக் காட்ட ‘செல்லக் கூடாது என்று’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: אַחֲרֵי אֱלֹהִים אֲחֵרִים
  choice: வேறு தெய்வங்களைப் பின்பற்றிச் செல்ல
  rationale: ‘பின்னால் செல்லுதல்’ என்ற எபிரெய உடன்படிக்கைச் சொல்வழக்கை, தமிழில் புரியத்தக்கவாறும் அதன் உருவகத் தன்மையைப் பாதுகாக்குமாறும் ‘பின்பற்றிச் செல்ல’ என வழங்குகிறது.
- source_word: וְלֹא שָׁמַר
  choice: ஆனால் ... கடைப்பிடிக்கவில்லை
  rationale: வாவ் இங்கு முந்தைய கட்டளைக்கும் சாலொமோனின் செயலுக்கும் இடையிலான முரண்பாட்டைக் காட்டுகிறது. שמר என்பது கட்டளைச் சூழலில் ‘கடைப்பிடித்தல்’ என்று இயல்பாகப் பொருள்படும்.
- source_word: אֵת אֲשֶׁר צִוָּה יְהוָה
  choice: யாவே கட்டளையிட்டதை
  rationale: தெய்வீகக் கட்டளையின் உள்ளடக்கத்தை நேரடியாகத் தருகிறது; தமிழில் தேவையற்ற மீளுரைப்பின்றி இயல்பாக உள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய நான்கெழுத்துத் திருப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், அதன் வழக்கமான கல்வியியல் உச்சரிப்பைத் தமிழில் ஒலிபெயர்க்கிறது.
theological_decisions:
- issue: יְהוָה என்ற திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர் / யெகோவா
  rationale: மூல உரை தனிப்பட்ட திருப்பெயரான יהוה என்பதை நேரடியாகப் பயன்படுத்துகிறது. ‘யாவே’ என்பது பட்டப்பெயராக மாற்றாமல் அந்தப் பெயரைப் பாதுகாக்கிறது; ‘யெகோவா’ என்பதிலுள்ள பிற்கால உயிரெழுத்துக் கலப்பையும் தவிர்க்கிறது.
- issue: ‘வேறு தெய்வங்களைப் பின்பற்றிச் செல்லுதல்’ என்ற சொல்வழக்கு
  choice: உருவகத்தை உரையிலேயே பாதுகாத்து, பொருளை அடிக்குறிப்பில் விளக்குதல்
  alternative: வேறு தெய்வங்களை வழிபடுதல்
  rationale: எபிரெய உரையின் உடன்படிக்கை சார்ந்த உருவகத்தையும் அதன் இறையியல் பதற்றத்தையும் பாதுகாக்கிறது; அதே நேரத்தில் அடிக்குறிப்பு சாதாரண வாசகருக்குப் பொருளைத் தெளிவுபடுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. வசனம் முந்தைய வாக்கியத்தின் தொடர்ச்சியாக இருப்பதால் ‘மேலும்’ தக்கவைக்கப்பட்டுள்ளது. மறைந்துள்ள தெய்வீக எழுவாய்க்கு மரியாதைப் பன்மை வினைமுற்று பயன்படுத்தப்பட்டுள்ளது; சாலொமோனைக் குறிக்கும் இடங்களில் ஒருமை வடிவம் உள்ளது.
