base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/040.yaml
  text: Then Solomon sought to put Jeroboam to death[a], but Jeroboam arose and fled to Egypt, to Shishak king of Egypt[b], and he was in Egypt until the death of Solomon.
translation:
  language: ta
  text: சாலொமோன் யெரொபெயாமைக் கொல்ல முயன்றார்.[a] ஆனால் யெரொபெயாம் எழுந்து, எகிப்துக்குத் தப்பியோடி, எகிப்தின் அரசனாகிய சீஷாக்கிடம் சென்றார். சாலொமோன் இறக்கும்வரை அவர் எகிப்திலேயே இருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சாலொமோன் யெரொபெயாமைக் கொல்லத் தேடினார்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבַקֵּשׁ
  choice: முயன்றார்
  rationale: בקשׁ இங்கு ஒரு செயலைச் செய்ய நாடுதல் அல்லது முயலுதல் என்ற பொருளில் வருகிறது. ‘முயன்றார்’ என்பது எண்ணத்தையும் அதை நிறைவேற்ற மேற்கொண்ட முயற்சியையும் காட்டுகிறது; வெற்றி பெற்றார் என்று பொருள்படாது.
- source_word: לְהָמִית
  choice: கொன்றுபோட
  rationale: מות என்பதன் ஹிஃபில் வடிவம் உயிரிழக்கச் செய்தல் என்ற காரணவினைப் பொருளுடையது. நவீன தமிழில் ‘கொன்றுபோட’ என்பது அச்சுறுத்தலின் தீவிரத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיָּקָם
  choice: புறப்பட்டு
  rationale: קום கதைநடையில் தீர்மானமான அடுத்த நடவடிக்கையைத் தொடங்குவதைக் குறிக்கலாம். தமிழில் ‘எழுந்தார்’ என்று சொல்வது உடல் நிலையில் எழுவதெனத் தவறாகப் புரியக்கூடும்; ‘புறப்பட்டு’ தப்பியோடும் நடவடிக்கையின் தொடக்கத்தை இயல்பாகக் காட்டுகிறது.
- source_word: וַיִּבְרַח
  choice: தப்பியோடி
  rationale: ברח ஆபத்திலிருந்து ஓடித் தப்புவதைக் குறிக்கிறது. ‘தப்பியோடி’ அரசனின் கொலை முயற்சியிலிருந்து தப்பிச் சென்ற சூழலைத் தெளிவாகத் தருகிறது.
- source_word: מִצְרַיִם ... אֶל שִׁישַׁק מֶלֶךְ מִצְרַיִם
  choice: எகிப்துக்குத் தப்பியோடி, எகிப்தின் அரசனான சீஷாக்கிடம் சென்றார்
  rationale: முதல் ‘எகிப்து’ சென்ற நாட்டைக் குறிக்கிறது; אֶל சீஷாக்கிடம் சென்றதைத் தனிப்படுத்துகிறது. எபிரெய மூலத்தில் உள்ள நாட்டின் பெயர் மீளுரைப்பைத் தமிழிலும் வைத்திருக்கிறது.
- source_word: וַיְהִי בְמִצְרַיִם
  choice: அவர் எகிப்திலேயே இருந்தார்
  rationale: היה + இடம் அடிப்படையில் ‘அங்கு இருந்தார்’ எனப் பொருள்படும். ‘-லேயே’ தொடர்ந்திருப்பதை அடுத்த காலவரம்புடன் இயல்பாக இணைக்கிறது.
- source_word: עַד מוֹת שְׁלֹמֹה
  choice: சாலொமோன் இறக்கும்வரை
  rationale: எபிரெயத்தில் பெயர்ச்சொல் அமைப்பு ‘சாலொமோனின் மரணம் வரை’ என்றாலும், ‘சாலொமோன் இறக்கும்வரை’ என்பது அதே காலவரம்பை நவீன தமிழில் தெளிவாகவும் இயல்பாகவும் தருகிறது.
