  register: நவீன பொதுத்தமிழில் கண்ணியமான வரலாற்றுக் கதைநடை பயன்படுத்தப்பட்டுள்ளது. பெயர்கள் ‘சாலொமோன்,’ ‘யெரொபெயாம்,’ ‘சீஷாக்’ என வழக்கமான தமிழ் வேதாகம ஒலிபெயர்ப்புகளுக்கு நெருக்கமாக வைக்கப்பட்டுள்ளன. மூலத்தின் தொடர்ச்சியான வாவ்-வினை அமைப்பு தமிழில் இயல்பான வாக்கிய இணைப்புகளாக வழங்கப்பட்டுள்ளது.
