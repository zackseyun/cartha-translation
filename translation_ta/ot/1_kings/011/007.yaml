base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/007.yaml
  text: Then Solomon built a high place for Chemosh[a], the abomination of Moab, on the mountain that is opposite Jerusalem, and for Molech, the abomination of the Ammonites.
translation:
  language: ta
  text: அப்போது சாலொமோன், எருசலேமுக்கு எதிரே உள்ள மலையின்மேல், மோவாபின் அருவருப்பானதான கெமோசுக்கு ஒரு உயர்ந்த வழிபாட்டு இடத்தையும், அம்மோனியரின் அருவருப்பானதான மோலேக்குக்கு[a] ஒரு உயர்ந்த வழிபாட்டு இடத்தையும் கட்டினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய வடிவம் இங்கே மரபாக ‘மோலேக்கு’ என்று வாசிக்கப்படுகிறது; சிலர் இதை அம்மோனியத் தெய்வமான ‘மில்கோம்’ என்பதோடு தொடர்புபடுத்துகின்றனர்.
    reason: alternative_reading
lexical_decisions:
- source_word: אָז
  choice: அப்போது
  rationale: கதையின் அடுத்த நிகழ்வைக் குறிக்கும் கால அடையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: יִבְנֶה
  choice: கட்டினான்
  rationale: வடிவில் முற்றுப்பெறாத வினையாக இருந்தாலும், אָז உடன் வரும் கதைச் சூழலில் கடந்தகால நிகழ்வைக் குறிக்கிறது.
- source_word: בָּמָה
  choice: வழிபாட்டு மேடுகள்
  rationale: வழிபாட்டுக்குரிய உயர்ந்த இடம் அல்லது வழிபாட்டுத் தலத்தைக் குறிக்கும் தொழில்நுட்பச் சொல்லின் பொருளை சாதாரண வாசகருக்குத் தெளிவாக்குகிறது. இரு தெய்வங்களுக்கான கட்டுமானம் குறிக்கப்படுவதால் தமிழில் பன்மை பயன்படுத்தப்பட்டுள்ளது.
- source_word: לִכְמוֹשׁ
  choice: கெமோசுக்கு
  rationale: முன்னிடைச்சொல் அர்ப்பணிப்பு அல்லது பயன்பாட்டைக் குறிக்கிறது; தெய்வத்தின் பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: שִׁקֻּץ מוֹאָב
  choice: மோவாபின் அருவருப்பான தெய்வம்
  rationale: שִׁקֻּץ என்பதன் கடுமையான எதிர்மறை மதிப்பீட்டை ‘அருவருப்பான’ என்பது காக்கிறது; இங்கு குறிப்பிடப்படுவது தெய்வம் என்பதைத் தமிழில் தெளிவுபடுத்துகிறது.
- source_word: בָּהָר אֲשֶׁר עַל־פְּנֵי יְרוּשָׁלִָם
  choice: எருசலேமுக்கு எதிரே உள்ள மலையின்மேல்
  rationale: இடஞ்சார்ந்த עַל־פְּנֵי என்பதற்கு ‘எதிரே’ என்பது நேரான பொருள்; குறிப்பிட்ட புவியியல் அடையாளத்தை உரைக்குள் சேர்க்கவில்லை.
- source_word: וּלְמֹלֶךְ
  choice: மோலேக்குக்கும்
  rationale: மசோரா உயிர்க்குறிப்பு மரபைப் பின்பற்றி பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது; ‘மில்கோம்’ என்ற தொடர்பு அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- source_word: שִׁקֻּץ בְּנֵי עַמּוֹן
  choice: அம்மோனியரின் அருவருப்பான தெய்வம்
  rationale: בְּנֵי עַמּוֹן என்பதற்கு இயல்பான இனப்பெயராக ‘அம்மோனியர்’ பயன்படுத்தப்பட்டு, இணையான எபிரெய அமைப்பு காக்கப்பட்டுள்ளது.
theological_decisions:
- issue: அந்நிய தெய்வங்களை இழிவாக மதிப்பிடும் שִׁקֻּץ என்ற சொல்
  choice: இரு இடங்களிலும் ‘அருவருப்பான தெய்வம்’ என்று மொழிபெயர்த்தல்
  alternative: ‘வெறுக்கத்தக்க பொருள்’ அல்லது ‘வெறுக்கத்தக்க தெய்வம்’
  rationale: மூல உரையின் கண்டனத் தொனியை மென்மையாக்காமல் காக்கிறது; அதேவேளையில் இங்கு சுட்டப்படுவது ஒரு தெய்வம் என்பதைத் தெளிவாக்குகிறது.
- issue: מֹלֶךְ என்பவரின் அடையாளம்
  choice: முதன்மை உரையில் ‘மோலேக்கு’
  alternative: ‘மில்கோம்’
  rationale: மசோரா உரையின் உயிர்க்குறிப்பு ‘மோலேக்கு’ என்பதை ஆதரிக்கிறது; ‘மில்கோம்’ உடனான தொடர்பு விவாதத்திற்குரியது என்பதால் அது அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘வழிபாட்டு மேடு’ என்பது வெறும் புவியியல் உயரத்தைவிட בָּמָה என்பதன் சமயச் செயல்பாட்டை வெளிப்படுத்துகிறது; எபிரெய ஒருமை அமைப்பில் இரண்டாவது தெய்வத்திற்கான மேடு மறைமுகமாகப் புரிந்துகொள்ளப்படுவதால் தமிழில் இயல்பாகப் பன்மை அமைப்பு தேர்ந்தெடுக்கப்பட்டுள்ளது.
