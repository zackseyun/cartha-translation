base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/023.yaml
  text: And God raised up for him an adversary[a], Rezon son of Eliada, who had fled from Hadadezer king of Zobah, his master.
translation:
  language: ta
  text: 'தேவன் சாலொமோனுக்கு எதிராக ஓர் எதிரியை[a] எழுப்பினார்: எலியாதாவின் மகனான ரெசோன்; அவன் சோபாவின் அரசனாகிய தன் எஜமான் அதாதேசேரிடமிருந்து தப்பிச் சென்றவன்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சாத்தான்; இங்கு அது ‘எதிரி’ அல்லது ‘எதிர்ப்பவன்’ என்று பொருள்படும் பொதுப்பெயர்; ‘சாத்தான்’ என்ற தனிப்பெயர் அல்ல.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: எழுப்பினார்
  rationale: ஹிஃபில் வடிவம் ஒருவரை எழும்பச் செய்வதை அல்லது எதிரியாகக் களத்தில் தோன்றச் செய்வதை குறிக்கிறது; ‘எழுப்பினார்’ இயல்பாகவும் மூலத்தின் செயற்பாட்டையும் காக்கிறது.
- source_word: אֱלֹהִים
  choice: தேவன்
  rationale: இக்கதைச் சூழலில் இஸ்ரவேலின் தேவனே குறிக்கப்படுகிறார்; நவீனத் தமிழ் வேதாகம நடைக்கு ஏற்ற மரியாதையான வடிவம்.
- source_word: לוֹ
  choice: சாலொமோனுக்கு எதிராக
  rationale: எபிரெய லְוֹ சொல்லுருவில் ‘அவனுக்காக/அவனுக்கு’ என்றிருந்தாலும், שָׂטָן உடனான இச்சூழலில் சாலொமோனுக்கு எதிரான உறவைக் குறிக்கிறது. முந்தைய வசனத்திலிருந்து சுட்டுப்பெயரின் பொருளைத் தெளிவாக்க ‘சாலொமோனுக்கு’ எனப் பெயர் பயன்படுத்தப்பட்டது.
- source_word: שָׂטָן
  choice: ஓர் எதிரி
  rationale: இங்கு இது ரெசோன் என்னும் மனித அரசியல் எதிரியைக் குறிக்கும் பொதுப்பெயர்; ‘சாத்தான்’ என்ற தனிப்பெயரைப் பயன்படுத்துவது மூலத்தில் இல்லாத பிசாசியல் பொருளைச் சேர்க்கும்.
- source_word: רְזוֹן בֶּן אֶלְיָדָע
  choice: எலியாதாவின் மகன் ரெசோன்
  rationale: தமிழின் இயல்பான உறவுமுறைச் சொல்லமைப்பில் தரப்பட்டு, பெயர்கள் ஒலிபெயர்க்கப்பட்டன.
- source_word: אֲשֶׁר בָּרַח
  choice: தப்பியோடியவன்
  rationale: ரெசோன் எழுப்பப்படுவதற்கு முந்திய பின்னணி நிகழ்வைத் தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: מֵאֵת הֲדַדְעֶזֶר
  choice: அதாதேசரிடமிருந்து
  rationale: ஒரு நபரிடமிருந்து பிரிந்து அல்லது விலகிச் சென்ற பொருளை ‘-இடமிருந்து’ தெளிவாகக் காட்டுகிறது.
- source_word: מֶלֶךְ צוֹבָה
  choice: சோபாவின் அரசன்
  rationale: எபிரெய இணைப்புத் தொடரை இயல்பான தமிழில் நேரடியாக வழங்குகிறது.
- source_word: אֲדֹנָיו
  choice: தன் எஜமான்
  rationale: அரசியல் அல்லது பணிசார் கீழ்ப்படிதல் உறவை ‘எஜமான்’ தெரிவிக்கிறது; ‘தன்’ என்பது ரெசோனையே சுட்டுகிறது என்பதைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: שָׂטָן என்பதன் சூழல்சார் பொருள்
  choice: பொதுப்பெயரான ‘எதிரி’
  alternative: தனிப்பெயரான ‘சாத்தான்’
  rationale: இவ்வசனம் எலியாதாவின் மகன் ரெசோன் என்ற மனித அரசியல் எதிரியை அடையாளப்படுத்துகிறது. எனவே தனிப்பெயரான ‘சாத்தான்’ என்பது மூலவசனம் கூறாத இறையியல் கருத்தை இறக்குமதி செய்யும்.
- issue: தேவன் எதிரியை எழுப்பிய செயல்
  choice: ‘தேவன் ... எழுப்பினார்’ என்ற நேரடியான காரணச் செயற்பாட்டைத் தக்கவைத்தல்
  alternative: ‘எழும்ப அனுமதித்தார்’ என மென்மைப்படுத்துதல்
  rationale: וַיָּקֶם என்பது தேவனைச் செயற்பாட்டாளராகத் தெளிவாகக் காட்டுகிறது. அதிலுள்ள இறையியல் பதற்றத்தை ‘அனுமதித்தார்’ என்று விளக்கி மென்மைப்படுத்தாமல் பாதுகாக்க வேண்டும்.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட உரை. மூலத்தின் தெய்வீகச் செயற்பாடும் அரசியல் எதிரி என்ற பொருளும் பாதுகாக்கப்பட்டுள்ளன; அடுத்தடுத்த உட்பிரிவுகளால் கனமாகாமல் இரண்டு வாக்கியங்களாக அமைக்கப்பட்டது.
