revisions:
- from: ஆதாத் எகிப்தில் இருந்தபோது, தாவீது தன் முன்னோர்களோடு படுத்துவிட்டார்[a] என்றும், படைத்தளபதியான யோவாப் இறந்திருந்தான்[b] என்றும் கேள்விப்பட்டான். ஆதாத் பார்வோனிடம், “என்னை அனுப்பிவிடுங்கள்; நான் என் சொந்த நாட்டுக்குப் போக வேண்டும்” என்றான்.
