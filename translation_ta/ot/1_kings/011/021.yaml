source:
  edition: WLC
  text: וַ/הֲדַ֞ד שָׁמַ֣ע בְּ/מִצְרַ֗יִם כִּֽי שָׁכַ֤ב דָּוִד֙ עִם אֲבֹתָ֔י/ו וְ/כִי מֵ֖ת יוֹאָ֣ב שַֽׂר הַ/צָּבָ֑א וַ/יֹּ֤אמֶר הֲדַד֙ אֶל פַּרְעֹ֔ה שַׁלְּחֵ֖/נִי וְ/אֵלֵ֥ךְ אֶל אַרְצִֽ/י־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/021.yaml
  text: When Hadad heard in Egypt that David had lain down with his fathers and that Joab[a], the commander of the army, was dead, Hadad said to Pharaoh, “Send me away[b], so that I may go to my own land.”
translation:
  language: ta
  text: ஆதாத் எகிப்தில் தாவீது தன் முன்னோர்களுடன் படுத்துக்கொண்டார்[a] என்றும், படைத்தளபதியான யோவாப் இறந்திருந்தான்[b] என்றும் கேள்விப்பட்டபோது, அவன் பார்வோனிடம், “என்னை அனுப்பிவிடுங்கள்; நான் என் சொந்த நாட்டுக்குச் செல்லட்டும்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தன் முன்னோர்களுடன் படுத்துக்கொண்டார்” என்பது மரணத்தைக் குறிக்கும் வழக்கமான எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “இறந்துவிட்டான்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַע
  choice: கேள்விப்பட்டான்
  rationale: இச்சூழலில் செய்தியை அறிந்துகொள்வதைக் குறித்தாலும், எபிரெய வினையின் அடிப்படை ‘கேள்’ என்ற பொருளை இயல்பான தமிழில் காக்கிறது.
- source_word: שָׁכַב ... עִם אֲבֹתָיו
  choice: தன் முன்னோர்களோடு படுத்துவிட்டார்
  rationale: இது மரணத்தைக் குறிக்கும் வழக்கமான எபிரெய மரபுத்தொடர். ‘இறந்தார்’ என்று பொருளை மட்டும் தராமல், மூலத்தின் உருவகத்தையும் அரச மரணச் செய்திக்குரிய மரபான மொழிநடையையும் காக்கிறது; அதன் பொருள் அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
- source_word: מֵת
  choice: இறந்திருந்தான்
  rationale: யோவாப் இறந்த நிலையில் இருந்தான் என்ற விளைவுநிலையைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; ‘இறந்துவிட்டான்’ என்பதும் சாத்தியம்.
- source_word: שַׂר הַצָּבָא
  choice: படைத்தளபதி
  rationale: இராணுவத்தின் தலைமை அதிகாரியைச் சுருக்கமாகவும் நவீன வாசகர்களுக்குத் தெளிவாகவும் குறிக்கிறது.
- source_word: שַׁלְּחֵנִי
  choice: என்னை அனுப்பிவிடுங்கள்
  rationale: பார்வோன் தன்னை விடுவித்து அனுப்ப வேண்டும் என்ற ஆதாத்தின் வேண்டுகோளை, மரியாதையான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְאֵלֵךְ
  choice: நான் ... போக வேண்டும்
  rationale: முன்னுள்ள கட்டளைக்குப் பின் வரும் நோக்கம் அல்லது விருப்பத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: אַרְצִי
  choice: என் சொந்த நாடு
  rationale: אֶרֶץ என்பதன் ‘நாடு/நிலம்’ என்ற பொருளையும் முதலாம் நபர் உரிமையையும் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: தாவீதின் மரணத்தைச் சொல்லும் எபிரெய மரபுத்தொடர்
  choice: உருவகத்தை முதன்மை உரையில் காத்து, அதன் பொருளை அடிக்குறிப்பில் விளக்குதல்
  alternative: ‘தாவீது இறந்துவிட்டார்’ என்று நேரடியாக மொழிபெயர்த்தல்
  rationale: மூலத்தின் மரணக் கருத்தை மறைக்காமல் விளக்குவதோடு, அதன் தனித்துவமான உருவகத்தையும் தீர்க்காமல் காக்கிறது.
translation_notes:
  register: நவீனத் தரத்தமிழில், எளிதில் புரியும் மரியாதையான கதைநடை பயன்படுத்தப்பட்டுள்ளது. பார்வோனிடம் பேசும் வேண்டுகோளில் மரியாதைப் பன்மை இடம்பெறுகிறது. மூலத்தில் தனியான ‘இப்போது/அப்போது’ என்ற காலச் சொல் இல்லாததால் தேவையற்ற தொடக்க இணைப்புச்சொல் சேர்க்கப்படவில்லை.
