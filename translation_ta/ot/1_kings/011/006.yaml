source:
  edition: WLC
  text: וַ/יַּ֧עַשׂ שְׁלֹמֹ֛ה הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וְ/לֹ֥א מִלֵּ֛א אַחֲרֵ֥י יְהוָ֖ה כְּ/דָוִ֥ד אָבִֽי/ו׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/006.yaml
  text: So Solomon did what was evil in the eyes of Yahweh[a], and he did not fully follow Yahweh, as David his father had done.
translation:
  language: ta
  text: சாலொமோன் யாவேயின் பார்வையில் தீமையானதைச் செய்தான்; தன் தந்தையான தாவீதைப் போல அவன் யாவேயை முழுமையாகப் பின்பற்றவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘யாவேயின் பின்னால் முழுமையாகச் செல்லவில்லை’ அல்லது ‘யாவேமீது முழுமையான பற்றுறுதி கொண்டிருக்கவில்லை.’ இந்த எபிரேய மரபுத்தொடர் முழுமையற்ற பற்றுறுதி அல்லது கீழ்ப்படிதலை வெளிப்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: செய்தான்
  rationale: עשה என்ற பொதுவான வினை இங்கு ஒருவரின் நடத்தையைக் குறிக்கிறது. ‘தீமையானதைச் செய்தான்’ என்பது எபிரேயக் கட்டமைப்பையும் இயல்பான நவீனத் தமிழையும் காக்கிறது.
- source_word: הָרַע
  choice: தீமையானதை
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் இந்தப் பெயரடை ‘தீமையானது’ அல்லது ‘தீமையான செயல்’ என்ற பொருளைத் தருகிறது. இங்கு அறநெறி சார்ந்த தீமையைக் ‘தீமையானதை’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: בְּעֵינֵי יְהוָה
  choice: யாவேயின் பார்வையில்
  rationale: இது யாவேயின் மதிப்பீட்டின்படி என்பதைக் குறிக்கும் எபிரேய உருவகம். ‘பார்வையில்’ என்பது அந்த உருவகத்தை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநாமத்தின் மெய்யெழுத்து வடிவமான YHWH-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், பரவலாக ஏற்கப்படும் ‘Yahweh’ உச்சரிப்பைத் தமிழில் ‘யாவே’ என்று ஒலிபெயர்க்கிறது.
- source_word: מִלֵּא אַחֲרֵי
  choice: முழுமையாகப் பின்பற்ற
  rationale: இந்த எபிரேய மரபுத்தொடர் முழுமையான பின்பற்றுதலையும் விசுவாசமான பற்றுறுதியையும் குறிக்கிறது. ‘முழுமையாகப் பின்பற்ற’ என்பது உள்ளார்ந்த அர்ப்பணிப்பை மட்டும் வலியுறுத்தாமல் அதன் செயற்பாட்டு நுணுக்கத்தையும் காக்கிறது.
- source_word: כְּדָוִד אָבִיו
  choice: தன் தந்தை தாவீதைப் போல
  rationale: சாலொமோனின் தந்தையும் முன்மாதிரியுமான தாவீதுடன் ஒப்பிடுவதைத் தெளிவாகவும் இயல்பாகவும் வழங்குகிறது; ‘பின்பற்றினான்’ என்ற வினை சூழலிலிருந்து புரிந்துகொள்ளப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைநாமத்தின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர் / யெகோவா
  rationale: மூலத்தில் பட்டப்பெயர் அல்லாமல் திருநாமமே உள்ளது. எனவே அதை ‘யாவே’ என்று ஒலிபெயர்ப்பது உடன்படிக்கை இறைநாமத்தை வெளிப்படையாகக் காக்கிறது.
- issue: מִלֵּא אַחֲרֵי יְהוָה என்பதில் சாலொமோனின் தவறின் அளவு
  choice: யாவேயை முழுமையாகப் பின்பற்றவில்லை
  alternative: யாவேமீது முழு மனதுடன் பற்றுறுதி கொண்டிருக்கவில்லை
  rationale: இந்தச் சொற்றொடர் முழுமையற்ற பின்பற்றுதலைக் குறிக்கிறது. இவ்வசனம் மட்டும் கூறுவதைக் காட்டிலும் வலுவாக முழுமையான விசுவாசத் துறப்பை மொழிபெயர்ப்பில் புகுத்தாமல், மூலத்தின் இறையியல் பதற்றத்தை இது காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. எபிரேய மதிப்பீட்டு உருவகமான ‘பார்வையில்’ தக்கவைக்கப்பட்டு, கடினமாக ஒலிக்கக்கூடிய மரபுத்தொடர் ‘முழுமையாகப் பின்பற்றவில்லை’ என்று தெளிவாக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறியீடு அது விளக்கும் சொற்றொடருக்குப் பின்னரே வைக்கப்பட்டுள்ளது.
