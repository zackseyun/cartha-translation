  text: And I will take you[a], and you shall reign over all that your soul desires, and you shall be king over Israel.
translation:
  language: ta
  text: நான் உன்னை எடுத்துக்கொள்வேன்; உன் உள்ளம் விரும்பும் அனைத்தின்மேலும் நீ ஆட்சி செய்வாய்; இஸ்ரவேலின்மேல் அரசனாக இருப்பாய்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶקַּח
  choice: நான் உன்னை எடுத்துக்கொள்வேன்
  rationale: לקח என்பதன் அடிப்படைப் பொருளான ‘எடுத்துக்கொள்’ என்பதைக் காக்கிறது; இங்கு உள்ள தெய்வீக நியமனத்தை ‘தேர்ந்தெடுப்பேன்’ என்று விளக்கமாகச் சுருக்கிவிடவில்லை.
- source_word: וּמָלַכְתָּ
  choice: நீ ஆட்சிசெய்வாய்
  rationale: מלך என்பது அரசனாகப் பதவியேற்பதை மட்டும் அல்லாமல் அரசாட்சி செய்வதையும் குறிக்கிறது; இச்சூழலில் இயல்பான தமிழில் அந்தச் செயற்பாட்டைத் தெளிவாகக் காட்டுகிறது.
- source_word: בְּכֹל אֲשֶׁר
  choice: எல்லாவற்றின்மேலும்
  rationale: מלך என்பதோடு வரும் ב ஆட்சியின் பரப்பைச் சுட்டுகிறது; ‘எல்லாவற்றின்மேலும்’ என்பது அதன் விரிவை இயல்பாகப் பாதுகாக்கிறது.
- source_word: תְּאַוֶּה נַפְשֶׁךָ
  choice: உன் உள்ளம் விரும்புகிற
  rationale: נֶפֶשׁ உடைய எபிரெய உருவகத்தை முற்றிலும் நீக்காமல், நவீனத் தமிழில் இயல்பாகவும் புரியத்தக்கவாறும் ‘உன் உள்ளம்’ என வழங்குகிறது; சொற்சொல்லான வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְהָיִיתָ מֶּלֶךְ
  choice: அரசனாயிருப்பாய்
  rationale: היה + பெயர்ச்சொல் இங்கு விளைவாக அமையும் அரசப் பதவிநிலையை அறிவிக்கிறது; ‘அரசனாயிருப்பாய்’ அந்த முறையான அறிவிப்பைச் சுருக்கமாகக் காக்கிறது.
- source_word: עַל יִשְׂרָאֵל
  choice: இஸ்ரவேலின்மேல்
  rationale: அரசாட்சிச் சூழலில் עַל அதிகாரம் செலுத்தப்படும் மக்களையோ நாட்டையோ குறிக்கிறது; தமிழில் ‘-ன்மேல்’ அதற்கு நேரான இணையாகும்.
theological_decisions:
- issue: נֶפֶשׁ என்ற மனித இயல்பைக் குறிக்கும் சொல்லாட்சி
  choice: முதன்மை உரையில் ‘உன் உள்ளம்’ என்றும், சொற்சொல்லான உருவகத்தை அடிக்குறிப்பில் ‘உன் உயிர்’ என்றும் வழங்குதல்
  alternative: ‘நீ விரும்புகிற’ அல்லது ‘உன் ஆத்துமா விரும்புகிற’
  rationale: இவ்வசனம் ஆன்மாவின் இயல்பைப் பற்றிய தொழில்நுட்பக் கோட்பாட்டை முன்வைக்கவில்லை. ‘நீ விரும்புகிற’ என்பது மூல உருவகத்தை அழித்துவிடும்; ‘ஆத்துமா’ என்பது இங்கு நவீனத் தமிழில் தேவையற்ற கோட்பாட்டுச் சாயலும் இயல்பின்மையும் தரலாம். ‘உள்ளம்’ விருப்பத்தின் உள்நிலைத் தன்மையைப் பாதுகாக்கிறது; அடிக்குறிப்பு எபிரெயச் சொல்லாட்சியை வெளிப்படையாகக் காட்டுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘ஆட்சிசெய்வாய்’ செயற்பாட்டைக் காட்டுகிறது; ‘அரசனாயிருப்பாய்’ பதவிநிலையைத் தனியாகக் காக்கிறது. மூலத்தின் இணைப்புத் தொடர் அரைப்புள்ளிகளால் தெளிவாக்கப்பட்டுள்ளது.
