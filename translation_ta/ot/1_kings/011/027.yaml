source:
  edition: WLC
  text: וְ/זֶ֣ה הַ/דָּבָ֔ר אֲשֶׁר הֵרִ֥ים יָ֖ד בַּ/מֶּ֑לֶךְ שְׁלֹמֹה֙ בָּנָ֣ה אֶת הַ/מִּלּ֔וֹא סָגַ֕ר אֶת פֶּ֕רֶץ עִ֖יר דָּוִ֥ד אָבִֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/027.yaml
  text: 'And this was the reason why he raised his hand against the king: Solomon had built the Millo and closed up the breach of the city of David his father[a][b].'
translation:
  language: ta
  text: 'அவன் அரசனுக்கு எதிராகக் கையை உயர்த்தியதற்கான காரணம் இதுதான்: சாலொமோன் மில்லோவைக் கட்டி, தன் தந்தை தாவீதின் நகரமதிலின் உடைப்பை அடைத்தார்[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, விளக்கமாக, “அரசனுக்கு எதிராகக் கலகம் செய்தான்.” எபிரெய மரபுத்தொடர் சொல்லடிப்படையில் “அரசனுக்கு எதிராகத் தன் கையை உயர்த்தினான்” என்று உள்ளது.
    reason: alternative_reading
  - marker: b
    text: “மில்லோ” என்பது எருசலேமிலிருந்த பெயரிடப்பட்ட ஒரு பாதுகாப்புக் கட்டமைப்பையோ, படிநிலைத் தளங்களைத் தாங்கிய நிரப்புக் கட்டமைப்பையோ குறித்திருக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: הַדָּבָר
  choice: காரணம்
  rationale: சொல்லடிப்படையில் ‘காரியம்/விஷயம்’ என்றாலும், இங்கு வரும் அமைப்பு யெரொபெயாமின் எதிர்ப்புக்கான விளக்கத்தை அறிமுகப்படுத்துகிறது; ஆகவே ‘காரணம்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: הֵרִים יָד
  choice: கையுயர்த்தினான்
  rationale: ‘கையை உயர்த்துதல்’ என்ற எபிரெய மரபுத்தொடரின் உருவகத்தைத் தக்கவைத்து, அரசனுக்கு எதிரான பகைச் செயல் அல்லது கலகத்தைக் குறிக்கிறது.
- source_word: בַּמֶּלֶךְ
  choice: அரசனுக்கு எதிராக
  rationale: முந்தைய மரபுத்தொடருடன் இணைந்து பகைச் செயலின் இலக்கைச் சுட்டுகிறது; மூலத்தில் இவ்விடத்தில் சாலொமோனின் பெயரல்ல, ‘அரசன்’ என்றே உள்ளது.
- source_word: הַמִּלּוֹא
  choice: மில்லோ
  rationale: எருசலேமிலிருந்த குறிப்பிட்ட கட்டமைப்பு அல்லது இடப்பெயரைக் குறிக்கும் சொல்லாதலால், நிச்சயமற்ற விளக்கமொழிபெயர்ப்பை விட ஒலிபெயர்ப்பு பயன்படுத்தப்படுகிறது.
- source_word: סָגַר
  choice: அடைத்தார்
  rationale: ‘மூடு/அடை’ என்பதே வினையின் நேரடிப் பொருள்; மதில் உடைப்பைச் சரிசெய்த சூழலிலும் இயல்பாக அமைகிறது.
- source_word: פֶּרֶץ
  choice: மதில் உடைப்பு
  rationale: நகரப் பாதுகாப்புச் சூழலில் மதிலிலுள்ள உடைவு அல்லது இடைவெளியைக் குறிக்கிறது; ‘மதில்’ என்பது சூழலால் விளங்கும் பொருளைத் தெளிவாக்குகிறது.
- source_word: עִיר דָּוִד
  choice: தாவீதின் நகரம்
  rationale: தாவீதோடு தொடர்புடைய எருசலேம் கோட்டைக்கான வழக்கமான பெயரிடலை இயல்பான தமிழில் வழங்குகிறது.
- source_word: אָבִיו
  choice: தன் தந்தையான
  rationale: இது சாலொமோனின் தந்தையான தாவீதைக் குறிக்கிறது; ‘தன்’ என்பது தமிழ் வாக்கியத்தில் அதன் தொடர்பைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: הֵרִים יָד என்ற மரபுத்தொடரின் பொருள்
  choice: முதன்மை உரையில் ‘கையுயர்த்தினான்’ என்ற மூல உருவகம் தக்கவைக்கப்பட்டது.
  alternative: ‘அரசனுக்கு எதிராகக் கலகம் செய்தான்’ என்று விளக்கமாக மொழிபெயர்க்கலாம்.
  rationale: மூலத்தின் உருவகத்தையும் அதன் பகை/கலகப் பொருளிலுள்ள சிறு நெகிழ்வையும் தக்கவைத்து, விளக்கமான பொருளை அடிக்குறிப்பில் வழங்குகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘கையுயர்த்துதல்’ என்ற எபிரெய உருவகம் முதன்மை உரையில் பாதுகாக்கப்பட்டு, அதன் கலகப் பொருள் அடிக்குறிப்பில் தெளிவுபடுத்தப்பட்டுள்ளது. சாலொமோனே செய்பவர் என்பதால் இரண்டாம் வாக்கியத்தில் மரியாதை ஒருமை வினை பயன்படுத்தப்பட்டுள்ளது.
