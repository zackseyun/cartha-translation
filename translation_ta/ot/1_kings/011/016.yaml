source:
  edition: WLC
  text: כִּ֣י שֵׁ֧שֶׁת חֳדָשִׁ֛ים יָֽשַׁב שָׁ֥ם יוֹאָ֖ב וְ/כָל יִשְׂרָאֵ֑ל עַד הִכְרִ֥ית כָּל זָכָ֖ר בֶּ/אֱדֽוֹם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/016.yaml
  text: For Joab and all Israel had remained there six months[b][a], until he had cut off every male in Edom.
translation:
  language: ta
  text: ஏனெனில், யோவாபும் இஸ்ரவேல் முழுவதும் அங்கே ஆறு மாதங்கள் தங்கியிருந்தார்கள்; யோவாப் ஏதோமிலுள்ள எல்லா ஆண்களையும் அழித்துவிடும்வரை[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேய வினைச்சொல்லின் சொற்படியான பொருள் ‘அறுத்துப்போட்டான்’ அல்லது ‘துண்டித்துவிட்டான்.’ இங்கு அது ஒரு மக்கள் தொகுதியை அழித்தல் அல்லது ஒழித்தல் என்ற பொருளில் வரும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான விளக்கத்தையோ காரணப் பின்னணியையோ அறிமுகப்படுத்தும் இணைப்புச் சொல்லாக இங்கு வருகிறது.
- source_word: שֵׁשֶׁת חֳדָשִׁים
  choice: ஆறு மாதங்கள்
  rationale: கால அளவை இயல்பான நவீனத் தமிழில் நேரடியாகக் குறிக்கிறது.
- source_word: יָשַׁב שָׁם
  choice: அங்கே தங்கியிருந்தார்கள்
  rationale: இராணுவ நடவடிக்கையின் சூழலில், நிரந்தரமாகக் குடியிருந்தார்கள் என்பதல்லாமல் தொடர்ந்து அங்கே இருந்தார்கள் என்ற பொருளைத் தருகிறது; கூட்டெழுவாய்க்கேற்ப தமிழில் பன்மை வினை பயன்படுத்தப்பட்டுள்ளது.
- source_word: וְכָל יִשְׂרָאֵל
  choice: அவனும் இஸ்ரவேல் முழுவதும்
  rationale: எபிரேயத்தின் கூட்டுத் தேசியக் குறிப்பை நெருக்கமாகத் தக்கவைக்கிறது; சூழலில் இது யோவாபுடன் இருந்த இஸ்ரவேல் படையினரைக் குறிக்க வாய்ப்புள்ளதால் அடிக்குறிப்பு சேர்க்கப்பட்டுள்ளது.
- source_word: עַד
  choice: வரை
  rationale: செயல் நீடித்த காலத்தின் முடிவைத் தெளிவாகக் குறிக்கிறது.
- source_word: הִכְרִית
  choice: யோவாப் அழித்தொழிக்கும்வரை
  rationale: எபிரேய வினை ஒருமையில் இருப்பதால் செய்பவர் யோவாப் என்பதைத் தமிழில் தெளிவாக்குகிறது; ‘அறுத்துப்போடு/துண்டித்துவிடு’ என்ற சொல்லுருவின் மக்கள்தொகை ஒழிப்பு சார்ந்த மரபுப் பொருளை ‘அழித்தொழி’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כָּל זָכָר
  choice: ஆண்கள் அனைவரையும்
  rationale: זָכָר என்பதன் ஆண்பால் குறிக்கும் பொருளைத் தக்கவைக்கிறது; வயது வந்தவர்கள் மட்டுமே என்று எபிரேயத்தில் இல்லாத வரம்பைச் சேர்க்கவில்லை.
- source_word: בֶּאֱדוֹם
  choice: ஏதோமிலுள்ள
  rationale: செயல் ஏதோம் நாட்டிற்குள் நிகழ்ந்தது என்ற இடப்பொருளை வெளிப்படுத்துகிறது.
