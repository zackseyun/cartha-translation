  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வரலாற்று நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரேயத்தில் யோவாப் செய்த செயலைக் குறிக்கும் ஒருமை வினைக்கும், யோவாபும் இஸ்ரவேலும் தங்கியிருந்ததைக் குறிக்கும் கூட்டெழுவாய்க்கும் இடையிலான வேறுபாடு தமிழில் இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது.
