revisions:
- from: ஏனெனில், ஏதோமிலுள்ள ஆண்கள் அனைவரையும் யோவாப் அழித்தொழிக்கும்வரை[a], அவனும் இஸ்ரவேல் முழுவதும்[b] ஆறு மாதங்கள் அங்கே தங்கியிருந்தார்கள்.
  to: ஏனெனில், யோவாபும் இஸ்ரவேல் முழுவதும் அங்கே ஆறு மாதங்கள் தங்கியிருந்தார்கள்; யோவாப் ஏதோமிலுள்ள எல்லா ஆண்களையும் அழித்துவிடும்வரை[a].
  rationale: The revision restores the source’s main-clause-then-until-clause order, removes an unclear pronoun, and explicitly preserves the singular Hebrew verb by naming Joab as the one who carried out the action. Footnote b is retained because the collective expression ‘all Israel’ may denote the fighting force rather than every individual in the nation.
  reviewer_model: gpt-5.6-terra
