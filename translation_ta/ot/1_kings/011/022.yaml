  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான உரையாடல் நடை பயன்படுத்தப்பட்டுள்ளது. பார்வோன் ஆதாதை ஒருமையில் அழைப்பதும், ஆதாத் பார்வோனை மரியாதைப் பன்மையில் வேண்டுவதும் சமூக உறவுக்கு ஏற்ப வேறுபடுத்தப்பட்டுள்ளது.
