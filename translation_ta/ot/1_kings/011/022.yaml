base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/022.yaml
  text: Then Pharaoh said to him[a], “But what do you lack with me, that you are seeking to go to your own land?” And he said, “Nothing, but please let me go.”
translation:
  language: ta
  text: அப்போது பார்வோன் அவனிடம், “என்னிடம் உனக்கு என்ன குறை இருக்கிறது? அப்படியிருக்க, நீ உன் நாட்டுக்குப் போக விரும்புகிறாயே?” என்று கேட்டான். அதற்கு அவன், “ஒரு குறையும் இல்லை; ஆனால், என்னை அனுப்பிவிடுங்கள்[a]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “அனுப்பி, நீர் என்னை அனுப்புவீராக” என்று வலியுறுத்தும் வகையில், வினையின் தனி வலியுறுத்தல் வடிவமும் முற்றுவினையும் இணைக்கப்பட்டுள்ளன.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי מָה אַתָּה חָסֵר עִמִּי
  choice: என்னோடு இருக்கையில் உனக்கு என்ன குறை?
  rationale: חָסֵר என்பது குறை அல்லது தேவை இருப்பதைக் குறிக்கிறது; עִמִּי-யின் உறவுசார் பொருளையும் தமிழில் இயல்பாக வெளிப்படுத்துகிறது. தொடக்க כִּי-யின் உரையாடல் சார்ந்த விளக்கம் கேள்வியின் இயல்பான அமைப்பில் உள்ளடக்கப்பட்டுள்ளது.
- source_word: וְהִנְּךָ מְבַקֵּשׁ
  choice: நீ … போக விரும்புகிறாயே?
  rationale: מְבַקֵּשׁ இங்கு செல்ல விரும்புவதைக் குறிக்கிறது. הִנֵּה கவனத்தை ஈர்க்கும் நுணுக்கத்தை ‘விரும்புகிறாயே’ என்ற தமிழ் வாக்கிய முடிவு வெளிப்படுத்துகிறது; அதைத் தேவையின்றி காலச்சொல்லாக மாற்றவில்லை.
- source_word: לָלֶכֶת אֶל־אַרְצֶךָ
  choice: உன் நாட்டுக்குப் போக
  rationale: הלך என்பதன் நேரடியான பொருள் ‘போக’; எபிரெயத்தில் வெளிப்படையாக இல்லாத ‘திரும்பிப் போக’ என்ற கருத்து சேர்க்கப்படவில்லை.
- source_word: לֹא
  choice: ஒரு குறையும் இல்லை
  rationale: தனித்து நிற்கும் לֹא, பார்வோனின் கேள்விக்கான நீள்விடையாக, தனக்கு எந்தக் குறையும் இல்லை என்று பொருள்படுகிறது.
- source_word: כִּי שַׁלֵּחַ תְּשַׁלְּחֵנִי
  choice: ஆனாலும் எப்படியாயினும் என்னை அனுப்பிவிடுங்கள்
  rationale: இரண்டாவது כִּי பதிலின் முக்கிய எதிர்மறைத் திருப்பத்தை அறிமுகப்படுத்துகிறது. வினையெச்சப் பெயருருவும் முற்றுவினையும் சேர்ந்த எபிரெய வலியுறுத்தலை ‘எப்படியாயினும்’ வெளிப்படுத்துகிறது; அரசனிடம் கூறப்படும் வேண்டுகோளுக்கேற்ற மரியாதைப் பன்மையும் பயன்படுத்தப்பட்டுள்ளது.
