  edition: WLC
  text: וְ/הַ/מֶּ֣לֶךְ שְׁלֹמֹ֗ה אָהַ֞ב נָשִׁ֧ים נָכְרִיּ֛וֹת רַבּ֖וֹת וְ/אֶת בַּת פַּרְעֹ֑ה מוֹאֲבִיּ֤וֹת עַמֳּנִיּוֹת֙ אֲדֹ֣מִיֹּ֔ת צֵדְנִיֹּ֖ת חִתִּיֹּֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/001.yaml
  text: 'King Solomon loved many foreign women[a], including Pharaoh’s daughter: Moabite, Ammonite, Edomite, Sidonian, and Hittite women.'
translation:
  language: ta
  text: 'சாலொமோன் ராஜா அந்நியப் பெண்கள் பலரையும்[a], பார்வோனின் மகளையும் நேசித்தான்: மோவாபியப் பெண்கள், அம்மோனியப் பெண்கள், ஏதோமியப் பெண்கள், சீதோனியப் பெண்கள், ஏத்தியப் பெண்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்நிய மனைவிகள் பலரை.” எபிரெய மூலத்தில் “அந்நியப் பெண்கள் பலரை” என்றே உள்ளது; இவர்கள் சாலொமோனின் மனைவிகள் அல்லது துணைவியர் என்பதைச் சூழல் காட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמֶּלֶךְ שְׁלֹמֹה
  choice: சாலொமோன் ராஜா
  rationale: וְ என்னும் இணைப்புச் சொல் இங்கு கதையைத் தொடர்கிறது; தமிழில் தேவையற்ற காலக் குறிப்பைச் சேர்க்காமல், இயல்பான பெயர்–பட்ட அமைப்பில் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: אָהַב
  choice: நேசித்தான்
  rationale: வினையின் வழக்கமான பொருளான ‘நேசித்தான்’ என்பதையே நேரடியாகக் காக்கிறது; அதன் உணர்ச்சி அல்லது நெறிசார் வலிமையைத் தணிக்கவில்லை.
- source_word: נָשִׁים נָכְרִיּוֹת רַבּוֹת
  choice: அந்நியப் பெண்கள் பலரை
  rationale: נָשִׁים என்பது நேரடியாக ‘பெண்கள்’ என்று பொருள்படும்; சூழலில் மனைவிகள் அல்லது துணைவியர் குறிக்கப்பட்டாலும், மூலத்தின் பொதுவான சொல்லை முதன்மை உரை காக்கிறது.
- source_word: וְאֶת בַּת פַּרְעֹה
  choice: பார்வோனின் மகள் உட்பட
  rationale: பார்வோனின் மகளும் சாலொமோன் நேசித்த பெண்களுடன் சேர்த்துக் குறிப்பிடப்படுகிறாள் என்பதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מוֹאֲבִיּוֹת עַמֳּנִיּוֹת אֲדֹמִיֹּת צֵדְנִיֹּת חִתִּיֹּת
  choice: மோவாபிய, அம்மோனிய, ஏதோமிய, சீதோனிய, ஏத்தியப் பெண்களை
  rationale: ஒவ்வொரு இனப்பெயரையும் அதன் குறிப்பிட்ட புவியியல்–இன அடையாளத்துடன் காக்கிறது; ‘பெண்கள்’ என்னும் பொதுப்பெயர் தமிழில் பட்டியலின் இறுதியில் இயல்பாக வழங்கப்பட்டுள்ளது.
theological_decisions:
- issue: נָשִׁים என்பதை ‘பெண்கள்’ என்றா ‘மனைவிகள்’ என்றா மொழிபெயர்ப்பது
  choice: பெண்கள்
  alternative: மனைவிகள்
  rationale: எபிரெய மூலத்தில் உள்ள சொல் பொதுவாக ‘பெண்கள்’ என்பதே. திருமண அல்லது துணைவியர் உறவைச் சூழல் சுட்டினாலும், வசனம் கூறுவதைவிடக் குறுகிய பொருளை முதன்மை உரையில் திணிக்காமல், மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- issue: பார்வோனின் மகள் அந்நியப் பெண்களில் சேர்த்துக் குறிப்பிடப்படுகிறாளா அல்லது தனிப் பிரிவாகக் காட்டப்படுகிறாளா
  choice: அவர்களில் சேர்த்துக் குறிப்பிடப்படுகிறாள்
  alternative: அவர்களோடு கூடுதலாகத் தனியே குறிப்பிடப்படுகிறாள்
  rationale: וְאֶת என்னும் சேர்க்கை அமைப்பும் வசனத்தின் தொடரும் பார்வோனின் மகளை சாலொமோன் நேசித்த அந்நியப் பெண்களுள் ஒருவராகப் புரிந்துகொள்ள இடமளிக்கின்றன. ‘உட்பட’ என்பது இதைச் சுருக்கமாகக் காட்டுகிறது; அவருடைய இனத்தைத் தொடர்ந்து வரும் பட்டியலில் ஒன்றாகத் தவறாக அடையாளப்படுத்தவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. இனப்பெயர்களுக்கு தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்பட்ட வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன.
