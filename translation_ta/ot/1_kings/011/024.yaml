  source_fidelity: 'எபிரெய மூலத்தின் வரிசையும் முக்கியப் பொருள்களும் துல்லியமாகக் காக்கப்பட்டுள்ளன: ரெசோன் ஆட்களைத் தன்னிடம் சேர்த்துக்கொள்வது, ஒரு படைக்குழுவின் தலைவனாவது, தாவீது ‘அவர்களை’க் கொன்ற காலச்சூழல், பின்னர் வரும் மூன்று பன்மை வினைகள் அனைத்தும் சரியாகத் தரப்பட்டுள்ளன. ‘அவர்களைக்’ என்பது மூலத்தில் உள்ள பன்மைச் சுட்டுப்பெயரின் முன்னிலையைக் கட்டாயமாகத் தீர்மானிக்காமல் பாதுகாக்கிறது.'
  naturalness: நடை நவீனத் தரத் தமிழில் தெளிவாகவும் வேதாகம உரைநடைக்கேற்ற கண்ணியத்துடனும் உள்ளது. ‘ஆட்களைத் தன்னிடம் திரட்டிக்கொண்டு’ மற்றும் ‘படைக்குழுவின் தலைவனானான்’ இயல்பானவை. இறுதித் தொடரில் பன்மை எழுவாயுடன் வரும் வினைகள் தெளிவாக அமைந்துள்ளன.
