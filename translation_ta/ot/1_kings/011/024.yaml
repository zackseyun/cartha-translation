  text: וַ/יִּקְבֹּ֤ץ עָלָי/ו֙ אֲנָשִׁ֔ים וַ/יְהִ֣י שַׂר גְּד֔וּד בַּ/הֲרֹ֥ג דָּוִ֖ד אֹתָ֑/ם וַ/יֵּלְכ֤וּ דַמֶּ֨שֶׂק֙ וַ/יֵּ֣שְׁבוּ בָ֔/הּ וַֽ/יִּמְלְכ֖וּ בְּ/דַמָּֽשֶׂק־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/024.yaml
  text: He gathered men to himself and became commander of a band when David killed them. They went to Damascus[a], settled there, and reigned in Damascus.
translation:
  language: ta
  text: அவன் ஆட்களைத் தன்னிடம் திரட்டிக்கொண்டு, தாவீது அவர்களைக் கொன்றபோது ஒரு படைக்குழுவின் தலைவனானான். அவர்கள் தமஸ்குவுக்குச் சென்று[a], அங்கே குடியேறி, தமஸ்குவில் அரசாண்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வசனத்தின் பிற்பகுதி முழுவதிலும் எபிரெய மொழியில் பன்மை வினைச்சொற்களே உள்ளன: “அவர்கள் சென்றார்கள்… குடியேறினார்கள்… அரசாண்டார்கள்.” சூழல் ரெசோனை மையப்படுத்துவதால் சில மொழிபெயர்ப்புகள் இதை “அவன்” என்று ஒருமைப்படுத்துகின்றன.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְבֹּץ עָלָיו אֲנָשִׁים
  choice: அவன் ஆட்களைத் தன்னிடம் திரட்டிக்கொண்டு
  rationale: קבץ עַל என்பதன் தன்னைச் சுற்றி ஆட்களைச் சேர்த்துக்கொள்ளுதல் என்ற பொருளை இயல்பான நவீனத் தமிழில் தருகிறது. இராணுவச் சூழலில் אֲנָשִׁים என்பதற்கு ‘ஆட்கள்’ பொருத்தமானது.
- source_word: שַׂר גְּדוּד
  choice: ஒரு படைக்குழுவின் தலைவன்
  rationale: שַׂר என்பது தலைவர் அல்லது தளபதி; גְּדוּד என்பது படைக்குழு அல்லது ஆயுதக்குழு. மூலத்தில் வெளிப்படையாக இல்லாத ‘கொள்ளைக்குழு’ போன்ற கூடுதல் நுண்பொருளைச் சேர்க்காமல் ‘படைக்குழு’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: בַּהֲרֹג דָּוִד אֹתָם
  choice: தாவீது அவர்களைக் கொன்றபோது
  rationale: ב + infinitive construct இங்கு காலச்சூழலைக் குறிக்கிறது. אֹתָם என்ற பன்மைப் பெயர்ச்சுட்டின் குறிப்பு யார் என்பதைத் தீர்மானிக்காமல் ‘அவர்களை’ என்று அப்படியே வைத்திருக்கிறது.
- source_word: וַיֵּלְכוּ דַמֶּשֶׂק
  choice: அவர்கள் தமஸ்குவுக்குச் சென்று
  rationale: பன்மை வினைவடிவத்தையும் தமஸ்குவை நோக்கிய நகர்வையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: וַיֵּשְׁבוּ בָהּ
  choice: அங்கே குடியேறி
  rationale: ישב இச்சூழலில் ஓரிடத்தில் தங்கி வாழத் தொடங்குதல் அல்லது குடியேறுதல் என்பதைக் குறிக்கிறது.
- source_word: וַיִּמְלְכוּ בְּדַמָּשֶׂק
  choice: தமஸ்குவில் அரசாண்டார்கள்
  rationale: מלך என்பதன் அரசாளுதல் என்ற பொருளையும் எபிரெய பன்மை வினைவடிவத்தையும் பாதுகாக்கிறது.
theological_decisions:
- issue: வசனத்தின் பிற்பகுதியில் பன்மை வினைகள் வருவது, விரிவான சூழல் ரெசோனை மையப்படுத்துவதுடன் ஏற்படுத்தும் உரைநடை இழுபறி
  choice: ‘அவர்கள் சென்றார்கள்… குடியேறினார்கள்… அரசாண்டார்கள்’ என்ற பன்மைப் பொருளைப் பாதுகாத்தல்
  alternative: ரெசோனையே மறைமுக எழுவாயாகக் கொண்டு ‘அவன் சென்றான்… குடியேறினான்… அரசாண்டான்’ என்று ஒருமைப்படுத்துதல்
  rationale: எபிரெய மூலத்தில் வசனத்தின் பிற்பகுதி முழுவதும் பன்மை வினைவடிவங்கள் உள்ளன. அவற்றை ஒருமையாக மாற்றுவது சூழலின் அடிப்படையில் செய்யும் விளக்கத் தீர்மானமாகிவிடும்; ஆகவே மூலத்தின் உண்மையான பதற்றம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘படைக்குழு’ என்பது தேவையற்ற எதிர்மறை நுண்பொருளைச் சேர்க்காமல் இராணுவக் குழுவைக் குறிக்கிறது; இறுதி மூன்று வினைகளின் பன்மை திட்டமிட்டு பாதுகாக்கப்பட்டுள்ளது.
