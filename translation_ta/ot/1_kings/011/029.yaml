source:
  edition: WLC
  text: וַֽ/יְהִי֙ בָּ/עֵ֣ת הַ/הִ֔יא וְ/יָֽרָבְעָ֖ם יָצָ֣א מִ/ירוּשָׁלִָ֑ם וַ/יִּמְצָ֣א אֹת֡/וֹ אֲחִיָּה֩ הַ/שִּׁילֹנִ֨י הַ/נָּבִ֜יא בַּ/דֶּ֗רֶךְ וְ/ה֤וּא מִתְכַּסֶּה֙ בְּ/שַׂלְמָ֣ה חֲדָשָׁ֔ה וּ/שְׁנֵי/הֶ֥ם לְ/בַדָּ֖/ם בַּ/שָּׂדֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/029.yaml
  text: And at that time[a], when Jeroboam went out from Jerusalem, Ahijah the Shilonite, the prophet, found him on the road. Now he had wrapped himself in a new cloak, and the two of them were alone in the open field.
translation:
  language: ta
  text: அக்காலத்தில், யெரொபெயாம் எருசலேமிலிருந்து புறப்பட்டுச் சென்றபோது, சீலோவைச் சேர்ந்த இறைவாக்கினர் அகியா அவரை வழியில் கண்டார். அப்போது அவர் ஒரு புதிய மேலங்கியைப் போர்த்திக்கொண்டிருந்தார்; அவர்கள் இருவரே வயல்வெளியில்[a] இருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வயலில்.”
    reason: שָׂדֶה என்பதன் அடிப்படை இடப்பொருளுக்கான நெருக்கமான மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: וַיְהִי בָּעֵת הַהִיא
  choice: அக்காலத்தில்
  rationale: எபிரெயக் கதைத் தொடக்கச் சூத்திரத்தின் காலச் சூழலை இயல்பான நவீனத் தமிழில் தருகிறது; தமிழில் தேவையற்றதாகத் தோன்றும் ‘அப்போது நிகழ்ந்ததாவது’ என்ற சொற்சொல் வடிவத்தைத் தவிர்க்கிறது.
- source_word: יָצָא מִירוּשָׁלָם
  choice: எருசலேமிலிருந்து புறப்பட்டுச் சென்றபோது
  rationale: יָצָא என்பதன் வெளியே செல்வதான திசை உணர்வைப் பாதுகாத்து, வாக்கியத்தின் காலப் பின்னணியையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיִּמְצָא אֹתוֹ
  choice: அவரை வழியில் கண்டார்
  rationale: מצא என்பதன் அடிப்படைப் பொருளான ‘கண்டார்’ என்பதை வைத்திருக்கிறது; சூழலில் சந்திப்பைக் குறிக்கக்கூடிய வாய்ப்பைத் தனியாகத் தீர்மானிப்பதில்லை.
- source_word: אֲחִיָּה הַשִּׁילֹנִי הַנָּבִיא
  choice: சீலோவைச் சேர்ந்த இறைவாக்கினர் அகியா
  rationale: இனப்பெயர் வடிவத்தைத் தமிழில் இயல்பான இடத் தொடர்பாக வழங்கி, ‘இறைவாக்கினர்’ என்ற மரியாதையான நவீனச் சொல்லால் נָבִיא என்பதை மொழிபெயர்க்கிறது.
- source_word: בַּדֶּרֶךְ
  choice: வழியில்
  rationale: இடத்தைக் குறிக்கும் எபிரெயச் சொற்றொடருக்கான நேரடியும் இயல்பானதுமான தமிழ் வடிவம்.
- source_word: וְהוּא מִתְכַּסֶּה
  choice: அவர் ... போர்த்திக்கொண்டிருந்தார்
  rationale: Hitpael வடிவத்தின் தற்சுட்டுப் பொருளையும், சந்திப்பின்போது தொடர்ந்திருந்த நிலையையும் வெளிப்படுத்துகிறது. ‘அவர்’ என்பது அகியாவையோ யெரொபெயாமையோ குறிக்கக்கூடிய எபிரெயச் சுட்டுப்பெயரின் மெய்யான தெளிவின்மையைத் தமிழிலும் பாதுகாக்கிறது.
- source_word: בְּשַׂלְמָה חֲדָשָׁה
  choice: ஒரு புதிய மேலங்கியை
  rationale: שַׂלְמָה குறிக்கும் வெளிப்புற ஆடையைத் தெளிவாகக் காட்டுகிறது; அடுத்த வசனத்தில் அது கிழிக்கப்படுவதற்கும் பொருத்தமாக உள்ளது.
- source_word: וּשְׁנֵיהֶם לְבַדָּם
  choice: அவர்கள் இருவரும் ... தனியாக இருந்தார்கள்
  rationale: வேறு யாரும் உடனில்லை என்ற வலியுறுத்தலைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: בַּשָּׂדֶה
  choice: வயல்வெளியில்
  rationale: שָׂדֶה என்பதன் வயல் அல்லது திறந்த வெளி என்ற இடப்பொருளை இயல்பான தமிழில் தருகிறது; அடிப்படை மாற்று ‘வயலில்’ அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
theological_decisions:
- issue: וְהוּא என்பதன் சுட்டுப்பெயர் யாரைக் குறிக்கிறது
  choice: ‘அவர்’ என்று பெயரைக் குறிப்பிடாமல் வைத்தல்
  alternative: ‘அகியா’ அல்லது ‘யெரொபெயாம்’ என்று வெளிப்படையாகக் குறிப்பிடுதல்
  rationale: எபிரெய மூலத்தில் ஆண்பால் ஒருமைச் சுட்டுப்பெயர் மட்டுமே உள்ளது; சூழல் அகியாவைக் குறிக்கலாம் என்றாலும் இலக்கண ரீதியாக யெரொபெயாமையும் குறிக்க இயலும். மொழிபெயர்ப்பு இந்தத் தெளிவின்மையைத் தீர்த்துவிடவில்லை.
translation_notes:
  register: நவீனச் செந்தமிழ் சார்ந்த, ஆனால் பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் மரியாதையான நடை பயன்படுத்தப்பட்டுள்ளது. கதைநடை இயல்பாக இருக்க நீண்ட எபிரெய வாக்கியம் இரண்டு தமிழ்வாக்கியங்களாக அமைக்கப்பட்டுள்ளது; மூலத்தின் சுட்டுப்பெயர் தெளிவின்மை பாதுகாக்கப்பட்டுள்ளது.
