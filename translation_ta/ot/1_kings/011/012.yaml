source:
  edition: WLC
  text: אַךְ בְּ/יָמֶ֨י/ךָ֙ לֹ֣א אֶעֱשֶׂ֔/נָּה לְמַ֖עַן דָּוִ֣ד אָבִ֑י/ךָ מִ/יַּ֥ד בִּנְ/ךָ֖ אֶקְרָעֶֽ/נָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/012.yaml
  text: Nevertheless[a], in your days I will not do it, for the sake of David your father[b]; from the hand of your son I will tear it away.
translation:
  language: ta
  text: ஆனாலும், உன் நாட்களில் அதைச் செய்யமாட்டேன்[a]; உன் தந்தையாகிய தாவீதின் பொருட்டு, உன் மகனின் கையிலிருந்து அதை கிழித்தெடுப்பேன்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, முந்தைய வசனத்தில் அறிவிக்கப்பட்ட ராஜ்யத்தைப் பறித்துக்கொள்ளுதல்.
    reason: cross_reference
  - marker: b
    text: “உன் மகனின் கையிலிருந்து” என்பது அவனுடைய ஆட்சி அல்லது உடைமையிலிருந்து என்பதைக் குறிக்கும் எபிரேய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: ஆனாலும்
  rationale: முந்தைய வசனத்தில் அறிவிக்கப்பட்ட தீர்ப்பை வரையறுத்து, அதற்கு எதிர்மறையான ஒரு விதிவிலக்கை அறிமுகப்படுத்துகிறது.
- source_word: בְּיָמֶיךָ
  choice: உன் நாட்களில்
  rationale: எபிரேய காலக் குறிப்பை நெருக்கமாகப் பாதுகாக்கிறது; சூழலில் இது சாலொமோனின் வாழ்நாளைக் குறிக்கிறது.
- source_word: לֹא אֶעֱשֶׂנָּה
  choice: அதைச் செய்யமாட்டேன்
  rationale: பெண்பால் பின்னொட்டு முந்தைய வசனத்தில் அறிவிக்கப்பட்ட ராஜ்யத்தைப் பறிக்கும் செயலையே சுட்டுகிறது; பொருளை தேவையின்றி வெளிப்படையாக்காமல் சூழல் தொடர்பைப் பாதுகாக்கிறது.
- source_word: לְמַעַן דָּוִד אָבִיךָ
  choice: உன் தந்தையாகிய தாவீதின் பொருட்டு
  rationale: לְמַעַן இங்குக் காரணத்தை மட்டும் அல்லாமல் தாவீதைக் கருத்தில்கொண்டு காட்டப்படும் தயவையும் வெளிப்படுத்துகிறது.
- source_word: מִיַּד בִּנְךָ
  choice: உன் மகனின் கையிலிருந்து
  rationale: ஆட்சி அல்லது உடைமையிலிருந்து அகற்றப்படுவதை உணர்த்தும் எபிரேய உருவகத்தைப் பாதுகாக்கிறது.
- source_word: אֶקְרָעֶנָּה
  choice: அதை கிழித்தெடுப்பேன்
  rationale: קָרַע என்பதன் ‘கிழித்தல்’ உருவகத்தையும், ராஜ்யம் பிரிக்கப்படுவதையும் இயல்பான தமிழில் எடுத்துரைக்கிறது.
theological_decisions:
- issue: சாலொமோன்மீதான தீர்ப்பு தள்ளிவைக்கப்படுதல்
  choice: அறிவிக்கப்பட்ட ராஜ்யப் பறிப்பு சாலொமோனின் நாட்களில் நடைபெறாது; அவன் மகனிடமிருந்து அது பறிக்கப்படும்.
  alternative: ‘உன் வாழ்நாளில் அதைச் செய்யமாட்டேன்’ என்று காலக் குறிப்பை விளக்கமாக மொழிபெயர்க்கலாம்.
  rationale: எபிரேயம் பொருளை வெளிப்படையாக மீண்டும் கூறாமல் முந்தைய சூழலைச் சார்ந்துள்ளது. மொழிபெயர்ப்பு அந்த இணைப்பையும், தாவீதின் பொருட்டு தீர்ப்பு தள்ளிவைக்கப்படுவதையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘உன் நாட்களில்’ மற்றும் ‘கையிலிருந்து’ என்ற எபிரேய உருவகங்கள் தெளிவை இழக்காமல் பாதுகாக்கப்பட்டுள்ளன.
