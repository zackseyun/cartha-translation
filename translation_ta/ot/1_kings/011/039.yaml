  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַֽ/אעַנֶּ֛ה אֶת זֶ֥רַע דָּוִ֖ד לְמַ֣עַן זֹ֑את אַ֖ךְ לֹ֥א כָל הַ/יָּמִֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/039.yaml
  text: And I will afflict the offspring of David because of this[a], but not forever.
translation:
  language: ta
  text: இதன் காரணமாகத் தாவீதின் சந்ததியை நான் துன்புறுத்துவேன்; ஆனால் என்றென்றைக்கும் அல்ல.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேரடியாக, “எல்லா நாட்களிலும் அல்ல.”
    reason: எபிரெய மூலத்தின் சொல்வடிவைத் தெரிவித்து, ‘என்றென்றைக்கும் அல்ல’ என்பது அதன் இயல்பான பொருள் என்பதை வாசகர் காண உதவுகிறது.
lexical_decisions:
- source_word: וַאעַנֶּה
  choice: நான் துன்புறுத்துவேன்
  rationale: பீயேல் வடிவிலுள்ள ענה இங்கு துன்பத்தையோ தாழ்வையோ ஏற்படுத்துவதைக் குறிக்கிறது. தீர்ப்பின் சூழலைத் தெளிவாகக் காட்டுவதுடன் தேவையற்ற மிகைப்படுத்தலைத் தவிர்க்கும் இயல்பான தமிழ்ச் சொல் இது.
- source_word: זֶרַע דָּוִד
  choice: தாவீதின் சந்ததி
  rationale: זֶרַע என்பது கூட்டு ஒருமைப் பொருளில் தாவீதின் வழிவந்தோரைக் குறிக்கிறது. ‘சந்ததி’ அந்தக் கூட்டுப் பொருளையும் இயல்பான தமிழையும் காக்கிறது.
- source_word: לְמַעַן זֹאת
  choice: இதன் காரணமாக
  rationale: முந்தைய பகுதியில் கூறப்பட்ட குற்றத்தைச் சுட்டி, வரவிருக்கும் துன்பத்தின் காரணத்தை இந்தச் சொற்றொடர் தெரிவிக்கிறது.
- source_word: אַךְ
  choice: ஆனால்
  rationale: முன்னதாகக் கூறப்பட்ட தீர்ப்பின் காலவரம்பை எதிர்மறைத் திருப்பத்துடன் கட்டுப்படுத்துகிறது.
- source_word: לֹא כָל הַיָּמִים
  choice: என்றென்றைக்கும் அல்ல
  rationale: சொல்லுக்குச் சொல் ‘எல்லா நாட்களிலும் அல்ல’ என்றாலும், எபிரெயச் சொற்றொடரின் இயல்பான பொருள் துன்பம் நிரந்தரமானதல்ல என்பதாகும். ‘என்றென்றைக்கும் அல்ல’ என்பது இப்பொருளைத் தெளிவான நவீன தமிழில் தருகிறது; நேரடி சொல்வடிவு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
theological_decisions:
- issue: தாவீதின் சந்ததிக்கு வரும் தீர்ப்பின் கால அளவு
  choice: அந்தத் துன்பம் நிரந்தரமானது அல்ல என்று வெளிப்படையாகக் கூறுதல்
  alternative: ‘எல்லா நாட்களிலும் அல்ல’ என்று நேரடியாக மொழிபெயர்த்தல்
  rationale: எபிரெய உரை உண்மையான தீர்ப்பையும் அதற்குள்ள காலவரம்பையும் ஒருங்கே வைத்திருக்கிறது. மொழிபெயர்ப்பு அந்த இறையியல் இழுவிசையைப் பேணுகிறது; வசனம் கூறுவதைத் தாண்டி தாவீதுக்கான வாக்குறுதியைப் பற்றிய கூடுதல் விளக்கத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘துன்புறுத்துவேன்’ தீர்ப்பின் கடுமையைத் தக்கவைக்கிறது; ‘என்றென்றைக்கும் அல்ல’ அதன் வரம்பைத் தெளிவாகச் சொல்கிறது.
