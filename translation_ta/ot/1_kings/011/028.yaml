base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/028.yaml
  text: The man Jeroboam was a mighty man of valor[a], and Solomon saw that the young man was industrious[b], so he appointed him over all the labor force of the house of Joseph.
translation:
  language: ta
  text: யெரொபெயாம் வலிமையும் திறமையும் மிக்க மனிதனாய் இருந்தான்[a]. அந்த இளைஞன் உழைப்பாளி என்பதைச் சாலொமோன் கண்டு, யோசேப்பின் வீட்டாரின் எல்லாச் சுமைவேலைக்கும்[b] அவனைப் பொறுப்பாளியாக நியமித்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வலிமைமிக்கவன்” அல்லது “வீரமிக்கவன்.” எபிரெயச் சொற்றொடர் வலிமை, வீரம், அல்லது குறிப்பிடத்தக்க திறமை ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “யோசேப்பின் வீட்டார்” என்பது யோசேப்பின் வழிவந்த கோத்திரத்தாரை, குறிப்பாக எப்பிராயீம் மற்றும் மனாசே கோத்திரத்தாரைக் குறிக்கிறது. இங்குள்ள “சுமைவேலை” அரசுக்கான கடின உழைப்பைக் குறிக்கிறது; இது கட்டாய உழைப்பையும் சுட்டக்கூடும்.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָאִישׁ יָרָבְעָם
  choice: யெரொபெயாம் என்ற அந்த மனிதன்
  rationale: הָאִישׁ என்பதன் குறிப்பிட்ட தன்மையையும், וְ என்பதன் கதைத் தொடர்ச்சியையும் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; மூலத்தில் இல்லாத காலப்பொருளைச் சேர்க்கவில்லை.
- source_word: גִּבּוֹר חָיִל
  choice: மிகவும் திறமைவாய்ந்தவன்
  rationale: இச்சூழலில் இந்தச் சொற்றொடர் போர்வீரத்தைக் கட்டாயமாகக் குறிக்காமல் வலிமை, ஆற்றல், தகுதி ஆகியவற்றைக் குறிக்கலாம். அடுத்துவரும் நிர்வாக நியமனத்துக்கு ஏற்றவாறு பரந்த பொருளைத் தருகிறது.
- source_word: הַנַּעַר
  choice: அந்த இளைஞன்
  rationale: நிர்வாகப் பொறுப்பேற்கும் வயதுடைய யெரொபெயாமைக் குறிக்கும் சூழலில், ‘சிறுவன்’ அல்லது ‘வேலைக்காரன்’ என்பதைக் காட்டிலும் ‘இளைஞன்’ பொருத்தமானது.
- source_word: כִּי עֹשֵׂה מְלָאכָה הוּא
  choice: கடினமாக உழைப்பதை
  rationale: சொல்லுக்குச் சொல் ‘அவன் வேலை செய்பவனாக இருந்தான்’ என்ற கருத்தை, சாலொமோனின் நியமனத்துக்கான காரணமாக விளங்கும் உழைப்புத் தன்மையுடன் இயல்பான தமிழில் தருகிறது.
- source_word: וַיַּפְקֵד אֹתוֹ
  choice: அவனை மேற்பார்வையாளனாக நியமித்தான்
  rationale: Hiphil வடிவில் உள்ள פקד, ஒருவரைப் பொறுப்பில் அமர்த்துதல் அல்லது ஒன்றின்மேல் அதிகாரியாக வைப்பதைக் குறிக்கிறது.
- source_word: לְכָל סֵבֶל
  choice: செய்யவேண்டிய சுமைவேலை முழுவதற்கும்
  rationale: סֵבֶל என்பது சுமைதாங்கும் கடின உழைப்பு அல்லது அரசுப் பணிச்சுமையைக் குறிக்கிறது. இவ்வசனத்தில் கட்டாயத்தின் தன்மை வெளிப்படையாகக் குறிக்கப்படாததால் ‘கட்டாய உழைப்பு’ என்று தீர்மானிக்காமல் மூலத்தின் பரப்பைத் தக்கவைக்கிறது.
- source_word: בֵּית יוֹסֵף
  choice: யோசேப்பின் வீட்டார்
  rationale: எபிரெய ‘யோசேப்பின் வீடு’ என்ற குல/கோத்திரப் பெயரை இயல்பான தமிழில் வழங்குகிறது; அதன் குறிப்பிட்ட வரலாற்றுப் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
theological_decisions:
- issue: גִּבּוֹר חָיִל என்பதன் போர்சார் அல்லது பொதுத்திறன் சார்ந்த பொருள்
  choice: மிகவும் திறமைவாய்ந்தவன்
  alternative: வீரமிக்க வலிமைசாலி
  rationale: உடனடி சூழல் போர்க்களமல்ல; உழைப்புத் திறனைப் பார்த்து நிர்வாகப் பொறுப்பு கொடுக்கப்படுவதே கவனம். இருப்பினும் எபிரெயச் சொல்லின் வீர/வலிமைப் பொருளை அடிக்குறிப்பில் பாதுகாக்கிறது.
- issue: סֵבֶל என்பது கட்டாய உழைப்பா அல்லது பணிச்சுமையா
  choice: சுமைவேலை
  alternative: கட்டாய உழைப்பு
  rationale: அரசுக்கான கடின உழைப்பைச் சுட்டினாலும், இவ்வசனத்தில் மட்டும் ‘கட்டாயம்’ என்பது வெளிப்படையாக இல்லை. எனவே அந்தச் சமூக-அரசியல் சாத்தியத்தை அடிக்குறிப்பில் குறிப்பிட்டு, முதன்மை உரையில் மிகைத் தீர்மானத்தைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன செந்தமிழ் நடை; பொதுவாசகர்களுக்குப் புரியக்கூடிய சொற்கள் பயன்படுத்தப்பட்டுள்ளன. மூலத்தின் கதைநடை தக்கவைக்கப்பட்டு, ‘இப்போது’ போன்ற மூலத்தில் இல்லாத உரையாடல் இணைப்புச் சொல் சேர்க்கப்படவில்லை. போர்வீரம் மற்றும் பொதுத்திறன், பணிச்சுமை மற்றும் கட்டாய உழைப்பு ஆகிய உண்மையான பொருள் பரப்புகள் அடிக்குறிப்புகள் வழியாகப் பாதுகாக்கப்பட்டுள்ளன.
