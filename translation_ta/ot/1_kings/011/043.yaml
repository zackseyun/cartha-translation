source:
  edition: WLC
  text: וַ/יִּשְׁכַּ֤ב שְׁלֹמֹה֙ עִם אֲבֹתָ֔י/ו וַ/יִּ֨קָּבֵ֔ר בְּ/עִ֖יר דָּוִ֣ד אָבִ֑י/ו וַ/יִּמְלֹ֛ךְ רְחַבְעָ֥ם בְּנ֖/וֹ תַּחְתָּֽי/ו־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/043.yaml
  text: And Solomon slept with his fathers and was buried in the city of David his father[a], and Rehoboam his son reigned in his place.
translation:
  language: ta
  text: சாலொமோன் தன் முன்னோர்களோடு துயிலடைந்து[a], தன் தகப்பனாகிய தாவீதின் நகரத்தில் அடக்கம் செய்யப்பட்டார். அவருக்குப் பதிலாக அவருடைய மகன் ரெகொபெயாம் அரசாண்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “முன்னோர்களோடு துயிலடைந்தார்” என்பது ஒருவர் இறந்து தமது முன்னோர்களுடன் சேர்ந்ததைக் குறிக்கும் வழக்கமான எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: தன் முன்னோர்களோடு துயிலடைந்து
  rationale: இது மரணத்தையும் முன்னோர்களுடன் சேர்வதையும் குறிக்கும் வழக்கமான எபிரெய அரச மரணச் செய்தி மரபுத்தொடர். ‘துயிலடைந்து’ என்பது மரணத்தைத் தெளிவாக உணர்த்துவதோடு, மூலத்தின் ‘துயில்/படுத்தல்’ உருவகத்தையும் பாதுகாக்கிறது; ‘முன்னோர்கள்’ என்பது இன்றைய தமிழில் இயல்பாகவும் அனைவரையும் உள்ளடக்கும் மரபுவழிப் பொருளுடனும் உள்ளது.
- source_word: וַיִּקָּבֵר
  choice: அடக்கம் செய்யப்பட்டார்
  rationale: நிஃபால் வடிவத்தின் செயப்பாட்டு பொருளை இயல்பான நவீன தமிழில் துல்லியமாகக் கொடுக்கிறது.
- source_word: בְּעִיר דָּוִד אָבִיו
  choice: தன் தகப்பனாகிய தாவீதின் நகரத்தில்
  rationale: அடக்க இடத்தையும் தாவீது சாலொமோனின் தகப்பன் என்ற வம்ச உறவையும் மூலத்தைப் போலவே வெளிப்படுத்துகிறது.
- source_word: וַיִּמְלֹךְ
  choice: அரசாண்டார்
  rationale: அரச வாரிசுரிமைச் செய்தியில் வரும் சுருக்கமான வினைச்சொல்லுக்கு இயல்பான தமிழ் இணை; அரியணை ஏற்ற தருணத்தை மட்டும் அல்லாமல் அரசாட்சியையும் குறிக்கிறது.
- source_word: תַּחְתָּיו
  choice: அவருக்குப் பதிலாக
  rationale: காலவரிசையை மட்டும் குறிக்கும் ‘அவருக்குப் பின்’ என்பதைக் காட்டிலும், முந்தைய அரசரின் இடத்தை வாரிசு ஏற்றுக்கொண்டதைத் துல்லியமாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: ‘முன்னோர்களோடு துயிலடைதல்’ என்ற மரண மரபுத்தொடரின் பொருள்
  choice: உருவகத்தை முதன்மை உரையில் பாதுகாத்து, அதன் வழக்கமான மரணப் பொருளை அடிக்குறிப்பில் விளக்குதல்
  alternative: ‘இறந்தார்’ என்று நேரடியாக மொழிபெயர்த்தல்
  rationale: மூலத்தின் பண்பாட்டு மற்றும் இலக்கிய வடிவத்தைப் பாதுகாக்கிறது; அதேவேளையில் இது மறுமை நிலை குறித்த விரிவான கோட்பாட்டைத் தனியாக நிர்ணயிக்காத மரபுத்தொடர் என்பதையும் அமைதியாக வைத்திருக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. அரச மரணச் செய்தியின் சுருக்கமான நடை பாதுகாக்கப்பட்டுள்ளது. ‘தகப்பன்’ என்ற சொல் வேதாகமச் சூழலுக்கேற்ற கண்ணியமான நடையையும் நேரடி வம்ச உறவையும் தருகிறது; ‘ரெகொபெயாம்’ என்பது רחבעם என்பதற்கான தமிழ் ஒலிபெயர்ப்பு.
