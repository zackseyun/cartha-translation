source:
  edition: WLC
  text: וַ/יִּתְאַנַּ֥ף יְהוָ֖ה בִּ/שְׁלֹמֹ֑ה כִּֽי נָטָ֣ה לְבָב֗/וֹ מֵ/עִ֤ם יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הַ/נִּרְאָ֥ה אֵלָ֖י/ו פַּעֲמָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/009.yaml
  text: And Yahweh became angry with Solomon, because his heart had turned away from Yahweh, the God of Israel, who had appeared to him twice.
translation:
  language: ta
  text: சாலொமோனின் இதயம், இருமுறை சாலொமோனுக்குக் காட்சியளித்த இஸ்ரவேலின் கடவுளாகிய யாவேவிடமிருந்து விலகியதால், யாவே சாலொமோன் மீது கோபமடைந்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְאַנַּף
  choice: கோபமடைந்தார்
  rationale: வினை வடிவம் கோபம் எழுந்ததையோ வெளிப்பட்டதையோ குறிக்கிறது; தீவிரத்தை மிகைப்படுத்தாமல் இயல்பான தமிழில் இதைத் தெரிவிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநான்கெழுத்தான இறைப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் தெளிவான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: בִּשְׁלֹמֹה
  choice: சாலொமோன்மீது
  rationale: கோபத்தைக் குறிக்கும் வினையுடன் வரும் בְּ இங்கு கோபம் செலுத்தப்பட்ட நபரைக் குறிக்கிறது; தமிழில் ‘மீது’ இயல்பான இணைவு.
- source_word: כִּי
  choice: விலகியதால்
  rationale: யாவேயின் கோபத்திற்கான காரணத்தை அறிமுகப்படுத்தும் காரணப் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: נָטָה לְבָבוֹ
  choice: சாலொமோனின் இதயம் ... விலகியதால்
  rationale: לֵבָב என்ற இதய உருவகத்தையும், נָטָה குறிக்கும் பற்றுறவிலிருந்து திரும்புதல் அல்லது சாய்தலையும் காக்கிறது.
- source_word: מֵעִם
  choice: அவரைவிட்டு
  rationale: உறவு மற்றும் பற்றுறவிலிருந்து பிரிவதைச் சூழலுக்கேற்ற இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கடவுளாகிய
  rationale: எபிரெயக் கட்டமைப்பின் உடைமை மற்றும் அடையாளப் பொருளைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: הַנִּרְאָה אֵלָיו
  choice: சாலொமோனுக்கு ... காட்சியளித்திருந்தும்
  rationale: பெயரெச்சத் தொடரை இயல்பான தமிழ் வினையெச்சத் தொடராக வழங்குகிறது; முன்னர் நிகழ்ந்த தோற்றத்தை ‘காட்சியளித்திருந்தும்’ காட்டுகிறது.
- source_word: פַּעֲמָיִם
  choice: இருமுறை
  rationale: இருமை வடிவத்தின் நேரடியான, இயல்பான தமிழ் இணை.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: யெகோவா; கர்த்தர்
  rationale: மூல வசனம் தனிப்பட்ட உடன்படிக்கைப் பெயரையே பயன்படுத்துகிறது. ஆகவே பட்டப் பெயராக மாற்றாமல் ஒலிபெயர்ப்பு பயன்படுத்தப்படுகிறது.
- issue: இறைக் கோபத்தைக் குறிக்கும் மனித உணர்வுசார் மொழி
  choice: கோபமடைந்தார்
  alternative: கோபமாக இருந்தார்; கடுஞ்சினம் கொண்டார்
  rationale: சாலொமோனின் விலகலுக்குப் பதிலாக யாவே கோபமடைந்தார் என்று உரை நேரடியாகக் கூறுகிறது; அதை மென்மைப்படுத்தாமலும் மிகைப்படுத்தாமலும் காக்கிறது.
- issue: הַנִּרְאָה אֵלָיו என்ற உறவுப்பெயரெச்சத் தொடரின் குறிப்பு
  choice: யாவே சாலொமோனுக்கு இருமுறை காட்சியளித்திருந்தும்
  alternative: சாலொமோனுக்கு இருமுறை காட்சியளித்த யாவே
  rationale: எபிரெயத்தில் இத்தொடர் யாவே/இஸ்ரவேலின் கடவுள் என்பவரையே குறிக்கிறது. தமிழ் வாக்கியத்தில் எதிர்பார்ப்புக்கு முரணான சாலொமோனின் விலகலை இயல்பாக வெளிப்படுத்த ‘இருந்தும்’ பயன்படுத்தப்பட்டது; நிகழ்வின் உண்மை மாற்றப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் பொதுவாசகத் தெளிவும் உடைய நடை. ‘இதயம்’ என்ற வேதாகம உருவகம் பாதுகாக்கப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் இறுதியில் வரும் ‘இருமுறை காட்சியளித்தவர்’ என்ற தொடரை தமிழில் முன்னிறுத்தி, ‘காட்சியளித்திருந்தும்’ என அமைத்ததால் காரணமும் முரண்பாடும் தெளிவாகின்றன.
