source:
  edition: WLC
  text: וַ/יְהִי ל֣/וֹ נָשִׁ֗ים שָׂרוֹת֙ שְׁבַ֣ע מֵא֔וֹת וּ/פִֽלַגְשִׁ֖ים שְׁלֹ֣שׁ מֵא֑וֹת וַ/יַּטּ֥וּ נָשָׁ֖י/ו אֶת לִבּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/003.yaml
  text: He had seven hundred wives[a], princesses, and three hundred concubines; and his wives turned away his heart.
translation:
  language: ta
  text: அவனுக்கு இளவரசிகளான மனைவிகள்[a] எழுநூறு பேரும், துணைமனைவிகள் முந்நூறு பேரும் இருந்தார்கள்; அவனுடைய மனைவிகள் அவனுடைய இருதயத்தைத் திசைதிருப்பினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, உயர்நிலையிலிருந்த பெண்கள்.
    reason: שָׂרוֹת என்பதற்கான ‘இளவரசிகள்’ என்ற முதன்மைப் பொருளுடன், ‘உயர்நிலையிலிருந்த பெண்கள்’ என்ற பரந்த சொற்பொருள் மாற்றையும் பாதுகாக்கிறது.
lexical_decisions:
- source_word: וַיְהִי לוֹ
  choice: அவனுக்கு ... இருந்தார்கள்
  rationale: היה + ל possession idiom; இயல்பான தமிழில் உடைமையை ‘அவனுக்கு ... இருந்தார்கள்’ என வெளிப்படுத்துகிறது.
- source_word: נָשִׁים
  choice: மனைவிகள்
  rationale: அரசத் திருமணங்களின் சூழலில் இது பொதுவாகப் பெண்களை அல்ல, மனைவிகளைக் குறிக்கிறது.
- source_word: שָׂרוֹת
  choice: அரசகுலப் பெண்களான
  rationale: உயர்குடி அல்லது அரச நிலை கொண்ட பெண்கள் என்ற பொருளை, ‘இளவரசிகள்’ என்று மிகக் குறுகலாக வரையறுக்காமல் இயல்பாகத் தருகிறது.
- source_word: שְׁבַע מֵאוֹת
  choice: எழுநூறு பேர்
  rationale: எண்ணை நேரடியாகவும் மனிதர்களுக்குரிய எண்ணுப்பெயருடனும் தருகிறது.
- source_word: וּפִלַגְשִׁים
  choice: மறுமனைவிகள்
  rationale: அங்கீகரிக்கப்பட்டிருந்தாலும் முதன்மை மனைவிகளைவிடத் தாழ்ந்த நிலையிலிருந்த பெண் துணைகளை நவீன, கண்ணியமான தமிழில் குறிக்கிறது.
- source_word: שְׁלֹשׁ מֵאוֹת
  choice: முந்நூறு பேர்
  rationale: எண்ணை நேரடியாகவும் இயல்பான தமிழ் நடையிலும் தருகிறது.
- source_word: וַיַּטּוּ
  choice: திசைதிருப்பினார்கள்
  rationale: נטה என்பதன் திசைமாற்றும் கருத்தையும், பின்வரும் சமய மற்றும் ஒழுக்க விலகலுக்கான சூழலையும் தேவையின்றி விளக்கித் தீர்க்காமல் காக்கிறது.
- source_word: נָשָׁיו
  choice: அவனுடைய மனைவிகள்
  rationale: இறுதி வாக்கியத்தின் எழுவாய் மனைவிகளே என்பதைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: אֶת לִבּוֹ
  choice: அவனுடைய இருதயத்தை
  rationale: உணர்ச்சியை மட்டும் அல்லாமல் சிந்தனை, மனவுறுதி, பற்றுறுதி ஆகியவற்றையும் உள்ளடக்கும் எபிரெயக் கருத்தின் மரபான, செறிவான தமிழ்ச் சமனைப் பாதுகாக்கிறது.
theological_decisions:
- issue: ‘அவனுடைய இருதயம்’ என்பதன் பொருள்
  choice: சாலொமோனின் உள்ளார்ந்த பற்றுறுதி, மனவுறுதி, சிந்தனை ஆகியவற்றை உள்ளடக்கும் சொல்லாக ‘இருதயம்’ பாதுகாக்கப்பட்டது.
  alternative: உணர்ச்சிப்பூர்வமான அன்பில் ஏற்பட்ட மாற்றம் மட்டும்
  rationale: எபிரெய சிந்தனையில் לֵב என்பது உணர்ச்சியைத் தாண்டி சிந்தனை, சித்தம், விசுவாசப் பற்றுறுதி ஆகியவற்றையும் குறிக்கிறது; மொழிபெயர்ப்பு அந்த இறையியல் செறிவையும் தெளிவற்ற விரிவையும் காக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழ்; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘அரசகுலப் பெண்களான மனைவிகள்’ என்பது שָׂרוֹת என்பதைக் ‘இளவரசிகள்’ என மிகக் குறுகலாக்காமல் உயர்நிலையை வெளிப்படுத்துகிறது. அடிக்குறிப்பு இல்லாததால் குறியீடும் சேர்க்கப்படவில்லை.
