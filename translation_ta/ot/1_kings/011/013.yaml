  text: Yet I will not tear away the whole kingdom; I will give one tribe to your son[a], for the sake of David my servant and for the sake of Jerusalem, which I have chosen.
translation:
  language: ta
  text: “ஆனாலும்[a], ராஜ்யம் முழுவதையும் நான் பறித்துவிட மாட்டேன். என் பணியாளனான தாவீதின் பொருட்டும், நான் தேர்ந்துகொண்ட எருசலேமின் பொருட்டும், ஒரு கோத்திரத்தை உன் மகனுக்குக் கொடுப்பேன்.”
  philosophy: optimal-equivalence
  footnotes:
