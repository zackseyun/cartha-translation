theological_decisions:
- issue: ஒரு கோத்திரம் காக்கப்படுவதற்கான காரணம்
  choice: தாவீதும் தேர்ந்துகொள்ளப்பட்ட எருசலேமும் ஆகிய இரண்டையும் கருத்திற்கொண்டு அரசாட்சி முழுவதும் அகற்றப்படாது என்று வசனம் கூறுகிறது.
  alternative: இது தாவீதுடன் செய்யப்பட்ட உடன்படிக்கையால் மட்டுமே நிகழ்கிறது அல்லது நகரம்/ஆலயத்திற்காகவே முதன்மையாக நிகழ்கிறது என்று விளக்குவது.
  rationale: எபிரெய உரை ‘என் பணியாளனான தாவீதின் பொருட்டும்’ என்றும் ‘நான் தேர்ந்துகொண்ட எருசலேமின் பொருட்டும்’ என்றும் இணையான இரு காரணங்களைத் தருகிறது. மொழிபெயர்ப்பு ஒன்றை மற்றொன்றுக்குள் அடக்காமல் இரண்டையும் அப்படியே வைத்திருக்கிறது.
