    issue: அரசாட்சி for מַמְלָכָה
    rationale: அரசாட்சி commonly refers to the exercise or system of governing. The Hebrew refers to the kingdom as the royal realm that will be torn away and apportioned. ராஜ்யம் is the more exact and established Tamil equivalent in this context.
