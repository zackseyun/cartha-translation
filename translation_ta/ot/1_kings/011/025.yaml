base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/025.yaml
  text: And he was an adversary to Israel all the days of Solomon[a], along with the harm that Hadad caused. And he loathed Israel and reigned over Aram.
translation:
  language: ta
  text: ஆதாத் செய்த தீங்கோடு சேர்ந்து, சாலொமோனின் நாட்களெல்லாம் அவன் இஸ்ரவேலுக்கு எதிரியாக இருந்தான்.[a] அவன் இஸ்ரவேலைக் கடுமையாக வெறுத்து, ஆராமின்மேல் அரசாண்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆதாத் செய்த தீங்கிற்கும் மேலாக.” எபிரெயத் தொடர் விடுபட்ட கூறுகளைக் கொண்ட சுருக்கமான தொடராக உள்ளது. இந்த எதிரி ஆதாத் விளைவித்த தீங்கிற்கு மேலாக எழுந்தான் என்றும் பொருள் கொள்ளலாம்.
    reason: மூல எபிரெயத் தொடரின் சுருக்கமான அமைப்பாலும் சேர்க்கைச் சொல்லின் பொருளாலும் உருவாகும் மாற்று வாசிப்பைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: שָׂטָן
  choice: எதிரி
  rationale: இங்கு அரசியல் சார்ந்த மனித எதிரியையே குறிக்கிறது; பிற்காலத் தனிப்பெயரான ‘சாத்தான்’ என்ற பொருளைச் சேர்க்கவில்லை.
- source_word: לְיִשְׂרָאֵל
  choice: இஸ்ரவேலுக்கு எதிரியாக
  rationale: לְ என்ற முன்னிடைச்சொல் எதிர்ப்புக்குள்ளான தரப்பைக் குறிக்கிறது; தமிழில் ‘எதிரியாக’ என்பதுடன் இது இயல்பாக வெளிப்படுகிறது.
- source_word: כָּל יְמֵי שְׁלֹמֹה
  choice: சாலொமோனின் நாட்களெல்லாம்
  rationale: சாலொமோனின் வாழ்நாள் அல்லது ஆட்சிக்காலம் முழுவதையும் குறிக்கும் எபிரெய காலத் தொடரை நெருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: וְאֶת הָרָעָה אֲשֶׁר הֲדָד
  choice: ஆதாத்தால் ஏற்பட்ட தீங்கோடு இதுவும் சேர்ந்தது
  rationale: மூலத்தில் இத்தொடர் விடுபட்ட கூறுகளுடன் சுருக்கமாக உள்ளது. רָעָה என்பது இச்சூழலில் அறநெறித் தீமையைவிட இஸ்ரவேலுக்கு ஏற்பட்ட தீங்கு அல்லது தொல்லையைக் குறிக்கிறது; சேர்க்கைப் பொருளை தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: וַיָּקָץ בְּיִשְׂרָאֵל
  choice: இஸ்ரவேலைக் கடுமையாக வெறுத்து
  rationale: קוץ வெளிப்படுத்தும் வலுவான அருவருப்பு அல்லது வெறுப்பை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: וַיִּמְלֹךְ עַל אֲרָם
  choice: ஆராமின்மேல் அரசாண்டான்
  rationale: அராம் என்ற பழைய தனிப்பெயரைத் தக்கவைத்து, מלך என்பதன் அரசாட்சி பொருளை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: שָׂטָן என்பதை ‘சாத்தான்’ என்ற தனிப்பெயராக மொழிபெயர்க்கலாமா?
  choice: மனித ‘எதிரி’
  alternative: சாத்தான்
  rationale: சூழல் சாலொமோனுக்கு எதிராக எழுந்த அரசியல் எதிரிகளைப் பற்றியது. இங்கு இச்சொல் பொதுப்பெயர்; இயற்கைக்கு அப்பாற்பட்ட ஒருவரின் தனிப்பெயராகப் புரிந்துகொள்வதற்கு உரையில் ஆதாரம் இல்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பாகவும், வரலாற்றுக் கதையாடலுக்கேற்ற கண்ணியமான நடையிலும் அமைக்கப்பட்டது. ‘சாத்தான்’ என்ற தேவையற்ற இறையியல் தொடர்பு தவிர்க்கப்பட்டது; சிக்கலான எபிரெயத் தொடர் அடிக்குறிப்பில் திறந்தவாறு வைக்கப்பட்டது.
