  text: וְ/יָרָבְעָם֩ בֶּן נְבָ֨ט אֶפְרָתִ֜י מִן הַ/צְּרֵדָ֗ה וְ/שֵׁ֤ם אִמּ/וֹ֙ צְרוּעָה֙ אִשָּׁ֣ה אַלְמָנָ֔ה עֶ֖בֶד לִ/שְׁלֹמֹ֑ה וַ/יָּ֥רֶם יָ֖ד בַּ/מֶּֽלֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/026.yaml
  text: Jeroboam son of Nebat[a], an Ephraimite from Zeredah—his mother's name was Zeruah, a widow—was a servant of Solomon[c][b], and he raised his hand against the king.
translation:
  language: ta
  text: நேபாத்தின் மகனான, செரேதாவைச் சேர்ந்த எப்பிராயீமியன் யெரொபெயாம்[a]—அவனுடைய தாயின் பெயர் செரூவா; அவள் ஒரு விதவைப் பெண்—சாலொமோனின் பணியாளனாக இருந்தான். அவன் அரசனுக்கு எதிராகக் கை ஓங்கினான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘எப்பிராத்தியன்.’ எனினும் இங்கு ‘எப்பிராயீமியன்’ என்பதே பெரும்பாலும் பொருத்தமான பொருள்.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, ‘அரசனுக்கு எதிராகக் கலகம் செய்தான்.’ எபிரேயத்தில், ‘அரசனுக்கு எதிராகத் தன் கையை உயர்த்தினான்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶפְרָתִי
  choice: எப்பிராயீமியன்
  rationale: இங்கு இந்தச் சொல் எப்பிராயீம் கோத்திரத்தைச் சேர்ந்தவனைக் குறிப்பதே சூழலுக்கு மிகவும் பொருத்தமானது. ‘எப்பிராத்தியன்’ என்ற வடிவியல் மாற்றுப் பொருள் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- source_word: הַצְּרֵדָה
  choice: செரேதா
  rationale: இடப்பெயர் நவீனத் தமிழுக்கு ஏற்ற ஒலிபெயர்ப்பில் தரப்பட்டுள்ளது.
- source_word: צְרוּעָה
  choice: செரூவா
  rationale: தனிப்பெயர் மொழிபெயர்க்கப்படாமல் எபிரெய ஒலிக்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: אִשָּׁה אַלְמָנָה
  choice: ஒரு விதவைப் பெண்
  rationale: எபிரெயத்தில் உள்ள ‘பெண்’, ‘விதவை’ ஆகிய இரு கூறுகளையும் இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: עֶבֶד
  choice: பணியாளன்
  rationale: இந்த அரச நிர்வாகச் சூழலில் சாலொமோனுக்குக் கீழ் பணிபுரிந்த நிலையைக் குறிக்கிறது; ‘அடிமை’ என்று கூறுவதைக் காட்டிலும் சூழலுக்கு ஏற்றது, ஆனால் மூலச்சொல்லின் சேவைநிலையைத் தக்கவைக்கிறது.
- source_word: וַיָּרֶם יָד בַּמֶּלֶךְ
  choice: அரசனுக்கு எதிராகக் கை ஓங்கினான்
  rationale: எதிர்ப்பு அல்லது கலகத்தைக் குறிக்கக்கூடிய எபிரெய உருவகத்தை விளக்கமாகச் சுருக்காமல் தமிழிலும் பாதுகாக்கிறது.
- source_word: וְ
  choice: வெளிப்படையான இணைப்புச்சொல் இன்றி வாக்கியத் தொடக்கம்
  rationale: தொடக்க வாவ் கதையின் தொடர்ச்சியைக் குறிக்கிறது; தமிழில் கட்டாயமாக ‘இப்போது’ அல்லது ‘மேலும்’ சேர்ப்பது மூலத்தில் இல்லாத கால அல்லது வலியுறுத்தல் நுணுக்கத்தை ஏற்படுத்தலாம்.
theological_decisions:
- issue: அரசனுக்கு எதிரான யெரொபெயாமின் செயல் எவ்வளவு வெளிப்படையான கலகம் என்பதை மொழிபெயர்ப்பில் நிர்ணயித்தல்
  choice: ‘கை ஓங்கினான்’ என்ற மூல உருவகத்தைப் பாதுகாத்தல்
  alternative: ‘கலகம் செய்தான்’ அல்லது ‘கிளர்ச்சி செய்தான்’
  rationale: இந்தச் சொற்றொடர் பகைமைச் செயல் அல்லது கலகத்தைக் குறிக்கலாம்; ஆனால் ‘கலகம் செய்தான்’ என்பது மூல உருவகத்தில் உள்ள நெகிழ்வை விடத் தெளிவாக விளக்கிவிடும். ஆகவே உருவகம் முதன்மை உரையில் வைக்கப்பட்டு, விளக்கமான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. பெயர்கள் நேரடியாக ஒலிபெயர்க்கப்பட்டுள்ளன. நீண்ட எபிரெய வாக்கியம் தமிழில் இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டாலும், அதன் தகவல் வரிசையும் உருவகமும் பாதுகாக்கப்பட்டுள்ளன.
