base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/033.yaml
  text: because they have forsaken me and bowed down to Ashtoreth[a], the god of the Sidonians, to Chemosh, the god of Moab, and to Milcom, the god of the Ammonites, and have not walked in my ways, to do what is right in my eyes and my statutes and my judgments[d][c][b], like David his father.
translation:
  language: ta
  text: ஏனெனில், அவர்கள் என்னைக் கைவிட்டு, சீதோனியரின் தெய்வமான அஸ்தரோத்தையும்[a], மோவாபின் தெய்வமான கெமோசையும், அம்மோனியரின் தெய்வமான மில்கோமையும்[b] பணிந்து வணங்கினார்கள்; தாவீது என்னும் அவனுடைய மூதாதையைப்[c] போல, என் வழிகளில் நடந்து, என் பார்வையில் நேர்மையானதைச் செய்து, என் சட்டங்களையும் என் நீதித்தீர்ப்புகளையும் கடைப்பிடிக்கவில்லை.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சீதோனியரின் பெண் தெய்வமான அஸ்தரோத்து’ என்றும் மொழிபெயர்க்கலாம். அஸ்தரோத்து ஒரு பெண் தெய்வம் என்றாலும், எபிரெய சொற்றொடர் சொல்லுக்கு சொல் ‘சீதோனியரின் தெய்வம்’ என உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: இங்கு எபிரெய உரை ‘மில்கோம்’ என்று வாசிக்கிறது; சிலர் இந்தப் பெயரை மோலேக்குடன் தொடர்புபடுத்துகின்றனர்.
    reason: alternative_reading
  - marker: c
    text: இங்கு தாவீது, சாலொமோனின் உடனடியான தந்தை என்ற பொருளில் அல்லாமல், அவனுடைய வம்ச மூதாதை என்ற பொருளில் குறிப்பிடப்படுகிறார்.
    reason: cultural_note
  - marker: d
    text: 'எபிரெயச் சொல் வரிசைக்கு நெருக்கமாக: ‘என் வழிகளில் நடக்கவில்லை; என் பார்வையில் நேர்மையானதையும் என் சட்டங்களையும் என் நீதித்தீர்ப்புகளையும் செய்யவில்லை.’ எபிரெயில் ‘செய்ய’ என்னும் ஒரே வினை இம்மூன்று பொருட்களோடும் தொடர்புபடுகிறது.'
    reason: previous_rendering
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  choice: ஏனெனில்
  rationale: ராஜ்யம் பிரிக்கப்படுவதற்கான காரணத்தை அறிமுகப்படுத்தும் எபிரெய காரணத் தொடரை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: עֲזָבוּנִי
  choice: அவர்கள் என்னைக் கைவிட்டு
  rationale: உடன்படிக்கை உறவைத் துறந்ததன் கனத்தைத் தக்கவைக்கிறது; வெறுமனே ‘விட்டுச் சென்றனர்’ என்பதைக் காட்டிலும் வலிமையானது.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: பணிந்து வணங்கினார்கள்
  rationale: உடலைத் தாழ்த்துதல் மற்றும் வழிபடுதல் ஆகிய இரு கூறுகளையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לְעַשְׁתֹּרֶת
  choice: அஸ்தரோத்து
  rationale: எபிரெய வடிவத்தைத் தமிழில் ஒலிபெயர்க்கிறது; வேற்றுமை உருபுக்கேற்ப ‘அஸ்தரோத்தையும்’ என முதன்மை உரையில் வருகிறது.
- source_word: אֱלֹהֵי צִדֹנִין
  choice: சீதோனியரின் தெய்வம்
  rationale: எபிரெயின் சொற்பொருளான ‘சீதோனியரின் தெய்வம்’ என்பதைப் பாதுகாக்கிறது; அஸ்தரோத்து பெண் தெய்வமாக அறியப்படுவது அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: לִכְמוֹשׁ
  choice: கெமோசு
  rationale: தெய்வப் பெயரை எபிரெய வடிவத்திலிருந்து தமிழில் ஒலிபெயர்க்கிறது.
- source_word: וּלְמִלְכֹּם
  choice: மில்கோம்
  rationale: மசோரா எபிரெய உரையின் வாசிப்பைப் பின்பற்றுகிறது; மோலேக்குடன் தொடர்புபடுத்தும் கருத்து அடிக்குறிப்பில் வைக்கப்படுகிறது.
- source_word: וְלֹא הָלְכוּ בִדְרָכַי
  choice: என் வழிகளில் அவர்கள் நடக்கவில்லை
  rationale: வாழ்க்கை நடத்தையைச் சுட்டும் உடன்படிக்கைச் சொல்லாட்சியான ‘வழிகளில் நடப்பது’ என்பதை தமிழிலும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: לַעֲשׂוֹת הַיָּשָׁר בְּעֵינַי
  choice: என் பார்வையில் நேர்மையானதைச் செய்து
  rationale: கடவுளின் மதிப்பீட்டுப் பார்வையைத் தக்கவைத்து, தமிழ் வாக்கியத்தில் இயல்பாகப் பொருந்துகிறது.
- source_word: וְחֻקֹּתַי וּמִשְׁפָּטַי
  choice: என் சட்டங்களையும் என் நீதித்தீர்ப்புகளையும் கடைப்பிடித்து
  rationale: ஒரே எபிரெய வினை மூன்று பொருட்களை ஆளும் அமைப்பைத் தமிழில் இயல்பாக்குகிறது; சட்டக் கட்டளைகளை ‘செய்தல்’ என்பதற்குப் பதில் ‘கடைப்பிடித்தல்’ எனத் தருகிறது.
- source_word: כְדָוִד אָבִיו
  choice: தாவீது என்னும் அவனுடைய மூதாதையைப் போல
  rationale: אָבִיו என்பதன் வம்ச முன்னோர் பொருளைச் சூழலுக்கேற்ப தெளிவாக்குகிறது; உடனடியான உயிரியல் தந்தை என்ற தவறான புரிதலைத் தவிர்க்கிறது.
theological_decisions:
- issue: பெண் தெய்வமான அஸ்தரோத்துடன் வரும் אֱלֹהֵי என்பதன் மொழிபெயர்ப்பு
  choice: சீதோனியரின் தெய்வம்
  alternative: சீதோனியரின் தேவதை
  rationale: எபிரெய உரையின் பொதுவான தெய்வச் சொல்லை முதன்மை உரையில் பாதுகாத்து, அஸ்தரோத்து பெண் தெய்வம் என்ற தகவலை அடிக்குறிப்பில் தருகிறது; உரையை மறைமுகமாகத் திருத்துவதில்லை.
- issue: מִלְכֹּם என்ற பெயரின் அடையாளம்
  choice: மில்கோம்
  alternative: மோலேக்கு
  rationale: இவ்விடத்திலுள்ள மசோரா உரையின் வாசிப்பு ‘மில்கோம்’; அறியப்பட்ட மாற்று தொடர்பை முதன்மை உரைக்குள் கொண்டுவராமல் அடிக்குறிப்பில் பாதுகாக்கிறது.
- issue: כְדָוִד אָבִיו என்பதில் ‘தந்தை’ என்ற உறவு
  choice: தாவீது என்னும் அவனுடைய மூதாதை
  alternative: அவனுடைய தந்தையான தாவீது
  rationale: சாலொமோனின் உடனடி தந்தையை அல்ல, வம்ச முன்னோரான தாவீதை இது சுட்டுகிறது; எபிரெய உறவுச் சொல்லின் பரந்த பொருளைச் சூழலுக்கு ஏற்றவாறு வெளிப்படுத்துகிறது.
- issue: לַעֲשׂוֹת என்பதற்கும் தொடர்ந்து வரும் சட்டப் பெயர்ச்சொற்களுக்கும் உள்ள தொடர்பு
  choice: நேர்மையானதைச் செய்து, சட்டங்களையும் நீதித்தீர்ப்புகளையும் கடைப்பிடித்து
  alternative: நேர்மையானதையும் என் சட்டங்களையும் என் நீதித்தீர்ப்புகளையும் செய்து
  rationale: எபிரெயில் ஒரே வினை அனைத்தையும் ஆளினாலும், தமிழில் சட்டங்களையும் தீர்ப்புகளையும் ‘செய்தல்’ இயல்பற்றது. பொருளை மாற்றாமல் இயல்பான இணை வினை வழங்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்கு புரியும் வகையில் இயல்பானதாகவும், அரச உரைக்கும் உடன்படிக்கை குற்றச்சாட்டிற்கும் ஏற்ற கண்ணியமான தொனியுடனும் உள்ளது. தெய்வப் பெயர்கள் எபிரெய வடிவங்களுக்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டுள்ளன. ‘பணிந்து வணங்கினார்கள்’ என்பது உடல் தாழ்த்துதலையும் சமய வழிபாட்டையும் இணைக்கிறது; சட்டச் சொல்லாட்சி தமிழில் இயல்பாக இருக்க ‘கடைப்பிடித்து’ வழங்கப்பட்டுள்ளது.
