base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/018.yaml
  text: They arose from Midian and came to Paran[a], and they took men with them from Paran, and they came to Egypt, to Pharaoh king of Egypt, and he gave him a house and assigned him food, and gave him land.
translation:
  language: ta
  text: அவர்கள் மீதியானிலிருந்து புறப்பட்டுப் பாரானுக்கு வந்தார்கள். பாரானிலிருந்து ஆண்களைத் தங்களுடன் அழைத்துக்கொண்டு எகிப்துக்கு, எகிப்தின் அரசனான பார்வோனிடம் வந்தார்கள். பார்வோன் அவனுக்கு ஒரு வீட்டைக் கொடுத்து, அவனுக்கான உணவை ஏற்பாடு செய்து[a], அவனுக்கு நிலமும் கொடுத்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெய மொழியில் சொல்லுக்குச் சொல்: “அப்பம்; அவனிடம் சொன்னான்.” இதன் பொருள், பார்வோன் அவனுக்கான உணவை வழங்க ஏற்பாடு செய்தான் அல்லது உத்தரவிட்டான் என்பதாகும்.'
    reason: மூலமொழியிலுள்ள வழக்கத்திற்கு மாறான சொற்றொடரையும் அதன் சாத்தியமான பொருளையும் வெளிப்படுத்துகிறது.
lexical_decisions:
- source_word: וַיָּקֻמוּ מִמִּדְיָן
  choice: மீதியானிலிருந்து புறப்பட்டு
  rationale: קום என்பதன் அடிப்படைப் பொருள் ‘எழுதல்’ என்றாலும், பயணக் கதையில் இது புறப்படுவதைக் குறிக்கும் மரபுத்தொடர். நவீனத் தமிழில் இயல்பாக இருக்க ‘புறப்பட்டு’ என மொழிபெயர்க்கப்பட்டது.
- source_word: פָּארָן
  choice: பாரான்
  rationale: இடப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: וַיִּקְחוּ אֲנָשִׁים עִמָּם מִפָּארָן
  choice: பாரானிலிருந்து ஆண்களைத் தங்களுடன் அழைத்துக்கொண்டு
  rationale: אֲנָשִׁים என்பது இங்கு பன்மையான ஆண்களைக் குறிக்கிறது. לקח என்பதன் ‘எடுத்துக்கொள்ளுதல்’ என்ற கருத்தை, பயணச் சூழலில் இயல்பான ‘தங்களுடன் அழைத்துக்கொண்டு’ என்பதன் மூலம் தெரிவித்துள்ளது.
- source_word: מִצְרַיִם
  choice: எகிப்து
  rationale: தமிழில் வழக்கிலுள்ள நிலையான நாட்டுப்பெயர் பயன்படுத்தப்பட்டது.
- source_word: אֶל פַּרְעֹה מֶלֶךְ מִצְרַיִם
  choice: எகிப்தின் அரசனான பார்வோனிடம்
  rationale: எபிரெய இணைப்புச் சொற்றொடரின் பொருளைத் தெளிவாகவும் இயல்பான தமிழிலும் வழங்குகிறது.
- source_word: וַיִּתֶּן לוֹ בַיִת
  choice: அவனுக்கு ஒரு வீட்டைக் கொடுத்து
  rationale: בַיִת என்பதன் நேரடியான பொருளான ‘வீடு’ தக்கவைக்கப்பட்டது; அதை ‘வசிப்பிடம்’ அல்லது ‘குடும்பம்’ என்று விரிவுபடுத்தவில்லை.
- source_word: וְלֶחֶם אָמַר לוֹ
  choice: அவனுக்கு உணவு வழங்கும்படி கட்டளையிட்டு
  rationale: சொல்லுக்குச் சொல் வடிவம் ‘அப்பத்தைக் குறித்து அவனுக்குச் சொன்னான்’ என்பது. சூழலில், பார்வோன் அவனுக்கான உணவுப் பொருட்களை வழங்க உத்தரவிட்டான் என்பதே இயல்பான பொருள். לֶחֶם விரிந்த பொருளில் உணவைக் குறிக்கக்கூடும்.
- source_word: וְאֶרֶץ נָתַן לוֹ
  choice: அவனுக்கு நிலமும் கொடுத்தான்
  rationale: אֶרֶץ இங்கு ஒரு முழு நாட்டைவிட வழங்கப்பட்ட நிலப்பகுதி அல்லது சொத்தைக் குறிப்பதாக இயல்பாகப் புரிகிறது. ‘நிலம்’ அந்தப் பொருள் வரம்பைத் தக்கவைக்கிறது.
