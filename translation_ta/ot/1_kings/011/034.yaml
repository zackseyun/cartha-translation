base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/034.yaml
  text: But I will not take the whole kingdom out of his hand, because I will make him ruler all the days of his life, for the sake of David my servant, whom I chose, who kept my commandments and my statutes.
translation:
  language: ta
  text: ஆனால், அவன் கையிலிருந்து முழு அரசாட்சியையும் நான் எடுத்துக்கொள்ளமாட்டேன். என் ஊழியனாகிய தாவீதின் பொருட்டு, சாலொமோனை அவன் வாழ்நாளெல்லாம் ஆட்சியாளனாக ஆக்குவேன்; தாவீதை நான் தேர்ந்தெடுத்தேன், அவன் என் கட்டளைகளையும் என் நியமங்களையும் கடைப்பிடித்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נָשִׂיא
  choice: ஆட்சியாளன்
  rationale: இச்சொல் ‘தலைவன்’, ‘அதிபதி’, ‘ஆட்சியாளர்’ எனப் பொருள்படலாம். அரசனைப் பற்றிய இச்சூழலில், நவீனத் தமிழில் இயல்பாகவும் மூலத்தின் பரந்த பொருளைத் தக்கவைத்தும் ‘ஆட்சியாளன்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: לְמַעַן דָּוִד עַבְדִּי
  choice: என் ஊழியனாகிய தாவீதை முன்னிட்டு
  rationale: לְמַעַן இங்கு தாவீதுக்காக அல்லது தாவீதை முன்னிட்டு கடவுள் சாலொமோனின் ஆட்சியைத் தொடரச் செய்வதைக் குறிக்கிறது. ‘முன்னிட்டு’ என்பது காரணத்தையும் தாவீதோடு உள்ள உறுதிப்பாட்டையும் தேவையின்றி விரிவுபடுத்தாமல் வெளிப்படுத்துகிறது.
- source_word: מִצְוֺתַי וְחֻקֹּתָי
  choice: என் கட்டளைகளையும் என் நியமங்களையும்
  rationale: இணையான இரு எபிரெயச் சட்டச் சொற்களின் வேறுபாட்டைத் தக்கவைக்க தனித்தனி தமிழ்ச் சொற்கள் பயன்படுத்தப்பட்டன.
theological_decisions:
- issue: தாவீது கட்டளைகளையும் நியமங்களையும் கடைப்பிடித்தார் என்ற முழுமையான கூற்று
  choice: மூலத்தில் உள்ள மதிப்பீட்டை எந்தத் தணிப்பும் இன்றி நேரடியாக மொழிபெயர்த்தல்
  alternative: ‘பொதுவாகக் கடைப்பிடித்தார்’ அல்லது ‘உண்மையுடன் பின்பற்றினார்’ என விளக்கிச் சீராக்குதல்
  rationale: இவ்வசனத்தின் கூற்றுக்கும் தாவீதின் வாழ்க்கையைப் பற்றிய பிற விவரங்களுக்கும் இடையிலுள்ள இறையியல் பதற்றத்தை மொழிபெயர்ப்பாளர் அமைதியாகத் தீர்க்கக்கூடாது.
- issue: נָשִׂיא என்பதன் அரசியல் பட்டம்
  choice: ஆட்சியாளன்
  alternative: அரசன் / அதிபதி / தலைவர்
  rationale: மூலம் இங்கு வழக்கமான ‘அரசன்’ (מֶלֶךְ) என்ற சொல்லைப் பயன்படுத்தவில்லை. ஆகவே அந்த வேறுபாட்டை அழிக்காமல், தமிழில் இயல்பான பொதுப்பதவி தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழ்; மரியாதையும் தெளிவும் கொண்ட நடையில், எபிரெய வாக்கியத்தின் காரணத் தொடர்பு இயல்பான தமிழ்ச் சொல்லோட்டத்துடன் வழங்கப்பட்டுள்ளது. முந்தைய வசனங்களிலிருந்து பேசப்படுபவர் சாலொமோன் என்பது தெளிவாக இருந்தாலும், தமிழில் தொடர்ச்சியான இரு ஆண்பால் சுட்டுப்பெயர்கள் குழப்பம் தருவதால் இரண்டாவது இடத்தில் ‘சாலொமோன்’ வெளிப்படையாகக் குறிப்பிடப்பட்டுள்ளது.
