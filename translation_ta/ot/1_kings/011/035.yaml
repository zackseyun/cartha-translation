  yaml_path: translation/ot/1_kings/011/035.yaml
  text: But I will take the kingdom from the hand of his son and give it to you[b][a], the ten tribes.
translation:
  language: ta
  text: ஆனால், நான் அரசாட்சியை அவனுடைய மகனின் கையிலிருந்து எடுத்து[a], அதிலுள்ள பத்துக் கோத்திரங்களை உனக்குக் கொடுப்பேன்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில், ‘அவனுடைய மகனின் கையிலிருந்து.’ இது அவனுடைய மகனின் கட்டுப்பாட்டிலிருந்து அரசாட்சியை அகற்றுவதைக் குறிக்கும் மரபுத்தொடர்.
    reason: cultural_note
  - marker: b
    text: 'சொல்லுக்குச் சொல்: ‘அதை உனக்குக் கொடுப்பேன், பத்துக் கோத்திரங்களை.’ கொடுக்கப்படுவது அரசாட்சியின் முழுமை அல்ல, அதிலுள்ள பத்துக் கோத்திரங்கள் என்பதை இறுதித் தொடர் குறிக்கிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתִּי
  choice: ஆனால், நான் … எடுத்துக்கொண்டு
  rationale: முன்னொட்டுச் சேர்க்கையுடன் உள்ள Qal perfect வடிவம் தீர்க்கதரிசன உரையில் வருங்காலச் செயலைக் குறிக்கிறது. முந்தைய வசனத்துடனான முரணை வெளிப்படுத்த וְ என்பதற்கு ‘ஆனால்’ பயன்படுத்தப்பட்டது; לקח என்பதன் அடிப்படைப் பொருள் ‘எடுத்துக்கொள்’ என்று காக்கப்பட்டது.
- source_word: הַמְּלוּכָה
  choice: அரசாட்சியை
  rationale: இங்கு சாலொமோனின் வம்சத்திடமிருந்து அகற்றப்படும் அரசுரிமையையும் ஆளுகையையும் குறிக்கிறது. ‘அரசாட்சி’ என்பது நவீனத் தமிழில் இயல்பாக இருந்து, அரசுரிமை/ராஜ்யம் என்ற பொருள் விரிவையும் தக்கவைக்கிறது.
- source_word: מִיַּד בְּנוֹ
  choice: அவனுடைய மகனின் கையிலிருந்து
  rationale: ‘கையிலிருந்து’ என்ற எபிரெய உருவகம் கட்டுப்பாடு அல்லது உடைமையிலிருந்து அகற்றப்படுவதைச் சுட்டுகிறது; தமிழிலும் இது புரியக்கூடியதால் உருவகம் பாதுகாக்கப்பட்டது. சூழலில் ‘அவனுடைய மகன்’ என்பது சாலொமோனின் மகனைக் குறிக்கிறது.
- source_word: וּנְתַתִּיהָ לְּךָ
  choice: அதை உனக்குக் கொடுப்பேன்
  rationale: பெண்பால் ஒருமை பின்னொட்டு முன் வந்த ‘அரசாட்சி’யைச் சுட்டுகிறது. வினைச்சொல்லின் வருங்காலப் பொருள் தமிழில் வெளிப்படையாக வழங்கப்பட்டது.
- source_word: אֵת עֲשֶׂרֶת הַשְּׁבָטִים
  choice: அதாவது, பத்துக் கோத்திரங்களை
  rationale: நேரடி செயப்படுபொருள் குறியீட்டுடன் வரும் இத்தொடர், கொடுக்கப்படுவது பத்துக் கோத்திரங்களைக் கொண்ட அரசாட்சி என்பதை விளக்கும் இணைப்புத் தொடராக உள்ளது. ‘அதாவது’ இந்த விளக்க உறவை இயல்பான தமிழில் தெளிவாக்குகிறது; ‘கோத்திரம்’ இஸ்ரவேலின் பழங்குடிப் பிரிவுகளுக்கான நிலைபெற்ற சொல்.
