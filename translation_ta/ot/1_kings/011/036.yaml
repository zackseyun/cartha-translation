  yaml_path: translation/ot/1_kings/011/036.yaml
  text: But to his son I will give one tribe[a], so that David my servant may always have a lamp before me in Jerusalem, the city that I have chosen for myself to put my name there.
translation:
  language: ta
  text: ஆனால் அவனுடைய மகனுக்கு ஒரு கோத்திரத்தைக் கொடுப்பேன்; என் ஊழியனாகிய தாவீதுக்கு எப்போதும் என் முன்னிலையில் ஒரு விளக்கு[a] இருக்கும்படியாக, என் பெயரை அங்கே வைப்பதற்காக எனக்கென்று நான் தேர்ந்தெடுத்த எருசலேம் நகரத்தில்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஒளி.’ இங்கு ‘விளக்கு’ என்பது தாவீதின் வம்சம் அல்லது நீடிக்கும் அரச மரபைக் குறிக்கும் உருவகம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִבְנוֹ
  choice: ஆனால் அவனுடைய மகனுக்கு
  rationale: முந்தைய சூழலில் அரசின் பிரிவுக்கு மாறாக மகனுக்குக் கொடுக்கப்படுவது கூறப்படுவதால், וְ என்பதன் எதிர்மறை இணைப்புப் பொருளை ‘ஆனால்’ வெளிப்படுத்துகிறது.
- source_word: שֵׁבֶט אֶחָד
  choice: ஒரு கோத்திரம்
  rationale: பிரிக்கப்படும் அரசின் சூழலில் שֵׁבֶט என்பது செங்கோலைவிட ஒரு கோத்திர/அரசியல் அலகைக் குறிக்கிறது.
- source_word: לְמַעַן הֱיוֹת
  choice: இதனால் ... இருக்கும்
  rationale: இந்த அமைப்பு நோக்கத்தையோ எதிர்பார்க்கப்படும் விளைவையோ காட்டுகிறது; தமிழில் இயல்பாகவும் மூலத்தின் தொடர்பைத் தெளிவாகவும் வழங்குகிறது.
- source_word: נִיר
  choice: விளக்கு
  rationale: தாவீதின் வம்சம் அல்லது அரச இருப்பு தொடர்வதைக் குறிக்கும் உருவகத்தை விளக்கமாக மாற்றாமல் அப்படியே பாதுகாக்கிறது.
- source_word: לְדָוִיד עַבְדִּי
  choice: என் ஊழியனாகிய தாவீதுக்கு
  rationale: இறைவனுக்குரிய பணியாளர் என்ற மரியாதைமிக்க உறவையும் தாவீதுக்கான உரிய வேற்றுமையையும் இயல்பான தமிழில் காட்டுகிறது.
- source_word: כָּל הַיָּמִים
  choice: எப்போதும்
  rationale: தொடர்ச்சியைச் சுட்டும் எபிரெய மரபுத்தொடரைச் சுருக்கமான நவீன தமிழில் தருகிறது.
- source_word: לְפָנַי
  choice: என் முன்னிலையில்
  rationale: ‘எனக்கு முன்பாக’ என்ற இடியத்தை இயல்பான தமிழில் வழங்கி, கடவுளின் பார்வை/சந்நிதியில் நிலைத்திருக்கும் கருத்தைத் தக்கவைக்கிறது.
- source_word: בָּחַרְתִּי לִי
  choice: எனக்காக ... நான் தேர்ந்தெடுத்த
  rationale: לִי என்பதன் ‘எனக்காக’ என்ற முக்கியமான தன்நோக்கு வலியுறுத்தலை விடாமல் பாதுகாக்கிறது.
- source_word: לָשׂוּם שְׁמִי שָׁם
  choice: என் பெயரை நிலைநிறுத்த
  rationale: ‘பெயரை அங்கே வைப்பது’ என்ற உடன்படிக்கை–ஆலய மொழியின் உருவகத் தன்மையைத் தக்கவைத்தபடி, தமிழில் இயல்பான வேதாகம நடையில் வழங்குகிறது; ‘அங்கே’ என்பது எருசலேம் நகரத்தில் என்ற முன்னிலைத் தொடரால் வெளிப்படுகிறது.
theological_decisions:
- issue: נִיר என்பதிலுள்ள தாவீதிய வம்ச உருவகம்
  choice: ‘விளக்கு’ என்று உருவகத்தைத் தக்கவைத்தல்
  alternative: ‘ஒளி’ அல்லது ‘வம்சத் தொடர்ச்சி’ என்று விளக்கமாக மொழிபெயர்த்தல்
  rationale: வசனம் தாவீதுக்கான தொடரும் அரச இருப்பைப் பற்றிப் பேசினாலும், மூலமொழி அதை நேரடியாக விளக்காமல் ‘விளக்கு’ என்ற உருவகத்தில் கூறுகிறது. அந்த இறையியல் அழுத்தத்தையும் மறைமுகத்தன்மையையும் முதன்மை உரை பாதுகாக்கிறது.
- issue: ‘என் பெயரை அங்கே வைக்க’ என்ற ஆலய இறையியல்
  choice: ‘என் பெயரை நிலைநிறுத்த’ என்று பெயர்-முறையைப் பாதுகாத்தல்
  alternative: ‘என் பிரசன்னத்தை ஏற்படுத்த’ அல்லது ‘என்னை வழிபடுவதற்காக’
  rationale: ‘பெயர்’ என்ற குறிப்பிடத்தக்க உபாகம வரலாற்று மொழியை ‘பிரசன்னம்’ அல்லது ‘வழிபாடு’ என்ற விளக்கத்துக்குள் சுருக்காமல் தக்கவைக்கிறது.
