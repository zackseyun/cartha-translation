  register: நவீன நிலையான தமிழில் இயல்பான, மரியாதைமிக்க வேதாகம நடை. ‘என் ஊழியனாகிய தாவீது,’ ‘என் பெயரை நிலைநிறுத்த’ போன்ற சொற்றொடர்கள் மூலத்தின் உடன்படிக்கை மற்றும் அரசவம்ச மொழியை விளக்கவுரையாக மாற்றாமல் காக்கின்றன.
