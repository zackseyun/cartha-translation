  text: אֲשֶׁ֣ר שָׁמַ֗רְתָּ לְ/עַבְדְּ/ךָ֙ דָּוִ֣ד אָבִ֔/י אֵ֥ת אֲשֶׁר דִּבַּ֖רְתָּ ל֑/וֹ וַ/תְּדַבֵּ֥ר בְּ/פִ֛י/ךָ וּ/בְ/יָדְ/ךָ֥ מִלֵּ֖אתָ כַּ/יּ֥וֹם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/024.yaml
  text: who have kept for your servant David my father what you spoke to him[a]; you spoke with your mouth, and with your hand you have fulfilled it[b], as it is this day.
translation:
  language: ta
  text: உமது அடியானாகிய என் தந்தை தாவீதுக்காக, நீர் அவரிடம் சொன்னதைக் காத்தீர்[a]; உமது வாயால் சொன்னீர்; உமது கையால் அதை நிறைவேற்றினீர்[b]—இன்று காணப்படுகிறபடியே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உமது அடியானாகிய என் தந்தை தாவீதுக்கு.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “உமது வாயால் சொன்னீர்; உமது கையால் நிறைவேற்றினீர்.” அதாவது, நீர் சொன்னதை நீரே செயல்படுத்தினீர் என்பதை உயிரோட்டமாகக் கூறும் சொல்லாட்சி.
    reason: cultural_note
lexical_decisions:
- source_word: שָׁמַרְתָּ
  choice: காத்தீர்
  rationale: வாக்கைக் ‘காத்தல்’ என்ற எபிரெயச் சொல்லாட்சியைத் தக்கவைத்து, பின்னர் வரும் ‘நிறைவேற்றினீர்’ என்பதிலிருந்து வினைச்சொல் வேறுபாட்டைப் பாதுகாக்கிறது.
- source_word: לְעַבְדְּךָ
  choice: உமது பணியாளரான … தாவீதுக்காக
  rationale: לְ என்பதன் பயனாளிப் பொருளை ‘தாவீதுக்காக’ என்று வெளிப்படுத்துகிறது; ‘பணியாளர்’ என்பது தாழ்மையும் உடன்படிக்கை உறவும் கொண்ட அடையாளத்தை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: דָּוִד אָבִי
  choice: என் தந்தை தாவீது
  rationale: எபிரெய வரிசையின் பொருளைத் தெளிவாகவும் இயல்பான தமிழிலும் வழங்குகிறது.
- source_word: אֵת אֲשֶׁר דִּבַּרְתָּ לוֹ
  choice: நீர் அவரிடம் சொன்னதை
  rationale: ‘வாக்களித்ததை’ என்று விளக்கிப் பொருளுரைக்காமல், மூலத்தின் ‘சொன்னதை’ என்ற பேச்சுச் செயலைத் தக்கவைக்கிறது.
- source_word: וַתְּדַבֵּר בְּפִיךָ
  choice: உமது வாயால் சொன்னீர்
  rationale: இறைவனின் சொல் மற்றும் செயலை இணைக்கும் வலியுறுத்தலையும் ‘வாய்—கை’ இணைநிலையையும் பாதுகாக்கிறது.
- source_word: וּבְיָדְךָ מִלֵּאתָ
  choice: உமது கையால் அதை நிறைவேற்றினீர்
  rationale: மூலத்தின் உருவகமான ‘கை’ என்பதையும், சொல்லப்பட்டதைச் செயலால் முழுமைப்படுத்தும் מִלֵּאתָ என்பதன் நிறைவேற்றப் பொருளையும் தக்கவைக்கிறது.
- source_word: כַּיּוֹם הַזֶּה
  choice: இன்று இருப்பதுபோலவே
  rationale: வாக்கு நிகழ்காலத்தில் கண்கூடாக நிறைவேறியிருப்பதைச் சுட்டும் எபிரெய மொழியிடையை இயல்பான தமிழில் வழங்குகிறது.
theological_decisions:
- issue: 'இறைவனைப் பற்றிய மனித உறுப்புருவ மொழி: ‘வாய்’ மற்றும் ‘கை’'
  choice: ‘உமது வாயால்’ மற்றும் ‘உமது கையால்’ என்ற தெளிவான உருவகங்களை முதன்மை உரையில் தக்கவைத்தல்
  alternative: ‘நீர் வாக்களித்து அதைச் செய்து முடித்தீர்’ என்று கருத்துரைத்தல்
  rationale: எபிரெய உரை இறைவனின் சொல் மற்றும் செயலை உடலுறுப்பு உருவகங்கள் வழியாக நோக்கமுடன் இணைக்கிறது. இதைத் தக்கவைப்பது வசனத்தின் கவித்துவ வலிமையையும் இறைவனின் சொல்லுக்கும் செயலுக்கும் உள்ள ஒற்றுமையையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், இறைவனை மரியாதை ஒருமையில் குறிப்பிடும் ‘நீர்/உமது’ வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. உரை கண்ணியமானதாகவும் பொதுவாசகர்களுக்குப் புரியத்தக்கதாகவும் வைக்கப்பட்டு, எபிரெயத்தின் ‘வாய்—கை’ இணைநிலை மற்றும் வாக்கைக் காத்தல்/நிறைவேற்றல் என்ற வினை வேறுபாடு பாதுகாக்கப்பட்டுள்ளன.
