revisions:
- from: உமது பணியாளரான என் தந்தை தாவீதுக்காக, நீர் அவரிடம் சொன்னதைக் காத்தீர்[a]; உமது வாயால் சொன்னீர், உமது கையால் அதை நிறைவேற்றினீர்[b]—இன்று இருப்பதுபோலவே.
