lexical_decisions:
- source_word: וְיִהְיוּ
  choice: இருப்பனவாக
  rationale: சூழலில் இது வெறும் எதிர்காலக் கூற்று அல்ல, சாலொமோனின் வேண்டுதலைக் காட்டும் விருப்பநிலை; தமிழில் ‘இருப்பனவாக’ அதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: דְבָרַי אֵלֶּה
  choice: இந்த என் வார்த்தைகள்
  rationale: சாலொமோன் கூறிய வேண்டுதல் வார்த்தைகளையே சுட்டி, எபிரெயச் சொற்றொடரின் வலியுறுத்தலைத் தக்கவைக்கிறது.
- source_word: אֲשֶׁר הִתְחַנַּנְתִּי
  choice: மன்றாடிய
  rationale: חנן என்பதன் hitpael வடிவம் தீவிரமான விண்ணப்பத்தை குறிக்கிறது; ‘மன்றாடிய’ என்பது சாதாரண ‘ஜெபித்த’ என்பதைவிட அந்தத் தீவிரத்தைத் தக்கவைக்கிறது.
- source_word: לִפְנֵי יְהוָה
  choice: யெகோவாவின் முன்னிலையில்
  rationale: கடவுளின் சந்நிதியில் முன்வைக்கப்பட்ட வேண்டுதல் என்ற எபிரெய மரபுத்தொடரின் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: திருநாமத்தை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட ஒலிபெயர்ப்பால் தருகிறது.
- source_word: קְרֹבִים אֶל יְהוָה אֱלֹהֵינוּ
  choice: நம் கடவுளாகிய யெகோவாவுக்கு அருகில்
  rationale: קְרֹבִים என்பதன் நேரடிப் பொருளான ‘அருகில்’ என்பதைப் பாதுகாத்து, வேண்டுதல் தொடர்ந்து கடவுளின் கவனத்திற்கு முன்பாக இருக்க வேண்டும் என்ற உருவகத்தையும் விடாமல் வைத்திருக்கிறது.
- source_word: יוֹמָם וָלָיְלָה
  choice: இரவும் பகலும்
  rationale: தொடர்ச்சியைக் குறிக்கும் இயல்பான தமிழ்ச் சொற்றொடர்; மூலத்தின் இரு காலப்பகுதிகளையும் வெளிப்படையாகப் பாதுகாக்கிறது.
- source_word: לַעֲשׂוֹת מִשְׁפַּט
  choice: வழக்கை நடத்துவாராக
  rationale: עשה משפט என்பது ஒருவரின் நீதிசார் உரிமை அல்லது வழக்கை நிலைநாட்டுதல் என்ற பொருள் தருகிறது; ‘வழக்கை நடத்துதல்’ சட்டநீதிசார் நுணுக்கத்தை இயல்பான தமிழில் தருகிறது.
- source_word: עַבְדּוֹ
  choice: தம் ஊழியன்
  rationale: அரசனான சாலொமோன் கடவுளுக்கு உட்பட்டவராகத் தன்னைக் குறிப்பிடும் சூழலில் ‘ஊழியன்’ பொருத்தமான மரியாதைமிக்க சொல்.
- source_word: וּמִשְׁפַּט עַמּוֹ יִשְׂרָאֵל
  choice: தம் மக்களாகிய இஸ்ரவேலின் வழக்கு
  rationale: முந்தைய משפט உடன் ஒரே சட்டநீதிசார் சொல்லைத் தொடர்ச்சியாகப் பயன்படுத்தி இணைப்பைத் தக்கவைக்கிறது.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: ஒவ்வொரு நாளுக்கும் வேண்டியபடி
  rationale: ‘ஒரு நாளின் காரியம் அதன் நாளில்’ என்ற எபிரெய மரபுத்தொடரின் பகிர்ந்தளிக்கும் பொருளைத் தெளிவான நவீன தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைநாமத்தின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட இறைநாமம் நேரடியாக உள்ளது. அதை ‘கர்த்தர்’ என்ற பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்ப்பாகத் தருவது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது; ‘யெகோவா’ தமிழில் பரவலாக அறியப்பட்ட வடிவம்.
- issue: מִשְׁפַּט என்பதன் சட்டநீதிசார் நுணுக்கம்
  choice: வழக்கு
  alternative: நீதி; உரிமை
  rationale: இங்கு கடவுள் தம் ஊழியனுக்கும் மக்களுக்கும் செய்யும் ‘நீதியை’ பொதுவாக மட்டுமல்லாமல், அவர்களது cause/claim-ஐ நிலைநாட்டுதல் என்ற பொருளும் உள்ளது. ‘வழக்கு’ அந்தச் சட்டநீதிசார் பதற்றத்தைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் மரியாதைமிக்க, ஜெபத்துக்குரிய நடையைப் பயன்படுத்துகிறது. நீண்ட எபிரெய வாக்கியத்தின் ஓட்டம் தக்கவைக்கப்பட்டாலும், தமிழ் வாசிப்புக்கு இயல்பாகச் சொல் வரிசை மாற்றப்பட்டுள்ளது. இறைநாமத்துக்கு ‘யெகோவா’ பயன்படுத்தப்பட்டுள்ளது; משפט என்பதன் சட்டநீதிசார் பொருளைத் தக்கவைக்க ‘வழக்கு’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
