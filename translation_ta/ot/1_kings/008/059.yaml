base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/059.yaml
  text: And may these words of mine[a], with which I have pleaded before Yahweh, be near Yahweh our God day and night, that he may uphold the cause of his servant and the cause of his people Israel, as each day requires[c][b],
translation:
  language: ta
  text: நான் யெகோவாவின் முன்னிலையில் மன்றாடிய இந்த என் வார்த்தைகள் இரவும் பகலும் நம் கடவுளாகிய யெகோவாவுக்கு அருகில் இருக்கட்டும்; அவர் தம் ஊழியனின் உரிமையையும் தம் மக்களாகிய இஸ்ரவேலின் உரிமையையும் ஒவ்வொரு நாளுக்குரிய தேவைக்கேற்ப நிலைநாட்டுவாராக.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஒவ்வொரு நாளுக்குரிய தேவைக்கேற்ப” என்பது எபிரெயத்தில் சொல்லுக்கு சொல், “ஒரு நாளின் காரியம் அதன் நாளில்” என உள்ளது.
