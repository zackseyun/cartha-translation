base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/028.yaml
  text: Yet turn toward the prayer of your servant and to his plea for favor[a], O Yahweh my God[b], to hear the cry and the prayer that your servant is praying before you today.
translation:
  language: ta
  text: ஆனாலும், என் கடவுளாகிய யாவே, உமது அடியானின் மன்றாட்டின்மேலும் அவனுடைய விண்ணப்பத்தின்மேலும்[a] திரும்பி நோக்கியருளும். இன்று உமக்கு முன்பாக உமது அடியான் ஏறெடுக்கும் கூக்குரலையும்[b] மன்றாட்டையும் கேட்டருளும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனுடைய இரக்கம் கோரும் வேண்டுதலின்மேலும்.” எபிரெயச் சொல் இரக்கம் அல்லது தயவு கோரும் உருக்கமான விண்ணப்பத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “ஒலிக்கும் கூக்குரலையும்.” எபிரெயச் சொல் உரத்த குரல் அல்லது முழக்கத்தைக் குறிக்கலாம்; இங்கு மன்றாட்டில் இறைவனை நோக்கி எழுப்பப்படும் கூக்குரலாகப் பொருள்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָנִיתָ
  choice: ஆனாலும் ... கவனித்தருளும்
  rationale: פנה என்பதன் அடிப்படைப் பொருள் ‘திரும்புதல்/நோக்குதல்.’ இங்கு வேண்டுதலுக்கு இறைவன் கவனம் செலுத்த வேண்டும் என்ற பொருளில் வருகிறது. முந்தைய வசனத்துடன் உள்ள மென்மையான எதிர்நிலையை וְ சுட்டுவதால் ‘ஆனாலும்’ பயன்படுத்தப்பட்டது.
- source_word: תְּפִלַּת / הַתְּפִלָּה
  choice: மன்றாட்டு
  rationale: תפלה என்பதற்கான இயல்பான, கண்ணியமான தமிழ்ச் சொல். எபிரெய உரையின் மீளுரைப்பைப் பாதுகாக்க இரு இடங்களிலும் ஒரே சொல் பயன்படுத்தப்பட்டது.
- source_word: עַבְדְּךָ
  choice: உமது அடியான்
  rationale: இறைவனிடம் தாழ்மையுடன் தன்னைச் சுட்டும் அரசவழக்கை இயல்பாக வெளிப்படுத்துகிறது; ‘அடிமை’ என்பதைக் காட்டிலும் இச்சூழலுக்குப் பொருத்தமானது.
- source_word: תְּחִנָּתוֹ
  choice: அவனுடைய கருணை வேண்டுதல்
  rationale: תחנה என்பது இரக்கம் அல்லது தயவு கோரும் உருக்கமான வேண்டுதலைக் குறிக்கிறது. மூன்றாம் நபர் ஒருமை விகுதி, தன்னை ‘உமது அடியான்’ என்று சாலொமோன் குறிப்பிடுவதைத் தொடர்ந்து ‘அவனுடைய’ என மொழிபெயர்க்கப்பட்டது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது ஒரு பட்டம் அல்ல, இஸ்ரவேலின் இறைவனுடைய தனிப்பெயர். அதன் பரவலான ஒலிபெயர்ப்பைத் தமிழில் ‘யாவே’ என வழங்குகிறது.
- source_word: אֱלֹהָי
  choice: என் கடவுள்
  rationale: முதல் நபர் உடைமைப் பொருளுடன் வரும் நேரடி அழைப்பைத் தெளிவாக வழங்குகிறது.
- source_word: לִשְׁמֹעַ
  choice: கேட்டருளும்
  rationale: שמע என்பதன் ‘கேள்’ என்ற பொருளைத் தக்கவைத்து, இறைவனிடம் செய்யப்படும் வேண்டுகோளுக்கேற்ற மரியாதை நடையில் வழங்குகிறது.
- source_word: הָרִנָּה
  choice: கூக்குரல்
  rationale: רנה என்பது உரத்த அல்லது ஒலிக்கும் குரலைக் குறிக்கலாம். இங்கு மன்றாட்டுக்கு இணையாக வருவதால் பாடலை அல்ல, இறைவனை நோக்கிய அவசரமான கூக்குரலைக் குறிக்கிறது.
- source_word: מִתְפַּלֵּל
  choice: ஏறெடுக்கும்
  rationale: தொடர்ந்து நடைபெறும் மன்றாட்டுச் செயலை இயல்பான தமிழில் வெளிப்படுத்துகிறது; அதன் பொருள் உடனுள்ள ‘மன்றாட்டையும்’ என்பதால் தெளிவாகிறது.
- source_word: לְפָנֶיךָ
  choice: உமக்கு முன்பாக
  rationale: இறை முன்னிலையில் மன்றாடுவதை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: הַיּוֹם
  choice: இன்று
  rationale: காலக் குறிப்பை நவீன தமிழில் நேரடியாக வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பெயரான நான்கு எழுத்து இறைப்பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் வழக்கமான ‘யாவே’ என்ற ஒலிபெயர்ப்பில் வழங்கப்பட்டது.
- issue: וּפָנִיתָ என்பதன் உருவகத்தன்மை
  choice: கவனித்தருளும்
  alternative: திரும்பி நோக்கியருளும்
  rationale: ‘திரும்புதல்’ என்ற எபிரெய உருவகம் உண்மையானது; ஆனால் மன்றாட்டுச் சூழலில் அதன் நோக்கம் ‘கவனம் செலுத்துதல்.’ இயல்பான தமிழுக்காக உட்பொருள் முதன்மை பெற்றாலும், இறைவன் மன்றாட்டை நோக்க வேண்டும் என்ற கருத்து காக்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான மன்றாட்டு நடை பயன்படுத்தப்பட்டது. ‘உமது/உமக்கு’ மற்றும் ‘கேட்டருளும்/கவனித்தருளும்’ ஆகிய வடிவங்கள் இறைவனை நோக்கிய மரியாதையை இயல்பாகக் காட்டுகின்றன. மூலத்தின் ‘மன்றாட்டு’ என்ற சொல் மீண்டும் வருவது வேண்டுமென்றே பாதுகாக்கப்பட்டுள்ளது. ஆங்கில ஆலோசனை உரையில் [b] குறியீடு இறைப்பெயருக்குப் பின் இருந்தாலும் அதன் அடிக்குறிப்பு הָרִנָּה பற்றியது; ஆகவே மூலச்சான்றின் அடிப்படையில் அது ‘கூக்குரல்’ என்பதற்குப் பின் வைக்கப்பட்டது.
