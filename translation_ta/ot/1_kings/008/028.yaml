  source_fidelity: திருத்தம் தேவை. וּפָנִיתָ என்பதிலுள்ள ‘திரும்பி நோக்குதல்/கவனம் செலுத்துதல்’ என்ற உருவகம் வரைவில் ‘கவனித்தருளும்’ என உட்பொருளாக மட்டும் வழங்கப்பட்டுள்ளது. இது பொருளில் ஏற்கத்தக்கதாயினும், மூலத்தின் உருவகமும் வேண்டுதலின் இயக்கமும் பாதுகாக்க ‘திரும்பி நோக்கியருளும்’ என்பது சிறந்தது. பிற கூறுகள்—‘உமது அடியான்,’ ‘என் கடவுளாகிய யாவே,’ கூக்குரல், மன்றாட்டு, இன்று, உமக்கு முன்பாக—மூலத்துடன் பொருந்துகின்றன.
