base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/053.yaml
  text: For you set them apart for yourself as an inheritance from all the peoples of the earth[a], just as you spoke by the hand of Moses your servant when you brought our fathers out from Egypt[c][b], Lord GOD.
translation:
  language: ta
  text: ஏனெனில், பூமியின் எல்லா மக்களினங்களிலிருந்தும் அவர்களை உமக்கெனச் சுதந்தரமாகப் பிரித்தெடுத்தீர். எங்கள் தந்தையரை[b] எகிப்திலிருந்து வெளியே கொண்டுவந்தபோது, உமது ஊழியரான மோசேயின் மூலம்[a] நீர் சொன்னபடியே செய்தீர், ஆண்டவராகிய யாவே![c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேய மொழியில், “உமது ஊழியரான மோசேயின் கையால்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “எங்கள் முன்னோர்களை.”
    reason: lexical_alternative
  - marker: c
    text: எபிரேய மொழியில், “அதோனாய் யாவே”; இது ஆண்டவர் என்ற பட்டத்தையும் யாவே என்ற இறைப் பெயரையும் இணைக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִבְדַּלְתָּם
  choice: அவர்களை ... பிரித்தெடுத்தீர்
  rationale: בדל என்பதன் Hiphil வடிவம் வேறுபடுத்தி ஒதுக்கிவைத்தலைக் குறிக்கிறது. ‘பிரித்தெடுத்தீர்’ என்பது மற்ற மக்களினங்களிலிருந்து தேவனுக்கெனத் தனியாக்கப்பட்ட கருத்தை இயல்பாகத் தருகிறது.
- source_word: לְךָ לְנַחֲלָה
  choice: உமக்கென்று ஒரு சுதந்தரச் சொத்தாக
  rationale: נחלה என்பது சுதந்தரம் அல்லது உரிமையாகக் கிடைத்த சொத்தைக் குறிக்கும். மக்கள் தேவனுக்குரிய தனிப்பட்ட உரிமைச் சொத்தாக இருப்பதைக் காட்டுவதற்காகச் சுதந்தர உருவகம் காக்கப்பட்டுள்ளது.
- source_word: מִכֹּל עַמֵּי הָאָרֶץ
  choice: பூமியின் எல்லா மக்களினங்களிலிருந்தும்
  rationale: இங்கு הָאָרֶץ உலகளாவிய பரப்பைக் குறிக்கிறது; עַמִּים பல்வேறு மக்கள் கூட்டங்கள் அல்லது மக்களினங்களைக் குறிக்கிறது.
- source_word: כַּאֲשֶׁר דִּבַּרְתָּ
  choice: நீர் சொன்னபடியே
  rationale: தேவனுடைய முந்தைய சொல்லுக்கும் அவர் செய்த செயலுக்கும் உள்ள ஒத்திசைவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְּיַד מֹשֶׁה עַבְדֶּךָ
  choice: உமது ஊழியரான மோசேயின் மூலம்
  rationale: ‘மோசேயின் கையால்’ என்ற எபிரேய மரபுத்தொடர், மோசே இடைநிலையாளராக இருந்ததைக் குறிக்கிறது. தமிழில் ‘மூலம்’ அதன் பொருளைத் தெளிவாகத் தருகிறது; நேரடி வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: בְּהוֹצִיאֲךָ
  choice: வெளியே கொண்டுவந்தபோது
  rationale: בְּ உடன் வரும் infinitive construct இங்கு காலச் சூழலைக் குறிக்கிறது; ‘போது’ அதைத் தெளிவாகக் காட்டுகிறது.
- source_word: אֶת אֲבֹתֵינוּ
  choice: எங்கள் தந்தையரை
  rationale: אָבוֹת என்பதன் ஆண்பால் பன்மை வடிவத்தையும் முந்தைய தலைமுறையினரைக் குறிக்கும் மரபான பயன்பாட்டையும் காக்கிறது.
- source_word: מִמִּצְרַיִם
  choice: எகிப்திலிருந்து
  rationale: விடுதலைப் பயணத்தின் புறப்பட்டுச் செல்லும் திசையைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: אֲדֹנָי יְהוִה
  choice: ஆண்டவராகிய யாவே
  rationale: אֲדֹנָי என்ற பட்டத்தையும் יהוה என்ற தனிப்பெயரையும் வேறுபடுத்திக் காக்கிறது; தமிழில் இரண்டையும் இயல்பாக இணைக்க ‘ஆண்டவராகிய யாவே’ பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: אֲדֹנָי יְהוִה என்ற இறை அழைப்பின் மொழிபெயர்ப்பு
  choice: ஆண்டவராகிய யாவே
  alternative: ஆண்டவராகிய கர்த்தர்
  rationale: மூலத்தில் பட்டமும் உடன்படிக்கைப் பெயரும் இரண்டும் உள்ளன. ‘யாவே’ என்று பெயரை ஒலிபெயர்ப்பது יהוה என்பதை பொதுப்பட்டமாக மாற்றாமல் காக்கிறது.
- issue: ישראל தேவனுடைய נחלה எனப்படுதல்
  choice: சுதந்தரச் சொத்து
  alternative: உரிமைச் சொத்து
  rationale: ‘சுதந்தரச் சொத்து’ மூல உருவகத்தைப் பாதுகாக்கிறது; இது மக்கள் தேவனுக்குரியவர்கள் என்பதைக் குறிக்கிறது, அவர்கள் உயிரற்ற பொருட்கள் என்ற கருத்தை வலியுறுத்துவதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது. சொற்றொடர்கள் வாசிக்க இயல்பாக மறுவரிசைப்படுத்தப்பட்டாலும், காரணத் தொடக்கம், பிரித்தெடுத்தல், சுதந்தர உருவகம், மோசேயின் இடைநிலை, எகிப்திலிருந்து வெளியேற்றம், இறுதி இறை அழைப்பு ஆகியவை காக்கப்பட்டுள்ளன.
