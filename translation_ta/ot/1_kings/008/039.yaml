source:
  edition: WLC
  text: וְ֠/אַתָּה תִּשְׁמַ֨ע הַ/שָּׁמַ֜יִם מְכ֤וֹן שִׁבְתֶּ֨/ךָ֙ וְ/סָלַחְתָּ֣ וְ/עָשִׂ֔יתָ וְ/נָתַתָּ֤ לָ/אִישׁ֙ כְּ/כָל דְּרָכָ֔י/ו אֲשֶׁ֥ר תֵּדַ֖ע אֶת לְבָב֑/וֹ כִּֽי אַתָּ֤ה יָדַ֨עְתָּ֙ לְ/בַדְּ/ךָ֔ אֶת לְבַ֖ב כָּל בְּנֵ֥י הָ/אָדָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/039.yaml
  text: then may you hear in heaven[a], the place where you dwell, and forgive, and act, and give to each man according to all his ways, whose heart you know—for you alone know the heart of all the sons of man—
translation:
  language: ta
  text: அப்போது, நீர் உமது உறைவிடமாகிய பரலோகத்தில் கேட்டு, மன்னித்து, செயல்பட்டு, ஒவ்வொருவருக்கும் அவரவருடைய எல்லா வழிகளுக்கேற்ப அளிப்பீராக. அவருடைய உள்ளத்தை நீர் அறிவீர்; ஏனெனில் மனிதர்கள் அனைவருடைய[a] உள்ளத்தையும் நீர் ஒருவரே அறிவீர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “மனிதனின் மகன்கள் அனைவரும்”; இது மனிதர்கள் அனைவரையும் குறிக்கும் மரபுத்தொடர்.
    reason: மூல மொழியின் உருவக வடிவத்தையும் அதன் உள்ளடக்கப் பொருளையும் விளக்குகிறது.
lexical_decisions:
- source_word: תִּשְׁמַע
  choice: கேட்டு
  rationale: சாலொமோனின் வேண்டுதலில் இது சாதாரண எதிர்காலத்தைக் காட்டாமல் வேண்டுகோள் நுணுக்கத்தைக் கொண்டுள்ளது; தொடரின் இறுதியில் வரும் ‘அளிப்பீராக’ அந்த வேண்டுதல் வலிமையை இயல்பான தமிழில் முழுத் தொடருக்கும் அளிக்கிறது.
- source_word: הַשָּׁמַיִם מְכוֹן שִׁבְתֶּךָ
  choice: உமது உறைவிடமாகிய பரலோகத்தில்
  rationale: ‘வானம்/பரலோகம்’ என்பதையும் அதற்கு விளக்கமாக வரும் ‘உமது உறைவிடம்’ என்பதையும் ஒரே இயல்பான தமிழ் தொடராக இணைக்கிறது; கேட்பதற்குரிய இடத்தையும் தெளிவாக்குகிறது.
- source_word: וְסָלַחְתָּ
  choice: மன்னித்து
  rationale: வேண்டப்பட்ட தெய்வீக செயல்களின் தொடரைத் தக்கவைத்து, பாவம் அல்லது குற்றத்தை மன்னிக்கும் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְעָשִׂיתָ
  choice: செயல்பட்டு
  rationale: எபிரெய வினையின் பரந்த ‘செய்’ பொருளை, தேவன் பதிலளித்துச் செயலாற்றுவது என்ற சூழலில் தேவையற்ற குறிப்பாக்கமின்றி வெளிப்படுத்துகிறது.
- source_word: וְנָתַתָּ לָאִישׁ כְּכָל דְּרָכָיו
  choice: ஒவ்வொருவருக்கும் அவரவருடைய எல்லா வழிகளுக்கேற்ப அளிப்பீராக
  rationale: தனித்தனி நபர்களுக்குரிய பகிர்ந்தளிக்கும் பொருளையும், நடத்தை குறிக்கும் ‘வழிகள்’ என்ற எபிரெய உருவகத்தையும் பாதுகாக்கிறது.
- source_word: לְבָב / לְבָבוֹ
  choice: உள்ளம்
  rationale: சிந்தனை, நோக்கம், விருப்பம் ஆகியவற்றை உள்ளடக்கும் எபிரெய ‘இதயம்’ கருத்தை நவீன தமிழில் இயல்பாகவும் விரிவாகவும் தெரிவிக்கிறது.
- source_word: לְבַדְּךָ
  choice: நீர் ஒருவரே
  rationale: எல்லா மனிதரின் உள்ளத்தையும் அறியும் அறிவு தேவனுக்கே உரியது என்ற தனித்துவ வலியுறுத்தலைப் பாதுகாக்கிறது.
- source_word: כָּל בְּנֵי הָאָדָם
  choice: மனிதர்கள் அனைவருடைய
  rationale: சொல்லுக்குச் சொல் ‘மனிதனின் மகன்கள் அனைவரும்’ என்று தமிழில் இயல்பற்ற வடிவம் தராமல், மனிதகுலம் முழுவதையும் குறிக்கும் எபிரெய மரபுத்தொடரின் பொருளைத் தெளிவாக அளிக்கிறது.
theological_decisions:
- issue: כָּל בְּנֵי הָאָדָם என்ற மானிடவியல் மரபுத்தொடர்
  choice: மனிதர்கள் அனைவருடைய
  alternative: மனிதனின் மகன்கள் அனைவருடைய
  rationale: எபிரெயில் ஆண்பால் வடிவில் உள்ள மரபுத்தொடர் மனிதர்கள் அனைவரையும் உள்ளடக்குகிறது. நவீன தமிழில் சொல்லுக்குச் சொல் வடிவம் தவறாகப் புரியக்கூடும் என்பதால் உள்ளடக்கப் பொருள் முதன்மை உரையில் தரப்பட்டு, மூல வடிவம் அடிக்குறிப்பில் காட்டப்படுகிறது.
- issue: மனித உள்ளத்தை தேவன் மட்டுமே அறிவார் என்ற வலியுறுத்தல்
  choice: நீர் ஒருவரே அறிவீர்
  alternative: நீர் மட்டும் அறிவீர்
  rationale: לְבַדְּךָ என்பதன் பிரத்தியேக வலியுறுத்தலை இயல்பான, மரியாதையான தமிழில் வெளிப்படுத்துகிறது; வசனத்தின் தெய்வீக அறிவைப் பற்றிய உரிமையைச் சுருக்கவோ விரிவாக்கவோ செய்யவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதையான ஜெப நடையைப் பயன்படுத்துகிறது. தேவனைச் சுட்டும் இடங்களில் ‘நீர்/உமது’ வடிவம் கையாளப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் வேண்டுதல் ஓட்டம் காக்கப்பட்டாலும், வாசிப்புத் தெளிவுக்காக காரணவாக்கியத்திற்கு முன் வாக்கியப் பிரிவு இடப்பட்டுள்ளது.
