base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/058.yaml
  text: that he may incline our hearts to himself[a], to walk in all his ways and to keep his commandments, his statutes, and his judgments, which he commanded our fathers.
translation:
  language: ta
  text: அவர் நம் இதயங்களைத் தம்மிடம் திருப்பி, அவருடைய எல்லா வழிகளிலும் நாம் நடக்கவும், அவருடைய கட்டளைகளையும் விதிமுறைகளையும் நீதித்தீர்ப்புகளையும், அவர் நம் தந்தையருக்கு[a] கட்டளையிட்டபடி, நாம் கடைப்பிடிக்கவும் செய்வாராக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நம் முன்னோருக்கு.” எபிரெய மூலத்தில் “நம் தந்தையருக்கு” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהַטּוֹת
  choice: திருப்பி
  rationale: נטה என்பதன் ஹிஃபில் வடிவம் ஒருவரை ஒரு திசை நோக்கித் திருப்புதல் அல்லது சாயச் செய்தல் என்பதைக் குறிக்கிறது. நவீன தமிழில் ‘இதயங்களைத் தம்மிடம் திருப்பி’ என்பது மூல உருவகத்தையும் நோக்கத்தையும் இயல்பாகப் பாதுகாக்கிறது.
- source_word: לְבָבֵנוּ
  choice: நம் இதயங்களை
  rationale: לֵבָב சிந்தனை, விருப்பம், பற்று ஆகியவற்றை உள்ளடக்கிய உள்ளார்ந்த மனிதனைச் சுட்டுகிறது. ‘இதயம்’ எபிரெய உருவகத்தைத் தக்கவைக்கிறது.
- source_word: אֵלָיו
  choice: தம்மிடம்
  rationale: இறைவனை நோக்கிய திசையைக் குறிக்கும். தமிழ் மரியாதைத் தற்சுட்டுப் பெயரான ‘தம்மிடம்’ இச்சூழலில் இயல்பானது.
- source_word: לָלֶכֶת בְּכָל דְּרָכָיו
  choice: அவருடைய வழிகளிலெல்லாம் நடக்கவும்
  rationale: הלך மற்றும் דרך இணைவு உடன்படிக்கைச் சூழலில் வாழ்க்கை நடத்தையைக் குறிக்கும் உருவகம். ‘வழிகளில் நடப்பது’ அந்த உருவகத்தைப் பாதுகாக்கிறது.
- source_word: וְלִשְׁמֹר
  choice: கடைப்பிடிக்கவும்
  rationale: கட்டளைகளுடன் வரும் שׁמר, அவற்றைக் கவனமாக அனுசரித்தல் எனப் பொருள்படும். ‘கடைப்பிடி’ நவீன தமிழில் தெளிவான சட்ட-உடன்படிக்கைச் சொல்.
- source_word: מִצְוֺתָיו
  choice: அவருடைய கட்டளைகளை
  rationale: מִצְוָה கட்டளையிடப்பட்ட கடமையைக் குறிக்கிறது; ‘கட்டளை’ நேரான சமமான சொல்.
- source_word: חֻקָּיו
  choice: சட்டங்களை
  rationale: חֹק/חֻקָּה நிர்ணயிக்கப்பட்ட விதிமுறைகள் அல்லது சட்டங்களைச் சுட்டுகிறது. ‘சட்டங்கள்’ இதனைத் தெளிவாக வேறுபடுத்துகிறது.
- source_word: וּמִשְׁפָּטָיו
  choice: நீதிநியமங்களை
  rationale: מִשְׁפָּט நீதித்தீர்ப்பு, சட்டத் தீர்மானம், நியமம் ஆகிய பொருட்களைக் கொண்டது. ‘நீதிநியமங்கள்’ அதன் நீதி மற்றும் சட்ட நுணுக்கங்களைப் பாதுகாத்து மற்ற இரு சொற்களிலிருந்து வேறுபடுத்துகிறது.
- source_word: אֲשֶׁר צִוָּה
  choice: அவர் கட்டளையிட்ட
  rationale: சட்டச் சொற்களை விளக்கும் தொடர்புப்பிரிவை எளிமையாகவும் மூலத்திற்கு நெருக்கமாகவும் வழங்குகிறது.
- source_word: אֶת אֲבֹתֵינוּ
  choice: நம் தந்தையருக்கு
  rationale: אָבוֹתֵינוּ என்பது இலக்கணரீதியாக ஆண்பால் உறவுமுறைச் சொல்; ‘தந்தையர்’ மூலத்தின் வடிவத்தைப் பாதுகாக்கிறது. பொதுவான முன்னோர்களைக் குறிக்கும் வாய்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: உடன்படிக்கைச் சட்டச் சொற்களின் மும்மை
  choice: கட்டளைகள், சட்டங்கள், நீதிநியமங்கள்
  alternative: கட்டளைகள், விதிகள், தீர்ப்புகள்
  rationale: மூலத்தில் மூன்று தனித்த எபிரெயச் சட்டச் சொற்கள் உள்ளன. அவற்றை ஒரே பொதுப்பொருளாகச் சுருக்காமல், தமிழிலும் இயன்றவரை தனித்த நுணுக்கங்களுடன் வைத்திருக்கிறது.
- issue: மனித இதயத்தை இறைவன் தம்மிடம் திருப்புதல்
  choice: அவர் நம் இதயங்களைத் தம்மிடம் திருப்பி ... செய்வாராக
  alternative: நம் இதயங்கள் அவரிடம் சாயும்படி
  rationale: இறைவனே செயற்பாட்டாளராக உள்ள மூல இலக்கணத்தையும், சாலொமோனின் வேண்டுதல்/விருப்பத் தொடரையும் பாதுகாக்கிறது; மனிதச் செயற்பாட்டுக்கும் இறைச் செயற்பாட்டுக்கும் இடையிலான பதற்றம் விளக்கிச் சமப்படுத்தப்படவில்லை.
- issue: முன்னோர் குறித்த ஆண்பால் சொல்
  choice: நம் தந்தையர்
  alternative: நம் முன்னோர்
  rationale: மூல எபிரெயம் ஆண்பால் உறவுமுறைச் சொல்லைப் பயன்படுத்துகிறது. உரையில் அதைப் பாதுகாத்து, விரிவான குறிப்பு வாய்ப்பை அடிக்குறிப்பில் தெரிவிக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified நடையைப் பயன்படுத்துகிறது. ‘வழிகளில் நடக்க’ என்ற வேதாகம உருவகம் பாதுகாக்கப்பட்டுள்ளது; சட்டச் சொற்களின் மும்மை ஒன்றாக்கப்படவில்லை. வசனம் முந்தைய வேண்டுதலின் தொடராக இருப்பதால் ‘செய்வாராக’ என முடிக்கப்பட்டுள்ளது.
