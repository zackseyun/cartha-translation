revisions:
- from: அவர் நம் இதயங்களைத் தம்மிடம் திருப்பி, நாம் அவருடைய வழிகளிலெல்லாம் நடக்கவும், நம் தந்தையருக்கு[a] அவர் கட்டளையிட்ட அவருடைய கட்டளைகளையும் சட்டங்களையும் நீதிநியமங்களையும் கடைப்பிடிக்கவும் செய்வாராக.
  to: அவர் நம் இதயங்களைத் தம்மிடம் திருப்பி, அவருடைய எல்லா வழிகளிலும் நாம் நடக்கவும், அவருடைய கட்டளைகளையும் விதிமுறைகளையும் நீதித்தீர்ப்புகளையும், அவர் நம் தந்தையருக்கு[a] கட்டளையிட்டபடி, நாம் கடைப்பிடிக்கவும் செய்வாராக.
  rationale: The revision retains the prayerful “செய்வாராக,” the heart-turning metaphor, and the threefold legal terminology. It places the modifying clause after the triad so that it plainly applies to all three terms, and replaces the less natural “நீதிநியமங்கள்” with “நீதித்தீர்ப்புகள்.” The footnote anchor remains on “தந்தையருக்கு,” accurately reflecting the Hebrew fathers/ancestors alternative.
