source:
  edition: WLC
  text: בְּ/הֵעָצֵ֥ר שָׁמַ֛יִם וְ/לֹא יִהְיֶ֥ה מָטָ֖ר כִּ֣י יֶחֶטְאוּ לָ֑/ךְ וְ/הִֽתְפַּֽלְל֞וּ אֶל הַ/מָּק֤וֹם הַ/זֶּה֙ וְ/הוֹד֣וּ אֶת שְׁמֶ֔/ךָ וּ/מֵ/חַטָּאתָ֥/ם יְשׁוּב֖וּ/ן כִּ֥י תַעֲנֵֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/035.yaml
  text: When the heavens are shut up and there is no rain because they have sinned against you[a], and they pray toward this place and give thanks to your name and turn from their sin because you afflict them[b],
translation:
  language: ta
  text: வானம் அடைபட்டு, அவர்கள் உமக்கு எதிராகப் பாவம் செய்ததால் மழை பெய்யாதபோது, அவர்கள் இந்த இடத்தை நோக்கி மன்றாடி, உமது பெயரைப் போற்றி[a], நீர் அவர்களைத் தாழ்த்தியதால்[b] தங்கள் பாவத்தைவிட்டு விலகினால்,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உமது பெயருக்கு நன்றி செலுத்தி”; அல்லது, “உமது பெயரை அறிக்கையிட்டு.” எபிரேய வினைச்சொல் சூழலுக்கேற்ப நன்றியுடன் போற்றுதல் அல்லது வெளிப்படையாக அங்கீகரித்தல்/அறிக்கையிடுதல் ஆகிய பொருட்களைக் கொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நீர் அவர்களைத் துன்புறுத்தியதால்.” சிலர் இதை “நீர் அவர்களுக்குப் பதிலளித்ததால்” என்றும் வாசிக்கின்றனர். வறட்சி ஒழுக்கப்படுத்துதலாக வரும் இச்சூழல் ‘தாழ்த்துதல்/துன்புறுத்துதல்’ என்ற பொருளுக்கு ஆதரவளிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּהֵעָצֵר שָׁמַיִם
  choice: வானம் அடைபட்டு
  rationale: בְּ உடன் வரும் Niphal infinitive construct காலச் சூழலைக் குறிக்கிறது. שָׁמַיִם எபிரேயத்தில் பன்மை வடிவமாயினும், இயல்பான நவீன தமிழில் ‘வானம்’ என ஒருமையில் வழங்குவது பொருளைத் தெளிவாகக் காக்கிறது.
- source_word: וְלֹא יִהְיֶה מָטָר
  choice: மழை பெய்யாதபோது
  rationale: சொல்லுக்குச் சொல் ‘மழை இல்லாதபோது’ என்பதைக் காட்டிலும், மழை தடுக்கப்பட்ட சூழலைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כִּי יֶחֶטְאוּ לָךְ
  choice: அவர்கள் உமக்கு எதிராகப் பாவம் செய்ததால்
  rationale: כִּי காரணத்தையும் לָךְ இச்சூழலில் கடவுளுக்கு எதிரான குற்றத்தையும் குறிக்கின்றன.
- source_word: וְהִתְפַּלְלוּ אֶל הַמָּקוֹם הַזֶּה
  choice: அவர்கள் இந்த இடத்தை நோக்கி மன்றாடி
  rationale: אֶל இங்கு ஆலயத்தை வேண்டுதலின் இலக்காக அல்ல, வேண்டும்போது நோக்கும் திசையாகக் காட்டுகிறது. ‘மன்றாடி’ என்பது இறைவனை நோக்கிய தீவிர வேண்டுதலை இயல்பாகத் தருகிறது.
- source_word: וְהוֹדוּ אֶת שְׁמֶךָ
  choice: உமது பெயரைப் போற்றி
  rationale: Hiphil ידה நன்றி செலுத்துதல், போற்றுதல், வெளிப்படையாக அறிக்கையிடுதல் ஆகிய பொருட்களை ஏற்கலாம். இச்சூழலில் ‘போற்றி’ இயல்பாகவும் பொருள் அகலத்தை ஓரளவு காக்குமாறும் உள்ளது.
- source_word: וּמֵחַטָּאתָם יְשׁוּבוּן
  choice: தங்கள் பாவத்தைவிட்டு விலகினால்
  rationale: שׁוּב + מִן என்பதன் நேரான கருத்து பாவத்திலிருந்து திரும்புதல் அல்லது விலகுதல். ‘மனந்திரும்பினால்’ என்பதைவிட மூல உருவகத்தைத் தெளிவாகக் காக்கிறது.
- source_word: כִּי תַעֲנֵם
  choice: நீர் அவர்களைத் தாழ்த்தியதால்
  rationale: தீவிரப்படுத்தும் வினைவடிவாக எடுத்தால் ענה ‘துன்புறுத்து/தாழ்த்து’ எனப் பொருள்படும். வறட்சியால் வரும் ஒழுக்கப்படுத்தலுக்கும் அதனால் பாவத்திலிருந்து விலகுவதற்கும் ‘தாழ்த்தியதால்’ இயல்பாகப் பொருந்துகிறது; ‘பதில் அளித்ததால்’ என்ற வாசிப்பும் சாத்தியம் என்பதால் அடிக்குறிப்பில் காக்கப்படுகிறது.
theological_decisions:
- issue: ஆலயத்தை நோக்கிய மன்றாட்டு
  choice: இந்த இடத்தை நோக்கி மன்றாடி
  alternative: இந்த இடத்திடம் மன்றாடி
  rationale: மக்கள் ஆலயத்தையே வேண்டுதலின் பொருளாகக் கொள்வதல்ல; கடவுளுடைய பெயர் தங்கும் இடத்தை நோக்கி அவரிடம் மன்றாடுவதே சூழல்.
- issue: תַעֲנֵם என்பதன் பொருள்
  choice: நீர் அவர்களைத் தாழ்த்தியதால்
  alternative: நீர் அவர்களுக்குப் பதிலளித்ததால்
  rationale: மெய்யெழுத்து உரை ஒன்றுக்கு மேற்பட்ட விளக்கத்தை அனுமதிக்கிறது. வறட்சி, பாவம், அதிலிருந்து விலகுதல் என்ற உடனடிச் சூழலில் தெய்வீகத் தாழ்த்துதல் அல்லது துன்புறுத்துதல் என்ற பொருள் நல்ல தொடர்ச்சியைத் தருகிறது; மாற்று வாசிப்பு மறைக்கப்படவில்லை.
- issue: וְהוֹדוּ அங்கீகாரம் அல்லது போற்றுதல்
  choice: உமது பெயரைப் போற்றி
  alternative: உமது பெயரை அறிக்கையிட்டு
  rationale: ידה என்பதன் பல்பொருள் தன்மையை ஒரே குறுகிய கோட்பாட்டு பொருளுக்குள் அடைக்காமல், வழிபாடு மற்றும் வெளிப்படையான அங்கீகாரம் ஆகிய இரண்டுக்கும் அருகிலுள்ள தமிழ்ச் சொல்லாக ‘போற்றி’ தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், இறைமுக உரைக்கு மரியாதை ஒருமையான ‘உமது/நீர்’ பயன்படுத்தப்பட்டுள்ளது. வசனம் அடுத்த வசனத்தில் தொடரும் நிபந்தனைத் துணைவாக்கியம் என்பதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது. மொழிநடை இயல்பாகவும் கண்ணியமாகவும் இருந்து, மூலத்தின் சொற்பொருள் ஐயங்களை அடிக்குறிப்புகளில் காக்கிறது.
