  text: רָעָ֞ב כִּֽי יִהְיֶ֣ה בָ/אָ֗רֶץ דֶּ֣בֶר כִּֽי יִ֠הְיֶה שִׁדָּפ֨וֹן יֵרָק֜וֹן אַרְבֶּ֤ה חָסִיל֙ כִּ֣י יִהְיֶ֔ה כִּ֧י יָֽצַר ל֛/וֹ אֹיְב֖/וֹ בְּ/אֶ֣רֶץ שְׁעָרָ֑י/ו כָּל נֶ֖גַע כָּֽל מַחֲלָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/037.yaml
  text: If there is famine in the land[a], if there is pestilence, blight, mildew, locust, or caterpillar; if his enemy besieges him in the land of his gates; whatever plague[b], whatever sickness—
translation:
  language: ta
  text: நாட்டில் பஞ்சமோ கொள்ளைநோயோ ஏற்பட்டால்; பயிர்க்கருகலோ பூஞ்சண நோயோ, வெட்டுக்கிளியோ பயிரை அழிக்கும் பூச்சியோ[a] வந்தால்; பகைவன் மக்களை அவர்களுடைய நாட்டின் நகரங்களில்[b] முற்றுகையிட்டால்; எந்த வாதையோ எந்த நோயோ வந்தால்—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இந்த எபிரெயச் சொல், பயிரைத் தின்றழிக்கும் ஒரு வகை வெட்டுக்கிளியையோ அதன் வளர்ச்சிப் பருவம் ஒன்றையோ குறிக்கலாம்; துல்லியமான பூச்சியினம் உறுதியில்லை.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், ‘அவர்களுடைய வாயில்களின் நாட்டில்.’ இங்கு ‘வாயில்கள்’ என்பது நகரங்களையோ ஊர்களையோ குறிக்கும் ஆகுபெயர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָעָב
  choice: பஞ்சம்
  rationale: இது சாதாரணப் பசியைக் குறிக்காமல், நாடளாவிய உணவுப் பற்றாக்குறை என்னும் பேரிடரைக் குறிக்கிறது.
- source_word: דֶּבֶר
  choice: கொள்ளைநோய்
  rationale: பரவலாக உயிரிழப்பை ஏற்படுத்தும் தொற்றுப் பேரிடரைக் குறிக்கிறது; பின்னர் வரும் பொதுவான ‘வாதை’ என்பதிலிருந்து இதை வேறுபடுத்துகிறது.
- source_word: שִׁדָּפוֹן
  choice: பயிர்க்கருகல்
  rationale: வெப்பக்காற்று அல்லது பிற காரணத்தால் பயிர்கள் கருகி அழியும் வேளாண் பேரிடரை இயல்பான தமிழில் குறிக்கிறது.
- source_word: יֵרָקוֹן
  choice: பூஞ்சண நோய்
  rationale: வேளாண் சூழலில் பயிரைப் பாதிக்கும் நோயைக் குறிக்கிறது. எபிரெயச் சொல் மஞ்சளாதல் அல்லது வெளிறுதல் என்ற நிழற்பொருளையும் கொண்டிருக்கலாம்.
- source_word: אַרְבֶּה
  choice: வெட்டுக்கிளி
  rationale: கூட்டமாக வந்து பயிர்களை அழிக்கும் வெட்டுக்கிளிக்கான வழக்கமான தமிழ்ச் சொல்.
- source_word: חָסִיל
  choice: பயிரை அழிக்கும் பூச்சி
  rationale: துல்லியமான பூச்சியினம் உறுதியில்லை; பயிரைத் தின்றழிக்கும் தன்மையை முதன்மை உரை தெரிவிக்கிறது, சாத்தியமான வெட்டுக்கிளி பொருள் அடிக்குறிப்பில் வைக்கப்படுகிறது.
- source_word: כִּי יָצַר לוֹ אֹיְבוֹ
  choice: பகைவன் மக்களை ... முற்றுகையிட்டால்
  rationale: צור என்பதன் causative வடிவம் சுற்றிவளைத்து நெருக்குவதைக் குறிக்கிறது. ஒருமைச் சுட்டை இஸ்ரவேல் மக்களைக் கூட்டாகச் சுட்டுவதாக இயல்பான தமிழில் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: בְּאֶרֶץ שְׁעָרָיו
  choice: அவர்களுடைய நாட்டின் நகரங்களில்
  rationale: சொல்லுக்குச் சொல் ‘அவனுடைய வாயில்களின் நாட்டில்’; நகரவாயில்கள் ஆகுபெயராக நகரங்களைக் குறிக்கின்றன.
- source_word: כָּל נֶגַע
  choice: எந்த வாதை
  rationale: தாக்குதல், துன்பம், பேரிடர் ஆகியவற்றை உள்ளடக்கக்கூடிய பரந்த சொல்லின் பொருளையும் כָּל என்பதன் முழுமையான வீச்சையும் காக்கிறது.
- source_word: כָּל מַחֲלָה
  choice: எந்த நோய்
  rationale: பொதுவான உடல்நோயைக் குறிக்கிறது; ‘வாதை’ என்பதோடு ஒன்றாக்காமல் வேறுபாடு காக்கப்பட்டுள்ளது.
