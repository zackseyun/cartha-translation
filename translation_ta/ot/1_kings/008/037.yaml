translation_notes:
  register: நவீனத் தரத் தமிழில், பேரிடர்களின் பட்டியல் தெளிவாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. எபிரெயத்தில் மீண்டும் வரும் நிபந்தனை அமைப்பு ‘ஏற்பட்டால்/வந்தால்/முற்றுகையிட்டால்’ எனக் காக்கப்பட்டுள்ளது. வசனம் அடுத்த வசனத்தில் தொடர்வதை இறுதி நீள்கோடு காட்டுகிறது. வழங்கப்பட்ட ஆங்கில அடிக்குறிப்பு குறியீடுகளுக்கும் அவற்றின் உள்ளடக்கத்திற்கும் இடையே இடமாற்றம் இருந்ததால், மூலச்சொற்களுக்கு உரிய இடங்களில் [a], [b] சரியாக இணைக்கப்பட்டுள்ளன.
