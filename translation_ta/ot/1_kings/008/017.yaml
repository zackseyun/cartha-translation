  edition: WLC
  text: וַ/יְהִ֕י עִם לְבַ֖ב דָּוִ֣ד אָבִ֑/י לִ/בְנ֣וֹת בַּ֔יִת לְ/שֵׁ֥ם יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/017.yaml
  text: It was in the heart of David my father to build a house for the name of Yahweh[a], the God of Israel.
translation:
  language: ta
  text: என் தந்தை தாவீதின் உள்ளத்தில், இஸ்ரவேலின் கடவுளாகிய யாவே[a]யின் பெயருக்காக ஒரு வீட்டைக் கட்ட வேண்டும் என்ற எண்ணம் இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “யாவேயின் பெயருக்காக ஒரு ஆலயத்தைக் கட்ட.” எபிரெய மூலத்தில் நேரடியாக “வீடு” என்று உள்ளது; இச்சூழலில் அது ஆலயத்தைக் குறிக்கிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי עִם לְבַב
  choice: உள்ளத்தில் ... எண்ணம் இருந்தது
  rationale: எபிரெய மொழியின் ‘இதயத்துடன் இருந்தது’ என்ற மரபுத்தொடர் நோக்கம் அல்லது விருப்பம் மனத்தில் இருந்ததைக் குறிக்கிறது. தமிழில் இயல்பாக இருக்க ‘உள்ளத்தில் ... எண்ணம் இருந்தது’ என மொழிபெயர்க்கப்பட்டது; உள்ளம் என்ற உருவகமும் தக்கவைக்கப்பட்டுள்ளது.
- source_word: דָּוִד אָבִי
  choice: என் தந்தை தாவீது
  rationale: தமிழில் இயல்பான சொல் வரிசையைப் பயன்படுத்தி, தாவீது பேச்சாளரின் தந்தை என்ற உறவைத் தெளிவாகக் காட்டுகிறது.
- source_word: לִבְנוֹת
  choice: கட்ட வேண்டும்
  rationale: கட்டுவதற்கான நோக்கம் உள்ளத்தில் இருந்தது என்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: בַּיִת
  choice: ஓர் ஆலயம்
  rationale: எபிரெயச் சொல் நேரடியாக ‘வீடு’ எனப் பொருள்பட்டாலும், இச்சூழலில் யாவேக்காகக் கட்டப்படவிருந்த வழிபாட்டு ஆலயத்தைக் குறிக்கிறது. சாதாரண வாசகருக்கு இயல்பும் தெளிவும் அளிக்க ‘ஆலயம்’ முதன்மை உரையில் பயன்படுத்தப்பட்டு, நேரடி வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: לְשֵׁם
  choice: பெயருக்காக
  rationale: அர்ப்பணிப்பு, வெளிப்படுத்தப்பட்ட அடையாளம், மகிமை ஆகிய நுணுக்கங்களை மிகையாக விளக்காமல், மூலத்தின் ‘பெயருக்காக’ என்ற சொல்லாட்சியைப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய வேதாகமத்தில் உள்ள தனிப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பாக அளிக்கிறது.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கடவுள்
  rationale: இணைநிலை அடையாளப்படுத்தலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை எவ்வாறு வழங்குவது
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரை இறைவனின் தனிப்பெயரை நேரடியாகப் பயன்படுத்துவதால், பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்ப்பு தக்கவைக்கப்பட்டது.
- issue: בַּיִת என்பதைக் ‘வீடு’ என்றா ‘ஆலயம்’ என்றா மொழிபெயர்ப்பது
  choice: ஆலயம்
  alternative: வீடு
  rationale: மூலச் சொல் ‘வீடு’ என்றாலும் சூழலில் அது ஆலயத்தைக் குறிக்கிறது. நவீன தமிழில் தவறான புரிதலைத் தவிர்க்க ‘ஆலயம்’ முதன்மை உரையில் தரப்பட்டு, நேரடி மொழிபெயர்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ். எபிரெய ‘உள்ளம்’ உருவகமும் ‘பெயருக்காக’ என்ற இறையியல் செறிவுள்ள சொல்லாட்சியும் பாதுகாக்கப்பட்டுள்ளன.
