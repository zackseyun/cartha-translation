  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יָּבִ֣אוּ הַ֠/כֹּהֲנִים אֶת אֲר֨וֹן בְּרִית יְהוָ֧ה אֶל מְקוֹמ֛/וֹ אֶל דְּבִ֥יר הַ/בַּ֖יִת אֶל קֹ֣דֶשׁ הַ/קֳּדָשִׁ֑ים אֶל תַּ֖חַת כַּנְפֵ֥י הַ/כְּרוּבִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/006.yaml
  text: Then the priests brought the ark of the covenant of Yahweh to its place[a], into the inner sanctuary of the house, into the Most Holy Place[b], under the wings of the cherubim.
translation:
  language: ta
  text: பின்பு ஆசாரியர்கள் யாவேயின் உடன்படிக்கைப் பெட்டியை அதன் இடத்திற்குக் கொண்டுவந்தார்கள்; ஆலயத்தின் உட்புறத் திருத்தலமான மகா பரிசுத்த இடத்திற்கு[a], கேருபீன்களின் சிறகுகளுக்குக் கீழே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “பரிசுத்தங்களின் பரிசுத்தம்”; மரபாக, “மகா பரிசுத்த ஸ்தலம்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבִאוּ
  choice: பின்பு ... கொண்டுவந்தார்கள்
  rationale: தொடர்ச்சியான எபிரெயக் கதைநடையை இயல்பான நவீனத் தமிழில் காட்டுகிறது.
- source_word: הַכֹּהֲנִים
  choice: ஆசாரியர்கள்
  rationale: ஆலயப் பணியாளர்களைக் குறிக்கும் வழக்கமான, தெளிவான தமிழ் வேதாகமச் சொல்.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: யாவேயின் உடன்படிக்கைப் பெட்டி
  rationale: எபிரெயக் கூட்டுச்சொல் உறவை இயல்பான தமிழில் தெளிவாகக் கூறுகிறது; தெய்வீகப் பெயரும் பெயராகவே பாதுகாக்கப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எழுத்துத் தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: מְקוֹמוֹ
  choice: அதற்குரிய இடம்
  rationale: பின்னொட்டு உடன்படிக்கைப் பெட்டியைக் குறிப்பதைத் தமிழில் தெளிவாக்குகிறது; 'உரிய' என்பது சூழலில் உள்ள நிர்ணயிக்கப்பட்ட இடத்தை இயல்பாகத் தெரிவிக்கிறது.
- source_word: דְּבִיר הַבַּיִת
  choice: ஆலயத்தின் உட்புறத் திருத்தலம்
  rationale: דְּבִיר என்பதன் ஆலயத்தின் மிக உட்புற அறை என்ற பொருளைத் தெளிவாகத் தருகிறது; הַבַּיִת என்பதைக் சூழலுக்கேற்ற 'ஆலயம்' என வழங்குகிறது.
- source_word: קֹדֶשׁ הַקֳּדָשִׁים
  choice: மகா பரிசுத்த இடம்
  rationale: எபிரெய மிகைநிலைப் புனிதவெளி மொழியை நவீன வாசகர்களுக்குப் புரியும் மரியாதையான தமிழில் தருகிறது.
- source_word: תַּחַת כַּנְפֵי הַכְּרוּבִים
  choice: கேருபீன்களின் இறக்கைகளுக்குக் கீழே
  rationale: இடவியல் பொருளையும் ஆலய உருவகத்தையும் நேரடியாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் வரும் தனிப்பட்ட உடன்படிக்கைப் பெயரைப் பட்டமாக மாற்றாமல் ஒலிபெயர்த்து, அதன் பெயர்த் தன்மையைப் பாதுகாக்கிறது.
- issue: קֹדֶשׁ הַקֳּדָשִׁים என்ற புனிதவெளிச் சொற்றொடர்
  choice: மகா பரிசுத்த இடம்
  alternative: பரிசுத்த இடங்களிலெல்லாம் பரிசுத்தமான இடம்
  rationale: எபிரெய மிகைநிலைப் பொருளைப் பாதுகாத்தபடியே இயல்பான, சுருக்கமான தமிழை வழங்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; மரியாதையான வேதாகம நடையுடன் சாதாரண வாசகர்களுக்கும் புரியும் சொற்கள் பயன்படுத்தப்பட்டுள்ளன. மூலத்தின் தொடர்ச்சியான இலக்கு அமைப்பு தமிழில் இயல்பாக அமைய விளக்கவுரைச் சேர்க்கையின்றி மறுவடிவமைக்கப்பட்டுள்ளது.
