- from: பின்பு ஆசாரியர்கள் யாவேயின் உடன்படிக்கைப் பெட்டியை அதற்குரிய இடத்திற்குக் கொண்டுவந்தார்கள்—ஆலயத்தின் உட்புறத் திருத்தலமாகிய மகா பரிசுத்த இடத்தில்[a], கேருபீன்களின் இறக்கைகளுக்குக் கீழே வைத்தார்கள்.
  to: பின்பு ஆசாரியர்கள் யாவேயின் உடன்படிக்கைப் பெட்டியை அதன் இடத்திற்குக் கொண்டுவந்தார்கள்; ஆலயத்தின் உட்புறத் திருத்தலமான மகா பரிசுத்த இடத்திற்கு[a], கேருபீன்களின் சிறகுகளுக்குக் கீழே.
