    reason: lexical_alternative
  revision_rationale: The revision removes the unsupported additional action “placed” and renders the three Hebrew destination expressions as a single, progressive specification of where the ark was brought. It also refines the footnote to reflect the Hebrew expression more closely while retaining the familiar traditional alternative.
