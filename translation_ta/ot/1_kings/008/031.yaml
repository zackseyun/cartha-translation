source:
  edition: WLC
  text: אֵת֩ אֲשֶׁ֨ר יֶחֱטָ֥א אִישׁ֙ לְ/רֵעֵ֔/הוּ וְ/נָֽשָׁא ב֥/וֹ אָלָ֖ה לְ/הַֽאֲלֹת֑/וֹ וּ/בָ֗א אָלָ֛ה לִ/פְנֵ֥י מִֽזְבַּחֲ/ךָ֖ בַּ/בַּ֥יִת הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/031.yaml
  text: If a man sins against his neighbor[a], and an oath is laid on him to make him swear, and the oath comes before your altar in this house,
translation:
  language: ta
  text: ஒருவன் தன் அயலானுக்கு எதிராகப் பாவம் செய்து, அவனைச் சத்தியம் செய்ய வைப்பதற்காக அவன்மேல் சத்தியப்பிரமாணம் சுமத்தப்பட்டு, அந்தச் சத்தியப்பிரமாணம் இந்த வீட்டில் உள்ள உமது பலிபீடத்தின் முன் வந்தால்,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יֶחֱטָא
  choice: பாவம் செய்து
  rationale: חטא என்பதன் அறநெறி மற்றும் இறையியல் வலிமையைத் தக்கவைக்கிறது; இங்கு மற்றொருவருக்கு எதிராகச் செய்யப்படும் தவறைக் குறிக்கிறது.
- source_word: אִישׁ
  choice: ஒருவன்
  rationale: எபிரெய மூலத்தின் ஆண்பால் ஒருமையையும், பொதுவான பிரதிநிதிப் பயன்பாட்டையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לְרֵעֵהוּ
  choice: தன் அயலானுக்கு எதிராக
  rationale: רֵעַ என்பது அயலான், சக மனிதன் அல்லது உடனிருப்பவன் என்பதைக் குறிக்கலாம்; ‘அயலான்’ வேதாகம அறநெறிசார் தொடர்பைத் தக்கவைக்கிறது.
- source_word: וְנָשָׂא בוֹ אָלָה
  choice: அவன்மேல் சத்திய ஆணை சுமத்தப்பட்டு
  rationale: நீதிமுறைச் சூழலில் ஒருவரை ஆணைக்குட்படுத்தும் கருத்தையும், எபிரெய சொற்றொடரின் ‘சுமத்துதல்’ உருவகத்தையும் காக்கிறது.
- source_word: לְהַאֲלֹתוֹ
  choice: அவனைச் சத்தியம் செய்ய வைப்பதற்காக
  rationale: אלה வினையின் ஹிஃபில் காரணவினைப் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וּבָא אָלָה
  choice: அந்த ஆணை ... முன் வந்தால்
  rationale: אָלָה என்பதையே வாக்கியத்தின் எழுவாயாக வைத்திருக்கும் எபிரெய தொடரமைப்பையும் நீதிமுறை உருவகத்தையும் தக்கவைக்கிறது.
- source_word: לִפְנֵי מִזְבַּחֲךָ
  choice: உமது பலிபீடத்தின் முன்
  rationale: இடத்தையும் கடவுளின் முன்னிலையில் நடைபெறும் நீதிமுறைச் செயலையும் நேரடியாகத் தெரிவிக்கிறது.
- source_word: בַּבַּיִת הַזֶּה
  choice: இந்த வீட்டிலுள்ள
  rationale: בַּיִת என்பதன் நேரடிப் பொருளான ‘வீடு’ என்பதைத் தக்கவைக்கிறது; சூழலில் இது ஆலயத்தைக் குறிக்கிறது.
theological_decisions:
- issue: ஆலய நீதிமுறைச் சூழலில் אָלָה என்பதன் பொருள்
  choice: சத்திய ஆணை
  alternative: சாபம்
  rationale: இங்கு பலிபீடத்தின் முன் செய்யப்படும் நீதிமுறை ஆணையே முதன்மையான பொருள். ஆயினும், ஆணை பொய்யானதாக இருந்தால் வரவழைக்கப்படும் சாபத்தையும் இச்சொல் குறிக்கக்கூடும்; அந்தத் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில் கண்ணியமான, பொதுமக்களுக்கு விளங்கும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘சத்திய ஆணை’ என்ற சொற்றொடர் நீதிமுறைச் சூழலையும் אָלָה என்பதிலுள்ள ஆணை/சாபம் சார்ந்த பதற்றத்தையும் தக்கவைக்கிறது; ‘வீடு’ என்பது ஆலயத்தைக் குறித்தாலும் மூல உருவகத்தைப் பாதுகாக்கிறது.
