  text: and the priests were not able to stand to minister because of the cloud[b][a], for the glory of Yahweh filled the house of Yahweh.
translation:
  language: ta
  text: மேகத்தின் காரணமாக, ஆசாரியர்கள் நின்று பணிவிடை செய்ய முடியவில்லை[a]; ஏனெனில் யாவேயின் மகிமை யாவேயின் ஆலயத்தை[b] நிரப்பியது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நின்று சேவை செய்ய இயலவில்லை.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “யாவேயின் வீடு”; அதாவது, ஆலயம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָכְלוּ
  choice: முடியவில்லை
  rationale: இந்த வினை திறன் அல்லது ஆற்றலைக் குறிக்கிறது; ஆசாரியர்கள் பணிவிடை செய்ய இயலாத நிலையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: הַכֹּהֲנִים
  choice: ஆசாரியர்கள்
  rationale: ஆலயச் சூழலில் பணியாற்றும் மதகுருக்களுக்கான வழக்கமான, தெளிவான தமிழ் சொல்.
- source_word: לַעֲמֹד לְשָׁרֵת
  choice: நின்று பணிவிடை செய்ய
  rationale: ‘நிற்க’ என்ற நேரடிப் பொருளையும், ஆசாரியச் சேவையைக் குறிக்கும் ‘பணிவிடை செய்ய’ என்ற சூழல்சார் பொருளையும் காக்கிறது.
- source_word: מִפְּנֵי הֶעָנָן
  choice: மேகத்தின் காரணமாக
  rationale: எபிரெயச் சொற்றொடர் இங்கு காரணத்தைக் காட்டுகிறது; அதனை நவீன தமிழில் இயல்பாகத் தருகிறது.
- source_word: מָלֵא
  choice: நிரப்பியிருந்தது
  rationale: முன்னரே நிகழ்ந்து, ஆசாரியர்களின் அந்நிலைக்குக் காரணமாகத் தொடர்ந்திருந்த நிறைவு செயலைத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: כְבוֹד יְהוָה
  choice: யாவேயின் மகிமை
  rationale: כָּבוֹד என்பதன் ‘மகிமை’ என்ற இறையியல் நிறைந்த உருவகத்தை ‘பிரசன்னம்’ என விளக்கிப் பரிமாறாமல் காக்கிறது.
- source_word: בֵּית יְהוָה
  choice: யாவேயின் ஆலயம்
  rationale: சொல்லுக்கு நேராக ‘யாவேயின் வீடு’ என்றாலும், இச்சூழலில் அது ஆலயத்தைக் குறிக்கிறது; ‘ஆலயம்’ சாதாரண வாசகருக்கு இயல்பும் தெளிவும் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெயத் தெய்வீகப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் உள்ள உடன்படிக்கைப் பெயரைப் பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்த்து, அதன் தனிப்பெயர்த் தன்மையைப் பாதுகாக்கிறது.
- issue: כְבוֹד יְהוָה என்பதன் பொருள்
  choice: யாவேயின் மகிமை
  alternative: யாவேயின் பிரசன்னம்
  rationale: மூலத்தின் ‘மகிமை’ என்ற சொல் மற்றும் அதன் உருவகத் தீவிரத்தைத் தக்கவைத்து, அதனை ஒரு விளக்கவுரையாகச் சுருக்கவில்லை.
- issue: בֵּית יְהוָה என்பதன் குறிப்பு
  choice: யாவேயின் ஆலயம்
  alternative: யாவேயின் வீடு
  rationale: சாலொமோன் கட்டிய ஆலயமே இங்கு குறிக்கப்படுவதால் இயல்பான தமிழில் ‘ஆலயம்’ பயன்படுத்தப்பட்டது; நேரடிச் சொற்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
