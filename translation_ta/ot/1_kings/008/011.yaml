  register: நவீன நிலையான தமிழில், கண்ணியமான வேதாகம நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. ‘பணிவிடை செய்ய’ என்பது ஆசாரியச் சேவையின் முறையான தன்மையைத் தெரிவிக்கிறது; தெய்வீகப் பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
