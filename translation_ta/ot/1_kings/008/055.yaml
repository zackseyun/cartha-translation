lexical_decisions:
- source_word: וַיַּעְמֹד
  choice: அவன் எழுந்து நின்று
  rationale: עמד என்பதன் அடிப்படைப் பொருள் இங்கு ‘நின்றான்’ என்பதே; முந்தைய சூழலில் சாலொமோன் முழங்காலிலிருந்து எழுவதால், தமிழில் இயல்பாக ‘எழுந்து நின்று’ என வழங்கப்படுகிறது.
- source_word: וַיְבָרֶךְ
  choice: வாழ்த்தி
  rationale: இங்கு ברך என்பது கூடியிருந்த மக்கள்மேல் ஆசீர்வாதச் சொற்களைக் கூறுவதைக் குறிக்கிறது. ‘வாழ்த்தி’ என்பது சாலொமோன் தன் சக்தியால் அருளை வழங்கினான் என்ற தேவையற்ற கருத்தைச் சேர்க்காமல், செயலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: כָּל קְהַל יִשְׂרָאֵל
  choice: இஸ்ரவேலின் சபையார் அனைவரையும்
  rationale: קהל என்பது ஒன்றுகூடிய சமூகத்தைக் குறிக்கிறது; ‘சபையார்’ அதன் பொதுவான கூட்டுத் தன்மையைத் தருகிறது, כָּל என்பதை ‘அனைவரையும்’ வெளிப்படுத்துகிறது.
- source_word: קוֹל גָּדוֹל
  choice: உரத்த குரலில்
  rationale: சொல்லுக்கு சொல் ‘பெரிய குரல்’ என்ற எபிரெய வழக்கு, இங்கு அதிக ஒலியளவைச் சுட்டுகிறது; ‘உரத்த குரலில்’ என்பது இயல்பான நவீன தமிழ்.
- source_word: לֵאמֹר
  choice: 'சொன்னது:'
  rationale: இந்த வினையெச்சம் அடுத்த வசனத்தில் வரும் உரையை அறிமுகப்படுத்துகிறது; தமிழில் மேற்கோளுக்கான தெளிவான, இயல்பான இணைப்பாக இது அமைகிறது.
theological_decisions:
- issue: இஸ்ரவேலை ‘வாழ்த்தியதன்’ தன்மை
  choice: சாலொமோன் கூடியிருந்த மக்களுக்காக அல்லது அவர்கள்மேல் ஆசீர்வாத வாழ்த்தைக் கூறினான்.
  alternative: சாலொமோன் தன் அதிகாரத்தால் தெய்வீக அருளை அவர்களுக்கு வழங்கினான்.
  rationale: ברך பொதுவான அல்லது சடங்குசார் சூழலில் ஆசீர்வாதத்தை அறிவிப்பதைக் குறிக்கலாம். எந்தத் தத்துவ செயல்முறையையும் வசனம் விளக்காததால், மொழிபெயர்ப்பு அதைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன தரமான, கண்ணியமான, பொதுமக்கள் புரிந்துகொள்ளக்கூடிய தமிழ். எபிரெய கதைநடையின் தொடர்ச்சியும், அடுத்த வசன உரைக்கான அறிமுகமும் பாதுகாக்கப்பட்டுள்ளன.
