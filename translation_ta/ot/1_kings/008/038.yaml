theological_decisions:
- issue: הָאָדָם என்ற பிரதிநிதித்துவ ஒருமையைத் தமிழில் எவ்வாறு வழங்குவது
  choice: எந்த மனிதன்
  alternative: எந்த நபர்
  rationale: எபிரேய ஒருமையைத் தக்கவைக்கிறது; தொடர்ந்து வரும் ‘இஸ்ரவேலர் அனைவரும்’ என்பது தனிநபர்–சமூகம் என்ற வேறுபாட்டையும் உள்ளடக்கத்தையும் காட்டுகிறது.
- issue: הַבַּיִת என்பதைக் ‘வீடு’ என நேரடியாகவா, ‘ஆலயம்’ எனச் சூழல்படவா மொழிபெயர்ப்பது
  choice: ஆலயம்
  alternative: இந்த வீடு
  rationale: தமிழில் ‘இந்த வீடு’ என்பது வழிபாட்டிடத்தைக் தெளிவாக உணர்த்தாமல் இருக்கலாம். ‘ஆலயம்’ இங்கு குறிக்கப்படும் கட்டடத்தை இயல்பாகவும் தெளிவாகவும் தெரிவிக்கிறது; அடிமொழிச் சொல்லை அடிக்குறிப்பு பதிவு செய்கிறது.
translation_notes:
  register: நவீனத் தரத்தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. தனிநபரிலிருந்து முழு இஸ்ரவேல் மக்களுக்குச் செல்லும் அமைப்பும், உள்ளார்ந்த வாதையும், ஆலயத்தை நோக்கிக் கைகளை விரிக்கும் ஜெபச் செய்கையும் காக்கப்பட்டுள்ளன. வசனம் அடுத்த வசனத்தில் தொடர்வதால் இறுதியில் முற்றுப்புள்ளி அல்ல, காற்புள்ளி வைக்கப்பட்டுள்ளது.
