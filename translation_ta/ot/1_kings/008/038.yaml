translation:
  language: ta
  text: எந்த மனிதன் அல்லது உமது மக்களாகிய இஸ்ரவேலர் அனைவரும் ஏறெடுக்கும் எந்த ஜெபமாயினும், எந்த மன்றாட்டாயினும்[a], ஒவ்வொருவரும் தம் உள்ளத்தின் வாதையை[b] அறிந்து, இந்த ஆலயத்தை[c] நோக்கித் தம் கைகளை விரிக்கும்போது,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஜெபம்’ மற்றும் ‘மன்றாட்டு’ ஆகிய இரண்டையும், ‘எந்த மனிதனுக்காகவோ அல்லது உமது மக்களாகிய இஸ்ரவேலர் அனைவருக்காகவோ செய்யப்படும்’ என்றும் எபிரேயத் தொடரை எடுத்துக்கொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்கு சொல், “தன் இதயத்தின் வாதை” அல்லது “தன் இதயத்தின் தாக்கு.”
    reason: lexical_alternative
  - marker: c
    text: எபிரேயத்தில், “இந்த வீட்டை”; இங்கு அது ஆலயத்தைக் குறிக்கிறது.
    reason: cultural_note
