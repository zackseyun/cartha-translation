  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் ஆலயக் கட்டடவியல் வேறுபாடுகளைத் தக்கவைக்கும் கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டது. ‘திருத்தலம்’ என்பது இங்கு உட்புற sanctuary-ஐக் குறிக்கிறது; ‘பரிசுத்த இடம்’ வெளிப்புற அறைக்கான தொழில்நுட்பப் பெயராக வைக்கப்பட்டது.
