  text: וַֽ/יַּאֲרִכוּ֮ הַ/בַּדִּים֒ וַ/יֵּרָאוּ֩ רָאשֵׁ֨י הַ/בַּדִּ֤ים מִן הַ/קֹּ֨דֶשׁ֙ עַל פְּנֵ֣י הַ/דְּבִ֔יר וְ/לֹ֥א יֵרָא֖וּ הַ/ח֑וּצָ/ה וַ/יִּ֣הְיוּ שָׁ֔ם עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/008.yaml
  text: And the poles were so long that the ends of the poles were seen from the Holy Place before the inner sanctuary[a], but they could not be seen from outside; and they are there to this day.
translation:
  language: ta
  text: அந்தத் தண்டுகள் மிக நீளமாக இருந்ததால், அவற்றின் முனைகள் பரிசுத்த இடத்திலிருந்து உட்புறத் திருத்தலத்தின்[a] முன்னே தெரிந்தன; ஆனால் வெளியிலிருந்து அவை தெரியவில்லை. அவை இந்நாள்வரை அங்கே இருக்கின்றன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மகா பரிசுத்த இடம்.’ எபிரெயச் சொல் ஆலயத்தின் உட்புறத் திருத்தலத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּאֲרִכוּ
  choice: மிக நீளமாக இருந்ததால்
  rationale: ארך என்னும் வினை இங்கு தண்டுகளின் நீளத்தையும், அடுத்ததாகக் கூறப்படும் அவற்றின் முனைகள் தெரிந்ததற்கான காரணத்தையும் குறிக்கிறது. தமிழில் இயல்பான விளைவு-காரண நடையில் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: הַבַּדִּים
  choice: அந்தத் தண்டுகள்
  rationale: בַּדִּים என்பது உடன்படிக்கைப் பெட்டியைச் சுமப்பதற்கான தண்டுகளைக் குறிக்கிறது. ‘தண்டுகள்’ என்பது தெளிவான, தற்போதைய தமிழ்ச் சொல்.
- source_word: וַיֵּרָאוּ רָאשֵׁי הַבַּדִּים
  choice: அவற்றின் முனைகள் ... தெரிந்தன
  rationale: רָאשֵׁי என்பதன் சொற்பொருள் ‘தலைகள்’; தண்டுகளைப் பொறுத்தவரை ‘முனைகள்’ என்பது இயல்பான தமிழ். Niphal வடிவத்தின் காணப்படுதல்/தெரிதல் பொருளை ‘தெரிந்தன’ நேரடியாக வெளிப்படுத்துகிறது.
- source_word: מִן הַקֹּדֶשׁ
  choice: பரிசுத்த இடத்திலிருந்து
  rationale: இங்கு הַקֹּדֶשׁ ஆலயத்தின் வெளிப்புற அறையை, உட்புறத் திருத்தலத்திலிருந்து வேறுபடுத்திக் குறிக்கிறது. ‘பரிசுத்த இடம்’ அந்தக் கட்டடவியல் வேறுபாட்டைத் தக்கவைக்கிறது.
- source_word: עַל פְּנֵי הַדְּבִיר
  choice: உட்புறத் திருத்தலத்தின் முன்னே
  rationale: דְּבִיר என்பது உடன்படிக்கைப் பெட்டி வைக்கப்பட்ட ஆலயத்தின் உட்புற அறையைக் குறிக்கிறது; עַל־פְּנֵי என்பதற்கு இச்சூழலில் ‘முன்னே’ இயல்பான இணைச்சொல்.
- source_word: וְלֹא יֵרָאוּ הַחוּצָה
  choice: ஆனால் வெளியிலிருந்து அவை தெரியவில்லை
  rationale: பரிசுத்த இடத்திலிருந்து தெரிந்ததையும் வெளியிலிருந்து தெரியாததையும் எபிரெய உரை எதிர்மறையாக ஒப்பிடுகிறது; ‘வெளியிலிருந்து’ அந்த நோக்குநிலையைத் தெளிவாக்குகிறது.
- source_word: וַיִּהְיוּ שָׁם עַד הַיּוֹם הַזֶּה
  choice: அவை இந்நாள்வரை அங்கே இருக்கின்றன
  rationale: கதைசொல்லியின் காலம்வரை தொடரும் நிலையைச் சுட்டும் வழக்கமான எபிரெயச் சொற்றொடரை, தமிழிலும் நிகழ்காலத் தொடர்நிலையாக இயல்பாகத் தருகிறது.
