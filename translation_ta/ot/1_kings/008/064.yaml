  text: בַּ/יּ֣וֹם הַ/ה֗וּא קִדַּ֨שׁ הַ/מֶּ֜לֶךְ אֶת תּ֣וֹךְ הֶ/חָצֵ֗ר אֲשֶׁר֙ לִ/פְנֵ֣י בֵית יְהוָ֔ה כִּי עָ֣שָׂה שָׁ֗ם אֶת הָֽ/עֹלָה֙ וְ/אֶת הַ/מִּנְחָ֔ה וְ/אֵ֖ת חֶלְבֵ֣י הַ/שְּׁלָמִ֑ים כִּֽי מִזְבַּ֤ח הַ/נְּחֹ֨שֶׁת֙ אֲשֶׁ֣ר לִ/פְנֵ֣י יְהוָ֔ה קָטֹ֗ן מֵֽ/הָכִיל֙ אֶת הָ/עֹלָ֣ה וְ/אֶת הַ/מִּנְחָ֔ה וְ/אֵ֖ת חֶלְבֵ֥י הַ/שְּׁלָמִֽים־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/064.yaml
  text: On that day the king consecrated the middle of the court that was before the house of Yahweh[a], because there he offered the burnt offering and the grain offering and the fat portions of the peace offerings[c][b], because the bronze altar that was before Yahweh was too small to contain the burnt offering and the grain offering and the fat portions of the peace offerings.
translation:
  language: ta
  text: அந்த நாளில் அரசன் யாவேயின் இல்லத்தின் முன்புறத்தில் இருந்த முற்றத்தின் நடுப்பகுதியை[a] புனிதப் பயன்பாட்டிற்கென அர்ப்பணித்தான். ஏனெனில், வெண்கலப் பலிபீடம் தகனபலியையும் தானியக் காணிக்கையையும் சமாதானப் பலிகளின் கொழுப்புப் பகுதிகளையும்[c] கொள்ள முடியாத அளவுக்குச் சிறியதாக இருந்ததால், அங்கே அவன் தகனபலியையும் தானியக் காணிக்கையையும் சமாதானப் பலிகளின் கொழுப்புப் பகுதிகளையும் செலுத்தினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “முற்றத்தின் உட்பகுதியை.”
    reason: lexical_alternative
  - marker: c
    text: சொல்லுக்கு நெருக்கமாக, “சமாதானப் பலிகளின் கொழுப்பை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: קִדַּשׁ
  choice: புனிதப் பயன்பாட்டிற்கென அர்ப்பணித்தான்
  rationale: இடத்தை வழிபாட்டுக்காகப் புனிதமாகப் பிரித்துவைக்கும் பொருளை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது; வெறும் பொதுவான ‘அர்ப்பணித்தான்’ என்பதைக் காட்டிலும் சடங்குசார் நோக்கத்தைத் தெளிவாக்குகிறது.
- source_word: תּוֹךְ הֶחָצֵר
  choice: முற்றத்தின் நடுப்பகுதி
  rationale: תּוֹךְ என்பதன் இடவியல் பொருளான ‘நடு/மத்தி’ என்பதை நேரடியாகவும் இயல்பாகவும் தருகிறது; இது முழு முற்றத்தையும் அல்ல, அதன் மையப் பகுதியைக் குறிக்கிறது.
- source_word: לִפְנֵי בֵית יְהוָה
  choice: யாவேயின் இல்லத்திற்கு முன்னால்
  rationale: לִפְנֵי என்பதன் இடவியல் பொருளையும் בֵית என்பதன் ‘இல்லம்’ என்ற உருவகத்தையும் காக்கிறது; ‘ஆலயம்’ என்பது விளக்கமாக அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரேய மெய்யெழுத்துப் பெயரான יהוה என்பதை ஒரு பட்டமாக மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: עָשָׂה שָׁם
  choice: அங்கே அவன் ... செலுத்தினான்
  rationale: עשה என்பதன் பொதுப் பொருள் ‘செய்தான்’ என்றாலும், பலிச் சூழலில் பலிகளைச் செலுத்தும் செயலைக் குறிக்கிறது; ‘செலுத்தினான்’ தமிழில் இயல்பான சடங்குசார் சொல்.
- source_word: הָעֹלָה
  choice: தகனபலி
  rationale: முழுவதுமாக எரித்துச் செலுத்தப்படும் பலிக்கான நிலையான, சுருக்கமான தமிழ் வழிபாட்டுச் சொல்.
- source_word: הַמִּנְחָה
  choice: தானியக் காணிக்கை
  rationale: இந்தப் பலியியல் சூழலில் מִנְחָה தானியத்தால் ஆன காணிக்கையைக் குறிக்கிறது; பொதுவான ‘காணிக்கை’ என்பதைவிடத் துல்லியமானது.
- source_word: חֶלְבֵי הַשְּׁלָמִים
  choice: சமாதானப் பலிகளின் கொழுப்புப் பகுதிகள்
  rationale: חֶלֶב என்பது உருவகமான ‘சிறந்த பாகங்கள்’ அல்ல, பலிபீடத்தில் எரிக்க ஒதுக்கப்பட்ட கொழுப்புப் பகுதிகள்; שְׁלָמִים என்பதற்கு அறியப்பட்ட ‘சமாதானப் பலிகள்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: מִזְבַּח הַנְּחֹשֶׁת
  choice: வெண்கலப் பலிபீடம்
  rationale: נְחֹשֶׁת இச்சூழலில் வழிபாட்டுப் பொருளின் உலோகமாக வெண்கலத்தைக் குறிக்கும் வழக்கமான புரிதலைத் தருகிறது.
- source_word: קָטֹן מֵהָכִיל
  choice: கொள்ள முடியாத அளவுக்குச் சிறியதாக இருந்தது
  rationale: பெயரடை மற்றும் வினையெச்சக் கட்டமைப்பு வெளிப்படுத்தும் கொள்ளளவுப் போதாமையை இயல்பான தமிழில் துல்லியமாகக் கூறுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட இறைப்பெயர் நேரடியாக உள்ளது. அதை பொதுப் பட்டமான ‘கர்த்தர்’ என்று மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைக் காக்கிறது; ‘யாவே’ என்பது நவீன ஆய்வில் பரவலாக ஏற்கப்படும் உச்சரிப்பின் தமிழ் வடிவம்.
- issue: שְׁלָמִים பலிகளின் பெயர்
  choice: சமாதானப் பலிகள்
  alternative: உறவுப் பலிகள் / ஐக்கியப் பலிகள்
  rationale: இந்தச் சொல்லின் பொருள் நலன், சமாதானம், பகிரப்பட்ட பலியுணவு ஆகியவற்றோடு தொடர்புடையது. மூலத்தின் பரந்த சடங்குசார் கருத்தை ஒற்றை விளக்கத்துக்குள் சுருக்காமல், அறியப்பட்ட பாரம்பரியப் பெயர் பயன்படுத்தப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதைமிக்க நடையில் வடிவமைக்கப்பட்டது. ‘யாவேயின் இல்லம்’ என்ற எபிரேய உருவகம் முதன்மை உரையில் காக்கப்பட்டு, அதன் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது. பலியியல் சொற்கள் துல்லியமாகவும் அளவுக்கு மீறிய தொழில்நுட்ப மொழியின்றியும் தரப்பட்டுள்ளன.
