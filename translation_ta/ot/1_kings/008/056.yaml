  choice: நல்வார்த்தைகள் அனைத்திலும்
  rationale: ஒருமை வடிவத்தின் தொகுப்புப் பொருளை இயல்பான தமிழ்ப் பன்மையில் தருகிறது; 'வாக்குறுதிகள்' என்ற விளக்கத்தைப் பிரதான உரையில் திணிக்கவில்லை.
- source_word: בְּיַד מֹשֶׁה
  choice: மோசேயின் மூலம்
  rationale: எபிரெய மொழியின் செயற்பாட்டாளர் மரபுத்தொடரை, தமிழில் இயல்பாகப் புரியும் வகையில் மொழிபெயர்க்கிறது.
- source_word: עַבְדּוֹ
  choice: தமது ஊழியரான
  rationale: மோசே கடவுளால் நியமிக்கப்பட்ட பணியாளர் என்ற மரியாதைமிக்க சூழலுக்குப் பொருத்தமானது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை எவ்வாறு வழங்குவது
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக இருப்பதால், அதை ஒரு பட்டத்தால் மாற்றாமல் ஒலிபெயர்க்கப்பட்டது.
- issue: דָּבָר / דְּבָרוֹ என்பதை 'வார்த்தை' எனவா 'வாக்குறுதி' எனவா மொழிபெயர்ப்பது
  choice: வார்த்தை / நல்வார்த்தைகள்
  alternative: வாக்குறுதி / நல்ல வாக்குறுதிகள்
  rationale: சூழல் வாக்குறுதிகளின் நிறைவேற்றத்தைக் குறிப்பினும், எபிரெய உரை 'வார்த்தை' என்றே கூறுகிறது. அந்தச் சொல் மீளுருவை பிரதான உரையில் பேணி, வாக்குறுதி நுணுக்கத்தை அடிக்குறிப்பில் தெரிவிக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான துதிப்பாங்கு பேணப்பட்டுள்ளது. 'போற்றப்படுவாராக' என்பது தொடக்க வாழ்த்துரையின் வலிமையைத் தருகிறது; 'மோசேயின் மூலம்' என்பது எபிரெய மரபுத்தொடரின் இயல்பான தமிழாக்கம்.
