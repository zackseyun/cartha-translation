base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/056.yaml
  text: Blessed be Yahweh[a], who has given rest to his people Israel, according to all that he spoke. Not one word has failed of all his good words that he spoke by the hand of Moses his servant.
translation:
  language: ta
  text: தாம் சொன்ன அனைத்தின்படியும் தமது மக்களாகிய இஸ்ரவேலருக்கு இளைப்பாறுதலை அளித்த யாவே போற்றப்படுவாராக! அவர் தமது ஊழியரான மோசேயின் மூலம் கூறிய எல்லா நல்ல வார்த்தைகளிலும் ஒன்றுகூட நிறைவேறாமல் போகவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவர் தமது ஊழியரான மோசேயின் மூலம் கூறிய எல்லா நல்ல வாக்குறுதிகளிலும் ஒன்றுகூட நிறைவேறாமல் போகவில்லை” என்றும் பொருள் கொள்ளலாம்; இங்கு “வார்த்தை” என்பது சொல்லப்பட்ட வாக்குறுதியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
