  text: אָ֣ז יַקְהֵ֣ל שְׁלֹמֹ֣ה אֶת זִקְנֵ֣י יִשְׂרָאֵ֡ל אֶת כָּל רָאשֵׁ֣י הַ/מַּטּוֹת֩ נְשִׂיאֵ֨י הָ/אָב֜וֹת לִ/בְנֵ֧י יִשְׂרָאֵ֛ל אֶל הַ/מֶּ֥לֶךְ שְׁלֹמֹ֖ה יְרוּשָׁלִָ֑ם לְֽ/הַעֲל֞וֹת אֶת אֲר֧וֹן בְּרִית יְהוָ֛ה מֵ/עִ֥יר דָּוִ֖ד הִ֥יא צִיּֽוֹן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/001.yaml
  text: Then Solomon assembled the elders of Israel[a], all the heads of the tribes, the leaders of the fathers’ houses of the sons of Israel, to King Solomon in Jerusalem, to bring up the ark of the covenant of Yahweh from the city of David, that is, Zion.
translation:
  language: ta
  text: 'அப்போது சாலொமோன் இஸ்ரவேலின் மூப்பர்களையும், கோத்திரங்களின் எல்லாத் தலைவர்களையும், இஸ்ரவேல் மக்களின்[a] மூதாதையர் குடும்பங்களின் தலைவர்களையும், தாவீதின் நகரமாகிய சீயோனிலிருந்து யாவேயின் உடன்படிக்கைப் பெட்டியை மேலே கொண்டுவருவதற்காக, எருசலேமிலுள்ள அரசன் சாலொமோனிடம் ஒன்றுகூட்டினார்.


    [a] எபிரெய மொழியில், “இஸ்ரவேலின் மகன்கள்.” இது இஸ்ரவேல் நாட்டினரைக் குடும்ப உறவின் அடிப்படையில் குறிப்பிடும் சொற்றொடர்; “இஸ்ரவேலின் பிள்ளைகள்” என்றும் மொழிபெயர்க்கலாம்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில், “இஸ்ரவேலின் மகன்கள்.” இது இஸ்ரவேல் நாட்டினரைக் குடும்ப உறவின் அடிப்படையில் குறிப்பிடும் சொற்றொடர்; “இஸ்ரவேலின் பிள்ளைகள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: மூலச் சொற்றொடரின் நேரடிப் பொருளையும் மாற்று மொழிபெயர்ப்பையும் பாதுகாக்கிறது.
lexical_decisions:
- source_word: אָז
  choice: அப்போது
  rationale: அடுத்த நிகழ்வை அறிமுகப்படுத்தும் காலச் சுட்டியாக இயல்பான நவீனத் தமிழில் தரப்பட்டுள்ளது.
- source_word: יַקְהֵל
  choice: ஒன்றுகூட்டினார்
  rationale: קהל என்பதன் ஹிஃபில் வடிவம் பிறரை ஒன்றுகூடச் செய்வதைக் குறிக்கிறது; அரசரால் ஏற்பாடு செய்யப்பட்ட முறையான கூட்டத்துக்கும் இச்சொல் பொருந்துகிறது.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மூப்பர்கள்
  rationale: அங்கீகரிக்கப்பட்ட மூத்த சமூக-அரசியல் தலைவர்களைக் குறிக்கும் வழக்கமான பதவி தெளிவாகப் பாதுகாக்கப்படுகிறது.
- source_word: כָּל רָאשֵׁי הַמַּטּוֹת
  choice: கோத்திரங்கள் அனைத்தின் தலைவர்கள்
  rationale: מַטּוֹת இங்கு நேரடியாகக் கோல்களைக் குறிக்காமல் கோத்திரப் பிரிவுகளைக் குறிக்கிறது.
- source_word: נְשִׂיאֵי הָאָבוֹת
  choice: மூதாதையர் குடும்பத் தலைவர்கள்
  rationale: மூதாதையர் வழிவந்த குடும்ப அல்லது குல அமைப்புகளின் அங்கீகரிக்கப்பட்ட தலைவர்களை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: சொல்லுக்குச் சொல் பொருள் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு முழு தேசியச் சமூகத்தையும் குறிக்கும் குடும்ப-தேசியச் சொற்றொடர். முதன்மை உரையில் இயல்பான கூட்டுப்பொருள் தரப்பட்டு, நேரடிப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: אֶל הַמֶּלֶךְ שְׁלֹמֹה
  choice: அரசன் சாலொமோனிடம்
  rationale: אֶל என்பதன் திசை/இலக்கு நுணுக்கத்தை விளக்கவுரை சேர்க்காமல் காக்கிறது; மூலத்தில் சாலொமோனின் பெயர் மீண்டும் வருவதையும் பாதுகாக்கிறது.
- source_word: לְהַעֲלוֹת
  choice: மேலே கொண்டுவருவதற்காக
  rationale: எருசலேமை நோக்கிய மேல்நோக்கிய நகர்வையும், பெட்டியை எடுத்துவரும் செயப்படுத்தும் பொருளையும் காக்கிறது.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: யாவேயின் உடன்படிக்கைப் பெட்டி
  rationale: எபிரெய கட்டமைப்பை இயல்பான தமிழ் உடைமைத் தொடராகத் தருகிறது; אֲרוֹן என்பதற்கு வேதாகமச் சூழலில் வழக்கமான ‘பெட்டி’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், எபிரெய நான்கெழுத்துப் பெயரின் பரவலான தமிழ் ஒலிபெயர்ப்பாகத் தருகிறது.
- source_word: מֵעִיר דָּוִד הִיא צִיּוֹן
  choice: தாவீதின் நகரமாகிய சீயோனிலிருந்து
  rationale: தாவீதின் நகரமே சீயோன் என்ற அடையாளப்படுத்தலைச் சுருக்கமான, இயல்பான தமிழ் பெயரெச்சத் தொடரில் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரையில் தனிப்பெயர் நேரடியாக இருப்பதால், அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்த்து உடன்படிக்கைப் பெயரின் தனித்தன்மை காக்கப்படுகிறது.
- issue: לִבְנֵי יִשְׂרָאֵל என்ற குடும்ப-தேசியச் சொற்றொடர்
  choice: முதன்மை உரையில் ‘இஸ்ரவேல் மக்கள்’; அடிக்குறிப்பில் ‘இஸ்ரவேலின் மகன்கள்’
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: இச்சூழலில் சொற்றொடர் தேசிய சமூகத்தைக் கூட்டாகக் குறிக்கிறது. தமிழ் வாசகருக்கு அது யாக்கோபின் நேரடி மகன்களை மட்டுமே குறிக்கிறது என்ற தவறான எண்ணம் ஏற்படாதபடி கூட்டுப்பொருள் முதன்மை உரையில் தரப்படுகிறது; மூலத்தின் ஆண்பால் குடும்ப உருவகம் அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. மூலத்தில் சாலொமோனின் பெயர் இருமுறை வருவது நீக்கப்படவில்லை. நீண்ட எபிரெய வாக்கியம் தமிழில் வாசிப்புத் தெளிவுக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டது; நோக்கத் தொடர்பு இரண்டாம் வாக்கியத்தில் வெளிப்படையாகத் தொடர்கிறது.
