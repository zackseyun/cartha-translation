  revision_rationale: மூலத்தின் ஒரே பிரதான வினையையும் அதன் நோக்கத் தொடரையும் ஒரே தமிழ் வாக்கியத்தில் மீட்டமைத்துள்ளேன். இதனால் மீளுரை நீங்குகிறது; கூட்டப்பட்ட தலைவர்கள் எருசலேமிலுள்ள அரசன் சாலொமோனிடம் கூடுவதும், பெட்டியை சீயோனிலிருந்து மேலே கொண்டுவருதல் அந்தக் கூட்டத்தின் நோக்கமுமாகத் தெளிவாகிறது. அடிக்குறிப்பு அடையாளமும் உரையும் மாற்றமின்றி பாதுகாக்கப்பட்டுள்ளன.
