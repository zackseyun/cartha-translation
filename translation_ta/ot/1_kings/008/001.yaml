    rationale: எபிரெய மூலத்தில் யַקְהֵל ஒரு முறை மட்டுமே உள்ளது. இரண்டாம் வாக்கியத்தில் அதே வினையை மீண்டும் பயன்படுத்துவது, உடன்படிக்கைப் பெட்டியை மேலே கொண்டுவருதல் கூட்டத்தின் நோக்கம் என்பதற்குப் பதிலாக, தனியான இரண்டாம் கூட்டுச் செயலாகத் தோன்றச் செய்யலாம்.
