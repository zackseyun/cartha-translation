  revised_text: 'அப்போது சாலொமோன் இஸ்ரவேலின் மூப்பர்களையும், கோத்திரங்களின் எல்லாத் தலைவர்களையும், இஸ்ரவேல் மக்களின்[a] மூதாதையர் குடும்பங்களின் தலைவர்களையும், தாவீதின் நகரமாகிய சீயோனிலிருந்து யாவேயின் உடன்படிக்கைப் பெட்டியை மேலே கொண்டுவருவதற்காக, எருசலேமிலுள்ள அரசன் சாலொமோனிடம் ஒன்றுகூட்டினார்.


    [a] எபிரெய மொழியில், “இஸ்ரவேலின் மகன்கள்.” இது இஸ்ரவேல் நாட்டினரைக் குடும்ப உறவின் அடிப்படையில் குறிப்பிடும் சொற்றொடர்; “இஸ்ரவேலின் பிள்ளைகள்” என்றும் மொழிபெயர்க்கலாம்.'
