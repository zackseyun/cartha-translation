  source_fidelity: மூலத்தின் முக்கியக் கூறுகள்—சாலொமோன் கூட்டத்தைக் கூட்டுதல், இஸ்ரவேலின் மூப்பர்கள், கோத்திரத் தலைவர்கள், இஸ்ரவேல் மக்களுடைய மூதாதையர் குடும்பங்களின் தலைவர்கள், எருசலேமில் அரசன் சாலொமோனிடம் கூடுதல், சீயோனாகிய தாவீதின் நகரத்திலிருந்து யாவேயின் உடன்படிக்கைப் பெட்டியை மேலே கொண்டுவரும் நோக்கம்—பெரும்பாலும் சரியாக உள்ளன. ஆனால் தற்போதைய உரை ‘ஒன்றுகூட்டினார்’ என்பதை இரு முறை கூறி, மூலத்தில் ஒரே வாக்கியமாக இருக்கும் செயல்-நோக்கத் தொடர்பை தேவையற்ற விதத்தில் மீளுரைக்கிறது.
  naturalness: ‘கோத்திரங்களின் எல்லாத் தலைவர்கள்’ மற்றும் ‘மூதாதையர் குடும்பங்களின் தலைவர்கள்’ நவீனத் தரத் தமிழில் தெளிவானவை. ஒரே வாக்கியத்தில் நோக்கத் தொடரை இணைப்பதால் வாசிப்பும் தர்க்கத் தொடர்பும் இயல்பாகின்றன.
  terminology: ‘மூப்பர்கள்,’ ‘கோத்திரங்கள்,’ ‘உடன்படிக்கைப் பெட்டி,’ ‘யாவே,’ ‘சீயோன்’ ஆகியவை பொருத்தமானவை. לִבְנֵי יִשְׂרָאֵל என்பதன் கூட்டுப்பொருளான ‘இஸ்ரவேல் மக்கள்’ முதன்மை உரையில் ஏற்கத்தக்கது; நேரடிக் குடும்பச் சொல்லாக்கம் அடிக்குறிப்பில் தக்கவாறு குறிக்கப்பட்டுள்ளது.
