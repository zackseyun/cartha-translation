  text: בַּ/יּ֤וֹם הַ/שְּׁמִינִי֙ שִׁלַּ֣ח אֶת הָ/עָ֔ם וַֽ/יְבָרֲכ֖וּ אֶת הַ/מֶּ֑לֶךְ וַ/יֵּלְכ֣וּ לְ/אָהֳלֵי/הֶ֗ם שְׂמֵחִים֙ וְ/ט֣וֹבֵי לֵ֔ב עַ֣ל כָּל הַ/טּוֹבָ֗ה אֲשֶׁ֨ר עָשָׂ֤ה יְהוָה֙ לְ/דָוִ֣ד עַבְדּ֔/וֹ וּ/לְ/יִשְׂרָאֵ֖ל עַמּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/066.yaml
  text: On the eighth day he sent the people away[a], and they blessed the king and went to their tents, rejoicing and glad of heart because of all the good that Yahweh had done for David his servant and for Israel his people.
translation:
  language: ta
  text: எட்டாம் நாளில் அவர் மக்களை அனுப்பிவைத்தார். அவர்கள் அரசனுக்கு நல்வாழ்த்து கூறி, யாவே தம் பணியாளனாகிய தாவீதுக்கும் தம் மக்களாகிய இஸ்ரவேலுக்கும் செய்த எல்லா நன்மைகளினால் மகிழ்ச்சியுடனும் மனம் களித்தும் தங்கள் கூடாரங்களுக்குச்[a] சென்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தங்கள் வீடுகளுக்குச்’; சொல்லுக்குச் சொல், ‘தங்கள் கூடாரங்களுக்குச்.’
    reason: לְאָהֳלֵיהֶם என்பதன் நேரடிப் பொருளான ‘கூடாரங்கள்’ முதன்மை உரையில் தக்கவைக்கப்பட்டுள்ளது; சூழலுக்கேற்ற ‘வீடுகள்’ என்ற பொருள் மாற்றாகக் குறிக்கப்படுகிறது.
lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: எட்டாம் நாளில்
  rationale: விழாவின் எட்டாம் நாள் என்பது சூழலில் தெளிவானாலும், ‘விழாவின்’ என்பது இவ்வசனத்தில் வெளிப்படையாக இல்லாததால் சேர்க்கப்படவில்லை.
- source_word: שִׁלַּח אֶת הָעָם
  choice: மக்களை அனுப்பிவைத்தார்
  rationale: புறப்பட்டுச் செல்ல மக்களுக்கு விடைகொடுத்து அனுப்பிய செயலை இயல்பான தமிழில் causative நுணுக்கத்துடன் தெரிவிக்கிறது.
- source_word: וַיְבָרֲכוּ אֶת הַמֶּלֶךְ
  choice: அரசனை வாழ்த்திவிட்டு
  rationale: ברך என்பதன் ‘ஆசீர்வதித்தல்/நல்வாழ்த்து கூறுதல்’ பொருளைத் தக்கவைத்தபடி, பிரிவுச் சூழலுக்கு ஏற்ற இயல்பான தமிழை வழங்குகிறது.
- source_word: לְאָהֳלֵיהֶם
  choice: தங்கள் கூடாரங்களுக்கு
  rationale: எபிரெயச் சொல்லின் நேரடிப் படிமமான ‘கூடாரங்கள்’ முதன்மை உரையில் தக்கவைக்கப்படுகிறது; ‘வீடுகள்’ என்ற வழக்குப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: שְׂמֵחִים וְטוֹבֵי לֵב
  choice: மகிழ்ச்சியோடும் மனநிறைவோடும்
  rationale: வெளிப்படும் மகிழ்ச்சியையும் உள்ளார்ந்த இதய மகிழ்வையும் இயல்பான நவீன தமிழில் வேறுபடுத்திக் காட்டுகிறது.
- source_word: עַל כָּל הַטּוֹבָה
  choice: செய்த எல்லா நன்மைகளுக்காக
  rationale: அவர்களுடைய மகிழ்ச்சிக்கான காரணத்தைச் சுட்டுகிறது; நற்செயல்கள் மற்றும் கிடைத்த நலன்கள் ஆகிய இரண்டையும் உள்ளடக்கும்.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: לְדָוִד עַבְדּוֹ
  choice: தம் பணியாளனான தாவீதுக்கும்
  rationale: அரச-உடன்படிக்கைச் சூழலில் עבד குறிக்கும் இறைப்பணியாளருடைய உறவைச் சொல்கிறது; ‘அடிமை’ என்பதால் உருவாகக்கூடிய தேவையற்ற நவீன உடைமை நுணுக்கத்தைத் தவிர்க்கிறது.
- source_word: וּלְיִשְׂרָאֵל עַמּוֹ
  choice: தம் மக்களான இஸ்ரவேலுக்கும்
  rationale: இஸ்ரவேல் யாவேக்குரிய மக்கள் என்ற உடன்படிக்கை சார்ந்த அடையாளத்தை நேரடியாகத் தக்கவைக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக இருப்பதால், அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: தாவீதுக்குச் செய்த நன்மை என்ற மொழிநடை
  choice: தம் பணியாளனான தாவீதுக்கும் ... செய்த
  alternative: தாவீதின் பொருட்டுச் செய்த
  rationale: לְ என்பதன் பயனாளிப் பொருளை நேரடியாகக் காக்கிறது; தாவீதின் காலத்திற்குப் பிந்தைய நிறைவேற்றங்களையும் முன்கூட்டியே சுருக்கித் தீர்மானிப்பதில்லை.
