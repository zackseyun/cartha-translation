  register: நவீன நிலையான, மரியாதைமிக்க தமிழ். எபிரெய இதய-மகிழ்ச்சி மொழிநடையை சொற்சொல்லாகக் கடினப்படுத்தாமல் ‘மனநிறைவு’ என இயல்பாக்குகிறது; கூடாரப் படிமத்தையும் யாவே என்ற தனிப்பெயரையும் தக்கவைக்கிறது.
