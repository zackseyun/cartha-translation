  text: Then the king turned around and blessed all the assembly of Israel[b][a], while all the assembly of Israel was standing.
translation:
  language: ta
  text: பின்பு அரசன் திரும்பி, இஸ்ரவேலின் சபை முழுவதையும்[a] ஆசீர்வதித்தான்; இஸ்ரவேலின் சபை முழுவதும் நின்றுகொண்டிருந்தது.
