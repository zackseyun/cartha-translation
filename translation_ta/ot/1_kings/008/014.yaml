lexical_decisions:
- source_word: וַיַּסֵּב ... אֶת־פָּנָיו
  choice: திரும்பி
  rationale: எபிரெய மொழியில் சொல்லர்த்தமாக ‘தன் முகத்தைத் திருப்பி’ என்று இருந்தாலும், தமிழில் உடலின் திசைமாற்றத்தை இயல்பாகத் தெரிவிக்க ‘திரும்பி’ போதுமானது; சொல்லர்த்த வடிவம் தேவையற்ற கடினத்தன்மையைத் தரும்.
- source_word: וַיְבָרֶךְ
  choice: ஆசீர்வதித்தான்
  rationale: இந்த அரச-பொதுக் கூடுகைச் சூழலில் ברך என்பதன் வழக்கமான பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது; வாய்மொழி ஆசீருரை கூறியதையும் உள்ளடக்க முடியும்.
- source_word: כָּל־קְהַל יִשְׂרָאֵל
  choice: இஸ்ரவேலின் சபையார் அனைவரையும்
  rationale: קהל என்பது கூடிவந்த மக்களின் ஒட்டுமொத்தச் சபையைக் குறிக்கிறது. ‘சபையார் அனைவரும்’ என்பது தமிழில் அந்தக் கூட்டு மக்களையும் அவர்களின் முழுமையையும் இயல்பாகக் காட்டுகிறது.
- source_word: וְכָל־קְהַל יִשְׂרָאֵל עֹמֵד
  choice: அப்போது இஸ்ரவேலின் சபையார் அனைவரும் நின்றுகொண்டிருந்தார்கள்
  rationale: வினையெச்சத் தன்மையுள்ள עֹמֵד பின்னணி நிலையில் தொடர்ந்துகொண்டிருந்த உடல் நிலையைச் சுட்டுகிறது; ‘நின்றுகொண்டிருந்தார்கள்’ அதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
