source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר בָּר֤וּךְ יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁר֙ דִּבֶּ֣ר בְּ/פִ֔י/ו אֵ֖ת דָּוִ֣ד אָבִ֑/י וּ/בְ/יָד֥/וֹ מִלֵּ֖א לֵ/אמֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/015.yaml
  text: And he said[a], “Blessed be Yahweh, the God of Israel, who spoke with his mouth to David my father and has fulfilled it with his hand, saying,”
translation:
  language: ta
  text: 'அவர் கூறினார்: “இஸ்ரவேலின் கடவுளாகிய யாவே போற்றப்படுவாராக![a] அவர் தம் வாயால் என் தந்தை தாவீதிடம் கூறியதைத் தம் கையால் நிறைவேற்றினார்; அவர் கூறியதாவது:”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவே ஆசீர்வதிக்கப்பட்டவராக இருப்பாராக.” எபிரெய ஆசீர்வாதச் சூத்திரம் பாரம்பரியமாக இவ்வாறு மொழிபெயர்க்கப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: போற்றப்படுவாராக
  rationale: எபிரெய ஆசீர்வாத வாழ்த்துச் சூத்திரத்தை நவீனத் தமிழில் இயல்பாகவும் மாண்புடனும் தெரிவிக்கிறது; கடவுளைப் புகழும் பொருள் இங்கு முன்னிலையாகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: இறைப்பட்டமான ‘ஆண்டவர்’ என்பதற்குப் பதிலாக, எபிரெய வேதாகமத்தில் உள்ள தனிப்பட்ட இறைப்பெயரைத் தமிழில் வழக்கமான வடிவில் தருகிறது.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கடவுள்
  rationale: எபிரெய இணைப்புத் தொடரின் நேரான, இயல்பான தமிழ் வடிவம்.
- source_word: אֲשֶׁר דִּבֶּר בְּפִיו
  choice: அவர் தம் வாயால் ... சொன்னதை
  rationale: ‘வாயால்’ என்பதைத் தக்கவைத்து, அடுத்துள்ள ‘கையால்’ என்பதுடனான பேச்சு–செயல் இணைப்பைப் பாதுகாக்கிறது.
- source_word: אֵת דָּוִד אָבִי
  choice: என் தந்தை தாவீதிடம்
  rationale: דבר உடன் வரும் אֵת, உரையாடப்பட்ட நபரைக் குறிக்கிறது; ‘தாவீதிடம்’ என்பது இயல்பான தமிழ்.
- source_word: וּבְיָדוֹ מִלֵּא
  choice: தம் கையால் நிறைவேற்றினார்
  rationale: கடவுள் சொன்னதைச் செயலால் முடித்தார் என்ற உருவகத்தையும் ‘வாய்/கை’ இணைப்பையும் காக்கிறது.
- source_word: לֵאמֹר
  choice: 'அவர் சொன்னது:'
  rationale: அடுத்த வசனத்தில் தொடரும் நேர்கூற்றைத் தெளிவாக அறிமுகப்படுத்தும் இயல்பான தமிழ்.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: ஆண்டவர்; யாவே
  rationale: மூலத்தில் உள்ள நான்கு எழுத்து இறைப்பெயரை ஒரு பட்டத்தால் மாற்றாமல் தனிப்பெயராகக் காட்டுகிறது; தமிழ்க் கிறிஸ்தவச் சூழலில் அறியப்பட்ட ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
- issue: בָּרוּךְ என்ற ஆசீர்வாதச் சூத்திரம்
  choice: போற்றப்படுவாராக
  alternative: ஆசீர்வதிக்கப்பட்டவராக இருப்பாராக
  rationale: கடவுளைக் குறித்த இச்சூத்திரத்தின் செயல்பாட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது; சொல் வடிவை மட்டும் இயந்திரமாகப் பின்பற்றவில்லை.
translation_notes:
  register: நவீன தரத் தமிழ்; பொதுவாசகர்களுக்குப் புரியும் மாண்பான நடை. ‘தம் வாயால்/தம் கையால்’ என்ற மூல உருவக இணைப்பு திட்டமிட்டு பாதுகாக்கப்பட்டது. வசனம் அடுத்த நேர்கூற்றை அறிமுகப்படுத்துவதால் இறுதியில் முக்காற்புள்ளி இடப்பட்டது.
