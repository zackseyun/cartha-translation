base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/062.yaml
  text: And the king and all Israel with him were sacrificing sacrifices before Yahweh[a].
translation:
  language: ta
  text: அரசனும் அவனோடு இருந்த இஸ்ரவேல் மக்கள் அனைவரும் யாவேக்கு முன்பாகப் பலிகளைச் செலுத்திக்கொண்டிருந்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் சொல்லுக்கு நெருக்கமாக, “ஒரு பலியைப் பலியிட்டுக்கொண்டிருந்தார்கள்.” ஒரே வேரிலிருந்து வந்த வினையும் பெயர்ச்சொல்லும் இணைந்து பலியிடும் செயலை வலியுறுத்துகின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמֶּלֶךְ
  choice: அரசனும்
  rationale: வாவ் இணைப்பைத் தமிழில் இயல்பான ‘உம்’ விகுதியால் காட்டுகிறது; குறிப்பிட்ட அரசனைச் சுட்டும் எபிரெய வரையறைச் சுட்டும் சூழலில் தெளிவாக உள்ளது.
- source_word: וְכָל יִשְׂרָאֵל עִמּוֹ
  choice: அவனோடு இருந்த இஸ்ரவேல் மக்கள் அனைவரும்
  rationale: ‘இஸ்ரவேல்’ என்ற கூட்டு தேசியப் பெயரின் பொருளைப் பாதுகாத்தபடி, நவீனத் தமிழில் மனிதர்களைக் குறிக்க இயல்பாக ‘மக்கள் அனைவரும்’ என வழங்குகிறது; עִמּוֹ என்பது ‘அவனோடு இருந்த’ எனத் தெளிவாக்கப்படுகிறது.
- source_word: זֹבְחִים זֶבַח
  choice: பலிகளைச் செலுத்திக்கொண்டிருந்தார்கள்
  rationale: வினை-பெயர் ஒரே வேரிலிருந்து வரும் எபிரெயச் சொற்றொடர் பலியிடும் செயலை வலியுறுத்துகிறது. தொடர்ச்சியான பங்கேற்புவினையின் அம்சத்தை ‘செலுத்திக்கொண்டிருந்தார்கள்’ காக்கிறது; இயல்பான தமிழுக்காக எண்ணிக்கையைப் பன்மையாக வழங்குகிறது, சொல்லுக்கு நெருக்கமான வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לִפְנֵי
  choice: முன்பாக
  rationale: இங்கு வழிபாட்டு மற்றும் முன்னிலை சார்ந்த பொருளைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பாக வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் பட்டம் அல்ல, தனிப்பட்ட தெய்வீகப் பெயரே உள்ளது. ஆகவே அதைப் பட்டமாக மாற்றாமல் ‘Yahweh’ என்பதற்குரிய தமிழ் ஒலிபெயர்ப்பான ‘யாவே’ என்று வழங்கப்பட்டுள்ளது.
- issue: זֹבְחִים זֶבַח என்ற ஒரேவேர் வினை-பெயர்த் தொடரின் பொருள்
  choice: பலிகளைச் செலுத்திக்கொண்டிருந்தார்கள்
  alternative: ஒரு பலியைப் பலியிட்டுக்கொண்டிருந்தார்கள்
  rationale: எபிரெய வடிவத்தின் வலியுறுத்தலை மறைக்காமல் அடிக்குறிப்பில் சுட்டிக்காட்டி, முதன்மை உரையில் தமிழுக்கு இயல்பான பலியிடும் செயலைக் குறிப்பிடுகிறது. இது பலிகளின் வகையையோ எண்ணிக்கையையோ தேவையற்ற விதத்தில் இறையியல் சார்ந்து நிர்ணயிப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. தொடர்ச்சியான செயலை ‘செலுத்திக்கொண்டிருந்தார்கள்’ காட்டுகிறது; மூலத்தின் குறிப்பிடத்தக்க ஒரேவேர் சொற்றொடர் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
