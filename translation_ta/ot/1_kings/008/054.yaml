base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/054.yaml
  text: And when Solomon had finished praying to Yahweh with all this prayer and plea for favor[a], he rose from before the altar of Yahweh[b], from kneeling on his knees with his palms spread out toward heaven.
translation:
  language: ta
  text: சாலொமோன் யாவேயிடம் இந்த முழு ஜெபத்தையும் அருளுக்கான மன்றாட்டையும்[a] செய்து முடித்தபோது, யாவேயின் பலிபீடத்தின் முன்பாகத் தமது முழங்கால்களின்மேல் மண்டியிட்டு, தமது உள்ளங்கைகளை[b] வானத்தை நோக்கி விரித்திருந்த நிலையில் இருந்து அவர் எழுந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அருளுக்கான மன்றாட்டு’ என்பதற்குப் பதிலாக ‘இரக்கத்தை வேண்டிய விண்ணப்பம்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் அருள் அல்லது இரக்கத்தை நாடும் தீவிர வேண்டுதலைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெய மொழியில் குறிப்பாக ‘உள்ளங்கைகள்’ என்று உள்ளது; சில மொழிபெயர்ப்புகள் பொதுவாக ‘கைகள்’ என்று வழங்குகின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּכַלּוֹת
  choice: செய்து முடித்தபோது
  rationale: כְּ + infinitive construct இங்கு காலத்தைக் குறிக்கும் துணைவாக்கியத்தை அறிமுகப்படுத்துகிறது. எபிரெய மொழியின் ‘அப்போது நிகழ்ந்தது’ என்ற வடிவத்தைச் சொற்சொல்லாகப் பின்பற்றாமல், இயல்பான நவீன தமிழில் கால உறவு தெளிவாகக் கொடுக்கப்பட்டுள்ளது.
- source_word: לְהִתְפַּלֵּל אֶל־יְהוָה
  choice: யாவேயிடம் ... செய்து
  rationale: התפלל என்பதன் ‘ஜெபித்தல்’ என்ற பொருளும் אֶל என்பதன் நோக்குத் தொடர்பும் தமிழில் ‘யாவேயிடம் ... ஜெபம் செய்து’ என்ற அமைப்பில் இயல்பாக வெளிப்படுகின்றன.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநான்கெழுத்துப் பெயரான יהוה ஒரு பொதுப் பட்டமாக மாற்றப்படாமல், இறைவரின் தனிப்பெயராக ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: אֵת כָּל־הַתְּפִלָּה וְהַתְּחִנָּה הַזֹּאת
  choice: இந்த ஜெபம் முழுவதையும் அருளை வேண்டிய மன்றாட்டையும்
  rationale: תפלה என்பதற்கு ‘ஜெபம்’ என்றும், அருள் அல்லது இரக்கம் நாடும் தீவிர வேண்டுதலைக் குறிக்கும் תחנה என்பதற்கு ‘அருளை வேண்டிய மன்றாட்டு’ என்றும் வேறுபாடு பாதுகாக்கப்பட்டுள்ளது.
- source_word: קָם מִלִּפְנֵי מִזְבַּח יְהוָה
  choice: யாவேயின் பலிபீடத்தின் முன்னிலையிலிருந்து எழுந்தார்
  rationale: קם குறிக்கும் உடல்நிலை மாற்றம் ‘எழுந்தார்’ என்றும், מלפני என்பதன் இடவியல் பொருள் ‘முன்னிலையிலிருந்து’ என்றும் நேரடியாகப் பாதுகாக்கப்பட்டுள்ளன.
- source_word: מִכְּרֹעַ עַל־בִּרְכָּיו
  choice: தமது முழங்கால்களில் மண்டியிட்டு ... இருந்த நிலையிலிருந்து
  rationale: மூலத்தில் முழங்கால்கள் வெளிப்படையாகக் குறிப்பிடப்படுவதால், தமிழில் சுருக்கமாக ‘மண்டியிட்டிருந்தார்’ என்று மட்டும் சொல்லாமல் அந்த உடல் நிலை முழுமையாக வைக்கப்பட்டுள்ளது.
- source_word: וְכַפָּיו פְּרֻשׂוֹת הַשָּׁמָיִם
  choice: உள்ளங்கைகளை வானத்தை நோக்கி விரித்திருந்த
  rationale: כף என்பதன் குறிப்பான ‘உள்ளங்கை’ என்ற பொருள் பாதுகாக்கப்பட்டுள்ளது; השמים இங்கு ஜெப நிலையின் திசையைச் சுட்டுவதால் ‘வானத்தை நோக்கி’ என இயல்பாக மொழிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: יהוה என்ற இறைபெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலவசனம் இறைவரின் தனிப்பெயரான יהוה என்பதைப் பயன்படுத்துகிறது. அதை ஒரு பட்டத்தால் மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் தனிப்பெயர் தன்மையைப் பாதுகாக்கிறது.
- issue: תְּחִנָּה என்பதிலுள்ள அருள்/இரக்கம் நாடும் நுட்பம்
  choice: அருளை வேண்டிய மன்றாட்டு
  alternative: மன்றாட்டு
  rationale: பொதுவான வேண்டுதல் என்ற அளவில் சுருக்காமல், அருள் அல்லது இரக்கம் நாடும் ஆழ்ந்த விண்ணப்பம் என்ற சொல்லின் நுட்பம் வெளிப்படுத்தப்பட்டுள்ளது; அதேவேளை எந்தக் குறிப்பிட்ட சமயவியல் விளக்கமும் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் மரியாதைமிக்க நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் உடல் நிலை விவரங்கள் காக்கப்பட்டுள்ளன; நீண்ட எபிரெய வாக்கியத்தின் தொடர்புகளைத் தெளிவுபடுத்த தமிழ் சொல்வரிசை அளவோடு மாற்றப்பட்டுள்ளது.
