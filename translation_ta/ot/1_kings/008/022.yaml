    text: எபிரெயத்தில், “வானங்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: நின்று
  rationale: עמד என்ற வினை கதைத் தொடரில் எளிய இறந்தகாலச் செயலைக் குறிக்கிறது; தமிழில் அடுத்த செயலுடன் இயல்பாக இணைக்க வினையெச்சம் பயன்படுத்தப்பட்டது.
- source_word: לִפְנֵי מִזְבַּח יְהוָה
  choice: யாவேவின் பலிபீடத்திற்கு முன்
  rationale: לִפְנֵי என்பதன் இடஞ்சார்ந்த பொருளையும், construct தொடரான מִזְבַּח יְהוָה என்பதையும் நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான יהוה-வை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் தெளிவான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: נֶגֶד כָּל קְהַל יִשְׂרָאֵל
  choice: இஸ்ரவேலின் சபையார் அனைவருக்கும் முன்பாக
  rationale: נֶגֶד-இன் பொதுமக்கள் முன்னிலையிலான இடப்பொருளையும், קהל குறிக்கும் கூடிய சமூகத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וַיִּפְרֹשׂ כַּפָּיו
  choice: தன் கைகளை ... விரித்தார்
  rationale: פרשׂ உடன் כף வரும்போது ஜெபத்தில் கைகளை நீட்டி விரிக்கும் சைகையைக் குறிக்கிறது; 'கைகள்' என்பது 'உள்ளங்கைகள்' என்பதைக் காட்டிலும் தமிழில் இயல்பானது.
- source_word: הַשָּׁמָיִם
  choice: வானத்தை
  rationale: இங்கு ஜெபச் சைகையின் திசையைக் குறிக்கிறது. தமிழில் ஒருமை வடிவமான 'வானம்' இயல்பானது; மூலத்தின் வடிவியல் பன்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தனிப்பெயரே இருப்பதால், பட்டப்பெயரைப் பதிலிடாமல் covenant பெயரின் ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ஒரே வாக்கியத்தில் 'முன்' மீளினும், மூலத்தில் உள்ள לִפְנֵי மற்றும் נֶגֶד ஆகிய இரு இடச்சுட்டுகளின் வேறுபாடு பாதுகாக்கப்பட்டது.
