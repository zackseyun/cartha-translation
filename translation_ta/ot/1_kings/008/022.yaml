  text: Then Solomon stood before the altar of Yahweh in front of all the assembly of Israel and spread out his hands toward heaven[a].
translation:
  language: ta
  text: பின்பு சாலொமோன் யாவேவின் பலிபீடத்தின் முன், இஸ்ரவேலின் முழுச் சபைக்கு எதிரே நின்று, தன் கைகளை வானத்தை நோக்கி விரித்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
