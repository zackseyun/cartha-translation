  text: then hear in heaven their prayer and their plea[b][a], and uphold their cause.
translation:
  language: ta
  text: அப்போது பரலோகத்தில் அவர்களுடைய ஜெபத்தையும் மன்றாட்டையும் கேட்டு, அவர்களுக்கு நீதி வழங்குவீராக.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுடைய வழக்கை நிலைநாட்டுவீராக” அல்லது “அவர்களுக்கு நியாயம் செய்வீராக.” எபிரெயத்தில் சொற்பட, “அவர்களுடைய நீதி/தீர்ப்பைச் செய்வீராக.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַעְתָּ
  choice: அப்போது ... கேட்டு
  rationale: இணைப்புச்சொல் முந்தைய நிபந்தனைத் தொடரை முடிவுடன் இணைக்கிறது; ஜெபச் சூழலில் இரண்டாம் நபர் வினை வேண்டுகோளாக அமைகிறது. இயல்பான தமிழில் ‘அப்போது ... கேட்டு’ என வழங்கப்பட்டது.
- source_word: הַשָּׁמַיִם
  choice: பரலோகத்தில்
  rationale: எபிரெயத்தில் சொற்பட ‘வானங்கள்’; இவ்வழிபாட்டு ஜெபச் சூத்திரத்தில் தேவன் கேட்கும் இடத்தைக் குறிக்கும் இயல்பான தமிழாக ‘பரலோகத்தில்’ தேர்ந்தெடுக்கப்பட்டது. மூலத்தில் מִן இல்லாததால் ‘பரலோகத்திலிருந்து’ என மொழிபெயர்க்கப்படவில்லை.
- source_word: תְּפִלָּתָם
  choice: அவர்களுடைய ஜெபம்
  rationale: תְּפִלָּה என்பது பொதுவான ஜெபத்தைக் குறிக்கிறது; பன்மை உரிமை விகுதியுடன் உள்ள ஒருமை பெயர் தமிழிலும் கூட்டுப் பொருளில் இயல்பாக வழங்கப்படுகிறது.
- source_word: תְּחִנָּתָם
  choice: அவர்களுடைய மன்றாட்டு
  rationale: תְּחִנָּה அருள் அல்லது இரக்கத்தை நாடும் தீவிர வேண்டுதலைக் குறிக்கிறது. பொதுவான ‘ஜெபம்’ என்பதிலிருந்து இதன் வலிமையை வேறுபடுத்த ‘மன்றாட்டு’ பயன்படுத்தப்பட்டது.
- source_word: וְעָשִׂיתָ מִשְׁפָּטָם
  choice: அவர்களுக்கு நீதி வழங்கும்
  rationale: சொற்பட ‘அவர்களுடைய நீதி/தீர்ப்பைச் செய்’ என்ற நீதித்துறை மரபுத்தொடர். அவர்களுக்காக நியாயம் செய்து அவர்களுடைய வழக்கை நிலைநாட்டுதல் என்ற பொருளை இயல்பான தமிழில் ‘அவர்களுக்கு நீதி வழங்கும்’ எனத் தருகிறது.
theological_decisions:
- issue: தேவனிடம் செய்யப்படும் வேண்டுதலில் உள்ள நீதித்துறை மரபுத்தொடர்
  choice: அவர்களுக்கு நீதி வழங்கும்
  alternative: அவர்களுடைய வழக்கை நிலைநாட்டும்; அவர்களுக்கு நியாயம் செய்யும்
  rationale: עשה משפט என்பது ஒருவருக்காக நீதியை நிறைவேற்றுதல் அல்லது அவருடைய வழக்கை நிலைநாட்டுதல் என்று பொருள்படலாம். தேர்ந்தெடுக்கப்பட்ட மொழிபெயர்ப்பு ஒரு குறுகிய கோட்பாட்டு விளக்கத்தைச் சேர்க்காமல் தெய்வீக நீதிசெயலின் சட்டரீதியான பொருளைப் பேணுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான ஜெப நடையில் மொழிபெயர்க்கப்பட்டது. ‘ஜெபம்’ மற்றும் ‘மன்றாட்டு’ என்ற வேறுபாடு காக்கப்பட்டது; நீதித்துறை மரபுத்தொடரின் மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
