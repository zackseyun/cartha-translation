source:
  edition: WLC
  text: וְ/הָיָ֤ה לְבַבְ/כֶם֙ שָׁלֵ֔ם עִ֖ם יְהוָ֣ה אֱלֹהֵ֑י/נוּ לָ/לֶ֧כֶת בְּ/חֻקָּ֛י/ו וְ/לִ/שְׁמֹ֥ר מִצְוֺתָ֖י/ו כַּ/יּ֥וֹם הַ/זֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/061.yaml
  text: Let your heart therefore be wholly with Yahweh our God[a], to walk in his statutes and to keep his commandments[b], as at this day.
translation:
  language: ta
  text: ஆகவே, நம் கடவுளாகிய யாவேயோடு உங்கள் இதயம் முழுமையாக இருக்கட்டும்[a]; அவருடைய நியமங்களின்படி நடந்து, அவருடைய கட்டளைகளைக் கடைப்பிடியுங்கள்—இன்றைப்போலவே[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, “பிளவுபடாததாக”: “நம் கடவுளாகிய யாவேயோடு உங்கள் இதயம் பிளவுபடாததாக இருக்கட்டும்.”'
    reason: lexical_alternative
  - marker: b
    text: 'எபிரெய மரபுத்தொடர்: “இந்த நாளைப்போல.” தற்போதைய நாளில் காணப்படும் பற்றுறுதி அல்லது கீழ்ப்படிதலை அளவுகோலாக இது சுட்டுகிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: இருக்கட்டும்
  rationale: சூழலில் இது சாதாரண எதிர்காலக் கூற்றாக அல்லாமல் ஓர் அறிவுறுத்தல் அல்லது வேண்டுகோளாகச் செயல்படுகிறது; தமிழில் “இருக்கட்டும்” அந்த வலிமையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לְבַבְכֶם
  choice: உங்கள் இதயம்
  rationale: לֵבָב என்பது சிந்தனை, மனவுறுதி, விசுவாசம் ஆகியவற்றை உள்ளடக்கிய உள்ளார்ந்த மனிதனைச் சுட்டுகிறது. எபிரெய மொழியின் கூட்டுப்பொருளைத் தமிழிலும் ஒருமையான “இதயம்” இயல்பாகத் தக்கவைக்கிறது.
- source_word: שָׁלֵם
  choice: முழுமையாக
  rationale: உடன்படிக்கைச் சூழலில் இது குறையற்ற பாவமின்மையை அல்ல, முழுமையான அல்லது பிளவுபடாத பற்றுறுதியைக் குறிக்கிறது.
- source_word: עִם יְהוָה אֱלֹהֵינוּ
  choice: நம் கடவுளாகிய யாவேயோடு
  rationale: עִם என்பதன் “உடன்/ஓடு” என்ற உறவுசார் உருவகத்தைத் தக்கவைத்து, தெய்வீகப் பெயரை யாவே என்று ஒலிபெயர்க்கிறது.
- source_word: לָלֶכֶת בְּחֻקָּיו
  choice: அவருடைய நியமங்களின்படி நடந்து
  rationale: הלך என்பதன் “நடத்தல்” உருவகத்தைத் தக்கவைக்கிறது; அதேவேளை בְּ என்பதன் நடைமுறைப் பொருளைத் தமிழில் தெளிவாகக் காட்ட “நியமங்களின்படி” பயன்படுத்தப்பட்டுள்ளது.
- source_word: וְלִשְׁמֹר מִצְוֺתָיו
  choice: அவருடைய கட்டளைகளைக் கடைப்பிடியுங்கள்
  rationale: சட்ட மற்றும் உடன்படிக்கைச் சூழலில் שׁמר என்பது கட்டளைகளைக் காத்து நடைமுறைப்படுத்துவதைக் குறிக்கிறது; “கடைப்பிடியுங்கள்” நவீனத் தமிழில் இயல்பானது.
- source_word: כַּיּוֹם הַזֶּה
  choice: இன்று இருப்பதுபோலவே
  rationale: தற்போதைய நாளை அந்த அர்ப்பணிப்பின் மாதிரியாக அல்லது சாட்சியாகச் சுட்டும் எபிரெய மரபுத்தொடரை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் பட்டப்பெயர் அல்ல, நான்கெழுத்து உடன்படிக்கைப் பெயரே நேரடியாக வருகிறது; ஆகவே தனிப்பட்ட இறைப்பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது.
- issue: שָׁלֵם குறிக்கும் உடன்படிக்கை முழுமை
  choice: முழுமையாக
  alternative: பிளவுபடாமல்
  rationale: இது பாவமே இல்லாத பரிபூரண நிலையைத் திணிக்காமல், கடவுளிடம் முழுமையான மற்றும் பிளவுபடாத பற்றுறுதியைக் குறிக்கிறது. மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. “நடந்து” என்ற வேதாகம உருவகம் தக்கவைக்கப்பட்டாலும், “நியமங்களின்படி” என்பதால் அதன் ஒழுக்கவாழ்வு சார்ந்த பொருள் தெளிவாக்கப்பட்டுள்ளது. இறுதி வாக்கியம் அறிவுறுத்தலாக இயல்பாக ஒலிக்க வினைமுறை தமிழுக்கேற்ப அமைக்கப்பட்டுள்ளது.
