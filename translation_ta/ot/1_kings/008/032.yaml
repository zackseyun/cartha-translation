  text: then hear in heaven and act[a], and judge your servants, condemning the wicked by bringing his way upon his own head[c][b], and justifying the righteous by giving to him according to his righteousness.
translation:
  language: ta
  text: அப்போது நீர் வானத்தில் கேட்டு[a], செயல்பட்டு, உமது ஊழியர்களுக்கு நியாயந்தீர்ப்பீராக. பொல்லாதவனைக் குற்றவாளி என்று தீர்ப்பளித்து, அவனுடைய நடத்தையின் விளைவை அவன் தலைமேலேயே வரச்செய்வீராக[b]; நீதிமானை நீதிமான் என்று தீர்ப்பளித்து[c], அவனுடைய நீதிக்கு ஏற்ப அவனுக்குக் கொடுப்பீராக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வானத்திலிருந்து கேட்டு’ என்றும் மொழிபெயர்க்கலாம். எபிரெயத்தில் சொல்லுக்கு சொல் ‘வானத்தைக் கேட்டு’ என்று உள்ளது; இங்கு அது கடவுள் வானத்தில் அல்லது வானத்திலிருந்து கேட்பதைக் குறிக்கும் ஜெப வழக்கு.
    reason: lexical_alternative
  - marker: b
    text: ‘அவனுடைய நடத்தையின் விளைவை அவன் தலைமேல் வரச்செய்தல்’ என்பது, ஒருவனுடைய செயல்களுக்கு ஏற்ப அவனுக்கே திருப்பிச் செய்வதைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: cultural_note
  - marker: c
    text: ‘நீதிமான் குற்றமற்றவன் என்று தீர்ப்பளித்து’ அல்லது ‘நீதிமானுக்கு நீதி கிடைக்கச்செய்து’ என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: תִּשְׁמַע הַשָּׁמַיִם
  choice: வானத்தில் கேட்டு
  rationale: எபிரெயச் சொற்றொடரில் ‘வானம்’ இடத்தைக் குறிக்கும் விதத்தில் வருகிறது. ஜெபச் சூழலில் கடவுள் வானத்தில் இருந்து கேட்பதை இது இயல்பான தமிழில் தெரிவிக்கிறது; ‘வானத்திலிருந்து கேட்டு’ என்பதும் சாத்தியம்.
- source_word: וְעָשִׂיתָ
  choice: செயல்பட்டு
  rationale: עשה என்பது ‘செய்’ என்ற பரந்த பொருளுடையது. இங்கு கேட்டதற்குப் பதிலாகத் தலையிடுதலைக் குறிக்க ‘செயல்பட்டு’ என்பது இயல்பாகவும் சூழலுக்கு ஏற்றதாகவும் உள்ளது.
- source_word: וְשָׁפַטְתָּ אֶת עֲבָדֶיךָ
  choice: உமது ஊழியர்களுக்கு நியாயந்தீர்ப்பீராக
  rationale: שׁפט இங்கு வழக்கை விசாரித்துத் தீர்ப்பளிக்கும் நீதித்துறைச் செயலைக் குறிக்கிறது. அடுத்துள்ள இரு எதிர்மறைத் தீர்ப்புகளையும் முன்கூட்டியே ஒன்றாகக் கலக்காமல் இந்தத் தேர்வு காக்கிறது.
- source_word: לְהַרְשִׁיעַ רָשָׁע
  choice: பொல்லாதவனைக் குற்றவாளி என்று தீர்ப்பளித்து
  rationale: רשע என்பதன் ஹிஃபில் வடிவம் நீதிமன்றச் சூழலில் ஒருவரைக் குற்றவாளி என்று அறிவிப்பதைக் குறிக்கிறது. ‘தண்டித்து’ என்பது தீர்ப்பின் விளைவைக் கூடுதலாக முன்னிறுத்துவதால் தவிர்க்கப்பட்டது.
- source_word: לָתֵת דַּרְכּוֹ בְּרֹאשׁוֹ
  choice: அவனுடைய நடத்தையின் விளைவை அவன் தலைமேலேயே வரச்செய்து
  rationale: ‘அவனுடைய வழியை அவன் தலைமேல் கொடுத்தல்’ என்ற எபிரெய உருவகம், ஒருவனுடைய நடத்தைக்கேற்ப அதன் விளைவை அவனுக்கே திருப்பிக் கொடுப்பதைக் குறிக்கிறது. தமிழில் புரியும்படி ‘நடத்தையின் விளைவு’ எனத் தெளிவாக்கி, ‘தலைமேல்’ என்ற உருவகத்தைத் தக்கவைத்துள்ளது.
- source_word: וּלְהַצְדִּיק צַדִּיק
  choice: நீதிமானை நீதிமான் என்று தீர்ப்பளித்து
  rationale: צדק என்பதன் ஹிஃபில் வடிவம் இங்கு நீதித்துறை சார்ந்த அறிவிப்பைக் குறிக்கிறது. மூலத்தின் சொல் ஒத்திசைவையும், ‘குற்றவாளி என்று தீர்ப்பளித்து’ என்பதுடனான இணைப்பையும் இது காக்கிறது.
- source_word: לָתֶת לוֹ כְּצִדְקָתוֹ
  choice: அவனுடைய நீதிக்கு ஏற்ப அவனுக்குக் கொடுத்து
  rationale: மூலத்தில் உள்ள ‘கொடு’ மற்றும் ‘அவனுடைய நீதிக்கு ஏற்ப’ என்ற இரு கூறுகளையும் நேரடியாகக் காக்கிறது. ‘வெகுமதி அளித்து’ என்பது சாத்தியமான விளக்கம் என்றாலும் மூலத்தைவிட குறிப்பானது.
theological_decisions:
- issue: நீதித்துறை அறிவிப்பா அல்லது ஒழுக்க மாற்றமா
  choice: ‘குற்றவாளி என்று தீர்ப்பளித்து’ மற்றும் ‘நீதிமான் என்று தீர்ப்பளித்து’ என நீதிமன்றப் பொருளில் மொழிபெயர்க்கப்பட்டது.
  alternative: ‘பொல்லாதவனைத் தண்டித்து, நீதிமானுக்கு நீதி வழங்கி’
  rationale: சத்தியப்பிரமாணம் மற்றும் வழக்குத் தீர்ப்பு சார்ந்த சூழலில், לְהַרְשִׁיעַ மற்றும் לְהַצְדִּיק ஆகியவை முறையே குற்றவாளி என்றும் நீதிமான் என்றும் தீர்ப்பளிப்பதைக் குறிக்கின்றன. ஒழுக்க மாற்றம் என்ற கருத்தை வசனத்துக்குள் சேர்க்காமல் சட்டரீதியான இணைப்பைப் பாதுகாக்கிறது.
- issue: நீதிக்கு ஏற்ப கொடுத்தல் வெகுமதியைக் குறிக்கிறதா
  choice: ‘அவனுடைய நீதிக்கு ஏற்ப அவனுக்குக் கொடுப்பீராக’ என மூலத்தின் பொதுவான சொல்லாட்சி காக்கப்பட்டது.
  alternative: ‘அவனுடைய நீதிக்கேற்ப அவனுக்கு வெகுமதி அளிப்பீராக’
  rationale: ‘வெகுமதி’ என்பது சூழலில் பொருந்தக்கூடிய விளக்கம்; ஆனால் לָתֶת என்பது பொதுவாக ‘கொடு’ என்பதால், மூலத்தில் உள்ள திறந்த தன்மையைத் தக்கவைத்தோம்.
translation_notes:
  register: மரியாதைப் பன்மையான ‘நீர்/உமது’ மற்றும் ஜெபத்துக்குரிய ‘-வீராக’ வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. மொழிநடை நவீனத் தரத் தமிழாகவும், நீதிமன்றப் பொருள் தெளிவாகவும், எபிரெய உருவகம் தேவையான அளவு தக்கவைக்கப்பட்டதாகவும் உள்ளது.
