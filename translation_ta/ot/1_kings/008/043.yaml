base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/043.yaml
  text: may you hear in heaven[a], the place where you dwell, and do according to all that the foreigner calls to you for, so that all the peoples of the earth may know your name, to fear you as your people Israel do[b], and to know that your name is called on this house that I have built.
translation:
  language: ta
  text: உமது வாசஸ்தலமாகிய பரலோகத்தில் கேட்டருளி, அந்த வெளிநாட்டவர் உம்மை நோக்கி வேண்டிக்கொள்கிற[a] எல்லாவற்றின்படியும் செய்தருளும். அதனால் பூமியிலுள்ள எல்லா மக்களினங்களும் உமது பெயரை அறியவும், உமது மக்களாகிய இஸ்ரவேலரைப்போல் உமக்குப் பயப்படவும், நான் கட்டிய இந்த ஆலயம் உமது பெயரால் அழைக்கப்படுகிறது[b] என்பதை அறியவும் செய்வார்களாக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உம்மை நோக்கிக் கூப்பிடுவது” அல்லது “உம்மிடம் கதறிக் கேட்பது” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: நேர்ச்சொல்லாக, “உமது பெயர் இந்த ஆலயத்தின்மேல் அழைக்கப்படுகிறது.” இது அந்த ஆலயம் உமக்குரியது அல்லது உமது பெயரைத் தாங்குகிறது என்று பொருள்படும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁמַע
  choice: கேட்டு
  rationale: இது வடிவத்தில் இறந்தகாலமல்லாத வினையாக இருந்தாலும், சாலொமோனின் வேண்டுதலில் விண்ணப்பப் பொருளைக் கொண்டுள்ளது. தொடரும் ‘செய்யும்’ என்பதுடன் இணைந்து, தமிழில் மரியாதையுடனான வேண்டுதலாக இயல்பாக ஒலிக்கிறது.
- source_word: הַשָּׁמַיִם מְכוֹן שִׁבְתֶּךָ
  choice: பரலோகத்தில், நீர் குடியிருக்கும் இடத்தில்
  rationale: தேவன் குடியிருக்கும் பரலோக இருப்பிடத்தைச் சுட்டும் இணைப்பைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: וְעָשִׂיתָ כְּכֹל אֲשֶׁר
  choice: அனைத்தின்படியும் செய்யும்
  rationale: தேவன் விண்ணப்பத்துக்கு எவ்வாறு பதிலளிப்பார் என்பதை வரையறுக்காமல், எபிரெயச் சொற்றொடரின் விரிவான பொருளைக் காக்கிறது.
- source_word: יִקְרָא אֵלֶיךָ
  choice: உம்மிடம் கூப்பிட்டுக் கேட்பது
  rationale: קרא אל என்பதிலுள்ள அழைத்தல் அல்லது மன்றாடுதல் என்ற பொருளையும், சூழலில் உள்ள கோரிக்கையையும் வெளிப்படுத்துகிறது; ‘ஜெபிப்பது’ என்று மட்டும் சுருக்கவில்லை.
- source_word: הַנָּכְרִי
  choice: அந்த அந்நியன்
  rationale: இஸ்ரவேல் மக்களைச் சாராத வேறு மக்கள் இனத்தைச் சேர்ந்த நபரை இச்சொல் குறிக்கிறது; நவீன தமிழில் ‘அந்நியன்’ இவ்வேறுபாட்டைச் சுருக்கமாகத் தருகிறது.
- source_word: כָּל עַמֵּי הָאָרֶץ
  choice: பூமியின் எல்லா மக்களினங்களும்
  rationale: עמים என்பதன் பன்முக மக்கள் குழுக்கள் என்ற நுணுக்கத்தையும், הארץ என்பதன் உலகளாவிய நோக்கத்தையும் காக்கிறது.
- source_word: לְיִרְאָה אֹתְךָ
  choice: உமக்குப் பயப்படவும்
  rationale: அச்சம், பயபக்தி, மரியாதை ஆகியவற்றை உள்ளடக்கும் எபிரெய இறையியல் பதற்றத்தை ‘பயப்படுதல்’ காக்கிறது.
- source_word: שִׁמְךָ נִקְרָא עַל הַבַּיִת הַזֶּה
  choice: இந்த ஆலயம் உமது பெயரால் அழைக்கப்படுகிறது
  rationale: சொல்லுக்குச் சொல் அமைப்பைத் தமிழில் செயற்கையாக மாற்றாமல், ஆலயம் தேவனுடைய பெயரைத் தாங்குகிறது மற்றும் அவருக்குரியது என்ற எபிரெய மரபுத்தொடரின் கருத்தை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יִרְאָה என்பதில் பயமும் பயபக்தியும் இணைந்திருத்தல்
  choice: உமக்குப் பயப்படவும்
  alternative: உம்மைப் பயபக்தியுடன் போற்றவும்
  rationale: மென்மையாக்கப்பட்ட மாற்று, மூலத்தின் ‘பயம்’ என்ற உண்மையான கூறை மறைக்கக்கூடும். பிரதான உரை அந்த இறையியல் பதற்றத்தைக் காக்கிறது.
- issue: தேவனுடைய பெயர் ஆலயத்தின்மேல் அழைக்கப்படுதல் என்ற மரபுத்தொடர்
  choice: இந்த ஆலயம் உமது பெயரால் அழைக்கப்படுகிறது
  alternative: உமது பெயர் இந்த ஆலயத்தின்மேல் அழைக்கப்படுகிறது
  rationale: மாற்று சொல்லுக்குச் சொல் நெருக்கமாயினும் நவீன தமிழில் தெளிவற்றது. தேர்ந்த வடிவம் தேவனுடைய உரிமை மற்றும் தொடர்பைக் குறிக்கும் மரபுத்தொடரை இயல்பாகத் தருகிறது; அடிக்குறிப்பு அதன் நேரடி வடிவத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன செந்தமிழ் நடையில், ஜெபத்திற்குரிய கண்ணியமான ‘நீர்/உமது/உமக்கு’ வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. ‘ஆலயம்,’ ‘மக்களினங்கள்,’ ‘பயப்படுதல்’ ஆகிய சொற்கள் சாதாரண வாசகர்களுக்குப் புரியுமாறும் வேதாகமச் செறிவைத் தக்கவைத்தும் தேர்ந்தெடுக்கப்பட்டன.
