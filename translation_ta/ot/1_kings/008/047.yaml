  text: and if they come to their senses in the land where they were taken captive, and return and plead with you in the land of those who took them captive, saying, ‘We have sinned and acted perversely; we have acted wickedly,’
translation:
  language: ta
  text: அவர்கள் சிறைபிடித்துச் செல்லப்பட்ட நாட்டில் தங்கள் மனதில் உணர்ந்து, திரும்பி, தங்களைச் சிறைபிடித்தவர்களின் நாட்டில் உம்மை நோக்கி மன்றாடி, ‘நாங்கள் பாவம் செய்தோம்; நெறிதவறி நடந்தோம்; தீமை செய்தோம்’ என்று சொன்னால்,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֵשִׁיבוּ אֶל־לִבָּם
  choice: தங்கள் நிலையை உணர்ந்து
  rationale: எபிரேய மரபுத்தொடரின் நேரடிப் பொருள் ‘தங்கள் இதயத்திற்குத் திரும்பச் செய்தல்’; இச்சூழலில் சிறையிருப்பின் காரணத்தையும் தங்கள் குற்றத்தையும் மனத்தில் உணர்வதைக் குறிக்கும் இயல்பான தமிழ்.
- source_word: וְשָׁבוּ
  choice: உம்மிடம் திரும்பி
  rationale: שׁוב என்பதன் அடிப்படைப் பொருளான ‘திரும்புதல்’ பாதுகாக்கப்படுகிறது; ‘மனந்திரும்புதல்’ என்று மட்டும் மொழிபெயர்த்து அதன் திசைசார் உருவகத்தையும் இறையியல் திறந்தநிலையையும் சுருக்கவில்லை.
- source_word: וְהִתְחַנְּנוּ אֵלֶיךָ
  choice: உம்மை நோக்கி மன்றாடி
  rationale: חנן என்பதன் இத்பஅேல் வடிவம் இரக்கத்தை நாடி வேண்டுவதைக் குறிக்கிறது; ‘மன்றாடி’ அதன் பணிவான வேண்டுதலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: חָטָאנוּ
  choice: நாங்கள் பாவம் செய்தோம்
  rationale: חטא என்பதற்கான வழக்கமான, தெளிவான ஒப்புதல் மொழி.
- source_word: וְהֶעֱוִינוּ
  choice: நெறிதவறி நடந்தோம்
  rationale: עוה வளைதல், நேர்மையிலிருந்து பிறழ்தல், குற்றமாக நடத்தல் ஆகிய உணர்வுகளைத் தருகிறது; அடுத்துள்ள ‘பொல்லாப்பு செய்தோம்’ என்பதிலிருந்து வேறுபாடு காக்கப்படுகிறது.
- source_word: רָשָׁעְנוּ
  choice: பொல்லாப்பு செய்தோம்
  rationale: רשׁע குற்றமுள்ள அல்லது தீய நடத்தையைச் சுட்டுகிறது; மூன்று படியான பாவ ஒப்புதலின் உச்சத் தீவிரத்தைத் தக்கவைக்கிறது.
theological_decisions:
- issue: וְשָׁבוּ என்பதன் இறையியல் நிறம்
  choice: உம்மிடம் திரும்பி
  alternative: மனந்திரும்பி
  rationale: மூலத்தில் உள்ள பொதுவான ‘திரும்பு’ என்ற வினையையும் அதன் இறைநோக்கிய திசையையும் பாதுகாக்கிறது; குறிப்பிட்ட இறையியல் தொழில்நுட்பச் சொல்லைத் திணிப்பதில்லை.
- issue: மூன்று பாவ ஒப்புதல் வினைகளின் வேறுபாடு
  choice: பாவம் செய்தோம்; நெறிதவறி நடந்தோம்; பொல்லாப்பு செய்தோம்
  alternative: நாங்கள் பாவம் செய்து தீமை செய்தோம்
  rationale: חטא, עוה, רשע ஆகிய மூன்று வேறுபட்ட சொற்களின் ஒத்திசைவையும் தீவிர முன்னேற்றத்தையும் சுருக்காமல் காக்கிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழ்; அரசனின் ஜெபச் சூழலுக்கேற்ற கண்ணியமான ‘உம்மிடம்/உம்மை’ வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. வசனம் அடுத்த வசனத்துடன் தொடரும் நிபந்தனைத் தொடராக இருப்பதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
