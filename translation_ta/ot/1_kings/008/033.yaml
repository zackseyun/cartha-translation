- issue: וְהוֹדוּ אֶת שְׁמֶךָ என்பதன் பல்பொருள் தன்மை
  choice: உமது பெயரை அறிக்கையிட்டு
  alternative: உமது பெயரைப் புகழ்ந்து / உமது பெயருக்கு நன்றி செலுத்தி
  rationale: பாவத்திற்குப் பின் தேவனிடம் திரும்பும் சூழலில் ‘அறிக்கையிடுதல்’ பொருத்தமானது. இருப்பினும் ידה புகழ்தல் அல்லது நன்றி செலுத்துதல் என்றும் பொருள்படக்கூடும் என்பதால் அந்தத் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ஒருமைத் தெய்வமுகப்பு மரியாதை வடிவமான ‘உமது/உம்மிடம்’ பயன்படுத்தப்பட்டுள்ளது. வசனம் அடுத்த வசனத்தில் நிறைவடையும் நிபந்தனை வாக்கியத்தின் தொடக்கம் என்பதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
