  - marker: a
    text: அல்லது, “உமது பெயரைப் புகழ்ந்து” அல்லது “உமது பெயருக்கு நன்றி செலுத்தி.” எபிரெய வினைச்சொல் சூழலுக்கேற்ப அறிக்கையிடுதல், புகழ்தல், நன்றி செலுத்துதல் ஆகிய பொருள்களைக் கொள்ளலாம்.
