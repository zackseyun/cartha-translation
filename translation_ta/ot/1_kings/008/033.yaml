  text: When your people Israel are struck down before an enemy because they have sinned against you[a], and they turn back to you and confess your name and pray and plead with you in this house,
translation:
  language: ta
  text: உமது மக்களான இஸ்ரவேலர் உமக்கு எதிராகப் பாவம் செய்ததால் எதிரியின் முன்னிலையில் தோற்கடிக்கப்படும்போது, அவர்கள் உம்மிடம் திரும்பி, உமது பெயரை அறிக்கையிட்டு[a], இந்த இல்லத்தில் உம்மை நோக்கி வேண்டி, உம்மிடம் இரந்து மன்றாடினால்,
  philosophy: optimal-equivalence
