  text: When your people go out to battle against their enemy by the way you send them[a], and they pray to Yahweh toward the city that you have chosen and the house that I have built for your name[b],
translation:
  language: ta
  text: உமது மக்கள், நீர் அவர்களை அனுப்பும் வழியில் தங்கள் பகைவனுக்கு எதிராகப் போருக்குப் புறப்பட்டுச் சென்று, நீர் தேர்ந்தெடுத்த நகரத்தை நோக்கியும்[a] உமது பெயருக்காக நான் கட்டிய இல்லத்தை[b] நோக்கியும் யாவேவிடம் மன்றாடினால்,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: ‘நகரத்தின் வழி/திசை’; ஜெபிக்கும்போது நகரத்தை நோக்கியிருப்பதை இது குறிக்கிறது.'
    reason: lexical_alternative
  - marker: b
    text: அதாவது, ஆலயம்; எபிரெயத்தில் ‘இல்லம்’.
    reason: lexical_alternative
lexical_decisions:
