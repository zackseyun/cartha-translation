- source_word: יֵצֵא עַמְּךָ לַמִּלְחָמָה
  choice: உமது மக்கள் … போருக்குப் புறப்பட்டுச் சென்று
  rationale: יֵצֵא என்பதன் அடிப்படைப் பொருளான ‘புறப்படுதல்’ என்பதையும் இராணுவச் சூழலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: עַל אֹיְבוֹ
  choice: தங்கள் பகைவனுக்கு எதிராக
  rationale: ‘மக்கள்’ என்பது கூட்டுப்பெயர்; எபிரெயத்தில் பகைவன் ஒருமையில் இருந்தாலும், தமிழில் கூட்டுப்பொருளோடு பொருந்த ‘தங்கள்’ பயன்படுத்தப்பட்டது.
- source_word: בַּדֶּרֶךְ אֲשֶׁר תִּשְׁלָחֵם
  choice: நீர் அவர்களை அனுப்பும் வழியில்
  rationale: דֶּרֶךְ என்பதன் ‘வழி’ என்ற உருவகத்தைப் பாதுகாத்து, கடவுள் அனுப்பும் படையெடுப்புப் பாதையைக் குறிக்கிறது.
- source_word: וְהִתְפַּלְלוּ אֶל יְהוָה
  choice: யாவேவிடம் மன்றாடினால்
  rationale: התפלל என்பது ‘மன்றாடு/வேண்டிக்கொள்’ எனும் வழக்கமான ஜெப வினை; אֶל என்பதன் நோக்கை ‘-விடம்’ காட்டுகிறது. יהוה தனிப்பெயராக ‘யாவே’ என ஒலிபெயர்க்கப்பட்டது.
- source_word: דֶּרֶךְ הָעִיר
  choice: நகரத்தை நோக்கி
  rationale: இங்கு דֶּרֶךְ ஜெபத்தின் திசைநோக்கைக் குறிக்கிறது; ‘நோக்கி’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: הָעִיר אֲשֶׁר בָּחַרְתָּ בָּהּ
  choice: நீர் தேர்ந்தெடுத்த நகரம்
  rationale: மூலத்தில் உள்ள எளிய ‘நீர் தேர்ந்தெடுத்த நகரம்’ என்ற கூற்றையே வைத்துள்ளது; இவ்வாக்கியத்தில் இல்லாத மேலதிக நோக்கம் சேர்க்கப்படவில்லை.
- source_word: וְהַבַּיִת
  choice: இல்லம்
  rationale: בַּיִת என்பதன் நேரடிப் பொருளான ‘வீடு/இல்லம்’ என்பதைக் காத்து, ஆலயத்தைக் குறிக்கும் வேதாகமச் சொல்லாட்சிக்கு ஏற்ற கண்ணியமான ‘இல்லம்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: אֲשֶׁר בָּנִתִי לִשְׁמֶךָ
  choice: உமது பெயருக்காக நான் கட்டிய
  rationale: ‘பெயருக்காக’ என்ற முக்கியமான வேதாகமத் தொடர்பை விளக்கவுரையாக மாற்றாமல் அப்படியே பாதுகாக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூல உரையில் பட்டப்பெயர் அல்ல, நான்கெழுத்து இறைத்திருப்பெயர் நேரடியாக உள்ளது; எனவே தனிப்பெயராக ஒலிபெயர்க்கப்பட்டது.
- issue: הַבַּיִת என்பதற்கான ஆலயச் சொல்லாட்சி
  choice: இல்லம்
  alternative: ஆலயம்
  rationale: குறிப்பிடப்படுவது ஆலயமே என்றாலும், எபிரெயம் ‘இல்லம்’ என்று கூறுகிறது. ‘உமது பெயருக்காக … கட்டிய இல்லம்’ என்ற மூலச் சொல்லாட்சியைப் பாதுகாக்க இத்தேர்வு செய்யப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான ஜெப நடையைப் பேணுகிறது. ‘உமது/நீர்’ மரியாதை ஒருமையாகவும், மக்கள் என்பதற்கு ‘தங்கள்’ கூட்டுச் சுட்டாகவும் பயன்படுத்தப்பட்டுள்ளன. வசனம் தொடரும் நிபந்தனை வாக்கியமாக இருப்பதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
