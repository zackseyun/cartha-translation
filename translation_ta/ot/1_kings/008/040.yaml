id: 1KI.8.40
reference: 1 Kings 8:40
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: לְמַ֨עַן֙ יִֽרָא֔וּ/ךָ כָּל הַ֨/יָּמִ֔ים אֲשֶׁר הֵ֥ם חַיִּ֖ים עַל פְּנֵ֣י הָ/אֲדָמָ֑ה אֲשֶׁ֥ר נָתַ֖תָּה לַ/אֲבֹתֵֽי/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/040.yaml
  text: so that they may fear you all the days that they live on the face of the land that you gave to our fathers[a][b][c].
translation:
  language: ta
  text: நீர் எங்கள் தந்தையருக்குக்[c] கொடுத்த நாட்டில்[a] அவர்கள் உயிரோடிருக்கும் காலமெல்லாம்[b] உமக்கு அஞ்சும்படியாக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பூமியில்.” எபிரெய மரபுத்தொடரை “பூமியின் முகத்தின்மேல்” என்றும் மொழிபெயர்க்கலாம்; ஆனால் இங்கு முன்னோர்களுக்குக் கொடுக்கப்பட்டதைக் குறிப்பிடுவதால் “நாடு” என்பது சூழலுக்கு ஏற்றது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவர்கள் வாழும் நாளெல்லாம்.”
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “எங்கள் முன்னோருக்குக்.” எபிரெயில், “எங்கள் தந்தையருக்குக்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: …அஞ்சும்படியாக
  rationale: சாலொமோனின் வேண்டுதலில் உள்ள நோக்கம் அல்லது விளைவைக் காட்டும் எபிரெயச் சொல்லை, இயல்பான தமிழில் ‘-ம்படியாக’ என்ற நோக்கத் தொடரால் வெளிப்படுத்துகிறது.
- source_word: יִרָאוּךָ
  choice: உமக்கு அஞ்ச
  rationale: இறைவனை நோக்கிய பயபக்தி, மரியாதை, கீழ்ப்படிதல் ஆகிய நிறைகளை உடைய ירא என்ற சொல்லின் வலிமையை ‘அஞ்ச’ காக்கிறது; ‘மதிக்க’ என்பது அதன் பொருளை அளவுக்கு மீறி மென்மையாக்கும்.
- source_word: כָּל הַיָּמִים אֲשֶׁר הֵם חַיִּים
  choice: அவர்கள் உயிரோடிருக்கும் காலமெல்லாம்
  rationale: ‘அவர்கள் வாழ்கிற எல்லா நாட்களும்’ என்ற எபிரெயக் காலக் கருத்தை நவீனத் தமிழில் இயல்பாகவும் முழு வாழ்நாள் நீட்சியையும் காக்கும் வகையிலும் தருகிறது.
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: நாட்டில்
  rationale: சொல்லுக்கு நெருக்கமாக ‘நிலத்தின் முகத்தின்மேல்’ என்று இருந்தாலும், அடுத்த உறவுத்தொடர் அதை முற்பிதாக்களுக்குக் கொடுக்கப்பட்ட நாடாக வரையறுப்பதால் ‘நாட்டில்’ என்பது சூழலுக்கேற்ற இயல்பான தமிழ்.
- source_word: אֲשֶׁר נָתַתָּה
  choice: நீர் … கொடுத்த
  rationale: இஸ்ரவேலின் வரலாற்றில் நிறைவேறிய இறைக் கொடையைத் தெளிவான இறந்தகால வினையாக வழங்குகிறது.
- source_word: לַאֲבֹתֵינוּ
  choice: எங்கள் தந்தையருக்கு
  rationale: எபிரெயில் நேரடியாக உள்ள ‘எங்கள் தந்தையர்’ என்ற உடன்படிக்கை வரலாற்றுச் சொல்லாட்சியைப் பாதுகாக்கிறது; ‘முன்னோர்’ என்பது இயல்பான மாற்று.
theological_decisions:
- issue: இறைவனைச் சார்ந்த ירא என்பதன் பொருள்
  choice: உமக்கு அஞ்ச
  alternative: உம்மைப் பயபக்தியுடன் போற்ற
  rationale: ‘அஞ்ச’ என்பது வேதாகமத்தின் இறையச்சம் என்ற கருத்தின் வலிமையையும் அதன் பயபக்தி நிறையையும் திறந்தவாறு வைத்திருக்கிறது; அதை வெறும் மரியாதையாகக் குறைக்கவில்லை.
- issue: הָאֲדָמָה என்பதன் பரப்பு
  choice: நாடு
  alternative: பூமி
  rationale: ‘எங்கள் தந்தையருக்குக் கொடுத்த’ என்ற உடனடி வரையறை, இங்கு பொதுவாக முழுப் பூமியைவிட இஸ்ரவேலுக்குக் கொடுக்கப்பட்ட நாட்டையே குறிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், வேண்டுதலுக்குரிய கண்ணியமான ‘நீர்/உமக்கு’ நடையும் சாதாரண வாசகருக்குப் புரியும் இயல்பான சொற்றொடரும் பயன்படுத்தப்பட்டுள்ளன. தமிழ் வாக்கிய ஓட்டத்திற்காக இடத் தொடரை முன்னிலைப்படுத்தினாலும், எபிரெயின் நோக்கம், வாழ்நாள் நீட்சி, இறையச்சம் ஆகியவை காக்கப்பட்டுள்ளன.
