  yaml_path: translation/ot/1_kings/008/048.yaml
  text: and they return to you with all their heart and with all their soul in the land of their enemies who took them captive[a], and pray to you toward their land that you gave to their fathers, the city that you chose, and the house that I have built for your name[c][b],
translation:
  language: ta
  text: அவர்களைச் சிறைப்பிடித்த அவர்களுடைய பகைவர்களின் நாட்டில், அவர்கள் தங்கள் முழு இதயத்தோடும் முழு ஆத்துமாவோடும் உம்மிடம் திரும்பி[a], நீர் அவர்களுடைய முன்னோர்களுக்குக் கொடுத்த அவர்களுடைய நாட்டையும், நீர் தேர்ந்தெடுத்த நகரத்தையும், உமது பெயருக்கென்று நான் கட்டிய இல்லத்தையும்[c] நோக்கி[b] உம்மிடம் ஜெபித்தால்,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உம்மிடம் திரும்பி” என்பதை “உம்மிடம் மனந்திரும்பி” என்றும் பொருள்கொள்ளலாம்; இந்தச் சூழலில் இரு கருத்துகளும் இணைந்துள்ளன.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, அவர்களுடைய நாட்டின் திசையை நோக்கி ஜெபிப்பது. எபிரெயச் சொற்றொடர் ஜெபத்தின் உடல் திசையைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: இங்கு “இல்லம்” என்பது உமது பெயருக்கென்று அர்ப்பணிக்கப்பட்ட ஆலயத்தைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וְשָׁבוּ אֵלֶיךָ
  choice: உம்மிடம் திரும்பி
  rationale: שׁוּב என்பதன் அடிப்படைத் திசைசார் பொருளான ‘திரும்புதல்’ தக்கவைக்கப்படுகிறது; உடன்படிக்கைச் சூழலில் மனந்திரும்புதலையும் இது உணர்த்தலாம், ஆனால் அதை முதன்மை உரையில் வெளிப்படையாகச் சேர்க்கவில்லை.
- source_word: בְּכָל לְבָבָם וּבְכָל נַפְשָׁם
  choice: தங்கள் முழு இதயத்தோடும் முழு உயிரோடும்
  rationale: முழுமையான அர்ப்பணிப்பைச் சுட்டும் எபிரெய உருவகங்கள் தக்கவைக்கப்படுகின்றன. ‘ஆத்துமா’ என்ற சமயத் தொழில்நுட்பச் சொல்லைவிட נֶפֶשׁ என்பதற்கு இங்கு இயல்பான ‘உயிர்’ பயன்படுத்தப்படுகிறது.
- source_word: בְּאֶרֶץ אֹיְבֵיהֶם
  choice: அவர்களுடைய பகைவர்களின் நாட்டில்
  rationale: நாடு–நாடு என்ற நாடுகடத்தல் எதிரெதிர் அமைப்பைத் தக்கவைக்க אֶרֶץ ‘நாடு’ என மொழிபெயர்க்கப்படுகிறது.
- source_word: אֲשֶׁר שָׁבוּ אֹתָם
  choice: அவர்களைச் சிறைப்பிடித்த
  rationale: שׁבה வினையின் கட்டாயச் சிறையிருப்பு பொருளை இயல்பான நவீனத் தமிழில் நேரடியாகத் தெரிவிக்கிறது.
- source_word: וְהִתְפַּלְלוּ אֵלֶיךָ
  choice: உம்மிடம் மன்றாடினால்
  rationale: இது பெரிய நிபந்தனை வாக்கியத்தின் ஒரு பகுதியாக இருப்பதால் தமிழில் ‘மன்றாடினால்’ என்று இயல்பாக இணைக்கப்படுகிறது; אֵלֶיךָ என்பதன் நோக்கம் ‘உம்மிடம்’ எனத் தக்கவைக்கப்படுகிறது.
- source_word: דֶּרֶךְ אַרְצָם
  choice: அவர்களுடைய நாட்டை … நோக்கி
  rationale: דֶּרֶךְ இங்கு ஜெபிக்கும் உடல் திசையைக் குறிக்கிறது. பட்டியலின் மூன்று இடங்களையும் தெளிவாக இணைக்க தமிழில் வேற்றுமைத் தொடர் பயன்படுத்தப்படுகிறது.
- source_word: אֲשֶׁר נָתַתָּה לַאֲבוֹתָם
  choice: நீர் அவர்களுடைய முன்னோர்களுக்குக் கொடுத்த
  rationale: אָבוֹתָם என்பது உடன்படிக்கை மரபிலுள்ள முந்தைய தலைமுறையினரைக் குறிக்கிறது; நவீனத் தமிழில் இயல்பாகவும் உள்ளடக்கத் துல்லியமாகவும் ‘முன்னோர்கள்’ பயன்படுத்தப்படுகிறது.
- source_word: הָעִיר אֲשֶׁר בָּחַרְתָּ
  choice: நீர் தேர்ந்தெடுத்த நகரம்
  rationale: தெய்வீகத் தேர்வைக் கூடுதல் விளக்கமின்றி எளிய இறந்தகால வினையால் தெரிவிக்கிறது.
- source_word: וְהַבַּיִת אֲשֶׁר בנית לִשְׁמֶךָ
  choice: உமது பெயருக்கென்று நான் கட்டிய இல்லம்
  rationale: בַּיִת என்பதன் ‘இல்லம்’ உருவகம் தக்கவைக்கப்படுகிறது; மெய்யெழுத்து வடிவமும் சாலொமோனின் பேச்சுச் சூழலும் காட்டும் முதலாம் நபர் ஒருமையான ‘நான் கட்டிய’ நேரடியாக மொழிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: உமது பெயருக்கென்று கட்டிய இல்லத்தைச் சுட்டும் பேச்சாளர்
  choice: 'முதலாம் நபர் ஒருமை: ‘நான் கட்டிய’'
  alternative: ‘கட்டப்பட்ட இல்லம்’ அல்லது ‘அவர்கள் கட்டிய இல்லம்’
  rationale: בנित என்ற மசோரா மெய்யெழுத்து வடிவம் சாலொமோனின் ஜெபச் சூழலில் இயல்பாக முதலாம் நபர் ஒருமையாக வாசிக்கப்படுகிறது; பேச்சாளரின் குறிப்பை மங்கச் செய்யாமல் தக்கவைக்கிறது.
- issue: שׁוּב என்பதிலுள்ள உடன்படிக்கை மனந்திரும்புதல்
  choice: ‘உம்மிடம் திரும்பி’
  alternative: ‘உமக்கு முன்பாக மனந்திரும்பி’
  rationale: இச்சொல் மனந்திரும்புதலை உள்ளடக்கக்கூடும்; எனினும் எபிரெய உரையின் உறவு மற்றும் திசை சார்ந்த மொழியைத் தக்கவைத்து, அதன் இறையியல் அடர்த்தியை விளக்கமாகத் தீர்மானிக்காமல் விடுகிறது.
translation_notes:
  register: நவீன, மரியாதைமிக்க, பொதுவாசகருக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. கடவுளை நோக்கிய ஒருமை மரியாதை வடிவமான ‘உம்மிடம்/நீர்/உமது’ தொடர்ச்சியாகப் பயன்படுத்தப்படுகிறது. எபிரெய வாக்கியம் பெரிய நிபந்தனை அமைப்பின் ஒரு பகுதி என்பதால் வசனம் தமிழில் ‘மன்றாடினால்’ என்றும் இறுதிக் காற்புள்ளியுடனும் விடப்பட்டுள்ளது.
