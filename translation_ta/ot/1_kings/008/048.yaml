revisions:
- from: அவர்களைச் சிறைப்பிடித்த அவர்களுடைய பகைவர்களின் நாட்டில், அவர்கள் தங்கள் முழு இதயத்தோடும் முழு உயிரோடும் உம்மிடம் திரும்பி[a], நீர் அவர்களுடைய முன்னோர்களுக்குக் கொடுத்த அவர்களுடைய நாட்டையும், நீர் தேர்ந்தெடுத்த நகரத்தையும், உமது பெயருக்கென்று நான் கட்டிய இல்லத்தையும்[c] நோக்கி[b] உம்மிடம் மன்றாடினால்,
  to: அவர்களைச் சிறைப்பிடித்த அவர்களுடைய பகைவர்களின் நாட்டில், அவர்கள் தங்கள் முழு இதயத்தோடும் முழு ஆத்துமாவோடும் உம்மிடம் திரும்பி[a], நீர் அவர்களுடைய முன்னோர்களுக்குக் கொடுத்த அவர்களுடைய நாட்டையும், நீர் தேர்ந்தெடுத்த நகரத்தையும், உமது பெயருக்கென்று நான் கட்டிய இல்லத்தையும்[c] நோக்கி[b] உம்மிடம் ஜெபித்தால்,
  rationale: 'The revision makes two minimal changes for lexical precision and idiomatic modern Tamil: the general prayer verb is rendered ‘ஜெபித்தால்,’ and the conventional heart-and-soul pairing is rendered ‘முழு இதயத்தோடும் முழு ஆத்துமாவோடும்.’ The source’s ambiguity in ‘return to you,’ the directional sense of prayer, and the MT first-person ‘I built’ are retained. Footnote anchors remain attached to their relevant expressions.'
