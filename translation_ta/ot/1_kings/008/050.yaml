reference: 1 Kings 8:50
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/סָלַחְתָּ֤ לְ/עַמְּ/ךָ֙ אֲשֶׁ֣ר חָֽטְאוּ לָ֔/ךְ וּ/לְ/כָל פִּשְׁעֵי/הֶ֖ם אֲשֶׁ֣ר פָּשְׁעוּ בָ֑/ךְ וּ/נְתַתָּ֧/ם לְ/רַחֲמִ֛ים לִ/פְנֵ֥י שֹׁבֵי/הֶ֖ם וְ/רִֽחֲמֽוּ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/050.yaml
  text: and forgive your people who have sinned against you[a], and all their transgressions that they have committed against you, and grant them compassion before those who took them captive[b], so that they may have compassion on them.
translation:
  language: ta
  text: உமக்கு எதிராகப் பாவம் செய்த உமது மக்களையும், உமக்கு எதிராக அவர்கள் செய்த எல்லா மீறுதல்களையும்[b] மன்னித்தருளும். அவர்களைச் சிறைப்பிடித்தவர்களின் முன்னிலையில் உமது மக்களுக்கு இரக்கம் கிடைக்கச் செய்யும்; அந்தச் சிறைப்பிடித்தவர்கள் அவர்கள்மேல் இரக்கம் காட்டும்படி[a] செய்யும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள் இவர்கள்மேல் இரக்கம் காட்டுவார்கள்.” இறுதி வாக்கியத்தை நோக்கமாகவும் விளைவாகவும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
  - marker: b
    text: “மீறுதல்கள்” என்பதை “கலகங்கள்” என்றும் மொழிபெயர்க்கலாம்; இந்தச் சொல் தேவனுக்கு எதிரான உடன்படிக்கை மீறலை வலியுறுத்தக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָלַחְתָּ
  choice: மன்னித்தருளும்
  rationale: இது வடிவில் இறந்தகால வினையாக இருந்தாலும், சாலொமோனின் வேண்டுதல் சூழலில் விண்ணப்பப் பொருளைத் தருகிறது. ‘மன்னித்தருளும்’ என்பது அதனை இயல்பாகவும் மரியாதையுடனும் வெளிப்படுத்துகிறது.
- source_word: לְעַמְּךָ
  choice: உமது மக்களை
  rationale: ‘உமது மக்கள்’ என்ற உறவையும், மன்னிப்பின் பெறுபவர்களாக அவர்கள் இருப்பதையும் இயல்பான தமிழில் காட்டுகிறது.
- source_word: חָטְאוּ לָךְ
  choice: உமக்கு எதிராகப் பாவம் செய்த
  rationale: לְ என்பது இங்கு குற்றத்தால் பாதிக்கப்பட்டவரைக் குறிக்கிறது; எனவே ‘உமக்கு எதிராக’ என்பது தமிழில் பொருத்தமான மொழிபெயர்ப்பு.
- source_word: וּלְכָל פִּשְׁעֵיהֶם
  choice: அவர்கள் செய்த எல்லா மீறுதல்களையும்
  rationale: פשע என்பது ‘மீறுதல்’ அல்லது ‘கலகம்’ எனப் பொருள்படலாம். ‘மீறுதல்கள்’ அதன் அறநெறி மற்றும் உடன்படிக்கை சார்ந்த கனத்தைப் பாதுகாக்கிறது; ‘செய்த’ என்பது அடுத்த தொடர்பு வாக்கியத்தின் பொருளை இயல்பான தமிழில் இணைக்கிறது.
- source_word: אֲשֶׁר פָּשְׁעוּ בָךְ
  choice: உமக்கு எதிராக அவர்கள் செய்த
  rationale: பெயர்ச்சொல்லும் அதே வேரிலுள்ள வினையும் எபிரேயத்தில் திரும்ப வருகின்றன. தமிழில் தேவையற்ற கடினமான மறுபதிப்பைத் தவிர்த்து, குற்றம் தேவனுக்கு எதிரானது என்பதைத் தெளிவாக வைத்திருக்கிறது.
- source_word: וּנְתַתָּם לְרַחֲמִים
  choice: உமது மக்களுக்கு இரக்கம் கிடைக்கச் செய்யும்
  rationale: נתן + ל + רחמים என்பது அவர்கள் இரக்கமான நடத்தையைப் பெறும் நிலையை தேவன் ஏற்படுத்த வேண்டும் என்ற வேண்டுதலைக் குறிக்கிறது. இந்தத் தமிழ் சொற்றொடர் அந்தக் காரணப்படுத்தும் கருத்தை இயல்பாகத் தருகிறது.
- source_word: לִפְנֵי שֹׁבֵיהֶם
  choice: அந்தச் சிறைப்பிடித்தவர்களின் முன்னிலையில்
  rationale: שֹׁבֵיהֶם என்பது அவர்களைச் சிறைப்பிடித்தவர்களைக் குறிக்கிறது; לִפְנֵי என்பது ‘முன்னிலையில்/பார்வையில்’ என்ற உறவைத் தருகிறது.
- source_word: וְרִחֲמוּם
  choice: அவர்களைச் சிறைப்பிடித்தவர்கள் அவர்கள்மேல் இரக்கம் காட்டும்படி
  rationale: இறுதி வினை நோக்கத்தையோ விளைவையோ குறிக்கக்கூடும். முதன்மை உரையில் நோக்கப் பொருள் இயல்பாகத் தரப்பட்டுள்ளது; இரக்கத்தைக் குறிக்கும் எபிரேயச் சொற்களின் தொடர்பும் தமிழில் ‘இரக்கம்’ என்பதன் மூலம் காக்கப்பட்டுள்ளது.
theological_decisions:
- issue: தெய்வீக மன்னிப்புக்கும் சிறையிருப்பில் மனிதர்கள் காட்டும் இரக்கத்துக்கும் உள்ள தொடர்பு
  choice: தேவன் இஸ்ரவேலை மன்னித்து, அவர்களைச் சிறைப்பிடித்தவர்கள் அவர்கள்மேல் இரக்கம் காட்டும் சூழலை ஏற்படுத்த வேண்டும் என்ற வேண்டுதலாக மொழிபெயர்க்கப்பட்டது.
  alternative: இறுதி வாக்கியத்தை நோக்கமாக அல்லாமல் விளைவாக, ‘அவர்கள் இவர்கள்மேல் இரக்கம் காட்டுவார்கள்’ என்றும் வாசிக்கலாம்.
  rationale: எபிரேய வாக்கியத் தொடர் தேவனுடைய மன்னிப்பையும், சிறைப்பிடித்தவர்களுக்கு முன் இரக்கம் கிடைக்கச் செய்வதையும், அதைத் தொடர்ந்து வரும் இரக்கமான நடத்தையையும் இணைக்கிறது. ஆனால் இறுதி இணைப்பின் நோக்கம்/விளைவு வேறுபாட்டை உரை முழுமையாகத் தீர்மானிக்காததால் அது அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன செந்தமிழுக்கு நெருக்கமான, பொதுவாசகர்களுக்குப் புரியும் மரியாதையான வேண்டுதல் நடை பயன்படுத்தப்பட்டுள்ளது. தேவனைச் சுட்டும் இடங்களில் ‘உமது/உமக்கு’ என்றும் விண்ணப்பத்தில் ‘மன்னித்தருளும்’ என்றும் பயன்படுத்தப்பட்டுள்ளது. தெளிவில்லாத பல ‘அவர்கள்’ சுட்டுப்பெயர்களால் குழப்பம் ஏற்படாமல், சிறைப்பிடித்தவர்களும் உமது மக்களும் தேவையான இடங்களில் வெளிப்படையாகக் குறிப்பிடப்பட்டுள்ளனர்.
