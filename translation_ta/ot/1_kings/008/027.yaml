  variant: modern standard Tamil
source:
  edition: WLC
  text: כִּ֚י הַֽ/אֻמְנָ֔ם יֵשֵׁ֥ב אֱלֹהִ֖ים עַל הָ/אָ֑רֶץ הִ֠נֵּה הַ/שָּׁמַ֜יִם וּ/שְׁמֵ֤י הַ/שָּׁמַ֨יִם֙ לֹ֣א יְכַלְכְּל֔וּ/ךָ אַ֕ף כִּֽי הַ/בַּ֥יִת הַ/זֶּ֖ה אֲשֶׁ֥ר בָּנִֽיתִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/027.yaml
  text: For will God indeed dwell on the earth? Behold[a], the heavens, even the highest heavens, cannot contain you[c][b]; how much less this house that I have built!
translation:
  language: ta
  text: ஏனெனில், கடவுள் உண்மையாகவே பூமியில் குடியிருப்பாரா? இதோ, வானங்களும் வானாதி வானங்களும்கூட[a] உம்மைத் தம்முள் கொள்ள முடியாதே[b]; அப்படியிருக்க, நான் கட்டிய இந்த வீடு[c] எம்மாத்திரம்!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேய மொழியில், “வானங்களும் வானங்களின் வானமும்”; இது மிக உயர்ந்த வானங்களைக் குறிக்கும் சொல்லாட்சி.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உம்மைத் தாங்க முடியாதே.”
    reason: lexical_alternative
  - marker: c
    text: “இந்த வீடு” என்பது சாலொமோன் கட்டிய ஆலயத்தைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய வேண்டுதலோடு சாலொமோனின் சிந்தனையை இணைக்கும் காரணத் தொடர்பை இயல்பான தமிழில் காட்டுகிறது.
- source_word: הַאֻמְנָם
  choice: உண்மையாகவே
  rationale: வியப்பும் வலியுறுத்தலும் கலந்த வினாவை, பேச்சுவழக்காகத் தாழ்த்தாமல் வெளிப்படுத்துகிறது.
- source_word: יֵשֵׁב
  choice: குடியிருப்பாரா
  rationale: அடிப்படைப் பொருளான அமர்தல் அல்லது தங்குதல் என்பதைக் காட்டிலும், இறைவனின் பிரசன்னமும் ஆலயமும் பற்றிய இச்சூழலில் ‘குடியிரு’ இயல்பானது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: வினையும் சூழலும் ஒருமைப் பொருளைக் கோருகின்றன; இங்கு இஸ்ரவேலின் கடவுளே குறிக்கப்படுகிறார்.
- source_word: עַל הָאָרֶץ
  choice: பூமியில்
  rationale: வானங்களுடன் உள்ள எதிர்மறை ஒப்பீட்டைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: அடுத்து வரும் அறிவிப்பின் மீது கவனத்தைத் திருப்பும் எபிரேய வலியுறுத்தலை உயர்ந்த, இயல்பான தமிழில் காக்கிறது.
- source_word: הַשָּׁמַיִם וּשְׁמֵי הַשָּׁמַיִם
  choice: வானங்களும் வானாதி வானங்களும்கூட
  rationale: ‘வானங்களின் வானம்’ என்ற எபிரேய மிகையுயர்வு மரபை ‘வானாதி வானங்கள்’ என்ற புரிந்துகொள்ளத்தக்க, கண்ணியமான தமிழில் காக்கிறது.
- source_word: לֹא יְכַלְכְּלוּךָ
  choice: உம்மைத் தம்முள் கொள்ள முடியாதே
  rationale: கடவுளை எந்தப் படைக்கப்பட்ட வெளியும் தன்னுள் அடக்கி வைத்திருக்க முடியாது என்ற கொள்ளளவுப் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: אַף כִּי
  choice: அப்படியிருக்க … எம்மாத்திரம்
  rationale: வானங்களே கடவுளைக் கொள்ள முடியாவிட்டால் ஆலயம் இன்னும் எவ்வளவு குறைவாக முடியும் என்ற வலுவிலிருந்து வலுவுக்குச் செல்லும் தர்க்கத்தை இயல்பான தமிழில் தருகிறது.
- source_word: הַבַּיִת הַזֶּה
  choice: இந்த வீடு
  rationale: ஆலயத்தைக் குறிக்கும் எபிரேய ‘வீடு’ என்ற சொல்லையும், கடவுளின் வீடு என்ற மூலப்படிமத்தையும் தக்கவைக்கிறது.
- source_word: אֲשֶׁר בָּנִיתִי
  choice: நான் கட்டிய
  rationale: முடிவுற்ற கட்டுமானச் செயலைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: கடவுளின் எல்லைகடந்த தன்மையும் ஆலயப் பிரசன்னமும்
  choice: கடவுள் பூமியில் குடியிருப்பாரா என்ற வியப்பான வினாவையும், மிக உயர்ந்த வானங்கள்கூட அவரைத் தம்முள் கொள்ள முடியாது என்ற அறிவிப்பையும் ஒன்றாக வைத்திருக்கிறது.
  alternative: கடவுள் பூமியில் குடியிருப்பதே இல்லை என்று தட்டையாகக் கூறுதல், அல்லது ஆலயம் அவரை இடவெளிக்குள் அடக்குகிறது என்று உணர்த்துதல்.
  rationale: எபிரேய உரை கடவுளின் உண்மையான ஆலயப் பிரசன்னத்தை மறுக்காமலேயே, படைக்கப்பட்ட எந்த இடமும் அவரை உள்ளடக்க முடியாது என்ற பதற்றத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான ஜெபநடையைப் பேணுகிறது. கடவுளை நேரடியாக அழைக்கும் இடத்தில் மரியாதைப் பன்மையான ‘உம்மை’ பயன்படுத்தப்பட்டுள்ளது. ‘வானாதி வானங்கள்’ மற்றும் ‘எம்மாத்திரம்’ ஆகியவை உயர்ந்த நடையைத் தரினும், சூழலில் எளிதில் புரிந்துகொள்ளக்கூடியவையாக உள்ளன.
