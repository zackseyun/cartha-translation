source:
  edition: WLC
  text: כִּ֣י יֶֽחֶטְאוּ לָ֗/ךְ כִּ֣י אֵ֤ין אָדָם֙ אֲשֶׁ֣ר לֹא יֶחֱטָ֔א וְ/אָנַפְתָּ֣ בָ֔/ם וּ/נְתַתָּ֖/ם לִ/פְנֵ֣י אוֹיֵ֑ב וְ/שָׁב֤וּ/ם שֹֽׁבֵי/הֶם֙ אֶל אֶ֣רֶץ הָ/אוֹיֵ֔ב רְחוֹקָ֖ה א֥וֹ קְרוֹבָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/046.yaml
  text: When they sin against you—for there is no one who does not sin—and you become angry with them and give them over to an enemy[a], and their captors carry them away captive to the land of the enemy, whether far away or near,
translation:
  language: ta
  text: அவர்கள் உமக்கு எதிராகப் பாவம் செய்யும்போது—பாவம் செய்யாத மனிதர் ஒருவரும் இல்லையே—நீர் அவர்கள்மேல் கோபங்கொண்டு, அவர்களை ஓர் எதிரியின் கையில் ஒப்புக்கொடுத்து, அவர்களைப் பிடித்தவர்கள் அவர்களைத் தொலைவிலோ அருகிலோ உள்ள எதிரியின் நாட்டுக்குச் சிறைபிடித்துக் கொண்டுபோனால்,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי יֶחֶטְאוּ לָךְ
  choice: அவர்கள் உமக்கு எதிராகப் பாவம் செய்யும்போது
  rationale: தொடக்க כִּי சாலொமோனின் விண்ணப்பத்தில் ஒரு சாத்திய நிகழ்வை அறிமுகப்படுத்துகிறது; அடுத்த உட்பிரிவின் ‘இல்லையே’ என்பதுடன் சேர்ந்து, ‘செய்யும்போது’ என்பது நிபந்தனைத் தன்மையையும் நிகழ்வு எதிர்பார்க்கப்படுவதையும் இயல்பாக வெளிப்படுத்துகிறது. לָךְ உறவுக்கு எதிரான குற்றத்தைச் சுட்டுவதால் ‘உமக்கு எதிராக’ என மொழிபெயர்க்கப்பட்டது.
- source_word: אֵין אָדָם אֲשֶׁר לֹא יֶחֱטָא
  choice: பாவம் செய்யாத மனிதர் ஒருவரும் இல்லையே
  rationale: אָדָם இங்கு மனிதகுலத்தைப் பொதுவாகக் குறிக்கிறது. தமிழில் ‘மனிதர் ஒருவரும்’ என்பது பாலின வரம்பின்றி, எபிரெய உரையின் பொதுமைப் பொருளை இயல்பாகத் தருகிறது.
- source_word: וְאָנַפְתָּ בָם
  choice: நீர் அவர்கள்மேல் கோபங்கொண்டு
  rationale: אָנַף தெய்வீகக் கோபத்தைக் குறிக்கிறது; தீவிரத்தை மிகைப்படுத்தாமல் தொடர்ச்சியான செயலை ‘கோபங்கொண்டு’ வெளிப்படுத்துகிறது.
- source_word: וּנְתַתָּם לִפְנֵי אוֹיֵב
  choice: அவர்களை ஓர் எதிரியின் கையில் ஒப்புக்கொடுத்து
  rationale: נתן לפני என்ற சூழல்சார் மொழிநடை எதிரியின் அதிகாரத்துக்குள் ஒப்படைப்பதைக் குறிக்கிறது. ‘கையில்’ என்பது தமிழில் அதிகாரத்தைக் குறிக்கும் இயல்பான கூறு; אוֹיֵב கட்டுரையின்றி ஒருமையில் வருவதால் ‘ஓர் எதிரி’ எனப்பட்டது.
- source_word: וְשָׁבוּם שֹׁבֵיהֶם
  choice: அவர்களைப் பிடித்தவர்கள் அவர்களைச் சிறைபிடித்துக் கொண்டுபோனால்
  rationale: எபிரெயச் சொல்விளையாட்டில் பிடித்தவர்களும் சிறைபிடித்துச் செல்லுதலும் ஒரே வேரால் சொல்லப்படுகின்றன. தமிழில் ‘பிடித்தவர்கள் … சிறைபிடித்துக் கொண்டுபோனால்’ என்பது அந்த மீளுரைப்பை அளவாகப் பாதுகாத்து நாடுகடத்தலைத் தெளிவாக்குகிறது.
- source_word: אֶל אֶרֶץ הָאוֹיֵב רְחוֹקָה אוֹ קְרוֹבָה
  choice: தொலைவிலோ அருகிலோ உள்ள எதிரியின் நாட்டுக்கு
  rationale: רְחוֹקָה / קְרוֹבָה ஆகியவை ‘நாடு’ என்பதோடு இயைந்து அதன் தொலைவை விவரிக்கின்றன. இரண்டாவது אוֹיֵב குறிப்பிட்ட உருபுடன் இருப்பதால் ‘எதிரியின் நாடு’ என வழங்கப்பட்டது.
theological_decisions:
- issue: אָדָם என்பதன் பொதுமைப் பயன்பாடு
  choice: மனிதர் ஒருவரும்
  alternative: ஒருவனும்
  rationale: இங்கு אָדָם ஓர் ஆணை மட்டும் அல்ல, ஒட்டுமொத்த மனிதகுலத்தையும் பொதுமையாகக் குறிக்கிறது. ‘மனிதர் ஒருவரும்’ அந்தப் பொதுமையையும் தனிநபர் வடிவையும் தமிழில் தெளிவாகப் பாதுகாக்கிறது.
- issue: மனிதப் பாவத்தின் பொதுமை
  choice: பாவம் செய்யாத மனிதர் ஒருவரும் இல்லையே
  alternative: ஒருவேளை அவர்கள் பாவம் செய்தால்
  rationale: வசனம் எல்லா மனிதர்களும் பாவம் செய்கிறார்கள் என்ற கூற்றை நேரடியாக வைக்கிறது; அதை வெறும் சாத்திய நிபந்தனையாகக் குறைக்காமல், மூலத்தின் இறையியல் அழுத்தம் பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில் மரியாதைமிக்க, வழிபாட்டு உரைக்கு ஏற்ற நடை பயன்படுத்தப்பட்டுள்ளது. தேவனை நோக்கும் ஒருமை மரியாதை வடிவங்களாக ‘உமக்கு’, ‘நீர்’ கொள்ளப்பட்டன. வசனம் அடுத்த வசனத்தில் தொடரும் நீண்ட நிபந்தனை வாக்கியத்தின் பகுதி என்பதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
