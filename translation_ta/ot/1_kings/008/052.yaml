  text: that your eyes may be open to the plea of your servant and to the plea of your people Israel[b][a], to listen to them whenever they call to you.
translation:
  language: ta
  text: உமது அடியானின் மன்றாட்டுக்கும், உமது மக்களாகிய இஸ்ரவேலின் மன்றாட்டுக்கும் உமது கண்கள் திறந்திருக்கட்டும்; அவர்கள் உம்மை நோக்கிக் கூப்பிடும்போதெல்லாம் அவர்களுக்குச் செவிகொடுப்பீராக.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களைக் கேட்பீராக.” எபிரெய வினை கேட்பது, கவனமாகச் செவிகொடுப்பது, அல்லது ஏற்றுக்கொள்வது ஆகிய பொருள்களைக் கொண்டிருக்கலாம்.
