theological_decisions:
- issue: 'தேவனைப் பற்றிய மனித உருவக மொழி: ‘உமது கண்கள் திறந்திருக்கட்டும்’'
  choice: மூலத்தின் கண்கள் பற்றிய உருவகத்தை முதன்மை உரையில் தக்கவைத்தல்
  alternative: ‘நீர் கவனம் செலுத்துவீராக’ என்று பொருள் விரித்தல்
  rationale: எபிரெய உரை தேவனுடைய கவனமுள்ள அருளைக் கண்கள் திறந்திருப்பதாக உருவகப்படுத்துகிறது; அதைத் தக்கவைப்பது இலக்கிய மற்றும் இறையியல் அழுத்தத்தைப் பாதுகாக்கிறது.
- issue: שׁמע வினையின் கேட்பது/செவிகொடுப்பது என்ற பொருள் நுட்பம்
  choice: ‘செவிகொடுப்பீராக’
  alternative: ‘அவர்களைக் கேட்பீராக’
  rationale: ஜெபச் சூழலில் கவனமான கேட்பை இயல்பாக உணர்த்துகிறது; பதிலளிப்பதைத் தெளிவாகச் சேர்த்து மூலத்தின் தெளிவின்மையைத் தீர்த்துவிடாமல் இருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், ஜெபத்துக்குரிய கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘உமது/உம்மை’ என்ற மரியாதை ஒருமை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. ‘மன்றாட்டு’ என்பது உருக்கமான வேண்டுதலை இயல்பாகத் தெரிவிக்கிறது; மூலத்தின் மனித உருவகம் அப்படியே பாதுகாக்கப்பட்டுள்ளது.
