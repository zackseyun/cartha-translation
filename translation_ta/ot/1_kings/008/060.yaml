  text: לְמַ֗עַן דַּ֚עַת כָּל עַמֵּ֣י הָ/אָ֔רֶץ כִּ֥י יְהוָ֖ה ה֣וּא הָ/אֱלֹהִ֑ים אֵ֖ין עֽוֹד־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/060.yaml
  text: so that all the peoples of the earth may know that the LORD, he is God; there is no other.
translation:
  language: ta
  text: பூமியிலுள்ள எல்லா மக்களினங்களும் யெகோவாவே கடவுள் என்றும், வேறு கடவுள் இல்லை என்றும் அறிந்துகொள்வதற்காக.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל עַמֵּי הָאָרֶץ
  choice: பூமியிலுள்ள எல்லா மக்களினங்களும்
  rationale: ‘Peoples’ என்ற பன்மையைப் பாதுகாத்து, உலகின் பல்வேறு மக்களினங்களைக் குறிக்கும் இயல்பான நவீனத் தமிழ் நடை.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: எபிரெய தனிப்பெயரைக் கடவுளுக்கான பொதுப் பட்டமாக மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட பெயர்வடிவில் தருகிறது.
- source_word: הוּא הָאֱלֹהִים
  choice: யெகோவாவே கடவுள்
  rationale: הוּא தரும் வலியுறுத்தலை ‘-வே’ மூலம் இயல்பாகத் தக்கவைக்கிறது.
- source_word: אֵין עוֹד
  choice: வேறு எவரும் இல்லை
  rationale: முன்னுள்ள தனிப்பட்ட தெய்வக் குறிப்புடன் இணைந்து, வேறு கடவுள் எவரும் இல்லை என்ற பொருளைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה הוּא הָאֱלֹהִים என்பதிலுள்ள தனித்துவ வலியுறுத்தல்
  choice: யெகோவாவே கடவுள்
  alternative: யெகோவா, அவரே கடவுள்
  rationale: எபிரெய மொழியின் வலியுறுத்தலைத் தக்கவைத்தபடியே தமிழில் தேவையற்ற சுட்டுப்பெயர் மீளுரைப்பைத் தவிர்க்கிறது.
- issue: אֵין עוֹד என்பதன் குறிப்பு
  choice: வேறு எவரும் இல்லை
  alternative: வேறு ஒன்றும் இல்லை
  rationale: சூழல் கடவுளின் ஒப்பற்ற தனித்துவத்தைப் பற்றியது; ஆளைக் குறிக்கும் வடிவம் தமிழில் அந்த இறையியல் கூற்றைத் தெளிவாக்குகிறது, ஆனால் எந்தப் பிரிவுசார் விளக்கத்தையும் சேர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. மூலத்தின் நோக்கவாக்கிய அமைப்பும், ‘அவரே/அவர்தான்’ என்ற வலியுறுத்தலும், கடவுளின் ஒப்பற்ற தனித்துவமும் பாதுகாக்கப்பட்டுள்ளன.
