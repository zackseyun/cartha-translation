lexical_decisions:
- source_word: אָז
  choice: அப்போது
  rationale: சாலொமோனின் கூற்றை அறிமுகப்படுத்தும் காலத்தொடர்பைக் காட்டும் இயல்பான நவீனத் தமிழ் சொல்.
- source_word: אָמַר
  choice: சொன்னார் / என்றார்
  rationale: முதல் இடத்தில் மேற்கோளுக்குள் ‘சொன்னார்’ என்றும், பேச்சை முடிக்கும் இடத்தில் இயல்பான தமிழ் நடைப்படி ‘என்றார்’ என்றும் தரப்பட்டுள்ளது.
- source_word: שְׁלֹמֹה
  choice: சாலொமோன்
  rationale: தமிழ் வேதாகம மரபிலும் பொதுப் பயன்பாட்டிலும் நிலைபெற்ற பெயர் வடிவம்.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: இறைவனின் தனிப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பு வடிவத்தில் தருகிறது.
- source_word: לִשְׁכֹּן
  choice: குடியிருப்பதாக
  rationale: לְ உடனான வினையெச்சம் கூறப்பட்ட உள்ளடக்கத்தை வெளிப்படுத்துகிறது; ‘குடியிருப்பதாகச் சொன்னார்’ என்பது தமிழில் இயல்பாகவும் மூலத்தின் பொருளுக்கு நெருக்கமாகவும் உள்ளது.
- source_word: בָּעֲרָפֶל
  choice: காரிருளில்
  rationale: עֲרָפֶל குறிக்கும் அடர்ந்த இருள் அல்லது இருண்ட மேகமூட்டத்தின் வலிமையான படிமத்தைச் சுருக்கமாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: עֲרָפֶל என்பதில் இறைவன் குடியிருப்பதாகக் கூறப்படுதல்
  choice: காரிருளில் குடியிருப்பதாக
  alternative: இருண்ட மேகத்தில் குடியிருப்பதாக
  rationale: இறைவனின் வெளிப்பட்ட பிரசன்னம் மறைவோடும் இருளோடும் இணைக்கப்படும் இறையாட்சித் தோற்றத்தின் பதற்றத்தை ‘காரிருள்’ பாதுகாக்கிறது; அதை வெறும் வானிலை மேகமாக மட்டும் குறுக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியக்கூடியதாயும் வழிபாட்டு வாசிப்புக்கேற்ற கண்ணியமுடையதாயும் அமைக்கப்பட்டுள்ளது. தமிழ் மேற்கோள் நடைக்கு ஏற்ப முதன்மை வினை இறுதியில் வைக்கப்பட்டுள்ளது; மூலத்தின் சுருக்கமும் இறையாட்சித் தோற்றப் படிமமும் பாதுகாக்கப்பட்டுள்ளன.
