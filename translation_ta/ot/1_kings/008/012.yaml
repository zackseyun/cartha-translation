    text: அல்லது, “இருண்ட மேகத்தில்.” எபிரெயச் சொல் עֲרָפֶל அடர்ந்த இருளையோ இருண்ட மேகத்தையோ குறிக்கலாம்; குறிப்பாக யெகோவாவின் வெளிப்பாட்டை விவரிக்கும் இடங்களில் இவ்வாறு வருகிறது.
