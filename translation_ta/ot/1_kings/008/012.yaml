  text: Then Solomon said[a], “Yahweh said that he would dwell in the thick darkness.”
translation:
  language: ta
  text: அப்போது சாலொமோன், “யெகோவா காரிருளில்[a] குடியிருப்பதாகக் கூறினார்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
