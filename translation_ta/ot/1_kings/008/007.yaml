base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/007.yaml
  text: For the cherubim spread out their wings over the place of the ark[a], and the cherubim overshadowed the ark and its poles from above.
translation:
  language: ta
  text: ஏனெனில், கேருபீன்கள் பேழை வைக்கப்பட்டிருந்த இடத்தின்மேல் தங்கள் சிறகுகளை விரித்தபடி இருந்தன; கேருபீன்கள் பேழையையும் அதன் தண்டுகளையும் மேலிருந்து மூடின.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பேழை வைக்கப்பட்டிருந்த இடத்தை நோக்கி.’ எபிரெய முன்னிடைச்சொல் இன்னும் சொற்சொல்லாகத் திசையைக் குறிக்கலாம்; எனினும், சிறகுகள் பேழை வைக்கப்பட்டிருந்த இடத்துக்கு மேலாக விரிந்திருந்தன என்பதே சூழலுக்கு ஏற்ற பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான விளக்கத்தையோ காரணத்தையோ அறிமுகப்படுத்தும் எபிரெய இணைப்பின் வலிமையை இயல்பான தமிழில் காக்கிறது.
- source_word: הַכְּרוּבִים
  choice: கேருபீன்கள்
  rationale: ஆலயச் சூழலில் வரும் கேருபிய உருவங்களைக் குறிக்கும், தமிழ் வேதாகம மொழிநடையில் பரவலாக அறியப்பட்ட சொல்.
- source_word: פֹּרְשִׂים כְּנָפַיִם
  choice: தங்கள் சிறகுகளை விரித்திருந்தன
  rationale: எபிரெயப் பங்கேற்புவினை சுட்டும் நீடித்த நிலையைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; உடைமையைக் காட்ட ‘தங்கள்’ சூழலிலிருந்து வழங்கப்பட்டுள்ளது.
- source_word: אֶל מְקוֹם הָאָרוֹן
  choice: பெட்டி இருந்த இடத்தின்மேல்
  rationale: אֶל என்பதன் திசைநோக்கிய அடிப்படைப் பொருளை ஒப்புக்கொண்டபோதும், அடுத்துவரும் மூடுதல் பற்றிய கூற்றுக்கு ஏற்ப சிறகுகள் பெட்டியின் இடத்திற்கு மேலாக விரிந்திருந்த இடவமைப்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: וַיָּסֹכּוּ
  choice: மூடியிருந்தன
  rationale: סכך வேரின் மூடுதல் அல்லது பாதுகாப்பாக மேலிருத்தல் என்ற இடவியல் கருத்தை எளிய நவீன தமிழில் தருகிறது.
- source_word: בַּדָּיו
  choice: அதன் தண்டுகள்
  rationale: பெட்டியைச் சுமப்பதற்குப் பயன்படுத்தப்பட்ட நீண்ட தண்டுகளைக் குறிக்கும் தெளிவான, வழக்கமான தமிழ்ச் சொல்.
- source_word: מִלְמָעְלָה
  choice: மேலிருந்து
  rationale: மூடுதல் எந்த இடத்திலிருந்து ஏற்பட்டது என்பதைக் காட்டும் எபிரெயச் சொல்லின் இடவியல் வலிமையை நேராகக் காக்கிறது.
