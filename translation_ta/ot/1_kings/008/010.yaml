id: 1KI.8.10
reference: 1 Kings 8:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יְהִ֕י בְּ/צֵ֥את הַ/כֹּהֲנִ֖ים מִן הַ/קֹּ֑דֶשׁ וְ/הֶ/עָנָ֥ן מָלֵ֖א אֶת בֵּ֥ית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/010.yaml
  text: And when the priests came out from the holy place[a], the cloud filled the house of Yahweh.
translation:
  language: ta
  text: 'ஆசாரியர்கள் பரிசுத்த இடத்திலிருந்து[a] வெளியே வந்தபோது, மேகம் யாவேயின் ஆலயத்தை நிரப்பியது.


    [a] அல்லது, “பரிசுத்த ஸ்தலத்திலிருந்து”; “திருத்தலத்திலிருந்து” என்றும் மொழிபெயர்க்கலாம்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பரிசுத்த ஸ்தலத்திலிருந்து”; “திருத்தலத்திலிருந்து” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בְּצֵאת
  choice: வெளியே வந்தபோது
  rationale: היה உடன் தொடரும் காலச்சூழலை בְּ + יצא வினையெச்ச அமைப்பு குறிக்கிறது. தமிழில் தனியாக ‘அது நிகழ்ந்தது’ என்று சேர்க்காமல், ‘வந்தபோது’ என வழங்குவது இயல்பான கதைநடையையும் காலத் தொடர்பையும் காக்கிறது.
- source_word: הַכֹּהֲנִים
  choice: ஆசாரியர்கள்
  rationale: வரையறுக்கப்பட்ட பன்மைப் பெயர்ச்சொல்லுக்கான வழக்கமான, தெளிவான தமிழ் இணை.
- source_word: מִן־הַקֹּדֶשׁ
  choice: பரிசுத்த இடத்திலிருந்து
  rationale: קֹדֶשׁ என்பது இங்கு ஆசாரியர்கள் வெளியே வந்த ஆலயத்தின் புனித உட்பகுதியைக் குறிக்கிறது. எபிரெயச் சொல்லில் குறிப்பிட்ட கட்டடப் பிரிவுக்கான தொழில்நுட்பப் பெயர் கட்டாயமாக இல்லாததால், பொதுவான பொருளை முதன்மை உரை காக்கிறது; வேறு இயல்பான சாத்தியங்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: וְהֶעָנָן
  choice: மேகம்
  rationale: வரையறுக்கப்பட்ட பெயர்ச்சொல். தமிழ் காலத் துணைவாக்கியத்திலிருந்து முதன்மை வாக்கியத்துக்குச் செல்லும்போது וְ-ஐ தனியே ‘மேலும்’ என்று மொழிபெயர்ப்பது தேவையில்லை.
- source_word: מָלֵא
  choice: நிரப்பியது
  rationale: מלא என்பதன் Qal perfect வடிவம்; ‘மேகம்’ எழுவாயாகவும் ஆலயம் செயப்படுபொருளாகவும் உள்ளது. முடிவுற்ற கதை நிகழ்வை இயல்பாகக் காட்டுகிறது.
- source_word: בֵּית יְהוָה
  choice: யாவேயின் ஆலயம்
  rationale: בֵּית என்பதன் அடிப்படைப் பொருள் ‘வீடு/இல்லம்’ என்றாலும், இச்சூழலில் அது யாவேக்கெனக் கட்டப்பட்ட ஆலயத்தைக் குறிக்கிறது. ‘ஆலயம்’ நவீன தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது; יְהוָה தனிப்பட்ட உடன்படிக்கைப் பெயராக ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல உரையில் நான்கு எழுத்துகளைக் கொண்ட தனிப்பட்ட இறைப்பெயர் நேரடியாக உள்ளது. அதை பொதுப்பட்டமான ‘கர்த்தர்’ என்று மாற்றாமல், பரவலாக ஏற்கப்படும் மறுவடிவ உச்சரிப்பின் தமிழ் ஒலிபெயர்ப்பாக ‘யாவே’ என வழங்குவது பெயரின் தனித்தன்மையைப் பாதுகாக்கிறது.
- issue: הַקֹּדֶשׁ குறிக்கும் ஆலயப் பகுதி
  choice: பரிசுத்த இடம்
  alternative: பரிசுத்த ஸ்தலம்; திருத்தலம்
  rationale: சொல் புனிதமான இடத்தைக் குறிக்கிறது; ஆனால் இதை ஒரு குறிப்பிட்ட தொழில்நுட்பப் பிரிவாக மூல உரை இவ்விடத்தில் முழுமையாகத் தெளிவுபடுத்தவில்லை. ஆகவே முதன்மை உரை பொதுவான சொல்லைப் பயன்படுத்தி, மாற்று வாசிப்புகளை அடிக்குறிப்பில் வைத்துள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆசாரியர்கள்,’ ‘பரிசுத்த இடம்,’ ‘ஆலயம்’ ஆகியவை பொதுவாசகர்களுக்குப் புரியக்கூடிய வேதாகமச் சொற்களாகத் தேர்ந்தெடுக்கப்பட்டுள்ளன; தேவையற்ற வடமொழிச் சுமை தவிர்க்கப்பட்டாலும், புனித உரைக்கேற்ற மரியாதைநடை காக்கப்பட்டுள்ளது.
