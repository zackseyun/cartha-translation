base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/009.yaml
  text: There was nothing in the ark except the two stone tablets that Moses had placed there at Horeb[c][b][a], where Yahweh made a covenant with the sons of Israel when they came out from the land of Egypt.
translation:
  language: ta
  text: பேழைக்குள், ஓரேபில் மோசே வைத்திருந்த இரண்டு கற்பலகைகளை[a]த் தவிர வேறொன்றும் இல்லை. இஸ்ரயேல் மக்கள்[c] எகிப்து நாட்டிலிருந்து வெளியே வந்தபோது, ஓரேபிலே யாவே அவர்களுடன் உடன்படிக்கை செய்தார்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: ‘கல்லினாலான இரண்டு பலகைகள்.’'
    reason: lexical_alternative
  - marker: b
    text: 'எபிரெயத்தில் சொல்லுக்குச் சொல்: ‘உடன்படிக்கையை வெட்டினார்’; இதன் பொருள் ‘உடன்படிக்கை செய்தார்.’'
    reason: lexical_alternative
  - marker: c
    text: 'சொல்லுக்குச் சொல்: ‘இஸ்ரயேலின் புதல்வர்கள்’; ‘இஸ்ரயேலர்’ என்றும் மொழிபெயர்க்கலாம்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין בָּאָרוֹן רַק
  choice: பெட்டிக்குள் ... தவிர வேறொன்றும் இல்லை
  rationale: எதிர்மறை இருப்புநிலையையும் רַק குறிக்கும் விதிவிலக்கையும் இயல்பான நவீனத் தமிழில் ‘தவிர வேறொன்றும் இல்லை’ எனத் தெளிவாகக் கூறுகிறது.
- source_word: שְׁנֵי לֻחֹת הָאֲבָנִים
  choice: இரண்டு கற்பலகைகள்
  rationale: கல் பொருளால் ஆன உடன்படிக்கைப் பலகைகளைச் சுருக்கமாகவும் தெளிவாகவும் குறிக்கிறது; எபிரெயக் கட்டமைப்பைச் சொல்லுக்குச் சொல் பின்பற்றும் மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: אֲשֶׁר הִנִּחַ שָׁם מֹשֶׁה בְּחֹרֵב
  choice: ஓரேபில் மோசே வைத்திருந்த
  rationale: הִנִּיחַ என்பதன் ‘வைத்தல்/இடுதல்’ பொருளைப் பாதுகாத்து, பெட்டியின் அப்போதைய உள்ளடக்கத்தை விவரிக்கும் பின்னோக்கு உறவை ‘வைத்திருந்த’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר כָּרַת יְהוָה עִם
  choice: அங்கே யாவே அவர்களுடன் உடன்படிக்கை செய்தார்
  rationale: כרת என்பதன் சொற்பொருள் ‘வெட்டுதல்’ என்றாலும், உடன்படிக்கைச் சூழலில் உள்ள நிலையான எபிரெய மரபுத்தொடரைத் தமிழில் பொருள்பட மொழிபெயர்க்கிறது. אֲשֶׁר என்பதை ஓரேபுடன் தொடர்புபடுத்தி ‘அங்கே’ என வழங்குகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தலைப்புப் பெயரால் மாற்றாமல், எபிரெய இறைநாமத்தின் வழக்கமான தமிழ் ஒலிபெயர்ப்பைப் பயன்படுத்துகிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரயேல் மக்கள்
  rationale: முழு இஸ்ரயேல் சமூகத்தைக் குறிக்கும் எபிரெயக் குடும்பவழிச் சொல்லை நவீனத் தமிழில் இயல்பாகவும் உள்ளடக்கமாகவும் வெளிப்படுத்துகிறது; நேரடியான வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: בְּצֵאתָם מֵאֶרֶץ מִצְרָיִם
  choice: எகிப்து நாட்டிலிருந்து வெளியே வந்தபோது
  rationale: காலத்தைக் குறிக்கும் infinitive construct-ஐ இயல்பான தமிழ்க் காலவாக்கியமாக மொழிபெயர்த்து, எகிப்திலிருந்து புறப்பட்ட நிகழ்வைத் தெளிவாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைநாமத்தை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கை இறைநாமம் நேரடியாக இருப்பதால், அதை ஒரு பட்டத்தால் மாற்றாமல் ஒலிபெயர்ப்பாக வழங்குகிறது.
- issue: בְּנֵי יִשְׂרָאֵל என்பதன் பிரதிநிதித்துவப் பயன்பாடு
  choice: இஸ்ரயேல் மக்கள்
  alternative: இஸ்ரயேலின் புதல்வர்கள்
  rationale: இச்சூழலில் இந்தச் சொற்றொடர் ஆண்களை மட்டும் அல்லாமல் உடன்படிக்கையுடன் தொடர்புடைய இஸ்ரயேல் சமூகத்தை மொத்தமாகக் குறிக்கிறது. இயல்பான தமிழை முதன்மை உரையில் வைத்து, வடிவத்துக்கு நெருக்கமான மாற்றை அடிக்குறிப்பில் பாதுகாக்கிறது.
- issue: כָּרַת உடன்படிக்கை மரபுத்தொடர்
  choice: உடன்படிக்கை செய்தார்
  alternative: உடன்படிக்கையை வெட்டினார்
  rationale: எபிரெயத்தில் ‘வெட்டினார்’ என்பது நிலையான மரபுத்தொடர்; தமிழில் அதன் நோக்குப்பொருள் ‘உடன்படிக்கை செய்தார்’ என்பதே. சொற்படியான உருவகம் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘பெட்டி’, ‘கற்பலகைகள்’, ‘உடன்படிக்கை’ போன்ற பரவலாகப் புரியும் சொற்கள் பயன்படுத்தப்பட்டன. மூலத்தின் இரண்டு தொடர்புச் சொற்றொடர்களையும் தமிழில் தெளிவான இரண்டு வாக்கியங்களாகப் பிரித்து, ஓரேபே உடன்படிக்கை செய்யப்பட்ட இடம் என்ற தொடர்பு ‘அங்கே’ மூலம் பாதுகாக்கப்பட்டது.
