    reason: lexical_alternative
  - marker: b
    text: அதாவது, உடன்படிக்கைப் பெட்டி. அந்த முழுப் பெயர் இவ்வசனத்தில் கூறப்படவில்லை; ஆனால் சுற்றியுள்ள வசனங்களிலிருந்து இது தெளிவாகிறது.
