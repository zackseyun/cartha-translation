  text: I have indeed built you an exalted house[b][a], a settled place for you to dwell forever.
translation:
  language: ta
  text: உமக்காக மேன்மையான ஒரு வீட்டை[a], நீர் என்றென்றும் குடியிருப்பதற்கான நிலையான ஓர் இடத்தை[b] நிச்சயமாகக் கட்டியிருக்கிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உயர்ந்த/மகத்துவமிக்க ஓர் உறைவிடத்தை.’ எபிரெயச் சொல் זְבֻל மேன்மையான உறைவிடத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘உமது குடியிருப்புக்கான நிலையான ஓர் இடத்தை.’
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנֹה בָנִיתִי
  choice: நிச்சயமாகக் கட்டியிருக்கிறேன்
  rationale: முற்றுவினைக்கு முன் வரும் வினையெச்ச முழுவடிவம் செயலை வலியுறுத்துகிறது; ‘நிச்சயமாக’ என்பது அந்த வலியுறுத்தலை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: בֵּית
  choice: வீடு
  rationale: இங்கு குறிக்கப்படுவது ஆலயம் என்றாலும், எபிரெயச் சொல்லின் நேரடிப் பொருளான ‘வீடு’ என்பதையும் ‘தேவனுடைய வீடு’ என்ற இறையியல் ஒலிப்பையும் காக்கிறது.
- source_word: זְבֻל
  choice: மேன்மைமிக்க
  rationale: உயர்ந்த அல்லது மகத்துவமிக்க உறைவிடத்தைக் குறிக்கும் இச்சொல், ‘வீடு’ என்பதுடன் இயல்பாக இணையும் பெயரடையாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: לָךְ
  choice: உமக்காக
  rationale: முன்னொட்டு பயன் அல்லது நோக்கைக் குறிக்கிறது; தேவனை நேரடியாக மரியாதையுடன் அழைப்பதைத் தமிழ் வடிவம் காக்கிறது.
- source_word: מָכוֹן
  choice: நிலைநிறுத்தப்பட்ட ஓர் இடம்
  rationale: உறுதியாக அமைக்கப்பட்ட, நிலையான இடம் என்ற சொல்லின் கருத்தைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: לְשִׁבְתְּךָ
  choice: நீர் குடியிருப்பதற்காக
  rationale: ישׁב என்பது உட்காருதல் அல்லது குடியிருத்தல் எனப் பொருள்படலாம்; ஆலயமும் வீடும் பற்றிய சூழலில் ‘குடியிருப்பது’ தெளிவான முதன்மைப் பொருள். அரியணையில் அமர்தல் என்ற நிழற்பொருள் சாத்தியமாகவே உள்ளது.
- source_word: עוֹלָמִים
  choice: என்றென்றும்
  rationale: பன்மை வடிவம் நீடித்த காலத்தை வலியுறுத்துகிறது; ‘என்றென்றும்’ என்பது இயல்பான, மாண்பான தமிழ் வழக்கு.
theological_decisions:
- issue: ஆலயத்தை தேவனுடைய நிரந்தர உறைவிடமாகக் கூறும் மொழியை விளக்கவுரையால் மிதப்படுத்த வேண்டுமா
  choice: தேவன் குடியிருப்பதற்கான இடம் என்ற மூல மொழியைத் தகுதிப்படுத்தாமல் தக்கவைத்தல்
  alternative: ‘உமது பெயர் தங்கும் இடம்’ அல்லது ‘உம்மை வழிபடும் இடம்’ என்று விளக்கிப் பரிமாற்றுதல்
  rationale: எபிரெய உரை நேரடியாக தேவனுக்கான வீட்டையும் அவர் குடியிருப்பதற்கான இடத்தையும் கூறுகிறது. பரந்த வேதாகமச் சூழலிலிருந்து விளக்கங்களை இவ்வசனத்திற்குள் சேர்க்காமல், ஆலயத்தில் தேவ பிரசன்னம் குறித்த உடன்படிக்கை மொழியை மொழிபெயர்ப்பு காக்க வேண்டும்.
translation_notes:
  register: நவீன நிலையான தமிழில், தேவனை நோக்கிய மரியாதை ஒருமை வடிவங்களான ‘உமக்கு’, ‘நீர்’ பயன்படுத்தப்பட்டுள்ளன. எபிரெயக் கவிதைநடையின் இரு இணையான கூறுகளையும் இயல்பான தமிழில் காக்கும் பொருட்டு ‘கட்டியிருக்கிறேன்’ இரண்டாம் கூறிலும் வெளிப்படையாக இடப்பட்டுள்ளது; ‘வீடு’ என்பது ‘ஆலயம்’ என விளக்கப்படாமல் மூல உருவகத்தைத் தக்கவைக்கிறது.
