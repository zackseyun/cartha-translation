base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/049.yaml
  text: then hear in heaven[a], the place of your dwelling, their prayer and their plea, and uphold their cause[b],
translation:
  language: ta
  text: அப்போது, உமது உறைவிடமான பரலோகத்தில்[a] அவர்களுடைய ஜெபத்தையும் மன்றாட்டையும் கேட்டு, அவர்களுடைய வழக்கில் நீதியை நிலைநாட்டுவீராக[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உமது நிலைபெற்ற உறைவிடம்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொற்றொடர் நிறுவப்பட்ட அல்லது நிலையான உறைவிடத்தை வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: “அவர்களுக்கு நீதி வழங்குவீராக” அல்லது “அவர்களை நியாயப்படுத்துவீராக” என்றும் மொழிபெயர்க்கலாம். எபிரெயத்தில் சொல்லளவில் “அவர்களுடைய நீதியைச் செய்” என்று உள்ளது; இது அவர்களுடைய வழக்கிற்காகச் செயல்படுவதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַעְתָּ
  choice: அப்போது ... கேட்டு
  rationale: இது முந்தைய நிபந்தனைத் தொடர்களின் விளைவாக வரும் வேண்டுதல். இணைப்பை இயல்பான தமிழில் “அப்போது” என்றும், வேண்டுதலின் தொடரை “கேட்டு” என்றும் அளிக்கிறது.
- source_word: הַשָּׁמַיִם
  choice: பரலோகத்தில்
  rationale: சொல்லளவில் “வானங்கள்” என்றாலும், தொடர்ந்து வரும் “உமது உறைவிடம்” என்பதுடன் இது தேவனுடைய பரலோக உறைவிடத்தைக் குறிக்கிறது. இடைச்சொல் எபிரெயத்தில் வெளிப்படையாக இல்லாததால் “பரலோகத்திலிருந்து” என்று மொழிபெயர்க்காமல் “பரலோகத்தில்” எனத் தரப்பட்டுள்ளது.
- source_word: מְכוֹן שִׁבְתְּךָ
  choice: உமது உறைவிடமாகிய
  rationale: מָכוֹן என்பது நிலைபெற்ற அல்லது நிறுவப்பட்ட இடத்தைக் குறிக்கலாம். முதன்மை உரையில் இயல்பான “உறைவிடம்” பயன்படுத்தப்பட்டு, அதன் கூடுதல் நுண்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: תְּפִלָּתָם
  choice: அவர்களுடைய ஜெபம்
  rationale: תְּפִלָּה என்பதற்கான பொதுவான, தெளிவான தமிழ் இணைச்சொல்.
- source_word: תְּחִנָּתָם
  choice: அவர்களுடைய மன்றாட்டு
  rationale: இரக்கம் அல்லது தயவு நாடும் தீவிர வேண்டுதலைக் குறிக்கிறது; “ஜெபம்” என்பதிலிருந்து இதன் தனித்த நுண்பொருளையும் காக்கிறது.
- source_word: וְעָשִׂיתָ מִשְׁפָּטָם
  choice: அவர்களுடைய வழக்கில் நீதியை நிலைநாட்டுவீராக
  rationale: “அவர்களுடைய நியாயத்தைச் செய்” என்ற சொல்லாட்சியானது அவர்களுடைய சட்டரீதியான காரியத்தில் செயல்பட்டு நீதி வழங்குதல் அல்லது அவர்களை நியாயப்படுத்துதல் என்னும் பொருளுடைய எபிரெய மரபுத்தொடர். தமிழ் வாசகருக்கு அதன் நீதித்துறைப் பொருளை இயல்பாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: தேவன் பரலோகத்தில் உறைவதாகக் கூறும் உருவகமுள்ள மொழி
  choice: “உமது உறைவிடமாகிய பரலோகத்தில்” என்ற வேதாகமப் படிமத்தைத் தக்கவைத்தல்
  alternative: “உமது உறைவிடமாகிய பரலோகத்திலிருந்து”
  rationale: மூலவசனம் தேவன் கேட்கும் பரலோக உறைவிடத்தை ஆலய ஜெப மொழியில் குறிப்பிடுகிறது. தேவன் பரலோகத்திற்குள் இடரீதியாகக் கட்டுப்பட்டவர் என்ற கூடுதல் கோட்பாட்டைச் சேர்க்காமலும், மூலப் படிமத்தை அருவமாக்காமலும் மொழிபெயர்க்கப்பட்டுள்ளது.
- issue: מִשְׁפָּטָם என்பதன் நீதித்துறைப் பொருள்
  choice: அவர்களுடைய வழக்கில் நீதியை நிலைநாட்டுதல்
  alternative: அவர்களை நியாயப்படுத்துதல்
  rationale: இந்த மரபுத்தொடர் அவர்களுடைய காரியத்துக்காக நீதியுடன் செயல்படுவதைச் சொல்கிறது. அவர்கள் எந்தப் பொருளிலும் குற்றமற்றவர்கள் என்று முன்கூட்டியே தீர்மானிக்கும் விதத்தில் மொழிபெயர்க்காமல், நீதிச் செயலை மையப்படுத்துகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், ஜெபத்திற்குரிய கண்ணியமான மரியாதைப் பன்மை வினைமுற்று பயன்படுத்தப்பட்டுள்ளது. “ஜெபம்” மற்றும் “மன்றாட்டு” என்ற இணைச்சொற்கள் மூலத்தில் உள்ள இரு வேறுபட்ட வேண்டுதல் சொற்களின் நுண்பொருளைக் காக்கின்றன.
