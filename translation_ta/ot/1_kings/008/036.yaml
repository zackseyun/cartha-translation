revisions:
- from: அப்போது நீர் பரலோகத்தில் கேட்டு, உமது பணியாளர்களாகிய உமது மக்களான இஸ்ரவேலரின் பாவத்தை மன்னிப்பீராக. அவர்கள் நடக்கவேண்டிய நல்ல வழியை அவர்களுக்குக் கற்பிப்பீராக.[a] உமது மக்களுக்கு உரிமைச்சொத்தாகக் கொடுத்த உமது நாட்டின்மேல் மழையைப் பொழிவீராக.
