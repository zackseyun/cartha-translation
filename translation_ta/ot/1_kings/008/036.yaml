base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/036.yaml
  text: then may you hear in heaven and forgive the sin of your servants[a], your people Israel, when you teach them the good way in which they should walk. And may you give rain on your land[b], which you have given to your people as an inheritance.
translation:
  language: ta
  text: அப்போது நீர் பரலோகத்தில் கேட்டு, உமது சேவகர்களாகிய உமது மக்களான இஸ்ரவேலரின் பாவத்தை மன்னிப்பீராக. அவர்கள் நடக்கவேண்டிய நல்ல வழியை நீர் அவர்களுக்குக் கற்பிக்கும்போது,[a] உமது மக்களுக்கு மரபுரிமையாகக் கொடுத்த உமது நாட்டின்மேல் மழையைப் பொழிவீராக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஏனெனில் நீர் அவர்களுக்குத் அவர்கள் நடக்கவேண்டிய நல்ல வழியைக் கற்பிக்கிறீர்.” எபிரெயச் சொல் சூழலுக்கு ஏற்ப “ஏனெனில்” என்றும் புரிந்துகொள்ளப்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁמַע הַשָּׁמַיִם
  choice: பரலோகத்தில் கேட்டு
  rationale: எபிரெயச் சொற்றொடரில் முன்னிடைச்சொல் வெளிப்படையாக இல்லை. இச்சூழலில் தேவன் பரலோகத்தில் இருந்து விண்ணப்பத்தைக் கேட்பது குறிக்கப்படுவதால், இயல்பான தமிழில் ‘பரலோகத்தில் கேட்டு’ என வழங்கப்பட்டது.
- source_word: וְסָלַחְתָּ לְחַטַּאת
  choice: பாவத்தை மன்னிப்பீராக
  rationale: இங்கு חַטָּאת என்பது பாவபலியை அல்ல, மன்னிக்கப்பட வேண்டிய தவறை அல்லது பாவத்தைக் குறிக்கிறது.
- source_word: עֲבָדֶיךָ וְעַמְּךָ יִשְׂרָאֵל
  choice: உமது பணியாளர்களாகிய உமது மக்களான இஸ்ரவேலர்
  rationale: עֶבֶד என்பதற்கு இச்சூழலில் ‘பணியாளர்’ இயல்பானது. இஸ்ரவேலர் தேவனுடைய பணியாளர்களும் மக்களும் என்பதைக் காட்டும் இணைப்பைத் தமிழ் தெளிவாக்குகிறது.
- source_word: כִּי תוֹרֵם
  choice: அவர்கள் நடக்கவேண்டிய நல்ல வழியை அவர்களுக்குக் கற்பிப்பீராக
  rationale: כִּי இங்கு ‘ஏனெனில்’ என்றும் சூழ்நிலை அல்லது வேண்டுதலின் தொடர்ச்சி என்றும் புரிந்துகொள்ளப்படலாம். தொடர்ச்சியான வேண்டுதலாக வாசிப்பது எபிரெய வினை வடிவத்துக்கும் ஜெபத்தின் ஓட்டத்துக்கும் ஏற்றது; மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: הַדֶּרֶךְ הַטּוֹבָה אֲשֶׁר יֵלְכוּ בָהּ
  choice: அவர்கள் நடக்கவேண்டிய நல்ல வழி
  rationale: ‘வழி’ மற்றும் ‘நடத்தல்’ ஆகிய வாழ்க்கைநடத்தைச் சுட்டும் எபிரெய உருவகத்தைத் தமிழிலும் தக்கவைக்கிறது.
- source_word: וְנָתַתָּה מָטָר עַל אַרְצְךָ
  choice: உமது நாட்டின்மேல் மழையைப் பொழிவீராக
  rationale: מָטָר-ஐ נתן என்பதுடன் சொற்சொல்லாக ‘மழையைக் கொடுப்பீராக’ எனலாம்; இயல்பான தமிழில் ‘மழையைப் பொழிவீராக’ என்று வழங்கி, אַרְצְךָ-இன் இரண்டாம் நபர் உரிமையை ‘உமது நாடு’ எனப் பாதுகாக்கிறது.
- source_word: אֲשֶׁר נָתַתָּה לְעַמְּךָ לְנַחֲלָה
  choice: உமது மக்களுக்கு உரிமைச்சொத்தாகக் கொடுத்த
  rationale: נַחֲלָה என்பது தலைமுறை வழியான பங்கும் நிலையான உடைமையும் ஆகிய கருத்துகளை உடையது; ‘உரிமைச்சொத்து’ நவீன தமிழில் அதைத் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: நிலத்தின் தெய்வீக உரிமையும் இஸ்ரவேலுக்குக் கொடுக்கப்பட்ட உரிமைச்சொத்தும்
  choice: உமது மக்களுக்கு உரிமைச்சொத்தாகக் கொடுத்த உமது நாடு
  alternative: உமது மக்களுக்கு அவர்களுடைய உரிமைச்சொத்தாகக் கொடுத்த நாடு
  rationale: மூலத்தில் நிலம் ‘உமது’ என்று தேவனுக்குரியதாகக் கூறப்பட்டும், அதே நிலம் மக்களுக்கு நַחֲלָה ஆகக் கொடுக்கப்பட்டதாகவும் கூறப்படுகிறது. இந்த இரு கூறுகளின் இறையியல் அழுத்தமும் தக்கவைக்கப்பட்டது.
- issue: כִּי תוֹרֵם என்பதன் தொடர்பு
  choice: தனி வேண்டுதலாக ‘கற்பிப்பீராக’
  alternative: ‘ஏனெனில் நீர் அவர்களுக்குக் கற்பிக்கிறீர்’ அல்லது ‘நீர் அவர்களுக்குக் கற்பிக்கும்போது’
  rationale: வாவ்-தொடர் வினை வடிவமும் ஜெப வேண்டுதல்களின் வரிசையும் இதை வேண்டுதலாகப் புரிய இடமளிக்கின்றன. ஆயினும் כִּי காரண அல்லது காலத் தொடர்பையும் குறிக்கக்கூடும் என்பதால் மாற்று அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீன தரத்தமிழில் மரியாதை ஒருமை பயன்படுத்தப்பட்டுள்ளது. ஜெபத்தின் வேண்டுதல் தொனியை ‘மன்னிப்பீராக’, ‘கற்பிப்பீராக’, ‘பொழிவீராக’ என்பவை காக்கின்றன. ‘வழி/நடத்தல்’ உருவகமும், நிலம் தேவனுடையதாயிருந்தும் மக்களுக்கு உரிமைச்சொத்தாக அளிக்கப்பட்டதுமான அழுத்தமும் பாதுகாக்கப்பட்டுள்ளன.
