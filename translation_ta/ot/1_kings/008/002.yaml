translation:
  language: ta
  text: இஸ்ரவேலின் எல்லா ஆண்களும் ஏத்தானீம் மாதத்தில் நடந்த பண்டிகையின்போது சாலொமோன் அரசரிடம் ஒன்றுகூடினார்கள்; அது ஏழாம் மாதம்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקָּהֲלוּ
  choice: ஒன்றுகூடினார்கள்
  rationale: ஒரு கூட்டமாகச் சேர்வதைக் குறிக்கும் எபிரெய வினையின் இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: אֶל הַמֶּלֶךְ שְׁלֹמֹה
  choice: சாலொமோன் அரசரின் முன்னிலையில்
  rationale: אֶל என்பதன் திசை/அணுகல் பொருளைச் சூழலில் அரசரிடம் வந்து அவர் முன்னிலையில் கூடுதல் என இயல்பாக வெளிப்படுத்துகிறது; ஆங்கில ஆலோசனை உரையின் ‘before’ என்பதுடனும் ஒத்துள்ளது.
- source_word: כָּל אִישׁ יִשְׂרָאֵל
  choice: இஸ்ரவேல் ஆண்கள் அனைவரும்
  rationale: אִישׁ என்ற ஆண்பால் ஒருமைச் சொல்லை அதன் பகிர்வுப் பொருளுடன் (‘இஸ்ரவேலின் ஒவ்வொரு ஆணும்/அனைத்து ஆண்களும்’) தெளிவாகக் காட்டுகிறது.
- source_word: בְּיֶרַח הָאֵתָנִים
  choice: ஏத்தானீம் மாதத்தில்
  rationale: பண்டைய மாதப் பெயரை மொழிபெயர்த்து ஊகிக்காமல் ஒலிபெயர்த்து பாதுகாக்கிறது.
- source_word: בֶּחָג
  choice: பண்டிகையின்போது
  rationale: חַג என்பதன் சமய விழா/பண்டிகை பொருளையும் בְּ முன்னொட்டின் காலச் சூழலையும் இயல்பான தமிழில் தருகிறது.
- source_word: הוּא הַחֹדֶשׁ הַשְּׁבִיעִי
  choice: அதாவது ஏழாம் மாதத்தில்
  rationale: மூலத்தில் ஏத்தானீம் மாதத்தை ஏழாம் மாதம் என்று அடையாளப்படுத்தும் விளக்கத்தைத் தெளிவாகத் தக்கவைக்கிறது.
