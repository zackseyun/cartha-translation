review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the prayer, the Davidic succession motif, and the explicit condition on David’s sons. However, the opening construction makes David chiefly the indirect object of what Yahweh spoke, while the Hebrew also explicitly frames him as the beneficiary of the request ('keep/fulfill for your servant David'). A small recasting retains both relationships more clearly.
  naturalness: The register is dignified modern standard Tamil and the shifts between respectful address to Yahweh and singular address to David are appropriate. Replacing the somewhat awkward 'ஓர் ஆண் ... இல்லாமற்போக மாட்டான்' with an idiomatic dynastic expression improves readability without losing the male-successor reference.
  terminology: யாவே, அடியவன், அரியணை, வழியைக் காத்தல், and என் முன்னிலையில் நடத்தல் are suitable. 'நிறைவேற்றியருளும்' is a natural contextual rendering of שׁמר with a spoken promise as its object.
  issues:
  - severity: medium
    issue: The beneficiary force of לְעַבְדְּךָ is not fully explicit in the opening request.
    rationale: In 'உமது அடியவனும் என் தந்தையுமான தாவீதிடம் நீர் சொன்னதை,' David is naturally construed as the person to whom God spoke, but the Hebrew asks God to keep/fulfill the word for David as his servant as well. 'உமது அடியவனான என் தந்தை தாவீதுக்காக' retains this force, while 'அவனிடம் நீர் சொன்னதை' preserves the separate indirect object of דִּבַּרְתָּ לוֹ.
  - severity: low
    issue: ‘ஓர் ஆண் உனக்கு இல்லாமற்போக மாட்டான்’ is less idiomatic Tamil for the dynastic idiom.
    rationale: ‘இஸ்ரவேலின் அரியணையில் அமர ஒருவன் உனக்குக் குறைவுபடமாட்டான்’ naturally communicates that David will not lack a male descendant to occupy Israel’s throne. The literal ‘cut off’ wording remains available in the footnote.
