base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/025.yaml
  text: And now[a], Yahweh, God of Israel, keep for your servant David my father what you spoke to him, saying, ‘A man shall not be cut off from before me for you, one sitting on the throne of Israel, if only your sons keep their way, by walking before me as you have walked before me.’
translation:
  language: ta
  text: இப்போது, இஸ்ரவேலின் கடவுளாகிய யாவே, உமது அடியவனான என் தந்தை தாவீதுக்காக, அவனிடம் நீர் சொன்னதை நிறைவேற்றியருளும். நீர் அவனிடம், “இஸ்ரவேலின் அரியணையில் அமர ஒருவன் உனக்குக் குறைவுபடமாட்டான்[a]; ஆனால், உன் மகன்கள் தங்கள் வழியைக் காத்து, நீ என் முன்னிலையில் நடந்ததுபோல் அவர்களும் என் முன்னிலையில் நடந்தால் மட்டுமே” என்று சொன்னீர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “உனக்காக ஓர் ஆண் என் முன்னிலையிலிருந்து அறுக்கப்பட மாட்டான்.” இது தாவீதின் அரசவம்சத்தில் இஸ்ரவேலின் அரியணையில் அமர ஒருவர் இல்லாமல் போகமாட்டார் என்பதைக் குறிக்கும் எபிரெய மொழிமரபு.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: இப்போது
  rationale: வேண்டுதலின் அடுத்த கட்டத்தை அறிமுகப்படுத்தும் இயல்பான நவீனத் தமிழ் இணைப்பு.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், எபிரெய தனிப்பெயரின் பொதுவாக ஏற்கப்படும் ஒலிபெயர்ப்பைத் தமிழில் தருகிறது.
- source_word: שְׁמֹר
  choice: நிறைவேற்றியருளும்
  rationale: வாக்குறுதியைச் செயப்படுபொருளாகக் கொண்ட இச்சூழலில் ‘காத்தல்’ என்பதன் நோக்கம் அதை நிறைவேற்றுவதாகும்; தமிழ் வேண்டுதல் நடையில் இது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: לְעַבְדְּךָ דָוִד אָבִי
  choice: உமது அடியவனும் என் தந்தையுமான தாவீது
  rationale: עבד என்பதன் உடன்படிக்கைச் சூழலிலான பணிவை ‘அடியவன்’ வெளிப்படுத்துகிறது; தாவீதுக்கும் சாலொமோனுக்கும் உள்ள உறவும் தெளிவாகிறது.
- source_word: לֹא יִכָּרֵת לְךָ אִישׁ מִלְּפָנַי
  choice: ஓர் ஆண் உனக்கு இல்லாமற்போக மாட்டான்
  rationale: எபிரெய மொழிமரபின் அரசவம்சத் தொடர்ச்சி என்ற பொருளை இயல்பான தமிழில் தருகிறது; ‘உனக்கு’ என்பது לְךָ-ஐத் தக்கவைக்கிறது. சொல்லுக்குச் சொல் உருவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: יֹשֵׁב עַל כִּסֵּא יִשְׂרָאֵל
  choice: இஸ்ரவேலின் அரியணையில் அமர்ந்திருக்கும்
  rationale: எபிரெயப் பங்கேற்புவினையின் தொடர்ச்சியான அரசப் பணியைக் காட்டுகிறது; தமிழில் பெயரை இயல்பாக வரையறுக்கிறது.
- source_word: רַק אִם
  choice: ஆனால் … மட்டுமே
  rationale: வாக்குறுதிக்கு இணைக்கப்பட்டுள்ள வலுவான நிபந்தனையை மறைக்காமல் காட்டுகிறது.
- source_word: יִשְׁמְרוּ בָנֶיךָ אֶת דַּרְכָּם
  choice: உன் மகன்கள் தங்கள் வழியைக் காத்து
  rationale: ‘வழி’ என்ற எபிரெய உருவகத்தையும், தங்கள் நடத்தையை விழிப்புடன் பேணுதல் என்ற கருத்தையும் தக்கவைக்கிறது.
- source_word: לָלֶכֶת לְפָנַי כַּאֲשֶׁר הָלַכְתָּ לְפָנָי
  choice: நீ என் முன்னிலையில் நடந்ததுபோல் அவர்களும் என் முன்னிலையில் நடந்தால்
  rationale: கடவுளுக்கு முன்பாக வாழ்வது என்ற எபிரெய உருவகத்தையும் தாவீதின் முன்மாதிரியையும் இயல்பான தமிழில் பாதுகாக்கிறது.
theological_decisions:
- issue: தாவீதின் அரசவம்ச வாக்குறுதிக்கான நிபந்தனை
  choice: மகன்கள் கடவுளின் முன்னிலையில் நடப்பது அரசவம்சத் தொடர்ச்சிக்கான வெளிப்படையான நிபந்தனையாக மொழிபெயர்க்கப்பட்டது.
  alternative: இது நிபந்தனையற்ற வாக்குறுதி; கீழ்ப்படிதல் அதன் அனுபவப் பலனை மட்டுமே பாதிக்கிறது என்று விளக்குதல்.
  rationale: רַק אִם என்பது தெளிவான நிபந்தனையை அறிமுகப்படுத்துகிறது. பிற உடன்படிக்கை உரைகளின் அடிப்படையில் இவ்வசனத்தின் இறையியல் பதற்றத்தைத் தீர்த்துவிடாமல் மொழிபெயர்ப்பு அதைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான வேண்டுதல் நடை பயன்படுத்தப்பட்டுள்ளது. சாலொமோன் கடவுளை நோக்கிப் பேசும்போது மரியாதைப் பன்மையான ‘நீர்/உமது’ பயன்படுத்தப்பட்டுள்ளது; மேற்கோளுக்குள் கடவுள் தாவீதை நோக்கிப் பேசுவதால் ‘நீ/உன்’ பயன்படுத்தப்பட்டுள்ளது. எபிரெய உருவகங்களான ‘வழியைக் காத்தல்’, ‘என் முன்னிலையில் நடத்தல்’ ஆகியவை புரியத்தக்க தமிழில் தக்கவைக்கப்பட்டுள்ளன.
