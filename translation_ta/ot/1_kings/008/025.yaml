- from: இப்போது, இஸ்ரவேலின் கடவுளாகிய யாவே, உமது அடியவனும் என் தந்தையுமான தாவீதிடம் நீர் சொன்னதை நிறைவேற்றியருளும். நீர் அவனிடம், “என் முன்னிலையில் இஸ்ரவேலின் அரியணையில் அமர்ந்திருக்கும் ஓர் ஆண் உனக்கு இல்லாமற்போக மாட்டான்[a]—ஆனால் உன் மகன்கள் தங்கள் வழியைக் காத்து, நீ என் முன்னிலையில் நடந்ததுபோல் அவர்களும் என் முன்னிலையில் நடந்தால் மட்டுமே இது நடக்கும்” என்று சொன்னீர்.
