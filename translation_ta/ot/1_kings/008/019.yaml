source:
  edition: WLC
  text: רַ֣ק אַתָּ֔ה לֹ֥א תִבְנֶ֖ה הַ/בָּ֑יִת כִּ֤י אִם בִּנְ/ךָ֙ הַ/יֹּצֵ֣א מֵ/חֲלָצֶ֔י/ךָ הֽוּא יִבְנֶ֥ה הַ/בַּ֖יִת לִ/שְׁמִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/019.yaml
  text: Nevertheless[a], you shall not build the house; rather, your son who comes from your own body, he shall build the house for my name.
translation:
  language: ta
  text: ஆனாலும், நீ அந்த இல்லத்தைக் கட்டமாட்டாய்; மாறாக, உன் உடலிலிருந்து பிறக்கும் உன் மகனே[a] என் பெயருக்காக அந்த இல்லத்தைக் கட்டுவான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்சொல்லாக, “உன் இடுப்பிலிருந்து புறப்படுகிறவன்”; இது உன் சொந்த உடல்வழிப் பிறந்த சந்ததியைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: ஆனாலும்
  rationale: முந்தைய ஒப்புதலை வரையறுக்கும் சலுகைமிகு எதிர்மறைத் திருப்பத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לֹא תִבְנֶה
  choice: நீ ... கட்டமாட்டாய்
  rationale: இறை அறிவிப்பில் உள்ள எதிர்காலத் தீர்மானம்/தடை என்ற இருபொருள் சாத்தியத்தைத் தீர்த்துவிடாமல் காக்கிறது.
- source_word: הַבָּיִת
  choice: அந்த இல்லம்
  rationale: குறிப்பது ஆலயமாக இருந்தாலும், எபிரெய மூலத்தின் ‘இல்லம்’ என்ற இறையியல் நிறைந்த சொல்லாட்சியைத் தக்கவைக்கிறது.
- source_word: כִּי אִם
  choice: மாறாக
  rationale: ‘நீ அல்ல, உன் மகன்’ என்ற திருத்தமிகு முரண்பாட்டைத் தெளிவாகக் காட்டுகிறது.
- source_word: בִּנְךָ
  choice: உன் மகன்
  rationale: சூழலில் குறிப்பிட்ட ஒரு மகனைச் சுட்டும் ஒருமை வடிவத்தை நேரடியாக வழங்குகிறது.
- source_word: הַיֹּצֵא מֵחֲלָצֶיךָ
  choice: உன் உடலிலிருந்து பிறக்கும்
  rationale: உடல்வழிப் பிறப்பைக் குறிக்கும் எபிரெய மரபுத்தொடரை நவீனத் தமிழில் தெளிவாகத் தருகிறது; சொற்சொல்லான வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: הוּא
  choice: உன் மகனே
  rationale: தாவீது அல்ல, அந்த மகன்தான் கட்டுவான் என்ற தனிப்பட்ட சுட்டுப்பெயரின் வலியுறுத்தலை ‘-ஏ’ மூலம் வெளிப்படுத்துகிறது.
- source_word: יִבְנֶה הַבַּיִת
  choice: அந்த இல்லத்தைக் கட்டுவான்
  rationale: மூலத்தில் ‘இல்லத்தைக் கட்டுதல்’ மீண்டும் வருவதைத் தக்கவைத்து, உறுதியான எதிர்கால இறை அறிவிப்பாக மொழிபெயர்க்கிறது.
- source_word: לִשְׁמִי
  choice: என் பெயருக்காக
  rationale: ஆண்டவருக்கு அர்ப்பணிக்கப்பட்ட இல்லத்தைக் குறிக்கும் உடன்படிக்கை சார்ந்த மூல மொழிநடையை விளக்கவுரையின்றித் தக்கவைக்கிறது.
theological_decisions:
- issue: בַּיִת என்பதை ‘இல்லம்’ எனவா, விளக்கமாக ‘ஆலயம்’ எனவா மொழிபெயர்ப்பது
  choice: இல்லம்
  alternative: ஆலயம்
  rationale: இங்கு குறிக்கப்படுவது ஆலயமே என்றாலும், மூல உரை ‘இல்லம்’ என்கிறது. ஆண்டவரின் பெயருக்காகக் கட்டப்படும் இல்லம் என்ற முக்கியமான வேதாகமச் சொல்லாட்சியைத் தக்கவைக்க, விளக்கமான ‘ஆலயம்’ என்பதற்குப் பதில் ‘இல்லம்’ பயன்படுத்தப்படுகிறது.
- issue: לֹא תִבְנֶה என்பதைத் தடை அல்லது முன்னறிவிப்பு எனத் தீர்மானிப்பது
  choice: கட்டமாட்டாய்
  alternative: கட்டக்கூடாது
  rationale: எதிர்மறை imperfect வடிவம் இறைத் தீர்மானத்தையும் தடையையும் உணர்த்தக்கூடும். ‘கட்டமாட்டாய்’ என்பது அந்த பதற்றத்தைப் பெருமளவு காக்கிறது; ‘கட்டக்கூடாது’ என்பது தடையாக மட்டும் தீர்த்துவிடும்.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘உன் மகனே’ என்பது הוּא-வின் வலியுறுத்தலை இயல்பாகக் காட்டுகிறது. ‘அந்த இல்லம்’ என்பது ஏற்கெனவே உரையாடலில் குறிப்பிடப்பட்ட குறிப்பிட்ட இல்லத்தைச் சுட்டுகிறது.
