source:
  edition: WLC
  text: יְהִ֨י יְהוָ֤ה אֱלֹהֵ֨י/נוּ֙ עִמָּ֔/נוּ כַּ/אֲשֶׁ֥ר הָיָ֖ה עִם אֲבֹתֵ֑י/נוּ אַל יַעַזְבֵ֖/נוּ וְ/אַֽל יִטְּשֵֽׁ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/057.yaml
  text: May Yahweh our God be with us[a], as he was with our fathers. May he not forsake us or abandon us.
translation:
  language: ta
  text: நம் கடவுளாகிய யாவே, அவர் நம் தந்தையரோடு[a] இருந்ததுபோல நம்மோடும் இருப்பாராக. அவர் நம்மை விட்டுவிடவோ கைவிடவோ வேண்டாம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நம் முன்னோர்களோடு.’ எபிரெயத்தில் ‘நம் தந்தையரோடு’ என்று உள்ளது; இது இஸ்ரவேலின் முற்பிதாக்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי
  choice: இருப்பாராக
  rationale: Qal விருப்பநிலை வடிவம் ஒரு வேண்டுதல் அல்லது ஜெபத்தை வெளிப்படுத்துகிறது; தமிழில் ‘இருப்பாராக’ அதன் வேண்டுதல் வலிமையை இயல்பாகக் காட்டுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֱלֹהֵינוּ
  choice: நம் கடவுள்
  rationale: முதலாம் நபர் பன்மை உரிமை விகுதியுடன் உள்ள சொல்லின் நேரடியான பொருள் ‘நம் கடவுள்’ என்பதாகும்.
- source_word: עִמָּנוּ
  choice: நம்மோடும்
  rationale: இங்கு עִם உடனிருப்பையும் துணைநிற்பையும் குறிக்கிறது; ‘நம்மோடும்’ ஒப்பீட்டு வாக்கியத்தில் இயல்பாக அமைகிறது.
- source_word: כַּאֲשֶׁר
  choice: இருந்ததுபோல
  rationale: கடந்தகாலத்தில் முன்னோர்களுடன் இருந்த இறை உடனிருப்பையும் இப்போதைய வேண்டுதலையும் ஒப்பிடும் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: הָיָה עִם אֲבֹתֵינוּ
  choice: நம் தந்தையரோடு இருந்ததுபோல
  rationale: אֲבוֹת என்ற ஆண்பால் பன்மைச் சொல்லை ‘தந்தையர்’ என முறையாகப் பாதுகாக்கிறது; சூழலில் இது இஸ்ரவேலின் முன்னோர்களைக் குறிக்கிறது.
- source_word: אַל יַעַזְבֵנוּ
  choice: அவர் நம்மை விட்டுவிடாமலும்
  rationale: எதிர்மறை விருப்பநிலை, கடவுள் தம் மக்களை விட்டுச் செல்லாதிருக்க வேண்டும் என்ற வேண்டுதலைக் குறிக்கிறது. ‘விட்டுவிடாமல்’ עזב என்பதன் அடிப்படைப் பொருளைப் பாதுகாக்கிறது.
- source_word: וְאַל יִטְּשֵׁנוּ
  choice: நம்மைக் கைவிடாமலும் இருப்பாராக
  rationale: נטש முற்றாகக் கைவிடுதல் அல்லது ஆதரவின்றி விட்டுவிடுதல் என்ற வலிமையைக் கொண்டது. ‘கைவிடாமல்’ முதல் வினையோடு உள்ள இணைநிலையையும் சிறிய பொருள் வேறுபாட்டையும் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: எபிரெய உரையில் தனிப்பட்ட இறைப் பெயரே உள்ளது. அதை ஒரு பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் தன்மையைப் பாதுகாக்கிறது.
- issue: אֲבֹתֵינוּ என்பதன் மொழிபெயர்ப்பு
  choice: நம் தந்தையர்
  alternative: நம் முன்னோர்
  rationale: மூலச்சொல் சொற்படியாக ‘நம் தந்தையர்’ என்று கூறுகிறது. அது இங்கு இஸ்ரவேலின் முற்பிதாக்கள் அல்லது முன்னோர்களைக் குறிக்கிறது என்பதால் மாற்று விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: இரண்டு எதிர்மறை வேண்டுதல்களின் இணைநிலை
  choice: விட்டுவிடாமலும் ... கைவிடாமலும்
  alternative: கைவிடாமலும் ... புறக்கணிக்காமலும்
  rationale: עזב மற்றும் נטש ஆகிய இரு வினைகளும் பொருளில் நெருக்கமானவை; இருப்பினும் அவற்றை ஒரே சொல்லாகச் சுருக்காமல், விட்டுச் செல்லுதல் மற்றும் முற்றாகக் கைவிடுதல் என்ற நுண்ணிய வேறுபாட்டுடன் வழங்குகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், ஜெபத்திற்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘இருப்பாராக’ என்ற வேண்டுதல் வடிவம் இரு வாக்கியங்களிலும் பயன்படுத்தப்பட்டு, எபிரெய விருப்பநிலையின் வலிமை காக்கப்பட்டுள்ளது.
