  text: וַ/יִּזְבַּ֣ח שְׁלֹמֹ֗ה אֵ֣ת זֶ֣בַח הַ/שְּׁלָמִים֮ אֲשֶׁ֣ר זָבַ֣ח לַ/יהוָה֒ בָּקָ֗ר עֶשְׂרִ֤ים וּ/שְׁנַ֨יִם֙ אֶ֔לֶף וְ/צֹ֕אן מֵאָ֥ה וְ/עֶשְׂרִ֖ים אָ֑לֶף וַֽ/יַּחְנְכוּ֙ אֶת בֵּ֣ית יְהוָ֔ה הַ/מֶּ֖לֶךְ וְ/כָל בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/063.yaml
  text: 'And Solomon sacrificed the sacrifice of peace offerings that he sacrificed to Yahweh: twenty-two thousand cattle and one hundred twenty thousand sheep[b][a]. So the king and all the sons of Israel dedicated the house of Yahweh.'
translation:
  language: ta
  text: சாலொமோன் யாவேக்குச் சமாதானப் பலிகளாக[a] இருபத்திரண்டாயிரம் மாடுகளையும் நூற்று இருபதாயிரம் ஆடுகளையும்[b] பலியிட்டான். இவ்வாறு அரசனும் இஸ்ரவேல் மக்கள் அனைவரும்[c] யாவேயின் ஆலயத்தை அர்ப்பணித்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சமாதானப் பலிகள்” என்பதை “உறவுப் பலிகள்” அல்லது “நலவாழ்வுப் பலிகள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இங்குள்ள எபிரெயச் சொல் செம்மறியாடுகளையும் வெள்ளாடுகளையும் உள்ளடக்கிய சிறுகால்நடை மந்தையைக் குறிக்கலாம்.
    reason: lexical_range
  - marker: c
    text: எபிரெயத்தில் எழுத்துப்படி, “இஸ்ரவேலின் மகன்கள்”; அதாவது, இஸ்ரவேல் மக்கள்.
    reason: literal_rendering
lexical_decisions:
- source_word: וַיִּזְבַּח
  choice: பலியிட்டான்
  rationale: பலிச் சடங்கைக் குறிக்கும் זבח என்ற வினையின் பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: זֶבַח הַשְּׁלָמִים
  choice: சமாதானப் பலிகள்
  rationale: שְׁלָמִים என்பதற்கான மரபாக அறியப்பட்ட பலியியல் சொல்லைத் தக்கவைக்கிறது; உறவு, நல்வாழ்வு ஆகிய பொருள் நுணுக்கங்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: יהוה என்ற உடன்படிக்கைப் பெயரைப் பட்டப்பெயராக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: בָּקָר
  choice: மாடுகள்
  rationale: மாட்டினத்தைத் தொகுதியாகக் குறிக்கும் எபிரெயச் சொல்லுக்கு இயல்பான நவீனத் தமிழ் இணை.
- source_word: צֹאן
  choice: ஆடுகள்
  rationale: சிறுகால்நடை மந்தையைக் குறிக்கும் சொல்லுக்கு வாசிப்பில் இயல்பான சுருக்கமான தமிழ்; செம்மறியாடுகளும் வெள்ளாடுகளும் உட்படலாம் என்ற பரப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וַיַּחְנְכוּ
  choice: அர்ப்பணித்தார்கள்
  rationale: ஆலயத்தைப் புனிதப் பயன்பாட்டுக்காகத் தொடங்கி வைக்கும் அர்ப்பணிப்புச் செயலைச் சூழலுக்கேற்ற வகையில் தெரிவிக்கிறது.
- source_word: בֵּית יְהוָה
  choice: யாவேயின் ஆலயம்
  rationale: எழுத்துப்படி ‘யாவேயின் வீடு’ என்றாலும், இச்சூழலில் குறிக்கப்படுவது ஆலயம் என்பதால் நவீனத் தமிழில் தெளிவாக வழங்கப்படுகிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: எழுத்துப்படியான ‘இஸ்ரவேலின் மகன்கள்’ இங்கு இஸ்ரவேலர் அனைவரையும் குறிக்கும் மரபுத்தொடர்; உள்ளடங்கிய கூட்டுப்பொருளை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் வரும் தனிப்பட்ட உடன்படிக்கைப் பெயரைப் பொதுப் பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்த்து, அதன் தனித்தன்மையைப் பாதுகாக்கிறது.
- issue: בְּנֵי יִשְׂרָאֵל என்ற ஆண்பால் மரபுத்தொடரின் கூட்டுப்பொருள்
  choice: இஸ்ரவேல் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: இச்சூழலில் அரசனோடு ஆலய அர்ப்பணிப்பில் கலந்துகொண்ட இஸ்ரவேலர் அனைவரையும் இந்த மரபுத்தொடர் குறிக்கிறது; எழுத்துப்படியான வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. பலியியல் மரபுச்சொல் தக்கவைக்கப்பட்டு அதன் பொருள் நுணுக்கங்கள் அடிக்குறிப்புகளில் வழங்கப்பட்டுள்ளன; மூலத்தின் நீண்ட வாக்கியம் தமிழின் இயல்புக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது.
