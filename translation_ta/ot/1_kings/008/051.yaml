  text: כִּֽי עַמְּ/ךָ֥ וְ/נַחֲלָתְ/ךָ֖ הֵ֑ם אֲשֶׁ֤ר הוֹצֵ֨אתָ֙ מִ/מִּצְרַ֔יִם מִ/תּ֖וֹךְ כּ֥וּר הַ/בַּרְזֶֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/051.yaml
  text: For they are your people and your inheritance[a], whom you brought out of Egypt[b], out of the midst of the iron furnace.
translation:
  language: ta
  text: ஏனெனில், அவர்கள் உமது மக்களும் உமது சுதந்தரமும்[a] ஆவர்; நீர் அவர்களை எகிப்திலிருந்து, இரும்புச் சூளையின் நடுவிலிருந்து[b] வெளியே கொண்டுவந்தீர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உமது உடைமை’ அல்லது ‘உமது மரபுரிமை.’
    reason: lexical_alternative
  - marker: b
    text: ‘இரும்புச் சூளை’ என்பது கடுமையான ஒடுக்குதலும் துன்பமும் நிறைந்த இடமாகிய எகிப்தைக் குறிக்கும் உருவகம்; உபாகமம் 4:20-ஐ ஒப்பிடுக.
    reason: cross_reference
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: சுற்றியுள்ள சாலொமோனின் வேண்டுதலுக்கான காரணத்தை அறிமுகப்படுத்துகிறது; தமிழில் விளக்கக் காரணத்தை இயல்பாகக் குறிக்கிறது.
- source_word: עַמְּךָ
  choice: உமது மக்கள்
  rationale: தேவனுடனான உடன்படிக்கை உறவில் இஸ்ரவேலைக் குறிக்கும் நேரடியான, மரியாதைநிறைந்த மொழிபெயர்ப்பு.
- source_word: וְנַחֲלָתְךָ
  choice: உமது சுதந்தரம்
  rationale: נַחֲלָה என்பதிலுள்ள சுதந்தரம் அல்லது பங்காகிய உடைமை என்ற கருத்தையும், மக்கள் தேவனுக்குரியவர்கள் என்ற உடன்படிக்கை சார்ந்த நிறையையும் காக்கிறது.
- source_word: הֵם
  choice: அவர்கள் ... ஆவர்
  rationale: எபிரெயத்தில் வலியுறுத்தப்பட்ட தனிப்பட்ட சுட்டுப்பெயரைத் தமிழில் இயல்பான பயனிலை அமைப்பால் வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר הוֹצֵאתָ
  choice: நீர் அவர்களை ... வெளியே கொண்டுவந்தீர்
  rationale: יצא வினையின் ஹிஃபில் வடிவிலுள்ள காரணவினைப் பொருளையும் யாத்திராகமச் செயலைக் குறிக்கும் வழக்கையும் தெளிவாகக் காக்கிறது.
- source_word: מִמִּצְרַיִם
  choice: எகிப்திலிருந்து
  rationale: விடுதலையின் தொடக்க இடத்தை இயல்பாகக் குறிக்கிறது.
- source_word: מִתּוֹךְ
  choice: நடுவிலிருந்து
  rationale: ஒன்றின் உள்ளிருந்து வெளியே வருதல் என்ற தெளிவான இடவியல் உருவகத்தைப் பாதுகாக்கிறது.
- source_word: כּוּר הַבַּרְזֶל
  choice: இரும்பு உருக்கலை
  rationale: கடுமையான ஒடுக்குதலைச் சுட்டும் மூல உருவகத்தை விளக்கமாக மாற்றாமல், நவீன தமிழில் புரியக்கூடியவாறு தருகிறது.
theological_decisions:
- issue: இஸ்ரவேல் தேவனுடைய ‘சுதந்தரம்’ எனும் உடன்படிக்கை சார்ந்த அடையாளம்
  choice: முதன்மை உரையில் ‘உமது சுதந்தரம்’ என்று வைத்தல்
  alternative: உமது உடைமை; உமது மரபுரிமை
  rationale: எபிரெயச் சொல் பங்காக ஒதுக்கப்பட்ட உடைமை மற்றும் சுதந்தரம் ஆகிய இரு நிழற்பொருள்களையும் கொண்டது. ‘சுதந்தரம்’ அந்த உடன்படிக்கை சார்ந்த கனத்தைத் தக்கவைக்கிறது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், வேதாகம ஜெபச் சூழலுக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. தேவனை நோக்கும் ஒருமை மரியாதை வடிவங்களாக ‘உமது’, ‘நீர்’, ‘கொண்டுவந்தீர்’ பயன்படுத்தப்பட்டுள்ளன; மூலத்தின் உருவகமும் காரணத் தொடர்பும் காக்கப்பட்டுள்ளன.
