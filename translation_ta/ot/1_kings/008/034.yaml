  text: then may you hear in heaven and forgive the sin of your people Israel[c][b][a], and bring them back to the land that you gave to their fathers.
translation:
  language: ta
  text: அப்போது நீர் பரலோகத்தில் கேட்டு, உமது மக்களாகிய இஸ்ரவேலரின் பாவத்தை மன்னித்து, அவர்களுடைய முற்பிதாக்களுக்கு நீர் கொடுத்த நாட்டிற்கு அவர்களைத் திரும்பக் கொண்டுவருவீராக.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பரலோகத்திலிருந்து கேட்டு” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “முற்பிதாக்கள்” என்பது கடவுள் நாட்டைக் கொடுத்த பண்டைய பிதாக்களைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: תִּשְׁמַע הַשָּׁמַיִם
  choice: பரலோகத்தில் கேட்டு
  rationale: எபிரெயச் சொற்றொடரில் இடைச்சொல் வெளிப்படையாக இல்லாவிட்டாலும், இச்சூழலில் שָׁמַיִם கடவுளின் வாசஸ்தலமாகிய பரலோகத்தைக் குறிக்கிறது. ‘பரலோகத்தில் கேட்டு’ என்பது மூலத்தின் அமைப்பையும் தமிழில் இயல்பான மன்றாட்டு நடையையும் காக்கிறது.
- source_word: וְסָלַחְתָּ לְחַטַּאת
  choice: பாவத்தை மன்னித்து
  rationale: סלח என்பது கடவுள் பாவத்தை மன்னிப்பதைக் குறிக்கிறது; חטאת இங்கு பாவபலியைக் குறிக்காமல், இஸ்ரவேலரின் பாவத்தை ஒருமைத் தொகுப்புப் பொருளில் குறிக்கிறது.
- source_word: עַמְּךָ יִשְׂרָאֵל
  choice: உமது மக்களாகிய இஸ்ரவேலரின்
  rationale: இஸ்ரவேல் உமது மக்கள் என்பதைத் தெளிவாகவும் இயல்பான நவீனத் தமிழிலும் வெளிப்படுத்த ‘மக்களாகிய’ பயன்படுத்தப்பட்டது.
- source_word: וַהֲשֵׁבֹתָם
  choice: அவர்களைத் திரும்பக் கொண்டுவருவீராக
  rationale: שוב என்பதன் ஹிஃபில் வடிவம் ‘திரும்பும்படி செய்தல்’ என்ற காரணவினைப் பொருளைக் கொண்டது. நாட்டிற்கு நிகழும் இடஞ்சார்ந்த மீள்வருகையை இத்தேர்வு தெளிவாகக் காட்டுகிறது.
- source_word: אֶל הָאֲדָמָה
  choice: நாட்டிற்கு
  rationale: אֲדָמָה என்பதற்கு நிலம் அல்லது மண் என்ற பொருள்கள் இருந்தாலும், இங்கு முன்னோர்களுக்குக் கொடுக்கப்பட்ட உடன்படிக்கை நாட்டைக் குறிப்பதால் ‘நாடு’ பொருத்தமானது.
- source_word: אֲשֶׁר נָתַתָּ לַאֲבוֹתָם
  choice: அவர்களுடைய முன்னோர்களுக்கு நீர் கொடுத்த
  rationale: אָבוֹתָם இங்கு நில வாக்குத்தத்தத்தைப் பெற்ற முற்பிதாக்களைச் சுட்டுகிறது. நவீனத் தமிழில் ‘முன்னோர்கள்’ இயல்பாகவும் மரியாதையாகவும் அச்சுட்டுதலைத் தக்கவைக்கிறது; அதன் குறிப்பான பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
theological_decisions:
- issue: לַאֲבוֹתָם என்ற உடன்படிக்கை மொழியின் மொழிபெயர்ப்பு
  choice: அவர்களுடைய முன்னோர்களுக்கு
  alternative: அவர்களுடைய தந்தையருக்கு / முற்பிதாக்களுக்கு
  rationale: தமிழில் ‘தந்தையர்’ என்பது உடனடியான தந்தைகளாகத் தவறாகப் புரியக்கூடும்; ‘முற்பிதாக்கள்’ சபைசார் சொல்லாக ஒலிக்கலாம். ‘முன்னோர்கள்’ இயல்பாக உள்ளது; நில வாக்குத்தத்தம் பெற்ற முற்பிதாக்களே குறிக்கப்படுகிறார்கள் என்பதை அடிக்குறிப்பு காக்கிறது.
- issue: וַהֲשֵׁבֹתָם என்பதிலுள்ள மீட்டுக்கொண்டுவரும் கருத்து
  choice: நாட்டிற்கு அவர்களைத் திரும்பக் கொண்டுவருவீராக
  alternative: அவர்களை நாட்டில் மீண்டும் நிலைநிறுத்துவீராக
  rationale: இவ்வசனம் பொதுவான ஆன்மீக மறுசீரமைப்பை மட்டும் அல்லாமல், தண்டனையால் அகன்ற மக்களை நாட்டிற்குத் திரும்பக் கொண்டுவரும் இடஞ்சார்ந்த செயலைக் குறிக்கிறது. தேர்ந்தெடுத்த மொழி அந்தக் காரணவினை மற்றும் இடஞ்சார்ந்த பொருளைக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மன்றாட்டுக்குரிய மரியாதை நடையைப் பேண ‘நீர்’, ‘உமது’, ‘வருவீராக’ ஆகிய வடிவங்கள் பயன்படுத்தப்பட்டன. சொற்றொடர் இயல்பாக இருக்கும்படி எபிரெய இணைப்புகள் தமிழில் வினையெச்சத் தொடராக அமைக்கப்பட்டன.
