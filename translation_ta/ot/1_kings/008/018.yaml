base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/018.yaml
  text: But Yahweh said to David my father[a], ‘Because it was in your heart to build a house for my name, you did well that it was in your heart.’
translation:
  language: ta
  text: ஆனால் யாவே என் தந்தையான தாவீதிடம், “என் பெயருக்காக ஒரு வீட்டைக் கட்ட வேண்டும் என்ற எண்ணம் உன் உள்ளத்தில் இருந்ததால், அந்த எண்ணம் உன் உள்ளத்தில் இருந்தது நல்லதே” என்றார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'மாற்று மொழிபெயர்ப்பு: “என் பெயருக்காக ஒரு ஆலயத்தைக் கட்ட.” எபிரெயத்தில் சொல்லுக்கு சொல் “என் பெயருக்காக ஒரு வீட்டைக் கட்ட” என்று உள்ளது; இங்கே அது ஆலயத்தைக் குறிக்கிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: என்றார்
  rationale: אמר என்பதன் வழக்கமான கதைநடை வடிவம்; நேரடிக் கூற்றை இயல்பான தமிழில் நிறைவு செய்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தேவனுடைய தனிப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பில் தருகிறது.
- source_word: אָבִי
  choice: என் தந்தை
  rationale: முதலாம் நபர் ஒருமை பின்னொட்டு, சாலொமோன் தாவீதைத் தன் தந்தையாகக் குறிப்பிடுவதைக் காட்டுகிறது.
- source_word: יַעַן אֲשֶׁר
  choice: இருந்ததால்
  rationale: காரணத்தைக் குறிக்கும் இணைப்பை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: הָיָה עִם לְבָבְךָ
  choice: உன் உள்ளத்தில் இருந்தது
  rationale: நோக்கம் அல்லது விருப்பத்தைக் குறிக்கும் எபிரெய உருவகத்தைப் பாதுகாத்தபடி தமிழில் தெளிவாக உள்ளது.
- source_word: לִבְנוֹת בַּיִת
  choice: ஓர் ஆலயத்தைக் கட்ட
  rationale: בַּיִת என்பதன் அடிப்படைப் பொருள் ‘வீடு’ என்றாலும், இச்சூழலில் தேவனுக்குரிய ஆலயத்தைக் குறிக்கிறது; தமிழில் ‘ஆலயம்’ உடனடியாகத் தெளிவளிக்கிறது, சொற்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לִשְׁמִי
  choice: என் பெயருக்காக
  rationale: தேவனுடைய பெயருடன் தொடர்புடைய பரிசுத்த இடம் என்ற உடன்படிக்கைசார் சொல்லாட்சியைப் பாதுகாக்கிறது.
- source_word: הֱטִיבֹתָ
  choice: நல்லதே
  rationale: இங்கு יטב என்பதன் ஹிஃபில் வடிவம் வெளிப்படுத்தும் தேவ அங்கீகாரத்தைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: כִּי הָיָה עִם לְבָבֶךָ
  choice: அதை உன் உள்ளத்தில் கொண்டிருந்தது
  rationale: தேவ அங்கீகாரம் தாவீதின் நோக்கத்துக்குரியது என்பதைத் தெளிவாக்கி, முந்தைய சொற்றொடரின் திட்டமிட்ட மறுபடியுரைத்தலைப் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தேவப் பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: யாவே
  rationale: தலைப்புச் சொல்லால் மாற்றாமல் தேவனுடைய தனிப்பெயரை ஒலிபெயர்க்கிறது; நவீன தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- issue: בַּיִת என்பதை ‘வீடு’ எனவா ‘ஆலயம்’ எனவா தருவது
  choice: ஆலயம்
  alternative: வீடு
  rationale: மூலச்சொல் ‘வீடு’ என்றாலும் சூழலிலுள்ள குறிப்பிட்ட பொருள் எருசலேம் ஆலயம். இயல்பான தமிழில் தெளிவுக்காக ‘ஆலயம்’ பயன்படுத்தப்பட்டு, மூல உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: தேவ அங்கீகாரம் கட்டுமானத்திற்கா அல்லது தாவீதின் நோக்கத்திற்கா
  choice: தாவீதின் உள்ளார்ந்த நோக்கத்திற்கான அங்கீகாரமாகத் தெளிவாக வைத்தல்
  alternative: கட்டும் செயலை அங்கீகரித்ததாக வாசித்தல்
  rationale: மறுபடியும் வரும் הָיָה עִם לְבָבֶךָ, நன்மை என மதிப்பிடப்பட்டது அவன் உள்ளத்தில் இருந்த எண்ணமே என்பதை வலியுறுத்துகிறது; அடுத்த வசனத்தின் பதற்றத்தையும் முன்கூட்டியே தீர்க்கவில்லை.
translation_notes:
  register: நவீன, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ். எபிரெய மொழியின் ‘உள்ளம்’ மற்றும் ‘என் பெயருக்காக’ என்ற முக்கிய உருவகங்கள் பாதுகாக்கப்பட்டுள்ளன; ‘வீடு’ மட்டும் சூழலுக்கேற்ற ‘ஆலயம்’ என முதன்மை உரையில் தெளிவாக்கப்பட்டுள்ளது.
