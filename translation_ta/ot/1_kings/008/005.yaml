base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/005.yaml
  text: And King Solomon[a], and all the assembly of Israel who had assembled before him, were with him before the ark, sacrificing sheep and cattle that could not be counted or numbered because of their great number.
translation:
  language: ta
  text: சாலொமோன் அரசனும், அவனிடம் கூடிவந்திருந்த[a] இஸ்ரவேலின் சபையார் அனைவரும், அவனுடன் பேழைக்கு முன்பாக இருந்து, அவற்றின் பெருக்கினால் எண்ணப்படவோ கணக்கிடப்படவோ முடியாத ஆடுகளையும் மாடுகளையும் பலியிட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனை முன்னிட்டு ஒன்றுகூடியிருந்த.” எபிரெயச் சொற்றொடர் மக்கள் சாலொமோனைச் சார்ந்து ஒன்றுகூடியதை வலியுறுத்தலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲדַת
  choice: சபையார்
  rationale: தேசிய அளவில் வழிபாட்டுக்காகக் கூடியிருந்த மக்களைக் குறிக்கிறது; நவீனத் தமிழில் இயல்பாகவும் கூட்டமைப்பின் பொருளைத் தக்கவைத்தும் உள்ளது.
- source_word: הַנּוֹעָדִים עָלָיו
  choice: அவனிடம் கூடிவந்திருந்த
  rationale: יעד என்பதன் நிபால் வடிவம் ஒன்றுகூடுதலைக் குறிக்கிறது; עָלָיו இங்கு சாலொமோனைச் சார்ந்து அல்லது அவனிடம் மக்கள் கூடிவந்ததைக் காட்டுகிறது. மூலத்தின் உறவுநிலைத் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: אִתּוֹ
  choice: அவனுடன்
  rationale: சாலொமோனும் கூடியிருந்த மக்களும் ஒன்றாகப் பெட்டிக்கு முன்பாக இருந்ததைக் காட்டுகிறது.
- source_word: לִפְנֵי הָאָרוֹן
  choice: பெட்டிக்கு முன்பாக
  rationale: இவ்வசனத்தில் உள்ள אָרוֹן என்பதையே மொழிபெயர்க்கிறது; மூலத்தில் இல்லாத ‘உடன்படிக்கையின்’ என்ற விரிவாக்கத்தைச் சேர்க்கவில்லை.
- source_word: מְזַבְּחִים
  choice: பலியிட்டார்கள்
  rationale: சூழலில் நடந்த சடங்குசார் பலிசெலுத்துதலைத் தெளிவாகவும் இயல்பான தமிழிலும் தெரிவிக்கிறது.
- source_word: צֹאן וּבָקָר
  choice: ஆடுகளையும் மாடுகளையும்
  rationale: பலிக்குரிய சிறிய கால்நடைகளையும் பெரிய கால்நடைகளையும் சாதாரண வாசகருக்குத் தெளிவாகக் காட்டும் இயல்பான இணைச்சொல்.
- source_word: אֲשֶׁר לֹא יִסָּפְרוּ וְלֹא יִמָּנוּ
  choice: எண்ணப்படவோ கணக்கிடப்படவோ முடியாத
  rationale: மூலத்தில் உள்ள இரண்டு இணை வினைகளையும் தக்கவைத்து, எண்ணிக்கையின் அளவிட முடியாத பெருக்கை வலியுறுத்துகிறது.
- source_word: מֵרֹב
  choice: மிகுதியாக இருந்ததால்
  rationale: விலங்குகளை எண்ண முடியாததற்கான காரணமாக அவற்றின் பெருக்கை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘பெட்டி’ என்பதன் குறிப்பு
  choice: பெட்டி
  alternative: உடன்படிக்கைப் பெட்டி
  rationale: இந்த வசனத்தின் எபிரெய உரையில் ‘பெட்டி’ என்பது மட்டுமே உள்ளது. ‘உடன்படிக்கை’ என்று விரிவாக்குவது அருகிலுள்ள சூழலிலிருந்து தகவலைச் சேர்ப்பதாகும்.
- issue: הַנּוֹעָדִים עָלָיו என்பதன் உறவுநிலை
  choice: அவனிடம் கூடிவந்திருந்த
  alternative: அவனை முன்னிட்டு ஒன்றுகூடியிருந்த
  rationale: עָלָיו என்பது சாலொமோனை நோக்கி அல்லது அவனைச் சார்ந்து கூட்டப்பட்ட உறவைச் சுட்டலாம்; குறிப்பிட்ட நிர்வாக அல்லது சமயப் பொருளைத் திணிக்காமல் முதன்மை வாசகம் திசைநிலையை வெளிப்படுத்துகிறது, மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் வகையிலும் வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் நீண்ட தொடரை இயல்பான தமிழ் வரிசையில் அமைத்தாலும், இரட்டை எண்ணிக்கைச் சொற்களும் சாலொமோன்–மக்கள் உறவின் தெளிவின்மையும் பாதுகாக்கப்பட்டுள்ளன.
