  verdict: revise
  source_fidelity: 'கருத்து முறையாக மூலத்தைப் பின்பற்றுகிறது: சாலொமோன், அவனோடு கூடிய இஸ்ரவேல் மக்கள், பேழைக்கு முன்பாக இருப்பது, ஆடுமாடுகளைப் பலியிடுதல், அவற்றின் எண்ணிலடங்கா பெருக்கு ஆகிய அனைத்தும் காக்கப்பட்டுள்ளன. ஆனால் אָרוֹן என்பதற்கான நிலையான வேதாகமச் சொல்லான “பேழை”யை பயன்படுத்துவது, மூலத்தில் இல்லாத “உடன்படிக்கை” என்ற விரிவாக்கத்தைச் சேர்க்காமலேயே, குறிப்பிட்ட புனிதப் பொருளின் அடையாளத்தைத் துல்லியமாகத் தரும்.'
