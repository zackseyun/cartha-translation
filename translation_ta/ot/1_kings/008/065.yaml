  text: וַ/יַּ֣עַשׂ שְׁלֹמֹ֣ה בָֽ/עֵת הַ/הִ֣יא אֶת הֶ/חָ֡ג וְ/כָל יִשְׂרָאֵ֣ל עִמּ/וֹ֩ קָהָ֨ל גָּד֜וֹל מִ/לְּב֥וֹא חֲמָ֣ת עַד נַ֣חַל מִצְרַ֗יִם לִ/פְנֵי֙ יְהוָ֣ה אֱלֹהֵ֔י/נוּ שִׁבְעַ֥ת יָמִ֖ים וְ/שִׁבְעַ֣ת יָמִ֑ים אַרְבָּעָ֥ה עָשָׂ֖ר יֽוֹם־׀־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/065.yaml
  text: At that time Solomon held the feast[a], and all Israel with him, a great assembly from Lebo-hamath to the Brook of Egypt, before Yahweh our God, seven days and seven days[b], fourteen days.
translation:
  language: ta
  text: அந்தக் காலத்தில் சாலொமோனும் அவருடன் இருந்த இஸ்ரயேலர் அனைவரும்—லெபோ-காமாத்[a] முதல் எகிப்தின் ஓடை[b] வரை வந்திருந்த மாபெரும் கூட்டமாக—நம் கடவுளாகிய யாவே முன்னிலையில் அந்தப் பண்டிகையை ஏழு நாட்களும் மேலும் ஏழு நாட்களும், பதினான்கு நாட்கள் கொண்டாடினர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘காமாத்தின் நுழைவிடம்.’ எபிரெயச் சொற்றொடரை ஒரு எல்லை விளக்கமாகவோ ‘லெபோ-காமாத்’ என்ற இடப்பெயராகவோ புரிந்துகொள்ளலாம்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, ‘எகிப்தின் வாடி.’ எபிரெயச் சொல் பெரும்பாலும் பெரிய ஆற்றைக் காட்டிலும் பருவகால நீரோடையையோ அதன் படுகையையோ குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ ... אֶת הֶחָג
  choice: அந்தப் பண்டிகையைக் ... கொண்டாடினார்கள்
  rationale: עָשָׂה என்பதன் அடிப்படைப் பொருள் ‘செய்தல்’ என்றாலும், חָג உடன் வரும் இச்சொற்றொடர் ஒரு பண்டிகையைக் கடைப்பிடித்தல் அல்லது கொண்டாடுதல் என்னும் இயல்பான பொருளைக் கொடுக்கிறது.
- source_word: הֶחָג
  choice: அந்தப் பண்டிகை
  rationale: חָג என்பது யாத்திரைப் பண்டிகையைச் சுட்டுகிறது. எபிரெய உரையிலுள்ள குறிப்பிட்ட சுட்டை ‘அந்த’ என்பது வெளிப்படுத்துகிறது.
- source_word: קָהָל גָּדוֹל
  choice: மாபெரும் சபையினர்
  rationale: קָהָל என்பது ஒன்றுகூடிய சமூகத்தைக் குறிக்கிறது; ‘சபையினர்’ அதன் கூட்டு, முறையான தன்மையைப் பேணுகிறது.
- source_word: מִלְּבוֹא חֲמָת
  choice: லெபோ-காமாத் முதல்
  rationale: இது நிலையான புவியியல் இடப்பெயராகப் புரிந்துகொள்ளப்படலாம். ‘காமாத்தின் நுழைவிடம்’ என்ற விளக்க வாசிப்பு அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- source_word: נַחַל מִצְרַיִם
  choice: எகிப்தின் ஓடை
  rationale: נַחַל பொதுவாக பெரிய ஆற்றை அல்ல, பருவகால நீரோடை அல்லது அதன் படுகையைக் குறிக்கும். ‘ஓடை’ இயல்பான தமிழில் அந்த வேறுபாட்டை ஓரளவு பேணுகிறது.
- source_word: לִפְנֵי יְהוָה אֱלֹהֵינוּ
  choice: நம் கடவுளாகிய யாவே முன்னிலையில்
  rationale: לִפְנֵי என்பதன் இட-உறவுப் பொருளான ‘முன்னிலையில்’ என்பதையும், יְהוָה என்ற தனிப்பெயரையும் நேரடியாகப் பேணுகிறது.
- source_word: שִׁבְעַת יָמִים וְשִׁבְעַת יָמִים
  choice: ஏழு நாட்களும் மேலும் ஏழு நாட்களும்
  rationale: இரண்டு தொடர்ச்சியான ஏழுநாள் காலப்பகுதிகளைக் காட்டும் எபிரெய மறுபடியுரைத்தலை இயல்பான தமிழில் வெளிப்படையாகப் பேணுகிறது.
- source_word: אַרְבָּעָה עָשָׂר יוֹם
  choice: மொத்தம் பதினான்கு நாட்கள்
  rationale: முந்தைய இரண்டு ஏழுநாள் காலங்களின் மொத்தத்தை விளக்கும் இணைப்புச் சுருக்கமாக இது வருகிறது; ‘மொத்தம்’ அந்த இலக்கணச் செயல்பாட்டைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூல எபிரெயில் நான்கு எழுத்து இறைப் பெயர் நேரடியாக உள்ளது. அதை பொதுப்பட்டத்தால் மாற்றாமல் தனிப்பெயராக ‘யாவே’ என்று வழங்குவது மூலத்தின் வேறுபாட்டைப் பேணுகிறது.
- issue: இரண்டு ஏழுநாள் காலங்களின் தொடர்பு
  choice: ஏழு நாட்களும் மேலும் ஏழு நாட்களும், மொத்தம் பதினான்கு நாட்கள்
  alternative: பதினான்கு நாட்கள்
  rationale: மூலத்தில் உள்ள மறுபடியுரைத்தலையும் அதன் பதினான்கு நாள் சுருக்கத்தையும் ஒன்றாக்காமல் வைத்திருப்பதால், இரண்டு அனுசரிப்புகளின் அமைப்பு மறைக்கப்படுவதில்லை.
translation_notes:
  register: நவீன செந்தமிழ் சார்ந்த, ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. நீண்ட எபிரெய வாக்கியத்தின் ஒற்றுமை பேணப்பட்டு, உட்சேர்க்கைப் பகுதி கோடுகளால் தெளிவாக்கப்பட்டுள்ளது. எல்லைப் பெயர்களின் உண்மையான வாசிப்பு ஐயமும் காலஅளவின் மறுபடியுரைத்தலும் நீக்கப்படவில்லை.
