base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/020.yaml
  text: And Yahweh has fulfilled his word that he spoke[a], and I have risen in the place of David my father and sit on the throne of Israel, just as Yahweh spoke, and I have built the house for the name of Yahweh[b], the God of Israel.
translation:
  language: ta
  text: யெகோவா தாம் சொன்ன வார்த்தையை நிறைவேற்றியிருக்கிறார்; நான் என் தந்தை தாவீதின் இடத்தில் எழுந்து, யெகோவா சொன்னபடியே இஸ்ரவேலின் அரியணையில் அமர்ந்திருக்கிறேன்; இஸ்ரவேலின் கடவுளாகிய யெகோவாவின் பெயருக்காக அந்த வீட்டைக் கட்டியிருக்கிறேன்[b].[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தமது வார்த்தையை நிலைநிறுத்தியிருக்கிறார்’ அல்லது ‘தமது வார்த்தையைச் செயல்படுத்தியிருக்கிறார்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், ‘அந்த வீட்டைக் கட்டியிருக்கிறேன்’; இங்கு அது ஆலயத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: நிறைவேற்றியிருக்கிறார்
  rationale: קום என்பதன் ஹிஃபில் வடிவம் ‘வார்த்தை’ என்பதுடன் வரும்போது, சொல்லப்பட்டதை நிலைநிறுத்தி நிகழச் செய்வதைக் குறிக்கிறது; இச்சூழலில் ‘நிறைவேற்றியிருக்கிறார்’ என்பது இயல்பாக அதைப் பதிவுசெய்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: திருப்பெயரான יהוה-ஐ ஒரு பொதுப் பட்டத்தால் மாற்றாமல், தமிழில் நீண்டகாலமாக அறியப்பட்ட பெயர்வடிவமான ‘யெகோவா’ என்று தருகிறது.
- source_word: דְּבָרוֹ אֲשֶׁר דִּבֵּר
  choice: தாம் சொன்ன வார்த்தையை
  rationale: ‘வார்த்தை/சொன்னார்’ என்ற எபிரெயச் சொல் ஒலிப்பை முடிந்தவரை காத்து, வாக்குறுதி என்ற கருத்தை உரையில் வெளிப்படையாகச் சேர்க்கவில்லை.
- source_word: וָאָקֻם תַּחַת דָּוִד אָבִי
  choice: நான் என் தந்தை தாவீதின் இடத்தில் எழுந்து
  rationale: קום என்ற மீளொலியையும், תחת குறிக்கும் அரசவழிச் succession-ஐயும் காக்கிறது.
- source_word: וָאֵשֵׁב עַל כִּסֵּא יִשְׂרָאֵל
  choice: இஸ்ரவேலின் அரியணையில் அமர்ந்திருக்கிறேன்
  rationale: கடந்தகால அரியணையேற்றத்தால் உருவான தற்போதைய ஆட்சிநிலையை இயல்பான தமிழில் காட்டுகிறது.
- source_word: וָאֶבְנֶה הַבַּיִת
  choice: இந்த ஆலயத்தைக் கட்டியிருக்கிறேன்
  rationale: הַבַּיִת என்பதன் சொற்பொருள் ‘அந்த வீடு’ என்றாலும், இச்சூழலில் அது ஆலயத்தையே குறிக்கிறது; தமிழ் வாசகருக்கு தெளிவாக ‘ஆலயம்’ தேர்ந்தெடுக்கப்பட்டது, சொற்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לְשֵׁם יְהוָה
  choice: யெகோவாவின் பெயருக்காக
  rationale: ‘பெயருக்காக’ என்ற முக்கியமான வேதாகமச் சொல்லமைப்பை விளக்கமாக மாற்றாமல் காக்கிறது.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கடவுள்
  rationale: உடன்படிக்கைச் சிறப்புப்பெயரை நேரடியாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: יהוה என்ற திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் உள்ள தனிப்பட்ட திருப்பெயரை ஒரு பட்டத்தால் மாற்றாமல் பெயராகவே தருகிறது; தமிழில் பரவலாக அறியப்பட்ட மரபுவடிவம் தேர்ந்தெடுக்கப்பட்டது.
- issue: הַבַּיִת என்பதை ‘வீடு’ அல்லது ‘ஆலயம்’ என்று தருதல்
  choice: ஆலயம்
  alternative: வீடு
  rationale: சொற்பொருள் ‘வீடு’ என்றாலும் இங்கு சாலொமோன் கட்டிய ஆலயம் தெளிவான குறிப்பு. முதன்மை உரையில் இயல்பும் தெளிவும் பெற ‘ஆலயம்’ என்றும், மூலவடிவம் அடிக்குறிப்பிலும் தரப்படுகிறது.
- issue: קום வினையின் இருமுறைப் பயன்பாடு
  choice: ‘நிறைவேற்றினார்’ மற்றும் ‘எழுந்து’
  alternative: ‘நிலைநிறுத்தினார்’ மற்றும் ‘பதவியேற்று’
  rationale: முதல் பயன்பாட்டின் சூழற்பொருளைத் தெளிவாக்கியபோதும், இரண்டாவது பயன்பாட்டில் ‘எழுந்து’ என்று வைத்து மூலத்தின் சொல் தொடர்பை ஓரளவு காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடை. நீண்ட எபிரெய இணைப்புத் தொடரை மூன்று தமிழ் வாக்கியங்களாகப் பிரித்து வாசிப்புத் தெளிவு பெற்றுள்ளது; ‘அரியணை’, ‘பெயருக்காக’ போன்ற வேதாகமக் கருத்துச்சுமை கொண்ட சொற்கள் காக்கப்பட்டுள்ளன.
