source:
  edition: WLC
  text: וַ/יֹּאמַ֗ר יְהוָ֞ה אֱלֹהֵ֤י יִשְׂרָאֵל֙ אֵין כָּמ֣וֹ/ךָ אֱלֹהִ֔ים בַּ/שָּׁמַ֣יִם מִ/מַּ֔עַל וְ/עַל הָ/אָ֖רֶץ מִ/תָּ֑חַת שֹׁמֵ֤ר הַ/בְּרִית֙ וְֽ/הַ/חֶ֔סֶד לַ/עֲבָדֶ֕י/ךָ הַ/הֹלְכִ֥ים לְ/פָנֶ֖י/ךָ בְּ/כָל לִבָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/023.yaml
  text: And he said[a], “O Yahweh, God of Israel, there is no God like you in heaven above or on earth beneath[b], keeping the covenant and the steadfast love for your servants who walk before you with all their heart.”
translation:
  language: ta
  text: 'அவர் சொன்னார்: “இஸ்ரவேலின் கடவுளாகிய யாவே, மேலே வானத்திலோ[a] கீழே பூமியிலோ உம்மைப் போன்ற கடவுள் இல்லை. உமது முன்னிலையில் தங்கள் முழு இதயத்தோடு நடக்கிற உமது ஊழியர்களுக்காக உடன்படிக்கையையும் மாறாத அன்பையும்[b] காத்துவருகிறவர் நீரே.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில், “மேலே வானங்களில்.” எபிரெயச் சொல் இலக்கண வடிவில் பன்மையானது.
    reason: மூலத்தின் பன்மை வடிவத்தையும் சொற்றொடரின் திசைச் சுட்டலையும் துல்லியமாகக் காட்டுகிறது.
  - marker: b
    text: எபிரெயில் חֶסֶד (ஹெசெத்); இது உடன்படிக்கைப் பற்றுறுதி, உண்மையுள்ள அன்பு, அல்லது நிலையான அன்பு ஆகிய நுணுக்கங்களைக் குறிக்கலாம்.
    reason: ஒரே தமிழ்ச் சொல்லில் முழுமையாக அடங்காத முக்கியமான உடன்படிக்கைச் சொல்லின் பொருள் பரப்பை விளக்குகிறது; ஒலிபெயர்ப்பும் திருத்தப்பட்டுள்ளது.
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: அவர் சொன்னார்
  rationale: எபிரெயக் கதைநடையின் தொடர்ச்சியை இயல்பான நவீனத் தமிழில் தருகிறது; சூழலில் பேசுபவர் சாலொமோன் என்பது தெளிவு.
- source_word: יְהוָה
  choice: யாவே
  rationale: இஸ்ரவேலின் கடவுளுடைய தனிப்பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கடவுளாகிய
  rationale: விளிப்புத் தொடரைத் தமிழில் இயல்பாகவும் தெளிவாகவும் இணைக்கிறது.
- source_word: אֵין כָּמוֹךָ אֱלֹהִים
  choice: உம்மைப் போன்ற கடவுள் இல்லை
  rationale: யாவேயுடன் ஒப்பிடத்தக்க கடவுள் எவரும் இல்லை என்ற மூலத்தின் ஒப்பற்ற தன்மை பற்றிய வலியுறுத்தலைப் பாதுகாக்கிறது.
- source_word: בַּשָּׁמַיִם מִמַּעַל וְעַל הָאָרֶץ מִתָּחַת
  choice: மேலே வானத்திலோ கீழே பூமியிலோ
  rationale: வானமும் பூமியும் முழுப் படைப்பையும் குறிக்கும் இணையை இயல்பான தமிழில் தருகிறது; ‘-இலோ ... -இலோ’ அமைப்பு ‘எங்கும் இல்லை’ என்ற கருத்தைத் தெளிவாக்குகிறது.
- source_word: שֹׁמֵר
  choice: காத்துவருகிறவர்
  rationale: தொடர்ச்சியான பண்பைச் சுட்டும் எபிரெயப் பங்கேற்பு வடிவத்தைப் பாதுகாக்கிறது; உடன்படிக்கையை உண்மையுடன் கடைப்பிடித்தல் என்ற கருத்தையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַבְּרִית
  choice: உடன்படிக்கை
  rationale: கடவுளின் உறுதியான உடன்படிக்கைப் பொறுப்பைக் குறிக்கும் நிலையான, தெளிவான தமிழ்ச் சொல்.
- source_word: הַחֶסֶד
  choice: மாறாத அன்பு
  rationale: חֶסֶד என்பதில் உள்ள நீடித்த அன்பையும் விசுவாசமான பற்றுறுதியையும் ஒருங்கே எடுத்துரைக்கிறது; அதன் உடன்படிக்கைச் சார்ந்த விரிவை அடிக்குறிப்பு விளக்குகிறது.
- source_word: לַעֲבָדֶיךָ
  choice: உமது ஊழியர்களுக்காக
  rationale: இங்கு அடிமைத்தனத்தைவிடக் கடவுளுக்குச் சேவை செய்யும் உறவுநிலையே முதன்மை; ל முன்னிடைச்சொல்லின் பயனாளி சார்ந்த பொருளை ‘-க்காக’ வெளிப்படுத்துகிறது.
- source_word: הַהֹלְכִים לְפָנֶיךָ
  choice: உமது முன்னிலையில் ... நடக்கிற
  rationale: கடவுளின் முன்னிலையில் வாழ்ந்து நடப்பது என்ற எபிரெய உருவகத்தைத் தமிழிலும் பாதுகாக்கிறது.
- source_word: בְּכָל לִבָּם
  choice: தங்கள் முழு இதயத்தோடு
  rationale: பிரிக்கப்படாத உள்ளார்ந்த அர்ப்பணிப்பைக் குறிக்கும் ‘முழு இதயம்’ என்ற உருவகத்தைத் தக்கவைக்கிறது; பன்மை உடைமையை ‘தங்கள்’ தெளிவாக்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் உள்ள தனிப்பெயரைப் பட்டமாக மாற்றாமல் வெளிப்படையாகப் பாதுகாக்கிறது.
- issue: אֵין כָּמוֹךָ אֱלֹהִים என்பதிலுள்ள אֱלֹהִים எண்ணும் பொருளும்
  choice: உம்மைப் போன்ற கடவுள் இல்லை
  alternative: தெய்வங்களுள் உமக்கு நிகரானவர் எவரும் இல்லை
  rationale: சொற்றொடரின் மையமான யாவேயின் ஒப்பற்ற தன்மையைத் தருகிறது; பல தெய்வங்களின் இருப்பை உறுதிப்படுத்துவதாகவோ மறுப்பதாகவோ உரையைவிட அதிகமாக முடிவு செய்யவில்லை.
- issue: חֶסֶד என்பதன் உடன்படிக்கைச் சார்ந்த நுணுக்கம்
  choice: மாறாத அன்பு
  alternative: உண்மையுள்ள அன்பு
  rationale: அன்பு, நிலைத்தன்மை, பற்றுறுதி ஆகிய நுணுக்கங்களைத் தக்கவைக்கிறது; ‘உடன்படிக்கை’ என்பதுடன் இணைந்திருப்பதால் அதன் உடன்படிக்கை விசுவாசம் தெளிவாகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான ஜெப மொழிநடை பயன்படுத்தப்பட்டுள்ளது. கடவுளை நோக்கிய மரியாதைப் பன்மை வடிவங்கள் (‘உம்மை’, ‘உமது’, ‘நீரே’) தொடர்ச்சியாகப் பேணப்பட்டுள்ளன. எபிரெய உருவகமான ‘முன்னிலையில் நடத்தல்’ மற்றும் ‘முழு இதயம்’ இயன்றவரை அப்படியே வைக்கப்பட்டுள்ளன.
