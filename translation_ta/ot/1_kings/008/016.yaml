  choice: என் மக்களாகிய இஸ்ரவேலை ஆளும்படி
  rationale: ‘என் மக்களின்மேல் இருக்க’ என்ற சொற்சொல் மொழிபெயர்ப்பு தமிழில் இயல்பற்றதால், தாவீதின் அதிகாரத்தைக் குறிக்கும் על־இன் சூழல்சார் பொருளைத் தெளிவாகத் தருகிறது.
theological_decisions:
- issue: ‘என் பெயருக்கான வீடு’ சார்ந்த ஆலய இறையியல்
  choice: ‘என் பெயர் அங்கே இருக்கும்படி ஒரு வீடு’ என்ற எபிரேய மரபுத்தொடரை முதன்மை உரையில் தக்கவைத்தல்
  alternative: ‘என் ஆலயம்’ அல்லது ‘என் பெயர் வாசம்பண்ணும் வீடு’
  rationale: ஆண்டவரின் பெயருடன் இணைக்கப்பட்ட இடம் என்ற உரையின் இறையியல் நுணுக்கத்தைப் பாதுகாக்கிறது; ‘ஆலயம்’ என்ற விளக்கம் அடிக்குறிப்பில் மட்டும் தரப்படுகிறது.
- issue: தேர்ந்தெடுக்கப்படாத நகரத்திற்கும் தேர்ந்தெடுக்கப்பட்ட தாவீதிற்கும் இடையிலான தொடர்பு
  choice: וְ என்பதை முரணைக் காட்டும் ‘ஆனால்’ என்று மொழிபெயர்த்தல்
  alternative: இணைப்பைக் காட்டும் ‘மேலும்’ அல்லது ‘அப்போது’
  rationale: சூழலில் நகரம் தேர்ந்தெடுக்கப்படாததும் தாவீது தேர்ந்தெடுக்கப்பட்டதும் எதிர்முகமாக வைக்கப்படுகின்றன; இருப்பினும் இலக்கண ரீதியான இணைப்பு வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘வீடு,’ ‘பெயர் அங்கே இருக்க’ ஆகிய மூல உருவகங்கள் பாதுகாக்கப்பட்டுள்ளன; தமிழில் இயல்பற்ற ‘மக்களின்மேல் இருக்க’ என்பதற்குப் பதிலாக அதிகாரப் பொருளைத் தெரிவிக்கும் ‘மக்களை ஆள’ பயன்படுத்தப்பட்டுள்ளது.
