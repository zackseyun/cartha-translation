base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/016.yaml
  text: From the day that I brought my people Israel out of Egypt[a], I have not chosen a city from all the tribes of Israel to build a house for my name to be there[b], but I chose David to be over my people Israel.
translation:
  language: ta
  text: “என் மக்களாகிய இஸ்ரவேலை எகிப்திலிருந்து நான் வெளியே கொண்டுவந்த நாள்முதல், என் பெயர் அங்கே இருக்கும்படி ஒரு வீட்டைக் கட்டுவதற்காக இஸ்ரவேலின் எல்லாக் கோத்திரங்களிலிருந்தும் எந்த நகரத்தையும் நான் தேர்ந்தெடுக்கவில்லை; ஆனால்[a] என் மக்களாகிய இஸ்ரவேலை ஆளும்படி தாவீதைத் தேர்ந்தெடுத்தேன்.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மேலும் நான் தாவீதைத் தேர்ந்தெடுத்தேன்.” எபிரேய இணைப்புச்சொல்லைச் சாதாரண இணைப்பாகவும் வாசிக்கலாம்; ஆனால் எந்த நகரமும் தேர்ந்தெடுக்கப்படவில்லை, அதற்கு மாறாகத் தாவீது தேர்ந்தெடுக்கப்பட்டார் என்பதால் இங்கே “ஆனால்” என்பது சூழலுக்கு ஏற்றது.
    reason: lexical_alternative
  - marker: b
    text: “என் பெயர் அங்கே இருக்கும்படி ஒரு வீடு” என்பது ஆண்டவரின் பெயருடனும் பிரசன்னத்துடனும் தொடர்புடைய பரிசுத்த இடத்தை, அதாவது ஆலயத்தைக் குறிக்கும் எபிரேய மரபுத்தொடர்.
    reason: cultural_note
