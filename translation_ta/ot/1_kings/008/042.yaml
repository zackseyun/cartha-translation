base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/042.yaml
  text: for they will hear of your great name[a], and of your mighty hand and your outstretched arm, and he will come and pray toward this house—
translation:
  language: ta
  text: ஏனெனில், அவர்கள் உமது மகத்தான பெயரையும்[a], உமது வல்லமையான கரத்தையும், உமது நீட்டிய புயத்தையும் பற்றிக் கேள்விப்படுவார்கள்; அவன் வந்து இந்த ஆலயத்தை நோக்கி ஜெபிப்பான்—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் முதலில் பன்மை (‘அவர்கள் கேள்விப்படுவார்கள்’) வந்த பின் ஒருமை (‘அவன் வந்து ஜெபிப்பான்’) வருகிறது. இது பொதுவாக அந்நியர்களைக் குறிப்பதிலிருந்து, அவர்களில் ஒரு தனிப்பட்ட அந்நியனை எடுத்துக்காட்டாகக் குறிப்பிடுவதற்கு மாறுவதாக இருக்கலாம்.
    reason: எண்ணிக்கையில் உள்ள மூலவுரை மாற்றத்தை விளக்குதல்
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட அந்நியனின் மன்றாட்டிற்கான விளக்கக் காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: יִשְׁמְעוּן
  choice: அவர்கள் ... கேள்விப்படுவார்கள்
  rationale: பன்மை வினைச்சொல்லின் எதிர்கால/பொதுவான பொருளைக் காத்து, அந்நியர்களை ஒரு வகுப்பாகக் குறிக்கிறது.
- source_word: אֶת שִׁמְךָ הַגָּדוֹל
  choice: உமது மகத்தான பெயரைப் பற்றிக்
  rationale: שׁמע உடன் வரும் பொருளை இயல்பான தமிழில் ‘பற்றிக் கேள்விப்படுதல்’ எனத் தருகிறது; ‘பெயர்’ என்பது புகழையும் வெளிப்பட்ட பெருமையையும் சுமந்தாலும், அதை விளக்கவுரையாக மாற்றாமல் காக்கிறது.
- source_word: יָדְךָ הַחֲזָקָה
  choice: உமது வல்லமையான கரம்
  rationale: தெய்வீக வல்லமையைச் சித்தரிக்கும் உருவகத்தை அப்படியே காத்து, நவீன கண்ணியமான தமிழில் இயல்பாக வழங்குகிறது.
- source_word: זְרֹעֲךָ הַנְּטוּיָה
  choice: நீட்டப்பட்ட உமது புயம்
  rationale: விடுதலையிலும் நியாயத்தீர்ப்பிலும் செயல்படும் இறைவல்லமையின் மூலமொழி உருவகத்தைப் பாதுகாக்கிறது.
- source_word: וּבָא
  choice: அப்போது அவன் வந்து
  rationale: பன்மையான ‘அவர்கள் கேள்விப்படுவார்கள்’ என்பதிலிருந்து பிரதிநிதியான தனிப்பட்ட அந்நியனைச் சுட்டும் ஒருமைக்கு மாறுவதை வெளிப்படையாகக் காக்கிறது.
- source_word: וְהִתְפַּלֵּל
  choice: மன்றாடுவான்
  rationale: முன்னுள்ள ஒருமை வினையுடன் இணைந்து, இறைவனை நோக்கிய விண்ணப்ப ஜெபத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: אֶל הַבַּיִת הַזֶּה
  choice: இந்த ஆலயத்தை நோக்கி
  rationale: אֶל என்பதன் திசைநோக்கிய பொருளைச் சூழலுக்கேற்ப காக்கிறது; கட்டடத்திற்குள் வருவதை அல்ல, ஆலயத்தை நோக்கி மன்றாடுவதை முன்னிறுத்துகிறது.
theological_decisions:
- issue: இறைவனுடைய வல்லமைக்கான மனிதஉறுப்பு உருவகங்கள்
  choice: ‘கரம்’, ‘புயம்’ என்ற உருவகங்களை முதன்மை உரையில் அப்படியே வைத்தல்
  alternative: ‘வல்லமை’, ‘பலன்’ என்று அருவமாக மொழிபெயர்த்தல்
  rationale: எபிரெய உரையின் தெளிவான, இலக்கிய மற்றும் இறையியல் முக்கியத்துவமுள்ள உருவகங்களை அருவப்படுத்தாமல் பாதுகாக்கிறது.
- issue: பன்மையிலிருந்து ஒருமைக்கான எழுவாய் மாற்றம்
  choice: ‘அவர்கள் ... கேள்விப்படுவார்கள்; ... அவன் வந்து’ என்று மாற்றத்தைக் காத்தல்
  alternative: அனைத்தையும் பன்மையாக்கி ‘அவர்கள் வந்து மன்றாடுவார்கள்’ எனச் சீராக்குதல்
  rationale: அந்நியர்கள் பொதுவாகக் கேள்விப்படுவதிலிருந்து பிரதிநிதியான தனி அந்நியனுக்கு மூலவுரை மாறும் எண்ணிக்கைத் தளர்வை மறைக்காமல் காட்டுகிறது.
translation_notes:
  register: நவீன செந்தமிழுக்கு நெருக்கமான, கண்ணியமும் பொதுவாசிப்புத் தெளிவும் கொண்ட நடை. இறைவனை நோக்கிய மரியாதைக்காக ‘உமது’ பயன்படுத்தப்பட்டுள்ளது. ‘வீடு’ என்பதற்குப் பதில் இச்சூழலில் குறிக்கப்படும் திருக்கோயிலைத் தெளிவாக உணர்த்த ‘ஆலயம்’ தேர்ந்தெடுக்கப்பட்டுள்ளது; வசன முடிவின் தொடர்ச்சியை நீண்ட கோடு காக்கிறது.
