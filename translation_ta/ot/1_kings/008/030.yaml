  text: וְ/שָׁ֨מַעְתָּ֜ אֶל תְּחִנַּ֤ת עַבְדְּ/ךָ֙ וְ/עַמְּ/ךָ֣ יִשְׂרָאֵ֔ל אֲשֶׁ֥ר יִֽתְפַּֽלְל֖וּ אֶל הַ/מָּק֣וֹם הַ/זֶּ֑ה וְ֠/אַתָּה תִּשְׁמַ֞ע אֶל מְק֤וֹם שִׁבְתְּ/ךָ֙ אֶל הַ/שָּׁמַ֔יִם וְ/שָׁמַעְתָּ֖ וְ/סָלָֽחְתָּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/030.yaml
  text: And hear the plea of your servant and of your people Israel when they pray toward this place[a]. And hear in heaven, the place of your dwelling[b]; hear and forgive.
translation:
  language: ta
  text: உமது அடியானும் உமது மக்களாகிய இஸ்ரவேலும் இந்த இடத்தை நோக்கி[a] ஜெபிக்கும்போது, அவர்களுடைய விண்ணப்பத்தைக் கேளும். உமது உறைவிடமான பரலோகத்தில்[b] கேளும்; கேட்டு மன்னியும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இந்த இடத்திற்கு.’ எபிரெயத் தொடர் இவ்வாறு சொற்சார்ந்து மொழிபெயர்க்கப்படலாம்; ஆனால் ஆலயத்தை நோக்கிச் செய்யப்படும் ஜெபத்தின் திசையை ‘இந்த இடத்தை நோக்கி’ தெளிவாகக் காட்டுகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘பரலோகத்திலுள்ள உமது உறைவிடத்தில்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּחִנַּת
  choice: விண்ணப்பம்
  rationale: இச்சொல் இரக்கம் அல்லது தயவை நாடும் உருக்கமான வேண்டுதலைக் குறிக்கிறது. ‘விண்ணப்பம்’ நவீனத் தமிழில் இயல்பாகவும் ஜெபத்தின் வேண்டுதல் தன்மையைத் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: עַבְדְּךָ
  choice: உமது அடியான்
  rationale: தேவனிடம் தாழ்மையுடனும் கீழ்ப்படிதலுடனும் தன்னைச் சுட்டும் அரசரின் ஜெப மொழிக்கு ‘அடியான்’ பொருத்தமான, கண்ணியமான தமிழாக்கம்.
- source_word: עַמְּךָ יִשְׂרָאֵל
  choice: உமது மக்களாகிய இஸ்ரவேல்
  rationale: இஸ்ரவேலை தேவனுடைய மக்கள் என்று அடையாளப்படுத்தும் எபிரெயத் தொடரைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: יִתְפַּלְלוּ
  choice: மன்றாடும்போது
  rationale: פלל என்பதன் ஹித்பஅேல் வடிவம் ஜெபிப்பதற்கான வழக்கமான வினை. இங்கு תְּחִנַּת என்பதோடு வரும் உருக்கமான வேண்டுதல் சூழலை ‘மன்றாடு’ இயல்பாக எடுத்துரைக்கிறது.
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: இந்த இடத்தை நோக்கி
  rationale: אֶל என்பதன் திசைநோக்கிய பொருளையும், ஆலயத்தை நோக்கிச் செய்யப்படும் ஜெபத்தையும் இது காக்கிறது; ‘இந்த இடத்திற்கு’ என்பதும் சொற்சார்ந்த சாத்தியம்.
- source_word: מְקוֹם שִׁבְתְּךָ
  choice: உமது உறைவிடம்
  rationale: தேவன் வாசம்பண்ணும் இடம் என்ற எபிரெயக் கட்டமைப்பை இயல்பான, உயர்ந்த நவீனத் தமிழில் தருகிறது.
- source_word: אֶל הַשָּׁמַיִם
  choice: பரலோகத்தில்
  rationale: முன்னிடைச்சொல் சொற்சார்ந்து ‘பரலோகத்தை நோக்கி’ என வரக்கூடியதாயினும், இத்தொடரில் தேவனுடைய உறைவிடத்தைக் குறிக்கும் இடப்பொருள் இயல்பாக உள்ளது.
- source_word: וְשָׁמַעְתָּ
  choice: கேளும் / கேட்டு
  rationale: שׁמע இங்கு வெறும் ஒலி உணர்வை அல்ல, ஜெபத்திற்குச் செவிகொடுத்து பதிலளிப்பதைக் குறிக்கிறது. தமிழில் வேண்டுதல் வினையாக ‘கேளும்’ என்றும் தொடர்வினையாக ‘கேட்டு’ என்றும் இயல்பாக வழங்கப்பட்டுள்ளது.
- source_word: וְסָלָחְתָּ
  choice: மன்னியும்
  rationale: סלח என்பது தேவன் பாவத்தை மன்னிப்பதற்கான வழக்கமான வினை; ‘மன்னியும்’ ஜெபத்தின் மரியாதையான வேண்டுதல் நடையைப் பேணுகிறது.
theological_decisions:
- issue: ஆலயமும் பரலோகமும் தேவனுடைய வாசஸ்தல இறையியலில் பெறும் இடம்
  choice: மக்கள் ‘இந்த இடத்தை நோக்கி’ ஜெபிப்பதையும், தேவன் ‘உமது உறைவிடமாகிய பரலோகத்தில்’ கேட்பதையும் இரண்டையும் உரையில் வைத்திருக்கிறது.
  alternative: ‘இந்த ஆலயத்தில் ஜெபிக்கும்போது’ என்று மாற்றுவது அல்லது ‘பரலோகத்திலிருந்து கேளும்’ என்று செயலின் திசையை வலியுறுத்துவது.
  rationale: பூமியிலுள்ள ஆலயம் ஜெபத்தின் நோக்கிடமாகவும், பரலோகம் தேவனுடைய உறைவிடமாகவும் இருப்பதை வசனம் ஒரே நேரத்தில் கூறுகிறது. அந்த இறையியல் பதற்றத்தை மொழிபெயர்ப்பு தீர்த்துவிடாமல் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான ஜெப நடையைப் பேண ‘உமது,’ ‘கேளும்,’ ‘மன்னியும்’ பயன்படுத்தப்பட்டுள்ளன. பழமையான அல்லது மிகச் சமயச்சார்புடைய சொற்களைத் தவிர்த்து, எபிரெய மூலத்தின் மீளுரைத்த ‘கேள்’ அமைப்பும் ஆலயம்–பரலோகம் சார்ந்த பொருள் பதற்றமும் காக்கப்பட்டுள்ளன.
