revisions:
- from: இப்போது, இஸ்ரவேலின் கடவுளே, நீர் உமது ஊழியனாகிய என் தந்தை தாவீதிடம் கூறிய உமது வார்த்தைகள் உறுதிப்படுவனவாக.[a]
  to: இப்போதோ, இஸ்ரவேலின் கடவுளே, உமது ஊழியனாகிய என் தந்தை தாவீதிடம் நீர் கூறிய உமது வார்த்தைகள் உறுதியாகட்டும்.[a]
  rationale: The revision explicitly represents the connective force of וְעַתָּה and replaces an awkward verbal form with idiomatic modern Tamil. It retains the Hebrew plural ‘your words,’ the general verb ‘said/spoke,’ and the petition that those words be established, while the footnote preserves the legitimate fulfillment-oriented alternative.
