  text: And now[a], God of Israel[b], please let your word that you spoke to your servant David my father be confirmed.
translation:
  language: ta
  text: இப்போதோ, இஸ்ரவேலின் கடவுளே, உமது ஊழியனாகிய என் தந்தை தாவீதிடம் நீர் கூறிய உமது வார்த்தைகள் உறுதியாகட்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “நிலைபெறட்டும்,” “உண்மையென விளங்கட்டும்”; பொருளை விரித்துக் கூறினால், “நிறைவேறட்டும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: இப்போது
  rationale: மன்றாட்டின் தொடர்ச்சியையும் தற்போதைய வேண்டுதலையும் இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; எபிரேய இணைப்புச் சொல்லைத் தனியாக மொழிபெயர்க்காமல் அதன் தொடர்ச்சி உணர்வைச் சூழலில் தக்கவைக்கிறது.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கடவுளே
  rationale: இது நேரடி அழைப்பாக இருப்பதைத் தமிழ் விளி வேற்றுமை தெளிவாகக் காட்டுகிறது.
- source_word: יֵאָמֶן נָא
  choice: உறுதிப்படுவனவாக
  rationale: אמן வேரின் நிலைபெறுதல், உறுதியாதல் என்ற பொருளையும் வேண்டுதல் வலிமையையும் சுருக்கமாகத் தக்கவைக்கிறது. נָא-வின் மன்றாட்டு நயம் தமிழ் வினைமுற்றிலேயே இயல்பாக வெளிப்படுகிறது.
- source_word: דבריך
  choice: உமது வார்த்தைகள்
  rationale: எபிரேய வடிவத்தின் பன்மையைப் பாதுகாக்கிறது; இதை ஒருமையான ‘வார்த்தை’ அல்லது விளக்கமான ‘வாக்குறுதி’ என்று மாற்றவில்லை.
- source_word: אֲשֶׁר דִּבַּרְתָּ
  choice: நீர் ... கூறிய
  rationale: ‘வாக்குறுதி அளித்த’ என்று பொருள் விரிவாக்காமல், மூலத்தின் பொதுவான ‘பேசு/கூறு’ வினையை நேரடியாக வழங்குகிறது.
- source_word: לְעַבְדְּךָ
  choice: உமது ஊழியனாகிய
  rationale: தாவீதுக்கும் கடவுளுக்கும் இடையிலான மரியாதைமிக்க உறவைச் சூழலுக்கேற்ற வகையில் காட்டுகிறது; ‘அடிமை’ இங்கு தேவையற்ற சமூகநிலைச் சாயலை ஏற்படுத்தும்.
- source_word: דָּוִד אָבִי
  choice: என் தந்தை தாவீது
  rationale: எபிரேயப் பொருளை முழுமையாகத் தக்கவைத்தபடி நவீனத் தமிழின் இயல்பான பெயரடைவு வரிசையைப் பயன்படுத்துகிறது.
theological_decisions:
- issue: தாவீதிடம் கடவுள் கூறிய சொற்களைப் பற்றிய வேண்டுதலின் தன்மை
  choice: கூறப்பட்ட வார்த்தைகள் ‘உறுதிப்படுவனவாக’ என்று மொழிபெயர்க்கப்பட்டது
  alternative: ‘நிறைவேறுவனவாக’ அல்லது ‘உண்மையென விளங்குவனவாக’
  rationale: இந்த வேண்டுதல் கடவுளின் முந்தைய உரை நிலைபெற்று உண்மையென நிரூபிக்கப்படுவதையும் நிறைவேறுவதையும் உள்ளடக்குகிறது. ‘உறுதிப்படுவனவாக’ என்பது அந்தத் தெய்வீக உரையை வெறுமனே ‘வாக்குறுதி’ என்று முன்கூட்டியே குறுக்காமல், மூலத்தில் உள்ள இறையியல் அழுத்தத்தையும் பொருள் அகலத்தையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதைமிக்க மன்றாட்டு நடையைப் பயன்படுத்துகிறது. கடவுளை நோக்கிய ஒருமை மரியாதைக்காக ‘நீர்/உமது’ வடிவங்கள் தேர்ந்தெடுக்கப்பட்டுள்ளன; தேவையற்ற பழமையான சொற்கள் தவிர்க்கப்பட்டுள்ளன.
