- from: மேலும், உமது மக்களாகிய இஸ்ரவேலைச் சேராத அந்நியன்[a] ஒருவன் உமது பெயரின் பொருட்டுத் தொலைதூர நாட்டிலிருந்து வரும்போது—
  to: மேலும், உமது மக்களாகிய இஸ்ரவேல் மக்களில் ஒருவரல்லாத அந்நியன்[a] ஒருவன் உமது பெயரின் பொருட்டுத் தொலைதூர நாட்டிலிருந்து வரும்போது—
