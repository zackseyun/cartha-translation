source:
  edition: WLC
  text: וְ/גַם֙ אֶל הַ/נָּכְרִ֔י אֲשֶׁ֛ר לֹא מֵ/עַמְּ/ךָ֥ יִשְׂרָאֵ֖ל ה֑וּא וּ/בָ֛א מֵ/אֶ֥רֶץ רְחוֹקָ֖ה לְמַ֥עַן שְׁמֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/041.yaml
  text: And also concerning the foreigner[a], who is not from your people Israel, but comes from a distant land for the sake of your name—
translation:
  language: ta
  text: மேலும், உமது மக்களாகிய இஸ்ரவேல் மக்களில் ஒருவரல்லாத அந்நியன்[a] ஒருவன் உமது பெயரின் பொருட்டுத் தொலைதூர நாட்டிலிருந்து வரும்போது—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வேற்று இனத்தவர்” அல்லது “வெளியார்.” எபிரெயச் சொல் வெறும் பயணியைக் குறிக்காமல், இஸ்ரவேலரல்லாத ஒருவரைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: மேலும்
  rationale: முந்தைய விண்ணப்பங்களுடன் இந்த நிகழ்வையும் இணைக்கும் சேர்க்கைப் பொருளையும் வலியுறுத்தலையும் இயல்பான தமிழில் தருகிறது.
- source_word: אֶל הַנָּכְרִי
  choice: அந்நியன் ஒருவன்
  rationale: אֶל இங்கு அந்நியனைப் பற்றிய அடுத்த விண்ணப்பத்தை அறிமுகப்படுத்துகிறது; தொடரும் வாக்கிய அமைப்பில் தனியாக ‘குறித்து’ என்று சேர்க்காமல் இயல்பாகக் கூறப்பட்டுள்ளது. נָכְרִי என்பது வெறும் பயணி அல்ல, இஸ்ரவேலரல்லாத ஒருவரைக் குறிக்கிறது.
- source_word: אֲשֶׁר לֹא מֵעַמְּךָ יִשְׂרָאֵל הוּא
  choice: உமது மக்களாகிய இஸ்ரவேலைச் சேராத
  rationale: இஸ்ரவேல் கடவுளுடைய மக்கள் என்பதையும் அந்த மனிதன் அவர்களைச் சேர்ந்தவன் அல்ல என்பதையும் தெளிவாகவும் இயல்பாகவும் காக்கிறது.
- source_word: וּבָא
  choice: வரும்போது
  rationale: எபிரெய வினை அடுத்த வசனங்களில் நிறைவுபெறும் நிபந்தனைச் சூழலைத் தொடங்குகிறது. தமிழில் ‘வரும்போது’ என்பது இந்த நிறைவுபெறாத வாக்கியத் தொடரை இயல்பாகக் காட்டுகிறது.
- source_word: מֵאֶרֶץ רְחוֹקָה
  choice: தொலைதூர நாட்டிலிருந்து
  rationale: புவியியல் தொலைவைத் தெளிவான நவீன தமிழில் துல்லியமாக வெளிப்படுத்துகிறது.
- source_word: לְמַעַן שְׁמֶךָ
  choice: உமது பெயரின் பொருட்டு
  rationale: கடவுளுடைய வெளிப்பட்ட புகழும் நற்பெயரும் அடங்கிய ‘பெயர்’ என்ற வேதாகமச் சொல்லாட்சியைத் தக்கவைத்து, வருவதற்கான காரணத்தைச் சுட்டுகிறது.
theological_decisions:
- issue: இஸ்ரவேலுக்கும் இஸ்ரவேலரல்லாத விண்ணப்பதாரருக்கும் இடையிலான உடன்படிக்கை சார்ந்த வேறுபாடு
  choice: உமது மக்களாகிய இஸ்ரவேலைச் சேராத அந்நியன்
  alternative: உமது மக்களாகிய இஸ்ரவேலைச் சேர்ந்திராத வெளிநாட்டவர்
  rationale: இவ்வசனம் சமூக ரீதியில் அறிமுகமில்லாத ஒருவரை மட்டும் அல்லாமல், இஸ்ரவேல் மக்களைச் சேராத ஒருவரைக் குறிக்கிறது. அதே நேரத்தில் ஆண்டவருடைய பெயரால் ஈர்க்கப்பட்டு அவர் வருவதையும் மொழிபெயர்ப்பு திறந்தவாறே வைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான வேதாகம நடையைக் காக்க ‘உமது’ பயன்படுத்தப்பட்டுள்ளது. வசனம் அடுத்த வசனத்தில் தொடர்வதால் இறுதியில் நீண்ட கோடு வைக்கப்பட்டுள்ளது; ‘வரும்போது’ அந்த தொடர்ச்சியைத் தமிழில் இயல்பாக்குகிறது.
