base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/029.yaml
  text: that your eyes may be open toward this house night and day[a], toward the place of which you said, ‘My name will be there,’ to hear the prayer that your servant prays toward this place.
translation:
  language: ta
  text: உமது அடியான் இந்த இடத்தை நோக்கிச் செலுத்தும் ஜெபத்தைக் கேட்பதற்காக, ‘என் பெயர் அங்கே இருக்கும்’[a] என்று நீர் சொன்ன இடத்தை நோக்கி, இரவும் பகலும் உமது கண்கள் இந்த ஆலயத்தை நோக்கித் திறந்திருக்கட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “என் பெயர் அங்கே இருக்கும்” என்பது தேவன் இந்த இடத்தைத் தமக்குரியதாகத் தேர்ந்தெடுத்து அதனுடன் தம்மை இணைத்துக்கொண்டதைக் குறிக்கும் ஆலய மொழிநடை. இது அவருடைய உடன்படிக்கை சார்ந்த பிரசன்னத்தை உணர்த்துகிறது; ஆனால் அந்தச் சொற்றொடரின் பொருளை அதற்கு மட்டும் சுருக்கிவிடக் கூடாது.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִהְיוֹת עֵינֶךָ פְתֻחוֹת
  choice: உமது கண்கள் ... திறந்திருக்கட்டும்
  rationale: எபிரெய மொழியின் நோக்கம்/விளைவை உணர்த்தும் அமைப்பை இயல்பான தமிழ் வேண்டுதல் வடிவில் தருகிறது. தேவனுடைய கவனமான பார்வையைக் குறிக்கும் ‘கண்கள் திறந்திருத்தல்’ என்ற உருவகத்தை விளக்கவுரையாக மாற்றாமல் காக்கிறது.
- source_word: אֶל הַבַּיִת הַזֶּה
  choice: இந்த ஆலயத்தை நோக்கி
  rationale: אֶל குறிக்கும் திசைநோக்கை ‘நோக்கி’ தெளிவாக வெளிப்படுத்துகிறது. இச்சூழலில் בַּיִת சாலொமோன் கட்டிய தேவாலயத்தைக் குறிப்பதால், நவீனத் தமிழில் ‘ஆலயம்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: לַיְלָה וָיוֹם
  choice: இரவும் பகலும்
  rationale: தொடர்ந்த காலத்தைக் குறிக்கும் எபிரெய இணைச்சொல்லை அதன் உருவத்தையும் இயல்பான தமிழ் நடையையும் காத்து மொழிபெயர்க்கிறது.
- source_word: אֶל הַמָּקוֹם
  choice: இடத்தை நோக்கி
  rationale: தேவன் தமது பெயருக்காகத் தேர்ந்தெடுத்த குறிப்பிட்ட இடத்தையும், அதை நோக்கிய திசையமைப்பையும் காக்கிறது.
- source_word: יִהְיֶה שְׁמִי שָׁם
  choice: என் பெயர் அங்கே இருக்கும்
  rationale: ‘பெயர்’ என்ற மூலச்சொல்லையும் அதன் ஆலய இறையியல் சார்ந்த செறிவையும் அப்படியே காக்கிறது; அதை ‘என் பிரசன்னம்’ அல்லது ‘நான் குடியிருப்பேன்’ என ஒரே விளக்கத்திற்குள் சுருக்கவில்லை.
- source_word: לִשְׁמֹעַ אֶל הַתְּפִלָּה
  choice: ஜெபத்தைக் கேட்பதற்காக
  rationale: לִשְׁמֹעַ என்பதன் நோக்கப் பொருளைத் தெளிவாக்கி, תְּפִלָּה என்பதற்கு பொதுவாகப் புரியும் ‘ஜெபம்’ என்ற சொல்லைப் பயன்படுத்துகிறது.
- source_word: יִתְפַּלֵּל עַבְדְּךָ
  choice: உமது அடியான் ... ஏறெடுக்கும்
  rationale: עֶבֶד என்பதன் பணிவான உறவுமுறையை ‘அடியான்’ காக்கிறது. ஜெபத்தை நோக்கி செலுத்துவதை ‘ஏறெடுக்கும்’ என்பது மரியாதையான, இயல்பான தமிழ் வழக்கில் வெளிப்படுத்துகிறது.
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: இந்த இடத்தை நோக்கி
  rationale: ஆலயத்தை நோக்கி ஜெபிக்கும் திசைநோக்கை மூலத்துக்கு ஏற்ப வெளிப்படுத்துகிறது.
theological_decisions:
- issue: தேவனுடைய கண்கள் திறந்திருப்பதாகக் கூறும் மனித உடல்சார் உருவகம்
  choice: ‘உமது கண்கள் ... திறந்திருக்கட்டும்’ என்று உருவகத்தை அப்படியே வைத்தல்
  alternative: ‘இந்த ஆலயத்தைக் கவனித்தருளும்’ அல்லது ‘இந்த ஆலயத்தைக் காத்தருளும்’
  rationale: மூல எபிரெயம் தேவனுடைய கவனத்தை உடல்சார் உருவகத்தால் எடுத்துரைக்கிறது. அதைச் சுருக்கமான கருத்துரையாக மாற்றாமல் வைத்திருப்பது கவித்துவத்தையும் இறையியல் அழுத்தத்தையும் காக்கிறது.
- issue: ‘என் பெயர் அங்கே இருக்கும்’ என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘என் பெயர் அங்கே இருக்கும்’ என்று காத்தல்
  alternative: ‘என் பிரசன்னம் அங்கே இருக்கும்’ அல்லது ‘நான் அங்கே குடியிருப்பேன்’
  rationale: இவ்வாக்கியம் தேவன் அந்த இடத்துடன் ஏற்படுத்திய தேர்ந்தெடுக்கப்பட்ட, உடன்படிக்கை சார்ந்த தொடர்பைக் குறித்தாலும், மூலத்தில் உள்ள ‘பெயர்’ என்ற சொல்லை ஒரே விளக்கமாக மாற்றுவது அதன் உண்மையான இறையியல் செறிவையும் பதற்றத்தையும் குறைக்கும்.
translation_notes:
  register: நவீன நிலையான தமிழில், ஜெபத்திற்குரிய கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. ‘நீர்/உமது/அடியான்’ ஆகிய வடிவங்கள் தேவனை நோக்கிய மரியாதையையும் சாலொமோனின் பணிவையும் காக்கின்றன; வாக்கிய அமைப்பு தமிழில் இயல்பாக அமைய நோக்கக் கூறு முன்வைக்கப்பட்டுள்ளது.
