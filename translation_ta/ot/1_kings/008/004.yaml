base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/004.yaml
  text: They brought up the ark of Yahweh[a], the tent of meeting, and all the holy vessels that were in the tent[b]; the priests and the Levites brought them up.
translation:
  language: ta
  text: யாவேயின் பேழையையும், சந்திப்புக் கூடாரத்தையும், அந்தக் கூடாரத்தில் இருந்த பரிசுத்தப் பொருட்கள் அனைத்தையும் ஆசாரியர்களும் லேவியர்களும் மேலே கொண்டுவந்தனர்[a]. அவர்கள் அவற்றை மேலே கொண்டுவந்தனர்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மேலே எடுத்துச் சென்றனர்’ என்றும் மொழிபெயர்க்கலாம். எபிரேய வினைச்சொல் ஊர்வலமாக மேல்நோக்கிக் கொண்டுசெல்லுதல் அல்லது எடுத்துச்செல்லுதல் ஆகிய இரண்டையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: எபிரேயத்தில் ‘ஆசாரியர்களும் லேவியர்களும்’ என்று உள்ளது. சிலர் இதை இன்னும் குறிப்பாக ‘லேவிய ஆசாரியர்கள்’ எனப் புரிந்துகொள்கிறார்கள்; ஆனால் எபிரேயச் சொல்லாட்சி இரு குழுக்களையும் பெயரிடுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: மேலே கொண்டுவந்தனர்
  rationale: עלה என்பதன் ஹிஃபில் வடிவம் ‘மேலே கொண்டுவருதல்/கொண்டுசெல்லுதல்’ என்று பொருள்படும். ஆலயம் இருந்த உயரமான இடத்தை நோக்கிய ஊர்வலத்தின் திசைநுணுக்கத்தை ‘மேலே’ என்பது காக்கிறது; பொருட்கள் எவ்வாறு எடுத்துச் செல்லப்பட்டன என்பதைத் தேவையின்றி குறிப்பாக்கவில்லை.
- source_word: אֲרוֹן יְהוָה
  choice: யாவேயின் பெட்டி
  rationale: אֲרוֹן என்பது இங்கு யாவேயோடு தொடர்புடைய பரிசுத்தப் பெட்டியைக் குறிக்கிறது. எபிரேயத்தில் இவ்விடத்தில் ‘உடன்படிக்கை’ என்ற சொல் இல்லாததால் அதைச் சேர்க்காமல், நேரடியான ‘பெட்டி’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் இயல்பாக ஒலிபெயர்க்கிறது.
- source_word: אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரம்
  rationale: மக்கள் அல்லது பிரதிநிதிகள் தேவனைச் சந்திக்கும் பரிசுத்த கூடாரத்தைக் குறிக்கும் நிலையான எபிரேயப் பெயரின் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: כָּל כְּלֵי הַקֹּדֶשׁ
  choice: பரிசுத்தப் பொருட்கள் அனைத்தும்
  rationale: כְּלִים என்பது பாத்திரங்கள், கருவிகள், பிற பயன்பாட்டுப் பொருட்கள் ஆகியவற்றை உள்ளடக்கும் விரிவான சொல். ‘பொருட்கள்’ அந்த வரம்பைத் திறந்தவாறே வைத்திருக்கிறது; הַקֹּדֶשׁ தரும் அர்ப்பணிக்கப்பட்ட தன்மையை ‘பரிசுத்த’ வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר בָּאֹהֶל
  choice: அந்தக் கூடாரத்தில் இருந்த
  rationale: சார்பு வாக்கியம் பரிசுத்தப் பொருட்களை இயல்பாக விளக்குகிறது. முன்னர் கூறப்பட்ட சந்திப்புக் கூடாரத்தையே குறிக்கிறது என்பதை ‘அந்தக்’ தெளிவாக்குகிறது.
- source_word: וַיַּעֲלוּ אֹתָם
  choice: அவற்றை மேலே கொண்டுவந்தனர்
  rationale: மூலத்தில் வினைச்சொல் மீண்டும் வருவதைக் காத்து, முதல் வாக்கியத்தின் திசைநுணுக்கத்தையும் தொடர்ச்சியையும் நிலைநிறுத்துகிறது.
- source_word: הַכֹּהֲנִים וְהַלְוִיִּם
  choice: ஆசாரியர்களும் லேவியர்களும்
  rationale: எபிரேய உரை இரு குழுக்களையும் தனித்தனியாகப் பெயரிடுவதால், அவற்றை ‘லேவிய ஆசாரியர்கள்’ என்று ஒன்றிணைக்காமல் இரண்டையும் வெளிப்படையாகத் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் அல்லது யெகோவா
  rationale: மூல உரை ஒரு பட்டத்தை அல்ல, தெய்வீகத் தனிப்பெயரைப் பயன்படுத்துகிறது. ‘யாவே’ என்பது அதைத் தமிழில் ஒலிபெயர்த்து அதன் தனிப்பெயர்த் தன்மையைக் காக்கிறது.
- issue: பொருட்களை எடுத்துச் சென்றவர்களாக ஆசாரியர்களும் லேவியர்களும் குறிப்பிடப்படுதல்
  choice: இரு குழுக்களையும் தனித்தனியாக வெளிப்படையாக வைத்தல்
  alternative: லேவிய ஆசாரியர்கள் என்று ஒரே குழுவாக விளக்குதல்
  rationale: הַכֹּהֲנִים וְהַלְוִיִּם என்பது ‘ஆசாரியர்களும் லேவியர்களும்’ என்று இரு பெயர்களைக் கொண்டுள்ளது. வேறு பகுதிகளோடு ஒத்திசைக்க முயன்று இங்குள்ள உரைநெருக்கடியை மறைக்காமல், மூலத்தின் இரட்டைச் சொல்லாட்சியைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதாகப் புரியும், ஆனால் வழிபாட்டு நிகழ்வுக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘சந்திப்புக் கூடாரம்’, ‘ஆசாரியர்கள்’, ‘லேவியர்கள்’ ஆகியவை வழக்கில் நிலைபெற்ற வேதாகமச் சொற்களாக வைக்கப்பட்டுள்ளன. அடிக்குறிப்புக் குறிகள் அவை விளக்கும் சொற்றொடர்களுக்குப் பின்னரே இடப்பட்டுள்ளன.
