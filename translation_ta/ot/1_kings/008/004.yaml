revisions:
- from: அவர்கள் யாவேயின் பெட்டியையும், சந்திப்புக் கூடாரத்தையும், அந்தக் கூடாரத்தில் இருந்த பரிசுத்தப் பொருட்கள் அனைத்தையும் மேலே கொண்டுவந்தனர்[a]. ஆசாரியர்களும் லேவியர்களும் அவற்றை மேலே கொண்டுவந்தனர்[b].
