base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/021.yaml
  text: And there I have set a place for the ark[b][a], in which is the covenant of Yahweh that he made with our fathers when he brought them out of the land of Egypt.
translation:
  language: ta
  text: அங்கே பேழைக்காக ஓர் இடத்தை அமைத்திருக்கிறேன். எகிப்து நாட்டிலிருந்து நம் தந்தையரை யாவே வெளியே கொண்டுவந்தபோது, அவர்களோடு யாவே செய்த உடன்படிக்கை அந்தப் பேழைக்குள் இருக்கிறது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאָשִׂם שָׁם מָקוֹם
  choice: அங்கே ஓர் இடத்தை அமைத்திருக்கிறேன்
  rationale: שׂים என்பதன் அடிப்படைப் பொருள் ‘வை/அமை’; ஆலயத்தில் பேழைக்கான இடத்தை ஏற்படுத்திய நிறைவேற்றப்பட்ட செயலை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: לָאָרוֹן
  choice: பேழைக்காக
  rationale: אָרוֹן இச்சூழலில் உடன்படிக்கைப் பேழையைக் குறிக்கிறது. அடுத்த பகுதி அதன் உள்ளடக்கத்தை அடையாளப்படுத்துவதால் ‘பேழை’ என்பது போதுமானதும் இயல்பானதும் ஆகும்.
- source_word: אֲשֶׁר שָׁם
  choice: அந்தப் பேழைக்குள் இருக்கிறது
  rationale: எபிரெய locative அமைப்பான ‘அதில்/அங்கே இருக்கிறது’ என்பதைத் தமிழில் தெளிவாகப் பேழையோடு இணைக்கிறது.
- source_word: בְּרִית יְהוָה
  choice: யாவே … செய்துகொண்ட உடன்படிக்கை
  rationale: בְּרִית என்பது ‘உடன்படிக்கை’; יְהוָה என்ற தனிப்பெயர் தமிழில் ‘யாவே’ என ஒலிபெயர்க்கப்படுகிறது.
- source_word: כָּרַת עִם
  choice: அவர்களோடு அவர் செய்துகொண்ட
  rationale: ‘உடன்படிக்கையை வெட்டுதல்’ என்ற எபிரெய மரபுத்தொடரைச் சொற்சொல்லாக மொழிபெயர்க்காமல், அதன் பொருளை இயல்பான தமிழில் தருகிறது; சொற்சொல் வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: עִם אֲבֹתֵינוּ
  choice: நம் தந்தையரை … அவர்களோடு
  rationale: אָבוֹתֵינוּ என்பதிலுள்ள ஆண்பால் மற்றும் குடும்பத் தலைமுறைச் சுட்டை ‘நம் தந்தையர்’ எனப் பாதுகாக்கிறது; விரிவான பொருளாக ‘முன்னோர்’ அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בְּהוֹצִיאוֹ אֹתָם מֵאֶרֶץ מִצְרָיִם
  choice: எகிப்து நாட்டிலிருந்து … யாவே வெளியே கொண்டுவந்தபோது
  rationale: בְּ + infinitive construct இங்குத் தரும் காலப் பொருளை ‘போது’ என்றும், Hiphil יצא-ஐ ‘வெளியே கொண்டுவந்தார்’ என்றும் மொழிபெயர்க்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் பட்டப்பெயர் அல்ல, நான்கெழுத்து இறைப் பெயரே உள்ளது; ஆகவே தனிப்பெயரைத் தமிழில் ஒலிபெயர்த்து வழங்குகிறது.
- issue: אֲבֹתֵינוּ என்பதிலுள்ள பாலினமும் தலைமுறைச் சுட்டும்
  choice: நம் தந்தையர்
  alternative: நம் முன்னோர்
  rationale: மூலத்தின் ஆண்பால் பன்மையை முதன்மை உரையில் பாதுகாக்கிறது; சூழலில் உள்ளடங்கக்கூடிய விரிவான ‘முன்னோர்’ என்ற வாசிப்பையும் அடிக்குறிப்பு தெரிவிக்கிறது.
- issue: כרת ברית என்ற உடன்படிக்கை மரபுத்தொடர்
  choice: உடன்படிக்கை செய்துகொண்டார்
  alternative: உடன்படிக்கையை வெட்டினார்
  rationale: சொற்சொல் வடிவம் தமிழில் தவறான பொருளுணர்வைத் தரக்கூடும். ஆகவே பொருளை முதன்மை உரையில் இயல்பாகத் தந்து, மூல உருவகத்தை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. நீண்ட எபிரெய வாக்கியம் வாசிப்புத் தெளிவுக்காக இரண்டு தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டாலும், இடம், பேழை, உடன்படிக்கை, வெளியே கொண்டுவருதல் ஆகிய தொடர்புகள் முழுமையாகப் பாதுகாக்கப்பட்டுள்ளன.
