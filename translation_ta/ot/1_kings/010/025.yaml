  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. பொருட்களின் பட்டியல் எபிரெய மூலத்தின் வரிசையிலும் இணை அமைப்பிலும் வைக்கப்பட்டுள்ளது; சொற்பொருள் தெளிவில்லாத இடங்கள் அடிக்குறிப்புகளில் திறந்தவையாக வைக்கப்பட்டுள்ளன.
