base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/025.yaml
  text: 'And they were bringing[a], each man his tribute: articles of silver, articles of gold, garments, weapons, spices, horses, and mules[c][b], year by year.'
translation:
  language: ta
  text: அவர்கள் ஒவ்வொருவரும் தங்கள் திறையாக[a] வெள்ளிப் பொருட்கள், பொன் பொருட்கள், ஆடைகள்[b], ஆயுதங்கள்[c], நறுமணப் பொருட்கள், குதிரைகள், கோவேறு கழுதைகள் ஆகியவற்றை ஆண்டுதோறும் கொண்டுவந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தங்கள் அன்பளிப்பாக’ அல்லது ‘தங்கள் காணிக்கையாக.’ எபிரெயச் சொல் பரிசு, காணிக்கை, திறை ஆகிய பொருள்களைக் குறிக்கலாம்; இங்குள்ள அரசச் சூழலால் ‘திறை’ என மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘மேலாடைகள்’ அல்லது ‘அங்கிகள்.’
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘போர்க்கவசங்கள்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: מְבִאִים
  choice: கொண்டுவந்தார்கள்
  rationale: הֵמָּה என்பதுடன் வரும் பங்கேற்புவினை, சாலொமோனின் ஆட்சிக்காலத்தில் வழக்கமாகத் தொடர்ந்து நடந்த செயலைக் குறிக்கிறது; ‘ஆண்டுதோறும்’ என்பதுடன் தமிழின் இறந்தகால வினை இந்த வழக்கமான தொடர்ச்சியை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אִישׁ מִנְחָתוֹ
  choice: ஒவ்வொருவரும் தங்கள் திறையாக
  rationale: אִישׁ இங்கு பகிர்வுப்பொருளில் ‘ஒவ்வொருவரும்’ எனப்படுகிறது. அரசரைச் சந்திக்கும் ஆட்சியாளர்கள் கொண்டுவந்த பொருட்களின் சூழலில் מִנְחָה என்பதற்கு ‘திறை’ பொருத்தமானது; எனினும் ‘அன்பளிப்பு’ அல்லது ‘காணிக்கை’ என்பதும் சாத்தியம்.
- source_word: כְּלֵי כֶסֶף / וּכְלֵי זָהָב
  choice: வெள்ளிப் பொருட்கள், பொன் பொருட்கள்
  rationale: כְּלִי என்பது பாத்திரம் மட்டும் அல்லாமல் பொருள், கருவி போன்ற பரந்த பொருளைக் கொண்டது. குறிப்பிட்ட வகை சொல்லப்படாததால் ‘பொருட்கள்’ அதன் பரப்பைத் தக்கவைக்கிறது; இரு தொடர்களிலும் இணை அமைப்பும் பாதுகாக்கப்படுகிறது.
- source_word: שְׂלָמוֹת
  choice: ஆடைகள்
  rationale: இந்தச் சொல் மேலாடைகள் அல்லது அங்கிகளைக் குறிக்கலாம். பட்டியலில் இயல்பாகவும், தேவையற்ற அளவு குறிப்பாக்காமலும் இருக்க ‘ஆடைகள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: נֵשֶׁק
  choice: ஆயுதங்கள்
  rationale: இங்கு இராணுவ உபகரணங்களைக் குறிக்கும் சொல்லாக உள்ளது. ‘ஆயுதங்கள்’ நவீனத் தமிழில் தெளிவானது; ‘போர்க்கவசங்கள்’ என்ற பொருளும் சாத்தியம்.
- source_word: בְשָׂמִים
  choice: நறுமணப் பொருட்கள்
  rationale: வணிகம் அல்லது திறைப் பொருட்களின் சூழலில் மணமுள்ள மசாலா, தைலம் மற்றும் பிற நறுமணப் பொருட்களை உள்ளடக்கக்கூடிய பரந்த மொழிபெயர்ப்பு.
- source_word: סוּסִים וּפְרָדִים
  choice: குதிரைகள், கோவேறு கழுதைகள்
  rationale: இரு எபிரெயச் சொற்களின் வழக்கமான விலங்குப் பெயர்கள் நேரடியாகவும் தெளிவாகவும் தரப்பட்டுள்ளன.
- source_word: דְּבַר שָׁנָה בְּשָׁנָה
  choice: ஆண்டுதோறும்
  rationale: இந்த எபிரெய மரபுத்தொடர் ஒவ்வொரு ஆண்டும் தவறாமல் நிகழ்ந்ததைக் குறிக்கிறது; ‘ஆண்டுதோறும்’ அதனை இயல்பான நவீனத் தமிழில் சுருக்கமாக வெளிப்படுத்துகிறது.
