base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/001.yaml
  text: The queen of Sheba heard of Solomon’s fame concerning the name of Yahweh[b][a], and she came to test him with riddles.
translation:
  language: ta
  text: சேபாவின் அரசி யாவேயின் பெயருடன் தொடர்புள்ள சாலொமோனின் புகழைப் பற்றி கேள்விப்பட்டாள்[a]. அவள் விடுகதைகளால்[b] அவனைச் சோதிக்க வந்தாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேயின் பெயரைப் பொறுத்தவரையில் சாலொமோனைப் பற்றிய செய்தியை கேள்விப்பட்டாள்.” எபிரேயத் தொடர் சுருக்கமானது; சாலொமோனின் புகழ் யாவேயின் பெயருடனோ அவரது புகழுடனோ இணைந்திருந்ததை அது குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “கடினமான கேள்விகளால்.” எபிரேயச் சொல் இன்னும் நேரடியாக “விடுகதைகள்” அல்லது “புதிர்கள்” என்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַלְכַּת שְׁבָא
  choice: சேபாவின் அரசி
  rationale: வாவ் இணைப்பைத் தமிழில் கட்டாயமாகத் தனிச் சொல்லால் காட்டாமல், புதிய நிகழ்வின் இயல்பான தொடக்கமாக மொழிபெயர்க்கிறது; இடப்பெயரையும் சார்பு அமைப்பையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: שֹׁמַעַת אֶת שֵׁמַע שְׁלֹמֹה
  choice: சாலொமோனின் புகழைக் கேள்விப்பட்டாள்
  rationale: שֵׁמַע என்பது ‘செய்தி, அறிக்கை, புகழ்’ எனப் பொருள்படலாம். தொலைதூர அரசி அதைக் கேட்டு விசாரிக்க வருகிற சூழலில் ‘புகழ்’ இயல்பானது; ‘கேள்விப்பட்டாள்’ என்ற வடிவம் கேட்டறிதலைத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: לְשֵׁם יְהוָה
  choice: யாவேயின் பெயருடன் தொடர்புடைய
  rationale: לְ இங்கு உறவு அல்லது தொடர்பைக் குறிக்கலாம். காரணம், நோக்கம் என்று மிகையாகத் தீர்மானிக்காமல், சாலொமோனின் புகழுக்கும் யாவேயின் பெயருக்கும் உள்ள தொடர்பை இந்த மொழிபெயர்ப்பு பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரேய மெய்யெழுத்துப் பெயரான יהוה-ஐ ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: וַתָּבֹא לְנַסֹּתוֹ
  choice: அவனைச் சோதிக்க வந்தாள்
  rationale: நிகழ்வை முன்னெடுக்கும் வினைத் தொடரையும் נסה என்பதன் ‘சோதித்தல்’ என்ற அடிப்படைப் பொருளையும் இயல்பான தமிழில் தருகிறது.
- source_word: בְּחִידוֹת
  choice: விடுகதைகளால்
  rationale: חִידוֹת என்பதன் நேரடியான பொருள் விடுகதைகள் அல்லது புதிரான கூற்றுகள்; ‘கடினமான கேள்விகள்’ என்பதைவிட இது மூலச்சொல்லை நெருக்கமாகப் பிரதிபலிக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலவசனம் இறைவனின் தனிப்பெயரான יהוה-ஐ நேரடியாகப் பயன்படுத்துகிறது. ஆகவே ஒரு பட்டத்தைப் பதிலிடாமல் தனிப்பெயரை ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: சாலொமோனின் புகழுக்கும் யாவேயின் பெயருக்கும் உள்ள தொடர்பு
  choice: பெயருடன் தொடர்புடைய
  alternative: யாவேயின் பெயரினிமித்தம் / யாவேயின் பெயரைப் பற்றிய
  rationale: எபிரேய לְשֵׁם என்ற சுருக்கமான தொடர் காரணம், நோக்கம் அல்லது பொதுவான தொடர்பு எனப் பலவாறு புரிந்துகொள்ளப்படலாம். பிரதான உரை பொதுவான தொடர்பை மட்டும் கூறி, தேவையற்ற இறையியல் முடிவைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘தொடர்புடைய’ என்பது மூலத்தின் சுருக்கத்திலும் தெளிவின்மையிலும் உள்ள இறையியல் இழுப்பைத் தீர்த்துவிடாமல் காக்கிறது; அடிக்குறி குறிகள் உரையில் அவை சார்ந்த சொற்றொடர்களுக்குப் பின் வைக்கப்பட்டுள்ளன.
