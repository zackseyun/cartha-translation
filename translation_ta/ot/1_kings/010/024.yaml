  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/כָ֨ל הָ/אָ֔רֶץ מְבַקְשִׁ֖ים אֶת פְּנֵ֣י שְׁלֹמֹ֑ה לִ/שְׁמֹ֨עַ֙ אֶת חָכְמָת֔/וֹ אֲשֶׁר נָתַ֥ן אֱלֹהִ֖ים בְּ/לִבּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/024.yaml
  text: And all the earth sought the presence of Solomon[a], to hear his wisdom that God had put in his heart.
translation:
  language: ta
  text: பூமியெங்குமிருந்த மக்கள், கடவுள் அவருடைய உள்ளத்தில் வைத்திருந்த ஞானத்தைக் கேட்பதற்காக, சாலொமோனின் முன்னிலையை நாடினர்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “சாலொமோனின் முகத்தை நாடினர்”; இது அவருடைய முன்னிலையையோ சந்திப்பையோ நாடினர் என்ற மரபுத்தொடர் பொருளுடையது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל הָאָרֶץ
  choice: பூமியெங்குமிருந்த மக்கள்
  rationale: எபிரெயச் சொற்றொடர் சொல்லர்த்தமாக ‘பூமி அனைத்தும்’ எனினும், நாடிவருவதும் கேட்பதும் மக்களே. அரசவையைச் சார்ந்த இச்சூழலில் அறியப்பட்ட உலகின் பல இடங்களிலிருந்த மக்களைக் குறிக்கும் பரந்த, மிகைப்படுத்தப்பட்ட கூட்டுச் சொல்லாக இதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מְבַקְשִׁים
  choice: நாடிவந்தார்கள்
  rationale: பங்கேற்புவினை தொடர்ச்சியான அல்லது வழக்கமான செயலைக் காட்டுகிறது. ‘நாடிவந்தார்கள்’ என்பது பலரும் தொடர்ந்து சாலொமோனைச் சந்திக்க முயன்று வந்தனர் என்ற கதைச்சுருக்கப் பொருளை இயல்பாகத் தருகிறது.
- source_word: אֶת־פְּנֵי שְׁלֹמֹה
  choice: சாலொமோனின் முகத்தைக் காண
  rationale: ‘முகத்தை நாடுதல்’ என்ற எபிரெய உருவகத்தைத் தமிழில் புரியத்தக்கவாறு தக்கவைக்கிறது; இங்கு அது சாலொமோனின் முன்னிலையை அடைந்து அவரைச் சந்திப்பதைக் குறிக்கிறது.
- source_word: לִשְׁמֹעַ
  choice: கேட்க
  rationale: நோக்கத்தைக் குறிக்கும் வினையெச்சத்தின் நேரடியான, இயல்பான தமிழ் வடிவம்.
- source_word: חָכְמָתוֹ
  choice: அவருடைய ஞானத்தை
  rationale: மூலத்தின் உடைமைப் பின்னொட்டை நேரடியாகப் பிரதிபலித்து, கவனத்தை சாலொமோனுக்குக் கொடுக்கப்பட்ட ஞானத்தின் மேல் வைத்திருக்கிறது.
- source_word: אֲשֶׁר נָתַן אֱלֹהִים בְּלִבּוֹ
  choice: கடவுள் அவருடைய உள்ளத்தில் வைத்திருந்த
  rationale: נָתַן என்பதன் அடிப்படைப் பொருள் ‘கொடுத்தார்’; ஆனால் ‘உள்ளத்தில் கொடுத்தார்’ என்பதைவிட ‘உள்ளத்தில் வைத்திருந்த’ என்பது தமிழில் இயல்பாக இருந்து, ஞானம் முன்பே கடவுளால் அளிக்கப்பட்டது என்பதையும் காட்டுகிறது. ‘உள்ளம்’ என்பது அறிவு, விருப்பம் உள்ளிட்ட அகமனிதனைச் சுட்டும் எபிரெயக் கருத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: אֱלֹהִים என்பதன் மொழிபெயர்ப்பு
  choice: கடவுள்
  alternative: ஆண்டவர்
  rationale: மூலத்தில் உடன்படிக்கைப் பெயரான יהוה அல்ல, אֱלֹהִים இடம்பெறுகிறது. ஆகவே அந்தச் சொல் வேறுபாட்டைப் பாதுகாக்க ‘கடவுள்’ பயன்படுத்தப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘முகத்தைக் காண நாடுதல்’ என்ற மூல உருவகம் முதன்மை உரையில் தக்கவைக்கப்பட்டு, அதன் மரபுத்தொடர் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
