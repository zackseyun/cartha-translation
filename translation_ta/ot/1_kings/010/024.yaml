revisions:
- from: பூமியெங்குமிருந்த மக்கள் சாலொமோனின் முகத்தைக் காண நாடிவந்தார்கள்[a]; ஏனெனில், கடவுள் அவருடைய உள்ளத்தில் வைத்திருந்த ஞானத்தைக் கேட்க அவர்கள் விரும்பினார்கள்.
  to: பூமியெங்குமிருந்த மக்கள், கடவுள் அவருடைய உள்ளத்தில் வைத்திருந்த ஞானத்தைக் கேட்பதற்காக, சாலொமோனின் முன்னிலையை நாடினர்[a].
  rationale: The revision restores the Hebrew purpose construction, avoids adding an explicit desire or journey, and expresses the 'seek the face of' idiom naturally in modern standard Tamil. The footnote preserves the literal Hebrew imagery and explains its idiomatic meaning.
