  text: וַ/יִּתֵּ֨ן הַ/מֶּ֧לֶךְ אֶת הַ/כֶּ֛סֶף בִּ/ירוּשָׁלִַ֖ם כָּ/אֲבָנִ֑ים וְ/אֵ֣ת הָ/אֲרָזִ֗ים נָתַ֛ן כַּ/שִּׁקְמִ֥ים אֲשֶׁר בַּ/שְּׁפֵלָ֖ה לָ/רֹֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/027.yaml
  text: The king made silver as common in Jerusalem as stones[b][a], and he made cedars as plentiful as the sycamore trees that are in the Shephelah.
translation:
  language: ta
  text: அரசன் எருசலேமில் வெள்ளி கற்களைப்போல் ஏராளமாக இருக்கச் செய்தான்; செப்பேலா[a] பகுதியில் உள்ள சைக்கமோர் அத்தி மரங்களைப்போல்[b] கேதுரு மரங்களும் ஏராளமாக இருக்கச் செய்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தாழ்நிலப் பகுதியில்.” “செப்பேலா” என்பது யூதாவின் மலைநாட்டுக்கும் கடற்கரைச் சமவெளிக்கும் இடையிலுள்ள அடிவாரப் பகுதியின் பெயர்.
    reason: cultural_note
  - marker: b
    text: எபிரெயச் சொல் sycamore fig எனப்படும் ஒரு வகை அத்தி மரங்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן / נָתַן
  choice: மிகுதியாக்கினான் / ஏராளமாக்கினான்
  rationale: נתן என்பதன் அடிப்படைப் பொருள் ‘கொடுத்தான்/வைத்தான்’ என்றாலும், இங்குள்ள ஒப்புமை அமைப்பில் பொருட்கள் மிகுதியாகக் கிடைக்கச் செய்தான் என்பதே இயல்பான பொருள். தமிழில் இரு ஒப்புமைகளுக்கும் சூழலுக்கேற்ற இயல்பான வினைகள் பயன்படுத்தப்பட்டுள்ளன.
- source_word: הַמֶּלֶךְ
  choice: அரசன்
  rationale: எபிரெய மூலத்தில் ‘அரசன்’ என்றே உள்ளது; சூழலில் சாலொமோனைக் குறிப்பிட்டாலும், இந்த வசனத்தில் பெயர் சேர்க்கப்படவில்லை.
- source_word: הַכֶּסֶף
  choice: வெள்ளி
  rationale: இங்கு நாணயத்தைவிட வெள்ளி என்னும் மதிப்புமிக்க பொருள் பொதுவாகக் குறிக்கப்படுகிறது.
- source_word: בִּירוּשָׁלִַם
  choice: எருசலேமில்
  rationale: இடத்தைக் குறிக்கும் எபிரெய முன்னொட்டுடன் கூடிய பெயரின் நேரான தமிழ் வடிவம்.
- source_word: כָּאֲבָנִים
  choice: கற்களைப்போல்
  rationale: כ ஒப்புமையைக் குறிக்கிறது; ‘கற்களைப்போல்’ என்பது மூலத்தின் உருவகத்தை இயல்பாகக் காக்கிறது.
- source_word: הָאֲרָזִים
  choice: கேதுரு மரங்கள்
  rationale: אֲרָזִים என்பது கேதுரு மரங்களையோ அவற்றின் மரப்பொருளையோ குறிக்கலாம். ‘கேதுரு மரங்கள்’ மூலச் சொல்லின் உருவத்தைத் தக்கவைத்து தமிழ் வாசகருக்கு தெளிவளிக்கிறது.
- source_word: כַּשִּׁקְמִים
  choice: காட்டத்தி மரங்களைப்போல்
  rationale: שִׁקְמִים என்பது sycamore fig எனப்படும் அத்தி இன மரங்களைக் குறிக்கிறது; நவீனத் தமிழில் ‘காட்டத்தி மரம்’ என்பது பொருளைத் தெளிவாகச் சொல்கிறது.
- source_word: אֲשֶׁר בַּשְּׁפֵלָה
  choice: செப்பேலா பகுதியில் உள்ள
  rationale: שְׁפֵלָה என்பது யூதாவின் மலைநாட்டுக்கும் கடற்கரைச் சமவெளிக்கும் இடையிலுள்ள குறிப்பிட்ட அடிவாரப் பகுதியின் புவிப்பெயர். பெயர் ஒலிபெயர்க்கப்பட்டு அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: לָרֹב
  choice: ஏராளமாக்கினான்
  rationale: இந்தச் சொற்றொடர் பெரும் எண்ணிக்கை அல்லது மிகுதியைக் குறிக்கிறது; தமிழில் ஒப்புமையை முழுமைப்படுத்தும் இயல்பான வடிவம்.
