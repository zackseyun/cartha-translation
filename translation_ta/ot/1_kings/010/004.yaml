lexical_decisions:
- source_word: וַתֵּרֶא
  choice: கண்டபோது
  rationale: வாவ் தொடர்வினை கதையை முன்னெடுத்தாலும், இந்த வசனம் அடுத்த வசனத்தில் தொடரும் நீண்ட வாக்கியத்தின் சார்புநிலைக் கூறாக உள்ளது; எனவே தமிழில் ‘கண்டபோது’ இயல்பாகவும் தொடரமைப்பைத் தெளிவாகவும் காட்டுகிறது.
- source_word: מַלְכַּת שְׁבָא
  choice: சேபாவின் அரசி
  rationale: இது சேபா நாட்டின் பெண் ஆட்சியாளரைக் குறிக்கும் இணைப்புத் தொடர்; ‘அரசி’ என்பது நவீனத் தமிழில் இயல்பான, கண்ணியமான பதம்.
- source_word: אֵת
  choice: '[நேரடிச் செயப்படுபொருள் குறியீடு; தனியாக மொழிபெயர்க்கப்படவில்லை]'
  rationale: எபிரெய மொழியில் வரையறுக்கப்பட்ட நேரடிச் செயப்படுபொருளைக் குறிக்கிறது; தமிழில் இதற்குத் தனிச் சொல் தேவையில்லை.
- source_word: כָּל חָכְמַת שְׁלֹמֹה
  choice: சாலொமோனுடைய ஞானம் முழுவதையும்
  rationale: כָּל என்பது ஞானத்தின் முழுமையைக் குறிக்கிறது. ‘ஞானம் முழுவதையும்’ என்பது தமிழில் இயல்பாக இருந்து மூலத்தின் பொருளைத் தக்கவைக்கிறது.
- source_word: וְהַבַּיִת
  choice: அரண்மனையையும்
  rationale: בַּיִת என்பதன் அடிப்படைப் பொருள் ‘வீடு’; ஆனால் இவ்வரசச் சூழலில் அது சாலொமோனின் அரச இருப்பிடமான அரண்மனையைக் குறிக்கிறது. முதன்மை உரையில் சூழலுக்கு இயல்பான ‘அரண்மனை’ தேர்ந்தெடுக்கப்பட்டுள்ளது; நேரடிப் பதம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אֲשֶׁר בָּנָה
  choice: அவன் கட்டியிருந்த
  rationale: இது அரண்மனையை விளக்கும் தொடர்புக் கூறு. அரசி அதைக் கண்ட நேரத்துக்கு முன்பே கட்டிடம் முடிந்திருந்ததை ‘கட்டியிருந்த’ இயல்பாக வெளிப்படுத்துகிறது.
