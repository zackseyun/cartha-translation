  register: நவீன நிலையான தமிழில், கணக்கறிக்கைத் தன்மையைப் பாதுகாக்கும் சுருக்கமான, கண்ணியமான நடை. ‘ஒரே ஆண்டில்’ என்பதை முன்வைப்பது தமிழில் காலவரம்பையும் ஆண்டு மொத்தத்தையும் தெளிவாக்குகிறது.
