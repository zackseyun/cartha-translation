  text: וַֽ/יְהִי֙ מִשְׁקַ֣ל הַ/זָּהָ֔ב אֲשֶׁר בָּ֥א לִ/שְׁלֹמֹ֖ה בְּ/שָׁנָ֣ה אֶחָ֑ת שֵׁ֥שׁ מֵא֛וֹת שִׁשִּׁ֥ים וָ/שֵׁ֖שׁ כִּכַּ֥ר זָהָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/014.yaml
  text: The weight of the gold that came to Solomon in one year was six hundred sixty-six talents of gold,[a]
translation:
  language: ta
  text: ஒரே ஆண்டில் சாலொமோனுக்கு வந்த தங்கத்தின் எடை அறுநூற்று அறுபத்தாறு தங்கத் தாலந்துகளாக இருந்தது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: தாலந்து என்பது பண்டைக்காலத்தில் பயன்படுத்தப்பட்ட பெரிய எடை அலகு. இவ்வசனம் ஓராண்டில் கிடைத்த அளவை நவீன அலகுகளாக மாற்றாமல், பண்டைய அளவிலேயே தருகிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי
  choice: ஆகும்
  rationale: היה வினை கணக்கின் மொத்தத்தைத் தெரிவிக்கிறது. எபிரெய மொழியின் தொடக்க இணைப்பைத் தனியாகச் சேர்க்காமல், இயல்பான தமிழ் வாக்கிய முடிவில் பொருள் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: מִשְׁקַל
  choice: எடை
  rationale: கணக்கீட்டுச் சூழலில் அளவிடப்பட்ட பாரத்தைக் குறிக்கும் நேரடியான நவீனத் தமிழ் சொல்.
- source_word: הַזָּהָב ... זָהָב
  choice: தங்கத்தின் ... தாலந்து
  rationale: முதலாவது சொல்லை ‘தங்கத்தின்’ எனக் கொடுத்து எதை எடைபோட்டார்கள் என்பதைத் தெளிவாக்குகிறது; தமிழில் ‘தாலந்து’ ஏற்கெனவே எடை அலகைக் குறிப்பதால் இறுதியில் ‘தங்கம்’ என்பதை மீண்டும் கூறுவது இயல்பற்ற மறுமொழியாகும்.
- source_word: אֲשֶׁר בָּא לִשְׁלֹמֹה
  choice: சாலொமோனுக்கு வந்த
  rationale: யார் கொண்டுவந்தார் என்று மூலத்தில் இல்லாத செய்பவரைச் சேர்க்காமல், தங்கம் சாலொமோனை வந்தடைந்தது என்ற பொருளைப் பாதுகாக்கிறது.
- source_word: בְּשָׁנָה אֶחָת
  choice: ஒரே ஆண்டில்
  rationale: ஒரு ஆண்டுக் காலப்பகுதிக்குள் கிடைத்த அளவு என்பதை இயல்பாகவும் வலியுறுத்தலுடனும் தெரிவிக்கிறது.
- source_word: שֵׁשׁ מֵאוֹת שִׁשִּׁים וָשֵׁשׁ
  choice: அறுநூற்று அறுபத்தாறு
  rationale: எபிரெய எண்ணின் நேரடியான, நிலையான தமிழ் வடிவம்.
- source_word: כִּכַּר
  choice: தாலந்து
  rationale: பண்டைய பெரிய எடை அலகின் மரபான தமிழ் ஒலிபெயர்ப்பு; உறுதியற்ற நவீன எடை மாற்றத்தை முதன்மை உரையில் தவிர்க்கிறது.
