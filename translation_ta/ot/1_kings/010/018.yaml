  text: Then the king made a great ivory throne and overlaid it with refined gold[a].
translation:
  language: ta
  text: பின்பு அரசன் யானைத்தந்தத்தால் ஒரு பெரிய அரியணையைச் செய்து, அதை உயர்தரத் தங்கத்தால் மூடினான்[a].
