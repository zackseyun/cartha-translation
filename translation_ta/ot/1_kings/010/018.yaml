    reason: மூפָז என்பதன் தரத்தைக் குறிக்கும் மாற்று மொழிபெயர்ப்புகள்.
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: பின்பு ... செய்து
  rationale: வய்யிக்தோல் வடிவம் கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது; நவீன தமிழில் அதன் தொடர்ச்சியை இயல்பாகக் காட்ட ‘பின்பு’ பயன்படுத்தப்பட்டது.
- source_word: הַמֶּלֶךְ
  choice: அரசன்
  rationale: சூழலில் சாலொமோனைக் குறிக்கும் திட்டவட்டமான அரசப் பட்டம்.
- source_word: כִּסֵּא
  choice: அரியணை
  rationale: அரசச் சூழலில் பொதுவான ‘இருக்கை’ என்பதைவிட ‘அரியணை’ துல்லியமானது.
- source_word: שֵׁן
  choice: யானைத்தந்தம்
  rationale: இச்சொல் அடிப்படையில் ‘பல்’ அல்லது ‘தந்தம்’ எனப் பொருள்பட்டாலும், அரியணையின் பொருளைக் குறிக்கும் இக்கட்டமைப்பில் யானைத்தந்தத்தைக் குறிக்கிறது.
- source_word: גָּדוֹל
  choice: பெரிய
  rationale: அளவையும் அரசருக்குரிய பிரமாண்டத்தையும் சூழலுக்கேற்ப எடுத்துரைக்கிறது.
- source_word: וַיְצַפֵּהוּ
  choice: அதன்மேல் ... பதித்தான்
  rationale: צפה என்பது ஒரு பொருளின் மேற்பரப்பை மற்றொரு பொருளால் மூடுதல் அல்லது மேல்பூச்சிடுதல் எனப் பொருள்படும்; உலோக வேலைப்பாட்டுச் சூழலில் ‘பதித்தான்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: זָהָב
  choice: தங்கம்
  rationale: சூழலில் தெளிவான பொருட்பெயர்.
- source_word: מוּפָז
  choice: புடமிட்ட
  rationale: உயர்தரமாகச் சுத்திகரிக்கப்பட்ட தங்கத்தைக் குறிக்கும் அரிய சொல்; ‘புடமிட்ட’ என்பது சுத்திகரிப்பு எண்ணத்தை இயல்பான தமிழில் தருகிறது, ஆனால் ‘தூய’ அல்லது ‘உயர்தரமான’ என்பதும் சாத்தியம்.
