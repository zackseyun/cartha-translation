- from: பின்பு அரசன் யானைத்தந்தத்தால் ஒரு பெரிய அரியணையைச் செய்து, அதன்மேல் புடமிட்ட தங்கத்தைப் பதித்தான்[a].
  to: பின்பு அரசன் யானைத்தந்தத்தால் ஒரு பெரிய அரியணையைச் செய்து, அதை உயர்தரத் தங்கத்தால் மூடினான்[a].
  rationale: Gold is said to cover or overlay the throne, not to be set into it. The revision therefore replaces ‘பதித்தான்’ with ‘மூடினான்.’ It also uses ‘உயர்தரத் தங்கம்’ for the high-quality sense of מוּפָז and retains lexical alternatives in the anchored footnote.
