  yaml_path: translation/ot/1_kings/010/003.yaml
  text: And Solomon answered all her questions[a]; there was nothing hidden from the king that he did not tell her.
translation:
  language: ta
  text: சாலொமோன் அவளுடைய எல்லாக் கேள்விகளுக்கும் பதிலளித்தார்[a]. அவளுக்குச் சொல்லாத எந்தக் காரியமும் அரசருக்கு மறைவாக இருக்கவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொல்லுக்கு நெருக்கமாக, “சாலொமோன் அவளுடைய எல்லா வார்த்தைகளையும் அல்லது காரியங்களையும் அவளுக்குச் சொன்னார்.” எபிரெயச் சொற்றொடரை இவ்வாறு மொழிபெயர்க்கலாம்; ஆனால் சூழலில் இது அரசியின் விசாரணைகளுக்குச் சாலொமோன் அளித்த பதில்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֶּד
  choice: பதிலளித்தார்
  rationale: נגד என்பதன் அடிப்படைப் பொருள் ‘சொல்/அறிவி’ என்பதாக இருந்தாலும், அரசி கடினமான கேள்விகளால் சாலொமோனைச் சோதித்த சூழலில் இது அவர் அவற்றுக்குப் பதில் கூறியதைக் குறிக்கிறது.
- source_word: דְּבָרֶיהָ
  choice: அவளுடைய எல்லாக் கேள்விகளுக்கும்
  rationale: דבר என்பது ‘சொல், காரியம்’ எனப் பரந்த பொருளுடையது; முந்தைய சூழலில் அரசி கேட்ட கடினமான கேள்விகளையே இங்கு குறிக்கிறது. ‘-க்கும்’ என்ற வேற்றுமை உருபு இயல்பான தமிழில் ‘பதிலளித்தார்’ என்பதுடன் பொருந்துகிறது.
- source_word: לֹא הָיָה דָּבָר נֶעְלָם מִן־הַמֶּלֶךְ
  choice: எதுவும் அரசருக்கு மறைவாக இருக்கவில்லை
  rationale: எந்தக் காரியமும் அரசரிடமிருந்து மறைக்கப்பட்டதாகவோ அவரது அறிவுக்கு எட்டாததாகவோ இல்லை என்ற எபிரெயச் சொல்லமைப்பை நெருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: אֲשֶׁר לֹא הִגִּיד לָהּ
  choice: அவளுக்கு விளக்கிச் சொல்ல முடியாத
  rationale: முந்தைய எதிர்மறைக் கூற்றுடன் இணைந்து, அரசர் அவளுக்கு எடுத்துச் சொல்லாமல் விட்ட அல்லது விளக்க இயலாத காரியம் ஒன்றும் இல்லை என்பதைக் குறிக்கிறது. ‘விளக்கிச் சொல்ல’ என்பது கேள்வி–பதில் சூழலுக்கு இயல்பானது.
