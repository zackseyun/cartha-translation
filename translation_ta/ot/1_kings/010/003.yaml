translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘அரசர்’ என்ற சொல் மூலத்தின் ‘the king’ என்ற அரச அடையாளத்தைத் தக்கவைக்கிறது; முதல் வாக்கியத்தில் ‘சாலொமோன்’ என்ற பெயர் இருப்பதால் மீளுரையும் தவிர்க்கப்படுகிறது.
