  text: יְהִ֨י יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ בָּר֔וּךְ אֲשֶׁר֙ חָפֵ֣ץ בְּ/ךָ֔ לְ/תִתְּ/ךָ֖ עַל כִּסֵּ֣א יִשְׂרָאֵ֑ל בְּ/אַהֲבַ֨ת יְהוָ֤ה אֶת יִשְׂרָאֵל֙ לְ/עֹלָ֔ם וַ/יְשִֽׂימְ/ךָ֣ לְ/מֶ֔לֶךְ לַ/עֲשׂ֥וֹת מִשְׁפָּ֖ט וּ/צְדָקָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/009.yaml
  text: Blessed be Yahweh your God[a], who delighted in you to set you on the throne of Israel. Because Yahweh loved Israel forever, he has made you king to administer justice and righteousness.
translation:
  language: ta
  text: உம்மில் மகிழ்ந்து, உம்மை இஸ்ரவேலின் அரியணையில் அமர்த்திய உமது இறைவனாகிய யாவே போற்றப்படுவாராக! இஸ்ரவேல்மீது யாவே கொண்ட என்றென்றுமுள்ள அன்பினால்[a], நியாயத்தையும் நீதியையும் நிலைநாட்டுவதற்காக அவர் உம்மை அரசராக்கினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவே இஸ்ரவேலை என்றென்றும் நேசிப்பதால்.” எபிரெயச் சொற்றொடர் ‘அன்பு’ என்பதைப் பெயர்ச்சொல்லாகக் கொண்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי ... בָּרוּךְ
  choice: போற்றப்படுவாராக
  rationale: வாழ்த்துரையின் விருப்பநிலையையும் தெய்வத்தைப் புகழும் இயல்பான நவீனத் தமிழையும் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெயத் தெய்வீகப் பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்க்கிறது.
- source_word: אֱלֹהֶיךָ
  choice: உமது இறைவன்
  rationale: இரண்டாம் நபர் ஒருமை உடைமையை மரியாதை நடையில் இயல்பாகக் காட்டுகிறது.
- source_word: אֲשֶׁר חָפֵץ בְּךָ
  choice: உம்மில் மகிழ்ந்து
  rationale: חפץ என்பதிலுள்ள விருப்பம், மகிழ்ச்சி, ஆதரவு ஆகிய உணர்வுகளைச் சுருக்கமாகக் கொண்டுவருகிறது.
- source_word: לְתִתְּךָ עַל כִּסֵּא יִשְׂרָאֵל
  choice: உம்மை இஸ்ரவேலின் அரியணையில் அமர்த்திய
  rationale: அரச பதவியில் அமர்த்துதல் என்ற உருவகத்தையும் செயலையும் இயல்பான தமிழில் காக்கிறது.
- source_word: בְּאַהֲבַת יְהוָה אֶת יִשְׂרָאֵל לְעֹלָם
  choice: இஸ்ரவேல்மீது யாவே கொண்ட என்றென்றுமுள்ள அன்பினால்
  rationale: בְּ என்பதன் காரணப் பொருளையும் אַהֲבָה என்பதன் பெயர்ச்சொல் வடிவத்தையும் לְעוֹלָם என்பதன் நீடித்த காலப் பொருளையும் காக்கிறது.
- source_word: וַיְשִׂימְךָ לְמֶלֶךְ
  choice: அவர் உம்மை அரசராக்கினார்
  rationale: שׂים + לְ குறிக்கும் அரச நியமனத்தை நேரடியாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: לַעֲשׂוֹת מִשְׁפָּט וּצְדָקָה
  choice: நியாயத்தையும் நீதியையும் நிலைநாட்டுவதற்காக
  rationale: அரச ஆட்சிச் சூழலில் ‘செய்தல்’ என்பது நியாயமான ஆட்சியை நடைமுறைப்படுத்துவதைக் குறிக்கிறது; இணைச்சொற்களின் வேறுபாடும் காக்கப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் நேரடியாக வரும் உடன்படிக்கைப் பெயரைப் பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: בְּאַהֲבַת יְהוָה என்பதன் இலக்கண வடிவமும் காரணப் பொருளும்
  choice: இஸ்ரவேல்மீது யாவே கொண்ட என்றென்றுமுள்ள அன்பினால்
  alternative: யாவே இஸ்ரவேலை என்றென்றும் நேசிப்பதால்
  rationale: மூலத்தின் பெயர்ச்சொல் அமைப்பையும் காரணப் பொருளையும் முதன்மை உரையில் காக்கிறது; வினைச்சொல் வடிவிலான இயல்பான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன செந்தமிழ் சார்ந்த, பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. சேபா அரசி சாலொமோனிடம் உரையாடுவதால் ‘உமது/உம்மை’ என்ற மரியாதை ஒருமை வடிவங்கள் தேர்ந்தெடுக்கப்பட்டுள்ளன.
