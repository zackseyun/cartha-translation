base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/029.yaml
  text: And a chariot was imported from Egypt for six hundred shekels of silver[a], and a horse for a hundred and fifty[c][b]; and so they exported them to all the kings of the Hittites and to the kings of Aram by their hand.
translation:
  language: ta
  text: எகிப்திலிருந்து இறக்குமதி செய்யப்பட்ட ஒரு தேரின் விலை அறுநூறு சேக்கல் வெள்ளி[a]; ஒரு குதிரையின் விலை நூற்றைம்பது சேக்கல் வெள்ளி. அவ்வாறே, ஏத்தியரின் அரசர்கள் அனைவருக்கும் அராமின் அரசர்களுக்கும் அவர்கள் மூலமாக இவற்றை ஏற்றுமதி செய்தார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், ‘அறுநூறு வெள்ளி.’ இங்கு ‘சேக்கல்’ என்பது பொருளில் உள்ள அளவீட்டு அலகு.
    reason: implicit_unit
  - marker: b
    text: அல்லது, ‘எகிப்திலிருந்து மேலே கொண்டுவரப்பட்டது … அவர்கள் அவற்றை வெளியே கொண்டுபோனார்கள்.’ வணிகச் சூழலில் இவ்வியக்க வினைச்சொற்கள் இறக்குமதியையும் ஏற்றுமதியையும் குறிக்கின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעֲלֶה וַתֵּצֵא
  choice: இறக்குமதி செய்யப்பட்ட
  rationale: இச்சொற்கள் நேரடியாக ‘மேலே போனது, வெளியே வந்தது’ என்றாலும், எகிப்திலிருந்து பொருட்கள் கொண்டுவரப்பட்ட வணிகச் சூழலில் ‘இறக்குமதி செய்யப்பட்ட’ என்பது இயல்பாகப் பொருளைத் தெரிவிக்கிறது.
- source_word: מֶרְכָּבָה
  choice: ஒரு தேர்
  rationale: எபிரெயச் சொல் ஒருமையில் உள்ளது; ஒவ்வொரு தேருக்குமான விலை கூறப்படுவதால் ஒருமை இயல்பானது.
- source_word: בְּשֵׁשׁ מֵאוֹת כֶּסֶף
  choice: அறுநூறு சேக்கல் வெள்ளி
  rationale: எபிரெயத்தில் ‘அறுநூறு வெள்ளி’ என உள்ளது; எடையையும் பண மதிப்பையும் குறிக்கும் ‘சேக்கல்’ தெளிவுக்காகச் சேர்க்கப்பட்டது.
- source_word: וְסוּס
  choice: ஒரு குதிரை
  rationale: அடிப்படைப் பொருளான ‘குதிரை’ தக்கவைக்கப்பட்டது; போர்க்குதிரை என்று மூலத்தில் குறிப்பாக இல்லை.
- source_word: בַּחֲמִשִּׁים וּמֵאָה
  choice: நூற்றைம்பது சேக்கல் வெள்ளி
  rationale: முந்தைய விலைச் சொல்லிலிருந்து அளவீடும் வெள்ளியும் பொருளில் தொடர்கின்றன; தமிழில் தெளிவுக்காக இரண்டும் மீண்டும் வழங்கப்பட்டன.
- source_word: לְכָל מַלְכֵי הַחִתִּים
  choice: ஏத்தியரின் அரசர்கள் அனைவருக்கும்
  rationale: பெறுநர்களைக் குறிக்கும் לְ என்பதையும் இன-அரசியல் பெயரையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וּלְמַלְכֵי אֲרָם
  choice: அராமின் அரசர்களுக்கும்
  rationale: எபிரெய மூலப்பெயரான ‘அராம்’ தக்கவைக்கப்பட்டது; பாரம்பரியமான ‘சீரியா’ என்ற விளக்கப்பெயர் தவிர்க்கப்பட்டது.
- source_word: בְּיָדָם
  choice: அவர்கள் மூலமாக
  rationale: நேரடியாக ‘அவர்களுடைய கையால்’ எனும் முகமைக்கான மரபுத்தொடர்; தற்போதைய தமிழில் ‘அவர்கள் மூலமாக’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: יֹצִיאוּ
  choice: ஏற்றுமதி செய்தார்கள்
  rationale: ஹிஃபில் வடிவம் ‘வெளியே கொண்டுபோனார்கள்’ என்பதைக் குறிக்கிறது; வணிகச் சூழலில் ‘ஏற்றுமதி செய்தார்கள்’ பொருத்தமானது.
