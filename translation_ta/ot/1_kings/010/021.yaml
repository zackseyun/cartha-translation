  yaml_path: translation/ot/1_kings/010/021.yaml
  text: All King Solomon’s drinking vessels were gold[a], and all the vessels of the House of the Forest of Lebanon were pure gold[b]. Silver was not considered anything in the days of Solomon.
translation:
  language: ta
  text: அரசன் சாலொமோனின் பானப் பாத்திரங்கள் அனைத்தும் தங்கமாக இருந்தன; லெபனோன் வன மாளிகையின் பாத்திரங்கள் அனைத்தும் சுத்தத் தங்கமாக இருந்தன.[a] சாலொமோனின் நாட்களில் வெள்ளி ஒரு பொருட்டாக மதிக்கப்படவில்லை.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “புடமிடப்பட்ட தங்கம்.”
    reason: זָהָב סָגוּר என்பதற்கு உயர்தரமான, தூய்மைப்படுத்தப்பட்ட தங்கம் என்ற நுண்பொருளும் உண்டு.
  - marker: b
    text: அல்லது, “சாலொமோனின் நாட்களில் வெள்ளி எந்த மதிப்புமில்லாததாகக் கருதப்பட்டது.”
    reason: எபிரெய மரபுத்தொடர் வெள்ளி முற்றிலும் இல்லாதிருந்தது என்று கூறாமல், அது மதிப்பற்றதாகக் கருதப்பட்டதை வலியுறுத்துகிறது.
lexical_decisions:
- source_word: כְּלֵי מַשְׁקֵה
  choice: பான பாத்திரங்கள்
  rationale: குடிப்பதற்குப் பயன்படுத்தப்பட்ட பலவகைப் பாத்திரங்களையும் உள்ளடக்கும் எபிரெயச் சொல்லின் பரந்த பொருளைப் பேணுகிறது; ‘கோப்பைகள்’ என்று தேவையின்றிக் குறுக்கவில்லை.
- source_word: זָהָב
  choice: தங்கம்
  rationale: பொருளைக் குறிக்கும் நேரடியான சொல்; வசனத்தில் செல்வச் செழிப்பை வலியுறுத்தும் மறுபயன்பாட்டையும் மொழிபெயர்ப்பு பேணுகிறது.
- source_word: בֵּית יַעַר הַלְּבָנוֹן
  choice: லெபனோன் வன மாளிகை
  rationale: இது ஒரு குறிப்பிட்ட அரசக் கட்டடத்தின் பெயர். ‘மாளிகை’ என்பது தமிழில் அதன் செயலையும் பெயர்த்தன்மையையும் இயல்பாகத் தெரிவிக்கிறது.
- source_word: זָהָב סָגוּר
  choice: சுத்தத் தங்கம்
  rationale: סָגוּר இங்கு உயர்தரமான அல்லது தூய்மைப்படுத்தப்பட்ட தங்கத்தைக் குறிக்கிறது; ‘சுத்தத் தங்கம்’ இயல்பான தமிழில் தரத்தைத் தெரிவிக்கிறது, ‘முழுத் தங்கம்’ எனக் கலப்பின்மையை மிகைப்படுத்தவில்லை.
- source_word: לֹא נֶחְשָׁב ... לִמְאוּמָה
  choice: ஒரு பொருட்டாகவே மதிக்கப்படவில்லை
  rationale: வெள்ளி இல்லையென்பதல்ல, அது மதிப்புடையதாகக் கருதப்படவில்லை என்பதே எபிரெய மரபுத்தொடரின் கருத்து; தமிழ் மரபுத்தொடர் இதை இயல்பாகப் பேணுகிறது.
- source_word: בִּימֵי שְׁלֹמֹה
  choice: சாலொமோனின் நாட்களில்
  rationale: காலத்தைக் குறிக்கும் மூலமொழியின் வழக்கமான அமைப்பை dignified, இயல்பான தமிழில் நேரடியாக வழங்குகிறது.
