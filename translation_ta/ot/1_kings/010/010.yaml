base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/010.yaml
  text: And she gave the king one hundred and twenty talents of gold[a], and a very great quantity of spices, and precious stones. Never again did such an abundance of spices come as those that the queen of Sheba gave to King Solomon.
translation:
  language: ta
  text: அவள் அரசனுக்கு நூற்றிருபது தாலந்து தங்கத்தையும்,[a] மிக ஏராளமான நறுமணப் பொருட்களையும் விலையுயர்ந்த கற்களையும் கொடுத்தாள். சேபாவின் அரசி சாலொமோன் அரசனுக்குக் கொடுத்ததைப் போன்ற அவ்வளவு ஏராளமான நறுமணப் பொருட்கள் அதற்குப் பிறகு ஒருபோதும் வரவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தாலந்து” என்பது ஓர் எடை அலகு. அதன் துல்லியமான எடை காலத்துக்கும் இடத்துக்கும் ஏற்ப மாறியது.
    reason: பழங்கால அளவையின் பொருளை வாசகருக்குத் தெளிவுபடுத்துதல்.
lexical_decisions:
- source_word: וַתִּתֵּן
  choice: அவள் ... கொடுத்தாள்
  rationale: வழக்கமான எபிரெயக் கதைத் தொடரை இயல்பான தமிழ் இறந்தகால வினையால் தருகிறது.
- source_word: מֵאָה וְעֶשְׂרִים כִּכַּר זָהָב
  choice: நூற்றிருபது தாலந்து தங்கம்
  rationale: כִּכָּר என்பது பழங்கால எடை அலகு; ஊகமான நவீன மாற்றீட்டுக்குப் பதிலாக மரபான ‘தாலந்து’ என்பதே வைக்கப்பட்டுள்ளது.
- source_word: וּבְשָׂמִים הַרְבֵּה מְאֹד
  choice: மிக ஏராளமான நறுமணப் பொருட்கள்
  rationale: בְּשָׂמִים என்பது நறுமணமுள்ள மசாலா அல்லது வாசனைப் பொருட்களைக் குறிக்கும்; அளவின் வலியுறுத்தலை ‘மிக ஏராளமான’ தக்கவைக்கிறது.
- source_word: וְאֶבֶן יְקָרָה
  choice: விலையுயர்ந்த கற்கள்
  rationale: எபிரெயில் ஒருமையாக இருந்தாலும் பரிசுப் பட்டியலில் தொகுப்பொருள் உணர்வுடன் வருவதால் தமிழ் பன்மை இயல்பானது.
- source_word: לֹא בָא ... עוֹד
  choice: அதற்குப் பிறகு ஒருபோதும் வந்ததில்லை
  rationale: மீண்டும் அத்தகைய சரக்கு வந்து சேரவில்லை என்ற எதிர்மறை கால உணர்வை நேரடியாகத் தருகிறது.
- source_word: כַבֹּשֶׂם הַהוּא ... לָרֹב
  choice: அந்த நறுமணப் பொருட்களைப் போன்றவை, அவ்வளவு மிகுதியாக
  rationale: ஒருமை வடிவிலுள்ள בֹּשֶׂם-ஐ தொகுப்பொருளாகப் புரிந்துகொண்டு, ஒப்பீடும் அளவின் மிகுதியும் தனித்தனியாகப் பாதுகாக்கப்படுகின்றன.
- source_word: מַלְכַּת שְׁבָא
  choice: சேபாவின் அரசி
  rationale: இடப்பெயரையும் அரச பட்டத்தையும் நவீனத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: לַמֶּלֶךְ שְׁלֹמֹה
  choice: சாலொமோன் அரசனுக்கு
  rationale: பட்டமும் பெயரும் சேர்ந்த எபிரெய் அமைப்பை இயல்பான தமிழ் வரிசையில் தருகிறது.
