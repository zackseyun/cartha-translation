translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய மூலத்தின் ஒருமை வடிவான ‘கப்பல்’ முதன்மை உரையில் வைக்கப்பட்டு, சாத்தியமான கூட்டுப்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது. மர இனத்தின் உறுதியின்மை தீர்மானிக்கப்படாமல் விடப்பட்டுள்ளது.
