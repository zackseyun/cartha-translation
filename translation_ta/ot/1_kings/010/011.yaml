base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/011.yaml
  text: Also[a], Hiram’s fleet, which carried gold from Ophir[b], brought from Ophir a very great quantity of almug wood and precious stones.
translation:
  language: ta
  text: ஓபீரிலிருந்து தங்கத்தை ஏற்றிவந்த ஈராமின் கப்பலும்[a], ஓபீரிலிருந்து மிக ஏராளமான அல்முக் மரப்பொருளையும்[b] விலையுயர்ந்த கற்களையும் கொண்டுவந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஈராமின் கப்பற்படையும்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் ஒருமையில் இருந்தாலும், ஈராமின் கடல் பயணக் கப்பல்களை ஒட்டுமொத்தமாகக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: “அல்முக்” என்பது எந்த மர இனம் என்பது உறுதியாகத் தெரியவில்லை; இதை “அல்கும்” என்றும் குறிப்பிடுவர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: -உம்
  rationale: முந்தைய செய்தியுடன் கூடுதல் தகவலை இணைக்கும் எபிரெயச் சொல்லின் சேர்க்கைப் பொருளைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: אֳנִי חִירָם
  choice: ஈராமின் கப்பல்
  rationale: אֳנִי ஒருமை வடிவில் இருப்பதை முதன்மை உரையில் பாதுகாக்கிறது; அது கூட்டுப்பொருளில் கப்பற்படையைக் குறிக்கக்கூடும் என்பதைக் குறிப்பில் தெரிவிக்கிறது.
- source_word: אֲשֶׁר נָשָׂא זָהָב
  choice: தங்கத்தை ஏற்றிவந்த
  rationale: கடல்வழிச் சரக்குப் போக்குவரத்துச் சூழலில் נָשָׂא என்பதன் ‘சுமந்து/ஏற்றிக்கொண்டு வந்த’ பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: מֵאוֹפִיר
  choice: ஓபீரிலிருந்து
  rationale: இடப்பெயரையும் அதனுடன் சேர்ந்த ‘இருந்து’ என்ற முன்னொட்டுப் பொருளையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: הֵבִיא
  choice: கொண்டுவந்தது
  rationale: בוא என்பதன் ஹிஃபில் வடிவிலுள்ள ‘கொண்டு வருதல்’ என்ற பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: עֲצֵי אַלְמֻגִּים
  choice: அல்முக் மரக்கட்டைகள்
  rationale: மர இனம் உறுதியாக அடையாளம் காணப்படாததால் குறிப்பிட்ட தாவரவியல் பெயரைத் திணிக்காமல், எபிரெயப் பெயரின் ஒலிபெயர்ப்பைப் பாதுகாக்கிறது; עֲצֵי என்பது இங்கு சரக்காகக் கொண்டுவரப்பட்ட மரப்பொருளைக் குறிக்கிறது.
- source_word: הַרְבֵּה מְאֹד
  choice: மிக ஏராளமான
  rationale: ‘மிகவும் அதிகம்’ என்ற இரட்டிப்பு வலியுறுத்தலைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: וְאֶבֶן יְקָרָה
  choice: விலையுயர்ந்த கற்கள்
  rationale: אֶבֶן இலக்கண ஒருமையாக இருந்தாலும் சரக்குப் பட்டியலில் கூட்டுப்பொருள் கொள்ளக்கூடியதால் தமிழில் இயல்பான பன்மை பயன்படுத்தப்படுகிறது; יְקָרָה என்பதன் மதிப்புமிக்க/விலையுயர்ந்த பொருள் காக்கப்படுகிறது.
