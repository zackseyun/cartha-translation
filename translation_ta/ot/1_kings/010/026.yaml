translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘தேர்களுக்குரிய நகரங்கள்’ என்ற வடிவம் இராணுவ-நிர்வாகப் பொருளை விளங்கத்தக்கவாறு பேணுகிறது; அடிக்குறிப்பு குறியீடு முதன்மை உரையில் சேர்க்கப்பட்டுள்ளது.
