base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/026.yaml
  text: Solomon gathered chariots and horsemen[a], and he had 1,400 chariots and 12,000 horsemen, and he stationed them in the chariot cities and with the king in Jerusalem.
translation:
  language: ta
  text: சாலொமோன் தேர்களையும் குதிரைவீரர்களையும்[a] திரட்டினார். அவரிடம் 1,400 தேர்களும் 12,000 குதிரைவீரர்களும் இருந்தனர். அந்தத் தேர்களையும் குதிரைவீரர்களையும் தேர்நகரங்களிலும் எருசலேமில் அரசனுடனும் நிறுத்திவைத்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘குதிரைப்படையினரையும்’; எபிரெயச் சொல் இன்னும் நேரடியாகக் குதிரைமேல் சவாரி செய்பவர்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱסֹף
  choice: திரட்டினார்
  rationale: אסף என்பது இங்கு படை வளங்களைச் சேர்த்துத் திரட்டுவதைக் குறிக்கிறது; ‘திரட்டினார்’ இயல்பானதும் பொருளுக்குத் துல்லியமானதும் ஆகும்.
- source_word: רֶכֶב
  choice: தேர்கள்
  rationale: ஒருமை வடிவம் கூட்டுப்பொருளில் பயன்படுத்தப்பட்டுள்ளது; பின்னர் வரும் எண்ணிக்கையுடன் பொருந்துமாறு தமிழில் பன்மையாக வழங்கப்பட்டது.
- source_word: פָרָשִׁים
  choice: குதிரைவீரர்கள்
  rationale: இச்சொல் குதிரைகளை அல்ல, குதிரைமேல் ஏறிச் செல்லும் வீரர்களைக் குறிக்கிறது. ‘குதிரைவீரர்கள்’ அந்தச் சொல்லின் குறிப்பிட்ட பொருளைத் தெளிவாகக் காக்கிறது.
- source_word: וַיְהִי לוֹ
  choice: அவரிடம் ... இருந்தனர்
  rationale: எபிரெய உரைமரபின் உடைமைச் சொல்லாட்சியை இயல்பான நவீன தமிழில் வழங்குகிறது.
- source_word: אֶלֶף וְאַרְבַּע מֵאוֹת רֶכֶב
  choice: 1,400 தேர்கள்
  rationale: எண்ணிக்கையும் பெயர்ச்சொல்லும் நேரடியாகவும் வாசிப்புக்கு எளிதாகவும் வழங்கப்பட்டுள்ளன.
- source_word: וּשְׁנֵים עָשָׂר אֶלֶף פָּרָשִׁים
  choice: 12,000 குதிரைவீரர்கள்
  rationale: எண்ணிக்கை நேரடியாக மொழிபெயர்க்கப்பட்டு, פָרָשִׁים என்பதற்கான தெரிவு வசனம் முழுவதும் ஒரேவிதமாகப் பேணப்பட்டுள்ளது.
- source_word: וַיַּנְחֵם
  choice: அவர்களை ... நிறுத்திவைத்தார்
  rationale: Hiphil வடிவம் ஒருவரையோ ஒன்றையோ ஓரிடத்தில் வைப்பதைக் குறிக்கிறது; படைச் சூழலில் ‘நிறுத்திவைத்தார்’ என்பது திட்டமிட்ட நிலைநிறுத்தலை இயல்பாக உணர்த்துகிறது.
- source_word: בְּעָרֵי הָרֶכֶב
  choice: தேர்களுக்குரிய நகரங்களில்
  rationale: தேர்ப்படையுடன் தொடர்புடைய அல்லது அதற்கென ஒதுக்கப்பட்ட நகரங்களை இச்சொற்றொடர் குறிக்கிறது; ‘தேர்களுக்குரிய நகரங்கள்’ என்பது பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: וְעִם הַמֶּלֶךְ בִּירוּשָׁלָם
  choice: எருசலேமில் அரசனுடனும்
  rationale: படையின் ஒரு பகுதி எருசலேமில் அரசனுடன் வைக்கப்பட்டிருந்ததை மூலத்தின் அமைப்புக்கு நெருக்கமாகக் காட்டுகிறது.
