  source_fidelity: 'மூல எபிரெய வாக்கியத்தின் முக்கிய கூறுகள் காக்கப்பட்டுள்ளன: அரசன் அல்முக் மரத்தால் யாவேயின் ஆலயத்திற்கும் அரண்மனைக்கும் கட்டடப் பயன்பாடுகளைச் செய்ததும், பாடகர்களுக்கான இருவகை நரம்பிசைக் கருவிகளைச் செய்ததும், அத்தகைய மரம் முன்பு வராததையும் அந்நாள்வரை காணப்படாததையும் உரை சரியாகத் தெரிவிக்கிறது. அரிய מִסְעָד சொல்லுக்கான தற்போதைய ‘தாங்கமைப்புகள்’ பொருள் நோக்கில் எச்சரிக்கையானது; ஆனால் தமிழில் இயல்பற்ற கூட்டுச்சொல் ஆகிறது.'
  naturalness: ‘தாங்கமைப்புகள்’ நவீன நிலையான தமிழில் இயல்பாக ஒலிக்கவில்லை. ‘தாங்குதளங்கள்’ என்பது கட்டடப் பயன்பாட்டைக் காட்டி, படிகள் அல்லது கைப்பிடிகள் என்று உறுதியாகத் தீர்மானிக்காமல் வாசிக்க இயல்பாக உள்ளது. மற்ற வாக்கிய அமைப்பும் நடையும் தெளிவாக உள்ளன.
