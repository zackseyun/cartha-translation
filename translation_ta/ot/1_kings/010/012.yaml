  text: וַ/יַּ֣עַשׂ הַ֠/מֶּלֶךְ אֶת עֲצֵ֨י הָ/אַלְמֻגִּ֜ים מִסְעָ֤ד לְ/בֵית יְהוָה֙ וּ/לְ/בֵ֣ית הַ/מֶּ֔לֶךְ וְ/כִנֹּר֥וֹת וּ/נְבָלִ֖ים לַ/שָּׁרִ֑ים לֹ֣א בָֽא כֵ֞ן עֲצֵ֤י אַלְמֻגִּים֙ וְ/לֹ֣א נִרְאָ֔ה עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/012.yaml
  text: The king made the almug wood into supports for the house of Yahweh and for the king’s house[a], and lyres and harps for the singers. Never before had such almug wood come[b], nor has any been seen to this day.
translation:
  language: ta
  text: அரசன் அல்முக் மரத்தால் யாவேயின் ஆலயத்திற்கும் அரசனின் அரண்மனைக்கும் தாங்குதளங்களை[a] செய்தான்; பாடகர்களுக்காக யாழ்களையும் வீணைகளையும் செய்தான். அப்படிப்பட்ட அல்முக் மரம்[b] இதற்கு முன்பு வந்ததுமில்லை; இந்நாள்வரை காணப்பட்டதுமில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இந்த எபிரெயச் சொல் அரிதானது; இது படிகள், கைப்பிடிகள் அல்லது வேறு கட்டடத் தாங்குதளங்களைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: வேறு இடங்களில் இதனுடன் தொடர்புடைய மரப்பெயர் மாறுபட்ட எழுத்துக்கூட்டுடன் ‘அல்கும்’ என்று வருகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲצֵי הָאַלְמֻגִּים
  choice: அல்முக் மரம்
  rationale: அடையாளம் உறுதியாகத் தெரியாத விலையுயர்ந்த இறக்குமதி மரவகையின் எபிரெயப் பெயரைத் தமிழில் ஒலிபெயர்த்துள்ளது; ஊகமான தாவரவியல் அடையாளத்தைத் தவிர்க்கிறது.
- source_word: מִסְעָד
  choice: தாங்கமைப்புகள்
  rationale: அரிதாக வரும், பொருள் உறுதியாகத் தெரியாத கட்டடக்கலைச் சொல். படிகள் அல்லது கைப்பிடிச் சுவர்கள் என்று மிகத் துல்லியமாகத் தீர்மானிக்காமல், அதன் பொதுவான கட்டமைப்புச் செயல்பாட்டைக் காட்டுகிறது.
- source_word: לְבֵית יְהוָה
  choice: யாவேயின் ஆலயத்திற்கு
  rationale: எபிரெய மொழியில் உள்ள ‘யாவேயின் வீடு’ என்ற மரபுத்தொடரை நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் ‘ஆலயம்’ என்று வழங்குகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநான்கெழுத்துப் பெயரை பட்டப்பெயராக மாற்றாமல், அதன் வழக்கமான தமிழ் ஒலிபெயர்ப்பில் தருகிறது.
- source_word: וּלְבֵית הַמֶּלֶךְ
  choice: அரசனின் அரண்மனைக்கு
  rationale: இங்கு அரசனின் ‘வீடு’ என்பது அரச அரண்மனையைக் குறிப்பதால், நவீனத் தமிழில் தெளிவான சூழல்சார் சொல்லைத் தேர்ந்தெடுக்கிறது.
- source_word: וְכִנֹּרוֹת וּנְבָלִים
  choice: யாழ்களையும் வீணைகளையும்
  rationale: வேறுபட்ட இரண்டு பழங்கால நரம்பிசைக் கருவிகளைக் குறிக்கும் எபிரெயச் சொற்களின் வேறுபாட்டை, வாசிக்க எளிய இரண்டு தமிழ் இசைக்கருவிப் பெயர்களால் காக்கிறது; துல்லியமான கருவி அடையாளம் உறுதியல்ல.
- source_word: לַשָּׁרִים
  choice: பாடகர்களுக்காக
  rationale: שׁיר என்ற ‘பாடு’ வேரிலிருந்து வந்த சொல்லின் நேரான பொருளைத் தருகிறது.
- source_word: לֹא בָא כֵן
  choice: அப்படிப்பட்ட ... இதற்கு முன்பு வந்ததுமில்லை
  rationale: இத்தகைய மரம் வந்ததே முன்னெப்போதும் நிகழவில்லை என்ற எபிரெய வாக்கியத்தின் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְלֹא נִרְאָה עַד הַיּוֹם הַזֶּה
  choice: இந்நாள்வரை காணப்பட்டதுமில்லை
  rationale: கதைசொல்லியின் காலம்வரை நீடிக்கும் மறுப்பைச் சுருக்கமாகவும் நேரடியாகவும் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக வருவதால், அதை ஒரு பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. அரிதான கட்டடக்கலைச் சொல்லும் உறுதியற்ற மரவகைப் பெயரும் குறிப்புகள் மூலம் திறந்த நிலையில் வைக்கப்பட்டுள்ளன; தேவையற்ற தாவரவியல் அல்லது கட்டடவியல் தீர்மானங்கள் திணிக்கப்படவில்லை.
