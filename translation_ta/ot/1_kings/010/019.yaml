  text: שֵׁ֧שׁ מַעֲל֣וֹת לַ/כִּסֵּ֗ה וְ/רֹאשׁ עָגֹ֤ל לַ/כִּסֵּה֙ מֵ/אַֽחֲרָ֔י/ו וְ/יָדֹ֛ת מִ/זֶּ֥ה וּ/מִ/זֶּ֖ה אֶל מְק֣וֹם הַ/שָּׁ֑בֶת וּ/שְׁנַ֣יִם אֲרָי֔וֹת עֹמְדִ֖ים אֵ֥צֶל הַ/יָּדֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/019.yaml
  text: The throne had six steps[a], and the throne had a rounded top at its back, and armrests on this side and on that beside the seat[b], and two lions standing beside the armrests.
translation:
  language: ta
  text: அந்த அரியணைக்கு ஆறு படிகள் இருந்தன. அரியணையின் பின்புறத்தில் வட்டமான மேற்பகுதி[a] இருந்தது. இருக்கையின் இருபுறமும் கைதாங்கிகள் இருந்தன; அந்தக் கைதாங்கிகளின் அருகே இரண்டு சிங்கங்கள் நின்றன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில், “வட்டமான தலைப்பகுதி.” இது அரியணையின் பின்புற மேலமைப்பைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲלוֹת
  choice: படிகள்
  rationale: அரியணையை நோக்கி மேலே செல்லும் படிகளை இச்சூழலில் குறிக்கிறது; நவீன தமிழில் இது இயல்பானதும் தெளிவானதும் ஆகும்.
- source_word: לַכִּסֵּה
  choice: அந்த அரியணைக்கு
  rationale: ל முன்னொட்டை முற்றிலும் நீக்காமல், அரியணையின் கட்டமைப்பைச் சுட்டும் இயல்பான தமிழ் உடைமைத் தொடராக வழங்குகிறது.
- source_word: רֹאשׁ עָגֹל
  choice: வட்டமான மேற்பகுதி
  rationale: சொல்லுக்குச் சொல் பொருள் ‘வட்டமான தலை/உச்சி.’ அரியணையின் மேல்பகுதியைச் சுட்டுவதாகக் கொண்டு, ‘தலைசாய்வு’ என்று ஆதாரத்தை மீறிக் குறிப்பாக்காமல் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: מֵאַחֲרָיו
  choice: அரியணையின் பின்புறத்தில்
  rationale: வட்டமான மேற்பகுதி அரியணையின் பின்பக்கம் அமைந்திருந்ததை இயல்பான தமிழில் தெளிவுபடுத்துகிறது.
- source_word: יָדֹת
  choice: கைதாங்கிகள்
  rationale: அடிப்படைப் பொருள் ‘கைகள்’ என்றாலும், இருக்கை அல்லது அரியணைச் சூழலில் இருபுறக் கைதாங்கிகளைக் குறிக்கிறது.
- source_word: מִזֶּה וּמִזֶּה אֶל מְקוֹם הַשָּׁבֶת
  choice: இருக்கையின் இருபுறமும்
  rationale: ‘உட்காரும் இடத்தின் இந்தப் பக்கத்திலும் அந்தப் பக்கத்திலும்’ என்ற இடவமைப்பைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: אֲרָיוֹת עֹמְדִים
  choice: சிங்கங்கள் நின்றன
  rationale: எபிரெய உரை அவை சிலைகள் அல்லது உருவங்கள் என்று வெளிப்படையாகக் கூறாததால், ‘சிங்க உருவங்கள்’ எனக் குறிப்பாக்காமல் காட்சிவருணனையைப் பாதுகாக்கிறது.
- source_word: אֵצֶל הַיָּדוֹת
  choice: கைதாங்கிகளின் அருகே
  rationale: இரண்டு சிங்கங்களும் அரியணையின் கைதாங்கிகளுக்கு அடுத்ததாக இருந்த இடத்தைத் தெளிவாகக் குறிக்கிறது.
