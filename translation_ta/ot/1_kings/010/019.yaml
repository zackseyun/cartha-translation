  register: நவீனத் தரத் தமிழில், கட்டமைப்பு தெளிவாகத் தெரியும் வகையில் குறுகிய வாக்கியங்களாக வழங்கப்பட்டுள்ளது. எபிரெயின் மரச்சொல் அமைப்பைத் தவிர்த்தாலும், அதன் இடவமைப்பும் குறிப்பாக்கப்படாத அம்சங்களும் பாதுகாக்கப்பட்டுள்ளன.
