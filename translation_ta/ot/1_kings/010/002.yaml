  text: וַ/תָּבֹ֣א יְרוּשָׁלְַ֗מָ/ה בְּ/חַיִל֮ כָּבֵ֣ד מְאֹד֒ גְּ֠מַלִּים נֹשְׂאִ֨ים בְּשָׂמִ֧ים וְ/זָהָ֛ב רַב מְאֹ֖ד וְ/אֶ֣בֶן יְקָרָ֑ה וַ/תָּבֹא֙ אֶל שְׁלֹמֹ֔ה וַ/תְּדַבֵּ֣ר אֵלָ֔י/ו אֵ֛ת כָּל אֲשֶׁ֥ר הָיָ֖ה עִם לְבָבָֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/002.yaml
  text: She came to Jerusalem with a very great retinue[a], with camels carrying spices and very much gold and precious stones. She came to Solomon and spoke with him about all that was in her heart.
translation:
  language: ta
  text: அவள் மிகப் பெரிய பரிவாரத்துடன்[a] எருசலேமுக்கு வந்தாள். நறுமணப் பொருட்களையும் மிகுந்த தங்கத்தையும் விலையுயர்ந்த கற்களையும் சுமந்த ஒட்டகங்களும் அவளுடன் வந்தன. அவள் சாலொமோனிடம் வந்து, தன் உள்ளத்தில் இருந்த அனைத்தையும் குறித்து அவனுடன் பேசினாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மிகப் பெரிய கூட்டத்துடன்’; இன்னும் சொல்லுக்குச் சொல்லாக, ‘மிகுந்த செல்வத்துடன்/வலிமையுடன்.’ எபிரெயச் சொல் חַיִל செல்வம், வலிமை அல்லது பெரும் கூட்டத்தைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּחַיִל כָּבֵד מְאֹד
  choice: மிகப் பெரிய பரிவாரத்துடன்
  rationale: חַיִל என்பது செல்வம், வலிமை, படை அல்லது பெரும் கூட்டம் ஆகிய பொருள்களைத் தரலாம். அரசப் பயணச் சூழலில், அவளுடன் வந்த பெரிய அணிவகுப்பைக் குறிக்கும் இயல்பான தமிழ் சொல்லாக ‘பரிவாரம்’ தேர்ந்தெடுக்கப்பட்டது; அடிக்குறிப்பு மூலச்சொல்லின் பிற சாத்தியங்களைப் பாதுகாக்கிறது.
- source_word: גְּמַלִּים נֹשְׂאִים בְּשָׂמִים
  choice: நறுமணப் பொருட்களை ... சுமந்த ஒட்டகங்கள்
  rationale: பங்கேற்பு வினையின் விளக்கத் தன்மையை இயல்பான தமிழில் தருகிறது. בְּשָׂמִים என்பது இச்சூழலில் வாசனைத் திரவியங்கள் அல்லது நறுமணப் பொருட்களைக் குறிக்கிறது.
- source_word: וְזָהָב רַב מְאֹד
  choice: மிகுந்த தங்கம்
  rationale: רַב מְאֹד குறிக்கும் மிகுதியைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: וְאֶבֶן יְקָרָה
  choice: விலையுயர்ந்த கற்கள்
  rationale: எபிரெய ஒருமை இங்கு தொகுப்புப் பொருளில் வருவதால், தமிழில் பன்மை இயல்பானது. ‘இரத்தினங்கள்’ என்பதைவிட மூலத்தின் பொதுவான பொருளை இது பாதுகாக்கிறது.
- source_word: וַתָּבֹא אֶל שְׁלֹמֹה
  choice: அவள் சாலொமோனிடம் வந்து
  rationale: எருசலேமுக்கு வந்ததைத் தொடர்ந்து சாலொமோனை அணுகிய அடுத்த கதைக் கட்டத்தை, மூலத்தில் மீண்டும் வரும் וַתָּבֹא என்பதற்கு இணையாகப் பாதுகாக்கிறது.
- source_word: וַתְּדַבֵּר אֵלָיו
  choice: அவனுடன் பேசினாள்
  rationale: אֶל அடிப்படையில் ‘அவனிடம்’ என்றும் மொழிபெயர்க்கலாம்; கேள்வி–பதில் சந்திப்பின் சூழலில் ‘அவனுடன்’ என்பது இயல்பாக இருந்தாலும், பரஸ்பர உரையாடலை அளவுக்கு மீறி வலியுறுத்தாது.
- source_word: אֵת כָּל אֲשֶׁר הָיָה עִם לְבָבָהּ
  choice: தன் உள்ளத்தில் இருந்த அனைத்தையும் குறித்து
  rationale: அவளுடைய மன எண்ணங்கள், கேள்விகள் மற்றும் கவலைகள் அனைத்தையும் குறிக்கும் எபிரெய மொழிமரபை, அதன் உள்ளார்ந்த உருவகத்தைப் பாதுகாத்து இயல்பான தமிழில் தருகிறது.
