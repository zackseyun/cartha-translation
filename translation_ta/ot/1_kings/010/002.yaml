translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. முதல் வாக்கியத்தின் நீண்ட எபிரெயப் பட்டியல் தமிழில் தெளிவிற்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டது; பொருளும் பட்டியலின் வரிசையும் பாதுகாக்கப்பட்டுள்ளன.
