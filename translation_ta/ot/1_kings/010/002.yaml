  source_fidelity: 'மூல எபிரெயத்தின் கதைவரிசையும் முக்கிய கூறுகளும் துல்லியமாகப் பாதுகாக்கப்பட்டுள்ளன: மிகப் பெரிய அரசப் பரிவாரம், நறுமணப் பொருட்கள் சுமந்த ஒட்டகங்கள், மிகுந்த தங்கம், விலையுயர்ந்த கற்கள், சாலொமோனை அணுகுதல், மற்றும் அவளுடைய உள்ளத்தில் இருந்த அனைத்தையும் பேசுதல். இரண்டாவது வாக்கியத்தில் ஒட்டகங்கள் அவளுடன் வந்தன என்று கூறுவது சூழலுக்கேற்ற இயல்பான வெளிப்பாடு; மூலத்தின் பொருளை மாற்றவில்லை.'
