translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, எளிதில் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘அரசனுடைய’ என்பது உடைமையைத் தெளிவாக்குகிறது; ‘ஏற்றிக்கொண்டு வந்தன’ என்பது נֹשְׂאֵת (‘சுமந்துகொண்டு/ஏந்திக்கொண்டு’) என்ற கருத்தை இயல்பான தமிழில் வழங்குகிறது. ‘தர்சீசுக் கப்பல்கள்’ என்ற மரபான வடிவம் நிலப்பெயருக்கும் கப்பல் வகைக்கும் இடையிலான மூல உரையின் சாத்தியமான இருபொருளைத் தீர்மானிக்காமல் வைத்திருக்கிறது.
