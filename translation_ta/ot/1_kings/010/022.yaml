base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/022.yaml
  text: For the king had ships of Tarshish at sea with Hiram’s ships. Once every three years the ships of Tarshish would come, carrying gold and silver, ivory, apes, and peacocks.
translation:
  language: ta
  text: ஏனெனில், ஈராமின் கப்பல்களோடு அரசனுடைய தர்சீசுக் கப்பல்களும் கடலில் இருந்தன. மூன்று ஆண்டுகளுக்கு ஒருமுறை தர்சீசுக் கப்பல்கள் பொன், வெள்ளி, தந்தம், குரங்குகள், மயில்கள் ஆகியவற்றை ஏற்றிக்கொண்டு வந்தன.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கடைசியில் வரும் இரண்டு எபிரெயச் சொற்கள் அரிய விலங்குப் பெயர்கள்; அவை பொதுவாக “குரங்குகள், மயில்கள்” என்று புரிந்துகொள்ளப்படுகின்றன. இரண்டாவது சொல் வேறு வகை வெளிநாட்டுப் பறவையைக் குறிக்கலாம்.
    reason: அரிய வாணிகப் பொருள் பெயர்களின் உண்மையான சொற்பொருள் நிச்சயமின்மையை வாசகருக்குத் தெரிவிக்கிறது.
lexical_decisions:
- source_word: אֳנִי תַרְשִׁישׁ
  choice: தர்சீசுக் கப்பல்கள்
  rationale: எபிரெயச் சொற்றொடரை நேரடியாகப் பாதுகாக்கிறது. இது தர்சீசுக்குச் சென்ற கப்பல்களையோ, தர்சீசு வகையைச் சேர்ந்த தொலைகடல் வாணிகக் கப்பல்களையோ குறிக்கலாம்; உரை இதைத் தெளிவுபடுத்தவில்லை.
- source_word: אַחַת לְשָׁלֹשׁ שָׁנִים
  choice: மூன்று ஆண்டுகளுக்கு ஒருமுறை
  rationale: கப்பல்கள் திரும்பி வந்த கால இடைவெளியை இயல்பான நவீன தமிழில் துல்லியமாகத் தெரிவிக்கிறது.
- source_word: שֶׁנְהַבִּים
  choice: தந்தம்
  rationale: இது யானைத்தந்தப் பொருளைக் குறிக்கும் ஏற்றுக்கொள்ளப்பட்ட பொருள்; தமிழில் ‘தந்தம்’ இயல்பான வாணிகப் பொருள் பெயர்.
- source_word: קֹפִים
  choice: குரங்குகள்
  rationale: பொதுவாக ஏற்றுக்கொள்ளப்படும் பொருள்; குறிப்பிட்ட குரங்கினத்தை மூலச்சொல் உறுதியாக அடையாளப்படுத்தவில்லை.
- source_word: תֻכִּיִּים
  choice: மயில்கள்
  rationale: பாரம்பரியமாகவும் பரவலாகவும் ஏற்றுக்கொள்ளப்படும் பொருள்; எனினும் அரிய கடன்சொல் என்பதால் அடையாளம் முழுமையாக உறுதியானதல்ல.
