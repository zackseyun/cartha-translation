base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/007.yaml
  text: But I did not believe the reports until I came and my own eyes saw it; and behold[a], not even half was told to me. You have surpassed the report that I heard in wisdom and prosperity.
translation:
  language: ta
  text: ஆனால் நான் வந்து, என் கண்களால் நானே காணும்வரை அந்தச் செய்திகளை நம்பவில்லை. இதோ, எனக்குச் சொல்லப்பட்டவற்றில் பாதிகூட சொல்லப்படவில்லை! ஞானத்திலும் செழிப்பிலும், நான் கேள்விப்பட்ட செய்தியைவிட நீங்கள் மிஞ்சியிருக்கிறீர்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “ஞானத்திலும் வளத்திலும் நான் கேள்விப்பட்ட செய்தியை நீங்கள் மிஞ்சியிருக்கிறீர்கள்.” எபிரெய மொழியின் טוֹב என்பது பொதுவான செழிப்பு அல்லது நல்வாழ்வைக் குறிக்கலாம்; இச்சூழலில் சாலொமோனின் செல்வமும் அதில் அடங்கலாம்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶאֱמַנְתִּי
  choice: நம்பவில்லை
  rationale: இங்கு அמן என்பதன் ஹிஃபில் வடிவம், கேள்விப்பட்டவற்றை உண்மையென ஏற்றுக்கொள்வதைக் குறிக்கிறது; ‘நம்பவில்லை’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: לַדְּבָרִים
  choice: அந்தச் செய்திகளை
  rationale: சொற்பொருளாக ‘சொற்கள்/காரியங்கள்’ என்றாலும், சூழலில் சாலொமோனைப் பற்றிக் கூறப்பட்ட தகவல்களைக் குறிக்கிறது.
- source_word: וַתִּרְאֶינָה עֵינַי
  choice: என் கண்களே காணும்வரை
  rationale: ‘என் கண்கள் கண்டன’ என்ற எபிரெயச் சொல்லாட்சியின் நேரடிச் சான்று வலியுறுத்தலை ‘கண்களே’ இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: ஆச்சரியத்தையும் கவன ஈர்ப்பையும் வெளிப்படுத்தும் உரையாடல் குறியைத் தக்கவைக்கிறது.
- source_word: לֹא הֻגַּד לִי הַחֵצִי
  choice: எனக்குச் சொல்லப்பட்டது பாதிகூட இல்லை
  rationale: கேள்விப்பட்ட தகவல் உண்மையின் பாதியளவுக்குக்கூட எட்டவில்லை என்ற வலியுறுத்தலை இயல்பான தமிழில் தருகிறது.
- source_word: הוֹסַפְתָּ
  choice: மேலானவராக இருக்கிறீர்கள்
  rationale: אֶל உடனான ஒப்பீட்டுக் கட்டமைப்பில் ‘சேர்த்தீர்’ என்பதற்குப் பதிலாக ‘மிஞ்சுதல்/மேலாயிருத்தல்’ என்ற பொருள் பொருத்தமானது.
- source_word: חָכְמָה וָטוֹב
  choice: ஞானத்திலும் செழிப்பிலும்
  rationale: חָכְמָה ‘ஞானம்’; טוֹב இச்சூழலில் அரசரின் நல்வாழ்வு, வளம், வெற்றி ஆகியவற்றை உள்ளடக்கும் ‘செழிப்பு’ எனப் பொருள்படுகிறது.
- source_word: אֶל הַשְּׁמוּעָה אֲשֶׁר שָׁמָעְתִּי
  choice: நான் கேள்விப்பட்ட செய்தியைவிட
  rationale: שְׁמוּעָה என்பது கேள்விப்பட்ட செய்தி அல்லது தகவல்; אֶל இங்கு ஒப்பீட்டை வெளிப்படுத்துவதால் ‘விட’ பயன்படுத்தப்படுகிறது.
