source:
  edition: WLC
  text: וּ/מַאֲכַ֣ל שֻׁלְחָנ֡/וֹ וּ/מוֹשַׁ֣ב עֲבָדָי/ו֩ וּ/מַעֲמַ֨ד משרת/ו וּ/מַלְבֻּֽשֵׁי/הֶם֙ וּ/מַשְׁקָ֔י/ו וְ/עֹ֣לָת֔/וֹ אֲשֶׁ֥ר יַעֲלֶ֖ה בֵּ֣ית יְהוָ֑ה וְ/לֹא הָ֥יָה בָ֛/הּ ע֖וֹד רֽוּחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/005.yaml
  text: the food of his table[a], the seating of his servants, the attendance of his ministers, their clothing, his cupbearers, and his burnt offering that he offered at the house of Yahweh, there was no more breath in her.
translation:
  language: ta
  text: அவருடைய பந்தியில் பரிமாறப்பட்ட உணவு, அவருடைய பணியாளர்களின் இருக்கை ஒழுங்கு, அவருடைய அலுவலர்கள் நின்று பணியாற்றிய ஒழுங்கு, அவர்களுடைய உடைகள், அவருடைய பானம் பரிமாறுவோர், யாவேயின் ஆலயத்தில் அவர் செலுத்திய தகனபலி[a] ஆகியவற்றைக் கண்டபோது, அவளுக்கு மூச்சே இல்லாமல் போனது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேயின் ஆலயத்துக்குச் செல்ல அவர் ஏறிய வழி”; இது அவர் ஏறிச் சென்ற படிக்கட்டையோ அவரது ஊர்வலத்தையோ குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: מַאֲכַל שֻׁלְחָנוֹ
  choice: அவருடைய பந்தியில் பரிமாறப்பட்ட உணவு
  rationale: உண்ணப்படும் உணவு அல்லது உணவு ஏற்பாடு என்பதே சொல்லின் அடிப்படைப் பொருள். அரசவையின் விருந்து ஏற்பாட்டை இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: מוֹשַׁב עֲבָדָיו
  choice: அவருடைய பணியாளர்களின் இருக்கை ஒழுங்கு
  rationale: מוֹשָׁב என்பது இருக்கை, அமர்வு அல்லது இடவமைப்பைக் குறிக்கலாம். அரசவைப் பட்டியலின் சூழலில் ஒழுங்குபடுத்தப்பட்ட அமர்வை இந்தத் தேர்வு வெளிப்படுத்துகிறது.
- source_word: מַעֲמַד מְשָׁרְתָיו
  choice: அவருடைய ஏவலர்களின் பணிவிடை
  rationale: மூலச்சொற்கள் அவர்கள் நிற்கும் நிலை அல்லது நியமிக்கப்பட்ட இடத்தையும் அவர்களுடைய அதிகாரப்பூர்வ சேவையையும் சுட்டுகின்றன. இயல்பான தமிழுக்காக ‘பணிவிடை’ என வழங்கப்பட்டுள்ளது.
- source_word: מַלְבֻּשֵׁיהֶם
  choice: அவர்களுடைய உடைகள்
  rationale: ஆடை அல்லது உடுப்பு என்ற நேரடியான பொருளை நவீன, பொதுவான தமிழில் தருகிறது.
- source_word: מַשְׁקָיו
  choice: அவருடைய பானம் பரிமாறுவோர்
  rationale: அரசவைச் சூழலில் பானங்களைப் பரிமாறும் அதிகாரிகளைப் பன்மையில் குறிக்கிறது; வெறும் பானங்கள் என்று மொழிபெயர்ப்பதைவிட பட்டியலின் பணியாளர் சூழலுடன் பொருந்துகிறது.
- source_word: עֹלָתוֹ אֲשֶׁר יַעֲלֶה בֵּית יְהוָה
  choice: யாவேயின் ஆலயத்தில் அவர் செலுத்திய தகனபலி
  rationale: மசோரா உயிர்க்குறிப்பு עֹלָה என்பதைக் ‘தகனபலி’ என்று ஆதரிக்கிறது. ‘வீடு’ என்ற நேரடி உருவகத்திற்குப் பதிலாக இங்கு குறிக்கப்படும் ஆலயத்தை இயல்பான தமிழில் கூறுகிறது; மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெயத் திருப்பெயரை பட்டப்பெயராக மாற்றாமல், தமிழில் அறியத்தக்க ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: וְלֹא הָיָה בָּהּ עוֹד רוּחַ
  choice: அவளுக்கு மூச்சே இல்லாமல் போனது
  rationale: רוּחַ என்பதன் ‘மூச்சு’ உருவகத்தைத் தக்கவைத்து, அவள் வியப்பால் திகைத்ததை விளக்கவுரை சேர்க்காமல் இயல்பான தமிழ் மரபுத்தொடரில் காட்டுகிறது.
theological_decisions:
- issue: יְהוָה என்ற திருப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் வரும் உடன்படிக்கைப் பெயரை பொதுப் பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்த்து வழங்குகிறது.
- issue: עֹלָתוֹ என்பதன் பொருள்
  choice: அவர் செலுத்திய தகனபலி
  alternative: யாவேயின் ஆலயத்துக்குச் செல்ல அவர் ஏறிய வழி அல்லது படிக்கட்டு
  rationale: மசோரா உயிர்க்குறிப்பு ‘தகனபலி’ என்ற வாசிப்பை ஆதரிக்கிறது. இருப்பினும் மெய்யெழுத்து வடிவத்தையும் பழமையான மொழிபெயர்ப்பு சான்றுகளையும் அடிப்படையாகக் கொண்ட ‘ஏற்றம்’ என்ற உண்மையான மாற்று விளக்கம் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளக்கூடிய கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. அரசவைப் பணியாளர்களின் இரு பிரிவுகளையும் ‘பணியாளர்கள்’ மற்றும் ‘ஏவலர்கள்’ என வேறுபடுத்தி, எபிரெயப் பட்டியலின் அமைப்பு காக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறியீடு அது சார்ந்த சர்ச்சைக்குரிய ‘தகனபலி’ சொற்றொடருக்குப் பின்னர் வைக்கப்பட்டுள்ளது.
