  source_fidelity: மூல எபிரெயத்தின் எண்ணிக்கை, ‘அடித்துத் தகடாக்கப்பட்ட தங்கம்,’ ஒவ்வொரு கேடயத்திற்குமான மூன்று மினா என்ற பகிர்வுப் பொருள், அரசன் அவற்றை குறிப்பிட்ட கட்டிடத்தில் வைத்தமை ஆகியவை துல்லியமாகத் தரப்பட்டுள்ளன. ‘பயன்படுத்தப்பட்டது’ என்பது יַעֲלֶה עַל என்ற சொற்படியான ‘மேல் ஏறியது’ என்பதன் இயல்பான விளக்க மொழிபெயர்ப்பு; அதன் சொற்படியான வடிவம் அடிக்குறிப்பில் காக்கப்பட்டுள்ளது.
  naturalness: நடை நவீன தரநிலைத் தமிழில் தெளிவாகவும் வாசிக்க இயல்பாகவும் உள்ளது. ‘கேடயம்,’ ‘மினா,’ ‘லெபனோன் வன மாளிகை’ ஆகியவை பொருத்தமானவை. பெயருடைய கட்டிடத்தைக் குறிக்க மேற்கோள் குறிகளுக்குள் தரப்பட்ட பெயர் அடிக்குறிப்பில் தெளிவாக உள்ளது.
