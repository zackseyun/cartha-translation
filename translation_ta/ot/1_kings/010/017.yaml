translation_notes:
  register: நவீன தரநிலைத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைக் கையாள்கிறது. பழங்கால எடை அலகான “மினா” மாற்றமின்றி வைக்கப்பட்டு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது. எபிரெயத்தின் உருவகச் சொற்றொடர் முதன்மை உரையில் இயல்பான தமிழாக்கமாகவும், சொற்படையான வடிவம் அடிக்குறிப்பிலும் தரப்பட்டுள்ளது.
