  text: and three hundred shields of beaten gold[a]; three minas of gold went onto each shield[c][b]. And the king put them in the House of the Forest of Lebanon.
translation:
  language: ta
  text: மேலும், அடித்துத் தகடாக்கப்பட்ட தங்கத்தால்[a] முந்நூறு கேடயங்களைச் செய்தான்; ஒவ்வொரு கேடயத்திற்கும் மூன்று மினா[b] தங்கம் பயன்படுத்தப்பட்டது. அரசன் அவற்றை லெபனோன் வன மாளிகையில்[c] வைத்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சுத்தியலால் அடிக்கப்பட்ட தங்கத்தால்” அல்லது “அடித்து மெல்லியதாக்கப்பட்ட தங்கத்தால்.”
    reason: lexical_alternative
  - marker: b
    text: “மினா” என்பது ஓர் எடை அலகு. எபிரெயத்தில் சொற்பட, “அந்த ஒரு கேடயத்தின் மேல் மூன்று மினா தங்கம் ஏறியது”; அதாவது, ஒவ்வொரு கேடயத்திலும் மூன்று மினா தங்கம் பதிக்கப்பட்டது.
    reason: lexical_alternative
  - marker: c
    text: “லெபனோன் வன மாளிகை” என்பது சாலொமோனின் அரண்மனை வளாகத்துடன் தொடர்புடைய, தனிப்பெயர் கொண்ட அரச கட்டிடம் அல்லது ஆயுதக் களஞ்சியம் (1 இராஜாக்கள் 7:2-ஐக் காண்க).
    reason: cross_reference
lexical_decisions:
- source_word: מָגִנִּים
  choice: கேடயங்கள்
  rationale: மָגֵן என்பது தற்காப்புக்கான பெரிய கேடயத்தைக் குறிக்கிறது; முந்தைய வசனத்திலுள்ள சிறிய கேடயங்களிலிருந்து இதைச் சூழல் வேறுபடுத்துகிறது.
- source_word: זָהָב שָׁחוּט
  choice: அடித்துத் தகடாக்கப்பட்ட தங்கம்
  rationale: שָׁחוּט இங்கு தங்கத்தை அடித்து மெல்லிய தகடுகளாகச் செய்த வேலைப்பாட்டைக் குறிக்கிறது; இந்தத் தமிழ் சொற்றொடர் பொருளையும் செய்முறையையும் தெளிவாகக் காட்டுகிறது.
- source_word: שְׁלֹשֶׁת מָנִים
  choice: மூன்று மினா
  rationale: מָנֶה என்பது எடை அலகு. அளவை ஊகித்து நவீன அலகாக மாற்றாமல், மூல அலகை ஒலிபெயர்த்து வைத்துள்ளது.
- source_word: יַעֲלֶה עַל
  choice: பயன்படுத்தப்பட்டது
  rationale: எபிரெயத்தில் சொற்பட 'மேல் ஏறியது' என்று இருந்தாலும், இங்கு ஒவ்வொரு கேடயத்தின் மேல் பூசப்பட்ட அல்லது பதிக்கப்பட்ட தங்கத்தின் அளவைக் குறிக்கும் இயல்பான தமிழ் வடிவம் இது; சொற்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: הַמָּגֵן הָאֶחָת
  choice: ஒவ்வொரு கேடயத்திற்கும்
  rationale: சொற்பட 'அந்த ஒரு கேடயத்தின் மேல்' என்ற ஒருமை வடிவம் பகிர்ந்தளிக்கும் பொருளில் வருவதால், தமிழில் 'ஒவ்வொரு கேடயத்திற்கும்' என்பது துல்லியமும் இயல்பும் உடையது.
- source_word: וַיִּתְּנֵם
  choice: அவற்றை ... வைத்தான்
  rationale: נתן இங்கு ஒரு குறிப்பிட்ட இடத்தில் பொருட்களை வைத்ததைக் குறிக்கிறது.
- source_word: בֵּית יַעַר הַלְּבָנוֹן
  choice: லெபனோன் வன மாளிகை
  rationale: இது சாலொமோனின் அரண்மனை வளாகத்துடன் தொடர்புடைய தனிப்பெயர் கொண்ட அரச கட்டிடம்; 'மாளிகை' என்பது கட்டிடத்தின் செயல்பாட்டை இயல்பான தமிழில் தெரிவிக்கிறது, 'லெபனோன் வனம்' என்ற பெயரமைப்பையும் காக்கிறது.
