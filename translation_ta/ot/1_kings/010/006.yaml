  yaml_path: translation/ot/1_kings/010/006.yaml
  text: Then she said to the king[a], “The report that I heard in my own land about your words and your wisdom was true.”
translation:
  language: ta
  text: அப்போது அவள் அரசனிடம், “உங்கள் சொற்களைப் பற்றியும்[a] உங்கள் ஞானத்தைப் பற்றியும் என் நாட்டில் நான் கேள்விப்பட்ட செய்தி உண்மையாக இருந்தது” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உங்கள் சொற்கள்” என்பதை “உங்களைப் பற்றிய காரியங்கள்” அல்லது “உங்கள் செயல்கள்” என்றும் மொழிபெயர்க்கலாம். இதற்குரிய எபிரெயச் சொல், உங்களைப் பற்றிய விவகாரங்களை விரிவாகவும் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: அப்போது அவள் ... என்றாள்
  rationale: வாவ் தொடர்வினை கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது; நவீன தமிழில் இயல்பாக அதன் தொடர்ச்சிப் பொருளை வெளிப்படுத்துகிறது.
- source_word: אֶל־הַמֶּלֶךְ
  choice: அரசனிடம்
  rationale: குறிப்பிட்ட அரசனைச் சுட்டும் எபிரெய முன்னிலைத் தொடரை இயல்பான தமிழில் நேரடியாகக் கொடுக்கிறது.
- source_word: אֱמֶת הָיָה הַדָּבָר
  choice: செய்தி உண்மைதான்
  rationale: இங்கு אֱמֶת பயனிலைப் பொருளில் வருகிறது; דָּבָר சூழலில் அவள் கேள்விப்பட்ட செய்தியைக் குறிக்கிறது. தமிழில் இயல்பான வலியுறுத்தலுடன் வழங்கப்பட்டுள்ளது.
- source_word: אֲשֶׁר שָׁמַעְתִּי
  choice: நான் கேள்விப்பட்ட
  rationale: அறிக்கை அல்லது செய்தியைப் பிறரிடமிருந்து அறிந்ததைக் குறிக்கும் சூழலில் ‘கேள்விப்பட்ட’ என்பது இயல்பான தமிழ்.
- source_word: בְּאַרְצִי
  choice: என் நாட்டில்
  rationale: முதல் நபர் உடைமைப் பின்னொட்டையும் אֶרֶץ என்பதன் இச்சூழலுக்குரிய ‘நாடு’ என்ற பொருளையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: עַל־דְּבָרֶיךָ
  choice: உங்கள் சொற்களைப் பற்றியும்
  rationale: דְּבָרִים என்பதன் நேரடியான ‘சொற்கள்’ என்ற பொருளைப் பாதுகாக்கிறது; அது அரசனைப் பற்றிய காரியங்கள் அல்லது செயல்கள் என்ற விரிவான பொருளையும் கொள்ளக்கூடும் என்பதால் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: וְעַל־חָכְמָתֶךָ
  choice: உங்கள் ஞானத்தைப் பற்றியும்
  rationale: முந்தைய தொடருடன் இணைந்த அமைப்பையும் சூழலின் மையக் கருத்தான ஞானத்தையும் நேரடியாகப் பாதுகாக்கிறது.
