base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/028.yaml
  text: And the importation of the horses that belonged to Solomon was from Egypt and Kue[b][a]; the king’s merchants would obtain them from Kue at a price.
translation:
  language: ta
  text: சாலொமோனுக்குச் சொந்தமான குதிரைகள் எகிப்திலிருந்தும் கூவேயிலிருந்தும்[a][b] இறக்குமதி செய்யப்பட்டன; அரசனின் வணிகர்கள் அவற்றைக் கூவேயிலிருந்து விலைக்கு வாங்கினர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய உரையில் இங்குள்ள מִקְוֶה/מִקְוֵה என்ற சொல் உறுதியற்றது; இது சிலிசியாவிலிருந்த கூவே என்ற இடப்பெயராகவோ, ‘கூட்டம்’ அல்லது ‘திரட்டு’ போன்ற பொருளுடைய பொதுப்பெயராகவோ இருக்கலாம்.
    reason: cultural_note
  - marker: b
    text: 'கடினமான எபிரெய உரையை வேறுவிதமாக வாசித்தால்: “ஒரு கூட்டத்திலிருந்தும்; அரசனின் வணிகர்கள் ஒரு கூட்டத்தை விலைக்கு வாங்கினர்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹצָא
  choice: இறக்குமதி செய்யப்பட்டன
  rationale: இச்சொல் ‘வெளியேறுதல்,’ ‘தோற்றுவாய்’ அல்லது வணிகச் சூழலில் ஏற்றுமதி/இறக்குமதியைக் குறிக்கலாம். குதிரைகள் சாலொமோனிடம் வந்த வணிகத் திசையைத் தெளிவுபடுத்த ‘இறக்குமதி செய்யப்பட்டன’ என்பது இயல்பானது.
- source_word: הַסּוּסִים
  choice: குதிரைகள்
  rationale: பன்மை பெயர்ச்சொல்லின் நேரான, இயல்பான தமிழ் மொழிபெயர்ப்பு.
- source_word: אֲשֶׁר לִשְׁלֹמֹה
  choice: சாலொமோனுக்குச் சொந்தமான
  rationale: எழுத்துப்படி ‘சாலொமோனுக்கான’ எனலாம்; இவ்வணிகச் சூழலில் அவரது உடைமை அல்லது அரச வணிக வலையமைப்பைச் சார்ந்த குதிரைகள் என்பதைக் குறிக்கிறது.
- source_word: מִמִּצְרָיִם
  choice: எகிப்திலிருந்து
  rationale: இடப்பெயரின் வழக்கமான தமிழ் வடிவம்.
- source_word: וּמִקְוֵה
  choice: கூவேயிலிருந்தும்
  rationale: מִקְוֵה என்ற கடினமான சொல்லை இங்கு சிலிசியாவிலிருந்த கூவே என்ற இடப்பெயராகப் புரிந்துகொள்வது, எகிப்துடன் இணையாக மற்றொரு மூலப்பகுதியைக் குறிப்பதால் சூழலுக்குப் பொருந்துகிறது. பொதுப்பெயர் வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: סֹחֲרֵי הַמֶּלֶךְ
  choice: அரசனின் வணிகர்கள்
  rationale: அரச சேவையில் வணிகம் செய்த முகவர்களைக் குறிக்கும் இயல்பான நவீனத் தமிழ்.
- source_word: יִקְחוּ
  choice: வாங்கிவந்தார்கள்
  rationale: לקח என்பதன் அடிப்படைப் பொருள் ‘எடுத்தல்’; விலை குறித்த சொற்றொடருடன் வரும் வணிகச் சூழலில் ‘வாங்கிவந்தார்கள்’ என்பது செயலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מִקְוֵה
  choice: கூவேயிலிருந்து
  rationale: முந்தைய சொல்லுடன் ஒத்திசைவாக இடப்பெயர் வாசிப்பு ஏற்கப்பட்டுள்ளது; மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: בִּמְחִיר
  choice: விலைகொடுத்து
  rationale: வணிகப் பரிமாற்றத்தைக் குறிக்கிறது; குறிப்பிட்ட நிலையான விலையை உரை கூறாததால் அதனைச் சேர்க்காமல் இயல்பாக மொழிபெயர்க்கிறது.
