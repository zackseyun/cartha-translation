translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. வணிகச் சூழலை இயல்பாக்க ‘இறக்குமதி செய்யப்பட்டன’ மற்றும் ‘விலைகொடுத்து வாங்கிவந்தார்கள்’ பயன்படுத்தப்பட்டன. מִקְוֵה என்பதிலுள்ள உண்மையான உரைசார் ஐயம் முதன்மை உரையில் கூவே என்ற இடப்பெயராகவும் அடிக்குறிப்புகளில் மாற்று வாசிப்பாகவும் பாதுகாக்கப்பட்டுள்ளது.
