  register: நவீன நிலையான தமிழில் மரியாதைமிக்க ‘உமது’ வடிவம் பயன்படுத்தப்பட்டுள்ளது. அரசவைச் சூழலுக்கேற்ற உயர்ந்த ஆனால் பொதுவாசகர்களுக்குப் புரியும் நடை பேணப்பட்டுள்ளது; ‘பேறுபெற்றவர்கள்’ என்ற மறுமொழி எபிரெய வாக்கியத்தின் இரட்டைப் புகழுரையைத் தக்கவைக்கிறது.
