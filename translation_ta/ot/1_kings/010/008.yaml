base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/008.yaml
  text: Blessed are your men; blessed are these your servants, who stand before you continually and hear your wisdom.
translation:
  language: ta
  text: உமது ஆட்கள் பேறுபெற்றவர்கள்! எப்போதும் உமது முன்னிலையில் நின்று உமது ஞானத்தைக் கேட்கும் இந்தப் பணியாளர்கள் பேறுபெற்றவர்கள்!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: பேறுபெற்றவர்கள்
  rationale: பொறாமைப்படத்தக்க நல்வாழ்வும் நற்பேறும் உடைய நிலையைச் சுட்டும் எபிரெய வாழ்த்துரையின் உயர்ந்த தொனியை இது இயல்பான தமிழில் காக்கிறது.
- source_word: אֲנָשֶׁיךָ
  choice: உமது ஆட்கள்
  rationale: ஆண்பால் பன்மையையும் அரசவையைச் சேர்ந்த ஆட்கள் என்ற சூழலையும் காக்கிறது; பொதுவான ‘மக்கள்’ என்று விரிவுபடுத்தவில்லை.
- source_word: עֲבָדֶיךָ
  choice: உமது பணியாளர்கள்
  rationale: அரசருக்குப் பணிபுரியும் அதிகாரிகள் அல்லது ஏவலர்கள் என்பதே இச்சூழலில் முதன்மை; ‘அடிமைகள்’ என்பது இங்கு தேவையற்ற வகையில் பிணைப்புநிலையை முன்னிறுத்தும்.
- source_word: אֵלֶּה
  choice: இந்த
  rationale: அருகாமையைச் சுட்டும் எபிரெயச் சுட்டுப்பெயரின் வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הָעֹמְדִים לְפָנֶיךָ
  choice: உமது முன்னிலையில் தொடர்ந்து நின்று
  rationale: அரசரின் முன்னிலையில் நின்று பணியாற்றும் நேரடியான காட்சியையும் அரசவைச் சேவை என்ற மறைபொருளையும் காக்கிறது.
- source_word: תָּמִיד
  choice: தொடர்ந்து
  rationale: இடைவிடாத முழுமையான காலத்தைக் கட்டாயப்படுத்தாமல், வழக்கமான தொடர்ச்சியான முன்னிலைப் பணியைக் குறிக்கிறது.
- source_word: הַשֹּׁמְעִים
  choice: கேட்கும்
  rationale: பங்கேற்புப் பெயரெச்ச அமைப்பை இயல்பாகக் காத்து, ஞானத்தைச் செவிமடுக்கும் செயலை நேரடியாகக் கூறுகிறது.
- source_word: חָכְמָתֶךָ
  choice: உமது ஞானத்தை
  rationale: மூலத்தில் உள்ள சுருக்கமான நேரடிப் பொருளைத் தக்கவைத்து, ‘நீர் கூறும் ஞானம்’ போன்ற விளக்கத்தைச் சேர்க்கவில்லை.
