  edition: WLC
  text: וַ/יִּגְדַּל֙ הַ/מֶּ֣לֶךְ שְׁלֹמֹ֔ה מִ/כֹּ֖ל מַלְכֵ֣י הָ/אָ֑רֶץ לְ/עֹ֖שֶׁר וּ/לְ/חָכְמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/023.yaml
  text: So King Solomon surpassed all the kings of the earth in wealth and wisdom[a].
translation:
  language: ta
  text: இவ்வாறு, செல்வத்திலும் ஞானத்திலும் சாலொமோன் அரசர் பூமியிலுள்ள எல்லா அரசர்களையும்விட மேன்மையடைந்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொற்சார்பாக: “சாலொமோன் அரசர் செல்வத்திலும் ஞானத்திலும் பூமியிலுள்ள எல்லா அரசர்களையும்விட பெரியவரானார்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְדַּל
  choice: மேன்மையடைந்தார்
  rationale: גדל என்பதன் அடிப்படைப் பொருளான ‘பெரியவராக/மேன்மையானவராக ஆனார்’ என்பதையும், מִן உடனான ஒப்பீட்டுப் பொருளையும் இயல்பான தமிழில் காக்கிறது; வெறும் நிலையை விட ஏற்பட்ட உயர்வை வினை வடிவம் வெளிப்படுத்துகிறது.
- source_word: הַמֶּלֶךְ שְׁלֹמֹה
  choice: சாலொமோன் அரசர்
  rationale: எபிரெயப் பட்டத்தையும் நபரின் பெயரையும் நவீனத் தமிழின் இயல்பான மரியாதைமிக்க சொல் வரிசையில் தருகிறது.
- source_word: מִכֹּל מַלְכֵי הָאָרֶץ
  choice: பூமியிலுள்ள எல்லா அரசர்களையும்விட
  rationale: אֶרֶץ என்பதற்கான பரந்த ‘பூமி’ என்ற பொருள் இங்குள்ள சர்வதேச அரசர் ஒப்பீட்டுக்கு ஏற்றது; מִן குறிக்கும் ஒப்பீடு ‘-விட’ மூலம் தெளிவாகிறது.
- source_word: לְעֹשֶׁר
  choice: செல்வத்தில்
  rationale: עֹשֶׁר குறிக்கும் பொருளாதார வளத்தை நவீனத் தமிழில் தெளிவாகக் கூறுகிறது; לְ இங்குக் குறிக்கும் துறையைக் ‘-இல்’ வெளிப்படுத்துகிறது.
- source_word: וּלְחָכְמָה
  choice: ஞானத்திலும்
  rationale: חָכְמָה என்பதன் வழக்கமான வேதாகமப் பொருளை ‘ஞானம்’ காக்கிறது; இணைத் துறைகளைக் காட்ட ‘-த்திலும்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: וַ
  choice: இவ்வாறு
  rationale: இங்கு வாவ் முந்தைய விவரங்களின் விளைவையோ சுருக்கத்தையோ முன்னெடுக்கிறது; ‘இவ்வாறு’ அந்த தொடர்பை இயல்பான தமிழில் காட்டுகிறது.
