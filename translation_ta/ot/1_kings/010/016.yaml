base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/016.yaml
  text: King Solomon made two hundred large shields of beaten gold[b][a]; six hundred shekels of gold went onto each shield.
translation:
  language: ta
  text: சாலொமோன் அரசர் அடித்துத் தகடாக்கப்பட்ட தங்கத்தால் இருநூறு பெரிய கேடயங்களைச் செய்தார்[b]. ஒவ்வொரு கேடயத்தின்மேலும் அறுநூறு சேக்கல்[a] தங்கம் பதிக்கப்பட்டது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லர்த்தமாக, ‘அந்த ஒரு கேடயத்தின்மேல் அறுநூறு தங்கம் ஏறியது’; எடை அலகான ‘சேக்கல்’ என்பது மறைமுகமாகக் கொள்ளப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: இங்கு ‘கேடயம்’ என்பதற்குப் பயன்படுத்தப்பட்டுள்ள எபிரெயச் சொல் பெரிய கேடயத்தைக் குறிக்கிறது; அடுத்த வசனத்தில் குறிப்பிடப்படும் சிறிய கேடயங்களிலிருந்து இது வேறுபட்டிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: செய்தார்
  rationale: עשה என்ற பொதுவான வினை இங்கு பொருட்களை உருவாக்குவதைக் குறிக்கிறது; ‘செய்தார்’ என்பது இயல்பான, தெளிவான தமிழ்.
- source_word: הַמֶּלֶךְ שְׁלֹמֹה
  choice: சாலொமோன் அரசர்
  rationale: தமிழின் இயல்பான பெயர்–பட்ட வரிசையில் அரசப் பட்டத்தையும் நபரையும் தெளிவாகக் குறிக்கிறது.
- source_word: מָאתַיִם
  choice: இருநூறு
  rationale: எண்ணின் நேரடியான தமிழ் வடிவம்.
- source_word: צִנָּה
  choice: பெரிய கேடயங்கள்
  rationale: צִנָּה பொதுவாகப் பெரிய கேடயத்தைக் குறிக்கிறது; அடுத்த வசனத்திலுள்ள சிறிய வகைக் கேடயத்திலிருந்து உள்ள வேறுபாட்டையும் இது காக்கிறது.
- source_word: זָהָב שָׁחוּט
  choice: அடித்துத் தகடாக்கப்பட்ட தங்கம்
  rationale: שָׁחוּט என்பது தங்கம் அடித்து அல்லது சுத்தியலால் மெல்லியதாக வேலைசெய்யப்பட்டதைக் குறிக்கிறது; தமிழ் வாசகருக்கு உற்பத்திச் செயல்முறையைத் தெளிவாக்குகிறது.
- source_word: שֵׁשׁ מֵאוֹת זָהָב
  choice: அறுநூறு சேக்கல் தங்கம்
  rationale: எபிரெயத்தில் எடை அலகு வெளிப்படையாக இல்லை; சூழலில் ‘சேக்கல்’ என்பது இயல்பாகப் புரிந்துகொள்ளப்படும் அலகு என்பதால் உரையில் சேர்த்து, அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: יַעֲלֶה עַל
  choice: பயன்படுத்தப்பட்டது
  rationale: சொல்லர்த்தமாக ‘அதன்மேல் ஏறியது’ என்றாலும், கேடயத்தின் மேல் தங்கம் பதிக்கப்பட்ட அளவை நவீன தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: הַצִּנָּה הָאֶחָת
  choice: ஒவ்வொரு கேடயத்திற்கும்
  rationale: சொல்லர்த்தமான ‘அந்த ஒரு கேடயத்தின் மேல்’ என்பதன் பகிர்மானப் பொருளை தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
