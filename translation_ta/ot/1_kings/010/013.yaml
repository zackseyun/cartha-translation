base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/013.yaml
  text: And King Solomon gave the queen of Sheba all that she desired[a], whatever she asked, besides what he gave her according to the hand of King Solomon. Then she turned and went to her own land, she and her servants.
translation:
  language: ta
  text: சேபா நாட்டு அரசி விரும்பிக் கேட்ட அனைத்தையும் சாலொமோன் அரசர் அவருக்குக் கொடுத்தார்; அதற்கு மேலாக, தமது தாராளத்துக்கேற்ப அவர் கொடுத்தவற்றையும் கொடுத்தார்.[a] பின்பு அரசி தம் பணியாளர்களுடன் திரும்பித் தம் நாட்டுக்குச் சென்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “சாலொமோன் அரசரின் கைக்கேற்ப.” இது அவரது வசதி, ஆற்றல், அல்லது தாராளத்துக்கு ஏற்றவாறு என்பதைக் குறிக்கும் மரபுத்தொடர்.
    reason: כְּיַד הַמֶּלֶךְ שְׁלֹמֹה என்ற எபிரெய மரபுத்தொடரின் சொற்சொல் வடிவத்தையும் அதன் சாத்தியமான பொருள் பரப்பையும் பாதுகாக்கிறது.
lexical_decisions:
- source_word: מַלְכַּת שְׁבָא
  choice: சேபா நாட்டு அரசி
  rationale: எபிரெயக் கூட்டுச்சொல் இடப்பெயரையும் அரசப் பட்டத்தையும் குறிக்கிறது; நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் அமையும் வடிவம்.
- source_word: כָּל חֶפְצָהּ אֲשֶׁר שָׁאָלָה
  choice: அரசி விரும்பிக் கேட்ட அனைத்தையும்
  rationale: חֵפֶץ என்பதிலுள்ள விருப்பத்தின் பொருளையும் שׁאל என்பதிலுள்ள கேட்டல் அல்லது வேண்டுகோளின் பொருளையும் ஒருங்கே காக்கிறது.
- source_word: מִלְּבַד
  choice: இவற்றுடன்
  rationale: முன்னர் கேட்டவற்றுக்கு மேலாகச் சாலொமோன் கொடுத்தவற்றையும் குறிக்கும் சேர்க்கைப் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: כְּיַד הַמֶּלֶךְ שְׁלֹמֹה
  choice: சாலொமோன் அரசரின் தாராளத்துக்கேற்ப
  rationale: சொல்லுக்குச் சொல் 'சாலொமோன் அரசரின் கைக்கேற்ப' என்றாலும், இச்சூழலில் அவரது வசதி, ஆற்றல் அல்லது தாராளத்துக்கு ஏற்ற அளவைச் சுட்டும் மரபுத்தொடராகும்.
- source_word: וַתֵּפֶן וַתֵּלֶךְ לְאַרְצָהּ
  choice: தமது நாட்டுக்குத் திரும்பிச் சென்றார்
  rationale: திரும்புதல் மற்றும் செல்லுதல் ஆகிய தொடர்ச்சியான செயல்களை இயல்பான தமிழில் இணைத்துக் கூறுகிறது; அவரது சொந்த நாட்டுக்குச் சென்றதையும் தெளிவாக்குகிறது.
- source_word: עֲבָדֶיהָ
  choice: பணியாளர்கள்
  rationale: அரசவையுடன் பயணித்த சேவகர்கள் அல்லது உடனிருந்தோரைக் குறிக்கும் பரந்த சொல்லாக இது பொருந்துகிறது; சூழல் கூறாத சமூக நிலையை மிகைப்படுத்தாது.
theological_decisions:
- issue: כְּיַד הַמֶּלֶךְ שְׁלֹמֹה என்ற எபிரெய மரபுத்தொடரின் பொருள்
  choice: சாலொமோன் அரசரின் தாராளத்துக்கேற்ப
  alternative: சாலொமோன் அரசரின் கைக்கேற்ப; சாலொமோன் அரசரின் வசதிக்கேற்ப
  rationale: மூலத்தின் 'கை' என்ற உருவகத்தைத் தமிழில் நேரடியாக வைத்தால் பொருள் மறையலாம். தாராளம் என்பது சூழலுக்கு ஏற்ற முதன்மைப் பொருளைத் தருகிறது; வசதி அல்லது ஆற்றல் என்ற நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: עֲבָדֶיהָ என்ற சொல்லின் சமூகப் பொருள்
  choice: பணியாளர்கள்
  alternative: ஊழியர்கள்; அடிமைகள்; பரிவாரத்தார்
  rationale: இங்கு அரசியுடன் வந்த குழுவினரையே வசனம் அடையாளப்படுத்துகிறது. 'பணியாளர்கள்' என்பது நேரடியும் நடுநிலையும் ஆன மொழிபெயர்ப்பு; 'அடிமைகள்' என்று குறிப்பாகத் தீர்மானிக்கச் சூழல் போதாது.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பான, கண்ணியமான அரசவைக் கதைநடை பயன்படுத்தப்பட்டுள்ளது. அரசி மற்றும் அரசருக்கான மரியாதை வினைமுற்றுகள் காக்கப்பட்டுள்ளன; தேவையற்ற பழமையான சொற்கள் தவிர்க்கப்பட்டுள்ளன.
