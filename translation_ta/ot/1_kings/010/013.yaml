  source_fidelity: முதல் வாக்கியம் அரசி விரும்பிக் கேட்ட அனைத்தையும் சாலொமோன் கொடுத்தார் என்ற கருத்தைச் சரியாகத் தருகிறது. ஆனால் מִלְּבַד (‘அதற்கு மேலாக/அல்லாமல்’) என்பதன் தொடர்பு, அதாவது அரசி கேட்டவற்றுக்கு மேலாக அரசரின் அளவுக்கேற்ப அவர் கொடுத்தவை இருந்தன என்பது வரைவில் தெளிவாக இல்லை. இறுதி வாக்கியம் வַתֵּפֶן வַתֵּלֶךְ என்ற இரு வினைகளையும் ‘திரும்பிச் சென்றார்’ எனச் சுருக்குகிறது; தமிழில் அது ஏற்கத்தக்கதாயினும், ‘திரும்பித் ... சென்றார்’ என அமைத்தால் தொடர்ச்சி தெளிவாகும்.
