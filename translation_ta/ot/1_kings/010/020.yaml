translation:
  language: ta
  text: அங்கே பன்னிரண்டு சிங்கங்கள் ஆறு படிகளின்மேல், இந்தப் பக்கமும் அந்தப் பக்கமுமாக நின்றன; எந்த அரசாட்சியிலும் இதுபோன்ற ஒன்று செய்யப்பட்டதில்லை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/שְׁנֵים עָשָׂר אֲרָיִים
  choice: பன்னிரண்டு சிங்க உருவங்கள்
  rationale: எபிரெய உரையில் நேரடியாக ‘பன்னிரண்டு சிங்கங்கள்’ என்றாலும், அரியணைப் படிகளில் அமைந்த உருவச்சிலைகளைக் குறிப்பது சூழலால் தெளிவு; தமிழில் உயிருள்ள சிங்கங்கள் எனத் தவறாகப் புரியாமல் இருக்க ‘சிங்க உருவங்கள்’ இயல்பான தெளிவை அளிக்கிறது.
- source_word: עֹמְדִים שָׁם
  choice: அங்கே ... நின்றன
  rationale: பன்மை Qal வினையெச்சம் நிலையான காட்சியமைப்பை விவரிக்கிறது; ‘நின்றன’ தமிழில் சுருக்கமாகவும் இயல்பாகவும் அதைப் பாதுகாக்கிறது.
- source_word: עַל שֵׁשׁ הַמַּעֲלוֹת
  choice: ஆறு படிகளின் மேல்
  rationale: מַעֲלוֹת என்பது அரியணைக்கு ஏறும் படிகளைக் குறிக்கிறது; עַל என்பதன் இடப்பொருளை ‘மேல்’ நேரடியாக வெளிப்படுத்துகிறது.
- source_word: מִזֶּה וּמִזֶּה
  choice: இந்தப் பக்கமும் அந்தப் பக்கமுமாக
  rationale: இரு பக்கங்களிலும் சமச்சீராக அமைந்திருந்ததைக் காட்டும் எபிரெய இடவியல் மரபுத்தொடரின் இயல்பான தமிழ் வடிவம்.
- source_word: לֹא נַעֲשָׂה כֵן לְ/כָל מַמְלָכוֹת
  choice: எந்த அரசாட்சியிலும் இதைப் போன்ற ஒன்று செய்யப்பட்டதில்லை
  rationale: எதிர்மறைச் சூழலில் כָל מַמְלָכוֹת பகிர்வுப் பொருளில் ‘எந்த அரசாட்சியிலும்’ என வருகிறது; לֹא נַעֲשָׂה כֵן என்பதன் ஒப்புமைப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
