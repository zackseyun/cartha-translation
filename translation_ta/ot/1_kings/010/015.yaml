base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/015.yaml
  text: besides what came from the traveling merchants and from the trade of the merchants[c][b][a], and from all the kings of Arabia and the governors of the land.
translation:
  language: ta
  text: இது தவிர, சுற்றித் திரியும் வணிகர்களிடமிருந்து கிடைத்த வருமானமும்[a], வியாபாரிகளின் வணிகத்திலிருந்து கிடைத்த வருமானமும், அரேபியாவின் எல்லா அரசர்களிடமிருந்தும்[b] நாட்டின் ஆளுநர்களிடமிருந்தும்[c] கிடைத்த வருமானமும் இருந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சுற்றித் திரிந்த மனிதர்களிடமிருந்து.’ இந்த எபிரெயச் சொற்றொடர் கடினமானது; பொதுவாக இடம்விட்டு இடம் பயணம் செய்த வணிகர்களைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘கலப்பின மக்களின் எல்லா அரசர்களிடமிருந்தும்.’ எபிரெயச் சொல் சில சூழல்களில் அந்தப் பொருளைக் கொண்டிருக்கலாம்; இங்கு ‘அரேபியா’ என்பது அதிகம் பொருந்துகிறது.
    reason: alternative_reading
  - marker: c
    text: அல்லது, ‘மாகாண ஆளுநர்களிடமிருந்தும்’; ‘சத்ராப்புகளிடமிருந்தும்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבַד
  choice: இது தவிர
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட ஆண்டுத் தொகைக்கு மேலாக வந்த பிற வருவாய் மூலங்களை அறிமுகப்படுத்துகிறது; தமிழில் சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: מֵאַנְשֵׁי הַתָּרִים
  choice: சுற்றித் திரியும் வணிகர்களிடமிருந்து கிடைத்த வருமானம்
  rationale: இந்த எபிரெயச் சொற்றொடர் கடினமானது. வணிகச் சூழலில், இடம்விட்டு இடம் பயணம் செய்பவர்களை—அநேகமாகச் சுற்றித் திரியும் வணிகர்களை—குறிப்பதாகப் புரிந்துகொள்ளலாம். முந்தைய வசனத்தின் வருவாய்ச் சூழலைத் தெளிவாக்க ‘கிடைத்த வருமானம்’ என இயல்பாக வழங்கப்பட்டுள்ளது.
- source_word: וּמִסְחַר הָרֹכְלִים
  choice: வியாபாரிகளின் வணிகத்திலிருந்து கிடைத்த வருமானம்
  rationale: מִסְחַר என்பது வணிகம் அல்லது வணிகப் பரிவர்த்தனையையும், רֹכְלִים என்பது வியாபாரிகளையும் குறிக்கிறது. அரச வருவாயின் மூலத்தைக் காட்டும் வகையில் இயல்பான தமிழில் வழங்கப்பட்டுள்ளது.
- source_word: וְכָל מַלְכֵי הָעֶרֶב
  choice: அரேபியாவின் எல்லா அரசர்களிடமிருந்தும்
  rationale: இந்தப் புவியரசியல் பட்டியலில் עֶרֶב என்பதை அரேபியா அல்லது அரேபிய மக்களைக் குறிப்பதாகப் புரிந்துகொள்வது பொருத்தமானது. ‘கலப்பின மக்கள்’ என்ற மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: וּפַחוֹת הָאָרֶץ
  choice: நாட்டின் ஆளுநர்களிடமிருந்தும்
  rationale: פַחוֹת என்பது உயர்ந்த அதிகாரத்தின் கீழ் பகுதிகளை நிர்வகித்த அதிகாரிகளைக் குறிக்கிறது. ‘ஆளுநர்கள்’ என்பது தெளிவானதும் தேவையற்ற வரலாற்றுக் குறிப்பைத் திணிக்காததுமான சொல்.
