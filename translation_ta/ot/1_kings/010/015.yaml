translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய மூலத்தில் முந்தைய வசனத்திலிருந்து தொடரும் ‘வருமானம்’ என்ற கருத்து தமிழில் வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது; கடினமான சொற்றொடரும் மாற்றுப் பொருள்களும் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
