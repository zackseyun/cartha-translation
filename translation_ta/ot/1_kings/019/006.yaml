translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட கதைநடை பயன்படுத்தப்பட்டது. ‘இதோ’ மூலம் எபிரெயக் காட்சியின் உயிரோட்டம் காக்கப்பட்டுள்ளது; ‘தலைமாட்டில்’ என்பது படுத்திருக்கும் சூழலை இயல்பாகச் சுட்டுகிறது. அடிக்குறி அது விளக்கும் ‘சூடான கற்களின்மேல் சுடப்பட்ட’ என்ற சொற்றொடருக்குப் பின்பு வைக்கப்பட்டுள்ளது.
