source:
  edition: WLC
  text: וַ/יַּבֵּ֕ט וְ/הִנֵּ֧ה מְרַאֲשֹׁתָ֛י/ו עֻגַ֥ת רְצָפִ֖ים וְ/צַפַּ֣חַת מָ֑יִם וַ/יֹּ֣אכַל וַ/יֵּ֔שְׁתְּ וַ/יָּ֖שָׁב וַ/יִּשְׁכָּֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/006.yaml
  text: He looked[a], and behold, at his head was a cake baked on hot stones and a jar of water. He ate and drank and lay down again.
translation:
  language: ta
  text: அவன் பார்த்தான்; இதோ, அவன் தலைமாட்டில் சூடான கற்களின்மேல் சுடப்பட்ட[a] ஓர் அப்பமும் தண்ணீர்க் குடுவையும் இருந்தன. அவன் சாப்பிட்டுக் குடித்துவிட்டு, மறுபடியும் படுத்துக்கொண்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தணலின்மேல் சுடப்பட்ட.’ רְצָפִים என்ற எபிரெயச் சொல் அப்பம் சுடப் பயன்படுத்தப்பட்ட சூடான கற்களைக் குறிக்கலாம்; சிலர் அதைத் ‘தணல்’ அல்லது ‘நெருப்புக்கரி’ எனப் பொருள்கொள்கிறார்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּבֵּט
  choice: அவன் பார்த்தான்
  rationale: נבט என்பதன் அடிப்படைப் பொருளான ‘பார்’ என்பதை, எபிரெயத்தில் இல்லாத திசை அல்லது கூடுதல் செயலைச் சேர்க்காமல் நேரடியாகத் தருகிறது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: הִנֵּה காட்சியின்மீது உடனடியாகக் கவனத்தை ஈர்க்கும் உரையாடல் துகள்; ‘இதோ’ அதன் உயிரோட்டத்தையும் திடீர் கவனஈர்ப்பையும் காக்கிறது.
- source_word: מְרַאֲשֹׁתָיו
  choice: அவன் தலைமாட்டில்
  rationale: படுத்திருப்பவரின் தலை இருக்கும் இடத்தருகே என்பதைக் குறிக்கும் சொல்லுக்கு இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: עֻגַת
  choice: ஓர் அப்பம்
  rationale: עֻגָה என்பது பொதுவாக வட்ட வடிவிலான அப்பம் அல்லது அப்பக்கட்டியைக் குறிக்கிறது; இச்சூழலில் இனிப்புப் பண்டம் என்ற தவறான எண்ணத்தைத் தவிர்க்க ‘அப்பம்’ பயன்படுத்தப்பட்டது.
- source_word: רְצָפִים
  choice: சூடான கற்களின்மேல் சுடப்பட்ட
  rationale: இச்சொல் அப்பம் சுடப் பயன்படுத்தப்பட்ட சூடாக்கப்பட்ட கற்களைக் குறிக்கலாம். சமையல் முறையைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்தும் மொழிபெயர்ப்பு இது; ‘தணல்’ என்ற மாற்றுப் புரிதல் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- source_word: וְצַפַּחַת מָיִם
  choice: தண்ணீர்க் குடுவை
  rationale: צַפַּחַת என்பது குடுவை, கூஜா அல்லது குப்பி போன்ற நீர்க்கலத்தைக் குறிக்கும்; ‘குடுவை’ எளிமையானதும் இக்காட்சிக்குப் பொருத்தமானதும் ஆகும்.
- source_word: וַיֹּאכַל וַיֵּשְׁתְּ
  choice: அவன் சாப்பிட்டுக் குடித்துவிட்டு
  rationale: தொடர்ச்சியாக நிகழும் இரு செயல்களையும் இயல்பான தமிழ் வினைத்தொடராகக் காட்டுகிறது.
- source_word: וַיָּשָׁב וַיִּשְׁכָּב
  choice: மறுபடியும் படுத்துக்கொண்டான்
  rationale: שׁוּב + שׁכב இங்கு மீண்டும் படுத்துக்கொள்வதைக் குறிக்கிறது; ‘திரும்பி’ என்பதைத் தனியே இயந்திரத்தனமாக மொழிபெயர்க்காமல் அதன் பொருளைத் துல்லியமாகத் தருகிறது.
