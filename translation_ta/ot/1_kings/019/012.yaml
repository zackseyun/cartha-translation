source:
  edition: WLC
  text: וְ/אַחַ֤ר הָ/רַ֨עַשׁ֙ אֵ֔שׁ לֹ֥א בָ/אֵ֖שׁ יְהוָ֑ה וְ/אַחַ֣ר הָ/אֵ֔שׁ ק֖וֹל דְּמָמָ֥ה דַקָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/012.yaml
  text: And after the earthquake[a], a fire; Yahweh was not in the fire. And after the fire, a sound of a gentle whisper.
translation:
  language: ta
  text: நிலநடுக்கத்துக்குப் பின் நெருப்பு ஏற்பட்டது; நெருப்பில் யாவே இருக்கவில்லை. நெருப்புக்குப் பின் மெல்லிய அமைதியின் ஓர் ஒலி இருந்தது[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மெல்லிய அமைதியின் குரல்,’ ‘மென்மையான கிசுகிசுப்பு,’ அல்லது ‘மெதுவான கிசுகிசுப்பு’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொற்றொடர் சொல்லுக்குச் சொல் ‘மெல்லிய அமைதியின் ஒலி’ அல்லது ‘மெல்லிய அமைதியின் குரல்’ என வருகிறது; இது நுட்பமானதும் பொருளைத் தீர்மானிப்பது கடினமானதுமான வெளிப்பாடு.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/אַחַר
  choice: பின்
  rationale: நிகழ்வுகளின் தொடர்ச்சியை இயல்பான நவீனத் தமிழில் குறிக்கிறது; எபிரெய உரையின் வரிசைநடையையும் காக்கிறது.
- source_word: הָ/רַעַשׁ
  choice: நிலநடுக்கம்
  rationale: רַעַשׁ என்பது கடுமையான அதிர்வையோ நிலநடுக்கத்தையோ குறிக்கும்; இங்குள்ள இறைத்தோற்ற நிகழ்வுகளின் சூழலில் ‘நிலநடுக்கம்’ தெளிவான பொருத்தம்.
- source_word: אֵשׁ
  choice: நெருப்பு
  rationale: அடுத்த இயற்கை நிகழ்வைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது. தமிழில் வாக்கியத்தை நிறைவு செய்ய ‘வந்தது’ சேர்க்கப்பட்டுள்ளது.
- source_word: לֹא בָ/אֵשׁ יְהוָה
  choice: நெருப்பில் யாவே இருக்கவில்லை
  rationale: ב என்ற முன்னொட்டின் இடப்பொருளை ‘நெருப்பில்’ எனக் காத்து, இறைப் பிரசன்னத்தின் முறையை மேலதிகமாக விளக்காமல் விடுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பட்டத்தால் மாற்றாமல், எபிரெயத் தனிப்பெயரான יהוה என்பதன் தமிழாக்க ஒலிபெயர்ப்பைப் பயன்படுத்துகிறது.
- source_word: קוֹל
  choice: ஓர் ஒலி
  rationale: קוֹל என்பது ‘ஒலி’ அல்லது ‘குரல்’ எனப் பொருள்படலாம். இங்கு வெளிப்படையான பேச்சைச் சேர்க்காமல் மூலத்தின் இருபொருள் வாய்ப்பை ‘ஒலி’ காக்கிறது.
- source_word: דְּמָמָה
  choice: அமைதி
  rationale: அசைவின்மை, மௌனம், அமைதி ஆகிய பொருட்களை உடைய சொல்லை இயல்பான தமிழில் தருகிறது; ‘அமைதியின் ஒலி’ என்ற மூலத்தின் நோக்கமுள்ள முரணையும் காக்கிறது.
- source_word: דַקָּה
  choice: மெல்லிய
  rationale: ‘நுண்ணிய, மெலிந்த, மெல்லிய’ என்ற பொருளைத் தருகிறது; தமிழில் புரியத்தக்கவாறும் மூலத்தின் நுட்பத்தைக் காக்கும் வகையிலும் உள்ளது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பட்டம் அல்ல, இறைவனின் தனிப்பெயர் நேரடியாக உள்ளது; ஆகவே அதனை ஒலிபெயர்த்து வழங்குகிறது.
- issue: קוֹל דְּמָמָה דַקָּה என்ற கடினமான சொற்றொடர்
  choice: மெல்லிய அமைதியின் ஓர் ஒலி
  alternative: மென்மையான கிசுகிசுப்பு / மெல்லிய அமைதியான குரல்
  rationale: ஒலியும் அமைதியும் இணையும் மூலத்தின் திட்டமிட்ட பதற்றத்தையும், ‘ஒலி’ அல்லது ‘குரல்’ என்ற பொருள் வாய்ப்பையும் தேவையின்றி தீர்மானிக்காமல் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. முதல் மற்றும் இறுதி பெயர்ச்சொல் தொடர்களில் தமிழுக்குத் தேவையான ‘வந்தது,’ ‘கேட்டது’ ஆகிய வினைகள் சேர்க்கப்பட்டுள்ளன; ஆனால் இறுதி எபிரெயச் சொற்றொடரின் திட்டமிட்ட முரண் அடிக்குறிப்புடன் பாதுகாக்கப்பட்டுள்ளது.
