  to: நிலநடுக்கத்துக்குப் பின் நெருப்பு ஏற்பட்டது; நெருப்பில் யாவே இருக்கவில்லை. நெருப்புக்குப் பின் மெல்லிய அமைதியின் ஓர் ஒலி இருந்தது[a].
