source:
  edition: WLC
  text: וְ/הָיָ֗ה הַ/נִּמְלָ֛ט מֵ/חֶ֥רֶב חֲזָאֵ֖ל יָמִ֣ית יֵה֑וּא וְ/הַ/נִּמְלָ֛ט מֵ/חֶ֥רֶב יֵה֖וּא יָמִ֥ית אֱלִישָֽׁע׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/017.yaml
  text: And it shall be that whoever escapes from the sword of Hazael[a], Jehu shall put to death; and whoever escapes from the sword of Jehu, Elisha shall put to death.
translation:
  language: ta
  text: 'இப்படியாகும்: ஆசகேலின் வாளிலிருந்து தப்புகிறவனை யெகூ கொன்றுபோடுவான்; யெகூவின் வாளிலிருந்து தப்புகிறவனை எலிசா கொன்றுபோடுவான்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எலிசா கொல்வான்.” எபிரேய வினைச்சொல் காரணவினை வடிவில் உள்ளது; அது “மரணமடையச் செய்வான்” என்ற பொருளைத் தருகிறது. சூழலில், இது எலிசா நேரடியாகச் செய்வதையோ, அவரது தீர்க்கதரிசன ஊழியத்தின் மூலம் நிறைவேறும் தீர்ப்பையோ குறிக்கலாம்.
    reason: சொற்பொருள் மாற்றுவாய்ப்பையும், எலிசாவின் செயலாண்மை குறித்த விளக்கச் சாத்தியத்தையும் முதன்மை உரையின் நேரடித் தன்மையை மாற்றாமல் பாதுகாக்கிறது.
lexical_decisions:
- source_word: וְהָיָה
  choice: அப்போது
  rationale: வரவிருக்கும் நிகழ்வின் விளைவை அறிமுகப்படுத்தும் எபிரேயக் கதைநடைச் சூத்திரத்தை, இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: הַנִּמְלָט
  choice: தப்புகிறவனை
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் வினையெச்சத்தின் பொதுப்படையான பொருளைத் தமிழில் இயல்பாகத் தருகிறது; வாக்கியத்தில் இது செயப்படுபொருளாக இருப்பதால் ‘-வனை’ வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: מֵחֶרֶב
  choice: வாளுக்குத் தப்புகிற
  rationale: חֶרֶב என்பதன் நேரடிப் பொருளான ‘வாள்’ தக்கவைக்கப்பட்டுள்ளது; அது இங்கு ஆயுதவழி மரணத் தீர்ப்பையும் குறிக்கலாம். தமிழில் ‘வாளிலிருந்து தப்புகிற’ என்பதைவிட ‘வாளுக்குத் தப்புகிற’ என்பது இயல்பான சொற்றொடர்.
- source_word: חֲזָאֵל
  choice: ஆசகேல்
  rationale: எபிரேயத் தனிப்பெயரின் வழக்கமான தமிழாக்க ஒலிபெயர்ப்பு.
- source_word: יָמִית
  choice: கொன்றுபோடுவான்
  rationale: מות என்பதன் ஹிஃபில் வடிவத்திலுள்ள மரணமடையச் செய்யும் காரணவினைப் பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது; இரு இணை வாக்கியங்களிலும் ஒரே சொல்லாக்கம் தக்கவைக்கப்பட்டுள்ளது.
- source_word: יֵהוּא
  choice: யெகூ
  rationale: எபிரேயத் தனிப்பெயரின் வழக்கமான தமிழாக்க ஒலிபெயர்ப்பு.
- source_word: וְהַנִּמְלָט
  choice: தப்புகிறவனை
  rationale: முந்தைய அதே பெயர்ச்சொல் பயன்பாட்டுடன் ஒருமைப்பாட்டைப் பேணுகிறது; இணைப்பை அரைப்புள்ளி இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֱלִישָׁע
  choice: எலிசா
  rationale: எபிரேயத் தனிப்பெயரின் வழக்கமான தமிழாக்க ஒலிபெயர்ப்பு.
theological_decisions:
- issue: எலிசா ‘கொன்றுபோடுவான்’ என்பதில் அவரது செயலாண்மை
  choice: எலிசாவை மரணத் தீர்ப்பின் நேரடி இலக்கணச் செய்பவராகக் காட்டும் எபிரேய இணை அமைப்பு முதன்மை உரையில் தக்கவைக்கப்பட்டுள்ளது.
  alternative: எலிசாவின் தீர்க்கதரிசன ஊழியத்தால் அல்லது அவர் அறிவித்த தீர்ப்பின் மூலம் மரணம் நேரிடும் என்று இடுபெயர்ச்சியாகப் புரிந்துகொள்ளலாம்.
  rationale: எபிரேய வாக்கிய அமைப்பு ஆசகேல், யெகூ, எலிசா ஆகியோரை இணையான செய்பவர்களாக முன்வைக்கிறது. எலிசாவின் பங்கை முதன்மை உரையில் மென்மையாக்குவது மூலத்தில் இல்லாத விளக்கத்தைச் சேர்க்கும்; அதேவேளை தீர்க்கதரிசன ஊழியத்தின் வழியான தீர்ப்பு என்ற சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு புரியும் வகையிலும் வேதக் கதைநடைக்கேற்ற கண்ணியத்துடனும் மொழியாக்கப்பட்டுள்ளது. ‘வாள்’ என்ற உருவகம் நீக்கப்படவில்லை; மூன்று நபர்களின் தீர்ப்புச் செயலாண்மையில் உள்ள இறையியல் பதற்றமும் மென்மையாக்கப்படவில்லை.
