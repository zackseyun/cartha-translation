base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/018.yaml
  text: Yet I have left for myself seven thousand in Israel—all the knees that have not bowed to Baal[b][a], and every mouth that has not kissed him.
translation:
  language: ta
  text: ஆனால் இஸ்ரவேலில் ஏழாயிரம் பேரை எனக்கென்று மீதியாக வைத்திருக்கிறேன்[a]—பாகாலுக்கு மண்டியிடாத எல்லா முழங்கால்களையும், அவனை முத்தமிடாத[b] எல்லா வாய்களையும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்ரவேலில் ஏழாயிரம் பேரை எனக்கென்று காத்துவைத்திருக்கிறேன்.” சூழலைப் பொறுத்து, “மீதியாக வைப்பேன்” என்றும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: ஒரு சிலையை முத்தமிடுவது அதற்கு மரியாதை செலுத்தும் அல்லது அதை வழிபடும் செயலாக இருந்தது.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִשְׁאַרְתִּי
  choice: ஆனால் ... எனக்கென்று மீதியாக வைத்திருப்பேன்
  rationale: שׁאר என்பதன் ஹிஃபில் வடிவம் ‘மீதியாக இருக்கச் செய்தல்/மீதியாக வைத்தல்’ என்ற பொருளைத் தருகிறது. முந்தைய கட்டளைகளின் எதிர்காலத் தொடர்ச்சியில் இதை எதிர்காலமாக மொழிபெயர்த்துள்ளோம்; இணைப்புச் சொல் எலியாவின் முறையீட்டுக்கு எதிரான திருப்பத்தை ‘ஆனால்’ என வெளிப்படுத்துகிறது. ‘எனக்கென்று’ என்பது தேவனுக்காகப் பாதுகாத்துவைத்திருக்கும் கருத்தை இயல்பாகத் தெரிவிக்கிறது.
- source_word: בְיִשְׂרָאֵל
  choice: இஸ்ரவேலில்
  rationale: இடப்பொருளைக் குறிக்கும் எளிய சொற்றொடர்.
- source_word: שִׁבְעַת אֲלָפִים
  choice: ஏழாயிரம் பேர்
  rationale: எண்ணிக்கையை இயல்பான தமிழில் தருகிறது; அடுத்து வரும் உடல் உறுப்புச் சித்திரங்கள் மக்களைக் குறிக்கும் என்பதால் ‘பேர்’ சேர்க்கப்பட்டுள்ளது.
- source_word: כָּל הַבִּרְכַּיִם
  choice: எல்லா முழங்கால்களையும்
  rationale: மக்களைக் குறிக்கும் ஆகுபெயராக இருந்தாலும், வழிபாட்டில் பணிவதைக் காட்டும் உடல் உறுப்புச் சித்திரத்தை இழக்காமல் வைத்திருக்கிறது.
- source_word: אֲשֶׁר לֹא כָרְעוּ לַבַּעַל
  choice: பாகாலுக்கு மண்டியிடாத
  rationale: כרע என்பது மண்டியிடுதல் அல்லது பணிதலைக் குறிக்கிறது. לַבַּעַל என்பது வணக்கத்தின் இலக்காகப் பாகாலைக் காட்டுவதால் ‘பாகாலுக்கு’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: הַבַּעַל
  choice: பாகால்
  rationale: எபிரெயத்தில் சுட்டுச் சொல் இருந்தாலும், தமிழில் இது தெய்வத்தின் பெயராக இயல்பாக வழங்கப்படுகிறது.
- source_word: וְכָל הַפֶּה
  choice: எல்லா வாய்களையும்
  rationale: எபிரெய ஒருமைத் தொகுப்புச் சொல்லின் பகிர்வுப் பொருளைத் தமிழில் இயல்பாகத் தருவதோடு, ‘முழங்கால்கள்’ என்பதற்கு இணையான உடல் உறுப்புச் சித்திரத்தையும் காக்கிறது.
- source_word: אֲשֶׁר לֹא נָשַׁק לוֹ
  choice: அவனை முத்தமிடாத
  rationale: נשׁק என்பதன் நேரடிப் பொருள் ‘முத்தமிடுதல்.’ பிரதிப்பெயரின் முன்னிலை பாகால் என்பது தெளிவாக இருப்பதால் ‘அவனை’ தக்கவைக்கப்பட்டுள்ளது; வழிபாட்டு உட்பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
theological_decisions:
- issue: உண்மையுள்ள மீதியானவர்களைப் பற்றிய கூற்றில் பிற்காலக் கோட்பாட்டுச் சொற்களைச் சேர்க்காமல் இருப்பது
  choice: எனக்கென்று மீதியாக வைத்திருப்பேன்
  alternative: எனக்கென்று மீதியாக வைத்திருக்கிறேன் / காத்துவைத்திருக்கிறேன்
  rationale: இது தேவன் உண்மையுள்ளவர்களைத் தமக்காக மீதியாக வைப்பதை வெளிப்படுத்துகிறது; ஆனால் மூலத்தில் இல்லாத தொழில்நுட்ப இறையியல் பதத்தைச் சேர்ப்பதில்லை. எபிரெய வினையின் காலப் பொருள் சூழலால் வேறுபடக்கூடியதால் மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘முழங்கால்கள்’ மற்றும் ‘வாய்கள்’ என்ற மூலத்தின் இணை உடல் உறுப்புச் சித்திரங்கள் நோக்கமுடன் தக்கவைக்கப்பட்டுள்ளன; நீண்ட வாக்கியத்தின் விளக்கப் பகுதியைத் தெளிவாக்க நீண்ட கோடு பயன்படுத்தப்பட்டுள்ளது.
