  text: וַ/יֹּ֗אמֶר צֵ֣א וְ/עָמַדְתָּ֣ בָ/הָר֮ לִ/פְנֵ֣י יְהוָה֒ וְ/הִנֵּ֧ה יְהוָ֣ה עֹבֵ֗ר וְ/ר֣וּחַ גְּדוֹלָ֡ה וְ/חָזָ֞ק מְפָרֵק֩ הָרִ֨ים וּ/מְשַׁבֵּ֤ר סְלָעִים֙ לִ/פְנֵ֣י יְהוָ֔ה לֹ֥א בָ/ר֖וּחַ יְהוָ֑ה וְ/אַחַ֤ר הָ/ר֨וּחַ רַ֔עַשׁ לֹ֥א בָ/רַ֖עַשׁ יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/011.yaml
  text: And he said[a], “Go out and stand on the mountain before Yahweh.” And behold, Yahweh was passing by, and a great and strong wind was tearing apart the mountains and shattering rocks before Yahweh, but Yahweh was not in the wind. And after the wind, an earthquake[b], but Yahweh was not in the earthquake.
translation:
  language: ta
  text: 'அவர் கூறினார்: “நீ வெளியே சென்று, மலையின்மேல் யாவேவின் முன்னிலையில் நில்.” இதோ, யாவே கடந்து சென்றுகொண்டிருந்தார். யாவேவின் முன்னிலையில் மிகப் பெரியதும் வலிமையானதுமான ஒரு காற்று மலைகளைப் பிளந்து, பாறைகளை நொறுக்கிக்கொண்டிருந்தது; ஆனால் யாவே அந்தக் காற்றில் இருக்கவில்லை[a]. காற்றுக்குப் பின் நிலநடுக்கம் ஏற்பட்டது; ஆனால் யாவே அந்த நிலநடுக்கத்தில் இருக்கவில்லை[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் நேரடியாக, “யாவே காற்றில் இருக்கவில்லை.” இது அவர் அதில் தம்மை வெளிப்படுத்தவில்லை என்பதைக் குறிக்கக்கூடும்; ஆனால் மொழிபெயர்ப்பு மூலத்தின் நேரடியான சொல்லாக்கத்தையே தக்கவைக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெய மொழியில் நேரடியாக, “யாவே நிலநடுக்கத்தில் இருக்கவில்லை.” இந்த நிகழ்வு யாவேயின் ஆளுகைக்கு உட்பட்டதல்ல என்று இவ்வாக்கியம் மறுப்பதில்லை; கதையுரை கூறும் விதத்தில் அவர் அதில் இருக்கவில்லை என்றே சொல்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இஸ்ரவேலுக்கு வெளிப்படுத்தப்பட்ட இறைப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், எபிரெய மெய்யெழுத்துப் பெயரின் வழக்கமான ஒலிபெயர்ப்பாகத் தருகிறது.
- source_word: צֵא
  choice: வெளியே சென்று
  rationale: எலியா இருந்த இடத்திலிருந்து வெளியே செல்லுமாறு கூறும் கட்டளையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְעָמַדְתָּ
  choice: நில்
  rationale: עמד என்பதன் நேரடியான நிலைசார் பொருளைக் கூடுதல் வலியுறுத்தல் இன்றி தருகிறது.
- source_word: בָהָר
  choice: மலையின்மேல்
  rationale: எலியா நிற்க வேண்டிய இடத்தைத் தெளிவாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: לִפְנֵי יְהוָה
  choice: யாவேக்கு முன்பாக
  rationale: இடம்சார் மற்றும் முன்னிலைசார் நுண்ணுணர்வை விரிவாக்கமின்றிப் பாதுகாக்கிறது.
- source_word: וְהִנֵּה
  choice: அப்போது, இதோ
  rationale: காட்சியின் திடீர் நாடகத் தன்மையையும் கவன ஈர்ப்பையும் நவீனத் தமிழில் தக்கவைக்கிறது.
- source_word: עֹבֵר
  choice: கடந்துசென்றுகொண்டிருந்தார்
  rationale: எபிரெயப் பங்கேற்புவினையின் தொடர்ச்சியான, நிகழ்காட்சி போன்ற அம்சத்தை வெளிப்படுத்துகிறது.
- source_word: רוּחַ
  choice: காற்று
  rationale: மலைகளையும் பாறைகளையும் தாக்கும் இயற்கை நிகழ்வாகச் சூழல் இதைக் காட்டுவதால் ‘ஆவி’ என்பதற்குப் பதிலாக ‘காற்று’ பொருத்தமானது.
- source_word: גְּדוֹלָה וְחָזָק
  choice: மிகப் பெரியதும் வலிமையானதுமான
  rationale: இரு பெயரடைகளையும் தனித்தனியாகப் பாதுகாத்து, அவற்றின் தீவிரத்தைக் கேட்பதற்கு இயல்பான தமிழில் தருகிறது.
- source_word: מְפָרֵק הָרִים
  choice: மலைகளைப் பிளந்து
  rationale: மலைகளை வன்மையாக உடைத்துப் பிரிக்கும் தொடர்ச்சியான செயலைச் சுருக்கமாகவும் காட்சியுணர்வுடனும் தருகிறது.
- source_word: וּמְשַׁבֵּר סְלָעִים
  choice: பாறைகளை நொறுக்கிக்கொண்டிருந்தது
  rationale: பங்கேற்புவினையின் தொடர்ச்சியையும் காற்றின் அழிவாற்றலையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: רַעַשׁ
  choice: நிலநடுக்கம்
  rationale: இந்த இயற்கை நிகழ்வுகளின் தொடரில் רעשׁ என்பதற்குரிய பொருத்தமான சூழல்சார் பொருள் இதுவாகும்.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / ஆண்டவர் / யெகோவா
  rationale: மூலத்தில் நேரடியாக இடம்பெறும் உடன்படிக்கைப் பெயரைப் பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்த்து வழங்குகிறது.
- issue: யாவே காற்றிலும் நிலநடுக்கத்திலும் ‘இருக்கவில்லை’ என்பதன் பொருள்
  choice: ‘இருக்கவில்லை’ என்ற இடம்சார் மொழியை அப்படியே தக்கவைத்தல்
  alternative: ‘தம்மை வெளிப்படுத்தவில்லை’ அல்லது ‘அவருடைய பிரசன்னம் இல்லை’ என்று விளக்குதல்
  rationale: மூலம் ב preposition-ஐப் பயன்படுத்தி யாவே அவற்றில் இல்லை என்று மட்டுமே கூறுகிறது. அவர் அவற்றை ஆளவில்லை என்றோ, குறிப்பிட்ட விதத்தில் வெளிப்படவில்லை என்றோ மொழிபெயர்ப்பிலேயே முடிவு செய்யாமல், கதையின் இறையியல் பதற்றத்தையும் உண்மையான தெளிவின்மையையும் பாதுகாக்கிறது.
- issue: עֹבֵר என்பதன் காலநிலை
  choice: யாவே கடந்துசென்றுகொண்டிருந்தார்
  alternative: யாவே கடந்துசென்றார் / கடந்துசெல்லவிருந்தார்
  rationale: பங்கேற்புவினை தொடரும் அல்லது உடனடியாக நிகழும் செயலைக் குறிக்கலாம்; தொடர்நிலைத் தமிழ் காட்சியின் நிகழ்நேரத் தன்மையைப் பாதுகாக்கிறது, ஆனால் எதிர்கால நோக்கைத் திணிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் வகையிலும் வேதாகமக் கதையுரைக்கேற்ற கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. ‘இதோ’ என்ற சொல் மூலத்தின் நாடகமிக்க கவன ஈர்ப்பைப் பாதுகாக்கிறது; தொடர்நிலை வினைகள் காட்சியின் இயக்கத்தை வெளிப்படுத்துகின்றன.
