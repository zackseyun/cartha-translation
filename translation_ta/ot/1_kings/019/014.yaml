base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/014.yaml
  text: And he said[a], “I have been very zealous for Yahweh, the God of hosts, because the sons of Israel have forsaken your covenant, torn down your altars, and killed your prophets with the sword. I alone am left, and they seek my life[b], to take it.”
translation:
  language: ta
  text: 'அவன் சொன்னான்: “படைகளின் கடவுளாகிய யாவேக்காக நான் மிகுந்த ஆர்வம் காட்டியிருக்கிறேன்.[a] ஏனெனில் இஸ்ரவேல் மக்கள் உமது உடன்படிக்கையைக் கைவிட்டார்கள்; உமது பலிபீடங்களை இடித்துப்போட்டார்கள்; உமது தீர்க்கதரிசிகளை வாளால் கொன்றார்கள். நான் ஒருவன் மட்டுமே மீந்திருக்கிறேன்; என் உயிரைப் பறிப்பதற்காக அவர்கள் என்னைத் தேடுகிறார்கள்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேக்காக நான் மிகவும் பொறாமை கொண்டிருக்கிறேன்.” எபிரெயத்தில் முற்றிலா வினை வடிவமும் வினைமுற்றும் இணைந்து இந்தக் கூற்றை வலியுறுத்துகின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַנֹּא קִנֵּאתִי
  choice: நான் மிகுந்த வைராக்கியம் கொண்டிருந்தேன்
  rationale: வினையெச்ச முழுவடிவமும் வினைமுற்றும் இணைந்து கருத்தை வலுப்படுத்துகின்றன. இங்கு பொறாமை அல்ல, யாவேக்கான தீவிர உடன்படிக்கைப் பற்றே சூழலுக்குப் பொருத்தமானது; ‘மிகுந்த’ என்பது எபிரெய வலியுறுத்தலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לַיהוָה
  choice: யாவேக்காக
  rationale: לְ முன்னொட்டு வைராக்கியத்தின் நோக்கைச் சுட்டுகிறது. יהוה என்ற தனிப்பெயர் தமிழில் ‘யாவே’ என ஒலிபெயர்க்கப்படுகிறது.
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: படைகளின் கடவுள்
  rationale: צבאות என்பது விண்ணுலக அல்லது மண்ணுலகப் படைகளை உள்ளடக்கக்கூடிய பன்மைப் பெயர். ‘படைகள்’ அதன் அகலத்தைத் தக்கவைக்கிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: சொல்லுக்கு சொல் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இது தேசத்தைக் குறிக்கும் வழக்கமான கூட்டு இனப்பெயர். நவீன தமிழில் ‘இஸ்ரவேல் மக்கள்’ இயல்பாகவும் உள்ளடக்கத் துல்லியத்துடனும் உள்ளது.
- source_word: עָזְבוּ בְרִיתְךָ
  choice: உமது உடன்படிக்கையைக் கைவிட்டார்கள்
  rationale: עזב என்பது கைவிடுதல் அல்லது துறத்தலைக் குறிக்கிறது; ‘கைவிட்டார்கள்’ உடன்படிக்கை மீறலின் தீவிரத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: מִזְבְּחֹתֶיךָ הָרָסוּ
  choice: உமது பலிபீடங்களை இடித்துப்போட்டார்கள்
  rationale: הרס என்பது கட்டமைப்பை இடித்தல் அல்லது தகர்த்தலைக் குறிக்கிறது. ‘இடித்துப்போட்டார்கள்’ செயற்பாட்டின் வன்மையையும் நிறைவு நிலையையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: נְבִיאֶיךָ הָרְגוּ בֶחָרֶב
  choice: உமது தீர்க்கதரிசிகளை வாளால் கொன்றார்கள்
  rationale: கருவியைக் குறிக்கும் בֶחָרֶב என்பதை ‘வாளால்’ என நேரடியாகத் தக்கவைத்து, வன்முறையின் தெளிவை பாதுகாக்கிறது.
- source_word: וָאִוָּתֵר אֲנִי לְבַדִּי
  choice: நான் ஒருவன் மட்டுமே மீந்திருக்கிறேன்
  rationale: אֲנִי לְבַדִּי எலியாவின் தனிமையை வலியுறுத்துகிறது. ‘ஒருவன் மட்டுமே’ என்ற ஆண்பால் வடிவம் பேசுபவரான எலியாவுக்குப் பொருந்துகிறது.
- source_word: וַיְבַקְשׁוּ אֶת נַפְשִׁי לְקַחְתָּהּ
  choice: என் உயிரைப் பறிக்க அவர்கள் தேடுகிறார்கள்
  rationale: נפש இச்சொற்றொடரில் ஆத்துமாவை அல்ல, உயிரைக் குறிக்கிறது. நோக்கத்தைக் குறிக்கும் לְקַחְתָּהּ உடன் சேர்த்து, ‘உயிரைப் பறிக்கத் தேடுதல்’ என்ற இயல்பான தமிழ் மரபுத்தொடராக வழங்கப்பட்டுள்ளது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பொதுப் பட்டப்பெயர் அல்ல, உடன்படிக்கையின் தனிப்பெயரான יהוה நேரடியாக உள்ளது. அதன் தனிப்பெயர் இயல்பைத் தக்கவைக்க ‘யாவே’ என ஒலிபெயர்க்கப்பட்டது.
- issue: קַנֹּא קִנֵּאתִי என்பதிலுள்ள உணர்வின் தன்மை
  choice: மிகுந்த வைராக்கியம் கொண்டிருந்தேன்
  alternative: மிகுந்த பொறாமை கொண்டிருந்தேன்
  rationale: קנא என்பதற்கு வைராக்கியம் மற்றும் பொறாமை ஆகிய இரு நிழற்பொருள்கள் இருக்கலாம். இங்கு எலியா யாவேக்கான தன் தீவிரப் பற்றையும் உடன்படிக்கை விசுவாசத்தையும் கூறுவதால், தவறான மனிதப் பொறாமை என்ற பொருளைத் தூண்டாத ‘வைராக்கியம்’ தேர்ந்தெடுக்கப்பட்டது; மாற்று நிழற்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையுடனும் பொதுவாசகருக்கு எளிதில் புரியும் வகையிலும் அமைக்கப்பட்டுள்ளது. இறைவனை நோக்கிய இரண்டாம் நபர் உருபுகள் ‘உமது’ என உயர்பாங்கில் வழங்கப்பட்டுள்ளன. வரலாற்றுப் பேச்சாளரின் ஆண்பால் அடையாளம் ‘ஒருவன்’ என்பதில் தக்கவைக்கப்பட்டுள்ளது.
