base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/008.yaml
  text: So he arose and ate and drank[a], and went in the strength of that food forty days and forty nights to Horeb, the mountain of God.
translation:
  language: ta
  text: அவன் எழுந்து, சாப்பிட்டுக் குடித்தான். அந்த உணவு தந்த வலிமையால்[a] அவன் நாற்பது நாட்களும் நாற்பது இரவுகளும் கடவுளின் மலையான ஓரேபுக்குச் சென்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்த உணவின் வலிமையுடன்.” எபிரெயச் சொற்றொடர், அவன் உண்ட உணவிலிருந்து பெற்ற ஊட்டத்தையும் வலிமையையும் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: அவன் எழுந்து
  rationale: קום என்ற வினையின் எளிய தொடர் நிகழ்வுப் பொருளை இயல்பான தமிழ் கதைநடையில் தருகிறது.
- source_word: וַיֹּאכַל וַיִּשְׁתֶּה
  choice: சாப்பிட்டுக் குடித்தான்
  rationale: இரு தொடர்ச்சியான செயல்களையும் எளிய, தற்போதைய பொதுத்தமிழில் நேரடியாகத் தருகிறது.
- source_word: וַיֵּלֶךְ
  choice: பயணம் செய்து ... அடைந்தான்
  rationale: הלך என்பதன் அடிப்படைப் பொருள் ‘சென்றான்’; இங்கு நாற்பது பகலும் இரவும் நீண்ட பயணத்தையும் ஓரேபு என்ற இலக்கையும் தமிழ் மொழியில் இயல்பாக வெளிப்படுத்த இவ்வாறு அமைக்கப்பட்டுள்ளது.
- source_word: בְּכֹחַ הָאֲכִילָה הַהִיא
  choice: அந்த உணவு தந்த வலிமையால்
  rationale: சொல்லுக்கு சொல் ‘அந்த உண்ணுதலின் வலிமையில்’ என்பது தமிழில் இயல்பற்றது. உண்ட உணவினால் கிடைத்த ஊட்டமும் வலிமையும் குறிக்கப்படுவதைத் தெளிவாகவும் மூலத்திற்கு நெருக்கமாகவும் தருகிறது.
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לַיְלָה
  choice: நாற்பது பகலும் நாற்பது இரவும்
  rationale: கால அளவைக் குறிக்கும் எபிரெய வழக்கைத் துல்லியமாகவும் தமிழில் இயல்பாகவும் தருகிறது.
- source_word: עַד
  choice: அடைந்தான்
  rationale: இங்கு பயணத்தின் இறுதி இலக்கைக் குறிக்கிறது; ‘வரை சென்றான்’ என்பதைக் காட்டிலும் ‘அடைந்தான்’ தமிழில் இயல்பான இலக்கு வெளிப்பாடு.
- source_word: הַר הָאֱלֹהִים
  choice: கடவுளின் மலையாகிய
  rationale: ‘கடவுளின் மலை’ என்ற மூல அமைப்பையும், அது ஓரேபை விளக்கும் அடைமொழி என்பதையும் காக்கிறது.
- source_word: חֹרֵב
  choice: ஓரேபு
  rationale: எபிரெய இடப்பெயரின் ஒலியைத் தமிழில் இயன்றவரை பிரதிபலிக்கும் எழுத்துப்பெயர்ப்பு.
theological_decisions:
- issue: הָאֱלֹהִים என்பதன் பொருள்
  choice: கடவுள்
  alternative: தெய்வீகமான
  rationale: ‘கடவுளின் மலை’ என்பது வேதாகமத்தில் நிலைபெற்ற இடச் சுட்டுப்பெயர்; இங்கு אֱלֹהִים தனிப்பட்ட கடவுளைக் குறிக்கிறது. ‘தெய்வீகமான’ என்பது தேவையற்ற பொருள் மாற்றத்தை ஏற்படுத்தும்.
translation_notes:
  register: நவீன செந்தமிழுக்கும் பொதுவழக்குக்கும் இடைப்பட்ட, வாசிக்க எளிய கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘சாப்பிட்டான்’ என்பது இன்றைய வாசகருக்கு இயல்பானது; ‘புசித்தான்’ போன்ற பழமையான சொல்லாட்சி தவிர்க்கப்பட்டுள்ளது. வசனத்தின் நீண்ட எபிரெயத் தொடரமைப்பு தமிழின் இயல்புக்கேற்ப இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது.
