  text: וַ/יֵּ֣לֶךְ מִ֠/שָּׁם וַ/יִּמְצָ֞א אֶת אֱלִישָׁ֤ע בֶּן שָׁפָט֙ וְ/ה֣וּא חֹרֵ֔שׁ שְׁנֵים עָשָׂ֤ר צְמָדִים֙ לְ/פָנָ֔י/ו וְ/ה֖וּא בִּ/שְׁנֵ֣ים הֶ/עָשָׂ֑ר וַ/יַּעֲבֹ֤ר אֵלִיָּ֨הוּ֙ אֵלָ֔י/ו וַ/יַּשְׁלֵ֥ךְ אַדַּרְתּ֖/וֹ אֵלָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/019.yaml
  text: So he went from there and found Elisha son of Shaphat[a], and he was plowing with twelve yoke-pairs before him, and he was with the twelfth[b]. Elijah passed by him and threw his cloak over him.
translation:
  language: ta
  text: அவர் அங்கிருந்து புறப்பட்டுச் சென்று, சாப்பாத்தின் மகன் எலிசாவைக் கண்டார். எலிசா தமக்கு முன்னே பன்னிரண்டு இணைகளை வைத்து உழுதுகொண்டிருந்தார்[a]; அவரோ பன்னிரண்டாவது இணையோடு இருந்தார். எலியா அவரிடம் சென்று, தமது மேலங்கியை அவர்மேல் வீசினார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பன்னிரண்டு நுகத்தடி ஜோடிகள்.” எபிரெயச் சொல் உழவுக்காக இணைக்கப்பட்ட பன்னிரண்டு ஜோடிகளைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: பாரம்பரியமாக, “தமது அங்கியை அவர்மேல் வீசினார்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ מִשָּׁם
  choice: அவர் அங்கிருந்து புறப்பட்டுச் சென்று
  rationale: தொடர்கதை நகர்வையும் מִשָּׁם என்பதன் இடப்பொருளையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וַיִּמְצָא אֶת אֱלִישָׁע בֶּן שָׁפָט
  choice: சாப்பாத்தின் மகன் எலிசாவைக் கண்டார்
  rationale: מָצָא என்பதன் நேரான பொருளான ‘கண்டார்’ என்பதையும் தந்தை–மகன் உறவையும் தெளிவாகக் காக்கிறது.
- source_word: וְהוּא חֹרֵשׁ
  choice: எலிசா ... உழுதுகொண்டிருந்தார்
  rationale: எபிரெயப் பங்கேற்புவினையின் தொடர்ச்சியான, காட்சியமைக்கும் செயலை ‘உழுதுகொண்டிருந்தார்’ இயல்பாகத் தெரிவிக்கிறது.
- source_word: שְׁנֵים עָשָׂר צְמָדִים
  choice: பன்னிரண்டு ஜோடி ஏர் மாடுகள்
  rationale: צֶמֶד என்பது நுகத்தடியில் இணைக்கப்பட்ட உழவு விலங்குகளின் ஜோடியைக் குறிக்கலாம். சாதாரண தமிழில் விவசாயக் காட்சியைத் தெளிவாக்க ‘ஜோடி ஏர் மாடுகள்’ என வழங்கப்பட்டுள்ளது; சொற்பொருள் மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לְפָנָיו
  choice: தமக்கு முன்னே இருந்த
  rationale: இணைகள் எலிசாவுக்கு முன்பாக இருந்த இடத்தொடர்பை விளக்காமல் அல்லது மாற்றாமல் காக்கிறது.
- source_word: וְהוּא בִּשְׁנֵים הֶעָשָׂר
  choice: அவரோ பன்னிரண்டாவது ஜோடியோடு இருந்தார்
  rationale: எபிரெயத்தின் சுருக்கமான, ஓரளவு நீள்விடப்பட்ட சொல்லமைப்பைத் தீர்த்துரைக்காமல் காக்கிறது.
- source_word: וַיַּעֲבֹר אֵלִיָּהוּ אֵלָיו
  choice: எலியா அவரருகே கடந்து சென்று
  rationale: עָבַר என்பதன் கடந்து செல்லும் இயக்கத்தையும் אֵלָיו என்பதன் எலிசாவை நோக்கிய அணுகலையும் ஒன்றாக வெளிப்படுத்துகிறது.
- source_word: וַיַּשְׁלֵךְ אַדַּרְתּוֹ אֵלָיו
  choice: தமது மேலங்கியை அவர்மேல் எறிந்தார்
  rationale: אַדֶּרֶת என்பதைக் காலத்திற்கேற்ற எளிய தமிழில் ‘மேலங்கி’ எனக் கொடுத்து, குறியீட்டுச் செயலுக்கு விளக்கத்தை முதன்மை உரையில் சேர்க்காமல் நிகழ்வை மட்டும் மொழிபெயர்க்கிறது.
theological_decisions:
- issue: எலியாவின் ஆடையின் குறியீட்டுப் பொருள்
  choice: ‘தமது மேலங்கியை அவர்மேல் எறிந்தார்’ என்று செயலை மட்டும் நேரடியாக வழங்குதல்
  alternative: ‘தீர்க்கதரிசிப் பொறுப்பை அவரிடம் ஒப்படைத்தார்’ என்று விளக்கிப் பொருளுரைத்தல், அல்லது பாரம்பரியமாக ‘சால்வை/அங்கி’ என வழங்குதல்
  rationale: இந்த வசனம் செயலை விவரிக்கிறது; அதன் குறியீட்டுப் பொருளை வெளிப்படையாக விளக்கவில்லை. ஆகவே தீர்க்கதரிசிப் பணி அல்லது வாரிசுரிமை என்ற விளக்கத்தை முதன்மை உரைக்குள் சேர்க்காமல், சுற்றியுள்ள சூழல் அதைக் காட்ட அனுமதிக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகமக் கதையாடலுக்கேற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டது. மரியாதைப் பன்மை சீராகப் பயன்படுத்தப்பட்டுள்ளது. ‘பன்னிரண்டாவது ஜோடியோடு இருந்தார்’ என்ற எபிரெயத்தின் சுருக்கமும் இடத்தொடர்பில் உள்ள இயல்பான பதற்றமும் விளக்கிப் பரவலாக்கப்படாமல் பாதுகாக்கப்பட்டுள்ளன.
