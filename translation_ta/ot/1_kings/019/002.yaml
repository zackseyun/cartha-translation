source:
  edition: WLC
  text: וַ/תִּשְׁלַ֤ח אִיזֶ֨בֶל֙ מַלְאָ֔ךְ אֶל אֵלִיָּ֖הוּ לֵ/אמֹ֑ר כֹּֽה יַעֲשׂ֤וּ/ן אֱלֹהִים֙ וְ/כֹ֣ה יוֹסִפ֔וּ/ן כִּֽי כָ/עֵ֤ת מָחָר֙ אָשִׂ֣ים אֶֽת נַפְשְׁ/ךָ֔ כְּ/נֶ֖פֶשׁ אַחַ֥ד מֵ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/002.yaml
  text: Then Jezebel sent a messenger to Elijah[a], saying, “So may the gods do, and more also, if by this time tomorrow I do not make your life like the life of one of them.”
translation:
  language: ta
  text: அப்போது யேசபேல், “தெய்வங்கள் எனக்கு இப்படியும், இதற்கு மேலும் செய்யட்டும்; நாளை இதே நேரத்திற்குள் உன் உயிரை அவர்களில் ஒருவனின் உயிரைப் போல நான் ஆக்காவிட்டால்” என்று கூறி ஒரு தூதரை எலியாவிடம் அனுப்பினாள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּשְׁלַח
  choice: அப்போது ... அனுப்பி
  rationale: வய்யிக்தோல் வடிவம் நிகழ்ச்சித் தொடரை முன்னெடுக்கிறது; நவீன தமிழில் ‘அப்போது’ அந்தத் தொடர்ச்சியை இயல்பாகக் காட்டுகிறது.
- source_word: מַלְאָךְ
  choice: தூதுவன்
  rationale: அரண்மனைச் சூழலில் இது இயற்கைக்கு அப்பாற்பட்ட தேவதூதனை அல்ல, மனிதச் செய்தியாளரைக் குறிக்கிறது.
- source_word: לֵאמֹר
  choice: என்று சொல்லச் சொன்னாள்
  rationale: ஒரு தூதுவன் வழியாக அனுப்பப்பட்ட நேரடிச் செய்தி என்பதால், தமிழில் செய்தியின் பரிமாற்றத்தைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: כֹּה יַעֲשׂוּן אֱלֹהִים וְכֹה יוֹסִפוּן
  choice: தெய்வங்கள் எனக்கு இப்படியும் இதற்கு மேலும் செய்யட்டும்
  rationale: இது தன் மீது தண்டனையை வரவழைக்கும் வழக்கமான ஆணைச் சூத்திரம். ‘எனக்கு’ என்பது எபிரெயச் சொற்றொடரில் வெளிப்படையாக இல்லாவிட்டாலும், சூத்திரத்தின் நோக்கத்தைத் தமிழில் தெளிவாக்குகிறது.
- source_word: אֱלֹהִים
  choice: தெய்வங்கள்
  rationale: இச்சூழலில் யேசபேலின் சமயப் பின்னணியும் அதனுடன் வரும் பன்மை வினைச்சொற்களும் பன்மைப் பொருளை ஆதரிக்கின்றன; ஒருமைப் பொருளும் மொழியியல் ரீதியில் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: כִּי
  choice: ஆக்காவிட்டால்
  rationale: ஆணைச் சூத்திரத்துக்குள் வரும் நிபந்தனையைத் தமிழில் எதிர்மறை நிபந்தனை வடிவில் இயல்பாகக் காட்டுகிறது.
- source_word: כָעֵת מָחָר
  choice: நாளை இதே நேரத்திற்குள்
  rationale: அடுத்த நாளின் இதே நேரத்தை இறுதி எல்லையாகக் கொண்ட அச்சுறுத்தலைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: אָשִׂים אֶת־נַפְשְׁךָ
  choice: உன் உயிரையும் நான் ஆக்காவிட்டால்
  rationale: ‘உன் உயிரை ஆக்குதல்’ என்ற எபிரெய அமைப்பைத் தக்கவைத்து, கொல்லும் அச்சுறுத்தலை நேரடியாக விளக்கிச் சுருக்காமல் விடுகிறது.
- source_word: נַפְשְׁךָ
  choice: உன் உயிர்
  rationale: இங்கு נֶפֶשׁ ஆத்துமாவை அல்ல, ஒருவரின் உயிரை அல்லது வாழ்வைச் சுட்டுகிறது.
- source_word: כְּנֶפֶשׁ אַחַד מֵהֶם
  choice: அவர்களில் ஒருவனின் உயிரைப் போல
  rationale: எபிரெயத்தில் இருமுறை வரும் ‘உயிர்’ என்ற கருத்தையும், கொல்லப்பட்டவர்களில் ஒருவனுடன் செய்யப்படும் ஒப்பீட்டையும் காக்கிறது.
theological_decisions:
- issue: யேசபேலின் ஆணையில் אֱלֹהִים என்பதன் குறிப்பு
  choice: 'பன்மை: ‘தெய்வங்கள்’'
  alternative: 'ஒருமை: ‘தேவன்’'
  rationale: யேசபேலின் சமயச் சூழலும் יַעֲשׂוּן, יוֹסִפוּן என்ற பன்மை வினை வடிவங்களும் பன்மை வாசிப்புக்கு வலுவான ஆதாரம் தருகின்றன. எனினும் אֱלֹהִים ஒருமைப் பொருளிலும் பயன்படுவதால் அந்த மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: ஆணைச் சூத்திரத்தில் வெளிப்படையாக இல்லாத மறைமுகப் பொருள்
  choice: ‘எனக்கு’ என்பதைச் சேர்த்தல்
  alternative: ‘தெய்வங்கள் இப்படியும் இதற்கு மேலும் செய்யட்டும்’ என்று மறைமுகப் பொருளை விடுதல்
  rationale: இது பேசுபவர் தம்மீது சாபத்தை வரவழைக்கும் ஆணைச் சூத்திரம்; தமிழில் ‘எனக்கு’ இல்லாமல் விடுவது யாருக்கு என்ன செய்ய வேண்டும் என்பதில் தேவையற்ற தெளிவின்மையை உருவாக்கும். இச்சேர்ப்பு புதிய இறையியல் கருத்தைச் சேர்க்காமல் சூத்திரத்தின் உள்ளார்ந்த பொருளை வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘தூதுவன்’ மனிதச் செய்தியாளரைக் குறிக்கிறது. ஆணையின் கடுமையும் எபிரெயத்தில் உள்ள ‘உயிர்’ என்ற மறுமொழியும் பாதுகாக்கப்பட்டுள்ளன.
