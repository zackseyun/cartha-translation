base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/021.yaml
  text: Then he turned back from following him[a], took the pair of oxen, and sacrificed them. With the oxen’s equipment he boiled the flesh and gave it to the people, and they ate[b]. Then he arose and went after Elijah and served him.
translation:
  language: ta
  text: 'பின்பு அவன் எலியாவைப் பின்தொடர்வதைவிட்டுத் திரும்பி, ஒரு சோடி எருதுகளை[a] எடுத்துக்கொண்டு, அவற்றைப் பலியிட்டான். எருதுகளின் உபகரணங்களைக்[b] கொண்டு இறைச்சியை வேகவைத்து, மக்களுக்குக் கொடுத்தான்; அவர்களும் உண்டனர். பிறகு அவன் எழுந்து, எலியாவின் பின்னால் சென்று அவருக்குப் பணிவிடை செய்தான்.


    [a] வேறு மொழிபெயர்ப்பு: “எருதுகளின் ஒரு நுகம்.”


    [b] வேறு மொழிபெயர்ப்பு: “எருதுகளின் நுகத்தை” அல்லது “எருதுகளின் கருவிகளை.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு மொழிபெயர்ப்பு: “எருதுகளின் ஒரு நுகம்.”'
    reason: צֶמֶד என்பது ‘சோடி’ என்பதோடு ‘நுகம்’ என்ற பொருளையும் கொள்ளலாம்.
  - marker: b
    text: 'வேறு மொழிபெயர்ப்பு: “எருதுகளின் நுகத்தை” அல்லது “எருதுகளின் கருவிகளை.”'
    reason: כְּלִי என்பது பரந்த பொருளுடைய சொல்; இச்சூழலில் நுகம் அல்லது பிற உபகரணங்கள் எனப் பொருள்கொள்ளலாம்.
lexical_decisions:
- source_word: וַיָּשָׁב מֵאַחֲרָיו
  choice: எலியாவைப் பின்தொடர்வதைவிட்டுத் திரும்பி
  rationale: எபிரெயச் சொற்றொடரின் நேரடியான பொருள் ‘அவனுக்குப் பின்னாலிருந்து திரும்பினான்.’ முந்தைய வசனத்தில் எலிசா எலியாவின் பின்னால் ஓடிய சூழலை இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: צֶמֶד הַבָּקָר
  choice: அந்தச் சோடி எருதுகளை
  rationale: צֶמֶד என்பது பொதுவாக ஒன்றாக இணைக்கப்பட்ட ஒரு சோடியைக் குறிக்கிறது. உழவுச் சூழலில் בקר என்பதற்கு ‘எருதுகள்’ இயல்பானதும் தெளிவானதும் ஆகும்; நுகம்பூட்டப்பட்டவை என்ற நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: וַיִּזְבָּחֵהוּ
  choice: பலியிட்டான்
  rationale: זבח என்பது சாதாரணமாகக் கொல்வதைவிட பலியிடும் நுணுக்கத்தைக் கொண்டுள்ளது. எபிரெயில் பொருளைக் குறிக்கும் பின்னொட்டு ஒருமைத் தொகுப்பாக இருந்தாலும், தமிழில் ‘சோடி எருதுகள்’ என்பதற்கேற்ப பொருள் பன்மையாக விளங்குகிறது.
- source_word: וּבִכְלִי הַבָּקָר
  choice: எருதுகளின் உழவுக் கருவிகளைக் கொண்டு
  rationale: כְּלִי என்பது பாத்திரம், கருவி, உபகரணம் எனப் பரந்த பொருளுடையது. இங்கு எருதுகளோடு பயன்படுத்தப்பட்ட மர உழவுக் கருவிகள் இறைச்சியைச் சமைக்கப் பயன்படுத்தப்பட்டதாகச் சூழல் காட்டுகிறது; ‘நுகம்’ என்ற குறிப்பான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: בִּשְּׁלָם הַבָּשָׂר
  choice: அவற்றின் இறைச்சியை வேகவைத்து
  rationale: בשל என்பது வேகவைத்தல் அல்லது சமைத்தல் எனப் பொருள்படும். ‘வேகவைத்து’ மூலத்தின் செயலை நெருக்கமாகவும் இயல்பான நவீன தமிழிலும் தருகிறது; בשר என்பதற்கு இச்சூழலில் ‘இறைச்சி’ பொருத்தமானது.
- source_word: לָעָם
  choice: மக்களுக்குக்
  rationale: עם இங்கு அந்தக் கூட்டு உணவில் பங்குபெற்ற உள்ளூர் மக்களைக் குறிக்கிறது. ‘மக்கள்’ என்பது நேரடியான, சார்பற்ற மொழிபெயர்ப்பு.
- source_word: וַיָּקָם
  choice: பிறகு அவன் எழுந்து
  rationale: எபிரெயக் கதைத் தொடரின் அடுத்த செயலை நேரடியாகக் காட்டுகிறது; அடுத்த வினைச்சொல்லில் செல்லுதல் தனியே இருப்பதால் ‘புறப்பட்டு’ என்று பொருளைச் சேர்க்கவில்லை.
- source_word: וַיֵּלֶךְ אַחֲרֵי אֵלִיָּהוּ
  choice: எலியாவின் பின்னால் சென்று
  rationale: ‘எலியாவுக்குப் பின்னால் சென்றான்’ என்ற மூலத்தின் உடல்சார்ந்த பின்செல்லும் உருவகத்தைப் பாதுகாக்கிறது; முன்னருள்ள ‘பின்தொடர்வது’ என்பதையும் எதிரொலிக்கிறது.
- source_word: וַיְשָׁרְתֵהוּ
  choice: அவருக்குப் பணிவிடை செய்தான்
  rationale: שרת என்பது ஒருவருக்குச் சேவை செய்வதை, பல வேளைகளில் உதவியாளர் அல்லது பணியாளர் நிலையில் சேவை செய்வதை, குறிக்கிறது. ‘பணிவிடை செய்தான்’ இந்தச் சூழலில் மரியாதையானதும் இயல்பானதும்; சேவையின் தன்மையை அளவுக்கு மீறிக் குறிப்பதில்லை.
theological_decisions:
- issue: זבח என்பதில் பலியிடும் பொருளை வெளிப்படையாகக் காட்ட வேண்டுமா
  choice: ‘பலியிட்டான்’ என்று மொழிபெயர்க்கப்பட்டது
  alternative: வழிபாட்டுச் சார்பை வெளிப்படுத்தாமல் ‘கொன்றான்’ அல்லது ‘அறுத்தான்’ என்று மொழிபெயர்த்தல்
  rationale: இந்த எபிரெய வினை பொதுவாகப் பலியிடுதலுடன் தொடர்புடையது; அதைத் தொடர்ந்து வரும் பொதுவிருந்து அந்த நுணுக்கத்துக்கு ஏற்றதாக உள்ளது. எனினும் பலி யாருக்குச் செலுத்தப்பட்டது அல்லது எந்த முறையில் நடந்தது என்பதை மூலவசனம் கூறாததால் மொழிபெயர்ப்பும் அதைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் வேதாகமக் கதைநடையின் கண்ணியமும் காக்கப்பட்டுள்ளன. எலியாவைக் குறிக்க மரியாதைப் பன்மையான ‘அவருக்கு’ பயன்படுத்தப்பட்டுள்ளது; எலிசாவைப் பற்றிய மூன்றாம் நபர் ஒருமை கதைநடை தொடர்கிறது. மூலத்தில் இல்லாத பலியின் பெறுநர் அல்லது சடங்கு விவரங்கள் சேர்க்கப்படவில்லை.
