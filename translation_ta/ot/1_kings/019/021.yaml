    [a] வேறு மொழிபெயர்ப்பு: “நுகம்பூட்டிய எருதுகளை.”

    [b] வேறு மொழிபெயர்ப்பு: “எருதுகளின் நுகத்தை” அல்லது “எருதுகளுக்குரிய கருவிகளை.”'
  to: 'பின்பு அவன் எலியாவைப் பின்தொடர்வதைவிட்டுத் திரும்பி, ஒரு சோடி எருதுகளை[a] எடுத்துக்கொண்டு, அவற்றைப் பலியிட்டான். எருதுகளின் உபகரணங்களைக்[b] கொண்டு இறைச்சியை வேகவைத்து, மக்களுக்குக் கொடுத்தான்; அவர்களும் உண்டனர். பிறகு அவன் எழுந்து, எலியாவின் பின்னால் சென்று அவருக்குப் பணிவிடை செய்தான்.


    [a] வேறு மொழிபெயர்ப்பு: “எருதுகளின் ஒரு நுகம்.”


    [b] வேறு மொழிபெயர்ப்பு: “எருதுகளின் நுகத்தை” அல்லது “எருதுகளின் கருவிகளை.”'
  rationale: The revision corrects the nuance of ‘took,’ retains the lexical breadth of ‘equipment,’ and aligns both footnotes more closely with the Hebrew alternatives. It preserves the source text’s restrained sacrificial language and its narrative register.
