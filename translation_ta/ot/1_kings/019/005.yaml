base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/005.yaml
  text: Then he lay down and slept under a broom tree. And behold[a], an angel touched him and said to him, “Get up, eat.”
translation:
  language: ta
  text: பின்பு அவன் ஒரு விளக்குமாறுச் செடியின் கீழ் படுத்துத் தூங்கினான். இதோ, ஒரு தூதன்[a] அவனைத் தொட்டு, “எழுந்து சாப்பிடு” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல் மனிதத் தூதரையோ வானதூதரையோ குறிக்கலாம்; இங்குள்ள சூழல் ‘வானதூதன்’ என்ற பொருளுக்கு ஆதரவளிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב וַיִּישַׁן
  choice: பின்பு அவன் ... படுத்துத் தூங்கினான்
  rationale: தொடர்ச்சியான இரண்டு எபிரெய வினைச்சொற்களின் எளிய கதைநடையையும் நிகழ்வுகளின் வரிசையையும் இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: תַּחַת רֹתֶם אֶחָד
  choice: ஒரு துடைப்பச் செடியின் கீழே
  rationale: רֹתֶם என்பது வறண்ட நிலத்தில் வளரும் broom வகைச் செடி; אֶחָד இங்கு குறிப்பற்ற ஒருமையை உணர்த்துவதால் ‘ஒரு’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְהִנֵּה זֶה
  choice: அப்போது இதோ, ஒரு
  rationale: הִנֵּה அறிமுகப்படுத்தும் திடீர், காட்சிமிக்க திருப்பத்தை ‘இதோ’ காக்கிறது; זֶה உடன் சேர்ந்த இவ்வமைப்பு தமிழில் இயல்பாகக் குறிப்பற்ற அறிமுகமாக வழங்கப்படுகிறது.
- source_word: מַלְאָךְ
  choice: தூதன்
  rationale: எபிரெயச் சொல் மனிதத் தூதரையோ வானதூதரையோ குறிக்கலாம். ‘தூதன்’ அந்த உண்மையான சொற்பொருள் இருமையைக் காக்கிறது; சூழல் வானதூதனைச் சுட்டுவதை அடிக்குறிப்பு விளக்குகிறது.
- source_word: נֹגֵעַ בּוֹ
  choice: அவனைத் தொட்டு
  rationale: தொடுதலைக் குறிக்கும் பங்கேற்பு வடிவம் தமிழ் கதைநடையில் இயல்பான முடிவுற்ற செயலாக வழங்கப்பட்டுள்ளது.
- source_word: קוּם אֱכֹל
  choice: எழுந்து சாப்பிடு
  rationale: இரண்டு சுருக்கமான கட்டளைகளின் நேரடித்தன்மையை இயல்பான நவீனத் தமிழில் காக்கிறது.
theological_decisions:
- issue: מַלְאָךְ என்பது மனிதத் தூதனா அல்லது வானதூதனா
  choice: முதன்மை உரையில் ‘தூதன்’; சூழல் வானதூதனைச் சுட்டுவதாக அடிக்குறிப்பு
  alternative: ‘வானதூதன்’ என்று நேரடியாக மொழிபெயர்த்தல்
  rationale: மூலச் சொல்லின் உண்மையான பொருள் இருமையைத் தீர்த்துவிடாமல் காக்கிறது. தொடரும் அற்புதமான உணவு வழங்கல் வானதூதன் என்ற புரிதலை ஆதரித்தாலும், அது சொல் வடிவத்தால் மட்டும் கட்டாயப்படுத்தப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிமையான, கண்ணியமான கதைநடை. ‘இதோ’ மூலம் எபிரெய உரையின் திடீர் காட்சித் திருப்பம் காக்கப்பட்டுள்ளது; ‘எழுந்து சாப்பிடு’ பேச்சு வழக்கில் இயல்பாகவும் கட்டளையின் சுருக்கத்துடனும் உள்ளது.
