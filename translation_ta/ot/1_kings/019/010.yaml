  text: וַ/יֹּאמֶר֩ קַנֹּ֨א קִנֵּ֜אתִי לַ/יהוָ֣ה אֱלֹהֵ֣י צְבָא֗וֹת כִּֽי עָזְב֤וּ בְרִֽיתְ/ךָ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֶת מִזְבְּחֹתֶ֣י/ךָ הָרָ֔סוּ וְ/אֶת נְבִיאֶ֖י/ךָ הָרְג֣וּ בֶ/חָ֑רֶב וָֽ/אִוָּתֵ֤ר אֲנִי֙ לְ/בַדִּ֔/י וַ/יְבַקְשׁ֥וּ אֶת נַפְשִׁ֖/י לְ/קַחְתָּֽ/הּ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/010.yaml
  text: And he said[a], “I have been very zealous for Yahweh, the God of hosts, because the sons of Israel have forsaken your covenant, torn down your altars, and killed your prophets with the sword. I alone am left, and they seek my life[c][b], to take it.”
translation:
  language: ta
  text: அதற்கு அவர், “படைகளின் கடவுளாகிய யாவேக்காக நான் மிகுந்த ஆர்வத்துடன் இருந்திருக்கிறேன். ஏனெனில் இஸ்ரயேல் மக்கள் உமது உடன்படிக்கையைக் கைவிட்டு, உமது பலிபீடங்களை இடித்துப்போட்டு, உமது தீர்க்கதரிசிகளை வாளால் கொன்றுவிட்டார்கள். நான் ஒருவன் மட்டுமே எஞ்சியிருக்கிறேன்; என் உயிரைப் பறிப்பதற்காக அவர்கள் என்னைத் தேடுகிறார்கள்” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קַנֹּא קִנֵּאתִי
  choice: நான் மிகவும் வைராக்கியத்துடன் இருந்திருக்கிறேன்
  rationale: வினையெச்சப் பெயர்ச்சொல்லும் முடிவுற்ற வினையும் இணையும் எபிரெய தீவிரக் கட்டமைப்பை ‘மிகவும்’ வெளிப்படுத்துகிறது; இச்சூழலில் பொறாமையைவிட கடவுளுக்கான தீவிரப் பற்றே கருத்து.
- source_word: לַיהוָה
  choice: யாவேக்காக
  rationale: மூலத்தில் வரும் உடன்படிக்கைப் பெயரான יהוה-ஐ மறைபெயரால் மாற்றாமல் தமிழில் ஒலிபெயர்த்து, לְ குறிக்கும் ‘ஆக/நிமித்தம்’ என்ற உறவையும் இயல்பாகக் காட்டுகிறது.
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: படைகளின் கடவுள்
  rationale: צְבָאוֹת என்பதன் அடிப்படைப் பொருள் படைகள் அல்லது சேனைகள். வேறொரு இறைப்பட்டத்தை இறக்குமதி செய்யாமல் பொருளைத் தெளிவாகக் காக்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: எலியாவின் வைராக்கியத்திற்கான காரணத்தை அறிமுகப்படுத்தும் இணைப்பாக இயல்பாக அமைகிறது.
- source_word: עָזְבוּ בְרִיתְךָ
  choice: உமது உடன்படிக்கையைக் கைவிட்டு
  rationale: עָזַב-இன் கைவிடுதல்/விட்டொழித்தல் என்ற உடன்படிக்கை சார்ந்த கடுமையை நவீன தமிழில் தெளிவாக வழங்குகிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரயேல் மக்கள்
  rationale: சொல்லளவில் ‘இஸ்ரயேலின் மகன்கள்’ என்றாலும் இங்கு உடன்படிக்கை மக்களை மொத்தமாகக் குறிக்கிறது; ‘இஸ்ரயேல் மக்கள்’ இயல்பானதும் பாலின வரம்பைத் தவிர்ப்பதும் ஆகும்.
- source_word: מִזְבְּחֹתֶיךָ הָרָסוּ
  choice: உமது பலிபீடங்களை இடித்துப்போட்டு
  rationale: הָרַס குறிக்கும் இடித்தல்/தகர்த்தல் என்ற செயலைத் தெளிவாகவும் காட்சிப்படுத்துமாறும் தருகிறது.
- source_word: נְבִיאֶיךָ הָרְגוּ בֶחָרֶב
  choice: உமது தீர்க்கதரிசிகளை வாளால் கொன்றுவிட்டார்கள்
  rationale: கருவியைக் குறிக்கும் ‘வாளால்’ என்பதையும் வன்முறையின் நேரடித் தன்மையையும் காக்கிறது.
- source_word: וָאִוָּתֵר אֲנִי לְבַדִּי
  choice: நான் ஒருவன் மட்டுமே எஞ்சியிருக்கிறேன்
  rationale: אֲנִי לְבַדִּי தரும் எலியாவின் தனிமை வலியுறுத்தலை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: וַיְבַקְשׁוּ אֶת נַפְשִׁי לְקַחְתָּהּ
  choice: என் உயிரையும் பறிக்கத் தேடுகிறார்கள்
  rationale: נֶפֶשׁ இங்கு தொழில்நுட்பமான ‘ஆத்துமா’ அல்ல, உயிரைக் குறிக்கிறது; לְקַחְתָּהּ உடன் சேர்ந்து கொல்ல முயல்வதைக் குறிக்கும் தமிழ் மரபுத்தொடராக வழங்கப்பட்டுள்ளது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக வருகிறது. பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்ப்பது மூல வேறுபாட்டைக் காக்கிறது.
- issue: קַנֹּא קִנֵּאתִי என்பதில் வைராக்கியம் அல்லது பொறாமை
  choice: மிகவும் வைராக்கியத்துடன்
  alternative: மிகுந்த பொறாமையுடன்
  rationale: சொல் இரு நிழற்பொருள்களையும் ஏற்கக்கூடியது; ஆனால் எலியா கடவுளுக்காகக் கொண்ட தீவிர உடன்படிக்கைப் பற்றைச் சூழல் முன்னிறுத்துவதால் ‘வைராக்கியம்’ தவறான மனிதப் பொறாமை உணர்வைத் தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதை மிக்க வேதாகம நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. கடவுளை நோக்கிய இரண்டாம் நபர் உரிமை வடிவங்களுக்கு ‘உமது’ பயன்படுத்தப்பட்டுள்ளது. உரையோட்டத்திற்காக எபிரெய வினைத் தொடர்கள் தமிழ் இணை வினையெச்சங்களாக அமைக்கப்பட்டுள்ளன; மூலத்தின் குற்றச்சாட்டு, தீவிரம், தனிமை ஆகியவை காக்கப்பட்டுள்ளன.
