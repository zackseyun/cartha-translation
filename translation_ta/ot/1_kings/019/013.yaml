  text: וַ/יְהִ֣י כִּ/שְׁמֹ֣עַ אֵלִיָּ֗הוּ וַ/יָּ֤לֶט פָּנָי/ו֙ בְּ/אַדַּרְתּ֔/וֹ וַ/יֵּצֵ֕א וַֽ/יַּעֲמֹ֖ד פֶּ֣תַח הַ/מְּעָרָ֑ה וְ/הִנֵּ֤ה אֵלָי/ו֙ ק֔וֹל וַ/יֹּ֕אמֶר מַה לְּ/ךָ֥ פֹ֖ה אֵלִיָּֽהוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/013.yaml
  text: And when Elijah heard it[a], he wrapped his face in his cloak, and went out and stood at the entrance of the cave. And behold, a voice came to him and said, “What are you doing here[b], Elijah?”
translation:
  language: ta
  text: எலியா அதைக் கேட்டபோது[a], தன் மேலங்கியால் முகத்தைப் போர்த்திக்கொண்டு வெளியே சென்று, குகையின் நுழைவாயிலில் நின்றார். இதோ, அவரிடம் ஒரு குரல் வந்தது; அது, “நீ இங்கே என்ன செய்துகொண்டிருக்கிறாய்[b], எலியா?” என்று சொன்னது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அந்த ஒலியைக் கேட்டபோது’ அல்லது ‘அந்தக் குரலைக் கேட்டபோது’ என்றும் மொழிபெயர்க்கலாம். எபிரெயத்தில் ‘கேட்டார்’ என்பதன் செயப்படுபொருள் வெளிப்படையாக இல்லை; முந்தைய சூழலிலிருந்து அது புரிந்துகொள்ளப்படுகிறது.
    reason: alternative_reading
  - marker: b
    text: சொற்படியாக, ‘உனக்கு இங்கே என்ன?’ இந்த எபிரெய மரபுத்தொடர் இவ்விடத்தில் எலியாவின் காரியம் அல்லது நோக்கம் என்ன என்று கேட்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּשְׁמֹעַ
  choice: கேட்டபோது
  rationale: כְּ முன்னொட்டுடன் வரும் வினையெச்ச வடிவம் காலத்தைக் குறிக்கிறது; ‘கேட்டபோது’ என்பது இயல்பான தமிழ் இணை.
- source_word: וַיָּלֶט פָּנָיו בְּאַדַּרְתּוֹ
  choice: தன் மேலங்கியால் முகத்தைப் போர்த்திக்கொண்டு
  rationale: וַיָּלֶט என்பது நெருக்கமாக மூடுதல் அல்லது சுற்றிப் போர்த்துதல்; אַדֶּרֶת ஒரு தனித்துவமான வெளிப்புற ஆடை. ‘மேலங்கி’ நவீன வாசகருக்குத் தெளிவாகவும் செயலை இயல்பாகவும் தெரிவிக்கிறது.
- source_word: פֶּתַח הַמְּעָרָה
  choice: குகையின் நுழைவாயில்
  rationale: פֶּתַח என்பது திறப்பு அல்லது நுழைவிடம்; ‘நுழைவாயில்’ தெளிவான நவீனத் தமிழ்.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: הִנֵּה கொண்டுள்ள திடமான காட்சிப்படுத்தும் உரையாடல் விளைவை ‘இதோ’ பாதுகாக்கிறது; ‘திடீரென்று’ என்று மொழிபெயர்ப்பது மூலத்தில் வெளிப்படையாக இல்லாத நுணுக்கத்தைச் சேர்க்கும்.
- source_word: אֵלָיו קוֹל
  choice: அவரை நோக்கி ஒரு குரல்
  rationale: வினையில்லாத எபிரெயக் கூறு சொற்படியாக ‘அவரிடம் ஒரு குரல்’ எனும் பொருளுடையது. அக்குரல் எலியாவிடம் உரையாடியதை இயல்பான தமிழில் இது தெரிவிக்கிறது.
- source_word: מַה לְּךָ פֹה
  choice: நீ இங்கே என்ன செய்துகொண்டிருக்கிறாய்
  rationale: இந்த எபிரெய மரபுத்தொடர் அந்த இடத்தில் எலியாவின் காரியம் அல்லது நோக்கம் என்ன என்று கேட்கிறது. ‘நீ ஏன் இங்கே இருக்கிறாய்?’ என்பது நோக்கத்தை மட்டும் முன்னிறுத்தி பொருளைச் சற்றுக் குறுக்கக்கூடும்.
- source_word: אֵלִיָּהוּ
  choice: எலியா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நன்கு நிலைபெற்ற பெயர் வடிவம்.
theological_decisions:
- issue: ‘கேட்டான்’ என்பதற்குப் பின் மறைந்துள்ள செயப்படுபொருள்
  choice: அதைக் கேட்டபோது
  alternative: அந்த ஒலியைக் கேட்டபோது / அந்தக் குரலைக் கேட்டபோது
  rationale: இந்த வசனத்தின் எபிரெயத்தில் கேட்டதற்கான செயப்படுபொருள் வெளிப்படையாகக் கூறப்படவில்லை; முந்தைய சூழல் அதை வழங்குகிறது. ‘அதை’ என்பது முந்தைய வசனத்தின் ‘ஒலி’யா அல்லது தெய்வீகக் ‘குரல்’ஆ என்று மிகையாகத் தீர்மானிக்காமல் மூலத்தின் தெளிவின்மையைப் பாதுகாக்கிறது.
- issue: מַה לְּךָ פֹה என்ற கேள்வியின் பரப்பு
  choice: நீ இங்கே என்ன செய்துகொண்டிருக்கிறாய்?
  alternative: நீ ஏன் இங்கே இருக்கிறாய்? / உனக்கு இங்கே என்ன வேலை?
  rationale: மூல மரபுத்தொடர் நோக்கத்தை மட்டுமல்லாமல் இவ்விடத்தில் எலியாவின் காரியம் என்ன என்பதையும் விசாரிக்கக்கூடும். தேர்ந்த வடிவம் அந்த விரிவைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘மேலங்கி,’ ‘நுழைவாயில்’ போன்ற இயல்பான சொற்கள் பயன்படுத்தப்பட்டுள்ளன; அதேவேளையில் ‘இதோ’ என்பதன் மூலம் மூலத்தின் உயிரோட்டமான காட்சிப்படுத்தல் தக்கவைக்கப்பட்டுள்ளது. மரியாதைப் பன்மை வினைமுற்று எலியாவைக் குறிக்கும் உரைநடை மரபுக்காகப் பயன்படுத்தப்பட்டது; நேரடி அழைப்பில் இயல்பான ஒருமை ‘நீ’ தக்கவைக்கப்பட்டது.
