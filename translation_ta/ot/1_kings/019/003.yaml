  yaml_path: translation/ot/1_kings/019/003.yaml
  text: And he saw, and arose and went for his life, and came to Beersheba, which belongs to Judah, and left his servant there.
translation:
  language: ta
  text: அவன் கண்டான்; எழுந்து, தன் உயிரைக் காப்பாற்றிக்கொள்ளப் புறப்பட்டான். யூதாவைச் சேர்ந்த பெயெர்செபாவுக்கு வந்து, தன் பணியாளனை அங்கே விட்டுவிட்டான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சில பழமையான உரைச் சாட்சிகள்: “அவன் பயந்தான்.”'
    reason: எபிரெய மூலஉரையில் “அவன் கண்டான்” என்ற வாசிப்பு உள்ளது; சில பழமையான சாட்சிகளில் காணப்படும் “அவன் பயந்தான்” என்ற மாற்று வாசிப்பைச் சுட்டுகிறது.
lexical_decisions:
- source_word: וַיַּרְא
  choice: அவன் அதைக் கண்டதும்
  rationale: WLC-இன் மெய்யெழுத்துகளும் உயிர்க்குறிகளும் தரும் முதன்மைப் பொருள் ‘அவன் கண்டான்’. தமிழில் தொடரின் காரண-கால உறவை இயல்பாக வெளிப்படுத்த ‘கண்டதும்’ எனவும், சூழலில் முன் கூறப்பட்ட செய்தியைச் சுட்ட ‘அதை’ எனவும் மொழிபெயர்க்கப்பட்டது.
- source_word: וַיֵּלֶךְ אֶל־נַפְשׁוֹ
  choice: தன் உயிரைக் காப்பாற்றிக்கொள்ளப் புறப்பட்டான்
  rationale: சொல்லுக்குச் சொல் ‘தன் உயிரை நோக்கிச் சென்றான்’; இங்கு உயிரைக் காத்துக்கொள்ளத் தப்பிச் செல்வதைக் குறிக்கும் எபிரெய வழக்குமொழியின் பொருள் இயல்பான நவீன தமிழில் தரப்பட்டது.
- source_word: בְּאֵר שֶׁבַע
  choice: பெயெர்செபா
  rationale: இடப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: אֲשֶׁר לִיהוּדָה
  choice: யூதாவைச் சேர்ந்த
  rationale: அந்தக் காலத்தில் பெயெர்செபா யூதாவின் ஆட்சிப்பகுதிக்குள் இருந்ததைக் குறிக்கும் உரிமை/சேர்க்கைச் சொற்றொடர் சுருக்கமாகப் பாதுகாக்கப்பட்டது.
- source_word: נַעֲרוֹ
  choice: தன் பணியாளனை
  rationale: נַעַר என்பதற்கு ‘இளைஞன்’ என்றும் பொருள் உண்டு; இச்சூழலில் உடன் சேவை செய்யும் பணியாளன் என்பதே இயல்பான பொருள்.
theological_decisions:
- issue: וַיַּרְא என்பதன் வாசிப்பு
  choice: அவன் அதைக் கண்டதும்
  alternative: அவன் பயந்ததும்
  rationale: கொடுக்கப்பட்ட WLC உரை ‘கண்டான்’ என்ற வாசிப்பையே கொண்டுள்ளது; ஆகவே பிரதான உரையில் அதுவே பின்பற்றப்பட்டது. சூழலுக்கும் சில பழமையான சாட்சிகளுக்கும் ஏற்ற ‘பயந்தான்’ என்ற மாற்று வாசிப்பு அடிக்குறிப்பில் வைக்கப்பட்டு உரைச் சிக்கல் மறைக்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், இயல்பாகவும் கண்ணியமாகவும் வடிவமைக்கப்பட்டது. எபிரெய தொடர்வினைகள் தமிழில் சீரான வாக்கிய ஓட்டமாக மாற்றப்பட்டாலும், நிகழ்வுகளின் வரிசை முழுமையாகப் பாதுகாக்கப்பட்டது.
