base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/015.yaml
  text: And Yahweh said to him[a], “Go, return by your way to the wilderness of Damascus; and when you arrive[b], you shall anoint Hazael as king over Aram.”
translation:
  language: ta
  text: யாவே அவனிடம், “புறப்பட்டு, உன் வழியாகத் திரும்பி, தமஸ்குவின் வனாந்தரத்திற்குப்[a] போ. நீ அங்கு வந்ததும், ஆசகேலை அராமின்[b] அரசனாக அபிஷேகம் செய்” என்று கூறினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தமஸ்குவின் வனாந்தரத்தை நோக்கி.’ ‘வனாந்தரம்’ என்பதற்கான எபிரெய வடிவத்தில் திசையைக் குறிக்கும் முடிவு உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: ‘அராம்’ என்பது பல மொழிபெயர்ப்புகளில் ‘சிரியா’ என்று வழங்கப்படும் எபிரெயப் பெயர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பட்டமான ‘ஆண்டவர்’ என்பதைக் கொண்டு மாற்றாமல், எபிரெயத் தனிப்பெயரான יהוה-ஐ தமிழில் ஒலிபெயர்க்கிறது.
- source_word: לֵךְ שׁוּב
  choice: நீ புறப்பட்டு, ... திரும்பி ... போ
  rationale: ‘போ’ மற்றும் ‘திரும்பு’ என்ற இரு கட்டளைகளின் இயக்கத்தையும் இயல்பான தமிழில் காக்கிறது.
- source_word: לְדַרְכְּךָ
  choice: உன் வழியே
  rationale: எலியா திரும்பிச் செல்ல வேண்டிய பாதையைக் குறிக்கும் எபிரெயத் தொடரைச் சுருக்கமாகப் பிரதிபலிக்கிறது; ‘நீ வந்த வழியே’ என்று மூலத்தில் வெளிப்படையாக இல்லாத தகவலைச் சேர்க்கவில்லை.
- source_word: מִדְבָּרָה דַמָּשֶׂק
  choice: தமஸ்குவின் வனாந்தரத்திற்கு
  rationale: מִדְבָּרָה என்பதிலுள்ள திசை குறிக்கும் முடிவை ‘-க்கு’ மூலம் காட்டி, தமஸ்குவுடன் தொடர்புடைய வனாந்தரப் பகுதியைச் சுட்டுகிறது.
- source_word: וּבָאתָ
  choice: நீ அங்கே சென்றதும்
  rationale: அடுத்து செய்ய வேண்டிய செயலை வருகைக்குப் பின்வரும் செயலாக இயல்பான தமிழில் எடுத்துரைக்கிறது.
- source_word: וּמָשַׁחְתָּ
  choice: அபிஷேகம் செய்
  rationale: இணைப்புடன் வந்த நிறைவுவினை கட்டளைத் தொடரை முன்னெடுப்பதால், தமிழில் நேரடிக் கட்டளையாக வழங்கப்படுகிறது.
- source_word: חֲזָאֵל
  choice: ஆசகேல்
  rationale: எபிரெயத் தனிப்பெயரின் மரபான தமிழ் ஒலிபெயர்ப்பு.
- source_word: לְמֶלֶךְ עַל אֲרָם
  choice: அராமின் அரசனாக
  rationale: அரசராக நியமிக்கும் பொருளை இயல்பான தமிழில் தருகிறது; பிற்காலப் பெயரான ‘சிரியா’ என்பதற்குப் பதிலாக எபிரெயப் பெயரான ‘அராம்’ காக்கப்படுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக இருப்பதால், அதை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- issue: משח என்ற வினையின் நியமனப் பொருள்
  choice: அரசனாக அபிஷேகம் செய்
  alternative: அரசனாக நியமி
  rationale: அரச நியமனம் சூழலில் உட்பொருளாக இருந்தாலும், மூலத்தின் அபிஷேகச் செயலை மறைக்காமல் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கேற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. மூலத்தின் இரு இயக்கக் கட்டளைகளும் அபிஷேக மொழியும் காக்கப்பட்டுள்ளன; அடிக்குறிப்புக் குறிகள் அவை விளக்கும் சொற்களோடு நேரடியாக இணைக்கப்பட்டுள்ளன.
