source:
  edition: WLC
  text: וְ/הֽוּא הָלַ֤ךְ בַּ/מִּדְבָּר֙ דֶּ֣רֶךְ י֔וֹם וַ/יָּבֹ֕א וַ/יֵּ֕שֶׁב תַּ֖חַת רֹ֣תֶם אחת וַ/יִּשְׁאַ֤ל אֶת נַפְשׁ/וֹ֙ לָ/מ֔וּת וַ/יֹּ֣אמֶר רַ֗ב עַתָּ֤ה יְהוָה֙ קַ֣ח נַפְשִׁ֔/י כִּֽי לֹא ט֥וֹב אָנֹכִ֖י מֵ/אֲבֹתָֽ/י־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/004.yaml
  text: But he himself went a day's journey into the wilderness[a], and came and sat down under a broom tree. And he asked that he might die, and said, “It is enough; now, Yahweh, take my life[b], for I am no better than my fathers.”
translation:
  language: ta
  text: ஆனால் அவர் பாலைநிலத்துக்குள் ஒரு நாள் பயணத் தொலைவு சென்று, ஒரு சூரைச் செடியின்[a] கீழே வந்து உட்கார்ந்தார். தாம் சாக வேண்டும் என்று வேண்டிக்கொண்டு, “போதும்! யாவே[b], இப்போது என் உயிரை எடுத்துக்கொள்ளுங்கள்; ஏனெனில் நான் என் முன்னோர்களைவிடச் சிறந்தவன் அல்ல” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல் பாலைவனத்தில் வளரும் ‘broom’ வகைப் புதர் அல்லது சிறு மரத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘யாவே’ என்பது எபிரெய மொழியில் தேவனுடைய தனிப்பெயர்; பல மொழிபெயர்ப்புகள் இதை ‘கர்த்தர்’ அல்லது ‘ஆண்டவர்’ என்று வழங்குகின்றன.
    reason: alternative_reading
lexical_decisions:
- source_word: בַּמִּדְבָּר
  choice: பாலைநிலத்துக்குள்
  rationale: מִדְבָּר என்பது மக்கள் குடியிருப்பு குறைந்த வறண்ட வனாந்தரப் பகுதியைக் குறிக்கிறது; இயக்கத்தைக் காட்டும் הָלַךְ உடன் ‘பாலைநிலத்துக்குள்’ இயல்பாக அமைகிறது.
- source_word: דֶּרֶךְ יוֹם
  choice: ஒரு நாள் பயணத் தொலைவு
  rationale: இது வெறும் கால அளவை அல்ல, ஒரு நாளில் பயணம் செய்யக்கூடிய தொலைவைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
- source_word: רֹתֶם אַחַת
  choice: ஒரு சூரைச் செடி
  rationale: רֹתֶם பாலைவனத்தில் வளரும் broom வகைப் புதரைக் குறிக்கிறது. தமிழில் அறிமுகமான ‘சூரைச் செடி’ பயன்படுத்தப்பட்டு, தாவரவியல் தன்மை அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
- source_word: וַיִּשְׁאַל אֶת־נַפְשׁוֹ לָמוּת
  choice: தாம் சாக வேண்டும் என்று வேண்டிக்கொண்டு
  rationale: சொல்லுக்குச் சொல் அமைப்பில் ‘தன் உயிர் சாகும்படி கேட்டார்’ என்றாலும், சூழலில் அவர் தனக்காக மரணத்தை வேண்டினார் என்பதே பொருள்; தமிழில் இயல்பாகவும் தெளிவாகவும் தரப்பட்டுள்ளது.
- source_word: רַב עַתָּה
  choice: போதும்! … இப்போது
  rationale: רַב இங்கு ‘போதும்’ என்ற உணர்ச்சிமிக்க கூற்றாகவும், עַתָּה தனியே ‘இப்போது’ என்றும் எடுத்துக்கொள்ளப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இஸ்ரவேலின் தேவனுடைய தனிப்பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டமாக மாற்றாமல் தமிழ் ஒலிபெயர்ப்பில் தருகிறது.
- source_word: קַח נַפְשִׁי
  choice: என் உயிரை எடுத்துக்கொள்ளுங்கள்
  rationale: இந்தச் சூழலில் נֶפֶשׁ என்பது உடலிலிருந்து தனியான ‘ஆத்துமா’ பற்றிய கோட்பாட்டுச் சொல்லாக அல்லாமல் உயிரைக் குறிக்கிறது.
- source_word: כִּי לֹא־טוֹב אָנֹכִי מֵאֲבֹתָי
  choice: ஏனெனில் நான் என் முன்னோர்களைவிடச் சிறந்தவன் அல்ல
  rationale: מִן ஒப்பீட்டைக் குறிக்கிறது; אֲבֹתַי என்பதன் நேரடி வடிவம் ‘என் தந்தையர்’ என்றாலும், இங்கு முன்னோர் அல்லது முந்தைய தலைமுறையினரைச் சுட்டும் இயல்பான தமிழ்ச் சொல் தேர்ந்தெடுக்கப்பட்டுள்ளது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / ஆண்டவர்
  rationale: மூலத்தில் பொதுப்பட்டம் அல்ல, உடன்படிக்கையின் தேவனுடைய தனிப்பெயர் நேரடியாக இடம்பெறுகிறது. அதனால் பெயரின் தன்மை முதன்மை உரையில் பாதுகாக்கப்பட்டு, வாசகருக்கான விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: נֶפֶשׁ என்பதன் பொருள்
  choice: உயிர்
  alternative: ஆத்துமா
  rationale: எலியா மரணத்தை வேண்டுகின்ற உடனடிச் சூழலில் இச்சொல் அவரது உயிரையே குறிக்கிறது; ‘ஆத்துமா’ என்பது மூலத்தில் இங்கு அவசியப்படுத்தப்படாத மானிடவியல் விளக்கத்தைச் சேர்க்கக்கூடும்.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் இறைவனை நோக்கிய உரைக்கு ஏற்ற மரியாதையுடனும் மொழியாக்கப்பட்டுள்ளது. ‘எடுத்துக்கொள்ளுங்கள்’ என்பது பழைய ‘எடுத்துக்கொள்ளும்’ வடிவத்தைவிட இன்றைய வாசகருக்கு இயல்பான மரியாதைப் பன்மை. எலியாவின் மனச்சோர்வும் கூற்றின் திடீர்மையும் ‘போதும்!’ என்பதில் பாதுகாக்கப்பட்டுள்ளன.
