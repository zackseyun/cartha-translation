  source_fidelity: 'மூல எபிரெயத்தின் முக்கிய கூறுகள் அனைத்தும் துல்லியமாகக் காக்கப்பட்டுள்ளன: பாலைநிலத்துக்குள் ஒரு நாள் பயணத் தொலைவு, ரோத்தேம் எனும் பாலைவனப் புதர்/செடி, தனக்காக மரணத்தை வேண்டுதல், ‘போதும்; இப்போது’ என்ற அவசரக் கூற்று, யாவே என்ற இறைப்பெயர், மற்றும் முன்னோர்களுடனான ஒப்பீடு ஆகியவை பொருளுக்கு ஏற்ப மொழிபெயர்க்கப்பட்டுள்ளன. ‘ஒரு சூரைச் செடி’ என்பது אֶחָת-ன் தனித்த/ஒரு என்ற குறிப்பையும் பாதுகாக்கிறது.'
  naturalness: நடை நவீன நிலையான தமிழில் இயல்பாக உள்ளது. ‘ஒரு நாள் பயணத் தொலைவு’, ‘கீழே வந்து உட்கார்ந்தார்’, ‘போதும்!’ ஆகியவை தெளிவானவை. இறைவனை நோக்கிய ‘எடுத்துக்கொள்ளுங்கள்’ மரியாதை வடிவம் தமிழில் பொருத்தமானது.
