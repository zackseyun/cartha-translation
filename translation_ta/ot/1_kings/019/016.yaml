source:
  edition: WLC
  text: וְ/אֵת֙ יֵה֣וּא בֶן נִמְשִׁ֔י תִּמְשַׁ֥ח לְ/מֶ֖לֶךְ עַל יִשְׂרָאֵ֑ל וְ/אֶת אֱלִישָׁ֤ע בֶּן שָׁפָט֙ מֵ/אָבֵ֣ל מְחוֹלָ֔ה תִּמְשַׁ֥ח לְ/נָבִ֖יא תַּחְתֶּֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/016.yaml
  text: And you shall anoint Jehu son of Nimshi as king over Israel[a], and Elisha son of Shaphat from Abel-meholah you shall anoint as prophet in your place.
translation:
  language: ta
  text: நிம்ஷியின் மகன் யெகூவை இஸ்ரயேலின்மேல் அரசனாக அபிஷேகம் செய்ய வேண்டும்; ஆபேல்-மெகொலாவைச் சேர்ந்த சாப்பாத்தின் மகன் எலிசாவை உன் இடத்தில்[a] தீர்க்கதரிசியாக அபிஷேகம் செய்ய வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உனக்குப் பின்” அல்லது “உனக்குப் பதிலாக.” எபிரெயச் சொல் பொறுப்பில் பின்தொடர்வதையோ ஒருவரது இடத்தை ஏற்றுக்கொள்வதையோ குறிக்கலாம்.
    reason: மூலச்சொல்லிலுள்ள பின்தொடர்ச்சி மற்றும் மாற்றீடு என்ற இரு சாத்தியங்களையும் பாதுகாக்கும் சொற்பொருள் மாற்று.
lexical_decisions:
- source_word: תִּמְשַׁח
  choice: அபிஷேகம் செய்ய வேண்டும்
  rationale: משׁח என்பதன் Qal imperfect இரண்டாம் நபர் ஆண்பால் ஒருமை வடிவம் இங்கு நியமனக் கட்டளையாகச் செயல்படுகிறது. ‘அபிஷேகம் செய்ய வேண்டும்’ என்பது அந்தக் கட்டளை வலிமையையும் நவீனத் தமிழின் இயல்பையும் காக்கிறது.
- source_word: לְמֶלֶךְ
  choice: அரசனாக
  rationale: לְ முன்னொட்டு இங்கு ஒருவரை ஓர் அதிகாரப் பொறுப்புக்கு நியமிப்பதைக் குறிக்கிறது; தமிழில் ‘அரசனாக’ என்பது இயல்பான வெளிப்பாடு.
- source_word: עַל יִשְׂרָאֵל
  choice: இஸ்ரயேலின்மேல்
  rationale: עַל என்பது இங்கு ஒரு மக்கள்மீது செலுத்தப்படும் அரச அதிகாரத்தைக் குறிக்கிறது; ‘இஸ்ரயேலின்மேல்’ அந்த உறவை முறையாகப் பாதுகாக்கிறது.
- source_word: מֵאָבֵל מְחוֹלָה
  choice: ஆபேல்-மெகொலாவைச் சேர்ந்த
  rationale: מִן முன்னொட்டு பிறப்பிடம் அல்லது ஊர்ச் சார்பைக் குறிக்கிறது. தமிழில் ‘சேர்ந்த’ என்பது அந்தத் தொடர்பைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: לְנָבִיא
  choice: தீர்க்கதரிசியாக
  rationale: לְ இங்கு தீர்க்கதரிசிப் பணிக்கு நியமிப்பதைக் குறிக்கிறது; ‘தீர்க்கதரிசியாக’ என்பது பொறுப்புநிலையைத் தெளிவுபடுத்துகிறது.
- source_word: תַּחְתֶּיךָ
  choice: உன் இடத்தில்
  rationale: תחת என்பது ஒருவரது இடத்தை ஏற்றல், அவருக்குப் பின் வருதல், அல்லது அவருக்குப் பதிலாகச் செயல்படுதல் ஆகிய நிழற்பொருள்களைக் கொண்டிருக்கலாம். ‘உன் இடத்தில்’ அந்தத் திட்டமிட்ட தெளிவின்மையை ஓரளவு காக்கிறது.
- source_word: בֶן
  choice: மகன்
  rationale: தந்தைவழி அடையாளத்தை மூல உரைப்படியே தெளிவாகப் பாதுகாக்கிறது.
- source_word: וְאֵת ... וְאֶת
  choice: இரு இணையான வாக்கியக் கூறுகளாக அமைத்தல்
  rationale: אֵת நேரடிப் பொருள் குறியீடு தமிழில் தனியாக மொழிபெயர்க்கப்படாது; וְ இணைக்கும் இரண்டு நியமனக் கட்டளைகளும் அரைப்புள்ளியால் தெளிவாக இணைக்கப்பட்டுள்ளன.
theological_decisions:
- issue: תַּחְתֶּיךָ என்பதில் எலியாவுக்கும் எலிசாவுக்கும் இடையிலான உறவு
  choice: எலிசா எலியாவின் தீர்க்கதரிசிப் பொறுப்பை ஏற்க நியமிக்கப்படுகிறார் என்பதைக் ‘உன் இடத்தில்’ என வழங்குதல்
  alternative: ‘உனக்குப் பின்’ எனக் கால வரிசையை வலியுறுத்துதல், அல்லது ‘உனக்குப் பதிலாக’ என மாற்றீட்டை வலியுறுத்துதல்
  rationale: மூலச்சொல் பின்தொடர்ச்சி மற்றும் மாற்றீடு ஆகிய இரு நிழற்பொருள்களையும் அனுமதிக்கிறது. ‘உன் இடத்தில்’ என்பது தீர்க்கதரிசிப் பொறுப்பு கைமாறுவதைச் சுட்டினாலும், அது திடீர் நீக்கம் அல்லது வெறும் கால வரிசை என்ற எந்த ஒரு விளக்கத்தையும் கட்டாயப்படுத்துவதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையிலும் அமைக்கப்பட்டுள்ளது. பெயர்கள் தமிழில் பரவலாக அறியப்பட்ட வேதாகம ஒலிபெயர்ப்பு மரபைப் பின்பற்றுகின்றன; கட்டளையின் வலிமைக்காக ‘செய்ய வேண்டும்’ என்ற வடிவம் இருமுறை பாதுகாக்கப்பட்டுள்ளது.
